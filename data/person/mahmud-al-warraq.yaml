summary:
  ar: "صاحب جارية طلبها المعتصم بسبعة آلاف دينار فامتنع من بيعها، وبعد وفاته اشتريت من التركة بسبعمائة دينار. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 22}"
  en: "Owner of a slave-girl that al-Mu'tasim wanted for 7,000 dinars; he refused to sell, and after his death she was bought from the estate for 700. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 22}"
  ur: "ایک لونڈی کے مالک؛ معتصم نے اسے 7000 دینار میں مانگا، انہوں نے انکار کیا، اور ان کی وفات کے بعد وہ ترکے سے 700 دینار میں خریدی گئی۔ {cite:nihayat-al-arab-nuwayri-vol4-scan p. 22}"
  es: "Dueño de una esclava que al-Mu'tasim quería por 7.000 dinares; se negó a venderla, y tras su muerte fue comprada a la herencia por 700. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 22}"
  fr: "Le propriétaire d'une esclave qu'al-Mu'tasim voulait pour 7 000 dinars refusa de la vendre, et après sa mort, elle fut rachetée à sa succession pour 700 dinars. {cite:nihayat-al-arab-nuwayri-vol4-scan p. 22}"
  tr: "Bir köle kızı vardı, al-Mu'tasim ona yedi bin dinar istedi ama satmayı reddetti. Ölümünden sonra, malikaneyi yedi yüz dinara satın aldı. {cite:nihayat-al-arab-nuwayri-vol4-scan s. 22}"
  id: "Dia memiliki seorang gadis budak yang diminta al-Mu'tasim tujuh ribu dinar, tetapi dia menolak menjualnya. Setelah kematiannya, dia membeli tanah itu seharga tujuh ratus dinar. {cite:nihayat-al-arab-nuwayri-vol4-scan hlm. 22}"
