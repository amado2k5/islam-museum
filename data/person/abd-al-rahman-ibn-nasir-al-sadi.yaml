summary:
  ar: "عبد الرحمن بن ناصر بن عبد الله بن سعدي (1307–1376هـ)، عالم نجدي من عنيزة، صاحب التفسير المشهور «تيسير الكريم الرحمن في تفسير كلام المنان» الذي بدأه سنة 1342هـ، وشيخ عبد الله بن عقيل ومحمد بن صالح العثيمين."
  en: "Abd al-Rahman ibn Nasir ibn Abd Allah ibn Sa'di (1307–1376 AH / 1889–1957), a Najdi scholar of Unayza, author of the widely read commentary Taysir al-Karim al-Rahman fi Tafsir Kalam al-Mannan, begun in 1342 AH, and teacher of Abd Allah ibn Aqil and Muhammad ibn Salih al-Uthaymin."
  ur: "عبد الرحمن بن ناصر بن عبد اللہ بن سعدی (1307–1376ھ / 1889–1957ء)، عنیزہ کے نجدی عالم، مشہور تفسیر «تیسیر الکریم الرحمن فی تفسیر کلام المنان» کے مصنف جو انہوں نے 1342ھ میں شروع کی، اور عبد اللہ بن عقیل اور محمد بن صالح العثیمین کے استاد۔"
