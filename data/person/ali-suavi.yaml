    note: "No source read names a school for Suavi personally. The English article calls him a theologian and reformer who preached at the Sehzade Mosque and contributed to the pan-Islamist Basiret, and the Turkish article tells that he performed the Hajj with his father at seventeen, took Islam as his reference, and argued for reform in religion and for the khutba in each nation's own tongue - practice, office and published positions, none of which names a madhhab for the man himself. His works on Abu Hanifa's counsels and his translation of Ghazali are repertoire, not attestation. Wikidata's only religion value is Islam (Q432), generic, naming no school, and one structured-data family never suffices on its own."
