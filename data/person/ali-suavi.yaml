summary:
  ar: "صحفي ومربٍّ ومصلح ديني عثماني (1839–1878)، من العثمانيين الشباب، حرّر «مخبر» في لندن ودعا إلى إصلاح ديني وقراءة الخطبة بلغة كل قوم، وقُتل وهو يقتحم قصر جراغان ليعيد مراد الخامس إلى العرش."
  en: "Ottoman journalist, educator and religious reformer (1839-1878), a Young Ottoman who edited Muhbir in London, preached at the Sehzade Mosque, argued for religious reform and for the khutba in each nation's own language, and was killed raiding Ciragan Palace to restore Murad V."
