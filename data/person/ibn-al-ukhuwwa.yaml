summary:
  ar: "محمد بن محمد بن أحمد القرشي، المعروف بابن الأخوة، صاحب كتاب معالم القربة في أحكام الحسبة. يذكر محققا الكتاب أنه توفي سنة 729هـ {cite:maalim-qurba-edition-1976 p.6}."
  en: "Muhammad ibn Muhammad ibn Ahmad al-Qurashi, known as Ibn al-Ukhuwwa, author of Maʿalim al-Qurba fi Ahkam al-Hisba. The editors give his death as 729 AH {cite:maalim-qurba-edition-1976 p.6}."
  es: "Muhammad ibn Muhammad ibn Ahmad al-Qurashi, conocido como Ibn al-Ukhuwwa, autor de Maʿalim al-Qurba fi Ahkam al-Hisba. Los editores dan su muerte en 729 AH {cita:maalim-qurba-edition-1976 p.6}."
  fr: "Muhammad ibn Muhammad ibn Ahmad al-Qurashi, connu sous le nom d'Ibn al-Ukhuwwa, auteur de Maʿalim al-Qurba fi Ahkam al-Hisba. Les éditeurs donnent sa mort à 729 AH {cite: maalim-qurba-edition-1976 p.6}."
  ur: "محمد بن محمد بن احمد القرشی، ابن الخوع کے نام سے مشہور، معلم القربا فی احکام الحسبہ کے مصنف۔ مدیران نے ان کی وفات 729 ہجری بتائی ہے۔"
  tr: "Muhammed bin Muhammed ibn Ahmed el-Kurashi, İbn el-İhva olarak bilinir, Ma'alim al-Qurbah fi Ahkam al-Hisbah kitabının yazarıdır. Kitabın editörleri onun 729 Hicri yılında öldüğünü belirtir {cite:maalim-qurba-edition-1976 s.6}."
  id: "Muhammad ibn Muhammad ibn Ahmad al-Qurashi, dikenal sebagai Ibn al-Ikhwa, penulis buku Ma'alim al-Qurbah fi Ahkam al-Hisbah. Para editor buku tersebut menyebutkan bahwa ia meninggal pada tahun 729 H {cite:maalim-qurba-edition-1976 hlm.6}."
