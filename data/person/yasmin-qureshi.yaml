summary:
  ar: "سياسية ومحامية بريطانية من حزب العمال، وُلدت في غوجرات بالبنجاب سنة 1963 وانتقلت إلى بريطانيا في التاسعة. درست القانون في جامعة لندن ساوث بانك وكلية لندن الجامعية، وعملت محامية ادعاء، ثم ترأست القسم القانوني الجنائي في بعثة الأمم المتحدة في كوسوفو وأدارت إدارة القضاء فيها، وانتُخبت سنة 2010 نائبة عن بولتون الجنوبية الشرقية ضمن أوائل النائبات المسلمات في بريطانيا وأول امرأة عن تلك الدائرة، وتمثل منذ 2024 دائرة بولتون الجنوبية ووالكدين، وقادت لسنوات حملة برلمانية في قضية عقار بريمودوس."
  en: "British Labour Party politician and barrister, born at Gujrat, Punjab, in 1963, who moved to Britain at nine. She studied law at London South Bank University and University College London, practised as a Crown Prosecution Service barrister, headed the criminal legal section of the UN Mission in Kosovo and directed its Department of Judicial Administration, was elected MP for Bolton South East in 2010 as one of Britain's first female Muslim MPs and the first woman elected for that seat, has represented Bolton South and Walkden since 2024, and has led a long parliamentary campaign over the Primodos pregnancy test."
  ur: "برطانوی لیبر پارٹی کی سیاست دان اور بیرسٹر، جو 1963 میں پنجاب کے گجرات میں پیدا ہوئیں اور نو برس کی عمر میں برطانیہ منتقل ہوئیں۔ انھوں نے لندن ساؤتھ بینک یونیورسٹی اور یونیورسٹی کالج لندن سے قانون پڑھا، کراؤن پراسیکیوشن سروس میں بیرسٹر رہیں، پھر کوسوو میں اقوامِ متحدہ کے مشن کے فوجداری قانونی شعبے کی سربراہ اور اس کے محکمۂ انتظامیہِ عدلیہ کی ڈائریکٹر بنیں، 2010 میں بولٹن ساؤتھ ایسٹ سے منتخب ہو کر برطانیہ کی پہلی مسلم خواتین ارکان میں شامل ہوئیں اور اس حلقے کی پہلی خاتون ایم پی بنیں، 2024 سے بولٹن ساؤتھ اینڈ واکڈن کی نمائندگی کرتی ہیں، اور پریموڈوس قضیے پر طویل پارلیمانی مہم چلاتی رہی ہیں۔"
