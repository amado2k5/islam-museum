summary:
  ar: "مدّاح إيراني من زنجان، وُلد فيها سنة 1988 ويرأس هيئة ثار الله فيها، ويقرأ بالفارسية والعربية والتركية الأذرية؛ وصفه موقع «ميدل إيست آي» بأنه من أبرز المنشدين الدينيين في إيران، وبلغ حسابه الموثّق على إنستغرام 1,546,790 متابعًا في نوفمبر 2026 عند قراءته على المنصة."
  en: "Iranian maddah (eulogist) from Zanjan, born there in 1988, who leads the city's Tharallah hey'at and recites in Persian, Arabic and Azerbaijani Turkish; Middle East Eye has described him as among the most prominent religious singers in Iran, and his verified Instagram account counted 1,546,790 followers in November 2026 when read on the platform."
  ur: "زنجان سے تعلق رکھنے والے ایرانی مداح، جو 1988ء میں وہیں پیدا ہوئے اور شہر کی ہیئت ثاراللہ کے سربراہ ہیں؛ وہ فارسی، عربی اور آذربائیجانی ترکی میں پڑھتے ہیں، اور ان کے تصدیق شدہ انسٹاگرام اکاؤنٹ کے فالوور نومبر 2026ء میں پلیٹ فارم پر پڑھنے پر 1,546,790 تھے۔"
