summary:
  ar: "الحسين بن عبد الله الثاني (وُلد 28 يونيو 1994) ولي عهد المملكة الأردنية الهاشمية منذ 2 يوليو 2009، وهو أكبر أبناء الملك عبد الله الثاني والملكة رانيا. وُلد في عمّان، وتخرّج في جامعة جورجتاون سنة 2016 وفي أكاديمية ساندهيرست العسكرية سنة 2017، ويخدم ضابطًا في القوات المسلحة الأردنية. صار سنة 2015 أصغر من ترأّس جلسة لمجلس الأمن الدولي، ويرأس مؤسسة ولي العهد ومبادراتها في التقنية والتعليم والعمل التطوعي."
  en: "Hussein bin Abdullah (born 28 June 1994) is Crown Prince of the Hashemite Kingdom of Jordan since 2 July 2009, the eldest son of King Abdullah II and Queen Rania. Born in Amman, he graduated from Georgetown University in 2016 and from the Royal Military Academy Sandhurst in 2017, and serves as an officer in the Jordanian Armed Forces. In 2015 he became the youngest person to chair a session of the UN Security Council, and he heads the Crown Prince Foundation and its technology, education and volunteer initiatives."
  ur: "حسین بن عبد اللہ دوم (پیدائش 28 جون 1994ء) 2 جولائی 2009ء سے اردن کے ولی عہد ہیں، بادشاہ عبد اللہ دوم اور ملکہ رانیا کے سب سے بڑے بیٹے۔ عمان میں پیدا ہوئے، 2016ء میں جارج ٹاؤن یونیورسٹی اور 2017ء میں سینڈہرسٹ سے فارغ ہوئے اور اردنی فوج میں افسر ہیں۔ 2015ء میں وہ اقوامِ متحدہ کی سلامتی کونسل کے اجلاس کی صدارت کرنے والے کم عمر ترین فرد بنے۔"
