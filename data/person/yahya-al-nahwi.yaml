label: { ar: "يحيى النحوي", en: "Yahya Al Nahwi", es: "Yahya Al Nahwi", fr: "Yahya Al Nahwi", ur: "یحییٰ النحوی" }
summary:
  ar: "يحيى النحوي كان تلميذ ساوارى وكان أسقفا في بعض الكنائس بمصر ويعتقد مذهب النصارى اليعاقبة ثم رجع عما يعتقده النصارى في التثليث فاجتمعت الأساقفة وناظرته فغلبهم واستعطفوه وآنسوه وسألوه الرجوع عما هو عليه وترك إظهاره فأقام على ما كان عليه وأبى أن يوجع فأسقطوه، وعاش إلى أن فتحت مصر على يدي عمرو بن العاص فدخل إليه وأكرمه ورأى له موضعا، وله كتاب الرد على برقلس ثمان عشرة مقالة وكتاب الرد على أرسطاليس ست مقالات وكتاب في أن كل جسم متناه فقوته متناهية، وذكر في تفسيره للسماع الطبيعي مثالا سنة ثلاث وأربعين وثلاثمائة لدقلاطيانوس {cite:fihrist-ibn-al-nadim p. 356-357}."
  en: "John Philoponus — the Jacobite bishop who argued against the Trinity and lived to meet Amr ibn al-As {cite:fihrist-ibn-al-nadim}"
  es: "Juan Filopono — el obispo jacobita que argumentó en contra de la Trinidad y vivió para conocer a Amr ibn al-As {cite:fihrist-ibn-al-nadim}"
  fr: "Jean Philoponus — l'évêque jacobite qui s'opposa à la Trinité et vécut jusqu'à rencontrer Amr ibn al-As {cite:fihrist-ibn-al-nadim}"
  ur: "جان فیلوپونس - جیکبائٹ بشپ جس نے تثلیث کے خلاف بحث کی اور عمرو ابن العاص سے ملنے کے لیے رہتے تھے۔"
  tr: "Dilbilimci Yahya, Sawari'nin öğrencisiydi ve Mısır'daki bazı kiliselerde piskoposluk yaptı. Yakobit Hristiyan doktrinine inanıyordu, ancak daha sonra Hristiyanların Teslis'e olan inançlarını tersine çevirdi. Piskoposlar onunla görüştü, tartıştılar, onları aştılar, sempatisini istediler, teselli ettiler ve statüsüne dönmesini istediler, bunu göstermeyi bıraktılar. Olduğu gibi kaldı, incinmeyi reddetti ve devrildi. Mısır, Amr ibn al-As tarafından fethedilene kadar yaşadı; Amr ona girdi, onu onurlandırdı ve ona bir yer verdi. Barclays'a karşı bir çürütme, on sekiz deneme, Aristoteles'e yanıt olarak altı deneme ve her bedenin sonlu ve sonlu güce sahip olduğunu belirten bir kitap yazdı. 343 yılında Diocletianus'un doğal işitme yorumunda bir örnek verdi."
  id: "Yahya sang ahli tata bahasa adalah murid Sawari dan menjadi uskup di beberapa gereja di Mesir. Ia percaya pada doktrin Kristen Jacobite, namun kemudian membalikkan kepercayaan Kristen tentang Tritunggal. Para uskup bertemu dan berdebat dengannya, dan mereka mengatasinya, meminta simpatinya, menghiburnya, dan memintanya kembali ke statusnya dan berhenti menunjukkannya. Ia tetap seperti itu, menolak untuk disakiti, dan digulingkan. Ia hidup hingga Mesir ditaklukkan oleh Amr ibn al-As, yang datang kepadanya, menghormatinya, dan melihat tempat untuknya. Ia menulis bantahan terhadap Barclays, delapan belas esai, enam esai sebagai tanggapan terhadap Aristoteles, dan sebuah buku yang menyatakan bahwa setiap tubuh itu terbatas dan memiliki kekuatan terbatas. Ia mengutip contoh dalam interpretasinya tentang pendengaran alami pada tahun 343 oleh Diocletianus."
