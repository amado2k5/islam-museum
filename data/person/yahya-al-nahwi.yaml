id: person/yahya-al-nahwi
class: person
label: { ar: "يحيى النحوي", en: "Yahya Al Nahwi" }
summary:
  ar: "يحيى النحوي كان تلميذ ساوارى وكان أسقفا في بعض الكنائس بمصر ويعتقد مذهب النصارى اليعاقبة ثم رجع عما يعتقده النصارى في التثليث فاجتمعت الأساقفة وناظرته فغلبهم واستعطفوه وآنسوه وسألوه الرجوع عما هو عليه وترك إظهاره فأقام على ما كان عليه وأبى أن يوجع فأسقطوه، وعاش إلى أن فتحت مصر على يدي عمرو بن العاص فدخل إليه وأكرمه ورأى له موضعا، وله كتاب الرد على برقلس ثمان عشرة مقالة وكتاب الرد على أرسطاليس ست مقالات وكتاب في أن كل جسم متناه فقوته متناهية، وذكر في تفسيره للسماع الطبيعي مثالا سنة ثلاث وأربعين وثلاثمائة لدقلاطيانوس {cite:fihrist-ibn-al-nadim p. 356-357}."
  en: "John Philoponus — the Jacobite bishop who argued against the Trinity and lived to meet Amr ibn al-As {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
