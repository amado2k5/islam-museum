summary:
  ar: "كين بلانشارد مؤلف كتاب «المدير بدقيقة واحدة» (The One Minute Manager)؛ درس عنده طارق السويدان ويصفه بأنه لطيف يحتضن الشباب، وشارك وليم أونكن تأليف كتاب The One Minute Manager Meets the Monkey."
  en: "Kenneth Blanchard, author of The One Minute Manager, under whom Tareq al-Suwaidan studied and whom he describes as kind and encouraging to youth; he co-authored The One Minute Manager Meets the Monkey with William Oncken."
  ur: "کین بلانچارڈ، کتاب The One Minute Manager کا مصنف، جس کے ہاں طارق السویدان نے تعلیم لی اور جسے وہ جوانوں کا حامی خوش اخلاق بتاتے ہیں؛ اس نے ولیم اونکن کے ساتھ The One Minute Manager Meets the Monkey لکھی۔"
  es: "Kenneth Blanchard, autor de El gerente al minuto, con quien Tareq al-Suwaidan estudió y a quien describe como amable y alentador con los jóvenes; fue coautor de El gerente al minuto conoce al mono junto con William Oncken."
  fr: "Kenneth Blanchard, auteur de « The One Minute Manager », sous la direction duquel Tareq al-Suwaidan a étudié et qu'il décrit comme bienveillant et encourageant envers les jeunes; il a co-écrit « The One Minute Manager Meets the Monkey » avec William Oncken."
  tr: "Ken Blanchard, \"The One Minute Manager\" adlı kitabın yazarıdır; Tariq Al-Suwaidan onunla çalıştı ve onu nazik, gençliği kucaklayan biri olarak tanımladı. William Onken, The One Minute Manager Meets the Monkey kitabının ortak yazarıdır."
  id: "Ken Blanchard adalah penulis buku \"The One Minute Manager\"; Tariq Al-Suwaidan belajar dengannya dan menggambarkannya sebagai sosok yang baik hati dan merangkul masa muda. William Onken ikut menulis The One Minute Manager Meets the Monkey."
