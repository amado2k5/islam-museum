summary:
  ar: "فلكي أندلسي من طليطلة (1029–1100)، نشأ صانع آلات ونقّاشًا، وعمل منذ 1048 في فريق صاعد الأندلسي للمأمون الطليطلي ثم للمعتمد الإشبيلي. أتقن الصفيحة الجامعة (الصفيحة الزرقالية) التي حملت اسمه وبقيت أداة الملاحين حتى القرن السادس عشر، وساهم في أزياج طليطلة وصحّح زيج الخوارزمي، وأثبت لأول مرة حركةَ أوج الشمس بمقدار قريب من القيمة الحديثة، وقلّص عرض البحر المتوسط في الجغرافيا البطلمية من 62 درجة إلى 42."
  en: "Toledan astronomer (1029-1100) who began as a metalsmith and engraver of instruments - his nickname al-Naqqash, 'the engraver', is the origin of his Latin name Arzachel - and worked from 1048 in Sa'id al-Andalusi's team for al-Ma'mun of Toledo and al-Mu'tamid of Seville. He perfected the universal astrolabe plate that bears his name, the safiha zarqaliyya, used by navigators into the 16th century; contributed to the Toledan Tables and revised al-Khwarizmi's; and was the first to demonstrate the motion of the solar apogee, at 12.04 arc-seconds a year against the modern 11.77. When Alfonso VI took Toledo in 1085 he fled the city."
  ur: "طلیطلہ کے ماہر فلکیات (1029ء–1100ء)، آغاز میں دھاتی آلات کے کندہ کار تھے — یہی لقب «النقاش» ان کے لاطینی نام Arzachel کی اصل ہے — اور 1048ء سے صاعد الاندلسی کے گروہ میں مامونِ طلیطلہ اور معتمدِ اشبیلیہ کے لیے کام کیا۔ انھوں نے جامع اسطرلابی تختی «صفیحہ زرقالے» کو مکمل کیا جو سولہویں صدی تک ملاحوں کے کام آتی رہی، ازیاجِ طلیطلہ میں حصہ لیا، خوارزمی کے زیج کی تصحیح کی، اور اوجِ شمس کی حرکت کو سب سے پہلے ثابت کیا۔"

