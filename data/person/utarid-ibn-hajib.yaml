summary:
  en: "The orator at the head of the Banu Tamim notables who came to the Prophet in 9 AH; he boasted of his people as kings of the East, Thabit ibn Qays ibn Shammas answered him, and al-Aqra' ibn Habis judged the Muslims' orator superior, whereupon the delegation accepted Islam."
  ar: "خطيب وفد بني تميم ورأسه سنة 9هـ؛ قدم في أشراف قومه على النبي فنادوه من وراء حجراته، ثم خطب يفخر بأن قومه ملوك وأعز أهل المشرق، فأجابه ثابت بن قيس بن الشماس خطيب الأنصار، وقال الأقرع بن حابس: خطيبه أخطب من خطيبنا، فأسلموا."
