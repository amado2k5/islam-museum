summary:
  en: "The orator at the head of the Banu Tamim notables who came to the Prophet in 9 AH; he boasted of his people as kings of the East, Thabit ibn Qays ibn Shammas answered him, and al-Aqra' ibn Habis judged the Muslims' orator superior, whereupon the delegation accepted Islam."
  ar: "خطيب وفد بني تميم ورأسه سنة 9هـ؛ قدم في أشراف قومه على النبي فنادوه من وراء حجراته، ثم خطب يفخر بأن قومه ملوك وأعز أهل المشرق، فأجابه ثابت بن قيس بن الشماس خطيب الأنصار، وقال الأقرع بن حابس: خطيبه أخطب من خطيبنا، فأسلموا."
  ur: "9 ہجری میں نبی کے پاس آئے بنو تمیم کے سرداروں کا قائد خطیب؛ اس نے اپنے قوم کو مشرق کے بادشاہ کہہ کر فخر کیا۔"
  es: "El orador que encabezaba la delegación de notables de Banu Tamim que acudieron al Profeta en el año 9 de la Hégira se jactó de que su pueblo era rey del Oriente. Thabit ibn Qays ibn Shammas le respondió, y al-Aqra' ibn Habis consideró superior al orador de los musulmanes, tras lo cual la delegación aceptó el Islam."
  fr: "L'orateur à la tête des notables Banu Tamim venus trouver le Prophète en 9 AH; il se vanta de son peuple comme rois de l'Orient, Thabit ibn Qays ibn Shammas lui répondit, et al-Aqra' ibn Habis jugea l'orateur des musulmans supérieur, sur quoi la délégation accepta l'Islam."
  tr: "Banu Tamim heyetinin vaizi ve lideri 9 Hicri yılında; halkının soyluları arasından Peygamber'e geldi, Peygamber onu odasının arkasından çağırdı. Sonra halkının kral ve Doğu halkının en saygın insanları olduğunu övünerek bir vaaz verdi. Ensar'ın vaizi Tebit ibn Kays ibn el-Şamas cevap verdi ve El-Aqra' ibn Habis şöyle dedi: Onun vaibi bizimkinden daha etkili konuşuyordu, bu yüzden İslam'ı benimsediler."
  id: "Pengkhotbah delegasi Banu Tamim dan pemimpinnya pada tahun 9 H; ia datang di antara bangsawan kaumnya kepada Nabi, yang memanggilnya dari balik kamarnya. Kemudian ia memberikan khotbah yang membanggakan bahwa rakyatnya adalah raja dan yang paling dihormati di antara rakyat Timur. Thabit ibn Qays ibn al-Shamas, pengkhotbah Ansar, menjawab, dan Al-Aqra' ibn Habis berkata: Pengkhotbahnya lebih fasih daripada kami, sehingga mereka memeluk Islam."
