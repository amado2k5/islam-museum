summary:
  en: "The orator whom the chiefs of Banu Tamim put forward in the boasting contest at the Prophet's mosque in 9 AH; Thabit ibn Qays ibn Shammas answered him, and al-Aqra' ibn Habis judged the Muslims' orator superior — whereupon the delegation accepted Islam."
  ar: "خطيب وفد بني تميم العشرة الذين قدموا المدينة إثر سرية عيينة سنة 9هـ؛ قدّموه للمفاخرة فأجابه ثابت بن قيس بن شماس خطيب الإسلام، فقال الأقرع بن حابس: خطيبه أخطب من خطيبنا، فأسلموا."
