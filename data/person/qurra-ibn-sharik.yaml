kids:
  ar: "قرة بن شريك كان حاكم مصر قبل أكثر من ألف سنة، وأعاد بناء مسجد عمرو بن العاص وأصلح أراضي المزارعين."
  en: "Qurra ibn Sharik ruled Egypt for the caliph more than a thousand years ago, rebuilt the mosque of Amr ibn al-As and helped bring unused land back to farmers."
  ur: "قرہ بن شریک ہزار سال سے زیادہ پہلے خلیفہ کی طرف سے مصر کے حاکم تھے، انہوں نے مسجد عمرو بن العاص دوبارہ بنوائی اور بنجر زمینیں کاشت کاروں کو لوٹانے میں مدد دی۔"
