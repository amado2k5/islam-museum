summary:
  ar: "قرة بن شريك بن مرثد بن حازم العبسي الغطفاني، والي مصر للخليفة الأموي الوليد بن عبد الملك من سنة 90 إلى 96هـ/709 إلى 714م، وهو من عرب الشام الشماليين من ناحية قنسرين. أعاد بناء جامع عمرو بن العاص في الفسطاط، وعمل على إحياء الأراضي الموات، وأعاد تنظيم دواوين مصر سنة 95هـ، وتوفي بالطاعون وهو في منصبه. وتذكر دائرة المعارف الإسلامية أن البرديات تصحح الصورة الجائرة التي رسمتها له المصادر المتأخرة {cite:encyclopaedia-of-islam-2 vol. 5 p. 538}."
  en: "Qurra ibn Sharik ibn Marthad ibn Hazim al-Absi al-Ghatafani governed Egypt for the Umayyad caliph al-Walid ibn Abd al-Malik from 90 to 96 AH, 709 to 714 CE. A Syrian Arab from the Qinnasrin region, he rebuilt the mosque of Amr ibn al-As at Fustat, worked to bring waste land back into cultivation, reorganised the diwans of Egypt in 95/713-14, and died of plague in office. The Encyclopaedia of Islam notes that the Egyptian papyri correct the harsh picture drawn of him by later chroniclers {cite:encyclopaedia-of-islam-2 vol. 5 p. 538}."
  ur: "قرہ بن شریک بن مرثد بن حازم العبسی الغطفانی اموی خلیفہ ولید بن عبدالملک کی طرف سے 90 تا 96ھ/709 تا 714ء مصر کے والی رہے۔ وہ قنسرین کے علاقے کے شامی عرب تھے۔ انہوں نے فسطاط میں مسجد عمرو بن العاص کو از سر نو تعمیر کیا، بنجر زمینوں کو آباد کرنے کی کوشش کی، 95ھ/713-714ء میں مصر کے دیوان نئے سرے سے ترتیب دیے اور منصب پر رہتے ہوئے طاعون سے فوت ہوئے۔ دائرۃ المعارف الاسلامیہ بتاتا ہے کہ مصری پیپائرس ان کی وہ سخت تصویر درست کرتے ہیں جو بعد کے مؤرخین نے بنائی {cite:encyclopaedia-of-islam-2 vol. 5 p. 538}."
