summary:
  ar: "الشيخ الواحد العارف أبو مدين شعيب بن الحسين الأندلسي شيخ أهل المغرب؛ سكن تلمسان وكان من أهل العمل والاجتهاد منقطع القرين في العبادة والنسك بعيد الصيت، ويسميه الشيخ محيي الدين ابن عربي بشيخ الشيوخ، وتخرج به جماعة من الفضلاء كأبي عبد الله القرشي وانتهى إليه كثير من العلماء المحققين وفضلاء الصالحين كابن عربي؛ طلبه سلطان المغرب فلما وصل إلى تلمسان نزل واستقبل القبلة وتشهد وقال «ها قد جئت، ها قد جئت، وعجلت إليك رب لترضى» فمات ودفن في جبانة العباد وقد قارب الثمانين، وقبره بها مشهور مزور؛ توفي سنة تسعين وخمسمائة {cite:shadharat-dhahab p. 783}."
  en: "The singular gnostic Abu Madyan Shu'ayb b. al-Husayn, shaykh of the Maghrib; he settled at Tlemcen, unmatched in worship and devotion, far-famed — Ibn Arabi calls him 'the shaykh of shaykhs'; among his students Abu Abdallah al-Qurashi, and learned verifiers like Ibn Arabi himself reached him. Summoned by the sultan of the Maghrib, on reaching Tlemcen he sat, faced the qibla, recited the tashahhud, said 'Here I come, here I come, hastening to You, Lord, to please You', and died; buried in the cemetery of worshippers nearing eighty, his grave a well-known shrine; he died in 590 {cite:shadharat-dhahab p. 783}."
  fr: "Le gnostique singulier Abu Madyan Shu'ayb b. al-Husayn, shaykh du Maghreb ; il s'établit à Tlemcen, sans égal dans l'adoration et la dévotion, de grande renommée — Ibn Arabi l'appelle « le shaykh des shaykhs » ; parmi ses élèves, Abu Abdallah al-Qurashi, et des savants vérificateurs comme Ibn Arabi lui-même vinrent à lui. Appelé par le sultan du Maghreb, arrivé à Tlemcen il s'assit, se tourna vers la qibla, récita le tashahhud, dit « Me voici, me voici, je me hâte vers Toi, Seigneur, pour Te satisfaire », et mourut ; enterré au cimetière des dévots à près de quatre-vingts ans, sa tombe est un sanctuaire bien connu ; il mourut en 590 {cite:shadharat-dhahab p. 783}."
  es: "El singular gnóstico Abu Madyan Shu'ayb b. al-Husayn, jeque del Magreb, se estableció en Tremecén, inigualable en culto y devoción, de gran renombre; Ibn Arabi lo llama \"el jeque de los jeques\". Entre sus discípulos se encontraban Abu Abdallah al-Qurashi, y eruditos verificadores como el propio Ibn Arabi llegaron hasta él. Convocado por el sultán del Magreb, al llegar a Tremecén se sentó, se orientó hacia la qibla, recitó el tashahhud, dijo \"Aquí vengo, aquí vengo, apresurándome hacia Ti, Señor, para complacerte\", y murió; fue enterrado en el cementerio de fieles que rondaban los ochenta años, su tumba un conocido santuario; murió en el año 590 {cite:shadharat-dhahab p. 783}."
  ur: "واحد علمی ابو مدین شعیب بن۔ الحسین، مغرب کے شیخ؛ وہ تلمسن میں مقیم ہوا، عبادت اور عقیدت میں بے مثال، بہت مشہور - ابن عربی اسے 'شیخوں کا شیخ' کہتے ہیں۔ ان کے شاگردوں میں ابو عبد اللہ القرشی تھے اور خود ابن عربی جیسے علمی تصدیق کرنے والے ان تک پہنچے تھے۔ مغرب کے سلطان کی طرف سے بلایا گیا، تلمسن پہنچ کر بیٹھ گیا، قبلہ کی طرف منہ کیا، تشہد پڑھا، کہا، میں حاضر ہوں، حاضر ہوں، تیری طرف جلدی کر رہا ہوں، رب، تجھے راضی کرنے کے لیے، اور وفات پا گیا۔ اسّی کے قریب عبادت گزاروں کے قبرستان میں دفن، اس کی قبر ایک معروف مزار ہے۔ ان کی وفات 590ء میں ہوئی۔ 783}۔"
  tr: "Bilgin ve eşsiz Şeyh Ebu Madyan Şuayb bin El-Hüseyin El-Endülüs, Mağrip halkının şeyhi, Tlemcen'de yaşamıştır. İş ve gayret insanı, ibadet ve zühdde emsalsiz ve geniş çapta tanınmış bir kişiydi. Şeyh Muhyiddin İbn Arabi ona Şeyhlerin Şeyhi adını vermiştir. Ebu Abdullah El-Kureşi gibi bir grup erdemli insan ondan yetişmiş, İbn Arabi gibi birçok başarılı alim ve erdemli salih insan da onunla birlikte olmuştur. Mağrip Sultanı onu çağırmış ve Tlemcen'e vardığında atından inmiş, kıbleye dönmüş, Şehadet getirmiş ve \"İşte geldim, işte geldim ve sana aceleyle geldim, Rabbim, razı olasın diye\" demiştir. Seksen yaşına yaklaşmışken vefat etmiş ve ibadet edenlerin mezarlığına defnedilmiştir. Mezarı orada iyi bilinir ve ziyaret edilir. H. 590 yılında vefat etti. {alıntı: shadharat-dhahab s. 783}"
  id: "Syekh Abu Madyan Shuaib bin Al-Hussein Al-Andalusi yang terpelajar dan unik, Syekh penduduk Maghreb, tinggal di Tlemcen. Beliau adalah seorang yang penuh tindakan dan ketekunan, tak tertandingi dalam ibadah dan asketisme, dan sangat terkenal. Syekh Muhyiddin Ibn Arabi menyebutnya Syekh dari para Syekh. Sekelompok orang saleh lulus darinya, seperti Abu Abdullah Al-Qurashi, dan banyak ulama terkemuka serta orang-orang saleh yang berbudi luhur, seperti Ibn Arabi, akhirnya belajar di bawah bimbingannya. Sultan Maghreb memanggilnya, dan ketika tiba di Tlemcen, beliau turun dari kudanya, menghadap kiblat, mengucapkan syahadat, dan berkata, “Aku telah datang, aku telah datang, dan aku bergegas kepada-Mu, Tuhanku, agar Engkau berkenan.” Beliau wafat dan dimakamkan di pemakaman orang-orang yang beribadah, pada usia hampir delapan puluh tahun. Makamnya di sana terkenal dan banyak dikunjungi. Beliau wafat pada tahun 590 Hijriah. {mengutip:shadharat-dhahab hal. 783}"
