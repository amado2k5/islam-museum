  - { value: "شعيب بن الحسين الأنصاري الأندلسي", kind: full }
summary:
  ar: "الشيخ الواحد العارف أبو مدين شعيب بن الحسين الأندلسي شيخ أهل المغرب؛ سكن تلمسان وكان من أهل العمل والاجتهاد منقطع القرين في العبادة والنسك بعيد الصيت، ويسميه الشيخ محيي الدين ابن عربي بشيخ الشيوخ، وتخرج به جماعة من الفضلاء كأبي عبد الله القرشي وانتهى إليه كثير من العلماء المحققين وفضلاء الصالحين كابن عربي؛ طلبه سلطان المغرب فلما وصل إلى تلمسان نزل واستقبل القبلة وتشهد وقال «ها قد جئت، ها قد جئت، وعجلت إليك رب لترضى» فمات ودفن في جبانة العباد وقد قارب الثمانين، وقبره بها مشهور مزور؛ توفي سنة تسعين وخمسمائة {cite:shadharat-dhahab p. 783}."
  en: "The singular gnostic Abu Madyan Shu'ayb b. al-Husayn, shaykh of the Maghrib; he settled at Tlemcen, unmatched in worship and devotion, far-famed — Ibn Arabi calls him 'the shaykh of shaykhs'; among his students Abu Abdallah al-Qurashi, and learned verifiers like Ibn Arabi himself reached him. Summoned by the sultan of the Maghrib, on reaching Tlemcen he sat, faced the qibla, recited the tashahhud, said 'Here I come, here I come, hastening to You, Lord, to please You', and died; buried in the cemetery of worshippers nearing eighty, his grave a well-known shrine; he died in 590 {cite:shadharat-dhahab p. 783}."
