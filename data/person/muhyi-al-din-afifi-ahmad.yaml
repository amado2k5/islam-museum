  ar: "الأستاذ الدكتور محيي الدين عفيفي أحمد، الأمين العام لمجمع البحوث الإسلامية بالأزهر الشريف كما يُذكر على صفحة العنوان، ومؤلف كتاب «نظرات موضوعية في قضايا إنسانية» الصادر سنة 1439هـ / 2018م {cite:nazarat-mawdu-iyya-azhar p. 1}. يتناول الكتاب قضايا السلام والحوار والوقف والاحتكار والبيئة والتعايش والتطرف وأزمة الروهينجا والقدس من منظور المؤلف {cite:nazarat-mawdu-iyya-azhar p. 5}."
  en: "Dr Muhyi al-Din Afifi Ahmad, Secretary-General of the Islamic Research Academy of al-Azhar as printed on the title page, and author of 'Objective Views on Human Issues' (1439 AH / 2018 CE) {cite:nazarat-mawdu-iyya-azhar p. 1}. The book treats peace, dialogue, waqf, hoarding, the environment, coexistence, extremism, the Rohingya crisis and Jerusalem from the author's own viewpoint {cite:nazarat-mawdu-iyya-azhar p. 5}."
