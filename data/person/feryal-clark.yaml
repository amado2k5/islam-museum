summary:
  ar: "سياسية بريطانية من حزب العمال، وُلدت في ملاطية بتركيا سنة 1979 لوالدين كرديين، وانتقلت إلى لندن في الثامنة. درست في جامعة إكستر وعملت في هيئة الصحة الوطنية، ثم عضوا في مجلس هاكني ونائبة لرئيس بلديته، وانتُخبت سنة 2019 نائبة عن إنفيلد الشمالية فكانت أول نائبة كردية لحزب العمال، وشغلت منصب وكيلة وزارة الدولة لشؤون الذكاء الاصطناعي والحكومة الرقمية (2024-2025)."
  en: "British Labour Party politician, born in Malatya, Turkey, in 1979 to Kurdish parents, who moved to London at the age of eight. She studied at the University of Exeter and worked in the NHS, served as a Hackney councillor and deputy mayor of Hackney, was elected MP for Enfield North in 2019 as Labour's first Kurdish MP, and served as Parliamentary Under-Secretary of State for AI and Digital Government (2024–2025)."
  ur: "برطانوی لیبر پارٹی کی سیاست دان، جو 1979 میں ترکی کے ملاطیہ میں کرد والدین کے ہاں پیدا ہوئیں اور آٹھ برس کی عمر میں لندن منتقل ہوئیں۔ انھوں نے یونیورسٹی آف ایکسٹر میں تعلیم حاصل کی اور این ایچ ایس میں کام کیا، ہیکنی کی کونسلر اور نائب میئر رہیں، 2019 میں انفیلڈ نارتھ سے رکنِ پارلیمان منتخب ہو کر لیبر کی پہلی کرد ایم پی بنیں، اور 2024ء–2025ء میں مصنوعی ذہانت اور ڈیجیٹل حکومت کی پارلیمانی انڈر سیکرٹری رہیں۔"
