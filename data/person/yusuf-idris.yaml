  ar: "قاصّ وروائي ومسرحي مصري ⁦(1927–1991)⁩ يُعدّ من أساتذة القصة القصيرة العربية الحديثة. درس الطب ثم اتجه إلى الصحافة والأدب، ومن مجموعاته القصصية «أرخص ليالي» و«الحادثة»، ومن مسرحياته «الفرافير» و«المخططين»، ومن رواياته «الحرام»."
  en: "Egyptian short-story writer, novelist and playwright (1927–1991), a master of the modern Arabic short story. He studied medicine then turned to journalism and literature; his collections include The Cheapest Nights, his plays Al-Farafeer and The Intertwined, and his novels include The Sinners (Al-Haram)."
  ur: "مصری افسانہ نگار، ناول نگار اور ڈراما نویس ⁦(1927–1991)⁩ جو جدید عربی افسانے کے استادوں میں شمار ہوتے ہیں۔ انہوں نے طب کی تعلیم پائی پھر صحافت اور ادب کی طرف آئے؛ ان کے افسانوی مجموعوں میں «ارخص لیالی»، ڈراموں میں «الفرافیر» اور ناولوں میں «الحرام» شامل ہیں۔"
