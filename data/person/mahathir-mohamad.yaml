summary:
  ar: "سياسي وطبيب وكاتب ماليزي، وُلد في ألور ستار بولاية قدح سنة 1925، وكان رئيس وزراء ماليزيا الرابع (1981–2003) ثم السابع (2018–2020) بمجموع 24 سنة، فهو الأطول خدمة في تاريخ البلاد ولُقّب «أبو الحداثة» لدوره في تحويل اقتصادها وبنيتها، واشتهر بكتابه «معضلة الملايو» (1970) وبقيادته بلاده عبر الأزمة المالية الآسيوية 1997 بضوابط رأسمالية خالفت وصفات صندوق النقد الدولي، وعاد من الاعتزال ليقود المعارضة إلى فوز تاريخي سنة 2018 وهو في الثانية والتسعين، وما زال حيًا وقد تجاوز المئة، وتوفيت زوجته سيتي حازمة سنة 2026 بعد سبعين عامًا من الزواج."
  en: "Malaysian politician, physician and author, born in Alor Setar, Kedah, in 1925. He was Malaysia's fourth prime minister (1981–2003) and seventh (2018–2020), 24 years in total — the longest-serving in the country's history — and was titled 'Father of Modernisation' for transforming its economy and infrastructure. He is known for his book The Malay Dilemma (1970) and for steering Malaysia through the 1997 Asian financial crisis with capital controls that defied IMF prescriptions; he came out of retirement to lead the opposition to a historic victory in 2018 at the age of 92. He is still living past the age of one hundred; his wife Siti Hasmah died in 2026 after seventy years of marriage."
  ur: "ملائیشیائی سیاست دان، طبیب اور مصنف، جو 1925 میں قدح کے شہر الور ستار میں پیدا ہوئے۔ وہ ملائیشیا کے چوتھے (1981–2003) اور ساتویں (2018–2020) وزیر اعظم رہے، مجموعی طور پر 24 سال، جو ملک کی تاریخ میں طویل ترین مدت ہے، اور انہیں «بابائے جدیدیت» کہا جاتا ہے۔ ان کی کتاب «دی ملے ڈائلیما» (1970) مشہور ہے؛ 1997 کے ایشیائی مالی بحران میں انہوں نے آئی ایم ایف کی ہدایات کے برعکس سرمایے پر پابندیاں لگا کر ملک کو نکالا، اور 2018 میں 92 سال کی عمر میں اپوزیشن کو تاریخی فتح دلائی۔ وہ سو سال سے زائد عمر میں زندہ ہیں؛ ان کی اہلیہ ستی حاسمہ 2026 میں وفات پا گئیں۔"
  es: "Político, médico y escritor malasio, nacido en Alor Setar, Kedah, en 1925. Fue el cuarto primer ministro de Malasia (1981-2003) y el séptimo (2018-2020), con un total de 24 años en el cargo —el mandato más largo en la historia del país— y fue apodado «Padre de la Modernización» por transformar su economía e infraestructura. Es conocido por su libro El dilema malayo (1970) y por haber guiado a Malasia a través de la crisis financiera asiática de 1997 con controles de capital que desafiaron las prescripciones del FMI; salió de su retiro para liderar a la oposición hacia una victoria histórica en 2018 a la edad de 92 años. Aún vive más de cien años; su esposa Siti Hasmah falleció en 2026 después de setenta años de matrimonio."
  fr: "Homme politique, médecin et écrivain malaisien, né à Alor Setar, dans l'État de Kedah, en 1925, il fut le quatrième Premier ministre de Malaisie (1981-2003) et le septième (2018-2020), soit 24 ans au total – le plus long mandat de l'histoire du pays – et fut surnommé le « Père de la modernisation » pour avoir transformé l'économie et les infrastructures malaisiennes. Il est notamment connu pour son ouvrage « Le Dilemme malais » (1970) et pour avoir piloté la Malaisie à travers la crise financière asiatique de 1997 grâce à des contrôles des capitaux allant à l'encontre des recommandations du FMI. Sorti de sa retraite, il mena l'opposition à une victoire historique en 2018, à l'âge de 92 ans. Il est toujours centenaire; son épouse, Siti Hasmah, est décédée en 2026 après soixante-dix ans de mariage."
  tr: "Malezyalı bir politikacı, doktor ve yazar olan Sher, 1925 yılında Kedah eyaletinin Alur Star kentinde doğdu. Malezya'nın dördüncü başbakanı (1981–2003) ve ardından yedinci başbakanı (2018–2020) olarak görev yaptı; toplamda 24 yıl görev yaptı. Ülke tarihinin en uzun süre görev yapan kişisidir ve ekonomi ile yapısını dönüştürmedeki rolü nedeniyle 'Modernitenin Babası' lakabını almaktadır. 'Malay İkilem' (1970) adlı kitabı ve ülkesini IMF'nin reçetelerine aykırı kapitalist denetimler altında 1997 Asya finansal krizinden geçirmesi ile ünlendi. Emekliliğinden dönerek 2018'de doksan iki yaşında tarihi bir zafere liderlik etti, hâlâ hayatta ve yüzü aştı. Eşi Siti Hazema, yetmiş yıllık evlilikten sonra 2026'da vefat etti."
  id: "Seorang politikus, dokter, dan penulis Malaysia, ia lahir di Alur Star, negara bagian Kedah pada tahun 1925. Ia adalah Perdana Menteri keempat Malaysia (1981–2003) dan kemudian ketujuh (2018–2020), dengan total 24 tahun. Ia adalah orang dengan masa jabatan terlama dalam sejarah negara dan dijuluki 'Bapak Modernitas' atas perannya dalam transformasi ekonomi dan strukturnya. Ia menjadi terkenal lewat bukunya 'The Malay Dilemma' (1970) dan karena memimpin negaranya melewati krisis keuangan Asia 1997 di bawah kendali kapitalis yang bertentangan dengan aturan IMF. Ia kembali dari masa pensiun untuk memimpin oposisi meraih kemenangan bersejarah pada tahun 2018 pada usia sembilan puluh dua tahun, dan masih hidup serta telah melampaui seratus tahun. Istrinya, Siti Hazema, meninggal pada tahun 2026 setelah tujuh puluh tahun menikah."
