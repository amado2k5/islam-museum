summary:
  ar: "سياسي وطبيب وكاتب ماليزي، وُلد في ألور ستار بولاية قدح سنة 1925، وكان رئيس وزراء ماليزيا الرابع (1981–2003) ثم السابع (2018–2020) بمجموع 24 سنة، فهو الأطول خدمة في تاريخ البلاد ولُقّب «أبو الحداثة» لدوره في تحويل اقتصادها وبنيتها، واشتهر بكتابه «معضلة الملايو» (1970) وبقيادته بلاده عبر الأزمة المالية الآسيوية 1997 بضوابط رأسمالية خالفت وصفات صندوق النقد الدولي، وعاد من الاعتزال ليقود المعارضة إلى فوز تاريخي سنة 2018 وهو في الثانية والتسعين، وما زال حيًا وقد تجاوز المئة، وتوفيت زوجته سيتي حازمة سنة 2026 بعد سبعين عامًا من الزواج."
  en: "Malaysian politician, physician and author, born in Alor Setar, Kedah, in 1925. He was Malaysia's fourth prime minister (1981–2003) and seventh (2018–2020), 24 years in total — the longest-serving in the country's history — and was titled 'Father of Modernisation' for transforming its economy and infrastructure. He is known for his book The Malay Dilemma (1970) and for steering Malaysia through the 1997 Asian financial crisis with capital controls that defied IMF prescriptions; he came out of retirement to lead the opposition to a historic victory in 2018 at the age of 92. He is still living past the age of one hundred; his wife Siti Hasmah died in 2026 after seventy years of marriage."
  ur: "ملائیشیائی سیاست دان، طبیب اور مصنف، جو 1925 میں قدح کے شہر الور ستار میں پیدا ہوئے۔ وہ ملائیشیا کے چوتھے (1981–2003) اور ساتویں (2018–2020) وزیر اعظم رہے، مجموعی طور پر 24 سال، جو ملک کی تاریخ میں طویل ترین مدت ہے، اور انہیں «بابائے جدیدیت» کہا جاتا ہے۔ ان کی کتاب «دی ملے ڈائلیما» (1970) مشہور ہے؛ 1997 کے ایشیائی مالی بحران میں انہوں نے آئی ایم ایف کی ہدایات کے برعکس سرمایے پر پابندیاں لگا کر ملک کو نکالا، اور 2018 میں 92 سال کی عمر میں اپوزیشن کو تاریخی فتح دلائی۔ وہ سو سال سے زائد عمر میں زندہ ہیں؛ ان کی اہلیہ ستی حاسمہ 2026 میں وفات پا گئیں۔"
