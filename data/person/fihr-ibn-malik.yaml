summary:
  ar: "هو «قريش» بن فهر الذي إليه تنحصر قريش البطاح والظواهر، وفي قول: سمي فهر بن مالك قريشاً لأنه قرش عدواً لأهل اليمن أرادوا أن يقتادوا قريشاً فدافعهم عن قومه وخزاعة؛ أولاده غالب ومحرم والحارث {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}."
  en: "Fihr ibn Malik, the 'Quraysh' to whom Quraysh of the hollows and the outskirts are confined; it is said he was called Quraysh because he 'quarashed' (crushed) a Yemeni enemy that meant to carry off Quraysh, defending his people and Khuza'a; his sons are Ghalib, Muharram and al-Harith {cite:ibn-hisham-sira 1/1-4} {cite:mubarakpuri-raheeq p.48} {cite:tarikh-al-tabari}."
