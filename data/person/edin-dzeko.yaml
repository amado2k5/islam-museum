summary:
  ar: "لاعب كرة قدم بوسني، وُلد في سراييفو سنة 1986 وعاش طفولته تحت حصارها؛ مهاجم يُلقب بـ«الماسة البوسنية»، بدأ مع زيليزنيكار ثم تألق مع فولفسبورغ ففاز معه بالدوري الألماني (2009) ولقب هدافه (2010)، وفاز مع مانشستر سيتي بالدوري الإنجليزي مرتين، وكان هداف الدوري الإيطالي مع روما (2017)، ولعب بعدها لإنتر ميلان وفنربخشة وفيورنتينا ثم شالكه. الهداف التاريخي لمنتخب البوسنة والهرسك وأكثر لاعبيه مشاركة دولية."
  en: "Bosnian professional footballer, born in Sarajevo in 1986, whose childhood was spent under the city's siege. A striker nicknamed the 'Bosnian Diamond', he began at Željezničar, starred for VfL Wolfsburg — winning the Bundesliga in 2009 and its top-scorer title in 2010 — won two Premier League titles with Manchester City, finished as Serie A's top scorer with Roma in 2017, and later played for Inter Milan, Fenerbahçe and Fiorentina before joining Schalke 04. He is the all-time top scorer and most-capped player in the history of the Bosnia and Herzegovina national team."
  ur: "بوسنیائی پیشہ ور فٹبالر، 1986 میں سرائیوو میں پیدا ہوئے اور بچپن شہر کے محاصرے میں گزارا؛ «بوسنیائی ہیرا» کے لقب سے مشہور اسٹرائیکر جنہوں نے زیلیزنیکار سے آغاز کیا، وولفسبرگ کے ساتھ 2009 میں بنڈس لیگا اور 2010 میں اس کے ٹاپ اسکورر کا خطاب جیتا، مانچسٹر سٹی کے ساتھ دو پریمیئر لیگ خطاب جیتے، 2017 میں روما کے ساتھ سیری آ کے ٹاپ اسکورر رہے، اور بعد میں انٹر میلان، فنربخشے اور فیورنٹینا کے بعد شالکے میں شامل ہوئے۔ بوسنیا و ہرزیگووینا کی قومی ٹیم کے تاریخ کے سب سے بڑے گول اسکورر اور سب سے زیادہ میچ کھیلنے والے کھلاڑی ہیں۔"
