summary:
  ar: "أبو الحسن علي بن عبد الحي الحسني الندوي ⁦(1333–1420هـ/1914–1999م)⁩، عالم وداعية وأديب هندي، وُلد قرب رائي بريلي، ودرس في جامعة لكهنؤ وفي دار العلوم لندوة العلماء ودرّس فيها ثم صار أمينها العام، وألّف بالعربية والأردية كتباً منها «ماذا خسر العالم بانحطاط المسلمين؟» و«السيرة النبوية» و«رجال الفكر والدعوة في الإسلام»، ونال جائزة الملك فيصل العالمية سنة 1980م {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 26-35}."
  en: "Abu al-Hasan 'Ali ibn 'Abd al-Hayy al-Hasani al-Nadwi (1333–1420 AH/1914–1999 CE), an Indian scholar, preacher and man of letters, born near Rae Bareli. He studied at Lucknow University and at the Dar al-'Ulum of Nadwat al-'Ulama', taught there and later became its secretary-general. He wrote in Arabic and Urdu, including Madha Khasira al-'Alam bi-Inhitat al-Muslimin?, al-Sira al-Nabawiyya and Rijal al-Fikr wa-al-Da'wa fi al-Islam, and received the King Faisal International Prize in 1980 {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 26-35}."
  ur: "ابو الحسن علی بن عبد الحی حسنی ندوی ⁦(1333–1420ھ/1914–1999ء)⁩، ہندوستانی عالم، داعی اور ادیب، رائے بریلی کے قریب پیدا ہوئے۔ انہوں نے لکھنؤ یونیورسٹی اور دار العلوم ندوۃ العلماء میں تعلیم پائی، وہیں پڑھایا اور پھر اس کے ناظم بنے۔ عربی اور اردو میں کتابیں لکھیں جن میں «ماذا خسر العالم بانحطاط المسلمین؟»، «السیرۃ النبویہ» اور «رجال الفکر والدعوۃ فی الاسلام» شامل ہیں، اور 1980ء میں شاہ فیصل عالمی ایوارڈ پایا {cite:al-sira-al-nabawiyya-nadwi-ibn-kathir-2004 p. 26-35}۔"
