id: person/muslim-ibn-quraysh
class: person
label: { ar: "مسلم بن قريش شرف الدولة" }
summary:
  ar: "أبو المكارم مسلم بن قريش بن بدران العقيلي، آخر أمراء بني عقيل الأقوياء؛ أخذ حلب سنة 472هـ وكتب إلى السلطان ملكشاه كتاباً أشهد فيه على نفسه بالعوض عنها بثلاثمائة ألف دينار كل سنة تؤدى إلى خزانة السلطان فأجابه إلى ذلك {cite:muntazam-ibn-al-jawzi j.8 p.323}. وفي سنة 474هـ دخل عليه خادمان الحمام تخفياً فأدركه أصحابه وقد شارف الموت فنجا وقتل الخادمان، وفي رواية عبد الملك بن حمدان أن خادماً واحداً وثب به وكسر أهله الباب فأخرجوه تالفاً ثم ظفر بالخادم بعد مغيبه أياماً فقطع شرف الدولة لسانه وقتله {cite:muntazam-ibn-al-jawzi j.8 p.331}."
