id: person/muslim-ibn-quraysh
class: person
label: { ar: "مسلم بن قريش شرف الدولة" }
summary:
  ar: "أبو المكارم مسلم بن قريش بن بدران العقيلي، آخر أمراء بني عقيل الأقوياء؛ أخذ حلب سنة 472هـ وكتب إلى السلطان ملكشاه كتاباً أشهد فيه على نفسه بالعوض عنها بثلاثمائة ألف دينار كل سنة تؤدى إلى خزانة السلطان فأجابه إلى ذلك {cite:muntazam-ibn-al-jawzi j.8 p.323}. وفي سنة 474هـ دخل عليه خادمان الحمام تخفياً فأدركه أصحابه وقد شارف الموت فنجا وقتل الخادمان، وفي رواية عبد الملك بن حمدان أن خادماً واحداً وثب به وكسر أهله الباب فأخرجوه تالفاً ثم ظفر بالخادم بعد مغيبه أياماً فقطع شرف الدولة لسانه وقتله {cite:muntazam-ibn-al-jawzi j.8 p.331}."
  tr: "Güçlü Banu Akil prenslerinin sonuncusu Ebu el-Mekerim Müslim bin Kureyş bin Badran el-Akili, 472 Hicri'de Halep'i ele geçirdi ve Sultan Malikşah'a bir mektup yazarak kendisine yılda üç yüz bin dinar tazminat vereceğini ifade etti. O da buna yanıt verdi {alıntı:Muntazam-ibn-al-jawzi J.8 s.323}. 474 Hicri'de, hamamın iki hizmetçisi kılık değiştirerek ona girdi ve yoldaşları onu ölümüne yakın olduğu sırada yakaladılar, böylece hayatta kaldı ve onları öldürdü. Abd al-Malik ibn Hamdan'ın rivayetinde, bir hizmetçi onunla birlikte atladı ve ailesi kapıyı kırarak onu hasarlı olarak dışarı çıkardı. Sonra hizmetkârı günlerce yokken yakaladı, Şeraf al-Dawla'nın dilini kesti ve öldürdü {atıf:Muntazam-ibn-al-jawzi J.8 s.331}."
  id: "Abu al-Makarim Muslim ibn Quraysh ibn Badran al-Aqili, pangeran Banu Aqil terakhir yang kuat, merebut Aleppo pada tahun 472 H dan menulis surat kepada Sultan Malikshah yang menyatakan kepada dirinya sebagai kompensasi sebesar tiga ratus ribu dinar setiap tahun yang harus dibayarkan ke kas Sultan. Ia membalas ini {sitasi:Muntazam-ibn-al-jawzi J.8 hlm.323}. Pada tahun 474 H, dua pelayan pemandian masuk ke dalamnya dengan menyamar, dan teman-temannya menangkapnya saat ia hampir mati, sehingga ia selamat dan membunuh mereka. Dalam kisah Abd al-Malik ibn Hamdan, seorang pelayan ikut melompat bersamanya, dan keluarganya memecahkan pintu, sehingga mereka membawanya keluar dalam keadaan rusak. Kemudian ia menangkap pelayan itu setelah ia absen selama beberapa hari, memotong lidah Sharaf al-Dawla, dan membunuhnya {cite:Muntazam-ibn-al-jawzi J.8 hlm.331}."
