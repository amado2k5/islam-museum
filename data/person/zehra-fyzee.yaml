summary:
  ar: "كاتبة ومسرحية ومحررة هندية (1866–1940)، كبرى أخوات فيضي الثلاث من عشيرة الطيّبجي في بومباي. كانت من أبرز المساهمات في مجلات النساء الأردية في عصرها — «تهذيب نسوان» و«خاتون» و«عصمت» — ونشرت مقالاتها مجموعةً في «مضامين» ومسرحية سنة 1921 وكتابًا في صحة النساء سنة 1934، وحررت كتابات أختها عطية ورحلة أختها نازلي وكتب شعر والدتها. وانتُخبت سنة 1914 لعضوية اللجنة العاملة لمؤتمر سيدات المسلمين لعموم الهند."
  en: "Indian writer, playwright and editor (1866–1940), the eldest of the three Fyzee sisters of Bombay's Tyabji clan. She was a leading contributor to the Urdu women's journals of her day — Tehzeeb-e-Niswan, Khatun and Ismat — published her collected articles as Mazamin and a play in 1921 and a book on women's health in 1934, and edited the writings of her sister Atiya, her sister Nazli's travelogue and her mother's poetry books. In 1914 she was elected to the working committee of the All India Muslim Ladies Conference."
  ur: "ہندوستانی مصنفہ، ڈراما نگار اور مدیرہ ⁦(1866ء–1940ء)⁩، ممبئی کے طیب جی خاندان کی تینوں فیضی بہنوں میں سب سے بڑی۔ وہ اپنے دور کے اردو نسائی رسالوں — «تہذیبِ نسواں»، «خاتون» اور «عصمت» — کی نمایاں لکھنے والوں میں تھیں، ان کے مضامین کا مجموعہ «مضامین» اور ایک ڈراما 1921ء میں شائع ہوا اور خواتین کی صحت پر کتاب 1934ء میں آئی، اور انھوں نے اپنی بہن عطیہ کی تحریریں، بہن نازلی کا سفرنامہ اور والدہ کے شعری مجموعے مرتب کیے۔ 1914ء میں وہ آل انڈیا مسلم لیڈیز کانفرنس کی مجلسِ عاملہ کی رکن منتخب ہوئیں۔"
  es: "Escritora, dramaturga y editora india (1866-1940), la mayor de las tres hermanas Fyzee del clan Tyabji de Bombay. Fue una colaboradora destacada de las revistas femeninas en urdu de su época —Tehzeeb-e-Niswan, Khatun e Ismat—, publicó sus artículos recopilados en Mazamin y una obra de teatro en 1921, y un libro sobre la salud de la mujer en 1934. Editó los escritos de su hermana Atiya, el libro de viajes de su hermana Nazli y los poemarios de su madre. En 1914 fue elegida miembro del comité ejecutivo de la Conferencia de Mujeres Musulmanas de la India."
  fr: "Écrivaine, dramaturge et éditrice indienne (1866-1940), aînée des trois sœurs Fyzee du clan Tyabji de Bombay. Elle contribua de manière significative aux revues féminines ourdoues de son époque — Tehzeeb-e-Niswan, Khatun et Ismat —, publia un recueil de ses articles sous le titre Mazamin, ainsi qu'une pièce de théâtre en 1921, et un ouvrage sur la santé des femmes en 1934. Elle édita également les écrits de sa sœur Atiya, le récit de voyage de sa sœur Nazli et les recueils de poésie de sa mère. En 1914, elle fut élue au comité directeur de la Conférence panindienne des femmes musulmanes."
  tr: "Hintli bir yazar, oyun yazarı ve editör (1866–1940), Bombay'daki Taibji klanından üç Faizi kız kardeşin en büyüğü. Zamanının Urduca kadın dergilerine — \"Tahdhib Niswan,\" \"Khatun\" ve \"Ismat\" — en önde gelen katkıcılardan biriydi ve 1921'de \"Contents\"te bir oyun ve 1934'te kadın sağlığı üzerine bir kitap yayımladı. Kız kardeşi Atiya'nın yazılarını, kız kardeşi Nazli'nin yolculuğunu ve annesinin şiir kitaplarını düzenledi. 1914'te Tüm Hindistan Müslüman Kadınlar Kongresi çalışma komitesine seçildi."
  id: "Seorang penulis, dramawan, dan editor India (1866–1940), anak tertua dari tiga saudari Faizi dari klan Taibji di Bombay. Ia termasuk kontributor paling menonjol untuk majalah perempuan Urdu pada masanya — \"Tahdhib Niswan,\" \"Khatun,\" dan \"Ismat\" — serta menerbitkan kumpulan artikel di \"Contents,\" sebuah drama pada tahun 1921, dan sebuah buku tentang kesehatan perempuan pada tahun 1934. Ia mengedit tulisan saudara perempuannya Atiya, perjalanan kakaknya Nazli, dan buku puisi ibunya. Pada tahun 1914, ia terpilih sebagai anggota komite kerja Kongres Perempuan Muslim Seluruh India."
