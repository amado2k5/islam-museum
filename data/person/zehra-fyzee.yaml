summary:
  ar: "كاتبة ومسرحية ومحررة هندية (1866–1940)، كبرى أخوات فيضي الثلاث من عشيرة الطيّبجي في بومباي. كانت من أبرز المساهمات في مجلات النساء الأردية في عصرها — «تهذيب نسوان» و«خاتون» و«عصمت» — ونشرت مقالاتها مجموعةً في «مضامين» ومسرحية سنة 1921 وكتابًا في صحة النساء سنة 1934، وحررت كتابات أختها عطية ورحلة أختها نازلي وكتب شعر والدتها. وانتُخبت سنة 1914 لعضوية اللجنة العاملة لمؤتمر سيدات المسلمين لعموم الهند."
  en: "Indian writer, playwright and editor (1866–1940), the eldest of the three Fyzee sisters of Bombay's Tyabji clan. She was a leading contributor to the Urdu women's journals of her day — Tehzeeb-e-Niswan, Khatun and Ismat — published her collected articles as Mazamin and a play in 1921 and a book on women's health in 1934, and edited the writings of her sister Atiya, her sister Nazli's travelogue and her mother's poetry books. In 1914 she was elected to the working committee of the All India Muslim Ladies Conference."
  ur: "ہندوستانی مصنفہ، ڈراما نگار اور مدیرہ (1866ء–1940ء)، ممبئی کے طیب جی خاندان کی تینوں فیضی بہنوں میں سب سے بڑی۔ وہ اپنے دور کے اردو نسائی رسالوں — «تہذیبِ نسواں»، «خاتون» اور «عصمت» — کی نمایاں لکھنے والوں میں تھیں، ان کے مضامین کا مجموعہ «مضامین» اور ایک ڈراما 1921ء میں شائع ہوا اور خواتین کی صحت پر کتاب 1934ء میں آئی، اور انھوں نے اپنی بہن عطیہ کی تحریریں، بہن نازلی کا سفرنامہ اور والدہ کے شعری مجموعے مرتب کیے۔ 1914ء میں وہ آل انڈیا مسلم لیڈیز کانفرنس کی مجلسِ عاملہ کی رکن منتخب ہوئیں۔"
