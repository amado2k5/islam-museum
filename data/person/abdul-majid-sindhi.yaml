summary:
  ar: "شيخ عبد المجيد السندي (1889–1978)، كاتب وصحفي وسياسي سندي. وُلد في تته في أسرة هندوسية باسم جيتا ناند، واعتنق الإسلام سنة 1908 وهو في العشرين، وتولى تحرير صحيفتي الأمين والوحيد، وشارك في حركة الرسائل الحريرية فسُجن مرتين، وانتُخب لعضوية جمعية السند سنة 1937 وصار وزيرا فيها سنة 1940."
  en: "Shaikh Abdul Majeed Sindhi (1889–1978), a Sindhi writer, journalist and politician. Born at Thatta into a Hindu family under the name Jetha Nand, he converted to Islam in 1908, edited the newspapers Al-Amin and Al-Waheed, took part in the Silk Letter Movement and was twice imprisoned, was elected to the Sindh Assembly in 1937 and became a minister in Sindh in 1940."
  ur: "شیخ عبد المجید سندھی (1889ء–1978ء)، سندھی مصنف، صحافی اور سیاست دان۔ وہ ٹھٹہ میں ایک ہندو خاندان میں جیٹھانند کے نام سے پیدا ہوئے، 1908ء میں اسلام قبول کیا، الامين اور الوحید کی ادارت سنبھالی، ریشمی رومال تحریک میں حصہ لینے پر دو مرتبہ قید ہوئے، 1937ء میں سندھ اسمبلی کے رکن منتخب ہوئے اور 1940ء میں سندھ کے وزیر بنے۔"
