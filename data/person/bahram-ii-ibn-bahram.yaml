summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك بهرام بن بهرام بن هرمز» {cite:tabari-tarikh-abu-al-fadl j.2 p.54}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
  tr: "Sasani Perslerinin kralıydı ve el-Tabari'nin \"Bahram ibn Bahram ibn Hurmiz'un Krallığından Bahsedilmesi\" başlığıyla anılmıştır {cite:tabari-tarikh-abu-al-fadl j.2 s.54}. Bu yerde, saltanat yılları ve haberleri hakkında söylenenler anlatılır."
  id: "Ia adalah raja Persia Sasanian, yang disebut oleh al-Tabari dengan judul \"Penyebutan Kerajaannya Bahram ibn Bahram ibn Hurmiz\" {cite:tabari-tarikh-abu-al-fadl j.2 hlm.54}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kabarnya diceritakan."
