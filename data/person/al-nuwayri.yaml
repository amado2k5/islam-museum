id: person/al-nuwayri
class: person
label: { ar: "النويري", en: "al-Nuwayri", ur: "نويری" }
names:
  - { value: "شهاب الدين أحمد بن عبد الوهاب بن محمد بن عبد الدائم القرشي التيمي البكري النويري", kind: full }
summary:
  ar: "شهاب الدين أحمد بن عبد الوهاب بن محمد بن عبد الدائم القرشي التيمي البكري النويري الشافعي، كاتب الدواوين والموسوعي المصري صاحب «[[work/nihayat-al-arab-fi-funun-al-adab|نهاية الأرب في فنون الأدب]]»؛ ولد بأخميم يوم ٢١ ذي القعدة ٦٧٧هـ/٥ أبريل ١٢٧٩م — وينسبه الزركلي مولداً ومنشأً إلى قوص — فخدم في ديوان الخاص بالقاهرة وديوان الإنشاء ونظر الجيش بطرابلس ونظر الديوان بالدقهلية والمرتاحية، ثم اعتزل الإدارة نحو ٧١٦هـ فألف موسوعته في خمسة فنون وأكثرها التاريخ إلى سنة ٧٣١هـ، ونسخ من صحيح البخاري ثماني نسخ وكان يبيّض النسخة في يوم؛ توفي بالقاهرة ٢١ رمضان ٧٣٣هـ/٥ يونيو ١٣٣٣م {cite:encyclopaedia-of-islam-2 vol. 8 pp. 156-160} {cite:durar-kamina-jil-1993 1/197} {cite:al-aalam j. 1 s.v. al-Nuwayri}."
  en: "Shihab al-Din Ahmad ibn Abd al-Wahhab ibn Muhammad ibn Abd al-Da'im al-Qurashi al-Taymi al-Bakri al-Nuwayri al-Shafi'i, Mamluk chancery official and encyclopedist, author of [[work/nihayat-al-arab-fi-funun-al-adab|Nihayat al-Arab fi Funun al-Adab]]; born at Akhmim on 21 Dhu al-Qa'da 677/5 April 1279 — al-Zirikli gives his birth and upbringing at Qus — he served in the diwan al-khass at Cairo, as sahib diwan al-insha' and nazir al-jaysh at Tripoli, and as nazir al-diwan of al-Dakhaliyya and al-Murtahiyya, then withdrew from administration about 716 to compose his encyclopaedia in five funun, mostly history to 731, copying eight Sahih al-Bukhari manuscripts and finishing a fair copy in a day; he died at Cairo on 21 Ramadan 733/5 June 1333 {cite:encyclopaedia-of-islam-2 vol. 8 pp. 156-160} {cite:durar-kamina-jil-1993 1/197} {cite:al-aalam j. 1 s.v. al-Nuwayri}."
  ur: "شہاب الدین احمد بن عبدالوہاب بن محمد بن عبدالدائم قرشی تیمی بکری نويری شافعی، مملوک دیوانی افسر اور دائرۃ المعارف [[work/nihayat-al-arab-fi-funun-al-adab|نہایۃ الارب فی فنون الادب]] کے مصنف؛ اخمیم میں 21 ذیقعدہ 677ھ/5 اپریل 1279ء کو پیدا ہوئے — زرکلی ان کی پیدائش و پرورش قوص بتاتا ہے — قاہرہ میں دیوان خاص، طرابلس میں صاحب دیوان انشاء اور ناظر الجیش، اور دقہلیہ و مرتاحیہ میں ناظر دیوان رہے، پھر تقریباً 716ھ میں انتظامیہ سے کنارہ کش ہو کر پانچ فنوں پر مشتمل اپنے دائرۃ المعارف کی تصنیف میں لگے جس کا بیشتر حصہ 731ھ تک کی تاریخ ہے؛ صحیح بخاری کی آٹھ نسخے نقل کیں اور ایک دن میں مسودہ بیاض کرتے؛ قاہرہ میں 21 رمضان 733ھ/5 جون 1333ء کو فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 156-160} {cite:durar-kamina-jil-1993 1/197} {cite:al-aalam j. 1 s.v. al-Nuwayri}۔"
