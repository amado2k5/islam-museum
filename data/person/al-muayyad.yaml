  en: "Al-Mu'tazz's brother, third in Mutawakkil's succession oaths; in Rajab al-Mu'tazz deposed, beat and shackled him and he died days later — the caliph, fearing the talk, brought judges to view the unmarked body {cite:tarikh-khulafa-minhaj-1434 p. 543,558}."
