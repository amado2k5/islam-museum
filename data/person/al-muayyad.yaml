id: person/al-muayyad
class: person
label: { ar: "المؤيد بن المتوكل", en: "al-Mu'ayyad ibn al-Mutawakkil", fr: "al-Mu'ayyad ibn al-Mutawakkil", es: "al-Mu'ayyad ibn al-Mutawakkil", ur: "المعیاد ابن المتوکل" }
summary:
  ar: "أخو المعتز، كان ثالث الأعهد في خلافة المتوكل، وفي رجب خلعه المعتز من العهد وضربه وقيده فمات بعد أيام فخشي المعتز أن يتحدث عنه أنه قتله فأحضر القضاة حتى شاهدوه وليس به أثر {cite:tarikh-khulafa-minhaj-1434 p. 543,558}. وعند المسعودي حبسه المعتز وأخاه أبا أحمد لما نمي إليه أنه يدبر عليه، وضرب أربعين عصا حتى أجاب إلى خلع نفسه، وأخرج ميتاً من حبسه يوم الخميس لثمان بقين من رجب سنة اثنتين وخمسين ومائتين فيقال إنه أدرج في لحاف مسموم وشد طرفاه حتى مات {cite:muruj-al-dhahab p. 551}"
  en: "Al-Mu'tazz's brother, third in Mutawakkil's succession oaths; in Rajab al-Mu'tazz deposed, beat and shackled him and he died days later — the caliph, fearing the talk, brought judges to view the unmarked body {cite:tarikh-khulafa-minhaj-1434 p. 543,558}."
  fr: "Le frère d'Al-Mu'tazz, troisième dans les serments de succession de Mutawakkil ; à Rajab al-Mu'tazza déposé, battu et enchaîné et il est mort quelques jours plus tard - le calife, craignant le discours, a amené les juges à voir le corps non marqué {cite:tarikh-khulafa-minhaj-1434 p. 543,558}."
  es: "El hermano de Al-Mu'tazz, tercero en los juramentos de sucesión de Mutawakkil; en Rajab, Al-Mu'tazz lo depuso, lo golpeó y lo encadenó, y murió días después; el califa, temiendo los rumores, trajo jueces para que vieran el cuerpo sin marcar {cite:tarikh-khulafa-minhaj-1434 p. 543,558}."
  ur: "معتز کا بھائی، متوکل کی جانشینی کی قسموں میں تیسرا؛ رجب المعتز میں اسے معزول کیا، مارا پیٹا اور بیڑیاں ڈال دیں اور کچھ دن بعد اس کی موت ہو گئی - خلیفہ، بات سے خوفزدہ ہو کر، ججوں کو بغیر نشان والی لاش کو دیکھنے کے لیے لے آیا۔ 543,558}۔"
  tr: "El-Mu'tazz'ın kardeşi, el-Mutazak halifeliği sırasında üçüncü iktidardaydı. Recep'te el-Mu'tazz onu tahttan indirdi, dövdü ve bağladı, birkaç gün sonra öldü. El-Mu'tazz, onu öldürdüğünden korktu, bu yüzden hakimleri çağırdı ve kendisine dair hiçbir iz bulunamadı {alıntı: Tarih-Khulafa-minhaj-1434, s. 543,558}. Al-Mas'udi'ye göre, el-Mu'tazz ve kardeşi Ebu Ahmed, kendisine karşı komplo kurduğu söylendiği için onu hapse attı. Kırk çubukla onu dövdü, ta ki Cuma kendini çıkarmayı reddedene kadar; ardından 252 Hicri Rajab'ın sekizinci Perşembe günü hapishanesinden ölü çıkarıldı. Zehirli bir yorgana sarıldığı ve uzuvlarını bağladığı söylenir, ta ki ölene kadar. {alıntı:Muruj-al-Dhahab, s. 551}"
  id: "Saudara Al-Mu'tazz, ia adalah yang ketiga berkuasa selama kekhalifahan al-Mutawakkil. Di Rajab, al-Mu'tazz menggulingkannya, memukulinya, dan mengikatnya, dan ia meninggal setelah beberapa hari. Al-Mu'tazz takut telah membunuhnya, sehingga ia memanggil para hakim untuk menemuinya, namun tidak ada jejaknya {cite:History-Khulafa-minhaj-1434, hlm. 543,558}. Menurut al-Mas'udi, al-Mu'tazz dan saudaranya Abu Ahmad memenjarakannya karena diberitahu bahwa ia bersedaya tenaga. Ia memukulnya dengan empat puluh tongkat sampai ia menolak untuk melepaskan diri, dan dibangkitkan mati dari penjaranya pada hari Kamis, tanggal delapan Rajab, tahun 252 H. Konon ia dibungkus dengan selimut beracun dan diikat anggota tubuhnya hingga meninggal. {cite:Muruj-al-dhahab, hlm. 551}"
