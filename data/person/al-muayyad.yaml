label: { ar: "المؤيد بن المتوكل" }
summary:
  ar: "أخو المعتز، كان ثالث الأعهد في خلافة المتوكل، وفي رجب خلعه المعتز من العهد وضربه وقيده فمات بعد أيام فخشي المعتز أن يتحدث عنه أنه قتله فأحضر القضاة حتى شاهدوه وليس به أثر {cite:tarikh-khulafa-minhaj-1434 p. 543,558}. وعند المسعودي حبسه المعتز وأخاه أبا أحمد لما نمي إليه أنه يدبر عليه، وضرب أربعين عصا حتى أجاب إلى خلع نفسه، وأخرج ميتاً من حبسه يوم الخميس لثمان بقين من رجب سنة اثنتين وخمسين ومائتين فيقال إنه أدرج في لحاف مسموم وشد طرفاه حتى مات {cite:muruj-al-dhahab p. 551}"
  en: "Al-Mu'tazz's brother, third in Mutawakkil's succession oaths; in Rajab al-Mu'tazz deposed, beat and shackled him and he died days later — the caliph, fearing the talk, brought judges to view the unmarked body {cite:tarikh-khulafa-minhaj-1434 p. 543,558}."
