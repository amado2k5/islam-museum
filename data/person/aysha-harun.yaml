summary:
  ar: "منشئة محتوى كندية من أصل إثيوبي في الجمال ونمط الحياة؛ وُلدت ونشأت في تورونتو وبدأت قناتها على يوتيوب سنة 2011 في السادسة عشرة، فكانت من أوائل صانعات المحتوى السود المسلمات المحجبات في مجال الجمال؛ انتقلت إلى لوس أنجلوس سنة 2019، وأطلقت علامة ملابس «المظهر السعيد يناسبك»."
  en: "Ethiopian-Canadian beauty and lifestyle creator. Born and raised in Toronto, she started her YouTube channel in 2011 at sixteen and was among the earliest Black Muslim hijab-wearing beauty creators on the platform. She moved to Los Angeles in 2019 and has launched her own apparel line, Happy Looks Good On You."
  ur: "ایتھوپیائی نژاد کینیڈین بیوٹی اور لائف اسٹائل تخلیق کار؛ ٹورنٹو میں پیدا ہوئیں اور وہیں پلی بڑھیں، 2011 میں سولہ سال کی عمر میں یوٹیوب چینل شروع کیا اور پلیٹ فارم پر ابتدائی سیاہ فام مسلم باحجاب بیوٹی تخلیق کاروں میں شامل تھیں۔ 2019 میں لاس اینجلس منتقل ہوئیں اور اپنی ملبوسات کی لائن «ہیپی لکس گڈ آن یو» شروع کی۔"
