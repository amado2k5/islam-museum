summary:
  ar: "منشئة محتوى كندية من أصل إثيوبي في الجمال ونمط الحياة؛ وُلدت ونشأت في تورونتو وبدأت قناتها على يوتيوب سنة 2011 في السادسة عشرة، فكانت من أوائل صانعات المحتوى السود المسلمات المحجبات في مجال الجمال؛ انتقلت إلى لوس أنجلوس سنة 2019، وأطلقت علامة ملابس «المظهر السعيد يناسبك»."
  en: "Ethiopian-Canadian beauty and lifestyle creator. Born and raised in Toronto, she started her YouTube channel in 2011 at sixteen and was among the earliest Black Muslim hijab-wearing beauty creators on the platform. She moved to Los Angeles in 2019 and has launched her own apparel line, Happy Looks Good On You."
  ur: "ایتھوپیائی نژاد کینیڈین بیوٹی اور لائف اسٹائل تخلیق کار؛ ٹورنٹو میں پیدا ہوئیں اور وہیں پلی بڑھیں، 2011 میں سولہ سال کی عمر میں یوٹیوب چینل شروع کیا اور پلیٹ فارم پر ابتدائی سیاہ فام مسلم باحجاب بیوٹی تخلیق کاروں میں شامل تھیں۔ 2019 میں لاس اینجلس منتقل ہوئیں اور اپنی ملبوسات کی لائن «ہیپی لکس گڈ آن یو» شروع کی۔"
  es: "Creadora de contenido de belleza y estilo de vida etíope-canadiense. Nacida y criada en Toronto, comenzó su canal de YouTube en 2011 a los dieciséis años y fue una de las primeras creadoras de belleza negras musulmanas que usaban hiyab en la plataforma. Se mudó a Los Ángeles en 2019 y lanzó su propia línea de ropa, Happy Looks Good On You."
  fr: "Créatrice de contenu beauté et lifestyle éthiopienne-canadienne. Née et élevée à Toronto, elle a lancé sa chaîne YouTube en 2011 à l'âge de seize ans et a été parmi les premières créatrices de contenu beauté noires musulmanes portant le hijab sur la plateforme. Installée à Los Angeles depuis 2019, elle a lancé sa propre marque de vêtements, Happy Looks Good On You."
  tr: "Etiyopya kökenli güzellik ve yaşam tarzı alanında Kanadalı bir içerik üreticisi olan Sherly, Toronto'da doğup büyümüş, 2011 yılında on altı yaşında YouTube kanalını başlattı. Güzellik alanında başörtüsü takan ilk Siyah Müslüman içerik üreticilerinden biriydi; 2019'da Los Angeles'a taşındı ve \"Happy Looks Suit You\" adlı giyim markasını başlattı."
  id: "Seorang kreator konten asal Kanada yang berasal dari Ethiopia dalam bidang kecantikan dan gaya hidup; lahir dan besar di Toronto, ia memulai channel YouTube-nya pada tahun 2011 di usia enam belas tahun. Ia termasuk salah satu kreator konten Muslim kulit hitam pertama yang mengenakan hijab di bidang kecantikan; ia pindah ke Los Angeles pada tahun 2019 dan meluncurkan label pakaian \"Happy Looks Suit You.\""
