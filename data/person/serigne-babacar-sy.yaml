summary:
  ar: "عالم سنغالي (1885–1957)، ابن الحاج مالك سي وخليفته العام الأول على التيجانية في السنغال من سنة 1922 حتى وفاته. أسس في تيفاوان جماعات «الداهرة» (1932) التي نظمت أتباع الطريقة، وله قصائد ومؤلفات في السيرة وفي مدح أحمد التيجاني ووالده."
  en: "Senegalese scholar (1885-1957), son of El Hadj Malick Sy and his first khalifa-general over the Tijaniyya in Senegal, from 1922 until his death. At Tivaouane he founded the dahira associations (1932) that organised the order's followers, and he wrote poems and works on the Prophet's life, on Ahmad Tijani and on his father."
  ur: "سینیگال کے عالم (1885ء–1957ء)، الحاج مالک سی کے فرزند اور سینیگال میں تیجانیہ پر ان کے پہلے خلیفہ عام، 1922ء سے اپنی وفات تک۔ انہوں نے تیوان میں «داہرہ» انجمنیں (1932ء) قائم کیں جنہوں نے طریقے کے پیروکاروں کو منظم کیا، اور سیرت، احمد تیجانی اور اپنے والد پر نظمیں اور کتابیں لکھیں۔"
