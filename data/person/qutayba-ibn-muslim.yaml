label: { ar: "قتيبة بن مسلم الباهلي" }
summary:
  ar: "قائد في خراسان وما وراء النهر. ذكر الطبري صلحه مع ملك خوارزم وفتحه سمرقند {cite:tabari-tarikh-abu-al-fadl j.6 p.471} {cite:tabari-tarikh-abu-al-fadl j.6 p.472}، وفتحه بخارى {cite:tabari-tarikh-abu-al-fadl j.6 p.442} والطالقان {cite:tabari-tarikh-abu-al-fadl j.6 p.447} وكاشغر {cite:tabari-tarikh-abu-al-fadl j.6 p.500}، وذكر في سنة ست وتسعين مقتله بخراسان {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. عيّنه الحجاج على خراسان سنة 86هـ، وخاطب الناس خطبة موجزة تذكّرهم بالجهاد، وتتبّع الكتاب مراحل فتوحه: استعادة الطالقان والصغانيان وطخارستان سنة 86هـ، ثم فتح بخارى بين 87هـ و90هـ، ثم فتح سمرقند بين 90هـ و93هـ، وبلغ كاشغر متاخماً حدود الصين. {cite:salabi-umayyad-state-2020 p.88-91} ويذكر الكتاب أن قتيبة صالح أهل سمرقند بعد حصارها على ألفي ألف ومئتي ألف مثقال كل عام وثلاثين ألف رأس، ثم أحرق الأصنام بيده. وبلغ في فتوحه أقاليم الشاش وفرغانة وكاشغر سنة 94هـ، وأرسل وفداً إلى ملك الصين فأقرّ بالجزية بعد حوار يرويه الطبري. وقُتل في ذي الحجة سنة 96هـ بعد أن خلع طاعة سليمان بن عبد الملك، ولم تحدث بعده في المشرق فتوح تُذكر. {cite:salabi-umayyad-state-2020 p.92-101}"
  tr: "Horasan ve Transoksiana'da bir komutandı. El-Taberi, Harezmim kralı ile barışını ve Semerkand'ı fethetmesini anlattı {alıntı:Tabari-tarikh-abu-al-fadl j.6 s.471} {cite:tabari-tarikh-abu-al-fadl j.6 s.472}, Buhara'yı fethetmesi {cite:tabari-tarikh-abu-al-fadl j.6 s.442}, Taliqan {cite:tabari-tarikh-abu-al-fadl j.6 s.447}, Kaşgar {cite:tabari-tarikh-abu-al-fadl j.6 s.500} ve doksan altıncı yılda Horasan'da öldürüldüğünden bahsetmiştir {cite:tabari-tarikh-abu-al-fadl j.6 s.506}. El-Hacac, onu 86 Hicri yılında Horasan'a atadı ve halka cihadı hatırlatan kısa bir vaaz verdi. Kitap, fetihlerinin aşamalarını izliyordu: 86 Hicri'de Talaqan, Saghanlılar ve Toharistan'ın geri alınması, ardından 87 Hicri ile 90 Hicri arasında Buhara'nın fethi, ardından 90 H ile 93 Hile arasında Semerkand'ın Çin sınırına sınır komşusu olan Kaşgar'a ulaşması. {alıntı:) Selabi-Umayyad-Devlet-2020 s.88-91} Kitapta, Kuteybe Salih'in Semerkand'ı kuşattıktan sonra her yıl 2.200.000 mitkal ve 30.000 baş kaybettiğini, ardından kendi elleriyle putları yaktığını belirtir. 94 Hicri'de Şaş, Fergana ve Kaşgar vilayetlerine ulaştı ve Çin Kralı'na bir heyet gönderdi; burada el-Tabari'nin anlattığı bir diyalog sonrası cizyeyi kabul etti. 96 Hicri yılında, Süleyman bin Abdülmelik'in otoritesini bıraktıktan sonra Zhu'l-Hicce'de öldürüldü ve ondan sonra Doğu'da önemli bir fetih gerçekleşmedi. {cite:Selabi-Umayyad-State-2020 s.92-101}"
  id: "Seorang komandan di Khorasan dan Transoxiana. Al-Tabari menyebutkan perdamaian dengan raja Khwarezmim dan penaklukannya atas Samarkand {cite:tabari-tarikh-abu-al-fadl j.6 hlm.471} {cite:tabari-tarikh-abu-al-fadl j.6 hlm.472}, penaklukannya atas Bukhara {cite:tabari-tarikh-abu-al-fadl j.6 hlm.442}, Taliqan {cite:tabari-tarikh-abu-abu-al-fadl j.6 hlm.447}, Kashgar {cite:tabari-tarikh-abu-al-fadl j.6 hlm.500}, dan menyebutkan pembunuhannya di Khorasan pada tahun sembilan puluh enam {cite:tabari-tarikh-abu-al-fadl j.6 hlm.506}. Al-Hajjaj mengangkatnya sebagai pemimpin Khorasan pada tahun 86 H, dan menyampaikan khotbah singkat kepada rakyat yang mengingatkan mereka tentang jihad. Buku ini menelusuri tahapan penaklukannya: penaklukan kembali Talaqan, Saghanan, dan Tokharistan pada tahun 86 H, kemudian penaklukan Bukhara antara tahun 87 H dan 90 H, kemudian Samarkand antara 90 H dan 93 H, hingga Kashgar, berbatasan dengan perbatasan Tiongkok. {cite:salabi-umayyad-state-2020 hlm.88-91} Buku tersebut menyebutkan bahwa Qutayba Salih, setelah mengepung Samarkand, kehilangan 2.200.000 mithqal setiap tahun dan 30.000 kepala, lalu membakar patung dengan tangannya sendiri. Ia tiba di provinsi Shash, Fergana, dan Kashgar pada tahun 94 H, dan mengirim delegasi kepada Raja Tiongkok, di mana ia menerima jizya setelah dialog yang diceritakan oleh al-Tabari. Ia dibunuh di Dhu al-Hijjah pada tahun 96 H setelah melepaskan otoritas Sulayman ibn Abd al-Malik, dan setelahnya, tidak ada penaklukan signifikan yang terjadi di Timur. {cite:salabi-umayyad-state-2020 hlm.92-101}"
