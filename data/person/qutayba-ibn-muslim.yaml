id: person/qutayba-ibn-muslim
class: person
label: { ar: "قتيبة بن مسلم الباهلي" }
summary:
  ar: "قائد في خراسان وما وراء النهر. ذكر الطبري صلحه مع ملك خوارزم وفتحه سمرقند {cite:tabari-tarikh-abu-al-fadl j.6 p.471} {cite:tabari-tarikh-abu-al-fadl j.6 p.472}، وفتحه بخارى {cite:tabari-tarikh-abu-al-fadl j.6 p.442} والطالقان {cite:tabari-tarikh-abu-al-fadl j.6 p.447} وكاشغر {cite:tabari-tarikh-abu-al-fadl j.6 p.500}، وذكر في سنة ست وتسعين مقتله بخراسان {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. عيّنه الحجاج على خراسان سنة 86هـ، وخاطب الناس خطبة موجزة تذكّرهم بالجهاد، وتتبّع الكتاب مراحل فتوحه: استعادة الطالقان والصغانيان وطخارستان سنة 86هـ، ثم فتح بخارى بين 87هـ و90هـ، ثم فتح سمرقند بين 90هـ و93هـ، وبلغ كاشغر متاخماً حدود الصين. {cite:salabi-umayyad-state-2020 p.88-91} ويذكر الكتاب أن قتيبة صالح أهل سمرقند بعد حصارها على ألفي ألف ومئتي ألف مثقال كل عام وثلاثين ألف رأس، ثم أحرق الأصنام بيده. وبلغ في فتوحه أقاليم الشاش وفرغانة وكاشغر سنة 94هـ، وأرسل وفداً إلى ملك الصين فأقرّ بالجزية بعد حوار يرويه الطبري. وقُتل في ذي الحجة سنة 96هـ بعد أن خلع طاعة سليمان بن عبد الملك، ولم تحدث بعده في المشرق فتوح تُذكر. {cite:salabi-umayyad-state-2020 p.92-101}"
