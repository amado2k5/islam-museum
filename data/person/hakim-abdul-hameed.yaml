summary:
  ar: "حكيم عبد الحميد (1908–1999) طبيب هندي في الطب اليوناني، مؤسس مختبرات هامدارد وأمينها الرئيسي، والمستشار المؤسس لجامعة هامدارد، ومستشار جامعة عليكره الإسلامية (1996–1999)، نال جائزتي بادما شري وبادما بوشان."
  en: "Hakim Abdul Hameed (1908–1999) was an Indian physician of the Unani system of medicine, founder and chief trustee of Hamdard Laboratories, founder chancellor of Jamia Hamdard, and chancellor of Aligarh Muslim University (1996–1999); he received the Padma Shri and the Padma Bhushan."
  ur: "حکیم عبد الحمید (1908ء–1999ء) ہندوستانی طبیبِ یونانی تھے، ہمدرد لیبارٹریز کے بانی اور چیف ٹرسٹی، جامعہ ہمدرد کے بانی چانسلر اور علی گڑھ مسلم یونیورسٹی کے چانسلر (1996ء–1999ء) رہے؛ انھیں پدم شری اور پدم بھوشن سے نوازا گیا۔"
