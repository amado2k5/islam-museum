summary:
  ar: "سياسية وضابطة شرطة كوسوفية ألبانية وُلدت سنة 1975 في جاكوفا؛ صعدت في شرطة كوسوفو بعد الحرب حتى صارت نائبة مديرها برتبة جنرال، ثم انتُخبت سنة 2011 رئيسة لكوسوفو، أول امرأة وأول مرشح غير حزبي وأصغر من تولى المنصب، وبقيت فيه حتى 2016، وأسست بعدها مؤسسة ياهيغا."
  en: "Kosovo Albanian politician and police officer born in 1975 at Gjakova. She rose through the post-war Kosovo Police to deputy director with the rank of general, and in 2011 was elected President of Kosovo — its first woman president, first non-partisan candidate and youngest officeholder — serving until 2016 and afterwards founding the Jahjaga Foundation."
  ur: "کوسووہ کی البانوی سیاست دان و پولیس افسر، پیدائش 1975ء جاکووا میں۔ جنگ کے بعد کوسووہ پولیس میں ترقی کر کے جنرل کے عہدے کے ساتھ اس کی نائب ڈائریکٹر بنیں، پھر 2011ء میں کوسووہ کی صدر منتخب ہوئیں — اس کی پہلی خاتون صدر، پہلی غیر جانبدار امیدوار اور سب سے کم عمر عہدے دار — 2016ء تک اس منصب پر رہیں اور بعد میں یحیی آغا فاؤنڈیشن قائم کی۔"
