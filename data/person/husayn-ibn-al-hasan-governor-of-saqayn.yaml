id: person/husayn-ibn-al-hasan-governor-of-saqayn
class: person
label:
  ar: حسين بن الحسن والي ساقين
  en: Husayn ibn al-Hasan, governor of Saqayn
  ur: حسین بن حسن، والیِ ساقین
  es: "Husayn ibn al-Hasan, governor of Saqayn"
  fr: "Husayn ibn al-Hasan, governor of Saqayn"
summary:
  ar: من ولد العباس بن علي وابن عم محمد بن عبيد الله، كان والياً للهادي بساقين وخرج مع ابن عمه خائفين إلى صعدة.
  en: Of the line of al-Abbas ibn Ali and a cousin of Muhammad ibn Ubaydallah, governor for al-Hadi at Saqayn, who went out in fear with his cousin to Sa'da.
  ur: عباس بن علی کی اولاد سے اور محمد بن عبید اللہ کے چچازاد، ساقین میں ہادی کے والی، جو اپنے چچازاد کے ساتھ خوف کے عالم میں صعدہ گئے۔
  es: "De la estirpe de al-Abbas ibn Ali y primo de Muhammad ibn Ubaydallah, gobernador de al-Hadi en Saqayn, quien huyó atemorizado con su primo a Sa'da."
  fr: "De la lignée d'al-Abbas ibn Ali et cousin de Muhammad ibn Ubaydallah, gouverneur d'al-Hadi à Saqayn, qui partit par peur avec son cousin à Sa'da."
  tr: "El-Abbas bin Ali'nin oğlu ve iki bacaklı El-Hadi valisi olan Muhammed bin Ubeyd Allah'ın kuzeni olarak doğdu ve kuzeniyle birlikte korkuyla Saada'ya gitti."
  id: "Ia lahir dari Al-Abbas ibn Ali dan sepupu Muhammad ibn Ubayd Allah, yang merupakan gubernur Al-Hadi dengan dua kaki dan pergi bersama sepupunya dengan penuh ketakutan ke Saada."
