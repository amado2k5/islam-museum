summary:
  ar: "أحمد حسني حتقاي ضابط مخابرات أردني من أصل شركسي، يدير دائرة المخابرات العامة منذ ١ أيار ٢٠١٩ برتبة لواء؛ قضى نحو ثلاثة عقود داخل الدائرة، وأدار مكتب مكافحة الإرهاب ومديرية الشؤون الخارجية ومخابرات عمّان قبل أن يصبح نائبًا للمدير سنة ٢٠١٧. لا يُعرف تاريخ مولده الدقيق علنًا، وتذكر ويكي بيانات سنة 1969."
  en: "Ahmad Husni Hatoqay is a Jordanian intelligence officer of Circassian descent who has directed the General Intelligence Department since 1 May 2019 with the rank of major general; he spent about three decades inside the department, directing its Counterterrorism Bureau, its Directorate of Foreign Affairs and its Amman directorate before becoming deputy director in 2017. His exact birth date is not publicly reported; Wikidata gives the year 1969."
  ur: "احمد حسنی حتقائی چرکسی نژاد اردنی انٹیلی جنس افسر ہیں جو یکم مئی 2019 سے جنرل انٹیلی جنس ڈیپارٹمنٹ کے ڈائریکٹر ہیں؛ انھوں نے تقریباً تین دہائیاں محکمے میں گزاریں، انسداد دہشت گردی اور خارجہ امور کے شعبے سنبھالے، اور 2017 میں نائب ڈائریکٹر بنے۔ ان کی درست تاریخ پیدائش عوامی طور پر معلوم نہیں؛ وکی ڈیٹا میں سن 1969 درج ہے۔"
