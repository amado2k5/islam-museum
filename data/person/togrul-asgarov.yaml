summary:
  ar: "مصارع أذربيجاني في المصارعة الحرة، وُلد في كنجه سنة 1992؛ بطل أولمبي في لندن 2012 ⁦(60 كغ)⁩ وصاحب فضية ريو 2016 ⁦(65 كغ)⁩، وبطل أوروبا 2012 وبطل الألعاب الأوروبية 2015، وأُوقف سنة واحدة في 2017 لمخالفة قواعد المنشطات."
  en: "Azerbaijani freestyle wrestler, born in Ganja in 1992. Olympic champion at London 2012 (60 kg) and silver medallist at Rio 2016 (65 kg), European champion in 2012 and European Games champion in 2015; he was disqualified for one year in 2017 for a doping-rules violation."
  ur: "آذربائیجانی فری اسٹائل پہلوان، 1992 میں گنجہ میں پیدا ہوئے؛ لندن 2012 کے اولمپک چیمپئن ⁦(60 کلو)⁩، ریو 2016 کے چاندی کے تمغہ یافتہ، 2012 کے یورپی چیمپئن اور 2015 کے یورپی کھیلوں کے چیمپئن؛ 2017 میں ڈوپنگ قوانین کی خلاف ورزی پر ایک سال کے لیے نااہل قرار پائے۔"
  es: "Luchador de estilo libre azerbaiyano, nacido en Ganja en 1992. Campeón olímpico en Londres 2012 (60 kg) y medallista de plata en Río 2016 (65 kg), campeón europeo en 2012 y campeón de los Juegos Europeos en 2015; fue descalificado por un año en 2017 por una violación de las reglas de dopaje."
  fr: "Lutteur azerbaïdjanais de style libre, né à Ganja en 1992. Champion olympique à Londres en 2012 (60 kg) et médaillé d'argent à Rio en 2016 (65 kg), champion d'Europe en 2012 et champion des Jeux européens en 2015; il a été disqualifié pendant un an en 2017 pour violation des règles antidopage."
  tr: "1992'de Kinghe'de doğan Azerbaycanlı serbest stil güreşçi; 2012 Londra Olimpiyat şampiyonu (60 kg), Rio 2016'da gümüş madalya (65 kg), 2012 Avrupa Şampiyonu ve 2015 Avrupa Oyunları şampiyonu olup, doping kurallarını ihlal ettiği için 2017'de bir yıl süre ceza aldı."
  id: "Pegulat gaya bebas asal Azerbaijan, lahir di Kinghe pada tahun 1992; juara Olimpiade di London 2012 (60 kg), peraih medali perak di Rio 2016 (65 kg), Juara Eropa 2012, dan juara European Games 2015, serta diskors selama satu tahun pada 2017 karena melanggar peraturan doping."
