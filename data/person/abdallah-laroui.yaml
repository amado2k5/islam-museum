summary:
  ar: "مؤرخ وفيلسوف وروائي مغربي، وُلد سنة 1933. من أبرز مثقفي المغرب العربي، دافع عن المنهج التاريخي في الفكر العربي وألّف تاريخًا مرجعيًا للمغرب، ومن كتبه «الإيديولوجيا العربية المعاصرة» و«تاريخ المغرب» و«مفهوم الدولة»."
  en: "Moroccan historian, philosopher and novelist, born in 1933. One of the Maghreb’s leading intellectuals, he championed historicism in Arab thought and wrote a reference history of Morocco, authoring Contemporary Arab Ideology, The History of the Maghrib and The Concept of the State."
  fr: "Historien, philosophe et romancier marocain, né en 1933. L'un des principaux intellectuels du Maghreb, il défendit l'historicisme dans la pensée arabe et écrivit une histoire de référence du Maroc ; il est l'auteur de L'Idéologie arabe contemporaine, de L'Histoire du Maghreb et du Concept de l'État."
  ur: "مراکشی مؤرخ، فلسفی اور ناول نگار، 1933 میں پیدا ہوئے اور مغرب العرب کے ممتاز مثقفین میں ہیں۔ انہوں نے عرب فکر میں تاریخی منہج کی وکالت کی اور مراکش کی حوالہ جاتی تاریخ لکھی؛ کتب میں معاصر عرب نظریہ، تاریخ المغرب اور مفہوم الدولۃ شامل ہیں۔"
  es: "Historiador, filósofo y novelista marroquí, nacido en 1933. Uno de los intelectuales más destacados del Magreb, defendió el historicismo en el pensamiento árabe y escribió una obra de referencia sobre la historia de Marruecos, entre las que se incluyen Ideología árabe contemporánea, Historia del Magreb y El concepto de Estado."
