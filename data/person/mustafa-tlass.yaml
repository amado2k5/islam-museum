  ar: "ضابط وسياسي سوري شغل منصب وزير الدفاع من 1972 حتى 2004 في عهد حافظ الأسد ثم بشار الأسد، وكان من أقرب رجاله إليه؛ وهو أيضًا مؤلف وناشر، أثارت بعض كتبه وتصريحاته جدلًا واسعًا، وهو والد العميد المنشق مناف طلاس."
  en: "Syrian officer and politician who served as minister of defence from 1972 to 2004 under Hafez al-Assad and then Bashar al-Assad, and was one of Assad's most trusted loyalists. He was also an author and publisher whose books and public statements drew wide controversy. He is the father of the defected general Manaf Tlass."
