summary:
  ar: "راقصة بريك أفغانية، وُلدت في كابل سنة 2002، وتُعرف تنافسياً باسم بي-غيرل تلاش. وُصفت بأنها أول راقصة بريك أفغانية؛ فرّت إلى باكستان بعد سيطرة طالبان سنة 2021 ثم استقرت في إسبانيا، وشاركت مع فريق اللاجئين الأولمبي في باريس 2024، حيث استُبعدت بموجب القاعدة 50 من ميثاق الأولمبياد لرفعها عباءة كُتب عليها حرروا النساء الأفغانيات."
  en: "Afghan breakdancer, born in Kabul in 2002, known competitively as B-Girl Talash. Described as Afghanistan's first female breakdancer, she fled to Pakistan after the Taliban takeover in 2021 and settled in Spain. She competed for the Refugee Olympic Team at Paris 2024, where she was disqualified under Rule 50 of the Olympic Charter for displaying a cape reading 'Free Afghan Women'."
  ur: "افغان بریک ڈانسر، 2002 میں کابل میں پیدا ہوئیں، مقابلے میں بی گرل تلاش کے نام سے جانی جاتی ہیں۔ انہیں افغانستان کی پہلی خاتون بریک ڈانسر کہا گیا؛ 2021 میں طالبان کے اقتدار کے بعد وہ پاکستان گئیں اور پھر اسپین میں آباد ہوئیں۔ انہوں نے پیرس 2024 میں مہاجر اولمپک ٹیم کی طرف سے حصہ لیا، جہاں «آزاد افغان خواتین» لکھی چادر دکھانے پر اولمپک چارٹر کے قاعدہ 50 کے تحت نااہل قرار پائیں۔"
