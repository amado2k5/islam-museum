summary:
  ar: "جنرال وسياسي مالي (وُلد 1983) من باماكو، قاد انقلاب أغسطس 2020 الذي أطاح بالرئيس إبراهيم أبو بكر كيتا ورأس اللجنة الوطنية لإنقاذ الشعب، ثم صار نائبا مؤقتا للرئيس باه نداو قبل أن يستولي على السلطة في مايو 2021 ويصير رئيسا مؤقتا، ومنذ 2025 رئيسا سادسا لمالي بلا انتخابات؛ وفي عهده انسحبت مالي من الإيكواس وتشكّل تحالف دول الساحل، وقطعت مالي علاقاتها العسكرية مع فرنسا وتحالفت مع روسيا."
  en: "Malian general and politician (born 1983) from Bamako who led the August 2020 coup that overthrew President Ibrahim Boubacar Keïta and chaired the National Committee for the Salvation of the People, then served as interim vice president under Bah Ndaw before seizing power in May 2021 and becoming interim president; since 2025 he has been Mali's sixth president without an election. Under his rule Mali withdrew from ECOWAS, the Alliance of Sahel States was formed, and Mali cut military ties with France and allied itself with Russia."
  ur: "مالی جنرل و سیاست دان (پیدائش 1983ء)، باماکو سے؛ اگست 2020ء کی بغاوت کی قیادت کی جس نے صدر ابراہیم بوبکر کیتا کو ہٹایا اور نیشنل کمیٹی فار دی سالویشن آف دی پیپل کی سربراہی کی، پھر باہ نداو کے تحت عبوری نائب صدر رہے، اس کے بعد مئی 2021ء میں اقتدار پر قبضہ کر کے عبوری صدر بنے، اور 2025ء سے مالی کے چھٹے صدر ہیں۔"
