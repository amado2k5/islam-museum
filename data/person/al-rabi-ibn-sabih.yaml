id: person/al-rabi-ibn-sabih
class: person
label: { ar: "الربيع بن صبيح الفقيه", en: "al-Rabi' ibn Sabih the Jurist", fr: "al-Rabi‘ ibn Sabih, le juriste", es: "al-Rabi' ibn Sabih the Jurist", ur: "ربیع ابن صبیح فقیہ" }
summary:
  ar: "الربيع بن صبيح الفقيه مولى بني سعد؛ يروي عن الحسن البصري؛ جمع مالاً من أهل البصرة فحصن به عبادان ورابط فيها ثم خرج غازياً إلى الهند في البحر فمات فدفن في جزيرة من الجراثر سنة ١٦٠."
  en: "Al-Rabi' ibn Sabih, mawla of Banu Sa'd and narrator from al-Hasan al-Basri; he gathered Basran money, fortified Abbadan, raided from it, then sailed against India and died — buried on a Jarathir island in 160h."
  fr: "Al-Rabi' ibn Sabih, mawla de Banu Sa'd et narrateur d'al-Hasan al-Basri ; il a rassemblé l'argent Basran, fortifié Abbadan, a fait une descente, puis a navigué contre l'Inde et est mort - enterré sur une île Jarathir en 160h."
  es: "Al-Rabi' ibn Sabih, mawla de Banu Sa'd y narrador de al-Hasan al-Basri; reunió dinero de Basora, fortificó Abadán, saqueó la ciudad, luego navegó contra la India y murió; fue enterrado en una isla de Jarathir en el año 160 de la Hégira."
  ur: "الربیع بن صبیح، بنو سعد کے مولا اور حسن البصری سے راوی؛ اس نے بسران کا پیسہ اکٹھا کیا، آبادان کو مضبوط کیا، اس سے چھاپہ مارا، پھر ہندوستان کے خلاف کشتی رانی کی اور مر گیا - 160ھ میں جزیرے جراتیر میں دفن ہوا۔"
  tr: "Banu Sa'd'ın özgür kasabası El-Rabi' ibn Subayh el-Fekih; el-Hasan el-Basri'den şöyle der: Basra halkından servet topladı, Abadan'ı bununla güçlendirdi ve orada yerleşti. Sonra deniz yoluyla Hindistan'a fatih olarak gitti, orada öldü ve 160 Hicri yılında El-Ceretir adasına defnedildi."
  id: "Al-Rabi' ibn Subaih al-Faqih, mantan Banu Sa'd; menceritakan dari al-Hasan al-Basri: Ia mengumpulkan kekayaan dari rakyat Basra, memperkuat Abadan dengan harta itu, dan menetap di sana. Kemudian ia pergi sebagai penakluk ke India melalui laut, di mana ia meninggal, dan dimakamkan di sebuah pulau Al-Jarathir pada tahun 160 H."
