id: person/al-iylani-muzaffar
class: person
label: { ar: "مظفر الدين العيلاني العروضي الأعمى" }
summary:
  ar: "أبو العز موفق الدين مظفر بن إبراهيم بن جماعة بن علي بن شامي بن أحمد بن ناهض بن عبد الرزاق العيلاني بالعين المهملة نسبة إلى قيس عيلان؛ الحنبلي الأديب الشاعر العروضي الضرير المصري؛ ولد لخمس بقين من جمادى الآخرة سنة أربع وأربعين وخمسمائة بمصر وسمع الحديث من أبي القاسم بن البستي وابن الصابوني وأبي طاهر السلفي والبوصيري وغيرهم ولقي جماعة من الأدباء وقال الشعر الجيد وبرع في علم العروض وصنف فيه تصنيفاً مشهوراً دل على حذقه؛ أجاب من سأله كيف يعشق وهو أعمى بأبياته المشهورة «أهوى بجارحة السمع ولا أرى ذات المسمى»؛ توفي بمصر سحرة يوم السبت من المحرم سنة ثلاث وعشرين وستمائة ودفن بسفح المقطم {cite:shadharat-dhahab p. 111-112}."
  en: "Muwaffaq al-Din Muzaffar al-Iylani — Egypt's blind prosodist, born 544, whose celebrated arud treatise proved his mastery and whose rejoinder to 'how can a blind man love?' — 'أهوى بجارحة السمع ولا أرى ذات المسمى' — became proverb; he once solved at a sitting Ibn Khallikan's puzzle of an Abbasid-era verse-form quoted by Abu al-Ala; died dawn Muharram 623, buried at Muqattam's foot {cite:shadharat-dhahab p. 111-112}."
