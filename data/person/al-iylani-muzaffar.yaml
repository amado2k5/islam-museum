id: person/al-iylani-muzaffar
class: person
label: { ar: "مظفر الدين العيلاني العروضي الأعمى", en: "Muzaffar al-Din al-Iylani, the blind prosodist", es: "Muzaffar al-Din al-Iylani, the blind prosodist", fr: "Muzaffar al-Din al-Iylani, the blind prosodist", ur: "مظفرالدین الیلیانی، نابینا پروسوڈسٹ" }
summary:
  ar: "أبو العز موفق الدين مظفر بن إبراهيم بن جماعة بن علي بن شامي بن أحمد بن ناهض بن عبد الرزاق العيلاني بالعين المهملة نسبة إلى قيس عيلان؛ الحنبلي الأديب الشاعر العروضي الضرير المصري؛ ولد لخمس بقين من جمادى الآخرة سنة أربع وأربعين وخمسمائة بمصر وسمع الحديث من أبي القاسم بن البستي وابن الصابوني وأبي طاهر السلفي والبوصيري وغيرهم ولقي جماعة من الأدباء وقال الشعر الجيد وبرع في علم العروض وصنف فيه تصنيفاً مشهوراً دل على حذقه؛ أجاب من سأله كيف يعشق وهو أعمى بأبياته المشهورة «أهوى بجارحة السمع ولا أرى ذات المسمى»؛ توفي بمصر سحرة يوم السبت من المحرم سنة ثلاث وعشرين وستمائة ودفن بسفح المقطم {cite:shadharat-dhahab p. 111-112}."
  en: "Muwaffaq al-Din Muzaffar al-Iylani — Egypt's blind prosodist, born 544, whose celebrated arud treatise proved his mastery and whose rejoinder to 'how can a blind man love?' — 'أهوى بجارحة السمع ولا أرى ذات المسمى' — became proverb; he once solved at a sitting Ibn Khallikan's puzzle of an Abbasid-era verse-form quoted by Abu al-Ala; died dawn Muharram 623, buried at Muqattam's foot {cite:shadharat-dhahab p. 111-112}."
  es: "Muwaffaq al-Din Muzaffar al-Iylani — el prosodista ciego de Egipto, nacido en 544, cuyo célebre tratado arud demostró su maestría y cuya réplica a \"¿cómo puede amar un ciego?\" — \"Ahuwi bjarhah al-sam' wala ari zaat al-musmi' — se convirtió en proverbio; una vez resolvió sentado el enigma de Ibn Khallikan sobre una forma de verso de la era abasí citada por Abu al-Ala; murió al amanecer de Muharram 623, enterrado al pie de Muqattam {cite:shadharat-dhahab p. 111-112}."
  fr: "Muwaffaq al-Din Muzaffar al-Iylani — le prosodiste aveugle d'Égypte, né en 544, dont le célèbre traité d'arud a prouvé sa maîtrise et dont la réponse à « comment un aveugle peut-il aimer ? » — « Ahuwi bjarhah al-sam' wala ari zaat al-musmi' » — est devenue un proverbe; il a un jour résolu, assis, l'énigme d'Ibn Khallikan concernant une forme de vers de l'époque abbasside citée par Abu al-Ala; est mort à l'aube de Muharram 623, enterré au pied de Muqattam {cite:shadharat-dhahab p. 111-112}."
  ur: "موفق الدین مظفر الیلیانی - مصر کے نابینا ماہر، 544 میں پیدا ہوئے، جن کے مشہور ارود مقالے نے ان کی مہارت کو ثابت کیا اور جس کا جواب تھا کہ 'ایک اندھا کیسے محبت کر سکتا ہے؟' - 'احوی بجراح الصام' ولا عری ذات المسمی' - کہاوت بن گئی۔ اس نے ایک دفعہ ابن خلیقان کی ایک بیٹھی ہوئی عباسی دور کی آیت کی پہیلی کو حل کیا جس کا حوالہ ابو الاعلٰی نے دیا ہے۔ محرم 623 کی فجر میں وفات پائی، مقطم کے قدموں میں دفن ہوئے۔ 111-112}۔"
  tr: "Ebu el-İzz Muwafaq al-Din Muzaffar ibn İbrahim ibn Cemaah ibn Ali ibn Şami ibn Ahmed ibn Nahid ibn Abd al-Razzaq al-Aylani (el-'Ayn al-Muhammala), Qays Aylan'ın adını taşıyan; Hanbali edebi figür, şair, prosodik ve kör Mısırlı; Cemade el-Ahira'dan beş yüz elli yıl önce Mısır'da doğmuş, Ebu el-Kasım ibn el-Busti'den hadis duymuştur n al-Sabuni, Abu Tahir al-Selefi, al-Busiri ve diğerleri. Bir grup yazarla tanıştı, iyi şiirler yazdı, prosodiya ustalığı yaptı ve bu eserde ustalığını gösteren ünlü bir eser yazdı. Körken nasıl aşık olduğunu soranlara ünlü dizeleriyle şöyle cevap verdi: \"Kulağı ağrıtan ve çağrılanı görmeyenleri severim.\" 623 Hicri yılında Mısır'da Cumartesi günü Muharrem'de büyücü olarak öldü ve Mokattam'ın eteğine defnedildi {alıntı:) Shadharat-Dhahab s. 111-112}."
  id: "Abu al-Izz Muwafaq al-Din Muzaffar ibn Ibrahim ibn Jama'ah ibn Ali ibn Shami ibn Ahmad ibn Nahid ibn Abd al-Razzaq al-Aylani (al-'Ayn al-Muhammala), dinamai menurut Qays Aylan; tokoh sastra Hanbali, penyair, prosodik, dan orang Mesir buta; lahir lima ratus lima puluh tahun sebelum Jumada al-Akhirah di Mesir, ia mendengar hadis dari Abu al-Qasim ibn al-Busti, ibn al-Sabuni, Abu Tahir al-Salafi, al-Busiri, dan lainnya. Ia bertemu sekelompok penulis, menulis puisi yang baik, unggul dalam prosodi, dan menulis karya terkenal di dalamnya yang menunjukkan keahliannya. Ia menjawab mereka yang bertanya bagaimana ia jatuh cinta ketika buta dengan ayat-ayat terkenalnya: \"Aku mencintai orang yang menyakiti telinga dan tidak melihat orang yang dipanggil.\" Ia meninggal di Mesir sebagai penyihir pada hari Sabtu di bulan Muharram tahun 623 H dan dimakamkan di kaki Mokattam {cite:Shadharat-Dhahab hlm. 111-112}."
