summary:
  ar: "عالم بنغلاديشي تعدّه قاعدة سكوبس من أبرز الباحثين في الجوت في العالم. ارتبط طويلا بهيئة الطاقة الذرية البنغلاديشية وارتقى فيها إلى المدير العام، وهو المستشار العلمي لمؤسسة مصانع الجوت البنغلاديشية. من اختراعاته «سونالي باغ»، بديل قابل للتحلل من سليلوز الجوت لأكياس البوليثين، و«جوتين»، ألواح مموجة مقوّاة بالجوت. نال جائزة الاستقلال، أعلى وسام مدني في بنغلاديش، سنة 2024."
  en: "Bangladeshi scientist recognised by Scopus as a leading researcher on jute. Long associated with the Bangladesh Atomic Energy Commission, where he rose to director general, he is scientific adviser to the Bangladesh Jute Mills Corporation. His inventions include the Sonali Bag, a biodegradable jute-cellulose alternative to polythene bags, and Jutin, a jute-reinforced corrugated sheet. He received the Independence Award, Bangladesh's highest civilian honour, in 2024."
  ur: "بنگلہ دیشی سائنس دان جنھیں سکوپس نے پٹ سن (جوٹ) پر دنیا کے نمایاں محققین میں شمار کیا ہے۔ وہ طویل عرصہ بنگلہ دیش جوہری توانائی کمیشن سے وابستہ رہے اور اس کے ڈائریکٹر جنرل بنے؛ اب بنگلہ دیش جوٹ ملز کارپوریشن کے سائنسی مشیر ہیں۔ ان کی ایجادات میں سونالی بیگ، جو پالیتھین تھیلوں کا جوٹ سیلیولوز سے بنا قابلِ تحلیل متبادل ہے، اور جوٹن، جوٹ سے مضبوط نالی دار چادر، شامل ہیں۔ انھیں 2024ء میں بنگلہ دیش کا سب سے بڑا شہری اعزاز، یوم آزادی ایوارڈ، ملا۔"
