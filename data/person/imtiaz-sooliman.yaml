summary:
  ar: طبيب وفاعل خير جنوب أفريقي، أسس في بيترماريتزبرغ سنة 1992 منظمة «غيفت أوف ذا غيفرز» (وقف الواقفين) التي أصبحت أكبر وكالة إغاثة عند الكوارث أفريقية المنشأ، وقاد عملياتها في عشرات البلدان.
  en: South African physician and philanthropist who founded Gift of the Givers (Waqful Waqifin) in Pietermaritzburg in 1992 and built it into the largest disaster-response agency of African origin, leading its relief work in dozens of countries.
  ur: جنوبی افریقی طبیب اور فلاح کار جنہوں نے 1992 میں پیٹرماریٹزبرگ میں «گفٹ آف دی گورز» (وقف الواقفین) قائم کی اور اسے افریقی بنیاد کی سب سے بڑی آفات رسپانس ایجنسی بنایا۔
