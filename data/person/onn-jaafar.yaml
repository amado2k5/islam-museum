summary:
  ar: "سياسي ملايوي (1895–1962) أسس المنظمة الوطنية للملايويين المتحدين (أمنو) سنة 1946 وقاد المعارضة لاتحاد الملايو البريطاني، فعُدّ رائد القومية الملايوية المنظمة. كان رئيس وزراء جوهر (1947–1950)، ثم غادر أمنو سنة 1951 اعتراضًا على سياساتها العرقية فأسس حزب استقلال الملايو ثم حزب الوطن."
  en: "Malayan politician (1895–1962) who founded the United Malays National Organisation (UMNO) in 1946 and led the opposition to the Malayan Union, and is regarded as the pioneer of organised Malay nationalism. He was Menteri Besar of Johor (1947–1950), then left UMNO in 1951 over its communal policies and founded the Independence of Malaya Party and later Parti Negara."
  ur: "ملایہ کے سیاست دان (1895ء–1962ء) جنہوں نے 1946ء میں یونائیٹڈ ملایز نیشنل آرگنائزیشن (امنو) کی بنیاد رکھی اور ملایہ یونین کی مخالفت کی قیادت کی؛ انہیں منظم ملایہ قوم پرستی کا بانی سمجھا جاتا ہے۔ وہ جوہر کے وزیر اعلیٰ (1947ء–1950ء) رہے، پھر 1951ء میں امنو کی فرقہ وارانہ پالیسیوں پر اختلاف کر کے اسے چھوڑ دیا اور انڈیپینڈنس آف ملایہ پارٹی اور بعد میں پارٹی نگارا قائم کی۔"
