summary:
  ar: "الأصولي المتكلم العلامة نزيل مصر؛ اشتغل بأصفهان في حياة أبيه نائب السلطنة حتى فاق نظراءه، فلما استولى العدو على أصفهان رحل إلى بغداد فأخذ الفقه عن سراج الدين الهرقلي وبالعلوم عن تاج الدين الأرموي، ثم ذهب إلى الروم إلى أثير الدين الأبهري فأخذ عنه الجدل والحكمة، ثم دخل القاهرة وولي قضاء قوص خلافة عن القاضي تاج الدين ابن بنت الأعز فباشره مباشرة حسنة، ودرّس بالشافعي ومشهد الحسين؛ شرح «المحصول» وله «الفوائد في العلوم الأربعة» و«غاية المطلب» في المنطق؛ وقيل إن ابن دقيق العيد كان بحضر درسه بقوص {cite:shadharat-dhahab p. 710-711}."
  en: "The usuli-mutakallim — driven from Isfahan by the conquest to Baghdad, then Rum to Athir al-Din al-Abhari, then Cairo and the qada of Qus; author of the Mahsul sharh and Fawa'id fi al-'ulum al-arba'a {cite:shadharat-dhahab p. 710-711}."
