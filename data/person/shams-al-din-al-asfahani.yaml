summary:
  ar: "الأصولي المتكلم العلامة نزيل مصر؛ اشتغل بأصفهان في حياة أبيه نائب السلطنة حتى فاق نظراءه، فلما استولى العدو على أصفهان رحل إلى بغداد فأخذ الفقه عن سراج الدين الهرقلي وبالعلوم عن تاج الدين الأرموي، ثم ذهب إلى الروم إلى أثير الدين الأبهري فأخذ عنه الجدل والحكمة، ثم دخل القاهرة وولي قضاء قوص خلافة عن القاضي تاج الدين ابن بنت الأعز فباشره مباشرة حسنة، ودرّس بالشافعي ومشهد الحسين؛ شرح «المحصول» وله «الفوائد في العلوم الأربعة» و«غاية المطلب» في المنطق؛ وقيل إن ابن دقيق العيد كان بحضر درسه بقوص {cite:shadharat-dhahab p. 710-711}."
  en: "The usuli-mutakallim — driven from Isfahan by the conquest to Baghdad, then Rum to Athir al-Din al-Abhari, then Cairo and the qada of Qus; author of the Mahsul sharh and Fawa'id fi al-'ulum al-arba'a {cite:shadharat-dhahab p. 710-711}."
  es: "Los usuli-mutakallim, expulsados de Isfahán por la conquista a Bagdad, luego Rum a Athir al-Din al-Abhari, luego El Cairo y el qada de Qus; autor de Mahsul sharh y Fawa'id fi al-'ulum al-arba'a {cita: shadharat-dhahab p. 710-711}."
  fr: "Les usuli-mutakallim — chassés d'Ispahan par la conquête vers Bagdad, puis de Roum vers Athir al-Din al-Abhari, puis du Caire et du qada de Qus; auteur du Mahsul sharh et du Fawa'id fi al-'ulum al-arba'a {cite:shadharat-dhahab p. 710-711}."
  ur: "اصولی متکلم - فتح کے ذریعے اصفہان سے بغداد، پھر رم سے اثیرالدین العباری، پھر قاہرہ اور قس کی قضا؛ محصور شارح و فوائد اور العلوم العربیہ کے مصنف 710-711}۔"
  tr: "Usul al-Dakim'in alimi ve alimi, Mısır'da ikamet eden Isfahan, babasının yaşamı boyunca İsfahan'da vekil sultan olarak çalıştı ve akranlarını geride bıraktı. Düşman İsfahan'ı ele geçirdiğinde Bağdat'a giderek Siraj al-Din al-Harqali'den ve Taceddin el-Armavi'den fıkıh eğitimi aldı. Sonra Romalıların yanına Athir al-Din al-Abhari'nin yanında gitti, burada münazara ve bilgelik öğrendi. Kahire'ye girdi ve Hacı Taceddin bin bint el-A'zz'ın ardından Kus yargısını devraldı; Yargıç Hasan ile başladı ve el-Şafii ile Meşhed el-Hüseyin'den ders verdi; ayrıca mantık alanında 'El-Fava'id fi 'Ülüm el-Erba'a' ve 'Ghayat el-Muttalib' eserlerini yazdı. İbn Daqiq el-'Id'in Kus derslerine katıldığı söylenir. {atıf: Shadharat-Dhahab, s. 710-711}."
  id: "Cendekiawan dan ulama Usul al-Dhakim serta penduduk Mesir; ia bekerja di Isfahan selama masa hidup ayahnya sebagai wakil sultan hingga melampaui rekan-rekannya. Ketika musuh menguasai Isfahan, ia pergi ke Baghdad dan belajar hukum di bawah Siraj al-Din al-Harqali serta ilmu pengetahuan di bawah Taj al-Din al-Armawi. Kemudian ia pergi ke Romawi di bawah Athir al-Din al-Abhari, di mana ia belajar debat dan kebijaksanaan. Kemudian ia masuk Kairo dan mengambil alih kehakiman Qus di bawah kepemimpinan Hakim Taj al-Din ibn bint al-A'zz, yang memulai studinya dengan Hasan dan mengajar di bawah bimbingan al-Shafi'i dan Mashhad al-Husayn; ia juga menulis 'Al-Fawa'id fi al-'Ulum al-Arba'a' dan 'Ghayat al-Muttalib' secara logika. Dikatakan bahwa Ibn Daqiq al-'Id mengikuti pelajarannya dalam Qus {cite:Shadharat-Dhahab, hlm. 710-711}."
