summary:
  ar: "الشاعر الشيعي، هجا المعتصم بقصيدته المشهورة ملوك بني العباس في الكتب سبعة لم تأتنا في ثامن منهم الكتب حتى شببه بكلب أهل الكهف وهجا وصيفاً وأشناس، ثم نذر به المعتصم فخاف وهرب حتى قدم مصر ثم خرج إلى المغرب {cite:tarikh-khulafa-minhaj-1434 p. 521-522}."
  en: "The Shi'ite poet; he lampooned al-Mu'tasim in his famous qasida — 'the Abbasid kings in the books are seven... like the cave-dwellers, seven plus a dog, and I rate their dog above you' — satirizing Wasif and Ashinas too. Al-Mu'tasim vowed against him; he fled to Egypt, then the Maghreb {cite:tarikh-khulafa-minhaj-1434 p. 521-522}."
