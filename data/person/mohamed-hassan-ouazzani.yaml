summary:
  ar: "صحفي وسياسي مغربي (1910–1978)، وُلد بفاس ودرس بها ثم بباريس، وكان من قادة الحركة الوطنية المغربية: أسس سنة 1933 جريدة «عمل الشعب»، أول جريدة وطنية ناطقة بالفرنسية، وشارك علال الفاسي تأسيس كتلة العمل الوطني سنة 1934 قبل أن يختلف معه ويقود حركته الخاصة. نفته فرنسا إلى جنوب المغرب من 1937 إلى 1946، فأسس عند عودته حزب الشورى والاستقلال (حزب الاستقلال الديمقراطي) مطالبًا بالاستقلال الكامل وبدستور ملكي دستوري. صار وزير دولة سنة 1961، وفقد يده اليمنى في محاولة الانقلاب سنة 1971 فتعلم الكتابة باليسرى، وتوفي بفاس سنة 1978."
  en: "Moroccan journalist and politician (1910–1978), born at Fez and educated there and in Paris, and one of the leaders of the Moroccan national movement: in 1933 he founded L'Action du Peuple, the first French-language nationalist newspaper in Morocco, and in 1934 he co-founded the Moroccan Action Committee with Allal al-Fassi before parting from him to lead his own movement. France deported him to the Moroccan south from 1937 to 1946; on his return he founded the Democratic Independence Party, demanding full independence and a constitutional monarchy. He became a minister of state in 1961, lost his right hand in the 1971 coup attempt and learned to write with his left, and died at Fez in 1978."
  ur: "مغربی صحافی اور سیاست دان (1910–1978)، فاس میں پیدا ہوئے اور وہیں اور پیرس میں تعلیم پائی، اور مغربی قومی تحریک کے رہنماؤں میں سے تھے: 1933ء میں انھوں نے «عمل الشعب» اخبار جاری کیا، جو مغرب کا پہلا فرانسیسی زبان قوم پرست اخبار تھا، اور 1934ء میں علال الفاسی کے ساتھ کتلہ عملِ وطنی کی تاسیس میں شریک ہوئے، پھر ان سے الگ ہو کر اپنی تحریک کی قیادت کی۔ فرانس نے 1937ء سے 1946ء تک انھیں مغرب کے جنوب میں جلاوطن رکھا؛ واپسی پر انھوں نے حزبِ شورىٰ و استقلال قائم کیا جو مکمل آزادی اور آئینی بادشاہت کا مطالبہ کرتا تھا۔ 1961ء میں وزیرِ مملکت بنے، 1971ء کی بغاوت کی کوشش میں دایاں ہاتھ گنوایا اور بائیں ہاتھ سے لکھنا سیکھا، اور 1978ء میں فاس میں وفات پائی۔"
