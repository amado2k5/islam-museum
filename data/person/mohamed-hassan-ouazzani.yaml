summary:
  ar: "صحفي وسياسي مغربي (1910–1978)، وُلد بفاس ودرس بها ثم بباريس، وكان من قادة الحركة الوطنية المغربية: أسس سنة 1933 جريدة «عمل الشعب»، أول جريدة وطنية ناطقة بالفرنسية، وشارك علال الفاسي تأسيس كتلة العمل الوطني سنة 1934 قبل أن يختلف معه ويقود حركته الخاصة. نفته فرنسا إلى جنوب المغرب من 1937 إلى 1946، فأسس عند عودته حزب الشورى والاستقلال ⁦(حزب الاستقلال الديمقراطي)⁩ مطالبًا بالاستقلال الكامل وبدستور ملكي دستوري. صار وزير دولة سنة 1961، وفقد يده اليمنى في محاولة الانقلاب سنة 1971 فتعلم الكتابة باليسرى، وتوفي بفاس سنة 1978."
  en: "Moroccan journalist and politician (1910–1978), born at Fez and educated there and in Paris, and one of the leaders of the Moroccan national movement: in 1933 he founded L'Action du Peuple, the first French-language nationalist newspaper in Morocco, and in 1934 he co-founded the Moroccan Action Committee with Allal al-Fassi before parting from him to lead his own movement. France deported him to the Moroccan south from 1937 to 1946; on his return he founded the Democratic Independence Party, demanding full independence and a constitutional monarchy. He became a minister of state in 1961, lost his right hand in the 1971 coup attempt and learned to write with his left, and died at Fez in 1978."
  ur: "مغربی صحافی اور سیاست دان (1910–1978)، فاس میں پیدا ہوئے اور وہیں اور پیرس میں تعلیم پائی، اور مغربی قومی تحریک کے رہنماؤں میں سے تھے: 1933ء میں انھوں نے «عمل الشعب» اخبار جاری کیا، جو مغرب کا پہلا فرانسیسی زبان قوم پرست اخبار تھا، اور 1934ء میں علال الفاسی کے ساتھ کتلہ عملِ وطنی کی تاسیس میں شریک ہوئے، پھر ان سے الگ ہو کر اپنی تحریک کی قیادت کی۔ فرانس نے 1937ء سے 1946ء تک انھیں مغرب کے جنوب میں جلاوطن رکھا؛ واپسی پر انھوں نے حزبِ شورىٰ و استقلال قائم کیا جو مکمل آزادی اور آئینی بادشاہت کا مطالبہ کرتا تھا۔ 1961ء میں وزیرِ مملکت بنے، 1971ء کی بغاوت کی کوشش میں دایاں ہاتھ گنوایا اور بائیں ہاتھ سے لکھنا سیکھا، اور 1978ء میں فاس میں وفات پائی۔"
  es: "Periodista y político marroquí (1910-1978), nacido en Fez y educado allí y en París, fue uno de los líderes del movimiento nacional marroquí: en 1933 fundó L'Action du Peuple, el primer periódico nacionalista en francés de Marruecos, y en 1934 cofundó el Comité de Acción Marroquí con Allal al-Fassi antes de separarse de él para liderar su propio movimiento. Francia lo deportó al sur de Marruecos entre 1937 y 1946; a su regreso fundó el Partido de la Independencia Democrática, exigiendo la independencia total y una monarquía constitucional. Fue nombrado ministro de Estado en 1961, perdió la mano derecha en el intento de golpe de Estado de 1971 y aprendió a escribir con la izquierda, y falleció en Fez en 1978."
  fr: "Journaliste et homme politique marocain (1910-1978), né à Fès et formé dans cette ville et à Paris, il fut l'un des chefs de file du mouvement national marocain. En 1933, il fonda L'Action du Peuple, premier journal nationaliste francophone du Maroc, et en 1934, il co-fonda le Comité d'action marocain avec Allal al-Fassi avant de s'en séparer pour diriger son propre mouvement. Déporté par la France dans le sud du Maroc de 1937 à 1946, il fonda à son retour le Parti démocratique de l'indépendance, revendiquant la pleine indépendance et une monarchie constitutionnelle. Nommé ministre d'État en 1961, il perdit sa main droite lors de la tentative de coup d'État de 1971 et apprit à écrire de la main gauche. Il mourut à Fès en 1978."
  tr: "Faslı gazeteci ve politikacı (1910–1978), önce Fiz'de doğup önce Paris'te eğitim görmüştü; Fas ulusal hareketinin liderlerinden biriydi: 1933'te Fransızca ilk ulusal gazete olan \"Amal Al-Shaab\"ı kurdu ve 1934'te Ulusal Hareket Bloku'nu kuran Allal El Fassi'nin kurucularından oldu, ancak onunla anlaşmazlıkla kendi hareketini yönetti. Fransa onu 1937-1946 yılları arasında güney Fas'a sürgün etti ve dönüşünde tam bağımsızlık ve anayasal monarşi talep eden Şura ve İstiklal Partisi'ni (Demokratik Bağımsızlık Partisi) kurdu. 1961'de Devlet Bakanı oldu, 1971'de bir darbe girişiminde sağ elini kaybetti, sol eliyle yazmayı öğrendi ve 1978'de Fes'te öldü."
  id: "Seorang jurnalis dan politisi Maroko (1910–1978), lahir dan dididik di Fez dan kemudian di Paris, ia adalah salah satu pemimpin gerakan nasional Maroko: pada tahun 1933, ia mendirikan surat kabar \"Amal Al-Shaab,\" surat kabar nasional pertama dalam bahasa Prancis, dan ikut mendirikan Allal El Fassi dalam mendirikan Blok Aksi Nasional pada tahun 1934 sebelum tidak setuju dengannya dan memimpin gerakannya sendiri. Prancis mengasingkannya ke Maroko selatan dari tahun 1937 hingga 1946, dan setelah kembali, ia mendirikan Partai Shura dan Istiqlal (Partai Kemerdekaan Demokratik), menuntut kemerdekaan penuh dan monarki konstitusional. Ia menjadi Menteri Negara pada tahun 1961, kehilangan tangan kanannya dalam upaya kudeta pada tahun 1971, belajar menulis dengan tangan kiri, dan meninggal di Fez pada tahun 1978."
