summary:
  ar: "يوسف علي كيناديد (1837 – 14 أغسطس 1911)، سلطان صومالي ومؤسس سلطنة هوبيو وأول سلاطينها. نشأ في أسرة ماجرتين دارود في علولة، ولم يكن من نسل الأسرة الحاكمة قبله فجمع ثروته بنفسه وصار قائدا عسكريا، ولقّبه خصومه «كيناديد» أي «الذي يأبى أن يُلجَم». سعى أولا إلى سلطنة ماجرتين المجاورة ففشل ونُفي إلى اليمن، ثم عاد في سبعينيات القرن التاسع عشر بقوة من الحضارم فغلب عشائر هبر غدر وأسس سلطنة هوبيو سنة 1878. عقد سنة 1889 معاهدة حماية مع إيطاليا بشروط تمنع تدخلها في إدارة سلطنته، ثم ساءت العلاقة حين رفض إنزال قوة بريطانية في بلاده لمطاردة الدراويش، فنفته إيطاليا إلى عدن ثم إريتريا مع ابنه وولي عهده علي يوسف. توفي في هوبيو سنة 1911 فخلفه ابنه علي يوسف. وهو والد عثمان يوسف كيناديد مخترع الخط العثماني للغة الصومالية."
  en: "Yusuf Ali Kenadid (1837 – 14 August 1911), Somali sultan, founder and first Sultan of the Sultanate of Hobyo. Born into a Majeerteen Darod family at Alula, he was no lineal descendant of the preceding dynasty: he amassed his own fortune and became a military leader, and his rivals gave him the title Kenadid, 'he who refuses to be haltered'. He first sought the neighbouring Majeerteen Sultanate, failed and was exiled to Yemen, then returned in the 1870s with a Hadrami force, overpowered the Habar Gidir clans and founded the Sultanate of Hobyo in 1878. In 1889 he concluded a protectorate treaty with Italy whose terms barred Italian interference in his administration; relations later soured when he refused to let a British contingent land in his sultanate to pursue the Dervishes, and Italy exiled him to Aden and then Eritrea, with his son and heir Ali Yusuf. He died at Hobyo in 1911 and was succeeded by his son Ali Yusuf. He was also the father of Osman Yusuf Kenadid, inventor of the Osmanya script for Somali."
  ur: "یوسف علی کینادید (1837ء – 14 اگست 1911ء)، صومالی سلطان اور سلطنت ہوبیو کے بانی اور پہلے سلطان۔ علولہ کے ماجرتین دارود خاندان میں پیدا ہوئے، سابق حکمران خاندان کی نسل سے نہ تھے، اپنی دولت خود بنائی اور فوجی قائد بنے؛ مخالفوں نے انہیں «کینادید» یعنی «لگام سے انکاری» کا لقب دیا۔ پہلے ہمسایہ ماجرتین سلطنت کی کوشش میں ناکام ہو کر یمن جلا وطن ہوئے، پھر 1870ء کی دہائی میں حضرمی دستے کے ساتھ واپس آ کر ہبر گدر قبائل پر غالب آئے اور 1878ء میں سلطنت ہوبیو قائم کی۔ 1889ء میں اٹلی سے ایسا معاہدہ تحفظ کیا جس میں اطالوی مداخلت ممنوع تھی، بعد میں درویشوں کے تعاقب کے لیے برطانوی دستے کو اترنے کی اجازت سے انکار پر تعلقات بگڑے تو اٹلی نے انہیں بیٹے علی یوسف سمیت عدن پھر اریٹریا جلا وطن کیا۔ 1911ء میں ہوبیو میں وفات پائی اور بیٹے علی یوسف جانشین ہوئے۔ وہ عثمان یوسف کینادید کے والد بھی تھے جنہوں نے صومالی کے لیے عثمانیہ رسم الخط ایجاد کیا۔"
