summary:
  ar: "مقاتل فنون قتالية مختلطة نيجيري-نيوزيلندي وملاكم كيك بوكسينغ سابق (وُلد سنة 1989 في لاغوس ونشأ في روتوروا). بطل يو إف سي للوزن المتوسط مرتين: وحّد اللقب سنة 2019 ودافع عنه خمس مرات في فترته الأولى، ثم استعاده سنة 2023 فصار أول بطل لوزن الوسط مرتين، وخسره في سبتمبر 2023. عُرض فيلم وثائقي عنه بعنوان «ستايل بندر» في مهرجان تريبيكا سنة 2023."
  en: "Nigerian-New Zealander mixed martial artist and former kickboxer (born 1989 in Lagos, raised in Rotorua). Two-time UFC middleweight champion: he unified the title in 2019 and defended it five times in his first reign, then regained it in 2023 as the division's first two-time champion, losing it in September 2023. A documentary about him, Stylebender, premiered at Tribeca in 2023."
  ur: "نائیجیریائی-نیوزی لینڈ مخلوط مارشل آرٹسٹ اور سابق کک باکسر (پیدائش 1989، لاگوس؛ پرورش روٹوروا)۔ دو بار یو ایف سی مڈل ویٹ چیمپئن: 2019 میں خطاب یکجا کیا اور پہلی مدت میں پانچ بار دفاع کیا، پھر 2023 میں اسے دوبارہ حاصل کر کے ڈویژن کے پہلے دو بار چیمپئن بنے؛ ستمبر 2023 میں خطاب ہار گئے۔ ان پر دستاویزی فلم «اسٹائل بینڈر» 2023 میں ٹریبیکا میں دکھائی گئی۔"
