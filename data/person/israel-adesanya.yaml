summary:
  ar: "مقاتل فنون قتالية مختلطة نيجيري-نيوزيلندي وملاكم كيك بوكسينغ سابق ⁦(وُلد سنة 1989 في لاغوس ونشأ في روتوروا)⁩. بطل يو إف سي للوزن المتوسط مرتين: وحّد اللقب سنة 2019 ودافع عنه خمس مرات في فترته الأولى، ثم استعاده سنة 2023 فصار أول بطل لوزن الوسط مرتين، وخسره في سبتمبر 2023. عُرض فيلم وثائقي عنه بعنوان «ستايل بندر» في مهرجان تريبيكا سنة 2023."
  en: "Nigerian-New Zealander mixed martial artist and former kickboxer (born 1989 in Lagos, raised in Rotorua). Two-time UFC middleweight champion: he unified the title in 2019 and defended it five times in his first reign, then regained it in 2023 as the division's first two-time champion, losing it in September 2023. A documentary about him, Stylebender, premiered at Tribeca in 2023."
  ur: "نائیجیریائی-نیوزی لینڈ مخلوط مارشل آرٹسٹ اور سابق کک باکسر ⁦(پیدائش 1989، لاگوس؛ پرورش روٹوروا)⁩۔ دو بار یو ایف سی مڈل ویٹ چیمپئن: 2019 میں خطاب یکجا کیا اور پہلی مدت میں پانچ بار دفاع کیا، پھر 2023 میں اسے دوبارہ حاصل کر کے ڈویژن کے پہلے دو بار چیمپئن بنے؛ ستمبر 2023 میں خطاب ہار گئے۔ ان پر دستاویزی فلم «اسٹائل بینڈر» 2023 میں ٹریبیکا میں دکھائی گئی۔"
  es: "Luchador de artes marciales mixtas y ex kickboxer nigeriano-neozelandés (nacido en 1989 en Lagos, criado en Rotorua). Dos veces campeón de peso mediano de la UFC: unificó el título en 2019 y lo defendió cinco veces en su primer reinado, para luego recuperarlo en 2023 como el primer bicampeón de la división, perdiéndolo en septiembre de 2023. Un documental sobre él, Stylebender, se estrenó en Tribeca en 2023."
  fr: "Combattant de MMA et ancien kickboxeur nigérian-néo-zélandais (né en 1989 à Lagos, a grandi à Rotorua). Double champion des poids moyens de l'UFC: il a unifié le titre en 2019 et l'a défendu cinq fois lors de son premier règne, avant de le reconquérir en 2023, devenant ainsi le premier double champion de la catégorie, avant de le perdre en septembre 2023. Un documentaire sur sa vie, Stylebender, a été présenté en avant-première au festival de Tribeca en 2023."
  tr: "Nijerya-Yeni Zelandalı karma dövüş sanatları dövüşçüsü ve eski kickboksör (1989'da Lagos'ta doğdu ve Rotorua'da büyüdü). İki kez UFC orta sıklet şampiyonu: 2019'da unvanını birleştirdi ve ilk periyodunda beş kez savundu, ardından 2023'te tekrar kazanarak ilk iki kez orta sıklet şampiyonu oldu ve Eylül 2023'te kaybetti. Hakkında \"Style Bender\" adlı belgesel film 2023'te Tribeca Festivali'nde gösterildi."
  id: "Petarung seni bela diri campuran Nigeria-Selandia Baru dan mantan kickboxer (lahir 1989 di Lagos dan dibesarkan di Rotorua). Juara kelas menengah UFC dua kali: menyatukan gelar pada 2019 dan mempertahankannya lima kali di periode pertamanya, lalu merebutnya kembali pada 2023 menjadi juara kelas menengah dua kali pertama, kalah pada September 2023. Film dokumenter tentang dirinya berjudul \"Style Bender\" diputar di Festival Tribeca pada 2023."
