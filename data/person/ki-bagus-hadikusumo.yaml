summary:
  ar: "عالم وسياسي إندونيسي (1890–1954)، من أسرة موظفي بلاط يوجياكارتا وتعليم المعاهد الشرعية، رأس المحمدية (1942–1953) خلفًا لماس منصور، وشارك في تأسيس حزب إندونيسيا الإسلامي والماشومي، وعضو لجنة التحقيق للاستقلال (BPUPKI) الذي دافع بشدة عن ميثاق جاكرتا وعن «السيليا» أساسًا للدولة، وله مؤلفات منها «الإسلام أساسًا للدولة». سُمّي بطلًا قوميًّا سنة 2015."
  en: "Indonesian scholar and politician (1890–1954) from a Yogyakarta court-official family, educated in the pesantren, who chaired Muhammadiyah (1942–1953) in succession to Mas Mansoer, helped found the Indonesian Islamic Party and Masyumi, and sat in the BPUPKI independence committee, where he argued hard for the Jakarta Charter and the sila as the basis of the state; his books include 'Islam as the Basis of the State'. He was named a National Hero in 2015."
  ur: "انڈونیشی عالم اور سیاست دان (1890ء–1954ء)، یوگیاکارتا کے درباری اہلکار خاندان سے اور مدارس میں تعلیم یافتہ، محمدیہ کے صدر (1942ء–1953ء) ماس منصور کے جانشین رہے، انڈونیشی اسلامی پارٹی اور ماشومی کے قیام میں حصہ لیا، اور آزادی کمیٹی (BPUPKI) کے رکن کی حیثیت سے جکارتا چارٹر اور ریاست کی بنیاد کے لیے بھرپور بحث کی؛ ان کی کتابوں میں «اسلام ریاست کی بنیاد» شامل ہے۔ 2015ء میں قومی ہیرو قرار پائے۔"
