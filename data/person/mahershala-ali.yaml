summary:
  ar: "ممثل أمريكي، وُلد في أوكلاند سنة 1974 باسم ماهرشالالحشباز غيلمور؛ أول ممثل مسلم يفوز بجائزة الأوسكار، إذ نال جائزة أفضل ممثل مساعد عن «مونلايت» (2016) و«الكتاب الأخضر» (2018)، واشتهر بأدوار في «هاوس أوف كاردز» و«المحقق الحقيقي». اعتنق الإسلام سنة 2000 وغيّر اسمه الأخير إلى علي، ويُسجَّل انتماؤه الأحمدي كما تذكره المصادر."
  en: "American actor, born in Oakland in 1974 as Mahershalalhashbaz Gilmore. He is the first Muslim actor to win an Academy Award, taking Best Supporting Actor for Moonlight (2016) and Green Book (2018), and is known for House of Cards and True Detective. He converted to Islam in 2000, changing his surname from Gilmore to Ali, and his Ahmadi affiliation is recorded exactly as the sources give it."
  ur: "امریکی اداکار، 1974 میں اوکلینڈ میں مہرشالحشباز گلمور کے نام سے پیدا ہوئے؛ آسکر جیتنے والے پہلے مسلمان اداکار، جنہیں «مون لائٹ» (2016) اور «گرین بک» (2018) پر بہترین معاون اداکار کا ایوارڈ ملا۔ انہوں نے 2000 میں اسلام قبول کیا اور اپنا خاندانی نام گلمور سے بدل کر علی رکھا، اور ان کا احمدی انتساب اسی طرح درج ہے جیسا کہ ماخذ بیان کرتے ہیں۔"
