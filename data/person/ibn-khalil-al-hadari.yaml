summary:
  ar: "الشيخ تقي الدين ابن خليل الحضري الحلبي؛ أول شغل أباه التجارةُ ثم اشتغل هو بالعلم وأخذ عن العلاء الكافياجي والكرمي والمرجاني وغيرهم، ووعظ وتصدّر وأذكى قلوبَ إخوانه وأصحابه بالدليل والبرهان لا بالتقليد والجزم والحَدِث والترّهات، وكان يكثّر دعوته على من تجنّب عن حلق اللحية وكان مستقيماً مع شدة أدبه، ووعظ بالجامع الأموي في الاجتماع الأخير عند المشايخ، وانتهى إليه الرياسة بحلب وتعليم التدريس، وله ابن رومي حار في حلاوة طبعه فأقام معه أشهراً وتعلم على يديه؛ مات في محرم سنة ثلاث عشرة وتسعمائة {cite:shadharat-dhahab p. 466}."
  en: "Aleppo's preacher 'who stirred hearts by argument, not imitation' — students of al-Kafiyaji, he campaigned against shaved beards, preached at the Umayyad mosque, and ended as the city's riyasa; an Anatolian disciple spent months catching his sweet temperament; d. Muharram 913 {cite:shadharat-dhahab p. 466}."
