summary:
  ar: "سياسي هندي مسلم من ميروت (آب 1884 – 28 حزيران 1958)، من قادة رابطة مسلمي عموم الهند البارزين ومن آباء حركة باكستان المؤسسين. تعلّم في تونبريدج وكلية سانت جون بكامبريدج وتدرّب محاميًا في المعبد الداخلي، وقاد رابطة البنجاب المتحدة للرابطة من 1930 إلى 1947، وشارك في صياغة قرار باكستان (1940)، وتولّى نيابة رئاسة جامعة عليكرة الإسلامية مرتين، واختار بعد التقسيم البقاء في الهند، ومات في ميروت ودُفن في مقبرة الأسرة عند ضريح نظام الدين في دلهي."
  en: "Indian Muslim politician of Meerut (August 1884 – 28 June 1958), a leading figure of the All-India Muslim League and a founding father of the Pakistan Movement. Educated at Tonbridge and St John's College, Cambridge and called to the Bar at the Inner Temple, he led the United Provinces Muslim League from 1930 to 1947, helped draft the Pakistan Resolution (1940), twice served as vice-chancellor of Aligarh Muslim University, chose to remain in India after Partition, died at Meerut and was buried in the family graveyard at the Nizamuddin shrine in Delhi."
  ur: "میرٹھ کے ہندوستانی مسلمان سیاست دان (اگست 1884 – 28 جون 1958)، آل انڈیا مسلم لیگ کے سرکردہ رہنما اور تحریک پاکستان کے بانی اراکین میں سے ایک۔ ٹونبرج اور سینٹ جانز کالج، کیمبرج سے تعلیم پائی اور انر ٹیمپل سے بیرسٹر بنے؛ 1930 سے 1947 تک متحدہ صوبوں کی مسلم لیگ کی قیادت کی، قرارداد پاکستان (1940) کی تدوین میں حصہ لیا، دو مرتبہ علی گڑھ مسلم یونیورسٹی کے وائس چانسلر رہے، تقسیم کے بعد ہندوستان میں رہنے کا فیصلہ کیا، میرٹھ میں وفات پائی اور دہلی میں نظام الدین کے مزار کے پاس خاندانی قبرستان میں دفن ہوئے۔"
