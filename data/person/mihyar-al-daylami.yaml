issue:
  ar: 'من مصدر ثانٍ: أنه أسلم سنة ٢٩٤ وصار رافضياً غالياً يذكر الصحابة بما لا يصلح،
    وأن ابن برهان قال له انتقلت بإسلامك في النار من زاوية إلى زاوية؛ وخبأ ألف دينار
    في هِميان ثوبه فدلت عليه خادمته فقبضه جلال الدولة ثم أطلقه {cite:muntazam-ibn-al-jawzi
    j.8 p.436-437}.'
