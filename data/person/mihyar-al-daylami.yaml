summary:
  ar: مهيار بن مرزويه الكاتب الفارسي الديلمي، الشاعر المشهور؛ كان مجوسياً فأسلم على
    يد الشريف الرضي أبي الحسن الموسوي سنة أربع وتسعين وثلاثمائة وهو شيخه الذي نظم
    على يديه الشعر؛ شاعر جزل القول مقدم على أهل وقته، له ديوان كبير يدخل في أربع مجلدات،
    وكان يحضر جامع المنصور ببغداد في أيام الجمعة يُقرأ عليه ديوانه؛ أثنى عليه الخطيب
    البغدادي وابن بسّام صاحب الذخيرة {cite:wafayat-ayan}.
  en: Mihyar b. Marzuya — the celebrated Daylamite poet; a former Zoroastrian who
    converted at the hands of al-Sharif al-Radi in 394 and modeled his verse on his
    master's; author of a large diwan; praised by al-Khatib al-Baghdadi and Ibn Bassam
    {cite:wafayat-ayan}.
  es: "Mihyar b. Marzuya — el célebre poeta daylamita; un antiguo zoroastriano que se convirtió por medio de al-Sharif al-Radi en 394 y modeló su poesía a partir de la de su maestro; autor de un gran diwan; elogiado por al-Khatib al-Baghdadi e Ibn Bassam {cite:wafayat-ayan}."
  fr: "Mihyar b. Marzuya — le célèbre poète daylamite; un ancien zoroastrien qui se convertit sous l'influence d'al-Sharif al-Radi en 394 et modela ses vers sur ceux de son maître; auteur d'un grand diwan; loué par al-Khatib al-Baghdadi et Ibn Bassam {cite:wafayat-ayan}."
  ur: "میہیار بی۔ مرزویا — مشہور دیلامائٹ شاعر؛ ایک سابق زرتشتی جس نے 394 میں الشریف الرادی کے ہاتھوں مذہب تبدیل کیا اور اپنی آیت کو اپنے آقا کے مطابق بنایا۔ ایک بڑے دیوان کے مصنف؛ جس کی تعریف الخطیب البغدادی اور ابن بسام نے کی ہے۔"
  tr: "Daylamiteli Fars yazarı ve ünlü şair Mihyar ibn Marzawayh, 394 Hicri yılında Şerif el-Radi Ebu el-Hasan el-Musavi'den İslam'a geçen bir Magiye'ydi. Şiirin yazıldığı öğretmendi; zamanının insanlarına öncülük eden hitabet şairiydi. Dört ciltlik büyük bir koleksiyonu vardı ve Cuma günleri Bağdat'taki El-Mansur Camii'ne gidip orada divanını okurdu. El-Hatib el-Bağdadi ve Dhakira {atıf:vafayat-ayan} yazarı İbn Bassam tarafından övüldü."
  id: "Mihyar ibn Marzawayh, penulis Persia dari Daylamit dan penyair terkenal, adalah seorang Magian yang memeluk Islam dari Sharif al-Radi Abu al-Hasan al-Mousawi pada tahun 394 H. Ia adalah gurunya yang menyusun puisi; seorang penyair yang fasih, memimpin rakyat pada zamannya. Ia memiliki koleksi besar dalam empat jilid, dan ia biasa menghadiri Masjid Al-Mansur di Baghdad setiap hari Jumat untuk membaca Diwan di sana. Ia dipuji oleh Al-Khatib Al-Baghdadi dan Ibn Bassam, penulis Dhakira {cite:wafayat-ayan}."
