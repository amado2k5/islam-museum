summary:
  ar: "مهيار بن مرزويه الكاتب الفارسي الديلمي، الشاعر المشهور؛ كان مجوسياً فأسلم على يد الشريف الرضي أبي الحسن الموسوي سنة أربع وتسعين وثلاثمائة وهو شيخه الذي نظم على يديه الشعر؛ شاعر جزل القول مقدم على أهل وقته، له ديوان كبير يدخل في أربع مجلدات، وكان يحضر جامع المنصور ببغداد في أيام الجمعة يُقرأ عليه ديوانه؛ أثنى عليه الخطيب البغدادي وابن بسّام صاحب الذخيرة {cite:wafayat-ayan}."
  en: "Mihyar b. Marzuya — the celebrated Daylamite poet; a former Zoroastrian who converted at the hands of al-Sharif al-Radi in 394 and modeled his verse on his master's; author of a large diwan; praised by al-Khatib al-Baghdadi and Ibn Bassam {cite:wafayat-ayan}."
