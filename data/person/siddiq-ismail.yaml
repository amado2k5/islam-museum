summary:
  ar: قارئ نعت وتحميد باكستاني وُلد سنة 1954 في كراتشي؛ يتلو النعت والحمد منذ أكثر من خمسين عامًا بأكثر من عشر لغات، وظهر في التلفزيون الباكستاني عقودًا ونال جوائز وطنية.
  en: Pakistani naat and hamd reciter born in Karachi in 1954; he has performed devotional poetry for more than fifty years in over ten languages, appeared on Pakistani television for decades, and received
    national honours.
  ur: پاکستانی نعت و حمد خواں جو 1954 میں کراچی میں پیدا ہوا؛ پچاس سے زائد برسوں سے دس سے زیادہ زبانوں میں نعت خوانی کرتا ہے، دہائیوں تک پاکستانی ٹی وی پر حاضر رہا اور قومی اعزازات پائے۔
  es: "Recitador pakistaní de naat y hamd, nacido en Karachi en 1954; ha interpretado poesía devocional durante más de cincuenta años en más de diez idiomas, apareció en la televisión pakistaní durante décadas y recibió honores nacionales."
  fr: "Récitation de naat et de hamd pakistanais, née à Karachi en 1954; il a interprété de la poésie dévotionnelle pendant plus de cinquante ans dans plus de dix langues, est apparu à la télévision pakistanaise pendant des décennies et a reçu des distinctions nationales."
  tr: "1954 yılında Karaçi'de doğmuş, Pakistanlı bir övgü ve övgü okuyan Sculo, elli yılı aşkın süredir on dilde övgüler ve övgüler okumuş, Pakistan televizyonunda onlarca yıl yer almış ve ulusal ödüller kazanmıştır."
  id: "Seorang pembaca eulogi dan pujian asal Pakistan, lahir pada tahun 1954 di Karachi; ia telah membacakan eulogi dan pujian selama lebih dari lima puluh tahun dalam lebih dari sepuluh bahasa, tampil di televisi Pakistan selama puluhan tahun, dan menerima penghargaan nasional."
