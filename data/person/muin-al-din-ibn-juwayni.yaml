summary:
  ar: "الصاحب الكبير ابن شيخ الشيوخ صدر الدين الجويني؛ ولى عدة مناصب وتقدم عند صاحب مصر، فأمره على جيشه الذي حاصر دمشق فأخذها، وولى وعزل وعمل نيابة السلطنة، فبغته الأجل بعد أربعة أشهر {cite:shadharat-dhahab p. 226}."
  en: "Son of shaykh al-shuyukh Sadr al-Din al-Juwayni (d. Ramadan 643) — the commander the lord of Egypt set over the army that besieged and took Damascus in 637; acting sultan for four months, then death took him unawares {cite:shadharat-dhahab p. 226}."
  es: "Hijo del jeque al-shuyukh Sadr al-Din al-Juwayni (fallecido en Ramadán de 643) — el comandante que el señor de Egipto puso al frente del ejército que sitió y tomó Damasco en 637; sultán interino durante cuatro meses, luego la muerte lo sorprendió inesperadamente {cita: shadharat-dhahab p. 226}."
  fr: "Fils du cheikh al-shuyukh Sadr al-Din al-Juwayni (mort en Ramadan 643) — le commandant que le seigneur d'Égypte a placé à la tête de l'armée qui a assiégé et pris Damas en 637; sultan par intérim pendant quatre mois, puis la mort l'a pris au dépourvu {cite:shadharat-dhahab p. 226}."
  ur: "شیخ الشیوخ صدرالدین الجوینی کا بیٹا ⁦(متوفی رمضان 643)⁩ - کمانڈر مصر کے آقا نے فوج پر مقرر کیا جس نے 637 میں دمشق کا محاصرہ کیا اور قبضہ کر لیا۔ چار مہینے تک سلطان قائم رہے، پھر موت نے اسے بے خبری میں لے لیا 226}۔"
  tr: "Büyük yoldaş, Şeyh al-Shuyukh Sadr al-Din al-Juwayni'nin oğlu, Mısır hükümdarının emrinde çeşitli mevkiler elinde tuttu ve ilerledi. Şam'ı kuşatan ordusunu yönetmesini emretti, o da Şam'ı ele geçirdi. Sultanlık vekili olarak atandı, görevden alındı ve atandı, ancak ölümü dört ay sonra başına geldi {atıf:shadharat-dhahab, s. 226}."
  id: "Sahabat besar itu, putra Sheikh al-Shuyukh Sadr al-Din al-Juwayni, memegang beberapa posisi dan maju di bawah penguasa Mesir. Ia memerintahkan Shadharat memimpin pasukannya yang mengepung Damaskus, yang kemudian ia rebut. Ia diangkat, diberhentikan, dan diangkat sebagai wakil kesultanan, namun kematiannya menimpa setelah empat bulan {cite:shadharat-dhahab, hlm. 226}."
