label: { ar: "أبو يزيد المكلف البربري", en: "Abu Yazid Makhlad" }
summary:
  ar: "أبو يزيد المحتسب واسمه مخلد بن كيداد البربري الزناتي من بني يفرن الإباضي النكاري ويعرف بصاحب الحمار، خرج على الحسن القائم بالأمر بعد عبيد الله فكثر أتباعه ومعاونوه فحاربه وحصره في المهدية إلى أن مات الحسن في الجصار فقام بعده ابنه إسماعيل ويكنى أبا طاهر فأظهر تعظيم الشريعة وأظهر أبو يزيد مذهب الإباضية فأقبل عنه الناس فقتل وصلب وذلك في سنة ست وثلاثين وثلاثمائة {cite:fihrist-ibn-al-nadim p. 265-266}."
  en: "Abu Yazid Makhlad ibn Kaydad — the Ibadi Berber rebel besieged in al-Mahdiyya, crucified 336 {cite:fihrist-ibn-al-nadim}"
sources: [source/fihrist-ibn-al-nadim]
