label: { ar: "أبو يزيد المكلف البربري", en: "Abu Yazid Makhlad" }
summary:
  ar: "أبو يزيد المحتسب واسمه مخلد بن كيداد البربري الزناتي من بني يفرن الإباضي النكاري ويعرف بصاحب الحمار، خرج على الحسن القائم بالأمر بعد عبيد الله فكثر أتباعه ومعاونوه فحاربه وحصره في المهدية إلى أن مات الحسن في الجصار فقام بعده ابنه إسماعيل ويكنى أبا طاهر فأظهر تعظيم الشريعة وأظهر أبو يزيد مذهب الإباضية فأقبل عنه الناس فقتل وصلب وذلك في سنة ست وثلاثين وثلاثمائة {cite:fihrist-ibn-al-nadim p. 265-266}. وعند ابن الأثير استولى على القيروان ورقادة سنة 333هـ فقتل خليلاً عاملها ونهبها وقتل وسبى ولما شكا إليه شيوخ أهلها قال وما يكون خرّبت مكة وبيت المقدس، وأرسل سرية إلى سوسة ففاحوها بالسيف وقتلوا الرجال وسبوا النساء وأحرقوها وشقوا فروج النساء وبقروا البطون حتى لم يبق موضع في إفريقية معمور ولا سقف مرفوع، وقتل ميسوراً قائد القائم وطيف برأسه بالقيروان ثم حاصر المهدية فنزل على خمسة عشر ميلاً منها وبث سراياه {cite:kamil-ibn-al-athir p. 316-318}، وعند ابن خلدون وهو أبو يزيد مخلد بن كيراد؛ كان أبوه كيراد من أهل تسطيلة من مدائن بلد توزر يختلف إلى بلاد السودان بالتجارة وبها ولد أبو يزيد ونشأ بتوزر وتعلم القرآن وخالط النكارية من الخوارج وهم الصفرية فمال إلى مذهبهم ثم سافر إلى تاهرت وأقام يعلم الصبيان ثم تقيوس فأقام يعلم فيها، ولما مات المهدي خرج بناحية جبل أوراس وركب الحمار وتلقب بشيخ المؤمنين ودعا للناصر وأهدى له رجل من أهل مرماجنة حماراً أشهب فكان يركبه وبه لقب وكان يلبس جبة صوف قصيرة ضيقة الكمين {cite:tarikh-ibn-khaldun-ibar p. 926}"
  en: "Abu Yazid Makhlad ibn Kaydad — the Ibadi Berber rebel besieged in al-Mahdiyya, crucified 336 {cite:fihrist-ibn-al-nadim}"
