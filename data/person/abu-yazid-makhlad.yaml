id: person/abu-yazid-makhlad
education:
  did_you_know:
    ar: "أبو يزيد مخلد بن كيداد البربري المعروف بصاحب الحمار، خرج على العبيديين بالمغرب فكثر أتباعه وحاصروا القائم في المهدية حتى دارت به الدائرة."
    en: "Abu Yazid Makhlad ibn Kaydad the Berber — 'the man of the donkey' — rose against the Ubaydi Fatimids in the Maghreb; his followers swelled and besieged al-Qa'im in al-Mahdiyya before the wheel turned on him."
    ur: "ابویزید مخلد بن کیداد بربری — گدھے والے — نے مغرب میں عبیدیوں کے خلاف بغاوت کی؛ اس کے پیروکار بڑھے اور قائم کو مہدیہ میں گھیر لیا، یہاں تک کہ قسمت کا پھراؤ اس پر پلٹا۔"
    sources: [source/tarikh-ibn-khaldun-ibar, source/tarikh-khulafa-minhaj-1434]
class: person
label: { ar: "أبو يزيد المكلف البربري", en: "Abu Yazid Makhlad", fr: "Abu Yazid Makhlad", es: "Abu Yazid Makhlad", ur: "ابو یزید مخلد" }
summary:
  ar: "أبو يزيد المحتسب واسمه مخلد بن كيداد البربري الزناتي من بني يفرن الإباضي النكاري ويعرف بصاحب الحمار، خرج على الحسن القائم بالأمر بعد عبيد الله فكثر أتباعه ومعاونوه فحاربه وحصره في المهدية إلى أن مات الحسن في الجصار فقام بعده ابنه إسماعيل ويكنى أبا طاهر فأظهر تعظيم الشريعة وأظهر أبو يزيد مذهب الإباضية فأقبل عنه الناس فقتل وصلب وذلك في سنة ست وثلاثين وثلاثمائة {cite:fihrist-ibn-al-nadim p. 265-266}. وعند ابن الأثير استولى على القيروان ورقادة سنة 333هـ فقتل خليلاً عاملها ونهبها وقتل وسبى ولما شكا إليه شيوخ أهلها قال وما يكون خرّبت مكة وبيت المقدس، وأرسل سرية إلى سوسة ففاحوها بالسيف وقتلوا الرجال وسبوا النساء وأحرقوها وشقوا فروج النساء وبقروا البطون حتى لم يبق موضع في إفريقية معمور ولا سقف مرفوع، وقتل ميسوراً قائد القائم وطيف برأسه بالقيروان ثم حاصر المهدية فنزل على خمسة عشر ميلاً منها وبث سراياه {cite:kamil-ibn-al-athir p. 316-318}، وعند ابن خلدون وهو أبو يزيد مخلد بن كيراد؛ كان أبوه كيراد من أهل تسطيلة من مدائن بلد توزر يختلف إلى بلاد السودان بالتجارة وبها ولد أبو يزيد ونشأ بتوزر وتعلم القرآن وخالط النكارية من الخوارج وهم الصفرية فمال إلى مذهبهم ثم سافر إلى تاهرت وأقام يعلم الصبيان ثم تقيوس فأقام يعلم فيها، ولما مات المهدي خرج بناحية جبل أوراس وركب الحمار وتلقب بشيخ المؤمنين ودعا للناصر وأهدى له رجل من أهل مرماجنة حماراً أشهب فكان يركبه وبه لقب وكان يلبس جبة صوف قصيرة ضيقة الكمين {cite:tarikh-ibn-khaldun-ibar p. 926}"
  en: "Abu Yazid Makhlad ibn Kaydad — the Ibadi Berber rebel besieged in al-Mahdiyya, crucified 336 {cite:fihrist-ibn-al-nadim}"
  fr: "Abu Yazid Makhlad ibn Kaydad, rebelle berbère ibadite assiégé à al-Mahdiyya et crucifié en 336 {cite:fihrist-ibn-al-nadim}"
  es: "Abu Yazid Makhlad ibn Kaydad - el rebelde bereber ibadí sitiado en al-Mahdiyya, crucificado en 336 {cita:fihrist-ibn-al-nadim}"
  ur: "ابو یزید مخلد ابن کیداد - عبادی بربر باغی نے المہدیہ میں محاصرہ کیا، 336 کو مصلوب کیا گیا۔"
  tr: "Adı Mukhallad ibn Kaydad al-Barbari al-Zanati olan ve Beni Yafran al-Ibadi al-Nakari kabilesinden olan, eşek sahibi olarak bilinen Ebu Yazid al-Muhtasib, Ubeydullah'tan sonra yönetimi devralan Hasan'a karşı isyan etti. Takipçileri ve destekçileri çoğalınca, Hasan'la savaştı ve onu el-Mehdiyye'de kuşattı, ta ki Hasan el-Cesser'de ölene kadar. Ondan sonra, Ebu Tahir olarak bilinen oğlu İsmail ortaya çıktı. Şeriatın büyüklüğünü gösterdi ve Ebu Yazid İbadi doktrinini gösterdi. Bunun üzerine insanlar ondan yüz çevirdi ve öldürülüp çarmıha gerildi. Bu olay 336 yılında gerçekleşti. {cite:fihrist-ibn-al-nadim s. 265-266} İbn el-Athir'e göre, 333 Hicri yılında Kayrevan ve Rakkade'yi ele geçirmiş, valisi Halil'i öldürmüş, şehri yağmalamış, öldürmüş ve esir almıştır. Halkın ileri gelenleri ona şikayet edince, \"Bu nedir? Mekke ve Kudüs yıkıldı\" demiştir. Sousse'ye bir birlik göndermiş ve bu birliklerle şehri kılıçla yağmalamış, erkekleri öldürmüş, kadınları esir almış, şehri yakmış, kadınların cinsel organlarını yırtmış ve karınlarını deşmişlerdir; böylece İfrikiye'de hiçbir yerleşim yeri, hiçbir çatı kalmamıştır. El-Kaim komutanı Maysur'u öldürmüş ve başını Kayrevan'da dolaştırmıştır. Sonra Mehdi'yi kuşatmış, şehirden 24 kilometre uzakta kamp kurmuş ve birliklerini göndermiştir. {kaynak: Kamil İbn el-Athir s. 316-318} İbn Haldun'a göre ise, o Ebu Yezid Mukhallad ibn Kirad'dır. Babası Kirad, Tozeur şehirlerinden biri olan Tastilah halkındandı. Ticaret için Sudan topraklarına sık sık seyahat ederdi. Ebu Yazid orada doğdu ve Tozeur'da büyüdü; burada Kur'an öğrendi ve Sufriyye mezhebine mensup Haricilerin Nakkariyyesi ile ilişki kurdu ve onların öğretisine yöneldi. Daha sonra Tahert'e gitti ve orada erkek çocuklara ders verdi, ardından Takiyuş'a gitti ve orada da ders vermeye devam etti. Mehdi vefat edince, Aures Dağı bölgesine gitti, bir eşeğe bindi ve Müminlerin Şeyhi unvanını aldı. El-Nasır için dua etti ve Mermejana halkından bir adam ona gri bir eşek hediye etti; bu eşeğe bindi ve bu sayede unvanı aldı. Dar kollu kısa bir yün elbise giyerdi. {cite:tarikh-ibn-khaldun-ibar s. 926}"
  id: "Abu Yazid al-Muhtasib, yang bernama Mukhallad ibn Kaydad al-Barbari al-Zanati dari Bani Yafran al-Ibadi al-Nakari, dan dikenal sebagai pemilik keledai, memberontak terhadap al-Hasan, yang berkuasa setelah Ubayd Allah. Pengikut dan pendukungnya semakin banyak, sehingga ia memerangi dan mengepung al-Hasan di al-Mahdiyya hingga al-Hasan meninggal di al-Jassar. Setelahnya, putranya Ismail, yang dikenal sebagai Abu Tahir, bangkit. Ia menunjukkan keagungan syariat, dan Abu Yazid menunjukkan doktrin Ibadi. Maka orang-orang berpaling darinya, sehingga ia dibunuh dan disalib. Itu terjadi pada tahun 336. {cite:fihrist-ibn-al-nadim p. 265-266}. Menurut Ibn al-Athir, ia merebut Kairouan dan Raqqada pada tahun 333 H, membunuh Khalil, gubernurnya, menjarahnya, membunuh dan menawan orang-orang. Ketika para tetua penduduknya mengeluh kepadanya, ia berkata, \"Apa ini? Mekah dan Yerusalem telah dihancurkan.\" Ia mengirimkan pasukan ke Sousse, dan mereka menghancurkannya dengan pedang, membunuh para pria, menawan para wanita, membakarnya, merobek kemaluan wanita, dan merobek perut hingga tidak ada tempat yang dihuni di Ifriqiya, dan tidak ada atap yang berdiri. Ia membunuh Maysur, komandan al-Qa'im, dan mengarak kepalanya di sekitar Kairouan. Kemudian ia mengepung Mahdia dan berkemah lima belas mil darinya dan mengirimkan pasukannya. {cite:kamil-ibn-al-athir hlm. 316-318} Menurut Ibn Khaldun, ia adalah Abu Yazid Mukhallad ibn Kirad; Ayahnya, Kirad, berasal dari penduduk Tastilah, salah satu kota Tozeur. Ia biasa bepergian ke tanah Sudan untuk berdagang. Abu Yazid lahir di sana dan dibesarkan di Tozeur, di mana ia mempelajari Al-Qur'an dan bergaul dengan kaum Nakkariyyah dari Kharijites, yang merupakan kaum Sufriyyah, dan ia cenderung pada ajaran mereka. Kemudian ia pergi ke Tahert dan tinggal di sana mengajar anak laki-laki, lalu ke Taqius, di mana ia tinggal mengajar. Ketika Mahdi wafat, ia pergi ke wilayah Gunung Aures, menunggangi keledai, dan mengambil gelar Syekh Kaum Beriman. Ia berdoa untuk al-Nasir, dan seorang pria dari penduduk Marmajana menghadiahkannya seekor keledai abu-abu, yang ditungganginya, dan dengan keledai itulah ia mengambil gelar tersebut. Ia biasa mengenakan jubah wol pendek dengan lengan sempit. {cite:tarikh-ibn-khaldun-ibar p. 926}"
