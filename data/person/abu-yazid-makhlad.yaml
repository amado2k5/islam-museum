id: person/abu-yazid-makhlad
class: person
label: { ar: "أبو يزيد المكلف البربري", en: "Abu Yazid Makhlad" }
summary:
  ar: "أبو يزيد المحتسب واسمه مخلد بن كيداد البربري الزناتي من بني يفرن الإباضي النكاري ويعرف بصاحب الحمار، خرج على الحسن القائم بالأمر بعد عبيد الله فكثر أتباعه ومعاونوه فحاربه وحصره في المهدية إلى أن مات الحسن في الجصار فقام بعده ابنه إسماعيل ويكنى أبا طاهر فأظهر تعظيم الشريعة وأظهر أبو يزيد مذهب الإباضية فأقبل عنه الناس فقتل وصلب وذلك في سنة ست وثلاثين وثلاثمائة {cite:fihrist-ibn-al-nadim p. 265-266}.، وعند ابن الأثير استولى على القيروان ورقادة سنة 333هـ فقتل خليلاً عاملها ونهبها وقتل وسبى ولما شكا إليه شيوخ أهلها قال وما يكون خرّبت مكة وبيت المقدس، وأرسل سرية إلى سوسة ففاحوها بالسيف وقتلوا الرجال وسبوا النساء وأحرقوها وشقوا فروج النساء وبقروا البطون حتى لم يبق موضع في إفريقية معمور ولا سقف مرفوع، وقتل ميسوراً قائد القائم وطيف برأسه بالقيروان ثم حاصر المهدية فنزل على خمسة عشر ميلاً منها وبث سراياه {cite:kamil-ibn-al-athir p. 316-318}"
  en: "Abu Yazid Makhlad ibn Kaydad — the Ibadi Berber rebel besieged in al-Mahdiyya, crucified 336 {cite:fihrist-ibn-al-nadim}"
sources: [source/kamil-ibn-al-athir, source/fihrist-ibn-al-nadim]
