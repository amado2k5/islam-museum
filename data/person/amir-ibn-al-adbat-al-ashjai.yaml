summary:
  ar: "رجل من أشجع مرّ بسرية ابن أبي حدرد ببطن إضم على قعود له ومعه متاع ووطب لبن، فسلّم بتحية الإسلام فقتله محلّم بن جثامة؛ طلب عيينة بن حصن بدمه عند النبي بحنين فقُبلت فيه الدية، وفيه نزلت آية النساء 94 بحسب ابن أبي حدرد."
  en: "A man of Ashja' who passed Ibn Abi Hadrad's detachment at Batn Idam on his camel with his goods and a skin of milk, gave the greeting of Islam and was killed by Muhallim ibn Jaththama; Uyayna ibn Hisn claimed his blood before the Prophet at Hunayn and blood-money was accepted; Qur'an 4:94 was revealed about the case according to Ibn Abi Hadrad."
