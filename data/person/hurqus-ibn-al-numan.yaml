summary:
  ar: "من بهراء بن هلال من قضاعة؛ كان بسوى — ماء لكلب — في جماعة يشربون ويتغنون حين أغار عليهم خالد بن الوليد في طريقه إلى الشام فقتله، وكان يقول قبل قتله «ألا عللاني قبل جيش أبي بكر لعل منايانا قريب ولا ندري»، فلما قتل جعل دمه يسيل في الجفنة التي كان فيها شرابه ويقال إن رأسه سقط فيها أيضاً."
  en: "Of Bahra' ibn Hilal of Quda'a; he was at Suwa — a Kalbi watering-place — among a company drinking and singing when Khalid ibn al-Walid raided them on his way to Syria and killed him; he had been singing 'slake me before Abu Bakr's army — perhaps our fates are near and we know not', and when killed his blood ran into the basin holding his drink, some say his head fell into it too."
