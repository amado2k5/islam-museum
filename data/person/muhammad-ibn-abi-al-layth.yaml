id: person/muhammad-ibn-abi-al-layth
class: person
label: { ar: "محمد بن أبي الليث" }
summary:
  ar: "قاضي القضاة بمصر، أمر المتوكل سنة سبع وثلاثين بحلق لحيته وضربه والطواف به على حمار ففعل ونعم ما فعل فإنه كان ظالماً من رؤوس الجهمية {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  en: "Egypt's chief qadi; in 237 al-Mutawakkil ordered his beard shaved, his beating and a donkey-parade — 'and well done, for he was a tyrant of the Jahmiyya's leaders' {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  es: "El cadí principal de Egipto; en 237, al-Mutawakkil ordenó que le afeitaran la barba, lo golpearan y lo exhibieran en un desfile de burros, «y bien hecho, pues era un tirano de los líderes de los Jahmiyya» {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  fr: "Le cadi en chef d'Égypte; en 237, al-Mutawakkil ordonna qu'on lui rase la barbe, qu'on le batte et qu'on organise un défilé d'ânes — « et bien fait, car il était un tyran des chefs Jahmiyya » {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  ur: "مصر کا سردار قادی؛ 237 میں متوکل نے اپنی داڑھی منڈوانے، مارنے پیٹنے اور گدھے پر چڑھانے کا حکم دیا - اور اچھا کیا، کیونکہ وہ جہمیہ کے سرداروں کا ظالم تھا۔ 539}۔"
