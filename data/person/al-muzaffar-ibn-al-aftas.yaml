summary:
  ar: "المظفر أبو بكر محمد بن عبد الله بن مسلمة بن الأفطس؛ ملك بطليوس من غرب الأندلس من بني الأفطس أصحاب بطليوس وما إليها، وهو صاحب التأليف المسمى بالمظفري في نحو الخمسين مجلداً {cite:nafh-tib-maqqari p. 478}. وكان من أعاظم ملوك الطوائف وبينه وبين ابن ذي النون حروب مذكورة وكذا مع ابن عباد {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  en: "Al-Muzaffar Abu Bakr Muhammad ibn Abdallah ibn al-Aftas, the scholar-king of Badajoz — author of the encyclopedia known as al-Muzaffari in nearly fifty volumes, and among the greatest of the taifa kings {cite:nafh-tib-maqqari p. 478; tarikh-ibn-khaldun-ibar p. 1001}."
