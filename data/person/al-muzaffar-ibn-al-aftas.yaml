id: person/al-muzaffar-ibn-al-aftas
class: person
label: { ar: "المظفر بن الأفطس ملك بطليوس", en: "al-Muzaffar ibn al-Aftas, king of Badajoz", fr: "al-Muzaffar ibn al-Aftas, roi de Badajoz", es: "al-Muzaffar ibn al-Aftas, king of Badajoz", ur: "المظفر ابن الافطاس، بادجوز کا بادشاہ" }
summary:
  ar: "المظفر أبو بكر محمد بن عبد الله بن مسلمة بن الأفطس؛ ملك بطليوس من غرب الأندلس من بني الأفطس أصحاب بطليوس وما إليها، وهو صاحب التأليف المسمى بالمظفري في نحو الخمسين مجلداً {cite:nafh-tib-maqqari p. 478}. وكان من أعاظم ملوك الطوائف وبينه وبين ابن ذي النون حروب مذكورة وكذا مع ابن عباد {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  en: "Al-Muzaffar Abu Bakr Muhammad ibn Abdallah ibn al-Aftas, the scholar-king of Badajoz — author of the encyclopedia known as al-Muzaffari in nearly fifty volumes, and among the greatest of the taifa kings {cite:nafh-tib-maqqari p. 478; tarikh-ibn-khaldun-ibar p. 1001}."
  fr: "Al-Muzaffar Abu Bakr Muhammad ibn Abdallah ibn al-Aftas, le roi savant de Badajoz - auteur de l'encyclopédie connue sous le nom d'al-Muzaffari en près de cinquante volumes, et parmi les plus grands des rois taïfas {cite:nafh-tib-maqqari p. 478; tarikh-ibn-khaldun-ibar p. 1001}."
  es: "Al-Muzaffar Abu Bakr Muhammad ibn Abdallah ibn al-Aftas, el rey erudito de Badajoz, autor de la enciclopedia conocida como al-Muzaffari en casi cincuenta volúmenes, y uno de los más grandes reyes de taifas {citar:nafh-tib-maqqari p. 478; tarikh-ibn-khaldun-ibar p. 1001}."
  ur: "المظفر ابوبکر محمد بن عبداللہ ابن الافطاس، بادجوز کا عالم بادشاہ - تقریباً پچاس جلدوں میں المظفری کے نام سے مشہور انسائیکلو پیڈیا کا مصنف، اور طائفہ کے بادشاہوں میں سے عظیم ترین۔ 478; تاریخ ابن خلدون ابر ص۔ 1001}۔"
  tr: "El-Muzaffar Ebu Bekir Muhammed bin Abdullah ibn Maslama ibn el-Aftas; batı Endülüs'teki Badaj kralı, Banu el-Aftas'tan, Badaj ve ötesinin yoldaşlarıdır. Yaklaşık elli ciltten oluşan el-Muzafferi adlı eserin yazarıdır {atıf:nafh-tib-maqqari, s. 478}. Taiflerin en büyük krallarından biriydi ve kendisi ile İbn Dhu al-Nun arasında olduğu gibi, İbn Abbad ile de savaşlar yaşanmıştır {atı:Tarikh-ibn-khaldun-ibar s. 1001}."
  id: "Al-Muzaffar Abu Bakr Muhammad ibn Abdullah ibn Maslama ibn al-Aftas; raja Badaj di Andalusia barat, dari Banu al-Aftas, para sahabat Badaj dan sekitarnya. Ia adalah penulis karya yang dikenal sebagai al-Muzaffari, yang terdiri dari sekitar lima puluh jilid {cite:nafh-tib-maqqari, hlm. 478}. Ia termasuk di antara raja-raja terbesar di Taifa, dan ada peperangan yang disebutkan antara dirinya dan Ibn Dhu al-Nun, serta dengan Ibn 'Abbad {cite:Tarikh-ibn-khaldun-ibar hlm. 1001}."
