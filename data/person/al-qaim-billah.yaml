id: person/al-qaim-billah
class: person
label: { ar: "القائم بأمر الله عبد الله بن القادر", en: "al-Qa'im bi-Amr Allah Abd Allah ibn al-Qadir", fr: "al-Qa'im bi-Amr Allah Abd Allah ibn al-Qadir" , ur: "القائم بامر اللہ عبد اللہ بن القادر", es: "al-Qa'im bi-Amr Allah Abd Allah ibn al-Qadir"}
summary:
  ar: "خليفة عباسي [٤٢٢–٤٦٧هـ]، أبو جعفر عبد الله بن القادر، ولد في نصف ذي القعدة سنة إحدى وتسعين وأمه أم ولد أرمنية اسمها بدر الدجى وقيل قطر الندى، وقال ابن الأثير كان جميلاً مليح الوجه ورعاً ديناً زاهداً عالماً قوي اليقين كثير الصدقة مؤثراً للعدل والإحسان لا يرى المنع من شيء طلب منه، وقبض عليه البساسيري سنة خمسين فحبسه بعانة فكتب قصة نفذها إلى مكة فعلقت في الكعبة، ولما رجع إلى داره لم ينم إلا على فراش مصلاه ولزم الصيام والقيام وعفا عن كل من آذاه ولم يسترد شيئاً مما نهب من قصره إلا بالثمن وقال هذه أشياء احتسبناها عند الله ولم يضع رأسه بعدها على مخدة ولم يوجد في قصره المنهمود شيء من آلات الملاهي {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. وأظهره أبوه وليًا للعهد بلقب القائم بأمر الله في جمادى الأولى سنة ٤٢١ فثبت على السكة والورق {cite:muntazam-ibn-al-jawzi j.8 p.389-392}، ولما مات أبوه ليلة ١١ ذي الحجة ٤٢٢ خرج وقت العصر فصلى بالناس المغرب ثم صلى على أبيه أربع تكبيرات وجلس بدار الشجرة فبايعه الناس أولهم الشريف المرتضى؛ ومن أدبه أنه لما طالبه الغلمان بثلاثة آلاف ألف دينار مال بيعة عرض خانًا وبستانًا وركامًا للبيع ليدفعها {cite:muntazam-ibn-al-jawzi j.8 p.399-403}. وفي سنة ٤٢٧ تقدّم بترك التعامل بالدنانير المغربية وأمر الشهود ألا يشهدوا في كتاب يُذكر فيها هذا الصنف {cite:muntazam-ibn-al-jawzi j.8 p.430}، وطالبه الأتراك سنة ٤٣٠ أن يتوسط في أمرهم حين شغبوا على جلال الدولة {cite:muntazam-ibn-al-jawzi j.8 p.446}، وفي ٤٣٤ حين أخذ جلال الدولة جرائة الجوالي أظهر العزم على مفارقة البلد حتى خيف غلق الجوامع، وكتب إلى جلال الدولة في عقده «لو أردت ما أردت لكان الوكلاء القائمون يحملونه إليك» {cite:muntazam-ibn-al-jawzi j.8 p.455-456}. وفي شعبان ٤٤٠ خُتن ولده ذخيرة الدين أبو العباس وذُكر على المنابر أنه ولي العهد {cite:muntazam-ibn-al-jawzi j.8 p.479}. وفي سنة ٤٤٦ كاتب البساسيري لما نفرت منه آثار الوحشة واعتاث سفينة أقارب رئيس الرؤساء {cite:muntazam-ibn-al-jawzi j.8 p.502}، وفي ٤٤٧ حين صح عنده سوء عقيدة البساسيري كاتب طغربك «أمير الغز» يستنهضه على المسير إلى العراق {cite:muntazam-ibn-al-jawzi j.8 p.505}."
  en: "Abbasid caliph [422–467], Abu Ja'far Abd Allah ibn al-Qadir, born 391 to an Armenian mother; Ibn al-Athir praises his beauty, piety, learning and unstinted answers. Al-Basasiri seized him in 450 and jailed him at Ana — his letter to God was hung on the Ka'ba. Restored, he slept only on his prayer-mat, kept fasting and night-prayer, forgave all who wronged him, bought back his looted goods at price saying 'we have counted them with God', never again laid head on pillow; no instrument of amusement was found in his sacked palace {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  fr: "Le calife abbasside [422-467], Abu Ja'far Abd Allah ibn al-Qadir, né 391 d'une mère arménienne ; Ibn al-Athir loue sa beauté, sa piété, son apprentissage et ses réponses sans réserve. Al-Basasiri le saisit en 450 et l’emprisonna à Ana – sa lettre à Dieu fut suspendue à la Ka’ba. Restauré, il ne dormait que sur son tapis de prière, jeûnait et priait la nuit, pardonnait à tous ceux qui lui faisaient du tort, rachetait ses biens pillés à prix en disant : « Nous les avons comptés avec Dieu », ne reposait plus jamais la tête sur l'oreiller ; Aucun instrument d'amusement n'a été trouvé dans son palais saccagé {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  ur: "عباسی خلیفہ، جن کا عہد 422–467ھ تھا۔ سیوطی کے بیان کے مطابق بساسیری نے انہیں 450ھ میں قید کیا؛ بعد میں وہ بغداد میں دوبارہ خلافت پر بحال ہوئے۔ {cite:tarikh-khulafa-minhaj-1434 p. 642-643}"
  es: "El califa abasí [422–467], Abu Ja'far Abd Allah ibn al-Qadir, nació en 391 de madre armenia; Ibn al-Athir elogia su belleza, piedad, erudición y respuestas sinceras. Al-Basasiri lo apresó en 450 y lo encarceló en Ana; su carta a Dios fue colgada en la Kaaba. Tras su liberación, solo dormía sobre su alfombra de oración, mantuvo el ayuno y la oración nocturna, perdonó a todos los que le habían hecho daño, recompró sus bienes saqueados al precio de mercado diciendo «los hemos contado con Dios», y nunca más volvió a apoyar la cabeza en una almohada; no se encontró ningún instrumento de entretenimiento en su palacio saqueado {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  tr: "Bir Abbasi halifesi [422–467 H) olan Ebu Ca'fer Abdullah bin el-Kadir, doksan birinci yılda Zhu'd-Kı'dah'ın ortasında doğdu. Annesi, Ermeni doğumlu bir anne olan Badr al-Duja'ydı ve Qatr al-Nada olarak adlandırılır. İbn al-Athir, onun yakışıklı, yakışıklı, dindar, dindar, dindar, bilgili, kararlı, cömert ve etkili olduğunu, adalet ve iyiliği etkilediğini, ondan hiçbir şey saklanmadığını söyledi. 50 Hicri yılında el-Basasiri tarafından yakalandı, zorluklarla hapsedildi ve Mekke'ye taşıdığı bir hikaye yazdı; bu hikaye Kabe'de kaldı Namaz yatağında hariç, oruç tutup namaz kaldı, kendisine zarar verenleri affetti ve sarayından yağmalanan hiçbir şeyi geri almadı, sadece bedeli vardı. Dedi ki, 'Bunlar Allah'tan saydığımız şeylerdir.' Sonrasında başını yastığa koymadı, çökmüş sarayında da eğlence aracı bulunmadı {atıf:Tarikh-khulafa-minhaj-1434 s. 642-643}. Babası onu 421 Hicve Cumed-Evval'de El-Kaim bi-Amr Allah unvanıyla veliaht prens olarak atadı, böylece kağıt ve kağıt üzerinde yerleşti {atıf:Muntazam-ibn-al-jawzi J.8 s.389-392}. Babası 11 Zulhice 422 gecesi öldüğünde, Mağrip'te halkla birlikte Asr namazına çıktı, ardından babası için dört tekbir namaz kıvırdı ve ağaç evde oturdu; halk ona bağlılık yemini etti, ilki Şerif Murtada idi. Davranışları arasında, çocuklar sadakat yemini için üç bin dinar istediklerinde, bir hana, meyve bahçesi ve moloz satışa sunması vardı {cite:Muntazam-ibn-al-Jawzi j.8 s.399-403}. 427 yılında, Fas dinarlarıyla ilişkiyi durdurmayı önerdi ve tanıkların bu kategoriyi anan bir kitapta ifade vermemelerini emretti {cite:Muntazam-ibn-al-jawzi J.8 s.430}. 430 yılında, Türkler, Celal al-Dawla'ya karşı isyan ettiklerinde arabuluculuk yapmasını istediler {cite:Muntazam-ibn-al-Jawzi j.8 s.446}. 434 yılında, Jalal al-Dawla el-Jawali'ye cesaret ettiğinde, camileri kapatmaktan korkana kadar ülkeyi terk etmeye kararlı olduğunu gösterdi ve sözleşmesinde Celal al-Dawla'ya şöyle yazdı: \"İstediğini isteseydiniz, sorumlu ajanlar size getirirdi\" {cite:Muntazam-ibn-al-jawzi J.8 s.455-456}. Şaban 440'ta oğlu Dhakirat al-Din Abu al-Abbas sünnet edildi ve kürsülerde kendisinin veliaht prens olduğunu belirtti {cite:muntazam-ibn-al-jawzi j.8 s.479}. 446 Hicri yılında, al-Basasiri ona, cumhurbaşkanının akrabalarının yalnızlık ve gemisinin ayrılışının işaretlerinden tiksindiğini yazdığında {cite:muntazam-ibn-al-jawzi j.8 s.502} ve 447'de al-Basasiri'nin doktrininin yanlış olduğunu fark ettiğinde, 'Fatihlerin Emiri' Tughrbak'a yazdı ve onu Irak'a yürümeye çağırdı {cite:muntazam-ibn-al-jawzi j.8 s.505}."
  id: "Seorang khalifah Abbasiyah [422–467 H], Abu Ja'far Abdullah ibn al-Qadir, lahir di tengah Dhu al-Qi'dah pada tahun sembilan puluh satu. Ibunya adalah ibu kelahiran Armenia bernama Badr al-Duja, dan dikatakan Qatr al-Nada. Ibn al-Athir mengatakan bahwa dia tampan, tampan, saleh, saleh, berpengetahuan, yakin teguh, dermawan, dan berpengaruh, mempengaruhi keadilan dan kebaikan, tidak pernah melihat apa pun yang bisa disembunyikan darinya. Dia ditangkap oleh al-Basasiri pada tahun 50 H, memenjarakannya dengan susah payah, dan menulis sebuah cerita yang dibawanya ke Mekah, yang tetap berada di Ka'bah. Ketika dia pulang, dia tidak tidur kecuali di tempat shalatnya, dan dia berpuasa dan berdoa, mengampuni semua yang menyakitinya, dan tidak mengambil apa pun yang dijarah dari istananya kecuali harganya. Dia berkata, 'Ini adalah hal-hal yang telah kami perhitungkan dari Allah.' Dia tidak meletakkan kepalanya di bantal setelahnya, dan tidak ditemukan peralatan hiburan di istananya yang runtuh {cite:Tarikh-khulafa-minhaj-1434 hlm. 642-643}. Ayahnya mengangkatnya sebagai putra mahkota dengan gelar Al-Qa'im bi-Amr Allah dalam Jumada al-Awwal 421 H, sehingga ia ditetapkan di atas kertas dan kertas {cite:Muntazam-ibn-al-jawzi J.8 hlm.389-392}. Ketika ayahnya meninggal pada malam 11 Dhu al-Hijjah 422, ia keluar untuk shalat Asr bersama orang-orang di Maghrib, kemudian berdoa empat takbir untuk ayahnya dan duduk di rumah pohon, di mana orang-orang bersumpah setia kepadanya, yang pertama adalah Sharif al-Murtada. Salah satu kelakuannya adalah ketika anak-anak itu menuntut tiga ribu dinar untuk sumpah setia, ia menawarkan sebuah khana, kebun, dan puing-puing untuk dijual {cite:muntazam-ibn-al-jawzi j.8 hlm.399-403}. Pada tahun 427, ia mengusulkan untuk berhenti berurusan dengan dinar Maroko dan memerintahkan saksi untuk tidak bersaksi dalam buku yang menyebutkan kategori ini {cite:Muntazam-ibn-al-jawzi J.8 hlm.430}. Pada tahun 430, orang Turki memintanya untuk menjadi penengah dalam urusan mereka ketika mereka memberontak melawan Jalal al-Dawla {cite:Muntazam-ibn-al-Jawzi j.8 hlm.446}. Pada tahun 434, ketika Jalal al-Dawla menantang al-Jawali, ia menunjukkan tekad untuk meninggalkan negara sampai takut menutup masjid, dan menulis kepada Jalal al-Dawla dalam kontraknya: \"Jika Anda menginginkan apa yang Anda inginkan, para agen yang bertanggung jawab pasti akan membawanya kepada Anda\" {cite:Muntazam-ibn-al-jawzi J.8 hlm.455-456}. Pada Sha'ban 440, putranya Dhakirat al-Din Abu al-Abbas disunat dan disebutkan di mimbar bahwa ia adalah putra mahkota {cite:muntazam-ibn-al-jawzi j.8 hlm.479}. Pada tahun 446 H, ketika al-Basasiri menulis kepadanya bahwa ia jijik dengan tanda-tanda kesepian dan keberangkatan kapal kerabat presiden {cite:muntazam-ibn-al-jawzi j.8 hlm.502}, dan pada tahun 447, ketika ia menemukan doktrin al-Basasiri salah, ia menulis kepada Tughrbak, 'Emir Para Penakluk' dan mendesaknya untuk berbaris ke Irak {cite:muntazam-ibn-al-jawzi j.8 hlm.505}."
