id: person/al-qaim-billah
class: person
label: { ar: "القائم بأمر الله عبد الله بن القادر" }
summary:
  ar: "خليفة عباسي [٤٢٢–٤٦٧هـ]، أبو جعفر عبد الله بن القادر، ولد في نصف ذي القعدة سنة إحدى وتسعين وأمه أم ولد أرمنية اسمها بدر الدجى وقيل قطر الندى، وقال ابن الأثير كان جميلاً مليح الوجه ورعاً ديناً زاهداً عالماً قوي اليقين كثير الصدقة مؤثراً للعدل والإحسان لا يرى المنع من شيء طلب منه، وقبض عليه البساسيري سنة خمسين فحبسه بعانة فكتب قصة نفذها إلى مكة فعلقت في الكعبة، ولما رجع إلى داره لم ينم إلا على فراش مصلاه ولزم الصيام والقيام وعفا عن كل من آذاه ولم يسترد شيئاً مما نهب من قصره إلا بالثمن وقال هذه أشياء احتسبناها عند الله ولم يضع رأسه بعدها على مخدة ولم يوجد في قصره المنهمود شيء من آلات الملاهي {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  en: "Abbasid caliph [422–467], Abu Ja'far Abd Allah ibn al-Qadir, born 391 to an Armenian mother; Ibn al-Athir praises his beauty, piety, learning and unstinted answers. Al-Basasiri seized him in 450 and jailed him at Ana — his letter to God was hung on the Ka'ba. Restored, he slept only on his prayer-mat, kept fasting and night-prayer, forgave all who wronged him, bought back his looted goods at price saying 'we have counted them with God', never again laid head on pillow; no instrument of amusement was found in his sacked palace {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
gender: male
born: { edtf: "1001-10-08~", hijri: "0391-11-18", calendar: julian, precision: day, status: tradition, derived: true, note: "ولد الأمير أبو جعفر عبد الله بن القادر بالله — وهو القائم — يوم الخميس ثامن عشر ذي القعدة 391 عند ابن الجوزي {cite:muntazam-ibn-al-jawzi j.7 p.216}؛ وعند تاريخ الخلفاء في نصف ذي القعدة؛ التحويل مشتق." }
died: { edtf: "1075~", hijri: "0467-08", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في شعبان سنة سبع وستين وأربعمائة وله ست وسبعون سنة وبقي في الخلافة أربعاً وأربعين سنة؛ وكان وهو في سجن عانة كتب قصة وأنفذها إلى مكة فعُلقت في الكعبة {cite:shadharat-dhahab p. 328; tarikh-khulafa-minhaj-1434 p. 643}." }
