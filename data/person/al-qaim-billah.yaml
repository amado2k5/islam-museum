id: person/al-qaim-billah
class: person
label: { ar: "القائم بأمر الله عبد الله بن القادر", en: "al-Qa'im bi-Amr Allah Abd Allah ibn al-Qadir" }
summary:
  ar: "خليفة عباسي [٤٢٢–٤٦٧هـ]، أبو جعفر عبد الله بن القادر، ولد في نصف ذي القعدة سنة إحدى وتسعين وأمه أم ولد أرمنية اسمها بدر الدجى وقيل قطر الندى، وقال ابن الأثير كان جميلاً مليح الوجه ورعاً ديناً زاهداً عالماً قوي اليقين كثير الصدقة مؤثراً للعدل والإحسان لا يرى المنع من شيء طلب منه، وقبض عليه البساسيري سنة خمسين فحبسه بعانة فكتب قصة نفذها إلى مكة فعلقت في الكعبة، ولما رجع إلى داره لم ينم إلا على فراش مصلاه ولزم الصيام والقيام وعفا عن كل من آذاه ولم يسترد شيئاً مما نهب من قصره إلا بالثمن وقال هذه أشياء احتسبناها عند الله ولم يضع رأسه بعدها على مخدة ولم يوجد في قصره المنهمود شيء من آلات الملاهي {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. وأظهره أبوه وليًا للعهد بلقب القائم بأمر الله في جمادى الأولى سنة ٤٢١ فثبت على السكة والورق {cite:muntazam-ibn-al-jawzi j.8 p.389-392}، ولما مات أبوه ليلة ١١ ذي الحجة ٤٢٢ خرج وقت العصر فصلى بالناس المغرب ثم صلى على أبيه أربع تكبيرات وجلس بدار الشجرة فبايعه الناس أولهم الشريف المرتضى؛ ومن أدبه أنه لما طالبه الغلمان بثلاثة آلاف ألف دينار مال بيعة عرض خانًا وبستانًا وركامًا للبيع ليدفعها {cite:muntazam-ibn-al-jawzi j.8 p.399-403}. وفي سنة ٤٢٧ تقدّم بترك التعامل بالدنانير المغربية وأمر الشهود ألا يشهدوا في كتاب يُذكر فيها هذا الصنف {cite:muntazam-ibn-al-jawzi j.8 p.430}، وطالبه الأتراك سنة ٤٣٠ أن يتوسط في أمرهم حين شغبوا على جلال الدولة {cite:muntazam-ibn-al-jawzi j.8 p.446}، وفي ٤٣٤ حين أخذ جلال الدولة جرائة الجوالي أظهر العزم على مفارقة البلد حتى خيف غلق الجوامع، وكتب إلى جلال الدولة في عقده «لو أردت ما أردت لكان الوكلاء القائمون يحملونه إليك» {cite:muntazam-ibn-al-jawzi j.8 p.455-456}. وفي شعبان ٤٤٠ خُتن ولده ذخيرة الدين أبو العباس وذُكر على المنابر أنه ولي العهد {cite:muntazam-ibn-al-jawzi j.8 p.479}. وفي سنة ٤٤٦ كاتب البساسيري لما نفرت منه آثار الوحشة واعتاث سفينة أقارب رئيس الرؤساء {cite:muntazam-ibn-al-jawzi j.8 p.502}، وفي ٤٤٧ حين صح عنده سوء عقيدة البساسيري كاتب طغربك «أمير الغز» يستنهضه على المسير إلى العراق {cite:muntazam-ibn-al-jawzi j.8 p.505}."
  en: "Abbasid caliph [422–467], Abu Ja'far Abd Allah ibn al-Qadir, born 391 to an Armenian mother; Ibn al-Athir praises his beauty, piety, learning and unstinted answers. Al-Basasiri seized him in 450 and jailed him at Ana — his letter to God was hung on the Ka'ba. Restored, he slept only on his prayer-mat, kept fasting and night-prayer, forgave all who wronged him, bought back his looted goods at price saying 'we have counted them with God', never again laid head on pillow; no instrument of amusement was found in his sacked palace {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
