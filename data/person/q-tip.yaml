summary:
  ar: "مغنّي راب ومنتج أمريكي، وُلد باسم جوناثان وليام ديفيس في مانهاتن بنيويورك سنة 1970، وهو الصوت الرئيس والمنتج الأساس لفريق «أ ترايب كولد كويست». اعتنق الإسلام في منتصف التسعينيات واتخذ اسم كمال بن جون فريد، وأصدر ألبومات منفردة منها «المضخّم» (1999) و«النهضة» (2008)، ودخل قاعة مشاهير الروك آند رول مع فريقه سنة 2024."
  en: "American rapper and record producer, born Jonathan William Davis in Manhattan, New York City, in 1970, the lead MC and main producer of A Tribe Called Quest. He converted to Islam in the mid-1990s, taking the name Kamaal Ibn John Fareed, released solo albums including Amplified (1999) and The Renaissance (2008), and was inducted into the Rock and Roll Hall of Fame with his group in 2024."
  ur: "امریکی ریپر و ریکارڈ پروڈیوسر، جو 1970 میں مین ہیٹن، نیویارک میں جوناتھن ولیم ڈیوس کے نام سے پیدا ہوئے؛ وہ «اے ٹرائب کالڈ کوئسٹ» کے مرکزی ایم سی اور اصل پروڈیوسر ہیں۔ انہوں نے نوے کی دہائی کے وسط میں اسلام قبول کر کے کمال بن جون فرید نام اختیار کیا، سولو البم «ایمپلیفائیڈ» (1999) اور «دی رینیسانس» (2008) جاری کیے، اور 2024 میں اپنے گروپ کے ساتھ راک اینڈ رول ہال آف فیم میں شامل ہوئے۔"
