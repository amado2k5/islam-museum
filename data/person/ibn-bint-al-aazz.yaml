summary:
  ar: "قاضي القضاة بالديار المصرية؛ وليها في جمادى الأولى سنة ثمان وسبعين وعزل سنة تسع وسبعين في رمضان — وقيل إنه عزل نفسه — فاقتصر على تدريس الصالحية. قال الذهبي: كان فقيهاً عارفاً بالمذهب يسلك طريقة والده في التحري والصلابة، عظيم الهيبة وافر الجلالة عديم المزاح، باراً بالفقهاء مؤثراً متصدقاً، وكان والده يحترمه ويتبرك به {cite:shadharat-dhahab p. 644}."
  en: "Egypt's chief qadi (appointed 678, gone by Ramadan 679 — 'or he removed himself'), then the Salihiyya chair; Dhahabi: 'his father's road of scruple and firmness, awe-heavy, without jest, good to the jurists' {cite:shadharat-dhahab p. 644}."
