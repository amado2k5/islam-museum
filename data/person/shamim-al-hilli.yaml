summary:
  ar: "أبو الحسن علي بن الحسن بن عنتر بن ثابت الملقب مهذب الدين المعروف بشميم الحلي؛ كان أديباً فاضلاً خبيراً بالنحو واللغة وأشعار العرب حسن الشعر؛ اشتغل ببغداد على أبي محمد ابن الخشاب ومن في طبقته ثم سافر إلى ديار بكر والشام ومدح الأكابر وأخذ جوائزهم؛ وعمل كتاباً سماه «اللامسة» رتبه على عشرة أبواب وضاهى به كتاب «الحماسة» لأبي تمام؛ وكان جمّ الفضائل إلا أنه كان بذيء اللسان كثير الوقوع في الناس؛ وسمّي شميماً لأنه كان يشم فلا يجد رائحة {cite:wafayat-ayan}."
  en: "Muhadhdhab al-Din 'Shamim' al-Hilli (d. 601, Mosul) — Hilla's sharp-tongued poet; his Lamsa in ten chapters vied with Abu Tammam's Hamasa; nicknamed for having no sense of smell {cite:wafayat-ayan}."
