died: { edtf: "1205", hijri: "0601", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي ليلة الأربعاء الثامن والعشرين من شهر ربيع الآخر سنة إحدى وستمائة بالموصل {cite:wafayat-ayan}؛ والشذرات يجعل وفاته في رجب من السنة نفسها بالموصل {cite:shadharat-dhahab p. 14}." }
summary:
  ar: "أبو الحسن علي بن الحسن بن عنتر بن ثابت الملقب مهذب الدين المعروف بشميم الحلي؛ كان أديباً فاضلاً خبيراً بالنحو واللغة وأشعار العرب حسن الشعر؛ اشتغل ببغداد على أبي محمد ابن الخشاب ومن في طبقته ثم سافر إلى ديار بكر والشام ومدح الأكابر وأخذ جوائزهم؛ وعمل كتاباً سماه «اللامسة» رتبه على عشرة أبواب وضاهى به كتاب «الحماسة» لأبي تمام؛ وكان جمّ الفضائل إلا أنه كان بذيء اللسان كثير الوقوع في الناس؛ وسمّي شميماً لأنه كان يشم فلا يجد رائحة {cite:wafayat-ayan}."
  en: "Muhadhdhab al-Din 'Shamim' al-Hilli (d. 601, Mosul) — Hilla's sharp-tongued poet; his Lamsa in ten chapters vied with Abu Tammam's Hamasa; nicknamed for having no sense of smell {cite:wafayat-ayan}."
  es: "Muhadhdhab al-Din 'Shamim' al-Hilli (m. 601, Mosul): el poeta de lengua afilada de Hilla; su Lamsa en diez capítulos competía con el Hamasa de Abu Tammam; apodado por no tener sentido del olfato {cita:wafayat-ayan}."
  fr: "Muhadhdhab al-Din 'Shamim' al-Hilli (mort en 601, Mossoul) — le poète à la langue acérée de Hilla; son Lamsa en dix chapitres rivalisait avec le Hamasa d'Abu Tammam; surnommé pour ne pas avoir d'odorat {cite:wafayat-ayan}."
