id: person/muhammad-ibn-shaddad-al-judhui
class: person
label: { ar: "محمد بن شداد الجذوعي القاضي", en: "al-Qadi al-Judhu'i", es: "al-Qadi al-Judhu'i", fr: "al-Qadi al-Judhu'i", ur: "القدی الجدوی" }
roles: [judge, scholar]
gender: male
summary:
  ar: "أبو عبد الله الأنصاري القاضي المعروف بالجذوعي، حدّث عن مسدد بن مسرهد وعلي بن المديني وابن عيينة وغيرهم وروى عنه أبو عمر وابن السماك وكان ثقة؛ وذُكر أن القضاة والشهود بمدينة السلام أُدخلوا على المعتمد على الله للشهادة عليه في دين اقترضه عند الاضطرار بالإنفاق على صاحب الزنج، فقرأ عليهم إسماعيل بن بلبل الكتاب ثم قال: إن أمير المؤمنين يأمركم بأن تشهدوا عليه بما في هذا الكتاب، فشهد القوم حتى بلغ الكتاب إلى الجذوعي فأخذه بيده وتقدم إلى السرير {cite:muntazam-ibn-al-jawzi p. 189}."
  en: "Abu 'Abdallah 'al-Judhu'i', the Ansari qadi and traditionist; when al-Mu'tamid summoned the judges and witnesses of Madinat al-Salam to witness against him for a debt he had borrowed to fund the Zanj war — Ibn Bulbul read the writ and the company bore witness — the deed reached al-Judhu'i, who took it in hand and advanced toward the caliph's couch {cite:muntazam-ibn-al-jawzi p. 189}."
  es: "Abu 'Abdallah 'al-Judhu'i', el cadí y tradicionalista ansarí; cuando al-Mu'tamid convocó a los jueces y testigos de Madinat al-Salam para que testificaran en su contra por una deuda que había contraído para financiar la guerra de Zanj —Ibn Bulbul leyó el auto y la compañía presenció— el documento llegó a al-Judhu'i, quien lo tomó en sus manos y avanzó hacia el lecho del califa {cite:muntazam-ibn-al-jawzi p. 189}."
  fr: "Abu 'Abdallah 'al-Judhu'i', le cadi et traditionniste ansari; lorsque al-Mu'tamid convoqua les juges et les témoins de Madinat al-Salam pour témoigner contre lui pour une dette qu'il avait contractée pour financer la guerre de Zanj — Ibn Bulbul lut l'acte et l'assemblée témoigna — l'acte parvint à al-Judhu'i, qui le prit en main et s'avança vers le lit du calife {cite:muntazam-ibn-al-jawzi p. 189}."
  ur: "ابو عبداللہ 'الجھوعی'، انصاری قاضی اور روایت دان؛ جب المتمید نے مدینۃ السلام کے ججوں اور گواہوں کو اپنے خلاف اس قرض کی گواہی کے لیے بلایا جو اس نے زنج جنگ کی مالی امداد کے لیے لیا تھا - ابن بلبل نے رٹ پڑھی اور کمپنی نے گواہی دی - یہ نامہ الجدوی تک پہنچا، جس نے اسے ہاتھ میں لیا اور خلیفہ المسلمین کی طرف بڑھا۔ ص 189}۔"
