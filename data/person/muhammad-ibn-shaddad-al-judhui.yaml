roles: [judge, scholar]
gender: male
summary:
  ar: "أبو عبد الله الأنصاري القاضي المعروف بالجذوعي، حدّث عن مسدد بن مسرهد وعلي بن المديني وابن عيينة وغيرهم وروى عنه أبو عمر وابن السماك وكان ثقة؛ وذُكر أن القضاة والشهود بمدينة السلام أُدخلوا على المعتمد على الله للشهادة عليه في دين اقترضه عند الاضطرار بالإنفاق على صاحب الزنج، فقرأ عليهم إسماعيل بن بلبل الكتاب ثم قال: إن أمير المؤمنين يأمركم بأن تشهدوا عليه بما في هذا الكتاب، فشهد القوم حتى بلغ الكتاب إلى الجذوعي فأخذه بيده وتقدم إلى السرير {cite:muntazam-ibn-al-jawzi p. 189}."
  en: "Abu 'Abdallah 'al-Judhu'i', the Ansari qadi and traditionist; when al-Mu'tamid summoned the judges and witnesses of Madinat al-Salam to witness against him for a debt he had borrowed to fund the Zanj war — Ibn Bulbul read the writ and the company bore witness — the deed reached al-Judhu'i, who took it in hand and advanced toward the caliph's couch {cite:muntazam-ibn-al-jawzi p. 189}."
