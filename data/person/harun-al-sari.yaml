  en: Harun al-Sari al-Bajali
summary:
  ar: "هارون بن عبد اللّه البجلي الملقب بالساري، زعيم خارجي اجتمع عليه الخوارج بالجزيرة بعد مساور، فاستولى على الموصل وعاث في الجزيرة وأذربيجان، فتعقبه الحسين بن حمدان بأمر المعتضد فأسره وجاء به إليه، فخلع المعتضد على الحسين وإخوته وأمر بهدم قلعة حمدان بماردين."
  en: "Harun ibn Abd Allah al-Bajali, called al-Sari; the Kharijite leader whom the Jaziran Kharijites rallied to after Musawir — he seized Mosul and ravaged the Jazira and Azerbaijan until al-Husayn ibn Hamdan pursued him on al-Mu'tadid's orders, captured him and brought him in; al-Mu'tadid bestowed robes on al-Husayn and his brothers and ordered Hamdan's castle at Mardin razed."
