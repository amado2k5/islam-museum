id: person/al-abras-al-madani
class: person
label:
  ar: الأبرص المداني
  en: Al-Abras al-Madani
  fr: "Al-Abras al-Madani"
  ur: ابرص مدانی
  es: "Al-Abras al-Madani"
summary:
  ar: رجل مداني ذُكر مع ابن أخيه علي بن ربيع بين من دخلوا الدار مع بني الحارث ونهبوها ليلة الهجوم، فخافهما عبد الله بن الحسين وأحمد بن محمد صباحاً.
  en: A man of Madan named with his nephew Ali ibn Rabi' among those who entered the house with Banu al-Harith and plundered it on the night of the attack, so that Abdullah ibn al-Husayn and Ahmad ibn Muhammad feared them at dawn.
  fr: "Homme de Madan nommé avec son neveu Ali ibn Rabi’ parmi ceux qui entrèrent dans la maison avec les Banu al-Harith et la pillèrent la nuit de l’attaque, au point qu’Abdullah ibn al-Husayn et Ahmad ibn Muhammad les craignirent à l’aube."
  ur: مدان کا ایک شخص جس کا ذکر اس کے بھتیجے علی بن ربیع کے ساتھ ان میں ہوا جو بنو حارث کے ساتھ گھر میں داخل ہوئے اور حملے کی رات اسے لوٹا، اس لیے عبداللہ بن حسین اور احمد بن محمد صبح کو ان سے خوف زدہ تھے۔
  es: "Un hombre de Madán, junto con su sobrino Ali ibn Rabi', figuraba entre los que entraron en la casa con Banu al-Harith y la saquearon la noche del ataque, de tal manera que Abdullah ibn al-Husayn y Ahmad ibn Muhammad les temieron al amanecer."
  tr: "Saldırı gecesi Beni el-Harith ile birlikte eve girip evi yağmalayanlar arasında Madani'den bir adamın ve yeğeni Ali bin Rabi'nin adı geçiyordu; bu yüzden Abdullah bin el-Hüseyin ve Ahmed bin Muhammed sabahleyin onlardan korktular."
  id: "Seorang pria dari Madani disebutkan bersama keponakannya Ali bin Rabi’ di antara mereka yang memasuki rumah bersama Bani al-Harith dan menjarahnya pada malam penyerangan, sehingga Abdullah bin al-Hussein dan Ahmad bin Muhammad takut kepada mereka di pagi harinya."
