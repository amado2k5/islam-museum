label:
  ar: الأبرص المداني
  en: Al-Abras al-Madani
  ur: ابرص مدانی
summary:
  ar: رجل مداني ذُكر مع ابن أخيه علي بن ربيع بين من دخلوا الدار مع بني الحارث ونهبوها ليلة الهجوم، فخافهما عبد الله بن الحسين وأحمد بن محمد صباحاً.
  en: A man of Madan named with his nephew Ali ibn Rabi' among those who entered the house with Banu al-Harith and plundered it on the night of the attack, so that Abdullah ibn al-Husayn and Ahmad ibn Muhammad feared them at dawn.
  ur: مدان کا ایک شخص جس کا ذکر اس کے بھتیجے علی بن ربیع کے ساتھ ان میں ہوا جو بنو حارث کے ساتھ گھر میں داخل ہوئے اور حملے کی رات اسے لوٹا، اس لیے عبداللہ بن حسین اور احمد بن محمد صبح کو ان سے خوف زدہ تھے۔
