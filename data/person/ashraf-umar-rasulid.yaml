  en: al-Malik al-Ashraf Mumahhid al-Din Umar ibn Yusuf
summary:
  ar: "الملك الأشرف ممهد الدين عمر بن المظفر يوسف، رابع ملوك بني رسول باليمن؛ ولي بعد أبيه سنة 694هـ، وكان أخوه داود والياً على الشحر فدعا لنفسه ونازعه الأمر فبعث الأشرف عساكره فهزموه وحبسوه، واستمر في ملكه إلى أن سمته جاريته فمات سنة 696هـ لعشرين شهراً من ولايته."
  en: "Al-Malik al-Ashraf Mumahhid al-Din Umar ibn al-Muzaffar Yusuf, fourth Rasulid king of Yemen; succeeding his father in 694 AH, his brother Dawud, wali of al-Shihr, claimed the throne — al-Ashraf's army broke and imprisoned him, and the reign lasted until his slave-girl poisoned him to death in 696 after twenty months."
