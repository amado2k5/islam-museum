label:
  ar: محمد بن نصير
  en: Muhammad ibn Nusayr
  ur: محمد بن نصیر
  es: "Muhammad ibn Nusayr"
  fr: "Muhammad ibn Nusayr"
summary:
  ar: "محمد بن نصير النميري، مَن نُسبت إليه النصيرية؛ ينقل الشهرستاني عن النوبختي أنه ادعى النبوة بإرسال الحسن العسكري، وأنه قال بالتناسخ والتأليه في أبي الحسن {cite:milal-nihal-shahrastani}."
  en: "Muhammad ibn Nusayr al-Namiri, eponym of the Nusayriyya; al-Shahrastani transmits from al-Nawbakhti that he claimed prophethood as sent by al-Hasan al-Askari, professing metempsychosis and deification of Abu'l-Hasan {cite:milal-nihal-shahrastani}."
  es: "Muhammad ibn Nusayr al-Namiri, epónimo de los Nusayriyya; al-Shahrastani transmite de al-Nawbakhti que afirmó ser profeta enviado por al-Hasan al-Askari, profesando metempsicosis y deificación de Abu'l-Hasan {citar:milal-nihal-shahrastani}."
  fr: "Muhammad ibn Nusayr al-Namiri, éponyme du Nusayriyya; al-Shahrastani transmet d'al-Nawbakhti qu'il a revendiqué le statut de prophète envoyé par al-Hasan al-Askari, professant la métempsycose et la déification d'Abu'l-Hasan {cite: milal-nihal-shahrastani}."
  ur: "محمد بن نصیر النمیری، نصیریہ کا تخلص؛ الشہرستانی نے النبختی سے نقل کیا ہے کہ اس نے نبوت کا دعویٰ کیا تھا جیسا کہ حسن العسکری نے بھیجا تھا اور ابوالحسن کی معبودیت اور معبودیت کا دعویٰ کیا تھا۔"
  tr: "Nusayrilerin atfedildiği Muhammed bin Nusayr el-Nimeiri; el-Şehrastani, el-Nevbekhi'den haber, el-Hasan el-Askari'yi göndererek peygamberlik iddiasında bulunduğunu ve Ebu el-Hasan {atıf:milal-nihal-şahrastani} içinde reenkarnasyon ve tanrılaştırmadan bahsettiğini bildirir."
  id: "Muhammad ibn Nusayr al-Nimeiri, yang dikaitkan dengan Nusayri; al-Shahrastani melaporkan dari al-Nawbakhti bahwa ia mengklaim sebagai nabi dengan mengirim al-Hasan al-Askari, dan bahwa ia berbicara tentang reinkarnasi dan pengabdian dalam Abu al-Hasan {cite:milal-nihal-shahrastani}."
