summary:
 ar: "جابر بن عمير الأنصاري المدني، له صحبة. روى عن النبي في فضل الرمي، وروى عنه عطاء بن أبي رباح، ويذكر الكتاب خبراً نقله عطاء عنه وعن جابر بن عبد الله في المزاح والرمي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13751}. وتاريخ وفاته في الكتاب غير معلوم."
 en: "Jabir ibn Umayr al-Ansari al-Madani, a companion. He narrated from the Prophet on the excellence of archery, and Ata ibn Abi Rabah narrated from him. The book reports a story Ata gives about Jabir ibn Abd Allah and Jabir ibn Umayr shooting together and talking about lawful play {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13751}. The book gives no dates for him."
 ur: "جابر بن عمیر انصاری مدنی، صحابی ہیں۔ انہوں نے تیر اندازی کی فضیلت کے بارے میں نبی سے روایت کی، اور عطاء بن ابی رباح نے ان سے روایت کی۔ کتاب میں عطاء کا ایک واقعہ نقل ہوا ہے جس میں جابر بن عبد اللہ اور جابر بن عمیر تیر اندازی کرتے ہیں اور جائز کھیل کا ذکر ہوتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13751}۔ کتاب میں ان کی تاریخ وفات معلوم نہیں۔"
