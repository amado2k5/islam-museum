summary:
  ar: "خريم بن فاتك الأسدي، يروي الحاكم بإسناد عن ابن عباس قصة إسلامه بعد هاتف من الجن سمعه وهو في إبله فأتى المدينة فأسلم، وقال الذهبي: لم يصح؛ ويروي عنه حديث «لولا خصلتان فيك» في وفرة شعره وإسبال إزاره، فجزّ شعره وقصّر إزاره {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}."
  en: "Khuraym ibn Fatik al-Asadi. Al-Hakim gives, with a chain through Ibn 'Abbas, the story of his conversion after he heard a voice of the jinn while out with his camels and then went to Medina and became Muslim; al-Dhahabi says it is not sound. He also gives Khuraym's hadith 'were it not for two traits in you', about his long hair and trailing waist-wrap, after which he cut his hair and shortened his wrap {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}."
  ur: "خریم بن فاتک اسدی۔ حاکم ابن عباس کے واسطے سے ان کے اسلام کا قصہ روایت کرتے ہیں کہ وہ اپنے اونٹوں میں تھے کہ جنوں کی ایک ہاتف آواز سنی، پھر مدینہ آ کر اسلام لائے؛ ذہبی کہتے ہیں: یہ صحیح نہیں۔ وہ ان سے یہ حدیث بھی لاتے ہیں: 'اگر تم میں دو خصلتیں نہ ہوتیں'، یعنی لمبے بال اور لٹکتا تہبند، جس کے بعد انہوں نے بال کٹوا دیے اور تہبند اونچا کر لیا {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}۔"
  es: "Khuraym ibn Fatik al-Asadi. Al-Hakim narra, con una cadena de transmisión a través de Ibn 'Abbas, la historia de su conversión tras escuchar la voz de los genios mientras paseaba con sus camellos, y luego ir a Medina y convertirse al Islam; al-Dhahabi afirma que no es fiable. También cita el hadiz de Khuraym «si no fuera por dos rasgos que hay en ti», sobre su larga cabellera y su faja que le colgaba de la cintura, tras lo cual se cortó el pelo y acortó la faja {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}."
  fr: "Khuraym ibn Fatik al-Asadi. Al-Hakim rapporte, par une chaîne de transmission passant par Ibn 'Abbas, le récit de sa conversion après qu'il eut entendu la voix d'un djinn lors d'une promenade avec ses chameaux, puis se rendit à Médine et se convertit à l'islam; al-Dhahabi conteste son authenticité. Il rapporte également le hadith de Khuraym: « Sans deux traits caractéristiques de ta personnalité », concernant ses longs cheveux et sa longue ceinture, après quoi il se coupa les cheveux et raccourcit sa ceinture (voir: Mustadrak-ilmiyya-ata-v3 p. 720-721)."
  tr: "Huram ibn Fatik al-Asadi, El-Hakim, İbn Abbas'tan bir zincirle, develerinde duyduğu cinlerin çağrısı sonrası İslam'a geçişini anlatır; bu yüzden Medine'ye gelip İslam'ı benimsemiştir. El-Dhahabi şöyle dedi: Bu doğru değildir; ayrıca ondan \"İçinde iki tel saç olmasaydı\" hadisini de anlatır; saçının bolluğu ve giysisinin çatlaması hakkında, saçını kesip giysisini kısalttı {cite:mustadrak-ilmiyya-ata-v3 s. 720-721}"
  id: "Khuraym ibn Fatik al-Asadi, Al-Hakim, menceritakan dengan rantai dari Ibn Abbas kisah pertobatannya ke Islam setelah panggilan jin yang didengarnya saat berada di atas untanya, maka dia datang ke Madinah dan memeluk Islam. Al-Dhahabi berkata: Ini tidak sah; dia juga menceritakan hadits darinya \"Seandainya bukan karena dua helai rambut di tubuhmu\" tentang kelimpahan rambutnya dan retak pakaiannya, maka dia memotong rambutnya dan memendekkan pakaiannya {cite:mustadrak-ilmiyya-ata-v3 hlm. 720-721}."
