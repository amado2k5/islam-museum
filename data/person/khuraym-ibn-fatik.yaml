summary:
  ar: "خريم بن فاتك الأسدي، يروي الحاكم بإسناد عن ابن عباس قصة إسلامه بعد هاتف من الجن سمعه وهو في إبله فأتى المدينة فأسلم، وقال الذهبي: لم يصح؛ ويروي عنه حديث «لولا خصلتان فيك» في وفرة شعره وإسبال إزاره، فجزّ شعره وقصّر إزاره {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}."
  en: "Khuraym ibn Fatik al-Asadi. Al-Hakim gives, with a chain through Ibn 'Abbas, the story of his conversion after he heard a voice of the jinn while out with his camels and then went to Medina and became Muslim; al-Dhahabi says it is not sound. He also gives Khuraym's hadith 'were it not for two traits in you', about his long hair and trailing waist-wrap, after which he cut his hair and shortened his wrap {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}."
  ur: "خریم بن فاتک اسدی۔ حاکم ابن عباس کے واسطے سے ان کے اسلام کا قصہ روایت کرتے ہیں کہ وہ اپنے اونٹوں میں تھے کہ جنوں کی ایک ہاتف آواز سنی، پھر مدینہ آ کر اسلام لائے؛ ذہبی کہتے ہیں: یہ صحیح نہیں۔ وہ ان سے یہ حدیث بھی لاتے ہیں: 'اگر تم میں دو خصلتیں نہ ہوتیں'، یعنی لمبے بال اور لٹکتا تہبند، جس کے بعد انہوں نے بال کٹوا دیے اور تہبند اونچا کر لیا {cite:mustadrak-ilmiyya-ata-v3 p. 720-721}۔"
