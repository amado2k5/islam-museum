summary:
  ar: "محدّث هندي المولد سعودي الجنسية (1930–2017)، درس في ديوبند والأزهر ونال الدكتوراه من كامبريدج (1966)، وأستاذ متقاعد في جامعة الملك سعود، اشتهر بنقده نظريات غولدتسيهر وشاخت في الحديث، وحقّق «صحيح ابن خزيمة» و«الموطأ» و«سنن ابن ماجه»، ونال جائزة الملك فيصل للدراسات الإسلامية (1980)."
  en: "Indian-born Saudi hadith scholar (1930–2017) who studied at Deoband and al-Azhar and took his PhD at Cambridge (1966), professor emeritus at King Saud University, known for his critique of Goldziher's and Schacht's theories of hadith, editor of 'Sahih Ibn Khuzayma', the 'Muwatta' and 'Sunan Ibn Maja', and King Faisal Prize laureate for Islamic Studies (1980)."
  ur: "ہندوستانی نژاد سعودی محدث ⁦(1930ء–2017ء)⁩، جنھوں نے دیوبند اور ازہر میں پڑھا اور کیمبرج سے پی ایچ ڈی کی ⁦(1966ء)⁩، جامعہ ملک سعود کے پروفیسر ایمریٹس، حدیث پر گولڈزیہر اور شاخت کے نظریات پر تنقید کے لیے معروف، «صحیح ابن خزیمہ»، «الموطأ» اور «سنن ابن ماجہ» کے محقق، اور اسلامی علوم کے شاہ فیصل انعام ⁦(1980ء)⁩ یافتہ۔"
  es: "Erudito saudí de origen indio (1930-2017) especializado en hadices, que estudió en Deoband y Al-Azhar y obtuvo su doctorado en Cambridge (1966), profesor emérito de la Universidad Rey Saud, conocido por su crítica a las teorías de Goldziher y Schacht sobre los hadices, editor de 'Sahih Ibn Khuzayma', 'Muwatta' y 'Sunan Ibn Maja', y laureado con el Premio Rey Faisal de Estudios Islámicos (1980)."
  fr: "Érudit saoudien du hadith d'origine indienne (1930-2017) qui a étudié à Deoband et à al-Azhar et a obtenu son doctorat à Cambridge (1966), professeur émérite à l'Université du Roi Saoud, connu pour sa critique des théories du hadith de Goldziher et Schacht, éditeur de 'Sahih Ibn Khuzayma', du 'Muwatta' et du 'Sunan Ibn Maja', et lauréat du prix du roi Faisal pour les études islamiques (1980)."
  tr: "Hindistan doğumlu Suudi vatandaşı bir hadis âlimi (1930–2017), Deoband ve Al-Ezher'de eğitim gördü, doktorasını Cambridge'den (1966) aldı ve King Saud Üniversitesi'nde emekli profesördür. Goldziher'in teorilerine yönelik eleştirileri ve hadis ustalığıyla ün kazandı. 'Sahih Ibn Khuzaymah', 'Al-Muwatta' ve 'Sunan Ibn Majah' adlı eserleri düzenledi ve 1980'de İslam Çalışmaları için Kral Faysal Ödülü'nü aldı."
  id: "Seorang ulama hadis kelahiran India dengan kebangsaan Saudi (1930–2017), belajar di Deoband dan Al-Azhar, meraih gelar PhD dari Cambridge (1966), dan merupakan profesor pensiunan di Universitas King Saud. Ia menjadi terkenal karena kritiknya terhadap teori Goldziher dan penguasaannya dalam hadits. Ia mengedit 'Sahih Ibn Khuzaymah,' 'Al-Muwatta,' dan 'Sunan Ibn Majah,' serta menerima Penghargaan King Faisal untuk Studi Islam (1980)."
