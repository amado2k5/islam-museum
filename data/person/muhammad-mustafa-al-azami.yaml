summary:
  ar: "محدّث هندي المولد سعودي الجنسية (1930–2017)، درس في ديوبند والأزهر ونال الدكتوراه من كامبريدج (1966)، وأستاذ متقاعد في جامعة الملك سعود، اشتهر بنقده نظريات غولدتسيهر وشاخت في الحديث، وحقّق «صحيح ابن خزيمة» و«الموطأ» و«سنن ابن ماجه»، ونال جائزة الملك فيصل للدراسات الإسلامية (1980)."
  en: "Indian-born Saudi hadith scholar (1930–2017) who studied at Deoband and al-Azhar and took his PhD at Cambridge (1966), professor emeritus at King Saud University, known for his critique of Goldziher's and Schacht's theories of hadith, editor of 'Sahih Ibn Khuzayma', the 'Muwatta' and 'Sunan Ibn Maja', and King Faisal Prize laureate for Islamic Studies (1980)."
  ur: "ہندوستانی نژاد سعودی محدث ⁦(1930ء–2017ء)⁩، جنھوں نے دیوبند اور ازہر میں پڑھا اور کیمبرج سے پی ایچ ڈی کی ⁦(1966ء)⁩، جامعہ ملک سعود کے پروفیسر ایمریٹس، حدیث پر گولڈزیہر اور شاخت کے نظریات پر تنقید کے لیے معروف، «صحیح ابن خزیمہ»، «الموطأ» اور «سنن ابن ماجہ» کے محقق، اور اسلامی علوم کے شاہ فیصل انعام ⁦(1980ء)⁩ یافتہ۔"
