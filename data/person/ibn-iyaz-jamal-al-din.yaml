summary:
  ar: "النحوي البغدادي جمال الدين أبو محمد الحسين بن بدر بن إياز، أحد نحاة بغداد، درّس بالمدرسة المستنصرية وصنّف في النحو والتصريف، ومن كتبه «المحصول في شرح الفصول» و«قواعد المطارحة»."
  en: "The Baghdad grammarian Jamal al-Din Abu Muhammad al-Husayn ibn Badr ibn Iyaz, who taught at the Mustansiriya madrasa and wrote on grammar and morphology, including 'al-Mahsul fi Sharh al-Fusul' and 'Qawa'id al-Mutarahah'."
  es: "El gramático de Bagdad Jamal al-Din Abu Muhammad al-Husayn ibn Badr ibn Iyaz, que enseñó en la madrasa Mustansiriya y escribió sobre gramática y morfología, incluyendo 'al-Mahsul fi Sharh al-Fusul' y 'Qawa'id al-Mutarahah'."
  fr: "Le grammairien bagdadien Jamal al-Din Abu Muhammad al-Husayn ibn Badr ibn Iyaz, qui enseignait à la madrasa Mustansiriya et a écrit sur la grammaire et la morphologie, notamment 'al-Mahsul fi Sharh al-Fusul' et 'Qawa'id al-Mutarahah'."
  ur: "بغداد کے گرامر جمال الدین ابو محمد الحسین ابن بدر ابن عیاض، جو مستنصریہ مدرسہ میں پڑھاتے تھے اور گرامر اور مورفولوجی پر لکھتے تھے، جن میں 'المحصول فی شرح الفصل' اور 'قواعد المطرح' شامل ہیں۔"
  tr: "Bağdat'ın dilbilgicilerinden biri olan Bağdatlı dilbilgicisi Cemaleddin Ebu Muhammed el-Hüseyin ibn Bedr ibn İyaz, Mustansiriya okulunda eğitim görmüş ve dilbilgisi ile morfoloji üzerine eserler yazmıştır. Eserleri arasında 'El-Mahsul fi Şerh el-Fusül' ve 'Kava'id el-Mutaraha' bulunmaktadır."
  id: "Ahli tata bahasa Baghdadi, Jamal al-Din Abu Muhammad al-Husayn ibn Badr ibn Iyaz, salah satu ahli tata bahasa Baghdad, belajar di sekolah Mustansiriya dan menulis karya tentang tata bahasa dan morfologi. Di antara karyanya adalah 'Al-Mahsul fi Sharh al-Fusul' dan 'Qawa'id al-Mutaraha'."
