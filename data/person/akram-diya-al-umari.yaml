summary:
  ar: "الدكتور أكرم ضياء العمري، مؤرخ ومحدّث معاصر صاحب «السيرة النبوية الصحيحة» الذي حاول فيه تطبيق قواعد المحدثين في نقد روايات السيرة، وله مقال عن موسى بن عقبة يذكره في كتابه."
  en: "Dr Akram Diya' al-Umari, a contemporary historian and hadith scholar, author of al-Sira al-Nabawiyya al-Sahiha, in which he sets out to apply the hadith scholars' rules to the criticism of sira reports; he also wrote an article on Musa ibn Uqba, which he mentions in the book."
  fr: "Le Dr Akram Diya’ al-Umari, historien contemporain et savant du hadith, est l’auteur d’al-Sira al-Nabawiyya al-Sahiha, où il entreprend d’appliquer les règles des savants du hadith à la critique des récits de la sira ; il écrivit également un article sur Musa ibn Uqba qu’il mentionne dans le livre."
  es: "Dr. Akram Diya' al-Umari, historiador contemporáneo y erudito en hadices, autor de al-Sira al-Nabawiyya al-Sahiha, en el que se propone aplicar las reglas de los eruditos en hadices a la crítica de los informes de sira; también escribió un artículo sobre Musa ibn Uqba, que menciona en el libro."
