summary:
  ar: 'عبد الرحمن بن حرملة بن عمرو بن سنة، أبو حرملة، الأسلمي. روى عن سعيد بن المسيب وحنظلة بن علي الأسلمي وعمرو بن شعيب وغيرهم، وروى عنه الثوري والأوزاعي ومالك وسليمان بن بلال وحاتم بن إسماعيل وغيرهم. قال محمد بن عمرو: كان ثقة كثير الحديث، وذكره ابن حبان في الثقات وقال: يخطئ. ونقل إسحاق عن ابن معين أنه صالح، وقال أبو حاتم: يكتب حديثه ولا يحتج به. وتاريخ وفاته في العنوان سنة 145 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}'
  en: Abd al-Rahman ibn Harmala ibn Amr ibn Sanna, Abu Harmala, al-Aslami. He related from Sa'id ibn al-Musayyab, Handhala ibn Ali al-Aslami, Amr ibn Shu'ayb and others; al-Thawri, al-Awza'i, Malik, Sulayman ibn Bilal and Hatim ibn Isma'il related from him. Muhammad ibn Amr said he was trustworthy and prolific in hadith; Ibn Hibban counted him among the trustworthy and said he errs; Ishaq reported from Ibn Ma'in that he was sound, while Abu Hatim said his hadith is written down but not relied on. The heading gives death 145 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}
  fr: "Abd al-Rahman ibn Harmala ibn Amr ibn Sanna, Abu Harmala, al-Aslami. Il transmit de Sa'id ibn al-Musayyab, de Handhala ibn Ali al-Aslami, d'Amr ibn Shu'ayb et d'autres ; al-Thawri, al-Awza'i, Malik, Sulayman ibn Bilal et Hatim ibn Isma'il transmirent de lui. Muhammad ibn Amr dit qu'il était digne de confiance et riche en hadiths ; Ibn Hibban le compta parmi les dignes de confiance et dit qu'il se trompe ; Ishaq rapporta d'Ibn Ma'in qu'il était sain, tandis qu'Abu Hatim dit que ses hadiths s'écrivent mais qu'on ne s'appuie pas sur eux. L'en-tête donne sa mort en 145 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}"
  ur: عبد الرحمن بن حرملہ بن عمرو بن سنۃ، ابو حرملہ اسلمی۔ انہوں نے سعید بن المسیب، حنظلہ بن علی الاسلمی، عمرو بن شعیب وغیرہ سے روایت کیا، اور ان سے ثوری، اوزاعی، مالک، سلیمان بن بلال اور حاتم بن اسماعیل وغیرہ نے روایت کیا۔ محمد بن عمرو نے انہیں ثقہ اور کثیر الحدیث کہا، ابن حبان نے ثقات میں ذکر کیا اور کہا کہ وہ غلطی کرتے تھے، اور ابو حاتم نے کہا کہ ان کی حدیث لکھی جائے مگر اس سے دلیل نہ لی جائے۔ عنوان کے مطابق وفات 145 ہجری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}
  es: "Abd al-Rahman ibn Harmala ibn Amr ibn Sanna, Abu Harmala, al-Aslami. Relató de Sa'id ibn al-Musayyab, Handhala ibn Ali al-Aslami, Amr ibn Shu'ayb y otros; al-Thawri, al-Awza'i, Malik, Sulayman ibn Bilal y Hatim ibn Isma'il relataron de él. Muhammad ibn Amr dijo que era digno de confianza y prolífico en hadices; Ibn Hibban lo contó entre los dignos de confianza y dijo que se equivocaba; Ishaq informó de Ibn Ma'in que era fiable, mientras que Abu Hatim dijo que sus hadices están escritos pero no son fiables. El encabezado indica que murió en el año 145 de la Hégira. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}"
  tr: "Abdülrahman ibn Harmala ibn Amr ibn Sunnah, Ebu Harmala, el-Aslami. Sa'id ibn el-Musayyab, Hanzalah ibn Ali el-Aslami, Amr ibn Şuayb ve diğerlerinden rivayet etmiştir. El-Sevri, el-Evzai, Malik, Süleyman ibn Bilal, Hatim ibn İsmail ve diğerleri ondan rivayet etmiştir. Muhammed ibn Amr şöyle demiştir: Güvenilir biriydi ve birçok hadis rivayet etmiştir. İbn Hibban, güvenilir raviler kitabında ondan bahsetmiş ve şöyle demiştir: Hatalar yapmıştır. İshak, İbn Ma'in'in onun salih olduğunu söylediğini aktarmıştır. Ebu Hatim şöyle demiştir: Hadisleri kaydedilmiştir ancak delil olarak kullanılmamıştır. Ölüm tarihi 145 Hicri olarak verilmiştir."
  id: "Abd al-Rahman ibn Harmalah ibn Amr ibn Sunnah, Abu Harmalah, al-Aslami. Beliau meriwayatkan dari Sa'id ibn al-Musayyab, Hanzalah ibn Ali al-Aslami, Amr ibn Shu'ayb, dan lainnya. Beliau diriwayatkan oleh al-Thawri, al-Awza'i, Malik, Sulayman ibn Bilal, Hatim ibn Isma'il, dan lainnya. Muhammad ibn Amr berkata: Beliau adalah perawi yang terpercaya dan meriwayatkan banyak hadits. Ibn Hibban menyebutkannya dalam bukunya tentang perawi terpercaya dan berkata: Beliau melakukan kesalahan. Ishaq mengutip Ibn Ma'in yang mengatakan bahwa beliau adalah orang yang saleh. Abu Hatim berkata: Hadits-haditsnya tercatat tetapi tidak digunakan sebagai bukti. Tanggal kematiannya tercatat pada tahun 145 H."
