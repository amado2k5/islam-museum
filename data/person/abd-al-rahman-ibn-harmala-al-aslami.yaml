summary:
  ar: 'عبد الرحمن بن حرملة بن عمرو بن سنة، أبو حرملة، الأسلمي. روى عن سعيد بن المسيب وحنظلة بن علي الأسلمي وعمرو بن شعيب وغيرهم، وروى عنه الثوري والأوزاعي ومالك وسليمان بن بلال وحاتم بن إسماعيل وغيرهم. قال محمد بن عمرو: كان ثقة كثير الحديث، وذكره ابن حبان في الثقات وقال: يخطئ. ونقل إسحاق عن ابن معين أنه صالح، وقال أبو حاتم: يكتب حديثه ولا يحتج به. وتاريخ وفاته في العنوان سنة 145 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}'
  en: Abd al-Rahman ibn Harmala ibn Amr ibn Sanna, Abu Harmala, al-Aslami. He related from Sa'id ibn al-Musayyab, Handhala ibn Ali al-Aslami, Amr ibn Shu'ayb and others; al-Thawri, al-Awza'i, Malik, Sulayman ibn Bilal and Hatim ibn Isma'il related from him. Muhammad ibn Amr said he was trustworthy and prolific in hadith; Ibn Hibban counted him among the trustworthy and said he errs; Ishaq reported from Ibn Ma'in that he was sound, while Abu Hatim said his hadith is written down but not relied on. The heading gives death 145 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}
  ur: عبد الرحمن بن حرملہ بن عمرو بن سنۃ، ابو حرملہ اسلمی۔ انہوں نے سعید بن المسیب، حنظلہ بن علی الاسلمی، عمرو بن شعیب وغیرہ سے روایت کیا، اور ان سے ثوری، اوزاعی، مالک، سلیمان بن بلال اور حاتم بن اسماعیل وغیرہ نے روایت کیا۔ محمد بن عمرو نے انہیں ثقہ اور کثیر الحدیث کہا، ابن حبان نے ثقات میں ذکر کیا اور کہا کہ وہ غلطی کرتے تھے، اور ابو حاتم نے کہا کہ ان کی حدیث لکھی جائے مگر اس سے دلیل نہ لی جائے۔ عنوان کے مطابق وفات 145 ہجری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5504}
