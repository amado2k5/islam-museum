id: person/sulayman-ibn-dawud
class: person
label: { ar: "سليمان بن داود", en: "Sulayman Ibn Dawud" }
summary:
  ar: "سليمان بن داود، يقال والله أعلم وأحكم إنه أول من استعبد الجن والشياطين واستخدمها، وقيل أول من استعبدها على مذاهب الفرس جمشيد بن أونجهان، وكان يكتب لسليمان آصف بن برخيا وهو ابن خالة سليمان عبراني ويوسف بن عيسو عبراني والهرمزاز بن الكردول فارسي وعبراني، وزعم المعزمون أن سليمان جلس وأحضر رئيس الجن والشياطين واسمه فقطس وعرضهم فعرفه اسم واحد واحد منهم وفعله في ولد آدم وأخذ عليهم العهد والميثاق فإذا أقسم عليهم بذلك العهد أجابوا وانصرفوا، وأولئك العفاريت سبعون {cite:fihrist-ibn-al-nadim p. 430-431}."
  en: "Solomon — first to bind the jinn, in the exorcists' account, with his scribes Asaf, Yusuf and Harmazaz {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
