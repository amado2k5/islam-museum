  ar: "موسى بن حسين بن موسى بن عمران القيسي، أبو عمران، الزاهد المعروف بالميرتلي، شاعر أندلسي له علم بالتفسير والفقه والحديث، أصله من ميرتلة وأقام بإشبيلية وتوفي بفاس، ٥٢٢ إلى ٦٠٤هـ؛ له ديوان شعر في الزهد."
  en: "Musa ibn Husayn al-Qaysi, Abu Imran, the ascetic known as al-Mirtuli, an Andalusi poet with knowledge of exegesis, jurisprudence and hadith, from Mertola, who lived in Seville and died at Fes, 522 to 604 AH (1128 to 1207); author of a diwan mostly on asceticism."
