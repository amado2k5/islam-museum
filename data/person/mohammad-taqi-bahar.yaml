summary:
  ar: "شاعر وعالم وصحفي وسياسي إيراني (1886–1951) لُقّب بملک‌الشعراء؛ من رجال الثورة الدستورية ومحرّري صحفها ونوّاب المجلس، صار أستاذًا للأدب الفارسي في جامعة طهران وألّف «سبک‌شناسی» في تاريخ أساليب النثر الفارسي وحرّر نصوصًا تاريخية كبرى."
  en: "Iranian poet, scholar, journalist and politician (1886-1951), titled Malek osh-Sho'ara ('king of poets'); a constitutionalist newspaper editor and Majlis deputy who became professor of Persian literature at Tehran University, wrote Sabk-shenasi, the standard history of Persian prose styles, and edited major historical texts."
