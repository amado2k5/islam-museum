  ar: "عباس كامل ⁦(وُلد سنة 1957)⁩ لواء مصري ترأس جهاز المخابرات العامة من 2018 إلى 2024، ويشغل منذئذ منصب مستشار رئيس الجمهورية منسقًا عامًا للأجهزة الأمنية ومبعوثًا خاصًا للرئيس. ضابط مدرعات كان مدير مكتب الرئيس السيسي منذ 2014 قبل توليه رئاسة الجهاز."
  en: "Abbas Kamel (born 1957) is an Egyptian major general who directed the General Intelligence Directorate from 2018 to 2024 and has since served as a presidential adviser coordinating the security apparatuses and as the president's special envoy. An armoured-corps officer, he was President el-Sisi's office director from 2014 before taking over the intelligence service."
