summary:
  ar: "عالم وسياسي فلسطيني من عكا (1860–1940)، درس في الأزهر وعمل في القضاء الشرعي العثماني، ومثّل عكا في مجلس المبعوثان، وعُيّن مفتيًا للجيش العثماني الرابع في الحرب العالمية الأولى، وقاد المعارضة الفلسطينية للمجلس الإسلامي الأعلى زمن الانتداب؛ وهو والد أحمد الشقيري، أول رئيس لمنظمة التحرير الفلسطينية."
  en: "Palestinian scholar and politician from Acre (1860–1940). Trained at al-Azhar, he served in the Ottoman sharia judiciary, sat for Acre in the Ottoman parliament, was appointed mufti of the Fourth Ottoman Army in the First World War, and led the Palestinian opposition to the Supreme Muslim Council under the Mandate; he was the father of Ahmad Shukeiri, the PLO's first chairman."
  ur: "عکہ سے تعلق رکھنے والے فلسطینی عالم اور سیاست دان (1860–1940)۔ انہوں نے الازہر سے تعلیم پائی، عثمانی شرعی عدلیہ میں خدمات انجام دیں، عثمانی پارلیمنٹ میں عکہ کی نمائندگی کی، پہلی جنگِ عظیم میں چوتھی عثمانی فوج کے مفتی مقرر ہوئے، اور انتداب کے دور میں مجلسِ اسلامی اعلیٰ کی مخالفت کی قیادت کی؛ وہ احمد الشقیری کے والد تھے، جو پی ایل او کے پہلے چیئرمین بنے۔"
