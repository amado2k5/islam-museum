summary:
  ar: "عالم وسياسي فلسطيني من عكا (1860–1940)، درس في الأزهر وعمل في القضاء الشرعي العثماني، ومثّل عكا في مجلس المبعوثان، وعُيّن مفتيًا للجيش العثماني الرابع في الحرب العالمية الأولى، وقاد المعارضة الفلسطينية للمجلس الإسلامي الأعلى زمن الانتداب؛ وهو والد أحمد الشقيري، أول رئيس لمنظمة التحرير الفلسطينية."
  en: "Palestinian scholar and politician from Acre (1860–1940). Trained at al-Azhar, he served in the Ottoman sharia judiciary, sat for Acre in the Ottoman parliament, was appointed mufti of the Fourth Ottoman Army in the First World War, and led the Palestinian opposition to the Supreme Muslim Council under the Mandate; he was the father of Ahmad Shukeiri, the PLO's first chairman."
  ur: "عکہ سے تعلق رکھنے والے فلسطینی عالم اور سیاست دان (1860–1940)۔ انہوں نے الازہر سے تعلیم پائی، عثمانی شرعی عدلیہ میں خدمات انجام دیں، عثمانی پارلیمنٹ میں عکہ کی نمائندگی کی، پہلی جنگِ عظیم میں چوتھی عثمانی فوج کے مفتی مقرر ہوئے، اور انتداب کے دور میں مجلسِ اسلامی اعلیٰ کی مخالفت کی قیادت کی؛ وہ احمد الشقیری کے والد تھے، جو پی ایل او کے پہلے چیئرمین بنے۔"
  es: "Erudito y político palestino de Acre (1860-1940). Formado en Al-Azhar, sirvió en el poder judicial otomano de la sharia, fue diputado por Acre en el parlamento otomano, fue nombrado muftí del Cuarto Ejército Otomano en la Primera Guerra Mundial y lideró la oposición palestina al Consejo Supremo Musulmán durante el Mandato Británico; fue padre de Ahmad Shukeiri, el primer presidente de la OLP."
  fr: "Érudit et homme politique palestinien originaire d'Acre (1860-1940). Formé à al-Azhar, il a servi dans le système judiciaire islamique ottoman, a siégé pour Acre au parlement ottoman, a été nommé mufti de la quatrième armée ottomane pendant la Première Guerre mondiale et a dirigé l'opposition palestinienne au Conseil suprême musulman sous le Mandat; il était le père d'Ahmad Shukeiri, le premier président de l'OLP."
  tr: "Akka'dan Filistinli bir bilim insanı ve siyasetçi olan Sher, 1860–1940 yılları arasında El-Ezher'de eğitim gördü, Osmanlı Şeriat yargısında çalıştı, Akka'yı Elçiler Konseyi'nde temsil etti, I. Dünya Savaşı sırasında Dördüncü Osmanlı Ordusu'nun müftüsü olarak atandı ve Manda döneminde Filistin muhalefetini Yüksek İslam Konseyi'ne yönetti. Filistin Kurtuluş Örgütü'nün ilk başkanı Ahmed Al-Shuqairi'nin babasıdır."
  id: "Seorang ulama dan politisi Palestina dari Acre (1860–1940), ia belajar di Al-Azhar, bekerja di peradilan Syariah Ottoman, mewakili Acre di Dewan Utusan, diangkat sebagai mufti Tentara Ottoman Keempat selama Perang Dunia I, dan memimpin oposisi Palestina terhadap Dewan Islam Tertinggi selama masa Mandat. Ia adalah ayah dari Ahmed Al-Shuqairi, presiden pertama Organisasi Pembebasan Palestina."
