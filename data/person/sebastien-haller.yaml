summary:
  ar: "لاعب كرة قدم عاجي، وُلد في ري أورانجي بفرنسا سنة 1994. مهاجم لعب لأوتريخت وآينتراخت فرانكفورت ووست هام وأياكس الذي فاز معه بالدوري الهولندي، ثم بوروسيا دورتموند؛ شُخّصت إصابته بورم خبيث في الخصية سنة 2022 فعاد إلى اللعب بعد العلاج، وسجل هدف الفوز لساحل العاج في نهائي كأس أمم أفريقيا 2023. مثّل فرنسا في الفئات السنية ثم اختار منتخب ساحل العاج سنة 2020."
  en: "Ivorian footballer, born in Ris-Orangis, France in 1994. A striker who played for Utrecht, Eintracht Frankfurt, West Ham United and Ajax — winning the Eredivisie with Ajax — then Borussia Dortmund; diagnosed with a malignant testicular tumour in 2022, he returned to play after treatment, and scored Ivory Coast's winning goal in the 2023 Africa Cup of Nations final. He represented France at youth level before switching to Ivory Coast in 2020."
  ur: "آئیوریائی فٹبالر، 1994 میں فرانس کے ری اورانژی میں پیدا ہوئے۔ اسٹرائیکر جو اتریخت، آئنٹراخٹ فرینکفرٹ، ویسٹ ہیم اور ایجیکس کے لیے کھیلے — ایجیکس کے ساتھ ایریڈیویزی جیتی — پھر بوروسیا ڈورٹمنڈ؛ 2022 میں خصیے کے مہلک رسولے کی تشخیص کے بعد علاج کروا کر کھیل میں واپس آئے، اور آئیوری کوسٹ کے لیے 2023 افریقہ کپ آف نیشنز کے فائنل میں فاتحانہ گول کیا۔ نوجوانوں کی سطح پر فرانس کی نمائندگی کے بعد 2020 میں آئیوری کوسٹ اختیار کیا۔"
  es: "Futbolista marfileño, nacido en Ris-Orangis, Francia, en 1994. Delantero que jugó en el Utrecht, Eintracht Frankfurt, West Ham United y Ajax —ganando la Eredivisie con el Ajax— y posteriormente en el Borussia Dortmund; diagnosticado con un tumor testicular maligno en 2022, regresó a las canchas tras el tratamiento y marcó el gol de la victoria para Costa de Marfil en la final de la Copa Africana de Naciones 2023. Representó a Francia en categorías inferiores antes de cambiar a Costa de Marfil en 2020."
  fr: "Footballeur ivoirien, né à Ris-Orangis en 1994. Attaquant, il a évolué à Utrecht, à l'Eintracht Francfort, à West Ham United et à l'Ajax Amsterdam – remportant l'Eredivisie avec ce dernier – puis au Borussia Dortmund. Diagnostiqué d'une tumeur testiculaire maligne en 2022, il a repris la compétition après son traitement et a inscrit le but victorieux de la Côte d'Ivoire en finale de la Coupe d'Afrique des Nations 2023. Il a représenté la France chez les jeunes avant de rejoindre la Côte d'Ivoire en 2020."
  tr: "1994 yılında Fransa'nın Ré-Orange kentinde doğan Fildişi Sahili futbolcu. Utrecht, Eintracht Frankfurt, West Ham ve Ajax takımlarında oynamış, Hollanda ligini kazanmış, ardından Borussia Dortmund'da oynamıştır; 2022'de testisinde kötü huylu tümör teşhisi konduğundan, tedaviden sonra tekrar oynamaya dönmüş ve 2023 Afrika Uluslar Kupası finalinde Fildişi Sahili adına galibiyet golünü atmıştır. 2020'de Fildişi Sahili milli takımını seçmeden önce Fransa'yı genç kategorilerde temsil etmiştir."
  id: "Seorang pemain sepak bola asal Pantai Gading, lahir di Ré-Orange, Prancis, pada tahun 1994. Seorang penyerang yang bermain untuk Utrecht, Eintracht Frankfurt, West Ham, dan Ajax, di mana ia memenangkan liga Belanda, lalu Borussia Dortmund; ia didiagnosis menderita tumor ganas di testis pada tahun 2022, sehingga ia kembali bermain setelah perawatan, mencetak gol kemenangan untuk Pantai Gading di final Piala Afrika 2023. Ia mewakili Prancis di kategori muda sebelum memilih tim nasional Pantai Gading pada tahun 2020."
