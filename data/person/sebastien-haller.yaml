summary:
  ar: "لاعب كرة قدم عاجي، وُلد في ري أورانجي بفرنسا سنة 1994. مهاجم لعب لأوتريخت وآينتراخت فرانكفورت ووست هام وأياكس الذي فاز معه بالدوري الهولندي، ثم بوروسيا دورتموند؛ شُخّصت إصابته بورم خبيث في الخصية سنة 2022 فعاد إلى اللعب بعد العلاج، وسجل هدف الفوز لساحل العاج في نهائي كأس أمم أفريقيا 2023. مثّل فرنسا في الفئات السنية ثم اختار منتخب ساحل العاج سنة 2020."
  en: "Ivorian footballer, born in Ris-Orangis, France in 1994. A striker who played for Utrecht, Eintracht Frankfurt, West Ham United and Ajax — winning the Eredivisie with Ajax — then Borussia Dortmund; diagnosed with a malignant testicular tumour in 2022, he returned to play after treatment, and scored Ivory Coast's winning goal in the 2023 Africa Cup of Nations final. He represented France at youth level before switching to Ivory Coast in 2020."
  ur: "آئیوریائی فٹبالر، 1994 میں فرانس کے ری اورانژی میں پیدا ہوئے۔ اسٹرائیکر جو اتریخت، آئنٹراخٹ فرینکفرٹ، ویسٹ ہیم اور ایجیکس کے لیے کھیلے — ایجیکس کے ساتھ ایریڈیویزی جیتی — پھر بوروسیا ڈورٹمنڈ؛ 2022 میں خصیے کے مہلک رسولے کی تشخیص کے بعد علاج کروا کر کھیل میں واپس آئے، اور آئیوری کوسٹ کے لیے 2023 افریقہ کپ آف نیشنز کے فائنل میں فاتحانہ گول کیا۔ نوجوانوں کی سطح پر فرانس کی نمائندگی کے بعد 2020 میں آئیوری کوسٹ اختیار کیا۔"
