summary:
  ar: "أبو عبد الرحمن محمد بن الحسين السلمي النيسابوري، صاحب «طبقات الصوفية» و«حقائق التفسير»؛ ولد بنيسابور في 10 جمادى الآخرة 325هـ فيما يقول تلميذه الخشاب، ونشأ في كنف جده لأمه أبي عمرو إسماعيل بن نجيد فنسب إلى بني سليم، وبنى للصوفية خانقاه بنيسابور دفن فيها يوم الأحد 3 شعبان 412هـ؛ واختلف نقاد الحديث في توثيقه {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}."
  en: "Abu 'Abd al-Rahman Muhammad ibn al-Husayn al-Sulami of Nishapur, author of Tabaqat al-Sufiyya and Haqa'iq al-Tafsir; born in Nishapur on 10 Jumada al-Akhira 325 AH according to his pupil al-Khashshab, raised by his maternal grandfather Abu 'Amr Isma'il ibn Nujayd and so named after the Banu Sulaym, he built a lodge for the Sufis in Nishapur where he was buried on Sunday 3 Sha'ban 412 AH; the hadith critics differed over his reliability {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}."
  ur: "ابو عبد الرحمن محمد بن الحسین سلمی نیشاپوری، «طبقات الصوفیہ» اور «حقائق التفسیر» کے مصنف؛ ان کے شاگرد خشاب کے مطابق 10 جمادی الآخرہ 325ھ کو نیشاپور میں پیدا ہوئے، اپنے نانا ابو عمرو اسماعیل بن نجید کی سرپرستی میں پلے اور اسی لیے بنو سلیم کی نسبت سے مشہور ہوئے، نیشاپور میں صوفیہ کے لیے خانقاہ بنائی جس میں اتوار 3 شعبان 412ھ کو دفن ہوئے؛ ناقدینِ حدیث ان کی توثیق میں مختلف ہوئے {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}۔"
