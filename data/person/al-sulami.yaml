summary:
  ar: "أبو عبد الرحمن محمد بن الحسين السلمي النيسابوري، صاحب «طبقات الصوفية» و«حقائق التفسير»؛ ولد بنيسابور في 10 جمادى الآخرة 325هـ فيما يقول تلميذه الخشاب، ونشأ في كنف جده لأمه أبي عمرو إسماعيل بن نجيد فنسب إلى بني سليم، وبنى للصوفية خانقاه بنيسابور دفن فيها يوم الأحد 3 شعبان 412هـ؛ واختلف نقاد الحديث في توثيقه {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}."
  en: "Abu 'Abd al-Rahman Muhammad ibn al-Husayn al-Sulami of Nishapur, author of Tabaqat al-Sufiyya and Haqa'iq al-Tafsir; born in Nishapur on 10 Jumada al-Akhira 325 AH according to his pupil al-Khashshab, raised by his maternal grandfather Abu 'Amr Isma'il ibn Nujayd and so named after the Banu Sulaym, he built a lodge for the Sufis in Nishapur where he was buried on Sunday 3 Sha'ban 412 AH; the hadith critics differed over his reliability {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}."
  fr: "Abu 'Abd al-Rahman Muhammad ibn al-Husayn al-Sulami de Nichapour, auteur de Tabaqat al-Sufiyya et Haqaiq al-Tafsir ; Né à Nichapour le 10 Jumada al-Akhira 325 de l’hégire selon son élève al-Khashshab, élevé par son grand-père maternel Abu 'Amr Isma'il ibn Nujayd et ainsi nommé d'après les Banu Sulaym, il a construit une loge pour les soufis à Nichapour où il a été enterré le dimanche 3 chaabane 412 de l’hégire ; les critiques du hadith ont divergé sur sa fiabilité {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}."
  ur: "ابو عبد الرحمن محمد بن الحسین سلمی نیشاپوری، «طبقات الصوفیہ» اور «حقائق التفسیر» کے مصنف؛ ان کے شاگرد خشاب کے مطابق 10 جمادی الآخرہ 325ھ کو نیشاپور میں پیدا ہوئے، اپنے نانا ابو عمرو اسماعیل بن نجید کی سرپرستی میں پلے اور اسی لیے بنو سلیم کی نسبت سے مشہور ہوئے، نیشاپور میں صوفیہ کے لیے خانقاہ بنائی جس میں اتوار 3 شعبان 412ھ کو دفن ہوئے؛ ناقدینِ حدیث ان کی توثیق میں مختلف ہوئے {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44}۔"
  es: "Abu 'Abd al-Rahman Muhammad ibn al-Husayn al-Sulami de Nishapur, autor de Tabaqat al-Sufiyya y Haqa'iq al-Tafsir; nacido en Nishapur el 10 de Jumada al-Akhira 325 AH según su alumno al-Khashshab, criado por su abuelo materno Abu 'Amr Isma'il ibn Nujayd y llamado así por los Banu Sulaym; los críticos del hadiz discreparon sobre su confiabilidad {cita:tabaqat-sufiyya-sulami-khanji-1986 p. 16} {citar:tabaqat-sufiyya-sulami-khanji-1986 p. 17} {citar:tabaqat-sufiyya-sulami-khanji-1986 p. 30} {citar:tabaqat-sufiyya-sulami-khanji-1986 p. 44}."
  tr: "Ebu Abd al-Rahman Muhammed bin el-Hüseyin el-Sulami el-Nisaburi, 'Tabaqat el-Sufiyya' ve 'Haka'iq al-Tafsir' kitaplarının yazarıdır; öğrencisi el-Khashab'a göre, 10 Cumedül-Akhirah 325 Hile Nişapur'da doğmuştur. Annesinin babası Ebu Emr İsmail bin Nujad'ın bakımında büyümüştür; bu büyükbaba Banu Süleym'e atfedilmiştir. 3 Şaban 412 Hicri Pazar günü Nişapur'da bir Sufi hankahı inşa etmiştir; hadis eleştirmenleri onun doğruluğu konusunda farklı görüşler sergilemiştir {cite:tabaqat-sufiyya-sulami-khanji-1986, s. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986, s. 44}."
  id: "Abu Abd al-Rahman Muhammad ibn al-Husayn al-Sulami al-Nisaburi, penulis 'Tabaqat al-Sufiyya' dan 'Haqa'iq al-Tafsir'; ia lahir di Nishapur pada 10 Jumada al-Akhirah 325 H, menurut muridnya al-Khashab. Ia tumbuh di bawah asuhan kakek dari pihak ibu, Abu Amr Ismail ibn Nujad, yang dikaitkan dengan Banu Sulaym. Ia membangun sebuah khanqah Sufi di Nishapur pada hari Minggu, 3 Sha'ban 412 H; para kritikus hadis berbeda pendapat dalam pengakuannya {cite:tabaqat-sufiyya-sulami-khanji-1986, hlm. 16} {cite:tabaqat-sufiyya-sulami-khanji-1986, hlm. 44}."
