summary:
  ar: "قيس بن الربيع الأسدي الكوفي، يصفه الذهبي في «ميزان الاعتدال» بأنه أحد أوعية العلم، صدوق في نفسه سيئ الحفظ. أثنى عليه شعبة وشريك ولقّبوه «قيساً الجوّال» لكثرة طلبه، وضعّفه ابن معين ووكيع وابن المديني والدارقطني، وقال النسائي متروك، وعلّل أحمد ترك حديثه بالتشيع وكثرة الخطأ، ورأى ابن حبان وابن نمير أن آفته ابن له كان يدخل عليه في كتبه بعد أن كبر، وختم ابن عدي بأن عامة رواياته مستقيمة {cite:mizan-itidal-bijawi-v3 p. 393-396}."
  en: "Qays ibn al-Rabi' al-Asadi of Kufa, whom al-Dhahabi's Mizan al-I'tidal calls one of the vessels of learning, truthful in himself but of poor memory. Shu'ba and Sharik praised him — he was nicknamed 'Qays the wanderer' for his tireless seeking of hadith — while Ibn Ma'in, Waki', Ibn al-Madini and al-Daraqutni weakened him, al-Nasa'i called him abandoned, and Ahmad explained his rejection by Shi'ite leanings and frequent mistakes; Ibn Hibban and Ibn Numayr blamed a son of his who tampered with his books in his old age, and Ibn Adi concluded that most of his narrations are sound."
