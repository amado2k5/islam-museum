summary:
  ar: "قيس بن الربيع الأسدي الكوفي، يصفه الذهبي في «ميزان الاعتدال» بأنه أحد أوعية العلم، صدوق في نفسه سيئ الحفظ. أثنى عليه شعبة وشريك ولقّبوه «قيساً الجوّال» لكثرة طلبه، وضعّفه ابن معين ووكيع وابن المديني والدارقطني، وقال النسائي متروك، وعلّل أحمد ترك حديثه بالتشيع وكثرة الخطأ، ورأى ابن حبان وابن نمير أن آفته ابن له كان يدخل عليه في كتبه بعد أن كبر، وختم ابن عدي بأن عامة رواياته مستقيمة {cite:mizan-itidal-bijawi-v3 p. 393-396}."
  en: "Qays ibn al-Rabi' al-Asadi of Kufa, whom al-Dhahabi's Mizan al-I'tidal calls one of the vessels of learning, truthful in himself but of poor memory. Shu'ba and Sharik praised him — he was nicknamed 'Qays the wanderer' for his tireless seeking of hadith — while Ibn Ma'in, Waki', Ibn al-Madini and al-Daraqutni weakened him, al-Nasa'i called him abandoned, and Ahmad explained his rejection by Shi'ite leanings and frequent mistakes; Ibn Hibban and Ibn Numayr blamed a son of his who tampered with his books in his old age, and Ibn Adi concluded that most of his narrations are sound."
  es: "Qays ibn al-Rabi' al-Asadi de Kufa, a quien el Mizan al-I'tidal de al-Dhahabi llama uno de los grandes sabios, veraz en sí mismo pero de mala memoria. Shu'ba y Sharik lo elogiaron —fue apodado 'Qays el errante' por su incansable búsqueda de hadices—, mientras que Ibn Ma'in, Waki', Ibn al-Madini y al-Daraqutni lo desacreditaron, al-Nasa'i lo llamó abandonado, y Ahmad explicó su rechazo por sus inclinaciones chiítas y sus frecuentes errores; Ibn Hibban e Ibn Numayr culparon a un hijo suyo que manipuló sus libros en su vejez, e Ibn Adi concluyó que la mayoría de sus narraciones son auténticas."
  fr: "Qays ibn al-Rabi' al-Asadi de Koufa, que le Mizan al-I'tidal d'al-Dhahabi décrit comme un grand érudit, véridique mais à la mémoire défaillante, fut loué par Shu'ba et Sharik – on le surnommait « Qays le vagabond » pour sa recherche inlassable de hadiths – tandis qu'Ibn Ma'in, Waki', Ibn al-Madini et al-Daraqutni le critiquèrent. Al-Nasa'i le qualifia d'errant, et Ahmad expliqua son rejet par ses sympathies chiites et ses erreurs fréquentes. Ibn Hibban et Ibn Numayr accusèrent un de ses fils d'avoir falsifié ses livres à un âge avancé, et Ibn Adi conclut que la plupart de ses récits étaient authentiques."
  ur: "کوفہ کا قیس بن الربیع الاسدی، جسے الذہبی کا میزان الاعتدال علم کے برتنوں میں سے ایک، اپنے آپ میں سچا لیکن کمزور حافظہ کہتا ہے۔ شعبہ اور شارق نے اس کی تعریف کی - اسے حدیث کی انتھک تلاش کی وجہ سے 'قیس دی آوارہ' کا لقب دیا گیا - جب کہ ابن معین، وکیع، ابن المدینی اور الدارقطنی نے اسے کمزور کیا، النسائی نے اسے لاوارث کہا، اور احمد نے اس کے انکار اور شیعہ کی غلطی کی وضاحت کی۔ ابن حبان اور ابن نمیر نے ان کے ایک بیٹے کو مورد الزام ٹھہرایا جس نے بڑھاپے میں اپنی کتابوں میں چھیڑ چھاڑ کی اور ابن عدی نے یہ نتیجہ اخذ کیا کہ ان کی اکثر روایتیں صحیح ہیں۔"
  tr: "Qays ibn al-Rabi' al-Asadi al-Kufi, el-Dhahabi tarafından 'Mizan al-I'tidal'da bilgi taşıyıcılarından biri, ruhunda doğru ve kötü ezberlenmiş olarak tanımlanmıştır. Şube ve Şerik tarafından övülmüş, sık sık uğraştığı için ona 'Qaysa al-Jawwal' lakabını vermiştir. İbn Ma'in, Waki', İbn al-Medini ve al-Daraqutni onu zayıflatmıştır. El-Nasa'i bunun terk edildiğini söylemiştir. Ahmed, terk edilmesini Şiiliğe ve sık sık yaptığı hatalara bağlamıştır. İbn Hibban ve İbn Numayr, oğlunun suçunun büyüdükçe kitaplarında bulunduğunu görmüştür. İbn Adi, rivayetlerinin çoğunun basit olduğunu sonucuna varmıştır {cite:mizan-itidal-bijawi-v3, s. 393-396}."
  id: "Qays ibn al-Rabi' al-Asadi al-Kufi, yang digambarkan oleh al-Dhahabi dalam 'Mizan al-I'tidal' sebagai salah satu wadah pengetahuan, jujur di dalam jiwanya, dan kurang dihafal. Ia dipuji oleh Shu'bah dan Sharik, yang menjulukinya 'Qaysa al-Jawwal' karena kegiatannya yang sering. Ibn Ma'in, Waki', Ibn al-Madini, dan al-Daraqutni melemahkannya. Al-Nasa'i mengatakan bahwa ia telah ditinggalkan. Ahmad mengaitkan pengabaiannya dengan Syiah dan sering melakukan kesalahan. Ibn Hibban dan Ibn Numayr melihat bahwa kesalahan putranya ditemukan dalam buku-bukunya setelah ia dewasa. Ibn 'Adi menyimpulkan bahwa sebagian besar riwayatnya langsung {cite:mizan-itidal-bijawi-v3, hlm. 393-396}."
