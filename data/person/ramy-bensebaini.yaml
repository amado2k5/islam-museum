  ar: "لاعب كرة قدم جزائري محترف (وُلد سنة 1995 في قسنطينة)، مدافع تخرّج في أكاديمية بارادو ولعب لرين الفرنسي وبوروسيا مونشنغلادباخ ثم بوروسيا دورتموند منذ 2023، وخاض نحو تسعين مباراة دولية مع الجزائر وفاز بكأس الأمم الأفريقية 2019."
