summary:
  ar: "أبو الضياء عبد الرحمن بن عبد الكريم بن زياد العكي المقصري الزبيدي الشافعي مذهباً الأشعري معتقداً الحكمي خرقة اليافعي تصوفاً — وفي ذلك يقول: «أنا شافعي في الفروع ويافعي — في التصوف أشعري المعتقد»؛ ولد في رجب سنة تسعمائة وحفظ القرآن والإشارة وأخذ عن محمد موسى الضباعي وأحمد المزجد وتلميذه الطنبذاوي وبه تخرج وانتفع، وأخذ التفسير والحديث والسير عن الحافظ وجيه الدين بن الديبع والفرائض عن الغريب الحتقي والأصول عن جمال الدين يحيى قبيب والعربية عن محمد مفضل اللحاني، وجد واجتهد حتى صار عيناً من أعيان الزمان وقصدته الفتاوى من شاسع البلاد، واشتغل بالإفتاء من وفاة شيخه الطنبذاوي سنة ثمان وأربعين وتسعمائة، وكان من الفقر على جانب عظيم بحيث كان يصبح وليس عنده قوت يومه حتى اتفق أن زوجته وضعت وليس عنده شيء حتى عجز عن المصباح فباتوا كذلك؛ وفي سنة أربع وستين نزل في عينيه ما كفّ بصره فاحتسب ورضي وقال مرحباً بموهبة الله، وجاءه قداح فقال له أنا أصلح بصرك وقال بعض أهل الثروة وأنا أنفق عليك وعلى عيالك مدة ذلك فامتنع وقال: شيء ألبسنيه الله لا أتسبب في إبطاله، ومع ذلك كان على عادته من التدريس والإفتاء والتصنيف؛ ومن مصنفاته: إثبات رفع اليدين عند الإحرام والركوع والاعتدال والقيام من الركعتين، وكتاب فتح المبين في أحكام تبرع المدين والمقالة الناصعة والذيل والخلاصة — وهذه الكتب الثلاثة صنفها بسبب ما وقع بينه وبين ابن حجر في عدم بطلان تبرع المدين — وكتاب النخبة في الأخوة والصحبة، والأدلة الواضحة في الجهر بالبسملة وأنها من الفاتحة، وإقامة البرهان على كمية التراويح في رمضان، وكشف الغمة عن حكم المقبوض عما في الذمة، ولون الملك فيه موقوفاً عند الأئمة، ومزيل العناء في أحكام الغناء، وسمط اللآل في كتب الأعمال، وكشف النقاب عن أحكام الحراب؛ وتوفي بزبيد ليلة الأحد حادي عشر رجب {cite:shadharat-dhahab p. 377-378}."
  en: "Zabid's blind mufti — 'a Shafi'i in branches, a Yafi'i in Sufism, an Ash'ari in creed'; Tanbadhawi's own pupil who taught and gave fatwas from 948; in 964 a film fell over his eyes — 'welcome, gift of God' — and he refused the surgeon: 'what God clothed me in, I shall not remove'; his works include the famous quarrel-books with Ibn Hajar al-Haytami on debtor-gifts, the raised-hands proof, the aloud-basmala tract and the singing rulings; died Zabid Sunday eve 11 Rajab [975] {cite:shadharat-dhahab p. 377-378}."
