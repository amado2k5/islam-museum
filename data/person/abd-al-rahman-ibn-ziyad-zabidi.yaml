summary:
  ar: "أبو الضياء عبد الرحمن بن عبد الكريم بن زياد العكي المقصري الزبيدي الشافعي مذهباً الأشعري معتقداً الحكمي خرقة اليافعي تصوفاً — وفي ذلك يقول: «أنا شافعي في الفروع ويافعي — في التصوف أشعري المعتقد»؛ ولد في رجب سنة تسعمائة وحفظ القرآن والإشارة وأخذ عن محمد موسى الضباعي وأحمد المزجد وتلميذه الطنبذاوي وبه تخرج وانتفع، وأخذ التفسير والحديث والسير عن الحافظ وجيه الدين بن الديبع والفرائض عن الغريب الحتقي والأصول عن جمال الدين يحيى قبيب والعربية عن محمد مفضل اللحاني، وجد واجتهد حتى صار عيناً من أعيان الزمان وقصدته الفتاوى من شاسع البلاد، واشتغل بالإفتاء من وفاة شيخه الطنبذاوي سنة ثمان وأربعين وتسعمائة، وكان من الفقر على جانب عظيم بحيث كان يصبح وليس عنده قوت يومه حتى اتفق أن زوجته وضعت وليس عنده شيء حتى عجز عن المصباح فباتوا كذلك؛ وفي سنة أربع وستين نزل في عينيه ما كفّ بصره فاحتسب ورضي وقال مرحباً بموهبة الله، وجاءه قداح فقال له أنا أصلح بصرك وقال بعض أهل الثروة وأنا أنفق عليك وعلى عيالك مدة ذلك فامتنع وقال: شيء ألبسنيه الله لا أتسبب في إبطاله، ومع ذلك كان على عادته من التدريس والإفتاء والتصنيف؛ ومن مصنفاته: إثبات رفع اليدين عند الإحرام والركوع والاعتدال والقيام من الركعتين، وكتاب فتح المبين في أحكام تبرع المدين والمقالة الناصعة والذيل والخلاصة — وهذه الكتب الثلاثة صنفها بسبب ما وقع بينه وبين ابن حجر في عدم بطلان تبرع المدين — وكتاب النخبة في الأخوة والصحبة، والأدلة الواضحة في الجهر بالبسملة وأنها من الفاتحة، وإقامة البرهان على كمية التراويح في رمضان، وكشف الغمة عن حكم المقبوض عما في الذمة، ولون الملك فيه موقوفاً عند الأئمة، ومزيل العناء في أحكام الغناء، وسمط اللآل في كتب الأعمال، وكشف النقاب عن أحكام الحراب؛ وتوفي بزبيد ليلة الأحد حادي عشر رجب {cite:shadharat-dhahab p. 377-378}."
  en: "Zabid's blind mufti — 'a Shafi'i in branches, a Yafi'i in Sufism, an Ash'ari in creed'; Tanbadhawi's own pupil who taught and gave fatwas from 948; in 964 a film fell over his eyes — 'welcome, gift of God' — and he refused the surgeon: 'what God clothed me in, I shall not remove'; his works include the famous quarrel-books with Ibn Hajar al-Haytami on debtor-gifts, the raised-hands proof, the aloud-basmala tract and the singing rulings; died Zabid Sunday eve 11 Rajab [975] {cite:shadharat-dhahab p. 377-378}."
  fr: "Le mufti aveugle de Zabid — « shafi'ite dans les branches, yafi'ite dans le soufisme, ash'arite dans la croyance » ; élève d'al-Tanbadhawi, il enseigna et donna des fatwas à partir de 948 ; en 964 un voile tomba sur ses yeux — « bienvenue au don de Dieu » — et il refusa le chirurgien : « ce dont Dieu m'a revêtu, je ne l'ôterai pas » ; ses œuvres comprennent les célèbres livres de controverse avec Ibn Hajar al-Haytami sur les donations du débiteur, la preuve du lever des mains, le traité sur la basmala à voix haute et les règles sur le chant ; mort à Zabid la veille du dimanche 11 rajab [975] {cite:shadharat-dhahab p. 377-378}."
  es: "Muftí ciego de Zabid: «un shafi'í en ramas, un yafi'í en sufismo, un ash'ari en credo»; discípulo del propio Tanbadhawi que enseñó y emitió fatuas desde 948; en 964 una película cayó sobre sus ojos —«bienvenido, regalo de Dios»— y rechazó al cirujano: «lo que Dios me ha puesto, no me lo quitaré»; sus obras incluyen los famosos libros de disputas con Ibn Hajar al-Haytami sobre los regalos de los deudores, la prueba de las manos levantadas, el tratado de la basmala en voz alta y las resoluciones sobre el canto; Zabid murió el domingo 11 de Rajab [975] {cite:shadharat-dhahab p. 377-378}."
  ur: "زبید کا نابینا مفتی - شاخوں میں شافعی، تصوف میں یافی، مسلک میں اشعری؛ تنبداوی کا اپنا شاگرد جس نے 948 سے پڑھایا اور فتویٰ دیا۔ 964 میں ایک فلم اس کی آنکھوں پر گر گئی - 'خوش آمدید، خدا کا تحفہ' - اور اس نے سرجن سے انکار کر دیا: 'خدا نے مجھے جو لباس پہنایا ہے، میں اسے نہیں ہٹاؤں گا'۔ ان کی تصانیف میں ابن حجر الہیتمی کے ساتھ مقروض تحفے کے بارے میں مشہور جھگڑا کتابیں، ہاتھ اٹھانے کا ثبوت، بلند آواز میں بسم اللہ کا خطبہ اور گانے کے احکام شامل ہیں۔ وفات زبید اتوار 11 رجب [975] 377-378}۔"
  tr: "Ebu'd-Diya' Abd el-Rahman ibn Abd el-Karim ibn Ziyad el-Akki el-Maksari el-Zübeydi el-Şafi'i doktrinde, Eş'ari itikadda, el-Hakami, Hırka el-Yafi'i tasavvufta - ve şöyle diyor: \"Ben dallarda Şafi'iyim ve Yafi'i - tasavvufta, itikadda Eş'ari\"; Dokuz yüz yılının Receb ayında doğdu, Kur'an'ı ve ayetleri ezberledi, Muhammed Musa el-Daba'i ve Ahmed el-Mezced'den ve öğrencisi el-Tanbedevi'den ders aldı, ondan faydalandı ve tefsir, hadis ve biyografiyi el-Hafız Vacih el-Din ibn el-Dib'den, kanunları el-Gharib el-Hatki'den, prensipleri Cemal el-Din Yahya Kubeyb'den ve Arapçayı Muhammed Mufeddal el-Lahani'den öğrendi. Çalışkan ve gayretli bir şekilde zamanının önde gelenlerinden biri oldu ve uzak diyarlardan fetvaları istendi. Şeyhi el-Tanbedevi'nin 948 yılında vefatından sonra fetva vermeye devam etti. Çok büyük bir yoksulluk içindeydi, her sabah rızkını olmadan uyanırdı, ta ki karısı doğum yapana kadar. O zaman bir lamba bile alamayacak hale geldi. O geceyi o halde geçirdi; altmış dördüncü yılda gözlerine bir şey oldu ve kör oldu, bunu sabır ve memnuniyetle kabul ederek, “Allah’ın armağanına hoş geldin” dedi. Sonra Kadda yanına gelip, “Gözlerini iyileştireceğim” dedi. Bazı zenginler, “O süre boyunca sana ve ailene para vereceğim” dediler. Ama o, “Bu Allah’ın bana bahşettiği bir şeydir ve onu bozmayacağım” diyerek reddetti. Buna rağmen, öğretme, fetva verme ve yazma alışkanlığını sürdürdü. Eserleri arasında şunlar yer almaktadır: “Namaza Girerken El Kaldırmanın, Rükû Etmenin, İki Rekat Sonra Ayağa Kalkmanın Delili”, “Borçlunun Bağışının Hükümlerinde Kesin Zafer Kitabı”, “Açık Söz”, “Ek” ve “Özet”—bu üç kitabı, borçlunun bağışının geçersiz kılınmaması konusunda İbn Hacer ile arasında yaşananlar nedeniyle yazmıştır—“Kardeşlik ve Arkadaşlıkta Seçkinlerin Kitabı”, “Besmelenin Yüksek Sesle Okunmasının ve Fatiha Suresinin Bir Parçası Olduğunun Açık Delilleri”, “Ramazan Ayininde Teravih Namazlarının Sayısının Delilini Belirleme”, “Alınan Şey ile Borçlu Şey Arasındaki Hüküm Konusundaki Sıkıntıyı Ortadan Kaldırma”, “İmamlara Göre Mülkiyetin Rengi Askıda Kalmıştır”, “Şarkı Söylemenin Hükümlerindeki Zorluğu Giderme”, “Kitaplardaki İnci Dizisi” “Ameller” ve “Haram Hükümlerinin Açığa Çıkarılması” adlı eserleri bulunmaktadır. Receb ayının on birinci Pazar gecesi Zabid’de vefat etmiştir. {kaynak: Shadharat-dhahab s. 377-378}"
  id: "Abu al-Diya’ Abd al-Rahman ibn Abd al-Karim ibn Ziyad al-Akki al-Maqsari al-Zubaidi al-Syafi’i dalam doktrin, Asy’ari dalam akidah, al-Hakami, Khirqa al-Yafi’i dalam tasawuf – dan di dalamnya ia mengatakan: “Saya Syafi’i dalam cabang-cabang dan Yafi’i – dalam tasawuf, Asy’ari dalam akidah”; Beliau lahir pada bulan Rajab tahun 900 dan menghafal Al-Qur'an dan tanda-tandanya, serta belajar dari Muhammad Musa al-Daba'i dan Ahmad al-Mazjad dan muridnya al-Tanbadhawi. Bersama beliau, beliau lulus dan mendapat manfaat, serta belajar tafsir, hadits, dan biografi dari al-Hafiz Wajih al-Din ibn al-Dib', hukum-hukum dari al-Gharib al-Hatqi, prinsip-prinsip dari Jamal al-Din Yahya Qubayb, dan bahasa Arab dari Muhammad Mufaddal al-Lahani. Beliau rajin dan tekun hingga menjadi salah satu tokoh terkemuka pada masanya, dan fatwa-fatwa darinya dicari dari negeri-negeri yang jauh. Beliau terus mengeluarkan fatwa sejak wafatnya gurunya, al-Tanbadhawi, pada tahun 948. Beliau hidup dalam kemiskinan yang sangat parah hingga sering bangun tidur tanpa rezeki sehari-hari, sampai suatu hari istrinya melahirkan dan beliau tidak memiliki apa-apa lagi hingga tidak mampu membeli lampu, sehingga mereka bermalam di dalam ruangan. Pada tahun 64, sesuatu terjadi pada matanya yang membutakannya, sehingga ia menerimanya dengan sabar dan puas, sambil berkata, “Selamat datang pada karunia Allah.” Kemudian Qaddah datang kepadanya dan berkata, “Aku akan memperbaiki penglihatanmu.” Beberapa orang kaya berkata, “Aku akan membiayai hidupmu dan keluargamu selama periode itu.” Tetapi ia menolak, sambil berkata, “Ini adalah sesuatu yang telah Allah berikan kepadaku, dan aku tidak akan membiarkannya hilang.” Meskipun demikian, ia melanjutkan kebiasaannya mengajar, mengeluarkan fatwa, dan menulis. Di antara karya-karyanya adalah: “Bukti Mengangkat Tangan Saat Memasuki Shalat, Rukuk, dan Berdiri dari Dua Rakaat,” “Kitab Kemenangan Jelas dalam Hukum Sedekah Orang yang Berhutang,” “Diskusi yang Jelas,” “Tambahan,” dan “Ringkasan”—ketiga kitab ini ditulisnya karena perselisihan antara dirinya dan Ibnu Hajar mengenai tidak batalnya sedekah orang yang berhutang—“Kitab Kaum Elit dalam Persaudaraan dan Persahabatan,” “Bukti Jelas dalam Membaca Basmala dengan Keras dan Bahwa Itu Merupakan Bagian dari Al-Fatihah,” “Menetapkan Bukti Jumlah Shalat Tarawih di Bulan Ramadhan,” “Mengungkap Kesulitan Mengenai Hukum Apa yang Diterima dari Apa yang Ada dalam Hutang,” “Warna Kepemilikan di Dalamnya Ditangguhkan Menurut Para Imam,” “Menghilangkan Kesulitan dalam Hukum Bernyanyi,” “Rantai Mutiara dalam Kitab-kitab Amal,” dan “Mengungkap Hukum-hukum Haram.” Beliau wafat di Zabid pada malam Minggu, tanggal sebelas Rajab {cite:shadharat-dhahab hlm. 377-378}."
