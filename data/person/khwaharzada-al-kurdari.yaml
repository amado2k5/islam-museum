summary:
  ar: "ابن أخت شمس الأئمة علاء الدين الكردري صاحب البداية؛ قرأ الفقه على خاله وأخذ عنه، ودرّس بالبلبيسية بدمشق؛ قال ابن كمال باشا ويسمى بدر الدين خواهرزادة أبو عبد الله محمد بن عبد الحميد بن عيسى وقد روى عن صاحب الهداية وذلك أن أباه كان أخا أم صاحب الهداية {cite:shadharat-dhahab p. 262-263}."
  en: "Nephew of Shams al-A'imma al-Kurdari — read fiqh on his uncle, taught at the Balbisiyya in Damascus; Ibn Kamal Pasha's note distinguishes him from the younger Khwaharzada {cite:shadharat-dhahab p. 262-263}."
  es: "Sobrino de Shams al-A'imma al-Kurdari — estudió fiqh sobre su tío y enseñó en la Balbisiyya de Damasco; la nota de Ibn Kamal Pasha lo distingue del joven Khwaharzada {cite:shadharat-dhahab p. 262-263}."
  fr: "Neveu de Shams al-A'imma al-Kurdari — a étudié le fiqh sur son oncle, a enseigné à la Balbisiyya de Damas; la note d'Ibn Kamal Pacha le distingue du jeune Khwaharzada {cite:shadharat-dhahab p. 262-263}."
  ur: "شمس العائمہ الکرداری کے بھتیجے - اپنے چچا پر فقہ پڑھتے تھے، دمشق میں بلبیسیہ میں پڑھاتے تھے۔ ابن کمال پاشا کا نوٹ اسے چھوٹے خوارزدہ سے ممتاز کرتا ہے 262-263}۔"
  tr: "Şems-Eimmah'ın yeğeni, Al-Bidaya'nın yazarı Ala'ddin el-Kurdari; amcasının yanında hukuk okudu ve onun yanında eğitim aldı, ayrıca Şam'daki Balbisiyya'da eğitim gördü. Bedreddin Hawarzadeh olarak bilinen İbn Kemal Paşa, Ebu Abdullah Muhammed bin Abdülhamid bin İsa, el-Hidaya'nın yazarından babasının el-Hidayah'ın yazarının annesinin kardeşi olduğunu anlatmıştır {alıntı:Shadharat-Dhahab, s. 262-263}."
  id: "Keponakan Shams al-A'immah, Ala' al-Din al-Kurdari, penulis Al-Bidaya; ia belajar hukum di bawah pamannya dan belajar di bawah bimbingan pamannya, serta belajar di Balbisiyya di Damaskus. Ibn Kamal Pasha, yang dikenal sebagai Badr al-Din Khawarzadeh, Abu Abdullah Muhammad ibn Abd al-Hamid ibn Isa, menceritakan dari penulis al-Hidaya bahwa ayahnya adalah saudara dari ibu penulis al-Hidayah {cite:shadharat-dhahab, hlm. 262-263}."
