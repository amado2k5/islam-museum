summary:
  ar: "زهري يعرف بالمرقال، من بني أبي وقاص؛ ذهبت عينه يوم اليرموك فيما ذهبت فيه أعين الأشعث بن قيس وقيس بن مكشوح. وعليه مدد الشام إلى القادسية في خمسة آلاف فارس من ربيعة ومضر وألف من اليمن ومعهم القعقاع بن عمرو بعد فتح دمشق بشهر على ما ذكر المسعودي {cite:muruj-al-dhahab p. 609}، وعند المسعودي قتل بصفين هو وذو الكلاع صاحب راية حمير، وتناول ابنه اللواء حين قتل وكر في العجاج، ووقف علي على مصرعه ومصرع من صرع حوله من الأسلميين فترحم عليهم وأنشد جزى الله خيراً عصبة أسلمية صباح الوجوه صرعوا حول هاشم {cite:muruj-al-dhahab p. 674-675}"
  en: "A Zuhri known as al-Mirqal, of Banu Abi Waqqas; he lost an eye on the day of the Yarmuk, among those whose eyes were lost that day with al-Ash'ath ibn Qays and Qays ibn Makshuh."
