summary:
  ar: "زهري يعرف بالمرقال، من بني أبي وقاص؛ ذهبت عينه يوم اليرموك فيما ذهبت فيه أعين الأشعث بن قيس وقيس بن مكشوح. وعليه مدد الشام إلى القادسية في خمسة آلاف فارس من ربيعة ومضر وألف من اليمن ومعهم القعقاع بن عمرو بعد فتح دمشق بشهر على ما ذكر المسعودي {cite:muruj-al-dhahab p. 609}، وعند المسعودي قتل بصفين هو وذو الكلاع صاحب راية حمير، وتناول ابنه اللواء حين قتل وكر في العجاج، ووقف علي على مصرعه ومصرع من صرع حوله من الأسلميين فترحم عليهم وأنشد جزى الله خيراً عصبة أسلمية صباح الوجوه صرعوا حول هاشم {cite:muruj-al-dhahab p. 674-675}"
  en: "A Zuhri known as al-Mirqal, of Banu Abi Waqqas; he lost an eye on the day of the Yarmuk, among those whose eyes were lost that day with al-Ash'ath ibn Qays and Qays ibn Makshuh."
  ur: "زہری، المرقال کہلاتا، بنو ابی وقاص سے؛ یرموک کے دن ایک آنکھ کھوئی، اس دن ابو عبیدہ وغیرہ کے ساتھ آنکھ کھونے والوں میں۔"
  es: "Un Zuhri conocido como al-Mirqal, de Banu Abi Waqqas; perdió un ojo el día del Yarmuk, entre aquellos que perdieron los ojos ese día junto con al-Ash'ath ibn Qays y Qays ibn Makshuh."
  fr: "Un Zuhri connu sous le nom d'al-Mirqal, de Banu Abi Waqqas; il perdit un œil le jour du Yarmouk, parmi ceux qui perdirent les yeux ce jour-là avec al-Ash'ath ibn Qays et Qays ibn Makshuh."
  tr: "Zuhri, Banu Abi Waqqas'tan Al-Marqal olarak bilinir; Yermuk gününde gözü kaybolurken, Al-Ash'ath ibn Qays ve Qays ibn Makshouh'un gözleri kayboldu. Buna göre, Şam'ın fethinden bir ay sonra, Al-Mas'udi'nin belirttiği gibi, Şam'ı Rebi'ah ve Mudar'dan beş bin süvariyle, Yemen'den bin süvarıyla ve El-Ka'ka' ibn Amr'i de genişletti. Muruj-al-Dhahab, s. 609}. Al-Mas'udi'ye göre, Siffin'de, Himyar bayrağını taşıyan Dhu al-Kalla' ile birlikte öldürülmüştür. Oğlu, Al-Acac'ta bir yuvada öldürüldüğünde bayrağı almıştır. Ali, onun ve çevresindekilerin ölümüne tanıklık etti, merhamet diledi ve 'Allah onlara iyi bir ödül versin.' dedi. Hashim'in etrafında düşen yüzlerin sabahı' {cite:Muruj-al-Dhahab, s. 674-675}"
  id: "Zuhri, dikenal sebagai Al-Marqal, dari Banu Abi Waqqas; matanya hilang pada hari Yarmouk, sementara mata Al-Ash'ath ibn Qays dan Qays ibn Makshouh hilang. Dengan demikian, ia memperluas Levant ke Al-Qadisiyyah dengan lima ribu penunggang kuda dari Rabi'ah dan Mudar, dan seribu dari Yaman, bersama Al-Qa'qa' ibn Amr, sebulan setelah penaklukan Damaskus, seperti yang disebutkan oleh Al-Mas'udi {cite:Muruj-al-Dhahab, hlm. 609}. Menurut Al-Mas'udi, ia dibunuh di Siffin, bersama Dhu al-Kalla', pembawa panji Himyar. Putranya mengambil panji itu ketika ia dibunuh di sebuah sarang di Al-Ajaj. Ali menyaksikan kematiannya dan kematian orang-orang di sekitar umat Islam, sambil berdoa memohon belas kasihan dan mengucapkan 'Semoga Allah membalas mereka dengan baik. Pagi para wajah yang gugur di sekitar Hashim' {cite:Muruj-al-Dhahab, hlm. 674-675}"
