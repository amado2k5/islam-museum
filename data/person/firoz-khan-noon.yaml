  source: "English Wikipedia 'Firoz Khan Noon' (revision 1378237132), Urdu Wikipedia 'ملک فیروز خان نون' (revision 10522962) and Arabic Wikipedia 'فيروز خان نون' (revision 76600980), each fetched by its recorded revision id through the MediaWiki API with the returned id asserted equal before use, and Wikidata item Q1561693 (item revision 2549881963, asserted on fetch). Existence checks by name fragments (firoz, feroz, فيروز, فیروز), by Arabic label across data/person, by biography and by QID found no prior record for this man. No relations are written in this record. His immediate predecessor as prime minister of Pakistan was I. I. Chundrigar (October–December 1957), as the English article's infobox and succession box and the Arabic infobox record — not Huseyn Shaheed Suhrawardy, whose premiership ended in October 1957 and who was followed by Chundrigar before Noon; Chundrigar has no person record, so no successor_of edge for the premiership can be written, and no edge to Suhrawardy is written because it would misstate the succession. Noon served as foreign minister in Suhrawardy's cabinet (1956–1958), succeeding Hamidul Huq Choudhury, who likewise has no record. His succession as governor of East Bengal by Chaudhry Khaliquzzaman (1953) is written as an edge in Khaliquzzaman's record. His wife Viqar-un-Nisa Noon has no person record, so no spouse_of edge is written. No born_in, died_in or buried_in edge is written because Hamoka and Nurpur Noon have no place entities. The lane queue gives 'Malik Firoz Khan Noon (1893–1970)', which the articles confirm as to the years."
