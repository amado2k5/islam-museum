summary:
  ar: "سياسي وكاتب باكستاني (1893–1970)، سابع رؤساء وزراء باكستان (كانون الأول 1957 – تشرين الأول 1958)، وفي عهده اشترت باكستان غوادر من سلطنة مسقط وعُمان. كان قبلها حاكم بنغال الشرقية (1950–1953)، ورئيس وزراء البنجاب (1953–1955)، ووزير الخارجية في حكومة حسين شهيد سهروردي، وقبل الاستقلال مفوض الهند السامي في لندن وعضو المجلس التنفيذي لنائب الملك."
  en: "Pakistani politician and writer (1893–1970), the seventh prime minister of Pakistan (December 1957 – October 1958), in whose premiership Pakistan purchased Gwadar from the Sultanate of Muscat and Oman. He had earlier been governor of East Bengal (1950–1953), chief minister of Punjab (1953–1955) and foreign minister in Huseyn Shaheed Suhrawardy's cabinet; before independence he was India's high commissioner in London and a member of the Viceroy's Executive Council."
  ur: "پاکستانی سیاست دان و مصنف (1893ء–1970ء)، پاکستان کے ساتویں وزیر اعظم (دسمبر 1957ء – اکتوبر 1958ء)، جن کے دور میں پاکستان نے گوادر سلطنت مسقط و عمان سے خریدا۔ اس سے پہلے مشرقی بنگال کے گورنر (1950ء–1953ء)، پنجاب کے وزیر اعلیٰ (1953ء–1955ء) اور حسین شہید سہروردی کی کابینہ میں وزیر خارجہ رہے؛ آزادی سے قبل لندن میں ہندوستان کے ہائی کمشنر اور وائسرائے کی ایگزیکیٹو کونسل کے رکن تھے۔"
