summary:
  ar: "واعظ تركي مقيم في إسطنبول، عُرف بدروسه في الفقه وأجوبته على أسئلة الفتوى ومحاضراته في إيتشرنكوي، وتنشر قناته على يوتيوب دروسه وأجوبته منذ سنة 2014. بلغت قناته على يوتيوب 191,000 مشترك كما في 15 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish preacher based in Istanbul, known for his lessons in fiqh, his fatwa question-and-answer sessions and his İçerenköy talks; his YouTube channel has carried his lessons and answers since 2014. His YouTube channel counted 191,000 subscribers as of 15 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "استنبول میں مقیم ترک واعظ، جو فقہ کے دروس، فتویٰ سوال و جواب اور ایچیرنکوئے محاضرات کے لیے جانے جاتے ہیں؛ ان کا یوٹیوب چینل 2014ء سے ان کے دروس اور جوابات نشر کر رہا ہے۔ vidIQ کے مطابق 15 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 191,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Predicador turco afincado en Estambul, conocido por sus lecciones de fiqh, sus sesiones de preguntas y respuestas sobre fatwas y sus charlas en İçerenköy; su canal de YouTube publica sus lecciones y respuestas desde 2014. Su canal de YouTube contaba con 191.000 suscriptores al 15 de noviembre de 2026, según vidIQ (un recuento desactualizado de la plataforma, no un dato verificado por un museo)."
  fr: "Prédicateur turc basé à Istanbul, connu pour ses cours de fiqh, ses séances de questions-réponses sur les fatwas et ses conférences İçerenköy; sa chaîne YouTube diffuse ses cours et réponses depuis 2014. Sa chaîne YouTube comptait 191 000 abonnés au 15 novembre 2026 selon vidIQ — un décompte de plateforme obsolète, non un fait vérifié par un musée."
  tr: "İstanbul'da yaşayan bir Türk vaiiz, İçernköy'de fıkıh dersleri ve fetva sorularına verdiği cevaplar ile dersleriyle tanınır. YouTube kanalı 2014'ten beri derslerini ve cevaplarını yayınlamaktadır. YouTube kanalı, vidIQ'ye göre 15 Kasım 2026 itibarıyla 191.000 aboneye ulaşmıştır; bu sayı bir tarihçinin sayısıdır, müzelerden doğrulanmış bir gerçek değildir."
  id: "Seorang pengkhotbah Turki yang tinggal di Istanbul, dikenal karena pelajaran hukum dan jawaban atas pertanyaan fatwa serta kuliah di İçernköy. Saluran YouTube-nya telah mempublikasikan pelajaran dan jawabannya sejak 2014. Saluran YouTube-nya mencapai 191.000 pelanggan per 15 November 2026, menurut vidIQ, yang merupakan angka seorang sejarawan, bukan fakta yang diverifikasi museum."
