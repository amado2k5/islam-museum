summary:
  ar: "الأمير علاء الدين أبو الحسن علي بن بلبان الفارسي المصري الحنفي (675-739هـ)، الفقيه النحوي المحدث، تفقه على السروجي وقرأ النحو على أبي حيان وسمع الحديث من الدمياطي، ورتّب صحيح ابن حبان على الأبواب في «الإحسان»، والمعجم الكبير للطبراني، وتوفي بمنزله على النيل ودفن خارج باب النصر {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 44-45}."
  en: "Al-Amir 'Ala' al-Din Abu al-Hasan 'Ali ibn Balban al-Farisi, the Egyptian Hanafi (675-739 AH), jurist, grammarian and hadith scholar; he studied law with al-Saruji, grammar with Abu Hayyan and hadith with al-Dimyati, rearranged Ibn Hibban's Sahih by chapter in al-Ihsan, and al-Tabarani's al-Mu'jam al-Kabir too, and died at his house on the Nile and was buried outside Bab al-Nasr {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 44-45}."
  ur: "امیر علاء الدین ابو الحسن علی بن بلبان فارسی، مصری حنفی (675-739ھ)، فقیہ، نحوی اور محدث؛ انہوں نے سروجی سے فقہ، ابو حیان سے نحو اور دمیاطی سے حدیث پڑھی، صحیح ابن حبان کو «الاحسان» میں ابواب پر مرتب کیا، اور طبرانی کی المعجم الکبیر کو بھی، اور نیل کے کنارے اپنے گھر میں وفات پائی اور باب النصر کے باہر دفن ہوئے {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 44-45}۔"
