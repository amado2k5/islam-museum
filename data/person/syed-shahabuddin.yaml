summary:
  ar: "دبلوماسي وسياسي هندي من بيهار (1935–2017)، عمل في السلك الدبلوماسي سفيراً في فنزويلا والجزائر، ثم صار من أبرز أصوات السياسة المسلمة في الهند المستقلة، وأسس وحرر مجلة «مسلم إنديا» (1983–2006)."
  en: "Indian diplomat and politician from Bihar (1935–2017) who served in the Foreign Service, including as ambassador to Venezuela and Algeria, then became a leading voice of Muslim politics in independent India and founded and edited the journal Muslim India (1983–2006)."
  ur: "بہار سے تعلق رکھنے والے بھارتی سفارت کار اور سیاست دان (1935–2017)، جنھوں نے وینزویلا اور الجزائر میں سفیر کی حیثیت سے خدمات انجام دیں، پھر آزاد بھارت کی مسلم سیاست کی نمایاں آواز بنے اور جریدہ «مسلم انڈیا» (1983–2006) کی بنیاد رکھی اور اس کی ادارت کی۔"
