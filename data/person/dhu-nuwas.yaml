summary:
  en: "The last Himyarite king before the second Abyssinian occupation: a convert to Judaism who in October 523 tried to force the Christians of Najran to apostatize and, on their refusal, dug the trench of fire — the event the Quran recalls in Surat al-Buruj."
  ar: "آخر ملوك حمير قبل الاحتلال الحبشي الثاني: تهوّد وقاد سنة 523م حملة على نصارى نجران ليصرفهم عن دينهم قسراً، فلما أبوا خدّ لهم الأخدود وألقاهم في النيران — ما يذكره القرآن في سورة البروج."
