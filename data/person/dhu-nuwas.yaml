id: person/dhu-nuwas
education:
  did_you_know:
    ar: "ذو نواس آخر ملوك حمير قبل الاحتلال الحبشي الثاني؛ تهوّد وقاد حملته على نصارى نجران فخدّ لهم الأخدود — ما يذكره القرآن بقصة أصحاب الأخدود."
    en: "Dhu Nuwas, Himyar's last king before the second Abyssinian occupation, embraced Judaism and drove his campaign on Najran's Christians, digging them the trench of fire — the story the Qur'an recalls as the People of the Trench."
    ur: "ذونواس، دوسرے حبشی قبضے سے پہلے حمیئر کا آخری بادشاہ، یہودی ہوا اور نجران کے مسیحیوں پر مہم چلا کر ان کے لیے آگ کا خندق کھدوایا — وہی کہانی جو قرآن اصحابِ اخدود میں بیان کرتا ہے۔"
    sources: [source/muruj-al-dhahab, source/mubarakpuri-raheeq]
