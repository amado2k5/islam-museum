summary:
  en: "The last Himyarite king before the second Abyssinian occupation: a convert to Judaism who in October 523 tried to force the Christians of Najran to apostatize and, on their refusal, dug the trench of fire — the event the Quran recalls in Surat al-Buruj."
  ar: "آخر ملوك حمير قبل الاحتلال الحبشي الثاني: تهوّد وقاد سنة 523م حملة على نصارى نجران ليصرفهم عن دينهم قسراً، فلما أبوا خدّ لهم الأخدود وألقاهم في النيران — ما يذكره القرآن في سورة البروج."
  es: "El último rey himyarita antes de la segunda ocupación abisinia: un converso al judaísmo que en octubre de 523 intentó obligar a los cristianos de Najrán a apostatar y, ante su negativa, cavó la zanja de fuego, un acontecimiento que el Corán recuerda en la Sura al-Buruj."
  fr: "Le dernier roi himyarite avant la seconde occupation abyssinienne: un converti au judaïsme qui, en octobre 523, tenta de forcer les chrétiens de Najran à apostasier et, face à leur refus, creusa le fossé de feu — événement que le Coran rappelle dans la sourate al-Buruj."
  ur: "حبشیوں کے دوسرے قبضے سے پہلے آخری ہمیار بادشاہ: یہودیت اختیار کرنے والا جس نے اکتوبر 523 میں نجران کے عیسائیوں کو ارتداد پر مجبور کرنے کی کوشش کی اور ان کے انکار پر آگ کی خندق کھود دی - جس واقعہ کو قرآن سورت البروج میں یاد کرتا ہے۔"
