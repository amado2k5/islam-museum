summary:
  ar: "من فقهاء المدينة، أخذ عن الإمام مالك وغلب عليه الرأي، وكان مالك يخصه بالإذن عند اجتماع الناس على بابه، وكان يجلس عن يمينه لا يفارقه. قال ابن بكير: لم يكن عند مالك أضبط ولا أدرس منه، وجلس بعد وفاة مالك في حلقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  en: "A jurist of Medina who studied with Imam Malik and was known for independent reasoning. Malik gave him leave to enter first when people gathered at his door, and he sat at Malik's right hand without leaving him. Ibn Bukayr said that no one was more exact or more instructive than him in Malik's circle, and after Malik's death he took his seat in the circle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  es: "Un jurista de Medina que estudió con el Imam Malik y era conocido por su razonamiento independiente. Malik le permitía entrar primero cuando la gente se reunía en su puerta, y él se sentaba a su derecha sin separarse de él. Ibn Bujari afirmó que nadie era más preciso ni más instructivo que él en el círculo de Malik, y tras la muerte de este, ocupó su lugar en dicho círculo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  fr: "Un juriste de Médine, élève de l'imam Malik, réputé pour son esprit critique. Malik lui accordait la permission d'entrer le premier lorsque des personnes se rassemblaient à sa porte, et il s'asseyait à sa droite sans jamais la quitter. Ibn Bukayr affirmait que nul n'était plus rigoureux ni plus instructif que lui dans l'entourage de Malik, et qu'après la mort de ce dernier, il prit place au sein du cercle."
  ur: "مدینہ کا ایک فقیہ جس نے امام مالک سے تعلیم حاصل کی اور آزاد استدلال کے لیے مشہور تھے۔ جب لوگ اس کے دروازے پر جمع ہوئے تو مالک نے اسے پہلے داخل ہونے کی اجازت دی اور وہ اسے چھوڑے بغیر ملک کے داہنے ہاتھ پر بیٹھ گیا۔ ابن بکر نے کہا کہ مالک کے حلقہ میں ان سے زیادہ درست یا زیادہ ہدایت دینے والا کوئی نہیں تھا اور مالک کی وفات کے بعد وہ حلقہ میں بیٹھ گئے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5140}"
