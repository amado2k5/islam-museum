summary:
  ar: "من فقهاء المدينة، أخذ عن الإمام مالك وغلب عليه الرأي، وكان مالك يخصه بالإذن عند اجتماع الناس على بابه، وكان يجلس عن يمينه لا يفارقه. قال ابن بكير: لم يكن عند مالك أضبط ولا أدرس منه، وجلس بعد وفاة مالك في حلقته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
  en: "A jurist of Medina who studied with Imam Malik and was known for independent reasoning. Malik gave him leave to enter first when people gathered at his door, and he sat at Malik's right hand without leaving him. Ibn Bukayr said that no one was more exact or more instructive than him in Malik's circle, and after Malik's death he took his seat in the circle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5140} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5141}"
