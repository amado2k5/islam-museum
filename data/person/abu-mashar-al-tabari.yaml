summary:
  ar: "عبد الكريم بن عبد الصمد الطبري المعروف بأبي معشر، من أهل مكة، مؤلف «التلخيص في القراءات الثمان» و«سوق العروس»؛ توفي سنة 478هـ، ويذكره ابن الجزري مع الهذلي في أكثر من علمهم جمعاً للقراءات، إذ ذكر في «سوق العروس» ألفاً وخمسمائة وخمسين رواية وطريقاً {cite:nashr-dahman-damascus-1345-v1 p. 45}."
  en: "'Abd al-Karim ibn 'Abd al-Samad al-Tabari, known as Abu Ma'shar, who taught in Mecca and wrote al-Talkhis fi al-Qira'at al-Thaman and Sawq al-'Arus; he died in 478 AH. Ibn al-Jazari names him with al-Hudhali as the two men who gathered the most readings, Sawq al-'Arus holding fifteen hundred and fifty riwayas and lines of transmission {cite:nashr-dahman-damascus-1345-v1 p. 45}."
  ur: "عبد الکریم بن عبد الصمد طبری، ابو معشر کے نام سے معروف، مکہ میں تدریس کرنے والے، «التلخیص فی القراءات الثمان» اور «سوق العروس» کے مصنف؛ 478ھ میں فوت ہوئے۔ ابن الجزری انہیں ہذلی کے ساتھ ان دو افراد میں گنتے ہیں جنہوں نے سب سے زیادہ قراءات جمع کیں؛ «سوق العروس» میں پندرہ سو پچاس روایات و طرق ہیں {cite:nashr-dahman-damascus-1345-v1 p. 45}."
  fr: "'Abd al-Karim ibn 'Abd al-Samad al-Tabari, connu sous le nom d'Abu Ma'shar, qui enseigna à La Mecque et écrivit al-Talkhis fi al-Qira'at al-Thaman et Sawq al-'Arus ; il mourut en 478 H. Ibn al-Jazari le nomme avec al-Hudhali comme les deux hommes qui réunirent le plus de lectures, le Sawq al-'Arus contenant mille cinq cent cinquante riwayas et lignes de transmission {cite:nashr-dahman-damascus-1345-v1 p. 45}."
