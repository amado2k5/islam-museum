summary:
  ar: "قاضي حلب الفقيه الشافعي المعروف بابن شداد، ولد بالموصل ليلة العاشر من رمضان سنة تسع وثلاثين وخمس مئة، ونشأ عند أخواله بني شداد فنسب إليهم، ولازم أبا بكر يحيى بن سعدون القرطي إحدى عشرة سنة فقرأ عليه القراءات السبع والحديث وشروحه والتفسير حتى شهد له بأنه ما قرأ عليه أحد أكثر مما قرأ {cite:wafayat-ayan p. 77-78}؛ وفي الشذرات أعاد بالنظامية في حدود سنة سبعين ثم انحدر إلى الموصل ودرس بمدرسة الكمال الشهرزوري، وحج سنة ثلاث وثمانين وزار الشام واتصل بالسلطان صلاح الدين فحظي عنده وولاه قضاء العسكر وقضاء القدس وصنف له كتاباً في فضل الجهاد، ثم ولاه ولده الظاهر قضاء حلب ونظر أوقافها وأجزل رزقه وعطاءه، وبنى بحلب مدرسة ودار حديث وبينهما تربة؛ من تصانيفه دلائل الأحكام على التنبيه في مجلدين والموجز الباهر في الفقه وملجأ الحكام في الأقضية وسيرة صلاح الدين؛ توفي في رابع صفر سنة اثنتين وثلاثين ودفن بتربته بحلب {cite:shadharat-dhahab p. 158-159}."
  en: "Baha' al-Din Ibn Shaddad, qadi of Aleppo and Saladin's biographer — born at Mosul in Ramadan 539, raised by the Banu Shaddad uncles whose name he bore, and eleven years the companion of Ibn Sa'dun al-Qurtubi in the seven readings, hadith and tafsir {cite:wafayat-ayan p. 77-78}."
