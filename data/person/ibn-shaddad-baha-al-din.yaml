summary:
  ar: "قاضي حلب الفقيه الشافعي المعروف بابن شداد، ولد بالموصل ليلة العاشر من رمضان سنة تسع وثلاثين وخمس مئة، ونشأ عند أخواله بني شداد فنسب إليهم، ولازم أبا بكر يحيى بن سعدون القرطي إحدى عشرة سنة فقرأ عليه القراءات السبع والحديث وشروحه والتفسير حتى شهد له بأنه ما قرأ عليه أحد أكثر مما قرأ {cite:wafayat-ayan p. 77-78}؛ وفي الشذرات أعاد بالنظامية في حدود سنة سبعين ثم انحدر إلى الموصل ودرس بمدرسة الكمال الشهرزوري، وحج سنة ثلاث وثمانين وزار الشام واتصل بالسلطان صلاح الدين فحظي عنده وولاه قضاء العسكر وقضاء القدس وصنف له كتاباً في فضل الجهاد، ثم ولاه ولده الظاهر قضاء حلب ونظر أوقافها وأجزل رزقه وعطاءه، وبنى بحلب مدرسة ودار حديث وبينهما تربة؛ من تصانيفه دلائل الأحكام على التنبيه في مجلدين والموجز الباهر في الفقه وملجأ الحكام في الأقضية وسيرة صلاح الدين؛ توفي في رابع صفر سنة اثنتين وثلاثين ودفن بتربته بحلب {cite:shadharat-dhahab p. 158-159}."
  en: "Baha' al-Din Ibn Shaddad, qadi of Aleppo and Saladin's biographer — born at Mosul in Ramadan 539, raised by the Banu Shaddad uncles whose name he bore, and eleven years the companion of Ibn Sa'dun al-Qurtubi in the seven readings, hadith and tafsir {cite:wafayat-ayan p. 77-78}."
  es: "Baha' al-Din Ibn Shaddad, cadí de Alepo y biógrafo de Saladino, nació en Mosul en Ramadán 539, fue criado por los tíos Banu Shaddad, cuyo nombre llevaba, y durante once años fue compañero de Ibn Sa'dun al-Qurtubi en las siete lecturas, hadices y tafsir {cite:wafayat-ayan p. 77-78}."
  fr: "Baha' al-Din Ibn Shaddad, cadi d'Alep et biographe de Saladin — né à Mossoul en Ramadan 539, élevé par les oncles Banu Shaddad dont il portait le nom, et compagnon pendant onze ans d'Ibn Sa'dun al-Qurtubi dans les sept lectures, hadith et tafsir {cite:wafayat-ayan p. 77-78}."
  ur: "بہاء الدین ابن شداد، حلب کے قاضی اور صلاح الدین کے سوانح نگار - رمضان المبارک 539 میں موصل میں پیدا ہوئے، جن کی پرورش بنو شداد کے چچاوں نے کی جن کا نام اس نے رکھا، اور گیارہ سال ابن سعدون قرطبی کے سات قراء، حدیث اور تفسیر میں ساتھی رہے۔ 77-78}۔"
  tr: "Halep'in hakimi, Şafii fili fili İbn Shaddad olarak bilinen, 539 Hicri yılında Ramazan ayının onuncusu gecesi Musul'da doğdu. Amcaları Banu Shaddad ile büyüdü ve ona atfedildi. Ebu Bekir Yahya bin Sadun el-Kurti'yi on bir yıl takip etti, yedi okumayı, hadisi, tefsirlerini ve tefsirini inceledi; öyle ki kimsenin kendisine okuduğundan fazlasını okumadığını ifade etti {atı:wafayat-ayan, s. 77-78}; Al-Shadharat'ta yaklaşık 70 yılında Nizamiyye'ye döndü, ardından Musul'a taşındı, El-Kemal el-Şehrezuri okulunda eğitim gördü ve Hacı yaptı. Seksen üçüncü yılda Levant'ı ziyaret etti ve kendisi tarafından atanan Sultan Salah al-Din ile bağlantı kurdu; Sultan onu Kudüs'ün askeri yargıcı ve yargıcı olarak atadı; cihad erdemi üzerine bir kitap yazdı. Sonra oğlu el-Zahir onu Halep'in yargıcı olarak atadı, vakıflarını denetledi ve cömertçe yardım ve bağışladı. Halep'te bir okul ve hadis evi inşa etti, aralarında bir mezarlık bulundu. Eserleri arasında iki ciltlik Dalail al-Ala al-Tanbih, Al-Mucajs al-Bahir fi al-Fiqh, Malja' al-Hukkam fi al-Aqda ve Salah al-Din'in biyografisi yer alır. Otuz iki yılının 4 Sefer'inde öldü ve Halep'teki mezarına defnedildi {atıf: shadharat-dhahab, s. 158-159}."
  id: "Hakim Aleppo, ahli hukum Shafi'i yang dikenal sebagai Ibn Shaddad, lahir di Mosul pada malam tanggal sepuluh Ramadan tahun 539 H. Ia tumbuh bersama pamannya, Banu Shaddad, yang dikaitkan dengannya. Ia mengikuti Abu Bakr Yahya ibn Sa'dun al-Qurti selama sebelas tahun, mempelajari tujuh bacaan, hadis, tafsirannya, dan tafsir, hingga ia bersaksi bahwa tidak ada yang pernah membacakan lebih banyak darinya daripada yang pernah ia baca {cite:wafayat-ayan, hlm. 77-78}; di Al-Shadharat, ia kembali ke Nizamiyya sekitar tahun 70, lalu pindah ke Mosul dan belajar di sekolah Al-Kamal al-Shahrazuri, serta melaksanakan Haji. Pada tahun delapan puluh tiga, ia mengunjungi Levant dan berhubungan dengan Sultan Salah al-Din, yang diangkat olehnya dan mengangkatnya sebagai hakim militer dan hakim Yerusalem, menulis sebuah buku untuknya tentang kebajikan jihad. Kemudian putranya al-Zahir mengangkatnya sebagai hakim Aleppo, mengawasi wakafnya, serta dengan murah hati menyediakan dan memberi. Ia membangun sebuah sekolah dan rumah hadits di Aleppo, dengan pemakaman di antara keduanya. Di antara karya-karyanya adalah Dalail al-Ahkam 'ala al-Tanbih dalam dua jilid, Al-Mujajs al-Bahir fi al-Fiqh, Malja' al-Hukkam fi al-Aqda, dan biografi Salah al-Din. Ia meninggal pada tanggal 4 Safar, tahun tiga puluh dua, dan dimakamkan di makamnya di Aleppo {cite:shadharat-dhahab, hlm. 158-159}."
