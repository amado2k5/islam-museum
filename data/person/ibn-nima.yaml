summary:
  ar: "مسند الشام وفقيهها ومحدثها، الحنبلي الناسخ؛ سمع من يحيى الثقفي وابن صدقة وابن الموازيني وعبد الرحمن الخرقي وانفرد في الدنيا بالرواية عنهم، وسمع بحران من خطيبها الشيخ فخر الدين بن تيمية؛ وخرج لنفسه مشيخة وجمع تاريخاً، وكان يكتب بسرعة خطاً حسناً فيكتب في اليوم الكراسين والثلاثة إلى التسعة، وكتب «تاريخ دمشق» لابن عساكر مرتين و«المغني» للموفق مرات، وذكر أنه كتب بيده ألفي مجلدة؛ وحدث بالكثير بضعاً وخمسين سنة وانتهى إليه علو الإسناد وكانت الرحلة إليه من أقطار البلاد؛ وسمع منه الحفاظ المتقدمون كالحافظ ضياء الدين والزكي البرزالي وعمر بن الحاجب، وروى عنه النووي وشمس الدين بن أبي عمر وابن دقيق العيد وابن تيمية وخلق، آخرهم ابن الخباز {cite:shadharat-dhahab p. 567-568}."
  en: "Musnid al-Sham (b. 575) — the hand that wrote out Ibn Asakir's Tarikh Dimashq twice, al-Mughni several times, some two thousand bound volumes at two-to-nine quires a day; isnad-height ended with him; the rihla came to him from every quarter — among his hearers al-Nawawi, Ibn Daqiq al-Id and Ibn Taymiyya; d. Monday 7 Rajab 668 {cite:shadharat-dhahab p. 567-568}."
