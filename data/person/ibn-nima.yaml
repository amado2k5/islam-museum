summary:
  ar: "مسند الشام وفقيهها ومحدثها، الحنبلي الناسخ؛ سمع من يحيى الثقفي وابن صدقة وابن الموازيني وعبد الرحمن الخرقي وانفرد في الدنيا بالرواية عنهم، وسمع بحران من خطيبها الشيخ فخر الدين بن تيمية؛ وخرج لنفسه مشيخة وجمع تاريخاً، وكان يكتب بسرعة خطاً حسناً فيكتب في اليوم الكراسين والثلاثة إلى التسعة، وكتب «تاريخ دمشق» لابن عساكر مرتين و«المغني» للموفق مرات، وذكر أنه كتب بيده ألفي مجلدة؛ وحدث بالكثير بضعاً وخمسين سنة وانتهى إليه علو الإسناد وكانت الرحلة إليه من أقطار البلاد؛ وسمع منه الحفاظ المتقدمون كالحافظ ضياء الدين والزكي البرزالي وعمر بن الحاجب، وروى عنه النووي وشمس الدين بن أبي عمر وابن دقيق العيد وابن تيمية وخلق، آخرهم ابن الخباز {cite:shadharat-dhahab p. 567-568}."
  en: "Musnid al-Sham (b. 575) — the hand that wrote out Ibn Asakir's Tarikh Dimashq twice, al-Mughni several times, some two thousand bound volumes at two-to-nine quires a day; isnad-height ended with him; the rihla came to him from every quarter — among his hearers al-Nawawi, Ibn Daqiq al-Id and Ibn Taymiyya; d. Monday 7 Rajab 668 {cite:shadharat-dhahab p. 567-568}."
  es: "Musnid al-Sham (n. 575) — la mano que escribió el Tarikh Dimashq de Ibn Asakir dos veces, al-Mughni varias veces, unos dos mil volúmenes encuadernados a razón de dos a nueve cuadernillos por día; la altura del isnad terminó con él; la rihla le llegaba de todas partes — entre sus oyentes al-Nawawi, Ibn Daqiq al-Id e Ibn Taymiyya; murió el lunes 7 de Rajab de 668 {cita: shadharat-dhahab pág. 567-568}."
  fr: "Musnid al-Sham (né en 575) — la main qui a recopié le Tarikh Dimashq d'Ibn Asakir à deux reprises, al-Mughni à plusieurs reprises, quelque deux mille volumes reliés à raison de deux à neuf cahiers par jour; la hauteur de l'isnad s'est arrêtée avec lui; la rihla lui est venue de tous les côtés — parmi ses auditeurs al-Nawawi, Ibn Daqiq al-Id et Ibn Taymiyya; d. lundi 7 Rajab 668 {cite: shadharat-dhahab p. 567-568}."
  ur: "مسند الشام ⁦(متوفی 575)⁩ - وہ ہاتھ جس نے ابن عساکر کی تاریخ دمشق کو دو بار، المغنی کئی بار، تقریباً دو ہزار جلدیں دو سے نو کوئرز پر لکھیں۔ اسناد کی اونچائی اس کے ساتھ ختم ہوئی۔ رحلہ ہر چوتھائی سے اس کے پاس آتا تھا - اس کے سننے والوں میں النووی، ابن دقیق العد اور ابن تیمیہ؛ d سوموار 7 رجب 668 567-568}۔"
  tr: "Musnad al-Şam, onun fahhidi ve hadis âlimi, Hanbali katibi; Yahya al-Thaqafi, İbn Sadaqah, İbn al-Mawazini ve Abdurrahman al-Kharqi'den duydu ve onlardan rivayet etmekte dünyada eşsizdi. Vaizi Şeyh Fakhr al-Din ibn Teymiyye'den duydu. Şeyh oldu ve kendisi için bir tarih derledi. Hızlı ve iyi el yazısıyla yazdı, günde iki, üç ila dokuz yazdı. İbn Asakir'in \"Tarih Dimashq\"unu iki kez, Al-Muwaffaq'ın \"Mughni\"sini ise birkaç kez yazdı. İki bin cilt el yazısıyla yazdığını; yaklaşık elli yıl boyunca çok şey anlattığını ve rivayet zincirinin zirvesine ulaştığını belirtti. Yolculuk ülkenin çeşitli bölgelerinden; El-Hafız Diya'ddin, el-Zaki el-Barzali ve Ömer bin el-Hacib gibi erken dönem ezberciler ondan rivayet etmiştir. El-Nevavi, Şemseddin ibn Ebi Ömer, İbn Daqiq el-'Id, İbn Teymiyye ve Khalq ondan rivayet etmişlerdir; sonuncusu İbn el-Khabbaz {atıf:shadharat-dhahab, s. 567-568} olmuştur."
  id: "Musnad al-Sham, ahli hukum dan ulama hadisnya, juru tulis Hanbali; ia mendengar dari Yahya al-Thaqafi, Ibn Sadaqah, Ibn al-Mawazini, dan Abd al-Rahman al-Kharqi, dan ia unik di dunia dalam menceritakan dari mereka. Ia mendengar dari pendakwahnya Sheikh Fakhr al-Din ibn Taymiyyah. Ia menjadi seorang sheikh dan menyusun sejarah untuk dirinya sendiri. Ia menulis dengan cepat dan dengan tulisan tangan yang baik, menulis dua dan tiga sampai sembilan sehari. Ia menulis \"Tarikh Dimashq\" oleh Ibn Asakir dua kali dan \"Al-Mughni\" oleh Al-Muwaffaq beberapa kali. Ia menyebutkan bahwa ia menulis dua ribu jilid dengan tangan; ia banyak menceritakan selama sekitar lima puluh tahun, dan mencapai puncak rangkaian narasi. Perjalanan dari berbagai wilayah di tanah ini; para penghafal awal seperti Al-Hafiz Diya' al-Din, al-Zaki al-Barzali, dan Umar ibn al-Hajib menceritakan darinya. Al-Nawawi, Shams al-Din ibn Abi Umar, Ibn Daqiq al-'Id, Ibn Taymiyyah, dan Khalq menceritakan darinya, yang terakhir adalah Ibn al-Khabbaz {cite:shadharat-dhahab, hlm. 567-568}."
