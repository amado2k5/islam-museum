summary:
  ar: "مهاجم إماراتي معتزل وُلد في أبوظبي سنة 1983. نال الكرة الذهبية في بطولة العالم للشباب 2003، وقاد الإمارات إلى أول ألقابها بالفوز بكأس الخليج 2007 هدافاً وأفضل لاعب فيها، وقضى مسيرته كلها تقريباً مع الوحدة (2001–2024) وخاض 136 مباراة دولية."
  en: "Emirati former forward born in Abu Dhabi in 1983. He won the Golden Ball at the 2003 FIFA World Youth Championship and led the United Arab Emirates to its first trophy, the 2007 Gulf Cup, as the tournament's best player and top scorer; he spent nearly his whole club career at Al-Wahda (2001–2024) and won 136 caps."
  ur: "اماراتی سابق فارورڈ، 1983 میں ابوظہبی میں پیدا ہوئے۔ انہوں نے 2003 کی فیفا ورلڈ یوتھ چیمپئن شپ میں گولڈن بال جیتا اور امارات کو اس کی پہلی ٹرافی — 2007 کا گلف کپ — دلائی، جس میں وہ بہترین کھلاڑی اور ٹاپ اسکورر رہے؛ ان کا تقریباً پورا کلب کیریئر الوحدہ (2001–2024) کے ساتھ گزرا اور انہوں نے 136 بین الاقوامی میچ کھیلے۔"
