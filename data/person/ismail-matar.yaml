summary:
  ar: "مهاجم إماراتي معتزل وُلد في أبوظبي سنة 1983. نال الكرة الذهبية في بطولة العالم للشباب 2003، وقاد الإمارات إلى أول ألقابها بالفوز بكأس الخليج 2007 هدافاً وأفضل لاعب فيها، وقضى مسيرته كلها تقريباً مع الوحدة (2001–2024) وخاض 136 مباراة دولية."
  en: "Emirati former forward born in Abu Dhabi in 1983. He won the Golden Ball at the 2003 FIFA World Youth Championship and led the United Arab Emirates to its first trophy, the 2007 Gulf Cup, as the tournament's best player and top scorer; he spent nearly his whole club career at Al-Wahda (2001–2024) and won 136 caps."
  ur: "اماراتی سابق فارورڈ، 1983 میں ابوظہبی میں پیدا ہوئے۔ انہوں نے 2003 کی فیفا ورلڈ یوتھ چیمپئن شپ میں گولڈن بال جیتا اور امارات کو اس کی پہلی ٹرافی — 2007 کا گلف کپ — دلائی، جس میں وہ بہترین کھلاڑی اور ٹاپ اسکورر رہے؛ ان کا تقریباً پورا کلب کیریئر الوحدہ (2001–2024) کے ساتھ گزرا اور انہوں نے 136 بین الاقوامی میچ کھیلے۔"
  es: "Exdelantero emiratí nacido en Abu Dabi en 1983. Ganó el Balón de Oro en el Campeonato Mundial Juvenil de la FIFA 2003 y lideró a los Emiratos Árabes Unidos a su primer trofeo, la Copa del Golfo 2007, como mejor jugador y máximo goleador del torneo; pasó casi toda su carrera en el Al-Wahda (2001-2024) y disputó 136 partidos internacionales."
  fr: "Ancien attaquant émirati né à Abou Dhabi en 1983. Il a remporté le Ballon d'Or au Championnat du monde junior de la FIFA 2003 et a mené les Émirats arabes unis à leur premier trophée, la Coupe du Golfe 2007, en tant que meilleur joueur et meilleur buteur du tournoi; il a passé la quasi-totalité de sa carrière en club à Al-Wahda (2001-2024) et a remporté 136 sélections."
  tr: "1983 yılında Abu Dabi doğumlu emekli bir Emirlikli forvet. 2003 FIFA U-20 Dünya Şampiyonası'nda Altın Top'u kazandı ve 2007'de hem golcü hem de en iyi oyuncu olarak Körfez Kupası'nı kazanarak BAE'yi ilk şampiyonluğa taşıdı. Kariyerinin neredeyse tamamını Al Wahda'da (2001–2024) geçirdi ve 136 uluslararası maçta forma giydi."
  id: "Seorang striker Emirat yang sudah pensiun dan lahir di Abu Dhabi pada tahun 1983. Ia memenangkan Golden Ball di Kejuaraan Dunia FIFA U-20 2003 dan membawa UAE meraih gelar pertamanya dengan memenangkan Gulf Cup pada tahun 2007 sebagai pencetak gol terbanyak sekaligus pemain terbaik. Ia menghabiskan hampir seluruh kariernya bersama Al Wahda (2001–2024) dan bermain dalam 136 pertandingan internasional."
