summary:
  en: "The last great Sasanian shah (590–628), whose armies took Jerusalem and reached Constantinople's walls before Heraclius broke his empire. The tradition records that he tore up the Prophet's letter — and died within months."
  ar: "آخر عظام ملوك الساسانيين ⁦(590–628م)⁩، أخذت جيوشه القدس وبلغت أسوار القسطنطينية قبل أن يكسر هرقل إمبراطوريته. وتروي الرواية أنه مزّق رسالة النبي — ومات بعد شهور."
  es: "El último gran sha sasánida (590-628), cuyos ejércitos conquistaron Jerusalén y llegaron hasta las murallas de Constantinopla antes de que Heraclio desmantelara su imperio. La tradición cuenta que rompió la carta del Profeta y murió a los pocos meses."
  fr: "Le dernier grand shah sassanide (590-628), dont les armées prirent Jérusalem et atteignirent les murs de Constantinople avant qu'Héraclius ne détruise son empire, aurait, selon la tradition, déchiré la lettre du Prophète et serait mort quelques mois plus tard."
  ur: "آخری عظیم ساسانی شاہ (590-628)، جس کی فوجوں نے یروشلم پر قبضہ کر لیا اور ہرقلیئس کی سلطنت کو توڑنے سے پہلے قسطنطنیہ کی دیواروں تک پہنچ گئے۔ روایت میں درج ہے کہ اس نے پیغمبر کا خط پھاڑ دیا - اور مہینوں کے اندر فوت ہوگیا۔"
