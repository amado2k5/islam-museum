summary:
  ar: "ميمون بن مهران الرقي، أبو أيوب، فقيه من القضاة، مولى لامرأة بالكوفة أعتقته، واستوطن الرقة فكان عالم الجزيرة وسيدها، واستعمله عمر بن عبد العزيز على خراجها وقضائها، وكان ثقة في الحديث كثير العبادة؛ ٣٧ إلى ١١٧هـ الموافقة ٦٥٧ إلى ٧٣٥م."
  en: "Maymun ibn Mihran al-Raqqi, Abu Ayyub, a jurist and judge, once the freedman of a woman at Kufa, who settled at Raqqa and became the scholar and leading man of the Jazira; Umar ibn Abd al-Aziz employed him over its land tax and judiciary, and he was reliable in hadith and much given to worship; 37 to 117 AH, equal to 657 to 735 CE."
