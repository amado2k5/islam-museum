summary:
  ar: "برهان الدين إبراهيم بن بخشي الحنفي المشهور بدادة خليفة مفتي حلب؛ قيل كان في الأصل دباغاً فمنّ الله عليه بطلب العلم حتى صار من موالي الروم، وهو أول من درّس بمدرسة خضر باشا بحلب وأول من أفتى بها من الأروم؛ قال ابن الحنبلي محّنّاه فإذا هو متقن ذو حفظ مفرط، وذكر عن نفسه أنه كان بحيث لو توجه إلى حفظ التنويخ في شهر لحفظه إلا أنه واظب على صوم داود ثمان سنوات فاختلّ دماغه فقلّ حفظه، ولم يزل في حلب على جد في المطالعة وديانة في الفتوى حتى ولي منصب الإفتاء بإزنيق من بلاد الروم، وكان يقول: لو أُعطيت بقدر هذا البيت ياقوتاً ما حلت عن الشرع شبراً؛ وألف رسالة في تحريم اللواط وأخرى في أقسام أموال بيت المال وأحكامها ومصارفها وثالثة في تحريم الحشيش والبنج {cite:shadharat-dhahab p. 345-346}."
  en: "Dada Khalifa — the tanner who became Aleppo's first Ottoman mufti and first teacher of the Khidr Pasha madrasa; 'were I given this house's worth of rubies I would not deviate from the law a span'; tracts on bayt al-mal revenues and on the prohibition of hashish and banj {cite:shadharat-dhahab p. 345-346}."
