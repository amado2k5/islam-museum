summary:
  ar: "برهان الدين إبراهيم بن بخشي الحنفي المشهور بدادة خليفة مفتي حلب؛ قيل كان في الأصل دباغاً فمنّ الله عليه بطلب العلم حتى صار من موالي الروم، وهو أول من درّس بمدرسة خضر باشا بحلب وأول من أفتى بها من الأروم؛ قال ابن الحنبلي محّنّاه فإذا هو متقن ذو حفظ مفرط، وذكر عن نفسه أنه كان بحيث لو توجه إلى حفظ التنويخ في شهر لحفظه إلا أنه واظب على صوم داود ثمان سنوات فاختلّ دماغه فقلّ حفظه، ولم يزل في حلب على جد في المطالعة وديانة في الفتوى حتى ولي منصب الإفتاء بإزنيق من بلاد الروم، وكان يقول: لو أُعطيت بقدر هذا البيت ياقوتاً ما حلت عن الشرع شبراً؛ وألف رسالة في تحريم اللواط وأخرى في أقسام أموال بيت المال وأحكامها ومصارفها وثالثة في تحريم الحشيش والبنج {cite:shadharat-dhahab p. 345-346}."
  en: "Dada Khalifa — the tanner who became Aleppo's first Ottoman mufti and first teacher of the Khidr Pasha madrasa; 'were I given this house's worth of rubies I would not deviate from the law a span'; tracts on bayt al-mal revenues and on the prohibition of hashish and banj {cite:shadharat-dhahab p. 345-346}."
  es: "Dada Khalifa — el curtidor que se convirtió en el primer muftí otomano de Alepo y primer maestro de la madrasa Khidr Pasha; 'si me dieran el valor de los rubíes de esta casa, no me desviaría de la ley ni un palmo'; tratados sobre los ingresos del bayt al-mal y sobre la prohibición del hachís y el banj {citar: shadharat-dhahab págs. 345-346}."
  fr: "Dada Khalifa — le tanneur devenu le premier mufti ottoman d'Alep et le premier enseignant de la madrasa Khidr Pasha; « si l'on me donnait la valeur des rubis de cette maison, je ne dévierais pas de la loi d'un seul trait »; traités sur les revenus du bayt al-mal et sur l'interdiction du haschisch et du banj {cite: shadharat-dhahab p. 345-346}."
  ur: "دادا خلیفہ — ٹینر جو حلب کا پہلا عثمانی مفتی اور خضر پاشا مدرسہ کا پہلا استاد بنا۔ 'اگر مجھے اس گھر کی قیمتی یاقوت دی جائے تو میں قانون سے انحراف نہیں کروں گا'؛ بیت المال کے محصولات اور حشیش اور بنج کی ممانعت سے متعلق خطوط 345-346}۔"
  tr: "Burhan al-Din İbrahim ibn Bakhşi el-Hanafi, Badada olarak bilinir, Halep Müftüsü'nün halifesi; başlangıçta bir tabakçı olduğu söylenir, ancak Allah ona bilgi aramakla kutsadı, ta ki Romalıların sadık hizmetkarlarından biri olana kadar. Halep'teki Hidr Paşa okulunda ilk ders veren ve orada Rumlardan fetvalar veren ilk kişiydi. İbn al-Hanbali şöyle dedi: Ezberleme konusunda yetenekli bir adamdı ve tanwekhi bir ayda ezberleseydi ezberleyeceğini söyledi, ancak sekiz yıl boyunca Davud'u oruç tutmaya ısrar etti, bu yüzden beyni bozuldu ve şöyle dedi Ezberledi, Halep'te okuma ve dini yönetim konusunda titiz kaldı, ta ki Romalıların topraklarındaki İznik'te fetva konumuna gelene kadar. Şöyle derdi: Bana bu eve eşdeğer bir yakut verilseydi, Şeriattan sapmazdı; sodomiyi yasaklayan bir eser, kamu hazinesinin bölünmesi, hükümleri ve harcamaları üzerine bir eser ve haşiş ile uyuşturucu yasağı üzerine üçüncü bir eser yazdı {atıf: Shadharat-Dhahab, s. 345-346}."
  id: "Burhan al-Din Ibrahim ibn Bakhshi al-Hanafi, dikenal sebagai Badada, khalifah Mufti Aleppo; konon ia awalnya seorang penyamak kulit, namun Allah memberkatinya dengan mencari ilmu hingga ia menjadi salah satu pelayan setia bangsa Romawi. Ia adalah yang pertama mengajar di sekolah Khidr Pasha di Aleppo dan yang pertama mengeluarkan fatwa dari keluarga Rum di sana. Ibn al-Hanbali berkata: Ia adalah orang yang terampil dalam menghafal, dan ia menyebutkan bahwa jika ia menghafal tanwekh dalam sebulan, ia pasti akan menghafalnya, tetapi ia tetap berpuasa Dawood selama delapan tahun, sehingga otaknya menjadi kacau, katanya Ia menghafalnya, tetap rajin membaca dan memerintah agama di Aleppo, hingga mencapai posisi fatwa di Izniq di tanah Romawi. Ia biasa berkata: Jika saya diberi rubi setara dengan rumah ini, maka tidak akan menyimpang dari Syariah; ia menulis risalah yang melarang sodomi, satu lagi tentang pembagian wilayah, dan pengeluaran kas umum, dan satu lagi tentang larangan ganja dan narkotika {cite:shadharat-dhahab, hlm. 345-346}."
