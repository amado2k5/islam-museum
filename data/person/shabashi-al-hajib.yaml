label: { ar: "شباشي الحاجب أبو طاهر المشطب" }
summary:
  ar: "أبو طاهر المشطب مولى شرف الدولة أبي الفوارس بن عضد الدولة، لقبه بهاء الدولة بالسعيد ذي العضدين، كان كثير الصدقة مفيض المعروف حتى كان أهل بغداد إذا رأوا من لبس قميصاً جديداً قالوا رحم الله السعيد لأنه كان يكسو اليتامى والضعفاء. وهو الذي بنى قنطرة الخندق والياسرية والزياتين ووقف جبايتها على البيمارستان العضدي، ووقف على الجسر دار الترس بالكرخ، وحفر ذنابة دجيل وساق الماء إلى مقابر قريش وعمل المشهد بكوثا وحفر المصانع والآبار بطريق مكة. توفي في شوال سنة ثمان وأربعمائة ودفن في مقبرة الإمام أحمد بن حنبل {cite:muntazam-ibn-al-jawzi j.7 p.288-289}."
