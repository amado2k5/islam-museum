id: person/shabashi-al-hajib
class: person
label: { ar: "شباشي الحاجب أبو طاهر المشطب" }
summary:
  ar: "أبو طاهر المشطب مولى شرف الدولة أبي الفوارس بن عضد الدولة، لقبه بهاء الدولة بالسعيد ذي العضدين، كان كثير الصدقة مفيض المعروف حتى كان أهل بغداد إذا رأوا من لبس قميصاً جديداً قالوا رحم الله السعيد لأنه كان يكسو اليتامى والضعفاء. وهو الذي بنى قنطرة الخندق والياسرية والزياتين ووقف جبايتها على البيمارستان العضدي، ووقف على الجسر دار الترس بالكرخ، وحفر ذنابة دجيل وساق الماء إلى مقابر قريش وعمل المشهد بكوثا وحفر المصانع والآبار بطريق مكة. توفي في شوال سنة ثمان وأربعمائة ودفن في مقبرة الإمام أحمد بن حنبل {cite:muntazam-ibn-al-jawzi j.7 p.288-289}."
  tr: "Şeraf el-Devle'nin özgür bırakılmış Ebu el-Meştebi, Ebu el-Dev ibn 'Adud al-Dawla, Baha' al-Dawla'ya 'El-Said Dhu al-Adudhayn' unvanını verdi. Çok cömert ve hayırseverdi; öyle ki, Bağdat halkı, yeni gömlek giyen birini gördüklerinde, 'Allah el-Saeed'e merhamet etsin, çünkü o yetimleri ve zayıfları giydirirdi.' derdi. Siperin köprüsünü inşa eden oydu, Yasiriya ve Zayyatin, 'Al-Adadi' hastanesine vergi koydu, Karkh'taki Dar al-Tars köprüsünde durdu, Dujail'in kuyruğunu kazdı, suyu Qureyş türbelerine yönlendirdi ve Mekke yolunda fabrikalar ve kuyular kazarak sahne yarattı. Dört yüz sekiz Hicri yılında Şevval'de öldü ve İmam Ahmed ibn Hanbal mezarlığına defnedildi. {cite:muntazam-ibn-al-jawzi j.] 7 s.288-289}."
  id: "Abu Tahir al-Mashtab, mantan Sharaf al-Dawla Abu al-Fawaris ibn 'Adud al-Dawla, memberikan gelar 'Al-Sa'id Dhu al-Adudhayn' kepada Baha' al-Dawla. Ia sangat dermawan dan murah hati sampai-sampai rakyat Baghdad, ketika melihat seseorang mengenakan kemeja baru, berkata, 'Semoga Allah mengasihani al-Saeed, karena ia dulu mengenakan pakaian yatim piatu dan yang lemah.' Dialah yang membangun jembatan parit, Yasiriya dan Zayyatin menetapkan pajak mereka di rumah sakit 'Al-Adadi', berdiri di jembatan Dar al-Tars di Karkh, menggali ekor Dujail, mengalihkan air ke makam Quraisy, dan membuat pemandangan dengan menggali pabrik dan sumur di jalan menuju Mekah. Ia meninggal di Shawwal pada tahun empat ratus delapan H dan dimakamkan di pemakaman Imam Ahmad ibn Hanbal {cite:muntazam-ibn-al-jawzi j.] 7 hlm.288-289}."
