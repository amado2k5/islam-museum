summary:
  ar: "بردويل الأفرنجي؛ صاحب بيت المقدس وعكا ويافا وعدة بلاد من ساحل الشام وهو الذي أخذ هذه البلاد من المسلمين؛ قصد الديار المصرية ليأخذها فانتدب إلى الفرما ودخلها وأحرقها وأحرق جامعها ومساجدها وقتل أهلها رجلاً مقعداً وابنته فذبحها على صدره ورحل عنها وهو مريض فهلك في الطريق قبل وصوله إلى العريش فشق أصحابه بطنه ورموا حشوته هناك فبُعث ريحها إلى اليوم ورحلوا جثته فدفنوها بعظامه؛ وسُرخة بردويل التي في وسط الرمل على طريق الشام منسوبة إليه والحجارة الملقاة هناك والناس يقولون: هذا قبر بردويل وإنما هو هذه الحثوة {cite:wafayat-ayan}."
  en: "Bardawil the Frank (Baldwin I of Jerusalem, d. c. 511) — lord of Jerusalem, Acre and Jaffa who took them from the Muslims; raided Egypt, burned al-Farama and its mosque, then died of illness on the road before al-Arish; the mound called Sarkhat Bardawil on the Syria road is named for him {cite:wafayat-ayan}."
