summary:
  ar: "بردويل الأفرنجي؛ صاحب بيت المقدس وعكا ويافا وعدة بلاد من ساحل الشام وهو الذي أخذ هذه البلاد من المسلمين؛ قصد الديار المصرية ليأخذها فانتدب إلى الفرما ودخلها وأحرقها وأحرق جامعها ومساجدها وقتل أهلها رجلاً مقعداً وابنته فذبحها على صدره ورحل عنها وهو مريض فهلك في الطريق قبل وصوله إلى العريش فشق أصحابه بطنه ورموا حشوته هناك فبُعث ريحها إلى اليوم ورحلوا جثته فدفنوها بعظامه؛ وسُرخة بردويل التي في وسط الرمل على طريق الشام منسوبة إليه والحجارة الملقاة هناك والناس يقولون: هذا قبر بردويل وإنما هو هذه الحثوة {cite:wafayat-ayan}."
  en: "Bardawil the Frank (Baldwin I of Jerusalem, d. c. 511) — lord of Jerusalem, Acre and Jaffa who took them from the Muslims; raided Egypt, burned al-Farama and its mosque, then died of illness on the road before al-Arish; the mound called Sarkhat Bardawil on the Syria road is named for him {cite:wafayat-ayan}."
  es: "Bardawil el Franco (Baldwin I de Jerusalén, dc 511) — señor de Jerusalén, Acre y Jaffa que las arrebató a los musulmanes; saqueó Egipto, quemó al-Farama y su mezquita, y luego murió de una enfermedad en el camino hacia al-Arish; el montículo llamado Sarkhat Bardawil en el camino a Siria lleva su nombre {cite:wafayat-ayan}."
  fr: "Bardawil le Franc (Baldwin Ier de Jérusalem, v. 511) — seigneur de Jérusalem, d'Acre et de Jaffa qui les prit aux musulmans; pilla l'Égypte, incendia al-Farama et sa mosquée, puis mourut de maladie sur la route devant al-Arish; le monticule appelé Sarkhat Bardawil sur la route de Syrie porte son nom {cite:wafayat-ayan}."
  ur: "بارداول دی فرینک ⁦(یروشلم کا بالڈون اول، ڈی سی 511)⁩ - یروشلم، ایکر اور جافا کا مالک جس نے انہیں مسلمانوں سے چھین لیا۔ مصر پر چھاپہ مارا، الفرامہ اور اس کی مسجد کو جلایا، پھر العریش سے پہلے راستے میں بیماری کی وجہ سے انتقال کر گئے۔ شام کی سڑک پر سرخت بردویل نامی ٹیلے کا نام اسی کے نام پر رکھا گیا ہے۔"
