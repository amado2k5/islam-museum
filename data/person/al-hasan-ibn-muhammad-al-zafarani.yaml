summary:
  ar: "أبو علي الحسن بن محمد بن الصباح الزعفراني، من أصحاب الشافعي البغداديين {cite:tabaqat-fuqaha-abbas-1981 p. 53}، ومات سنة ستين ومائتين، وإليه ينسب «درب الزعفراني» ببغداد وفيه مسجد {cite:tabaqat-fuqaha-abbas-1981 p. 53}. وقال المؤلف إنه المسجد الذي كان يدرّس فيه {cite:tabaqat-fuqaha-abbas-1981 p. 53}."
  en: "Abu Ali al-Hasan ibn Muhammad ibn al-Sabbah al-Za'farani, one of al-Shafi'i's Baghdadi companions {cite:tabaqat-fuqaha-abbas-1981 p. 53}; he died in 260. The lane in Baghdad known as Darb al-Za'farani, which has a mosque in it, is named after him {cite:tabaqat-fuqaha-abbas-1981 p. 53}. The author says it is the mosque where he used to teach {cite:tabaqat-fuqaha-abbas-1981 p. 53}."
  es: "Abu Ali al-Hasan ibn Muhammad ibn al-Sabbah al-Za'farani, uno de los compañeros bagdadíes de al-Shafi'i {cite:tabaqat-fuqaha-abbas-1981 p. 53}; murió en el año 260. La calle de Bagdad conocida como Darb al-Za'farani, que tiene una mezquita, lleva su nombre {cite:tabaqat-fuqaha-abbas-1981 p. 53}. El autor dice que es la mezquita donde solía enseñar {cite:tabaqat-fuqaha-abbas-1981 p. 53}."
  fr: "Abou Ali al-Hasan ibn Muhammad ibn al-Sabbah al-Za'farani, un des compagnons bagdadiens d'al-Shafi'i (voir Tabaqat-fuqaha-abbas, 1981, p. 53), mourut en 260. La ruelle de Bagdad appelée Darb al-Za'farani, où se trouve une mosquée, porte son nom (voir Tabaqat-fuqaha-abbas, 1981, p. 53). L'auteur précise qu'il s'agit de la mosquée où il enseignait (voir Tabaqat-fuqaha-abbas, 1981, p. 53)."
  ur: "ابو علی الحسن بن محمد بن الصباح الزعفرانی، الشافعی کے بغدادی صحابہ میں سے ایک 53}; ان کا انتقال 260 میں ہوا۔ بغداد کی وہ گلی جسے دارب الزعفرانی کے نام سے جانا جاتا ہے، جس میں ایک مسجد ہے، ان کے نام پر رکھا گیا ہے۔ 53}۔ مصنف کا کہنا ہے کہ یہ وہی مسجد ہے جہاں وہ درس دیا کرتے تھے۔ 53}۔"
  tr: "Şafii Bağdadi'nin sahabelerinden biri olan Ebu Ali el-Hasan ibn Muhammed bin el-Sabah el-Za'farani {atıf:tabaqat-fuqaha-abbas-1981, s. 53}, 260 Hicri yılında vefat etti. Bağdat'taki 'Darb al-Za'farani' ona atfedilir ve içinde bir cami bulunur {cite:tabaqat-fuqaha-abbas-1981, s. 53}. Yazar, buranın kendisinin öğrettiği cami olduğunu belirtmiştir {cite:tabaqat-fuqaha-abbas-1981, s. 53}."
  id: "Abu Ali al-Hasan ibn Muhammad ibn al-Sabbah al-Za'farani, salah satu sahabat Shafi'i Baghdadi {cite:tabaqat-fuqaha-abbas-1981, hlm. 53}, meninggal pada tahun 260 H. 'Darb al-Za'farani' di Baghdad dikaitkan dengannya, yang berisi sebuah masjid {cite:tabaqat-fuqaha-abbas-1981, hlm. 53}. Penulis mengatakan bahwa masjid itulah tempat ia mengajarkan {cite:tabaqat-fuqaha-abbas-1981, hlm. 53}."
