  ar: "أبو علي الحسن بن محمد بن الصباح الزعفراني، من أصحاب الشافعي البغداديين {cite:tabaqat-fuqaha-abbas-1981 p. 53}، ومات سنة ستين ومائتين، وإليه ينسب «درب الزعفراني» ببغداد وفيه مسجد {cite:tabaqat-fuqaha-abbas-1981 p. 53}. وقال المؤلف إنه المسجد الذي كان يدرّس فيه {cite:tabaqat-fuqaha-abbas-1981 p. 53}."
  en: "Abu Ali al-Hasan ibn Muhammad ibn al-Sabbah al-Za'farani, one of al-Shafi'i's Baghdadi companions {cite:tabaqat-fuqaha-abbas-1981 p. 53}; he died in 260. The lane in Baghdad known as Darb al-Za'farani, which has a mosque in it, is named after him {cite:tabaqat-fuqaha-abbas-1981 p. 53}. The author says it is the mosque where he used to teach {cite:tabaqat-fuqaha-abbas-1981 p. 53}."
