summary:
  ar: "تاجر وصاحب أعمال لاهوري (1882–1961)، واصل عمل أبيه سيد وزير علي في تموين أفواج الجيش الهندي البريطاني ومتاجر المدينة المسوّرة، واستثمر في أراضي البنجاب، وكان بيته أصل ثروة أبنائه المشاهير: سيد أمجد علي وزير مالية باكستان وسفيرها، وسيد واجد علي رائد التلفزيون فيها، وسيد بابر علي مؤسس جامعة لاهور للإدارة."
  en: "Lahore businessman and army contractor (1882–1961) who carried on his father Syed Wazir Ali's firm supplying regiments of the British Indian Army, kept shops in the Walled City of Lahore and invested in Punjab land; his house was the foundation of the careers of his famous sons: Syed Amjad Ali, Pakistan's finance minister and ambassador, Syed Wajid Ali, a pioneer of its television, and Syed Babar Ali, founder of the Lahore University of Management Sciences."
  ur: "لاہور کے تاجر و ٹھیکیدار (1882ء–1961ء) جنہوں نے اپنے والد سید وزیر علی کا کاروبار آگے بڑھایا: برطانوی ہندی فوج کی رجمنٹوں کو رسد کی فراہمی، لاہور کے اندرون شہر میں دکانیں اور پنجاب میں زمینوں کی خرید؛ انہی کے گھرانے سے ان کے مشہور بیٹے آئے: سید امجد علی، پاکستان کے وزیر خزانہ و سفیر، سید واجد علی، ٹیلی وژن کے بانیوں میں سے، اور سید بابر علی، لاہور یونیورسٹی آف مینجمنٹ سائنسز کے بانی۔"
