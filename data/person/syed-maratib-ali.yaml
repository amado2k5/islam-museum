  source: "English Wikipedia 'Syed Babar Ali' (revision 1379567386) and 'Syed Wajid Ali' (revision 1378869901), the already-defined source English Wikipedia 'Syed Amjad Ali' (revision 1348408869), and the biography page of learningfromothers.org, the official website of Syed Babar Ali's autobiography, read in full on 27 October 2026; article revisions were fetched by revision id through the MediaWiki API with the returned ids asserted equal. Identity: Syed Maratib Ali has NO Wikipedia article of his own in any language (the English title is a redirect to the Mitchell's company article) and NO Wikidata item (Wikidata entity search under Latin and Arabic-script forms returns nothing, and his sons' items carry no father value), so the record is built from his three sons' English articles and the family autobiography site, which agree on the man: a Lahore provisions contractor to the British Indian Army, father of Amjad, Wajid, Babar and Azfal Ali and six daughters. The queue's years (1882–1961) are confirmed exactly by the autobiography site, the only source that dates him. Existence checks by name fragments (maratib, مراتب) across data/person in Latin and Arabic scripts, and by biography, found no prior record: the only file naming him is his son's record, person/syed-amjad-ali, built in wave 89, whose provenance already anticipated this record. Relations written: lived_in Lahore only. No child_of edge is written in this record (edges sit in the child's record): the child_of edge for his eldest son was added to person/syed-amjad-ali in this same run, now that this record exists; his sons Wajid and Babar have no museum records, and his father Syed Wazir Ali has none. His birthplace and death place are unattested, so no born_in or died_in edge is written. The Mitchell's article's statement that Francis Mitchell sold him a majority of the company's shares in 1958 is carried there with a citation-needed tag and is reported in the prose as such."
