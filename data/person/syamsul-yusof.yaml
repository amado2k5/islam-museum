summary:
  ar: "ممثل ومخرج وكاتب ومنتج ماليزي، وُلد في كوالالمبور في 21 مايو 1984، وهو أصغر من نال جائزة أفضل مخرج في مهرجان الفيلم الماليزي، واشتهر بفيلم الرعب الديني «منافق» ⁦(2016)⁩ وتتمته «منافق 2» ⁦(2018)⁩. أُدرج بموجب قرار النوع لسنة 2026 الخاص بمخرجي الدراما الأخلاقية الإسلامية. بلغ حسابه الموثّق على إنستغرام 1,826,612 متابعًا في قراءة مباشرة في 15 نوفمبر 2026."
  en: "Malaysian actor, director, writer and producer, born in Kuala Lumpur on 21 May 1984, the youngest winner of the Malaysian Film Festival's Best Director award, known for the religious horror film Munafik (2016) and its sequel Munafik 2 (2018). He is catalogued under the lane's 2026 genre ruling covering directors of Islamic moral dramas. His verified Instagram account counted 1,826,612 followers in a direct read on 15 November 2026."
  ur: "ملائیشیائی اداکار، ہدایت کار، مصنف اور پروڈیوسر، جو 21 مئی 1984ء کو کوالالمپور میں پیدا ہوا، ملائیشیائی فلم فیسٹیول کا بہترین ہدایت کار کا ایوارڈ پانے والا سب سے کم عمر فاتح ہے، اور مذہبی ہارر فلم «منافق» ⁦(2016ء)⁩ اور اس کے اگلے حصے «منافق 2» ⁦(2018ء)⁩ کے لیے مشہور ہے۔ اسے اسلامی اخلاقی ڈراموں کے ہدایت کاروں سے متعلق 2026ء کے صنفی فیصلے کے تحت درج کیا گیا ہے۔ 15 نومبر 2026ء کی براہِ راست خوانی میں اس کے مصدقہ انسٹاگرام اکاؤنٹ کے 1,826,612 فالوور تھے۔"
  es: "Actor, director, guionista y productor malasio, nacido en Kuala Lumpur el 21 de mayo de 1984, fue el ganador más joven del premio al Mejor Director del Festival de Cine de Malasia. Es conocido por la película de terror religioso Munafik (2016) y su secuela Munafik 2 (2018). Está catalogado en la categoría de 2026, que abarca a los directores de dramas morales islámicos. Su cuenta verificada de Instagram contaba con 1.826.612 seguidores en una lectura directa el 15 de noviembre de 2026."
  fr: "Acteur, réalisateur, scénariste et producteur malaisien, né à Kuala Lumpur le 21 mai 1984, il est le plus jeune lauréat du prix du meilleur réalisateur au Festival du film malaisien. Il est connu pour le film d'horreur religieux Munafik (2016) et sa suite, Munafik 2 (2018). Il est répertorié dans la catégorie « réalisateurs de drames moraux islamiques » (2026). Son compte Instagram certifié comptait 1 826 612 abonnés lors d'une consultation directe le 15 novembre 2026."
  tr: "21 Mayıs 1984'te Kuala Lumpur'da doğan Malezyalı oyuncu, yönetmen, yazar ve yapımcı olan Leo, Malezya Film Festivali'nde En İyi Yönetmen ödülünü kazanan en genç kişidir. En çok dini korku filmi \"Hypocrite\" (2016) ve onun devamı \"Hypocrite 2\" (2018) ile tanınır. 2026 İslami ahlaki drama yönetmenleri için tür kararında listelenmiştir. Doğrulanmış Instagram hesabı, 15 Kasım 2026'da canlı okumada 1.826.612 takipçiye sahipti."
  id: "Seorang aktor, sutradara, penulis, dan produser asal Malaysia, lahir di Kuala Lumpur pada 21 Mei 1984, ia adalah yang termuda yang memenangkan penghargaan Sutradara Terbaik di Festival Film Malaysia. Ia paling dikenal lewat film horor religius \"Hypocrite\" (2016) dan sekuelnya \"Hypocrite 2\" (2018). Ia masuk dalam kategori keputusan genre 2026 untuk sutradara drama moral Islam. Akun Instagram terverifikasinya memiliki 1.826.612 pengikut dalam pembacaan langsung pada 15 November 2026."
