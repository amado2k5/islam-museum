gender: male
summary:
  ar: "شاعر جاهلي من بكر، من فرع كيس بن ثعلبة، سافر إلى بيزنطة مع امرئ القيس، ومات في أرض الروم نحو 530-540م؛ دُوّن شعره في القرن الثاني الهجري وكثيرًا ما استشهد به النقاد {cite:encyclopaedia-of-islam-2 vol. 1 p. 474}."
  en: "A pre-Islamic Arab poet of the Bakr group, of the Kays ibn Tha'laba branch, who travelled to Byzantium with Imru' al-Qays and died in Byzantine territory around 530-540 CE. His poems were collected by the philologists of the second/eighth century and often quoted by critics {cite:encyclopaedia-of-islam-2 vol. 1 p. 474}."
  es: "Poeta árabe preislámico del grupo Bakr, de la rama Kays ibn Tha'laba, que viajó a Bizancio con Imru' al-Qays y murió en territorio bizantino alrededor del 530-540 d. C. Sus poemas fueron recopilados por filólogos del siglo II/VIII y citados con frecuencia por la crítica {cite:encyclopaedia-of-islam-2 vol. 1 p. 474}."
  fr: "Poète arabe préislamique du groupe de Bakr, de la branche de Kays ibn Tha'laba, il voyagea à Byzance avec Imru' al-Qays et mourut en territoire byzantin vers 530-540 apr. J.-C. Ses poèmes furent recueillis par les philologues du IIe/VIIIe siècle et souvent cités par les critiques {cite:encyclopaedia-of-islam-2 vol. 1 p. 474}."
