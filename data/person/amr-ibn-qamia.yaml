summary:
  ar: "شاعر جاهلي من بكر، من فرع كيس بن ثعلبة، سافر إلى بيزنطة مع امرئ القيس، ومات في أرض الروم نحو 530-540م؛ دُوّن شعره في القرن الثاني الهجري وكثيرًا ما استشهد به النقاد {cite:encyclopaedia-of-islam-2 vol. 1 p. 474}."
  en: "A pre-Islamic Arab poet of the Bakr group, of the Kays ibn Tha'laba branch, who travelled to Byzantium with Imru' al-Qays and died in Byzantine territory around 530-540 CE. His poems were collected by the philologists of the second/eighth century and often quoted by critics {cite:encyclopaedia-of-islam-2 vol. 1 p. 474}."
