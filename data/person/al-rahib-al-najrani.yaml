id: person/al-rahib-al-najrani
class: person
label: { ar: "الراهب النجراني", en: "The Najran Monk" }
summary:
  ar: "الراهب النجراني الوارد من بلد الصين سنة سبع وسبعين وثلاثمائة، كان من أهل نجران أنفذه الجاثليق منذ نحو سبع سنين إلى بلد الصين وأنفذ معه خمسة أناسي من النصارى ممن يقوم بأمر الدين فمات من الجماعة الراهب وآخر بعد ست سنين، ولقيه ابن النديم بدار الروم وراء البيمة فحكى له أن النصارى الذين كانوا ببلد الصين فنوا وهلكوا بأسباب ولم يبق في جميع البلاد نصراني واحد وأنه كان هناك بيعة خربت، وأن المسافات في البحر اختلفت وفسد أمر البحر وظهرت فيه آفات وخوف وجزائر قطعت السفن، وأن اسم مدينة الملك طاجويه وأن المملكة كانت إلى اثنين فهلك أحدهما وبقي الآخر، وأن في كل مدينة من مدن الصين أربعة أمراء أكبرهم لانجون ومعناه أمير الأمراء ومعنى بغبور بلغة الصين ابن السماء، وأن أكثر أهل الصين ثنوية وسمنية وعامتهم يعبدون الملك ويعظمون صورته {cite:fihrist-ibn-al-nadim p. 490-493}."
  en: "The Najran monk — sent by the Catholicos to China, interviewed by Ibn al-Nadim in 377/987 on his return {cite:fihrist-ibn-al-nadim}"
