id: person/al-rahib-al-najrani
class: person
label: { ar: "الراهب النجراني", en: "The Najran Monk", fr: "Le moine Najran", es: "The Najran Monk", ur: "نجران راہب" }
summary:
  ar: "الراهب النجراني الوارد من بلد الصين سنة سبع وسبعين وثلاثمائة، كان من أهل نجران أنفذه الجاثليق منذ نحو سبع سنين إلى بلد الصين وأنفذ معه خمسة أناسي من النصارى ممن يقوم بأمر الدين فمات من الجماعة الراهب وآخر بعد ست سنين، ولقيه ابن النديم بدار الروم وراء البيمة فحكى له أن النصارى الذين كانوا ببلد الصين فنوا وهلكوا بأسباب ولم يبق في جميع البلاد نصراني واحد وأنه كان هناك بيعة خربت، وأن المسافات في البحر اختلفت وفسد أمر البحر وظهرت فيه آفات وخوف وجزائر قطعت السفن، وأن اسم مدينة الملك طاجويه وأن المملكة كانت إلى اثنين فهلك أحدهما وبقي الآخر، وأن في كل مدينة من مدن الصين أربعة أمراء أكبرهم لانجون ومعناه أمير الأمراء ومعنى بغبور بلغة الصين ابن السماء، وأن أكثر أهل الصين ثنوية وسمنية وعامتهم يعبدون الملك ويعظمون صورته {cite:fihrist-ibn-al-nadim p. 490-493}."
  en: "The Najran monk — sent by the Catholicos to China, interviewed by Ibn al-Nadim in 377/987 on his return {cite:fihrist-ibn-al-nadim}"
  fr: "Le moine Najran – envoyé par le Catholicos en Chine, interviewé par Ibn al-Nadim en 377/987 à son retour {cite:fihrist-ibn-al-nadim}"
  es: "El monje de Najrán — enviado por el Catolicós a China, entrevistado por Ibn al-Nadim en 377/987 a su regreso {cite:fihrist-ibn-al-nadim}"
  ur: "نجران راہب - کیتھولکوں کی طرف سے چین بھیجا گیا، ابن الندیم نے اس کی واپسی پر 377/987 میں انٹرویو کیا"
  tr: "377 Hicri yılında Çin'den gelen Najrani keşişi Necran kökenliydi. Katolikos onu yaklaşık yedi yıl önce Çin'e göndermişti ve dini işlerden sorumlu beş Hristiyan da onunla birlikte gönderilmişti. Gruptaki keşiş öldü, bir diğeri ise altı yıl sonra öldü. İbn el-Nadim onu nehrin arkasındaki Roma evinde karşıladı ve Çin'deki Hristiyanların çeşitli nedenlerle öldüğünü, tüm topraklarda tek bir Hristiyan kalmadığını, bir antlaşmanın bozulduğunu ve mesafelerin denizde olduğunu söyledi. Deniz meselesi çözüldü, felaketler ve korkular ortaya çıktı ve Cezayir gemileri kesti. Kral Tajwiya şehrinin adı ve krallık ikiye bölündü, biri yok oldu, diğeri kaldı. Çin'in her şehrinde dört prens vardı; en yaşlısı Langun, yani prenslerin prensi anlamına gelir ve Baghbur Çince'de 'Gökyüzünün Oğlu' anlamına gelir. Çin halkının çoğu, hem seküler hem de sıradan halk, kralı tapar ve onun imajına saygı duyar {cite:fihrist-ibn-al-nadim s. 490-493}."
  id: "Biarawan Najrani, yang datang dari Tiongkok pada tahun 377 H, berasal dari Najran. Katholikos mengirimnya sekitar tujuh tahun lalu ke Tiongkok, dan lima orang Kristen yang bertanggung jawab atas urusan keagamaan dikirim bersamanya. Biarawan dari kelompok itu meninggal, dan satu lagi meninggal enam tahun kemudian. Ibn al-Nadim menemuinya di rumah Romawi di belakang sungai dan memberitahunya bahwa orang Kristen yang berada di Tiongkok telah binasa dan tewas karena berbagai alasan, dan tidak ada satu pun orang Kristen yang tersisa di seluruh negeri, bahwa telah terjadi perjanjian yang dilanggar, dan jaraknya berada di laut. Masalah laut menjadi larut, dan bencana serta ketakutan muncul, serta Aljazair yang memutus kapal. Nama kota Raja Tajwiya dan kerajaan terbagi menjadi dua, sehingga satu musnah dan yang lain tetap ada. Di setiap kota di Tiongkok, ada empat pangeran, yang tertua adalah Langun, yang berarti pangeran para pangeran, dan Baghbur berarti 'Anak Langit' dalam bahasa Tionghoa. Sebagian besar rakyat Tiongkok, baik sekuler maupun rakyat biasa, menyembah raja dan menghormati gambarnya {cite:fihrist-ibn-al-nadim hlm. 490-493}."
