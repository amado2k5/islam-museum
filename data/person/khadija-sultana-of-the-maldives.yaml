summary:
  ar: "سلطانة جزائر ذيبة المهل حين زارها ابن بطوطة، يذكر أنها خديجة بنت السلطان جلال الدين عمر ابن السلطان صلاح الدين صالح البنجالي، وليت بعد خلع أخيها شهاب الدين، وكانت الأوامر تنفذ باسمها ويذكرها الخطيب يوم الجمعة، وغلب على الأمر زوجها الوزير جمال الدين {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 591}."
  en: "Ruler of the Maldive islands when Ibn Battuta visited; he names her Khadija daughter of Sultan Jalal al-Din Umar son of Sultan Salah al-Din Salih al-Banjali, says she came to power after her brother Shihab al-Din was deposed, that orders went out in her name and the khatib named her at the Friday sermon, and that her husband the vizier Jamal al-Din held real power {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 591}."
  ur: "ابن بطوطہ کی آمد کے وقت جزائرِ مالدیپ کی حکمران؛ وہ اس کا نام خدیجہ بنت سلطان جلال الدین عمر بن سلطان صلاح الدین صالح البنجالی بتاتا ہے، اور کہتا ہے کہ وہ اپنے بھائی شہاب الدین کی معزولی کے بعد حکمران بنی، احکام اس کے نام سے جاری ہوتے اور خطیب جمعے کو اس کا نام لیتا، جبکہ اصل اختیار اس کے شوہر وزیر جمال الدین کے پاس تھا {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 591}۔"
