summary:
  ar: "أبو الحسين محمد بن أحمد بن إسماعيل الواعظ البغدادي المعروف بابن سمعون؛ كان وحيد دهره في الكلام على الخواطر وحسن الوعظ وجلالة الإشارة ولطف العبارة، أدرك جماعة من جلة المشايخ منهم الشيخ أبو بكر الشبلي؛ وكان لأهل العراق فيه اعتقاد كثير وإياه عنى الحريري صاحب المقامات في المقامة الرازية حيث قال ويحلون ابن سمعون دونه {cite:wafayat-ayan}."
  tr: "Ebu el-Hüseyin Muhammed bin Ahmed bin İsmayıl el-Vaiz el-Bağdadi, İbn Sam'un olarak bilinir, döneminde düşünceleri, mükemmel vaazları, zarif jestleri ve nazik ifadeleriyle eşsizdi. Şeyh Ebu Bekir el-Şibli de dahil olmak üzere önde gelen bir grup şeyhle tanıştı. Irak halkı ona büyük bir güven duyuyordu ve Raziyya Makam'daki Makamet'in yazarı el-Hariri şöyle dedi: 'Ve İbn Samun ondan daha uygundur.'"
  id: "Abu al-Husayn Muhammad ibn Ahmad ibn Isma'il al-Wa'iz al-Baghdadi, yang dikenal sebagai Ibn Sam'un, unik pada zamannya dalam kefasihan dengan pemikiran, khotbah yang luar biasa, gerakan yang anggun, dan ekspresi yang lembut. Ia bertemu dengan sekelompok sheikh terkemuka, termasuk Sheikh Abu Bakr al-Shibli. Rakyat Irak sangat percaya kepadanya, dan al-Hariri, penulis Maqamat dalam Maqamah Raziyya, berkata: 'Dan Ibn Sam'un lebih cocok darinya.'"
