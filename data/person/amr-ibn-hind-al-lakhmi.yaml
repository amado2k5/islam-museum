summary:
  ar: "عمرو بن هند بن المنذر بن ماء السماء اللخمي، صاحب الحيرة، لُقب مضرط الحجارة لشدة ملكه وقوة سياسته، وأمه هند بنت الحارث بن عمرو المقصور عمة امرئ القيس الشاعر؛ ولّاه المنذر على بكر وتغلب في غزوة بني آكل المرار وقال اغز أخوالك، وكان حريصاً على مذلة أشراف العرب حتى مكر بأم عمرو بن كلثوم ليلى بنت مهلهل فثار ابن كلثوم إلى سيفه المعلق في السرادق فضرب رأسه فقتله {cite:kamil-ibn-al-athir p. 403, 409}."
  en: "Amr ibn Hind al-Lakhmi, king of al-Hira, surnamed Mudarrat al-Hijara for the fierceness of his rule — his mother Hind a daughter of the Kinda house; he sent his Taghlibi uncles' own war-band against them, and died by his own sword when Amr ibn Kulthum heard his mother Layla's cry of insult in the royal tent {cite:kamil-ibn-al-athir p. 403, 409}."
  es: "Amr ibn Hind al-Lakhmi, rey de al-Hira, apodado Mudarrat al-Hijara por la ferocidad de su gobierno —su madre Hind era hija de la casa Kinda—, envió contra ellos a la propia banda de guerra de sus tíos Taghlibi, y murió por su propia espada cuando Amr ibn Kulthum oyó el grito de insulto de su madre Layla en la tienda real {cite:kamil-ibn-al-athir p. 403, 409}."
  fr: "Amr ibn Hind al-Lakhmi, roi d'al-Hira, surnommé Mudarrat al-Hijara pour la férocité de son règne — sa mère Hind était une fille de la maison Kinda; il envoya la propre bande de guerre de ses oncles Taghlibi contre eux, et mourut de sa propre épée lorsqu'Amr ibn Kulthum entendit le cri d'insulte de sa mère Layla dans la tente royale {cite:kamil-ibn-al-athir p. 403, 409}."
  ur: "عمرو بن ہند الخمی، الحیرہ کے بادشاہ، نے اپنی حکمرانی کی سختی کی وجہ سے مدرت الحجرہ کا نام دیا - اس کی ماں ہند ایک کندہ گھر کی بیٹی؛ اس نے ان کے خلاف اپنے تغلبی ماموں کا اپنا جنگی دستہ بھیجا، اور اپنی ہی تلوار سے اس وقت مر گیا جب عمرو بن کلثوم نے شاہی خیمے میں اپنی ماں لیلیٰ کی توہین کی آواز سنی۔ 403، 409}۔"
  tr: "Amr ibn Hind ibn al-Mundhir ibn Ma' al-Sama' al-Lakhmi, el-Hirah'ın sahibi, güçlü gücü ve siyasi gücü nedeniyle Mudarat al-Hijara lakabını almıştır. Annesi, şair İmru' el-Kays'in teyzesi Hind bint al-Harith ibn Amr al-Maqsur'dur. Al-Mundhir onu Bakr'ın üzerine atadı ve Banu Akil al-Marar savaşında 'Amcalarını işgal et.' dedi. Arap soylularını küçük düşürmeye hevesliydi, ta ki um Amr bin Kulthum Leyla bint Muhallal'a karşı komplo kurana kadar. İbn Kulthum, çadırda asılı kılıcına karşı isyan etti, kafasını vurdu ve onu öldürdü {cite:kamil-ibn-al-athir s. 403, 409}."
  id: "Amr ibn Hind ibn al-Mundhir ibn Ma' al-Sama' al-Lakhmi, pemilik al-Hirah, dijuluki Mudarat al-Hijara karena kekuatan dan kekuasaan politiknya yang kuat. Ibunya adalah Hind bint al-Harith ibn Amr al-Maqsur, bibi dari penyair Imru' al-Qais. Al-Mundhir mengangkatnya menggantikan Bakr dan menang dalam pertempuran Banu Akil al-Marar, dengan berkata, 'Serbu paman-pamanmu.' Ia bersemangat mempermalukan bangsawan Arab hingga ia berseploti melawan um Amr ibn Kulthum Layla bint Muhallal. Ibn Kulthum memberontak melawan pedangnya yang tergantung di tenda, memukul kepalanya, dan membunuhnya {cite:kamil-ibn-al-athir hlm. 403, 409}."
