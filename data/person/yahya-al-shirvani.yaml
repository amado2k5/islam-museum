summary:
  ar: "بطاقة أولية لسيد يحيى الشرواني الباكوبي، مؤسس الطريقة الخلوتية في القرن الخامس عشر الذي اتصلت به مشايخ الأناضول، توفي سنة ١٤٦٢م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Sayyid Yahya al-Shirvani al-Bakubi, the fifteenth-century founder of the Khalwati order whose spiritual line ran through Anatolia, d. 1462; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Sayyid Yahya al-Shirvani al-Bakubi, fundador en el siglo XV de la orden Khalwati, cuya línea espiritual se extendía por Anatolia, fallecido en 1462; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de Sayyid Yahya al-Shirvani al-Bakubi, fondateur au XVe siècle de l'ordre Khalwati dont la lignée spirituelle a traversé l'Anatolie, mort en 1462; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "پندرہویں صدی کے خلوتی حکم کے بانی سید یحییٰ الشروانی البکوبی کے لیے ڈرافٹ کارڈ جس کا روحانی سلسلہ اناطولیہ سے گزرتا تھا، ڈی۔ 1462; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "On beşinci yüzyılda Halvatiyya tarikatının kurucusu ve Anadolu şeyhleri tarafından temas edilen Seyyid Yahya El-Şervani El-Bakubi'nin ön kartı; kendisi Seçkinlerin sözlüklerinde geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sayyid Yahya Al-Sharwani Al-Bakubi, pendiri ordo Khalwatiyya pada abad kelima belas dan dihubungi oleh para sheikh Anatolia, yang meninggal pada tahun 1462 M; ia disebutkan dalam kamus para tokoh, dan biografinya belum ditinjau di halaman tersebut."
