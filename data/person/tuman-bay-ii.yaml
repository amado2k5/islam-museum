id: person/tuman-bay-ii
class: person
label: { ar: "السلطان طومان باي الثاني", en: "Sultan Tuman Bay II", es: "Sultan Tuman Bay II", fr: "Sultan Tuman Bay II", ur: "سلطان تومان بے دوم" }
summary:
  ar: "الملك الأشرف طومان باي الجركسي ابن أخي قانصوه الغوري، في شذرات الذهب أنه تولى مصر بعد وقعة مرج دابق ووقع بينه وبين السلطان سليم حروب يطول ذكرها ثم سلم نفسه طائعاً فقتل بباب زويلة وأمر السلطان سليم بدفنه بهانيّ مدفن النوطي وبه انقضت دولة الجراكسة {cite:shadharat-dhahab p. 531}. وعند الصلابي أن سليم أرسل إليه من الشام يطلب الطاعة فكان رد المماليك السخرية برسوله ثم قتله فقرر سليم الحرب، وأن سليم قال له بعد هزيمته بالريدانية: «أنا ما جئت عليكم إلا بفتوى علماء الأعصار والأمصار، وأنا كنت متوجهاً إلى جهاد الرافضة والفجار، فلما بغى أميركم الغورى وجاء بالعساكر إلى حلب واتفق مع الرافضة واختار أن يمشى إلى مملكتي مشيت إليه» {cite:dawlat-uthmaniyya-salabi p. 186-187}."
  en: "Last Mamluk sultan, nephew of Qansuh al-Ghawri — raised in Egypt after Marj Dabiq, fought Selim a while, then surrendered himself and was put to death at Bab Zuwayla; 'and with him the Circassian state ended' {cite:shadharat-dhahab p. 531}. Al-Salabi adds that the Mamluks mocked then killed Selim's envoy demanding obedience, and records Selim's words to the defeated Tuman Bay: «I only came upon you with the ulema's fatwa — I was bound for jihad against the Rafida and the fujjar until your amir al-Ghawri marched into my inherited kingdom» {cite:dawlat-uthmaniyya-salabi p. 186-187}."
  es: "El último sultán mameluco, sobrino de Qansuh al-Ghawri, criado en Egipto después de Marj Dabiq, luchó contra Selim durante un tiempo, luego se rindió y fue ejecutado en Bab Zuwayla; «y con él terminó el estado circasiano» {cita: shadharat-dhahab p. 531}. Al-Salabi añade que los mamelucos se burlaron y luego mataron al enviado de Selim que exigía obediencia, y registra las palabras de Selim al derrotado Tuman Bay: «Solo vine a vosotros con la fatwa de los ulemas; estaba destinado a la yihad contra los rafida y los fujjar hasta que vuestro emir al-Ghawri marchara hacia mi reino heredado» {cita: dawlat-uthmaniyya-salabi p. 186-187}."
  fr: "Le dernier sultan mamelouk, neveu de Qansuh al-Ghawri – élevé en Égypte après Marj Dabiq –, combattit Selim pendant un certain temps, puis se rendit et fut mis à mort à Bab Zuwayla; « et avec lui disparut l'État circassien » (cite: shadharat-dhahab, p. 531). Al-Salabi ajoute que les Mamelouks se moquèrent de l'envoyé de Selim, puis le tuèrent, exigeant son obéissance. Il rapporte les paroles de Selim au vaincu Tuman Bay: « Je ne suis venu vous trouver qu'avec la fatwa des oulémas – j'étais sur le point de faire le djihad contre les Rafida et les Fujjar jusqu'à ce que votre émir al-Ghawri marche sur mon royaume hérité » (cite: dawlat-uthmaniyya-salabi, p. 186-187)."
  ur: "آخری مملوک سلطان، قنسوح الغاوری کے بھتیجے - مرج دابق کے بعد مصر میں پرورش پانے والے، سلیم سے تھوڑی دیر لڑے، پھر خود کو سپرد کر دیا اور باب زوائلہ میں قتل کر دیا گیا۔ 'اور اس کے ساتھ سرکیسیئن ریاست کا خاتمہ ہوا' 531}۔ الصلبی نے مزید کہا کہ مملوکوں نے طعنہ زنی کی اور پھر سیلم کے ایلچی کو اطاعت کا مطالبہ کرتے ہوئے قتل کر دیا، اور سیلم کے یہ الفاظ شکست خوردہ تمن بے کے لیے لکھے: \"میں صرف علمائے کرام کے فتوے کے ساتھ آپ کے پاس آیا ہوں - میں رافضی اور فجار کے خلاف جہاد کے لیے پابند تھا یہاں تک کہ آپ کے امیر الغاوری نے میری سلطنت میں داخل ہو گئے۔\" {حوالہ:دولت عثمانیہ سلبی ص۔ 186-187}۔"
