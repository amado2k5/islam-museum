summary:
  ar: صحابي من الأنصار ابن عبد الله بن عمرو بن حرام، أحد المكثرين من الحديث؛ شهد العقبة وغزا تسع عشرة غزوة، ولم يشهد بدراً ولا أحداً لأن أباه منعه، وكانت له حلقة علم في المسجد النبوي. ويروي في الصحيح وصية أبيه له ليلة أحد وكونه أول قتيل واستخراجه إياه بعد ستة أشهر سليماً إلا أذنه {cite:sahih-al-bukhari 1351}، وقول النبي له «ما زالت الملائكة تظله بأجنحتها» حتى رفع {cite:sahih-al-bukhari 4080}. وعنده في صحيح مسلم أطول وصف لحجة الوداع — حديثه المشهور في صفة الحج من التلبية إلى الرمي {cite:sahih-muslim 1218}
  en: A Companion of the Ansar, son of Abdullah ibn Amr ibn Haram and one of the great transmitters of hadith; he was present at al-Aqaba and took part in nineteen expeditions, but not Badr or Uhud because his father kept him back; he held a
    circle of learning in the Prophet's Mosque.
