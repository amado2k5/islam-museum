summary:
  ar: "سياسي وكاتب وشاعر تتاري قرمي، أول رئيس لحكومة (مديرية) جمهورية القرم الشعبية ووزير عدلها. انتُخب سنة 1917 رئيسا للجنة التنفيذية المسلمة المؤقتة في القرم ومفتيا مؤقتا لمسلمي القرم وليتوانيا وبولندا وبيلاروس، ونظّم القورولتاي الأول وألّف «أنت أتكنمن» النشيد الوطني للتتار القرم؛ اعتُقل في يناير 1918 وأعدمه بحارة بلاشفة رميا في سيفاستوبول في 23 فبراير 1918."
  en: "Crimean Tatar politician, writer and poet, the first chairman of the Directory (national government) of the Crimean People's Republic and its head of justice. Elected in March 1917 chairman of the Provisional Crimean Muslim Executive Committee and temporary mufti of the Muslims of Crimea, Lithuania, Poland and Belarus, he organised the first Qurultay and authored 'Ant etkenmen', the Crimean Tatar national anthem; arrested in January 1918, he was shot by Bolshevik sailors at Sevastopol on 23 February 1918."
  ur: "کریمیائی تاتاری سیاست دان، مصنف اور شاعر؛ جمہوریہ کریمیا کی ڈائریکٹری (قومی حکومت) کے پہلے چیئرمین اور اس کے نظامِ انصاف کے سربراہ۔ مارچ 1917 میں عارضی کریمیائی مسلم ایگزیکٹو کمیٹی کے چیئرمین اور کریمیا، لیتھوانیا، پولینڈ اور بیلاروس کے مسلمانوں کے عارضی مفتی منتخب ہوئے، پہلا قرولتائی منعقد کیا اور کریمیائی تاتاری قومی ترانہ لکھا؛ جنوری 1918 میں گرفتار ہوئے اور 23 فروری 1918 کو سیواستوپول میں بالشویک ملاحوں نے گولی مار کر شہید کیا۔"
