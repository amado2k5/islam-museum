summary:
  ar: "الطيب بن عفيف الدين مخرمة العدني الشافعي الإمام العلامة المحدث؛ ولد بعدن ليلة الأحد ثاني عشر ربيع الثاني سنة سبعين وثمانمائة، وأخذ عن والده وعن الفقيه محمد بن أحمد فضل وانتفع به كثيراً ولازمه، وتفنن في العلوم وبرع وتصدر للفتوى والاشتغال، وكان من أصح الناس ذهناً وأذكاهم قريحة وأقربهم فهماً وأحسنهم تدريساً حتى يذكر أنه لم ير مثله في حسن التدريس وحل المشكلات في الفقه، وصار في آخره عمدة الفتوى بعدن وكان يقول إني أقرئ أربعة عشر علماً، وولي القضاء بعدن؛ ومن مؤلفاته شرح صحيح مسلم وأسماء رجال مسلم وتاريخ مطول مرتب على الطبقات والسنن ابتدأ به من أول الهجرة وكتاب في النسبة إلى البلدان مفيد جداً؛ توفي بعدن في سادس المحرم ودُفن في قبر جده لأمه القاضي العلامة محمد بن مسعود أبي شكيل بوصية في قبة الشيخ جوهر {cite:shadharat-dhahab p. 684}."
  en: "Aden's mufti — b. Sunday eve 12 Rabi' II 870, 'the soundest mind, the brightest spark' of the city: 'I teach fourteen sciences', author of a sharh of Sahih Muslim, Asma' Rijal Muslim, and a long history ordered by tabaqat from the first hijra year; died 6 Muharram [947], buried in Shaykh Jawhar's qubba {cite:shadharat-dhahab p. 684}."
  fr: "Le mufti d'Aden – né le dimanche soir 12 Rabi' II 870, 'l'esprit le plus sain, l'étincelle la plus brillante' de la ville : 'J'enseigne quatorze sciences', auteur d'un sharh de Sahih Muslim, Asma' Rijal Muslim, et d'une longue histoire ordonnée par tabaqat depuis la première année de la hijra ; Décédé 6 Muharram [947], enterré dans la qubba de Cheikh Jawhar {cite:shadharat-dhahab p. 684}."
  es: "Muftí de Adén — n. víspera del domingo 12 de Rabi' II 870, 'la mente más lúcida, la chispa más brillante' de la ciudad: 'enseño catorce ciencias', autor de un sharh de Sahih Muslim, Asma' Rijal Muslim y una larga historia ordenada por tabaqat desde el primer año de la hégira; murió el 6 de Muharram [947], enterrado en la qubba de Shaykh Jawhar {cite:shadharat-dhahab p. 684}."
  ur: "عدن کے مفتی - بی۔ اتوار کی شام 12 ربیع الثانی 870، شہر کا سب سے بہترین دماغ، روشن ترین چنگاری: 'میں چودہ علوم سکھاتا ہوں'، صحیح مسلم کی شرح کی مصنف، اسماء رجال مسلم، اور ہجرت کے پہلے سال سے طبقات کے ذریعے ترتیب دی گئی ایک طویل تاریخ؛ وفات 6 محرم [947]، شیخ جوہر کے قبا میں مدفون 684}۔"
  tr: "El-Teyyib bin Afifdin Muhhrramah el-Adani el-Şafii, seçkin imam ve hadis âlimi; sekiz yüz yetmişte Rebi'l-Thani'nin on ikinci günü Pazar gecesi Aden'de doğdu. Babası ve hukukçu Muhammed bin Ahmed Fadl'ın yanında eğitim aldı, ondan büyük fayda sağladı ve onu yakından takip etti. Fenlerde üstün başarı gösterdi, fetva vermede ve çalışmada üstün oldu. En entelektüel olarak doğru, en keskin, en zeki ve en bilgili ve öğretimde en iyilerden biriydi; öyle ki, kendisi gibi birini fıkıh alanında mükemmel öğretim ve problem çözme konusunda hiç görmediği belirtilir. Sonunda Aden'de fetvanın direği oldu ve derdi ki, 'Ben okuyorum.' On dört âlimi tuttu ve Aden'de yargıç olarak görev yaptı; eserleri arasında Sahih Müslüm'ün açıklaması, Müslüman adamlarının isimleri, Hicra'nın başında başlayan sınıflar ve gelenekler üzerine uzun bir tarih ve topraklara atfetme üzerine çok faydalı bir kitap yer alır; Muharrem'in altıncısında Aden'de öldü ve annesinin babası, yargıç ve alim Muhammed ibn Mes'ud Abi Şakil'in mezarında, vasiyetle Şeyh Cevhar'ın kubbesinde defnedildi {atıf: shadharat-dhahab, s. 684}."
  id: "Al-Tayyib ibn Afif al-Din Mukhramah al-Adani al-Shafi'i, imam terkemuka dan ulama hadis; ia lahir di Aden pada malam Minggu, tanggal dua belas Rabi' al-Thani, tahun delapan ratus tujuh puluh. Ia belajar di bawah bimbingan ayahnya dan ahli hukum Muhammad ibn Ahmad Fadl, sangat diuntungkan darinya, dan mengikuti dengan dekat. Ia unggul dalam ilmu pengetahuan, unggul, dan unggul dalam mengeluarkan fatwa serta terlibat dalam pekerjaan. Ia termasuk yang paling cerdas, paling tajam, paling cerdas, dan paling berpengetahuan, serta yang terbaik dalam mengajar, sampai-sampai disebutkan bahwa ia belum pernah melihat orang seperti dirinya dalam pengajaran dan pemecahan masalah yang luar biasa dalam bidang fiqh. Akhirnya, ia menjadi pilar fatwa di Aden, dan ia biasa berkata, 'Aku membaca.' Ia memiliki empat belas ulama dan menjabat sebagai hakim di Aden; di antara karyanya adalah penjelasan tentang Sahih Muslim, nama-nama pria Muslim, sejarah panjang yang disusun tentang kelas dan tradisi yang dimulai pada awal Hijrah, serta sebuah buku yang sangat berguna tentang atribusi tanah; ia meninggal di Aden pada tanggal enam Muharram dan dimakamkan di makam kakek dari pihak ibu, hakim dan ulama Muhammad ibn Mas'ud Abi Shakil, berdasarkan wasiat di kubah Sheikh Jawhar {cite:shadharat-dhahab, hlm. 684}."
