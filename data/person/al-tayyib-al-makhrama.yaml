summary:
  ar: "الطيب بن عفيف الدين مخرمة العدني الشافعي الإمام العلامة المحدث؛ ولد بعدن ليلة الأحد ثاني عشر ربيع الثاني سنة سبعين وثمانمائة، وأخذ عن والده وعن الفقيه محمد بن أحمد فضل وانتفع به كثيراً ولازمه، وتفنن في العلوم وبرع وتصدر للفتوى والاشتغال، وكان من أصح الناس ذهناً وأذكاهم قريحة وأقربهم فهماً وأحسنهم تدريساً حتى يذكر أنه لم ير مثله في حسن التدريس وحل المشكلات في الفقه، وصار في آخره عمدة الفتوى بعدن وكان يقول إني أقرئ أربعة عشر علماً، وولي القضاء بعدن؛ ومن مؤلفاته شرح صحيح مسلم وأسماء رجال مسلم وتاريخ مطول مرتب على الطبقات والسنن ابتدأ به من أول الهجرة وكتاب في النسبة إلى البلدان مفيد جداً؛ توفي بعدن في سادس المحرم ودُفن في قبر جده لأمه القاضي العلامة محمد بن مسعود أبي شكيل بوصية في قبة الشيخ جوهر {cite:shadharat-dhahab p. 684}."
  en: "Aden's mufti — b. Sunday eve 12 Rabi' II 870, 'the soundest mind, the brightest spark' of the city: 'I teach fourteen sciences', author of a sharh of Sahih Muslim, Asma' Rijal Muslim, and a long history ordered by tabaqat from the first hijra year; died 6 Muharram [947], buried in Shaykh Jawhar's qubba {cite:shadharat-dhahab p. 684}."
