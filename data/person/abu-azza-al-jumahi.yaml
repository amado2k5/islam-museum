gender: male
roles: [poet]
summary:
  ar: "شاعر من بني جمح أسره المسلمون ببدر وأطلقه النبي دون فداء على أن لا يعود إلى القتال، فحرّض القبائل بشعره بعد ذلك، ثم قُتل أسيراً في أحد ⁦(الرحيق ص230، 249)⁩."
  en: "A poet of the Banu Jumah whom the Muslims took captive at Badr; the Prophet released him without ransom on condition that he not return to fighting, but he afterwards roused the tribes with his poetry, and was then killed as a captive at Uhud (al-Raheeq, pp. 230, 249)."
  fr: "Poète des Banu Jumah que les musulmans firent prisonnier à Badr ; le Prophète le libéra sans rançon à condition qu'il ne retourne pas au combat, mais il excita ensuite les tribus par sa poésie, puis fut tué comme captif à Uhud (al-Raheeq, pp. 230, 249)."
  es: "Un poeta de los Banu Jumah a quien los musulmanes tomaron cautivo en Badr; el Profeta lo liberó sin rescate con la condición de que no volviera a luchar, pero luego incitó a las tribus con su poesía y luego fue asesinado como prisionero en Uhud (al-Raheeq, págs. 230, 249)."
  ur: "بنو جمعہ کا ایک شاعر جسے مسلمانوں نے بدر میں اسیر کر لیا تھا۔ نبی نے اسے بغیر فدیہ کے اس شرط پر رہا کیا کہ وہ لڑائی میں واپس نہیں آئے گا، لیکن اس کے بعد اس نے اپنے اشعار سے قبائل کو جگایا، اور پھر احد کے مقام پر اسیری کے طور پر مارا گیا ⁦(الرحیق، صفحہ 230، 249)⁩۔"
  tr: "Beni Cuma kabilesinden bir şair, Bedir'de Müslümanlar tarafından esir alınmış ve Peygamber tarafından savaşa geri dönmemesi şartıyla fidye alınmadan serbest bırakılmıştır. Daha sonra şiirleriyle kabileleri kışkırtmış ve daha sonra Uhud'da esir olarak öldürülmüştür (El-Rahik, s. 230, 249)."
  id: "Seorang penyair dari suku Banu Jumah, yang ditangkap oleh kaum Muslim di Badr dan dibebaskan oleh Nabi tanpa tebusan dengan syarat ia tidak akan kembali berperang. Ia kemudian menghasut suku-suku tersebut dengan puisinya, dan kemudian terbunuh sebagai tawanan di Uhud (Al-Raheeq, hlm. 230, 249)."
