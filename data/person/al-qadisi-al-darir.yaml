label: { ar: "أحمد القادسي الضرير الجنبلي" }
summary:
  ar: "أحمد بن محمد القادسي الضرير الجنبلي؛ كان خشن العيش، طلب المستضيء بالله من يصلي به التراويح فأحضروه فقالوا ما مذهبك؟ قال حنبلي، فقالوا ما يمكن أن يصلي بدار الخلافة حنبلي، فقال القادسي أنا حنبلي وما أريد أن أصلي بكم، فسمعه الخليفة فقال صلِّ على مذهبك؛ وكان ملازماً لابن الجوزي وبه انتفع؛ توفي سنة إحدى وعشرين وستمائة {cite:shadharat-dhahab p. 95}."
  en: "Ahmad al-Qadisi the blind — a man of rough living whom al-Mustadi' summoned to lead the tarawih; told that no Hanbali could pray at the caliph's court he answered 'I am a Hanbali and I do not wish to lead you' — overheard, the caliph said 'pray by your own madhhab'; he kept close to Ibn al-Jawzi and profited by him; died 621 {cite:shadharat-dhahab p. 95}."
