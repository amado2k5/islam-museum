label: { ar: "أحمد القادسي الضرير الجنبلي", en: "Ahmad al-Qadisi al-Darir al-Janbali", fr: "Ahmad al-Qadisi al-Darir al-Janbali", es: "Ahmad al-Qadisi al-Darir al-Janbali", ur: "احمد القادسی الدار الجنبلی۔" }
summary:
  ar: "أحمد بن محمد القادسي الضرير الجنبلي؛ كان خشن العيش، طلب المستضيء بالله من يصلي به التراويح فأحضروه فقالوا ما مذهبك؟ قال حنبلي، فقالوا ما يمكن أن يصلي بدار الخلافة حنبلي، فقال القادسي أنا حنبلي وما أريد أن أصلي بكم، فسمعه الخليفة فقال صلِّ على مذهبك؛ وكان ملازماً لابن الجوزي وبه انتفع؛ توفي سنة إحدى وعشرين وستمائة {cite:shadharat-dhahab p. 95}."
  en: "Ahmad al-Qadisi the blind — a man of rough living whom al-Mustadi' summoned to lead the tarawih; told that no Hanbali could pray at the caliph's court he answered 'I am a Hanbali and I do not wish to lead you' — overheard, the caliph said 'pray by your own madhhab'; he kept close to Ibn al-Jawzi and profited by him; died 621 {cite:shadharat-dhahab p. 95}."
  fr: "Ahmad al-Qadisi l'aveugle - un homme de la vie rugueuse qui Al-Mustadi 'appelé à diriger le tarawih ; Il a dit qu'aucun Hanbali ne pouvait prier à la cour du calife, il a répondu : « Je suis un Hanbali et je ne veux pas vous guider » - entendu, le calife a dit : « Priez par votre propre madhhab » ; il est resté proche d'Ibn al-Jawzi et a profité de lui ; est mort 621 {cite:shadharat-dhahab p. 95}."
  es: "Ahmad al-Qadisi el ciego, un hombre de vida humilde a quien al-Mustadi' llamó para dirigir el tarawih, le dijeron que ningún hanbalí podía rezar en la corte del califa, a lo que respondió: \"Soy hanbalí y no deseo dirigirlos\". Al oírlo, el califa dijo: \"Reza según tu propia escuela jurídica\"; se mantuvo cercano a Ibn al-Jawzi y se benefició de él; murió en 621 {cita: shadharat-dhahab p. 95}."
  ur: "احمد القادسی نابینا - ایک کھردرا آدمی جسے المستدی نے تراویح کی امامت کے لیے بلایا؛ بتایا کہ کوئی حنبلی خلیفہ کے دربار میں نماز نہیں پڑھ سکتا اس نے جواب دیا 'میں حنبلی ہوں اور میں آپ کی امامت نہیں کرنا چاہتا' - سنا، خلیفہ نے کہا 'اپنے مذہب سے نماز پڑھو'۔ وہ ابن الجوزی کے قریب رہا اور اس سے فائدہ اٹھایا۔ وفات 621۔ 95}۔"
  tr: "Ahmed bin Muhammed el-Kadisi kör ve alçakgönüllüydü; sert bir hayattı. El-Mustadi' Billah, teravih namazlarını birlikte yönetmesi için birini istedi, onlar da onu getirdi ve 'Öğretin nedir?' diye sordular. Hanbali, 'Senin öğretin nedir?' diye sordu. Onlar, 'Hanbali halifeliğinin evinde ne namaz kılabilir?' diye sordular. El-Kadisî şöyle cevap verdi: 'Ben Hanbalı'yım ve sizinle birlikte liderlik etmek istemiyorum.' Halife onu duydu ve dedi ki, 'Öğretilerine göre namaz kıl.' O, İbn el-Cewzi'nin yakın bir dostuydu ve bundan faydalandı; 621 Hicri yılında vefat etti {atıf:şadharat-dhahab, s. 95}."
  id: "Ahmad ibn Muhammad al-Qadisi buta dan rendah hati; ia hidup kasar. Al-Mustadi' Billah meminta seseorang untuk memimpin shalat Taraweeh, jadi mereka membawanya dan bertanya, 'Apa ajaranmu?' Hanbali berkata, 'Apa ajaranmu?' Mereka bertanya, 'Apa yang bisa didoakan di rumah khilafah Hanbali?' Al-Qadisi menjawab, 'Aku Hanbali, dan aku tidak ingin memimpin bersamamu.' Khalifah mendengarnya dan berkata, 'Berdoalah sesuai ajaranmu.' Ia adalah sahabat dekat Ibn al-Jawzi dan mendapat manfaat darinya; ia meninggal pada tahun 621 H {cite:shadharat-dhahab, hlm. 95}."
