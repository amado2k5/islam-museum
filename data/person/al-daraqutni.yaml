summary:
  ar: "علي بن عمر أبو الحسن الدارقطني (306–385هـ)، حافظ بغداد وفريد عصره؛ انتهى إليه علم الأثر والمعرفة بأسماء الرجال وعلل الحديث وانفرد بالحفظ، وكان الحاكم يقول ما رأى الدارقطني مثل نفسه، وقد اجتمع له مع علم الحديث المعرفة بالقراءات والنحو والفقه والشعر مع الأمانة والعدالة وصحة العقيدة. وحُكي أنه حضر في حداثته مجلس إسماعيل الصفار وهو ينسخ فأُنكر عليه فأعاد من الفور أسانيد ثمانية عشر حديثاً ومتونها على ترتيب الإملاء؛ وقيل إن كتاب «العلل» الذي يُروى عنه نقله البرقاني من إملائه على أبي منصور بن حمدان الصيرفي. توفي يوم الثلاثاء سابع ذي القعدة سنة خمس وثمانين ودفن في مقبرة معروف {cite:muntazam-ibn-al-jawzi j.7 p.183-184}."
  en: "'Ali b. 'Umar Abu'l-Hasan al-Daraqutni (306–385), Baghdad's hafiz, singular of his age: the science of transmitted reports, narrators' names and the hidden defects of hadith ended with him; al-Hakim said al-Daraqutni never saw his own like. As a youth at Isma'il al-Saffar's circle he was rebuked for copying while listening — and recited back eighteen dictated hadiths, isnads and texts in order. The Kitab al-'Ilal current under his name was taken down by al-Barqani from his dictation at Abu Mansur b. Hamdan's gatherings. He died Tuesday 7 Dhu'l-Qa'da 385, buried at Maqbarat Ma'ruf {cite:muntazam-ibn-al-jawzi j.7 p.183-184}."
  ur: "علی بن عمر ابوالحسن دارقطنی (306–385ھ)، بغداد کے حافظ اور اپنے عصر کے یکتا؛ علم آثار، اسماء رجال اور علل حدیث انھی پر ختم ہوا اور حفظ میں منفرد رہے؛ حاکم کہتے تھے دارقطنی نے اپنا مثل نہیں دیکھا۔ جوانی میں اسماعیل صفار کے مجلس میں نقل کرنے پر تنبیہ کی گئی تو انہوں نے فوراً اٹھارہ املا شدہ حدیثیں اسانید و متون سمیت ترتیب سے دہرا دیں؛ کتاب العلل جو ان سے روایت ہے برقانی نے ابو منصور بن حمدان کی مجالس میں ان کے املا سے نقل کی۔ منگل 7 ذوالقعدہ 385ھ کو فوت ہوئے اور مقبرہ معروف میں دفن ہوئے {cite:muntazam-ibn-al-jawzi j.7 p.183-184}۔"
