summary:
  ar: "السلطان مراد الأول (حكم ٧٦١–٧٩١هـ/١٣٦٠–١٣٨٩م)؛ كان شجاعاً مجاهداً كريماً متديناً محباً للنظام متمسكاً به، عادلاً مع رعاياه وجنوده، شغوفاً بالغزوات وبناء المساجد والمدارس والملاجئ، وشكل من خيرة القادة والخبراء مجلساً لشوراه، وتوسع في آسيا الصغرى وأوروبا في وقت واحد. استولى على مدينة أدرنة سنة ٧٦٢هـ/١٣٦٠م وكانت ثاني مدينة في الإمبراطورية البيزنطية بعد القسطنطينية، واتخذها عاصمة للدولة العثمانية منذ سنة ٧٦٨هـ/١٣٦٦م فانتقلت العاصمة إلى أوروبا وأصبحت أدرنة عاصمة إسلامية تتجمع فيها فئات الموظفين وفرق الجيش وعلماء الدين ودور المحاكم. استشهد في معركة قوصوه {cite:dawlat-uthmaniyya-salabi p. 53}."
  en: "Sultan Murad I (r. 1360–1389 CE) — took Adrianople in 1360, moved the Ottoman capital across into Europe in 1366, and was killed at the Battle of Kosovo {cite:dawlat-uthmaniyya-salabi p. 53}."
  ur: "عثمانی سلطان جس کا عہد ادرنہ میں اقتدار کے قیام اور بلقان کی توسیع سے وابستہ تھا؛ کوسوو کی جنگ کے موقع پر وفات پائی۔ {cite:dawlat-uthmaniyya-salabi}"
