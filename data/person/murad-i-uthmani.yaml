summary:
  ar: "السلطان مراد الأول ⁦(حكم ٧٦١–٧٩١هـ/١٣٦٠–١٣٨٩م)⁩؛ كان شجاعاً مجاهداً كريماً متديناً محباً للنظام متمسكاً به، عادلاً مع رعاياه وجنوده، شغوفاً بالغزوات وبناء المساجد والمدارس والملاجئ، وشكل من خيرة القادة والخبراء مجلساً لشوراه، وتوسع في آسيا الصغرى وأوروبا في وقت واحد. استولى على مدينة أدرنة سنة ٧٦٢هـ/١٣٦٠م وكانت ثاني مدينة في الإمبراطورية البيزنطية بعد القسطنطينية، واتخذها عاصمة للدولة العثمانية منذ سنة ٧٦٨هـ/١٣٦٦م فانتقلت العاصمة إلى أوروبا وأصبحت أدرنة عاصمة إسلامية تتجمع فيها فئات الموظفين وفرق الجيش وعلماء الدين ودور المحاكم. استشهد في معركة قوصوه {cite:dawlat-uthmaniyya-salabi p. 53}."
  en: "Sultan Murad I (r. 1360–1389 CE) — took Adrianople in 1360, moved the Ottoman capital across into Europe in 1366, and was killed at the Battle of Kosovo {cite:dawlat-uthmaniyya-salabi p. 53}."
  ur: "عثمانی سلطان جس کا عہد ادرنہ میں اقتدار کے قیام اور بلقان کی توسیع سے وابستہ تھا؛ کوسوو کی جنگ کے موقع پر وفات پائی۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "El sultán Murad I (r. 1360–1389 d. C.) tomó Adrianópolis en 1360, trasladó la capital otomana a Europa en 1366 y murió en la batalla de Kosovo {cite:dawlat-uthmaniyya-salabi p. 53}."
  fr: "Le sultan Murad Ier (r. 1360–1389 CE) — a pris Andrinople en 1360, a déplacé la capitale ottomane en Europe en 1366 et a été tué à la bataille de Kosovo {cite:dawlat-uthmaniyya-salabi p. 53}."
  tr: "Sultan I. Murad (hüküm sürdü 761–791 Hicri / 1360–1389 MS) cesur, soylu, dindar ve düzene bağlıydı; sadece tebaasına ve askerlerine karşı adanmış, baskınlara ve cami, okul ve sığınaklar inşa etmeye tutkuyla bağlıydı. Danışma konseyi için en iyi liderler ve uzmanlardan oluşan bir konsey kurdu ve aynı anda Anadolu'da ve Avrupa'da genişledi. 762 Hicri / 1360 yılında Edirne şehrini ele geçirdi; bu, Konstantinopolis'ten sonra Bizans İmparatorluğu'nun ikinci şehriydi. 768 Hicri / 1366 M.S. arasında burayı Osmanlı İmparatorluğu'nun başkenti yaptı, ardından başkent Avrupa'ya taşındı ve Edirne, çalışanlar, ordu birimleri, dini alimler ve mahkeme binalarının toplandığı İslami bir başkent oldu. Qusuh Muharebesi'nde şehit edildi {cite:dawlat-uthmaniyya-salabi s. 53}."
  id: "Sultan Murad I (memerintah 761–791 H / 1360–1389 M) adalah seorang yang berani, mulia, taat, dan taat serta setia pada ketertiban, hanya dengan rakyatnya dan prajuritnya, yang bersemangat dalam serangan dan pembangunan masjid, sekolah, dan tempat perlindungan. Ia membentuk dewan pemimpin dan ahli terbaik untuk dewan konsultatifnya dan secara bersamaan memperluas wilayah Asia Kecil dan Eropa. Ia merebut kota Edirne pada tahun 762 H / 1360 M, yang merupakan kota kedua di Kekaisaran Bizantium setelah Konstantinopel. Ia menjadikannya ibu kota Kekaisaran Ottoman sejak 768 H / 1366 M, kemudian ibu kota pindah ke Eropa, dan Edirne menjadi ibu kota Islam tempat para pekerja, unit tentara, ulama agama, dan pengadilan berkumpul. Ia gugur dalam Pertempuran Qusuh {cite:dawlat-uthmaniyya-salabi hlm. 53}."
