summary:
  ar: "داعية سعودي من أصل يمني حضرمي، وُلد في سيئون سنة 1972 ونشأ في جدة، وهو باحث في السيرة النبوية ومؤسس مشروع «فاتبعوني» والمدير العام لقناة الإرث النبوي الفضائية ومشرفها العام، التي امتد بثها إلى إندونيسيا باسم نبوي تي في سنة 2014، وله مؤلفات ورحلات دعوية في بلدان كثيرة."
  en: "Saudi preacher of Yemeni Hadrami origin, born in Seiyun in 1972 and raised in Jeddah. A researcher in the Prophetic biography, he founded the Fattabi'uni project and is director-general and general supervisor of the Irtsun Nabawi satellite channel, whose broadcasts extended to Indonesia as Nabawi TV in 2014; he has written books and made preaching journeys in many countries."
  ur: "یمنی حضرمی الاصل سعودی مبلغ، جو 1972 میں سیئون میں پیدا ہوئے اور جدہ میں پروان چڑھے۔ وہ سیرتِ نبوی کے محقق، «فاتبعونی» منصوبے کے بانی اور الارث النبوی سیٹلائٹ چینل کے ڈائریکٹر جنرل اور نگرانِ عام ہیں، جس کی نشریات 2014 میں انڈونیشیا تک «نبوی ٹی وی» کے نام سے پھیلیں۔"
