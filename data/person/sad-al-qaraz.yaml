summary:
  ar: "سعد القرظ، مؤذن رسول الله؛ يروي عنه حفيده عبد الرحمن بن عمار أوصاف أذان بلال وإقامته وصلاة العيدين في عهد النبي، ويروي الزهري أنه كان مؤذناً لأهل قباء فنقله عمر بن الخطاب مؤذناً لمسجد النبي {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}."
  en: "Sa'd al-Qaraz, the Prophet's mu'adhdhin. His grandson 'Abd al-Rahman ibn 'Ammar transmits from him descriptions of Bilal's call to prayer and iqama and of the two festival prayers in the Prophet's time; al-Zuhri reports that he was the mu'adhdhin of Quba until 'Umar ibn al-Khattab moved him to be mu'adhdhin of the Prophet's Mosque {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}."
  ur: "سعد القرظ، رسول اللہ کے مؤذن؛ ان کے پوتے عبد الرحمن بن عمار ان سے بلال کی اذان و اقامت اور عہدِ نبوی میں عیدین کی نماز کی تفصیلات روایت کرتے ہیں، اور زہری کے مطابق وہ اہلِ قبا کے مؤذن تھے یہاں تک کہ عمر بن خطاب نے انہیں مسجدِ نبوی کا مؤذن بنا دیا {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}۔"
  es: "Sa'd al-Qaraz, el muecín del Profeta. Su nieto 'Abd al-Rahman ibn 'Ammar transmite de él descripciones de la llamada a la oración y el iqama de Bilal y de las dos oraciones festivas en tiempos del Profeta; al-Zuhri informa que fue el muecín de Quba hasta que 'Umar ibn al-Khattab lo trasladó para que fuera el muecín de la Mezquita del Profeta {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}."
  fr: "Sa'd al-Qaraz, le muezzin du Prophète. Son petit-fils, 'Abd al-Rahman ibn 'Ammar, nous transmet de lui des descriptions de l'appel à la prière et de l'iqama de Bilal, ainsi que des deux prières des fêtes à l'époque du Prophète; al-Zuhri rapporte qu'il était le muezzin de Quba jusqu'à ce que 'Umar ibn al-Khattab le nomme muezzin de la Mosquée du Prophète {cite: mustadrak-ilmiyya-ata-v3 p. 703-704}."
  tr: "Saad al-Qarz, Allah'ın Resuliyeti'nin müezzi; torunu Abd al-Rahman ibn Ammar, ondan Bilal'in ezan çağrısını, ikametini ve Peygamber'in zamanındaki bayram namazlarını anlatır. El-Zuhri, kendisinin Kuba halkının müezzini olduğunu ve Ömer bin el-Hattab'ın onu müezzin olarak Peygamber Camii'ne gönderdiğini rivayet eder {cite:mustadrak-ilmiyya-ata-v3, s. 703-704}."
  id: "Saad al-Qarz, muezzin Rasulullah; cucunya Abd al-Rahman ibn Ammar, menceritakan darinya deskripsi panggilan salat Bilal, Iqamahnya, dan shalat Idul Fitri pada masa Nabi. Al-Zuhri menceritakan bahwa dia adalah muezzin bagi umat Quba, dan Umar ibn al-Khattab meneruskannya sebagai muezzin ke Masjid Nabi {cite:mustadrak-ilmiyya-ata-v3, hlm. 703-704}."
