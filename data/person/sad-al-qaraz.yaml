summary:
  ar: "سعد القرظ، مؤذن رسول الله؛ يروي عنه حفيده عبد الرحمن بن عمار أوصاف أذان بلال وإقامته وصلاة العيدين في عهد النبي، ويروي الزهري أنه كان مؤذناً لأهل قباء فنقله عمر بن الخطاب مؤذناً لمسجد النبي {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}."
  en: "Sa'd al-Qaraz, the Prophet's mu'adhdhin. His grandson 'Abd al-Rahman ibn 'Ammar transmits from him descriptions of Bilal's call to prayer and iqama and of the two festival prayers in the Prophet's time; al-Zuhri reports that he was the mu'adhdhin of Quba until 'Umar ibn al-Khattab moved him to be mu'adhdhin of the Prophet's Mosque {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}."
  ur: "سعد القرظ، رسول اللہ کے مؤذن؛ ان کے پوتے عبد الرحمن بن عمار ان سے بلال کی اذان و اقامت اور عہدِ نبوی میں عیدین کی نماز کی تفصیلات روایت کرتے ہیں، اور زہری کے مطابق وہ اہلِ قبا کے مؤذن تھے یہاں تک کہ عمر بن خطاب نے انہیں مسجدِ نبوی کا مؤذن بنا دیا {cite:mustadrak-ilmiyya-ata-v3 p. 703-704}۔"
