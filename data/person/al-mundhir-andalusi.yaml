label: { ar: "المنذر بن محمد", en: "al-Mundhir ibn Muhammad", fr: "al-Mundhir ibn Muhammad", es: "al-Mundhir ibn Muhammad", ur: "المنذر بن محمد" }
summary:
  ar: "سابع أمراء بني أمية بقرطبة ⁦(سنة ٢٧٣–٢٧٥هـ)⁩؛ أقام في الملك سنتين إلا نصف شهر وتوفي منتصف صفر سنة ٢٧٥هـ، وفيه قيل: بالمنذر بن محمد صلحت بلاد الأندلس {cite:nafh-tib-maqqari p. 388}."
  en: "Seventh Umayyad emir of Córdoba (AH 273–275) — a two-year reign after which the verse ran 'by al-Mundhir ibn Muhammad the lands of al-Andalus were set right' {cite:nafh-tib-maqqari p. 388}."
  fr: "Septième émir des Omeyyades de Cordoue (273 de l’hégire-275) – un règne de deux ans après lequel le verset a couru « par al-Mundhir ibn Muhammad, les terres d’al-Andalus ont été rétablies  » {cite:nafh-tib-maqqari p. 388}."
  es: "Séptimo emir omeya de Córdoba (AH 273–275) — un reinado de dos años tras el cual se lee el versículo «por al-Mundhir ibn Muhammad las tierras de al-Ándalus fueron enmendadas» {cite:nafh-tib-maqqari p. 388}."
  ur: "قرطبہ کا ساتواں اموی امیر ⁦(ہجری 273-275)⁩ - ایک دو سالہ دور حکومت جس کے بعد یہ آیت چلی کہ 'المنذر بن محمد کے ذریعہ اندلس کی سرزمین کو درست کر دیا گیا'۔ 388}۔"
  tr: "Cordoba'daki yedinci Emevi prensi (273–275 H) olarak yarım ay hariç iki yıl hüküm sürdü ve 275 Hicri Yılı'nın ortasında Sefer ortasında öldü. Onun hakkında şöyle denir: Endülüs, el-Mundhir ibn Muhammed aracılığıyla barıştı {atıf:nafh-tib-maqqari, s. 388}."
  id: "Pangeran Umayyah ketujuh di Cordoba (273–275 H); ia memerintah selama dua tahun kecuali setengah bulan dan meninggal di pertengahan Safar pada tahun 275 H. Dikatakan tentang dirinya: Al-Andalus berdamai melalui al-Mundhir ibn Muhammad {cite:nafh-tib-maqqari, hlm. 388}."
