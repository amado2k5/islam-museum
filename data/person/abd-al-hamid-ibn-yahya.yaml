id: person/abd-al-hamid-ibn-yahya
class: person
label: { ar: "عبد الحميد بن يحيى", en: "Abd al-Hamid ibn Yahya", fr: "Abd al-Hamid ibn Yahya", es: "Abd al-Hamid ibn Yahya", ur: "عبد الحمید بن یحییٰ" }
summary:
  ar: "كاتب مروان بن محمد؛ عند البلاذري كان يقول في صالح بن عبد الرحمن ناقل الديوان لله در صالح ما أعظم منته على الكتاب، وعند السيوطي قتل عبد الحميد الكاتب المشهور ببوصير مع مروان {cite:tarikh-khulafa-minhaj-1434 p. 421}، وكان أولا معلم صبيان ينتقل في البلدان وعنه أخذ المترسلون وبطريقته تزموا وهو الذي سهل سبيل البلاغة في الرسائل واحد دهره وكان من أهل الشام ولرسائله مجموع نحو ألف ورقة {cite:fihrist-ibn-al-nadim p. 170}"
  en: "Marwan ibn Muhammad's scribe; in al-Baladhuri he would say of the diwan's translator Salih ibn Abd al-Rahman: 'God reward Salih — how great his favor to the scribes.'"
  fr: "Secrétaire de Marwan ibn Muhammad ; chez al-Baladhuri, il disait du traducteur du diwan Salih ibn Abd al-Rahman : « Dieu récompense Salih — qu'il est grand, son bienfait envers les secrétaires. »"
  es: "El escriba de Marwan ibn Muhammad; en al-Baladhuri decía del traductor del diwan, Salih ibn Abd al-Rahman: «Dios recompense a Salih; ¡cuán grande es su favor hacia los escribas!»."
  ur: "مروان بن محمد کا کاتب؛ البلادوری میں وہ دیوان کے مترجم صالح بن عبدالرحمٰن کے بارے میں کہیں گے: 'خدا صالح کو جزائے خیر دے - کاتبوں پر اس کا کتنا بڑا احسان ہے۔'"
  tr: "Mervan ibn Muhammed'in kâtibi; el-Baladhuri'ye göre, Divan'ın nakledicisi Salih ibn Abdülrahman hakkında şöyle derdi: \"Allah Salih'i mükafatlandırsın, kâtibe ne büyük bir lütuf!\" Ve el-Suyuti'ye göre, Busir olarak bilinen ünlü kâtip Abdülhamid, Mervan ile birlikte öldürüldü {kaynak:tarikh-khulafa-minhaj-1434 s. 421}. Başlangıçta farklı ülkelere seyahat eden erkek çocuklara öğretmenlik yapıyordu ve ondan mektup yazarları öğrendiler ve onun yöntemine alıştılar. Mektuplarda belagat yolunu kolaylaştıran ve zamanında eşsiz olan kişiydi. Levant halkındandı ve mektupları yaklaşık bin sayfalık bir derlemede toplandı {kaynak:fihrist-ibn-al-nadim s. 170}."
  id: "Marwan ibn Muhammad adalah juru tulisnya; menurut al-Baladhuri, ia biasa berkata tentang Salih ibn Abd al-Rahman, perawi Diwan, \"Semoga Allah membalas Salih, betapa besar nikmat-Nya kepada juru tulis!\" Dan menurut al-Suyuti, Abd al-Hamid, juru tulis terkenal yang dikenal sebagai Busir, terbunuh bersama Marwan {cite:tarikh-khulafa-minhaj-1434 hlm. 421}. Awalnya ia adalah seorang guru bagi anak laki-laki yang bepergian ke berbagai negara, dan darinya para penulis surat belajar dan dengan metodenya mereka menjadi terbiasa. Dialah yang mempermudah jalan kefasihan dalam menulis, dan ia unik pada zamannya. Ia berasal dari penduduk Levant, dan surat-suratnya dikumpulkan dalam sebuah koleksi sekitar seribu halaman {cite:fihrist-ibn-al-nadim hlm. 170}"
