label: { ar: "عبد الحميد بن يحيى", en: "Abd al-Hamid ibn Yahya" }
summary:
  ar: "كاتب مروان بن محمد؛ عند البلاذري كان يقول في صالح بن عبد الرحمن ناقل الديوان لله در صالح ما أعظم منته على الكتاب، وعند السيوطي قتل عبد الحميد الكاتب المشهور ببوصير مع مروان {cite:tarikh-khulafa-minhaj-1434 p. 421}، وكان أولا معلم صبيان ينتقل في البلدان وعنه أخذ المترسلون وبطريقته تزموا وهو الذي سهل سبيل البلاغة في الرسائل واحد دهره وكان من أهل الشام ولرسائله مجموع نحو ألف ورقة {cite:fihrist-ibn-al-nadim p. 170}"
  en: "Marwan ibn Muhammad's scribe; in al-Baladhuri he would say of the diwan's translator Salih ibn Abd al-Rahman: 'God reward Salih — how great his favor to the scribes.'"
