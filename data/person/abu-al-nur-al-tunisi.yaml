summary:
  ar: "الشيخ أبو النور التونسي نزيل مكة؛ أقام من طفولته إلى خمس وثلاثين سنة وهو في وجد وشوق ووجل وهيبة من الله حتى كاد الهلع يقتله، وضرب لذلك سياطاً وطال له العقل؛ وكان في كل خمسة عشر يوماً يختم القرآن في الثلثين ويصوم إلى الأبد، وكان طاهراً حتى قيل ما يمشي في الشمس ولا يقف على ظله؛ توفي في رمضان سنة إحدى وثلاثين وتسعمائة {cite:shadharat-dhahab p. 573-574}."
  en: "The Tunisian mujawir of Mecca — thirty-five years 'in rapture and longing and awe of God' until fear nearly killed him and his mind wore out; a khatma every fifteen days in two-thirds readings, perpetual fasting, so pure 'they said he never trod the sun'; died Ramadan 931 {cite:shadharat-dhahab p. 573-574}."
