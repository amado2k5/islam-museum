summary:
  ar: "الشيخ أبو النور التونسي نزيل مكة؛ أقام من طفولته إلى خمس وثلاثين سنة وهو في وجد وشوق ووجل وهيبة من الله حتى كاد الهلع يقتله، وضرب لذلك سياطاً وطال له العقل؛ وكان في كل خمسة عشر يوماً يختم القرآن في الثلثين ويصوم إلى الأبد، وكان طاهراً حتى قيل ما يمشي في الشمس ولا يقف على ظله؛ توفي في رمضان سنة إحدى وثلاثين وتسعمائة {cite:shadharat-dhahab p. 573-574}."
  en: "The Tunisian mujawir of Mecca — thirty-five years 'in rapture and longing and awe of God' until fear nearly killed him and his mind wore out; a khatma every fifteen days in two-thirds readings, perpetual fasting, so pure 'they said he never trod the sun'; died Ramadan 931 {cite:shadharat-dhahab p. 573-574}."
  fr: "Le résident tunisien de La Mecque — trente-cinq ans « dans le ravissement, la nostalgie et la crainte révérencielle de Dieu », jusqu'à ce que la peur faillît le tuer et que son esprit s'usât ; une lecture complète tous les quinze jours en lectures des deux tiers, un jeûne perpétuel, si pur « qu'on disait qu'il ne marchait jamais au soleil » ; mort en ramadan 931 {cite:shadharat-dhahab p. 573-574}."
  es: "El muyawir tunecino de La Meca — treinta y cinco años 'en éxtasis, anhelo y reverencia a Dios' hasta que el miedo casi lo mató y su mente se agotó; un khatma cada quince días en dos tercios de lecturas, ayuno perpetuo, tan puro 'que decían que nunca había pisado el sol'; murió en Ramadán de 931 {cita: shadharat-dhahab pág. 573-574}."
  ur: "مکہ کا تیونس کا مجاور - پینتیس سال 'خوف، آرزو اور خوف خدا میں' یہاں تک کہ خوف نے اسے ہلاک کر دیا اور اس کا دماغ ختم ہو گیا۔ ایک خاتمہ ہر پندرہ دن میں دو تہائی پڑھنے میں، دائمی روزہ، اتنا خالص 'انہوں نے کہا کہ اس نے کبھی سورج کو نہیں روندا'؛ وصال رمضان 931 {حوالہ: شدّرت ذہب ص۔ 573-574}۔"
  tr: "Mekke'de yaşayan Şeyh Ebu el-Nur el-Tunisi, çocukluğundan otuz beş yaşına kadar Allah'a duyduğu özlem, korku ve huşu içinde yaşadı; bu durum onu neredeyse öldürecek kadar bunaltıcıydı. Bu yüzden kırbaçlandı ve zihni uzatıldı. Her on beş günde bir Kur'an'ın üçte ikisini okur ve ömür boyu oruç tutardı. O kadar temizdi ki, güneşte yürümediği ve kendi gölgesinde bile durmadığı söylenirdi. 931 yılında Ramazan ayında vefat etti. {kaynak: Şadharat-dahab s. 573-574}"
  id: "Syekh Abu Al-Nour Al-Tunisi, seorang penduduk Mekah, hidup sejak kecil hingga usia tiga puluh lima tahun dalam keadaan rindu, takut, dan kagum kepada Tuhan, hingga kepanikan hampir membunuhnya. Ia dicambuk karena hal ini dan pikirannya diperpanjang. Setiap lima belas hari ia menyelesaikan dua pertiga Al-Qur'an dan berpuasa selamanya. Ia begitu suci sehingga dikatakan bahwa ia tidak akan berjalan di bawah sinar matahari atau berdiri di atas bayangannya sendiri. Ia meninggal di bulan Ramadan tahun 931. {cite:shadharat-dhahab p. 573-574}"
