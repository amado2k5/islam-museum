summary:
  ar: "أبو إسحاق إبراهيم الساحلي الغرناطي، شاعر ومعماري أندلسي بدأ حياته موثقاً في غرناطة، ثم لقي منسا موسى في الحج وعاد معه إلى مالي مستشاراً ومهندساً. تذكر دائرة المعارف الإسلامية أنه بنى للملك قصراً في العاصمة ربما كانت نياني، وربما المسجد الجامع في تنبكتو، ويُنسب إليه إدخال الطراز المعماري السوداني. استقر في تنبكتو وتوفي فيها سنة 747هـ/1346م {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  en: "Abu Ishaq Ibrahim al-Sahili al-Gharnati was an Andalusian poet and architect who began as a notary in Granada, met Mansa Musa on the pilgrimage and returned with him to Mali as adviser and architect. The Encyclopaedia of Islam says he built a palace for the king in the capital, probably Niani, perhaps the great mosque of Timbuktu, and is credited with introducing the Sudanese style of architecture. He settled in Timbuktu and died there in 747/1346 {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  ur: "ابو اسحاق ابراہیم الساحلی الغرناطی اندلسی شاعر اور معمار تھے جنہوں نے غرناطہ میں نوٹری کے طور پر کام شروع کیا، حج کے موقع پر منسا موسیٰ سے ملے اور ان کے ساتھ مشیر اور معمار بن کر مالی گئے۔ دائرۃ المعارف الاسلامیہ کے مطابق انہوں نے بادشاہ کے لیے دارالحکومت میں، جو غالباً نیانی تھا، ایک محل بنایا، شاید تمبکتو کی جامع مسجد بھی، اور سوڈانی طرزِ تعمیر متعارف کرانے کا سہرا انہی کے سر باندھا جاتا ہے۔ وہ تمبکتو میں آباد ہوئے اور وہیں 747ھ/1346ء میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
