summary:
  ar: "أبو إسحاق إبراهيم الساحلي الغرناطي، شاعر ومعماري أندلسي بدأ حياته موثقاً في غرناطة، ثم لقي منسا موسى في الحج وعاد معه إلى مالي مستشاراً ومهندساً. تذكر دائرة المعارف الإسلامية أنه بنى للملك قصراً في العاصمة ربما كانت نياني، وربما المسجد الجامع في تنبكتو، ويُنسب إليه إدخال الطراز المعماري السوداني. استقر في تنبكتو وتوفي فيها سنة 747هـ/1346م {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  en: "Abu Ishaq Ibrahim al-Sahili al-Gharnati was an Andalusian poet and architect who began as a notary in Granada, met Mansa Musa on the pilgrimage and returned with him to Mali as adviser and architect. The Encyclopaedia of Islam says he built a palace for the king in the capital, probably Niani, perhaps the great mosque of Timbuktu, and is credited with introducing the Sudanese style of architecture. He settled in Timbuktu and died there in 747/1346 {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  ur: "ابو اسحاق ابراہیم الساحلی الغرناطی اندلسی شاعر اور معمار تھے جنہوں نے غرناطہ میں نوٹری کے طور پر کام شروع کیا، حج کے موقع پر منسا موسیٰ سے ملے اور ان کے ساتھ مشیر اور معمار بن کر مالی گئے۔ دائرۃ المعارف الاسلامیہ کے مطابق انہوں نے بادشاہ کے لیے دارالحکومت میں، جو غالباً نیانی تھا، ایک محل بنایا، شاید تمبکتو کی جامع مسجد بھی، اور سوڈانی طرزِ تعمیر متعارف کرانے کا سہرا انہی کے سر باندھا جاتا ہے۔ وہ تمبکتو میں آباد ہوئے اور وہیں 747ھ/1346ء میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  fr: "Abu Ishaq Ibrahim al-Sahili al-Gharnati était un poète et architecte andalou qui commença comme notaire à Grenade, rencontra Mansa Musa lors du pèlerinage et revint avec lui au Mali comme conseiller et architecte. L'Encyclopaedia of Islam dit qu'il bâtit un palais pour le roi dans la capitale, probablement Niani, peut-être la grande mosquée de Tombouctou, et on lui attribue l'introduction du style architectural soudanais. Il s'établit à Tombouctou et y mourut en 747/1346 {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  es: "Abu Ishaq Ibrahim al-Sahili al-Gharnati fue un poeta y arquitecto andalusí que comenzó su carrera como notario en Granada, conoció a Mansa Musa durante la peregrinación y regresó con él a Malí como consejero y arquitecto. La Enciclopedia del Islam afirma que construyó un palacio para el rey en la capital, probablemente Niani, tal vez la gran mezquita de Tombuctú, y se le atribuye la introducción del estilo arquitectónico sudanés. Se estableció en Tombuctú y murió allí en 747/1346 {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  tr: "Ebu İshak İbrahim el-Sahili el-Garnati, hayatına Granada'da noter olarak başlayan Endülüslü bir şair ve mimardı. Daha sonra Hac ibadeti sırasında Mansa Musa ile tanıştı ve onunla birlikte danışman ve mühendis olarak Mali'ye döndü. İslam Ansiklopedisi, başkentte (muhtemelen Niane'de) kral için bir saray ve muhtemelen Timbuktu Ulu Camii'ni inşa ettiğini belirtir. Sudan mimari tarzını tanıttığı kabul edilir. Timbuktu'ya yerleşti ve 747 Hicri/1346 Miladi yılında orada öldü. {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
  id: "Abu Ishaq Ibrahim al-Sahili al-Gharnati adalah seorang penyair dan arsitek Andalusia yang memulai hidupnya sebagai notaris di Granada. Ia kemudian bertemu Mansa Musa selama ibadah haji dan kembali bersamanya ke Mali sebagai penasihat dan insinyur. Ensiklopedia Islam menyebutkan bahwa ia membangun istana untuk raja di ibu kota, kemungkinan Niane, dan kemungkinan Masjid Agung Timbuktu. Ia dianggap sebagai orang yang memperkenalkan gaya arsitektur Sudan. Ia menetap di Timbuktu dan meninggal di sana pada tahun 747 H/1346 M. {cite:encyclopaedia-of-islam-2 vol. 9 p. 782; vol. 6 p. 278}."
