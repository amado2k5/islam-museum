  note: "Born on 13 July 1880 at Banikunja, Diardhangara, Sirajganj, Pabna District: the day and month are given by the English article; Banglapedia gives only the year 1880 and the district, from which he took the suffix Siraji. His father was Syed Abdul Karim Khandkar (1856–1924), recorded by Banglapedia as a practitioner of Unani medicine who was not financially well off and by the English article also as a police sub-inspector. The Hijri year (1297) is derived by tabular conversion (13 July 1880 falls in Ramadan 1297). Sirajganj has no museum place entity yet, so no born_in relation is written."
