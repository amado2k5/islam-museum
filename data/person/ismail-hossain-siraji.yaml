summary:
  ar: "كاتب وشاعر وخطيب بنغالي (1880-1931) من سراج غنج، من أبرز أقلام نهضة مسلمي البنغال. عاش من الكتابة والخطابة، وحظرت الحكومة كتابه الأول «أنال براباها» وسُجن سنة 1910، وسافر سنة 1912 مع بعثة طبية إلى القوات العثمانية في حروب البلقان، وأسس جمعية علماء البنغال، ودعا إلى التعليم الحديث والوحدة الهندوسية الإسلامية، وقاد حركة الفلاحين ضد ملّاك الأرض والمرابين."
  en: "Bengali writer, poet and orator (1880–1931) of Sirajganj, a key author of the Bengali Muslim reawakening. He lived by writing and public speaking; the government banned his first book Anal-Prabaha and imprisoned him in 1910; in 1912 he joined a medical mission to the Ottoman forces in the Balkan Wars; he co-founded the Anjuman-i-Ulama-i-Bangala, advocated modern education and Hindu–Muslim unity, and led the peasant movement against zamindars and moneylenders."
  ur: "بنگالی مصنف، شاعر اور مقرر ⁦(1880ء–1931ء)⁩ جن کا تعلق سراج گنج سے تھا اور جو بنگالی مسلمانوں کی نشاۃِ ثانیہ کے نمایاں قلم کار تھے۔ انھوں نے لکھنے اور تقریر سے روزی کمائی؛ حکومت نے ان کی پہلی کتاب «انل پرباہا» ضبط کی اور 1910ء میں انھیں قید کیا؛ 1912ء میں وہ بلقان جنگوں میں عثمانی افواج کے لیے طبی وفد کے ساتھ گئے؛ انجمنِ علمائے بنگالہ کے بانیوں میں شامل ہوئے اور ہندو مسلم اتحاد اور کسان تحریک کی قیادت کی۔"
  es: "Escritor, poeta y orador bengalí (1880-1931) de Sirajganj, figura clave del renacimiento musulmán bengalí. Vivió de la escritura y la oratoria; el gobierno prohibió su primer libro, Anal-Prabaha, y lo encarceló en 1910; en 1912 se unió a una misión médica para las fuerzas otomanas en las guerras de los Balcanes; cofundó la Anjuman-i-Ulama-i-Bangala, abogó por la educación moderna y la unidad hindú-musulmana, y lideró el movimiento campesino contra los zamindares y los prestamistas."
  fr: "Écrivain, poète et orateur bengali (1880-1931) originaire de Sirajganj, figure majeure du renouveau musulman bengali. Il vivait de l'écriture et de ses discours publics; son premier ouvrage, Anal-Prabaha, fut interdit par le gouvernement et il fut emprisonné en 1910; en 1912, il rejoignit une mission médicale auprès des forces ottomanes pendant les guerres balkaniques; il co-fonda l'Anjuman-i-Ulama-i-Bangala, défendit l'éducation moderne et l'unité hindou-musulmane, et mena le mouvement paysan contre les zamindars et les usuriers."
  tr: "Siraj Ganj'dan Bengalli bir yazar, şair ve hatip (1880-1931) olan bir Bengal Müslüman Rönesansı'nın en önde gelen figürlerinden biriydi. Yazma ve hitabetle geçiniyordu; hükümet ilk kitabı 'Anal Prabha'yı yasakladı ve 1910'da hapse atıldı. 1912'de Balkan savaşları sırasında Osmanlı kuvvetlerine tıbbi bir misyonla seyahat etti, Bengal Bilginleri Derneği'ni kurdu, modern eğitim ve Hindu-İslam birliğini savundu ve toprak sahipleri ile tefecilere karşı köylü hareketine liderlik etti."
  id: "Seorang penulis, penyair, dan orator Bengali (1880-1931) dari Siraj Ganj, salah satu tokoh paling menonjol dalam Renaisans Muslim Bengali. Ia hidup dengan menulis dan pidato; pemerintah melarang buku pertamanya, 'Anal Prabha,' dan ia dipenjara pada tahun 1910. Pada tahun 1912, ia melakukan perjalanan dengan misi medis ke pasukan Ottoman selama perang Balkan, mendirikan Asosiasi Cendekiawan Bengal, mengadvokasi pendidikan modern dan persatuan Hindu-Islam, serta memimpin gerakan petani melawan pemilik tanah dan rensien."
