summary:
  ar: "كاتب وشاعر وخطيب بنغالي (1880-1931) من سراج غنج، من أبرز أقلام نهضة مسلمي البنغال. عاش من الكتابة والخطابة، وحظرت الحكومة كتابه الأول «أنال براباها» وسُجن سنة 1910، وسافر سنة 1912 مع بعثة طبية إلى القوات العثمانية في حروب البلقان، وأسس جمعية علماء البنغال، ودعا إلى التعليم الحديث والوحدة الهندوسية الإسلامية، وقاد حركة الفلاحين ضد ملّاك الأرض والمرابين."
  en: "Bengali writer, poet and orator (1880–1931) of Sirajganj, a key author of the Bengali Muslim reawakening. He lived by writing and public speaking; the government banned his first book Anal-Prabaha and imprisoned him in 1910; in 1912 he joined a medical mission to the Ottoman forces in the Balkan Wars; he co-founded the Anjuman-i-Ulama-i-Bangala, advocated modern education and Hindu–Muslim unity, and led the peasant movement against zamindars and moneylenders."
  ur: "بنگالی مصنف، شاعر اور مقرر (1880ء–1931ء) جن کا تعلق سراج گنج سے تھا اور جو بنگالی مسلمانوں کی نشاۃِ ثانیہ کے نمایاں قلم کار تھے۔ انھوں نے لکھنے اور تقریر سے روزی کمائی؛ حکومت نے ان کی پہلی کتاب «انل پرباہا» ضبط کی اور 1910ء میں انھیں قید کیا؛ 1912ء میں وہ بلقان جنگوں میں عثمانی افواج کے لیے طبی وفد کے ساتھ گئے؛ انجمنِ علمائے بنگالہ کے بانیوں میں شامل ہوئے اور ہندو مسلم اتحاد اور کسان تحریک کی قیادت کی۔"
