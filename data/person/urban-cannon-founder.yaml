summary:
  ar: "أوربان، مهندس مجري كان بارعاً في صناعة المدافع؛ أحضره السلطان محمد الفاتح فأحسن استقباله ووفر له الإمكانيات المالية والبشرية، فصمم ونفذ عدداً من المدافع الضخمة كان على رأسها المدفع السلطاني المشهور الذي قيل إن وزنه بلغ مئات الأطنان ويحتاج إلى مئات الثيران لتحريكه، وأشرف السلطان بنفسه على صناعتها وتجريبها {cite:dawlat-uthmaniyya-salabi p. 92}. وينقل الصلابي أن المدفع السلطاني الضخم انفجر من كثرة الاستخدام في أيام الحصار الأخيرة فقتل المشتغلين به وعلى رأسهم أوربان نفسه {cite:dawlat-uthmaniyya-salabi p. 104}."
  en: "Orban, the Hungarian engineer skilled in cannon-founding whom Mehmed II welcomed and funded; he designed the giant guns topped by the famous Sultan's cannon — said in the book to weigh hundreds of tons and need hundreds of oxen to move — with the sultan supervising their making and testing himself {cite:dawlat-uthmaniyya-salabi p. 92}. Al-Salabi reports that the great cannon burst from overuse in the siege's last days, killing its crew and Orban at their head {cite:dawlat-uthmaniyya-salabi p. 104}."
