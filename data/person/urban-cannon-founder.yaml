roles: [craftsman]
summary:
  ar: "أوربان، مهندس مجري كان بارعاً في صناعة المدافع؛ أحضره السلطان محمد الفاتح فأحسن استقباله ووفر له الإمكانيات المالية والبشرية، فصمم ونفذ عدداً من المدافع الضخمة كان على رأسها المدفع السلطاني المشهور الذي قيل إن وزنه بلغ مئات الأطنان ويحتاج إلى مئات الثيران لتحريكه، وأشرف السلطان بنفسه على صناعتها وتجريبها {cite:dawlat-uthmaniyya-salabi p. 92}. وينقل الصلابي أن المدفع السلطاني الضخم انفجر من كثرة الاستخدام في أيام الحصار الأخيرة فقتل المشتغلين به وعلى رأسهم أوربان نفسه {cite:dawlat-uthmaniyya-salabi p. 104}."
  en: "Orban, the Hungarian engineer skilled in cannon-founding whom Mehmed II welcomed and funded; he designed the giant guns topped by the famous Sultan's cannon — said in the book to weigh hundreds of tons and need hundreds of oxen to move — with the sultan supervising their making and testing himself {cite:dawlat-uthmaniyya-salabi p. 92}. Al-Salabi reports that the great cannon burst from overuse in the siege's last days, killing its crew and Orban at their head {cite:dawlat-uthmaniyya-salabi p. 104}."
  es: "Orban, el ingeniero húngaro experto en la fundición de cañones, a quien Mehmed II acogió y financió, diseñó los gigantescos cañones coronados por el famoso cañón del sultán —que, según el libro, pesaba cientos de toneladas y requería cientos de bueyes para moverlo—, con el sultán supervisando su fabricación y probándolo personalmente {cite:dawlat-uthmaniyya-salabi p. 92}. Al-Salabi relata que el gran cañón estalló por el uso excesivo en los últimos días del asedio, matando a su dotación y a Orban en el acto {cite:dawlat-uthmaniyya-salabi p. 104}."
  fr: "Orban, l'ingénieur hongrois expert en fonderie de canons, accueilli et financé par Mehmed II, conçut les canons géants surmontés du célèbre canon du Sultan — dont le livre dit qu'il pesait des centaines de tonnes et nécessitait des centaines de bœufs pour être déplacé — sous la supervision du sultan lui-même, qui en testa les travaux {cite:dawlat-uthmaniyya-salabi p. 92}. Al-Salabi rapporte que le grand canon explosa sous l'effet d'une utilisation excessive durant les derniers jours du siège, tuant son équipage et Orban à leur tête {cite:dawlat-uthmaniyya-salabi p. 104}."
  ur: "اوربان، ہنگری کا انجینئر تھا جو توپ چلانے میں ماہر تھا جس کا محمد دوم نے خیرمقدم کیا اور مالی امداد کی۔ اس نے مشہور سلطان کی توپ کے اوپر دیو ہیکل بندوقوں کو ڈیزائن کیا - کتاب میں کہا گیا ہے کہ سینکڑوں ٹن وزنی ہے اور اسے چلنے کے لئے سیکڑوں بیلوں کی ضرورت ہے - سلطان ان کے بنانے اور خود کو جانچنے کی نگرانی کرتا تھا۔ 92}۔ السلبی نے رپورٹ کیا ہے کہ محاصرے کے آخری دنوں میں بہت زیادہ استعمال کی وجہ سے بڑی توپ پھٹ گئی، جس سے اس کا عملہ اور اوربان ان کے سر پر مارے گئے۔ 104}۔"
  tr: "Urban, top üretiminde yetenekli bir Macar mühendisti; Fatih Sultan Mehmed onu getirdi ve sıcak bir şekilde karşıladı, maddi ve insan kaynakları sağladı. Birçok devasa top tasarlayıp inşa etti; bunların başında yüzlerce ton ağırlığında olduğu ve taşınması için yüzlerce öküz gerektirdiği söylenen ünlü Sultan'ın topu yer alıyordu. Sultan, bunların üretimini ve testini şahsen denetledi {cite:dawlat-uthmaniyya-salabi s. 92}. Al-Sallabi, devasa kraliyet topunun kuşatmanın son günlerinde sık kullanılması nedeniyle patladığını, üzerinde çalışanların ölümüne yol açtığını ve Urban'ın bizzat liderliğinde olduğunu bildirir {cite:dawlat-uthmaniyya-salabi s. 104}."
  id: "Urban adalah insinyur Hungaria yang mahir dalam pembuatan meriam; Sultan Mehmed Sang Penakluk membawanya masuk dan menyambutnya dengan hangat, memberinya sumber daya keuangan dan manusia. Ia merancang dan membangun sejumlah meriam raksasa, terutama meriam Sultan yang terkenal, yang dikatakan memiliki berat ratusan ton dan membutuhkan ratusan sapi untuk dipindahkan. Sultan secara pribadi mengawasi pembuatan dan pengujian {cite:dawlat-uthmaniyya-salabi hlm. 92}. Al-Sallabi melaporkan bahwa meriam kerajaan besar itu meledak karena sering digunakan selama hari-hari terakhir pengepungan, membunuh mereka yang mengerjakannya, yang dipimpin oleh Urban sendiri {cite:dawlat-uthmaniyya-salabi hlm. 104}."
