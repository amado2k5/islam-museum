summary:
  ar: "صوفي عراقي صاحب «المواقف والمخاطبات»؛ يقول مصطفى محمود إن تفصيل حياته غير معروف، وإنه عاش في القرن الرابع بعد الهجرة في بلدة نفّار بالعراق، وكان يتعشق الخلوات وقضى أكثر عمره في التعبد والتأمل {cite:mm-raaytu-allah-maarif-1976 p. 20}."
  en: "Iraqi Sufi, author of al-Mawaqif wa-l-Mukhatabat; Mostafa Mahmoud writes that the details of his life are unknown, that he lived in the fourth century after the Hijra in the town of Niffar in Iraq, loved solitary retreat and spent most of his life in worship and contemplation {cite:mm-raaytu-allah-maarif-1976 p. 20}."
  ur: "عراقی صوفی، «المواقف والمخاطبات» کے مصنف؛ مصطفیٰ محمود لکھتے ہیں کہ ان کی زندگی کی تفصیل معلوم نہیں، وہ ہجرت کے بعد چوتھی صدی میں عراق کے قصبے نفّار میں رہے، خلوت کے دلدادہ تھے اور زیادہ تر عمر عبادت اور غور و فکر میں گزاری {cite:mm-raaytu-allah-maarif-1976 p. 20}۔"
