id: person/ibrahim-ibn-al-mahdi
class: person
label: { ar: "إبراهيم بن المهدي" }
summary:
  ar: "بايعه أهل بغداد بالخلافة في المحرم سنة اثنتين ومائتين، بعد أن دُعي لذلك في آخر سنة إحدى ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.555} {cite:tabari-tarikh-abu-al-fadl j.8 p.557}. وفي سنة ثلاث ومائتين خلعه أهل بغداد، ثم اختفى {cite:tabari-tarikh-abu-al-fadl j.8 p.570} {cite:tabari-tarikh-abu-al-fadl j.8 p.571}.، وعند المسعودي استزاره الرشيد بالرقة فوضع جام قريص سمك قام بأكثر من ألف درهم فحلف الرشيد ألا يطعم شيئاً دون أن يحضره فأمر بالتصدق به ودفع الجام إلى أول سائل، وروى مزاحه معه على ظهر حراقة حين سأله ما أسمج الأسماء فقال إبراهيم لما لقي أهله من القتل والخلع، فهتف ملاح بأعلى صوته يا إبراهيم {cite:muruj-al-dhahab p. 350-351}"
gender: male
