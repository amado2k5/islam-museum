id: person/ibrahim-ibn-al-mahdi
class: person
label: { ar: "إبراهيم بن المهدي" }
summary:
  ar: "بايعه أهل بغداد بالخلافة في المحرم سنة اثنتين ومائتين، بعد أن دُعي لذلك في آخر سنة إحدى ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.555} {cite:tabari-tarikh-abu-al-fadl j.8 p.557}. وفي سنة ثلاث ومائتين خلعه أهل بغداد، ثم اختفى {cite:tabari-tarikh-abu-al-fadl j.8 p.570} {cite:tabari-tarikh-abu-al-fadl j.8 p.571}. وعند المسعودي استزاره الرشيد بالرقة فوضع جام قريص سمك قام بأكثر من ألف درهم فحلف الرشيد ألا يطعم شيئاً دون أن يحضره فأمر بالتصدق به ودفع الجام إلى أول سائل، وروى مزاحه معه على ظهر حراقة حين سأله ما أسمج الأسماء فقال إبراهيم لما لقي أهله من القتل والخلع، فهتف ملاح بأعلى صوته يا إبراهيم {cite:muruj-al-dhahab p. 350-351}، وهجاه المأمون وكان يظهر التشيع وابن شكلة التسنن فقال إذا المرجي سرك أن تراه يموت لحينه من قبل موته نجدد عنده ذكرى علي، فرد إذا الشيعي جمجم في مقال فسرك أن يبوح بذات نفسه نصل على النبي وصاحبيه {cite:muruj-al-dhahab p. 399-400}، وروى عن نفسه للمأمون أنه غنى طفيلياً في مجمع حتى أذعنه صاحب المنزل بجاريه وقال ما بقي غير أمي وأختي ولأنزلنهما إليك فكانت صاحبته الأخت فزوجه إياها وأمهرها عنه عشرين ألف درهم فصار الرجل من خواص المأمون {cite:muruj-al-dhahab p. 407-408}، ومن خبر اختفائه ببغداد أنه لجأ إلى حجام أسود فآواه وأطعمه بما لم تقع عليه يده ثم استأذنه أن يغنيه واقترح عليه ثلاثة أصوات أتقدم فيها عن كل من غنى وقال أنا أخدم إسحاق بن إبراهيم الموصلي، وأبى أن يأخذ شيئاً من دنانيره {cite:muruj-al-dhahab p. 425-426}"
  tr: "Bağdat halkı, 201 yılının sonunda çağrıldıktan sonra 202 yılında Muharrem'de ona halife olarak bağlılık yemini etti {cite:tabari-tarikh-abu-al-fadl j.8 s.555} {cite:tabari-tarikh-abu-al-fadl j.8 s.557}. 203 yılında Bağdat halkı onu tahttan indirdi, ardından ortadan kayboldu {cite:tabari-tarikh-abu-al-fadl j.8 s.570} {cite:tabari-tarikh-abu-al-fadl j.8 s.571}. El-Reşid Rakka'da ona yalvardı, bu yüzden bin dirhemden fazla olan bir kase balık koydu. El-Reşid, getirmeden hiçbir şeyi beslemeyeceğine yemin etti, bu yüzden sadaka olarak verilmesini emretti ve reçeli ilk dilenciye verdi. Bir harakanın arkasında ona hangi isimleri vermesi gerektiğini sorduğunda onunla yaptığı şakayı anlattı. İbrahim, 'Ailesi öldürülüp soyulduğunda,' tekne yüksek sesle 'Ey İbrahim' diye bağırdı. Muruj-al-Dhahab s. 350-351} ve el-Me'mun, Şii gibi görünen onu hicvetti, İbn Şaka ise Sünni İslam'ı takip etti. Dedi ki: Eğer Murji onun ölümünden önce ölmesini görmekten memnunsa, Ali'nin anısını yenileyeceğiz. O da şöyle cevap verdi: 'Şii bir makalede kafasını sıyıp kendini ortaya çıkarırsa, Peygamber ve iki sahabesine karşı namaz kılıyoruz.' {alıntı:Muruj-al-Dhahab s. 399-400}. Kendisi hakkında el-Ma'mun'a, bir toplantıda parazit olarak şarkı söylediğini anlattı; ev sahibi teslim olana kadar şöyle dedi: 'Annem ve kız kardeşimden başka hiçbir şey kalmadı, onları sana göndereceğim.' Yoldaşı onun kardeşiydi, bu yüzden onunla evlendi ve çeyizini verdi. ondan yirmi bin dirhem aldı, böylece adam el-Memun'un yakın dostlarından biri oldu {atıf:Muruj-al-Dhahab s. 407-408}. Bağdat'ta kaybolduğu haberinden sonra, ona sığınan ve ulaşamadığı şeyleri yediren siyah bir berbere sığındı, ardından şarkı söylemek için izin istedi ve kendisine üç ses önerdi; bu seslerle şarkı söyleyenlerden önce gelecekti: Ben İshaq ibn İbrahim el-Mawsili'nin hizmetkarıyım ve onun dinarlarından hiçbirini almayı reddetti {cite:muruj-al-dhahab s. 425-426}"
  id: "Rakyat Baghdad bersumpah setia kepadanya sebagai khalifah di Muharram pada tahun 202, setelah ia dipanggil untuk itu pada akhir tahun 201 {cite:tabari-tarikh-abu-al-fadl j.8 hlm.555} {cite:tabari-tarikh-abu-al-fadl j.8 hlm.557}. Pada tahun 203, rakyat Baghdad menggulingkannya, lalu ia menghilang {cite:tabari-tarikh-abu-al-fadl j.8 hlm.570} {cite:tabari-tarikh-abu-al-fadl j.8 hlm.571}. Al-Rashid memohon kepadanya di Raqqa, sehingga ia meletakkan semangkuk ikan yang harganya lebih dari seribu dirham. Al-Rashid bersumpah tidak akan memberi makan apa pun tanpa membawanya, sehingga ia memerintahkan agar ikan itu diberikan sebagai amal dan menyerahkan selai itu kepada pengemis pertama. Ia menceritakan leluconnya di atas sebuah haraqa ketika ia bertanya nama apa yang harus disebutkan. Ibrahim berkata, 'Ketika keluarganya dibunuh dan dilucuti pakaian,' perahu itu berteriak keras, 'Wahai Ibrahim' {cite: Muruj-al-dhahab hlm. 350-351}, dan al-Ma'mun menyindir dia, yang tampak Syiah, dan Ibn Shakla mengikuti Islam Sunni. Ia berkata: Jika Murji senang melihatnya meninggal sebelum kematiannya, kita akan memperbarui ingatan tentang Ali di hadapannya. Ia menjawab, 'Jika Syiah memukul tengkorak dalam sebuah artikel dan menjelaskannya untuk mengungkapkan dirinya, kami berdoa melawan Nabi dan dua sahabatnya.' {cite:muruj-al-dhahab hlm. 399-400}. Ia menceritakan tentang dirinya kepada al-Ma'mun bahwa ia bernyanyi sebagai parasit dalam sebuah pertemuan sampai pemilik rumah tunduk, berkata: 'Tidak ada yang tersisa selain ibu dan saudariku, dan aku akan mengirim mereka kepada kalian.' Temannya adalah saudara perempuannya, maka ia menikahinya dan memberikan mas kawin. dari dia dua puluh ribu dirham, sehingga pria itu menjadi salah satu rekan dekat al-Ma'mun {cite:muruj-al-dhahab hlm. 407-408}. Dari berita hilangnya dia di Baghdad, dia mencari perlindungan kepada seorang tukang cukur kulit hitam yang melindunginya dan memberinya makan apa yang tidak bisa dia jangkau, lalu meminta izin untuk bernyanyi dan menyarankan tiga suara yang akan dia gunakan untuk mendahului semua yang bernyanyi, mengatakan: Aku adalah hamba Ishaq ibn Ibrahim al-Mawsili, dan dia menolak mengambil dinarnya {cite:muruj-al-dhahab hlm. 425-426}"
