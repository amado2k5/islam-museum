id: person/ibrahim-ibn-al-mahdi
class: person
label: { ar: "إبراهيم بن المهدي" }
summary:
  ar: "بايعه أهل بغداد بالخلافة في المحرم سنة اثنتين ومائتين، بعد أن دُعي لذلك في آخر سنة إحدى ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.555} {cite:tabari-tarikh-abu-al-fadl j.8 p.557}. وفي سنة ثلاث ومائتين خلعه أهل بغداد، ثم اختفى {cite:tabari-tarikh-abu-al-fadl j.8 p.570} {cite:tabari-tarikh-abu-al-fadl j.8 p.571}. وعند المسعودي استزاره الرشيد بالرقة فوضع جام قريص سمك قام بأكثر من ألف درهم فحلف الرشيد ألا يطعم شيئاً دون أن يحضره فأمر بالتصدق به ودفع الجام إلى أول سائل، وروى مزاحه معه على ظهر حراقة حين سأله ما أسمج الأسماء فقال إبراهيم لما لقي أهله من القتل والخلع، فهتف ملاح بأعلى صوته يا إبراهيم {cite:muruj-al-dhahab p. 350-351}، وهجاه المأمون وكان يظهر التشيع وابن شكلة التسنن فقال إذا المرجي سرك أن تراه يموت لحينه من قبل موته نجدد عنده ذكرى علي، فرد إذا الشيعي جمجم في مقال فسرك أن يبوح بذات نفسه نصل على النبي وصاحبيه {cite:muruj-al-dhahab p. 399-400}، وروى عن نفسه للمأمون أنه غنى طفيلياً في مجمع حتى أذعنه صاحب المنزل بجاريه وقال ما بقي غير أمي وأختي ولأنزلنهما إليك فكانت صاحبته الأخت فزوجه إياها وأمهرها عنه عشرين ألف درهم فصار الرجل من خواص المأمون {cite:muruj-al-dhahab p. 407-408}، ومن خبر اختفائه ببغداد أنه لجأ إلى حجام أسود فآواه وأطعمه بما لم تقع عليه يده ثم استأذنه أن يغنيه واقترح عليه ثلاثة أصوات أتقدم فيها عن كل من غنى وقال أنا أخدم إسحاق بن إبراهيم الموصلي، وأبى أن يأخذ شيئاً من دنانيره {cite:muruj-al-dhahab p. 425-426}"
