summary:
  ar: "أبو عبد الله محمد بن أبي محمد بن محمد بن ظفر الصقلي، الملقب حجة الدين؛ أحد الأدباء الفضلاء صاحب التصانيف الممتعة؛ منها كتاب سلوان المطاع في عدوان الأتباع صنفه لبعض القواد بصقلية سنة أربع وخمسين وخمسمائة، وكتاب خير البشر بخير البشر، وكتاب المنبع في تفسير القرآن وهو كبير، وكتاب نسماء الأبناء، والحاشية على درة الغواص للحريري، وشرح المقامات للحريري وهما شرحان كبير وصغير؛ قال عنه الشيخ تاج الدين الكندي لما ناظره بحماة: تاج الدين أعلم مني بالنحو وأنا أعلم منه باللغة {cite:wafayat-ayan}."
  en: "Hujjat al-Din Ibn Zafar al-Siqilli (d. c. 570) — the Sicilian adib; author of Sulwan al-Muta' fi Udwan al-Atba' (written for a Sicilian commander in 554), a Quran commentary, glosses on al-Hariri's Durrat al-Ghawwas, and two commentaries on the Maqamat {cite:wafayat-ayan}."
