died: { edtf: "1175~", hijri: "0570~", calendar: julian, precision: decade, status: tradition, derived: true, note: "ذكر القطب الحلبي في تاريخ مصر أن وفاته في عشر السبعين وخمسمائة {cite:wafayat-ayan}." }
summary:
  ar: "أبو عبد الله محمد بن أبي محمد بن محمد بن ظفر الصقلي، الملقب حجة الدين؛ أحد الأدباء الفضلاء صاحب التصانيف الممتعة؛ منها كتاب سلوان المطاع في عدوان الأتباع صنفه لبعض القواد بصقلية سنة أربع وخمسين وخمسمائة، وكتاب خير البشر بخير البشر، وكتاب المنبع في تفسير القرآن وهو كبير، وكتاب نسماء الأبناء، والحاشية على درة الغواص للحريري، وشرح المقامات للحريري وهما شرحان كبير وصغير؛ قال عنه الشيخ تاج الدين الكندي لما ناظره بحماة: تاج الدين أعلم مني بالنحو وأنا أعلم منه باللغة {cite:wafayat-ayan}."
  en: "Hujjat al-Din Ibn Zafar al-Siqilli (d. c. 570) — the Sicilian adib; author of Sulwan al-Muta' fi Udwan al-Atba' (written for a Sicilian commander in 554), a Quran commentary, glosses on al-Hariri's Durrat al-Ghawwas, and two commentaries on the Maqamat {cite:wafayat-ayan}."
  es: "Hujjat al-Din ibn Zafar al-Siqilli (m. 570), el poeta siciliano; autor de Sulwan al-Muta' y Udwan al-Atba' (escrito para un comandante siciliano en 554), un comentario sobre el Corán, glosas sobre Durrat al-Ghawwas de al-Hariri y dos comentarios sobre el Maqamat."
  fr: "Hujjat al-Din ibn Zafar al-Siqilli (dc 570) — le poète sicilien; auteur de Sulwan al-Muta' et d'Udwan al-Atba' (écrits pour un commandant sicilien en 554), d'un commentaire sur le Coran, de gloses sur Durrat al-Ghawwas d'al-Hariri et de deux commentaires sur le Maqamat."
  ur: "حجۃ الدین ابن ظفر السقلی ⁦(ڈی سی 570)⁩ - سسلی کے ادیب؛ سلوان المطاع فی عدوان العطبہ کے مصنف ⁦(554 میں ایک سسلی کمانڈر کے لیے لکھا گیا)⁩، ایک قرآنی تفسیر، الحریری کی دُرّت الغوث پر تالیفات، اور مقام کی دو تفسیریں۔"
  tr: "Ebu Abdullah Muhammed bin Ebi Muhammed ibn Muhammed ibn Zafar el-Siqilli, lakaplı adı Hujjat al-Din, erdemli yazarlardan ve keyifli eserlerin yazarıydı; bunlar arasında 554 Hicri yılında Sicilya'daki bazı komutanlar için yazılan Silwan al-Muta'fi Adwan al-Atba'a (Takipçilerin Saldırısı) adlı kitap, 'İnsanların En İyileri' bi-Khayr al-Bashar kitabı ve 'Alba' kitabı yer alır -Büyük olan Manba'fi Tafsir al-Qur'an, 'Nasma' al-Ibna' kitabı, al-Hariri'nin Durrat al-Ghawwas üzerine kenar notları ve al-Hariri'nin Maqamat üzerine büyük ve küçük tefsiri; Şeyh Taceddin el-Kindi, Hama'da münazara yaparken onun hakkında şöyle demiştir: Taceddin benden daha bilgilidir ve dili ondan daha iyi bilirim {alıntı: Wafayat-ayan}."
  id: "Abu Abdullah Muhammad ibn Abi Muhammad ibn Muhammad ibn Zafar al-Siqilli, yang dijuluki Hujjat al-Din, adalah salah satu penulis yang berbudi luhur dan penulis karya-karya yang menyenangkan; di antaranya adalah buku Silwan al-Muta' fi Adwan al-Atba'a' (Agresi Para Pengikut), yang ditulis untuk beberapa komandan di Sisilia pada tahun 554 H, buku 'Yang Terbaik dari Manusia' bi-Khayr al-Bashar, buku tersebut 'Al-Manba' fi Tafsir al-Qur'an, yang besar, buku 'Nasma' al-Ibna', catatan pinggir tentang Durrat al-Ghawwas oleh al-Hariri, dan komentar tentang Maqamat oleh al-Hariri, baik yang besar maupun kecil; Sheikh Taj al-Din al-Kindi pernah berkata tentang dia saat berdebat di Hama: Taj al-Din lebih berpengetahuan tentang tata bahasa daripada saya dan saya lebih menguasai bahasanya darinya {sitip:Wafayat-Ayan}."
