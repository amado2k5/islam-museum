label: { ar: "الأبله الشاعر", en: "al-Ablah, the poet" }
summary:
  ar: "أبو عبد الله محمد بن بختيار بن عبد الله المولد، المعروف بالأبله البغدادي؛ الشاعر المشهور أحد المتأخرين المجيدين؛ جمع في شعره بين الصنعة والرقة وله ديوان شعر بأيدي الناس كثير الوجود؛ قال العماد الكاتب الأصبهاني في الخريدة: هو شاب ظريف يتزيا بزي الجند، رقيق أواري الشعر حلو الصناعة رائق البراعة عذب اللفظ أرق من النسيم السحري وأحسن من الروض المستبري، والمغنون يغنون برائقات أبياته على أصوات القدماء فهم يتهافتون على نظمه المطرب؛ كانت بينه وبين ابن التعاويذي منافسة وهجاء {cite:wafayat-ayan}."
  en: "Al-Ablah — Muhammad b. Bakhtiyar al-Baghdadi, the polished court poet praised by Imad al-Din al-Isfahani in the Kharida; his diwan was widely circulated and his verses set to older melodies by the singers; exchanged satires with Ibn al-Ta'awidhi {cite:wafayat-ayan}."
