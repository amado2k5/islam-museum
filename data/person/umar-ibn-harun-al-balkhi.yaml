summary:
  ar: "عمر بن هارون البلخي أبو حفص مولى ثقيف ⁦(ت 194هـ ببلخ)⁩، روى عن جعفر بن محمد وابن جريج ولازمه اثنتي عشرة سنة وتزوج ابن جريج أخته، وعنه قتيبة وأحمد ونصر بن علي. يجمع الذهبي في «ميزان الاعتدال» شدة النقاد عليه: متروك عند ابن مهدي وأحمد والنسائي، وكذّبه ابن معين وصالح جزرة، وضعّفه ابن المديني والدارقطني جداً، مع ثناء قتيبة على علمه بالقراءات وشدته على المرجئة، ويختم الذهبي بأنه كان من أوعية العلم على ضعفه وكثرة مناكيره، وأنه لا يظنه يتعمد الباطل {cite:mizan-itidal-bijawi-v3 p. 228-229}."
  en: "Umar ibn Harun al-Balkhi, Abu Hafs, client of Thaqif (d. 194 AH at Balkh), narrated from Ja'far ibn Muhammad and from Ibn Jurayj, whom he attended for twelve years and who married his sister; Qutayba, Ahmad and Nasr ibn Ali narrated from him. Al-Dhahabi's Mizan al-I'tidal records the critics' severity — abandoned for Ibn Mahdi, Ahmad and al-Nasa'i, a liar for Ibn Ma'in and Salih Jazara, very weak for Ibn al-Madini and al-Daraqutni — alongside Qutayba's praise of his knowledge of the Qur'an readings and his firmness against the Murji'a; al-Dhahabi concludes that he was a vessel of learning despite his weakness and many objectionable reports, and that he does not think he lied deliberately."
  es: "Umar ibn Harun al-Balkhi, Abu Hafs, cliente de Thaqif (fallecido en el año 194 de la Hégira en Balkh), narró de Ja'far ibn Muhammad y de Ibn Jurayj, a quien atendió durante doce años y quien se casó con su hermana; Qutayba, Ahmad y Nasr ibn Ali narraron de él. El Mizan al-I'tidal de Al-Dhahabi registra la severidad de los críticos —abandonado para Ibn Mahdi, Ahmad y al-Nasa'i, mentiroso para Ibn Ma'in y Salih Jazara, muy débil para Ibn al-Madini y al-Daraqutni— junto con el elogio de Qutayba a su conocimiento de las lecturas del Corán y su firmeza contra los Murji'a; Al-Dhahabi concluye que fue un recipiente de conocimiento a pesar de su debilidad y muchos relatos objetables, y que no cree que mintiera deliberadamente."
  fr: "Umar ibn Harun al-Balkhi, Abu Hafs, disciple de Thaqif (mort en 194 AH à Balkh), rapporta des enseignements de Ja'far ibn Muhammad et d'Ibn Jurayj, auprès duquel il travailla douze ans et qui épousa sa sœur. Qutayba, Ahmad et Nasr ibn Ali rapportèrent également des enseignements de lui. Le Mizan al-I'tidal d'al-Dhahabi relate la sévérité des critiques – Ibn Mahdi, Ahmad et al-Nasa'i le qualifiant d'abandonné, Ibn Ma'in et Salih Jazara de menteur, et Ibn al-Madini et al-Daraqutni de très faible – ainsi que les éloges de Qutayba concernant sa connaissance des lectures du Coran et sa fermeté face aux Murji'a. Al-Dhahabi conclut qu'il fut un érudit malgré ses faiblesses et les nombreux récits contestables, et qu'il ne croit pas qu'il ait menti délibérément."
