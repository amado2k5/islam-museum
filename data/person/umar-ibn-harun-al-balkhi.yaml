summary:
  ar: "عمر بن هارون البلخي أبو حفص مولى ثقيف ⁦(ت 194هـ ببلخ)⁩، روى عن جعفر بن محمد وابن جريج ولازمه اثنتي عشرة سنة وتزوج ابن جريج أخته، وعنه قتيبة وأحمد ونصر بن علي. يجمع الذهبي في «ميزان الاعتدال» شدة النقاد عليه: متروك عند ابن مهدي وأحمد والنسائي، وكذّبه ابن معين وصالح جزرة، وضعّفه ابن المديني والدارقطني جداً، مع ثناء قتيبة على علمه بالقراءات وشدته على المرجئة، ويختم الذهبي بأنه كان من أوعية العلم على ضعفه وكثرة مناكيره، وأنه لا يظنه يتعمد الباطل {cite:mizan-itidal-bijawi-v3 p. 228-229}."
  en: "Umar ibn Harun al-Balkhi, Abu Hafs, client of Thaqif (d. 194 AH at Balkh), narrated from Ja'far ibn Muhammad and from Ibn Jurayj, whom he attended for twelve years and who married his sister; Qutayba, Ahmad and Nasr ibn Ali narrated from him. Al-Dhahabi's Mizan al-I'tidal records the critics' severity — abandoned for Ibn Mahdi, Ahmad and al-Nasa'i, a liar for Ibn Ma'in and Salih Jazara, very weak for Ibn al-Madini and al-Daraqutni — alongside Qutayba's praise of his knowledge of the Qur'an readings and his firmness against the Murji'a; al-Dhahabi concludes that he was a vessel of learning despite his weakness and many objectionable reports, and that he does not think he lied deliberately."
