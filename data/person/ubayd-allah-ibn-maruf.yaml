summary:
  ar: "ابن معروف، قاضي القضاة ببغداد في أواخر أيام الطائع لله؛ تقلّد قضاء القضاة في شعبان سنة ستين وثلثمائة بعد صرف أبي بكر بن سيار، وقُبض عليه يوم الاثنين لأربع بقين من صفر سنة تسع وستين وثلثمائة بأمر عضد الدولة وأُنفذ إلى القلعة بفارس، وقُلّد أبو سعد بشر بن الحسين ما كان إليه من قضاء القضاة، واحتُجّ عليه بالتقصير في حق عضد الدولة وبأنه ينفسح فيما لا ينبغي للقضاة مثله، فأجاب عن ذلك فلم يُلتفت إليه {cite:muntazam-ibn-al-jawzi j.7 p.64, 102}."
  en: "Ibn Ma'ruf, chief qadi of Baghdad in al-Ta'i''s later years: appointed to the chief qadiship in Sha'ban 360 after Abu Bakr b. Sayyar was dismissed; on Monday 26 Safar 369 'Adud al-Dawla had him seized and sent to the castle at Fars, giving the office to Abu Sa'd Bishr b. al-Husayn; he was charged with neglecting 'Adud's due and with laxity unbecoming the qadis, and his answer went unheeded {cite:muntazam-ibn-al-jawzi j.7 p.64, 102}."
