summary:
  ar: "ابن معروف، قاضي القضاة ببغداد في أواخر أيام الطائع لله؛ تقلّد قضاء القضاة في شعبان سنة ستين وثلثمائة بعد صرف أبي بكر بن سيار، وقُبض عليه يوم الاثنين لأربع بقين من صفر سنة تسع وستين وثلثمائة بأمر عضد الدولة وأُنفذ إلى القلعة بفارس، وقُلّد أبو سعد بشر بن الحسين ما كان إليه من قضاء القضاة، واحتُجّ عليه بالتقصير في حق عضد الدولة وبأنه ينفسح فيما لا ينبغي للقضاة مثله، فأجاب عن ذلك فلم يُلتفت إليه {cite:muntazam-ibn-al-jawzi j.7 p.64, 102}."
  en: "Ibn Ma'ruf, chief qadi of Baghdad in al-Ta'i''s later years: appointed to the chief qadiship in Sha'ban 360 after Abu Bakr b. Sayyar was dismissed; on Monday 26 Safar 369 'Adud al-Dawla had him seized and sent to the castle at Fars, giving the office to Abu Sa'd Bishr b. al-Husayn; he was charged with neglecting 'Adud's due and with laxity unbecoming the qadis, and his answer went unheeded {cite:muntazam-ibn-al-jawzi j.7 p.64, 102}."
  es: "Ibn Ma'ruf, cadí principal de Bagdad en los últimos años de al-Ta'i: fue nombrado cadí principal en Sha'ban 360 después de que Abu Bakr b. Sayyar fuera destituido; el lunes 26 de Safar 369, 'Adud al-Dawla lo hizo arrestar y enviar al castillo de Fars, dando el cargo a Abu Sa'd Bishr b. al-Husayn; fue acusado de descuidar los derechos de 'Adud y de una laxitud impropia de los cadíes, y su respuesta fue ignorada {cite:muntazam-ibn-al-jawzi j.7 p.64, 102}."
  fr: "Ibn Ma'ruf, cadi en chef de Bagdad à la fin du règne d'al-Ta'i', fut nommé à ce poste en Sha'ban 360 après la destitution d'Abu Bakr b. Sayyar. Le lundi 26 Safar 369, 'Adud al-Dawla le fit arrêter et envoyer au château de Fars, confiant la charge à Abu Sa'd Bishr b. al-Husayn. Il fut accusé de négliger les devoirs d''Adud et de faire preuve d'un laxisme indigne des cadis, mais sa réponse resta sans réponse."
  ur: "ابن معروف، الطائی کے بعد کے سالوں میں بغداد کا چیف قادی: ابوبکر بن علی کے بعد شعبان 360 میں چیف قاضی مقرر ہوا۔ سیار کو برطرف کر دیا گیا۔ پیر 26 صفر 369 کو عدود الدولہ نے اسے پکڑ کر فارس کے قلعے میں بھیج دیا اور دفتر ابو سعد بشر کو دے دیا۔ الحسین؛ اس پر عدود کے واجبات کو نظر انداز کرنے اور قادیانیوں میں سستی کا الزام لگایا گیا، اور اس کا جواب بے دھیان رہا۔"
