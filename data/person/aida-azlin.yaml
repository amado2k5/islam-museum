summary:
  ar: "كاتبة سنغافورية تقيم في المغرب، تكتب منذ أكثر من ثماني سنوات رسالتها الأسبوعية «رسائل حب الثلاثاء» لنساء مسلمات حول العالم، وأسست مجتمع «AA» و«AA Plus» الإلكتروني للنساء، وتقدم برنامج «برنامج عايدة عزلين» الحواري؛ تخرجت في كلية الفن والتصميم والإعلام بجامعة نانيانغ التكنولوجية، وأسست سابقا علامة «ملصق الشال» للحجاب الأخلاقي."
  en: "Singaporean writer residing in Morocco who has written the weekly Tuesday Love Letters newsletter for Muslim women around the world for more than eight years, founded the AA and AA Plus online community for women, and hosts The Aida Azlin Show podcast. A graduate of Nanyang Technological University's School of Art, Design and Media, she previously founded The Shawl Label, an ethical shawl brand."
  ur: "سنگاپوری مصنفہ، مراکش میں مقیم، جو آٹھ سال سے زائد عرصے سے دنیا بھر کی مسلمان خواتین کے لیے ہفتہ وار «منگل کے محبت بھرے خطوط» لکھ رہی ہیں، خواتین کی آن لائن کمیونٹی «اے اے» اور «اے اے پلس» کی بانی ہیں، اور «دی عائدہ عزلین شو» پوڈکاسٹ پیش کرتی ہیں؛ انہوں نے نانیانگ ٹیکنولوجیکل یونیورسٹی کے سکول آف آرٹ، ڈیزائن اینڈ میڈیا سے تعلیم حاصل کی اور اس سے پہلے اخلاقی شال برانڈ «دی شال لیبل» قائم کیا۔"
