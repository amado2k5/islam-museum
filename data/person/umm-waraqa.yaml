summary:
  ar: 'صحابية أنصارية قرأت القرآن؛ طلبت أن تخرج مع النبي إلى بدر لتمرّض المرضى فقال لها: «قري في بيتك فإن الله يرزقك الشهادة» فكانت تسمى الشهيدة، وأذن لها أن تتخذ في دارها مؤذناً، وقتلها غلام لها وجارية فصلبهما عمر.'
  en: An Ansari Companion who had read the Qur'an; she asked to go out with the Prophet to Badr to nurse the sick and he told her to stay in her house since God would grant her martyrdom, so she was called 'the martyr'; he allowed her a muezzin
    in her house, and a male and a female slave of hers killed her and Umar had them crucified.
