summary:
  ar: 'صحابية أنصارية قرأت القرآن؛ طلبت أن تخرج مع النبي إلى بدر لتمرّض المرضى فقال لها: «قري في بيتك فإن الله يرزقك الشهادة» فكانت تسمى الشهيدة، وأذن لها أن تتخذ في دارها مؤذناً، وقتلها غلام لها وجارية فصلبهما عمر.'
  en: An Ansari Companion who had read the Qur'an; she asked to go out with the Prophet to Badr to nurse the sick and he told her to stay in her house since God would grant her martyrdom, so she was called 'the martyr'; he allowed her a muezzin
    in her house, and a male and a female slave of hers killed her and Umar had them crucified.
  ur: "انصاری صحابیہ جنہوں نے قرآن پڑھا تھا؛ انہوں نے بدر میں بیماروں کی دیکھ بھال کے لیے جانے کی اجازت مانی اور نبی نے رہنے کو کہا۔"
  es: "Una compañera de los Ansari que había leído el Corán pidió acompañar al Profeta a Badr para cuidar a los enfermos, pero él le dijo que se quedara en su casa, ya que Dios le concedería el martirio, por lo que fue llamada \"la mártir\". Le permitió tener un muecín en su casa, y un esclavo y una esclava suyos la mataron, y Umar los hizo crucificar."
  fr: "Une Compagne Ansari qui avait lu le Coran; elle demanda à accompagner le Prophète à Badr pour soigner les malades et il lui dit de rester chez elle car Dieu lui accorderait le martyre, elle fut donc appelée « la martyre »; il lui permit d'avoir un muezzin chez elle, et un de ses esclaves, un homme et une femme, la tuèrent et Umar les fit crucifier."
  tr: "Kur'an okuyan bir Ansari kadın yoldaşı, Peygamber'e Bedir'e hastaların yanına gitmek istedi. Kadın ona şöyle dedi: \"Evinde oku, Allah sana şehitlik verecek.\" Ona şehit denildi ve evinde müezzin bulundurmasına izin verildi. Ömer oğlunu ve bir köle kızı öldürdü, ikisi de Ömer tarafından çarmıha gerildi."
  id: "Seorang sahabat wanita Ansari yang membaca Al-Qur'an meminta untuk menemani Nabi ke Badr untuk orang sakit. Ia berkata kepadanya: \"Bacalah di rumahmu, karena Allah akan menganugerahkan syahid kepadamu.\" Dia disebut syahid, dan diizinkan untuk memiliki muesin di rumahnya. Umar membunuh anak laki-lakinya dan seorang budak perempuan, keduanya disalibkan oleh Umar."
