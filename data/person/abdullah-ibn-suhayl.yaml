roles: [companion]
summary:
  ar: "صحابي قرشي، أبو سهيل ابن سهيل بن عمرو؛ من مهاجرة الحبشة، أخذه أبوه بعد رجوعه ففتنه عن دينه فأظهر الرجوع، ثم فر إلى المسلمين يوم بدر وثبت معهم، وشهد صلح الحديبية، واستشهد باليمامة ويقال بجواثا من البحرين وله ثمان وثمانون سنة."
  en: "A Qurashi Companion known as Abu Suhayl, son of Suhayl ibn Amr; among the emigrants to Abyssinia. His father turned him back from his faith and he outwardly recanted, then slipped away to the Muslim ranks at Badr and stayed with them; he witnessed the truce of al-Hudaybiyya and was martyred at al-Yamama, or it is said at Jawatha in Bahrayn, aged eighty-eight."
  ur: "ابو سہیل کے نام سے مشہور قریشی صحابی، سہیل بن عمرو کے فرزند؛ حبشہ جانے والوں میں سے؛ ان کے والد نے انہیں دین سے روکا اور وہ بڑی عمر پائے۔"
  fr: "Un Compagnon qurayshite connu sous le nom d'Abu Suhayl, fils de Suhayl ibn Amr ; parmi les émigrés en Abyssinie. Son père le détourna de sa foi et il se rétracta en apparence, puis il s'échappa vers les rangs musulmans à Badr et resta avec eux ; il fut témoin de la trêve d'al-Hudaybiyya et tomba en martyr à al-Yamama, ou, dit-on, à Jawatha au Bahrayn, à l'âge de quatre-vingt-huit ans."
  es: "Abu Suhayl, hijo de Suhayl ibn Amr, era un Compañero Qurashi que emigró a Abisinia. Su padre lo apartó de la fe, pero él se retractó públicamente y se unió sigilosamente a las filas musulmanas en Badr, donde permaneció. Fue testigo de la tregua de al-Hudaybiyya y murió como mártir en al-Yamama, o según se dice, en Jawatha, en Bahrayn, a la edad de ochenta y ocho años."
