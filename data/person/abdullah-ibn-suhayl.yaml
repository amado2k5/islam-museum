summary:
  ar: "صحابي قرشي، أبو سهيل ابن سهيل بن عمرو؛ من مهاجرة الحبشة، أخذه أبوه بعد رجوعه ففتنه عن دينه فأظهر الرجوع، ثم فر إلى المسلمين يوم بدر وثبت معهم، وشهد صلح الحديبية، واستشهد باليمامة ويقال بجواثا من البحرين وله ثمان وثمانون سنة."
  en: "A Qurashi Companion known as Abu Suhayl, son of Suhayl ibn Amr; among the emigrants to Abyssinia. His father turned him back from his faith and he outwardly recanted, then slipped away to the Muslim ranks at Badr and stayed with them; he witnessed the truce of al-Hudaybiyya and was martyred at al-Yamama, or it is said at Jawatha in Bahrayn, aged eighty-eight."
