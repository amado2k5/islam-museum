summary:
  ar: "عبد الله بن يوسف بن محمد الزيلعي، أبو محمد، جمال الدين، فقيه عالم بالحديث، أصله من الزيلع في الصومال ووفاته في القاهرة، صاحب «نصب الراية في تخريج أحاديث الهداية» في مذهب الحنفية، توفي سنة 762 هـ."
  en: "Abdallah ibn Yusuf ibn Muhammad al-Zaylai, Abu Muhammad, Jamal al-Din, a jurist learned in hadith whose origin was in Zayla in Somalia and who died in Cairo; author of Nasb al-Raya fi Takhrij Ahadith al-Hidaya in the Hanafi school; died 762 AH."
  es: "Abdallah ibn Yusuf ibn Muhammad al-Zaylai, Abu Muhammad, Jamal al-Din, un jurista versado en hadices cuyo origen estaba en Zayla en Somalia y que murió en El Cairo; autor de Nasb al-Raya fi Takhrij Ahadith al-Hidaya en la escuela Hanafi; murió en 762 AH."
  fr: "Abdallah ibn Yusuf ibn Muhammad al-Zaylai, Abu Muhammad, Jamal al-Din, juriste versé dans le hadith, originaire de Zayla en Somalie et décédé au Caire; auteur de Nasb al-Raya fi Takhrij Ahadith al-Hidaya dans l'école Hanafi; décédé en 762 AH."
