summary:
  ar: "شاعر رثى الحسين بن علي على ما ذكره الزبير بن بكار في أنساب قريش بقوله فإن قتيل الطف من آل هاشم أذل رقاباً من قريش فذلت ألم تر أن الأرض أضحت مريضة بقتل حسين والبلاد اقشعرت {cite:muruj-al-dhahab p. 63}."
  en: "The elegist of the Taff's slain — 'the Hashimi killed there humbled Quraysh's necks; the very earth fell sick at Husayn's killing and the lands shuddered' {cite:muruj-al-dhahab p. 63}."
  es: "El elegíaco de los caídos de Taff: «El Hashimi asesinado allí humilló los cuellos de los Quraysh; la tierra misma enfermó con la muerte de Husayn y las tierras temblaron» {cita:muruj-al-dhahab p. 63}."
  fr: "L'élégiaque des morts du Taff — « les Hashimi tués là ont humilié les cous des Quraysh; la terre elle-même est tombée malade à la mort de Husayn et les terres ont tremblé » {cite: muruj-al-dhahab p. 63}."
  ur: "طاف کے مقتول کا ایلجسٹ - 'وہاں مارے جانے والے ہاشمی نے قریش کی گردنیں پست کر دیں۔ حسین کے قتل سے زمین بیمار پڑ گئی اور زمینیں لرز گئیں۔ 63}۔"
  tr: "Hüseyin bin Ali'yi, el-Zubeyr bin Bakkar'ın Kureyş'in soyağacında bahsettiklerini şöyle söylemiştir: 'Haşim'in ailesinden el-Taff öldürülen, Kureyş'in kölelerini aşağıladı, böylece onlar da aşağılandı. Hüseyin'in öldürülmesiyle yeryüzünün hastalandığını ve toprakların sarsıldığını, görmedin mi? {atıf:Muruj-al-Dhahab, s. 63}."
  id: "Seorang penyair yang mengangkat Husayn ibn Ali tentang apa yang disebutkan al-Zubayr ibn Bakkar dalam silsilah Quraisy, mengatakan: 'Orang yang dibunuh al-Taff dari keluarga Hashim mempermalukan budak-budak Quraisy, sehingga mereka dihina. Apakah kamu tidak melihat bahwa bumi menjadi sakit akibat pembunuhan Husayn dan tanah-tanah bergetar? {cite:Muruj-al-Dhahab, hlm. 63}."
