summary:
  ar: "شيخ الحرم بمكة، شيخ الشافعية ومحدث الحجاز؛ صنّف كتاباً كبيراً في الأحكام في ست مجلدات ورحل به إلى اليمن فأسمعه سلطانَها، ومن تصانيفه «الرياض النضرة في فضائل العشرة» و«ذخائر العقبى في مناقب ذوي القربى» و«السمط الثمين في مناقب أمهات المؤمنين» و«القرى في ساكن أم القرى» وشرح «التنبيه»؛ روى عنه الدمياطي وابن العطار وابن الخباز والبرزالي {cite:shadharat-dhahab p. 743}."
  en: "Shaykh of the Meccan haram — the Ri'yad al-Nadira, Dhakha'ir al-Uqba, al-Simt al-Thamin and al-Qira are his; carried his six-volume Ahkam to Yemen's sultan {cite:shadharat-dhahab p. 743}."
  es: "Shaykh del haram de La Meca: Ri'yad al-Nadira, Dhakha'ir al-Uqba, al-Simt al-Thamin y al-Qira son suyos; llevó su Ahkam de seis volúmenes al sultán de Yemen {cita: shadharat-dhahab p. 743}."
  fr: "Cheikh du haram mecquois — les Ri'yad al-Nadira, Dhakha'ir al-Uqba, al-Simt al-Thamin et al-Qira sont à lui; a porté son Ahkam en six volumes au sultan du Yémen {cite: shadharat-dhahab p. 743}."
  ur: "مکی حرم کے شیخ - ریاض الندیرہ، ذخائر العقبہ، السمط الثمین اور القیرہ ان کے ہیں۔ اپنی چھ جلدوں پر مشتمل احکام یمن کے سلطان کے پاس لے کر گئے۔ 743}۔"
  tr: "Mekke Haram Şeyhi, Şafii âlimi ve Hicaz hadis âlimi; altı ciltlik hükümler üzerine büyük bir kitap yazdı ve onunla Yemen'e seyahat etti; burada hükümdarı bunu ondan duydu. Eserleri arasında \"Al-Riyad al-Nadra fi Fada'il al-'Ashra,\" \"Dhakha'ir al-'Uqba fi Manaqib Dhawi al-Qurba,\" \"Al-Samt al-Thamin fi Manaqib um al-Mu'minin,\" \"Al-Qura fi Sakin um al-Qura\" ve \"Al-Tanbih\" tefsiri yer alır. Kendisinden Al-Dimyati, İbn al-Attar, İbn al-Khabbaz ve al-Barzali tarafından anlatıldı {atıf: shadharat-dhahab, s. 743}."
  id: "Sheikh Haram di Mekah, ulama Shafi'i, dan ulama hadis Hijaz; ia menulis buku besar tentang keputusan-perintah dalam enam jilid dan membawanya ke Yaman, di mana penguasanya mendengarnya darinya. Di antara karya-karyanya adalah \"Al-Riyad al-Nadra fi Fada'il al-'Ashra,\" \"Dhakha'ir al-'Uqba fi Manaqib Dhawi al-Qurba,\" \"Al-Samt al-Thamin fi Manaqib um al-Mu'minin,\" \"Al-Qura fi Sakin um al-Qura,\" dan komentar atas \"Al-Tanbih.\" Dinawayatkan darinya oleh Al-Dimyati, Ibn al-Attar, Ibn al-Khabbaz, dan al-Barzali {cite:shadharat-dhahab, hlm. 743}."
