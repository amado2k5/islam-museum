summary:
  ar: "شيخ الحرم بمكة، شيخ الشافعية ومحدث الحجاز؛ صنّف كتاباً كبيراً في الأحكام في ست مجلدات ورحل به إلى اليمن فأسمعه سلطانَها، ومن تصانيفه «الرياض النضرة في فضائل العشرة» و«ذخائر العقبى في مناقب ذوي القربى» و«السمط الثمين في مناقب أمهات المؤمنين» و«القرى في ساكن أم القرى» وشرح «التنبيه»؛ روى عنه الدمياطي وابن العطار وابن الخباز والبرزالي {cite:shadharat-dhahab p. 743}."
  en: "Shaykh of the Meccan haram — the Ri'yad al-Nadira, Dhakha'ir al-Uqba, al-Simt al-Thamin and al-Qira are his; carried his six-volume Ahkam to Yemen's sultan {cite:shadharat-dhahab p. 743}."
