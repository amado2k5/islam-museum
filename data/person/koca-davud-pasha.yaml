summary:
  ar: "داود باشا، الصدر الأعظم العثماني خمس عشرة سنة في عهد بايزيد الثاني، ومن آثاره جامعه ومستشفاه بإسطنبول، توفي سنة 1498م. وينقل الصلابي عن كتب التاريخ أنه كان غلاماً لمحمد الفاتح ظهر منه فساد بأدرنة، فلما ركب إليه القاضي لمنعه اعتدى عليه وضربه، فأمر الفاتح بقتله لتحقيره نائب الشريعة ولم يقبل شفاعة الوزراء، حتى أقنعه المولى محيي الدين بأن القاضي بقيامه عن مجلس القضاء غضباً سقط عن رتبته فلم يكن عند الضرب قاضياً فلا يلزم القتل؛ ولما أُتي بالغلام ليقبل يد السلطان شكراً للعفو أحضر الفاتح عصاً كبيرة فضربه بنفسه ضرباً شديداً حتى مرض أربعة أشهر، ثم صار وزيراً للسلطان بايزيد خان وكان يقول: «إن رشدي هذا ما حصل إلا من ضربه» {cite:dawlat-uthmaniyya-salabi p. 146-147}."
  en: "Koca Davud Pasha, Ottoman grand vizier for fifteen years under Bayezid II, whose mosque and hospital still stand in Istanbul, d. 1498. The chronicle anecdote al-Salabi relays makes him first a page of Mehmed II at Edirne who struck the qadi come to stop his misconduct; Mehmed ordered him executed for dishonouring the law's deputy and refused the viziers' intercession — until Molla Muhyi al-Din reasoned that the qadi, by leaving his bench in anger, had forfeited the judicial rank at the moment of the blow. When the page was brought to kiss the sultan's hand in thanks for the pardon, Mehmed himself beat him so hard he lay ill four months; later he rose to be Bayezid's vizier, saying 'this rectitude of mine came only from his beating' {cite:dawlat-uthmaniyya-salabi p. 146-147}."
