summary:
  ar: "داود باشا، الصدر الأعظم العثماني خمس عشرة سنة في عهد بايزيد الثاني، ومن آثاره جامعه ومستشفاه بإسطنبول، توفي سنة 1498م. وينقل الصلابي عن كتب التاريخ أنه كان غلاماً لمحمد الفاتح ظهر منه فساد بأدرنة، فلما ركب إليه القاضي لمنعه اعتدى عليه وضربه، فأمر الفاتح بقتله لتحقيره نائب الشريعة ولم يقبل شفاعة الوزراء، حتى أقنعه المولى محيي الدين بأن القاضي بقيامه عن مجلس القضاء غضباً سقط عن رتبته فلم يكن عند الضرب قاضياً فلا يلزم القتل؛ ولما أُتي بالغلام ليقبل يد السلطان شكراً للعفو أحضر الفاتح عصاً كبيرة فضربه بنفسه ضرباً شديداً حتى مرض أربعة أشهر، ثم صار وزيراً للسلطان بايزيد خان وكان يقول: «إن رشدي هذا ما حصل إلا من ضربه» {cite:dawlat-uthmaniyya-salabi p. 146-147}."
  en: "Koca Davud Pasha, Ottoman grand vizier for fifteen years under Bayezid II, whose mosque and hospital still stand in Istanbul, d. 1498. The chronicle anecdote al-Salabi relays makes him first a page of Mehmed II at Edirne who struck the qadi come to stop his misconduct; Mehmed ordered him executed for dishonouring the law's deputy and refused the viziers' intercession — until Molla Muhyi al-Din reasoned that the qadi, by leaving his bench in anger, had forfeited the judicial rank at the moment of the blow. When the page was brought to kiss the sultan's hand in thanks for the pardon, Mehmed himself beat him so hard he lay ill four months; later he rose to be Bayezid's vizier, saying 'this rectitude of mine came only from his beating' {cite:dawlat-uthmaniyya-salabi p. 146-147}."
  es: "Koca Davud Pasha, gran visir otomano durante quince años bajo el reinado de Bayezid II, cuya mezquita y hospital aún se conservan en Estambul, falleció en 1498. La anécdota que relata al-Salabi lo presenta primero como paje de Mehmed II en Edirne, quien golpeó al cadí que había venido para detener su mala conducta; Mehmed ordenó su ejecución por deshonrar al representante de la ley y rechazó la intercesión de los visires, hasta que Molla Muhyi al-Din argumentó que el cadí, al abandonar su estrado enfadado, había perdido su rango judicial en el momento del golpe. Cuando el paje fue llevado a besar la mano del sultán en agradecimiento por el perdón, el propio Mehmed lo golpeó tan fuerte que estuvo enfermo durante cuatro meses; más tarde ascendió a visir de Bayezid, diciendo: «Esta rectitud mía solo provino de su paliza» {cite:dawlat-uthmaniyya-salabi p. 146-147}."
  fr: "Koca Davud Pacha, grand vizir ottoman pendant quinze ans sous Bayezid II, dont la mosquée et l'hôpital existent toujours à Istanbul, est décédé en 1498. L'anecdote rapportée par al-Salabi le présente d'abord comme page de Mehmed II à Edirne. Il frappa le cadi venu mettre fin à sa mauvaise conduite; Mehmed ordonna son exécution pour avoir déshonoré le représentant de la loi et refusa l'intervention des vizirs – jusqu'à ce que Molla Muhyi al-Din fasse valoir que le cadi, en quittant son siège sous le coup de la colère, avait perdu son rang judiciaire au moment même où le coup avait été porté. Lorsque le page fut amené pour baiser la main du sultan en remerciement de sa grâce, Mehmed le battit si violemment qu'il resta malade pendant quatre mois; plus tard, il devint vizir de Bayezid, déclarant: « Ma droiture, je la dois à cette correction » (cite: Dawlat-Uthmaniyya-Salabi, p. 146-147)."
