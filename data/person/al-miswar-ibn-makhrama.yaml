summary:
  ar: "صحابي صغير من بني زهرة، وُلد بعد الهجرة بسنتين وقدم المدينة بعد الفتح وهو غلام؛ ابن أخت عبد الرحمن بن عوف، حفظ حديث خطبة علي بنت أبي جهل، وكان مع ابن الزبير ومات بحجر منجنيق في الحصار الأول سنة 64هـ. وفي الصحيح عرض على علي بن الحسين حين قدم المدينة من عند يزيد أن يعطيه سيف رسول الله خوفاً أن يغلبه القوم عليه، وحلف أن لا يُخلَص إليهم حتى تُبلَغ نفسه {cite:sahih-al-bukhari 3110}."
  en: A young Companion of Banu Zuhra, born two years after the Hijra, who came to Medina as a boy after the conquest; a nephew of Abd al-Rahman ibn Awf, he preserved the hadith about Ali's proposal to the daughter of Abu Jahl, and he was with
    Ibn al-Zubayr, dying from a catapult stone in the first siege in 64 AH.
  fr: "Un jeune compagnon de Banu Zuhra, né deux ans après l'Hégire, qui est venu à Médine comme un garçon après la conquête ; Un neveu d'Abd al-Rahman ibn Awf, il a conservé le hadith sur la proposition d'Ali à la fille d'Abou Jahl, et il était avec Ibn al-Zubayr, mourant d'une pierre de catapulte dans le premier siège en 64 de l’hégire."
  ur: "بنو زہرہ کا نوجوان صحابی، ہجرت کے دو سال بعد پیدا ہوا، فتح کے بعد لڑکا ہو کر مدینہ آیا؛ عبد الرحمٰن بن عوف کا بھانجا۔"
  es: "Un joven Compañero de Banu Zuhra, nacido dos años después de la Hégira, que llegó a Medina siendo niño tras la conquista; sobrino de Abd al-Rahman ibn Awf, preservó el hadiz sobre la propuesta de matrimonio de Ali a la hija de Abu Jahl, y estuvo con Ibn al-Zubayr, muriendo por una piedra de catapulta en el primer asedio en el año 64 de la Hégira."
  tr: "Hicretten iki yıl sonra doğan Banu Zuhra'dan genç bir yoldaş, fetihten sonra çocukken Medine'ye gelmiş; Abdülrahman bin Avf'ın yeğeni, Ali bint Ebi Jahl'ın konuşmasını ezberlemiş, İbn al-Zubayr ile birlikteydi ve 64 Hicri'deki ilk kuşatmada bir mancınık taşına çarparak öldü. Orijinal koleksiyonda, Ali ibn al-Hüseyin Yezid'den Medine'ye geldiğinde, halkın onu alt edeceğinden korktuğu için Allah'ın Elçisi'nin kılıcı teklif edilmiş ve kendi yaşına gelene kadar onlara sadakat etmeyeceğine yemin etmiştir {atıf:sahih-al-bukhari 3110}."
  id: "Seorang sahabat muda dari Banu Zuhra, lahir dua tahun setelah Hijrah, yang tiba di Madinah setelah penaklukan saat masih anak-anak; keponakan Abd al-Rahman ibn Awf, yang menghafal pidato Ali bint Abi Jahl, bersama Ibn al-Zubayr, dan meninggal karena batu ketapel saat pengepungan pertama tahun 64 H. Dalam kumpulan asli, ketika Ali ibn al-Husayn tiba di Madinah dari Yazid, ia ditawarkan pedang Rasul Allah karena takut rakyat akan mengalahkannya, dan ia bersumpah tidak akan setia kepada mereka sampai mencapai usianya sendiri {cite:sahih-al-bukhari 3110}."
