summary:
  ar: "صحابي صغير من بني زهرة، وُلد بعد الهجرة بسنتين وقدم المدينة بعد الفتح وهو غلام؛ ابن أخت عبد الرحمن بن عوف، حفظ حديث خطبة علي بنت أبي جهل، وكان مع ابن الزبير ومات بحجر منجنيق في الحصار الأول سنة 64هـ. وفي الصحيح عرض على علي بن الحسين حين قدم المدينة من عند يزيد أن يعطيه سيف رسول الله خوفاً أن يغلبه القوم عليه، وحلف أن لا يُخلَص إليهم حتى تُبلَغ نفسه {cite:sahih-al-bukhari 3110}."
  en: A young Companion of Banu Zuhra, born two years after the Hijra, who came to Medina as a boy after the conquest; a nephew of Abd al-Rahman ibn Awf, he preserved the hadith about Ali's proposal to the daughter of Abu Jahl, and he was with
    Ibn al-Zubayr, dying from a catapult stone in the first siege in 64 AH.
