  en: "Ali ibn Husayn, last King of the Hejaz; his father abdicated the throne and the caliphate claim to him in October 1924; he held Jeddah until it fell to Abd al-Aziz ibn Saud in December 1925, then fled to Iraq. {cite:encyclopaedia-of-islam-2}"
