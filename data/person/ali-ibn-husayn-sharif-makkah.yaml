id: person/ali-ibn-husayn-sharif-makkah
class: person
label: { ar: "علي بن الحسين شريف مكة", en: "Ali ibn Husayn (King of the Hejaz)", ur: "علی بن حسین شریف مکہ", es: "Ali ibn Husayn (King of the Hejaz)", fr: "Ali ibn Husayn (King of the Hejaz)" }
roles: [caliph]
summary:
  ar: "علي بن الحسين، آخر ملوك الحجاز؛ تنازل له أبوه عن العرش والمطالبة بالخلافة في أكتوبر ١٩٢٤م، فبقي في جدة حتى سقوطها بيد عبد العزيز آل سعود في ديسمبر ١٩٢٥م ثم لجأ إلى العراق. {cite:encyclopaedia-of-islam-2}"
  en: "Ali ibn Husayn, last King of the Hejaz; his father abdicated the throne and the caliphate claim to him in October 1924; he held Jeddah until it fell to Abd al-Aziz ibn Saud in December 1925, then fled to Iraq. {cite:encyclopaedia-of-islam-2}"
  ur: "علی بن حسین، حجاز کے آخری بادشاہ؛ والد نے اکتوبر 1924ء میں تخت اور خلافت کا دعویٰ ان کے حوالے کیا؛ دسمبر 1925ء میں جدہ عبدالعزیز ابن سعود کے ہاتھوں گرنے تک برقرار رہے، پھر عراق فرار ہوئے۔ {cite:encyclopaedia-of-islam-2}"
  es: "Ali ibn Husayn, último rey del Hiyaz; su padre abdicó al trono y a la pretensión al califato en octubre de 1924; gobernó Yeda hasta que cayó en manos de Abd al-Aziz ibn Saud en diciembre de 1925, tras lo cual huyó a Irak. {cite:encyclopaedia-of-islam-2}"
  fr: "Ali ibn Husayn, dernier roi du Hedjaz; son père abdiqua du trône et du califat en octobre 1924; il conserva Djeddah jusqu’à sa prise par Abd al-Aziz ibn Saud en décembre 1925, puis s’enfuit en Irak. {cite:encyclopaedia-of-islam-2}"
  tr: "Hicaz'ın son kralı Ali bin El-Hüseyin; babası tahttan çekildi ve Ekim 1924'te halifeliği elan etti, bu yüzden Aralık 1925'te Abdülaziz El Suud'un eline geçene kadar Cidde'de kaldı, ardından Irak'a sığındı. {alıntı:İslam Ansiklopedisi-2}"
  id: "Ali bin Al-Hussein, raja terakhir Hejaz; ayahnya turun tahta dan mengklaim kekhalifahan pada Oktober 1924, sehingga ia tetap di Jeddah hingga jatuh ke tangan Abdulaziz Al Saud pada Desember 1925, setelah itu ia mencari perlindungan di Irak. {cite:encyclopaedia-of-Islam-2}"
