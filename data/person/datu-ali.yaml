summary:
  ar: "راجا بويان (1902–1905) وآخر زعماء المورو الكبار الذين قاوموا الحكم الأمريكي في منداناو. كان راجا مودا تينونغكوب وابن عم داتو أوتو الذي خلفه، وقاتل الإسبان منذ 1886، وقاد منذ 1903 نحو ثلاثة آلاف مقاتل ضد الولايات المتحدة، رافضًا التخلي عن استقلاله أو تحرير عبيده بموجب قانون إلغاء الرق سنة 1903. قُتل في معركة نهر مالالا في 22 تشرين الأول 1905."
  en: "Rajah of Buayan (1902–1905) and the last major Moro chieftain to resist American rule in Mindanao. Rajahmuda of Tinungkup and cousin of Datu Uto, whom he succeeded, he had fought the Spanish from 1886 and from 1903 led some 3,000 followers against the United States, refusing to yield his independence or free his slaves under the 1903 anti-slavery law. He was killed at the Battle of the Malala River on 22 October 1905."
  ur: "راجا بویان (1902ء–1905ء) اور منداناؤ میں امریکی حکومت کی مزاحمت کرنے والے آخری بڑے مورو سردار۔ تینونگکوپ کے راجا مودا اور داتو اوتو کے چچا زاد بھائی، جن کے جانشین بنے؛ 1886ء سے ہسپانویوں سے لڑے اور 1903ء سے تقریباً تین ہزار پیروکاروں کے ساتھ امریکا کے خلاف جنگ کی، اپنی خودمختاری چھوڑنے یا 1903ء کے انسدادِ غلامی قانون کے تحت غلام آزاد کرنے سے انکار کیا۔ 22 اکتوبر 1905ء کو دریائے مالالا کی جنگ میں مارے گئے۔"
