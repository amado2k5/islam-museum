summary:
  ar: "باحثة مصرية أمريكية في دراسات المرأة والدين، وُلدت سنة 1940، أستاذة بمدرسة هارفارد للاهوت. تفحص كتبها المرأة والجندر والحجاب في التاريخ الإسلامي، ومنها «المرأة والجندر في الإسلام» و«ممر الحدود» و«ثورة هادئة»."
  en: "Egyptian-American scholar of women’s studies and religion, born in 1940, professor at Harvard Divinity School. Her books examine women, gender and the veil in Islamic history, including Women and Gender in Islam, A Border Passage and A Quiet Revolution."
  ur: "مصری نژاد امریکی محققہِ مطالعۂ نسواں و دین، 1940 میں پیدا ہوئیں اور ہارورڈ ڈیوینٹی اسکول کی پروفیسر۔ ان کی کتب اسلامی تاریخ میں عورت، صنفی مسائل اور حجاب کا جائزہ لیتی ہیں؛ کتابوں میں Women and Gender in Islam، A Border Passage اور A Quiet Revolution شامل ہیں۔"
  es: "Académica egipcio-estadounidense especializada en estudios de la mujer y religión, nacida en 1940, profesora en la Facultad de Teología de Harvard. Sus libros examinan a las mujeres, el género y el velo en la historia islámica, entre ellos *Mujeres y género en el Islam*, *Un paso fronterizo* y *Una revolución silenciosa*."
  fr: "Universitaire égypto-américaine spécialiste des études féminines et des religions, née en 1940, professeure à la Harvard Divinity School. Ses ouvrages analysent les femmes, le genre et le voile dans l'histoire islamique, notamment *Women and Gender in Islam*, *A Border Passage* et *A Quiet Revolution*."
