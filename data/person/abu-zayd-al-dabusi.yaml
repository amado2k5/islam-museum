summary:
  ar: "أبو زيد عبد الله بن عمر بن عيسى الدبوسي، الفقيه الحنفي؛ كان من كبار أصحاب الإمام أبي حنيفة ممن يضرب بهم المثل، وهو أول من وضع علم الخلاف وأبرزه إلى الوجود؛ له كتاب الأسرار وتقويم للأدلة وغيره من التصانيف والتعاليق {cite:wafayat-ayan}."
  en: "Abu Zayd Abdallah b. Umar al-Dabusi (d. 430 Bukhara) — Hanafi jurist, counted among Abu Hanifa's greatest companions; credited as the first to compose the discipline of legal disagreement (ilm al-khilaf) {cite:wafayat-ayan}."
  fr: "Abu Zayd Abdallah b. Umar al-Dabusi (mort en 430 à Boukhara), juriste hanafite compté parmi les plus grands compagnons d'Abu Hanifa ; on lui attribue la première composition dans la discipline des divergences juridiques (ilm al-khilaf) {cite:wafayat-ayan}."
  es: "Abu Zayd Abdallah b. Umar al-Dabusi (m. 430 Bukhara) — Jurista hanafí, contado entre los más grandes compañeros de Abu Hanifa; se le atribuye ser el primero en componer la disciplina del desacuerdo legal (ilm al-khilaf) {cite:wafayat-ayan}."
  ur: "ابو زید عبداللہ بن عمر الدبوسی ⁦(متوفی 430 بخارا)⁩ - حنفی فقیہ، ابو حنیفہ کے عظیم ترین صحابہ میں شمار ہوتے ہیں۔ قانونی اختلاف ⁦(علم الخلافہ)⁩ کے نظم و ضبط کو تحریر کرنے والے پہلے شخص کے طور پر تسلیم کیا جاتا ہے۔"
  tr: "Hanefi fıkıhçısı Ebu Zeyd Abdullah ibn Ömer ibn İsa el-Dabusi; örnek alınması gereken İmam Ebu Hanife'nin büyük sahabelerinden biriydi. İhtilaf ilmini ilk kuran ve ortaya koyan kişidir. Sırlar Kitabı, Deliller İncelemesi ve diğer yazıları ve tefsirleri bulunmaktadır."
  id: "Abu Zayd Abdullah ibn Umar ibn Isa al-Dabusi, seorang ahli hukum Hanafi; beliau adalah salah satu sahabat besar Imam Abu Hanifa, yang merupakan teladan yang patut diteladani. Beliau adalah orang pertama yang mengembangkan ilmu perselisihan dan mewujudkannya. Beliau memiliki kitab rahasia, tinjauan dalil-dalil, dan tulisan serta tafsir lainnya."
