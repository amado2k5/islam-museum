id: person/al-mansur-ibn-abi-amir
class: person
label: { ar: "المنصور بن أبي عامر" }
summary:
  ar: "محمد بن أبي عامر، نقله الحكم المستنصر من خطة القضاء إلى وزارته فلما توفي الحكم حجب ابنه هشاماً المؤيد وغلب عليه ومنع الوزراء من الوصول إليه إلا في النادر؛ استدعى أهل العدوة من رجال زناتة والبرابرة فرتب منهم جنداً وقدم رجال البرابرة وأخر رجال العرب وأسقطهم عن مراتبهم، وابتنى لنفسه مدينة فنزلها وسماها الزاهرة، وردد الغزو بنفسه إلى دار الحرب فغزا اثنتين وخمسين غزوة لم ينكسر له فيها راية ولا فل له حاجز، وطلب من هشام أن يوليه عهده فأجابه بإنشاء أبي حفص بن برد، وهلك أعظم ما كان ملكاً سنة 384هـ بمدينة سالم منصرفه من بعض غزواته {cite:tarikh-ibn-khaldun-ibar p. 993-994}. وردد الغزو بنفسه إلى دار الحرب فغزا ستاً وخمسين غزوة في سائر أيام ملكه لم تنتكس له فيها راية ولا فل له جيش، وفتك بملوك البربر حتى استوثق له ملك المغرب، ولما سخط زيري بن عطية أوقع به ابنه عبد الملك سنة ست وثمانين ونزل بفاس وملكها وشرّد زيرياً إلى تاهرت، ولم يجد المنصور بشنت ياقوب إلا شيخاً من الرهبان جالساً على القبر فسأله عن مقامه فقال أؤنس يعقوب فأمر بالكف عنه، وقال لشعلة ليلة طال سهره الملك لا ينام إذا نامت الرعية، وهلك سنة أربع وتسعين وثلاثمائة بمدينة سالم منصرفاً من بعض غزواته ودفن هنالك وقيل مكتوب على قبره آثاره تنبئك عن أخباره حتى كأنك بالعيان تراه تالله لا يأتي الزمان بمثله أبداً ولا يحمي الثغور سواه {cite:nafh-tib-maqqari p. 434, 452}."
  en: "Muhammad b. Abi Amir, moved by al-Hakam II from the qadi post to the vizierate, hijacked the boy caliph Hisham, built his city al-Zahira, campaigned fifty-two times without a single banner broken, and had himself designated heir — dying in 384 returning from a raid {cite:tarikh-ibn-khaldun-ibar p. 993-994}."
