id: person/al-mansur-ibn-abi-amir
class: person
label: { ar: "المنصور بن أبي عامر", en: "al-Mansur ibn Abi Amir", fr: "al-Mansur ibn Abi Amir", es: "al-Mansur ibn Abi Amir", ur: "المنصور ابن ابی عامر" }
summary:
  ar: "محمد بن أبي عامر، نقله الحكم المستنصر من خطة القضاء إلى وزارته فلما توفي الحكم حجب ابنه هشاماً المؤيد وغلب عليه ومنع الوزراء من الوصول إليه إلا في النادر؛ استدعى أهل العدوة من رجال زناتة والبرابرة فرتب منهم جنداً وقدم رجال البرابرة وأخر رجال العرب وأسقطهم عن مراتبهم، وابتنى لنفسه مدينة فنزلها وسماها الزاهرة، وردد الغزو بنفسه إلى دار الحرب فغزا اثنتين وخمسين غزوة لم ينكسر له فيها راية ولا فل له حاجز، وطلب من هشام أن يوليه عهده فأجابه بإنشاء أبي حفص بن برد، وهلك أعظم ما كان ملكاً سنة 384هـ بمدينة سالم منصرفه من بعض غزواته {cite:tarikh-ibn-khaldun-ibar p. 993-994}. وردد الغزو بنفسه إلى دار الحرب فغزا ستاً وخمسين غزوة في سائر أيام ملكه لم تنتكس له فيها راية ولا فل له جيش، وفتك بملوك البربر حتى استوثق له ملك المغرب، ولما سخط زيري بن عطية أوقع به ابنه عبد الملك سنة ست وثمانين ونزل بفاس وملكها وشرّد زيرياً إلى تاهرت، ولم يجد المنصور بشنت ياقوب إلا شيخاً من الرهبان جالساً على القبر فسأله عن مقامه فقال أؤنس يعقوب فأمر بالكف عنه، وقال لشعلة ليلة طال سهره الملك لا ينام إذا نامت الرعية، وهلك سنة أربع وتسعين وثلاثمائة بمدينة سالم منصرفاً من بعض غزواته ودفن هنالك وقيل مكتوب على قبره آثاره تنبئك عن أخباره حتى كأنك بالعيان تراه تالله لا يأتي الزمان بمثله أبداً ولا يحمي الثغور سواه {cite:nafh-tib-maqqari p. 434, 452}."
  en: "Muhammad b. Abi Amir, moved by al-Hakam II from the qadi post to the vizierate, hijacked the boy caliph Hisham, built his city al-Zahira, campaigned fifty-two times without a single banner broken, and had himself designated heir — dying in 384 returning from a raid {cite:tarikh-ibn-khaldun-ibar p. 993-994}."
  fr: "Muhammad b. Abi Amir, déplacé par al-Hakam II du poste de qadi au vizirat, a détourné le calife garçon Hisham, construit sa ville al-Zahira, fait campagne cinquante-deux fois sans qu'une seule bannière ne soit brisée, et s'est fait désigner héritier - mourant en 384 revenant d'un raid {cite:tarikh-ibn-khaldun-ibar p. 993-994}."
  es: "Muhammad b. Abi Amir, trasladado por al-Hakam II del puesto de cadí al de visir, raptó al joven califa Hisham, construyó su ciudad al-Zahira, realizó cincuenta y dos campañas sin que se rompiera ni una sola bandera y se hizo designar heredero, muriendo en 384 al regresar de una incursión {cite:tarikh-ibn-khaldun-ibar p. 993-994}."
  ur: "محمد بی ابی عامر، الحکم ثانی کے ذریعہ قاضی عہدے سے وزیر کی طرف منتقل ہوا، اس نے لڑکے خلیفہ ہشام کو ہائی جیک کیا، اس کا شہر الزہرہ بنایا، باون بار مہم چلائی اور ایک بھی جھنڈا ٹوٹے بغیر، اور خود کو وارث نامزد کیا - 384 میں ایک چھاپے سے واپس آتے ہوئے انتقال کر گئے۔ 993-994}۔"
  tr: "Muhammed bin Ebi Amir, el-Hakam el-Mustansir tarafından yargıçlıktan vezirine atandı. El-Hakam öldüğünde, oğlu Hişam el-Muayyad gölgede kaldı ve nadiren de olsa ona ulaşamadı. Adwa halkını, Zenata ve Berberiler dahil olmak üzere çağırdı, asker ayarladı, Berberileri öne çıkardı ve onları saflarından uzaklaştırdı. Kendine bir şehir kurdu, oraya yerleşti ve adını Al-Zahira koydu. Bizzat savaş alanına döndü, elli iki savaşta ne bir bayrak kırılmadı ne de bir engel kırılmadı. Hiham'dan kendisini halefi olarak atamasını istedi, o da Abu Hafs ibn Burd'u atadı. En büyük saltanatları, 384 Hicri'de Salim şehrinde, bazı seferleriyle meşgul olarak sona erdi {alıntı: Tarikh-ibn-khaldun-ibar, s. 993-994}. Seferi kendisi de savaş alanına taşıdı, saltanatı boyunca elli altı sefer başlattı; ne bayrağı ne de ordusu yenildi. Berberi kralları mağlup etti, ta ki Mağrip kralı otoritesini sağlayana kadar. Ziri bin Atiyah öfkelenince, oğlu Abdülmalik onu seksen altıncı yılda yakaladı, Fez'e yerleşti, şehri yönetti ve Tahir'e kaçtı. El-Mansur, Yaqub'un kokusunu sadece mezarın yanında oturan bir keşiş dışında buldu ve ona durumunu sordu. Şöyle dedi: 'Yaqub Ya'qub'un yoldaşı mı?' Durmasını emretti ve Şula'ya, 'Gece olsun' dedi Kral uzun süre uyanık kaldı, sürü uyurken uyumadı. 394 Hicri yılında Salem şehrinde öldü, bazı seferlerini bırakıp orada gömüldü. Mezarında, haberini size bildiren izler olduğu söylenir, öyle ki onu kendi gözlerinizle görürsünüz. Tanrı aşkına, zaman asla kendi türünü getirmez ve sınırları koruyan kişi yoktur, sadece O {cite:nafh-tib-maqqari, s. 434, 452}."
  id: "Muhammad ibn Abi Amir dipindahkan oleh al-Hakam al-Mustansir dari jabatan hakim ke wazirnya. Ketika al-Hakam meninggal, putranya Hisham al-Mu'ayyad terpinggirkan dan kewalahan, dan para menteri tidak dapat menghubunginya kecuali dalam kasus yang jarang. Ia memanggil rakyat Adwa, termasuk orang-orang Zenata dan Berber, mengatur tentara, membawa orang Berber, dan mencopot mereka dari barisan mereka. Ia membangun sebuah kota untuk dirinya sendiri, menetap di sana, dan menamainya Al-Zahira. Ia secara pribadi kembali ke medan perang, bertempur dalam lima puluh dua pertempuran di mana tidak ada panji yang dipecahkan maupun penghalang yang dipecahkan. Ia meminta Hisham untuk mengangkatnya sebagai penerusnya, dan ia merespons dengan mengangkat Abu Hafs ibn Burd. Masa pemerintahannya yang paling hebat gugur pada tahun 384 H di kota Salim, terganggu oleh beberapa kampanyenya {cite:Tarikh-ibn-khaldun-ibar hlm. 993-994}. Ia mengulangi kampanye itu sendiri di medan perang, melancarkan lima puluh enam kampanye sepanjang pemerintahannya, di mana baik panji maupun pasukannya tidak dikalahkan. Ia mengalahkan raja-raja Berber sampai raja Maghreb mengamankan otoritasnya. Ketika Ziri ibn Atiyah marah, putranya Abd al-Malik menangkapnya pada tahun delapan puluh enam, menetap di Fez, memerintahnya, dan melarikan diri ke Tahert. Al-Mansur menemukan aroma Yaqub kecuali seorang biksu yang duduk di dekat makam dan menanyakan statusnya. Ia berkata, 'Apakah Yaqub adalah sahabat Ya'qub?' Ia memerintahkan penghentiannya dan berkata kepada Shula, 'Selamat malam Raja tetap terjaga lama, tidak tidur saat kawanan ternak tidur. Ia meninggal pada tahun 394 H di kota Salem, meninggalkan beberapa kampanyenya dan dimakamkan di sana. Dikatakan bahwa makamnya membawa jejak yang memberi tahu kabarnya, sampai-sampai kau melihatnya dengan mata kepala sendiri. Demi Tuhan, waktu tidak pernah membawa semacam itu, dan tidak ada yang melindungi perbatasan kecuali Dia {cite:nafh-tib-maqqari, hlm. 434, 452}."
