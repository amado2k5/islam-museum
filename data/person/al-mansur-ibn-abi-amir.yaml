id: person/al-mansur-ibn-abi-amir
class: person
label: { ar: "المنصور بن أبي عامر" }
summary:
  ar: "محمد بن أبي عامر، نقله الحكم المستنصر من خطة القضاء إلى وزارته فلما توفي الحكم حجب ابنه هشاماً المؤيد وغلب عليه ومنع الوزراء من الوصول إليه إلا في النادر؛ استدعى أهل العدوة من رجال زناتة والبرابرة فرتب منهم جنداً وقدم رجال البرابرة وأخر رجال العرب وأسقطهم عن مراتبهم، وابتنى لنفسه مدينة فنزلها وسماها الزاهرة، وردد الغزو بنفسه إلى دار الحرب فغزا اثنتين وخمسين غزوة لم ينكسر له فيها راية ولا فل له حاجز، وطلب من هشام أن يوليه عهده فأجابه بإنشاء أبي حفص بن برد، وهلك أعظم ما كان ملكاً سنة 384هـ بمدينة سالم منصرفه من بعض غزواته {cite:tarikh-ibn-khaldun-ibar p. 993-994}."
  en: "Muhammad b. Abi Amir, moved by al-Hakam II from the qadi post to the vizierate, hijacked the boy caliph Hisham, built his city al-Zahira, campaigned fifty-two times without a single banner broken, and had himself designated heir — dying in 384 returning from a raid {cite:tarikh-ibn-khaldun-ibar p. 993-994}."
