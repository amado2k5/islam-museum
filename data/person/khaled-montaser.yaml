    note: "In at least two independent interviews Montaser describes himself as a Muslim: in a press-reported interview of about 2011 he called himself «مصري مسلم ليبرالي» (an Egyptian Muslim liberal), and in an Ahl Masr interview of 9 October 2019 he framed his criticism of clerics as a defence of Islam and 'the duty of every Muslim'; in an Al-Masry Al-Youm interview he calls the Quran a sacred divine text and states this as his certainty. No sourced statement of his renounces Islam. Opponents in the Salafi and Islamist press nevertheless publicly label him an atheist, and Dar Al-Iftaa's fatwa 292399 of 2011 ruled only conditionally on a phrase of his, without declaring him personally an unbeliever. Because his religious classification is publicly contested, the museum records unknown under its two-source and doubt rules: his own attested self-description is set out in full in the prose, and the contest is recorded here rather than resolved."
