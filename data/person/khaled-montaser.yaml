summary:
  ar: "طبيب وكاتب ومقدّم برامج مصري، وُلد في الجيزة سنة 1960 ونشأ في دمياط. تخرج في طب القاهرة سنة 1983 وتخصص في الأمراض الجلدية والتناسلية، ورأس قسمها بهيئة قناة السويس، ثم صار من أشهر كتّاب الأعمدة الصحفية في مصر ومقدّم برنامج «خارج النص» على قناة أون، وله كتب كثيرة في نقد الخرافة والعلم الزائف."
  en: "Egyptian physician, writer and television presenter, born in Giza in 1960 and raised in Damietta. He graduated from Cairo University's Faculty of Medicine in 1983, specialised in dermatology and venereology and headed that department at the Suez Canal Authority, then became one of Egypt's best-known newspaper columnists and the presenter of Kharej Al-Nass (Outside the Text) on ON TV, with many books against superstition and pseudoscience."
  ur: "مصری طبیب، مصنف اور ٹیلی ویژن پیش کار، جو 1960 میں گیزا میں پیدا ہوئے اور دمیاط میں پلے بڑھے۔ انہوں نے 1983 میں جامعہ قاہرہ کے کلیۂ طب سے گریجویشن کی، امراضِ جلد و تناسل میں تخصص کیا اور سویز کینال اتھارٹی میں اس شعبے کے سربراہ رہے، پھر مصر کے مشہور ترین اخبار نویسوں میں سے ایک اور اون ٹی وی کے پروگرام «خارج النص» کے میزبان بنے؛ خرافات اور جعلی سائنس کے نقد پر ان کی کئی کتابیں ہیں۔"
  es: "Médico, escritor y presentador de televisión egipcio, nacido en Giza en 1960 y criado en Damietta. Se graduó en la Facultad de Medicina de la Universidad de El Cairo en 1983, se especializó en dermatología y venereología y dirigió ese departamento en la Autoridad del Canal de Suez. Posteriormente, se convirtió en uno de los columnistas de prensa más conocidos de Egipto y en presentador de Kharej Al-Nass (Fuera del Texto) en ON TV, y es autor de numerosos libros contra la superstición y la pseudociencia."
  fr: "Médecin, écrivain et présentateur de télévision égyptien, né à Gizeh en 1960 et ayant grandi à Damiette. Diplômé de la faculté de médecine de l'université du Caire en 1983, il s'est spécialisé en dermatologie et vénéréologie et a dirigé ce département à l'Autorité du canal de Suez. Il est ensuite devenu l'un des chroniqueurs les plus connus d'Égypte et le présentateur de l'émission « Kharej Al-Nass » (Hors du texte) sur la chaîne ON TV. Il est l'auteur de nombreux ouvrages dénonçant la superstition et la pseudoscience."
  tr: "1960 yılında Giza'da doğmuş ve Damietta'da büyümüş Mısırlı doktor, yazar ve TV sunucusudur. 1983 yılında Kahire Tıp Fakültesi'nden dermatoloji ve zühur bilimi alanında uzmanlaşarak mezun oldu, Süveyş Kanalı Otoritesi'nde bölüm başkanlığını yaptı, ardından Mısır'ın en ünlü köşe yazarlarından biri ve On TV'de yayınlanan \"Off the Text\" programının sunucusu oldu. Batıl inançları ve sahte bilimi eleştiren birçok kitap yazdı."
  id: "Seorang dokter, penulis, dan pembawa acara TV asal Mesir, lahir di Giza pada tahun 1960 dan dibesarkan di Damietta. Ia lulus dari Fakultas Kedokteran Kairo pada tahun 1983 dengan spesialisasi dermatologi dan venerologi, memimpin departemennya di Otoritas Terusan Suez, kemudian menjadi salah satu kolumnis paling terkenal di Mesir dan pembawa acara program \"Off the Text\" di On TV. Ia telah menulis banyak buku yang mengkritik takhayul dan pseudosains."
