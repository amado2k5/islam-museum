id: person/al-numan-ibn-imri-al-qays
class: person
label: { ar: "النعمان بن امرئ القيس", en: "al-Nu'man ibn Imri' al-Qays", fr: "al-Nu'man ibn Imri' al-Qays", es: "al-Nu'man ibn Imri' al-Qays", ur: "النعمان بن عمری القیس" }
summary:
  ar: "النعمان بن امرئ القيس بن الشقيقة بنت أبي ربيعة بن ذهل بن شيبان ملك الحيرة؛ عند البلاذري بنى الخورنق لبهرام جور بن يزدجرد بن بهرام بن سابور ذي الأكتاف وكان بهرام جور في حجرته حين ترك ملكه وساح فذكره عدي بن زيد العبادي في شعره."
  en: "al-Nu'man ibn Imri' al-Qays ibn al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban, king of al-Hira; in al-Baladhuri he built al-Khawarnaq for Bahram Jur ibn Yazdgard — who was in his ward when he left his kingdom and wandered, as Adi ibn Zayd al-Ibadi's verse records."
  fr: "al-Nu'man ibn Imri' al-Qays ibn al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban, roi d'al-Hira ; à al-Baladhuri, il a construit al-Khawarnaq pour Bahram Jur ibn Yazdgard – qui était dans sa paroisse quand il a quitté son royaume et a erré, comme le rapporte le verset d’Adi ibn Zayd al-Ibadi."
  es: "al-Nu'man ibn Imri' al-Qays ibn al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban, rey de al-Hira; en al-Baladhuri construyó al-Khawarnaq para Bahram Jur ibn Yazdgard, quien estaba en su barrio cuando dejó su reino y vagó, como registra el verso de Adi ibn Zayd al-Ibadi."
  ur: "النعمان بن عمری القیس بن الشقیق بنت ابی ربیعہ بن دہل بن شیبان، شاہ الحیرہ۔ البلادوری میں اس نے بہرام جور بن یزدگرد کے لیے الخوارناق تعمیر کروایا - جو اس وقت اپنے وارڈ میں تھا جب وہ اپنی سلطنت چھوڑ کر گھوم رہا تھا، جیسا کہ عدی ابن زید العبادی کی آیت ریکارڈ کرتی ہے۔"
  tr: "Al-Nu'man ibn Imru' al-Qais ibn al-Shaqiqa bint Abi Rabi'ah ibn Dhuhl ibn Shayban, el-Hirah kralı; el-Baladhuri'ye göre, el-Hurnag Bahram Jur ibn Yazdegerd ibn Bahram ibn Sabur Dhi al-Aktaf tarafından inşa edilmiştir. Bahram Jur, krallığından ayrılırken odasındaydı ve bir kargaşa içindeydi, bu yüzden Adi ibn Zayd al-Abbadi şiirlerinde ondan bahsetmiştir."
  id: "Al-Nu'man ibn Imru' al-Qais ibn al-Shaqiqa bint Abi Rabi'ah ibn Dhuhl ibn Shayban, raja al-Hirah; menurut al-Baladhuri, al-Khurnag dibangun oleh Bahram Jur ibn Yazdegerd ibn Bahram ibn Sabur Dhi al-Aktaf. Bahram Jur berada di kamarnya saat meninggalkan kerajaannya dan sedang dalam keributan, sehingga Adi ibn Zayd al-Abbadi menyebutnya dalam puisinya."
