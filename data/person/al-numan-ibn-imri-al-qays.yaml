summary:
  ar: "النعمان بن امرئ القيس بن الشقيقة بنت أبي ربيعة بن ذهل بن شيبان ملك الحيرة؛ عند البلاذري بنى الخورنق لبهرام جور بن يزدجرد بن بهرام بن سابور ذي الأكتاف وكان بهرام جور في حجرته حين ترك ملكه وساح فذكره عدي بن زيد العبادي في شعره."
  en: "al-Nu'man ibn Imri' al-Qays ibn al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban, king of al-Hira; in al-Baladhuri he built al-Khawarnaq for Bahram Jur ibn Yazdgard — who was in his ward when he left his kingdom and wandered, as Adi ibn Zayd al-Ibadi's verse records."
