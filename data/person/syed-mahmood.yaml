summary:
  ar: "قاضٍ وفقيه قانوني هندي (1850-1903) من دلهي، الابن الثاني لسيد أحمد خان. درس في إنجلترا ودُعي إلى نقابة المحاماة سنة 1872، ثم صار قاضي محكمة الله آباد العليا (1887-1893)، أولَ هندي يُعيَّن فيها وأولَ مسلم يتولى قضاء محكمة عليا في الهند البريطانية، واشتهر بأحكامه الطويلة المنشورة في تقارير القانون الهندية. ساعد والده في تأسيس الكلية الشرقية الأنجلو-محمدية في عليكرة وكتب «تاريخ التعليم الإنجليزي في الهند» (1895)."
  en: "Indian judge and jurist (1850–1903) of Delhi, the second son of Syed Ahmad Khan. Educated in England and called to the Bar in 1872, he became a puisne judge of the Allahabad High Court (1887–1893) — the first Indian appointed to that court and the first Muslim to serve as a High Court judge in British India — known for his long judgments published in the Indian Law Reports. He helped his father found the Muhammadan Anglo-Oriental College at Aligarh and wrote A History of English Education in India (1895)."
  ur: "ہندوستانی جج اور ماہر قانون ⁦(1850ء–1903ء)⁩ جن کا تعلق دلی سے تھا اور جو سر سید احمد خان کے دوسرے بیٹے تھے۔ انگلستان میں تعلیم پائی اور 1872ء میں بار میں داخل ہوئے؛ الٰہ آباد ہائی کورٹ کے جج بنے ⁦(1887ء–1893ء)⁩، اس عدالت میں مقرر ہونے والے پہلے ہندوستانی اور برطانوی ہند میں ہائی کورٹ کے پہلے مسلم جج۔ انھوں نے والد کی علی گڑھ میں محمڈن اینگلو اورینٹل کالج کے قیام میں مدد کی۔"
  es: "Juez y jurista indio (1850-1903) de Delhi, segundo hijo de Syed Ahmad Khan. Educado en Inglaterra y admitido en el Colegio de Abogados en 1872, se convirtió en juez adjunto del Tribunal Superior de Allahabad (1887-1893), siendo el primer indio designado para dicho tribunal y el primer musulmán en ejercer como juez del Tribunal Superior en la India británica. Fue conocido por sus extensas sentencias publicadas en los Indian Law Reports. Colaboró con su padre en la fundación del Muhammadan Anglo-Oriental College en Aligarh y escribió *A History of English Education in India* (1895)."
  fr: "Juge et magistrat indien (1850-1903) de Delhi, second fils de Syed Ahmad Khan. Formé en Angleterre et admis au barreau en 1872, il devint juge puîné de la Haute Cour d'Allahabad (1887-1893) – le premier Indien nommé à cette cour et le premier musulman à y siéger en Inde britannique – réputé pour ses longs jugements publiés dans les Indian Law Reports. Il aida son père à fonder le Muhammadan Anglo-Oriental College d'Aligarh et écrivit une Histoire de l'éducation anglaise en Inde (1895)."
  tr: "Delhi'den Hintli bir yargıç ve hukuk hukukçusu (1850-1903), Syed Ahmad Khan'ın ikinci oğludur. İngiltere'de eğitim gördü ve 1872'de baroya kabul edildi, ardından Allahabad Yüksek Mahkemesi'nde (1887-1893) yargıç oldu; burada atanan ilk Hintli ve Britanya Hindistanı'nda Yüksek Mahkeme yargıcı olarak görev yapan ilk Müslüman oldu; ayrıca Hindistan hukuk raporlarında yayımlanan uzun kararlarıyla ün kazandı. Babası Aligarh'da Anglo-Mohammadiya Doğu Koleji'ni kurmasına yardımcı oldu ve 'Hindistan'da İngiliz Eğitimi Tarihi' (1895) adlı kitabı yazdı."
  id: "Seorang hakim dan ahli hukum India (1850-1903) dari Delhi, putra kedua Syed Ahmad Khan. Ia belajar di Inggris dan diangkat menjadi pengacara pada tahun 1872, kemudian menjadi hakim di Pengadilan Tinggi Allahabad (1887-1893), orang India pertama yang diangkat di sana dan Muslim pertama yang menjabat sebagai hakim Pengadilan Tinggi di India Britania, dan ia menjadi terkenal karena putusan panjangnya yang diterbitkan dalam laporan hukum India. Ia membantu ayahnya mendirikan Anglo-Mohammadiya Eastern College di Aligarh dan menulis 'History of English Education in India' (1895)."
