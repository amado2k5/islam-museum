summary:
  ar: "قاضٍ وفقيه قانوني هندي (1850-1903) من دلهي، الابن الثاني لسيد أحمد خان. درس في إنجلترا ودُعي إلى نقابة المحاماة سنة 1872، ثم صار قاضي محكمة الله آباد العليا (1887-1893)، أولَ هندي يُعيَّن فيها وأولَ مسلم يتولى قضاء محكمة عليا في الهند البريطانية، واشتهر بأحكامه الطويلة المنشورة في تقارير القانون الهندية. ساعد والده في تأسيس الكلية الشرقية الأنجلو-محمدية في عليكرة وكتب «تاريخ التعليم الإنجليزي في الهند» (1895)."
  en: "Indian judge and jurist (1850–1903) of Delhi, the second son of Syed Ahmad Khan. Educated in England and called to the Bar in 1872, he became a puisne judge of the Allahabad High Court (1887–1893) — the first Indian appointed to that court and the first Muslim to serve as a High Court judge in British India — known for his long judgments published in the Indian Law Reports. He helped his father found the Muhammadan Anglo-Oriental College at Aligarh and wrote A History of English Education in India (1895)."
  ur: "ہندوستانی جج اور ماہر قانون (1850ء–1903ء) جن کا تعلق دلی سے تھا اور جو سر سید احمد خان کے دوسرے بیٹے تھے۔ انگلستان میں تعلیم پائی اور 1872ء میں بار میں داخل ہوئے؛ الٰہ آباد ہائی کورٹ کے جج بنے (1887ء–1893ء)، اس عدالت میں مقرر ہونے والے پہلے ہندوستانی اور برطانوی ہند میں ہائی کورٹ کے پہلے مسلم جج۔ انھوں نے والد کی علی گڑھ میں محمڈن اینگلو اورینٹل کالج کے قیام میں مدد کی۔"
