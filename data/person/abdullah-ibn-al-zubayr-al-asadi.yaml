label: { ar: "عبد الله بن الزبير الأسدي", en: "'Abd Allah ibn al-Zubayr al-Asadi", fr: "Abd Allah ibn al-Zubayr al-Asadi", es: "'Abd Allah ibn al-Zubayr al-Asadi", ur: "عبد اللہ بن زبیر الاسدی" }
summary:
  ar: "خرج مذعوراً حين قتل الحجاج عمير بن ضابىء من بعث المهلب، فلقيه رجل من قومه يقال له إبراهيم فقال الشر الشر قتل عميراً من بعث المهلب وأنشأ والا فما الحجاج مغمد سيفه مدى الدهر حتى يترك الطفل أشيبا {cite:muruj-al-dhahab p. 122}."
  en: "The terrified deserter who met Ibrahim by the bridle-post after 'Umayr's beheading — 'al-Hajjaj will not sheathe his sword till he leaves the infant grey' {cite:muruj-al-dhahab p. 122}."
  fr: "Le déserteur terrifié qui rencontra Ibrahim près du poteau d'attache après la décapitation d''Umayr — « al-Hajjaj ne rengainera pas son épée avant d'avoir blanchi le nourrisson » {cite:muruj-al-dhahab p. 122}."
  es: "El aterrorizado desertor que se encontró con Ibrahim junto al poste de las bridas después de la decapitación de Umayr: «Al-Hajjaj no envainará su espada hasta que deje al infante canoso» {cita:muruj-al-dhahab p. 122}."
  ur: "عمیر کا سر قلم کرنے کے بعد لگام کے ذریعے ابراہیم سے ملاقات کرنے والا خوفزدہ صحرائی - 'الحجاج اس وقت تک اپنی تلوار میان نہیں کرے گا جب تک کہ وہ شیر خوار بچے کو نہیں چھوڑ دے گا'۔ 122}۔"
  tr: "El-Haccac, El-Muhallab'ın seferinden Umair bin Dabi'yi öldürünce panik içinde dışarı çıktı. Halkından İbrahim adında bir adam onunla karşılaştı ve \"Ne kötü, ne kötü! El-Muhallab'ın seferinden Umair'i öldürdü!\" dedi. Sonra da şu ayeti okudu: \"Aksi takdirde, El-Haccac, çocuğu saçları ağarana kadar sonsuza dek kılıcını kınından çıkarmayacak.\" {cite:muruj-al-dhahab s. 122}"
  id: "Ia keluar dengan panik ketika Al-Hajjaj membunuh Umair bin Dabi’ dari ekspedisi Al-Muhallab. Seorang pria dari kaumnya bernama Ibrahim menemuinya dan berkata, “Kejahatan, kejahatan, dia membunuh Umair dari ekspedisi Al-Muhallab.” Kemudian ia membacakan, “Jika tidak, Al-Hajjaj tidak akan menyarungkan pedangnya selama-lamanya sampai ia membuat anak itu beruban.” {kutipan:muruj-al-dhahab hlm. 122}"
