summary:
  ar: "فقيه ومفتٍ بريطاني من مدينة ليستر، مؤسس دار الإفتاء فيها وكبير مفتييها ومدرّس بجامعة علوم القرآن فيها. وُلد سنة 1976، وتخرّج في دار العلوم ببري، ثم درس في كراتشي ودمشق، وله مؤلفات في الفقه والعلاقات الزوجية."
  en: "British jurist and mufti from Leicester, founder and Chief Mufti of Darul Ifta Leicester and a teacher at Jamiah Uloom-ul-Quran in the same city. Born in 1976, he graduated from Darul Uloom Bury and studied further in Karachi and Damascus; his books include works on jurisprudence and marital relations."
  ur: "لیسٹر سے تعلق رکھنے والے برطانوی فقیہ و مفتی، دار الافتاء لیسٹر کے بانی و سربراہ مفتی اور جامعہ علوم القرآن میں مدرس۔ 1976 میں پیدا ہوئے، دار العلوم بری سے فارغ ہوئے، پھر کراچی و دمشق میں تعلیم حاصل کی؛ فقہ اور ازدواجی تعلقات پر ان کی تصانیف ہیں۔"
