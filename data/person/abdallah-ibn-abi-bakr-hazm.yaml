summary:
  ar: "عبد الله بن أبي بكر بن محمد بن عمرو بن حزم الأنصاري، من الطبقة الثانية من كتّاب المغازي؛ كان جده الأعلى عمرو بن حزم من كبار الصحابة بعثه النبي إلى أهل اليمن يفقههم في الدين، وكان أبوه أبو بكر قاضي المدينة لعمر بن عبد العزيز وهو الذي كتب إليه عمر بن عبد العزيز يطلب منه أن يجمع الحديث؛ وتزوج عبد الله فاطمة التي تروي عن عمرو بنت عبد الرحمن عن عائشة فتيسّر له جمع أحاديث كثيرة تتصل بالمغازي، ونقلت عنه أخبار كثيرة ذكرها ابن إسحاق والواقدي وابن سعد والطبري، وكان عظيم الأثر في كتب السير والمغازي {cite:duha-islam p. 642-643}."
  en: "Abdallah ibn Abi Bakr ibn Hazm — second-tier maghazi writer whose grandfather Amr ibn Hazm was the Prophet's envoy to Yemen and whose father received Umar II's hadith-collecting letter; his marriage into the A'isha–Amra transmission line made him a pillar of the sira books {cite:duha-islam p. 642-643}."
