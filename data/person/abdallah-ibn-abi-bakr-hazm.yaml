summary:
  ar: "عبد الله بن أبي بكر بن محمد بن عمرو بن حزم الأنصاري، من الطبقة الثانية من كتّاب المغازي؛ كان جده الأعلى عمرو بن حزم من كبار الصحابة بعثه النبي إلى أهل اليمن يفقههم في الدين، وكان أبوه أبو بكر قاضي المدينة لعمر بن عبد العزيز وهو الذي كتب إليه عمر بن عبد العزيز يطلب منه أن يجمع الحديث؛ وتزوج عبد الله فاطمة التي تروي عن عمرو بنت عبد الرحمن عن عائشة فتيسّر له جمع أحاديث كثيرة تتصل بالمغازي، ونقلت عنه أخبار كثيرة ذكرها ابن إسحاق والواقدي وابن سعد والطبري، وكان عظيم الأثر في كتب السير والمغازي {cite:duha-islam p. 642-643}."
  en: "Abdallah ibn Abi Bakr ibn Hazm — second-tier maghazi writer whose grandfather Amr ibn Hazm was the Prophet's envoy to Yemen and whose father received Umar II's hadith-collecting letter; his marriage into the A'isha–Amra transmission line made him a pillar of the sira books {cite:duha-islam p. 642-643}."
  fr: "Abdallah ibn Abi Bakr ibn Hazm — auteur de maghazi de la deuxième génération, dont l'arrière-grand-père Amr ibn Hazm fut l'envoyé du Prophète au Yémen et dont le père reçut la lettre d'Umar II demandant la collecte du hadith ; son mariage dans la lignée de transmission d'A'isha et d'Amra fit de lui un pilier des livres de sira {cite:duha-islam p. 642-643}."
  es: "Abdallah ibn Abi Bakr ibn Hazm — escritor maghazi de segunda categoría cuyo abuelo Amr ibn Hazm fue el enviado del Profeta a Yemen y cuyo padre recibió la carta de Umar II recopilando hadices; su matrimonio con una miembro de la línea de transmisión A'isha-Amra lo convirtió en un pilar de los libros de la sira {cite:duha-islam p. 642-643}."
  ur: "عبداللہ ابن ابی بکر بن حزم - دوسرے درجے کے مغازی مصنف جن کے دادا عمرو بن حزم یمن میں رسول اللہ کے ایلچی تھے اور جن کے والد کو عمر ثانی کا حدیث جمع کرنے والا خط ملا تھا۔ عائشہ-امرہ ٹرانسمیشن لائن میں ان کی شادی نے انہیں سیرت کی کتابوں کا ستون بنا دیا {حوالہ:دوہ اسلام صفحہ۔ 642-643}۔"
  tr: "Abdullah ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm el-Ensari, Maghazi edebiyatının ikinci kuşak yazarlarındandır; büyük dedesi Amr ibn Hazm, Peygamber'in Yemen halkına din öğretmek için gönderdiği kıdemli sahabelerden biriydi ve babası Ebu Bekr, Ömer ibn Abdülaziz'in Medine kadısıydı ve Ömer ibn Abdülaziz, hadisleri derlemesini rica eden mektubunu ona yazmıştı; Abdullah, Amr bint Abdülrahman'dan, o da Ayşe'den rivayet eden Fatıma ile evlendi, bu nedenle Maghazi ile ilgili birçok hadisi toplamak onun için kolay oldu ve İbn İshak, el-Vakidi, İbn Saad ve el-Taberi tarafından zikredilen birçok rivayet ondan aktarıldı ve biyografi ve Maghazi kitapları üzerinde büyük bir etkisi oldu. {Kaynak: Duha-İslam, s. 642-643}"
  id: "Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm al-Ansari, dari generasi kedua penulis Maghazi; kakek buyutnya, Amr ibn Hazm, adalah salah satu sahabat senior yang diutus Nabi kepada penduduk Yaman untuk mengajari mereka tentang agama, dan ayahnya, Abu Bakr, adalah hakim Madinah untuk Umar ibn Abd al-Aziz, dan kepadanyalah Umar ibn Abd al-Aziz menulis surat memintanya untuk mengumpulkan hadits; dan Abdullah menikahi Fatima, yang meriwayatkan hadits atas otoritas Amr bint Abd al-Rahman atas otoritas Aisyah, sehingga mudah baginya untuk mengumpulkan banyak hadits yang berkaitan dengan Maghazi, dan banyak riwayat yang diriwayatkan darinya yang disebutkan oleh Ibn Ishaq, al-Waqidi, Ibn Saad dan al-Tabari, dan ia memiliki pengaruh besar pada buku-buku biografi dan Maghazi {cite:duha-islam hlm. 642-643}."
