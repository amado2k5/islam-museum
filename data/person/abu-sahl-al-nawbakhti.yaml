label: { ar: "أبو سهل النوبختي", en: "Abu Sahl Al Nawbakhti", fr: "Abu Sahl Al Nawbakhti", es: "Abu Sahl Al Nawbakhti", ur: "ابو سہل النبختی۔" }
summary:
  ar: "أبو سهل بن نوبخت صاحب كتاب النهمطان الذي حكى ابن النديم في صدر مقالة الفلاسفة عنه تاريخ العلوم: أن صنوف العلوم ومعرفة المآخذ التي يدل عليها النجوم كانت عند أهل بابل فتعلم أهل مصر منهم وعمل بها أهل الهند، وأن الضحاك بن قي بنى مدينة اشتق اسمها من اسم المشتري جمع فيها العلم والعلماء وبنى بها اثني عشر قصرا على عدد بروج السماء وخزن كتب أهل العلم، حتى خرج الإسكندر ملك اليونانيين غازيا أرض فارس فهدم المدائن وأحرق ما كان منقوشا من العلم وأمر بنسخ ما كان مجموعا في الدواوين والخزائن بمدينة أصطخر وقلبه إلى اللسان الرومي والقبطي ثم أحرق بعد فراغه من نسخ حاجته ما كان مكتوبا بالفارسية وبالكشتج، وقد كانت ملوك فارس نسخت كتبا على عهد نبيهم زرادشت وجاماسب العالم وأحرزتها بناحية الهند والصين تحذيرا من فعلة الإسكندر، فدرس العلم بالعراق وصار لكل طائفة ملك فسميت ملوك الطوائف {cite:fihrist-ibn-al-nadim p. 331-333}. وكان أبو سهل إسماعيل بن علي بن نوبخت من كبار الشيعة وكان أبو الحسن الناشئ يقول إنه أستاذه وكان فاضلا عالما متكلما وله مجلس بحضرة جماعة من المتكلمين، وله رأي في القائم من آل محمد لم يسبق إليه وهو أنه كان يقول إن الإمام محمد بن الحسن ولكنه مات في الغيبة وكان يتلاها في الغيبة ابنه وكذلك فيما بعد من ولده إلى أن ينفذ الله حكمه في إظهاره، وكان ابن أبي العزاقر راسله يدعوه إلى الفتنة ويبذل له المعجز فقال للرسول أنا معجز ما أدري أي شيء هو ينبت صاحبك بمقدم رأسي الشعر حتى أومن به فما عاد إليه رسول بعد هذا، وله كتب منها كتاب الاستيفاء في الإمامة وكتاب التنبيه في الإمامة وكتاب الرد على الغلاة وكتاب نقض كتاب عبث الحكمة على الراوندي وكتاب نقض التاج على الراوندي يعرف بكتاب السبك وكتاب نقض اجتهاد الرأي على ابن الراوندي {cite:fihrist-ibn-al-nadim p. 251}"
  en: "Author of al-Nahmutan — the Fihrist's opening narrative of how the sciences passed from Babylon through Persia to the Greeks {cite:fihrist-ibn-al-nadim}"
  fr: "Auteur d'al-Nahmutan — le récit d'ouverture du Fihrist sur la façon dont les sciences passèrent de Babylone, par la Perse, aux Grecs {cite:fihrist-ibn-al-nadim}"
  es: "Autor de al-Nahmutan — la narración inicial de Fihrist sobre cómo las ciencias pasaron de Babilonia a través de Persia hasta los griegos {cite:fihrist-ibn-al-nadim}"
  ur: "النحموتن کے مصنف - فہرسٹ کی ابتدائی داستان کہ کس طرح علوم بابل سے فارس ہوتے ہوئے یونانیوں تک پہنچے۔"
  tr: "İbn el-Nadim'in \"İlimler Tarihi\" adlı eserinin girişinde bahsettiği \"El-Nahmatan\" kitabının yazarı Ebu Sahl ibn Nevbakht, çeşitli bilgi dallarının ve yıldızların işaret ettiği kaynakların anlaşılmasının Babil halkında olduğunu belirtir. Mısır halkı onlardan öğrendi ve Hindistan halkı bu bilgiyi benimsedi. El-Dahhak ibn Kayy, adını Jüpiter'den alan bir şehir kurdu ve orada bilgi ve âlimleri topladı. Gökyüzündeki on iki takımyıldıza karşılık gelen on iki saray inşa etti ve âlimlerin kitaplarını depoladı. Sonra Yunanların kralı Büyük İskender, Pers'i işgal etti, şehirleri yıktı ve yazılı bilgileri yaktı. İstikhr şehrindeki arşivlerde ve hazinelerde toplanan her şeyin kopyalanmasını, Yunanca ve Kıptice'ye çevrilmesini emretti. İhtiyaç duyduğu kopyalamayı tamamladıktan sonra, Farsça ve Keşti dilinde yazılanları yaktı. Pers kralları, peygamberleri Zerdüşt ve bilgin Cemasp zamanında kitaplar kopyalamış ve bunları İskender'in eylemlerine karşı bir uyarı olarak Hindistan ve Çin'de saklamışlardı. Böylece Irak'ta bilgi geriledi ve her hizbin kendi kralı oldu; bu nedenle \"Hizmetlerin Kralları\" adı verildi. (s. 331-333). Ebu Sahl İsmail ibn Ali ibn Nevbaht, önde gelen Şiilerden biriydi ve Ebu el-Hasan el-Nash'i onun hocası olduğunu söylemiştir. Erdemli, bilgili ve güzel konuşan bir ilahiyatçıydı ve bir grup ilahiyatçının huzurunda bir toplantı düzenledi. Muhammed ailesinden Kaim hakkında eşi benzeri görülmemiş bir görüşü vardı; İmam'ın Muhammed ibn el-Hasan olduğunu, ancak gaybet halinde öldüğünü, oğlunun gaybet halinde onun yerine geçeceğini ve ondan sonra gelenlerin de Allah'ın sihirle takdirini yerine getirene kadar böyle devam edeceğini söylerdi. İbn Abi el-Azaqir onunla mektuplaşır, onu fitneye çağırır ve ona mucizeler sunardı. Peygambere, “Ben bir mucizeyim, ne olduğunu bilmiyorum. Arkadaşının başımın ön tarafına saç çıkar ki ona inanayım” dedi. Bundan sonra ona hiçbir elçi gelmedi. İmamet Üzerine Teyit Kitabı, İmamet Üzerine Nasihat Kitabı, Aşırılıkçıları Reddetme Kitabı, el-Rawandi'nin Hikmetin Saçmalığı Kitabını Reddetme Kitabı, El-Rawandi'nin Taç Kitabını Reddetme Kitabı (Arındırma Kitabı olarak da bilinir) ve İbn el-Rawandi'nin Bağımsız Akıl Yürütmeyi Reddetme Kitabı da dahil olmak üzere kitapları vardı. {cite:fihrist-ibn-al-nadim s. 251}"
  id: "Abu Sahl ibn Nawbakht, penulis buku \"Al-Nahmatan,\" yang diceritakan oleh Ibn al-Nadim dalam pengantar \"Sejarah Ilmu Pengetahuan,\" menyatakan bahwa berbagai cabang ilmu pengetahuan dan pemahaman tentang sumber-sumber yang ditunjukkan oleh bintang-bintang telah ada pada penduduk Babilonia. Penduduk Mesir belajar dari mereka, dan penduduk India mengadopsi pengetahuan ini. Al-Dahhak ibn Qayy membangun sebuah kota yang namanya diambil dari Jupiter, mengumpulkan ilmu pengetahuan dan para cendekiawan di sana. Ia membangun dua belas istana, yang sesuai dengan dua belas rasi bintang di langit, dan menyimpan buku-buku para cendekiawan. Kemudian Alexander, raja Yunani, menyerbu Persia, menghancurkan kota-kota dan membakar ilmu pengetahuan yang tertulis. Ia memerintahkan penyalinan semua yang telah dikumpulkan di arsip dan perbendaharaan di kota Istakhr, menerjemahkannya ke dalam bahasa Yunani dan Koptik. Setelah menyelesaikan penyalinan apa yang dibutuhkannya, ia membakar apa yang ditulis dalam bahasa Persia dan Kashti. Raja-raja Persia telah menyalin buku-buku pada masa nabi mereka Zoroaster dan Jamasp sang ulama, dan menyimpannya di India dan Cina sebagai peringatan terhadap tindakan Alexander. Dengan demikian, pengetahuan menurun di Irak, dan setiap faksi memiliki rajanya sendiri, sehingga disebut \"Raja-Raja Faksi.\" (hlm. 331-333). Abu Sahl Ismail ibn Ali ibn Nawbakht adalah salah satu tokoh Syiah terkemuka, dan Abu al-Hasan al-Nash’i mengatakan bahwa dia adalah gurunya. Dia adalah seorang teolog yang berbudi luhur, berilmu, dan fasih, dan dia mengadakan pertemuan di hadapan sekelompok teolog. Dia memiliki pendapat tentang Qa’im dari keluarga Muhammad yang belum pernah terjadi sebelumnya, yaitu bahwa dia biasa mengatakan bahwa Imam adalah Muhammad ibn al-Hasan, tetapi dia meninggal dalam keadaan gaib, dan putranya akan menggantikannya dalam keadaan gaib, dan begitu pula keturunannya setelahnya sampai Allah memenuhi ketetapan-Nya dalam penampakannya. Ibn Abi al-‘Azaqir biasa berkorespondensi dengannya, mengajaknya berdakwah dan menawarkan mukjizat kepadanya. Ia berkata kepada Rasulullah, “Aku adalah mukjizat, aku tidak tahu apa itu. Tumbuhkan rambut di dahi temanmu agar aku dapat beriman kepadanya.” Tidak ada rasul yang datang kepadanya setelah itu. Ia memiliki beberapa kitab, termasuk Kitab Penggenapan Imamah, Kitab Peringatan Imamah, Kitab Bantahan Kaum Ekstremis, Kitab Bantahan Kitab Kebodohan Kebijaksanaan tentang al-Rawandi, Kitab Bantahan Mahkota tentang al-Rawandi, yang dikenal sebagai Kitab Pemurnian, dan Kitab Bantahan Penalaran Independen tentang Ibn al-Rawandi {cite:fihrist-ibn-al-nadim p. 251}"
