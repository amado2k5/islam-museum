id: person/abu-sahl-al-nawbakhti
class: person
label: { ar: "أبو سهل النوبختي", en: "Abu Sahl Al Nawbakhti" }
summary:
  ar: "أبو سهل بن نوبخت صاحب كتاب النهمطان الذي حكى ابن النديم في صدر مقالة الفلاسفة عنه تاريخ العلوم: أن صنوف العلوم ومعرفة المآخذ التي يدل عليها النجوم كانت عند أهل بابل فتعلم أهل مصر منهم وعمل بها أهل الهند، وأن الضحاك بن قي بنى مدينة اشتق اسمها من اسم المشتري جمع فيها العلم والعلماء وبنى بها اثني عشر قصرا على عدد بروج السماء وخزن كتب أهل العلم، حتى خرج الإسكندر ملك اليونانيين غازيا أرض فارس فهدم المدائن وأحرق ما كان منقوشا من العلم وأمر بنسخ ما كان مجموعا في الدواوين والخزائن بمدينة أصطخر وقلبه إلى اللسان الرومي والقبطي ثم أحرق بعد فراغه من نسخ حاجته ما كان مكتوبا بالفارسية وبالكشتج، وقد كانت ملوك فارس نسخت كتبا على عهد نبيهم زرادشت وجاماسب العالم وأحرزتها بناحية الهند والصين تحذيرا من فعلة الإسكندر، فدرس العلم بالعراق وصار لكل طائفة ملك فسميت ملوك الطوائف {cite:fihrist-ibn-al-nadim p. 331-333}."
  en: "Author of al-Nahmutan — the Fihrist's opening narrative of how the sciences passed from Babylon through Persia to the Greeks {cite:fihrist-ibn-al-nadim}"
sources: [source/fihrist-ibn-al-nadim]
