label: { ar: "أبو سهل النوبختي", en: "Abu Sahl Al Nawbakhti" }
summary:
  ar: "أبو سهل بن نوبخت صاحب كتاب النهمطان الذي حكى ابن النديم في صدر مقالة الفلاسفة عنه تاريخ العلوم: أن صنوف العلوم ومعرفة المآخذ التي يدل عليها النجوم كانت عند أهل بابل فتعلم أهل مصر منهم وعمل بها أهل الهند، وأن الضحاك بن قي بنى مدينة اشتق اسمها من اسم المشتري جمع فيها العلم والعلماء وبنى بها اثني عشر قصرا على عدد بروج السماء وخزن كتب أهل العلم، حتى خرج الإسكندر ملك اليونانيين غازيا أرض فارس فهدم المدائن وأحرق ما كان منقوشا من العلم وأمر بنسخ ما كان مجموعا في الدواوين والخزائن بمدينة أصطخر وقلبه إلى اللسان الرومي والقبطي ثم أحرق بعد فراغه من نسخ حاجته ما كان مكتوبا بالفارسية وبالكشتج، وقد كانت ملوك فارس نسخت كتبا على عهد نبيهم زرادشت وجاماسب العالم وأحرزتها بناحية الهند والصين تحذيرا من فعلة الإسكندر، فدرس العلم بالعراق وصار لكل طائفة ملك فسميت ملوك الطوائف {cite:fihrist-ibn-al-nadim p. 331-333}. وكان أبو سهل إسماعيل بن علي بن نوبخت من كبار الشيعة وكان أبو الحسن الناشئ يقول إنه أستاذه وكان فاضلا عالما متكلما وله مجلس بحضرة جماعة من المتكلمين، وله رأي في القائم من آل محمد لم يسبق إليه وهو أنه كان يقول إن الإمام محمد بن الحسن ولكنه مات في الغيبة وكان يتلاها في الغيبة ابنه وكذلك فيما بعد من ولده إلى أن ينفذ الله حكمه في إظهاره، وكان ابن أبي العزاقر راسله يدعوه إلى الفتنة ويبذل له المعجز فقال للرسول أنا معجز ما أدري أي شيء هو ينبت صاحبك بمقدم رأسي الشعر حتى أومن به فما عاد إليه رسول بعد هذا، وله كتب منها كتاب الاستيفاء في الإمامة وكتاب التنبيه في الإمامة وكتاب الرد على الغلاة وكتاب نقض كتاب عبث الحكمة على الراوندي وكتاب نقض التاج على الراوندي يعرف بكتاب السبك وكتاب نقض اجتهاد الرأي على ابن الراوندي {cite:fihrist-ibn-al-nadim p. 251}"
  en: "Author of al-Nahmutan — the Fihrist's opening narrative of how the sciences passed from Babylon through Persia to the Greeks {cite:fihrist-ibn-al-nadim}"
