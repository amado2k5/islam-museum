summary:
  ar: "السلطان بايزيد الثاني (حكم ٨٨٦–٩١٨هـ)؛ تولى السلطة بعد وفاة أبيه محمد الفاتح، وكان سلطاناً وديعاً نشأ محباً للأدب متفقهاً في علم الشريعة الإسلامية شغوفاً بعلم الفلك، واستعان بالخبراء الفنيين اليونانيين والبلغاريين في تحسين شبكة الطرق والجسور لربط أقاليم الدولة. وفي صدر حكمه خالفه أخوه الأمير جم الذي اعترف به أهل بروسة سلطاناً واقترح تقسيم الدولة قسمين أوروبياً وآسيوياً، فرفض بايزيد مبدأ التقسيم لأنه يفتت الدولة التي سهر أسلافه على توحيدها، وأعد جيشاً سار به إلى بروسة ففرّ جم إلى سلطان المماليك قايتباي في مصر فأكرمه وأمده بما احتاجه للسفر إلى الحجاز، وكتب إليه بايزيد: بما أنك قمت بواجباتك الدينية في الحج فلماذا تسعى إلى الأمور الدنيوية وقد كان الملك نصيبي بأمر الله؟ {cite:dawlat-uthmaniyya-salabi p. 163}. وبقي جم رهينة عند فرسان رودس ثم عند البابا حتى قُتل على ما تنقله كتب التاريخ {cite:dawlat-uthmaniyya-salabi p. 164}. وعقد بايزيد صلحاً مع المماليك سنة 1491م بإرسال مفاتيح القلاع الحدودية إلى قايتباي {cite:dawlat-uthmaniyya-salabi p. 164}، ووصله أول سفير روسي عام 1492م {cite:dawlat-uthmaniyya-salabi p. 165}، وأجاب استغاثة مسلمي الأندلس بإرسال أسطول إلى الشواطئ الإسبانية بقيادة كمال ريس {cite:dawlat-uthmaniyya-salabi p. 173}، وأحرز نصراً بحرياً على البنادقة بخليج لبانتو عام 905هـ/1499م واستولى على المدينة عامها التالي {cite:dawlat-uthmaniyya-salabi p. 173}، وفي زمانه أخربت الزلازل بالقسطنطينية ألفاً وسبعين بيتاً ومئة وتسعة جوامع مدة خمسة وأربعين يوماً فعمّل خمسة عشر ألفاً في الإصلاح {cite:dawlat-uthmaniyya-salabi p. 174}، ورتب للمفتي عشرة آلاف عثماني ولمدرسي المدارس السلطانية ما بين سبعة آلاف وألفين، وكان يجمع غبار غزواته من على ثيابه فأمر عند موته أن تُضرب منه لبنة توضع تحت خده الأيمن في القبر {cite:dawlat-uthmaniyya-salabi p. 174}. وفي أخر أيامه — عند ابن العماد — لما اشتد به المرض قام عليه ولده سليم فسلّم إليه السلطنة ثم مات قرب غوريه، ووصل خبره إلى دمشق يوم الأحد ثامن عشر ربيع الأول سنة ثمان عشرة وتسعمائة في يوم واحد مع وفاة شريف مكة قايتباي وسلطان اليمن عامر بن محمد {cite:shadharat-dhahab p. 485}."
  en: "Bayezid II (r. 886–918 AH) — the mild, fiqh-loving son of the Conqueror who refused his brother Cem's proposal to split the empire and drove him into Mamluk then Hospitaller exile {cite:dawlat-uthmaniyya-salabi p. 163}."
