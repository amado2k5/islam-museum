summary:
  ar: "السلطان بايزيد الثاني (حكم ٨٨٦–٩١٨هـ)؛ تولى السلطة بعد وفاة أبيه محمد الفاتح، وكان سلطاناً وديعاً نشأ محباً للأدب متفقهاً في علم الشريعة الإسلامية شغوفاً بعلم الفلك، واستعان بالخبراء الفنيين اليونانيين والبلغاريين في تحسين شبكة الطرق والجسور لربط أقاليم الدولة. وفي صدر حكمه خالفه أخوه الأمير جم الذي اعترف به أهل بروسة سلطاناً واقترح تقسيم الدولة قسمين أوروبياً وآسيوياً، فرفض بايزيد مبدأ التقسيم لأنه يفتت الدولة التي سهر أسلافه على توحيدها، وأعد جيشاً سار به إلى بروسة ففرّ جم إلى سلطان المماليك قايتباي في مصر فأكرمه وأمده بما احتاجه للسفر إلى الحجاز، وكتب إليه بايزيد: بما أنك قمت بواجباتك الدينية في الحج فلماذا تسعى إلى الأمور الدنيوية وقد كان الملك نصيبي بأمر الله؟ {cite:dawlat-uthmaniyya-salabi p. 163}. وفي أخر أيامه — عند ابن العماد — لما اشتد به المرض قام عليه ولده سليم فسلّم إليه السلطنة ثم مات قرب غوريه، ووصل خبره إلى دمشق يوم الأحد ثامن عشر ربيع الأول سنة ثمان عشرة وتسعمائة في يوم واحد مع وفاة شريف مكة قايتباي وسلطان اليمن عامر بن محمد {cite:shadharat-dhahab p. 485}."
  en: "Bayezid II (r. 886–918 AH) — the mild, fiqh-loving son of the Conqueror who refused his brother Cem's proposal to split the empire and drove him into Mamluk then Hospitaller exile {cite:dawlat-uthmaniyya-salabi p. 163}."
