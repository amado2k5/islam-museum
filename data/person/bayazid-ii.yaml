summary:
  ar: "السلطان بايزيد الثاني ⁦(حكم ٨٨٦–٩١٨هـ)⁩؛ تولى السلطة بعد وفاة أبيه محمد الفاتح، وكان سلطاناً وديعاً نشأ محباً للأدب متفقهاً في علم الشريعة الإسلامية شغوفاً بعلم الفلك، واستعان بالخبراء الفنيين اليونانيين والبلغاريين في تحسين شبكة الطرق والجسور لربط أقاليم الدولة. وفي صدر حكمه خالفه أخوه الأمير جم الذي اعترف به أهل بروسة سلطاناً واقترح تقسيم الدولة قسمين أوروبياً وآسيوياً، فرفض بايزيد مبدأ التقسيم لأنه يفتت الدولة التي سهر أسلافه على توحيدها، وأعد جيشاً سار به إلى بروسة ففرّ جم إلى سلطان المماليك قايتباي في مصر فأكرمه وأمده بما احتاجه للسفر إلى الحجاز، وكتب إليه بايزيد: بما أنك قمت بواجباتك الدينية في الحج فلماذا تسعى إلى الأمور الدنيوية وقد كان الملك نصيبي بأمر الله؟ {cite:dawlat-uthmaniyya-salabi p. 163}. وبقي جم رهينة عند فرسان رودس ثم عند البابا حتى قُتل على ما تنقله كتب التاريخ {cite:dawlat-uthmaniyya-salabi p. 164}. وعقد بايزيد صلحاً مع المماليك سنة 1491م بإرسال مفاتيح القلاع الحدودية إلى قايتباي {cite:dawlat-uthmaniyya-salabi p. 164}، ووصله أول سفير روسي عام 1492م {cite:dawlat-uthmaniyya-salabi p. 165}، وأجاب استغاثة مسلمي الأندلس بإرسال أسطول إلى الشواطئ الإسبانية بقيادة كمال ريس {cite:dawlat-uthmaniyya-salabi p. 173}، وأحرز نصراً بحرياً على البنادقة بخليج لبانتو عام 905هـ/1499م واستولى على المدينة عامها التالي {cite:dawlat-uthmaniyya-salabi p. 173}، وفي زمانه أخربت الزلازل بالقسطنطينية ألفاً وسبعين بيتاً ومئة وتسعة جوامع مدة خمسة وأربعين يوماً فعمّل خمسة عشر ألفاً في الإصلاح {cite:dawlat-uthmaniyya-salabi p. 174}، ورتب للمفتي عشرة آلاف عثماني ولمدرسي المدارس السلطانية ما بين سبعة آلاف وألفين، وكان يجمع غبار غزواته من على ثيابه فأمر عند موته أن تُضرب منه لبنة توضع تحت خده الأيمن في القبر {cite:dawlat-uthmaniyya-salabi p. 174}. وفي أخر أيامه — عند ابن العماد — لما اشتد به المرض قام عليه ولده سليم فسلّم إليه السلطنة ثم مات قرب غوريه، ووصل خبره إلى دمشق يوم الأحد ثامن عشر ربيع الأول سنة ثمان عشرة وتسعمائة في يوم واحد مع وفاة شريف مكة قايتباي وسلطان اليمن عامر بن محمد {cite:shadharat-dhahab p. 485}."
  en: "Bayezid II (r. 886–918 AH) — the mild, fiqh-loving son of the Conqueror who refused his brother Cem's proposal to split the empire and drove him into Mamluk then Hospitaller exile {cite:dawlat-uthmaniyya-salabi p. 163}."
  ur: "محمد فاتح کا بیٹا اور عثمانی سلطان؛ اپنے بھائی جم کی سلطنت تقسیم کرنے کی تجویز مسترد کی، جس کے بعد جم بیرون ملک چلا گیا۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Bayezid II (r. 886–918 AH) — el hijo apacible y amante del fiqh del Conquistador que rechazó la propuesta de su hermano Cem de dividir el imperio y lo obligó al exilio mameluco y luego hospitalario {cite:dawlat-uthmaniyya-salabi p. 163}."
  fr: "Bayezid II (r. 886–918 AH) — le fils doux et amoureux du fiqh du Conquérant qui refusa la proposition de son frère Cem de diviser l'empire et le poussa à l'exil mamelouk puis hospitalier {cite:dawlat-uthmaniyya-salabi p. 163}."
  tr: "Sultan II. Bayezid (886–918 Hicri yılları arasında hüküm sürdü), babası Fatih Mehmed'in ölümünden sonra iktidara geldi. Edebiyatı seven, İslami hukukta bilgili ve astronomiye tutkulu bir sultan olan nazik bir sultandı; devletin eyaletlerini birbirine bağlayan yol ve köprü ağını geliştirmek için Yunan ve Bulgar teknik uzmanları görevlendirdi. Saltanatının başında, kardeşi Emir Cem ona karşı çıktı; Burusa halkı onu sultan olarak tanıdı ve devletin Avrupa ve Asya parçalarına bölünmesini önerdi. Bayezid, atalarının birleştirmek için kasıtlı olarak yaptığı devleti parçalayacağı için bölünme ilkesini reddetti. Burusa'ya yürümek üzere bir ordu hazırladı; burada Jam, Mısır'daki Memlük Sultanı Kaitbay'a kaçtı; Kaitbay onu onurlandırdı ve Hicaz'a seyahat etmesi için gerekli olanları sağladı. Bayezid ona şöyle yazdı: Hac sırasında dini görevlerini yerine getirdin, neden dünyevi işlere yöneliyorsun, oysa kral benim payımdı ve Tanrı'nın emriyle benim payımdı? {cite:Dawlat-Uthmaniyya-Salabi s. 163}. Jem, tarihi kitaplara göre Rodos Şövalyeleri'nin ve ardından Papa'nın rehinesi olarak kaldı; tarihî kitaplara göre {cite:dawlat-uthmaniyya-salabi s. 164}. Bayezid, 1491 yılında Memlüklerle barış yaptı; sınır kalelerinin anahtarlarını Qaitbay'a gönderdi {cite:dawlat-uthmaniyya-salabi s. 164} ve ilk Rus elçisi 1492'de ona ulaştı {cite:dawlat-uthmaniyya-salabi s. 165}, el-Endülüs Müslümanlarının çağrısına Kemal Reis liderliğinde bir filo göndererek İspanya kıyılarına gönderdi {cite:dawlat-uthmaniyya-salabi s. 173} ve 905 Hicri/1499 yılında Bantu Körfezi'nde Venediklilere karşı deniz zaferi kazandı ve ertesi yıl şehri ele geçirdi {atıf: Dawlat-Uthmaniyya-Salabi s. 173} Onun döneminde Konstantinopolis'teki depremler, kırk beş gün içinde 1.700 ev ve yüz dokuz camiyi yıktı. On beş bin kişi reform üzerinde çalıştı {atıf:Dawlat-uthmaniyya-Salabi s. 174}, on bin Osmanlı müftisi ve sultanlık okullarına öğretmen atadı, yedi bin ile iki bin arasında değişti. Savaşlarından toz aldı ve ölümünden sonra sağ yanağının altına bir tuğla konulmasını emretti. {cite:dawlat-uthmaniyya-salabi s. 174}. Son günlerinde—İbn el-İmad ile birlikte—hastalığı kötüleştiğinde, oğlu Süleym sultanlığı devraldı ve ona devretti. Daha sonra Ghuriya yakınlarında öldü. Haber 1918 yılının on sekizinci Rebi'l-Awwal Pazar günü, aynı gün, Mekke Kaitbay Şerifi ve Yemen Sultanı Emir ibn Muhammed'in ölümüyle aynı zamana denk geldi."
  id: "Sultan Bayezid II (memerintah 886–918 H) mengambil alih kekuasaan setelah kematian ayahnya, Mehmed Sang Penakluk. Ia adalah sultan yang lembut dan tumbuh dengan kecintaan pada sastra, menguasai yurisprudensi Islam, bersemangat dalam astronomi, dan melibatkan ahli teknis Yunani serta Bulgaria untuk meningkatkan jaringan jalan dan jembatan yang menghubungkan provinsi-provinsi negara bagian. Pada awal pemerintahannya, saudaranya Emir Cem menentangnya, yang diakui oleh rakyat Burusa sebagai sultan dan mengusulkan pembagian negara menjadi bagian Eropa dan Asia. Bayezid menolak prinsip pembagian karena akan memecah negara, yang telah sengaja dipersatukan oleh leluhurnya. Ia menyiapkan pasukan untuk berbaris ke Burusa, di mana Jam melarikan diri ke Sultan Mamluk Qaitbay di Mesir, yang menghormatinya dan memberinya apa yang dibutuhkan untuk pergi ke Hijaz. Bayezid menulis kepadanya: Karena kamu telah menjalankan tugas keagamaanmu selama Haji, mengapa kamu mencari urusan duniawi ketika raja adalah bagianku atas perintah Tuhan? {cite:dawlat-uthmaniyya-salabi hlm. 163}. Jem tetap menjadi sandera Ksatria Rhodes dan kemudian Paus sampai dia dibunuh, menurut buku sejarah {cite:dawlat-uthmaniyya-salabi hlm. 164}. Bayezid berdamai dengan Mamluk pada tahun 1491 M dengan mengirimkan kunci benteng perbatasan ke Qaitbay {cite:dawlat-uthmaniyya-salabi hlm. 164}, dan duta besar Rusia pertama menghubunginya pada tahun 1492 {cite:dawlat-uthmaniyya-salabi hlm. 165}, dan menjawab seruan Muslim al-Andalus dengan mengirim armada ke pantai Spanyol yang dipimpin oleh Kemal Reis {cite:dawlat-uthmaniyya-salabi hlm. 173}, dan meraih kemenangan laut atas Venesia di Teluk Bantu pada tahun 905 H/1499 M dan merebut kota tersebut tahun berikutnya {cite: dawlat-uthmaniyya-salabi hlm. 173} Pada masa jabatannya, gempa bumi di Konstantinopel menghancurkan 1.700 rumah dan seratus sembilan masjid selama empat puluh lima hari. Lima belas ribu orang bekerja pada reformasi {cite:dawlat-uthmaniyya-salabi hlm. 174}, mengangkat sepuluh ribu mufti Ottoman dan guru sekolah kesultanan antara tujuh ribu hingga dua ribu. Ia mengumpulkan debu dari pertempurannya dari pakaian dan memerintahkan setelah kematiannya agar batu bata diletakkan di bawah pipi kanannya di makam {cite:dawlat-uthmaniyya-salabi hlm. 174}. Pada hari-hari terakhirnya—bersama Ibn al-Imad—ketika penyakitnya memburuk, putranya Sulaym mengambil alih dan menyerahkan kesultanan kepadanya. Ia kemudian meninggal di dekat Ghuriya. Berita sampai ke Damaskus pada hari Minggu, tanggal delapan belas Rabi' al-Awwal tahun 1918, pada hari yang sama, bertepatan dengan kematian Sharif dari Mekah Qaitbay dan Sultan Yaman, Amir ibn Muhammad {cite:shadharat-dhahab, hlm. 485}."
