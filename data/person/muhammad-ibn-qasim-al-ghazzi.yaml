  ar: "محمد بن قاسم بن محمد، أبو عبد الله شمس الدين الغزي، ويعرف بابن قاسم وبابن الغرابيلي، فقيه شافعي ولد ونشأ بغزة وتعلم بها وبالقاهرة وأقام بالقاهرة وتولى أعمالاً في الأزهر، صاحب «فتح القريب المجيب» في شرح متن أبي شجاع."
  en: "Muhammad ibn Qasim al-Ghazzi, Abu Abd Allah Shams al-Din, known as Ibn Qasim and Ibn al-Gharabili, a Shafi'i jurist born and raised in Gaza, who studied there and in Cairo, settled in Cairo and held posts at al-Azhar; author of Fath al-Qarib al-Mujib, a commentary on the text of Abu Shuja'."
