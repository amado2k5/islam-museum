summary:
  ar: "صحابي أنصاري خزرجي من بني ساعدة، اشتُهر بشجاعته وإقدامه في المعارك. كان إذا اعتصب بعصابته الحمراء علم الناس أنه سيقاتل حتى الموت. في غزوة أحد أخذ سيف النبي بحقه وشق الصفوف بعصابته الحمراء حتى أمعن في المشركين. وقف أمام النبي يترّس عليه بظهره والنبل يقع عليه وهو لا يتحرك {cite:mubarakpuri-raheeq p.256}."
