summary:
  ar: 'اسمه سماك بن خرشة، وقيل: ابن أوس بن خرشة؛ اتُّفق على شهوده بدراً، وأخذ سيف النبي بحقه يوم أحد فضرب به هام المشركين، وذُكر أنه شارك في قتل مسيلمة، وقال علي إنه استُشهد باليمامة.'
  en: His name was Simak ibn Kharasha, or ibn Aws ibn Kharasha; agreed to have been at Badr; at Uhud he took the Prophet's sword 'with its right' and struck the polytheists' heads with it; it is said he took part in killing Musaylima, and Ali
    said he was martyred at al-Yamama.
