label:
  ar: أبو تاشفين عبد الرحمن بن موسى
  en: Abu Tashfin I Abd al-Rahman ibn Musa
  fr: "Abu Tashfin I Abd al-Rahman ibn Musa"
  es: "Abu Tashfin I Abd al-Rahman ibn Musa"
  ur: "ابو تاشفین اول عبدالرحمٰن بن موسیٰ"
summary:
  ar: "أبو تاشفين عبد الرحمن بن موسى أبي حمو سلطان تلمسان؛ دفع إليه أبوه أتراباً من المعلوجي يقومون بخدمته في مرباه، وكان أبوه يقرعه ويعيره بمكان ابن عمه مسعود بن أبي عامر، فأغروه بالتوثب على الأمر والفتك بمشتويه مسعود واعتقال السلطان، فهجموا قايلة الهاجرة على خاصة القصر فقتلوا أباه ومسعوداً وأبا سرحان وهلك الوزراء بنو الملاح، وطاف الهاتف بتلمسان أن أبا تاشفين ثار لأبيه، ثم استبد بالأمر ونهض إلى محمد بن يوسف الخارج على أبيه عندما رجع من حصار بجاية، ودامت حروبه مع الموحدين في الفتنة الطويلة على بجاية وتلمسان."
  en: "Abu Tashfin Abd al-Rahman ibn Musa ibn Abi Hammu, sultan of Tlemcen; raised among M'aluji companions who, inflamed by his father's slights beside the favoured cousin Mas'ud ibn Abi Amir, pushed him to seize the rule — they rushed the palace at siesta, killed the sultan, Mas'ud and Abu Sarhan and massacred the Banu al-Mallah viziers while the town-crier proclaimed Abu Tashfin avenging his father; then he took the kingdom and marched on the rebel Muhammad ibn Yusuf, waging the long Béjaïa-Tlemcen wars against the Almohad remnant."
  fr: "Abu Tashfin Abd al-Rahman ibn Musa ibn Abi Hammu, sultan de Tlemcen ; élevé parmi des compagnons M'aluji, que les humiliations de son père face au cousin favorisé Mas'ud ibn Abi Amir poussèrent à l'inciter à prendre le pouvoir. Ils envahirent le palais à l'heure de la sieste, tuèrent le sultan, Mas'ud et Abu Sarhan et massacrèrent les vizirs Banu al-Mallah, tandis que le crieur proclamait qu'Abu Tashfin vengeait son père. Il prit ensuite le royaume, marcha contre le rebelle Muhammad ibn Yusuf et mena les longues guerres de Béjaïa et Tlemcen contre les derniers Almohades."
  es: "Abu Tashfin Abd al-Rahman ibn Musa ibn Abi Hammu, sultán de Tlemcen; criado entre los compañeros M'aluji que, enfurecidos por los desaires de su padre en favor de su primo predilecto Mas'ud ibn Abi Amir, lo impulsaron a tomar el poder. Asaltaron el palacio durante la siesta, mataron al sultán, a Mas'ud y a Abu Sarhan, y masacraron a los visires de Banu al-Mallah, mientras el pregonero proclamaba que Abu Tashfin vengaba a su padre. Luego, tomó el reino y marchó contra el rebelde Muhammad ibn Yusuf, librando las largas guerras de Béjaïa-Tlemcen contra los restos almohades."
  ur: "ابو تاشفین عبدالرحمن ابن موسیٰ ابن ابی حمو، تلمسن کے سلطان؛ ملوجی کے ساتھیوں میں پرورش پائی جنہوں نے اپنے والد کی طرف سے پسندیدہ چچا زاد بھائی مسعود ابن ابی عامر کے پہلو میں جھنجھلا کر اسے حکومت پر قبضہ کرنے کے لیے دھکیل دیا - انہوں نے محل پر دھاوا بولا، سلطان، مسعود اور ابو سرحان کو قتل کر دیا اور بنو الم اللہ کا قتل عام کیا جب کہ اس کے ایک ابو طائفی امیر المعروف طائفنیر کو قتل کر دیا۔ باپ؛ اس کے بعد اس نے سلطنت پر قبضہ کر لیا اور باغی محمد بن یوسف پر چڑھائی کی، الموحد کے باقیات کے خلاف طویل Béjaïa-Tlemcen جنگیں چھیڑ دیں۔"
  tr: "Tlemcen Sultanı Ebu Taşfin Abdülrahman ibn Musa Ebu Hammu; babası onu yetiştirmek için Ma'luci'den akranlarını göndermişti. Babası onu sürekli azarlıyor ve kuzeni Mesud ibn Ebu Emir'in konumu hakkında alay ediyordu. Bu yüzden onu iktidarı ele geçirmeye, kuzeni Mesud'u öldürmeye ve Sultanı tutuklamaya teşvik ettiler. Bunun üzerine öğle vakti saraya saldırdılar ve babasını, Mesud'u ve Ebu Sarhan'ı öldürdüler. Beni el-Mallah'ın bakanları da yok oldu. Ebu Taşfin'in babası için ayaklandığı haberi Tlemcen'de yayıldı. Bunun üzerine Ebu Taşfin duruma el koydu ve Bejaia kuşatmasından döndüğünde babasına isyan eden Muhammed ibn Yusuf'a karşı ayaklandı. Almohadlarla olan savaşları, Bejaia ve Tlemcen'deki uzun süren fitneye dönüştü."
  id: "Abu Tashfin Abd al-Rahman ibn Musa Abi Hammu, Sultan Tlemcen; ayahnya mengutus para bangsawan dari Ma'luji untuk mendidiknya, dan ayahnya sering menegurnya dan mengejeknya tentang kedudukan sepupunya Mas'ud ibn Abi Amir, sehingga mereka membujuknya untuk merebut kekuasaan dan membunuh sepupunya Mas'ud serta menangkap Sultan. Maka mereka menyerang istana pada tengah hari dan membunuh ayahnya, Mas'ud, dan Abu Sarhan, serta para menteri Banu al-Mallah binasa. Kemudian utusan itu menyebar ke seluruh Tlemcen dan mengatakan bahwa Abu Tashfin telah bangkit membela ayahnya. Ia kemudian mengambil alih masalah tersebut dan bangkit melawan Muhammad ibn Yusuf yang telah memberontak terhadap ayahnya ketika kembali dari pengepungan Bejaia. Perangnya dengan Al-Muhad berlanjut dalam fitnah panjang atas Bejaia dan Tlemcen."
