summary:
  ar: "شاعر الأوس وقائدهم قبل الإسلام، سيد «أوس الله» وهم بنو أمية بن زيد وخطمة ووائل وواقف؛ وقف بهم عن الإسلام زمن بعثة مصعب بن عمير حتى هاجر النبي ومضت بدر وأحد والخندق ثم أسلموا كلهم {cite:samhudi-wafa-al-wafa p. 239-240}."
  en: "Poet and wartime leader of the Aws before Islam, chief of the 'Aws Allah' clans — Banu Umayya ibn Zayd, Khatma, Wa'il and Waqif — whom he held back from Islam throughout Mus'ab ibn 'Umayr's mission until after Badr, Uhud and the Trench, when they all embraced it {cite:samhudi-wafa-al-wafa p. 239-240}."
  ur: "اسلام سے پہلے اوس کے شاعر اور جنگی سردار، اوس اللہ قبائل — بنو امیہ بن زید، خطمہ، وائل اور واقف — کے قائد جنہیں انہوں نے بعاث سے روکا؛ ہجرت سے پہلے فوت ہوئے۔"
