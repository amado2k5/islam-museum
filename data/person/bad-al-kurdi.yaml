  en: Bad al-Kurdi (Husayn ibn Dushk)
summary:
  ar: "باد الكردي واسمه الحسين بن دوشك، أبو عبد اللّه وقيل أبو شجاع؛ مؤسس ملك بني مروان بديار بكر — تغلب على الموصل وديار بكر ونازع فيها الديلم، ثم طمع في ملك الموصل فسار إليها فغلبه ابنا ناصر الدولة وقتل في المعركة، فخلفه ابن أخته أبو علي بن مروان."
  en: "Bad al-Kurdi, named Husayn ibn Dushk, kunyas Abu Abd Allah or Abu Shuja'; founder of Marwanid rule in Diyar Bakr — he seized Mosul and Diyar Bakr, disputing them with the Daylamites, then coveted Mosul itself, marched on it, and was defeated and killed in battle by the two sons of Nasir al-Dawla, his sister's son Abu Ali ibn Marwan succeeding him."
