class: person
label:
  ar: باد الكردي الحسين بن دوشك
  en: Bad al-Kurdi (Husayn ibn Dushk)
  es: "Bad al-Kurdi (Husayn ibn Dushk)"
  fr: "Bad al-Kurdi (Husayn ibn Dushk)"
  ur: "بد الکردی ⁦(حسین ابن دشک)⁩"
summary:
  ar: "باد الكردي واسمه الحسين بن دوشك، أبو عبد اللّه وقيل أبو شجاع؛ مؤسس ملك بني مروان بديار بكر — تغلب على الموصل وديار بكر ونازع فيها الديلم، ثم طمع في ملك الموصل فسار إليها فغلبه ابنا ناصر الدولة وقتل في المعركة، فخلفه ابن أخته أبو علي بن مروان."
  en: "Bad al-Kurdi, named Husayn ibn Dushk, kunyas Abu Abd Allah or Abu Shuja'; founder of Marwanid rule in Diyar Bakr — he seized Mosul and Diyar Bakr, disputing them with the Daylamites, then coveted Mosul itself, marched on it, and was defeated and killed in battle by the two sons of Nasir al-Dawla, his sister's son Abu Ali ibn Marwan succeeding him."
  es: "Bad al-Kurdi, llamado Husayn ibn Dushk, kunyas Abu Abd Allah o Abu Shuja'; fundador del gobierno marwaní en Diyar Bakr: se apoderó de Mosul y Diyar Bakr, disputándoselas con los daylamitas, luego codició la propia Mosul, marchó sobre ella y fue derrotado y muerto en batalla por los dos hijos de Nasir al-Dawla, siendo sucedido por el hijo de su hermana, Abu Ali ibn Marwan."
  fr: "Bad al-Kurdi, de son vrai nom Husayn ibn Dushk, également connu sous le nom d'Abu Abd Allah ou Abu Shuja', fondateur du pouvoir marwanide à Diyar Bakr, s'empara de Mossoul et de Diyar Bakr, les disputant aux Daylamites, puis convoita Mossoul elle-même, marcha sur elle et fut vaincu et tué au combat par les deux fils de Nasir al-Dawla, le fils de sa sœur, Abu Ali ibn Marwan, lui succédant."
  ur: "بد الکردی، جس کا نام حسین بن دشک، کنیاس ابو عبد اللہ یا ابو شجاع؛ دیار بکر میں مروانیوں کی حکومت کا بانی - اس نے موصل اور دیار بکر پر قبضہ کیا، ان کا دیلامائٹس سے جھگڑا کیا، پھر خود موصل کا لالچ کیا، اس پر چڑھائی کی، اور ناصر الدولہ کے دو بیٹوں کے ہاتھوں جنگ میں شکست کھا کر مارا گیا، اس کی بہن کا بیٹا ابو علی ابن مروان اس کا جانشین بنا۔"
