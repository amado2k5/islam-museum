summary:
  ar: "أحمد بن الحسن بن عبد الكريم الخالدي الجوهري، فاضل مصري أزهري، كان أبوه يبيع الجوهر، من كتبه «منقذة العبيد من ربقة التقليد» في التوحيد، 1096 إلى 1182 هـ."
  en: "Ahmad ibn al-Hasan ibn Abd al-Karim al-Khalidi al-Jawhari, an Egyptian scholar of al-Azhar whose father sold jewels, author of 'Munqidhat al-'Abid min Ribqat al-Taqlid' on the oneness of God, 1096 to 1182 AH."
  fr: "Ahmad ibn al-Hasan ibn Abd al-Karim al-Khalidi al-Jawhari, savant égyptien d'al-Azhar dont le père vendait des bijoux, auteur de « Munqidhat al-'Abid min Ribqat al-Taqlid » sur l'unicité de Dieu, de 1096 à 1182 H."
  es: "Ahmad ibn al-Hasan ibn Abd al-Karim al-Khalidi al-Jawhari, un erudito egipcio de al-Azhar cuyo padre vendía joyas, autor de 'Munqidhat al-'Abid min Ribqat al-Taqlid' sobre la unidad de Dios, 1096 a 1182 AH."
  ur: "احمد بن الحسن بن عبد الکریم الخالدی الجوہری، الازہر کا ایک مصری عالم جس کے والد نے زیورات بیچے، 1096 تا 1182 ہجری وحدانیت پر 'منقدات العابد من ربقات التقلید' کے مصنف۔"
