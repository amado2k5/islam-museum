summary:
  ar: "فيلسوف فرنسي، وُلد في مرسيليا سنة 1913، اعتنق البروتستانتية صبيًّا ثم انضم إلى الحزب الشيوعي الفرنسي وصار من مفكريه ونائبًا في البرلمان، ثم نقد الماركسية وفُصل من الحزب سنة 1970، ودعا إلى حوار الحضارات، وأعلن إسلامه في جنيف سنة 1982، وتوفي سنة 2012، بحسب رواية طارق السويدان."
  en: "French philosopher, born in Marseille in 1913, who became a Protestant as a boy, then a leading thinker and parliamentarian of the French Communist Party; he broke with Marxism and was expelled from the Party in 1970, called for a dialogue of civilisations, declared his Islam in Geneva in 1982 and died in 2012, as Tareq al-Suwaidan recounts."
  ur: "فرانسیسی فلسفی، 1913 میں مارسیلیا میں پیدا ہوئے؛ لڑکپن میں پروٹسٹنٹ ہوئے، پھر فرانسیسی کمیونسٹ پارٹی کے نمایاں مفکر اور رکنِ پارلیمان بنے؛ مارکسزم پر تنقید کی اور 1970 میں پارٹی سے نکالے گئے، تہذیبوں کے مکالمے کی دعوت دی، 1982 میں جنیوا میں اسلام قبول کیا اور 2012 میں وفات پائی، طارق السویدان کی روایت کے مطابق۔"
