label:
  ar: مساور الشراري
  en: Musawir al-Shari
  es: "Musawir al-Shari"
  fr: "Musawir al-Shari"
  ur: "مساویر الشری"
summary:
  ar: "مساور الشراري، زعيم خارجي خرج على الموصل أيام الخليفة المنصور فهزم أهلها على عهد واليها عقبة بن محمد بن الأشعث، وتغلب على المدينة وكثر أتباعه إلى أن هلك في حربه مع العساكر سنة 263هـ على حكاية ابن خلدون."
  en: "Musawir al-Shari, a Kharijite leader who rose at Mosul and defeated its people under the governor Uqba ibn Muhammad ibn al-Ash'ath, seized the city and drew many followers until he was killed fighting the troops in 263 AH, per Ibn Khaldun's account."
  es: "Musawir al-Shari, un líder jariyí que se alzó en Mosul y derrotó a su pueblo bajo el mando del gobernador Uqba ibn Muhammad ibn al-Ash'ath, se apoderó de la ciudad y atrajo a muchos seguidores hasta que murió luchando contra las tropas en el año 263 de la Hégira, según el relato de Ibn Khaldun."
  fr: "Musawir al-Shari, un chef kharijite qui s'est soulevé à Mossoul et a vaincu ses habitants sous le gouverneur Uqba ibn Muhammad ibn al-Ash'ath, s'est emparé de la ville et a attiré de nombreux partisans jusqu'à ce qu'il soit tué en combattant les troupes en 263 AH, selon le récit d'Ibn Khaldun."
  ur: "مساویر الشری، ایک خارجی رہنما جس نے موصل پر چڑھائی کی اور گورنر عقبہ ابن محمد بن اشعث کے ماتحت اس کے لوگوں کو شکست دی، اس نے شہر پر قبضہ کیا اور بہت سے پیروکاروں کو اپنی طرف متوجہ کیا یہاں تک کہ ابن خلدون کے بیان کے مطابق وہ 263 ہجری میں فوجوں سے لڑتے ہوئے مارا گیا۔"
  tr: "Masawar al-Sharari, el-Mensur halifeliği sırasında Musul'a saldıran, valisi Uqbah bin Muhammed bin el-Eşas döneminde halkını yenmiş, Medine'yi fethetmiş ve takipçileri 263 Hicri yılında ordularla savaşta ölene kadar artan yabancı bir liderdir; İbn Haldun'un hikayesine göre."
  id: "Masawar al-Sharari adalah seorang pemimpin asing yang menyerang Mosul selama masa kekhalifahan al-Mansur, mengalahkan rakyatnya pada masa pemerintahan gubernurnya, Uqbah ibn Muhammad ibn al-Ash'ath, menaklukkan Madinah, dan para pengikutnya bertambah banyak hingga ia tewas dalam pertempuran melawan pasukan pada tahun 263 H, menurut kisah Ibn Khaldun."
