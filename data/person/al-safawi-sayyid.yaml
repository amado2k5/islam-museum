summary:
  ar: "السيد قطب الدين الشريف الحسني الحسيني الإيجي الشافعي المعروف بالصفوي نسبة إلى جده لأمه السيد صفي الدين والد الشيخ معين الدين الإيجي صاحب التفسير؛ ولد سنة تسعمائة واشتغل في النحو والصرف على أبيه وتفقه به وأخذ عنه الرسالة الصغرى والكبرى وتلقين الشريف في المنطق، ثم لازم الشيخ والترضل الكازواني صاحب الحاشية على فيا صارز والمرح على إرشاد القاضي شهاب الدين الهندي بكجرات فقرأ عليه العنصر والمطول وغيرهما وأجازه، ثم سمع بالإيعنا على أبي الفضل الاستراباذي، ورحل إلى دلهي وحضر مجالس علمائها وبحث معهم فظهر فضله وأكرمه السلطان إبراهيم بن سكندر شاه، وأدرك الجلال الدواني وأجاز له، ثم حج وجاور بمكة سنين ودخل بلاد الشام في حدود سنة تسع وثلاثين وأخذ عنه جماعة من أهل دمشق وحلب ودرس بدمشق في شرح الكافية للرضي وزار بدمشق قبور الصالحين وزار بيت المقدس، وسافر إلى الروم مرتين وأنعم عليه السلطان سليمان بخمسين عثمانياً في خزينة مصر، وأخذ عنه بحلب ابن الحنبلي ولبس منه الخرقة وتلقن الذكر، ثم دخل مصر واستوطنها؛ وله مؤلفات منها شرح مختصر على الكافية وشرح الغرة في المنطق للسيد الشريف وشرح الفوائد الضيائية في المعاني والبيان ومختصر النهاية لابن الأثير في نحو نصف حجمها وتفسير من سورة عم إلى آخر القرآن؛ وكان من أعاجيب الزمان {cite:shadharat-dhahab p. 713-714}."
  en: "The Iji grandson — b. 900, grandson of Safi al-Din al-Iji the mufassir; trained at Delhi's majalis under Sultan Ibrahim b. Sikandar Shah, licensed by Jalal al-Din al-Dawani, then six years of mujawara at Mecca; at Damascus he taught the Radi Kafiya, received Sulayman's fifty uthmani pension, gave Ibn al-Hanbali the khirqa at Aleppo, settled in Cairo; works: a short Kafiya sharh, the Ghurra sharh, the Diya'iyya sharh, a half-size Mukhtasar of Ibn al-Athir's Nihaya, a tafsir from sura 'Amma; 'one of the marvels of the age' {cite:shadharat-dhahab p. 713-714}."
  fr: "Le petit-fils Iji – né 900 ans, petit-fils de Safi al-Din al-Iji le moufassir  ; formé au majalis de Delhi sous le sultan Ibrahim b. Sikandar Shah, licencié par Jalal al-Din al-Dawani, puis six ans de mujawara à La Mecque  ; à Damas, il enseigna le Radi Kafiya, reçut la pension de cinquante uthmani de Sulayman, donna à Ibn al-Hanbali la khirqa à Alep, s'installa au Caire  ; œuvres : un court Kafiya sharh, le Ghurra sharh, le Diya'iyya sharh, un demi-taille Mukhtasar de Ibn al-Athir Nihaya, un tafsir de la sourate 'Amma ; 'une des merveilles de l'époque' {cite:shadharat-dhahab p. 713-714}."
  es: "El nieto de Iji - b. 900, nieto de Safi al-Din al-Iji el mufassir; entrenado en los majalis de Delhi bajo el mando del sultán Ibrahim b. Sikandar Shah, autorizado por Jalal al-Din al-Dawani, luego seis años de mujawara en La Meca; en Damasco enseñó al Radi Kafiya, recibió la pensión de cincuenta uthmani de Sulayman, le dio a Ibn al-Hanbali la khirqa en Alepo y se instaló en El Cairo; obras: un Kafiya sharh corto, el Ghurra sharh, el Diya'iyya sharh, un Mukhtasar de tamaño medio de Nihaya de Ibn al-Athir, un tafsir de la sura 'Amma; 'una de las maravillas de la época' {cita: shadharat-dhahab p. 713-714}."
  ur: "آئی جی پوتا - بی۔ 900، صفی الدین العجی مفسر کا پوتا؛ سلطان ابراہیم بن کے دور میں دہلی کی مجالس میں تربیت حاصل کی۔ سکندر شاہ، جلال الدین الدوانی کی طرف سے لائسنس یافتہ، پھر مکہ میں مجاورہ کے چھ سال؛ دمشق میں اس نے ردی قافیہ پڑھایا، سلیمان کی پچاس عثمانی پنشن حاصل کی، ابن الحنبلی کو حلب میں خرقہ دیا، قاہرہ میں سکونت اختیار کی۔ تصانیف: ایک مختصر قافیہ شرع، ثورۃ شرع، دیہہ شرع، ابن اثیر کی نھایہ کا نصف سائز کا مختار، سورہ اما کی ایک تفسیر؛ 'عمر کے عجائبات میں سے ایک' 713-714}۔"
  tr: "Seyyid Kutbeddin el-Şerif el-Hasani el-Hüseyni el-İci el-Şafii, Safevi olarak bilinir, annesinin babası Seyyid Safi'ddin'in adını taşır; Seyyid Safi el-Din, tefsirin yazarı Şeyh Mu'in el-Din el-İci'nin babasıdır; 900 yılında doğdu, babasının yanında dilbilgisi ve morfoloji çalıştı, ondan fıkıh eğitimi aldı ve mantık üzerine Şerif dersini aldı. Daha sonra Şeyh ve Faya Sariz üzerine yapılan tefsir yazarı el-Tardal el-Kazvani'yi takip etti ve Gujarat'ta Hakim Şihabeddin el-Hindi'nin rehberliğinde ağırlandı; burada el-Ensar, el-Mutval ve diğerlerinin yanında eğitim aldı ve yetkisini aldı. Sonra Ebu el-Fadl el-İstrabadhi'den şunları duydu: Delhi'ye seyahat etti, alimlerin toplantılarına katıldı ve onlarla sohbet etti. Sultan İbrahim bin Sikandar Şah onun erdemini gösterdi ve ona saygı gösterdi, Al-Jalal al-Dawani ile tanıştı ve ona izin verdi. Sonra Hac yaptı ve yıllarca Mekke'de yaşadı, yaklaşık 39 yılında Şam ve Halep'ten bir grup onun yanında eğitim aldı, Şam'da Al-Radi'nin El-Kafiye açıklamasını inceledi, Şam'daki doğruların mezarlarını ziyaret etti, Kudüs'ü ziyaret etti, iki kez Romalılara seyahat etti ve Sultan Süleyman ona Mısır hazinesinde elli Osmanlı verdi. Halep'te onun yanında eğitim gördü ve ondan bir pelerin giydi Zikri (İslami anma) öğrendi, ardından Mısır'a girdi ve orada yerleşti; El-Kafiye üzerine kısa bir tefsir, Seyyid el-Şerif'in Şerh al-Ghurrah fi al-Mantiq'i, Fawa'id al-Diyya'i fi al-Ma'ani wa al-Bayan üzerine bir tefsir ve İbn al-Athir'in Mukhtasar al-Nihaya adlı eserinin yaklaşık yarısında eserler yazdı; ayrıca Amma Suresi'nden Kur'an'ın sonuna kadar bir tefsir de vardı; ve dönemin mucizelerinden biriydi {atıf:shadharat-dhahab, s. 713-714}."
  id: "Sayyid Qutb al-Din al-Sharif al-Hasani al-Husseini al-Iji al-Shafi'i, dikenal sebagai Safavi, dinamai menurut kakek dari pihak ibu, Sayyid Safi al-Din, ayah dari Sheikh Mu'in al-Din al-Iji, penulis tafsir; lahir pada tahun 900, ia bekerja dalam tata bahasa dan morfologi di bawah bimbingan ayahnya, mempelajari hukum di bawah bimbingan ayahnya, dan mempelajari pelajaran tentang Shariah dalam logika. Ia kemudian mengikuti Sheikh dan al-Tardal al-Kazwani, penulis komentar tentang Faya Sariz, dan dihibur di bawah bimbingan Hakim Shihab al-Din al-Hindi di Gujarat, di mana ia belajar di bawah bimbingan Hakim Al-Ansar, al-Mutwal, dan lainnya, dan menerima izin dari Hakim. Kemudian ia mendengar kabar dari Abu al-Fadl al-Istrabadhi, Ia pergi ke Delhi, menghadiri pertemuan para ulamanya, dan berdiskusi dengan mereka. Sultan Ibrahim bin Sikandar Shah menunjukkan kebajikan dan menghormatinya, dan ia bertemu Al-Jalal al-Dawani dan memberinya izin. Kemudian ia menunaikan Haji dan tinggal di Mekah selama bertahun-tahun, memasuki Levant sekitar tahun 39, di mana sekelompok orang dari Damaskus dan Aleppo belajar di bawahnya, belajar di Damaskus tentang penjelasan Al-Kafiyah oleh Al-Radi, mengunjungi makam orang benar di Damaskus, mengunjungi Yerusalem, dua kali bepergian ke Romawi, dan Sultan Suleiman memberinya lima puluh Ottoman di perbendaharaan Mesir. Ia belajar di bawah bimbingannya di Aleppo dan mengenakan jubah darinya Ia belajar dhikr (peringatan Islam), lalu masuk ke Mesir dan menetap di sana; ia menulis karya-karya termasuk komentar singkat tentang Al-Kafiya, Sharh al-Ghurrah fi al-Mantiq oleh Sayyid al-Sharif, komentar atas Al-Fawa'id al-Diyya'i fi al-Ma'ani wa al-Bayan, dan Mukhtasar al-Nihaya karya Ibn al-Athir dalam sekitar setengah volumenya, serta tafsiran dari Surah Amma hingga akhir Al-Qur'an; dan ia adalah salah satu keajaiban pada masa itu {cite:shadharat-dhahab, hlm. 713-714}."
