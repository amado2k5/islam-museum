summary:
  ar: "السيد قطب الدين الشريف الحسني الحسيني الإيجي الشافعي المعروف بالصفوي نسبة إلى جده لأمه السيد صفي الدين والد الشيخ معين الدين الإيجي صاحب التفسير؛ ولد سنة تسعمائة واشتغل في النحو والصرف على أبيه وتفقه به وأخذ عنه الرسالة الصغرى والكبرى وتلقين الشريف في المنطق، ثم لازم الشيخ والترضل الكازواني صاحب الحاشية على فيا صارز والمرح على إرشاد القاضي شهاب الدين الهندي بكجرات فقرأ عليه العنصر والمطول وغيرهما وأجازه، ثم سمع بالإيعنا على أبي الفضل الاستراباذي، ورحل إلى دلهي وحضر مجالس علمائها وبحث معهم فظهر فضله وأكرمه السلطان إبراهيم بن سكندر شاه، وأدرك الجلال الدواني وأجاز له، ثم حج وجاور بمكة سنين ودخل بلاد الشام في حدود سنة تسع وثلاثين وأخذ عنه جماعة من أهل دمشق وحلب ودرس بدمشق في شرح الكافية للرضي وزار بدمشق قبور الصالحين وزار بيت المقدس، وسافر إلى الروم مرتين وأنعم عليه السلطان سليمان بخمسين عثمانياً في خزينة مصر، وأخذ عنه بحلب ابن الحنبلي ولبس منه الخرقة وتلقن الذكر، ثم دخل مصر واستوطنها؛ وله مؤلفات منها شرح مختصر على الكافية وشرح الغرة في المنطق للسيد الشريف وشرح الفوائد الضيائية في المعاني والبيان ومختصر النهاية لابن الأثير في نحو نصف حجمها وتفسير من سورة عم إلى آخر القرآن؛ وكان من أعاجيب الزمان {cite:shadharat-dhahab p. 713-714}."
  en: "The Iji grandson — b. 900, grandson of Safi al-Din al-Iji the mufassir; trained at Delhi's majalis under Sultan Ibrahim b. Sikandar Shah, licensed by Jalal al-Din al-Dawani, then six years of mujawara at Mecca; at Damascus he taught the Radi Kafiya, received Sulayman's fifty uthmani pension, gave Ibn al-Hanbali the khirqa at Aleppo, settled in Cairo; works: a short Kafiya sharh, the Ghurra sharh, the Diya'iyya sharh, a half-size Mukhtasar of Ibn al-Athir's Nihaya, a tafsir from sura 'Amma; 'one of the marvels of the age' {cite:shadharat-dhahab p. 713-714}."
