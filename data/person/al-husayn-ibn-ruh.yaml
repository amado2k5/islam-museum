summary:
  ar: "الذي تنسب إليه الإمامية البابية؛ كان على وزارة حامد بن العباس وقد أحدث الشلمغاني بعده مذهباً في حلول الإلهية {cite:kamil-ibn-al-athir p. 218}."
  en: "The man the Imamis call the Bab; attached to the vizierate of Hamid ibn al-Abbas — after him al-Shalmaghani produced his doctrine of divine indwelling {cite:kamil-ibn-al-athir p. 218}."
  es: "El hombre al que los imamíes llaman el Bab; vinculado al visirato de Hamid ibn al-Abbas —después de él, al-Shalmaghani produjo su doctrina de la morada divina {cite:kamil-ibn-al-athir p. 218}."
  fr: "L'homme que les Imamis appellent le Bab; attaché au vizirat de Hamid ibn al-Abbas — après lui al-Shalmaghani a produit sa doctrine de l'habitation divine {cite: kamil-ibn-al-athir p. 218}."
  ur: "جس شخص کو امامی باب کہتے ہیں۔ حامد بن العباس کے وزیر سے منسلک - ان کے بعد الشلمغانی نے اپنا عقیدہ الہی پیدا کیا {حوالہ: کامل ابن الاثیر صفحہ 218}۔"
  tr: "Baba İmamiyye'ye atfedilir; Hamid ibn al-Abbas'ın hizmetinde görev yaptı ve ondan sonra el-Şalmghani ilahiyatın katılımı üzerine bir doktrin getirdi {atıf:kamil-ibn-al-athir s. 218}."
  id: "yang menjadi tanggung jawab Bábí Imamiyyah; ia melayani di bawah pelayanan Hamid ibn al-Abbas, dan setelahnya, al-Shalmghani memperkenalkan doktrin tentang keterlibatan ketuhanan {cite:kamil-ibn-al-athir hlm. 218}."
