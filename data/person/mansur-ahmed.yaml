  ar: "داعية ومناظر بريطاني في ركن الخطباء بهايد بارك في لندن، وأحد مؤسسي قناة «دعوة وايز» (DawahWise) ومديريها مع هاشم؛ عُرف منذ سنوات بمناظراته العلنية مع المسيحيين والملحدين وغيرهم حول التثليث ومصداقية الكتاب المقدس وقضايا الإيمان، وببرامج القناة الحوارية بين الأديان."
  en: "British street preacher and debater at Speakers' Corner in London's Hyde Park, and a co-founder and co-host of the DawahWise channel with Hashim; he has been known for years for his public debates with Christians, atheists and others on the Trinity, the reliability of the Bible and questions of faith, and for the channel's interfaith discussion programmes."
