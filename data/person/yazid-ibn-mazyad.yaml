label: { ar: "يزيد بن مزيد", en: "Yazid ibn Mazyad" }
summary:
  ar: "يزيد بن مزيد؛ كان على مقدمة معن بن زائدة إلى الرخج ولما قتل الخوارج معناً ببست قتلهم فلم ينج منهم أحد ثم قام بأمر سجستان واشتدت على العرب والعجم من أهلها وطأته فاحتال عليه بعض العرب بكتاب على لسانه إلى المنصور فعزله وحبسه وباع كل شيء له ثم كلم فيه فأشخص إلى مدينة السلام فلقيه الخوارج على الجسر فقاتلهم ثم توجه إلى يوسف البرم بخراسان فلم يزل في ارتفاع."
  en: "Yazid ibn Mazyad; Ma'n's vanguard to Rukhkhaj — after the Kharijites killed Ma'n at Bust he slew them to a man, held Sijistan with a heavy hand until forged letters to al-Mansur brought his dismissal, imprisonment and confiscation; released, he hid in Madinat al-Salam, fought the Kharijites on the bridge, and rose under Yusuf al-Barm in Khurasan."
