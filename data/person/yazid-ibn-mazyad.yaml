label: { ar: "يزيد بن مزيد", en: "Yazid ibn Mazyad", es: "Yazid ibn Mazyad", fr: "Yazid ibn Mazyad", ur: "یزید بن مازیاد" }
summary:
  ar: "يزيد بن مزيد؛ كان على مقدمة معن بن زائدة إلى الرخج ولما قتل الخوارج معناً ببست قتلهم فلم ينج منهم أحد ثم قام بأمر سجستان واشتدت على العرب والعجم من أهلها وطأته فاحتال عليه بعض العرب بكتاب على لسانه إلى المنصور فعزله وحبسه وباع كل شيء له ثم كلم فيه فأشخص إلى مدينة السلام فلقيه الخوارج على الجسر فقاتلهم ثم توجه إلى يوسف البرم بخراسان فلم يزل في ارتفاع."
  en: "Yazid ibn Mazyad; Ma'n's vanguard to Rukhkhaj — after the Kharijites killed Ma'n at Bust he slew them to a man, held Sijistan with a heavy hand until forged letters to al-Mansur brought his dismissal, imprisonment and confiscation; released, he hid in Madinat al-Salam, fought the Kharijites on the bridge, and rose under Yusuf al-Barm in Khurasan."
  es: "Yazid ibn Mazyad, vanguardia de Ma'n en Rukhkhaj, tras la muerte de Ma'n a manos de los jariyíes en Bust, los masacró a todos, mantuvo Sijistan con mano dura hasta que unas cartas falsificadas dirigidas a al-Mansur provocaron su destitución, encarcelamiento y confiscación; liberado, se escondió en Madinat al-Salam, luchó contra los jariyíes en el puente y se alzó bajo el mando de Yusuf al-Barm en Jorasán."
  fr: "Yazid ibn Mazyad; avant-garde de Ma'n à Rukhkhaj — après que les Kharijites aient tué Ma'n à Bust, il les a tous massacrés, a tenu le Sijistan d'une main de fer jusqu'à ce que de fausses lettres à al-Mansur entraînent son renvoi, son emprisonnement et la confiscation de ses biens; libéré, il s'est caché à Madinat al-Salam, a combattu les Kharijites sur le pont et s'est soulevé sous Yusuf al-Barm au Khorasan."
  ur: "یزید بن مازیاد؛ رخخج کے لیے معن کا ہراول — خوارجیوں نے معن کو بُست میں قتل کرنے کے بعد انھیں ایک شخص کے حوالے کر دیا، سجستان کو بھاری ہاتھ سے پکڑا جب تک کہ المنصور کو جعلی خطوط اس کی برخاستگی، قید اور ضبطی لے آئے۔ رہا ہوا، وہ مدینۃ السلام میں چھپ گیا، پل پر خوارجیوں سے لڑا، اور خراسان میں یوسف البرم کے نیچے کھڑا ہوا۔"
