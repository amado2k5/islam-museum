summary:
  ar: "بدور بنت سلطان القاسمي (وُلدت سنة 1978) ناشرة ومسؤولة عامة إماراتية وابنة حاكم الشارقة. أسست مجموعة كلمات، أول دار إماراتية متخصصة في كتب الأطفال بالعربية، سنة 2007، وشاركت في تأسيس جمعية الناشرين الإماراتيين سنة 2009، وترأست الاتحاد الدولي للناشرين في 2021–2022، أول رئيس عربي له وثاني امرأة تتولى رئاسته. وهي رئيسة الجامعة الأميركية في الشارقة منذ 2022، وعُيّنت سنة 2025 سفيرة للنوايا الحسنة لدى اليونسكو للتربية وثقافة الكتاب."
  en: "Bodour bint Sultan Al Qasimi (born 1978) is an Emirati publisher and public official, a daughter of the Ruler of Sharjah. She founded Kalimat Group, the UAE's first dedicated Arabic children's publisher, in 2007, co-founded the Emirates Publishers Association in 2009, and served as president of the International Publishers Association in 2021–2022 — its first Arab president and second woman president. She has been president of the American University of Sharjah since 2022, and in 2025 she was appointed a UNESCO Goodwill Ambassador for Education and Book Culture."
  ur: "بدور بنت سلطان القاسمی (پیدائش 1978) اماراتی ناشر اور عوامی عہدیدار ہیں، حاکمِ شارجہ کی صاحبزادی۔ انھوں نے 2007 میں کلیمات گروپ قائم کیا، جو عربی بچوں کی کتابوں کا پہلا مخصوص اماراتی اشاعتی ادارہ تھا، 2009 میں امارات پبلشرز ایسوسی ایشن کی شریک بانی رہیں، اور 2021–2022 میں بین الاقوامی ناشران انجمن (آئی پی اے) کی صدر رہیں — اس کی پہلی عرب اور دوسری خاتون صدر۔ وہ 2022 سے امریکن یونیورسٹی آف شارجہ کی صدر ہیں اور 2025 میں انہیں تعلیم و کتابی ثقافت کے لیے یونیسکو کی خیرسگالی سفیر مقرر کیا گیا۔"
