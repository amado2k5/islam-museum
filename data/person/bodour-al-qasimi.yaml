summary:
  ar: "بدور بنت سلطان القاسمي ⁦(وُلدت سنة 1978)⁩ ناشرة ومسؤولة عامة إماراتية وابنة حاكم الشارقة. أسست مجموعة كلمات، أول دار إماراتية متخصصة في كتب الأطفال بالعربية، سنة 2007، وشاركت في تأسيس جمعية الناشرين الإماراتيين سنة 2009، وترأست الاتحاد الدولي للناشرين في 2021–2022، أول رئيس عربي له وثاني امرأة تتولى رئاسته. وهي رئيسة الجامعة الأميركية في الشارقة منذ 2022، وعُيّنت سنة 2025 سفيرة للنوايا الحسنة لدى اليونسكو للتربية وثقافة الكتاب."
  en: "Bodour bint Sultan Al Qasimi (born 1978) is an Emirati publisher and public official, a daughter of the Ruler of Sharjah. She founded Kalimat Group, the UAE's first dedicated Arabic children's publisher, in 2007, co-founded the Emirates Publishers Association in 2009, and served as president of the International Publishers Association in 2021–2022 — its first Arab president and second woman president. She has been president of the American University of Sharjah since 2022, and in 2025 she was appointed a UNESCO Goodwill Ambassador for Education and Book Culture."
  ur: "بدور بنت سلطان القاسمی ⁦(پیدائش 1978)⁩ اماراتی ناشر اور عوامی عہدیدار ہیں، حاکمِ شارجہ کی صاحبزادی۔ انھوں نے 2007 میں کلیمات گروپ قائم کیا، جو عربی بچوں کی کتابوں کا پہلا مخصوص اماراتی اشاعتی ادارہ تھا، 2009 میں امارات پبلشرز ایسوسی ایشن کی شریک بانی رہیں، اور 2021–2022 میں بین الاقوامی ناشران انجمن ⁦(آئی پی اے)⁩ کی صدر رہیں — اس کی پہلی عرب اور دوسری خاتون صدر۔ وہ 2022 سے امریکن یونیورسٹی آف شارجہ کی صدر ہیں اور 2025 میں انہیں تعلیم و کتابی ثقافت کے لیے یونیسکو کی خیرسگالی سفیر مقرر کیا گیا۔"
  es: "Bodour bint Sultan Al Qasimi (nacida en 1978) es una editora y funcionaria pública emiratí, hija del gobernante de Sharjah. Fundó Kalimat Group, la primera editorial de los Emiratos Árabes Unidos dedicada exclusivamente a la literatura infantil en árabe, en 2007; cofundó la Asociación de Editores de los Emiratos en 2009; y fue presidenta de la Asociación Internacional de Editores entre 2021 y 2022, siendo la primera presidenta árabe y la segunda mujer en ocupar dicho cargo. Es presidenta de la Universidad Americana de Sharjah desde 2022, y en 2025 fue nombrada Embajadora de Buena Voluntad de la UNESCO para la Educación y la Cultura del Libro."
  fr: "Bodour bint Sultan Al Qasimi (née en 1978) est une éditrice et femme politique émiratie, fille du souverain de Sharjah. Elle a fondé le groupe Kalimat, première maison d'édition jeunesse arabophone des Émirats arabes unis, en 2007, a cofondé l'Association des éditeurs des Émirats en 2009 et a présidé l'Association internationale des éditeurs de 2021 à 2022 – la première présidente arabe et la deuxième femme à occuper ce poste. Elle est présidente de l'Université américaine de Sharjah depuis 2022 et a été nommée ambassadrice de bonne volonté de l'UNESCO pour l'éducation et la culture du livre en 2025."
  tr: "Badr bint Sultan Al Kasimi (d. 1978), Emirlikli bir yayıncı ve kamu görevlisidir ve Sharjah Hükümdarı'nın kızıdır. 2007 yılında Arapça çocuk kitaplarına uzmanlaşmış ilk Emirlik yayınevi Kalimat Group'u kurmuş, 2009'da Emirates Publishers Association'ın kurucu ortaklarından olmuş ve 2021–2022 yıllarında Uluslararası Yayıncılar Derneği'nin başkanlığını yaparak ilk Arap başkanı ve ikinci kadın başkan olmuştur. 2022'den beri American University of Sharjah'ın başkanıdır ve 2025'te UNESCO Eğitim ve Kitap Kültürü için İyi Niyet Elçisi olarak atanmıştır."
  id: "Badr bint Sultan Al Qasimi (lahir 1978) adalah seorang penerbit dan pejabat publik Emirat, serta putri dari Penguasa Sharjah. Ia mendirikan Kalimat Group, penerbit Emirat pertama yang mengkhususkan diri pada buku anak-anak berbahasa Arab, pada tahun 2007, ikut mendirikan Emirates Publishers Association pada tahun 2009, dan memimpin International Publishers Association pada tahun 2021–2022, menjadi presiden Arab pertama dan presiden perempuan kedua. Ia telah menjabat sebagai Presiden American University of Sharjah sejak tahun 2022, dan pada tahun 2025 diangkat sebagai Duta Besar untuk UNESCO dalam bidang Pendidikan dan Budaya Buku."
