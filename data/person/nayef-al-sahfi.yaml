  ar: "داعية سعودي اشتهر بمقاطع دعوية قصيرة ذات طابع مرح موجهة إلى الشباب عبر منصات التواصل، منها سلسلة «قصة آية» وتمثيليات «فوانيس». اعتُقل في سبتمبر 2017 بحسب منظمات حقوقية، وحكمت عليه المحكمة الجزائية المتخصصة سنة 2020 بالسجن عشر سنوات بحسب تلك المنظمات."
