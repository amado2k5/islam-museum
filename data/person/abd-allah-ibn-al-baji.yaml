summary:
  ar: "أبو محمد عبد الله بن محمد، المعروف بابن الباجي، فقيه مالكي سمع من ابن لبابة وأسلم بن عبد العزيز وأحمد بن خالد وقاسم بن أصبغ وغيرهم. وسمع منه ابنه أحمد وحفيده محمد بن أحمد وابن الفرضي والأصيلي وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8191}"
  en: "Abu Muhammad Abd Allah ibn Muhammad, known as Ibn al-Baji, a Maliki jurist. He studied with Ibn Lubaba, Aslam ibn Abd al-Aziz, Ahmad ibn Khalid and Qasim ibn Asbagh among others; his son Ahmad, his grandson Muhammad ibn Ahmad, Ibn al-Farudi and al-Asili heard him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8191}"
  fr: "Abu Muhammad Abd Allah ibn Muhammad, connu sous le nom d'Ibn al-Baji, juriste malikite. Il étudia auprès d'Ibn Lubaba, d'Aslam ibn Abd al-Aziz, d'Ahmad ibn Khalid et de Qasim ibn Asbagh, entre autres ; son fils Ahmad, son petit-fils Muhammad ibn Ahmad, Ibn al-Farudi et al-Asili l'entendirent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8191}"
  es: "Abu Muhammad Abd Allah ibn Muhammad, conocido como Ibn al-Baji, un jurista Maliki. Estudió con Ibn Lubaba, Aslam ibn Abd al-Aziz, Ahmad ibn Khalid y Qasim ibn Asbagh, entre otros; su hijo Ahmad, su nieto Muhammad ibn Ahmad, Ibn al-Farudi y al-Asili lo escucharon. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8191}"
  ur: "ابو محمد عبد اللہ ابن محمد، جو ابن الباجی کے نام سے مشہور ہیں، ایک مالکی فقیہ تھے۔ اس نے ابن لبابہ، اسلم بن عبد العزیز، احمد بن خالد، اور قاسم ابن اصبغ وغیرہ کے ساتھ تعلیم حاصل کی۔ اس کے بیٹے احمد، اس کے پوتے محمد بن احمد، ابن الفرودی اور العسیلی نے اسے بات کرتے سنا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 8191}"
  tr: "İbn el-Baji olarak bilinen Ebu Muhammed Abdullah ibn Muhammed, İbn Lubaba, Aslam ibn Abd al-Aziz, Ahmed ibn Halid, Qasim ibn Asbagh ve diğerlerinden eğitim almış bir Maliki hukukçusuydu. Öğrencileri arasında oğlu Ahmed, torunu Muhammed ibn Ahmed, İbn el-Faradi, el-Asili ve diğerleri vardı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8191}"
  id: "Abu Muhammad Abdullah ibn Muhammad atau dikenal dengan Ibnu al-Baji adalah seorang ahli hukum Maliki yang belajar pada Ibnu Lubaba, Aslam ibn Abd al-Aziz, Ahmad ibn Khalid, Qasim ibn Asbagh, dan lain-lain. Murid-muridnya antara lain putranya Ahmad, cucunya Muhammad bin Ahmad, Ibnu al-Faradi, al-Asili, dan lain-lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hal.8191}"
