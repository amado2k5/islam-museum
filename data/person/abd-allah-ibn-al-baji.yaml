  ar: "أبو محمد عبد الله بن محمد، المعروف بابن الباجي، فقيه مالكي سمع من ابن لبابة وأسلم بن عبد العزيز وأحمد بن خالد وقاسم بن أصبغ وغيرهم. وسمع منه ابنه أحمد وحفيده محمد بن أحمد وابن الفرضي والأصيلي وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8191}"
  en: "Abu Muhammad Abd Allah ibn Muhammad, known as Ibn al-Baji, a Maliki jurist. He studied with Ibn Lubaba, Aslam ibn Abd al-Aziz, Ahmad ibn Khalid and Qasim ibn Asbagh among others; his son Ahmad, his grandson Muhammad ibn Ahmad, Ibn al-Farudi and al-Asili heard him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8191}"
