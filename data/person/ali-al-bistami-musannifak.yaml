summary:
  ar: "علي بن محمد بن مسعود الشاهرودي البسطامي، علاء الدين، المعروف بمصنفك، باحث من سلالة فخر الدين الرازي، ولد بخراسان ونشأ في هراة وعلّم في قونية ثم الآستانة وتوفي بها سنة 875 هـ، وأكثر مصنفاته حواش وشروح."
  en: "Ali ibn Muhammad ibn Mas'ud al-Shahrudi al-Bistami, Ala al-Din, known as Musannifak, a researcher descended from Fakhr al-Din al-Razi, born in Khurasan, raised in Herat, teacher in Konya then Istanbul, where he died in 875 AH (1470); most of his writings are glosses and commentaries."
