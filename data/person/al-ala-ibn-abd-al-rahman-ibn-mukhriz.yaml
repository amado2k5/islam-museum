id: person/al-ala-ibn-abd-al-rahman-ibn-mukhriz
class: person
label: { ar: "العلاء بن عبد الرحمن بن مخرز", en: "al-Ala' ibn Abd al-Rahman ibn Mukhriz", fr: "Al-Ala’ ibn Abd al-Rahman ibn Mukhriz", es: "al-Ala' ibn Abd al-Rahman ibn Mukhriz", ur: "علاء بن عبدالرحمٰن بن مخریز" }
summary:
  ar: "العلاء بن عبد الرحمن بن مخرز بن حارثة بن ربيعة بن عبد العزى بن عبد شمس بن عبد مناف؛ عند البلاذري عن الكلبي كان على ربع الكوفة أيام ابن الزبير وتنسب إليه سكة ابن مخرز وكانت داره موضع دار عيسى بن موسى المعروفة."
  en: "al-Ala' ibn Abd al-Rahman ibn Mukhriz, Qurashi of Abd Shams; in al-Baladhuri — per al-Kalbi — he was over Kufa's quarter in Ibn al-Zubayr's days, Sikkat Ibn Mukhriz being named for him, his house the site of today's Dar Isa ibn Musa."
  fr: "Al-Ala’ ibn Abd al-Rahman ibn Mukhriz, Qurayshite des Abd Shams ; chez al-Baladhuri, d’après al-Kalbi, il dirigeait un quartier de Kufa à l’époque d’Ibn al-Zubayr. La Sikkat Ibn Mukhriz portait son nom ; sa maison occupait l’emplacement de l’actuelle Dar Isa ibn Musa."
  es: "al-Ala' ibn Abd al-Rahman ibn Mukhriz, Qurashi de Abd Shams; en al-Baladhuri —según al-Kalbi— estaba al frente del barrio de Kufa en tiempos de Ibn al-Zubayr, y Sikkat Ibn Mukhriz recibió su nombre en su honor; su casa es el emplazamiento de la actual Dar Isa ibn Musa."
  ur: "علاء بن عبدالرحمٰن بن مخریز، عبد شمس کے قریشی؛ البلادوری میں - فی الکلبی - وہ ابن الزبیر کے دنوں میں کوفہ کے کوارٹر پر تھا، سکت ابن مخریز کو اس کے نام سے منسوب کیا گیا تھا، اس کا گھر آج کے دار عیسیٰ ابن موسی کی جگہ ہے۔"
