label:
  ar: "علي باشا التبدلني"
  en: "Ali Pasha of Tepelena (of Yanya)"
  ur: "علی پاشا تیپدلنی"
  es: "Ali Pasha of Tepelena (of Yanya)"
  fr: "Ali Pasha of Tepelena (of Yanya)"
summary:
  ar: "علي باشا التبدلني ⁦(تبيدلنلي)⁩ صاحب يانيا، ابن ولي بك من أعيان تبدلن؛ عُيّن بتوصية كورت باشا متصرفاً على يانيا برتبة أمير الأمراء ثم والياً على يانيا وينيشهر ومنستير وسلانيك، فاقتنى أكثر من مئتي ضيعة وانتصر على الفرنسيين فأُعطي الوزارة سنة ١٢٢٥هـ/١٨١٠م ثم والي روملي وسرعسكر سنة ١٢٢٦هـ/١٨١١م؛ جاوز عمره الثمانين وتوفي سنة ١٢٣٧هـ/١٨٢١م ودُفن في سليوري قاپي {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  en: "Ali Pasha of Tepelena, master of Yanya (Ioannina), son of the Tepelena notable Veli Bey; on Kurt Pasha's recommendation made mutasarrıf of Yanya with mirmiran rank, then governor of Yanya, Yenişehir, Manastır and Selanik, acquiring over two hundred estates and defeating the French — rewarded with the vizierate in 1225/1810, then Rumeli governor and serasker in 1226/1811; past eighty when he died in 1237/1821–22, buried at Silivrikapı {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  ur: "علی پاشا تیپدلنی، یانیا کا حاکم، تیپدلن کے رئیس ولی بے کا بیٹا؛ قورت پاشا کی سفارش پر میرمیران کے رتبے سے یانیا کا متصرف بنا، پھر یانیا، ینی شہر، مانستر اور سلانیک کا والی، دو سو سے زیادہ جاگیریں حاصل کیں اور فرانسیسیوں کو شکست دی جس پر ١٢٢٥ھ/١٨١٠ء میں وزارت ملی، پھر ١٢٢٦ھ/١٨١١ء میں رومیلی کا والی و سرعسکر؛ اسی سال سے بڑھاپے میں ١٢٣٧ھ/١٨٢١ء میں فوت ہوا اور سلوری قاپی میں دفن ہوا {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  es: "Ali Pasha de Tepelena, señor de Yanya (Ioannina), hijo del notable Veli Bey de Tepelena; por recomendación de Kurt Pasha fue nombrado mutasarrıf de Yanya con rango de mirmiran, luego gobernador de Yanya, Yenişehir, Manastır y Selanik, adquiriendo más de doscientas propiedades y derrotando a los franceses; fue recompensado con el visirato en 1225/1810, luego gobernador de Rumeli y serasker en 1226/1811; tenía más de ochenta años cuando murió en 1237/1821–22, enterrado en Silivrikapı {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  fr: "Ali Pacha de Tepelena, maître de Yanya (Ioannina), fils du notable de Tepelena, Veli Bey; sur la recommandation de Kurt Pacha, il fut nommé mutasarrıf de Yanya avec le rang de mirmiran, puis gouverneur de Yanya, Yenişehir, Manastır et Selanik, acquérant plus de deux cents domaines et vainquant les Français — récompensé par le vizirat en 1225/1810, puis gouverneur de Rumeli et serasker en 1226/1811; il avait plus de quatre-vingts ans lorsqu'il mourut en 1237/1821–22, enterré à Silivrikapı {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  tr: "Yanya'nın hükümdarı Ali Paşa Tepedeleni (Tabbedlenli), Tebedlen'in soylularından Vali Bey'in oğlu; Kurt Paşa'nın tavsiyesiyle Prensler Prensi rütbesiyle Yanja valisi olarak atandı, ardından Yanja, Yenişeher, Monastir ve Thessalnik valisi oldu. İki yüzün üzerinde mülk edindi ve Fransızları mağlup etti, 1225 Hicri/1810 yılında vezirlik verdi, ardından 1226 Hicri / 1811 yılında Rumeli ve Sarskar valisi oldu. Seksen yaşını aşmıştı ve 1237 Hicri / 1821 yılında öldü. Siluri Kapı'da defnedildi {cite:sicill-i-osmani cilt 1, 'Ali Paşa Tepedelen'}."
  id: "Ali Pasha Tepedeleni (Tabbedlenli), penguasa Yanya, putra Wali Bey dari kalangan bangsawan Tebedlen; ia diangkat menjadi gubernur Yanja atas rekomendasi Kurt Pasha dengan pangkat Pangeran Pangeran, kemudian gubernur Yanja, Yenişeher, Monastir, dan Thessalnik. Ia memperoleh lebih dari dua ratus tanah dan mengalahkan Prancis, memberinya jabatan wazir pada tahun 1225 H/1810 M, kemudian gubernur Rumeli dan Sarskar pada tahun 1226 H / 1811 M. Ia berusia lebih dari delapan puluh tahun dan meninggal pada 1237 H / 1821 M. Ia dimakamkan di Siluri Kapi {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
