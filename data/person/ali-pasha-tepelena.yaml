id: person/ali-pasha-tepelena
class: person
label:
  ar: "علي باشا التبدلني"
  en: "Ali Pasha of Tepelena (of Yanya)"
  ur: "علی پاشا تیپدلنی"
summary:
  ar: "علي باشا التبدلني (تبيدلنلي) صاحب يانيا، ابن ولي بك من أعيان تبدلن؛ عُيّن بتوصية كورت باشا متصرفاً على يانيا برتبة أمير الأمراء ثم والياً على يانيا وينيشهر ومنستير وسلانيك، فاقتنى أكثر من مئتي ضيعة وانتصر على الفرنسيين فأُعطي الوزارة سنة ١٢٢٥هـ/١٨١٠م ثم والي روملي وسرعسكر سنة ١٢٢٦هـ/١٨١١م؛ جاوز عمره الثمانين وتوفي سنة ١٢٣٧هـ/١٨٢١م ودُفن في سليوري قاپي {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  en: "Ali Pasha of Tepelena, master of Yanya (Ioannina), son of the Tepelena notable Veli Bey; on Kurt Pasha's recommendation made mutasarrıf of Yanya with mirmiran rank, then governor of Yanya, Yenişehir, Manastır and Selanik, acquiring over two hundred estates and defeating the French — rewarded with the vizierate in 1225/1810, then Rumeli governor and serasker in 1226/1811; past eighty when he died in 1237/1821–22, buried at Silivrikapı {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
  ur: "علی پاشا تیپدلنی، یانیا کا حاکم، تیپدلن کے رئیس ولی بے کا بیٹا؛ قورت پاشا کی سفارش پر میرمیران کے رتبے سے یانیا کا متصرف بنا، پھر یانیا، ینی شہر، مانستر اور سلانیک کا والی، دو سو سے زیادہ جاگیریں حاصل کیں اور فرانسیسیوں کو شکست دی جس پر ١٢٢٥ھ/١٨١٠ء میں وزارت ملی، پھر ١٢٢٦ھ/١٨١١ء میں رومیلی کا والی و سرعسکر؛ اسی سال سے بڑھاپے میں ١٢٣٧ھ/١٨٢١ء میں فوت ہوا اور سلوری قاپی میں دفن ہوا {cite:sicill-i-osmani vol. 1, 'Ali Paşa Tepedelen'}."
