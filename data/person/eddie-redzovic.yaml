summary:
  ar: "مذيع مسلم أمريكي مقيم في شيكاغو، مؤسس برنامج «ذا دين شو» (The Deen Show) ومقدّمه، وهو برنامج حواري دعوي طويل الأمد يستضيف علماء وناشطين وأكاديميين مسلمين، ومؤسس مركز الدين (The Deen Center) ومديره. اعتنق الإسلام وقدّم البرنامج أكثر من ثمانية عشر عامًا."
  en: "An American Muslim broadcaster based in Chicago, founder and host of The Deen Show, a long-running dawah talk show interviewing Muslim clerics, activists and academics, and founder and head of the Deen Center. A convert to Islam, he has presented the show for over eighteen years."
  ur: "شکاگو میں مقیم امریکی مسلمان نشریاتی میزبان، ’دی دین شو‘ (The Deen Show) کے بانی و میزبان — یہ ایک طویل عرصے سے جاری دعوتی ٹاک شو ہے جس میں مسلمان علماء، کارکنان اور اہلِ علم سے گفتگو ہوتی ہے — اور دین سینٹر (The Deen Center) کے بانی و سربراہ ہیں۔ وہ نو مسلم ہیں اور اٹھارہ برس سے زائد عرصے سے یہ پروگرام پیش کر رہے ہیں۔"
