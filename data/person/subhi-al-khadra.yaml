summary:
  ar: "سياسي ومحامٍ فلسطيني من صفد (1895–1954)، من مؤسسي حزب الاستقلال وقادته؛ ضابط عثماني سابق انضم إلى الثورة العربية، وقاد النشاط الوطني في الجليل، وسُجن ثلاث سنوات لدوره في ثورة 1936–1939."
  en: "Palestinian politician and lawyer from Safed (1895–1954), a founder and leader of the Istiqlal Party. A former Ottoman officer who joined the Arab Revolt, he led nationalist activity in the Galilee and was imprisoned for three years for his part in the 1936–1939 revolt."
  ur: "صفد سے تعلق رکھنے والے فلسطینی سیاست دان اور وکیل (1895–1954)، استقلال پارٹی کے بانیوں اور رہنماؤں میں سے ایک؛ سابق عثمانی افسر جو عرب بغاوت میں شامل ہوئے، گلیل میں قوم پرست سرگرمیوں کی قیادت کی اور 1936–1939 کی بغاوت میں اپنے کردار پر تین سال قید رہے۔"
