summary:
  en: "A noble Ansari Companion from Banu Salima of the Khazraj, son of al-Bara' ibn Ma'rur; Badri veteran who was present at the conquest of Khaybar; ate from the poisoned sheep offered by Zaynab bint al-Harith and died of its effects."
  ar: "صحابي بدري شريف من بني سلمة، ابن النقيب البراء بن معرور؛ شهد العقبة الثانية وبدراً وأحداً والخندق وصلح الحديبية؛ أكل مع النبي من الشاة المسمومة بخيبر فأساغ اللقمة فمات منها شهيداً."
  ur: "بنو سلیمہ خزرج کا معزز انصاری صحابی، براء بن معرور کا فرزند؛ بدری تجربہ کار جو خیبر کی فتح میں موجود تھا اور زہر آلود بھیڑ کے گوشت سے متاثر ہوا۔"
  es: "Un noble compañero Ansari de Banu Salima de Khazraj, hijo de al-Bara' ibn Ma'rur; veterano Badri que estuvo presente en la conquista de Khaybar; comió de la oveja envenenada que le ofreció Zaynab bint al-Harith y murió a causa de sus efectos."
  fr: "Un noble compagnon Ansari de Banu Salima des Khazraj, fils d'al-Bara' ibn Ma'rur; vétéran Badri qui était présent lors de la conquête de Khaybar; mangea du mouton empoisonné offert par Zaynab bint al-Harith et mourut des suites de son empoisonnement."
  tr: "Banu Salamah'dan Badr'ın soylu bir yoldaşı, lider Al-Bar' ibn Ma'rur'un oğlu; İkinci Akeba, Bedir, Uhud, Hendek ve Hudeybiye Antlaşması'na tanıklık etti; Peygamber ile birlikte Haybar'da zehirli koyundan yedi, bir ısırık aldı ve şehit olarak öldü."
  id: "Seorang sahabat mulia Badr dari Banu Salamah, putra pemimpin Al-Bara' ibn Ma'rur; ia menyaksikan Aqabah Kedua, Badr, Uhud, Parit, dan Perjanjian Hudaybiyyah; ia makan bersama Nabi dari domba beracun di Khaybar, menggigitnya, dan meninggal sebagai syahid."
