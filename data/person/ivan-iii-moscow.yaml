roles: [ruler]
summary:
  ar: "إيفان الثالث، دوق موسكو؛ ينقل الصلابي أن أول سفير روسي وصل إلى إسلامبول في عهد بايزيد الثاني عام 898هـ/1492م في عهده، وأن إيفان في عام 886هـ «انتزع إمارة موسكو من أيدي المسلمين العثمانيين وبدأ التوسع على حساب الولايات الإسلامية» — وهو ما يذكره الكتاب في سياق حديثه عن تمدد الدبلوماسية الغربية {cite:dawlat-uthmaniyya-salabi p. 165}."
  en: "Ivan III, duke of Muscovy; al-Salabi dates to his reign the first Russian ambassador's arrival at Islambul in 898/1492 under Bayezid II, and writes that in 886 Ivan 'wrested the emirate of Moscow from the hands of the Muslim Ottomans and began expanding at the expense of the Islamic provinces' — the book's own framing within its account of widening Western diplomacy {cite:dawlat-uthmaniyya-salabi p. 165}."
  es: "Iván III, duque de Moscovia; al-Salabi sitúa en su reinado la llegada del primer embajador ruso a Islambul en 898/1492 bajo Bayezid II, y escribe que en 886 Iván «arrebató el emirato de Moscú de las manos de los otomanos musulmanes y comenzó a expandirse a expensas de las provincias islámicas», el propio marco del libro dentro de su relato de la expansión de la diplomacia occidental {cite:dawlat-uthmaniyya-salabi p. 165}."
  fr: "Ivan III, duc de Moscovie; al-Salabi date de son règne l'arrivée du premier ambassadeur russe à Islambul en 898/1492 sous Bayezid II, et écrit qu'en 886 Ivan « arracha l'émirat de Moscou aux Ottomans musulmans et commença à s'étendre aux dépens des provinces islamiques » — le cadre propre du livre dans son récit de l'élargissement de la diplomatie occidentale {cite:dawlat-uthmaniyya-salabi p. 165}."
