  ar: "إيفان الثالث، دوق موسكو؛ ينقل الصلابي أن أول سفير روسي وصل إلى إسلامبول في عهد بايزيد الثاني عام 898هـ/1492م في عهده، وأن إيفان في عام 886هـ «انتزع إمارة موسكو من أيدي المسلمين العثمانيين وبدأ التوسع على حساب الولايات الإسلامية» — وهو ما يذكره الكتاب في سياق حديثه عن تمدد الدبلوماسية الغربية {cite:dawlat-uthmaniyya-salabi p. 165}."
  en: "Ivan III, duke of Muscovy; al-Salabi dates to his reign the first Russian ambassador's arrival at Islambul in 898/1492 under Bayezid II, and writes that in 886 Ivan 'wrested the emirate of Moscow from the hands of the Muslim Ottomans and began expanding at the expense of the Islamic provinces' — the book's own framing within its account of widening Western diplomacy {cite:dawlat-uthmaniyya-salabi p. 165}."
