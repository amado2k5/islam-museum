summary:
  ar: "أبو جعفر محمد بن موسى بن شاكر (وُلد قبل 803 وتوفي 873)، أكبر بني موسى في بغداد: فلكي ورياضي وأغزر الإخوة إنتاجًا، راعي المترجمين في بيت الحكمة، وهو الذي استقدم ثابت بن قرة من حران، وشخصية بلاط بلغ نشاطه السياسي ذروته في صراعات خلافة الستينيات من القرن التاسع. كتب مع أخويه «كتاب معرفة مساحة الأشكال البسيطة والكريّة»، ومن أعماله الخاصة تحريره لمخروطات أبولونيوس و«كتاب حركة الفلك الأولى» وكتاب في رؤية الهلال."
  en: "Abu Ja'far Muhammad ibn Musa ibn Shakir (born before 803, died 873), eldest of the Banu Musa brothers of Baghdad: astronomer, mathematician and the most productive of the three, patron of the translators of the House of Wisdom, the man who recruited Thabit ibn Qurra from Harran, and a court figure whose political activity peaked in the caliphal succession struggles of the 860s. With his brothers he wrote the Book on the Measurement of Plane and Spherical Figures; his own works include a recension of Apollonius's Conics, the Book on the First Motion of the Celestial Sphere and a treatise on the visibility of the crescent."
  ur: "ابو جعفر محمد بن موسی بن شاکر (پیدائش 803ء سے پہلے، وفات 873ء)، بغداد کے بنو موسی میں سب سے بڑے بھائی: ماہر فلکیات و ریاضی دان اور تینوں میں سب سے زرخیز مصنف، بیت الحکمت کے مترجمین کے سرپرست، حران سے ثابت بن قرہ کو لانے والے، اور دربار کی وہ شخصیت جن کی سیاسی سرگرمی 860ء کی دہائی کی جانشینی کی کشمکش میں عروج پر پہنچی۔ انھوں نے اپنے بھائیوں کے ساتھ «کتاب معرفۃ مساحۃ الاشکال» لکھی؛ ان کی اپنی تصانیف میں اپولونیوس کے مخروطات کی تحریر، «کتاب حرکۃ الفلک الاولیٰ» اور ہلال کی رؤیت پر ایک رسالہ شامل ہیں۔"

