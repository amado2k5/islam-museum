summary:
  ar: "أبو الحسن علي بن أحمد بن يوسف بن جعفر بن عرفة المكاري الملقب شيخ الإسلام؛ من ولد عتبة بن أبي سفيان صخر بن حرب بن أمية؛ كان كثير الخير والعبادة وطاف البلاد واجتمع بالعلماء والمشايخ وأخذ عنهم الحديث ثم رجع إلى وطنه وانقطع به؛ ولقي الشيخ أبا العلاء المعري وسمع منه فلما انفصل عنه سأله بعض أصحابه عما رآه منه فقال: هو رجل من المسلمين؛ وسُمعت أن بعض الأكابر قال له: أنت شيخ الإسلام، فقال: بل أنا شيخ في الإسلام؛ وخرج من أولاده وحفدته جماعة تقدموا عند الملوك {cite:wafayat-ayan}."
  en: "Shaykh al-Islam al-Makari (409–486) — Umayyad-descended shaykh of al-Makara near Aleppo; met al-Ma'arri and summed him up as 'a man of the Muslims'; when titled Shaykh al-Islam he answered 'rather a shaykh in Islam' {cite:wafayat-ayan}."
