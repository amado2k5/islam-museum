summary:
  ar: "أبو الحسن علي بن أحمد بن يوسف بن جعفر بن عرفة المكاري الملقب شيخ الإسلام؛ من ولد عتبة بن أبي سفيان صخر بن حرب بن أمية؛ كان كثير الخير والعبادة وطاف البلاد واجتمع بالعلماء والمشايخ وأخذ عنهم الحديث ثم رجع إلى وطنه وانقطع به؛ ولقي الشيخ أبا العلاء المعري وسمع منه فلما انفصل عنه سأله بعض أصحابه عما رآه منه فقال: هو رجل من المسلمين؛ وسُمعت أن بعض الأكابر قال له: أنت شيخ الإسلام، فقال: بل أنا شيخ في الإسلام؛ وخرج من أولاده وحفدته جماعة تقدموا عند الملوك {cite:wafayat-ayan}."
  en: "Shaykh al-Islam al-Makari (409–486) — Umayyad-descended shaykh of al-Makara near Aleppo; met al-Ma'arri and summed him up as 'a man of the Muslims'; when titled Shaykh al-Islam he answered 'rather a shaykh in Islam' {cite:wafayat-ayan}."
  es: "Shaykh al-Islam al-Makari (409–486) — Shaykh descendiente de los Omeyas de al-Makara cerca de Alepo; conoció a al-Ma'arri y lo resumió como 'un hombre de los musulmanes'; cuando se le llamó Shaykh al-Islam, respondió 'más bien un shaykh en el Islam' {cite:wafayat-ayan}."
  fr: "Cheikh al-Islam al-Makari (409–486) — Cheikh d'al-Makara, descendant des Omeyyades, près d'Alep; rencontra al-Ma'arri et le résuma comme « un homme des musulmans »; lorsqu'on le nomma Cheikh al-Islam, il répondit « plutôt un cheikh de l'Islam » {cite:wafayat-ayan}."
  ur: "شیخ الاسلام المکری (409-486) - حلب کے قریب المکارہ کے اموی نسل کے شیخ؛ المعری سے ملاقات کی اور اسے 'مسلمانوں کا آدمی' کہا؛ جب شیخ الاسلام کا عنوان دیا تو اس نے جواب دیا 'بلکہ ایک شیخ اسلام میں'۔"
  tr: "Ebu el-Hasan Ali ibn Ahmed ibn Yusuf ibn Ca'far ibn 'Arafah al-Makari, Şeyh al-Islam olarak bilinir, Utbah ibn Ebi Sufyan Sakhr ibn Harb ibn Umayyah'ın soyundan geliyordu. Çok cömert ve dindardı, toprakları gezdi, alimler ve şeyhlerle görüştü, onlardan hadis öğrendi, sonra memleketine döndü ve orada kaldı. Şeyh Ebu al-Ala'al-Ma'arri ile görüştü ve ondan haber aldı. Ayrıldığında, bazı yoldaşları ona ne gördüğünü sordular, o da dedi ki: 'O Müslüman bir adamdır.' Bazı yaşlıların ona: 'Sen İslam'ın şeyhisin.' dedi. O da şöyle cevap verdi: 'Ben İslam'da bir şeyhim.' Oğulları ve torunlarından oluşan bir grup, kralların huzuruna gelmiş oldular {atı: wafayat-ayan}."
  id: "Abu al-Hasan Ali ibn Ahmad ibn Yusuf ibn Ja'far ibn 'Arafah al-Makari, yang dikenal sebagai Sheikh al-Islam, adalah keturunan Utbah ibn Abi Sufyan Sakhr ibn Harb ibn Umayyah. Ia sangat murah hati dan taat dalam beribadah, berkeliling negeri, bertemu dengan para ulama dan sheikh, mempelajari hadits dari mereka, lalu kembali ke tanah airnya dan tinggal di sana. Ia bertemu Sheikh Abu al-Ala' al-Ma'arri dan mendengar kabar darinya. Ketika ia berpisah, beberapa sahabatnya bertanya apa yang ia lihat tentangnya, dan ia berkata: 'Dia adalah orang Muslim.' Saya mendengar beberapa tetua berkata kepadanya: 'Engkau adalah Sheikh Islam.' Ia menjawab: 'Sebenarnya, saya adalah sheikh dalam Islam.' Sekelompok putra dan cucunya keluar yang telah datang ke hadapan para raja {cite:wafayat-ayan}."
