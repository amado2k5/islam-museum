    basis: documented
    note: "Attested for the man himself by two independent prose texts: the English article's lead calls him an 'Iranian Akhbari Twelver Shi'i Muslim, mystic, poet, philosopher, and muhaddith', and the Arabic article's lead calls him a jurist, traditionist, exegete, theologian and philosopher who was 'Shi'i Imami'; companion Encyclopaedia Iranica articles place him among the leading moderate Akhbaris within Imamite Shi'ism. His Akhbari orientation — reliance on the Imams' reports over ijma — is part of the attestation and is stated in the prose. The texts' own Twelver and Imami wording is followed."
