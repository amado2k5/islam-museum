  ar: "محسن الفيض الكاشاني ⁦(محمد بن مرتضى بن محمود، ١٥٩٨–١٦٨٠م)⁩، فقيه ومحدّث وفيلسوف ومتصوّف شيعي إمامي أخباري من كاشان، أخذ عن الشيخ البهائي والمير داماد وملا صدرا الذي تلمذ عليه ثماني سنين وتزوّج ابنته، وصاحب «الوافي» في الحديث و«تفسير الصافي» و«المحجة البيضاء»."
  en: "Muhsin Fayz Kashani (Muhammad b. Murtada b. Mahmud, 1598–1680) was an Akhbari Twelver Shi'i jurist, traditionist, philosopher and mystic of Kashan who studied under Shaykh Baha'i, Mir Damad and Mulla Sadra — his teacher for eight years, whose daughter he married — and wrote al-Wafi on hadith, Tafsir al-Safi and al-Mahajja al-bayza."
faith:
