summary:
  ar: "قارئ قرآن مصري (1926–1985) دخل الإذاعة المصرية في 1948، وقرأ في مسجد السيد البدوي بطنطا (1959–1980) ثم في مسجد الحسين بالقاهرة، وسجّل المصحف مرتلًا ومجودًا، وكان نائب نقيب القراء منذ تأسيس النقابة في 1984."
  en: "Egyptian Qur'an reciter (1926–1985) who joined Egyptian Radio in 1948, recited at the Ahmad al-Badawi Mosque in Tanta (1959–1980) and then at al-Hussein Mosque in Cairo, recorded the Qur'an in murattal and mujawwad styles, and was deputy head of the reciters' syndicate from its founding in 1984."
  ur: "مصری قاریِ قرآن ⁦(1926ء–1985ء)⁩، جو 1948ء میں مصری ریڈیو سے وابستہ ہوئے، طنطا کی مسجد احمد البدوی ⁦(1959ء–1980ء)⁩ اور پھر قاہرہ کی مسجد حسین میں قاری رہے، مرتل اور مجود دونوں انداز میں قرآن ریکارڈ کیا، اور 1984ء میں نقابتِ قراء کے قیام سے اس کے نائب سربراہ رہے۔"
