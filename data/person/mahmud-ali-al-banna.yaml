summary:
  ar: "\u0642\u0627\u0631\u0626 \u0642\u0631\u0622\u0646 \u0645\u0635\u0631\u064a (1926\u20131985) \u062f\u062e\u0644 \u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0645\u0635\u0631\u064a\u0629 \u0641\u064a 1948\u060c \u0648\u0642\u0631\u0623 \u0641\u064a \u0645\u0633\u062c\u062f \u0627\u0644\u0633\u064a\u062f \u0627\u0644\u0628\u062f\u0648\u064a \u0628\u0637\u0646\u0637\u0627 (1959\u20131980) \u062b\u0645 \u0641\u064a \u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0633\u064a\u0646 \u0628\u0627\u0644\u0642\u0627\u0647\u0631\u0629\u060c \u0648\u0633\u062c\u0651\u0644 \u0627\u0644\u0645\u0635\u062d\u0641 \u0645\u0631\u062a\u0644\u064b\u0627 \u0648\u0645\u062c\u0648\u062f\u064b\u0627\u060c \u0648\u0643\u0627\u0646 \u0646\u0627\u0626\u0628 \u0646\u0642\u064a\u0628 \u0627\u0644\u0642\u0631\u0627\u0621 \u0645\u0646\u0630 \u062a\u0623\u0633\u064a\u0633 \u0627\u0644\u0646\u0642\u0627\u0628\u0629 \u0641\u064a 1984."
  en: "Egyptian Qur'an reciter (1926\u20131985) who joined Egyptian Radio in 1948, recited at the Ahmad al-Badawi Mosque in Tanta (1959\u20131980) and then at al-Hussein Mosque in Cairo, recorded the Qur'an in murattal and mujawwad styles, and was deputy head of the reciters' syndicate from its founding in 1984."
  ur: "\u0645\u0635\u0631\u06cc \u0642\u0627\u0631\u06cc\u0650 \u0642\u0631\u0622\u0646 (1926\u0621\u20131985\u0621)\u060c \u062c\u0648 1948\u0621 \u0645\u06cc\u06ba \u0645\u0635\u0631\u06cc \u0631\u06cc\u0688\u06cc\u0648 \u0633\u06d2 \u0648\u0627\u0628\u0633\u062a\u06c1 \u06c1\u0648\u0626\u06d2\u060c \u0637\u0646\u0637\u0627 \u06a9\u06cc \u0645\u0633\u062c\u062f \u0627\u062d\u0645\u062f \u0627\u0644\u0628\u062f\u0648\u06cc (1959\u0621\u20131980\u0621) \u0627\u0648\u0631 \u067e\u06be\u0631 \u0642\u0627\u06c1\u0631\u06c1 \u06a9\u06cc \u0645\u0633\u062c\u062f \u062d\u0633\u06cc\u0646 \u0645\u06cc\u06ba \u0642\u0627\u0631\u06cc \u0631\u06c1\u06d2\u060c \u0645\u0631\u062a\u0644 \u0627\u0648\u0631 \u0645\u062c\u0648\u062f \u062f\u0648\u0646\u0648\u06ba \u0627\u0646\u062f\u0627\u0632 \u0645\u06cc\u06ba \u0642\u0631\u0622\u0646 \u0631\u06cc\u06a9\u0627\u0631\u0688 \u06a9\u06cc\u0627\u060c \u0627\u0648\u0631 1984\u0621 \u0645\u06cc\u06ba \u0646\u0642\u0627\u0628\u062a\u0650 \u0642\u0631\u0627\u0621 \u06a9\u06d2 \u0642\u06cc\u0627\u0645 \u0633\u06d2 \u0627\u0633 \u06a9\u06d2 \u0646\u0627\u0626\u0628 \u0633\u0631\u0628\u0631\u0627\u06c1 \u0631\u06c1\u06d2\u06d4"
