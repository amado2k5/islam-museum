summary:
  ar: "مفسر وعالم إندونيسي، وُلد سنة 1944، وزير الشؤون الدينية الأسبق في إندونيسيا. تلقى تعليمه بالأزهر، وألّف تفسير «المصباح» في خمسة عشر مجلدًا، ومن كتبه «تنزيل القرآن على أرض الواقع» و«بصائر القرآن»."
  en: "Indonesian exegete and scholar, born in 1944, former minister of religious affairs. Al-Azhar-trained, he authored the fifteen-volume Tafsir al-Mishbah, with works including Membumikan al-Qur’an and Wawasan al-Qur’an."
  ur: "انڈونیشی مفسر اور عالم، 1944 میں پیدا ہوئے اور سابق وزیرِ مذہبی امور۔ ازہر سے تعلیم یافتہ، انہوں نے پندرہ جلدوں پر مشتمل «تفسیر المصباح» لکھی؛ کتب میں «Membumikan al-Qur’an» اور «Wawasan al-Qur’an» شامل ہیں۔"
  es: "Exégeta y erudito indonesio, nacido en 1944, exministro de Asuntos Religiosos. Formado en Al-Azhar, es autor del Tafsir al-Mishbah, una obra de quince volúmenes, entre las que se incluyen Membumikan al-Qur'an y Wawasan al-Qur'an."
