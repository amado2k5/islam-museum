summary:
  ar: "ناصر الدين محمود شاه الشرقي (ت. 1457)، رابع سلاطين جونبور في شمال الهند وخليفة أبيه إبراهيم شاه الشرقي سنة 1440. وسّع ملكه بالحملات على البنغال ومالوة وأوريسا وكالبي، وحاصر دلهي سنة 1452 أثناء حربه مع بهلول لودي، ومات سنة 1457 أثناء حملة شمس آباد فخلفه ابنه محمد شاه. تذكر المصادر بنائه المساجد وترميمه جامع أتالا في جونبور."
  en: "Nasir-ud-Din Mahmud Shah Sharqi (d. 1457), fourth sultan of Jaunpur in northern India, who succeeded his father Ibrahim Shah Sharqi in 1440. He extended his kingdom by campaigns against Bengal, Malwa, Orissa and Kalpi, besieged Delhi in 1452 in his war with Bahlul Lodi, and died in 1457 during the Shamsabad campaign, when his son Muhammad Shah succeeded him. The sources also record his mosque building and his restoration of the Atala Mosque at Jaunpur."
  ur: "ناصر الدین محمود شاہ شرقی (وفات 1457ء)، شمالی ہندوستان کی جونپور سلطنت کے چوتھے سلطان، جو 1440ء میں اپنے والد ابراہیم شاہ شرقی کے جانشین بنے۔ انھوں نے بنگال، مالوہ، اڑیسہ اور کالپی کی مہمات سے اپنی مملکت وسیع کی، 1452ء میں بہلول لودی سے جنگ میں دہلی کا محاصرہ کیا، اور 1457ء میں شمس آباد مہم کے دوران وفات پائی؛ ان کے بیٹے محمد شاہ جانشین بنے۔ منابع میں ان کی مساجد کی تعمیر اور جونپور کی اٹالا مسجد کی مرمت مذکور ہے۔"

