died: { edtf: "1244~", hijri: "0642~", calendar: julian, precision: year, status: debated, derived: true, note: "حبس بالمقدمية في ذي القعدة 641 ثم أخرج إلى مغارة بنواحي البقاع فانقطع خبره؛ قيل خنق وقيل ألقى من شاهق، وقال ابن قاضي شهبة رفسه داود سياف النقمة من رأس القلعة فتقطع قبل أن يصل الماء {cite:shadharat-dhahab p. 223}." }
summary:
  ar: "قاضي القضاة بدمشق؛ كان فقيهاً بارعاً مناظراً عارفاً بعلم الكلام والفلسفة وعلوم الأوائل، وشرح الإشارات لابن سينا شرحاً جيداً؛ ولي قضاء بعلبك ثم نقل إلى قضاء دمشق، فسار سيرة فاسدة من إثبات المحاضر الفاسدة والدعاوى الباطلة وإقامة شهود الزور وأكل الرشا وأموال الأيتام والأوقاف واستعمال المسكرات وحضور صلاة الجمعة وهو سكران؛ فقبض على أعوانه وعذبوا ومات كبيرهم ابن الرواس في العقوبة، وأخرج هو إلى مغارة في جبل لبنان فقيل خنق وقيل ألقى من شاهق {cite:shadharat-dhahab p. 222-223}."
  en: "The Shafi'i qadi al-qudat of Damascus (d. 642) — a capable jurist and mutakallim who commented Ibn Sina's Isharat, then turned Damascus's bench into a racket of forged deeds, false witnesses, bribes and devoured waqf property; arrested in Dhu al-Qa'da 641 and thrown off a Lebanese crag, cut to pieces before he reached the water {cite:shadharat-dhahab p. 222-223}."
  fr: "Le Shafi'i qadi al-qudat de Damas (mort en 642) - un juriste et mutakallim capable qui a commenté l'Isharat d'Ibn Sina, a ensuite transformé le banc de Damas en un racket d'actes falsifiés, de faux témoins, de pots-de-vin et de biens du waqf dévorés ; arrêté à Dhu al-Qaïda 641 et jeté hors d'un rocher libanais, coupé en morceaux avant qu'il n'atteigne l'eau {cite:shadharat-dhahab p. 222-223}."
  es: "El cadí shafi'í al-qudat de Damasco (m. 642), un jurista y mutakallim capaz que comentó el Isharat de Ibn Sina, luego convirtió el tribunal de Damasco en una red de falsificación de escrituras, falsos testigos, sobornos y devoró propiedades waqf; fue arrestado en Dhu al-Qa'da 641 y arrojado desde un risco libanés, siendo descuartizado antes de llegar al agua {cite:shadharat-dhahab p. 222-223}."
  ur: "دمشق کے شافعی قاضی القدات ⁦(متوفی 642)⁩ - ایک قابل فقیہ اور متکلم جس نے ابن سینا کی اشارات پر تبصرہ کیا، پھر دمشق کے بنچ کو جعلی کاموں، جھوٹے گواہوں، رشوت اور وقف املاک کو ہڑپ کر کے رکھ دیا۔ ذوالقعدہ 641 میں گرفتار کیا گیا اور ایک لبنانی کرگ کو پھینک دیا گیا، پانی تک پہنچنے سے پہلے اس کے ٹکڑے ٹکڑے کر دیئے گئے۔ 222-223}۔"
  tr: "Şam Baş Yargıcı, teoloji, felsefe ve erken bilimlerde bilgili yetenekli bir hukukçu ve tartışmacıydı. İbn Sina'nın El-Isarat'ını iyi açıkladı; Baalbek'in hakimi olarak görev yaptı ve Şam yargısına atandı. Yolsuz raporları, sahte davalar, sahte tanıkları, rüşvet alma, yetim parası ve vakıflarını kullanma, sarhoşken Cuma namazına katılma gibi yozlaşmış bir sicile sahipti; yardımcıları tutuklandı, işkence gördü ve liderleri İbn el-Rawas cezalandırılarak öldü. Lübnan Dağı'ndaki bir mağaraya götürüldü, burada boğulduğu söylenir ve bazıları yüksek bir yerden atıldığını söyler {atıf:shadharat-dhahab, s. 222-223}."
  id: "Ketua Hakim di Damaskus adalah seorang ahli hukum dan debat, berpengetahuan dalam teologi, filsafat, dan ilmu pengetahuan awal. Ia menjelaskan Al-Isharat karya Ibn Sina dengan baik; ia menjabat sebagai hakim Baalbek dan dipindahkan ke peradilan Damaskus. Ia memiliki catatan korup dalam membuktikan laporan korup, gugatan palsu, saksi palsu, mengonsumsi suap, uang dan dana anak yatim, menggunakan obat pemabuk, serta menghadiri salat Jumat dalam keadaan mabuk; para pembantunya ditangkap, disiksa, dan pemimpin mereka, Ibn al-Rawas, meninggal dalam hukuman. Ia dibawa ke sebuah gua di Gunung Lebanon, di mana dikatakan ia dicekik, dan beberapa mengatakan ia dilempar dari tempat tinggi {cite:shadharat-dhahab, hlm. 222-223}."
