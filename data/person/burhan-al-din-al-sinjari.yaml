  ar: "قاضي القضاة؛ ولي قضاء مصر وحدها مدة في دولة الصالح ثم آذاه الوزير بهاء الدين ونكبه، فلما مات ولي الوزارة للملك السعيد وبقي مدة ثم عزل وضربه الشجاعي، ثم ولي الوزارة ثانياً ثم عُزل وأوذي، ثم ولي قضاء القضاة بالإقليم فتوفي بعد عشرين يوماً فيقال إنه سمّ؛ وولي بعده تقي الدين بن بنت الأعز {cite:shadharat-dhahab p. 690}."
  en: "Qadi al-qudat of Egypt — al-Sa'id's vizier twice, struck by al-Shuja'i, finally qadi again and dead within twenty days, 'it is said, poisoned'; Ibn Bint al-A'azz succeeded him {cite:shadharat-dhahab p. 690}."
