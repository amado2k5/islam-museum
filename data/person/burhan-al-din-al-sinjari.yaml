died: { edtf: "1287-03~", hijri: "0686-02", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في صفر فيقال إنه سمّ {cite:shadharat-dhahab p. 690}." }
summary:
  ar: "قاضي القضاة؛ ولي قضاء مصر وحدها مدة في دولة الصالح ثم آذاه الوزير بهاء الدين ونكبه، فلما مات ولي الوزارة للملك السعيد وبقي مدة ثم عزل وضربه الشجاعي، ثم ولي الوزارة ثانياً ثم عُزل وأوذي، ثم ولي قضاء القضاة بالإقليم فتوفي بعد عشرين يوماً فيقال إنه سمّ؛ وولي بعده تقي الدين بن بنت الأعز {cite:shadharat-dhahab p. 690}."
  en: "Qadi al-qudat of Egypt — al-Sa'id's vizier twice, struck by al-Shuja'i, finally qadi again and dead within twenty days, 'it is said, poisoned'; Ibn Bint al-A'azz succeeded him {cite:shadharat-dhahab p. 690}."
  es: "Qadi al-qudat de Egipto — visir de al-Sa'id en dos ocasiones, golpeado por al-Shuja'i, finalmente cadí de nuevo y muerto a los veinte días, 'se dice que envenenado'; Ibn Bint al-A'azz le sucedió {cita: shadharat-dhahab p. 690}."
  fr: "Le cadi al-qudat d'Égypte — vizir d'al-Sa'id à deux reprises, frappé par al-Shuja'i, finalement cadi à nouveau et mort en vingt jours, « dit-on, empoisonné »; Ibn Bint al-A'azz lui succède {cite: shadharat-dhahab p. 690}."
  ur: "مصر کا قادی القدات - السعید کے وزیر کو دو بار الشجاعی نے مارا، آخر میں قاضی دوبارہ اور بیس دنوں کے اندر مر گیا، 'کہا جاتا ہے، زہر'؛ ابن بنت العزاس ان کے بعد تخت نشین ہوا 690}۔"
  tr: "Baş Yargıç; El-Salih devleti sırasında bir süre Mısır'ın tek başına yargıcı olarak görev yaptı, ardından vezir Baha'ddin tarafından zarar gördü ve acı çekti. Öldüğünde Kral El-Said için bakan olarak görev yaptı ve bir süre kaldı, ardından el-Şucai tarafından görevden alındı ve dövüldü. Sonra tekrar bakanlığı devraldı, görevden alındı ve zarar gördü, ardından bölgede yargıç olarak atandı, yirmi gün sonra öldü ve zehirlendiği söylenir. Onun ardından Taqi al-Din bin bint al-A'zz (kaynak:şadharat-dhahab, s. 690} görevi devraldı."
  id: "Hakim Ketua; ia menjabat sebagai hakim Mesir sendirian selama masa pemerintahan Al-Salih, kemudian disakiti dan diserang oleh wazir Baha' al-Din. Ketika ia meninggal, ia menjabat sebagai menteri Raja Al-Saeed dan tinggal untuk sementara waktu, kemudian diberhentikan dan dipukuli oleh al-Shuja'i. Ia kemudian kembali mengambil alih kementerian, diberhentikan dan disakiti, kemudian diangkat menjadi hakim di wilayah tersebut, di mana ia meninggal setelah dua puluh hari, dan dikatakan ia diracun. Setelah itu, Taqi al-Din ibn bint al-A'zz {cite:shadharat-dhahab, hlm. 690} mengambil alih."
