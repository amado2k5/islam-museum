summary:
  ar: "طبيبة تونسية (1909–2010)، أول تونسية تحصل على البكالوريا سنة 1928 وأول طبيبة في تونس والمغرب العربي؛ تخرجت في كلية الطب بباريس سنة 1936 وافتتحت عيادة بالعاصمة، فرأست قسم الولادة بمستشفى شارل نيكول ثم بمستشفى عزيزة عثمانة، وأسست خدمة التنظيم العائلي سنة 1963 وأدارت الديوان الوطني للأسرة والعمران البشري سنة 1970، ونشطت في الاتحاد النسائي الإسلامي التونسي وأسست جمعيات للإسعاف الاجتماعي ورعاية الأيتام والأمهات؛ كرّمها البنك المركزي التونسي سنة 2020 بوضع صورتها على ورقة العشرة دنانير."
  en: "Tunisian physician (1909–2010), the first Tunisian girl to take the baccalauréat, in 1928, and the first woman physician of Tunisia and the Maghreb. She graduated from the Paris faculty of medicine in 1936 and opened a practice in Tunis, headed the maternity services of the Charles-Nicolle and Aziza Othmana hospitals, founded the family-planning service in 1963 and directed the national family and population office in 1970; she was active in the Muslim Union of Tunisian Women and founded societies for social aid, orphans and mothers. In 2020 the Central Bank of Tunisia put her portrait on the ten-dinar banknote."
  ur: "تونسی طبیبہ (1909–2010)، 1928ء میں بکلوریا حاصل کرنے والی پہلی تونسی لڑکی اور تونس و مغرب کی پہلی خاتون طبیب۔ انہوں نے 1936ء میں پیرس کی طب کی فیکلٹی سے گریجویشن کی اور تونس میں مطب کھولا، شارل نیکول اور عزیزہ عثمانہ اسپتالوں کے زچگی شعبوں کی سربراہی کی، 1963ء میں خاندانی منصوبہ بندی کی خدمت قائم کی اور 1970ء میں قومی ادارہ برائے خاندان و آبادی کی ڈائریکٹر بنیں؛ الاتحاد النسائي الإسلامي التونسي میں فعال رہیں اور سماجی امداد، یتیموں اور ماؤں کے لیے انجمنیں قائم کیں۔ 2020ء میں تونس کے مرکزی بینک نے دس دینار کے نوٹ پر ان کی تصویر جاری کی۔"
