    basis: documented
    note: "Two independent texts attest his personal standing in the Jahriyya (the Gaozan school, a Naqshbandi menhuan). The Chinese article, an independent tradition drawing on Wang Jianping's study and family accounts, states that he was a great-grandson of Ma Mingxin's eldest son, that he studied under the Jahriyya leader Ma Yuanzhang — himself a descendant of Ma Mingxin — who advanced his education, that he was dispatched to Xinjiang expressly to strengthen the Gaozan (Jahriyya) menhuan, Ma Yuanzhang instructing him to serve as an official and also to assist the menhuan, that he built its gongbei shrines for Ma Mingxin's wife and daughters and funded others, that he raised more than a thousand young Jahriyya adherents for the 1924 assault on Kashgar, and that his opposition to Communism flowed from his own religious stance. The English article, citing Garnaut, independently records his kinship to the Jahriyya leader Ma Yuanzhang and prints the couplet Ma Yuanzhang wrote honouring Ma Shaowu's own journey to pay respects at the tomb of the founding ancestor's wife, naming him a worthy descendant of the line — his personal veneration, recognised by the order's leader. The Chinese infobox's religion field ('Islam, Sufism (Gaozan school)') belongs to the Chinese family already counted, and the English categories ('Chinese Sufis', 'Naqshbandi order') are filings and are not counted. Two independent texts attesting personal adherence and practice: sufi, documented. No text names a legal school for him, so no second segment is recorded."
    sources: [source/wikipedia-ma-shaowu-en, source/wikipedia-ma-shaowu-zh, source/wikidata-ma-shaowu]
