summary:
  ar: "قائد عسكري مسلم من الهوي (1874–1937) من يونان، من نسل ما مينغشين مؤسس الجهرية وتلميذ زعيمها ما يوانتشانغ، أُرسل إلى سنجان لتقوية المنحوان الجهرية فبنى أضرحتها وحكم جنوب سنجان، وقتل ما فوشينغ بأمر يانغ زنغشين سنة 1924 وخلفه داوتايًا على كاشغر، ونجا من محاولة اغتيال سنة 1934، ثم قتله شنغ شيتساي في تطهيره سنة 1937."
  en: "A Hui Muslim military commander (1874–1937) from Yunnan, a descendant of Ma Mingxin, founder of the Jahriyya, and a student of its leader Ma Yuanzhang, who was sent to Xinjiang to strengthen the Jahriyya menhuan, built its shrines, and governed the south of the province. In 1924 he shot Ma Fuxing on Yang Zengxin's orders and succeeded him as Daotai of Kashgar; he survived an assassination attempt in 1934 and was killed in Sheng Shicai's purge of 1937."
  ur: "یوننان سے تعلق رکھنے والے ایک ہوئی مسلمان فوجی کمانڈر (1874ء–1937ء) جو جہریہ کے بانی ما منگ شن کی نسل سے اور اس کے رہنما ما یوان ژانگ کے شاگرد تھے؛ انہیں جہریہ منحوان کو مضبوط کرنے کے لیے سنکیانگ بھیجا گیا، انہوں نے اس کے مزارات تعمیر کیے اور صوبے کے جنوب پر حکومت کی۔ 1924ء میں انہوں نے یانگ زینگ شن کے حکم پر ما فو شنگ کو گولی ماری اور کاشغر کے داؤتائی کے طور پر ان کے جانشین بنے؛ 1934ء میں قاتلانہ حملے سے بچ گئے اور 1937ء میں شینگ شی سائی کی صفائی میں مارے گئے۔"
