summary:
  ar: "جمال الدين أبو الحسن علي بن يوسف الشيباني القفطي ⁦(٥٦٨–٦٤٦هـ)⁩؛ القاضي الأكرم، صاحب ديوان المال ثم وزير حلب، ومؤرخ العلماء والحكماء صاحب إنباه الرواة وتاريخ الحكماء؛ جمع مكتبة لا نظير لها وأوصى بها للناصر صاحب حلب {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}."
  en: "Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti (568–646/1172–1248) — al-Qadi al-Akram, head of Aleppo's diwan of finances and then its vizier, historian of scholars and philosophers (Inbah al-Ruwat, Tarikh al-Hukama), owner of a matchless library he bequeathed to the ruler of Aleppo {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}."
  fr: "Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti (568-646/1172-1248) – al-Qadi al-Akram, chef du diwan des finances d'Alep puis de son vizir, historien des savants et des philosophes (Inbah al-Ruwat, Tarikh al-Hukama), propriétaire d'une bibliothèque incomparable qu'il a léguée au dirigeant d'Alep {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}."
  ur: "جمال الدین علی بن یوسف شیبانی قفطی ⁦(568–646ھ/1172–1248ء)⁩ — قاضی اکرم، حلب کے دیوان مال کے سربراہ پھر وزیر، علماء و حکما کے مورخ ⁦(انباہ الرواۃ، تاریخ الحکماء)⁩ اور بے مثال کتب خانے کے مالک جو انہوں نے صاحب حلب کو وصیت کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}۔"
  es: "Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti (568–646/1172–1248) — al-Qadi al-Akram, jefe del diwan de finanzas de Alepo y luego visir, historiador de eruditos y filósofos (Inbah al-Ruwat, Tarikh al-Hukama), propietario de una biblioteca incomparable que legó al gobernante de Alepo {citar: enciclopedia-del-islam-2 vol. 3 p. 872} {citar: historia-del-islam-dhahabi págs. 325-326}."
  tr: "Cemaleddin Ebu el-Hasan Ali bin Yusuf el-Şeybani el-Kıfti (568–646 H) idi; soylu yargıç, Diwan el-Mal'ın sahibi ve ardından Halep'in veziri, alimler ve bilgeler tarihçisi, İnbah el-Ruwat ve Tarih el-Hukama'nın yazarı; eşsiz bir kütüphane derledi ve bunu Halep hükümdarı el-Nasir'e bağışladı {atıf:Encyclopaedia-of-Islam-2 cilt 3, s. 872} {atıf:Tarikh-Islam-dhahabi, s. 325-326}."
  id: "Jamal al-Din Abu al-Hasan Ali ibn Yusuf al-Shaybani al-Qifti (568–646 H); hakim bangsawan, pemilik Diwan al-Mal dan kemudian wazir Aleppo, sejarawan para ulama dan resi serta penulis Inbah al-Ruwat wa Tarikh al-Hukama; menyusun perpustakaan yang tiada banding dan mewariskannya kepada al-Nasir, penguasa Aleppo {cite:Encyclopaedia-of-Islam-2 vol. 3, hlm. 872} {cite:Tarikh-Islam-dhahabi, hlm. 325-326}."
