names:
  - { value: "جمال الدين أبو الحسن علي بن يوسف بن إبراهيم بن عبد الواحد الشيباني القفطي", kind: full }
summary:
  ar: "جمال الدين أبو الحسن علي بن يوسف الشيباني القفطي ⁦(٥٦٨–٦٤٦هـ)⁩؛ القاضي الأكرم، صاحب ديوان المال ثم وزير حلب، ومؤرخ العلماء والحكماء صاحب إنباه الرواة وتاريخ الحكماء؛ جمع مكتبة لا نظير لها وأوصى بها للناصر صاحب حلب {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}."
  en: "Jamal al-Din Ali ibn Yusuf al-Shaybani al-Qifti (568–646/1172–1248) — al-Qadi al-Akram, head of Aleppo's diwan of finances and then its vizier, historian of scholars and philosophers (Inbah al-Ruwat, Tarikh al-Hukama), owner of a matchless library he bequeathed to the ruler of Aleppo {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}."
  ur: "جمال الدین علی بن یوسف شیبانی قفطی ⁦(568–646ھ/1172–1248ء)⁩ — قاضی اکرم، حلب کے دیوان مال کے سربراہ پھر وزیر، علماء و حکما کے مورخ ⁦(انباہ الرواۃ، تاریخ الحکماء)⁩ اور بے مثال کتب خانے کے مالک جو انہوں نے صاحب حلب کو وصیت کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 872} {cite:tarikh-islam-dhahabi pp. 325-326}۔"
