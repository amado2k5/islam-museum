summary:
  ar: "باحث ومناظر مسلم بحريني يدير قناة «فريد يرد» (Farid Responds) على يوتيوب، المتخصصة في الرد على الاعتراضات الموجهة إلى الإسلام وإلى الحديث النبوي. شارك في تأسيس موقعي TwelverShia.net وSunni Discourse، وحرّر موقع Nahjul-Balagha.net، وله كتب منشورة منها «استشهاد الحسين في ضوء الروايات الصحيحة» و«لماذا اعتنق الصحابة الإسلام»."
  en: "A Bahraini Muslim researcher and debater who runs the Farid Responds YouTube channel, which answers objections raised against Islam and against the hadith literature. He co-founded the websites TwelverShia.net and Sunni Discourse and created Nahjul-Balagha.net, and is the author of published books including The Martyrdom of al-Husayn in Light of the Authentic Traditions and Why the Companions Converted to Islam."
  ur: "بحرینی مسلمان محقق و مناظر، جو یوٹیوب چینل Farid Responds چلاتے ہیں؛ اس کا کام اسلام اور حدیث پر کیے گئے اعتراضات کے جوابات پر مرکوز ہے۔ وہ ویب سائٹس TwelverShia.net اور Sunni Discourse کے شریک بانی اور Nahjul-Balagha.net کے خالق ہیں، اور ان کی شائع شدہ کتابوں میں «The Martyrdom of al-Husayn in Light of the Authentic Traditions» اور «Why the Companions Converted to Islam» شامل ہیں۔"
