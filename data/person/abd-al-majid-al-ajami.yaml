summary:
  ar: "أبو القاسم عبد المجيد بن العجمي الحلبي صديق ابن الأثير، هو وأهل بيته مقدمون السنة بحلب، رجل ذو مروءة غزيرة وخلق حسن؛ توفي في الثاني عشر من ربيع الأول سنة ثمان وعشرين وستمائة {cite:kamil-ibn-al-athir p. 439}."
  en: "Ibn al-Athir's Aleppine friend — he and his house 'foremost of the Sunnis at Aleppo', a man of abundant chivalry — died 12 Rabi' I 628 {cite:kamil-ibn-al-athir p. 439}."
  fr: "L'ami alépin d'Ibn al-Athir — lui et sa maison étaient « les premiers des sunnites d'Alep », homme d'une grande noblesse de cœur — mort le 12 rabi' Ier 628 {cite:kamil-ibn-al-athir p. 439}."
  es: "El amigo alepino de Ibn al-Athir —él y su casa eran «los más destacados de los sunitas en Alepo», un hombre de gran caballerosidad— murió el 12 de Rabi' I de 628 {cite:kamil-ibn-al-athir p. 439}."
  ur: "ابن اثیر کے حلب کے دوست - وہ اور اس کا گھر 'حلب میں سنیوں میں سب سے آگے'، بہت زیادہ بہادری کا آدمی - 12 ربیع الثانی 628 کو فوت ہوا۔ 439}۔"
