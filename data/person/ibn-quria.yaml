summary:
  ar: "القاضي أبو بكر محمد بن عبد الرحمن المعروف بابن قريعة البغدادي؛ كان مختصاً بحضرة الوزير أبي محمد المهلبي منقطعاً إليه؛ اشتهر بسرعة الجواب وظرف الأجوبة في ألفصم لفظ وأملح سجع؛ وله مسائل وأجوبة مدونة في كتاب مشهور بأيدي الناس، كان رؤساء عصره وفضلاؤه يداعبونه ويكتبون إليه المسائل الغريبة المضحكة فيكتب الجواب مطابقاً للسؤال من غير توقف؛ تعجب منه الصاحب بن عباد لما حضر مجلس الوزير المهلبي {cite:wafayat-ayan}."
  en: "Qadi Abu Bakr Ibn Quri'a of Baghdad (d. 367) — the wit-jurist attached to the vizier al-Muhallabi; famous for instant, elegant answers to trick questions, collected in a celebrated book of comic responsa; admired by al-Sahib Ibn Abbad {cite:wafayat-ayan}."
  es: "Qadi Abu Bakr Ibn Quri'a de Bagdad (m. 367) — el ingenioso jurista adjunto al visir al-Muhallabi; famoso por sus respuestas instantáneas y elegantes a preguntas capciosas, recopiladas en un célebre libro de responsa cómicas; admirado por al-Sahib Ibn Abbad {cite:wafayat-ayan}."
  fr: "Le cadi Abu Bakr Ibn Quri'a de Bagdad (mort en 367) — le juriste spirituel attaché au vizir al-Muhallabi; célèbre pour ses réponses instantanées et élégantes aux questions pièges, rassemblées dans un célèbre livre de responsa comiques; admiré par al-Sahib Ibn Abbad {cite:wafayat-ayan}."
  ur: "بغداد کے قاضی ابو بکر ابن قریظہ ⁦(متوفی 367)⁩ - وزیر المحلبی سے منسلک عقل فقیہ؛ مزاحیہ جوابات کی ایک مشہور کتاب میں جمع کردہ، چال سوالات کے فوری، خوبصورت جوابات کے لیے مشہور؛ جس کی تعریف الصاحب ابن عباد نے کی ہے۔"
  tr: "Hakim Ebu Bekir Muhammed bin Abdülrahman, İbn Kuray'ah el-Bağdadi olarak bilinir, bakan Ebu Muhammed el-Muhallabi'nin huzuruna bağlı bir uzmandı ve ona bağlıydı; hızlı cevapları, etkileyici sözlerle ve tuzlu kafiyelerle sunduğu esprili cevaplarla tanınırdı. Sorunları ve cevapları halk arasında iyi bilinen bir kitapta kaydedildi. Zamanının liderleri ve alimleri onu alay eder, garip ve komik sorular yazardı, o da soruya kesintisiz cevaplar yazardı. Sahib bin Abbad, Bakan el-Muhallabi konseyine katıldığında ona hayran kaldı {kaynak:vafayat-ayan}."
  id: "Hakim Abu Bakr Muhammad ibn Abd al-Rahman, yang dikenal sebagai Ibn Quray'ah al-Baghdadi, adalah seorang ahli yang setia terhadap kehadiran menteri Abu Muhammad al-Muhallabi dan sangat setia kepadanya; ia dikenal karena jawaban cepat dan kecerdasan dalam menjawab dengan kata-kata yang fasih dan rima yang asin. Ia memiliki masalah dan jawaban yang tercatat dalam sebuah buku yang terkenal di kalangan masyarakat. Para pemimpin dan ulama pada zamannya sering mengejeknya dan menulis pertanyaan aneh dan lucu, dan ia menulis jawaban tepat tanpa jeda. Sahib ibn Abbad sangat terpesona olehnya ketika ia menghadiri rapat Menteri al-Muhallabi {cite:wafayat-ayan}."
