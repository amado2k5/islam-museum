  es: "Qadi Abu Bakr Ibn Quri'a de Bagdad (m. 367) — el ingenioso jurista adjunto al visir al-Muhallabi; famoso por sus respuestas instantáneas y elegantes a preguntas capciosas, recopiladas en un célebre libro de responsa cómicas; admirado por al-Sahib Ibn Abbad {cite:wafayat-ayan}."
