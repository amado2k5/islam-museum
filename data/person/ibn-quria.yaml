  ar: "القاضي أبو بكر محمد بن عبد الرحمن المعروف بابن قريعة البغدادي؛ كان مختصاً بحضرة الوزير أبي محمد المهلبي منقطعاً إليه؛ اشتهر بسرعة الجواب وظرف الأجوبة في ألفصم لفظ وأملح سجع؛ وله مسائل وأجوبة مدونة في كتاب مشهور بأيدي الناس، كان رؤساء عصره وفضلاؤه يداعبونه ويكتبون إليه المسائل الغريبة المضحكة فيكتب الجواب مطابقاً للسؤال من غير توقف؛ تعجب منه الصاحب بن عباد لما حضر مجلس الوزير المهلبي {cite:wafayat-ayan}."
  en: "Qadi Abu Bakr Ibn Quri'a of Baghdad (d. 367) — the wit-jurist attached to the vizier al-Muhallabi; famous for instant, elegant answers to trick questions, collected in a celebrated book of comic responsa; admired by al-Sahib Ibn Abbad {cite:wafayat-ayan}."
