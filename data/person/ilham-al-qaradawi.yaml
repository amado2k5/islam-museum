  es: "Física nuclear egipcio-qatarí, nacida en 1959, profesora de la Universidad de Qatar. Fundó la primera instalación de haz de positrones de Qatar y realiza investigaciones en física nuclear y de radiación, así como en el monitoreo regional de la radiación."
