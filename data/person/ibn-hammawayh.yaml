summary:
  ar: "قاضي الشام؛ فقيه حنفي ثم تحنبل وكان مجتهداً في مذهب أهل السنة؛ وعين قاضياً بمذهبه فقيل له ألا تخرج فقيل جعفر شيخاً فقال ما هذا إلا تهكم فقلت إذا فألزموه فحكم في الشهور ثم عزل، وحدث بالكثير وكان شيخاً مهيباً وقوراً؛ توفي ثامن عشرين ربيع الآخر {cite:shadharat-dhahab p. 578}."
  en: "Qadi al-Sham (Hanafi→Hanbali, 'mujtahid within the Sunni school') — judged a few months then dismissed; a dignified, awe-inspiring transmitter {cite:shadharat-dhahab p. 578}."
  es: "Qadi al-Sham (Hanafi→Hanbali, 'mujtahid dentro de la escuela Sunni') — juzgado durante unos meses y luego destituido; un transmisor digno e imponente {cite:shadharat-dhahab p. 578}."
  fr: "Qadi al-Sham (Hanafi→Hanbali, « mujtahid au sein de l'école sunnite ») — jugé pendant quelques mois puis renvoyé; un transmetteur digne et impressionnant {cite:shadharat-dhahab p. 578}."
  ur: "قادی الشام ⁦(حنفی → حنبلی، 'سنی مکتب کے اندر مجتہد')⁩ - چند ماہ فیصلہ کیا پھر برطرف کر دیا گیا؛ ایک باوقار، خوف کو متاثر کرنے والا ٹرانسمیٹر 578}۔"
  tr: "Kadi el-Şam; önce Hanefi hukukçu, sonra Hanbal âlimi ve Sünni mezhebinde bir hukukçuydu; okuluna göre yargıç olarak atandı ve ayrılmaması söylendi. Ca'fer şeyh olarak anıldı ve dedi ki, 'Bu sadece alay bir şeydir.' Ben de, 'O zaman onu zorlayacaklar.' dedim. Aylarca hüküm sürdü ve sonra görevden alındı. Uzun konuştu ve onurlu ve saygın bir şeyhti. Rabi'el-Thani'nin yirmi sekizinde vefat etti {kaynak: şadharat-dhahab, s. 578}."
  id: "Qadi al-Sham; seorang ahli hukum Hanafi yang kemudian menjadi ulama Hanbal, dan dia adalah ahli hukum di aliran Sunni; dia diangkat sebagai hakim sesuai sekolahnya dan diperintahkan untuk tidak pergi. Ja'far dipanggil sebagai sheikh dan berkata, 'Ini hanyalah ejekan.' Saya berkata, 'Maka mereka akan memaksanya.' Dia memerintah selama berbulan-bulan lalu dipecat. Dia berbicara luas, dan dia adalah sheikh yang bermartabat dan bermartabat. Dia meninggal pada tanggal dua puluh delapan Rabi' al-Thani {cite:shadharat-dhahab, hlm. 578}."
