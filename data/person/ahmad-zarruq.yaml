summary:
  ar: "أحمد بن أحمد بن محمد بن عيسى البرنسي الفاسي، أبو العباس، زروق، فقيه محدث صوفي من أهل فاس، قرأ بمصر والمدينة وتوفي في تكرين من أعمال طرابلس الغرب؛ من 846هـ الموافقة 1442م إلى 899هـ الموافقة 1493م، وذكر بعض المترجمين وفاته سنة 896هـ."
  en: "Ahmad ibn Ahmad ibn Muhammad ibn Isa al-Burnusi al-Fasi, Abu al-Abbas, Zarruq, a jurist, hadith scholar and Sufi of Fes, who studied in Egypt and Medina and died at Takrin in the district of Tripoli; 846 AH, 1442 CE, to 899 AH, 1493 CE; some biographers give his death as 896 AH."
