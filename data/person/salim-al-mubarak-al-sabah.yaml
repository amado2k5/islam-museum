summary:
  ar: "سالم المبارك الصباح (وُلد سنة 1864 – توفي في مدينة الكويت في 23 فبراير 1921)، حاكم الكويت التاسع من أسرة آل صباح، والابن الثاني لمبارك الكبير، ومؤسس فرع آل سالم في الأسرة الحاكمة. كان واليًا على مدينة الكويت في 1915–1917 وقائدًا لفرسان الكويت ومشاتها، وخلف أخاه جابر الثاني في 5 فبراير 1917، فشهد عهده القصير بناء سور الكويت الثالث ومعركتي حمض والجهراء (1920) في مواجهة ضغط الإخوان والحدود، وخلفه ابن أخيه أحمد الجابر، ومن أبنائه عبد الله السالم وصباح السالم، أميرا الكويت الحادي عشر والثاني عشر لاحقًا."
  en: "Salim Al-Mubarak Al-Sabah (born in 1864 – died at Kuwait City on 23 February 1921) was the ninth ruler of Kuwait of the Al-Sabah family, the second son of Mubarak the Great and the progenitor of the family's Al-Salim branch. He was governor of Kuwait City in 1915–1917 and commander of Kuwait's cavalry and infantry, and he succeeded his brother Jaber II on 5 February 1917; his short reign saw the building of Kuwait's third wall and the battles of Hamdh and Jahra (1920) under Ikhwan and frontier pressure. He was succeeded by his nephew Ahmad Al-Jaber; among his sons were Abdullah Al-Salim and Sabah Al-Salim, later the eleventh and twelfth emirs of Kuwait."
  ur: "سالم المبارک الصباح (پیدائش: 1864ء – وفات: کویت، 23 فروری 1921ء)، کویت کے نویں حکمران اور مبارک الکبیر کے دوسرے بیٹے تھے۔ وہ 1915–1917ء میں کویت شہر کے والی رہے، 5 فروری 1917ء کو بھائی جابر ثانی کے بعد حکمران بنے، ان کے مختصر عہد میں کویت کی تیسری فصیل بنی اور حمض و جہرہ کی لڑائیاں ہوئیں، اور ان کے بیٹے عبد اللہ و صباح بعد میں کویت کے امیر بنے۔"
