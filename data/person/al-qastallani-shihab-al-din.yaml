summary:
  ar: "الحافظ شهاب الدين أحمد القسطلاني المصري الشافعي؛ مولده ثاني عشر ذي القعدة سنة إحدى وخمسين وثمانمائة بمصر، حفظ القرآن وتلا للسبع وحفظ الشاطبية والجزرية والوردية، وقرأ صحيح البخاري على السخاوي في خمسة مجالس وتلمذ له، وجاور بمكة وولي مشيخة مقام الشيخ أحمد الحرار بالقرافة الصغرى ووعظ بالجامع الغوري «ولم يكن له نظير في الوعظ». من تصانيفه شرح صحيح البخاري المسمى إرشاد الساري — مزجه في عشرة أسفار كبار، لعله أجمع شروحه وأحسنها — والمواهب اللدنية بالمنح المحمدية، وشرح الشاطبية بزيادات ابن الجزري، والأنوار المضية شرح البردة، والروض الزاهر في مناقب الشيخ عبد القادر، والعقود السنية في شرح المقدمة الجزرية، وتحفة السامع والقاري بختم صحيح البخاري. حكى عن السيوطي أنه اتهمه بالنقل من كتبه بلا نسبة، وقصده بنفسه حافياً مكشوف الرأس إلى باب داره بالروضة ليطيب خاطره فلم يفتح له الباب؛ وذكر الكواكب أن موته كان بعارض ألمّ به من تأثره ببلوغه قطع رأس إبراهيم بن عطاء الله المكي بحيث سقط عن دابته وأغمي عليه فحُمل إلى منزله ومات بعد أيام. توفي ليلة الجمعة سابع المحرم سنة ثلاث وعشرين وتسعمائة بالقاهرة {cite:shadharat-dhahab p. 520-521}."
  en: "The hafiz of Bukhari's greatest sharh — b. Cairo 12 Dhu'l-Qa'da 851, he read the Sahih on al-Sakhawi in five sessions, held the Harrar maqam mashyakha and preached at the Ghuri mosque 'without peer'. Works: Irshad al-Sari in ten large volumes ('perhaps the most complete and finest of Bukhari's commentaries'), al-Mawahib al-Ladunniyya, sharhs on the Shatibiyya and the Burda (al-Anwar al-Mudiyya), al-Rawd al-Zahir on 'Abd al-Qadir's manaqib. Al-Suyuti accused him of unattributed borrowing; Qastallani walked barefoot and bare-headed to Suyuti's Rawda door to soothe him — 'my heart is soothed,' said Suyuti, and never opened the door. News of Ibrahim b. 'Ata' Allah al-Makki's beheading struck him off his mount; he died days later, Thursday night 7 Muharram 923 {cite:shadharat-dhahab p. 520-521}."
  fr: "Le hafiz du plus grand sharh de Boukhari – né au Caire le 12 Dhu'l-Qa'da 851, il a lu le Sahih sur al-Sakhawi en cinq sessions, tenu le Harrar maqam mashiakha et prêché à la mosquée Ghuri \"sans pair\". Worksuvres : Irshad al-Sari en dix grands volumes ('peut-être le plus complet et le plus beau des commentaires de Bukhari'), al-Mawahib al-Ladunniyya, sharhs sur le Shatibiyya et le Burda (al-Anwar al-Mudiyya), al-Rawd al-Zahir sur 'Abd al-Qadir's manaqib. Al-Suyuti l'a accusé d'emprunter sans affectation ; Qastallani marchait pieds nus et tête nue jusqu'à la porte de Rawda de Suyuti pour l'apaiser - \"mon cœur est apaisé\", a déclaré Suyuti, et n'a jamais ouvert la porte. La nouvelle de la décapitation d'Ibrahim b. 'Ata' Allah al-Makki l'a frappé de sa montagne ; il est mort quelques jours plus tard, jeudi soir 7 Muharram 923 {cite:shadharat-dhahab p. 520-521}."
  es: "El hafiz del sharh más grande de Bukhari — n. Cairo 12 Dhu'l-Qa'da 851, leyó el Sahih sobre al-Sakhawi en cinco sesiones, dirigió el maqam mashyakha de Harrar y predicó en la mezquita de Ghuri «sin igual». Obras: Irshad al-Sari en diez grandes volúmenes («quizás el más completo y mejor de los comentarios de Bukhari»), al-Mawahib al-Ladunniyya, sharhs sobre el Shatibiyya y el Burda (al-Anwar al-Mudiyya), al-Rawd al-Zahir sobre el manaqib de 'Abd al-Qadir. Al-Suyuti lo acusó de plagio sin atribución; Qastallani caminó descalzo y con la cabeza descubierta hasta la puerta de Rawda de Suyuti para consolarlo — «mi corazón está en paz», dijo Suyuti, y nunca abrió la puerta. La noticia de la decapitación de Ibrahim b. 'Ata' Allah al-Makki lo dejó atónito; murió días después, la noche del jueves 7 de Muharram de 923 {cite:shadharat-dhahab p. 520-521}."
  ur: "بخاری کی سب سے بڑی شرح کا حافظ۔ قاہرہ 12 ذوالقعدہ 851، اس نے الصخاوی پر پانچ نشستوں میں صحیح پڑھی، حرر مقام مشائخ کا انعقاد کیا اور غوری مسجد میں 'پیر کے بغیر' تبلیغ کی۔ تصانیف: ارشاد الساری دس بڑی جلدوں میں ⁦('شاید بخاری کی سب سے مکمل اور بہترین تفسیر')⁩، المواہب الدنیا، شاطبیہ اور بردہ پر شارح ⁦(الانوار المدیہ)⁩، عبدالمناقب پر الرود الظاہر۔ السیوطی نے اس پر غیر منسوب قرض لینے کا الزام لگایا۔ قسطلانی ننگے پاؤں اور ننگے سر سیوطی کے راودا دروازے کی طرف اس کو تسلی دینے کے لیے چلا گیا - 'میرا دل سکون میں ہے،' سیوتی نے کہا، اور دروازہ کبھی نہیں کھولا۔ ابراہیم بن کی خبر عطاء اللہ مکی کا سر قلم کرنے سے وہ پہاڑ سے اتر گیا۔ چند دن بعد جمعرات کی رات 7 محرم 923 کو ان کا انتقال ہو گیا۔ 520-521}۔"
  tr: "El-Hafız Şihab al-Din Ahmed el-Qastalani el-Masri el-Şafii; 851 Hicri yılında Zhu Kı'de ayının on ikinci gününde Mısır'da doğdu, Kur'an'ı ezberledi, Yedi'yi okudu ve el-Şatibiye, el-Cezeriyye ve el-Varidiye'yi ezberledi. Sahih al-Bukhari'yi el-Sakhavi'den beş derste öğrendi ve onun yanında çalıştı. Mekke yakınlarında yaşadı ve el-Karafa el-Sügre'de Şeyh Ahmed el-Harrar'ın şeyhi olarak hizmet etti, el-Ghuri Camii'nde vaaz verdi, \"ve pişkinde eşi yoktu ulaşmak.\" Eserleri arasında, Sahih al-Bukhari üzerine yazdığı Irshad al-Sari adlı tefsiri yer alır — bunları on büyük eserde birleştirdi, belki de en kapsamlı ve en iyi tefhihi — ve \"Al-Mawahib al-Ladunniyya bi-Munah al-Muhammadiyya,\" \"Sharh al-Shatibiyyah with the Added of Ibn al-Jazari,\" \"Al-Enwar al-Mudiya al-Burda üzerine yorum\", \"Al-Rawd al-Zahir fi Manaqib al-Shayyat al-Muqaddimah al-Jazari,\" \"Tuhfat al-Sami'wa al-Qari with a Complete a Sahih al-Bukhari.\" Al-Suyuti, kendisini kitaplarından kaynak göstermeden kopyalamakla suçladığını ve kendisinin çıplak ayakla, başı açık şekilde Al-Rawdah'daki evinin kapısına gidip teselli ettiğini, ancak kapı açılmadığını anlattı. Al-Kawakib, ölümünün İbrahim ibn Ata-Allah el-Makki'nin başının kesilmesiyle yaşadığı bir kaza nedeniyle olduğunu, bu yüzden bineğinden düştüğünü ve bayıldığını, evine taşındığını ve birkaç gün sonra öldüğünü anlattı. 923 Hicri yılında, Muharrem ayının yedinci Cuma gecesi Kahire'de öldü {atıf: shadharat-dhahab, s. 520-521}."
  id: "Al-Hafiz Shihab al-Din Ahmad al-Qastalani al-Masri al-Shafi'i; lahir pada tanggal dua belas Dhu al-Qi'dah tahun 851 H di Mesir, ia menghafal Al-Qur'an, membaca Tujuh, dan menghafal al-Shatibiyyah, al-Jazariyyah, dan al-Waridiya. Ia mempelajari Sahih al-Bukhari di bawah bimbingan al-Sakhawi dalam lima sesi dan belajar di bawah bimbingan beliau. Ia tinggal di dekat Mekah dan menjabat sebagai sheikh Sheikh Ahmad al-Harrar di al-Qarafa al-Sughra serta berkhotbah di Masjid al-Ghuri, \"dan ia tak ada tandingannya dalam pkhat menjangkau.\" Di antara karya-karyanya adalah komentar atas Sahih al-Bukhari yang disebut Irshad al-Sari — yang ia gabungkan menjadi sepuluh karya utama, mungkin yang paling komprehensif dan terbaik dari komentarnya—dan \"Al-Mawahib al-Ladunniyya bi-Munah al-Muhammadiyya,\" \"Sharh al-Shatibiyyah dengan tambahan Ibn al-Jazari,\" \"Komentar Al-Anwar al-Mudiya tentang al-Burda,\" \"Al-Rawd al-Zahir fi Manaqib al-Shayyat al-Muqaddimah al-Jazari,\" \"Tuhfat al-Sami' wa al-Qari dengan Sahih al-Bukhari yang lengkap.\" Al-Suyuti menceritakan bahwa ia menuduh Bakui menyalin dari buku-bukunya tanpa keterangan, dan ia secara pribadi mendatangi Ibrahim tanpa alas kaki dan kepala terbuka ke pintu rumahnya di Al-Rawdah untuk menghiburnya, namun pintu itu tidak dibuka untuknya. Al-Kawakib menyebutkan bahwa kematiannya disebabkan oleh kecelakaan yang memengaruhinya akibat penggalan kepala Ibrahim ibn Ata Allah al-Makki, sehingga ia jatuh dari tunggangannya dan pingsan, dibawa pulang ke rumahnya, dan meninggal beberapa hari kemudian. Ia meninggal pada malam Jumat, tanggal tujuh Muharram, tahun 923 H di Kairo {cite:shadharat-dhahab, hlm. 520-521}."
