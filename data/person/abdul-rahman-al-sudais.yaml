summary:
  ar: "إمام وخطيب المسجد الحرام منذ 1984 ورئيس الشؤون الدينية بالمسجد الحرام والمسجد النبوي منذ 2023 (وقبلها الرئيس العام لشؤون الحرمين منذ 2012)، من أشهر قرّاء القرآن في العالم. حفظ القرآن في الثانية عشرة، ونال الدكتوراه في الشريعة من جامعة أم القرى 1995، واختير الشخصية الإسلامية لجائزة دبي الدولية للقرآن الكريم سنة 2005."
  en: "Imam and khatib of the Grand Mosque in Mecca since 1984 and, since 2023, president of religious affairs for the Grand Mosque and the Prophet's Mosque (before that president-general of the affairs of the Two Holy Mosques from 2012); among the world's best-known Qur'an reciters. He memorised the Qur'an by the age of twelve, took a doctorate in sharia at Umm al-Qura University in 1995, and was named the Dubai International Holy Quran Award's Islamic Personality of the Year in 2005."
  ur: "1984 سے مسجد حرام کے امام و خطیب اور 2023 سے مسجد حرام و مسجد نبوی کے دینی امور کے صدر (اس سے قبل 2012 سے امورِ حرمین کے صدرِ عام)؛ دنیا کے مشہور ترین قراء میں سے ہیں۔ بارہ سال کی عمر میں قرآن حفظ کیا، 1995 میں جامعہ ام القریٰ سے شریعت میں ڈاکٹریٹ حاصل کی، اور 2005 میں دبئی بین الاقوامی قرآن ایوارڈ کی اسلامی شخصیت قرار پائے۔"
