summary:
  ar: "إمام وخطيب المسجد الحرام منذ 1984 ورئيس الشؤون الدينية بالمسجد الحرام والمسجد النبوي منذ 2023 ⁦(وقبلها الرئيس العام لشؤون الحرمين منذ 2012)⁩، من أشهر قرّاء القرآن في العالم. حفظ القرآن في الثانية عشرة، ونال الدكتوراه في الشريعة من جامعة أم القرى 1995، واختير الشخصية الإسلامية لجائزة دبي الدولية للقرآن الكريم سنة 2005."
  en: "Imam and khatib of the Grand Mosque in Mecca since 1984 and, since 2023, president of religious affairs for the Grand Mosque and the Prophet's Mosque (before that president-general of the affairs of the Two Holy Mosques from 2012); among the world's best-known Qur'an reciters. He memorised the Qur'an by the age of twelve, took a doctorate in sharia at Umm al-Qura University in 1995, and was named the Dubai International Holy Quran Award's Islamic Personality of the Year in 2005."
  fr: "Imam et khatib de la Grande Mosquée de La Mecque depuis 1984 et, depuis 2023, président des affaires religieuses de la Grande Mosquée et de la Mosquée du Prophète (auparavant président général des affaires des deux saintes mosquées à partir de 2012) ; l'un des récitants du Coran les plus connus au monde. Il mémorisa le Coran à douze ans, obtint un doctorat en charia à l'université Umm al-Qura en 1995, et fut désigné personnalité islamique de l'année du Prix international du Saint Coran de Dubaï en 2005."
  ur: "1984 سے مسجد حرام کے امام و خطیب اور 2023 سے مسجد حرام و مسجد نبوی کے دینی امور کے صدر ⁦(اس سے قبل 2012 سے امورِ حرمین کے صدرِ عام)⁩؛ دنیا کے مشہور ترین قراء میں سے ہیں۔ بارہ سال کی عمر میں قرآن حفظ کیا، 1995 میں جامعہ ام القریٰ سے شریعت میں ڈاکٹریٹ حاصل کی، اور 2005 میں دبئی بین الاقوامی قرآن ایوارڈ کی اسلامی شخصیت قرار پائے۔"
  es: "Imán y predicador de la Gran Mezquita de La Meca desde 1984 y, desde 2023, presidente de asuntos religiosos de la Gran Mezquita y la Mezquita del Profeta (anteriormente, presidente general de los asuntos de las Dos Mezquitas Sagradas desde 2012); uno de los recitadores del Corán más reconocidos del mundo. Memorizó el Corán a los doce años, se doctoró en sharia en la Universidad Umm al-Qura en 1995 y fue galardonado con el premio a la Personalidad Islámica del Año en los Premios Internacionales del Sagrado Corán de Dubái en 2005."
  tr: "1984'ten beri Mekke'deki Ulu Cami'nin imamı ve vaizi, 2023'ten beri de Medine'deki Ulu Cami ve Peygamber Camii'nin din işleri başkanı (ve öncesinde 2012'den beri İki Kutsal Cami'nin genel başkanı) olan bu kişi, dünyanın en ünlü Kur'an okuyucularından biridir. On iki yaşında Kur'an'ı ezberlemiş, 1995 yılında Umm Al-Qura Üniversitesi'nden İslam hukuku doktorası almış ve 2005 yılında Dubai Uluslararası Kur'an-ı Kerim Ödülleri'nde Yılın İslam Kişiliği seçilmiştir."
  id: "Imam dan khatib Masjidil Haram di Mekah sejak 1984, dan kepala urusan keagamaan di Masjidil Haram dan Masjid Nabawi di Madinah sejak 2023 (dan sebelumnya, presiden umum Dua Masjid Suci sejak 2012), beliau adalah salah satu qari Al-Quran paling terkenal di dunia. Beliau menghafal Al-Quran pada usia dua belas tahun, meraih gelar doktor dalam hukum Islam dari Universitas Umm Al-Qura pada tahun 1995, dan terpilih sebagai Tokoh Islam Tahun Ini untuk Penghargaan Al-Quran Internasional Dubai pada tahun 2005."
