  ar: بنت علي بن أبي طالب وفاطمة بنت النبي، وُلدت في عهد النبي؛ يذكر ابن حجر أخباراً عن خطبة عمر بن الخطاب لها ومهرها وولديها زيد ورقية، ثم عن زواجها بعده من أبناء جعفر بن أبي طالب.
  en: A daughter of Ali ibn Abi Talib and Fatima, the Prophet's daughter, born in the Prophet's lifetime; Ibn Hajar reports accounts of Umar ibn al-Khattab's proposal to her, her dower and her children Zayd and Ruqayya, and then her marriages
    after him to sons of Ja'far ibn Abi Talib.
