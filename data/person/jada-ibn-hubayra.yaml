  ur: "جادہ بن ہبیرہ ابن ابی وہب المخزومی، ام ہانی بنت ابی طالب کے بیٹے؛ علی کی طرف سے خراسان کو توڑنے کے لیے بھیجا گیا، وہ اسے واپس نہ لے سکے - یہ علی کی موت تک بے نقاب رہا۔"
