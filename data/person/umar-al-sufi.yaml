summary:
  ar: "عمر الصوفي، قطع البوادي خاليًا، واعتذر إلى مولاه باكيًا. لقيه إسحاق بن عباد بمكة، فسأله: أجئتَ راكبًا أم راجلًا؟ فبكى وقال: أما يرضى العاصي أن يجيء إلى مولاه راكبًا؟"
  en: "Umar al-Sufi, who crossed the deserts alone and apologised to his master in tears; Ishaq ibn Abbad met him at Mecca and asked whether he had come riding or on foot; he wept and said: is it not enough for the disobedient to come to his master riding?"
  ur: "عمر صوفی صحرا اکیلے عبور کرتے اور روتے ہوئے اپنے آقا سے معذرت کرتے تھے۔ اسحاق بن عباد نے مکہ میں ان سے ملاقات کی اور پوچھا: تم سواری پر آئے یا پیدل؟ وہ روئے اور کہا: کیا نافرمان کے لیے یہ کافی نہیں کہ وہ اپنے آقا کی طرف سواری پر آئے؟"
