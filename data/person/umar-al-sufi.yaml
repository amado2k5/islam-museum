summary:
  ar: "عمر الصوفي، قطع البوادي خاليًا، واعتذر إلى مولاه باكيًا. لقيه إسحاق بن عباد بمكة، فسأله: أجئتَ راكبًا أم راجلًا؟ فبكى وقال: أما يرضى العاصي أن يجيء إلى مولاه راكبًا؟"
  en: "Umar al-Sufi, who crossed the deserts alone and apologised to his master in tears; Ishaq ibn Abbad met him at Mecca and asked whether he had come riding or on foot; he wept and said: is it not enough for the disobedient to come to his master riding?"
  ur: "عمر صوفی صحرا اکیلے عبور کرتے اور روتے ہوئے اپنے آقا سے معذرت کرتے تھے۔ اسحاق بن عباد نے مکہ میں ان سے ملاقات کی اور پوچھا: تم سواری پر آئے یا پیدل؟ وہ روئے اور کہا: کیا نافرمان کے لیے یہ کافی نہیں کہ وہ اپنے آقا کی طرف سواری پر آئے؟"
  es: "Umar al-Sufi, que cruzó los desiertos solo y se disculpó con su amo entre lágrimas; Ishaq ibn Abbad lo encontró en La Meca y le preguntó si había venido a caballo o a pie; él lloró y dijo: ¿Acaso no basta con que el desobediente venga a su amo a caballo?"
  fr: "Umar al-Sufi, qui avait traversé les déserts seul et s'était excusé en larmes auprès de son maître, rencontra Ishaq ibn Abbad à La Mecque et lui demanda s'il était venu à cheval ou à pied; il pleura et dit: n'est-il pas suffisant pour le désobéissant de venir à son maître à cheval ?"
  tr: "Ömer el-Sufi boş çölleri geçti ve ağlayarak efendisinden özür diledi. İshaq bin Abbad onu Mekke'de karşıladı ve sordu: At mı atla mı geldin yoksa yaya mı geldin? Ağladı ve dedi ki: Günahkârın efendisine yürüyerek gelmesi kabul edilebilir değil mi?"
  id: "Umar al-Sufi menyeberangi padang gurun dengan kosong, dan meminta maaf kepada gurunya sambil menangis. Ishaq ibn Abbad menemuinya di Mekah dan bertanya: Apakah kamu datang menunggang kuda atau berjalan kaki? Dia menangis dan berkata: Bukankah pantas bagi orang berdosa datang kepada tuannya dengan berjalan kaki?"
