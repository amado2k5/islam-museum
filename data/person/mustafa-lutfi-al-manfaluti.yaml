summary:
  ar: "كاتب وأديب مصري ⁦(1876–1924)⁩ من روّاد النثر العربي الحديث. درس بالأزهر ثم اتجه إلى الصحافة، واشتهر بمقالاته الوجدانية في «النظرات» و«العبرات»، وبترجماته الأدبية عن الفرنسية مثل «ماجدولين» و«في سبيل التاج» و«الشاعر»."
  en: "Egyptian writer and man of letters (1876–1924), a pioneer of modern Arabic prose. Educated at al-Azhar then turning to journalism, he is famed for his sentimental essays in Al-Nazarat and Al-'Abarat, and for his literary adaptations from French such as Majdulin (Magdalene), Under the Shadow of the Crown and The Poet."
  ur: "مصری ادیب ⁦(1876–1924)⁩ جو جدید عربی نثر کے بانیوں میں شمار ہوتے ہیں۔ ازہر سے تعلیم پائی پھر صحافت کی طرف آئے؛ وہ «النظرات» اور «العبرات» کے جذباتی مضامین اور فرانسیسی سے ادبی اقتباسات جیسے «ماجدولین»، «فی سبیل التاج» اور «الشاعر» کے لیے مشہور ہیں۔"
  es: "Escritor y hombre de letras egipcio (1876-1924), pionero de la prosa árabe moderna. Educado en Al-Azhar y posteriormente dedicado al periodismo, es famoso por sus ensayos sentimentales en Al-Nazarat y Al-'Abarat, y por sus adaptaciones literarias del francés, como Majdulin (Magdalena), Bajo la sombra de la corona y El poeta."
  fr: "Écrivain et homme de lettres égyptien (1876-1924), pionnier de la prose arabe moderne. Formé à al-Azhar puis tourné vers le journalisme, il est célèbre pour ses essais sentimentaux publiés dans Al-Nazarat et Al-'Abarat, ainsi que pour ses adaptations littéraires d'œuvres françaises telles que Majdulin (Madeleine), Sous l'ombre de la couronne et Le Poète."
