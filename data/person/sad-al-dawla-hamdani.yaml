summary:
  ar: "بطاقة أولية لأبي المعالي شريف سعد الدولة، أمير الحمدانيين في حلب من سنة ٩٦٧م إلى ٩٩١م راعي المتنبي والفارابي؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu'l-Ma'ali Sharif Sa'd al-Dawla, the Hamdanid amir of Aleppo from 967 to 991, patron of al-Mutanabbi and al-Farabi; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abu'l-Ma'ali Sharif Sa'd al-Dawla, el emir hamdaní de Alepo desde 967 hasta 991, patrón de al-Mutanabbi y al-Farabi; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Abu'l-Ma'ali Sharif Sa'd al-Dawla, l'émir hamdanide d'Alep de 967 à 991, protecteur d'al-Mutanabbi et d'al-Farabi; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "967 سے 991 تک حلب کے ہمدانی امیر ابو المعالی شریف سعد الدولہ کے لیے ڈرافٹ کارڈ، المتنبی اور الفارابی کے سرپرست؛ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "967-991 yılları arasında Halep'te Hamdaniyên Emiri olan ve el-Mutanabbi ile el-Fararabi'nin koruyucusu olan Ebu el-Ma'ali Şerif Saad el-Devla'nın ön kartı; İslam devletlerinin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Abu al-Ma'ali Sharif Saad al-Dawla, Emir Hamdanid di Aleppo dari tahun 967 M hingga 991 M, pelindung al-Mutanabbi dan al-Farabi; ia disebutkan dalam kamus negara-negara Islam dan biografinya belum ditinjau di halaman tersebut."
