summary:
  ar: "لاعب كرة قدم مغربي محترف (وُلد سنة 1993 في درونتن بهولندا لأبوين مغربيين). صانع ألعاب لقّبه مشجعو أياكس «الساحر»؛ فاز مع أياكس بالدوري الهولندي وكأس هولندا، ثم بدوري أبطال أوروبا وكأس العالم للأندية مع تشيلسي، وبالدوري التركي مع غلطة سراي، وقاد المغرب إلى نصف نهائي كأس العالم 2022، أول منتخب أفريقي يبلغ هذا الدور."
  en: "Moroccan professional footballer (born 1993 in Dronten, Netherlands, to Moroccan parents). A playmaker nicknamed 'the Wizard' by Ajax supporters; he won the Eredivisie and the KNVB Cup with Ajax, then the Champions League and the FIFA Club World Cup with Chelsea and the Turkish Süper Lig with Galatasaray, and helped Morocco reach the 2022 World Cup semi-finals, the first African nation to do so."
  ur: "مراکشی پیشہ ور فٹبالر (پیدائش 1993، ڈرونٹن، نیدرلینڈز، مراکشی والدین کے ہاں)۔ ایک پلے میکر جنہیں آیاکس کے شائقین نے «جادوگر» کا لقب دیا؛ انہوں نے آیاکس کے ساتھ ہالینڈ کی لیگ اور کپ جیتا، پھر چیلسی کے ساتھ چیمپئنز لیگ اور فیفا کلب ورلڈ کپ اور گالاتاسرائے کے ساتھ ترک سپر لیگ جیتی، اور مراکش کو 2022 ورلڈ کپ کے سیمی فائنل تک پہنچایا — ایسا کرنے والا پہلا افریقی ملک۔"
