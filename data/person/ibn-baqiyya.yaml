summary:
  ar: "الوزير أبو الطاهر محمد بن محمد بن بقية بن علي، الملقب نصير الدولة؛ من أهل أوانا من أعمال بغداد، وزير عز الدولة بختيار بن معز الدولة بن بويه، وكان من جلة الرؤساء وأكابر الوزراء وأعيان الكرماء — كان راتب شمعه ألف منّ في كل شهر؛ ولما نقم عليه مخدومه أمر بطرحه للسباع فقتلته ثم صلبه عند داره بباب الطاق، ورثاه ابن عنبري الشاعر {cite:wafayat-ayan}."
  en: "Ibn Baqiyya (d. 367) — Buyid vizier to Izz al-Dawla, famed for generosity (a monthly wax allowance of a thousand mounds); thrown to beasts and crucified at Bab al-Taq {cite:wafayat-ayan}."
