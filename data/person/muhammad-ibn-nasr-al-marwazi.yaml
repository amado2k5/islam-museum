summary:
  ar: "أبو عبد الله محمد بن نصر المروزي، ولد ببغداد ونشأ بنيسابور واستوطن سمرقند {cite:tabaqat-fuqaha-abbas-1981 p. 56}. كان من أعلم الناس باختلاف الصحابة ومن بعدهم في الأحكام، وصنف كتاباً فيما خالف فيه أبو حنيفة علياً وعبد الله {cite:tabaqat-fuqaha-abbas-1981 p. 56}. وقال أبو بكر الصيرفي: لو لم يصنف إلا كتاب «القسامة» لكان من أفقه الناس {cite:tabaqat-fuqaha-abbas-1981 p. 56}."
