summary:
  ar: "عبد المؤمن بن يوسف بن فاخر الخويي الأرموي البغدادي، صفي الدين، إمام عصره في ضرب العود والموسيقى وصاحب «كتاب الأدوار» و«الرسالة الشرقية»؛ أصله من خوي، نشأ في بغداد وخدم المستعصم ثم هولاكو وولاه الأوقاف، ومات محبوساً في دين سنة 693 هـ ⁦(1294 م)⁩."
  en: "Abd al-Mu'min ibn Yusuf al-Khuwayyi al-Urmawi, Safi al-Din, the leading lute player and music theorist of his age and author of the Kitab al-Adwar and al-Risala al-Sharqiyya; from Khuy, raised in Baghdad, he served al-Musta'sim and then Hulagu, who gave him the endowments of Iraq, and he died imprisoned for a debt in 693 AH (1294 CE)."
