roles: [scholar]
gender: male
summary:
  ar: "عبد المؤمن بن يوسف بن فاخر الخويي الأرموي البغدادي، صفي الدين، إمام عصره في ضرب العود والموسيقى وصاحب «كتاب الأدوار» و«الرسالة الشرقية»؛ أصله من خوي، نشأ في بغداد وخدم المستعصم ثم هولاكو وولاه الأوقاف، ومات محبوساً في دين سنة 693 هـ ⁦(1294 م)⁩."
  en: "Abd al-Mu'min ibn Yusuf al-Khuwayyi al-Urmawi, Safi al-Din, the leading lute player and music theorist of his age and author of the Kitab al-Adwar and al-Risala al-Sharqiyya; from Khuy, raised in Baghdad, he served al-Musta'sim and then Hulagu, who gave him the endowments of Iraq, and he died imprisoned for a debt in 693 AH (1294 CE)."
  es: "Abd al-Mu'min ibn Yusuf al-Khuwayyi al-Urmawi, Safi al-Din, el principal intérprete de laúd y teórico musical de su época y autor del Kitab al-Adwar y al-Risala al-Sharqiyya; originario de Khuy, criado en Bagdad, sirvió a al-Musta'sim y luego a Hulagu, quien le otorgó las fundaciones de Irak, y murió encarcelado por una deuda en el año 693 de la Hégira (1294 d. C.)."
  fr: "Abd al-Mu'min ibn Yusuf al-Khuwayyi al-Urmawi, Safi al-Din, le plus grand joueur de luth et théoricien de la musique de son époque et auteur du Kitab al-Adwar et d'al-Risala al-Sharqiyya; de Khuy, élevé à Bagdad, il servit al-Musta'sim puis Hulagu, qui lui donna les dotations de l'Irak, et il mourut emprisonné pour une dette en 693 AH (1294 CE)."
  ur: "عبد المومن ابن یوسف الخوایعی الارماوی، صفی الدین، اپنی عمر کے معروف گلوکار اور موسیقی کے نظریہ ساز اور کتاب الادوار اور الرسالہ الشرقیہ کے مصنف؛ خوئی سے، بغداد میں پرورش پائی، اس نے المستسم اور پھر ہلاگو کی خدمت کی، جس نے اسے عراق کی اوقاف دی، اور وہ 693 ہجری ⁦(1294 عیسوی)⁩ میں قرض کی وجہ سے قید میں فوت ہوا۔"
  tr: "Abd al-Mu'min ibn Yusuf ibn Fakhr al-Khuwai al-Armawi al-Baghdadi, Safi al-Din, döneminin ud ve müzik alanındaki önde gelen figürleri, 'Kitab al-Adwar' ve 'Al-Risala al-Sharqiyya' kitaplarının yazarıdır; aslen Khoy'lu olan Bağdat'ta büyümüş, ardından al-Musta'sim'e, ardından Hulagu'ya hizmet etmiş, vakıflara atanmıştır. 693 Hicri (1294 M.S.) yılında Din'de hapsedilmiş olarak ölmüştür."
  id: "Abd al-Mu'min ibn Yusuf ibn Fakhr al-Khuwai al-Armawi al-Baghdadi, Safi al-Din, tokoh terkemuka pada zamannya dalam dunia oud dan musik, serta penulis 'Kitab al-Adwar' dan 'Al-Risala al-Sharqiyya'; berasal dari Khoy, ia tumbuh besar di Baghdad dan melayani al-Musta'sim, kemudian Hulagu, yang mengangkatnya dalam wakaf. Ia meninggal dalam penjara di Din pada tahun 693 H (1294 M)."
