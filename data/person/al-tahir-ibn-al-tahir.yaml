label:
  ar: الطاهر بن الطاهر، ابن أخ ابن حميد
  en: Al-Tahir ibn al-Tahir, nephew of Ibn Humayd
  ur: طاہر بن طاہر، ابن حمید کا بھتیجا
summary:
  ar: ابن أخ لابن حميد يقال له الطاهر بن الطاهر، رمى عبد الله بن الحسين بحجر في ليلة الهجوم بنجران فسقط مغشياً عليه.
  en: A nephew of Ibn Humayd called al-Tahir ibn al-Tahir, who threw a stone at Abdullah ibn al-Husayn on the night of the attack at Najran so that he fell senseless.
  ur: ابن حمید کا بھتیجا طاہر بن طاہر، جس نے نجران میں حملے کی رات عبداللہ بن حسین کو پتھر مارا جس سے وہ بے ہوش ہو کر گر گئے۔
