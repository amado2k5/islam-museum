label: { ar: "عروة بن حزام العذري", en: "'Urwa ibn Hizam", es: "'Urwa ibn Hizam", fr: "'Urwa ibn Hizam", ur: "عروہ بن حزام" }
summary:
  ar: "من عشاق بني عذرة أحب عفراء بنت عقال فتوفى وجداً بها، فنعاه ركب فأشرفت عفراء فقالت بحق نعيتم عروة بن حزام ثم سألتهم أين دفنوه فصارت إلى قبره فأكبت عليه حتى خرجت نفسها فدفنوها إلى جانب قبره، وروى الهيثم بن عدي عن أبيه أنه وجده شاباً في بيت منحاش ببني منبذة يترنم بأشعاره في عفراء فشهق شهقة فمات وأمه عجوز في كسر البيت {cite:muruj-al-dhahab p. 538-540}."
  en: "The 'Udhri lover dead of longing for 'Afra — she died stretched on his grave, and al-Haytham's account has him die mid-verse by his mother's hut {cite:muruj-al-dhahab p. 538-540}."
  es: "El amante 'Udhri murió de añoranza por 'Afra; ella murió tendida sobre su tumba, y el relato de al-Haytham dice que murió a mitad de un verso junto a la cabaña de su madre {cite:muruj-al-dhahab p. 538-540}."
  fr: "L'amant d'Udhri, mort de désir pour Afra, est mort allongé sur sa tombe, et le récit d'al-Haytham le fait mourir au milieu d'un vers près de la hutte de sa mère {cite:muruj-al-dhahab p. 538-540}."
  ur: "اُدھری عاشق عفرا کی آرزو سے مر گیا - وہ اپنی قبر پر تنی ہوئی مر گئی، اور الہیثم کے بیان میں اس کی موت اس کی ماں کی جھونپڑی کے درمیان آیت کے درمیان ہے {حوالہ: مروج الذہب صفحہ 538-540}۔"
  tr: "Afra bint İqal'i sevdi ve ona aşık olarak öldü. Bir kervan onu yas tuttu, Afra ona gözetim yaptı ve dedi ki, 'Gerçekten Urva ibn Hizam'a yas tuttun.' Sonra onlara onu nereye gömdüklerini sordu. Mezarına gitti ve kaçana kadar yas tuttu, ardından onu mezarının yanına gömdüler. El-Heytham bin 'Adi, babasından onu Banu Manbida'daki Manhash evinde genç halde, Afra'da şiirlerini okurken nefessiz ve ölürken bulduğunu, annesinin ise ayetin kırılması nedeniyle yaşlandığını anlattı {atıf:Muruj-al-Dhahab, s. 538-540}."
  id: "Ia mencintai Afra bint Iqal dan meninggal dalam cinta padanya. Sebuah kafilah berduka, dan Afra mengawasinya dan berkata, 'Kau benar-benar telah berduka atas Urwah ibn Hizam.' Kemudian ia bertanya di mana mereka menguburkannya. Ia pergi ke makamnya dan berduka hingga ia melarikan diri, dan mereka menguburkannya di samping makamnya. Al-Haytham ibn 'Adi menceritakan dari ayahnya bahwa ia menemukannya masih muda di rumah Manhash di Banu Manbida, melantunkan puisinya dalam bahasa Afra, terengah dan sekarat, sementara ibunya sudah tua karena sajak itu terpecah {cite:muruj-al-dhahab, hlm. 538-540}."
