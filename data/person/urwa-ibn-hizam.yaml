summary:
  ar: "من عشاق بني عذرة أحب عفراء بنت عقال فتوفى وجداً بها، فنعاه ركب فأشرفت عفراء فقالت بحق نعيتم عروة بن حزام ثم سألتهم أين دفنوه فصارت إلى قبره فأكبت عليه حتى خرجت نفسها فدفنوها إلى جانب قبره، وروى الهيثم بن عدي عن أبيه أنه وجده شاباً في بيت منحاش ببني منبذة يترنم بأشعاره في عفراء فشهق شهقة فمات وأمه عجوز في كسر البيت {cite:muruj-al-dhahab p. 538-540}."
  en: "The 'Udhri lover dead of longing for 'Afra — she died stretched on his grave, and al-Haytham's account has him die mid-verse by his mother's hut {cite:muruj-al-dhahab p. 538-540}."
