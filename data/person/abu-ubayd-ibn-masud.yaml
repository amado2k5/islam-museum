id: person/abu-ubayd-ibn-masud
class: person
label: { ar: "أبو عبيد بن مسعود الثقفي", en: "Abu Ubayd ibn Mas'ud al-Thaqafi", fr: "Abu Ubayd ibn Mas'ud al-Thaqafi", es: "Abu Ubayd ibn Mas'ud al-Thaqafi", ur: "ابو عبید بن مسعود ثقفی" }
summary:
  ar: "أبو المختار بن أبي عبيد بن مسعود بن عمرو بن عمير بن عوف بن عقدة بن غيرة بن عوف بن ثقيف؛ أول من وجّهه عمر إلى العراق في خلافته في ألف رجل فلقى جابان الأعجمي عند المذيب فهزمه ودرنى فكسكر وصالح الجالينوس بباروسما على أربعة دراهم عن كل رأس ثم عبر الجسر الذي أصلحه فلقي ذا الحاجب مردانشاه في أربعة آلاف مدجج ومعه فيل فقاتل حتى قتل ويقال برك الفيل عليه.؛ وعند ابن الأثير قاد النمارق فهزم جابان وأسره مطر بن فضة ثم خدعه بالأمان فأبى أبو عبيد قتله وقال المسلمون كالجسد الواحد، وكسر نرسي بالسقاطية وأطعم النرسيان الفلاحين وبعث خمسه لعمر، ثم بعث المثنى إلى باروسما ووالقًا إلى الزوابي وعاصمًا إلى نهر جوبر {cite:kamil-ibn-al-athir p. 274-276}."
  en: "Abu al-Mukhtar ibn Abi Ubayd ibn Mas'ud, of Thaqif; Umar's first appointee to Iraq in a thousand men — routed Jaban at al-Mudhayyib and Durna to Kaskar, pacified the Jalinus at Barusma at four dirhams a head, then crossed the bridge he had repaired against Dhu al-Hajib Mardanshah's mailed thousands and elephant, fighting till killed — or the elephant knelt upon him."
  fr: "Abu al-Mukhtar ibn Abi Ubayd ibn Mas'ud, de Thaqif ; premier nommé par Umar en Irak, avec mille hommes. Il mit Jaban en déroute à al-Mudhayyib et Durna jusqu'à Kaskar, conclut la paix avec al-Jalinus à Barusma pour quatre dirhams par tête, puis traversa le pont qu'il avait réparé pour affronter les milliers d'hommes en armure et l'éléphant de Dhu al-Hajib Mardanshah. Il combattit jusqu'à être tué ; selon un récit, l'éléphant s'agenouilla sur lui."
  es: "Abu al-Mukhtar ibn Abi Ubayd ibn Mas'ud, de Thaqif; el primer designado de Umar para Irak con mil hombres, derrotó a Jaban en al-Mudhayyib y a Durna hasta Kaskar, pacificó a los Jalinus en Barusma a cuatro dirhams por cabeza, luego cruzó el puente que había reparado contra los miles de hombres armados y el elefante de Dhu al-Hajib Mardanshah, luchando hasta morir, o hasta que el elefante se arrodilló sobre él."
  ur: "ابو المختار ابن ابی عبید ابن مسعود، ثقیف؛ ایک ہزار آدمیوں میں عمر کا عراق کا پہلا مقرر - المذائب میں جاپان اور دورنا کو کسکر تک پہنچایا، بروسما کے مقام پر جالینس کو چار درہم فی سر پر تسلی دی، پھر اس پل کو عبور کیا جس کی مرمت اس نے ذو الحجیب مردان شاہ کے ہزاروں میلوں اور ہاتھیوں کے خلاف کی تھی، یہاں تک کہ جنگجو مارا گیا۔"
  tr: "Ebu el-Muhtar ibn Ebu Ubeyd ibn Mes'ud ibn Amr ibn Umeyr ibn Avf ibn Ukde ibn Gayre ibn Avf ibn Sakif; Ömer'in halifeliği döneminde bin adamla Irak'a gönderdiği ilk kişidir. El-Mudhib'de Cebân el-Acemi ile karşılaştı ve onu yendi. Daha sonra Darni'ye saldırdı ve ordularını dağıttı. Barusma'da Celinus ile kişi başı dört dirhem karşılığında barış yaptı. Ardından tamir ettirdiği köprüden geçerek, tam teçhizatlı dört bin adam ve bir fil ile Zül-Hacib Mardanşah ile karşılaştı. Ölene kadar savaştı ve filin onun üzerine diz çöktüğü rivayet edilir. İbn el-Athir'e göre, Namarik'e önderlik etti ve Cebân'ı yendi; Cebân, Matar ibn Fade tarafından esir alındı. Daha sonra ona güvenli geçiş sözü vererek kandırdı, ancak Ebu Ubeyd, Müslümanların tek bir beden gibi olduğunu söyleyerek onu öldürmeyi reddetti. El-Saqatiyyah'da Narsi'yi kırdı ve Narsiyyan'ı çiftçilere yedirdi, beşte birini de Ömer'e gönderdi. Sonra el-Muthanna'yı Barusma'ya, Waliq'i el-Zawabi'ye ve Asim'i de Jubar Nehri'ne gönderdi. {cite:kamil-ibn-al-athir s. 274-276}"
  id: "Abu al-Mukhtar ibn Abi Ubayd ibn Mas'ud ibn Amr ibn Umayr ibn Awf ibn Uqdah ibn Ghayrah ibn Awf ibn Thaqif; orang pertama yang diutus Umar ke Irak selama kekhalifahannya dengan seribu orang. Ia bertemu Jaban al-Ajami di al-Mudhib dan mengalahkannya. Kemudian ia menyerang Darni dan menghancurkan pasukannya. Ia berdamai dengan Jalinus di Barusma dengan imbalan empat dirham per orang. Kemudian ia menyeberangi jembatan yang telah diperbaikinya dan bertemu Dhu al-Hajib Mardanshah dengan empat ribu orang bersenjata lengkap dan seekor gajah. Ia bertempur hingga gugur, dan konon gajah itu berlutut di atasnya. Menurut Ibn al-Athir, ia memimpin Namariq dan mengalahkan Jaban, yang ditangkap oleh Matar ibn Fadah. Kemudian ia menipunya dengan janji perjalanan yang aman, tetapi Abu Ubayd menolak untuk membunuhnya, dengan mengatakan bahwa kaum Muslimin seperti satu tubuh. Dia mematahkan Narsi di al-Saqatiyyah dan memberikan Narsiyyan kepada para petani dan mengirim seperlima darinya kepada Umar. Kemudian dia mengirim al-Muthanna kepada Barusma, Waliq kepada al-Zawabi, dan Asim ke Sungai Jubar. {cite:kamil-ibn-al-athir p. 274-276}"
