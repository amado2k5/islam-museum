summary:
  ar: "أبو المختار بن أبي عبيد بن مسعود بن عمرو بن عمير بن عوف بن عقدة بن غيرة بن عوف بن ثقيف؛ أول من وجّهه عمر إلى العراق في خلافته في ألف رجل فلقى جابان الأعجمي عند المذيب فهزمه ودرنى فكسكر وصالح الجالينوس بباروسما على أربعة دراهم عن كل رأس ثم عبر الجسر الذي أصلحه فلقي ذا الحاجب مردانشاه في أربعة آلاف مدجج ومعه فيل فقاتل حتى قتل ويقال برك الفيل عليه."
  en: "Abu al-Mukhtar ibn Abi Ubayd ibn Mas'ud, of Thaqif; Umar's first appointee to Iraq in a thousand men — routed Jaban at al-Mudhayyib and Durna to Kaskar, pacified the Jalinus at Barusma at four dirhams a head, then crossed the bridge he had repaired against Dhu al-Hajib Mardanshah's mailed thousands and elephant, fighting till killed — or the elephant knelt upon him."
