aliases: [Izz al-Din Kaykaus II, Izz al-Din Kaykawus, Kaykā'ūs II, Keykavus II]
summary:
  ar: "عز الدين كيكاوس الثاني سلطان من سلاجقة الروم، الابن الأكبر لكيخسرو الثاني من أم رومية، حكم غرب الأناضول بينما حكم أخوه ركن الدين قلج أرسلان شرقها في ظل نفوذ المغول. هُزم وفرّ إلى القسطنطينية ثم انتهى به المطاف في القرم حيث توفي سنة 678هـ/1279-1280م، وبقي بعض الأتراك الذين تبعوه في الدوبروجة، ويرى كاتب المقال أن اسم القاغاوز تحريف لاسمه {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
  en: "Izz al-Din Kaykaus II was a Seljuk sultan of Rum, the eldest son of Kaykhusraw II by a Greek mother. He ruled western Anatolia while his brother Rukn al-Din Kilij Arslan ruled the east under Mongol influence. Defeated, he fled to Constantinople and finally to the Crimea, where he died in 678/1279-80; Turks who followed him stayed in Dobruja, where, the author says, the Gagauz name is a distortion of his own {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
  ur: "عزالدین کیکاؤس دوم سلجوقیانِ روم کا سلطان تھا، جو کیخسرو دوم کا بڑا بیٹا اور رومی ماں کی اولاد تھا۔ اس نے مغربی اناطولیہ پر حکومت کی جب کہ اس کا بھائی رکن الدین قلج ارسلان منگولوں کے زیرِ اثر مشرق پر حاکم رہا۔ شکست کے بعد وہ قسطنطنیہ بھاگ گیا اور آخرکار کریمیا پہنچا جہاں 678ھ/1279-1280ء میں فوت ہوا؛ اس کے ساتھ آنے والے ترک دوبروجہ میں رہ گئے جہاں، مضمون نگار کے بقول، گاگاؤز کا نام اسی کے نام کی بگڑی صورت ہے {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
