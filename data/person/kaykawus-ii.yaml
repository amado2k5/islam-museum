summary:
  ar: "عز الدين كيكاوس الثاني سلطان من سلاجقة الروم، الابن الأكبر لكيخسرو الثاني من أم رومية، حكم غرب الأناضول بينما حكم أخوه ركن الدين قلج أرسلان شرقها في ظل نفوذ المغول. هُزم وفرّ إلى القسطنطينية ثم انتهى به المطاف في القرم حيث توفي سنة 678هـ/1279-1280م، وبقي بعض الأتراك الذين تبعوه في الدوبروجة، ويرى كاتب المقال أن اسم القاغاوز تحريف لاسمه {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
  en: "Izz al-Din Kaykaus II was a Seljuk sultan of Rum, the eldest son of Kaykhusraw II by a Greek mother. He ruled western Anatolia while his brother Rukn al-Din Kilij Arslan ruled the east under Mongol influence. Defeated, he fled to Constantinople and finally to the Crimea, where he died in 678/1279-80; Turks who followed him stayed in Dobruja, where, the author says, the Gagauz name is a distortion of his own {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
  ur: "عزالدین کیکاؤس دوم سلجوقیانِ روم کا سلطان تھا، جو کیخسرو دوم کا بڑا بیٹا اور رومی ماں کی اولاد تھا۔ اس نے مغربی اناطولیہ پر حکومت کی جب کہ اس کا بھائی رکن الدین قلج ارسلان منگولوں کے زیرِ اثر مشرق پر حاکم رہا۔ شکست کے بعد وہ قسطنطنیہ بھاگ گیا اور آخرکار کریمیا پہنچا جہاں 678ھ/1279-1280ء میں فوت ہوا؛ اس کے ساتھ آنے والے ترک دوبروجہ میں رہ گئے جہاں، مضمون نگار کے بقول، گاگاؤز کا نام اسی کے نام کی بگڑی صورت ہے {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
  es: "Izz al-Din Kaykaus II fue un sultán selyúcida de Rum, hijo mayor de Kaykhusraw II y madre griega. Gobernó Anatolia occidental mientras su hermano Rukn al-Din Kilij Arslan gobernaba el este bajo influencia mongola. Derrotado, huyó a Constantinopla y finalmente a Crimea, donde murió en 678/1279-80. Los turcos que lo siguieron se establecieron en Dobruja, donde, según el autor, el nombre Gagauz es una distorsión del suyo propio {cite:encyclopaedia-of-islam-2 vol. 4 p. 851-852}."
  fr: "Izz al-Din Kaykaus II était un sultan seldjoukide de Roum, fils aîné de Kaykhusraw II et d'une mère grecque. Il régnait sur l'Anatolie occidentale tandis que son frère Rukn al-Din Kilij Arslan gouvernait l'est sous influence mongole. Vaincu, il s'enfuit à Constantinople puis en Crimée, où il mourut en 678/1279-80. Les Turcs qui lui succédèrent s'installèrent en Dobroudja, où, selon l'auteur, le nom gagaouze est une déformation du sien (voir Encyclopaedia of Islam, vol. 4, p. 851-852)."
  tr: "İzzeddin Kaykaus II, Rum Selçuklularından bir sultandı; Um Rumiya'dan II. Hosrov'un en büyük oğluydu; Rumiye'nin batı Anadolu'sunu yönetirken kardeşi Rukn al-Din Kilij Arslan doğuyu Moğol etkisi altında yönetiyordu. Yenildi ve Konstantinopolis'e kaçtı, sonunda Kırım'a gitti ve 678 Hicri / 1279-1280 yılında öldü. Onu takip eden bazı Türkler Dobruca'da kaldı. Makalenin yazarı, Qaghuz isminin kendi adınasının bir çarpıtması olduğuna inanıyor {cite:Encyclopaedia-of-Islam-2 cilt 4, s. 851-852}."
  id: "Izz al-Din Kaykaus II adalah seorang sultan dari suku Seljuk Rum, putra sulung Khosrow II dari um Rumiya, yang memerintah Anatolia barat sementara saudaranya Rukn al-Din Kilij Arslan memerintah timur di bawah pengaruh Mongol. Ia dikalahkan dan melarikan diri ke Konstantinopel, akhirnya berakhir di Krimea, di mana ia meninggal pada tahun 678 H / 1279-1280 M. Beberapa orang Turki yang mengikutinya tetap tinggal di Dobruja. Penulis artikel ini percaya bahwa nama Qaghuz adalah distorsi dari namanya sendiri {cite:Encyclopaedia-of-Islam-2 vol. 4, hlm. 851-852}."
