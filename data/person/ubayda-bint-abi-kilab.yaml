summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، اختلفت إلى مالك بن دينار عشرين سنة، وسألته مرة متى يبلغ المتقي الدرجة العليا فقال: إذا لم يكن شيء أحب إليه من القدوم على الله، فصرخت وغشي عليها؛ وقال البراء الغنوي يوم ماتت إنه ما خلّفت البصرة أفضل منها."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who attended Malik ibn Dinar for twenty years and once asked him when the God-fearing reach the highest degree; when he answered, 'when nothing is dearer to them than coming to God', she cried out and fainted. Al-Bara' al-Ghanawi said on the day she died that Basra had left no one better."
