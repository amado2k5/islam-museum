roles: [mystic]
summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، اختلفت إلى مالك بن دينار عشرين سنة، وسألته مرة متى يبلغ المتقي الدرجة العليا فقال: إذا لم يكن شيء أحب إليه من القدوم على الله، فصرخت وغشي عليها؛ وقال البراء الغنوي يوم ماتت إنه ما خلّفت البصرة أفضل منها."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who attended Malik ibn Dinar for twenty years and once asked him when the God-fearing reach the highest degree; when he answered, 'when nothing is dearer to them than coming to God', she cried out and fainted. Al-Bara' al-Ghanawi said on the day she died that Basra had left no one better."
  es: "Una mujer devota de Basora, mencionada por Ibn al-Jawzi en Sifat al-Safwa, asistió a Malik ibn Dinar durante veinte años y en una ocasión le preguntó cuándo los temerosos de Dios alcanzan el grado más alto. Cuando él respondió: «Cuando nada les es más querido que acercarse a Dios», ella gritó y se desmayó. Al-Bara' al-Ghanawi dijo el día de su muerte que Basora no había dejado a nadie mejor."
  fr: "Une pieuse femme de Bassora, dont Ibn al-Jawzi relate l'histoire dans son ouvrage Sifat al-Safwa, avait été l'élève de Malik ibn Dinar pendant vingt ans. Un jour, elle lui demanda à quel moment la crainte de Dieu atteignait son apogée. À sa réponse: « Quand rien ne leur est plus cher que de se tourner vers Dieu », elle s'écria et s'évanouit. Al-Bara' al-Ghanawi déclara le jour de sa mort que Bassora n'avait laissé personne de meilleur exemple."
  ur: "بصرہ کی ایک متقی خاتون جو ابن الجوزی نے صفات الصفوی میں درج کی ہے، جس نے بیس سال تک مالک بن دینار کے پاس حاضری دی اور ایک بار ان سے پوچھا کہ خدا پرہیزگار کب اعلیٰ درجے پر پہنچتے ہیں؟ جب اس نے جواب دیا، 'جب انہیں خدا کے پاس آنے سے زیادہ کوئی چیز عزیز نہیں'، تو وہ چیخ اٹھی اور بے ہوش ہو گئی۔ البراء الغنوی نے جس دن ان کی وفات ہوئی اس دن کہا کہ بصرہ نے اس سے بہتر کوئی نہیں چھوڑا۔"
  tr: "Basra'dan bir ibadet eden, İbn el-Cevzi tarafından 'Sifat al-Safwa'da bahsedilen, yirmi yıl boyunca Malik ibn Dinar hakkında farklı düşünen ve bir keresinde dindarların en yüksek rütbeye ne zaman ulaşacağını sormuştur. O şöyle dedi: Eğer Tanrı'ya gelmekten daha sevdiği bir şey yoksa, o bağırdı ve bayıldı; ve Al-Bara el-Ghanawi, öldüğü gün, 'Basra'dan bundan daha iyi bir şey bırakmadı.' dedi."
  id: "Seorang pemuja dari Basra, yang disebutkan oleh Ibn al-Jawzi dalam 'Sifat al-Safwa,' yang berbeda pendapat tentang Malik ibn Dinar selama dua puluh tahun, dan pernah bertanya kapan orang saleh akan mencapai pangkat tertinggi. Ia berkata: Jika tidak ada yang lebih dicintainya daripada datang kepada Tuhan, dia menangis dan pingsan; dan Al-Bara' al-Ghanawi berkata pada hari kematiannya, 'Tidak ada yang meninggalkan Basra lebih baik darinya.'"
