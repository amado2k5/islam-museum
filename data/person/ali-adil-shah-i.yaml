summary:
  ar: "بطاقة أولية لعلي عادل شاه الأول البيجابوري، سلطان بيجابور الخامس الذي انضم إلى تحالف الدكن الذي أسقط فيجاياناغارا سنة ١٥٦٥م، توفي سنة ١٥٧٩م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ali Adil Shah I, fifth Adil Shahi sultan of Bijapur who joined the Deccan alliance that destroyed Vijayanagara in 1565, d. 1579; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Ali Adil Shah I, quinto sultán Adil Shahi de Bijapur que se unió a la alianza Deccan que destruyó Vijayanagara en 1565, m. 1579; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Ali Adil Shah I, cinquième sultan Adil Shahi de Bijapur, qui a rejoint l'alliance du Deccan qui a détruit Vijayanagara en 1565, décédé en 1579; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "بیجاپور کے پانچویں عادل شاہی سلطان علی عادل شاہ اول کے لیے ڈرافٹ کارڈ جو دکن کے اتحاد میں شامل ہوا جس نے 1565 میں وجے نگر کو تباہ کر دیا، ڈی۔ 1579; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
