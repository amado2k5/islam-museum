summary:
  ar: "الحافظ شمس الدين ابن الجزري مقرئ الممالك الإسلامية؛ ولد بدمشق ليلة السبت خامس وعشرين رمضان سنة إحدى وخمسين وسبعمائة وتفقه بها وهج بطلب الحديث والقراءات وبرز فيهما وعمر للقراء مدرسة سماها دار القرآن، وكان قد باشر عند تطلبك استادار إيتمش فنقم عليه شيئاً فتهدده ففر منه فنزل البحر إلى بلاد الروم سنة ثمان وتسعين فاتصل ببايزيد بن عثمان فعظمه وأخذ أهل البلاد عنه علم القراءات وأكثروا عنه ثم كان فيمن حضر الوقعة مع ابن عثمان والتنكية فلما أسر ابن عثمان اتصل به تيمورلنك فعظمه وفوض له قضاء شيراز فباشره مدة طويلة وكان كثير الإحسان لأهل الحجاز وأخذ عنه أهل تلك البلاد القراءات والحديث، وقد انتهت إليه رياسة علم القراءات في الممالك وكان قديماً صنف الحصن الحصين في الأدعية فولع به أهل اليمن واستكثروا منه قبل أن يدخل إليهم، وذيل طبقات القراء للذهبي وأجاد فيه ونظم قصيدة في قراءات الثلاثة وجمع النشر في القراءات العشر، قال ابن حجر بالجملة فإنه كان عديم النظير طائر الصيت انتفع الناس بكتبه وسارت في الآفاق مسير الشمس، توفي بشيراز في ربيع الأول سنة ثلاث وثلاثين وثمانمائة ودفن بمدرسته التي بناها بها {cite:shadharat-dhahab p. 204-206}."
  en: "The hafiz Ibn al-Jazari (b. Damascus 25 Ramadan 751) — 'reciter of the Islamic realms,' founder of the Dar al-Qur'an; fled a vizier's threat to Bayezid's Rum in 798 where the land learned qira'at from him, witnessed the Ankara battle at Bayezid's side, was honoured by Timur himself and given Shiraz's judiciary; author of al-Hisn al-Hasin, al-Nashr on the ten readings, the Tayyiba poem and a dhayl on al-Dhahabi's Tabaqat al-Qurra'; died at Shiraz Rabi' I 833, buried at his own madrasa {cite:shadharat-dhahab p. 204-206}."
