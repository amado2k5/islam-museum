summary:
  ar: "كان في جيش أهل الشام مع الحصين بن نمير، صعد منبر رسول الله بالمدينة حين هتف أهلها بهم وذكروا قتلاهم بالحرة فقال ما دعوناكم إلا إلى هذا الحي من قريش ثم إلى طاعة يزيد وعلى طاعته قاتلناكم فإيانا توعدون أما والله إنا لأبناء الطعن والطاعون وفضلات الموت والمنون {cite:muruj-al-dhahab p. 78-79}."
  en: "The Syrian-army Judhami who mounted the Prophet's own minbar at Medina to answer its taunts — 'we called you to this clan of Quraysh and Yazid's obedience; we are sons of the spear-thrust and the plague' {cite:muruj-al-dhahab p. 78-79}."
