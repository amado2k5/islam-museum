id: person/ruh-ibn-zanba-al-judhami
class: person
label: { ar: "روح بن زنباع الجذامي", en: "Ruh ibn Zanba' al-Judhami", es: "Ruh ibn Zanba' al-Judhami", fr: "Ruh ibn Zanba' al-Judhami", ur: "روح بن زنبہ الجوثمی" }
summary:
  ar: "كان في جيش أهل الشام مع الحصين بن نمير، صعد منبر رسول الله بالمدينة حين هتف أهلها بهم وذكروا قتلاهم بالحرة فقال ما دعوناكم إلا إلى هذا الحي من قريش ثم إلى طاعة يزيد وعلى طاعته قاتلناكم فإيانا توعدون أما والله إنا لأبناء الطعن والطاعون وفضلات الموت والمنون {cite:muruj-al-dhahab p. 78-79}. كان من أقرب الناس إلى عبد الملك، وأيّد فكرة خلع عبد العزيز بن مروان من ولاية العهد، ونصح قبيصة بن ذؤيب بخلاف ذلك، ثم توفي عبد العزيز قبل تنفيذ الأمر. {cite:salabi-umayyad-state-2020 p.33-34}"
  en: "The Syrian-army Judhami who mounted the Prophet's own minbar at Medina to answer its taunts — 'we called you to this clan of Quraysh and Yazid's obedience; we are sons of the spear-thrust and the plague' {cite:muruj-al-dhahab p. 78-79}."
  es: "El Judhami del ejército sirio que subió al propio minbar del Profeta en Medina para responder a sus burlas: «Os hemos llamado a este clan de Quraysh y a la obediencia de Yazid; somos hijos de la lanza y de la peste» {cita:muruj-al-dhahab págs. 78-79}."
  fr: "Le Judhami de l'armée syrienne qui monta sur le minbar du Prophète à Médine pour répondre à ses railleries — « nous t'avons appelé à ce clan de Quraysh et à l'obéissance de Yazid; nous sommes les fils du coup de lance et de la peste » {cite: muruj-al-dhahab p. 78-79}."
  ur: "شامی فوج جودھمی جس نے اپنے طعنوں کا جواب دینے کے لیے مدینہ میں نبی کے اپنے منبر پر چڑھائی - 'ہم نے آپ کو قریش کے اس قبیلے اور یزید کی اطاعت میں بلایا ہے۔ ہم نیزے کے زور اور طاعون کے بیٹے ہیں۔ 78-79}۔"
  tr: "Levant halkının ordusundaydı, el-Hüseyin bin Numayr ile birlikteydi. Medine'de Allah'ın El-Tanrı Elçisi kürsüsüne çıktı; Medine'de halk onları tezahürat etti ve ölülerini andı. Dedi ki, 'Sizi sadece bu Kureyş çevresine çağırdık, sonra Yezid'e itaat için ve onun itaatiyle sizinle savaştık. Yani biz sizi tehdit ediyoruz. Allah adına, biz gerçekten bıçaklanma, veba, ölüm kalıntıları ve ölüm kalıntılarıyız.' (alıntı:Muruj-al-Dhahab s. 78-79}. Abd al-Malik'in en yakın ortaklarından biriydi ve Abd al-Aziz bin Mervan'ın veliaht prensten devrilmesi fikrini destekledi, Qubaysa ibn Dhu'ayb'a ise aksi tavsiyelerde bulundu. Daha sonra Abd al-Aziz, emir yerine getirilmeden önce öldü. {cite:Salabi-umayyad-state-2020 s.33-34}"
  id: "Dia berada dalam tentara rakyat Levant bersama al-Husayn ibn Numayr. Dia naik ke mimbar Rasul Allah di Madinah ketika rakyatnya bersorak untuk mereka dan menyebut kematian mereka di Al-Harrah. Dia berkata, 'Kami hanya memanggil kalian ke daerah Quraysh ini, lalu untuk taat kepada Yazid, dan atas ketaatan-Nya kami melawan kalian. Jadi kalian diancam oleh kami. Demi Tuhan, kami memang anak-anak tusukan, wabah, dan sisa-sisa kematian serta sisa kematian.' Muruj-al-Dhahab hlm. 78-79}. Ia termasuk di antara rekan terdekat Abd al-Malik dan mendukung gagasan untuk menggulingkan Abd al-Aziz ibn Marwan dari putra mahkota, serta memberi nasihat kepada Qubaysa ibn Dhu'ayb untuk hal lain. Kemudian, Abd al-Aziz meninggal sebelum perintah itu dilaksanakan. {sitasi: Salabi-Umayyad-State-2020 hlm.33-34}"
