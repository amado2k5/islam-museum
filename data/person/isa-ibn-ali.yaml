id: person/isa-ibn-ali
class: person
label: { ar: "عيسى بن علي بن عبد الله بن العباس", en: "Isa ibn Ali ibn Abdallah ibn al-Abbas", es: "Isa ibn Ali ibn Abdallah ibn al-Abbas", fr: "Isa ibn Ali ibn Abdallah ibn al-Abbas", ur: "عیسیٰ ابن علی ابن عبداللہ ابن العباس" }
summary:
  ar: "عيسى بن علي بن عبد الله بن العباس؛ عند البلاذري عن الواقدي: كان بمرعش وقد غزا في تلك السنة حين خرج ميخائيل من درب الحدث في ثمانين ألفاً سنة 161 فصار إلى باب المدينة فخرج إليه موالي عيسى وأهل المدينة ومقاتلتهم فرشقوه بالنبل والسهام فاستطرد لهم ثم كوّى عليهم فقتل من مواليه ثمانية أنفس واعتصم الباقون بالمدينة فحاصرهم بها ثم انصرف إلى جيحان."
  en: "Isa ibn Ali ibn Abdallah ibn al-Abbas; in al-Baladhuri from al-Waqidi: he was at Mar'ash — having led that year's raid — when Michael came out of the Darb al-Hadath with eighty thousand in year 161 and reached the city gate; Isa's mawalis, the townsfolk and their fighters went out, shot him with arrows, pursued when he feigned flight, then he turned on them and killed eight of Isa's mawalis before besieging the shut city and withdrawing to Jayhan."
  es: "Isa ibn Ali ibn Abdallah ibn al-Abbas; en al-Baladhuri de al-Waqidi: estaba en Mar'ash —habiendo liderado la incursión de ese año— cuando Miguel salió del Darb al-Hadath con ochenta mil en el año 161 y llegó a la puerta de la ciudad; los mawalis de Isa, los habitantes de la ciudad y sus guerreros salieron, le dispararon flechas, lo persiguieron cuando fingió huir, entonces se volvió contra ellos y mató a ocho de los mawalis de Isa antes de sitiar la ciudad cerrada y retirarse a Jayhan."
  fr: "Isa ibn Ali ibn Abdallah ibn al-Abbas; dans al-Baladhuri d'après al-Waqidi: il était à Mar'ash — après avoir mené le raid de cette année-là — lorsque Michel sortit du Darb al-Hadath avec quatre-vingt mille hommes en l'an 161 et atteignit la porte de la ville; les mawalis d'Isa, les habitants et leurs combattants sortirent, lui tirèrent des flèches, le poursuivirent lorsqu'il feignit de fuir, puis il se retourna contre eux et tua huit des mawalis d'Isa avant d'assiéger la ville fermée et de se retirer à Jayhan."
  ur: "عیسیٰ ابن علی ابن عبداللہ ابن العباس؛ البلادوری میں الواقدی سے: وہ مرش میں تھا - اس سال کے چھاپے کی قیادت کر رہا تھا - جب مائیکل 161 میں اسی ہزار کے ساتھ دارب الحدیث سے نکلا اور شہر کے دروازے پر پہنچا۔ عیسیٰ کے موالی، شہر کے لوگ اور ان کے جنگجو باہر نکلے، اس پر تیر مارے، جب اس نے بھاگنے کا ارادہ کیا تو اس کا تعاقب کیا، پھر اس نے ان پر حملہ کیا اور بند شہر کا محاصرہ کرنے اور جیحان کی طرف پیچھے ہٹنے سے پہلے عیسیٰ کے آٹھ موالیوں کو مار ڈالا۔"
  tr: "İsa ibn Ali ibn Abdullah ibn al-Abbas; el-Vekidi'den al-Baladhuri'ye göre: O Maraş'taydı ve o yıl bir sefer başlatmıştı; Mikail 161 Hicri yılında seksen bin kişiyle Darb al-Hadat'tan ayrıldı. Medine kapısına ulaştı; burada İsa'nın özgürlükçüleri ve Medine halkı onunla savaşmak için çıktı, ona ok attı, onlara saldırdı, ardından sekiz takipçisini ütüleyip öldürdü. Geri kalanlar Medine'ye sığındı, kuşattı ve ardından Cihan'a çekildi."
  id: "Isa ibn Ali ibn Abdullah ibn al-Abbas; menurut al-Baladhuri dari al-Waqidi: Ia berada di Marash dan melancarkan kampanye tahun itu ketika Michael meninggalkan Darb al-Hadath pada tahun delapan puluh ribu tahun 161 H. Ia sampai di gerbang Madinah, di mana para mantan orang Isa dan rakyat Madinah keluar untuk melawannya, menembakkan panah dan panah ke arahnya, lalu menyetrika dan membunuh delapan pengikutnya. Sisanya berlindung di Madinah, mengepung mereka, lalu mundur ke Jihan."
