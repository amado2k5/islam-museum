summary:
  ar: "صاحب البحرين الذي بعث إليه النبي العلاء بن الحضرمي قبل فتح مكة فأسلم وحسن إسلامه، ومات بعد النبي قبل ردة أهل البحرين والعلاء عنده أميراً للنبي عليها."
  en: "The lord of Bahrayn to whom the Prophet sent al-Ala' ibn al-Hadrami before the conquest of Mecca; he became a good Muslim and died after the Prophet, before the apostasy of Bahrayn, with al-Ala' stationed with him as the Prophet's governor."
  fr: "Le seigneur de Bahrayn à qui le Prophète a envoyé al-Ala' ibn al-Hadrami avant la conquête de La Mecque, il est devenu un bon musulman et est mort après le Prophète, avant l'apostasie de Bahrayn, avec al-Ala' stationné avec lui comme gouverneur du Prophète."
  es: "El señor de Bahrayn a quien el Profeta envió a al-Ala' ibn al-Hadrami antes de la conquista de La Meca; se convirtió en un buen musulmán y murió después del Profeta, antes de la apostasía de Bahrayn, con al-Ala' destinado con él como gobernador del Profeta."
  ur: "بحرین کا وہ آقا جس کے پاس نبی نے فتح مکہ سے پہلے علاء بن الحدرمی کو بھیجا تھا۔ وہ ایک اچھا مسلمان ہوا اور رسول اللہ کے بعد، بحرین کے ارتداد سے پہلے، علاء کے ساتھ نبی کے گورنر کے طور پر متعین ہوا۔"
  tr: "Bahreyn sahibi, Peygamber'in Mekke'yi fethetmeden önce El-Ala bin El-Hadrami gönderdiği kişi, İslam'ı benimsemiş ve İslam'ı iyi benimsemiş, Peygamber'den sonra Bahreyn halkının dinden dönmeden önce ölmüş ve El-Alaa, Peygamber'in onların üzerindeki komutanı olarak atanmıştır."
  id: "Pemilik Bahrain, kepada siapa Nabi mengirim Al-Alaa ibn Al-Hadrami sebelum penaklukan Mekah, yang memeluk Islam dan memeluk Islam dengan baik, dan wafat setelah Nabi sebelum murtad rakyat Bahrain, dan Al-Alaa diangkat sebagai komandan Nabi atas mereka."
