summary:
  ar: "صحابي من أشجع؛ يروي عن نفسه أنه كان في غزوة ذات السلاسل صاحباً لأبي بكر وعمر، فمرّ بقوم نحروا جزوراً لا يحسنون قسمتها فقسمها لهم على نصيب منها وحمله إلى أصحابه فأكلوه، فأنكر عليه أبو بكر وعمر وتقيّآ ما أكلا، وكان أول قادم على النبي فقال له: أصاحب الجزور؟ ولم يزده على ذلك."
  en: "A Companion of Ashja'; he tells of himself that in the Dhat al-Salasil campaign, travelling with Abu Bakr and Umar, he passed people who had slaughtered a camel and could not divide it, divided it for a share which he brought to his companions to eat; Abu Bakr and Umar rebuked him and vomited what they had eaten, and when he was the first to reach the Prophet, the Prophet said to him 'the man of the camel?' and nothing more."
