roles: [companion]
summary:
  ar: "صحابي من أشجع؛ يروي عن نفسه أنه كان في غزوة ذات السلاسل صاحباً لأبي بكر وعمر، فمرّ بقوم نحروا جزوراً لا يحسنون قسمتها فقسمها لهم على نصيب منها وحمله إلى أصحابه فأكلوه، فأنكر عليه أبو بكر وعمر وتقيّآ ما أكلا، وكان أول قادم على النبي فقال له: أصاحب الجزور؟ ولم يزده على ذلك."
  en: "A Companion of Ashja'; he tells of himself that in the Dhat al-Salasil campaign, travelling with Abu Bakr and Umar, he passed people who had slaughtered a camel and could not divide it, divided it for a share which he brought to his companions to eat; Abu Bakr and Umar rebuked him and vomited what they had eaten, and when he was the first to reach the Prophet, the Prophet said to him 'the man of the camel?' and nothing more."
  ur: "اشجع کا صحابی؛ خود بتاتا ہے کہ ذات السلاسل کی مہم میں ابو بکر اور عمر کے ساتھ سفر کرتے ہوئے اس نے لوگوں کو زبیحہ کے پاس سے گزرا۔"
  es: "Un compañero de Ashja'; cuenta que en la campaña de Dhat al-Salasil, viajando con Abu Bakr y Umar, pasó junto a unas personas que habían sacrificado un camello y no podían dividirlo, lo dividieron en una porción que llevó a sus compañeros para que comieran; Abu Bakr y Umar lo reprendieron y vomitaron lo que habían comido, y cuando fue el primero en llegar ante el Profeta, el Profeta le dijo '¿el hombre del camello?' y nada más."
  fr: "Un compagnon d'Ashja' raconte que lors de la campagne de Dhat al-Salasil, voyageant avec Abu Bakr et Umar, il croisa des gens qui avaient abattu un chameau et ne pouvaient le partager; il le partagea donc pour en donner une part à ses compagnons. Abu Bakr et Umar le réprimandèrent et vomirent ce qu'ils avaient mangé. Lorsqu'il fut le premier à atteindre le Prophète, celui-ci lui demanda: « L'homme au chameau ? » et rien de plus."
  tr: "Aşca'dan bir sahabe, Zulüd-Salasil Savaşı sırasında Ebu Bekir ve Ömer'in arkadaşı olduğunu anlatır. Havuçları nasıl dağıtacaklarını bilmedikleri bir grubun yanından geçti, bu yüzden havuçları aralarında paylaştırıp sahabelerine götürdü, onlar da yedi. Ebu Bekir ve Ömer ona karşı çıktı ve yediklerinden mahrum kaldılar. Peygamber'e ilk gelen o oldu ve ona dedi ki: Sen havuç arkadaşı mısın? Buna ek yapmadı."
  id: "Seorang sahabat dari Ashja' menceritakan bahwa selama Pertempuran Dhu al-Salasil, ia adalah teman Abu Bakr dan Umar. Ia melewati sekelompok orang yang menyembelih wortel yang mereka tidak tahu cara membagikannya, sehingga ia membaginya kepada mereka sebagai bagian dan membawanya kepada para sahabatnya, yang kemudian memakannya. Abu Bakr dan Umar menolaknya dan tidak makan apa yang mereka makan. Ia adalah yang pertama datang kepada Nabi dan berkata kepadanya: Apakah engkau sahabat wortel? Ia tidak menambahkan hal itu."
