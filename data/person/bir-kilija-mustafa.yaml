summary:
  ar: "بير كلجة مصطفى؛ أشهر دعاة الشيخ بدر الدين السماوني وأمراء جنوده في رواية الصلابي. يذكر الكتاب أنه قتل القائد سيسمان الذي أرسله السلطان محمد جلبي لمحاربة بدر الدين وهزم جيشه، فأعدّ السلطان جيشاً آخر بقيادة وزيره الأول بايزيد باشا فحاربه وانتصر عليه في موقعة قره بورنو، وأُقيم عليه بعدها حد الحرابة فأُعدم {cite:dawlat-uthmaniyya-salabi p. 75}."
  en: "Börklüce Mustafa — in al-Sallabi's account the best-known preacher and field commander of Sheikh Badr al-Din's movement. He killed Mehmed's commander Shishman and routed his army, then fell to a second host under the vizier Bayezid Pasha at Qara Burnu and was executed under the hiraba ruling {cite:dawlat-uthmaniyya-salabi p. 75}."
