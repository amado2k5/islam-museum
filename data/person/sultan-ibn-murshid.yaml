summary:
  ar: "سلطان الثالث بن مرشد بن عدي اليعربي، عاشر الأئمة اليعربيين من الإباضية في عمان وآخرهم، بويع له بعد خلع سيف بن سلطان سنة ١١٥٤هـ ثم أصيب بجراحات في حروبه مع سيف وتوفي سنة ١١٥٥هـ."
  en: "Sultan (III) ibn Murshid ibn Adi al-Ya'rubi, the tenth and last of the Ya'ariba imams of the Ibadis in Oman, given the pledge after the deposition of Sayf ibn Sultan in 1154 AH, who was wounded in his wars with Sayf and died of the wounds in 1155 AH (1742)."
  es: "Sultan (III) ibn Murshid ibn Adi al-Ya'rubi, el décimo y último de los imanes Ya'ariba de los ibadíes en Omán, dio el juramento después de la deposición de Sayf ibn Sultan en 1154 AH, quien fue herido en sus guerras con Sayf y murió de las heridas en 1155 AH (1742)."
  fr: "Sultan (III) ibn Murshid ibn Adi al-Ya'rubi, le dixième et dernier des imams Ya'ariba des Ibadis à Oman, reçut le serment après la déposition de Sayf ibn Sultan en 1154 AH, qui fut blessé lors de ses guerres avec Sayf et mourut des suites de ses blessures en 1155 AH (1742)."
  ur: "سلطان (III) ابن مرشد ابن عدی ال یاروبی، عمان میں عبادیوں کے یاریبہ اماموں میں سے دسویں اور آخری، نے 1154 ہجری میں سیف ابن سلطان کی معزولی کے بعد بیعت کی، جو سیف کے ساتھ اپنی جنگوں میں زخمی ہوئے اور زخموں کی تاب نہ لاتے ہوئے 1154 ہجری میں انتقال کر گئے۔"
  tr: "Sultan III bin Murşid bin Adi el-Ya'rubi, Umman'daki İbadilerden onuncu Ya'rubi imamı ve sonuncusu, 1154 Hicri'de Saif bin Sultan tahttan indirildikten sonra ona bağlılık yemini etti, ardından Saif ile yaptığı savaşlarda yaralandı ve 1155 Hicri'nde öldü."
  id: "Sultan III bin Murshid bin Adi al-Ya'rubi, imam Ya'rubi kesepuluh dari Ibadi di Oman dan yang terakhir, disumpah setia kepadanya setelah Saif bin Sultan digulingkan pada tahun 1154 H, kemudian ia terluka dalam perang melawan Saif dan meninggal pada tahun 1155 H."
