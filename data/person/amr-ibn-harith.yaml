summary:
  ar: "شاب من قريش؛ عند البلاذري اشترى سفطي الجوهر من غنائم نهاوند من السائب بن الأقرع بأعطيات الذرية والمقاتلة فباع أحدهما بالحيرة بما اشتراهما به وفضل الآخر فكان ذلك أول لهوة مال اتخذها."
  en: "A Qurashi youth; in al-Baladhuri he bought the two jewel baskets of Nihawand's spoils for the warriors' shares, sold one at al-Hira for the price of both, and kept the other — his first capital."
  es: "Un joven Qurashi; en al-Baladhuri compró las dos cestas de joyas del botín de Nihawand a cambio de la parte que correspondía a los guerreros, vendió una en al-Hira por el precio de ambas y se quedó con la otra, que se convirtió en su primer capital."
  fr: "Un jeune Qurashi; à al-Baladhuri, il acheta les deux paniers de bijoux du butin de Nihawand pour les parts des guerriers, en vendit un à al-Hira au prix des deux, et garda l'autre — son premier capital."
