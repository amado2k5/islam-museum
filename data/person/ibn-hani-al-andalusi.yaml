summary:
  ar: "أبو القاسم محمد بن هانئ الأزدي الأندلسي الشاعر المشهور؛ ولد بإشبيلية ونشأ بها وحفظ أشعار العرب وأخبارهم واتصل بصاحب إشبيلية، واتُّهم بمذهب الفلاسفة فأشار عليه الملك بالغيبة فخرج إلى بلاد المغرب فلقي جوهراً القائد فامتدحه ثم ارتحل إلى جعفر ويحيى ابني علي بالمسيلة؛ فُشِّي خبره إلى المعز بن المنصور العبيدي فطلبه فأنعم عليه، وشيّعه إلى الديار المصرية ثم رجع ليأخذ عياله فنزل ببرقة فقُتل بها؛ وله في المعز كثير المدائح وطيّب الشعر {cite:wafayat-ayan}."
