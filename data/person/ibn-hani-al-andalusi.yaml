summary:
  ar: "أبو القاسم محمد بن هانئ الأزدي الأندلسي الشاعر المشهور؛ ولد بإشبيلية ونشأ بها وحفظ أشعار العرب وأخبارهم واتصل بصاحب إشبيلية، واتُّهم بمذهب الفلاسفة فأشار عليه الملك بالغيبة فخرج إلى بلاد المغرب فلقي جوهراً القائد فامتدحه ثم ارتحل إلى جعفر ويحيى ابني علي بالمسيلة؛ فُشِّي خبره إلى المعز بن المنصور العبيدي فطلبه فأنعم عليه، وشيّعه إلى الديار المصرية ثم رجع ليأخذ عياله فنزل ببرقة فقُتل بها؛ وله في المعز كثير المدائح وطيّب الشعر {cite:wafayat-ayan}."
  tr: "Ünlü şair Ebu el-Kasım Muhammed bin Hani el-Azdi el-Endülüs; Sevilla'da doğup büyüdü, Arapların şiirlerini ve haberlerini ezberledi ve Sevilla hükümdarıyla bağlantılıydı. Felsefi doktrinle suçlandı, ancak kral ona gizli davranışlarını bildirdi. Mağrip'e gitti ve onu öven Cevhara el-Kaid ile tanıştı. Daha sonra Cefer ve Ali'nin oğlu Yahya'ya, M'sila'ya seyahat etti. Haberi el-Mu'izz bin el-Mansur el-Ubaydi'ye bildirdi, o da onun lütfunu istedi ve Mısır'a cenaze töreni yapıldı. Ailesini almak için geri döndü, Barka'ya yerleşti ve orada öldürüldü. Ayrıca el-Mu'izz hakkında birçok övgü ve güzel şiir yazdı."
  id: "Abu al-Qasim Muhammad ibn Hani al-Azdi al-Andalusi, penyair terkenal; ia lahir dan dibesarkan di Sevilla, menghafal puisi dan berita orang Arab, serta berhubungan dengan penguasa Seville. Ia dituduh memiliki doktrin filsafat, tetapi raja menasihatinya tentang kegelapannya. Ia pergi ke Maghreb dan bertemu Jawhara al-Qa'id, yang memujinya. Ia kemudian melakukan perjalanan ke Ja'far dan Yahya, putra Ali, di M'sila. Ia melaporkan kabar itu kepada al-Mu'izz ibn al-Mansur al-Ubaydi, yang meminta perhatiannya, dan ia diberikan pemakaman ke Mesir. Ia kembali untuk membawa keluarganya, menetap di Barqa, dan dibunuh di sana. Ia juga menulis banyak pujian dan puisi indah tentang al-Mu'izz."
