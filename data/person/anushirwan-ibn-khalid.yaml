died: { edtf: "1138", hijri: "0532", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة اثنتين وثلاثين وخمسمائة {cite:wafayat-ayan}." }
summary:
  ar: "الوزير شرف الدين أبو نصر أنوشروان بن خالد بن محمد القاشاني؛ وزير الإمام المسترشد بالله؛ إليه أشار الحريري في خطبة المقامات بقوله «فأشار من إشارته هم وطاعته غم» كما يروى، وإن كان خط الحريري في نسخة كتبها بيده ينص على أنه صنفها للوزير جلال الدين عميد الدولة أبي علي الحسن بن صدقة وزير المسترشد أيضاً؛ وقف على كتاب فيه عجائب فأعجبه وأشار بضم غيره إليه {cite:wafayat-ayan}."
  en: "Sharaf al-Din Anushirwan b. Khalid al-Qashani (d. 532) — vizier of the caliph al-Mustarshid; al-Hariri addressed the dedicatee of the Maqamat in terms long read as pointing to him, though al-Hariri's own autograph names the vizier Ibn Sadaqa {cite:wafayat-ayan}."
  es: "Sharaf al-Din Anushirwan b. Khalid al-Qashani (m. 532) — visir del califa al-Mustarshid; al-Hariri se dirigió al dedicatario de las Maqamat en términos que durante mucho tiempo se interpretaron como una referencia a él, aunque el propio autógrafo de al-Hariri nombra al visir Ibn Sadaqa {cite:wafayat-ayan}."
  fr: "Sharaf al-Din Anushirwan b. Khalid al-Qashani (d. 532) — vizir du calife al-Mustarshid; al-Hariri s'est adressé au dédicataire des Maqamat en des termes longtemps interprétés comme le désignant, bien que l'autographe d'al-Hariri nomme le vizir Ibn Sadaqa {cite:wafayat-ayan}."
  ur: "شرف الدین انوشیروان بی۔ خالد القشانی ⁦(متوفی 532)⁩ - خلیفہ المسترشد کا وزیر؛ الحریری نے مقامت کے وقف کرنے والے کو لمبے لمبے الفاظ میں اس کی طرف اشارہ کرتے ہوئے مخاطب کیا، حالانکہ الحریری کے اپنے آٹوگراف میں وزیر ابن صدقہ کا نام لیا گیا ہے۔"
  tr: "İmam el-Müstarşid Billah'ın bakanı Sharafeddin Ebu Nasr Anuşirvan ibn Halid ibn Muhammed el-Kaşani; el-Hariri'nin Maqamat vaazında ona \"Böylece ona jest ve itaat gösterdi\" diyerek bahsettiği anlatımda yer almıştır. El-Harri'nin el yazısıyla yazdığı bir kopyada, bu yazıyı devletin valisi Celaleddin ve aynı zamanda el-Murşid bakanı olan Ebu Ali el-Hasan ibn Sidka için yazdığı belirtilse de; mucizeler içeren bir kitap buldu, beğendi ve ona başka kitaplar eklemeyi önerdi {atıf:wafayat-ayan}."
  id: "Menteri Sharaf al-Din Abu Nasr Anushirwan ibn Khalid ibn Muhammad al-Qashani; menteri Imam al-Mustarshid Billah; yang dirujuk al-Hariri dalam khotbah Maqamat dengan mengatakan, \"Jadi ia menunjukkan gestur dan ketaatannya kepadanya,\" seperti yang diceritakan. Meskipun tulisan tangan al-Hariri dalam salinan yang ia tulis dengan tangan menyatakan bahwa ia menulisnya untuk menteri Jalal al-Din, gubernur negara, Abu Ali al-Hasan ibn Sidqah, juga menteri al-Murshid; ia menemukan sebuah buku berisi keajaiban, menyukainya, dan menyarankan untuk menambahkan buku lain {cite:wafayat-ayan}."
