summary:
  ar: "الوزير شرف الدين أبو نصر أنوشروان بن خالد بن محمد القاشاني؛ وزير الإمام المسترشد بالله؛ إليه أشار الحريري في خطبة المقامات بقوله «فأشار من إشارته هم وطاعته غم» كما يروى، وإن كان خط الحريري في نسخة كتبها بيده ينص على أنه صنفها للوزير جلال الدين عميد الدولة أبي علي الحسن بن صدقة وزير المسترشد أيضاً؛ وقف على كتاب فيه عجائب فأعجبه وأشار بضم غيره إليه {cite:wafayat-ayan}."
  en: "Sharaf al-Din Anushirwan b. Khalid al-Qashani (d. 532) — vizier of the caliph al-Mustarshid; al-Hariri addressed the dedicatee of the Maqamat in terms long read as pointing to him, though al-Hariri's own autograph names the vizier Ibn Sadaqa {cite:wafayat-ayan}."
