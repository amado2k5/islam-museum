class: person
label: { ar: "موشائيل الأرمني", en: "Mushay'il the Armenian", es: "Mushay'il the Armenian", fr: "Mushay'il the Armenian", ur: "مشائیل آرمینیائی" }
summary:
  ar: "موشائيل الأرمني؛ رئيس أهل أرمينية حين انتقضوا في ولاية الحسن بن قحطبة الطائي بعد عزل ابن أسيد وبكّار بن مسلم العقيلي، فبعث إليه المنصور الأمداد وعليهم عامر بن إسماعيل فواقعه الحسن فقُتل وفضّت جموعه."
  en: "Mushay'il the Armenian; chief of Armenia's people when they rose in al-Hasan ibn Qahtaba al-Ta'i's governorship — after the removal of Ibn Asid and Bakkar ibn Muslim al-Uqayli — whereupon al-Mansur sent reinforcements under Amir ibn Isma'il, and al-Hasan met Mushay'il, who was killed, his hosts scattered."
  es: "Mushay'il el Armenio; jefe del pueblo de Armenia cuando se sublevaron durante el gobierno de al-Hasan ibn Qahtaba al-Ta'i —tras la destitución de Ibn Asid y Bakkar ibn Muslim al-Uqayli—, momento en el que al-Mansur envió refuerzos bajo el mando de Amir ibn Isma'il, y al-Hasan se encontró con Mushay'il, quien fue asesinado, y sus huestes se dispersaron."
  fr: "Mushay'il l'Arménien; chef du peuple arménien lorsqu'ils se soulevèrent sous le gouvernement d'al-Hasan ibn Qahtaba al-Ta'i — après la destitution d'Ibn Asid et de Bakkar ibn Muslim al-Uqayli — sur quoi al-Mansur envoya des renforts sous le commandement d'Amir ibn Isma'il, et al-Hasan rencontra Mushay'il, qui fut tué, ses troupes dispersées."
  ur: "مشائل آرمینیائی؛ آرمینیا کے لوگوں کے سربراہ جب وہ الحسن بن قحطبہ الطائی کی گورنری پر براجمان ہوئے - ابن اسید اور بکر بن مسلم العقیلی کی برطرفی کے بعد - اس کے بعد المنصور نے امیر ابن اسماعیل کے ماتحت کمک بھیجی، اور الحسن نے اس کے میزبان، مسطح سے ملاقات کی۔"
  tr: "Ermeni Moşael; Hasan ibn Kahtaba el-Tay'in valiliği sırasında, İbn Asid ve Bakkar ibn Muslim el-Aqili'nin görevden alınmasından sonra isyan eden Ermeni halkının lideri. El-Mansur ona erzak gönderdi ve onları Emir bin İsmail'e götürdü, ancak Hasan yenildi, öldürüldü ve kuvvetleri dağıldı."
  id: "Moshael si Armenia; pemimpin bangsa Armenia ketika mereka memberontak selama masa pemerintahan Hasan ibn Qahtaba al-setelah pemecatan Ibn Asid dan Bakkar ibn Muslim al-Aqili. Al-Mansur mengirimkan persediaan kepadanya dan memimpin mereka ke Amir ibn Ismail, tetapi Hasan dikalahkan, terbunuh, dan pasukannya tercerai-berai."
