  en: "Mushay'il the Armenian; chief of Armenia's people when they rose in al-Hasan ibn Qahtaba al-Ta'i's governorship — after the removal of Ibn Asid and Bakkar ibn Muslim al-Uqayli — whereupon al-Mansur sent reinforcements under Amir ibn Isma'il, and al-Hasan met Mushay'il, who was killed, his hosts scattered."
