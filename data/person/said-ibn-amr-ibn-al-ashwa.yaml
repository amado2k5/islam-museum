summary:
  ar: "سعيد بن عمرو بن الأشوع الهمداني الكوفي، القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} روى عن شريح بن هانئ، والشعبي، وأبي بردة بن أبي موسى، وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} وروى عنه الثوري، وسلمة بن كهيل، وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} قال النسائي: ليس به بأس، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} والمصدر المذكور: تهذيب التهذيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} وفي رأس الترجمة تاريخ مكتوب بصيغة «١٢٠ - ٩ هجرية»، ولم يُثبت هنا لأن الصيغة غير واضحة في المسح."
  en: "Said ibn Amr ibn al-Ashwa al-Hamdani al-Kufi, a judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} He transmitted from Shurayh ibn Hani', al-Sha'bi, Abu Burda ibn Abi Musa and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} Al-Thawri, Salama ibn Kuhayl and others transmitted from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} Al-Nasa'i said there was no harm in him, and Ibn Hibban mentioned him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} The source cited is Tahdhib al-tahdhib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17710} The date in the heading is not clear in the scan and is not stated."
