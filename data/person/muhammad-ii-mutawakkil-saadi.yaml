summary:
  ar: "ابن عبد الله الغالب السعدي؛ تولى الأمر بعد أبيه وهو يضمر الشر لعميه عبد الملك وأحمد المنصور فهربا إلى السلطان العثماني يستنجدان به. تابع خطة أبيه في مسالمة الدول المسيحية وعقد اتفاقاً تجارياً مع إنجلترا، ثم بعد أن أدخل عمه فاس بالجيش العثماني اتصل بملك البرتغال سبستيان متعاهداً على التنازل له عن جميع شواطئ المغرب مقابل طرد عمه، فأقام في سبته أربعة أشهر ثم رافق الحملة البرتغالية مع بضع مئات من الأتباع؛ ولما كتب لأهل المغرب يستنصرهم بالنصارى رد عليه علماء المغرب رسالة تفضح استعانته بالكفار على المسلمين. وغرق في نهر وادي المخازن يوم الموقعة {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  en: "Son of Abdallah al-Ghalib; he succeeded his father harbouring ill for his uncles Abd al-Malik and Ahmad al-Mansur, who fled to the Ottoman sultan for aid. Continuing his father's pro-Christian policy he signed a trade treaty with England — the single act of his short reign — then, after his uncle entered Fez with the Ottoman army, promised King Sebastian all Morocco's coasts for his expulsion; he stayed four months in Ceuta and joined the invasion with a few hundred followers. When he wrote rallying Morocco's people to the Christians, Morocco's ulema answered with a letter exposing his enlisting infidels against Muslims. He drowned in the Wadi al-Makhazin river on the day of battle {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  es: "Hijo de Abdallah al-Ghalib, sucedió a su padre albergando resentimiento hacia sus tíos Abd al-Malik y Ahmad al-Mansur, quienes huyeron al sultán otomano en busca de ayuda. Siguiendo la política procristiana de su padre, firmó un tratado comercial con Inglaterra —el único acto de su breve reinado— y, tras la entrada de su tío en Fez con el ejército otomano, prometió al rey Sebastián todas las costas de Marruecos a cambio de su expulsión. Permaneció cuatro meses en Ceuta y se unió a la invasión con unos cientos de seguidores. Cuando escribió una carta instando al pueblo marroquí a unirse a los cristianos, los ulemas de Marruecos respondieron con una carta que lo acusaba de reclutar infieles contra los musulmanes. Murió ahogado en el río Wadi al-Makhazin el día de la batalla {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  fr: "Fils d'Abdallah al-Ghalib, il succéda à son père, dissimulant des problèmes à ses oncles Abd al-Malik et Ahmad al-Mansur, qui s'enfuirent auprès du sultan ottoman pour obtenir de l'aide. Poursuivant la politique pro-chrétienne de son père, il signa un traité commercial avec l'Angleterre – le seul acte de son court règne – puis, après l'entrée de son oncle à Fès avec l'armée ottomane, promit au roi Sébastien toutes les côtes du Maroc en échange de son expulsion. Il séjourna quatre mois à Ceuta et rejoignit l'invasion avec quelques centaines d'hommes. Lorsqu'il écrivit pour rallier le peuple marocain aux chrétiens, les oulémas du Maroc lui répondirent par une lettre dénonçant son enrôlement d'infidèles contre les musulmans. Il se noya dans le Wadi al-Makhazin le jour de la bataille."
