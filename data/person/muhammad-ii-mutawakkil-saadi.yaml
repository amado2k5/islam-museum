summary:
  ar: "ابن عبد الله الغالب السعدي؛ تولى الأمر بعد أبيه وهو يضمر الشر لعميه عبد الملك وأحمد المنصور فهربا إلى السلطان العثماني يستنجدان به. تابع خطة أبيه في مسالمة الدول المسيحية وعقد اتفاقاً تجارياً مع إنجلترا، ثم بعد أن أدخل عمه فاس بالجيش العثماني اتصل بملك البرتغال سبستيان متعاهداً على التنازل له عن جميع شواطئ المغرب مقابل طرد عمه، فأقام في سبته أربعة أشهر ثم رافق الحملة البرتغالية مع بضع مئات من الأتباع؛ ولما كتب لأهل المغرب يستنصرهم بالنصارى رد عليه علماء المغرب رسالة تفضح استعانته بالكفار على المسلمين. وغرق في نهر وادي المخازن يوم الموقعة {cite:dawlat-uthmaniyya-salabi p. 258-265}."
  en: "Son of Abdallah al-Ghalib; he succeeded his father harbouring ill for his uncles Abd al-Malik and Ahmad al-Mansur, who fled to the Ottoman sultan for aid. Continuing his father's pro-Christian policy he signed a trade treaty with England — the single act of his short reign — then, after his uncle entered Fez with the Ottoman army, promised King Sebastian all Morocco's coasts for his expulsion; he stayed four months in Ceuta and joined the invasion with a few hundred followers. When he wrote rallying Morocco's people to the Christians, Morocco's ulema answered with a letter exposing his enlisting infidels against Muslims. He drowned in the Wadi al-Makhazin river on the day of battle {cite:dawlat-uthmaniyya-salabi p. 258-265}."
