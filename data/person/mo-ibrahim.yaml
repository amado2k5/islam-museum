summary:
  ar: "السير محمد فتحي أحمد إبراهيم «مو إبراهيم» ⁦(وُلد في 3 أيار 1946 في السودان)⁩ مهندس ورجل أعمال سوداني بريطاني؛ أسس شركة الاتصالات سيلتل التي غطت 14 بلدًا أفريقيًا قبل بيعها سنة 2005 بمبلغ 3.4 مليار دولار، ثم أسس مؤسسة مو إبراهيم ومؤشرها لحكم أفريقيا وجائزتها للقيادة الأفريقية، ونال وسام القديس ميخائيل والقديس جاورجيوس بدرجة قائد فارس سنة 2023."
  en: "Sir Mohammed Fathi Ahmed Ibrahim, 'Mo Ibrahim' (born 3 May 1946 in Sudan), is a Sudanese-British engineer and businessman; he founded the Celtel telecommunications company, which served 14 African countries before its sale in 2005 for $3.4 billion, then founded the Mo Ibrahim Foundation, its Index of African Governance and its Prize for Achievement in African Leadership, and was appointed KCMG in 2023."
  ur: "سر محمد فتحی احمد ابراہیم «مو ابراہیم» (پیدائش 3 مئی 1946، سوڈان) سوڈانی نژاد برطانوی انجینئر و کاروباری شخصیت ہیں؛ انھوں نے ٹیلی کام کمپنی سیلٹل قائم کی جو 2005 میں 3.4 ارب ڈالر میں فروخت ہونے سے قبل 14 افریقی ملکوں میں خدمات دے رہی تھی، پھر مو ابراہیم فاؤنڈیشن، اس کا افریقی حکمرانی اشاریہ اور افریقی قیادت کا انعام قائم کیا، اور 2023 میں کے سی ایم جی بنائے گئے۔"
