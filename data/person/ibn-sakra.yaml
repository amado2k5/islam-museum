summary:
  ar: "أبو الحسن محمد بن عبد الله بن محمد المعروف بابن سكرة الهاشمي البغدادي؛ الشاعر المشهور وهو من ولد علي بن المهدي بن أبي جعفر المنصور الخليفة العباسي؛ قال الثعالبي في ترجمته: شاعر متسع الباع في أنواع الإبداع فائق في قول الطرف والملح؛ ويقال إن ديوان ابن سكرة يقارب على خمسين ألف بيت؛ وكان يقال ببغداد إن زماناً جاد مثل ابن سكرة وابن حجاج لسخيف جداً وما سُيّئا إلا بالحريري والفرزدق في عصرهما {cite:wafayat-ayan}."
  en: "Ibn Sakra (d. 385) — the Baghdadi satirist-poet, a descendant of Ali b. al-Mahdi the Abbasid; al-Tha'alibi calls him a master of wit and lampoon; his diwan was said to reach fifty thousand verses {cite:wafayat-ayan}."
