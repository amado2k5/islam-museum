summary:
  ar: "أبو الحسن محمد بن عبد الله بن محمد المعروف بابن سكرة الهاشمي البغدادي؛ الشاعر المشهور وهو من ولد علي بن المهدي بن أبي جعفر المنصور الخليفة العباسي؛ قال الثعالبي في ترجمته: شاعر متسع الباع في أنواع الإبداع فائق في قول الطرف والملح؛ ويقال إن ديوان ابن سكرة يقارب على خمسين ألف بيت؛ وكان يقال ببغداد إن زماناً جاد مثل ابن سكرة وابن حجاج لسخيف جداً وما سُيّئا إلا بالحريري والفرزدق في عصرهما {cite:wafayat-ayan}."
  en: "Ibn Sakra (d. 385) — the Baghdadi satirist-poet, a descendant of Ali b. al-Mahdi the Abbasid; al-Tha'alibi calls him a master of wit and lampoon; his diwan was said to reach fifty thousand verses {cite:wafayat-ayan}."
  es: "Ibn Sakra (m. 385) — el poeta satírico de Bagdad, descendiente de Ali b. al-Mahdi el abasí; al-Tha'alibi lo llama un maestro del ingenio y la sátira; se decía que su diwan alcanzaba los cincuenta mil versos {cite:wafayat-ayan}."
  fr: "Ibn Sakra (mort en 385) — le poète-satirique bagdadien, descendant d'Ali b. al-Mahdi l'Abbasside; al-Tha'alibi le qualifie de maître de l'esprit et de la satire; son diwan aurait atteint cinquante mille vers {cite:wafayat-ayan}."
  ur: "ابن سکرہ ⁦(متوفی 385)⁩ - بغدادی طنزیہ شاعر، علی بن کی اولاد۔ المہدی عباسی؛ الثعلبی اسے عقل اور چراغ کا مالک کہتے ہیں۔ کہا جاتا ہے کہ اس کا دیوان پچاس ہزار آیات تک پہنچتا ہے۔"
  tr: "Ebu el-Hasan Muhammed bin Abdullah ibn Muhammed, ünlü şair olarak bilinen İbn Sukra el-Haşimi el-Bağdadi, Abbasi halifesi Ali ibn el-Mehdi ibn Ebi Ca'far el-Mansur'un soyundan gelmektedir. El-Tealibi biyografisinde şöyle demiştir: Çeşitli yaratıcı türlerde geniş uzmanlığa sahip, hitabet ve tuzda olağanüstü bir şairdir; İbn Sukra'nın diwanının yaklaşık elli bin dizel olduğu söylenir; Bağdat'ta İbn Sukra ve İbn Haccac gibi ciddi bir dönemin çok önemsiz ve kötü olmadığı, sadece kendi dönemlerinde el-Hariri ve el-Farazdaq hariçtir."
  id: "Abu al-Hasan Muhammad ibn Abdullah ibn Muhammad, yang dikenal sebagai Ibn Sukra al-Hashimi al-Baghdadi, penyair terkenal, adalah keturunan Ali ibn al-Mahdi ibn Abi Ja'far al-Mansur, khalifah Abbasiyah. Al-Tha'alibi berkata dalam biografinya: Seorang penyair dengan keahlian luas dalam berbagai genre kreatif, luar biasa dalam kefasihan dan kehalusan; dikatakan bahwa diwan Ibn Sukra hampir lima puluh ribu bait; dikatakan di Baghdad bahwa era serius seperti Ibn Sukra dan Ibn Hajjaj sangat sepele dan tidak buruk kecuali bagi al-Hariri dan al-Farazdaq pada masa mereka."
