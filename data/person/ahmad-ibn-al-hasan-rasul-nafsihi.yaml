summary:
  ar: "أبو الحسن الكوفي يعرف برسول نفسه، حدّث عن ابن عيينة وغيره؛ قال الدارقطني هو متروك الحديث وقال ابن حبان يضع الحديث على الثقات؛ توفي بمصر سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 120}."
  en: "Abu'l-Hasan of Kufa nicknamed 'Rasul Nafsihi', a transmitter from Ibn 'Uyayna whom al-Daraqutni abandoned and Ibn Hibban accused of fabricating onto reliable authorities; he died in Egypt in 262 {cite:muntazam-ibn-al-jawzi p. 120}."
  fr: "Abu'l-Hasan de Kufa, surnommé « Rasul Nafsihi », transmetteur d'Ibn 'Uyayna délaissé par al-Daraqutni et accusé par Ibn Hibban de fabrication attribuée à des autorités fiables ; mort en Égypte en 262 H {cite:muntazam-ibn-al-jawzi p. 120}."
  es: "Abu'l-Hasan de Kufa, apodado 'Rasul Nafsihi', un transmisor de Ibn 'Uyayna a quien al-Daraqutni abandonó e Ibn Hibban acusó de inventarse autoridades confiables; Murió en Egipto en 262 {cita:muntazam-ibn-al-jawzi p. 120}."
  ur: "کوفہ کے ابو الحسن کو 'رسول نفسی' کا نام دیا گیا، ابن عیینہ کا ایک ٹرانسمیٹر جسے الدارقطنی نے ترک کر دیا اور ابن حبان نے معتبر حکام پر من گھڑت الزام لگایا۔ ان کی وفات مصر میں 262 میں ہوئی۔ 120}۔"
  tr: "Ebu el-Hasan el-Kufi, kendi kendini peygamber olarak tanıtır. İbn Uyaynah ve diğerlerinden rivayet etmiştir. El-Daraqutni onun hadis râvisi olduğunu, İbn Hibban ise güvenilir kişilerden hadis uydurduğunu söylemiştir. 262 yılında Mısır'da vefat etmiştir. {cite:muntazam-ibn-al-jawzi s. 120}"
  id: "Abu al-Hasan al-Kufi dikenal sebagai Rasul dari dirinya sendiri. Ia meriwayatkan hadits berdasarkan riwayat Ibnu Uyaynah dan lainnya. Al-Daraqutni mengatakan bahwa ia adalah perawi hadits, dan Ibnu Hibban mengatakan bahwa ia memalsukan hadits berdasarkan riwayat orang-orang yang terpercaya. Ia wafat di Mesir pada tahun 262. {cite:muntazam-ibn-al-jawzi p. 120}."
