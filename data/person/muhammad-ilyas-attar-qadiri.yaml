  ar: "داعية باكستاني برلوي، وُلد في 12 يوليو 1950 في كراتشي. أسس حركة دعوة إسلامي ⁦(دعوت إسلامي)⁩ سنة 1981، فصارت من كبرى الحركات الدعوية البرلوية في العالم بجماعاتها المتنقلة ⁦(مدني قافلة)⁩ وقناة مدني التلفزيونية؛ من مؤلفاته «فيضانِ سنت»."
  en: "Pakistani Barelvi preacher, born in Karachi on 12 July 1950. He founded the Dawat-e-Islami missionary movement in 1981, which grew into one of the largest Barelvi dawah movements in the world with its travelling Madani Qafila groups and Madani Channel television; his books include Faizan-e-Sunnat."
  ur: "پاکستانی بریلوی مبلغ، 12 جولائی 1950 کو کراچی میں پیدا ہوئے۔ انھوں نے 1981 میں دعوتِ اسلامی مشنری تحریک کی بنیاد رکھی جو سفری مدنی قافلوں اور مدنی چینل کے ساتھ دنیا کی بڑی بریلوی دعوتی تحریکوں میں شامل ہوئی؛ ان کی تصانیف میں «فیضانِ سنت» شامل ہے۔"
