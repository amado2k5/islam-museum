summary:
  ar: "مغنية ومقدمة برامج ماليزية سابقة تحوّلت إلى العمل الدعوي والإنساني، وُلدت باسم شزرينا بنت أزمان في كوالالمبور في 1 يوليو 1980. شاركت في تأسيس قناة دوبس تي في ⁦(Dopstv)⁩ للحياة الإسلامية سنة 2016، وطوّرت تطبيق قلبِي ⁦(QalbyApp)⁩، وترأس مؤسسة من قلبي ⁦(Min Qalby Foundation)⁩ الإنسانية. بلغ حسابها على منصة إكس 326,000 متابع بحسب مرآة ملفات Instalker التي زُحفت نحو 13 نوفمبر 2026."
  en: "Malaysian former singer and television host turned dawah and humanitarian figure, born Shazrina binti Azman in Kuala Lumpur on 1 July 1980. She co-founded the Islamic lifestyle channel Dopstv in 2016, developed the QalbyApp, and chairs the Min Qalby Foundation. Her X account counted 326,000 followers by the Instalker profile mirror crawled about 13 November 2026."
  ur: "مالیسیائی سابق گلوکارہ اور ٹیلی ویژن میزبان جو دعوت اور انسانی خدمت کی طرف متوجہ ہوئیں؛ یکم جولائی 1980ء کو کوالالمپور میں شزرينا بنت أزمان کے نام سے پیدا ہوئیں۔ انہوں نے 2016ء میں اسلامی طرزِ زندگی کے چینل Dopstv کی بنیاد رکھنے میں حصہ لیا، QalbyApp تیار کیا، اور Min Qalby Foundation کی سربراہ ہیں۔ ان کے ایکس اکاؤنٹ کے فالوور تقریباً 13 نومبر 2026ء کو کرال کی گئی Instalker مرر کے مطابق 326,000 تھے۔"
  es: "Shazrina binti Azman, ex cantante y presentadora de televisión malasia convertida en activista y figura humanitaria, nació en Kuala Lumpur el 1 de julio de 1980. Cofundó el canal de estilo de vida islámico Dopstv en 2016, desarrolló la aplicación QalbyApp y preside la Fundación Min Qalby. Su cuenta X contaba con 326 000 seguidores, según un análisis del perfil de Instalker realizado alrededor del 13 de noviembre de 2026."
  fr: "Ancienne chanteuse et animatrice de télévision malaisienne devenue figure de la da'wa et de l'humanitaire, Shazrina binti Azman est née à Kuala Lumpur le 1er juillet 1980. Elle a cofondé la chaîne de télévision islamique Dopstv en 2016, développé l'application QalbyApp et préside la Fondation Min Qalby. Son compte X comptait 326 000 abonnés selon un miroir de profil Instalker consulté aux alentours du 13 novembre 2026."
  tr: "Savunuculuk ve insani yardım çalışmalarına yönelen eski Malezyalı şarkıcı ve TV sunucusu olan Sher, 1 Temmuz 1980'de Kuala Lumpur'da Shazrina bint Azman olarak doğdu. 2016'da Dopstv'yi İslami Yaşam için kurdu, Qalby Uygulamasını geliştirdi ve insani yardım vakfı Min Qalby Vakfı'nın başkanlığını yaptı. X platformundaki hesabı, 13 Kasım 2026 civarında erişilen Instalker Profile Mirror'a göre 326.000 takipçiye ulaştı."
  id: "Mantan penyanyi dan pembawa acara TV Malaysia yang beralih ke advokasi dan pekerjaan kemanusiaan, ia lahir dengan nama Shazrina bint Azman di Kuala Lumpur pada 1 Juli 1980. Ia ikut mendirikan Dopstv for Islamic Life pada tahun 2016, mengembangkan aplikasi Qalby, dan memimpin yayasan kemanusiaan Min Qalby Foundation. Akunnya di platform X mencapai 326.000 pengikut menurut Installerker Profile Mirror, yang diakses sekitar 13 November 2026."
