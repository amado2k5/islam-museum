summary:
  ar: "داعية بريطاني وصانع محتوى على يوتيوب، من أصول كردية تركية، اشتهر منذ سنة 2013 بمناظراته وحواراته في ركن الخطباء بهايد بارك في لندن. وبحسب ما يرويه عن نفسه اعتنق الإسلام سنة 2012، وهو من مؤسسي «مبادرة سلام» لتعليم الصلاة."
  en: "British Muslim YouTuber and street preacher of Kurdish-Turkish background, known since 2013 for his debates and conversations at Speakers' Corner in London's Hyde Park. By his own account he embraced Islam in 2012, and he is a co-founder of the Salam Initiative for teaching prayer."
  fr: "YouTuber musulman britannique et prédicateur de rue d'origine kurde-turque, connu depuis 2013 pour ses débats et conversations au Speakers' Corner à Hyde Park à Londres. De son propre aveu, il a embrassé l’islam en 2012 et est co-fondateur de l’Initiative Salam pour l’enseignement de la prière."
  ur: "کرد ترک پس منظر کے برطانوی مسلمان یوٹیوبر اور اسٹریٹ مبلغ، جو 2013 سے لندن کے ہائیڈ پارک کے اسپیکرز کارنر میں اپنے مباحثوں اور گفتگوؤں کے لیے جانے جاتے ہیں۔ اپنے بیان کے مطابق انہوں نے 2012 میں اسلام قبول کیا، اور وہ نماز سکھانے کی «سلام انیشی ایٹو» کے شریک بانی ہیں۔"
  es: "YouTuber y predicador callejero británico musulmán de origen kurdo-turco, conocido desde 2013 por sus debates y conversaciones en Speakers' Corner, en Hyde Park, Londres. Según su propio relato, se convirtió al islam en 2012 y es cofundador de la Iniciativa Salam, dedicada a la enseñanza de la oración."
