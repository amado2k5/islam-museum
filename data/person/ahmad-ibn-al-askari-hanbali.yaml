summary:
  ar: "شهاب الدين أحمد بن العسكري الصالحي الدمشقي الحنبلي مفتي الحنابلة بها؛ كان صالحاً ديناً زاهداً مباركاً يكتب على الفتاوى كتابة عنائية، ولم يكن له في زمانه نظير في العلم والتواضع والتقشف على طريقة السلف، منقطعاً عن الناس قليل المخالطة لهم؛ ألّف كتاباً في الفقه جمع فيه بين المقنع والتنقيح، مات قبل تمامه في ذي الحجة سنة اثنتي عشرة وتسعمائة {cite:shadharat-dhahab p. 465-466}."
  en: "Damascus's Hanbali mufti — 'no peer in his age for learning, humility and Salafi-style austerity', a recluse who annotated fatwas; his fiqh book combining al-Muqni' and al-Tanqih was unfinished when he died in Dhu'l-Hijja 912 {cite:shadharat-dhahab p. 465-466}."
