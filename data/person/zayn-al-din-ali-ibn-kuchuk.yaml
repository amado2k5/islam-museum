summary:
  ar: "زين الدين علي بن كوجك بن بكتكين التركماني الفارس المشهور صاحب أربل؛ لقب بكوجك وهو بالعربية اللطيف القد القصير وكان مع ذلك معروفاً بالقوة المفرطة والشهامة، خرج على المقتفي فعصاه ثم حفظ طاعته، وكان جواداً معطاء فيه عدل وحسن سيرة؛ يقال إنه تجاوز المائة وتوفي في ذي الحجة سنة ثلاث وستين وخمسمائة {cite:shadharat-dhahab p. 689}."
  en: "Zayn al-Din Ali ibn Kuchuk ibn Baktakin the Turkmen, lord of Arbil; nicknamed Kuchuk — 'the small and short' — yet famed for surpassing strength and chivalry; he rebelled against al-Muqtafi then kept his allegiance; generous, just and well-conducted, said to have passed a hundred years; d. Dhu al-Hijja 563 {cite:shadharat-dhahab p. 689}."
