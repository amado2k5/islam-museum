summary:
  ar: "طبيب من أسرة بختيشوع الطبية في العصر العباسي، كان قريبا من الخليفة المهتدي، وخلّف ولده عبيد الله. ويكنى أبا جبريل وهو ابن جبريل معروف مشهور متقدم عند الملوك خدم الرشيد والأمين والمأمون والمعتصم والواثق والمتوكل وكسب بالطب ما لم يكسبه مثله وكانت الخلفاء تثق به على أمهات أولادها وله كتاب التذكرة عمله لابنه جبريل {cite:fihrist-ibn-al-nadim p. 413} وعند ابن الجوزي كان من أطباء المقتدر بالله {cite:muntazam-ibn-al-jawzi p. 360}."
  en: "A physician of the Bukhtishu medical family in the Abbasid period, close to the caliph al-Muhtadi. He was succeeded by his son Ubayd Allah."
  es: "Médico perteneciente a la familia médica Bukhtishu durante el período abasí, cercano al califa al-Muhtadi. Fue sucedido por su hijo Ubayd Allah."
  fr: "Médecin de la famille Bukhtishu, il exerça à l'époque abbasside, proche du calife al-Muhtadi. Son fils, Ubayd Allah, lui succéda."
  ur: "عباسی دور میں بختیشو طبی خاندان کا ایک معالج، خلیفہ المحتدی کے قریب۔ ان کے بعد ان کا بیٹا عبید اللہ بن گیا۔"
  tr: "Abbasi döneminde Bakhtishu tıbbi ailesinden bir hekim olan Abbâsi, Halife al-Muhtadi'ye yakındı ve oğlu Ubayd Allah'ın yerine geçti. Cibril'in oğlu Ebu Cibril olarak biliniyordu; krallar arasında tanınmış ve erken dönem bir kral olup, el-Reşid, el-Emin, el-Me'mun, el-Mu'tasim, el-Vateşik ve el-Mutawakkil'e hizmet etti. Tıpta hiç ulaşamadığı bir şeyi kazandı ve halifeler ona çocuklarının annelerinden daha çok güvendiler. Oğlu Cibril için yazdığı el-Tadhkirah kitabını yazdı {atıf:fihrist-ibn-al-nadim s. 413} ve İbn el-Cevzi döneminde el-Muqtadir Billah'ın hekimlerinden biri oldu {atıf:Muntazam-ibn-al-jawzi s. 360}."
  id: "Sebagai seorang dokter dari keluarga medis Bakhtishu pada era Abbasiyah, ia dekat dengan Khalifah al-Muhtadi dan menggantikan putranya Ubayd Allah. Ia dikenal sebagai Abu Jibril, putra Jibril, terkenal dan awal di antara raja-raja, melayani al-Rashid, al-Amin, al-Ma'mun, al-Mu'tasim, al-Wathiq, dan al-Mutawakkil. Ia memperoleh dalam bidang kedokteran apa yang belum pernah ia capai, dan para khalifah mempercayainya daripada ibu dari anak-anak mereka. Ia menulis buku al-Tadhkirah, yang ia buat untuk putranya Jibril {cite:fihrist-ibn-al-nadim hlm. 413}, dan di bawah Ibn al-Jawzi, ia adalah salah satu dokter al-Muqtadir Billah {cite:Muntazam-ibn-al-jawzi hlm. 360}."
