summary:
  ar: "طبيب من أسرة بختيشوع الطبية في العصر العباسي، كان قريبا من الخليفة المهتدي، وخلّف ولده عبيد الله. ويكنى أبا جبريل وهو ابن جبريل معروف مشهور متقدم عند الملوك خدم الرشيد والأمين والمأمون والمعتصم والواثق والمتوكل وكسب بالطب ما لم يكسبه مثله وكانت الخلفاء تثق به على أمهات أولادها وله كتاب التذكرة عمله لابنه جبريل {cite:fihrist-ibn-al-nadim p. 413} وعند ابن الجوزي كان من أطباء المقتدر بالله {cite:muntazam-ibn-al-jawzi p. 360}."
  en: "A physician of the Bukhtishu medical family in the Abbasid period, close to the caliph al-Muhtadi. He was succeeded by his son Ubayd Allah."
