id: person/chaghatay-ibn-genghis
class: person
label:
  ar: جفتاي بن جنكزخان
  en: Chaghatay ibn Genghis Khan
  es: "Chaghatay ibn Genghis Khan"
  fr: "Chaghatay ibn Genghis Khan"
  ur: "چغتائی ابن چنگیز خان"
summary:
  ar: "جفتاي بن جنكزخان، وهو عندهم كداي؛ عين له أبوه من الممالك ما بين الأيقور إلى سمرقند وبخارى وما وراء النهر، ومات دون استيفاء أمره فولى أولاده عمهم منكوفان على ما وراء النهر إمضاء لوصية جنكزخان لأبيهم، واستقر الملك في أعقابه بسمرقند وأعمالها."
  en: "Chaghatay ibn Genghis Khan, called Kaday among them; his father assigned him the realms from the Uyghur lands to Samarkand, Bukhara and Transoxiana — he died without completing his course, and Monke set his sons over Transoxiana in fulfilment of Genghis's bequest to their father, their line settling at Samarkand and its districts."
  es: "Chaghatay ibn Genghis Khan, llamado Kaday entre ellos, recibió de su padre los territorios que abarcaban desde las tierras uigures hasta Samarcanda, Bujará y Transoxiana. Murió sin completar su cometido, y Monke puso a sus hijos al frente de Transoxiana en cumplimiento del legado que Genghis había dejado a su padre, estableciéndose su descendencia en Samarcanda y sus distritos."
  fr: "Chaghatay ibn Genghis Khan, appelé Kaday parmi eux; son père lui avait attribué les royaumes allant des terres ouïghoures à Samarcande, Boukhara et la Transoxiane — il mourut sans avoir achevé sa mission, et Monke plaça ses fils à la tête de la Transoxiane en accomplissement du legs de Genghis à leur père, leur lignée s'établissant à Samarcande et dans ses districts."
  ur: "چغتائی ابن چنگیز خان، ان میں کدے کہلاتا ہے۔ اس کے والد نے اسے اویغور کی سرزمین سے سمرقند، بخارا اور ٹرانسکسیانا کے علاقے تفویض کیے - وہ اپنا کورس مکمل کیے بغیر انتقال کر گئے، اور مونک نے چنگیز کی اپنے والد کو دی گئی وصیت کی تکمیل میں اپنے بیٹوں کو ٹرانسکسیانا پر مقرر کیا، ان کا سلسلہ سمرقند اور اس کے اضلاع میں آباد تھا۔"
  tr: "Kaday olarak bilinen Jaftay ibn Cengiz Han, babası tarafından Aykur'dan Semerkand'a, Buhara'ya ve Transoksiana'ya kadar olan krallıklardan atandı. Emirlerini yerine getirmeden öldü, bu yüzden amcasının oğulları, Cengiz Hazhan'ın babalarına verdiği vasiyetin bir imzası olarak Monkwan Transoksiana'ya atandı. Kral, Semerkand'a ve onun ardından işlerine yerleşti."
  id: "Jaftay ibn Genghazkhan, yang dikenal oleh mereka sebagai Kaday, diangkat oleh ayahnya dari kerajaan antara Aykur hingga Samarkand, Bukhara, dan Transoxiana. Ia meninggal tanpa memenuhi perintahnya, sehingga putra-putra pamannya diangkat ke Monkwan Transoxiana sebagai tanda tangan wasiat Genghazkhan kepada ayah mereka. Raja menetap di Samarkand dan urusannya setelahnya."
