  en: Chaghatay ibn Genghis Khan
summary:
  ar: "جفتاي بن جنكزخان، وهو عندهم كداي؛ عين له أبوه من الممالك ما بين الأيقور إلى سمرقند وبخارى وما وراء النهر، ومات دون استيفاء أمره فولى أولاده عمهم منكوفان على ما وراء النهر إمضاء لوصية جنكزخان لأبيهم، واستقر الملك في أعقابه بسمرقند وأعمالها."
  en: "Chaghatay ibn Genghis Khan, called Kaday among them; his father assigned him the realms from the Uyghur lands to Samarkand, Bukhara and Transoxiana — he died without completing his course, and Monke set his sons over Transoxiana in fulfilment of Genghis's bequest to their father, their line settling at Samarkand and its districts."
