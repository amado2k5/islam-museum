summary:
  ar: "فيزيائية نظرية وكاتبة باكستانية، وهي أول باكستانية تعمل في نظرية الأوتار. تعلمت في كلية كينايرد وجامعة القائد الأعظم، ونالت دبلوم المركز الدولي للفيزياء النظرية في ترييستي ودكتوراه جامعة ستوكهولم سنة 2003، وعملت باحثة ما بعد الدكتوراه في هارفارد، ثم صارت عضوا مؤسسا في قسم الفيزياء بجامعة لاهور للعلوم الإدارية. صدرت روايتها «الخيوط الأطول فقط» سنة 2014."
  en: "Pakistani theoretical physicist and writer, the first Pakistani woman to work in string theory. Educated at Kinnaird College and Quaid-i-Azam University, she took a diploma at the ICTP in Trieste and a PhD at Stockholm University in 2003, held a postdoctoral post at Harvard, and became a founding faculty member of the physics department at the Lahore University of Management Sciences. Her novel Only the Longest Threads appeared in 2014."
  ur: "پاکستانی نظریاتی طبیعیات دان اور ادیبہ، جو سٹرنگ تھیوری پر کام کرنے والی پہلی پاکستانی خاتون ہیں۔ انہوں نے کنیئرڈ کالج اور قائد اعظم یونیورسٹی سے تعلیم حاصل کی، ٹریسٹے کے بین الاقوامی مرکز برائے نظریاتی طبیعیات سے ڈپلومہ اور 2003ء میں اسٹاک ہوم یونیورسٹی سے پی ایچ ڈی کی، ہارورڈ میں پوسٹ ڈاکٹریٹ رہیں، اور پھر لاہور یونیورسٹی آف مینجمنٹ سائنسز کے شعبۂ طبیعیات کی بانی رکن بنیں۔ ان کا ناول «Only the Longest Threads» 2014ء میں شائع ہوا۔"
  es: "Física teórica y escritora pakistaní, la primera mujer pakistaní en trabajar en la teoría de cuerdas. Estudió en el Kinnaird College y en la Universidad Quaid-i-Azam, obtuvo un diploma en el ICTP de Trieste y un doctorado en la Universidad de Estocolmo en 2003. Posteriormente, realizó una estancia postdoctoral en Harvard y fue miembro fundadora del departamento de física de la Universidad de Ciencias de la Gestión de Lahore. Su novela «Only the Longest Threads» se publicó en 2014."
  fr: "Physicienne théoricienne et écrivaine pakistanaise, elle est la première femme pakistanaise à travailler sur la théorie des cordes. Formée au Kinnaird College et à l'Université Quaid-i-Azam, elle a obtenu un diplôme de l'ICTP de Trieste et un doctorat de l'Université de Stockholm en 2003. Après un postdoctorat à Harvard, elle est devenue membre fondatrice du département de physique de l'Université des sciences de gestion de Lahore. Son roman, « Only the Longest Threads », est paru en 2014."
  tr: "Teorik fizikçi ve Pakistanlı yazar olan Sicim teorisi alanında çalışan ilk Pakistanlı oldu. Kinnaird Koleji ve Quaid-e-Azam Üniversitesi'nde eğitim gördü, Trieste'deki Uluslararası Teorik Fizik Merkezi'nden diploma ve 2003'te Stockholm Üniversitesi'nden doktora aldı, Harvard'da doktora sonrası araştırmacı olarak çalıştı ve daha sonra Lahor İdari Bilimler Üniversitesi Fizik Bölümü'nün kurucu üyelerinden biri oldu. \"Only the Longest Threads\" adlı romanı 2014 yılında yayımlandı."
  id: "Sebagai fisikawan teoretis dan penulis Pakistan, ia adalah orang Pakistan pertama yang bekerja di bidang teori string. Ia belajar di Kinnaird College dan Quaid-e-Azam University, meraih diploma dari International Center for Theoretical Physics di Trieste serta PhD dari Stockholm University pada tahun 2003, bekerja sebagai peneliti postdoktoral di Harvard, dan kemudian menjadi anggota pendiri Departemen Fisika di Lahore University of Administrative Sciences. Novelnya \"Only the Longest Threads\" diterbitkan pada tahun 2014."
