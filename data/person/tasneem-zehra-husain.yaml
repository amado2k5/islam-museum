summary:
  ar: "فيزيائية نظرية وكاتبة باكستانية، وهي أول باكستانية تعمل في نظرية الأوتار. تعلمت في كلية كينايرد وجامعة القائد الأعظم، ونالت دبلوم المركز الدولي للفيزياء النظرية في ترييستي ودكتوراه جامعة ستوكهولم سنة 2003، وعملت باحثة ما بعد الدكتوراه في هارفارد، ثم صارت عضوا مؤسسا في قسم الفيزياء بجامعة لاهور للعلوم الإدارية. صدرت روايتها «الخيوط الأطول فقط» سنة 2014."
  en: "Pakistani theoretical physicist and writer, the first Pakistani woman to work in string theory. Educated at Kinnaird College and Quaid-i-Azam University, she took a diploma at the ICTP in Trieste and a PhD at Stockholm University in 2003, held a postdoctoral post at Harvard, and became a founding faculty member of the physics department at the Lahore University of Management Sciences. Her novel Only the Longest Threads appeared in 2014."
  ur: "پاکستانی نظریاتی طبیعیات دان اور ادیبہ، جو سٹرنگ تھیوری پر کام کرنے والی پہلی پاکستانی خاتون ہیں۔ انہوں نے کنیئرڈ کالج اور قائد اعظم یونیورسٹی سے تعلیم حاصل کی، ٹریسٹے کے بین الاقوامی مرکز برائے نظریاتی طبیعیات سے ڈپلومہ اور 2003ء میں اسٹاک ہوم یونیورسٹی سے پی ایچ ڈی کی، ہارورڈ میں پوسٹ ڈاکٹریٹ رہیں، اور پھر لاہور یونیورسٹی آف مینجمنٹ سائنسز کے شعبۂ طبیعیات کی بانی رکن بنیں۔ ان کا ناول «Only the Longest Threads» 2014ء میں شائع ہوا۔"
