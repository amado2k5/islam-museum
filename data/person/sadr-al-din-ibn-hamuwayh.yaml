summary:
  ar: "صدر الدين أبو الحسن محمد بن عمر بن حمويه الجويني شيخ الشيوخ بمصر والشام، فقيه فاضل وصوفي صالح من بيت كبير من خراسان؛ توفي سنة سبع عشرة وستمائة بالموصل وقد وردها رسولاً، يقول ابن الأثير: كان نعم الرجل {cite:kamil-ibn-al-athir p. 399}."
  en: "Sadr al-Din ibn Hamuwayh — Shaykh al-Shuyukh of Egypt and Syria, 'an excellent faqih and a righteous Sufi of a great Khurasani house'; died at Mosul in 617 having come as a messenger {cite:kamil-ibn-al-athir p. 399}."
  es: "Sadr al-Din ibn Hamuwayh — Shaykh al-Shuyukh de Egipto y Siria, 'un excelente faqih y un sufí justo de una gran casa de Jorasán'; murió en Mosul en 617 habiendo llegado como mensajero {cite:kamil-ibn-al-athir p. 399}."
  fr: "Sadr al-Din ibn Hamuwayh — Cheikh al-Shuyukh d'Égypte et de Syrie, « un excellent faqih et un soufi vertueux d'une grande maison khurasani »; mort à Mossoul en 617 après être venu comme messager {cite: kamil-ibn-al-athir p. 399}."
  ur: "صدرالدین ابن حمویہ - مصر اور شام کے شیخ الشیوخ، 'ایک بہترین فقیہ اور ایک عظیم خراسانی گھرانے کا صالح صوفی'؛ 617 میں موصل میں ایک رسول کی حیثیت سے وفات پائی۔ 399}۔"
