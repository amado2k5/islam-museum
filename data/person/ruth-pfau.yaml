summary:
  ar: "روث كاثرينا مارثا بفاو (9 سبتمبر 1929 – 10 أغسطس 2017) طبيبة ألمانية باكستانية وراهبة كاثوليكية في جمعية بنات قلب مريم، وُلدت في لايبزيغ واعتنقت الكاثوليكية الرومانية سنة 1953 وانضمت إلى الجمعية سنة 1957، فأقامت في كراتشي منذ 1960 وأسست مركز ماري أدلايد للجذام وبنت برنامج باكستان الوطني لمكافحة الجذام حتى أعلنت منظمة الصحة العالمية سنة 1996 أن باكستان من أوائل دول آسيا في السيطرة على المرض، ونالت الجنسية الباكستانية وجنازة رسمية عند وفاتها."
  en: "Ruth Katherina Martha Pfau (9 September 1929 – 10 August 2017) was a German–Pakistani physician and Roman Catholic religious sister of the Society of the Daughters of the Heart of Mary, born at Leipzig, who converted to Roman Catholicism in 1953, joined the society in 1957, settled in Karachi in 1960, founded the Marie Adelaide Leprosy Centre and built Pakistan's national leprosy-control programme until the World Health Organization declared Pakistan in 1996 one of the first Asian countries to have controlled leprosy; she received Pakistani citizenship and a state funeral."
  ur: "رتھ کیتھرینا مارتھا فاؤ (9 ستمبر 1929ء – 10 اگست 2017ء) جرمن نژاد پاکستانی طبیبہ اور سوسائیٹی آف دی ڈاٹرز آف دی ہارٹ آف میری کی کیتھولک راہبہ تھیں، لائپزگ میں پیدا ہوئیں، 1953ء میں رومن کیتھولک مذہب قبول کیا، 1957ء میں سوسائیٹی میں شامل ہوئیں، 1960ء میں کراچی آئیں، میری ایڈیلیڈ لیپروسی سینٹر قائم کیا اور پاکستان کا قومی انسدادِ جذام پروگرام بنایا حتیٰ کہ 1996ء میں عالمی ادارہ صحت نے پاکستان کو ایشیا کے ان اولین ممالک میں شمار کیا جنھوں نے جذام پر قابو پایا؛ انھیں پاکستانی شہریت اور سرکاری اعزاز کے ساتھ جنازہ ملا۔"
