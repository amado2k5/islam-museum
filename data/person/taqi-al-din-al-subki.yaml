summary:
  ar: "شيخ الإسلام تقي الدين علي بن عبد الكافي السبكي (٦٨٣–٧٥٦هـ/١٢٨٤–١٣٥٥م)، فقيه شافعي ومحدّث ومتكلم؛ سمع الحديث بمصر في شبيبته ورحل إلى دمشق وحج، ودرّس بالمنصورية وباشر مشيخة دار الحديث الظاهرية بالقاهرة، ثم ولي قضاء قضاة دمشق نحو سبع عشرة سنة وباشر مشيخة الأشرفية والنورية، حتى نزل عن القضاء لولده تاج الدين ورحل إلى مصر فتوفي بها {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745} {cite:al-bidaya-wal-nihaya s.a. 756 pp. 263-264}."
  en: "Shaykh al-Islam Taqi al-Din Ali ibn Abd al-Kafi al-Subki (683–756/1284–1355), Shafi'i jurist, muhaddith and theologian; he heard hadith in Egypt in his youth, journeyed to Damascus and made the hajj, taught at the Mansuriyya and headed the Zahiriyya hadith school in Cairo, then served as chief qadi of Damascus for about seventeen years, holding the shaykhhood of the Ashrafiyya and Nuriyya, until he ceded the bench to his son Taj al-Din and died in Egypt {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745} {cite:al-bidaya-wal-nihaya s.a. 756 pp. 263-264}."
  ur: "شیخ الاسلام تقی الدین علی بن عبد الکافی سبکی (683–756ھ/1284–1355ء)، شافعی فقیہ، محدث اور متکلم؛ جوانی میں مصر میں حدیث سنی، دمشق گئے اور حج کیا، قاہرہ میں منصوریہ میں تدریس اور دار الحدیث ظاہریہ کی شیخت کی، پھر تقریباً سترہ برس دمشق کے قاضی القضاة رہے اور اشرفیہ و نوریہ کی شیخت سنبھالی، یہاں تک کہ بیٹے تاج الدین کو منصب سونپ کر مصر گئے اور وہاں وفات پائی {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745} {cite:al-bidaya-wal-nihaya s.a. 756 pp. 263-264}۔"
