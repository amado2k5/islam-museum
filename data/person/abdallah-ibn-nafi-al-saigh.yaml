summary:
  ar: عبد الله بن نافع الصائغ، من موالي بني مخزوم، من كبار فقهاء المدينة وصاحب مالك الذي خلفه في مجلسه بعد ابن كنانة؛ روى عنه سحنون والزبير بن بكار وغيرهما، وتوفي في رمضان سنة ٢٠٦هـ بحسب ابن سعد والذهبي.
  en: Abd Allah ibn Nafi' al-Sa'igh, a client of Banu Makhzum, one of the great jurists of Medina and the companion of Malik who succeeded him in his circle after Ibn Kinana; Sahnun, al-Zubayr ibn Bakkar and others narrated from him, and he died in Ramadan 206 AH according to Ibn Sa'd and al-Dhahabi.
