summary:
  ar: "برهان الدين أبو الحسن علي بن أبي بكر المرغيناني (511-593هـ)، فقيه حنفي من مرغينان في فرغانة بما وراء النهر، صاحب «بداية المبتدي» وشرحيه «كفاية المنتهي» و«الهداية»، و«التجنيس والمزيد» وغيرها. تفقّه على أبيه وعلى الصدر الشهيد ابن مازة ونجم الدين عمر النسفي وغيرهم، وحج سنة 544هـ، وتوفي سنة 593هـ ودُفن في سمرقند قرب تربة المحمّدين. {cite:hidaya-bakdash-v1 p.16} {cite:hidaya-bakdash-v1 p.17} {cite:hidaya-bakdash-v1 p.22} {cite:hidaya-bakdash-v1 p.23} {cite:hidaya-bakdash-v1 p.24}"
  en: "Burhan al-Din Abu al-Hasan Ali ibn Abi Bakr al-Marghinani (511-593 AH), a Hanafi jurist from Marghinan in Farghana, Transoxiana, author of Bidayat al-Mubtadi and its two commentaries Kifayat al-Muntahi and al-Hidaya, of al-Tajnis wa-l-Mazid and other works. He studied with his father, with al-Sadr al-Shahid Ibn Maza, Najm al-Din Umar al-Nasafi and others, made the pilgrimage in 544 AH, and died in 593 AH; he was buried in Samarqand near the Turbat al-Muhammadin."
  ur: "برہان الدین ابو الحسن علی بن ابی بکر مرغینانی (511-593ھ)، ماوراء النہر کے علاقے فرغانہ کے شہر مرغینان کے حنفی فقیہ، «بدایۃ المبتدی» اور اس کی دو شرحوں «کفایۃ المنتہی» اور «الہدایہ»، اور «التجنیس و المزید» وغیرہ کے مصنف۔ انہوں نے اپنے والد، صدر شہید ابن مازہ، نجم الدین عمر نسفی اور دوسروں سے فقہ حاصل کی، 544ھ میں حج کیا، 593ھ میں وفات پائی اور سمرقند میں تربۃ المحمدین کے قریب دفن ہوئے۔"
