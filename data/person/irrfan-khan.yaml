    note: "No source names a school for him, and he left no profession of unbelief. What is documented is an insider's criticism of ritual practice: during the promotion of Madaari at Jaipur in July 2016 he questioned the meaning of Qurbani, said that rather than fasting during Ramzan people should self-introspect, and that Muslims had made a mockery of Muharram; days later he argued on television that he needed no mediators between himself and God. Remarks about ritual practice never count as a faith settlement in this lane, and the clerics who denounced the remarks were policing practice, not recording his belief. His birth into a Muslim Pashtun family of Tonk is background. Wikidata gives only Islam."
