summary:
  ar: "ممثل هندي (1967–2020) وُلد في تونك باسم صاحب زاده عرفان علي خان، تدرّب في المدرسة الوطنية للدراما (1984)، وبرز عالمياً بأعمال مثل «المحارب» (2001) و«مليونير العشوائيات» و«حياة باي» و«صندوق الغداء»، ونال بادما شري (2011)، وتوفي في مومباي سنة 2020."
  en: "Indian actor (1967–2020), born Sahabzade Irfan Ali Khan at Tonk and trained at the National School of Drama (1984), who broke through internationally with The Warrior (2001) and starred in Slumdog Millionaire, Life of Pi and The Lunchbox; he received the Padma Shri in 2011 and died at Mumbai in 2020."
  ur: "بھارتی اداکار (1967–2020) جو ٹونک میں صاحب زادے عرفان علی خان کے نام سے پیدا ہوئے، نیشنل اسکول آف ڈراما (1984) سے تربیت پائی، «دی واریر» (2001) سے عالمی شہرت ملی اور «سلم ڈاگ ملینئر»، «لائف آف پائی» اور «دی لنچ باکس» میں کام کیا؛ پدم شری (2011) ملا اور 2020 میں ممبئی میں انتقال ہوا۔"
