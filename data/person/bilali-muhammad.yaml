summary:
  ar: "عالم مسلم غيني من تيمبو في فوتا جالون، استُعبد في مراهقته وقضى عشر سنوات في جزر الكايكوس قبل أن يُباع سنة 1802 إلى جزيرة سابيلو في جورجيا، حيث صار المشرف الرئيس على مزرعة توماس سبالدينغ. اشتهر بمخطوطته العربية ذات الصفحات الثلاث عشرة، المعروفة بوثيقة بلالي، وهي بيان موجز للعقيدة الإسلامية وأحكام الطهارة والصلاة مأخوذ من رسالة ابن أبي زيد القيرواني، وتوصف بأنها أول نص إسلامي كُتب في الولايات المتحدة."
  en: "A Guinean Muslim scholar from Timbo in Fouta Djallon, enslaved as a teenager and held for ten years in the Caicos Islands before being sold in 1802 to Sapelo Island, Georgia, where he became the head driver and manager of Thomas Spalding's plantation. He is known for his thirteen-page Arabic manuscript, the Bilali Document, a brief statement of Islamic belief and the rules of ablution and prayer drawn from the Risalah of Ibn Abi Zayd al-Qayrawani, described as the first Islamic text written in the United States."
  ur: "فوتا جالون کے تیمبو سے تعلق رکھنے والے گنی کے مسلمان عالم، جو نوجوانی میں غلام بنائے گئے، جزائر کائیکوس میں دس برس رہے، پھر 1802 میں جارجیا کے جزیرہ ساپیلو فروخت کیے گئے، جہاں وہ تھامس اسپالڈنگ کے باغ کے سربراہ نگراں بنے۔ وہ اپنے تیرہ صفحات کے عربی مخطوطے، دستاویزِ بلالی، کے لیے مشہور ہیں، جو ابن ابی زید القیروانی کی رسالہ سے ماخوذ اسلامی عقیدے اور طہارت و نماز کے احکام کا مختصر بیان ہے اور جسے امریکا میں لکھا گیا پہلا اسلامی متن کہا جاتا ہے۔"
