summary:
  ar: صحابي مشهور روى عن النبي كثيراً؛ كان قارئاً عالماً بالفرائض والفقه فصيحاً شاعراً كاتباً وأحد من جمع القرآن، وكان بريد عمر بفتح دمشق، وولاه معاوية مصر، ومات في خلافة معاوية.
  en: A well-known Companion who narrated much from the Prophet; a reciter learned in inheritance law and jurisprudence, an eloquent poet and scribe, one of those who collected the Qur'an; he carried the news of the conquest of Damascus to Umar,
    Mu'awiya made him governor of Egypt, and he died in Mu'awiya's caliphate.
