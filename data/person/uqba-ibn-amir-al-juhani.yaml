id: person/uqba-ibn-amir-al-juhani
class: person
label: { ar: "عقبة بن عامر الجهني", en: "Uqba ibn Amir al-Juhani", es: "Uqba ibn Amir al-Juhani", fr: "Uqba ibn Amir al-Juhani", ur: "عقبہ بن عامر جہنی" }
summary:
  ar: "عقبة بن عامر الجهني؛ شاهد فتح مصر وشهد أن لأهل مصر عهداً وعقداً كتب لهم عمرو: أنهم آمنون على أموالهم ودمائهم ونسائهم وأولادهم لا يباع منهم أحد وفرض عليهم خراجاً لا يزاد عليهم وأن يُدفع عنهم خوف عدوهم — قال عقبة وأنا شاهد على ذلك. وهو أبو مسعود الذي استخلفه علي على الكوفة حين سار إلى صفين سنة ست وثلاثين {cite:muruj-al-dhahab p. 667}"
  en: "Uqba ibn Amir al-Juhani; a witness of Egypt's conquest who testified that its people hold covenant and contract written by Amr: secure in wealth, blood, women and children, none of them sold, a kharaj fixed never to increase, and protection from their enemy's fear — 'and I bear witness to that', said Uqba."
  es: "Uqba ibn Amir al-Juhani, testigo de la conquista de Egipto, testificó que su pueblo mantenía un pacto y un contrato escritos por Amr: seguridad en la riqueza, la sangre, las mujeres y los niños, ninguno de ellos vendido, un territorio fijo que nunca aumentaría y protección contra el temor de sus enemigos. «Y doy testimonio de ello», dijo Uqba."
  fr: "Uqba ibn Amir al-Juhani; un témoin de la conquête de l'Égypte qui a témoigné que son peuple respectait une alliance et un contrat écrits par Amr: la sécurité des biens, du sang, des femmes et des enfants, aucun d'eux n'étant vendu, un kharaj fixé pour ne jamais augmenter, et la protection contre la peur de leurs ennemis — « et j'en témoigne », a dit Uqba."
  ur: "عقبہ بن عامر الجہنی؛ مصر کی فتح کا ایک گواہ جس نے گواہی دی کہ اس کے لوگ عمرو کا لکھا ہوا عہد اور معاہدہ رکھتے ہیں: مال و دولت، خون، عورتوں اور بچوں میں محفوظ، ان میں سے کوئی بھی فروخت نہیں ہوا، ایک خراج مقرر ہے جو کبھی بڑھنے والا نہیں، اور اپنے دشمن کے خوف سے تحفظ - اور میں اس کی گواہی دیتا ہوں، عقبہ نے کہا۔"
  tr: "Uqbah ibn Amir al-Juhani; Mısır'ın fethine tanıklık eden ve Mısır halkının onlar için bir antlaşma ve sözleşme yazdığına tanıklık etti. Amr onlara şöyle yazdı: servetleri, kanları, kadınları ve çocukları üzerinde güvende olduklarını, hiçbirinin satılmayacağını, artırılmayacak bir vergi verileceğini ve düşmanlarından korkmayacaklarını — dedi Uqbah, ben de buna tanıklık ediyorum. O, Ali'nin otuz altıncı yılda Sifin'e yürüdüğünde Kufe'nin vali yardımcısı olarak atadığı Abu Mas'ud'dur {cite:muruj-al-dhahab, s. 667}"
  id: "Uqbah ibn Amir al-Juhani; saksi penaklukan Mesir dan bersaksi bahwa rakyat Mesir memiliki perjanjian dan kontrak yang ditulis untuk mereka. Amr menulis kepada mereka: bahwa mereka aman atas kekayaan, darah, wanita, dan anak-anak mereka, bahwa tidak ada yang akan dijual, dan mereka akan diberikan upeti yang tidak akan ditingkatkan serta dilindungi dari rasa takut akan musuh mereka — kata Uqbah, dan saya menjadi saksi akan hal itu. Dia adalah Abu Mas'ud, yang diangkat Ali sebagai wakil gubernur Kufa ketika dia berbaris ke Siffin pada tahun tiga puluh enam {cite:muruj-al-dhahab, hlm. 667}"
