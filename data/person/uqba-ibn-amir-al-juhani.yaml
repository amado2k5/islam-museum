label: { ar: "عقبة بن عامر الجهني", en: "Uqba ibn Amir al-Juhani" }
summary:
  ar: "عقبة بن عامر الجهني؛ شاهد فتح مصر وشهد أن لأهل مصر عهداً وعقداً كتب لهم عمرو: أنهم آمنون على أموالهم ودمائهم ونسائهم وأولادهم لا يباع منهم أحد وفرض عليهم خراجاً لا يزاد عليهم وأن يُدفع عنهم خوف عدوهم — قال عقبة وأنا شاهد على ذلك. وهو أبو مسعود الذي استخلفه علي على الكوفة حين سار إلى صفين سنة ست وثلاثين {cite:muruj-al-dhahab p. 667}"
  en: "Uqba ibn Amir al-Juhani; a witness of Egypt's conquest who testified that its people hold covenant and contract written by Amr: secure in wealth, blood, women and children, none of them sold, a kharaj fixed never to increase, and protection from their enemy's fear — 'and I bear witness to that', said Uqba."
