summary:
  ar: "كاتب وشاعر ومؤرخ طاجيكي (1878–1954م) من قرية ساكتاره في إمارة بخارى، من متنوري الجديد تعلم في مدرسة مير عرب في بخارى، ومؤلف «دوخوندا» (1927م) أول رواية طاجيكية، وأول رئيس لأكاديمية علوم طاجيكستان السوفييتية."
  en: "Tajik writer, poet and historian (1878–1954) from the Bukhara emirate village of Saktare: a Jadid enlightener educated at Bukhara's Mir-i-Arab madrasa, author of Dokhunda (1927), the first Tajik novel, and first president of the Academy of Sciences of the Tajik SSR."
