summary:
  ar: "\u0642\u0627\u0631\u0626\u0629 \u0642\u0631\u0622\u0646 \u0625\u0646\u062f\u0648\u0646\u064a\u0633\u064a\u0629 (\u0648\u064f\u0644\u062f\u062a 1955)\u060c \u0623\u0648\u0644 \u0627\u0645\u0631\u0623\u0629 \u062a\u0641\u0648\u0632 \u0628\u062c\u0627\u0626\u0632\u0629 \u062f\u0648\u0644\u064a\u0629 \u0644\u0644\u062a\u0644\u0627\u0648\u0629 \u0641\u064a \u0645\u0627\u0644\u064a\u0632\u064a\u0627 (1980)\u060c \u0641\u0627\u0632\u062a \u0628\u0645\u0633\u0627\u0628\u0642\u062a\u064a\u0646 \u0648\u0637\u0646\u064a\u062a\u064a\u0646 \u0641\u064a \u0625\u0646\u062f\u0648\u0646\u064a\u0633\u064a\u0627\u060c \u0648\u062a\u062f\u064a\u0631 \u0645\u0639\u0647\u062f \u062a\u0646\u0645\u064a\u0629 \u0627\u0644\u062a\u0644\u0627\u0648\u0629 \u0648\u062a\u062f\u0631\u0651\u0633 \u0641\u064a \u0645\u0639\u0647\u062f \u0639\u0644\u0648\u0645 \u0627\u0644\u0642\u0631\u0622\u0646 \u0628\u062c\u0627\u0643\u0631\u062a\u0627\u060c \u0648\u062a\u064f\u0639\u062f\u0651 \u0645\u0646 \u0643\u0628\u0627\u0631 \u0645\u0639\u0644\u0651\u0645\u064a \u0627\u0644\u062a\u0644\u0627\u0648\u0629 \u0641\u064a \u062c\u0646\u0648\u0628 \u0634\u0631\u0642 \u0622\u0633\u064a\u0627."
  en: "Indonesian Qur'an reciter (born 1955), the first woman to win an international recitation award in Malaysia (1980), winner of two Indonesian national contests, manager of the central institute for the development of recitation and lecturer at the Institute for Qur'anic Studies in Jakarta, regarded as one of Southeast Asia's leading teachers of recitation."
  ur: "\u0627\u0646\u0688\u0648\u0646\u06cc\u0634\u06cc\u0627\u0626\u06cc \u0642\u0627\u0631\u06cc\u06c2 \u0642\u0631\u0622\u0646 (\u067e\u06cc\u062f\u0627\u0626\u0634 1955\u0621)\u060c \u0645\u0644\u0627\u0626\u06cc\u0634\u06cc\u0627 \u0645\u06cc\u06ba \u062a\u0644\u0627\u0648\u062a \u06a9\u0627 \u0628\u06cc\u0646 \u0627\u0644\u0627\u0642\u0648\u0627\u0645\u06cc \u0627\u0646\u0639\u0627\u0645 \u062c\u06cc\u062a\u0646\u06d2 \u0648\u0627\u0644\u06cc \u067e\u06c1\u0644\u06cc \u062e\u0627\u062a\u0648\u0646 (1980\u0621)\u060c \u0627\u0646\u0688\u0648\u0646\u06cc\u0634\u06cc\u0627 \u06a9\u06d2 \u062f\u0648 \u0642\u0648\u0645\u06cc \u0645\u0642\u0627\u0628\u0644\u0648\u06ba \u06a9\u06cc \u0641\u0627\u062a\u062d\u060c \u062a\u0644\u0627\u0648\u062a \u06a9\u06cc \u062a\u0631\u0642\u06cc \u06a9\u06d2 \u0645\u0631\u06a9\u0632\u06cc \u0627\u062f\u0627\u0631\u06d2 \u06a9\u06cc \u0645\u0646\u062a\u0638\u0645 \u0627\u0648\u0631 \u062c\u06a9\u0627\u0631\u062a\u06c1 \u06a9\u06d2 \u0627\u062f\u0627\u0631\u06c2 \u0639\u0644\u0648\u0645\u0650 \u0642\u0631\u0622\u0646 \u0645\u06cc\u06ba \u0627\u0633\u062a\u0627\u062f\u060c \u062c\u0646\u06be\u06cc\u06ba \u062c\u0646\u0648\u0628 \u0645\u0634\u0631\u0642\u06cc \u0627\u06cc\u0634\u06cc\u0627 \u06a9\u06cc \u0645\u0645\u062a\u0627\u0632 \u0645\u0639\u0644\u0645\u0627\u062a\u0650 \u062a\u0644\u0627\u0648\u062a \u0645\u06cc\u06ba \u0634\u0645\u0627\u0631 \u06a9\u06cc\u0627 \u062c\u0627\u062a\u0627 \u06c1\u06d2\u06d4"
