summary:
  ar: "قارئة قرآن إندونيسية ⁦(وُلدت 1955)⁩، أول امرأة تفوز بجائزة دولية للتلاوة في ماليزيا (1980)، فازت بمسابقتين وطنيتين في إندونيسيا، وتدير معهد تنمية التلاوة وتدرّس في معهد علوم القرآن بجاكرتا، وتُعدّ من كبار معلّمي التلاوة في جنوب شرق آسيا."
  en: "Indonesian Qur'an reciter (born 1955), the first woman to win an international recitation award in Malaysia (1980), winner of two Indonesian national contests, manager of the central institute for the development of recitation and lecturer at the Institute for Qur'anic Studies in Jakarta, regarded as one of Southeast Asia's leading teachers of recitation."
  ur: "انڈونیشیائی قاریۂ قرآن ⁦(پیدائش 1955ء)⁩، ملائیشیا میں تلاوت کا بین الاقوامی انعام جیتنے والی پہلی خاتون ⁦(1980ء)⁩، انڈونیشیا کے دو قومی مقابلوں کی فاتح، تلاوت کی ترقی کے مرکزی ادارے کی منتظم اور جکارتہ کے ادارۂ علومِ قرآن میں استاد، جنھیں جنوب مشرقی ایشیا کی ممتاز معلماتِ تلاوت میں شمار کیا جاتا ہے۔"
