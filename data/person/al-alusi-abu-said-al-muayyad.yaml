summary:
  ar: "أبو سعيد المؤيد بن محمد بن علي بن محمد الألوسي الشاعر المشهور؛ كان من أعيان شعراء عصره كثير الغزل والهجاء، مدح جماعة من رؤساء العراق وله ديوان؛ ذكره ابن النجار في تاريخ بغداد فقال: ولد بألوس قرية بقرب الحديثة ونشأ بدجيل ودخل بغداد وصار جاوشاً في أيام المسترشد بالله، وكان منقطعاً إلى الوزير عون الدين يحيى بن هبيرة وله فيه مدائح جيدة؛ ثم عثر به الدهر فحُبس، ولقيَه ابن خلكان سنة خمس وخمسين وخمسمائة وقد غشي بصره من ظلمة المطمورة التي كان محبوساً بها {cite:wafayat-ayan}."
  en: "al-Mu'ayyad al-Alusi — famous Iraq poet, chamberlain of al-Mustarshid, then client of the wazir Ibn Hubayra; after a fall he was jailed, and Ibn Khallikan met him in 555 half-blind from the dungeon {cite:wafayat-ayan}."
  fr: "Al-Mu’ayyad al-Alusi — célèbre poète irakien, chambellan d’al-Mustarshid puis client du vizir Ibn Hubayra ; après un revers, il fut emprisonné, et Ibn Khallikan le rencontra en 555 H, à demi aveuglé par le cachot {cite:wafayat-ayan}."
  es: "al-Mu'ayyad al-Alusi — famoso poeta iraquí, chambelán de al-Mustarshid, luego cliente del visir Ibn Hubayra; después de una caída fue encarcelado, e Ibn Khallikan lo encontró en 555 medio ciego en el calabozo {cite:wafayat-ayan}."
  ur: "المعیاد العلوسی - مشہور عراقی شاعر، المسترشد کے چیمبرلین، اس وقت کے وزیر ابن ہبیرہ کے مؤکل؛ گرنے کے بعد اسے جیل میں ڈال دیا گیا، اور ابن خلیقان نے 555 میں ثقب اسود سے ان سے ملاقات کی۔"
  tr: "Ünlü şair Ebu Said el-Muayyad bin Muhammed bin Ali bin Muhammed el-Alusi; zamanının en önde gelen şairlerinden biriydi, çok sayıda aşk şiiri ve hiciv yazdı, Irak liderlerinden bir grubu övdü ve bir divanı vardı; İbn el-Necar, Bağdat Tarihi'nde ondan şöyle bahsetmiştir: \"Haditha yakınlarındaki Alus köyünde doğdu, Dujail'de büyüdü, Bağdat'a girdi ve El-Mustarşid Billa döneminde süvari oldu ve vezir Evn el-Din Yahya bin Hubeyra'ya bağlıydı ve onun için güzel övgüler yazdı; sonra kader ona karşı döndü ve hapsedildi ve İbn Hallikan onunla 555 Hicri yılında karşılaştı ve hapsedildiği zindanın karanlığından dolayı gözleri bulanıktı.\""
  id: "Abu Saeed Al-Mu’ayyad bin Muhammad bin Ali bin Muhammad Al-Alusi, penyair terkenal; beliau adalah salah satu penyair terkemuka pada zamannya, beliau menulis banyak puisi cinta dan satire, beliau memuji sekelompok pemimpin Irak dan beliau memiliki sebuah diwan; Ibn Al-Najjar menyebutkannya dalam Sejarah Baghdad, mengatakan: Beliau lahir di Alus, sebuah desa dekat Al-Haditha, dan dibesarkan di Dujail, dan memasuki Baghdad dan menjadi seorang prajurit kavaleri pada masa Al-Mustarshid Billah, dan beliau mengabdi kepada menteri Awn Al-Din Yahya bin Hubayra dan beliau memiliki pujian yang baik untuknya; kemudian nasib berbalik melawannya dan beliau dipenjara, dan Ibn Khallikan bertemu dengannya pada tahun 555 H, dan penglihatannya kabur karena kegelapan penjara tempat beliau dipenjara."
