summary:
  ar: "أبو سعيد المؤيد بن محمد بن علي بن محمد الألوسي الشاعر المشهور؛ كان من أعيان شعراء عصره كثير الغزل والهجاء، مدح جماعة من رؤساء العراق وله ديوان؛ ذكره ابن النجار في تاريخ بغداد فقال: ولد بألوس قرية بقرب الحديثة ونشأ بدجيل ودخل بغداد وصار جاوشاً في أيام المسترشد بالله، وكان منقطعاً إلى الوزير عون الدين يحيى بن هبيرة وله فيه مدائح جيدة؛ ثم عثر به الدهر فحُبس، ولقيَه ابن خلكان سنة خمس وخمسين وخمسمائة وقد غشي بصره من ظلمة المطمورة التي كان محبوساً بها {cite:wafayat-ayan}."
  en: "al-Mu'ayyad al-Alusi — famous Iraq poet, chamberlain of al-Mustarshid, then client of the wazir Ibn Hubayra; after a fall he was jailed, and Ibn Khallikan met him in 555 half-blind from the dungeon {cite:wafayat-ayan}."
