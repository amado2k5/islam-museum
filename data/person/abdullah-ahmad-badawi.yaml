summary:
  ar: "سياسي ماليزي، وُلد في بايان ليباس ببينانق سنة 1939. موظف مدني دخل البرلمان سنة 1978، وتولى حقائب وزارية عدة ثم نيابة رئاسة الوزراء، فخلف مهاتير محمد خامسَ رئيس وزراء سنة 2003، ودعا إلى الإصلاح وطرح مفهومه «إسلام حضاري»؛ وبعد خسائر انتخابية ثقيلة سنة 2008 تنحى سنة 2009، وتوفي في كوالالمبور سنة 2025."
  en: "Malaysian statesman, born at Bayan Lepas, Penang, in 1939. A civil servant who entered parliament in 1978, he served in several ministries and as deputy prime minister before succeeding Mahathir Mohamad as fifth prime minister in 2003, promoting reform and his Islam Hadhari concept; after heavy election losses in 2008 he stepped down in 2009, and died at Kuala Lumpur in 2025."
  ur: "ملائیشیائی سیاست دان، جو 1939ء میں بایان لیپس، پینانگ میں پیدا ہوئے۔ ایک سرکاری افسر کے طور پر 1978ء میں پارلیمنٹ میں داخل ہوئے، کئی وزارتیں اور نائب وزیرِ اعظم کا عہدہ سنبھالا، پھر 2003ء میں مہاتیر محمد کے جانشین کے طور پر پانچویں وزیرِ اعظم بنے اور اصلاحات اور اپنے تصور «اسلام حضاری» کو فروغ دیا؛ 2008ء کے بھاری انتخابی نقصانات کے بعد 2009ء میں مستعفی ہوئے اور 2025ء میں کوالالمپور میں وفات پائی۔"
