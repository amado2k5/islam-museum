summary:
  ar: "أفونسو دي ألبوكيرك — «البوكرك» في نص الصلابي — القائد البرتغالي؛ ينقل الكتاب أنه استولى على هرمز، وأنه أرسل إلى الشاه [[person/ismail-i-safavi|إسماعيل الصفوي]] رسالة قال فيها: «إني أقدر لك احترامك للمسيحيين في بلادك، وأعرض عليك الأسطول والجند والأسلحة لاستخدامها ضد قلاع الترك في الهند، وإذا أردت أن تنقض على بلاد العرب أو تهاجم مكة فستجدني بجانبك في البحر الأحمر أمام جدة أو في عدن أو في البحرين أو القطيف أو البصرة» {cite:dawlat-uthmaniyya-salabi p. 182}. ويذكر أن وفاته بعد ذلك أعاقت إتمام التحالف البرتغالي الصفوي {cite:dawlat-uthmaniyya-salabi p. 182}، وأن أهداف البرتغال المعلنة شملت اقتحام المسجد النبوي وأخذ رفات النبي مساومةً على استرداد القدس {cite:dawlat-uthmaniyya-salabi p. 193}."
  en: "Afonso de Albuquerque — 'al-Buqarq' in al-Salabi's text — the Portuguese commander who seized Hormuz and wrote Shah [[person/ismail-i-safavi|Ismail]] offering 'the fleet, the soldiers and the weapons to use against the Turkish forts in India; and should you wish to strike the lands of the Arabs or attack Mecca you will find me beside you in the Red Sea before Jeddah, or in Aden, Bahrain, Qatif or Basra' {cite:dawlat-uthmaniyya-salabi p. 182}. His death, the book says, obstructed the Portuguese-Safavid alliance {cite:dawlat-uthmaniyya-salabi p. 182}; the same pages record Portugal's declared aim of storming the Prophet's Mosque and taking the Prophet's remains to bargain for Jerusalem {cite:dawlat-uthmaniyya-salabi p. 193}."
  fr: "Afonso de Albuquerque — « al-Buqarq » dans le texte d'al-Salabi —, commandant portugais qui prit Ormuz et écrivit au chah [[person/ismail-i-safavi|Ismail]] pour offrir flotte, soldats et armes contre les forts turcs en Inde ; il promettait de le rejoindre s'il souhaitait frapper les terres arabes ou attaquer La Mecque, en mer Rouge devant Djeddah, ou à Aden, Bahreïn, Qatif ou Bassora {cite:dawlat-uthmaniyya-salabi p. 182}. Sa mort, selon le livre, empêcha l'alliance luso-safavide {cite:dawlat-uthmaniyya-salabi p. 182} ; les mêmes pages rapportent l'objectif déclaré du Portugal de prendre d'assaut la Mosquée du Prophète et d'emporter ses restes pour les échanger contre Jérusalem {cite:dawlat-uthmaniyya-salabi p. 193}."
  es: "Afonso de Albuquerque — 'al-Buqarq' en el texto de al-Salabi — el comandante portugués que tomó Hormuz y escribió al Shah [[person/ismail-i-safavi|Ismail]] ofreciéndole 'la flota, los soldados y las armas para usar contra las fortalezas turcas en la India; y si deseas atacar las tierras de los árabes o atacar La Meca, me encontrarás a tu lado en el Mar Rojo, frente a Yeda, o en Adén, Baréin, Qatif o Basora' {cite:dawlat-uthmaniyya-salabi p. 182}. Su muerte, dice el libro, obstaculizó la alianza portugués-safávida {cite:dawlat-uthmaniyya-salabi p. 182}; las mismas páginas registran el objetivo declarado de Portugal de asaltar la Mezquita del Profeta y tomar los restos del Profeta para negociar Jerusalén {cite:dawlat-uthmaniyya-salabi p. 193}."
  ur: "Afonso de Albuquerque — 'البقارق' السلابی کے متن میں — پرتگالی کمانڈر جس نے ہرمز پر قبضہ کیا اور شاہ کو لکھا [[شخص/اسماعیل-صفوی|اسماعیل]] نے ہندوستان میں ترک قلعوں کے خلاف استعمال کرنے کے لیے 'بیڑے، سپاہیوں اور ہتھیاروں کی پیشکش کی۔ اور اگر آپ عربوں کی سرزمین پر حملہ کرنا چاہتے ہیں یا مکہ پر حملہ کرنا چاہتے ہیں تو آپ مجھے اپنے پاس بحیرہ احمر میں جدہ سے پہلے یا عدن، بحرین، قطیف یا بصرہ میں پائیں گے۔ 182}۔ کتاب کہتی ہے کہ ان کی موت نے پرتگالی صفوی اتحاد میں رکاوٹ ڈالی 182}; انہی صفحات میں پرتگال کا مسجد نبوی پر دھاوا بولنے اور رسول اللہ کی باقیات کو یروشلم کے لیے سودا کرنے کا اعلان کردہ مقصد درج ہے۔ 193}۔"
  tr: "Afonso de Albuquerque—al-Salabi'nin metninde \"Albuquerque\" olarak geçen—Portekizli komutandı. Kitap, Hormuz'u ele geçirdiğini ve Şah İsmail Safavi'ye şu mektubu gönderdiğini anlatır: \"Ülkenizdeki Hristiyanlara gösterdiğiniz saygıyı takdir ediyorum ve size Hindistan'daki Türk kalelerine karşı kullanmanız için filoyu, askerleri ve silahları sunuyorum. Arap topraklarına veya Mekke'ye saldırmak isterseniz, beni Cidde açıklarında Kızıldeniz'de veya Aden, Bahreyn, Katif veya Basra'da yanınızda bulacaksınız.\" {cite:dawlat-uthmaniyya-salabi s. 182}. Daha sonraki ölümünün Portekiz-Safavi ittifakının tamamlanmasını engellediği {cite:dawlat-uthmaniyya-salabi s. 182} ve Portekiz'in ilan ettiği hedeflerin arasında Peygamber Mescidi'ne saldırmak ve Kudüs'ün iadesi için koz olarak Peygamberin kalıntılarını almak olduğu belirtilir. {cite:dawlat-uthmaniyya-salabi s. 193}."
  id: "Afonso de Albuquerque—\"Albuquerque\" dalam teks al-Salabi—adalah komandan Portugis. Buku tersebut menceritakan bahwa ia merebut Hormuz dan mengirim surat kepada Shah Ismail Safawi, yang berbunyi: \"Saya menghargai rasa hormat Anda terhadap orang-orang Kristen di negeri Anda, dan saya menawarkan armada, tentara, dan senjata untuk digunakan melawan benteng-benteng Turki di India. Jika Anda ingin menyerang negeri-negeri Arab atau Mekah, Anda akan menemukan saya di sisi Anda di Laut Merah di lepas pantai Jeddah, atau di Aden, Bahrain, Qatif, atau Basra.\" {cite:dawlat-uthmaniyya-salabi hlm. 182}. Disebutkan bahwa kematiannya kemudian menghambat penyelesaian aliansi Portugis-Safawi {cite:dawlat-uthmaniyya-salabi hlm. 182}, dan bahwa tujuan yang dinyatakan Portugal termasuk menyerbu Masjid Nabi dan mengambil jenazah Nabi sebagai alat tawar untuk pengembalian Yerusalem. {cite:dawlat-uthmaniyya-salabi hlm. 193}."
