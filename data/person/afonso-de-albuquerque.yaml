summary:
  ar: "أفونسو دي ألبوكيرك — «البوكرك» في نص الصلابي — القائد البرتغالي؛ ينقل الكتاب أنه استولى على هرمز، وأنه أرسل إلى الشاه [[person/ismail-i-safavi|إسماعيل الصفوي]] رسالة قال فيها: «إني أقدر لك احترامك للمسيحيين في بلادك، وأعرض عليك الأسطول والجند والأسلحة لاستخدامها ضد قلاع الترك في الهند، وإذا أردت أن تنقض على بلاد العرب أو تهاجم مكة فستجدني بجانبك في البحر الأحمر أمام جدة أو في عدن أو في البحرين أو القطيف أو البصرة» {cite:dawlat-uthmaniyya-salabi p. 182}. ويذكر أن وفاته بعد ذلك أعاقت إتمام التحالف البرتغالي الصفوي {cite:dawlat-uthmaniyya-salabi p. 182}، وأن أهداف البرتغال المعلنة شملت اقتحام المسجد النبوي وأخذ رفات النبي مساومةً على استرداد القدس {cite:dawlat-uthmaniyya-salabi p. 193}."
  en: "Afonso de Albuquerque — 'al-Buqarq' in al-Salabi's text — the Portuguese commander who seized Hormuz and wrote Shah [[person/ismail-i-safavi|Ismail]] offering 'the fleet, the soldiers and the weapons to use against the Turkish forts in India; and should you wish to strike the lands of the Arabs or attack Mecca you will find me beside you in the Red Sea before Jeddah, or in Aden, Bahrain, Qatif or Basra' {cite:dawlat-uthmaniyya-salabi p. 182}. His death, the book says, obstructed the Portuguese-Safavid alliance {cite:dawlat-uthmaniyya-salabi p. 182}; the same pages record Portugal's declared aim of storming the Prophet's Mosque and taking the Prophet's remains to bargain for Jerusalem {cite:dawlat-uthmaniyya-salabi p. 193}."
