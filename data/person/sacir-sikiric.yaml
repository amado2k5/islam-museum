summary:
  ar: "مستشرق بوسني من أوغلافاك قرب فوينيتسا، متخصص في العربية والفارسية، يُعدّ مع فهيم بايراكتاريفيتش من مؤسسي الاستشراق الحديث في يوغوسلافيا: أستاذ في مدرسة القضاة الشرعيين والمدرسة الإسلامية العليا للشريعة واللاهوت في سراييفو، ومنذ 1950 أستاذ العربية والفارسية في كلية الفلسفة بسراييفو، وشارك في وضع نحو عربي (1936–1937) وألّف أول نحو فارسي في البلدان السلافية الجنوبية (1951)."
  en: "Bosnian orientalist from Oglavak near Fojnica, an Arabist and Iranist counted with Fehim Bajraktarević among the founders of modern Oriental studies in Yugoslavia: professor at the Sharia Judges' School and the Higher Islamic Sharia-Theological School in Sarajevo, and from 1950 professor of Arabic and Persian at Sarajevo's Faculty of Philosophy; co-author of an Arabic grammar (1936–1937) and author of the first Persian grammar in the South Slavic lands (1951)."
  ur: "اوغلاواک (قریب فوینیتسا) سے تعلق رکھنے والے بوسنیائی مستشرق، عربی و فارسی کے ماہر، جنھیں فہیم بائراکتارویچ کے ساتھ یوگوسلاویہ میں جدید استشراق کے بانیوں میں شمار کیا جاتا ہے: سرائیوو کی شرعی ججوں کی درسگاہ اور اعلیٰ اسلامی شرعی الٰہیاتی مدرسے کے استاد، اور 1950ء سے سرائیوو کی فلسفہ فیکلٹی میں عربی و فارسی کے پروفیسر؛ عربی قواعد (1936–1937ء) کے شریک مصنف اور جنوبی سلافی سرزمین میں فارسی کی پہلی قواعد (1951ء) کے مصنف۔"
