label: { ar: "زادويه مولى بني العنبر", en: "Zadawayh, mawla of Banu'l-'Anbar", es: "Zadawayh, mawla of Banu'l-'Anbar", fr: "Zadawayh, mawla of Banu'l-'Anbar", ur: "زاداویہ، بنو الانبار کے مولا" }
summary:
  ar: "المتآمر الثالث مع ابن ملجم والبرك في المواعدة بمكة على قتل الأمراء الثلاثة، واختار هو عمرو بن العاص فأخطأه لما تخلف عن الصلاة، وفي رواية أخرى كان الثالث عمرو بن بكر {cite:muruj-al-dhahab p. 701} {cite:tarikh-khulafa-minhaj-1434 p. 295}."
  en: "The third Meccan conspirator with Ibn Muljam and al-Burak — assigned 'Amr ibn al-'As and missing him on the appointed dawn; the Tarikh al-Khulafa recension names the third 'Amr ibn Bakr instead {cite:muruj-al-dhahab p. 701}."
  es: "El tercer conspirador de La Meca con Ibn Muljam y al-Burak —asignado a 'Amr ibn al-'As y faltándole en el amanecer señalado; la recensión Tarikh al-Khulafa nombra al tercer 'Amr ibn Bakr en su lugar {cite:muruj-al-dhahab p. 701}."
  fr: "Le troisième conspirateur mecquois avec Ibn Muljam et al-Burak — désigné comme 'Amr ibn al-'As et manquant son but à l'aube prévue; la recension Tarikh al-Khulafa nomme à la place le troisième 'Amr ibn Bakr {cite:muruj-al-dhahab p. 701}."
  ur: "ابن ملجم اور البرک کے ساتھ تیسرا مکی سازشی - عمرو بن العاص کو مقرر کیا اور مقررہ فجر پر اسے غائب کر دیا۔ تاریخ الخلفاء نے تیسرے کا نام عمرو بن بکر کے بجائے رکھا ہے۔ 701}۔"
  tr: "Mekke'de İbn Muljam ve El-Birk ile üç prensi öldürme anlaşmasında üçüncü komplocu. Amr ibn al-As'ı seçti, ancak namazı kaçırdığı için hata yaptı. Başka bir rivayette, üçüncü kişi Amr ibn Bakr {atıf:Muruj-al-Dhahab s. 701} {cite:Tarikh-khulafa-minhaj-1434 s. 295}'dir."
  id: "Konspirator ketiga bersama Ibn Muljam dan Al-Birk dalam perjanjian Mekah untuk membunuh tiga pangeran itu. Ia memilih Amr ibn al-As, tetapi ia salah karena melewatkan doa. Dalam riwayat lain, yang ketiga adalah Amr ibn Bakr {cite:muruj-al-dhahab hlm. 701} {cite:Tarikh-khulafa-minhaj-1434 hlm. 295}."
