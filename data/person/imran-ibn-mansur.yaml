summary:
  ar: "داعية بريطاني من لندن عُرف باسم «رجل الدعوة» (Dawah Man). بنى قناته على يوتيوب — التي بدأت باسم «جلسات النصيحة» (Naseeha Sessions) — على تذكرات مباشرة بأسلوب شبابي يجيب فيها عن أسئلة المشاهدين، ثم اعتزل شخصية «رجل الدعوة» وتحوّل إلى تدريب روّاد الأعمال المسلمين، وتعمل القناة اليوم باسم «شاي مع أخي»."
  en: "British dawah preacher from London known as Dawah Man. He built his YouTube channel — launched as Naseeha Sessions — on direct, street-style reminders answering viewers' questions, was profiled in academic studies of online preaching, and later retired the Dawah Man persona to coach Muslim entrepreneurs; the channel now runs as Chai With My Bhai."
  ur: "لندن سے تعلق رکھنے والے برطانوی مبلغ جو Dawah Man کے نام سے مشہور ہوئے۔ انہوں نے اپنی یوٹیوب چینل — جو Naseeha Sessions کے نام سے شروع ہوئی — نوجوانوں کے انداز میں براہ راست نصیحتوں پر قائم کی، پھر Dawah Man کی شخصیت ترک کر کے مسلم کاروباری افراد کی تربیت کی طرف متوجہ ہوئے؛ چینل اب Chai With My Bhai کے نام سے چلتی ہے۔"
