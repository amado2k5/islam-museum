id: person/yazid-ibn-al-walid
class: person
label: { ar: "يزيد بن الوليد بن عبد الملك" }
summary:
  ar: "بويع بالخلافة بعد هشام، وقيل إن مروان بن محمد لقبه بالناقص {cite:tabari-tarikh-abu-al-fadl j.7 p.262}، وتوفي في سنة ست وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.298}، وعند السيوطي ثب على الخلافة وقتل ابن عمه الوليد، وأمه شاهفرند بنت فيروز بن يزدجرد وأم فيروز بنت شيرويه بن كسرى وأم شيرويه بنت خاقان ملك الترك وأم أم فيروز بنت قيصر عظيم الروم فلهذا قال يفتخر أنا ابن كسرى وأبي مروان وقيصر جدي وجدي خاقان، وقال الثعالبي هو أعرق الناس في الملك والخلافة من كلا طرفيه، وخطب بعد القتل يبذل للناس ألا يضع لبنة على لبنة ولا ينقل مالاً من بلد حتى يسد ثغره، وقال ابن عبد الحكم عن الشافعي لما ولي دعا الناس إلى القدر وحملهم عليه وقرب أصحاب غيلان {cite:tarikh-khulafa-minhaj-1434 p. 408-409، وكان يزيد بن الوليد أحول يلقب بيزيد الناقص ولم يكن ناقصاً في جسمه ولا عقله وإنما نقص بعض الجند من أرزاقهم فقالوا يزيد الناقص، وكان يذهب إلى قول المعتزلة وما يذهبون إليه في الأصول الخمسة {cite:muruj-al-dhahab p. 204}}، وكان يزيد بن الوليد أحول يلقب بيزيد الناقص ولم يكن ناقصاً في جسمه ولا عقله وإنما نقص بعض الجند من أرزاقهم فقالوا يزيد الناقص، وكان يذهب إلى قول المعتزلة وما يذهبون إليه في الأصول الخمسة {cite:muruj-al-dhahab p. 204}، وعند المسعودي كان خروجه بدمشق مع شائعة من المعتزلة وغيرهم من أهل داريا والمزة على الوليد بن يزيد لما ظهر من فسقه، وهو أول من ولي هذا الأمر وأمه أم ولد سارية بنت فيروز بن كسرى وهو القائل أنا ابن كسرى وأبي مروان وقيصر جدي وجدي خاقان، ويكنى أبا خالد، وتفضل المعتزلة يزيد بن الوليد في الديانة على عمر بن عبد العزيز {cite:muruj-al-dhahab p. 212}"
