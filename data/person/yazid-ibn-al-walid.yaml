id: person/yazid-ibn-al-walid
class: person
label: { ar: "يزيد بن الوليد بن عبد الملك" }
summary:
  ar: "بويع بالخلافة بعد هشام، وقيل إن مروان بن محمد لقبه بالناقص {cite:tabari-tarikh-abu-al-fadl j.7 p.262}، وتوفي في سنة ست وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.298}، وعند السيوطي ثب على الخلافة وقتل ابن عمه الوليد، وأمه شاهفرند بنت فيروز بن يزدجرد وأم فيروز بنت شيرويه بن كسرى وأم شيرويه بنت خاقان ملك الترك وأم أم فيروز بنت قيصر عظيم الروم فلهذا قال يفتخر أنا ابن كسرى وأبي مروان وقيصر جدي وجدي خاقان، وقال الثعالبي هو أعرق الناس في الملك والخلافة من كلا طرفيه، وخطب بعد القتل يبذل للناس ألا يضع لبنة على لبنة ولا ينقل مالاً من بلد حتى يسد ثغره، وقال ابن عبد الحكم عن الشافعي لما ولي دعا الناس إلى القدر وحملهم عليه وقرب أصحاب غيلان {cite:tarikh-khulafa-minhaj-1434 p. 408-409، وكان يزيد بن الوليد أحول يلقب بيزيد الناقص ولم يكن ناقصاً في جسمه ولا عقله وإنما نقص بعض الجند من أرزاقهم فقالوا يزيد الناقص، وكان يذهب إلى قول المعتزلة وما يذهبون إليه في الأصول الخمسة {cite:muruj-al-dhahab p. 204}}، وكان يزيد بن الوليد أحول يلقب بيزيد الناقص ولم يكن ناقصاً في جسمه ولا عقله وإنما نقص بعض الجند من أرزاقهم فقالوا يزيد الناقص، وكان يذهب إلى قول المعتزلة وما يذهبون إليه في الأصول الخمسة {cite:muruj-al-dhahab p. 204}، وعند المسعودي كان خروجه بدمشق مع شائعة من المعتزلة وغيرهم من أهل داريا والمزة على الوليد بن يزيد لما ظهر من فسقه، وهو أول من ولي هذا الأمر وأمه أم ولد سارية بنت فيروز بن كسرى وهو القائل أنا ابن كسرى وأبي مروان وقيصر جدي وجدي خاقان، ويكنى أبا خالد، وتفضل المعتزلة يزيد بن الوليد في الديانة على عمر بن عبد العزيز {cite:muruj-al-dhahab p. 212}"
  tr: "Hiham'dan sonra halifeliğe bağlılık yemini etti ve Marwan ibn Muhammed'in ona 'Neq' lakabını taktığı söylenir. {alıntı:Tabari-tarikh-abu-al-Fadl j.7 s.262} ve yüz yirmi altıncı yılda öldü {atıf:tabari-tarikh-abu-al-fadl j.7 s.298}. al-Suyuti'ye göre, halifeliği ele geçirmiş ve kuzeni el-Velid'i öldürmüştür. Annesi Şahfrand bint Firuz ibn Yezdegerd, um Firuz bint Şiruvey ibn Hoşrov, Türklerin kralı Um Şiruvey bint Kagan ve büyük Roma hükümdarı um Fırız bint Sezar'dır. Bu nedenle, 'Ben Kösrov'un, babam Mervan ve Sezar'ın, büyükbabam ve dedem Kağan'ın oğluymuştur.' dedi. El-Tha'alibi şöyle demiştir: 'Ben Kösrov'un, babam Mervan'ın ve büyükbabam Kagan'ın oğluyum.' El-Tealibi şöyle demiştir: Her iki taraftan da krallık ve halifelikte en seçkin adamdı. Ölümünden sonra, insanları tuğla üstüne tuğla koymamaya veya bir kasabadan para transferi yapmamaları için vaazlar verdi; ta ki boşluğu kapatılana kadar. İbn Abd al-Hakam, el-Şafii hakkında, iktidara geldiğinde insanları kaderine çağırdığını, onu takip etmelerini teşvik ettiğini ve Ghilan yoldaşlarını yakınlaştırdığını söyledi {cite:History-Khulafa-minhaj-1434, s. 408-409. Yezid bin el-Velid, sağlam bir adamdı, Eksik Yezid lakabıyla anılırdı ve bedensel ya da zihinsel olarak eksik değildi, ancak bazı askerler erzak yetersizliği nedeniyle ona Eksik Yezid derlerdi. Giderdi Mu'tazilcilerin Sözü ve Beş Temelde Söyledikleri {atıf:Muruj-al-Dhahab s. 204}}. Yezid bin el-Velid en umut vadeden olanıydı, Eksik Yezid lakabıyla anılırdı ve bedensel ya da zihinsel olarak eksik değildi, ancak bazı askerlerin erzakları yetersizdi, bu yüzden Yezide eksik dediler. Mu'tazila görüşünü ve Beş İlke'de ona atfettiklerini takip etti {atıf:Muruj-al-Dhahab s. 204}. El-Mes'udi'ye göre, Şam'dan ayrılması, Mu'taziller ve Darya ile Mezzeh'den diğerlerinin el-Velid bin Yezid'e karşı onun görünürdeki ahlaksızlığı nedeniyle bir söylenti ile birlikte gerçekleşti, Bu görevi ilk üstlenen oydu ve annesi Um Walad Sariya bint Fairuz ibn Khosrow'du; şöyle derdi: Ben Khosrow, Ebu Mervan ve Sezar'ın, dedem ve büyükbabam Kağan'ın oğluyum ve onun kunya'sı Ebu Halid'dir. Mu'taziller, din açısından Yazid ibn al-Walid'i Ömer bin Abdülaziz'e tercih ettiler {atıf:muruj-al-dhahab, s. 212}"
  id: "Ia bersumpah setia kepada kekhalifahan setelah Hisham, dan konon Marwan ibn Muhammad menjulukinya 'Naq' {cite:tabari-tarikh-abu-al-fadl j.7 hlm.262}, dan meninggal pada tahun seratus dua puluh enam {cite:tabari-tarikh-abu-al-fadl j.7 hlm.298}. Menurut al-Suyuti, ia merebut kekhalifahan dan membunuh sepupunya al-Walid. Ibunya adalah Shahfrand bint Firuz ibn Yazdegerd, um Firuz bint Shiruwayh ibn Khosrow, um Shiruwayh bint Khagan, raja Turki, dan um um Firuz bint Caesar, penguasa Romawi yang agung. Karena alasan ini, ia berkata, 'Saya adalah putra Khosrow, ayah saya Marwan, dan Caesar, kakek dan kakek saya Khagan.' Al-Tha'alibi berkata Ia adalah orang paling terkemuka dalam kerajaan dan kekhalifahan dari kedua belah pihak. Setelah kematiannya, ia memberikan khotbah yang mendorong orang-orang untuk tidak meletakkan batu bata ke batu bata atau memindahkan uang dari satu kota sampai celahnya tertutup. Ibn Abd al-Hakam berkata tentang al-Shafi'i, ketika ia berkuasa, ia memanggil rakyat pada takdir, mendesak mereka untuk mengikutinya, dan mendekatkan sahabat Ghilan {cite:History-Khulafa-minhaj-1434, hlm. 408-409. Yazid ibn al-Walid adalah pria tangguh, dijuluki Yazid yang Tak Lengkap, dan ia tidak kekurangan tubuh maupun pikiran, tetapi beberapa prajurit kekurangan persediaan, sehingga mereka memanggilnya Yazid yang Tak Lengkap. Ia biasa pergi ke Pernyataan Mu'tazilit dan Apa yang Mereka Katakan dalam Lima Dasar {kutip:Muruj-al-Dhahab hlm. 204}}. Yazid ibn al-Walid adalah yang paling menjanjikan, dijuluki Yazid yang Belum Lengkap, dan ia tidak kekurangan tubuh maupun pikiran, tetapi beberapa prajurit kekurangan persediaan, sehingga mereka menyebut Yazid yang kurang bermoral. Ia mengikuti pandangan Mu'tazila dan apa yang mereka atribusikan kepadanya dalam Lima Prinsip {cite:Muruj-al-Dhahab hlm. 204}. Menurut al-Mas'udi, kepergiannya ke Damaskus disertai dengan rumor dari Mu'tazi dan lainnya dari Darya dan Mezzeh menentang al-Walid ibn Yazid karena dugaan ketidakmoralannya, Ia adalah yang pertama memegang jabatan ini, dan ibunya adalah um Walad Sariya bint Fairuz ibn Khosrow, yang berkata: Saya adalah putra Khosrow, Abu Marwan, dan Caesar, kakek dan kakek saya Khagan, dan kunya beliau adalah Abu Khalid. Mu'tazilites lebih menyukai Yazid ibn al-Walid dalam agama dibandingkan Umar ibn Abd al-Aziz {cite:muruj-al-dhahab, hlm. 212}"
