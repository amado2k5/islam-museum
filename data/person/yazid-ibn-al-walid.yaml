label: { ar: "يزيد بن الوليد بن عبد الملك، وعند السيوطي ثب على الخلافة وقتل ابن عمه الوليد، وأمه شاهفرند بنت فيروز بن يزدجرد وأم فيروز بنت شيرويه بن كسرى وأم شيرويه بنت خاقان ملك الترك وأم أم فيروز بنت قيصر عظيم الروم فلهذا قال يفتخر أنا ابن كسرى وأبي مروان وقيصر جدي وجدي خاقان، وقال الثعالبي هو أعرق الناس في الملك والخلافة من كلا طرفيه، وخطب بعد القتل يبذل للناس ألا يضع لبنة على لبنة ولا ينقل مالاً من بلد حتى يسد ثغره، وقال ابن عبد الحكم عن الشافعي لما ولي دعا الناس إلى القدر وحملهم عليه وقرب أصحاب غيلان {cite:tarikh-khulafa-minhaj-1434 p. 408-409}" }
summary:
