summary:
  ar: "مغنٍّ ومؤلف أغانٍ وسياسي سنغالي، وُلد في داكار في 1 أكتوبر 1959. ساهم في تطوير موسيقى «المبالاكس»، وبلغت شهرته العالمية بأغنية «سبع ثوانٍ» (1994) مع نيني شيري وبألبومه التعبدي «مصر» (2004) الحائز على غرامي، وأسس مجموعة «فوتور ميديا» الصحفية، وشغل منصب وزير الثقافة والسياحة في السنغال (2012–2013) بعد ترشح رئاسي أُبطل."
  en: "Senegalese singer, songwriter and politician, born at Dakar on 1 October 1959. He helped develop mbalax, reached a worldwide audience with '7 Seconds' (1994), a duet with Neneh Cherry, and the devotional album Egypt (2004), which won a Grammy Award, founded the Groupe Futurs Médias press group, and served as Senegal's Minister of Culture and Tourism (2012–2013) after a disqualified presidential candidacy."
  ur: "سینیگال کے گلوکار، گیت نگار و سیاست دان، جو 1 اکتوبر 1959 کو ڈاکار میں پیدا ہوئے۔ انہوں نے مبالاکس موسیقی کی ترقی میں حصہ لیا، نینی چیری کے ساتھ «سیون سیکنڈز» (1994) اور گریمی یافتہ مذہبی البم «مصر» (2004) سے عالمی شہرت پائی، میڈیا گروپ «گروپ فوتور میڈیا» قائم کیا، اور 2012 تا 2013 سینیگال کے وزیرِ ثقافت و سیاحت رہے۔"
