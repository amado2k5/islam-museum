id: person/husayn-ibn-ali-al-tabari-sahib-al-uda
class: person
gender: male
label:
  ar: "صاحب العدة الطبري (الحسين بن علي)"
  en: "Al-Tabari, author of al-Uda (Husayn ibn Ali)"
summary:
  ar: "الحسين بن علي بن الحسين، أبو عبد الله، الطبري، فقيه شافعي، نزيل مكة ومحدثها وفقيهها، ويُدعى إمام الحرمين. تفقه على ناصر العمري بخراسان، وعلى القاضي أبي الطيب الطبري ببغداد، ولازم أبا إسحاق الشيرازي حتى برع في المذهب والخلاف، ودرّس بالنظامية ببغداد. روى عنه إسماعيل التميمي والسلفي وأبو بكر بن العربي. من تصانيفه كتاب العدة، وهو شرح على الإبانة للفوراني. توفي سنة 498 هـ، وولد سنة 418 هـ على ما يذكره العنوان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15820}"
  en: "Al-Husayn ibn Ali ibn al-Husayn, Abu Abd Allah, al-Tabari, a Shafi'i jurist who settled in Mecca and was its hadith scholar and jurist; he was called Imam al-Haramayn. He studied in Khurasan under Nasir al-Umari, in Baghdad under the judge Abu al-Tayyib al-Tabari, and then stayed with Abu Ishaq al-Shirazi until he excelled in the school and the disputes. He taught at the Nizamiyya in Baghdad. Ismail al-Taymi, al-Silafi and Abu Bakr ibn al-Arabi related from him. His book al-Uda is a commentary on al-Ibana of al-Furani. The header gives his death as 498 AH and his birth as 418 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15820}"
