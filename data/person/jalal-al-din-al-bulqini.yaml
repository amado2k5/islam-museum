label:
  ar: "جلال الدين البلقيني (عبد الرحمن بن عمر)"
  en: "Jalal al-Din al-Bulqini (Abd al-Rahman ibn Umar)"
summary:
  ar: "عبد الرحمن بن عمر بن رسلان بن نصير بن صالح، جلال الدين، أبو الفضل وأبو اليمن، فقيه شافعي من أصله عسقلاني ثم بلقيني، نشأ بالقاهرة وتفقه على والده وغيره في مصر ودمشق، وبرع في الفقه والأصول والعربية والتفسير والمعاني والبيان، وأفتى ودرّس وولي القضاء. من تصانيفه حواشي الروضة، ونكت المنهاج لم تكمل، وضوابط في الفقه منظومة، ونكت على الحاوي الصغير. توفي 824 هـ على ما يذكر عنوان المدخل (ولد 763 هـ). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  en: "Abd al-Rahman ibn Umar ibn Ruslan ibn Nusayr ibn Salih, Jalal al-Din, Abu al-Fadl and Abu al-Yaman, a Shafi'i jurist of Asqalani origin, later of Bulqina, who grew up in Cairo and studied fiqh under his father and others in Egypt and Damascus. He excelled in fiqh, usul, grammar, exegesis, rhetoric and eloquence, gave fatwas, taught, and served as judge. His works include glosses on al-Rawda, unfinished notes on al-Minhaj, versified rules of fiqh, and notes on al-Hawi al-Saghir. The header gives his death as 824 AH and his birth as 763 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
