summary:
  ar: "عبد الرحمن بن عمر بن رسلان بن نصير بن صالح، جلال الدين، أبو الفضل وأبو اليمن، فقيه شافعي من أصله عسقلاني ثم بلقيني، نشأ بالقاهرة وتفقه على والده وغيره في مصر ودمشق، وبرع في الفقه والأصول والعربية والتفسير والمعاني والبيان، وأفتى ودرّس وولي القضاء. من تصانيفه حواشي الروضة، ونكت المنهاج لم تكمل، وضوابط في الفقه منظومة، ونكت على الحاوي الصغير. توفي 824 هـ على ما يذكر عنوان المدخل ⁦(ولد 763 هـ)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  en: "Abd al-Rahman ibn Umar ibn Ruslan ibn Nusayr ibn Salih, Jalal al-Din, Abu al-Fadl and Abu al-Yaman, a Shafi'i jurist of Asqalani origin, later of Bulqina, who grew up in Cairo and studied fiqh under his father and others in Egypt and Damascus. He excelled in fiqh, usul, grammar, exegesis, rhetoric and eloquence, gave fatwas, taught, and served as judge. His works include glosses on al-Rawda, unfinished notes on al-Minhaj, versified rules of fiqh, and notes on al-Hawi al-Saghir. The header gives his death as 824 AH and his birth as 763 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  es: "Abd al-Rahman ibn Umar ibn Ruslan ibn Nusayr ibn Salih, Jalal al-Din, Abu al-Fadl y Abu al-Yaman, jurista shafi'í de origen asqalani, posteriormente de Bulqina, creció en El Cairo y estudió fiqh con su padre y otros maestros en Egipto y Damasco. Destacó en fiqh, usul, gramática, exégesis, retórica y elocuencia, emitió fatwas, enseñó y ejerció como juez. Entre sus obras se incluyen glosas sobre al-Rawda, notas inconclusas sobre al-Minhaj, reglas versificadas de fiqh y notas sobre al-Hawi al-Saghir. El encabezado indica que falleció en el año 824 de la Hégira y nació en el año 763 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  fr: "Abd al-Rahman ibn Umar ibn Ruslan ibn Nusayr ibn Salih, également connu sous les noms de Jalal al-Din, Abu al-Fadl et Abu al-Yaman, juriste chaféite d'origine asqalani, établi plus tard à Bulqina, grandit au Caire et étudia le fiqh auprès de son père et d'autres maîtres en Égypte et à Damas. Il excellait en fiqh, usul, grammaire, exégèse, rhétorique et éloquence, émettait des fatwas, enseignait et exerçait la fonction de juge. Parmi ses œuvres figurent des gloses sur al-Rawda, des notes inachevées sur al-Minhaj, des règles de fiqh versifiées et des notes sur al-Hawi al-Saghir. La notice biographique indique sa mort en 824 AH et sa naissance en 763 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15814}"
  ur: "عبدالرحمٰن بن عمر بن رسلان بن نصیر بن صالح، جلال الدین، ابو الفضل اور ابو ال یمان، عسقلانی نژاد، بعد میں بلقینا کے شافعی فقیہ، جو قاہرہ میں پلے بڑھے اور مصر اور دمش میں اپنے والد سے فقہ کی تعلیم حاصل کی۔ آپ نے فقہ، اصول، گرامر، تفسیر، بیان بازی اور فصاحت و بلاغت میں کمال حاصل کیا، فتویٰ دیا، پڑھایا اور جج کی حیثیت سے خدمات انجام دیں۔ ان کی تصانیف میں الروادہ پر اشعار، المنہاج پر نامکمل نوٹ، فقہ کے تصدیق شدہ قواعد، اور الحوی الصغیر پر نوٹ شامل ہیں۔ ہیڈر ان کی وفات 824 ہجری اور ولادت 763 ہجری بتاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص15814}"
