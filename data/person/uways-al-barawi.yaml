    note: "Attested of Uways personally by two independent sources. (1) Martin (1969), a peer-reviewed study devoted to him, describes him as 'an important leader of the Qadiriya brotherhood in southern Somalia, on Zanzibar, and along the East African coast' who 'founded his own branch of Qadiriya, the Uwaysiya'. (2) His English article records that he was introduced to the Qadiriyya by his teacher, studied in Baghdad under the Qadiri Sayyid Mustafa b. Salman al-Jilani and received an ijaza from him, returned to lead the Qadiriyya in Somalia, and that the sub-branch was named Uwaysiyya after him; its infobox gives his creed as 'Qadiriyya, Uwaysiyya'. No sunni segment is recorded: the only attestation of a school for him personally is his article's infobox line giving his jurisprudence as Shafi'i, a single attestation which the two-source rule does not accept, and it is stated here in full rather than recorded as a value."
