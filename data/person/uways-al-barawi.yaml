summary:
  ar: "الشيخ أويس البراوي (1847-1909)، عالم صومالي يُنسب إليه إحياء الإسلام في شرق أفريقيا في القرن التاسع عشر. وُلد في براوة على ساحل بنادر لمعلّم دين محلي، ودرس العلوم الشرعية والصوفية عند الشيخ الشاشي، ثم رحل نحو سنة 1870 إلى بغداد فأخذ القادرية عن مصطفى بن سلمان الجيلاني وحجّ، وعاد سنة 1883 فصار قائد القادرية في الصومال وأسس فرعها الأويسية المنسوب إليه، وانتشرت دعوته من الصومال وزنجبار إلى كينيا وموزمبيق وشرق الكونغو، وطوّر كتابة الصومالية بالحرف العربي، وكتب قصائد دينية كثيرة. اشتد نزاعه مع الطريقة الصالحية بقيادة محمد عبد الله حسن، فقُتل على أيدي الدراويش سنة 1909 في بيولي."
  en: "Sheikh Uways al-Barawi (1847–1909), Somali scholar credited with reviving Islam in 19th-century East Africa. Born at Barawa on the Benadir coast to a local religious teacher, he studied the religious sciences and Sufism under Sheikh al-Shashi, travelled about 1870 to Baghdad, where he took the Qadiriyya from Mustafa b. Salman al-Jilani and made the Hajj, and returned in 1883 to become leader of the Qadiriyya in Somalia and founder of its Uwaysiyya branch, named after him. His mission spread from Somalia and Zanzibar to Kenya, Mozambique and the eastern Congo; he improved the writing of Somali in Arabic script and composed many religious poems. His conflict with the rival Salihiyya of Mohammed Abdullah Hassan intensified until the Dervishes killed him at Biyoole in 1909."
  ur: "شیخ اویس البراوی (1847ء–1909ء)، صومالی عالم جنہیں انیسویں صدی میں مشرقی افریقا میں اسلام کی احیائی کوششوں کا سرخیل مانا جاتا ہے۔ بنادر ساحل کے براوہ میں ایک مقامی دینی استاد کے گھر پیدا ہوئے، شیخ الشاشی سے علوم و تصوف پڑھے، تقریباً 1870ء میں بغداد جا کر مصطفی بن سلمان الجیلانی سے سلسلہ قادریہ کی اجازت لی اور حج کیا، اور 1883ء میں واپس آ کر صومالیہ میں قادریہ کے قائد اور اس کی شاخ اویسیہ کے بانی بنے۔ ان کی دعوت صومالیہ و زنجبار سے کینیا، موزمبیق اور مشرقی کانگو تک پھیلی، انہوں نے صومالی کو عربی رسم الخط میں لکھنے کو بہتر بنایا اور بہت سی دینی نظمیں کہیں۔ محمد عبد اللہ حسن کی صالحیہ سے کشمکش بڑھی تو 1909ء میں درویشوں نے انہیں بیولے میں قتل کر دیا۔"
