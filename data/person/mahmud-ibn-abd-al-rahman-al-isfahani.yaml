label:
  ar: "محمود بن عبد الرحمن الأصفهاني"
  en: "Mahmud ibn Abd al-Rahman al-Isfahani"
  es: "Mahmud ibn Abd al-Rahman al-Isfahani"
  fr: "Mahmud ibn Abd al-Rahman al-Isfahani"
  ur: "محمود بن عبدالرحمٰن اصفہانی"
roles: [scholar, writer]
gender: male
summary:
  ar: "محمود بن عبد الرحمن، أبو الثناء، شمس الدين الأصفهاني، مفسر عالم بالعقليات، وُلد وتعلم في أصبهان ثم رحل إلى دمشق ثم القاهرة حيث كان شيخ الخانقاه التي بناها له الأمير قوصون بالقرافة، وله تفسير وشروح في الكلام والمنطق والأصول، مات بالطاعون سنة 749 هـ."
  en: "Mahmud ibn Abd al-Rahman, Abu al-Thana', Shams al-Din al-Isfahani, an exegete learned in the rational sciences, born and educated in Isfahan, who went to Damascus and then Cairo, where he was shaykh of the khanqah the Amir Qawsun built for him in al-Qarafa; author of a Tafsir and commentaries on theology, logic and legal theory; died of the plague in 749 AH (1349)."
  es: "Mahmud ibn Abd al-Rahman, Abu al-Thana', Shams al-Din al-Isfahani, un exegeta versado en las ciencias racionales, nacido y educado en Isfahán, que fue a Damasco y luego a El Cairo, donde fue shaykh de la khanqah que el Amir Qawsun construyó para él en al-Qarafa; autor de un Tafsir y comentarios sobre teología, lógica y teoría jurídica; murió de peste en el año 749 de la Hégira (1349)."
  fr: "Mahmud ibn Abd al-Rahman, Abu al-Thana', Shams al-Din al-Isfahani, exégète versé dans les sciences rationnelles, né et éduqué à Ispahan, qui se rendit à Damas puis au Caire, où il fut cheikh de la khanqah que l'émir Qawsun fit construire pour lui à al-Qarafa; auteur d'un Tafsir et de commentaires sur la théologie, la logique et la théorie juridique; mourut de la peste en 749 AH (1349)."
  ur: "محمود بن عبدالرحمن، ابو الثنا'، شمس الدین اصفہانی، عقلی علوم میں سیکھنے والے ایک مفسر، اصفہان میں پیدا ہوئے اور تعلیم حاصل کی، جو دمشق اور پھر قاہرہ گئے، جہاں وہ خانقاہ کے شیخ تھے جو امیر قوسن نے اس کے لیے القفہ میں تعمیر کی تھی۔ الہیات، منطق اور قانونی نظریہ پر تفسیر اور تفسیر کے مصنف؛ طاعون سے 749ھ (1349) میں وفات پائی۔"
  tr: "Mahmud bin Abdülrehman, Ebu el-Thana, Şemseddin el-İsfahani, akıl kavramları üzerine akademik bir yorumcuydu. İsfahan'da doğup eğitim aldı, ardından Şam'a ve ardından Kahire'ye seyahat etti; burada El-Karafa'da Prens Kusun tarafından kendisi için inşa edilen hankanın şeyhiydi. Teoloji, mantık ve ilkeler üzerine tefsirler ve tefsirler yazdı. 749 Hicri'de veba hastalığından öldü."
  id: "Mahmoud ibn Abd al-Rahman, Abu al-Thana, Shams al-Din al-Isfahani, adalah seorang komentator ilmiah tentang rasionalitas. Ia lahir dan dididik di Isfahan, kemudian pergi ke Damaskus dan kemudian ke Kairo, di mana ia menjadi sheikh khanqah yang dibangun untuknya oleh Pangeran Qusun di al-Qarafa. Ia menulis tafsiran dan komentar tentang teologi, logika, dan prinsip. Ia meninggal karena wabah pada tahun 749 H."
