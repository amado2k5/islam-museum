summary:
  ar: فهمي هويدي ⁦(1937–)⁩ صحفي وكاتب عمود ومفكر مصري من أبرز أقلام العالم العربي، عمل نائبًا لرئيس تحرير الأهرام، ويشتهر بجعل الإسلام إطارًا مرجعيًا لمقالاته وكتاباته عن الأقليات المسلمة في العالم، ومن كتبه «مواطنون لا ذميون» و«القرآن والسلطان» و«إيران من الداخل».
  en: Fahmy Howeidy (born 1937) is an Egyptian columnist, journalist and thinker, one of the Arab world's most widely read opinion writers, a former deputy editor-in-chief of Al-Ahram, known for writing
    with Islam as his frame of reference and for chronicling Muslim minorities worldwide; his books include Citizens Not Dhimmis, The Quran and the Sultan and Iran from Within.
  ur: فہمی ہویدی ⁦(1937–)⁩ مصری کالم نگار، صحافی اور مفکر ہیں جو عرب دنیا کے زیادہ پڑھے جانے والے رائے نگاروں میں شمار ہوتے ہیں؛ الاہرام کے نائب مدیرِ اعلیٰ رہے اور اسلام کو اپنی تحریروں کا مرجع بنانے اور
    دنیا بھر کی مسلم اقلیتوں پر لکھنے کے لیے معروف ہیں؛ ان کی کتب میں «مواطنون لا ذمیون»، «القرآن والسلطان» اور «ایران من الداخل» شامل ہیں۔
  es: "Fahmy Howeidy (nacido en 1937) es un columnista, periodista y pensador egipcio, uno de los columnistas de opinión más leídos del mundo árabe, ex subdirector de Al-Ahram, conocido por escribir con el Islam como marco de referencia y por documentar las minorías musulmanas en todo el mundo; entre sus libros se incluyen Ciudadanos, no dhimmis, El Corán y el sultán e Irán desde dentro."
  fr: "Fahmy Howeidy (né en 1937) est un chroniqueur, journaliste et penseur égyptien, l'un des auteurs d'opinion les plus lus du monde arabe, ancien rédacteur en chef adjoint d'Al-Ahram, connu pour écrire avec l'islam comme cadre de référence et pour chroniquer les minorités musulmanes dans le monde entier; ses livres incluent Citoyens et non dhimmis, Le Coran et le Sultan et L'Iran de l'intérieur."
  tr: "Fahmi Howeidi (1937–), Mısırlı bir gazeteci, köşe yazarı ve düşünürdü; Arap dünyasının en önde gelen yazarlarından biriydi. Al-Ahram dergisinin genel yayın yönetmen yardımcısı olarak görev yaptı ve dünya çapındaki Müslüman azınlıklar hakkında yazdığı makale ve yazılarda İslam'ı bir referans çerçevesi olarak kullanmasıyla tanınır. Kitapları arasında \"Zimmisiz Vatandaşlar\", \"Kur'an ve Sultan\" ve \"İçeriden İran\" yer almaktadır."
  id: "Fahmi Howeidi (1937–) adalah seorang jurnalis, kolumnis, dan pemikir Mesir, salah satu penulis paling terkemuka di dunia Arab. Ia menjabat sebagai wakil pemimpin redaksi Al-Ahram dan dikenal karena menggunakan Islam sebagai kerangka acuan untuk artikel dan tulisannya tentang minoritas Muslim di seluruh dunia. Buku-bukunya meliputi \"Warga Tanpa Dhimmis,\" \"Al-Quran dan Sultan,\" dan \"Iran dari Dalam Negeri.\""
