  ar: فهمي هويدي ⁦(1937–)⁩ صحفي وكاتب عمود مصري من أبرز أقلام العالم العربي، عمل نائبًا لرئيس تحرير الأهرام، ويشتهر بجعل الإسلام إطارًا مرجعيًا لمقالاته وكتاباته عن الأقليات المسلمة في العالم.
  en: Fahmy Howeidy (born 1937) is an Egyptian columnist and journalist, one of the Arab world's most widely read opinion writers, a former deputy editor-in-chief of Al-Ahram, known for writing with Islam
    as his frame of reference and for chronicling Muslim minorities worldwide.
  ur: فہمی ہویدی ⁦(1937–)⁩ مصری کالم نگار اور صحافی ہیں جو عرب دنیا کے زیادہ پڑھے جانے والے رائے نگاروں میں شمار ہوتے ہیں؛ الاہرام کے نائب مدیرِ اعلیٰ رہے اور اسلام کو اپنی تحریروں کا مرجع بنانے اور دنیا
    بھر کی مسلم اقلیتوں پر لکھنے کے لیے معروف ہیں۔
