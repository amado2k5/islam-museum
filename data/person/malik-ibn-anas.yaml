summary:
  ar: "إمام دار الهجرة وصاحب الموطأ؛ ولد بالمدينة المنورة وأخذ عن علمائها، واشتهر بالفتيا والتدريس فيها حتى توفي سنة 179هـ. يُنسب إليه المذهب المالكي. وعند ابن النديم مالك بن أنس بن أبي عامر من حمير وعداده في بني تيم بن مرة من قريش وحمل به ثلاث سنين وكان شديد البياض إلى الشقرة طويلا عظيم الهامة أصلع الرأس يلبس الثياب العدنية الجياد ويكثر حلق شاربه ولا يغير شيبه، وكان يأتي المسجد ويشهد الصلوات ويعود المرضى ويقضي الحقوق ثم ترك الجلوس في المسجد وترك اتباع الجنائز فكان يقول ليس يقدر كل أحد يقول عذره، وسعى به إلى جعفر بن سليمان وكان والي المدينة فقيل له إنه لا يرى إيمان بيعتكم فدعى به وجرده وضربه أسواطا ومددوه فانخلع كتفه وارتكب منه أمر عظيم فلم يزل بعد ذلك في علو ورفعة وكأنما كانت تلك السياط حليا عليه، فقيه الحجاز وسيدها في وقته العلم وتوفي سنة تسع وسبعين ومائة وهو ابن خمس وثمانين ودفن بالبقيع، وله كتاب الموطأ وكتاب رسالته إلى الرشيد رواها أبو بكر بن عبد العزيز من ولد عمر بن الخطاب {cite:fihrist-ibn-al-nadim p. 280-281}"
  en: "Imam of Medina and author of the Muwatta; born in Medina, he studied with its scholars and taught there until his death in 179 AH. The Maliki school of law bears his name."
