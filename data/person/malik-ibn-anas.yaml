summary:
  ar: "إمام دار الهجرة وصاحب الموطأ؛ ولد بالمدينة المنورة وأخذ عن علمائها، واشتهر بالفتيا والتدريس فيها حتى توفي سنة 179هـ. يُنسب إليه المذهب المالكي. وعند ابن النديم مالك بن أنس بن أبي عامر من حمير وعداده في بني تيم بن مرة من قريش وحمل به ثلاث سنين وكان شديد البياض إلى الشقرة طويلا عظيم الهامة أصلع الرأس يلبس الثياب العدنية الجياد ويكثر حلق شاربه ولا يغير شيبه، وكان يأتي المسجد ويشهد الصلوات ويعود المرضى ويقضي الحقوق ثم ترك الجلوس في المسجد وترك اتباع الجنائز فكان يقول ليس يقدر كل أحد يقول عذره، وسعى به إلى جعفر بن سليمان وكان والي المدينة فقيل له إنه لا يرى إيمان بيعتكم فدعى به وجرده وضربه أسواطا ومددوه فانخلع كتفه وارتكب منه أمر عظيم فلم يزل بعد ذلك في علو ورفعة وكأنما كانت تلك السياط حليا عليه، فقيه الحجاز وسيدها في وقته العلم وتوفي سنة تسع وسبعين ومائة وهو ابن خمس وثمانين ودفن بالبقيع، وله كتاب الموطأ وكتاب رسالته إلى الرشيد رواها أبو بكر بن عبد العزيز من ولد عمر بن الخطاب {cite:fihrist-ibn-al-nadim p. 280-281} وتذكر دائرة المعارف الإسلامية أن تاريخ مولده غير معروف وأن التواريخ المذكورة تتراوح بين 90 و97هـ، وأنه توفي سنة 179هـ في المدينة ودُفن في البقيع، وأن الموطأ أقدم كتاب فقه إسلامي وصل إلينا بعد مجموع زيد بن علي."
  en: "Imam of Medina and author of the Muwatta; born in Medina, he studied with its scholars and taught there until his death in 179 AH. The Maliki school of law bears his name. The Encyclopaedia of Islam says the date of his birth is not known, the proposed dates ranging between 90 and 97 AH, and that he died in Medina in 179 AH and was buried in al-Baqi. It describes the Muwatta as the earliest surviving Muslim law book after the legal corpus of Zayd ibn Ali, and says the few certain facts of his life are buried under legends."
  ur: "مدینہ کے امام اور موطأ کے مصنف۔ دائرۃ المعارف اسلامیہ کے مطابق ان کی تاریخ پیدائش معلوم نہیں اور بتائی گئی تاریخیں 90 سے 97ھ کے درمیان ہیں۔ وہ 179ھ میں مدینہ میں فوت ہوئے اور بقیع میں دفن ہوئے، اور مالکی مذہب انھی کے نام پر ہے۔ مضمون موطأ کو زید بن علی کے مجموعے کے بعد سب سے پرانی موجود مسلم قانونی کتاب کہتا ہے۔"
