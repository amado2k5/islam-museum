summary:
  ar: "إمام دار الهجرة وصاحب الموطأ؛ ولد بالمدينة المنورة وأخذ عن علمائها، واشتهر بالفتيا والتدريس فيها حتى توفي سنة 179هـ. يُنسب إليه المذهب المالكي. وعند ابن النديم مالك بن أنس بن أبي عامر من حمير وعداده في بني تيم بن مرة من قريش وحمل به ثلاث سنين وكان شديد البياض إلى الشقرة طويلا عظيم الهامة أصلع الرأس يلبس الثياب العدنية الجياد ويكثر حلق شاربه ولا يغير شيبه، وكان يأتي المسجد ويشهد الصلوات ويعود المرضى ويقضي الحقوق ثم ترك الجلوس في المسجد وترك اتباع الجنائز فكان يقول ليس يقدر كل أحد يقول عذره، وسعى به إلى جعفر بن سليمان وكان والي المدينة فقيل له إنه لا يرى إيمان بيعتكم فدعى به وجرده وضربه أسواطا ومددوه فانخلع كتفه وارتكب منه أمر عظيم فلم يزل بعد ذلك في علو ورفعة وكأنما كانت تلك السياط حليا عليه، فقيه الحجاز وسيدها في وقته العلم وتوفي سنة تسع وسبعين ومائة وهو ابن خمس وثمانين ودفن بالبقيع، وله كتاب الموطأ وكتاب رسالته إلى الرشيد رواها أبو بكر بن عبد العزيز من ولد عمر بن الخطاب {cite:fihrist-ibn-al-nadim p. 280-281} وتذكر دائرة المعارف الإسلامية أن تاريخ مولده غير معروف وأن التواريخ المذكورة تتراوح بين 90 و97هـ، وأنه توفي سنة 179هـ في المدينة ودُفن في البقيع، وأن الموطأ أقدم كتاب فقه إسلامي وصل إلينا بعد مجموع زيد بن علي."
  en: "Imam of Medina and author of the Muwatta; born in Medina, he studied with its scholars and taught there until his death in 179 AH. The Maliki school of law bears his name. The Encyclopaedia of Islam says the date of his birth is not known, the proposed dates ranging between 90 and 97 AH, and that he died in Medina in 179 AH and was buried in al-Baqi. It describes the Muwatta as the earliest surviving Muslim law book after the legal corpus of Zayd ibn Ali, and says the few certain facts of his life are buried under legends."
  ur: "مدینہ کے امام اور موطأ کے مصنف۔ دائرۃ المعارف اسلامیہ کے مطابق ان کی تاریخ پیدائش معلوم نہیں اور بتائی گئی تاریخیں 90 سے 97ھ کے درمیان ہیں۔ وہ 179ھ میں مدینہ میں فوت ہوئے اور بقیع میں دفن ہوئے، اور مالکی مذہب انھی کے نام پر ہے۔ مضمون موطأ کو زید بن علی کے مجموعے کے بعد سب سے پرانی موجود مسلم قانونی کتاب کہتا ہے۔"
  es: "Imán de Medina y autor del Muwatta; nacido en Medina, estudió con sus eruditos y enseñó allí hasta su muerte en el año 179 de la Hégira. La escuela jurídica Maliki lleva su nombre. La Enciclopedia del Islam afirma que se desconoce la fecha de su nacimiento, aunque se barajan fechas entre el 90 y el 97 de la Hégira, y que falleció en Medina en el año 179 de la Hégira y fue enterrado en al-Baqi. Describe el Muwatta como el libro de derecho musulmán más antiguo que se conserva después del corpus jurídico de Zayd ibn Ali, y señala que los pocos datos certeros sobre su vida están envueltos en leyendas."
  fr: "L'imam de Médine et auteur de la Muwatta, né à Médine, étudia auprès des savants de la ville et y enseigna jusqu'à sa mort en 179 AH. L'école de droit malikite porte son nom. L'Encyclopédie de l'Islam indique que sa date de naissance est inconnue, les dates proposées se situant entre 90 et 97 AH, et qu'il mourut à Médine en 179 AH et fut inhumé à al-Baqi. Elle décrit la Muwatta comme le plus ancien ouvrage de droit musulman parvenu jusqu'à nous après le corpus juridique de Zayd ibn Ali, et précise que les rares faits avérés de sa vie sont entourés de légendes."
  tr: "Göç Hanedanı imamı ve Al-Muwatta'nın yazarı; Medine'de doğmuş, alimlerinin yanında eğitim görmüş ve 179 Hicri'de vefat edene kadar fetva yayımlaması ve orada ders vermesi ile tanınmıştır. Maliki mezhebine atfedilir. İbn el-Nadim Malik ibn Anas ibn Abi Amir ile Himyar'dan geliyordu ve numarası Kurayşlı Banu Taym ibn Murrah'taydı. Üç yıl boyunca hamileydi. Çok açık saçlı, uzun boylu, iri yapılı, kel başlı, Adeni atlarının kıyafetlerini giyerdi, sık sık bıyığını tıraş ederdi ve gri saçlarını değiştirmezdi. Camiye gelir, namaz kılırdı, hastaları ziyaret eder ve haklarını yerine getirirdi. Sonra camide oturmayı bıraktı ve cenazelere katılmayı bıraktı. Herkesin bahanesini dile getiremeyeceğini söylerdi. Bunu Ja'far ibn Sulayman'a götürdü, o da Medine valisine senin yeminin inancını görmediği söylendi, bu yüzden onu çağırdı, ayaklarını soydu, kamçılarla vurdu ve uzattı, fakat omzunu çıkardı ve ona karşı büyük bir iş yaptı. Sonrasında da yükseltilmiş ve yükseltildi, sanki o kamçılar üzerinde bir süslermiş gibi. Hicaz'ın hukukçusu ve zamanında bilginin ustasıydı. 179 Hicri yılında, seksen beş yaşında öldü ve El-Baki'de defnedildi. Ayrıca Ebu Bekir bin Abdülaziz tarafından Ömer bin el-Hattab'ın soyundan anlatılan Al-Muwatta' adlı kitabı ve El-Reşid'e yazdığı mektubunu da yazdı. {atıf: Fihrist-ibn-al-Nadim s. 280-281} İslam Ansiklopedisi, doğum tarihinin bilinmediğini, tarihlerin 90 ile 97 H. arasında olduğunu, 179 Hicri'de Medine'de öldüğünü ve El-Baki'de gömüldüğünü, Muwatta'nın ise Zeyd bin Ali koleksiyonundan sonra bize ulaşan en eski İslami hukuk kitabı olduğunu belirtir."
  id: "Imam dari Rumah Migrasi dan penulis Al-Muwatta; lahir di Madinah, belajar di bawah bimbingan para ulamanya, dan terkenal karena mengeluarkan fatwa serta mengajar di sana hingga wafat pada tahun 179 H. Ia dikaitkan dengan aliran pemikiran Maliki. Dengan Ibn al-Nadim Malik ibn Anas ibn Abi Amir dari Himyar dan nomornya adalah Banu Taym ibn Murrah dari Quraisy. Dia hamil selama tiga tahun. Dia sangat cerah sampai pirang, tinggi, bertubuh besar, botak, mengenakan pakaian kuda Adeni, sering mencukur kumisnya, dan tidak mengubah rambut abu-abunya. Dia datang ke masjid, menghadiri shalat, mengunjungi orang sakit, dan menegakkan haknya. Kemudian dia berhenti duduk di masjid dan berhenti menghadiri pemakaman. Dia biasa berkata bahwa tidak semua orang bisa mengungkapkan alasannya. Dia membawanya kepada Ja'far ibn Sulayman, yang Gubernur Madinah diberitahu bahwa ia tidak melihat kepercayaan pada janjimu, maka ia memanggilnya, memecah kakinya, memukulnya dengan cambuk, dan mengulurkannya, tetapi ia terkilir bahunya dan melakukan tindakan besar terhadapnya. Ia tetap diangkat dan diangkat setelah-saat itu, seolah-olah cambuk itu hanyalah perhiasan di tubuhnya. Ia adalah ahli hukum Hijaz dan penguasa ilmu pengetahuan di zamannya. Ia meninggal pada tahun 179 H pada usia delapan puluh lima tahun dan dimakamkan di Al-Baqi'. Ia juga menulis kitab Al-Muwatta dan suratnya kepada Al-Rashid, yang diceritakan oleh Abu Bakr ibn Abd al-Aziz dari keturunan Umar ibn al-Khattab. {kutip: fihrist-ibn-al-nadim hlm. 280-281} Ensiklopedia Islam mencatat bahwa tanggal lahirnya tidak diketahui, dengan tanggal antara 90 hingga 97 H, bahwa ia meninggal pada tahun 179 H. di Madinah dan dimakamkan di Al-Baqi', serta bahwa Muwatta adalah buku fiqhbiden Islam tertua yang sampai kepada kita setelah pengumpulan Zayd ibn Ali."
