summary:
  ar: "إبراهيم بن حسن بن إسحاق التونسي، أبو إسحاق، فقيه وأصولي مالكي، جليل فاضل صالح، تفقه بأبي بكر بن عبد الرحمن وأبي عمران الفاسي، وكان مدرسا بالقيروان ومستشارا فيها، امتحن مع فقهائها محنة عظيمة سنة 437هـ ثم عاد إلى القيروان وتوفي فيها. من تصانيفه «التعليقة على كتاب ابن المواز» و«التعليقة على المدونة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2057}"
  en: "Ibrahim ibn Hasan ibn Ishaq al-Tunisi, Abu Ishaq, a Maliki jurist and usuli, excellent and devout. He studied with Abu Bakr ibn Abd al-Rahman and Abu Imran al-Fasi, and many North African jurists studied with him in turn. He taught in Qayrawan and was consulted there, suffered a severe trial with the jurists of Qayrawan in 437 AH, and died there. His works include glosses on the book of Ibn al-Mawwaz and glosses on the Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2057}"
