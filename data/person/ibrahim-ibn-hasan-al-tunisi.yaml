summary:
  ar: "إبراهيم بن حسن بن إسحاق التونسي، أبو إسحاق، فقيه وأصولي مالكي، جليل فاضل صالح، تفقه بأبي بكر بن عبد الرحمن وأبي عمران الفاسي، وكان مدرسا بالقيروان ومستشارا فيها، امتحن مع فقهائها محنة عظيمة سنة 437هـ ثم عاد إلى القيروان وتوفي فيها. من تصانيفه «التعليقة على كتاب ابن المواز» و«التعليقة على المدونة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2057}"
  en: "Ibrahim ibn Hasan ibn Ishaq al-Tunisi, Abu Ishaq, a Maliki jurist and usuli, excellent and devout. He studied with Abu Bakr ibn Abd al-Rahman and Abu Imran al-Fasi, and many North African jurists studied with him in turn. He taught in Qayrawan and was consulted there, suffered a severe trial with the jurists of Qayrawan in 437 AH, and died there. His works include glosses on the book of Ibn al-Mawwaz and glosses on the Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2057}"
  es: "Ibrahim ibn Hasan ibn Ishaq al-Tunisi, Abu Ishaq, jurista y usuli malikí, fue un hombre excelente y devoto. Estudió con Abu Bakr ibn Abd al-Rahman y Abu Imran al-Fasi, y muchos juristas del norte de África estudiaron con él. Enseñó en Qayrawan, donde era consultado, sufrió un duro juicio con los juristas de Qayrawan en el año 437 de la Hégira y falleció allí. Entre sus obras se incluyen glosas sobre el libro de Ibn al-Mawwaz y sobre la Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2057}"
  fr: "Ibrahim ibn Hasan ibn Ishaq al-Tunisi, dit Abu Ishaq, juriste malikite et usuli, était un homme excellent et pieux. Il étudia auprès d'Abu Bakr ibn Abd al-Rahman et d'Abu Imran al-Fasi, et de nombreux juristes d'Afrique du Nord furent à leur tour ses élèves. Il enseigna à Qayrawan, où il était consulté. En 437 AH, il subit un procès sévère devant les juristes de Qayrawan et y mourut. Parmi ses œuvres figurent des gloses sur le livre d'Ibn al-Mawwaz et des gloses sur la Mudawwana."
  ur: "ابراہیم بن حسن بن اسحاق التونیسی، ابو اسحاق، ایک مالکی فقیہ اور اصولی، بہترین اور متقی۔ اس نے ابوبکر بن عبدالرحمن اور ابو عمران الفاسی سے تعلیم حاصل کی اور شمالی افریقہ کے بہت سے فقہاء نے ان کے ساتھ مطالعہ کیا۔ آپ نے قیروان میں تعلیم دی اور وہاں سے مشورہ کیا، 437 ہجری میں فقہائے قیروان کے ساتھ سخت آزمائش کا سامنا کیا اور وہیں وفات پائی۔ ان کی تصانیف میں ابن المواز کی کتاب پر ٹیکہ اور مدوانہ پر گلوز شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 2056}"
