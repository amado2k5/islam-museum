kids:
  ar: "ألفونسو السادس ملك نصراني من شمال إسبانيا، أخذ مدينة طليطلة سنة 1085م ثم هزمه المرابطون في معركة الزلاقة."
  en: "Alfonso VI was a Christian king from northern Spain who took the city of Toledo in 1085 and was then defeated by the Almoravids at the Battle of al-Zallaqa."
  ur: "الفونسو ششم شمالی ہسپانیہ کے ایک عیسائی بادشاہ تھے جنہوں نے 1085ء میں طلیطلہ شہر لیا اور پھر زلاقہ کی جنگ میں مرابطین کے ہاتھوں شکست کھائی۔"
