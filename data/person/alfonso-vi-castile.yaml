summary:
  ar: "ألفونسو السادس ملك قشتالة وليون، دخل طليطلة في 27 محرم 478هـ/25 مايو 1085م بعد معاهدة مع القادر بن ذي النون، وكان قبل ذلك يفرض الجزية على ملوك الطوائف ومنهم المعتمد بن عباد، وقد وصل في غارته على إشبيلية إلى طريف. استنجد ملوك الأندلس بيوسف بن تاشفين فهزمه في الزلاقة يوم الجمعة 12 رجب 479هـ/23 أكتوبر 1086م، وتصفه دائرة المعارف الإسلامية بأنه حريص على القتال في تلك المعركة {cite:encyclopaedia-of-islam-2 vol. 10 p. 656} {cite:encyclopaedia-of-islam-2 vol. 7 p. 821} {cite:encyclopaedia-of-islam-2 vol. 11 p. 444}."
  en: "Alfonso VI, king of León and Castile, entered Toledo on 27 Muharram 478/25 May 1085 after a treaty with al-Qadir ibn Dhi al-Nun. Before that he had levied tribute on the taifa kings, among them al-Mu'tamid ibn Abbad, and in a raid on the kingdom of Seville he reached Tarifa. The Andalusian rulers called on Yusuf ibn Tashfin, who defeated him at al-Zallaqa on Friday 12 Rajab 479/23 October 1086; the Encyclopaedia of Islam describes him as eager to give battle there {cite:encyclopaedia-of-islam-2 vol. 10 p. 656} {cite:encyclopaedia-of-islam-2 vol. 7 p. 821} {cite:encyclopaedia-of-islam-2 vol. 11 p. 444}."
  ur: "الفونسو ششم، شاہ لیون و قشتالہ، 27 محرم 478ھ/25 مئی 1085ء کو القادر بن ذی النون سے معاہدے کے بعد طلیطلہ میں داخل ہوئے۔ اس سے پہلے وہ ملوک الطوائف، جن میں المعتمد بن عباد بھی تھے، پر خراج لگاتے رہے اور اشبیلیہ کی مملکت پر ایک چڑھائی میں طریف تک پہنچ گئے۔ اندلس کے حکمرانوں نے یوسف بن تاشفین کو بلایا جنہوں نے جمعہ 12 رجب 479ھ/23 اکتوبر 1086ء کو زلاقہ میں انہیں شکست دی؛ دائرۃ المعارف الاسلامیہ بتاتا ہے کہ اس معرکے میں وہ لڑنے کے لیے بے تاب تھے {cite:encyclopaedia-of-islam-2 vol. 10 p. 656} {cite:encyclopaedia-of-islam-2 vol. 7 p. 821} {cite:encyclopaedia-of-islam-2 vol. 11 p. 444}."
