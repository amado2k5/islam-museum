summary:
  ar: "آصف الدولة (23 سبتمبر 1748 – 21 سبتمبر 1797)، نواب أوده الرابع، ابن شجاع الدولة، حكم من 1775 إلى 1797. نقل العاصمة من فيض آباد إلى لكهنؤ، وجعلها مركزاً للثقافة والعمارة، فبنى فيها الإمام بارة الكبيرة المعروفة بالحسينية الآصفية سنة 1784 إغاثةً لأهلها في المجاعة، وبوابة رومي دروازه، ودُفن في حسينيته. كان شاعراً بالأردية والفارسية وله ديوان."
  en: "Asaf-ud-Daula (23 September 1748 – 21 September 1797) was the fourth Nawab of Awadh, a son of Shuja-ud-Daula, reigning from 1775 to 1797. He moved the capital from Faizabad to Lucknow and made it a centre of culture and building, raising there the Bara Imambara in 1784 as famine relief and the Rumi Darwaza; he was buried in his own Imambara. He was a poet in Urdu and Persian with a diwan to his name."
  ur: "آصف الدولہ (23 ستمبر 1748ء – 21 ستمبر 1797ء) اودھ کے چوتھے نواب، شجاع الدولہ کے فرزند، 1775ء سے 1797ء تک حکمران رہے۔ آپ نے دارالحکومت فیض آباد سے لکھنؤ منتقل کیا اور اسے ثقافت و تعمیر کا مرکز بنایا؛ وہیں 1784ء میں قحط کے دوران روزگار کی فراہمی کے لیے بڑا امام باڑہ اور رومی دروازہ تعمیر کرایا، اور اپنے ہی امام باڑے میں دفن ہوئے۔ آپ اردو و فارسی کے شاعر تھے اور آپ کا دیوان یادگار ہے۔"

