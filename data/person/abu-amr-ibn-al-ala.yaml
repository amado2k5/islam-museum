label: { ar: "أبو عمرو بن العلاء", en: "Abu Amr ibn al-Ala'" }
summary:
  ar: "أبو عمرو بن العلاء اللغوي؛ عند البلاذري عن الأثرم عن أبي عبيدة عنه قال لما رأت العرب كثرة القرى والنخل والشجر قالوا ما رأينا سواداً أكثر والسواد الشخص فلذلك سمي السواد سواداً. وعند المسعودي مات سنة أربع وخمسين ومائة في أيام المنصور {cite:muruj-al-dhahab p. 293}، وأول السبعة في فهرس ابن النديم، روى عنه قراءته أحمد بن زيد الحلواني في كتاب قراءة أبي عمرو وعصمة بن أبي عصمة واليزيدي {cite:fihrist-ibn-al-nadim p. 71-72}"
  en: "Abu Amr ibn al-Ala' the philologist; in al-Baladhuri via al-Athram from Abu Ubayda from him: when the Arabs saw the many villages, palms and trees they said 'we never saw a greater mass' — al-sawad meaning the multitude — hence the Sawad's name."
