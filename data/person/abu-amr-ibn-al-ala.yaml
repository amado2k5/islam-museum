label: { ar: "أبو عمرو بن العلاء", en: "Abu Amr ibn al-Ala'", fr: "Abu Amr ibn al-Ala'", es: "Abu Amr ibn al-Ala'", ur: "ابو عمرو بن العلاء" }
summary:
  ar: "أبو عمرو بن العلاء اللغوي؛ عند البلاذري عن الأثرم عن أبي عبيدة عنه قال لما رأت العرب كثرة القرى والنخل والشجر قالوا ما رأينا سواداً أكثر والسواد الشخص فلذلك سمي السواد سواداً. وعند المسعودي مات سنة أربع وخمسين ومائة في أيام المنصور {cite:muruj-al-dhahab p. 293}، وأول السبعة في فهرس ابن النديم، روى عنه قراءته أحمد بن زيد الحلواني في كتاب قراءة أبي عمرو وعصمة بن أبي عصمة واليزيدي {cite:fihrist-ibn-al-nadim p. 71-72}"
  en: "Abu Amr ibn al-Ala' the philologist; in al-Baladhuri via al-Athram from Abu Ubayda from him: when the Arabs saw the many villages, palms and trees they said 'we never saw a greater mass' — al-sawad meaning the multitude — hence the Sawad's name."
  fr: "Abu Amr ibn al-Ala' le philologue ; chez al-Baladhuri, par al-Athram d'après Abu Ubayda d'après lui : lorsque les Arabes virent la multitude des villages, des palmiers et des arbres, ils dirent « nous n'avons jamais vu masse plus grande » — al-sawad signifiant la multitude —, d'où le nom du Sawad."
  es: "Abu Amr ibn al-Ala', el filólogo; en al-Baladhuri, vía al-Athram, de Abu Ubayda, de él: cuando los árabes vieron las numerosas aldeas, palmeras y árboles dijeron: «Nunca habíamos visto una masa mayor» — al-sawad significa la multitud — de ahí el nombre de Sawad."
  ur: "ابو عمرو بن العلاء ماہر فلکیات؛ البلادوری میں ابو عبیدہ سے الاتھرم کے ذریعے: جب عربوں نے بہت سے گاؤں، کھجور اور درختوں کو دیکھا تو وہ کہتے تھے کہ 'ہم نے اس سے زیادہ بڑے پیمانے پر کبھی نہیں دیکھا' - السواد کا مطلب ہے ہجوم - اس لیے سواد کا نام رکھا گیا۔"
