id: person/ibn-uthbah-al-judhami
class: person
label: { ar: "أبو عبد الله ابن عتبة الجذعمي المالكي" }
summary:
  ar: "أبو عبد الله محمد بن عتبة الجذعمي مولاهم المالكي، مفتي قرطبة وعالمها ومحدثها وورعها؛ توفي في صفر سنة ثلاث وستين وأربعمائة ومشى في جنازته أحمد بن عباد وله تسع وسبعون سنة {cite:shadharat-dhahab p. 316}."
  en: "Abu Abdallah Muhammad b. Utba al-Judhami — Cordoba's Maliki mufti, scholar, muhaddith and ascetic; died Safar 463, Ahmad b. Abbad walking in his funeral, aged seventy-nine {cite:shadharat-dhahab p. 316}."
  es: "Abu Abdallah Muhammad b. Utba al-Judhami: muftí, erudito, muhaddith y asceta Maliki de Córdoba; murió Safar 463, Ahmad b. Abbad caminando en su funeral, de setenta y nueve años {cita: shadharat-dhahab p. 316}."
  fr: "Abou Abdallah Muhammad b. Utba al-Judhami — Mufti Maliki de Cordoue, érudit, muhaddith et ascète; mort Safar 463, Ahmad b. Abbad marchant à ses funérailles, âgé de soixante-dix-neuf ans {cite: shadharat-dhahab p. 316}."
  ur: "ابو عبداللہ محمد بن عتبہ الجودمی - قرطبہ کے مالکی مفتی، عالم، محدث اور سنیاسی؛ متوفی صفر 463، احمد بن۔ عباد اپنے جنازے میں پیدل چلتے ہوئے، انتالیس سال کی عمر {حوالہ: شدھارت ذہاب ص۔ 316}۔"
  tr: "Malikilerin özgür bırakılmış kölesi, Kordoba müftüsü, alimi, hadis alimi ve dindar olan Ebu Abdullah Muhammed bin Utbah el-Cedemi; dört yüz altmış üçüncü yılda Sefer'de öldü ve Ahmed ibn Abbad, yetmiş dokuz yaşında onun cenaze alayına katıldı {atıf:Shadharat-Dhahab, s. 316}."
  id: "Abu Abdullah Muhammad ibn Utbah al-Jadh'ami, budak mereka yang telah dibebaskan dari Maliki, Mufti Cordoba, ulama, ulama hadis, dan saleh di sana; ia meninggal di Safar pada tahun empat ratus enam puluh tiga, dan Ahmad ibn Abbad menghadiri prosesi pemakamannya, pada usia tujuh puluh sembilan {cite:shadharat-dhahab, hlm. 316}."
