summary:
  ar: "مصلح الدين مصطفى القسطلاني الرومي الحنفي من موالي الروم؛ قرأ على موالي الروم وخدم الملا خضر بك ودرّس في بعض المدارس، ولما بناها السلطان محمد خان أعطاه واحدة من المدارس الثمان بالقسطنطينية، وكان لا يفتر عن الاشتغال والدرس وكان يدّعي أنه لو أُعطي المدارس الثمان كلها لقدر أن يدرّس في كل واحدة منها كل يوم ثلاثة دروس؛ ثم ولى قضاء بروسا ثلاث مرات ثم قضاء أدرنة كذلك ثم القسطنطينية كذلك ثم ولاه السلطان محمد قضاء العسكر، وكان لا يداري الناس ويتكلم بالحق على كل حال فضاق الأمر على الوزير محمد باشا القرماني حتى قسم قضاء العسكر بين روم إيلي وأناضول، فلما مات السلطان محمد وتولى ولده بايزيد خان عزل القسطلاني وعيّن له على اليوم مائة درهم؛ قال في الكواكب السائرة كان القسطلاني يداوم أكل الحشيش والكيف وكان مع ذلك ذكياً فائقاً للعلوم حديد المحاضرة، وأُخبر عن نفسه أنه طالع الشفاء لابن سينا في ليالٍ، ولم يهتم بأمر التصنيف لاشتغاله بالدرس والقضاء لكنه كتب حواشي على شرح العقائد ورسالة ذكر فيها سبع إشكالات وحواشي على المقدمات الأربع التي أبدعها صدر الشريعة وردّ فيها على حواشي الملا علي العربي؛ توفي في هذه السنة بالقسطنطينية ودفن بجوار أبي أيوب الأنصاري {cite:shadharat-dhahab p. 427-428}."
  en: "One of Mehmed II's Eight Madrasas teachers — he claimed he could deliver three lessons a day in each of all eight; thrice qadi of Bursa, of Edirne and of Constantinople, then qadi al-'askar, so plain-spoken that vizier Muhammad Pasha al-Qaramani had the office split in two to curb him; Bayezid II pensioned him off at a hundred dirhams a day; al-Ghazzi notes he took hashish daily yet was so quick he read Ibn Sina's Shifa' in a few nights; wrote glosses on Sharh al-'Aqa'id, a treatise on seven difficulties, and glosses on Sadr al-Shari'a's Four Muqaddimat answering Molla 'Ali al-'Arabi; d. 901, buried beside Abu Ayyub {cite:shadharat-dhahab p. 427-428}."
died: { edtf: "1495/1496", hijri: "0901", calendar: julian, precision: year, status: tradition, derived: true, note: "901 بالقسطنطينية، دفن بجوار أبي أيوب {cite:shadharat-dhahab p. 428}", sources: [source/shadharat-dhahab] }
