summary:
  ar: "علاء الدين القلقشندي الشافعي القرشي؛ ولد بالقاهرة في ذي الحجة سنة ثمان وسبعين وسبعمائة ونشأ بها وحفظ القرآن العظيم وعدة متون في مذهبه وتفقه بعلماء عصره كالسراج البلقيني وولده جلال الدين والعز بن جماعة وسراج الدين بن الملقن وغيرهم وأخذ الحديث عن الزين العراقي والنور الهيثمي وسمع على جماعة منهم البرهان الشامي والعلاء بن أبي المجد والجمال الحلاوي وبرع في الفقه والأصول والعربية والمعاني والبيان والقراءات وشارك في عدة علوم وتصدى للإفتاء والتدريس والأشغال وانتفع به الطلبة وتفقه به جماعة من الأعيان، وولي تدريس الشافعي وطلب إلى قضاء دمشق فامتنع ورشح لقضاء القضاة بالديار المصرية غير مرة وتصدر للتدريس وسنه دون العشرين وولي عدة مدارس، وتوفي أول يوم من سنة ست وخمسين وثمانمائة {cite:shadharat-dhahab p. 289-290}."
  en: "Al-Qalqashandi (b. Cairo Dhu'l-Hijja 778) — 'singular among the notables'; pupil of both Bulqinis, Ibn Jama'a and Ibn al-Mulaqqin, hadith from al-'Iraqi and al-Haythami; refused the Damascus qadiship and declined repeated nomination to Egypt's own; died the first day of 856 {cite:shadharat-dhahab p. 289-290}."
  fr: "Al-Qalqashandi (né au Caire Dhu'l-Hijja 778) – « singulier parmi les notables  »  ; élève de Bulqinis, Ibn Jama'a et Ibn al-Mulaqqin, hadith d'al-'Iraqi et d'al-Haythami  ; refusa le qadiat de Damas et déclina la nomination répétée à l'Égypte ; mourut le premier jour de 856 {cite:shadharat-dhahab p. 289-290}."
  es: "Al-Qalqashandi (n. El Cairo Dhu'l-Hijja 778) - 'singular entre los notables'; alumno de Bulqinis, Ibn Jama'a e Ibn al-Mulaqqin, hadiz de al-'Iraqi y al-Haythami; rechazó el cargo de cadí de Damasco y rechazó repetidas nominaciones al propio Egipto; murió el primer día de 856 {cita: shadharat-dhahab p. 289-290}."
  ur: "القلقاشندی ⁦(وفات قاہرہ ذوالحجہ 778)⁩ - 'قابل ذکر افراد میں واحد'؛ دونوں بلقین کے شاگرد، ابن جماعہ اور ابن الملقن، عراقی اور الہیثم سے حدیث؛ دمشق قادیانیت سے انکار کیا اور مصر کی اپنی نامزدگی کو بار بار مسترد کر دیا۔ 856ء کے پہلے دن وفات پائی۔ 289-290}۔"
  tr: "Ala al-Din el-Kalqashandi el-Şafii el-Kuraşi; 778 Hicri yılında Kahire'de Dhu al-Hijjah'de doğdu, orada büyüdü, okulunda büyük Kur'an'ı ve çeşitli metinleri ezberledi, zamanının alimleri olan el-Siraj el-Balqini ve oğlu Celal-Din, el-İzz bin Cema, Siraj el-Din ibn el-Mulkin ve diğerleriyle hukuk eğitimi aldı. Hadisleri el-Zeyn el-Irak ve el-Nur el-Heythami'den aldı, ayrıca el-Burhan el-Şami, el-Alaa bin Ebi el-Mecid ve el-Cemal el-Halawi gibi bir gruptan eğitim aldı. Fıkıh, ilkeler, Arapça, anlamlar, hitabet ve okuma alanlarında üstün başarı gösterdi. Birçok bilim alanında çalıştı, fetva, öğretim ve dini çalışmalarla ilgilendi, faydalandı Öğrenciydi ve bir grup önemli şahsiyetten onun yanında eğitim aldı. Şafii okulunda öğretmenlik yapmak üzere atandı ve Şam yargısına başvurdu, ancak reddetti. Mısır'da yargıç olarak birkaç kez aday gösterildi ve yirmi yaşında öğretmenliğe başladı. Birçok okulda görev yaptı ve 856 Hicri yılının ilk gününde vefat etti {atıf: shadharat-dhahab, s. 289-290}."
  id: "Ala al-Din al-Qalqashandi al-Shafi'i al-Qurashi; lahir di Kairo di Dhu al-Hijjah pada tahun 778 H, tumbuh di sana, menghafal Al-Qur'an agung dan beberapa teks di sekolahnya, serta mempelajari hukum dengan ulama pada zamannya seperti al-Siraj al-Balqini dan putranya Jalal al-Din, al-Izz ibn Jama'ah, Siraj al-Din ibn al-Mulqin, dan lainnya. Ia mempelajari hadis di bawah bimbingan al-Zayn al-Iraqi dan al-Nur al-Haythami, serta belajar di bawah kelompok yang meliputi al-Burhan al-Shami, al-Alaa ibn Abi al-Majd, dan al-Jamal al-Halawi. Ia unggul dalam bidang fiqh, prinsip, bahasa Arab, makna, retorika, dan pembacaan. Ia berpartisipasi dalam berbagai ilmu pengetahuan, fatwa, pengajaran, dan studi agama, yang bermanfaat Ia adalah seorang murid dan sekelompok tokoh terkemuka belajar di bawah bimbingannya. Ia diangkat untuk mengajar sekolah Syafi'i dan melamar ke peradilan Damaskus, namun ia menolak. Ia beberapa kali dinominasikan sebagai hakim di Mesir, dan mulai mengajar pada usia dua puluh tahun. Ia mengadakan beberapa sekolah, dan meninggal pada hari pertama tahun 856 H. {cite:shadharat-dhahab, hlm. 289-290}."
