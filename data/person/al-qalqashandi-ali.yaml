gender: male
summary:
  ar: "علاء الدين القلقشندي الشافعي القرشي؛ ولد بالقاهرة في ذي الحجة سنة ثمان وسبعين وسبعمائة ونشأ بها وحفظ القرآن العظيم وعدة متون في مذهبه وتفقه بعلماء عصره كالسراج البلقيني وولده جلال الدين والعز بن جماعة وسراج الدين بن الملقن وغيرهم وأخذ الحديث عن الزين العراقي والنور الهيثمي وسمع على جماعة منهم البرهان الشامي والعلاء بن أبي المجد والجمال الحلاوي وبرع في الفقه والأصول والعربية والمعاني والبيان والقراءات وشارك في عدة علوم وتصدى للإفتاء والتدريس والأشغال وانتفع به الطلبة وتفقه به جماعة من الأعيان، وولي تدريس الشافعي وطلب إلى قضاء دمشق فامتنع ورشح لقضاء القضاة بالديار المصرية غير مرة وتصدر للتدريس وسنه دون العشرين وولي عدة مدارس، وتوفي أول يوم من سنة ست وخمسين وثمانمائة {cite:shadharat-dhahab p. 289-290}."
  en: "Al-Qalqashandi (b. Cairo Dhu'l-Hijja 778) — 'singular among the notables'; pupil of both Bulqinis, Ibn Jama'a and Ibn al-Mulaqqin, hadith from al-'Iraqi and al-Haythami; refused the Damascus qadiship and declined repeated nomination to Egypt's own; died the first day of 856 {cite:shadharat-dhahab p. 289-290}."
