label: { ar: "جحظة البرمكي", en: "Jahza", es: "Jahza", fr: "Jahza", ur: "جزا" }
summary:
  ar: "أبو الحسن أحمد بن جعفر بن موسى بن يحيى بن خالد بن برمك، شاعر مغني مطبوع في الشعر حاذق بصنعة غناء الطنبور حسن الأدب بارع في معناه، قال ابن النديم وأخباره أشهر من أن نذكرها لقرب عهده، توفي بواسط وقد خرج إلى أبي بكر بن واثق سنة ست وعشرين وثلاثمائة بعلة الذرب، وله كتاب الطبيخ وكتاب الطنبوريين وكتاب الأحكام {cite:fihrist-ibn-al-nadim p. 449-450}."
  en: "Barmakid singer-poet (d. 324) — tunbur master, author of the cookbook al-Tabikh {cite:fihrist-ibn-al-nadim}"
  es: "Cantante y poeta barmakí (m. 324) — maestro de tunbur, autor del libro de cocina al-Tabikh {cite:fihrist-ibn-al-nadim}"
  fr: "chanteur-poète barmakide (mort en 324) — maître du tunbur, auteur du livre de cuisine al-Tabikh {cite:fihrist-ibn-al-nadim}"
  ur: "برمکد گلوکار شاعر ⁦(متوفی 324)⁩ - ٹنبر ماسٹر، کتاب التبیخ کے مصنف"
  tr: "Ebu el-Hasan Ahmed ibn Ca'far ibn Musa ibn Yahya ibn Halid ibn Barmak, şiirde yetkin, tanbur şarkıcılığı sanatında usta, terbiyeli ve anlamında yetenekli bir şair ve şarkıcıydı. İbn el-Nadim ve onun anlatımları, yakın hükümdarlığı nedeniyle anılamayacak kadar ünlüdür. Wasit'te öldü ve 326 Hicri yılında el-Dharb'ın kusuru nedeniyle Ebu Bekir bin Vetik'e gitti. El-Tabik kitabı, tanburi kitabı ve hükümler kitabını yazdı {atıf:fihrist-ibn-al-nadim s. 449-450}."
  id: "Abu al-Hasan Ahmad ibn Ja'far ibn Musa ibn Yahya ibn Khalid ibn Barmak adalah seorang penyair dan penyanyi yang mahir dalam puisi, mahir dalam seni nyanyi tanbur, sopan, dan mahir dalam maknanya. Ibn al-Nadim dan laporannya terlalu terkenal untuk disebutkan karena masa pemerintahannya yang dekat. Ia meninggal di Wasit dan pergi ke Abu Bakr ibn Wathiq pada tahun 326 H karena cacat al-dharb. Ia menulis buku Al-Tabikh, kitab tanburis, dan kitab keputusan-perintah {cite:fihrist-ibn-al-nadim hlm. 449-450}."
