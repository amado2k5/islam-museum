label: { ar: "جحظة البرمكي", en: "Jahza" }
summary:
  ar: "أبو الحسن أحمد بن جعفر بن موسى بن يحيى بن خالد بن برمك، شاعر مغني مطبوع في الشعر حاذق بصنعة غناء الطنبور حسن الأدب بارع في معناه، قال ابن النديم وأخباره أشهر من أن نذكرها لقرب عهده، توفي بواسط وقد خرج إلى أبي بكر بن واثق سنة ست وعشرين وثلاثمائة بعلة الذرب، وله كتاب الطبيخ وكتاب الطنبوريين وكتاب الأحكام {cite:fihrist-ibn-al-nadim p. 449-450}."
  en: "Barmakid singer-poet (d. 324) — tunbur master, author of the cookbook al-Tabikh {cite:fihrist-ibn-al-nadim}"
