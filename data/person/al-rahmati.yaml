summary:
  ar: "محمد بن مصطفى بن محمد بن رحمة الله، الأيوبي الأنصاري الدمشقي، أبو البركات، المعروف بالرحمتي، فقيه حنفي، كان مفنناً في العلوم دقيق النظر ما بين المنطوق والمفهوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} رحل إلى المدينة وأخذ عن فضلائها، منهم العلامة أحمد أفندي مفتي المدينة، ومحمد أفندي ميرغني مفتي مكة المكرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} درّس كتاب «الشفا» للقاضي عياض في المسجد النبوي بأمر من السلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} من تصانيفه «حاشية على مختصر شرح التنوير» للعلائي، و«حاشية على المنح»، و«شرح الطريق السالك على زبدة المناسك». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} أوردته الموسوعة بتاريخي ولادة 1176هـ ووفاة 1250هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247}"
  en: "Muhammad ibn Mustafa ibn Muhammad ibn Rahmat Allah, al-Ayyubi, al-Ansari, al-Dimashqi, Abu al-Barakat, known as al-Rahmati — a Hanafi jurist, a polymath of precise discernment between the explicit wording and its implication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} He travelled to Medina and studied under its learned men, among them the scholar Ahmad Efendi, mufti of Medina, and Muhammad Efendi Mirghani, mufti of Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} He taught the qadi Iyad's Kitab al-Shifa in the Prophet's Mosque by order of the sultan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} His works include a gloss on al-Ala'i's Mukhtasar Sharh al-Tanwir, a gloss on al-Minh, and Sharh al-Tariq al-Salik ala Zubdat al-Manasik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} The encyclopedia dates him 1176–1250 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247}"
  ur: "محمد بن مصطفی بن محمد بن رحمۃ اللہ، الایوبی الانصاری الدمشقی، ابو البرکات، المعروف بالرحمتی — حنفی فقیہ، کثیر الفنون عالم جو منطوق اور مفہوم کے درمیان باریک تمیز رکھتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} انھوں نے مدینہ کا سفر کیا اور وہاں کے علماء سے استفادہ کیا جن میں علامہ احمد افندی مفتی مدینہ اور محمد افندی میرغنی مفتی مکہ شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} سلطان کے حکم سے انھوں نے مسجد نبوی میں قاضی عیاض کی کتاب «الشفا» پڑھائی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} ان کی تصانیف میں علائی کے «مختصر شرح التنویر» پر حاشیہ، «المنح» پر حاشیہ اور «شرح الطریق السالک علی زبدۃ المناسک» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247} موسوعہ نے ان کی ولادت 1176ھ اور وفات 1250ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16247}"
