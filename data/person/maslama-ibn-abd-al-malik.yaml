id: person/maslama-ibn-abd-al-malik
class: person
label: { ar: "مسلمة بن عبد الملك", en: "Maslama ibn Abd al-Malik", es: "Maslama ibn Abd al-Malik", fr: "Maslama ibn Abd al-Malik" }
summary:
  ar: "مسلمة بن عبد الملك بن مروان الأموي؛ عند البلاذري: كانت أرض بغراس له فوقفها في سبيل البر وكانت عين السلور وبجيرتها له أيضاً، وأقطع قوماً من ربيعة قطائع قبضت فصارت بعد للمأمون؛ وتوجه غازياً للروم من نحو الثغور الجزرية فعسكر ببالس وأتاه أهلها وأهل نويلس وقاصرين وعايدين وصفين فسألوه أن يحفر لهم نهراً من الفرات يسقي أرضهم على أن يجعلوا له الثلث من غلاتهم بعد عشر السلطان ففعل فحفر النهر المعروف بنهر مسلمة ووفوا له بالشرط ورمّ سور المدينة وأحكمه، وصارت بالس وقراها لورثته حتى جاءت الدولة المباركة فأقطعها أبو العباس سليمان بن علي. وعند المسعودي عذل أخاه يزيد بن عبد الملك لما عم الناس الظلم باحتجابه وإقباله على الشرب واللهو وقال إنما مات عمر أمس فقد اقتدى بك عمالك فارتدع يزيد مدة مديدة {cite:muruj-al-dhahab p. 185} ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه بالقفول من القسطنطينية بعد حصار دام نحو سنتين، وأرسل إليه خيلاً عتاقاً وطعاماً كثيراً، وأن عمر أمر من له محيم هناك بإرسال ما يحتاجونه. {cite:salabi-umayyad-state-2020 p.332} ويذكر الكتاب أنه جُمعت له العراق في عهد يزيد بن عبد الملك، ثم ضُمت إليه ولايات المشرق مع ابن هبيرة. {cite:salabi-umayyad-state-2020 p.435}"
  en: "Maslama ibn Abd al-Malik ibn Marwan the Umayyad; in al-Baladhuri: the Baghras lands were his and he endowed them in the way of good, as were Ayn al-Salur and its pond; he granted companies of Rabi'a estates that were later seized and passed to al-Ma'mun; marching against the Byzantines from the Jaziran marches he camped at Balis, whose people with those of Nuwaylis, Qasirin, Ayidin and Siffin asked him to dig them a channel from the Euphrates to water their land in return for a third of their yield after the sultan's tithe — he did, digging the river named Nahr Maslama, and they kept the bargain while he repaired and strengthened the city's wall; Balis and its villages passed to his heirs until the blessed dynasty came, when Abu al-Abbas granted them to Sulayman ibn Ali."
  es: "Maslama ibn Abd al-Malik ibn Marwan el Omeya; en al-Baladhuri: las tierras de Baghras eran suyas y las dotó en el camino del bien, al igual que Ayn al-Salur y su estanque; otorgó a compañías de Rabi'a propiedades que luego fueron confiscadas y pasadas a al-Ma'mun; marchando contra los bizantinos desde las marcas de Jaziran acampó en Balis, cuya gente junto con la de Nuwaylis, Qasirin, Ayidin y Siffin le pidió que cavara un canal desde el Éufrates para regar sus tierras a cambio de un tercio de su cosecha después del diezmo del sultán; él lo hizo, cavando el río llamado Nahr Maslama, y ellos mantuvieron el trato mientras él reparaba y fortalecía la muralla de la ciudad; Balis y sus aldeas pasaron a sus herederos hasta que llegó la bendita dinastía, cuando Abu al-Abbas se las otorgó a Sulayman ibn Ali."
  fr: "Maslama ibn Abd al-Malik ibn Marwan, l'Omeyyade, selon al-Baladhuri: les terres de Baghras lui appartenaient et il les dota de bienfaits, de même qu'Ayn al-Salur et son étang; il octroya des domaines à des compagnies de Rabi'a qui furent plus tard saisis et transmis à al-Ma'mun; marchant contre les Byzantins depuis les marches de Jazira, il campa à Balis, dont les habitants, avec ceux de Nuwaylis, Qasirin, Ayidin et Siffin, lui demandèrent de creuser un canal depuis l'Euphrate pour irriguer leurs terres en échange d'un tiers de leur récolte après la dîme du sultan — il le fit, creusant la rivière nommée Nahr Maslama, et ils respectèrent l'accord tandis qu'il réparait et renforçait les remparts de la ville; Balis et ses villages passèrent à ses héritiers jusqu'à l'avènement de la dynastie bénie, lorsque Abu al-Abbas les octroya à Sulayman ibn Ali."
