id: person/maslama-ibn-abd-al-malik
class: person
label: { ar: "مسلمة بن عبد الملك", en: "Maslama ibn Abd al-Malik" }
summary:
  ar: "مسلمة بن عبد الملك بن مروان الأموي؛ عند البلاذري: كانت أرض بغراس له فوقفها في سبيل البر وكانت عين السلور وبجيرتها له أيضاً، وأقطع قوماً من ربيعة قطائع قبضت فصارت بعد للمأمون؛ وتوجه غازياً للروم من نحو الثغور الجزرية فعسكر ببالس وأتاه أهلها وأهل نويلس وقاصرين وعايدين وصفين فسألوه أن يحفر لهم نهراً من الفرات يسقي أرضهم على أن يجعلوا له الثلث من غلاتهم بعد عشر السلطان ففعل فحفر النهر المعروف بنهر مسلمة ووفوا له بالشرط ورمّ سور المدينة وأحكمه، وصارت بالس وقراها لورثته حتى جاءت الدولة المباركة فأقطعها أبو العباس سليمان بن علي. وعند المسعودي عذل أخاه يزيد بن عبد الملك لما عم الناس الظلم باحتجابه وإقباله على الشرب واللهو وقال إنما مات عمر أمس فقد اقتدى بك عمالك فارتدع يزيد مدة مديدة {cite:muruj-al-dhahab p. 185}"
  en: "Maslama ibn Abd al-Malik ibn Marwan the Umayyad; in al-Baladhuri: the Baghras lands were his and he endowed them in the way of good, as were Ayn al-Salur and its pond; he granted companies of Rabi'a estates that were later seized and passed to al-Ma'mun; marching against the Byzantines from the Jaziran marches he camped at Balis, whose people with those of Nuwaylis, Qasirin, Ayidin and Siffin asked him to dig them a channel from the Euphrates to water their land in return for a third of their yield after the sultan's tithe — he did, digging the river named Nahr Maslama, and they kept the bargain while he repaired and strengthened the city's wall; Balis and its villages passed to his heirs until the blessed dynasty came, when Abu al-Abbas granted them to Sulayman ibn Ali."
