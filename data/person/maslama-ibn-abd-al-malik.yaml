label: { ar: "مسلمة بن عبد الملك", en: "Maslama ibn Abd al-Malik", es: "Maslama ibn Abd al-Malik", fr: "Maslama ibn Abd al-Malik", ur: "مسلمہ بن عبد الملک" }
summary:
  ar: "مسلمة بن عبد الملك بن مروان الأموي؛ عند البلاذري: كانت أرض بغراس له فوقفها في سبيل البر وكانت عين السلور وبجيرتها له أيضاً، وأقطع قوماً من ربيعة قطائع قبضت فصارت بعد للمأمون؛ وتوجه غازياً للروم من نحو الثغور الجزرية فعسكر ببالس وأتاه أهلها وأهل نويلس وقاصرين وعايدين وصفين فسألوه أن يحفر لهم نهراً من الفرات يسقي أرضهم على أن يجعلوا له الثلث من غلاتهم بعد عشر السلطان ففعل فحفر النهر المعروف بنهر مسلمة ووفوا له بالشرط ورمّ سور المدينة وأحكمه، وصارت بالس وقراها لورثته حتى جاءت الدولة المباركة فأقطعها أبو العباس سليمان بن علي. وعند المسعودي عذل أخاه يزيد بن عبد الملك لما عم الناس الظلم باحتجابه وإقباله على الشرب واللهو وقال إنما مات عمر أمس فقد اقتدى بك عمالك فارتدع يزيد مدة مديدة {cite:muruj-al-dhahab p. 185} ويذكر الكتاب أن عمر بن عبد العزيز كتب إليه بالقفول من القسطنطينية بعد حصار دام نحو سنتين، وأرسل إليه خيلاً عتاقاً وطعاماً كثيراً، وأن عمر أمر من له محيم هناك بإرسال ما يحتاجونه. {cite:salabi-umayyad-state-2020 p.332} ويذكر الكتاب أنه جُمعت له العراق في عهد يزيد بن عبد الملك، ثم ضُمت إليه ولايات المشرق مع ابن هبيرة. {cite:salabi-umayyad-state-2020 p.435}"
  en: "Maslama ibn Abd al-Malik ibn Marwan the Umayyad; in al-Baladhuri: the Baghras lands were his and he endowed them in the way of good, as were Ayn al-Salur and its pond; he granted companies of Rabi'a estates that were later seized and passed to al-Ma'mun; marching against the Byzantines from the Jaziran marches he camped at Balis, whose people with those of Nuwaylis, Qasirin, Ayidin and Siffin asked him to dig them a channel from the Euphrates to water their land in return for a third of their yield after the sultan's tithe — he did, digging the river named Nahr Maslama, and they kept the bargain while he repaired and strengthened the city's wall; Balis and its villages passed to his heirs until the blessed dynasty came, when Abu al-Abbas granted them to Sulayman ibn Ali."
  es: "Maslama ibn Abd al-Malik ibn Marwan el Omeya; en al-Baladhuri: las tierras de Baghras eran suyas y las dotó en el camino del bien, al igual que Ayn al-Salur y su estanque; otorgó a compañías de Rabi'a propiedades que luego fueron confiscadas y pasadas a al-Ma'mun; marchando contra los bizantinos desde las marcas de Jaziran acampó en Balis, cuya gente junto con la de Nuwaylis, Qasirin, Ayidin y Siffin le pidió que cavara un canal desde el Éufrates para regar sus tierras a cambio de un tercio de su cosecha después del diezmo del sultán; él lo hizo, cavando el río llamado Nahr Maslama, y ellos mantuvieron el trato mientras él reparaba y fortalecía la muralla de la ciudad; Balis y sus aldeas pasaron a sus herederos hasta que llegó la bendita dinastía, cuando Abu al-Abbas se las otorgó a Sulayman ibn Ali."
  fr: "Maslama ibn Abd al-Malik ibn Marwan, l'Omeyyade, selon al-Baladhuri: les terres de Baghras lui appartenaient et il les dota de bienfaits, de même qu'Ayn al-Salur et son étang; il octroya des domaines à des compagnies de Rabi'a qui furent plus tard saisis et transmis à al-Ma'mun; marchant contre les Byzantins depuis les marches de Jazira, il campa à Balis, dont les habitants, avec ceux de Nuwaylis, Qasirin, Ayidin et Siffin, lui demandèrent de creuser un canal depuis l'Euphrate pour irriguer leurs terres en échange d'un tiers de leur récolte après la dîme du sultan — il le fit, creusant la rivière nommée Nahr Maslama, et ils respectèrent l'accord tandis qu'il réparait et renforçait les remparts de la ville; Balis et ses villages passèrent à ses héritiers jusqu'à l'avènement de la dynastie bénie, lorsque Abu al-Abbas les octroya à Sulayman ibn Ali."
  ur: "مسلمہ بن عبد الملک بن مروان اموی؛ البلادوری میں ہے: باغرس کی زمینیں اس کی تھیں اور اس نے انہیں نیکی کی راہ میں عطا کیا، جیسا کہ عین الصلور اور اس کا تالاب تھا۔ اس نے ربیعہ اسٹیٹس کی کمپنیاں عطا کیں جو بعد میں ضبط کر کے المامون کو دے دی گئیں۔ جزیران سے بازنطینیوں کے خلاف مارچ کرتے ہوئے اس نے بالس میں پڑاؤ ڈالا، جس کے لوگوں نے نویلیوں، قصرین، عیدین اور صفین کے لوگوں کے ساتھ اس سے فرات سے ایک نالہ کھودنے کو کہا تاکہ سلطان کے دسواں حصے کے بعد ان کی پیداوار کے ایک تہائی کے بدلے ان کی زمین کو پانی فراہم کیا جا سکے۔ دیوار بالس اور اس کے دیہات اس کے وارثوں کے پاس گئے یہاں تک کہ مبارک خاندان آیا، جب ابو العباس نے انہیں سلیمان ابن علی کو عطا کیا۔"
  tr: "Maslama ibn Abdülmelik ibn Mervan el-Emeviydi; el-Baladhuri'ye göre: Adalet için Ghara'da bir toprak bağışladı. Aynı zamanda el-Salur'un kaynağı ve onun Jira'it'iydi. Bazı insanları Rabi'ah Kata'i'den kopardı, bu bölge alındı ve daha sonra el-Me'mun'un parçası oldu. Fatih olarak Cağıriye sınırlarına yakın Romalılara yürüdü, Bals'ta kamp kurdu ve halkı olan Nu'ilis halkı Kasrin ve Sifinli Aydin'e kadar Fırat'tan bir nehir kazmasını istediler; ancak sultanın onda bir kısmından sonra topraklarını sulamak için gelirlerinin üçte birini tahsis edeceklerdi. Bunu yaptı ve Maslama Nehri olarak bilinen nehri kazdı, şehir surlarını inşa edip yeniden inşa etme şartını yerine getirdiler. Şehri varisleri için Bals ve köyleri oldu, ta ki kutsanmış devlet gelene kadar ve Ebu el-Abbas Süleyman bin Ali onu kesti. El-Mes'udi'ye göre, kardeşi Yezid bin Abdülmelik, insanların onun örtüsü ve içkiye ve eğlence eğilimi yüzünden ezildiğinde aşağılanmıştır ve şöyle demiştir: 'Ömer dün öldü, çünkü senin kulların seni takip etti.' Bu yüzden Yezid uzun süre caydırıldı {alıntı: Muruj-al-Dhahab, s. 185}. Kitapta, Ömer bin Abdülaziz'in yaklaşık iki yıl süren kuşatmanın ardından Konstantinopolis'ten kilitlerde ona mektup yazdığı, ele geçirilen atları ve bolca yiyecek gönderdiğini, Umar'ın ise orada koruyucusu olanlara ihtiyaç duyduklarını göndermelerini emrettiğini belirtir. {cite:Salabi-Umayyad-state-2020 s.332} Kitapta, Irak'ın Yezid bin Abd al-Malik döneminde onun için toplandığını, ardından Doğu eyaletlerinin İbn Hubayrah ile birlikte ona ilhak edildiğini belirtir. {cite:Salabi-Umayyad-state-2020 s.435}"
  id: "Maslama ibn Abd al-Malik ibn Marwan al-Umayyad; menurut al-Baladhuri: Tanah di Gharas adalah tanah yang ia berikan untuk kebenaran. Tanah itu juga merupakan mata air al-Salur dan Jira'ithnya baginya. Ia memutuskan beberapa orang dari Rabi'ah Qata'i', yang kemudian diambil dan kemudian menjadi bagian dari al-Ma'mun. Ia berbaris sebagai penakluk ke Romawi di dekat perbatasan Jaziriyah, berkemah di Bals, dan rakyatnya, masyarakat Nu'ilis, Qasrin, dan 'Aydin dari Siffin. Mereka memintanya menggali sungai dari Efrat untuk mengairi tanah mereka, dengan syarat mereka akan mengalokasikan sepertiga hasil panen setelah sultan mencapai sepuluh kesultanan. Ia melakukannya, dan ia menggali sungai yang dikenal sebagai Sungai Maslama, dan mereka memenuhi syarat untuk membangun dan membangun kembali tembok kota. Tembok itu menjadi Bals dan desa-desanya untuk para ahli warisnya sampai kedatangan negara suci, dan Abu al-Abbas Sulayman ibn Ali memutusnya. Menurut al-Mas'udi, saudaranya Yazid ibn Abd al-Malik dipermalukan ketika orang-orang ditindas oleh kerudungnya dan kecenderungannya untuk minum dan bersenang-senang, sambil berkata: 'Umar meninggal kemarin, karena hamba-hambamu mengikuti kamu.' Jadi Yazid lama terhalang {cite:Muruj-al-Dhahab, hlm. 185}. Buku tersebut menyebutkan bahwa Umar ibn Abd al-Aziz menulis kepadanya di kunci dari Konstantinopel setelah pengepungan yang berlangsung sekitar dua tahun, mengirimkan kuda yang ditangkap dan banyak makanan, dan bahwa Umar memerintahkan mereka yang memiliki pelindung di sana untuk mengirimkan apa yang mereka butuhkan. {cite:salabi-umayyad-state-2020 hlm.332} Buku tersebut menyebutkan bahwa Irak dikumpulkan untuknya selama masa pemerintahan Yazid ibn Abd al-Malik, kemudian provinsi-provinsi di Timur dianeksasi kepadanya bersama Ibn Hubayrah. {cite:salabi-umayyad-state-2020 hlm.435}"
