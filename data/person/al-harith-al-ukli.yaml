summary:
  ar: "الحارث بن يزيد العكلي من فقهاء الكوفة في هذه الطبقة، ذُكر مع المغيرة بن مقسم وأبي معشر وأبي هاشم ومنصور وغيرهم ممن أخذوا العلم عن الشعبي والنخعي {cite:tabaqat-fuqaha-abbas-1981 p. 44}. وكان ابن شبرمة يقول: إذا اجتمعت أنا والحارث على مسألة لم نبال من خالفنا {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
  en: "Al-Harith ibn Yazid al-Ukli, a jurist of Kufa of this generation, named with al-Mughira ibn Miqsam, Abu Ma'shar, Abu Hashim, Mansur and others who took knowledge from al-Sha'bi and al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981 p. 44}. Ibn Shubruma used to say: 'When al-Harith and I agree on a question, we do not mind who disagrees with us' {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
  fr: "Al-Harith ibn Yazid al-Ukli, juriste de Koufa de cette génération, nommé avec al-Mughira ibn Miqsam, Abu Ma’shar, Abu Hashim, Mansur et d’autres qui reçurent le savoir d’al-Sha’bi et d’al-Nakha’i {cite:tabaqat-fuqaha-abbas-1981 p. 44}. Ibn Shubruma disait : « Lorsque al-Harith et moi sommes d’accord sur une question, peu nous importe qui nous contredit » {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
  es: "Al-Harith ibn Yazid al-Ukli, jurista de Kufa de esta generación, fue nombrado junto con al-Mughira ibn Miqsam, Abu Ma'shar, Abu Hashim, Mansur y otros que recibieron conocimiento de al-Sha'bi y al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981 p. 44}. Ibn Shubruma solía decir: «Cuando al-Harith y yo estamos de acuerdo en una cuestión, no nos importa quién discrepe con nosotros» {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
  ur: "اس نسل کے کوفہ کے ایک فقیہ الحارث بن یزید العکلی، جن کا نام المغیرہ بن مقسم، ابو معشر، ابو ہاشم، منصور اور دیگر کے ساتھ ہے جنہوں نے الشعبی اور النخعی سے علم حاصل کیا تھا۔ 44}۔ ابن شبرومہ کہا کرتے تھے: ''جب میں اور الحارث کسی سوال پر متفق ہو جائیں تو ہمیں کوئی اعتراض نہیں کہ کون ہم سے اختلاف کرے''۔ 45}۔"
  tr: "El-Haris bin Yezid el-'Akali, bu sınıfta Kufe'nin hukukçularından biriydi. El-Muğira bin Muqsim, Ebu Ma'shar, Ebu Haşim, Mansur ve el-Şa'bi ile el-Nakha'i'den öğrenen diğerleriyle birlikte anıldı {atıf:tabaqat-fuqaha-abbas-1981, s. 44}. İbn Şubruma şöyle derdi: Eğer el-Haris ile bir konuda anlaşırsak, kim bize karşı çıkarsa çıksın, umurumuzda değil. {atıf:Tabaqat-Fuqaha-Abbas-1981, s. 45}."
  id: "Al-Harith ibn Yazid al-'Akali adalah salah satu ahli hukum Kufa dalam kelas ini. Ia disebutkan bersama al-Mughira ibn Muqsim, Abu Ma'shar, Abu Hashim, Mansur, dan lainnya yang belajar dari al-Sha'bi dan al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981, hlm. 44}. Ibn Shubrumah biasa berkata: Jika al-Harith dan saya sepakat dalam suatu hal, kami tidak peduli siapa yang menentang kami. {cite:tabaqat-fuqaha-abbas-1981, hlm. 45}."
