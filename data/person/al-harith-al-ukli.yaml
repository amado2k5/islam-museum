  ar: "الحارث بن يزيد العكلي من فقهاء الكوفة في هذه الطبقة، ذُكر مع المغيرة بن مقسم وأبي معشر وأبي هاشم ومنصور وغيرهم ممن أخذوا العلم عن الشعبي والنخعي {cite:tabaqat-fuqaha-abbas-1981 p. 44}. وكان ابن شبرمة يقول: إذا اجتمعت أنا والحارث على مسألة لم نبال من خالفنا {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
