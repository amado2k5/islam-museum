summary:
  ar: "الحارث بن يزيد العكلي من فقهاء الكوفة في هذه الطبقة، ذُكر مع المغيرة بن مقسم وأبي معشر وأبي هاشم ومنصور وغيرهم ممن أخذوا العلم عن الشعبي والنخعي {cite:tabaqat-fuqaha-abbas-1981 p. 44}. وكان ابن شبرمة يقول: إذا اجتمعت أنا والحارث على مسألة لم نبال من خالفنا {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
  en: "Al-Harith ibn Yazid al-Ukli, a jurist of Kufa of this generation, named with al-Mughira ibn Miqsam, Abu Ma'shar, Abu Hashim, Mansur and others who took knowledge from al-Sha'bi and al-Nakha'i {cite:tabaqat-fuqaha-abbas-1981 p. 44}. Ibn Shubruma used to say: 'When al-Harith and I agree on a question, we do not mind who disagrees with us' {cite:tabaqat-fuqaha-abbas-1981 p. 45}."
