summary:
  ar: "الشاه عباس الثاني (30 أغسطس 1632 – 26 أكتوبر 1666)، وُلد باسم سلطان محمد ميرزا، سابع شاهات إيران الصفوية (حكم 1642–1666) وأكبر أبناء الشاه صفي. اعتلى العرش في التاسعة تحت وصاية الوزير سارو تقي، ثم أمسك بزمام الحكم بنفسه سنة 1645. استرجع قندهار من المغول سنة 1649 وصدّ ثلاث محاولات لاستعادتها، وحافظ على السلم مع العثمانيين، ويُذكر بوصفه آخر ملوك الصفويين الأقوياء. توفي في خسرو آباد قرب دامغان ودُفن في قم."
  en: "Shah Abbas II (30 August 1632 – 26 October 1666), born Soltan Mohammad Mirza, was the seventh shah of Safavid Iran (r. 1642–1666) and the eldest son of Shah Safi. He came to the throne aged nine under the regency of the grand vizier Saru Taqi, then asserted personal rule in 1645. He retook Kandahar from the Mughals in 1649 and held it against three sieges, kept the peace with the Ottoman Empire, and is remembered as the last strong king of the Safavid dynasty. He died at Khosrowabad near Damghan and was buried in Qom."
  ur: "شاہ عباس دوم (30 اگست 1632ء – 26 اکتوبر 1666ء)، پیدائشی نام سلطان محمد مرزا، صفوی ایران کے ساتویں شاہ (دورِ حکومت 1642ء–1666ء) اور شاہ صفی کے سب سے بڑے بیٹے تھے۔ نو برس کی عمر میں وزیرِ اعظم سارو تقی کی سرپرستی میں تخت نشین ہوئے، پھر 1645ء میں خود اقتدار سنبھالا۔ 1649ء میں مغلوں سے قندھار واپس لیا اور تین محاصروں کے باوجود اسے برقرار رکھا، سلطنتِ عثمانیہ سے امن قائم رکھا، اور صفوی خاندان کے آخری مضبوط بادشاہ کے طور پر یاد کیے جاتے ہیں۔ خسرو آباد نزد دامغان وفات پائی اور قم میں دفن ہوئے۔"

