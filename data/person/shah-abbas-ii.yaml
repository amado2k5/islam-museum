    basis: unknown
    note: >-
      FLAGGED for a founder ruling. The dynastic picture is plain:
      Abbas II reigned as the Twelver Shi'i shah of Safavid Iran,
      his coins bore the Shi'a slogan and the names of the Twelve
      Imams, and the English article attests his personal practice
      at length — he commissioned Persian translations of Shi'ia
      jurisprudence and consulted the ulama on them, kept friendly
      relations with the renowned Shi'ia scholars Mohsen Fayz
      Kashani, Mohammad Bagher Sabzevari and Mohammad Taqi Majlesi,
      paid his respects to his ancestral Safaviyya order, and was
      persuaded by a Shi'ia scholar in 1653 to give up drinking for
      a time — while also noting that he was not a zealous Shiite,
      and that his reign forced conversions upon Iran's Jews. But
      the Persian article states the opposite inclination for the
      man himself: that Abbas II, unlike his father, showed greater
      interest in the Sunni school, which earned him the enmity of
      many of the ulama of his father's court. The Urdu article is
      a rendering of the English and is not an independent text;
      the Arabic article is silent on his personal faith. One
      scholarly tradition attesting Twelver practice against a
      second attesting a Sunni-leaning inclination is precisely
      the doubt the founder's rule reserves: two independent texts
      do not settle one value for the man himself, so his faith is
      recorded as unknown with both characterisations stated in
      full. Wikidata's P140 filing of Shia Islam is structured data
      and is not relied on.
    sources: [source/wikipedia-shah-abbas-ii-en, source/wikipedia-shah-abbas-ii-fa]

