summary:
  ar: "ممثلة إيرانية-أمريكية، وُلدت في طهران سنة 1952 باسم شهره وزیری‌تبار؛ بدأت في المسرح والسينما الإيرانية في السبعينيات ثم غادرت إيران سنة 1979 إلى إنجلترا فالولايات المتحدة، ورُشّحت لجائزة الأوسكار عن «بيت الرمل والضباب» (2003)، وفازت بجائزة إيمي عن دورها ساجدة طلفاح في «بيت صدام» (2008)، واشتهرت عالميًا بدور كريسجن أفاسارالا في مسلسل «ذا إكسبانس» (2015–2022)، ونشرت سيرتها «زقاق الحب والياسمين الأصفر» سنة 2013."
  en: "Iranian-American actress, born in Tehran in 1952 as Shohreh Vaziri-Tabar. She began on the Iranian stage and screen in the 1970s, left Iran in 1979 for England and then the United States, was nominated for an Academy Award for House of Sand and Fog (2003), won a Primetime Emmy Award as Sajida Talfah in House of Saddam (2008), starred as Chrisjen Avasarala in The Expanse (2015–2022), and published her autobiography The Alley of Love and Yellow Jasmines in 2013."
  ur: "ایرانی-امریکی اداکارہ، 1952 میں تہران میں شہرہ وزیری تبار کے نام سے پیدا ہوئیں؛ انھوں نے ستر کی دہائی میں ایرانی اسٹیج اور پردے سے آغاز کیا، 1979 میں ایران چھوڑ کر انگلستان اور پھر امریکا گئیں، «ہاؤس آف سینڈ اینڈ فوگ» (2003) پر اکیڈمی ایوارڈ کے لیے نامزد ہوئیں، «ہاؤس آف صدام» (2008) میں ساجدہ طلفاح کے کردار پر پرائم ٹائم ایمی ایوارڈ جیتا، «دی ایکسپینس» (2015–2022) میں کرسجن اواسارالا کے کردار سے عالمی شہرت پائی، اور 2013 میں اپنی خود نوشت «دی ایلی آف لو اینڈ ییلو جیسمینز» شائع کی۔"
