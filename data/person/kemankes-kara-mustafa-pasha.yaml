  es: "Ficha de reclutamiento para Kemenkes Kara Mustafa Pasha, el kapudan pasha otomano y luego gran visir bajo Ibrahim hasta su ejecución en 1644; la entrada de origen aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Kemenkes Kara Mustafa Pasha, le kapudan pacha ottoman puis grand vizir sous Ibrahim jusqu'à son exécution en 1644; la source n'est pas encore vérifiée sur la page."
  ur: "کیمنکس کارا مصطفی پاشا کے لیے ڈرافٹ کارڈ، عثمانی کپوڈن پاشا پھر 1644 میں اس کی پھانسی تک ابراہیم کے ماتحت وزیر اعظم تھے۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İbrahim'in saltanatı sırasında Osmanlı donanmasının kaptanı ve ardından 1644'te idam edilene kadar Sadrazam olan Kamankesh Kara Mustafa Paşa için ön hazırlık kartı; Osmanlı tarih kitaplarında kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Kamankesh Kara Mustafa Pasha, kapten angkatan laut Ottoman dan kemudian Grand Vizier selama masa pemerintahan Ibrahim hingga eksekusinya pada tahun 1644 M; Buku sejarah Ottoman menyebutkannya dan biografinya belum diulas di halaman."
