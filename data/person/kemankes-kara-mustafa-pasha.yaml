summary:
  ar: "بطاقة أولية لكمانكش قره مصطفى باشا، قبطان البحر العثماني ثم الصدر الأعظم في عهد إبراهيم حتى إعدامه سنة ١٦٤٤م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
