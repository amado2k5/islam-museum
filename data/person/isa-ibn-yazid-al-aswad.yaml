id: person/isa-ibn-yazid-al-aswad
class: person
label:
  ar: عيسى بن يزيد الأسود
  en: Isa ibn Yazid al-Aswad
  es: "Isa ibn Yazid al-Aswad"
  fr: "Isa ibn Yazid al-Aswad"
  ur: "عیسیٰ ابن یزید الاسود"
summary:
  ar: "عيسى بن يزيد الأسود، من موالي العرب ورؤوس الخوارج؛ اجتمع عليه زهاء أربعين من رجالات مكناسة فولوه عليهم ونقضوا طاعة الخلفاء، واختطوا مدينة سجلماسة سنة 140هـ ودخل سائر مكناسة في دينهم الصفري، ثم سخطوا أميرهم عيسى ونقموا عليه كثيراً من أحواله فشدوه كتافاً ووضعوه على قنة جبل إلى أن هلك سنة 155هـ."
  en: "Isa ibn Yazid al-Aswad, of the Arab mawali and Kharijite leaders; some forty chiefs of the Miknasa rallied to him, renounced caliphal obedience, founded Sijilmasa in 140 AH and drew all the Miknasa into their Sufrite creed — then, resenting much in his conduct, they bound him hand and foot and left him on a mountain peak until he died in 155."
  es: "Isa ibn Yazid al-Aswad, de los líderes árabes mawali y jariyíes, fue seguido por unos cuarenta jefes de los Miknasa, quienes renunciaron a la obediencia al califato, fundaron Sijilmasa en el año 140 de la Hégira e incorporaron a todos los Miknasa a su credo sufriente. Posteriormente, disgustados por su conducta, lo ataron de pies y manos y lo abandonaron en la cima de una montaña hasta su muerte en el año 155."
  fr: "Isa ibn Yazid al-Aswad, des chefs arabes mawali et kharijites; une quarantaine de chefs du Miknasa se rallièrent à lui, renoncèrent à l'obéissance califale, fondèrent Sijilmasa en 140 AH et entraînèrent tout le Miknasa dans leur credo soufrite — puis, mécontents de sa conduite, ils l'enchaînèrent pieds et poings liés et l'abandonnèrent au sommet d'une montagne jusqu'à sa mort en 155."
  ur: "عیسٰی بن یزید الاسود، عرب موالی اور خارجی رہنماوں میں سے؛ میکناسہ کے تقریباً چالیس سرداروں نے اس کے پاس جمع ہو کر خلیفہ کی اطاعت سے دستبردار ہو کر 140 ہجری میں سجلماسا کی بنیاد رکھی اور تمام مکناسہ کو اپنے مسلک کی طرف متوجہ کیا - پھر اس کے طرز عمل سے بہت ناراض ہو کر اس کے ہاتھ پاؤں باندھ کر اسے پہاڑی چوٹی پر چھوڑ دیا یہاں تک کہ اس کی موت 155 میں ہوئی۔"
  tr: "Arap özgür bırakılanlardan ve Haricilerin liderlerinden İsa bin Yezid el-Esvad, kendisine destek olmak için Meknassa'dan yaklaşık kırk adamı topladı, halifelerin itaatini bozdu ve 140 Hicri'de Sijilmasa şehrini ele geçirdi; Meknassa'nın geri kalanı ise Safri dinine katıldı. Daha sonra liderleri İsa'ya karşı büyük bir kin beslediler, onu omzuna bağlayıp dağ bastına koydular ve 155 Hicri'de ölene kadar onu bir dağ bastına taktılar."
  id: "Isa ibn Yazid al-Aswad, salah satu mantan Arab dan pemimpin Kharijites, mengumpulkan sekitar empat puluh orang Meknassa untuk mendukungnya, melanggar ketaatan para khalifah, dan merebut kota Sijilmasa pada tahun 140 H, sementara sisa Meknassa bergabung dengan agama Safri mereka. Mereka kemudian membenci pemimpin mereka, sangat membencinya, dan mengikatnya di bahu serta meletakkannya di atas tongkat gunung hingga ia meninggal pada tahun 155 H."
