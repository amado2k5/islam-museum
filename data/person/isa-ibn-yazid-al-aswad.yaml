  en: Isa ibn Yazid al-Aswad
summary:
  ar: "عيسى بن يزيد الأسود، من موالي العرب ورؤوس الخوارج؛ اجتمع عليه زهاء أربعين من رجالات مكناسة فولوه عليهم ونقضوا طاعة الخلفاء، واختطوا مدينة سجلماسة سنة 140هـ ودخل سائر مكناسة في دينهم الصفري، ثم سخطوا أميرهم عيسى ونقموا عليه كثيراً من أحواله فشدوه كتافاً ووضعوه على قنة جبل إلى أن هلك سنة 155هـ."
  en: "Isa ibn Yazid al-Aswad, of the Arab mawali and Kharijite leaders; some forty chiefs of the Miknasa rallied to him, renounced caliphal obedience, founded Sijilmasa in 140 AH and drew all the Miknasa into their Sufrite creed — then, resenting much in his conduct, they bound him hand and foot and left him on a mountain peak until he died in 155."
