  es: "Diplomática siria que se desempeñó como encargada de negocios de su país en Chipre. Desertó del gobierno de Bashar al-Assad en julio de 2012 y se fue a Qatar; fue la segunda diplomática siria en desertar ese mes."
  fr: "Diplomate syrienne en poste comme chargée d'affaires de son pays à Chypre, elle a fait défection du gouvernement de Bachar al-Assad en juillet 2012 et s'est réfugiée au Qatar – la deuxième défection d'un diplomate syrien ce mois-là."
