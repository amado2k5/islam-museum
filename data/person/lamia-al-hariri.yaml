summary:
  ar: "دبلوماسية سورية كانت القائمة بأعمال سفارة سوريا في قبرص، أعلنت انشقاقها عن نظام بشار الأسد في يوليو 2012 وتوجهت إلى قطر، فكان انشقاقها ثاني انشقاق دبلوماسي سوري في ذلك الشهر."
