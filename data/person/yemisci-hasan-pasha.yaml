summary:
  ar: "بطاقة أولية ليميشجي حسن باشا، الصدر الأعظم العثماني الذي فتح ناجي كانيجه سنة ١٦٠٠م وشغل الصدارة في عهد محمد الثالث، أُعدم سنة ١٦٠٣م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Yemisci Hasan Pasha, the Ottoman grand vizier who took Nagykanizsa in 1600 under Mehmed III, executed in 1603; the source entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Yemisci Hasan Pasha, el gran visir otomano que tomó Nagykanizsa en 1600 bajo el reinado de Mehmed III, ejecutado en 1603; la entrada de origen aún no ha sido verificada en la página."
  fr: "Carte de conscription de Yemisci Hasan Pasha, le grand vizir ottoman qui prit Nagykanizsa en 1600 sous Mehmed III, exécuté en 1603; la source n'est pas encore vérifiée sur la page."
  ur: "یمسکی حسن پاشا کے لیے مسودہ کارڈ، عثمانی عظیم وزیر جس نے 1600 میں محمد III کے ماتحت ناگیکانیزا لیا، 1603 میں پھانسی دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1600'de Nacı Kanece'yi fetheden ve III. Mehmed'in saltanatı sırasında görevi üstlenen Osmanlı Sadrazami Limişci Hasan Paşa'nın ön kartı 1603 yılında idam edilmiştir; Osmanlı tarih kitaplarında adı geçmektedir ve çevirisi henüz sayfada gözden geçirilmemiştir."
  id: "Kartu pendahuluan Limişci Hasan Pasha, Wazir Agung Ottoman yang menaklukkan Nacı Kanece pada tahun 1600 dan memegang jabatan tersebut selama masa pemerintahan Mehmed III, dieksekusi pada tahun 1603 M; ia disebutkan dalam buku sejarah Ottoman dan terjemahannya belum ditinjau di halaman tersebut."
