summary:
  ar: "موسى بن عبد الله بن خازم السلمي؛ لما قتل أبوه أتى ملك الترمذ فأجاره وألجأه وقوماً كانوا معه فأخرجه عنها وغلب عليها وهو مخالف فلما قتل صارت في أيدي الولاة ثم انتقض أهلها ففتحها قتيبة بن مسلم."
  en: "Musa ibn Abdallah ibn Khazim al-Sulami; sheltered with his men by Tirmidh's king after his father's death, he cast the king out and held it in rebellion — on his death it passed to the governors, broke again, and Qutayba ibn Muslim retook it."
  es: "Musa ibn Abdallah ibn Khazim al-Sulami, acogido junto a sus hombres por el rey de Tirmidh tras la muerte de su padre, expulsó al rey y se rebeló contra la ciudad. Tras su muerte, la ciudad pasó a manos de los gobernadores, se dividió de nuevo y Qutayba ibn Muslim la reconquistó."
  fr: "Musa ibn Abdallah ibn Khazim al-Sulami; abrité avec ses hommes par le roi de Tirmidh après la mort de son père, il chassa le roi et le maintint en rébellion — à sa mort, il passa aux mains des gouverneurs, se brisa à nouveau, et Qutayba ibn Muslim le reprit."
  ur: "موسیٰ بن عبداللہ ابن خزیم السلمی؛ اپنے والد کی وفات کے بعد ترمذ کے بادشاہ نے اپنے آدمیوں کے ساتھ پناہ دی، اس نے بادشاہ کو باہر نکال دیا اور اسے بغاوت میں گرفتار کر لیا - اس کی موت پر یہ گورنروں تک پہنچا، دوبارہ ٹوٹ گیا، اور قتیبہ بن مسلم نے اسے واپس لے لیا۔"
