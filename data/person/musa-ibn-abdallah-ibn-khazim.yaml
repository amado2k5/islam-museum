summary:
  ar: "موسى بن عبد الله بن خازم السلمي؛ لما قتل أبوه أتى ملك الترمذ فأجاره وألجأه وقوماً كانوا معه فأخرجه عنها وغلب عليها وهو مخالف فلما قتل صارت في أيدي الولاة ثم انتقض أهلها ففتحها قتيبة بن مسلم."
  en: "Musa ibn Abdallah ibn Khazim al-Sulami; sheltered with his men by Tirmidh's king after his father's death, he cast the king out and held it in rebellion — on his death it passed to the governors, broke again, and Qutayba ibn Muslim retook it."
