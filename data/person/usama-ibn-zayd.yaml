summary:
  ar: «الحِب ابن الحِب» ابن مولى النبي زيد وأمه أم أيمن حاضنة النبي؛ وُلد في الإسلام ومات النبي وله عشرون سنة، وأمّره النبي على جيش عظيم فمات قبل أن يتوجه فأنفذه أبو بكر، واعتزل الفتن بعد قتل عثمان.
  en: '''The beloved son of the beloved'', son of the Prophet''s freedman Zayd and of Umm Ayman who had nursed the Prophet; born in Islam, he was twenty when the Prophet died; the Prophet put him in command of a great army, which Abu Bakr then
    sent out after the Prophet''s death; he withdrew from the strife after Uthman''s killing.'
  ur: "«محبوب کا محبوب بیٹا»، نبی کے آزاد کردہ زید اور ام ایمن کا بیٹا جس نے نبی کی پرورش کی؛ اسلام میں پیدا ہوا۔"
  es: "'El amado hijo del amado', hijo del liberto del Profeta, Zayd, y de Umm Ayman, quien había amamantado al Profeta; nacido en el Islam, tenía veinte años cuando murió el Profeta; el Profeta lo puso al mando de un gran ejército, que Abu Bakr envió después de la muerte del Profeta; se retiró de la contienda después del asesinato de Uthman."
  fr: "« Le fils bien-aimé du bien-aimé », fils de Zayd, l'affranchi du Prophète, et d'Umm Ayman qui avait allaité le Prophète; né en Islam, il avait vingt ans à la mort du Prophète; le Prophète le mit à la tête d'une grande armée, qu'Abu Bakr envoya ensuite après la mort du Prophète; il se retira du conflit après la mort d'Uthman."
  tr: "\"Sevgi, sevginin oğludur,\" Peygamber'in özgür bırakılmış Zeyd'in oğludur ve annesi Peygamber'in vasisi Um Ayman'dı; İslam'da doğdu ve yirmi yaşında öldü. Peygamber ona büyük bir ordu komuta etmesini emretti, ancak yola çıkmadan önce öldü, ki Ebu Bekir bunu gerçekleştirdi. Osman öldürüldükten sonra sınavlardan çekildi."
  id: "\"Kasih adalah putra cinta,\" putra dari mantan Nabi, Zayd, dan ibunya adalah um Ayman, wali Nabi; ia lahir dalam Islam dan meninggal pada usia dua puluh tahun. Nabi memerintahkannya untuk memimpin pasukan besar, tetapi ia meninggal sebelum sempat berangkat, yang dilakukan Abu Bakr. Ia menarik diri dari persidangan setelah pembunuhan Uthman."
