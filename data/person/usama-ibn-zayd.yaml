  ar: «الحِب ابن الحِب» ابن مولى النبي زيد وأمه أم أيمن حاضنة النبي؛ وُلد في الإسلام ومات النبي وله عشرون سنة، وأمّره النبي على جيش عظيم فمات قبل أن يتوجه فأنفذه أبو بكر، واعتزل الفتن بعد قتل عثمان.
  en: '''The beloved son of the beloved'', son of the Prophet''s freedman Zayd and of Umm Ayman who had nursed the Prophet; born in Islam, he was twenty when the Prophet died; the Prophet put him in command of a great army, which Abu Bakr then
    sent out after the Prophet''s death; he withdrew from the strife after Uthman''s killing.'
