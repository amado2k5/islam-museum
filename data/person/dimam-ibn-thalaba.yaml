summary:
  ar: 'وافد بني سعد بن بكر على النبي، ورد خبره في الصحيحين من حديث أنس: جاء أعرابي فقال: «أيكم ابن عبد المطلب؟» وسأله وأسلم، وقال النبي لما ولّى: «فقِّه الرجل»؛ واختُلف في سنة قدومه.'
  en: 'The envoy of Banu Sa''d ibn Bakr to the Prophet, whose story is in the two collections from Anas: a bedouin came and asked ''Which of you is Ibn Abd al-Muttalib?'', questioned him and embraced Islam, and the Prophet said as he left ''The
    man has gained understanding''; the year of his coming is disputed.'
