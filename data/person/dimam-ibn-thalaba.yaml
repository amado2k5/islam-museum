id: person/dimam-ibn-thalaba
education:
  did_you_know:
    ar: "ضمام بن ثعلبة وافد بني سعد بن بكر؛ جاء أعرابي يسأل «أيكم ابن عبد المطلب؟» ثم أسلم، فقال النبي لما ولّى: «فقِّه الرجل»."
    en: "Dimam ibn Tha'laba, the envoy of Banu Sa'd ibn Bakr: a Bedouin who asked 'which of you is the son of Abd al-Muttalib?' then embraced Islam — and as he left, the Prophet said 'give the man understanding'."
    ur: "ضمام بن ثعلبہ، بنو سعد بن بکر کا ایلچی: ایک دیہاتی جس نے پوچھا «تم میں سے کون عبدالمطلب کا بیٹا ہے؟» پھر مسلمان ہوا — اور جاتے ہوئے نبی نے فرمایا «اس آدمی کو فقہ دو»۔"
    sources: [source/ibn-hajar-isaba, source/ibn-hisham-saqqa]
