summary:
  ar: "مؤسس أسرة أسكيا وحاكم إمبراطورية صنغاي (حكم 1493–1528)، وُلد محمد بن أبي بكر الطوري. كان قائدًا في جيش سني علي، فأطاح بسني بارو سنة 1493، وبنى أكبر إمبراطورية في تاريخ غرب أفريقيا، وجعل الإسلام ركيزة للدولة، وحجّ (1496–1498) ونال لقبًا خلافيًّا، وتحالّف مع علماء تمبكتو. أصيب بالعمى وخلعه ابنه موسى سنة 1528، ثم أُعيد إلى جاو سنة 1537 ومات فيها سنة 1538."
  en: "Founder of the Askia dynasty and ruler of the Songhai Empire (r. 1493-1528), born Muhammad ibn Abi Bakr al-Turi. A general of Sunni Ali, he overthrew Sunni Baru in 1493, built West Africa's largest empire, made Islam integral to the state, performed the hajj (1496-1498) and received a caliphal title, and allied himself with Timbuktu's scholars. Blinded and deposed by his son Musa in 1528, he was recalled to Gao in 1537 and died there in 1538."
  ur: "آسکیا خاندان کے بانی اور سلطنت سونگھائی کے حکمران (دورِ حکومت 1493ء–1528ء)، پیدائشی نام محمد بن ابی بکر الطوری۔ سنی علی کے سپہ سالار تھے؛ 1493ء میں سنی بارو کو ہٹا کر تخت سنبھالا، مغربی افریقا کی سب سے بڑی سلطنت قائم کی، اسلام کو ریاست کا اٹوٹ انگ بنایا، حج کیا (1496ء–1498ء) اور خلفی لقب پایا، اور تمبکٹو کے علما سے اتحاد کیا۔ 1528ء میں بیٹے موسیٰ نے انھیں معزول کر دیا؛ 1537ء میں گاؤ واپس بلائے گئے اور 1538ء میں وہیں وفات پائی۔"

