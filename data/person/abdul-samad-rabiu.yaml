summary:
  ar: رجل أعمال نيجيري، وُلد سنة 1960؛ مؤسس ورئيس مجموعة ⁦BUA⁩، إحدى أكبر التكتلات الصناعية في أفريقيا — إسمنت وسكر وأغذية — ومن أغنى رجال أفريقيا، ومؤسس مؤسسة ⁦ASR⁩ للتنمية.
  en: Nigerian businessman, born 1960; founder and chairman of the BUA Group, one of Africa's largest industrial conglomerates — cement, sugar and foods — among Africa's richest men, and founder of the
    ASR philanthropic foundation.
  fr: "Homme d'affaires nigérian, né en 1960 ; fondateur et président du BUA Group, l'un des plus grands conglomérats industriels d'Afrique — ciment, sucre et produits alimentaires —, parmi les hommes les plus riches d'Afrique, et fondateur de la fondation philanthropique ASR."
  ur: نائیجیریائی کاروباری شخصیت، پیدائش 1960؛ بی یو اے گروپ کے بانی و چیئرمین، افریقہ کے بڑے صنعتی گروپوں میں سے ایک — سیمنٹ، چینی اور خوراک — افریقہ کے امیر ترین لوگوں میں، اور اے ایس آر فلاحی فاؤنڈیشن
    کے بانی۔
  es: "Empresario nigeriano, nacido en 1960; fundador y presidente del Grupo BUA, uno de los mayores conglomerados industriales de África (cemento, azúcar y alimentos), uno de los hombres más ricos de África, y fundador de la fundación filantrópica ASR."
  tr: "1960 doğumlu Nijeryalı bir iş adamı; Afrika'nın en büyük sanayi holdinglerinden biri olan BUA Grubu'nun (çimento, şeker ve gıda sektörlerinde faaliyet gösteren) kurucusu ve başkanı, Afrika'nın en zengin adamlarından biri ve ASR Kalkınma Vakfı'nın kurucusu."
  id: "Seorang pengusaha Nigeria, lahir tahun 1960; pendiri dan ketua BUA Group, salah satu konglomerat industri terbesar di Afrika — semen, gula, dan makanan — dan salah satu orang terkaya di Afrika, serta pendiri ASR Development Foundation."
