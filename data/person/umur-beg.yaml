summary:
  ar: "عمر بك بن آيدين، أمير الإمارة البحري وحليف يوحنا السادس كانتاكوزينوس، قُتل سنة 1348م وهو يحاول استرداد قلعة إزمير {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  en: "Umur Beg ibn Aydin, seafaring emir of the Aydın-oghlu and ally of John VI Cantacuzenus, killed in 1348 while trying to retake the fortress of İzmir {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  es: "Umur Beg ibn Aydin, emir marinero de Aydın-oghlu y aliado de Juan VI Cantacuzeno, murió en 1348 mientras intentaba retomar la fortaleza de Esmirna {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  fr: "Umur Beg ibn Aydin, émir marin des Aydın-oghlu et allié de Jean VI Cantacuzène, tué en 1348 alors qu'il tentait de reprendre la forteresse d'Izmir {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  ur: "عمر بیگ ابن آیدین، آیدن اوغلو کا سمندری امیر اور جان VI کانٹاکوزینس کا حلیف، 1348 میں ازمیر کے قلعے پر دوبارہ قبضہ کرنے کی کوشش کرتے ہوئے مارا گیا۔ 1 ص۔ 832}۔"
