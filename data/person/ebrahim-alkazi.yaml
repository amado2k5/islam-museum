summary:
  ar: "مخرج مسرحي ومعلم دراما هندي (1925–2020) من أب سعودي من عنيزة وأم كويتية، درس في الأكاديمية الملكية لفنون الدراما بلندن، وأدار المدرسة الوطنية للدراما في نيودلهي (1962–1977) فأحدث ثورة في المسرح الهندي الحديث، وأخرج أكثر من خمسين مسرحية."
  en: "Indian theatre director and drama teacher (1925–2020), son of a Saudi father from Unaizah and a Kuwaiti mother, who trained at RADA in London and as director of the National School of Drama in New Delhi (1962–1977) transformed modern Indian theatre, staging more than fifty plays."
  ur: "بھارتی تھیٹر ہدایت کار اور استادِ ڈراما (1925–2020)، جن کے والد عنیزہ (سعودی عرب) سے اور والدہ کویت سے تھیں؛ انھوں نے لندن کے راڈا میں تربیت پائی اور نئی دہلی کے نیشنل اسکول آف ڈراما کے ڈائریکٹر (1962–1977) کی حیثیت سے جدید بھارتی تھیٹر کو بدل کر رکھ دیا اور پچاس سے زائد ڈرامے پیش کیے۔"
