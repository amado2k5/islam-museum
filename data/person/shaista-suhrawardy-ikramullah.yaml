summary:
  ar: "سياسية ودبلوماسية وكاتبة باكستانية (1915–2000) من أسرة سهروردي في كلكتا، ابنة أخي حسين شهيد سهروردي؛ أول مسلمة تنال الدكتوراه من جامعة لندن (عن تطور الرواية والقصة الأردية). مثّلت باكستان في الأمم المتحدة وعملت على الإعلان العالمي لحقوق الإنسان، وكانت سفيرة بلادها في المغرب (1964–1967). كتابها الأشهر «من البرقع إلى البرلمان» (1963)، وكتبت سيرة عمها حسين شهيد سهروردي (1991)."
  en: "Pakistani politician, diplomat and author (1915–2000) of the Suhrawardy family of Calcutta, a niece of Huseyn Shaheed Suhrawardy; the first Muslim woman to earn a PhD from the University of London (on the development of the Urdu novel and short story). She represented Pakistan at the United Nations and worked on the Universal Declaration of Human Rights, and was Pakistan's ambassador to Morocco (1964–1967). Her best-known book is From Purdah to Parliament (1963); she also wrote the 1991 biography of her uncle Huseyn Shaheed Suhrawardy."
  ur: "پاکستانی سیاست دان، سفارت کار اور مصنفہ (1915ء–2000ء) جن کا تعلق کلکتہ کے سہروردی خاندان سے تھا اور جو حسین شہید سہروردی کی بھتیجی تھیں؛ لندن یونیورسٹی سے پی ایچ ڈی کرنے والی پہلی مسلم خاتون (ان کا مقالہ اردو ناول اور افسانے کی ترقی پر تھا)۔ انھوں نے اقوامِ متحدہ میں پاکستان کی نمائندگی کی اور انسانی حقوق کے عالمی منشور پر کام کیا، اور مراکش میں پاکستان کی سفیر رہیں (1964ء–1967ء)۔ ان کی مشہور ترین کتاب «From Purdah to Parliament» (1963ء) ہے؛ انھوں نے اپنے چچا حسین شہید سہروردی کی سوانح بھی لکھی (1991ء)۔"
