summary:
  ar: "المولى محيي الدين محمد بن إلياس المعروف بجوي زاده الحنفي؛ قال في الكواكب: هو أحسن قضاة الدولة العثمانية وأعفّهم وأصلحهم سيرة، ترقّى في المدارس على عادة موالي الروم وولي قضاء دمشق فدخلها خامس عشر صفر سنة سبع وسبعين وتسعمائة وانفصل في ختام السنة عن قضاء دمشق وأعطي قضاء مصر ثم صار قاضياً بالعسكر وفي آخر أمره صار مفتياً بالتخت السلطاني؛ وكانت سيرته في قضائه في غاية الحسن بحيث يضرب بها المثل، وكان رسم الحجة في دمشق قبل ولايته أربع عشرة قطعة فجعله عشراً ورسم الصورة ثمان قطع فجعله ستاً، ولم يقبل من أحد هدية أيام قضائه، ولما انفصل عن دمشق أمر منادياً ينادي يوم الجمعة بالجامع الأموي أن قاضي القضاة عزل عن دمشق فمن أعطاه شيئاً أو أخذ منه أحد من جماعته شيئاً أو تعدى عليه أحد فليرفع قصته إليه ليرد إليه ما ابتزع منه، فرفعت الناس أصواتهم بالبكاء والدعاء له؛ وقرأ على الشيخ الوالد في أوائل الكتب الستة واستجازه وكان يفتخر بقراءته عليه وإجازته، وكان حليماً إلى الغاية إلا في أمر الدين ومصالح المسلمين فإنه كان صلباً يغضب لله وبالغ في ردع السياسة؛ ومات وهو مفتي التخت السلطاني ليلة الخميس سادس جمادى الآخرة {cite:shadharat-dhahab p. 436-437}."
  en: "Jiwi-zade — 'best of the Ottoman qadis, most upright and chaste of conduct'; Damascus's qadi 977, then Egypt, qadi 'askar, finally mufti of the Sultanic seat; he cut Damascus's deed-fees, took no gift, and on leaving had a herald proclaim at the Umayyad mosque that anyone wronged should claim redress — the people wept and prayed for him; died Thursday eve 6 Jumada II 995 still mufti {cite:shadharat-dhahab p. 436-437}."
  es: "Jiwi-zade — 'el mejor de los cadíes otomanos, el más recto y casto de conducta'; cadí de Damasco en 977, luego cadí de Egipto, 'askar, finalmente muftí de la sede sultana; redujo los derechos de escritura de Damasco, no aceptó ningún regalo y, al irse, hizo que un heraldo proclamara en la mezquita de los Omeyas que cualquiera que hubiera sido agraviado debía reclamar una compensación; la gente lloró y oró por él; murió la víspera del jueves 6 de Jumada II de 995, todavía muftí {cita: shadharat-dhahab págs. 436-437}."
  fr: "Jiwi-zade — « le meilleur des cadis ottomans, d'une conduite des plus droites et chastes »; cadi de Damas en 977, puis cadi d'Égypte, 'askar, et enfin mufti du siège sultan; il abolit les droits d'acte à Damas, n'accepta aucun cadeau et, à son départ, fit proclamer par un héraut à la mosquée des Omeyyades que toute personne lésée devait réclamer réparation — le peuple pleura et pria pour lui; mourut le jeudi soir 6 Jumada II 995, toujours mufti {cite: shadharat-dhahab p. 436-437}."
  ur: "جیوی زادے - 'عثمانی قادیانیوں میں سب سے بہتر، سب سے زیادہ سیدھا اور پاکیزہ اخلاق'؛ دمشق کی قضا 977، پھر مصر، قادی عسکر، آخر میں سلطانی نشست کے مفتی؛ اس نے دمشق کی ڈیڈ فیس کاٹ دی، کوئی تحفہ نہیں لیا، اور نکلتے وقت اموی مسجد میں اعلان کیا کہ جو بھی ظلم کرے اسے ازالہ کا دعویٰ کرنا چاہیے- لوگ روتے رہے اور اس کے لیے دعا کرتے رہے۔ انتقال جمعرات کی شام 6 جمادی الثانی 995 اب بھی مفتی 436-437}۔"
  tr: "Mewla Muhyiddin Muhammed bin İlyas, Jawi Zada al-Hanafi olarak bilinir, El-Kawakib'de şöyle demiştir: Osmanlı devletinin en iyi, en soylu ve en adil yargıcıydı. Roma müvekkillerinin geleneğine uygun olarak okullarda yükseldi. 1977 yılında Şam yargıcı olarak atandı ve 1977 Sefer ayının on beşinde girdi. Yıl sonunda Şam yargısından ayrıldı ve Mısır yargıcı olarak atandı, ardından askeri yargıç oldu. Sonunda Sultan tahtında müftü oldu. Yargı davranışı son derece iyiydi, bu da onu mecazi bir örnek haline getirdi ve yetkili otorite oldu Şam hükümdarlığını on dört parça olarak kabul etti, on parça yaptı, resim çizerek altı parça oldu. Yargı döneminde kimseden hediye kabul etmedi. Şam'dan ayrıldığında, Cuma günü Emevi Camii'nde bir arayanın gelmesini emretti, başyargıcın Şam'dan çıkarıldığını bildirdi. Kim ona bir şey verdiyse, ya da grubundan biri ondan bir şey aldıysa ya da biri ona müdahale ettiyse, hikayesini ona getirsin ve elinden alınanı geri versin. İnsanlar onun için gözyaşları ve dualarla seslerini yükseltti; altı kitabın başında Şeyh El-Velid'e okudu ve izin verdi. Kur'an'ı okuma ve onaylamakla gurur duyuyordu ve din ve Müslümanların çıkarları dışında son derece hoşgörülüydü; çünkü kararlı, Allah uğruna öfkeli ve aşırı derecede ölçülü siyaset yapıyordu; Cumade'l-Akhirah'ın altıncı Perşembe gecesi Sultan tahtında müftü olarak görev yaparken vefat etti {alıntı:şadharat-dhahab, s. 436-437}."
  id: "Mawla Muhyiddin Muhammad ibn Ilyas, yang dikenal sebagai Jawi Zada al-Hanafi, berkata dalam Al-Kawakib: Ia adalah hakim terbaik, paling mulia, dan paling benar di negara Ottoman. Ia naik pangkat di sekolah-sekolah mengikuti adat klien Romawi. Ia diangkat menjadi hakim Damaskus, masuk pada tanggal lima belas Safar tahun 1977. Pada akhir tahun, ia memisahkan diri dari lembaga peradilan Damaskus dan diangkat sebagai hakim Mesir, kemudian menjadi hakim militer. Akhirnya, ia menjadi mufti di Takhta Sultan. Perilaku yudisialnya sangat baik, menjadikannya contoh yang terkenal, dan ia adalah otoritas otoritatif dalam Damaskus menerima aturannya sebagai empat belas potongan, menjadi sepuluh, dan menggambar delapan gambar menjadi enam. Dia tidak menerima hadiah dari siapa pun selama masa kehakimannya. Ketika dia berpisah dari Damaskus, dia memerintahkan seorang penemuan untuk berkunjung pada hari Jumat di Masjid Umayyah bahwa hakim ketua telah dikeluarkan dari Damaskus. Siapa pun yang memberinya sesuatu, atau jika seseorang dari kelompoknya mengambil sesuatu darinya, atau jika seseorang melanggar kehadirannya, biarkan dia membawa kisahnya untuk mengembalikan apa yang telah diambil darinya. Orang-orang meninggikan suara mereka dengan air mata dan doa untuknya; dia membacakan kepada Sheikh Al-Walid di awal enam kitab dan memberinya izin. Ia bangga dengan pembacaan dan otorisasi Al-Qur'an, dan sangat sabar kecuali dalam urusan agama dan kepentingan umat Muslim, karena ia teguh, marah demi Tuhan, dan terlalu menahan politik; ia meninggal saat menjabat sebagai Mufti tahta Sultan pada malam Kamis, tanggal enam Jumada al-Akhirah {cite:shadharat-dhahab, hlm. 436-437}."
