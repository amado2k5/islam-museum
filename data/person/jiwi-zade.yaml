summary:
  ar: "المولى محيي الدين محمد بن إلياس المعروف بجوي زاده الحنفي؛ قال في الكواكب: هو أحسن قضاة الدولة العثمانية وأعفّهم وأصلحهم سيرة، ترقّى في المدارس على عادة موالي الروم وولي قضاء دمشق فدخلها خامس عشر صفر سنة سبع وسبعين وتسعمائة وانفصل في ختام السنة عن قضاء دمشق وأعطي قضاء مصر ثم صار قاضياً بالعسكر وفي آخر أمره صار مفتياً بالتخت السلطاني؛ وكانت سيرته في قضائه في غاية الحسن بحيث يضرب بها المثل، وكان رسم الحجة في دمشق قبل ولايته أربع عشرة قطعة فجعله عشراً ورسم الصورة ثمان قطع فجعله ستاً، ولم يقبل من أحد هدية أيام قضائه، ولما انفصل عن دمشق أمر منادياً ينادي يوم الجمعة بالجامع الأموي أن قاضي القضاة عزل عن دمشق فمن أعطاه شيئاً أو أخذ منه أحد من جماعته شيئاً أو تعدى عليه أحد فليرفع قصته إليه ليرد إليه ما ابتزع منه، فرفعت الناس أصواتهم بالبكاء والدعاء له؛ وقرأ على الشيخ الوالد في أوائل الكتب الستة واستجازه وكان يفتخر بقراءته عليه وإجازته، وكان حليماً إلى الغاية إلا في أمر الدين ومصالح المسلمين فإنه كان صلباً يغضب لله وبالغ في ردع السياسة؛ ومات وهو مفتي التخت السلطاني ليلة الخميس سادس جمادى الآخرة {cite:shadharat-dhahab p. 436-437}."
  en: "Jiwi-zade — 'best of the Ottoman qadis, most upright and chaste of conduct'; Damascus's qadi 977, then Egypt, qadi 'askar, finally mufti of the Sultanic seat; he cut Damascus's deed-fees, took no gift, and on leaving had a herald proclaim at the Umayyad mosque that anyone wronged should claim redress — the people wept and prayed for him; died Thursday eve 6 Jumada II 995 still mufti {cite:shadharat-dhahab p. 436-437}."
