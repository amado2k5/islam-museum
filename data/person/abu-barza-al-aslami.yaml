summary:
  ar: "أبو برزة الأسلمي، غلبت عليه كنيته، والصحيح في اسمه نضلة بن عبيد كما قال أحمد ويحيى بن معين؛ أسلم قديماً وشهد فتح مكة، وروي عنه أنه قتل ابن خطل وهو متعلق بأستار الكعبة، ثم تحول إلى البصرة، ثم غزا خراسان، واختُلف في وفاته بخراسان أو بالبصرة في أواخر خلافة معاوية أو أيام يزيد أو سنة 64هـ {cite:istiab-alam-2002 p. 719, 783}؛ وكان على ميمنة ابن عامر يوم فتح إصطخر {cite:futuh-buldan-maarif-1407}."
  en: "Abu Barza al-Aslami, known by his kunya; his name is most soundly Nadla ibn 'Ubayd, as Ahmad and Yahya ibn Ma'in said; he accepted Islam early and was present at the conquest of Mecca, where he is reported to have killed Ibn Khatal as he clung to the curtains of the Ka'ba; he moved to Basra and campaigned in Khurasan, and the reports differ on whether he died in Khurasan or Basra, late in Mu'awiya's caliphate, under Yazid, or in 64 AH {cite:istiab-alam-2002 p. 719, 783}; he commanded Ibn 'Amir's right wing at the conquest of Istakhr {cite:futuh-buldan-maarif-1407}."
  ur: "ابو برزہ اسلمی، جن کی کنیت نام پر غالب آ گئی؛ ان کا صحیح نام نضلہ بن عبید ہے جیسا کہ احمد اور یحییٰ بن معین نے کہا؛ انہوں نے ابتدا میں اسلام قبول کیا اور فتح مکہ میں شریک ہوئے، جہاں ان سے مروی ہے کہ انہوں نے ابن خطل کو کعبہ کے پردوں سے چمٹے ہوئے قتل کیا؛ پھر بصرہ منتقل ہوئے اور خراسان میں جہاد کیا، اور ان کی وفات میں اختلاف ہے کہ خراسان میں یا بصرہ میں، معاویہ کی خلافت کے آخر میں، یزید کے زمانے میں یا 64ھ میں {cite:istiab-alam-2002 p. 719, 783}؛ فتحِ اصطخر کے دن وہ ابن عامر کے میمنہ پر تھے {cite:futuh-buldan-maarif-1407}۔"
