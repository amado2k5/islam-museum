summary:
  ar: "أبو برزة الأسلمي، غلبت عليه كنيته، والصحيح في اسمه نضلة بن عبيد كما قال أحمد ويحيى بن معين؛ أسلم قديماً وشهد فتح مكة، وروي عنه أنه قتل ابن خطل وهو متعلق بأستار الكعبة، ثم تحول إلى البصرة، ثم غزا خراسان، واختُلف في وفاته بخراسان أو بالبصرة في أواخر خلافة معاوية أو أيام يزيد أو سنة 64هـ {cite:istiab-alam-2002 p. 719, 783}؛ وكان على ميمنة ابن عامر يوم فتح إصطخر {cite:futuh-buldan-maarif-1407}."
  en: "Abu Barza al-Aslami, known by his kunya; his name is most soundly Nadla ibn 'Ubayd, as Ahmad and Yahya ibn Ma'in said; he accepted Islam early and was present at the conquest of Mecca, where he is reported to have killed Ibn Khatal as he clung to the curtains of the Ka'ba; he moved to Basra and campaigned in Khurasan, and the reports differ on whether he died in Khurasan or Basra, late in Mu'awiya's caliphate, under Yazid, or in 64 AH {cite:istiab-alam-2002 p. 719, 783}; he commanded Ibn 'Amir's right wing at the conquest of Istakhr {cite:futuh-buldan-maarif-1407}."
  ur: "ابو برزہ اسلمی، جن کی کنیت نام پر غالب آ گئی؛ ان کا صحیح نام نضلہ بن عبید ہے جیسا کہ احمد اور یحییٰ بن معین نے کہا؛ انہوں نے ابتدا میں اسلام قبول کیا اور فتح مکہ میں شریک ہوئے، جہاں ان سے مروی ہے کہ انہوں نے ابن خطل کو کعبہ کے پردوں سے چمٹے ہوئے قتل کیا؛ پھر بصرہ منتقل ہوئے اور خراسان میں جہاد کیا، اور ان کی وفات میں اختلاف ہے کہ خراسان میں یا بصرہ میں، معاویہ کی خلافت کے آخر میں، یزید کے زمانے میں یا 64ھ میں {cite:istiab-alam-2002 p. 719, 783}؛ فتحِ اصطخر کے دن وہ ابن عامر کے میمنہ پر تھے {cite:futuh-buldan-maarif-1407}۔"
  fr: "Abu Barza al-Aslami, connu par sa kunya ; son nom est le plus sûrement Nadla ibn 'Ubayd, comme le dirent Ahmad et Yahya ibn Ma'in ; il embrassa l'islam tôt et fut présent à la conquête de La Mecque, où il aurait tué Ibn Khatal accroché aux voiles de la Ka'ba ; il s'installa à Bassora et fit campagne au Khurasan, et les récits divergent sur sa mort, au Khurasan ou à Bassora, à la fin du califat de Mu'awiya, sous Yazid, ou en 64 H {cite:istiab-alam-2002 p. 719, 783} ; il commanda l'aile droite d'Ibn 'Amir lors de la conquête d'Istakhr {cite:futuh-buldan-maarif-1407}."
  es: "Abu Barza al-Aslami, conocido por su kunya; su nombre más apropiado es Nadla ibn 'Ubayd, como dijeron Ahmad y Yahya ibn Ma'in; aceptó el Islam tempranamente y estuvo presente en la conquista de La Meca, donde se dice que mató a Ibn Khatal mientras este se aferraba a las cortinas de la Kaaba; se trasladó a Basora y realizó campañas en Jorasán, y los informes difieren sobre si murió en Jorasán o Basora, a finales del califato de Muawiya, bajo Yazid, o en el año 64 de la Hégira {cite:istiab-alam-2002 p. 719, 783}; comandó el ala derecha de Ibn 'Amir en la conquista de Istakhr {cite:futuh-buldan-maarif-1407}."
  tr: "Lakabı Ebu Berza el-Aslami olan bu kişinin asıl adı, Ahmed ve Yahya bin Ma'in'in de belirttiği gibi Nadla bin Ubaid'dir. İslamiyet'i erken kabul etmiş ve Mekke'nin fethine şahit olmuştur. Rivayetlere göre, Kâbe'nin perdelerine tutunmuş haldeyken İbn Hattal'i öldürmüştür. Daha sonra Basra'ya gitmiş, oradan da Horasan'ı yağmalamıştır. Horasan'da mı, Basra'da mı, Muaviye halifeliğinin sonlarında mı, Yezid döneminde mi yoksa Hicri 64 yılında mı öldüğü konusunda ihtilaf vardır. İstikhr'un fethi gününde İbn Amir'in sağ kanadında yer almıştır."
  id: "Abu Barza al-Aslami, julukannya lebih dikenal luas, dan nama yang benar adalah Nadla bin Ubaid, sebagaimana dikatakan Ahmad dan Yahya bin Ma’in. Ia memeluk Islam sejak dini dan menyaksikan penaklukan Mekah. Diriwayatkan bahwa ia membunuh Ibn Khatal ketika ia berpegangan pada tirai Ka'bah. Kemudian ia pindah ke Basra, lalu ia menyerbu Khorasan. Terdapat perbedaan pendapat mengenai kematiannya di Khorasan atau di Basra pada akhir kekhalifahan Muawiya atau pada masa Yazid atau pada tahun 64 H {cite:istiab-alam-2002 hlm. 719, 783}. Ia berada di sayap kanan Ibn Amir pada hari penaklukan Istakhr {cite:futuh-buldan-maarif-1407}."
