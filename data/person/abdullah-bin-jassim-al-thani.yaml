summary:
  ar: "عبد الله بن جاسم آل ثاني، أبو علي (وُلد في الدوحة في 11 فبراير 1880 – توفي في 25 أبريل 1957)، أمير قطر من 1913 إلى 1949 وابن جاسم بن محمد مؤسس الدولة؛ شهد عهده المعاهدة مع بريطانيا سنة 1916 وامتياز النفط الأول سنة 1935 واكتشاف النفط في دخان سنة 1940، وتنازل مرتين قبل أن يعتزل نهائيًا لابنه علي."
  en: "Abdullah bin Jassim Al Thani, Abu Ali (born at Doha on 11 February 1880 – died on 25 April 1957), Emir of Qatar from 1913 to 1949 and the son of Jassim bin Mohammed, the state's founder; his reign saw the 1916 treaty with Britain, the first oil concession in 1935 and the discovery of oil at Dukhan in 1940, and he abdicated twice before finally retiring in favour of his son Ali."
  ur: "عبداللہ بن جاسم الثانی، ابو علی (پیدائش: دوحہ، 11 فروری 1880ء – وفات: 25 اپریل 1957ء)، 1913ء سے 1949ء تک امیرِ قطر اور ریاست کے بانی جاسم بن محمد کے بیٹے؛ ان کے عہد میں 1916ء کا برطانوی معاہدہ، 1935ء کا پہلا تیل امتیاز اور 1940ء میں دخان میں تیل کی دریافت ہوئی، اور وہ دو بار دستبردار ہونے کے بعد بالآخر بیٹے علی کے حق میں سبکدوش ہوئے۔"
