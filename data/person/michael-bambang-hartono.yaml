summary:
  ar: "مايكل بامبانغ هارتونو (وُلد باسم أوي هوي سيانغ في 2 تشرين الأول 1939 في كودوس، وتوفي في 19 آذار 2026 في سنغافورة) رجل أعمال إندونيسي ورث مع أخيه الأصغر روبرت بودي شركة جاروم سنة 1963 وبنى معه المجموعة وبنك سنترال آسيا؛ لاعب بريدج دولي نال برونزية ألعاب آسيا 2018 أكبر رياضيي إندونيسيا سنًا، وكان كاثوليكيًا كما تشهد نصوص مستقلة."
  en: "Michael Bambang Hartono (born Oei Hwie Siang on 2 October 1939 in Kudus; died 19 March 2026 in Singapore) was an Indonesian businessman who inherited Djarum with his younger brother Robert Budi Hartono in 1963 and built the Djarum Group and Bank Central Asia with him; an international bridge player, he won bronze at the 2018 Asian Games as Indonesia's oldest athlete, and two independent texts attest that he was a Catholic."
  ur: "مائیکل بمبانگ ہارٹونو (پیدائش بطور اوئی ہوئیے سیانگ 2 اکتوبر 1939، کڈس؛ وفات 19 مارچ 2026، سنگاپور) انڈونیشیائی کاروباری تھے جنھوں نے اپنے چھوٹے بھائی رابرٹ بوڈی ہارٹونو کے ساتھ 1963 میں جاروم وراثت میں پائی اور ان کے ساتھ جاروم گروپ اور بینک سینٹرل ایشیا بنایا؛ بین الاقوامی برج کھلاڑی، انھوں نے 2018 کے ایشیائی کھیلوں میں انڈونیشیا کے سب سے عمر رسیدہ کھلاڑی کے طور پر کانسی کا تمغہ جیتا، اور دو آزاد متن شہادت دیتے ہیں کہ وہ کیتھولک تھے۔"
