summary:
  ar: "زين الدين المراغي ثم المدني الشافعي؛ ولد سنة ثمان وعشرين وسبعمائة وأجاز له أبو العباس بن الشحنة فكان آخر من حدث عنه في الدنيا بالإجازة وأجاز له المزي والبرزالي والحجار وتفرد بالرواية عن أكثرهم، وخرج له الحافظ ابن حجر أربعين حديثاً عن أربعين شيخاً ولازم الشيخ جلال الدين الأسنوي وولي قضاء المدينة وخطابتها سنة تسع وثمانمائة وشرح المنهاج الفقهي واختصر تاريخ المدينة ولازم الإشغال والتحديث بالروضة الشريفة حتى صار شيخها المشار إليه ثم عزل عن قضائها فتألم لذلك وتوفي بالمدينة في ذي الحجة {cite:shadharat-dhahab p. 129}."
  en: "Zayn al-Din al-Marighi (b. 728) — last living transmitter of Abu al-Abbas Ibn al-Shihna, qadi and khatib of Medina from 809, shaykh of the Rawda's reciters; abridged the history of Medina and commented al-Minhaj; died at Medina in Dhu al-Hijja 815 {cite:shadharat-dhahab p. 129}."
