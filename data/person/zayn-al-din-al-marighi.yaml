summary:
  ar: "زين الدين المراغي ثم المدني الشافعي؛ ولد سنة ثمان وعشرين وسبعمائة وأجاز له أبو العباس بن الشحنة فكان آخر من حدث عنه في الدنيا بالإجازة وأجاز له المزي والبرزالي والحجار وتفرد بالرواية عن أكثرهم، وخرج له الحافظ ابن حجر أربعين حديثاً عن أربعين شيخاً ولازم الشيخ جلال الدين الأسنوي وولي قضاء المدينة وخطابتها سنة تسع وثمانمائة وشرح المنهاج الفقهي واختصر تاريخ المدينة ولازم الإشغال والتحديث بالروضة الشريفة حتى صار شيخها المشار إليه ثم عزل عن قضائها فتألم لذلك وتوفي بالمدينة في ذي الحجة {cite:shadharat-dhahab p. 129}."
  en: "Zayn al-Din al-Marighi (b. 728) — last living transmitter of Abu al-Abbas Ibn al-Shihna, qadi and khatib of Medina from 809, shaykh of the Rawda's reciters; abridged the history of Medina and commented al-Minhaj; died at Medina in Dhu al-Hijja 815 {cite:shadharat-dhahab p. 129}."
  es: "Zayn al-Din al-Marighi (n. 728): último transmisor vivo de Abu al-Abbas Ibn al-Shihna, qadi y khatib de Medina desde 809, jeque de los recitadores de Rawda; resumió la historia de Medina y comentó al-Minhaj; murió en Medina en Dhu al-Hijja 815 {cita: shadharat-dhahab p. 129}."
  fr: "Zayn al-Din al-Marighi (né en 728) — dernier transmetteur vivant d'Abu al-Abbas Ibn al-Shihna, cadi et khatib de Médine à partir de 809, cheikh des récitants de Rawda; a abrégé l'histoire de Médine et a commenté al-Minhaj; mort à Médine à Dhu al-Hijja 815 {cite: shadharat-dhahab p. 129}."
  ur: "زین الدین المریضی ⁦(وفات 728)⁩ - ابو العباس ابن الشہنہ کا آخری زندہ ٹرانسمیٹر، مدینہ کے قادی اور خطیب 809 سے، روضہ کے قاریوں کے شیخ؛ مدینہ کی تاریخ کا خلاصہ کیا اور المنہاج پر تبصرہ کیا۔ ذی الحجہ 815 میں مدینہ میں وفات پائی۔ 129}۔"
  tr: "Zeynin el-Din el-Maragi, o zamanlar el-Medeni el-Şafii; 728 Hicri yılında doğmuş, Ebu el-Abbas bin Şahna'dan izin alarak dünyada ondan yetki alan son kişi olmuştur. El-Mizzi, el-Barzali ve el-Hiccar ona yetki vermiştir ve çoğunun tek anlatıcısı odur. Hafız İbn Hajar, kırk şeyhten kırk hadis anlatmıştır, Şeyh Celaleddin el-Esnavi ile yakın ilişkili olan Medine'nin yargısını devraldı ve 800 Hicri yılında vaaz verdi. Medine'nin hukuk metodolojisini açıkladı, Medine'nin tarihini kısalttı ve şeyhi olana kadar sürekli olarak Ravidat el-Şerif'te çalıştı ve güncelledi. Daha sonra yargıdan çekildi, bu durumdan muzdarip oldu ve Medine'de Zhu-Hicce'de öldü {alıntı:Shadharat-Dhahab, s. 129}."
  id: "Zain al-Din al-Maraghi, yang saat itu al-Madani al-Shafi'i; lahir pada tahun 728 H, memberikan izin dari Abu al-Abbas ibn al-Shahna, menjadikannya yang terakhir menceritakan darinya di dunia dengan izin. Al-Mizzi, al-Barzali, dan al-Hijjar memberikannya, dan ia adalah satu-satunya narator dari sebagian besar dari mereka. Al-Hafiz Ibn Hajar menceritakan empat puluh hadits dari empat puluh sheikh yang sangat terkait dengan Sheikh Jalal al-Din al-Asnawi, mengambil alih kehakiman Madinah, dan mengajarkannya pada tahun 800 H. Ia menjelaskan metodologi firishesi, merangkum sejarah Madinah, dan terus terlibat serta memperbarui di al-Rawdat al-Sharifah hingga ia menjadi sheikh. Ia kemudian diberhentikan dari peradilan tersebut, menderita karenanya, dan meninggal di Madinah di Dhu al-Hijjah {cite::) Shadharat-Dhahab, hlm. 129}."
