label: { ar: "النعمان بن صهبان الراسبي", en: "al-Nu'man ibn Suhban al-Rasibi", fr: "al-Nu'man ibn Suhban al-Rasibi", es: "al-Nu'man ibn Suhban al-Rasibi", ur: "النعمان بن سحبان الراسیبی" }
summary:
  ar: "النعمان بن صهبان الراسبي؛ حكم بين مضر وربيعة أيام مات يزيد بن معاوية وكان له قصر النعمان بالبصرة فزاده فيه عبيد الله بن زياد فقال بئس المال إن كثر الماء غرقت وإن قل عطشت فكان كما قال."
  en: "Al-Nu'man ibn Suhban al-Rasibi; he judged between Mudar and Rabi'a in the days Yazid died — his Qasr al-Nu'man enlarged by Ubaydallah drew his prophecy 'evil wealth: much water drowns, little parching', which came to pass."
  fr: "Al-Nu'man ibn Suhban al-Rasibi ; il a jugé entre Mudar et Rabi'a dans les jours où Yazid est mort - son Qasr al-Nu'man agrandi par Ubaydallah a dessiné sa prophétie « mauvaise richesse : beaucoup d'eau se noie, peu de dessèchement », qui s'est produite."
  es: "Al-Nu'man ibn Suhban al-Rasibi; juzgó entre Mudar y Rabi'a en los días en que murió Yazid; su Qasr al-Nu'man, ampliado por Ubaydallah, extrajo su profecía 'riqueza maligna: mucha agua ahoga, poca sequedad', que se cumplió."
  ur: "النعمان بن سحبان الراسیبی؛ اس نے یزید کی موت کے دنوں میں مدر اور ربیعہ کے درمیان فیصلہ کیا - اس کے قصر النعمان کو عبیداللہ نے بڑھایا جس میں اس کی پیشن گوئی 'بد دولت: بہت زیادہ پانی ڈوب جاتا ہے، تھوڑا سا پارچنگ'، جو پورا ہوا۔"
  tr: "El-Nu'man bin Sahban el-Rasbi; Yezid bin Muaviye öldüğü günlerde Mudar ile Rebi'ah arasında hüküm sürdü. Basra'da el-Nu'man'ın sarayı vardı, ancak Ubeyd Allah ibn Ziyad ona şöyle ekledi: 'Zenginlik ne kadar korkunç? Çok fazla su varsa boğulursun; az susuzluk varsa, dediği gibidir.'"
  id: "Al-Nu'man ibn Sahban al-Rasbi; memerintah antara Mudar dan Rabi'ah pada masa Yazid ibn Muawiyah wafat. Ia memiliki istana al-Nu'man di Basra, tetapi Ubayd Allah ibn Ziyad menambahkannya, berkata: 'Betapa mengerikannya kekayaan? Jika terlalu banyak air, kau tenggelam; jika sedikit haus, seperti yang ia katakan.'"
