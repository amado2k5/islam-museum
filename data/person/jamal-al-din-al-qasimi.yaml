summary:
  ar: "جمال الدين بن محمد سعيد القاسمي (١٨٦٦–١٩١٤م)، من سلالة الحسين السبط؛ «إمام الشام في عصره» علماً بالدين وتضلعاً من فنون الأدب. مولده ووفاته بدمشق. كان سلفي العقيدة لا يقول بالتقليد، انتدبته الحكومة للرحلة وإلقاء الدروس العامة في القرى والبلاد السورية أربع سنين (١٣٠٨–١٣١٢هـ)، ثم رحل إلى مصر وزار المدينة، ولما عاد اتهمه حسادُه بتأسيس مذهب جديد سمّوه «المذهب الجمالي» فقبضت عليه الحكومة سنة ١٣١٣هـ وسألته، فردّ التهمة فأُخلي سبيله واعتذر إليه والي دمشق، فانقطع في منزله للتصنيف وإلقاء الدروس في التفسير وعلوم الشريعة والأدب. أحصى له الزركلي اثنين وسبعين مصنفاً منها «دلائل التوحيد» و«الفتوى في الإسلام» و«إصلاح المساجد من البدع والعوائد» و«قواعد التحديث من فن مصطلح الحديث» و«محاسن التأويل» في اثني عشر مجلداً في التفسير، و«موعظة المؤمنين» اختصر به إحياء علوم الدين للغزالي {cite:al-aalam tarjama}."
  en: "Jamal al-Din al-Qasimi (1866–1914 CE) — the Damascene reformist scholar tried over the alleged 'Jamali madhhab', author of seventy-two works including Qawa'id al-Tahdith and the twelve-volume Mahasin al-Ta'wil {cite:al-aalam tarjama}."
