summary:
  ar: "جمال الدين بن محمد سعيد القاسمي ⁦(١٨٦٦–١٩١٤م)⁩، من سلالة الحسين السبط؛ «إمام الشام في عصره» علماً بالدين وتضلعاً من فنون الأدب. مولده ووفاته بدمشق. كان سلفي العقيدة لا يقول بالتقليد، انتدبته الحكومة للرحلة وإلقاء الدروس العامة في القرى والبلاد السورية أربع سنين ⁦(١٣٠٨–١٣١٢هـ)⁩، ثم رحل إلى مصر وزار المدينة، ولما عاد اتهمه حسادُه بتأسيس مذهب جديد سمّوه «المذهب الجمالي» فقبضت عليه الحكومة سنة ١٣١٣هـ وسألته، فردّ التهمة فأُخلي سبيله واعتذر إليه والي دمشق، فانقطع في منزله للتصنيف وإلقاء الدروس في التفسير وعلوم الشريعة والأدب. أحصى له الزركلي اثنين وسبعين مصنفاً منها «دلائل التوحيد» و«الفتوى في الإسلام» و«إصلاح المساجد من البدع والعوائد» و«قواعد التحديث من فن مصطلح الحديث» و«محاسن التأويل» في اثني عشر مجلداً في التفسير، و«موعظة المؤمنين» اختصر به إحياء علوم الدين للغزالي {cite:al-aalam tarjama}."
  en: "Jamal al-Din al-Qasimi (1866–1914 CE) — the Damascene reformist scholar tried over the alleged 'Jamali madhhab', author of seventy-two works including Qawa'id al-Tahdith and the twelve-volume Mahasin al-Ta'wil {cite:al-aalam tarjama}."
  es: "Jamal al-Din al-Qasimi (1866–1914 d. C.) — el erudito reformista de Damasco juzgado por la supuesta 'madhhab Jamali', autor de setenta y dos obras, entre ellas Qawa'id al-Tahdith y el Mahasin al-Ta'wil de doce volúmenes {cite:al-aalam tarjama}."
  fr: "Jamal al-Din al-Qasimi (1866–1914 CE) — le savant réformateur damascène jugé pour le prétendu « madhhab Jamali », auteur de soixante-douze ouvrages, dont Qawa'id al-Tahdith et le Mahasin al-Ta'wil en douze volumes {cite:al-aalam tarjama}."
  ur: "جمال الدین القاسمی ⁦(1866-1914 عیسوی)⁩ - دمشقی اصلاح پسند عالم نے مبینہ 'جمالی مذہب' پر مقدمہ چلایا، جس میں قوائد التحدیث اور بارہ جلدوں پر مشتمل محسن التعویل کے مصنف ہیں۔"
  tr: "Cemaleddin bin Muhammed Said el-Kasimi (1866–1914), Hüseyin el-Sibt soyundan gelen; 'kendi döneminde Levant İmamı', din bilgisi ve edebiyatta oldukça bilgiliydi. Şam'da doğdu ve orada öldü. Taklit etmeyen bir Selefiydi. Hükümet onu dört yıl boyunca Suriye köylerinde ve topraklarında (1308–1312 H) seyahat edip halka ders vermekle görevlendirdi. Daha sonra Mısır'a giderek Medine'yi ziyaret etti. Döndüğünde, kıskançlığı onu 'estetik okul' adını verdiği yeni bir mezhep kurmakla suçladı. Hükümet onu 1313 Hicri'de tutukladı ve sorguladı. Tekrar suçlamaya döndü, serbest bırakıldı ve Şam valisi ondan özür diledi. Evde kalıp Kur'an bilimleri, Şeriat illeri ve edebiyatı dersleri verdi. El-Zerkali onun için yetmiş iki eser saydı; bunlar arasında \"Dalail al-Tawhid,\" \"Fetva fi al-Islam,\" \"Islah al-Masajid min al-Bid' wa al-'Awa'id,\" \"Qawa'id al-Hadith min Fn Fan Mushtaq al-Hadis\" ve \"Mahasin al-Ta'wil\" adlı on iki cilt halinde tefsir üzerine saydı; ayrıca \"Maw'izat al-Mu'minin\" adlı eserinde al-Ghazali'nin \"İhya Ulum al-Din\" (alıntı:al-aalam tarjama} adlı eserini kısalttı."
  id: "Jamal al-Din ibn Muhammad Sa'id al-Qasimi (1866–1914 M), dari garis keturunan Husayn al-Sibt; 'Imam Levant pada zamannya,' memiliki pengetahuan agama dan mahir dalam seni sastra. Ia lahir dan meninggal di Damaskus. Ia adalah seorang Salafi yang tidak mengikuti tiruan. Pemerintah menugaskannya untuk bepergian dan memberikan pelajaran umum di desa-desa dan tanah Suriah selama empat tahun (1308–1312 H). Ia kemudian pergi ke Mesir dan mengunjungi Madinah. Ketika kembali, orang iri menuduhnya mendirikan sekte baru yang ia sebut 'sekolah estetika.' Pemerintah menangkapnya pada tahun 1313 H dan menginterogasinya. Ia kembali ke tuduhan, dan dibebaskan serta gubernur Damaskus meminta maaf kepadanya. Ia tinggal di rumah untuk menulis dan memberikan pelajaran ilmu Al-Qur'an, ilmu Syariah, dan sastra. Al-Zarkali menyebutkan tujuh puluh dua karya untuknya, termasuk \"Dalail al-Tawhid,\" \"Fatwa fi al-Islam,\" \"Islah al-Masajid min al-Bid' wa al-'Awa'id,\" \"Qawa'id al-Hadith min Fn Fan Mushtaq al-Hadith,\" dan \"Mahasin al-Ta'wil\" dalam dua belas jilid tentang tafsir, serta \"Maw'izat al-Mu'minin,\" di mana ia merangkum \"Ihya Ulum al-Din\" (kutip: al-aalam tarjama}) karya al-Ghazali."
