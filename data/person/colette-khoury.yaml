summary:
  ar: "روائية وشاعرة سورية (توفيت 2026)، حفيدة رئيس الوزراء فارس الخوري وابنة الوزير سهيل الخوري. رائدة من رائدات الأدب النسوي العربي، اشتهرت بروايتها «أيام معه» (1961)، وكانت عضوًا في مجلس الشعب ومستشارة أدبية لرئيس الجمهورية."
  en: "Syrian novelist and poet (died 2026), granddaughter of prime minister Fares al-Khoury and daughter of the minister Suhail al-Khoury. A pioneer of Arab feminist literature, she became known for her novel Days With Him (1961), sat in the People's Council, and served as literary adviser to the president."
  ur: "سوری ناول نگار اور شاعرہ (وفات 2026)، وزیرِ اعظم فارس الخوری کی پوتی اور وزیر سہیل الخوری کی بیٹی۔ عرب نسوانی ادب کی پیش رو، وہ اپنے ناول «أيام معه» (1961) سے مشہور ہوئیں، مجلس الشعب کی رکن رہیں اور صدر کی ادبی مشیر بھی۔"
