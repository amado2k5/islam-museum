summary:
  ar: "الشيخ شمس الدين محمد بن أبي بكر بن قيم الجوزية الحنبلي الدمشقي (٦٩١-٧٥١هـ/١٢٩٢-١٣٥٠م)؛ أشهر تلاميذ ابن تيمية وسجينه في قلعة دمشق ٧٢٦-٧٢٨هـ، وصاحب إعلام الموقعين عن رب العالمين {cite:kashf-zunun-furqan p. 518} ومدارج السالكين والصواعق المرسلة {cite:durar-kamina-jil-1993 3/402}؛ درّس بالصدرية حتى وفاته ودُفن بمقبرة باب الصغير {cite:encyclopaedia-of-islam-2 vol. 3 pp. 854-855}."
  en: "Shams al-Din Muhammad ibn Abi Bakr, Ibn Qayyim al-Jawziyya al-Hanbali al-Dimashqi (691-751/1292-1350) — Ibn Taymiyya's most famous pupil and his fellow-prisoner in the Damascus citadel in 726-728; author of I'lam al-Muwaqqi'in {cite:kashf-zunun-furqan p. 518}, Madarij al-Salikin and al-Sawa'iq al-Mursala {cite:durar-kamina-jil-1993 3/402}; he taught at the Sadriyya until his death and is buried at Bab al-Saghir {cite:encyclopaedia-of-islam-2 vol. 3 pp. 854-855}."
  ur: "شمس الدین محمد بن ابی بکر، ابن قیم الجوزیہ حنبلی دمشقی (691-751ھ/1292-1350ء)؛ ابن تیمیہ کے مشہور ترین شاگرد اور 726-728ھ میں قلعہ دمشق میں ان کے ہم قید؛ اعلام الموقعین {cite:kashf-zunun-furqan p. 518}، مدارج السالکین اور الصواعق المرسلہ کے مصنف {cite:durar-kamina-jil-1993 3/402}؛ وفات تک صدریہ میں تدریس کی اور باب صغیر میں دفن ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 pp. 854-855}۔"
