summary:
  ar: "هاكان فيدان ⁦(وُلد في 17 تموز 1968 في أنقرة)⁩ سياسي تركي يشغل وزارة الخارجية منذ حزيران 2023. كان ضابط صف (1986–2001) ثم مدير وكالة تيكا للتعاون والتنمية (2003–2007)، وترأس جهاز الاستخبارات الوطنية من 2010 إلى 2023، فصار من صانعي السياسة الإقليمية التركية."
  en: "Hakan Fidan (born 17 July 1968 in Ankara) is a Turkish politician serving as Minister of Foreign Affairs since June 2023. A former non-commissioned officer (1986–2001) who directed the TİKA development agency (2003–2007), he led the National Intelligence Organization from 2010 to 2023, the tenure that made him one of the architects of Turkey's regional policy."
  ur: "ہاکان فیدان ⁦(پیدائش 17 جولائی 1968، انقرہ)⁩ ترک سیاست دان ہیں جو جون 2023 سے وزیر خارجہ ہیں۔ وہ سابق نان کمیشنڈ افسر (1986–2001) اور تیکا کے ڈائریکٹر (2003–2007) رہے، اور 2010 سے 2023 تک قومی انٹیلیجنس تنظیم کے سربراہ رہے۔"
  es: "Hakan Fidan (nacido el 17 de julio de 1968 en Ankara) es un político turco que se desempeña como Ministro de Asuntos Exteriores desde junio de 2023. Ex suboficial (1986-2001) que dirigió la agencia de desarrollo TİKA (2003-2007), lideró la Organización Nacional de Inteligencia desde 2010 hasta 2023, período que lo convirtió en uno de los artífices de la política regional de Turquía."
  fr: "Hakan Fidan (né le 17 juillet 1968 à Ankara) est un homme politique turc qui occupe le poste de ministre des Affaires étrangères depuis juin 2023. Ancien sous-officier (1986-2001) qui a dirigé l'agence de développement TİKA (2003-2007), il a dirigé l'Organisation nationale du renseignement de 2010 à 2023, période durant laquelle il a été l'un des architectes de la politique régionale de la Turquie."
  tr: "Hakan Fidan (17 Temmuz 1968, Ankara doğumlu), Haziran 2023'ten beri Dışişleri Bakanı olarak görev yapan Türk bir siyasetçidir. Astsubay (1986–2001), ardından TIKA İşbirliği ve Kalkınma Ajansı Direktörü (2003–2007) olarak görev yaptı ve 2010'dan 2023'e kadar Ulusal İstihbarat Servisi'nin başında kalarak Türkiye'nin bölgesel politika yapıcılarından biri oldu."
  id: "Hakan Fidan (lahir 17 Juli 1968 di Ankara) adalah seorang politikus Turki yang telah menjabat sebagai Menteri Luar Negeri sejak Juni 2023. Ia pernah menjadi bintara (1986–2001) lalu Direktur Badan TIKA untuk Kerja Sama dan Pembangunan (2003–2007), dan memimpin Dinas Intelijen Nasional dari 2010 hingga 2023, menjadi salah satu pembuat kebijakan regional Turki."
