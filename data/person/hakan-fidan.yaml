  ar: "هاكان فيدان ⁦(وُلد في 17 تموز 1968 في أنقرة)⁩ سياسي تركي يشغل وزارة الخارجية منذ حزيران 2023. كان ضابط صف (1986–2001) ثم مدير وكالة تيكا للتعاون والتنمية (2003–2007)، وترأس جهاز الاستخبارات الوطنية من 2010 إلى 2023، فصار من صانعي السياسة الإقليمية التركية."
  en: "Hakan Fidan (born 17 July 1968 in Ankara) is a Turkish politician serving as Minister of Foreign Affairs since June 2023. A former non-commissioned officer (1986–2001) who directed the TİKA development agency (2003–2007), he led the National Intelligence Organization from 2010 to 2023, the tenure that made him one of the architects of Turkey's regional policy."
