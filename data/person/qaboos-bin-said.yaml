summary:
  ar: "سلطان عُمان من 23 يوليو 1970 حتى وفاته سنة 2020، أطول قادة الشرق الأوسط والعالم العربي بقاءً في الحكم عند وفاته. وُلد في صلالة سنة 1940، الابن الوحيد لسعيد بن تيمور، وتخرج في أكاديمية ساندهيرست وخدم في الجيش البريطاني، ثم أطاح بوالده سنة 1970 وأسّس سلطنة عُمان الموحدة، فأنهى عزلتها وقاد نهضتها: التعليم والصحة والبنية التحتية، وإلغاء الرق، وإنهاء تمرد ظفار، ودستور سنة 1996، مع سياسة خارجية محايدة جعلت عُمان وسيطًا إقليميًا. لم يكن له أبناء، فخلفه ابن عمه هيثم بن طارق بحسب رسالة مخفية تركها. توفي في 10 يناير 2020."
  en: "Sultan of Oman from 23 July 1970 until his death in 2020, the longest-serving leader in the Middle East and the Arab world at his death. Born at Salalah in 1940, the only son of Said bin Taimur, he graduated from Sandhurst, served briefly in the British Army, then overthrew his father in 1970 and founded the unified Sultanate of Oman, ending its isolation and leading its renaissance: schools, hospitals and infrastructure, the abolition of slavery, the end of the Dhofar rebellion, and the 1996 constitution, with a neutral foreign policy that made Oman a regional mediator. He had no children; his cousin Haitham bin Tariq succeeded him under a sealed letter Qaboos had left. He died on 10 January 2020."
  ur: "عمان کے سلطان، 23 جولائی 1970ء سے 2020ء میں وفات تک، اور وفات کے وقت مشرقِ وسطیٰ اور عرب دنیا کے سب سے طویل عرصے تک حکمران رہنے والے رہنما۔ 1940ء میں صلالہ میں پیدا ہوئے، سعید بن تیمور کے اکلوتے صاحبزادے؛ سینڈہرسٹ سے فارغ التحصیل ہوئے اور برطانوی فوج میں مختصر خدمت کی، پھر 1970ء میں والد کو معزول کر کے متحدہ سلطنتِ عمان قائم کی، اس کی تنہائی ختم کی اور اس کی نشاۃِ ثانیہ کی قیادت کی: تعلیم، صحت اور بنیادی ڈھانچہ، غلامی کا خاتمہ، ظفار بغاوت کا اختتام، اور 1996ء کا آئین، جب کہ غیر جانبدار خارجہ پالیسی نے عمان کو علاقائی ثالث بنایا۔ ان کی کوئی اولاد نہیں تھی؛ ان کے چچازاد ہیتھم بن طارق ان کی چھوڑی ہوئی مہر بند وصیت کے مطابق جانشین بنے۔ 10 جنوری 2020ء کو وفات پائی۔"
