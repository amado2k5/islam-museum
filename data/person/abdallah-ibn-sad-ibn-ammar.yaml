label: { ar: "عبد الله بن سعد بن عمار", en: "Abdallah ibn Sad ibn Ammar", fr: "Abdallah ibn Sad ibn Ammar", es: "Abdallah ibn Sad ibn Ammar", ur: "عبداللہ بن سعد بن عمار" }
gender: male
summary:
  ar: "أول من دخل الأندلس من ولد عمار بن ياسر؛ أخبر ابن حيان أن يوسف بن عبد الرحمن الفهري كتب إليه يستنهضه على دفاع عبد الرحمن بن معاوية الداخل وكان أميراً على اليمانية من جند دمشق، وإنما ركن إليه لما بين بني عمار وبين بني أمية من الثأر بسبب قتل عمار بصفين {cite:nafh-tib-maqqari p. 332}."
  en: "First of Ammar b. Yasir's line to enter al-Andalus; as amir of the Damascene Yamanis, Yusuf al-Fihri called on him against Abd al-Rahman al-Dakhil, counting on the old blood-feud from Ammar's death at Siffin {cite:nafh-tib-maqqari p. 332}."
  fr: "Premier de la lignée d'Ammar b. Yasir à entrer en al-Andalus ; comme émir des Yéménites de Damas, Yusuf al-Fihri fit appel à lui contre Abd al-Rahman al-Dakhil, comptant sur la vieille vendetta née de la mort d'Ammar à Siffin {cite:nafh-tib-maqqari p. 332}."
  es: "Primero de la línea de Ammar b. Yasir en entrar en al-Ándalus; como emir de los yamanis de Damasco, Yusuf al-Fihri lo llamó contra Abd al-Rahman al-Dakhil, contando con la antigua venganza de sangre por la muerte de Ammar en Siffin {cite:nafh-tib-maqqari p. 332}."
  ur: "عمار ب کا پہلا۔ یاسر کا اندلس میں داخل ہونے کا سلسلہ؛ دمشقی یمنیوں کے امیر کی حیثیت سے، یوسف الفہری نے عبدالرحمن الدخیل کے خلاف اس سے ملاقات کی، جو عمار کی موت سے لے کر صفین میں پرانے خونی جھگڑے کو شمار کرتے تھے۔ 332}۔"
