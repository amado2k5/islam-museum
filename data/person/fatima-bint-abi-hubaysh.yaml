summary:
  ar: "فاطمة بنت أبي حبيش، صحابية استُحيضت فسألت النبي عن الدم فقال لها: «إنما ذلك عرق وليس بالحيضة، فإذا أقبلت الحيضة فدعي الصلاة»، فصار حديثها عند أبي داود أصلاً في باب الاستحاضة، ويجعله الخطابي حكم المرأة التي تميز دمها؛ وسمّاها حماد بن زيد عن أيوب في حديث أم سلمة {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}."
  en: "Fatima bint Abi Hubaysh, a Companion who had istihada and asked the Prophet about the bleeding; he told her, 'That is a vein, not menstruation; when menstruation comes, leave the prayer.' Her report became a foundation of Abu Dawud's chapters on istihada, and al-Khattabi takes it as the ruling for the woman who can distinguish her blood; Hammad ibn Zayd named her, from Ayyub, as the woman in Umm Salama's report {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}."
  ur: "فاطمہ بنت ابی حبیش، صحابیہ جنہیں استحاضہ تھا، انہوں نے نبی سے خون کے بارے میں پوچھا تو آپ نے فرمایا: «یہ رگ ہے، حیض نہیں؛ جب حیض آئے تو نماز چھوڑ دو»؛ ان کی حدیث ابو داؤد کے ہاں استحاضہ کے باب کی بنیاد بنی، اور خطابی اسے اس عورت کا حکم قرار دیتے ہیں جو اپنے خون میں تمیز کر سکے؛ حماد بن زید نے ایوب سے ام سلمہ کی حدیث میں انہی کا نام لیا {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}۔"
