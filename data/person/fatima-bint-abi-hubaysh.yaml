summary:
  ar: "فاطمة بنت أبي حبيش، صحابية استُحيضت فسألت النبي عن الدم فقال لها: «إنما ذلك عرق وليس بالحيضة، فإذا أقبلت الحيضة فدعي الصلاة»، فصار حديثها عند أبي داود أصلاً في باب الاستحاضة، ويجعله الخطابي حكم المرأة التي تميز دمها؛ وسمّاها حماد بن زيد عن أيوب في حديث أم سلمة {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}."
  en: "Fatima bint Abi Hubaysh, a Companion who had istihada and asked the Prophet about the bleeding; he told her, 'That is a vein, not menstruation; when menstruation comes, leave the prayer.' Her report became a foundation of Abu Dawud's chapters on istihada, and al-Khattabi takes it as the ruling for the woman who can distinguish her blood; Hammad ibn Zayd named her, from Ayyub, as the woman in Umm Salama's report {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}."
  ur: "فاطمہ بنت ابی حبیش، صحابیہ جنہیں استحاضہ تھا، انہوں نے نبی سے خون کے بارے میں پوچھا تو آپ نے فرمایا: «یہ رگ ہے، حیض نہیں؛ جب حیض آئے تو نماز چھوڑ دو»؛ ان کی حدیث ابو داؤد کے ہاں استحاضہ کے باب کی بنیاد بنی، اور خطابی اسے اس عورت کا حکم قرار دیتے ہیں جو اپنے خون میں تمیز کر سکے؛ حماد بن زید نے ایوب سے ام سلمہ کی حدیث میں انہی کا نام لیا {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}۔"
  es: "Fatima bint Abi Hubaysh, una Compañera que tuvo istihada y preguntó al Profeta sobre el sangrado; él le dijo: 'Eso es una vena, no menstruación; cuando venga la menstruación, deja la oración'. Su relato se convirtió en la base de los capítulos de Abu Dawud sobre istihada, y al-Khattabi lo toma como la norma para la mujer que puede distinguir su sangre; Hammad ibn Zayd la nombró, de Ayyub, como la mujer en el relato de Umm Salama {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 141-143}."
  fr: "Fatima bint Abi Hubaysh, une Compagne qui avait des saignements vaginaux (istihada), interrogea le Prophète à ce sujet. Il lui répondit: « Il s'agit d'une veine, et non de menstruations. Lorsque tes menstruations arriveront, interromps la prière. » Son récit devint un fondement des chapitres d'Abu Dawud sur l'istihada, et al-Khattabi le considère comme la règle pour la femme capable de discerner son sang. Hammad ibn Zayd la mentionne, d'après Ayyub, comme étant la femme rapportée par Umm Salama (Sunan Abi Dawud, 1997, vol. 1, p. 139; Sunan Abi Dawud, 1997, vol. 1, p. 141-143)."
  tr: "Regl olan bir sahabe olan Fatimah bint Abi Hubaysh, Peygamber'e kan hakkında soru sordu ve o da şöyle yanıt verdi: \"O sadece damardır, adet değil. Adet geldiğinde namaz çağrılır.\" Böylece, Ebu Davud ile hadisi başlangıçta istihada bölümüne girer ve El-Hattabi bunu kanı farklı olan bir kadının hükmü olarak kabul eder; Hammad ibn Zayd, bunu Um Selama'nın hadislerinde Ayyub'dan adlandırmıştır {atıf:sunan-abi-davud-ibn-hazm-1997-v1, s. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1, s. 141-143}."
  id: "Fatimah bint Abi Hubaysh, seorang sahabat yang menstruasi, bertanya kepada Nabi tentang darah, dan ia menjawab: \"Itu hanya pembuluh darah, bukan menstruasi. Ketika menstruasi datang, maka doa dipanggil.\" Dengan demikian, hadits beliau bersama Abu Dawood awalnya termasuk dalam pasal istihadah, dan Al-Khattabi menganggapnya sebagai keputusan seorang wanita yang darahnya berbeda; Hammad ibn Zayd menamainya dari Ayyub dalam hadis um Salama {cite:sunan-abi-dawud-ibn-hazm-1997-v1, hlm. 139} {cite:sunan-abi-dawud-ibn-hazm-1997-v1, hlm. 141-143}."
