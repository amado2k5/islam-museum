summary:
  ar: "رجل دولة بنغالي (1873–1962) لُقّب «شير بنگال»، أول رئيس وزراء للبنغال (1937–1943) ومقدّم قرار لاهور سنة 1940. ترأس رابطة مسلمي عموم الهند وكان أميناً عاماً للمؤتمر الوطني الهندي في آن واحد، وبعد التقسيم صار رئيس وزراء باكستان الشرقية ثم وزير داخلية باكستان ثم حاكم باكستان الشرقية، ودُفن في ضريح القادة الثلاثة في دكا."
  en: "Bengali statesman (1873–1962) known as Sher-e-Bangla, the first prime minister of Bengal (1937–1943) and the mover of the Lahore Resolution in 1940. He was simultaneously president of the All India Muslim League and general secretary of the Indian National Congress; after partition he served as chief minister of East Bengal, home minister of Pakistan and governor of East Pakistan, and was buried in the Mausoleum of Three Leaders at Dhaka."
  ur: "بنگالی مدبر (1873ء–1962ء) جو «شیر بنگال» کے لقب سے مشہور ہوئے، بنگال کے پہلے وزیر اعظم (1937ء–1943ء) اور 1940ء میں قراردادِ لاہور کے محرک۔ بیک وقت آل انڈیا مسلم لیگ کے صدر اور انڈین نیشنل کانگریس کے جنرل سیکریٹری رہے؛ تقسیم کے بعد مشرقی بنگال کے وزیر اعلیٰ، پاکستان کے وزیر داخلہ اور مشرقی پاکستان کے گورنر رہے، اور ڈھاکہ میں تین قائدین کے مزار میں دفن ہوئے۔"
