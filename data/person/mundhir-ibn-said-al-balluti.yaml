summary:
  ar: "منذر بن سعيد البلوطي، قاضي قرطبة وخطيبها في عهد الناصر؛ عند المقري لما احتفل الناصر لقدوم رسل صاحب قسطنطينية سنة ست وثلاثين وثلاثمائة وأمر الأعلام أن يخطبوا فوجموا وأرتج عليهم قام منذر بن سعيد من غير استعداد ولا روية فخطب واستحضر وجلى في ذلك القصد وأنشد شعراً طويلاً ارتجله ففاز بفخر ذلك المجلس وعجب الناس من شأنه أكثر من كل ما وقع فيه، وأعجب به الناصر فولاه القضاء بعدها وأصبح من رجالات المعلم، وخطبه في ذلك اليوم منقولة في كتب ابن حيان وغيره {cite:nafh-tib-maqqari p. 401}."
  en: "Mundhir ibn Sa'id al-Balluti, Cordoba's qadi and khatib under al-Nasir: when the courtiers were told to address Constantine's envoys and froze, Mundhir rose unprepared, preached and improvised a long ode — winning the day and the judgeship {cite:nafh-tib-maqqari p. 401}."
