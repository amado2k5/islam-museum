id: person/mundhir-ibn-said-al-balluti
class: person
label: { ar: "منذر بن سعيد البلوطي" }
summary:
  ar: "منذر بن سعيد البلوطي، قاضي قرطبة وخطيبها في عهد الناصر؛ عند المقري لما احتفل الناصر لقدوم رسل صاحب قسطنطينية سنة ست وثلاثين وثلاثمائة وأمر الأعلام أن يخطبوا فوجموا وأرتج عليهم قام منذر بن سعيد من غير استعداد ولا روية فخطب واستحضر وجلى في ذلك القصد وأنشد شعراً طويلاً ارتجله ففاز بفخر ذلك المجلس وعجب الناس من شأنه أكثر من كل ما وقع فيه، وأعجب به الناصر فولاه القضاء بعدها وأصبح من رجالات المعلم، وخطبه في ذلك اليوم منقولة في كتب ابن حيان وغيره {cite:nafh-tib-maqqari p. 401}."
  en: "Mundhir ibn Sa'id al-Balluti, Cordoba's qadi and khatib under al-Nasir: when the courtiers were told to address Constantine's envoys and froze, Mundhir rose unprepared, preached and improvised a long ode — winning the day and the judgeship {cite:nafh-tib-maqqari p. 401}."
  es: "Mundhir ibn Sa'id al-Balluti, cadí y khatib de Córdoba bajo al-Nasir: cuando se les ordenó a los cortesanos que se dirigieran a los enviados de Constantino y se quedaron paralizados, Mundhir se levantó sin estar preparado, predicó e improvisó una larga oda, ganándose así el día y el cargo de juez {cite:nafh-tib-maqqari p. 401}."
  fr: "Mundhir ibn Sa'id al-Balluti, cadi et khatib de Cordoue sous al-Nasir: lorsque les courtisans furent chargés de s'adresser aux envoyés de Constantin et restèrent figés, Mundhir se leva sans préparation, prêcha et improvisa une longue ode, remportant ainsi la victoire et la charge de juge {cite:nafh-tib-maqqari p. 401}."
  ur: "منذر بن سعید البلوطی، قرطبہ کے قاضی اور النصیر کے تحت خطیب: جب درباریوں کو قسطنطنیہ کے ایلچیوں سے خطاب کرنے کے لیے کہا گیا اور وہ منجمد ہو گئے، منڈھیر بغیر تیاری کے اٹھ کھڑا ہوا، تبلیغ کی اور ایک لمبا کلام پیش کیا - دن اور جج کا عہدہ جیتا۔ 401}۔"
  tr: "Mundhir ibn Sa'id al-Baluti, el-Nasir'in saltanatı sırasında Kordoba hakimi ve vaizi; el-Maqri'ye göre, el-Nasir 336 Hicri yılında Konstantinopolis hükümdarının elçilerinin gelişini kutladığında ve liderlere vaaz vermelerini emrettiğinde, şaşırdılar ve o rahatsız oldu. Mundhir ibn Sa'id hazırlıksız ve beklenti olmadan ayağa kalktı, bu yüzden uzun bir şiiri hatırlayıp ifade ederek bir vaaz verdi; bu şiiri kendi doğaçlama olarak anlattı ve o toplantının gururunu kazandı. İnsanlar onun statüsünü katıldığı her şeyden daha çok takdir etti. Al-Nasir ona hayran kaldı ve sonrasında onu yargıç olarak atadı, böylece önde gelen alimlerden biri oldu. O günkü vaazları İbn Hayyan ve diğerlerinin kitaplarında aktarılmıştır {atıf:nafh-tib-maqqari, s. 401}."
  id: "Mundhir ibn Sa'id al-Baluti, hakim Cordoba dan pengkhotbahnya pada masa pemerintahan al-Nasir; menurut al-Maqri, ketika al-Nasir merayakan kedatangan utusan penguasa Konstantinopel pada tahun 336 H dan memerintahkan para pemimpin untuk menyampaikan khotbah, mereka terkejut dan ia pun terganggu. Mundhir ibn Sa'id berdiri tanpa persiapan atau harapan, sehingga ia menyampaikan khotbah, mengenang dan mengungkapkan puisi panjang yang ia improvisasi dan memenangkan kebanggaan pertemuan itu. Orang-orang mengagumi statusnya lebih dari apa pun yang pernah ia hadiri. Al-Nasir mengaguminya dan kemudian mengangkatnya sebagai hakim, dan ia menjadi salah satu ulama terkemuka. Khotbahnya hari itu diterbitkan dalam buku-buku Ibn Hayyan dan lainnya {cite:nafh-tib-maqqari, hlm. 401}."
