summary:
  ar: "أحمد، المعروف باسمه القلمي نشاطي (وُلد نحو 1600 – توفي 1674)، شاعر ديوان عثماني من أدرنة وشيخ مولوي. كان مريدًا للشيخ آغا زاده محمد دده في غاليبولي، وخدم عند ضريح جلال الدين الرومي في قونية، ثم تولّى منذ 1670 مشيخة خانقاه المولوية المرادية في أدرنة حتى وفاته. وهو من أئمة الغزل ومن روّاد أسلوب «سبك هندي» في التركية، وله «شرح مشكلات عرفي» في شعر أستاذه الفارسي عرفي الشيرازي."
  en: "Ahmed, known by his pen name Neşâtî (born c. 1600 – died 1674), was an Ottoman divan poet of Edirne and a Mevlevi shaykh. A disciple of Ağazâde Mehmed Dede at Gelibolu, he served at the tomb of Jalal al-Din Rumi in Konya and from 1670 held the shaykhdom of the Muradiyye Mevlevihane in Edirne until his death. A master of the gazel and a pioneer of the Sebk-i Hindî style in Turkish, he wrote the Şerh-i Müşkilât-ı Urfî on his Persian master Urfî of Shiraz."
  ur: "احمد، اپنے قلمی نام نشاطی سے مشہور (پیدائش تقریباً 1600ء – وفات 1674ء)، ادرنہ کے عثمانی دیوان شاعر اور مولوی شیخ تھے۔ غالیبولی میں آغا زادہ محمد ددے کے مرید ہوئے، قونیہ میں جلال الدین رومی کے مزار پر خدمت کی، اور 1670ء سے وفات تک ادرنہ کی مرادیہ مولوی خانقاہ کے شیخ رہے۔ غزل کے استاد اور ترکی میں «سبکِ ہندی» کے بانیوں میں سے تھے؛ اپنے فارسی استاد عرفی شیرازی پر «شرح مشکلاتِ عرفی» لکھی۔"

