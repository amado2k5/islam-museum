faith:
  - value: sufi
    basis: documented
    note: >-
      Order membership and completed discipleship attested for the
      man himself in three independent texts. The English article
      states that he was a Sufi of the Mevlevi Order, first became
      affiliated with the order as a disciple of the shaykh
      Ağazâde Mehmed Dede at Gelibolu and then at Beşiktaş,
      served for a time at the tomb of Jalal al-Din Rumi in Konya,
      and returned about 1670 to Edirne as shaykh of the
      Murâdiyye Mevlevîhâne, dying in that post. The Turkish
      article states that he became a dervish of Ağazâde Mehmed
      Efendi at the Gelibolu Mevlevihane and in 1670 was
      appointed to the Edirne Mevlevihane shaykhdom vacated by
      Osman Dede. The TDV entry states that he profited greatly
      from his shaykh Ağazâde Mehmed Dede, postnişin of the
      Gelibolu Mevlevîhâne, was appointed shaykh of the Edirne
      Mevlevihane in 1081/1670, served four years and died in
      office. Under the founder's rule, attested order membership
      and personal mastership settle sufi at basis documented.
      Wikidata's religion statement files Islam generically and
      is not relied on.
    sources: [source/wikipedia-nesati-en, source/wikipedia-nesati-tr, source/dia-nesati]

