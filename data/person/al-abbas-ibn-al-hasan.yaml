id: person/al-abbas-ibn-al-hasan
class: person
label: { ar: "العباس بن الحسن" }
summary:
  ar: "وزير المقتدر، استصغاه لما ولي الخلافة وله ثلاث عشرة سنة فعمل على خلعه ووافقه جماعة على أن يولوا عبد الله بن المعتز فبلغ المقتدر ذلك فأصلح حاله ودفع إليه أموالاً أرضته، ثم قتل في وقعة الخلع سنة ست {cite:tarikh-khulafa-minhaj-1434 p. 585}.، وعند المسعودي كان على وزارة المقتدر لما بويع فوثب عليه الحسين بن حمدان ووصيف بن سوارتكين وغيرهما من الأولياء فقتلوه وفاتكا معه يوم السبت لإحدى عشرة ليلة بقيت من ربيع الأول سنة ست وتسعين ومائتين {cite:muruj-al-dhahab p. 649}"
  en: "Al-Muqtadir's vizier; deeming the thirteen-year-old caliph a mere boy he worked to depose him for Ibn al-Mu'tazz, was bought off with money, then killed in the deposition of 296 {cite:tarikh-khulafa-minhaj-1434 p. 585}."
