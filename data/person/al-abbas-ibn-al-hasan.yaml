class: person
label: { ar: "العباس بن الحسن", en: "al-Abbas ibn al-Hasan", fr: "Al-Abbas ibn al-Hasan", es: "al-Abbas ibn al-Hasan", ur: "العباس بن الحسن" }
summary:
  ar: "وزير المقتدر، استصغاه لما ولي الخلافة وله ثلاث عشرة سنة فعمل على خلعه ووافقه جماعة على أن يولوا عبد الله بن المعتز فبلغ المقتدر ذلك فأصلح حاله ودفع إليه أموالاً أرضته، ثم قتل في وقعة الخلع سنة ست {cite:tarikh-khulafa-minhaj-1434 p. 585}. وعند المسعودي كان على وزارة المقتدر لما بويع فوثب عليه الحسين بن حمدان ووصيف بن سوارتكين وغيرهما من الأولياء فقتلوه وفاتكا معه يوم السبت لإحدى عشرة ليلة بقيت من ربيع الأول سنة ست وتسعين ومائتين {cite:muruj-al-dhahab p. 649}، وعند ابن الأثير تولى قتله في فتنة خلع المقتدر سنة 296هـ الحسين بن حمدان وبدر المعتضدي ووصيف ولحقوه وهو سائر إلى بستان له فقتلوه في طريقه وقتلوا معه فاتكاً بالحلى {cite:kamil-ibn-al-athir p. 11} وعند ابن الجوزي استوزره المقتدر أولًا فبقي في وزارته أربعة أشهر وسبعة أيام وقُتل {cite:muntazam-ibn-al-jawzi p. 360-361}."
  en: "Al-Muqtadir's vizier; deeming the thirteen-year-old caliph a mere boy he worked to depose him for Ibn al-Mu'tazz, was bought off with money, then killed in the deposition of 296 {cite:tarikh-khulafa-minhaj-1434 p. 585}."
  fr: "Vizir d’al-Muqtadir ; jugeant le calife de treize ans encore enfant, il œuvra à sa déposition au profit d’Ibn al-Mu’tazz, fut gagné par de l’argent, puis tué lors de la déposition de 296 H {cite:tarikh-khulafa-minhaj-1434 p. 585}."
  es: "El visir de Al-Muqtadir, considerando al califa de trece años un simple muchacho, trabajó para deponerlo en nombre de Ibn al-Mu'tazz, fue sobornado con dinero y luego asesinado en la deposición del año 296 {cite:tarikh-khulafa-minhaj-1434 p. 585}."
  ur: "المقتدیر کا وزیر؛ تیرہ سالہ خلیفہ کو محض لڑکا سمجھ کر اس نے ابن المعتز کے لیے اسے معزول کرنے کا کام کیا، پیسے دے کر خرید لیا گیا، پھر 296 کی معزولی میں قتل کر دیا گیا۔ 585}۔"
  tr: "Muktadir'in veziri, on üç yaşında halifeliği devraldığında onu dinlemişti ve onu tahttan indirmek için çalıştı. Bir grup, Abdullah ibn el-Mu'tazz'ı vezir olarak atamaya karar verdi. Muktadir bunu öğrenince, durumunu iyileştirdi ve onu memnun etmek için para verdi. Daha sonra, Hicri 296 yılında, tahttan indirme olaylarında öldürüldü. {kaynak:tarikh-khulafa-minhaj-1434 s. 585}. Mes'udi'ye göre, biat yemini ettiği sırada Muktadir'in veziriydi. Hüseyin ibn Hamdan, Vasif ibn Suwartakin ve diğer sadıklar ona saldırdılar ve onu ve Fatik'i, Hicri 296 yılında, Rebiü'l-Evvel ayının on birinci gecesi olan Cumartesi günü öldürdüler. {kaynak:muruj-al-dhahab s. 649}. İbn el-Athir'e göre, 296 Hicri yılında Muktadir'in tahttan indirilmesi fitnesinde onun öldürülmesinden Hüseyin ibn Hamdan, Bedir el-Mu'tedidi ve Vasif sorumluydu. Bahçesine giderken ona yetişip yolda öldürdüler ve Hali'de onunla birlikte Fatik'i de öldürdüler. {Kaynak: Kamil ibn el-Athir s. 11} İbn el-Cevzi'ye göre, Muktadir onu önce veziri olarak atadı ve o dört ay yedi gün vezir olarak görev yaptıktan sonra öldürüldü. {Kaynak: Muntazam ibn el-Cevzi s. 360-361}"
  id: "Wazir al-Muqtadir, yang telah mendengarkannya ketika ia naik tahta pada usia tiga belas tahun, berupaya untuk menggulingkannya. Sekelompok orang sepakat untuk mengangkat Abdullah ibn al-Mu'tazz. Ketika al-Muqtadir mengetahui hal ini, ia memperbaiki keadaan Abdullah dan memberinya uang untuk memuaskannya. Kemudian ia terbunuh dalam peristiwa penggulingan tersebut pada tahun 296 H. {cite:tarikh-khulafa-minhaj-1434 p. 585}. Menurut al-Mas'udi, ia berada di wilayah kekuasaan wazir al-Muqtadir ketika ia mengucapkan sumpah setia. Al-Husayn ibn Hamdan, Wasif ibn Suwartakin, dan loyalis lainnya menyerangnya dan membunuhnya bersama Fatik pada hari Sabtu, malam kesebelas bulan Rabi' al-Awwal tahun 296 H. {cite:muruj-al-dhahab p. 649}. Menurut Ibn al-Athir, al-Husayn ibn Hamdan, Badr al-Mu'tadidi, dan Wasif bertanggung jawab atas pembunuhannya dalam fitnah penggulingan al-Muqtadir pada tahun 296 H. Mereka mencegatnya ketika ia sedang menuju kebunnya dan membunuhnya di tengah jalan, dan mereka membunuh Fatik bersamanya di al-Hali. {kutip:kamil-ibn-al-athir hlm. 11} Menurut Ibn al-Jawzi, al-Muqtadir pertama kali mengangkatnya sebagai menterinya, dan ia tetap berada di kementeriannya selama empat bulan tujuh hari, dan kemudian dibunuh {kutip:muntazam-ibn-al-jawzi hlm. 360-361}."
