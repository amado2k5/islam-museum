summary:
  ar: "محمد بيلو (1781–1837)، ثاني خلفاء صوكوتو (1817–1837) ونجل مؤسسها عثمان بن فودي وكاتبه الأول. أسّس مدينة صوكوتو سنة 1809، وثبّت إدارة الخلافة وقضاءها وتعليمها، وألّف مئات النصوص في التاريخ والشريعة والشعر، منها «إنفاق الميسور» التاريخَ المرجع لحروب الفولاني، وتوفي في وورنو سنة 1837."
  en: "Muhammad Bello (1781–1837), second caliph of Sokoto (1817–1837), son of its founder Usman dan Fodio and his father's chief aide. He founded the city of Sokoto in 1809, consolidated the caliphate's administration, courts and schooling, and wrote hundreds of texts on history, Islamic law and poetry, among them the Infaq al-Maysur, the standard history of the Fulani wars; he died at Wurno in 1837."
  ur: "محمد بیلو (1781–1837)، سوکوتو کے دوسرے خلیفہ (1817–1837)، اس کے بانی عثمان دان فودیو کے بیٹے اور ان کے اولین معاون۔ انھوں نے 1809 میں سوکوتو شہر کی بنیاد رکھی، خلافت کی انتظامیہ، عدالتیں اور تعلیم مضبوط کیں، اور تاریخ، شریعت اور شاعری پر سیکڑوں تصانیف لکھیں جن میں فولانی جنگوں کی مستند تاریخ «انفاق المیسور» شامل ہے؛ 1837 میں ورنو میں ان کا انتقال ہوا۔"

