summary:
  ar: "أسماء بنت شهاب الصليحية، زوجة علي بن محمد الصليحي ملك اليمن ووالدة ابنه أحمد المكرم، كان يُخطب لها مع زوجها على منابر اليمن؛ أُسرت بعد قتل زوجها في حجته سنة 459هـ أو 458هـ وأقامت في الأسر بزبيد إلى أن أنقذها ابنها، وفي حجرها نشأت أروى بنت أحمد الصليحية."
  en: "Asma' bint Shihab al-Sulayhiyya, wife of Ali ibn Muhammad al-Sulayhi, king of Yemen, and mother of his son Ahmad al-Mukarram; the Friday sermon in Yemen named her with her husband. Captured when he was killed on pilgrimage in 459 or 458 AH, she was held in Zabid until her son freed her; Arwa bint Ahmad al-Sulayhiyya grew up in her care."
