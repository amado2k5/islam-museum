id: person/ibrahim-ibn-sinan
class: person
label:
  en: Ibrahim ibn Sinan
  ar: إبراهيم بن سنان بن ثابت
  es: "Ibrahim ibn Sinan"
  fr: "Ibrahim ibn Sinan"
  ur: "ابراہیم بن سنان"
roles: [mathematician, astronomer, physician]
summary:
  ar: "إبراهيم بن سنان بن ثابت بن قرة، أبو إسحاق الحراني ثم البغدادي، مهندس طبيب من الصابئة، ولد وتوفي ببغداد، 296 إلى 335 هـ الموافقة 908 إلى 946 م، وله «رسالة في الأسطرلاب»."
  en: "Ibrahim ibn Sinan ibn Thabit ibn Qurra, Abu Ishaq al-Harrani then al-Baghdadi, an engineer-geometer and physician of the Sabians, born and died in Baghdad, 296 to 335 AH (908 to 946 CE); author of a treatise on the astrolabe."
  es: "Ibrahim ibn Sinan ibn Thabit ibn Qurra, Abu Ishaq al-Harrani, entonces al-Baghdadi, ingeniero geómetra y médico de los sabeos, nació y murió en Bagdad, entre el 296 y el 335 de la Hégira (908 a 946 d. C.); autor de un tratado sobre el astrolabio."
  fr: "Ibrahim ibn Sinan ibn Thabit ibn Qurra, Abu Ishaq al-Harrani puis al-Baghdadi, ingénieur-géomètre et médecin des Sabéens, né et mort à Bagdad, 296 à 335 AH (908 à 946 CE); auteur d'un traité sur l'astrolabe."
  ur: "ابراہیم بن سنان بن ثابت ابن قرہ، ابو اسحاق الحرانی پھر البغدادی، ایک انجینئر-جیومیٹر اور صابیوں کے طبیب، بغداد میں پیدا ہوئے اور فوت ہوئے، 296 تا 335 ہجری ⁦(908 تا 946 عیسوی)⁩؛ Astrolabe پر ایک مقالے کے مصنف۔"
  tr: "İbrahim bin Sinan ibn Tebit ibn Kurra, Ebu İshaq el-Harrani o zaman el-Bağdadi, Sabialılardan mühendis ve hekimdi; 296 ile 335 H. yılları arasında, 908 ile 946 yılları arasında Bağdat'ta doğup öldü. Astrolab üzerine bir risale yazdı."
  id: "Ibrahim ibn Sinan ibn Thabit ibn Qurra, Abu Ishaq al-Harrani saat itu al-Baghdadi, adalah seorang insinyur dan dokter dari Sabian, lahir dan meninggal di Baghdad, antara tahun 296 dan 335 H, yang bertepatan dengan tahun 908 hingga 946 M. Ia menulis sebuah risalah tentang astrolab."
