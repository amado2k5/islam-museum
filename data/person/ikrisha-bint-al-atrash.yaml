roles: [poet]
summary:
  ar: "خطيبة من ربات الفصاحة وقوة الحجة، وقفت يوم صفين بين الصفين متقلدة السيف تخطب في جيش علي، ثم دخلت على معاوية تطالب برد صدقات قومها إليهم، فأمر لها برد صدقتها؛ يروي خبرها كحالة عن بلاغات النساء وغيره."
  en: "An orator of eloquence and forceful argument who stood between the lines at Siffin with a sword slung on her, addressing Ali's army; later she went to Mu'awiya to demand that her people's alms be returned to them, and he ordered her alms restored. Kahhala tells her story from Balaghat al-Nisa' and other works."
  ur: "فصاحت اور مضبوط دلیل والی ایک خطیبہ جو صفین میں تلوار حمائل کیے صفوں کے بیچ کھڑی ہو کر علی کے لشکر سے خطاب کرتی رہیں؛ بعد میں معاویہ کے پاس اپنی قوم کی زکوٰۃ انہی میں لوٹانے کا مطالبہ لے کر گئیں، اور انہوں نے ان کی زکوٰۃ واپس کرنے کا حکم دیا۔ کحالہ بلاغات النساء وغیرہ سے نقل کرتے ہیں۔"
