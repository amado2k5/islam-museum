summary:
  ar: "إحسان عباس ⁦(1920–2003)⁩ مؤرخ أدبي وناقد ومحقق فلسطيني، أستاذ الأدب العربي بالجامعة الأمريكية ببيروت عقوداً. حقق مصادر كبرى ك«وفيات الأعيان» وترجم «موبي ديك»، وله «تاريخ النقد الأدبي عند العرب» و«ملامح يونانية في الأدب العربي»."
  en: "Ihsan Abbas (1920–2003) was a Palestinian literary historian, critic and editor, professor of Arabic literature at the American University of Beirut for decades. He edited major classical sources such as Ibn Khallikan's Wafayat al-A'yan, translated Moby-Dick, and wrote A History of Literary Criticism Among the Arabs and Greek Traces in Arabic Literature."
  ur: "احسان عباس ⁦(1920–2003)⁩ فلسطینی ادبی مؤرخ، ناقد اور محقق تھے، بیروت کی امریکن یونیورسٹی میں عربی ادب کے دہائیوں تک پروفیسر۔ انہوں نے ابن خلکان کی «وفيات الأعيان» جیسی کلاسیکی کتابوں کی تحقیق کی، Moby-Dick کا ترجمہ کیا اور عربوں میں ادبی تنقید کی تاریخ لکھی۔"
