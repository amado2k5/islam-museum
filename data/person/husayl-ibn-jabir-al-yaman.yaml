summary:
  ar: "حسيل ⁦(ويقال حِسْل)⁩ بن جابر العبسي، المعروف باليمان، والد حذيفة بن اليمان، حليف بني عبد الأشهل؛ شهد أحداً مع ابنيه حذيفة وصفوان، فقتله المسلمون في المعركة خطأً يظنونه من المشركين وحذيفة يصيح: أبي أبي، فتصدّق حذيفة بديته على المسلمين {cite:istiab-alam-2002 p. 178} {cite:rawd-unuf-wakil-v6 p. 10-11}."
  en: "Husayl (or Hisl) ibn Jabir al-'Absi, known as al-Yaman, father of Hudhayfa ibn al-Yaman and an ally of Banu 'Abd al-Ashhal; he fought at Uhud with his sons Hudhayfa and Safwan, and was killed there in error by Muslims who took him for one of the enemy while Hudhayfa cried 'My father, my father!'; Hudhayfa gave the blood-money as alms to the Muslims {cite:istiab-alam-2002 p. 178} {cite:rawd-unuf-wakil-v6 p. 10-11}."
  ur: "حسیل ⁦(یا حِسل)⁩ بن جابر عبسی، جو الیمان کے نام سے معروف ہیں، حذیفہ بن الیمان کے والد اور بنو عبد الاشہل کے حلیف؛ وہ اپنے بیٹوں حذیفہ اور صفوان کے ساتھ احد میں شریک ہوئے، اور وہاں مسلمانوں نے انہیں دشمن سمجھ کر غلطی سے قتل کر دیا جبکہ حذیفہ پکار رہے تھے: «میرے والد، میرے والد!»؛ حذیفہ نے دیت مسلمانوں پر صدقہ کر دی {cite:istiab-alam-2002 p. 178} {cite:rawd-unuf-wakil-v6 p. 10-11}۔"
