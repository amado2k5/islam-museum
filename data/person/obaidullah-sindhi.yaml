summary:
  ar: "عالم وناشط سياسي هندي (1872–1944). وُلد في أسرة سيخية في سيالكوت باسم بوتا سينغ أوبال، واعتنق الإسلام في الخامسة عشرة، ودرس في دار العلوم ديوبند، وصار من قادة حركة رسائل الحرير ووزير الداخلية في حكومة الهند المؤقتة في كابل (1915)، وأمضى سنوات في روسيا وتركيا والحجاز قبل عودته إلى الهند."
  en: "Indian scholar and political activist (1872–1944). Born at Sialkot in a Sikh family as Buta Singh Uppal, he converted to Islam at fifteen, studied at Darul Uloom Deoband, became a leader of the Silk Letter movement and home minister of the Provisional Government of India at Kabul (1915), and spent years in Russia, Turkey and the Hijaz before returning to India."
  ur: "ہندوستانی عالم اور سیاسی کارکن (1872ء–1944ء)۔ سیالکوٹ کے ایک سکھ گھرانے میں بوٹا سنگھ اپل کے نام سے پیدا ہوئے، پندرہ برس کی عمر میں اسلام قبول کیا، دار العلوم دیوبند میں تعلیم پائی، تحریک ریشمی رومال کے رہنما اور کابل کی عبوری حکومت ہند (1915ء) کے وزیر داخلہ بنے، اور روس، ترکی اور حجاز میں برسوں گزار کر ہندوستان لوٹے۔"
