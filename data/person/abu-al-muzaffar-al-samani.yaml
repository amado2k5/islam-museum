label: { ar: "أبو المظفر السمعاني منصور بن محمد التميمي", en: "Abu al-Muzaffar al-Sam'ani Mansur ibn Muhammad al-Tamimi", fr: "Abu al-Muzaffar al-Sam'ani Mansur ibn Muhammad al-Tamimi", es: "Abu al-Muzaffar al-Sam'ani Mansur ibn Muhammad al-Tamimi", ur: "ابو المظفر السمانی منصور بن محمد التمیمی۔" }
summary:
  ar: "الإمام العلامة أبو المظفر السمعاني منصور بن محمد التميمي المروزي — الحنفي ثم الشافعي؛ تفقه على موالده وكان إمام وقته في مذهب أبي حنيفة فلما حج ظهر له بالحجاز ما اقتضى انتقاله إلى مذهب الشافعي ولقي أذى عظيماً بسبب انتقاله لما عاد إلى مرو؛ صنف في مذهب الشافعي كتباً كثيرة وفي الرد على المخالفين، وله الطبقات أجاد فيها وأحسن، وله تفسير جيد حسن، وجمع في الحديث ألف جزء عن مائة شيخ؛ توفي سنة تسع وثمانين وأربعمائة {cite:shadharat-dhahab p. 393-394}."
  en: "Imam Abu al-Muzaffar al-Sam'ani Mansur b. Muhammad al-Tamimi al-Marwazi — the Hanafi turned Shafi'i; imam of his age in Abu Hanifa's madhhab until something on hajj moved him to al-Shafi'i, for which he suffered greatly on returning to Marw; author of the Tabaqat, a fine tafsir, refutations, and a thousand-part hadith collection from a hundred shaykhs; died 489 {cite:shadharat-dhahab p. 393-394}."
  fr: "L'imam Abu al-Muzaffar al-Sam'ani Mansur b. Muhammad al-Tamimi al-Marwazi — le hanafite devenu shafi'ite ; imam de son temps dans l'école d'Abu Hanifa jusqu'à ce que quelque chose, lors du pèlerinage, le fasse passer à al-Shafi'i, ce qui lui valut de grandes souffrances à son retour à Marw ; auteur des Tabaqat, d'un bel exégèse, de réfutations, et d'un recueil de hadith en mille parties tiré de cent shaykhs ; mort en 489 {cite:shadharat-dhahab p. 393-394}."
  es: "Imam Abu al-Muzaffar al-Sam'ani Mansur b. Muhammad al-Tamimi al-Marwazi — el hanafí convertido al shafi'i; imán de su época en la escuela de pensamiento de Abu Hanifa hasta que algo durante el Hajj lo llevó al shafi'i, por lo que sufrió mucho al regresar a Marw; autor del Tabaqat, un excelente tafsir, refutaciones y una colección de hadices de mil partes de cien shaykhs; murió en 489 {cite:shadharat-dhahab p. 393-394}."
  ur: "امام ابو المظفر السمانی منصور۔ محمد التمیمی المروازی - حنفی شافعی ہوگئے؛ امام ابوحنیفہ کے مذھب میں اپنی عمر کے امام تھے یہاں تک کہ حج کی کسی چیز نے انہیں شافعی کی طرف لے جایا، جس کی وجہ سے انہیں مرو واپسی پر بہت تکلیف اٹھانی پڑی۔ طبقات کے مصنف، ایک عمدہ تفسیر، تردید، اور سو شیوخ سے ایک ہزار حصوں پر مشتمل احادیث کا مجموعہ؛ متوفی 489۔ 393-394}۔"
