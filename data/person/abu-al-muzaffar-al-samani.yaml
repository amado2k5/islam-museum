label: { ar: "أبو المظفر السمعاني منصور بن محمد التميمي" }
summary:
  ar: "الإمام العلامة أبو المظفر السمعاني منصور بن محمد التميمي المروزي — الحنفي ثم الشافعي؛ تفقه على موالده وكان إمام وقته في مذهب أبي حنيفة فلما حج ظهر له بالحجاز ما اقتضى انتقاله إلى مذهب الشافعي ولقي أذى عظيماً بسبب انتقاله لما عاد إلى مرو؛ صنف في مذهب الشافعي كتباً كثيرة وفي الرد على المخالفين، وله الطبقات أجاد فيها وأحسن، وله تفسير جيد حسن، وجمع في الحديث ألف جزء عن مائة شيخ؛ توفي سنة تسع وثمانين وأربعمائة {cite:shadharat-dhahab p. 393-394}."
  en: "Imam Abu al-Muzaffar al-Sam'ani Mansur b. Muhammad al-Tamimi al-Marwazi — the Hanafi turned Shafi'i; imam of his age in Abu Hanifa's madhhab until something on hajj moved him to al-Shafi'i, for which he suffered greatly on returning to Marw; author of the Tabaqat, a fine tafsir, refutations, and a thousand-part hadith collection from a hundred shaykhs; died 489 {cite:shadharat-dhahab p. 393-394}."
