summary:
  ar: متحدث تحفيزي ورائد أعمال قطري وُلد سنة 2002 مصابًا بمتلازمة الانحدار الذيلي. ظهر في حفل افتتاح مونديال 2022 أمام العالم، وسفير نوايا حسنة ومؤسِّس جمعيات داعمة لذوي الإعاقة.
  en: Qatari motivational speaker and entrepreneur, born 2002 with Caudal Regression Syndrome. He appeared at the 2022 World Cup opening ceremony before a global audience, is a goodwill ambassador and founder
    of initiatives supporting people with disabilities.
  ur: قطری حوصلہ افزا مقرر اور کاروباری، 2002 میں کوڈل ریگریشن سنڈروم کے ساتھ پیدا ہوئے۔ وہ 2022 ورلڈ کپ کی افتتاحی تقریب میں عالمی سامعین کے سامنے آئے، خیر سگالی سفیر اور معذور افراد کی مدد کی مہمات کے
    بانی ہیں۔
  es: "Orador motivacional y emprendedor catarí, nacido en 2002 con síndrome de regresión caudal. Participó en la ceremonia de inauguración de la Copa Mundial de la FIFA 2022 ante una audiencia global, es embajador de buena voluntad y fundador de iniciativas de apoyo a personas con discapacidad."
  fr: "Conférencier et entrepreneur qatari, né en 2002 et atteint du syndrome de régression caudale, il a participé à la cérémonie d'ouverture de la Coupe du monde 2022 devant un public international. Ambassadeur de bonne volonté, il est également le fondateur d'initiatives de soutien aux personnes handicapées."
  tr: "2002 yılında kaudal regresyon sendromu ile doğmuş bir motivasyon konuşmacısı ve Katarlı girişimci. 2022 Dünya Kupası'nın açılış töreninde dünya önünde iyi niyet elçisi ve engelli bireyleri destekleyen derneklerin kurucusu olarak yer aldı."
  id: "Seorang pembicara motivasi dan pengusaha Qatar yang lahir pada tahun 2002 dengan sindrom regresi kaudal. Ia tampil di upacara pembukaan Piala Dunia 2022 di hadapan dunia, sebagai duta niat baik, dan pendiri asosiasi yang mendukung penyandang disabilitas."
