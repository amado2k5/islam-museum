summary:
  ar: "خامس ملوك المملكة العربية السعودية (1982–2005) وأكبر «السديريين السبعة» أبناء الملك عبد العزيز من حصة بنت أحمد السديري؛ وزير المعارف (1953–1962) ثم وزير الداخلية (1962–1975) ثم ولي العهد (1975–1982)؛ اتخذ لقب «خادم الحرمين الشريفين» سنة 1986 وأصدر النظام الأساسي للحكم سنة 1992، وبعد إصابته بجلطة سنة 1995 صار ولي عهده عبد الله الحاكم الفعلي حتى وفاته في الرياض في 1 أغسطس 2005."
  en: "Fifth King of Saudi Arabia (r. 1982–2005) and the eldest of the Sudairi Seven, the sons of King Abdulaziz by Hassa bint Ahmed Al Sudairi. He was Minister of Education (1953–1962), Interior Minister (1962–1975) and Crown Prince (1975–1982); as king he adopted the title Custodian of the Two Holy Mosques in 1986 and introduced the Basic Law of Governance in 1992. After his stroke in 1995 Crown Prince Abdullah governed in practice until Fahd's death at Riyadh on 1 August 2005."
  ur: "سعودی عرب کے پانچویں بادشاہ (1982ء–2005ء) اور شاہ عبد العزیز اور حصہ بنت احمد السدیری کے بیٹوں «سدیری سبعہ» میں سب سے بڑے؛ وزیر تعلیم (1953ء–1962ء)، وزیر داخلہ (1962ء–1975ء) اور ولی عہد (1975ء–1982ء) رہے؛ 1986ء میں «خادم الحرمین الشریفین» کا لقب اختیار کیا اور 1992ء میں نظام اساسی برائے حکمرانی جاری کیا؛ 1995ء میں فالج کے بعد ولی عہد عبداللہ عملی حکمران بن گئے اور فہد 1 اگست 2005ء کو ریاض میں وفات پا گئے۔"
