  fr: "Ibn Aqil, grammarian"
  ur: "ابن عقیل، گرامر"
roles: [scholar]
gender: male
summary:
  ar: "عبد الله بن عبد الرحمن بن عبد الله بن محمد القرشي الهاشمي، بهاء الدين ابن عقيل، من أئمة النحاة، من نسل عقيل بن أبي طالب، مولده ووفاته في القاهرة، شارح ألفية ابن مالك، توفي سنة 769 هـ الموافقة 1367 م."
  en: "Abd Allah ibn Abd al-Rahman ibn Abd Allah ibn Muhammad al-Qurashi al-Hashimi, Baha' al-Din Ibn Aqil, a leading grammarian descended from Aqil ibn Abi Talib, born and died in Cairo, commentator of the Alfiyya of Ibn Malik; died 769 AH (1367)."
  es: "Abd Allah ibn Abd al-Rahman ibn Abd Allah ibn Muhammad al-Qurashi al-Hashimi, Baha' al-Din Ibn Aqil, un destacado gramático descendiente de Aqil ibn Abi Talib, nacido y muerto en El Cairo, comentarista de la Alfiyya de Ibn Malik; murió en 769 AH (1367)."
  fr: "Abd Allah ibn Abd al-Rahman ibn Abd Allah ibn Muhammad al-Qurashi al-Hashimi, Baha' al-Din Ibn Aqil, un grammairien de premier plan descendant d'Aqil ibn Abi Talib, né et mort au Caire, commentateur de l'Alfiyya d'Ibn Malik; mort en 769 AH (1367)."
  ur: "عبد اللہ بن عبد الرحمن بن عبد اللہ بن محمد القرشی الہاشمی، بہاء الدین ابن عقیل، عقیل ابن ابی طالب سے تعلق رکھنے والے ایک معروف گرامر دان، قاہرہ میں پیدا ہوئے اور وفات پا گئے، ابن مالک کی الفیہ کے مفسر ہیں۔ وفات 769ھ (1367)۔"
  tr: "Abdullah ibn Abd al-Rahman ibn Abdullah ibn Muhammed el-Kurashi el-Haşimi, Baha'eddin ibn Aqil, önde gelen dilbilgicilerinden biridir ve Aqil ibn Ebu Talib'in soyundan gelmektedir. Kahire'de doğmuş ve ölmüştür. İbn Malik'in Alfiyyah eserinin yorumcusuydu. 769 Hicri yılında, yani 1367 yılında ölmüştür."
  id: "Abdullah ibn Abd al-Rahman ibn Abdullah ibn Muhammad al-Qurashi al-Hashimi, Baha' al-Din ibn Aqil, salah satu ahli tata bahasa terkemuka, merupakan keturunan Aqil ibn Abi Talib. Ia lahir dan meninggal di Kairo. Ia adalah komentator Alfiyyah karya Ibn Malik. Ia meninggal pada tahun 769 H, yang bertepatan dengan tahun 1367 M."
