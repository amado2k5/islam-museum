summary:
  ar: "سورة بن الحر الحنظلي؛ قدمه سعيد بن عبد العزيز ثم ابنه إلى ما وراء النهر فنزل إشتيخن وقد صارت الترك إليها فحاربهم وهزمهم ومنع الناس من طلبهم حيناً ثم لقي الترك ثانية فهزموه وأكثروا القتل في أصحابه."
  en: "Sawra ibn al-Hurr al-Hanzali; Sa'id's spearhead beyond the river — retook Ishtikhan and routed the Turks, forbade pursuit, then was routed with heavy loss in the second round."
  es: "Sawra ibn al-Hurr al-Hanzali, la punta de lanza de Sa'id más allá del río, retomó Ishtikhan y derrotó a los turcos, prohibió la persecución, pero fue derrotado con grandes pérdidas en la segunda ronda."
  fr: "Sawra ibn al-Hurr al-Hanzali; le fer de lance de Sa'id au-delà du fleuve — a repris Ishtikhan et mis en déroute les Turcs, a interdit la poursuite, puis a été mis en déroute avec de lourdes pertes au deuxième round."
  ur: "سوارہ ابن الحر الحنظلی؛ سعید کا نیزہ دریا سے پرے - استیخان پر دوبارہ قبضہ کیا اور ترکوں کو شکست دی، تعاقب سے منع کیا، پھر دوسرے دور میں بھاری نقصان کے ساتھ شکست کھا گئی۔"
