summary:
  ar: "محمد بن قاسم، أبو عبد الله الأنصاري التلمساني ثم التونسي المغربي المالكي، يُعرف بابن الرصاع، والرصاع صنعة لأحد آبائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} أخذ عن أحمد وعمر القلشانيين، وابن عقاب، وآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} وتصدى للإمامة والخطابة والإفتاء وإقراء الفقه وأصول الدين والعربية وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} جمع شرحاً للأسماء النبوية، وشرحاً لكتاب في الصلاة، وشرحاً لحدود ابن عرفة، وصنّف كتاباً كبيراً في الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} والمصادر التي ينقل عنها الكتاب: الضوء اللامع، وشجرة النور الزكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} وفي رأس الترجمة تاريخ مقيّد بـ٨٩٤ هجرية مع رقم آخر لم يتضح في المسح، فيُذكر التاريخ مع هذا التحفظ."
  en: "Muhammad ibn Qasim, Abu Abd Allah al-Ansari al-Tilimsani then al-Tunisi al-Maghribi, a Maliki, known as Ibn al-Rassas, the surname being the trade of one of his forebears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He studied with the two Qal-shanis, Ahmad and Umar, with Ibn 'Uqab and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He took up the imamate, preaching, giving fatwas and teaching fiqh, the principles of religion, Arabic and other subjects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He compiled a commentary on the names of the Prophet, another on a book on prayer over the Prophet, a commentary on Ibn 'Arafa's definitions, and a large book on fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} The Mawsu'a cites al-Daw' al-lami' and Shajarat al-Nur al-Zakiyya for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} The heading gives 894 AH with a second figure the scan does not make clear, so the date is stated with that caution."
  es: "Muhammad ibn Qasim, Abu Abd Allah al-Ansari al-Tilimsani y luego al-Tunisi al-Maghribi, un malikí, conocido como Ibn al-Rassas, cuyo apellido era el oficio de uno de sus antepasados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} Estudió con los dos Qal-shanis, Ahmad y Umar, con Ibn 'Uqab y otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} Asumió el imamato, predicando, dando fatwas y enseñando fiqh, los principios de la religión, árabe y otras materias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} Compiló un comentario sobre los nombres del Profeta, otro sobre un libro sobre la oración por el Profeta, un comentario sobre las definiciones de Ibn 'Arafa y un libro extenso sobre fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} El Mawsu'a cita a al-Daw' al-lami' y Shajarat al-Nur al-Zakiyya para él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} El encabezado da 894 AH con una segunda cifra que el escaneo no aclara, por lo que la fecha se indica con esa precaución."
  fr: "Muhammad ibn Qasim, Abu Abd Allah al-Ansari al-Tilimsani puis al-Tunisi al-Maghribi, un Maliki, connu sous le nom d'Ibn al-Rassas, ce surnom étant celui d'un de ses ancêtres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} Il étudia auprès des deux Qal-shanis, Ahmad et Umar, ainsi qu'avec Ibn 'Uqab et d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} Il assuma l'imamat, prêchant, émettant des fatwas et enseignant le fiqh (jurisprudence islamique), les principes de la religion, l'arabe et d'autres matières. Il a compilé un commentaire sur les noms du Prophète, un autre sur un ouvrage consacré à la prière sur le Prophète, un commentaire sur les définitions d'Ibn 'Arafa et un important ouvrage de fiqh. Le Mawsu'a cite al-Daw' al-lami' et Shajarat al-Nur al-Zakiyya à son sujet. L'en-tête indique l'an 894 de l'Hégire, avec un second chiffre que le scan ne permet pas de distinguer clairement; la date est donc mentionnée avec prudence."
  ur: "محمد بن قاسم، ابو عبد اللہ الانصاری التلمسانی پھر التونسی المغربی، ایک مالکی، جسے ابن الراساس کے نام سے جانا جاتا ہے، کنیت ان کے آباؤ اجداد میں سے ایک کی تجارت تھی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17697} اس نے دو قل شانیوں، احمد اور عمر، ابن عقب اور دیگر کے ساتھ تعلیم حاصل کی۔ انہوں نے امامت، تبلیغ، فتویٰ دینے اور فقہ کی تعلیم، اصول دین، عربی اور دیگر مضامین کا بیڑہ اٹھایا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17697} اس نے نبی کے ناموں پر ایک تفسیر مرتب کی، دوسری کتاب دعا پر نبی پر، ابن عرفہ کی تعریف پر ایک تفسیر اور فقہ پر ایک بڑی کتاب۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17697} موصوف نے اس کے لیے الدعوۃ اللامی اور شجرۃ النور الزکیہ کا حوالہ دیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17697} سرخی 894ھ بتاتی ہے دوسرے نمبر کے ساتھ اسکین سے واضح نہیں ہوتا، لہٰذا احتیاط کے ساتھ تاریخ بیان کی گئی ہے۔"
  tr: "Muhammed bin Kasım, Ebu Abdullah el-Ensari el-Tlemsani ve ardından Tunus'un Mağribi Maliki, İbn el-Rasa' olarak bilinen ve el-Rasa', atalarından birinin zanaatıydı. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17697} Ahmed, Umar al-Qalshaniyy, İbn Uqab ve diğerlerinin yanında eğitim aldı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17697} İmamatlığı üstlendi, vaaz verdi, fetva verdi, fıkıh, dinin temelleri, Arapça ve diğerlerini öğretti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17697} Peygamberlik isimleri üzerine yorumlar, dua üzerine bir kitap, İbn Arafa'nın sınırları üzerine bir yorum ve fıkıh üzerine önemli bir kitap yazdı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17697} ve kitapta belirtilen kaynaklar: Al-Daw' Al-Shin ve The Pure Tree of Light. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17697} Çevirinin başında, 894 Hicri olarak kaydedilmiş bir tarih vardır ve ankette açıklanmayan başka bir sayı vardır, bu nedenle tarih bu çekinceyle belirtilmiştir."
  id: "Muhammad ibn Qasim, Abu Abdullah al-Ansari al-Tlemsani kemudian Maghribi Maliki Tunisia, yang dikenal sebagai Ibn al-Rasa', dan al-Rasa' adalah kerajinan dari salah satu leluhurnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17697} Ia belajar di bawah bimbingan Ahmad, Umar al-Qalshaniyy, Ibn 'Uqab, dan lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17697} Ia menjalankan imamat, berkhotbah, mengeluarkan fatwa, mengajarkan firisprudensi, dasar-dasar agama, bahasa Arab, dan lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17697} Ia menyusun komentar atas nama-nama Nabi, sebuah buku tentang doa, komentar tentang batas-batas Ibn Arafa, dan menulis sebuah buku besar tentang fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17697} dan sumber yang dikutip dalam buku ini adalah: Al-Daw' Al-Shin, dan The Pure Tree of Light. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17697} Di awal terjemahan, terdapat tanggal yang tercatat sebagai 894 AH dengan angka lain yang tidak dijelaskan dalam survei, sehingga tanggal tersebut disebutkan dengan catatan ini."
