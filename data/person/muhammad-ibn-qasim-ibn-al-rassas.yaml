summary:
  ar: "محمد بن قاسم، أبو عبد الله الأنصاري التلمساني ثم التونسي المغربي المالكي، يُعرف بابن الرصاع، والرصاع صنعة لأحد آبائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} أخذ عن أحمد وعمر القلشانيين، وابن عقاب، وآخرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} وتصدى للإمامة والخطابة والإفتاء وإقراء الفقه وأصول الدين والعربية وغيرها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} جمع شرحاً للأسماء النبوية، وشرحاً لكتاب في الصلاة، وشرحاً لحدود ابن عرفة، وصنّف كتاباً كبيراً في الفقه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} والمصادر التي ينقل عنها الكتاب: الضوء اللامع، وشجرة النور الزكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} وفي رأس الترجمة تاريخ مقيّد بـ٨٩٤ هجرية مع رقم آخر لم يتضح في المسح، فيُذكر التاريخ مع هذا التحفظ."
  en: "Muhammad ibn Qasim, Abu Abd Allah al-Ansari al-Tilimsani then al-Tunisi al-Maghribi, a Maliki, known as Ibn al-Rassas, the surname being the trade of one of his forebears. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He studied with the two Qal-shanis, Ahmad and Umar, with Ibn 'Uqab and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He took up the imamate, preaching, giving fatwas and teaching fiqh, the principles of religion, Arabic and other subjects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} He compiled a commentary on the names of the Prophet, another on a book on prayer over the Prophet, a commentary on Ibn 'Arafa's definitions, and a large book on fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} The Mawsu'a cites al-Daw' al-lami' and Shajarat al-Nur al-Zakiyya for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17697} The heading gives 894 AH with a second figure the scan does not make clear, so the date is stated with that caution."
