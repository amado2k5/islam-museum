label: { ar: "الأسود بن كلثوم العدوي عدي الرباب", en: "al-Aswad ibn Kulthum 'Adi al-Ribab'", fr: "Al-Aswad ibn Kulthum « Adi al-Ribab »", es: "al-Aswad ibn Kulthum 'Adi al-Ribab'", ur: "اسود بن کلثوم عدی الرباب" }
summary:
  ar: "الأسود بن كلثوم العدوي المعروف بعدي الرباب وكان ناسكاً؛ وجهه ابن عامر إلى بيهق فدخل بعض حيطان أهله من ثلمة فيه ودخلت معه طائفة من المسلمين فأخذ العدو عليهم تلك الثلمة فقاتل حتى قتل ومن معه وقام بأمر الناس أدهم بن كاثوم فظفر وفتح بيهق وكان الأسود يدعو ربه أن يحشره من بطون السباع والطير فلم يوره أخوه ودفن من استشهد من أصحابه."
  en: "al-Aswad ibn Kulthum al-Adawi, the ascetic called Adi al-Ribab; at Bayhaq he and a band entered by a wall-breach, the foe held it, and he died fighting with his men — Adham ibn Kathum then won the town. He had prayed to rise from the bellies of beasts and birds, so his brother left him unburied while the fallen companions were buried."
  fr: "Al-Aswad ibn Kulthum al-Adawi, ascète appelé Adi al-Ribab ; à Bayhaq, il entra avec un groupe par une brèche, que l’adversaire bloqua, et mourut en combattant avec ses hommes. Adham ibn Kathum prit ensuite la ville. Il avait prié pour ressusciter des ventres des bêtes et des oiseaux ; son frère le laissa donc sans sépulture, tandis que ses compagnons tombés furent enterrés."
  es: "Al-Aswad ibn Kulthum al-Adawi, el asceta llamado Adi al-Ribab, entró en Bayhaq con un grupo de hombres por una brecha en la muralla. El enemigo la defendió y murió luchando junto a ellos. Adham ibn Kathum conquistó entonces la ciudad. Había orado para resucitar de las entrañas de las bestias y las aves, por lo que su hermano lo dejó sin sepultura, mientras que sus compañeros caídos fueron enterrados."
  ur: "الاسود بن کلثوم العدوی، عدی الرباب کہلانے والا سنیاسی؛ بیہق کے مقام پر وہ اور ایک گروہ دیوار سے ٹوٹ کر داخل ہوا، دشمن نے اسے پکڑ لیا، اور وہ اپنے آدمیوں کے ساتھ لڑتے ہوئے مر گیا - پھر ادھم بن کتوم نے شہر جیت لیا۔ اس نے درندوں اور پرندوں کے پیٹوں سے اٹھنے کی دعا کی تھی، اس لیے اس کے بھائی نے اسے بے دفن چھوڑ دیا جب کہ گرے ہوئے ساتھی دفن تھے۔"
