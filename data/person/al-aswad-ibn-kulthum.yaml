summary:
  ar: "الأسود بن كلثوم العدوي المعروف بعدي الرباب وكان ناسكاً؛ وجهه ابن عامر إلى بيهق فدخل بعض حيطان أهله من ثلمة فيه ودخلت معه طائفة من المسلمين فأخذ العدو عليهم تلك الثلمة فقاتل حتى قتل ومن معه وقام بأمر الناس أدهم بن كاثوم فظفر وفتح بيهق وكان الأسود يدعو ربه أن يحشره من بطون السباع والطير فلم يوره أخوه ودفن من استشهد من أصحابه."
  en: "al-Aswad ibn Kulthum al-Adawi, the ascetic called Adi al-Ribab; at Bayhaq he and a band entered by a wall-breach, the foe held it, and he died fighting with his men — Adham ibn Kathum then won the town. He had prayed to rise from the bellies of beasts and birds, so his brother left him unburied while the fallen companions were buried."
