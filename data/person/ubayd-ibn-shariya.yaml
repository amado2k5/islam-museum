summary:
  ar: "أخباري جرهمي وفد على معاوية من أهل الدراية بأخبار الماضين وسير الغابرين من العرب وما كان فيها من الكوائن والحوادث، وكتابه متداول في أيدي الناس في زمن المسعودي، وقال جماعة من أهل المعرفة إن أخباره موضوعة من خرافات مصنوعة {cite:muruj-al-dhahab p. 549-550}."
  en: "The Jurhumi traditionist whose audiences with Mu'awiya produced the famous lore-book — circulating widely in al-Mas'udi's day though the learned called its tales fabricated romance {cite:muruj-al-dhahab p. 549-550}."
  es: "El tradicionalista Jurhumi cuya audiencia con Mu'awiya produjo el famoso libro de tradiciones — que circuló ampliamente en la época de al-Mas'udi aunque los eruditos llamaban a sus cuentos romances inventados {cite:muruj-al-dhahab p. 549-550}."
  fr: "Le traditionniste Jurhumi dont l'audience avec Mu'awiya a produit le célèbre livre de savoir — largement diffusé à l'époque d'al-Mas'udi, bien que les savants aient qualifié ses contes de roman fabriqué {cite:muruj-al-dhahab p. 549-550}."
  ur: "جرحومی روایت پسند جس کے سامعین نے معاویہ کے ساتھ مشہور افسانوی کتاب تیار کی تھی جو المسعودی کے زمانے میں بڑے پیمانے پر گردش کرتی تھی حالانکہ اہل علم نے اس کی کہانیوں کو من گھڑت رومانس کہا تھا {حوالہ: مروج الذہب صفحہ 549-550}۔"
  tr: "Akhbari Jurhami Geçmişi ve eski Arapların biyografilerini ve orada yaşanan olay ve olayları bilen kişilerden Muawiya'ya bir heyet geldi. Kitabı, el-Mes'udi döneminde halk arasında dolaşıma girdi. Bir grup âlim, onun anlatımlarının uydurma mitlerden uydurulduğunu söyledi {atıf:muruj-al-dhahab, s. 549-550}."
  id: "Akhbari Jurhami Sebuah delegasi datang ke Muawiya dari orang-orang yang berpengetahuan tentang masa lalu dan biografi orang Arab kuno serta peristiwa dan peristiwa yang terjadi di dalamnya. Bukunya beredar di antara masyarakat pada masa al-Mas'udi. Sekelompok ulama mengatakan bahwa kisah-kisahnya direkayasa dari mitos palsu {cite:muruj-al-dhahab, hlm. 549-550}."
