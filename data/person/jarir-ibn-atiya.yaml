  ar: "جرير بن عطية بن الخطفي التميمي البصري، شاعر مدح خلفاء بني أمية وشعره مدوَّن؛ مدح عبد الملك بن مروان فوهبه الخليفة مئة ناقة {cite:salabi-umayyad-state-2020 pp.40-41}. يذكر الكتاب أنه كان مع الفرزدق والأخطل أبرز شعراء عصر بني أمية، وأن الخلاف وقع في أيهم أشعر {cite:salabi-umayyad-state-2020 p.41}."
