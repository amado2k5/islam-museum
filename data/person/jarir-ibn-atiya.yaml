gender: male
roles: [poet]
summary:
  ar: "جرير بن عطية بن الخطفي التميمي البصري، شاعر مدح خلفاء بني أمية وشعره مدوَّن؛ مدح عبد الملك بن مروان فوهبه الخليفة مئة ناقة {cite:salabi-umayyad-state-2020 pp.40-41}. يذكر الكتاب أنه كان مع الفرزدق والأخطل أبرز شعراء عصر بني أمية، وأن الخلاف وقع في أيهم أشعر {cite:salabi-umayyad-state-2020 p.41}."
  tr: "Jarir ibn Atiyah ibn al-Khatfi al-Tamimi al-Basri, Emevi halifelerini öven bir şairdi ve şiirleri kaydedilmiştir; Abd al-Malik ibn Marwan'ı övmüş ve halife ona yüz dişi deve vermiştir {cite:salabi-umayyad-state-2020 s.40-41}. Kitapta, onun Emevi döneminin en önde gelen şairleri olarak el-Farazdaq ve al-Akhtal ile birlikte olduğu ve hangilerinin en şiirsel olduğu konusunda anlaşmazlık çıktığı belirtilmektedir {cite:selabi-umayyad-state-2020 s.41}."
  id: "Jarir ibn Atiyah ibn al-Khatfi al-Tamimi al-Basri adalah seorang penyair yang memuji khalifah Umayyah, dan puisinya tercatat; ia memuji Abd al-Malik ibn Marwan, dan khalifah memberinya seratus unta betina {cite:salabi-umayyad-state-2020 hlm.40-41}. Buku tersebut menyebutkan bahwa ia bersama al-Farazdaq dan al-Akhtal sebagai penyair paling terkemuka pada era Umayyah, dan bahwa perselisihan muncul tentang siapa yang paling puitis {cite:salabi-umayyad-state-2020 hlm.41}."
