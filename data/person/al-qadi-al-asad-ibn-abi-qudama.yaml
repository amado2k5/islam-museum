summary:
  ar: "القاضي الأسعد أبو المكارم أسعد بن مهذب بن ميناس المصري الكاتب الشاعر؛ كان ناظر الدواوين بالدار المصرية وفيه فضائل وله مصنفات عديدة، ونظم سيرة السلطان صلاح الدين ونظم كتاب كليلة ودمنة وله ديوان شعر؛ توفي يوم الأحد سادس جمادى الأولى سنة ست وستمائة عن اثنتين وستين سنة وكانت وفاته بحلب {cite:shadharat-dhahab p. 28-29}."
  en: "Al-Qadi al-As'ad Abu al-Makaram As'ad b. Mihdhab b. Minas, Egyptian katib and poet; nazir of the chanceries in Cairo, a man of merit with many works — he versified the sira of Salah al-Din and versified Kalila wa-Dimna, and left a diwan; he died Sunday 6 Jumada I 606, aged sixty-two, at Aleppo {cite:shadharat-dhahab p. 28-29}."
