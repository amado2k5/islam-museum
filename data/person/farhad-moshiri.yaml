summary:
  ar: "فرهاد مشيري (وُلد في 18 أيار 1955 في إيران)، رجل أعمال بريطاني إيراني يقيم في موناكو. عمل محاسبًا قانونيًا ثم شريكًا لعليشر عثمانوف في ميتالوإنفست ويو إس إم القابضة، واشترى حصة في نادي إيفرتون الإنكليزي سنة 2016 فصار مالكه الأكبر حتى باع حصته لمجموعة فريدكين سنة 2024."
  en: "Farhad Moshiri (born 18 May 1955 in Iran) is a British-Iranian businessman based in Monaco. A chartered accountant who became Alisher Usmanov's partner in Metalloinvest and USM Holdings, he bought into Everton Football Club in 2016 and was its majority owner until he sold his stake to the Friedkin Group in 2024."
  ur: "فرہاد مشیری (پیدائش 18 مئی 1955، ایران) موناکو میں مقیم برطانوی ایرانی تاجر ہیں۔ چارٹرڈ اکاؤنٹنٹ کے طور پر شروعات کے بعد وہ میٹالو انویسٹ اور یو ایس ایم ہولڈنگز میں علیشر عثمانوف کے شریک بنے، 2016 میں ایورٹن فٹ بال کلب میں حصہ خریدا اور 2024 میں اپنا حصہ فریڈکن گروپ کو بیچنے تک اس کے اکثریتی مالک رہے۔"

