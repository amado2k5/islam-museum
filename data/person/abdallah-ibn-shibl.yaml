summary:
  ar: "عبد الله بن شبل الأنتمسي؛ كان على مقدمة الوليد بن عقبة حين غزا أذربيجان سنة خمس وعشرين فأغار على أهل موقان والببر والطيلسان فتتم وسبى."
  en: "Abdallah ibn Shibl al-Antamasi; he led al-Walid ibn Uqba's van in the 25 AH Azerbaijan campaign, raiding Muqan, al-Babar and al-Taylasan to plunder and captives."
  fr: "Abdallah ibn Shibl al-Antamasi ; il conduisit l'avant-garde d'al-Walid ibn Uqba lors de la campagne d'Azerbaïdjan de 25 H, attaquant Muqan, al-Babar et al-Taylasan pour le butin et les captifs."
  es: "Abdallah ibn Shibl al-Antamasi; dirigió la camioneta de al-Walid ibn Uqba en la campaña de Azerbaiyán del 25 AH, atacando Muqan, al-Babar y al-Taylasan para saquear y capturar a los cautivos."
  ur: "عبداللہ ابن شبل الانتماسی؛ اس نے 25 ہجری کی آذربائیجان مہم میں الولید بن عقبہ کی وین کی قیادت کی، لوٹ مار اور اسیر کرنے کے لیے مقان، الببر اور الطیلسان پر چھاپے مارے۔"
  tr: "Abdullah bin Şibl el-Antamsi, Walid bin Uqba'nın 25. yılda Azerbaycan'ı işgal ettiği sırada ordusunun ön saflarında yer alıyordu. Muğan, el-Bir ve el-Taylasan halkına baskın düzenleyerek onları esir aldı."
  id: "Abdullah bin Shibl al-Antamsi berada di garis depan pasukan Walid bin Uqba ketika ia menginvasi Azerbaijan pada tahun 25. Ia menyerang penduduk Mughan, al-Bir, dan al-Taylasan, dan menangkap mereka."
