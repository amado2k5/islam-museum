summary:
  ar: "عاتكة بنت يخلد بن النضر بن كنانة، من جدات النبي في سلسلة العواتك، وهي أرفعهن قدراً ومن ثلاث من ولد النضر بن كنانة {cite:ansab-al-ashraf p. 534}."
  en: "Atika bint Yakhluḍ ibn al-Nadr ibn Kinana — the senior Qurashi 'Atika in the chain of the Prophet's ancestresses {cite:ansab-al-ashraf p. 534}."
  es: "Atika bint Yakhluḍ ibn al-Nadr ibn Kinana — la Qurashi 'Atika mayor en la cadena de las antepasadas del Profeta {cita:ansab-al-ashraf p. 534}."
  fr: "Atika bint Yakhluḍ ibn al-Nadr ibn Kinana — le Qurashi 'Atika le plus âgé dans la chaîne des ancêtres du Prophète {cite:ansab-al-ashraf p. 534}."
  ur: "عتیقہ بنت یخلود ابن الندر ابن کنانہ - نبی کے آباؤ اجداد کے سلسلے میں بزرگ قریشی عتیقہ 534}۔"
  tr: "Peygamber'in el-Awatak soyundan büyükannelerinden biri olan Atikah bint Yakhlid ibn Nadr ibn Kinana, el-Nadr bin Kinana'nın üç torunu arasında en seçkin olanıdır {atıf:ansab-al-ashraf, s. 534}."
  id: "Atikah bint Yakhlid ibn al-Nadr ibn Kinana, salah satu nenek Nabi dalam garis keturunan al-Awatak, adalah yang paling terkemuka di antara tiga keturunan al-Nadr ibn Kinana {cite:ansab-al-ashraf, hlm. 534}."
