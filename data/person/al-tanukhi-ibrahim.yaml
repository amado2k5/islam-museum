class: person
label: { ar: "بهاء الدين التنوخي القاضي", en: "Baha' al-Din al-Tanukhi al-Qadi", fr: "Baha' al-Din al-Tanukhi al-Qadi", es: "Baha' al-Din al-Tanukhi al-Qadi", ur: "بہاء الدین التنوخی القادی" }
summary:
  ar: "بهاء الدين التنوخي القاضي إبراهيم بن أبي اليسر شاكر بن عبد الله الشافعي الكاتب البليغ؛ والد تقي الدين إسماعيل، روى بالإجازة عن شهدة، وولي قضاء المعرة في صباه خمس سنين فقال «وليت الحكم خمساً وهي خمس لعمري والصبا في العنفوان * فكم تضع الأعادي قدر شاني ولا قالوا فلان قد رشاني»؛ توفي في المحرم سنة ثلاثين وستمائة {cite:shadharat-dhahab p. 135}."
  en: "Baha al-Din al-Tanukhi — the Shafi'i judge and eloquent katib, father of Taqi al-Din Isma'il; appointed qadi of Ma'arra for five years while still a youth, he marked the span in verse; died Muharram 630 {cite:shadharat-dhahab p. 135}."
  fr: "Baha al-Din al-Tanukhi - le juge Shafi'i et éloquent katib, père de Taqi al-Din Isma'il ; nommé qadi de Ma'arra pendant cinq ans alors qu'il était encore jeune, il a marqué la portée en vers ; est mort Muharram 630 {cite:shadharat-dhahab p. 135}."
  es: "Baha al-Din al-Tanukhi — juez shafi'í y elocuente escritor, padre de Taqi al-Din Isma'il; nombrado cadí de Ma'arra durante cinco años siendo aún joven, marcó ese lapso en verso; murió en Muharram de 630 {cita: shadharat-dhahab p. 135}."
  ur: "بہاء الدین التنوخی - شافعی جج اور فصیح مصنف، تقی الدین اسماعیل کے والد؛ جوانی میں ہی پانچ سال کے لیے معررہ کا قاضی مقرر کیا، اس نے آیت میں مدت کی نشان دہی کی۔ متوفی محرم 630۔ 135}۔"
