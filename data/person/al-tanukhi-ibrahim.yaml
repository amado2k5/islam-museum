summary:
  ar: "بهاء الدين التنوخي القاضي إبراهيم بن أبي اليسر شاكر بن عبد الله الشافعي الكاتب البليغ؛ والد تقي الدين إسماعيل، روى بالإجازة عن شهدة، وولي قضاء المعرة في صباه خمس سنين فقال «وليت الحكم خمساً وهي خمس لعمري والصبا في العنفوان * فكم تضع الأعادي قدر شاني ولا قالوا فلان قد رشاني»؛ توفي في المحرم سنة ثلاثين وستمائة {cite:shadharat-dhahab p. 135}."
  en: "Baha al-Din al-Tanukhi — the Shafi'i judge and eloquent katib, father of Taqi al-Din Isma'il; appointed qadi of Ma'arra for five years while still a youth, he marked the span in verse; died Muharram 630 {cite:shadharat-dhahab p. 135}."
