summary:
  ar: "محمد بن عمرو المغربي، عابد زاهد بمصر، كان يبقى أيامًا لا يذوق فيها طعامًا ولا شرابًا، قال فيه أبو زرعة إنه لم ير بمصر أصلح منه، وأسند الحديث الكثير، ومن حديثه حديث موسى في أهل ظل الله، وحديث عائشة في النور وشفاعة النبي لأمته."
  en: "Muhammad ibn Amr al-Maghribi, an ascetic worshipper in Egypt who went for days without food or drink; Abu Zur'a said he had not seen anyone in Egypt more upright. He transmitted much hadith, among it a hadith about Moses and the people in God's shade, and a hadith of Aisha about the light and the Prophet's intercession for his community."
  ur: "محمد بن عمرو مغربی مصر کے عابد و زاہد تھے جو کئی دن کھانے پینے کا ذائقہ نہ چکھتے؛ ابو زرعہ نے کہا کہ مصر میں ان سے بہتر کسی کو نہیں دیکھا۔ انہوں نے بہت حدیث روایت کی، جن میں موسیٰ کی حدیث اللہ کے سائے میں بیٹھنے والوں کے بارے میں، اور عائشہ کی حدیث نور اور امت کے لیے نبی کی شفاعت کے بارے میں ہے۔"
