id: person/uthman-ibn-abd-al-haqq-marinid
class: person
label:
  ar: عثمان بن عبد الحق المريني
  en: Uthman ibn Abd al-Haqq al-Marini
summary:
  ar: "أبو سعيد عثمان بن عبد الحق المريني؛ قام بأمر بني مرين بعد مهلك أبيه سنة 614هـ فثار بأبيه وأخيه إدريس حتى شفا نفسه من قتلتهما، وسار بالقوم في نواحي المغرب يتقرى مسالكه وشعوبه ويضع المغارم على أهله حتى دخل أكثرهم في أمره فبايعه الظواعن والقبائل هوارة وزكارة وتسول ومكناسة وبطوبة وقشتالة وسدراتة وبهلولة ومديونة وفرض عليهم الخراج وفرق فيهم العمال، وفرض على أمصار المغرب فاس وتازى ومكناسة وقصر كتامة ضريبة معلومة على أن يكف الغارة عنهم، وغزا ظواعن زناتة سنة 620هـ فأثخن فيهم حتى أذعنوا، ثم عطف على رياح أهل أزغار والهبط فأثخن فيهم وأبادهم، ولم يزل دأبه ذلك إلى أن هلك باغتيال علجة سنة سبع وثلاثين وستمائة."
  en: "Abu Sa'id Uthman ibn Abd al-Haqq al-Marini; he avenged his father and brother on their killers, then ranged the Moroccan marches imposing the mugharim until the tribes — Hawwara, Zakara, Tasul, Miknasa, Batuba, Qashtala, Sidrata, Bahlula and Madyuna — paid him kharaj, and the cities Fes, Taza, Miknasa and Qasr Kutama an annual tax in return for sparing them his raids; he crushed the Zanata nomads in 620, wiped out Riyah of Azghar and the Habit, and kept at it until a Christian slave assassinated him in 637."
