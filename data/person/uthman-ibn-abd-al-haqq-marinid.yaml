id: person/uthman-ibn-abd-al-haqq-marinid
class: person
label:
  ar: عثمان بن عبد الحق المريني
  en: Uthman ibn Abd al-Haqq al-Marini
  es: "Uthman ibn Abd al-Haqq al-Marini"
  fr: "Uthman ibn Abd al-Haqq al-Marini"
  ur: "عثمان بن عبد الحق المرینی"
summary:
  ar: "أبو سعيد عثمان بن عبد الحق المريني؛ قام بأمر بني مرين بعد مهلك أبيه سنة 614هـ فثار بأبيه وأخيه إدريس حتى شفا نفسه من قتلتهما، وسار بالقوم في نواحي المغرب يتقرى مسالكه وشعوبه ويضع المغارم على أهله حتى دخل أكثرهم في أمره فبايعه الظواعن والقبائل هوارة وزكارة وتسول ومكناسة وبطوبة وقشتالة وسدراتة وبهلولة ومديونة وفرض عليهم الخراج وفرق فيهم العمال، وفرض على أمصار المغرب فاس وتازى ومكناسة وقصر كتامة ضريبة معلومة على أن يكف الغارة عنهم، وغزا ظواعن زناتة سنة 620هـ فأثخن فيهم حتى أذعنوا، ثم عطف على رياح أهل أزغار والهبط فأثخن فيهم وأبادهم، ولم يزل دأبه ذلك إلى أن هلك باغتيال علجة سنة سبع وثلاثين وستمائة."
  en: "Abu Sa'id Uthman ibn Abd al-Haqq al-Marini; he avenged his father and brother on their killers, then ranged the Moroccan marches imposing the mugharim until the tribes — Hawwara, Zakara, Tasul, Miknasa, Batuba, Qashtala, Sidrata, Bahlula and Madyuna — paid him kharaj, and the cities Fes, Taza, Miknasa and Qasr Kutama an annual tax in return for sparing them his raids; he crushed the Zanata nomads in 620, wiped out Riyah of Azghar and the Habit, and kept at it until a Christian slave assassinated him in 637."
  es: "Abu Sa'id Uthman ibn Abd al-Haqq al-Marini; vengó a su padre y a su hermano de sus asesinos, luego recorrió las fronteras marroquíes imponiendo a los mugharim hasta que las tribus — Hawwara, Zakara, Tasul, Miknasa, Batuba, Qashtala, Sidrata, Bahlula y Madyuna — le pagaron kharaj, y las ciudades de Fez, Taza, Miknasa y Qasr Kutama un impuesto anual a cambio de que les perdonara sus incursiones; aplastó a los nómadas Zanata en 620, aniquiló a Riyah de Azghar y a los Habit, y continuó haciéndolo hasta que un esclavo cristiano lo asesinó en 637."
  fr: "Abou Saïd Uthman ibn Abd al-Haqq al-Marini; il vengea son père et son frère de leurs assassins, puis parcourut les marches marocaines en imposant les mugharim jusqu'à ce que les tribus — Hawwara, Zakara, Tasul, Miknasa, Batuba, Qashtala, Sidrata, Bahlula et Madyuna — lui versent le kharaj, et les villes de Fès, Taza, Miknasa et Qasr Kutama une taxe annuelle en échange de leur protection contre ses raids; il écrasa les nomades Zanata en 620, anéantit Riyah d'Azghar et le Habit, et continua ainsi jusqu'à ce qu'un esclave chrétien l'assassine en 637."
  ur: "ابو سعید عثمان بن عبد الحق المرینی ; اس نے اپنے باپ اور بھائی کا بدلہ ان کے قاتلوں سے لیا، پھر مراکش کے مارچوں میں مغیرہ کو مسلط کیا یہاں تک کہ قبائل - حوارہ، زکارہ، تسول، میکناسہ، بطوبہ، قشتالہ، سدراتہ، بہلولہ اور مدیونہ - نے اسے خرج ادا کیا، اور شہر فیس، تعزہ، مکناسہ اور قصر اس کے سالانہ ٹیکس کی واپسی میں ان کو رقم ادا کی۔ اس نے 620 میں زناٹا خانہ بدوشوں کو کچل دیا، ازغر کی ریا اور عادت کو مٹا دیا، اور اس پر قائم رہا یہاں تک کہ 637 میں ایک عیسائی غلام نے اسے قتل کر دیا۔"
  tr: "Ebu Sa'id Osman bin Abdülhak el-Marini, babasının 614 Hicri yılında ölümünden sonra Banu Marin'i yönetti. Babası ve kardeşi İdris'e karşı isyan etti, ta ki katillerinden kendini iyileştirene kadar. Halkı Magrip boyunca yönlendirdi, yollarını ve halklarını inceledi, halklarına para cezaları verdi ve çoğu tarikatına katılana kadar. Zawa'in ve Hawara, Zakara, Tasavul, Meknasa, Toba, Kastilya, Sidrata kabileleri, Bahlula ve Medine onlara bağlılık yemini etti, vergiler koydu, aralarında dağıttı ve batıdaki Fez, Tazi, Meknasa ve Qasr Katama eyaletlerine baskınları durdurmaları için bilinen bir vergi koydu. 620 Hicri'de Zanata'ya baskın düzenledi, katılımlarını yoğunlaştırdı ve teslim oldular. Daha sonra Azghar ve Al-Habt rüzgarlarına yöneldi, onları yoğunlaştırdı ve yok etti. Bu uygulamayı 637 Hicri'de Alja'nın suikastında ölene kadar sürdürdü."
  id: "Abu Sa'id Uthman ibn Abd al-Haqq al-Marini memimpin Banu Marin setelah kematian ayahnya pada tahun 614 H. Ia memberontak melawan ayah dan saudaranya Idris hingga ia sembuh dari para pembunuh mereka. Ia memimpin rakyat melintasi Maghreb, mempelajari rute dan bangsa mereka, serta mengenakan denda kepada rakyat mereka hingga sebagian besar bergabung dengan ordonya. Zawa'in dan suku-suku Hawara, Zakara, Tasawul, Meknasa, Toba, Kastilia, Sidrata, Bahlulu. la, dan Madinah bersumpah setia kepada mereka, mengenakan pajak kepada mereka, membagi-bagi di antara mereka, dan memberlakukan pajak yang diketahui pada provinsi barat Fez, Tazi, Meknasa, dan Qasr Katama untuk menghentikan perampokan mereka. Ia menyerang Zanata pada tahun 620 H, memperkuat keterlibatan mereka hingga mereka tunduk. Ia kemudian berbalik ke arah angin Azghar dan Al-Habt, memperkuat mereka, dan memusnahkan mereka. Ia melanjutkan praktik ini hingga ia meninggal dalam pembunuhan Alja pada tahun 637 H."
