summary:
  ar: "خان بهادر سر سكندر حياة خان (1892–1942) سياسي ورجل دولة من البنجاب، أول رئيس وزراء للبنجاب (1937–1942) عن الحزب الاتحادي، وقّع ميثاق جناح–سكندر سنة 1937 وساند قرار لاهور سنة 1940 مع معارضته تقسيم الهند، وتولى بالوكالة حكم البنجاب مرتين، ودُفن عند أعتاب المسجد البادشاهي في لاهور."
  en: "Khan Bahadur Sir Sikandar Hayat Khan (1892–1942) was a Punjabi politician and statesman, the first Premier of the Punjab (1937–1942) for the Unionist Party, who signed the Jinnah–Sikandar Pact in 1937 and supported the Lahore Resolution of 1940 while opposing the partition of India, twice served as acting Governor of the Punjab, and was buried at the footsteps of the Badshahi Mosque in Lahore."
  ur: "خان بہادر سر سکندر حیات خان (1892ء–1942ء) پنجابی سیاست دان اور ریاست کار تھے، یونینسٹ پارٹی کی جانب سے پنجاب کے پہلے وزیراعظم (1937ء–1942ء) رہے، 1937ء میں جناح سکندر معاہدے پر دستخط کیے اور 1940ء کی قراردادِ لاہور کی حمایت کی مگر تقسیمِ ہند کے مخالف رہے، دو بار پنجاب کے قائم مقام گورنر رہے اور لاہور میں بادشاہی مسجد کے قدموں میں دفن ہوئے۔"
