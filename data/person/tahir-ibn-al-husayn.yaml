summary:
  ar: "قائد عباسي، استولى على بغداد في سنة ثمان وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.472}، وولي خراسان في سنة خمس ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.577}. وعند المسعودي لقب بذي اليمينين لضربه عباس بن الليث يوم الري بيديه جميعاً على سيفه فأتى الضربة عليه {cite:muruj-al-dhahab p. 375-376}، ونزل بالبستان المعروف بباب الكباش الطاهري ثم نقل من الياسرية إلى باب الأنبار، ولما طلب الأمين الأمان قال الآن لما ضيق خناقه وهيض جناحه لا حتى يضع يده في يدي وينزل على حكمي {cite:muruj-al-dhahab p. 383-385}"
