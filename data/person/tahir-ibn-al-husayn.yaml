label: { ar: "طاهر بن الحسين" }
summary:
  ar: "قائد عباسي، استولى على بغداد في سنة ثمان وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.472}، وولي خراسان في سنة خمس ومائتين {cite:tabari-tarikh-abu-al-fadl j.8 p.577}. وعند المسعودي لقب بذي اليمينين لضربه عباس بن الليث يوم الري بيديه جميعاً على سيفه فأتى الضربة عليه {cite:muruj-al-dhahab p. 375-376}، ونزل بالبستان المعروف بباب الكباش الطاهري ثم نقل من الياسرية إلى باب الأنبار، ولما طلب الأمين الأمان قال الآن لما ضيق خناقه وهيض جناحه لا حتى يضع يده في يدي وينزل على حكمي {cite:muruj-al-dhahab p. 383-385}"
  tr: "Bir Abbasi komutanı olarak, yüz doksan sekizinci yılda Bağdat'ı ele geçirdi {cite:tabari-tarikh-abu-al-fadl j. 8 s.472} ve iki yüz beş yılında Horasan'ı ele geçirdi {atıf:tabari-tarikh-abu-al-fadl j.8 s.577}. al-Mas'udi'ye göre, Abbas ibn al-Layth'in Rayy günü tüm elleriyle kılıcıyla vurması nedeniyle Dhu al-Yamanayn lakabı verilmiştir; kılıcı onu vurmuş {cite:muruj-al-dhahab s. 375-376} ve Bab al-Kabbash al-Tahiri olarak bilinen bahçeye yerleşmiş ve ardından al-Yasiriyah'dan Bab al-Anbar'a geçmiştir. Al-Amin güvenlik aradığında şöyle demiştir: 'Şimdi ilmek sıkılaşıp kanadı aşağı düştüğünde, elini benim elime koyup Hakim'in üzerine inmez {cite:muruj-al-dhahab s. 383-385}"
  id: "Sebagai komandan Abbasiyah, ia merebut Baghdad pada tahun seratus sembilan puluh delapan {cite:tabari-tarikh-abu-al-fadl j.8 hlm.472}, dan mengambil alih Khorasan pada tahun dua ratus lima {cite:tabari-tarikh-abu-al-fadl j.8 hlm.577}. Menurut al-Mas'udi, ia dijuluki Dhu al-Yamanayn karena Abbas ibn al-Layth memukulnya pada hari Rayy dengan seluruh tangannya dengan pedangnya, yang memukulnya {cite:muruj-al-dhahab hlm. 375-376}, dan ia menetap di kebun yang dikenal sebagai Bab al-Kabbash al-Tahiri lalu pindah dari al-Yasiriyah ke Bab al-Anbar. Ketika al-Amin mencari perlindungan, ia berkata, 'Sekarang ketika jeratnya mengencang dan sayapnya tergantung, ia tidak akan meletakkan tangannya di tanganku dan turun ke Hakim {cite:muruj-al-dhahab hlm. 383-385}"
