summary:
  ar: "معلّم صوفي (1916–2004)، وُلد في لندن وتوفي قبل يومين من عيد ميلاده الثامن والثمانين؛ ابن عنايت خان وخليفته في قيادة طريقته، درّس التأمل وتقاليد الطريقة الجشتية، وأسس «دار الرسالة» في أمريكا سنة 1975، وله كتب صوفية منها «اليقظة: تجربة صوفية» و«بحثًا عن الكنز الخفي»."
  en: "Sufi teacher (1916–2004), born in London and died two days before his 88th birthday. A son of Inayat Khan and his successor as head of his order, he taught meditation and the traditions of the Chishti order, founded The Abode of the Message in the United States in 1975, and wrote Sufi books including Awakening: A Sufi Experience and In Search of the Hidden Treasure."
  ur: "صوفی استاد (1916–2004)، لندن میں پیدا ہوئے؛ عنایت خان کے بیٹے اور ان کے سلسلے میں ان کے جانشین، انھوں نے مراقبے اور چشتی سلسلے کی روایات کی تعلیم دی، 1975 میں امریکا میں «دار الرسالة» قائم کیا، اور ان کی صوفی کتب میں «بیداری: ایک صوفی تجربہ» شامل ہے۔"
