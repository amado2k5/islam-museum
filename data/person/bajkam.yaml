summary:
  ar: "التركي، خرج على ابن رائق سنة ست وعشرين فظهر عليه ودخل بغداد فأكرمه الراضي ورفع منزلته ولقبه أمير الأمراء وقلده إمارة بغداد وخراسان، وقتل في أيام المتقي فأخذ المتقي حواصله التي كانت ببغداد وهي زيادة على ألف ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 605,608}."
  en: "The Turk who ousted Ibn Ra'iq in 326, entered Baghdad and was titled amir al-umara over Baghdad and Khurasan; killed under al-Muttaqi, his Baghdad deposits — over a million dinars — went to the caliph {cite:tarikh-khulafa-minhaj-1434 p. 605,608}."
