id: person/bajkam
class: person
label: { ar: "بجكم التركي" }
summary:
  ar: "التركي، خرج على ابن رائق سنة ست وعشرين فظهر عليه ودخل بغداد فأكرمه الراضي ورفع منزلته ولقبه أمير الأمراء وقلده إمارة بغداد وخراسان، وقتل في أيام المتقي فأخذ المتقي حواصله التي كانت ببغداد وهي زيادة على ألف ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 605,608}. وعند المسعودي ضرب له ديناراً ودرهماً عليهما صورته شاك في سلاحه وكتب حوله إنما العز فاعلم للأمير المعظم سيد الناس بجكم، فوقف عليه الراضي متطرقاً حتى أنشده مؤدبه العروضي أبيات المهرجان فطرب، وأتته هدايا بجكم وألطافه من أرض العجم يومئذ {cite:muruj-al-dhahab p. 689-690}، وعند ابن الأثير لما قتل الأتراك مرداويج افترقوا فرقتين فرقة سارت إلى عماد الدولة بن بويه مع خجحج الذي سماه توزون فيما بعد وفرقة سارت نحو الجبل مع بجكم وهي أكثرها فجبوا خراج الدينور وساروا إلى النهروان وكاتبوا الراضي في المسير إلى بغداد فأذن لهم، ثم قدّمهم ابن رائق إلى واسط وأمر بجكم بمكاتبة أصحاب مرداويج واسترضائهم وأمره أن يكتب إلى الناس بجكم الرائقي {cite:kamil-ibn-al-athir p. 227-228}، وعند ابن الجوزي ولقب بأمير الأمراء وكان يعافهم بالعربية ولا يتكلم بها ويقول أخاف أن أخطئ وانخطأ من الرئيس فهو قبوح وقال إن كنت لا أحسن العلم والأدب فأحب ألا يكون في الأرض أديب ولا عالم ولا رأس صناعة إلا في جنبتي وتحت اصطناعي وكان قد استوطن واسطاً وقرر مع الراضي أن يحمل إلى خزانته من مالها في كل سنة ثمانمائة ألف دينار بعد أن يزيح العلة في مؤنة خمسة آلاف فارس يقيمون بها وأظهر العدل وكان يقول قد نبئت أن العدل أربح للسلطان في الدنيا والآخرة وبنى دار ضيافة للضعفاء والمساكين بواسط وابتدأ بعمل المارستان ببغداد وهو الذي جدده عضد الدولة وكان يدفن أمواله في داره وفي الصحارى يحمل رجالاً في صناديق مغلقة يقودهم إليها فلا يدرون أي موضع حملهم {cite:muntazam-ibn-al-jawzi p. 612}"
  en: "The Turk who ousted Ibn Ra'iq in 326, entered Baghdad and was titled amir al-umara over Baghdad and Khurasan; killed under al-Muttaqi, his Baghdad deposits — over a million dinars — went to the caliph {cite:tarikh-khulafa-minhaj-1434 p. 605,608}."
  es: "El turco que derrocó a Ibn Ra'iq en 326, entró en Bagdad y recibió el título de amir al-umara sobre Bagdad y Khurasan; asesinado bajo al-Muttaqi, sus depósitos en Bagdad (más de un millón de dinares) fueron al califa {cita:tarikh-khulafa-minhaj-1434 p. 605.608}."
  fr: "Le Turc qui chassa Ibn Ra'iq en 326 entra à Bagdad et reçut le titre d'émir al-umara sur Bagdad et le Khurasan; tué sous al-Muttaqi, ses dépôts à Bagdad – plus d'un million de dinars – sont allés au calife {cite:tarikh-khulafa-minhaj-1434 p. 605 608}."
  ur: "وہ ترک جس نے 326 میں ابن رقیق کو معزول کر دیا، بغداد میں داخل ہوا اور اسے بغداد اور خراسان پر امیر العمرہ کا خطاب دیا گیا۔ المتقی کے ماتحت مارا گیا، اس کے بغداد کے ذخائر - ایک ملین دینار سے زیادہ - خلیفہ کے پاس گئے۔ 605,608}۔"
  tr: "El-Turki, yirmi altıncı yılda İbn Ra'ik'e karşı isyan etti, ona karşı çıktı, Bağdat'a girdi ve Al-Radi onu onurlandırdı, statüsünü yükseltti, ona 'Prenslerin Komutanı' unvanını verdi ve Bağdat ile Horasan'ın valisi olarak atadı. El-Muttaki zamanında öldürüldü, bu yüzden el-Muttaqi Bağdat'taki miraslarını aldı; miras bin bin dinarı aştı {alıntı:Tarikh-khulafa-minhaj-1434, s. 605,608}. El-Mes'udi'de ona bir dinar ve bir dirhem verdi; her ikisinin de silahında bir resmi vardı ve etrafına şöyle yazdı: 'Sadece onur en iyisidir, bunu büyük prens, halkın efendisi Beykum için bilin.' El-Radi ona ayağa kalktı ve konuştu, ta ki hocası El-Avdi bayramın ayetlerini sevinçle okuyana kadar; o dönemde Pers topraklarından hediyeler ve lütuflar aldı {atıf:Muruj-al-Dhahab, s. 689-690}. İbn el-Athir'e göre, Türkler Mardevic'i öldürdüğünde iki grup ayrıldı: biri Khajahaj ile birlikte Imad al-Dawla ibn Buyah'a yürüdü, ona daha sonra Tuzun adını verdi, diğeri ise Bajkum ile dağa doğru yürüdü Çoğu Dinawar vergilerini topladı ve Nahrawan'a yürüdü, Bağdat'a yürürken Al-Radi'ye yazdı, o da onlara izin verdi. Sonra İbn Ra'iq onları Wasit'e getirdi ve Bijakim'e Mardavic halkıyla yazışmasını ve onları yatıştırmasını emretti, Bijakim'e ise Bigam al-Ra'iq ile halka yazmasını emretti {cite:kamil-ibn-al-athir s. 227-228}. İbn al-Jawzi ile birlikte 'Prenslerin Prensi' unvanı verildi ve onlara Arapça davranıp konuşmazdı, 'Bir hata yapıp cumhurbaşkanı hakkında yanlış olabilirim, çünkü o çirkin.' derdi. Dedi ki, 'Bilgi ve görgü konusunda iyi değilsem, dünyada ne yazar ne de âlim olmasını isterim.' Sanayi başı sadece yanımda ve yapay temelimde kalmıştı. Wasit'te yerleşmişti ve Al-Radi ile birlikte, orada yaşayan beş bin süvarının yükünü kaldırdıktan sonra her yıl hazinesine sekiz yüz bin dinar getirmeye karar verdi. Adaleti gösterdi ve adaletin sultan için bu dünyada ve öteki dünyada daha faydalı olduğunu söylerdi. Wasit'te zayıflar ve muhtaçlar için bir misafirhane inşa etti ve Adud al-Dawla tarafından yenilenen Bağdat'ta maristan olarak çalışmaya başladı. Servetini evinde ve çöllerde gömer, adamları kapalı kutularda taşıyarak nereye götürüleceklerini bilmeden götürürdü {cite:Muntazam-ibn-al-Jawzi, s. 612}"
  id: "Al-Turki memberontak melawan Ibn Ra'iq pada tahun dua puluh enam, muncul melawannya, memasuki Baghdad, dan Al-Radi menghormatinya, mengangkat statusnya, memberinya gelar 'Panglima Para Pangeran,' dan mengangkatnya sebagai gubernur Baghdad dan Khurasan. Ia tewas pada masa al-Muttaqi, sehingga al-Muttaqi mengambil warisan yang ada di Baghdad, yang melebihi seribu ribu dinar {cite:Tarikh-khulafa-minhaj-1434, hlm. 605,608}. Di Al-Mas'udi, ia memberinya sebuah dinar dan sebuah dirham, keduanya ia memiliki gambar dirinya di senjatanya dan menulis di sekelilingnya, 'Hanya kehormatan yang terbaik, demikian yang diketahui oleh pangeran agung, penguasa rakyat, Bajkum.' Al-Radi berdiri dan berbicara kepadanya sampai gurunya Al-Awdi membacakan bait-bait festival dengan sukacita, serta hadiah dan kebaikan dari tanah Persia saat itu {cite:muruj-al-dhahab, hlm. 689-690}. Menurut Ibn al-Athir, ketika orang Turki membunuh Mardawij, dua kelompok terpecah: satu yang berjalan ke Imad al-Dawla ibn Buyah bersama Khajahaj, yang kemudian ia sebut Tuzun, dan satu lagi yang berjalan menuju gunung bersama Bajkum, yang Sebagian besar dari mereka mengumpulkan pajak Dinawar dan berbaris ke Nahrawan, menulis surat kepada Al-Radi dalam perjalanan ke Baghdad, yang memberikan izin. Kemudian Ibn Ra'iq membawa mereka ke Wasit dan memerintahkan Bijakim untuk berkorespondensi dengan rakyat Mardavij dan menenangkan mereka, serta memerintahkannya menulis kepada rakyat dengan Bigam al-Ra'iq {cite:kamil-ibn-al-athir hlm. 227-228}. Bersama Ibn al-Jawzi, ia diberi gelar 'Pangeran Para Pangeran' dan biasa memperlakukan mereka dalam bahasa Arab tanpa mengucapkannya, berkata, 'Aku takut aku akan membuat kesalahan dan salah dengan presiden, karena dia jelek.' Dia berkata, 'Jika aku tidak pandai dalam pengetahuan dan tata krama, aku ingin tidak ada penulis atau cendekiawan di dunia.' Tidak ada kepala industri kecuali di pihak saya dan di bawah basis buatan saya. Dia telah menetap di Wasit, dan dia memutuskan bersama Al-Radi untuk membawa ke perbendaharaan delapan ratus ribu dinar setiap tahun dari kekayaannya setelah mengurangi beban lima ribu penunggang kuda yang tinggal di sana. Dia menunjukkan keadilan, dan dia biasa mengatakan bahwa keadilan lebih menguntungkan sultan di dunia ini dan akhirat. Dia membangun rumah tamu untuk yang lemah dan membutuhkan di Wasit dan mulai bekerja sebagai maristan di Baghdad, yang direnovasi oleh Adud al-Dawla. Dia biasa mengubur kekayaannya di rumahnya dan di padang pasir, membawa orang-orang dalam kotak tertutup yang akan dibawa tanpa tahu ke mana mereka akan dibawa {cite:muntazam-ibn-al-jawzi, hlm. 612}"
