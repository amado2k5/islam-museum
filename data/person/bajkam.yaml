class: person
label: { ar: "بجكم التركي" }
summary:
  ar: "التركي، خرج على ابن رائق سنة ست وعشرين فظهر عليه ودخل بغداد فأكرمه الراضي ورفع منزلته ولقبه أمير الأمراء وقلده إمارة بغداد وخراسان، وقتل في أيام المتقي فأخذ المتقي حواصله التي كانت ببغداد وهي زيادة على ألف ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 605,608}. وعند المسعودي ضرب له ديناراً ودرهماً عليهما صورته شاك في سلاحه وكتب حوله إنما العز فاعلم للأمير المعظم سيد الناس بجكم، فوقف عليه الراضي متطرقاً حتى أنشده مؤدبه العروضي أبيات المهرجان فطرب، وأتته هدايا بجكم وألطافه من أرض العجم يومئذ {cite:muruj-al-dhahab p. 689-690}، وعند ابن الأثير لما قتل الأتراك مرداويج افترقوا فرقتين فرقة سارت إلى عماد الدولة بن بويه مع خجحج الذي سماه توزون فيما بعد وفرقة سارت نحو الجبل مع بجكم وهي أكثرها فجبوا خراج الدينور وساروا إلى النهروان وكاتبوا الراضي في المسير إلى بغداد فأذن لهم، ثم قدّمهم ابن رائق إلى واسط وأمر بجكم بمكاتبة أصحاب مرداويج واسترضائهم وأمره أن يكتب إلى الناس بجكم الرائقي {cite:kamil-ibn-al-athir p. 227-228}، وعند ابن الجوزي ولقب بأمير الأمراء وكان يعافهم بالعربية ولا يتكلم بها ويقول أخاف أن أخطئ وانخطأ من الرئيس فهو قبوح وقال إن كنت لا أحسن العلم والأدب فأحب ألا يكون في الأرض أديب ولا عالم ولا رأس صناعة إلا في جنبتي وتحت اصطناعي وكان قد استوطن واسطاً وقرر مع الراضي أن يحمل إلى خزانته من مالها في كل سنة ثمانمائة ألف دينار بعد أن يزيح العلة في مؤنة خمسة آلاف فارس يقيمون بها وأظهر العدل وكان يقول قد نبئت أن العدل أربح للسلطان في الدنيا والآخرة وبنى دار ضيافة للضعفاء والمساكين بواسط وابتدأ بعمل المارستان ببغداد وهو الذي جدده عضد الدولة وكان يدفن أمواله في داره وفي الصحارى يحمل رجالاً في صناديق مغلقة يقودهم إليها فلا يدرون أي موضع حملهم {cite:muntazam-ibn-al-jawzi p. 612}"
  en: "The Turk who ousted Ibn Ra'iq in 326, entered Baghdad and was titled amir al-umara over Baghdad and Khurasan; killed under al-Muttaqi, his Baghdad deposits — over a million dinars — went to the caliph {cite:tarikh-khulafa-minhaj-1434 p. 605,608}."
