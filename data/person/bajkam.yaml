label: { ar: "بجكم التركي" }
summary:
  ar: "التركي، خرج على ابن رائق سنة ست وعشرين فظهر عليه ودخل بغداد فأكرمه الراضي ورفع منزلته ولقبه أمير الأمراء وقلده إمارة بغداد وخراسان، وقتل في أيام المتقي فأخذ المتقي حواصله التي كانت ببغداد وهي زيادة على ألف ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 605,608}.، وعند المسعودي ضرب له ديناراً ودرهماً عليهما صورته شاك في سلاحه وكتب حوله إنما العز فاعلم للأمير المعظم سيد الناس بجكم، فوقف عليه الراضي متطرقاً حتى أنشده مؤدبه العروضي أبيات المهرجان فطرب، وأتته هدايا بجكم وألطافه من أرض العجم يومئذ {cite:muruj-al-dhahab p. 689-690}، وعند ابن الأثير لما قتل الأتراك مرداويج افترقوا فرقتين فرقة سارت إلى عماد الدولة بن بويه مع خجحج الذي سماه توزون فيما بعد وفرقة سارت نحو الجبل مع بجكم وهي أكثرها فجبوا خراج الدينور وساروا إلى النهروان وكاتبوا الراضي في المسير إلى بغداد فأذن لهم، ثم قدّمهم ابن رائق إلى واسط وأمر بجكم بمكاتبة أصحاب مرداويج واسترضائهم وأمره أن يكتب إلى الناس بجكم الرائقي {cite:kamil-ibn-al-athir p. 227-228}"
  en: "The Turk who ousted Ibn Ra'iq in 326, entered Baghdad and was titled amir al-umara over Baghdad and Khurasan; killed under al-Muttaqi, his Baghdad deposits — over a million dinars — went to the caliph {cite:tarikh-khulafa-minhaj-1434 p. 605,608}."
