summary:
  ar: "شاعر وسياسي مصري ⁦(1839–1904)⁩، يُعدّ باعث الشعر العربي الحديث ومؤسس مدرسة الإحياء والبعث. شارك في الثورة العرابية وشغل رئاسة الوزارة المصرية سنة 1882، ونُفي إلى سيلان سبعة عشر عامًا، وجمع شعره ودققه في «ديوان البارودي» و«مختارات البارودي»."
  en: "Egyptian poet and statesman (1839–1904), regarded as the awakener of modern Arabic poetry and founder of the revival school. He joined the Urabi revolution and served as Egypt's prime minister in 1882, was exiled to Ceylon for seventeen years, and collected and refined his verse in the Diwan al-Barudi and Mukhtarat al-Barudi."
  ur: "مصری شاعر اور سیاستدان ⁦(1839–1904)⁩ جنھیں جدید عربی شاعری کا باعث اور احیائی مکتب کا بانی کہا جاتا ہے۔ وہ عرابی انقلاب میں شریک ہوئے اور 1882 میں مصر کے وزیرِ اعظم رہے، سترہ برس سیلان میں جلاوطن رہے اور اپنی شاعری «دیوانِ بارودی» اور «مختاراتِ بارودی» میں جمع و تدوین کی۔"
