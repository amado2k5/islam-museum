summary:
  ar: "الشيخ العارف بالله شيخ بن عبد الله بن شيخ بن عبد الله العيدروس اليمني الشافعي؛ قال ولده في النور السافر في أعيان القرن العاشر: ولد سنة تسع عشرة وتسعمائة بتريم من اليمن وصار شيخ زمانه باتفاق عارفي وقته، ولقد ألهم الله أهله حيث سموه شيخاً، وكان علامة وقته وشيخ الطريقة حقيقة واسماً؛ وقال الشيخ أبو بكر باعلوى: ما أحد من آل باعلوي أولهم وآخرهم أُعطي مثله؛ وكان يعتمر غالباً في رمضان أربع عمرات بالليل وأربعاً بالنهار، ومن أخذ عنه العلم ابن حجر الهيتمي وعبد الله باقشير الحضرمي؛ ومن مصنفاته العقد النبوي والسر المصطفوي والفوز والبشرى وشرحان على قصيدته المسماة تحفة المريد ومولدان ومعراج والحزب النفيس ونفحات الحكم على لامية العجم وديوان شعر؛ دخل الهند سنة ثمان وخمسين وتسعمائة فأقام بها إلى أن توفي بأحمد أباد ليلة السبت لست وعشرين خلت من شهر رمضان {cite:shadharat-dhahab p. 423-424}."
  en: "Shaykh b. 'Abd Allah al-'Aydarus — Tarim's 'shaykh of his age by the gnosis of his time,' the Ba 'Alawi of whom Abu Bakr b. Salim said none of their house was given his like; four 'umras a night and four by day in Ramadan, teacher of Ibn Hajar al-Haytami; author of the 'Aqd Nabawi, al-Fawz wa'l-Bushra, Tuhfat al-Murid; moved to India 958 and died at Ahmadabad Saturday eve 26 Ramadan [990] {cite:shadharat-dhahab p. 423-424}."
