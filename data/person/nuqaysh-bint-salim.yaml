summary:
  ar: "عابدة من مكة يذكرها ابن الجوزي في «صفة الصفوة» بين عابدات مكة، ويروي من طريق أبي المورّق أدعيتها في مكة وفي الموقف بعرفة، ومنها أنها أقسمت ألا تنعم بضحك حتى تعلم أين قرارها، وأنها لما انصرف الناس وضعت خدها وقالت إنها لم تُشعر قلبها اليأس من ربها؛ ويذكر المحقق أن كحالة نقلها في «أعلام النساء» عن صفة الصفوة."
  en: "A devout woman of Mecca whom Ibn al-Jawzi lists among its devout women in Sifat al-Safwa; through Abu al-Muwarriq he reports her prayers in Mecca and at the standing at Arafa — among them her oath that she would not enjoy laughter until she knew her final abode, and that when the people departed she laid her cheek down and said she had not let despair of her Lord touch her heart; the editor notes that Kahhala took her from this book into A'lam al-Nisa'."
