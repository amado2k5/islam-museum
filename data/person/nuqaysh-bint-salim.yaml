roles: [mystic]
summary:
  ar: "عابدة من مكة يذكرها ابن الجوزي في «صفة الصفوة» بين عابدات مكة، ويروي من طريق أبي المورّق أدعيتها في مكة وفي الموقف بعرفة، ومنها أنها أقسمت ألا تنعم بضحك حتى تعلم أين قرارها، وأنها لما انصرف الناس وضعت خدها وقالت إنها لم تُشعر قلبها اليأس من ربها؛ ويذكر المحقق أن كحالة نقلها في «أعلام النساء» عن صفة الصفوة."
  en: "A devout woman of Mecca whom Ibn al-Jawzi lists among its devout women in Sifat al-Safwa; through Abu al-Muwarriq he reports her prayers in Mecca and at the standing at Arafa — among them her oath that she would not enjoy laughter until she knew her final abode, and that when the people departed she laid her cheek down and said she had not let despair of her Lord touch her heart; the editor notes that Kahhala took her from this book into A'lam al-Nisa'."
  es: "Una mujer devota de La Meca a quien Ibn al-Jawzi incluye entre sus mujeres devotas en Sifat al-Safwa; a través de Abu al-Muwarriq relata sus oraciones en La Meca y en Arafa, entre ellas su juramento de que no disfrutaría de la risa hasta conocer su morada final, y que cuando la gente se marchó, apoyó la mejilla y dijo que no había dejado que la desesperación de su Señor tocara su corazón; el editor señala que Kahhala la tomó de este libro para incluirla en A'lam al-Nisa'."
  fr: "Une femme pieuse de La Mecque, qu'Ibn al-Jawzi mentionne parmi les femmes pieuses de la ville dans son ouvrage Sifat al-Safwa, rapporte, par l'intermédiaire d'Abu al-Muwarriq, ses prières à La Mecque et lors de la prière à Arafat. Parmi ces prières, on compte son serment de ne pas rire avant de connaître sa demeure finale, et le fait qu'au départ des fidèles, elle posa sa joue contre le sol en disant qu'elle n'avait pas laissé le désespoir de son Seigneur atteindre son cœur. L'éditeur note que Kahhala l'a reprise de ce livre dans A'lam al-Nisa'."
  ur: "مکہ کی ایک پرہیزگار عورت جسے ابن الجوزی نے صفات الصفوی میں اپنی متقی خواتین میں درج کیا ہے۔ ابو المورق کے ذریعے اس نے مکہ میں اور عرفہ میں کھڑے ہونے پر اس کی نماز کی اطلاع دی ہے - ان میں اس کی قسم ہے کہ جب تک وہ اپنے آخری ٹھکانے کو نہیں جان لے گی وہ ہنسی نہیں کرے گی، اور جب لوگ روانہ ہوئے تو اس نے اپنا گال رکھ دیا اور کہا کہ اس نے اپنے رب کی مایوسی کو اپنے دل کو چھونے نہیں دیا۔ ایڈیٹر نوٹ کرتا ہے کہ قہالہ نے اسے اس کتاب سے اعلام النساء میں لے لیا۔"
  tr: "İbn al-Jawzi'nin 'Sifat al-Safwa'da Mekke'deki ibadet edenler arasında bahsettiği Mekke'den bir ibadet eden. Ebu el-Murriq aracılığıyla Mekke'deki ve Arafat'taki Mewqam'daki dualarını anlatır; Kâla'nın nerede olduğunu bilmeden gülmeyeceğine yemin ettiğini, halk ayrıldığında yanağını eğdiğini ve kalbinin Rabbine karşı umutsuzluk hissetmediğini söylediğini belirtir. Doğrulayıcı, Kahala'nın 'A'lam el-Nisa'da seçkinlerin tanımından alıntı yaptığını belirtir."
  id: "Seorang penyembah dari Mekah disebutkan oleh Ibn al-Jawzi dalam 'Sifat al-Safwa' di antara para penyembah Mekah. Ia menceritakan melalui Abu al-Murriq doanya di Mekah dan di Mawqam di Arafat, termasuk bahwa ia bersumpah tidak akan tertawa sampai tahu di mana ia berada, dan ketika orang-orang pergi, ia menundukkan pipi dan berkata ia tidak merasa hatinya putus asa terhadap Tuhannya. Verifier menyebutkan bahwa Kahāla mengutipnya dalam 'A'lam al-Nisa' dari deskripsi para elit."
