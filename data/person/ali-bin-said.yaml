faith:
  - value: ibadi
    basis: documented
    note: "Stated basis, as the lane rule requires for a dynastic attestation: no source fetched names Ali bin Said's personal religion — his own English, Arabic and German articles are all silent on it, and Wikidata carries no religion (P140) statement for him at all. What the sources do attest, twice and independently, is the Ibadi affiliation of the house and of the very sultanate he headed. (1) The English article 'Al Bu Said dynasty' records the house's traditions in its infobox as 'Ibadi Islam', counts the Sultanate of Zanzibar (1856–1964) among the house's realms and its Zanzibar royal family among its branches, and is categorised among Omani Ibadi Muslims. (2) The English article 'Ibadism', a separate article on the school itself resting on Hoffman (2012) and Lewicki (1971), lists among the Ibadi dynasties 'Al Bu Said dynasty: since 1744', with the sub-entry 'Zanzibari branch: 1856–1964' — the exact span within which Ali reigned as the branch's sultan (1890–1893) — records Ibadis as present in Zanzibar, and lists the last Zanzibar sultan, Jamshid bin Abdullah, among notable Ibadis. Corroboration at the family's head: the article on his father records Said bin Sultan's own religion as Ibadi Islam. On that stated basis — the dynasty's attested Ibadi tradition as it applies to the Zanzibar sultanate he himself headed — the value ibadi is recorded. It is NOT a silent dynastic default: readers should note that the attestation is of the house and its Zanzibar branch, not a statement about Ali personally, and the Britannica entry on the dynasty ('Muslim dynasty') does not corroborate the Ibadi point and is not cited for it."
    sources: [source/wikipedia-al-bu-said-dynasty-en, source/wikipedia-ibadism-en, source/wikipedia-said-bin-sultan-en]
