summary:
  ar: "علي بن سعيد البوسعيدي (1854-1893)، رابع سلاطين زنجبار من أسرة آل بوسعيد، حكم من 13 فبراير 1890 حتى وفاته في 5 مارس 1893. في عهده قُسّم ساحل شرق أفريقيا بين بريطانيا وألمانيا، وقبِلت زنجبار الحماية البريطانية، وباع الشريط الساحلي التنزاني لألمانيا، وأجّر موانئ بنادر لإيطاليا، ووضع أول دستور للسلطنة سنة 1891."
  en: "Ali bin Said al-Busaidi (1854–1893), fourth Sultan of Zanzibar of the Al Bu Said dynasty, reigned from 13 February 1890 until his death on 5 March 1893. In his reign the East African coast was divided between Britain and Germany, Zanzibar accepted the British protectorate, he sold the Tanganyika coastal strip to Germany, leased the Benadir ports to Italy, and gave the sultanate its first constitution in 1891."
  ur: "علی بن سعید البوسعیدی (1854-1893)، آل بوسعید خاندان کے زنجبار کے چوتھے سلطان، 13 فروری 1890 سے 5 مارچ 1893 کو اپنی وفات تک حکمران رہے۔ ان کے دور میں مشرقی افریقا کا ساحل برطانیہ اور جرمنی کے درمیان تقسیم ہوا، زنجبار نے برطانوی سرپرستی قبول کی، انہوں نے ساحلی پٹی جرمنی کو فروخت کی، بنادر کی بندرگاہیں اٹلی کو لیز پر دیں، اور 1891 میں سلطنت کا پہلا آئین جاری کیا۔"
