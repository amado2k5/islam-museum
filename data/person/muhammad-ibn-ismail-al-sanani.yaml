summary:
  ar: "محمد بن إسماعيل بن صلاح الكحلاني ثم الصنعاني، المعروف بالأمير، مجتهد يلقب «المؤيد بالله». أخذ عن زيد بن محمد بن الحسن وصلاح بن الحسين الأخفش وعبد الله بن علي الوزير وغيرهم، وصنف «سبل السلام» شرحا لـ«بلوغ المرام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3134}"
  en: "Muhammad ibn Ismail ibn Salah al-Kahlani then al-San'ani, known as al-Amir, a mujtahid titled al-Mu'ayyad billah. He studied with Zayd ibn Muhammad ibn al-Hasan, Salah ibn al-Husayn al-Akhfash, Abd Allah ibn Ali al-Wazir and others, and wrote Subul al-Salam, a commentary on Bulugh al-Maram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3134}"
