summary:
  ar: "أبو نصر عبد الله بن علي بن محمد بن يحيى السراج الطوسي الصوفي، صاحب «كتاب اللمع في التصوف»، من طوس؛ سمع جعفراً الخلدي وأبا بكر محمد بن داود الدقي وأحمد بن محمد السائح، ووصفه السلمي فيما ينقله الذهبي بأنه كان «لسان القوم مع الاستظهار بعلم الشريعة»، وتوفي في رجب سنة 378هـ {cite:luma-sarraj-nicholson-1914 p. 489} {cite:luma-sarraj-nicholson-1914 p. 490}."
  en: "Abu Nasr 'Abd Allah ibn 'Ali ibn Muhammad ibn Yahya al-Sarraj al-Tusi, the Sufi, author of Kitab al-Luma' fi al-Tasawwuf, from Tus; he heard Ja'far al-Khuldi, Abu Bakr Muhammad ibn Dawud al-Duqqi and Ahmad ibn Muhammad al-Sa'ih, and al-Sulami, as al-Dhahabi quotes him, called him 'the tongue of the Sufis, with mastery of the knowledge of the law'; he died in Rajab 378 AH {cite:luma-sarraj-nicholson-1914 p. 489} {cite:luma-sarraj-nicholson-1914 p. 490}."
  ur: "ابو نصر عبد اللہ بن علی بن محمد بن یحییٰ سراج طوسی صوفی، «کتاب اللمع فی التصوف» کے مصنف، طوس کے رہنے والے؛ انہوں نے جعفر خلدی، ابو بکر محمد بن داود دقی اور احمد بن محمد سائح سے سماع کیا، اور ذہبی کی نقل کے مطابق سلمی نے انہیں «شریعت کے علم پر عبور کے ساتھ صوفیہ کی زبان» کہا؛ رجب 378ھ میں وفات پائی {cite:luma-sarraj-nicholson-1914 p. 489} {cite:luma-sarraj-nicholson-1914 p. 490}۔"
