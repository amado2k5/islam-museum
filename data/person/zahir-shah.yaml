summary:
  ar: "آخر ملوك أفغانستان، حكم من 8 نوفمبر 1933 حتى خلعه ابن عمه محمد داود خان في انقلاب 17 يوليو 1973. وُلد في كابل سنة 1914 ابنًا للملك محمد نادر شاه، وعاش منفيا في إيطاليا تسعة وعشرين عاما، ثم عاد إلى أفغانستان سنة 2002 وحمل لقب أب الأمة حتى وفاته في كابل سنة 2007."
  en: "The last king of Afghanistan, reigning from 8 November 1933 until his cousin Mohammad Daoud Khan deposed him in the coup of 17 July 1973. Born at Kabul in 1914, a son of King Mohammad Nadir Shah, he lived twenty-nine years in exile in Italy, returned to Afghanistan in 2002 and held the title Father of the Nation until his death at Kabul in 2007."
  ur: "افغانستان کے آخری بادشاہ، جنھوں نے 8 نومبر 1933ء سے 17 جولائی 1973ء میں اپنے چچا زاد محمد داؤد خان کے ہاتھوں معزولی تک حکومت کی۔ 1914ء میں کابل میں بادشاہ محمد نادر شاہ کے بیٹے پیدا ہوئے، اٹلی میں انتیس سال جلاوطنی گزاری، 2002ء میں افغانستان لوٹے اور 2007ء میں کابل میں وفات تک «بابائے قوم» کا لقب رکھا۔"
