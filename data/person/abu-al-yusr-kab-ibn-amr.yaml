roles: [companion]
gender: male
summary:
  ar: "صحابي سلمي أنصاري، أبو اليسر اسمه كعب بن عمرو؛ عقّبي بدري وهو الذي أسر العباس بن عبد المطلب يوم بدر وانتزع راية المشركين من يد أبي عزيز بن عمير، وشهد صفين مع علي، وتوفي بالمدينة سنة خمس وخمسين."
  en: "A Salimi Ansari Companion, Abu al-Yusr, named Ka'b ibn Amr; Aqabi and Badri, he took al-Abbas ibn Abd al-Muttalib captive at Badr and wrested the mushrikin banner from Abu Aziz ibn Umayr's hand. He witnessed Siffin with Ali and died at Medina in 55 AH."
  ur: "سلمی انصاری صحابی ابو الیسر، نام کعب بن عمرو؛ عقبی اور بدری، بدر میں عباس بن عبد المطلب کو قیدی بنایا اور مسلموں کا سہولت کار رہا۔"
