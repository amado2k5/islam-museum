summary:
  ar: "داعية إسلامي سعودي وإمام جامع حطين بالحرس الوطني في الرياض، وُلد في الرياض سنة 1973، تخرج من كلية الشريعة بجامعة الإمام محمد بن سعود الإسلامية، وطلب العلم على عبد العزيز بن باز ومحمد بن صالح العثيمين وغيرهما، واشتهر بسلاسل دروسه التلفزيونية على قناتي بداية واقرأ وبمحاضراته ودروسه المسجلة."
  en: "Saudi Islamic preacher and imam of the Hatin Mosque of the National Guard in Riyadh, born in Riyadh in 1973. He graduated from the College of Sharia at Imam Muhammad ibn Saud Islamic University, studied under Abd al-Aziz ibn Baz and Muhammad ibn Salih al-Uthaymeen among others, and became known for his televised lesson series on the Bedaya and Iqraa channels and for his recorded lectures and lessons."
  ur: "سعودی اسلامی مبلغ اور ریاض میں نیشنل گارڈ کی حطین مسجد کے امام، جو 1973 میں ریاض میں پیدا ہوئے۔ انہوں نے امام محمد بن سعود اسلامی یونیورسٹی کے کالج آف شریعہ سے گریجویشن کیا، عبد العزیز بن باز اور محمد بن صالح العثیمین سمیت دیگر علما سے علم حاصل کیا، اور بداية اور اقرأ چینلوں پر اپنی ٹیلی ویژن درسی سلسلوں اور ریکارڈ شدہ لیکچرز اور دروس کے لیے جانے گئے۔"
