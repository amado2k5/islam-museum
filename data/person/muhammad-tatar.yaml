summary:
  ar: "السلطان الصالح محمد ططر؛ خلع في خامس عشر ربيع الأول سنة خمس وعشرين وأقام عند السلطان الملك الأشرف مكرماً إلى أن طعن ومات في سابع عشر جمادى الآخرة سنة ثلاث وثلاثين وثمانمائة {cite:shadharat-dhahab p. 204}."
  en: "al-Sultan al-Salih Muhammad Tatar — deposed 15 Rabi' I 825 and kept honoured at al-Ashraf Barsbay's court until the plague took him, 17 Jumada II 833 {cite:shadharat-dhahab p. 204}."
  es: "al-Sultan al-Salih Muhammad Tatar — depuesto el 15 Rabi' I 825 y mantenido honrado en la corte de al-Ashraf Barsbay hasta que la peste lo alcanzó, el 17 Jumada II 833 {cite:shadharat-dhahab p. 204}."
  fr: "al-Sultan al-Salih Muhammad Tatar — déposé le 15 Rabi' I 825 et gardé honoré à la cour d'al-Ashraf Barsbay jusqu'à ce que la peste l'emporte, le 17 Jumada II 833 {cite:shadharat-dhahab p. 204}."
  ur: "السلطان الصالح محمد تاتار - 15 ربیع الثانی 825 کو معزول کیا اور اشرف بارسبے کے دربار میں اس وقت تک تعظیم کرتے رہے جب تک کہ طاعون نے اسے اپنی لپیٹ میں نہ لے لیا، 17 جمادی الثانی 833 {حوالہ: شددرۃ الذہب ص۔ 204}۔"
  tr: "Sultan el-Salih Muhammed Tatar; yirmi beşinci yılda Rabi'al-Awwal'ın on beşinde tahttan indirildi ve Sultan el-Malik el-Eşref'in yanında kaldı; ta ki sekiz yüz otuz üç yılın on yedinci Cuma el-Akhirah'ta bıçaklanıp ölene kadar (atıf:Shadharat-dhahab, s. 204}."
  id: "Sultan al-Salih Muhammad Tatar; digulingkan pada tanggal lima belas Rabi' al-Awwal tahun dua puluh lima dan tinggal bersama Sultan al-Malik al-Ashraf untuk kehormatan hingga ia ditikam dan meninggal pada tanggal tujuh belas Jumada al-Akhirah tahun delapan ratus tiga puluh tiga {cite:shadharat-dhahab, hlm. 204}."
