summary:
  ar: "مغنٍّ وممثل مصري (1929–1977)، لُقّب بـ«العندليب الأسمر» و«ملك الغناء» و«صوت الشعب»؛ أحد أعظم أصوات الغناء العربي في القرن العشرين، إذ غنّى أكثر من ثلاثمائة أغنية ومثّل في ستة عشر فيلمًا، وكانت أغانيه الوطنية صوت ثورة 1952 وعقودها، حتى ردّدتها الجماهير مجددًا في ثورة 2011."
  en: "Egyptian singer and actor (1929–1977), known as al-Andaleeb el-Asmar ('the Dark Nightingale'), 'King of Music' and 'the Voice of the People'. He was one of the greatest Arab singing voices of the twentieth century, recording more than three hundred songs and starring in sixteen films; his patriotic songs became the voice of the 1952 revolution and its decades, and crowds sang them again in the revolution of 2011."
  ur: "مصری گلوکار و اداکار (1929ء–1977ء)، جو «العندلیب الاسمر»، «موسیقی کے بادشاہ» اور «عوام کی آواز» کے القاب سے مشہور ہیں؛ بیسویں صدی کے عظیم ترین عرب گلوکاروں میں سے ایک، جنہوں نے تین سو سے زیادہ گیت گائے اور سولہ فلموں میں اداکاری کی، اور جن کے قومی نغمے 1952 کے انقلاب کی آواز بنے۔"
