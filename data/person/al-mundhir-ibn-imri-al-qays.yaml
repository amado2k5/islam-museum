summary:
  ar: "المنذر بن امرئ القيس اللخمي ملك الحيرة؛ صاحب يوم أوارة الأول حين حلف أن يذبح بكر بن وائل على قلة الجبل حتى يبلغ الدم الحضيض فذبح أسراهم وأحرق نساءهم بالنار {cite:kamil-ibn-al-athir p. 412}."
  en: "Al-Mundhir ibn Imru' al-Qays, the Lakhmid king of al-Hira — the man of the first day of Awara, who swore to slaughter Bakr ibn Wa'il until their blood reached the hill's foot and burned their women {cite:kamil-ibn-al-athir p. 412}."
  fr: "Al-Mundhir ibn Imru' al-Qays, le roi Lakhmid d'al-Hira - l'homme du premier jour d'Awara, qui jura d'abattre Bakr ibn Wa'il jusqu'à ce que leur sang atteigne le pied de la colline et brûle leurs femmes {cite:kamil-ibn-al-athir p. 412}."
  es: "Al-Mundhir ibn Imru' al-Qays, el rey lakhmid de al-Hira, el hombre del primer día de Awara, que juró masacrar a Bakr ibn Wa'il hasta que su sangre llegara al pie de la colina y quemar a sus mujeres {cite:kamil-ibn-al-athir p. 412}."
  ur: "المنذر بن عمرو القیس، حیرہ کا لخمید بادشاہ - آوارہ کے پہلے دن کا آدمی، جس نے بکر بن وائل کو ذبح کرنے کی قسم کھائی یہاں تک کہ ان کا خون پہاڑی کے دامن تک پہنچ گیا اور ان کی عورتوں کو جلا دیا۔ 412}۔"
  tr: "El-Mundhir ibn İmru' el-Kays el-Lakhmi, el-Hirah'ın kralı; Awwara'nın ilk günü yoldaşı, küçük dağda Bakr ibn Va'il'i kan en düşük noktaya ulaşana kadar katleteceğine yemin etmiş, bu yüzden esirlerini katletti ve kadınlarını ateşle yaktı {atıf:kamil-ibn-al-athir s. 412}."
  id: "Al-Mundhir ibn Imru' al-Qais al-Lakhmi, raja al-Hirah; sahabat pada hari pertama Awwara, ketika ia bersumpah akan membantai Bakr ibn Wa'il di gunung kecil sampai darah mencapai titik terendah, maka ia membantai tawanan mereka dan membakar wanita mereka dengan api {cite:kamil-ibn-al-athir hlm. 412}."
