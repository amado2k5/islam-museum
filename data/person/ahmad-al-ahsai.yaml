summary:
  ar: "الشيخ أحمد بن زين الدين الأحسائي، مؤسس المدرسة الشيخية في الإمامية، وُلد في الأحساء سنة 1166هـ/1753م، ودرس في العراق وفارس، وتوفي في الطريق إلى الحج قرب المدينة سنة 1241هـ/1826م عن نحو خمس وسبعين سنة، وقد خلفه السيد كاظم الرشتي، ومن مدرسته نشأت حركة البابية {cite:encyclopaedia-of-islam-2 vol. 1 p. 326}."
  en: "Shaykh Ahmad b. Zayn al-Din al-Ahsa'i, founder of the Shaykhi school within Twelver Shi'ism. Born at al-Ahsa' in Arabia in 1166/1753, he was licensed to teach by Shi'i muditahids in Iraq, lived in Bahrain, Basra and Yazd, and was accused of unorthodoxy over his views on resurrection. He died near Medina on pilgrimage in 1241/1826, aged about 75. His school was led by Sayyid Kazim Rashti, and from it grew the Babi movement {cite:encyclopaedia-of-islam-2 vol. 1 p. 326}."
  fr: "Le cheikh Ahmad b. Zayn al-Din al-Ahsa'i, fondateur de l'école shaykhie au sein du chiisme duodécimain. Né à al-Ahsa en Arabie en 1166 H/1753 ap. J.-C., autorisé à enseigner par les mujtahids chiites d'Irak, il vécut à Bahreïn, Bassora et Yazd et fut accusé d'hétérodoxie pour ses vues sur la résurrection. Il mourut en pèlerinage près de Médine en 1241 H/1826 ap. J.-C., vers soixante-quinze ans. Son école fut dirigée par Sayyid Kazim Rashti, et le mouvement babi en émergea {cite:encyclopaedia-of-islam-2 vol. 1 p. 326}."
  es: "El jeque Ahmad ibn Zayn al-Din al-Ahsa'i, fundador de la escuela Shaykhi dentro del chiismo duodecimano, nació en al-Ahsa', Arabia, en 1166/1753. Fue autorizado para enseñar por muditahids chiíes en Irak, vivió en Baréin, Basora y Yazd, y fue acusado de heterodoxia por sus ideas sobre la resurrección. Falleció cerca de Medina durante una peregrinación en 1241/1826, a la edad de unos 75 años. Su escuela fue dirigida por Sayyid Kazim Rashti, y de ella surgió el movimiento bábí {cite:encyclopaedia-of-islam-2 vol. 1 p. 326}."
