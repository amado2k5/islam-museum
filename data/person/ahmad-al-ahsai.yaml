summary:
  ar: "الشيخ أحمد بن زين الدين الأحسائي، مؤسس المدرسة الشيخية في الإمامية، وُلد في الأحساء سنة 1166هـ/1753م، ودرس في العراق وفارس، وتوفي في الطريق إلى الحج قرب المدينة سنة 1241هـ/1826م عن نحو خمس وسبعين سنة، وقد خلفه السيد كاظم الرشتي، ومن مدرسته نشأت حركة البابية {cite:encyclopaedia-of-islam-2 vol. 1 p. 326}."
  en: "Shaykh Ahmad b. Zayn al-Din al-Ahsa'i, founder of the Shaykhi school within Twelver Shi'ism. Born at al-Ahsa' in Arabia in 1166/1753, he was licensed to teach by Shi'i muditahids in Iraq, lived in Bahrain, Basra and Yazd, and was accused of unorthodoxy over his views on resurrection. He died near Medina on pilgrimage in 1241/1826, aged about 75. His school was led by Sayyid Kazim Rashti, and from it grew the Babi movement {cite:encyclopaedia-of-islam-2 vol. 1 p. 326}."
