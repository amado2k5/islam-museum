summary:
  ar: "قرا يعقوب النكدي الرومي الحنفي نسبة إلى نكدة من بلاد ابن قرمان؛ ولد سنة تسع وثمانين وسبعمائة واشتغل في بلاده ومهر في الأصول والعربية والمعاني والبيان وكتب على المصابيح شرحاً وعلى الهداية حواشي ودخل البلاد الشامية وحج سنة تسع عشرة ثم رجع فأقام بلارندة يدرس ويفتي ثم قدم القاهرة فاجتمع بمدبر المملكة ططر فرأى مهابة كرامة ووصله بمال جزيل فاقتنى كتباً كثيرة ورجع إلى بلاده فأقام بلارندة إلى أن مات فيها في شهر ربيع الأول سنة ثلاث وثلاثين وثمانمائة {cite:shadharat-dhahab p. 207-208}."
  en: "Qara Ya'qub of Nigde in the Qaramanid lands (b. 709) — sharh al-Masabih and hashiya on al-Hidaya; hajj 819, taught at Laranda, was splendidly received by the regent Tatar at Cairo and went home laden with books; died at Laranda Rabi' I 833 {cite:shadharat-dhahab p. 207-208}."
