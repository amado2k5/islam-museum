id: person/al-asha-maymun
class: person
label:
  ar: "الأعشى ميمون بن قيس"
  en: "al-A'sha Maymun b. Qays"
summary:
  ar: "شاعر جاهلي كبير من بكر بن وائل (بني قيس بن ثعلبة)، ولد قبل سنة 570م في دُمنى بواحة المنفوحة جنوب الرياض، وتوفي هناك بعد 625م؛ عُمي في شبابه، فعاش بالشعر والمدائح، وكان على صلة بالحيرة وفارس واليمامة، ومن أهم أحداثه تحريضه على يوم ذي قار {cite:encyclopaedia-of-islam-2 vol. 1 p. 738-739}."
  en: "A prominent pre-Islamic Arab poet of the tribe of Kays b. Tha'laba of Bakr b. Wa'il, born before 570 at Dumna in the Manfuha oasis south of Riyadh and died there after 625. He went blind in the prime of life, lived by panegyric, and was involved in politics; his verse helped bring about the battle of Dhu Qar (605) {cite:encyclopaedia-of-islam-2 vol. 1 p. 738-739}."
