id: person/al-asha-maymun
class: person
label:
  ar: "الأعشى ميمون بن قيس"
  en: "al-A'sha Maymun b. Qays"
  fr: "Al-A’sha Maymun ibn Qays"
  es: "al-A'sha Maymun b. Qays"
  ur: "العشاء میمون ب قیس"
summary:
  ar: "شاعر جاهلي كبير من بكر بن وائل ⁦(بني قيس بن ثعلبة)⁩، ولد قبل سنة 570م في دُمنى بواحة المنفوحة جنوب الرياض، وتوفي هناك بعد 625م؛ عُمي في شبابه، فعاش بالشعر والمدائح، وكان على صلة بالحيرة وفارس واليمامة، ومن أهم أحداثه تحريضه على يوم ذي قار {cite:encyclopaedia-of-islam-2 vol. 1 p. 738-739}."
  en: "A prominent pre-Islamic Arab poet of the tribe of Kays b. Tha'laba of Bakr b. Wa'il, born before 570 at Dumna in the Manfuha oasis south of Riyadh and died there after 625. He went blind in the prime of life, lived by panegyric, and was involved in politics; his verse helped bring about the battle of Dhu Qar (605) {cite:encyclopaedia-of-islam-2 vol. 1 p. 738-739}."
  fr: "Éminent poète arabe préislamique de la tribu des Kays ibn Tha’laba de Bakr ibn Wa’il, né avant 570 à Dumna dans l’oasis de Manfuha au sud de Riyad et mort au même endroit après 625. Devenu aveugle dans la force de l’âge, il vécut du panégyrique et s’impliqua dans la politique ; ses vers contribuèrent à provoquer la bataille de Dhu Qar (605) {cite:encyclopaedia-of-islam-2 vol. 1 p. 738-739}."
  es: "Un destacado poeta árabe preislámico de la tribu de Kays b. Tha'laba de Bakr b. Wa'il, nacido antes del 570 en Dumna, en el oasis de Manfuha, al sur de Riad, y fallecido allí después del 625. Quedó ciego en la flor de la vida, vivió de la alabanza y participó en política; sus versos contribuyeron a la batalla de Dhu Qar (605) {cite:encyclopaedia-of-islam-2 vol. 1 p. 738-739}."
  ur: "قبیلہ قیس کے ایک ممتاز قبل از اسلام عرب شاعر۔ بکر بن ثعلبہ۔ وائل، 570 سے پہلے ریاض کے جنوب میں منفوہا نخلستان میں دمنہ میں پیدا ہوئے اور 625 کے بعد وہیں انتقال کر گئے۔ وہ زندگی کے ابتدائی دور میں نابینا ہو گئے، بے دردی سے زندگی گزاری، اور سیاست میں شامل رہے۔ اس کی آیت نے ذو قار (605) کی جنگ میں مدد کی۔ 1 ص۔ 738-739}۔"
