label:
  ar: علي بن ربيعة بن نضلة
  en: Ali ibn Rabi'ah ibn Nadla al-Kufi (transmitter)
  ur: علی بن ربیعہ بن نضلہ (تابعی)
summary:
  ar: 'علي بن ربيعة بن نضلة، أبو المغيرة، الكوفي البجلي، روى عن علي بن أبي طالب والمغيرة
    بن شعبة وسمرة بن جندب وغيرهم، وعنه الحكم بن عتبة وأبو إسحاق السبيعي وغيرهما، ووثقه
    ابن معين والنسائي والعجلي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7521} '
  en: 'Ali ibn Rabi''ah ibn Nadla, Abu al-Mughira, of Kufa, of the clan of Bajila.
    He narrated from Ali ibn Abi Talib, al-Mughira ibn Shu''ba and Samura ibn Jundub,
    and from him al-Hakam ibn Utba and Abu Ishaq al-Sabi''i, among others; Ibn Ma''in,
    al-Nasa''i and al-Ijli rated him reliable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7521} '
  ur: 'علی بن ربیعہ بن نضلہ، ابوالمغیرہ، کوفی بجلی؛ علی بن ابی طالب، مغیرہ بن شعبہ
    اور سمرہ بن جندب سے روایت کی، اور ان سے حکم بن عتبہ اور ابو اسحاق السبیعی وغیرہ
    نے، اور ابن معین، نسائی اور عجلی نے اسے ثقہ کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7521} '
