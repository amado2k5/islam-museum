summary:
  ar: "أبو عبد الله الحناطي الطبري، من أئمة طبرستان، قدم بغداد في أيام الشيخ أبي حامد الإسفراييني {cite:tabaqat-fuqaha-abbas-1981 p. 62}. لم يذكر الشيرازي تاريخ وفاته، وقدّر المحقق أنها بعد الأربعمائة بقليل أو قبلها بقليل {cite:tabaqat-fuqaha-abbas-1981 p. 62}. ليس هو أبا عبد الله الحناط الشيرازي."
  en: "Abu Abd Allah al-Hannati al-Tabari, one of the imams of Tabaristan, came to Baghdad in the days of Shaykh Abu Hamid al-Isfara'ini {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Al-Shirazi does not give his date of death; the editor estimates it at a little before or a little after the year 400 {cite:tabaqat-fuqaha-abbas-1981 p. 62}. He is not Abu Abd Allah al-Hannat al-Shirazi."
