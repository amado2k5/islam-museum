summary:
  ar: "أبو عبد الله الحناطي الطبري، من أئمة طبرستان، قدم بغداد في أيام الشيخ أبي حامد الإسفراييني {cite:tabaqat-fuqaha-abbas-1981 p. 62}. لم يذكر الشيرازي تاريخ وفاته، وقدّر المحقق أنها بعد الأربعمائة بقليل أو قبلها بقليل {cite:tabaqat-fuqaha-abbas-1981 p. 62}. ليس هو أبا عبد الله الحناط الشيرازي."
  en: "Abu Abd Allah al-Hannati al-Tabari, one of the imams of Tabaristan, came to Baghdad in the days of Shaykh Abu Hamid al-Isfara'ini {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Al-Shirazi does not give his date of death; the editor estimates it at a little before or a little after the year 400 {cite:tabaqat-fuqaha-abbas-1981 p. 62}. He is not Abu Abd Allah al-Hannat al-Shirazi."
  fr: "Abu Abd Allah al-Hannati al-Tabari, l'un des imams du Tabaristan, vint à Bagdad à l'époque du shaykh Abu Hamid al-Isfara'ini {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Al-Shirazi ne donne pas sa date de mort ; l'éditeur l'estime à peu avant ou peu après l'an 400 {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Il n'est pas Abu Abd Allah al-Hannat al-Shirazi."
  es: "Abu Abd Allah al-Hannati al-Tabari, uno de los imanes de Tabaristán, llegó a Bagdad en tiempos del jeque Abu Hamid al-Isfara'ini {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Al-Shirazi no indica su fecha de fallecimiento; el editor la estima un poco antes o un poco después del año 400 {cite:tabaqat-fuqaha-abbas-1981 p. 62}. No se trata de Abu Abd Allah al-Hannat al-Shirazi."
  ur: "ابو عبد اللہ الحناتی الطبری، طبرستان کے ائمہ میں سے ایک، شیخ ابو حامد الاصفرینی کے زمانے میں بغداد آئے۔ 62}۔ الشیرازی نے اپنی تاریخ وفات نہیں بتائی۔ ایڈیٹر نے اس کا اندازہ 400 سے تھوڑا پہلے یا اس کے بعد لگایا ہے۔ 62}۔ وہ ابو عبد اللہ الحنات الشیرازی نہیں ہیں۔"
  tr: "Tabaristan imamlarından biri olan Ebu Abdullah el-Hanati el-Tabari, Şeyh Ebu Hamid el-İsfarayini döneminde Bağdat'a gelmiştir {kaynak: tabaqat-fuqaha-abbas-1981 s. 62}. El-Şirazi onun ölüm tarihini belirtmemiştir ve araştırmacı, ölüm tarihini Hicri 400 yılından kısa bir süre sonra veya kısa bir süre önce olarak tahmin etmektedir {kaynak: tabaqat-fuqaha-abbas-1981 s. 62}. Bu kişi Ebu Abdullah el-Hanati el-Şirazi değildir."
  id: "Abu Abdullah al-Hanati al-Tabari, salah satu imam Tabaristan, datang ke Baghdad pada masa Syekh Abu Hamid al-Isfarayini {cite:tabaqat-fuqaha-abbas-1981 hlm. 62}. Al-Shirazi tidak menyebutkan tanggal kematiannya, dan peneliti memperkirakan itu terjadi tak lama setelah atau tak lama sebelum tahun 400 H {cite:tabaqat-fuqaha-abbas-1981 hlm. 62}. Dia bukanlah Abu Abdullah al-Hanati al-Shirazi."
