summary:
  ar: "صانعة محتوى تقدّم نفسها خبيرة في الزواج وتربية الأبناء حاصلة على ماجستير في علم النفس، وتنشر باسم «الأم المسلمة» (The Muslim Mum) عبر قناتها على يوتيوب نصائح للمسلمين في الغرب ومقابلات مباشرة مع نساء مسلمات ومقاطع تعليق على مناظرات عامة حول الإسلام."
  en: "Content creator who presents herself as a marriage and parenting expert holding a Masters degree in psychology, publishing as 'The Muslim Mum' on YouTube with advice for western Muslims, live interviews with Muslim women, and commentary on public debates about Islam."
  ur: "مواد ساز، جو خود کو شادی اور پرورشِ اطفال کی ماہر اور نفسیات میں ماسٹرز کی حامل بتاتی ہیں؛ «دی مسلم مم» کے نام سے یوٹیوب پر مغربی مسلمانوں کے لیے مشورے، مسلم خواتین سے براہِ راست انٹرویو اور اسلام پر عوامی مباحثوں پر تبصرے شائع کرتی ہیں۔"
  es: "Creadora de contenido que se presenta como experta en matrimonio y crianza de los hijos, con una maestría en psicología, y que publica en YouTube bajo el nombre de 'The Muslim Mum', ofreciendo consejos para musulmanes occidentales, entrevistas en directo con mujeres musulmanas y comentarios sobre debates públicos acerca del Islam."
  fr: "Créatrice de contenu se présentant comme une experte en mariage et en parentalité, titulaire d'une maîtrise en psychologie, publiant sous le nom de « The Muslim Mum » sur YouTube avec des conseils pour les musulmans occidentaux, des interviews en direct avec des femmes musulmanes et des commentaires sur les débats publics concernant l'islam."
  tr: "Bir içerik üreticisi, evlilik ve çocuk yetiştirme konusunda uzman olarak kendini tanıtıyor, psikoloji alanında yüksek lisans derecesine sahip ve YouTube kanalında 'Müslüman Anne' Batı'daki Müslümanlara tavsiyeler, Müslüman kadınlarla canlı röportajlar ve İslam hakkındaki kamuoyu tartışmalarına dair yorum klipleri yayınlıyor."
  id: "Seorang pembuat konten menampilkan dirinya sebagai ahli dalam pernikahan dan pengasuhan anak, memiliki gelar magister psikologi, dan mempublikasikan di kanal YouTube-nya 'The Muslim Mum' nasihat untuk Muslim di Barat, wawancara langsung dengan perempuan Muslim, serta cuplikan komentar tentang debat publik tentang Islam."
