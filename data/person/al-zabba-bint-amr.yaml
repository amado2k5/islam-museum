label: { ar: "الزباء بنت عمرو", en: "al-Zabba bint Amr" }
summary:
  ar: "الزباء بنت عمرو بن ظرب بن حسان بن أذينة بن السميدع بن هوبر، ملكت بعد أبيها وكان ملك من مشارق الشام إلى الفرات من قبل الروم وداره بالمضيق بين الخانوقة وقرقيسيا، وأطمعت جذيمة في نفسها حتى قتلته، ثم دخل عليها قصير في صندوق على بعير من نفق نقبه تحت سريرها فخرج عليها مصلتاً سيفه، فقال بعضهم إنها مصت خاتمها وكان فيه سم ساعة وقالت بيدي لا بيد عمرو، وخربت المدينة وسبيت الذراري {cite:muruj-al-dhahab p. 409-412}."
  en: "The queen who ruled from east Syria to the Euphrates on Rome's behalf from her seat at al-Mudhiq — she trapped and killed Jadhima, then fell to Qusayr's tunnel-and-sarcophagus ruse beneath her throne; she died, some say, sucking a poisoned ring, crying 'by my own hand, not Amr's' {cite:muruj-al-dhahab p. 409-412}."
