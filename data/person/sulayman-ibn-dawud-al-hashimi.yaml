  en: "Sulayman ibn Dawud al-Hashimi"
  ur: "سلیمان بن داؤد ہاشمی"
roles: [scholar]
gender: male
summary:
  ar: "سليمان بن داود بن علي بن عبد الله بن عباس، القرشي الهاشمي أبو أيوب البغدادي، من بيت العباس بن عبد المطلب، روى عن الشافعي وغيره وروى عنه أحمد بن حنبل وغيره. قال أحمد بن حنبل: لو قيل لي اختر للأمة رجلًا استخلفه عليهم لاستخلفت سليمان بن داود الهاشمي، وعن الشافعي: ما رأيت أعقل من هذين الرجلين سليمان بن داود وأحمد بن حنبل. توفي سنة 219، وقيل 220 {cite:tabaqat-shafiiyya-subki p. 263}."
  en: "Sulayman ibn Dawud ibn 'Ali ibn 'Abd Allah ibn 'Abbas, Abu Ayyub al-Qurashi al-Hashimi of Baghdad (d. 219 or 220) — an 'Abbasid of Ibn 'Abbas's own line who studied under al-Shafi'i and transmitted to Ahmad ibn Hanbal. Ahmad said: 'if I were asked to choose one man as caliph over the community I would choose Sulayman b. Dawud al-Hashimi', and al-Shafi'i: 'I never saw two more intelligent men than Sulayman b. Dawud and Ahmad b. Hanbal' {cite:tabaqat-shafiiyya-subki p. 263}."
  ur: "سلیمان بن داؤد بن علی بن عبد اللہ بن عباس، ابو ایوب قرشی ہاشمی بغدادی (مت 219 یا 220ھ) — بنو عباس میں سے؛ امام شافعی کے تلمذ اور احمد بن حنبل کے استاذ۔ احمد کا قول: اگر کہا جائے امت کے لیے شخص چن کر خلافت دوں تو سلیمان بن داؤد ہاشمی کو چنتا؛ شافعی کا قول: سلیمان بن داؤد اور احمد بن حنبل سے بڑھ کر عقل مند دو شخص نہیں دیکھے {cite:tabaqat-shafiiyya-subki p. 263}."
