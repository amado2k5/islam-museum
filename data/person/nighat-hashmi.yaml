summary:
  ar: "عالمة ومعلمة باكستانية في تعليم النساء القرآن، وُلدت في سرغودا سنة 1960، ودرّست في الجامعة الإسلامية ببهاولبور من 1994 إلى 2007، ثم أسّست سنة 1996 مؤسسة النور الدولية التي بدأت بصفوف في بيتها ببهاولبور ونمت إلى شبكة معاهد لتعليم النساء في مدن باكستانية عديدة. ترجمت القرآن إلى الأردية وصنّفت تفسير «القرآن أن أجابا» بصيغة السؤال والجواب، وبلغت قناتها على يوتيوب نحو 205 آلاف مشترك في نوفمبر 2026."
  en: "A Pakistani scholar and teacher of women's Qur'an education, born in Sargodha in 1960. She taught at Islamia University, Bahawalpur, from 1994 to 2007, and in 1996 founded Al-Noor International, which began with classes in her own home in Bahawalpur and grew into a network of institutes teaching women across Pakistani cities. She translated the Qur'an into Urdu and compiled the 'Quran an Ajaba' tafseer in question-and-answer form; her YouTube channel counted some 205,000 subscribers in November 2026."
  ur: "پاکستانی عالمہ اور خواتین کی قرآنی تعلیم کی معلمہ، 1960 میں سرگودھا میں پیدا ہوئیں۔ انہوں نے 1994 سے 2007 تک اسلامیہ یونیورسٹی بہاولپور میں تدریس کی، اور 1996 میں النور انٹرنیشنل کی بنیاد رکھی جو بہاولپور میں ان کے اپنے گھر کی کلاسوں سے شروع ہو کر پاکستانی شہروں میں خواتین کی تعلیم کے اداروں کے جال میں بدل گئی۔ انہوں نے قرآن کا اردو ترجمہ کیا اور «قرآن ان اجابا» تفسیر سوال و جواب کی صورت میں مرتب کی؛ نومبر 2026 میں ان کے یوٹیوب چینل کے تقریباً 205 ہزار سبسکرائبر تھے۔"
  es: "Erudita y profesora pakistaní de educación coránica para mujeres, nacida en Sargodha en 1960. Impartió clases en la Universidad Islamia de Bahawalpur de 1994 a 2007, y en 1996 fundó Al-Noor International, que comenzó con clases en su propia casa en Bahawalpur y se convirtió en una red de institutos que imparten enseñanza a mujeres en diversas ciudades de Pakistán. Tradujo el Corán al urdu y compiló el tafsir «Quran an Ajaba» en formato de preguntas y respuestas; su canal de YouTube contaba con unos 205 000 suscriptores en noviembre de 2026."
  fr: "Érudite et enseignante pakistanaise spécialisée dans l'étude du Coran pour les femmes, née à Sargodha en 1960, elle a enseigné à l'Université Islamia de Bahawalpur de 1994 à 2007. En 1996, elle a fondé Al-Noor International, qui a débuté par des cours à son domicile à Bahawalpur et s'est développé en un réseau d'instituts dispensant des cours aux femmes dans plusieurs villes du Pakistan. Elle a traduit le Coran en ourdou et compilé le tafsir « Quran an Ajaba » sous forme de questions-réponses. Sa chaîne YouTube comptait environ 205 000 abonnés en novembre 2026."
  tr: "1960'ta Sargoda'da doğan Pakistanlı bir akademisyen ve öğretmen olan Bahawalpur İslam Üniversitesi'nde eğitim gördü, ardından 1996'da Noor International Foundation'u kurdu; bu vakf, Bahawalpur'daki evinde derslerle başladı ve birçok Pakistan şehrinde kadın eğitimi için bir enstitü ağına dönüştü. Kur'an'ı Urduca'ya çevirdi ve 'Kur'an An Ajaba' yorumunu soru-cevap formatında sınıflandırdı; YouTube kanalı Kasım 2026'da yaklaşık 205.000 aboneye ulaştı."
  id: "Seorang ulama dan guru Pakistan yang mengajar perempuan Al-Quran, lahir di Sargoda pada tahun 1960, belajar di Universitas Islam Bahawalpur dari tahun 1994 hingga 2007, kemudian mendirikan Noor International Foundation pada tahun 1996, yang dimulai dengan kelas di rumahnya di Bahawalpur dan berkembang menjadi jaringan institut pendidikan perempuan di banyak kota Pakistan. Ia menerjemahkan Al-Qur'an ke dalam bahasa Urdu dan mengklasifikasikan penafsiran 'Al-Quran An Ajaba' dalam format tanya jawab, dan saluran YouTube-nya mencapai sekitar 205.000 pelanggan pada November 2026."
