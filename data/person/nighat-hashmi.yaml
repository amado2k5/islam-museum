summary:
  ar: "عالمة ومعلمة باكستانية في تعليم النساء القرآن، وُلدت في سرغودا سنة 1960، ودرّست في الجامعة الإسلامية ببهاولبور من 1994 إلى 2007، ثم أسّست سنة 1996 مؤسسة النور الدولية التي بدأت بصفوف في بيتها ببهاولبور ونمت إلى شبكة معاهد لتعليم النساء في مدن باكستانية عديدة. ترجمت القرآن إلى الأردية وصنّفت تفسير «القرآن أن أجابا» بصيغة السؤال والجواب، وبلغت قناتها على يوتيوب نحو 205 آلاف مشترك في نوفمبر 2026."
  en: "A Pakistani scholar and teacher of women's Qur'an education, born in Sargodha in 1960. She taught at Islamia University, Bahawalpur, from 1994 to 2007, and in 1996 founded Al-Noor International, which began with classes in her own home in Bahawalpur and grew into a network of institutes teaching women across Pakistani cities. She translated the Qur'an into Urdu and compiled the 'Quran an Ajaba' tafseer in question-and-answer form; her YouTube channel counted some 205,000 subscribers in November 2026."
  ur: "پاکستانی عالمہ اور خواتین کی قرآنی تعلیم کی معلمہ، 1960 میں سرگودھا میں پیدا ہوئیں۔ انہوں نے 1994 سے 2007 تک اسلامیہ یونیورسٹی بہاولپور میں تدریس کی، اور 1996 میں النور انٹرنیشنل کی بنیاد رکھی جو بہاولپور میں ان کے اپنے گھر کی کلاسوں سے شروع ہو کر پاکستانی شہروں میں خواتین کی تعلیم کے اداروں کے جال میں بدل گئی۔ انہوں نے قرآن کا اردو ترجمہ کیا اور «قرآن ان اجابا» تفسیر سوال و جواب کی صورت میں مرتب کی؛ نومبر 2026 میں ان کے یوٹیوب چینل کے تقریباً 205 ہزار سبسکرائبر تھے۔"
