summary:
  ar: "جابر الأحمد الجابر الصباح (29 يونيو 1926 – 15 يناير 2006) أمير الكويت الثالث عشر من 31 ديسمبر 1977 حتى وفاته، وثالث أمير بعد الاستقلال. كان وزيرًا للمالية (1962–1965) ورئيسًا للوزراء (1965–1978) قبل الإمارة. نجا من محاولة اغتيال سنة 1985، وقاد حكومته في المنفى بالسعودية أثناء الاحتلال العراقي 1990–1991 حتى التحرير، وعاد إلى الكويت في مارس 1991."
  en: "Jaber Al-Ahmad Al-Jaber Al-Sabah (29 June 1926 – 15 January 2006) was the thirteenth Emir of Kuwait from 31 December 1977 until his death, and the third Emir since independence. He had been minister of finance (1962–1965) and prime minister (1965–1978) before the emirate. He survived an assassination attempt in 1985, led his government in exile in Saudi Arabia during the Iraqi occupation of 1990–1991 until the liberation, and returned to Kuwait in March 1991."
  ur: "جابر الاحمد الجابر الصباح (29 جون 1926ء – 15 جنوری 2006ء) 31 دسمبر 1977ء سے اپنی وفات تک کویت کے تیرہویں امیر رہے۔ اس سے پہلے وزیرِ خزانہ (1962ء تا 1965ء) اور وزیر اعظم (1965ء تا 1978ء) رہے۔ 1985ء میں قاتلانہ حملے میں محفوظ رہے اور 1990ء تا 1991ء عراقی قبضے کے دوران سعودی عرب میں جلاوطنی سے حکومت چلائی۔"
