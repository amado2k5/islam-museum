roles: [scholar]
gender: male
summary:
  ar: "عبد الله بن الصامت أبو النضر الغفاري البصري، من التابعين ومحدثيهم، روى عن عمه أبي ذر وعمر وعثمان والحكم وحذيفة وابن عمر وعائشة وغيرهم، وروى عنه حميد بن هلال وأبو العالية البراء وأبو عمران الجوني وأبو عبد الله الحربي وغيرهم. قال النسائي وابن سعد إنه ثقة، وقال العجلي تابعي بصري ثقة، وقال أبو حاتم حديثه يكتب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13759}. وتاريخ وفاته في الكتاب بين السبعين والثمانين للهجرة."
  en: "Abd Allah ibn al-Samit, Abu al-Nadr al-Ghifari al-Basri, a Follower and a hadith transmitter. He narrated from his paternal uncle Abu Dhar, Umar, Uthman, al-Hakam, Hudhayfa, Ibn Umar and Aisha, and Humayd ibn Hilal, Abu al-Aliya al-Bara, Abu Imran al-Jawni and Abu Abd Allah al-Harbi narrated from him. Al-Nasa'i and Ibn Sa'd call him trustworthy, al-Ijli a trustworthy Basran Follower, and Abu Hatim says his hadith is written down {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13759}. The book gives his death between the seventies and eighties AH."
  ur: "عبداللہ بن الصامت، ابو النضر غفاری بصری، تابعین اور محدثین میں سے۔ انہوں نے اپنے چچا ابو ذر، عمر، عثمان، حکم، حذیفہ، ابن عمر اور عائشہ وغیرہم سے روایت کی، اور ان سے حمید بن ہلال، ابو العالیہ البراء، ابو عمران الجونی اور ابو عبداللہ الحربی نے روایت کی۔ نسائی اور ابن سعد نے انہیں ثقہ کہا، عجلی نے بصری ثقہ تابعی کہا، اور ابو حاتم کے نزدیک ان کی حدیث لکھی جائے گی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13759}۔ کتاب ان کی وفات ستر سے اسی ہجری کے درمیان بتاتی ہے۔"
