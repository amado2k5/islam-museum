id: person/al-hakam-i-andalusi
class: person
label: { ar: "الحكم الأول بن هشام", en: "al-Hakam I ibn Hisham", fr: "Al-Hakam Ier ibn Hisham", es: "al-Hakam I ibn Hisham", ur: "الحکم اول ابن ہشام" }
summary:
  ar: "رابع أمراء بني أمية بقرطبة ⁦(سنة ١٨٠–٢٠٦هـ)⁩؛ أول من جنّد بالأندلس الأجناد واتخذ المماليك حتى بلغوا خمسة آلاف منهم ثلاثة آلاف فارس وألفا راجل، وأول من جعل للملك بالأندلس أبهة، وكان أفحل بني أمية بها وأشدهم إقداماً ونجدة يشبه بأبي جعفر المنصور في شدة الملك وقمع الأعداء {cite:nafh-tib-maqqari pp. 374–377}. وكانت له واقعة الربض الشهيرة التي خلعه فيها أهل العلم بقرطبة فقاتلهم وهدم دورهم ومساجدهم فلحقوا بفاس والإسكندرية ثم أقريطش {cite:nafh-tib-maqqari p. 375}. وفي أيامه قصد الفرنج برشلونة فملكوها سنة ١٨٥هـ، وسار بنفسه سنة ١٩٦هـ فافتتح الثغور والحصون وأثخن في القتل والسبي {cite:nafh-tib-maqqari pp. 375–376}. وكان يؤثر الفقيه زياد بن عبد الرحمن شبطون أول من أدخل الأندلس فقه مالك، وفي سنة المجاعة ١٩٧هـ أكثر مواساة أهل الحاجات، ونقش خاتمه: بالله يثق الحكم ويعتصم."
  en: "Fourth Umayyad emir of Córdoba (AH 180–206): first to raise a standing army of mamlūks in al-Andalus — five thousand, three thousand of them horse — and first to give Andalusi kingship its majesty; likened to Abu Ja'far al-Mansur for stern rule. His reign held the Rabad revolt, Barcelona's loss to the Franks in AH 185, and the seal inscription 'in God al-Hakam trusts' {cite:nafh-tib-maqqari pp. 374–377}."
  fr: "Quatrième émir omeyyade de Cordoue (180–206 H) : premier à lever une armée permanente de mamelouks en al-Andalus, cinq mille dont trois mille cavaliers, et premier à donner sa majesté à la royauté andalouse ; comparé à Abu Ja’far al-Mansur pour sa sévérité. Son règne vit la révolte du Rabad, la perte de Barcelone au profit des Francs en 185 H et l’inscription du sceau « En Dieu al-Hakam place sa confiance » {cite:nafh-tib-maqqari pp. 374–377}."
  es: "Cuarto emir omeya de Córdoba (180-206 d. H.): fue el primero en formar un ejército permanente de mamelucos en al-Ándalus —cinco mil, tres mil de ellos a caballo— y el primero en otorgarle a la monarquía andalusí su majestad; comparado con Abu Ja'far al-Mansur por su gobierno severo. Durante su reinado tuvo lugar la revuelta de Rabad, la pérdida de Barcelona ante los francos en el año 185 d. H. y la inscripción del sello «en Dios confía al-Hakam» {cite:nafh-tib-maqqari pp. 374-377}."
  ur: "قرطبہ کا چوتھا اموی امیر ⁦(ھ 180-206)⁩: سب سے پہلے الاندلس میں مملوکوں کی ایک کھڑی فوج کو کھڑا کرنے کے لئے - پانچ ہزار، جن میں سے تین ہزار گھوڑے تھے - اور سب سے پہلے اندلس کی بادشاہی کو اس کی شان عطا کرنا؛ سخت حکمرانی کے لیے ابو جعفر المنصور سے تشبیہ دی۔ اس کے دور حکومت میں رباد کی بغاوت، 185ھ میں فرینکوں کے ہاتھوں بارسلونا کی شکست، اور مہر ثبت 'خدا الحکم ٹرسٹس' پر مشتمل تھی۔"
