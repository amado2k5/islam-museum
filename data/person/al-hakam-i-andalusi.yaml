id: person/al-hakam-i-andalusi
class: person
label: { ar: "الحكم الأول بن هشام" }
summary:
  ar: "رابع أمراء بني أمية بقرطبة (سنة ١٨٠–٢٠٦هـ)؛ أول من جنّد بالأندلس الأجناد واتخذ المماليك حتى بلغوا خمسة آلاف منهم ثلاثة آلاف فارس وألفا راجل، وأول من جعل للملك بالأندلس أبهة، وكان أفحل بني أمية بها وأشدهم إقداماً ونجدة يشبه بأبي جعفر المنصور في شدة الملك وقمع الأعداء {cite:nafh-tib-maqqari pp. 374–377}. وكانت له واقعة الربض الشهيرة التي خلعه فيها أهل العلم بقرطبة فقاتلهم وهدم دورهم ومساجدهم فلحقوا بفاس والإسكندرية ثم أقريطش {cite:nafh-tib-maqqari p. 375}. وفي أيامه قصد الفرنج برشلونة فملكوها سنة ١٨٥هـ، وسار بنفسه سنة ١٩٦هـ فافتتح الثغور والحصون وأثخن في القتل والسبي {cite:nafh-tib-maqqari pp. 375–376}. وكان يؤثر الفقيه زياد بن عبد الرحمن شبطون أول من أدخل الأندلس فقه مالك، وفي سنة المجاعة ١٩٧هـ أكثر مواساة أهل الحاجات، ونقش خاتمه: بالله يثق الحكم ويعتصم."
  en: "Fourth Umayyad emir of Córdoba (AH 180–206): first to raise a standing army of mamlūks in al-Andalus — five thousand, three thousand of them horse — and first to give Andalusi kingship its majesty; likened to Abu Ja'far al-Mansur for stern rule. His reign held the Rabad revolt, Barcelona's loss to the Franks in AH 185, and the seal inscription 'in God al-Hakam trusts' {cite:nafh-tib-maqqari pp. 374–377}."
