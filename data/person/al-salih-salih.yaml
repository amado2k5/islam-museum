roles: [ruler]
gender: male
summary:
  ar: "صالح بن محمد بن قلاوون، الملك الصالح بن الناصر بن المنصور، المعروف بابن التنكزية لأن أمه بنت تنكز نائب الشام، ولي سلطنة مصر بعد خلع الناصر حسن في جمادى الآخرة سنة 752 هـ وخلع في شوال سنة 755 هـ ومات محبوساً بالقلعة في صفر سنة 762 هـ ولم يكمل أربعاً وعشرين سنة {cite:durar-kamina-hyderabad-1972 vol. 2 p. 361}."
  en: "Salih ibn Muhammad ibn Qalawun, al-Malik al-Salih, son of al-Nasir and known as Ibn al-Tankiziyya because his mother was a daughter of Tankiz, governor of Syria; he took the sultanate after al-Nasir Hasan was deposed in Jumada II 752 AH, was himself deposed in Shawwal 755 AH and died a prisoner in the citadel in Safar 762 AH, before completing twenty-four years {cite:durar-kamina-hyderabad-1972 vol. 2 p. 361}."
  fr: "Salih ibn Muhammad ibn Qalawun, al-Malik al-Salih, fils d’al-Nasir et connu sous le nom d’Ibn al-Tankiziyya parce que sa mère était une fille de Tankiz, gouverneur de Syrie ; Il a pris le sultanat après al-Nasir Hasan a été déposé en Jumada II 752 de l’hégire, a lui-même été déposé à Shawwal 755 de l’hégire et est mort prisonnier dans la citadelle de Safar 762 de l’hégire, avant d'achever vingt-quatre ans {cite:durar-kamina-hyderabad-1972 vol. 2 p. 361}."
  es: "Salih ibn Muhammad ibn Qalawun, al-Malik al-Salih, hijo de al-Nasir y conocido como Ibn al-Tankiziyya porque su madre era hija de Tankiz, gobernador de Siria; tomó el sultanato después de que al-Nasir Hasan fuera depuesto en Jumada II 752 AH, fue depuesto él mismo en Shawwal 755 AH y murió prisionero en la ciudadela en Safar 762 AH, antes de cumplir veinticuatro años {cite:durar-kamina-hyderabad-1972 vol. 2 p. 361}."
