summary:
  ar: "فارس من بني كلاب، كان مع الضحاك بن قيس في مرج راهط، فلما أمعن السيف في قومه ولّى وترك صاحبيه من بني سليم فقُتلا؛ وقال في ذلك أبياتاً {cite:muruj-mari-2005 juz' 3 p. 77}."
  en: "A horseman of the Banu Kilab who fought with al-Dahhak ibn Qays at Marj Rahit. When his side broke he fled and left two Banu Sulaym companions, who were killed; he later wrote verses about it {cite:muruj-mari-2005 juz' 3 p. 77}."
