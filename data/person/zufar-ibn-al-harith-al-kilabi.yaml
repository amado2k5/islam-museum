id: person/zufar-ibn-al-harith-al-kilabi
class: person
label: { ar: "زفر بن الحارث الكلابي", en: "Zufar ibn al-Harith al-Kilabi", es: "Zufar ibn al-Harith al-Kilabi", fr: "Zufar ibn al-Harith al-Kilabi", ur: "ظفر بن الحارث الکلبی" }
gender: male
roles: [commander, poet]
summary:
  ar: "فارس من بني كلاب، كان مع الضحاك بن قيس في مرج راهط، فلما أمعن السيف في قومه ولّى وترك صاحبيه من بني سليم فقُتلا؛ وقال في ذلك أبياتاً {cite:muruj-mari-2005 juz' 3 p. 77}."
  en: "A horseman of the Banu Kilab who fought with al-Dahhak ibn Qays at Marj Rahit. When his side broke he fled and left two Banu Sulaym companions, who were killed; he later wrote verses about it {cite:muruj-mari-2005 juz' 3 p. 77}."
  es: "Un jinete de los Banu Kilab que luchó con al-Dahhak ibn Qays en Marj Rahit. Cuando su flanco se rompió, huyó dejando atrás a dos compañeros Banu Sulaym, que murieron; más tarde escribió versos al respecto {cite:muruj-mari-2005 juz' 3 p. 77}."
  fr: "Un cavalier des Banu Kilab qui combattit aux côtés d'al-Dahhak ibn Qays à Marj Rahit. Lorsque son camp céda, il s'enfuit, abandonnant deux compagnons Banu Sulaym qui furent tués; il écrivit plus tard des vers à ce sujet {cite:muruj-mari-2005 juz' 3 p. 77}."
  ur: "بنو کلاب کا ایک گھڑ سوار جس نے مرج رہت میں ضحاک بن قیس سے جنگ کی۔ جب اس کا پہلو ٹوٹ گیا تو وہ بھاگ گیا اور بنو سلیم کے دو ساتھیوں کو چھوڑ دیا جو مارے گئے تھے۔ اس نے بعد میں اس کے بارے میں آیات لکھیں {حوالہ دیں: muruj-mari-2005 juz' 3 p. 77}۔"
  tr: "Banu Kilab'dan bir şövalye, Rahit ovasında el-Dahhak bin Kays ile birlikteydi. Kılıç halkına karşı keskinleştirildiğinde kaçtı ve Banu Süleym'den iki yoldaşını geride bırakıp onları öldürdü; bununla ilgili ayetler okudu {cite:muruj-mari-2005 juz' 3 s. 77}."
  id: "Seorang ksatria dari Banu Kilab, yang bersama al-Dahhak ibn Qays di dataran Rahit. Ketika pedang diasah melawan rakyatnya, ia melarikan diri dan meninggalkan dua rekannya dari Banu Sulaym di belakang, membunuh mereka; ia membacakan bait-bait tentang ini {cite:muruj-mari-2005 juz' 3 hlm. 77}."
