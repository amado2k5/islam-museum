  ar: "بطاقة أولية لدولت خاتون، زوج بايزيد الأول وأم محمد الأول جلبي، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Devlet Hatun, consort of Bayezid I and mother of Mehmed I, named from an open reference description (Wikidata); her entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Devlet Hatun, consorte de Bayezid I y madre de Mehmed I, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de projet pour Devlet Hatun, épouse de Bayezid Ier et mère de Mehmed Ier, nommée d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "ڈیولٹ ہاتون کے لیے ڈرافٹ کارڈ، بایزید اول کی ہمشیرہ اور محمد اول کی والدہ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Bayezid I'in eşi ve Mehmed I Çelebi'nin annesi Dawlat Hatun'un ön kartı, açık bir referans açıklamasında (Wikidata) bahsedilmiştir. Al-Sallabinin Osmanlı Devleti Tarihi adlı eserindeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Dawlat Hatun, suami Bayezid I dan ibu Mehmed I Çelebi, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam The History of the Ottoman State oleh Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
