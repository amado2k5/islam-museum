  ar: "سياسي روسي شيشاني، وُلد سنة 1976 في تسينتاروي. رئيس جمهورية الشيشان منذ سنة 2007 خلفًا لعهد والده أحمد قديروف، ومن أكثر القادة الإقليميين إثارة للجدل في روسيا الاتحادية."
