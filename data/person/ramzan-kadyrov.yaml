  es: "Político checheno ruso, nacido en 1976 en Tsentaroy. Jefe de la República Chechena desde 2007, sucediendo a su padre, Akhmad Kadyrov, y uno de los líderes regionales más controvertidos de la Federación Rusa."
  fr: "Homme politique tchétchène russe, né en 1976 à Tsentaroy. Chef de la République tchétchène depuis 2007, succédant à son père Akhmad Kadyrov, et l'un des dirigeants régionaux les plus controversés de la Fédération de Russie."
