summary:
  ar: "الصاحب الكبير؛ كان تاجراً فلما أخذت التتار بغداد حضر إلى الشام فتولى البيعية بدار الوكالة ثم ضمنها في أيام الظاهر، وخدم المنصور وأقرضه ستين ألفاً بلا فائدة فلما تولى المنصور أطلق له دار الوكالة وما كان عليه مكسوراً — مائة ألف درهم — وولاه كتابة الخزانة ثم نقله إلى وزارة الشام، وتوزر لخمسة ملوك: الأشرف والمنصور والعادل كتبغا ولاجين والناصر {cite:shadharat-dhahab p. 771}."
  en: "The great sahib — a merchant who, lending al-Mansur sixty thousand gratis, rose to the khizana and then Syria's vizierate; served five sultans: al-Ashraf, al-Mansur, al-Adil Kitbugha, Lajin, al-Nasir {cite:shadharat-dhahab p. 771}."
