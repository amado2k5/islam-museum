  ar: "لاعب كرة قدم مغربي سابق ومدرب (وُلد سنة 1971 في إفران الأطلس الصغير)، لاعب وسط اختير أفضل لاعب أفريقي سنة 1998 بعد مشاركته في كأسَي العالم 1994 و1998، ولعب في فرنسا والبرتغال وإسبانيا وإنجلترا والإمارات وألمانيا ولوكسمبورغ، ثم عمل مساعداً لمدرب منتخب المغرب."
  en: "Moroccan former footballer and coach (born 1971 in Ifrane Atlas-Saghir), a midfielder named African Footballer of the Year in 1998 after playing at the 1994 and 1998 World Cups; he played in France, Portugal, Spain, England, the Emirates, Germany and Luxembourg, and later served as Morocco's assistant coach."
