summary:
  ar: "موسى بن علي بن رباح اللخمي المصري، أبو عبد الرحمن، حافظ ثقة وأمير عادل ونائب المنصور على مصر سنوات؛ ولد بإفريقية نحو سنة ٩٠هـ وتوفي بالإسكندرية سنة ١٦٣هـ."
  en: "Musa ibn Ulayy ibn Rabah al-Lakhmi of Egypt, Abu Abd al-Rahman, a reliable memoriser and just governor who deputised for al-Mansur over Egypt for some years; born in Ifriqiya about 90 AH and died at Alexandria in 163 AH."
  es: "Musa ibn Ulayy ibn Rabah al-Lakhmi de Egipto, Abu Abd al-Rahman, un memorizador fiable y gobernador justo que fue el representante de al-Mansur en Egipto durante algunos años; nació en Ifriqiya alrededor del año 90 AH y murió en Alejandría en el año 163 AH."
  fr: "Musa ibn Ulayy ibn Rabah al-Lakhmi d'Égypte, Abu Abd al-Rahman, un mémorisateur fiable et un gouverneur juste qui a suppléé al-Mansur sur l'Égypte pendant quelques années; né à Ifriqiya vers 90 AH et mort à Alexandrie en 163 AH."
  ur: "مصر کے موسیٰ بن الیٰ بن رباح الخمی، ابو عبدالرحمٰن، ایک قابل بھروسہ حافظ اور منصف گورنر جنہوں نے کچھ سالوں تک مصر پر المنصور کی تعیناتی کی۔ تقریباً 90 ہجری میں افریقیہ میں پیدا ہوئے اور 163 ہجری میں اسکندریہ میں وفات پائی۔"
  tr: "Musa ibn Ali ibn Rabah al-Lakhmi al-Masri, Ebu Abd al-Rahman, yıllarca Mısır'da güvenilir bir vasi, adil prens ve vekil; yaklaşık 90 Hicri yılında Ifriqiya'da doğdu ve 163 Hicri'de İskenderiye'de öldü."
  id: "Musa ibn Ali ibn Rabah al-Lakhmi al-Masri, Abu Abd al-Rahman, seorang wali yang dapat dipercaya, pangeran yang adil, dan wakil al-Mansur atas Mesir selama bertahun-tahun; lahir di Ifriqiya sekitar tahun 90 H dan meninggal di Alexandria pada tahun 163 H."
