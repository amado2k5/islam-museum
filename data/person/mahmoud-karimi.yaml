summary:
  ar: "مداح إيراني من طهران، وُلد في حي نظام آباد سنة 1968، وهو من أشهر مداحي إيران؛ يكتب معظم نوحه بنفسه ويقود هيئة «راية العباس» في تشيذر شمالي طهران، ويحيي مجالس محرم والفاطمية ومنها مجالس حضرها المرشد الأعلى علي خامنئي؛ وأظهرت صفحة عدّاد حسابه الرسمي على إنستغرام ⁦(@mahmuudkarimi)⁩ لدى إنستاستاتيستكس 439,090 متابع عند قراءتها في نوفمبر 2026."
  en: "Iranian maddah from Tehran, born in the Nezamabad area in 1968 and among Iran's best-known eulogists; he writes much of his own verse, leads the Rayat al-Abbas hey'at at Chizar in northern Tehran, and performs at Muharram and Fatimiyya ceremonies including ceremonies attended by Supreme Leader Ali Khamenei; the instastatistics counter page for his official Instagram account (@mahmuudkarimi) showed 439,090 followers when read in November 2026."
  ur: "تہران سے تعلق رکھنے والے ایرانی مداح، جو 1968ء میں نظام آباد کے علاقے میں پیدا ہوئے اور ایران کے مشہور ترین مداحوں میں سے ہیں؛ وہ اپنے بیشتر نوحے خود لکھتے ہیں، شمالی تہران کے چیذر میں «رایة العباس» ہیئت کی قیادت کرتے ہیں، اور محرم و فاطمیہ کی مجالس میں پڑھتے ہیں جن میں رہبر اعلیٰ علی خامنہ ای بھی شریک ہوتے ہیں؛ ان کے سرکاری انسٹاگرام اکاؤنٹ ⁦(@mahmuudkarimi)⁩ کی انسٹاسٹیٹسٹکس کاؤنٹر صفحہ نے نومبر 2026ء میں پڑھے جانے پر 439,090 فالوور دکھائے۔"
