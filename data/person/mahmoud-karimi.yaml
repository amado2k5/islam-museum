  source: "The wave-194 harvest entry (Mahmoud Karimi, Iran; Instagram @mahmuudkarimi, harvest reach 439,090 per instastatistics, crawl ~Jun 2026), researched against the English, Persian, Arabic and Swedish Wikipedia articles on Mahmoud Karimi (maddah) and the instastatistics live-counter page for @mahmuudkarimi, all read in full on 7 November 2026. COUNT AND DISCREPANCY: the counter page read today showed 439,090 followers, 10 following and 2,115 posts, and its reproduction of the account bio identifies the account as the Rayat al-Abbas media set, admin-run, publishing his works and sessions — the official account named in the harvest. The page copy available today was crawled on 10 June 2026, so 439,090 is the latest tracker figure obtainable today, not a same-day crawl; it is carried as the record's dated figure. The 2025 maddah-ranking screenshots in the harvest read the same handle at 622K–771K; that disagreement is recorded in full in the instastatistics source's reliability_note and no reconciliation was obtainable. NAMESAKE DISAMBIGUATION: this is Mahmoud Karimi the maddah (born 1968, Tehran) — not Mahmoud Karimi Sibaki, the retired Sepahan footballer born 9 May 1978 in Isfahan, and not the traditional singer Mahmoud Karimi (1927–1984). BORN DATE: Persian Wikipedia gives 23 Khordad 1347 = 13 June 1968; the current English article gives only 1968 (an older English revision's 13 June 1968 agrees), so the day rests on the Persian article, flagged in the born note. The English article's statement that his brother was killed in 1986 is consistent with Persian Wikipedia's Operation Karbala-5 (1365). No Wikidata item for the maddah could be verified by opening an item — searches surfaced only the footballer's and other namesakes' items — so no wikidata id is recorded. No place record for Tehran exists in the tree, so no place edges are written; his first recitation at Shahin Shahr, near Isfahan, is stated in prose only. De-duplicated against main: no mahmoud-karimi person record exists."
