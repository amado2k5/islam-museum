summary:
  ar: "عالم مسلم بريطاني من أصل فلسطيني، نشأ في مكة؛ نال الدكتوراه من كلية الدراسات الشرقية والأفريقية (SOAS) بجامعة لندن بأطروحة قُدمت سنة 2010 في جوانب من فقه الأقليات المسلمة، وحصل على شهادة في الهندسة المدنية في السودان ودرس في المدينة المنورة؛ وهو رئيس مؤسسة البحوث والتنمية الإسلامية (MRDF) ومستشارها التشغيلي وأحد أمنائها، ويجلس في المجلس الاستشاري للمجلس الشرعي الإسلامي في بريطانيا، ويظهر مقدما ومحاضرا في القنوات التلفزيونية الإسلامية."
  en: "British Muslim scholar of Palestinian origin who grew up in Makkah; he took a PhD at SOAS, University of London, with a thesis submitted in 2010 on aspects of Sunni Muslim minority fiqh, holds a civil engineering degree from Sudan and studied in Medina; he is chair, operations advisor and a trustee of the Muslim Research and Development Foundation (MRDF), sits on the board of advisors of the Islamic Sharia Council in Britain, and appears as a television presenter and lecturer on Islamic channels."
  ur: "فلسطینی نژاد برطانوی مسلم عالم، مکہ میں پرورش پائی؛ انہوں نے SOAS، جامعہ لندن سے پی ایچ ڈی کی جس کا مقالہ 2010 میں سنی مسلم اقلیتی فقہ کے منتخب پہلوؤں پر پیش کیا گیا، سوڈان سے سول انجینئرنگ کی ڈگری حاصل کی اور مدینہ منورہ میں تعلیم پائی؛ وہ مسلم ریسرچ اینڈ ڈیولپمنٹ فاؤنڈیشن (MRDF) کے چیئر، آپریشنز ایڈوائزر اور ٹرسٹی ہیں، برطانیہ کی اسلامک شریعہ کونسل کے مشاورتی بورڈ کے رکن ہیں، اور اسلامی ٹی وی چینلز پر پیش کار و مقرر کے طور پر نمودار ہوتے ہیں۔"
