summary:
  ar: "عالم مسلم بريطاني من أصل فلسطيني، نشأ في مكة؛ نال الدكتوراه من كلية الدراسات الشرقية والأفريقية (SOAS) بجامعة لندن بأطروحة قُدمت سنة 2010 في جوانب من فقه الأقليات المسلمة، وحصل على شهادة في الهندسة المدنية في السودان ودرس في المدينة المنورة؛ وهو رئيس مؤسسة البحوث والتنمية الإسلامية (MRDF) ومستشارها التشغيلي وأحد أمنائها، ويجلس في المجلس الاستشاري للمجلس الشرعي الإسلامي في بريطانيا، ويظهر مقدما ومحاضرا في القنوات التلفزيونية الإسلامية."
  en: "British Muslim scholar of Palestinian origin who grew up in Makkah; he took a PhD at SOAS, University of London, with a thesis submitted in 2010 on aspects of Sunni Muslim minority fiqh, holds a civil engineering degree from Sudan and studied in Medina; he is chair, operations advisor and a trustee of the Muslim Research and Development Foundation (MRDF), sits on the board of advisors of the Islamic Sharia Council in Britain, and appears as a television presenter and lecturer on Islamic channels."
  ur: "فلسطینی نژاد برطانوی مسلم عالم، مکہ میں پرورش پائی؛ انہوں نے SOAS، جامعہ لندن سے پی ایچ ڈی کی جس کا مقالہ 2010 میں سنی مسلم اقلیتی فقہ کے منتخب پہلوؤں پر پیش کیا گیا، سوڈان سے سول انجینئرنگ کی ڈگری حاصل کی اور مدینہ منورہ میں تعلیم پائی؛ وہ مسلم ریسرچ اینڈ ڈیولپمنٹ فاؤنڈیشن (MRDF) کے چیئر، آپریشنز ایڈوائزر اور ٹرسٹی ہیں، برطانیہ کی اسلامک شریعہ کونسل کے مشاورتی بورڈ کے رکن ہیں، اور اسلامی ٹی وی چینلز پر پیش کار و مقرر کے طور پر نمودار ہوتے ہیں۔"
  es: "Erudito musulmán británico de origen palestino que creció en La Meca; obtuvo un doctorado en la SOAS, Universidad de Londres, con una tesis presentada en 2010 sobre aspectos del fiqh de la minoría musulmana sunita, posee un título en ingeniería civil de Sudán y estudió en Medina; es presidente, asesor de operaciones y fideicomisario de la Fundación Musulmana para la Investigación y el Desarrollo (MRDF), forma parte del consejo asesor del Consejo Islámico de la Sharia en Gran Bretaña y aparece como presentador de televisión y conferenciante en canales islámicos."
  fr: "Érudit musulman britannique d'origine palestinienne ayant grandi à La Mecque, il a obtenu un doctorat à SOAS, Université de Londres, avec une thèse soutenue en 2010 sur des aspects du fiqh de la minorité musulmane sunnite. Il est titulaire d'un diplôme d'ingénieur civil du Soudan et a étudié à Médine. Il est président, conseiller opérationnel et administrateur de la Muslim Research and Development Foundation (MRDF), siège au conseil consultatif de l'Islamic Sharia Council en Grande-Bretagne et intervient comme présentateur et conférencier à la télévision sur des chaînes islamiques."
  tr: "Filistin kökenli Britanyalı Müslüman bir akademisyen olan Mekke'de büyümüştür. Doktora derecesini Londra Üniversitesi Doğu ve Afrika Çalışmaları Okulu'ndan (SOAS) almıştır ve 2010 yılında Müslüman azınlık hukukunun çeşitli yönleri üzerine bir tez sunmuştur. Sudan'da inşaat mühendisliği diploması almış ve Medine'de eğitim görmüştür. Başkan, operasyonel danışman ve sekreterlerinden biridir, Britanya İslami Şeriat Konseyi'nin danışma kurulunda yer almakta ve İslami televizyon kanallarında sunucu ve öğretim görevlisi olarak yer almaktadır."
  id: "Seorang ulama Muslim Inggris keturunan Palestina, ia tumbuh besar di Mekah. Ia meraih gelar PhD dari School of Oriental and African Studies (SOAS) di University of London dengan tesis yang diajukan pada tahun 2010 tentang aspek yurisprudensi minoritas Muslim. Ia meraih gelar teknik sipil di Sudan dan belajar di Madinah. Ia adalah ketua, penasihat operasional, dan salah satu sekretarisnya, duduk di dewan penasihat Dewan Syariah Islam di Inggris, serta tampil sebagai presenter dan dosen di saluran televisi Islam."
