summary:
  ar: "أبو بكر أحمد بن علي بن محمد بن منجويه الأصبهاني اليزدي، الحافظ نزيل نيسابور ومحدثها؛ صنف التصانيف الكثيرة ورحل ووصل إلى بخارى فحدّث عن أبي بكر الإسماعيلي وأبي بكر بن المقري وطبقتهما؛ قال شيخ الإسلام هو أحفظ من رأيت من البشر، وصنف على الصحيحين وجامع الترمذي وسنن أبي داود مصنفات {cite:shadharat-dhahab p. 233}."
  en: "Abu Bakr Ahmad b. Manjuwayh of Isfahan — the hafiz resident at Nishapur, 'the most retentive man ever seen' in the saying transmitted by al-'Ibar; he composed works upon the two Sahihs, al-Tirmidhi's Jami' and Abu Dawud's Sunan, dying in Muharram 428 aged eighty-one {cite:shadharat-dhahab p. 233}."
