label: { ar: "أبو بكر ابن منجويه الأصبهاني" }
summary:
  ar: "أبو بكر أحمد بن علي بن محمد بن منجويه الأصبهاني اليزدي، الحافظ نزيل نيسابور ومحدثها؛ صنف التصانيف الكثيرة ورحل ووصل إلى بخارى فحدّث عن أبي بكر الإسماعيلي وأبي بكر بن المقري وطبقتهما؛ قال شيخ الإسلام هو أحفظ من رأيت من البشر، وصنف على الصحيحين وجامع الترمذي وسنن أبي داود مصنفات {cite:shadharat-dhahab p. 233}."
  en: "Abu Bakr Ahmad b. Manjuwayh of Isfahan — the hafiz resident at Nishapur, 'the most retentive man ever seen' in the saying transmitted by al-'Ibar; he composed works upon the two Sahihs, al-Tirmidhi's Jami' and Abu Dawud's Sunan, dying in Muharram 428 aged eighty-one {cite:shadharat-dhahab p. 233}."
  es: "Abu Bakr Ahmad b. Manjuwayh de Isfahán, el hafiz residente en Nishapur, \"el hombre más retentivo jamás visto\" en el dicho transmitido por al-'Ibar; compuso obras sobre los dos Sahihs, el Jami' de al-Tirmidhi y el Sunan de Abu Dawud, y murió en Muharram 428 a la edad de ochenta y un años {cite:shadharat-dhahab p. 233}."
  fr: "Abu Bakr Ahmad b. Manjuwayh d'Ispahan — le hafiz résidant à Nishapur, « l'homme le plus rétentif jamais vu » selon la parole transmise par al-'Ibar; il a composé des ouvrages sur les deux Sahihs, le Jami' d'al-Tirmidhi et le Sunan d'Abu Dawud, mourant en Muharram 428 à l'âge de quatre-vingt-un ans {cite: shadharat-dhahab p. 233}."
