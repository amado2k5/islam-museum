summary:
  ar: "بركة خان ملك التتار أسلم وراسل الملك الظاهر بيبرس وكسر ابن عمه هلاكو في الوقعة الهائلة التي انهزم فيها هولاكو وقتل خلق من رجاله وغرق خلق وهو ابن عم هولاكو وجد أبيهما جنكيزخان توفي في العشر الستين من القرن السابع الهجري {cite:shadharat-dhahab p. 305}، وعند ابن خلدون لما عاد إلى بخارى لقي الشيخ الباخوري من أصحاب نجم الدين كبرى الصوفية فأسلم على يده وتأكدت صحبته، واستأذن أخاه منكوفان في الاستيلاء على أعمال الخلافة فأذن له {cite:tarikh-ibn-khaldun-ibar p. 1536}."
  en: "Berke Khan, khan of the Golden Horde — a Muslim who corresponded with Baybars and broke his cousin Hulagu in a great battle where multitudes were slain and drowned; grandson of Genghis, he died in the 660s AH {cite:shadharat-dhahab p. 305}."
