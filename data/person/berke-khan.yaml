summary:
  ar: "بركة خان ملك التتار أسلم وراسل الملك الظاهر بيبرس وكسر ابن عمه هلاكو في الوقعة الهائلة التي انهزم فيها هولاكو وقتل خلق من رجاله وغرق خلق وهو ابن عم هولاكو وجد أبيهما جنكيزخان توفي في العشر الستين من القرن السابع الهجري {cite:shadharat-dhahab p. 305}، وعند ابن خلدون لما عاد إلى بخارى لقي الشيخ الباخوري من أصحاب نجم الدين كبرى الصوفية فأسلم على يده وتأكدت صحبته، واستأذن أخاه منكوفان في الاستيلاء على أعمال الخلافة فأذن له {cite:tarikh-ibn-khaldun-ibar p. 1536}."
  en: "Berke Khan, khan of the Golden Horde — a Muslim who corresponded with Baybars and broke his cousin Hulagu in a great battle where multitudes were slain and drowned; grandson of Genghis, he died in the 660s AH {cite:shadharat-dhahab p. 305}. Under year 665 Ibn al-Imad gives the obituary: 'Berke b. Tuli b. Genghis Khan, sultan of the Qipchaq realm, who became Muslim and corresponded with al-Zahir and broke his cousin Hulagu — he died in his sixties, and his nephew Mangu-Timur reigned after him' {cite:shadharat-dhahab p. 552}."
  es: "Berke Khan, kan de la Horda de Oro, musulmán que mantuvo correspondencia con Baybars y derrotó a su primo Hulagu en una gran batalla donde multitudes fueron asesinadas y ahogadas; nieto de Genghis, murió en la década de 660 de la Hégira {cita: shadharat-dhahab p. 305}. Bajo el año 665, Ibn al-Imad da la siguiente necrología: «Berke b. Tuli b. Genghis Khan, sultán del reino de Qipchaq, que se convirtió al Islam y mantuvo correspondencia con al-Zahir y derrotó a su primo Hulagu; murió a los sesenta años y su sobrino Mangu-Timur reinó después de él» {cita: shadharat-dhahab p. 552}."
  fr: "Berke Khan, khan de la Horde d'Or, musulman qui correspondait avec Baybars et vainquit son cousin Hulagu lors d'une grande bataille où de nombreuses personnes périrent par noyade; petit-fils de Gengis Khan, il mourut dans les années 660 de l'Hégire (cf. Hadharat-Dhahab, p. 305). Ibn al-Imad donne la notice nécrologique suivante pour l'année 665: « Berke ben Tuli ben Gengis Khan, sultan du royaume Qipchaq, converti à l'islam, correspondant avec al-Zahir et vainqueur de son cousin Hulagu, mourut à soixante ans et son neveu Mangu-Timur lui succéda » (cf. Hadharat-Dhahab, p. 552)."
  ur: "برکے خان، گولڈن ہارڈ کا خان - ایک مسلمان جس نے بے بارز کے ساتھ خط و کتابت کی اور اپنے کزن ہلاگو کو ایک عظیم جنگ میں توڑ دیا جہاں بہت سے لوگ مارے گئے اور ڈوب گئے۔ چنگیز کے پوتے، اس کی وفات 660 ہجری میں ہوئی۔ 305}۔ سنہ 665 کے تحت ابن عماد نے مرثیہ بیان کیا ہے: 'برک ب۔ ٹولی بی۔ چنگیز خان، کیپچاق سلطنت کا سلطان، جو مسلمان ہوا اور اس نے الظاہر سے خط و کتابت کی اور اپنے کزن ہلاگو کو توڑ دیا - وہ ساٹھ کی دہائی میں مر گیا، اور اس کے بھتیجے منگو تیمور نے اس کے بعد حکومت کی۔ 552}۔"
  tr: "Tatar kralı Baraka Han İslam'a geçti ve Kral Zahir Baybars ile yazıştı. Hulagunun şiddetli savaşta kuzeni Hulagunu yendi, birkaç adamını öldürdü ve birkaçını boğdu. Hulagu'nun kuzeniydi ve babalarının babası Cengiz Han 10. yüzyıl H yılında öldü {atıf:shadharat-dhahab s. 305}. İbn Haldun Buhara'ya döndüğünde, en büyük tasavvuf âlimi Necmeddin'in takipçilerinden Şeyh al-Bakhuri ile karşılaştı; Necmeddin, onun elinden İslam'a geçti ve onun arkadaşlığı onaylandı. Kardeşi Mankufan'dan halifeliği ele geçirmek için izin istedi ve izin aldı {atıf:Tarikh-ibn-khaldun-ibar s. 1536}."
  id: "Baraka Khan, raja Tatar, memeluk Islam dan berkorespondensi dengan Raja Zahir Baybars. Ia mengalahkan sepupunya Hulagu dalam pertempuran sengit di mana Hulagu dikalahkan, membunuh beberapa anak buahnya, dan menenggelamkan beberapa lainnya. Ia adalah sepupu Hulagu dan kakek dari pihak ayah, Genghis Khan, meninggal pada abad ke-10 H {cite:shadharat-dhahab hlm. 305}. Ketika Ibn Khaldun kembali ke Bukhara, ia bertemu Sheikh al-Bakhuri, salah satu pengikut Najm al-Din, ulama Sufi terbesar, yang memeluk Islam di tangannya, dan persahabatannya pun dikonfirmasi. Ia meminta izin dari saudaranya Mankufan untuk merebut kekhalifahan, dan ia diberikan izin {cite:Tarikh-ibn-khaldun-ibar hlm. 1536}."
died: { edtf: "1267~", hijri: "0665", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي وهو في عشر الستين وتملك بعده ابن أخيه منكوتمر — أموات سنة خمس وستين {cite:shadharat-dhahab p. 552}." }
