id: person/najm-al-aimma-al-bari
class: person
label: { ar: "نجم الأئمة البارعي", en: "Najm al-A'imma al-Bari'i", es: "Najm al-A'imma al-Bari'i", fr: "Najm al-A'imma al-Bari'i", ur: "نجم الائمہ الباریۃ" }
summary:
  ar: "نجم الأئمة البارعي، ويلقب بذلك لمن برع في نوع من العلم، كان إماما فاضلا فقيها واعظا. توفي بجرجانية خوارزم سنة خمس وأربعين وستمائة بحسب الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  en: "Najm al-A'imma al-Bari'i: a learned jurist and preacher, whose title Bari' (excelling) is given to one who excels in a field of learning. He died at Jurjaniyya in Khwarazm in 645 AH, according to the book. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  es: "Najm al-A'imma al-Bari'i: un erudito jurista y predicador, cuyo título de Bari' (sobresaliente) se otorga a quien sobresale en un campo del saber. Murió en Jurjaniyya, en Khwarazm, en el año 645 de la Hégira, según el libro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  fr: "Najm al-A'imma al-Bari'i: juriste et prédicateur érudit, dont le titre de Bari' (excellence) est attribué à celui qui excelle dans un domaine du savoir. Il mourut à Jurjaniyya, dans le Khwarezm, en 645 AH, selon l'ouvrage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  ur: "نجم الائمہ الباری: ایک عالم فقیہ اور مبلغ، جس کا لقب باری ⁦(بہترین)⁩ اس شخص کو دیا جاتا ہے جو علم کے میدان میں سبقت لے۔ کتاب کے مطابق 645ھ میں خوارزم میں جرجانیہ میں وفات پائی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7164}"
  tr: "İmam el-Bari'i'nin yıldızı, belirli bir bilgi türünde üstün olanlardan lakabı almıştır; erdemli bir imam, hukukçu ve vaizdi. Kur'an'a göre altı yüz kırk beşinci yılda Harezm'in Jurcaniya'sında öldü. {Kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.7164}"
  id: "Bintang Imam al-Bari'i, dijuluki untuk mereka yang unggul dalam suatu jenis pengetahuan, adalah seorang imam, ahli hukum, dan pengkhotbah yang berbudi luhur. Ia wafat di Jurjaniya Khwarezm pada tahun enam ratus empat puluh lima menurut Al-Qur'an. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7164}"
