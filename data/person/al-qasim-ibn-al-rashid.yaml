id: person/al-qasim-ibn-al-rashid
class: person
label: { ar: "القاسم بن الرشيد", en: "al-Qasim ibn al-Rashid" }
summary:
  ar: "القاسم بن هارون الرشيد، ثالث أولاده الخلفاء؛ عند البلاذري: كان مقيماً بدابق حين أغارت الروم على عين زربة فاستاقوا مواشي أهلها وأسروا بشراً فنفر إليهم أهل المصيصة ومطوعتها فاستنقذوا ما صار إليهم، فوجّه القاسم من حصّن المدينة ورمّها وزاد في شحنتها. وبايعه الرشيد بولاية العهد بعد المأمون سنة سبع وثمانين ومائة فإذا أفضت الخلافة إلى المأمون كان أمره إليه إن شاء أقره وإن شاء خلعه {cite:muruj-al-dhahab p. 341}، وخلعه المأمون من ولاية العهد سنة ثمان وتسعين ومائة {cite:muruj-al-dhahab p. 419}"
  en: "al-Qasim ibn Harun al-Rashid, third of his sons to rule; in al-Baladhuri: he was dwelling at Dabiq when the Byzantines raided Ayn Zarba, driving off its herds and taking captives, and when the men and volunteers of Masisa flew to the rescue and recovered what had reached the raiders, al-Qasim sent men to fortify and repair the city and increased its garrison."
