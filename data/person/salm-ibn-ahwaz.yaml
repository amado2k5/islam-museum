label: { ar: "سلم بن أحوز المازني", en: "Salm ibn Ahwaz al-Mazini", es: "Salm ibn Ahwaz al-Mazini", fr: "Salm ibn Ahwaz al-Mazini", ur: "سالم ابن احواز المزینی" }
summary:
  ar: "سيره نصر بن سيار إلى يحيى بن زيد بالجوزجان فقتله في المعركة بقرية يقال لها أرعونة بسهم في صدغه، وحمل رأسه إلى الوليد بن يزيد وصلب جسده بالجوزجان حتى خرج أبو مسلم فقتله وأنزل جثة يحيى فصلى عليها {cite:muruj-al-dhahab p. 200}."
  en: "Nasr ibn Sayyar's commander who killed Yahya ibn Zayd at 'Arghuna and took his head to al-Walid — Abu Muslim later killed him and prayed over Yahya's lowered body {cite:muruj-al-dhahab p. 200}."
  es: "El comandante de Nasr ibn Sayyar que mató a Yahya ibn Zayd en 'Arghuna y llevó su cabeza a al-Walid — Abu Muslim lo mató más tarde y oró sobre el cuerpo de Yahya que yacía en el suelo {cite:muruj-al-dhahab p. 200}."
  fr: "Le commandant de Nasr ibn Sayyar qui tua Yahya ibn Zayd à 'Arghuna et apporta sa tête à al-Walid — Abu Muslim le tua plus tard et pria sur le corps abaissé de Yahya {cite:muruj-al-dhahab p. 200}."
  ur: "نصر بن سیار کا کمانڈر جس نے یحییٰ بن زید کو ارغونہ میں قتل کیا اور اس کا سر الولید کے پاس لے گیا — ابو مسلم نے بعد میں اسے قتل کر دیا اور یحییٰ کے جسم پر نماز پڑھی۔ 200}۔"
  tr: "Nasr ibn Sayyar, al-Jawzjan'daki Yahya ibn Zayd'e yürüdü ve Ar'una adlı bir köyde bir ok şakakına saplanarak savaşta öldü. Başını el-Velid bin Yezid'e götürdü ve cesedini el-Cevzcan'da çarmıha gerdi; ta ki Ebu Müslim çıkıp onu öldürene kadar, Yahya'nın bedenini indirip üzerinde namaz kılana kadar {atıf:Muruj-al-Dhahab, s. 200}."
  id: "Nasr ibn Sayyar berbaris ke Yahya ibn Zayd di al-Jawzjan, di mana ia tewas dalam pertempuran di sebuah desa bernama Ar'una dengan panah menembus kuilnya. Ia membawa kepalanya ke al-Walid ibn Yazid dan menyalibkan jasadnya di al-Jawzjan hingga Abu Muslim keluar, membunuhnya, dan menurunkan tubuh Yahya serta berdoa di atasnya {cite:muruj-al-dhahab, hlm. 200}."
