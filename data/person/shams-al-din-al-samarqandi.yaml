summary:
  ar: "بطاقة أولية لشمس الدين محمد بن أشرف السمرقندي، حنفي سمرقند صاحب «أشكال التأسيس» في الهندسة و«صحائف الأحكام» في الأصول في القرن الثالث عشر، توفي سنة ١٣١٠م تقريباً؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shams al-Din Muhammad ibn Ashraf al-Samarqandi, the thirteenth-century Hanafi author of Ashkal al-Ta'sis in geometry and Sahif al-Ahkam, d. about 1310; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Shams al-Din Muhammad ibn Ashraf al-Samarqandi, autor hanafí del siglo XIII de Ashkal al-Ta'sis en geometría y Sahif al-Ahkam, fallecido alrededor de 1310; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de projet pour Shams al-Din Muhammad ibn Ashraf al-Samarqandi, auteur hanafite du XIIIe siècle d'Ashkal al-Ta'sis en géométrie et de Sahif al-Ahkam, mort vers 1310; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "تیرہویں صدی کے حنفی مصنف شمس الدین محمد بن اشرف الثمر قندی کے لیے ڈرافٹ کارڈ اشکل الطاس جیومیٹری اور صحیف الاحکام، ڈی۔ تقریباً 1310; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
