label: { ar: "أبي بن خلف الجمحي", en: "Ubayy ibn Khalaf al-Jumahi", ur: "ابی بن خلف جمحی" }
gender: male
roles: [military]
summary:
  ar: "أبي بن خلف، من قريش، كان يلقى النبي بمكة فيتوعده بأنه يعلف فرساً له ليقتله عليه، فيجيبه النبي: بل أنا أقتلك إن شاء الله؛ ولما أُسند النبي في الشعب يوم أحد أدركه أبي يطلبه، فتناول النبي الحربة من الحارث بن الصمة فطعنه في عنقه خدشاً يسيراً، فرجع إلى قريش يقول: قتلني محمد، ومات بسرف وهم قافلون إلى مكة، كما يروي ابن إسحاق {cite:rawd-unuf-wakil-v6 p. 7}."
  en: "Ubayy ibn Khalaf of Quraysh used to meet the Prophet in Mecca and threaten him, saying he was feeding a horse to kill him on it, to which the Prophet replied, 'Rather I will kill you, God willing'; when the Prophet had been brought up into the glen at Uhud, Ubayy caught up with him seeking him, and the Prophet took the spear from al-Harith ibn al-Simma and struck him in the neck with a slight wound; he went back to Quraysh saying 'Muhammad has killed me' and died at Sarif as they were returning to Mecca, as Ibn Ishaq relates {cite:rawd-unuf-wakil-v6 p. 7}."
  ur: "ابی بن خلف، قریش سے، مکہ میں نبی سے ملتا تو دھمکی دیتا کہ وہ ایک گھوڑا پال رہا ہے جس پر سوار ہو کر آپ کو قتل کرے گا، اور نبی جواب دیتے: «بلکہ میں تمہیں قتل کروں گا ان شاء اللہ»؛ احد کے دن جب نبی کو گھاٹی میں پہنچا دیا گیا تو ابی آپ کی تلاش میں آ پہنچا، اور نبی نے حارث بن الصمہ سے نیزہ لے کر اس کی گردن میں ہلکا زخم لگایا؛ وہ قریش کے پاس لوٹ کر کہتا رہا: «محمد نے مجھے قتل کر دیا»، اور مکہ واپسی پر سرف میں مر گیا، جیسا کہ ابن اسحاق روایت کرتے ہیں {cite:rawd-unuf-wakil-v6 p. 7}۔"
