summary:
  ar: "أبو سلمة عبد الأعلى الصدفي، والد الفقيه المالكي يونس بن عبد الأعلى؛ من كلامه المأثور: من اشترى ما لا يحتاج إليه باع ما يحتاج إليه {cite:wafayat-ayan}."
  en: "Abu Salama Abd al-Ala al-Sadafi, father of the Maliki jurist Yunus ibn Abd al-Ala. One of his well-known sayings: whoever buys what he does not need will sell what he does need {cite:wafayat-ayan}."
  fr: "Abu Salama Abd al-Ala al-Sadafi, père du juriste malikite Yunus ibn Abd al-Ala. L'un de ses mots connus : qui achète ce dont il n'a pas besoin vendra ce dont il a besoin {cite:wafayat-ayan}."
  es: "Abu Salama Abd al-Ala al-Sadafi, padre del jurista malikí Yunus ibn Abd al-Ala. Uno de sus dichos más conocidos: quien compra lo que no necesita, venderá lo que sí necesita {cite:wafayat-ayan}."
  ur: "ابو سلمہ عبد العلا الصدفی، مالکی فقیہ یونس بن عبد العلا کے والد۔ ان کا ایک مشہور قول ہے: جو کوئی ایسی چیز خریدے جس کی اسے ضرورت نہ ہو وہ بیچے گا جس کی اسے ضرورت ہے۔"
  tr: "Maliki fıkıhçısı Yunus ibn Abdülala'nın babası Ebu Selama Abdülala el-Sadafi'nin meşhur sözlerinden biri şöyledir: \"İhtiyacı olmayanı alan, ihtiyacı olanı satar.\""
  id: "Abu Salama Abd al-A’la al-Sadafi, ayah dari ahli hukum Maliki Yunus ibn Abd al-A’la; di antara ucapannya yang terkenal: Barangsiapa membeli apa yang tidak dibutuhkannya, maka ia akan menjual apa yang dibutuhkannya."
