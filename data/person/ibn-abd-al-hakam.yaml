roles: [historian]
gender: male
summary:
  ar: "عبد الرحمن بن عبد الله بن عبد الحكم بن أعين بن ليث، أبو القاسم، مؤرخ مصري من أهل الحديث، صاحب «فتوح مصر والمغرب». يذكر محقق كتابه أنه وُلد نحو سنة 187هـ وتوفي بالفسطاط سنة 257هـ، ودُفن إلى جانب أبيه قرب قبر الشافعي، وأنه أقدم مؤرخي مصر الإسلامية الذين وصلت مؤلفاتهم {cite:futuh-misr-amir-1999 intro p. ج}."
  en: "Abd al-Rahman ibn Abd Allah ibn Abd al-Hakam ibn A'yan ibn Layth, Abu al-Qasim, an Egyptian historian of the hadith scholars and the author of Futuh Misr wa-l-Maghrib. His editor reports that he was born about 187 AH, died at al-Fustat in 257 AH and was buried beside his father near the tomb of al-Shafi'i, and that he is the oldest historian of Islamic Egypt whose works survive {cite:futuh-misr-amir-1999 intro p. ج}."
  ur: "عبد الرحمن بن عبد اللہ بن عبد الحکم بن اعین بن لیث، ابو القاسم، اہلِ حدیث میں سے ایک مصری مؤرخ اور «فتوح مصر والمغرب» کے مصنف۔ ان کی کتاب کے محقق کے مطابق وہ تقریباً 187ھ میں پیدا ہوئے، 257ھ میں فسطاط میں فوت ہوئے اور شافعی کی قبر کے قریب اپنے والد کے پہلو میں دفن ہوئے؛ وہ اسلامی مصر کے ان مؤرخین میں قدیم ترین ہیں جن کی تصانیف ہم تک پہنچی ہیں {cite:futuh-misr-amir-1999 intro p. ج}۔"
