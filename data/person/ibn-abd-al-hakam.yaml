summary:
  ar: "عبد الرحمن بن عبد الله بن عبد الحكم بن أعين بن ليث، أبو القاسم، مؤرخ مصري من أهل الحديث، صاحب «فتوح مصر والمغرب». يذكر محقق كتابه أنه وُلد نحو سنة 187هـ وتوفي بالفسطاط سنة 257هـ، ودُفن إلى جانب أبيه قرب قبر الشافعي، وأنه أقدم مؤرخي مصر الإسلامية الذين وصلت مؤلفاتهم {cite:futuh-misr-amir-1999 intro p. ج}."
  en: "Abd al-Rahman ibn Abd Allah ibn Abd al-Hakam ibn A'yan ibn Layth, Abu al-Qasim, an Egyptian historian of the hadith scholars and the author of Futuh Misr wa-l-Maghrib. His editor reports that he was born about 187 AH, died at al-Fustat in 257 AH and was buried beside his father near the tomb of al-Shafi'i, and that he is the oldest historian of Islamic Egypt whose works survive {cite:futuh-misr-amir-1999 intro p. ج}."
  ur: "عبد الرحمن بن عبد اللہ بن عبد الحکم بن اعین بن لیث، ابو القاسم، اہلِ حدیث میں سے ایک مصری مؤرخ اور «فتوح مصر والمغرب» کے مصنف۔ ان کی کتاب کے محقق کے مطابق وہ تقریباً 187ھ میں پیدا ہوئے، 257ھ میں فسطاط میں فوت ہوئے اور شافعی کی قبر کے قریب اپنے والد کے پہلو میں دفن ہوئے؛ وہ اسلامی مصر کے ان مؤرخین میں قدیم ترین ہیں جن کی تصانیف ہم تک پہنچی ہیں {cite:futuh-misr-amir-1999 intro p. ج}۔"
  es: "Abd al-Rahman ibn Abd Allah ibn Abd al-Hakam ibn A'yan ibn Layth, Abu al-Qasim, un historiador egipcio de los eruditos del hadiz y autor de Futuh Misr wa-l-Maghrib. Su editor informa que nació alrededor del año 187 AH, murió en al-Fustat en el año 257 AH y fue enterrado junto a su padre cerca de la tumba de al-Shafi'i, y que es el historiador más antiguo del Egipto islámico cuyas obras se conservan {cite:futuh-misr-amir-1999 intro p. ج}."
  fr: "Abd al-Rahman ibn Abd Allah ibn Abd al-Hakam ibn A'yan ibn Layth, dit Abu al-Qasim, était un historien égyptien spécialiste des hadiths et l'auteur de Futuh Misr wa-l-Maghrib. Son éditeur rapporte qu'il serait né vers 187 AH, mort à al-Fustat en 257 AH et enterré auprès de son père, près du tombeau d'al-Shafi'i. Il serait le plus ancien historien de l'Égypte islamique dont les œuvres nous soient parvenues."
  tr: "Abd al-Rahman ibn Abdullah ibn Abd al-Hakam ibn A'yan ibn Layth, Ebu el-Kasım, hadis halkından Mısırlı bir tarihçi ve 'Futuh Misr wa al-Maghrib' adlı eserin yazarıydı. Kitabının editörü, yaklaşık 187 Hicri yılında doğduğunu ve 257 Hicri yılında Fustat'ta öldüğünü, babasının yanına el-Şafii'nin mezarının yakınında gömüldüğünü ve eserleri {cite:futuh-misr-amir-1999 intro s. c} tarihine ulaşan en yaşlı İslam Mısır tarihçisi olduğunu belirtir."
  id: "Abd al-Rahman ibn Abdullah ibn Abd al-Hakam ibn A'yan ibn Layth, Abu al-Qasim, adalah seorang sejarawan Mesir dari kalangan hadis dan penulis 'Futuh Misr wa al-Maghrib'. Editor bukunya menyebutkan bahwa ia lahir sekitar tahun 187 H dan meninggal di Fustat pada tahun 257 H, dimakamkan di samping ayahnya dekat makam al-Shafi'i, dan bahwa ia adalah sejarawan Islam Mesir tertua yang karya-karyanya telah mencapai {cite:futuh-misr-amir-1999 intro hlm. c}."
