    basis: documented
    note: "His Sufi discipleship is documented for the man himself by independent scholarly families. The TDV Islam Ansiklopedisi entry (Koprulu and Uzun), read in full, records his intisab to Haci Bayram Veli, the strict riyazet he underwent in his cell at Ankara, his receipt of the khilafa from his sheikh, his succession to the irshad post after his sheikh's death in 833/1429-30, and that the Shamsiyya branch of the Bayramiyya was his foundation. The Urdu Wikipedia article, citing the Urdu Encyclopaedia of Islam (vol. 1, p. 87), dates his bay'a to Haci Bayram to 830/1427 and the conferral of the khirqa of khilafa a few days later. The English Wikipedia article states independently that he completed his work with his master Haci Bayram Veli before founding the Shamsiyya-Bayramiyya order. His legal school is named by no source read — the articles call him a Sunni scholar at branch level only and Wikidata gives Islam in general (Q432) — so no madhhab is recorded: tariqa is not madhhab."
    sources: [source/tdv-aksemseddin, source/wikipedia-aq-shams-al-din-ur, source/wikipedia-aq-shams-al-din-en]
