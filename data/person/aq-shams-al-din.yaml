summary:
  ar: "آق شمس الدين (792هـ/1389م–1459م)، واسمه محمد شمس الدين بن حمزة، عالم ومتصوّف وطبيب عثماني وُلد في دمشق؛ تلميذ حاجي بيرام ولي وخليفته ومؤسّس الفرع الشمسي من الطريقة البيرامية، ومعلّم السلطان محمد الفاتح ومرافقه في فتح القسطنطينية، وصاحب مؤلفات في التصوف والطب منها «مادة الحياة»."
  en: "Akşemseddin (792/1389–1459), born Şemseddin Muhammed b. Hamza at Damascus, was an Ottoman scholar, Sufi and physician: the disciple and khalifa of Haci Bayram Veli and founder of the Shamsiyya branch of the Bayramiyya, tutor and adviser to Sultan Mehmed II at the conquest of Constantinople, and author of works on Sufism and medicine, among them the Maddat al-Hayat."
  ur: "آق شمس الدین (792ھ/1389ء–1459ء)، اصل نام محمد شمس الدین بن حمزہ، دمشق میں پیدا ہونے والے عثمانی عالم، صوفی اور طبیب تھے: حاجی بیرام ولی کے مرید و خلیفہ اور بیرامیہ کی شاخِ شمسیہ کے بانی، فتحِ قسطنطنیہ میں سلطان محمد فاتح کے استاد و مشیر، اور تصوف و طب پر کتب کے مصنف، جن میں «مادۃ الحیاۃ» شامل ہے۔"
