summary:
  ar: "الشيخ آق شمس الدين محمد بن حمزة الدمشقي الرومي (٧٩٢هـ/١٣٨٩م–١٤٥٩م)؛ ارتحل مع والده إلى بلاد الروم وطلب فنون العلوم وتبحر فيها حتى صار علماً من أعلام الحضارة الإسلامية في عهدها العثماني، ويتصل نسبه بالخليفة الراشد أبي بكر. حفظ القرآن وهو في السابعة ودرس في أماسيا ثم حلب ثم أنقرة. كان معلم محمد الفاتح ومربيه فدرّسه القرآن والسنة والفقه والعربية والفارسية والتركية والرياضيات والفلك والتاريخ وفنون الحرب، وأشرف عليه وهو أمير على مغنيسا يتدرب على إدارة الولاية، وأقنع الأمير الصغير بأنه المقصود بالحديث النبوي: لتفتحن القسطنطينية. وعند الحصار اجتمع الأمراء والوزراء بالسلطان يقولون إنه دفع بهذا القدر الكبير من العساكر جرياً وراء كلام أحد المشايخ حتى هلكت الجنود وأتى عون من بلاد الأفرنج ولم يعد هناك أمل، فأرسل السلطان وزيره ولي الدين أحمد باشا إلى خيمة الشيخ فأجاب: لابد من أن يمنّ الله بالفتح، ثم كتب رسالته: إن حادث تلك السفن قد أحدث في القلوب التكسير والملامة، وإن القضية الثابتة أن العبد يدبّر والله يقدّر والحكم لله، فأحدث الخطاب راحة وطمأنينة وقرر مجلس الحرب الاستمرار. وأراد السلطان شيخه بجانبه أثناء الهجوم فمنع حراس الخيمة رسوله، وذهب الفاتح بنفسه فمنعوه فشقّ بخنجره جدار الخيمة فإذا شيخه ساجد لله في سجدة طويلة وعمامته متدحرجة وشعره الأبيض يتدلى على الأرض والدموع تنحدر على خديه. وقال الفاتح حين فُتحت المدينة: ليس فرحي لفتح المدينة إنما فرحي بوجود مثل هذا الرجل {cite:dawlat-uthmaniyya-salabi p. 113-114}."
  en: "Aq Shams al-Din (1389–1459) — Mehmed II's tutor and 'spiritual conqueror of Constantinople': a Damascene who memorised the Qur'an at seven, studied across Amasya, Aleppo and Ankara, convinced the young prince he was the man of the hadith, and — when the war council despaired mid-siege — answered with the letter that held the army together: 'the servant plans and God decrees' {cite:dawlat-uthmaniyya-salabi p. 113-114}."
