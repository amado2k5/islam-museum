summary:
  ar: "لاهوتية باكستانية أمريكية، وُلدت سنة 1943، أستاذة الدراسات الإسلامية بجامعة لويزفيل. تحدّت القراءات الذكورية لقصص الخلق وناضلت ضد جرائم الشرف، ومن كتاباتها عن حقوق المرأة في الإسلام."
  en: "Pakistani-American theologian, born in 1943, professor of Islamic studies at the University of Louisville. She challenged patriarchal readings of creation narratives and campaigned against honour killings, with writings on women’s rights in Islam."
  ur: "پاکستانی نژاد امریکی الٰہیات دان، 1943 میں پیدا ہوئیں اور لوئیز ول یونیورسٹی میں اسلامیات کی پروفیسر۔ انہوں نے قصۂ تخلیق کی مردانہ قراءتوں کو چیلنج کیا اور ناموس کے قتل کے خلاف جدوجہد کی؛ اسلام میں خواتین کے حقوق پر تحریریں لکھیں۔"
  es: "Teóloga paquistaní-estadounidense, nacida en 1943, profesora de estudios islámicos en la Universidad de Louisville. Cuestionó las interpretaciones patriarcales de los relatos de la creación e hizo campaña contra los crímenes de honor, con escritos sobre los derechos de la mujer en el islam."
  fr: "Théologienne pakistano-américaine, née en 1943, professeure d'études islamiques à l'Université de Louisville. Elle a remis en question les interprétations patriarcales des récits de la création et milité contre les crimes d'honneur, notamment à travers ses écrits sur les droits des femmes en islam."
