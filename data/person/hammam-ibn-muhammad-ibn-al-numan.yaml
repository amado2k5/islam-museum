summary:
  ar: "أبو عمرو همام بن محمد بن النعمان بن عبد السلام، أحد الأخوين اللذين ورثا العلم والعبادة عن أسلافهما، وغلبت عليه العبادة والرعاية. أورد له أبو نعيم حديثين، أحدهما عن أبي هريرة في كلمتين خفيفتين على اللسان ثقيلتين في الميزان."
  en: "Abu Amr Hammam ibn Muhammad ibn al-Nu'man ibn Abd al-Salam, one of two brothers who inherited learning and devotion from their renowned forebears; his dominant traits were worship and care. Abu Nu'aym gives him two reports, one from Abu Hurayra about two light phrases heavy in the scale."
  ur: "ابو عمرو ہمام بن محمد بن نعمان بن عبد السلام، دو بھائیوں میں سے ایک جنہوں نے اپنے مشہور اسلاف سے علم اور عبادت پائی؛ ان پر غالب وصف عبادت اور نگہبانی تھا۔ ابو نعیم نے ان کی دو روایتیں نقل کی ہیں، جن میں سے ایک ابو ہریرہ سے ہے، جو دو ایسے کلمات کے بارے میں ہے جو زبان پر ہلکے اور میزان میں بھاری ہیں۔"
