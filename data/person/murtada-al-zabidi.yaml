summary:
  ar: "محمد بن محمد بن محمد بن عبد الرزاق الحسيني الزبيدي، أبو الفيض، الملقب بمرتضى: علامة باللغة والحديث والرجال والأنساب، أصله من واسط ومولده بلجرام بالهند ومنشؤه زبيد باليمن، وتوفي بالطاعون في مصر، 1145 إلى 1205هـ؛ من كتبه «تاج العروس في شرح القاموس»."
  en: "Muhammad ibn Muhammad ibn Muhammad ibn Abd al-Razzaq al-Husayni al-Zabidi, Abu al-Fayd, surnamed Murtada: a great scholar of language, hadith, transmitter-criticism and genealogy; his family from Wasit, born at Bilgram in India, raised in Zabid in Yemen, died of the plague in Egypt, 1145 to 1205 AH; author of «Taj al-arus fi sharh al-Qamus»."
