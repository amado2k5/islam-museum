summary:
  ar: "محمد بن محمد بن محمد بن عبد الرزاق الحسيني الزبيدي، أبو الفيض، الملقب بمرتضى: علامة باللغة والحديث والرجال والأنساب، أصله من واسط ومولده بلجرام بالهند ومنشؤه زبيد باليمن، وتوفي بالطاعون في مصر، 1145 إلى 1205هـ؛ من كتبه «تاج العروس في شرح القاموس»."
  en: "Muhammad ibn Muhammad ibn Muhammad ibn Abd al-Razzaq al-Husayni al-Zabidi, Abu al-Fayd, surnamed Murtada: a great scholar of language, hadith, transmitter-criticism and genealogy; his family from Wasit, born at Bilgram in India, raised in Zabid in Yemen, died of the plague in Egypt, 1145 to 1205 AH; author of «Taj al-arus fi sharh al-Qamus»."
  es: "Muhammad ibn Muhammad ibn Muhammad ibn Abd al-Razzaq al-Husayni al-Zabidi, Abu al-Fayd, apodado Murtada: un gran erudito en lengua, hadices, crítica de transmisores y genealogía; su familia era de Wasit, nació en Bilgram en la India, se crió en Zabid en Yemen, murió de peste en Egipto, entre 1145 y 1205 AH; autor de «Taj al-arus fi sharh al-Qamus»."
  fr: "Muhammad ibn Muhammad ibn Muhammad ibn Abd al-Razzaq al-Husayni al-Zabidi, Abu al-Fayd, surnommé Murtada: un grand érudit en langue, hadith, critique des transmetteurs et généalogie; sa famille est originaire de Wasit, né à Bilgram en Inde, élevé à Zabid au Yémen, mort de la peste en Égypte, 1145 à 1205 AH; auteur de « Taj al-arus fi sharh al-Qamus »."
  ur: "محمد بن محمد بن محمد بن عبد الرزاق الحسینی الزبیدی، ابو الفائد، کنیت مرتضیٰ: زبان، حدیث، ٹرانسمیٹر-تنقید اور نسب کا ایک عظیم عالم؛ اس کا خاندان وصیت سے، ہندوستان کے بلگرام میں پیدا ہوا، یمن کے زبید میں پرورش پایا، مصر میں طاعون سے فوت ہوا، 1145 تا 1205 ہجری؛ \"تاج العروس فی شرح القمص\" کے مصنف۔"
  tr: "Muhammed ibn Muhammed ibn Abdülrazzak el-Hüseyni el-Zubeydi, Ebu el-Fayd, lakaplı adı Murtada: dil, hadis, rivayetçi ve soybilim alimi. Aslen Wasit'ten, Hindistan'ın Gram kentinde doğmuş ve Yemen'in Zubeyd şehrinden gelmektedir. 1145 ile 1205 Hicri arasında Mısır'da veba nedeniyle ölmüştür; kitapları arasında 'Taj al-Arus fi Sharh al-Qamus' bulunmaktadır."
  id: "Muhammad ibn Muhammad ibn Muhammad ibn Abd al-Razzaq al-Husayni al-Zubaidi, Abu al-Fayd, dijuluki Murtada: seorang ulama dalam bahasa, hadits, narator, dan silsilah. Ia berasal dari Wasit, lahir di Gram, India, dan berasal dari Zubayd di Yaman. Ia meninggal karena wabah di Mesir, 1145 hingga 1205 H; di antara bukunya adalah 'Taj al-Arus fi Sharh al-Qamus'."
