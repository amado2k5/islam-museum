  ar: "صاحب دمشق من آل أيوب؛ أخذه أبوه العادل بالجاموس سنة إحدى وعشرين وخمسمائة {cite:shadharat-dhahab p. 96}، وهجم على دمشق في صفر سنة سبع وثلاثين وستمائة فملكها وتسلم قلعتها، وسلّم قلعة الشقيف للفرنج سنة ثمان وثلاثين فمقته المسلمون وسجن العز ابن عبد السلام وأبا عمرو بن الحاجب لإنكارهما عليه {cite:shadharat-dhahab p. 183,189}."
  en: "Al-Adil's son, lord of Damascus; stormed the city in Safar 637 taking its citadel, and in 638 surrendered Beaufort to the Franks — jailing Ibn Abd al-Salam and Ibn al-Hajib for denouncing it {cite:shadharat-dhahab p. 183,189}."
