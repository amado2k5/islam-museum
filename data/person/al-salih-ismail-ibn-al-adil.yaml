summary:
  ar: "صاحب دمشق من آل أيوب؛ أخذه أبوه العادل بالجاموس سنة إحدى وعشرين وخمسمائة {cite:shadharat-dhahab p. 96}، وهجم على دمشق في صفر سنة سبع وثلاثين وستمائة فملكها وتسلم قلعتها، وسلّم قلعة الشقيف للفرنج سنة ثمان وثلاثين فمقته المسلمون وسجن العز ابن عبد السلام وأبا عمرو بن الحاجب لإنكارهما عليه {cite:shadharat-dhahab p. 183,189}؛ وأخذه الصالحية بعد مقتل توران شاه فقتلوه {cite:shadharat-dhahab p. 249}."
  en: "Al-Adil's son, lord of Damascus; stormed the city in Safar 637 taking its citadel, and in 638 surrendered Beaufort to the Franks — jailing Ibn Abd al-Salam and Ibn al-Hajib for denouncing it {cite:shadharat-dhahab p. 183,189}."
  fr: "Le fils d'Al-Adil, seigneur de Damas, a pris d'assaut la ville à Safar 637 en prenant sa citadelle, et en 638 a livré Beaufort aux Francs - emprisonnant Ibn Abd al-Salam et Ibn al-Hajib pour l'avoir dénoncée {cite:shadharat-dhahab p. 183,189}."
  es: "El hijo de Al-Adil, señor de Damasco, asaltó la ciudad en Safar 637 tomando su ciudadela, y en 638 entregó Beaufort a los francos, encarcelando a Ibn Abd al-Salam e Ibn al-Hajib por denunciarla {cita: shadharat-dhahab p. 183,189}."
  ur: "العادل کا بیٹا، دمشق کا آقا؛ صفر 637 میں شہر پر حملہ کیا اور اس کا قلعہ لے کر 638 میں بیفورٹ کو فرینکوں کے حوالے کر دیا - ابن عبد السلام اور ابن الحجیب کو اس کی مذمت کرنے پر جیل بھیج دیا۔ 183,189}۔"
