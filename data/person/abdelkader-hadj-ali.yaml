summary:
  ar: "مناضل شيوعي فرنسي-جزائري (1883–1957)؛ هاجر إلى فرنسا شابًا، وانضم إلى الحزب الشيوعي الفرنسي منذ تأسيسه 1920 وصار عضوًا في لجنته المركزية، وكان من مؤسسي نجم شمال إفريقيا (1926) وأول رئيس له قبل أن يسلم القيادة إلى مصالي الحاج."
  en: "Franco-Algerian communist militant (1883–1957). He emigrated to France as a young man, joined the French Communist Party at its creation in 1920 and sat on its central committee, and was a co-founder and the first president of the Étoile nord-africaine (1926) before handing its leadership to Messali Hadj."
  ur: "فرانسیسی-جزائری کمیونسٹ کارکن (1883–1957)؛ جوانی میں فرانس ہجرت کی، 1920 میں فرانسیسی کمیونسٹ پارٹی کے قیام کے وقت اس میں شامل ہوئے اور اس کی مرکزی کمیٹی کے رکن بنے، اور نجم شمال افریقہ (1926) کے بانیوں اور پہلے صدر میں سے تھے، بعد ازاں قیادت مصالی الحاج کے حوالے کی۔"
