  fr: "Fiche de candidature de Sari Suleyman Pacha, grand vizir ottoman succédant à Kara Mustafa après le siège de Vienne de 1685 à 1687, décédé en 1687; la source n'est pas encore vérifiée sur la page."
  ur: "1685 سے 1687 تک ویانا کے محاصرے کے بعد کارا مصطفی کی جگہ لینے والے عثمانی عظیم وزیر، ساری سلیمان پاشا کے لیے ڈرافٹ کارڈ، ڈی۔ 1687; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1685-1687 yılları arasında Viyana Kuşatması'nın ardından Kara Mustafa'nın ardından Osmanlı Sadrazami olan Süleyman Paşa el-Aşkar'ın ön kartı 1687'de öldü; Osmanlı tarih kitaplarında anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Suleiman Pasha al-Ashqar, Wazir Agung Ottoman setelah Kara Mustafa setelah Pengepungan Wina dari 1685 hingga 1687, meninggal pada tahun 1687; ia dikenang dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman tersebut."
