  ar: "بطاقة أولية لسليمان باشا الأشقر، الصدر الأعظم العثماني بعد كارا مصطفى في أعقاب حصار فيينا من سنة ١٦٨٥م إلى ١٦٨٧م، توفي سنة ١٦٨٧م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Sari Suleyman Pasha, the Ottoman grand vizier succeeding Kara Mustafa after the Vienna siege from 1685 to 1687, d. 1687; the source entry is not yet checked on the page."
