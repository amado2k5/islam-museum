label: { ar: "حذيفة بن محصن", en: "Hudhayfa ibn Mihsan", es: "Hudhayfa ibn Mihsan", fr: "Hudhayfa ibn Mihsan", ur: "حذیفہ بن محصن" }
summary:
  ar: "أمير من أمراء الفتح؛ عند البلاذري وجّهه المثنى بن حارثة مع النسير بعد يوم الجسر إلى تكريت فأوقعا ببني تغلب وعبرا إلى تكريت وعن عتاب بن إبراهيم أنهما آمنا أهل تكريت وكتبا لهم كتاباً أنفذه عتبة بن فرقد حين فتح الطيرهان والموصل."
  en: "Commander of the conquest; in al-Baladhuri sent by al-Muthanna ibn Haritha with al-Nusayr to Tikrit after the Day of the Bridge; per Attab ibn Ibrahim they safe-conducted Tikrit's people with a written document later enforced by Utba ibn Farqad at al-Tirhan and Mosul."
  es: "Comandante de la conquista; en al-Baladhuri enviado por al-Muthanna ibn Haritha con al-Nusayr a Tikrit después del Día del Puente; según Attab ibn Ibrahim, dieron vía libre a la gente de Tikrit con un documento escrito que más tarde fue hecho cumplir por Utba ibn Farqad en al-Tirhan y Mosul."
  fr: "Commandant de la conquête; selon al-Baladhuri, envoyé par al-Muthanna ibn Haritha avec al-Nusayr à Tikrit après le Jour du Pont; selon Attab ibn Ibrahim, ils ont conduit en lieu sûr les habitants de Tikrit avec un document écrit appliqué plus tard par Utba ibn Farqad à al-Tirhan et Mossoul."
  ur: "فتح کا کمانڈر؛ البلادوری میں المثنیٰ ابن حارثہ نے النصیر کے ساتھ یوم الثقات کے بعد تکریت بھیجا تھا۔ عتاب بن ابراہیم کے مطابق انہوں نے تکریت کے لوگوں کو ایک تحریری دستاویز کے ساتھ محفوظ کیا جسے بعد میں عتبہ بن فرقد نے الطرحان اور موصل میں نافذ کیا۔"
