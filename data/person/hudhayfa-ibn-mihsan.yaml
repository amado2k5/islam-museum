summary:
  ar: "أمير من أمراء الفتح؛ عند البلاذري وجّهه المثنى بن حارثة مع النسير بعد يوم الجسر إلى تكريت فأوقعا ببني تغلب وعبرا إلى تكريت وعن عتاب بن إبراهيم أنهما آمنا أهل تكريت وكتبا لهم كتاباً أنفذه عتبة بن فرقد حين فتح الطيرهان والموصل."
  en: "Commander of the conquest; in al-Baladhuri sent by al-Muthanna ibn Haritha with al-Nusayr to Tikrit after the Day of the Bridge; per Attab ibn Ibrahim they safe-conducted Tikrit's people with a written document later enforced by Utba ibn Farqad at al-Tirhan and Mosul."
