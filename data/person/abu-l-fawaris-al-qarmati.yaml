label: { ar: "أبو الفوارس القرمطي", en: "Abu l-Fawaris al-Qarmati", fr: "Abu l-Fawaris al-Qarmati", es: "Abu l-Fawaris al-Qarmati", ur: "ابو الفوارس القرماتی" }
summary:
  ar: "قرمطي أتي به من ناحية الكوفة فأمر المعتضد بقتله بعد أن قطعت يداه ورجلاه وصلب إلى جانب وصيف الخادم ثم حول إلى ناحية الكنائس، وأشاعت العامة أنه قال لمن حضر قتله إني راجع بعد أربعين يوماً فكان خلائق يجتمعون تحت خشبته يحصون الأيام ويقتتلون حتى نودي بتفريقهم {cite:muruj-al-dhahab p. 629-630}."
  en: "The Qarmatian whose mutilation and crucifixion spawned the forty-day-return craze among Baghdad's crowds {cite:muruj-al-dhahab p. 629-630}."
  fr: "Le qarmate dont la mutilation et la crucifixion firent naître, parmi les foules de Bagdad, l'engouement pour un retour au bout de quarante jours {cite:muruj-al-dhahab p. 629-630}."
  es: "El Qarmatian cuya mutilación y crucifixión generó la locura del regreso de cuarenta días entre las multitudes de Bagdad {cita:muruj-al-dhahab p. 629-630}."
  ur: "وہ قرمتی جس کے مسخ کرنے اور مصلوب کیے جانے نے بغداد کے ہجوم میں چالیس روزہ واپسی کا جنون پیدا کیا {حوالہ: مروج الذہب ص۔ 629-630}۔"
  tr: "Karmati, Kufa yönünden getirildi ve el-Mu'tedid, elleri ve ayakları kesildikten sonra öldürülmesini emretti. Hizmetkârı Vasif'in yanına çarmıha gerildi ve daha sonra kiliseler yönüne götürüldü. Halk arasında, öldürüldüğü sırada orada bulunanlara, \"Kırk gün sonra geri döneceğim\" dediği haberi yayıldı. Bunun üzerine insanlar çarmıhının altında toplanıp günleri saydılar ve dağıtılmaları emredilinceye kadar kavga ettiler. {kaynak: Muruj-al-dhahab s. 629-630}"
  id: "Qarmati dibawa dari arah Kufa, dan Al-Mu’tadid memerintahkan agar dia dibunuh setelah tangan dan kakinya dipotong dan dia disalibkan di samping Wasif, seorang pelayan, kemudian dia dipindahkan ke arah gereja-gereja. Rakyat jelata menyebarkan kabar bahwa dia berkata kepada orang-orang yang hadir saat pembunuhannya, “Aku akan kembali setelah empat puluh hari.” Maka orang-orang berkumpul di bawah salibnya, menghitung hari dan berperang sampai diumumkan bahwa mereka harus dibubarkan. {cite:muruj-al-dhahab hlm. 629-630}."
