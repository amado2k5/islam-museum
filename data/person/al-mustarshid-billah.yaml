id: person/al-mustarshid-billah
class: person
label: { ar: "المسترشد بالله الفضل بن المستظهر" }
summary:
  ar: "خليفة عباسي [٥١٢–٥٢٩هـ]، أبو منصور الفضل بن المستظهر، ولد في ربيع الأول سنة خمس وثمانين وأربع مئة وبويع له عند موت أبيه سنة اثنتي عشرة وخمس مئة، وكان ذا همة عالية وشهامة زائدة وإقدام ورأي وهيبة شديدة ضبط أمور الخلافة وأحيا رسمها وباشر الحروب بنفسه حتى خرج النوبة الأخيرة فكسر جيشه بقرب همدان وأخذ أسيراً إلى أذربيجان، وكان مليح الخط ما كتب أحد من الخلفاء قبله مثله يستدرك على كتابه ويصلح أغاليط في كتبهم، وصنف له أبو بكر الشاشي كتابه العمدة في الفقه وبلقبه اشتهر الكتاب فإنه كان يلقب عمدة الدنيا والدين، وقتل بمراغة يوم الخميس سادس عشر ذي القعدة سنة تسع وعشرين {cite:tarikh-khulafa-minhaj-1434 p. 663-665}."
  en: "Abbasid caliph [512–529], Abu Mansur al-Fadl ibn al-Mustazhir, born Rabi' I 485. Of soaring resolve and dread presence he revived the caliphate's dignity and campaigned in person till his last expedition broke near Hamadan. A calligrapher without peer among caliphs, he corrected slips in his books; al-Shashi wrote his fiqh al-Umda for him — 'Umdat al-Dunya wa'l-Din. He was killed by Batiniyya at Maragha, Thursday 16 Dhu'l-Qa'da 529 {cite:tarikh-khulafa-minhaj-1434 p. 663-665}."
