class: person
label: { ar: "المسترشد بالله الفضل بن المستظهر", en: "al-Mustarshid bi'llah al-Fadl ibn al-Mustazhir", fr: "al-Mustarshid bi'llah al-Fadl ibn al-Mustazhir", es: "al-Mustarshid bi'llah al-Fadl ibn al-Mustazhir", ur: "المسترشد باللہ الفضل ابن المستضیر" }
summary:
  ar: "خليفة عباسي [٥١٢–٥٢٩هـ]، أبو منصور الفضل بن المستظهر، ولد في ربيع الأول سنة خمس وثمانين وأربع مئة وبويع له عند موت أبيه سنة اثنتي عشرة وخمس مئة، وكان ذا همة عالية وشهامة زائدة وإقدام ورأي وهيبة شديدة ضبط أمور الخلافة وأحيا رسمها وباشر الحروب بنفسه حتى خرج النوبة الأخيرة فكسر جيشه بقرب همدان وأخذ أسيراً إلى أذربيجان، وكان مليح الخط ما كتب أحد من الخلفاء قبله مثله يستدرك على كتابه ويصلح أغاليط في كتبهم، وصنف له أبو بكر الشاشي كتابه العمدة في الفقه وبلقبه اشتهر الكتاب فإنه كان يلقب عمدة الدنيا والدين، وقتل بمراغة يوم الخميس سادس عشر ذي القعدة سنة تسع وعشرين {cite:tarikh-khulafa-minhaj-1434 p. 663-665}."
  en: "Abbasid caliph [512–529], Abu Mansur al-Fadl ibn al-Mustazhir, born Rabi' I 485. Of soaring resolve and dread presence he revived the caliphate's dignity and campaigned in person till his last expedition broke near Hamadan. A calligrapher without peer among caliphs, he corrected slips in his books; al-Shashi wrote his fiqh al-Umda for him — 'Umdat al-Dunya wa'l-Din. He was killed by Batiniyya at Maragha, Thursday 16 Dhu'l-Qa'da 529 {cite:tarikh-khulafa-minhaj-1434 p. 663-665}."
  fr: "Le calife abbasside [512-529], Abu Mansur al-Fadl ibn al-Mustazhir, né Rabi' I 485. D'une résolution et d'une présence redoutables, il raviva la dignité du califat et fit campagne en personne jusqu'à ce que sa dernière expédition éclate près de Hamadan. Un calligraphe sans égal parmi les califes, il corrigea les glissades dans ses livres ; al-Shashi écrivit son fiqh al-Umda pour lui - 'Umdat al-Dunya wa'l-Din. Il a été tué par Batiniyya à Maragha, jeudi 16 Dhu'l-Qa'da 529 {cite:tarikh-khulafa-minhaj-1434 p. 663-665}."
  es: "El califa abasí [512–529], Abu Mansur al-Fadl ibn al-Mustazhir, nacido en Rabi' I 485, de férrea determinación e imponente presencia, revitalizó la dignidad del califato y participó personalmente en las campañas hasta que su última expedición fracasó cerca de Hamadán. Calígrafo sin igual entre los califas, corrigió errores en sus libros; al-Shashi escribió para él su fiqh al-Umda — 'Umdat al-Dunya wa'l-Din. Fue asesinado por los Batiniyya en Maragha, el jueves 16 de Dhu'l-Qa'da 529 {cite:tarikh-khulafa-minhaj-1434 p. 663-665}."
  ur: "عباسی خلیفہ [512-529]، ابو منصور الفضل ابن المستظیر، پیدائش ربیع اول 485۔ بلند عزم اور خوف کی موجودگی سے اس نے خلافت کے وقار کو زندہ کیا اور اس وقت تک ذاتی طور پر مہم چلائی جب تک کہ اس کی آخری مہم حمدان کے قریب نہ ٹوٹ گئی۔ ایک خطاط جو خلیفہ کے درمیان ہم مرتبہ نہیں تھا، اس نے اپنی کتابوں میں پرچیاں درست کیں۔ الشاشی نے اس کے لیے اپنی فقہ العمدہ لکھی - 'عمدۃ الدنیا والدین'۔ 16 ذوالقعدہ 529 بروز جمعرات مراثہ میں بطنیہ کے ہاتھوں قتل ہوا۔ 663-665}۔"
