  ar: "داعية باكستاني من دعوة إسلامي، وهو الابن الأكبر لمؤسس الحركة محمد إلياس قادري وخليفته المعيّن ⁦(خليفة أمير أهل السنة)⁩. يجول في باكستان وأوروبا خطيبا في الاجتماعات السنّية للحركة، وبلغت قناته على يوتيوب نحو 167 ألف مشترك في نوفمبر 2026."
  en: "A Pakistani preacher of Dawat-e-Islami, the elder son of the movement's founder Muhammad Ilyas Qadri and his designated successor (Khalifa-e-Ameer-e-Ahl-e-Sunnat). He tours Pakistan and Europe preaching at the movement's Sunnah-inspired gatherings; his YouTube channel counted some 167,000 subscribers in November 2026."
