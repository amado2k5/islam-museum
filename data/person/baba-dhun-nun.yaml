summary:
  ar: "بابا ذو النون، قائد تمرد في منطقة يوزغاد سنة 1526م؛ يصفه الصلابي بأنه تمرد «شيعي رافضي» جمع فيه ما بين ثلاثة آلاف وأربعة آلاف ثائر وفرض الخراج على المنطقة، وقويت حركته حتى هزم بعض القواد العثمانيين الذين توجهوا لقمعها، وانتهت بهزيمته وأُرسل رأسه إلى إسطنبول {cite:dawlat-uthmaniyya-salabi p. 200}."
  en: "Baba Dhu'l-Nun, leader of the 1526 rising around Yozgat; al-Salabi calls it a 'Shi'i Rafidi' revolt that mustered three to four thousand rebels, imposed kharaj on the district, and defeated the first Ottoman captains sent against it — ending in his defeat, his head sent to Istanbul {cite:dawlat-uthmaniyya-salabi p. 200}."
