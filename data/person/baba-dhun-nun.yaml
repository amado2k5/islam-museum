summary:
  ar: "بابا ذو النون، قائد تمرد في منطقة يوزغاد سنة 1526م؛ يصفه الصلابي بأنه تمرد «شيعي رافضي» جمع فيه ما بين ثلاثة آلاف وأربعة آلاف ثائر وفرض الخراج على المنطقة، وقويت حركته حتى هزم بعض القواد العثمانيين الذين توجهوا لقمعها، وانتهت بهزيمته وأُرسل رأسه إلى إسطنبول {cite:dawlat-uthmaniyya-salabi p. 200}."
  en: "Baba Dhu'l-Nun, leader of the 1526 rising around Yozgat; al-Salabi calls it a 'Shi'i Rafidi' revolt that mustered three to four thousand rebels, imposed kharaj on the district, and defeated the first Ottoman captains sent against it — ending in his defeat, his head sent to Istanbul {cite:dawlat-uthmaniyya-salabi p. 200}."
  es: "Baba Dhu'l-Nun, líder del levantamiento de 1526 en torno a Yozgat; al-Salabi lo llama una revuelta 'chií rafidí' que reunió a entre tres y cuatro mil rebeldes, impuso el kharaj en el distrito y derrotó a los primeros capitanes otomanos enviados contra él, terminando con su derrota y su cabeza enviada a Estambul {cite:dawlat-uthmaniyya-salabi p. 200}."
  fr: "Baba Dhu'l-Nun, chef du soulèvement de 1526 autour de Yozgat; al-Salabi le qualifie de révolte « chiite rafidite » qui a rassemblé trois à quatre mille rebelles, imposé le kharaj dans le district et vaincu les premiers capitaines ottomans envoyés contre lui — se terminant par sa défaite, sa tête envoyée à Istanbul {cite:dawlat-uthmaniyya-salabi p. 200}."
  ur: "بابا ذوالنون، 1526 یوزگٹ کے ارد گرد ابھرتے ہوئے رہنما؛ الصلبی اسے 'شیعہ رافدی' بغاوت کہتے ہیں جس نے تین سے چار ہزار باغیوں کو اکٹھا کیا، ضلع پر خراج مسلط کیا، اور اس کے خلاف بھیجے گئے پہلے عثمانی کپتانوں کو شکست دی - اس کی شکست کے نتیجے میں، اس کا سر استنبول بھیج دیا گیا۔ 200}۔"
  tr: "Baba Dhu al-Nun 1526 yılında Yuzgad bölgesinde bir isyanın lideriydi; el-Selabi onu üç bin ile dört bin arasında isyancıyı toplayan 'Şii Rafidhi' isyanı olarak tanımlar; bölgeye vergi koydu ve hareketi güçlendi, ta ki Osmanlı komutanlarını yenerek onu bastırmaya gelene kadar; sonunda kendi yenilgisini aldı ve başını İstanbul'a gönderdi {cite:dawlat-uthmaniyya-salabi s. 200}."
  id: "Baba Dhu al-Nun adalah pemimpin pemberontakan di wilayah Yuzgad pada tahun 1526 M; al-Salabi menggambarkannya sebagai pemberontakan 'Syiah Rafidhi' yang mengumpulkan antara tiga ribu hingga empat ribu pemberontak, mengenakan upeti di wilayah tersebut, dan gerakannya semakin kuat hingga ia mengalahkan beberapa komandan Ottoman yang berusaha menumpasnya, berakhir dengan kekalahannya dan mengirim kepalanya ke Istanbul {cite:dawlat-uthmaniyya-salabi hlm. 200}."
