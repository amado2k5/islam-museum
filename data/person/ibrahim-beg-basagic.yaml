summary:
  ar: "موظف وسياسي بوسني من نيفيسيني، من أسرة رضاباغيتش: قائمقام عثماني جلس مدة قصيرة في البرلمان العثماني، ثم خدم الإدارة النمساوية المجرية وترأّس منذ 1893 لجنة الأوقاف الإقليمية في البوسنة، ونظم الشعر التركي باسم أدهم، وهو والد المؤرخ صفوت بك باشاغيتش."
  en: "Bosnian official and politician from Nevesinje, of the Redžepagić family: an Ottoman district governor (kaymakam) who briefly sat in the Ottoman parliament, then served the Austro-Hungarian administration and from 1893 headed Bosnia's provincial waqf commission; he also wrote Turkish poetry under the pen name Edhem, and was the father of the historian Safvet-beg Bašagić."
  ur: "نیویسینیے سے تعلق رکھنے والے بوسنیائی اہلکار اور سیاست دان، خاندانِ رضاپاغیچ سے: عثمانی قائم مقام رہے، مختصر مدت عثمانی پارلیمان میں بیٹھے، پھر آسٹرو ہنگری انتظامیہ کی خدمت کی اور 1893ء سے بوسنیا کے صوبائی وقف کمیشن کے صدر رہے؛ «ادھم» کے قلمی نام سے ترکی شعر بھی کہا، اور مؤرخ صفوت بیگ باشاگچ کے والد تھے۔"
