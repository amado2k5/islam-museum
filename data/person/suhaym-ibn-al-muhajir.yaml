id: person/suhaym-ibn-al-muhajir
class: person
label: { ar: "سحيم بن المهاجر", en: "Suhaym ibn al-Muhajir" }
summary:
  ar: "سحيم بن المهاجر، من رجال عبد الملك بن مروان؛ عند البلاذري: لما خرجت خيل الروم إلى جبل اللكام ثم لبنان في أيام ابن الزبير وضوت إليها الجراجمة والأنباط والعبيد الآباق واضطر عبد الملك إلى مصالحتهم ومصالحة طاغية الروم على المال، وجّه إلى الرومي سحيم بن المهاجر فتلطف حتى دخل عليه متنكراً يظهر الممالأة ويتقرب بذم عبد الملك وشتمه وتوهين أمره حتى أمِنه واغترّ به، ثم انكفأ عليه بقوم من موالي عبد الملك وجنده كان أعدّهم لمواقعته فقتله ومن كان معه من الروم ونادى بالأمان فتفرق الجراجمة ورجع العبيد إلى مواليهم."
  en: "Suhaym ibn al-Muhajir, an agent of Abd al-Malik ibn Marwan; in al-Baladhuri: when the Byzantine cavalry came to Jabal al-Lukkam and Lebanon in Ibn al-Zubayr's days, drawing to it the Jarajima, Nabataeans and runaway slaves so that Abd al-Malik was driven to compound with them and with the Byzantine tyrant, he sent Suhaym ibn al-Muhajir to the Byzantine commander, who insinuated himself in disguise, feigning partisanship, reviling Abd al-Malik and belittling his cause until he was trusted — then turned on him with men of Abd al-Malik's clients and troops prepared for the encounter, killing him and the Byzantines with him and proclaiming aman, so the Jarajima scattered and the slaves returned to their masters."
