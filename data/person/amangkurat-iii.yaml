summary:
  ar: "أمانغكورات الثالث (توفي 1734)، وُلد باسم رادن ماس سوتيكنا ويُعرف بسونان ماس، سوسوهونان ماتارام من 1703 إلى 1705 والابن الوحيد لأمانغكورات الثاني. أخرجه من كارتاسورا عمّه غير الشقيق الأمير بوغير — بدعم موظفين سئموا حكمه وبدعم الهولنديين — في حرب الخلافة الجاوية الأولى، فصمد في شرق جاوة حتى استسلامه في سورابايا سنة 1708، ومات في منفاه في سيلان الهولندية سنة 1734."
  en: "Amangkurat III (died 1734), born Raden Mas Sutikna and called Sunan Mas, was susuhunan of Mataram from 1703 to 1705, the only son of Amangkurat II. His half-uncle Prince Puger, backed by officials alienated by his rule and by the Dutch, drove him from Kartasura in the First Javanese War of Succession; he held out in east Java until his surrender at Surabaya in 1708, and died in exile in Dutch Ceylon in 1734."
  ur: "امانگکورات سوم (وفات 1734ء)، پیدائشی نام رادن ماس سوتیکنا اور معروف نام سونان ماس، 1703ء سے 1705ء تک ماتارام کے سوسوہونان تھے، امانگکورات دوم کے اکلوتے بیٹے۔ ان کے سوتیلے چچا شہزادہ پوگیر نے — ان کے طرزِ حکمرانی سے بددل اہلکاروں اور ولندیزیوں کی پشت پناہی سے — پہلی جاوی جنگِ جانشینی میں انہیں کارتاسورا سے نکال دیا؛ وہ مشرقی جاوا میں 1708ء میں سورابایا میں ہتھیار ڈالنے تک ڈٹے رہے اور 1734ء میں ولندیزی سیلون کی جلاوطنی میں وفات پائی۔"

