id: person/habban-ibn-abi-jabala
class: person
label: { ar: "حبان بن أبي جبلة" }
gender: male
summary:
  ar: "مولى بني عبد الدار وكان في ديوان مصر؛ روى عن عمرو بن العاص وابن عباس وابن عمر، وبعث به عمر بن عبد العزيز إلى إفريقية في جماعة من الفقهاء ليفقهوا أهلها، وخمسه بعضهم في التابعين الذين دخلوا الأندلس فغزا مع موسى حين افتتحها وانتهى معه إلى حصن قرقشونة {cite:nafh-tib-maqqari p. 314}."
  en: "Mawla of Banu Abd al-Dar, a tabi'i of the Egyptian register who transmitted from Amr b. al-As, Ibn Abbas and Ibn Umar; Umar b. Abd al-Aziz sent him to teach the people of Ifriqiya, and he campaigned with Musa to Carcassonne {cite:nafh-tib-maqqari p. 314}."
  es: "Mawla de Banu Abd al-Dar, un tabi'i del registro egipcio que transmitió de Amr b. al-As, Ibn Abbas e Ibn Umar; Umar b. Abd al-Aziz lo envió a enseñar a la gente de Ifriqiya, y él hizo campaña con Musa a Carcasona {cite:nafh-tib-maqqari p. 314}."
  fr: "Mawla de Banu Abd al-Dar, un tabi'i du registre égyptien qui a transmis d'Amr b. al-As, Ibn Abbas et Ibn Umar; Umar b. Abd al-Aziz l'a envoyé enseigner aux habitants d'Ifriqiya, et il a fait campagne avec Musa jusqu'à Carcassonne {cite:nafh-tib-maqqari p. 314}."
  ur: "بنو عبد الدار کے مولا، مصری رجسٹر کے ایک تابعی جو عمرو بن سے منتقل ہوئے۔ العاص، ابن عباس اور ابن عمر؛ عمر بی۔ عبد العزیز نے اسے افریقیہ کے لوگوں کو تعلیم دینے کے لیے بھیجا، اور اس نے موسیٰ کے ساتھ کارکاسونن تک مہم چلائی۔ 314}۔"
  tr: "Banu Abdüldar'ın özgür bırakılmış bir adamıydı ve Mısır Diwanı'ndaydı; Amr ibn al-As, İbn Abbas ve İbn Ömer'den rivayet etti. Ömer bin Abdülaziz, onu bir grup hukukçu ile birlikte İfrikiye'ye halkına fıkıh öğretmesi için gönderdi. Bazıları Endülüs'e giren Tabi'unlar arasındaydı ve Musa ile birlikte sefer düzenledi; burayı fethettiğinde onunla birlikte Karaqshuna kalesinde sonlandırdı {cite:nafh-tib-maqqari s. 314}."
  id: "Ia adalah mantan Banu Abd al-Dar dan berada di Diwan Mesir; ia menceritakan dari Amr ibn al-As, Ibn Abbas, dan Ibn Umar. Umar ibn Abd al-Aziz mengirimnya ke Ifriqiya bersama sekelompok ahli hukum untuk mengajarkan hukum kepada rakyatnya. Beberapa dari mereka termasuk di antara Tabi'un yang masuk ke al-Andalus, dan ia berperang bersama Musa saat menaklukkannya dan berakhir bersamanya di benteng Qaraqshuna {cite:nafh-tib-maqqari hlm. 314}."
