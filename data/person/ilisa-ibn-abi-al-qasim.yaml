  ar: أبو منصور إليسع بن أبي القاسم
  en: Abu Mansur Ilisa' ibn Abi al-Qasim
  es: "Abu Mansur Ilisa' ibn Abi al-Qasim"
  fr: "Abu Mansur Ilisa' ibn Abi al-Qasim"
summary:
  ar: "أبو منصور إليسع بن أبي القاسم سمكو بن مصلان بن أبي يزول، أمير بني واسول بسجلماسة؛ ولوه مكانه أخاه إلياس لما انتقضوا عليه وخلعوه سنة 194هـ، فبنى سور سجلماسة لأربع وثلاثين سنة من ولايته واستفحل على عهده ملكهم وهو الذي أتم بناءها وتشييدها واختط بها المصانع والقصور وانتقل إليها آخر المائة الثانية، وكان أباضياً صفرياً."
  en: "Abu Mansur Ilisa' ibn Abi al-Qasim Samku ibn Maslan ibn Abi Yazul, amir of the Wasulids at Sijilmasa; raised in place of his brother Ilyas when they deposed him in 194 AH — he built Sijilmasa's wall in the fourth year of his rule, their kingship swelled on his watch, he completed the city's building and laid out its workshops and palaces, and moved into it late in the second century, an Ibadi Sufrite."
  es: "Abu Mansur Ilisa' ibn Abi al-Qasim Samku ibn Maslan ibn Abi Yazul, emir de los Wasúlidas en Sijilmasa; fue elevado en lugar de su hermano Ilyas cuando lo depusieron en el año 194 AH. Construyó la muralla de Sijilmasa en el cuarto año de su gobierno, su reino creció durante su mandato, completó la construcción de la ciudad y diseñó sus talleres y palacios, y se mudó a ella a finales del siglo II, siendo un sufrita ibadí."
  fr: "Abu Mansur Ilisa' ibn Abi al-Qasim Samku ibn Maslan ibn Abi Yazul, émir des Wasulides à Sijilmasa; élevé à la place de son frère Ilyas lorsqu'ils le déposèrent en 194 AH — il construisit le mur de Sijilmasa dans la quatrième année de son règne, leur royauté s'enrichit sous son règne, il acheva la construction de la ville et aménagea ses ateliers et ses palais, et s'y installa à la fin du IIe siècle, un Ibadi Soufrite."
