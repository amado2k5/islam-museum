label:
  ar: أبو منصور إليسع بن أبي القاسم
  en: Abu Mansur Ilisa' ibn Abi al-Qasim
summary:
  ar: "أبو منصور إليسع بن أبي القاسم سمكو بن مصلان بن أبي يزول، أمير بني واسول بسجلماسة؛ ولوه مكانه أخاه إلياس لما انتقضوا عليه وخلعوه سنة 194هـ، فبنى سور سجلماسة لأربع وثلاثين سنة من ولايته واستفحل على عهده ملكهم وهو الذي أتم بناءها وتشييدها واختط بها المصانع والقصور وانتقل إليها آخر المائة الثانية، وكان أباضياً صفرياً."
  en: "Abu Mansur Ilisa' ibn Abi al-Qasim Samku ibn Maslan ibn Abi Yazul, amir of the Wasulids at Sijilmasa; raised in place of his brother Ilyas when they deposed him in 194 AH — he built Sijilmasa's wall in the fourth year of his rule, their kingship swelled on his watch, he completed the city's building and laid out its workshops and palaces, and moved into it late in the second century, an Ibadi Sufrite."
