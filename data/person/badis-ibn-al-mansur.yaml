summary:
  ar: "أبو مناد باديس بن المنصور بن بلكين بن زيري بن مناد أمير الصنهاجي؛ والد المعز بن باديس؛ كان يتولى مملكة إفريقية نيابة عن الحاكم العبيدي ولقّبه الحاكم نصير الدولة بعد أبيه المنصور؛ وكان ملكاً كبيراً حازم الرأي شديد البأس؛ عرّض عساكره بقبة السلام يوم الثلاثاء التاسع والعشرين من ذي القعدة سنة ست وأربعمائة وسرّه حسن عسكره ثم قضى نحبه في نصف تلك الليلة {cite:wafayat-ayan}."
  en: "Badis b. al-Mansur b. Buluggin (374–406) — Zirid amir of Ifriqiya under al-Hakim's suzerainty, titled Nasir al-Dawla; died hours after a great review, his death concealed until his son al-Mu'izz was installed {cite:wafayat-ayan}."
