summary:
  ar: "عند البلاذري: عمر بن عيسى الأندلسي المعروف بالإقريطشي غزا إقريطش في خلافة المأمون فافتتح منها حصناً واحداً ونزله ثم لم يزل يفتح شيئاً بعد شيء حتى لم يبق فيها من الروم أحد وأخرب حصونهم."
  en: "In al-Baladhuri: Umar ibn Isa al-Andalusi, known as al-Iqritishi; he raided Crete in al-Ma'mun's caliphate, opened a single fortress and settled it, then kept opening bit by bit until no Romans remained in it and he ruined their fortresses."
  fr: "Chez al-Baladhuri : Umar ibn Isa al-Andalusi, dit al-Iqritishi ; il fit campagne en Crète sous le califat d'al-Ma'mun, prit une seule forteresse et s'y établit, puis continua de conquérir peu à peu jusqu'à ce qu'il n'y reste plus de Byzantins, et ruina leurs forteresses."
  es: "En al-Baladhuri: Umar ibn Isa al-Andalusi, conocido como al-Iqritishi; saqueó Creta en el califato de al-Ma'mun, abrió una sola fortaleza y se estableció en ella, luego siguió abriendo poco a poco hasta que no quedaron romanos y arruinó sus fortalezas."
  ur: "البلادوری میں ہے: عمر بن عیسیٰ الاندلسی المعروف العقرتیشی؛ اس نے المامون کی خلافت میں کریٹ پر حملہ کیا، ایک ہی قلعہ کھولا اور اسے آباد کیا، پھر آہستہ آہستہ کھولتا رہا یہاں تک کہ کوئی رومی اس میں باقی نہ رہا اور اس نے ان کے قلعوں کو تباہ کردیا۔"
