  ur: "ابو غالب الزراری"
roles: [scholar, historian]
gender: male
summary:
  ar: "أحمد بن محمد بن سليمان، أبو غالب السنسني الزراري، يصفه الزركلي بأنه شيخ الإمامية في عصره، من أهل الكوفة ونزل ببغداد، نسبته إلى زرارة بن أعين الشيباني، ومن كتبه «التاريخ» ولم يتمه، توفي سنة 368 هـ."
  en: "Ahmad ibn Muhammad ibn Sulayman, Abu Ghalib al-Sunsuni al-Zurari, whom al-Zirikli calls the shaykh of the Imamiyya (a Shi'i group) of his time; of the people of Kufa, settled in Baghdad, nisba to Zurara ibn A'yan al-Shaybani; his unfinished History ran to about a thousand leaves; died 368 AH (978)."
  fr: "Ahmad ibn Muhammad ibn Sulayman, Abu Ghalib al-Sunsuni al-Zurari, qu'al-Zirikli appelle le shaykh des Imamiyya (un groupe chiite) de son temps ; des gens de Koufa, établi à Bagdad, nisba renvoyant à Zurara ibn A'yan al-Shaybani ; son Histoire inachevée atteignait environ mille feuillets ; mort en 368 H (978)."
  es: "Ahmad ibn Muhammad ibn Sulayman, Abu Ghalib al-Sunsuni al-Zurari, a quien al-Zirikli llama el shaykh de la Imamiyya (un grupo chiíta) de su tiempo; de la gente de Kufa, establecido en Bagdad, nisba a Zurara ibn A'yan al-Shaybani; su Historia inconclusa constaba de unas mil hojas; murió en el año 368 AH (978)."
  ur: "احمد بن محمد بن سلیمان، ابو غالب السنونی الزراری، جنہیں الزرکلی اپنے زمانے کا امامیہ ⁦(ایک شیعہ گروہ)⁩ کا شیخ کہتے ہیں۔ اہل کوفہ میں سے، بغداد میں آباد، زرارہ بن عیان الشیبانی کو نسبہ؛ اس کی نامکمل تاریخ تقریباً ایک ہزار پتے تک چلی گئی۔ وفات 368ھ (978)۔"
  tr: "Ahmed ibn Muhammed ibn Süleyman, Ebu Ghalib el-Sansani el-Zarari, el-Zarkali tarafından zamanında İmamiyye'nin şeyhi olarak tanımlanmıştır. Kufa'lıydı ve Bağdat'a yerleşti. Soyu Zurarah ibn A'yan el-Şeybani'ye kadar uzanmaktadır. Kitapları arasında tamamlamadığı \"el-Tarih\" (Tarih) de bulunmaktadır. Hicri 368 yılında vefat etmiştir."
  id: "Ahmad ibn Muhammad ibn Sulayman, Abu Ghalib al-Sansani al-Zarari, digambarkan oleh al-Zarkali sebagai syekh Imamiyyah pada masanya. Beliau berasal dari Kufa dan menetap di Baghdad. Silsilahnya dapat ditelusuri kembali ke Zurarah ibn A’yan al-Shaybani. Di antara buku-bukunya adalah “al-Tarikh” (Sejarah), yang tidak diselesaikannya. Beliau wafat pada tahun 368 Hijriah."
