roles: [scholar, historian]
gender: male
summary:
  ar: "أحمد بن محمد بن سليمان، أبو غالب السنسني الزراري، يصفه الزركلي بأنه شيخ الإمامية في عصره، من أهل الكوفة ونزل ببغداد، نسبته إلى زرارة بن أعين الشيباني، ومن كتبه «التاريخ» ولم يتمه، توفي سنة 368 هـ."
  en: "Ahmad ibn Muhammad ibn Sulayman, Abu Ghalib al-Sunsuni al-Zurari, whom al-Zirikli calls the shaykh of the Imamiyya (a Shi'i group) of his time; of the people of Kufa, settled in Baghdad, nisba to Zurara ibn A'yan al-Shaybani; his unfinished History ran to about a thousand leaves; died 368 AH (978)."
  fr: "Ahmad ibn Muhammad ibn Sulayman, Abu Ghalib al-Sunsuni al-Zurari, qu'al-Zirikli appelle le shaykh des Imamiyya (un groupe chiite) de son temps ; des gens de Koufa, établi à Bagdad, nisba renvoyant à Zurara ibn A'yan al-Shaybani ; son Histoire inachevée atteignait environ mille feuillets ; mort en 368 H (978)."
