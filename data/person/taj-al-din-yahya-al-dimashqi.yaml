  ar: "القاضي تاج الدين أبو طاهر يحيى بن عبد الله؛ قاضي دمشق؛ ذكره العماد الكاتب الأصبهاني في الخريدة فقال: هو أخو كمال الدين، وأثنى عليه؛ توفي بدمشق وعمره ثمانون سنة وأشهر ورثاه ولده محيي الدين محمد وأوصى بولاية ابن أخيه أبي الفضائل القاسم الملقب ضياء الدين فأنفذ السلطان وصيته وفوض القضاء بدمشق إلى ضياء الدين {cite:wafayat-ayan}."
  en: "Qadi Taj al-Din Yahya (492–572) — qadi of Damascus, brother of Kamal al-Din; his dying wish transferred the judgeship to his nephew Diya al-Din al-Qasim, which the sultan confirmed {cite:wafayat-ayan}."
