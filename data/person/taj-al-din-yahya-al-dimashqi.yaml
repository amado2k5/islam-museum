summary:
  ar: "القاضي تاج الدين أبو طاهر يحيى بن عبد الله؛ قاضي دمشق؛ ذكره العماد الكاتب الأصبهاني في الخريدة فقال: هو أخو كمال الدين، وأثنى عليه؛ توفي بدمشق وعمره ثمانون سنة وأشهر ورثاه ولده محيي الدين محمد وأوصى بولاية ابن أخيه أبي الفضائل القاسم الملقب ضياء الدين فأنفذ السلطان وصيته وفوض القضاء بدمشق إلى ضياء الدين {cite:wafayat-ayan}."
  en: "Qadi Taj al-Din Yahya (492–572) — qadi of Damascus, brother of Kamal al-Din; his dying wish transferred the judgeship to his nephew Diya al-Din al-Qasim, which the sultan confirmed {cite:wafayat-ayan}."
  es: "Qadi Taj al-Din Yahya (492–572): cadí de Damasco, hermano de Kamal al-Din; su último deseo transfirió el cargo de juez a su sobrino Diya al-Din al-Qasim, lo que el sultán confirmó {citar:wafayat-ayan}."
  fr: "Qadi Taj al-Din Yahya (492-572) — cadi de Damas, frère de Kamal al-Din; sa dernière volonté a transféré le poste de juge à son neveu Diya al-Din al-Qasim, ce que le sultan a confirmé {cite: wafayat-ayan}."
  ur: "قادی تاج الدین یحییٰ (492-572) - دمشق کا قاضی، کمال الدین کا بھائی؛ اس کی موت کی خواہش نے جج کا عہدہ اس کے بھتیجے دیا الدین القاسم کو منتقل کر دیا، جس کی سلطان نے تصدیق کی۔"
  tr: "Yargıç Taceddin Ebu Tahir Yahya bin Abdullah; Şam'ın yargıcı; el-İmad el-Katib el-İsfahani tarafından al-Khurayda'da şöyle demiştir: O, kendisini öven Kamal al-Din'in kardeşidir; seksen yaşında Şam'da öldü ve ünlü oldu. Oğlu Muhyiddin Muhammed ona yas tuttu ve yeğeni Ebu el-Fada'il el-Qasim, lakaplı Diya al-Din'in vesayetini bıraktı. Sultan onun vasiyetini yerine getirdi ve Şam'daki yargıyı Diya al-Din'e devretti {kaynak: wafayat-ayan}."
  id: "Hakim Taj al-Din Abu Tahir Yahya ibn Abdullah; hakim Damaskus; ia disebutkan oleh al-Imad al-Katib al-Isfahani dalam al-Khurayda, yang berkata: Ia adalah saudara Kamal al-Din, yang memujinya; ia meninggal di Damaskus pada usia delapan puluh tahun dan menjadi terkenal. Putranya Muhyiddin Muhammad berduka atas kehadirannya dan mewariskan hak asuh keponakannya Abu al-Fada'il al-Qasim, yang dijuluki Diya al-Din. Sultan melaksanakan kehendaknya dan mendelegasikan keadilan di Damaskus kepada Diya al-Din {cite:wafayat-ayan}."
