  ar: "داعية ومؤلف إثيوبي يعمل بالأمهرية والأفان أورومو؛ بلغت صفحته على فيسبوك (facebook.com/ahmedinjebel99) 1.4 مليون متابع بحسب قراءة حصاد الموجة لبيانات منشوراته في 7 نوفمبر 2026 — وقد تعذّر فتح ملف فيسبوك مباشرة في بيئة هذا البناء فالرقم قائم على تلك القراءة لا على قراءة مباشرة — وبلغ حسابه على تيك توك (@ahmedinjebelm99)، الذي تنصّ سيرته الأمهرية على أنه حسابه الرسمي، 263,700 متابع عند قراءته مباشرة في 7 نوفمبر 2026، وتسمّيه الدراسات الأكاديمية صحفيًا وناشطًا مسلمًا نشر سنة 2011 كتابًا عن تاريخ مسلمي إثيوبيا، ومستشارًا للشؤون الاجتماعية لرئيس المجلس الأعلى للشؤون الإسلامية في إثيوبيا."
  en: "Ethiopian dawah preacher and author working in Amharic and Afaan Oromo; his Facebook page (facebook.com/ahmedinjebel99) counted 1.4 million followers by the wave harvest's read of his posts' metadata on 7 November 2026 — Facebook profile fetch is blocked in this build environment, so the figure rests on that same-day harvest read, not a direct read — and his TikTok account (@ahmedinjebelm99), whose Amharic bio states that it is his official account, counted 263,700 followers when read directly on 7 November 2026. Academic studies name him as a Muslim journalist and activist who published a book on the history of Ethiopian Muslims in 2011, and as social affairs advisor to the president of the Ethiopian Islamic Affairs Supreme Council."
  ur: "ایتھوپیا کے مبلغ اور مصنف جو امہری اور افان اورومو میں کام کرتے ہیں؛ ان کے فیس بک صفحے (facebook.com/ahmedinjebel99) کے فالوور 7 نومبر 2026ء کو ان کی پوسٹوں کے میٹا ڈیٹا کی لہر کی فصل خوانی کے مطابق 1.4 ملین تھے — فیس بک پروفائل اس تعمیراتی ماحول میں براہِ راست نہیں کھلتا، اس لیے یہ عدد اسی دن کی فصل خوانی پر مبنی ہے، براہِ راست خوانی پر نہیں — اور ان کے ٹک ٹاک اکاؤنٹ (@ahmedinjebelm99) کی امہری سوانح میں لکھا ہے کہ یہ ان کا سرکاری اکاؤنٹ ہے، اور 7 نومبر 2026ء کو براہِ راست پڑھنے پر اس کے فالوور 263,700 تھے؛ علمی مطالعات انھیں مسلم صحافی و کارکن کہتے ہیں جنھوں نے 2011ء میں ایتھوپیا کے مسلمانوں کی تاریخ پر کتاب شائع کی، اور وہ ایتھوپیا کی سپریم کونسل برائے اسلامی امور کے صدر کے مشیرِ سماجی امور ہیں۔"
