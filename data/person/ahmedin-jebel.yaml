summary:
  ar: "داعية ومؤلف إثيوبي يعمل بالأمهرية والأفان أورومو؛ بلغت صفحته على فيسبوك (facebook.com/ahmedinjebel99) 1.4 مليون متابع بحسب قراءة حصاد الموجة لبيانات منشوراته في 7 نوفمبر 2026 — وقد تعذّر فتح ملف فيسبوك مباشرة في بيئة هذا البناء فالرقم قائم على تلك القراءة لا على قراءة مباشرة — وبلغ حسابه على تيك توك (@ahmedinjebelm99)، الذي تنصّ سيرته الأمهرية على أنه حسابه الرسمي، 263,700 متابع عند قراءته مباشرة في 7 نوفمبر 2026، وتسمّيه الدراسات الأكاديمية صحفيًا وناشطًا مسلمًا نشر سنة 2011 كتابًا عن تاريخ مسلمي إثيوبيا، ومستشارًا للشؤون الاجتماعية لرئيس المجلس الأعلى للشؤون الإسلامية في إثيوبيا."
  en: "Ethiopian dawah preacher and author working in Amharic and Afaan Oromo; his Facebook page (facebook.com/ahmedinjebel99) counted 1.4 million followers by the wave harvest's read of his posts' metadata on 7 November 2026 — Facebook profile fetch is blocked in this build environment, so the figure rests on that same-day harvest read, not a direct read — and his TikTok account (@ahmedinjebelm99), whose Amharic bio states that it is his official account, counted 263,700 followers when read directly on 7 November 2026. Academic studies name him as a Muslim journalist and activist who published a book on the history of Ethiopian Muslims in 2011, and as social affairs advisor to the president of the Ethiopian Islamic Affairs Supreme Council."
  ur: "ایتھوپیا کے مبلغ اور مصنف جو امہری اور افان اورومو میں کام کرتے ہیں؛ ان کے فیس بک صفحے (facebook.com/ahmedinjebel99) کے فالوور 7 نومبر 2026ء کو ان کی پوسٹوں کے میٹا ڈیٹا کی لہر کی فصل خوانی کے مطابق 1.4 ملین تھے — فیس بک پروفائل اس تعمیراتی ماحول میں براہِ راست نہیں کھلتا، اس لیے یہ عدد اسی دن کی فصل خوانی پر مبنی ہے، براہِ راست خوانی پر نہیں — اور ان کے ٹک ٹاک اکاؤنٹ (@ahmedinjebelm99) کی امہری سوانح میں لکھا ہے کہ یہ ان کا سرکاری اکاؤنٹ ہے، اور 7 نومبر 2026ء کو براہِ راست پڑھنے پر اس کے فالوور 263,700 تھے؛ علمی مطالعات انھیں مسلم صحافی و کارکن کہتے ہیں جنھوں نے 2011ء میں ایتھوپیا کے مسلمانوں کی تاریخ پر کتاب شائع کی، اور وہ ایتھوپیا کی سپریم کونسل برائے اسلامی امور کے صدر کے مشیرِ سماجی امور ہیں۔"
  es: "Predicador y autor etíope de la dawah que trabaja en amárico y afaan oromo; su página de Facebook (facebook.com/ahmedinjebel99) contaba con 1,4 millones de seguidores según la lectura de metadatos de sus publicaciones realizada por wave harvest el 7 de noviembre de 2026 (la obtención de perfiles de Facebook está bloqueada en este entorno de compilación, por lo que la cifra se basa en esa lectura de harvest del mismo día, no en una lectura directa), y su cuenta de TikTok (@ahmedinjebelm99), cuya biografía en amárico indica que es su cuenta oficial, contaba con 263.700 seguidores cuando se leyó directamente el 7 de noviembre de 2026. Estudios académicos lo identifican como periodista y activista musulmán que publicó un libro sobre la historia de los musulmanes etíopes en 2011, y como asesor de asuntos sociales del presidente del Consejo Supremo de Asuntos Islámicos de Etiopía."
  fr: "Prédicateur et auteur éthiopien de la da'wa, travaillant en amharique et en afaan oromo; sa page Facebook (facebook.com/ahmedinjebel99) comptait 1,4 million d'abonnés selon les métadonnées de ses publications relevées par Wave Harvest le 7 novembre 2026 – la récupération des profils Facebook étant bloquée dans cet environnement de développement, ce chiffre repose sur cette analyse effectuée le jour même, et non sur une lecture directe – et son compte TikTok (@ahmedinjebelm99), dont la biographie en amharique indique qu'il s'agit de son compte officiel, comptait 263 700 abonnés lors d'une lecture directe le 7 novembre 2026. Des études universitaires le présentent comme un journaliste et militant musulman ayant publié un ouvrage sur l'histoire des musulmans éthiopiens en 2011, et comme conseiller aux affaires sociales auprès du président du Conseil suprême des affaires islamiques d'Éthiopie."
  tr: "Amharca ve Afan Oromo dillerinde çalışan Etiyopyalı bir vaiz ve yazar; Facebook sayfası (facebook.com/ahmedinjebel99), 7 Kasım 2026'daki paylaşım verilerinin dalga tabanlı okumasına göre 1,4 milyon takipçiye ulaştı (bu bina ortamında Facebook dosyasını doğrudan açmak mümkün olmadığından, sayı doğrudan okumaya değil, bu okumaya dayanmaktadır) ve Amharca biyografisinde resmi hesabı olarak belirtilen TikTok hesabı (@ahmedinjebelm99) ise 7 Kasım 2026'da doğrudan okunduğunda 263.700 takipçiye ulaştı. Akademik çalışmalar onu, 2011 yılında Etiyopya'daki Müslümanların tarihi üzerine bir kitap yayınlayan gazeteci ve Müslüman aktivist ve Etiyopya İslam İşleri Yüksek Konseyi başkanının sosyal işler danışmanı olarak tanımlıyor."
  id: "Seorang pendakwah dan penulis Ethiopia yang berkarya dalam bahasa Amharik dan Afaan Oromo; halaman Facebook-nya (facebook.com/ahmedinjebel99) mencapai 1,4 juta pengikut menurut pembacaan berbasis gelombang data unggahannya pada 7 November 2026 — dan tidak memungkinkan untuk membuka file Facebook secara langsung di lingkungan gedung ini, jadi angka tersebut didasarkan pada pembacaan tersebut dan bukan pada pembacaan langsung — dan akun TikTok-nya (@ahmedinjebelm99), yang menurut biografi Amharik-nya adalah akun resminya, mencapai 263.700 pengikut ketika dibaca langsung pada 7 November 2026. Studi akademis menyebutnya sebagai jurnalis dan aktivis Muslim yang menerbitkan sebuah buku pada tahun 2011 tentang sejarah Muslim di Ethiopia, dan penasihat urusan sosial untuk kepala Dewan Tertinggi Urusan Islam di Ethiopia."
