summary:
  en: "A Christian slave from Nineveh serving Utba and Shayba ibn Rabi'a in their orchard at al-Ta'if; upon offering grapes to the Prophet and hearing the name of Jonah (Yunus), he embraced Islam and kissed the Prophet's head, hands, and feet."
  fr: "Esclave chrétien de Ninive au service d'Utba et de Shayba ibn Rabi'a dans leur verger d'al-Ta'if ; offrant des raisins au Prophète et entendant le nom de Jonas (Yunus), il embrassa l'islam et embrassa la tête, les mains et les pieds du Prophète."
  ar: "غلام نصراني من أهل نينوى كان يعمل في كرم عتبة وشيبة ابني ربيعة بالطائف؛ قدّم عنباً للنبي فسمع تسميته وذكره ليونس بن متى، فأسلم وقبّل رأس النبي ويديه وقدميه."
  ur: "نینوی کا مسیحی غلام جو طائف میں عتبہ اور شیبہ بن ربیعہ کے باغ میں خدمت کرتا تھا؛ نبی کو انگور پیش کرنے اور نام سننے پر ان سے متاثر ہوا۔"
  es: "Un esclavo cristiano de Nínive que servía a Utba y Shayba ibn Rabi'a en su huerto de al-Ta'if, al ofrecer uvas al Profeta y oír el nombre de Jonás (Yunus), se convirtió al Islam y besó la cabeza, las manos y los pies del Profeta."
