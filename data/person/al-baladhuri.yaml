summary:
  ar: "مؤرخ وشاعر عباسي صاحب «فتوح البلدان» و«أنساب الأشراف»؛ تقدم طبعة مؤسسة المعارف كنيته على الخلاف: قيل أبو بكر وقيل أبو جعفر وقيل أبو الحسن أحمد بن يحيى بن جابر بن داود البغدادي، ولم يعرف تاريخ ولادته بالضبط، واختلف الرواة في وفاته: فبعضهم يذكر أنه توفي في خلافة المعتمد ويؤكد آخرون أنه أدرك المعتضد وعاش في أيامه، ويجعل بعض المحدثين تاريخ وفاته سنة 279هـ؛ سمع لجملة من العلماء والأدباء وأخذ عنهم منهم عبد الله بن صالح العجلي وأبو الحسن المدائني وهشام بن عمار ومحمد بن مصفى وخلف بن هشام وشيبان بن فروخ وأبو عبيدة وعلي بن المديني وأحمد بن إبراهيم الدورقي ومحمد بن الصباح الدولابي ومحمد بن سعد كاتب الواقدي؛ وروى عنه محمد بن النديم وأحمد بن عمار وجعفر بن قدامة ويعقوب بن نعيم، وترجم له ياقوت في معجم الأدباء وابن عساكر في تاريخ دمشق؛ ومن أخباره عند المستعين أنه أنشده قصيدة مديح فقال له «إن كان كذلك أسنيت جائزتك فهات» فأنشده في البرد منها «يظن لظن البرد أنك صاحبه ولو أن برد المصطفى إذ حويته» وأعطيته فلبسته — قال فيه عبيد الله بن أحمد بن أبي طاهر «وله كتب جياد وهو صاحب كتاب البلدان صنفه وأحسن تصنيفه» (مقدمة الطبعة ص 3–7)."
  en: "Abbasid historian and poet, author of 'Futuh al-Buldan' and 'Ansab al-Ashraf'; the Mu'assasat al-Ma'arif edition gives his kunya variously as Abu Bakr, Abu Ja'far or Abu al-Hasan Ahmad ibn Yahya ibn Jabir ibn Dawud al-Baghdadi, his birth date unknown, and his death disputed — some say he died in al-Mu'tamad's caliphate, others that he reached al-Mu'tadid's era, while some moderns set it at 279 AH; he heard from a body of scholars and littérateurs including Abdullah ibn Salih al-Ijli, Abu al-Hasan al-Mada'ini, Hisham ibn Ammar, Muhammad ibn Musaffa, Khalaf ibn Hisham, Shayban ibn Farrukh, Abu Ubayda, Ali ibn al-Madini, Ahmad ibn Ibrahim al-Dawraqi, Muhammad ibn al-Sabbah al-Dawlabi and Muhammad ibn Sa'd, al-Waqidi's secretary; transmitting from him were Muhammad ibn al-Nadim, Ahmad ibn Ammar, Ja'far ibn Qudama and Ya'qub ibn Nu'aym, and he was biographied by Yaqut in Mu'jam al-udaba' and Ibn Asakir in Tarikh Dimashq; at al-Musta'in's court he recited a praise ode — being told 'if so, I have raised your reward, give it' — on the cloak, including 'the cloak suspects you are its owner, as though it were the elect's cloak when you wrap yourself in it', whereupon he was given it and wore it; Ubayd Allah ibn Ahmad ibn Abi Tahir said of him 'his are excellent books — the author of the Book of the Lands, who composed it and composed it well' (edition's introduction pp. 3–7)."
