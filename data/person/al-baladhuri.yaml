summary:
  ar: "مؤرخ وشاعر عباسي صاحب «فتوح البلدان» و«أنساب الأشراف»؛ تقدم طبعة مؤسسة المعارف كنيته على الخلاف: قيل أبو بكر وقيل أبو جعفر وقيل أبو الحسن أحمد بن يحيى بن جابر بن داود البغدادي، ولم يعرف تاريخ ولادته بالضبط، واختلف الرواة في وفاته: فبعضهم يذكر أنه توفي في خلافة المعتمد ويؤكد آخرون أنه أدرك المعتضد وعاش في أيامه، ويجعل بعض المحدثين تاريخ وفاته سنة 279هـ؛ سمع لجملة من العلماء والأدباء وأخذ عنهم منهم عبد الله بن صالح العجلي وأبو الحسن المدائني وهشام بن عمار ومحمد بن مصفى وخلف بن هشام وشيبان بن فروخ وأبو عبيدة وعلي بن المديني وأحمد بن إبراهيم الدورقي ومحمد بن الصباح الدولابي ومحمد بن سعد كاتب الواقدي؛ وروى عنه محمد بن النديم وأحمد بن عمار وجعفر بن قدامة ويعقوب بن نعيم، وترجم له ياقوت في معجم الأدباء وابن عساكر في تاريخ دمشق؛ ومن أخباره عند المستعين أنه أنشده قصيدة مديح فقال له «إن كان كذلك أسنيت جائزتك فهات» فأنشده في البرد منها «يظن لظن البرد أنك صاحبه ولو أن برد المصطفى إذ حويته» وأعطيته فلبسته — قال فيه عبيد الله بن أحمد بن أبي طاهر «وله كتب جياد وهو صاحب كتاب البلدان صنفه وأحسن تصنيفه» ⁦(مقدمة الطبعة ص 3–7)⁩."
  en: "Abbasid historian and poet, author of 'Futuh al-Buldan' and 'Ansab al-Ashraf'; the Mu'assasat al-Ma'arif edition gives his kunya variously as Abu Bakr, Abu Ja'far or Abu al-Hasan Ahmad ibn Yahya ibn Jabir ibn Dawud al-Baghdadi, his birth date unknown, and his death disputed — some say he died in al-Mu'tamad's caliphate, others that he reached al-Mu'tadid's era, while some moderns set it at 279 AH; he heard from a body of scholars and littérateurs including Abdullah ibn Salih al-Ijli, Abu al-Hasan al-Mada'ini, Hisham ibn Ammar, Muhammad ibn Musaffa, Khalaf ibn Hisham, Shayban ibn Farrukh, Abu Ubayda, Ali ibn al-Madini, Ahmad ibn Ibrahim al-Dawraqi, Muhammad ibn al-Sabbah al-Dawlabi and Muhammad ibn Sa'd, al-Waqidi's secretary; transmitting from him were Muhammad ibn al-Nadim, Ahmad ibn Ammar, Ja'far ibn Qudama and Ya'qub ibn Nu'aym, and he was biographied by Yaqut in Mu'jam al-udaba' and Ibn Asakir in Tarikh Dimashq; at al-Musta'in's court he recited a praise ode — being told 'if so, I have raised your reward, give it' — on the cloak, including 'the cloak suspects you are its owner, as though it were the elect's cloak when you wrap yourself in it', whereupon he was given it and wore it; Ubayd Allah ibn Ahmad ibn Abi Tahir said of him 'his are excellent books — the author of the Book of the Lands, who composed it and composed it well' (edition's introduction pp. 3–7)."
  fr: "Historien et poète abbasside, auteur de Futuh al-Buldan et d’Ansab al-Ashraf ; l’édition de Mu’assasat al-Ma’arif donne sa kunya tantôt comme Abu Bakr, tantôt comme Abu Ja’far ou Abu al-Hasan Ahmad ibn Yahya ibn Jabir ibn Dawud al-Baghdadi ; sa date de naissance est inconnue et sa mort discutée — certains le font mourir sous le califat d’al-Mu’tamid, d’autres lui font connaître l’époque d’al-Mu’tadid, tandis que certains modernes la situent en 279 H. Il entendit un groupe de savants et d’hommes de lettres, dont Abdullah ibn Salih al-Ijli, Abu al-Hasan al-Mada’ini, Hisham ibn Ammar, Muhammad ibn Musaffa, Khalaf ibn Hisham, Shayban ibn Farrukh, Abu Ubayda, Ali ibn al-Madini, Ahmad ibn Ibrahim al-Dawraqi, Muhammad ibn al-Sabbah al-Dawlabi et Muhammad ibn Sa’d, secrétaire d’al-Waqidi. Muhammad ibn al-Nadim, Ahmad ibn Ammar, Ja’far ibn Qudama et Ya’qub ibn Nu’aym transmirent de lui ; Yaqut lui consacra une biographie dans Mu’jam al-udaba’ et Ibn Asakir dans Tarikh Dimashq. À la cour d’al-Musta’in, il récita une ode de louange sur le manteau — on lui dit : « S’il en est ainsi, j’ai augmenté ta récompense, donne-le » —, dont ces mots : « Le manteau te croit son propriétaire, comme s’il était celui de l’Élu quand tu t’en enveloppes » ; on le lui donna alors et il le porta. Ubayd Allah ibn Ahmad ibn Abi Tahir dit de lui : « Il a d’excellents livres — auteur du Livre des pays, qu’il composa et composa bien » (introduction de l’édition, p. 3–7)."
  es: "Historiador y poeta abasí, autor de 'Futuh al-Buldan' y 'Ansab al-Ashraf'; la edición Mu'assasat al-Ma'arif le atribuye su kunya de diversas maneras: Abu Bakr, Abu Ja'far o Abu al-Hasan Ahmad ibn Yahya ibn Jabir ibn Dawud al-Baghdadi. Se desconoce la fecha de su nacimiento y se discute la de su muerte: algunos dicen que murió en el califato de al-Mu'tamad, otros que llegó a la era de al-Mu'tadid, mientras que algunos modernos la sitúan en el año 279 de la Hégira. Escuchó a un grupo de eruditos y literatos, entre ellos Abdullah ibn Salih al-Ijli, Abu al-Hasan al-Mada'ini, Hisham ibn Ammar, Muhammad ibn Musaffa, Khalaf ibn Hisham, Shayban ibn Farrukh, Abu Ubayda, Ali ibn al-Madini, Ahmad ibn Ibrahim al-Dawraqi, Muhammad ibn al-Sabbah al-Dawlabi y Muhammad ibn Sa'd, secretario de al-Waqidi; transmitiendo desde él fueron Muhammad ibn al-Nadim, Ahmad ibn Ammar, Ja'far ibn Qudama y Ya'qub ibn Nu'aym, y Yaqut lo biografió en Mu'jam al-udaba' e Ibn Asakir en Tarikh Dimashq; En la corte de al-Musta'in recibió una oda de alabanza —donde se le dijo: \"Si es así, he aumentado tu recompensa, dámela\"— sobre la capa, incluyendo \"la capa sospecha que eres su dueño, como si fuera la capa de los elegidos cuando te envuelves en ella\", tras lo cual se le entregó y se la puso; Ubayd Allah ibn Ahmad ibn Abi Tahir dijo de él: \"Sus son libros excelentes: el autor del Libro de las Tierras, que lo compuso y lo compuso bien\" (introducción de la edición, págs. 3-7)."
  ur: "عباسی مورخ اور شاعر، 'فتوح البلدان' اور 'انساب الاشرف' کے مصنف؛ معرفت المعارف ایڈیشن ان کی کنیت کو ابوبکر، ابو جعفر یا ابو الحسن احمد بن یحییٰ بن جابر ابن داؤد البغدادی کے طور پر مختلف انداز میں بیان کرتا ہے، ان کی تاریخ پیدائش نامعلوم ہے، اور ان کی وفات متنازعہ ہے - بعض کہتے ہیں کہ ان کی وفات المتمد کی خلافت میں ہوئی، بعض کا کہنا ہے کہ وہ معتمد کی خلافت میں فوت ہوا، جب کہ بعض کا کہنا ہے کہ اس کی وفات جدید دور میں ہوئی تھی۔ 279ھ; اس نے علما اور ادیبوں کی ایک جماعت سے سنا جن میں عبداللہ بن صالح العجلی، ابو الحسن المدینی، ہشام بن عمار، محمد بن مصطفٰی، خلف بن ہشام، شیبان بن فرخ، ابو عبیدہ، علی بن المدنی، احمد بن الصاحب، احمد بن الصاحب، احمد بن الصاحب وغیرہ شامل ہیں۔ الدولابی اور محمد بن سعد، الواقدی کے سیکرٹری؛ ان سے محمد بن الندیم، احمد بن عمار، جعفر بن قدامہ اور یعقوب بن نعیم تھے، اور ان کی سوانح یاقوت نے معجم الدبہ میں اور ابن عساکر نے تاریخ دمشق میں؛ المستعین کے دربار میں اسے ایک تعریفی کلام ملا - کہا گیا کہ 'اگر ایسا ہے تو میں نے تیرا اجر بڑھا دیا ہے، اسے دے دو' - اس چادر پر، بشمول 'چادر کے بارے میں شبہ ہے کہ تم اس کے مالک ہو، گویا یہ برگزیدہ کی چادر ہے جب تم اپنے آپ کو اس میں لپیٹتے ہو'، جس پر اسے دیا گیا اور اسے پہنا دیا گیا۔ عبید اللہ ابن احمد ابن ابی طاہر نے ان کے بارے میں کہا کہ 'ان کی بہترین کتابیں ہیں - بک آف دی لینڈز کے مصنف، جنہوں نے اسے مرتب کیا اور اسے اچھی طرح سے مرتب کیا' ⁦(ایڈیشن کا تعارف صفحہ 3-7)⁩۔"
  tr: "Abbasî tarihçi ve şair, “Futuh al-Buldan” ve “Ansab al-Ashraf” eserlerinin yazarı; Ma’arif Vakfı'nın yayınladığı baskıda künyesi farklı görüşlerle sunulmaktadır: Ebu Bekir, Ebu Cafer ve Ebu el-Hasan Ahmed ibn Yahya ibn Cabir ibn Davud el-Bağdadi denilmiştir. Doğum tarihi tam olarak bilinmemekte olup, vefat tarihi konusunda rivayetçiler arasında görüş ayrılıkları bulunmaktadır: Bazıları Mu'tamid halifeliği döneminde öldüğünü belirtirken, diğerleri Mu'tadid döneminde yaşadığını doğrulamaktadır ve bazı hadis âlimleri vefat tarihini Hicri 279 yılına yerleştirmektedir. Abdullah ibn Salih el-Ajli, Ebu el-Hasan el-Mada'ini, Hişam ibn Ammar, Muhammed ibn Musaffa, Halef ibn Hişam, Şeyban ibn Farrukh, Ebu Ubeyda, Ali ibn el-Medini, Ahmed ibn İbrahim el-Davrakı, Muhammed ibn el-Sabah el-Dulabi ve el-Vakidi'nin kâtibi Muhammed ibn Sa'd da dahil olmak üzere birçok âlim ve yazardan rivayetlerde bulundu ve onlardan öğrendi. Ayrıca Muhammed ibn el-Nadim, Ahmed ibn Ammar, Cafer ibn Kudama ve Yakub ibn Na'im de ondan rivayet etmişlerdir. Yakub onu Yazarlar Sözlüğü'ne, İbn Asakir ise Şam Tarihi'ne dahil etmiştir. El-Musta'in ile olan rivayetler arasında, ona bir övgü şiiri okuduğu ve bunun üzerine El-Musta'in'in ona, \"Eğer öyleyse, sana mükafatını verdim, onu getir\" dediği de yer almaktadır. Bunun üzerine ona pelerinle şöyle okudu: “O, pelerinin senin malı olduğunu sanıyor, oysa sen onu Seçilmiş Kişinin pelerinini elinde bulundurup ona verdiğinde, onu giyiyorsun.” — Ubeyd Allah bin Ahmed bin Ebu Tahir onun hakkında şöyle dedi: “Onun güzel kitapları var ve derlediği ve güzelce derlediği Ülkeler Kitabı'nın yazarıdır.” (Baskının Girişi, s. 3-7)."
  id: "Seorang sejarawan dan penyair Abbasiyah, penulis “Futuh al-Buldan” dan “Ansab al-Ashraf”; edisi Yayasan Ma’arif menyajikan kunya-nya dengan perbedaan pendapat: dikatakan Abu Bakr, dikatakan Abu Ja’far, dan dikatakan Abu al-Hasan Ahmad ibn Yahya ibn Jabir ibn Dawud al-Baghdadi. Tanggal kelahirannya yang tepat tidak diketahui, dan para perawi berbeda pendapat tentang kematiannya: beberapa menyebutkan bahwa ia meninggal pada masa kekhalifahan al-Mu’tamid, dan yang lain menegaskan bahwa ia hidup pada masa pemerintahan al-Mu’tadid, dan beberapa ulama hadits menetapkan tanggal kematiannya pada tahun 279 H; beliau mendengar dari sejumlah ulama dan penulis dan belajar dari mereka, antara lain Abdullah ibn Salih al-Ajli, Abu al-Hasan al-Mada'ini, Hisham ibn Ammar, Muhammad ibn Musaffa, Khalaf ibn Hisyam, Shayban ibn Farrukh, Abu Ubayda, Ali ibn al-Madini, Ahmad ibn Ibrahim al-Dawraqi, Muhammad ibn al-Sabah al-Dulabi, dan Muhammad ibn Sa'd, juru tulis al-Waqidi; dan Muhammad ibn al-Nadim, Ahmad ibn Ammar, Ja'far ibn Qudama, dan Ya'qub ibn Na'im meriwayatkan darinya. Yaqut memasukkannya ke dalam Kamus Penulis dan Ibnu Asakir dalam Sejarah Damaskus; Dan di antara berita tentangnya bersama Al-Musta’in adalah bahwa ia membacakan kepadanya sebuah syair pujian, lalu Al-Musta’in berkata kepadanya, “Jika memang demikian, aku telah memberikan pahala kepadamu, maka bawalah pahala itu.” Maka Al-Musta’in membacakan syair pujian kepadanya dengan jubah, dari situ Al-Musta’in berkata, “Ia mengira bahwa jubah itu adalah milikmu, padahal itu adalah jubah Sang Terpilih, ketika kamu memilikinya dan memberikannya kepada-Nya, kamu memakainya.” — Ubayd Allah bin Ahmad bin Abi Tahir berkata tentangnya, “Ia memiliki buku-buku yang bagus, dan ia adalah penulis kitab tentang berbagai negara, yang ia susun dan susun dengan baik” (Pengantar edisi, hlm. 3–7)."
