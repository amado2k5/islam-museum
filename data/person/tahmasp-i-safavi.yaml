  id: "Kartu pendahuluan untuk Tahmasp I, Shahat kedua dinasti Safawi, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
