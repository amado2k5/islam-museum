summary:
  ar: "أنصاري من بني مبذول من بني النجار؛ أخو حبيب بن زيد الذي قطع مسيلمة يديه ورجليه، وأمهما نسيبة بنت كعب التي قاتلت يوم اليمامة وجرحت؛ وقال بعض الرواة عند البلاذري إنه قاتل مسيلمة في حديقة الموت."
  en: "An Ansari of Banu Mabdhul of Banu al-Najjar; brother of Habib ibn Zayd whose hands and feet Musaylima cut off, their mother Nusayba bint Ka'b who fought at al-Yamama and came away wounded; some of al-Baladhuri's transmitters name him as Musaylima's slayer in the Garden of Death."
