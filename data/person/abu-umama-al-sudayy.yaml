summary:
  ar: "باهلي من أمراء السرايا بالشام؛ وجّهه يزيد بن أبي سفيان إلى جمع للروم بالعربة من أرض فلسطين فأوقع بهم وقتل عظيمهم، وعند أبي مخنف نزل ستة قواد من الروم العربة في ثلاثة آلاف فسار إليهم في كثف من المسلمين فهزمهم وقتل أحدهم واتبعهم إلى الدابية فهزمهم وغنم غنماً حسناً؛ وقال مشايخ أهل الشام إن وقعة العربة أول وقائع المسلمين."
  en: "A Bahili among the squadron commanders in Syria; Yazid ibn Abi Sufyan sent him against a Roman gathering at al-Araba in the land of Filastin, and he fell upon them killing their chief — per Abu Mikhnaf six Roman commanders descended on al-Araba with three thousand and Abu Umama marched on them with a band of Muslims, defeated them, killed one commander and pursued them to al-Dabiyya defeating them there with good spoil; the elders of Syria hold the day of al-Araba to be the Muslims' first engagement."
