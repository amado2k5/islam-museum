label:
  ar: زياد بن حدير الأسدي
  en: Ziyad ibn Hudayr al-Asadi
  es: "Ziyad ibn Hudayr al-Asadi"
  fr: "Ziyad ibn Hudayr al-Asadi"
  ur: "زیاد بن حدیر الاسدی"
summary:
  ar: 'زياد بن حدير الأسدي؛ عند البلاذري عن إبراهيم بن مهاجر عنه: بعثه عمر إلى نصارى بني تغلب يأخذ منهم نصف عشر أموالهم ونهاه أن يعشر مسلماً أو ذمياً يؤدي الخراج.'
  en: 'Ziyad ibn Hudayr al-Asadi; in al-Baladhuri through Ibrahim ibn Muhajir from him: Umar sent him to the Christian Taghlib to take a half-tithe of their wealth, forbidding him to tithe a Muslim or a kharaj-paying dhimmi.'
  es: "Ziyad ibn Hudayr al-Asadi; en al-Baladhuri a través de Ibrahim ibn Muhajir de él: Umar lo envió al cristiano Taghlib para que tomara el medio diezmo de su riqueza, prohibiéndole que diezmara a un musulmán o a un dhimmi que pagara el kharaj."
  fr: "Ziyad ibn Hudayr al-Asadi; dans al-Baladhuri par l'intermédiaire d'Ibrahim ibn Muhajir de lui: Umar l'envoya chez les Taghlib chrétiens pour prendre la moitié de leur richesse, lui interdisant de donner la dîme à un musulman ou à un dhimmi payant le kharaj."
  ur: "زیاد ابن حدیر الاسدی؛ البلادوری میں ابراہیم بن مہاجر کے ذریعے سے ان سے: عمر نے اسے عیسائی تغلب کے پاس ان کے مال کا نصف دسواں حصہ لینے کے لیے بھیجا، اور اسے مسلمان یا خرج ادا کرنے والے ذمی کو دسواں حصہ دینے سے منع کیا۔"
  tr: "Ziyad bin Hudeyr el-Esadi; el-Baladhuri'ye göre, İbrahim bin Muhacir ondan al-Baladhuri'ye göre: Ömer onu Banu Taghlib'deki Hristiyanlara gönderdi, servetlerinin yarısını almaya ve bir Müslümana, zimmiye ya da zimmiye vergi ödemesini yasakladı."
  id: "Ziyad ibn Hudayr al-Asadi; menurut al-Baladhuri dari Ibrahim ibn Muhajir darinya: Umar mengirimnya kepada umat Kristen Banu Taghlib untuk mengambil setengah dari harta mereka dan melarangnya membayar pajak kepada Muslim atau dhimmi atau dhimmi."
