summary:
  ar: "محمد صالح كمبة اللاهوري (توفي 1675، على رواية غير مؤكدة) خطاط بنجابي وكاتب السيرة الرسمية للإمبراطور شاه جهان، ومؤلف «أعمال صالح» (شاهجهان نامه)، أكمله في 1659–1660، وهو من أهم المصادر الأصلية لعهد شاه جهان. كان ابن الخطاط مير عبد الله مشكين قلم، والأخ الأصغر لعناية الله كمبة، وخدم ديوانًا لدى حاكم لاهور وحاملًا رتبة إسبهسلار، ثم معلمًا للإمبراطور أورنكزيب."
  en: "Muhammad Saleh Kamboh Lahori (died 1675, on an uncertain report) was a Punjabi calligrapher and the official biographer of the emperor Shah Jahan, author of the Amal-i Salih (Shah Jahan Nama), completed in 1659-1660 and one of the most important original sources for Shah Jahan's reign. He was the son of the calligrapher Mir Abdullah Mushkin Qalam and the younger brother of Inayat Allah Kamboh, served as a diwan with the governor of Lahore and held the rank of Sipahsalar, and was afterwards a teacher of the emperor Aurangzeb."
  ur: "محمد صالح کمبوہ لاہوری (وفات 1675ء، ایک غیر یقینی روایت کے مطابق) پنجابی خطاط اور شہنشاہ شاہ جہاں کے سرکاری سوانح نگار تھے، اور «اعمالِ صالح» (شاہ جہاں نامہ) کے مصنف، جو 1659ء–1660ء میں مکمل ہوئی اور شاہ جہاں کے عہد کے اہم ترین اصل مآخذ میں سے ہے۔ وہ خطاط میر عبد اللہ مشکین قلم کے بیٹے اور عنایت اللہ کمبوہ کے چھوٹے بھائی تھے؛ لاہور کے گورنر کے ہاں دیوان رہے، سپہ سالار کا رتبہ پایا، اور بعد میں شہنشاہ اورنگزیب کے استاد ہوئے۔"

