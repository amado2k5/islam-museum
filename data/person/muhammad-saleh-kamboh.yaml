  note: "His death date is not certain in the sources. S. M. Latif, on unspecified authority, gives AH 1085 (1675 CE), the date the articles repeat and Wikidata files; it is built as debated. The story that he was killed as a Mughal admiral fighting the Ahoms at Pandu in 1636 is rejected by the articles themselves, since he completed the Amal-i Salih in 1659-1660 (Farooqi dates the completion 1669). He is buried in Lahore, near the mosque at Mochi Gate that bears his name, though the grave's location is disputed; the place of his death is not stated, so no died_in edge is written."
