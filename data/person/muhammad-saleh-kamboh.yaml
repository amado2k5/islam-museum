summary:
  ar: "محمد صالح كمبة اللاهوري ⁦(توفي 1675، على رواية غير مؤكدة)⁩ خطاط بنجابي وكاتب السيرة الرسمية للإمبراطور شاه جهان، ومؤلف «أعمال صالح» ⁦(شاهجهان نامه)⁩، أكمله في 1659–1660، وهو من أهم المصادر الأصلية لعهد شاه جهان. كان ابن الخطاط مير عبد الله مشكين قلم، والأخ الأصغر لعناية الله كمبة، وخدم ديوانًا لدى حاكم لاهور وحاملًا رتبة إسبهسلار، ثم معلمًا للإمبراطور أورنكزيب."
  en: "Muhammad Saleh Kamboh Lahori (died 1675, on an uncertain report) was a Punjabi calligrapher and the official biographer of the emperor Shah Jahan, author of the Amal-i Salih (Shah Jahan Nama), completed in 1659-1660 and one of the most important original sources for Shah Jahan's reign. He was the son of the calligrapher Mir Abdullah Mushkin Qalam and the younger brother of Inayat Allah Kamboh, served as a diwan with the governor of Lahore and held the rank of Sipahsalar, and was afterwards a teacher of the emperor Aurangzeb."
  ur: "محمد صالح کمبوہ لاہوری ⁦(وفات 1675ء، ایک غیر یقینی روایت کے مطابق)⁩ پنجابی خطاط اور شہنشاہ شاہ جہاں کے سرکاری سوانح نگار تھے، اور «اعمالِ صالح» ⁦(شاہ جہاں نامہ)⁩ کے مصنف، جو 1659ء–1660ء میں مکمل ہوئی اور شاہ جہاں کے عہد کے اہم ترین اصل مآخذ میں سے ہے۔ وہ خطاط میر عبد اللہ مشکین قلم کے بیٹے اور عنایت اللہ کمبوہ کے چھوٹے بھائی تھے؛ لاہور کے گورنر کے ہاں دیوان رہے، سپہ سالار کا رتبہ پایا، اور بعد میں شہنشاہ اورنگزیب کے استاد ہوئے۔"
  es: "Muhammad Saleh Kamboh Lahori (fallecido en 1675, según informes inciertos) fue un calígrafo punjabí y biógrafo oficial del emperador Shah Jahan, autor del Amal-i Salih (Shah Jahan Nama), completado entre 1659 y 1660, y una de las fuentes originales más importantes sobre el reinado de Shah Jahan. Era hijo del calígrafo Mir Abdullah Mushkin Qalam y hermano menor de Inayat Allah Kamboh. Sirvió como diwan con el gobernador de Lahore y ostentó el rango de Sipahsalar, y posteriormente fue maestro del emperador Aurangzeb."
  fr: "Muhammad Saleh Kamboh Lahori (décédé en 1675, selon des sources incertaines) était un calligraphe punjabi et le biographe officiel de l'empereur Shah Jahan. Il est l'auteur de l'Amal-i Salih (Shah Jahan Nama), achevé entre 1659 et 1660 et qui constitue l'une des sources originales les plus importantes sur le règne de Shah Jahan. Fils du calligraphe Mir Abdullah Mushkin Qalam et frère cadet d'Inayat Allah Kamboh, il exerça la fonction de diwan auprès du gouverneur de Lahore et porta le titre de Sipahsalar. Il fut ensuite le précepteur de l'empereur Aurangzeb."
  tr: "Muhammed Salih Kemba Lahori (doğrulanmamış bir anlatıma göre 1675'te ölmüştür) bir Pencaplı hattat, İmparator Şah Cihan'ın resmi biyografi yazarıdır ve 1659 ile 1660 yılları arasında tamamlanan \"Aamal Saleh\" (Şah Cihan Nama) adlı eserin yazarıdır ve Şah Cihan'ın saltanatının en önemli orijinal kaynaklarından biridir. Hattattan Mir Abdullah Muşkin Qalam'ın oğlu, İnayatullah Kumba'nın küçük kardeşi olup, Lahor valisinin sarayında görev yapmış, Asbehsalar rütbesine sahip olmuş ve daha sonra İmparator Aurangzeb'in öğretmeni olarak hizmet etmiştir."
  id: "Muhammad Saleh Kemba Lahori (meninggal 1675, menurut catatan yang belum dikonfirmasi) adalah seorang kaligrafer Punjabi dan biografer resmi Kaisar Shah Jahan, serta penulis \"Aamal Saleh\" (Shah Jahan Nama), yang diselesaikan antara tahun 1659 dan 1660, dan merupakan salah satu sumber asli terpenting dari masa pemerintahan Shah Jahan. Ia adalah putra kaligrafer Mir Abdullah Mushkin Qalam, adik dari Inayatullah Kumba, pernah bertugas di istana gubernur Lahore, memegang pangkat Asbehsalar, dan kemudian menjadi guru bagi Kaisar Aurangzeb."

