summary:
  ar: "شهاب الدين أحمد بن عبد الحق السنباطي المصري الشافعي، الواعظ بالجامع الأزهر؛ أخذ عن والده وغيره وكان معه بمكة في مجاورته سنة إحدى وثلاثين وتسعمائة ووعظ بالمسجد الحرام في حياة أبيه وفُتح عليه في الوعظ حينئذ، وهو الذي تقدم للصلاة على والده حين توفي بمكة. قال الشعراني: لم نر أحداً من الوعاظ أقبل عليه الخلائق مثله، وكان إذا نزل عن الكرسي اقتتل الناس عليه، وكان متفنناً في العلوم الشرعية وله الباع الطويل في الخلاف ومذاهب المجتهدين، وكان من رؤوس أهل السنة والجماعة واشتهر في أقطار الأرض كالشام والحجاز واليمن والروم وصاروا يضربون به المثل وأذعن له علماء مصر الخاص والعام، وولي تدريس الخشابية بمصر بعد الضيروطي وهي مشروطة لأعلى علماء الشافعية كالشامية البرانية بدمشق، وكان يقول بتحريم قهوة البن ثم انعقد الآن الإجماع على حلها في ذاتها؛ توفي في أواخر صفر، قال الشعراني: ولما مات أظلمت مصر لموته وانهدم ركن عظيم من الدين وما رأيت في عمري كله أكثر خلقاً من جنازته إلا جنازة الشهاب الرملي {cite:shadharat-dhahab p. 696-697}."
  en: "The Azhar's greatest preacher — son of the Meccan mujawir 'Abd al-Haqq, he preached in the Haram in his father's lifetime and prayed over him at his death; 'we never saw the crowds flock to a preacher like him', men fighting over him when he stepped down; a Sunni champion famous from Syria to Yemen and Rum, holder of the Khushabiyya chair, first a coffee-prohibitionist 'then ijma' settled on its permissibility'; Egypt went dark at his death in late Safar [950] — the largest funeral al-Sha'rani ever saw bar al-Ramli's {cite:shadharat-dhahab p. 696-697}."
  es: "El mayor predicador de Azhar, hijo del muyawir mecano 'Abd al-Haqq, predicó en el Haram en vida de su padre y oró por él en su muerte; \"nunca vimos multitudes acudir a un predicador como él\", hombres peleándose por él cuando se retiró; un defensor sunita famoso desde Siria hasta Yemen y Rum, titular de la cátedra Khushabiyya, primero prohibicionista del café \"luego el ijma se decidió sobre su permisibilidad\"; Egipto se sumió en la oscuridad a su muerte a finales de Safar [950], el funeral más grande que al-Sha'rani jamás vio, con la excepción del de al-Ramli {cite:shadharat-dhahab p. 696-697}."
  fr: "Le plus grand prédicateur d'Al-Azhar — fils du mujawir mecquois 'Abd al-Haqq, il prêcha dans le Haram du vivant de son père et pria pour lui à sa mort; « nous n'avons jamais vu les foules affluer vers un prédicateur comme lui », des hommes se battant pour lui lorsqu'il se retira; un champion sunnite célèbre de la Syrie au Yémen et à Rum, titulaire de la chaire Khushabiyya, d'abord prohibitionniste du café « puis l'ijma s'est prononcé sur sa permissibilité »; l'Égypte fut plongée dans le deuil à sa mort à la fin de Safar [950] — les plus grandes funérailles qu'al-Sha'rani ait jamais vues, à l'exception de celles d'al-Ramli {cite:shadharat-dhahab p. 696-697}."
  ur: "ازہر کے سب سے بڑے مبلغ - مکہ کے مجاور عبدالحق کے بیٹے، انہوں نے اپنے والد کی زندگی میں حرم میں تبلیغ کی اور ان کی وفات پر ان پر دعا کی۔ 'ہم نے کبھی بھی ہجوم کو اس جیسے مبلغ کے پاس آتے نہیں دیکھا'، جب وہ نیچے اترا تو لوگ اس پر لڑتے ہوئے۔ شام سے یمن تک مشہور سنی چیمپیئن اور رم، خوشابیہ کی کرسی کے حامل، پہلے کافی پر پابندی لگانے والے 'پھر اجماع' نے اس کے جائز ہونے پر تصفیہ کیا'؛ صفر کے آخر میں ان کی موت پر مصر اندھیرے میں چلا گیا [950] - الشرانی نے اب تک کا سب سے بڑا جنازہ بار الرملی کا دیکھا۔ 696-697}۔"
  tr: "El-Ezher Camii'nin vaizi Şihabdin Ahmed bin Abd al-Haqq al-Sunbati al-Masri al-Shafi'i, babası ve diğerlerinin yanında eğitim aldı ve 1931 civarında Mekke'de onunla birlikteydi. Babası yaşarken Büyük Camii'de vaaz verdi ve o dönemde ona öncülük etti. Babası Mekke'de vefat ettiğinde cenaze namazını o yaptı. El-Şa'rani şöyle dedi: Yaratılış halkının kendisi gibi döndüğü hiçbir vaiz görmedik. Tahttan indiğinde insanlar onun için kavga ederdi. İslam illerinde yetenekliydi ve anlaşmazlıklar ile hukukçu okullarında geniş deneyime sahipti. Ahl-al-Sunnah wa al-Jama'ah'ın önde gelen alimlerinden biriydi ve Levant, Hicaz, Yemen ve Romalılar gibi dünyanın çeşitli yerlerinde ün kazandı, onu örnek olarak kullanmaya başladılar. Mısır'ın hem özel hem de kamu alimleri ona boyun eğdi. Kendisi atandı El-Daruti'den sonra Mısır'da Hashabiyye'yi öğretmek, bu en yüksek Şafii âlimlerine, örneğin Şam'daki El-Şamiyya El-Baraniyya'ya tabiydi. Kahvenin yasak olduğunu söylerdi, ancak şimdi kendi başına izin verilebilir olduğu konusunda bir fikir birliği var. Geç Safar'de öldü. El-Şa'rani şöyle dedi: Öldüğünde, Mısır onun ölümüyle çöktü ve dinin büyük bir sütunu çöktü, cenazesinden daha ahlaklı kimseyi kum meteorunun cenazesi dışında görmedim {alıntı:Shadharat-Dhahab, s. 696-697}."
  id: "Shihab al-Din Ahmad ibn Abd al-Haqq al-Sunbati al-Masri al-Shafi'i, seorang penceramah di Masjid Al-Azhar, belajar di bawah bimbingan ayahnya dan lainnya, dan bersama ayahnya di Mekah sekitar tahun 1931. Ia berkhotbah di Masjid Agung selama masa hidup ayahnya dan memimpin khotbah pada masa itu. Dialah yang memimpin shalat pemakaman untuk ayahnya ketika ayahnya wafat di Mekah. Al-Sha'rani berkata: Kami belum pernah melihat pengkhotbah yang dijadikan tempat seperti dia oleh umat pencipta. Setiap kali dia turun dari tahta, orang-orang akan bertengkar karenanya. Dia mahir dalam ilmu Islam dan memiliki pengalaman luas dalam perselisihan dan aliran ahli hukum. Dia termasuk ulama terkemuka Ahl al-Sunnah wa al-Jama'ah dan menjadi terkenal di berbagai belahan dunia seperti Levant, Hijaz, Yaman, dan Romawi, dan mereka mulai menjadikannya teladan. Para ulama Mesir, baik swasta maupun publik, tunduk kepadanya. Dia ditunjuk untuk mengajar Khashabiyya di Mesir setelah Al-Daruti, yang berada di bawah ulama tertinggi Shafi'i, seperti Al-Shamiyya Al-Baraniyya di Damaskus. Dia dulu mengatakan kopi dilarang, tetapi sekarang ada kesepakatan tentang diperbolehkannya sendiri. Dia meninggal pada akhir Safar. Al-Sha'rani berkata: Ketika dia meninggal, Mesir terjatuh oleh kematiannya, dan sebuah tiang agama yang besar runtuh, dan saya belum pernah melihat siapa pun yang lebih bermoral daripada pemakamannya kecuali pemakaman meteor pasir {cite:\" Shadharat-Dhahab, hlm. 696-697}."
