summary:
  ar: "شهاب الدين أحمد بن عبد الحق السنباطي المصري الشافعي، الواعظ بالجامع الأزهر؛ أخذ عن والده وغيره وكان معه بمكة في مجاورته سنة إحدى وثلاثين وتسعمائة ووعظ بالمسجد الحرام في حياة أبيه وفُتح عليه في الوعظ حينئذ، وهو الذي تقدم للصلاة على والده حين توفي بمكة. قال الشعراني: لم نر أحداً من الوعاظ أقبل عليه الخلائق مثله، وكان إذا نزل عن الكرسي اقتتل الناس عليه، وكان متفنناً في العلوم الشرعية وله الباع الطويل في الخلاف ومذاهب المجتهدين، وكان من رؤوس أهل السنة والجماعة واشتهر في أقطار الأرض كالشام والحجاز واليمن والروم وصاروا يضربون به المثل وأذعن له علماء مصر الخاص والعام، وولي تدريس الخشابية بمصر بعد الضيروطي وهي مشروطة لأعلى علماء الشافعية كالشامية البرانية بدمشق، وكان يقول بتحريم قهوة البن ثم انعقد الآن الإجماع على حلها في ذاتها؛ توفي في أواخر صفر، قال الشعراني: ولما مات أظلمت مصر لموته وانهدم ركن عظيم من الدين وما رأيت في عمري كله أكثر خلقاً من جنازته إلا جنازة الشهاب الرملي {cite:shadharat-dhahab p. 696-697}."
  en: "The Azhar's greatest preacher — son of the Meccan mujawir 'Abd al-Haqq, he preached in the Haram in his father's lifetime and prayed over him at his death; 'we never saw the crowds flock to a preacher like him', men fighting over him when he stepped down; a Sunni champion famous from Syria to Yemen and Rum, holder of the Khushabiyya chair, first a coffee-prohibitionist 'then ijma' settled on its permissibility'; Egypt went dark at his death in late Safar [950] — the largest funeral al-Sha'rani ever saw bar al-Ramli's {cite:shadharat-dhahab p. 696-697}."
