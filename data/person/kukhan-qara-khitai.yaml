summary:
  ar: "كوخان القراخطائي ملك الترك بما وراء النهر؛ هزم السلطان سنجر هزيمة عظيمة سنة ست وثلاثين وخمسمائة في ثلاثمائة ألف فارس فأُصيب المسلمون وقتل من جيش سنجر مائة ألف أو أكثر وأُسرت زوجته وبنته، وكان مع كبر دولته عدلاً لم يُقطع أحداً إقطاعاً في ملكه؛ توفي في رجب سنة سبع وثلاثين وخمسمائة {cite:shadharat-dhahab p. 591, 594}."
  en: "Kukhan the Qara-Khitai, king of the Turks of Transoxiana; in 536 he crushed Sultan Sanjar with three hundred thousand horse — a hundred thousand or more of Sanjar's army fell and his wife and daughter were captured — yet for all his power he was just, granting no iqta' in his realm; d. Rajab 537 {cite:shadharat-dhahab p. 591, 594}."
