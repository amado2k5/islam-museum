summary:
  ar: "كوخان القراخطائي ملك الترك بما وراء النهر؛ هزم السلطان سنجر هزيمة عظيمة سنة ست وثلاثين وخمسمائة في ثلاثمائة ألف فارس فأُصيب المسلمون وقتل من جيش سنجر مائة ألف أو أكثر وأُسرت زوجته وبنته، وكان مع كبر دولته عدلاً لم يُقطع أحداً إقطاعاً في ملكه؛ توفي في رجب سنة سبع وثلاثين وخمسمائة {cite:shadharat-dhahab p. 591, 594}."
  en: "Kukhan the Qara-Khitai, king of the Turks of Transoxiana; in 536 he crushed Sultan Sanjar with three hundred thousand horse — a hundred thousand or more of Sanjar's army fell and his wife and daughter were captured — yet for all his power he was just, granting no iqta' in his realm; d. Rajab 537 {cite:shadharat-dhahab p. 591, 594}."
  es: "Kukhan el Qara-Khitai, rey de los turcos de Transoxiana; en 536 aplastó al sultán Sanjar con trescientos mil jinetes; cien mil o más del ejército de Sanjar cayeron y su esposa e hija fueron capturadas; sin embargo, a pesar de todo su poder, fue justo, no concedió ningún iqta' en su reino; murió en Rajab de 537 {cita: shadharat-dhahab pág. 591, 594}."
  fr: "Kukhan le Qara-Khitai, roi des Turcs de Transoxiane; en 536, il écrasa le sultan Sanjar avec trois cent mille cavaliers — cent mille ou plus de l'armée de Sanjar tombèrent et sa femme et sa fille furent capturées — pourtant, malgré toute sa puissance, il était juste, n'accordant aucun iqta' dans son royaume; d. Rajab 537 {cite:shadharat-dhahab p. 591, 594}."
  ur: "کوخان قارا ختائی، ترکوں کا بادشاہ ٹرانسوکسیانا؛ 536 میں اس نے سلطان سنجر کو تین لاکھ گھوڑے سے کچل دیا - سنجر کی ایک لاکھ یا اس سے زیادہ فوج گر گئی اور اس کی بیوی اور بیٹی کو گرفتار کر لیا گیا - پھر بھی وہ اپنی تمام تر طاقت کے لیے انصاف پسند تھا، اپنے دائرے میں کوئی اقامہ نہیں دیتا تھا۔ d رجب 537۔ 591، 594}۔"
  tr: "Nehrin ötesindeki Türklerin kralı Kuhan el-Karahatay; Sultan Sanjar, 536 Hicri yılında 300.000 süvariye karşı ağır bir yenilgi aldı, Müslümanlar yaralandı, Sanjar'ın ordusundan yüz bin veya daha fazlası öldü, eşi ve kızı esir alındı. Devletinin büyüklüğüne rağmen adildi ve krallığında kimseye bir feodal mülk vermedi; 537 Hicri yılında Recep'te öldü {cite:shadharat-dhahab, s. 591, 594}."
  id: "Kuhan al-Qarakhatai, raja Turki di seberang sungai; Sultan Sanjar mengalami kekalahan telak pada tahun 536 H melawan 300.000 penunggang kuda, menyebabkan Muslim terluka, seratus ribu atau lebih tentara Sanjar tewas, serta istri dan putrinya ditangkap. Meskipun kebesaran negaranya, ia adil dan tidak memberikan siapa pun feodal di kerajaannya; ia meninggal di Rajab pada tahun 537 H {cite:shadharat-dhahab, hlm. 591, 594}."
