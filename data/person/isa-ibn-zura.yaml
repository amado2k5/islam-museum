summary:
  ar: "أبو علي عيسى بن إسحاق بن زرعة فيلسوف يعقوبي مسيحي ومدافع عن عقيدته ومترجم، وُلد ببغداد في ذي الحجة 331هـ/أغسطس 943م وتوفي في 6 شعبان 398هـ/16 أبريل 1008م. درس الأدب والطبيعيات والرياضيات ثم الفلسفة على يحيى بن عدي، وترجم أو اختصر عن السريانية في الغالب عدة كتب لأرسطو أشهرها تاريخ الحيوان، وعمل بالتجارة مع بيزنطة، فاتُّهم لدى السلطة وصودرت أملاكه. ولم يبق من مصنفاته الكثيرة إلا ترجمة واحدة وعشر رسائل أو نحوها {cite:encyclopaedia-of-islam-2 vol. 3 p. 1011} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1012}."
  en: "Abu Ali Isa ibn Ishaq ibn Zur'a was a Jacobite Christian philosopher, apologist and translator, born in Baghdad in Dhu l-Hijja 331/August 943 and dead on 6 Sha'ban 398/16 April 1008. He studied literature, physics and mathematics and then philosophy under Yahya ibn Adi, and translated or abridged, probably from Syriac, several works of Aristotle, above all the Historia Animalium. He also traded, particularly with Byzantium, was denounced to the authorities and lost his property. Of his many writings only one translation and about ten treatises survive {cite:encyclopaedia-of-islam-2 vol. 3 p. 1011} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1012}."
  ur: "ابو علی عیسیٰ بن اسحاق بن زرعہ یعقوبی مسیحی فلسفی، اپنے مذہب کے مدافع اور مترجم تھے؛ وہ بغداد میں ذوالحجہ 331ھ/اگست 943ء میں پیدا ہوئے اور 6 شعبان 398ھ/16 اپریل 1008ء کو فوت ہوئے۔ انہوں نے ادب، طبیعیات اور ریاضی پڑھنے کے بعد یحییٰ بن عدی کی نگرانی میں فلسفہ پڑھا اور غالباً سریانی سے ارسطو کی کئی کتابوں کا ترجمہ یا اختصار کیا، جن میں سب سے مشہور تاریخ الحیوان ہے۔ وہ تجارت بھی کرتے تھے، خاص طور پر بازنطینی سلطنت کے ساتھ، حکام کے پاس ان کی شکایت کی گئی اور ان کا مال ضبط ہوا۔ ان کی بہت سی تصانیف میں سے صرف ایک ترجمہ اور دس کے لگ بھگ رسالے باقی ہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 1011} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1012}."
