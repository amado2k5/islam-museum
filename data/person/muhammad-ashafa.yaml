summary:
  ar: إمام وصانع سلام نيجيري. المدير التنفيذي المشارك لمركز الوساطة بين الأديان ⁦(IMC)⁩ في كادونا، اشتهر مع القس جيمس ووي بتحويل عداوة مسلحين سابقين إلى شراكة مصالحة، وثّقها فيلم «الإمام والقس».
  en: Nigerian imam and peacemaker. Co-executive director of the Interfaith Mediation Centre (IMC) in Kaduna, known with Pastor James Wuye for turning former militant foes into reconciliation partners,
    documented in the film The Imam and the Pastor.
  ur: نائیجیریائی امام اور صلح کار۔ کادونا میں بین المذاہب ثالثی مرکز ⁦(IMC)⁩ کے شریک ایگزیکٹو ڈائریکٹر؛ پادری جیمز وئے کے ساتھ سابقہ ملیشیا دشمنوں کو صلح جوئی کے ساتھیوں میں بدلنے کے لیے مشہور، جسے فلم
    «The Imam and the Pastor» میں موثق کیا گیا۔
  es: "Imán y pacificador nigeriano. Codirector ejecutivo del Centro de Mediación Interreligiosa (IMC) en Kaduna, conocido junto con el pastor James Wuye por convertir a antiguos adversarios militantes en socios para la reconciliación, como se documenta en la película El imán y el pastor."
  fr: "Imam et artisan de paix nigérian. Codirecteur exécutif du Centre de médiation interconfessionnelle (IMC) de Kaduna, connu avec le pasteur James Wuye pour avoir transformé d'anciens ennemis militants en partenaires de réconciliation, comme le relate le film « L'Imam et le Pasteur »."
  tr: "Nijeryalı bir imam ve barış kurucusudur. Kaduna'daki İnançlararası Arabuluculuk Merkezi'nin (IMC) Eş-İcra Direktörü olarak, eski militanların düşmanlığını uzlaşma ortaklığına dönüştürmesiyle Rahip James Wei ile birlikte ün kazanmıştır; bu durum 'İmam ve Rahip' filminde belgelenmiştir."
  id: "Seorang imam dan pembawa damai Nigeria. Direktur Eksekutif Bersama Interfaith Mediation Center (IMC) di Kaduna, ia menjadi terkenal bersama Pendeta James Wei karena mengubah permusuhan mantan militan menjadi kemitraan rekonsiliasi, yang didokumentasikan dalam film 'Imam and Priest.'"
