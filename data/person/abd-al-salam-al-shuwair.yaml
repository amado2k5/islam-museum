summary:
  ar: "عالم سعودي في الفقه المقارن، أستاذ في قسم العلوم الشرعية والقانونية بكلية الملك فهد الأمنية ومدرّس في الحرمين الشريفين، حصل على الدكتوراه في الفقه المقارن من المعهد العالي للقضاء سنة 1421هـ بامتياز مع مرتبة الشرف الأولى، وهو من طلاب الشيخ ابن باز، وله مؤلفات كثيرة في الفقه والمعاملات المالية المعاصرة وتحقيقات لمتون فقهية."
  en: "Saudi scholar of comparative fiqh, professor in the Department of Sharia and Legal Sciences at King Fahd Security College and a teacher in the Two Holy Mosques. He took his doctorate in comparative fiqh at the Higher Judicial Institute in 1421 AH with first-class honours, studied under Sheikh Ibn Baz, and has written many works on fiqh and contemporary financial transactions and edited classical fiqh texts."
  ur: "فقہِ مقارن کے سعودی عالم، کلیہ الملک فہد الامنیہ میں شعبہ علومِ شرعیہ و قانونیہ کے استاد اور حرمین شریفین کے مدرس ہیں۔ 1421ھ میں المعہد العالی للقضاء سے فقہِ مقارن میں امتیاز اور درجہ شرفِ اول کے ساتھ ڈاکٹریٹ کی، شیخ ابن باز کے شاگردوں میں سے ہیں، اور فقہ و معاصر مالی معاملات پر ان کی کئی تصانیف اور متونِ فقہ کی تحقیقات ہیں۔"
