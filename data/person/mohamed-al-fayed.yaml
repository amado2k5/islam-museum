summary:
  ar: "محمد عبد المنعم الفايد (27 كانون الثاني 1929 – 30 آب 2023)، رجل أعمال مصري عاش وعمل في بريطانيا منذ منتصف الستينيات. امتلك متجر هارودز في لندن (1985–2010) وفندق ريتز باريس ونادي فولهام لكرة القدم، وقُدّرت ثروته عند وفاته بملياري دولار. مات ابنه دودي مع الأميرة ديانا في حادث باريس سنة 1997، وبعد وفاة الفايد وُجهت إليه اتهامات من أكثر من مئتي امرأة بالاعتداء الجنسي."
  en: "Mohamed Abdel Moneim Al-Fayed (27 January 1929 – 30 August 2023) was an Egyptian businessman who lived and worked in Britain from the mid-1960s. He owned Harrods in London (1985-2010), the Hôtel Ritz Paris and Fulham Football Club, and his fortune at his death was estimated at US$2 billion. His son Dodi died with Diana, Princess of Wales, in the 1997 Paris car crash; after Al-Fayed's death, more than 200 women accused him of sexual assault."
  ur: "محمد عبد المنعم الفاید (27 جنوری 1929 – 30 اگست 2023) مصری کاروباری شخصیت تھے جو 1960 کی دہائی کے وسط سے برطانیہ میں مقیم رہے۔ وہ لندن کے ہیرڈز (1985–2010)، پیرس کے رٹز ہوٹل اور فلہم فٹ بال کلب کے مالک تھے، اور ان کی وفات پر ان کی دولت کا تخمینہ دو ارب ڈالر لگایا گیا۔ ان کے بیٹے دودی 1997 میں پیرس کے کار حادثے میں شہزادی ڈیانا کے ساتھ جاں بحق ہوئے؛ الفاید کی وفات کے بعد دو سو سے زائد خواتین نے ان پر جنسی زیادتی کے الزامات لگائے۔"

