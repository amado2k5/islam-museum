summary:
  ar: "فقيه مالكي، إمام جامع القرويين بفاس؛ أخذ عن عبد الرحمن بن عفان الجزولي وغيره، وعنه ابنه أبو الربيع سليمان؛ من تصانيفه تقييد على رسالة أبي زيد القيرواني {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  en: "A Maliki jurist, imam of the Qarawiyyin mosque in Fez; he studied with Abd al-Rahman ibn Affan al-Jazuli and others, and his son Abu al-Rabi Sulayman studied with him; his works include a gloss on the Risala of Abu Zayd al-Qayrawani {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  es: "Un jurista malikí, imán de la mezquita Qarawiyyin en Fez; estudió con Abd al-Rahman ibn Affan al-Jazuli y otros, y su hijo Abu al-Rabi Sulayman estudió con él; entre sus obras se incluye una glosa sobre la Risala de Abu Zayd al-Qayrawani {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  fr: "Juriste malikite, imam de la mosquée Qarawiyyin de Fès; il étudia avec Abd al-Rahman ibn Affan al-Jazuli et d'autres, et son fils Abu al-Rabi Sulayman étudia avec lui; ses œuvres comprennent une glose sur la Risala d'Abu Zayd al-Qayrawani {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5161}."
  ur: "ایک مالکی فقیہ، فز میں قراویین مسجد کے امام؛ اس نے عبدالرحمٰن بن عفان الجزولی اور دوسروں کے ساتھ تعلیم حاصل کی، اور ان کے بیٹے ابو الربیع سلیمان نے ان سے تعلیم حاصل کی۔ ان کی تصانیف میں ابو زید القیروانی کے رسالہ پر روشنی ڈالی گئی ہے۔"
  tr: "Maliki hukukçu, Fez'deki El-Karawiyyin Camii'nin imamı; Abdülrahman bin Affan el-Cezuli'nin yanında eğitim aldı ve ondan oğlu Ebu el-Rabi' Süleyman; eserleri arasında Ebu Zeyd el-Keyrawani'nin risalesi üzerine bir kayıt da bulunmaktadır {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.5161}."
  id: "Maliki ahli hukum, imam Masjid Al-Qarawiyyin di Fez; belajar di bawah Abd al-Rahman ibn Affan al-Jazuli dan lainnya, serta dari beliau putranya Abu al-Rabi' Sulayman; di antara karyanya terdapat catatan tentang risalah Abu Zayd al-Qayrawani {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5161}."
