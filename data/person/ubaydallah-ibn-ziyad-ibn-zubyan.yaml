id: person/ubaydallah-ibn-ziyad-ibn-zubyan
class: person
label: { ar: "عبيد الله بن زياد بن ظبيان", en: "Ubaydallah ibn Ziyad ibn Zubyan", es: "Ubaydallah ibn Ziyad ibn Zubyan", fr: "Ubaydallah ibn Ziyad ibn Zubyan", ur: "عبیداللہ ابن زیاد بن ثوبیان" }
summary:
  ar: "عبيد الله بن زياد بن ظبيان أحد بني عائشة بن مالك بن تيم الله بن ثعلبة بن عكابة؛ ثأر بأخيه النابي فطعن مطرف بن سيدان فقتله ثم لحق بعبد الملك بن مروان وقاتل معه مصعب بن الزبير فقتله واحتز رأسه."
  en: "Ubaydallah ibn Ziyad ibn Zubyan of Taym Allah; avenged his brother al-Nabi by stabbing Mutarrif ibn Saydan dead, then fled to Abd al-Malik — at whose side he fought Mus'ab, killed him and took his head."
  es: "Ubaydallah ibn Ziyad ibn Zubyan de Taym Allah; vengó a su hermano al-Nabi apuñalando a muerte a Mutarrif ibn Saydan, luego huyó a Abd al-Malik, a cuyo lado luchó contra Mus'ab, lo mató y le cortó la cabeza."
  fr: "Ubaydallah ibn Ziyad ibn Zubyan de Taym Allah; vengea son frère al-Nabi en poignardant à mort Mutarrif ibn Saydan, puis s'enfuit auprès d'Abd al-Malik — aux côtés duquel il combattit Mus'ab, le tua et prit sa tête."
  ur: "تیم اللہ کے عبیداللہ ابن زیاد بن ثوبیان؛ اس نے اپنے بھائی النبی کا بدلہ مطرف بن سیدان کو چھرا گھونپ کر ہلاک کیا، پھر عبد الملک کے پاس بھاگا - جس کی طرف سے وہ مصعب سے لڑا، اسے قتل کر دیا اور اس کا سر لے لیا۔"
  tr: "Eyşe ibn Malik ibn Teymullah ibn Teymulah ibn Teylabah ibn Ukabah'ın oğullarından biri olan Ubeyd Allah ibn Ziyad ibn Dhubyan, kardeşi el-Nabi'nin intikamını almak için Mutraf bin Saydan'ı bıçaklayıp öldürdü. Sonra Abdülmelik ibn Mervan'a katıldı ve Mus'ab ibn al-Zubayr ile savaştı, onu öldürdü ve başı kesildi."
  id: "Ubayd Allah ibn Ziyad ibn Dhubyan, salah satu putra Aisha ibn Malik ibn Taymullah ibn Tha'labah ibn Ukabah; ia membalas dendam atas saudaranya al-Nabi dengan menikam Mutraf ibn Saydan dan membunuhnya. Kemudian ia bergabung dengan Abd al-Malik ibn Marwan dan bertempur melawan Mus'ab ibn al-Zubayr, membunuhnya dan kepalanya dipenggal."
