summary:
  ar: "القاضي عز الدين ابن الفرات الحنفي الإمام المسند المعمر المحدث الرحلة المؤرخ؛ نشأ بالمدينة فحفظ القرآن وتلا بالسبع على الشيخين عبد الله الشنيني ويحيى التلساني الضرير وعن والده الجلال أخذ النحو وعن أبيه وغيره الفقه وانتفع بأخيه وسمع على ابن صديق ختم الصحيح وعلى أبيه الزين العراقي والمراغي وعبد الرحمن الأنصاري قاضي المدينة والبرهان بن فرحون وابن الجزري وناصر الدين بن صالح وقرأ على الجمال الأسيوطي وأجاز له أبو هريرة بن الذهبي والتنوخي والبلقيني وابن الملقن وأبو عبد الله بن مرزوق الكبير في آخرين، وحج غير مرة وبرع في العربية وتعانى الأدب وجمع لنفسه ديواناً وأنشأ عدة رسائل بحيث انفرد بذلك، ودرس وحدث بالبخاري وغيره وسمع منه الطلبة ولقيه البقاعي فكتب عنه وكان فاضلاً بارعاً ناظماً ناثراً كيساً حسن المجالسة كثير النوادر والملح أكرم زائد {cite:shadharat-dhahab p. 269-270}."
  en: "Ibn al-Furat — the travelled Hanbali-historian of Mecca and Medina, musnid of his age; heard the great Egyptians (al-'Iraqi, al-Maraghi, Ibn al-Jazari) and compiled his own diwan and epistles; al-Buqa'i met and wrote from him; died 851 {cite:shadharat-dhahab p. 269-270}."
  es: "Ibn al-Furat — el historiador hanbalí viajero de La Meca y Medina, musnid de su época; escuchó a los grandes egipcios (al-'Iraqi, al-Maraghi, Ibn al-Jazari) y compiló su propio diwan y epístolas; al-Buqa'i lo conoció y escribió a partir de él; murió en 851 {cite:shadharat-dhahab p. 269-270}."
  fr: "Ibn al-Furat — l'historien hanbalite voyageur de La Mecque et de Médine, musnid de son époque; écouta les grands Égyptiens (al-'Iraqi, al-Maraghi, Ibn al-Jazari) et compila son propre diwan et ses épîtres; al-Buqa'i le rencontra et écrivit de lui; mourut en 851 {cite: shadharat-dhahab p. 269-270}."
  ur: "ابن الفرات - مکہ اور مدینہ کا سفر کرنے والا حنبلی مورخ، اپنی عمر کا مسنید؛ عظیم مصریوں ⁦(العراقی، المراثی، ابن الجزری)⁩ کو سنا اور اپنے دیوان اور خطوط مرتب کیے؛ البقاعی نے ملاقات کی اور ان سے لکھا۔ متوفی 851 {حوالہ: شدارت ذہاب صفحہ 269-270}۔"
  tr: "Hakim İzzeddin İbn el-Furat el-Hanafi, imam, uzun yıllar Musnad, hadis âlimi, gezgin, tarihçi; Medine'de büyüdü, Kur'an'ı ezberledi ve iki şeyh Abdullah el-Şenini ile Yahya el-Tilsani el-Derir'in yanında yedi kez okudu. Dilbilgisi eğitimini babası el-Celal'den, babasından ve diğerlerinden ise fıkıh öğrendi. Kardeşinden faydalandı ve İbn Siddik, Sahih'in tamamlanmasını ve babası el-Zeyn el-Irakı, el-Maragi, Medine'nin hakimi Abdurrahman el-Ensari, el-Burhan bin Farhun, İbn el-Cezari, Nasır eddin bin Salih ve el-Cemal el-Esyuti'nin yanında eğitim almıştır. Ebu Hureyre ibn el-Dhahabi, el-Tanukhi, el-Balkıni ve İbn Eğitmen ve Ebu Abdullah bin Marzuq el-Kabir de dahil olmak üzere birçok kişidir. Hac ayinlerini birden fazla kez yaptı, Arapça'da üstün başarı gösterdi, edebiyatta yetenekliydi, bir eser derlemesi hazırladı ve kendisi için birkaç risale yazdı; bu da onu benzersiz kılıyordu. Buhari ve diğerlerinde okudu ve rivayet etti, öğrencilerden dinledi, Bikai'de onunla tanıştı ve hakkında yazdı. Erdemli, yetenekli bir şair, düzyazı ve etkileyici bir dilimdi; birçok nadir anekdotu vardı ve tuz daha cömertti {atıf:shadharat-dhahab, s. 269-270}."
  id: "Hakim Izz al-Din Ibn al-Furat al-Hanafi, imam, Musnad lama, ulama hadis, pelancong, sejarawan; ia tumbuh di Madinah, menghafal Al-Qur'an, dan membacakan tujuh kali di bawah dua sheikh Abdullah al-Shanini dan Yahya al-Tilsani al-Darir. Ia belajar tata bahasa dari ayahnya al-Jalal, dan dari ayahnya serta orang lain yang belajar hukum. Ia mendapat manfaat dari saudaranya dan mendengar dari Ibib n Siddiq menyelesaikan Sahih, dan dari ayahnya al-Zayn al-Iraqi, al-Maraghi, Abd al-Rahman al-Ansari, hakim Madinah, al-Burhan ibn Farhun, Ibn al-Jazari, Nasir al-Din ibn Salih, dan belajar di bawah bimbingan al-Jamal al-Asyuti. Abu Huraira ibn al-Dhahabi, al-Tanukhi, al-Balqini, dan Ibn Dosen dan Abu Abdullah ibn Marzuq al-Kabir di antara lainnya. Ia berhaji lebih dari sekali, unggul dalam bahasa Arab, mahir dalam sastra, mengumpulkan karya, dan menulis beberapa risalah untuk dirinya sendiri, membuatnya unik. Ia belajar dan bercerita dalam Bukhari dan lainnya, mendengar dari murid-murid, bertemu dengannya di Biqa'i, dan menulis tentangnya. Ia adalah penyair yang berbudi luhur, terampil, prosa, dan fasih, dengan banyak anekdot langka, dan garamnya lebih murah hati {cite:shadharat-dhahab, hlm. 269-270}."
