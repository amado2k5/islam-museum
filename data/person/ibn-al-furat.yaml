gender: male
summary:
  ar: "القاضي عز الدين ابن الفرات الحنفي الإمام المسند المعمر المحدث الرحلة المؤرخ؛ نشأ بالمدينة فحفظ القرآن وتلا بالسبع على الشيخين عبد الله الشنيني ويحيى التلساني الضرير وعن والده الجلال أخذ النحو وعن أبيه وغيره الفقه وانتفع بأخيه وسمع على ابن صديق ختم الصحيح وعلى أبيه الزين العراقي والمراغي وعبد الرحمن الأنصاري قاضي المدينة والبرهان بن فرحون وابن الجزري وناصر الدين بن صالح وقرأ على الجمال الأسيوطي وأجاز له أبو هريرة بن الذهبي والتنوخي والبلقيني وابن الملقن وأبو عبد الله بن مرزوق الكبير في آخرين، وحج غير مرة وبرع في العربية وتعانى الأدب وجمع لنفسه ديواناً وأنشأ عدة رسائل بحيث انفرد بذلك، ودرس وحدث بالبخاري وغيره وسمع منه الطلبة ولقيه البقاعي فكتب عنه وكان فاضلاً بارعاً ناظماً ناثراً كيساً حسن المجالسة كثير النوادر والملح أكرم زائد {cite:shadharat-dhahab p. 269-270}."
  en: "Ibn al-Furat — the travelled Hanbali-historian of Mecca and Medina, musnid of his age; heard the great Egyptians (al-'Iraqi, al-Maraghi, Ibn al-Jazari) and compiled his own diwan and epistles; al-Buqa'i met and wrote from him; died 851 {cite:shadharat-dhahab p. 269-270}."
