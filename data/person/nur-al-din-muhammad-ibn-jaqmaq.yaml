summary:
  ar: "نور الدين أبو المعالي محمد بن السلطان الظاهر جقمق؛ ولد في رجب سنة ست عشرة وثمانمائة وقرأ القرآن واشتغل بالعلم وحفظ كتباً ومهر في مدة يسيرة ولازم الشيخ سعد الدين بن الديري قبل أن يلي القضاء وأخذ عن الكافيجي وغيره وكان محباً في العلم والعلماء، وولي الإمارة بعد سلطنة أبيه بقليل وجلس رأس الميسرة وأصابه مرض السل ثم بعده توفي ليلة الاثنين الثاني عشر من ذي الحجة سنة سبع وأربعين وثمانمائة بعلة البطن بالقاهرة {cite:shadharat-dhahab p. 261}."
  en: "Nur al-Din Muhammad — Sultan Jaqmaq's scholar son (b. Rajab 816), pupil of Ibn al-Dayri and al-Kafiyaji, 'a lover of learning and scholars'; emir shortly after his father's accession, then stricken with consumption and a bowel illness; died Sunday night 12 Dhu al-Hijja 847 in Cairo {cite:shadharat-dhahab p. 261}."
