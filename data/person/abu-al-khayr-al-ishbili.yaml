id: person/abu-al-khayr-al-ishbili
class: person
label:
  ar: "أبو الخير الإشبيلي"
  en: "Abu l-Khayr al-Ishbili"
  ur: "ابو الخیر الاشبیلی"
  fr: "Abu l-Khayr al-Ishbili"
  es: "Abu l-Khayr al-Ishbili"
summary:
  ar: "أبو الخير الإشبيلي، المعروف بالمشجّر، من أهل إشبيلية، صاحب كتاب الفلاحة في الزراعة، لا يُعرف تاريخ ولادته ولا وفاته، ونقل عنه ابن العوام في النصف الثاني من القرن السادس الهجري. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  en: "Abu l-Khayr al-Ishbili, surnamed al-Mushajjir, 'the arboriculturist', a native of Seville and author of the Kitab al-Filaha on agriculture, whose birth and death dates are unknown; Ibn al-'Awwam quotes him in the second half of the sixth/twelfth century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  ur: "ابو الخیر الاشبیلی، جو المشجّر ⁦(باغبانی کا ماہر)⁩ کے لقب سے مشہور تھے، اشبیلیہ کے رہنے والے اور کتاب الفلاحہ ⁦(زراعت)⁩ کے مصنف، جن کی ولادت و وفات کا علم نہیں؛ ابن العوام نے چھٹی/بارہویں صدی کے دوسرے نصف میں ان کا حوالہ دیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  fr: "Abu l-Khayr al-Ishbili, surnommé al-Mushajjir, « l'arboriculteur », natif de Séville et auteur du Kitab al-Filaha sur l'agriculture, dont les dates de naissance et de mort sont inconnues ; Ibn al-'Awwam le cite dans la seconde moitié du sixième/douzième siècle. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  es: "Abu l-Khayr al-Ishbili, apodado al-Mushajjir, «el arboricultor», natural de Sevilla y autor del Kitab al-Filaha sobre agricultura, cuyas fechas de nacimiento y muerte se desconocen; Ibn al-'Awwam lo cita en la segunda mitad del siglo VI/XII. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  tr: "Sevilla'lı olan ve tarım üzerine bir kitap yazan Ebu el-Hayr el-İşbili, diğer adıyla el-Muşajjar'dır. Doğum ve ölüm tarihleri bilinmemektedir, ancak Hicri 6. yüzyılın ikinci yarısında İbn el-Evvem tarafından alıntılanmıştır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  id: "Abu al-Khayr al-Ishbili, yang dikenal sebagai al-Mushajjar, berasal dari Sevilla dan merupakan penulis buku tentang pertanian. Tanggal lahir dan kematiannya tidak diketahui, tetapi ia dikutip oleh Ibn al-Awwam pada paruh kedua abad ke-6 Hijriah. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
