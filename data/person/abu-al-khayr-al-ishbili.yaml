summary:
  ar: "أبو الخير الإشبيلي، المعروف بالمشجّر، من أهل إشبيلية، صاحب كتاب الفلاحة في الزراعة، لا يُعرف تاريخ ولادته ولا وفاته، ونقل عنه ابن العوام في النصف الثاني من القرن السادس الهجري. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  en: "Abu l-Khayr al-Ishbili, surnamed al-Mushajjir, 'the arboriculturist', a native of Seville and author of the Kitab al-Filaha on agriculture, whose birth and death dates are unknown; Ibn al-'Awwam quotes him in the second half of the sixth/twelfth century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
  ur: "ابو الخیر الاشبیلی، جو المشجّر (باغبانی کا ماہر) کے لقب سے مشہور تھے، اشبیلیہ کے رہنے والے اور کتاب الفلاحہ (زراعت) کے مصنف، جن کی ولادت و وفات کا علم نہیں؛ ابن العوام نے چھٹی/بارہویں صدی کے دوسرے نصف میں ان کا حوالہ دیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 154}"
