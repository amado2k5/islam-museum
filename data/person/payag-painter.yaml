id: person/payag-painter
class: person
label: { ar: "پياگ ⁦(مصور مغولي)⁩", en: "Payag (Mughal painter)", ur: "پیاگ ⁦(مغل مصور)⁩", es: "Payag (Mughal painter)", fr: "Payag (Mughal painter)" }
summary:
  ar: "مصور مغولي أخو بالچند، بدأ في تسعينيات القرن السادس عشر ثم برز في عهد شاه جهان بأجرأ صفحات «پادشاهنامه» وندسور، ومنها «مشهد معركة»، واشتهر بمشاهد الليل المضاءة بشمعة {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}."
  en: "Mughal painter, brother of Balchand, active from the 1590s, who under Shah Jahan painted some of the most brilliant and innovative pages of the Windsor Padshah-nama, including a Battle Scene, and candle-lit night scenes {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}."
  ur: "مغل مصور، بال چند کے بھائی، 1590ء کی دہائی سے فعال، جنہوں نے شاہ جہان کے دور میں ونڈسر پادشاہنامہ کے سب سے شاندار اور نئے صفحات بنائے، جن میں «جنگ کا منظر» ہے، اور شمع سے روشن رات کے مناظر {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}۔"
  es: "Pintor mogol, hermano de Balchand, activo desde la década de 1590, que bajo el reinado de Shah Jahan pintó algunas de las páginas más brillantes e innovadoras del Padshah-nama de Windsor, incluyendo una escena de batalla y escenas nocturnas a la luz de las velas {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}."
  fr: "Peintre moghol, frère de Balchand, actif à partir des années 1590, qui, sous Shah Jahan, a peint certaines des pages les plus brillantes et innovantes du Windsor Padshah-nama, dont une scène de bataille et des scènes nocturnes éclairées aux chandelles {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}."
  tr: "Balchand'ın kardeşi olan bir Babür fotoğrafçı olan Sher, 1790'larda başladı ve ardından Şah Cahan döneminde Windsor'un 'Peşnameh' adlı eserinin en cesur sayfalarıyla, 'Savaş Sahnesi' dahil olmak üzere ortaya çıktı ve mum ışığında sahne sahneleriyle ünlendi {cite:beach-grand-mogul-1978 s. 26} {cite:beach-grand-mogul-1978 s. 151}."
  id: "Sebagai fotografer Mughal yang merupakan saudara Balchand, ia memulai kariernya pada tahun 1790-an dan kemudian muncul selama masa pemerintahan Shah Jahan dengan halaman-halaman paling berani dari 'Pashchnameh' karya Windsor, termasuk 'Battle Scene,' dan menjadi terkenal karena adegan malam yang diterangi lilin {cite:beach-grand-mogul-1978 hlm. 26} {cite:beach-grand-mogul-1978 hlm. 151}."
