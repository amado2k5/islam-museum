summary:
  ar: "مصور مغولي أخو بالچند، بدأ في تسعينيات القرن السادس عشر ثم برز في عهد شاه جهان بأجرأ صفحات «پادشاهنامه» وندسور، ومنها «مشهد معركة»، واشتهر بمشاهد الليل المضاءة بشمعة {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}."
  en: "Mughal painter, brother of Balchand, active from the 1590s, who under Shah Jahan painted some of the most brilliant and innovative pages of the Windsor Padshah-nama, including a Battle Scene, and candle-lit night scenes {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}."
  ur: "مغل مصور، بال چند کے بھائی، 1590ء کی دہائی سے فعال، جنہوں نے شاہ جہان کے دور میں ونڈسر پادشاہنامہ کے سب سے شاندار اور نئے صفحات بنائے، جن میں «جنگ کا منظر» ہے، اور شمع سے روشن رات کے مناظر {cite:beach-grand-mogul-1978 p. 26} {cite:beach-grand-mogul-1978 p. 151}۔"
