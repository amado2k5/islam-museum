summary:
  ar: "إبراهيم بن فائد بن موسى الزواوي القسنطيني المعروف بسيدي بوسحاقي، فقيه مالكي جزائري ولد في جبل جرجر وتعلم في بجاية وتونس واستقر في قسنطينة، من كتبه تفسير القرآن وتسهيل السبيل في شرح مختصر خليل، توفي سنة 857 هـ."
  en: "Ibrahim ibn Fa'id ibn Musa al-Zawawi al-Qusantini, known as Sidi Boushaki, an Algerian Maliki jurist born in the Jurjura mountains, educated in Bejaia and Tunis and settled in Constantine; author of a Qur'anic exegesis and of Tashil al-Sabil, a commentary on the Mukhtasar of Khalil; died 857 AH (1453)."
