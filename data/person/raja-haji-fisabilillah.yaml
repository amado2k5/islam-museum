summary:
  ar: "راجا حاجي في سبيل الله ⁦(1727 – 18 يونيو 1784)⁩، واسمه الكامل راجا حاجي في سبيل الله بن داينغ جيلاك، أمير محارب من البوغيس والملايو تولّى منصب يانغ دي برتوان مودا ⁦(نائب السلطان)⁩ الرابع في رياو من 1777 إلى 1784. كان صانع ملوك في عالم الملايو: نصّب أول سلطان لبونتياناك سنة 1771، وأخضع جمبي وإندراغيري وسياك وفيرق، ثم سقط برصاصة هولندية في خليج كيتابانغ وهو يحاصر ملقا الهولندية سنة 1784. أعلنته إندونيسيا بطلًا قوميًا سنة 1997."
  en: "Raja Haji Fisabilillah (1727 – 18 June 1784), full name Raja Haji Fisabilillah ibni Daeng Chelak, was a Bugis-Malay warrior prince who served as the fourth Yang di-Pertuan Muda (viceroy) of Riau from 1777 to 1784. A kingmaker across the Malay world — he installed the first sultan of Pontianak in 1771 and coerced Jambi, Indragiri, Siak and Perak — he was killed by a Dutch shot at Teluk Ketapang while besieging Dutch Malacca in 1784. Indonesia proclaimed him a National Hero in 1997."
  ur: "راجا حاجی فی سبیل اللہ ⁦(1727ء – 18 جون 1784ء)⁩، پورا نام راجا حاجی فی سبیل اللہ ابن دائینگ چیلاک، بوگیس و ملای جنگجو شہزادے تھے جو 1777ء سے 1784ء تک ریاو کے چوتھے یانگ دی پرتوان مودا ⁦(نائب السلطان)⁩ رہے۔ وہ عالمِ ملای میں بادشاہ گر تھے: 1771ء میں انہوں نے پونتیاناک کے پہلے سلطان کو تخت پر بٹھایا اور جمبی، اندراگیری، سیاک اور پیراک کو زیر کیا؛ 1784ء میں ملاکا کے محاصرے کے دوران تیلوک کیتاپانگ میں ولندیزی گولی سے شہید ہوئے۔ انڈونیشیا نے 1997ء میں انہیں قومی ہیرو قرار دیا۔"
  es: "Raja Haji Fisabilillah (1727 - 18 de junio de 1784), nombre completo Raja Haji Fisabilillah ibni Daeng Chelak, fue un príncipe guerrero bugis-malayo que sirvió como cuarto Yang di-Pertuan Muda (virrey) de Riau de 1777 a 1784. Un hacedor de reyes en todo el mundo malayo: instaló al primer sultán de Pontianak en 1771 y lo obligó. Jambi, Indragiri, Siak y Perak: fue asesinado por un disparo holandés en Teluk Ketapang mientras asediaba la Malaca holandesa en 1784. Indonesia lo proclamó Héroe Nacional en 1997."
  fr: "Raja Haji Fisabilillah (1727 – 18 juin 1784), nom complet Raja Haji Fisabilillah ibni Daeng Chelak, était un prince guerrier bugis-malais qui fut le quatrième Yang di-Pertuan Muda (vice-roi) de Riau de 1777 à 1784. Faiseur de rois dans le monde malais – il installa le premier sultan de Pontianak en 1771 et a contraint Jambi, Indragiri, Siak et Perak - il a été tué par un tir hollandais à Teluk Ketapang alors qu'il assiégeait Malacca néerlandaise en 1784. L'Indonésie l'a proclamé héros national en 1997."
  tr: "Raja Haji fi Sabilullah (1727 – 18 Haziran 1784), tam adı Raja Haji fi Sabilullah bin Daeng Jilak, 1777'den 1784'e kadar Riau'da dördüncü Yang de Pertuan Muda (vali) olarak görev yapan Bogis ve Malaylardan savaşçı bir prenstir. Malay dünyasında kral yapıcı bir figürdü: 1771'de Pontianak'ın ilk Sultanını atadı, Jambi, Indraguiri, Siak ve Firq'u boyun eğdirdi, ardından 1784'te Hollanda Malaga'sını kuşatırken Kitapang Körfezi'nde Hollanda kurşunuyla öldü. Endonezya onu 1997'de ulusal kahraman ilan etti."
  id: "Raja Haji fi Sabilullah (1727 – 18 Juni 1784), nama lengkap Raja Haji fi Sabilullah bin Daeng Jilak, adalah seorang pangeran pejuang dari Bogis dan Melayu yang menjabat sebagai Yang de Pertuan Muda (wakil raja) keempat di Riau dari tahun 1777 hingga 1784. Ia adalah seorang pembuat raja di dunia Melayu: ia mengangkat Sultan pertama Pontianak pada tahun 1771, menaklukkan Jambi, Indraguiri, Siak, dan Firq, lalu gugur oleh peluru Belanda di Teluk Kitapang saat mengepung Malaga Belanda pada tahun 1784. Indonesia menyatakan dia sebagai pahlawan nasional pada tahun 1997."

