summary:
  ar: "راجا حاجي في سبيل الله (1727 – 18 يونيو 1784)، واسمه الكامل راجا حاجي في سبيل الله بن داينغ جيلاك، أمير محارب من البوغيس والملايو تولّى منصب يانغ دي برتوان مودا (نائب السلطان) الرابع في رياو من 1777 إلى 1784. كان صانع ملوك في عالم الملايو: نصّب أول سلطان لبونتياناك سنة 1771، وأخضع جمبي وإندراغيري وسياك وفيرق، ثم سقط برصاصة هولندية في خليج كيتابانغ وهو يحاصر ملقا الهولندية سنة 1784. أعلنته إندونيسيا بطلًا قوميًا سنة 1997."
  en: "Raja Haji Fisabilillah (1727 – 18 June 1784), full name Raja Haji Fisabilillah ibni Daeng Chelak, was a Bugis-Malay warrior prince who served as the fourth Yang di-Pertuan Muda (viceroy) of Riau from 1777 to 1784. A kingmaker across the Malay world — he installed the first sultan of Pontianak in 1771 and coerced Jambi, Indragiri, Siak and Perak — he was killed by a Dutch shot at Teluk Ketapang while besieging Dutch Malacca in 1784. Indonesia proclaimed him a National Hero in 1997."
  ur: "راجا حاجی فی سبیل اللہ (1727ء – 18 جون 1784ء)، پورا نام راجا حاجی فی سبیل اللہ ابن دائینگ چیلاک، بوگیس و ملای جنگجو شہزادے تھے جو 1777ء سے 1784ء تک ریاو کے چوتھے یانگ دی پرتوان مودا (نائب السلطان) رہے۔ وہ عالمِ ملای میں بادشاہ گر تھے: 1771ء میں انہوں نے پونتیاناک کے پہلے سلطان کو تخت پر بٹھایا اور جمبی، اندراگیری، سیاک اور پیراک کو زیر کیا؛ 1784ء میں ملاکا کے محاصرے کے دوران تیلوک کیتاپانگ میں ولندیزی گولی سے شہید ہوئے۔ انڈونیشیا نے 1997ء میں انہیں قومی ہیرو قرار دیا۔"

