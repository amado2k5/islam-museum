      himself. The tradition he ruled is stated in full — he was a
      prince of the Islamised Bugis-Malay world of Riau and Johor,
      his very style Fisabilillah means "in the path of God", and
      after his body was recovered from its first burial the royal
      family had him reburied with a proper Muslim burial at Bukit
      Kursi on Penyengat Island; his campaigns were fought in a
      Malay world whose scholarly tradition was Shafi'i. A name
      style, a Muslim burial and a region's school are context, not
      a naming of the man's school, so his faith is recorded as
