  note: "The English article gives his death on 18 June 1784 at Teluk Ketapang, Malacca, shot from a distance while his forces surrounded a Dutch fort, and the Indonesian article agrees on Kampung Ketapang, Malacca. The Malay article's lead agrees on 1784, but its infobox corrupts the death year and the end of his reign to 1787 against its own text. Wikidata gives the year only, and its place-of-death value is Penyengat Island — that is his burial island, not the place of death: per the English article (after Munshi Abdullah and the Indonesian culture ministry), the Dutch first buried his recovered body in a pig farm, and after the English took Malacca his family had him reburied with a proper Muslim burial at Bukit Kursi on Penyengat Island, in the reign of his son Raja Ja'far."
