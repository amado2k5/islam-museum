summary:
  ar: "قاضي القضاة بدمشق؛ لازم القاضي كمال الدين التفليسي حتى صار من أعيان أصحابه، ودرس بالشامية وولي وكالة بيت المال ثم قضاء الشام، وعزل بابن خلكان أول سنة سبع وسبعين فظهرت منه نهضة وشهامة وقيام في الحق، ثم أعيد إلى منصبه أول سنة ثمانين، ثم امتحن في رجب سنة اثنتين وثمانين وأخرجوا عليه محضراً بنحو مائة ألف دينار إلى أن خلصه الله، فانقطع ببستانه حتى توفي؛ ولما حضرته الوفاة جمع أهله وتوضأ وصلى بهم وقال هللوا معي فبقي يهلل معهم حتى توفي مع قول لا إله إلا الله {cite:shadharat-dhahab p. 654}."
  en: "Damascus's chief qadi — dismissed for Ibn Khallikan in 677, reinstated 680, then dragged through a 100,000-dinar mahdar in 682 'until God delivered him'; he died having gathered his household to pray, still saying la ilaha illa Allah {cite:shadharat-dhahab p. 654}."
  es: "El cadí principal de Damasco, destituido en favor de Ibn Khallikan en 677, restituido en 680 y luego sometido a un juicio con un mahdar de 100.000 dinares en 682 \"hasta que Dios lo liberó\"; murió habiendo reunido a su familia para orar, diciendo aún la ilaha illa Allah {cita: shadharat-dhahab p. 654}."
  fr: "Le cadi en chef de Damas — renvoyé pour Ibn Khallikan en 677, réintégré en 680, puis traîné à travers un mahdar de 100 000 dinars en 682 « jusqu'à ce que Dieu le délivre »; il mourut après avoir réuni sa famille pour prier, disant toujours la ilaha illa Allah {cite:shadharat-dhahab p. 654}."
  ur: "دمشق کا سردار قادی - ابن خلیقان کے لیے 677 میں برطرف کیا گیا، 680 کو بحال کیا گیا، پھر 682 میں 100,000 دینار مہدر کے ذریعے گھسیٹ لیا گیا جب تک کہ خدا نے اسے نجات نہ دے دی؛ اس نے اپنے گھر والوں کو نماز کے لیے جمع کرتے ہوئے لا الہ الا اللہ کہہ کر وفات پائی۔ 654}۔"
  tr: "Şam'da Baş Yargıç; Yargıç Kamal al-Din al-Tiflisi ile yakından ilgilendi ve onun önde gelen figürlerinden biri oldu. El-Şamiye'de eğitim gördü, Beyt el-Mal'in vekili olarak atandı, ardından Şam yargısı olarak yargılandı. Yetmiş yedi yılın ilk yılında İbn Hallikan tarafından görevden alındı; bir rönesans, şövalyelik ve adaleti savundu. Seksen yılın ilk yılında görevine iade edildi, ardından seksen iki yılının Recep'inde sınava girdi ve Allah onu kurtarana kadar yaklaşık yüz bin dinar ceza verildi. Meyve bahçesinden kesildi ve ölene kadar kesildi; ölüm yaklaşırken ailesini topladı, abdest aldı, onlarla dua etti ve \"Benimle ilahi söyleyin\" dedi. Ölene kadar onlarla birlikte 'Allah'tan başka tanrı yoktur' diyerek ilahi söylemeye devam etti {atıf: şadharat-dhahab, s. 654}."
  id: "Ketua Hakim di Damaskus; ia mengikuti Hakim Kamal al-Din al-Tiflisi dengan dekat hingga menjadi salah satu tokoh terkemuka. Ia belajar di Al-Shamiyah, diangkat sebagai wakil Bayt al-Mal, kemudian mengadili al-Sham. Ia diberhentikan oleh Ibn Khallikan pada tahun pertama tujuh puluh tujuh, menunjukkan kebangkitan, kesatria, dan menegakkan keadilan. Ia kemudian diangkat kembali pada tahun pertama delapan puluh, kemudian mengikuti ujian di Rajab tahun delapan puluh dua, dan sejumlah sekitar seratus ribu dinar dikeluarkan melawannya sampai Tuhan menyelamatkannya. Ia dipisahkan dari kebunnya hingga meninggal; ketika kematian mendekat, ia mengumpulkan keluarganya, melakukan wudtu, berdoa bersama mereka, dan berkata, \"Nyanyikan bersama aku.\" Ia terus bernyanyi bersama mereka hingga meninggal sambil berkata 'Tidak ada tuhan selain Allah' {cite:shadharat-dhahab, hlm. 654}."
