summary:
  ar: "قاضي القضاة بدمشق؛ لازم القاضي كمال الدين التفليسي حتى صار من أعيان أصحابه، ودرس بالشامية وولي وكالة بيت المال ثم قضاء الشام، وعزل بابن خلكان أول سنة سبع وسبعين فظهرت منه نهضة وشهامة وقيام في الحق، ثم أعيد إلى منصبه أول سنة ثمانين، ثم امتحن في رجب سنة اثنتين وثمانين وأخرجوا عليه محضراً بنحو مائة ألف دينار إلى أن خلصه الله، فانقطع ببستانه حتى توفي؛ ولما حضرته الوفاة جمع أهله وتوضأ وصلى بهم وقال هللوا معي فبقي يهلل معهم حتى توفي مع قول لا إله إلا الله {cite:shadharat-dhahab p. 654}."
  en: "Damascus's chief qadi — dismissed for Ibn Khallikan in 677, reinstated 680, then dragged through a 100,000-dinar mahdar in 682 'until God delivered him'; he died having gathered his household to pray, still saying la ilaha illa Allah {cite:shadharat-dhahab p. 654}."
