summary:
  ar: "عالم وداعية نيجيري وُلد في يامالتو/ديبا بولاية غومبي. بدأ في مجموعة الإسعافات الشبابية التابعة لجماعة إزالة البدعة وإقامة السنة (إزالا)، ودرس في السعودية، وصار الأمين العام الوطني للجماعة منذ ديسمبر 2011. يُعرف بتفسيره الرمضاني ودروسه في أنحاء نيجيريا وخارجها وبنقده للتصوف والتشيع."
  en: "Nigerian scholar and preacher born at Yamaltu/Deba in Gombe State. He began in the youth first-aid group of the Izala Society, studied in Saudi Arabia, and has been the society's National Secretary General since December 2011. He is known for his Ramadan tafsir and preaching tours across Nigeria and abroad, and for his criticism of Sufism and Shi'ism."
  ur: "نائجریائی عالم اور مبلغ، ریاست گومبے کے یامالتو/دیبا میں پیدا ہوئے۔ انھوں نے جماعتِ إزالہ کی نوجوان فرسٹ ایڈ ٹیم سے آغاز کیا، سعودی عرب میں تعلیم حاصل کی، اور دسمبر 2011 سے جماعت کے قومی سیکرٹری جنرل ہیں۔ وہ اپنی رمضان تفسیر، نائجریا اور بیرونِ ملک دعوتی دوروں، اور تصوف و تشیع پر تنقید کے لیے معروف ہیں۔"
