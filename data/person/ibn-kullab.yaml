id: person/ibn-kullab
class: person
label: { ar: "ابن كلاب", en: "Ibn Kullab", es: "Ibn Kullab", fr: "Ibn Kullab", ur: "ابن کلاب" }
summary:
  ar: "عبد الله بن محمد بن كلاب القطان من بابية الحشوية، وله مع عباد بن سليمان مناظرات وكان يقول إن كلام الله هو الله وكان عباد يقول إنه نصراني بهذا القول، قال أبو العباس البغوي دخلنا على فثيون النصراني وكان في دار الروم بالجانب الغربي فسألته عن ابن كلاب فقال رحم الله عبد الله كان يجيئني فيجلس إلى تلك الزاوية وأخذ هذا القول ولو عاش لنصرنا المسلمين، وله كتاب الصفات وكتاب خلق الأفعال وكتاب الرد على المعتزلة {cite:fihrist-ibn-al-nadim p. 255-256}."
  en: "Ibn Kullab — the speech-attribute theologian who sat with the Byzantine monk Fityawn {cite:fihrist-ibn-al-nadim}"
  es: "Ibn Kullab — el teólogo de los atributos del habla que se sentó con el monje bizantino Fityawn {cite:fihrist-ibn-al-nadim}"
  fr: "Ibn Kullab — le théologien spécialiste des attributs de la parole qui s'est assis avec le moine byzantin Fityawn {cite:fihrist-ibn-al-nadim}"
  ur: "ابن کلاب - تقریری وصف کا ماہر الہیات جو بازنطینی راہب فیتیاون کے ساتھ بیٹھا تھا۔"
  tr: "Abdullah ibn Muhammed bin Kilab el-Qattan, Haşviye Babiye'dendir ve Abbad bin Süleyman ile tartışmalar yaşardı. Tanrı'nın sözünün Allah olduğunu söylerdi ve Abbad da bu görüşle Hristiyan olduğunu söylerdi. Ebu el-Abbas el-Baghawi şöyle dedi: Hristiyan inancının evine, batı tarafındaki Roma evine girdik. İbn Kilab hakkında sordum, o da dedi ki, Allah ona rahmet etsin. Abdullah bana gelip o köşeye oturur ve bu görüşü benimserdi. Yaşasaydı, Müslümanları desteklerdi. Nitelikler Kitabı, Eylemlerin Yaratılması Kitabı ve Mu'tazillerin Reddi Kitabı'nı yazdı {atıf: Fihrist-ibn-al-Nadim s. 255-256}."
  id: "Abdullah ibn Muhammad ibn Kilab al-Qattan berasal dari Hashwiyya Babiyah, dan ia pernah berdebat dengan Abbad ibn Sulayman. Ia sering mengatakan bahwa firman Allah adalah Allah, dan Abbad mengatakan ia seorang Kristen dengan pandangan ini. Abu al-Abbas al-Baghawi berkata: Kami memasuki rumah umat Kristen, yang berada di Rumah Romawi di sisi barat. Saya bertanya kepadanya tentang Ibn Kilab, dan ia berkata, semoga Allah mengasihani Dia. Abdullah biasa datang kepada saya dan duduk di sudut itu dan mengambil pandangan ini. Jika ia masih hidup, ia akan mendukung umat Muslim. Ia menulis Kitab Atribut, Kitab Penciptaan Tindakan, dan Kitab Penolakan Mu'tazilites {cite:fihrist-ibn-al-nadim hlm. 255-256}."
