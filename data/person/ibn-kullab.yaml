summary:
  ar: "عبد الله بن محمد بن كلاب القطان من بابية الحشوية، وله مع عباد بن سليمان مناظرات وكان يقول إن كلام الله هو الله وكان عباد يقول إنه نصراني بهذا القول، قال أبو العباس البغوي دخلنا على فثيون النصراني وكان في دار الروم بالجانب الغربي فسألته عن ابن كلاب فقال رحم الله عبد الله كان يجيئني فيجلس إلى تلك الزاوية وأخذ هذا القول ولو عاش لنصرنا المسلمين، وله كتاب الصفات وكتاب خلق الأفعال وكتاب الرد على المعتزلة {cite:fihrist-ibn-al-nadim p. 255-256}."
  en: "Ibn Kullab — the speech-attribute theologian who sat with the Byzantine monk Fityawn {cite:fihrist-ibn-al-nadim}"
