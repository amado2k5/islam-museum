summary:
  ar: "علي بن جبلة العكوك، شاعر عباسي وُلد ببغداد سنة 160هـ/776م من أسرة خراسانية من الموالي، ومدح أبا دلف العجلي وحميد بن عبد الحميد الطوسي والوزير الحسن بن سهل، فأغضب مدائحه المغالية الخليفة المأمون، فقطع لسانه، ومات سنة 213هـ/828م {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  en: "'Ali ibn Jabala al-'Akawwak ('thick-set'), an Abbasid poet born at Baghdad in 160/776 of a Khurasani family of mawali. He praised Abu Dulaf al-'Ijli, Humayd b. 'Abd al-Hamid al-Tusi and the vizier al-Hasan b. Sahl. The exaggerated eulogies of the first two angered the caliph al-Ma'mun, who had his tongue torn out; he died of it in 213/828 {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
