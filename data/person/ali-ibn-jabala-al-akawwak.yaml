summary:
  ar: "علي بن جبلة العكوك، شاعر عباسي وُلد ببغداد سنة 160هـ/776م من أسرة خراسانية من الموالي، ومدح أبا دلف العجلي وحميد بن عبد الحميد الطوسي والوزير الحسن بن سهل، فأغضب مدائحه المغالية الخليفة المأمون، فقطع لسانه، ومات سنة 213هـ/828م {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  en: "'Ali ibn Jabala al-'Akawwak ('thick-set'), an Abbasid poet born at Baghdad in 160/776 of a Khurasani family of mawali. He praised Abu Dulaf al-'Ijli, Humayd b. 'Abd al-Hamid al-Tusi and the vizier al-Hasan b. Sahl. The exaggerated eulogies of the first two angered the caliph al-Ma'mun, who had his tongue torn out; he died of it in 213/828 {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  es: "'Ali ibn Jabala al-'Akawwak ('corpulento'), poeta abasí nacido en Bagdad en 160/776 en el seno de una familia mawali de Jorasán. Elogió a Abu Dulaf al-'Ijli, a Humayd b. 'Abd al-Hamid al-Tusi y al visir al-Hasan b. Sahl. Los elogios exagerados de los dos primeros enfurecieron al califa al-Ma'mun, a quien le arrancaron la lengua; murió a causa de ello en 213/828 {cite:encyclopaedia-of-islam-2 vol. 1 p. 337}."
  fr: "Ali ibn Jabala al-'Akawwak (« le costaud »), poète abbasside né à Bagdad en 160/776, issu d'une famille khurasani de mawali, fit l'éloge d'Abu Dulaf al-'Ijli, d'Humayd b. 'Abd al-Hamid al-Tusi et du vizir al-Hasan b. Sahl. Les éloges dithyrambiques des deux premiers provoquèrent la colère du calife al-Ma'mun, qui se fit arracher la langue; il mourut des suites de cet outrage en 213/828 (voir: Encyclopaedia of Islam, vol. 1, p. 337)."
  ur: "'علی ابن جبلہ العقوق ⁦('تھک سیٹ')⁩، ایک عباسی شاعر جو بغداد میں 160/776 میں ایک خراسانی خاندان موالی میں پیدا ہوا۔ اس نے ابو دلف الاجلی، حمید بن، کی تعریف کی۔ عبد الحامد الطوسی اور وزیر الحسن بن۔ سہل پہلے دو کی مبالغہ آمیز تعریفوں نے خلیفہ المامون کو غصہ دلایا، جس کی زبان پھٹ گئی تھی۔ اس کی وفات 213/828 میں ہوئی۔ 1 ص۔ 337}۔"
  tr: "Ali ibn Jabla el-Akouk, 160 Hicri / 776 yılında Bağdat'ta doğmuş, Mawali kabilesine mensup Horasani bir aileden doğmuş bir Abbasi şairiydi. Ebu Dulf el-Ecli, Hümeyd bin Abdülhamid el-Tusi ve vezir el-Hasan ibn Sal'ı övmüştür. Abartılı övgüsü, dilini kesen ve 213 Hicri/828 yılında ölen Halife el-Me'mun'u öfkelendirmiştir {cit:Encyclopaedia-of-Islam-2 cilt 1, s. 337}."
  id: "Ali ibn Jabla al-Akouk adalah seorang penyair Abbasiyah yang lahir di Baghdad pada tahun 160 H / 776 M dari keluarga Khorasani suku Mawali. Ia memuji Abu Dulf al-Ajli, Humayd ibn Abd al-Hamid al-Tusi, dan wazir al-Hasan ibn Sahl. Pujian berlebihannya membuat Khalifah al-Ma'mun marah, yang memotong lidahnya dan meninggal pada tahun 213 H/828 M {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 337}."
