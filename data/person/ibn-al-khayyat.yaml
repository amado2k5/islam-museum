summary:
  ar: "أبو عبد الله أحمد بن محمد بن علي بن يحيى بن صدقة التغلبي، المعروف بابن الخياط الشاعر الدمشقي الكاتب؛ كان من الشعراء المجيدين، طاف البلاد وامتدح الناس ودخل بلاد العجم، واجتمع بأبي الفتح بن حيوس ببعلبك فعرض عليه شعره فدلّه على موضع إجادته {cite:wafayat-ayan}."
  en: "Ibn al-Khayyat al-Dimashqi — katib-poet who toured the lands for patrons and showed his verse to Ibn Hayyus at Baalbek {cite:wafayat-ayan}."
  es: "Ibn al-Khayyat al-Dimashqi - poeta katib que recorrió las tierras en busca de patrocinadores y mostró sus versos a Ibn Hayyus en Baalbek {cita:wafayat-ayan}."
  fr: "Ibn al-Khayyat al-Dimashqi - poète katib qui a parcouru les terres pour trouver des mécènes et a montré ses vers à Ibn Hayyus à Baalbek {cite: wafayat-ayan}."
  ur: "ابن الخیاط الدمشقی - کاتب شاعر جس نے سرپرستوں کے لیے زمینوں کی سیر کی اور بعلبک میں ابن حیوس کو اپنی آیت دکھائی۔"
  tr: "Ebu Abdullah Ahmed ibn Muhammed ibn Ali ibn Yahya ibn Sadaqah al-Taghlibi, Şamlı şair ve yazar olarak bilinen İbn al-Khayyat; seçkin şairlerden biriydi. Topraklarda dolaştı, halkı övdü, Arap olmayanların topraklarına girdi ve Baalbek'te Ebu el-Feth ibn Hayyus ile buluştu; o da şiirlerini sundu ve onu ustalık yerine yönlendirdi {atıf:wafayat-ayan}."
  id: "Abu Abdullah Ahmad ibn Muhammad ibn Ali ibn Yahya ibn Sadaqah al-Taghlibi, dikenal sebagai Ibn al-Khayyat, penyair dan penulis Damaskus; ia adalah salah satu penyair terkemuka. Ia menjelajahi negeri-negeri, memuji rakyat, memasuki tanah non-Arab, dan bertemu dengan Abu al-Fath ibn Hayyus di Baalbek, yang membawakan puisinya kepadanya dan membimbingnya ke tempat penguasaannya {cite:wafayat-ayan}."
