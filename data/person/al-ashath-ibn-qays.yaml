summary:
  ar: من ملوك كندة وصاحب مرباع حضرموت؛ وفد على النبي سنة 10هـ في سبعين راكباً من كندة، وارتد فيمن ارتد من الكنديين وأُسر وأُحضر إلى أبي بكر فأسلم فأطلقه وزوجه أخته، ثم شهد اليرموك والقادسية وصفين مع علي، ومات بعد مقتل علي بأربعين ليلة. وعند المسعودي كان بدء أمر التحكيم وأصر على أبي موسى حكماً عن أهل العراق ورفض ابن عباس والأشتر، ومر بالصحيفة يقرؤها على الناس فرحاً حتى ضربه عروة بن أذينة قائلاً لا حكم إلا لله فوقعت الضربة في عجز فرسه {cite:muruj-al-dhahab p. 682-684}، ومر به ابن ملجم ليلة الواقعة وهو في المسجد فقال له فضحك الصبح {cite:muruj-al-dhahab p. 702}
  en: One of the kings of Kinda and holder of the quarter-share of Hadramawt; he came to the Prophet in 10 AH with seventy riders of Kinda, left Islam with those of Kinda who did, was captured and brought to Abu Bakr, embraced Islam again and
    was freed and married to Abu Bakr's sister; he was at al-Yarmuk, al-Qadisiyya and with Ali at Siffin, and died forty nights after Ali's killing.
