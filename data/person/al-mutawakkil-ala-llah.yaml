id: person/al-mutawakkil-ala-llah
class: person
label: { ar: "المتوكل على الله محمد بن المعتضد", en: "al-Mutawakkil ala Allah Muhammad ibn al-Mu'tadid", fr: "al-Mutawakkil ala Allah Muhammad ibn al-Mu'tadid", es: "al-Mutawakkil ala Allah Muhammad ibn al-Mu'tadid", ur: "المتوکل علی اللہ محمد ابن المتدید" }
summary:
  ar: "سادس خلفاء القاهرة [٧٦٣–٨٠٨هـ]، أبو عبد الله محمد بن المعتضد والد خلفاء العصر، ولي الخلافة بعهد من أبيه في جمادى سنة ثلاث وستين وامتدت أيامه خمساً وأربعين سنة بما تخللها من خلع وحبس، وأعقب أولاداً كثيرة يقال جاء له مئة ولد ما بين مولود وسقط وولي الخلافة منهم خمسة ولا نظير لذلك المستعين العباس والمعتضد داود والمستكفي سليمان والقائم حمزة والمستنجد يوسف والموجود الآن من العباسيين كلهم من ذريته، خلعه أتابك أينبك البدري سنة تسع وسبعين خمسة عشر يوماً ونصب زكريا المستعصم ثم عاد، وخلعه برقوق سنة خمس وثمانين وحبسه بقلعة الجبل ثم ندم فأخرجه وأعاده، ولما أراد الأمراء أن يسلطنوه عند انقلابهم على الأشرف شعبان امتنع، وتوفي ليلة الثلاثاء ثامن عشري رجب سنة ثمان وثمان مئة {cite:tarikh-khulafa-minhaj-1434 p. 757-762}. وعند المسعودي أن المتوكل خالف ما كان عليه المأمون والمعتصم والواثق من الاعتقاد ونهى عن الجدل والمناظرة في الآراء وعاقب عليه وأمر بالتقليد وأظهر الرواية للحديث فحسنت أيامه وانتظمت دولته {cite:muruj-al-dhahab p. 672-673}، وعند المسعودي اشتهى قدر ملاح على الخليج يطبخ سكباجاً فانتزعت له كهيئتها فأكل ثم أمر أن تملأ دراهم فدفعت إلى أصحاب السفينة ثمناً وما فضل هبة للطابخ {cite:muruj-al-dhahab p. 485-486}"
  en: "Sixth Cairo caliph [763–808] — 'father of the age's caliphs': of his hundred children five reigned (al-Musta'in, al-Mu'tadid II, al-Mustakfi II, al-Qa'im, al-Mustanjid), a thing without parallel, and all living Abbasids descend from him. Deposed fifteen days in 779, imprisoned and deposed by Barquq 785–791, he refused the amirs' offer of the sultanate itself in 778; died Tuesday 18 Rajab 808 {cite:tarikh-khulafa-minhaj-1434 p. 757-762}."
  fr: "Sixième calife du Caire [763-808] – « père des califes de l'âge » : de ses cent enfants cinq régnaient (al-Musta'in, al-Mutadid II, al-Mustakfi II, al-Qa'im, al-Mustanjid), une chose sans parallèle, et tous les Abbassides vivants descendent de lui. Déposé quinze jours en 779, emprisonné et déposé par Barquq 785-791, il a refusé l'offre des émirs du sultanat lui-même en 778 ; est décédé mardi 18 Rajab 808 {cite:tarikh-khulafa-minhaj-1434 p. 757-762}."
  es: "Sexto califa de El Cairo [763–808] — 'padre de los califas de la época': de sus cien hijos, cinco reinaron (al-Musta'in, al-Mu'tadid II, al-Mustakfi II, al-Qa'im, al-Mustanjid), algo sin parangón, y todos los abasíes vivos descienden de él. Fue depuesto quince días después en 779, encarcelado y depuesto por Barquq entre 785 y 791, y rechazó la oferta de los emires del sultanato en 778; murió el martes 18 de Rajab de 808 {cite:tarikh-khulafa-minhaj-1434 p. 757-762}."
  ur: "چھٹا قاہرہ خلیفہ [763-808] - 'عمر کے خلفاء کا باپ': اس کے سو بچوں میں سے پانچ نے حکومت کی ⁦(المستعین، المتعد دوم، المستقفی دوم، القائم، المستنجد)⁩، ایک ایسی چیز جس کا کوئی متوازی نہیں، اور تمام زندہ عباسیوں سے۔ 779 میں پندرہ دن معزول رہے، برقوق 785-791 کے ذریعے قید اور معزول ہوئے، اس نے 778 میں خود سلطنت کی امیروں کی پیشکش سے انکار کر دیا۔ وفات بروز منگل 18 رجب 808 {حوالہ: تاریخ الخلفاء منہاج 1434 ص۔ 757-762}۔"
  tr: "Kahire'nin altıncı halifesi [763–808 H.C.], dönemin halifelerinin babası Ebu Abdullah Muhammed bin el-Mu'tadid, altmış üçüncü yılda babası tarafından Cumada'da halifeliği devraldı. Günleri kırk beş yıl sürdü; tahttan indirilmeler ve hapis dahil. Geride birçok çocuk bıraktı; doğduğu ve ölen yüz çocuğu olduğu söylenir. Bunlardan beşi eşsiz bir şekilde halifelik yaptı. Bu nedenle el-Mutadid Davud, el-Mustakfi Süleyman, el-Kaim Hamza ve hâlâ Abbasiler arasında olan el-Mustanjid Yusuf onun soyundan gelmiştir. Atabak Aynbak el-Bedri tarafından tahttan indirildi Yetmiş dokuz ve on beş gün içinde Zakeriye, el-Musta'sim'i atadı, sonra geri döndü. Barquq onu seksen beşinci yılda tahttan indirdi ve dağ kalesine hapsetti, sonra pişman olup onu kovdu ve geri getirdi. Prensler, el-Eşref Şaban'a karşı yaptıkları darbe sırasında onu takviye etmek istediklerinde reddetti. 8800 Hicri, Recep'in on sekizinci Salı gecesi vefat etti {cite:History-Khulafa-minhaj-1434, s. 757-762}. al-Mas'udi'ye göre, al-Mutawakkil, al-Ma'mun, al-Mu'tasim ve al-Wathiq'in inançlarından farklıydı; görüş tartışmasını ve münazarayı yasakladı, cezalandırıldı, taklit emretti ve hadis anlatımını daha belirgin hale getirdi. Günleri iyileşti ve durumu istikrarlı hale geldi {atıf:muruj-al-dhahab s. 672-673}. Al-Mas'udi'ye göre, Körfez'de bir denizci tenceresi istemiş, bir sabag pişirmek istemiş, olduğu gibi ondan alınmış ve yemiştir. Sonra dirhemlerin doldurulmasını emretmiş, böylece gemi sahiplerine bir bedel ödenmiş ve kalan miktar aşçıya hediye edilmiştir {cite:muruj-al-dhahab s. 485-486}"
  id: "Khalifah keenam Kairo [763–808 H], Abu Abdullah Muhammad ibn al-Mu'tadid, ayah dari para khalifah pada masa itu, mengambil alih kekhalifahan oleh ayahnya di Jumada pada tahun enam puluh tiga. Hari-harinya berlangsung selama empat puluh lima tahun, termasuk pemberhentian dan penahanan. Ia meninggalkan banyak anak; dikatakan ia memiliki seratus anak, baik yang lahir maupun yang gugur. Lima di antaranya menjadi khalifah tanpa banding. Untuk al-Musta'in, al-Mu'tadid Dawud, al-Mustakfi Sulayman, al-Qa'im Hamza, dan al-Mustanjid Yusuf, yang masih berada di antara Abbasiyah, semuanya keturunan darinya. Ia digulingkan oleh Atabak Aynbak al-Badri Pada tahun tujuh puluh sembilan lima belas hari, Zakariya mengangkat al-Musta'sim, lalu kembali. Barquq menggulingkannya pada tahun delapan puluh lima dan memenjarakannya di benteng gunung, kemudian menyesali dan mengusirnya serta membawanya kembali. Ketika para pangeran ingin memperkuatnya selama kudeta mereka terhadap al-Ashraf Sha'ban, ia menolak. Ia meninggal pada malam Selasa, tanggal delapan belas Rajab, 8800 AH {cite:History-Khulafa-minhaj-1434, hlm. 757-762}. Menurut al-Mas'udi, al-Mutawakkil berbeda dari apa yang diyakini al-Ma'mun, al-Mu'tasim, dan al-Wathiq, melarang perdebatan dan perdebatan pendapat, dihukum, memerintahkan peniruan, dan membuat narasi hadits lebih jelas. Hari-harinya membaik dan keadaannya menjadi stabil {cite:muruj-al-dhahab hlm. 672-673}. Menurut al-Mas'udi, ia menginginkan panci pelaut di Teluk untuk memasak sabagh, yang kemudian diambil darinya seperti adanya, sehingga ia memakannya. Kemudian ia memerintahkan agar dirham diisi, sehingga pemilik kapal dibayar harga, dan apa yang tersisa sebagai hadiah untuk juru masak {cite:muruj-al-dhahab hlm. 485-486}"
