id: person/al-mutawakkil-ala-llah
class: person
label: { ar: "المتوكل على الله محمد بن المعتضد" }
summary:
  ar: "سادس خلفاء القاهرة [٧٦٣–٨٠٨هـ]، أبو عبد الله محمد بن المعتضد والد خلفاء العصر، ولي الخلافة بعهد من أبيه في جمادى سنة ثلاث وستين وامتدت أيامه خمساً وأربعين سنة بما تخللها من خلع وحبس، وأعقب أولاداً كثيرة يقال جاء له مئة ولد ما بين مولود وسقط وولي الخلافة منهم خمسة ولا نظير لذلك المستعين العباس والمعتضد داود والمستكفي سليمان والقائم حمزة والمستنجد يوسف والموجود الآن من العباسيين كلهم من ذريته، خلعه أتابك أينبك البدري سنة تسع وسبعين خمسة عشر يوماً ونصب زكريا المستعصم ثم عاد، وخلعه برقوق سنة خمس وثمانين وحبسه بقلعة الجبل ثم ندم فأخرجه وأعاده، ولما أراد الأمراء أن يسلطنوه عند انقلابهم على الأشرف شعبان امتنع، وتوفي ليلة الثلاثاء ثامن عشري رجب سنة ثمان وثمان مئة {cite:tarikh-khulafa-minhaj-1434 p. 757-762}."
  en: "Sixth Cairo caliph [763–808] — 'father of the age's caliphs': of his hundred children five reigned (al-Musta'in, al-Mu'tadid II, al-Mustakfi II, al-Qa'im, al-Mustanjid), a thing without parallel, and all living Abbasids descend from him. Deposed fifteen days in 779, imprisoned and deposed by Barquq 785–791, he refused the amirs' offer of the sultanate itself in 778; died Tuesday 18 Rajab 808 {cite:tarikh-khulafa-minhaj-1434 p. 757-762}."
