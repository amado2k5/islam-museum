summary:
  ar: "عند البلاذري: التسير بن ديسم بن ثور وجّهه خالد وهو بعين التمر إلى ماء لبني تغلب فطرقهم ليلاً فقتل وأسر."
  en: "In al-Baladhuri: al-Tusayr ibn Daysam ibn Thawr, whom Khalid sent from Ayn al-Tamr against a water of Banu Taghlib — he surprised them by night, killed and captured."
  fr: "Dans al-Baladhuri : al-Tusayr ibn Daysam ibn Thawr, que Khalid a envoyé d’Ayn al-Tamr contre une eau de Banu Taghlib – il les a surpris la nuit, tués et capturés."
  es: "En al-Baladhuri: al-Tusayr ibn Daysam ibn Thawr, a quien Khalid envió desde Ayn al-Tamr contra un grupo de Banu Taghlib, los sorprendió de noche, los mató y los capturó."
  ur: "البلادوری میں ہے: الطوسیر ابن یوم ابن ثور، جسے خالد نے عین التمر سے بنو تغلب کے پانی کے خلاف بھیجا تھا - اس نے رات کو ان کو حیران کر دیا، قتل کر دیا اور گرفتار کر لیا۔"
  tr: "Al-Baladhuri'ye göre: Al-Taseer ibn Daysim ibn Thawr, Halid, Ain al-Tamar'da Banu Taghlib'e ait bir suya giderken gece onu patlatarak öldürüp esir aldı."
  id: "Menurut Al-Baladhuri: Al-Taseer ibn Daysim ibn Thawr, Khalid, berada di Ain al-Tamar di sebuah air milik Banu Taghlib, yang ia pecahkan pada malam hari, membunuh dan menangkapnya."
