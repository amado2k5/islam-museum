summary:
  ar: "سلمي؛ أتى أبا بكر فقال «احملني وقوّني أقاتل المرتدين» فحمله وأعطاه سلاحاً فخرج يعترض الناس فيقتل المسلمين والمرتدين وجمع جمعاً، فكتب أبو بكر إلى طريفة بن حاجزة أخي ممن بن حاجزة يأمره بقتاله فقاتله فأسره وبعث به إليه فأمر أبو بكر بإحراقه في ناحية المصلى — ويقال كتب أبو بكر إلى معن فوجّه إليه طريفة أخاه فأسره؛ وكان ذلك مما ندم عليه أبو بكر إذ قال «وددت أني يوم أتيت بالفجاءة قتلته ولم أحرقه»."
  en: "A Sulami; he came to Abu Bakr saying 'mount me and strengthen me to fight the apostates', so he was mounted and armed — then went out waylaying people, killing Muslims and apostates alike and raising a force; Abu Bakr wrote to Turayfa ibn Hajiza, brother of Mam'un ibn Hajiza, ordering him to fight him, and he fought, captured and sent him to Abu Bakr, who ordered him burned near the musalla — others say Abu Bakr wrote to Ma'n, who sent his brother Turayfa to capture him; this was among Abu Bakr's regrets: 'I wish that the day al-Fuja'a was brought to me I had killed him and not burned him'."
