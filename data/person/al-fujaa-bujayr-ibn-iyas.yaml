summary:
  ar: "سلمي؛ أتى أبا بكر فقال «احملني وقوّني أقاتل المرتدين» فحمله وأعطاه سلاحاً فخرج يعترض الناس فيقتل المسلمين والمرتدين وجمع جمعاً، فكتب أبو بكر إلى طريفة بن حاجزة أخي ممن بن حاجزة يأمره بقتاله فقاتله فأسره وبعث به إليه فأمر أبو بكر بإحراقه في ناحية المصلى — ويقال كتب أبو بكر إلى معن فوجّه إليه طريفة أخاه فأسره؛ وكان ذلك مما ندم عليه أبو بكر إذ قال «وددت أني يوم أتيت بالفجاءة قتلته ولم أحرقه»."
  en: "A Sulami; he came to Abu Bakr saying 'mount me and strengthen me to fight the apostates', so he was mounted and armed — then went out waylaying people, killing Muslims and apostates alike and raising a force; Abu Bakr wrote to Turayfa ibn Hajiza, brother of Mam'un ibn Hajiza, ordering him to fight him, and he fought, captured and sent him to Abu Bakr, who ordered him burned near the musalla — others say Abu Bakr wrote to Ma'n, who sent his brother Turayfa to capture him; this was among Abu Bakr's regrets: 'I wish that the day al-Fuja'a was brought to me I had killed him and not burned him'."
  fr: "Sulamite ; il vint à Abu Bakr disant : « Donne-moi une monture et des moyens pour combattre les apostats », et reçut monture et armes ; il partit ensuite détrousser les gens, tuant musulmans et apostats et levant une troupe. Abu Bakr écrivit à Turayfa ibn Hajiza, frère de Mam’un ibn Hajiza, pour lui ordonner de le combattre ; celui-ci le combattit, le captura et l’envoya à Abu Bakr, qui ordonna de le brûler près de la musalla. Selon d’autres, Abu Bakr écrivit à Ma’n, qui envoya son frère Turayfa le capturer ; ce fut l’un des regrets d’Abu Bakr : « J’aurais souhaité, le jour où l’on m’amena al-Fuja’a, le tuer sans le brûler. »"
  es: "Un Sulami; se presentó ante Abu Bakr diciéndole: \"Móntame y fortaléceme para luchar contra los apóstatas\", así que lo montaron y armaron; luego salió a emboscar gente, matando tanto a musulmanes como apóstatas y reuniendo una fuerza; Abu Bakr escribió a Turayfa ibn Hajiza, hermano de Mam'un ibn Hajiza, ordenándole que luchara contra él, y luchó, lo capturó y lo envió a Abu Bakr, quien ordenó que lo quemaran cerca de la sala de oración; otros dicen que Abu Bakr escribió a Ma'n, quien envió a su hermano Turayfa a capturarlo; este fue uno de los arrepentimientos de Abu Bakr: \"Ojalá el día que me trajeron a al-Fuja'a lo hubiera matado y no quemado\"."
  ur: "ایک سلیمی؛ وہ ابوبکر کے پاس آیا کہ 'مجھے سوار کرو اور مجھے مرتدین سے لڑنے کے لیے مضبوط کرو'، تو وہ سوار ہو کر مسلح ہو گئے - پھر لوگوں کو روکتے ہوئے نکلے، مسلمانوں اور مرتدوں کو یکساں قتل کرتے ہوئے اور ایک فوج تیار کی۔ ابوبکر نے مامون بن حجیزہ کے بھائی تریفا ابن حجیزہ کو خط لکھا اور اسے اس سے لڑنے کا حکم دیا، اور اس نے لڑا، پکڑا اور اسے ابوبکر کے پاس بھیجا، جس نے اسے مصلے کے قریب جلانے کا حکم دیا - دوسروں کا کہنا ہے کہ ابوبکر نے معن کو لکھا، جس نے اپنے بھائی تریفا کو اسے پکڑنے کے لیے بھیجا؛ یہ ابوبکر کے پچھتاوے میں سے ایک تھا: 'کاش جس دن الفضع میرے پاس لایا جاتا میں اسے قتل کر دیتا اور اسے جلاتا'۔"
