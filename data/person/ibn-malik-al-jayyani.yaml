label: { ar: "ابن مالك النحوي" }
summary:
  ar: "الشيخ العلامة جمال الدين أبو عبد الله محمد بن عبد الله الطائي الجياني المعروف بابن مالك النحوي المتوفى سنة ٦٧٢هـ؛ صاحب الألفية في النحو {cite:kashf-zunun-furqan p. 578}."
  en: "Jamal al-Din Muhammad ibn Abdallah al-Ta'i al-Jayyani, known as Ibn Malik the grammarian, d. AH 672 — author of the Alfiyya {cite:kashf-zunun-furqan p. 578}."
  es: "Jamal al-Din Muhammad ibn Abdullah al-Ta'i al-Jayyani, también conocido como Ibn Malik el gramático, m. 672 H.H. autor de la Alfiyya {ver Kashf-Zunun-Furqan p. 578}."
  fr: "Jamal al-Din Muhammad ibn Abdullah al-Ta'i al-Jayyani, également connu sous le nom d'Ibn Malik le grammairien, d. AH 672 — auteur de l'Alfiyya {voir Kashf-Zunun-Furqan p. 578}."
  ur: "جمال الدین محمد بن عبداللہ الطائی الجیانی، جسے ابن مالک گرامر کے نام سے بھی جانا جاتا ہے، ڈی۔ 672ھ - مصنف الفیہ {ملاحظہ کشف الذنون فرقان صفحہ 150۔ 578}۔"
  tr: "Alim Şeyh Cemalddin Ebu Abdullah Muhammed bin Abdullah el-Ta'i el-Jiyani, İbn Malik el-Nahvi olarak bilinir, 672 Hicri yılında vefat etmiştir; el-Alfiyya fi el-Nahw adlı eserin yazarıdır {kaynak: kaşf-zunun-furqan, s. 578}."
  id: "Cendekiawan Sheikh Jamal al-Din Abu Abdullah Muhammad ibn Abdullah al-Ta'i al-Jiyani, dikenal sebagai Ibn Malik al-Nahwi, yang meninggal pada tahun 672 H; penulis al-Alfiyya fi al-Nahw {cite:kashf-zunun-furqan, hlm. 578}."
