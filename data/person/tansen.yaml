summary:
  ar: "موسيقي وملحّن هندستاني ⁦(وُلد رامتانو غاود بانداي، نحو 1493 – وتوفي في 26 أبريل 1589 عند رواية «أكبرنامه»، وتقول رواية أخرى 1586)⁩، أشهر موسيقيي بلاط الإمبراطور المغولي أكبر وأحد «نوراتنا» البلاط ⁦(الجواهر التسع)⁩، وهو الذي منحه لقب «ميان». تكوّن في منطقة غواليور وقضى معظم حياته البالغة في بلاط راجا رامشاندرا سينغ ملك ريوا، ويُذكر مؤسسا للتقليد الهندستاني، وبمؤلفاته في الدروباد وبابتكاره راغات جديدة. وُلد في أسرة براهمة هندوسية وتنازعته الروايات الهندوسية والصوفية، وما زال اعتناقه الإسلام محل خلاف؛ فلا يقطع هذا السجل بشيء منه."
  en: "Hindustani classical musician and composer (born Ramtanu Gaud Panday, c. 1493 – died 26 April 1589 by the Akbarnama tradition, with another account giving 1586), the most celebrated musician of the Mughal emperor Akbar's court and one of its Navaratnas (nine jewels), who gave him the honorific Mian. Formed in the Gwalior region and patronised for most of his adult life by Raja Ramchandra Singh of Rewa, he is remembered as a founder of the Hindustani tradition, for his Dhrupad compositions and for creating new ragas. Born into a Hindu Brahmin family, he is claimed by both Hindu and Sufi traditions, and whether he converted to Islam is disputed; this record settles none of it."
  ur: "ہندستانی کلاسیکی موسیقار اور نغمہ ساز ⁦(اصل نام رمتانو گاؤڈ پانڈے، تقریباً 1493ء – وفات 26 اپریل 1589ء بموجب اکبرنامہ کی روایت، جب کہ ایک اور روایت 1586ء بیان کرتی ہے)⁩، مغل شہنشاہ اکبر کے دربار کے سب سے مشہور موسیقار اور اس کے نورتنوں ⁦(نو جواہر)⁩ میں سے ایک، جنہیں اکبر نے «میاں» کا خطاب دیا۔ ان کی تربیت گوالیار کے علاقے میں ہوئی اور زندگی کا بیشتر حصہ ریوا کے راجا رام چندر سنگھ کی سرپرستی میں گزرا۔ وہ ہندستانی روایت کے بانیوں میں شمار ہوتے ہیں، اپنی دھرپد تصانیف اور نئے راگوں کی ایجاد کے لیے یاد کیے جاتے ہیں۔ ہندو برہمن گھرانے میں پیدا ہوئے؛ ہندو اور صوفی دونوں روایتیں انہیں اپنا کہتی ہیں اور ان کا قبولِ اسلام متنازع ہے — یہ ریکارڈ کسی پہلو کا فیصلہ نہیں کرتا۔"
