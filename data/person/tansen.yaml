    note: "Born into a Hindu Gaur Brahmin family, and described in the English article — citing Babineau (1979) — as still a Vaishnava musician when he arrived at Akbar's court in 1562. Against that stand three conversion readings, none of which this record settles: a legend carried in the article's Family section, that he married a daughter of Akbar named Mehrunissa, 'for which he had to convert to Islam'; the Urdu Wikipedia, which states without qualification that he accepted Islam in his youth; and Wikidata's structured religion field, which gives Islam. The English article records that scholars refute the conversion, citing his Hindu belief and his compositions in praise of Hindu gods, while allowing traces of Sufi influence in some of his later compositions. His formation is itself told two ways — Hindu accounts name the bhakti saint and musician Swami Haridas as his teacher, Muslim biographies the Sufi mystic Muhammad Ghaus of Gwalior, in whose mausoleum complex at Gwalior Tansen was buried — and Bonnie Wade, cited in the article, finds that the evidence suggests he was less affiliated with either religion than with music. One flat text, one structured field and one legend, set against cited scholarship disputing the conversion: the readings compete, so the value stays unknown, as the founder ruled for this record, with every reading preserved here."
