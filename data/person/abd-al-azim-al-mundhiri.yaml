  es: "Abd al-Azim al-Mundhiri — hafiz de Egipto, autor de al-Targhib wa-l-Tarhib; la mención que hace Ibn Khallikan de él es un breve elogio, y fue al-Mundhiri quien más tarde escribió la Takmila continuando este mismo libro {cite:wafayat-ayan}."
