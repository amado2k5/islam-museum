  ar: "أبو محمد عبد العظيم المنذري، حافظ مصر ومحدثها؛ ورد ذكره عند ابن خلكان على سبيل الترحم والإشارة، وهو الذي لاحق وفيات الأعيان فوضع عليها كتاب التكملة {cite:wafayat-ayan}."
