summary:
  ar: "منشئة محتوى أمريكية من أصل سوداني مقيمة في لوس أنجلوس؛ بدأت على يوتيوب بدروس الشعر الطبيعي، ثم بدأت لبس الحجاب نحو سنة 2016 وأعادت بناء قناتها حول الأزياء المحتشمة والجمال ونمط الحياة، واشتهرت بدمج الأزياء المحتشمة مع ثقافة الأحذية الرياضية."
  en: "Sudanese-American content creator based in Los Angeles. She began on YouTube with natural-hair tutorials, started wearing hijab around 2016 and rebuilt her channel around modest fashion, beauty and lifestyle content; she is known for merging modest styling with sneaker culture."
  ur: "لاس اینجلس میں مقیم سوڈانی نژاد امریکی تخلیق کار؛ یوٹیوب کا آغاز قدرتی بالوں کے ٹیوٹوریلز سے کیا، 2016 کے آس پاس حجاب شروع کیا اور اپنے چینل کو مودسٹ فیشن، بیوٹی اور لائف اسٹائل کے گرد دوبارہ بنایا؛ مودسٹ انداز کو اسنیکر ثقافت سے ملانے کے لیے جانی جاتی ہیں۔"
  es: "Creadora de contenido sudanesa-estadounidense radicada en Los Ángeles. Comenzó en YouTube con tutoriales de cabello natural, empezó a usar hiyab alrededor de 2016 y reconstruyó su canal centrándose en moda modesta, belleza y estilo de vida; es conocida por fusionar el estilo modesto con la cultura de las zapatillas deportivas."
  fr: "Créatrice de contenu soudano-américaine basée à Los Angeles. Elle a débuté sur YouTube avec des tutoriels sur les cheveux naturels, a commencé à porter le hijab vers 2016 et a recentré sa chaîne sur la mode pudique, la beauté et le style de vie; elle est connue pour son mélange de style pudique et de culture sneaker."
