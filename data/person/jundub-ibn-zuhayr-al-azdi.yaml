label: { ar: "جندب بن زهير الأزدي", en: "Jundub ibn Zuhayr al-Azdi", es: "Jundub ibn Zuhayr al-Azdi", fr: "Jundub ibn Zuhayr al-Azdi", ur: "جندب بن زہیر العزدی" }
summary:
  ar: "هجم مع أبي زينب بن عوف الأزدي وجماعة من أهل مسجد الكوفة على الوليد بن عقبة فو جدوه سكران مضجعاً على سريره لا يعقل وتقايا عليهم ما شرب فانتزعوا خاتمه من يده وشهدوا به عند عثمان فقالا هي الخمر التي كنا نشربها في الجاهلية فزجرهما عثمان ودفع في صدورهما فأتيا علياً فأنصفهما {cite:muruj-al-dhahab p. 630-631}."
  en: "The Azdi witness who stormed the drunken governor with Abu Zaynab, took his seal from his hand, and bore witness before Uthman — rebuffed there, vindicated through Ali {cite:muruj-al-dhahab p. 630-631}."
  es: "El testigo Azdi que asaltó al gobernador ebrio con Abu Zaynab, le quitó el sello de la mano y testificó ante Uthman, fue rechazado allí, vindicado a través de Ali {cite:muruj-al-dhahab p. 630-631}."
  fr: "Le témoin Azdi qui a pris d'assaut le gouverneur ivre avec Abu Zaynab, a pris son sceau de sa main et a témoigné devant Uthman — repoussé là-bas, justifié par Ali {cite:muruj-al-dhahab p. 630-631}."
  ur: "ازدی گواہ جس نے شرابی گورنر پر ابو زینب کے ساتھ دھاوا بولا، اس کی مہر اس کے ہاتھ سے لے لی، اور عثمان کے سامنے گواہی دی- وہیں سرزنش کی، علی کے ذریعے ثابت ہوا {حوالہ: مروج الذہب ص۱۴۱۔ 630-631}۔"
  tr: "Ebu Zeyneb bin Avf el-Ezdi ve Kufa camii halkından bir grup ile el-Velid bin Üqbe'ye saldırdı. Dedesi sarhoştu, yatağında yatıyordu, anlamıyordu ve içtiklerine bağlıydı. Yüzüğünü elinden kaptılar ve Osman huzurunda, 'Bu, İslam öncesi çağda içtiğimiz şaraptır.' dediler. Osman onları azarladı ve göğslerine vurdu, böylece Ali'ye gelip adaletini verdiler {atıf:Muruj-al-Dhahab, s. 630-631}."
  id: "Ia menyerang Abu Zaynab ibn Awf al-Azdi dan sekelompok orang masjid Kufa terhadap al-Walid ibn Uqbah. Kakeknya mabuk, berbaring di tempat tidur, tidak mengerti, dan ia sangat taat dengan apa yang diminumnya. Mereka merampas cincinnya dari tangannya dan bersaksi di hadapan Uthman, berkata, 'Ini anggur yang biasa kami minum di era pra-Islam.' Uthman menegur mereka dan memukul dada mereka, sehingga mereka datang kepada Ali dan memberikan keadilan {cite:muruj-al-dhahab, hlm. 630-631}."
