summary:
  ar: "إمام وداعية أمريكي، وُلد في أوكلاهوما سنة 1972 باسم ويليام ويب في أسرة مسيحية، واعتنق الإسلام سنة 1992، ودرس الشريعة في جامعة الأزهر، وتولّى إمامة المركز الثقافي للجمعية الإسلامية في بوسطن، وأسّس معهدًا إلكترونيًا لتدريس العلوم الشرعية."
  en: "American imam and preacher, born in Oklahoma in 1972 as William Webb to a Christian family. He converted to Islam in 1992, studied Islamic law at al-Azhar University, served as imam of the Islamic Society of Boston Cultural Center, and founded an online institute for the Islamic sciences."
  ur: "امریکی امام اور مبلغ، جو 1972 میں اوکلاہوما میں ولیم ویب کے نام سے ایک عیسائی خاندان میں پیدا ہوئے۔ انہوں نے 1992 میں اسلام قبول کیا، جامعہ ازہر میں شریعت کی تعلیم حاصل کی، بوسٹن کلچرل سینٹر کی اسلامی سوسائٹی کے امام رہے، اور اسلامی علوم کی آن لائن تدریس کے لیے ایک ادارہ قائم کیا۔"
