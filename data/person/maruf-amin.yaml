  es: "Académico y político indonesio, nacido en 1943 en Tangerang. Vicepresidente de Indonesia (2019-2024) junto con el presidente Joko Widodo, anteriormente líder supremo de Nahdlatul Ulama y presidente del Consejo de Ulemas de Indonesia."
  fr: "Universitaire et homme politique indonésien, né en 1943 à Tangerang. Vice-président de l'Indonésie (2019-2024) aux côtés du président Joko Widodo, ancien chef suprême du Nahdlatul Ulama et président du Conseil indonésien des oulémas."
  tr: "1943 yılında Tengrang'da doğan Endonezyalı akademisyen ve siyasetçi. Endonezya Başkan Yardımcısı (2019–2024) ve Başkan Joko Widodo ile birlikte, ondan önce Nahdula Ulama Yüksek Başkanı ve Endonezya Bilginler Konseyi Başkanı olarak görev yaptı."
  id: "Cendekiawan dan politisi Indonesia, lahir tahun 1943 di Tengrang. Wakil Presiden Indonesia (2019–2024) bersama Presiden Joko Widodo, dan sebelumnya Presiden Agung Nahdula Ulama serta Ketua Dewan Ulama Indonesia."
