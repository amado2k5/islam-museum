summary:
  ar: "عالم وسياسي إندونيسي، وُلد سنة 1943 في تانغرانغ. نائب رئيس إندونيسيا ⁦(2019–2024)⁩ مع الرئيس جوكو ويدودو، وقبلها الرئيس الأعلى لنهضة العلماء ورئيس مجلس العلماء الإندونيسي."
  en: "Indonesian scholar and politician, born 1943 in Tangerang. Vice-president of Indonesia (2019–2024) alongside President Joko Widodo, previously supreme leader of Nahdlatul Ulama and chairman of the Indonesian Ulema Council."
