summary:
  ar: "صحافي وسياسي ودبلوماسي سندي (1905–1987) من عائلة بير راشدي في بهمن بلاركانا: من أركان الرابطة الإسلامية في السند، ووزير في السند ثم وزير اتحادي للإعلام والإذاعة، وسفير باكستان في الفلبين والصين، وصاحب المذكرات السندية الكلاسيكية «اھے ڈینھن اھے شینھن». وهو أخو المؤرخ حسام الدين راشدي الأكبر."
  en: "Sindhi journalist, politician and diplomat (1905–1987) of the Rashidi pir family of Bahman in Larkana: a leading Sindh Muslim Leaguer, provincial and then federal minister for information and broadcasting, Pakistan's ambassador to the Philippines and to China, and author of the classic Sindhi memoirs Uhee Denhin Uhee Shenih. He was the elder brother of the historian Pir Hassam-ud-Din Rashidi."
  ur: "Sindhi journalist, politician and diplomat (1905–1987) of the Rashidi pir family of Bahman in Larkana: a leading Sindh Muslim Leaguer, provincial and then federal minister for information and broadcasting, Pakistan's ambassador to the Philippines and to China, and author of the classic Sindhi memoirs Uhee Denhin Uhee Shenih. He was the elder brother of the historian Pir Hassam-ud-Din Rashidi."
