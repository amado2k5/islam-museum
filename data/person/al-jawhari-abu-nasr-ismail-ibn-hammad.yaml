summary:
  ar: "لغوي من فاراب في بلاد الترك، تلقى العربية عن أبي علي الفارسي وأبي سعيد السيرافي، وطاف في ديار ربيعة ومضر، ثم أقام بنيسابور مدرسًا ومؤلفًا ومعلمًا للخط، وألّف فيها معجم «الصحاح»؛ وتوفي بها سنة 393 أو 398هـ."
  en: "Philologist from Farab in the Turkic lands who learned Arabic from Abu Ali al-Farisi and Abu Sa'id al-Sirafi, travelled among the Arabs of Rabi'a and Mudar, then settled in Nishapur as teacher, author and calligraphy master, where he compiled the dictionary al-Sihah; he died there in 393 or 398 AH."
  ur: "فاراب (ترک علاقہ) کے ماہرِ لغت، جنہوں نے ابو علی فارسی اور ابو سعید سیرافی سے عربی پڑھی، ربیعہ و مضر کے دیار میں گھومے، پھر نیشاپور میں مدرس، مصنف اور خطاطی کے استاد کے طور پر مقیم ہوئے اور وہیں لغت «الصحاح» تالیف کی؛ ان کی وفات وہیں 393 یا 398ھ میں ہوئی۔"
