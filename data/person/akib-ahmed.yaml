  ar: "ممثل ومخرج وكاتب بنغلاديشي للدراما الأخلاقية الإسلامية القصيرة «ناتوك»؛ قناته الرئيسة «أكيب إسلاميك تي في» (@akibislamictv) بلغت 5,380,000 مشترك بحسب vidIQ كما في 8 نوفمبر 2026، وقناته الثانية (@akibahmed) بلغت 5,130,000 مشترك، وهو يكتب ويمثّل ويخرج غالبًا إنتاجات «كرييتف ميديا» التي تصفها اعتماداتها بأنها رسائل إسلامية مؤثرة في القلب."
