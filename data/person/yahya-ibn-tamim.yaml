summary:
  ar: "أبو طاهر يحيى بن تميم بن المعز بن باديس الحميري الصنهاجي؛ صاحب إفريقية وما والاها؛ كانت ولايته بالمهدية خلافة عن أبيه تميم يوم الجمعة لأربع بقين من ذي الحجة سنة سبع وتسعين وأربعمائة وكان عمره يوم الاستقلال ثلاثاً وأربعين سنة وستة أشهر وعشرين يوماً؛ وروى في كتاب «الجمع والبيان في أخبار القيروان» لابن أخيه عز الدين عبد العزيز بن شداد أن أباه أخرج إليه كتاب ملحمة فيه «الملك المغدور»؛ وخلف ثلاثين ولداً ذكوراً ودفن بالقصر ثم نقل إلى قصر السيدة بالمشتية {cite:wafayat-ayan}."
  en: "Abu Tahir Yahya b. Tamim — Zirid ruler of Ifriqiya, succeeded his father at al-Mahdiyya in Dhu al-Hijja 497 aged 43; left thirty sons and was succeeded by Ali b. Yahya {cite:wafayat-ayan}."
