summary:
  ar: "أحمد بن محمد بن عبد الله المعافري الأندلسي الطلمنكي، أبو عمر، مقرئ وعالم بالتفسير والحديث من أهل الأندلس، أول من أدخل علم القراءات إلى الأندلس بحسب الزركلي؛ وُلد سنة 340 هـ وتوفي سنة 429 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 212}."
  en: "Ahmad ibn Muhammad ibn Abd Allah al-Ma'afiri al-Andalusi al-Talamanki, Abu Umar, a reciter and scholar of exegesis and hadith of al-Andalus, the first to bring the science of the recitations there according to al-Zirikli; born 340 AH, died 429 AH {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 212}."
  fr: "Ahmad ibn Muhammad ibn Abd Allah al-Ma'afiri al-Andalusi al-Talamanki, Abu Umar, lecteur et savant de l'exégèse et du hadith d'al-Andalus, premier à y introduire la science des lectures selon al-Zirikli ; né en 340 H, mort en 429 H {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 212}."
  es: "Ahmad ibn Muhammad ibn Abd Allah al-Ma'afiri al-Andalusi al-Talamanki, Abu Umar, recitador y erudito de la exégesis y los hadices de al-Ándalus, el primero en traer la ciencia de las recitaciones allí según al-Zirikli; nacido en 340 AH, fallecido en 429 AH {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 212}."
  ur: "احمد بن محمد بن عبد اللہ المافری الاندلسی التلمانکی، ابو عمر، الاندلس کے ایک قاری اور تفسیر و حدیث کے عالم، الزرکلی کے مطابق وہاں قرات کی سائنس لانے والے سب سے پہلے؛ پیدائش 340ھ، وفات 429ھ۔ 1 ص۔ 212}۔"
