summary:
  ar: قائد رومي كان والياً على القصر (حصن بابليون) تحت يد المقوقس عند الفتح، وزعم بعض مشايخ أهل مصر أنه بقي في الحصن بعد خروج المقوقس ثم خرج في سفن كانت مربوطة به {cite:futuh-misr-amir-1999 p. 85} {cite:futuh-misr-amir-1999 p. 96}.
  en: A Roman commander who governed the Qasr (the fortress of Babylon) under al-Muqawqis at the conquest; some elders of Egypt claimed he stayed in the fortress after al-Muqawqis left and later escaped in ships moored to it {cite:futuh-misr-amir-1999 p. 85} {cite:futuh-misr-amir-1999 p. 96}.
  ur: ایک رومی سالار جو فتح کے وقت مقوقس کے ماتحت قصر (بابلیون کے قلعے) کا والی تھا؛ مصر کے بعض بزرگوں کا گمان تھا کہ وہ مقوقس کے نکلنے کے بعد قلعے میں رہا اور بعد میں اس سے بندھی کشتیوں میں نکل گیا {cite:futuh-misr-amir-1999 p. 85} {cite:futuh-misr-amir-1999 p. 96}۔
