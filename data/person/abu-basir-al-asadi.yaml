summary:
  ar: "بطاقة أولية لأبي بصير ليث الأسدي، فقيه ومحدث الكوفة راوية القرن الثامن عن الباقر والصادق؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Basir Layth al-Asadi, the eighth-century Kufan jurist and muhaddith transmitting from al-Baqir and al-Sadiq; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar de Abu Basir Layth al-Asadi, jurista y muhaddith kufano del siglo VIII que transmitía hadices de al-Baqir y al-Sadiq; la entrada biográfica aún no se ha revisado en la página."
  fr: "Fiche provisoire d'Abu Basir Layth al-Asadi, juriste et muhaddith de Koufa du VIIIe siècle transmettant d'al-Baqir et d'al-Sadiq; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "آٹھویں صدی کے کوفان فقیہ اور محدث ابو بصیر لیث الاسدی کے لیے ڈرافٹ کارڈ جو البقر اور الصادق سے نقل کرتا ہے۔ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Kufa'lı bir hukukçu ve hadis âlimi olan, sekizinci yüzyılda yaşamış, el-Baqir ve el-Sadiq'in rivayetlerine dayanan Ebu Basir Laith el-Asadi'nin ön profili; biyografik kitaplarda adı geçmektedir ve biyografisi bu sayfada henüz incelenmemiştir."
  id: "Profil pendahuluan Abu Basir Laith al-Asadi, seorang ahli hukum dan sarjana hadits dari Kufa, seorang perawi abad kedelapan berdasarkan riwayat al-Baqir dan al-Sadiq; ia disebutkan dalam buku-buku biografi, dan biografinya belum diulas di halaman ini."
