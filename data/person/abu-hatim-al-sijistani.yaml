summary:
  ar: "أبو حاتم السجستاني، لغوي بصري من تلاميذ أبي زيد الأنصاري وأبي عبيدة والأصمعي، من تلاميذه ابن دريد والمبرد، ومن كتبه الأضداد والمعمرون، توفي في رجب سنة 255هـ/869م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  en: "Abu Hatim al-Sijistani, a philologist of Basra, a pupil of Abu Zayd al-Ansari, Abu 'Ubayda and al-Asma'i, and teacher of Ibn Duraid and al-Mubarrad, author of al-Addad and al-Mu'ammarun, who died in Rajab 255/869. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  ur: "ابو حاتم سجستانی، بصرہ کے لغوی، ابو زید انصاری، ابو عبیدہ اور اصمعی کے شاگرد، اور ابن درید و مبرد کے استاد، جن کی کتابوں میں الاضداد اور المعمرون شامل ہیں، رجب 255ھ/869ء میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  fr: "Abu Hatim al-Sijistani, philologue de Bassora, élève d'Abu Zayd al-Ansari, d'Abu 'Ubayda et d'al-Asma'i, et maître d'Ibn Duraid et d'al-Mubarrad, auteur d'al-Addad et d'al-Mu'ammarun, mort en Rajab 255/869. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  es: "Abu Hatim al-Sijistani, filólogo de Basora, alumno de Abu Zayd al-Ansari, Abu 'Ubayda y al-Asma'i, y maestro de Ibn Duraid y al-Mubarrad, autor de al-Addad y al-Mu'ammarun, que murió en Rajab 255/869. {citar:enciclopedia-del-islam-2 vol. 1 pág. 144}"
  tr: "Basralı dilbilimci ve Ebu Zeyd el-Ensari, Ebu Ubeyde ve el-Esma'i'nin öğrencisi olan ve öğrencileri arasında İbn Duraid ve el-Mübarrad'ın da bulunduğu Ebu Hatim el-Sicistani, \"El-Eddad\" ve \"El-Mu'ammarun\" gibi eserler yazdı. Recep 255 H.869'da vefat etti. {cite:ansiklopedi-of-islam-2 cilt. 1 s. 144}"
  id: "Abu Hatim al-Sijistani, seorang ahli bahasa Basran dan murid Abu Zayd al-Ansari, Abu Ubaydah, dan al-Asma'i, yang muridnya termasuk Ibn Duraid dan al-Mubarrad, menulis karya seperti \"Al-Adhdad\" dan \"Al-Mu'ammarun.\" Beliau wafat pada bulan Rajab 255 H/869 M. {mengutip:ensiklopedia-Islam-2 vol. 1 hal. 144}"
