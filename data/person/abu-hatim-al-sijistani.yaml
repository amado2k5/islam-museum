  ar: "أبو حاتم السجستاني، لغوي بصري من تلاميذ أبي زيد الأنصاري وأبي عبيدة والأصمعي، من تلاميذه ابن دريد والمبرد، ومن كتبه الأضداد والمعمرون، توفي في رجب سنة 255هـ/869م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  en: "Abu Hatim al-Sijistani, a philologist of Basra, a pupil of Abu Zayd al-Ansari, Abu 'Ubayda and al-Asma'i, and teacher of Ibn Duraid and al-Mubarrad, author of al-Addad and al-Mu'ammarun, who died in Rajab 255/869. {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
  ur: "ابو حاتم سجستانی، بصرہ کے لغوی، ابو زید انصاری، ابو عبیدہ اور اصمعی کے شاگرد، اور ابن درید و مبرد کے استاد، جن کی کتابوں میں الاضداد اور المعمرون شامل ہیں، رجب 255ھ/869ء میں وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 144}"
