id: person/abd-al-munim-ibn-al-faras
class: person
gender: male
label:
  ar: عبد المنعم بن الفرس الخزرجي (أبو محمد)
  en: Abd al-Mun'im ibn al-Faras al-Andalusi (Abu Muhammad, Maliki jurist)
summary:
  ar: فقيه مالكي ومحدث ونحوي ولغوي أندلسي؛ ولي القضاء بجزيرة شقر ثم بوادي آش وجيان وأخيرا بغرناطة، وجعل إليه النظر في الحسبة والشرطة؛ وقال ابن سالم إن ابن الجد لم يعلم بالأندلس أحفظ لمذهب مالك منه بعد ابن زرقون. من تصانيفه أحكام القرآن وأدب القضاء ومسائل الخلاف في النحو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  en: A Maliki jurist, traditionist, grammarian and lexicographer of al-Andalus; he was judge at Jazirat Shuqr, then at Wadi Ash, Jaen and finally Granada, with oversight of the hisba and police; Abu al-Rabi' ibn Salim reports that Ibn al-Jadd knew no one in al-Andalus more retentive of Malik\'s school after Ibn Zarqun. Works include Ahkam al-Qur'an, Adab al-Qada' and disputed questions in grammar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
  ur: اندلس کے مالکی فقیہ، محدث، نحوی اور لغوی؛ جزیرہ شقر، پھر وادی آش، جیان اور آخر میں غرناطہ میں قاضی رہے، اور حسبہ و شرطہ کی نگرانی بھی ان کے سپرد تھی؛ ابن الجد کی بات نقل ہوئی کہ ابن زرقون کے بعد مالک کے مذہب کو ان سے زیادہ کوئی حفظ نہیں رکھتا تھا؛ تصانیف میں احکام القرآن اور ادب القضاء ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7831}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7832}
