summary:
  ar: "محمود بن سليمان الحنفي الرومي الكفوي، قاض عالم بتراجم الحنفية من أهل كفه التركية، ولي قضاءها مدة وعاد إلى استانبول معزولاً وتوفي بها، وصاحب «كتائب أعلام الأخيار من فقهاء مذهب النعمان المختار»؛ توفي نحو سنة 990 هـ الموافقة نحو 1582م."
  en: "Mahmud ibn Sulayman al-Hanafi al-Rumi al-Kafawi, a judge and scholar of the biographies of the Hanafis, from the Turkish town of Kafa, judge there for a time, dismissed and back in Istanbul where he died; author of Kata'ib A'lam al-Akhyar min Fuqaha' Madhhab al-Nu'man al-Mukhtar; he died about 990 AH (about 1582 CE)."
