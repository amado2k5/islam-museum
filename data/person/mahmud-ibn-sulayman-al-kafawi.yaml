summary:
  ar: "محمود بن سليمان الحنفي الرومي الكفوي، قاض عالم بتراجم الحنفية من أهل كفه التركية، ولي قضاءها مدة وعاد إلى استانبول معزولاً وتوفي بها، وصاحب «كتائب أعلام الأخيار من فقهاء مذهب النعمان المختار»؛ توفي نحو سنة 990 هـ الموافقة نحو 1582م."
  en: "Mahmud ibn Sulayman al-Hanafi al-Rumi al-Kafawi, a judge and scholar of the biographies of the Hanafis, from the Turkish town of Kafa, judge there for a time, dismissed and back in Istanbul where he died; author of Kata'ib A'lam al-Akhyar min Fuqaha' Madhhab al-Nu'man al-Mukhtar; he died about 990 AH (about 1582 CE)."
  es: "Mahmud ibn Sulayman al-Hanafi al-Rumi al-Kafawi, juez y erudito de las biografías de los hanafíes, originario de la ciudad turca de Kafa, fue juez allí durante un tiempo, fue destituido y regresó a Estambul, donde falleció; autor de Kata'ib A'lam al-Akhyar min Fuqaha' Madhhab al-Nu'man al-Mukhtar; murió alrededor del año 990 de la Hégira (alrededor del año 1582 d. C.)."
  fr: "Mahmud ibn Sulayman al-Hanafi al-Rumi al-Kafawi, juge et érudit des biographies des Hanafites, originaire de la ville turque de Kafa, juge dans cette ville pendant un certain temps, révoqué et de retour à Istanbul où il est mort; auteur de Kata'ib A'lam al-Akhyar min Fuqaha' Madhhab al-Nu'man al-Mukhtar; il est mort vers 990 AH (environ 1582 CE)."
  ur: "محمود بن سلیمان الحنفی الرومی الکفاوی، جو ایک قاضی اور حنفیوں کی سوانح عمری کے عالم، ترکی کے قصبے کفا سے ہیں، ایک وقت کے لیے وہاں جج رہے، برطرف ہو کر واپس استنبول پہنچے جہاں ان کا انتقال ہو گیا۔ کتائب عالم الاخیار من فقہاء مذہب النعمان المختار کے مصنف؛ ان کی وفات تقریباً 990ھ ⁦(تقریباً 1582ء)⁩ ہوئی۔"
  tr: "Mahmud bin Süleyman el-Hanafi el-Rumi el-Kafavi, Kafa Türk halkından Hanefi biyografilerinde bilgili bir yargıç, bir süre yargıçlık yaptıktan sonra İstanbul'a inzivaya döndü ve orada öldü. Nu'man el-Muhtar okulundan 'Kata'ib A'lam al-Akhiyar min Fiqha' adlı eserin yazarıydı; yaklaşık 990 Hicri yılında, yani 1582 yılında öldü."
  id: "Mahmoud ibn Suleiman al-Hanafi al-Rumi al-Kafawi, seorang hakim cendekiawan dalam biografi Hanafi dari masyarakat Kafa Turki, pernah menjabat sebagai hakim untuk sementara waktu sebelum kembali ke Istanbul dalam pengasingan dan meninggal di sana. Ia adalah penulis 'Kata'ib A'lam al-Akhiyar min Fiqha' dari aliran Nu'man al-Mukhtar; ia meninggal sekitar tahun 990 H, yang bertepatan dengan tahun 1582 M."
