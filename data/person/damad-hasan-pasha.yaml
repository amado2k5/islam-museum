summary:
  ar: "بطاقة أولية لداماد حسن باشا المورلي، الصدر الأعظم العثماني في ١٧٠٣–١٧٠٤م وزوج السلطانة خديجة، توفي سنة ١٧١٣م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Damad Hasan Pasha al-Morli, the Ottoman grand vizier of 1703–1704 and husband of Sultan's daughter Khatice, d. 1713; the source entry is not yet checked on the page."
  es: "Ficha de nombramiento para Damad Hasan Pasha al-Morli, gran visir otomano de 1703-1704 y esposo de Khatice, hija del sultán, fallecido en 1713; la fuente aún no ha sido verificada en la página."
  fr: "Fiche de conscription de Damad Hasan Pasha al-Morli, grand vizir ottoman de 1703 à 1704 et époux de Khatice, fille du sultan, décédé en 1713; la source n'est pas encore vérifiée sur la page."
  ur: "1703-1704 کے عثمانی وزیر اعظم اور سلطان کی بیٹی ختیس کے شوہر داماد حسن پاشا المرلی کے لیے ڈرافٹ کارڈ۔ 1713; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1703-1704 yılları arasında Osmanlı Sadrazami ve Sultan Hadica'nın eşi Hasan Paşa el-Murli'nin damadı olan ön kart; Osmanlı tarih kitaplarında anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal menantu Hasan Pasha al-Murli, Wazir Agung Ottoman dari tahun 1703 hingga 1704 dan suami Sultan Khadija, yang meninggal pada tahun 1713; ia dikenang dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman."
