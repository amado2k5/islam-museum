summary:
  ar: "حياة سليمان سندي ⁦(وُلدت في 6 تشرين الثاني 1967 في مكة)⁩ عالمة تقنية حيوية سعودية، أول سعودية تحصل على الدكتوراه في التقنية الحيوية من جامعة كامبردج (2001)، ومؤسسة معهد الابتكار ومعهد الخليج ومشروع «التشخيص للجميع» للفحوص الطبية رخيصة التكلفة؛ عضوة في مجلس الشورى السعودي منذ 2013 وسفيرة اليونسكو للنوايا الحسنة للعلوم منذ 2012."
  en: "Hayat Sulaiman Sindi (born 6 November 1967 in Mecca) is a Saudi biotechnologist, the first Saudi woman to earn a PhD in biotechnology from the University of Cambridge (2001), and founder of the Institute for Imagination and Ingenuity and of the Diagnostics for All project for low-cost medical testing; she has been a member of Saudi Arabia's Consultative Assembly since 2013 and a UNESCO Goodwill Ambassador for the sciences since 2012."
  ur: "حیات سلیمان سندی (پیدائش 6 نومبر 1967، مکہ) سعودی بائیو ٹیکنالوجسٹ ہیں، کیمبرج یونیورسٹی سے بائیو ٹیکنالوجی میں پی ایچ ڈی کرنے والی پہلی سعودی خاتون (2001)، اور سستے طبی ٹیسٹوں کے منصوبے «تشخیص برائے سب» کی بانی؛ وہ 2013 سے سعودی مجلس شوریٰ کی رکن اور 2012 سے سائنس کے لیے یونیسکو کی خیرسگالی سفیر ہیں۔"
