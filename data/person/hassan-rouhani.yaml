summary:
  ar: "حسن روحاني ⁦(وُلد 12 تشرين الثاني 1948، واسمه عند الولادة حسن فريدون)⁩ رجل دين وسياسي إيراني، رئيس إيران من 3 آب 2013 إلى 3 آب 2021 خلفًا لمحمود أحمدي نجاد، وهو مجتهد شيعي تشكّل في حوزة قم وشغل قبل رئاسته مناصب برلمانية وأمنية رفيعة."
  en: "Hassan Rouhani (born 12 November 1948, birth name Hassan Fereydoun) is an Iranian cleric and politician who served as president of Iran from 3 August 2013 to 3 August 2021, succeeding Mahmoud Ahmadinejad. A Shia mujtahid formed at the Qom hawza, he had earlier held senior parliamentary and security posts."
  es: "Hassan Rouhani (nacido el 12 de noviembre de 1948, nombre de nacimiento Hassan Fereydoun) es un clérigo y político iraní que se desempeñó como presidente de Irán desde el 3 de agosto de 2013 hasta el 3 de agosto de 2021, sucediendo a Mahmoud Ahmadinejad. Muyahidín chií formado en la hawza de Qom, anteriormente ocupó altos cargos parlamentarios y de seguridad."
  fr: "Hassan Rouhani (né le 12 novembre 1948, de son vrai nom Hassan Fereydoun) est un religieux et homme politique iranien qui a été président de l'Iran du 3 août 2013 au 3 août 2021, succédant à Mahmoud Ahmadinejad. Mujtahid chiite formé à la hawza de Qom, il avait auparavant occupé d'importantes fonctions parlementaires et sécuritaires."
  ur: "حسن روحانی ⁦(پیدائش: 12 نومبر 1948، پیدائشی نام حسن فریدون)⁩ ایک ایرانی عالم اور سیاست دان ہیں جنہوں نے محمود احمدی نژاد کے بعد 3 اگست 2013 سے 3 اگست 2021 تک ایران کے صدر کی حیثیت سے خدمات انجام دیں۔ قم حوزہ میں ایک شیعہ مجتہد تشکیل دیا گیا، وہ اس سے قبل اعلیٰ پارلیمانی اور سیکورٹی عہدوں پر فائز رہ چکے ہیں۔"
  tr: "Hasan Ruhani (d. 12 Kasım 1948, orijinal adıyla Hassan Fereydoun), İranlı bir din adamı ve siyasetçidir; 3 Ağustos 2013'ten 3 Ağustos 2021'e kadar İran Cumhurbaşkanı olarak görev yapmış, Mahmud Ahmedinejad'ın yerine geçmiştir. Kum medresinde yetişmiş ve cumhurbaşkanlığından önce yüksek düzey parlamento ve güvenlik pozisyonlarında bulunan bir Şii hukukçudur."
  id: "Hassan Rouhani (lahir 12 November 1948, awalnya bernama Hassan Fereydoun) adalah seorang ulama dan politisi Iran, yang menjabat sebagai Presiden Iran dari 3 Agustus 2013 hingga 3 Agustus 2021, menggantikan Mahmoud Ahmadinejad. Ia adalah seorang ahli hukum Syiah yang dibentuk di seminari Qom dan memegang posisi tinggi di parlemen dan keamanan sebelum masa jabatannya sebagai presiden."
