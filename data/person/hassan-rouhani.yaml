  ar: "حسن روحاني (وُلد 12 تشرين الثاني 1948، واسمه عند الولادة حسن فريدون) رجل دين وسياسي إيراني، رئيس إيران من 3 آب 2013 إلى 3 آب 2021 خلفًا لمحمود أحمدي نجاد، وهو مجتهد شيعي تشكّل في حوزة قم وشغل قبل رئاسته مناصب برلمانية وأمنية رفيعة."
  en: "Hassan Rouhani (born 12 November 1948, birth name Hassan Fereydoun) is an Iranian cleric and politician who served as president of Iran from 3 August 2013 to 3 August 2021, succeeding Mahmoud Ahmadinejad. A Shia mujtahid formed at the Qom hawza, he had earlier held senior parliamentary and security posts."
