summary:
  ar: "مهندس مدني وسياسي سوري، رئيس مجلس الوزراء في سوريا من 11 يونيو 2020 إلى 14 سبتمبر 2024 في حكومة الرئيس السابق بشار الأسد. شغل قبلها مناصب وزارية في الأشغال العامة والإسكان والموارد المائية ومحافظتي دير الزور والقنيطرة."
  en: "Syrian civil engineer and politician, prime minister of Syria from 11 June 2020 to 14 September 2024 under former president Bashar al-Assad. He had previously held the public works and housing and water resources portfolios and the governorships of Deir ez-Zor and Quneitra."
  ur: "شامی سول انجینئر اور سیاست دان، سابق صدر بشار الاسد کے دور میں 11 جون 2020 سے 14 ستمبر 2024 تک شام کے وزیر اعظم رہے۔ اس سے پہلے وہ تعمیرات عامہ و رہائش اور آبی وسائل کی وزارتوں اور دیر الزور و قنیطرہ کی گورنری پر فائز رہے۔"
  es: "Ingeniero civil y político sirio, fue primer ministro de Siria desde el 11 de junio de 2020 hasta el 14 de septiembre de 2024 bajo el mandato del expresidente Bashar al-Assad. Anteriormente, ocupó las carteras de Obras Públicas y Vivienda y Recursos Hídricos, así como las gobernaciones de Deir ez-Zor y Quneitra."
  fr: "Ingénieur civil et homme politique syrien, il a été Premier ministre de Syrie du 11 juin 2020 au 14 septembre 2024 sous la présidence de Bachar al-Assad. Il avait auparavant occupé les portefeuilles des travaux publics, du logement et des ressources en eau, ainsi que les postes de gouverneur de Deir ez-Zor et de Quneitra."
  tr: "Suriyeli bir inşaat mühendisi ve siyasetçi, 11 Haziran 2020'den 14 Eylül 2024'e kadar eski Cumhurbaşkanı Beşar Esad hükümetinde Suriye Başbakanı olarak görev yaptı. Bundan önce, kamu işleri, konut, su kaynakları ve Deyr ez-Zor ile Kuneytra vilayetlerinde bakanlık görevlerinde bulundu."
  id: "Seorang insinyur sipil dan politisi Suriah, Perdana Menteri Suriah dari 11 Juni 2020 hingga 14 September 2024, dalam pemerintahan mantan Presiden Bashar al-Assad. Sebelumnya, ia memegang posisi menteri di bidang pekerjaan umum, perumahan, sumber daya air, serta provinsi Deir ez-Zor dan Quneitra."
