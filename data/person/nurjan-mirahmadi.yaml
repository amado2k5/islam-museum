summary:
  ar: "معلّم صوفي نقشبندي مقيم في فانكوفر بكندا، مؤسس مركز التأمل الصوفي (Sufi Meditation Center) سنة 2007 والمركز الإسلامي النقشبندي في فانكوفر، وحاصل على إجازة في تعليم التصوف من محمد ناظم الحقاني ومحمد هشام قباني ومحمد عادل الرباني. قناته على يوتيوب «الطريقة المحمدية» (The Muhammadan Way) تنقل مجالسه الأسبوعية، وهو مؤسس جمعية فاطمة الزهراء الخيرية (Fatima Zahra Helping Hand) ومؤلف كتب منها «حقيقة خالدة» (A Timeless Reality، 2021). درس إدارة الأعمال في جامعة جنوب كاليفورنيا وتخرج سنة 1990."
  en: "A Naqshbandi Sufi teacher based in Vancouver, Canada, founder of the Sufi Meditation Center (2007) and of the Naqshbandi Islamic Center of Vancouver, who holds ijaza to teach Sufism from Muhammad Nazim al-Haqqani, Muhammad Hisham Kabbani and Muhammad Adil ar-Rabbani. His YouTube channel, The Muhammadan Way, carries his weekly discourses; he founded the Fatima Zahra Helping Hand charity and has authored books including A Timeless Reality (2021). He studied business management at the University of Southern California, graduating in 1990."
  ur: "وینکوور، کینیڈا میں مقیم نقشبندی صوفی استاد؛ صوفی میڈیٹیشن سینٹر (2007) اور نقشبندی اسلامک سینٹر آف وینکوور کے بانی، اور محمد ناظم الحقانی، محمد ہشام قبانی اور محمد عادل الربانی سے تصوف کی تعلیم کی اجازت یافتہ۔ ان کا یوٹیوب چینل The Muhammadan Way ان کی ہفتہ وار صحبتیں نشر کرتا ہے؛ وہ خیراتی ادارے Fatima Zahra Helping Hand کے بانی اور «A Timeless Reality» (2021) سمیت کئی کتابوں کے مصنف ہیں۔ انہوں نے یونیورسٹی آف سدرن کیلیفورنیا سے بزنس مینجمنٹ کی تعلیم 1990 میں مکمل کی۔"
