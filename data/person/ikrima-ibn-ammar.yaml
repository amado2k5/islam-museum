summary:
  ar: "عكرمة بن عمار، أبو عمار العجلي اليمامي، محدّث روى عن الهرماس بن زياد الصحابي وعن طاوس وسالم وعطاء ويحيى بن أبي كثير، وعنه يحيى القطان وابن مهدي وأبو الوليد. أخرج له مسلم وأهل السنن. وثّقه ابن معين وعلي بن المديني، وقال أبو حاتم: صدوق ربما يهم، وضعّف القطان وأحمد والبخاري حديثه عن يحيى بن أبي كثير خاصة. ويُذكر أنه كان مستجاب الدعوة، شديداً على القائلين بالقدر {cite:mizan-itidal-bijawi-v3 p. 90-93}."
  en: "Ikrima ibn Ammar, Abu Ammar al-Ijli of al-Yamama, a hadith transmitter who narrated from the Companion al-Hirmas ibn Ziyad and from Tawus, Salim, Ata and Yahya ibn Abi Kathir; Yahya al-Qattan, Ibn Mahdi and Abu al-Walid narrated from him. Muslim and the Sunan authors included him. Ibn Ma'in and Ali ibn al-Madini judged him trustworthy, Abu Hatim called him truthful but sometimes mistaken, and al-Qattan, Ahmad and al-Bukhari weakened his reports from Yahya ibn Abi Kathir in particular. He is said to have had his prayers answered and to have been fierce against those who held the Qadari doctrine {cite:mizan-itidal-bijawi-v3 p. 90-93}."
  ur: "عکرمہ بن عمار، ابو عمار عجلی یمامی، محدث جنہوں نے صحابی ہرماس بن زیاد اور طاؤس، سالم، عطا اور یحییٰ بن ابی کثیر سے روایت کی؛ ان سے یحییٰ قطان، ابن مہدی اور ابو الولید نے روایت کی۔ مسلم اور اصحابِ سنن نے ان کی روایت لی۔ ابن معین اور علی بن المدینی نے انہیں ثقہ کہا، ابو حاتم نے صدوق، کبھی وہم کرنے والا، اور قطان، احمد اور بخاری نے خاص طور پر یحییٰ بن ابی کثیر سے ان کی روایات کو ضعیف قرار دیا۔ کہا جاتا ہے کہ وہ مستجاب الدعوات تھے اور قدریہ پر سخت تھے {cite:mizan-itidal-bijawi-v3 p. 90-93}۔"
