      en: "Ya'qub ibn Shayba, from several who heard Ibn Ma'in: trustworthy and firm; Ibn Ma'in via Abu Hatim: he was unlettered but had a sound memory; Ali ibn al-Madini: among our colleagues he was trustworthy and firm; al-Hakim: Muslim cited him often as corroboration."
