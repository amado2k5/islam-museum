summary:
  ar: "أليمبك داتقا (1799–1862)، وُلد أليمبك أسان بي أوغلو، رجل دولة قرغيزي من ألاي بخانية خوقند؛ حمل لقب «داتقا» من سنة 1831، وحكم ولاية أنديجان، وصار وزيرًا للخانية، وقُتل في انقلاب قصر بخوقند سنة 1862. وهو زوج قرمانجان داتقا التي خلفته في حكم ألاي."
  en: "Alymbek Datka (1799–1862), born Alymbek Asan biy uulu, was a Kyrgyz statesman of the Alai in the Khanate of Kokand: he held the title Datka from 1831, governed the Andijan vilayet, rose to vizier of the khanate, and was murdered in a palace coup at Kokand in 1862. He was the husband of Kurmanjan Datka, who succeeded him as ruler of the Alai."
  ur: "أليمبك داتقا (1799–1862)، اصل نام أليمبك أسان بی اولو، خانیت خوقند میں آلائی کے کرغیز ریاستی رہنما تھے؛ 1831 سے «داتقا» کا لقب رکھتے تھے، اندیجان ولایت کے حاکم اور خانیت کے وزیر رہے، اور 1862 میں خوقند میں محلاتی سازش میں قتل ہوئے۔ وہ قرمانجان داتقا کے شوہر تھے۔"
