summary:
  ar: "علي بن الحسن بن موسى بن ميسرة الهلالي النيسابوري الدرابجردي، من أكابر علماء نيسابور وأبناء علمائها، وكان له مسجد بدرابجرد مذكور يُتبرّك بالصلاة فيه؛ سمع أبا عاصم النبيل وسليمان بن حرب ويعلى بن عبيد وأبا نعيم وخلقًا كثيرًا، وروى عنه البخاري ومسلم وابن خزيمة وغيرهم. توفي سنة سبع وستين ومائتين واختُلف في موته: فقيل وجُد ميتًا بعد أسبوع من وفاته في مسجده، وقيل إنه زبر العامل فلما جنّ الليل أمر به فأُدخل بيته وأُوقد النار في التبن فمات من الدخان ثم وجد ميتًا قد أكلت الديدان عينيه، وقيل أكله الذئب فلم يوجد سوى رأسه ورجليه {cite:muntazam-ibn-al-jawzi p. 60}."
  en: "Ali ibn al-Hasan al-Hilali of Darabjird near Nishapur — a major scholar whose mosque there was held blessed; heard by al-Bukhari, Muslim and Ibn Khuzayma. He died in 267 under disputed reports: found dead a week later in his mosque, or murdered by a steward who lit straw-fire in his room, or taken by a wolf leaving only head and legs {cite:muntazam-ibn-al-jawzi p. 60}."
