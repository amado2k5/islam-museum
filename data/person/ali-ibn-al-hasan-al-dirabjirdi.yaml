class: person
label: { ar: "علي بن الحسن الدرابجردي", en: "Ali ibn al-Hasan al-Dirabjirdi", es: "Ali ibn al-Hasan al-Dirabjirdi", fr: "Ali ibn al-Hasan al-Dirabjirdi", ur: "علی ابن الحسن الدیرابجردی" }
summary:
  ar: "علي بن الحسن بن موسى بن ميسرة الهلالي النيسابوري الدرابجردي، من أكابر علماء نيسابور وأبناء علمائها، وكان له مسجد بدرابجرد مذكور يُتبرّك بالصلاة فيه؛ سمع أبا عاصم النبيل وسليمان بن حرب ويعلى بن عبيد وأبا نعيم وخلقًا كثيرًا، وروى عنه البخاري ومسلم وابن خزيمة وغيرهم. توفي سنة سبع وستين ومائتين واختُلف في موته: فقيل وجُد ميتًا بعد أسبوع من وفاته في مسجده، وقيل إنه زبر العامل فلما جنّ الليل أمر به فأُدخل بيته وأُوقد النار في التبن فمات من الدخان ثم وجد ميتًا قد أكلت الديدان عينيه، وقيل أكله الذئب فلم يوجد سوى رأسه ورجليه {cite:muntazam-ibn-al-jawzi p. 60}."
  en: "Ali ibn al-Hasan al-Hilali of Darabjird near Nishapur — a major scholar whose mosque there was held blessed; heard by al-Bukhari, Muslim and Ibn Khuzayma. He died in 267 under disputed reports: found dead a week later in his mosque, or murdered by a steward who lit straw-fire in his room, or taken by a wolf leaving only head and legs {cite:muntazam-ibn-al-jawzi p. 60}."
  es: "Ali ibn al-Hasan al-Hilali de Darabjird, cerca de Nishapur, fue un erudito destacado cuya mezquita era considerada bendita; fue escuchado por al-Bujari, Muslim e Ibn Khuzayma. Murió en 267 según relatos controvertidos: se dice que fue hallado muerto una semana después en su mezquita, o asesinado por un mayordomo que prendió fuego a su habitación, o devorado por un lobo, del que solo quedaron la cabeza y las piernas {cite:muntazam-ibn-al-jawzi p. 60}."
  fr: "Ali ibn al-Hasan al-Hilali de Darabjird, près de Nishapur, était un éminent savant dont la mosquée était considérée comme bénie. Ses écrits ont été rapportés par al-Bukhari, Muslim et Ibn Khuzayma. Il mourut en 267 dans des circonstances controversées: on le retrouva mort une semaine plus tard dans sa mosquée, on le prétendit assassiné par un intendant qui mit le feu à sa chambre, ou encore dévoré par un loup, ne laissant derrière lui que sa tête et ses jambes (voir: Muntazam ibn al-Jawzi, p. 60)."
  ur: "نیشاپور کے قریب درابجرد کا علی بن الحسن ہلالی - ایک بڑا عالم جس کی مسجد مبارک تھی؛ اسے بخاری، مسلم اور ابن خزیمہ نے سنا ہے۔ متضاد اطلاعات کے تحت اس کی موت 267 میں ہوئی: ایک ہفتہ بعد اس کی مسجد میں مردہ پایا گیا، یا اس کے کمرے میں بھوسے کی آگ جلانے والے ملازم کے ہاتھوں قتل ہوا، یا اسے بھیڑیے نے لے لیا جس کا صرف سر اور ٹانگیں رہ گئی تھیں۔ 60}۔"
  tr: "Ali ibn el-Hasan ibn Musa ibn Maysarah al-Hilali al-Naysaburi el-Darabcerdi, Nişapur'un önde gelen alimlerinden biri ve alimlerinin oğulları. Darabcerd'de dua ederek bereket dilediği bir camisi vardı; Abu Asim al-Nabil, Süleyman ibn Harb, Ya'la ibn Ubayd, Abu Nu'eym ve daha birçoklarından dinledi. El-Buhari, Müslüman, İbn Khuzaymah ve diğerleri ondan anlattı. 267 Hicri yılında öldü ve ölümü konusunda anlaşmazlıklar vardır: bazıları ölümünden bir hafta sonra camide ölü bulunduğunu, bazıları ise bir hafta sonra ölü bulunduğunu, bazıları ise hizmetçinin hizmetkârı olduğunu söyler. Gece olunca, evine girip samanı ateş yakması emredildi ve dumandan dolayı öldü. Solucanlar tarafından ölü bulundu ve bir kurt tarafından yendiği söylenir, ancak sadece başı ve bacakları bulundu {alıntı::Muntazam-ibn-al-Jawzi, s. 60}."
  id: "Ali ibn al-Hasan ibn Musa ibn Maysarah al-Hilali al-Naysaburi al-Darabjerdi, salah satu ulama terkemuka Nishapur dan putra-putra ulamanya. Ia memiliki masjid yang disebutkan di Darabjerd tempat ia memohon berkat dengan berdoa; ia mendengar dari Abu Asim al-Nabil, Sulayman ibn Harb, Ya'la ibn Ubayd, Abu Nu'aym, dan banyak lainnya. Al-Bukhari, Muslim, Ibn Khuzaymahmah., dan yang lain menceritakan darinya. Ia meninggal pada tahun 267 H, dan ada perbedaan pendapat tentang kematiannya: beberapa mengatakan ia ditemukan meninggal seminggu setelah kematiannya di masjidnya, dan yang lain mengatakan ia ditemukan meninggal seminggu setelah kematiannya, sementara yang lain mengatakan ia adalah pelayan pelayan. Ketika malam tiba, ia diperintahkan masuk ke rumahnya dan menyalakan api di jerami, dan ia meninggal karena asap itu. Ia ditemukan mati oleh cacing, dan dikatakan ia dimakan serigala, tetapi hanya kepala dan kakinya yang ditemukan {cite:Muntazam-ibn-al-Jawzi, hlm. 60}."
