summary:
  ar: "ثعلب أبو العباس أحمد بن يحيى، إمام المدرسة الكوفية في بغداد وخصم المبرد؛ كان بينهما نزاع على رياسة العلم في بغداد من أسبابه اختلاف مدرستهما، فالمبرد بصري تعلم على المذهب البصري وطريقته وثعلب كوفي تعلم على المذهب الكوفي وبينهما اختلاف كبير في النحو والصرف واللغة فيما يقاس وما لا يقاس، وقد ظفر المبرد بثعلب لأن المبرد كان حسن العبارة حلو الإشارة فصيح اللسان ظاهر البيان وثعلب متحفظاً منكمشاً ليس فيه لباقة المبرد وفصاحته، وكان المبرد يحب الاجتماع بثعلب للمناظرة وثعلب يراوغ {cite:duha-islam p. 287-288}."
  en: "Tha'lab — head of the Kufan grammar school in Baghdad and al-Mubarrad's great rival; the Basran–Kufan methodic quarrel embodied in two men {cite:duha-islam p. 287-288}."
  es: "Tha'lab, director de la escuela primaria Kufan en Bagdad y gran rival de al-Mubarrad; la disputa metódica Basran-Kufan encarnada en dos hombres {cita:duha-islam p. 287-288}."
  fr: "Tha'lab, directeur du lycée Kufan à Bagdad et grand rival d'al-Mubarrad; la querelle méthodique Basran-Kufan incarnée par deux hommes {cite:duha-islam p. 287-288}."
  ur: "ثعلب — بغداد میں کوفان گرامر اسکول کے سربراہ اور المبراد کے عظیم حریف؛ بصران-کوفان کا طریقہ کار جھگڑا دو آدمیوں میں مجسم ہے {حوالہ:دوہ اسلام ص۔ 287-288}۔"
  tr: "Bağdat'taki Kufa okulunun imamı ve el-Mübarrad'ın karşıtı olan Telab Ebu el-Abbas Ahmed bin Yahya; farklı okulları nedeniyle Bağdat'ta bilgi liderliği konusunda bir anlaşmazlık vardı. El-Mübared Basran'dı ve Basri okulu ile yöntemine göre eğitim aldı; El-Fox ise Kufi okulunu inceleyen bir Kufandı ve ölçülen ile ölçülemeyecek konularda dilbilgisi, morfoloji ve dil açısından önemli farklılıklar vardı. El-Mübarrad, etkileyici ve net bir şekilde ifade eden olduğu için Tha'lab'ı kazandı. El-Mübarred, El-Mübarrad'ın hitabeti ve hitabeti olmadan çekingen ve dışlanmıştı. El-Mübarrad, Tha'lab ile tartışmak ve kaçınmak için görüşmeyi severdi {atıf:Duha-İslam, s. 287-288}."
  id: "Tha'lab Abu al-Abbas Ahmad ibn Yahya, imam aliran Kufa di Baghdad dan lawan al-Mubarrad; terjadi perselisihan mengenai kepemimpinan pengetahuan di Baghdad karena perbedaan aliran mereka. Al-Mubarrad adalah Basran dan belajar menurut aliran Basri dan metodenya, sedangkan Al-Fox adalah seorang Kufan yang mempelajari aliran Kufi, dan terdapat perbedaan signifikan antara mereka dalam tata bahasa, morfologi, dan bahasa mengenai apa yang diukur dan apa yang tidak bisa diukur. Al-Mubarrad memenangkan Tha'lab karena ia fasih bicara dan jelas fasih. Al-Mubarrad tertutup dan dijauhi tanpa kefasihan atau kefasihan Al-Mubarrad. Al-Mubarrad suka bertemu Tha'lab untuk berdebat dan menghindari {cite:Duha-Islam, hlm. 287-288}."
