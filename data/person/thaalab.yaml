summary:
  ar: "ثعلب أبو العباس أحمد بن يحيى، إمام المدرسة الكوفية في بغداد وخصم المبرد؛ كان بينهما نزاع على رياسة العلم في بغداد من أسبابه اختلاف مدرستهما، فالمبرد بصري تعلم على المذهب البصري وطريقته وثعلب كوفي تعلم على المذهب الكوفي وبينهما اختلاف كبير في النحو والصرف واللغة فيما يقاس وما لا يقاس، وقد ظفر المبرد بثعلب لأن المبرد كان حسن العبارة حلو الإشارة فصيح اللسان ظاهر البيان وثعلب متحفظاً منكمشاً ليس فيه لباقة المبرد وفصاحته، وكان المبرد يحب الاجتماع بثعلب للمناظرة وثعلب يراوغ {cite:duha-islam p. 287-288}."
  en: "Tha'lab — head of the Kufan grammar school in Baghdad and al-Mubarrad's great rival; the Basran–Kufan methodic quarrel embodied in two men {cite:duha-islam p. 287-288}."
