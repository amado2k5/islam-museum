id: person/umaym-ibn-lawdh
class: person
label: { ar: "أميم بن لاوذ", en: "Umaym ibn Lawdh", es: "Umaym ibn Lawdh", fr: "Umaym ibn Lawdh", ur: "امیہ بن لحد" }
summary:
  ar: "أميم بن لاوذ بن إرم بن سام بن نوح سار بعد جرهم بن قحطان فحل بأرض فارس، فالفرس عند المسعودي من ولد كيومرث بن أميم بن لاوذ، وفيه يقول شاعر من أهل الحكمة من شعراء فارس في الإسلام أبونا أميم الخير من قبل فارس {cite:muruj-al-dhahab p. 458}."
  en: "Descendant of Aram who marched to Persia — whence al-Mas'udi derives the Persians from his son Kayumarth, celebrated even by Islam-era Persian poets as 'our father Umaym' {cite:muruj-al-dhahab p. 458}."
  es: "Descendiente de Aram, quien marchó a Persia, de donde al-Mas'udi deriva el nombre de los persas de su hijo Kayumarth, celebrado incluso por los poetas persas de la era islámica como 'nuestro padre Umaym' {cite:muruj-al-dhahab p. 458}."
  fr: "Descendant d'Aram qui a marché jusqu'en Perse — d'où al-Mas'udi tire les Perses de son fils Kayumarth, célébré même par les poètes persans de l'époque islamique comme « notre père Umaym » {cite:muruj-al-dhahab p. 458}."
  ur: "ارم کی اولاد جس نے فارس کی طرف کوچ کیا - جہاں سے المسعودی نے فارسیوں کو اپنے بیٹے کیومرت سے اخذ کیا، یہاں تک کہ اسلام کے زمانے کے فارسی شاعروں نے 'ہمارے باپ امیہ' کے نام سے منایا۔ 458}۔"
  tr: "Umam ibn Laudh ibn Iram ibn Sam ibn Nuh, Jurhum ibn Qahtan'ı takip ederek İran topraklarına doğru yola çıktı. al-Mas'udi'ye göre, Persler Kiumarth ibn Umaym ibn Lawadh'ın soyundan gelir. Bu bağlamda, bilge bir şair ve İslam'da İran'ın şairlerinden biri şöyle der: Babamız Umaym, Pers'in en iyisiydi {atıf:muruj-al-dhahab, s. 458}."
  id: "Umaym ibn Laudh ibn Iram ibn Sam ibn Nuh mengikuti Jurhum ibn Qahtan dan berangkat ke tanah Persia. Menurut al-Mas'udi, orang Persia adalah keturunan Kiumarth ibn Umaym ibn Lawadh. Dalam hal ini, seorang penyair dari kalangan bijaksana dan salah satu penyair Persia dalam Islam berkata: Ayah kami Umaym adalah yang terbaik dari Persia {cite:muruj-al-dhahab, hlm. 458}."
