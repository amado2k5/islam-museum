summary:
  ar: "شهاب الدين أحمد بن ابن العليف المحلي الشافعي؛ كان مشتغلاً بالأدب ونظّم في كل معنى نظماً سائغاً، وكان ممن ترامى إليه الحظ من زبدة الدهر فأعطى بركات في النفع وعيشاً رغداً وهناء، وكان قد رُكّب له مرتب على رسم ابن العليف في آخر أيام السلطان الأشرف قايتباي — ابن عمه — فلما استولى على الأمر السلطان قانصوه الغوري أقطع له وكان في أيامه حالة حسنة؛ توفي سنة ست وعشرين وتسعمائة {cite:shadharat-dhahab p. 554}."
  en: "The second Ibn al-'Ulayf — a smooth versifier 'on every theme' who 'took his share of fortune's cream'; a stipend arranged under his cousin Qaytbay was continued as iqta' under al-Ghuri, and his affairs prospered through that reign; d. 926 {cite:shadharat-dhahab p. 554}."
