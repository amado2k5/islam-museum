summary:
  ar: "شهاب الدين أحمد بن ابن العليف المحلي الشافعي؛ كان مشتغلاً بالأدب ونظّم في كل معنى نظماً سائغاً، وكان ممن ترامى إليه الحظ من زبدة الدهر فأعطى بركات في النفع وعيشاً رغداً وهناء، وكان قد رُكّب له مرتب على رسم ابن العليف في آخر أيام السلطان الأشرف قايتباي — ابن عمه — فلما استولى على الأمر السلطان قانصوه الغوري أقطع له وكان في أيامه حالة حسنة؛ توفي سنة ست وعشرين وتسعمائة {cite:shadharat-dhahab p. 554}."
  en: "The second Ibn al-'Ulayf — a smooth versifier 'on every theme' who 'took his share of fortune's cream'; a stipend arranged under his cousin Qaytbay was continued as iqta' under al-Ghuri, and his affairs prospered through that reign; d. 926 {cite:shadharat-dhahab p. 554}."
  es: "El segundo Ibn al-'Ulayf, un versificador fluido \"sobre cualquier tema\" que \"recibió su parte de la riqueza\"; un estipendio establecido bajo su primo Qaytbay continuó como iqta' bajo al-Ghuri, y sus asuntos prosperaron durante ese reinado; murió en 926 {cita: shadharat-dhahab p. 554}."
  fr: "Le second Ibn al-'Ulayf — un versificateur talentueux « sur tous les thèmes » qui « a pris sa part de la crème de la fortune »; une rente organisée sous son cousin Qaytbay a été maintenue sous forme d'iqta' sous al-Ghuri, et ses affaires ont prospéré pendant ce règne; mort en 926 {cite: shadharat-dhahab p. 554}."
  ur: "دوسرا ابن العلیف - ایک ہموار 'ہر موضوع پر' جس نے 'قسمت کی کریم میں سے اپنا حصہ لیا'؛ ان کے چچا زاد بھائی قیتبے کے تحت ایک وظیفہ کا اہتمام الثوری کے تحت اقتا کے طور پر جاری رکھا گیا، اور اس دور حکومت میں ان کے معاملات ترقی کرتے رہے۔ d 926 {حوالہ: شدھارت ذہاب ص۔ 554}۔"
  tr: "Şihabeddin Ahmed ibn al-'Alif al-Mahalli al-Shafi'i; edebiyatla ilgilendi ve her anlamda şiirsel şiirler yazdı. Zamanın özünden şans arayanlardandı, bereket ve refahlı, mutlu bir yaşam sağladı. Sultan el-Eşref Kaitbey'in—kuzeni—son günlerinde, ona İbn el-Alif tarzında bir yazı düzenlemişti; Sultan Kansuh al-Ghuri tahta geçtiğinde ona bir ferman verdi ve döneminde iyi bir durumdaydı; 926 yılında öldü {atıf:Shadharat-Dhahab, s. 554}."
  id: "Shihab al-Din Ahmad ibn Ibn al-'Alif al-Mahalli al-Shafi'i; ia terlibat dalam sastra dan menulis puisi dalam segala hal. Ia termasuk di antara mereka yang mencari keberuntungan dari esensi waktu, memberikan berkah berupa manfaat dan kehidupan yang makmur dan bahagia. Ia telah mengatur naskah dengan gaya Ibn al-'Alif pada hari-hari terakhir Sultan al-Ashraf Qaitbay—sepupunya—ketika Sultan Qansuh al-Ghuri mengambil alih tahta, ia memberinya sebuah dekrit dan berada dalam keadaan baik selama masa jabatannya; ia meninggal pada tahun 926 {cite:shadharat-dhahab, hlm. 554}."
died: { edtf: "1520", hijri: "0926", calendar: julian, precision: year, status: tradition, derived: true, note: "926؛ التحويل مشتق {cite:shadharat-dhahab p. 554}", sources: [source/shadharat-dhahab] }
