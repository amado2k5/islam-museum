summary:
  ar: "باحث فرنسي كتب «حياة محمد»، وهو الكتاب الذي أخذ عنه الدكتور هيكل بحسب غلاب {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 69}. يعدّه غلاب من المحدثين الذين درسوا النصوص قبل الحكم، ويعرض عبارات له عن النبي بوصفه إنساناً معتدلاً وحكيماً ونبياً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 70} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 72} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 73}. ويرى أن الحرب بين الإسلام والمسيحية أورثت إساءة فهم من الجانب الغربي أكثر منها من الشرقي {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 35}. هذه أقوال درمنغهم كما نقلها غلاب، وليست حكماً من المتحف."
  tr: "Bir Fransız araştırmacı 'Muhammed'in Hayatı'nı yazmıştır; Dr. Heikal bunu Ghallab'a göre almıştır {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 69}. Ghallab, onu hükümdarlığından önce metinleri inceleyen hadis âlimlerinden biri olarak kabul eder ve Peygamber'i ılımlı, bilge ve peygamberlik yapan bir kişi olarak tanımlar sunar {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 70} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 72} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 73}. İslam ile Hristiyanlık arasındaki savaşın, Doğu'dan çok Batı tarafında yanlış anlamalara yol açtığına inanıyor {cite:al-Islam-kama-yarahu-al-urubiyyun-azhar s. 35}. Bunlar, Ghallab tarafından bildirilen Dermeng'in ifadeleridir ve müzeden bir yargı değildir."
  id: "Seorang peneliti Prancis menulis 'The Life of Muhammad,' yang diambil Dr. Heikal menurut Ghallab {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 69}. Ghallab menganggapnya sebagai salah satu ulama hadis yang mempelajari teks-teks sebelum pemerintahannya, dan ia menyajikan pernyataan tentang Nabi sebagai pribadi yang moderat, bijaksana, dan nabi {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 70} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 72} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 73} Ia percaya bahwa perang antara Islam dan Kristen telah menyebabkan kesalahpahaman dari pihak Barat lebih dari dari pihak Timur {cite:al-Islam-kama-yarahu-al-urubiyyun-azhar hlm. 35}. Ini adalah pernyataan dari Dermeng mereka seperti yang dilaporkan oleh Ghallab, dan bukan penilaian dari museum."
