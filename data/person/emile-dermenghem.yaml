summary:
  ar: "باحث فرنسي كتب «حياة محمد»، وهو الكتاب الذي أخذ عنه الدكتور هيكل بحسب غلاب {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 69}. يعدّه غلاب من المحدثين الذين درسوا النصوص قبل الحكم، ويعرض عبارات له عن النبي بوصفه إنساناً معتدلاً وحكيماً ونبياً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 70} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 72} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 73}. ويرى أن الحرب بين الإسلام والمسيحية أورثت إساءة فهم من الجانب الغربي أكثر منها من الشرقي {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 35}. هذه أقوال درمنغهم كما نقلها غلاب، وليست حكماً من المتحف."
