  es: "Actor, presentador y empresario de medios indonesio nacido en Bandung en 1987; uno de los presentadores de televisión más conocidos de Indonesia, junto con su esposa Nagita Slavina fundó RANS Entertainment, que se convirtió en un imperio empresarial y de contenido digital."
  fr: "Acteur, présentateur et entrepreneur médiatique indonésien né à Bandung en 1987; parmi les animateurs de télévision les plus connus d'Indonésie, il a fondé avec son épouse Nagita Slavina RANS Entertainment, qui est devenu un empire commercial et de contenu numérique."
  tr: "1987 yılında Bandung'da doğan Endonezyalı bir aktör, sunucu ve medya girişimcisi olan Endonezya'nın en ünlü televizyon sunucularından biri olan Endonezya'nın eşi Nagita Slavina ile birlikte dijital içerik ve iş imparatorluğuna dönüşen Rance Entertainment'ı kurdu."
  id: "Seorang aktor, presenter, dan pengusaha media Indonesia yang lahir pada tahun 1987 di Bandung; salah satu presenter televisi paling terkenal di Indonesia, ia mendirikan Rance Entertainment bersama istrinya Nagita Slavina, yang kemudian menjadi kerajaan konten digital dan bisnis."
