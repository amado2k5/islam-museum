  ar: ممثل ومقدم ورجل أعمال إعلامي إندونيسي وُلد سنة 1987 في باندونغ؛ من أشهر مقدمي التلفزيون الإندونيسي، وأسس مع زوجته ناغيتا سلافينا شركة «رانس إنترتينمنت» التي صارت إمبراطورية محتوى رقمي وأعمال.
  en: Indonesian actor, presenter and media entrepreneur born in Bandung in 1987; among Indonesia's best-known television hosts, with his wife Nagita Slavina he founded RANS Entertainment, which grew into
    a digital-content and business empire.
  ur: انڈونیشی اداکار، پیش کنندہ اور میڈیا کاروباری جو 1987 میں باندونگ میں پیدا ہوا؛ انڈونیشیا کے مشہور ترین ٹی وی میزبانوں میں، بیوی ناگیتا سلاوینا کے ساتھ RANS Entertainment قائم کیا جو ڈیجیٹل مواد اور
