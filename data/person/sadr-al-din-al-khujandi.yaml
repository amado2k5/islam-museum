summary:
  ar: "صدر الدين الخجندي رئيس الشافعية بأصفهان، وكان بعد الحاكم بها على جميع أهلها؛ كتب إلى الديوان ببغداد يبذل من نفسه تسليم البلد إلى من يصل من عساكر الديوان لكراهة أهلها عسكر خوارزم شاه، فوصل عسكر الخليفة الناصر سنة إحدى وتسعين وخمسمائة وفارق الخوارزمية البلد فملكها عسكر الخليفة {cite:kamil-ibn-al-athir p. 238-239}."
  en: "Ra'is of Isfahan's Shafi'is — 'second only to the governor over all its people' — who hated the Khwarazmian garrison enough to offer the city to Baghdad's Diwan, delivering Isfahan to al-Nasir's army in 591 {cite:kamil-ibn-al-athir p. 238-239}."
