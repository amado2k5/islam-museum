summary:
  ar: "صدر الدين الخجندي رئيس الشافعية بأصفهان، وكان بعد الحاكم بها على جميع أهلها؛ كتب إلى الديوان ببغداد يبذل من نفسه تسليم البلد إلى من يصل من عساكر الديوان لكراهة أهلها عسكر خوارزم شاه، فوصل عسكر الخليفة الناصر سنة إحدى وتسعين وخمسمائة وفارق الخوارزمية البلد فملكها عسكر الخليفة {cite:kamil-ibn-al-athir p. 238-239}."
  en: "Ra'is of Isfahan's Shafi'is — 'second only to the governor over all its people' — who hated the Khwarazmian garrison enough to offer the city to Baghdad's Diwan, delivering Isfahan to al-Nasir's army in 591 {cite:kamil-ibn-al-athir p. 238-239}."
  es: "Ra'is de los shafi'is de Isfahán —'segundo después del gobernador sobre todo su pueblo'— que odiaba tanto a la guarnición de Corasmia que ofreció la ciudad al Diwan de Bagdad, entregando Isfahán al ejército de al-Nasir en 591 {cite:kamil-ibn-al-athir p. 238-239}."
  fr: "Ra'is des Shafi'is d'Ispahan — « second seulement après le gouverneur sur tout son peuple » — qui détestait tellement la garnison khwarezmienne qu'il offrit la ville au Diwan de Bagdad, livrant ainsi Ispahan à l'armée d'al-Nasir en 591 {cite:kamil-ibn-al-athir p. 238-239}."
  ur: "اصفہان کے شافعیوں کے رئیس - 'اس کے تمام لوگوں پر گورنر کے لیے دوسرے نمبر پر' - جو خوارزمیوں کی چھاؤنی سے اتنی نفرت کرتے تھے کہ وہ شہر کو بغداد کے دیوان کو پیش کر سکتا تھا، اور 591 میں اصفہان کو ناصر کی فوج کے حوالے کر دیا تھا۔ 238-239}۔"
