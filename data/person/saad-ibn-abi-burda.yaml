summary:
  ar: "عامر بن أبي موسى عبد الله بن قيس، سعيد بن أبي بردة الأشعري الكوفي، روى عن أبيه وأنس بن مالك وأبي وائل وأبي حفص وربعي بن حراش، وعنه قتادة وأبو إسحاق الشيباني وشعبة، قال أحمد ثبت في الحديث، وقال صدوق ثقة، وذكره ابن حبان في الثقات. (؟-١٦٨ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13356}"
  en: "Amir ibn Abi Musa Abd Allah ibn Qays, Sa'id ibn Abi Burda al-Ash'ari of Kufa. He narrated from his father, Anas ibn Malik and others, and Qatada, Abu Ishaq al-Shaybani and Shu'ba narrated from him. Ahmad called him firm in hadith and reliable; Ibn Hibban lists him among the reliable. Death 168 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13356}"
