label: { ar: "أبو محلم" }
summary:
  ar: "مفسر رؤى عند الواثق، سئل عن رؤيا الواثق في المرت فقال المرت القفر الذي لا ينبت شيئاً فلا يهلك على الله إلا من قلبه خال من الإيمان خلو المرت من النبات، ثم أنشد للعرب مئة قافية لمئة شاعر معروف في كل بيت ذكر المرت فأمر له الواثق بمئة ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 533}."
  en: "A dream-interpreter of al-Wathiq's court; he read the caliph's vision of al-murt — 'the barren waste where nothing grows, so none perishes upon God but whose heart is void of faith as the murt of growth' — then recited a hundred Arabic rhymes on the word by a hundred known poets and was granted a hundred thousand dirhams {cite:tarikh-khulafa-minhaj-1434 p. 533}."
