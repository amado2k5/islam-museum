id: person/abu-muhallim
class: person
label: { ar: "أبو محلم", en: "Abu Muhallim", fr: "Abu Muhallim", es: "Abu Muhallim", ur: "ابومحلم" }
summary:
  ar: "مفسر رؤى عند الواثق، سئل عن رؤيا الواثق في المرت فقال المرت القفر الذي لا ينبت شيئاً فلا يهلك على الله إلا من قلبه خال من الإيمان خلو المرت من النبات، ثم أنشد للعرب مئة قافية لمئة شاعر معروف في كل بيت ذكر المرت فأمر له الواثق بمئة ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 533}."
  en: "A dream-interpreter of al-Wathiq's court; he read the caliph's vision of al-murt — 'the barren waste where nothing grows, so none perishes upon God but whose heart is void of faith as the murt of growth' — then recited a hundred Arabic rhymes on the word by a hundred known poets and was granted a hundred thousand dirhams {cite:tarikh-khulafa-minhaj-1434 p. 533}."
  fr: "Interprète des songes à la cour d'al-Wathiq ; il expliqua la vision du calife sur al-murt — « la terre stérile où rien ne pousse : nul ne périt devant Dieu sinon celui dont le cœur est vide de foi comme le murt l'est de végétation » —, puis récita cent rimes arabes sur ce mot par cent poètes connus et reçut cent mille dirhams {cite:tarikh-khulafa-minhaj-1434 p. 533}."
  es: "Un intérprete de sueños de la corte de al-Wathiq; leyó la visión del califa sobre al-murt —'el páramo estéril donde nada crece, por lo que nadie perece ante Dios sino aquel cuyo corazón está vacío de fe como el murt del crecimiento'— luego recitó cien rimas árabes sobre la palabra de cien poetas conocidos y se le concedieron cien mil dirhams {cite:tarikh-khulafa-minhaj-1434 p. 533}."
  ur: "الوثیق کی عدالت کا خواب کی تعبیر؛ اس نے خلیفہ کا المرت کا وژن پڑھا - 'وہ بنجر کچرا جہاں کچھ بھی نہیں اگتا، اس لیے خدا پر کوئی فنا نہیں ہوتا مگر جس کا دل نشوونما کے طور پر ایمان سے خالی ہے' - پھر ایک سو معروف شاعروں کے کلام پر سو عربی نظمیں سنائیں اور اسے ایک لاکھ درہم عطا کیے گئے۔ 533}۔"
  tr: "Vesih'in sarayındaki bir rüya yorumcusuna Vesih'in Murt hakkındaki rüyası soruldu ve o şöyle dedi: Murt, hiçbir şey yetişmeyen çorak bir topraktır; bu yüzden Allah katında ancak kalpleri imandan yoksun olanlar yok olur; tıpkı Murt'un bitki örtüsünden yoksun olması gibi. Sonra Araplara yüz tanınmış şairin yüz şiirini okudu; her dizede Murt'tan bahsetti. Bunun üzerine Vesih, ona yüz bin dinar verilmesini emretti. {Kaynak:tarikh-khulafa-minhaj-1434 s. 533}"
  id: "Seorang penafsir mimpi di istana Al-Wathiq ditanya tentang mimpi Al-Wathiq tentang Al-Murt, dan dia berkata: Al-Murt adalah tanah tandus yang tidak menumbuhkan apa pun, sehingga tidak ada yang binasa di hadapan Allah kecuali orang-orang yang hatinya kosong iman, setanah Al-Murt yang tidak memiliki tumbuh-tumbuhan. Kemudian dia membacakan kepada orang-orang Arab seratus sajak karya seratus penyair terkenal, di setiap baitnya dia menyebut Al-Murt, sehingga Al-Wathiq memerintahkan agar dia diberi seratus ribu dinar. {cite:tarikh-khulafa-minhaj-1434 p. 533}."
