summary:
  ar: "معمر بن عباد السلمي، من أهم رجال فرع البصرة في الاعتزال مع أبي بكر الأصم والنظام {cite:duha-islam p. 760}؛ ويذكر أحمد أمين أن اختيار العلماء لمعمر بن عباد السلمي جاء في سياق النزاع العلمي {cite:duha-islam p. 320}."
