  ur: "معمر بن عباد السلمی - معتزلہ کی بصرہ شاخ کا ایک سرکردہ آدمی 760}۔"
  tr: "Muammer bin Abbad el-Sulami, Mu'taziller arasında Basra kolunun en önemli isimlerinden biriydi; Ebu Bekir el-Esam ve el-Nizam ile birlikte {atıf:Duha-İslam, s. 760}; Ahmed Amin, alimlerin Muammer ibn 'Abbad al-Sulami'yi seçmesinin bilimsel bir anlaşmazlık bağlamında geldiğini belirtir {atıf:Duha-İslam, s. 320}."
  id: "Muammar ibn Abbad al-Sulami adalah salah satu tokoh terpenting dari cabang Basra dalam Mu'tazil, bersama Abu Bakr al-Asam dan al-Nizam {cite:Duha-Islam, hlm. 760}; Ahmad Amin menyebutkan bahwa pilihan para ulama terhadap Muammar ibn 'Abbad al-Sulami terjadi dalam konteks perselisihan ilmiah {cite:Duha-Islam, hlm. 320}."
