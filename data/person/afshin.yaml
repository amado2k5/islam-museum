id: person/afshin
education:
  did_you_know:
    ar: "الأفشين القائد العباسي حارب بابك الخرمي حتى قهره، وورد ذكر وقعة أصحابه مع آذين قائد بابك سنة ٢٢٢هـ، ولقي ملك الروم سنة ٢٢٣هـ فحاربه."
    en: "The Abbasid commander al-Afshin fought Babak al-Khurrami until he broke him — his men's clash with Babak's captain Adhin is dated 222 AH — and met the Byzantine king in battle in 223."
    ur: "عباسی سردار افشین نے بابک خرمی کو شکست دی — اس کے آدمیوں کی بابک کے سردار آذین سے 222ھ میں لڑائی لکھی گئی — اور 223ھ میں روم کے بادشاہ سے جنگ کی۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/muruj-al-dhahab]
class: person
label: { ar: "الأفشين", en: "al-Afshin" }
summary:
  ar: "قائد عباسي حارب بابك الخرمي، ورد ذكره في وقعة أصحابه مع آذين قائد بابك سنة اثنتين وعشرين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.670}. وعند المسعودي لقي ملك الروم سنة ثلاث وعشرين ومائتين فحاربه فهزمه وقتل أكثر بطارقته، وقصر عن أخذه قائلاً هو ملك والملوك تبقى بعضها على بعض، وتوجه المعتصم بتاج ذهب مرصع وإكليل ووشاحين، وثم أقر عليه المازيار بسامرا أنه بعثه على العصيان فقبض عليه قبل قدومه بيوم ومات في الحبس وصلب بباب العامة وأحرق مع أصنام حملت إليه {cite:muruj-al-dhahab p. 449-451}"
  en: "An Abbasid commander who fought Babak al-Khurrami; his name occurs in the engagement of his men with Adhin, Babak's commander, in 222 AH {cite:tabari-tarikh-abu-al-fadl j.9 p.670}. In al-Mas'udi's account he met the Byzantine ruler in 223 AH and defeated him in battle, killing most of his patricians, but held back from taking him, saying 'he is a king, and kings must spare one another'; al-Mu'tasim crowned him with a gold crown set with jewels, a diadem and two sashes. Then al-Mazyar, at Samarra, confessed against him that he had sent him to rebellion; he was arrested a day before his arrival, died in prison, was crucified at the Bab al-Amma and burned together with idols that had been brought to him {cite:muruj-al-dhahab p. 449-451}."
gender: male
