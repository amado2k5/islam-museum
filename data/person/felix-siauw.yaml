  ar: "كاتب وداعية إندونيسي من أصل صيني وُلد في بالمبانغ سنة 1984 في أسرة كاثوليكية، واعتنق الإسلام سنة 2002 أثناء دراسته الجامعية بعد لقائه ناشطاً في حزب التحرير الإندونيسي، وصار من أشهر المؤلفين الدينيين لدى الشباب في إندونيسيا بكتب مثل «محمد الفاتح 1453» و«هيا بنا نتحجب!»، وهو مرتبط دعوياً بحزب التحرير الإندونيسي."
  en: "Chinese-Indonesian writer and preacher born in Palembang in 1984 into a Catholic family. He converted to Islam in 2002 while at university, after meeting a Hizbut Tahrir Indonesia activist, and became one of Indonesia's best-known religious authors for young readers, with books such as Muhammad al-Fatih 1453 and Yuk Berhijab!. He is associated in his preaching with Hizbut Tahrir Indonesia."
