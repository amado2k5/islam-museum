label: { ar: "مرة الهمذاني", en: "Murrah al-Hamadhani", es: "Murrah al-Hamadhani", fr: "Murrah al-Hamadhani", ur: "مرہ الحمدانی" }
summary:
  ar: "مرة الهمذاني؛ روى أن علياً قال من كره منكم أن يقاتل معنا معاوية فليأخذ عطاءه وليخرج إلى الديلم فليقاتلهم قال وكنت في النخبة فأخذنا أعطياتنا وخرجنا إلى الديلم ونحن أربعة آلاف أو خمسة آلاف."
  en: "Murrah al-Hamadhani; he relates Ali's offer — whoever hates fighting Mu'awiya with us, take his stipend and go fight Daylam — and 'I was in the picked troop; we took our stipends and went out to Daylam four or five thousand'."
  es: "Murrah al-Hamadhani relata la oferta de Ali: «Quien odie luchar contra Mu'awiya con nosotros, que tome su estipendio y vaya a luchar contra Daylam», y añade: «Yo estaba en la tropa escogida; tomamos nuestros estipendios y fuimos a Daylam cuatro o cinco mil hombres»."
  fr: "Murrah al-Hamadhani; il relate l'offre d'Ali — que celui qui déteste combattre Mu'awiya avec nous, prenne sa solde et aille combattre Daylam — et « j'étais dans la troupe choisie; nous avons pris nos soldes et sommes partis pour Daylam à quatre ou cinq mille »."
  ur: "مرہ الحمدانی؛ وہ علی کی پیشکش کے بارے میں بتاتے ہیں - جو بھی ہمارے ساتھ معاویہ سے لڑنے سے نفرت کرتا ہے، اس کا وظیفہ لے اور دیلم سے لڑو - اور 'میں چنی ہوئی فوج میں تھا؛ ہم نے اپنا وظیفہ لیا اور چار پانچ ہزار دیلام کی طرف نکل گئے۔"
