summary:
  ar: "أروى بنت أحمد بن جعفر الصليحية، الملقبة بالحرة الكاملة وبلقيس الصغرى، ملكة يمانية حازمة مدبرة، نشأت في حجر أسماء بنت شهاب، وتزوجها المكرم فلما فُلج فوّض إليها الأمور، فحكمت من حصنها بذي جبلة، واستمرت في الحكم بعد المكرم وسبأ بن أحمد نحو أربعين سنة، يُخطب لها على منابر اليمن بعد المستنصر الفاطمي، وهي آخر ملوك الصليحيين."
  en: "Arwa bint Ahmad ibn Ja'far al-Sulayhiyya, called al-Hurra al-Kamila and 'the younger Bilqis', a resolute Yemeni queen raised by Asma' bint Shihab. When her husband al-Mukarram was paralysed he entrusted affairs to her; she ruled from her fortress at Dhu Jibla, continued after al-Mukarram and Saba' ibn Ahmad for some forty years, was named in the Friday sermon after the Fatimid al-Mustansir, and was the last of the Sulayhid rulers."
