summary:
  ar: "أروى بنت أحمد بن جعفر الصليحية، الملقبة بالحرة الكاملة وبلقيس الصغرى، ملكة يمانية حازمة مدبرة، نشأت في حجر أسماء بنت شهاب، وتزوجها المكرم فلما فُلج فوّض إليها الأمور، فحكمت من حصنها بذي جبلة، واستمرت في الحكم بعد المكرم وسبأ بن أحمد نحو أربعين سنة، يُخطب لها على منابر اليمن بعد المستنصر الفاطمي، وهي آخر ملوك الصليحيين."
  en: "Arwa bint Ahmad ibn Ja'far al-Sulayhiyya, called al-Hurra al-Kamila and 'the younger Bilqis', a resolute Yemeni queen raised by Asma' bint Shihab. When her husband al-Mukarram was paralysed he entrusted affairs to her; she ruled from her fortress at Dhu Jibla, continued after al-Mukarram and Saba' ibn Ahmad for some forty years, was named in the Friday sermon after the Fatimid al-Mustansir, and was the last of the Sulayhid rulers."
  es: "Arwa bint Ahmad ibn Ja'far al-Sulayhiyya, llamada al-Hurra al-Kamila y 'la joven Bilqis', fue una resuelta reina yemení criada por Asma' bint Shihab. Cuando su esposo al-Mukarram quedó paralizado, le confió los asuntos de la nación; gobernó desde su fortaleza en Dhu Jibla, y continuó en el poder tras al-Mukarram y Saba' ibn Ahmad durante unos cuarenta años. En el sermón del viernes se la menciona en honor al fatimí al-Mustansir, y fue la última de las gobernantes sulayhíes."
  fr: "Arwa bint Ahmad ibn Ja'far al-Sulayhiyya, surnommée al-Hurra al-Kamila et « la jeune Bilqis », était une reine yéménite déterminée, élevée par Asma' bint Shihab. Lorsque son époux, al-Mukarram, fut paralysé, il lui confia les affaires du pays. Elle régna depuis sa forteresse de Dhu Jibla, succédant à al-Mukarram et Saba' ibn Ahmad pendant une quarantaine d'années. Elle fut citée dans le sermon du vendredi après le Fatimide al-Mustansir et fut la dernière souveraine de la dynastie Sulayhid."
