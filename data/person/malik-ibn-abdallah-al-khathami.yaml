summary:
  ar: "مالك بن عبد الله الخثعمي الذي يقال له مالك الصوائف وهو من أهل فلسطين؛ عند البلاذري: غزا بلاد الروم سنة 46 وغنم غنائم كثيرة ثم قفل فلما كان من درب الحدث على خمسة عشر ميلاً بموضع يدعى الرهوة أقام فيها ثلاثاً فباع القنائم وقسم سهام الغنيمة فسُمّيت تلك الرهوة رهوة مالك."
  en: "Malik ibn Abdallah al-Khath'ami, called Malik al-Sawa'if ('of the summer expeditions'), of the people of Palestine; in al-Baladhuri: he raided Byzantine lands in year 46, won much booty, and on the way back halted three days at a place called al-Rahwa fifteen miles from the Darb al-Hadath, where he sold the spoils and divided the shares — that Rahwa has since been called Rahwat Malik."
