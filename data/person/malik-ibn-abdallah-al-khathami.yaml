label: { ar: "مالك بن عبد الله الخثعمي ⁦(مالك الصوائف)⁩", en: "Malik ibn Abdallah al-Khath'ami (Malik al-Sawa'if)", es: "Malik ibn Abdallah al-Khath'ami (Malik al-Sawa'if)", fr: "Malik ibn Abdallah al-Khath'ami (Malik al-Sawa'if)" }
summary:
  ar: "مالك بن عبد الله الخثعمي الذي يقال له مالك الصوائف وهو من أهل فلسطين؛ عند البلاذري: غزا بلاد الروم سنة 46 وغنم غنائم كثيرة ثم قفل فلما كان من درب الحدث على خمسة عشر ميلاً بموضع يدعى الرهوة أقام فيها ثلاثاً فباع القنائم وقسم سهام الغنيمة فسُمّيت تلك الرهوة رهوة مالك."
  en: "Malik ibn Abdallah al-Khath'ami, called Malik al-Sawa'if ('of the summer expeditions'), of the people of Palestine; in al-Baladhuri: he raided Byzantine lands in year 46, won much booty, and on the way back halted three days at a place called al-Rahwa fifteen miles from the Darb al-Hadath, where he sold the spoils and divided the shares — that Rahwa has since been called Rahwat Malik."
  es: "Malik ibn Abdallah al-Khath'ami, llamado Malik al-Sawa'if ('de las expediciones de verano'), del pueblo de Palestina; en al-Baladhuri: saqueó tierras bizantinas en el año 46, obtuvo un gran botín y, en el camino de regreso, se detuvo tres días en un lugar llamado al-Rahwa, a quince millas del Darb al-Hadath, donde vendió el botín y repartió las partes; desde entonces, ese Rahwa se llama Rahwat Malik."
  fr: "Malik ibn Abdallah al-Khath'ami, appelé Malik al-Sawa'if (« des expéditions d'été »), du peuple de Palestine; dans al-Baladhuri: il a pillé les terres byzantines en l'an 46, a gagné un important butin, et sur le chemin du retour, s'est arrêté trois jours à un endroit appelé al-Rahwa, à quinze milles de Darb al-Hadath, où il a vendu le butin et en a partagé les parts — ce Rahwa a depuis été appelé Rahwat Malik."
