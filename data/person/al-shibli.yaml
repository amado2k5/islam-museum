summary:
  ar: "أبو بكر دُلف بن جحدر، الخراساني الأصل البغدادي المولد والمنشأ، المعروف بالشبلي؛ صحب الشيخ أبا القاسم الجنيد ومن في عصره من الصلحاء وقضى بينهم، وكان في مبدأ أمره والياً على بلدٍ ثم ترك الدنيا، وكان إذا دخل رمضان أقبل على الطاعات ويقول: هذا شهرٌ عظَّمه ربي {cite:wafayat-ayan}."
  en: "Abu Bakr Dulaf b. Jahdar — al-Shibli of Baghdad, companion of al-Junayd; once a governor who left the world, he returned to the town he once ruled asking its people to absolve him {cite:wafayat-ayan}."
  fr: "Abu Bakr Dulaf b. Jahdar – al-Shibli de Bagdad, compagnon d’al-Junayd ; une fois gouverneur qui a quitté le monde, il est retourné dans la ville qu’il a gouvernée une fois demandant à son peuple de l’absoudre {cite:wafayat-ayan}."
  es: "Abu Bakr Dulaf b. Jahdar — al-Shibli de Bagdad, compañero de al-Junayd; una vez gobernador que dejó el mundo, regresó a la ciudad que una vez gobernó pidiendo a su gente que lo absolviera {cite:wafayat-ayan}."
  ur: "ابوبکر دلف بن الجہدر — بغداد کے الشبلی، الجنید کے ساتھی؛ ایک بار ایک گورنر جو دنیا سے چلا گیا، وہ اس شہر میں واپس آیا جس پر اس نے ایک بار حکمرانی کی اور اس کے لوگوں سے اسے بری کرنے کا کہا۔"
  tr: "Bağdat'ın Horasani kentinden olan Ebu Bekir Dulf bin Jahdar, Bağdat'ta doğup büyümüş, El-Şibli olarak bilinir, Şeyh Ebu el-Kasım el-Cunayd ve onun dönemindeki sahillerle birlikte gidip aralarında yargı yapmıştır. Başta bir şehrin valisiydi, ancak sonra bu dünyayı terk ederdi. Ramazan başladığında, kendini ibadete adar ve derdi ki: 'Bu, Rabbimin onurlandırdığı bir aydır.'"
  id: "Abu Bakr Dulf ibn Jahdar, berasal dari Khorasani di Baghdad, lahir dan besar di Baghdad, dikenal sebagai Al-Shibli, menemani Sheikh Abu al-Qasim al-Junayd dan orang-orang benar pada zamannya serta mengadili di antara mereka. Awalnya, dia adalah gubernur sebuah kota tetapi kemudian meninggalkan dunia ini. Setiap kali Ramadan dimulai, dia akan mendedikasikan dirinya untuk ibadah dan berkata: 'Ini adalah bulan yang telah dihormati oleh Tuhanku.'"
