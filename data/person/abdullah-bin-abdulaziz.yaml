summary:
  ar: "سادس ملوك المملكة العربية السعودية (2005–2015)، الابن العاشر للملك عبد العزيز من فهدة بنت عاصي الشريم؛ أمين مكة سنة 1961 وقائد الحرس الوطني من 1962 حتى نقل مهامه إلى ابنه سنة 2010، وولي العهد من 13 يونيو 1982 والحاكم الفعلي بعد جلطة الملك فهد سنة 1995، حتى خلفه ملكًا في 1 أغسطس 2005 وبقي حتى وفاته في الرياض في 23 يناير 2015."
  en: "Sixth King of Saudi Arabia (r. 2005–2015), the tenth son of King Abdulaziz, by Fahda bint Asi Al Shuraim. He was mayor of Mecca in 1961 and commander of the Saudi Arabian National Guard from 1962, a post whose duties he transferred to his son in 2010; Crown Prince from 13 June 1982 and de facto ruler after King Fahd's 1995 stroke, he succeeded as king on 1 August 2005 and reigned until his death at Riyadh on 23 January 2015."
  ur: "سعودی عرب کے چھٹے بادشاہ (2005ء–2015ء)، شاہ عبد العزیز کے دسویں صاحبزادے، والدہ فہدہ بنت عاصی الشریم؛ 1961ء میں مکہ کے امین اور 1962ء سے نیشنل گارڈ کے کمانڈر رہے جس کی ذمہ داریاں 2010ء میں اپنے بیٹے کو منتقل کیں؛ 13 جون 1982ء سے ولی عہد اور 1995ء میں شاہ فہد کے فالج کے بعد عملی حکمران؛ 1 اگست 2005ء کو بادشاہ بنے اور 23 جنوری 2015ء کو ریاض میں وفات تک حکومت کی۔"
