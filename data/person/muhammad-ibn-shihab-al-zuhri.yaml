label: { ar: "محمد بن شهاب الزهري", en: "Muhammad ibn Shihab al-Zuhri" }
summary:
  ar: "أبو بكر محمد بن مسلم بن شهاب الزهري، المتوفى سنة 124هـ/742م، أحد مؤسسي التراث الإسلامي بحسب «دائرة المعارف الإسلامية». تتلمذ على سعيد بن المسيب وعروة بن الزبير، وارتبط بالبيت الأموي من عهد عبد الملك إلى هشام، وتولى القضاء وجباية الضرائب ورئاسة الشرطة. دوّن الحديث وأقام مجالس إملاء، وكان مع سليمان بن عبد الملك بمرج دابق حين قرأ وصيته على الناس {cite:muruj-al-dhahab p. 172-173}."
  en: "Abu Bakr Muhammad ibn Muslim ibn Shihab al-Zuhri, who died in 124/742, is described by the Encyclopaedia of Islam as one of the founders of Islamic tradition. He studied under Sa'id ibn al-Musayyab and Urwa ibn al-Zubayr, stayed close to the Umayyad house from the time of Abd al-Malik to that of Hisham, and served as qadi, tax collector and head of the shurta. He wrote down hadith and held dictation sessions; he was also the scholar who read out Sulayman's succession at Marj Dabiq {cite:muruj-al-dhahab p. 172-173}."
  ur: "ابو بکر محمد بن مسلم بن شہاب زہری، متوفی 124ھ/742ء، کو «اسلامی انسائیکلوپیڈیا» اسلامی روایت کے بانیوں میں شمار کرتا ہے۔ انہوں نے سعید بن مسیب اور عروہ بن زبیر سے پڑھا، عبد الملک سے ہشام کے دور تک اموی خاندان کے قریب رہے، اور قاضی، محصل اور شرطہ کے سربراہ رہے۔ انہوں نے حدیث لکھی اور املا کی مجلسیں کیں، اور وہی ہیں جنہوں نے مرج دابق میں سلیمان کی جانشینی کی وصیت پڑھ کر سنائی {cite:muruj-al-dhahab p. 172-173}."
