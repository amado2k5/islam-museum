class: person
label: { ar: "محمد بن شهاب الزهري", en: "Muhammad ibn Shihab al-Zuhri" }
summary:
  ar: "ابن شهاب الزهري العالم، كان مع سليمان بمرج دابق حين حضرته الوفاة فكتب وصيته وأشهده عليها مع رجاء بن حيوة ومكحول، فلما دفن قام الزهري فقال أيها الناس أرضيتم من سماه أمير المؤمنين في وصيته ثم قرأ الكتاب فإذا اسم عمر بن عبد العزيز ومن بعده يزيد بن عبد الملك {cite:muruj-al-dhahab p. 172-173}.، وتوفي سنة ثلاث وعشرين ومائة وذكر الواقدي أنه مات سنة أربع وعشرين ومائة {cite:muruj-al-dhahab p. 192} ويذكر الكتاب أنه حضر مجلس سليمان مع أبي حازم، فقال سليمان له: أصاب الشيخ وأخطأت أنا. {cite:salabi-umayyad-state-2020 p.149} ويذكر الكتاب أن عمر بن عبد العزيز أمره بجمع السنن، فكتبها دفتراً دفتراً وبعث بها إلى كل أرض عليها سلطان، وأنه أُمر بكتابة السنة في مصارف الزكاة، وأن عمر قال: عليكم بابن شهاب، فإنه ما بقي أحد أعلم بسنة ماضية منه. {cite:salabi-umayyad-state-2020 p.298-300}"
  en: "The scholar who read out Sulayman's sealed succession at Marj Dabiq — 'do you accept whom the Commander named in his will?' — naming 'Umar then Yazid {cite:muruj-al-dhahab p. 172-173}."
