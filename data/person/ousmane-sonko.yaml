summary:
  ar: "سياسي سنغالي (وُلد 1974) من تييس، مفتش ضرائب سابق كشف التهرب الضريبي ففُصل، مؤسس حزب باستيف وقائده منذ 2014 ومرشحه الرئاسي في 2019؛ اعتُقل وحُوكم في 2021–2023 فمُنع من الترشح، ففاز صنيعته باسيرو ديوماي فاي بالرئاسة وعينه رئيسا للوزراء (2024–2026)، ثم أقاله فاي فصار رئيس الجمعية الوطنية في مايو 2026."
  en: "Senegalese politician (born 1974) from Thiès, a former tax inspector dismissed after whistleblowing on tax evasion, founder and leader of PASTEF since 2014 and its 2019 presidential candidate; arrested and tried in 2021–2023 and barred from standing, he saw his protégé Bassirou Diomaye Faye win the presidency and appoint him prime minister (2024–2026), before Faye dismissed him and he became president of the National Assembly in May 2026."
  ur: "سینیگال کے سیاست دان (پیدائش 1974ء) جن کا تعلق تھیس سے ہے؛ سابق ٹیکس انسپکٹر جنھیں ٹیکس چوری بے نقاب کرنے پر ملازمت سے ہٹا دیا گیا، 2014ء سے پاسٹف کے بانی و قائد اور 2019ء کے صدارتی امیدوار؛ 2021ء–2023ء میں گرفتاری و مقدمے کے بعد نااہل قرار پائے، ان کے شاگرد باسیرو دیومائے فائے صدر بنے اور انھیں وزیر اعظم مقرر کیا (2024ء–2026ء)، پھر فائے نے انھیں برطرف کر دیا اور وہ مئی 2026ء میں قومی اسمبلی کے صدر بن گئے۔"
