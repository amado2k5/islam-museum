summary:
  ar: "ماجد بن سعيد البوسعيدي (نحو 1834-1870)، أول سلاطين زنجبار. وُلد في أونغوجا بزنجبار، وهو ابن سعيد بن سلطان من جاريته الشركسية سارة، وكان نائبا لوالده في زنجبار قبل وفاته. خلف والده عند وفاته سنة 1856 فاعترض أخوه الأكبر ثويني من مسقط على خلافته، وانتهى النزاع بحكم كانينغ سنة 1861 الذي قسّم الممتلكات نهائيا: زنجبار وشرق أفريقيا لماجد، ومسقط وعُمان لثويني، مقابل أن تدفع زنجبار إعانة سنوية لمسقط. ثار عليه أخوه برغش سنة 1859 ففشل ونُفي إلى بومباي سنتين. ازدهرت في عهده ثروة زنجبار وتجارتها، وأسّس دار السلام على الساحل، وتوفي في زنجبار سنة 1870 فخلفه برغش."
  en: "Majid bin Said al-Busaidi (c. 1834–1870), first Sultan of Zanzibar. Born on Unguja, Zanzibar, a son of Said bin Sultan by his Circassian consort Sarah, he was his father's governor and regent in Zanzibar before Said's death. He succeeded his father in 1856, his elder brother Thuwaini at Muscat contested the succession, and the dispute ended with the Canning Award of 1861, which divided the dominions permanently: Zanzibar and East Africa to Majid, Muscat and Oman to Thuwaini, with Zanzibar paying an annual subsidy to Muscat. His brother Barghash rebelled in 1859, failed, and was exiled to Bombay for two years. Zanzibar's wealth and trade grew in his reign, he founded Dar es Salaam on the mainland coast, and he died at Zanzibar in 1870 and was succeeded by Barghash."
  ur: "ماجد بن سعید البوسعیدی (تقریباً 1834ء–1870ء)، زنجبار کے پہلے سلطان۔ اونگوجا، زنجبار میں پیدا ہوئے، سعید بن سلطان کے بیٹے تھے، اور والد کی زندگی ہی میں زنجبار میں ان کے نائب رہے۔ 1856ء میں والد کے جانشین بنے تو مسقط سے ان کے بڑے بھائی ثوینی نے جانشینی پر اعتراض کیا، اور یہ تنازع 1861ء کے کیننگ فیصلے پر ختم ہوا جس سے مملکت مستقل تقسیم ہو گئی: زنجبار اور مشرقی افریقا ماجد کو اور مسقط و عمان ثوینی کو ملے۔ ان کے بھائی برغش نے 1859ء میں بغاوت کی، ناکام ہوئے اور دو سال بمبئی جلا وطن رہے۔ ان کے دور میں زنجبار کی دولت اور تجارت بڑھی، انہوں نے ساحل پر دار السلام کی بنیاد رکھی، اور 1870ء میں زنجبار میں وفات پائی، ان کے بعد برغش سلطان بنے۔"
