    note: "Stated basis, following the settled pattern of his brother Ali bin Said's record in this lane. Majid's own article's infobox names his religion personally: Ibadi Islam. That personal attestation is corroborated at the level of the house and of the sultanate he himself founded and headed: the English article 'Al Bu Said dynasty' records the house's traditions as Ibadi Islam and counts the Sultanate of Zanzibar (1856–1964) among its realms, and the English article 'Ibadism' lists 'Al Bu Said dynasty: since 1744' with the sub-entry 'Zanzibari branch: 1856–1964' — the exact span Majid opened as its first sultan — among the Ibadi dynasties, resting on Hoffman (2012) and Lewicki (1971). His father's personal Ibadi affiliation is separately attested by Britannica and by his father's article. The value is therefore recorded as documented, with the reader able to see that the personal attestation is the infobox of his own article and the corroboration is dynastic."
