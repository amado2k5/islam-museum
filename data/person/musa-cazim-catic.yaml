summary:
  ar: "شاعر بوسني من أودجاك، تعلّم في تيشاني والقسطنطينية وسراييفو وزغرب، وحرّر مجلتي «بهار» و«بيسر»، وجمعت قصيدته بين الغزل والتصوف الشعري المتأثر بالشعراء الأتراك والفرس؛ مات بالسل في تيشاني سنة 1915، وصورته على ورقة الخمسين ماركاً البوسنية."
  en: "Bosnian poet from Odžak, educated at Tešanj, Constantinople, Sarajevo and Zagreb, who edited the journals Behar and Biser and whose verse joins eroticism to a mysticism drawn from Turkish and Persian poets; he died of tuberculosis at Tešanj in 1915 and is pictured on Bosnia and Herzegovina's 50-mark banknote."
  ur: "اوجاک سے تعلق رکھنے والے بوسنیائی شاعر، جنھوں نے تیشانی، قسطنطنیہ، سرائیوو اور زغرب میں تعلیم پائی، «بہار» اور «بیسر» کی ادارت کی، اور جن کی شاعری میں عشق و محبت کے ساتھ ترک و فارسی شعرا سے ماخوذ صوفیانہ رنگ ملتا ہے؛ 1915ء میں تیشانی میں تپِ دق سے وفات پائی، اور ان کی تصویر بوسنیا کی پچاس مارک کی نوٹ پر ہے۔"
