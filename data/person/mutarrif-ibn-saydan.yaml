id: person/mutarrif-ibn-saydan
class: person
label: { ar: "مطرف بن سيدان الباهلي", en: "Mutarrif ibn Saydan al-Bahili", es: "Mutarrif ibn Saydan al-Bahili", fr: "Mutarrif ibn Saydan al-Bahili", ur: "مطرف ابن سیدان الباہلی" }
summary:
  ar: "مطرف بن سيدان الباهلي أحد بني جناءة؛ ولاه مصعب بن الزبير شرطة البصرة فقتل النابي بن زياد بن ظبيان قاطع الطريق فثأر له أخوه عبيد الله فطعن مطرفاً فقتله ثم ولحق بعبد الملك بن مروان وقاتل معه مصعباً فقتله واحتز رأسه."
  en: "Mutarrif ibn Saydan al-Bahili of Banu Jana'a; Mus'ab's Basra police chief — he executed the highwayman al-Nabi ibn Ziyad ibn Zubyan, whose brother Ubaydallah avenged him in single stab, then joined Abd al-Malik and took Mus'ab's head."
  es: "Mutarrif ibn Saydan al-Bahili de Banu Jana'a; jefe de policía de Mus'ab en Basora: ejecutó al bandolero al-Nabi ibn Ziyad ibn Zubyan, cuyo hermano Ubaydallah lo vengó de una sola puñalada, y luego se unió a Abd al-Malik y le cortó la cabeza a Mus'ab."
  fr: "Mutarrif ibn Saydan al-Bahili de Banu Jana'a; chef de la police de Mus'ab à Bassora — il a exécuté le bandit de grand chemin al-Nabi ibn Ziyad ibn Zubyan, dont le frère Ubaydallah l'a vengé d'un seul coup de couteau, puis a rejoint Abd al-Malik et a pris la tête de Mus'ab."
  ur: "مطرف بن سیدان الباہلی بنو جنعہ؛ مصعب کے بصرہ پولیس کے سربراہ - اس نے شاہراہ مین النبی ابن زیاد ابن زبیان کو پھانسی دی، جس کے بھائی عبیداللہ نے اس کا بدلہ ایک ہی وار میں لیا، پھر عبد الملک کے ساتھ مل کر مصعب کا سر لے لیا۔"
  tr: "Mutraf ibn Sidan al-Bahili Banu Jana'ah'ın bir üyesiydi; Mus'ab ibn al-Zubayr onu Basra'nın polisi olarak atadı ve yol haydutu al-Nabi ibn Ziyad ibn Zubayyan'ı öldürdü. Kardeşi Ubayd Allah intikamını aldı, Mutarraf'ı bıçakladı ve öldürdü, ardından Abd al-Malik ibn Marwan'a katıldı ve Mus'ab ile birlikte savaştı, onu öldürdü ve kafasını kesti."
  id: "Mutraf ibn Sidan al-Bahili adalah salah satu Banu Jana'ah; Mus'ab ibn al-Zubayr mengangkatnya sebagai polisi Basra, membunuh al-Nabi ibn Ziyad ibn Zubayyan, perampok jalan raya. Saudaranya Ubayd Allah membalas dendamnya, menikam Mutarraf, membunuhnya, lalu bergabung dengan Abd al-Malik ibn Marwan dan melawan Mus'ab bersamanya, membunuhnya dan memenggal kepalanya."
