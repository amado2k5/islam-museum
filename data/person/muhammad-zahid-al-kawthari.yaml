summary:
  ar: "محمد زاهد بن الحسن بن علي الكوثري، فقيه حنفي جركسي الأصل له اشتغال بالأدب والسير، ولد قرب دوزجة وتفقه في جامع الفاتح بالآستانة ثم هاجر إلى مصر سنة ١٣٤١هـ وتوفي بالقاهرة سنة ١٣٧١هـ؛ صاحب تأنيب الخطيب ومقالات الكوثري."
  en: "Muhammad Zahid ibn al-Hasan ibn Ali al-Kawthari, a Hanafi jurist of Circassian origin who also busied himself with literature and biography, born near Duzce, trained at the Fatih mosque in Istanbul, who left for Egypt in 1341 AH (1922) and died in Cairo in 1371 AH (1952); author of Ta'nib al-Khatib and Maqalat al-Kawthari."
