summary:
  ar: "عالم وداعية أمريكي من أصل باكستاني، وُلد في هيوستن سنة 1975، درس في الجامعة الإسلامية بالمدينة المنورة ونال الدكتوراه من جامعة ييل، وهو عميد المعهد الإسلامي في أمريكا والخطيب المقيم في مركز بلانو الإسلامي الشرقي بتكساس."
  en: "American Muslim scholar of Pakistani descent, born in Houston in 1975. He studied at the Islamic University of Madinah and earned his doctorate at Yale University; he is dean of The Islamic Seminary of America and resident scholar of the East Plano Islamic Center in Texas."
