summary:
  ar: "جساس بن مرة بن ذهل بن شيبان البكري، قاتل كليب بن ربيعة؛ لما رمى كليب ضرع سراب ناقة جارته خالته البسوس وصاحت واذلاه علم جساس أنه ساق إلى صدره القتل، فلم يزل يطلب غرة كليب حتى أدركه فطعنه وقال «يا كليب الرمح وراءك» فلما قال له أقبل من أمامي لم يلتفت فطعنه فأرداه، وقال لأبيه مرة لما عوتب طعنة يجتمع بنو وائل غداً لها رقصاً، فاشتعلت بقتله حرب البسوس بين بكر وتغلب أربعين سنة {cite:kamil-ibn-al-athir p. 391-392}."
  en: "Jasas ibn Murra of Banu Shayban: when his aunt al-Basus cried shame over her guest's wounded camel he knew honour pointed at his own breast, stalked Kulayb and speared him — 'a thrust for which Wa'il's sons will gather dancing tomorrow' — lighting the forty-year Basus war {cite:kamil-ibn-al-athir p. 391-392}."
  es: "Jasas ibn Murra de Banu Shayban: cuando su tía al-Basus lloró avergonzada por el camello herido de su huésped, él supo que el honor le apuntaba al pecho, acechó a Kulayb y lo atravesó con su lanza —'una estocada por la que los hijos de Wa'il se reunirán bailando mañana'— encendiendo la guerra de cuarenta años de los Basus {cite:kamil-ibn-al-athir p. 391-392}."
  fr: "Jasas ibn Murra de Banu Shayban: lorsque sa tante al-Basus a crié à la honte à propos du chameau blessé de son invité, il a su que l'honneur pointait vers sa propre poitrine, a traqué Kulayb et l'a transpercé d'une lance — « un coup pour lequel les fils de Wa'il se rassembleront en dansant demain » — déclenchant la guerre des Basus de quarante ans {cite:kamil-ibn-al-athir p. 391-392}."
  ur: "بنو شیبان کے جصاص بن مرہ: جب اس کی خالہ الباسس اپنے مہمان کے زخمی اونٹ پر شرمندہ ہوئیں تو اس نے اپنے سینے میں عزت جان کر کلیب کو ڈنڈا مارا اور اسے نیزہ مارا - 'ایک زور جس کے لیے کل وائل کے بیٹے ناچتے ہوئے جمع ہوں گے' - چالیس سالہ بصیرت کو روشن کیا۔ 391-392}۔"
  tr: "Kulayb ibn Rabi'ah'ın katili Jassas ibn Murrah ibn Dhuhl ibn Shayban al-Bakri, Kulayb komşusunun teyzesi el-Basus'un dişi devesini fırlattığında annesi bağırıp onu küçük düşürdü. Jassas, onu öldürmek için göğsüne kadar sürdüğünü öğrendi. Kulayb'ın mızrağını aramaya devam etti, ta ki Kulayb ona yetişip bıçaklayana kadar; 'Ey Kulayb, mızrak arkanda.' dedi. Ona, 'Önümden gel,' dediğinde, Yüzünü dönmedi, onu bıçakladı ve o da karşılık verdi. Bıçaklandıktan sonra babasına, 'Banu Wa'il yarın bir dans için toplanacak.' dedi. El-Basus'un savaşı, kırk yıl yaşamış Bakr ile Taghlib arasında patlak verdi {atıf:kamil-ibn-al-athir, s. 391-392}."
  id: "Jassas ibn Murrah ibn Dhuhl ibn Shayban al-Bakri, pembunuh Kulayb ibn Rabi'ah, ketika Kulayb melemparkan ambing unta betina milik bibi tetangganya, al-Basus, dan ibunya berteriak serta mempermalukannya. Jassas mengetahui bahwa dia telah menusuknya ke dada untuk membunuh. Dia terus mencari tombak Kulayb sampai berhasil mengejarnya, menusuknya, dan berkata, 'Wahai Kulayb, tombak ada di belakangmu.' Ketika dia berkata, 'Masuklah dari depanku,' dia tidak berpaling, menusuknya, dan menjawab. Dia berkata kepada ayahnya suatu kali ditusuk, 'Banu Wa'il akan berkumpul besok untuk menari.' Perang al-Basus meletus antara Bakr dan Taghlib, yang hidup selama empat puluh tahun {cite:kamil-ibn-al-athir, hlm. 391-392}."
