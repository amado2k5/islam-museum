summary:
  ar: "جساس بن مرة بن ذهل بن شيبان البكري، قاتل كليب بن ربيعة؛ لما رمى كليب ضرع سراب ناقة جارته خالته البسوس وصاحت واذلاه علم جساس أنه ساق إلى صدره القتل، فلم يزل يطلب غرة كليب حتى أدركه فطعنه وقال «يا كليب الرمح وراءك» فلما قال له أقبل من أمامي لم يلتفت فطعنه فأرداه، وقال لأبيه مرة لما عوتب طعنة يجتمع بنو وائل غداً لها رقصاً، فاشتعلت بقتله حرب البسوس بين بكر وتغلب أربعين سنة {cite:kamil-ibn-al-athir p. 391-392}."
  en: "Jasas ibn Murra of Banu Shayban: when his aunt al-Basus cried shame over her guest's wounded camel he knew honour pointed at his own breast, stalked Kulayb and speared him — 'a thrust for which Wa'il's sons will gather dancing tomorrow' — lighting the forty-year Basus war {cite:kamil-ibn-al-athir p. 391-392}."
  es: "Jasas ibn Murra de Banu Shayban: cuando su tía al-Basus lloró avergonzada por el camello herido de su huésped, él supo que el honor le apuntaba al pecho, acechó a Kulayb y lo atravesó con su lanza —'una estocada por la que los hijos de Wa'il se reunirán bailando mañana'— encendiendo la guerra de cuarenta años de los Basus {cite:kamil-ibn-al-athir p. 391-392}."
  fr: "Jasas ibn Murra de Banu Shayban: lorsque sa tante al-Basus a crié à la honte à propos du chameau blessé de son invité, il a su que l'honneur pointait vers sa propre poitrine, a traqué Kulayb et l'a transpercé d'une lance — « un coup pour lequel les fils de Wa'il se rassembleront en dansant demain » — déclenchant la guerre des Basus de quarante ans {cite:kamil-ibn-al-athir p. 391-392}."
