summary:
  ar: "جساس بن مرة بن ذهل بن شيبان البكري، قاتل كليب بن ربيعة؛ لما رمى كليب ضرع سراب ناقة جارته خالته البسوس وصاحت واذلاه علم جساس أنه ساق إلى صدره القتل، فلم يزل يطلب غرة كليب حتى أدركه فطعنه وقال «يا كليب الرمح وراءك» فلما قال له أقبل من أمامي لم يلتفت فطعنه فأرداه، وقال لأبيه مرة لما عوتب طعنة يجتمع بنو وائل غداً لها رقصاً، فاشتعلت بقتله حرب البسوس بين بكر وتغلب أربعين سنة {cite:kamil-ibn-al-athir p. 391-392}."
  en: "Jasas ibn Murra of Banu Shayban: when his aunt al-Basus cried shame over her guest's wounded camel he knew honour pointed at his own breast, stalked Kulayb and speared him — 'a thrust for which Wa'il's sons will gather dancing tomorrow' — lighting the forty-year Basus war {cite:kamil-ibn-al-athir p. 391-392}."
