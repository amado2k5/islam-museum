summary:
  ar: هشام بن عبيد الله الرازي، فقيه الري وأحد أئمة السنة كما يصفه الذهبي، روى عن ابن أبي ذئب ومالك وحماد بن زيد وروى عنه أبو حاتم الرازي وغيره؛ وثقه أبو حاتم وليّنه ابن حبان، وتوفي سنة ٢٢١هـ.
  en: Hisham ibn Ubayd Allah al-Razi, a jurist of Rayy whom al-Dhahabi calls one of the imams of the sunna; he narrated from Ibn Abi Dhi'b, Malik and Hammad ibn Zayd, and Abu Hatim al-Razi narrated from him. Abu Hatim thought highly of him and Ibn Hibban found him weak; he died in 221 AH.
