summary:
  ar: "أحمد فارس بن يوسف الشدياق (١٨٠٤–١٨٨٧م)؛ عالم باللغة والأدب محقق. ولد في قرية الحدث من أعمال لبنان وأبواه مسيحيان مارونيان سمّياه فارساً، ورحل إلى مصر فتلقى الأدب عن علمائها ورحل إلى مالطة فأدار فيها أعمال المطبعة الأميركانية، وتنقل في أوروبا ثم سافر إلى تونس فاعتنق فيها الدين الإسلامي وتسمّى «أحمد فارس»، فدُعي إلى قسطنطينية فأقام فيها بضع سنين وأصدر جريدة «الجوائب» سنة ١٢٧٧هـ فعاشت ثلاثاً وعشرين سنة. توفي في قسطنطينية فنقل جثمانه إلى لبنان. من آثاره «كنز الرغائب في منتخبات الجوائب» في سبع مجلدات اختارها ابنه سليم من مقالات أبيه، و«الواسطة في أحوال مالطة»، و«كشف المخبا عن فنون أوروبا»، و«الجاسوس على القاموس»، و«اللفيف في كل معنى طريف»، و«الساق على الساق فيما هو الفارياق» {cite:al-aalam tarjama}."
  en: "Ahmad Faris al-Shidyaq (1804–1887 CE) — the Lebanese lexicographer and satirist who embraced Islam in Tunis and founded the Istanbul journal al-Jawa'ib (1277 AH, twenty-three years) {cite:al-aalam tarjama}."
