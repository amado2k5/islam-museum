summary:
  ar: "أحمد فارس بن يوسف الشدياق ⁦(١٨٠٤–١٨٨٧م)⁩؛ عالم باللغة والأدب محقق. ولد في قرية الحدث من أعمال لبنان وأبواه مسيحيان مارونيان سمّياه فارساً، ورحل إلى مصر فتلقى الأدب عن علمائها ورحل إلى مالطة فأدار فيها أعمال المطبعة الأميركانية، وتنقل في أوروبا ثم سافر إلى تونس فاعتنق فيها الدين الإسلامي وتسمّى «أحمد فارس»، فدُعي إلى قسطنطينية فأقام فيها بضع سنين وأصدر جريدة «الجوائب» سنة ١٢٧٧هـ فعاشت ثلاثاً وعشرين سنة. توفي في قسطنطينية فنقل جثمانه إلى لبنان. من آثاره «كنز الرغائب في منتخبات الجوائب» في سبع مجلدات اختارها ابنه سليم من مقالات أبيه، و«الواسطة في أحوال مالطة»، و«كشف المخبا عن فنون أوروبا»، و«الجاسوس على القاموس»، و«اللفيف في كل معنى طريف»، و«الساق على الساق فيما هو الفارياق» {cite:al-aalam tarjama}."
  en: "Ahmad Faris al-Shidyaq (1804–1887 CE) — the Lebanese lexicographer and satirist who embraced Islam in Tunis and founded the Istanbul journal al-Jawa'ib (1277 AH, twenty-three years) {cite:al-aalam tarjama}."
  fr: "Ahmad Faris al-Shidyaq (1804–1887 ap. J.-C.), lexicographe et satiriste libanais ayant embrassé l'islam à Tunis et fondé le journal stambouliote al-Jawa'ib en 1277 H, qui dura vingt-trois ans {cite:al-aalam tarjama}."
  es: "Ahmad Faris al-Shidyaq (1804–1887 d. C.) — el lexicógrafo y satírico libanés que abrazó el Islam en Túnez y fundó la revista de Estambul al-Jawa'ib (1277 AH, veintitrés años) {cite:al-aalam tarjama}."
  ur: "احمد فارس الشدیق ⁦(1804-1887 عیسوی)⁩ - لبنانی لغت نگار اور طنز نگار جس نے تیونس میں اسلام قبول کیا اور استنبول جرنل الجوائب کی بنیاد رکھی ⁦(1277ھ، تئیس سال)⁩"
  tr: "Ahmed Faris ibn Yusuf el-Şidyak (1804–1887 MS); dil ve edebiyat bilgini ve araştırmacı. Lübnan'ın el-Hadath köyünde Maronit Hristiyan bir ailenin çocuğu olarak dünyaya geldi ve ona Faris adını verdiler. Mısır'a giderek oradaki bilginlerden edebiyat eğitimi aldı, ardından Malta'ya giderek Amerikan Basınını yönetti. Avrupa'yı ve daha sonra Tunus'u gezdi, burada İslamiyet'i kabul etti ve Ahmed Faris adını aldı. İstanbul'a davet edildi, burada birkaç yıl ikamet etti ve 1277 Hicri (1868 MS) yılında yirmi üç yıl boyunca yayınlanan \"el-Jawa'ib\" gazetesini çıkardı. İstanbul'da vefat etti ve naaşı Lübnan'a nakledildi. Eserleri arasında, oğlu Salim'in babasının makalelerinden seçtiği yedi ciltlik \"Kanz al-Ragha'ib fi Muntakhabat al-Jawa'ib\" (el-Jawa'ib'den Seçmeler İçinde Arzu Hazinesi) bulunmaktadır. \"al-Wasita fi Ahwal Malta\" (Malta İşlerinde Arabulucu); \"Kashf al-Mukhba 'an Funun Uruba\" (Avrupa Sanatında Gizli Olanın Ortaya Çıkarılması); \"el-Jasus 'ala al-Qamus\" (Sözlükteki Casus); \"al-Lafif fi Kull Ma'na Tarif\" (Her Benzersiz Anlam Üzerine Koleksiyon); ve \"es-Saq 'ala al-Saq fima Huwa al-Fariq\" (Fark Nedir'de Bacak Üzerindeki Bacak)."
  id: "Ahmad Faris ibn Yusuf al-Shidyaq (1804–1887 M); seorang ahli bahasa dan sastra, serta peneliti. Ia lahir di desa al-Hadath di Lebanon dari orang tua Kristen Maronit yang memberinya nama Faris. Ia melakukan perjalanan ke Mesir, di mana ia belajar sastra di bawah bimbingan para ahlinya, dan kemudian ke Malta, di mana ia mengelola Pers Amerika. Ia melakukan perjalanan ke seluruh Eropa dan kemudian ke Tunisia, di mana ia masuk Islam dan mengambil nama Ahmad Faris. Ia diundang ke Konstantinopel, di mana ia tinggal selama beberapa tahun dan meluncurkan surat kabar \"al-Jawa'ib\" pada tahun 1277 H (1868 M), yang berlanjut selama dua puluh tiga tahun. Ia meninggal di Konstantinopel, dan jenazahnya dibawa ke Lebanon. Di antara karya-karyanya adalah \"Kanz al-Ragha'ib fi Muntakhabat al-Jawa'ib\" (Harta Karun Keinginan dalam Pilihan dari al-Jawa'ib), dalam tujuh jilid yang dipilih oleh putranya Salim dari artikel-artikel ayahnya; \"al-Wasita fi Ahwal Malta\" (Mediator Urusan Malta); \"Kashf al-Mukhba 'an Funun Uruba\" (Mengungkap Yang Tersembunyi dari Seni Eropa); \"al-Jasus 'ala al-Qamus\" (Mata-Mata Kamus); “al-Lafif fi Kull Ma'na Tarif” (Kumpulan Setiap Makna Unik); dan “al-Saq ‘ala al-Saq fima Huwa al-Fariq” (Kaki di Atas Kaki Apa Bedanya)."
