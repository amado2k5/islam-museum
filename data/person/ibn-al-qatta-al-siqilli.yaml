summary:
  ar: "أبو القاسم علي بن جعفر بن علي بن محمد بن عبد الله بن الحسين الشنتريني السعدي المعروف بابن القطاع؛ الصقلي المولد المصري الدار والوفاة؛ اللغوي؛ كان أحد أئمة الأدب خصوصاً اللغة؛ من تصانيفه كتاب «الأفعال» وهو أجود من «الأفعال» لابن القوطية وكتاب «أبنية الأسماء» وكتاب «الدرة الخطيرة في المختار من شعراء الجزيرة» وكتاب «لمح الملح» جمع فيه خلقاً من شعراء الأندلس وله عروض حسن جيد؛ رحل عن صقلية لما أشرف على ملكها الفرنج ووصل إلى مصر في حدود سنة خمسين وأربعمائة {cite:wafayat-ayan}."
  en: "Ibn al-Qatta' al-Siqilli (433–505) — Sicilian philologist who left when the Franks neared conquest and settled in Egypt; his Af'al surpasses Ibn al-Qutiyya's, plus Durrat Khatira on Jaziran poets and Lamh al-Mulah on Andalusians {cite:wafayat-ayan}."
