summary:
  ar: "أبو القاسم علي بن جعفر بن علي بن محمد بن عبد الله بن الحسين الشنتريني السعدي المعروف بابن القطاع؛ الصقلي المولد المصري الدار والوفاة؛ اللغوي؛ كان أحد أئمة الأدب خصوصاً اللغة؛ من تصانيفه كتاب «الأفعال» وهو أجود من «الأفعال» لابن القوطية وكتاب «أبنية الأسماء» وكتاب «الدرة الخطيرة في المختار من شعراء الجزيرة» وكتاب «لمح الملح» جمع فيه خلقاً من شعراء الأندلس وله عروض حسن جيد؛ رحل عن صقلية لما أشرف على ملكها الفرنج ووصل إلى مصر في حدود سنة خمسين وأربعمائة {cite:wafayat-ayan}."
  en: "Ibn al-Qatta' al-Siqilli (433–505) — Sicilian philologist who left when the Franks neared conquest and settled in Egypt; his Af'al surpasses Ibn al-Qutiyya's, plus Durrat Khatira on Jaziran poets and Lamh al-Mulah on Andalusians {cite:wafayat-ayan}."
  es: "Ibn al-Qatta' al-Siqilli (433–505): filólogo siciliano que se fue cuando los francos se acercaban a la conquista y se establecieron en Egipto; su Af'al supera al de Ibn al-Qutiyya, además de Durrat Khatira sobre los poetas jaziranos y Lamh al-Mulah sobre los andaluces {cita:wafayat-ayan}."
  fr: "Ibn al-Qatta' al-Siqilli (433-505) — philologue sicilien qui partit lorsque les Francs approchaient de la conquête et s'installa en Égypte; son Af'al surpasse celui d'Ibn al-Qutiyya, plus Durrat Khatira sur les poètes jazirans et Lamh al-Mulah sur les Andalous {cite: wafayat-ayan}."
  ur: "ابن القطاء السقلی (433-505) - سسلی کے ماہر فلکیات جو فرانکس کی فتح کے قریب پہنچ کر مصر میں آباد ہو گئے تھے۔ اس کا افضال ابن القطیہ کے علاوہ جزیران کے شاعروں پر دُرّت خاطرہ اور اندلس کے لامحلّہ سے آگے نکل گیا ہے۔"
  tr: "Ebu el-Kasım Ali ibn Ca'far ibn Ali ibn Muhammed ibn Abdullah ibn el-Hüseyin el-Şantarini el-Sa'di, İbn el-Kata' olarak bilinir; Sicilya doğumlu, Mısırlı doğmuş ve vefat etmiş; dilbilimci; özellikle dil olmak üzere edebiyatın önde gelen isimlerinden biriydi; eserleri arasında, İbn el-Kutuyya'nın 'El-Afa'al' adlı kitabı, 'İsimler Binaları' kitabı, 'El-Durra el-Hatira fi al-Mukhtar min Şu'ara' el-Cezira' ve 'Lamh al-Milh' adlı kitap, burada yetenekli Endülüs şairlerinden oluşan bir grup topladı. Frank yönetimini üstlendiğinde Sicilya'dan ayrıldı ve yaklaşık 450 H yılında Mısır'a geldi."
  id: "Abu al-Qasim Ali ibn Ja'far ibn Ali ibn Muhammad ibn Abdullah ibn al-Husayn al-Shantarini al-Sa'di, dikenal sebagai Ibn al-Qata'; seorang Mesir kelahiran Sisilia, lahir dan meninggal; seorang ahli bahasa; ia adalah salah satu tokoh terkemuka dalam sastra, terutama bahasa; di antara karyanya adalah buku 'Al-Afa'al', yang lebih baik daripada 'Al-Afa'al' karya Ibn al-Qutiyya, buku 'Buildings of Names', buku 'Al-Durra al-Khatira fi al-Mukhtar min Shu'ara' al-Jazira', dan buku 'Lamh al-Milh', di mana ia mengumpulkan sekelompok penyair Andalusia berbakat dengan proposisi yang sangat baik. Ia meninggalkan Sisilia ketika mengawasi pemerintahan Franka dan tiba di Mesir sekitar tahun 450 H."
