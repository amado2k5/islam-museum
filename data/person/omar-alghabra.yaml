summary:
  ar: "مهندس وسياسي ليبرالي كندي من أصل سوري وُلد في السعودية، مثّل دائرتي ميسيساغا—إرينديل وميسيساغا الوسطى في مجلس العموم الكندي من 2006 إلى 2008 ومن 2015 إلى 2025، وتولّى وزارة النقل الكندية من 2021 إلى 2023."
