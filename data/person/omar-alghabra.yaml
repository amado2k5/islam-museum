summary:
  ar: "مهندس وسياسي ليبرالي كندي من أصل سوري وُلد في السعودية، مثّل دائرتي ميسيساغا—إرينديل وميسيساغا الوسطى في مجلس العموم الكندي من 2006 إلى 2008 ومن 2015 إلى 2025، وتولّى وزارة النقل الكندية من 2021 إلى 2023."
  en: "Saudi-born Syrian-Canadian engineer and Liberal politician who represented the Mississauga ridings in Canada's House of Commons from 2006 to 2008 and from 2015 to 2025, and served as Canada's minister of transport from 2021 to 2023."
  ur: "سعودی عرب میں پیدا ہونے والے شامی نژاد کینیڈین انجینئر اور لبرل سیاست دان جنہوں نے 2006 سے 2008 اور 2015 سے 2025 تک کینیڈا کے ایوانِ زیریں میں مسی ساگا کے حلقوں کی نمائندگی کی اور 2021 سے 2023 تک کینیڈا کے وزیرِ ٹرانسپورٹ رہے۔"
  es: "Ingeniero sirio-canadiense nacido en Arabia Saudí y político liberal que representó a la circunscripción de Mississauga en la Cámara de los Comunes de Canadá de 2006 a 2008 y de 2015 a 2025, y que se desempeñó como ministro de transporte de Canadá de 2021 a 2023."
  fr: "Ingénieur et homme politique libéral syro-canadien né en Arabie saoudite, il a représenté la circonscription de Mississauga à la Chambre des communes du Canada de 2006 à 2008 et de 2015 à 2025, et a été ministre des Transports du Canada de 2021 à 2023."
  tr: "Suriye kökenli Kanadalı Liberal mühendis ve siyasetçi olan Suudistan, 2006-2008 ve 2015-2025 yılları arasında Kanada Avam Kamarası'nda Mississauga–Irendale ve Mississauga Central seçim bölgelerini temsil etti ve 2021-2023 yılları arasında Kanada Ulaştırma Bakanı olarak görev yaptı."
  id: "Seorang insinyur dan politisi Liberal Kanada keturunan Suriah, lahir di Arab Saudi, ia mewakili daerah pemilihan Mississauga–Irendale dan Mississauga Central di Dewan Perwakilan Kanada dari tahun 2006 hingga 2008 dan dari 2015 hingga 2025, serta menjabat sebagai Menteri Transportasi Kanada dari tahun 2021 hingga 2023."
