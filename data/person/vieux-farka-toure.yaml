summary:
  ar: "مغنٍّ وعازف غيتار وملحّن مالي، وُلد في نيافونكي سنة 1981، وهو ابن علي فاركا توري. تعلّم الغيتار سرًّا رغم تثبيط أبيه، وسار على خطاه في «بلوز الصحراء» بألبومات مثل «فوندو» (2009) و«بلدي» (2013) و«الجذور» (2022)، وسجّل مع خونغروبين ألبوم «علي» (2022) تحيةً لموسيقى أبيه."
  en: "Malian singer, guitarist and composer, born at Niafunké in 1981, the son of Ali Farka Touré. He took up the guitar in secret despite his father's discouragement and followed him into 'desert blues' with albums such as Fondo (2009), Mon Pays (2013) and Les Racines (2022), and recorded Ali (2022) with Khruangbin as a tribute to his father's music."
  ur: "مالی کے گلوکار، گٹار نواز و موسیقی ساز، جو 1981 میں نیافنکے میں پیدا ہوئے اور علی فارکا تورے کے بیٹے ہیں۔ والد کی حوصلہ شکنی کے باوجود چھپ کر گٹار سیکھا اور «فوندو» (2009)، «مون پے» (2013) اور «لے راسین» (2022) جیسے البموں سے والد کے «صحرا بلوز» کو آگے بڑھایا، اور خرنگبن کے ساتھ «علی» (2022) والد کی موسیقی کو خراجِ تحسین کے طور پر ریکارڈ کیا۔"
