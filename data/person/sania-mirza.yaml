summary:
  ar: "لاعبة تنس هندية محترفة سابقة، وُلدت في مومباي سنة 1986 ونشأت في حيدر آباد. مصنفة أولى عالميا سابقة في الزوجي بلغت القمة في أبريل 2015 وقضت 91 أسبوعا في الصدارة، وفازت بستة ألقاب كبرى — ثلاثة في زوجي السيدات (ويمبلدون وأمريكا المفتوحة 2015 وأستراليا المفتوحة 2016) وثلاثة في الزوجي المختلط — ولقب نهائيات رابطة المحترفات للزوجي في 2014 و2015، و43 لقبا في الزوجي إجمالا. وفي الفردي بلغت التصنيف 27 عالميا سنة 2007 وهو الأعلى للاعبة هندية، قبل أن تدفعها إصابة في المعصم إلى التخصص في الزوجي، واعتزلت التنس الاحترافي في فبراير 2023."
  en: "Indian former professional tennis player, born in Mumbai in 1986 and raised in Hyderabad. A former doubles world No. 1 who reached the top ranking in April 2015 and spent 91 weeks there, she won six major titles — three in women's doubles (Wimbledon and the US Open in 2015, the Australian Open in 2016) and three in mixed doubles — the WTA Finals doubles title in 2014 and 2015, and 43 doubles titles in all. In singles she reached world No. 27 in 2007, the highest ranking achieved by an Indian woman, before a wrist injury shifted her career to doubles. She retired from professional tennis in February 2023."
  ur: "بھارت کی سابق پیشہ ور ٹینس کھلاڑی، جو 1986 میں ممبئی میں پیدا ہوئیں اور حیدر آباد میں پلی بڑھیں۔ سابق ڈبلز عالمی نمبر ایک، جو اپریل 2015 میں سرفہرست ہوئیں اور 91 ہفتے اس مقام پر رہیں؛ انھوں نے چھ بڑے خطاب جیتے — تین خواتین ڈبلز اور تین مکسڈ ڈبلز میں — اور مجموعی طور پر 43 ڈبلز خطاب حاصل کیے۔ سنگلز میں وہ 2007 میں عالمی نمبر 27 تک پہنچیں، جو کسی بھارتی خاتون کا بلند ترین درجہ ہے، اور فروری 2023 میں پیشہ ور ٹینس سے ریٹائر ہوئیں۔"
