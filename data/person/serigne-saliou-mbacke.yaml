summary:
  ar: "عالم سنغالي (1915–2007)، آخر أبناء الشيخ أحمدو بمبا الباقين على قيد الحياة عند وفاته، والخليفة الخامس للمريدية من سنة 1990 حتى وفاته. أسس مئات المدارس الدينية (الدارا) التي يعمل طلابها في الحقول، وقاد مشروعًا زراعيًا واسعًا في خلقوم، وواصل أعمال تجديد الجامع الكبير في طوبى."
  en: "Senegalese scholar (1915-2007), the last surviving son of Sheikh Ahmadou Bamba and fifth caliph of the Mourides from 1990 until his death. He founded hundreds of religious schools (daaras) whose students work the fields, ran a vast agricultural project at Khelcom, and continued the renovation of the Great Mosque of Touba."
  ur: "سینیگال کے عالم (1915ء–2007ء)، شیخ احمد بمبا کے آخری زندہ بچ جانے والے فرزند اور مریدیہ کے پانچویں خلیفہ، 1990ء سے اپنی وفات تک۔ انہوں نے سینکڑوں دینی مدارس (دارا) قائم کیے جن کے طلبہ کھیتوں میں کام کرتے ہیں، خیلقوم میں ایک وسیع زرعی منصوبہ چلایا، اور طوبیٰ کی جامع مسجد کی تزئین و آرائش کا کام جاری رکھا۔"
