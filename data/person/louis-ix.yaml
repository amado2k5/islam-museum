id: person/louis-ix
class: person
label:
  ar: لويس التاسع ملك الفرنسيس
  en: Louis IX of France
summary:
  ar: "لويس ملك الفرنجة الملقب بلغتهم «روا فرنس» أي ملك إفرنس؛ حمله المسلمون أسيراً من المنصورة بمصر سنة 648هـ وأطلقوه على تمكينهم دمياط، ثم عاود الكرة آخر ذي القعدة سنة 668هـ بأساطيل ثلاثمائة وسبعة ملوك فيهم صاحب صقلية وصاحب الجزر، فنازل تونس وبها السلطان المستنصر الحفصي، فهلك في معسكره بقرطاجنة سنة 669هـ يقال حتف أنفه ويقال بسهم غرب أصابه في بعض المواقف."
  en: "Louis, king of the Franks, called in their tongue «roi de France»; the Muslims carried him captive from al-Mansura in Egypt in 648 AH and released him on Damietta's surrender, then he returned at the end of Dhu al-Qa'da 668 with three hundred sails and seven kings to besiege Tunis where the Hafsid al-Mustansir ruled, dying in his camp at Carthage in 669 AH — by plague as some said, or by a stray arrow."
