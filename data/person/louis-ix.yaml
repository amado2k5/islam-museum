summary:
  ar: "لويس ملك الفرنجة الملقب بلغتهم «روا فرنس» أي ملك إفرنس؛ حمله المسلمون أسيراً من المنصورة بمصر سنة 648هـ وأطلقوه على تمكينهم دمياط، ثم عاود الكرة آخر ذي القعدة سنة 668هـ بأساطيل ثلاثمائة وسبعة ملوك فيهم صاحب صقلية وصاحب الجزر، فنازل تونس وبها السلطان المستنصر الحفصي، فهلك في معسكره بقرطاجنة سنة 669هـ يقال حتف أنفه ويقال بسهم غرب أصابه في بعض المواقف."
  en: "Louis, king of the Franks, called in their tongue «roi de France»; the Muslims carried him captive from al-Mansura in Egypt in 648 AH and released him on Damietta's surrender, then he returned at the end of Dhu al-Qa'da 668 with three hundred sails and seven kings to besiege Tunis where the Hafsid al-Mustansir ruled, dying in his camp at Carthage in 669 AH — by plague as some said, or by a stray arrow."
  es: "Luis, rey de los francos, llamado en su idioma «rey de Francia»; los musulmanes lo llevaron cautivo desde al-Mansura en Egipto en el año 648 de la Hégira y lo liberaron tras la rendición de Damietta, luego regresó a finales de Dhu al-Qa'da del año 668 con trescientos barcos y siete reyes para sitiar Túnez, donde gobernaba el Hafsid al-Mustansir, muriendo en su campamento en Cartago en el año 669 de la Hégira, a causa de la peste, según algunos, o por una flecha perdida."
  fr: "Louis, roi des Francs, appelé dans leur langue «roi de France»; les musulmans le firent prisonnier d'al-Mansura en Égypte en 648 AH et le libérèrent lors de la reddition de Damiette, puis il revint à la fin de Dhu al-Qa'da 668 avec trois cents voiles et sept rois pour assiéger Tunis où régnait le Hafside al-Mustansir, mourant dans son camp à Carthage en 669 AH — de la peste comme certains disaient, ou d'une flèche perdue."
