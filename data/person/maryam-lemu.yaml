summary:
  ar: "متحدثة وميسّرة ندوات نيجيرية وُلدت سنة 1973 للشيخ أحمد ليمو وزوجته البريطانية بريدجت عائشة ليمو؛ تعمل رئيسة للإدارة وإدارة الموارد في كلية نيو هورايزنز بمينا ومديرة في شركة بروستارت للاستشارات، وتقدم البرنامج الحواري «سيسترلي» على قناة أليف وبرامج رمضانية على شبكات عدة، وتنتج سلاسل فيديو وحلقات صوتية في الهوية المسلمة والزواج وتطوير الذات."
  en: "Nigerian speaker and seminar facilitator, born in 1973 to Sheikh Ahmed Lemu and his British wife Bridget Aisha Lemu. She is Head of Administration and Resource Management at New Horizons College in Minna and a director of ProStart Consultants, hosts the talk show Sisterly on Alif TV and Ramadan shows on several networks, and produces video and podcast series on Muslim identity, marriage and personal development."
  ur: "نائجیرین مقررہ اور ورکشاپ سہولت کار، 1973 میں شیخ احمد لیمو اور ان کی برطانوی اہلیہ برجٹ عائشہ لیمو کے ہاں پیدا ہوئیں۔ وہ مِنا کے نیو ہورائزنز کالج میں انتظامیہ و وسائل کی سربراہ اور پرو اسٹارٹ کنسلٹنٹس کی ڈائریکٹر ہیں، الف ٹی وی پر ٹاک شو «سسٹرلی» اور کئی نیٹ ورکس پر رمضان پروگرام پیش کرتی ہیں، اور مسلم شناخت، شادی اور ذاتی ترقی پر ویڈیو و پوڈکاسٹ سلسلے بناتی ہیں۔"
