  fr: "Homme politique kazakh, né en 1953 à Almaty. Ancien diplomate ayant travaillé aux Nations Unies, il est devenu président du Kazakhstan en 2019, succédant à Nursultan Nazarbayev, puis a remporté les élections de 2019 et 2022."
