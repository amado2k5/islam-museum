  ar: "سياسي كازاخي، وُلد سنة 1953 في ألماتي. دبلوماسي سابق عمل في الأمم المتحدة، تولى رئاسة كازاخستان سنة 2019 خلفًا لنور سلطان نزارباييف، ثم فاز بانتخابات 2019 و2022."
