summary:
  en: "A determined Meccan convert who escaped to Medina following the Hudaybiyya Treaty; surrendered to Quraysh envoys in adherence to treaty terms, he overpowered his guard on the journey back and established a coastal guerrilla base at al-Is, intercepting Quraysh caravans until Quraysh begged the Prophet to accept them in Medina."
  ar: "صحابي ثقفي حليف لقريش أسلم بمكة وفر إلى المدينة بعد صلح الحديبية؛ ردّه النبي إلى قريش وفاءً بالصلح، ففتك بأحد حارسيه في طريق الرجوع وتمركز بسيف البحر عند العيص، وانضم إليه أبو جندل ومستضعفو مكة، فقطعوا قوافل قريش حتى ناشدت قريش النبي أن يؤويهم وألغت البند."
