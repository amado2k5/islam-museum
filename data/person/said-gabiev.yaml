summary:
  ar: "سعيد إبراهيموفيتش غابييف (1882–1963)، شاعر وكاتب لاكي ومنوّر وثوري، من مؤسسي الأدب اللاكي؛ وُلد في أوبوتشكا بغوبرنية بسكوف حيث نُفي أبوه بعد انتفاضة 1877، وحرّر في بطرسبورغ صحيفتي «فجر داغستان» و«الصحيفة المسلمة»، ثم صار من قادة ثورة داغستان: رئيسا بالنيابة لحكومتها الثورية ووزيرا للتعليم (1921–1922) ووزيرا للمالية (1923–1926)، ومات في تبليسي ودُفن في قوموخ كما أوصى."
  en: "Said Ibragimovich Gabiev (1882–1963) was a Lak poet, writer, enlightener and revolutionary, one of the founders of Lak literature. Born at Opochka in Pskov Governorate, where his father had been exiled after the 1877 uprising, he edited the newspapers Zarya Dagestana and Musulmanskaya Gazeta in St Petersburg, then became a leader of Soviet Dagestan: acting chairman of its revolutionary committee and its commissar of education (1921–1922) and of finance (1923–1926). He died at Tbilisi and was buried, as he had willed, at Kumukh."
  ur: "سعید ابراہیمووچ غابییف (1882–1963) لاک شاعر، ادیب، معلم اور انقلابی تھے، جو لاک ادب کے بانیوں میں سے ہیں۔ وہ پسکوف گوبرنیا کے اوپوچکا میں پیدا ہوئے، جہاں ان کے والد 1877 کی بغاوت کے بعد جلاوطن تھے؛ سینٹ پیٹرزبرگ میں انہوں نے «زریا داغستانا» اور «مسلمانسکایا گازیتا» اخبارات کی ادارت کی، پھر داغستان کے سوویت قائدین میں سے بنے: اس کی انقلابی کمیٹی کے قائم مقام چیئرمین اور تعلیم (1921–1922) و خزانہ (1923–1926) کے کمیشنر رہے۔ ان کا انتقال تبلیسی میں ہوا اور وصیت کے مطابق قوموخ میں دفن ہوئے۔"
