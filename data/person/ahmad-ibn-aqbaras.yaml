summary:
  ar: "الخوارزمي الصالحي؛ سمع من إسحاق الآمدي ومحمد بن المحب وزينب بنت الكمال؛ قال ابن حجر: أخذت عنه بالصالحية كثيراً وكان خيراً، مات في الفتنة {cite:shadharat-dhahab p. 32}."
  en: "Al-Khwarazmi al-Salihi; he heard from Ishaq al-Amidi, Muhammad ibn al-Muhibb and Zaynab bint al-Kamal. Ibn Hajar said: 'I took much from him at al-Salihiyya, and he was a good man'; he died in the fitna (the turmoil) {cite:shadharat-dhahab p. 32}."
  fr: "Al-Khwarazmi al-Salihi entendit Ishaq al-Amidi, Muhammad ibn al-Muhibb et Zaynab bint al-Kamal. Ibn Hajar dit : « J'ai beaucoup recueilli de lui à al-Salihiyya et c'était un homme de bien. » Il mourut dans la fitna, les troubles {cite:shadharat-dhahab p. 32}."
  es: "Al-Juarismi al-Salihi; escuchó de Ishaq al-Amidi, Muhammad ibn al-Muhibb y Zaynab bint al-Kamal. Ibn Hajar dijo: «Aprendí mucho de él en al-Salihiyya, y era un buen hombre»; murió en la fitna (la agitación) {cita: shadharat-dhahab p. 32}."
  ur: "الخوارزمی الصالحی; اس نے اسحاق العمیدی، محمد ابن المذہب اور زینب بنت کمال سے سنا۔ ابن حجر نے کہا: میں نے الصالحیہ میں ان سے بہت کچھ لیا، اور وہ اچھے آدمی تھے۔ اس کی موت فتنے میں ہوئی۔ 32}۔"
