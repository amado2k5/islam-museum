summary:
  ar: عجلي حليف بني سهم، هاجر إلى النبي ونزل الكوفة وابتنى بها داراً؛ قال ابن السكن إن له صحبة وذكره ابن سعد في طبقة أهل الخندق، وقال النبي «إن منكم رجالاً نكلهم إلى إيمانهم، منهم فرات بن حيان»؛ وتذكر المصادر أنه كان عيناً لأبي سفيان ثم أسلم،
    وأنه هجا النبي ثم مدحه.
  en: An Ijli ally of Banu Sahm who emigrated to the Prophet, settled in Kufa and built a house there; Ibn al-Sakan says he had companionship and Ibn Sa'd lists him in the tier of the people of the Trench; the Prophet said some men of you we
    leave to their iman, among them Furat ibn Hayyan; sources say he was a spy for Abu Sufyan then became Muslim, and that he lampooned the Prophet and later praised him.
