summary:
  ar: عجلي حليف بني سهم، هاجر إلى النبي ونزل الكوفة وابتنى بها داراً؛ قال ابن السكن إن له صحبة وذكره ابن سعد في طبقة أهل الخندق، وقال النبي «إن منكم رجالاً نكلهم إلى إيمانهم، منهم فرات بن حيان»؛ وتذكر المصادر أنه كان عيناً لأبي سفيان ثم أسلم،
    وأنه هجا النبي ثم مدحه.
  en: An Ijli ally of Banu Sahm who emigrated to the Prophet, settled in Kufa and built a house there; Ibn al-Sakan says he had companionship and Ibn Sa'd lists him in the tier of the people of the Trench; the Prophet said some men of you we
    leave to their iman, among them Furat ibn Hayyan; sources say he was a spy for Abu Sufyan then became Muslim, and that he lampooned the Prophet and later praised him.
  ur: "بنو سہم کا عجلی حلیف جو نبی کے پاس ہجرت کر کے آیا، کوفہ میں رہا اور وہاں گھر بنایا؛ ابن السکن کے مطابق اسے صحبت حاصل تھی۔"
  es: "Aliado de Banu Sahm, perteneciente a la comunidad Ijli, que emigró al encuentro del Profeta, se estableció en Kufa y construyó una casa allí; Ibn al-Sakan dice que tuvo compañía e Ibn Sa'd lo incluye en la categoría de la gente de la Trinchera; el Profeta dijo que a algunos de vosotros los dejamos a su fe, entre ellos Furat ibn Hayyan; las fuentes dicen que fue espía de Abu Sufyan y luego se convirtió al Islam, y que satirizó al Profeta y posteriormente lo elogió."
  fr: "Un allié Ijli des Banu Sahm qui émigrèrent auprès du Prophète, s'installèrent à Kufa et y construisirent une maison; Ibn al-Sakan dit qu'il avait des relations amicales avec lui et Ibn Sa'd le classe parmi les gens du Fossé; le Prophète dit: « Nous laissons certains d'entre vous à leur foi », parmi lesquels Furat ibn Hayyan; des sources disent qu'il était un espion pour Abu Sufyan puis se convertit à l'islam, et qu'il railla le Prophète avant de le louer."
  tr: "Banu Sahm'in müttefiki olan Ajli, Peygamber'e göç etti, Kufe'ye yerleşti ve orada bir ev inşa etti; İbn al-Sakan onun arkadaşı olduğunu söyledi ve İbn Sa'd onu hendek halkı arasında andı. Peygamber şöyle dedi: \"Aranızda inanmaya ikna edeceği adamlar var, aralarında Furat ibn Hayyan da var.\" Kaynaklar, onun Ebu Sufyan'ın yakın bir dostu olduğunu, sonra İslam'a geçtiğini, Peygamber'i hicvettiğini ve sonra onu övdüğünü belirtir."
  id: "Ajli, sekutu Banu Sahm, bermigrasi kepada Nabi, menetap di Kufa, dan membangun rumah di sana; Ibn al-Sakan mengatakan bahwa ia memiliki teman, dan Ibn Sa'd menyebutnya di antara orang-orang parit. Nabi bersabda, \"Di antara kalian ada orang-orang yang akan diyakini oleh-Nya, di antaranya Furat ibn Hayyan.\" Sumber menyebutkan bahwa ia adalah rekan dekat Abu Sufyan dan kemudian memeluk Islam, serta menyindir Nabi dan kemudian memujinya."
