summary:
  ar: "محمد بن خليفة بن حمد بن موسى النبهاني، الطائي نسباً، المكي مولداً ومنشأً، المالكي مذهباً، مؤرخ جزيرة البحرين في العصر الحديث وصاحب التحفة النبهانية في تاريخ الجزيرة العربية، من مدرسي الحرم المكي، توفي بالبصرة سنة 1369هـ الموافقة 1950م."
  en: "Muhammad ibn Khalifa ibn Hamad ibn Musa al-Nabhani, of the tribe of Tayy by descent, born and raised in Mecca, Maliki by school, the historian of the island of Bahrain in the modern period and author of al-Tuhfa al-Nabhaniyya fi tarikh al-jazira al-arabiyya, a teacher at the Meccan sanctuary; died at Basra in 1369 AH, 1950 CE."
  es: "Muhammad ibn Khalifa ibn Hamad ibn Musa al-Nabhani, de la tribu Tayy por ascendencia, nacido y criado en La Meca, de escuela Maliki, historiador de la isla de Baréin en la época moderna y autor de al-Tuhfa al-Nabhaniyya fi tarikh al-jazira al-arabiyya, maestro en el santuario de La Meca; murió en Basora en 1369 AH, 1950 d.C."
  fr: "Muhammad ibn Khalifa ibn Hamad ibn Musa al-Nabhani, de la tribu de Tayy par descendance, né et élevé à La Mecque, de l'école malikite, historien de l'île de Bahreïn à l'époque moderne et auteur d'al-Tuhfa al-Nabhaniyya fi tarikh al-jazira al-arabiyya, enseignant au sanctuaire mecquois; mort à Bassora en 1369 AH, 1950 CE."
  ur: "محمد بن خلیفہ بن حمد بن موسیٰ النبھانی، قبیلہ طائی سے تعلق رکھنے والے، مکہ میں پیدا ہوئے اور پرورش پائی، مکہ کے ذریعہ مالکی، دور جدید میں بحرین کے جزیرے کے مورخ اور الطحفہ النبھانیہ فی تاریخ الجزیرہ العربیہ کے استاد مکہ کے مصنف؛ 1369ھ بمطابق 1950ء میں بصرہ میں وفات پائی۔"
