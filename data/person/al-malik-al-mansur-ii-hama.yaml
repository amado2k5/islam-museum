summary:
  ar: "صاحب حماة من بيت أيوب؛ تملك بعد أبيه الملك المظفر سنة اثنتين وأربعين وستمائة وله عشر سنين رعايةً لأمه الصاحبة ابنة الكامل، فدام ملكه نحو أربعين سنة؛ وقال في «العبر»: وكان لعاباً مصراً على أمور، الله يسامحه {cite:shadharat-dhahab p. 655}."
  en: "Hama's last long Ayyubid — enthroned at ten in 642 under his mother's regency and ruling some forty years; al-'Ibar's terse verdict: 'an insistent gamester — may God pardon him' {cite:shadharat-dhahab p. 655}."
  es: "El último ayubí de Hama, entronizado a los diez años en 642 bajo la regencia de su madre y que gobernó durante unos cuarenta años; el lacónico veredicto de al-'Ibar: \"un jugador insistente, que Dios lo perdone\" {cita: shadharat-dhahab p. 655}."
  fr: "Le dernier long règne ayyoubide de Hama — intronisé à dix ans en 642 sous la régence de sa mère et régnant pendant une quarantaine d'années; le verdict laconique d'al-'Ibar: « un joueur insistant — que Dieu lui pardonne » {cite: shadharat-dhahab p. 655}."
  ur: "حما کا آخری طویل ایوبی - 642 میں دس سال کی عمر میں اپنی والدہ کے دور حکومت میں تخت نشین ہوا اور تقریباً چالیس سال حکومت کی۔ العبر کا مختصر فیصلہ: 'ایک ضدی گیمسٹر - خدا اسے معاف کرے' 655}۔"
