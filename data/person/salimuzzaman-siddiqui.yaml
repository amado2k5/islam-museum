summary:
  ar: "كيميائي باكستاني من أصل هندي ⁦(1897–1994)⁩، من روّاد كيمياء المنتجات الطبيعية. عزل قلويدات فعالة من نبات الراولفيا والنيم، وأسّس معهد بحوث العلوم والصناعة الباكستاني ⁦(PCSIR)⁩ ومعهد الدراسات العليا في الكيمياء بجامعة كراتشي المعروف بمعهد هج."
  en: "Pakistani chemist of Indian origin (1897–1994), a pioneer of natural-products chemistry. He isolated bioactive alkaloids from Rauwolfia and neem, founded Pakistan's Council of Scientific and Industrial Research (PCSIR) and the HEJ Research Institute of Chemistry at the University of Karachi."
  ur: "ہندوستانی نژاد پاکستانی کیمیا دان ⁦(1897–1994)⁩ جو قدرتی مصنوعات کی کیمیا کے بانیوں میں شمار ہوتے ہیں۔ انہوں نے راؤولفیا اور نیم سے فعال الکیلائیڈز الگ کیے، پاکستان کونسل آف سائنٹفک اینڈ انڈسٹریل ریسرچ ⁦(PCSIR)⁩ اور جامعہ کراچی کے ایچ ای جے ریسرچ انسٹیٹیوٹ آف کیمسٹری کی بنیاد رکھی۔"
  es: "Químico pakistaní de origen indio (1897-1994), pionero de la química de productos naturales. Aisló alcaloides bioactivos de la Rauwolfia y el neem, fundó el Consejo de Investigación Científica e Industrial de Pakistán (PCSIR) y el Instituto de Investigación Química HEJ en la Universidad de Karachi."
  fr: "Chimiste pakistanais d'origine indienne (1897-1994), pionnier de la chimie des produits naturels. Il a isolé des alcaloïdes bioactifs de Rauwolfia et du neem, fondé le Conseil pakistanais de la recherche scientifique et industrielle (PCSIR) et l'Institut de recherche en chimie HEJ de l'Université de Karachi."
  tr: "Hint kökenli Pakistanlı kimyager (1897–1994), doğal ürünler kimyasının öncüsüdür. Raulfia ve neem bitkilerinden aktif alkaloidleri izole etti ve Karachi Üniversitesi'nde Pakistan Bilim ve Sanayi Araştırma Enstitüsü'nü (PCSIR) ile Haj Enstitüsü olarak bilinen Kimya Lisansüstü Enstitüsü'nü kurdu."
  id: "Seorang kimiawan Pakistan keturunan India (1897–1994), pelopor kimia produk alami. Ia mengisolasi alkaloid aktif dari tanaman raulfia dan neem, serta mendirikan Pakistan Institute of Science and Industry Research (PCSIR) dan Graduate Institute of Chemistry di Universitas Karachi, yang dikenal sebagai Haj Institute."
