id: person/ibn-shas-al-judhami
class: person
label: { ar: "ابن شاس" }
summary:
  ar: "العلامة جمال الدين أبو محمد عبد الله بن نجم بن شاس بن نزار الجذامي السعدي المصري؛ شيخ المالكية وصاحب كتاب «الجواهر الثمينة في مذهب عالم المدينة»؛ كان من كبار الأئمة العاملين، حج في أواخر عمره ورجع فامتنع من الفتيا إلى أن مات مجاهداً في سبيل الله في حدود رجب سنة ست عشرة وستمائة {cite:shadharat-dhahab p. 69}."
  tr: "Alim Cemaleddin Ebu Muhammed Abdullah ibn Najm ibn Şas ibn Nizar el-Cumami el-Seydi el-Masri; Maliki şeyhi ve 'Al-Jawahir al-Thamina fi Madhhab 'Alam al-Medina' kitabının yazarı; önde gelen imamlardan biriydi. İlerleyen yıllarında Hac yaptı ve 600 Hicri yılında Recep günlerinde Allah yolunda mücadele ederken ölene kadar fetva vermekten kaçındı {atıf: şadharat-dhahab, s. 69}."
  id: "Ulama Jamal al-Din Abu Muhammad Abdullah ibn Najm ibn Shas ibn Nizar al-Judhami al-Sa'di al-Masri; sheikh Maliki dan penulis buku 'Al-Jawahir al-Thamina fi Madhhab 'Alam al-Madina'; ia adalah salah satu imam terkemuka terkemuka. Ia melaksanakan Haji di tahun-tahun terakhir dan kembali, menahan diri dari mengeluarkan fatwa hingga ia meninggal dalam perjuangan demi Allah pada masa Rajab tahun 600 H {cite:shadharat-dhahab, hlm. 69}."
