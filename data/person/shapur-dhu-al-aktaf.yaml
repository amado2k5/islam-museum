label: { ar: "سابور ذو الأكتاف" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك سابور ذي الأكتاف» {cite:tabari-tarikh-abu-al-fadl j.2 p.55}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره. وحصاره حصن الحضر على الضيزن ملك تنوخ شهراً لا يجد سبيلاً إلى فتحه حتى دلته النضيرة بنت الضيزن على إنثار التبن في نهر الثرثار واتباعه حيث يدخل ففتحه وقتل الضيزن وهدم الحصن، ثم لما اكتشف بورقة الآس بين عكنها رقة تربيتها وأنها غدت بأبيها وقومها أمر بها فربطت بغدائرها إلى فرسين جموحين فقطعاها {cite:muruj-al-dhahab p. 552-554}"
