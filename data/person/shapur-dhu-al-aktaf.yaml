id: person/shapur-dhu-al-aktaf
class: person
label: { ar: "سابور ذو الأكتاف" }
summary:
  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك سابور ذي الأكتاف» {cite:tabari-tarikh-abu-al-fadl j.2 p.55}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره. وحصاره حصن الحضر على الضيزن ملك تنوخ شهراً لا يجد سبيلاً إلى فتحه حتى دلته النضيرة بنت الضيزن على إنثار التبن في نهر الثرثار واتباعه حيث يدخل ففتحه وقتل الضيزن وهدم الحصن، ثم لما اكتشف بورقة الآس بين عكنها رقة تربيتها وأنها غدت بأبيها وقومها أمر بها فربطت بغدائرها إلى فرسين جموحين فقطعاها {cite:muruj-al-dhahab p. 552-554}"
  tr: "Sasani Persleri kralı, el-Tabari'nin \"Omuzlu Sabor Kralı'nın Anılması\" başlığıyla anılır {cite:tabari-tarikh-abu-al-fadl J.2 s.55}. Bu yer, onun saltanatının yılları ve haberleri hakkında söylenenleri anlatır. Tanukh kralı Al-Dhayzan'ın Hadar kalesini bir ay boyunca kuşatması, Al-Nadira bint Al-Dhayzen ona Tharthar Nehri'nde samanın saçılmasını gösterip onu ele geçirip Al-Dhayzan'ı öldürüp kaleyi yok edene kadar fethetmesinin yolunu buldu. Sonra, kalenin derisinde bir mersin parçası ile yetiştirilmesinin şefkatini ve onun babası ve halkı olduğunu fark ettiğinde, kaleyi iki vahşi ata bağlamasını emretti; onlar onu kesip kestiler {cite:Muruj-al-Dhahab s. 552-554}"
  id: "Seorang raja Persia Sasanian, disebut oleh al-Tabari dengan judul \"Sebutan Raja Sabor dengan Bahu\" {cite:tabari-tarikh-abu-al-fadl J.2 hlm.55}. Tempat ini menceritakan apa yang dikatakan tentang tahun-tahun dan berita pemerintahannya. Pengepungannya atas benteng Hadar di Al-Dhayzan, raja Tanukh, selama sebulan, tidak menemukan cara untuk menaklukkannya sampai Al-Nadira bint Al-Dhayzen menunjukkan kepadanya penyebaran jerami di Sungai Tharthar dan para pengikutnya saat masuk, merebutnya, membunuh Al-Dhayzan, dan menghancurkan benteng itu. Kemudian, ketika ia menemukan dengan sehelai lembar myrtle di kulitnya kelembutan didikan dan bahwa benteng itu telah menjadi ayah dan rakyatnya, ia memerintahkan agar ia diikat pada dua kuda liar yang memotongnya {cite:Muruj-al-Dhahab hlm. 552-554}"
