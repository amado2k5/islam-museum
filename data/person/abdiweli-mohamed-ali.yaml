summary:
  ar: "سياسي واقتصادي صومالي (ولد 1965) من دوسمريب، المعروف بغاس، أستاذ اقتصاد مشارك في جامعة نياغرا بنيويورك، صار رئيس وزراء الصومال (2011–2012) خلفا لمحمد عبد الله محمد ووضع «خارطة الطريق لإنهاء المرحلة الانتقالية»، ثم انتُخب رئيسا لبونتلاند (2014–2019)."
  en: "Somali politician and economist (born 1965) from Dhusamareb, known as Gaas, an associate professor of economics at Niagara University in New York, who became prime minister of Somalia (2011–2012) succeeding Mohamed Abdullahi Mohamed and authored the 'Roadmap for the End of Transition', and was then elected president of Puntland (2014–2019)."
  ur: "صومالی سیاست دان اور ماہرِ معاشیات (پیدائش 1965ء) جن کا تعلق دوسمارب سے ہے، گاس کے نام سے معروف؛ نیویارک کی نیاگرا یونیورسٹی میں معاشیات کے ایسوسی ایٹ پروفیسر؛ صومالیہ کے وزیر اعظم بنے (2011ء–2012ء) محمد عبد اللہ محمد کے جانشین کے طور پر اور «عبوری مرحلے کے اختتام کا روڈ میپ» مرتب کیا، پھر پونٹ لینڈ کے صدر منتخب ہوئے (2014ء–2019ء)۔"
