summary:
  ar: "سعيد بن عبد العزيز الحلبي، سكن دمشق، محبّ سري السقطي، أحد الأوتاد من علماء العباد. تخرّج عليه عدة من الأعلام، وكان ملازمًا للشرع متبعًا له. روى حديثًا عن أبان بن عثمان بن عفان في الإحسان إلى رجل من بني عبد المطلب."
  en: "Sa'id ibn Abd al-Aziz al-Halabi, who settled in Damascus, a lover of Sari al-Saqati, one of the pillars among the scholarly worshippers; several notable scholars studied with him; he kept to the Law and followed it. He transmits a report from Aban ibn Uthman ibn Affan about repaying a kindness done to a man of the Banu Abd al-Muttalib."
  ur: "سعید بن عبد العزیز حلبی دمشق میں مقیم ہوئے، سری سقطی کے محب، علمائے عباد میں سے ایک اوتاد۔ ان سے کئی نامور علماء نے تعلیم پائی؛ وہ شریعت سے وابستہ اور اس کے پیروکار تھے۔ انہوں نے ابان بن عثمان بن عفان کی روایت نقل کی کہ بنو عبد المطلب کے ایک شخص پر کیے گئے احسان کا بدلہ اللہ قیامت کے دن دے گا۔"
