id: person/abd-al-mumin-ibn-ali
class: person
label: { ar: "عبد المؤمن بن علي القمي", en: "Abd al-Mu'min ibn Ali al-Qumi" }
summary:
  ar: "عبد المؤمن بن علي من قبيلة كومية البربرية، لقي ابن تومرت في ملالة قرب بجاية وصار من أخص أتباعه، ثم خلفه في قيادة حركة الموحدين وأسس الدولة المؤمنية. حكم من 527هـ/1133م إلى 558هـ/1163م، وأسقط دولة المرابطين بفتح مراكش، وضم إفريقية والأندلس الموحدية إلى المغرب {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  en: "Abd al-Mu'min ibn Ali, of the Berber Kumiya tribe, met Ibn Tumart at Malala near Bougie, became one of his closest followers, and then succeeded him as leader of the Almohad movement, founding the Mu'minid dynasty. He ruled from 527/1133 to 558/1163, ended Almoravid power with the capture of Marrakesh, and added Ifriqiya and Almohad al-Andalus to Morocco {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  ur: "عبد المؤمن بن علی بربر قبیلہ کومیہ سے تھے؛ بجایہ کے قریب ملالہ میں ابن تومرت سے ملے، ان کے قریبی ساتھی بنے اور پھر موحدین کی تحریک کی قیادت میں ان کے جانشین ہو کر مومنی سلطنت کی بنیاد رکھی۔ انہوں نے 527ھ/1133ء سے 558ھ/1163ء تک حکومت کی، مراکش کی فتح سے مرابطی اقتدار ختم کیا، اور افریقیہ اور موحدی اندلس کو مراکش کے ساتھ ملایا {cite:tarikh-ibn-khaldun-ibar p. 1669}."
