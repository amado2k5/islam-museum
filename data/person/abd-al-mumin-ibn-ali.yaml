id: person/abd-al-mumin-ibn-ali
class: person
label: { ar: "عبد المؤمن بن علي القمي", en: "Abd al-Mu'min ibn Ali al-Qumi", fr: "Abd al-Mu'min ibn Ali al-Qumi", es: "Abd al-Mu'min ibn Ali al-Qumi", ur: "عبد المومن ابن علی القمی" }
summary:
  ar: "عبد المؤمن بن علي من قبيلة كومية البربرية، لقي ابن تومرت في ملالة قرب بجاية وصار من أخص أتباعه، ثم خلفه في قيادة حركة الموحدين وأسس الدولة المؤمنية. حكم من 527هـ/1133م إلى 558هـ/1163م، وأسقط دولة المرابطين بفتح مراكش، وضم إفريقية والأندلس الموحدية إلى المغرب {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  en: "Abd al-Mu'min ibn Ali, of the Berber Kumiya tribe, met Ibn Tumart at Malala near Bougie, became one of his closest followers, and then succeeded him as leader of the Almohad movement, founding the Mu'minid dynasty. He ruled from 527/1133 to 558/1163, ended Almoravid power with the capture of Marrakesh, and added Ifriqiya and Almohad al-Andalus to Morocco {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  fr: "Abd al-Mu'min ibn Ali, de la tribu berbère des Kumiya, rencontra Ibn Tumart à Malala près de Bougie, devint l'un de ses plus proches disciples, puis lui succéda à la tête du mouvement almohade, fondant la dynastie mu'minide. Il régna de 527/1133 à 558/1163, mit fin au pouvoir almoravide par la prise de Marrakech, et ajouta l'Ifriqiya et l'al-Andalus almohade au Maroc {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  ur: "عبد المؤمن بن علی بربر قبیلہ کومیہ سے تھے؛ بجایہ کے قریب ملالہ میں ابن تومرت سے ملے، ان کے قریبی ساتھی بنے اور پھر موحدین کی تحریک کی قیادت میں ان کے جانشین ہو کر مومنی سلطنت کی بنیاد رکھی۔ انہوں نے 527ھ/1133ء سے 558ھ/1163ء تک حکومت کی، مراکش کی فتح سے مرابطی اقتدار ختم کیا، اور افریقیہ اور موحدی اندلس کو مراکش کے ساتھ ملایا {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  es: "Abd al-Mu'min ibn Ali, de la tribu bereber Kumiya, conoció a Ibn Tumart en Malala, cerca de Bougie, se convirtió en uno de sus seguidores más cercanos y luego lo sucedió como líder del movimiento almohade, fundando la dinastía mu'minid. Gobernó desde 527/1133 hasta 558/1163, puso fin al poder almorávide con la conquista de Marrakech y añadió Ifriqiya y Al-Andalus al Marruecos {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  tr: "Kumiya kabilesinden Berberi Abdülmümin ibn Ali, Bejaia yakınlarındaki Melala'da İbn Tumart ile tanıştı ve onun en yakın takipçilerinden biri oldu. Daha sonra Almohad hareketinin liderliğini devraldı ve Almohad devletini kurdu. 527 Hicri/1133 Miladi ile 558 Hicri/1163 Miladi yılları arasında hüküm sürdü ve Marakeş'i fethederek, İfrikiye ve Almohad Endülüs'ü Fas'a ilhak ederek Almoravid devletini devirdi. {cite:tarikh-ibn-khaldun-ibar s. 1669}"
  id: "Abd al-Mu'min ibn Ali, dari suku Berber Kumiya, bertemu Ibn Tumart di Melala dekat Bejaia dan menjadi salah satu pengikut terdekatnya. Kemudian ia menggantikannya sebagai pemimpin gerakan Almohad dan mendirikan negara Almohad. Ia memerintah dari tahun 527 H/1133 M hingga 558 H/1163 M, dan menggulingkan negara Almoravid dengan menaklukkan Marrakesh, mencaplok Ifriqiya dan Andalusia Almohad ke Maroko {cite:tarikh-ibn-khaldun-ibar p. 1669}."
