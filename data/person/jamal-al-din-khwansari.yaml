summary:
  ar: "جمال الدين محمد بن حسين الخوانساري، المعروف بآقا جمال (توفي 1125هـ/1713م، وفي رواية 1122هـ)، فقيه ومحدّث وحكيم شيعي إمامي من علماء أصفهان في العهد الصفوي، وهو ابن العلامة آقا حسين الخوانساري وتلميذه. درّس في حوزه أصفهان حتى صارت له رئاسة التدريس فيها، وخلف تراثًا واسعًا من التأليفات والتعليقات والترجمات الفارسية، أشهرها كتاب «عقائد النساء» الساخر في نقد خرافات عصره."
  en: "Jamal al-Din Muhammad ibn Husayn al-Khwansari, known as Aqa Jamal (d. 1125 AH/1713 CE, by another account 1122 AH), was a Twelver Shi'i jurist, traditionist and philosopher of Safavid Isfahan, the son and pupil of the scholar Aqa Husayn al-Khwansari. He taught in the Isfahan seminary until the headship of its teaching was his, and left a large body of works, glosses and Persian translations, the most famous of them the satirical Aqa'id al-Nisa' (\"The Beliefs of Women\"), a critique of the superstitions of his age."
  ur: "جمال الدین محمد بن حسین خوانساری، معروف بہ آقا جمال (وفات 1125ھ/1713ء، ایک روایت میں 1122ھ)، صفوی اصفہان کے اثنا عشری شیعہ فقیہ، محدث اور حکیم تھے، علامہ آقا حسین خوانساری کے فرزند اور شاگرد۔ اصفہان کے حوزے میں تدریس کرتے ہوئے وہاں کی ریاستِ تدریس ان تک پہنچی، اور انہوں نے تصانیف، تعلیقات اور فارسی تراجم کا بڑا ذخیرہ چھوڑا، جن میں مشہور ترین ان کی طنزیہ کتاب «عقائد النساء» ہے جو اپنے عہد کی خرافات پر نقد ہے۔"

