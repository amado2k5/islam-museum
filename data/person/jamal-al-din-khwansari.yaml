summary:
  ar: "جمال الدين محمد بن حسين الخوانساري، المعروف بآقا جمال ⁦(توفي 1125هـ/1713م، وفي رواية 1122هـ)⁩، فقيه ومحدّث وحكيم شيعي إمامي من علماء أصفهان في العهد الصفوي، وهو ابن العلامة آقا حسين الخوانساري وتلميذه. درّس في حوزه أصفهان حتى صارت له رئاسة التدريس فيها، وخلف تراثًا واسعًا من التأليفات والتعليقات والترجمات الفارسية، أشهرها كتاب «عقائد النساء» الساخر في نقد خرافات عصره."
  en: "Jamal al-Din Muhammad ibn Husayn al-Khwansari, known as Aqa Jamal (d. 1125 AH/1713 CE, by another account 1122 AH), was a Twelver Shi'i jurist, traditionist and philosopher of Safavid Isfahan, the son and pupil of the scholar Aqa Husayn al-Khwansari. He taught in the Isfahan seminary until the headship of its teaching was his, and left a large body of works, glosses and Persian translations, the most famous of them the satirical Aqa'id al-Nisa' (\"The Beliefs of Women\"), a critique of the superstitions of his age."
  ur: "جمال الدین محمد بن حسین خوانساری، معروف بہ آقا جمال ⁦(وفات 1125ھ/1713ء، ایک روایت میں 1122ھ)⁩، صفوی اصفہان کے اثنا عشری شیعہ فقیہ، محدث اور حکیم تھے، علامہ آقا حسین خوانساری کے فرزند اور شاگرد۔ اصفہان کے حوزے میں تدریس کرتے ہوئے وہاں کی ریاستِ تدریس ان تک پہنچی، اور انہوں نے تصانیف، تعلیقات اور فارسی تراجم کا بڑا ذخیرہ چھوڑا، جن میں مشہور ترین ان کی طنزیہ کتاب «عقائد النساء» ہے جو اپنے عہد کی خرافات پر نقد ہے۔"
  es: "Jamal al-Din Muhammad ibn Husayn al-Khwansari, conocido como Aqa Jamal (fallecido en 1125 AH/1713 d. C., según otra versión en 1122 AH), fue un jurista, tradicionalista y filósofo chií duodecimano de Isfahán safávida, hijo y discípulo del erudito Aqa Husayn al-Khwansari. Enseñó en el seminario de Isfahán hasta que llegó a ser su director, y dejó un extenso legado de obras, glosas y traducciones al persa, la más famosa de ellas la satírica Aqa'id al-Nisa' (\"Las creencias de las mujeres\"), una crítica a las supersticiones de su época."
  fr: "Jamal al-Din Muhammad ibn Husayn al-Khwansari, connu sous le nom d'Aqa Jamal (mort en 1125 AH/1713 ap. J.-C., ou en 1122 AH selon une autre source), était un juriste, traditionaliste et philosophe chiite duodécimain d'Ispahan, sous l'Empire safavide. Fils et disciple du savant Aqa Husayn al-Khwansari, il enseigna au séminaire d'Ispahan jusqu'à en prendre la direction. Il laissa une œuvre considérable, comprenant des gloses et des traductions persanes, dont la plus célèbre est la satire « Aqa'id al-Nisa' » (« Les croyances des femmes »), une critique des superstitions de son époque."
  tr: "Cemaleddin Muhammed bin Hüseyin el-Hansari, Ağa Cemal olarak bilinir (ö. 1125 Hicri/1713 M.S., bir anlatımda 1122 H Hin), Safevi döneminde İsfahanlı bir hukukçu, hadis âlimi ve İmam Şii bilginiydi. Âle Hüseyin el-Hansari'nin oğluydu. İsfahan seminerinde eğitim gördü ve orada öğretim başkanı oldu; geride çok sayıda Farsça yazıt, yorum ve çeviri bıraktı; bunların en ünlüsü, döneminin batıl inançlarını eleştiren hicivli kitap 'Akiidat al-Nisa'dır."
  id: "Jamal al-Din Muhammad ibn Husayn al-Khansari, yang dikenal sebagai Agha Jamal (meninggal 1125 H/1713 M, dalam salah satu catatan 1122 H), adalah seorang ahli hukum, ulama hadis, dan resi Syiah Imami dari Isfahan pada masa Safawi. Ia adalah putra dari ulama Agha Husayn al-Khansari dan muridnya. Ia belajar di seminari Isfahan hingga menjadi kepala pengajaran di sana, meninggalkan warisan besar tulisan, komentar, dan terjemahan Persia, yang paling terkenal adalah buku satir 'Aqeedat al-Nisa' yang mengkritik takhayul pada zamannya."

