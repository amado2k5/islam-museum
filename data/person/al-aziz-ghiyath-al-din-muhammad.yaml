summary:
  ar: "الملك العزيز غياث الدين أبو المظفر محمد بن الملك الظاهر غازي بن صلاح الدين؛ صاحب حلب؛ قُدّم على أخيه الصالح وهو الأصغر لأن أمه صفية خاتون بنت الملك العادل بن أيوب فقدموه في الملك لأجل جده وأخواله أولاد العادل؛ توفي بقلعة حلب ودفن بها وترتب مكانه ولده الملك الناصر صلاح الدين يوسف {cite:wafayat-ayan}."
  en: "Al-Malik al-Aziz Ghiyath al-Din Muhammad (610–634) — Ayyubid sultan of Aleppo, son of al-Malik al-Zahir Ghazi; preferred over his elder brother because his mother was Safiyya Khatun, al-Malik al-Adil's daughter; Ibn Khallikan was in Aleppo when he died {cite:wafayat-ayan}."
  fr: "Al-Malik al-Aziz Ghiyath al-Din Muhammad (610–634 H) — sultan ayyoubide d’Alep, fils d’al-Malik al-Zahir Ghazi ; préféré à son frère aîné parce que sa mère était Safiyya Khatun, fille d’al-Malik al-Adil ; Ibn Khallikan était à Alep lors de sa mort {cite:wafayat-ayan}."
  ur: "حلب کے ایوبی سلطان اور الملک الظاہر غازی کے بیٹے تھے۔ ان کی والدہ صفیہ خاتون تھیں، اور ان کے عہد میں ابن قفطی نے مالی دیوان اور وزارت کی ذمہ داریاں سنبھالیں۔ {cite:wafayat-ayan}"
  es: "Al-Malik al-Aziz Ghiyath al-Din Muhammad (610–634): sultán ayubí de Alepo, hijo de al-Malik al-Zahir Ghazi; prefería a su hermano mayor porque su madre era Safiyya Khatun, la hija de al-Malik al-Adil; Ibn Khallikan estaba en Alepo cuando murió {cita:wafayat-ayan}."
  tr: "Halep hükümdarı Kral Aziz Gıyat Din Ebu Müzafer Muhammed bin Kral Zahir Gazi bin Selahaddin; annesi Kral Adil bin Eyyub'un oğlu Safiyya Hatun olduğu için küçük kardeşi Salih'e göre öncelik verildi; böylece dedesi ve Adil'in oğulları olan anne tarafından amcaları hatırına krallıkta ona öncelik tanındı; Halep Kalesi'nde öldü ve oraya gömüldü, yerine oğlu Kral Nasır Selahaddin Yusuf geçti."
  id: "Raja Al-Aziz Ghiyath Al-Din Abu Al-Muzaffar Muhammad bin Raja Al-Zahir Ghazi bin Salah Al-Din; penguasa Aleppo; ia diberi kedudukan lebih tinggi daripada adik laki-lakinya, Al-Salih, karena ibunya adalah Safiyya Khatun bint Raja Al-Adil bin Ayyub, sehingga mereka memberinya kedudukan lebih tinggi di kerajaan demi kakeknya dan paman-paman dari pihak ibunya, putra-putra Al-Adil; ia meninggal di Benteng Aleppo dan dimakamkan di sana, dan putranya, Raja Al-Nasir Salah Al-Din Yusuf, menggantikannya."
