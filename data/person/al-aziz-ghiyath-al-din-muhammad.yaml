  ar: "الملك العزيز غياث الدين أبو المظفر محمد بن الملك الظاهر غازي بن صلاح الدين؛ صاحب حلب؛ قُدّم على أخيه الصالح وهو الأصغر لأن أمه صفية خاتون بنت الملك العادل بن أيوب فقدموه في الملك لأجل جده وأخواله أولاد العادل؛ توفي بقلعة حلب ودفن بها وترتب مكانه ولده الملك الناصر صلاح الدين يوسف {cite:wafayat-ayan}."
  en: "Al-Malik al-Aziz Ghiyath al-Din Muhammad (610–634) — Ayyubid sultan of Aleppo, son of al-Malik al-Zahir Ghazi; preferred over his elder brother because his mother was Safiyya Khatun, al-Malik al-Adil's daughter; Ibn Khallikan was in Aleppo when he died {cite:wafayat-ayan}."
  ur: "حلب کے ایوبی سلطان اور الملک الظاہر غازی کے بیٹے تھے۔ ان کی والدہ صفیہ خاتون تھیں، اور ان کے عہد میں ابن قفطی نے مالی دیوان اور وزارت کی ذمہ داریاں سنبھالیں۔ {cite:wafayat-ayan}"
