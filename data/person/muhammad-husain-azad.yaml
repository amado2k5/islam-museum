summary:
  ar: "كاتب وشاعر باللغة الأردية (1830-1910) من دلهي، استقر في لاهور بعد مقتل والده الصحفي مولوي محمد باقر في أحداث 1857. درّس في كلية الحكومة والكلية الشرقية بلاهور وصار أمين أنجمن بنجاب، وقاد مع ألطاف حسين حالي حركة «الشعر الطبيعي» لإصلاح الشعر الأردي. أشهر آثاره «آب حيات» (1880)، تاريخ الشعر الأردي وشعرائه، ويُعدّ من خيرة كتّاب النثر الأردي."
  en: "Urdu writer and poet (1830–1910) of Delhi who settled in Lahore after his father, the journalist Moulvi Muhammad Baqir, was executed in the aftermath of the 1857 rebellion. He taught at Government College and Oriental College, Lahore, became secretary of the Anjuman-e-Punjab, and with Altaf Hussain Hali led the 'natural poetry' movement to reform Urdu verse. His best-known work is Aab-e-Hayat (1880), a history of Urdu poetry and its poets; he is counted among the finest prose writers in Urdu."
  ur: "اردو کے مصنف اور شاعر (1830ء–1910ء) جن کا تعلق دلی سے تھا اور جو اپنے والد، صحافی مولوی محمد باقر کی 1857ء کے بعد پھانسی کے بعد لاہور آ بسے۔ انھوں نے گورنمنٹ کالج اور اورینٹل کالج لاہور میں پڑھایا، انجمن پنجاب کے سیکرٹری بنے اور الطاف حسین حالی کے ساتھ اردو شاعری کی اصلاح کی «قدرتی شاعری» تحریک کی قیادت کی۔ ان کی مشہور ترین تصنیف «آب حیات» (1880ء) اردو شاعری اور شعرا کی تاریخ ہے۔"
