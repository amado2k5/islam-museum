summary:
  ar: "ممتاز محل، واسمها أرجمند بانو بيغم، ابنة آصف خان وزوجة الإمبراطور المغولي شاه جهان المفضلة، تزوجته سنة 1612م وأنجبت له أربعة عشر ولداً بقي منهم سبعة، وماتت في برهانبور بالدكن في يونيو 1631م إثر ولادة بنت. بنى لها زوجها ضريح تاج محل في آكره {cite:encyclopaedia-of-islam-2 vol. 7 p. 611} {cite:encyclopaedia-of-islam-2 vol. 1 p. 275}."
  en: "Mumtaz Mahal, born Arjumand Banu Begam, was the daughter of Asaf Khan and the favourite wife of the Mughal emperor Shah Jahan, whom she married in 1612. She bore him fourteen children, of whom seven grew up, and died at Burhanpur in the Deccan in June 1631 after giving birth to a daughter. Her husband built the Taj Mahal at Agra for her {cite:encyclopaedia-of-islam-2 vol. 7 p. 611} {cite:encyclopaedia-of-islam-2 vol. 1 p. 275}."
  ur: "ممتاز محل، جن کا اصل نام ارجمند بانو بیگم تھا، آصف خان کی بیٹی اور مغل بادشاہ شاہ جہاں کی چہیتی بیوی تھیں۔ ان کی شادی 1612ء میں ہوئی، چودہ بچے پیدا ہوئے جن میں سات بڑے ہوئے، اور وہ جون 1631ء میں دکن کے شہر برہان پور میں بیٹی کی ولادت کے بعد فوت ہوئیں۔ ان کے شوہر نے ان کے لیے آگرہ میں تاج محل بنوایا {cite:encyclopaedia-of-islam-2 vol. 7 p. 611} {cite:encyclopaedia-of-islam-2 vol. 1 p. 275}۔"
