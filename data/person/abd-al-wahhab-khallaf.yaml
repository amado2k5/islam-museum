  ar: "عبد الوهاب بن عبد الواحد خلاف، فقيه مصري من العلماء، أستاذ الشريعة الإسلامية بكلية الحقوق بجامعة القاهرة وعضو مجمع اللغة العربية، ولد بكفر الزيات سنة 1305 هـ الموافقة 1888 م وتوفي بالقاهرة سنة 1375 هـ الموافقة 1956 م."
