summary:
  ar: "مفتي عام صربيا ورئيس مشيخة الجالية الإسلامية فيها منذ 2014، وُلد سنة 1966 في توتين بالسانجاك. تخرّج في كلية العلوم الإسلامية بسراييفو، وأدار مدرسة غازي عيسى بك في نوفي بازار ثم عمادة كلية الدراسات الإسلامية ورياسة الجامعة الدولية، وله مؤلفات منها مونوغرافيا عن مدرسة غازي عيسى بك."
  en: "Grand Mufti of Serbia and president of the Meshihat of the Islamic Community in Serbia since 2014, born in 1966 in Tutin in the Sandzak. A graduate of the Faculty of Islamic Sciences in Sarajevo, he directed the Gazi Isa-beg Madrasa in Novi Pazar, then served as dean of the Faculty of Islamic Studies and rector of the International University; his monograph calls the Gazi Isa-beg madrasa the al-Azhar of Sandzak."
  ur: "سربیا کے مفتیِ اعظم اور 2014 سے سربیا کی اسلامی کمیونٹی کے مشیخت کے صدر، 1966 میں سنجاک کے شہر توتین میں پیدا ہوئے۔ سرائیوو کی فیکلٹی آف اسلامک سائنسز سے فارغ التحصیل ہوئے، نووی پازار کی مدرسہ غازی عیسیٰ بیگ کے منتظم رہے، پھر فیکلٹی آف اسلامک اسٹڈیز کے ڈین اور انٹرنیشنل یونیورسٹی کے ریکٹر؛ ان کی مونوگراف مدرسہ غازی عیسیٰ بیگ کو سنجاک کا الازہر کہتی ہے۔"
  es: "Gran Muftí de Serbia y presidente del Meshihat de la Comunidad Islámica en Serbia desde 2014, nació en 1966 en Tutin, en Sandzak. Graduado de la Facultad de Ciencias Islámicas de Sarajevo, dirigió la madrasa Gazi Isa-beg en Novi Pazar, y posteriormente fue decano de la Facultad de Estudios Islámicos y rector de la Universidad Internacional; en su monografía, denomina a la madrasa Gazi Isa-beg como el al-Azhar de Sandzak."
  fr: "Grand mufti de Serbie et président du Meshihat de la Communauté islamique de Serbie depuis 2014, né en 1966 à Tutin, dans le Sandjak. Diplômé de la Faculté des sciences islamiques de Sarajevo, il a dirigé la madrasa Gazi Isa-beg à Novi Pazar, puis a été doyen de la Faculté d'études islamiques et recteur de l'Université internationale; sa monographie qualifie la madrasa Gazi Isa-beg d'« al-Azhar du Sandjak »."
