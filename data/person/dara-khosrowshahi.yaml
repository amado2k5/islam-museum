summary:
  ar: "دارا خسروشاهي (وُلد 28 مايو 1969 في طهران) مدير تنفيذي أمريكي من أصل إيراني، فرّت عائلته من إيران سنة 1978، فنشأ في الولايات المتحدة ودرس الهندسة الكهربائية في جامعة براون. تولّى إدارة إكسبيديا من 2005 إلى 2017، ثم أصبح الرئيس التنفيذي لأوبر في أغسطس 2017 خلفًا لترافيس كالانيك."
  en: "Dara Khosrowshahi (born 28 May 1969 in Tehran) is an Iranian-American business executive whose family fled Iran in 1978; raised in the United States and trained in electrical engineering at Brown University, he led Expedia as CEO from 2005 to 2017 and became CEO of Uber in August 2017, succeeding Travis Kalanick."
