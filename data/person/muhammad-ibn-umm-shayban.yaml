id: person/muhammad-ibn-umm-shayban
class: person
label: { ar: "محمد بن أم شيبان الهاشمي القاضي" }
summary:
  ar: "أبو الحسن محمد بن أم شيبان الهاشمي، قلده المطيع القضاء سنة ثلاث وستين بعد تمنع وشرط لنفسه شروطاً منها ألا يرتزق على القضاء ولا يخلع عليه ولا يشفع إليه فيما يخالف الشرع وكتب له عهد طويل بتعيين قاضي القضاة على جميع الأقاليم التي تنتهي إليها الدعوة {cite:tarikh-khulafa-minhaj-1434 p. 622-623}."
  en: "Abu'l-Hasan the Hashimite; al-Muti' invested him with the judgeship in 363 after refusals, on his own conditions — no stipend on the qada, no investiture robe, no intercession against the shari'a — with a long deed appointing him qadi al-qudat over every province the da'wa reached {cite:tarikh-khulafa-minhaj-1434 p. 622-623}."
  es: "Abu'l-Hasan el Hachemita; al-Muti' lo invistió con el cargo de juez en 363 después de varias negativas, bajo sus propias condiciones: sin estipendio sobre el qada, sin túnica de investidura, sin intercesión contra la sharia, con un largo documento que lo designaba qadi al-qudat sobre cada provincia a la que llegaba la da'wa {cite:tarikh-khulafa-minhaj-1434 p. 622-623}."
  fr: "Abu'l-Hasan le Hachémite; al-Muti' l'investit de la charge de juge en 363 après des refus, selon ses propres conditions — pas de salaire sur le qada, pas de robe d'investiture, pas d'intercession contre la charia — avec un long acte le nommant qadi al-qudat sur chaque province atteinte par la da'wa {cite:tarikh-khulafa-minhaj-1434 p. 622-623}."
  ur: "ابوالحسن ہاشمی؛ الموطی نے انکار کے بعد 363 میں اسے اپنی شرائط پر قاضی مقرر کیا - قضا پر کوئی وظیفہ نہیں، کوئی وظیفہ نہیں، شریعت کے خلاف کوئی شفاعت نہیں - ایک طویل عمل کے ساتھ اسے ہر صوبے کا قاضی القضاۃ مقرر کیا گیا جس سے دعویٰ پہنچ گیا۔ 622-623}۔"
  tr: "Ebu el-Hasan Muhammed bin Şeyban el-Haşimi, Ebu el-Hasan Muhammed bin Şeyban el-Haşimi, onun vazgeçilmesinden sonra altmış üçüncü yılda Muti' yargıcı olarak atadı ve kendisi için şartlar koydu; bunlar arasında yargıdan geçimini aramaması, şeriata aykırı konularda tahttan çekilmemesi veya onun adına aracılık edilmemesi de vardı. Ayrıca, çağrının sona erdiği tüm bölgelerde Baş Yargıçlar atamak için uzun bir yemin yazdı {cite:History-khulafa-minhaj-1434, s. 622-623}."
  id: "Abu al-Hasan Muhammad ibn um Shayban al-Hashimi, mengangkatnya sebagai hakim Muti' pada tahun enam puluh tiga setelah ia menahan diri, dan menetapkan syarat untuk dirinya sendiri, termasuk agar ia tidak mencari nafkah dari peradilan, maupun turun tahta atau menjadi perantara dalam perkara yang bertentangan dengan Syariah. Ia juga menulis sumpah panjang untuknya dengan mengangkat Ketua Hakim atas semua wilayah di mana panggilan berakhir {cite:History-khulafa-minhaj-1434, hlm. 622-623}."
