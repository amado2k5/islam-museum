summary:
  ar: "أبو الحسن محمد بن أم شيبان الهاشمي، قلده المطيع القضاء سنة ثلاث وستين بعد تمنع وشرط لنفسه شروطاً منها ألا يرتزق على القضاء ولا يخلع عليه ولا يشفع إليه فيما يخالف الشرع وكتب له عهد طويل بتعيين قاضي القضاة على جميع الأقاليم التي تنتهي إليها الدعوة {cite:tarikh-khulafa-minhaj-1434 p. 622-623}."
  en: "Abu'l-Hasan the Hashimite; al-Muti' invested him with the judgeship in 363 after refusals, on his own conditions — no stipend on the qada, no investiture robe, no intercession against the shari'a — with a long deed appointing him qadi al-qudat over every province the da'wa reached {cite:tarikh-khulafa-minhaj-1434 p. 622-623}."
