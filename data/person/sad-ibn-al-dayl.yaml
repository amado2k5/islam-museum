summary:
  ar: "سعد الدين سعد بن علي بن الديل الأنصاري الحلبي ثم الدمشقي الحنفي؛ قال ابن طولون: هو مدرس الماردانية بالجسر الأبيض بسفح قاسيون، اشتغل وحصل وبرع وتفقد وولي القضاء بحلب نيابة، ثم قدم دمشق ونزل بالخانقاه السميساطية، ونظم الشعر بالعربي والتركي والفارسي، ونظم قصيدة في قاضي دمشق السيد عربية ملمعة باللسانين وشكره عليها؛ توفي يوم السبت سلخ صفر سنة ثلاث وخمسين وتسعمائة ووجد مرمياً على باب الخانقاه المذكورة تحت روشن خلوته بها وإبهاماه مربوطان وهو مختنوق ولم يُعلم له غريم، ودُفن بتربة باب الفراديس ولعله في عشر السبعين {cite:shadharat-dhahab p. 712}."
  en: "The trilingual poet-jurist of the Mardaniyya — Aleppo deputy qadi who settled at Damascus's Sumaysatiyya khanqah composing in Arabic, Turkish and Persian; found cast dead on the khanqah doorstep beneath his cell window, thumbs bound, strangled, no killer known — end of Safar 953, in his seventies {cite:shadharat-dhahab p. 712}."
  es: "El poeta-jurista trilingüe de la Mardaniyya —cadí adjunto de Alepo que se estableció en la khanqah Sumaysatiyya de Damasco componiendo en árabe, turco y persa; encontrado muerto en el umbral de la khanqah debajo de la ventana de su celda, con los pulgares atados, estrangulado, sin asesino conocido— a finales de Safar 953, en sus setenta {cite:shadharat-dhahab p. 712}."
  fr: "Le poète-juriste trilingue de la Mardaniyya — cadi adjoint d'Alep qui s'était installé à la khanqah Sumaysatiyya de Damas, composant en arabe, en turc et en persan; retrouvé mort sur le seuil de la khanqah, sous la fenêtre de sa cellule, les pouces liés, étranglé, aucun meurtrier connu — fin du Safar 953, dans sa soixante-dixième année {cite: shadharat-dhahab p. 712}."
  ur: "مردانیہ کے سہ زبانی شاعر فقیہ — حلب کے نائب قادی جو دمشق کے سمیصطیہ خانقاہ میں مقیم تھے جو عربی، ترکی اور فارسی میں لکھتے تھے۔ خانقاہ کی دہلیز پر اپنے سیل کی کھڑکی کے نیچے مردہ پائے گئے، انگوٹھے بندھے ہوئے، گلا گھونٹ دیا گیا، کوئی قاتل معلوم نہیں - صفر 953 کے آخر میں، ستر کی دہائی میں۔ 712}۔"
