summary:
  ar: "سعد الدين سعد بن علي بن الديل الأنصاري الحلبي ثم الدمشقي الحنفي؛ قال ابن طولون: هو مدرس الماردانية بالجسر الأبيض بسفح قاسيون، اشتغل وحصل وبرع وتفقد وولي القضاء بحلب نيابة، ثم قدم دمشق ونزل بالخانقاه السميساطية، ونظم الشعر بالعربي والتركي والفارسي، ونظم قصيدة في قاضي دمشق السيد عربية ملمعة باللسانين وشكره عليها؛ توفي يوم السبت سلخ صفر سنة ثلاث وخمسين وتسعمائة ووجد مرمياً على باب الخانقاه المذكورة تحت روشن خلوته بها وإبهاماه مربوطان وهو مختنوق ولم يُعلم له غريم، ودُفن بتربة باب الفراديس ولعله في عشر السبعين {cite:shadharat-dhahab p. 712}."
  en: "The trilingual poet-jurist of the Mardaniyya — Aleppo deputy qadi who settled at Damascus's Sumaysatiyya khanqah composing in Arabic, Turkish and Persian; found cast dead on the khanqah doorstep beneath his cell window, thumbs bound, strangled, no killer known — end of Safar 953, in his seventies {cite:shadharat-dhahab p. 712}."
