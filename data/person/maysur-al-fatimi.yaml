label: { ar: "ميسور" }
summary:
  ar: "قائد فاطمي كتامي؛ سار في عساكر عظيمة لنجدة القيروان من أبي يزيد سنة 333هـ فانهزمت ميسرته ثم حمل عليه أبو يزيد فانهزم أصحابه وعطف ميسور فرسه فكبا به فسقط عنه وقاتل دونه بنو كلملان فقُتل ميسور وحُمل رأسه إلى أبي يزيد وطيف به بالقيروان {cite:kamil-ibn-al-athir p. 317}.، وعند ابن خلدون وكان خادم القائم الذي بعثه لحرب أبي يزيد فكان معه أبو كملان وكاتبوا أبا يزيد وداخلوه في الغدر بميسور فحذرهم القائم فطردهم عنه فلحقوا بأبي يزيد {cite:tarikh-ibn-khaldun-ibar p. 926}"
  en: "The Fatimid Kutama commander; marching to relieve Qayrawan in 333 his horse fell under him and Abu Yazid's men killed him — his head paraded through the city {cite:kamil-ibn-al-athir p. 317}."
