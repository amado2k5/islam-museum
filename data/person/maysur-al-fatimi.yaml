id: person/maysur-al-fatimi
class: person
label: { ar: "ميسور" }
summary:
  ar: "قائد فاطمي كتامي؛ سار في عساكر عظيمة لنجدة القيروان من أبي يزيد سنة 333هـ فانهزمت ميسرته ثم حمل عليه أبو يزيد فانهزم أصحابه وعطف ميسور فرسه فكبا به فسقط عنه وقاتل دونه بنو كلملان فقُتل ميسور وحُمل رأسه إلى أبي يزيد وطيف به بالقيروان {cite:kamil-ibn-al-athir p. 317}. وعند ابن خلدون وكان خادم القائم الذي بعثه لحرب أبي يزيد فكان معه أبو كملان وكاتبوا أبا يزيد وداخلوه في الغدر بميسور فحذرهم القائم فطردهم عنه فلحقوا بأبي يزيد {cite:tarikh-ibn-khaldun-ibar p. 926}"
  en: "The Fatimid Kutama commander; marching to relieve Qayrawan in 333 his horse fell under him and Abu Yazid's men killed him — his head paraded through the city {cite:kamil-ibn-al-athir p. 317}."
  es: "El comandante fatimí de Kutama; marchando para socorrer a Qayrawan en 333, su caballo cayó y los hombres de Abu Yazid lo mataron; su cabeza fue exhibida por la ciudad {cite:kamil-ibn-al-athir p. 317}."
  fr: "Le commandant fatimide Kutama; marchant pour secourir Qayrawan en 333, son cheval tomba sous lui et les hommes d'Abu Yazid le tuèrent — sa tête fut promenée dans la ville {cite:kamil-ibn-al-athir p. 317}."
  ur: "فاطمی کوتامہ کمانڈر؛ 333 میں قیروان کو فارغ کرنے کے لیے چلتے ہوئے اس کا گھوڑا اس کے نیچے آ گیا اور ابو یزید کے آدمیوں نے اسے قتل کر دیا - اس کا سر شہر میں گردش کر رہا تھا۔ 317}۔"
  tr: "Katami'nin Fatimî komutanı; 333 Hicri yılında Ebu Yezid'den Kairuvan'ı savunmak için büyük ordularla yürüdü. Sol kanadı yenildi, ardından Ebu Yazid ona saldırdı, ancak yoldaşları yenildi. Maysur atını çevirdi ve atından düştü, Banu Kalmalan da onunla birlikte savaştı. Maysur öldürüldü, ardından başı Ebu Yezid'e götürüldü ve Kairuan'da sergilendi {cite:kamil-ibn-al-athir s. 317}. İbn Haldun ile birlikte, onu Ebu Yezid'e savaşmaya gönderen Kaim'in hizmetkarıydı ve Ebu Kamalan da onunla birlikteydi. Ebu Yezid'e yazdılar ve onu Maysur'da ihanete dahil ettiler, ancak Qa'im onları uyardı ve onu kovdu, böylece Ebu Yezid'e katıldılar {cite:Tarikh-ibn-khaldun-ibar s. 926}"
  id: "Komandan Fatimiyah dari Katami; ia berbaris dengan pasukan besar untuk mempertahankan Kairouan dari Abu Yazid pada tahun 333 H. Sayap kirinya dikalahkan, lalu Abu Yazid menyerangnya, tetapi rekan-rekannya dikalahkan. Maysur memutar kudanya dan jatuh dari kudanya, dan Banu Kalmalan bertempur bersamanya. Maysur tewas, lalu kepalanya dibawa ke Abu Yazid dan diarak di Kairouan {cite:kamil-ibn-al-athir hlm. 317}. Bersama Ibn Khaldun, ia adalah pelayan Qa'im yang mengirimnya melawan Abu Yazid, dan Abu Kamalan bersamanya. Mereka menulis surat kepada Abu Yazid dan melibatkannya dalam pengkhianatan di Maysur, tetapi Qa'im memperingatkan mereka dan mengusirnya, sehingga mereka bergabung dengan Abu Yazid {cite:Tarikh-ibn-khaldun-ibar hlm. 926}"
