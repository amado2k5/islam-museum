summary:
  ar: "شمس الدين محمد الدلجي العثماني الشافعي؛ ولد سنة ستين وثمانمائة بدلجة وحفظ القرآن بها ثم دخل القاهرة فقرأ التنبيه وغيره على علمائها، ثم رحل إلى دمشق وأقام بها نحو ثلاثين سنة وأخذ عن البرهان البقاعي والحافظ برهان الدين الناجي والقطب الخيضري والقاضي ناصر الدين بن زريق الحتيلي والإمام المحدث شمس الدين السخاوي، وسافر إلى بلاد الروم واجتمع بسلطانها أبي يزيد وحج من بلاد الشام ثم عاد إلى القاهرة؛ وكتب شرحاً على الخزرجية وشرحاً على الأربعين النواوية وشرحاً على الشفا للقاضي عياض وشرحاً على المنفرجة، واختصر المنهاج والمقاصد وسماه مقاصد المقاصد وشرحه، وأخذ عنه جماعة منهم النجم الغيطي؛ توفي بالقاهرة {cite:shadharat-dhahab p. 686}."
  en: "The Shafi'i of Dalja — b. 860; after Cairo he lived thirty years in Damascus studying under al-Biqa'i, Burhan al-Din al-Naji and al-Sakhawi, met Sultan Bayezid in Rum, then returned to Cairo; works: sharhs of the Khazrajiyya, the Arba'in, the Shifa' and the Munfarija, plus Maqasid al-Maqasid with his own sharh; al-Ghayti heard much from him {cite:shadharat-dhahab p. 686}."
