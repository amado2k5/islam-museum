summary:
  ar: "صحفي وأستاذ أمريكي مسلم ⁦(1935 – 27 مارس 2025)⁩؛ وُلد مارك شلايفر في لونغ آيلند لأسرة يهودية علمانية وتخرّج في العلوم السياسية بجامعة بنسلفانيا سنة 1956، وعمل في صحافة الشرق الأوسط منذ 1965 فكان مدير مكتب NBC بالقاهرة ⁦(1974–1983)⁩، واعتنق الإسلام على نهج صوفي، وأسّس مركز أدهم للتدريب والبحوث الصحفية بالجامعة الأمريكية بالقاهرة وأدره ⁦(1985–2005)⁩، وكان رئيس تحرير كتاب المسلمون الخمسمئة، وتوفي في القاهرة."
  en: "American Muslim journalist and professor ⁦(1935 – 27 March 2025)⁩. Born Marc Schleifer in Long Island to a secular Jewish family and a 1956 political-science graduate of the University of Pennsylvania, he worked in Middle East journalism from 1965 as NBC's Cairo bureau chief ⁦(1974–1983)⁩, converted to Islam with a Sufi orientation, founded and first directed the Adham Center for Journalism Training and Research at the American University in Cairo ⁦(1985–2005)⁩, and served as chief editor of The Muslim 500; he died in Cairo."
  fr: "Journaliste et professeur musulman américain ⁦(1935 – 27 mars 2025)⁩. Né Marc Schleifer à Long Island dans une famille juive laïque et diplômé en sciences politiques de l'université de Pennsylvanie en 1956, il travailla dans le journalisme au Moyen-Orient à partir de 1965, comme chef du bureau de NBC au Caire ⁦(1974–1983)⁩, embrassa l'islam dans une orientation soufie, fonda et dirigea le premier l'Adham Center for Journalism Training and Research de l'Université américaine du Caire ⁦(1985–2005)⁩, et fut rédacteur en chef de The Muslim 500 ; il mourut au Caire."
  ur: "امریکی مسلم صحافی اور استاد ⁦(1935 – 27 مارچ 2025)⁩۔ لانگ آئیلینڈ میں ایک سیکولر یہودی گھرانے میں مارک شلائفر کے نام سے پیدا ہوئے اور 1956 میں یونیورسٹی آف پنسلوینیا سے سیاسیات کی ڈگری لی؛ 1965 سے مشرقِ وسطیٰ کی صحافت میں رہے اور NBC کے قاہرہ بیورو چیف ⁦(1974–1983)⁩ رہے، صوفیانہ رجحان کے ساتھ اسلام قبول کیا، امریکن یونیورسٹی قاہرہ میں ادهم سینٹر برائے صحافتی تربیت و تحقیق کے بانی و پہلے ڈائریکٹر ⁦(1985–2005)⁩ رہے اور کتاب مسلم 500 کے چیف ایڈیٹر رہے؛ قاہرہ میں انتقال ہوا۔"
  es: "Periodista y profesor musulmán estadounidense (1935 – 27 de marzo de 2025). Nacido como Marc Schleifer en Long Island en el seno de una familia judía laica y graduado en ciencias políticas por la Universidad de Pensilvania en 1956, trabajó en el periodismo de Oriente Medio desde 1965 como jefe de la corresponsalía de NBC en El Cairo (1974–1983), se convirtió al islam con una orientación sufí, fundó y dirigió inicialmente el Centro Adham para la Formación e Investigación Periodística en la Universidad Americana de El Cairo (1985–2005), y fue redactor jefe de The Muslim 500; falleció en El Cairo."
  tr: "Marc Schleifer, Amerikalı Müslüman bir gazeteci ve profesördü (1935 – 27 Mart 2025). Long Island'da laik bir Yahudi ailesinde doğdu ve 1956'da Pennsylvania Üniversitesi'nden siyaset bilimi diploması aldı. 1965'ten itibaren Orta Doğu gazeteciliğinde çalıştı ve 1974-1983 yılları arasında Kahire'deki NBC büro şefi olarak görev yaptı. Sufi usulüyle İslam'ı kabul etti, Kahire'deki Amerikan Üniversitesi'nde Adham Gazetecilik Eğitim ve Araştırma Merkezi'ni kurdu ve yönetti (1985-2005) ve \"500 Müslüman\" kitabının baş editörlüğünü yaptı. Kahire'de vefat etti."
  id: "Marc Schleifer adalah seorang jurnalis dan profesor Muslim Amerika (1935 – 27 Maret 2025). Ia lahir di Long Island dari keluarga Yahudi sekuler dan lulus dengan gelar ilmu politik dari Universitas Pennsylvania pada tahun 1956. Ia bekerja di bidang jurnalisme Timur Tengah sejak tahun 1965, menjabat sebagai kepala biro NBC di Kairo (1974–1983). Ia memeluk Islam secara Sufi, mendirikan dan mengelola Pusat Pelatihan dan Penelitian Jurnalisme Adham di Universitas Amerika di Kairo (1985–2005), dan menjadi pemimpin redaksi buku \"The 500 Muslims\". Ia meninggal di Kairo."
