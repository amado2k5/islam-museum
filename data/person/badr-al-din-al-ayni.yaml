summary:
  ar: "بدر الدين محمود بن أحمد العيني، فقيه حنفي وقاضي قضاة الحنفية في القاهرة، ومحتسبها وناظر أحباسها، وصاحب «عمدة القاري» شرح صحيح البخاري، وُلد بعينتاب سنة 762هـ (1361م) وتوفي سنة 855هـ (1451م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 839-840}."
  en: "Badr al-Din Mahmud b. Ahmad al-'Ayni, Hanafi scholar, chief Hanafi qadi and muhtasib of Cairo, and author of the commentary on al-Bukhari, 'Umdat al-Qari. Born at 'Aynṭab in 762 AH (1361), he died in 855 AH (1451) {cite:encyclopaedia-of-islam-2 vol. 1 p. 839-840}."
