summary:
  ar: "أحمد بن خليل بن سعادة، أبو العباس شمس الدين المهلبي الخويي، قاض شافعي من العلماء بالكلام وله معرفة بالطب، ولد في خوي بأذربيجان وتعلم بها وبخراسان وولي قضاء القضاة بالشام وتوفي بدمشق، صاحب «السفينة النوحية» في النفس والروح."
  en: "Ahmad ibn Khalil al-Khu'i, Abu al-Abbas Shams al-Din, a Shafi'i judge learned in theology and with a knowledge of medicine, born in Khuy in Azerbaijan, who studied there and in Khurasan, became chief judge in Syria and died in Damascus; author of al-Safina al-Nuhiyya on the soul and spirit."
