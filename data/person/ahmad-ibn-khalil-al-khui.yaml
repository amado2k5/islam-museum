label:
  ar: "أحمد بن خليل الخويي"
  en: "Ahmad ibn Khalil al-Khu'i"
  es: "Ahmad ibn Khalil al-Khu'i"
  fr: "Ahmad ibn Khalil al-Khu'i"
  ur: "احمد بن خلیل الخوئی"
roles: [scholar, qadi]
gender: male
summary:
  ar: "أحمد بن خليل بن سعادة، أبو العباس شمس الدين المهلبي الخويي، قاض شافعي من العلماء بالكلام وله معرفة بالطب، ولد في خوي بأذربيجان وتعلم بها وبخراسان وولي قضاء القضاة بالشام وتوفي بدمشق، صاحب «السفينة النوحية» في النفس والروح."
  en: "Ahmad ibn Khalil al-Khu'i, Abu al-Abbas Shams al-Din, a Shafi'i judge learned in theology and with a knowledge of medicine, born in Khuy in Azerbaijan, who studied there and in Khurasan, became chief judge in Syria and died in Damascus; author of al-Safina al-Nuhiyya on the soul and spirit."
  es: "Ahmad ibn Khalil al-Khu'i, Abu al-Abbas Shams al-Din, juez shafi'í versado en teología y con conocimientos de medicina, nacido en Khuy, Azerbaiyán, que estudió allí y en Jorasán, llegó a ser juez jefe en Siria y murió en Damasco; autor de al-Safina al-Nuhiyya sobre el alma y el espíritu."
  fr: "Ahmad ibn Khalil al-Khu'i, Abu al-Abbas Shams al-Din, juge chaféite versé en théologie et possédant des connaissances en médecine, né à Khuy en Azerbaïdjan, qui y étudia ainsi qu'au Khorasan, devint juge en chef en Syrie et mourut à Damas; auteur d'al-Safina al-Nuhiyya sur l'âme et l'esprit."
  ur: "احمد بن خلیل الخوئی، ابو العباس شمس الدین، ایک شافعی جج نے علم الٰہیات اور طب کا علم حاصل کیا، آذربائیجان کے خوئے میں پیدا ہوئے، وہاں اور خراسان میں تعلیم حاصل کی، شام میں چیف منصف بنے اور دمشق میں وفات پائی۔ روح اور روح پر السفینہ النحیہ کے مصنف۔"
  tr: "Ahmed ibn Halil ibn Sa'ada, Ebu el-Abbas Şems el-Din el-Muhallabi el-Khuveyi, teoloji ve tıp bilgisine sahip bir Şafiî kadısıydı. Azerbaycan'ın Khoy şehrinde doğdu, orada ve Horasan'da eğitim gördü. Levant Başkadı olarak atandı ve Şam'da vefat etti. Ruh ve maneviyat üzerine yazdığı \"Nuh'un Gemisi\" adlı eserin yazarıdır."
  id: "Ahmad ibn Khalil ibn Sa’ada, Abu al-Abbas Shams al-Din al-Muhallabi al-Khuwayi, seorang hakim mazhab Syafi'i yang berpengetahuan luas dalam teologi dan kedokteran. Ia lahir di Khoy, Azerbaijan, dan belajar di sana serta di Khorasan. Ia diangkat menjadi Ketua Hakim Levant dan meninggal di Damaskus. Ia adalah penulis kitab “Bahtera Nuh” tentang jiwa dan roh."
