label: { ar: "الربيع بن خثيم الثوري", en: "al-Rabi' ibn Khuthaym al-Thawri" }
summary:
  ar: "الربيع بن خثيم الثوري من الزهاد التابعين؛ أغزاه علي الديلم وعقد له على أربعة آلاف من المسلمين وبقزوين مسجد الربيع بن خثيم معروف وكانت فيه شجرة يتمسح بها العامة يقال إنه غرس سواكه في الأرض فأورق حتى كانت منه فقطعها عامل طاهر بن عبد الله بن طاهر في خلافة المتوكل خوفاً أن يفتتن بها الناس."
  en: "Al-Rabi' ibn Khuthaym al-Thawri, ascetic of the Followers; Ali sent him raiding Daylam at the head of four thousand, and Qazwin kept his famous mosque with a tree the common folk rubbed for blessing — said to have sprouted from his planted tooth-stick — until Tahir ibn Abdallah's governor cut it in al-Mutawakkil's reign fearing it would beguile the people."
