  ar: "من الضبيب من جذام؛ ركب على فرسه شمر إلى جيش زيد بن حارثة مع حسان وأنيف ابني ملة، ثم إلى رفاعة بن زيد وإلى النبي بالمدينة، وهو الذي قال للنبي: أطلق لنا من كان حياً ومن قُتل فهو تحت قدمي هذه، فقال النبي: صدق أبو زيد."
  en: "Of the Dubayb of Judham; he rode on his horse Shamir to Zayd ibn Haritha's army with Hassan and Unayf the sons of Milla, then to Rifa'a ibn Zayd and on to the Prophet at Medina, where he said: release for us those still alive, and the dead are beneath this foot of mine; the Prophet said: Abu Zayd has spoken truly."
