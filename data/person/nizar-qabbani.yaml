summary:
  ar: "شاعر ودبلوماسي سوري (1923–1998)، يُعدّ شاعر سوريا الوطني وأحد أشهر الشعراء العرب المعاصرين. وُلد في دمشق، ودرس الحقوق، وعمل في السلك الدبلوماسي السوري حتى 1966، وكتب شعر الحب والمرأة والسياسة، وتوفي في لندن سنة 1998 ودُفن في دمشق."
  en: "Syrian poet and diplomat (1923–1998), regarded as Syria's national poet and one of the most celebrated contemporary Arab poets. Born in Damascus, he studied law, served in the Syrian diplomatic service until 1966, and wrote poetry of love, women and politics; he died in London in 1998 and was buried in Damascus."
  ur: "سوری شاعر اور سفارت کار (1923–1998)، جنہیں سوریہ کا قومی شاعر اور سب سے مشہور معاصر عرب شاعروں میں سے ایک سمجھا جاتا ہے۔ وہ دمشق میں پیدا ہوئے، قانون کی تعلیم پائی، 1966 تک سوری سفارتی خدمت میں رہے، اور محبت، خواتین اور سیاست پر شاعری کی؛ 1998 میں لندن میں وفات پائی اور دمشق میں دفن ہوئے۔"
