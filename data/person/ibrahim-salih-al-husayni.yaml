summary:
  ar: "محدث نيجيري من ولاية بورنو، وُلد سنة 1938، مفتي نيجيريا العام. تخرج في الجامعة الإسلامية بالمدينة المنورة، ودرّس الصحيحين في نيجيريا عقودًا وألّف مؤلفات كثيرة في الحديث والفقه والعقيدة."
  en: "Nigerian hadith scholar from Borno State, born in 1938, Grand Mufti of Nigeria. A graduate of the Islamic University of Madinah, he taught the Sahihs in Nigeria for decades and authored hundreds of works in hadith, fiqh and creed."
  ur: "نائجیریا کے محدث، برنو سے، 1938 میں پیدا ہوئے اور نائجیریا کے مفتیِ اعظم۔ جامعہ اسلامیہ مدینہ کے فارغ التحصیل، انہوں نے نائجیریا میں عشروں صحیحین پڑھائی اور حدیث، فقہ و عقیدہ میں سینکڑوں تصانیف لکھیں۔"
  es: "Erudito nigeriano de hadices, originario del estado de Borno, nacido en 1938, Gran Muftí de Nigeria. Graduado de la Universidad Islámica de Medina, enseñó los Sahihs en Nigeria durante décadas y es autor de cientos de obras sobre hadices, fiqh y doctrina."
