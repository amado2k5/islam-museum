  ar: "عالم مصري، مفتي الديار المصرية (1986–1996) ثم الإمام الأكبر شيخ الأزهر من 1996 حتى وفاته في 2010، وصاحب تفسير للقرآن في سبعة آلاف صفحة وفتاوى أثارت جدلًا واسعًا."
  en: "Egyptian scholar, Grand Mufti of Egypt (1986–1996) and then Grand Imam of al-Azhar from 1996 until his death in 2010. He wrote a seven-thousand-page exegesis of the Qur'an, and a number of his fatwas drew wide controversy."
