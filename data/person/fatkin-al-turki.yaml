summary:
  ar: "أفتكين التركي؛ مولى معز الدولة بن بويه؛ تغلب على دمشق وخرج على العزيز بالله العبيدي صاحب مصر وقصده بنفسه فالتقى جيشاهما وجرت مقتلة عظيمة بينهما وانكسر أفتكين وهرب فقطع عليه الطريق دغفل بن الجراح البدوي وحمله إلى العزيز وفي عنقه حبل فأطلقه وأحسن إليه وأقام يسيراً ثم مات {cite:wafayat-ayan}."
  en: "Fatkin al-Turki (d. 372) — mawla of the Buyid Mu'izz al-Dawla; seized Damascus and marched against the Fatimid al-Aziz, was routed, captured by the Bedouin chief Dagh fal b. al-Jarrah, then released and honoured by al-Aziz {cite:wafayat-ayan}."
  es: "Fatkin al-Turki (m. 372) — mawla del buyí Mu'izz al-Dawla; tomó Damasco y marchó contra el fatimí al-Aziz, fue derrotado, capturado por el jefe beduino Dagh fal b. al-Jarrah, luego liberado y honrado por al-Aziz {cite:wafayat-ayan}."
  fr: "Fatkin al-Turki (d. 372) — mawla du Bouyide Mu'izz al-Dawla; s'empara de Damas et marcha contre le Fatimide al-Aziz, fut mis en déroute, capturé par le chef bédouin Dagh fal b. al-Jarrah, puis libéré et honoré par al-Aziz {cite:wafayat-ayan}."
  ur: "فتکین الترکی ⁦(متوفی 372)⁩ - بیعد معز الدولہ کا مولا؛ دمشق پر قبضہ کر لیا اور فاطمی العزیز کے خلاف مارچ کیا، بدوؤں کے سردار داغ فال بی کے ہاتھوں شکست کھا گیا۔ الجراح، پھر العزیز کی طرف سے جاری کیا گیا اور اعزاز سے نوازا گیا۔"
  tr: "Mu'izz al-Dawla ibn Buyah'ın özgür adamı Aftikin al-Turki, Şam'ı yendi ve Mısır hükümdarı el-Aziz Billah el-Ubeydi'ye karşı isyan etti, kendisi ona gitti. Orduları karşılaştı ve aralarında büyük bir katliam yaşandı. Aftikin yenildi ve kaçtı. Daghfal ibn al-Jarrah al-Badawi yolu kesti ve boynuna ip takarak onu el-Aziz'e taşıdı. Onu serbest bıraktı, iyi davrandı, kısa bir süre kaldı ve ardından öldü {atıf:wafayat-ayan}."
  id: "Aftikin al-Turki, mantan budak Mu'izz al-Dawla ibn Buyah, mengalahkan Damaskus, memberontak melawan al-Aziz Billah al-Ubaydi, penguasa Mesir, dan pergi langsung kepadanya. Pasukan mereka bertemu, dan terjadi pembantaian besar di antara mereka. Aftikin dikalahkan dan melarikan diri. Daghfal ibn al-Jarrah al-Badawi memotong jalan dan membawanya ke al-Aziz dengan tali di lehernya. Ia membebaskannya, memperlakukannya dengan baik, tinggal sebentar, lalu meninggal {cite:wafayat-ayan}."
