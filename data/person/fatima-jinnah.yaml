    note: "Recorded under the founder's Shia-mapping rule: two independent sources attest that she was Shia, and the branch is the one her funeral rites name. The Urdu article reports testimony, preserved in Liaquat H. Merchant's account, that during her 1964–65 presidential campaign, when local Shia leaders told her they would vote for Ayub Khan, she answered that she could represent them better because she herself was also Shia; the same article states that her last rites in 1967 were performed according to the Shia rite while the state funeral was Sunni. Independently, the English article, citing Pirbhai's biography (2017, p. 249), records that Ithna Ashari — that is, Twelver — Shia rites were performed privately at her home while a Sunni cleric led the public funeral prayers. The sources name 'Shia'; 'Twelver' is the founder's mapping from the Ithna Ashari rite the English article specifies, and it is stated as a mapping here. The readings that do not attest her own affiliation are preserved: the English article, also citing Pirbhai, says her parents belonged to the Ismaili Shia Khoja community — family origin, which never counts — and the English and Arabic articles' categories file her among Ismailis, which are filings, not attestations; the Urdu article also preserves Merchant's observation that she and her brother carefully avoided sectarian identification in public. Wikidata carries Shia Islam and Islam as structured values, an echo of the text tradition rather than a further source."
