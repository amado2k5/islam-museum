summary:
  ar: "طبيبة أسنان وسياسية باكستانية (1893–1967)، الأخت الصغرى لمحمد علي جناح وأقرب مستشاريه؛ أول امرأة تتأهل طبيبةَ أسنان في الهند البريطانية. بعد قيام باكستان أسست لجنة إغاثة المرأة التي تطورت إلى جمعية المرأة الباكستانية (أبوا)، وفي 1965 نافست الرئيس أيوب خان على رئاسة الجمهورية مرشحةً عن أحزاب المعارضة المتحدة، فغدت رمزاً للديمقراطية في بلادها ولُقبت بـ«مادر ملت» (أم الأمة)."
  en: "Pakistani dental surgeon and politician (1893–1967), the younger sister of Muhammad Ali Jinnah and his closest adviser; the first woman to qualify as a dentist in British India. After independence she founded the Women's Relief Committee, which evolved into the All Pakistan Women's Association, and in 1965 she contested the presidency against Ayub Khan as the Combined Opposition Parties' candidate, becoming a symbol of democratic Pakistan known as Madar-e-Millat (\"Mother of the Nation\")."
  ur: "پاکستانی دندان ساز اور سیاست دان (1893ء–1967ء)، محمد علی جناح کی چھوٹی بہن اور ان کی قریب ترین مشیر؛ برطانوی ہندوستان میں دندان سازی کی اہلیت حاصل کرنے والی پہلی خاتون۔ قیامِ پاکستان کے بعد انھوں نے ویمنز ریلیف کمیٹی قائم کی جو بعد میں آل پاکستان ویمنز ایسوسی ایشن (اپوا) بنی، اور 1965ء میں متحدہ اپوزیشن کی امیدوار کے طور پر صدر ایوب خان کے مقابل صدارتی انتخاب لڑا؛ وہ «مادرِ ملت» کے لقب سے مشہور ہیں۔"
