class: person
label: { ar: "عزرة بن قيس البجلي", en: "Uzra ibn Qays al-Bajali", es: "Uzra ibn Qays al-Bajali", fr: "Uzra ibn Qays al-Bajali", ur: "عذرا بن قیس البجلی" }
summary:
  ar: "عزرة بن قيس بن غزية البجلي؛ عند البلاذري خلفه جرير بن عبد الله على حلوان حين مضى نحو الدينور وفتح قرماسين ثم خلفه عليها حين سار إلى أبي موسى الأشعري سنة 19."
  en: "Uzra ibn Qays ibn Ghaziyya al-Bajali; in al-Baladhuri left by Jarir over Hulwan when he marched toward al-Dinawar and took Qarmasin, then again when he joined Abu Musa al-Ash'ari in year 19."
  es: "Uzra ibn Qays ibn Ghaziyya al-Bajali; en al-Baladhuri dejado por Jarir sobre Hulwan cuando marchó hacia al-Dinawar y tomó Qarmasin, y luego nuevamente cuando se unió a Abu Musa al-Ash'ari en el año 19."
  fr: "Uzra ibn Qays ibn Ghaziyya al-Bajali; à al-Baladhuri laissé par Jarir sur Hulwan lorsqu'il marcha vers al-Dinawar et prit Qarmasin, puis de nouveau lorsqu'il rejoignit Abu Musa al-Ash'ari en l'an 19."
  ur: "عذرا بن قیس بن غازیہ البجلی؛ البلادوری میں جریر نے حلوان کے اوپر چھوڑ دیا جب اس نے الدنور کی طرف کوچ کیا اور قرمسین پر قبضہ کیا، پھر دوبارہ جب وہ سنہ 19 میں ابو موسیٰ اشعری کے ساتھ شامل ہوا۔"
  tr: "Azrah ibn Qays ibn Ghaziyyah al-Bajali; el-Baladhuri'ye göre, Dinawar'a doğru ilerleyip Karmasin'i fethettiğinde Halwan'da Jarir ibn Abdullah tarafından yerine geçmiş, ardından 19 Hicri yılında Ebu Musa el-Eş'ari'ye yürüdüğünde onun yerine geçmiştir."
  id: "Azrah ibn Qays ibn Ghaziyyah al-Bajali; menurut al-Baladhuri, ia digantikan oleh Jarir ibn Abdullah atas Halwan ketika ia bergerak menuju Dinawar dan menaklukkan Qarmasin, kemudian menggantikannya di sana ketika ia berbaris ke Abu Musa al-Ash'ari pada tahun 19 H."
