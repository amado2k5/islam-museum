summary:
  ar: "أبو حاتم محمد بن إدريس بن المنذر الحنظلي الرازي، أحد أئمة الحفاظ العارفين بعلل الحديث والجرح والتعديل، سمع أنس بن عياض وأبا زيد النحوي وخلقًا كثيرًا، وروى عنه يونس بن عبد الأعلى والربيع بن سليمان المصريان، وقدم بغداد فحدّث بها وروى عنه من أهلها إبراهيم الحربي وابن أبي الدنيا والمحاملي، وكان يقول خرجت في طلب الحديث فأحصيت أني مشيت على قدمي زيادة على ألف فرسخ، وانقطعت نفقته بالبصرة حتى باع ثيابه وطاف مع صديقه على المشيخة جائعًا ثلاثة أيام، وتوفي في هذه السنة، أي سبع وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 107-108}."
  en: "Abu Hatim Muhammad ibn Idris al-Razi al-Handhali — a leading hadith master of transmission-defects and narrator criticism; he reckoned he had walked over a thousand farsakhs seeking hadith, and when his funds ran out at Basra he sold his clothes and kept auditing the shaykhs hungry for three days; died 277 {cite:muntazam-ibn-al-jawzi p. 107-108}."
