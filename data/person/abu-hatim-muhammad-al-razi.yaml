summary:
  ar: "أبو حاتم محمد بن إدريس بن المنذر الحنظلي الرازي، أحد أئمة الحفاظ العارفين بعلل الحديث والجرح والتعديل، سمع أنس بن عياض وأبا زيد النحوي وخلقًا كثيرًا، وروى عنه يونس بن عبد الأعلى والربيع بن سليمان المصريان، وقدم بغداد فحدّث بها وروى عنه من أهلها إبراهيم الحربي وابن أبي الدنيا والمحاملي، وكان يقول خرجت في طلب الحديث فأحصيت أني مشيت على قدمي زيادة على ألف فرسخ، وانقطعت نفقته بالبصرة حتى باع ثيابه وطاف مع صديقه على المشيخة جائعًا ثلاثة أيام، وتوفي في هذه السنة، أي سبع وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 107-108}."
  en: "Abu Hatim Muhammad ibn Idris al-Razi al-Handhali — a leading hadith master of transmission-defects and narrator criticism; he reckoned he had walked over a thousand farsakhs seeking hadith, and when his funds ran out at Basra he sold his clothes and kept auditing the shaykhs hungry for three days; died 277 {cite:muntazam-ibn-al-jawzi p. 107-108}."
  fr: "Abu Hatim Muhammad ibn Idris al-Razi al-Handhali — grand maître du hadith pour les défauts de transmission et la critique des transmetteurs ; il estimait avoir parcouru à pied plus de mille farsakhs en quête de hadiths, et quand ses fonds s'épuisèrent à Bassora, il vendit ses vêtements et continua de suivre les shaykhs, affamé, pendant trois jours ; mort en 277 {cite:muntazam-ibn-al-jawzi p. 107-108}."
  es: "Abu Hatim Muhammad ibn Idris al-Razi al-Handhali — un destacado maestro de hadices, experto en defectos de transmisión y crítica de narradores; calculó que había recorrido más de mil farsakhs buscando hadices, y cuando se le acabaron los fondos en Basora vendió su ropa y pasó tres días haciendo auditorías a los shaykhs, hambriento; murió en 277 {cite:muntazam-ibn-al-jawzi p. 107-108}."
  ur: "ابو حاتم محمد بن ادریس الرازی الہندلی - نقلی نقائص اور راوی تنقید کا ایک معروف حدیث کا ماہر؛ اس کا خیال تھا کہ وہ حدیث کی تلاش میں ایک ہزار فرسخ سے زیادہ پیدل سفر کرچکا ہے، اور جب بصرہ میں اس کی رقم ختم ہوگئی تو اس نے اپنے کپڑے بیچ دیے اور تین دن تک بھوکے شیخوں کا معائنہ کرتے رہے۔ وفات 277 {حوالہ:منتظم ابن الجوزی ص۔ 107-108}۔"
  tr: "Hadis âlimlerinin önde gelenlerinden, hadislerin kusurları, eleştiri ve tasdik ilmi konusunda bilgili olan Ebu Hatim Muhammed ibn İdris ibn el-Mundhir el-Hanzali el-Razi, Enes ibn Ayad, Ebu Zeyd el-Nehvi ve daha birçok kişiden hadis rivayet etmiştir. Yunus ibn Abd el-A'la ve el-Rabi' ibn Süleyman el-Miseri de ondan rivayet etmişlerdir. Bağdat'a gelmiş ve orada hadis rivayet etmiştir; İbrahim el-Harbi, İbn Abi el-Dünye ve el-Mahamili de ondan rivayet etmişlerdir. Şöyle derdi: \"Hadis aramak için yola çıktım ve bin fersahtan fazla yürüdüğümü saydım.\" Basra'da masrafları tükenince elbiselerini satıp arkadaşıyla birlikte üç gün aç bir şekilde şeyhleri dolaştı. Bu yıl, yani 277 yılında vefat etti. {cite:muntazam-ibn-al-jawzi s. 107-108}."
  id: "Abu Hatim Muhammad ibn Idris ibn al-Mundhir al-Hanzali al-Razi, salah satu ulama hadits terkemuka yang berpengetahuan tentang kekurangan hadits dan ilmu kritik serta otentikasi, mendengar hadits dari Anas ibn Ayad, Abu Zayd al-Nahwi, dan banyak lainnya. Yunus ibn Abd al-A’la dan al-Rabi’ ibn Sulayman al-Misri meriwayatkan hadits darinya. Beliau datang ke Baghdad dan meriwayatkan hadits di sana, dan Ibrahim al-Harbi, Ibn Abi al-Dunya, dan al-Mahamili meriwayatkan hadits darinya. Beliau biasa berkata, “Aku pergi mencari hadits, dan aku menghitung bahwa aku berjalan kaki lebih dari seribu farsakh.” Pengeluarannya di Basra habis hingga ia menjual pakaiannya dan berkeliling bersama temannya menemui para syekh dalam keadaan lapar selama tiga hari. Beliau wafat pada tahun ini, yaitu tahun 277. {kutip:muntazam-ibn-al-jawzi hal. 107-108}."
