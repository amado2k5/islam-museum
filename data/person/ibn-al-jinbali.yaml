summary:
  ar: "الناصح بن الحنبلي المعروف بابن الجنبلي، الواعظ الفقيه؛ رحل إلى البلاد فسمع ببغداد من شهدة والسقلاطوني وبأصبهان من أبي موسى المديني وهو آخر من سمع منه في مرض موته، وبالموصل من أبي أحمد الحداد، وقدم مصر مرتين وتفقه على ابن المني وأبي البقاء العكبري وقرأ فصيح ثعلب من حفظه؛ وعظ من أوائل عمره وحصل له القبول التام ووعظ بمصر وحلب وأربل والمدينة وبيت المقدس وكانت له حرمة عند ملوك الشام بني أيوب وحضر فتح القدس مع صلاح الدين؛ وانتهت إليه رياسة المذهب بعد الشيخ موفق الدين ابن قدامة وكان يساميه في حياته، ووقع بينهما اختلاف في فتوى في السماع المحدث فرد الناصح مقالة الموفق؛ له كتاب أسباب الحديث في مجلدات وكتاب الاستسعاد بمن لقيت من صالحي العباد وكتاب الإنجاد في الجهاد وتاريخ الوعاظ {cite:shadharat-dhahab p. 164-166}."
  en: "al-Nasih b. al-Hanbali, Ibn al-Jinbali (554–634) — Damascus's Hanbali preacher-in-chief after Muwaffaq al-Din Ibn Qudama, whom he answered in the famous sama' dispute; heard hadith from Baghdad to Isfahan, preached in Egypt, Aleppo, Arbil, Medina and Jerusalem, stood beside Salah al-Din at the conquest; author of Asbab al-Hadith and a Tarikh al-Wu'az {cite:shadharat-dhahab p. 164-166}."
  es: "al-Nasih b. al-Hanbali, Ibn al-Jinbali (554–634) — Predicador hanbalí principal de Damasco después de Muwaffaq al-Din Ibn Qudama, a quien respondió en la famosa disputa de sama'; escuchó hadices desde Bagdad hasta Isfahán, predicó en Egipto, Alepo, Erbil, Medina y Jerusalén, estuvo junto a Saladino en la conquista; autor de Asbab al-Hadith y un Tarikh al-Wu'az {cite:shadharat-dhahab p. 164-166}."
  fr: "al-Nasih b. al-Hanbali, Ibn al-Jinbali (554–634) — Prédicateur hanbalite en chef de Damas après Muwaffaq al-Din Ibn Qudama, auquel il répondit dans la célèbre dispute du sama'; a entendu des hadiths de Bagdad à Ispahan, a prêché en Égypte, à Alep, à Erbil, à Médine et à Jérusalem, s'est tenu aux côtés de Salah al-Din lors de la conquête; auteur d'Asbab al-Hadith et d'un Tarikh al-Wu'az {cite:shadharat-dhahab p. 164-166}."
  ur: "النصیح ب الحنبلی، ابن الجنبلی (554-634) - موفق الدین ابن قدامہ کے بعد دمشق کے حنبلی مبلغ، جن کا اس نے مشہور سماع تنازعہ میں جواب دیا؛ بغداد سے اصفہان تک حدیث سنی، مصر، حلب، اربیل، مدینہ اور یروشلم میں تبلیغ کی، فتح کے موقع پر صلاح الدین کے ساتھ کھڑے ہوئے۔ اصباب الحدیث اور تاریخ الوضو کے مصنف 164-166}۔"
  tr: "El-Nasih bin el-Hanbali, İbn el-Canbali olarak bilinir, vaiz ve hukukçu, ülkeye seyahat etti ve Bağdat'ta Şehda, el-Sekalatuni ve İsfahan'ı Ebu Musa el-Medini'den dinledi; Madini, ölümcül hastalığı sırasında ondan son haber aldı; Musul'da ise Ebu Ahmed el-Haddad'dan dinlendi. İki kez Mısır'a seyahat etti, İbn el-Münni ve Ebu el-Baka el-Ukbari'nin yanında hukuk eğitimi aldı ve onun anısından Telab'ın klasik eserlerini okudu. Küçük yaşlardan itibaren vaaz verdi ve tamamen kabul edildi. Mısır, Halep, Erbil, Medine ve Kudüs'te vaaz verdi. Levant kralları, Eyyub hanedanı tarafından saygı gördü ve Kudüs'ün fethine katıldı Salah al-Din ile; Şeyh Muwaffaq al-Din İbn Kudamah'tan sonra medhabın başı oldu; Kudemah onu yaşamı boyunca adlandırdı. Hadis âliminin dinlemesiyle ilgili bir fetva konusunda aralarında anlaşmazlık çıktı. El-Nasih, El-Muvaffaq'ın makalesine yanıt verdi; Esbab el-Hadis adlı ciltli kitabı, Al-İstisa'd biman Maqati min Salihi al-Ibad, Al-Injad fi al-Cihad ve vaizlerin tarihini (atı:Shadharat-Dhahab, s. 164-166} kaleme aldı."
  id: "Al-Nasih ibn al-Hanbali, yang dikenal sebagai Ibn al-Janbali, seorang pengkhotbah dan ahli hukum, melakukan perjalanan ke tanah itu dan mendengar di Baghdad dari Shahdah, al-Saqalatuni, dan Isfahan dari Abu Musa al-Madini, yang menjadi orang terakhir yang mendengar kabarnya selama penyakit terminalnya, dan di Mosul dari Abu Ahmad al-Haddad. Ia dua kali melakukan perjalanan ke Mesir, mempelajari hukum di bawah bimbingan Ibn al-Munni dan Abu al-Baqa al-'Ukbari, serta membacakan karya-karya klasik Tha'lab dari ingatannya. Ia berkhotbah sejak usia muda dan diterima sepenuhnya. Ia berkhotbah di Mesir, Aleppo, Erbil, Madinah, dan Yerusalem. Ia dihormati oleh raja-raja Levant, dinasti Ayyub, dan menghadiri penaklukan Yerusalem bersama Salah al-Din; ia menjadi kepala madhhab setelah Sheikh Muwaffaq al-Din Ibn Qudamah, yang menyebutnya selama hidupnya. Terjadi perselisihan di antara mereka mengenai fatwa yang berkaitan dengan mendengarkan ulama hadis. Al-Nasih menanggapi artikel Al-Muwaffaq; ia menulis buku Asbab al-Hadith dalam jumlah volume, buku Al-Istisa'd biman Maqati min Salihi al-Ibad, buku Al-Injad fi al-Jihad, dan sejarah para pengkhotbah {cite:shadharat-dhahab, hlm. 164-166}."
