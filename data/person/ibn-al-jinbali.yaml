summary:
  ar: "الناصح بن الحنبلي المعروف بابن الجنبلي، الواعظ الفقيه؛ رحل إلى البلاد فسمع ببغداد من شهدة والسقلاطوني وبأصبهان من أبي موسى المديني وهو آخر من سمع منه في مرض موته، وبالموصل من أبي أحمد الحداد، وقدم مصر مرتين وتفقه على ابن المني وأبي البقاء العكبري وقرأ فصيح ثعلب من حفظه؛ وعظ من أوائل عمره وحصل له القبول التام ووعظ بمصر وحلب وأربل والمدينة وبيت المقدس وكانت له حرمة عند ملوك الشام بني أيوب وحضر فتح القدس مع صلاح الدين؛ وانتهت إليه رياسة المذهب بعد الشيخ موفق الدين ابن قدامة وكان يساميه في حياته، ووقع بينهما اختلاف في فتوى في السماع المحدث فرد الناصح مقالة الموفق؛ له كتاب أسباب الحديث في مجلدات وكتاب الاستسعاد بمن لقيت من صالحي العباد وكتاب الإنجاد في الجهاد وتاريخ الوعاظ {cite:shadharat-dhahab p. 164-166}."
  en: "al-Nasih b. al-Hanbali, Ibn al-Jinbali (554–634) — Damascus's Hanbali preacher-in-chief after Muwaffaq al-Din Ibn Qudama, whom he answered in the famous sama' dispute; heard hadith from Baghdad to Isfahan, preached in Egypt, Aleppo, Arbil, Medina and Jerusalem, stood beside Salah al-Din at the conquest; author of Asbab al-Hadith and a Tarikh al-Wu'az {cite:shadharat-dhahab p. 164-166}."
