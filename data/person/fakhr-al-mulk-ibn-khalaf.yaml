summary:
  ar: "أبو غالب محمد بن علي بن خلف، الملقب فخر الملك؛ وزير بهاء الدولة ثم ولده سلطان الدولة البويهي، وكان من أعظم وزراء آل بويه على الإطلاق بعد أبي الفضل ابن العميد والصاحب بن عباد، وكان أصله من واسط وأبوه صيرفياً؛ واسع النعمة، جامع الفضائل والإفضال، جزيل العطايا، قصده أعيان الشعراء منهم أبو نصر عبد العزيز بن نباتة بقصيدته النونية «لكل فتى قرين حين يسمو وفخر الملك ليس له قرين»؛ ونقم عليه سلطان الدولة فحبسه ثم قتله قرب الأهواز ودفن هناك، فنبشت الكلاب قبره فأعيد دفن رمّته في مشهد سنة ثمان وأربعمائة {cite:wafayat-ayan}."
  en: "Fakhr al-Mulk Abu Ghalib (d. 407) — of Wasit, a money-changer's son; ranked with Ibn al-Amid and the Sahib as the greatest Buyid vizier; executed by Sultan al-Dawla near Ahwaz {cite:wafayat-ayan}."
