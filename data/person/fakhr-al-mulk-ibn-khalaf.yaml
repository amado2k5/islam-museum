id: person/fakhr-al-mulk-ibn-khalaf
class: person
label: { ar: "فخر الملك الوزير", en: "Fakhr al-Mulk" }
died: { edtf: "1016", hijri: "0407", calendar: julian, precision: day, status: tradition, derived: true, note: "حبسه سلطان الدولة ثم قتله بسفح جبل قريب من الأهواز يوم السبت، وقيل يوم الثلاثاء، لثلاث بقين من شهر ربيع الأول سنة سبع وأربعمائة {cite:wafayat-ayan}." }
summary:
  ar: "أبو غالب محمد بن علي بن خلف، الملقب فخر الملك؛ وزير بهاء الدولة ثم ولده سلطان الدولة البويهي، وكان من أعظم وزراء آل بويه على الإطلاق بعد أبي الفضل ابن العميد والصاحب بن عباد، وكان أصله من واسط وأبوه صيرفياً؛ واسع النعمة، جامع الفضائل والإفضال، جزيل العطايا، قصده أعيان الشعراء منهم أبو نصر عبد العزيز بن نباتة بقصيدته النونية «لكل فتى قرين حين يسمو وفخر الملك ليس له قرين»؛ ونقم عليه سلطان الدولة فحبسه ثم قتله قرب الأهواز ودفن هناك، فنبشت الكلاب قبره فأعيد دفن رمّته في مشهد سنة ثمان وأربعمائة {cite:wafayat-ayan}. وعند ابن الجوزي عمّر سواد الكوفة وعمل الجسر ببغداد بعد أن بطل وعمل له درابزينات، وعمّر البيمارستان العضدي وداره بالحريم الطاهري (الفخرية)، وسنّ تفرقة الحلوى في النصف من رمضان، واستغاثت منه أرملة قُتل زوجها فلم يلتفت إليها فلقيته بمشهد باب التبن وقالت إن القصص التي كنت أرفعها إليك صرت أرفعها إلى الله وأنا منتظرة خروج التوقيع، فلما قُبض عليه بالأهواز سنة سبع وأربعمائة قال: لا شك أن توقيعها قد خرج {cite:muntazam-ibn-al-jawzi j.7 p.286}."
  en: "Fakhr al-Mulk Abu Ghalib (d. 407) — of Wasit, a money-changer's son; ranked with Ibn al-Amid and the Sahib as the greatest Buyid vizier; executed by Sultan al-Dawla near Ahwaz {cite:wafayat-ayan}."
