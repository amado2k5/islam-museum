died: { edtf: "1016", hijri: "0407", calendar: julian, precision: day, status: tradition, derived: true, note: "حبسه سلطان الدولة ثم قتله بسفح جبل قريب من الأهواز يوم السبت، وقيل يوم الثلاثاء، لثلاث بقين من شهر ربيع الأول سنة سبع وأربعمائة {cite:wafayat-ayan}." }
summary:
  ar: "أبو غالب محمد بن علي بن خلف، الملقب فخر الملك؛ وزير بهاء الدولة ثم ولده سلطان الدولة البويهي، وكان من أعظم وزراء آل بويه على الإطلاق بعد أبي الفضل ابن العميد والصاحب بن عباد، وكان أصله من واسط وأبوه صيرفياً؛ واسع النعمة، جامع الفضائل والإفضال، جزيل العطايا، قصده أعيان الشعراء منهم أبو نصر عبد العزيز بن نباتة بقصيدته النونية «لكل فتى قرين حين يسمو وفخر الملك ليس له قرين»؛ ونقم عليه سلطان الدولة فحبسه ثم قتله قرب الأهواز ودفن هناك، فنبشت الكلاب قبره فأعيد دفن رمّته في مشهد سنة ثمان وأربعمائة {cite:wafayat-ayan}. وعند ابن الجوزي عمّر سواد الكوفة وعمل الجسر ببغداد بعد أن بطل وعمل له درابزينات، وعمّر البيمارستان العضدي وداره بالحريم الطاهري ⁦(الفخرية)⁩، وسنّ تفرقة الحلوى في النصف من رمضان، واستغاثت منه أرملة قُتل زوجها فلم يلتفت إليها فلقيته بمشهد باب التبن وقالت إن القصص التي كنت أرفعها إليك صرت أرفعها إلى الله وأنا منتظرة خروج التوقيع، فلما قُبض عليه بالأهواز سنة سبع وأربعمائة قال: لا شك أن توقيعها قد خرج {cite:muntazam-ibn-al-jawzi j.7 p.286}."
  en: "Fakhr al-Mulk Abu Ghalib (d. 407) — of Wasit, a money-changer's son; ranked with Ibn al-Amid and the Sahib as the greatest Buyid vizier; executed by Sultan al-Dawla near Ahwaz {cite:wafayat-ayan}."
  es: "Fakhr al-Mulk Abu Ghalib (m. 407) — de Wasit, hijo de un cambista; clasificado junto con Ibn al-Amid y el Sahib como el más grande visir buyí; ejecutado por el sultán al-Dawla cerca de Ahwaz {cite:wafayat-ayan}."
  fr: "Fakhr al-Mulk Abu Ghalib (d. 407) — de Wasit, fils d'un changeur d'argent; classé avec Ibn al-Amid et le Sahib comme le plus grand vizir bouyide; exécuté par le sultan al-Dawla près d'Ahwaz {cite:wafayat-ayan}."
  ur: "فخر الملک ابو غالب ⁦(متوفی 407)⁩ - وصیت کا، پیسے بدلنے والے کا بیٹا؛ ابن العمید اور صاحب کے ساتھ سب سے بڑا خریدار وزیر کے طور پر درجہ بندی؛ اہواز کے قریب سلطان الدولہ کے ذریعہ پھانسی دی گئی۔"
  tr: "Ebu Halib Muhammed bin Ali ibn Halef, lakaplı Fekhr el-Mülk, Baha' al-Dawla'nın ve ardından oğlu Sultan el-Devle el-Buveyhi'nin bakanıydı. Ebu el-Fadl bin el-Amid ve el-Sahib ibn 'Abbad'dan sonra Buyid hanedanının en büyük hizmetkarlarından biriydi. Aslen Wasitliydi ve babası bir para değiştiricisiydi; büyük nimetlere sahip, erdemli bir adamdı ve cömertlikte cömertlik gösteren erdem. Ebu Nasr Abdülaziz ibn Nebete gibi önde gelen şairler tarafından ziyaret edildi; Nebeta, 'Her genç adamın kalkarken bir yoldaşı vardır, kralın gururunun yoldaşı yoktur.' şiirini yazdı. Sultan el-Devle ona karşı isyan etti, hapse attı ve ardından Ahvaz yakınlarında öldürdü; orada defnedildi. Köpekler mezarını kazdı ve 408 H yılında Meşhed'de yeniden defnedildi. İbn el-Cewzi, kahraman olduktan sonra Ömer Sawad Kufe'yi kurdu ve Bağdat'ta köprüyü inşa etti, ona korkuluklar yaptı. El-Adadi hastanesini ve evini el-Hayri türbesinde (El-Fxwînre) inşa etti, Ramazan ortasında tatlı dağıtımını başlattı. Kocası öldürülen bir dul kadın ondan yardım istedi ama o ona dikkat etmedi. Onu Hay Kapısı'nda karşıladı ve dedi ki, sana sunduğum hikayeler şimdi imza verilmesini beklerken Allah'a teslim edildi. Dört yüz yedinci yılda Ahvaz'da tutuklandığında şöyle dedi: İmzanın verildiği kesin {atıf:muntazam-ibn-al-jawzi J.7 s.286}."
  id: "Abu Ghalib Muhammad ibn Ali ibn Khalaf, yang dijuluki Fakhr al-Mulk, adalah menteri Baha' al-Dawla dan kemudian putranya Sultan al-Dawla al-Buwayhi. Ia adalah salah satu menteri terbesar dinasti Buyid setelah Abu al-Fadl ibn al-'Amid dan al-Sahib ibn 'Abbad. Ia berasal dari Wasit, dan ayahnya adalah seorang penukar uang; ia adalah pria berkat, berbudi dan berbudi luhur, murah hati. Ia dikunjungi oleh penyair terkemuka, termasuk Abu Nasr Abd al-Aziz ibn Nabata, yang menulis puisinya 'Setiap pemuda memiliki teman saat ia bangkit, dan kebanggaan raja tidak memiliki sahabat.' Sultan al-Dawla memberontak terhadapnya, memenjarakannya, lalu membunuhnya di dekat Ahvaz, tempat ia dimakamkan di sana. Anjing-anjing menggali makamnya, dan ia dimakamkan kembali di Mashhad pada tahun 408 H. Ibn al-Jawzi memiliki Umar Sawad Kufa dan membangun jembatan di Baghdad setelah ia menjadi pahlawan dan membangun pagar untuk itu. Ia membangun rumah sakit al-Adadi dan rumahnya di tempat suci al-Hayri (Al-Fakhriyah), dan ia memulai pembagian permen di tengah Ramadan. Seorang janda yang suaminya dibunuh meminta bantuan darinya tetapi ia tidak memperhatikannya. Ia bertemu dengannya di Gerbang Jerami dan berkata bahwa cerita-cerita yang dulu saya sampaikan kepada Anda kini telah diserahkan kepada Tuhan sementara saya menunggu tanda tangan dikeluarkan. Ketika ia ditangkap di Ahvaz pada tahun empat ratus tujuh, ia berkata: Tidak diragukan lagi bahwa tanda tangan telah dikeluarkan {cite:muntazam-ibn-al-jawzi J.7 hlm.286}."
