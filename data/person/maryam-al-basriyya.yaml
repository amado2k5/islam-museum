summary:
  ar: "عابدة من البصرة كانت تخدم رابعة العدوية؛ يذكر ابن الجوزي في «صفة الصفوة» أنها كانت إذا سمعت الكلام في المحبة طاشت، وأنها ماتت في مجلس مذكّر تكلم فيها."
  en: "A devout woman of Basra who served Rabi'a al-Adawiyya; Ibn al-Jawzi's Sifat al-Safwa says she was overwhelmed whenever she heard talk of the love of God, and died in the gathering of a preacher who spoke on it."
  ur: "بصرہ کی ایک عابدہ جو رابعہ العدویہ کی خدمت کرتی تھیں؛ ابن الجوزی کی «صفۃ الصفوہ» کہتی ہے کہ محبتِ الٰہی کی بات سن کر وہ بے خود ہو جاتیں، اور ایک واعظ کی مجلس میں اسی موضوع پر گفتگو کے دوران وفات پا گئیں۔"
