    note: "The English and Arabic texts attest Omar ibn Said personally as a Muslim scholar formed by twenty-five years of Islamic study in Futa Toro, and the English article reads his 1831 autobiography as showing steadfast adherence to Islam. The same article reports the claim that he converted to Christianity in 1820 and states that this conversion is disputed: his own writings praise Muhammad, copy Qur'anic chapters as late as 1857, and frame Jesus in Islamic terms. The Urdu text says he was pressed to accept Christianity but kept Islam in his heart, although its categories file him among converts from Islam to Christianity — a category filing, which never counts, and one its own text contradicts. The French article is a declared translation of the English one, and its infobox alone gives his religion as Sunni Islam: a single unreferenced infobox value inside a translation-family article, which is one attestation of the broad value at most and never a second independent source. Wikidata gives Islam only. No source in any language names a madhhab or order for him. Under the doubt rule the value stays unknown, with all readings preserved here."
