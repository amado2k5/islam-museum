summary:
  ar: "عالم مسلم فولاني من فوتا تورو في السنغال، طلب العلم الإسلامي خمسة وعشرين عاما قبل أن يُؤسر سنة 1807 ويُنقل عبدا إلى الولايات المتحدة. بقي عبدا بقية حياته في كارولاينا الشمالية، وكتب أربعة عشر مخطوطا بالعربية أشهرها سيرته الذاتية سنة 1831، وهي السيرة العربية الوحيدة المعروفة لشخص مستعبَد في أمريكا."
  en: "A Fula Muslim scholar from Futa Toro in Senegal who spent twenty-five years in Islamic study before being captured in 1807 and carried enslaved to the United States. He remained enslaved for the rest of his life in North Carolina and wrote fourteen manuscripts in Arabic, the best known his 1831 autobiography, the only known Arabic autobiography by a person enslaved in America."
  ur: "سینیگال کے فوتا تورو سے تعلق رکھنے والے فولانی مسلمان عالم، جنہوں نے پچیس برس اسلامی علوم حاصل کیے، پھر 1807 میں گرفتار ہو کر غلام بنا کر امریکا منتقل کیے گئے۔ وہ بقیہ زندگی شمالی کیرولائنا میں غلام رہے اور عربی میں چودہ مخطوطے لکھے، جن میں مشہور ترین ان کی 1831 کی خودنوشت ہے، جو امریکا میں کسی غلام کی واحد معلوم عربی خودنوشت ہے۔"
