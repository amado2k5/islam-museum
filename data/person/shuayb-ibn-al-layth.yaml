summary:
  ar: "شعيب بن الليث بن سعد، أبو عبد الملك الفهمي بالولاء المصري، فقيه روى عن أبيه الليث بن سعد، وكان عند الصفدي إماما مفتيا ثقة، توفي سنة 199 هـ {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 16 pp. 93-94} {cite:shadharat-dhahab vol. 2 p. 471}."
  en: "Shu'ayb ibn al-Layth ibn Sa'd, Abu Abd al-Malik al-Fahmi by clientage, al-Misri, a jurist who transmitted from his father al-Layth ibn Sa'd and whom al-Safadi calls an imam, a mufti and trustworthy; he died in 199 AH (about 814 CE) {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 16 pp. 93-94} {cite:shadharat-dhahab vol. 2 p. 471}."
  es: "Shu'ayb ibn al-Layth ibn Sa'd, Abu Abd al-Malik al-Fahmi por cliente, al-Misri, un jurista heredado de su padre al-Layth ibn Sa'd y a quien al-Safadi llama imán, mufti y digno de confianza; murió en 199 d. H. (alrededor de 814 d. C.) {citar:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 16 págs. 93-94} {cita: shadharat-dhahab vol. 2p. 471}."
  fr: "Shu'ayb ibn al-Layth ibn Sa'd, Abu Abd al-Malik al-Fahmi par client, al-Misri, un juriste qui a transmis de son père al-Layth ibn Sa'd et qu'al-Safadi appelle un imam, un mufti et digne de confiance; il mourut en 199 AH (environ 814 CE) {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 16 pp. 93-94} {cite: shadharat-dhahab vol. 14h. 471}."
  ur: "شعیب بن لیث ابن سعد، ابو عبد الملک الفہمی بذریعہ مؤکل، المصری، ایک فقیہ جس نے اپنے والد لیث بن سعد سے نقل کیا ہے اور جسے الصفادی امام، مفتی اور ثقہ کہتے ہیں؛ آپ کی وفات 199 ہجری ⁦(تقریباً 814 عیسوی)⁩ میں ہوئی۔ 16 صفحہ 93-94} {حوالہ: شدارت ذہاب جلد 2ص۔ 471}۔"
