summary:
  ar: "سياسي باكستاني (1889–1973) من تشونار، من كبار قادة رابطة مسلمي عموم الهند الذين أيّدوا قرار لاهور سنة 1940، وأحد الآباء المؤسسين لباكستان. كان أول رئيس للرابطة الإسلامية (باكستان) (1948–1950)، وحاكم بنغال الشرقية (1953–1954) خلفاً لفيروز خان نون، وسفير باكستان لدى إندونيسيا والفلبين، وصاحب مذكرات «درب إلى باكستان» (1961)."
  en: "Pakistani politician (1889–1973) of Chunar, one of the top leaders of the All-India Muslim League who seconded the Lahore Resolution in 1940 and a founding father of Pakistan. He was the first president of the Muslim League (Pakistan) (1948–1950), governor of East Bengal (1953–1954) succeeding Firoz Khan Noon, Pakistan's ambassador to Indonesia and the Philippines, and author of the memoir Pathway to Pakistan (1961)."
  ur: "پاکستانی سیاست دان (1889ء–1973ء) جن کا تعلق چنار سے تھا؛ آل انڈیا مسلم لیگ کے سرکردہ رہنماؤں میں سے تھے جنھوں نے 1940ء میں قرارداد لاہور کی تائید کی، اور پاکستان کے بانیوں میں شمار ہوتے ہیں۔ مسلم لیگ (پاکستان) کے پہلے صدر (1948ء–1950ء)، مشرقی بنگال کے گورنر (1953ء–1954ء) بطور فیروز خان نون کے جانشین، انڈونیشیا و فلپائن میں پاکستان کے سفیر، اور یادداشت «شاہراہ پاکستان» (1961ء) کے مصنف۔"
