    note: >-
      FLAGGED for the founder's own ruling; this record settles nothing. The
      sources preserve two opposed readings of the man himself. For belief:
      the English article's beliefs section quotes his own description of
      Islam as 'the most reasonable and most natural' religion, and the Arabic
      article reports that his personal speeches and Turkish sources show a
      devout Muslim who called Islam 'our greatest religion' and the Qur'an
      'the perfect book'; he also spoke in defence of the caliphate in 1920.
      For unbelief: the same English section reports that various scholars
      have characterised him as an agnostic, a non-doctrinaire deist or even
      an atheist who was anti-religious and anti-Islamic, and the Arabic
      article reports the same claims, noting the view that his pro-Islam
      expressions were political calculation. The unbelief readings are other
      writers' characterisations of him, not unbelief stated in his own words
      in two independent sources, so the lane's atheist-or-sceptic bar is not
      cleanly met; the belief readings are equally contested. His Wikidata
      item carries no religion statement at all. The value is therefore
      unknown, with both readings preserved here for the founder.
