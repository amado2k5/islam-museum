summary:
  ar: "مصطفى كمال أتاتورك ⁦(نحو 1881 – 10 تشرين الثاني 1938)⁩ مشير وسياسي تركي، مؤسس الجمهورية التركية وأول رؤسائها (1923–1938)؛ قاد حرب الاستقلال التركية بعد الحرب العالمية الأولى، ثم أطلق إصلاحات علمانية شاملة شملت إلغاء السلطنة والخلافة واعتماد الأبجدية اللاتينية وقوانين مدنية جديدة."
  en: "Mustafa Kemal Atatürk (c. 1881 – 10 November 1938) was a Turkish field marshal and statesman, founder of the Republic of Turkey and its first president (1923-1938); he led the Turkish War of Independence after the First World War, then launched sweeping secularising reforms including the abolition of the sultanate and the caliphate, the adoption of the Latin alphabet and new civil codes."
  ur: "مصطفیٰ کمال اتاترک (تقریباً 1881 – 10 نومبر 1938) ترک فیلڈ مارشل و سیاست دان تھے، جمہوریہ ترکیہ کے بانی اور اس کے پہلے صدر (1923–1938)؛ انھوں نے پہلی جنگ عظیم کے بعد ترک جنگ آزادی کی قیادت کی، پھر وسیع سیکولر اصلاحات کیں جن میں سلطنت و خلافت کا خاتمہ، لاطینی رسم الخط اور نئے سول قوانین شامل تھے۔"
