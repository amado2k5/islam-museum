summary:
  ar: "فقيه ومتصوّف تجاني مغربي من سوس (1883–1949)، استقرّ في الدار البيضاء من عام 1929، وأسّس نحو مائة زاوية تجانية ومطبعته العربية، وترك مؤلفات كثيرة في التفسير والفقه والتصوف."
  en: "A Moroccan jurist and Tijani Sufi from the Souss (1883–1949) who settled in Casablanca in 1929, founded about a hundred Tijani lodges and his own Arabic press, and left many works on Qur'an commentary, law and Sufism."
  ur: "سوس سے تعلق رکھنے والے مراکشی فقیہ اور تیجانی صوفی (1883–1949)؛ 1929 میں کازابلانکا میں مقیم ہوئے، قریب سو تیجانی خانقاہیں اور اپنا عربی مطبع قائم کیا، اور تفسیر، فقہ اور تصوف پر متعدد تصانیف چھوڑیں۔"
