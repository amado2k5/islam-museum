summary:
  ar: "أبو أيوب سليمان بن حرب بن بجحيل الأزدي الواشجي البصري؛ من طبقة شعبة وجرير بن حازم والليث ومبارك بن فضالة وسعيد بن زيد بن درهم؛ روى عنه يحيى بن سعيد القطان وأحمد بن حنبل وأحمد بن سعد كاتب الواقدي؛ قدم بغداد وحدّث بها وولي قضاء مكة إلى أن عُزل سنة تسع عشرة ومائتين؛ قال أبو حاتم الرازي: إمام من الأئمة كان لا يدلّس؛ وكان مجلسه عند قصر المأمون فبنى له شبه منبر فصعده والمأمون فوق قصره يكتب ما يلقى {cite:wafayat-ayan}."
  en: "Abu Ayyub Sulayman b. Harb al-Basri (140–224) — Shu'ba's generation; transmitter for al-Qattan and Ibn Hanbal, qadi of Mecca until 219, summoned to lecture from a pulpit before al-Ma'mun {cite:wafayat-ayan}."
