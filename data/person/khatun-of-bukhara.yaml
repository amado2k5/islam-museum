id: person/khatun-of-bukhara
class: person
label: { ar: "خاتون بخارا", en: "The Khatun of Bukhara", es: "The Khatun of Bukhara", fr: "The Khatun of Bukhara", ur: "بخارا کی خاتون" }
summary:
  ar: "خاتون ملكة بخارا؛ استمدت الترك على عبيد الله بن زياد فهزمهم فصالحها على ألف ألف ودخل بيكند ثم نكثت العهد في أيام سعيد بن عثمان وأقبل أهل السغد والترك وكش ونسف في مائة ألف وعشرين ألفاً فانكسروا فأعطته الرهن وأعادت الصلح وأعانته بأهل بخارا على سمرقند وحملت إليه الصلح بالترمذ."
  en: "The Khatun, queen of Bukhara; her Turkish levies routed by Ubaydallah ibn Ziyad, she truced at a million and he entered Baykand. Under Sa'id ibn Uthman she broke covenant as the Sughd, Turks, Kish and Nasaf massed a hundred twenty thousand — broken, she gave hostages, renewed the peace, aided him on Samarqand, and sued for sulh again at Tirmidh."
  es: "La Khatun, reina de Bujará, tras la derrota de sus tropas turcas a manos de Ubaydallah ibn Ziyad, firmó una tregua por un millón de hombres y él entró en Baykand. Bajo el reinado de Sa'id ibn Uthman, rompió el pacto cuando los Sughd, los turcos, los Kish y los Nasaf reunieron ciento veinte mil hombres; tras romperse el pacto, entregó rehenes, restableció la paz, lo ayudó en Samarcanda y volvió a solicitar la tregua en Tirmidh."
  fr: "La Khatoun, reine de Boukhara, dont les troupes turques furent mises en déroute par Ubaydallah ibn Ziyad, conclut une trêve à un million d'hommes, et ce dernier entra à Baykand. Sous le règne de Sa'id ibn Uthman, elle rompit l'alliance lorsque les Sughd, les Turcs, les Kish et les Nasaf rassemblèrent cent vingt mille hommes; contrainte à la rupture, elle donna des otages, renouvela la paix, lui apporta son aide à Samarcande et demanda de nouveau le sulh à Tirmidh."
  ur: "خاتون، بخارا کی ملکہ؛ عبیداللہ ابن زیاد کی طرف سے اس کے ترک لیویز کو شکست دی گئی، اس نے دس لاکھ پر فتح پائی اور وہ بایقند میں داخل ہوا۔ سعید بن عثمان کے دور میں اس نے عہد توڑ دیا کیونکہ صغد، ترک، کیش اور ناصف نے ایک لاکھ 20 ہزار جمع کیے - ٹوٹے، اس نے یرغمال بنائے، امن کی تجدید کی، سمرقند پر اس کی مدد کی، اور ترمذ پر دوبارہ حل کے لیے مقدمہ دائر کیا۔"
  tr: "Buhara'nın Kraliçesi Hatun; Türkler Ubeyd Allah bin Ziyad'a güvendiler; o onları yendi, bin bin dolar barıştı, Beikand'a girdi ve Seyid bin Osman döneminde antlaşmayı bozdu. Sogd ve Türk halkı geldi, yüz yirmi bin kişiyle yenildi ama yenildiler. Ona söz verdi, barıştı ve Buhara halkına Semerkand'a karşı yardım etti, Tirmidi'de barış antlaşmasını getirdi."
  id: "Khatun, Ratu Bukhara; orang Turki mengandalkan Ubayd Allah ibn Ziyad, yang mengalahkan mereka, berdamai dengannya dengan seribu ribu, masuk ke Beikand, lalu melanggar perjanjian pada masa Sa'id ibn Uthman. Rakyat Sogd dan Turki datang, dan dia dikalahkan dengan jumlah seratus dua puluh ribu, tetapi mereka dikalahkan. Dia memberikan janji kepadanya, berdamai, dan membantu rakyat Bukhara melawan Samarkand, serta membawanya perjanjian damai di Tirmidhi."
