label: { ar: "خاتون بخارا", en: "The Khatun of Bukhara" }
summary:
  ar: "خاتون ملكة بخارا؛ استمدت الترك على عبيد الله بن زياد فهزمهم فصالحها على ألف ألف ودخل بيكند ثم نكثت العهد في أيام سعيد بن عثمان وأقبل أهل السغد والترك وكش ونسف في مائة ألف وعشرين ألفاً فانكسروا فأعطته الرهن وأعادت الصلح وأعانته بأهل بخارا على سمرقند وحملت إليه الصلح بالترمذ."
  en: "The Khatun, queen of Bukhara; her Turkish levies routed by Ubaydallah ibn Ziyad, she truced at a million and he entered Baykand. Under Sa'id ibn Uthman she broke covenant as the Sughd, Turks, Kish and Nasaf massed a hundred twenty thousand — broken, she gave hostages, renewed the peace, aided him on Samarqand, and sued for sulh again at Tirmidh."
