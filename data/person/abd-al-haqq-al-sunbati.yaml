summary:
  ar: "العلامة عبد الحق السنباطي القاهري الشافعي ويعرف كأبيه بابن عبد الحق؛ ولد في إحدى الجمادين سنة اثنتين وأربعين وثمانمائة بسنباط وحفظ القرآن والمنهاج الفرعي ثم أقدمه أبوه القاهرة فحفظ بها العمدة والألفيتين والشاطبيتين والمنهاج الأصلي وتلخيص المفتاح والجعبرية والخزرجية، وأخذ عن الأجلاء وأجاز له ابن حجر العسقلاني والبدر العيني وآخرون بالتدريس والإفتاء، وتصدى للإقراء بالجامع الأزهر. وكان — كما في النور — شيخ الإسلام وصفوة العلماء الأعلام، فأقام بمكة بأولاده وعائلته وأقاربه وأحفاده ليموت بأحد الحرمين، فانتعشت به البلاد وأخذ الناس عنه طبقة بعد أخرى وأُلحق الأحفاد بالأجداد؛ توفي بمكة المشرفة عند طلوع فجر يوم الجمعة مستهل شهر رمضان ودُفن بالمعلاة وكثر التأسف عليه {cite:shadharat-dhahab p. 573}."
  en: "Shaykh al-Islam, 'the cream of the learned' — memorized the books in Cairo, licensed by Ibn Hajar and al-'Ayni to teach and give fatwa, led the iqra' at al-Azhar; then moved his whole household to Mecca 'to die at one of the Sanctuaries', where generations studied under him — 'grandsons were joined to grandfathers'; died at dawn Friday at the start of Ramadan 931, Ma'la {cite:shadharat-dhahab p. 573}."
  fr: "Cheikh al-islam, « la fleur des savants » — il mémorisa les livres au Caire, reçut d'Ibn Hajar et d'al-'Ayni la licence d'enseigner et de rendre des fatwas, dirigea l'enseignement de la récitation à al-Azhar ; puis il transporta toute sa maisonnée à La Mecque « pour mourir dans l'un des deux Sanctuaires », où des générations étudièrent auprès de lui — « les petits-fils furent joints aux grands-pères » ; mort à l'aube d'un vendredi, au début de ramadan 931, inhumé à al-Ma'la {cite:shadharat-dhahab p. 573}."
  es: "Shaykh al-Islam, 'la flor y nata de los eruditos', memorizó los libros en El Cairo, fue autorizado por Ibn Hajar y al-'Ayni para enseñar y dar fatwas, dirigió el iqra' en al-Azhar; luego trasladó a toda su familia a La Meca 'para morir en uno de los Santuarios', donde generaciones estudiaron con él: 'los nietos se unieron a los abuelos'; murió al amanecer del viernes al comienzo del Ramadán de 931, Ma'la {cita: shadharat-dhahab p. 573}."
  ur: "شیخ الاسلام، 'علم کی کریم' - قاہرہ میں کتابیں حفظ کیں، جن کو ابن حجر اور العینی نے تعلیم دینے اور فتوی دینے کا لائسنس دیا، الازہر میں اقرا کی قیادت کی۔ پھر اپنے پورے گھرانے کو مکہ منتقل کر دیا 'ایک مقدس جگہ پر مرنے کے لیے'، جہاں کئی نسلوں نے اس کے ماتحت تعلیم حاصل کی - 'پوتے دادا کے ساتھ مل گئے'؛ رمضان المبارک 931 کے آغاز میں جمعہ کی صبح فجر کے وقت وفات پائی۔ 573}۔"
  tr: "Babası gibi İbn Abdülhakk olarak bilinen âlim Abdülhakk el-Sünbati el-Kahiri el-Şafiî, Hicri 842 yılının iki Cemâdesinden birinde Sunbat'ta doğdu. Kur'an'ı ve Minhac mezhebini ezberledikten sonra babası onu Kahire'ye götürdü ve orada Umda, iki Elfiyye, iki Şatibiyye, asıl Minhac, Talkhis el-Miftah, el-Ca'beriyye ve el-Hazrajiyye mezhebini ezberledi. Seçkin âlimlerden ders aldı ve İbn Hacer el-Askalani, Bedir el-Ayni ve diğerleri ona ders verme ve fetva verme izni verdi. El-Ezher Camii'nde Kur'an okuma dersleri verdi. Nur'da da belirtildiği gibi, İslam Şeyhi ve en önde gelen âlimlerin seçkinlerindendi. Ölümüne kadar çocukları, ailesi, akrabaları ve torunlarıyla birlikte Mekke'de yaşadı ve iki kutsal camiden birinde defnedildi. Ülke onun sayesinde gelişti, insanlar nesilden nesile ondan öğrendiler ve torunları da atalarıyla bir araya geldi. Ramazan ayının başlangıcı olan Cuma günü şafak vakti Mekke'de vefat etti ve Mualla'ya defnedildi. Ölümü büyük bir üzüntüye neden oldu. {cite:shadharat-dhahab s. 573}"
  id: "Ulama Abd al-Haqq al-Sunbati al-Qahiri al-Shafi'i, yang seperti ayahnya dikenal sebagai Ibn Abd al-Haqq, lahir pada salah satu dari dua bulan Jumada tahun 842 H di Sunbat. Ia menghafal Al-Qur'an dan Minhaj tambahan, kemudian ayahnya membawanya ke Kairo di mana ia menghafal al-'Umda, dua Alfiyyah, dua Shatibiyyah, Minhaj asli, Talkhis al-Miftah, al-Ja'bariyyah, dan al-Khazrajiyyah. Ia belajar di bawah bimbingan ulama terkemuka, dan Ibn Hajar al-'Asqalani, Badr al-'Ayni, dan lainnya memberinya izin untuk mengajar dan mengeluarkan fatwa. Ia mengajar tilawah di Masjid al-Azhar. Ia—seperti yang disebutkan dalam al-Nur—adalah Syekh Islam dan salah satu ulama terkemuka. Beliau tinggal di Mekah bersama anak-anak, keluarga, kerabat, dan cucu-cucunya hingga wafat di salah satu dari dua Masjid Suci. Negara ini berkembang pesat berkat beliau, dan orang-orang belajar darinya dari generasi ke generasi, dan cucu-cucunya bersatu dengan leluhur mereka. Beliau wafat di Mekah pada subuh hari Jumat, awal bulan Ramadan, dan dimakamkan di al-Mu'alla. Kepergiannya sangat diratapi. {cite:shadharat-dhahab p. 573}"
