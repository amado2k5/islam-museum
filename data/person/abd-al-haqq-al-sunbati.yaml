summary:
  ar: "العلامة عبد الحق السنباطي القاهري الشافعي ويعرف كأبيه بابن عبد الحق؛ ولد في إحدى الجمادين سنة اثنتين وأربعين وثمانمائة بسنباط وحفظ القرآن والمنهاج الفرعي ثم أقدمه أبوه القاهرة فحفظ بها العمدة والألفيتين والشاطبيتين والمنهاج الأصلي وتلخيص المفتاح والجعبرية والخزرجية، وأخذ عن الأجلاء وأجاز له ابن حجر العسقلاني والبدر العيني وآخرون بالتدريس والإفتاء، وتصدى للإقراء بالجامع الأزهر. وكان — كما في النور — شيخ الإسلام وصفوة العلماء الأعلام، فأقام بمكة بأولاده وعائلته وأقاربه وأحفاده ليموت بأحد الحرمين، فانتعشت به البلاد وأخذ الناس عنه طبقة بعد أخرى وأُلحق الأحفاد بالأجداد؛ توفي بمكة المشرفة عند طلوع فجر يوم الجمعة مستهل شهر رمضان ودُفن بالمعلاة وكثر التأسف عليه {cite:shadharat-dhahab p. 573}."
  en: "Shaykh al-Islam, 'the cream of the learned' — memorized the books in Cairo, licensed by Ibn Hajar and al-'Ayni to teach and give fatwa, led the iqra' at al-Azhar; then moved his whole household to Mecca 'to die at one of the Sanctuaries', where generations studied under him — 'grandsons were joined to grandfathers'; died at dawn Friday at the start of Ramadan 931, Ma'la {cite:shadharat-dhahab p. 573}."
