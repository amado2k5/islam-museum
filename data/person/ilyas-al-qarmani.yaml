summary:
  ar: "إلياس بن إبراهيم القرماني الطبيب الدمشقي الشافعي، إمام عصره وفريد دهره؛ قال في الكواكب: جمع بين فنون كثيرة وكان حاذقاً في الطب مهرة في القراءات والفرائض والعروض والنحو والتاريخ، ونظم المفردات وسمّاها «نظرة الأعيان في معرفة الأدوية»، وكان حسن السيرة يحسن إلى الناس لا يأخذ منهم أجراً على مداواتهم لهم؛ وكان لا يزال ينعى على نفسه وعلى غيره الإسراف في لذة المطعم والمشرب، واستمر كذلك حتى قُتل في ذي القعدة {cite:shadharat-dhahab p. 396-397}."
  en: "Ilyas al-Qarmani — Damascus physician 'imam of his age'; versified the materia medica as 'Nazrat al-A'yan fi Ma'rifat al-Adwiya,' treated people without fee, and inveighed against excess in food and drink; killed in Dhu'l-Qa'da 982 {cite:shadharat-dhahab p. 396-397}."
