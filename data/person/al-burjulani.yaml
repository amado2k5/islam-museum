  id: "Al-Barjalani, yang bernama lengkap Muhammad ibn al-Husayn dan dijuluki Abu Ja`far, adalah salah satu penulis buku-buku tentang asketisme dan kesalehan. Ia memiliki buku tentang persahabatan, buku tentang orang-orang yang tergila-gila, buku tentang kemurahan hati dan kemuliaan, buku tentang ambisi, buku tentang kesabaran, dan buku tentang ketaatan. {cite:fihrist-ibn-al-nadim p. 262}."
