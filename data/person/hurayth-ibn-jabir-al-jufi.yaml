id: person/hurayth-ibn-jabir-al-jufi
class: person
label: { ar: "حريث بن جابر الجعفي", en: "Hurayth ibn Jabir al-Ju'fi", es: "Hurayth ibn Jabir al-Ju'fi", fr: "Hurayth ibn Jabir al-Ju'fi", ur: "حریث بن جابر الجوفی" }
summary:
  ar: "من أصحاب علي بصفين، قيل إنه الذي طعن عبيد الله بن عمر فقتله، وقيل بل الأشتر النخعي، وقيل علي نفسه ضربه ضربة قطعت الحديد حتى خالطت حشوة جوفه {cite:muruj-al-dhahab p. 676}."
  en: "One of Ali's men at Siffin — named in one report as the spearman who killed 'Ubayd Allah ibn 'Umar, with variants crediting al-Ashtar or Ali himself {cite:muruj-al-dhahab p. 676}."
  es: "Uno de los hombres de Ali en Siffin, mencionado en un informe como el lancero que mató a 'Ubayd Allah ibn 'Umar, con variantes que atribuyen el crimen a al-Ashtar o al propio Ali {cite:muruj-al-dhahab p. 676}."
  fr: "Un des hommes d'Ali à Siffin — nommé dans un rapport comme le lancier qui a tué 'Ubayd Allah ibn 'Umar, avec des variantes attribuant cela à al-Ashtar ou à Ali lui-même {cite:muruj-al-dhahab p. 676}."
  ur: "صفین میں علی کے آدمیوں میں سے ایک - ایک رپورٹ میں اس نیزہ باز کے طور پر نامزد کیا گیا ہے جس نے عبید اللہ ابن عمر کو قتل کیا تھا، جس کی مختلف قسمیں الاشتر یا خود علی کو قرار دیتے ہیں {حوالہ: مروج الذہب صفحہ 676}۔"
  tr: "Ali'nin Siffin'deki yoldaşları arasındaydı. Übeydullah ibn Ömer'i bıçaklayıp öldürenin kendisi olduğu söylenir, hatta el-Aştar el-Nakha'i bile denir ve Ali'nin kendisinin ona bir darbe vurup demiri kesip boşluğunun etiyle karıştığı söylenir {atıf:Muruj-al-Dhahab, s. 676}."
  id: "Ia termasuk di antara sahabat Ali di Siffin. Dikatakan bahwa dialah yang menikam Ubayd Allah ibn Umar dan membunuhnya, dan dikatakan bahkan al-Ashtar al-Nakha'i, dan dikatakan bahwa Ali sendiri memukulnya dengan pukulan yang memotong besi hingga bercampur dengan daging rongganya {cite:muruj-al-dhahab, hlm. 676}."
