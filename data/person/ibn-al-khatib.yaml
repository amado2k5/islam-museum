label: { ar: "لسان الدين ابن الخطيب" }
summary:
  ar: "وزير ابن الأحمر صاحب الأندلس وكاتبه؛ وفد على سلطان بني مرين بتلمسان نازعاً إليه عن سلطانه ابن الأحمر فأكرم مثواه وأرغد عيشه في الجراية والأقطاع، ولما نكبته الدولة بعث إلى ابن خلدون من محبسه مستصرخاً به فخاطب في شأنه أهل الدولة فلم تنجح سعايته وقتل ابن الخطيب بمحبسه، وكان قد أوقف وزير ابن الأحمر قبل ذلك فأنشد السلطان قصيدته {cite:tarikh-ibn-khaldun-ibar p. 2012-2016}."
  en: "Lisan al-Din Ibn al-Khatib, vizier and poet of Granada's Ibn al-Ahmar; envoy to the Marinid sultan at Tlemcen, later imprisoned and killed in his cell — Ibn Khaldun records from his own testimony the vizier's appeal to him from prison {cite:tarikh-ibn-khaldun-ibar p. 2012-2016}."
