id: person/ibn-al-khatib
class: person
label: { ar: "لسان الدين ابن الخطيب" }
summary:
  ar: "لسان الدين ابن الخطيب، وزير ابن الأحمر صاحب الأندلس وكاتبه؛ نزل غرناطة فاستعمله السلطان أبو الحجاج في الخطابة بجامعه بالحمراء، ثم استدعاه السلطان أبو عنان المريني سنة 754هـ فنظمه في أكابر أهل مجلسه وبعثه إلى تونس عام ملكها 758هـ ليخطب له ابنة السلطان، واعتقله بقسنطينة فأطلق بين يدي مهلكه، واستقر بعدها بوزارة غرناطة؛ وفد على سلطان بني مرين بتلمسان نازعاً إليه عن سلطانه ابن الأحمر فأكرم مثواه، ثم أجاز إلى المشرق فنفقت بضائعه بالقاهرة مرشحاً لقضاء المالكية ملازماً للتدريس إلى أن هلك سنة 781هـ؛ ولما نكبته الدولة بعث إلى ابن خلدون من محبسه مستصرخاً به فخاطب في شأنه أهل الدولة فلم تنجح سعايته وقتل ابن الخطيب بمحبسه {cite:tarikh-ibn-khaldun-ibar p. 2012-2016, 2054-2055}. وعند المقري وحكم على الزجال ابن قزمان بأنه آية الطريقة الزجلية المعجزة وحجتها البالغة وفارسها المعلم والمبتدئ فيها والمتمم {cite:nafh-tib-maqqari p. 28}"
  en: "Lisan al-Din Ibn al-Khatib, vizier and writer of Granada's Ibn al-Ahmar; he preached at the Alhambra congregational mosque under Abu al-Hajjaj, was summoned by Sultan Abu Inan in 754 AH and sent to Tunis in 758 to ask for the sultan's daughter, imprisoned at Constantine and freed before Abu Inan's death, then held Granada's vizierate; after his falls he reached Cairo where his wares sold — candidate for the Maliki bench, bound to teaching — dying in 781 AH; from his cell he appealed to Ibn Khaldun, whose intercession failed, and he was killed in prison {cite:tarikh-ibn-khaldun-ibar p. 2012-2016, 2054-2055}."
  es: "Lisan al-Din Ibn al-Khatib, visir y escritor del Ibn al-Ahmar de Granada; predicó en la mezquita congregacional de la Alhambra bajo el mandato de Abu al-Hajjaj, fue convocado por el sultán Abu Inan en el año 754 de la Hégira y enviado a Túnez en el año 758 para solicitar a la hija del sultán, fue encarcelado en Constantina y liberado antes de la muerte de Abu Inan, luego ocupó el visirato de Granada; después de su caída llegó a El Cairo donde vendió sus mercancías —candidato al tribunal malikí, obligado a enseñar— muriendo en el año 781 de la Hégira; desde su celda apeló a Ibn Khaldun, cuya intercesión fracasó, y fue asesinado en prisión {cite:tarikh-ibn-khaldun-ibar p. 2012-2016, 2054-2055}."
  fr: "Lisan al-Din Ibn al-Khatib, vizir et scribe de Grenade, auteur de l'ouvrage Ibn al-Ahmar, prêcha à la mosquée du vendredi de l'Alhambra sous l'autorité d'Abu al-Hajjaj. Convoqué par le sultan Abu Inan en 754 AH, il fut envoyé à Tunis en 758 pour demander la main de la fille du sultan. Emprisonné à Constantinople, il fut libéré avant la mort d'Abu Inan, puis occupa le vizirat de Grenade. Après sa chute, il gagna Le Caire où il vendit ses marchandises. Candidat au banc malikite, il se consacra à l'enseignement et mourut en 781 AH. De sa cellule, il implora Ibn Khaldun, dont l'intercession resta vaine, et il fut tué en prison."
  ur: "لسان الدین ابن الخطیب، وزیر اور غرناطہ کے مصنف ابن الاحمر؛ اس نے ابو الحجاج کے ماتحت الہمبرا اجتماعی مسجد میں تبلیغ کی، 754 ہجری میں سلطان ابو انان نے اسے بلوایا اور 758 میں سلطان کی بیٹی کا مطالبہ کرنے کے لیے تیونس بھیجا، قسطنطنیہ میں قید کیا گیا اور ابو انان کی موت سے پہلے رہا کر دیا گیا، پھر غرناطہ کا وزیر بنا۔ زوال کے بعد وہ قاہرہ پہنچا جہاں اس کا سامان فروخت ہوا - مالکی بنچ کے امیدوار، درس و تدریس کے پابند - 781 ہجری میں انتقال کر گئے۔ اپنی کوٹھڑی سے اس نے ابن خلدون سے درخواست کی جس کی شفاعت ناکام رہی اور وہ جیل میں مارا گیا۔ 2012-2016، 2054-2055}۔"
  tr: "Lisan al-Din İbn el-Khatib, el-Endülüs'ün hükümdarı İbn el-Ahmar'ın bakanı ve katibi olarak Granada'ya yerleşti; burada Sultan Ebu el-Haccac onu Alhamra'daki camisinde vaaz vermesi için görevlendirdi. Sultan Ebu Anan el-Marini, 754 Hicri yılında onu çağırdı, meclisinin yaşlıları arasına yerleştirdi ve 758 Hicri yılında Tunus'a sultanın kızına evlenme teklif etmesi için gönderdi. Onu Konstantin'de tutukladı, ölümünden önce serbest bıraktı ve ardından Granada vezirliğine yerleşti. Tlemcen'de Banu Marinid Sultanı'nı ziyaret etti, sultanı İbn el-Ahmar'ı istirahat yeri olarak bıraktı. Daha sonra doğuya izin verdi ve malları Kahire'de aday olarak harcandı 781 Hicri yılında ölene kadar Maliki yargıcı olarak öğretmenlik yapmaya devam etti; devlet onu cezaevinden İbn Haldun'a göndererek devlet halkına kendisiyle ilgili bir çağrı gönderdi, ancak çabaları başarısız oldu ve İbn el-Hatib hapishanesinde öldürüldü {atıf:Tarih-ibn-haldun-ibar s. 2012-2016, 2054-2055}. El-Makri ve İbn Kazman'a göre, zajal, zajal tarikatının mucizevi ayeti, derin kanıtı, ustası, başlangıç noktası ve eksiksiz olarak kabul edilir {cite:nafh-tib-maqqari, s. 28}"
  id: "Lisan al-Din Ibn al-Khatib, menteri dan juru tulis Ibn al-Ahmar, penguasa al-Andalus, menetap di Granada, di mana Sultan Abu al-Hajjaj menugaskannya untuk berkhotbah di masjidnya di Alhamra. Sultan Abu Anan al-Marini memanggilnya pada tahun 754 H, mengaturnya di antara para tetua dewannya, dan mengirimnya ke Tunis pada tahun pemerintahannya pada 758 H untuk melamar putri sultan. Dia menangkapnya di Konstantinus dan membebaskannya sebelum kematiannya, lalu menetap di wazir Granada. Dia mengunjungi Sultan Banu Marinid di Tlemcen, menyerahkan sultannya Ibn al-Ahmar, yang menghormati tempat peristirahatannya. Dia kemudian memberikan izin kepada Timur, dan hartanya dibelanjakan di Kairo sebagai calon Ia terus mengajar sebagai hakim Maliki hingga wafat pada tahun 781 H; ketika negara menyerangnya, ia mengirim pesan kepada Ibn Khaldun dari penjaranya untuk memohon kepada rakyat negara mengenai dirinya, namun usahanya gagal, dan Ibn al-Khatib dibunuh di penjaranya {cite:History-ibn-khaldun-ibar hlm. 2012-2016, 2054-2055}. Menurut Al-Maqri dan Ibn Qazman, zajal dianggap sebagai ayat ajaib dari tarekat zajal, bukti mendalamnya, gurunya, pemula, dan lengkap {sitasi:nafh-tib-maqqari, hlm. 28}"
