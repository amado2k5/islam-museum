id: person/ibn-al-khatib
class: person
label: { ar: "لسان الدين ابن الخطيب" }
summary:
  ar: "لسان الدين ابن الخطيب، وزير ابن الأحمر صاحب الأندلس وكاتبه؛ نزل غرناطة فاستعمله السلطان أبو الحجاج في الخطابة بجامعه بالحمراء، ثم استدعاه السلطان أبو عنان المريني سنة 754هـ فنظمه في أكابر أهل مجلسه وبعثه إلى تونس عام ملكها 758هـ ليخطب له ابنة السلطان، واعتقله بقسنطينة فأطلق بين يدي مهلكه، واستقر بعدها بوزارة غرناطة؛ وفد على سلطان بني مرين بتلمسان نازعاً إليه عن سلطانه ابن الأحمر فأكرم مثواه، ثم أجاز إلى المشرق فنفقت بضائعه بالقاهرة مرشحاً لقضاء المالكية ملازماً للتدريس إلى أن هلك سنة 781هـ؛ ولما نكبته الدولة بعث إلى ابن خلدون من محبسه مستصرخاً به فخاطب في شأنه أهل الدولة فلم تنجح سعايته وقتل ابن الخطيب بمحبسه {cite:tarikh-ibn-khaldun-ibar p. 2012-2016, 2054-2055}. وعند المقري وحكم على الزجال ابن قزمان بأنه آية الطريقة الزجلية المعجزة وحجتها البالغة وفارسها المعلم والمبتدئ فيها والمتمم {cite:nafh-tib-maqqari p. 28}"
  en: "Lisan al-Din Ibn al-Khatib, vizier and writer of Granada's Ibn al-Ahmar; he preached at the Alhambra congregational mosque under Abu al-Hajjaj, was summoned by Sultan Abu Inan in 754 AH and sent to Tunis in 758 to ask for the sultan's daughter, imprisoned at Constantine and freed before Abu Inan's death, then held Granada's vizierate; after his falls he reached Cairo where his wares sold — candidate for the Maliki bench, bound to teaching — dying in 781 AH; from his cell he appealed to Ibn Khaldun, whose intercession failed, and he was killed in prison {cite:tarikh-ibn-khaldun-ibar p. 2012-2016, 2054-2055}."
