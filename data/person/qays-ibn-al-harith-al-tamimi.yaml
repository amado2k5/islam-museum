summary:
  ar: "من رجال وفد بني تميم على النبي سنة 9هـ كما سمّاه ابن إسحاق، ولا يذكر عنه أكثر من اسمه؛ أسلم الوفد بعد المفاخرة."
  en: "One of the men of the Banu Tamim delegation to the Prophet in 9 AH, named by Ibn Ishaq without further detail; the delegation embraced Islam after the contest."
  ur: "9 ہجری میں نبی کے پاس بنو تمیم وفد کے آدمیوں میں سے، ابن اسحاق نے بغیر تفصیل نام لیا۔"
  es: "Uno de los hombres de la delegación de Banu Tamim que se reunió con el Profeta en el año 9 de la Hégira, mencionado por Ibn Ishaq sin dar más detalles; la delegación se convirtió al Islam después del encuentro."
  fr: "Un des hommes de la délégation des Banu Tamim auprès du Prophète en 9 AH, nommé par Ibn Ishaq sans plus de détails; la délégation embrassa l'islam après le concours."
  tr: "İbn İshak'ın dediği gibi, 9 Hicri yılında Peygamber'e giden Banu Tamim heyetinin adamlarındandı ve sadece adı anılır; heyet övünerek İslam'ı benimsedi."
  id: "Ia termasuk di antara para anggota delegasi Banu Tamim kepada Nabi pada tahun 9 H, seperti yang dipanggil Ibn Ishaq, dan hanya namanya yang disebutkan tentang dirinya; delegasi tersebut memeluk Islam setelah membanggakan diri."
