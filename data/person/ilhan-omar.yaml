summary:
  ar: "سياسية أمريكية من الحزب الديمقراطي، وُلدت في مقديشو سنة 1982، وفرّت أسرتها من الحرب الأهلية الصومالية فقضت أربع سنوات في مخيم للاجئين في كينيا قبل أن تحصل على اللجوء في الولايات المتحدة سنة 1995، فأصبحت سنة 2016 أول مشرّعة صومالية أمريكية في البلاد في مجلس نواب منيسوتا، ثم انتُخبت سنة 2018 لمجلس النواب الأمريكي عن الدائرة الخامسة في منيسوتا، فكانت مع رشيدة طليب أول مسلمتين في الكونغرس، وهي نائب رئيس الكتلة التقدمية وناقدة بارزة لسياسات إسرائيل ولجماعات الضغط المؤيدة لها."
  en: "American Democratic politician, born in Mogadishu in 1982. Her family fled the Somali Civil War, spent four years in a refugee camp in Kenya, and received asylum in the United States in 1995. In 2016 she became the first Somali-American legislator in the country in the Minnesota House; in 2018 she was elected to the U.S. House for Minnesota's 5th district, becoming with Rashida Tlaib one of the first two Muslim women in Congress. She is deputy chair of the Congressional Progressive Caucus and a prominent critic of Israel's policies and of pro-Israel lobbies."
  ur: "امریکی ڈیموکریٹ سیاست دان، جو 1982 میں موغادیشو میں پیدا ہوئیں۔ ان کا خاندان صومالی خانہ جنگی سے فرار ہو کر کینیا کے ایک پناہ گزین کیمپ میں چار سال رہا اور 1995 میں امریکہ میں پناہ ملی۔ 2016 میں وہ منی سوٹا کے ایوان میں ملک کی پہلی صومالی نژاد امریکی قانون ساز بنیں، اور 2018 میں امریکی ایوان نمائندگان کے لیے منتخب ہو کر رشیدہ طلیب کے ساتھ کانگریس کی پہلی دو مسلم خواتین میں شامل ہوئیں۔"
