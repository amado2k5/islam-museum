died: { edtf: "0961~", hijri: "0350-01", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في المحرم سنة خمسين وثلاثمائة وعاش تسعين سنة {cite:shadharat-dhahab p. 2}." }
summary:
  ar: "أبو بكر أحمد بن كامل بن خلف بن شجرة القاضي البغدادي، تلميذ محمد بن جرير الطبري وصاحب التصانيف في الفنون؛ ولي قضاء الكوفة وحدّث عن محمد بن سعد العوفي وطائفة، وعاش تسعين سنة؛ قال الدارقطني ربما حدّث من حفظه بما ليس في كتابه أهلكه العجب وكان يختار لنفسه ولا يقلد أحداً، وقال ابن رزقويه: لم تر عيناي مثله {cite:shadharat-dhahab p. 2}."
  en: "Abu Bakr Ahmad b. Kamil b. Khalaf al-Qadi al-Baghdadi (d. Muharram 350, aged 90) — al-Tabari's student, qadi of Kufa, author across the disciplines {cite:shadharat-dhahab p. 2}."
  fr: "Abu Bakr Ahmad b. Kamil b. Khalaf al-Qadi al-Baghdadi (mort en muharram 350 H, à 90 ans), élève d'al-Tabari, cadi de Kufa et auteur dans de nombreuses disciplines {cite:shadharat-dhahab p. 2}."
  es: "Abu Bakr Ahmad b. Kamil b. Khalaf al-Qadi al-Baghdadi (m. Muharram 350, 90 años) - alumno de al-Tabari, cadí de Kufa, autor en todas las disciplinas {cita: shadharat-dhahab p. 2}."
  ur: "ابوبکر احمد بی۔ کامل بی۔ خلف القادی البغدادی ⁦(متوفی 350 محرم، عمر 90)⁩ - الطبری کے طالب علم، کوفہ کے قاضی، تمام شعبوں کے مصنف 2}۔"
  tr: "Muhammed ibn Cerir el-Taberi'nin öğrencisi ve çeşitli ilimlerde eserler yazmış olan Ebu Bekir Ahmed ibn Kamil ibn Halef ibn Şecar el-Kadı el-Bağdadi; Kufe'de kadılık yapmış, Muhammed ibn Saad el-Evfi ve bir grup insandan rivayetlerde bulunmuş ve doksan yıl yaşamıştır. El-Darakutni şöyle demiştir: Bazen kitabında olmayan şeyleri ezberden rivayet ederdi ve kibir onu mahvetti. Kendi yolunu seçerdi ve kimseyi taklit etmezdi. İbn Rızkaveyh şöyle demiştir: Gözlerim onun gibisini görmedi."
  id: "Abu Bakr Ahmad ibn Kamil ibn Khalaf ibn Shajara al-Qadi al-Baghdadi, seorang murid Muhammad ibn Jarir al-Tabari dan penulis karya-karya dalam berbagai bidang ilmu; beliau memegang jabatan hakim Kufa dan meriwayatkan hadis dari Muhammad ibn Saad al-Awfi dan sekelompok orang, dan beliau hidup selama sembilan puluh tahun; al-Daraqutni berkata: Beliau terkadang meriwayatkan dari hafalan apa yang tidak ada dalam bukunya, dan kesombongan menghancurkannya. Beliau biasa memilih sendiri dan tidak meniru siapa pun. Ibn Rizqawayh berkata: Mataku belum pernah melihat orang seperti beliau."
