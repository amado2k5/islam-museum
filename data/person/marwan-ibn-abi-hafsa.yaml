summary:
  ar: "شاعر، أخذ من معن بن زائدة مائة ألف درهم على قوله فيه جبل تلوذ به نزار كلها، فلما استأذن على المهدي أبى إذنه وقال منافق كذاب حتى كلمه الحسن بن قحطبة فدخل فأنشده يا ابن الذي ورث النبي محمداً دون الأقارب من ذوي الأرحام فرضي عنه وأجازه {cite:muruj-al-dhahab p. 275-312}."
  en: "The panegyrist bought by Ma'n for a hundred thousand — barred as a hypocrite until his 'son of the Prophet's heir' ode won al-Mahdi {cite:muruj-al-dhahab p. 275-312}."
  es: "El panegirista comprado por Ma'n por cien mil —excluido como hipócrita hasta que su oda al \"heredero del hijo del Profeta\" ganó a al-Mahdi {cite:muruj-al-dhahab p. 275-312}."
  fr: "Le panégyriste acheté par Ma'n pour cent mille — interdit comme hypocrite jusqu'à ce que son ode « fils de l'héritier du Prophète » gagne al-Mahdi {cite:muruj-al-dhahab p. 275-312}."
  ur: "معن کی طرف سے ایک لاکھ میں خریدا گیا پانگرسٹ - اس وقت تک منافق کے طور پر روک دیا گیا جب تک کہ اس کے 'وارث رسول کے بیٹے' نے المہدی جیت نہ لیا {حوالہ: مروج الذہب ص۔ 275-312}۔"
  tr: "Nizar'ın sığınacağı bir dağ olduğunu söylediği için Ma'n bin Zaidah'dan yüz bin dirhem alan bir şairdi. Al-Mahdi'den izin istediğinde izin vermedi ve onu münafık ve yalancı olarak nitelendirdi; ta ki Hasan ibn Kahtabah ona konuşana kadar içeri girip şöyle dedi: 'Ey Peygamber Muhammed'i akrabalarına miras alan kişinin oğlu, ona borç verdim ve izin verdim.' {atıf:Muruj-al-Dhahab, s. 275-312}."
  id: "Seorang penyair yang menerima seratus ribu dirham dari Ma'n ibn Zaidah karena mengatakan ada sebuah gunung tempat Nizar berlindung. Ketika dia meminta izin dari al-Mahdi, dia menolak izin itu dan menyebutnya munafik dan pembohong, sampai Hasan ibn Qahtabah berbicara kepadanya dan dia masuk dan mengucapkan, 'Wahai putra yang mewarisi Nabi Muhammad kepada kerabat keluarga, aku mengizinkannya dan mengizinkannya.' {cite:muruj-al-dhahab, hlm. 275-312}."
