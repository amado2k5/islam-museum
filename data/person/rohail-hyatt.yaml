summary:
  ar: "منتج تسجيلات وعازف كيبورد وملحن باكستاني (وُلد سنة 1966) من راولبندي؛ أسّس فرقة «فايتل ساينز» سنة 1986 ولحّن «دل دل باكستان»، وبعد انتهاء الفرقة أسّس «بيراميد برودكشنز» ووضع موسيقى فيلم «خدا کے لیے» (2007)، وبوصفه المنتج المؤسس لـ«كوك ستوديو باكستان» منذ 2008 أعاد تشكيل الموسيقى الشعبية في بلاده؛ نال وسام هلال الامتياز."
  en: "Pakistani record producer, keyboardist and composer, born in 1966 at Rawalpindi. He founded the band Vital Signs in 1986 and composed 'Dil Dil Pakistan'; after the band ended he founded Pyramid Productions, composed the soundtrack of the film Khuda Kay Liye (2007), and as the founding producer of Coke Studio Pakistan from 2008 reshaped his country's popular music. He received the Hilal-e-Imtiaz."
  ur: "پاکستانی ریکارڈ پروڈیوسر، کی بورڈ نواز اور موسیقار (پیدائش 1966) جو راولپنڈی سے تعلق رکھتے ہیں؛ 1986 میں وائٹل سائنز کی بنیاد رکھی اور «دل دل پاکستان» ترتیب دیا، بینڈ کے خاتمے کے بعد پیرامڈ پروڈکشنز قائم کی، فلم «خدا کے لیے» (2007) کی موسیقی دی، اور 2008 سے کوک اسٹوڈیو پاکستان کے بانی پروڈیوسر کے طور پر ملکی مقبول موسیقی کو نئی شکل دی؛ ہلالِ امتیاز سے نوازے گئے۔"
