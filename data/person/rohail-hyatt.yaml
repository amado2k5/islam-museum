summary:
  ar: "منتج تسجيلات وعازف كيبورد وملحن باكستاني ⁦(وُلد سنة 1966)⁩ من راولبندي؛ أسّس فرقة «فايتل ساينز» سنة 1986 ولحّن «دل دل باكستان»، وبعد انتهاء الفرقة أسّس «بيراميد برودكشنز» ووضع موسيقى فيلم «خدا کے لیے» (2007)، وبوصفه المنتج المؤسس لـ«كوك ستوديو باكستان» منذ 2008 أعاد تشكيل الموسيقى الشعبية في بلاده؛ نال وسام هلال الامتياز."
  en: "Pakistani record producer, keyboardist and composer, born in 1966 at Rawalpindi. He founded the band Vital Signs in 1986 and composed 'Dil Dil Pakistan'; after the band ended he founded Pyramid Productions, composed the soundtrack of the film Khuda Kay Liye (2007), and as the founding producer of Coke Studio Pakistan from 2008 reshaped his country's popular music. He received the Hilal-e-Imtiaz."
  ur: "پاکستانی ریکارڈ پروڈیوسر، کی بورڈ نواز اور موسیقار ⁦(پیدائش 1966)⁩ جو راولپنڈی سے تعلق رکھتے ہیں؛ 1986 میں وائٹل سائنز کی بنیاد رکھی اور «دل دل پاکستان» ترتیب دیا، بینڈ کے خاتمے کے بعد پیرامڈ پروڈکشنز قائم کی، فلم «خدا کے لیے» (2007) کی موسیقی دی، اور 2008 سے کوک اسٹوڈیو پاکستان کے بانی پروڈیوسر کے طور پر ملکی مقبول موسیقی کو نئی شکل دی؛ ہلالِ امتیاز سے نوازے گئے۔"
  es: "Productor discográfico, tecladista y compositor pakistaní, nacido en 1966 en Rawalpindi. Fundó la banda Vital Signs en 1986 y compuso «Dil Dil Pakistan». Tras la disolución de la banda, fundó Pyramid Productions, compuso la banda sonora de la película Khuda Kay Liye (2007) y, como productor fundador de Coke Studio Pakistan desde 2008, transformó la música popular de su país. Recibió la condecoración Hilal-e-Imtiaz."
  fr: "Producteur de disques, claviériste et compositeur pakistanais, né en 1966 à Rawalpindi. Il fonde le groupe Vital Signs en 1986 et compose le titre « Dil Dil Pakistan ». Après la séparation du groupe, il crée Pyramid Productions, compose la bande originale du film Khuda Kay Liye (2007) et, en tant que producteur fondateur de Coke Studio Pakistan à partir de 2008, contribue à redéfinir la musique populaire de son pays. Il est décoré de la Hilal-e-Imtiaz."
  tr: "Pakistanlı bir plak yapımcısı, klavyeci ve besteci (1966 doğumlu) Rawalpindi'den; 1986'da Fight Signs grubunu kurdu ve \"Dil Dil Pakistan\"ı besteledi. Grup dağıldıktan sonra Pyramid Productions'ı kurdu ve \"Khuda Li Li\" (2007) filminin müziklerini besteledi. 2008'den beri \"Coke Studio Pakistan\"ın kurucu yapımcısı olarak ülkesinde halk müziğini yeniden şekillendirdi ve Mükemmellik Hilal'ı ile ödüllendirildi."
  id: "Seorang produser rekaman, pemain keyboard, dan komposer asal Pakistan (lahir 1966) dari Rawalpindi; ia mendirikan band Fight Signs pada tahun 1986 dan menggubah \"Dil Dil Pakistan.\" Setelah band tersebut bubar, ia mendirikan Pyramid Productions dan menggubah musik untuk film \"Khuda Li Li\" (2007). Sebagai produser pendiri \"Coke Studio Pakistan\" sejak 2008, ia membentuk ulang musik rakyat di negaranya dan dianugerahi Hilal of Excellence."
