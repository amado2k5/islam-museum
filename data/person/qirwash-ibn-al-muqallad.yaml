id: person/qirwash-ibn-al-muqallad
class: person
label: { ar: "قرواش بن المقلد العقيلي", en: "Qirwash ibn al-Muqallad al-Uqayli" }
summary:
  ar: "أبو المنيّع قرواش بن المقلد أمير بني عقيل؛ جلس له القادر سنة ست وتسعين وثلثمائة ولقبه معتمد الدولة ثم تفرد بالإمارة وكانت له بلاد الموصل والكوفة وشط الفرات واستنزل علي بن مزيد عما كان إليه من كوثى ونهر الملك؛ وكان الحاكم صاحب مصر يكاتبه ويستميله فأقام له الدعوة بالموصل والكوفة ثم اعتذر إلى القادر وسأله العفو؛ ودخل الغز إلى الموصل فنهبوا من داره ما يزيد على مائة ألف دينار، وتوفي سنة أربع وأربعين وأربعمائة وقام بالأمر بعده قريش بن بدران بن المقلد {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  en: "Mu'tamad al-Dawla — the Uqaylid amir seated by al-Qadir in 396 who ruled Mosul, Kufa and the Euphrates; the Fatimid al-Hakim courted him into proclaiming the Ismaili da'wa at Mosul and Kufa before he begged the caliph's pardon; the Ghuzz plundered over a hundred thousand dinars from his palace; died 444, succeeded by Quraysh ibn Badran {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
