summary:
  ar: مغنية بوب أفغانية وُلدت في كابل سنة 1985 ونشأت في المنفى؛ عادت لتغني وتقدّم برامج المواهب، واشتهرت بأغاني مثل «بانوي آهانين» وبمناصرتها لحقوق المرأة، وغادرت كابل مع سقوطها سنة 2021.
  en: Afghan pop singer born in Kabul in 1985 and raised in exile; she returned to perform and judge televised talent shows, became known for songs such as Banoo-ye Ahanin and for championing Afghan women,
    and left Kabul as it fell in 2021.
  ur: افغان پاپ گلوکارہ جو 1985 میں کابل میں پیدا ہوئی اور جلاوطنی میں پلی؛ واپس آ کر پرفارم کی اور ٹیلنٹ شوز میں جج رہی، Banoo-ye Ahanin جیسے نغموں اور افغان خواتین کی وکالت سے مشہور، اور 2021 میں کابل
    گرنے پر رخصت ہوئی۔
  es: "Cantante pop afgana nacida en Kabul en 1985 y criada en el exilio; regresó para actuar y ser jurado en programas de talentos televisados, se hizo conocida por canciones como Banoo-ye Ahanin y por defender a las mujeres afganas, y abandonó Kabul cuando cayó en 2021."
  fr: "Chanteuse pop afghane née à Kaboul en 1985 et élevée en exil; elle est revenue se produire sur scène et participer à des émissions de télé-crochet, s'est fait connaître pour des chansons comme Banoo-ye Ahanin et pour son engagement en faveur des femmes afghanes, et a quitté Kaboul lors de sa chute en 2021."
  tr: "1985'te Kabil'de doğmuş ve sürgünde büyüyen Afgan pop şarkıcısı olan Sherly, şarkı söylemek ve yetenek gösterileri sunmak için geri döndü, \"Banwi Ahanin\" gibi şarkılarıyla ve kadın hakları savunuculuğuyla ünlendi ve 2021'de düşüşünün ardından Kabil'den ayrıldı."
  id: "Seorang penyanyi pop Afghanistan yang lahir di Kabul pada tahun 1985 dan dibesarkan di pengasingan; ia kembali untuk bernyanyi dan menjadi pembawa acara acara bakat, menjadi terkenal lewat lagu seperti \"Banwi Ahanin\" dan advokasinya untuk hak-hak perempuan, serta meninggalkan Kabul setelah jatuhnya pada tahun 2021."
