label:
  ar: "أبو عبيد الله معاوية الأشعري"
  en: "Mu'awiya ibn Ubaydallah al-Ash'ari"
  es: "Mu'awiya ibn Ubaydallah al-Ash'ari"
  fr: "Mu'awiya ibn Ubaydallah al-Ash'ari"
roles: [vizier]
gender: male
summary:
  ar: "معاوية بن عبيد الله بن يسار الأشعري بالولاء، أبو عبيد الله، أصله من طبرية، كاتب المهدي العباسي ووزيره، وأول من صنف كتابا في الخراج، عزله المهدي ومات ببغداد سنة 170 هـ الموافقة 786 م ودفن في مقبرة قريش."
  en: "Mu'awiya ibn Ubaydallah ibn Yasar, al-Ash'ari by clientage, Abu Ubaydallah, of Tiberias; secretary and vizier of the Abbasid al-Mahdi and, per al-Zirikli, the first to write a book on the land tax; dismissed by al-Mahdi, he died in Baghdad in 170 AH (786) and was buried in the Quraysh cemetery."
  es: "Mu'awiya ibn Ubaydallah ibn Yasar, al-Ash'ari por clientela, Abu Ubaydallah, de Tiberíades; secretario y visir del abasí al-Mahdi y, según al-Zirikli, el primero en escribir un libro sobre el impuesto sobre la tierra; destituido por al-Mahdi, murió en Bagdad en el año 170 AH (786) y fue enterrado en el cementerio de Quraysh."
  fr: "Mu'awiya ibn Ubaydallah ibn Yasar, al-Ash'ari par clientélisme, Abu Ubaydallah, de Tibériade; secrétaire et vizir de l'Abbasside al-Mahdi et, selon al-Zirikli, le premier à écrire un livre sur l'impôt foncier; renvoyé par al-Mahdi, il mourut à Bagdad en 170 AH (786) et fut enterré dans le cimetière de Quraysh."
