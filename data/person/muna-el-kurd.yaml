summary:
  ar: "صحفية وناشطة فلسطينية (وُلدت في حي الشيخ جراح بالقدس سنة 1998)، درست الإعلام في جامعة بيرزيت. برزت عالمياً سنة 2021 في حملة «أنقذوا الشيخ جراح» مع شقيقها التوأم محمد، وأُدرجا معاً في قائمة تايم 100 لأكثر مئة شخصية تأثيراً في العالم."
  en: "Palestinian journalist and activist (born 1998 in Sheikh Jarrah, Jerusalem) who studied media at Birzeit University. She rose to world attention in 2021 in the 'Save Sheikh Jarrah' campaign alongside her twin brother Mohammed, with whom she was named to the Time 100."
