summary:
  ar: "شاعر وعالم صوفي فارسي (1844–1930) وُلد في بيشاور ونشأ يتيمًا بعد مقتل أبيه في الحرب الإنجليزية الفارسية، ودرس في كابل وغزني ومشهد وسبزوار، ثم أقام في طهران. خلّف ديوانًا بنحو عشرين ألف بيت وملحمة «قيصرنامه» في مدح ألمانيا أثناء الحرب العالمية الأولى، وعُرف بنقده اللاذع للسياسة البريطانية."
  en: "Persian Sufi scholar and poet (1844–1930), born at Peshawar and orphaned when his father was killed in the Anglo-Persian War. He studied at Kabul, Ghazni, Mashhad and Sabzevar and settled in Tehran. His divan holds some 20,000 couplets, and his Qaysarnama praised Germany in the First World War; he was known for fierce criticism of British policy."
  ur: "فارسی صوفی عالم اور شاعر ⁦(1844ء–1930ء)⁩ جو پشاور میں پیدا ہوئے؛ ان کے والد اینگلو فارسی جنگ میں مارے گئے۔ انھوں نے کابل، غزنی، مشہد اور سبزوار میں تعلیم حاصل کی اور تہران میں سکونت اختیار کی۔ ان کے دیوان میں تقریباً بیس ہزار اشعار ہیں اور «قیصرنامہ» میں انھوں نے پہلی جنگِ عظیم میں جرمنی کی مدح کی؛ وہ برطانوی پالیسی کے سخت ناقد تھے۔"
