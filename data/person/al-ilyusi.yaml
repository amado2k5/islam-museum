summary:
  ar: "أبو محمد عبد الله بن محمد الإيليوسي نسبة إلى بطليوس مدينة بالأندلس؛ كان عالماً بالآداب واللغات متبحراً في معرفتها وإتقانها، سكن مدينة بلنسية وكان الناس يجتمعون إليه ويقرؤون عليه ويقتبسون منه وكان حسن التعليم جيد التفهيم ثقة ضابطاً؛ ألّف كتباً نافعة منها المثلّث في مجلدين والاقتضاب في شرح أدب الكتاب وشرح سقط الزند لأبي العلاء المعري وكتاب في الحروف الخمسة وكتاب الحلل في شرح أبيات الجمل وكتاب التنبيه على الأسباب الموجبة لاختلاف الأمة وشرح الموطأ، وقيل إنه لم يخرج من المغرب وكل شيء تكلم فيه ففي غاية الجودة؛ ومولده سنة أربع وأربعين وأربعمائة بمدينة بطليوس وتوفي في منتصف رجب سنة إحدى وعشرين وخمسمائة بمدينة بلنسية {cite:shadharat-dhahab p. 544-545}."
  en: "Abu Muhammad Abdallah ibn Muhammad al-Ilyusi of Badajoz in al-Andalus; a profound master of adab and the languages who settled at Valencia where people gathered to read under him — a trustworthy, precise teacher; his works include the two-volume al-Muthallath, al-Iqtidab on the adab of the kuttab, a commentary on al-Ma'arri's Saqt al-Zand (said better than Abu al-Ala's own), a book on the five letters, al-Hilal on the Jummal verses, al-Tanbih on the causes of the umma's divergence and a commentary on the Muwatta — and it was said he never left the Maghreb, everything he touched being of the finest quality; b. 444 at Badajoz, d. mid-Rajab 521 at Valencia {cite:shadharat-dhahab p. 544-545}."
  es: "Abu Muhammad Abdallah ibn Muhammad al-Ilyusi de Badajoz en al-Ándalus; un maestro profundo de adab y de las lenguas que se estableció en Valencia donde la gente se reunía para estudiar con él; un maestro confiable y preciso; sus obras incluyen los dos volúmenes de al-Muthallath, al-Iqtidab sobre el adab del kuttab, un comentario sobre el Saqt al-Zand de al-Ma'arri (dicho mejor que el propio Abu al-Ala), un libro sobre las cinco letras, al-Hilal sobre los versículos de Jummal, al-Tanbih sobre las causas de la divergencia de la umma y un comentario sobre el Muwatta; y se decía que nunca abandonó el Magreb, pues todo lo que tocaba era de la más alta calidad; n. 444 en Badajoz, m. mediados de Rajab 521 en Valencia {cite:shadharat-dhahab p. 544-545}."
  fr: "Abu Muhammad Abdallah ibn Muhammad al-Ilyusi de Badajoz en al-Andalus; maître érudit de l'adab et des langues, il s'établit à Valence où l'on se rassemblait pour étudier sous sa direction. Enseignant fiable et précis, il est l'auteur de plusieurs ouvrages, dont al-Muthallath en deux volumes, al-Iqtidab sur l'adab du kuttab, un commentaire du Saqt al-Zand d'al-Ma'arri (considéré comme supérieur à celui d'Abu al-Ala), un livre sur les cinq lettres, al-Hilal sur les versets du Jummal, al-Tanbih sur les causes de la divergence de l'umma et un commentaire du Muwatta. On dit qu'il ne quitta jamais le Maghreb, et que tout ce qu'il entreprenait était d'une qualité exceptionnelle. Né en 444 à Badajoz, il mourut au milieu du Rajab 521 à Valence."
