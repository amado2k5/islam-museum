  ar: "سيد بني عامر بن صعصعة وفارسهم وشاعرهم، وهو الذي غدر بأصحاب بئر معونة؛ تآمر مع أربد بن قيس على الفتك بالنبي داخل وفد قومه سنة 9هـ فعصمه الله، ومات بعدها بغدة في عنقه. وعدّه عمرو بن معد يكرب عند عمر في حرّي العرب الذين يخشى لقاءهم مع عيينة التميمي وعنترة وسليك المناقب {cite:muruj-al-dhahab p. 621}"
