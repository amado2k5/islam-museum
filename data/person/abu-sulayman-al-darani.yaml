label: { ar: "أبو سليمان الداراني", en: "Abu Sulayman al-Darani", ur: "ابو سلیمان دارانی" }
gender: male
roles: [scholar, mystic]
summary:
  ar: "عبد الرحمن بن أحمد بن عطية العنسي، أبو سليمان الداراني، من كبار زهاد الشام نسبة إلى داريا من قرى دمشق؛ لقي سفيان الثوري واشتغل بالتعبد عن الرواية، وتُروى أقواله في الجوع والخوف والرضا عن تلميذه أحمد بن أبي الحواري؛ توفي سنة 205هـ على الأصح عند ابن الجوزي، وقيل 215هـ."
  en: "Abd al-Rahman ibn Ahmad ibn Atiyya al-Ansi, Abu Sulayman al-Darani, one of the great ascetics of Syria, named after Daraya near Damascus; he met Sufyan al-Thawri but gave himself to devotion rather than transmission, and his sayings on hunger, fear and contentment come through his disciple Ahmad ibn Abi al-Hawari. He died in 205 AH, the more correct date for Ibn al-Jawzi; 215 is also reported."
  ur: "عبد الرحمن بن احمد بن عطیہ العنسی، ابو سلیمان دارانی، شام کے بڑے زاہدوں میں، دمشق کے قریب داریا کی نسبت سے؛ سفیان ثوری سے ملے مگر روایت کے بجائے عبادت میں مشغول رہے، اور بھوک، خوف اور رضا پر ان کے اقوال ان کے شاگرد احمد بن ابی الحواری سے منقول ہیں۔ ابن الجوزی کے نزدیک صحیح تر یہ ہے کہ 205ھ میں فوت ہوئے؛ 215ھ بھی منقول ہے۔"
died: { edtf: "0820/0821", hijri: "0205", calendar: julian, precision: year, status: debated, derived: true, note: "توفي سنة خمس ومائتين، وقال السلمي سنة خمس عشرة، والأول أصح عند ابن الجوزي {cite:sifat-al-safwa-tartusi-2012 p.822}؛ وتذكر الموسوعة الفقهية القولين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17456}.", sources: [source/sifat-al-safwa-tartusi-2012, source/fiqh-mawsua-kuwaitiyya-noor-v3] }
