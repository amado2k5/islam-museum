summary:
  ar: "عبد الرحمن بن أحمد بن عطية العنسي، أبو سليمان الداراني، أحد مشاهير الزهاد. روى عن سفيان الثوري وأبي الأشهب العطاردي وعبد الواحد بن زيد البصري وعلقمة بن سويد وغيرهم، وروى عنه تلميذه أحمد بن أبي الحواري وهشام بن خالد وحميد بن هشام العنسي وغيرهم. ذُكر أن وفاته سنة خمس عشرة ومئتين عند سعيد بن حمدون والسلمي وأبي يعقوب القراب، وقال تلميذه أحمد بن أبي الحواري إنه مات سنة خمس ومئتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17456}"
  en: "Abd al-Rahman ibn Ahmad ibn Atiyya al-Ansi, Abu Sulayman al-Darani, one of the best-known ascetics. He transmitted from Sufyan al-Thawri, Abu al-Ashhab al-Utaridi, Abd al-Wahid ibn Zayd al-Basri and Alqama ibn Suwayd, among others. His pupil Ahmad ibn Abi al-Hawari, Hisham ibn Khalid and Humayd ibn Hisham al-Ansi transmitted from him. The book gives two dates for his death: 215 AH, reported by Sa'id ibn Hamdun, al-Sulami and Abu Ya'qub al-Qurrab, and 205 AH, reported by his pupil Ahmad ibn Abi al-Hawari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17456}"
