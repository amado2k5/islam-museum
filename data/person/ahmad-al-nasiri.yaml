summary:
  ar: "أبو العباس شهاب الدين أحمد بن خالد الناصري السلاوي، مؤرخ مغربي من أسرة الطريقة الناصرية، ولد في سلا سنة 1250هـ/1835م، وعمل موظفًا صغيرًا في الإدارة الشريفية، وألّف «الاستقصا لأخبار دول المغرب الأقصى»، وهو أهم تاريخ عام للمغرب، وتوفي في سلا سنة 1315هـ/1897م {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}."
  en: "Abu l-'Abbas Shihab al-Din Ahmad b. Khalid al-Nasiri al-Salawi, Moroccan historian of the Nasiriyya family, born at Sale in 1250/1835 and died there in 1315/1897. A minor official in the Sharifian administration, he wrote the Kitab al-Istiqsa li-akhbar duwal al-Maghrib al-aqsa, the first comprehensive history of Morocco, printed at Cairo in 1894 {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}."
  fr: "Abu l-'Abbas Shihab al-Din Ahmad b. Khalid al-Nasiri al-Salawi, historien marocain de la famille Nasiriyya, né à Salé en 1250 H/1835 ap. J.-C. et mort dans cette ville en 1315 H/1897 ap. J.-C. Fonctionnaire subalterne de l'administration chérifienne, il écrivit le Kitab al-Istiqsa li-akhbar duwal al-Maghrib al-aqsa, première histoire complète du Maroc, imprimée au Caire en 1894 {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}."
  es: "Abu l-'Abbas Shihab al-Din Ahmad b. Khalid al-Nasiri al-Salawi, historiador marroquí de la familia Nasiriyya, nacido en Sale en 1250/1835 y muerto allí en 1315/1897. Funcionario menor de la administración sharifiana, escribió el Kitab al-Istiqsa li-akhbar duwal al-Maghrib al-aqsa, la primera historia completa de Marruecos, impresa en El Cairo en 1894 {cita:encyclopaedia-of-islam-2 vol. 1 pág. 312}."
  ur: "ابو العباس شہاب الدین احمد ب۔ خالد النصیری الصلاوی، ناصریہ خاندان کے مراکشی مورخ، 1250/1835 میں سیل میں پیدا ہوئے اور وہیں 1315/1897 میں انتقال کر گئے۔ شریفین انتظامیہ کے ایک معمولی عہدے دار، اس نے کتاب الاستقساء لی-اخبار دووال المغرب الاقصیٰ لکھی، جو مراکش کی پہلی جامع تاریخ ہے، جو 1894ء میں قاہرہ میں چھپی۔ 1 ص۔ 312}۔"
  tr: "Nasiriyye Sufi tarikatına mensup Faslı tarihçi Ebu el-Abbas Şihab el-Din Ahmed ibn Halid el-Nasiri el-Selavi, Hicri 1250/Miladi 1835 yılında Salé'de doğdu. Şerifî yönetiminde alt kademe bir memur olarak çalıştı ve Fas'ın en önemli genel tarihi olan \"El-İstiqsa li-Akhbar Duwal el-Maghrib el-Aqsa\" (Uzak Mağrip Devletlerinin Kapsamlı Tarihi) adlı eseri yazdı. Hicri 1315/Miladi 1897 yılında Salé'de vefat etti. {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}"
  id: "Abu al-Abbas Shihab al-Din Ahmad ibn Khalid al-Nasiri al-Salawi, seorang sejarawan Maroko dari tarekat Sufi Nasiriyyah, lahir di Salé pada tahun 1250 H/1835 M. Ia bekerja sebagai pegawai junior di pemerintahan Syarif dan menulis “Al-Istiqsa li-Akhbar Duwal al-Maghrib al-Aqsa” (Sejarah Komprehensif Negara-negara Maghreb Jauh), yang merupakan sejarah umum Maroko yang paling penting. Ia meninggal di Salé pada tahun 1315 H/1897 M. {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}."
