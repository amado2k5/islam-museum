summary:
  ar: "أبو العباس شهاب الدين أحمد بن خالد الناصري السلاوي، مؤرخ مغربي من أسرة الطريقة الناصرية، ولد في سلا سنة 1250هـ/1835م، وعمل موظفًا صغيرًا في الإدارة الشريفية، وألّف «الاستقصا لأخبار دول المغرب الأقصى»، وهو أهم تاريخ عام للمغرب، وتوفي في سلا سنة 1315هـ/1897م {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}."
  en: "Abu l-'Abbas Shihab al-Din Ahmad b. Khalid al-Nasiri al-Salawi, Moroccan historian of the Nasiriyya family, born at Sale in 1250/1835 and died there in 1315/1897. A minor official in the Sharifian administration, he wrote the Kitab al-Istiqsa li-akhbar duwal al-Maghrib al-aqsa, the first comprehensive history of Morocco, printed at Cairo in 1894 {cite:encyclopaedia-of-islam-2 vol. 1 p. 312}."
