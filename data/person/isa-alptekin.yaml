summary:
  ar: "سياسي أويغوري خدم حكومة الصين الوطنية (1932–1949) وعارض الجمهوريتين، ثم قاد قضية استقلال تركستان الشرقية من منفاه في تركيا بعد 1949 حتى وفاته في إسطنبول سنة 1995."
  en: "Uyghur politician who served China's Nationalist government (1932–1949) while opposing both East Turkestan republics, then led the East Turkestan independence cause from exile in Turkey after 1949 until his death at Istanbul in 1995."
  ur: "اویغور سیاست دان جنہوں نے چین کی قوم پرست حکومت کی خدمت کی (1932ء تا 1949ء) اور پھر 1949ء کے بعد ترکی میں جلاوطنی سے مشرقی ترکستان کی آزادی کی تحریک کی قیادت کی؛ وفات 1995ء میں استنبول میں ہوئی۔"
