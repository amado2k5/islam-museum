  ar: "معاذ بن مسلم الهراء"
  en: "Mu'adh al-Harra"
  es: "Mu'adh al-Harra"
  fr: "Mu'adh al-Harra"
  ur: "معاذ الحرۃ"
roles: [scholar, poet]
gender: male
summary:
  ar: "معاذ بن مسلم الهراء، أبو مسلم، أديب معمر له شعر، من أهل الكوفة، عرف بالهراء لبيعه الثياب الهروية، وله كتب في النحو ضاعت؛ توفي سنة 187 هـ الموافقة 803 م."
  en: "Mu'adh ibn Muslim al-Harra', Abu Muslim, a long-lived man of letters and poet of Kufa, called al-Harra' for selling Harawi cloth; his books on grammar are lost; died 187 AH (803)."
  es: "Mu'adh ibn Muslim al-Harra', Abu Muslim, un longevo hombre de letras y poeta de Kufa, llamado al-Harra' por vender telas Harawi; sus libros de gramática se han perdido; murió en el año 187 AH (803)."
  fr: "Mu'adh ibn Muslim al-Harra', Abu Muslim, homme de lettres et poète de Kufa à la longue vie, appelé al-Harra' pour avoir vendu du tissu Harawi; ses livres sur la grammaire sont perdus; mort en 187 AH (803)."
  ur: "معاذ بن مسلم الحرث، ابو مسلم، ایک طویل القامت شخص اور کوفہ کا شاعر، جسے حراوی کپڑا بیچنے کے لیے الحارث کہا جاتا ہے۔ گرامر پر ان کی کتابیں گم ہو گئی ہیں۔ وفات 187ھ (803)۔"
  tr: "Mu'adh ibn Muslim al-Harra', şiirle uzun ömürlü bir edebi figür olan Ebu Müslim, Kufa'dan, harai giysilerini satmasıyla bilinen el-Hara' olarak bilinir ve kaybolan dilbilgisi üzerine kitaplar yazmıştır; 187 Hicri'de, yani 803 M.S. yılında ölmüştür."
  id: "Mu'adh ibn Muslim al-Harra', Abu Muslim, tokoh sastra yang hidup panjang dengan puisi, berasal dari Kufa, dikenal sebagai al-Hara' untuk menjual pakaian Hara'i, dan ia menulis buku tata bahasa yang hilang; ia meninggal pada tahun 187 H, yang bertepatan dengan tahun 803 M."
