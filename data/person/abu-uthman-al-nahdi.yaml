id: person/abu-uthman-al-nahdi
class: person
label: { ar: "أبو عثمان النهدي", en: "Abu Uthman al-Nahdi", fr: "Abu Uthman al-Nahdi", es: "Abu Uthman al-Nahdi", ur: "ابو عثمان النہدی" }
summary:
  ar: "عبد الرحمن بن مل النهدي؛ عند البلاذري ذهب بالبشارة إلى عمر يوم نهاوند فقال قتل النعمان فقال إنا لله وبكى وقال قتل في آخرين لا أعلمهم فقال ولكن الله يعلمهم ورآه واضعاً يده على رأسه يبكي."
  en: "In al-Baladhuri, who carried the glad tidings of Nihawand to Umar — 'al-Nu'man was killed' — whereupon Umar said 'we are God's' and wept, his hand on his head; 'killed among later ones I do not know' — 'but God knows them.'"
  fr: "Chez al-Baladhuri, celui qui porta à Umar la nouvelle de Nihawand : « al-Nu'man a été tué ». Umar dit « nous appartenons à Dieu » et pleura, la main sur la tête ; « tué parmi d'autres que je ne connais pas » — « mais Dieu les connaît »."
  es: "En al-Baladhuri, quien llevó la buena noticia de Nihawand a Umar —'al-Nu'man fue asesinado'—, entonces Umar dijo 'somos de Dios' y lloró, con la mano en la cabeza; 'no sé quién fue asesinado entre los posteriores' —'pero Dios los conoce'."
  ur: "البلادوری میں، جس نے عمر کو نہاوند کی بشارت دی تھی - 'النعمان مارا گیا' - جس پر عمر نے کہا 'ہم خدا کے ہیں' اور روتے ہوئے اس کے سر پر ہاتھ رکھا۔ 'بعد میں مارے گئے میں نہیں جانتا' - 'لیکن خدا انہیں جانتا ہے۔'"
  tr: "Abdülrahman ibn Mal el-Nehdi; el-Baladhuri'ye göre, Nevevan günü Ömer'e müjdeyi iletmek için gitti ve \"Numan öldürüldü\" dedi. Ömer, \"Biz Allah'a aitiz ve O'na döneceğiz\" dedi ve ağlayarak, \"O, tanımadığım diğerleriyle birlikte öldürüldü\" dedi. Ömer, \"Ama Allah onları bilir\" dedi ve onun elini başına koyup ağladığını gördü."
  id: "Abd al-Rahman ibn Mal al-Nahdi; menurut al-Baladhuri, ia pergi membawa kabar gembira kepada Umar pada hari Nahavand dan berkata, “Al-Nu’man telah terbunuh.” Umar berkata, “Sesungguhnya kami milik Allah dan kepada-Nya kami akan kembali,” lalu ia menangis dan berkata, “Ia terbunuh bersama orang-orang lain yang tidak kukenal.” Umar berkata, “Tetapi Allah mengetahui mereka,” lalu ia melihat Umar meletakkan tangannya di atas kepalanya sambil menangis."
