summary:
  ar: "عالم ومفسّر هندي ثم باكستاني (1904–1997) من بمهور في قضاء أعظم كره، أبرز تلامذة حميد الدين الفراهي وحامل منهجه في نظم القرآن. تخرج من مدرسة الإصلاح بسراي مير سنة 1922 وعمل في الصحافة، ثم تفرّغ منذ 1925 للدرس على الفراهي، وأسس الدائرة الحميدية، وكان عضوًا مؤسسًا في الجماعة الإسلامية وتركها سنة 1958، وأتم تفسيره الأردي «تدبر القرآن» سنة 1980 وتوفي في لاهور."
  en: "Indian, then Pakistani, scholar and exegete (1904–1997) of Bamhur in Azamgarh district, the leading student of Hamiduddin Farahi and the bearer of his method of Qur'anic coherence. He graduated from Madrasatul Islah at Sara-e-Mir in 1922 and worked in journalism, then from 1925 devoted himself to study under Farahi, founded the Daira-i-Hamidiyyah, was a founder member of Jamaat-e-Islami and left it in 1958, completed his Urdu commentary Tadabbur-i-Qur'an in 1980 and died at Lahore."
  ur: "بھارتی اور پھر پاکستانی عالم و مفسر (1904ء–1997ء) جن کا تعلق ضلع اعظم گڑھ کے بمہور سے تھا، حمید الدین فراہی کے ممتاز ترین شاگرد اور ان کے نظریۂ نظمِ قرآن کے حامل۔ 1922ء میں مدرسۃ الاصلاح سرائے میر سے فارغ ہوئے اور صحافت سے وابستہ رہے، پھر 1925ء سے فراہی سے درس کے لیے وقف ہو گئے، دائرہ حمیدیہ قائم کیا، جماعت اسلامی کے بانی ارکان میں شامل رہے اور 1958ء میں اس سے علاحدہ ہو گئے، 1980ء میں اپنی اردو تفسیر «تدبر قرآن» مکمل کی اور لاہور میں انتقال ہوا۔"
