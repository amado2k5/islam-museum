summary:
  ar: "محمد بن أسلم بن سالم بن يزيد، أبو الحسن الكندي مولاهم الطوسي ⁦(توفي 242 هـ / 856 م)⁩: من حفاظ الحديث، اشتهر بالصلاح ونعته الذهبي بشيخ المشرق، وله «المسند» و«الرد على الجهمية» و«الإيمان والأعمال». {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 34}"
  en: "Muhammad ibn Aslam ibn Salim ibn Yazid, Abu al-Hasan al-Kindi by clientage, al-Tusi (died 242 AH / 856): one of the hadith memorizers, known for piety and called by al-Dhahabi the shaykh of the East; author of al-Musnad, al-Radd ala al-Jahmiyya and al-Iman wa-l-A'mal. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 34}"
  es: "Muhammad ibn Aslam ibn Salim ibn Yazid, Abu al-Hasan al-Kindi por clientela, al-Tusi (fallecido en 242 AH / 856): uno de los memorizadores de hadices, conocido por su piedad y llamado por al-Dhahabi el shaykh de Oriente; autor de al-Musnad, al-Radd ala al-Jahmiyya y al-Iman wa-lA'mal. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 34}"
  fr: "Muhammad ibn Aslam ibn Salim ibn Yazid, Abu al-Hasan al-Kindi par filiation, al-Tusi (mort en 242 AH / 856): mémorisateur de hadiths réputé pour sa piété, surnommé par al-Dhahabi le cheikh de l’Orient; auteur d’al-Musnad, d’al-Radd ala al-Jahmiyya et d’al-Iman wa-lA’mal. {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 34}"
