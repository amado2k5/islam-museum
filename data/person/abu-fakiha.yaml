summary:
  ar: من المستضعفين الأولين، مولى صفوان بن أمية وقيل مولى بني عبد الدار، ويقال أصله من الأزد؛ عذّبه أمية بن خلف وربط في رجله حبلاً وجرّه حتى ألقاه في الرمضاء، فاشتراه أبو بكر وأعتقه؛ واسمه يسار وقيل أفلح بن يسار.
  en: One of the earliest weak converts, a client of Safwan ibn Umayya (or of the Banu Abd al-Dar), said to be of Azd origin. Umayya ibn Khalaf tied a rope to his foot and dragged him onto the scorching sand until he was thought dead; Abu Bakr
    bought and freed him. His name is given as Yasar, or Aflah ibn Yasar.
