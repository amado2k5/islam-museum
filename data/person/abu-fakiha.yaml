summary:
  ar: من المستضعفين الأولين، مولى صفوان بن أمية وقيل مولى بني عبد الدار، ويقال أصله من الأزد؛ عذّبه أمية بن خلف وربط في رجله حبلاً وجرّه حتى ألقاه في الرمضاء، فاشتراه أبو بكر وأعتقه؛ واسمه يسار وقيل أفلح بن يسار.
  en: One of the earliest weak converts, a client of Safwan ibn Umayya (or of the Banu Abd al-Dar), said to be of Azd origin. Umayya ibn Khalaf tied a rope to his foot and dragged him onto the scorching sand until he was thought dead; Abu Bakr
    bought and freed him. His name is given as Yasar, or Aflah ibn Yasar.
  ur: "ابتدائی کمزور مسلمانوں میں سے، صفوان بن امیہ ⁦(یا بنو عبد الدار)⁩ کا مولیٰ، اصل میں ازدی کہا جاتا ہے؛ امیہ بن خلف نے انہیں رسی سے باندھ کر ستایا۔"
  fr: "L'un des tout premiers convertis faibles, client de Safwan ibn Umayya (ou des Banu Abd al-Dar), dit d'origine azdite. Umayya ibn Khalaf lui attacha une corde au pied et le traîna sur le sable brûlant jusqu'à ce qu'on le crût mort ; Abu Bakr l'acheta et l'affranchit. Son nom est donné comme Yasar, ou Aflah ibn Yasar."
  es: "Uno de los primeros conversos débiles, cliente de Safwan ibn Umayya (o de los Banu Abd al-Dar), supuestamente de origen Azd. Umayya ibn Khalaf le ató una cuerda al pie y lo arrastró por la arena abrasadora hasta que lo creyeron muerto; Abu Bakr lo compró y lo liberó. Su nombre aparece como Yasar o Aflah ibn Yasar."
  tr: "İlk ezilenler arasında Safvan ibn Umeyye'nin azat ettiği köle de vardı. Onun Beni Abdülder'in azat ettiği köle olduğu ve Azd kabilesinden olduğu rivayet edilir. Umeyye ibn Halef ona işkence etti, bacağına ip bağlayıp sıcak kuma atana kadar sürükledi. Ebu Bekir onu satın alıp azat etti. Adı Yasar'dı ve Aflah ibn Yasar olduğu söylenir."
  id: "Di antara orang-orang yang pertama kali tertindas adalah budak yang dibebaskan oleh Safwan ibn Umayya, dan dikatakan bahwa ia adalah budak yang dibebaskan oleh Banu Abd al-Dar, dan dikatakan bahwa asalnya dari suku Azd. Umayya ibn Khalaf menyiksanya dan mengikatkan tali ke kakinya lalu menyeretnya hingga ia melemparkannya ke pasir panas. Abu Bakr membelinya dan membebaskannya. Namanya adalah Yasar, dan dikatakan bahwa ia adalah Aflah ibn Yasar."
