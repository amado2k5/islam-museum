summary:
  ar: "ضياء الدين يوسفزي (وُلد 20 أبريل 1969) ناشط تعليمي باكستاني، أسس وأدار سلسلة مدارس خاصة منخفضة الكلفة في سوات فتحت أبوابها للبنات، واشتهر عالميًا والدًا لملالا يوسفزي الحائزة على جائزة نوبل للسلام، إذ شجعها على رفع صوتها دفاعًا عن تعليم البنات في مواجهة طالبان باكستان. شارك في تأسيس صندوق ملالا، وله كتاب «دعها تطير» (2018)."
  en: "Ziauddin Yousafzai (born 20 April 1969) is a Pakistani education activist who founded and ran a chain of low-cost private schools in Swat open to girls, and who became known worldwide as the father of Nobel Peace Prize laureate Malala Yousafzai, whom he encouraged to speak out for girls' education against the Pakistani Taliban. He is a co-founder of the Malala Fund and the author of Let Her Fly (2018)."
  ur: "ضیاء الدین یوسفزئی (پیدائش 20 اپریل 1969ء) پاکستانی تعلیمی کارکن ہیں؛ انہوں نے سوات میں کم فیس نجی اسکولوں کا سلسلہ قائم کیا جو لڑکیوں کے لیے بھی کھلا تھا، اور وہ نوبل امن انعام یافتہ ملالہ یوسفزئی کے والد کے طور پر دنیا بھر میں جانے گئے، جنہیں انہوں نے طالبان کے مقابل لڑکیوں کی تعلیم کے لیے آواز اٹھانے کی ترغیب دی۔ وہ ملالہ فنڈ کے شریک بانی اور کتاب «Let Her Fly» (2018ء) کے مصنف ہیں۔"
