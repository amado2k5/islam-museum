summary:
  ar: "ابن هولاكو ملك التتار؛ ولي السلطنة بعد أخيه أبغا، وكان قد أسلم وهو صبي ويسّر له قرين صالح — الشيخ عبد الرحمن الذي قدم الشام رسولاً وسعى في الصلح — فوصلت رسله سنة إحدى وثمانين إلى الشام ومصر بأنه استقر في المملكة إلى بغداد وأمر ببناء المساجد والجوامع وإقامة الشرع الشريف على ما كان في زمن الخلفاء. وكان قليل الشر مائلاً إلى الخير، ومات وله بضع وعشرون سنة {cite:shadharat-dhahab p. 640, 653}."
  en: "Hulagu's son — the first Muslim Ilkhan (the name Ahmad, Islam since boyhood through his companion Shaykh Abd al-Rahman); his 681 embassies to Syria and Egypt announced mosques and the caliph-age shari'a restored; 'little harm, inclined to good', dead at twenty-odd {cite:shadharat-dhahab p. 640, 653}."
