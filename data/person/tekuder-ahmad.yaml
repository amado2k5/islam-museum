summary:
  ar: "ابن هولاكو ملك التتار؛ ولي السلطنة بعد أخيه أبغا، وكان قد أسلم وهو صبي ويسّر له قرين صالح — الشيخ عبد الرحمن الذي قدم الشام رسولاً وسعى في الصلح — فوصلت رسله سنة إحدى وثمانين إلى الشام ومصر بأنه استقر في المملكة إلى بغداد وأمر ببناء المساجد والجوامع وإقامة الشرع الشريف على ما كان في زمن الخلفاء. وكان قليل الشر مائلاً إلى الخير، ومات وله بضع وعشرون سنة {cite:shadharat-dhahab p. 640, 653}."
  en: "Hulagu's son — the first Muslim Ilkhan (the name Ahmad, Islam since boyhood through his companion Shaykh Abd al-Rahman); his 681 embassies to Syria and Egypt announced mosques and the caliph-age shari'a restored; 'little harm, inclined to good', dead at twenty-odd {cite:shadharat-dhahab p. 640, 653}."
  es: "El hijo de Hulagu, el primer Ilkhan musulmán (nombre Ahmad, Islam desde la niñez a través de su compañero Shaykh Abd al-Rahman); sus 681 embajadas a Siria y Egipto anunciaron la construcción de mezquitas y la restauración de la sharia de la época del califato; \"poco daño, inclinado al bien\", murió a los veintitantos años {cite:shadharat-dhahab p. 640, 653}."
  fr: "Le fils de Hulagu — le premier Ilkhan musulman (le nom d'Ahmad, l'islam depuis son enfance grâce à son compagnon Cheikh Abd al-Rahman); ses 681 ambassades en Syrie et en Égypte annoncèrent la construction de mosquées et le rétablissement de la charia de l'époque du califat; « peu de mal, enclin au bien », mort à une vingtaine d'années {cite: shadharat-dhahab p. 640, 653}."
