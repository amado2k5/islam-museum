id: person/khalid-ibn-al-muammar
class: person
label: { ar: "خالد بن المعمر الذهلي", en: "Khalid ibn al-Mu'ammar al-Dhuhli", es: "Khalid ibn al-Mu'ammar al-Dhuhli", fr: "Khalid ibn al-Mu'ammar al-Dhuhli", ur: "خالد بن المعمر الذھلی" }
summary:
  ar: "خالد بن المعمر الذهلي؛ كان على رجال ابن عامر يوم فتح أصطخر عنوة وولاه معاوية خراسان بعد عزل قيس بن الهيثم فمات بقصر مناتل أو بعين التمر ويقال إن معاوية ندم على توليته فبعث إليه بشوب مسموم ويقال بل دخلت في رجله زجاجة فنزف منها حتى مات."
  en: "Khalid ibn al-Mu'ammar al-Dhuhli; he led Ibn Amir's foot on the day Istakhr fell by storm. Mu'awiya made him over Khurasan after Qays ibn al-Haytham; he died at Qasr Munatil or Ayn al-Tamr — a poisoned draught Mu'awiya sent in regret, some say, or a glass shard in his leg that bled him dry."
  es: "Khalid ibn al-Mu'ammar al-Dhuhli; lideró la vanguardia de Ibn Amir el día en que Istakhr cayó por asalto. Mu'awiya lo nombró gobernador de Jorasán tras Qays ibn al-Haytham; murió en Qasr Munatil o Ayn al-Tamr, según algunos, por una poción envenenada que Mu'awiya envió con pesar, o por un fragmento de vidrio clavado en su pierna que lo desangró."
  fr: "Khalid ibn al-Mu'ammar al-Dhuhli commandait les troupes d'Ibn Amir le jour de la chute d'Istakhr. Mu'awiya le nomma à la tête du Khorasan après Qays ibn al-Haytham; il mourut à Qasr Munatil ou à Ayn al-Tamr – certains disent qu'il avait reçu une potion empoisonnée par Mu'awiya par remords, d'autres qu'un éclat de verre dans la jambe l'avait vidé de son sang."
  ur: "خالد بن المعمر الذھلی؛ اس نے ابن عامر کے قدموں کی قیادت کی جس دن استخارہ طوفان سے گرا۔ معاویہ نے اسے قیس بن الہیثم کے بعد خراسان پر قبضہ کر لیا۔ اس کی موت قصر مناطل یا عین التمر میں ہوئی - ایک زہر آلود مسودہ معاویہ نے افسوس کے ساتھ بھیجا، بعض کہتے ہیں، یا اس کی ٹانگ میں شیشے کا ٹکڑا جس سے اس کا خون خشک ہو گیا۔"
  tr: "Halid bin el-Muammer el-Dhahli; Astakhar'ın zorla fethedildiği dönemde İbn Amir'in adamları arasındaydı ve Muaviye, Qays ibn al-Haytham'ın görevden alınmasından sonra onu Horasan'a atadı. Manatil sarayında veya Ayn al-Tamr'da öldü. Rivayete göre Muaviye, onu devraldığı için pişman oldu ve zehirli ayıklık gönderdi. Bir şişenin bacağına girdiği ve kan kaybederek öldüğü söylenir."
  id: "Khalid ibn al-Muammar al-Dhahli; ia termasuk di antara orang-orang Ibn Amir saat penaklukan Astakhar dengan paksa, dan Muawiyah mengangkatnya ke Khurasan setelah pemecatan Qays ibn al-Haytham. Ia meninggal di istana Manatil atau di Ain al-Tamr. Konon Muawiyah menyesal telah mengambil alih dan mengirimnya dalam keadaan sadar yang diracuni. Konon sebuah botol masuk ke kakinya, dan ia berdarah hingga meninggal."
