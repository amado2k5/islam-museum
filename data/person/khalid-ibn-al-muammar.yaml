label: { ar: "خالد بن المعمر الذهلي", en: "Khalid ibn al-Mu'ammar al-Dhuhli" }
summary:
  ar: "خالد بن المعمر الذهلي؛ كان على رجال ابن عامر يوم فتح أصطخر عنوة وولاه معاوية خراسان بعد عزل قيس بن الهيثم فمات بقصر مناتل أو بعين التمر ويقال إن معاوية ندم على توليته فبعث إليه بشوب مسموم ويقال بل دخلت في رجله زجاجة فنزف منها حتى مات."
  en: "Khalid ibn al-Mu'ammar al-Dhuhli; he led Ibn Amir's foot on the day Istakhr fell by storm. Mu'awiya made him over Khurasan after Qays ibn al-Haytham; he died at Qasr Munatil or Ayn al-Tamr — a poisoned draught Mu'awiya sent in regret, some say, or a glass shard in his leg that bled him dry."
