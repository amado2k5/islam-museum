summary:
  ar: "ليلى بنت قانف الثقفية، صحابية شهدت غسل أم كلثوم بنت رسول الله، ووصفت ترتيب ما أعطاهن النبي من أكفانها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8206}"
  en: "Layla bint Qanif al-Thaqafiyya, a Companion who was among the women who washed Umm Kulthum, daughter of the Prophet, and who described the order in which her shrouding garments were handed over. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8206}"
  ur: "لیلی بنت قنیف الثقفیہ، وہ صحابیہ جو نبی کی بیٹی ام کلثوم کو غسل دینے والی عورتوں میں تھیں اور واقعہ بیان کیا۔"
  es: "Layla bint Qanif al-Thaqafiyya, una Compañera que estaba entre las mujeres que lavaron a Umm Kulthum, hija del Profeta, y que describió el orden en el que le entregaban sus mortajas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8205} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8206}"
  fr: "Layla bint Qanif al-Thaqafiyya, une compagne qui faisait partie des femmes qui lavaient Umm Kulthum, fille du Prophète, et qui a décrit l'ordre dans lequel ses vêtements de linceul ont été remis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8206}"
  tr: "Allah'ın Elçi'nin kızı Um Kulthum'un yıkanışına tanık olan sahabe Layla bint Qanf al-Thaqafiyyah, Peygamber tarafından verilen kefenlerin düzenini anlatmıştır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8206}"
  id: "Layla bint Qanf al-Thaqafiyyah, seorang sahabat yang menyaksikan pembersihan um Kulthum, putri Rasulullah, dan menjelaskan susunan kain kafan yang diberikan oleh Nabi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8206}"
