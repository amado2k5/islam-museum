summary:
  ar: "مقاتل فنون قتالية مختلطة ومصارع حر روسي-إماراتي من أصل شيشاني (وُلد سنة 1994 في غفارديسكوي بالشيشان). بطل وطني سويدي في المصارعة الحرة ثلاث مرات، هاجر إلى السويد مراهقا، ثم فاز ببطولة يو إف سي للوزن المتوسط في أغسطس 2025 وخسرها في دفاعه الأول في مايو 2026؛ وهو أول مقاتل مولود في الشيشان يفوز بلقب يو إف سي، وأول رياضي يمثل الإمارات ويفوز بلقب فيها."
  en: "Russian-Emirati mixed martial artist and freestyle wrestler of Chechen origin (born 1994 in Gvardeyskoye, Chechnya). A three-time Swedish national freestyle wrestling champion who emigrated to Sweden as a teenager, he won the UFC middleweight championship in August 2025 and lost it in his first defence in May 2026; he is the first Chechen-born fighter to win a UFC title and the first athlete representing the United Arab Emirates to win one."
  ur: "چیچن نژاد روسی-اماراتی مخلوط مارشل آرٹسٹ اور فری اسٹائل پہلوان (پیدائش 1994، گواردیسکوئے، چیچنیا)۔ سوئیڈن کے تین بار قومی فری اسٹائل چیمپئن، جو نوعمری میں سوئیڈن منتقل ہوئے؛ اگست 2025 میں یو ایف سی مڈل ویٹ چیمپئن شپ جیتی اور مئی 2026 میں پہلے دفاع میں ہار گئے؛ وہ یو ایف سی خطاب جیتنے والے پہلے چیچن نژاد فائٹر اور متحدہ عرب امارات کی نمائندگی کرتے ہوئے خطاب جیتنے والے پہلے کھلاڑی ہیں۔"
