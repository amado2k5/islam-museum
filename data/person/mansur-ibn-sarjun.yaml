id: person/mansur-ibn-sarjun
class: person
label: { ar: "منصور بن سرجون", en: "Mansur ibn Sarjun", ur: "منصور بن سرجون" }
aliases: ["Mansur b. Sardjun", "Mansur ibn Sargun", "Mansur the controller-general of Damascus", "منصور بن سرجون الرومي"]
summary:
  ar: "منصور بن سرجون وجيه نصراني من دمشق في أواخر العهد البيزنطي، تذكره دائرة المعارف الإسلامية بوصفه المراقب العام وأبا يوحنا الدمشقي، وكان مع الأسقف ضمن وجهاء المدينة الذين تفاوضوا مع المسلمين لتجنيب أهلها القتال حين حاصرها خالد بن الوليد سنة 14هـ/635م. لا تذكر المادة تاريخ ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 2 p. 293}."
  en: "Mansur ibn Sarjun was a Christian notable of Damascus in the last years of Byzantine rule. The Encyclopaedia of Islam names him as the controller-general and the father of John of Damascus, and says that with the bishop he was among the notables who negotiated with the Muslims to spare the city useless suffering when Khalid ibn al-Walid besieged it in 14/635. The article gives no dates of birth or death {cite:encyclopaedia-of-islam-2 vol. 2 p. 293}."
  ur: "منصور بن سرجون بازنطینی حکومت کے آخری برسوں میں دمشق کے ایک عیسائی معزز تھے۔ دائرۃ المعارف اسلامیہ انہیں مراقبِ عام اور یوحنا دمشقی کا باپ بتاتی ہے اور کہتی ہے کہ وہ بشپ کے ساتھ ان معززین میں تھے جنہوں نے 14ھ/635ء میں خالد بن الولید کے محاصرے کے وقت شہر کو بے فائدہ تکلیف سے بچانے کے لیے مسلمانوں سے بات چیت کی۔ مضمون ان کی پیدائش یا وفات کی کوئی تاریخ نہیں دیتا {cite:encyclopaedia-of-islam-2 vol. 2 p. 293}."
