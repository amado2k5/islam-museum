kids:
  ar: "منصور كان من وجهاء دمشق، وحاول مع غيره أن يحمي أهل المدينة من القتال حين وصل المسلمون."
  en: "Mansur was an important man of Damascus who helped talk with the Muslims so that the people of the city would not be hurt."
