summary:
  ar: "ثاني عشر سلاطين آتشيه (حكم من 4 أبريل 1607 إلى 27 ديسمبر 1636)، بلغت السلطنة في عهده أقصى اتساعها وصارت أقوى دول غرب الأرخبيل الإندونيسي وأغناها. وهو سليل المؤسس علي مغيات شاه من جهتَي الأب والأم؛ فتح ديلي وآرو وجوهر وبهانغ وقدح وبيرق، وجعل آتشيه مركزًا دوليًا للعلم الشرعي والتجارة ومركزَ دولتها، وإن تحطم أسطوله أمام ملقا عام 1629 واشتُهر حكمه بالقسوة بقدر ما اشتُهر بالعظمة."
  en: "Twelfth sultan of Aceh (r. 4 April 1607 – 27 December 1636), under whom the sultanate reached its greatest extent and became the strongest and richest state of the western Indonesian archipelago. A descendant of the founder Ali Mughayat Syah in both his father's and his mother's lines, he conquered Deli, Aru, Johor, Pahang, Kedah and Perak, made Aceh an international centre of Islamic learning and trade, and centralised the state — though his armada was destroyed before Melaka in 1629 and his rule was remembered for severity as much as for splendour."
  ur: "آچے کے بارہویں سلطان (دورِ حکومت 4 اپریل 1607ء – 27 دسمبر 1636ء)، جن کے عہد میں سلطنت اپنی سب سے زیادہ وسعت کو پہنچی اور مغربی انڈونیشیائی جزائر کی سب سے طاقتور اور امیر ترین ریاست بن گئی۔ وہ بانی علی مغایت شاہ کی نسل سے باپ اور ماں دونوں کی طرف سے تھے؛ انھوں نے دیلی، آرو، جوہر، پہانگ، قدح اور پیراک فتح کیے، آچے کو اسلامی علم و تجارت کا بین الاقوامی مرکز بنایا اور ریاست کو مرکزیت دی، اگرچہ 1629ء میں ملاکا کے سامنے ان کا بیڑا تباہ ہوا اور ان کا دورِ حکومت عظمت کے ساتھ سختی کے لیے بھی یاد رکھا گیا۔"

