summary:
  ar: "طبيب عثماني ومنظّم اتحادي (1874–1922)، من مؤسسي الطب الشرعي في تركيا ورئيس القسم السياسي في التشكيلات المخصوصة. تسمّيه المقالتان أحد مهندسي تهجير الأرمن سنة 1915؛ حُكم عليه غيابيًا بالإعدام أمام محكمة إسطنبول العسكرية، واغتيل في برلين سنة 1922 في إطار عملية نمسيس."
  en: "Ottoman physician and Unionist organiser (1874–1922), a founder of forensic medicine in Turkey and head of the political section of the Special Organization (Teşkilât-ı Mahsusa). The articles name him one of the architects of the Armenian deportations of 1915; sentenced to death in absentia by the Istanbul court martial, he was assassinated in Berlin in 1922 under Operation Nemesis."
  ur: "عثمانی طبیب اور اتحادی تنظیم کار (1874–1922)، ترکی میں عدالتی طب کے بانیوں میں سے اور تشکیلاتِ مخصوصہ کے سیاسی شعبے کے سربراہ۔ مضامین انھیں 1915 کی آرمینی جلاوطنی کے معماروں میں شمار کرتے ہیں؛ استنبول کی فوجی عدالت نے انھیں غائبانہ سزائے موت سنائی، اور 1922 میں برلن میں آپریشن نیمیسس کے تحت قتل کر دیے گئے۔"
