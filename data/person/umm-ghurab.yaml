summary:
 ar: "طلحة أم غراب، روت عن نُباتة عن عثمان بن عفان، وعن عقيلة وسلامة بنت الحر، وروى عنها مروان بن معاوية الفزاري ووكيع بن الجراح، وروى لها أبو داود وابن ماجه. قال ابن حجر في التقريب: لا يعرف حالها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13750}."
 en: "Talha, known as Umm Ghurab, narrated from Nubata, from Uthman ibn Affan, and from Uqayla and Salama bint al-Hurr. Marwan ibn Mu'awiya al-Fazari and Waki ibn al-Jarrah narrated from her, and Abu Dawud and Ibn Majah included her reports. Ibn Hajar in al-Taqrib says her state is not known {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13750}."
 ur: "طلحہ، ام غراب کے نام سے مشہور، انہوں نے نباتہ سے، انہوں نے عثمان بن عفان سے، اور عقیلہ اور سلامہ بنت الحر سے روایت کی۔ ان سے مروان بن معاویہ فزاری اور وکیع بن جراح نے روایت کی، اور ابو داؤد اور ابن ماجہ نے ان کی روایات لیں۔ ابن حجر نے تقریب میں کہا کہ ان کا حال معلوم نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13750}۔"
