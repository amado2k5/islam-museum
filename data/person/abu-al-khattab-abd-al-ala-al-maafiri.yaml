label:
  ar: "أبو الخطاب عبد الأعلى بن السمح المعافري"
  en: "Abu l-Khattab Abd al-A'la b. al-Samh al-Ma'afiri"
  ur: "ابو الخطاب عبدالاعلیٰ بن السمح المعافری"
summary:
  ar: "أبو الخطاب عبد الأعلى بن السمح المعافري الحميري اليمني، أول إمام انتخبه الإباضية في المغرب، وكان من الخمسة الذين أرسلهم أبو عبيدة التميمي إلى المغرب، وبايعه أعيان طرابلس سنة 140هـ/757م، وفتح القيروان سنة 141هـ/758م، وقُتل في تاوورغا سنة 144هـ/761م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 153}"
  en: "Abu l-Khattab Abd al-A'la b. al-Samh al-Ma'afiri al-Himyari al-Yamani, the first imam elected by the Ibadis of the Maghrib, one of five missionaries sent by Abu 'Ubayda al-Tamimi of Basra, elected at Sayyad near Tripoli in 140/757-8, who took Kairouan in 141/758 and was killed at Tawurgha in 144/761. {cite:encyclopaedia-of-islam-2 vol. 1 p. 153}"
  ur: "ابو الخطاب عبدالاعلیٰ بن السمح المعافری الحمیری الیمنی، مغرب کے اباضیوں کے پہلے منتخب امام، جو ابو عبیدہ التمیمی (بصرہ) کے بھیجے ہوئے پانچ داعیوں میں سے ایک تھے، 140ھ/757-58ء میں صیاد (طرابلس کے قریب) میں منتخب ہوئے، 141ھ/758ء میں قیروان فتح کیا، اور 144ھ/761ء میں تاوورغا میں مارے گئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 153}"
