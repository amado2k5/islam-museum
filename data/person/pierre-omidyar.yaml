summary:
  ar: "بيير مراد أميديار (وُلد باسم برويز مراد أميديار، 21 يونيو 1967) ملياردير ومهندس برمجيات وفاعل خير إيراني-أمريكي وُلد في فرنسا، وهو مؤسس موقع إيباي الذي أطلقه سنة 1995 باسم أوكشن ويب وترأس مجلس إدارته من 1998 إلى 2015. أسس مع زوجته باميلا شبكة أميديار الاستثمارية الخيرية سنة 2004 ومشروع فيرست لوك ميديا الصحفي سنة 2013، وهو من الموقّعين على تعهد العطاء."
  en: "Pierre Morad Omidyar (born Parviz Morad Omidyar, 21 June 1967) is a French-born Iranian-American billionaire, software engineer and philanthropist, the founder of eBay, which he launched as Auction Web in 1995 and chaired from 1998 to 2015. With his wife Pamela he founded the philanthropic investment firm Omidyar Network in 2004 and the journalism venture First Look Media in 2013, and he is a signatory of the Giving Pledge."
  ur: "پیئر مراد اومیڈیار (پیدائشی نام پرویز مراد اومیڈیار، پیدائش 21 جون 1967ء) فرانس میں پیدا ہونے والے ایرانی نژاد امریکی ارب پتی، سافٹ ویئر انجینئر اور مخیر ہیں، ای بے کے بانی، جسے انہوں نے 1995ء میں آکشن ویب کے نام سے شروع کیا اور 1998ء سے 2015ء تک اس کے چیئرمین رہے۔ انہوں نے اپنی اہلیہ پامیلا کے ساتھ 2004ء میں فلاحی سرمایہ کاری ادارہ اومیڈیار نیٹ ورک اور 2013ء میں صحافتی منصوبہ فرسٹ لک میڈیا قائم کیا، اور وہ گیونگ پلیج کے دستخط کنندگان میں شامل ہیں۔"
