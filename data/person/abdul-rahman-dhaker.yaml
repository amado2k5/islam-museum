  ar: "طبيب واستشاري في علم النفس التربوي والعلاج النفسي، صاحب منهج «فقه النفس» التدريبي الذي بدأت رحلته سنة 1417هـ/1997م، والمشرف على مركز مكاني للصحة النفسية، تُبث محاضراته ودروسه عبر قناة مكاني الرسمية على يوتيوب ومنصات المركز."
  en: "Physician and consultant in educational psychology and psychotherapy, originator of the Fiqh al-Nafs training curriculum — a programme whose journey began in 1417 AH / 1997 CE — and supervisor of the Makani Center for mental health; his lectures and lessons are published through the official Makany YouTube channel and the center's platforms."
