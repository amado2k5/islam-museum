  en: "The grand old man of Banu Makhzum — arbiter of Quraysh's elders, father of Khalid, and the man whose poetic verdicts shaped how Mecca first named the Prophet's recitation."
  ar: "شيخ بني مخزوم الكبير — حكم شيوخ قريش، وأبو خالد، والرجل الذي شكّلت أحكامه البلاغية ما سمّت به مكة أولًا تلاوة النبي. وعند ابن شبة في وفاء الوفاء أن الأوس نزلت على قريش بمكة فحالفتها قبل بعاث، فلما حالفتهم قال الوليد: «ما نزل قوم قط على قوم إلا أخذوا شرفهم وورثوا ديارهم»، فاحتال لنقض الحلف بأن حدّثهم عن حمية قوم لا يرضون لمس النساء فانتفضت الأوس وقطعته {cite:samhudi-wafa-al-wafa p. 228}."
