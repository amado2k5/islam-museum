summary:
  en: "The grand old man of Banu Makhzum — arbiter of Quraysh's elders, father of Khalid, and the man whose poetic verdicts shaped how Mecca first named the Prophet's recitation."
  fr: "Le grand vieil homme de Banu Makhzum - arbitre des anciens de Quraysh, père de Khalid, et l'homme dont les verdicts poétiques ont façonné la façon dont La Mecque a d'abord nommé la récitation du Prophète."
  ar: "شيخ بني مخزوم الكبير — حكم شيوخ قريش، وأبو خالد، والرجل الذي شكّلت أحكامه البلاغية ما سمّت به مكة أولًا تلاوة النبي. وعند ابن شبة في وفاء الوفاء أن الأوس نزلت على قريش بمكة فحالفتها قبل بعاث، فلما حالفتهم قال الوليد: «ما نزل قوم قط على قوم إلا أخذوا شرفهم وورثوا ديارهم»، فاحتال لنقض الحلف بأن حدّثهم عن حمية قوم لا يرضون لمس النساء فانتفضت الأوس وقطعته {cite:samhudi-wafa-al-wafa p. 228}."
  ur: "بنو مخزوم کے بزرگ سردار، خالد کے والد اور قریش کی نمایاں شخصیات میں سے تھے۔ موجودہ سوانح میں مکہ کے ابتدائی دور میں ان کے کردار کا ذکر آتا ہے۔ {cite:ibn-sad-tabaqat-bewley}"
  es: "El venerable anciano de Banu Makhzum, árbitro de los ancianos de Quraysh, padre de Khalid y el hombre cuyos veredictos poéticos dieron forma a la manera en que La Meca nombró por primera vez la recitación del Profeta."
  tr: "Banu Makhzum'un Büyük Şeyhi — Kureyş'in yaşlıları Ebu Halid'in ve retorik hükümleriyle Mekke'nin ilk olarak Peygamber'in ayetini şekillendiren adamın yönetimi. İbn Şibah'ın Wafa al-Wafa'ya göre, Awslar Mekke'deki Kureyş'e inmiş ve seferden önce onlarla ittifak kurmuşlardır. Bağlılık yemini ettiklerinde Al-Walid şöyle demiştir: \"Hiçbir halk bir halka sadece onurunu alıp evlerini miras alırlar.\" Kadınlara dokunmayı onaylamayan bir halkın coşkusunu anlatarak yemini bozmaları için onları kandırdı, bu yüzden Aws ayağa kalkıp onu kesti {cite:samhudi-wafa-al-wafa s. 228}."
  id: "Sheikh Agung Banu Makhzum — Pemerintahan para tetua Quraisy, Abu Khalid, dan pria yang keputusannya membentuk apa yang pertama kali disebut Mekah sebagai bacaan Nabi. Menurut Ibn Shibah dalam Wafa al-Wafa, para Aws turun ke Quraisy di Mekah dan bersekutu dengan mereka sebelum ekspedisi. Ketika mereka bersumpah setia, Al-Walid berkata: \"Tidak ada bangsa yang pernah datang kepada suatu bangsa kecuali mereka mengambil kehormatan dan mewarisi rumah mereka.\" Ia menipu mereka untuk melanggar sumpah dengan memberitahu tentang semangat suatu bangsa yang tidak menyetujui sentuhan wanita, sehingga para Aws bangkit dan memutuskan hubungan mereka {cite:samhudi-wafa-al-wafa hlm. 228}."
