summary:
  ar: "صحفي فلسطيني (وُلد سنة 1970) من مدينة غزة، مدير مكتب الجزيرة في غزة منذ 2004 بعد عمله في صحيفة القدس وصوت فلسطين والعربية؛ واصل التغطية خلال الحرب على غزة رغم مقتل زوجته وابنيه وحفيده في غارات إسرائيلية وإصابته هو في ديسمبر 2023، ونال جائزة جون أوبوشون الدولية لحرية الصحافة من نادي الصحافة الوطني الأمريكي سنة 2024."
  en: "Palestinian journalist (born 1970) from Gaza City, Al Jazeera's Gaza bureau chief since 2004 after earlier work for Al-Quds, Voice of Palestine and Al Arabiya; he kept reporting through the Gaza war after airstrikes killed his wife, two of his sons and a grandson and he himself was wounded in December 2023, and received the National Press Club's International John Aubuchon Press Freedom Award for 2024."
  ur: "فلسطینی صحافی (پیدائش 1970) جن کا تعلق غزہ شہر سے ہے؛ 2004 سے الجزیرہ کے غزہ بیورو کے سربراہ ہیں؛ جنگ کے دوران فضائی حملوں میں اپنی اہلیہ، دو بیٹوں اور پوتے کو کھونے اور خود زخمی ہونے کے باوجود رپورٹنگ جاری رکھی؛ 2024 میں نیشنل پریس کلب کا بین الاقوامی جان اوبوشون پریس فریڈم ایوارڈ ملا۔"
