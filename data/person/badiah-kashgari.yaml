summary:
  ar: "شاعرة سعودية وُلدت في الطائف سنة 1954، حصلت على البكالوريوس في أدب اللغة الإنجليزية من جامعة الملك عبد العزيز بجدة سنة 1977 وماجستير في علم النفس التعليمي من جامعة أوكلاهوما. عملت بالتدريس، ثم في شركة أرامكو بالظهران من 1978، محررةً بقسم النشر العربي في العلاقات العامة من 1989 حتى استقالتها سنة 1999، وأقامت مدة في كندا، ولها عدة دواوين شعرية مطبوعة."
  en: "Saudi poet born in Taif in 1954. She took a BA in English literature at King Abdulaziz University in Jeddah (1977) and a master's in educational psychology at the University of Oklahoma, taught in Taif and Jeddah, and worked for Saudi Aramco in Dhahran from 1978, editing Arabic publications in its public relations department from 1989 until her resignation in 1999. She later lived for a time in Canada and has published several collections of poetry."
  ur: "سعودی شاعرہ، 1954 میں طائف میں پیدا ہوئیں۔ انہوں نے جدہ کی شاہ عبدالعزیز یونیورسٹی سے انگریزی ادب میں بی اے (1977) اور اوکلاہوما یونیورسٹی سے تعلیمی نفسیات میں ماسٹرز کیا۔ تدریس کے بعد وہ ظہران میں آرامکو سے وابستہ رہیں اور اس کے عربی نشریات کی مدیرہ رہیں؛ ان کے کئی شعری مجموعے شائع ہو چکے ہیں۔"
