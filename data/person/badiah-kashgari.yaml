summary:
  ar: "شاعرة سعودية وُلدت في الطائف سنة 1954، حصلت على البكالوريوس في أدب اللغة الإنجليزية من جامعة الملك عبد العزيز بجدة سنة 1977 وماجستير في علم النفس التعليمي من جامعة أوكلاهوما. عملت بالتدريس، ثم في شركة أرامكو بالظهران من 1978، محررةً بقسم النشر العربي في العلاقات العامة من 1989 حتى استقالتها سنة 1999، وأقامت مدة في كندا، ولها عدة دواوين شعرية مطبوعة."
  en: "Saudi poet born in Taif in 1954. She took a BA in English literature at King Abdulaziz University in Jeddah (1977) and a master's in educational psychology at the University of Oklahoma, taught in Taif and Jeddah, and worked for Saudi Aramco in Dhahran from 1978, editing Arabic publications in its public relations department from 1989 until her resignation in 1999. She later lived for a time in Canada and has published several collections of poetry."
  ur: "سعودی شاعرہ، 1954 میں طائف میں پیدا ہوئیں۔ انہوں نے جدہ کی شاہ عبدالعزیز یونیورسٹی سے انگریزی ادب میں بی اے (1977) اور اوکلاہوما یونیورسٹی سے تعلیمی نفسیات میں ماسٹرز کیا۔ تدریس کے بعد وہ ظہران میں آرامکو سے وابستہ رہیں اور اس کے عربی نشریات کی مدیرہ رہیں؛ ان کے کئی شعری مجموعے شائع ہو چکے ہیں۔"
  es: "Poeta saudí nacida en Taif en 1954. Se licenció en Literatura Inglesa en la Universidad Rey Abdulaziz de Yeda (1977) y obtuvo un máster en Psicología Educativa en la Universidad de Oklahoma. Impartió clases en Taif y Yeda, y trabajó para Saudi Aramco en Dhahran desde 1978, editando publicaciones en árabe en su departamento de relaciones públicas desde 1989 hasta su dimisión en 1999. Posteriormente residió un tiempo en Canadá y ha publicado varias colecciones de poesía."
  fr: "Poétesse saoudienne née à Taïf en 1954. Elle a obtenu une licence en littérature anglaise à l'Université du Roi Abdulaziz à Djeddah (1977) et une maîtrise en psychologie de l'éducation à l'Université de l'Oklahoma. Elle a enseigné à Taïf et à Djeddah, et a travaillé pour Saudi Aramco à Dhahran à partir de 1978, où elle a édité des publications arabes au sein du département des relations publiques de 1989 jusqu'à sa démission en 1999. Elle a ensuite vécu quelque temps au Canada et a publié plusieurs recueils de poésie."
  tr: "1954 yılında Taif'te doğan Suudi şair olan Suud, 1977'de Cidde'deki King Abdulaziz Üniversitesi'nden İngiliz edebiyatı alanında lisans derecesi ve Oklahoma Üniversitesi'nden eğitim psikolojisi alanında yüksek lisans derecesi aldı. 1978'den itibaren Dhahran'daki Aramco'da öğretmenlik yaptı, 1989'dan 1999'daki istifasına kadar Arap yayıncılık departmanında halkla ilişkiler bölümünde editörlük yaptı. Bir süre Kanada'da yaşadı ve birkaç yayımlanmış şiir koleksiyonu bulundu."
  id: "Seorang penyair Saudi yang lahir di Taif pada tahun 1954, ia meraih gelar sarjana sastra Inggris dari King Abdulaziz University di Jeddah pada tahun 1977 dan gelar master psikologi pendidikan dari University of Oklahoma. Ia bekerja sebagai guru, lalu di Aramco di Dhahran sejak 1978, menjabat sebagai editor di departemen penerbitan Arab dalam bidang hubungan masyarakat dari tahun 1989 hingga pengunduran dirinya pada tahun 1999. Ia pernah tinggal di Kanada dan telah menerbitkan beberapa kumpulan puisi."
