summary:
  ar: "قطب الدين محمود بن ضياء الدين مسعود بن مصلح الشيرازي ⁦(أكتوبر 1236 – 1311)⁩، عالم فارسي موسوعي برع في الفلك والرياضيات والطب والفلسفة ونظرية الموسيقى والتصوف. نشأ في أسرة كازرونية من الأطباء والمتصوفة، فألبسه أبوه خرقة التصوف وهو في العاشرة، وخلف أباه طبيبًا للعيون في مستشفى شيراز المظفري، ثم رحل إلى مراغة فتتلمذ على نصير الدين الطوسي وعمل في مرصدها. وطاف خراسان والعراق والأناضول والشام ومصر، وتولى القضاء في سيواس وملطية، وألف «نهاية الإدراك» و«التحفة الشاهية» و«درة التاج»، وتوفي بتبريز ودُفن في مقبرة چرنداب."
  en: "Qutb al-Din Mahmud ibn Ziya al-Din Mas'ud ibn Muslih al-Shirazi (October 1236 - 1311) was a Persian polymath who contributed to astronomy, mathematics, medicine, physics, music theory, philosophy and Sufism. He came from a Kazeruni family of physicians and Sufis: his father gave him the Sufi khirqa at the age of ten, and he succeeded his father as ophthalmologist at Shiraz's Mozaffari hospital before travelling to Maragha, where he studied under Nasir al-Din al-Tusi at the new observatory. He later served as judge of Sivas and Malatya, went as envoy to Mamluk Egypt, and wrote the Nihayat al-idrak, al-Tuhfa al-Shahiya and the encyclopaedic Durrat al-taj. He died at Tabriz and was buried in its Charandab cemetery."
  ur: "قطب الدین محمود بن ضیاء الدین مسعود بن مصلح شیرازی ⁦(اکتوبر 1236ء – 1311ء)⁩ فارسی عالم تھے جنھوں نے فلکیات، ریاضی، طب، طبیعیات، نظریہ موسیقی، فلسفہ اور تصوف میں کام کیا۔ وہ کازرون کے ایک صوفی خاندان سے تعلق رکھتے تھے؛ والد نے دس برس کی عمر میں انھیں خرقہ عطا کیا۔ مراغہ جا کر وہ نصیر الدین طوسی کے شاگرد ہوئے، بعد میں سیواس و ملطیہ کے قاضی رہے، اور «نہایۃ الادراک» و «درۃ التاج» جیسی کتابیں لکھیں۔ وفات تبریز میں ہوئی۔"

