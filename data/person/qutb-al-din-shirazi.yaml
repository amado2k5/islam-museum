    note: >-
      Sufi initiation is attested for the man himself in three
      independent texts. The English article records that his
      father, a Sufi of the Kazeruni family who had received the
      khirqa (the Sufi investiture robe) from Shihab al-Din Umar
      al-Suhrawardi, garbed Qutb al-Din with the khirqa as a
      blessing at the age of ten, and that he later received his
      own robe from the Sufi Najib al-Din Bozgush Shirazi; it
      describes him as a Sufi from a family of Sufis. The Arabic
      article likewise states that he was born into a Sufi family
      and that his father gave him the khirqa at ten, and the Urdu
      article names his father's affiliation, the Kazeruniyya
      order, and repeats the investiture. Attested initiation and
      practice within a living Sufi tradition settles the value
      sufi on the founder's rule. No legal school is named for him
      in any text read — his commentary on Ibn al-Hajib's usul work
      is scholarship on a Maliki textbook, not a school attested
      for the man — and none is recorded.
    sources: [source/wikipedia-qutb-al-din-shirazi-en, source/wikipedia-qutb-al-din-shirazi-ar, source/wikipedia-qutb-al-din-shirazi-ur]

