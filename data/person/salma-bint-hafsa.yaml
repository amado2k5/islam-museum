summary:
  ar: "أرملة المثنى بن حارثة الشيباني تزوجها سعد بن أبي وقاص بعده، وهي التي أطلقت أبا محجن الثقفي من محبسه على عهده أن يعيد رجله في القيد ليلة القادسية وأعارته البلقاء، وأخبرت سعداً خبرها فأطلقه، وكان بينها وبين سعد كلام أوجب غضبه عليها لذكرها المثنى عند مختلف القنا فأقامت مغاضبة له حتى صالحته صبيحة ليلة الهرير {cite:muruj-al-dhahab p. 610-612}."
  en: "al-Muthanna's widow married to Sa'd — who freed Abu Mahjan on his oath, lent him al-Balqa', and told Sa'd the whole story; herself estranged from Sa'd for naming al-Muthanna at the spear-crossing until the eve of the Harir night {cite:muruj-al-dhahab p. 610-612}."
  es: "La viuda de al-Muthanna se casó con Sa'd, quien liberó a Abu Mahjan bajo juramento, le prestó al-Balqa' y le contó a Sa'd toda la historia; ella misma se distanció de Sa'd por nombrar a al-Muthanna en el cruce de lanzas hasta la víspera de la noche de Harir {cite:muruj-al-dhahab p. 610-612}."
  fr: "La veuve d'al-Muthanna, mariée à Sa'd, qui a libéré Abu Mahjan sur son serment, lui a prêté al-Balqa' et a raconté toute l'histoire à Sa'd; elle-même brouillée avec Sa'd pour avoir nommé al-Muthanna lors du passage de la lance jusqu'à la veille de la nuit de Harir {cite:muruj-al-dhahab p. 610-612}."
  ur: "المثنۃ کی بیوہ نے سعد سے شادی کی - جس نے ابو مہجن کو اس کی قسم پر آزاد کیا، اسے البلقع دیا، اور سعد کو سارا واقعہ سنایا۔ رات حریر کی شام تک نیزہ پر المثنٰی کا نام لینے کی وجہ سے سعد سے الگ ہوگئی۔ 610-612}۔"
  tr: "al-Muthanna bin Haritha al-Shaybani'nin dul eşi, ondan sonra Sa'd ibn Abi Waqkas'la evlendi. Ebu Muhjan el-Tekafi'yi, el-Kadisiye gecesi adamını hapishaneye geri götürme ve Balka'ya ödünç verme sözü verdiğinde onu hapisten çıkaran kişiydi. Haberi Sa'd'a bildirdi ve Sa'd onu serbest bıraktı. Onunla arasında bir konuşma oldu ve bu konuşma Sa'd'ı kızdırdı çünkü Sad çeşitli zamanlarda el-Muthanna'dan bahsetti, bu yüzden ona kızgın kaldı ve el-Harir gecesi sabahı onu barıştırana kadar ona kızgın kaldı {cite:muruj-al-dhahab, s. 610-612}."
  id: "Janda al-Muthanna ibn Haritha al-Shaybani menikah dengan Sa'd ibn Abi Waqqas setelah dia. Dialah yang membebaskan Abu Muhjan al-Thaqafi dari penjaranya saat ia berjanji untuk mengembalikan pria itu ke penjara pada malam al-Qadisiyyah dan meminjamkannya kepada Balqa. Ia memberitahu Sa'd tentang kabarnya dan ia membebaskannya. Ada percakapan antara ia dan Sa'd yang membuatnya marah karena ia menyebut al-Muthanna di berbagai titik, sehingga ia tetap marah hingga ia mendamaikannya pada pagi hari malam al-Harir {cite:muruj-al-dhahab, hlm. 610-612}."
