summary:
  ar: "أرملة المثنى بن حارثة الشيباني تزوجها سعد بن أبي وقاص بعده، وهي التي أطلقت أبا محجن الثقفي من محبسه على عهده أن يعيد رجله في القيد ليلة القادسية وأعارته البلقاء، وأخبرت سعداً خبرها فأطلقه، وكان بينها وبين سعد كلام أوجب غضبه عليها لذكرها المثنى عند مختلف القنا فأقامت مغاضبة له حتى صالحته صبيحة ليلة الهرير {cite:muruj-al-dhahab p. 610-612}."
  en: "al-Muthanna's widow married to Sa'd — who freed Abu Mahjan on his oath, lent him al-Balqa', and told Sa'd the whole story; herself estranged from Sa'd for naming al-Muthanna at the spear-crossing until the eve of the Harir night {cite:muruj-al-dhahab p. 610-612}."
