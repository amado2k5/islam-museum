summary:
  ar: ابن عم النبي، ذكره ابن سعد في الطبقة الخامسة من الصحابة؛ ممن ثبت يوم حنين، وقُتل بأجنادين سنة 13هـ بعد أن قتل مبارزَين من الروم؛ وهو غير عبد الله بن الزبير بن العوام. وعند المسعودي خطب أربعين يوماً لا يصلي على النبي وقال لا يمنعني أن أصلي عليه إلا أن تشمخ رجال بآنافها، ولما عرض له الحصين بن نمير أن يحمله إلى الشام ويبايع له قال رافعاً صوته أبعد قتل أهل الحرة لا والله حتى أقتل بكل رجل خمسة من أهل الشام، وقال لابن عباس إني لأكتم بغضكم أهل هذا البيت منذ أربعين سنة {cite:muruj-al-dhahab p. 76-78}
  en: A cousin of the Prophet, listed by Ibn Sa'd in the fifth class of Companions; one of those who held firm at Hunayn, and killed at Ajnadayn in 13 AH after killing two Byzantine challengers; not to be confused with Abdullah ibn al-Zubayr
    ibn al-Awwam.
  ur: "نبی کے چچا زاد، ابن سعد نے انہیں صحابہ کی پانچویں جماعت میں شمار کیا؛ حنین میں ثابت قدم رہنے والوں میں سے اور 13 ہجری میں اجنادین پر مارے گئے۔"
  fr: "Un cousin du Prophète, qu'Ibn Sa'd range dans la cinquième classe des Compagnons ; l'un de ceux qui tinrent bon à Hunayn, tué à Ajnadayn en 13 H après avoir tué deux champions byzantins ; à ne pas confondre avec Abdullah ibn al-Zubayr ibn al-Awwam."
  es: "Primo del Profeta, incluido por Ibn Sa'd en la quinta clase de Compañeros; uno de los que se mantuvieron firmes en Hunayn y mataron en Ajnadayn en el año 13 AH después de matar a dos retadores bizantinos; no confundir con Abdullah ibn al-Zubayr ibn al-Awwam."
  tr: "İbn Sa'd'ın Sahabelerin beşinci sınıfında bahsettiği Peygamberin kuzeni, Huneyn Muharebesi'nde dimdik duranlardan biriydi ve Hicri 13 yılında Ecnadayn'da iki Romalı düellocuyu öldürdükten sonra şehit edildi. Abdullah ibn el-Zübeyr ibn el-Evvem ile karıştırılmamalıdır. El-Mas'udi'ye göre, kırk gün boyunca Peygambere salavat getirmeden vaazlar verdi ve \"Bana salavat getirmeme engel olan tek şey bazı insanların kibridir\" dedi. Hüseyin ibn Numeyr onu Suriye'ye götürmeyi ve kendisine biat etmeyi teklif ettiğinde, sesini yükselterek, \"Harrah halkının öldürülmesinden sonra mı? Hayır, Allah'a yemin ederim ki, öldürülen her adam için beş Suriyeli öldürmeden asla!\" dedi. Ayrıca İbn Abbas'a, \"Kırk yıldır size, bu evin halkına olan nefretimi gizliyorum\" dedi. {cite:muruj-al-dhahab s. 76-78}"
  id: "Sepupu Nabi, yang disebutkan oleh Ibnu Sa'd dalam golongan kelima Sahabat, adalah salah satu orang yang teguh pendiriannya dalam Perang Hunayn dan gugur di Ajnadayn pada tahun 13 H setelah membunuh dua orang Romawi yang sedang berduel. Ia tidak boleh disamakan dengan Abdullah ibn al-Zubayr ibn al-Awwam. Menurut al-Mas'udi, ia menyampaikan khutbah selama empat puluh hari tanpa memohonkan shalawat kepada Nabi, seraya berkata, \"Tidak ada yang menghalangi saya untuk memohonkan shalawat kepadanya kecuali kesombongan sebagian orang.\" Ketika al-Husayn ibn Numayr menawarkan untuk membawanya ke Suriah dan berjanji setia kepadanya, ia meninggikan suaranya dan berkata, \"Setelah membunuh penduduk al-Harrah? Tidak, demi Allah, tidak sampai saya membunuh lima orang Suriah untuk setiap orang yang terbunuh!\" Ia juga berkata kepada Ibnu Abbas, \"Aku telah menyembunyikan kebencianku kepada kalian, orang-orang dari rumah ini, selama empat puluh tahun.\" {kutipan:muruj-al-dhahab hlm. 76-78}"
