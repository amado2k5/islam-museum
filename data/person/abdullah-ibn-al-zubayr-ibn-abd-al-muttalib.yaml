summary:
  ar: ابن عم النبي، ذكره ابن سعد في الطبقة الخامسة من الصحابة؛ ممن ثبت يوم حنين، وقُتل بأجنادين سنة 13هـ بعد أن قتل مبارزَين من الروم؛ وهو غير عبد الله بن الزبير بن العوام. وعند المسعودي خطب أربعين يوماً لا يصلي على النبي وقال لا يمنعني أن أصلي عليه إلا أن تشمخ رجال بآنافها، ولما عرض له الحصين بن نمير أن يحمله إلى الشام ويبايع له قال رافعاً صوته أبعد قتل أهل الحرة لا والله حتى أقتل بكل رجل خمسة من أهل الشام، وقال لابن عباس إني لأكتم بغضكم أهل هذا البيت منذ أربعين سنة {cite:muruj-al-dhahab p. 76-78}
  en: A cousin of the Prophet, listed by Ibn Sa'd in the fifth class of Companions; one of those who held firm at Hunayn, and killed at Ajnadayn in 13 AH after killing two Byzantine challengers; not to be confused with Abdullah ibn al-Zubayr
    ibn al-Awwam.
  ur: "نبی کے چچا زاد، ابن سعد نے انہیں صحابہ کی پانچویں جماعت میں شمار کیا؛ حنین میں ثابت قدم رہنے والوں میں سے اور 13 ہجری میں اجنادین پر مارے گئے۔"
