summary:
  ar: "ابن الملك الظاهر بيبرس؛ تملك بعد أبيه سنة ست وسبعين في صفر، وكان شاباً مليحاً كريماً حسن الطباع فيه عدل ولين وإحسان ومحبة للخير، وله ثمانية عشر عاماً. فخلعوه من الأمر فأقام بالكرك أشهراً، ومات شبه الفجأة في نصف ذي القعدة بقلعة الكرك، ثم نقل بعد سنة ونصف إلى تربة والده، وتملك بعده أخوه خضر {cite:shadharat-dhahab p. 632}."
  en: "Baybars's son and heir at eighteen — 'fair, generous, sweet-natured, just and gentle'; deposed to Karak within months and dead suddenly there mid-Dhu al-Qa'da 678, carried a year and a half later into his father's turba; his brother Khidr followed {cite:shadharat-dhahab p. 632}."
  es: "Hijo y heredero de Baybars a los dieciocho años: «rubio, generoso, de carácter dulce, justo y gentil»; depuesto en Karak a los pocos meses y muerto repentinamente allí a mediados de Dhu al-Qa'da 678, llevado un año y medio después a la turba de su padre; su hermano Khidr le siguió {cite:shadharat-dhahab p. 632}."
  fr: "Le fils et héritier de Baybars à dix-huit ans — « beau, généreux, doux, juste et gentil »; déposé à Karak en quelques mois et mort subitement là-bas au milieu de Dhu al-Qa'da 678, transporté un an et demi plus tard dans la turba de son père; son frère Khidr suivit {cite:shadharat-dhahab p. 632}."
  ur: "بیبارس کا بیٹا اور وارث اٹھارہ سال کی عمر میں - 'منصفانہ، فیاض، میٹھی طبیعت، انصاف پسند اور نرم'؛ مہینوں کے اندر کرک کو معزول کر دیا گیا اور وہیں ذی القعدہ 678 کے وسط میں اچانک انتقال کر گیا، ڈیڑھ سال بعد اپنے والد کے پگڑے میں لے جایا گیا۔ اس کے بھائی خضر نے پیروی کی 632}۔"
  tr: "İbn el-Malik el-Zahir Baybars; yetmiş altıncı yaşında Safar'da babasının yerine geçti. Nazik, cömert ve iyi huylu bir gençti; adalet, nezaket, nezaket ve iyiliğe sevgi duyan biriydi. On sekiz yaşındaydı. Görevden alındı ve birkaç ay Karak'ta kaldı. Neredeyse aniden Karak kalesinde Dhu'd-Qi'dah ortasında öldü. Bir buçuk yıl sonra babasının mezarına nakledildi ve ardından kardeşi Hidr görevi devraldı {atıf:şadharat-dhahab, s. 632}."
  id: "Ibn al-Malik al-Zahir Baybars; ia menggantikan ayahnya pada tahun tujuh puluh enam di Safar. Ia adalah pemuda yang baik hati, dermawan, dan baik hati dengan keadilan, kelembutan, kebaikan, dan cinta pada kebaikan. Ia berusia delapan belas tahun. Mereka memberhentikannya dari jabatan, dan ia tinggal di Karak selama beberapa bulan. Ia meninggal hampir tiba-tiba di tengah Dhu al-Qi'dah di benteng Karak. Setelah satu setengah tahun, ia dipindahkan ke makam ayahnya, dan setelahnya, saudaranya Khidr mengambil alih {cite:shadharat-dhahab, hlm. 632}."
