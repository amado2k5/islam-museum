summary:
  ar: "ابن الملك الظاهر بيبرس؛ تملك بعد أبيه سنة ست وسبعين في صفر، وكان شاباً مليحاً كريماً حسن الطباع فيه عدل ولين وإحسان ومحبة للخير، وله ثمانية عشر عاماً. فخلعوه من الأمر فأقام بالكرك أشهراً، ومات شبه الفجأة في نصف ذي القعدة بقلعة الكرك، ثم نقل بعد سنة ونصف إلى تربة والده، وتملك بعده أخوه خضر {cite:shadharat-dhahab p. 632}."
  en: "Baybars's son and heir at eighteen — 'fair, generous, sweet-natured, just and gentle'; deposed to Karak within months and dead suddenly there mid-Dhu al-Qa'da 678, carried a year and a half later into his father's turba; his brother Khidr followed {cite:shadharat-dhahab p. 632}."
