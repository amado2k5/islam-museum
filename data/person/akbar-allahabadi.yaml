summary:
  ar: "أكبر إلهآبادي، شاعر أردي هندي وُلد قرب إلهآباد سنة 1846 وتوفي في سبتمبر 1921، وكان يهجو ويفكه بالجناس والدعابة في الحياة الاجتماعية والسياسية في الهند تحت الحكم البريطاني، فلُقب «لسان العصر» {cite:encyclopaedia-of-islam-2 vol. 1 p. 339}."
  en: "Akbar Allahabadi, an Urdu poet of Indian Islam born near Allahabad in 1846 and dead in September 1921, who used satire and wordplay to comment on the social and political life of British India, earning the title 'the mouthpiece of the age' {cite:encyclopaedia-of-islam-2 vol. 1 p. 339}."
