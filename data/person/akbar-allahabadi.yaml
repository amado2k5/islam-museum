summary:
  ar: "أكبر إلهآبادي، شاعر أردي هندي وُلد قرب إلهآباد سنة 1846 وتوفي في سبتمبر 1921، وكان يهجو ويفكه بالجناس والدعابة في الحياة الاجتماعية والسياسية في الهند تحت الحكم البريطاني، فلُقب «لسان العصر» {cite:encyclopaedia-of-islam-2 vol. 1 p. 339}."
  en: "Akbar Allahabadi, an Urdu poet of Indian Islam born near Allahabad in 1846 and dead in September 1921, who used satire and wordplay to comment on the social and political life of British India, earning the title 'the mouthpiece of the age' {cite:encyclopaedia-of-islam-2 vol. 1 p. 339}."
  fr: "Akbar Allahabadi, poète ourdou de l’islam indien né près d’Allahabad en 1846 et mort en septembre 1921, commentait par la satire et les jeux de mots la vie sociale et politique de l’Inde britannique, ce qui lui valut le titre de « porte-parole de son époque » {cite:encyclopaedia-of-islam-2 vol. 1 p. 339}."
  es: "Akbar Allahabadi, poeta urdu del Islam indio nacido cerca de Allahabad en 1846 y fallecido en septiembre de 1921, que utilizó la sátira y los juegos de palabras para comentar la vida social y política de la India británica, ganándose el título de \"el portavoz de la época\" {cite:encyclopaedia-of-islam-2 vol. 1 p. 339}."
  ur: "اکبر الہ آبادی، ہندوستانی اسلام کے ایک اردو شاعر، جو 1846 میں الہ آباد کے قریب پیدا ہوئے اور ستمبر 1921 میں انتقال کر گئے، جنہوں نے برطانوی ہندوستان کی سماجی اور سیاسی زندگی پر تبصرہ کرنے کے لیے طنز و مزاح کا استعمال کیا، اور 'عمر کا منہ بولتا ثبوت' حاصل کیا۔ 1 ص۔ 339}۔"
