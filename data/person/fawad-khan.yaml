summary:
  ar: "ممثل باكستاني (وُلد سنة 1981) ومنتج وكاتب سيناريو ومغنٍّ، بدأ مغنياً لفرقة «إنتيتي بارادايم»، واشتهر بمسلسلي «همسفر» و«زندگي گلزار ہے» وبفيلم «خدا کے لیے» (2007) وبدخوله السينما الهندية بفيلم «خوبصورت» (2014)."
  en: "Pakistani actor, producer, screenwriter and singer (born 1981) who began as lead singer of the band Entity Paradigm and rose to fame with the television dramas Humsafar and Zindagi Gulzar Hai, the film Khuda Kay Liye (2007) and his Indian cinema debut in Khoobsurat (2014)."
