summary:
  ar: "شيخ الأزهر الأسبق (ت. 1383هـ/1963م)، وُلد بمنية منصور في البحيرة، وتولى مشيخة الأزهر سنة 1378هـ، وأسس مشروع مجمع البحوث الإسلامية؛ من كتبه «الإسلام عقيدة وشريعة» الذي يقوم عليه هذا الإدخال. التواريخ من مقدمة محمد عمارة للكتاب ولم تُراجع على مصدر ثانٍ بعد."
  en: "Former Grand Imam of al-Azhar (d. 1383 AH / 1963 CE), born in Munyat Mansur in Beheira; he held the Grand Imamate from 1378 AH and championed the Islamic Research Academy; his book Islam, Creed and Law is the source for this card. Dates come from Muhammad Imara's introduction and are not yet checked against a second source."
