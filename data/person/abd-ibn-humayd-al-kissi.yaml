summary:
  ar: عبد بن حميد بن نصر، أبو محمد، الكِسّي، وقيل اسمه عبد الحميد الكِسّي، نسبة إلى كِس، مدينة قرب سمرقند، من حفاظ الحديث. سمع يزيد بن هارون وابن فديك ومحمد بن بشر العبدي وعلي بن عاصم والحسين بن علي الجعفي وطبقتهم، وحدث عنه عمر بن بجير وبكر بن المرزبان وإبراهيم بن خريم الشاشي وغيرهم. قال الذهبي إنه كان من الأئمة الثقات. وله مسند كبير وتفسير. وتاريخ وفاته في العنوان سنة 249 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503}
  en: Abd ibn Humayd ibn Nasr, Abu Muhammad, al-Kissi, also said to be Abd al-Hamid al-Kissi, named after Kiss near Samarqand, a memorizer of hadith. He heard from Yazid ibn Harun, Ibn Fudayk, Muhammad ibn Bishr al-Abdi, Ali ibn Asim, al-Husayn ibn Ali al-Ju'fi and their generation; Umar ibn Bujayr, Bakr ibn al-Mirzaban and Ibrahim ibn Khurrayim al-Shashi related from him. al-Dhahabi called him among the leading trustworthy transmitters. His works include a large Musnad and a Qur'an commentary. The heading gives death 249 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503}
  ur: عبد بن حمید بن نصر، ابو محمد کسی، جن کا نام عبد الحمید کسی بھی بتایا گیا، کس (سمرقند کے قریب ایک شہر) کی طرف منسوب، حفاظ حدیث میں سے۔ انہوں نے یزید بن ہارون، ابن فدیک، محمد بن بشر العبدی، علی بن عاصم اور حسین بن علی الجعفی وغیرہ سے سنا، اور ان سے عمر بن بجیر، بکر بن المرزبان اور ابراہیم بن خریم الشاشی وغیرہ نے روایت کیا۔ ذہبی کے نزدیک وہ ائمہ ثقات میں سے تھے۔ ان کی تصانیف میں ایک بڑی مسند اور تفسیر ہے۔ عنوان کے مطابق وفات 249 ہجری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5502} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5503}
