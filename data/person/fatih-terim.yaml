summary:
  ar: "مدرب كرة قدم تركي ومدافع سابق، وُلد في أضنة سنة 1953. بعد أحد عشر عامًا لاعبًا في غلطة سراي أصبح أنجح مدرب في تاريخه — أربعة ألقاب دوري متتالية وكأس الاتحاد الأوروبي 2000 — ودرّب فيورنتينا وميلان في إيطاليا، وقاد تركيا إلى نصف نهائي يورو 2008، وحقق مع غلطة سراي ثمانية ألقاب دوري في المجموع. يُلقب بـ«الإمبراطور»."
  en: "Turkish football manager and former defender, born in Adana in 1953. After eleven years as a Galatasaray player he became the most successful manager in the club's history — four consecutive league titles and the 2000 UEFA Cup — coached Fiorentina and AC Milan in Italy, led Turkey to the semi-finals of Euro 2008, and won eight Süper Lig titles with Galatasaray in all. He is nicknamed 'İmparator' (the Emperor)."
  ur: "ترک فٹبال مینیجر اور سابق محافظ، 1953 میں ادانا میں پیدا ہوئے۔ گالاتاسرائے کے کھلاڑی کے طور پر گیارہ سال کے بعد وہ کلب کی تاریخ کے سب سے کامیاب مینیجر بنے — چار لگاتار لیگ خطاب اور 2000 یوئیفا کپ — اٹلی میں فیورنٹینا اور اے سی میلان کی کوچنگ کی، ترکی کو یورو 2008 کے سیمی فائنل تک پہنچایا، اور گالاتاسرائے کے ساتھ مجموعی طور پر آٹھ سپر لیگ خطاب جیتے۔ ان کا لقب «ایمپراتور» (شہنشاہ) ہے۔"
