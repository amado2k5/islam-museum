summary:
  ar: "المقداد بن معد يكرب بن عمرو بن يزيد، أبو كريمة الكندي، صحابي، قدم في صباه من اليمن مع وفد كندة على النبي وكانوا ثمانين راكبا. روى عن النبي وعن خالد بن الوليد ومعاذ بن جبل وأبي أيوب الأنصاري، وعنه ابنه يحيى وخالد بن معدان. له أربعون حديثا، وانفرد البخاري منها بحديث. توفي سنة 87هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  en: "Al-Miqdad ibn Madi Karib ibn Amr, Abu Karima al-Kindi, a Companion who came as a youth from Yemen with the delegation of Kinda, eighty riders in all. He narrated from the Prophet, Khalid ibn al-Walid, Mu'adh ibn Jabal and Abu Ayyub al-Ansari; his son Yahya and Khalid ibn Ma'dan narrated from him. He has forty hadith, one of which al-Bukhari alone reports. The page gives his death as 87 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
