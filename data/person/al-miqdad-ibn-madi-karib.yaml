summary:
  ar: "المقداد بن معد يكرب بن عمرو بن يزيد، أبو كريمة الكندي، صحابي، قدم في صباه من اليمن مع وفد كندة على النبي وكانوا ثمانين راكبا. روى عن النبي وعن خالد بن الوليد ومعاذ بن جبل وأبي أيوب الأنصاري، وعنه ابنه يحيى وخالد بن معدان. له أربعون حديثا، وانفرد البخاري منها بحديث. توفي سنة 87هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  en: "Al-Miqdad ibn Madi Karib ibn Amr, Abu Karima al-Kindi, a Companion who came as a youth from Yemen with the delegation of Kinda, eighty riders in all. He narrated from the Prophet, Khalid ibn al-Walid, Mu'adh ibn Jabal and Abu Ayyub al-Ansari; his son Yahya and Khalid ibn Ma'dan narrated from him. He has forty hadith, one of which al-Bukhari alone reports. The page gives his death as 87 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  fr: "Al-Miqdad ibn Madi Karib ibn Amr, Abu Karima al-Kindi, un compagnon qui est venu comme un jeune du Yémen avec la délégation de Kinda, quatre-vingts coureurs en tout. Il a raconté du Prophète, Khalid ibn al-Walid, Mu'adh ibn Jabal et Abu Ayyub al-Ansari ; son fils Yahya et Khalid ibn Ma'dan raconté de lui. Il a quarante hadiths, dont l’un rapporte seul al-Bukhari. La page donne sa mort en 87 de l’hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  ur: "مقداد بن معد یکرب بن عمرو، ابو کریمہ الکندی؛ کندہ کے اسی سواروں کے وفد کے ساتھ یمن سے نوجوان آئے۔"
  es: "Al-Miqdad ibn Madi Karib ibn Amr, Abu Karima al-Kindi, un Compañero que llegó de joven desde Yemen con la delegación de Kinda, ochenta jinetes en total. Narró del Profeta, Khalid ibn al-Walid, Mu'adh ibn Jabal y Abu Ayyub al-Ansari; su hijo Yahya y Khalid ibn Ma'dan narraron de él. Tiene cuarenta hadices, uno de los cuales solo relata al-Bujari. La página indica que murió en el año 87 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  tr: "El-Miqdad bin Ma'd Yakarb bin Amr ibn Yazid, gençliğinde Yemen'den Kinda heyetiyle Peygamber'e gelen bir sahabe Ebu Kerima el-Kindi ve seksen binici vardı. Peygamber'den, Halid bin Velid, Muad ibn Cebel ve Ebu Eyyüb el-Ensari'den, oğlu Yahya ve Halid ibn Ma'dan'dan rivayet etti. Kırk hadisi vardır ve el-Buhari yalnızca bunlardan rivayet etmiştir. 87 Hicri yılında öldü. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3495}"
  id: "Al-Miqdad ibn Ma'd Yakarb ibn Amr ibn Yazid, Abu Karima al-Kindi, seorang sahabat yang datang dari Yaman saat muda bersama delegasi Kinda kepada Nabi, dan terdapat delapan puluh penunggang kuda. Ia menceritakan dari Nabi, dari Khalid ibn al-Walid, Mu'adh ibn Jabal, dan Abu Ayyub al-Ansari, dari putranya Yahya dan Khalid ibn Ma'dan. Ia memiliki empat puluh hadits, dan al-Bukhari hanya menceritakan dari hadits tersebut. Ia wafat pada tahun 87 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3495}"
