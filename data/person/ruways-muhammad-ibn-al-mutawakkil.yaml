summary:
  ar: "محمد بن المتوكل اللؤلؤي البصري المعروف برويس، راوي قراءة يعقوب الحضرمي؛ توفي بالبصرة سنة 238هـ، وكان إماماً في القراءة قيّماً بها ماهراً ضابطاً مشهوراً حاذقاً، ونقل ابن الجزري عن الداني أنه من أحذق أصحاب يعقوب {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  en: "Muhammad ibn al-Mutawakkil al-Lu'lu'i of Basra, known as Ruways, transmitter of the reading of Ya'qub al-Hadrami; he died in Basra in 238 AH. Ibn al-Jazari calls him an imam of the reading, skilled, exact and famous, and quotes al-Dani that he was among the most skilled of Ya'qub's companions {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  ur: "محمد بن المتوکل لؤلؤی بصری، رویس کے نام سے مشہور، یعقوب حضرمی کی قراءت کے راوی؛ 238ھ میں بصرہ میں فوت ہوئے۔ ابن الجزری انہیں قراءت کا امام، ماہر، ضابط اور مشہور کہتے ہیں اور دانی سے نقل کرتے ہیں کہ وہ یعقوب کے سب سے ماہر ساتھیوں میں تھے {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  es: "Muhammad ibn al-Mutawakkil al-Lu'lu'i de Basora, conocido como Ruways, transmisor de la lectura de Ya'qub al-Hadrami; murió en Basora en el año 238 de la Hégira. Ibn al-Jazari lo llama un imán de la lectura, hábil, exacto y famoso, y cita a al-Dani diciendo que estaba entre los más hábiles de los compañeros de Ya'qub {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  fr: "Muhammad ibn al-Mutawakkil al-Lu'lu'i de Bassora, connu sous le nom de Ruways, transmetteur de la lecture de Ya'qub al-Hadrami; il mourut à Bassora en 238 AH. Ibn al-Jazari le qualifie d'imam de la lecture, habile, précis et célèbre, et cite al-Dani selon lequel il était parmi les plus habiles des compagnons de Ya'qub {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  tr: "Muhammed bin el-Mutevakkil el-Lu'lu'i el-Basri, Rubeys olarak bilinir, Yaqub el-Hadrami'nin okuntunun anlatıcısıydı; 238 Hicri yılında Basra'da öldü. O, okuma konusunda bir imamdı; yetenekli, tanınmış, titiz ve yetenekliydi. İbn el-Cezeri, el-Dani'yi Yakub'un en yetenekli sahabelerinden biri olarak alıntılamıştır {cite:nashr-dahman-damascus-1345-v1, s. 197}."
  id: "Muhammad ibn al-Mutawakkil al-Lu'lu'i al-Basri, yang dikenal sebagai Ruwais, adalah seorang narator pembacaan Yaqub al-Hadrami; ia meninggal di Basra pada tahun 238 H. Ia adalah imam dalam pembacaan, terampil, terkenal, tepat, dan terampil. Ibn al-Jazari mengutip al-Dani sebagai salah satu sahabat paling terampil Yaqub {cite:nashr-dahman-damascus-1345-v1, hlm. 197}."
