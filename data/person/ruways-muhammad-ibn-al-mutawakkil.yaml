summary:
  ar: "محمد بن المتوكل اللؤلؤي البصري المعروف برويس، راوي قراءة يعقوب الحضرمي؛ توفي بالبصرة سنة 238هـ، وكان إماماً في القراءة قيّماً بها ماهراً ضابطاً مشهوراً حاذقاً، ونقل ابن الجزري عن الداني أنه من أحذق أصحاب يعقوب {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  en: "Muhammad ibn al-Mutawakkil al-Lu'lu'i of Basra, known as Ruways, transmitter of the reading of Ya'qub al-Hadrami; he died in Basra in 238 AH. Ibn al-Jazari calls him an imam of the reading, skilled, exact and famous, and quotes al-Dani that he was among the most skilled of Ya'qub's companions {cite:nashr-dahman-damascus-1345-v1 p. 197}."
  ur: "محمد بن المتوکل لؤلؤی بصری، رویس کے نام سے مشہور، یعقوب حضرمی کی قراءت کے راوی؛ 238ھ میں بصرہ میں فوت ہوئے۔ ابن الجزری انہیں قراءت کا امام، ماہر، ضابط اور مشہور کہتے ہیں اور دانی سے نقل کرتے ہیں کہ وہ یعقوب کے سب سے ماہر ساتھیوں میں تھے {cite:nashr-dahman-damascus-1345-v1 p. 197}."
