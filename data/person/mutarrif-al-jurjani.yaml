summary:
  ar: "وزير أسفار بن شيرويه وكان يخاطب بالرئيس، أشار عليه أن يلاطف صاحب خراسان ويطمعه في المال وإقامة الدعوة، ولما اشترط صاحب خراسان المال عليه وضرب على كل رأس ديناراً من مسلم وذمي وغريب فاجتمع من ذلك أموال عظيمة بقي منها بعد حمل الاشتراط ألف ألف دينار ونيف، فلما ملك مرداويج الجيش أحضره واستخرج منه الأموال {cite:muruj-al-dhahab p. 722-724}."
  en: "Asfar's vizier who devised the universal one-dinar poll tax that yielded millions {cite:muruj-al-dhahab p. 722-724}."
  es: "El visir de Asfar que ideó el impuesto per cápita universal de un dinar que generó millones {cite:muruj-al-dhahab p. 722-724}."
  fr: "Le vizir d'Asfar qui a conçu la taxe de capitation universelle d'un dinar qui a rapporté des millions {cite:muruj-al-dhahab p. 722-724}."
  ur: "اسفار کا وزیر جس نے عالمی ایک دینار پول ٹیکس وضع کیا جس سے لاکھوں کی آمدنی ہوئی 722-724}۔"
  tr: "Asfar bin Şiruvey'in bakanı, reisi hitap ederek ona Horasan hükümdarını desteklemesini, para için onu kandırmasını ve misyonu kurmasını tavsiye etti. Horasan hükümdarı para talep edip her baş için, ister Müslüman, ister zimmi ya da yabancı olsun, bir dinar vurduğunda, büyük bir para birikti ve bunun bin bin dinar ve daha fazlası kaldı. Mardavic orduyu yönetirken onu getirdi ve parayı aldı {atıf:muruj-al-dhahab, s. 722-724}."
  id: "Menteri Asfar ibn Shiruwayh, yang berbicara kepada kepala suku, menyarankan agar ia mendukung penguasa Khurasan dan menggoda agar mendapatkan uang serta mendirikan misi tersebut. Ketika penguasa Khurasan menuntut uang dan memukul satu dinar untuk setiap kepala, baik Muslim, dhimmi, maupun asing, sejumlah besar uang terkumpul, di mana tersisa seribu ribu dinar atau lebih. Ketika Mardavij memimpin tentara, ia membawanya dan mengambil uang itu darinya {cite:muruj-al-dhahab, hlm. 722-724}."
