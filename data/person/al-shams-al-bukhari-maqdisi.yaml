label: { ar: "الشمس البخاري المقدسي الحنبلي", en: "al-Shams al-Bukhari al-Maqdisi al-Hanbali", fr: "al-Shams al-Bukhari al-Maqdisi al-Hanbali", es: "al-Shams al-Bukhari al-Maqdisi al-Hanbali", ur: "الشمس البخاری المقدسی الحنبلی۔" }
summary:
  ar: "شمس الدين أبو العباس أحمد بن عبد الواحد بن أحمد بن عبد الرحمن بن إسماعيل بن منصور السعدي المقدسي ثم الدمشقي المعروف بالبخاري؛ أخو الحافظ ضياء الدين محمد ووالد الفخر علي، مسند عصره؛ ولد في العشر الأواخر من شوال سنة أربع وستين وخمسمائة بالجبل وسمع بدمشق من أبي المعالي بن صابر وغيره وببغداد من ابن الجوزي وطبقته وبنيسابور وواسط من جماعة، وتفقه في مذهب الإمام أحمد وبرع فيه وأقام مدة يشتغل بالخلاف على الرضي النيسابوري ولهذا عرف بالبخاري ثم رجع إلى الشام وسكن حمص مدة، قال المنذري وهو أول من ولي القضاء بها؛ قال ابن الدبيثي كان إماماً عالماً مفتياً مناظراً ذا سمت ووقار وكثير المحفوظ حجة صدوقاً تام المروءة لم يكن في المقادسة أنصح منه؛ توفي ليلة الخميس خامس جمادى الآخرة سنة ثلاث وعشرين وستمائة ودفن إلى جانب خاله الشيخ موفق الدين {cite:shadharat-dhahab p. 107}."
  en: "al-Shams al-Bukhari — Ahmad b. Abd al-Wahid al-Maqdisi, brother of the hafiz al-Diya' and father of al-Fakhr Ali, musnid of his age; a Hanbali who honed his dialectic under al-Radi al-Naysaburi (whence the nisba), first qadi of Homs, and by Ibn al-Dabithi's account 'no Maqdisi sounder than he'; died 5 Jumada II 623, buried beside his uncle al-Muwaffaq Ibn Qudama {cite:shadharat-dhahab p. 107}."
  fr: "al-Shams al-Bukhari – Ahmad b. Abd al-Wahid al-Maqdisi, frère du hafiz al-Diya’ et père d’al-Fakhr Ali, musnid de son âge  ; un hanbali qui a aiguisé sa dialectique sous al-Radi al-Naysaburi (d'où la nisba), premier qadi de Homs, et par le compte d'Ibn al-Dabithi 'non Maqdisi plus sain que lui' ; est mort 5 Jumada II 623, enterré à côté de son oncle al-Muwaffaq Ibn Qudama {cite:shadharat-dhahab p. 107}."
  es: "al-Shams al-Bukhari - Ahmad b. Abd al-Wahid al-Maqdisi, hermano de Hafiz al-Diya' y padre de al-Fakhr Ali, un musnid de su época; un hanbalí que perfeccionó su dialéctica bajo al-Radi al-Naysaburi (de donde viene el nisba), el primer cadí de Homs, y según Ibn al-Dabithi, \"ningún Maqdisi es más sólido que él\"; murió el 5 de Jumada II 623, enterrado junto a su tío al-Muwaffaq ibn Qudama {cita: shadharat-dhahab p. 107}."
  ur: "الشمس البخاری - احمد ب. عبد الواحد المقدسی، حافظ الدیہ کے بھائی اور الفخر علی کے والد، اپنی عمر کے مسند؛ ایک حنبلی جس نے الرادی النیسابوری ⁦(جہاں سے نسبہ)⁩ کے تحت اپنی جدلیاتی کو عزت بخشی، حمص کے پہلے قاضی، اور ابن الدبیثی کے بیان کے مطابق 'اس سے زیادہ کوئی مقدیسی نہیں'؛ وفات 5 جمادی الثانی 623، اپنے چچا الموفق ابن قدامہ کے پاس دفن ہوئے۔ 107}۔"
  tr: "Şemseddin Ebu el-Abbas Ahmed ibn Abd al-Wahid ibn Ahmed ibn Abd al-Rahman ibn İsmail ibn Mansur al-Sa'di al-Maqdisi, o zamanlar el-Dimashqi, el-Buhari olarak bilinir; hafız Diya'eddin Muhammed'in kardeşi ve döneminin ileticisi el-Fakhr Ali'nin babasıdır; Şevval'ın son on gecesinde, beş yüz altmış dört yılda dağda doğmuş, Şam'da Ebu al-Ma'ali ibn Sabir ve diğerlerinden, Bağdat'ta İbn al-Jawzi ve sınıfından ve Nişapur ile Wasit'teki bir gruptan dinlemiştir. İmam Ahmed okulunu okudu, bu alanda üstün başarı gösterdi ve bir süre el-Radhi al-Nisaburi ile anlaşmazlıklar içinde çalıştı Bu nedenle el-Buhari olarak tanındı, ardından Levant'a döndü ve bir süre Hums'ta yaşadı. El-Mundhiri orada yargı görevini üstlenen ilk kişiydi; İbn el-Dubaithi şöyle dedi: O bir imam, alim, müftü, müftü, yüksek statüye ve saygın, birçok koruyucusu, doğru kanıtı ve tam bir şövalyeliği olan bir münazaraydı. Dini derslerde ondan daha tavsiye edilmedi; altı yüz yirmi üç yılında, Cumedül-Ahira'nın beşinci Perşembe gecesi öldü ve amcası Şeyh Muvaffaq al-Din yanına defnedildi {kaynak: şadharat-dhahab, s. 107}."
  id: "Shams al-Din Abu al-Abbas Ahmad ibn Abd al-Wahid ibn Ahmad ibn Abd al-Rahman ibn Ismail ibn Mansur al-Sa'di al-Maqdisi, kemudian al-Dimashqi, dikenal sebagai al-Bukhari; saudara dari hafiz Diya' al-Din Muhammad dan ayah dari al-Fakhr Ali, penyalur zamannya; lahir pada sepuluh malam terakhir Shawwal tahun lima ratus enam puluh empat di gunung, ia mendengar di Damaskus dari Abu al-Ma'ali ibn Sabir dan lainnya, serta di Baghdad dari Ibn al-Jawzi dan kelasnya, serta dari kelompok di Nishapur dan Wasit. Ia mempelajari ajaran Imam Ahmad, unggul di sana, dan menghabiskan waktu bekerja dalam perselisihan dengan al-Radhi al-Nisaburi Karena alasan ini, ia dikenal sebagai al-Bukhari, lalu kembali ke Levant dan tinggal di Homs untuk beberapa waktu. Al-Mundhiri adalah yang pertama memegang jabatan yudisial di sana; Ibn al-Dubaithi berkata: Ia adalah imam, ulama, mufti, debater, berwibawa tinggi dan bermartabat, dengan banyak bahan pengawet, bukti yang jujur, dan kesatria yang sempurna. Ia tidak lebih bijak dalam studi agama daripada dirinya; ia meninggal pada malam Kamis, tanggal lima Jumada al-Akhirah, tahun enam ratus dua puluh tiga dan dimakamkan di samping pamannya, Sheikh Muwaffaq al-Din {cite:shadharat-dhahab, hlm. 107}."
