label:
  ar: أبو زيان محمد بن عثمان
  en: Abu Ziyan Muhammad ibn Uthman
  fr: "Abu Ziyan Muhammad ibn Uthman"
  es: "Abu Ziyan Muhammad ibn Uthman"
summary:
  ar: "أبو زيان محمد بن عثمان بن يغمراسن الثالث من ملوك بني عبد الواد؛ قام بالأمر من بعد أبيه إذ هلك بالديماس خامس سنين حصار يوسف بن يعقوب المريني لتلمسان سنة ثلاث وسبعمائة، وأخوه أبو حمو موسى أمّل على الناس أن سلطانهم الأخ الأكبر أبو زيان، فصبرت المدينة حتى تمام ثمانية سنين وثلاثة أشهر نالهم فيها من الجهد والجوع ما لم ينل أمة من الأمم حتى أكلوا الجيف والقطط والفيران وأشلاء الموتى وخربوا السقوف للوقود وبلغ مكيال القمح مثقالين ونصفاً من الذهب والهر بمثقال ونصف، ثم قتل يوسف بن يعقوب على يد خصي من العبدي طعنه بخنجر ففسقوا به ومزقوا أشلاءه، وأذهب الله العناءة عن آل زيان كأنما نشروا من الأجداث وكتبوا في سكتهم ما أقرب فرج الله استغراباً لحادثتها."
  en: "Abu Ziyan Muhammad ibn Uthman ibn Yaghmurasan, third of the Abd al-Wadid kings; he took the rule when his father died of dysentery in the fifth year of Yusuf ibn Ya'qub's siege of Tlemcen in 703 — his brother Abu Hammu Musa answering the troops that their sultan was the elder brother Abu Ziyan — and the city endured to a full eight years and three months, eating carrion, cats, mice and the dead, tearing roofs for fuel, a measure of wheat at two and a half mithqals of gold and a cat at one and a half, until Yusuf ibn Ya'qub was stabbed by a eunuch slave and torn limb from limb — 'and God lifted the affliction from the house of Ziyan as if they had been raised from the graves', their mint striking 'how near is God's relief' in wonder at it."
  fr: "Abu Ziyan Muhammad ibn Uthman ibn Yaghmurasan, troisième roi des Abd al-Wad ; il prit le pouvoir à la mort de son père, emporté par la dysenterie durant la cinquième année du siège de Tlemcen par Yusuf ibn Ya'qub en 703 H — son frère Abu Hammu Musa répondant aux troupes que leur sultan était le frère aîné Abu Ziyan. La ville résista huit ans et trois mois, mangeant charognes, chats, souris et morts, arrachant les toits pour se chauffer ; la mesure de blé coûtait deux mithqals et demi d'or et un chat un mithqal et demi. Yusuf ibn Ya'qub fut finalement poignardé par un esclave eunuque et démembré ; « Dieu leva l'épreuve de la maison de Ziyan comme s'ils avaient été relevés des tombes », et leur monnaie porta « Comme le secours de Dieu est proche », en signe d'émerveillement."
  es: "Abu Ziyan Muhammad ibn Uthman ibn Yaghmurasan, tercero de los reyes Abd al-Wadid; tomó el poder cuando su padre murió de disentería en el quinto año del asedio de Tremecén por Yusuf ibn Ya'qub en 703 —su hermano Abu Hammu Musa respondió a las tropas que su sultán era el hermano mayor Abu Ziyan— y la ciudad resistió durante ocho años y tres meses, comiendo carroña, gatos, ratones y muertos, arrancando techos para combustible, una medida de trigo a dos mithqals y medio de oro y un gato a uno y medio, hasta que Yusuf ibn Ya'qub fue apuñalado por un esclavo eunuco y despedazado miembro a miembro — 'y Dios levantó la aflicción de la casa de Ziyan como si hubieran resucitado de las tumbas', su ceca acuñó 'cuán cerca está el alivio de Dios' con asombro ante ello."
