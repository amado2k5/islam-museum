  ar: "لاعب كرة قدم مغربي محترف (وُلد سنة 1987 في ناردن بهولندا لأبوين من الريف المغربي)، جناح لعب لأيندهوفن وغلطة سراي وواتفورد والنصر السعودي وأيك أثينا وغيرها، وخاض 64 مباراة دولية مع المغرب وشارك في كأس العالم 2018، وهو الأخ الأكبر لسفيان أمرابط."
