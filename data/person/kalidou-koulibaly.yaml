summary:
  ar: "لاعب كرة قدم سنغالي محترف (وُلد سنة 1991 في سينت ديه دي فوج بفرنسا). قلب دفاع صعد عبر متز وغنك إلى ثمانية مواسم مع نابولي، ثم تشيلسي، ومنذ 2023 مع الهلال السعودي؛ يقود منتخب السنغال الذي قاده إلى لقب كأس أمم أفريقيا 2021، وعُرف بمواقفه العلنية ضد العنصرية في كرة القدم الإيطالية."
  en: "Senegalese professional footballer (born 1991 in Saint-Dié-des-Vosges, France). A centre-back who rose through Metz and Genk to eight seasons at Napoli, then Chelsea and, from 2023, Al-Hilal in Saudi Arabia; he captains Senegal, whom he led to the 2021 Africa Cup of Nations title, and is known for speaking out against racism in Italian football."
  ur: "سینیگالی پیشہ ور فٹبالر (پیدائش 1991، سینٹ ڈیے دے ووج، فرانس)۔ قلبِ دفاع کے کھلاڑی جو میٹز اور گنک سے ہوتے ہوئے ناپولی میں آٹھ سیزن کھیلے، پھر چیلسی اور 2023 سے الہلال (سعودی عرب) میں ہیں؛ وہ سینیگال کے کپتان ہیں جسے انہوں نے 2021 افریقہ کپ آف نیشنز کے خطاب تک پہنچایا، اور اطالوی فٹبال میں نسل پرستی کے خلاف آواز اٹھانے کے لیے جانے جاتے ہیں۔"
