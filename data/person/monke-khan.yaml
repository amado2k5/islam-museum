label:
  ar: منكوفان بن طولي
  en: Monke Khan ibn Tolui
summary:
  ar: "منكوفان بن طولي بن جنكزخان، الخان الأعظم؛ ولى بعد أوكداي وولى أولاد جفتاي عمهم على ما وراء النهر إمضاء لوصية جنكزخان لأبيهم، وحسن له أخوه بركة ملك القفجاق الاستيلاء على أعمال الخلافة فأذن له فيه، وعلم بأمر الإسماعيلية وفسادهم فجهز أخاه هلاكو لقتالهم واستئصالهم وغزو بلاد الخطا مع أخيه قبلاي، فأوقع هلاكو بالملاحدة وفتح قلاعهم ثم سار إلى بغداد فكانت له الواقعة المشهورة."
  en: "Monke ibn Tolui ibn Genghis Khan, the Great Khan; ruling after Ogedei he set Chaghatay's sons under their uncle over Transoxiana by Genghis's bequest — his brother Berke of the Qipchaq urged him to seize the caliphate's domains and he assented, and informed of the Ismailis' corruption he dispatched his brother Hulagu to exterminate them and conquer Khita with their brother Qubilai; Hulagu crushed the Mulahida's castles then marched on Baghdad to the famous catastrophe."
