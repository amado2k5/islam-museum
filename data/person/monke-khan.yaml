label:
  ar: منكوفان بن طولي
  en: Monke Khan ibn Tolui
  es: "Monke Khan ibn Tolui"
  fr: "Monke Khan ibn Tolui"
summary:
  ar: "منكوفان بن طولي بن جنكزخان، الخان الأعظم؛ ولى بعد أوكداي وولى أولاد جفتاي عمهم على ما وراء النهر إمضاء لوصية جنكزخان لأبيهم، وحسن له أخوه بركة ملك القفجاق الاستيلاء على أعمال الخلافة فأذن له فيه، وعلم بأمر الإسماعيلية وفسادهم فجهز أخاه هلاكو لقتالهم واستئصالهم وغزو بلاد الخطا مع أخيه قبلاي، فأوقع هلاكو بالملاحدة وفتح قلاعهم ثم سار إلى بغداد فكانت له الواقعة المشهورة."
  en: "Monke ibn Tolui ibn Genghis Khan, the Great Khan; ruling after Ogedei he set Chaghatay's sons under their uncle over Transoxiana by Genghis's bequest — his brother Berke of the Qipchaq urged him to seize the caliphate's domains and he assented, and informed of the Ismailis' corruption he dispatched his brother Hulagu to exterminate them and conquer Khita with their brother Qubilai; Hulagu crushed the Mulahida's castles then marched on Baghdad to the famous catastrophe."
  es: "Monke ibn Tolui ibn Genghis Khan, el Gran Khan, que gobernó después de Ogodei, puso a los hijos de Chagatai bajo el mando de su tío en Transoxiana por legado de Genghis. Su hermano Berke de los Qipchaq le instó a apoderarse de los dominios del califato y él accedió. Informado de la corrupción de los ismaelitas, envió a su hermano Hulagu para exterminarlos y conquistar Khita con su hermano Qubilai. Hulagu aplastó los castillos de los mulahidas y luego marchó sobre Bagdad, donde se produjo la famosa catástrofe."
  fr: "Monke ibn Tolui ibn Gengis Khan, le Grand Khan, régnant après Ogedei, plaça les fils de Chaghatay sous l'autorité de leur oncle sur la Transoxiane par legs de Gengis Khan — son frère Berke des Qipchaq l'exhorta à s'emparer des domaines du califat et il y consentit, et informé de la corruption des Ismaéliens, il envoya son frère Hulagu les exterminer et conquérir Khita avec leur frère Qubilai; Hulagu écrasa les châteaux des Mulahida puis marcha sur Bagdad vers la fameuse catastrophe."
