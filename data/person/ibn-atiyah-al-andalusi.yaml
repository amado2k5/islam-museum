summary:
  ar: "أبو محمد عبد الحق بن غالب بن عطية المحاربي الغرناطي (481–541هـ)، فقيه مالكي ومفسّر وأديب أندلسي، ولي قضاء المرية سنة 529هـ، وصاحب «المحرر الوجيز في تفسير الكتاب العزيز» الذي بدأه في حياة أبيه وأثّر في القرطبي وابن جزي وأبي حيان والثعالبي."
  en: "Abu Muhammad Abd al-Haqq ibn Ghalib ibn Atiyya al-Muharibi of Granada (481–541 AH / 1088–1147), Andalusian Maliki jurist, exegete and man of letters, judge of Almería from 529 AH, and author of al-Muharrar al-Wajiz, a commentary he began in his father's lifetime and which shaped al-Qurtubi, Ibn Juzayy, Abu Hayyan and al-Tha'alibi."
  ur: "ابو محمد عبد الحق بن غالب بن عطیہ المحاربی الغرناطی (481–541ھ / 1088–1147ء)، اندلسی مالکی فقیہ، مفسر اور ادیب، 529ھ سے المریہ کے قاضی، اور «المحرر الوجیز» کے مصنف، جو انہوں نے اپنے والد کی زندگی میں شروع کی اور جس نے قرطبی، ابن جزی، ابو حیان اور ثعالبی کو متاثر کیا۔"
