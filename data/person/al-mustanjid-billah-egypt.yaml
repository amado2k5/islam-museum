label: { ar: "المستنجد بالله يوسف بن المتوكل", en: "al-Mustanjid bi'llah Yusuf ibn al-Mutawakkil", fr: "al-Mustanjid bi'llah Yusuf ibn al-Mutawakkil", es: "al-Mustanjid bi'llah Yusuf ibn al-Mutawakkil", ur: "المستنجد باللہ یوسف بن المتوکل" }
summary:
  ar: "خليفة القاهرة [٨٥٩–٨٨٤هـ] وهو خليفة عصر المؤلف، أبو المحاسن يوسف بن المتوكل، ولي الخلافة بعد خلع أخيه والسلطان يومئذ الأشرف إينال فقلد المؤيد أحمد بن جقمق ثم الظاهر خشقدم ثم يلباي ثم تمربغا ثم قايتباي الأشرف، وأول ما قلد خشقدم قدم نائب الشام جانم فأمر بطلوع الخليفة والقضاة الأربعة والعسكر إلى القلعة ثم لم يمكنه الظاهر من عوده إلى سكنه فاستمر بها إلى أن مات يوم السبت رابع عشري المحرم سنة أربع وثمانين وثمان مئة بعد تمرضه نحو عامين بالفالج وصلي عليه بالقلعة ثم أنزل إلى مدفن الخلفاء بجوار المشهد النفيسي وقد بلغ التسعين أو جاوزها {cite:tarikh-khulafa-minhaj-1434 p. 776-777}."
  en: "The author's own reigning caliph [859–884], investing five sultans ending with Qaytbay; confined to the citadel by Khushqadam after Janim's bid, he died there Saturday 14 Muharram 884 near ninety, and was buried in the Abbasid cemetery by the Nafisa shrine {cite:tarikh-khulafa-minhaj-1434 p. 776-777}."
  fr: "Le propre calife régnant de l'auteur [859-884], investissant cinq sultans se terminant par Qaytbay  ; confiné à la citadelle par Khushqadam après la demande de Janim, il y mourut samedi 14 Muharram 884 près de quatre-vingt-dix, et fut enterré dans le cimetière Abbasside par le sanctuaire Nafisa {cite:tarikh-khulafa-minhaj-1434 p. 776-777}."
  es: "El propio califa reinante del autor [859–884], que investió a cinco sultanes, terminando con Qaytbay; confinado a la ciudadela por Khushqadam después del intento de Janim, murió allí el sábado 14 de Muharram de 884 cerca de los noventa años, y fue enterrado en el cementerio abasí junto al santuario de Nafisa {cite:tarikh-khulafa-minhaj-1434 p. 776-777}."
  ur: "مصنف کا اپنا حکمران خلیفہ [859-884]، قیتبے پر ختم ہونے والے پانچ سلطانوں کی سرمایہ کاری؛ جانیم کی بولی کے بعد خوشقدم کے قلعے تک محدود رہے، وہ وہاں 14 محرم 884 بروز ہفتہ نوے کے قریب انتقال کر گئے، اور نفیسہ کے مزار کے پاس عباسی قبرستان میں دفن ہوئے۔ 776-777}۔"
