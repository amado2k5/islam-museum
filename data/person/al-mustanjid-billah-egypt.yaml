label: { ar: "المستنجد بالله يوسف بن المتوكل" }
summary:
  ar: "خليفة القاهرة [٨٥٩–٨٨٤هـ] وهو خليفة عصر المؤلف، أبو المحاسن يوسف بن المتوكل، ولي الخلافة بعد خلع أخيه والسلطان يومئذ الأشرف إينال فقلد المؤيد أحمد بن جقمق ثم الظاهر خشقدم ثم يلباي ثم تمربغا ثم قايتباي الأشرف، وأول ما قلد خشقدم قدم نائب الشام جانم فأمر بطلوع الخليفة والقضاة الأربعة والعسكر إلى القلعة ثم لم يمكنه الظاهر من عوده إلى سكنه فاستمر بها إلى أن مات يوم السبت رابع عشري المحرم سنة أربع وثمانين وثمان مئة بعد تمرضه نحو عامين بالفالج وصلي عليه بالقلعة ثم أنزل إلى مدفن الخلفاء بجوار المشهد النفيسي وقد بلغ التسعين أو جاوزها {cite:tarikh-khulafa-minhaj-1434 p. 776-777}."
  en: "The author's own reigning caliph [859–884], investing five sultans ending with Qaytbay; confined to the citadel by Khushqadam after Janim's bid, he died there Saturday 14 Muharram 884 near ninety, and was buried in the Abbasid cemetery by the Nafisa shrine {cite:tarikh-khulafa-minhaj-1434 p. 776-777}."
