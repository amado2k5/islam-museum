label:
  ar: الملك العزيز عماد الدين عثمان بن صلاح الدين
  en: al-Malik al-Aziz Imad al-Din Uthman ibn Salah al-Din
  ur: الملک العزیز عماد الدین عثمان
  es: "al-Malik al-Aziz Imad al-Din Uthman ibn Salah al-Din"
  fr: "al-Malik al-Aziz Imad al-Din Uthman ibn Salah al-Din"
summary:
  ar: ابن صلاح الدين، استقرت له مصر لما مات أبوه سنة تسع وثمانين وخمس مئة {cite:tarikh-khulafa-minhaj-1434 p. 693}، ومات سنة
    خمس وتسعين فأقيم ابنه المنصور فوثب عمه الملك العادل سيف الدين أبو بكر بن أيوب وتملكها {cite:tarikh-khulafa-minhaj-1434
    p. 694}.
  en: Salah al-Din's son; Egypt settled for him on his father's death in 589 {cite:tarikh-khulafa-minhaj-1434 p. 693}.
  ur: صلاح الدین کے بیٹے؛ ان کے والد کی 589ھ میں وفات کے بعد مصر کا اقتدار ان کے پاس رہا۔ {cite:khitat-maqrizi-1998}
  es: "Hijo de Salah al-Din; Egipto se estableció en su favor tras la muerte de su padre en 589 {cite:tarikh-khulafa-minhaj-1434 p. 693}."
  fr: "Le fils de Salah al-Din; l'Égypte s'est installée pour lui à la mort de son père en 589 {cite:tarikh-khulafa-minhaj-1434 p. 693}."
  tr: "Mısır'dan İbn Salah al-Din, babası 589 Hicri yılında öldüğünde ona yerleşti {cite:History-Khulafa-minhaj-1434 s. 693} ve o 95 yılında vefat etti, böylece oğlu Al-Mansur kuruldu ve amcası adil Seyfeddin Ebu Bekir ibn Eyyub atlayıp mülkiyete geçti {cite:History-Khulafa-minhaj-1434, s. 694}."
  id: "Ibn Salah al-Din, Mesir menetapkannya ketika ayahnya meninggal pada tahun 589 H {cite:History-Khulafa-minhaj-1434 hlm. 693}, dan ia meninggal pada tahun 95, sehingga putranya Al-Mansur didirikan, dan pamannya, Raja yang adil Sayf al-Din Abu Bakr ibn Ayyub melompat dan mengambil alih {cite:History-Khulafa-minhaj-1434, hlm. 694}."
