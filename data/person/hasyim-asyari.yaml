  ar: "عالم إندونيسي وبطل قومي، أسس جمعية نهضة العلماء سنة 1926 ومدرسة تيبويرينغ الشرعية سنة 1899، وهي من أكبر المدارس الدينية في جاوة. تختلف المصادر في سنة ولادته بين 1871 و1875، وتوفي سنة 1947."
