  ur: "ابگا ابن ہلاگ"
summary:
  ar: "أبغا بن هلاكو، ثاني إيلخانات بني هلاكو بالعراق؛ ولي بعد أبيه سنة 663هـ، وزحف سنة 680هـ إلى بلاد الشام في مظاهرة منكوتمر ملك الدست بالشمال فنازل حماة مع أخيه منكوتمر وزحف إليهم المنصور قلاوون ملك مصر والشام من دمشق فلقيهم بظاهر حمص وكانت الدائرة على ملوك التتر وهلك خلق من عساكرهم وأسر آخرون، وأجفل أبغا من منازلة الرحبة ورجع إلى بلاده منهزماً."
  en: "Abaga ibn Hulagu, second Ilkhan of the Hulaguid line in Iraq; succeeding his father in 663 AH he marched on Syria in 680 in concert with Mengu-Timur, king of the northern Dasht, camped at Hama with his brother Mongke-Timur, and al-Mansur Qalawun of Egypt and Syria met them outside Homs — the day went against the Tatar kings, many were slain and captured, and Abaga fled from the Rahba camping-ground back to his lands defeated."
  fr: "Abaga ibn Hulagu, deuxième ilkhan de la lignée houlagide en Irak ; succédant à son père en 663 H, il marcha sur la Syrie en 680 de concert avec Mengu-Timur, roi du Dasht septentrional, campa à Hama avec son frère Mongke-Timur, et al-Mansur Qalawun d'Égypte et de Syrie les affronta devant Homs — la journée tourna contre les rois tatars, beaucoup furent tués ou capturés, et Abaga s'enfuit du campement de la Rahba vers ses terres, vaincu."
  es: "Abaga ibn Hulagu, segundo Ilkhan de la línea Hulaguid en Irak; sucediendo a su padre en el año 663 de la Hégira, marchó sobre Siria en el año 680 junto con Mengu-Timur, rey del Dasht del norte, acampó en Hama con su hermano Mongke-Timur, y al-Mansur Qalawun de Egipto y Siria los recibió a las afueras de Homs; el día fue adverso para los reyes tártaros, muchos fueron asesinados y capturados, y Abaga huyó del campamento de Rahba de regreso a sus tierras derrotado."
  ur: "ابگا ابن ہلاگو، عراق میں حلاگائڈ لائن کا دوسرا الخان؛ 663 ہجری میں اپنے والد کے بعد اس نے 680 میں شمالی دشت کے بادشاہ مینگو تیمور کے ساتھ مل کر شام کی طرف کوچ کیا، اپنے بھائی مونگکے تیمور کے ساتھ حما میں ڈیرہ ڈالا، اور مصر اور شام کے المنصور قلاوون نے حمص کے باہر ان سے ملاقات کی - وہ دن تاتاری بادشاہوں کے خلاف چلا گیا، بہت سے راباہ کو گرفتار کر لیا گیا، اور اس کے بعد تاتاری بادشاہوں کو گرفتار کر لیا گیا۔ کیمپنگ گراؤنڈ شکست کھا کر اپنی سرزمین پر واپس آ گئے۔"
