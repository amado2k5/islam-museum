summary:
  ar: "أبغا بن هلاكو، ثاني إيلخانات بني هلاكو بالعراق؛ ولي بعد أبيه سنة 663هـ، وزحف سنة 680هـ إلى بلاد الشام في مظاهرة منكوتمر ملك الدست بالشمال فنازل حماة مع أخيه منكوتمر وزحف إليهم المنصور قلاوون ملك مصر والشام من دمشق فلقيهم بظاهر حمص وكانت الدائرة على ملوك التتر وهلك خلق من عساكرهم وأسر آخرون، وأجفل أبغا من منازلة الرحبة ورجع إلى بلاده منهزماً."
  en: "Abaga ibn Hulagu, second Ilkhan of the Hulaguid line in Iraq; succeeding his father in 663 AH he marched on Syria in 680 in concert with Mengu-Timur, king of the northern Dasht, camped at Hama with his brother Mongke-Timur, and al-Mansur Qalawun of Egypt and Syria met them outside Homs — the day went against the Tatar kings, many were slain and captured, and Abaga fled from the Rahba camping-ground back to his lands defeated."
