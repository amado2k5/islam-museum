id: person/al-hadi-musa
class: person
label: { ar: "الهادي موسى", en: "al-Hadi Musa" }
summary:
  ar: "موسى بن المهدي الهادي؛ عند البلاذري نزل مدينة السلام وتوفي بها، وعند السيوطي أمه الخيزران أم ولد بربرية ولد بالري سنة سبع وأربعين ولم يل الخلافة قبله أحد في سنه وكان أبوه أوصاه بقتل الزنادقة فجد في أمرهم وكان يسمى موسى أطبق لانقباض شفته العليا، وهو أول من مشت الرجال بين يديه بالسيوف المرهفة والأعمدة والقسي الموترة فكثر السلاح في عصره، وقال الصولي لا يعرف خليفة ركب البريد إلا الهادي من جرجان إلى بغداد وكان نقش خاتمه الله ثقة موسى وبه يؤمن {cite:tarikh-khulafa-minhaj-1434 p. 451-453}، وعند المسعودي أن الهادي كان جباراً عظيماً وأول من مست الرجال بين يديه بالسيوف المرهفة والأعمدة المشهورة والقسي الموتورة فسلكت عماله طريقته {cite:muruj-al-dhahab p. 669-670}، وعند المسعودي كان قاسي القلب شرس الأخلاق شديداً شجاعاً، وقد ظهر على خارجي أقبل إليه بسيف وهو على حماره فأوهمه أن وراءه أحداً فلما التفت صرعه وأخذ سيفه فضرب عنقه ولم يعد يفارق سيفه، واستوزر الربيع ثم ولى عمر بن بزيع الوزارة وديوان الرسائل وأفرد الربيع بالزمام فمات وقيل سقاه شربة، وظهر في أيامه الحسين بن علي صاحب فخ يوم التروية على ستة أميال من مكة {cite:muruj-al-dhahab p. 314-316}، وأراد خلع الرشيد من ولاية العهد لابنه جعفر فنبهه يحيى بن خالد أن يترك بيعة أخيه على حالها ويبيع لجعفر بعده كان آكد، ولما قال لهارون كأني بك تحدث نفسك بتمام الرؤيا أجابه هارون إن وصل الأمر إلي وصلت من قطعت وبررت من حرمت فأمر له بألف ألف دينار ونصف الخراج، وكان المهدي رأى أنه دفع إلى موسى قضيباً أورق أعلاه قليلاً وإلى هارون قضيباً أورق من أوله إلى آخره فعبرها الحكيم ابن إسحاق الصيمري أن موسى تقل أيامه وهارون يبلغ آخر ما عاش خليفة، وفي ليلة موته قال للخيزران أنا هالك في هذه الليلة وفيها يلي أخي هارون وفيها مولد المأمون {cite:muruj-al-dhahab p. 321-323}، وقال العبدي عند المسعودي كان جباراً عظيماً وأول من مست الرجال بين يديه بالسيوف المرهفة والأعمدة المشهورة والقسي الموتورة فسلكت عماله طريقته وكثر السلاح في عصره {cite:muruj-al-dhahab p. 670}"
  en: "Musa ibn al-Mahdi, al-Hadi; in al-Baladhuri he dwelt at Madinat al-Salam and died there."
