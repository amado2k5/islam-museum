id: person/al-hadi-musa
class: person
label: { ar: "الهادي موسى", en: "al-Hadi Musa" }
summary:
  ar: "موسى بن المهدي الهادي؛ عند البلاذري نزل مدينة السلام وتوفي بها، وعند السيوطي أمه الخيزران أم ولد بربرية ولد بالري سنة سبع وأربعين ولم يل الخلافة قبله أحد في سنه وكان أبوه أوصاه بقتل الزنادقة فجد في أمرهم وكان يسمى موسى أطبق لانقباض شفته العليا، وهو أول من مشت الرجال بين يديه بالسيوف المرهفة والأعمدة والقسي الموترة فكثر السلاح في عصره، وقال الصولي لا يعرف خليفة ركب البريد إلا الهادي من جرجان إلى بغداد وكان نقش خاتمه الله ثقة موسى وبه يؤمن {cite:tarikh-khulafa-minhaj-1434 p. 451-453}، وعند المسعودي أن الهادي كان جباراً عظيماً وأول من مست الرجال بين يديه بالسيوف المرهفة والأعمدة المشهورة والقسي الموتورة فسلكت عماله طريقته {cite:muruj-al-dhahab p. 669-670}"
  en: "Musa ibn al-Mahdi, al-Hadi; in al-Baladhuri he dwelt at Madinat al-Salam and died there."
