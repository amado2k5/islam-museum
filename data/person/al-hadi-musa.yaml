id: person/al-hadi-musa
class: person
label: { ar: "الهادي موسى", en: "al-Hadi Musa", fr: "Al-Hadi Musa", es: "al-Hadi Musa", ur: "الہادی موسیٰ" }
summary:
  ar: "موسى بن المهدي الهادي؛ عند البلاذري نزل مدينة السلام وتوفي بها، وعند السيوطي أمه الخيزران أم ولد بربرية ولد بالري سنة سبع وأربعين ولم يل الخلافة قبله أحد في سنه وكان أبوه أوصاه بقتل الزنادقة فجد في أمرهم وكان يسمى موسى أطبق لانقباض شفته العليا، وهو أول من مشت الرجال بين يديه بالسيوف المرهفة والأعمدة والقسي الموترة فكثر السلاح في عصره، وقال الصولي لا يعرف خليفة ركب البريد إلا الهادي من جرجان إلى بغداد وكان نقش خاتمه الله ثقة موسى وبه يؤمن {cite:tarikh-khulafa-minhaj-1434 p. 451-453}، وعند المسعودي أن الهادي كان جباراً عظيماً وأول من مست الرجال بين يديه بالسيوف المرهفة والأعمدة المشهورة والقسي الموتورة فسلكت عماله طريقته {cite:muruj-al-dhahab p. 669-670}، وعند المسعودي كان قاسي القلب شرس الأخلاق شديداً شجاعاً، وقد ظهر على خارجي أقبل إليه بسيف وهو على حماره فأوهمه أن وراءه أحداً فلما التفت صرعه وأخذ سيفه فضرب عنقه ولم يعد يفارق سيفه، واستوزر الربيع ثم ولى عمر بن بزيع الوزارة وديوان الرسائل وأفرد الربيع بالزمام فمات وقيل سقاه شربة، وظهر في أيامه الحسين بن علي صاحب فخ يوم التروية على ستة أميال من مكة {cite:muruj-al-dhahab p. 314-316}، وأراد خلع الرشيد من ولاية العهد لابنه جعفر فنبهه يحيى بن خالد أن يترك بيعة أخيه على حالها ويبيع لجعفر بعده كان آكد، ولما قال لهارون كأني بك تحدث نفسك بتمام الرؤيا أجابه هارون إن وصل الأمر إلي وصلت من قطعت وبررت من حرمت فأمر له بألف ألف دينار ونصف الخراج، وكان المهدي رأى أنه دفع إلى موسى قضيباً أورق أعلاه قليلاً وإلى هارون قضيباً أورق من أوله إلى آخره فعبرها الحكيم ابن إسحاق الصيمري أن موسى تقل أيامه وهارون يبلغ آخر ما عاش خليفة، وفي ليلة موته قال للخيزران أنا هالك في هذه الليلة وفيها يلي أخي هارون وفيها مولد المأمون {cite:muruj-al-dhahab p. 321-323}، وقال العبدي عند المسعودي كان جباراً عظيماً وأول من مست الرجال بين يديه بالسيوف المرهفة والأعمدة المشهورة والقسي الموتورة فسلكت عماله طريقته وكثر السلاح في عصره {cite:muruj-al-dhahab p. 670}"
  en: "Musa ibn al-Mahdi, al-Hadi; in al-Baladhuri he dwelt at Madinat al-Salam and died there."
  fr: "Musa ibn al-Mahdi, al-Hadi ; chez al-Baladhuri, il résida à Madinat al-Salam et y mourut."
  es: "Musa ibn al-Mahdi, al-Hadi; en al-Baladhuri vivió en Madinat al-Salam y murió allí."
  ur: "موسیٰ بن المہدی، الہدی؛ البلادوری میں مدینۃ السلام میں مقیم ہوئے اور وہیں وفات پائی۔"
  tr: "Musa ibn al-Mahdi al-Hadi; al-Baladhuri'ye göre Bağdat'a yerleşmiş ve orada ölmüştür. al-Suyuti'ye göre annesi, Berberi bir cariye olan al-Khayzuran'dı. Hicri 47 yılında Rayy'da doğdu ve ondan önce kendi çağında halifelik makamını elinde tutan kimse yoktu. Babası ona sapkınları öldürmesini emretmişti ve bu konuda çok gayretliydi. Üst dudağının büzülmesinden dolayı Musa Atbak olarak anılırdı. Önünde keskin kılıçlar, mızraklar ve yaylar taşıyan adamların yürümesini sağlayan ilk halifeydi, böylece silahlar onun döneminde yaygınlaştı. Al-Suli, al-Hadi'nin Jurjan'dan Bağdat'a posta yoluyla seyahat etmesi dışında hiçbir halifenin bilinmediğini ve yüzüğündeki yazının şu olduğunu söyledi: \"Allah, Musa'nın emanetidir ve O'na inanır.\" {kaynak:tarikh-khulafa-minhaj-1434 s. 451-453}. El-Mas'udi'ye göre, el-Hadi büyük bir zalimdi ve keskin kılıçlar, ünlü mızraklar ve gerilmiş yaylarla adamlarını önünde yürüten ilk kişiydi ve memurları da onun örneğini izledi. {kaynak:muruj-al-dhahab s. 669-670} El-Mas'udi'ye göre, acımasız, sert karakterli ve cesurdu. Eşeğinin üzerindeyken kendisine kılıçla yaklaşan bir Harici'ye karşı çıktı ve arkasında biri olduğunu düşündürdü. Adam arkasını döndüğünde, onu alt etti, kılıcını aldı ve kafasını kesti; adam bir daha kılıcından ayrılmadı. El-Rabi' vezir olarak atandı, sonra Ömer ibn Bazi'yi vezir ve veznedar başı olarak atadı ve El-Rabi'yi yönetimden sorumlu bıraktı. Öldü ve kendisine içki verildiği söylenir. Hüseyin ibn Ali, Fakh'ın sahibi, Mekke'ye altı mil uzaklıktaki Tarviye günü ortaya çıktı (314-316). Oğlu Cafer lehine Reşid'i haleflik çizgisinden çıkarmak istedi. Bunun üzerine Yahya bin Halid, ona kardeşine olan biatını olduğu gibi bırakmasını ve ondan sonra daha kesin olan Cafer'e biat etmesini tavsiye etti. Yahya bin Halid, Harun'a, \"Sanki kendi kendine görümünün gerçekleşmesi hakkında konuşuyorsun gibi geliyor bana\" dediğinde, Harun ona, \"Eğer mesele bana gelirse, kestiğim kimselerle bağlantı kuracağım ve mahrum bıraktığım kimselere adaletli davranacağım\" diye cevap verdi. Bunun üzerine Yahya bin Halid, Harun'a bir milyon dinar ve verginin yarısını emretti. Mehdi, Musa'ya ucu biraz filizlenmiş bir asa, Harun'a ise tüm uzunluğu filizlenmiş bir asa verdiğini görmüştü. Bilge İbn İshak el-Samari bunu, Musa'nın günlerinin az olduğu ve Harun'un halife olarak ömrünün sonuna yaklaştığı şeklinde yorumlamıştır. Ölüm gecesinde ise Hayzuran'a şöyle demiştir: \"Bu gece öleceğim ve bu gece kardeşim Harun halifeliğimi devralacak ve bu gece de Me'mun doğacak.\" {kaynak: Muruj-al-Dhahab s. 321-323} El-Abdi, El-Mas'udi'ye göre, Musa'nın büyük bir zalim olduğunu ve adamlarını kendisine keskin kılıçlarla, ünlü mızraklarla ve gergin yaylarla saldırtan ilk kişi olduğunu söylemiştir. İşçileri de onun örneğini izlemiş ve zamanında silahlar bollaşmıştır. {kaynak: Muruj-al-Dhahab s. 670}"
  id: "Musa ibn al-Mahdi al-Hadi; menurut al-Baladhuri, ia menetap di Baghdad dan meninggal di sana. Menurut al-Suyuti, ibunya adalah al-Khayzuran, seorang selir Berber. Ia lahir di Rayy pada tahun 47 H, dan belum pernah ada orang seusianya yang memegang kekhalifahan sebelum dia. Ayahnya telah memerintahkannya untuk membunuh kaum bid'ah, dan dia tekun dalam hal ini. Ia disebut Musa Atbaq karena bibir atasnya yang mengerut. Dialah orang pertama yang memerintahkan orang-orang untuk berbaris di depannya dengan pedang tajam, galah, dan busur yang ditarik, sehingga senjata menjadi umum di zamannya. Al-Suli mengatakan bahwa tidak ada khalifah yang diketahui melakukan perjalanan melalui pos kecuali al-Hadi dari Jurjan ke Baghdad, dan tulisan pada cincinnya adalah: Allah adalah amanah Musa, dan kepada-Nya dia beriman. {cite:tarikh-khulafa-minhaj-1434 pp. 451-453}. Menurut al-Mas'udi, al-Hadi adalah seorang tiran besar dan orang pertama yang memerintahkan orang-orang untuk berbaris di hadapannya dengan pedang tajam, tongkat terkenal, dan busur terhunus, dan para pejabatnya mengikuti teladannya. {cite:muruj-al-dhahab hlm. 669-670}, dan menurut Al-Mas’udi, ia berhati keras, berkarakter garang, dan pemberani. Ia menghadapi seorang Kharijite yang mendekatinya dengan pedang saat ia sedang menunggang keledai, sehingga ia membuatnya berpikir bahwa ada seseorang di belakangnya. Ketika orang itu berbalik, ia mengalahkannya, mengambil pedangnya, dan memenggal kepalanya, dan ia tidak pernah berpisah dengan pedangnya lagi. Al-Rabi’ diangkat menjadi wazir, kemudian ia mengangkat Umar ibn Bazi’ sebagai wazir dan kepala kantor pemerintahan, dan ia menyerahkan kendali kepada Al-Rabi’. Ia meninggal, dan konon ia diberi minuman. Pada masanya, Al-Husayn ibn Ali, pemilik Fakh, muncul pada hari Tarwiyah, enam mil dari Mekah. 314-316}, dan ia ingin menyingkirkan Al-Rashid dari garis suksesi demi putranya Ja'far, maka Yahya bin Khalid menasihatinya untuk membiarkan baiat kepada saudaranya tetap seperti semula dan untuk berbaiat kepada Ja'far setelahnya, yang lebih pasti. Dan ketika ia berkata kepada Harun, “Seolah-olah aku melihatmu berbicara sendiri tentang penyelesaian penglihatan itu,” Harun menjawabnya, “Jika masalah itu sampai kepadaku, aku akan berhubungan dengan mereka yang telah kusingkirkan dan aku akan adil kepada mereka yang telah kurampas haknya.” Maka ia memerintahkan untuknya satu juta dinar dan setengah dari upeti. Dan Al-Mahdi telah melihat bahwa ia memberikan kepada Musa sebuah tongkat yang ujungnya sedikit bertunas, dan kepada Harun sebuah tongkat yang seluruhnya bertunas. Maka Ibnu Ishaq Al-Saymari yang bijaksana menafsirkannya sebagai hari-hari Musa yang tinggal sedikit dan Harun mencapai akhir hidupnya sebagai khalifah. Dan pada malam kematiannya, ia berkata kepada Al-Khayzuran, “Aku akan mati malam ini, dan pada malam ini saudaraku Harun akan menggantikanku, dan pada malam ini Al-Ma'mun akan lahir.” {kutipan:muruj-al-dhahab hlm. 321-323} Al-Abdi berkata, menurut Al-Mas'udi, bahwa ia adalah seorang tiran besar dan orang pertama yang ditusuk orang dengan pedang tajam, tiang-tiang terkenal, dan busur yang kuat. Para pekerjanya mengikuti teladannya, dan senjata menjadi berlimpah pada zamannya. {kutipan:muruj-al-dhahab hlm. 670}"
