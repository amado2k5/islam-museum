summary:
  ar: "سياسي سنغالي (وُلد 1926) من كيبيمير، مؤسس الحزب الديمقراطي السنغالي (1974) ورئيس السنغال الثالث (2000–2012) بعد فوزه على عبدو ضيوف، وأُعيد انتخابه سنة 2007 ثم خسر أمام ماكي سال سنة 2012؛ عضو في الطريقة الصوفية المريدية، وبلغ مئة عام في مايو 2026 وهو حي في المصادر كما قُرئت."
  en: "Senegalese politician (born 1926) from Kébémer; founder of the Senegalese Democratic Party (1974) and third president of Senegal (2000–2012) after defeating Abdou Diouf, re-elected in 2007 and then defeated by Macky Sall in 2012; a member of the Mouride Sufi brotherhood, he turned one hundred in May 2026 and is recorded living in the sources as fetched."
  ur: "سینیگال کے سیاست دان (پیدائش 1926ء) جن کا تعلق کیبیمیر سے ہے؛ سینیگال جمہوری پارٹی (1974ء) کے بانی اور سینیگال کے تیسرے صدر (2000ء–2012ء) رہے جنھوں نے عبدو ضیوف کو شکست دی، 2007ء میں دوبارہ منتخب ہوئے اور 2012ء میں ماکی سال سے ہار گئے؛ مریدیہ صوفی سلسلے کے رکن ہیں، مئی 2026ء میں سو سال کے ہوئے اور پڑھے گئے مآخذ کے مطابق زندہ ہیں۔"
