names:
  - { value: "أبو الحسن علي بن قاضي القضاة أبي عبد الله الدامغاني الحنفي", kind: full }
summary:
  ar: "قاضي القضاة الحنفي؛ ولي القضاء عاماً وعشرين سنة وكان ذا حزم ورأي وسؤدد وهيبة وافرة وديانة ظاهرة، تفقه على والده وروى عن أبي محمد الصريفيني وجماعة؛ توفي سنة ثلاث عشرة وخمسمائة في الحرم عن أربع وستين سنة {cite:shadharat-dhahab p. 520}."
  en: "The Hanafi chief qadi Abu al-Hasan al-Damaghani — twenty-two years in office, a man of firmness, dignity and open piety who read fiqh under his father; d. 513 at the Haram, aged sixty-four {cite:shadharat-dhahab p. 520}."
  fr: "Le grand cadi hanafite Abu al-Hasan al-Damaghani — vingt-deux ans en fonction, homme de fermeté, de dignité et de piété manifeste, qui étudia le fiqh auprès de son père ; mort en 513 au Haram, à soixante-quatre ans {cite:shadharat-dhahab p. 520}."
  es: "El cadí principal hanafi Abu al-Hasan al-Damaghani — veintidós años en el cargo, un hombre de firmeza, dignidad y piedad manifiesta que estudió fiqh con su padre; murió en 513 en el Haram, a la edad de sesenta y cuatro años {cite:shadharat-dhahab p. 520}."
  ur: "حنفی سربراہ قاضی ابو الحسن الدمغانی - 22 سال عہدہ پر رہے، ایک مضبوط، وقار اور کھلے تقویٰ کا آدمی جس نے اپنے والد کے ماتحت فقہ پڑھا۔ d 513 حرم میں، چونسٹھ سال کی عمر میں 520}۔"
  tr: "Hanefi mezhebinin Baş Hakimi; yirmi yıl boyunca hakimlik görevini yürüttü. Kararlı, bilge, asil, büyük bir saygınlığa ve apaçık bir dindarlığa sahipti. Babasından fıkıh eğitimi aldı ve Ebu Muhammed el-Şarifini ile bir grup başkasından rivayet etti. 13500 yılında, altmış dört yaşında, Kutsal Mescid'de vefat etti. {Kaynak: Şadharat-Dhaba s. 520}"
  id: "Ketua Mahkamah Agung mazhab Hanafi; beliau menjabat sebagai hakim selama dua puluh satu tahun. Beliau tegas, bijaksana, mulia, memiliki banyak wibawa dan kesalehan yang nyata. Beliau mempelajari ilmu hukum di bawah bimbingan ayahnya dan meriwayatkan hadis dari Abu Muhammad al-Sarifini dan sekelompok ulama lainnya. Beliau wafat pada tahun 13500 di Baitullah pada usia 64 tahun. {cite:shadharat-dhahab p. 520}."
