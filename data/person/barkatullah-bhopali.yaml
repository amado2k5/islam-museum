summary:
  ar: "ثوري هندي (1854–1927) من بوبال. عمل من المنفى في إنجلترا وأمريكا واليابان، حيث عُيّن أستاذًا للهندوستانية في جامعة طوكيو وأسلم على يده أوائل اليابانيين، وكان من مؤسسي حزب غدر في سان فرانسيسكو (1913)، ثم أول رئيس وزراء لحكومة الهند المؤقتة في كابل (1915)، وتوفي في سان فرانسيسكو ودُفن في ساكرامنتو."
  en: "Indian revolutionary (1854–1927) from Bhopal. He worked in exile in England, America and Japan — where he was appointed Professor of Hindustani at the University of Tokyo and the first Japanese converts to Islam are said to have come through him — was a founder of the Ghadar Party at San Francisco (1913), became the first prime minister of the Provisional Government of India at Kabul (1915), and died in San Francisco and was buried at Sacramento."
  ur: "بھوپال کے ہندوستانی انقلابی (1854ء–1927ء)۔ انھوں نے انگلستان، امریکا اور جاپان میں جلاوطنی سے کام کیا — جاپان میں وہ ٹوکیو یونیورسٹی میں ہندوستانی کے پروفیسر بنے اور کہا جاتا ہے کہ پہلے جاپانی ان کے ہاتھ پر مسلمان ہوئے — سان فرانسسکو میں غدر پارٹی (1913ء) کے بانیوں میں شامل ہوئے، کابل کی عبوری حکومت ہند (1915ء) کے پہلے وزیر اعظم بنے، اور سان فرانسسکو میں وفات پا کر ساکرامنٹو میں دفن ہوئے۔"
