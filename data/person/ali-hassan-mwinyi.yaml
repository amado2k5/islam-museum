summary:
  ar: "سياسي تنزاني (1925–2024) عمل معلما ومدير مدرسة في زنجبار نحو عقدين، ثم صار رئيس زنجبار سنة 1984 وثاني رئيس لتنزانيا من 5 نوفمبر 1985 إلى 23 نوفمبر 1995 خلفا لجوليوس نيريري. خفف القيود على الاستيراد وشجع المشروعات الخاصة واتفق مع صندوق النقد الدولي سنة 1986، وبدأ في عهده الثاني الانتقال إلى التعددية الحزبية. نال جائزة الملك فيصل العالمية في خدمة الإسلام سنة 2022، ومات في دار السلام سنة 2024."
  en: "Tanzanian politician (1925–2024) who worked as a teacher and head teacher in Zanzibar for about two decades, then became president of Zanzibar in 1984 and the second president of Tanzania from 5 November 1985 to 23 November 1995, succeeding Julius Nyerere. He relaxed import restrictions, encouraged private enterprise and reached an agreement with the IMF in 1986, and the transition to multi-party politics began in his second term. He received the King Faisal Prize for Service to Islam in 2022 and died at Dar es Salaam in 2024."
  ur: "تنزانیہ کے سیاست دان (1925ء–2024ء) جو زنجبار میں تقریباً دو دہائیوں تک استاد اور صدر مدرس رہے، پھر 1984ء میں زنجبار کے صدر اور 5 نومبر 1985ء سے 23 نومبر 1995ء تک تنزانیہ کے دوسرے صدر رہے، جولیس نیریرے کے جانشین کے طور پر۔ انہوں نے درآمدی پابندیاں نرم کیں، نجی کاروبار کی حوصلہ افزائی کی اور 1986ء میں آئی ایم ایف سے معاہدہ کیا، اور ان کی دوسری مدت میں کثیر الجماعتی سیاست کی طرف منتقلی شروع ہوئی۔ انہیں 2022ء میں خدمتِ اسلام پر شاہ فیصل عالمی انعام ملا اور 2024ء میں دارالسلام میں ان کا انتقال ہوا۔"
