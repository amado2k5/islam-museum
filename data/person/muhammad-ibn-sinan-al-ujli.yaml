  en: "Muhammad ibn Sinan al-Ujli of Banu Ujul's Kufan clients; one of the eighty al-Hajjaj posted to the Daylam ribat, then settled a Dastaba village and built a house in Qazwin's suburb — the frontier folk rebuked him, he built on with his household outside the walls, others followed, and the rabad was completed."
