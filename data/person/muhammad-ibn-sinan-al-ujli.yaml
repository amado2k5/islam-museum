summary:
  ar: "محمد بن سنان العجلي من موالي بني عجل أهل الكوفة؛ كان في الثمانين الذين وجههم الحجاج لمرابطة الديلم ثم نزل قرية من قرى دستبى ثم صار إلى قزوين فبنى داراً في ربضها فعذله أهل الثغر أن عرضت نفسك للتلف وعرضتنا للوهن فلم يلتفت وبنوا معه خارج المدينة حتى تم ربضها."
  en: "Muhammad ibn Sinan al-Ujli of Banu Ujul's Kufan clients; one of the eighty al-Hajjaj posted to the Daylam ribat, then settled a Dastaba village and built a house in Qazwin's suburb — the frontier folk rebuked him, he built on with his household outside the walls, others followed, and the rabad was completed."
  es: "Muhammad ibn Sinan al-Ujli, uno de los clientes de Banu Ujul en Kufa, fue uno de los ochenta al-Hajjaj destinados al ribat de Daylam. Posteriormente, fundó una aldea Dastaba y construyó una casa en las afueras de Qazwin. La gente de la frontera lo reprendió, pero él continuó construyendo con su familia fuera de las murallas. Otros lo siguieron y el rabad quedó terminado."
