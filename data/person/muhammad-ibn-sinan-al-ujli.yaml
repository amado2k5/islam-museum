id: person/muhammad-ibn-sinan-al-ujli
class: person
label: { ar: "محمد بن سنان العجلي", en: "Muhammad ibn Sinan al-Ujli", es: "Muhammad ibn Sinan al-Ujli", fr: "Muhammad ibn Sinan al-Ujli", ur: "محمد بن سنان العجلی" }
summary:
  ar: "محمد بن سنان العجلي من موالي بني عجل أهل الكوفة؛ كان في الثمانين الذين وجههم الحجاج لمرابطة الديلم ثم نزل قرية من قرى دستبى ثم صار إلى قزوين فبنى داراً في ربضها فعذله أهل الثغر أن عرضت نفسك للتلف وعرضتنا للوهن فلم يلتفت وبنوا معه خارج المدينة حتى تم ربضها."
  en: "Muhammad ibn Sinan al-Ujli of Banu Ujul's Kufan clients; one of the eighty al-Hajjaj posted to the Daylam ribat, then settled a Dastaba village and built a house in Qazwin's suburb — the frontier folk rebuked him, he built on with his household outside the walls, others followed, and the rabad was completed."
  es: "Muhammad ibn Sinan al-Ujli, uno de los clientes de Banu Ujul en Kufa, fue uno de los ochenta al-Hajjaj destinados al ribat de Daylam. Posteriormente, fundó una aldea Dastaba y construyó una casa en las afueras de Qazwin. La gente de la frontera lo reprendió, pero él continuó construyendo con su familia fuera de las murallas. Otros lo siguieron y el rabad quedó terminado."
  fr: "Muhammad ibn Sinan al-Ujli, client de Banu Ujul à Kufan; l'un des quatre-vingts al-Hajjaj affectés au ribat de Daylam, s'installa ensuite dans un village de Dastaba et construisit une maison dans la banlieue de Qazwin; les habitants de la frontière le réprimandèrent, il continua à construire avec sa famille à l'extérieur des murs, d'autres suivirent, et le rabad fut achevé."
  ur: "بنو عجل کے کوفان کے مؤکلوں کے محمد بن سنان العجلی؛ اسّی الحجاج میں سے ایک نے دیلم رباط میں تعینات کیا، پھر دستبہ گاؤں آباد کیا اور قزوین کے نواح میں ایک گھر بنایا - سرحدی لوگوں نے اسے ڈانٹا، اس نے اپنے گھر والوں کے ساتھ دیواروں کے باہر تعمیر کیا، دوسروں نے تعاقب کیا، اور رباد مکمل ہوا۔"
  tr: "Muhammed bin Sinan el-Ecli, Banu Ajl'ın Kufe'den kurtarılanlarından biriydi; el-Haccac'ın Daylam istasyonuna gönderdiği seksen kişiden biriydi. Sonra Dastiba'nın bir köyüne yerleşti, ardından Kazvin'e giderek mahallede bir ev inşa etti. El-Tahr halkı, kendini yıkıma maruz bıraktığı ve bizi zayıflattığı için onu mazur gösterdi, ancak o dikkat etmedi ve şehir yerleşene kadar onunla birlikte şehir dışında inşa ettiler."
  id: "Muhammad ibn Sinan al-Ajli adalah salah satu mantan Banu Ajl dari Kufa; ia termasuk di antara delapan puluh orang yang dikirim al-Hajjaj ke stasiun Daylam. Ia kemudian menetap di sebuah desa di Dastiba, kemudian pergi ke Qazvin dan membangun rumah di pinggirannya. Orang-orang al-Thaghr memaafkannya karena mengekspos dirinya pada kehancuran dan melemahkan kita, tetapi ia tidak memperhatikan, dan mereka membangun bersamanya di luar kota sampai kota itu menetap."
