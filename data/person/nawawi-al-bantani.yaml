summary:
  ar: "محمد بن عمر نووي الجاوي، البنتني إقليما، التناري بلدا، مفسر متصوف من فقهاء الشافعية، هاجر إلى مكة وتوفي بها سنة 1316 هـ، وله مراح لبيد في التفسير ونهاية الزين وكاشفة السجا وغيرها."
  en: "Muhammad ibn Umar Nawawi al-Jawi, al-Bantani by province and al-Tanari by town, an exegete, Sufi and Shafi'i jurist who emigrated to Mecca and died there in 1316 AH (1898); author of the exegesis Marah labid, Nihayat al-zayn, Kashifat al-saja and many commentaries."
  es: "Muhammad ibn Umar Nawawi al-Jawi, al-Bantani por provincia y al-Tanari por ciudad, fue un exegeta, jurista sufí y shafi'í que emigró a La Meca y murió allí en 1316 AH (1898); autor de la exégesis Marah labid, Nihayat al-zayn, Kashifat al-saja y muchos comentarios."
  fr: "Muhammad ibn Umar Nawawi al-Jawi, al-Bantani par province et al-Tanari par ville, exégète, juriste soufi et chaféite qui a émigré à La Mecque et y est mort en 1316 AH (1898); auteur de l'exégèse Marah labid, Nihayat al-zayn, Kashifat al-saja et de nombreux commentaires."
