summary:
  ar: "\u0645\u0624\u0630\u0646 \u0633\u0639\u0648\u062f\u064a \u2066(\u0648\u064f\u0644\u062f \u0628\u0627\u0644\u0637\u0627\u0626\u0641 1365\u0647\u0640/1946)\u2069\u060c \u0645\u0624\u0630\u0646 \u0645\u0633\u062c\u062f \u0646\u0645\u0631\u0629 \u0628\u0639\u0631\u0641\u0629 \u0645\u0646\u0630 1410\u0647\u0640 \u0648\u0645\u0624\u0630\u0646 \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u0645\u0646\u0630 \u0645\u062d\u0631\u0645 1415\u0647\u0640\u060c \u0646\u0634\u0623 \u0641\u064a \u062d\u0627\u0631\u0629 \u0627\u0644\u0634\u0627\u0645\u064a\u0629 \u064a\u0633\u0645\u0639 \u0645\u0624\u0630\u0646\u064a \u0627\u0644\u062d\u0631\u0645\u060c \u0648\u0623\u0630\u0651\u0646 \u0642\u0628\u0644 \u0630\u0644\u0643 \u0641\u064a \u0645\u0633\u062c\u062f \u0627\u0644\u0639\u0645\u0631\u0629 \u0628\u0627\u0644\u062a\u0646\u0639\u064a\u0645 \u0648\u0641\u064a \u0627\u0644\u0631\u064a\u0627\u0636\u060c \u0648\u0631\u0641\u0639 \u0627\u0644\u0623\u0630\u0627\u0646 \u0641\u064a \u0644\u0646\u062f\u0646 \u0639\u0627\u0645\u064a\u0646."
  en: "Saudi muezzin (born at Taif, 1365 AH/1946), muezzin of Namira Mosque at Arafat since 1410 AH and of the Masjid al-Haram since Muharram 1415 AH; he grew up in Mecca's Shamiyya quarter within earshot of the Haram's muezzins, served earlier at the Aisha (Umra) Mosque and in Riyadh, and called the adhan in London two years running."
  ur: "\u0633\u0639\u0648\u062f\u06cc \u0645\u0624\u0630\u0646 \u2066(\u067e\u06cc\u062f\u0627\u0626\u0634 \u0637\u0627\u0626\u0641\u060c 1365\u06be/1946\u0621)\u2069\u060c 1410\u06be \u0633\u06d2 \u0639\u0631\u0641\u0627\u062a \u06a9\u06cc \u0645\u0633\u062c\u062f \u0646\u0645\u0631\u06c1 \u0627\u0648\u0631 \u0645\u062d\u0631\u0645 1415\u06be \u0633\u06d2 \u0645\u0633\u062c\u062f \u062d\u0631\u0627\u0645 \u06a9\u06d2 \u0645\u0624\u0630\u0646\u061b \u0645\u06a9\u06c1 \u06a9\u06d2 \u0645\u062d\u0644\u06c1 \u0634\u0627\u0645\u06cc\u06c1 \u0645\u06cc\u06ba \u062d\u0631\u0645 \u06a9\u06d2 \u0645\u0624\u0630\u0646\u0648\u06ba \u06a9\u06cc \u0622\u0648\u0627\u0632\u06cc\u06ba \u0633\u0646\u062a\u06d2 \u067e\u0644\u06d2 \u0628\u0691\u06be\u06d2\u060c \u067e\u06c1\u0644\u06d2 \u0645\u0633\u062c\u062f \u0639\u0627\u0626\u0634\u06c1 \u2066(\u0645\u0633\u062c\u062f \u0627\u0644\u0639\u0645\u0631\u06c1)\u2069 \u0627\u0648\u0631 \u0631\u06cc\u0627\u0636 \u0645\u06cc\u06ba \u0627\u0630\u0627\u0646 \u062f\u06cc\u060c \u0627\u0648\u0631 \u062f\u0648 \u0628\u0631\u0633 \u0644\u0646\u062f\u0646 \u0645\u06cc\u06ba \u0628\u06be\u06cc \u0627\u0630\u0627\u0646 \u062f\u06cc\u06d4"
