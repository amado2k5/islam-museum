summary:
  ar: "مؤذن سعودي ⁦(وُلد بالطائف 1365هـ/1946)⁩، مؤذن مسجد نمرة بعرفة منذ 1410هـ ومؤذن المسجد الحرام منذ محرم 1415هـ، نشأ في حارة الشامية يسمع مؤذني الحرم، وأذّن قبل ذلك في مسجد العمرة بالتنعيم وفي الرياض، ورفع الأذان في لندن عامين."
  en: "Saudi muezzin (born at Taif, 1365 AH/1946), muezzin of Namira Mosque at Arafat since 1410 AH and of the Masjid al-Haram since Muharram 1415 AH; he grew up in Mecca's Shamiyya quarter within earshot of the Haram's muezzins, served earlier at the Aisha (Umra) Mosque and in Riyadh, and called the adhan in London two years running."
  ur: "سعودی مؤذن ⁦(پیدائش طائف، 1365ھ/1946ء)⁩، 1410ھ سے عرفات کی مسجد نمرہ اور محرم 1415ھ سے مسجد حرام کے مؤذن؛ مکہ کے محلہ شامیہ میں حرم کے مؤذنوں کی آوازیں سنتے پلے بڑھے، پہلے مسجد عائشہ ⁦(مسجد العمرہ)⁩ اور ریاض میں اذان دی، اور دو برس لندن میں بھی اذان دی۔"
