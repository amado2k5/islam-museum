id: person/nafi-ibn-al-harith
class: person
label: { ar: "نافع بن الحارث الثقفي", en: "Nafi' ibn al-Harith al-Thaqafi", es: "Nafi' ibn al-Harith al-Thaqafi", fr: "Nafi' ibn al-Harith al-Thaqafi", ur: "نافع ابن حارث ثقفی" }
summary:
  ar: "نافع بن الحارث الثقفي؛ أنقذ معه عتبة بن غزوان كتابه إلى عمر يخبره أن الأبلة فرضة البحرين وعمان والهند والصين وقد كان قدم مع عتبة حين استعمله عمر هو وأبو بكرة وهو نافع بن الحارث بن كلدة طبيب العرب المكنى أبا عبد الله أول من افتلى الخيل بالبصرة فسأل عمر أرضاً على شاطئ دجلة ليست من أراضي الخراج ولا يصرف إليها ماء أرض عليها الجزية فكتب له عمر إلى المغيرة بإقطاعه إياها كتاب معيقيب بن أبي فاطمة في صفر سنة سبع عشرة وكانت أول دار بنيت بالبصرة داره وكانت في جانب المسجد الشمالي فأبى ولده بيعها لهدم عبيد الله بن زياد ما سوي به تربيع المسجد."
  en: "Nafi' ibn al-Harith al-Thaqafi; he carried Utba's letter telling Umar al-Ubulla was the port of Bahrain, Uman, India and China — he had come with Utba, he and Abu Bakra, when Umar appointed him. He is Nafi' ibn al-Harith ibn Kallada, the Arabs' physician Abu Abdallah, first to breed horses at Basra — Umar's Safar-17 letter, written by Mu'ayqib ibn Abi Fatima, granted him Tigris-bank land that was neither kharaj-land nor fed by jizya-land's water; his was Basra's first built house, on the mosque's northern side, whose sons' refusal to sell led Ubaydallah ibn Ziyad to demolish the part the mosque's squaring needed."
  es: "Nafi' ibn al-Harith al-Thaqafi; él portaba la carta de Utba que decía que Umar al-Ubulla era el puerto de Bahrain, Uman, India y China; había venido con Utba, él y Abu Bakra, cuando Umar lo nombró. Él es Nafi' ibn al-Harith ibn Kallada, el médico de los árabes Abu Abdallah, el primero en criar caballos en Basora; la carta de Umar de Safar-17, escrita por Mu'ayqib ibn Abi Fatima, le concedió tierras a orillas del Tigris que no eran tierras kharaj ni estaban regadas por el agua de las tierras jizya; su casa fue la primera que se construyó en Basora, en el lado norte de la mezquita, cuyos hijos se negaron a venderla, lo que llevó a Ubaydallah ibn Ziyad a demoler la parte que necesitaba la plaza de la mezquita."
  fr: "Nafi' ibn al-Harith al-Thaqafi; il portait la lettre d'Utba informant Umar qu'al-Ubulla était le port de Bahreïn, d'Uman, de l'Inde et de la Chine — il était venu avec Utba, lui et Abu Bakra, lorsque Umar l'avait nommé. Il s'agit de Nafi' ibn al-Harith ibn Kallada, le médecin des Arabes, Abu Abdallah, le premier à élever des chevaux à Bassora — la lettre d'Umar du 17 Safar, écrite par Mu'ayqib ibn Abi Fatima, lui accordait des terres sur les rives du Tigre qui n'étaient ni des terres kharaj ni alimentées par les eaux des terres jizya; sa maison était la première construite à Bassora, au nord de la mosquée, et le refus de ses fils de la vendre a conduit Ubaydallah ibn Ziyad à démolir la partie nécessaire à la construction de la mosquée."
  ur: "نافع ابن حارث ثقفی؛ اس کے پاس عتبہ کا خط تھا جس میں بتایا گیا تھا کہ عمر الابلہ بحرین، عمان، ہندوستان اور چین کی بندرگاہ ہے - وہ عتبہ، وہ اور ابوبکرہ کے ساتھ آئے تھے، جب عمر نے اسے مقرر کیا تھا۔ وہ نافع بن الحارث ابن کلدہ ہے، عربوں کا طبیب ابو عبداللہ، جس نے سب سے پہلے بصرہ میں گھوڑوں کی افزائش کی - عمر کا صفر 17 خط، جسے معیقب ابن ابی فاطمہ نے لکھا تھا، اسے دجلہ کے کنارے کی زمین دی تھی جو نہ خرج کی زمین تھی اور نہ ہی فزیز۔ اس کا بصرہ کا پہلا تعمیر شدہ مکان تھا، جو مسجد کے شمالی حصے میں تھا، جس کے بیٹوں کے بیچنے سے انکار نے عبیداللہ ابن زیاد کو مسجد کے اسکوائرنگ کی ضرورت کے حصے کو گرانے پر مجبور کیا۔"
  tr: "Nafi' ibn al-Haris al-Thaqafi; Utbah ibn Ghazwan, develerin Bahreyn, Umman, Hindistan ve Çin'e tahsis edildiğini bildiren mektubunu yanında sakladı. Ömer ve Ebu Bekir onu atadığında Utbah ile gelmişti. O, Arap hekim Nafi' ibn al-Haris ibn Kalda'ydı; Arap hekim olarak bilinen Ebu Abdullah, Basra'da ata binen ilk kişiydi. Ömer vergi gelirlerine dahil olmayan Dicle kıyısında arazi istedi ve cizye için su tahsis edilmedi. Ömer el-Muğira'ya yazdı, on yedinci yılın Safar'ında bunu kesmesini istedi. Basra'da inşa edilen ilk ev, kuzey caminin yanında bulunan onun eviydi. Oğlu, Übeydullah ibn Ziyad ve cami meydanını yıkmak için evi satmayı reddetti."
  id: "Nafi' ibn al-Harith al-Thaqafi; Utbah ibn Ghazwan menyimpan suratnya kepada Umar yang memberitahukan bahwa unta-unta tersebut ditugaskan ke Bahrain, Oman, India, dan Tiongkok. Ia datang bersama Utbah ketika Umar dan Abu Bakrah mengangkatnya. Ia adalah Nafi' ibn al-Harith ibn Kalda, tabib Arab yang dikenal sebagai Abu Abdullah, yang pertama menunggang kuda di Basra. Umar meminta tanah di tepi Sungai Tigris yang bukan bagian dari pendapatan pajak, dan tidak ada air yang dialokasikan untuk jizya. Umar menulis surat kepada al-Mughira untuk menebangkannya di Safar tahun ketujuh belas. Rumah pertama yang dibangun di Basra adalah rumahnya, yang terletak di sebelah masjid utara. Putranya menolak menjualnya untuk menghancurkan Ubayd Allah ibn Ziyad dan alun-alun masjid."
