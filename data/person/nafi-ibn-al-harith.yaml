id: person/nafi-ibn-al-harith
class: person
label: { ar: "نافع بن الحارث الثقفي", en: "Nafi' ibn al-Harith al-Thaqafi" }
summary:
  ar: "نافع بن الحارث الثقفي؛ أنقذ معه عتبة بن غزوان كتابه إلى عمر يخبره أن الأبلة فرضة البحرين وعمان والهند والصين وقد كان قدم مع عتبة حين استعمله عمر هو وأبو بكرة وهو نافع بن الحارث بن كلدة طبيب العرب المكنى أبا عبد الله أول من افتلى الخيل بالبصرة فسأل عمر أرضاً على شاطئ دجلة ليست من أراضي الخراج ولا يصرف إليها ماء أرض عليها الجزية فكتب له عمر إلى المغيرة بإقطاعه إياها كتاب معيقيب بن أبي فاطمة في صفر سنة سبع عشرة وكانت أول دار بنيت بالبصرة داره وكانت في جانب المسجد الشمالي فأبى ولده بيعها لهدم عبيد الله بن زياد ما سوي به تربيع المسجد."
  en: "Nafi' ibn al-Harith al-Thaqafi; he carried Utba's letter telling Umar al-Ubulla was the port of Bahrain, Uman, India and China — he had come with Utba, he and Abu Bakra, when Umar appointed him. He is Nafi' ibn al-Harith ibn Kallada, the Arabs' physician Abu Abdallah, first to breed horses at Basra — Umar's Safar-17 letter, written by Mu'ayqib ibn Abi Fatima, granted him Tigris-bank land that was neither kharaj-land nor fed by jizya-land's water; his was Basra's first built house, on the mosque's northern side, whose sons' refusal to sell led Ubaydallah ibn Ziyad to demolish the part the mosque's squaring needed."
