summary:
  ar: "صانعة محتوى جمال ورائدة أعمال أمريكية من أصل نيجيري، وُلدت في لوس أنجلوس سنة 1987، أطلقت قناتها على يوتيوب سنة 2009 ودعت إلى حضور ذوي البشرة الملونة في صناعة التجميل وتوسيع درجات كريمات الأساس، وتعاونت مع كبرى العلامات، وشاركت في تأسيس علامة «فورفر مود» سنة 2020، ونالت جائزة صورة الرابطة الوطنية لتقدم الملونين «يوتيوبر العام» سنة 2018."
  en: "Nigerian-American beauty creator and entrepreneur, born in Los Angeles in 1987, who launched her YouTube channel in 2009, campaigned for the visibility of people of colour in the cosmetics industry and for wider foundation shade ranges, collaborated with major brands, co-founded the lifestyle brand FORVR Mood in 2020, and won the NAACP Image Award for YouTuber of the Year in 2018."
  ur: "نائیجیری نژاد امریکی بیوٹی کریئیٹر اور کاروباری خاتون، جو 1987 میں لاس اینجلس میں پیدا ہوئیں، جنہوں نے 2009 میں اپنا یوٹیوب چینل شروع کیا، کاسمیٹکس صنعت میں رنگ برنگی جلد والوں کی نمائندگی اور فاؤنڈیشن کے رنگوں کی توسیع کی وکالت کی، بڑے برانڈز کے ساتھ کام کیا، 2020 میں لائف اسٹائل برانڈ FORVR Mood کی شریک بانی بنیں، اور 2018 میں NAACP کا یوٹیوبر آف دی ایئر ایوارڈ جیتا۔"
