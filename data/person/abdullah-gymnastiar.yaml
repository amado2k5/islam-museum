summary:
  ar: "داعية إندونيسي وُلد في باندونغ بجاوة الغربية سنة 1962 ويُعرف بـ«آ غيم»، أسس سنة 1990 مؤسسة ومعهد «دار التوحيد» في باندونغ، واشتهر ببرنامجه التلفزيوني «إدارة القلوب» منذ 2001 وبخطاب هادئ يركز على تزكية النفس والأخلاق، حتى غدا في ذروته من أشهر دعاة جنوب شرقي آسيا، ثم أثار زواجه الثاني سنة 2006 جدلاً واسعاً وأثّر بعمق في جماهيريته."
  en: "Indonesian preacher born in Bandung, West Java, in 1962 and known as Aa Gym. He founded the Daarut Tauhiid foundation and pesantren in Bandung in 1990, became famous for his 'Manajemen Qolbu' (Heart Management) television programme from 2001 and a soft-spoken preaching style centred on self-improvement and character, reaching at his peak one of Southeast Asia's largest sermon audiences. His second marriage in 2006 provoked a wide controversy that deeply affected his popularity."
  ur: "انڈونیشی مبلغ، جو 1962ء میں مغربی جاوا کے بانڈونگ میں پیدا ہوئے اور «آ غیم» کے نام سے مشہور ہیں۔ 1990ء میں بانڈونگ میں دار التوحید فاؤنڈیشن و مدرسہ قائم کیا، 2001ء سے ٹیلی ویژن پروگرام «مناجمین قلبو» ⁦(دل کی تربیت)⁩ اور خود سازی و اخلاق پر مرکوز نرم لہجے کی دعوت سے شہرت پائی؛ 2006ء میں ان کی دوسری شادی نے بڑا تنازع کھڑا کیا۔"
