summary:
  ar: "سياسي بخاري وأوزبكي سوفييتي (1896–1938): من قادة الجديديين والبخاريين الشباب، صار أول رئيس لحكومة جمهورية بخارى الشعبية السوفييتية (1920–1924) ثم رئيس مجلس مفوضي الشعب لجمهورية أوزبكستان السوفييتية (1924–1937). أُقيل في يونيو 1937 وقُدّم لمحاكمة الواحد والعشرين وأُعدم في كوموناركا في 15 مارس 1938 ورُدّ اعتباره في الستينيات."
  en: "Bukharan and Uzbek Soviet politician (1896–1938): a Jadid and Young Bukharan leader who became the first head of government of the Bukharan People's Soviet Republic (1920–1924) and then chairman of the Council of People's Commissars of the Uzbek SSR (1924–1937). Removed in June 1937, he was a defendant at the Trial of the Twenty-One and was shot at Kommunarka on 15 March 1938; he was rehabilitated in the 1960s."
  ur: "بخاری اور ازبک سوویت سیاست دان (1896–1938): جدیدیوں اور نوجوان بخاریوں کے رہنما، بخارا عوامی سوویت جمہوریہ کی حکومت کے پہلے سربراہ (1920–1924) اور پھر ازبک سوویت جمہوریہ کے مفوضینِ عوام کی کونسل کے صدر (1924–1937) بنے۔ جون 1937 میں برطرف ہوئے، اکیس افراد کے مقدمے میں پیش ہوئے، 15 مارچ 1938 کو کومونارکا میں گولی مار دیے گئے اور 1960 کی دہائی میں بحالِ حیثیت ہوئے۔"
