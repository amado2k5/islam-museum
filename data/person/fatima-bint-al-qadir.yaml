summary:
  ar: "بنت الخليفة القادر بالله وأخت الخليفة القائم بأمر الله؛ توفيت سنة ثمان وأربعين وأربعمائة فأُخرج تابوتها وتابوت الذخيرة أبي العباس بن القائم، وصلى الخليفة عليهما في صحن السلام وجلس رئيس الرؤساء في الطيار مع التابوتين وحُملا إلى الرصافة، وحضر في العزاء عدد لا يتجاوزون أربعين لخلوّ البلد وانقراض الناس بالموت والفقر {cite:muntazam-ibn-al-jawzi j.8 p.517}."
  en: "Daughter of the caliph al-Qadir and sister of al-Qa'im; died in the plague year 448 — her bier and that of the heir Dhakhirat al-Din were carried out together, the caliph prayed over both in the courtyard of the palace and they were borne to Rusafa, with fewer than forty mourners present for the emptiness of the plague-stricken city {cite:muntazam-ibn-al-jawzi j.8 p.517}."
