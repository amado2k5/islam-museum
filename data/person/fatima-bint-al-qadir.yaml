names:
  - { value: "فاطمة بنت القادر بالله", kind: full }
summary:
  ar: "بنت الخليفة القادر بالله وأخت الخليفة القائم بأمر الله؛ توفيت سنة ثمان وأربعين وأربعمائة فأُخرج تابوتها وتابوت الذخيرة أبي العباس بن القائم، وصلى الخليفة عليهما في صحن السلام وجلس رئيس الرؤساء في الطيار مع التابوتين وحُملا إلى الرصافة، وحضر في العزاء عدد لا يتجاوزون أربعين لخلوّ البلد وانقراض الناس بالموت والفقر {cite:muntazam-ibn-al-jawzi j.8 p.517}."
  en: "Daughter of the caliph al-Qadir and sister of al-Qa'im; died in the plague year 448 — her bier and that of the heir Dhakhirat al-Din were carried out together, the caliph prayed over both in the courtyard of the palace and they were borne to Rusafa, with fewer than forty mourners present for the emptiness of the plague-stricken city {cite:muntazam-ibn-al-jawzi j.8 p.517}."
  es: "Hija del califa al-Qadir y hermana de al-Qa'im; murió en el año de la peste 448; su féretro y el del heredero Dhakhirat al-Din fueron llevados juntos, el califa rezó por ambos en el patio del palacio y fueron llevados a Rusafa, con menos de cuarenta dolientes presentes debido al vacío de la ciudad azotada por la peste {cite:muntazam-ibn-al-jawzi j.8 p.517}."
  fr: "Fille du calife al-Qadir et sœur d'al-Qa'im; décédée lors de l'année de la peste 448 — son cercueil et celui de l'héritier Dhakhirat al-Din furent transportés ensemble, le calife pria sur les deux dans la cour du palais et ils furent transportés à Rusafa, avec moins de quarante personnes en deuil présentes en raison du vide de la ville frappée par la peste {cite:muntazam-ibn-al-jawzi j.8 p.517}."
  ur: "خلیفہ القادر کی بیٹی اور القائم کی بہن؛ طاعون کے سال 448 میں ان کی وفات ہوئی - اس کا اور وارث ذخیرات الدین کا انتقال ایک ساتھ ہوا، خلیفہ نے محل کے صحن میں دونوں پر نماز پڑھی اور ان کی ولادت روسفہ میں ہوئی، طاعون زدہ شہر کے خالی ہونے پر چالیس سے کم سوگوار موجود تھے۔"
  tr: "Halife el-Kadir Billah'ın kızı ve Halife el-Qa'im bi-Amr Allah'ın kız kardeşi; dört yüz kırk sekizinci yılında vefat etti. Tabutu ve dhira tabutu Ebu el-Abbas bin el-Kaim tarafından çıkarıldı. Halife, barış avlusunda onların üzerinde dua etti ve reislerin reisi iki tabutla birlikte uçağa oturup Rusafa'ya götürüldü. Kasabanın boşluğu ve insanların ölüm ve yoksullukta yok olması nedeniyle cenazeye kırkı geçmeyenler katıldı {atıf:Muntazam-ibn-al-Jawzi j.8 s.517}."
  id: "Putri Khalifah al-Qadir Billah dan saudara perempuan Khalifah al-Qa'im bi-Amr Allah; ia meninggal pada tahun empat ratus empat puluh delapan. Peti mati dan peti mati dhikhira diambil oleh Abu al-Abbas ibn al-Qa'im. Khalifah berdoa di halaman damai, dan kepala kepala duduk di pesawat bersama dua peti mati dan dibawa ke Rusafa. Jumlah tidak lebih dari empat puluh menghadiri pemakaman karena kota yang kosong dan punahnya orang dalam kematian dan kemiskinan {cite:muntazam-ibn-al-jawzi j.8 hlm.517}."
