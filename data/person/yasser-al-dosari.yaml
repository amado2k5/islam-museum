summary:
  ar: "قارئ قرآن وعالم سعودي، وُلد في محافظة الخرج سنة 1980، وحفظ القرآن في الخامسة عشرة، وأمّ مساجد الرياض منذ 1995، ثم عُيّن إمامًا مشاركًا للتراويح والتهجد في المسجد الحرام سنة 2015 وإمامًا دائمًا وخطيبًا فيه، وهو أستاذ مشارك في الفقه المقارن بجامعة أم القرى."
  en: "Saudi Quran reciter and scholar, born in al-Kharj governorate in 1980. He memorised the Quran by the age of fifteen and led prayers in Riyadh mosques from 1995, before being appointed a Taraweeh and Tahajjud imam at Masjid al-Haram in 2015 and then a permanent imam and khatib there. He is an associate professor of comparative fiqh at Umm Al-Qura University."
  ur: "سعودی قاریِ قرآن اور عالم، جو 1980 میں محافظہ الخرج میں پیدا ہوئے۔ انہوں نے پندرہ سال کی عمر میں قرآن حفظ کیا اور 1995 سے ریاض کی مساجد میں امامت کی، پھر 2015 میں مسجد الحرام میں تراویح و تہجد کے شریک امام اور بعد ازاں مستقل امام و خطیب مقرر ہوئے۔ وہ جامعہ ام القریٰ میں فقہ مقارن کے ایسوسی ایٹ پروفیسر ہیں۔"
