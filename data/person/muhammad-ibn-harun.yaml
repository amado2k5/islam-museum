label: { ar: "محمد بن هارون النمري", en: "Muhammad ibn Harun al-Namari", es: "Muhammad ibn Harun al-Namari", fr: "Muhammad ibn Harun al-Namari", ur: "محمد بن ہارون النمری۔" }
summary:
  ar: "محمد بن هارون بن ذرع النمري؛ استعمله الحجاج على ثغر مكران بعد مجاعة فأهدى إلى الحجاج في ولايته ملك جزيرة الياقوت نسوة ولدن مسلمات ومات آباؤهن التجار تقرباً."
  en: "Muhammad ibn Harun ibn Dhar' al-Namari; al-Hajjaj's Makran governor — in his day the king of Jazirat al-Yaqut gifted al-Hajjaj Muslim-born orphans of merchant fathers."
  es: "Muhammad ibn Harun ibn Dhar' al-Namari; gobernador de Makran de al-Hajjaj; en su época, el rey de Jazirat al-Yaqut regaló a al-Hajjaj huérfanos de padres comerciantes nacidos musulmanes."
  fr: "Muhammad ibn Harun ibn Dhar' al-Namari; gouverneur de Makran d'al-Hajjaj — à son époque, le roi de Jazirat al-Yaqut offrait à al-Hajjaj des orphelins musulmans nés de pères marchands."
  ur: "محمد بن ہارون بن ذر النماری؛ الحجاج کا مکران کا گورنر - اپنے دور میں جزیرۃ الیقوت کے بادشاہ نے الحجاج کو تاجر باپوں کے مسلمان پیدا ہونے والے یتیموں کا تحفہ دیا۔"
  tr: "Muhammed bin Harun ibn Dhir' al-Nimri; el-Haccac, kıtlık sonrası onu Makran sınırına atadı ve valiliği sırasında, Yaqut adasının kralı el-Hacac'a, babaları tüccarlar evlenirken ölen Müslümanlardan doğan kadınları hediye etti."
  id: "Muhammad ibn Harun ibn Dhir' al-Nimri; al-Hajjaj mengangkatnya di perbatasan Makran setelah kelaparan, dan selama masa pemerintahannya, ia menghadiahkan al-Hajjaj, raja pulau Yaqut, wanita yang lahir dari Muslim, yang ayahnya, para pedagang, meninggal dalam pernikahan."
