summary:
  ar: "إسحاق بن عبد الله بن أبي طلحة الأنصاري، يكنى أبا نجيح وقيل أبا محمد أو أبا يحيى، من صغار تابعي المدينة، لقي أنس بن مالك، وجده أبو طلحة زيد بن سهل الصحابي؛ قال الواقدي إن مالكاً كان لا يقدّم عليه في الحديث أحداً؛ توفي بالمدينة سنة اثنتين وثلاثين ومئة، وقيل أربع وثلاثين، ولمالك عنه في الموطأ خمسة عشر حديثاً {cite:tamhid-furqan-2017-v1 p. 400-401}."
  en: "Ishaq b. 'Abd Allah b. Abi Talha al-Ansari, known as Abu Najih (or Abu Muhammad, or Abu Yahya), one of the younger Successors of Medina, who met Anas b. Malik and was the grandson of the Companion Abu Talha Zayd b. Sahl; al-Waqidi says Malik ranked no one above him in hadith; he died in Medina in 132 AH, or 134 by another report, and Malik has fifteen of his reports in the Muwatta' {cite:tamhid-furqan-2017-v1 p. 400-401}."
  ur: "اسحاق بن عبد اللہ بن ابی طلحہ انصاری، کنیت ابو نجیح ⁦(یا ابو محمد یا ابو یحییٰ)⁩، مدینہ کے صغار تابعین میں سے، انس بن مالک سے ملے، اور صحابی ابو طلحہ زید بن سہل کے پوتے تھے؛ واقدی کہتے ہیں کہ امام مالک حدیث میں کسی کو ان پر مقدم نہیں کرتے تھے؛ وہ 132ھ میں، اور ایک روایت میں 134ھ میں، مدینہ میں فوت ہوئے، اور موطأ میں مالک کی ان سے پندرہ روایات ہیں {cite:tamhid-furqan-2017-v1 p. 400-401}۔"
  es: "Ishaq b. 'Abd Allah b. Abi Talha al-Ansari, conocido como Abu Najih (o Abu Muhammad, o Abu Yahya), uno de los Sucesores más jóvenes de Medina, que conoció a Anas b. Malik y era nieto del Compañero Abu Talha Zayd b. Sahl; al-Waqidi dice que Malik no clasificó a nadie por encima de él en hadices; murió en Medina en el año 132 AH, o 134 según otro informe, y Malik tiene quince de sus informes en el Muwatta' {cite:tamhid-furqan-2017-v1 p. 400-401}."
  fr: "Ishaq b. 'Abd Allah b. Abi Talha al-Ansari, connu sous le nom d'Abu Najih (ou Abu Muhammad, ou Abu Yahya), l'un des plus jeunes Successeurs de Médine, qui rencontra Anas b. Malik et était le petit-fils du Compagnon Abu Talha Zayd b. Sahl; al-Waqidi dit que Malik ne plaçait personne au-dessus de lui dans les hadiths; il mourut à Médine en 132 AH, ou 134 selon un autre rapport, et Malik a quinze de ses rapports dans le Muwatta' {cite:tamhid-furqan-2017-v1 p. 400-401}."
  tr: "İshaq ibn Abdullah ibn Abi Talhah al-Ansari, Ebu Nuceyh veya Ebu Muhammed ya da Ebu Yahya olarak da bilinir, Medine'nin genç takipçilerinden biriydi. Anas ibn Malik ile tanıştı ve büyükbabası Ebu Talhah Zayd ibn Sahl al-Sahabi'ydi; el-Vaqidi, kendisinden önce hiç kimsenin hadis yapmadığını söyledi; 132 yılında Medine'de öldü, bazıları ise 34 yıl der. Malik, Muwatta'da ondan on beş hadis rivayet etti {cite:tamhid-furqan-2017-v1, s. 400-401}."
  id: "Ishaq ibn Abdullah ibn Abi Talhah al-Ansari, yang dikenal sebagai Abu Nujayh atau juga Abu Muhammad atau Abu Yahya, adalah salah satu pengikut muda Madinah. Ia bertemu Anas ibn Malik, dan kakeknya adalah Abu Talhah Zayd ibn Sahl al-Sahabi; al-Waqidi mengatakan bahwa tidak ada yang mendahuluinya dalam hadis; ia meninggal di Madinah pada tahun 132, dan beberapa mengatakan 34. Malik menceritakan lima belas hadis darinya dalam Muwatta' {cite:tamhid-furqan-2017-v1, hlm. 400-401}."
