summary:
  ar: "إسحاق بن عبد الله بن أبي طلحة الأنصاري، يكنى أبا نجيح وقيل أبا محمد أو أبا يحيى، من صغار تابعي المدينة، لقي أنس بن مالك، وجده أبو طلحة زيد بن سهل الصحابي؛ قال الواقدي إن مالكاً كان لا يقدّم عليه في الحديث أحداً؛ توفي بالمدينة سنة اثنتين وثلاثين ومئة، وقيل أربع وثلاثين، ولمالك عنه في الموطأ خمسة عشر حديثاً {cite:tamhid-furqan-2017-v1 p. 400-401}."
  en: "Ishaq b. 'Abd Allah b. Abi Talha al-Ansari, known as Abu Najih (or Abu Muhammad, or Abu Yahya), one of the younger Successors of Medina, who met Anas b. Malik and was the grandson of the Companion Abu Talha Zayd b. Sahl; al-Waqidi says Malik ranked no one above him in hadith; he died in Medina in 132 AH, or 134 by another report, and Malik has fifteen of his reports in the Muwatta' {cite:tamhid-furqan-2017-v1 p. 400-401}."
  ur: "اسحاق بن عبد اللہ بن ابی طلحہ انصاری، کنیت ابو نجیح ⁦(یا ابو محمد یا ابو یحییٰ)⁩، مدینہ کے صغار تابعین میں سے، انس بن مالک سے ملے، اور صحابی ابو طلحہ زید بن سہل کے پوتے تھے؛ واقدی کہتے ہیں کہ امام مالک حدیث میں کسی کو ان پر مقدم نہیں کرتے تھے؛ وہ 132ھ میں، اور ایک روایت میں 134ھ میں، مدینہ میں فوت ہوئے، اور موطأ میں مالک کی ان سے پندرہ روایات ہیں {cite:tamhid-furqan-2017-v1 p. 400-401}۔"
died: { hijri: "0132", edtf: "0749~", calendar: julian, precision: year, status: debated, derived: true, note: "«توفي إسحاق بالمدينة في سنة اثنتين وثلاثين ومئة، وقيل: كانت وفاته سنة أربع وثلاثين ومئة» (التمهيد ط. الفرقان ج1 ص 401)؛ التحويل مشتق.", sources: [source/tamhid-furqan-2017-v1] }
