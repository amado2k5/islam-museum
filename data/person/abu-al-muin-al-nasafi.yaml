summary:
  ar: "أبو المعين ميمون بن محمد النسفي الحنفي، عالم بالأصول والكلام من سمرقند وبخارى، توفي سنة 508 هـ؛ ترجمته في «الأعلام» للزركلي."
  en: "Abu al-Mu'in Maymun ibn Muhammad al-Nasafi al-Hanafi, a scholar of legal theory and kalam who lived in Samarqand and Bukhara, d. 508 AH; his entry is in al-Zirikli's al-A'lam."
  fr: "Abu al-Mu'in Maymun ibn Muhammad al-Nasafi al-Hanafi, savant en théorie du droit et en kalam qui vécut à Samarcande et à Boukhara, mort en 508 H ; sa notice figure dans al-A'lam d'al-Zirikli."
  es: "Abu al-Mu'in Maymun ibn Muhammad al-Nasafi al-Hanafi, un erudito en teoría jurídica y kalam que vivió en Samarcanda y Bukhara, d. 508 AH; su entrada está en al-A'lam de al-Zirikli."
  ur: "ابو المومن میمون بن محمد النصفی الحنفی، قانونی نظریہ اور کلام کا ایک عالم جو سمرقند اور بخارا میں مقیم تھا، د. 508ھ؛ اس کا اندراج الزرکلی کی العلم میں ہے۔"
  tr: "Semerkant ve Buhara'lı fıkıh ve ilahiyat alimi Ebu el-Mu'in Maymun ibn Muhammed el-Nasafi el-Hanafi, Hicri 508 yılında vefat etmiştir; biyografisi El-Zarkali'nin \"El-A'lam\" adlı eserinde yer almaktadır."
  id: "Abu al-Mu’in Maymun ibn Muhammad al-Nasafi al-Hanafi, seorang ulama fiqih dan teologi dari Samarkand dan Bukhara, wafat pada tahun 508 H; biografinya terdapat dalam kitab “Al-A’lam” karya al-Zarkali."
