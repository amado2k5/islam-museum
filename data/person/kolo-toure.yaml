summary:
  ar: "لاعب كرة قدم عاجي معتزل ومدرب، وُلد في بواكي بساحل العاج سنة 1981. مدافع كان ضمن فريق أرسنال «الذي لا يُقهر» الفائز بالدوري الإنجليزي 2003–04، ثم فاز باللقب مع مانشستر سيتي سنة 2012، ولعب لليفربول وسيلتيك، وهو أكثر لاعب أفريقي مشاركة في الدوري الإنجليزي الممتاز (353 مباراة)، وخاض 120 مباراة مع منتخب ساحل العاج وفاز بكأس أمم أفريقيا 2015. وهو الأخ الأكبر ليايا توريه."
  en: "Ivorian retired footballer and coach, born in Bouaké, Ivory Coast in 1981. A defender who was part of Arsenal's 'Invincibles' Premier League side of 2003–04, then won the title with Manchester City in 2012, and played for Liverpool and Celtic; he is the African player with the most Premier League appearances (353), won 120 caps for Ivory Coast and lifted the 2015 Africa Cup of Nations. He is the elder brother of Yaya Touré."
  ur: "آئیوریائی ریٹائرڈ فٹبالر اور کوچ، 1981 میں آئیوری کوسٹ کے بواکے میں پیدا ہوئے۔ دفاعی کھلاڑی جو آرسنل کی 2003–04 کی «ناقابلِ تسخیر» پریمیئر لیگ ٹیم کا حصہ تھے، پھر مانچسٹر سٹی کے ساتھ 2012 میں خطاب جیتا، اور لیورپول اور سیلٹک کے لیے کھیلے؛ پریمیئر لیگ میں سب سے زیادہ میچ کھیلنے والے افریقی کھلاڑی ہیں (353)، آئیوری کوسٹ کے لیے 120 میچ کھیلے اور 2015 افریقہ کپ آف نیشنز جیتا۔ وہ یایا تورے کے بڑے بھائی ہیں۔"
