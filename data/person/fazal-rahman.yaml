summary:
  ar: "مدرب دعوة بريطاني، مؤلف دليل ودورة «تدريب الدعوة» المنشورين باسم «الدعوة سهلة» (Dawah Is Easy)؛ يختم دليله بدعوة القراء إلى موقع DawahIsEasy.com موقّعًا باسمه، وتضم قناته على يوتيوب (@DawahIsEasy) سلسلة تدريب الدعوة متعددة الأجزاء ومقاطع دعوة ميدانية. يقدّم فعاليات تدريب «الدعوة سهلة» مع أكاديمية الدعوة الوطنية في البعثة الإسلامية بالمملكة المتحدة، التي قدّمته سنة 2025 بصفته صاحب أكثر من 150 ألف مشترك على يوتيوب."
  en: "A British dawah trainer, author of the Dawah Training manual and course published under the name 'Dawah Is Easy'; his manual closes by directing readers to DawahIsEasy.com over his own signature, and his YouTube channel (@DawahIsEasy) carries the multi-part Da'wah Training series alongside street-dawah clips. He presents 'Dawah is Easy' training events with the UK Islamic Mission's National Dawah Academy, which billed him in 2025 as having over 150,000 subscribers on his YouTube channel."
  ur: "برطانوی دعوتی تربیت کار؛ «دعوت آسان ہے» (Dawah Is Easy) کے نام سے شائع شدہ دعوتی تربیتی دستی اور کورس کے مصنف؛ ان کی کتاب کے آخر میں ان کے اپنے دستخط کے ساتھ قارئین کو DawahIsEasy.com کی طرف بھیجا گیا ہے، اور ان کے یوٹیوب چینل (@DawahIsEasy) پر کثیر حصوں والی دعوتی تربیت سیریز موجود ہے۔ وہ یوکے اسلامک مشن کی نیشنل دعوت اکیڈمی کے ساتھ «دعوت آسان ہے» تربیتی پروگرام پیش کرتے ہیں۔"
