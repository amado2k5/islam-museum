id: person/hibat-allah-ibn-makula
class: person
label:
  ar: "أبو القاسم هبة الله ابن ماكولا الوزير"
  en: "Hibat Allah ibn Makula, the vizier"
  es: "Hibat Allah ibn Makula, the vizier"
  fr: "Hibat Allah ibn Makula, the vizier"
  ur: "ہیبت اللہ ابن مکلہ، وزیر"
names:
  - { value: "هبة الله بن علي بن جعفر أبو القاسم ابن ماكولا", kind: full }
summary:
  ar: "وزير لجلال الدولة أبي طاهر مرارًا، وكان حافظًا للقرآن عارفًا بالشعر والأخبار. في ربيع الآخر سنة سبع وعشرين وأربعمائة قُبض عليه وسُلّم إلى المرتضى إلى دار الملكة فمرض ويُئس منه، وراسل الخليفة في معنى أخيه قاضي القضاة أبي عبد الله بن ماكولا فدافع عنه وحامى وكادت الحال من الأتراك تشرف على تسليمه أو خرق لا يُتلافى، حتى كتب الخليفة إلى حاجب الحجاب «قد زاد الأمر في إطراح مراقبتنا وإسقاط حشمتنا». وخُنق بهيت في جمادى الآخرة سنة تسع وعشرين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.431,445}."
  en: "Jalal al-Dawla's oft-reappointed vizier — a hafiz of the Qur'an versed in poetry and akhbar. Seized in Rabi' II 427 and handed to al-Murtada's keeping at Dar al-Malika where he fell mortally ill, while the caliph defended his brother the qadi Ibn Makula against the Turks' demand that he be surrendered; he was strangled at Bahit in Jumada II 429 {cite:muntazam-ibn-al-jawzi j.8 p.431,445}."
  es: "Visir de Jalal al-Dawla, a menudo reelegido, era un hafiz del Corán versado en poesía y akhbar. Fue apresado en Rabi' II 427 y entregado a la custodia de al-Murtada en Dar al-Malika, donde enfermó gravemente, mientras el califa defendía a su hermano, el cadí Ibn Makula, contra la exigencia de los turcos de que se entregara; fue estrangulado en Bahit en Jumada II 429 {cite:muntazam-ibn-al-jawzi j.8 p.431,445}."
  fr: "Le vizir de Jalal al-Dawla, souvent reconduit dans ses fonctions, était un hafiz du Coran versé dans la poésie et les akhbar. Arrêté en Rabi' II 427 et remis à la garde d'al-Murtada à Dar al-Malika, il y tomba mortellement malade, tandis que le calife défendait son frère, le cadi Ibn Makula, contre la demande des Turcs de le livrer; il fut étranglé à Bahit en Jumada II 429 {cite:muntazam-ibn-al-jawzi j.8 p.431,445}."
  ur: "جلال الدولہ کا بار بار مقرر کردہ وزیر - قرآن کا ایک حافظ جو شاعری اور اخبار میں مہارت رکھتا ہے۔ ربیع II 427 میں پکڑا گیا اور دار الملکہ میں المرتضیٰ کے حوالے کر دیا گیا جہاں وہ شدید بیمار ہو گیا، جب کہ خلیفہ نے ترکوں کے اس مطالبے کے خلاف اپنے بھائی قاضی ابن ماکولہ کا دفاع کیا کہ اسے ہتھیار ڈال دیا جائے۔ جمادی الثانی 429 میں بہیت کے مقام پر اس کا گلا گھونٹ دیا گیا تھا۔"
  tr: "Celal-Devle Ebu Tahir'e defalarca bakan olarak hizmet etti, Kur'an'ı ezberledi ve şiir ile haberler konusunda bilgiliydi. Dört yüz yirmi yedinci yılda Rabi'l-Thani'de yakalandı ve el-Murtada'ya kraliyet sarayına teslim edildi; burada hastalandı ve umutsuzluğa kapıldı. Halife, kardeşi Baş Yargıç Ebu Abdullah bin Makule ile iletişime geçti; Makula onu savundu ve savundu. Türklerin durumu neredeyse onu teslim etmekle ya da kaçınılmaz bir ihlal yaratmakla tehdit ediyordu, ta ki halife başörtülü halifeye şöyle yazana kadar: \"Gözetimimizi kaldırıp alçakgönüllülüğümüzü ortadan kaldırarak mesele arttı.\" Bahit, dört yüz yirmi dokuz yılında Cumade'l-Akhirah'ta boğularak öldürüldü {cite:Muntazam-ibn-al-Jawzi j.8 s.431,445}."
  id: "Ia berulang kali menjabat sebagai menteri untuk Jalal al-Dawla Abu Tahir, dan ia adalah penghafal Al-Qur'an serta berpengetahuan dalam puisi dan berita. Pada Rabi' al-Thani tahun empat ratus dua puluh tujuh, ia ditangkap dan diserahkan kepada al-Murtada ke istana kerajaan, di mana ia jatuh sakit dan putus asa. Khalifah menghubungi saudaranya, Ketua Hakim Abu Abdullah ibn Makula, yang membela dan membelanya. Situasi orang Turki hampir mengancam menyerahkannya atau menyebabkan pelanggaran yang tak terelakkan, hingga khalifah menulis kepada khalifah hijab: \"Masalah ini meningkat dalam menghilangkan pengawasan kami dan menghilangkan kerendahan kami.\" Bahit dicekik di Jumada al-Akhirah pada tahun empat ratus dua puluh sembilan {cite:muntazam-ibn-al-jawzi j.8 hlm.431,445}."
