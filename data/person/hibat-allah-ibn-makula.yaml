label:
  ar: "أبو القاسم هبة الله ابن ماكولا الوزير"
  en: "Hibat Allah ibn Makula, the vizier"
names:
  - { value: "هبة الله بن علي بن جعفر أبو القاسم ابن ماكولا", kind: full }
summary:
  ar: "وزير لجلال الدولة أبي طاهر مرارًا، وكان حافظًا للقرآن عارفًا بالشعر والأخبار. في ربيع الآخر سنة سبع وعشرين وأربعمائة قُبض عليه وسُلّم إلى المرتضى إلى دار الملكة فمرض ويُئس منه، وراسل الخليفة في معنى أخيه قاضي القضاة أبي عبد الله بن ماكولا فدافع عنه وحامى وكادت الحال من الأتراك تشرف على تسليمه أو خرق لا يُتلافى، حتى كتب الخليفة إلى حاجب الحجاب «قد زاد الأمر في إطراح مراقبتنا وإسقاط حشمتنا». وخُنق بهيت في جمادى الآخرة سنة تسع وعشرين وأربعمائة {cite:muntazam-ibn-al-jawzi j.8 p.431,445}."
  en: "Jalal al-Dawla's oft-reappointed vizier — a hafiz of the Qur'an versed in poetry and akhbar. Seized in Rabi' II 427 and handed to al-Murtada's keeping at Dar al-Malika where he fell mortally ill, while the caliph defended his brother the qadi Ibn Makula against the Turks' demand that he be surrendered; he was strangled at Bahit in Jumada II 429 {cite:muntazam-ibn-al-jawzi j.8 p.431,445}."
