label: { ar: "الحسين النجار", en: "Al Husayn Al Najjar", es: "Al Husayn Al Najjar", fr: "Al Husayn Al Najjar", ur: "الحسین النجار" }
summary:
  ar: "أبو عبد الله الحسين بن محمد بن عبد الله النجار وكان حائكا في طراز العباس بن محمد الهاشمي من جلة المجبرة ومتكلميهم وقد قيل إنه كان يعمل الموازين من أهل برم، وإذا تكلم كان كلامه صوت الخفاش وكان من أهل الناظرين وله مع النظام مجالس ومناظرات، وكان سبب موت الحسين النجار أنه اجتمع مع إبراهيم النظام فاحتج عليه في خلق الأفعال حتى ألزمه الحجة فرفسه إبراهيم وقال قم أخزى الله من ينسبك إلى شيء من العلم والفهم وانصرف محموما فكان ذلك سبب علته التي مات فيها، وله كتب كثيرة منها كتاب الاستطاعة وكتاب المخلوق وكتاب الصفات والأسماء وكتاب إثبات الرسل وكتاب الإرجاء وكتاب الرد على الملحدين {cite:fihrist-ibn-al-nadim p. 254-255}."
  en: "Al-Husayn al-Najjar — the mujbir theologian whose fatal debate with al-Nazzam is proverbial {cite:fihrist-ibn-al-nadim}"
  es: "Al-Husayn al-Najjar — el teólogo mujbir cuyo debate fatal con al-Nazzam es proverbial {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Husayn al-Najjar — le théologien mujbir dont le débat fatal avec al-Nazzam est proverbial {cite:fihrist-ibn-al-nadim}"
  ur: "الحسین النجار - ایک مجبّر ماہرِ الہٰیات جس کی النجم کے ساتھ مہلک بحث ضرب المثل ہے۔"
  tr: "Ebu Abdullah el-Hüseyin bin Muhammed bin Abdullah el-Necer, büyük el-Majbara ve ilahiyatçılardan biri olan el-Abbas ibn Muhammed el-Haşimi tarzında bir dokumacıydı. Terazileri Baram halkından yaptığı söylenir. Konuştuğunda konuşması yarasa gibi çıkardı ve gözlemciler arasındaydı. El-Nizam ile toplantılar ve tartışmalar yaptı. El-Hüseyin el-Necer'in ölüm sebebi, İbrahim el-Necer ile görüşmesiydi. Nizam, ona karşı eylem tarzında argüman etti ve kanıtı kullanmak zorunda kalana kadar. İbrahim onu tekmeledi ve dedi ki, 'Kalk, Allah sana herhangi bir bilgi ya da anlayış atfeden birini utandırsın.' O da telaşla yüzünü döndü ve bu onun ölümüne sebep oldu. Yetenek Kitabı, Nitelikler ve İsimler Kitabı, Elçilerin İthpel Kitabı, Erteleme Kitabı ve Ateistleri Reddetme Kitabı gibi birçok kitap yazdı. {alıntı:) Fihrist-ibn-al-Nadim s. 254-255}."
  id: "Abu Abdullah al-Husayn ibn Muhammad ibn Abdullah al-Najjar adalah seorang penenun dengan gaya al-Abbas ibn Muhammad al-Hashimi, salah satu al-Majbara dan teolog besar. Dikatakan bahwa ia biasa membuat timbangan dari orang-orang Baram. Ketika ia berbicara, pidatonya terdengar seperti kelelawar dan ia termasuk di antara para pengamat. Ia mengadakan pertemuan dan debat dengan al-Nizam. Alasan kematian al-Husayn al-Najjar adalah karena ia bertemu dengan Ibrahim al-Nizam, yang berdebat melawannya dengan cara bertindak sampai dia terpaksa menggunakan bukti. Ibrahim menendangnya dan berkata, 'Bangkitlah, semoga Allah mempermalukan siapa pun yang mengaitkanmu dengan pengetahuan atau pengertian.' Dia berpaling dengan panik, yang menjadi penyebab kematiannya. Dia menulis banyak buku, termasuk Kitab Kemampuan, Kitab Atribut dan Nama, Kitab Ithpel Para Rasululan, Kitab Penundaan, dan Kitab Menolak Ateis. {cite:Fihrist-ibn-al-Nadim hlm. 254-255}."
