id: person/al-husayn-al-najjar
class: person
label: { ar: "الحسين النجار", en: "Al Husayn Al Najjar" }
summary:
  ar: "أبو عبد الله الحسين بن محمد بن عبد الله النجار وكان حائكا في طراز العباس بن محمد الهاشمي من جلة المجبرة ومتكلميهم وقد قيل إنه كان يعمل الموازين من أهل برم، وإذا تكلم كان كلامه صوت الخفاش وكان من أهل الناظرين وله مع النظام مجالس ومناظرات، وكان سبب موت الحسين النجار أنه اجتمع مع إبراهيم النظام فاحتج عليه في خلق الأفعال حتى ألزمه الحجة فرفسه إبراهيم وقال قم أخزى الله من ينسبك إلى شيء من العلم والفهم وانصرف محموما فكان ذلك سبب علته التي مات فيها، وله كتب كثيرة منها كتاب الاستطاعة وكتاب المخلوق وكتاب الصفات والأسماء وكتاب إثبات الرسل وكتاب الإرجاء وكتاب الرد على الملحدين {cite:fihrist-ibn-al-nadim p. 254-255}."
  en: "Al-Husayn al-Najjar — the mujbir theologian whose fatal debate with al-Nazzam is proverbial {cite:fihrist-ibn-al-nadim}"
