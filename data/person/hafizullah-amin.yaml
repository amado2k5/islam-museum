summary:
  ar: "سياسي شيوعي أفغاني، وُلد في بغمان سنة 1929 وتعلّم في كابل وجامعة كولومبيا. كان الرجل الثاني في حزب الشعب الديمقراطي بعد انقلاب ثور، فأطاح بنور محمد تركي في سبتمبر 1979 وقاد الدولة نحو مئة يوم، حتى اغتاله السوفييت في قصر تاج بيك بكابل في 27 ديسمبر 1979 عند بدء تدخلهم العسكري."
  en: "Afghan communist politician, born at Paghman in 1929 and educated at Kabul and Columbia University. The PDPA's second man after the Saur Revolution, he overthrew Nur Muhammad Taraki in September 1979 and headed the state for about a hundred days, until Soviet forces assassinated him at the Tajbeg Palace in Kabul on 27 December 1979 at the opening of their intervention."
  ur: "افغان کمیونسٹ سیاست دان، جو 1929ء میں پغمان میں پیدا ہوئے اور کابل اور کولمبیا یونیورسٹی میں تعلیم پائی۔ ثور انقلاب کے بعد پی ڈی پی اے کے دوسرے بڑے رہنما تھے؛ ستمبر 1979ء میں نور محمد ترہ کئی کو معزول کر کے تقریباً سو دن سربراہِ مملکت رہے، حتیٰ کہ 27 دسمبر 1979ء کو سوویت افواج نے مداخلت کے آغاز پر کابل کے تاج بیک محل میں انھیں قتل کر دیا۔"
