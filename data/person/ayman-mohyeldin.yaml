summary:
  ar: "صحفي ومذيع أمريكي من أصل مصري، وُلد في القاهرة سنة 1979. بدأ في إن بي سي وعمل منتجًا لسي إن إن في العراق، وغطى للجزيرة الإنجليزية حرب غزة 2008–2009 والربيع العربي قبل أن يعود إلى إن بي سي نيوز؛ ثم قدّم برامج على إم إس إن بي سي (إم إس ناو حاليًا)، منها «أيمن محيي الدين ريبورتس» و«أيمن»."
  en: "Egyptian-American journalist and anchor, born in Cairo in 1979. He began at NBC, produced for CNN in Iraq, and reported for Al Jazeera English on the 2008–2009 Gaza war and the Arab Spring before returning to NBC News; he went on to anchor Ayman Mohyeldin Reports and Ayman on MSNBC, now MS NOW."
  ur: "مصری نژاد امریکی صحافی اور اینکر، جو 1979 میں قاہرہ میں پیدا ہوئے۔ این بی سی سے آغاز کیا، عراق میں سی این این کے پروڈیوسر رہے، اور الجزیرہ انگلش کے لیے 2008–2009 کی غزہ جنگ اور عرب بہار کی رپورٹنگ کی؛ بعد میں این بی سی نیوز میں واپس آئے اور ایم ایس این بی سی (اب ایم ایس ناو) پر پروگرام پیش کیے۔"

