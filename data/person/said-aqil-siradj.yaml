summary:
  ar: عالم دين إندونيسي وُلد سنة 1953 في سيريبون. الرئيس التنفيذي الأسبق لنهضة العلماء ⁦(NU)⁩ ⁦(2010–2021)⁩، أكبر منظمة إسلامية في العالم، واليوم أحد كبار مستشاريها، ومن أبرز دعاة «إسلام أرخبيل» المعتدل.
  en: Indonesian religious scholar, born 1953 in Cirebon. Former executive chairman of Nahdlatul Ulama (NU) (2010–2021), the world's largest Islamic organisation, and now its senior advisor (Mustasyar);
    a leading advocate of the moderate 'Islam Nusantara'.
  ur: انڈونیشیائی عالم دین، 1953 میں چیریبون میں پیدا ہوئے۔ نحضت العلماء ⁦(NU)⁩ — دنیا کی سب سے بڑی اسلامی تنظیم — کے سابق ایگزیکٹو چیئرمین ⁦(2010–2021)⁩ اور اب اس کے سینئر مشیر ⁦(مستشار)⁩؛ «اسلام نوسنتارا»
    کے نمایاں داعی۔
  es: "Erudito religioso indonesio, nacido en 1953 en Cirebon. Expresidente ejecutivo de Nahdlatul Ulama (NU) (2010-2021), la organización islámica más grande del mundo, y actualmente su asesor principal (Mustasyar); destacado defensor del 'Islam Nusantara' moderado."
  fr: "Érudit religieux indonésien, né en 1953 à Cirebon. Ancien président exécutif de Nahdlatul Ulama (NU) (2010-2021), la plus grande organisation islamique au monde, et actuellement son conseiller principal (Mustasyar); un fervent défenseur de l'« Islam Nusantara » modéré."
  tr: "1953 yılında Sirebon'da doğmuş Endonezyalı bir dini alim. Dünyanın en büyük İslami örgütü olan Nahdlatul Ulama (NU)'nun (2010–2021) eski CEO'su ve bugün kıdemli danışmanlarından biri ve ılımlı 'takımada İslamı'nın önde gelen savunucularından biridir."
  id: "Seorang ulama agama Indonesia yang lahir tahun 1953 di Sirebon. Mantan CEO Nahdlatul Ulama (NU) (2010–2021), organisasi Islam terbesar di dunia, dan kini salah satu penasihat seniornya serta salah satu pendukung utama 'Islam kepulauan' moderat."
