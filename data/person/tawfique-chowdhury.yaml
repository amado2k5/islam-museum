summary:
  ar: مؤسس ورئيس «الرسالة الرحيمة» ⁦(Mercy Mission)⁩ العالمية؛ طبيب أسترالي من أصل بنغلاديشي درس في الجامعة الإسلامية بالمدينة المنورة، وبنى شبكة مشاريع خيرية وتعليمية إسلامية في عشرات البلدان.
  en: Founder and Executive Chairman of Mercy Mission Worldwide; a Bangladeshi-born Australian medical doctor who studied at the Islamic University of Madinah and built a network of Islamic charitable and
    educational projects across dozens of countries.
  ur: مرسی مشن ورلڈ وائیڈ کے بانی اور ایگزیکٹو چیئرمین؛ بنگلہ دیشی نژاد آسٹریلوی طبیب جنھوں نے جامعہ اسلامیہ مدینہ منورہ میں تعلیم پائی اور درجنوں ممالک میں اسلامی خدماتی و تعلیمی منصوبوں کا جال بنایا۔
  es: "Fundador y presidente ejecutivo de Mercy Mission Worldwide; médico australiano nacido en Bangladesh que estudió en la Universidad Islámica de Medina y creó una red de proyectos benéficos y educativos islámicos en decenas de países."
  fr: "Fondateur et président exécutif de Mercy Mission Worldwide; un médecin australien d'origine bangladaise qui a étudié à l'Université islamique de Médine et a mis en place un réseau de projets caritatifs et éducatifs islamiques dans des dizaines de pays."
  tr: "Küresel Mercy Mission'un kurucusu ve başkanı; Medine'deki İslam Üniversitesi'nde eğitim görmüş ve onlarca ülkede İslami hayır ve eğitim projeleri ağı kurmuş Bangladeşli kökenli Avustralyalı bir doktor."
  id: "Pendiri dan presiden Global Mercy Mission; seorang dokter asal Australia keturunan Bangladesh yang belajar di Universitas Islam di Madinah dan telah membangun jaringan proyek amal dan pendidikan Islam di puluhan negara."
