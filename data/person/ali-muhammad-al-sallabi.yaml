summary:
  ar: "الدكتور علي محمد الصلابي، كاتب معاصر في السيرة النبوية والتاريخ الإسلامي، مؤلف «السيرة النبوية: عرض وقائع وتحليل أحداث» الذي وقّع مقدمته في 18 رجب 1421هـ/16 أكتوبر 2000م، وكتب في الخلفاء والدولة الأموية والدولة العثمانية؛ يصف في مقدمته سنوات بحثه بأنها أنسته غربته وهجرته."
  en: "Dr Ali Muhammad al-Sallabi, a contemporary writer on the Prophet's biography and Islamic history, author of al-Sira al-Nabawiyya: Ard Waqa'i' wa-Tahlil Ahdath, whose preface he signed on 18 Rajab 1421 / 16 October 2000, and of books on the caliphs, the Umayyad state and the Ottoman state; in that preface he says his years of research made him forget his exile and emigration."
