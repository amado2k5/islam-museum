summary:
  ar: "الدكتور علي محمد الصلابي، كاتب معاصر في السيرة النبوية والتاريخ الإسلامي، مؤلف «السيرة النبوية: عرض وقائع وتحليل أحداث» الذي وقّع مقدمته في 18 رجب 1421هـ/16 أكتوبر 2000م، وكتب في الخلفاء والدولة الأموية والدولة العثمانية؛ يصف في مقدمته سنوات بحثه بأنها أنسته غربته وهجرته."
  en: "Dr Ali Muhammad al-Sallabi, a contemporary writer on the Prophet's biography and Islamic history, author of al-Sira al-Nabawiyya: Ard Waqa'i' wa-Tahlil Ahdath, whose preface he signed on 18 Rajab 1421 / 16 October 2000, and of books on the caliphs, the Umayyad state and the Ottoman state; in that preface he says his years of research made him forget his exile and emigration."
  es: "El Dr. Ali Muhammad al-Sallabi, escritor contemporáneo sobre la biografía del Profeta y la historia islámica, autor de al-Sira al-Nabawiyya: Ard Waqa'i' wa-Tahlil Ahdath, cuyo prefacio firmó el 18 de Rajab de 1421 / 16 de octubre de 2000, y de libros sobre los califas, el estado omeya y el estado otomano; en ese prefacio dice que sus años de investigación le hicieron olvidar su exilio y emigración."
  fr: "Le Dr Ali Muhammad al-Sallabi, écrivain contemporain spécialiste de la biographie du Prophète et de l'histoire islamique, auteur d'al-Sira al-Nabawiyya: Ard Waqa'i' wa-Tahlil Ahdath, dont il a signé la préface le 18 Rajab 1421 / 16 octobre 2000, et d'ouvrages sur les califes, l'État omeyyade et l'État ottoman; dans cette préface, il déclare que ses années de recherche lui ont fait oublier son exil et son émigration."
  ur: "ڈاکٹر علی محمد السلبی، سیرت نبوی اور اسلامی تاریخ کے ایک ہم عصر مصنف، السیرۃ النبویہ کے مصنف: ارد وقائع و تحلیل احدث، جس کے دیباچے پر انہوں نے 18 رجب 1421/16 اکتوبر 2000 کو دستخط کیے، اور کتابیں، ریاست اور ریاست اور ریاست پر کتابیں لکھیں۔ اس دیباچے میں وہ کہتے ہیں کہ ان کی برسوں کی تحقیق نے انہیں اپنی جلاوطنی اور ہجرت کو بھلا دیا۔"
