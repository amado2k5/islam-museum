summary:
  ar: "الذي قتل الزبير بن العوام بوادي السباع: نزل الزبير إلى الصلاة فقال أتؤمني أو أؤمك فأمه الزبير فقتله في الصلاة، وأتى علياً بسيفه وخاتمه ورأسه فقال علي سيف طالما جلا الكرب عن وجه رسول الله لكنه الحين ومصارع السوء وقاتل ابن صفية في النار، وقال في نفسه أتيت علياً برأس الزبير وقد كنت أرجو به الزلفى فبشر بالنار قبل العيان وبئس بشارة ذي التحفة {cite:muruj-al-dhahab p. 657}."
  en: "al-Zubayr's killer at Wadi'l-Siba' — 'lead me or I'll lead you' in prayer, then struck mid-salah; he brought the head and sword to Ali expecting favour and heard instead 'tell Ibn Safiyya's killer of the Fire' — and penned his own regret: 'I came with al-Zubayr's head hoping nearness, and was given the Fire for a greeting' {cite:muruj-al-dhahab p. 657}."
  es: "El asesino de al-Zubayr en Wadi'l-Siba' — 'guíame o te guiaré' en la oración, y luego fue atacado en medio de la oración; llevó la cabeza y la espada a Ali esperando su favor y en cambio escuchó 'dile al asesino de Ibn Safiyya que le dé el Fuego' — y escribió su propio arrepentimiento: 'Vine con la cabeza de al-Zubayr esperando cercanía, y me dieron el Fuego como saludo' {cite:muruj-al-dhahab p. 657}."
  fr: "Le meurtrier d'al-Zubayr à Wadi'l-Siba' — « guide-moi ou je te guiderai » en prière, puis frappa au milieu de la salat; il apporta la tête et l'épée à Ali en espérant une faveur et entendit à la place « dis au meurtrier d'Ibn Safiyya le Feu » — et écrivit son propre regret: « Je suis venu avec la tête d'al-Zubayr en espérant la proximité, et j'ai reçu le Feu pour salut » {cite:muruj-al-dhahab p. 657}."
