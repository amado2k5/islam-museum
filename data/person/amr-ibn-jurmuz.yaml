label: { ar: "عمرو بن جرموز التميمي", en: "'Amr ibn Jurmuz al-Tamimi" }
summary:
  ar: "الذي قتل الزبير بن العوام بوادي السباع: نزل الزبير إلى الصلاة فقال أتؤمني أو أؤمك فأمه الزبير فقتله في الصلاة، وأتى علياً بسيفه وخاتمه ورأسه فقال علي سيف طالما جلا الكرب عن وجه رسول الله لكنه الحين ومصارع السوء وقاتل ابن صفية في النار، وقال في نفسه أتيت علياً برأس الزبير وقد كنت أرجو به الزلفى فبشر بالنار قبل العيان وبئس بشارة ذي التحفة {cite:muruj-al-dhahab p. 657}."
  en: "al-Zubayr's killer at Wadi'l-Siba' — 'lead me or I'll lead you' in prayer, then struck mid-salah; he brought the head and sword to Ali expecting favour and heard instead 'tell Ibn Safiyya's killer of the Fire' — and penned his own regret: 'I came with al-Zubayr's head hoping nearness, and was given the Fire for a greeting' {cite:muruj-al-dhahab p. 657}."
