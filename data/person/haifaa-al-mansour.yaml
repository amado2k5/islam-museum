  ar: "مخرجة سعودية، وُلدت في الزلفي سنة 1974 ونشأت في الأحساء؛ من أوائل المخرجات السعوديات وأشهرهن، أخرجت «وجدة» (2012)، أول فيلم روائي يُصوَّر بالكامل في السعودية وأول ترشيح سعودي للأوسكار، ثم «ماري شيلي» (2017) و«المرشحة المثالية» (2019)."
  en: "Saudi film director, born in Al Zulfi in 1974 and brought up in Al-Hasa. One of the first and best-known female Saudi filmmakers, she directed Wadjda (2012), the first feature shot entirely in Saudi Arabia and Saudi Arabia's first Oscar submission, followed by Mary Shelley (2017) and The Perfect Candidate (2019)."
