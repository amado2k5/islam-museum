summary:
  ar: "ابن الخليفة عمر بن الخطاب وأمه زينب بنت مظعون؛ أسلم صغيراً مع أبيه وهاجر، وعُرض على النبي ببدر وأحد فاستُصغر وأُجيز في الخندق، وهو من المكثرين من الحديث وعُرف بتتبع آثار النبي. تصفه دائرة المعارف الإسلامية بأنه من أبرز شخصيات الجيل الأول وأنه بقي بمعزل عن الحرب الأهلية، وتذكر أن الخلافة عُرضت عليه ثلاث مرات فرفضها لأنه أراد انتخاباً بإجماع وتجنب سفك الدماء. توفي سنة 73هـ على قول الجمهور وقيل 74هـ. وفي مسلم قصّ رؤياه على النبي فقال «نعم الرجل عبد الله لو كان يصلي من الليل» فكان لا ينام من الليل إلا قليلاً {cite:sahih-muslim 2479}."
  en: "The son of the caliph Umar ibn al-Khattab and Zaynab bint Maz'un; he embraced Islam young with his father and emigrated, was presented to the Prophet at Badr and Uhud and turned back as too young, and was accepted at al-Khandaq; he is one of the great narrators of hadith and was known for following the Prophet's footsteps. The Encyclopaedia of Islam calls him one of the most prominent figures of the first generation, says he stayed apart from the civil war, and reports that the caliphate was offered to him three times and refused because he wanted a unanimous election and wished to avoid bloodshed. He died in 73 AH on the majority view, some say 74 AH."
  ur: "عمر بن خطاب کے بیٹے اور کثیر الروایت صحابی؛ کم عمری میں بدر و احد میں شرکت کی اجازت نہ ملی، جبکہ خندق میں شریک ہوئے۔ انسائیکلوپیڈیا آف اسلام انہیں پہلی نسل کی نمایاں ترین شخصیات میں شمار کرتا ہے، کہتا ہے کہ وہ خانہ جنگی سے الگ رہے، اور بتاتا ہے کہ انہیں خلافت کی پیشکش تین بار ہوئی جو انہوں نے متفقہ انتخاب کی خواہش اور خونریزی سے بچنے کے لیے رد کر دی۔ {cite:ibn-hajar-isaba}"
  fr: "Le fils du calife Umar ibn al-Khattab et de Zaynab bint Maz'un ; il embrassa l'islam jeune avec son père et émigra, fut présenté au Prophète à Badr et à Uhud et renvoyé comme trop jeune, puis fut accepté à al-Khandaq ; il est l'un des grands transmetteurs du hadith et était connu pour suivre les traces du Prophète. L'Encyclopédie de l'Islam le dit l'une des figures les plus éminentes de la première génération, indique qu'il se tint à l'écart de la guerre civile, et rapporte que le califat lui fut offert trois fois et qu'il le refusa parce qu'il voulait une élection unanime et souhaitait éviter l'effusion de sang. Il mourut en 73 H selon l'avis majoritaire, certains disent 74 H."
  es: "Hijo del califa Umar ibn al-Khattab y Zaynab bint Maz'un, se convirtió al islam joven junto a su padre y emigró. Fue presentado al Profeta en Badr y Uhud, pero fue rechazado por su corta edad, y finalmente fue aceptado en al-Khandaq. Es uno de los grandes narradores de hadices y se destacó por seguir los pasos del Profeta. La Enciclopedia del Islam lo considera una de las figuras más prominentes de la primera generación, afirma que se mantuvo al margen de la guerra civil y relata que se le ofreció el califato en tres ocasiones, pero lo rechazó porque deseaba una elección unánime y quería evitar el derramamiento de sangre. Murió en el año 73 de la Hégira, según la opinión mayoritaria, aunque algunos indican que en el año 74."
  tr: "Halife Ömer ibn el-Hattab ve annesi Zeynep bint Mazun'un oğlu olan Abdullah, babasıyla birlikte genç yaşta İslam'ı kabul ederek hicret etti. Bedir ve Uhud Savaşlarında Peygamber'e takdim edildi, ancak savaşmak için çok genç olduğu düşünüldü. Daha sonra Hendek Savaşı'na katılmasına izin verildi. Çok sayıda hadis rivayet eden Abdullah, Peygamber'in hayatını titizlikle incelemesiyle tanınıyordu. İslam Ansiklopedisi onu ilk nesil Müslümanların en önde gelen isimlerinden biri olarak tanımlar ve iç savaşa karışmadığını belirtir. Halifeliğin kendisine üç kez teklif edildiğini, ancak kan dökülmesini önlemek için oy birliğiyle seçimi tercih ettiği için reddettiğini ifade eder. Çoğunluk görüşüne göre 73 Hicri yılında vefat etmiştir, ancak bazı kaynaklar 74 Hicri yılını söyler. Sahih Müslim'de, Peygamber'e rüyasını anlattığı ve Peygamber'in, \"Abdullah ne kadar mükemmel bir insan! Keşke geceleri namaz kılsa!\" dediği rivayet edilir. Bundan sonra geceleri çok az uyumaya başladı. (Sahih Müslim 2479'a bakınız)."
  id: "Putra Khalifah Umar ibn al-Khattab dan ibunya Zaynab bint Maz'un, ia memeluk Islam sejak kecil bersama ayahnya dan berhijrah. Ia diperkenalkan kepada Nabi pada Perang Badar dan Uhud, tetapi dianggap terlalu muda untuk berperang. Ia kemudian diizinkan untuk berpartisipasi dalam Perang Parit. Ia adalah perawi hadits yang produktif dan dikenal karena studinya yang teliti tentang kehidupan Nabi. Ensiklopedia Islam menggambarkannya sebagai salah satu tokoh paling terkemuka dari generasi pertama Muslim, mencatat bahwa ia tetap tidak terlibat dalam perang saudara. Disebutkan bahwa kekhalifahan ditawarkan kepadanya tiga kali, tetapi ia menolaknya karena ia lebih memilih pemilihan bulat untuk menghindari pertumpahan darah. Ia meninggal pada tahun 73 H menurut pendapat mayoritas, meskipun beberapa mengatakan 74 H. Dalam Sahih Muslim, diriwayatkan bahwa ia menceritakan mimpinya kepada Nabi, yang berkata, \"Betapa mulianya Abdullah! Seandainya saja ia mau shalat malam!\" Setelah itu, ia hanya tidur sedikit di malam hari. (Lihat Sahih Muslim 2479)."
