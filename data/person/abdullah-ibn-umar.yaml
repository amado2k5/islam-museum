summary:
  ar: ابن الخليفة عمر بن الخطاب وأمه زينب بنت مظعون؛ أسلم صغيراً مع أبيه وهاجر، وعُرض على النبي ببدر وأحد فاستُصغر وأُجيز في الخندق، وهو من المكثرين من الحديث وعُرف بتتبع آثار النبي؛ توفي سنة 73هـ على قول الجمهور وقيل 74هـ. وفي مسلم قصّ رؤياه على النبي فقال «نعم الرجل عبد الله لو كان يصلي من الليل» فكان لا ينام من الليل إلا قليلاً {cite:sahih-muslim 2479}.
  en: The son of the caliph Umar ibn al-Khattab and Zaynab bint Maz'un; he embraced Islam young with his father and emigrated, was presented to the Prophet at Badr and Uhud and turned back as too young, and was accepted at al-Khandaq; he is one
    of the great narrators of hadith and was known for following the Prophet's footsteps; he died in 73 AH on the majority view, some say 74 AH.
