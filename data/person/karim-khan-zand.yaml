summary:
  ar: "محمد كريم خان زند (ق. 1705 – 1 مارس 1779) زعيم من قبيلة زند في ناحية ملاير، خدم في جيش نادر شاه ثم أسس الدولة الزندية وحكم إيران — ما عدا خراسان وبلوشستان — من 1751 إلى 1779. رفض لقب الشاه وحكم بلقب «وكيل الرعايا» من شيراز، فأعاد إلى البلاد الأمن والرخاء بعد أربعين سنة من الحروب، وحاصر البصرة العثمانية وأخذها في 1775–1776، وأبقى آغا محمد خان القاجاري الشاب رهينة مكرّمًا في بلاطه."
  en: "Mohammad Karim Khan Zand (c. 1705 – 1 March 1779) was a Zand tribesman of the Malayer district who, after service in Nader Shah's army, founded the Zand dynasty and ruled Iran, except Khorasan and Balochistan, from 1751 to 1779. Refusing the title of shah, he ruled as Vakil al-Ra'aya, 'representative of the people', from Shiraz, restoring peace and prosperity after forty years of war; he besieged and took Ottoman Basra in 1775–1776, and kept the young Agha Mohammad Khan Qajar as an honoured hostage at his court."
  ur: "محمد کریم خان زند (ق. 1705ء – 1 مارچ 1779ء) ملایر کے علاقے کے زند قبیلے کے سردار تھے؛ نادر شاہ کی فوج میں خدمت کے بعد انہوں نے زند خاندان کی بنیاد رکھی اور 1751ء سے 1779ء تک خراسان و بلوچستان کے سوا تمام ایران پر حکومت کی۔ شاہ کا لقب اختیار کرنے سے انکار کر کے وہ شیراز سے «وکیل الرعایا» کے لقب سے حکمران بنے، چالیس سال کی جنگوں کے بعد ملک میں امن و خوشحالی واپس لائے، 1775ء–1776ء میں عثمانی بصرہ کا محاصرہ کر کے اسے فتح کیا، اور نوجوان آغا محمد خان قاجار کو اپنے دربار میں معزز یرغمال رکھا۔"

