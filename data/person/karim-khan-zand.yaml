    note: >-
      No source read names a religion or a legal school for the man
      himself, and Wikidata carries no religion value for him at all.
      The tradition he ruled is stated in full — Persia's Twelver Shia
      sanctuaries at Najaf and Karbala mattered enough to his subjects
      that Ottoman interference with Iranian pilgrims who had died in
      the 1773 plague and exactions on pilgrims were among his stated
      grounds for the war of 1775–1776, while his own religious policy
      broke with the Safavid pattern, the English article recording
      that unlike the Safavids he did not seek the approval of the
      ulama, formerly the bulwarks of the shah's authority. Rule over
      a Shia state and concern for its pilgrims are dynastic context,
      not a naming of the man's school, so his faith is recorded as
      unknown.
