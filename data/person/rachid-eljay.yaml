summary:
  ar: "إمام ومدوّن مرئي فرنسي من أصل مغربي، وُلد في بريست سنة 1980، تولى إمامة مسجد السنة في بريست سنة 2004، واشتهر بمقاطعه الدعوية على يوتيوب، ثم غيّر خطابه منذ أواخر 2015، ونجا من محاولة اغتيال سنة 2019."
  en: "French imam and video creator of Moroccan origin, born in Brest in 1980. He became imam of the Sunna mosque in Brest in 2004 and grew famous through his preaching videos on YouTube; from late 2015 he changed his discourse, and in 2019 he survived an assassination attempt."
  ur: "مراکشی نژاد فرانسیسی امام اور ویڈیو ساز، جو 1980 میں بریسٹ میں پیدا ہوئے۔ وہ 2004 میں بریسٹ کی مسجد السنہ کے امام بنے اور یوٹیوب پر اپنی دعوتی ویڈیوز سے مشہور ہوئے؛ 2015 کے اواخر سے انہوں نے اپنا اسلوب بدلا، اور 2019 میں قاتلانہ حملے سے بچ گئے۔"
  es: "Imán francés y creador de vídeos de origen marroquí, nacido en Brest en 1980. Se convirtió en imán de la mezquita Sunna de Brest en 2004 y se hizo famoso gracias a sus vídeos de predicación en YouTube; a finales de 2015 cambió su discurso y en 2019 sobrevivió a un intento de asesinato."
  fr: "Imam et vidéaste français d'origine marocaine, né à Brest en 1980. Il est devenu imam de la mosquée Sunna de Brest en 2004 et s'est fait connaître grâce à ses vidéos de prédication sur YouTube; à partir de fin 2015, il a changé de discours, et en 2019, il a survécu à une tentative d'assassinat."
  tr: "1980 yılında Brest doğumlu, Fas kökenli Fransız imam ve görsel blog yazarı olan Sher, 2004'te Brest'teki Sünni caminin imamı oldu ve YouTube'daki vaaz videolarıyla ünlendi. 2015 sonlarından itibaren söylemini değiştirdi ve 2019'daki suikast girişiminden sağ kurtuldu."
  id: "Seorang imam Prancis dan blogger visual keturunan Maroko, lahir di Brest pada tahun 1980, ia mengambil alih sebagai imam masjid Sunni di Brest pada tahun 2004 dan menjadi terkenal berkat video khotbahnya di YouTube. Ia mengubah retorika sejak akhir 2015 dan selamat dari upaya pembunuhan pada tahun 2019."
