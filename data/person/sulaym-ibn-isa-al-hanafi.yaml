summary:
  ar: "أبو عيسى سُليم بن عيسى الحنفي الكوفي، أخص أصحاب حمزة الزيات وأضبطهم وأقومهم بحروفه، وهو الذي خلفه في القيام بالقراءة؛ توفي سنة 188هـ، وقيل 187هـ {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  en: "Abu 'Isa Sulaym ibn 'Isa al-Hanafi of Kufa, the closest of Hamza al-Zayyat's companions, the most exact and most faithful to his letters, and the one who succeeded him in leading the reading; he died in 188 AH, or 187 by another report {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  ur: "ابو عیسیٰ سُلیم بن عیسیٰ حنفی کوفی، حمزہ زیات کے سب سے خاص، سب سے ضابط اور ان کے حروف پر سب سے زیادہ قائم رہنے والے ساتھی، اور قراءت کی قیادت میں ان کے جانشین؛ 188ھ میں فوت ہوئے، اور ایک قول میں 187ھ {cite:nashr-dahman-damascus-1345-v1 p. 177}."
  es: "Abu 'Isa Sulaym ibn 'Isa al-Hanafi de Kufa, el más cercano de los compañeros de Hamza al-Zayyat, el más exacto y fiel a sus cartas, y quien le sucedió en la dirección de la lectura; murió en el año 188 AH, o en el 187 según otro informe {cite:nashr-dahman-damascus-1345-v1 p. 177}."
