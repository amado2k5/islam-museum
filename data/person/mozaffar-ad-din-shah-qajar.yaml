summary:
  ar: "الشاه الخامس من الأسرة القاجارية في إيران (حكم من 1 مايو 1896 إلى يناير 1907)، ابن ناصر الدين شاه وخليفته. بعد خمسة وثلاثين عامًا وليًّا للعهد وحاكمًا لأذربيجان، شهد عهده امتياز دارسي النفطي سنة 1901، ثم منحه الدستور في ديسمبر 1906 تحت ضغط الثورة الدستورية، قبل أيام من وفاته."
  en: "Fifth shah of Qajar Iran (reigned 1 May 1896 – January 1907), son and successor of Naser al-Din Shah. After thirty-five years as crown prince and governor of Azerbaijan, his reign brought the D'Arcy oil concession of 1901 and, under the pressure of the Constitutional Revolution, his grant of a constitution in December 1906, days before his death."
  ur: "قاجاری ایران کے پانچویں شاہ (دورِ حکومت 1 مئی 1896 تا جنوری 1907)؛ ناصر الدین شاہ کے بیٹے اور جانشین۔ ولی عہد اور آذربائیجان کے گورنر کی حیثیت سے پینتیس برس گزارنے کے بعد ان کے عہد میں 1901 کی ڈارسی تیل رعایت آئی اور آئینی انقلاب کے دباؤ پر انہوں نے دسمبر 1906 میں، اپنی وفات سے چند روز قبل، آئین عطا کیا۔"
