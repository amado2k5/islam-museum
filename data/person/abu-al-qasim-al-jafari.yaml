summary:
  ar: "رجل من ولد جعفر بن أبي طالب قُتل يوم الجمعة سابع عشر صفر سنة 289هـ في القتال عند ظبوة من عسكر الهادي."
  en: "A man of the line of Ja'far ibn Abi Talib who was killed on Friday the seventeenth of Safar 289 AH in the fighting at Zabwa on al-Hadi's side."
  ur: "جعفر بن ابی طالب کی اولاد میں سے ایک شخص جو جمعہ سترہ صفر 289ھ کو ظبوہ کی لڑائی میں ہادی کی طرف سے مارے گئے۔"
  fr: "Un homme de la lignée de Ja'far ibn Abi Talib qui fut tué le vendredi dix-sept Safar 289 H lors des combats de Zabwa, du côté d'al-Hadi."
  es: "Un hombre de la línea de Ja'far ibn Abi Talib que murió el viernes 17 de Safar del año 289 de la Hégira en los combates de Zabwa, del lado de al-Hadi."
  tr: "Cafer ibn Ebu Talib'in soyundan bir adam, Hicri 289 yılının Safer ayının 17. Cuma günü, Zübve'deki çatışmalarda, Hadi'nin ordusundan şehit düştü."
  id: "Seorang pria dari keturunan Ja'far bin Abi Talib gugur pada hari Jumat, tanggal tujuh belas Safar 289 H, dalam pertempuran di Dhubwa, dari pasukan Al-Hadi."
