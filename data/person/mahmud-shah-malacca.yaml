summary:
  ar: "السلطان محمود شاه ⁦(ت. 1528)⁩، ثامن سلاطين ملقا وآخرهم، وابن السلطان علاء الدين رعاية شاه وحفيد منصور شاه. نُصّب صغيرًا بعد موت أبيه فحكم من 1488، وكانت إدارة السلطنة بيد البنداهارا تون بيراك حتى وفاته سنة 1498. وفي عهده سقطت ملقا بيد البرتغاليين سنة 1511، ففرّ إلى بهاغ ثم اتخذ بنتن عاصمة وقاد منها اتحادًا ملايويًا مسلمًا هاجم ملقا المحتلة مرارًا بين 1515 و1519، حتى دمّر البرتغاليون بنتن سنة 1526 ففرّ إلى كمبار برياو ومات فيها سنة 1528."
  en: "Sultan Mahmud Shah (d. 1528), eighth and last sultan of Malacca, son of Sultan Alauddin Riayat Shah and grandson of Mansur Shah. Installed as a youth on his father's death, he reigned from 1488, with the sultanate administered by the bendahara Tun Perak until the latter's death in 1498. Malacca fell to the Portuguese in 1511 in his reign; he fled to Pahang, made Bintan his capital and from there led a Malay Muslim confederacy that attacked occupied Malacca repeatedly between 1515 and 1519, until the Portuguese destroyed Bintan in 1526 and he fled to Kampar in Riau, where he died in 1528."
  ur: "سلطان محمود شاہ ⁦(وفات 1528ء)⁩، ملاکا کے آٹھویں اور آخری سلطان، سلطان علاء الدین رعایہ شاہ کے بیٹے اور منصور شاہ کے پوتے تھے۔ وہ اپنے والد کی وفات پر کم عمری میں تخت نشین ہوئے اور 1488ء سے حکمران رہے؛ بنداہارا تن پیراک 1498ء میں اپنی وفات تک سلطنت کا نظم و نسق چلاتے رہے۔ انہی کے عہد میں 1511ء میں ملاکا پرتگیزیوں کے ہاتھوں فتح ہوا؛ وہ پہانگ فرار ہوئے، بنتن کو اپنا دارالحکومت بنایا اور وہاں سے ایک ملائی مسلم اتحاد کی قیادت کرتے ہوئے 1515ء سے 1519ء کے درمیان مقبوضہ ملاکا پر بار بار حملے کیے، یہاں تک کہ 1526ء میں پرتگیزیوں نے بنتن تباہ کر دیا اور وہ ریاؤ کے کمبار فرار ہو گئے، جہاں 1528ء میں ان کی وفات ہوئی۔"
  es: "El sultán Mahmud Shah (fallecido en 1528), octavo y último sultán de Malaca, hijo del sultán Alauddin Riayat Shah y nieto de Mansur Shah, fue coronado joven tras la muerte de su padre. Reinó desde 1488, con el sultanato administrado por el bendahara Tun Perak hasta la muerte de este último en 1498. Malaca cayó en manos de los portugueses en 1511 durante su reinado; huyó a Pahang, estableció Bintan como su capital y desde allí lideró una confederación musulmana malaya que atacó repetidamente la Malaca ocupada entre 1515 y 1519, hasta que los portugueses destruyeron Bintan en 1526 y huyó a Kampar, en Riau, donde falleció en 1528."
  fr: "Le sultan Mahmud Shah (décédé en 1528), huitième et dernier sultan de Malacca, fils du sultan Alauddin Riayat Shah et petit-fils de Mansur Shah, fut intronisé jeune à la mort de son père. Il régna à partir de 1488, le sultanat étant administré par le bendahara Tun Perak jusqu'à la mort de ce dernier en 1498. Malacca tomba aux mains des Portugais en 1511 durant son règne; il s'enfuit alors à Pahang, établit sa capitale à Bintan et, de là, dirigea une confédération malaise musulmane qui attaqua et occupa Malacca à plusieurs reprises entre 1515 et 1519, jusqu'à la destruction de Bintan par les Portugais en 1526. Il se réfugia ensuite à Kampar, dans l'État de Riau, où il mourut en 1528."
  tr: "Sultan Mahmud Şah (ö. 1528), Malakka Sultanlarının sekizincisi ve sonuncusuydu, Sultan Alauddin Ra'iyat Shah'ın oğlu ve Mansur Şah'ın torunu. Babası öldükten sonra reşit olmayan olarak atandı ve 1488'den itibaren hüküm sürdü; sultanlığın yönetimi Pandahara Tun Perak'ın elindeydi ve 1498'deki ölümüne kadar devam etti. Saltanatı sırasında Malakka 1511'de Portekizlilerin eline geçti, bu yüzden Bahag'a kaçtı, ardından Benten'i başkent yaptı ve oradan bir Malay Müslüman federasyonu yönetti; 1515-1519 yılları arasında işgal altındaki Malakka'ya defalarca saldırdı, ta ki Portekizliler 1526'da Benten'i yok edene kadar; bunun üzerine Kambar Briao'ya kaçtı ve 1528'de orada öldü."
  id: "Sultan Mahmud Shah (wafat 1528), sultan Malaka kedelapan dan terakhir, putra Sultan Alauddin Ra'iyat Shah, dan cucu Mansur Shah. Ia diangkat menjadi anak di bawah umur setelah kematian ayahnya dan memerintah sejak 1488, dan administrasi kesultanan berada di tangan Pandahara Tun Perak hingga kematiannya pada 1498. Selama masa pemerintahannya, Malaka jatuh ke tangan Portugis pada 1511, sehingga ia melarikan diri ke Bahag, kemudian mengambil Benten sebagai ibu kotanya dan memimpin federasi Muslim Melayu dari sana yang berulang kali menyerang Malaka yang diduduki antara 1515 dan 1519, hingga Portugis menghancurkan Benten pada 1526, sehingga ia melarikan diri ke Kambar Briao dan meninggal di sana pada 1528."

