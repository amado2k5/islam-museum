summary:
  ar: "السلطان محمود شاه (ت. 1528)، ثامن سلاطين ملقا وآخرهم، وابن السلطان علاء الدين رعاية شاه وحفيد منصور شاه. نُصّب صغيرًا بعد موت أبيه فحكم من 1488، وكانت إدارة السلطنة بيد البنداهارا تون بيراك حتى وفاته سنة 1498. وفي عهده سقطت ملقا بيد البرتغاليين سنة 1511، ففرّ إلى بهاغ ثم اتخذ بنتن عاصمة وقاد منها اتحادًا ملايويًا مسلمًا هاجم ملقا المحتلة مرارًا بين 1515 و1519، حتى دمّر البرتغاليون بنتن سنة 1526 ففرّ إلى كمبار برياو ومات فيها سنة 1528."
  en: "Sultan Mahmud Shah (d. 1528), eighth and last sultan of Malacca, son of Sultan Alauddin Riayat Shah and grandson of Mansur Shah. Installed as a youth on his father's death, he reigned from 1488, with the sultanate administered by the bendahara Tun Perak until the latter's death in 1498. Malacca fell to the Portuguese in 1511 in his reign; he fled to Pahang, made Bintan his capital and from there led a Malay Muslim confederacy that attacked occupied Malacca repeatedly between 1515 and 1519, until the Portuguese destroyed Bintan in 1526 and he fled to Kampar in Riau, where he died in 1528."
  ur: "سلطان محمود شاہ (وفات 1528ء)، ملاکا کے آٹھویں اور آخری سلطان، سلطان علاء الدین رعایہ شاہ کے بیٹے اور منصور شاہ کے پوتے تھے۔ وہ اپنے والد کی وفات پر کم عمری میں تخت نشین ہوئے اور 1488ء سے حکمران رہے؛ بنداہارا تن پیراک 1498ء میں اپنی وفات تک سلطنت کا نظم و نسق چلاتے رہے۔ انہی کے عہد میں 1511ء میں ملاکا پرتگیزیوں کے ہاتھوں فتح ہوا؛ وہ پہانگ فرار ہوئے، بنتن کو اپنا دارالحکومت بنایا اور وہاں سے ایک ملائی مسلم اتحاد کی قیادت کرتے ہوئے 1515ء سے 1519ء کے درمیان مقبوضہ ملاکا پر بار بار حملے کیے، یہاں تک کہ 1526ء میں پرتگیزیوں نے بنتن تباہ کر دیا اور وہ ریاؤ کے کمبار فرار ہو گئے، جہاں 1528ء میں ان کی وفات ہوئی۔"

