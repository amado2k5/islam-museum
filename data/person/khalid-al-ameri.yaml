summary:
  ar: صانع محتوى إماراتي وُلد سنة 1983؛ من أكبر صنّاع المحتوى الاجتماعي العرب، تجمع مقاطعه العائلية — مع زوجته وأولاده — بين الكوميديا والقيم العائلية الإماراتية، ولديه أكثر من عشرين مليون متابع ويتحدث
    عن تجارب الثقافة المشتركة.
  en: Emirati content creator born in 1983; among the Arab world's biggest social-media personalities, his family videos with his wife and children blend comedy and Emirati family values, earning over twenty
    million followers and bridging cultures.
  ur: اماراتی مواد ساز جو 1983 میں پیدا ہوا؛ عرب دنیا کی بڑی سوشل شخصیات میں، بیوی بچوں کے ساتھ خاندانی ویڈیوز کامیڈی اور اماراتی خاندانی اقدار ملاتی ہیں، بیس ملین سے زائد فالوورز اور ثقافتوں کو جوڑنے والا۔
  es: "Creador de contenido emiratí nacido en 1983; una de las personalidades más importantes de las redes sociales en el mundo árabe, sus vídeos familiares con su esposa e hijos combinan la comedia y los valores familiares emiratíes, lo que le ha valido más de veinte millones de seguidores y tiende puentes entre culturas."
  fr: "Créateur de contenu émirati né en 1983; l'une des plus grandes personnalités des médias sociaux du monde arabe, ses vidéos familiales avec sa femme et ses enfants mêlent humour et valeurs familiales émiraties, lui valant plus de vingt millions d'abonnés et établissant des ponts entre les cultures."
  tr: "1983 doğumlu bir Emirlikli içerik üreticisi; en büyük Arap sosyal içerik üreticilerinden biri olan Emir'in aile klipleri — eşi ve çocuklarıyla birlikte — komedi ve Emirlik aile değerlerini birleştiriyor, yirmi milyondan fazla takipçisi var ve paylaşılan kültürel deneyimlerden bahsediyor."
  id: "Seorang kreator konten Emirat yang lahir pada tahun 1983; salah satu kreator konten sosial Arab terbesar, klip keluarganya — bersama istri dan anak-anaknya — menggabungkan komedi dan nilai-nilai keluarga Emirat, ia memiliki lebih dari dua puluh juta pengikut dan berbicara tentang pengalaman budaya bersama."
