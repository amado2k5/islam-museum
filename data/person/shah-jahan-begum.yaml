summary:
  ar: "بيغوم بوبال في وسط الهند — اسميًا من سنة 1844 طفلةً ووالدتها سكندر بيكم تحكم وصيةً عليها، وباسمها من سنة 1868 حتى وفاتها سنة 1901. أصلحت قوانين بوبال وقضاءها وصحتها وماليتها، وبدأت بناء تاج المساجد، وموّلت جزئيًا مسجد شاه جهان في ووكينغ، وطبعت كتبًا دينية في مطبعتها الشاهجهانية، وألّفت «تہذيب النسوان» و«خزينۃ اللغات»."
  en: "Begum of Bhopal in central India — nominally from 1844 as a child, with her mother Sikandar Begum ruling as regent, and in her own right from 1868 until her death in 1901. She reformed Bhopal's laws, courts, health services and revenue, began the Taj-ul-Masajid, part-funded the Shah Jahan Mosque at Woking, printed religious books at her Shahjahani Press, and wrote Tahdhib al-Niswan and Khazinat al-Lughat."
  ur: "وسط ہندوستان کی ریاست بھوپال کی بیگم — 1844 میں کم عمری میں رسمی طور پر، والدہ سکندر بیگم کی نیابت میں، اور 1868 سے 1901 میں وفات تک باقاعدہ حکمران۔ انہوں نے بھوپال کے قوانین، عدلیہ، صحت اور مالیات کی اصلاح کی، تاج المساجد کی بنیاد رکھوائی، ووکنگ کی شاہ جہاں مسجد کی جزوی مالی مدد کی، اپنے مطبع شاہجہانی سے دینی کتب شائع کروائیں اور «تہذیب النسواں» اور «خزینۃ اللغات» تصنیف کیں۔"
