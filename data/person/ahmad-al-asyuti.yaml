summary:
  ar: "شهاب الدين أحمد بن عبد الخالق الأسيوطي؛ سمع من أبيه ومن عبد الرحيم بن القاري وأجاز له وكان يواظب التكسب بالشهادة في جامع ظاهر الوراقين ومات في ثاني عشر ربيع الآخر سنة ثمان وثلاثين وثمانمائة {cite:shadharat-dhahab p. 225}."
  en: "Shihab al-Din al-Asyuti — licensed by his father and Abd al-Rahim b. al-Qari, earning steadily as a witness at the Waraqin mosque; died 12 Rabi' II 838 {cite:shadharat-dhahab p. 225}."
  fr: "Shihab al-Din al-Asyuti, autorisé par son père et Abd al-Rahim b. al-Qari, gagnait régulièrement sa vie comme témoin à la mosquée des Warraqin ; mort le 12 rabi' II 838 H {cite:shadharat-dhahab p. 225}."
  es: "Shihab al-Din al-Asyuti - autorizado por su padre y Abd al-Rahim b. al-Qari, que ganaba constantemente como testigo en la mezquita de Waraqin; murió el 12 de Rabi' II 838 {cita: shadharat-dhahab p. 225}."
  ur: "شہاب الدین الاسوطی - اپنے والد اور عبد الرحیم بی کے ذریعہ لائسنس یافتہ۔ القاری، مسجد وراقین میں گواہ کے طور پر مسلسل کما رہا ہے۔ متوفی 12 ربیع الثانی 838۔ 225}۔"
  tr: "Şihab el-Din Ahmed ibn Abd el-Halik el-Asyuti; babasından ve Abd el-Rahim ibn el-Kari'den işitti ve öğretme izni aldı. Zahir el-Varrakin camisinde şahitlik ederek geçimini sağlıyordu ve 838 yılının Rebiü'l-Ahir ayının on ikinci gününde vefat etti. {Kaynak: Şadharat-dhahab s. 225}"
  id: "Shihab al-Din Ahmad ibn Abd al-Khaliq al-Asyuti; ia mendengar dari ayahnya dan dari Abd al-Rahim ibn al-Qari, dan ia diberi izin untuk mengajar. Ia biasa mencari nafkah dengan memberikan kesaksian di masjid Zahir al-Warraqin, dan ia meninggal pada tanggal 12 Rabi’ al-Akhir tahun 838. {cite:shadharat-dhahab p. 225}."
