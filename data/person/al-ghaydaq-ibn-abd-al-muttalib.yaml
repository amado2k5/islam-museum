summary:
  ar: "أحد بني عبد المطلب العشرة في عدّ الرحيق المختوم، وعم النبي؛ قيل إن حجلاً هو الغيداق نفسه."
  en: "One of the ten sons of Abd al-Muttalib in al-Raheeq al-Makhtum's count, and an uncle of the Prophet; some say Hajl and al-Ghaydaq are one man."
  fr: "L’un des dix fils d’Abd al-Muttalib selon le décompte d’al-Raheeq al-Makhtum, et oncle du Prophète ; certains disent que Hajl et al-Ghaydaq sont un même homme."
  es: "Uno de los diez hijos de Abd al-Muttalib según el recuento de al-Raheeq al-Makhtum, y tío del Profeta; algunos dicen que Hajl y al-Ghaydaq son la misma persona."
  ur: "الرحیق المختم کے شمار میں عبد المطلب کے دس بیٹوں میں سے ایک، اور پیغمبر کے چچا؛ بعض کہتے ہیں کہ حجل اور الغیدق ایک آدمی ہیں۔"
  tr: "Mühürlü Nektar'da adı geçen Abdülmuttalib'in on oğlundan biri ve Peygamber'in amcası olan Hajl'ın, Al-Ghaydaq ile aynı kişi olduğu söylenir."
  id: "Salah satu dari sepuluh putra Abdul Muttalib yang disebutkan dalam Kitab Nektar yang Disegel, dan paman Nabi; dikatakan bahwa Hajl sama dengan Al-Ghaydaq."
