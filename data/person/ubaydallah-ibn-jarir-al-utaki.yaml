summary:
  ar: "عبيد الله بن جرير بن جبلة بن أبي داود العتكي البصري، روى عن مسدد وغيره وعنه ابن أبي الدنيا وابن صاعد؛ وأنشد لنفسه: ما لا يكون فلا يكون بحيلة، وأبدًا وما هو كائن سيكون، سيكون ما هو كائن في وقته، وأخو الجهالة متعب محزون؛ توفي بواسط في رجب سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 129}."
  en: "Al-'Utaki of Basra, transmitting from Musaddad, heard by Ibn Abi'l-Dunya; his own verses on fate survive. He died at Wasit in Rajab 262 {cite:muntazam-ibn-al-jawzi p. 129}."
  es: "Al-'Utaki de Basora, quien transmitió desde Musaddad, fue escuchado por Ibn Abi'l-Dunya; sus versos sobre el destino se conservan. Murió en Wasit en Rajab 262 {cite:muntazam-ibn-al-jawzi p. 129}."
  fr: "Al-'Utaki de Bassora, transmettant depuis Musaddad, fut entendu par Ibn Abi'l-Dunya; ses propres vers sur le destin nous sont parvenus. Il mourut à Wasit en Rajab 262 (cf. Muntazam Ibn al-Jawzi, p. 129)."
  ur: "بصرہ کا العتقی، مسدد سے نقل کرتا ہے، جسے ابن ابی الدنیا نے سنا ہے۔ قسمت پر اس کی اپنی آیات زندہ رہتی ہیں۔ آپ کی وفات وصیت میں رجب 262 میں ہوئی۔ 129}۔"
  tr: "Ubeyd Allah ibn Jarir ibn Jiblah ibn Abi Dawud al-Ataki al-Basri, Musaddad ve diğerlerinden ve ondan İbn Ebi Dunya ve İbn Sa'id'den rivayet etti; kendi kendine şöyle dedi: 'Olmayan şey hile ile olmaz ve zamanında olan asla olmaz.' Cehaletin kardeşi Mutib Mahzun'du; 262 Hicri yılında Recep'teki Wasit'te öldü {atıf:Muntazam-ibn-al-jawzi, s. 129}."
  id: "Ubayd Allah ibn Jarir ibn Jiblah ibn Abi Dawud al-Ataki al-Basri, yang diceritakan dari Musaddad dan lainnya, dan dari beliau Ibn Abi Dunya dan Ibn Sa'id; ia melafalkan dalam hati: 'Apa yang tidak terjadi tidak akan terjadi dengan tipu daya, dan tidak akan pernah terjadi seperti yang terjadi pada waktunya.' Saudara dari ketidaktahuan adalah Mutib Mahzun; ia meninggal di Wasit di Rajab pada tahun 262 H {cite:Muntazam-ibn-al-jawzi, hlm. 129}."
