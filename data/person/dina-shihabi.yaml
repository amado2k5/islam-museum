summary:
  ar: "ممثلة سعودية تعمل في الولايات المتحدة، وُلدت في الرياض سنة 1989 ونشأت بين السعودية وبيروت ودبي؛ أول امرأة مولودة في الشرق الأوسط تُقبل في برنامجي التمثيل في جوليارد وجامعة نيويورك معًا، وحصلت على ماجستير الفنون الجميلة من جامعة نيويورك (2014)، واشتهرت بأدوار حنين في «جاك رايان» (2018) وديغ 301 في «ألتيرد كاربون» (2020) وميلودي بندراس في «أركايف 81» (2022)."
  en: "Saudi Arabian actress working in the United States, born in Riyadh in 1989 and raised in Saudi Arabia, Beirut and Dubai. She was the first Middle East-born woman accepted into both the Juilliard and NYU graduate acting programs, took her MFA from NYU in 2014, and is known for playing Hanin in Jack Ryan (2018), Dig 301 in Altered Carbon (2020) and Melody Pendras in Archive 81 (2022)."
  ur: "سعودی اداکارہ جو امریکا میں کام کرتی ہیں، 1989 میں ریاض میں پیدا ہوئیں اور سعودی عرب، بیروت اور دبئی میں پلی بڑھیں؛ وہ پہلی مشرق وسطیٰ میں پیدا ہونے والی خاتون ہیں جنھیں جولیارڈ اور نیویارک یونیورسٹی دونوں کے گریجویٹ ایکٹنگ پروگرامز میں داخلہ ملا، 2014 میں این وائی یو سے ایم ایف اے کیا، اور «جیک رائن» (2018) میں حنین، «آلٹرڈ کاربن» (2020) میں ڈگ 301 اور «آرکائیو 81» (2022) میں میلوڈی پینڈراس کے کرداروں کے لیے معروف ہیں۔"
