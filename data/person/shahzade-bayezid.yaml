  fr: "Fiche de conscription du prince Bayezid, fils de Soliman le Magnifique, qui se rebella, se réfugia chez les Safavides, fut livré et tué, mentionné d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est indiquée."
