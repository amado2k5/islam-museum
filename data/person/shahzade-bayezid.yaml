summary:
  ar: "بطاقة أولية لشاهزاده بايزيد، ابن سليمان القانوني الذي خرج على أبيه فلجأ إلى الصفويين وسُلّم فقُتل، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Şehzade Bayezid, son of Suleiman the Magnificent who rebelled, took refuge with the Safavids and was handed over and killed, named from an open reference description (Wikidata); his entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de reclutamiento para Şehzade Bayezid, hijo de Solimán el Magnífico, quien se rebeló, se refugió con los safávidas y fue entregado y asesinado, nombrado a partir de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de conscription du prince Bayezid, fils de Soliman le Magnifique, qui se rebella, se réfugia chez les Safavides, fut livré et tué, mentionné d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est indiquée."
  ur: "شہزادے بایزید کے لیے کارڈ کا مسودہ، سلیمان عظیم کے بیٹے جس نے بغاوت کی، صفویوں کے پاس پناہ لی اور اسے حوالے کر کے قتل کر دیا گیا، جس کا نام کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Süleyman Müteahhit'in oğlu Şahzadeh Bayezid'in babasına karşı isyan eden, Safevilere kaçtığı, teslim olduğu ve öldürüldüğü ön kart, açık bir referans tanımında (Wikidata) belirtilmiştir. Al-Sallabi'nin Osmanlı Devleti Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Shahzadeh Bayezid, putra Suleiman yang Agung, yang memberontak melawan ayahnya, melarikan diri ke Safawi, menyerah, dan dibunuh, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Negara Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
