names:
  - { value: "محمد بن أحمد بن محمد بن قدامة ابن مقدام الحنبلي القدوة الزاهد أخو الشيخ موفق الدين", kind: full }
summary:
  ar: "الشيخ أبو عمر محمد بن أحمد بن محمد بن قدامة المقدسي الجماعيلي ثم الدمشقي الصالحي ⁦(528–607هـ)⁩، الزاهد العابد شيخ أسرة المقادسة الحنابلة وأخو الموفق ابن قدامة. ولد بجمّاعيل من أرض نابلس، وهاجر به أبوه إلى دمشق سنة 551هـ لاستيلاء الفرنج على الأرض المقدسة، فنزلوا مسجد أبي صالح ثم الجبل، فعُرف موضعهم بالصالحية. سمع من أبيه ومن ابن هلال وغيرهما وبمصر من ابن بري، وتفقه وكتب بخطه كتباً كثيرة بغير أجرة منها «المغني» لأخيه، وبنى الدير والمدرسة بالجبل، وغزا مع صلاح الدين. يصفه ابن رجب ناقلاً عن الضياء وسبط ابن الجوزي بكثرة الصلاة والصيام والصدقة والهيبة وقضاء حوائج الناس، ويورد ما رُوي له من كرامات. توفي عشية الاثنين ثامن عشر ربيع الأول سنة 607هـ عن ثمانين سنة، وحُزر من حضر جنازته بعشرين ألفاً، ودفن بسفح قاسيون {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 52-61}{cite:shadharat-dhahab p. 35-38}."
  en: "Shaykh Abu Umar Muhammad ibn Ahmad ibn Muhammad ibn Qudama al-Maqdisi al-Jamma'ili, later of Damascus and al-Salihiyya (528–607 AH), the ascetic head of the Hanbali Maqdisi family and brother of al-Muwaffaq Ibn Qudama. Born at Jamma'il in the land of Nablus, he was taken by his father to Damascus in 551 AH when the Franks had taken the Holy Land; the family lodged in the mosque of Abu Salih and then on the mountain, and their quarter became known as al-Salihiyya. He heard hadith from his father, Ibn Hilal and others, and in Egypt from Ibn Barri; he studied law, copied many books by hand without fee, among them his brother's al-Mughni, built the convent and the school on the mountain, and campaigned with Saladin. Ibn Rajab, quoting al-Diya' and Sibt ibn al-Jawzi, describes his constant prayer, fasting and alms, the awe he inspired and his care for others' needs, and reports the wonders told of him. He died on the eve of Monday 18 Rabi' I 607 at eighty; the crowd at his funeral was put at twenty thousand, and he was buried on the slope of Qasyun."
  fr: "Le cheikh Abu Umar Muhammad ibn Ahmad ibn Muhammad ibn Qudama al-Maqdisi al-Jamma'ili, puis de Damas et d'al-Salihiyya (528–607 H), chef ascète de la famille hanbalite des Maqdisi et frère d'al-Muwaffaq Ibn Qudama. Né à Jamma'il au pays de Naplouse, il fut emmené par son père à Damas en 551 H après la prise de la Terre sainte par les Francs ; la famille logea à la mosquée d'Abu Salih puis sur la montagne, et son quartier prit le nom d'al-Salihiyya. Il entendit le hadith de son père, d'Ibn Hilal et d'autres, et en Égypte d'Ibn Barri ; il étudia le droit, copia gratuitement de nombreux livres, dont al-Mughni de son frère, bâtit le couvent et l'école sur la montagne et participa aux campagnes de Saladin. Ibn Rajab, citant al-Diya' et Sibt ibn al-Jawzi, décrit sa prière, son jeûne et ses aumônes continuels, le respect qu'il inspirait et son souci d'autrui ; il rapporte les prodiges racontés de lui. Il mourut à la veille du lundi 18 rabi' I 607, à quatre-vingts ans ; la foule des funérailles fut estimée à vingt mille personnes, et il fut enterré sur le flanc du Qasyun."
  es: "Shaykh Abu Umar Muhammad ibn Ahmad ibn Muhammad ibn Qudama al-Maqdisi al-Jamma'ili, posteriormente de Damasco y al-Salihiyya (528–607 AH), el asceta líder de la familia Hanbali Maqdisi y hermano de al-Muwaffaq Ibn Qudama. Nacido en Jamma'il, en la región de Nablus, fue llevado por su padre a Damasco en el año 551 AH, cuando los francos tomaron Tierra Santa. La familia se alojó en la mezquita de Abu Salih y luego en la montaña, y su barrio pasó a ser conocido como al-Salihiyya. Escuchaba hadices de su padre, Ibn Hilal y otros, y en Egipto de Ibn Barri. Estudió derecho, copió muchos libros a mano gratuitamente, entre ellos el al-Mughni de su hermano, construyó el convento y la escuela en la montaña, y luchó junto a Saladino. Ibn Rajab, citando a al-Diya' y Sibt ibn al-Jawzi, describe su constante oración, ayuno y limosna, el respeto que inspiraba y su preocupación por las necesidades ajenas, y relata los milagros que se contaban sobre él. Murió la víspera del lunes 18 de Rabi' I de 607 a los ochenta años; la multitud en su funeral fue de veinte mil personas, y fue enterrado en la ladera de Qasyun."
  ur: "شیخ ابو عمر محمد بن احمد بن محمد بن قدامہ المقدسی الجماعیلی، بعد میں دمشق اور الصالحیہ ⁦(528-607 ہجری)⁩، حنبلی مقدسی خاندان کے بزرگ سربراہ اور الموفق ابن قدامہ کے بھائی۔ نابلس کی سرزمین میں جماعیل میں پیدا ہوئے، انہیں ان کے والد 551 ہجری میں دمشق لے گئے جب فرینکوں نے مقدس سرزمین پر قبضہ کر لیا تھا۔ یہ خاندان ابو صالح کی مسجد میں اور پھر پہاڑ پر ٹھہرا، اور ان کا کوارٹر الصالحیہ کے نام سے مشہور ہوا۔ انہوں نے اپنے والد ابن ہلال اور دوسرے لوگوں سے اور مصر میں ابن بری سے حدیث سنی۔ اس نے قانون کی تعلیم حاصل کی، بہت سی کتابیں بغیر فیس کے ہاتھ سے نقل کیں، ان میں سے اس کے بھائی کا المغنی، پہاڑ پر کانونٹ اور اسکول بنایا، اور صلاح الدین کے ساتھ مہم چلائی۔ ابن رجب، الدیاء اور سبط ابن الجوزی کا حوالہ دیتے ہوئے، ان کی مسلسل نماز، روزے اور زکوٰۃ، اس کے خوف اور دوسروں کی ضرورتوں کا خیال رکھنے کے بارے میں بیان کرتا ہے، اور اس کے بارے میں بتائے گئے عجائبات کو بیان کرتا ہے۔ آپ کی وفات پیر 18 ربیع الثانی 607 کو 80 سال کی عمر میں ہوئی۔ ان کے جنازے میں بیس ہزار کا ہجوم تھا اور انہیں قصیون کی ڈھلوان پر دفن کیا گیا۔"
  tr: "Şeyh Ebu Ömer Muhammed ibn Ahmed ibn Muhammed ibn Kudame el-Makdisi el-Cemaîli, daha sonra el-Dimaşki el-Salihi (528-607 Hicri), zühd sahibi ve dindar bir ibadet eden, Hanbeli mezhebinin el-Makdisi ailesinin başı ve el-Muvaffak ibn Kudame'nin kardeşidir. Nablus bölgesindeki Cemmail'de doğdu ve babası, Kutsal Toprakların Franklar tarafından fethi nedeniyle 551 Hicri yılında onunla birlikte Şam'a hicret etti. Ebu Salih Camii'ne ve daha sonra dağa yerleştiler ve yerleşim yerleri el-Salihiyye olarak bilindi. Babası İbn Hilal ve diğerlerinden ve Mısır'da İbn Barri'den eğitim aldı. Hukukçu oldu ve kardeşi için \"el-Muğni\" de dahil olmak üzere birçok kitabı ücretsiz olarak kendi eliyle yazdı. Dağda bir manastır ve okul inşa etti ve Selahaddin'in yanında savaştı. İbn Receb, el-Diya' ve Sibt İbn el-Cevzi'den alıntı yaparak onu namaza, oruca, sadaka vermeye düşkün, hayranlık uyandıran ve başkalarının ihtiyaçlarını karşılayan biri olarak tanımlar. Ayrıca ona atfedilen mucizeleri de anlatır. Hicri 607 yılının Rebiü'l-Evvel ayının 18. Pazartesi arifesinde, seksen yaşında vefat etti. Cenazesine yirmi bin kişinin katıldığı tahmin edilir ve Kasiye Dağı'nın eteğine defnedilmiştir."
  id: "Syekh Abu Umar Muhammad ibn Ahmad ibn Muhammad ibn Qudamah al-Maqdisi al-Jama’ili, kemudian al-Dimashqi al-Salihi (528–607 H), seorang pertapa dan penyembah yang taat, kepala keluarga al-Maqdisi dari mazhab Hanbali, dan saudara dari al-Muwaffaq ibn Qudamah. Beliau lahir di Jamma’il di wilayah Nablus, dan ayahnya berhijrah bersamanya ke Damaskus pada tahun 551 H karena penaklukan Tanah Suci oleh bangsa Frank. Mereka menetap di Masjid Abu Salih dan kemudian di gunung, dan pemukiman mereka dikenal sebagai al-Salihiyyah. Beliau belajar di bawah bimbingan ayahnya, Ibn Hilal, dan lainnya, dan di Mesir di bawah bimbingan Ibn Barri. Beliau menjadi seorang ahli hukum dan menulis banyak buku dengan tangannya sendiri tanpa bayaran, termasuk “al-Mughni” untuk saudaranya. Beliau membangun sebuah biara dan sekolah di gunung dan berperang bersama Saladin. Ibn Rajab, mengutip al-Diya’ dan Sibt Ibn al-Jawzi, menggambarkannya sebagai orang yang tekun dalam shalat, puasa, sedekah, dan mengagumkan, serta sebagai orang yang memenuhi kebutuhan orang lain. Ia juga menceritakan mukjizat-mukjizat yang dinisbahkan kepadanya. Ia wafat pada malam Senin, tanggal 18 Rabi’ al-Awwal, 607 H, pada usia delapan puluh tahun. Diperkirakan dua puluh ribu orang menghadiri pemakamannya, dan ia dimakamkan di kaki Gunung Qasioun."
