names:
  - { value: "محمد بن أحمد بن محمد بن قدامة ابن مقدام الحنبلي القدوة الزاهد أخو الشيخ موفق الدين", kind: full }
summary:
  ar: "الشيخ أبو عمر المقدسي الزاهد محمد بن أحمد بن قدامة الحنبلي القدوة أخو الموفق؛ ولد بجماعيل سنة ثمان وعشرين وخمسمائة وهاجر به والده وأخوه إلى دمشق لاستيلاء الفرنج على الأرض المقدسة فنزلوا مسجد أبي صالح ثم الجبل — قال أبو عمر: قال الناس الصالحية الصالحية ينسبونا إلى مسجد أبي صالح لا أننا صالحون — وحفظ القرآن والفقه والحديث وكتب مصاحف كثيرة لأهله وكتب المغني لأخيه والإبانة لابن قوطة والخرقي للناس بغير أجرة، وكان إماماً زاهداً عابداً خطب بجامع الجبل حتى مات، صلّى في اليوم والليلة اثنتين وسبعين ركعة نافلة وكان يحمل الشيح من الجبل إلى بيوت الأرامل واليتامى والدراهم والدقيق في الليل ولا يعرفونه، واستسقى بالناس فجاء المطر حينئذ وجرت الأودية؛ توفي عشية الاثنين ثامن عشر ربيع الأول سنة سبع وستمائة عن ثمانين سنة وآخر كلامه (إن الله اصطفى لكم الدين فلا تموتن إلا وأنتم مسلمون)، وأقبلت غمامة فأظلت الناس إلى قبره ودوّت كدوي النحل، ولولا إحاطة الدولة به بالسيوف لما وصل من كفنه إلى قبره شيء، ورُئي في المنام النبي يقول من زار أبا عمر ليلة الجمعة فكأنما زار الكعبة؛ ودفن بسفح قاسيون إلى جانب والده {cite:shadharat-dhahab p. 35-38}."
  en: "Shaykh Abu Umar al-Maqdisi Muhammad b. Ahmad b. Qudama, the Hanbali exemplar, brother of al-Muwaffaq; b. at Jamma'il 528, emigrated with his father and brother to Damascus when the Franks seized the Holy Land — they lodged at Abu Salih's mosque then the Mount, whence 'the Salihiyya, the Salihiyya: named for Abu Salih's mosque, not because we are salih'. He wrote out Qur'ans for his family, his brother's al-Mughni and Ibn Qutta's al-Ibana and the Khiraqi for the people without fee, preached at the Mount mosque till death, prayed seventy-two supererogatory rak'as a day, carried firewood by day and dirhams and flour by night to widows' and orphans' houses unknown to them, and prayed for rain till it came. He died the eve of Monday 18 Rabi' I 607 at eighty, his last words 'God has chosen the religion for you — die not save as Muslims'; a cloud shaded the crowd to his grave humming like bees, and but for the soldiery ringing him with swords not a shred of his shroud would have reached the grave — in a dream the Prophet said 'whoever visits Abu Umar on Friday night is as if he visited the Ka'ba'; buried at Qasyun's foot beside his father {cite:shadharat-dhahab p. 35-38}."
