names:
  - { value: "محمد بن أحمد بن محمد بن قدامة ابن مقدام الحنبلي القدوة الزاهد أخو الشيخ موفق الدين", kind: full }
summary:
  ar: "الشيخ أبو عمر محمد بن أحمد بن محمد بن قدامة المقدسي الجماعيلي ثم الدمشقي الصالحي (528–607هـ)، الزاهد العابد شيخ أسرة المقادسة الحنابلة وأخو الموفق ابن قدامة. ولد بجمّاعيل من أرض نابلس، وهاجر به أبوه إلى دمشق سنة 551هـ لاستيلاء الفرنج على الأرض المقدسة، فنزلوا مسجد أبي صالح ثم الجبل، فعُرف موضعهم بالصالحية. سمع من أبيه ومن ابن هلال وغيرهما وبمصر من ابن بري، وتفقه وكتب بخطه كتباً كثيرة بغير أجرة منها «المغني» لأخيه، وبنى الدير والمدرسة بالجبل، وغزا مع صلاح الدين. يصفه ابن رجب ناقلاً عن الضياء وسبط ابن الجوزي بكثرة الصلاة والصيام والصدقة والهيبة وقضاء حوائج الناس، ويورد ما رُوي له من كرامات. توفي عشية الاثنين ثامن عشر ربيع الأول سنة 607هـ عن ثمانين سنة، وحُزر من حضر جنازته بعشرين ألفاً، ودفن بسفح قاسيون {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 52-61}{cite:shadharat-dhahab p. 35-38}."
  en: "Shaykh Abu Umar Muhammad ibn Ahmad ibn Muhammad ibn Qudama al-Maqdisi al-Jamma'ili, later of Damascus and al-Salihiyya (528–607 AH), the ascetic head of the Hanbali Maqdisi family and brother of al-Muwaffaq Ibn Qudama. Born at Jamma'il in the land of Nablus, he was taken by his father to Damascus in 551 AH when the Franks had taken the Holy Land; the family lodged in the mosque of Abu Salih and then on the mountain, and their quarter became known as al-Salihiyya. He heard hadith from his father, Ibn Hilal and others, and in Egypt from Ibn Barri; he studied law, copied many books by hand without fee, among them his brother's al-Mughni, built the convent and the school on the mountain, and campaigned with Saladin. Ibn Rajab, quoting al-Diya' and Sibt ibn al-Jawzi, describes his constant prayer, fasting and alms, the awe he inspired and his care for others' needs, and reports the wonders told of him. He died on the eve of Monday 18 Rabi' I 607 at eighty; the crowd at his funeral was put at twenty thousand, and he was buried on the slope of Qasyun."
