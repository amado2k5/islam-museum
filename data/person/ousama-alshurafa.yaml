  ar: "مؤلف وخطيب ومرشد روحي فلسطيني-أمريكي مقيم في كندا، حاصل على بكالوريوس في الهندسة الطبية الحيوية والكهربائية وماجستير من هارفارد، ويحمل إجازة في القراءة برواية حفص. أسس «مسلم هب كلوب» وألف «دليل الآخرة» ⁦(The Afterlife Manual)⁩، وله سلسلات منها «شيفرة الدنيا»، ويتابعه الملايين على منصات التواصل."
