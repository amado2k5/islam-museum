summary:
  ar: "مؤلف وخطيب ومرشد روحي فلسطيني-أمريكي مقيم في كندا، حاصل على بكالوريوس في الهندسة الطبية الحيوية والكهربائية وماجستير من هارفارد، ويحمل إجازة في القراءة برواية حفص. أسس «مسلم هب كلوب» وألف «دليل الآخرة» ⁦(The Afterlife Manual)⁩، وله سلسلات منها «شيفرة الدنيا»، ويتابعه الملايين على منصات التواصل."
  en: "Palestinian-American author, speaker and spiritual mentor based in Canada; he holds a degree in biomedical and electrical engineering, a master's from Harvard University and an ijazah in the Hafs Qur'anic recitation. He founded the Muslim Hub Club platform, authored The Afterlife Manual, and his series include Dunya Decoded, with a combined following in the millions on social media."
  ur: "کینیڈا مقیم فلسطینی-امریکی مصنف، مبلغ اور روحانی مرشد؛ انجینئرنگ میں ڈگری، ہارورڈ سے ماسٹرز اور قراءت حفص میں اجازت رکھتے ہیں۔ انہوں نے مسلم ہب کلب پلیٹ فارم قائم کیا، کتاب The Afterlife Manual لکھی اور سیریزوں میں Dunya Decoded شامل ہے؛ سوشل میڈیا پر لاکھوں پیروکار ہیں۔"
  es: "Autor, orador y mentor espiritual palestino-estadounidense radicado en Canadá. Posee una licenciatura en ingeniería biomédica y eléctrica, una maestría de la Universidad de Harvard y una ijazah en la recitación coránica Hafs. Fundó la plataforma Muslim Hub Club, es autor de El manual de la vida después de la muerte y su serie Dunya Decoded cuenta con millones de seguidores en las redes sociales."
  fr: "Auteur, conférencier et mentor spirituel palestino-américain installé au Canada, il est titulaire d'un diplôme en génie biomédical et électrique, d'une maîtrise de l'Université Harvard et d'une ijazah (autorisation d'enseigner la récitation coranique du Hafs). Il a fondé la plateforme Muslim Hub Club, est l'auteur de « The Afterlife Manual » (Manuel de l'au-delà) et de la série « Dunya Decoded », qui compte des millions d'abonnés sur les réseaux sociaux."
