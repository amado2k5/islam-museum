summary:
  ar: قرشي عدوي لقبه النحّام لقول النبي «دخلت الجنة فسمعت نحمة من نعيم»؛ قال البخاري إن له صحبة، وقال مصعب الزبيري إن إسلامه كان قبل عمر ولكنه لم يهاجر إلا قبيل فتح مكة لأنه كان ينفق على أرامل بني عدي وأيتامهم.
  en: A Qurashi of Banu Adi nicknamed al-Nahham because the Prophet said he entered Paradise and heard a nahma (cough) from Nu'aym; al-Bukhari says he had companionship, and Mus'ab al-Zubayri says his conversion was before Umar's but he did not
    emigrate until shortly before the conquest of Mecca because he supported the widows and orphans of Banu Adi.
