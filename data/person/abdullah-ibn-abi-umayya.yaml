  en: "A Qurashi nobleman of Banu Makhzum, brother of Umm Salama and maternal cousin of the Prophet; after opposing the early call, he accepted Islam on the road to the conquest of Mecca and was martyred by an arrow during the siege of Ta'if."
  ar: "صحابي من أشراف بني مخزوم، أخو أم سلمة أم المؤمنين وابن عمة النبي عاتكة بنت عبد المطلب؛ عادى الدعوة بمكة ثم أسلم في طريق فتح مكة بنيق العقاب، واستُشهد بسهم في حصار الطائف."
