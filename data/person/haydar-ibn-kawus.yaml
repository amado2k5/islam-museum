summary:
  ar: "حيدر بن كاوس المعروف بالأفشين؛ كان قهرمان أبيه يدمه ويشنعه فوثب عليه فقتله على باب مدينتهم وهرب إلى هاشم بن محود الختلي فلما بلغه ما فعل أبوه أظهر الإسلام وشخص إلى مدينة السلام فوصف للمأمون سهولة أمر أشروسنة وطريقاً مختصرة إليها فملكه المأمون بعد أبيه."
  en: "Haydar ibn Kawus, the famous al-Afshin; demeaned by his father's favored qahrman he killed him at the city gate, fled to al-Khattl, then showed Islam at Baghdad, taught al-Ma'mun Ushrusana's short road, and was made king after his father."
