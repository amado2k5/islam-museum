class: person
label: { ar: "حيدر بن كاوس الأفشين", en: "Haydar ibn Kawus (al-Afshin)", es: "Haydar ibn Kawus (al-Afshin)", fr: "Haydar ibn Kawus (al-Afshin)", ur: "حیدر بن کاوث ⁦(الافشین)⁩" }
summary:
  ar: "حيدر بن كاوس المعروف بالأفشين؛ كان قهرمان أبيه يدمه ويشنعه فوثب عليه فقتله على باب مدينتهم وهرب إلى هاشم بن محود الختلي فلما بلغه ما فعل أبوه أظهر الإسلام وشخص إلى مدينة السلام فوصف للمأمون سهولة أمر أشروسنة وطريقاً مختصرة إليها فملكه المأمون بعد أبيه."
  en: "Haydar ibn Kawus, the famous al-Afshin; demeaned by his father's favored qahrman he killed him at the city gate, fled to al-Khattl, then showed Islam at Baghdad, taught al-Ma'mun Ushrusana's short road, and was made king after his father."
  es: "Haydar ibn Kawus, el famoso al-Afshin, fue humillado por el qahrman favorito de su padre, a quien mató en la puerta de la ciudad, huyó a al-Khattl, luego difundió el Islam en Bagdad, enseñó el camino corto de al-Ma'mun Ushrusana y fue proclamado rey tras la muerte de su padre."
  fr: "Haydar ibn Kawus, le célèbre al-Afshin; humilié par le calife favori de son père, il le tua à la porte de la ville, s'enfuit à al-Khattl, puis annonça l'islam à Bagdad, enseigna à al-Ma'mun la voie courte d'Ushrusana et fut fait roi après son père."
  ur: "حیدر بن کاوث، مشہور الافشین؛ اپنے والد کے پسندیدہ قاہرمان کی وجہ سے اس نے اسے شہر کے دروازے پر قتل کر دیا، خطل کی طرف بھاگا، پھر بغداد میں اسلام دکھایا، المامون عشروسانہ کی مختصر سڑک کی تعلیم دی، اور اپنے والد کے بعد بادشاہ بنا۔"
  tr: "Haydar bin Kawus, nam-ı diğer El-Afşin, babası şehit olan bir kahramandı ve onu kötüledi, bu yüzden üzerine atladı ve şehir kapısında onu öldürdü. Haşim bin Mahmud el-Hatli'ye kaçtı. Babası yaptıklarını duyunca İslam'ı ilan etti ve barış şehrine gitti. El-Me'mun'a Aşrusana ile işlerin kolaylığını ve kestirme yolu anlattı, böylece el-Me'mun babasından sonra onu yönetti."
  id: "Haidar ibn Kawus, yang dikenal sebagai Al-Afshin, adalah seorang pahlawan yang ayahnya adalah syahid dan memfitnahnya, sehingga ia melompat ke arahnya dan membunuhnya di gerbang kota mereka. Ia melarikan diri kepada Hashim ibn Mahmud al-Khatli. Ketika mendengar apa yang dilakukan ayahnya, ia menyatakan Islam dan pergi ke kota damai. Ia menjelaskan kepada al-Ma'mun tentang kemudahan hubungan dengan Ashrusana dan jalan pintasnya, sehingga al-Ma'mun memerintah setelah ayahnya."
