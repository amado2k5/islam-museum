summary:
  ar: "آخر ملوك بني وطاس؛ لقبه الصلابي «الباشا العثماني بوحسون». وقف معه صالح رايس والقوات العثمانية ضد محمد الشيخ السعدي فدخل فاس في ٣ صفر ٩٦٤هـ/٨ يناير ١٥٥٤م، وحاول صالح استبداله بالشريف الإدريسي مولاي بوبكر باقتراح المرابطين الصوفيين لكن ثورة الأهالي أعادته بشرط الخطبة باسم السلطان العثماني وإقامة حامية في مقر بلاطة. ويذكر الصلابي أن السلطان سليمان كان قد زوده بأربعة آلاف جندي {cite:dawlat-uthmaniyya-salabi p. 238-244}."
  en: "Last of the Wattasid kings, whom al-Salabi styles 'the Ottoman pasha Bu Hasun'. Salih Reis and Ottoman forces stood with him against Muhammad al-Shaykh; he entered Fez 3 Safar 964/8 January 1554. Salih tried replacing him with the Idrisi sharif Mawlay Bu Bakr at the Sufi murabitun's suggestion, but the people's rising restored him on terms: the khutba in the Ottoman sultan's name and a garrison at Balata. Al-Salabi notes Süleyman had supplied him four thousand soldiers {cite:dawlat-uthmaniyya-salabi p. 238-244}."
  fr: "Dernier des rois wattassides, qu'al-Salabi appelle « le pacha ottoman Bu Hasun ». Salih Reis et les forces ottomanes se tinrent à ses côtés contre Muhammad al-Shaykh ; il entra à Fès le 3 Safar 964/8 janvier 1554. Salih tenta de le remplacer par le chérif idrisside Mawlay Bu Bakr sur la suggestion des murabitun soufis, mais le soulèvement du peuple le rétablit à des conditions : la khutba au nom du sultan ottoman et une garnison à Balata. Al-Salabi note que Soliman lui avait fourni quatre mille soldats {cite:dawlat-uthmaniyya-salabi p. 238-244}."
  es: "Último de los reyes Wattasíes, a quien al-Salabi denomina «el pachá otomano Bu Hasun». Salih Reis y las fuerzas otomanas lo apoyaron contra Muhammad al-Shaykh; entró en Fez el 3 de Safar de 964/8 de enero de 1554. Salih intentó reemplazarlo con el sharif Idrisi Mawlay Bu Bakr por sugerencia del murabitun sufí, pero el levantamiento popular lo restituyó bajo ciertas condiciones: la jutba en nombre del sultán otomano y una guarnición en Balata. Al-Salabi señala que Süleyman le había proporcionado cuatro mil soldados {cite:dawlat-uthmaniyya-salabi p. 238-244}."
  ur: "وطاسد بادشاہوں میں سے آخری، جنہیں السلابی نے 'عثمانی پاشا بو حسن' کا انداز دیا ہے۔ صالح رئیس اور عثمانی افواج محمد الشیخ کے خلاف اس کے ساتھ کھڑی تھیں۔ وہ فیز 3 صفر 964/8 جنوری 1554 میں داخل ہوا۔ صالح نے صوفی مربیطون کے مشورے پر اس کی جگہ ادریسی شریف مولوی بو بکر کو لانے کی کوشش کی، لیکن لوگوں کے بڑھنے نے اسے ان شرائط پر بحال کر دیا: عثمانی سلطان کے نام کا خطبہ اور بلاتاسن کے مقام پر۔ الصلابی نوٹ کرتا ہے کہ سلیمان نے اسے چار ہزار سپاہی فراہم کیے تھے۔ 238-244}۔"
