summary:
  ar: "سيار النباجي، الباكي النائح المناجي، بكى على الله ستين سنة. روى عنه أحمد بن مسروق أنه فاته ورده ليلة، فرأى في منامه الجنة، ونهرًا يجري على الدر والجوهر، وجواري على الساحل يسبحن، وقلن إنهن لحن من خلق الرحمن."
  en: "Sayyar al-Nabbaji, who wept and cried out and communed with God, having wept for God for sixty years; Ahmad ibn Masruq relates that Sayyar missed his nightly litany once, and saw in a dream a river running over pearls and jewels with musk on its banks, and maidens on the shore glorifying God; they said they were created by the Merciful, and that they were for a people who stand at night on their feet."
  ur: "سیار نبابی، روتے، فریاد کرتے اور اللہ سے سرگوشی کرتے تھے، ساٹھ سال تک اللہ کے لیے روتے رہے۔ احمد بن مسروق نے نقل کیا کہ ایک رات ان کا وظیفہ چھوٹ گیا، تو خواب میں انہوں نے جنت دیکھی: موتیوں اور جواہرات پر بہتی نہر، کنارے کنارے مشک، اور ساحل پر کنیزیں تسبیح کرتی ہوئی، جو کہتی تھیں کہ وہ رحمٰن کی مخلوق ہیں، اور ان لوگوں کے لیے ہیں جو رات کو اپنے قدموں پر کھڑے رہتے ہیں۔"
