summary:
  ar: "سيار النباجي، الباكي النائح المناجي، بكى على الله ستين سنة. روى عنه أحمد بن مسروق أنه فاته ورده ليلة، فرأى في منامه الجنة، ونهرًا يجري على الدر والجوهر، وجواري على الساحل يسبحن، وقلن إنهن لحن من خلق الرحمن."
  en: "Sayyar al-Nabbaji, who wept and cried out and communed with God, having wept for God for sixty years; Ahmad ibn Masruq relates that Sayyar missed his nightly litany once, and saw in a dream a river running over pearls and jewels with musk on its banks, and maidens on the shore glorifying God; they said they were created by the Merciful, and that they were for a people who stand at night on their feet."
  ur: "سیار نبابی، روتے، فریاد کرتے اور اللہ سے سرگوشی کرتے تھے، ساٹھ سال تک اللہ کے لیے روتے رہے۔ احمد بن مسروق نے نقل کیا کہ ایک رات ان کا وظیفہ چھوٹ گیا، تو خواب میں انہوں نے جنت دیکھی: موتیوں اور جواہرات پر بہتی نہر، کنارے کنارے مشک، اور ساحل پر کنیزیں تسبیح کرتی ہوئی، جو کہتی تھیں کہ وہ رحمٰن کی مخلوق ہیں، اور ان لوگوں کے لیے ہیں جو رات کو اپنے قدموں پر کھڑے رہتے ہیں۔"
  es: "Sayyar al-Nabbaji, quien lloró, clamó y se comunicó con Dios, habiendo llorado por Dios durante sesenta años; Ahmad ibn Masruq relata que Sayyar omitió su letanía nocturna una vez, y vio en un sueño un río que corría sobre perlas y joyas con almizcle en sus orillas, y doncellas en la orilla glorificando a Dios; dijeron que fueron creadas por el Misericordioso, y que eran para un pueblo que permanece de pie por la noche."
  fr: "Sayyar al-Nabbaji, qui pleurait, implorait et communiait avec Dieu, après avoir pleuré pour Dieu pendant soixante ans; Ahmad ibn Masruq raconte que Sayyar manqua une fois sa litanie nocturne et vit en rêve une rivière coulant sur des perles et des joyaux, avec du musc sur ses rives, et des jeunes filles sur le rivage glorifiant Dieu; elles dirent qu'elles avaient été créées par le Miséricordieux et qu'elles étaient destinées à un peuple qui se tient debout la nuit."
  tr: "Sayyar al-Nabaci, ağlayan ve ağıtlayan dua, altmış yıl boyunca ağladı. Ahmed ibn Masruq ondan bir gece dönüşünü kaçırdığını ve rüyasında cennet, inciler ve mücevherler üzerinden akan bir nehir ve kıyıda kendisini öven cariyeler gördüğünü anlattı; onların En Merhametli tarafından yaratılanlar olduklarını söylediler."
  id: "Sayyar al-Nabaji, permohonan yang menangis dan meratap, menangis selama enam puluh tahun. Ahmad ibn Masruq menceritakan darinya bahwa suatu malam ia melewatkan kepulangannya, dan dalam mimpinya ia melihat surga, sungai mengalir di atas mutiara dan permata, serta selir di tepi pantai yang memuji-Nya, dan mereka mengatakan bahwa merekalah yang diciptakan oleh Yang Maha Penyayang."
