summary:
  ar: "كاتب وباحث مصري وُلد في سوهاج سنة 1958 ونشأ في الإسكندرية. متخصص في التراث العربي المخطوط والتصوف وتاريخ الطب العربي، وعمل مديرًا لمركز المخطوطات بمكتبة الإسكندرية؛ نال الدكتوراه سنة 1989 عن دراسة وتحقيق لأعمال عبد القادر الجيلاني. من رواياته «ظل الأفعى» و«عزازيل» التي فازت بالجائزة العالمية للرواية العربية سنة 2009، و«النبطي» و«فردقان»."
  en: "Egyptian writer and scholar, born in Sohag in 1958 and raised in Alexandria. He specialises in the Arabic manuscript heritage, Sufism and the history of Arabic medicine, and directed the Manuscript Center at the Bibliotheca Alexandrina; his 1989 doctorate was a study and edition of the works of Abd al-Qadir al-Jilani. His novels include Shadow of the Serpent, Azazeel, which won the International Prize for Arabic Fiction in 2009, The Nabatean and Fardeqan."
  ur: "مصری مصنف اور محقق، 1958 میں سوہاج میں پیدا ہوئے اور اسکندریہ میں پرورش پائی۔ عربی مخطوطاتی ورثے، تصوف اور عرب طب کی تاریخ کے ماہر ہیں اور کتب خانہ اسکندریہ کے مرکز مخطوطات کے مدیر رہے؛ ان کی ڈاکٹریٹ (1989) عبد القادر جیلانی کے آثار کی تحقیق پر تھی۔ ان کے ناولوں میں «ظل الأفعى» اور «عزازیل» شامل ہیں، جس نے 2009 میں عربی فکشن کا عالمی انعام جیتا۔"
