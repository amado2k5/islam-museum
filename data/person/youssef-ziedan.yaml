summary:
  ar: "كاتب وباحث مصري وُلد في سوهاج سنة 1958 ونشأ في الإسكندرية. متخصص في التراث العربي المخطوط والتصوف وتاريخ الطب العربي، وعمل مديرًا لمركز المخطوطات بمكتبة الإسكندرية؛ نال الدكتوراه سنة 1989 عن دراسة وتحقيق لأعمال عبد القادر الجيلاني. من رواياته «ظل الأفعى» و«عزازيل» التي فازت بالجائزة العالمية للرواية العربية سنة 2009، و«النبطي» و«فردقان»."
  en: "Egyptian writer and scholar, born in Sohag in 1958 and raised in Alexandria. He specialises in the Arabic manuscript heritage, Sufism and the history of Arabic medicine, and directed the Manuscript Center at the Bibliotheca Alexandrina; his 1989 doctorate was a study and edition of the works of Abd al-Qadir al-Jilani. His novels include Shadow of the Serpent, Azazeel, which won the International Prize for Arabic Fiction in 2009, The Nabatean and Fardeqan."
  ur: "مصری مصنف اور محقق، 1958 میں سوہاج میں پیدا ہوئے اور اسکندریہ میں پرورش پائی۔ عربی مخطوطاتی ورثے، تصوف اور عرب طب کی تاریخ کے ماہر ہیں اور کتب خانہ اسکندریہ کے مرکز مخطوطات کے مدیر رہے؛ ان کی ڈاکٹریٹ (1989) عبد القادر جیلانی کے آثار کی تحقیق پر تھی۔ ان کے ناولوں میں «ظل الأفعى» اور «عزازیل» شامل ہیں، جس نے 2009 میں عربی فکشن کا عالمی انعام جیتا۔"
  es: "Escritor y erudito egipcio, nacido en Sohag en 1958 y criado en Alejandría. Se especializa en el patrimonio manuscrito árabe, el sufismo y la historia de la medicina árabe, y dirigió el Centro de Manuscritos de la Biblioteca de Alejandría. Su doctorado de 1989 fue un estudio y edición de las obras de Abd al-Qadir al-Jilani. Entre sus novelas destacan La sombra de la serpiente, Azazeel (ganadora del Premio Internacional de Ficción Árabe en 2009), El nabateo y Fardeqan."
  fr: "Écrivain et érudit égyptien, né à Sohag en 1958 et ayant grandi à Alexandrie, il est spécialiste du patrimoine manuscrit arabe, du soufisme et de l'histoire de la médecine arabe. Il a dirigé le Centre des manuscrits de la Bibliothèque d'Alexandrie. Sa thèse de doctorat, soutenue en 1989, portait sur l'étude et l'édition des œuvres d'Abd al-Qadir al-Jilani. Parmi ses romans figurent L'Ombre du serpent, Azazeel (lauréat du Prix international de la fiction arabe en 2009), Le Nabatéen et Fardeqan."
  tr: "1958'de Sohag'da doğmuş ve İskenderiye'de büyümüş Mısırlı bir yazar ve araştırmacı. Arap el yazması mirası, Sufizm ve Arap tıbbı tarihi üzerine uzmanlaşmış ve Bibliotheca Alexandrina'da El Yazmaları Merkezi direktörü olarak çalışmıştır; 1989'da Abdul Kadir Al-Jilani'nin eserlerinin incelenmesi ve doğrulanması üzerine doktora derecesini almıştır. Romanları arasında \"Yılanın Gölgesi\" ve 2009'da Uluslararası Arap Kurgu Ödülü'nü kazanan \"Azazel\" ile \"Nabati\" ve \"Fardaqan\" yer almaktadır."
  id: "Seorang penulis dan peneliti Mesir yang lahir di Sohag pada tahun 1958 dan dibesarkan di Alexandria. Ia mengkhususkan diri dalam warisan manuskrip Arab, Sufisme, dan sejarah kedokteran Arab, serta pernah menjabat sebagai direktur Manuscripts Center di Bibliotheca Alexandrina; meraih gelar doktor pada tahun 1989 untuk studi dan verifikasi karya Abdul Qadir Al-Jilani. Novel-novelnya meliputi \"The Shadow of the Serpent\" dan \"Azazel,\" yang memenangkan International Prize for Arabic Fiction pada tahun 2009, serta \"The Nabati\" dan \"Fardaqan.\""
