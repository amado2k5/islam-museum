summary:
  ar: "خطاط سوري، وُلد سنة 1934 في حلب، يُعدّ أبرز خطاطي المصحف في العصر الحديث. كتب بخط النسخ العثماني المصحف الذي تطبعه مجمع الملك فهد لطباعة المصحف الشريف في المدينة المنورة منذ الثمانينيات، والذي تداولته مئات ملايين النسخ؛ كتب أكثر من عشر نسخ من المصحف بيده."
  en: "Syrian calligrapher, born in Aleppo in 1934, regarded as the foremost mushaf calligrapher of the modern age. In Ottoman naskh he wrote the mushaf printed by the King Fahd Glorious Qur'an Printing Complex in Madinah since the 1980s, circulated in hundreds of millions of copies; he wrote more than ten copies of the Qur'an by hand."
  ur: "شامی خطاط، 1934 میں حلب میں پیدا ہوئے، عصرِ حاضر کے مقدم مصحف خطاط مانے جاتے ہیں۔ انھوں نے عثمانی نسخ میں وہ مصحف لکھا جو مدینہ منورہ کے مجمع الملک فہد لطباعہ المصحف سے 1980 کی دہائی سے چھپ رہا ہے اور جس کی کروڑوں، بلکہ اربوں کے قریب نقلیں گردش میں ہیں؛ انھوں نے اپنے ہاتھ سے دس سے زیادہ مصحف لکھے۔"
  es: "Calígrafo sirio, nacido en Alepo en 1934, considerado el calígrafo de mushaf más destacado de la era moderna. Escribió en naskh otomano el mushaf impreso por el Complejo de Impresión del Glorioso Corán Rey Fahd en Medina desde la década de 1980, del cual circularon cientos de millones de copias; además, escribió a mano más de diez copias del Corán."
  fr: "Calligraphe syrien né à Alep en 1934, considéré comme le plus grand calligraphe de mushaf de l'époque moderne. Il a calligraphié en naskh ottoman le mushaf imprimé par le Complexe d'impression du Coran du roi Fahd à Médine depuis les années 1980, diffusé à des centaines de millions d'exemplaires; il a également calligraphié à la main plus de dix exemplaires du Coran."
  tr: "1934 yılında Halep'te doğan Suriyeli bir hattat, modern dönemin en önde gelen Kur'an hattatlarından biri olarak kabul edilir. 1980'lerden beri Medine'de Kur'an için Kral Fahd Kompleksi tarafından basılan Mushaf'ı Osmanlı Nash alfabesiyle yazdı; bu kitap yüz milyonlarca kopya dolaşıma girdi; ondan fazla Kur'an kopyasını el yazısıyla yazdı."
  id: "Seorang kaligrafer Suriah, lahir pada tahun 1934 di Aleppo, ia dianggap sebagai salah satu kaligrafer Al-Qur'an paling terkemuka di era modern. Ia menulis dalam aksara Naskh Ottoman, Mushaf yang dicetak oleh King Fahd Complex untuk Al-Qur'an di Madinah sejak tahun 1980-an, yang telah beredar ratusan juta eksemplar; ia menulis lebih dari sepuluh salinan Al-Quran secara manual."
