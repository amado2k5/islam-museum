summary:
  ar: "محمد بن سعد بن منيع الهاشمي مولاهم، أبو عبد الله البصري (168–230هـ)، المعروف بكاتب الواقدي لملازمته شيخه محمد بن عمر الواقدي، وصاحب «الطبقات الكبرى»؛ وُلد بالبصرة وطلب العلم فيها وفي الكوفة وبغداد والمدينة ومكة ثم استقر ببغداد، وكان ممن أحضرهم المأمون إلى الرقة سنة 218هـ في المحنة بخلق القرآن فأجاب، وتوفي ببغداد على الراجح في جمادى الآخرة سنة 230هـ {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}."
  en: "Muhammad ibn Sa'd ibn Mani' al-Hashimi by clientage, Abu 'Abd Allah of Basra (168–230 AH), known as al-Waqidi's secretary for his long attachment to his teacher Muhammad ibn 'Umar al-Waqidi, and author of al-Tabaqat al-Kubra. He was born in Basra, studied there and in Kufa, Baghdad, Medina and Mecca, and settled in Baghdad. He was among those al-Ma'mun summoned to al-Raqqa in 218 AH in the inquisition over the createdness of the Qur'an, and he gave the required answer. He died in Baghdad, by the preferred date in Jumada al-Akhira 230 AH {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}."
  ur: "محمد بن سعد بن منیع، ولاءً ہاشمی، ابو عبد اللہ بصری (168–230ھ)، جو اپنے استاد محمد بن عمر واقدی سے طویل وابستگی کی وجہ سے کاتبِ واقدی کہلائے، اور «الطبقات الکبریٰ» کے مصنف ہیں۔ بصرہ میں پیدا ہوئے، وہاں اور کوفہ، بغداد، مدینہ اور مکہ میں علم حاصل کیا، پھر بغداد میں بس گئے۔ 218ھ میں خلقِ قرآن کی آزمائش میں مامون نے جن لوگوں کو رقہ بلایا ان میں وہ بھی تھے، اور انہوں نے مطلوبہ جواب دیا۔ راجح قول کے مطابق جمادی الآخرہ 230ھ میں بغداد میں وفات پائی {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}۔"
