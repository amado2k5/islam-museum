summary:
  ar: "محمد بن سعد بن منيع الهاشمي مولاهم، أبو عبد الله البصري ⁦(168–230هـ)⁩، المعروف بكاتب الواقدي لملازمته شيخه محمد بن عمر الواقدي، وصاحب «الطبقات الكبرى»؛ وُلد بالبصرة وطلب العلم فيها وفي الكوفة وبغداد والمدينة ومكة ثم استقر ببغداد، وكان ممن أحضرهم المأمون إلى الرقة سنة 218هـ في المحنة بخلق القرآن فأجاب، وتوفي ببغداد على الراجح في جمادى الآخرة سنة 230هـ {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}."
  en: "Muhammad ibn Sa'd ibn Mani' al-Hashimi by clientage, Abu 'Abd Allah of Basra (168–230 AH), known as al-Waqidi's secretary for his long attachment to his teacher Muhammad ibn 'Umar al-Waqidi, and author of al-Tabaqat al-Kubra. He was born in Basra, studied there and in Kufa, Baghdad, Medina and Mecca, and settled in Baghdad. He was among those al-Ma'mun summoned to al-Raqqa in 218 AH in the inquisition over the createdness of the Qur'an, and he gave the required answer. He died in Baghdad, by the preferred date in Jumada al-Akhira 230 AH {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}."
  ur: "محمد بن سعد بن منیع، ولاءً ہاشمی، ابو عبد اللہ بصری ⁦(168–230ھ)⁩، جو اپنے استاد محمد بن عمر واقدی سے طویل وابستگی کی وجہ سے کاتبِ واقدی کہلائے، اور «الطبقات الکبریٰ» کے مصنف ہیں۔ بصرہ میں پیدا ہوئے، وہاں اور کوفہ، بغداد، مدینہ اور مکہ میں علم حاصل کیا، پھر بغداد میں بس گئے۔ 218ھ میں خلقِ قرآن کی آزمائش میں مامون نے جن لوگوں کو رقہ بلایا ان میں وہ بھی تھے، اور انہوں نے مطلوبہ جواب دیا۔ راجح قول کے مطابق جمادی الآخرہ 230ھ میں بغداد میں وفات پائی {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}۔"
  es: "Muhammad ibn Sa'd ibn Mani' al-Hashimi, por clientela, Abu 'Abd Allah de Basora (168–230 AH), conocido como el secretario de al-Waqidi por su larga lealtad a su maestro Muhammad ibn 'Umar al-Waqidi, y autor de al-Tabaqat al-Kubra. Nació en Basora, estudió allí y en Kufa, Bagdad, Medina y La Meca, y se estableció en Bagdad. Estuvo entre aquellos a quienes al-Ma'mun convocó a al-Raqqa en 218 AH en la inquisición sobre la creación del Corán, y dio la respuesta requerida. Murió en Bagdad, en la fecha preferida en Jumada al-Akhira 230 AH {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 17-19} {citar:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {citar:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {citar:tarikh-khulafa-minhaj-1434 p. 490}."
  fr: "Muhammad ibn Sa'd ibn Mani' al-Hashimi, fils d'Abu 'Abd Allah de Bassora (168-230 AH), connu comme le secrétaire d'al-Waqidi en raison de sa longue fidélité à son maître Muhammad ibn 'Umar al-Waqidi, est l'auteur d'al-Tabaqat al-Kubra. Né à Bassora, il y fit ses études ainsi qu'à Koufa, Bagdad, Médine et La Mecque, avant de s'établir à Bagdad. Il fut parmi ceux convoqués par al-Ma'mun à Raqqa en 218 AH lors de l'enquête sur la création du Coran, et il apporta la réponse attendue. Il mourut à Bagdad, à la date privilégiée du mois de Jumada al-Akhira 230 AH (voir Tabaqat-ibn-sad-qism-mutammim-mansur-1987, p. 1). 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 58} {cite:tarikh-khulafa-minhaj-1434 p. 490}."
  tr: "Muhammed bin Sa'd ibn Mani'al-Hashimi, onların özgür bıraktığı Ebu Abdullah el-Basri (168–230 H) olarak, öğretmeni Muhammed bin Ömer el-Vaqidi ile arkadaşlığı nedeniyle el-Vaqidi'nin kâtipi olarak bilinir ve 'El-Tabaqat el-Kubra' adlı eserin yazarıdır; Basra'da doğmuş ve orada bilgi aramış, ayrıca Kufe, Bağdat, Medine ve Mekke'de de yer almış, ardından Bağdat'a yerleşmiştir. 218 Hicri Mührime'de Kur'an'ı yaratma sınavı sırasında el-Memun'un Rakka'ya getirdiği kişilerden biriydi ve o da cevap verdi. Tercih edilen görüşe göre, 230 Hicri yılında, Cumada'l-Ahira'da Bağdat'ta öldü {alıntı: Tabaqat-ibn-sad-qism-Mutammim-Mansur-1987 s. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 s. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 s. 58} {cite:tarikh-khulafa-minhaj-1434 s. 490}."
  id: "Muhammad ibn Sa'd ibn Mani' al-Hashimi, bekas budaknya, Abu Abdullah al-Basri (168–230 H), dikenal sebagai juru tulis al-Waqidi karena persahabatannya dengan gurunya Muhammad ibn Umar al-Waqidi, dan penulis 'Al-Tabaqat al-Kubra'; ia lahir di Basra dan mencari ilmu di sana, serta di Kufa, Baghdad, Madinah, dan Mekah, lalu menetap di Baghdad. Ia termasuk di antara mereka yang dibawa al-Ma'mun ke Raqqa pada tahun 218 H saat penderitaan penciptaan Al-Qur'an, dan ia menjawab. Ia meninggal di Baghdad, menurut pendapat yang disukai, di Jumada al-Akhirah pada tahun 230 H {cite: tabaqat-ibn-sad-qism-mutammim-mansur-1987 hlm. 17-19} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 hlm. 36} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 hlm. 58} {cite:tarikh-khulafa-minhaj-1434 hlm. 490}."
