summary:
  ar: "أبو بكر محمد بن إبراهيم بن المنذر النيسابوري، مات بمكة، وصنف في اختلاف العلماء كتباً لم يصنف أحد مثلها، واحتاج إليها الموافق والمخالف {cite:tabaqat-fuqaha-abbas-1981 p. 57}. قال الشيرازي: ولا أعلم عمن أخذ الفقه {cite:tabaqat-fuqaha-abbas-1981 p. 57}."
  en: "Abu Bakr Muhammad ibn Ibrahim ibn al-Mundhir al-Nisaburi, who died in Mecca. He wrote books on the disagreements of the scholars, the like of which no one had written, and both those who agreed with him and those who differed needed them {cite:tabaqat-fuqaha-abbas-1981 p. 57}. Al-Shirazi wrote: 'I do not know from whom he took jurisprudence' {cite:tabaqat-fuqaha-abbas-1981 p. 57}."
