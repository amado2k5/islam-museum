summary:
  ar: "شاعر من بني منقر من تميم؛ قدم في وفد بني تميم على النبي سنة 9هـ وكان أصغرهم سناً فخلّفوه في إبلهم، وحقّره قيس بن عاصم عند النبي فأعطاه النبي مثل ما أعطى القوم، فهجا قيساً ببيتين؛ وفي خلافة عمر حمل إليه بشرى فتح ريشهر فيما يرويه البلاذري."
  en: "A poet of Banu Minqar of Tamim; he came in the Tamim delegation of 9 AH as its youngest member and was left with the mounts, Qays ibn Asim belittled him before the Prophet, who gave him the same gift as the others, and he lampooned Qays in two verses; in Umar's caliphate he carried the news of the Rayshahr victory, as al-Baladhuri relates."
