summary:
  ar: "عالم وداعية صومالي مقيم في منطقة لاسعانود، يُلقي محاضرات متكرّرة في مسجد الهدى بلاسعانود وسُجّلت له محاضرات في غاروي في نوفمبر 2026؛ محاضراته من أكثر المحاضرات تداولًا لدى قنوات التجميع في المشهد الصومالي، وتُنشر رسميًا عبر عملية «رشاد ميديا» التي تصف قناتها بأنها صفحة قناته الرسمية، وبلغ عدد متابعي حسابها على تيك توك 181,400 متابع كما فُهرس نحو 20 أكتوبر 2026."
  en: "Somali scholar and preacher based in the Laascaanood area, with a recurring lecture series at Al Huda Mosque in Laascaanood and lectures recorded in Garoowe in November 2026; his lectures are among the most carried by the Somali scene's aggregator channels, and his official outlet is the Rashaad Media operation, whose own videos call its channel 'the official channel page of Sheikh Mahmoud Xaliike' — its TikTok account counted 181,400 followers as indexed at about 20 October 2026."
  ur: "صومالی عالم اور واعظ جو لاسعانود کے علاقے میں مقیم ہیں، لاسعانود کی مسجد الہدیٰ میں ان کا باقاعدہ درسی سلسلہ ہے اور نومبر 2026ء میں گارووے میں بھی ان کے خطبات ریکارڈ ہوئے؛ ان کے خطبات صومالی منظر کے مجمع چینلوں پر سب سے زیادہ نشر ہونے والوں میں ہیں، اور ان کا سرکاری ذریعہ «رشاد میڈیا» ہے، جس کی ویڈیوز اس کے چینل کو «شیخ محمود خالیکے کے سرکاری چینل کا صفحہ» کہتی ہیں — اس کے ٹک ٹاک اکاؤنٹ کے فالوور تقریباً 20 اکتوبر 2026ء کی فہرست سازی میں 181,400 تھے۔"
