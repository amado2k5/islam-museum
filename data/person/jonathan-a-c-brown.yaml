summary:
  ar: "عالم أمريكي في الدراسات الإسلامية (وُلد سنة 1977 في واشنطن العاصمة)، أستاذ كرسي الأمير الوليد بن طلال للحضارة الإسلامية في جامعة جورجتاون. اعتنق الإسلام سنة 1997، ويعمل في الحديث والفقه الإسلامي وتراث النبي، ومن كتبه كتابه عن تقنين صحيحي البخاري ومسلم (2007) و«الرق والإسلام» (2019) و«الإسلام والسواد» (2022)."
  en: "American scholar of Islamic studies (born 1977 in Washington, D.C.), Alwaleed bin Talal Chair of Islamic Civilization at Georgetown University. A convert to Islam (1997), he works on hadith, Islamic law and the Prophet's legacy; his books include The Canonization of al-Bukhari and Muslim (2007), Misquoting Muhammad (2014) and Slavery and Islam (2019)."
  ur: "امریکی عالمِ مطالعاتِ اسلام (پیدائش 1977ء، واشنگٹن ڈی سی)، جارج ٹاؤن یونیورسٹی میں اسلامی تہذیب کے پروفیسر۔ 1997ء میں اسلام قبول کیا؛ حدیث اور فقہِ اسلامی پر کام کرتے ہیں۔ ان کی کتابوں میں «الرق و الإسلام» (2019ء) اور «اسلام اور سیاہ فامی» (2022ء) شامل ہیں۔"
