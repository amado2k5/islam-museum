label:
  ar: سعيد بن أبي سورة
  en: Sa'id ibn Abi Sura
  ur: سعید بن ابی سورہ
summary:
  ar: فارس من فرسان اليمن المعدودة كان مع الدعام في حرب أثافت، ويروي الكتاب عنه أنه حمل مع ثلاثين فارساً على الهادي فبيست أيديهم على رماحهم، ثم انضم إلى الهادي.
  en: A horseman counted among Yemen's foremost who was with al-Da'am in the war at Athafit; the book reports from him that he charged al-Hadi with thirty horsemen and their hands stiffened on their lances, and that he later joined al-Hadi.
  ur: یمن کے گنے چنے شہسواروں میں سے ایک جو اثافت کی جنگ میں دعام کے ساتھ تھا؛ کتاب اس سے روایت کرتی ہے کہ اس نے تیس سواروں کے ساتھ ہادی پر حملہ کیا تو ان کے ہاتھ نیزوں پر اکڑ گئے، اور بعد میں وہ ہادی سے جا ملا۔
