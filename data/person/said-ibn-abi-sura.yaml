id: person/said-ibn-abi-sura
class: person
label:
  ar: سعيد بن أبي سورة
  en: Sa'id ibn Abi Sura
  ur: سعید بن ابی سورہ
  es: "Sa'id ibn Abi Sura"
  fr: "Sa'id ibn Abi Sura"
summary:
  ar: فارس من فرسان اليمن المعدودة كان مع الدعام في حرب أثافت، ويروي الكتاب عنه أنه حمل مع ثلاثين فارساً على الهادي فبيست أيديهم على رماحهم، ثم انضم إلى الهادي.
  en: A horseman counted among Yemen's foremost who was with al-Da'am in the war at Athafit; the book reports from him that he charged al-Hadi with thirty horsemen and their hands stiffened on their lances, and that he later joined al-Hadi.
  ur: یمن کے گنے چنے شہسواروں میں سے ایک جو اثافت کی جنگ میں دعام کے ساتھ تھا؛ کتاب اس سے روایت کرتی ہے کہ اس نے تیس سواروں کے ساتھ ہادی پر حملہ کیا تو ان کے ہاتھ نیزوں پر اکڑ گئے، اور بعد میں وہ ہادی سے جا ملا۔
  es: "Un jinete, considerado uno de los más destacados de Yemen, que estuvo con al-Da'am en la guerra de Athafit, relata en el libro que cargó contra al-Hadi con treinta jinetes, cuyas manos se endurecieron al sujetar sus lanzas, y que posteriormente se unió a al-Hadi."
  fr: "Un cavalier, considéré comme l'un des plus éminents du Yémen, qui était avec al-Da'am lors de la guerre d'Athafit; le livre rapporte de lui qu'il a chargé al-Hadi avec trente cavaliers dont les mains se sont raidies sur leurs lances, et qu'il a ensuite rejoint al-Hadi."
  tr: "Yemen'in az sayıdaki süvarisinden bir şövalye, Al-Da'ile şiddetli bir savaşta birlikteydi. Kitapta, otuz süvariyi Al-Hadi'ye karşı yönlendirdiği, ellerinin mızraklarında vurulduğu ve ardından Al-Hadi'ye katıldığı anlatılır."
  id: "Seorang ksatria di antara sedikit kavaleri Yaman yang bersama Al-Da'am dalam perang sengit. Buku ini menceritakan bahwa ia memimpin tiga puluh penunggang kuda melawan Al-Hadi, yang tangannya dipukul tombak, lalu ia bergabung dengan Al-Hadi."
