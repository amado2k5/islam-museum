id: person/muhammad-al-amin
class: person
label: { ar: "محمد الأمين بن هارون الرشيد" }
summary:
  ar: "خليفة عباسي، خُلع في سنة ست وتسعين ومائة وأُخذت البيعة لأخيه المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.428}، وقُتل في سنة ثمان وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.478}. وذكر الطبري توجيه جيوشه لحرب طاهر بن الحسين {cite:tabari-tarikh-abu-al-fadl j.8 p.418}، وعند السيوطي كان من أحسن الشباب صورة ذا قوة مفرطة يقال إنه قتل أسداً بيديه وله فصاحة وبلاغة لكن كان سيء التدبير كثير التبذير ضعيف الرأي أرعن لا يصلح للإمارة، فأول ما بويع أمر ثاني يوم ببناء ميدان جوار قصر المنصور للعب بالكرة {cite:tarikh-khulafa-minhaj-1434 p. 473}، وعند المسعودي كان بنو هاشم مائلون إليه بأهوائهم وفيه الانقياد لهواه والتبذير ومشاركة النساء والإماء في رأيه، وكتب الرشيد الشرطين بينه وبين أخيه وعلقهما في الكعبة سنة ست وثمانين، ورده جعفر بن يحيى عند خروجه من الكعبة فحلف له فإن غدرت بأخيك خذلك الله ثلاثاً، وأنشده الأصمعي أمام أبيه وقد أذنب في أبياته {cite:muruj-al-dhahab p. 337-341}، وعند المسعودي لما هم بخلع المأمون قال له عبد الله بن حازم أنشدك الله ألا تكون أول الخلفاء نكث عهده فقال اسكت وقال هرثمة لا تجريء القواد على الخلع فيخلعوك فلم يسمع {cite:muruj-al-dhahab p. 374-375}"
  tr: "196 Hicri'de tahttan indirilen bir Abbasi halifesi ve yemin kardeşi el-Me'mun tarafından alındı {cite:tabari-tarikh-abu-al-fadl j.8 s.428} ve 198 yılında öldürüldü {cite:tabari-tarikh-abu-al-fadl j.8 s.478}. Al-Tabari, ordularını Tahir ibn al-Hüseyin savaşına yönlendirdiğinden bahsetmişti {atıf:tabari-tarikh-abu-al-fadl j.8 s.418}. al-Suyuti'ye göre, aşırı güce sahip en iyi gençlerden biriydi ve kendi elleriyle bir aslanı öldürdüğü söylenir. Etkileyici ve etkileyici bir konuşmacıydı, ancak kötü yönetiliyordu, çok israfçı, zayıf zekalı ve pervasızdı, liderliğe uygun değildi. Bağlılık yemini eder etmez, ertesi gün Al-Mansur'un sarayının yanına top oynamak için bir meydan inşa edilmesini emretti {alıntı: Tarikh-Hulefa-Minhaj-1434, s. 473} ve el-Mes'udi'ye göre, Banu Haşimler onun isteklerine göre ona eğilimliydi; arzularına boyun eğmek, savurganlık ve kadın ile köleleri paylaşmak da onun görüşüne göre değişti. El-Reşid, kendisi ile kardeşi arasındaki iki şartı yazdı ve onları 86. yılda Kabe'de askıya aldı. Cafer bin Yahya, Kabe'yi terk ettiğinde onu reddetti ve ona yemin etti: 'Kardeşini ihanete uğratırsan, Allah seni üç kez hayal kırıklığına uğratır.' El-Esma'i, günah işlediği için babasının önünde bunu okudu. {alıntı: Muruj-al-Dhahab s. 337-341} ve al-Mas'udi'ye göre, el-Ma'mun'u tahttan indirmek üzereyken, Abdullah ibn Hazim ona, 'Allah senden söylesin, ahdini bozan ilk halife sen olmaz mısın?' dedi. O da, 'Susun,' dedi, Harthama da 'Liderleri acele ettirmeyin, sizi devirmesin,' dedi, ancak duymadı {cite:muruj-al-dhahab s. 374-375}"
  id: "Seorang khalifah Abbasiyah yang digulingkan pada tahun 196 H, dan janji itu diambil oleh saudaranya al-Ma'mun {cite:tabari-tarikh-abu-al-fadl j.8 hlm.428}, dan ia dibunuh pada tahun 198 {cite:tabari-tarikh-abu-al-fadl j.8 hlm.478}. Al-Tabari menyebutkan mengarahkan pasukannya ke perang Tahir ibn al-Husayn {cite:tabari-tarikh-abu-al-fadl j.8 hlm.418}. Menurut al-Suyuti, ia termasuk di antara pemuda terbaik dengan kekuatan luar biasa, yang dikatakan telah membunuh seekor singa dengan tangannya sendiri. Ia fasih dan fasih, tetapi kurang teratur, sangat boros, lemah pikiran, dan ceroboh, tidak layak memimpin. Begitu ia diikrarkan kesetiaan, ia memerintahkan keesokan harinya untuk membangun sebuah alun-alun di samping istana Al-Mansur untuk bermain bola {cite: Tarikh-Khulafa-Minhaj-1434, hlm. 473}, dan menurut al-Mas'udi, Banu Hashim cenderung kepadanya sesuai keinginan mereka, termasuk tunduk pada keinginan, boros, dan berbagi wanita serta budak menurut pendapatnya. Al-Rashid menulis dua syarat antara dirinya dan saudaranya dan menangguhkannya di Ka'bah pada tahun delapan puluh enam. Ja'far ibn Yahya menolaknya ketika meninggalkan Ka'bah, dan dia bersumpah kepadanya: 'Jika kamu mengkhianati saudaramu, Tuhan akan mengecewakanmu tiga kali.' Al-Asma'i membacakannya di depan ayahnya, setelah berdosa dalam ayatnya. {kutip: Muruj-al-Dhahab hlm. 337-341}, dan menurut al-Mas'udi ketika mereka hendak menggulingkan al-Ma'mun, Abdullah ibn Hazim berkata kepadanya, 'Semoga Allah bertanya kepadamu, apakah engkau tidak akan menjadi khalifah pertama yang melanggar perjanjian-Nya?' Ia berkata, 'Diamlah,' dan Harthama berkata, 'Jangan terburu-buru para pemimpin untuk menggulingkan dan menurunkan dirimu,' tetapi ia tidak mendengar {cite:muruj-al-dhahab hlm. 374-375}"
