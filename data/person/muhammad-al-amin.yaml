id: person/muhammad-al-amin
class: person
label: { ar: "محمد الأمين بن هارون الرشيد" }
summary:
  ar: "خليفة عباسي، خُلع في سنة ست وتسعين ومائة وأُخذت البيعة لأخيه المأمون {cite:tabari-tarikh-abu-al-fadl j.8 p.428}، وقُتل في سنة ثمان وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.478}. وذكر الطبري توجيه جيوشه لحرب طاهر بن الحسين {cite:tabari-tarikh-abu-al-fadl j.8 p.418}، وعند السيوطي كان من أحسن الشباب صورة ذا قوة مفرطة يقال إنه قتل أسداً بيديه وله فصاحة وبلاغة لكن كان سيء التدبير كثير التبذير ضعيف الرأي أرعن لا يصلح للإمارة، فأول ما بويع أمر ثاني يوم ببناء ميدان جوار قصر المنصور للعب بالكرة {cite:tarikh-khulafa-minhaj-1434 p. 473}، وعند المسعودي كان بنو هاشم مائلون إليه بأهوائهم وفيه الانقياد لهواه والتبذير ومشاركة النساء والإماء في رأيه، وكتب الرشيد الشرطين بينه وبين أخيه وعلقهما في الكعبة سنة ست وثمانين، ورده جعفر بن يحيى عند خروجه من الكعبة فحلف له فإن غدرت بأخيك خذلك الله ثلاثاً، وأنشده الأصمعي أمام أبيه وقد أذنب في أبياته {cite:muruj-al-dhahab p. 337-341}، وعند المسعودي لما هم بخلع المأمون قال له عبد الله بن حازم أنشدك الله ألا تكون أول الخلفاء نكث عهده فقال اسكت وقال هرثمة لا تجريء القواد على الخلع فيخلعوك فلم يسمع {cite:muruj-al-dhahab p. 374-375}"
