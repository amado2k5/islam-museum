label: { ar: "نزار بن معد", en: "Nizar ibn Ma'add" }
summary:
  ar: "نزار بن معد بن عدنان أبو القبائل العدنانية، ولد أربعة أولاد: إياداً وبه كان يكنى، وأنماراً، وربيعة، ومضراً، وقيل إن بجيلة وخثعم من ولد أنمار، فلما حضرته الوفاة قسم بينهم قسمة رمزية وأمرهم إن أشكلت أن يرجعوا إلى الأفعى الجرهمي ملك نجران، وقد كانت لنزار معه وقائع وحروب كثيرة واجتمعت عليه معد بن ربيعة ومضر وإياد وأنمار وتداعت بجدها نزار {cite:muruj-al-dhahab p. 430-431}."
  en: "Son of Ma'add and father of the Adnanite tribes — Iyad, Anmar, Rabi'a and Mudar — whose allegorical death-bed division sent the brothers to al-Af'a al-Jurhumi of Najran {cite:muruj-al-dhahab p. 430-431}."
