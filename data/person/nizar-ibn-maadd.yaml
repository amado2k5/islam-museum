summary:
  ar: "نزار بن معد بن عدنان أبو القبائل العدنانية، ولد أربعة أولاد: إياداً وبه كان يكنى، وأنماراً، وربيعة، ومضراً، وقيل إن بجيلة وخثعم من ولد أنمار، فلما حضرته الوفاة قسم بينهم قسمة رمزية وأمرهم إن أشكلت أن يرجعوا إلى الأفعى الجرهمي ملك نجران، وقد كانت لنزار معه وقائع وحروب كثيرة واجتمعت عليه معد بن ربيعة ومضر وإياد وأنمار وتداعت بجدها نزار {cite:muruj-al-dhahab p. 430-431}."
  en: "Son of Ma'add and father of the Adnanite tribes — Iyad, Anmar, Rabi'a and Mudar — whose allegorical death-bed division sent the brothers to al-Af'a al-Jurhumi of Najran {cite:muruj-al-dhahab p. 430-431}."
  es: "Hijo de Ma'add y padre de las tribus adnanitas (Iyad, Anmar, Rabi'a y Mudar), cuya división alegórica en el lecho de muerte envió a los hermanos a al-Af'a al-Yurhumi de Najran {citar:muruj-al-dhahab p. 430-431}."
  fr: "Fils de Ma'add et père des tribus Adnanites - Iyad, Anmar, Rabi'a et Mudar - dont la division allégorique sur le lit de mort envoya les frères à al-Af'a al-Jurhumi de Najran {cite: muruj-al-dhahab p. 430-431}."
  ur: "ابن معد اور عدنانی قبائل کے والد - عیاد، انمار، ربیعہ اور مدر - جن کی موت کے بستر کی تمثیلی تقسیم نے دونوں بھائیوں کو نجران کے الافاء الجرحومی کے پاس بھیجا تھا۔ 430-431}۔"
  tr: "Adnanit kabilelerinin babası Nizar ibn Ma'ad ibn Adnan'ın dört oğlu vardı: Iyad, bu lakabı Anmar, Rabi'ah ve Mudra. Ayrıca Bavilah ve Khath''ın Anmar'ın soyundan geldikleri söylenir. Ölümü yaklaştığında, sembolik olarak aralarına böldü ve onları Necran kralı Jarhami yılanına dönmeye emretti. Nizar ile birçok olay ve savaş yaşadı; Ma'ad ibn Rabi'ah, Mudar, Iyad ve Anmar ona karşı toplandı, büyükbabası Nizar ise onunla çatıştı {cite:muruj-al-dhahab, s. 430-431}."
  id: "Nizar ibn Ma'ad ibn Adnan, ayah suku Adnanit, memiliki empat putra: Iyad, yang memberinya julukan, Anmar, Rabi'ah, dan Mudra. Dikatakan juga bahwa Bajilah dan Khath'am adalah keturunan Anmar. Ketika kematiannya mendekat, ia secara simbolis membagi di antara mereka, memerintahkan mereka untuk kembali kepada ular Jarhami, raja Najran. Nizar mengalami banyak peristiwa dan perang dengannya, dan Ma'ad ibn Rabi'ah, Mudar, Iyad, serta Anmar berkumpul melawannya, dan kakeknya Nizar berperang dengannya {cite:muruj-al-dhahab, hlm. 430-431}."
