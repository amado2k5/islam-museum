summary:
  ar: "رابع نواب دكا (1871-1915)، حفيد خواجة عبد الغني وابن خواجة إحسان الله. استضاف في دكا مؤتمر التعليم المحمدي لعموم الهند في ديسمبر 1906 الذي تأسست في ختامه رابطة مسلمي عموم الهند (مسلم ليغ) فصار نائب رئيسها، وكان أبرز الداعين إلى تقسيم البنغال سنة 1905، وقاد المطالبة بجامعة في دكا حتى وُعد بها سنة 1912."
  en: "Fourth Nawab of Dhaka (1871–1915), grandson of Khwaja Abdul Ghani and son of Khwaja Ahsanullah. He hosted the December 1906 All India Muhammadan Educational Conference at Dhaka at whose close the All-India Muslim League was founded, becoming its vice-president; he was a leading supporter of the 1905 Partition of Bengal and led the demand for a university at Dhaka until it was pledged in 1912."
  ur: "ڈھاکہ کے چوتھے نواب (1871ء–1915ء)، خواجہ عبد الغنی کے پوتے اور خواجہ احسان اللہ کے بیٹے۔ انھوں نے دسمبر 1906ء میں ڈھاکہ میں آل انڈیا محمڈن ایجوکیشنل کانفرنس کی میزبانی کی جس کے اختتام پر آل انڈیا مسلم لیگ قائم ہوئی اور وہ اس کے نائب صدر بنے؛ وہ 1905ء میں تقسیمِ بنگال کے بڑے حامی تھے اور ڈھاکہ میں یونیورسٹی کے مطالبے کی قیادت کی یہاں تک کہ 1912ء میں اس کا وعدہ ملا۔"
