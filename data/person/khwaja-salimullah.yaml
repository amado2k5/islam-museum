  note: "Died at Chowringhee, Calcutta, on 16 January 1915, aged 43: the English article, Banglapedia and Wikidata agree. His body was brought back to Dhaka with state honours and buried in the family graveyard at Begum Bazaar (Banglapedia). The Hijri year (1333) is derived by tabular conversion (16 January 1915 falls in Safar 1333). Calcutta has no place entity in the museum yet, so no died_in relation is written."
