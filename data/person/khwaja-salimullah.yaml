  note: "Born at Ahsan Manzil, Dhaka, on 7 June 1871: the English article, Banglapedia and Wikidata agree. Eldest son of Khwaja Ahsanullah, third Nawab of Dhaka, and his first wife Nawab Begum Wahidunnesa; grandson of Khwaja Abdul Ghani. The Hijri year (1288) is derived by tabular conversion (7 June 1871 falls in Rabi' al-Awwal 1288)."
