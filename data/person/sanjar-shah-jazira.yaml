summary:
  ar: "الملك سنجر شاه بن غازي بن مودود بن أتابك زنكي صاحب الجزيرة العمرية؛ قتله ابنه غازي سنة خمس وستمائة وحلفوا له ثم وثب عليه من الغد خواص أبيه فقتلوه وملكوا أخاه الملك المعظم، وكان سنجر سيء السيرة ظلوماً {cite:shadharat-dhahab p. 23}."
  en: "Al-Malik Sanjar Shah b. Ghazi b. Mawdud b. Atabeg Zangi, lord of Jazirat Ibn Umar; his son Ghazi killed him in 605 — they had sworn to him — then the next day his father's close men fell on Ghazi, killed him, and enthroned his brother al-Malik al-Mu'azzam; Sanjar was foul-mannered and a wrongdoer {cite:shadharat-dhahab p. 23}."
