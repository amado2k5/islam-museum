names:
  - { value: "الملك سنجر شاه بن غازي بن مودود بن أتابك زنكي", kind: full }
summary:
  ar: "الملك سنجر شاه بن غازي بن مودود بن أتابك زنكي صاحب الجزيرة العمرية؛ قتله ابنه غازي سنة خمس وستمائة وحلفوا له ثم وثب عليه من الغد خواص أبيه فقتلوه وملكوا أخاه الملك المعظم، وكان سنجر سيء السيرة ظلوماً {cite:shadharat-dhahab p. 23}."
  en: "Al-Malik Sanjar Shah b. Ghazi b. Mawdud b. Atabeg Zangi, lord of Jazirat Ibn Umar; his son Ghazi killed him in 605 — they had sworn to him — then the next day his father's close men fell on Ghazi, killed him, and enthroned his brother al-Malik al-Mu'azzam; Sanjar was foul-mannered and a wrongdoer {cite:shadharat-dhahab p. 23}."
  es: "Al-Malik Sanjar Shah b. Ghazi b. Mawdud b. Atabeg Zangi, señor de Jazirat Ibn Umar; su hijo Ghazi lo mató en 605 —le habían jurado lealtad—, luego al día siguiente los hombres cercanos de su padre atacaron a Ghazi, lo mataron y entronizaron a su hermano al-Malik al-Mu'azzam; Sanjar era de modales viles y un malhechor {cite:shadharat-dhahab p. 23}."
  fr: "Al-Malik Sanjar Shah b. Ghazi b. Mawdud b. Atabeg Zangi, seigneur de Jazirat Ibn Umar; son fils Ghazi le tua en 605 — ils lui avaient prêté serment — puis le lendemain, les hommes proches de son père s'en prirent à Ghazi, le tuèrent et intronisèrent son frère al-Malik al-Mu'azzam; Sanjar était grossier et un malfaiteur {cite:shadharat-dhahab p. 23}."
  ur: "الملک سنجر شاہ بی۔ غازی بی۔ مودود بی۔ عتبیگ زنگی، جزیرۃ ابن عمر کا رب؛ اس کے بیٹے غازی نے اسے 605 میں قتل کر دیا - انہوں نے اس سے قسم کھائی تھی - پھر اگلے دن اس کے والد کے قریبی لوگ غازی پر برس پڑے، اسے قتل کر دیا، اور اس کے بھائی المالک المعظم کو تخت نشین کر لیا۔ سنجار بد اخلاق اور ظالم تھا 23}۔"
  tr: "Emevi adasının hükümdarı Kral Sanjar Şah ibn Ghazi ibn Mawdud ibn Atabeg Zangi, 605 Hicri yılında oğlu Ghazi tarafından öldürüldü ve ona yemin ettiler. Ertesi gün, babasının yakın yandaşları ona saldırdı, öldürdü ve büyük kral olan kardeşini yönetti. Sanjar kaba ve zalimdi {kaynak: shadharat-dhahab, s. 23}."
  id: "Raja Sanjar Shah ibn Ghazi ibn Mawdud ibn Atabeg Zangi, penguasa pulau Umayyah, dibunuh oleh putranya Ghazi pada tahun 605 H, dan mereka bersumpah kepadanya. Keesokan harinya, rekan-rekan dekat ayahnya menyerangnya, membunuhnya, dan memerintah saudaranya, raja agung. Sanjar bersikap kasar dan kejam {cite:shadharat-dhahab, hlm. 23}."
