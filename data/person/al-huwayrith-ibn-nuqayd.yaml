summary:
  en: "A Qurashi in Mecca who persistently harassed the Prophet; when al-Abbas was escorting the Prophet's daughters Fatima and Umm Kulthum to Medina, al-Huwayrith prodded their camel so they fell; he was ordered killed on the Conquest and slain by Ali ibn Abi Talib."
  ar: "رجل من قريش كان يؤذي النبي بمكة؛ ولما حمل العباس ابنتي النبي فاطمة وأم كلثوم يهاجر بهما نخس بهما الحويرث فألقاهما على الأرض؛ أهدر النبي دمه يوم الفتح وقتله علي بن أبي طالب."
