summary:
  ar: "يحيى بن عدي فيلسوف ولاهوتي عربي مسيحي ومترجم ومعلق على أرسطو، قدم من بلدة تكريت على دجلة وقضى حياته العملية في بغداد ناسخاً وبائع كتب، وتوفي فيها يوم 21 ذي القعدة 363هـ/13 أغسطس 974م وله من العمر 81 سنة. أخذ المنطق الأرسطي عن متى بن يونس وعن الفارابي، ونقل من السريانية أجزاء من الأرغانون ومن طبيعيات أرسطو وما بعد الطبيعة وعلّق عليها، وعدّه معاصروه رئيس الفلاسفة في زمنه، وتابعه تلاميذه المسيحيون، وبلغ أثره عبر أبي سليمان السجستاني وأبي حيان التوحيدي قراء كثيرين من أهل البلاط والعلماء حتى المتكلمين {cite:encyclopaedia-of-islam-2 vol. 11 p. 255} {cite:encyclopaedia-of-islam-2 vol. 11 p. 256}."
  en: "Yahya ibn Adi was a Christian Arab philosopher and theologian, a translator and commentator of Aristotle. He came from the town of Takrit on the Tigris, spent his working life in Baghdad as a copyist and bookseller, and died there on 21 Dhu l-Qa'da 363 (13 August 974) at the age of 81. He learned Aristotelian logic from Matta ibn Yunus and al-Farabi, translated from Syriac and annotated parts of the Organon and of Aristotle's physical and metaphysical works, was recognised by his contemporaries as the leading philosopher of his time, and reached a wide readership through his Christian pupils and through Abu Sulayman al-Sijistani and Abu Hayyan al-Tawhidi {cite:encyclopaedia-of-islam-2 vol. 11 p. 255} {cite:encyclopaedia-of-islam-2 vol. 11 p. 256}."
  ur: "یحییٰ بن عدی عیسائی عرب فلسفی اور عالمِ دین تھے، ارسطو کے مترجم اور شارح۔ وہ دجلہ کے کنارے تکریت کے قصبے سے آئے، عملی زندگی بغداد میں نسخہ نویس اور کتب فروش کے طور پر گزاری اور وہیں 21 ذی القعدہ 363ھ/13 اگست 974ء کو اکیاسی برس کی عمر میں فوت ہوئے۔ انہوں نے ارسطوئی منطق متی بن یونس اور فارابی سے سیکھی، ارغنون اور ارسطو کی طبیعیات و مابعدالطبیعیات کے حصے سریانی سے ترجمہ کر کے ان پر حواشی لکھے، ہم عصروں نے انہیں اپنے وقت کا سردارِ فلاسفہ مانا، اور ان کے اثر کو ان کے عیسائی شاگردوں نیز ابو سلیمان سجستانی اور ابو حیان توحیدی کے ذریعے وسیع قارئین ملے {cite:encyclopaedia-of-islam-2 vol. 11 p. 255} {cite:encyclopaedia-of-islam-2 vol. 11 p. 256}."
