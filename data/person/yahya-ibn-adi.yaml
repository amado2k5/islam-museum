kids:
  ar: "يحيى بن عدي كان يبيع الكتب وينسخها في بغداد، وترجم كتب أرسطو وشرحها للناس."
  en: "Yahya ibn Adi copied and sold books in Baghdad, and he translated and explained the books of Aristotle."
