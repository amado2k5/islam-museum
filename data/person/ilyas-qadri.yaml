summary:
  ar: "عالم باكستاني من كراتشي ⁦(وُلد 1950)⁩، مؤسس حركة دعوة إسلامي سنة 1981 وأميرها منذ تأسيسها، تصفه «مسلم 500» بأنه قائد فرع القادرية الرضوية العطارية من الطريقة القادرية الصوفية؛ ألّف نحو ثلاثين كتابًا أشهرها «فيضان سنت»، وبلغت قناته على يوتيوب 2.25 مليون مشترك في نوفمبر 2026 بحسب vidIQ."
  en: "Pakistani scholar from Karachi (born 1950), founder of Dawat-e-Islami in 1981 and its leader since its foundation, and described by The Muslim 500 as a leader of the Qadiriyyah, Radaviyyah, Attariya branch of the Qadri Sufi order; author of some 30 books, chief among them Faizan-e-Sunnat. His YouTube channel counted 2.25 million subscribers in November 2026 per vidIQ."
  ur: "کراچی سے تعلق رکھنے والے پاکستانی عالم (پیدائش 1950ء)، دعوتِ اسلامی کے بانی (1981ء) اور اس کے قیام سے امیر، «مسلم 500» انہیں قادری صوفی سلسلے کی قادریہ رضویہ عطاریہ شاخ کا قائد قرار دیتی ہے؛ تقریباً تیس کتب کے مصنف جن میں «فیضانِ سنت» سب سے مشہور ہے۔ vidIQ کے مطابق نومبر 2026ء میں ان کے یوٹیوب چینل کے سبسکرائبر 2.25 ملین تھے۔"
