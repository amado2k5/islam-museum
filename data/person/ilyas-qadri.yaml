    note: "Recorded unknown under this lane's two-independent-text rule, with the readings preserved. The Muslim 500 (Royal Islamic Strategic Studies Centre, 2010 edition, p. 102) states in prose: 'Sheikh Muhammad Ilyas Attar Qadiri is a leader of the Qadiriyyah, Radaviyyah, Attariya branch of the Qadri Sufi order.' The English Wikipedia article states in its lead prose that he 'belongs to the Qadri-Razavi order of Sufism', and its Sufism section records that he became a murid of Ziauddin Madani, was authorised in Sufism by Waqaruddin and Fazlur Rahman Malik, and was authorised in the four major orders by Shariful Haq Amjadi. These do not settle the value in this lane: the article's lead claim rests on The Muslim 500 itself (its reference 1) and its Sufism section on 'Attar - The Life and the Journey' (Maktaba tul Madinah, 2010), his own movement's biography, so the attestations reduce to one independent text plus his own ecosystem; and The Muslim 500's wording is leadership of a branch, and headship never counts as attestation in this lane. The school question is likewise unsettled: the Hanafi attestation stands only in Dawat-e-Islami's own LMS biography prose ('in jurisprudence (Fiqh), he follows Imam al-A'zam Abu Hanifa... and is thus Hanafi') together with the article's infobox fields (Sunni / Hanafi / Maturidi / Barelvi), which this lane excludes as attestation. All readings preserved here, none adopted."
