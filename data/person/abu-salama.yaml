summary:
  en: "Abdullah ibn Abd al-Asad al-Makhzumi, Abu Salama; one of the earliest Muslims of the secret call and the Prophet's foster-brother by Thuwayba's milk."
  ar: "عبد الله بن عبد الأسد المخزومي، أبو سلمة؛ من أوائل المسلمين في الدعوة السرية، وكان من رضاعة النبي إذ أرضعته ثويبة. وعند المسعودي لما قتل إبراهيم الإمام أضمر الرجوع عن الدعوة العباسية إلى آل أبي طالب فبعث محمد بن عبد الرحمن بن أسلم بكتابين على نسخة واحدة إلى جعفر بن محمد وإلى عبد الله بن الحسن يدعوهما إلى الشخوص إليه وقال للرسول العجل العجل فلا تكونن كوافد عاد {cite:muruj-al-dhahab p. 240}، وكان أول من وقع عليه اسم الوزارة في الدولة ويدعى وزير آل محمد، وكتب أبو مسلم يشير بقتله فأبى السفاح أن يفتتح دولته بقتل رجل من شيعته وقال إني لآمنه في ليلي ونهاري، فلما اتصل ذلك بأبي مسلم وجّه ثقات أصحابه فوثبوا عليه ليلة وهو منصرف من عند السفاح بالأنبار فقتلوه غيلة، فأنشأ السفاح إلى النار فليذهب ومن كان مثله على أي شيء فاتنا منه نأسف {cite:muruj-al-dhahab p. 256-257}"
