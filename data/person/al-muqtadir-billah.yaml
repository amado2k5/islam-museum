id: person/al-muqtadir-billah
class: person
label: { ar: "المقتدر بالله", en: "al-Muqtadir bi'llah", fr: "al-Muqtadir bi'llah" , ur: "المقتدر باللہ", es: "al-Muqtadir bi'llah"}
summary:
  ar: "خليفة عباسي بويع سنة خمس وتسعين ومائتين، وخُلع في سنة ست وتسعين ومائتين، ثم أُعيد إلى الخلافة في سنة سبع عشرة وثلاثمائة، وقُتل في سنة عشرين وثلاثمائة {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}، وعند السيوطي ولد في رمضان سنة اثنتين وثمانين وأمه رومية اسمها شغب، ولم يل الخلافة قبله أصغر منه فإنه وليها وله ثلاث عشرة سنة، وخلع مرتين: في سنة ست لابن المعتز يوماً واحداً وفي سنة سبع عشرة لمؤنس للقاهر ثم رده الجند، وصار الأمر والنهي لحرمه لركاكته، وقال الذهبي اختل النظام كثيراً في أيامه لصغره {cite:tarikh-khulafa-minhaj-1434 p. 585-589}. وعند المسعودي هو جعفر بن أحمد المكتفي يكنى أبا الفضل وأمه أم ولد يقال لها شغب، بويع في اليوم الذي توفي فيه أخوه يوم الأحد لثلاث عشرة ليلة خلت من ذي القعدة سنة خمس وتسعين ومائتين وله ثلاث عشرة سنة، وقتل ببغداد بعد صلاة العصر يوم الأربعاء لثلاث ليال بقين من شوال سنة عشرين وثلثمائة فكانت خلافته أربعاً وعشرين سنة وأحد عشر شهراً وستة عشر يوماً وبلغ من السن ثمانية وثلاثين سنة {cite:muruj-al-dhahab p. 648-649}، وعند المسعودي استوزر بعد قتل العباس بن الحسن علي بن محمد بن الفرات ثلاث مرات أولاها سنة تسع وتسعين وثانيتها سنة أربع وثلثمائة وثالثتها وكان الغالب على الأمور ولده محسن، واستوزر محمد بن عبيد الله بن يحيى بن خاقان وعلي بن عيسى بن داود بن الجراح مرتين وحامد بن العباس وعبد الله بن محمد بن عبيد الله الخاقاني وأحمد بن عبيد الله الخصيبي وأبا علي محمد بن علي بن مقلة وسليمان بن الحسن بن مخلد وعبيد الله بن محمد الكلواذي والحسين بن القاسم الذي قتل بالرقة وآخرهم الفضل بن جعفر بن الفرات {cite:muruj-al-dhahab p. 660-661}، وعند ابن الأثير في خلع 317هـ أخرجوه ووالدته وخالته وخواص جواريه وأولاده من دار الخلافة إلى دار مؤنس، وقام إليه ابن حمدان يعاتبه وهو يدمع وكذلك المقتدر، وأودعوا كتاب خلعه عند القاضي أبي عمرو فكتمه فاستحسن ذلك منه بعد عودته وولاه القضاء {cite:kamil-ibn-al-athir p. 149-150}، وعند ابن الجوزي وفي سنة 302هـ أمر أن لا يستعان بأحد من اليهود والنصارى فألزموا بيوتهم وأخذوا بلبس القلانس والرقع وتكون ركبهم خشباً {cite:muntazam-ibn-al-jawzi p. 351}، وعند ابن الجوزي وظهر موت ابن المعتز في دار السلطان لليلتين خلتا من ربيع الآخر سنة 296هـ وأخرجه مؤنس إلى منزله ملفوفاً فسلمه إلى أهله فدفنوه في خراب بإزاء داره وأمر المقتدر بتغريق الجرائد في دجلة فكثر الشاكرون له ولا يعرف خليفة خلع ثم أعيد سوى اثنين الأمين والمقتدر بالله {cite:muntazam-ibn-al-jawzi p. 351}"
  en: "Abbasid caliph, hailed in 295 and deposed in 296, restored to the caliphate in 317 and killed in 320 {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. According to al-Suyuti he was born in Ramadan 282 to a Byzantine mother named Shaghab, and no caliph before him had been younger, since he took office at thirteen. He was deposed twice: for a single day in 296, in favour of Ibn al-Mu'tazz, and in 317, when Mu'nis moved to put al-Qahir in his place until the troops restored him; command and prohibition then passed to his womenfolk because of his frailty. Al-Dhahabi says order was greatly disrupted in his days because of his youth {cite:tarikh-khulafa-minhaj-1434 p. 585-589}. According to al-Mas'udi he was Ja'far ibn Ahmad al-Muktafi, known as Abu'l-Fadl, whose mother was an umm walad called Shaghab. He was hailed on the day his brother died, on the thirteenth night of Dhu'l-Qa'da 295, at thirteen years old, and was killed in Baghdad after the afternoon prayer on Wednesday, three nights before the end of Shawwal 320. His caliphate lasted twenty-four years, eleven months and sixteen days, and he was thirty-eight years old {cite:muruj-al-dhahab p. 648-649}. Also according to al-Mas'udi, after al-Abbas ibn al-Hasan was killed he appointed Ali ibn Muhammad ibn al-Furat as vizier three times: first in 299, then in 304, and the third time when his son Muhsin was the dominant force in affairs. He also appointed as vizier Muhammad ibn Ubayd Allah ibn Yahya ibn Khaqan; Ali ibn Isa ibn Dawud ibn al-Jarrah, twice; Hamid ibn al-Abbas; Abd Allah ibn Muhammad ibn Ubayd Allah al-Khaqani; Ahmad ibn Ubayd Allah al-Khusaybi; Abu Ali Muhammad ibn Ali ibn Muqla; Sulayman ibn al-Hasan ibn Makhlad; Ubayd Allah ibn Muhammad al-Kalwadhani; al-Husayn ibn al-Qasim, who was killed at Raqqa; and last of them al-Fadl ibn Ja'far ibn al-Furat {cite:muruj-al-dhahab p. 660-661}. According to Ibn al-Athir, in 317 they removed him from the palace, with his mother, his maternal aunt, his favourite concubines and his sons, to the house of Mu'nis. Ibn Hamdan came to rebuke him while he was weeping, and so did al-Muqtadir. They deposited the document of his deposition with Judge Abu Amr, who concealed it; this was approved of him after he returned, and he appointed him to the judgeship {cite:kamil-ibn-al-athir p. 149-150}. According to Ibn al-Jawzi, in 302 he ordered that Jews and Christians not be employed; they were confined to their houses, obliged to wear caps and patches, and their stirrups were made of wood {cite:muntazam-ibn-al-jawzi p. 351}. According to Ibn al-Jawzi, the death of Ibn al-Mu'tazz became known in the sultan's house two nights into Rabi' II 296; Mu'nis took him out to his home wrapped up and handed him to his family, who buried him in a ruin facing their house. Al-Muqtadir ordered the ledgers thrown into the Tigris, and many gave thanks to him for it. No caliph is known to have been deposed and then restored except two: al-Amin and al-Muqtadir bi'llah {cite:muntazam-ibn-al-jawzi p. 351}."
  fr: "Le calife abbasside, salué en 295 et déposé en 296, a été restauré au califat en 317 et tué en 320 {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. Selon al-Suyuti, il est né le jour du Ramadan 282 d'une mère byzantine nommée Shaghab, et aucun calife avant lui n'avait été plus jeune, puisqu'il a pris ses fonctions à treize ans. Il a été déposé deux fois : pour un seul jour en 296, en faveur d'Ibn al-Mu'tazz, et en 317, lorsque Mu'nis a déménagé pour mettre al-Qahir à sa place jusqu'à ce que les troupes le rétablissent ; Puis, le commandement et la prohibition passèrent à ses femmes à cause de sa fragilité. Al-Dhahabi dit que l'ordre a été grandement perturbé dans ses jours à cause de sa jeunesse {cite:tarikh-khulafa-minhaj-1434 p. 585-589}. Selon al-Mas'udi, il était Ja'far ibn Ahmad al-Muktafi, connu sous le nom d'Abu'l-Fadl, dont la mère était une oumm walad appelée Shaghab. Il a été salué le jour où son frère est mort, la treizième nuit de Dhu'l-Qa'da 295, à treize ans, et a été tué à Bagdad après la prière de l'après-midi mercredi, trois nuits avant la fin de Shawwal 320. Son califat dura vingt-quatre ans, onze mois et seize jours, et il avait trente-huit ans {cite:muruj-al-dhahab p. 648-649}. Toujours selon al-Mas'udi, après la mort d'al-Abbas ibn al-Hasan, il a nommé Ali ibn Muhammad ibn al-Furat vizir trois fois : d'abord en 299, puis en 304, et la troisième fois lorsque son fils Muhsin était la force dominante dans les affaires. Il a également nommé comme vizir Muhammad ibn Ubayd Allah ibn Yahya ibn Khaqan ; Ali ibn Isa ibn Dawud ibn al-Jarrah, deux fois ; Hamid ibn al-Abbas ; Abd Allah ibn Muhammad ibn Ubayd Allah al-Khaqani ; Ahmad ibn Ubayd Allah Al-Khusaybi ; Abu Ali Muhammad ibn Ali ibn Muqla ; Sulayman ibn al-Hasan ibn Makhlad ; Ubayd Allah ibn Muhammad al-Kalwadhani ; al-Husayn ibn al-Qasim, qui a été tué à Raqqa ; et le dernier d'entre eux al-Fadl ibn Ja'far ibn al-Furat {cite:muruj-al-dhahab p. 660-661}. Selon Ibn al-Athir, en 317 ils l'ont enlevé du palais, avec sa mère, sa tante maternelle, ses concubines préférées et ses fils, à la maison de Mu'nis. Ibn Hamdan est venu le réprimander alors qu'il pleurait, et al-Muqtadir aussi. Ils déposèrent le document de sa déposition auprès du juge Abou Amr, qui le cacha  ; cela lui fut approuvé après son retour, et il le nomma juge {cite:kamil-ibn-al-athir p. 149-150}. Selon Ibn al-Jawzi, en 302, il ordonna que les Juifs et les Chrétiens ne soient pas employés ; ils étaient confinés dans leurs maisons, obligés de porter des casquettes et des patchs, et leurs étriers étaient en bois {cite:muntazam-ibn-al-jawzi p. 351}. Selon Ibn al-Jawzi, la mort d'Ibn al-Mu'tazz est devenue connue dans la maison du sultan deux nuits dans Rabi' II 296 ; Mu'nis l'a emmené chez lui enveloppé et l'a remis à sa famille, qui l'a enterré dans une ruine face à leur maison. Al-Muqtadir a ordonné que les livres soient jetés dans le Tigre, et beaucoup lui en ont rendu grâce. Aucun calife n'est connu pour avoir été déposé puis restauré sauf deux  : al-Amin et al-Muqtadir bi'llah {cite:muntazam-ibn-al-jawzi p. 351}."
  ur: "عباسی خلیفہ، جن کی بیعت 295ھ میں ہوئی؛ ماخذ ان کی معزولیوں، 317ھ میں بحالی اور 320ھ میں قتل کا ذکر کرتے ہیں۔ {cite:muntazam-ibn-al-jawzi}"
  es: "Califa abasí, aclamado en 295 y depuesto en 296, restaurado al califato en 317 y asesinado en 320 {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. Según al-Suyuti, nació en Ramadán de 282 de una madre bizantina llamada Shaghab, y ningún califa anterior había sido más joven, ya que asumió el cargo a los trece años. Fue depuesto dos veces: por un solo día en 296, a favor de Ibn al-Mu'tazz, y en 317, cuando Mu'nis intentó poner a al-Qahir en su lugar hasta que las tropas lo restituyeron; el mando y la prohibición pasaron entonces a sus mujeres debido a su fragilidad. Al-Dhahabi dice que el orden se vio muy alterado en su época debido a su juventud {cite:tarikh-khulafa-minhaj-1434 p. 585-589}. Según al-Mas'udi, era Ja'far ibn Ahmad al-Muktafi, conocido como Abu'l-Fadl, cuya madre era una umm walad llamada Shaghab. Fue aclamado el día en que murió su hermano, en la decimotercera noche de Dhu'l-Qa'da 295, a los trece años, y fue asesinado en Bagdad después de la oración de la tarde del miércoles, tres noches antes del final de Shawwal 320. Su califato duró veinticuatro años, once meses y dieciséis días, y tenía treinta y ocho años {cite:muruj-al-dhahab p. 648-649}. También según al-Mas'udi, después de que al-Abbas ibn al-Hasan fue asesinado, nombró a Ali ibn Muhammad ibn al-Furat como visir tres veces: primero en 299, luego en 304, y la tercera vez cuando su hijo Muhsin era la fuerza dominante en los asuntos. También nombró como visir a Muhammad ibn Ubayd Allah ibn Yahya ibn Khaqan; Ali ibn Isa ibn Dawud ibn al-Jarrah, dos veces; Hamid ibn al-Abbas; Abd Allah ibn Muhammad ibn Ubayd Allah al-Khaqani; Ahmad ibn Ubayd Allah al-Khusaybi; Abu Ali Muhammad ibn Ali ibn Muqla; Sulayman ibn al-Hasan ibn Makhlad; Ubayd Allah ibn Muhammad al-Kalwadhani; al-Husayn ibn al-Qasim, asesinado en Raqqa; y el último de ellos al-Fadl ibn Ja'far ibn al-Furat {cita:muruj-al-dhahab p. 660-661}. Según Ibn al-Athir, en 317 lo sacaron del palacio, con su madre, su tía materna, sus concubinas favoritas y sus hijos, a la casa de Mu'nis. Ibn Hamdan vino a reprenderlo mientras lloraba, y también lo hizo al-Muqtadir. Depositaron el documento de su declaración con el juez Abu Amr, quien lo ocultó; esto fue aprobado por él después de su regreso, y lo nombró juez {cite:kamil-ibn-al-athir p. 149-150}. Según Ibn al-Jawzi, en 302 ordenó que no se empleara a judíos ni cristianos; fueron confinados a sus casas, obligados a usar gorros y parches, y sus estribos eran de madera {cite:muntazam-ibn-al-jawzi p. 351}. Según Ibn al-Jawzi, la muerte de Ibn al-Mu'tazz se supo en la casa del sultán dos noches después de Rabi' II 296; Mu'nis lo llevó a su casa envuelto y se lo entregó a su familia, quienes lo enterraron en una ruina frente a su casa. Al-Muqtadir ordenó que los libros de contabilidad fueran arrojados al Tigris, y muchos le agradecieron por ello. No se conoce ningún califa que haya sido depuesto y luego restaurado, excepto dos: al-Amin y al-Muqtadir bi'llah {cite:muntazam-ibn-al-jawzi p. 351}."
  tr: "295 Hicri'de bağlılık yemini eden, 296 Hicri'de tahttan indirilmiş, 317 Hicri'de halifeliğe geri dönen ve 320 Hicri'de öldürülen bir Abbasi halifesi {cite:tabari-tarikh-abu-al-fadl j.11 s.28} {cite:tabari-tarikh-abu-al-fadl j.11 s.31} {cite:tabari-tarikh-abu-al-fadl j.11 s.124} {cite:tabari-tarikh-abu-al-fadl j.11 s.152}. al-Suyuti'ye göre, 82 Hicri yılında Ramazan'da doğmuştur ve annesi Shaghab adında bir Roma'ydı. On üç yıl boyunca halefi olduğu için ondan önce halifeliğe çıkmadı ve tahttan indirdi: Altıncı yılda, İbn al-Mu'tazz bir gün aldı ve on yedinci yılda Kahire'deki Mu'annis için verildi, sonra askerler onu geri getirdi. Emir ve yasaklama, onun kayıtsızlığı nedeniyle yasaklandı. El-Dhahabi, gençliğinde düzenin büyük ölçüde bozulduğunu söyledi {atıf:Tarikh-khulafa-minhaj-1434, s. 585-589}. al-Mas'udi'ye göre, kendisi Ja'far ibn Ahmed al-Muktafi olarak bilinir ve nam-ı diğer Ebu el-Fadl'dır ve annesi Şaghab adında bir oğlun annesidir. Kardeşinin öldüğü gün, Pazar günü Dhu al-Qi'dah'tan on üç gece önce, iki yüz doksan beşinci yılda bağlılık yemini etmişti ve on üç yaşındaydı. 320 Hicri yılında, Çarşamba günü Asr namazından sonra, Şevval'den üç gece önce Bağdat'ta öldürüldü, böylece halifeliği yirmi dört yıl, on bir ay ve on altı gün sürdü ve otuz sekiz yaşına ulaştı {atıft: Muruj-al-Dhahab, s. 648-649. El-Mes'udi'ye göre, el-Abbas ibn el-Hasan Ali ibn Muhammed ibn el-Furat'ın öldürülmesinden sonra üç kez d'uzir (d'urr) olarak atanmıştır: ilki 99 H yılında, ikinci kez 304 Hicri yılında ve üçüncü kez oğlu Muhsin işin baskın lideriydi. Muhammed ibn Ubeyd Allah ibn Yahya ibn Khaqan, Ali ibn İsa ibn Dawud ibn al-Jarrah, Hamid ibn al-Abbas, Abdullah ibn Muhammed bin Ubeyd Allah el-Khakani, Ahmed ibn Ubayd Allah el-Hasibi, Ebu Ali ibn Muhammed ibn Ali ibn Muqla ve Süleyman İbn el-Hasan ibn Mukhlad, Ubeyd Allah ibn Muhammed el-Kalwadi ve Rakka'da öldürülen el-Hüseyin bin el-Kaz (sonuncusu el-Fadl ibn Ca'far ibn el-Furat) {atıf:Muruj-al-Dhahab s. 660-661}. İbn el-Athir'in 317 Hicri yılında tahttan indirilmesi, onu annesi, annesinin teyzesi, yakın hizmetkarları ve çocuklarıyla birlikte halifelikten Mu'nis'in evine sürdüler. İbn Hamdan ağlarken yanına gitti, el-Muktadir de öyle. Görevden alınma mektubunu Hakim Ebu Amr'e bıraktılar, o da geri döndükten sonra kabul edip onu yargıç olarak atadı. {alıntı: Kamil-ibn-al-Athir s. 149-150} ve İbn al-Jawzi'ye göre, 302 Hicri yılında, Yahudilerden veya Hristiyanlardan yardım talep edilmemesini emretmiş, bu yüzden evde kalmış, kapüşon ve yama takmaya başlamış, dizleri ahşaptan yapılacaktır {atıf:Muntazam-ibn-al-Jawzi s. 351}. İbn al-Jawzi'ye göre, İbn al-Mu'tazz'ın ölümü 296 Hicri yılında Rabi'al-Thani'den önce iki gece boyunca sultanın evinde görünmüştür. Mu'annis onu evine sarılmış halde götürmüş, ailesine teslim etmiş, ailesi onu evinin karşısındaki harabelere gömmüştür ve el-Muqtadir Dicle'de gazetelerin sel basmasını emretmişti, bu yüzden birçok kişi ona minnettardı ve halefi bilinmemiştir Sonra sadece iki kişi geri getirildi, güvenilir ve güçlü olanlar Tanrı tarafından {cite:muntazam-ibn-al-jawzi s. 351}"
  id: "Seorang khalifah Abbasiyah yang bersumpah setia pada tahun 295 H, digulingkan pada tahun 296 H, kemudian dipulihkan ke kekhalifahan pada tahun 317 H, dan dibunuh pada tahun 320 H. {cite:tabari-tarikh-abu-al-fadl j.11 hlm.28} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.31} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.124} {cite:tabari-tarikh-abu-al-fadl j.11 hlm.152}. Menurut al-Suyuti, ia lahir pada bulan Ramadan tahun delapan puluh dua H, dan ibunya adalah seorang Romawi bernama Shaghab. Ia tidak naik tahta khalifah sebelum dirinya, karena ia menjadi penerusnya selama tiga belas tahun, dan ia menggulingkan: Pada tahun keenam, Ibn al-Mu'tazz menerima satu hari, dan pada tahun ketujuh belas menerima satu hari untuk Mu'annis di Kairo, kemudian para tentara mengembalikannya. Perintah dan larangan itu menjadi dilarang karena ketidakpeduliannya. Al-Dhahabi mengatakan bahwa ketertiban sangat terganggu selama masa mudanya {kutip: Tarikh-khulafa-minhaj-1434, hlm. 585-589}. Menurut al-Mas'udi, ia adalah Ja'far ibn Ahmad al-Muktafi yang dikenal sebagai Abu al-Fadl, dan ibunya adalah ibu dari seorang putra bernama Shaghab. Ia diikrarkan setia pada hari saudaranya meninggal pada hari Minggu, tiga belas malam sebelum Dhu al-Qi'dah tahun dua ratus sembilan puluh lima, dan ia berusia tiga belas tahun. Ia dibunuh di Baghdad setelah shalat Asr pada hari Rabu, tiga malam sebelum Shawwal tahun 320 H, sehingga kekhalifahannya berlangsung dua puluh empat tahun, sebelas bulan, dan enam belas hari, dan ia mencapai usia tiga puluh delapan {cite: Muruj-al-Dhahab, hlm. 648-649. Menurut al-Mas'udi, setelah pembunuhan al-Abbas ibn al-Hasan Ali ibn Muhammad ibn al-Furat, ia diangkat sebagai d'uzir (d'urr) sebanyak tiga kali: yang pertama pada tahun 99 H, yang kedua pada tahun 304 H, dan yang ketiga, dengan putranya Muhsin sebagai yang dominan dalam urusan tersebut. Muhammad ibn Ubayd Allah ibn Yahya ibn Khaqan, Ali ibn Isa ibn Dawud ibn al-Jarrah dua kali, Hamid ibn al-Abbas, Abdullah ibn Muhammad ibn Ubayd Allah al-Khaqani, Ahmad ibn Ubayd Allah al-Khasibi, Abu Ali ibn Muhammad ibn Ali ibn Muqla, dan Sulayman Ibn al-Hasan ibn Mukhlad, Ubayd Allah ibn Muhammad al-Kalwadhi, dan al-Husayn ibn al-Qasim, yang dibunuh di Raqqa, yang terakhir adalah al-Fadl ibn Ja'far ibn al-Furat {cite:muruj-al-dhahab hlm. 660-661}. Setelah Ibn al-Athir dicopot pada tahun 317 H, mereka mengusirnya, bersama ibunya, bibi dari pihak ibu, pelayan dekatnya, dan anak-anak dari kekhalifahan ke rumah Mu'ni. Ibn Hamdan mendatangi dia saat dia menangis, begitu juga al-Muqtadir. Mereka menyerahkan surat pemberhentiannya kepada Hakim Abu Amr, yang merahasiakannya, dan dia menerimanya setelah kembali dan mengangkatnya sebagai hakim. {cite: kamil-ibn-al-athir hlm. 149-150}, dan menurut Ibn al-Jawzi, pada tahun 302 H, ia memerintahkan agar tidak ada bantuan yang diminta dari orang Yahudi atau Kristen, sehingga mereka tetap di rumah, mulai mengenakan tudung dan tambalan, dan lutut mereka akan dibuat dari kayu {cite:muntazam-ibn-al-jawzi hlm. 351}. Menurut Ibn al-Jawzi, kematian Ibn al-Mu'tazz muncul di rumah sultan selama dua malam sebelum Rabi' al-Thani pada tahun 296 H. Mu'annis membawanya ke rumahnya dengan bungkusan, menyerahkannya kepada keluarganya, yang menguburnya dalam reruntuhan di seberang rumahnya, dan al-Muqtadir memerintahkan banjir surat kabar di Sungai Tigris, sehingga banyak yang berterima kasih padanya, dan tidak diketahui penerus Kemudian hanya dua yang dipulihkan, yang dapat dipercaya dan yang berkuasa oleh Tuhan {cite:muntazam-ibn-al-jawzi hlm. 351}"
