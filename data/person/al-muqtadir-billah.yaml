id: person/al-muqtadir-billah
class: person
label: { ar: "المقتدر بالله" }
summary:
  ar: "خليفة عباسي بويع سنة خمس وتسعين ومائتين، وخُلع في سنة ست وتسعين ومائتين، ثم أُعيد إلى الخلافة في سنة سبع عشرة وثلاثمائة، وقُتل في سنة عشرين وثلاثمائة {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}، وعند السيوطي ولد في رمضان سنة اثنتين وثمانين وأمه رومية اسمها شغب، ولم يل الخلافة قبله أصغر منه فإنه وليها وله ثلاث عشرة سنة، وخلع مرتين: في سنة ست لابن المعتز يوماً واحداً وفي سنة سبع عشرة لمؤنس للقاهر ثم رده الجند، وصار الأمر والنهي لحرمه لركاكته، وقال الذهبي اختل النظام كثيراً في أيامه لصغره {cite:tarikh-khulafa-minhaj-1434 p. 585-589}.، وعند المسعودي هو جعفر بن أحمد المكتفي يكنى أبا الفضل وأمه أم ولد يقال لها شغب، بويع في اليوم الذي توفي فيه أخوه يوم الأحد لثلاث عشرة ليلة خلت من ذي القعدة سنة خمس وتسعين ومائتين وله ثلاث عشرة سنة، وقتل ببغداد بعد صلاة العصر يوم الأربعاء لثلاث ليال بقين من شوال سنة عشرين وثلثمائة فكانت خلافته أربعاً وعشرين سنة وأحد عشر شهراً وستة عشر يوماً وبلغ من السن ثمانية وثلاثين سنة {cite:muruj-al-dhahab p. 648-649}"
