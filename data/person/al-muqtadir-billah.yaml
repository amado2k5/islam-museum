label: { ar: "المقتدر بالله", en: "al-Muqtadir bi'llah" }
summary:
  ar: "خليفة عباسي بويع سنة خمس وتسعين ومائتين، وخُلع في سنة ست وتسعين ومائتين، ثم أُعيد إلى الخلافة في سنة سبع عشرة وثلاثمائة، وقُتل في سنة عشرين وثلاثمائة {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}، وعند السيوطي ولد في رمضان سنة اثنتين وثمانين وأمه رومية اسمها شغب، ولم يل الخلافة قبله أصغر منه فإنه وليها وله ثلاث عشرة سنة، وخلع مرتين: في سنة ست لابن المعتز يوماً واحداً وفي سنة سبع عشرة لمؤنس للقاهر ثم رده الجند، وصار الأمر والنهي لحرمه لركاكته، وقال الذهبي اختل النظام كثيراً في أيامه لصغره {cite:tarikh-khulafa-minhaj-1434 p. 585-589}. وعند المسعودي هو جعفر بن أحمد المكتفي يكنى أبا الفضل وأمه أم ولد يقال لها شغب، بويع في اليوم الذي توفي فيه أخوه يوم الأحد لثلاث عشرة ليلة خلت من ذي القعدة سنة خمس وتسعين ومائتين وله ثلاث عشرة سنة، وقتل ببغداد بعد صلاة العصر يوم الأربعاء لثلاث ليال بقين من شوال سنة عشرين وثلثمائة فكانت خلافته أربعاً وعشرين سنة وأحد عشر شهراً وستة عشر يوماً وبلغ من السن ثمانية وثلاثين سنة {cite:muruj-al-dhahab p. 648-649}، وعند المسعودي استوزر بعد قتل العباس بن الحسن علي بن محمد بن الفرات ثلاث مرات أولاها سنة تسع وتسعين وثانيتها سنة أربع وثلثمائة وثالثتها وكان الغالب على الأمور ولده محسن، واستوزر محمد بن عبيد الله بن يحيى بن خاقان وعلي بن عيسى بن داود بن الجراح مرتين وحامد بن العباس وعبد الله بن محمد بن عبيد الله الخاقاني وأحمد بن عبيد الله الخصيبي وأبا علي محمد بن علي بن مقلة وسليمان بن الحسن بن مخلد وعبيد الله بن محمد الكلواذي والحسين بن القاسم الذي قتل بالرقة وآخرهم الفضل بن جعفر بن الفرات {cite:muruj-al-dhahab p. 660-661}، وعند ابن الأثير في خلع 317هـ أخرجوه ووالدته وخالته وخواص جواريه وأولاده من دار الخلافة إلى دار مؤنس، وقام إليه ابن حمدان يعاتبه وهو يدمع وكذلك المقتدر، وأودعوا كتاب خلعه عند القاضي أبي عمرو فكتمه فاستحسن ذلك منه بعد عودته وولاه القضاء {cite:kamil-ibn-al-athir p. 149-150}، وعند ابن الجوزي وفي سنة 302هـ أمر أن لا يستعان بأحد من اليهود والنصارى فألزموا بيوتهم وأخذوا بلبس القلانس والرقع وتكون ركبهم خشباً {cite:muntazam-ibn-al-jawzi p. 351}، وعند ابن الجوزي وظهر موت ابن المعتز في دار السلطان لليلتين خلتا من ربيع الآخر سنة 296هـ وأخرجه مؤنس إلى منزله ملفوفاً فسلمه إلى أهله فدفنوه في خراب بإزاء داره وأمر المقتدر بتغريق الجرائد في دجلة فكثر الشاكرون له ولا يعرف خليفة خلع ثم أعيد سوى اثنين الأمين والمقتدر بالله {cite:muntazam-ibn-al-jawzi p. 351}"
  en: "Abbasid caliph, hailed in 295 and deposed in 296, restored to the caliphate in 317 and killed in 320 {cite:tabari-tarikh-abu-al-fadl j.11 p.28} {cite:tabari-tarikh-abu-al-fadl j.11 p.31} {cite:tabari-tarikh-abu-al-fadl j.11 p.124} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. According to al-Suyuti he was born in Ramadan 282 to a Byzantine mother named Shaghab, and no caliph before him had been younger, since he took office at thirteen. He was deposed twice: for a single day in 296, in favour of Ibn al-Mu'tazz, and in 317, when Mu'nis moved to put al-Qahir in his place until the troops restored him; command and prohibition then passed to his womenfolk because of his frailty. Al-Dhahabi says order was greatly disrupted in his days because of his youth {cite:tarikh-khulafa-minhaj-1434 p. 585-589}. According to al-Mas'udi he was Ja'far ibn Ahmad al-Muktafi, known as Abu'l-Fadl, whose mother was an umm walad called Shaghab. He was hailed on the day his brother died, on the thirteenth night of Dhu'l-Qa'da 295, at thirteen years old, and was killed in Baghdad after the afternoon prayer on Wednesday, three nights before the end of Shawwal 320. His caliphate lasted twenty-four years, eleven months and sixteen days, and he was thirty-eight years old {cite:muruj-al-dhahab p. 648-649}. Also according to al-Mas'udi, after al-Abbas ibn al-Hasan was killed he appointed Ali ibn Muhammad ibn al-Furat as vizier three times: first in 299, then in 304, and the third time when his son Muhsin was the dominant force in affairs. He also appointed as vizier Muhammad ibn Ubayd Allah ibn Yahya ibn Khaqan; Ali ibn Isa ibn Dawud ibn al-Jarrah, twice; Hamid ibn al-Abbas; Abd Allah ibn Muhammad ibn Ubayd Allah al-Khaqani; Ahmad ibn Ubayd Allah al-Khusaybi; Abu Ali Muhammad ibn Ali ibn Muqla; Sulayman ibn al-Hasan ibn Makhlad; Ubayd Allah ibn Muhammad al-Kalwadhani; al-Husayn ibn al-Qasim, who was killed at Raqqa; and last of them al-Fadl ibn Ja'far ibn al-Furat {cite:muruj-al-dhahab p. 660-661}. According to Ibn al-Athir, in 317 they removed him from the palace, with his mother, his maternal aunt, his favourite concubines and his sons, to the house of Mu'nis. Ibn Hamdan came to rebuke him while he was weeping, and so did al-Muqtadir. They deposited the document of his deposition with Judge Abu Amr, who concealed it; this was approved of him after he returned, and he appointed him to the judgeship {cite:kamil-ibn-al-athir p. 149-150}. According to Ibn al-Jawzi, in 302 he ordered that Jews and Christians not be employed; they were confined to their houses, obliged to wear caps and patches, and their stirrups were made of wood {cite:muntazam-ibn-al-jawzi p. 351}. According to Ibn al-Jawzi, the death of Ibn al-Mu'tazz became known in the sultan's house two nights into Rabi' II 296; Mu'nis took him out to his home wrapped up and handed him to his family, who buried him in a ruin facing their house. Al-Muqtadir ordered the ledgers thrown into the Tigris, and many gave thanks to him for it. No caliph is known to have been deposed and then restored except two: al-Amin and al-Muqtadir bi'llah {cite:muntazam-ibn-al-jawzi p. 351}."
