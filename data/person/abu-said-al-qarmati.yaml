id: person/abu-said-al-qarmati
class: person
label: { ar: "أبو سعيد القرمطي" }
summary:
  ar: "ظهر بالبحرين سنة ست وثمانين وقويت شوكته وأغار على البصرة ونواحيها وهزم جيش الخليفة مرات وهو أبو أبي طاهر سليمان الذي يأتي أنه قلع الحجر الأسود {cite:tarikh-khulafa-minhaj-1434 p. 575}. وعند ابن الجوزي وفي هذه السنة ظهر رجل من القرامطة يكنى أبا سعيد فاجتمع إليه جماعة منهم الأعراب وكثر أصحابه وذلك في جمادى الآخرة سنة 287هـ وقوى أمره فقتل من حوله من أهل القرى ثم صار إلى القطيف وقيل إنه يريد البصرة فكتب أحمد بن محمد الواثقي إلى السلطان فكتب في عمل سور على البصرة فقدرت النفقة عليه أربعة عشر ألف دينار فبني وغلب أبو سعيد على هجر وأمن أهلها {cite:muntazam-ibn-al-jawzi p. 310} وعند ابن الجوزي ثب عليه سنة إحدى وثلاثمائة خادم له صقلابي فقتله، ثم دعا الخادم رجلًا من رؤساء أصحابه فقتله ثم آخر فقتله حتى دعا الخامس فرأى القتلى فصاح وأطلع النساء فصحن فقُبض على الخادم، وقد كان أبو سعيد عهد إلى ابنه سعيد فلم يضطلع بالأمر فغلبه عليه أخوه الأصغر أبو طاهر {cite:muntazam-ibn-al-jawzi p. 412-413}."
  en: "The Qarmati chief who rose in Bahrayn in 286, raided Basra and beat the caliph's armies — father of Abu Tahir Sulayman who would wrench out the Black Stone {cite:tarikh-khulafa-minhaj-1434 p. 575}."
