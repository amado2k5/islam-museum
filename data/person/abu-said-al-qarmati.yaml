id: person/abu-said-al-qarmati
class: person
label: { ar: "أبو سعيد القرمطي", en: "Abu Sa'id al-Qarmati", fr: "Abu Sa'id al-Qarmati", es: "Abu Sa'id al-Qarmati", ur: "ابو سعید القرمتی" }
summary:
  ar: "ظهر بالبحرين سنة ست وثمانين وقويت شوكته وأغار على البصرة ونواحيها وهزم جيش الخليفة مرات وهو أبو أبي طاهر سليمان الذي يأتي أنه قلع الحجر الأسود {cite:tarikh-khulafa-minhaj-1434 p. 575}. وعند ابن الجوزي وفي هذه السنة ظهر رجل من القرامطة يكنى أبا سعيد فاجتمع إليه جماعة منهم الأعراب وكثر أصحابه وذلك في جمادى الآخرة سنة 287هـ وقوى أمره فقتل من حوله من أهل القرى ثم صار إلى القطيف وقيل إنه يريد البصرة فكتب أحمد بن محمد الواثقي إلى السلطان فكتب في عمل سور على البصرة فقدرت النفقة عليه أربعة عشر ألف دينار فبني وغلب أبو سعيد على هجر وأمن أهلها {cite:muntazam-ibn-al-jawzi p. 310} وعند ابن الجوزي ثب عليه سنة إحدى وثلاثمائة خادم له صقلابي فقتله، ثم دعا الخادم رجلًا من رؤساء أصحابه فقتله ثم آخر فقتله حتى دعا الخامس فرأى القتلى فصاح وأطلع النساء فصحن فقُبض على الخادم، وقد كان أبو سعيد عهد إلى ابنه سعيد فلم يضطلع بالأمر فغلبه عليه أخوه الأصغر أبو طاهر {cite:muntazam-ibn-al-jawzi p. 412-413}. "
  en: "The Qarmati chief who rose in Bahrayn in 286, raided Basra and beat the caliph's armies — father of Abu Tahir Sulayman who would wrench out the Black Stone {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  fr: "Le chef qarmate qui se souleva au Bahreïn en 286, lança des raids sur Bassora et battit les armées du calife ; père d'Abu Tahir Sulayman, qui arracherait la Pierre noire {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  es: "El jefe Qarmati que se alzó en Bahrayn en 286, saqueó Basora y derrotó a los ejércitos del califa, padre de Abu Tahir Sulayman, quien arrebataría la Piedra Negra {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  ur: "قرماتی سردار جو 286 میں بحرین میں طلوع ہوا، اس نے بصرہ پر چڑھائی کی اور خلیفہ کی فوجوں کو شکست دی - ابو طاہر سلیمان کے والد جو حجر اسود کو خاک میں ملا دیں گے۔ 575}۔"
  tr: "Hicri 86 yılında Bahreyn'de ortaya çıktı ve gücü arttı. Basra ve çevresine baskınlar düzenledi ve halifenin ordusunu birkaç kez mağlup etti. Kara Taşı yerinden söktüğü söylenen Ebu Tahir Süleyman'ın babasıydı. İbn el-Cevzi'ye göre, bu yıl Karmatilerden Ebu Sa'id adında bir adam ortaya çıktı. Bedeviler de dahil olmak üzere bir grup insan onun etrafında toplandı ve takipçileri arttı. Bu, Hicri 287 yılının Cemâde-i Ahiret ayında oldu. Gücü arttı ve çevresindeki köylerden insanları öldürdü. Sonra Katif'e gitti ve Basra'ya gitmeyi planladığı söylendi. Ahmed ibn Muhammed el-Vathiki, Sultan'a yazdı ve Sultan, Basra'nın etrafına bir sur inşa edilmesini emretti. Maliyeti on dört bin dinar olarak tahmin edildi ve sur inşa edildi. Ebu Said, Hacer'i fethetti ve halkına güvenlik sağladı. {Kaynak: Muntazam-ibn-al-Jawzi, s. 310} İbn el-Jawzi'ye göre, 301 yılında, Saklabî bir hizmetkarı ona saldırdı ve onu öldürdü. Sonra hizmetkar, baş arkadaşlarından birini çağırdı ve onu öldürdü, sonra bir diğerini çağırdı ve onu da öldürdü, ta ki beşinciyi çağırana kadar. Ölüleri görünce bağırdı ve kadınlar da dışarı çıkıp bağırdılar, böylece hizmetkar tutuklandı. Ebu Said, meseleyi oğlu Said'e emanet etmişti, ancak Said sorumluluğu üstlenmedi, bu yüzden küçük kardeşi Ebu Tahir onu alt etti. {Kaynak: Muntazam-ibn-al-Jawzi, s. 412-413}"
  id: "Ia muncul di Bahrain pada tahun 86 H, dan kekuasaannya semakin bertambah. Ia menyerbu Basra dan daerah sekitarnya serta mengalahkan pasukan Khalifah beberapa kali. Ia adalah ayah dari Abu Tahir Sulayman, yang konon telah memindahkan Batu Hitam {cite:tarikh-khulafa-minhaj-1434 p. 575}. Menurut Ibn al-Jawzi, pada tahun ini seorang pria dari suku Qarmatian, yang dikenal sebagai Abu Sa'id, muncul. Sekelompok orang, termasuk suku Badui, berkumpul di sekitarnya, dan pengikutnya bertambah. Ini terjadi pada Jumada al-Akhirah tahun 287 H. Kekuasaannya bertambah, dan ia membunuh orang-orang di sekitarnya dari desa-desa. Kemudian ia pergi ke Qatif, dan dikatakan bahwa ia bermaksud pergi ke Basra. Ahmad ibn Muhammad al-Wathiqi menulis surat kepada Sultan, yang memerintahkan pembangunan tembok di sekitar Basra. Biayanya diperkirakan empat belas ribu dinar, sehingga tembok itu dibangun. Abu Sa'id menaklukkan Hajar dan memberikan keamanan kepada penduduknya {kutip:muntazam-ibn-al-jawzi hlm. 310}. Menurut Ibn al-Jawzi, pada tahun 301, seorang pelayan Saqlabi menyerangnya dan membunuhnya. Kemudian pelayan itu memanggil salah satu sahabat utamanya dan membunuhnya, lalu yang lain dan membunuhnya, hingga ia memanggil yang kelima. Ia melihat orang mati itu dan berteriak, dan para wanita keluar dan berteriak, sehingga pelayan itu ditangkap. Abu Saeed telah mempercayakan masalah itu kepada putranya Saeed, tetapi ia tidak menanganinya, sehingga adik laki-lakinya Abu Tahir mengalahkannya. {kutip:muntazam-ibn-al-jawzi hlm. 412-413}."
