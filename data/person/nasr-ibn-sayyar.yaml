id: person/nasr-ibn-sayyar
class: person
label: { ar: "نصر بن سيار" }
summary:
  ar: "كان بخراسان في أيامها المفتونة سنة ثمان وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.348}، وذكر الطبري موته في سنة إحدى وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.403}. وسير سلم بن أحوز المازني إلى يحيى بن زيد بالجوزجان فقتله {cite:muruj-al-dhahab p. 200}، وعند المسعودي لما ضعف أمره لعدم النجدة خرج عن خراسان حتى أتى الري ثم نزل ساوة فمات بها كمداً، وكان كتب إلى مروان يصف خروجه والأمر الذي أزعجه سينمو حتى يملأ البلاد وأنشد إنا وما نكتم من أمرنا كالثور إذ قرب للناخع، كنا نرفيها فقد مزقت واتسع الخرق على الراقع {cite:muruj-al-dhahab p. 229-230} ويذكر الكتاب أن هشاماً عيّنه والياً على خراسان في رجب سنة 120هـ، ووصفه بأنه أرجل القوم وأحزمهم وأعلمهم بالسياسة، وأنه أنجز أعمالاً في المجالين المالي والحربي، واستمرت ولايته إلى نهاية الدولة الأموية. {cite:salabi-umayyad-state-2020 p.483}"
  tr: "Yüz yirmi sekiz yılın zorlu günlerinde Horasan'daydı {cite:tabari-tarikh-abu-al-fadl j.7 s.348} ve al-Tabari, 131 yılında ölümünü belirtmiştir {cite:tabari-tarikh-abu-al-fadl j.7 s.403}. Salm ibn Ahwaz al-Mazni, el-Cevzcan'da Yahya ibn Zayd'e gitti ve onu öldürdü {alıntı:Muruj-al-Dhahab s. 200}. El-Mes'udi'ye göre, yardım eksikliği nedeniyle durumu zayıflayınca Horasan'dan ayrıldı, sonra Rayy'e ulaştı, sonra Sawa'ya yerleşti ve orada acı içinde öldü. Mervan'a ayrılışını ve toprağı doldurana kadar büyüyeceğini anlatan bir mektup yazdı. Şöyle dedi: 'Biz ve sakladığımız şey, nakh'a yaklaşan bir öküz gibidir.' Ondan korkardık, çünkü yırtılardı ve pırtıllar zincirlerin üzerine yayıldı {atıf:Muruj-al-Dhahab s. 229-230}. Kitap, Hisam'ın onu 120 Hicri Rajab'da Horasan valisi olarak atadığını, onu halkın en cesur, en kararlı ve en bilgili üyesi olarak tanımlar; hem mali hem de askeri işlerde başarılar elde etmiş ve yönetimi Emevi devletinin sonuna kadar devam etmiştir. {cite:Salabi-Umayyad-State-2020 s.483}"
  id: "Ia berada di Khorasan pada hari-hari yang menggoda di tahun seratus dua puluh delapan {cite:tabari-tarikh-abu-al-fadl j.7 hlm.348}, dan al-Tabari menyebutkan kematiannya pada tahun seratus tiga puluh satu {cite:tabari-tarikh-abu-al-fadl j.7 hlm.403}. Salm ibn Ahwaz al-Mazni pergi kepada Yahya ibn Zayd di al-Jawzjan dan membunuhnya {cite:Muruj-al-Dhahab hlm. 200}. Menurut al-Mas'udi, ketika keadaannya melemah karena kurangnya bantuan, ia meninggalkan Khurasan hingga tiba di Rayy, lalu menetap di Sawa dan meninggal di sana dalam kesusahan. Ia menulis kepada Marwan menggambarkan kepergiannya dan fakta bahwa ia akan tumbuh hingga memenuhi tanah. Ia mengucapkan: 'Kami dan apa yang kami sembunyikan seperti sapi yang mendekati nakh'. Kami dulu takut padanya, karena sapi itu robek dan kain compang-camping melebar di atas belenggu {cite:muruj-al-dhahab hlm. 229-230}. Buku tersebut menyebutkan bahwa Hisham mengangkatnya sebagai gubernur Khorasan pada Rajab 120 H, menggambarkannya sebagai yang paling berani, paling tegas, dan paling berpengetahuan di antara rakyat, mencapai prestasi baik dalam urusan keuangan maupun militer, dan pemerintahannya berlanjut hingga akhir negara Umayyah. {cite:salabi-umayyad-state-2020 hlm.483}"
