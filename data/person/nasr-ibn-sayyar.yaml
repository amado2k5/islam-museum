id: person/nasr-ibn-sayyar
class: person
label: { ar: "نصر بن سيار" }
summary:
  ar: "كان بخراسان في أيامها المفتونة سنة ثمان وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.348}، وذكر الطبري موته في سنة إحدى وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.403}. وسير سلم بن أحوز المازني إلى يحيى بن زيد بالجوزجان فقتله {cite:muruj-al-dhahab p. 200}، وعند المسعودي لما ضعف أمره لعدم النجدة خرج عن خراسان حتى أتى الري ثم نزل ساوة فمات بها كمداً، وكان كتب إلى مروان يصف خروجه والأمر الذي أزعجه سينمو حتى يملأ البلاد وأنشد إنا وما نكتم من أمرنا كالثور إذ قرب للناخع، كنا نرفيها فقد مزقت واتسع الخرق على الراقع {cite:muruj-al-dhahab p. 229-230} ويذكر الكتاب أن هشاماً عيّنه والياً على خراسان في رجب سنة 120هـ، ووصفه بأنه أرجل القوم وأحزمهم وأعلمهم بالسياسة، وأنه أنجز أعمالاً في المجالين المالي والحربي، واستمرت ولايته إلى نهاية الدولة الأموية. {cite:salabi-umayyad-state-2020 p.483}"
