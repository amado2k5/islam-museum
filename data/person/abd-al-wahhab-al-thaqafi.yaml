  ar: "عبد الوهاب بن عطاء الخفاف الثقفي، أبو نصر، من علماء البصرة ومحدثيها، تلميذ أبي عمرو بن العلاء؛ توفي في أواخر سنة أربع ومئتين هجرية {cite:tazkirat-al-huffaz j.2 p.313-314}."
  en: "Abd al-Wahhab ibn 'Ata' al-Khaffaf al-Thaqafi, Abu Nasr, a Basran scholar and traditionist, pupil of Abu 'Amr ibn al-'Ala', died late in 204 AH {cite:tazkirat-al-huffaz j.2 p.313-314}."
  fr: "Abd al-Wahhab ibn 'Ata' al-Khaffaf al-Thaqafi, Abu Nasr, savant et traditionniste de Bassora, élève d'Abu 'Amr ibn al-'Ala', mort à la fin de 204 H {cite:tazkirat-al-huffaz j.2 p.313-314}."
  es: "Abd al-Wahhab ibn 'Ata' al-Khaffaf al-Thaqafi, Abu Nasr, un erudito y tradicionalista de Basran, alumno de Abu 'Amr ibn al-'Ala', murió a finales del año 204 d.H. {cita:tazkirat-al-huffaz j.2 p.313-314}."
  ur: "عبد الوہاب بن عطاء الخفاف الثقفی، ابو نصر، بصری عالم اور روایت دان، ابو عمرو بن العلاء کے شاگرد، مرحوم کا انتقال 204 ہجری میں ہوا۔"
