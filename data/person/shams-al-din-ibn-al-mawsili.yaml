summary: {ar: 'محمد بن محمد البعلي، شمس الدين، ابن الموصلي: أديب وعالم بالفقه، ولد في بعلبك وتعلم بها وبدمشق وحماة ومات بطرابلس، ٦٩٩ إلى ٧٧٤ هـ الموافقة ١٣٠٠ إلى ١٣٧٢ م، من كتبه «بهجة المجالس».', en: 'Muhammad ibn Muhammad al-Ba''li, Shams al-Din, Ibn al-Mawsili: a littérateur and scholar of jurisprudence, born in Baalbek, who studied there, in Damascus and in Hama and died in Tripoli, 699 to 774 AH (1300 to 1372 CE); among his books is «Bahjat al-Majalis».', es: "Muhammad ibn Muhammad al-Ba'li, Shams al-Din, Ibn al-Mawsili: literato y erudito en jurisprudencia, nacido en Baalbek, donde estudió, en Damasco y en Hama, y fallecido en Trípoli, entre 699 y 774 AH (1300 y 1372 d. C.); entre sus obras se encuentra «Bahjat al-Majalis».", fr: "Muhammad ibn Muhammad al-Ba'li, Shams al-Din, Ibn al-Mawsili: un littérateur et érudit en jurisprudence, né à Baalbek, qui y étudia, à Damas et à Hama et mourut à Tripoli, de 699 à 774 AH (1300 à 1372 CE); parmi ses livres figure « Bahjat al-Majalis ».", ur: "محمد بن محمد البعلی، شمس الدین، ابن الموسیلی: ایک ادیب اور فقہ کا عالم، بعلبیک میں پیدا ہوا، جس نے وہاں دمشق اور حما میں تعلیم حاصل کی اور طرابلس میں وفات پائی، 699 تا 774 ہجری ⁦(1300 تا 1372 عیسوی)⁩؛ ان کی کتابوں میں \"بہجت المجالس\" ہے۔"}
