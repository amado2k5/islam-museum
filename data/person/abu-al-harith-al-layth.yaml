summary:
  ar: "أبو الحارث الليث بن خالد البغدادي، راوي قراءة الكسائي؛ توفي سنة 240هـ، وقال ابن الجزري إنه ثقة قيّم بالقراءة ضابط محقق، ونقل عن الداني أنه من جلة أصحاب الكسائي {cite:nashr-dahman-damascus-1345-v1 p. 183}."
  en: "Abu al-Harith al-Layth ibn Khalid of Baghdad, transmitter of the reading of al-Kisa'i; he died in 240 AH. Ibn al-Jazari calls him reliable, a firm upholder of the reading, exact and a verifier, and quotes al-Dani that he was among the leading companions of al-Kisa'i {cite:nashr-dahman-damascus-1345-v1 p. 183}."
  ur: "ابو الحارث لیث بن خالد بغدادی، کسائی کی قراءت کے راوی؛ 240ھ میں فوت ہوئے۔ ابن الجزری انہیں ثقہ، قراءت پر قائم، ضابط اور محقق کہتے ہیں اور دانی سے نقل کرتے ہیں کہ وہ کسائی کے بڑے ساتھیوں میں سے تھے {cite:nashr-dahman-damascus-1345-v1 p. 183}."
  fr: "Abu al-Harith al-Layth ibn Khalid de Bagdad, transmetteur de la lecture d'al-Kisa'i ; il mourut en 240 H. Ibn al-Jazari le dit fiable, ferme dans la lecture, exact et vérificateur, et cite al-Dani selon qui il était parmi les principaux compagnons d'al-Kisa'i {cite:nashr-dahman-damascus-1345-v1 p. 183}."
  es: "Abu al-Harith al-Layth ibn Khalid de Bagdad, transmisor de la lectura de al-Kisa'i; murió en el año 240 de la Hégira. Ibn al-Jazari lo describe como fiable, un firme defensor de la lectura, exacto y verificador, y cita a al-Dani diciendo que fue uno de los principales compañeros de al-Kisa'i {cite:nashr-dahman-damascus-1345-v1 p. 183}."
  tr: "Kisaî'nin kıraatini rivayet eden Ebu el-Harit el-Leyth ibn Halid el-Bağdadi, Hicri 240 yılında vefat etmiştir. İbn el-Cezari, onun güvenilir, kıraatinde sağlam, doğru ve doğrulanmış bir rivayetçi olduğunu söylemiştir. El-Dani'nin, Kisaî'nin en seçkin arkadaşlarından biri olduğunu söylediğini aktarmıştır. {cite:nashr-dahman-damascus-1345-v1 s. 183}"
  id: "Abu al-Harith al-Layth ibn Khalid al-Baghdadi, perawi bacaan al-Kisa’i; beliau wafat pada tahun 240 H. Ibn al-Jazari mengatakan bahwa beliau dapat dipercaya, akurat dalam bacaan, dan terverifikasi. Beliau mengutip al-Dani yang mengatakan bahwa beliau adalah salah satu sahabat al-Kisa’i yang paling terkemuka. {cite:nashr-dahman-damascus-1345-v1 p. 183}."
