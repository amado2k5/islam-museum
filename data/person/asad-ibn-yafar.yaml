summary:
  ar: "أسعد بن يعفر صاحب قلعة كحلان النازل بها وصاحب مخاليف اليمن سنة ٣٣٢هـ وهو المعظم فيها، أراد أن يبني غمدان فأشار عليه يحيى بن الحسين الحسني ألا يتعرض لذلك إذ بناؤه على يدي غلام يخرج من أرض سبأ ومأرب {cite:muruj-al-dhahab p. 540}."
  en: "Lord of Kahlan castle and Yemen's mikhlafs in 332 AH, the dominant power there — dissuaded by Yahya ibn al-Husayn from rebuilding Ghumdan, destined for a Sabaean youth {cite:muruj-al-dhahab p. 540}."
  es: "Señor del castillo de Kahlan y de los mikhlafs de Yemen en el año 332 de la Hégira, el poder dominante allí, disuadido por Yahya ibn al-Husayn de reconstruir Ghumdan, destinado a un joven sabeo {cite:muruj-al-dhahab p. 540}."
  fr: "Seigneur du château de Kahlan et des mikhlafs du Yémen en 332 AH, la puissance dominante là-bas — dissuadé par Yahya ibn al-Husayn de reconstruire Ghumdan, destiné à un jeune Sabéen {cite:muruj-al-dhahab p. 540}."
  ur: "332 ہجری میں قلعہ کہلان اور یمن کے مکلفوں کا مالک، وہاں کی غالب طاقت - یحییٰ بن الحسین نے غمدان کی تعمیر نو سے روکا، جو ایک صابی نوجوان کے لیے مقدر تھا۔ 540}۔"
