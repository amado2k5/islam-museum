  ar: "سعد الدولة أبو المعالي شريف بن سيف الدولة الحمداني؛ ملك بعد أبيه وطالت مدته في المملكة؛ وعرض له قولنج فأشفى منه على التلف وأفقد البصيرة فدخل عليه طبيبه فأمر أن يُسجر عنده الند والعنبر فأفاق قليلاً فقال له الطبيب: أرني نبضك فناوله يده اليسرى فقال: أريد اليمين فقال: ما تركت لي اليمين يميناً — وكان قد حلف وغدر {cite:wafayat-ayan}."
  en: "Sa'd al-Dawla Abu al-Ma'ali Sharif b. Sayf al-Dawla (d. Ramadan 381, aged 40) — second and last effective Hamdanid ruler of Aleppo; blinded by colic on his deathbed, he refused his left wrist to the physician: 'I left no oath unbroken on my right' {cite:wafayat-ayan}."
