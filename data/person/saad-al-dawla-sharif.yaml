summary:
  ar: "سعد الدولة أبو المعالي شريف بن سيف الدولة الحمداني؛ ملك بعد أبيه وطالت مدته في المملكة؛ وعرض له قولنج فأشفى منه على التلف وأفقد البصيرة فدخل عليه طبيبه فأمر أن يُسجر عنده الند والعنبر فأفاق قليلاً فقال له الطبيب: أرني نبضك فناوله يده اليسرى فقال: أريد اليمين فقال: ما تركت لي اليمين يميناً — وكان قد حلف وغدر {cite:wafayat-ayan}."
  en: "Sa'd al-Dawla Abu al-Ma'ali Sharif b. Sayf al-Dawla (d. Ramadan 381, aged 40) — second and last effective Hamdanid ruler of Aleppo; blinded by colic on his deathbed, he refused his left wrist to the physician: 'I left no oath unbroken on my right' {cite:wafayat-ayan}."
  es: "Sa'd al-Dawla Abu al-Ma'ali Sharif b. Sayf al-Dawla (m. Ramadán 381, de 40 años) — segundo y último gobernante efectivo hamdaní de Alepo; cegado por un cólico en su lecho de muerte, se negó a que el médico le operara la muñeca izquierda: 'No dejé ningún juramento sin romper en mi derecha' {cite:wafayat-ayan}."
  fr: "Sa'd al-Dawla Abu al-Ma'ali Sharif b. Sayf al-Dawla (d. Ramadan 381, à l'âge de 40 ans) — deuxième et dernier dirigeant hamdanide effectif d'Alep; aveuglé par une colique sur son lit de mort, il refusa son poignet gauche au médecin: « Je n'ai laissé aucun serment intact sur mon poignet droit » {cite:wafayat-ayan}."
  ur: "سعد الدولہ ابو المعالی شریف بی۔ سیف الدولہ ⁦(متوفی رمضان 381، عمر 40)⁩ - حلب کا دوسرا اور آخری مؤثر ہمدانی حکمران؛ بستر مرگ پر درد کی وجہ سے اندھا ہو کر، اس نے اپنی بائیں کلائی طبیب کو دینے سے انکار کر دیا: 'میں نے اپنے دائیں طرف کوئی حلف نہیں چھوڑا'۔"
