  ar: "سلمى الخضراء الجيوسي ⁦(1925–2023)⁩ شاعرة وناقدة ومترجمة فلسطينية، مؤسِّسة مشروع PROTA الذي نقل الأدب العربي الحديث إلى الإنجليزية. من مؤلفاتها «الاتجاهات والحركات في الشعر العربي الحديث» وأنطولوجيا الشعر العربي الحديث بالإنجليزية."
  en: "Salma Khadra Jayyusi (1925–2023) was a Palestinian poet, critic and translator, founder of PROTA (Project of Translation from Arabic), which carried modern Arabic literature to a global English readership. Her works include Trends and Movements in Modern Arabic Poetry and the anthology Modern Arabic Poetry."
  ur: "سلمیٰ الخضراء الجیوسی ⁦(1925–2023)⁩ فلسطینی شاعرہ، ناقد اور مترجم تھیں، PROTA ⁦(عربی سے ترجمے کا منصوبہ)⁩ کی بانی جس نے جدید عربی ادب کو عالمی انگریزی قاری تک پہنچایا۔ ان کی تصانیف میں جدید عربی شاعری کے رجحانات اور جدید عربی شاعری کی انتھولوجی شامل ہیں۔"
