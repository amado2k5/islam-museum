label: { ar: "أرسطاطاليس", en: "Aristutalis", es: "Aristutalis", fr: "Aristutalis" }
summary:
  ar: "أرسطاطاليس بن نيقوماخوس، أخذ عن أفلاطون وخلفه، وعنه نقل أصحابه ثاوفرسطس وأوديمس وهرمينوس وجاونيوس وإيامليخس والإسكندر وثامسطيوس وفرفوريوس وسنبليقوس وسوريانوس ومكسيموس وأراسيس ولوقيس ونيقسطراطس وفلوطينس، ونقلت كتبه في المنطق والطبيعيات والإلهيات إلى العربية ففسرها الإسكندر الأفروديسي وثامسطيوس ويحيى النحوي وأمونيوس وقويري وأبو بشر متى والفارابي والكندي وغيرهم {cite:fihrist-ibn-al-nadim p. 343-357}."
  en: "Aristotle — whose organon Ibn al-Nadim catalogues commentary by commentary {cite:fihrist-ibn-al-nadim}"
  es: "Aristóteles — cuyo organón Ibn al-Nadim cataloga comentario por comentario {cite:fihrist-ibn-al-nadim}"
  fr: "Aristote — dont l'organon d'Ibn al-Nadim catalogue les commentaires les uns après les autres {cite:fihrist-ibn-al-nadim}"
  ur: "ارسطو - جس کا اعضاء ابن الندیم تفسیر کے لحاظ سے کیٹلاگ کرتا ہے۔"
  tr: "Nicomachus'un oğlu Aristoteles, Platon ve haleflerinin yanında eğitim aldı ve ondan arkadaşları Theophrastus, Odemus, Herminius, Gaonius, Iamelichus, İskender, Thamestius, Porphorius, Synaplicus, Syrianus, Maximus, Arasis, Lucius, Nicuscrates ve Plotinus ondan aktarıldı. Mantık, doğa bilimleri ve teoloji üzerine kitapları Arapçaya, Afrodit İskender, Thamastius, dilbilgisi Yahya, Ammonius, Quyri, Abu Bishr Mata, Al-Farabi, Al-Kindi ve diğerleri tarafından aktarıldı {atıf:Fihrist-ibn-al-nadim s. 343-357}."
  id: "Aristoteles, putra Nicomachus, belajar di bawah Plato dan penerusnya, dan dari dia rekan-rekannya Theophrastus, Odemus, Herminius, Gaonius, Iamelichus, Alexander, Thamestius, Porphorius, Synaplicus, Syrianus, Maximus, Arasis, Lucius, Nicuscrates, dan Plotinus diteruskan darinya. Buku-bukunya tentang logika, ilmu alam, dan teologi diterjemahkan ke dalam bahasa Arab, dan Alexander Aphrodite, Thamastius, Yahya si ahli tata bahasa, Ammonius, Quyri, Abu Bishr Mata, Al-Farabi, Al-Kindi, dan lainnya {cite:fihrist-ibn-al-nadim hlm. 343-357}."
