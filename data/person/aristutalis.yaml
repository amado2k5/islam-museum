label: { ar: "أرسطاطاليس", en: "Aristutalis" }
summary:
  ar: "أرسطاطاليس بن نيقوماخوس، أخذ عن أفلاطون وخلفه، وعنه نقل أصحابه ثاوفرسطس وأوديمس وهرمينوس وجاونيوس وإيامليخس والإسكندر وثامسطيوس وفرفوريوس وسنبليقوس وسوريانوس ومكسيموس وأراسيس ولوقيس ونيقسطراطس وفلوطينس، ونقلت كتبه في المنطق والطبيعيات والإلهيات إلى العربية ففسرها الإسكندر الأفروديسي وثامسطيوس ويحيى النحوي وأمونيوس وقويري وأبو بشر متى والفارابي والكندي وغيرهم {cite:fihrist-ibn-al-nadim p. 343-357}."
  en: "Aristotle — whose organon Ibn al-Nadim catalogues commentary by commentary {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
