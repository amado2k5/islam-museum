summary:
  ar: "الحافظ زين الدين أبو الفضل عبد الرحيم بن الحسين العراقي، كردي الأصل من رازنان، وُلد في 21 جمادى الأولى سنة 725 بالمنشية بين مصر والقاهرة {cite:daw-lami-jil-1992 4/171}؛ صاحب الألفية في علوم الحديث وشرحها و«المغني» في تخريج أحاديث الإحياء {cite:daw-lami-jil-1992 4/173}، ولي قضاء المدينة وخطابتها سنة 788 وابتدأ الإملاء بالقاهرة سنة 795 {cite:daw-lami-jil-1992 4/174}، ومات بالقاهرة في شعبان سنة 806 {cite:daw-lami-jil-1992 4/177}."
  en: "The hadith master Zayn al-Din Abu al-Fadl 'Abd al-Rahim ibn al-Husayn al-'Iraqi, of Kurdish origin from Raznan, born 21 Jumada I 725 at al-Munshiyya between Fustat and Cairo {cite:daw-lami-jil-1992 4/171}; author of the Alfiyya on the hadith sciences with its commentary and of al-Mughni on the hadiths of the Ihya' {cite:daw-lami-jil-1992 4/173}; judge and preacher of Medina from 788 and dictation teacher in Cairo from 795 {cite:daw-lami-jil-1992 4/174}; died in Cairo in Sha'ban 806 {cite:daw-lami-jil-1992 4/177}."
  fr: "Le maître du hadith Zayn al-Din Abu al-Fadl 'Abd al-Rahim ibn al-Husayn al-'Iraqi, d'origine kurde de Raznan, né le 21 jumada I 725 à al-Munshiyya entre Fustat et Le Caire {cite:daw-lami-jil-1992 4/171} ; auteur de l'Alfiyya sur les sciences du hadith avec son commentaire et d'al-Mughni sur les hadiths de l'Ihya' {cite:daw-lami-jil-1992 4/173} ; cadi et prédicateur de Médine à partir de 788 et maître de dictée au Caire à partir de 795 {cite:daw-lami-jil-1992 4/174} ; mort au Caire en sha'ban 806 {cite:daw-lami-jil-1992 4/177}."
  es: "El maestro de hadices Zayn al-Din Abu al-Fadl 'Abd al-Rahim ibn al-Husayn al-'Iraqi, de origen kurdo de Raznan, nació el 21 de Jumada I de 725 en al-Munshiyya entre Fustat y El Cairo {cite:daw-lami-jil-1992 4/171}; autor de la Alfiyya sobre las ciencias del hadiz con su comentario y de al-Mughni sobre los hadices de los Ihya' {cite:daw-lami-jil-1992 4/173}; juez y predicador de Medina desde 788 y maestro de dictado en El Cairo desde 795 {cite:daw-lami-jil-1992 4/174}; murió en El Cairo en Sha'ban de 806 {cite:daw-lami-jil-1992 4/177}."
  ur: "محدث زین الدین ابو الفضل عبد الرحیم ابن الحسین العراقی، کرد نژاد، رزان سے، 21 جمادی الثانی 725 کو فوستات اور قاہرہ کے درمیان المنشیاء میں پیدا ہوئے۔ حدیث کے علوم پر الفیہ کے مصنف اس کی تفسیر کے ساتھ اور احادیث احادیث پر المغنی کے مصنف۔ 788 سے مدینہ کا قاضی اور مبلغ اور 795 سے قاہرہ میں ڈکٹیشن ٹیچر قاہرہ میں شعبان 806 میں وفات پائی۔"
  tr: "Kürt kökenli Raznanlı El-Hafız Zeyneddin Ebu el-Fadl Abdurrahim ibn el-Hüseyin el-Iraki, 725 yılının Cemâdetü'l-Ula ayının 21'inde Mısır ile Kahire arasındaki el-Manşiyye'de doğmuştur {cite:daw-lami-jil-1992 4/171}; Hadis ilimleri ve tefsirinde \"El-Alfiyye\" ve İhya hadislerinin tasdikinde \"El-Muğni\" adlı eserlerin yazarıdır {cite:daw-lami-jil-1992 4/173} ve 788 yılında Medine'ye kadı ve vaiz olarak atanmış, 795 yılında Kahire'de dikte etmeye başlamıştır {cite:daw-lami-jil-1992 4/174} ve 806 yılında Şaban ayında Kahire'de vefat etmiştir {cite:daw-lami-jil-1992 4/177}."
  id: "Al-Hafiz Zayn al-Din Abu al-Fadl Abd al-Rahim ibn al-Husayn al-Iraqi, asal Kurdi dari Raznan, lahir pada tanggal 21 Jumada al-Ula tahun 725 di al-Manshiyya antara Mesir dan Kairo {cite:daw-lami-jil-1992 4/171}; Beliau adalah penulis kitab Al-Alfiyya dalam ilmu Hadits dan penjelasannya serta kitab “Al-Mughni” dalam otentikasi Hadits Ihya’ {cite:daw-lami-jil-1992 4/173}, dan beliau diangkat menjadi hakim Madinah dan pendakwah pada tahun 788 dan beliau mulai berdakwah di Kairo pada tahun 795 {cite:daw-lami-jil-1992 4/174}, dan beliau wafat di Kairo pada bulan Sya’ban tahun 806 {cite:daw-lami-jil-1992 4/177}."
