summary:
  ar: "الحافظ زين الدين أبو الفضل عبد الرحيم بن الحسين العراقي، كردي الأصل من رازنان، وُلد في 21 جمادى الأولى سنة 725 بالمنشية بين مصر والقاهرة {cite:daw-lami-jil-1992 4/171}؛ صاحب الألفية في علوم الحديث وشرحها و«المغني» في تخريج أحاديث الإحياء {cite:daw-lami-jil-1992 4/173}، ولي قضاء المدينة وخطابتها سنة 788 وابتدأ الإملاء بالقاهرة سنة 795 {cite:daw-lami-jil-1992 4/174}، ومات بالقاهرة في شعبان سنة 806 {cite:daw-lami-jil-1992 4/177}."
  en: "The hadith master Zayn al-Din Abu al-Fadl 'Abd al-Rahim ibn al-Husayn al-'Iraqi, of Kurdish origin from Raznan, born 21 Jumada I 725 at al-Munshiyya between Fustat and Cairo {cite:daw-lami-jil-1992 4/171}; author of the Alfiyya on the hadith sciences with its commentary and of al-Mughni on the hadiths of the Ihya' {cite:daw-lami-jil-1992 4/173}; judge and preacher of Medina from 788 and dictation teacher in Cairo from 795 {cite:daw-lami-jil-1992 4/174}; died in Cairo in Sha'ban 806 {cite:daw-lami-jil-1992 4/177}."
