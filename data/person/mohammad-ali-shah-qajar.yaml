summary:
  ar: "الشاه السادس من الأسرة القاجارية في إيران (حكم من 3 يناير 1907 إلى 16 يوليو 1909)، ابن مظفر الدين شاه وحفيد أمير كبير من جهة أمه تاج الملك. حلّ المجلس النيابي الجديد وقصفه في يونيو 1908 بعد أن أعلن الدستور مخالفًا للشريعة؛ فخلعته القوات الدستورية في يوليو 1909 ونصّبت ابنه أحمد شاه مكانه. مات في المنفى بسان ريمو سنة 1925."
  en: "Sixth shah of Qajar Iran (reigned 3 January 1907 – 16 July 1909), son of Mozaffar ad-Din Shah and, through his mother Taj ol-Molouk, a grandson of the reforming minister Amir Kabir. He dissolved the new Majles and had it bombarded in June 1908 after declaring the constitution contrary to Islamic law; constitutionalist forces deposed him in July 1909 and placed his son Ahmad Shah on the throne. He died in exile at San Remo in 1925."
  ur: "قاجاری ایران کے چھٹے شاہ (دورِ حکومت 3 جنوری 1907 تا 16 جولائی 1909)؛ مظفر الدین شاہ کے بیٹے اور اپنی والدہ تاج الملوک کی طرف سے مصلح وزیر امیر کبیر کے نواسے۔ انہوں نے آئین کو شریعت کے خلاف قرار دے کر نئی مجلس کو تحلیل کیا اور جون 1908 میں اس پر گولہ باری کرائی؛ آئینی قوتوں نے جولائی 1909 میں انہیں معزول کر کے ان کے بیٹے احمد شاہ کو تخت پر بٹھایا۔ 1925 میں سان ریمو میں جلاوطنی میں وفات پائی۔"
