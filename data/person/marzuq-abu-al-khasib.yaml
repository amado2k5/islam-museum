summary:
  ar: "مرزوق أبو الخصيب مولى خازم بن خزيمة ونسب إليه قصر الخصيب بالكوفة؛ احتال للمنصور بفتح طبرستان فضربه الأميران وحلقا رأسه ولحيته فادعى عند الأصبهبذ استغشاه وهرب إليه حتى وثق به فدله على عورات العرب واحتال للباب حتى فتح المسلمون المدينة."
  en: "Marzuq Abu al-Khasib, Khazim ibn Khuzayma's mawla and namesake of Kufa's Qasr al-Khasib; for al-Mansur he contrived Tabaristan's fall — beaten and shaven by his masters, he played the abused deserter to the Ispahbadh, mapped the Arabs' weaknesses and opened the gate."
  es: "Marzuq Abu al-Khasib, mawla de Khazim ibn Khuzayma y homónimo del Qasr al-Khasib de Kufa; para al-Mansur orquestó la caída de Tabaristán: golpeado y afeitado por sus amos, se hizo pasar por un desertor maltratado ante el Ispahbadh, identificó las debilidades de los árabes y abrió las puertas."
  fr: "Marzuq Abu al-Khasib, le mawla de Khazim ibn Khuzayma et homonyme du Qasr al-Khasib de Kufa; pour al-Mansur, il a orchestré la chute du Tabaristan — battu et rasé par ses maîtres, il a joué le rôle du déserteur maltraité auprès de l'Ispahbadh, a cartographié les faiblesses des Arabes et a ouvert la porte."
  ur: "مرزوق ابو الخصیب، خزیم بن خزیمہ کا مولا اور کوفہ کے قصر الخصیب کا نام؛ المنصور کے لیے اس نے تبرستان کے زوال کی سازش کی - اس کے آقاؤں کے ہاتھوں مارا پیٹا اور مونڈ دیا گیا، اس نے اسپہ آباد تک بدسلوکی کا مظاہرہ کیا، عربوں کی کمزوریوں کا نقشہ کھینچا اور دروازہ کھول دیا۔"
