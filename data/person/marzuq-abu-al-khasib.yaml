  ar: "مرزوق أبو الخصيب مولى خازم بن خزيمة ونسب إليه قصر الخصيب بالكوفة؛ احتال للمنصور بفتح طبرستان فضربه الأميران وحلقا رأسه ولحيته فادعى عند الأصبهبذ استغشاه وهرب إليه حتى وثق به فدله على عورات العرب واحتال للباب حتى فتح المسلمون المدينة."
  en: "Marzuq Abu al-Khasib, Khazim ibn Khuzayma's mawla and namesake of Kufa's Qasr al-Khasib; for al-Mansur he contrived Tabaristan's fall — beaten and shaven by his masters, he played the abused deserter to the Ispahbadh, mapped the Arabs' weaknesses and opened the gate."
