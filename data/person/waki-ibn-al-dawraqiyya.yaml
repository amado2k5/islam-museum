id: person/waki-ibn-al-dawraqiyya
class: person
label: { ar: "وكيع بن الدورقية القريعي", en: "Waki' ibn al-Dawraqiyya al-Quray'i", es: "Waki' ibn al-Dawraqiyya al-Quray'i", fr: "Waki' ibn al-Dawraqiyya al-Quray'i", ur: "وکیع ابن الدورقیہ القریٰ" }
summary:
  ar: "وكيع بن الدورقية القريعي أبو ربيعة واسم أبيه عميرة وأمه من سبي دورق نسب إليها؛ طعن ابن خازم مع بجير بن ورقاء وقعد على صدره وقال يا لثارات دويلة أخيه لأمه الذي قتله ابن خازم فتنخم في وجهه وقال لعنك الله أتقتل كبش مضر بأخيك علج لا يساوي كفاً من نوى وكان وكيع جافياً عظيم الخلقة صلى يوماً وبين يديه نبت فجعل يأكل منه فقيل له أتأكل وأنت تصلي فقال ما كان الله ليحرم نبتاً أنبته بماء السماء على طين الثرى وكان يشرب الخمر فعوتب عليها فقال في الحمر تعاتبوني وهي تجلو بولي حتى تصيره كالفضة."
  en: "Waki' ibn al-Dawraqiyya al-Quray'i — Abu Rabi'a, son of Umaira and a Dawraq captive; with Bujayr he stabbed Ibn Khazim and sat on his chest avenging Duwayla, his half-brother slain by Ibn Khazim, who spat back 'you kill Mudar's ram for a brother not worth a palm of date-stones'. A coarse giant: he ate the shoot before him during prayer — 'would God forbid a plant the sky's water raised on earth's clay?' — and answered reproach for wine with 'it washes my urine till it is silver'."
  es: "Waki' ibn al-Dawraqiyya al-Quray'i — Abu Rabi'a, hijo de Umaira y prisionero de Dawraq; junto con Bujayr apuñaló a Ibn Khazim y se sentó sobre su pecho vengando a Duwayla, su medio hermano asesinado por Ibn Khazim, quien escupió: «Matas al carnero de Mudar por un hermano que no vale ni un palmo de dátiles». Un gigante tosco: se comió el brote que tenía delante durante la oración —«¿Acaso Dios prohibiría que una planta, agua del cielo, creciera en la arcilla de la tierra?»— y respondió a las críticas por el vino diciendo: «Lava mi orina hasta convertirla en plata»."
  fr: "Waki' ibn al-Dawraqiyya al-Quray'i — Abu Rabi'a, fils d'Umaira et captif de Dawraq; avec Bujayr, il poignarda Ibn Khazim et s'assit sur sa poitrine pour venger Duwayla, son demi-frère tué par Ibn Khazim, qui lui rétorqua: « Tu as tué le bélier de Mudar pour un frère qui ne vaut même pas une poignée de dattes ! » Un homme rustre et colérique: il mangea la pousse qui se trouvait devant lui pendant la prière — « Dieu interdirait-il à une plante que l'eau du ciel a fait pousser sur l'argile de la terre ? » — et répondit aux reproches concernant le vin par: « Il purifie mon urine jusqu'à ce qu'elle soit argentée. »"
  ur: "وکیع بن الدورقیہ القریٰ - ابو ربیعہ، عمیرہ کا بیٹا اور داوراق کا اسیر؛ بوجیر کے ساتھ اس نے ابن خزیم کو گھونپ دیا اور اس کے سینے پر بیٹھ کر ابن خزیم کے ہاتھوں اس کے سوتیلے بھائی دوئلہ کا بدلہ لیا، جس نے تھوک دیا کہ 'تم نے ایک کھجور کے برابر بھائی کے لیے مدر کے مینڈھے کو مار ڈالا'۔ ایک موٹے دیو: اس نے نماز کے دوران اپنے سامنے ٹہنیاں کھائیں - 'کیا خدا زمین کی مٹی پر آسمان کے پانی کو اٹھانے والے پودے کو منع کرے گا؟' - اور شراب کے لئے ملامت کا جواب دیا 'یہ میرے پیشاب کو چاندی تک دھوتا ہے'۔"
  tr: "Babası Umairah olan ve annesi Durak esaretinden Ebu Rabi'ah, İbn Hazim Bujir ibn Warqa'yı bıçakladı, göğsüne oturdu ve 'Kardeşinin halinin intikamı için ne büyük bir intikam.' dedi. Ona kaşlarını çattı ve dedi ki, 'Allah seni lanetlesin. Kardeşine zarar veren bir koç öldürüyorsun, bir palmiye bile değerli olmayan bir sakız. Waki' büyük karakterli kuru bir adamdı ve bir gün önünde bir bitki varken namaz kılınca yemeğe başladı. Ona şöyle denildi: 'Dua ederken yiyor musun?' Şöyle dedi: 'Tanrı, gökyüzünün suyunla yeryüzünün kilinde yetiştirdiğin bir bitkiye asla yasak olmaz ve şarap içti. Bunun için azarlandı ve dedi ki, 'Beni kırmızılarla seziyorsun, idrarımı boşaltıp gümüş gibi oluyor.'"
  id: "Waki' ibn al-Duruqiyyah al-Qur'i, Abu Rabi'ah, yang nama ayahnya Umairah dan ibunya dari penawanan Durak, yang dikaitkan dengannya; Ibn Khazim menikam Bujir ibn Warqa dan duduk di dadanya sambil berkata, 'Betapa balas dendam untuk keadaan saudaranya kepada ibunya yang dibunuh Ibn Khazim.' Dia mengerutkan dahi dan berkata, 'Semoga Allah mengutukmu. Kau membunuh seekor domba jantan yang menyakiti saudaramu, gum, tidak berharga sekelapa pun pohon sawit berisi biji. Waki' adalah pria kering yang berkarakter besar, dan suatu hari dia berdoa saat ada tanaman di depannya, dan dia mulai makan dari tanaman itu. Dikatakan kepadanya, 'Apakah kamu makan saat berdoa?' Dia berkata, 'Tuhan tidak akan pernah melarang tanaman yang kamu tanam dengan air langit di tanah liat bumi, dan dia minum anggur. Dia dimarahi karenanya, dan dia berkata, 'Kamu menegur aku dengan warna merah, dan itu menguras urinku sampai menjadi seperti perak.'"
