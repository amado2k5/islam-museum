label: { ar: "وكيع بن الدورقية القريعي", en: "Waki' ibn al-Dawraqiyya al-Quray'i" }
summary:
  ar: "وكيع بن الدورقية القريعي أبو ربيعة واسم أبيه عميرة وأمه من سبي دورق نسب إليها؛ طعن ابن خازم مع بجير بن ورقاء وقعد على صدره وقال يا لثارات دويلة أخيه لأمه الذي قتله ابن خازم فتنخم في وجهه وقال لعنك الله أتقتل كبش مضر بأخيك علج لا يساوي كفاً من نوى وكان وكيع جافياً عظيم الخلقة صلى يوماً وبين يديه نبت فجعل يأكل منه فقيل له أتأكل وأنت تصلي فقال ما كان الله ليحرم نبتاً أنبته بماء السماء على طين الثرى وكان يشرب الخمر فعوتب عليها فقال في الحمر تعاتبوني وهي تجلو بولي حتى تصيره كالفضة."
  en: "Waki' ibn al-Dawraqiyya al-Quray'i — Abu Rabi'a, son of Umaira and a Dawraq captive; with Bujayr he stabbed Ibn Khazim and sat on his chest avenging Duwayla, his half-brother slain by Ibn Khazim, who spat back 'you kill Mudar's ram for a brother not worth a palm of date-stones'. A coarse giant: he ate the shoot before him during prayer — 'would God forbid a plant the sky's water raised on earth's clay?' — and answered reproach for wine with 'it washes my urine till it is silver'."
