summary:
  ar: "ممثلة هندية سابقة ⁦(وُلدت سنة 2000)⁩ في سريناغار، اشتهرت طفلةً بدور غيتا فوغات الصغيرة في «دانغال» (2016) فنالت جائزة الفيلم الوطنية، ثم بطولة «سيكريت سوبرستار» (2017)، قبل أن تعلن اعتزالها التمثيل سنة 2019 لتعارضه مع دينها وإيمانها كما صرّحت بنفسها."
  en: "Indian former actress (born 2000) at Srinagar who rose to fame as the young Geeta Phogat in Dangal (2016), winning a National Film Award, starred in Secret Superstar (2017), and in 2019 publicly left acting, stating in her own words that it conflicted with her religion and faith."
  ur: "سابق بھارتی اداکارہ ⁦(پیدائش 2000)⁩ جو سرینگر میں پیدا ہوئیں، «دنگل» (2016) میں نوجوان گیتا پھوگٹ کے کردار سے شہرت پائی اور قومی فلم ایوارڈ جیتا، پھر «سیکرٹ سپر اسٹار» (2017) میں مرکزی کردار ادا کیا، اور 2019 میں اپنے بیان کے مطابق دین و ایمان سے تعارض پر اداکاری چھوڑ دی۔"
  es: "Ex actriz india (nacida en 2000) en Srinagar, que saltó a la fama como la joven Geeta Phogat en Dangal (2016), ganando un Premio Nacional de Cine, protagonizó Secret Superstar (2017) y en 2019 abandonó públicamente la actuación, declarando en sus propias palabras que entraba en conflicto con su religión y su fe."
  fr: "Ancienne actrice indienne (née en 2000) à Srinagar, devenue célèbre grâce à son rôle de jeune Geeta Phogat dans Dangal (2016), remportant un National Film Award, a joué dans Secret Superstar (2017) et a quitté publiquement le métier d'actrice en 2019, déclarant de son propre aveu que cela était en conflit avec sa religion et sa foi."
  tr: "Srinagar'da 2000 doğumlu eski bir Hintli oyuncu olan Srinagar, çocukken Ulusal Film Ödülü'nü kazanan 'Dangal' (2016) filminde genç Geeta Phogat rolüyle ünlendi, ardından 'Secret Superstar' (2017) filminde başrol oynadı ve 2019'da dini ve inancıyla yaşadığı çatışmalar nedeniyle oyunculuktan emekli olduğunu açıkladı."
  id: "Mantan aktris India (lahir tahun 2000) di Srinagar, ia menjadi terkenal sejak kecil karena perannya sebagai Geeta Phogat muda dalam 'Dangal' (2016), yang memenangkan National Film Award, kemudian membintangi 'Secret Superstar' (2017), sebelum mengumumkan pensiun dari dunia akting pada tahun 2019 karena konflik dengan agama dan keyakinannya, seperti yang ia sendiri katakan."
