summary:
  ar: "فلكي دمشقي ⁦(690–750هـ)⁩، ميقاتي بالجامع الأموي، اشتهر بصنع غرائب الأسطرلابات حتى بيع أسطرلابه بعشرة دنانير، وتوجد مزولة بتوقيعه في المتحف البريطاني {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 21}."
  en: "Damascene astronomer (690–750 AH), timekeeper at the Umayyad Mosque, famed for unusual astrolabes, one of which sold for ten dinars; a sundial signed by him is in the British Museum {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 21}."
  ur: "دمشقی ماہرِ فلکیات ⁦(690–750ھ)⁩، جامع اموی کے میقاتی، عجیب و غریب اسطرلاب بنانے میں مشہور، یہاں تک کہ ان کا اسطرلاب دس دینار میں بکتا؛ ان کے دستخط والی ایک دھوپ گھڑی برٹش میوزیم میں ہے {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 21}۔"
