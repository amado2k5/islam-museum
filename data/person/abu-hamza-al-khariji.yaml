label: { ar: "أبو حمزة الخارجي" }
summary:
  ar: "من الخوارج، لقي عبد الله بن يحيى طالب الحق في سنة ثمان وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.348}، ودخل المدينة في سنة ثلاثين ومائة بعد وقعة قديد {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}.، وعند المسعودي هو المختار بن عوف الأزدي دخل مع بلخ بن عقبة مكة والمدينة سنة تسع وعشرين ومائة يدعوان إلى عبد الله بن يحيى الكندي طالب الحق، فلقيهما عبد الملك بن محمد بن عطية فقتل بلخاً بوادي القرى ولحق أبا حمزة فقتله وأكثر من معه {cite:muruj-al-dhahab p. 228-229}، وعند المسعودي وقف وخرج سنة تسع وعشرين ومائة في أيام أمير الحج عبد الواحد بن سليمان بن عبد الملك فكلمه الناس حتى نزل عبد الواحد يصلي بالناس ويخرج إلى منزله {cite:muruj-al-dhahab p. 743}"
gender: male
