id: person/abu-hamza-al-khariji
class: person
label: { ar: "أبو حمزة الخارجي", en: "Abu Hamza al-Khariji", fr: "Abu Hamza al-Khariji", es: "Abu Hamza al-Khariji", ur: "ابو حمزہ الخارجی" }
summary:
  ar: "من الخوارج، لقي عبد الله بن يحيى طالب الحق في سنة ثمان وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.348}، ودخل المدينة في سنة ثلاثين ومائة بعد وقعة قديد {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}. وعند المسعودي هو المختار بن عوف الأزدي دخل مع بلخ بن عقبة مكة والمدينة سنة تسع وعشرين ومائة يدعوان إلى عبد الله بن يحيى الكندي طالب الحق، فلقيهما عبد الملك بن محمد بن عطية فقتل بلخاً بوادي القرى ولحق أبا حمزة فقتله وأكثر من معه {cite:muruj-al-dhahab p. 228-229}، وعند المسعودي وقف وخرج سنة تسع وعشرين ومائة في أيام أمير الحج عبد الواحد بن سليمان بن عبد الملك فكلمه الناس حتى نزل عبد الواحد يصلي بالناس ويخرج إلى منزله {cite:muruj-al-dhahab p. 743}"
  en: "A Kharijite who met Abdallah ibn Yahya, 'the seeker of truth', in 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.348}, and entered Medina in 130, after the battle of Qudayd {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}. According to al-Mas'udi he was al-Mukhtar ibn Awf al-Azdi, who entered Mecca and Medina with Balkh ibn Uqba in 129, calling for Abdallah ibn Yahya al-Kindi, the seeker of truth; Abd al-Malik ibn Muhammad ibn Atiyya met the two of them, killed Balkh at Wadi al-Qura, overtook Abu Hamza and killed him and most of those with him {cite:muruj-al-dhahab p. 228-229}. Also according to al-Mas'udi, he made his stand and went out in 129, in the days of the amir of the pilgrimage Abd al-Wahid ibn Sulayman ibn Abd al-Malik; people spoke to him until Abd al-Wahid came down to pray with the people and went out to his residence {cite:muruj-al-dhahab p. 743}"
  fr: "Kharijite qui rencontra Abdallah ibn Yahya, « le chercheur de vérité », en 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.348}, et entra à Médine en 130, après la bataille de Qudayd {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}. Selon al-Mas'udi, il s'agissait d'al-Mukhtar ibn Awf al-Azdi, qui entra à La Mecque et à Médine avec Balkh ibn Uqba en 129, appelant à Abdallah ibn Yahya al-Kindi, le chercheur de vérité ; Abd al-Malik ibn Muhammad ibn Atiyya les affronta tous deux, tua Balkh à Wadi al-Qura, rattrapa Abu Hamza et le tua avec la plupart de ceux qui étaient avec lui {cite:muruj-al-dhahab p. 228-229}. Toujours selon al-Mas'udi, il prit position et sortit en 129, au temps de l'émir du pèlerinage Abd al-Wahid ibn Sulayman ibn Abd al-Malik ; les gens lui parlèrent jusqu'à ce qu'Abd al-Wahid descende prier avec les gens et se retire dans sa résidence {cite:muruj-al-dhahab p. 743}"
  es: "Un jariyita que conoció a Abdallah ibn Yahya, 'el buscador de la verdad', en 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.348}, y entró en Medina en 130, después de la batalla de Qudayd {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}. Según al-Mas'udi, era al-Mukhtar ibn Awf al-Azdi, quien entró en La Meca y Medina con Balkh ibn Uqba en 129, llamando a Abdallah ibn Yahya al-Kindi, el buscador de la verdad; Abd al-Malik ibn Muhammad ibn Atiyya se encontró con los dos, mató a Balkh en Wadi al-Qura, alcanzó a Abu Hamza y lo mató junto con la mayoría de los que estaban con él {cite:muruj-al-dhahab p. 228-229}. Asimismo, según al-Mas'udi, se plantó y salió en el año 129, en los días del emir de la peregrinación Abd al-Wahid ibn Sulayman ibn Abd al-Malik; la gente habló con él hasta que Abd al-Wahid bajó a rezar con la gente y salió a su residencia {cite:muruj-al-dhahab p. 743}."
  ur: "ایک خارجی جس نے 128 میں عبداللہ بن یحییٰ، 'حق کے متلاشی' سے ملاقات کی، اور 130 میں جنگِ قدّد کے بعد مدینہ میں داخل ہوا۔ {حوالہ: طبری-تاریخ-ابو الفضل ج7 ص394}۔ المسعودی کے مطابق وہ المختار بن عوف العزدی تھے، جو 129 میں بلخ ابن عقبہ کے ساتھ مکہ اور مدینہ میں داخل ہوئے، عبداللہ ابن یحییٰ الکندی، حق کے متلاشی، کو بلاتے ہوئے؛ عبد الملک بن محمد بن عطیہ نے ان دونوں سے ملاقات کی، بلخ کو وادی القراء میں قتل کیا، ابو حمزہ سے آگے نکل کر اسے اور اس کے ساتھیوں میں سے اکثر کو قتل کر دیا۔ 228-229}۔ نیز المسعودی کے مطابق، اس نے اپنا موقف بنایا اور 129 میں زیارت کے امیر عبد الواحد بن سلیمان بن عبد الملک کے دور میں نکلا۔ لوگوں نے اس سے باتیں کیں یہاں تک کہ عبد الواحد لوگوں کے ساتھ نماز پڑھنے کے لیے نیچے آیا اور اپنی رہائش گاہ کی طرف نکل گیا۔ 743}"
