label: { ar: "أبو حمزة الخارجي", en: "Abu Hamza al-Khariji" }
summary:
  ar: "من الخوارج، لقي عبد الله بن يحيى طالب الحق في سنة ثمان وعشرين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.348}، ودخل المدينة في سنة ثلاثين ومائة بعد وقعة قديد {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}. وعند المسعودي هو المختار بن عوف الأزدي دخل مع بلخ بن عقبة مكة والمدينة سنة تسع وعشرين ومائة يدعوان إلى عبد الله بن يحيى الكندي طالب الحق، فلقيهما عبد الملك بن محمد بن عطية فقتل بلخاً بوادي القرى ولحق أبا حمزة فقتله وأكثر من معه {cite:muruj-al-dhahab p. 228-229}، وعند المسعودي وقف وخرج سنة تسع وعشرين ومائة في أيام أمير الحج عبد الواحد بن سليمان بن عبد الملك فكلمه الناس حتى نزل عبد الواحد يصلي بالناس ويخرج إلى منزله {cite:muruj-al-dhahab p. 743}"
  en: "A Kharijite who met Abdallah ibn Yahya, 'the seeker of truth', in 128 {cite:tabari-tarikh-abu-al-fadl j.7 p.348}, and entered Medina in 130, after the battle of Qudayd {cite:tabari-tarikh-abu-al-fadl j.7 p.393} {cite:tabari-tarikh-abu-al-fadl j.7 p.394}. According to al-Mas'udi he was al-Mukhtar ibn Awf al-Azdi, who entered Mecca and Medina with Balkh ibn Uqba in 129, calling for Abdallah ibn Yahya al-Kindi, the seeker of truth; Abd al-Malik ibn Muhammad ibn Atiyya met the two of them, killed Balkh at Wadi al-Qura, overtook Abu Hamza and killed him and most of those with him {cite:muruj-al-dhahab p. 228-229}. Also according to al-Mas'udi, he made his stand and went out in 129, in the days of the amir of the pilgrimage Abd al-Wahid ibn Sulayman ibn Abd al-Malik; people spoke to him until Abd al-Wahid came down to pray with the people and went out to his residence {cite:muruj-al-dhahab p. 743}"
