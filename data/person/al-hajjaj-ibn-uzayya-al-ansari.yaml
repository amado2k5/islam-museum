id: person/al-hajjaj-ibn-uzayya-al-ansari
class: person
label: { ar: "الحجاج بن عزية الأنصاري", en: "al-Hajjaj ibn 'Uzayya al-Ansari", fr: "Al-Hajjaj ibn Uzayya al-Ansari", es: "al-Hajjaj ibn 'Uzayya al-Ansari", ur: "الحجاج ابن عزیہ الانصاری" }
summary:
  ar: "شاعر أنصاري رثى عمار بن ياسر بعد قتله بصفين بأبيات منها ياللرجال لعين دمعها جاري قد هاج حزني أبو اليقظان عمار، وفيه البيت النبوي تقتلك شرذمة سيطت لحمومهم بالبغي فجار {cite:muruj-al-dhahab p. 673-674}."
  en: "The Ansari poet who elegised 'Ammar after Siffin — 'for men's eyes a flowing tear; Abu'l-Yaqzan 'Ammar has stirred my grief' {cite:muruj-al-dhahab p. 673-674}."
  fr: "Poète ansarite qui composa une élégie pour Ammar après Siffin : « Aux yeux des hommes, une larme qui coule ; Abu al-Yaqzan Ammar a ravivé ma douleur » {cite:muruj-al-dhahab p. 673-674}."
  es: "El poeta ansari que elegió 'Ammar después de Siffin: 'para los ojos de los hombres una lágrima que fluye; Abu'l-Yaqzan 'Ammar ha despertado mi dolor' {cita:muruj-al-dhahab p. 673-674}."
  ur: "وہ انصاری شاعر جس نے عمار کو صفین کے بعد کہا - مردوں کی آنکھوں کے لیے بہتا آنسو؛ ابوال یقزان عمار نے میرے غم کو بھڑکا دیا ہے۔ 673-674}۔"
  tr: "Ensarî bir şair, Siffin'de öldürülen Ammar bin Yasir'in ardından şu dizelerle yas tutmuştur: \"Ey insanlar, gözyaşları akan bir göz için, kederim Ebu el-Yakzan Ammar yüzünden uyandı.\" Ve bu dizelerde Peygamberimizin şu ayeti de yer almaktadır: \"Sizi bir topluluk öldürecek, kanlarıyla zulüm ve haksızlıkla kirlenmiş bir topluluk.\" {kaynak:muruj-al-dhahab s. 673-674}"
  id: "Seorang penyair Ansari meratapi Ammar bin Yasir setelah ia terbunuh di Siffin dengan syair-syair yang antara lain berbunyi: “Wahai manusia, karena mata yang berlinang air mata, dukaku tergerak oleh Abu al-Yaqzan Ammar,” dan di dalamnya terdapat ayat Nabi: “Suatu kelompok akan membunuhmu, suatu kelompok yang telah dirusak oleh darah mereka dengan kezaliman dan pelanggaran.” {cite:muruj-al-dhahab hlm. 673-674}."
