faith:
  - value: sufi
    basis: documented
    note: "Two independent texts name his personal membership of a Sufi order. The English article on his son Ma Anliang, citing Dillon (1999, p. 140), states that the Hezhou leaders who defected in 1872 — Ma Zhan'ao expressly named among them — 'belonged to the Huasi menhuan, of the Khafiya Naqshbandi Sufi order'. The Chinese article on Ma Zhan'ao himself, an independent tradition citing Chinese scholarship, states that his family were hereditary Islamic religious leaders, that at twenty he studied at the Great Mosque of Daxuexiang in Xi'an until he received the ahong's vestment, and that he then served as ahong at the Monigou and Dahejia mosques 'belonging to the Huasi menhuan' （屬花寺门宦）, returning to Dahejia as ahong in retirement. His own English article's text names no order, and its categories — and the Chinese article's categories, which file him under the Jahriyya at odds with its own text — are filings and are not counted. Wikidata gives Islam (Q432) in general."
    sources: [source/wikipedia-ma-anliang-en, source/wikipedia-ma-zhanao-zh, source/wikidata-ma-zhanao]
