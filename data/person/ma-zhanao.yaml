summary:
  ar: "جنرال مسلم صيني من هتشو (1830–1886)، إمام (أهونغ) في شبابه من منحوان هواسي الخفي النقشبندي، قاد ثوّار هتشو في ثورة الدونغان ثم انشقّ إلى أسرة تشينغ سنة 1872 — مرسلًا ابنه ما انليانغ للتفاوض — وساعد تسوو تسونغتانغ في إنهاء الثورة، فصار مؤسس قوة أسرة ما العسكرية في قانسو ووالد الجنرال ما انليانغ."
  en: "A Chinese Muslim general of Hezhou (1830–1886), an ahong in his youth of the Huasi menhuan of the Khufiyya Naqshbandiyya, who led the Hezhou rebels in the Dungan revolt and then defected to the Qing in 1872 — sending his son Ma Anliang to negotiate — and helped Zuo Zongtang end the rebellion, becoming the founder of the Ma family's military power in Gansu and the father of General Ma Anliang."
  ur: "ہیچو کے ایک چینی مسلمان جنرل (1830ء–1886ء)، جوانی میں خفیہ نقشبندیہ کے ہواسی منحوان کے اہونگ (امام)، جنہوں نے دونغان بغاوت میں ہیچو کے باغیوں کی قیادت کی اور پھر 1872ء میں چنگ سے جا ملے — اپنے بیٹے ما ان لیانگ کو مذاکرات کے لیے بھیجا — اور زوو زونگ تانگ کی بغاوت ختم کرنے میں مدد کی، یوں وہ گانسو میں ما خاندان کی عسکری طاقت کے بانی اور جنرل ما ان لیانگ کے والد بنے۔"
