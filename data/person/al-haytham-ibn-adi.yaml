id: person/al-haytham-ibn-adi
class: person
label: { ar: "الهيثم بن عدي الطائي", en: "al-Haytham ibn 'Adi al-Ta'i", es: "al-Haytham ibn 'Adi al-Ta'i", fr: "al-Haytham ibn 'Adi al-Ta'i", ur: "الہیثم بن عدی الطائی" }
summary:
  ar: "من الأخباريين الذين يعتمد عليهم المسعودي في أعداد القتلى والوقائع، ذهب مع الشرقي بن القطامي وأبي مخنف إلى أن قتلى صفين من الفريقين سبعون ألفاً خمسة وأربعون ألفاً من أهل الشام وخمسة وعشرون ألفاً من أهل العراق فيهم خمسة وعشرون بدرياً، وروى في كنا أن محمداً بن طلحة كان يكنى أبا القاسم خلاف الواقدي {cite:muruj-al-dhahab p. 659,684}. وروى عنه البهلول بن العباس عن يزيد الرقاشي أسمار السفاح وخبر التنوخي والجارية التي هجت القبائل {cite:muruj-al-dhahab p. 257-261}، ومات سنة ست ومائتين وكان يغمز عليه نسبه فقيل فيه إذا نسبت عدياً في بني ثعل فقدم الدال قبل العين في النسب {cite:muruj-al-dhahab p. 426}، وروى عن أبيه أن عثمان بعثه مصدقاً في بني عذرة فوجد عروة بن حزام شاباً في بيت منحاش يترنم فمات بين يديه وأمه عجوز {cite:muruj-al-dhahab p. 539-540}، وقال إسحاق الموصلي كنت إذا رأيت ثلاثة يرون ثلاثة يذوبون: إذا رأى الهيثم بن عدي هشاما الكلبي وعلويه إذا رأى مخارقا وأبو نواس إذا رأى أبا العتاهية {cite:fihrist-ibn-al-nadim p. 301}"
  en: "Mas'udi's oft-cited akhbari — with al-Sharqi and Abu Mikhnaf he put Siffin's dead at seventy thousand (45,000 Syrians, 25,000 Iraqis incl. 25 Badris), and preserved the kunya variant for Muhammad ibn Talha {cite:muruj-al-dhahab p. 659,684}."
  es: "El frecuentemente citado akhbari de Mas'udi: con al-Sharqi y Abu Mikhnaf calculó los muertos de Siffin en setenta mil (45.000 sirios, 25.000 iraquíes, incluidos 25 badris), y conservó la variante kunya para Muhammad ibn Talha {cita:muruj-al-dhahab p. 659.684}."
  fr: "L'akhbari souvent cité de Mas'udi - avec al-Sharqi et Abu Mikhnaf, il a estimé le nombre de morts de Siffin à soixante-dix mille (45 000 Syriens, 25 000 Irakiens dont 25 Badris), et a conservé la variante kunya pour Muhammad ibn Talha {cite: muruj-al-dhahab p. 659 684}."
  ur: "مسعودی کی کثرت سے نقل کی جانے والی اخباری - الشرقی اور ابو مخنف کے ساتھ اس نے صفین کے مرنے والوں کی تعداد ستر ہزار ⁦(45,000 شامی، 25,000 عراقی بشمول 25 بدری)⁩ رکھی اور محمد ابن طلحہ کے لیے کنیہ کی قسم کو محفوظ کیا۔ 659,684}۔"
  tr: "El-Mes'udi'nin kayıp ve olay sayısı için güvendiği Akhbariler arasında, el-Şerqi ibn el-Katemi ve Ebu Mikhnaf ile birlikte, Siffin'in her iki taraftan ölenlerinin yetmiş bin, kırk beş bin el-Şam halkından ve yirmi beş bin Irak'tan olduğunu, bunların yirmi beşinin Badr'da olduğunu kabul etmiştir. Kanna'da Muhammed ibn Talhah'ın Ebu el-Qasim olarak bilindiği anlatılır; bu da el-Vaqidi'den farklı olarak {alıntı:muruj-al-dhahab, s. 659,684} (alıntı:muruj-al-dhahab, s. 659,684} olarak bilinir. Al-Bahlul ibn al-Abbas, Yazid al-Raqashi Asmar al-Saffah'dan el-Tanukhi ve kabileleri hicveden köle kızın hikayesini anlatmıştır {atıf:muruj-al-dhahab s. 257-261}. 206 Hicri yılında öldü ve soyundan bahsedildi; bu yüzden 'Adiya'nın Banu Tha'al'a atfedilmesi durumunda 'dal'ın 'ayn'dan önce geleceği söylenir. {cite:Muruj-al-Dhahab, s. 426}. Babası, Osman tarafından Banu Udhra'ya inanan biri olarak gönderildiğini, Urwah ibn Hizam'ı Manhash'ın evinde genç bir adam olarak şarkı söylerken bulduğunu ve annesi yaşlıyken ondan önce öldüğünü anlattı {alıntı: Muruj-al-Dhahab s. 539-540} ve İshaq al-Mawsili şöyle demiştir: Üçünü gördüğünde, üçünün eridiğini görürsün: el-Heysem bin 'Adi, Hisham el-Kalbi'yi gördüğünde, Aleviye bir mkharaq gördüğünde ve Ebu Nuwas Ebu el-Atahiyah'ı gördüğünde {atıf:fihrist-ibn-al-nadim s. 301}"
  id: "Di antara Akhbaris yang diandalkan oleh al-Mas'udi untuk jumlah korban dan insiden, ia sepakat, bersama al-Sharqi ibn al-Qatami dan Abu Mikhnaf, bahwa korban tewas Siffin dari kedua belah pihak adalah tujuh puluh ribu, empat puluh lima ribu dari penduduk al-Sham, dan dua puluh lima ribu dari Irak, termasuk dua puluh lima di Badr. Diceritakan dalam Kanna bahwa Muhammad ibn Talhah dikenal sebagai Abu al-Qasim, berbeda dengan al-Waqidi {cite:muruj-al-dhahab, hlm. 659,684}. Al-Bahlul ibn al-Abbas menceritakan darinya dari Yazid al-Raqashi Asmar al-Saffah, kisah al-Tanukhi, dan budak perempuan yang menyindir suku-suku {cite:muruj-al-dhahab hlm. 257-261}. Ia meninggal pada tahun 206 H, dan garis keturunannya diisyaratkan, sehingga dikatakan bahwa jika 'Adiya dikaitkan dengan Banu Tha'al, 'dal' akan mendahului 'ayn. {cite:muruj-al-dhahab, hlm. 426}. Ia menceritakan dari ayahnya bahwa Uthman mengirimnya sebagai orang yang beriman kepada Banu Udhra, dan ia menemukan Urwah ibn Hizam seorang pemuda di rumah Manhash sedang bernyanyi, dan ia meninggal sebelum Urwah ibn Hizam saat ibunya sudah tua {cite: Muruj-al-Dhahab hlm. 539-540}, dan Ishaq al-Mawsili berkata: Ketika kau melihat tiga, kau melihat tiga meleleh: ketika al-Haytham ibn 'Adi melihat Hisham al-Kalbi, dan Alawiyah ketika ia melihat mkharaq, dan Abu Nuwas ketika ia melihat Abu al-Atahiyah {cite:fihrist-ibn-al-nadim hlm. 301}"
