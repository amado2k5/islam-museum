id: person/al-haytham-ibn-adi
class: person
label: { ar: "الهيثم بن عدي الطائي", en: "al-Haytham ibn 'Adi al-Ta'i" }
summary:
  ar: "من الأخباريين الذين يعتمد عليهم المسعودي في أعداد القتلى والوقائع، ذهب مع الشرقي بن القطامي وأبي مخنف إلى أن قتلى صفين من الفريقين سبعون ألفاً خمسة وأربعون ألفاً من أهل الشام وخمسة وعشرون ألفاً من أهل العراق فيهم خمسة وعشرون بدرياً، وروى في كنا أن محمداً بن طلحة كان يكنى أبا القاسم خلاف الواقدي {cite:muruj-al-dhahab p. 659,684}. وروى عنه البهلول بن العباس عن يزيد الرقاشي أسمار السفاح وخبر التنوخي والجارية التي هجت القبائل {cite:muruj-al-dhahab p. 257-261}، ومات سنة ست ومائتين وكان يغمز عليه نسبه فقيل فيه إذا نسبت عدياً في بني ثعل فقدم الدال قبل العين في النسب {cite:muruj-al-dhahab p. 426}، وروى عن أبيه أن عثمان بعثه مصدقاً في بني عذرة فوجد عروة بن حزام شاباً في بيت منحاش يترنم فمات بين يديه وأمه عجوز {cite:muruj-al-dhahab p. 539-540}، وقال إسحاق الموصلي كنت إذا رأيت ثلاثة يرون ثلاثة يذوبون: إذا رأى الهيثم بن عدي هشاما الكلبي وعلويه إذا رأى مخارقا وأبو نواس إذا رأى أبا العتاهية {cite:fihrist-ibn-al-nadim p. 301}"
  en: "Mas'udi's oft-cited akhbari — with al-Sharqi and Abu Mikhnaf he put Siffin's dead at seventy thousand (45,000 Syrians, 25,000 Iraqis incl. 25 Badris), and preserved the kunya variant for Muhammad ibn Talha {cite:muruj-al-dhahab p. 659,684}."
