summary:
  ar: "جوي ألوكاس (وُلد في 29 تشرين الأول 1956 في تريشور بولاية كيرالا)، رجل أعمال هندي يرأس مجموعة جويالوكاس للمجوهرات ويديرها. تولى أعمال عائلته في الخليج بعد تقاسم أعمال المجوهرات بين الإخوة، وأسس مجوهرات جوي ألوكاس سنة 2001 فأصبحت من أكبر سلاسل تجزئة المجوهرات في الهند والخليج. صدرت مذكراته «نشر الفرح» سنة 2023، وقدّرت فوربس ثروته بنحو 4.4 مليار دولار."
  en: "Joy Alukkas (born 29 October 1956 at Thrissur, Kerala) is an Indian businessman and the chairman and managing director of the Joyalukkas jewellery group. He took the family's Gulf-side business in the division of the jewellery firm among the brothers and founded Joy Alukkas Jewellery in 2001, which grew into one of India's and the Gulf's largest jewellery retail chains. His memoir Spreading Joy appeared in 2023, and Forbes put his net worth at US$4.4 billion."
  ur: "جوئے الوکاس (پیدائش 29 اکتوبر 1956، تریشور، کیرالا) بھارتی تاجر اور جویالوکس زیورات گروپ کے چیئرمین و منیجنگ ڈائریکٹر ہیں۔ انہوں نے بھائیوں کے درمیان زیورات کے کاروبار کی تقسیم میں خاندان کا خلیجی کاروبار سنبھالا اور 2001 میں جوی الوکاس جیولری قائم کی، جو بھارت اور خلیج کی زیورات کی سب سے بڑی خوردہ سلسلوں میں سے ایک بن گئی۔ ان کی یادداشت 'اسپریڈنگ جوئے' 2023 میں شائع ہوئی، اور فوربز نے ان کی دولت کا تخمینہ 4.4 ارب ڈالر لگایا۔"

