summary:
  ar: "سري مولياني إندراواتي (وُلدت في 26 آب 1962 في تانجونغ كارانغ، بندر لامبونغ حاليًا) اقتصادية إندونيسية، وزيرة المالية في عهد ثلاثة رؤساء متعاقبين (2005–2010 ثم 2016–2025)؛ درست في جامعة إندونيسيا ونالت الدكتوراه من جامعة إلينوي، وكانت مديرة تنفيذية في صندوق النقد الدولي ومديرة إدارية في البنك الدولي، وأقيلت من الوزارة في 8 أيلول 2025."
  en: "Sri Mulyani Indrawati (born 26 August 1962 in Tanjung Karang, now Bandar Lampung) is an Indonesian economist who served as minister of finance under three successive presidents (2005-2010 and 2016-2025); she studied at the University of Indonesia and took her PhD at the University of Illinois, was an executive director at the IMF and a managing director at the World Bank, and was dismissed as finance minister on 8 September 2025."
  ur: "سری مولیانی اندراواتی (پیدائش 26 اگست 1962، تانجونگ کارانگ، موجودہ بندر لامپونگ) انڈونیشیائی ماہر معاشیات ہیں، تین صدور کے دور میں وزیر خزانہ رہیں (2005–2010 اور 2016–2025)؛ انھوں نے یونیورسٹی آف انڈونیشیا سے تعلیم حاصل کی اور یونیورسٹی آف الینوائے سے پی ایچ ڈی کیا، آئی ایم ایف میں ایگزیکٹو ڈائریکٹر اور ورلڈ بینک میں منیجنگ ڈائریکٹر رہیں، اور 8 ستمبر 2025 کو وزارت خزانہ سے برطرف ہوئیں۔"
