label: { ar: "السلطان المنصور سيف الدين قلاوون" }
summary:
  ar: "أتابك الملك العادل بدر الدين سلامش وله سبع سنين لما خلع أخوه الملك السعيد وسير إلى الكرك، ثم نزع سلامش من السلطنة بغير نزاع في رجب سنة ثمان وسبعين وتسلطن قلاوون ولقب بالملك المنصور، وفي سنة ثمانين وصل عسكر التتار إلى الشام فخرج لقتالهم فحصل النصر للمسلمين، وفي سنة ثمان وثمانين أخذ طرابلس بالسيف وكانت في أيدي الفرنج من سنة ثلاث وخمس مئة، ومات في ذي القعدة سنة تسع وثمانين وتسلطن ابنه الملك الأشرف صلاح الدين خليل {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  en: "Atabeg to the boy Salamish then sultan as al-Mansur from 679; he broke the Tatar host of 680, took Tripoli by the sword in 688, and died Dhu'l-Qa'da 689 {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
