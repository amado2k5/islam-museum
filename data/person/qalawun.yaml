id: person/qalawun
class: person
label: { ar: "السلطان المنصور سيف الدين قلاوون" }
summary:
  ar: "أتابك الملك العادل بدر الدين سلامش وله سبع سنين لما خلع أخوه الملك السعيد وسير إلى الكرك، ثم نزع سلامش من السلطنة بغير نزاع في رجب سنة ثمان وسبعين وتسلطن قلاوون ولقب بالملك المنصور، وفي سنة ثمانين وصل عسكر التتار إلى الشام فخرج لقتالهم فحصل النصر للمسلمين، وفي سنة ثمان وثمانين أخذ طرابلس بالسيف وكانت في أيدي الفرنج من سنة ثلاث وخمس مئة، ومات في ذي القعدة سنة تسع وثمانين وتسلطن ابنه الملك الأشرف صلاح الدين خليل {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  en: "Atabeg to the boy Salamish then sultan as al-Mansur from 679; he broke the Tatar host of 680, took Tripoli by the sword in 688, and died Dhu'l-Qa'da 689 {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  es: "Atabeg al niño Salamish luego sultán como al-Mansur desde 679; rompió el ejército tártaro de 680, tomó Trípoli por la espada en 688 y murió Dhu'l-Qa'da 689 {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  fr: "Atabeg au jeune Salamish puis sultan sous le nom d'al-Mansur à partir de 679; il a brisé l'armée tatare de 680, pris Tripoli par l'épée en 688 et est mort Dhu'l-Qa'da 689 {cite:tarikh-khulafa-minhaj-1434 p. 729-730}."
  ur: "عتبیگ سے لڑکا سلامش پھر سلطان المنصور 679 سے؛ اس نے 680 کے تاتاری لشکر کو توڑا، 688 میں طرابلس پر قبضہ کر لیا، اور ذوالقعدہ 689 میں وفات پائی۔ 729-730}۔"
  tr: "Adil Kral Badr al-Din Salamash, Atabeg'di ve yedi yaşındayken kardeşi Kral Al-Saeed'i tahttan indirip Karak'a yürüdü. Sonra Salameş, 78 yılının Recep'inde tartışmasız olarak sultanlıktan çıkarıldı, Qalawun'un kontrolünü ele geçirdi ve Kral Al-Mansur unvanını aldı. 80 yılında Tatar ordusu Levant'a ulaştı ve onlarla savaşmak için dışarı çıktı, Müslümanlar için zafer kazandı. 1988'de, 503 H.M.'den beri Frankların elinde olan Trablus'u kılıçla ele geçirdi. 89 yılında Dhu al-Qi'dah'ta öldü ve oğlu Kral el-Eşref Salah al-Din Halil kontrolü ele aldı {cite:Tarikh-Khulafa-minhaj-1434, s. 729-730}."
  id: "Raja Badr al-Din Salamash yang adil adalah Atabeg dan berusia tujuh tahun ketika ia menggulingkan saudaranya Raja Al-Saeed dan berbaris ke Karak. Kemudian Salamesh dicopot dari kesultanan tanpa sengketa pada Rajab tahun 78, mengambil alih Qalawun, dan diberi gelar Raja Al-Mansur. Pada tahun 80, tentara Tatar mencapai Levant dan pergi berperang, meraih kemenangan bagi Muslim. Pada tahun 1988, ia merebut Tripoli dengan pedang, yang telah dikuasai bangsa Franka sejak tahun 503 H. Ia meninggal di Dhu al-Qi'dah pada tahun 89, dan putranya, Raja al-Ashraf Salah al-Din Khalil, mengambil alih {cite:Tarikh-Khulafa-minhaj-1434, hlm. 729-730}."
