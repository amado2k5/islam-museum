summary:
  ar: لجين عمران ⁦(1977–)⁩ إعلامية سعودية، من أشهر مقدمات البرامج الصباحية في العالم العربي، ولديها أكثر من عشرة ملايين متابع على وسائل التواصل، وهي سفيرة للمفوضية السامية للأمم المتحدة لشؤون اللاجئين.
  en: Lojain Omran (born 1977) is a Saudi television presenter, one of the Arab world's best-known morning-show hosts with tens of millions of social-media followers, and a UNHCR ambassador.
  ur: لجین عمران ⁦(1977–)⁩ سعودی ٹیلی ویژن میزبان ہیں، عرب دنیا کی معروف صبح کے پروگراموں کی ناشرہ جن کے سوشل میڈیا پر کروڑوں پیروکار ہیں، اور وہ UNHCR کی سفیر ہیں۔
  es: "Lojain Omran (nacida en 1977) es una presentadora de televisión saudí, una de las presentadoras de programas matutinos más conocidas del mundo árabe, con decenas de millones de seguidores en las redes sociales, y embajadora de ACNUR."
  fr: "Lojain Omran (né en 1977) est un présentateur de télévision saoudien, l'un des animateurs d'émissions matinales les plus connus du monde arabe avec des dizaines de millions d'abonnés sur les réseaux sociaux, et un ambassadeur du HCR."
