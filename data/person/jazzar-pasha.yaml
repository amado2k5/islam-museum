summary:
  ar: "أحمد باشا الجزار (نحو 1720/1730 – 1804)، والي صيدا العثماني المقيم في عكا من سنة 1776 حتى وفاته، ووالي دمشق في فترات متقطعة. وُلد في البوسنة لأسرة نصرانية واعتنق الإسلام في مصر، فصار من أتباع علي بك الكبير واكتسب لقب «الجزّار» لانتقامه من البدو قتلة سيده. اشتهر بدفاعه الناجح عن عكا ضد نابليون سنة 1799 بمساعدة الأسطول البريطاني، وبآثاره العمرانية في عكا، وفيها مسجده وخان العمدان."
  en: "Ahmad Pasha al-Jazzar (c. 1720/1730s–1804) was the Acre-based Ottoman governor of Sidon from 1776 until his death, and at intervals governor of Damascus. Born in Bosnia to a Christian family, he converted to Islam in Egypt, rose as an enforcer of Ali Bey al-Kabir — earning the name al-Jazzar, 'the Butcher', avenging his master on the Bedouin who killed him — and became famous for his successful defence of Acre against Napoleon in 1799 with British naval help, and for the buildings he left in Acre, among them his mosque and the Khan al-Umdan."
  ur: "احمد پاشا الجزار (تقریباً 1720ء/1730ء – 1804ء) عکہ میں مقیم عثمانی ایالت صیدا کے گورنر تھے، 1776ء سے وفات تک؛ وقفے وقفے سے دمشق کے بھی گورنر رہے۔ بوسنیا میں ایک عیسائی گھرانے میں پیدا ہوئے، مصر میں اسلام قبول کیا اور علی بے الکبیر کے خاص آدمی بنے؛ اپنے آقا کے قتل کا بدلہ لینے پر «جزار» یعنی قصاب کا لقب پایا۔ 1799ء میں برطانوی بحریہ کی مدد سے نپولین کے خلاف عکہ کے کامیاب دفاع اور عکہ میں اپنی تعمیرات، مسجد جزار اور خان العمدان، کے لیے مشہور ہیں۔"

