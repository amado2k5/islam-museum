summary:
  ar: "أحمد بن محمد بن عمر، أبو نصر وقيل أبو القاسم، زين الدين العتابي البخاري، عالم بالفقه والتفسير حنفي، نسبته إلى محلة العتابية ببخارى. من تصانيفه «شرح الزيادات»، و«جوامع الفقه»، و«شرح الجامع الكبير»، و«شرح الجامع الصغير»، و«التفسير». توفي سنة 586هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Ahmad ibn Muhammad ibn Umar, Abu Nasr or Abu al-Qasim, Zayn al-Din al-Atabi al-Bukhari, a Hanafi scholar of fiqh and exegesis, named for the Atabiyya quarter of Bukhara. His works include commentaries on al-Ziyadat and al-Jami' al-kabir and al-Jami' al-saghir, a collection of fiqh, and a tafsir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  fr: "Ahmad ibn Muhammad ibn Umar, Abu Nasr ou Abu al-Qasim, Zayn al-Din al-Atabi al-Bukhari, savant hanafite du fiqh et de l’exégèse, dont la nisba vient du quartier Atabiyya de Boukhara. Ses œuvres comprennent des commentaires d’al-Ziyadat, d’al-Jami’ al-kabir et d’al-Jami’ al-saghir, un recueil de fiqh et un tafsir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  es: "Ahmad ibn Muhammad ibn Umar, Abu Nasr o Abu al-Qasim, Zayn al-Din al-Atabi al-Bukhari, un erudito hanafí de fiqh y exégesis, llamado así por el barrio Atabiyya de Bukhara. Sus obras incluyen comentarios sobre al-Ziyadat y al-Jami' al-kabir y al-Jami' al-saghir, una colección de fiqh y un tafsir. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  ur: "احمد بن محمد ابن عمر، ابو نصر یا ابو القاسم، زین الدین العتیبی البخاری، فقہ و تفسیر کے حنفی عالم، بخارا کے عتبیہ سہ ماہی کے لیے نامزد کیا گیا۔ ان کی تصانیف میں الزیادات اور الجامع الکبیر اور الجامع الصغیر کی تفسیر، فقہ کا مجموعہ اور تفسیر شامل ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص3491}"
  tr: "Ahmed ibn Muhammed ibn Ömer, Ebu Nasr (veya Ebu el-Kasım), Zeyneddin el-Attabi el-Buhari, Buhara'nın el-Attabiyye mahallesinden adını alan, Hanefi fıkıh ve tefsir alimi. Eserleri arasında \"Şerh el-Ziyadet\" (Eklemeler Üzerine Tefsir), \"Cevami' el-Fıkıh\" (Fıkıh Özeti), \"Şerh el-Cami' el-Kebir\" (Büyük Derleme Üzerine Tefsir), \"Şerh el-Cami' el-Sağrir\" (Küçük Derleme Üzerine Tefsir) ve \"el-Tefsir\" (Tefsir) bulunmaktadır. Hicri 586 yılında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3491}"
  id: "Ahmad ibn Muhammad ibn Umar, Abu Nasr (atau Abu al-Qasim), Zayn al-Din al-Attabi al-Bukhari, seorang ulama fiqih dan tafsir Hanafi, dinamai menurut daerah al-Attabiyya di Bukhara. Di antara karya-karyanya adalah \"Sharh al-Ziyadat\" (Komentar tentang Tambahan), \"Jawami' al-Fiqh\" (Ringkasan Fiqih), \"Sharh al-Jami' al-Kabir\" (Komentar tentang Kumpulan Besar), \"Sharh al-Jami' al-Saghir\" (Komentar tentang Kumpulan Kecil), dan \"al-Tafsir\" (Tafsir). Beliau wafat pada tahun 586 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
