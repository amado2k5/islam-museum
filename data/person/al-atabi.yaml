summary:
  ar: "أحمد بن محمد بن عمر، أبو نصر وقيل أبو القاسم، زين الدين العتابي البخاري، عالم بالفقه والتفسير حنفي، نسبته إلى محلة العتابية ببخارى. من تصانيفه «شرح الزيادات»، و«جوامع الفقه»، و«شرح الجامع الكبير»، و«شرح الجامع الصغير»، و«التفسير». توفي سنة 586هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Ahmad ibn Muhammad ibn Umar, Abu Nasr or Abu al-Qasim, Zayn al-Din al-Atabi al-Bukhari, a Hanafi scholar of fiqh and exegesis, named for the Atabiyya quarter of Bukhara. His works include commentaries on al-Ziyadat and al-Jami' al-kabir and al-Jami' al-saghir, a collection of fiqh, and a tafsir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
