label: { ar: "توزون أمير الأمراء" }
summary:
  ar: "سار من واسط فقصد بغداد فدخلها في رمضان فخلع عليه المتقي وولاه أمير الأمراء، ثم وقعت الوحشة بينهما فكاتبه المتقي بالصلح فحلف وبالغ في الأيمان ثم قبض عليه ليلة وصوله وكحله وأدخله بغداد مسمول العينين وبايع للمستكفي ولم يحل الحول عليه حتى مات {cite:tarikh-khulafa-minhaj-1434 p. 610-611}. وعند المسعودي غلب على الأمر في خلافة المتقي وكان من رفقاء بجكم وخواص أصحابه، وانحدر إلى واسط لحرب البريديين وكانوا قد ملكوها وتغلبوا عليها {cite:muruj-al-dhahab p. 691-692}، وعند ابن الأثير قابله المتقي بالسندية فنزل وقبّل الأرض وقال ها أنا قد وفيت بيميني والطاعة لك وكما به وبالوزير وبالجماعة ثم كحله فأذهب عينيه وأمر بضرب الدبادب ليلاً لتخفى أصواتهم، وحمله من الغد إلى بغداد والجماعة في قبضته {cite:kamil-ibn-al-athir p. 313}، وعند ابن الجوزي وكان رئيس الجيش وأسير الأمراء وتقلد العدل مائة ألف درهم {cite:muntazam-ibn-al-jawzi p. 631} وعند ابن الجوزي كان سنة ثلاث وثلاثين رئيس الجيش وأسير الأمراء وتقلد الشرطة ببغداد، وكانت بينه وبين المتقي وحشة فأخذ أموال أهل بغداد وكسر بني حمدان ثم صالح المتقي فخلف أيمانه {cite:muntazam-ibn-al-jawzi p. 633}."
  en: "He entered Baghdad from Wasit in Ramadan and was made amir al-umara by al-Muttaqi; estranged, he swore mighty oaths of peace, then seized the returning caliph, blinded him and hailed al-Mustakfi — and died before the year turned {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
  es: "Entró en Bagdad desde Wasit en Ramadán y fue nombrado amir al-umara por al-Muttaqi; distanciado, juró solemnes juramentos de paz, luego apresó al califa que regresaba, lo cegó y aclamó a al-Mustakfi, y murió antes de que terminara el año {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
  fr: "Il entra à Bagdad depuis Wasit pendant le Ramadan et fut nommé amir al-umara par al-Muttaqi; brouillé, il prêta de puissants serments de paix, puis s'empara du calife de retour, l'aveugla et salua al-Mustakfi — et mourut avant la fin de l'année {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
  ur: "وہ وصیت سے رمضان میں بغداد میں داخل ہوئے اور المتقی کے ذریعہ امیر العمرہ بنا۔ الگ ہو کر، اس نے امن کی زبردست قسمیں کھائیں، پھر واپس آنے والے خلیفہ کو پکڑ لیا، اسے اندھا کر دیا اور المستکفی کی تعریف کی - اور سال بدلنے سے پہلے ہی انتقال کر گیا۔ 610-611}۔"
