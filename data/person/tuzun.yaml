label: { ar: "توزون أمير الأمراء" }
summary:
  ar: "سار من واسط فقصد بغداد فدخلها في رمضان فخلع عليه المتقي وولاه أمير الأمراء، ثم وقعت الوحشة بينهما فكاتبه المتقي بالصلح فحلف وبالغ في الأيمان ثم قبض عليه ليلة وصوله وكحله وأدخله بغداد مسمول العينين وبايع للمستكفي ولم يحل الحول عليه حتى مات {cite:tarikh-khulafa-minhaj-1434 p. 610-611}.، وعند المسعودي غلب على الأمر في خلافة المتقي وكان من رفقاء بجكم وخواص أصحابه، وانحدر إلى واسط لحرب البريديين وكانوا قد ملكوها وتغلبوا عليها {cite:muruj-al-dhahab p. 691-692}، وعند ابن الأثير قابله المتقي بالسندية فنزل وقبّل الأرض وقال ها أنا قد وفيت بيميني والطاعة لك وكما به وبالوزير وبالجماعة ثم كحله فأذهب عينيه وأمر بضرب الدبادب ليلاً لتخفى أصواتهم، وحمله من الغد إلى بغداد والجماعة في قبضته {cite:kamil-ibn-al-athir p. 313}"
  en: "He entered Baghdad from Wasit in Ramadan and was made amir al-umara by al-Muttaqi; estranged, he swore mighty oaths of peace, then seized the returning caliph, blinded him and hailed al-Mustakfi — and died before the year turned {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
