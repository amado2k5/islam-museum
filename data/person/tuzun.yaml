label: { ar: "توزون أمير الأمراء" }
summary:
  ar: "سار من واسط فقصد بغداد فدخلها في رمضان فخلع عليه المتقي وولاه أمير الأمراء، ثم وقعت الوحشة بينهما فكاتبه المتقي بالصلح فحلف وبالغ في الأيمان ثم قبض عليه ليلة وصوله وكحله وأدخله بغداد مسمول العينين وبايع للمستكفي ولم يحل الحول عليه حتى مات {cite:tarikh-khulafa-minhaj-1434 p. 610-611}.، وعند المسعودي غلب على الأمر في خلافة المتقي وكان من رفقاء بجكم وخواص أصحابه، وانحدر إلى واسط لحرب البريديين وكانوا قد ملكوها وتغلبوا عليها {cite:muruj-al-dhahab p. 691-692}"
  en: "He entered Baghdad from Wasit in Ramadan and was made amir al-umara by al-Muttaqi; estranged, he swore mighty oaths of peace, then seized the returning caliph, blinded him and hailed al-Mustakfi — and died before the year turned {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
