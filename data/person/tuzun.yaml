label: { ar: "توزون أمير الأمراء" }
summary:
  ar: "سار من واسط فقصد بغداد فدخلها في رمضان فخلع عليه المتقي وولاه أمير الأمراء، ثم وقعت الوحشة بينهما فكاتبه المتقي بالصلح فحلف وبالغ في الأيمان ثم قبض عليه ليلة وصوله وكحله وأدخله بغداد مسمول العينين وبايع للمستكفي ولم يحل الحول عليه حتى مات {cite:tarikh-khulafa-minhaj-1434 p. 610-611}. وعند المسعودي غلب على الأمر في خلافة المتقي وكان من رفقاء بجكم وخواص أصحابه، وانحدر إلى واسط لحرب البريديين وكانوا قد ملكوها وتغلبوا عليها {cite:muruj-al-dhahab p. 691-692}، وعند ابن الأثير قابله المتقي بالسندية فنزل وقبّل الأرض وقال ها أنا قد وفيت بيميني والطاعة لك وكما به وبالوزير وبالجماعة ثم كحله فأذهب عينيه وأمر بضرب الدبادب ليلاً لتخفى أصواتهم، وحمله من الغد إلى بغداد والجماعة في قبضته {cite:kamil-ibn-al-athir p. 313}، وعند ابن الجوزي وكان رئيس الجيش وأسير الأمراء وتقلد العدل مائة ألف درهم {cite:muntazam-ibn-al-jawzi p. 631} وعند ابن الجوزي كان سنة ثلاث وثلاثين رئيس الجيش وأسير الأمراء وتقلد الشرطة ببغداد، وكانت بينه وبين المتقي وحشة فأخذ أموال أهل بغداد وكسر بني حمدان ثم صالح المتقي فخلف أيمانه {cite:muntazam-ibn-al-jawzi p. 633}."
  en: "He entered Baghdad from Wasit in Ramadan and was made amir al-umara by al-Muttaqi; estranged, he swore mighty oaths of peace, then seized the returning caliph, blinded him and hailed al-Mustakfi — and died before the year turned {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
  es: "Entró en Bagdad desde Wasit en Ramadán y fue nombrado amir al-umara por al-Muttaqi; distanciado, juró solemnes juramentos de paz, luego apresó al califa que regresaba, lo cegó y aclamó a al-Mustakfi, y murió antes de que terminara el año {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
  fr: "Il entra à Bagdad depuis Wasit pendant le Ramadan et fut nommé amir al-umara par al-Muttaqi; brouillé, il prêta de puissants serments de paix, puis s'empara du calife de retour, l'aveugla et salua al-Mustakfi — et mourut avant la fin de l'année {cite:tarikh-khulafa-minhaj-1434 p. 610-611}."
  ur: "وہ وصیت سے رمضان میں بغداد میں داخل ہوئے اور المتقی کے ذریعہ امیر العمرہ بنا۔ الگ ہو کر، اس نے امن کی زبردست قسمیں کھائیں، پھر واپس آنے والے خلیفہ کو پکڑ لیا، اسے اندھا کر دیا اور المستکفی کی تعریف کی - اور سال بدلنے سے پہلے ہی انتقال کر گیا۔ 610-611}۔"
  tr: "Wasit'ten ayrıldı ve Ramazan ayında girdiği Bağdat'a gitti. Al-Muttaqi onu tahttan indirdi ve Prenslerin Komutanı olarak atadı. Sonra aralarında bir anlaşmazlık çıktı ve Al-Muttaqi ona bir uzlaşma için yazdı, bu yüzden yemin etti ve yemin etti, sonra geldiği gece tutukladı, sürmeyle örttü ve 'kör göz' ile Bağdat'a götürdü, el-Mustakfi'ye bağlılık yemini etti. Ölene kadar bir yıl bile yoktu {atıf:Tarikh-Khulafa-minhaj-1434, s. 610-611}. al-Mas'udi'ye göre, el-Muttaqi halifeliği sırasında galip gelmiş ve Bajkam'ın yoldaşları ile sahabelerinin yakın yoldaşları arasındaydı. Wasit'e inerek daha önce hüküm sürmüş ve yenmiş olan Buraidilerle savaşmıştır {atıf:muruj-al-dhahab, s. 691-692}. İbn al-Athir ile birlikte, al-Mutaqi onu al-Sindiyyah ile karşıladı; Sindiyye atından indi, yere öptü ve dedi ki, 'Burada sağ elimle doldum ve itaat senin, bakanın ve grubun olduğu gibi.' Sonra gözlerini kaçırdı, gece kertenkelelerin dövülmesini emretti ki seslerini sustursun, ertesi günden onu elinde tutan grupla birlikte Bağdat'a taşıdı {alıntı: Kamil-ibn-al-Athir s. 313} ve İbn al-Jawzi'ye göre, ordu komutanı ve prenslerin esiriydi, yüz bin dirhem adalet makamına sahipti {atıf:Muntazam-ibn-al-jawzi s. 631}. İbn al-Jawzi'ye göre, 333 yılında ordunun başı ve prenslerin esiriydi, ayrıca Bağdat'ta polis görevini yürüttü. Kendisi ile el-Muttaki arasında bir anlaşmazlık çıktı, bu yüzden Bağdat halkının servetini aldı, Banu Hamdan'ı kırdı, ardından al-Muttaqi ile barıştı ve sağ kolunu bıraktı {atı:Muntazam-ibn-al-jawzi s. 633}."
  id: "Ia berangkat dari Wasit dan menuju Baghdad, di mana ia masuk selama Ramadan. Al-Muttaqi mencopotnya dan mengangkatnya sebagai Komandan Para Pangeran. Kemudian terjadi konflik di antara mereka, dan Al-Muttaqi menulis surat kepadanya untuk mencari penyelesaian, sehingga ia bersumpah dan bersumpah, lalu menangkapnya pada malam kedatangannya, menutupinya dengan kohl, dan membawanya ke Baghdad dengan 'mata buta', bersumpah setia kepada al-Mustakfi. Ia tidak memiliki uang setahun pun sampai ia meninggal {cite:Tarikh-Khulafa-minhaj-1434, hlm. 610-611}. Menurut al-Mas'udi, ia menang selama masa khalifah al-Muttaqi dan termasuk di antara para sahabat Bajkam dan sahabat dekat para sahabatnya. Ia turun ke Wasit untuk melawan Buraidi, yang telah memerintah dan mengalahkannya {cite:muruj-al-dhahab, hlm. 691-692}. Bersama Ibn al-Athir, al-Mutaqi menemuinya bersama al-Sindiyyah, yang turun dari kuda, mencium tanah, dan berkata, 'Di sini aku telah terpenuhi dengan tangan kananku, dan ketaatan adalah milikmu, begitu juga dia, menteri, dan kelompok.' Kemudian ia mengalihkan pandangannya, dan memerintahkan pemukulan kadal di malam hari agar suara mereka diam, dan membawanya dari hari berikutnya ke Baghdad dengan kelompok itu dalam genggamannya {cite: kamil-ibn-al-athir hlm. 313} dan menurut Ibn al-Jawzi, ia adalah kepala tentara dan tahanan para pangeran, memegang jabatan keadilan seratus ribu dirham {cite:Muntazam-ibn-al-jawzi hlm. 631}. Menurut Ibn al-Jawzi, pada tahun 333, ia adalah kepala tentara dan tahanan para pangeran, serta menjabat sebagai polisi di Baghdad. Terjadi perselisihan antara ia dan al-Muttaqi, sehingga ia mengambil harta rakyat Baghdad, memecahkan Banu Hamdan, lalu mendamaikan al-Muttaqi dan meninggalkan kanannya {cite:Muntazam-ibn-al-jawzi hlm. 633}."
