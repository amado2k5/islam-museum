summary:
  ar: جمع روايات الإمام أحمد وكتبها بالأسانيد في كتاب «الجامع» الذي يُعدّ أصل المذهب، ومهّد بذلك لتدوين فقه الحنابلة.
  en: "He gathered Imam Ahmad's transmitted answers and wrote them down with their chains of transmission in the book al-Jami', which counts as the foundation of the school, and so prepared the way for the writing down of Hanbali jurisprudence."
  fr: "Il réunit les réponses transmises de l'imam Ahmad et les consigna avec leurs chaînes de transmission dans le livre al-Jami', qui passe pour le fondement de l'école, préparant ainsi la mise par écrit du droit hanbalite."
  es: "Recopiló las respuestas transmitidas por el Imam Ahmad y las transcribió con sus cadenas de transmisión en el libro al-Jami', que se considera el fundamento de la escuela, y así preparó el camino para la redacción de la jurisprudencia Hanbali."
  ur: "اس نے امام احمد کے نقل شدہ جوابات کو جمع کیا اور انہیں کتاب الجامع میں اپنی زنجیروں کے ساتھ تحریر کیا، جو مکتب کی بنیاد شمار ہوتی ہے، اور اس طرح حنبلی فقہ کو لکھنے کا راستہ تیار کیا۔"
  tr: "İmam Ahmed'in rivayetlerini derleyip, isnad zincirleriyle birlikte \"El-Cami'\" adlı kitapta kaleme aldı; bu kitap, Hanbeli fıkıhının temeli olarak kabul edilir ve böylece Hanbeli fıkıhının kodifikasyonunun yolunu açtı."
  id: "Ia mengumpulkan riwayat-riwayat Imam Ahmad dan menuliskannya beserta sanadnya dalam kitab “Al-Jami’”, yang dianggap sebagai landasan mazhab tersebut, dan dengan demikian membuka jalan bagi kodifikasi yurisprudensi Hanbali."
