summary:
  ar: "محدث هندي ⁦(1865–1935)⁩ من أعلام أهل الحديث في شبه القارة. اشتهر بشرحه «تحفة الأحوذي بشرح جامع الترمذي» في عشرة مجلدات، وهو أوسع شروح الترمذي حتى اليوم، وله «أبكار المنن في التنقيح لما في التهذيب من الفن» وتحقيقات حديثية أخرى."
  en: "Indian hadith scholar (1865–1935), a luminary of the Ahl-i Hadith in the subcontinent. He is famed for Tuhfat al-Ahwadhi bi-Sharh Jami' al-Tirmidhi in ten volumes — still the widest commentary on Tirmidhi — and for Abkar al-Minan and other hadith studies."
  fr: "Spécialiste indien du hadith (1865–1935), figure éminente des Ahl-i Hadith du sous-continent. Il est célèbre pour la Tuhfat al-Ahwadhi bi-Sharh Jami' al-Tirmidhi en dix volumes — toujours le plus vaste commentaire d'al-Tirmidhi — et pour l'Abkar al-Minan et d'autres études de hadith."
  ur: "ہندوستانی محدث ⁦(1865–1935)⁩ جو برِصغیر میں اہلِ حدیث کے ممتاز علماء میں شمار ہوتے ہیں۔ وہ دس جلدوں پر مشتمل «تحفۃ الاحوذی بشرح جامع الترمذی» کے لیے معروف ہیں جو آج تک ترمذی کی وسیع ترین شرح ہے؛ ان کی دیگر تصانیف میں «ابکار المنن» اور حدیثی تحقیقات شامل ہیں۔"
  es: "Erudito indio de hadices (1865-1935), figura destacada de la comunidad Ahl-i Hadith en el subcontinente. Es famoso por su obra Tuhfat al-Ahwadhi bi-Sharh Jami' al-Tirmidhi, en diez volúmenes —que sigue siendo el comentario más extenso sobre Tirmidhi—, así como por Abkar al-Minan y otros estudios sobre hadices."
  tr: "Hint hadis alimi (1865–1935), Hint alt kıtasındaki hadis âlimlerinin önde gelen isimlerinden biriydi. On ciltlik \"Tuhfat al-Ahwadhi bi Sharh Jami’ al-Tirmidhi\" adlı eseriyle ünlüdür; bu eser, günümüze kadar ulaşmış en kapsamlı Tirmidhi tefsiridir. Ayrıca \"Abkar al-Minan fi al-Tanqih lima fi al-Tahdhib min al-Fann\" ve diğer hadis araştırmalarını da kaleme almıştır."
  id: "Seorang ulama hadits India (1865–1935) yang merupakan salah satu tokoh terkemuka dalam bidang hadits di anak benua India. Beliau terkenal karena penjelasannya tentang “Tuhfat al-Ahwadhi bi Sharh Jami’ al-Tirmidhi” dalam sepuluh jilid, yang hingga kini merupakan tafsir paling komprehensif atas kitab al-Tirmidhi. Beliau juga menulis “Abkar al-Minan fi al-Tanqih lima fi al-Tahdhib min al-Fann” dan kajian hadits lainnya."
