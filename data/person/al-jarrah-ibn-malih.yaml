summary:
  ar: "الجراح بن مليح، والد المحدث وكيع، تولى بيت المال في بغداد وكان على دار الضرب بالري في دولة الرشيد؛ اختلف النقاد فيه بين توثيق أبي داود وتضعيف ابن سعد وابن معين في رواية وقول الدارقطني فيه ليس بشيء، وتوفي سنة 175 أو 176 هـ."
  en: "Al-Jarrah ibn Malih, father of the hadith scholar Waki', held the treasury in Baghdad and ran the mint at Rayy under al-Rashid; critics differed, from Abu Dawud's trust to the weakness noted by Ibn Sa'd, one report from Ibn Ma'in and al-Daraqutni's verdict that he was nothing, and he died in 175 or 176 AH."
