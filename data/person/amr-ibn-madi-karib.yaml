label: { ar: "عمرو بن معدي كرب الزبيدي", en: "Amr ibn Ma'di Karib al-Zubaydi" }
summary:
  ar: "عمرو بن معدي كرب الزبيدي؛ غزا الري أول ما غزيت فلما انصرف توفي فدفن فوق روذة وبوسنة بموضع يسمى كرمانشاهان.، وسأله عمر عن قبائل العرب فقال في مذحج وعلة بن جلد وسعد العشيرة ومراد وطيء وعبس وحمير وكندة وهمدان والأزد ولخم وجذام وغسان والأوس والخزرج وخزاعة أقواله المشهورة، وقال فيمن لا يخاف لقاءه إلا حرّيها عامر بن الطفيل وعيينة بن الحارث التميمي وعبديها عنترة العبسي وسليك المناقب، ووصف الحرب مرة المذاق من صبر فيها ظفر ومن ضعف فيها هلك وأنشد الحرب أول ما تكون فتية، فقال هنالك قارعتك أمك عن ثكلها فعلاه عمر بالدرة وقال والله إني لأهم أن أقطع لسانك فقال عمرو الحمى أضرعتني لك اليوم {cite:muruj-al-dhahab p. 619-622}"
  en: "Amr ibn Ma'di Karib al-Zubaydi, the famous knight-poet; he raided Rayy on its first campaign, died on the way back, and was buried above Rawdha and Bawsana at a spot called Kirmanshahan."
