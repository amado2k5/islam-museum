summary:
  ar: "صدقة بن علي بن صدقة بن دينار مولى الأزد؛ عاث وأفسد بأذربيجان مع الوجناء بن الرواد وحارب أهل أرمية حتى دخلها وغلب عليها وبنى وإخوته بها قصوراً."
  en: "Sadaqa ibn Ali ibn Sadaqa ibn Dinar, the Azd's mawla; he ravaged Azerbaijan with al-Wajna' ibn al-Rawwad, fought Urmiya's people till he mastered it, and built palaces there with his brothers."
  es: "Sadaqa ibn Ali ibn Sadaqa ibn Dinar, el mawla de Azd; asoló Azerbaiyán con al-Wajna' ibn al-Rawwad, luchó contra el pueblo de Urmía hasta que la dominó y construyó palacios allí con sus hermanos."
  fr: "Sadaqa ibn Ali ibn Sadaqa ibn Dinar, le mawla d'Azd; il ravagea l'Azerbaïdjan avec al-Wajna' ibn al-Rawwad, combattit le peuple d'Urmiya jusqu'à le maîtriser, et y construisit des palais avec ses frères."
  ur: "صدقہ ابن علی ابن صدقہ ابن دینار، ازد کے مولا؛ اس نے الوجنا ابن الرواد کے ساتھ مل کر آذربائیجان کو تباہ کیا، ارمیہ کے لوگوں سے لڑا یہاں تک کہ اس نے اس پر عبور حاصل کر لیا، اور اپنے بھائیوں کے ساتھ وہاں محلات بنائے۔"
  tr: "Sadaqah ibn Ali ibn Sadaqah ibn Dinar, Al-Ezd'in özgür kasabı; el-Vecna ibn el-Rüvad ile birlikte Azerbaycan'da yıkım ve yozlaşmaya yol açtı, Urmiye halkıyla savaştı, şehri ele geçirdi ve kardeşleriyle birlikte orada saraylar inşa etti."
  id: "Sadaqah ibn Ali ibn Sadaqah ibn Dinar, mantan budak Al-Azd; ia menyebabkan kekacauan dan korupsi di Azerbaijan bersama al-Wajna' ibn al-Ruwad, melawan rakyat Urmia hingga ia masuk, menguasainya, dan membangun istana di sana bersama saudara-saudaranya."
