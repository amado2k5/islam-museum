summary:
  ar: "جنرال مسلم من الهوي (1892–1970)، ابن ما فوشيانغ وابن أخي ما فولو، ورث جيش أبيه وحكم نينغشيا (1931–1949) حكمًا شديدًا، وقاتل اليابانيين والشيوعيين، فلما انتصر الشيوعيون هاجر إلى الولايات المتحدة وتوفي في لوس أنجلوس ودُفن في مقبرة تايبيه الإسلامية."
  en: "A Hui Muslim general (1892–1970), the son of Ma Fuxiang and nephew of Ma Fulu, who inherited his father's army and ruled Ningxia with a heavy hand (1931–1949), fought the Japanese and the Communists, and on the Communist victory emigrated to the United States, dying at Los Angeles and being buried in Taipei's Muslim cemetery."
  ur: "ایک ہوئی مسلمان جنرل (1892ء–1970ء)، ما فو زیانگ کے بیٹے اور ما فولو کے بھتیجے، جنہوں نے اپنے والد کی فوج وراثت میں پائی اور ننگ شیا پر سخت حکومت کی (1931ء–1949ء)، جاپانیوں اور کمیونسٹوں سے لڑے، اور کمیونسٹ فتح پر امریکا ہجرت کر گئے، لاس اینجلس میں وفات پائی اور تائپے کے مسلمان قبرستان میں دفن ہوئے۔"
