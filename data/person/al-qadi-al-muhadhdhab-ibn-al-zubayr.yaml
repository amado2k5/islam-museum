died: { edtf: "1166", hijri: "0561", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي بالقاهرة سنة إحدى وستين وخمسمائة في رجب {cite:wafayat-ayan}." }
summary:
  ar: "القاضي المهذب أبو علي أحمد بن الحسن بن علي؛ أخو القاضي الرشيد بن الزبير؛ كانا مجيدين في نظمهما ونثرهما وله ديوان شعر؛ أول شعر قاله سنة ست وعشرين وخمسمائة؛ وهو أشعر من الرشيد والرشيد أعلم منه في سائر العلوم؛ ذكره العماد الكاتب في «السل والذيل» {cite:wafayat-ayan}."
  en: "Al-Qadi al-Muhadhdhab Ahmad b. al-Hasan (d. 561, Cairo) — brother of al-Rashid b. al-Zubayr; diwan poet whose first verse dates to 526, judged the better poet and lesser scholar of the two {cite:wafayat-ayan}."
  fr: "Al-Qadi al-Muhadhdhab Ahmad b. al-Hasan (mort en 561, Le Caire) – frère d’al-Rashid b. al-Zubayr ; poète diwan dont le premier verset date de 526, a jugé le meilleur poète et le moindre érudit des deux {cite:wafayat-ayan}."
  es: "Al-Qadi al-Muhadhdhab Ahmad b. al-Hasan (m. 561, El Cairo) — hermano de al-Rashid b. al-Zubayr; poeta diwan cuyo primer verso data de 526, considerado el mejor poeta y el menos erudito de los dos {cite:wafayat-ayan}."
  ur: "القادی المحدثاب احمد بی۔ الحسن ⁦(متوفی 561، قاہرہ)⁩ - الرشید بن کے بھائی۔ الزبیر؛ دیوان شاعر جس کی پہلی آیت 526 کی ہے، نے دونوں میں سے بہتر شاعر اور کم علمی کا فیصلہ کیا۔"
  tr: "Nazik yargıç Ebu Ali Ahmed bin el-Hasan ibn Ali; el-Kadi el-Reşid ibn el-Zubeyr'in kardeşi; hem şiir hem de düzyazı konusunda yetenekliydiler. Bir şiir koleksiyonu vardır; ilk şiirini 526 Hicri yılında yazmıştır; el-Reşid'den daha şiirsel ve tüm bilimlerde ondan daha bilgilidir; el-İmad el-Katib tarafından 'al-Sal wa al-Dhayl' {atıf:wafayat-ayan} adlı eserinde anılmıştır."
  id: "Hakim terhormat Abu Ali Ahmad ibn al-Hasan ibn Ali; saudara al-Qadi al-Rashid ibn al-Zubayr; mereka mahir dalam puisi dan prosa. Ia memiliki kumpulan puisi; puisi pertama yang ia ciptakan adalah pada tahun 526 H; ia lebih puitis daripada al-Rashid dan lebih berpengetahuan dalam semua ilmu pengetahuan; ia disebutkan oleh al-Imad al-Katib dalam 'al-Sal wa al-Dhayl' {cite:wafayat-ayan}."
