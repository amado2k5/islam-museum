roles: [scholar]
gender: male
summary:
  ar: "عيسى بن مسكين الإفريقي، أبو محمد، شيخ المالكية بالمغرب وصاحب سحنون، وصفه الذهبي بالثقة الورع العابد وتولى القضاء مكرهاً، وتوفي سنة 295 هـ."
  en: "Isa ibn Miskin al-Ifriqi, Abu Muhammad, shaykh of the Maliki school in the Maghrib and companion of Sahnun, whom al-Dhahabi calls trustworthy, scrupulous and devout; he took the judgeship unwillingly and died in 295 AH."
  es: "Isa ibn Miskin al-Ifriqi, Abu Muhammad, jeque de la escuela Maliki en el Magreb y compañero de Sahnun, a quien al-Dhahabi llama digno de confianza, escrupuloso y devoto; aceptó el cargo de juez a regañadientes y murió en el año 295 de la Hégira."
  fr: "Isa ibn Miskin al-Ifriqi, Abu Muhammad, cheikh de l'école malikite au Maghreb et compagnon de Sahnun, que al-Dhahabi qualifie de digne de confiance, scrupuleux et pieux; il accepta la charge de juge à contrecœur et mourut en 295 AH."
  ur: "عیسیٰ بن مسکین العفریقی، ابو محمد، مغرب میں مالکی مکتبہ کے شیخ اور سہنون کے ساتھی، جنہیں الذہبی نے ثقہ، دیانت دار اور متقی قرار دیا ہے۔ انہوں نے ناخوشگوار عہدہ سنبھال لیا اور 295ھ میں وفات پائی۔"
  tr: "Fas'taki Maliki şeyhi ve Sahnun'un yazarı İsa ibn Miskin el-İfriki, Ebu Muhammed, el-Dhahabi tarafından güvenilir, dindar ve dindar olarak tanımlanmış, yargıyı isteksizce üstlenmiş ve 295 Hicri yılında ölmüştür."
  id: "Isa ibn Miskin al-Ifriki, Abu Muhammad, sheikh Maliki di Maroko dan penulis Sahnun, digambarkan oleh al-Dhahabi sebagai orang yang dapat dipercaya, saleh, dan taat, yang dengan enggan mengambil alih kehakiman, dan meninggal pada tahun 295 H."
