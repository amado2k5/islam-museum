summary:
  ar: "عالم أزهري مصري ⁦(ت. 1352 هـ)⁩ من المدافعين عن السنة في مواجهة البدع الشعبية، صاحب كتاب فتاوى أئمة المسلمين. مذهبه الفقهي المالكي بحسب ما يذكره مرجع الترجمة."
  ur: "ازہر کے تربیت یافتہ مصری سنی عالم ⁦(و. ۱۳۵۲ھ)⁩، عوامی بدعات کے مخالف، اور فتاوائے ائمۃ المسلمین کے مصنف۔"
  en: "Egyptian Azhar-trained Sunni scholar (d. 1352 AH) who opposed popular innovations, author of Fatawa A'immat al-Muslimin. His fiqh school is Maliki according to the reference cited."
  es: "Erudito sunita egipcio formado en Al-Azhar (fallecido en 1352 AH) que se opuso a las innovaciones populares, autor de Fatawa A'immat al-Muslimin. Según la referencia citada, su escuela de jurisprudencia islámica es la malikí."
  fr: "Érudit sunnite égyptien formé à Al-Al-Azhar (mort en 1352 AH), opposé aux innovations populaires, auteur de Fatawa A'immat al-Muslimin. Son école de jurisprudence islamique est malikite, selon la référence citée."
