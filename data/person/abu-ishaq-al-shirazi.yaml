summary:
  ar: فقيه شافعي وأصولي، صاحب «طبقات الفقهاء» و«المهذب»؛ وُلد بفيروزآباد سنة 393هـ، ودرس بفارس والبصرة ثم بغداد، وأصبح من كبار فقهاء الشافعية في عصره، وامتنع عن قضاء القضاة حين عرضه عليه الخليفة. وقرر لتدريس المدرسة النظامية ببغداد لما فرغت سنة 459هـ فاجتمع الناس فلم يحضر واختفى فدرس ابن الصباغ، ثم تلطفوا به حتى أجاب ودرس {cite:tarikh-khulafa-minhaj-1434 p. 645-646}. وفي فتنة الحنابلة والأشعرية مال إلى نصرة ابن القشيري وكتب إلى نظام الملك يشكو الحنابلة، ولما اشتدت الفتنة مضى إلى باب الطاق وأخذ في إعداد أهبة السفر فأنفذ إليه الخليفة من رده عن رأيه، وفي مجلس الصلح الذي عقده الوزير حضر فقال للشريف أبي جعفر «إنا ذاك الذي تعرف وهذه كتبي في أصول الفقه أقول فيها خلافاً للأشعرية» فقبل رأسه فأجابه الشريف «قد كان ما تقول، إلا أنك لما كنت فقيراً لم يظهر لنا ما في نفسك، فلما جاءك الأعوان والسلطان وخواجا بزوك أبديت ما كان مخفياً» {cite:muntazam-ibn-al-jawzi j.8 p.647-648}.
  en: A Shafi'i jurist and usulist, author of Tabaqat al-fuqaha and al-Muhadhdhab; born at Firuzabad in 393 AH, studied in Fars, Basra and Baghdad, and became one of the leading Shafi'i jurists of his time;
    he declined the chief qadiship when the caliph offered it.
  ur: "شافعی فقیہ اور اصولی، «طبقات الفقہاء» اور «المھذب» کے مصنف؛ 393ھ میں فیروزآباد میں پیدا ہوئے، فارس، بصرہ اور بغداد میں پڑھے اور اپنے عصر کے ممتاز شافعی فقہاء میں شمار ہوئے؛ خلیفہ کے پیش کردہ قاضی القضاة کے منصب سے انہوں نے انکار کیا {cite:tarikh-khulafa-minhaj-1434 p. 645-646}۔"
  fr: "Juriste et théoricien du droit shafiite, auteur des Tabaqat al-fuqaha et d'al-Muhadhdhab ; né à Firuzabad en 393 H, il étudia au Fars, à Bassora et à Bagdad, et devint l'un des principaux juristes shafiites de son temps ; il déclina la charge de grand cadi quand le calife la lui offrit."
  es: "Jurista y usulista shafi'í, autor de Tabaqat al-fuqaha y al-Muhadhdhab; nació en Firuzabad en el año 393 de la Hégira, estudió en Fars, Basora y Bagdad, y se convirtió en uno de los juristas shafi'íes más destacados de su tiempo; rechazó el cargo de cadí principal cuando el califa se lo ofreció."
  tr: "Şafiî fıkıhçısı ve İslam hukuk alimi, \"Tabaqat al-Fuqaha\" (Fukuhçuların Biyografik Sözlüğü) ve \"Al-Muhadhdhab\" (Saf) adlı eserlerin yazarı. Hicri 393 yılında Firuzabad'da doğdu, Fars, Basra ve ardından Bağdat'ta eğitim gördü ve zamanının önde gelen Şafiî fıkıhçılarından biri oldu. Halife kendisine Başkadılık teklif ettiğinde bunu reddetti. Hicri 459 yılında Bağdat'taki Nizamiyye Medresesi tamamlandığında orada öğretim görevlisi olarak atandı. İnsanlar toplandı, ancak o katılmadı ve saklandı. İbn al-Sabbagh orada ders verdi, ancak onu ikna ettiler ve sonunda ders vermeyi kabul etti. {cite:tarikh-khulafa-minhaj-1434 p. 645-646} Hanbeliler ve Eş'ariler arasındaki çatışma sırasında İbn el-Kuşeyri'nin tarafını tuttu ve Nizam el-Mulk'a Hanbeliler hakkında şikayette bulundu. Çatışma şiddetlenince Bab el-Tak'a gitti ve seyahat hazırlıklarına başladı. Halife, onu bu görüşünden vazgeçirmek için birini gönderdi. Vezir tarafından düzenlenen uzlaşma konseyinde hazır bulundu ve Şerif Ebu Cafer'e, \"Tanıdığınız kişi benim ve bunlar, Eş'arilere aykırı şeyler söylediğim fıkıh esasları hakkındaki kitaplarımdır\" dedi. Başını öptü ve Şerif şöyle cevap verdi: \"Söyledikleriniz doğru, ancak fakir olduğunuz zaman kalbinizdekiler bize açık değildi. Yardımcılar, Sultan ve Hoca Buzuk size geldiğinde, gizli olanı açığa çıkardınız.\" {cite:muntazam-ibn-al-jawzi j.8 p.647-648}"
  id: "Seorang ahli hukum dan cendekiawan fiqih Islam mazhab Syafi'i, penulis \"Tabaqat al-Fuqaha\" (Kamus Biografi Para Ahli Hukum) dan \"Al-Muhadhdhab\" (Yang Terpuji). Beliau lahir di Firuzabad pada tahun 393 H, belajar di Fars, Basra, dan kemudian Baghdad, dan menjadi salah satu ahli hukum Syafi'i terkemuka pada masanya. Beliau menolak jabatan Ketua Mahkamah Agung ketika Khalifah menawarkannya kepadanya. Beliau diangkat untuk mengajar di Madrasah Nizamiyya di Baghdad ketika selesai dibangun pada tahun 459 H. Orang-orang berkumpul, tetapi beliau tidak hadir dan bersembunyi. Ibn al-Sabbagh mengajar di sana, tetapi mereka membujuknya hingga beliau setuju dan mengajar. {cite:tarikh-khulafa-minhaj-1434 p. 645-646} Selama konflik antara mazhab Hanbali dan Asy'ari, ia memihak Ibn al-Qushayri dan menulis surat kepada Nizam al-Mulk yang berisi keluhan tentang mazhab Hanbali. Ketika konflik semakin intensif, ia pergi ke Bab al-Taq dan mulai mempersiapkan perjalanan. Khalifah mengirim seseorang untuk membujuknya agar mengubah pendapatnya. Dalam dewan rekonsiliasi yang diadakan oleh menteri, ia hadir dan berkata kepada Syarif Abu Ja'far, \"Saya orang yang Anda kenal, dan ini adalah buku-buku saya tentang prinsip-prinsip fiqih di mana saya mengatakan sesuatu yang bertentangan dengan mazhab Asy'ari.\" Ia mencium kepalanya, dan Syarif menjawab, \"Apa yang Anda katakan itu benar, tetapi ketika Anda miskin, apa yang ada di hati Anda tidak tampak bagi kami. Ketika para penolong, Sultan, dan Khawaja Buzuk datang kepada Anda, Anda mengungkapkan apa yang tersembunyi.\" {cite:muntazam-ibn-al-jawzi j.8 p.647-648}."
