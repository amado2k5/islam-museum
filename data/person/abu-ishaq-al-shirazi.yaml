summary:
  ar: فقيه شافعي وأصولي، صاحب «طبقات الفقهاء» و«المهذب»؛ وُلد بفيروزآباد سنة 393هـ، ودرس بفارس والبصرة ثم بغداد، وأصبح من كبار فقهاء الشافعية في عصره، وامتنع عن قضاء القضاة حين عرضه عليه الخليفة. وقرر لتدريس المدرسة النظامية ببغداد لما فرغت سنة 459هـ فاجتمع الناس فلم يحضر واختفى فدرس ابن الصباغ، ثم تلطفوا به حتى أجاب ودرس {cite:tarikh-khulafa-minhaj-1434 p. 645-646}.
  en: A Shafi'i jurist and usulist, author of Tabaqat al-fuqaha and al-Muhadhdhab; born at Firuzabad in 393 AH, studied in Fars, Basra and Baghdad, and became one of the leading Shafi'i jurists of his time;
    he declined the chief qadiship when the caliph offered it.
