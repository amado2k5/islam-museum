summary:
  ar: "كاتبة بريطانية هندية وعميلة في منظمة العمليات الخاصة البريطانية خلال الحرب العالمية الثانية (1914–1944)، وُلدت في موسكو ونشأت في لندن وسوريسن قرب باريس؛ أول مشغّلة لاسلكي تُرسل إلى فرنسا المحتلة، اعتُقلت وأُعدمت في معسكر داخاو، ومُنحت بعد وفاتها وسام صليب جورج وصليب الحرب الفرنسي."
  en: "British-Indian writer and agent of the Special Operations Executive in the Second World War (1914–1944), born in Moscow and raised in London and Suresnes near Paris. The first female wireless operator sent into occupied France, she was captured and executed at Dachau concentration camp, and was posthumously awarded the George Cross and the French Croix de Guerre."
  ur: "برطانوی ہندوستانی مصنفہ اور دوسری جنگ عظیم میں برطانوی اسپیشل آپریشنز ایگزیکٹو کی ایجنٹ (1914–1944)، ماسکو میں پیدا ہوئیں اور لندن و پیرس کے قریب سریسنیس میں پلی بڑھیں؛ مقبوضہ فرانس بھیجی جانے والی پہلی خاتون وائرلیس آپریٹر، گرفتار ہو کر داخاؤ کیمپ میں قتل کی گئیں اور بعد از وفات جارج کراس اور فرانسیسی صلیبِ جنگ سے نوازی گئیں۔"
