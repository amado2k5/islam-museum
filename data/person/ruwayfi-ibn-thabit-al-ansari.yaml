summary:
 ar: "رويفع بن ثابت بن السكن بن عدي الأنصاري المدني، صحابي، سكن مصر، وأمره معاوية على طرابلس الغرب سنة 46 ه فغزا أفريقية. روى عن النبي وروى عنه بُسر بن عبد الله وحنش الصنعاني وزياد بن عبيد وغيرهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13754}. والكتاب يذكر وفاته (؟-56 ه)."
 en: "Ruwayfi ibn Thabit ibn al-Sakan ibn Adi al-Ansari al-Madani, a companion who settled in Egypt. Mu'awiya appointed him over Tripoli of the West in 46 AH and he campaigned in Ifriqiya. He narrated from the Prophet, and Busr ibn Abd Allah, Hanash al-San'ani and Ziyad ibn Ubayd narrated from him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13754}. The book gives his death as 56 AH."
 ur: "رویفع بن ثابت بن سکن بن عدی انصاری مدنی، صحابی، جنہوں نے مصر میں سکونت اختیار کی۔ معاویہ نے انہیں 46 ہجری میں طرابلس الغرب پر مقرر کیا اور وہ افریقہ میں جہاد کے لیے نکلے۔ انہوں نے نبی سے روایت کی، اور ان سے بسر بن عبداللہ، حنش صنعانی اور زیاد بن عبید نے روایت کی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13754}۔ کتاب ان کی وفات 56 ہجری بتاتی ہے۔"
