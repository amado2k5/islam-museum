summary:
  ar: "منصور بن جمهور الكلبي؛ قتل مغلساً العبدي عامل أبي مسلم على السند وهزم جنده ثم لقيه موسى بن كعب التميمي فهزمه وقتل أخاه منظوراً وخرج مفلولاً هارباً حتى ورد الرمل فمات عطشاً."
  en: "Mansur ibn Jawhur al-Kalbi; he killed Abu Muslim's Sind agent Mughallis and routed his army — then Musa ibn Ka'b broke him, slew his brother, and drove him to a thirst-death in the sands."
  es: "Mansur ibn Jawhur al-Kalbi mató al agente de Abu Muslim en Sind, Mughallis, y derrotó a su ejército; entonces Musa ibn Ka'b lo quebrantó, mató a su hermano y lo condujo a una muerte por sed en las arenas."
  fr: "Mansur ibn Jawhur al-Kalbi; il tua l'agent sindois d'Abu Muslim, Mughallis, et mit en déroute son armée — puis Musa ibn Ka'b le brisa, tua son frère et le conduisit à une mort de soif dans le sable."
