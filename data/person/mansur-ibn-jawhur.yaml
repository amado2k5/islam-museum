label: { ar: "منصور بن جمهور الكلبي", en: "Mansur ibn Jawhur al-Kalbi", es: "Mansur ibn Jawhur al-Kalbi", fr: "Mansur ibn Jawhur al-Kalbi", ur: "منصور بن جوہر الکلبی" }
summary:
  ar: "منصور بن جمهور الكلبي؛ قتل مغلساً العبدي عامل أبي مسلم على السند وهزم جنده ثم لقيه موسى بن كعب التميمي فهزمه وقتل أخاه منظوراً وخرج مفلولاً هارباً حتى ورد الرمل فمات عطشاً."
  en: "Mansur ibn Jawhur al-Kalbi; he killed Abu Muslim's Sind agent Mughallis and routed his army — then Musa ibn Ka'b broke him, slew his brother, and drove him to a thirst-death in the sands."
  es: "Mansur ibn Jawhur al-Kalbi mató al agente de Abu Muslim en Sind, Mughallis, y derrotó a su ejército; entonces Musa ibn Ka'b lo quebrantó, mató a su hermano y lo condujo a una muerte por sed en las arenas."
  fr: "Mansur ibn Jawhur al-Kalbi; il tua l'agent sindois d'Abu Muslim, Mughallis, et mit en déroute son armée — puis Musa ibn Ka'b le brisa, tua son frère et le conduisit à une mort de soif dans le sable."
  ur: "منصور بن جوہر الکلبی؛ اس نے ابو مسلم کے سندھ کے ایجنٹ مغلس کو قتل کیا اور اس کی فوج کو بھگا دیا - پھر موسیٰ بن کعب نے اسے توڑ دیا، اس کے بھائی کو قتل کر دیا، اور اسے ریت میں پیاسا موت کی طرف لے گیا۔"
  tr: "Mansur bin Cumhur el-Kalbi; Ebu Müslüm valisi Mughlasa al-Abdi'yi aktarma zinciri üzerinden öldürdü ve askerlerini yendi. Musa ibn Ka'b al-Tamimi onunla karşılaştı, yendi, kardeşi Nazar'ı öldürdü ve cezasız kaçtı, ta ki kum su basana kadar ve susuzluktan ölene kadar."
  id: "Mansur ibn Jumhur al-Kalbi; ia membunuh Mughlasa al-Abdi, gubernur Abu Muslim melalui rantai transmisi, dan mengalahkan para prajuritnya. Musa ibn Ka'b al-Tamimi menemuinya, mengalahkannya, membunuh saudaranya Nazar, dan melarikan diri tanpa hukuman hingga pasir tergenang air, dan ia meninggal karena haus."
