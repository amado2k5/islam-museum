summary:
  ar: "أبو إسحاق إبراهيم بن منصور بن المسلم؛ الفقيه الشافعي المصري المعروف بالعراقي؛ خطيب جامع مصر العتيق وإمامه؛ شرح كتاب «المهذب» لأبي إسحاق الشيرازي في عشرة أجزاء شرحاً جيداً؛ ولم يكن من العراق وإنما سافر إلى بغداد واشتغل بها مدة فنُسب إليها؛ قرأ الفقه ببغداد على أبي بكر أحمد بن الحسين الأرموي وكان من أصحاب أبي إسحاق الشيرازي {cite:wafayat-ayan}."
  en: "Abu Ishaq Ibrahim b. Mansur al-Musallami, 'al-Iraqi' (510–596) — Egyptian Shafi'i, preacher of Cairo's old mosque, author of a ten-part commentary on al-Shirazi's al-Muhadhdhab; nisba earned in Baghdad, not birth {cite:wafayat-ayan}."
