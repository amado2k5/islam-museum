summary:
  ar: "أبو إسحاق إبراهيم بن منصور بن المسلم؛ الفقيه الشافعي المصري المعروف بالعراقي؛ خطيب جامع مصر العتيق وإمامه؛ شرح كتاب «المهذب» لأبي إسحاق الشيرازي في عشرة أجزاء شرحاً جيداً؛ ولم يكن من العراق وإنما سافر إلى بغداد واشتغل بها مدة فنُسب إليها؛ قرأ الفقه ببغداد على أبي بكر أحمد بن الحسين الأرموي وكان من أصحاب أبي إسحاق الشيرازي {cite:wafayat-ayan}."
  en: "Abu Ishaq Ibrahim b. Mansur al-Musallami, 'al-Iraqi' (510–596) — Egyptian Shafi'i, preacher of Cairo's old mosque, author of a ten-part commentary on al-Shirazi's al-Muhadhdhab; nisba earned in Baghdad, not birth {cite:wafayat-ayan}."
  es: "Abu Ishaq Ibrahim b. Mansur al-Musallami, 'al-Iraqi' (510–596): Shafi'i egipcio, predicador de la antigua mezquita de El Cairo, autor de un comentario de diez partes sobre al-Muhadhdhab de al-Shirazi; nisba ganado en Bagdad, no por nacimiento {cita:wafayat-ayan}."
  fr: "Abou Ishaq Ibrahim b. Mansur al-Musallami, « al-Iraqi » (510-596) — Shafi'i égyptien, prédicateur de l'ancienne mosquée du Caire, auteur d'un commentaire en dix parties sur al-Muhadhdhab d'al-Shirazi; nisba gagnée à Bagdad, pas à la naissance {cite: wafayat-ayan}."
  ur: "ابو اسحاق ابراہیم بی۔ منصور المسلمی، 'العراقی' (510-596) - مصری شافعی، قاہرہ کی پرانی مسجد کے مبلغ، الشرازی کے المحدثاب پر دس حصوں پر مشتمل تفسیر کے مصنف؛ نسبہ بغداد میں کمایا، پیدا نہیں ہوا۔"
  tr: "Ebu İshaq İbrahim ibn Mansur bin el-Müslim; el-Irakili olarak bilinen Şafii Mısırlı hukukçu; Mısır'ın eski camisinin vaizi ve imamı; Ebu İshaq el-Şirazi'nin 'El-Muhadhdhab' kitabını on ciltlik olarak iyi bir açıklamayla açıkladı; Iraklı değildi ama Bağdat'a seyahat etti ve bir süre orada çalıştı, burada atfedildi. Bağdat'ta Ebu Bekir Ahmed bin el-Hüseyin el-Armavi'nin yanında hukuk eğitimi aldı ve Ebu İshaq el-Şirazi'nin yoldaşları arasında yer aldı {kaynak:vafayat-ayan}."
  id: "Abu Ishaq Ibrahim ibn Mansur ibn al-Muslim; ahli hukum Syafi Mesir yang dikenal sebagai al-Iraqi; penceramah dan imam masjid kuno Mesir; ia menjelaskan buku 'Al-Muhadhdhab' karya Abu Ishaq al-Shirazi dalam sepuluh volume dengan penjelasan yang baik; ia bukan berasal dari Irak tetapi melakukan perjalanan ke Baghdad dan bekerja di sana untuk beberapa waktu, di mana ia disebutkan. Ia belajar hukum di Baghdad di bawah bimbingan Abu Bakr Ahmad ibn al-Husayn al-Armawi dan termasuk di antara sahabat Abu Ishaq al-Shirazi {cite:wafayat-ayan}."
