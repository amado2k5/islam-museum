id: person/zakarawayh-ibn-mihrawayh
class: person
label: { ar: "زكرويه بن مهرويه القرمطي" }
summary:
  ar: "زكرويه بن مهرويه، ويسميه الطبري القرمطي؛ ذكر خبره في سنة أربع وتسعين ومائتين، إذ ارتحل من نهر المثنية يريد الحاج، ثم قتل جماعة من العلافين عند واقصة {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. وعند ابن الجوزي سار إلى فيد فلم يظفر من أهلها فتنحى إلى النباج ثم حفر أبي موسى فلقيه وصيف بن صوارتكين في جند المكتفي على طريق خفان يوم السبت لثمان بقين من ربيع الأول فقُتل أصحابه وضُرب ضربة خالطت دماغه فعاش خمسة أيام ثم مات فشُقّ بطنه وقُدِّم به وبالأسارى فقُتلوا {cite:muntazam-ibn-al-jawzi p. 352}."
  tr: "Zakarawayh ibn Mehruwayh, diğer adıyla al-Tabari al-Qarmati, 294 Hicri yılında hac için Muthanniyah Nehri'nden ayrıldığını, ardından Waqsa'da bir grup yemi öldürdüğünü bildirmiştir {alıntı:Tabari-tarikh-abu-al-fadl j.10 s.130}. İbn al-Jawzi ile birlikte Fayd'a yürüdü ancak halkını bulamayınca el-Nabaj'a çekildi. Sonra Ebu Musa, Cumartesi günü, Rabi'al-Awwal'dan sekiz gün önce, Khafan yolunda el-Muktafi'nin ordusunda Waseef ibn Swartikin ile karşılaştı. Yoldaşlarını öldürdü ve başına bir darbe indirdi. Beş gün yaşadı, sonra karnını yararak öldü ve onu ve esirleri ölüme getirdi. {alıntı:Muntazam-ibn-al-jawzi, s. 352}."
  id: "Zakarawayh ibn Mehruwayh, yang juga dikenal sebagai al-Tabari al-Qarmati, melaporkan pada tahun 294 H, ketika ia meninggalkan Sungai Muthanniyah untuk berziarah, kemudian membunuh sekelompok pakan di Waqsa {cite:tabari-tarikh-abu-al-fadl j.10 hlm.130}. Bersama Ibn al-Jawzi, ia berbaris ke Fayd tetapi tidak menemukan rakyatnya, sehingga ia mundur ke al-Nabaj. Kemudian Abu Musa menggali dan bertemu Waseef ibn Swartikin dalam pasukan al-Muktafi di jalan menuju Khafan pada hari Sabtu, delapan hari sebelum Rabi' al-Awwal. Ia membunuh teman-temannya dan memukulnya dengan pukulan di kepala. Ia hidup selama lima hari, lalu meninggal, mematahkan perutnya, dan membawa dirinya serta para tawanan ke kematian. {cite:Muntazam-ibn-al-jawzi, hlm. 352}."
