label: { ar: "زكرويه بن مهرويه القرمطي" }
summary:
  ar: "زكرويه بن مهرويه، ويسميه الطبري القرمطي؛ ذكر خبره في سنة أربع وتسعين ومائتين، إذ ارتحل من نهر المثنية يريد الحاج، ثم قتل جماعة من العلافين عند واقصة {cite:tabari-tarikh-abu-al-fadl j.10 p.130}. وعند ابن الجوزي سار إلى فيد فلم يظفر من أهلها فتنحى إلى النباج ثم حفر أبي موسى فلقيه وصيف بن صوارتكين في جند المكتفي على طريق خفان يوم السبت لثمان بقين من ربيع الأول فقُتل أصحابه وضُرب ضربة خالطت دماغه فعاش خمسة أيام ثم مات فشُقّ بطنه وقُدِّم به وبالأسارى فقُتلوا {cite:muntazam-ibn-al-jawzi p. 352}."
