summary:
  ar: "باحثة أمريكية في الدراسات الإسلامية ولاهوتية مسلمة، وُلدت سنة 1952 في بيثيسدا بولاية ميريلاند باسم ماري تيزلي، واعتنقت الإسلام سنة 1972. نالت الدكتوراه في الدراسات العربية والإسلامية من جامعة ميشيغان سنة 1988، ودرّست في الجامعة الإسلامية العالمية بماليزيا وجامعة فرجينيا كومنولث، واشتهرت بكتابها «القرآن والمرأة» وبإمامتها صلاة جمعة مختلطة في نيويورك سنة 2005."
  en: "American scholar of Islamic studies and Muslim theologian, born in Bethesda, Maryland in 1952 as Mary Teasley; she converted to Islam in 1972. She took her doctorate in Arabic and Islamic studies at the University of Michigan in 1988, taught at the International Islamic University Malaysia and Virginia Commonwealth University, and is known for her book Qur'an and Woman and for leading a mixed-gender Friday prayer in New York in 2005."
  ur: "امریکی ماہرِ اسلامیات اور مسلم الٰہیات دان، 1952 میں میری لینڈ کے بیتھیسڈا میں میری ٹیزلی کے نام سے پیدا ہوئیں اور 1972 میں اسلام قبول کیا۔ انھوں نے 1988 میں یونیورسٹی آف مشی گن سے عربی و اسلامی مطالعات میں ڈاکٹریٹ کی، ملائیشیا اور ورجینیا میں تدریس کی، اور اپنی کتاب «قرآن اور عورت» اور 2005 میں نیویارک میں مخلوط جمعے کی امامت سے شہرت پائی۔"
