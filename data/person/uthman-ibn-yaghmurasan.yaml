id: person/uthman-ibn-yaghmurasan
class: person
label:
  ar: عثمان بن يغمراسن بن زيان
  en: Uthman ibn Yaghmurasan ibn Zayyan
  es: "Uthman ibn Yaghmurasan ibn Zayyan"
  fr: "Uthman ibn Yaghmurasan ibn Zayyan"
  ur: "عثمان بن یغمراسن ابن زیان"
summary:
  ar: "عثمان بن يغمراسن بن زيان الثاني من ملوك بني عبد الواد؛ لما هلك أبوه آخر ذي القعدة سنة اثنتين وثمانين وستمائة وهو عائد من تنّس تلقاه ولقيه عند سيك فحمله موارياً موته إلى تلمسان فبايعه العامة والخاصة وخاطب الخليفة أبا إسحاق بتونس فعقد له على عمله، وكان أبوه أوصاه - على حديث شيخ ابن خلدون الآيلي عن السلطان أبي حمو موسى - ألا يعتمد لقاء بني مرين وعليه باللياذ بالجدران، فنازل يوسف بن يعقوب تلمسان سنة ثمان وتسعين وستمائة فأمدّه الأمير أبو زكرياء بجيوشه فكانت الدبرة على عسكر الموحدين بجبل الزاب في معركة مرسى الرؤوس، ومحا اسم الخليفة الحفصي من منابر تلمسان، وكان في دولته اتساع بين تلمسان وبجاية حتى مالكاها وقعتا له حرباً طويلة مع الموحدين."
  en: "Uthman ibn Yaghmurasan ibn Zayyan, second of the Banu Abd al-Wad kings; when his father died at the end of Dhu'l-Qa'da 682 returning from Ténès, he met the bier at Sik, concealed the death to Tlemcen and took the bay'a of elite and commons, writing to the Hafsid al-Mustansir's line for investiture — his father's counsel, per Ibn Khaldun's shaykh al-Ayili quoting Abu Hammu Musa, being never to trust meeting the Marinids in open field but to lean on the walls; he held Tlemcen against Yusuf ibn Ya'qub's 698 siege with Abu Zakariya's aid, the Almohad column broken at Jabal al-Zab in the battle of Marsa al-Ru'us, and erased the Hafsid name from Tlemcen's minbars."
  es: "Uthman ibn Yaghmurasan ibn Zayyan, segundo de los reyes de Banu Abd al-Wad; cuando su padre murió a finales de Dhu'l-Qa'da 682 al regresar de Ténès, recibió el féretro en Sik, ocultó la muerte a Tlemcen y tomó el bay'a de la élite y el pueblo, escribiendo a la línea del Hafsid al-Mustansir para la investidura; el consejo de su padre, según el shaykh al-Ayili de Ibn Khaldun citando a Abu Hammu Musa, era nunca confiar en encontrarse con los Marinids en campo abierto sino apoyarse en las murallas; defendió Tlemcen contra el asedio de Yusuf ibn Ya'qub en 698 con la ayuda de Abu Zakariya, la columna almohade fue quebrada en Jabal al-Zab en la batalla de Marsa al-Ru'us, y borró el nombre Hafsid de los minbars de Tlemcen."
  fr: "Uthman ibn Yaghmurasan ibn Zayyan, deuxième roi des Banu Abd al-Wad, mourut à la fin du mois de Dhu'l-Qa'da 682, de retour de Ténès. Il accueillit le corps à Sik, dissimula la mort à Tlemcen et reçut l'allégeance de l'élite et du peuple, écrivant à la lignée des Hafsides al-Mustansir pour obtenir son investiture. Le conseil de son père, selon le cheikh al-Ayili d'Ibn Khaldun citant Abu Hammu Musa, était de ne jamais faire confiance aux Mérinides en rase campagne, mais de se réfugier derrière les remparts. Il tint Tlemcen face au siège de Yusuf ibn Ya'qub en 698 avec l'aide d'Abu Zakariya, la colonne almohade fut brisée à Jabal al-Zab lors de la bataille de Marsa al-Ru'us, et fit effacer le nom des Hafsides des minbars de Tlemcen."
  ur: "عثمان بن یغمراسن بن زیان، بنو عبد الوداع کے دوسرے بادشاہوں میں سے دوسرے؛ جب ذوالقعدہ 682 کے آخر میں اس کے والد کا انتقال ہو گیا تو ٹینس سے واپسی پر اس نے سیک میں بیئر سے ملاقات کی، اس نے موت کو تلمسن سے چھپایا اور اشرافیہ اور عام لوگوں کی بیعت لی، حفصد المستنصر کی سطر کو سرمایہ کاری کے لیے لکھا - اس کے والد کے مشورے ابو الخلیلۃ الخلد الخلیلۃ فی الخلد۔ حمو موسی، کھلے میدان میں میرینیڈز سے ملنے پر کبھی بھروسہ نہیں کرنا بلکہ دیواروں پر ٹیک لگانا؛ اس نے ابو زکریا کی مدد سے یوسف بن یعقوب کے 698 کے محاصرے کے خلاف تلمسن کو تھام لیا، جبل الزاب میں الموحد کالم کو مارسہ الرووس کی لڑائی میں توڑ دیا گیا، اور تلمسن کے منبروں سے حفصید کا نام مٹا دیا۔"
  tr: "Osman bin Yaghmurasan ibn Ziyan II, Banu Abdülvad'ın krallarından biriydi; babası 682 Hicri yılında, Zhu Kı'dah'ın sonunda, Tanis'ten dönerken öldüğünde, onu Sih'te karşıladı ve ölümünü gizleyerek Tlemcen'e götürdü. Hem halk hem de seçkinlere bağlılık yemini etti ve Tunus'ta Halife Ebu İshaq'a hitap etti; Halife onu atamasını sağladı. Babası ona öğüt verdi—Şeyh İbn Haldun el-Aili'nin Sultan Aili'den anlattığına göre, Bu Hamu Musa—Marinidlerin toplantısına güvenmemek ve Liadh surlarına güvenmek. Yusuf bin Yaqub, 698 Hicri yılında Tlemcen'e yerleşti ve Emir Ebu Zekeriye ona ordularını sağladı. Almohadlar, Marsa el-Raus Savaşı'nda Zab Dağı'ndaki Almohad kampının başındaydı. Hafsid halifeliğinin adı Tlemcen'in kürsülerinden silindi ve krallığı, sahipleri Almohadlarla uzun bir savaş veren Tlemcen ile Bejaia arasında uzandı."
  id: "Uthman ibn Yaghmurasan ibn Ziyan II adalah salah satu raja Banu Abd al-Wad; ketika ayahnya meninggal pada akhir Dhu al-Qi'dah pada tahun 682 H, saat kembali dari Tanis, ia bertemu dan bertemu dengannya di Sikh, yang membawanya ke Tlemcen untuk menyembunyikan kematiannya. Ia bersumpah setia kepada rakyat biasa dan elit serta berbicara kepada Khalifah Abu Ishaq di Tunis, yang mengatur agar ia mengangkatnya. Ayahnya menasihatinya—menurut riwayat Sheikh Ibn Khaldun al-Aili dari Sultan Abu Hamu Musa—tidak bergantung pada pertemuan Marinid dan mengandalkan tembok Liadh. Yusuf ibn Yaqub menetap di Tlemcen pada tahun 698 H, dan Emir Abu Zakariya memasok pasukannya. Almohad memimpin kamp Almohad di Gunung Zab dalam Pertempuran Marsa al-Raus. Nama kekhalifahan Hafsid dihapus dari mimbar Tlemcen, dan kerajaannya membentang antara Tlemcen dan Bejaia, yang pemiliknya berperang panjang melawan Almohad."
