id: person/al-mufawwid
class: person
label: { ar: "جعفر المفوض إلى الله بن المعتمد", en: "Ja'far al-Mufawwid ila Allah ibn al-Mu'tamid", fr: "Ja'far al-Mufawwid ila Allah ibn al-Mu'tamid", es: "Ja'far al-Mufawwid ila Allah ibn al-Mu'tamid", ur: "جعفر المفواد الا اللہ ابن المتمید" }
summary:
  ar: "ابن المعتمد، صيره أبوه ولي عهده وولاه مصر والمغرب ولقبه المفوض إلى الله ثم خلعه في سنة تسع وسبعين في مجلس عام وبايع لأبي العباس بن الموفق ولقبه المعتضد {cite:tarikh-khulafa-minhaj-1434 p. 564-565,569}. وعند ابن الجوزي جلس المعتمد في دار العامة لثنتي عشرة مضت من شوال سنة إحدى وستين ومائتين فولّاه العهد وولّاه المغرب وضم إليه موسى بن بغا، وعقد له لواءين أسود وأبيض وأُخذت البيعة على الناس وعُلقت نسخة السدق في الكعبة {cite:muntazam-ibn-al-jawzi p. 116-117}. وعند المسعودي استخلفه أبوه المعتمد حين عسكر بالقائم لحرب يعقوب الصفار، وأنزله إسماعيل بن بلبل مع المعتضد إلى بغداد في طيارة، ثم خلعه المعتضد من ولاية العهد لما قام مقام أبيه {cite:muruj-al-dhahab p. 594-595}"
  en: "Al-Mu'tamid's son, made heir over Egypt and the Maghreb as 'al-Mufawwid ila'llah', then publicly deposed in 279 when bay'a went to Abu'l-Abbas ibn al-Muwaffaq, titled al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 564-565,569}."
  fr: "Le fils d'Al-Mu'tamid, fait héritier sur l'Égypte et le Maghreb comme 'al-Mufawwid ila'llah', puis déposé publiquement en 279 quand bay'a est allé à Abu'l-Abbas ibn al-Muwaffaq, intitulé al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 564-565,569}."
  es: "Hijo de Al-Mu'tamid, heredero de Egipto y el Magreb como 'al-Mufawwid ila'llah', luego depuesto públicamente en 279 cuando bay'a fue a Abu'l-Abbas ibn al-Muwaffaq, titulado al-Mu'tadid {cita:tarikh-khulafa-minhaj-1434 p. 564-565,569}."
  ur: "المتمید کے بیٹے نے، مصر اور مغرب پر 'المفوض الا اللہ' کے طور پر وارث بنایا، پھر 279 میں عوامی طور پر معزول کر دیا گیا جب بیع ابو العباس ابن الموفق کے پاس گیا، جس کا عنوان المتعدید تھا۔ 564-565,569}۔"
  tr: "İbn el-Mu'tamid, babasını veliaht prensi yaptı, Mısır ve Fas valisi olarak atadı ve ona 'Allah'a Mu'allaq' unvanını verdi. Daha sonra 1979'da genel konseyde onu görevden aldı ve unvanı el-Mu'tadid olan Ebu el-Abbas bin el-Müvaffaq'a bağlılık yemini etti {alıntı: Tarikh-Khulafa-minhaj-1434 s. 564-565,569}. İbn al-Jawzi ile birlikte, el-Mu'tamid 261 Hicri yılında Şevval'den ayrıldıktan sonra on iki ay boyunca halka açık yerde oturdu. Ahitle atandı, Fas tarafından atandı ve Musa ibn Bagha ona atandı. İki sancaqla atandı, biri siyah, biri beyaz, yemin halktan alındı ve el-Sadiq (al-Saqdaq) bir kopyası Kabe'ye asıldı {cite:muntazam-ibn-al-jawzi s. 116-117}. El-Mes'udi'ye göre, babası el-Mu'tamid, Ya'qub al-Saffar'a karşı savaş sırasında el-Kaim'de kamp kurduğunda onu halefi olarak atamıştır. İsmail bin Bülbul, onu al-Mu'tadid ile birlikte bir uçakla Bağdat'a göndermiş, ardından el-Mutadid babasının yerine geçtiğinde onu tahttan indirmiştir {atıf:Muruj-al-Dhahab, s. 594-595}"
  id: "Ibn al-Mu'tamid diangkat menjadi putra mahkota ayahnya, mengangkatnya sebagai gubernur Mesir dan Maroko, dan memberinya gelar 'Al-Mu'allaq kepada Allah.' Kemudian ia mencopot ayahnya pada tahun 1979 dalam dewan umum dan bersumpah setia kepada Abu al-Abbas ibn al-Muwaffaq, yang gelarnya al-Mu'tadid {cite:Tarikh-Khulafa-minhaj-1434 hlm. 564-565.569}. Bersama Ibn al-Jawzi, al-Mu'tamid duduk di rumah umum selama dua belas bulan setelah lulus dari Shawwal pada tahun 261 H. Ia diangkat oleh perjanjian yang ditunjuk oleh Maroko, dan Musa ibn Bagha diangkat untuknya. Ia diangkat dengan dua panji, satu hitam dan satu putih, janji diambil dari rakyat, dan salinan al-Sadiq (al-saqdaq) digantung di Ka'bah {cite:muntazam-ibn-al-jawzi hlm. 116-117}. Menurut al-Mas'udi, ayahnya al-Mu'tadid mengangkatnya sebagai penerusnya ketika ia berkemah di al-Qa'im selama perang melawan Ya'qub al-Saffar. Ismail ibn Bulbul mengirimnya bersama al-Mu'tadid ke Baghdad dengan pesawat, kemudian al-Mu'tadid mencopotnya dari putra mahkota ketika ia menggantikan ayahnya {cite:muruj-al-dhahab, hlm. 594-595}"
