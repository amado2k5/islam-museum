label: { ar: "جعفر المفوض إلى الله بن المعتمد" }
summary:
  ar: "ابن المعتمد، صيره أبوه ولي عهده وولاه مصر والمغرب ولقبه المفوض إلى الله ثم خلعه في سنة تسع وسبعين في مجلس عام وبايع لأبي العباس بن الموفق ولقبه المعتضد {cite:tarikh-khulafa-minhaj-1434 p. 564-565,569}.، وعند المسعودي استخلفه أبوه المعتمد حين عسكر بالقائم لحرب يعقوب الصفار، وأنزله إسماعيل بن بلبل مع المعتضد إلى بغداد في طيارة، ثم خلعه المعتضد من ولاية العهد لما قام مقام أبيه {cite:muruj-al-dhahab p. 594-595}"
  en: "Al-Mu'tamid's son, made heir over Egypt and the Maghreb as 'al-Mufawwid ila'llah', then publicly deposed in 279 when bay'a went to Abu'l-Abbas ibn al-Muwaffaq, titled al-Mu'tadid {cite:tarikh-khulafa-minhaj-1434 p. 564-565,569}."
