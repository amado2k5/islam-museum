summary:
  ar: "سبط ابن الجوزي الواعظ المؤرخ؛ جلس سنة ست وستمائة بجامع دمشق يوعظ ويحث على الجهاد فقصّت له النساء شعورهن فصنع منها ثلاثمائة شكال لخيل المجاهدين، وخرج والي دمشق والناس معه إلى نابلس لقتال الفرنج {cite:shadharat-dhahab p. 26}. نسبته إلى ابن الجوزي متنازع فيها وإنما اشتهر بها {cite:shadharat-dhahab}."
  en: "Sibt Ibn al-Jawzi, preacher and historian; in 606 he sat in Damascus's mosque exhorting to jihad — women cut their braids, made into three hundred bridles for the mujahidin's mounts — and the governor and crowds rode with him to fight the Franks at Nablus {cite:shadharat-dhahab p. 26}. His claimed descent from Ibn al-Jawzi is disputed though he is famed by it {cite:shadharat-dhahab}."
