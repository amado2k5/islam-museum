summary:
  ar: "سبط ابن الجوزي الواعظ المؤرخ؛ جلس سنة ست وستمائة بجامع دمشق يوعظ ويحث على الجهاد فقصّت له النساء شعورهن فصنع منها ثلاثمائة شكال لخيل المجاهدين، وخرج والي دمشق والناس معه إلى نابلس لقتال الفرنج {cite:shadharat-dhahab p. 26}. نسبته إلى ابن الجوزي متنازع فيها وإنما اشتهر بها {cite:shadharat-dhahab} واسم أبيه فرغلي على الصواب كما في نسخة قديمة من الوافي بالوفيات وابن خلكان وإن شاع تصحيفه قزأوغلي {cite:shadharat-dhahab p. 274}. أسمعه جده منه وقدم دمشق سنة بضع وستمائة فوعظ بها وحصل له القبول العظيم لعذوبة وعظه، ونقله الملك المعظم إلى مذهب أبي حنيفة فانتُقد عليه حتى سأله أحد أرباب الأحوال على المنبر: أي شيء ظهر لك في الإمام أحمد حتى رجعت عنه؟ فقال اسكت، فقال الفقير أما أنا فسكت وأما أنت فتكلم، فرام الكلام فلم يستطع فنزل عن المنبر؛ وله تفسير في تسع وعشرين مجلداً وشرح الجامع الكبير ومرآة الزمان — كتاب كاسمه ابتدأه من أول الزمان إلى أوائل سنة وفاته — ومجلد في مناقب أبي حنيفة؛ توفي ليلة الثلاثاء العشرين من ذي الحجة بمنزله بجبل الصالحية وحضر دفنه الملك الناصر {cite:shadharat-dhahab p. 274-275}."
  en: "Sibt Ibn al-Jawzi, preacher and historian; in 606 he sat in Damascus's mosque exhorting to jihad — women cut their braids, made into three hundred bridles for the mujahidin's mounts — and the governor and crowds rode with him to fight the Franks at Nablus {cite:shadharat-dhahab p. 26}. His claimed descent from Ibn al-Jawzi is disputed though he is famed by it {cite:shadharat-dhahab}."
  ur: "واعظ اور مؤرخ؛ دمشق کے خطبات اور ایوبی عہد کے حالات سے وابستہ تھا، جن میں دمیاط کی مہم اور مقامی مذہبی و سیاسی واقعات شامل ہیں۔ {cite:shadharat-dhahab}"
  es: "Sibt Ibn al-Jawzi, predicador e historiador; en 606 se sentó en la mezquita de Damasco exhortando a la yihad —las mujeres cortaron sus trenzas, que se convirtieron en trescientas bridas para las monturas de los muyahidines— y el gobernador y la multitud cabalgaron con él para luchar contra los francos en Nablus {cite:shadharat-dhahab p. 26}. Su supuesta descendencia de Ibn al-Jawzi es cuestionada, aunque es famoso por ella {cite:shadharat-dhahab}."
  fr: "Sibt Ibn al-Jawzi, prédicateur et historien, exhorta au djihad en 606 dans la mosquée de Damas. Des femmes coupèrent leurs tresses, qui servirent à confectionner trois cents brides pour les montures des moudjahidines. Le gouverneur et la foule l'accompagnèrent à Naplouse pour combattre les Francs (cf. shadharat-dhahab, p. 26). Sa filiation avec Ibn al-Jawzi est contestée, bien qu'elle lui ait valu une certaine renommée (cf. shadharat-dhahab)."
  tr: "Vaiz ve tarihçi İbn el-Cewzi'nin torunu, 6600 Hicri yılında Şam Büyük Camii'nde oturup cihad için vaaz veriyor ve cihad çağrısı yapıyordu. Kadınlar saçlarını onun için kesti, o ise savaşçıların atları için üç yüz şekel yaptı. Şam valisi ve adamları onunla birlikte Franklarla savaşmak üzere Nablus'a gitti {atıf:shadharat-dhahab, s. 26}. İbn el-Cevzi'ye atfedilmesi tartışmalıdır, ancak bu nedenle ünlü oldu {atıf:şadharat-dhahab} ve babasının adı Farghalidir, eski bir Al-Wafi bil-Wafayat kopyasındaki gibi, ve İbn Khallikan'dır, ancak yazım hataları Qazoughli tarafından yaygın hale gelmiştir {cite:shadharat-dhahab, s. 274}. Dedesi onu ondan duydu ve 600 Hicri yılında Şam'a geldi, orada vaaz verdi ve vaazlarının tatlılığı sayesinde büyük kabul gördü. Büyük Kral onu Ebu Hanifa'nın okuluna gönderdi, o da onu eleştirdi ta ki liderlerden biri kürsüden ona şöyle sordu: İmam Ahmed hakkında ne gördün ki ondan yüz çevirdin? O dedi ki, 'Sus.' Fakir adam, 'Ama ben sessiz olmalıyım, sen konuş.' dedi. Konuşamadı ve ayrıldı vaaz kürsüsüne sahiptir. Yirmi dokuz ciltlik bir yorumu, El-Cami'l-Kabir ve adının başından ölümüne kadar başladığı 'Mir'at al-Zaman' üzerine bir yorum ve Ebu Hanifa'nın erdemleri üzerine bir cildi vardır. Zulhice'nin yirminci Salı gecesi, Salihiye Dağı'ndaki evinde vefat etti ve Kral el-Nasir cenazesine katıldı {alıntı:Shadharat-Dhahab, s. 274-275}."
  id: "Cucu Ibn al-Jawzi, seorang pengkhotbah dan sejarawan, duduk pada tahun 6600 H di Masjid Besar Damaskus, berkhotbah dan mendorong jihad. Para wanita memotong rambut mereka untuknya, dan ia menghasilkan tiga ratus syikel dari siku untuk kuda para prajurit. Gubernur Damaskus dan pasukannya ikut bersamanya ke Nablus untuk melawan bangsa Franka {cite:shadharat-dhahab, hlm. 26}. Atribusinya kepada Ibn al-Jawzi masih diperdebatkan, tetapi ia menjadi terkenal karenanya {cite:shadharat-dhahab}, dan nama ayahnya adalah Farghali, seperti dalam salinan lama Al-Wafi bil-Wafayat, dan Ibn Khallikan, meskipun kesalahan ejaan itu menjadi luas oleh Qazoughli {cite:shadharat-dhahab, hlm. 274}. Kakeknya mendengarnya darinya, dan dia datang ke Damaskus pada tahun 600 H, berkhotbah di sana, dan dia mendapat sambutan besar karena manisnya khotbahnya. Raja agung memindahkannya ke aliran Abu Hanifa, yang mengkritiknya sampai salah satu pemimpin bertanya dari mimbar: Apa yang kamu lihat tentang Imam Ahmad sehingga kamu berpaling darinya? Dia berkata, 'Diamlah.' Orang malang itu berkata, 'Tapi aku harus diam, dan kamu yang berbicara.' Dia tidak mampu berbicara dan meninggalkan mimbar. Dia memiliki komentar dalam dua puluh sembilan jilid, komentar tentang Al-Jami' al-Kabir dan 'Mir'at al-Zaman'—sebuah buku yang dia mulai dari awal namanya hingga tahun-tahun awal kematiannya—dan sebuah buku tentang kebajikan Abu Hanifa. Dia meninggal pada malam Selasa, tanggal dua puluh Dhu al-Hijjah, di rumahnya di Gunung al-Salihiyah, dan Raja al-Nasir menghadiri pemakamannya {cite:Shadharat-Dhahab, hlm. 274-275}."
