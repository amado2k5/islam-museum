summary:
  ar: "سبط ابن الجوزي الواعظ المؤرخ؛ جلس سنة ست وستمائة بجامع دمشق يوعظ ويحث على الجهاد فقصّت له النساء شعورهن فصنع منها ثلاثمائة شكال لخيل المجاهدين، وخرج والي دمشق والناس معه إلى نابلس لقتال الفرنج {cite:shadharat-dhahab p. 26}. نسبته إلى ابن الجوزي متنازع فيها وإنما اشتهر بها {cite:shadharat-dhahab} واسم أبيه فرغلي على الصواب كما في نسخة قديمة من الوافي بالوفيات وابن خلكان وإن شاع تصحيفه قزأوغلي {cite:shadharat-dhahab p. 274}. أسمعه جده منه وقدم دمشق سنة بضع وستمائة فوعظ بها وحصل له القبول العظيم لعذوبة وعظه، ونقله الملك المعظم إلى مذهب أبي حنيفة فانتُقد عليه حتى سأله أحد أرباب الأحوال على المنبر: أي شيء ظهر لك في الإمام أحمد حتى رجعت عنه؟ فقال اسكت، فقال الفقير أما أنا فسكت وأما أنت فتكلم، فرام الكلام فلم يستطع فنزل عن المنبر؛ وله تفسير في تسع وعشرين مجلداً وشرح الجامع الكبير ومرآة الزمان — كتاب كاسمه ابتدأه من أول الزمان إلى أوائل سنة وفاته — ومجلد في مناقب أبي حنيفة؛ توفي ليلة الثلاثاء العشرين من ذي الحجة بمنزله بجبل الصالحية وحضر دفنه الملك الناصر {cite:shadharat-dhahab p. 274-275}."
  en: "Sibt Ibn al-Jawzi, preacher and historian; in 606 he sat in Damascus's mosque exhorting to jihad — women cut their braids, made into three hundred bridles for the mujahidin's mounts — and the governor and crowds rode with him to fight the Franks at Nablus {cite:shadharat-dhahab p. 26}. His claimed descent from Ibn al-Jawzi is disputed though he is famed by it {cite:shadharat-dhahab}."
