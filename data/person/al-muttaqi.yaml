id: person/al-muttaqi
class: person
label: { ar: "المتقي لله إبراهيم بن المقتدر" }
summary:
  ar: "خليفة عباسي [٣٢٩–٣٣٣هـ]، أبو إسحاق إبراهيم بن المقتدر، بويع بعد أخيه الراضي وله أربع وثلاثون سنة وأمه أمة اسمها خلوب وقيل زهرة، لم يغير شيئاً قط ولا تسرى على جاريته، وكان كثير الصوم والتعبد لم يشرب نبيذاً قط وكان يقول لا أريد نديماً غير المصحف ولم يكن له سوى الاسم والتدبير لكاتب بجكم، وسمله توزون سنة ثلاث وثلاثين فحبس بجزيرة مقابل السندية خمساً وعشرين سنة حتى مات في شعبان سنة سبع وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 608-611}. وعند المسعودي هو أبو إسحاق إبراهيم بن المقتدر، بويع لعشر خلون من ربيع الأول سنة تسع وعشرين وثلثمائة وخلع وسملت عيناه يوم السبت لثلاث خلون من صفر سنة ثلاث وثلاثين فكانت خلافته ثلاث سنين وأحد عشر شهراً وثلاثة وعشرين يوماً، وأقر على الوزارة سليمان بن الحسن بن مخلد ثم استوزر أحمد بن محمد بن ميمون ومحمد بن أحمد القراريطي وأحمد بن عبد الله الأصبهاني وعلي بن محمد بن مقلة، وغلب على الأمر أبو الوفاء توزون التركي فلم يكن له أمر ولا نهي، واشتد أمر البريديين بالبصرة منعوا السفن وعظم جيشهم بمائهم وبرهم فانضاف إليهم حجرية السلطان وغلمانه وصار جيش السلطان الأتراك والديلم والجيل ونفراً من القرامطة مع توزون {cite:muruj-al-dhahab p. 691-692}، وعند المسعودي كانت له مجالس أدب ليلية مع الرقي وغلامه وسمع منشداً ينشد قصيدة فيها لا تقل بشرى وقل لي بشريان فأنشده غلامه ثانياً دامت البشرى فقل لي بشريان فما زال يقول لا تقل بشرى فقالا لتطيرن لأمير المؤمنين من اختياره هذا البيت على هذا الوجه فكان من أمره ما كان، وسألهما في طريقه من الرحبة إلى مديئة عانة عن خبر سليمان بن ربيعة الباهلي مع عمر في تهجين الخيل وعن صفاتها عند الأصمعي ومعاوية ومطر بن دراج وعن أسماء خيل الحلبة العشرة ومراتبها {cite:muruj-al-dhahab p. 695-699}، وعند ابن الأثير كتب إلى الإخشيد محمد بن طغج يشكو حاله ويستقدمه فأتاه بالرقة منتصف محرم فأكرمه وأحترمه ووقف وقوف الغلمان ومشى بين يديه وأمره بالركوب فلم يفعل حتى نزل، واجتهد به ليسير معه إلى مصر والشام ولا يرجع إلى بغداد وخوفه من توزون فلم يقبل، وانحدر المتقي من الرقة في الفرات إلى بغداد فلقيه توزون بالسندية ونزل وقبّل الأرض وقال ها أنا قد وفيت بيميني والطاعة لك، وكما به وبالوزير والجماعة ثم كحله فأذهب عينيه فلما سُمل صاح وصاح من عنده من الحرم والخدم وارتجت الدنيا فأمر توزون بضرب الدبادب ليلاً يظهر أحدوثهم فخفيت أصواتهم، وكانت خلافة المتقي ثلاث سنين {cite:kamil-ibn-al-athir p. 312-313}، وعند ابن الأثير وفيها في منتصف شعبان سنة 357هـ مات المتقي لله في داره ودفن فيها {cite:kamil-ibn-al-athir p. 433}"
  en: "Abbasid caliph [329–333], Abu Ishaq Ibrahim ibn al-Muqtadir, hailed at thirty-four; he altered nothing, never touched a slave-girl or wine, fasted much — 'I want no companion but the Mushaf'. Tuzun blinded him in 333; jailed opposite al-Sindiyya twenty-five years, he died in Sha'ban 357 {cite:tarikh-khulafa-minhaj-1434 p. 608-611}."
