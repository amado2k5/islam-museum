label: { ar: "المتقي لله إبراهيم بن المقتدر" }
summary:
  ar: "خليفة عباسي [٣٢٩–٣٣٣هـ]، أبو إسحاق إبراهيم بن المقتدر، بويع بعد أخيه الراضي وله أربع وثلاثون سنة وأمه أمة اسمها خلوب وقيل زهرة، لم يغير شيئاً قط ولا تسرى على جاريته، وكان كثير الصوم والتعبد لم يشرب نبيذاً قط وكان يقول لا أريد نديماً غير المصحف ولم يكن له سوى الاسم والتدبير لكاتب بجكم، وسمله توزون سنة ثلاث وثلاثين فحبس بجزيرة مقابل السندية خمساً وعشرين سنة حتى مات في شعبان سنة سبع وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 608-611}."
  en: "Abbasid caliph [329–333], Abu Ishaq Ibrahim ibn al-Muqtadir, hailed at thirty-four; he altered nothing, never touched a slave-girl or wine, fasted much — 'I want no companion but the Mushaf'. Tuzun blinded him in 333; jailed opposite al-Sindiyya twenty-five years, he died in Sha'ban 357 {cite:tarikh-khulafa-minhaj-1434 p. 608-611}."
