id: person/al-muttaqi
class: person
label: { ar: "المتقي لله إبراهيم بن المقتدر", en: "al-Muttaqi li-llah Ibrahim ibn al-Muqtadir", fr: "al-Muttaqi li-llah Ibrahim ibn al-Muqtadir", es: "al-Muttaqi li-llah Ibrahim ibn al-Muqtadir", ur: "المتقی للہ ابراہیم بن مقتدیر" }
summary:
  ar: "خليفة عباسي [٣٢٩–٣٣٣هـ]، أبو إسحاق إبراهيم بن المقتدر، بويع بعد أخيه الراضي وله أربع وثلاثون سنة وأمه أمة اسمها خلوب وقيل زهرة، لم يغير شيئاً قط ولا تسرى على جاريته، وكان كثير الصوم والتعبد لم يشرب نبيذاً قط وكان يقول لا أريد نديماً غير المصحف ولم يكن له سوى الاسم والتدبير لكاتب بجكم، وسمله توزون سنة ثلاث وثلاثين فحبس بجزيرة مقابل السندية خمساً وعشرين سنة حتى مات في شعبان سنة سبع وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 608-611}. وعند المسعودي هو أبو إسحاق إبراهيم بن المقتدر، بويع لعشر خلون من ربيع الأول سنة تسع وعشرين وثلثمائة وخلع وسملت عيناه يوم السبت لثلاث خلون من صفر سنة ثلاث وثلاثين فكانت خلافته ثلاث سنين وأحد عشر شهراً وثلاثة وعشرين يوماً، وأقر على الوزارة سليمان بن الحسن بن مخلد ثم استوزر أحمد بن محمد بن ميمون ومحمد بن أحمد القراريطي وأحمد بن عبد الله الأصبهاني وعلي بن محمد بن مقلة، وغلب على الأمر أبو الوفاء توزون التركي فلم يكن له أمر ولا نهي، واشتد أمر البريديين بالبصرة منعوا السفن وعظم جيشهم بمائهم وبرهم فانضاف إليهم حجرية السلطان وغلمانه وصار جيش السلطان الأتراك والديلم والجيل ونفراً من القرامطة مع توزون {cite:muruj-al-dhahab p. 691-692}، وعند المسعودي كانت له مجالس أدب ليلية مع الرقي وغلامه وسمع منشداً ينشد قصيدة فيها لا تقل بشرى وقل لي بشريان فأنشده غلامه ثانياً دامت البشرى فقل لي بشريان فما زال يقول لا تقل بشرى فقالا لتطيرن لأمير المؤمنين من اختياره هذا البيت على هذا الوجه فكان من أمره ما كان، وسألهما في طريقه من الرحبة إلى مديئة عانة عن خبر سليمان بن ربيعة الباهلي مع عمر في تهجين الخيل وعن صفاتها عند الأصمعي ومعاوية ومطر بن دراج وعن أسماء خيل الحلبة العشرة ومراتبها {cite:muruj-al-dhahab p. 695-699}، وعند ابن الأثير كتب إلى الإخشيد محمد بن طغج يشكو حاله ويستقدمه فأتاه بالرقة منتصف محرم فأكرمه وأحترمه ووقف وقوف الغلمان ومشى بين يديه وأمره بالركوب فلم يفعل حتى نزل، واجتهد به ليسير معه إلى مصر والشام ولا يرجع إلى بغداد وخوفه من توزون فلم يقبل، وانحدر المتقي من الرقة في الفرات إلى بغداد فلقيه توزون بالسندية ونزل وقبّل الأرض وقال ها أنا قد وفيت بيميني والطاعة لك، وكما به وبالوزير والجماعة ثم كحله فأذهب عينيه فلما سُمل صاح وصاح من عنده من الحرم والخدم وارتجت الدنيا فأمر توزون بضرب الدبادب ليلاً يظهر أحدوثهم فخفيت أصواتهم، وكانت خلافة المتقي ثلاث سنين {cite:kamil-ibn-al-athir p. 312-313}، وعند ابن الأثير وفيها في منتصف شعبان سنة 357هـ مات المتقي لله في داره ودفن فيها {cite:kamil-ibn-al-athir p. 433} وعند ابن الجوزي خرج إلى الموصل فأقام عند بني حمدان واستدعاهم لحرب توزون ثم كاتبه بالصلح وأرسل من يستحلفه فخلف، وفي سنة إحدى وثلاثين خرج إلى الشماسية لصيد السباع {cite:muntazam-ibn-al-jawzi p. 623, 633}."
  en: "Abbasid caliph [329–333], Abu Ishaq Ibrahim ibn al-Muqtadir, hailed at thirty-four; he altered nothing, never touched a slave-girl or wine, fasted much — 'I want no companion but the Mushaf'. Tuzun blinded him in 333; jailed opposite al-Sindiyya twenty-five years, he died in Sha'ban 357 {cite:tarikh-khulafa-minhaj-1434 p. 608-611}."
  fr: "Le calife abbasside [329-333], Abu Ishaq Ibrahim ibn al-Muqtadir, a salué à trente-quatre ans  ; il n’a rien changé, n’a jamais touché une esclave ou du vin, jeûnais beaucoup – « Je ne veux pas d’autre compagnon que le Mushaf  ». Tuzun l'a aveuglé en 333 ; emprisonné en face d'al-Sindiyya vingt-cinq ans, il est mort à chaabane 357 {cite:tarikh-khulafa-minhaj-1434 p. 608-611}."
  es: "El califa abasí [329–333], Abu Ishaq Ibrahim ibn al-Muqtadir, fue aclamado a los treinta y cuatro años; no cambió nada, jamás tocó a una esclava ni bebió vino, ayunó mucho: «No quiero otro compañero que el Corán». Tuzun lo cegó en 333; estuvo encarcelado frente a al-Sindiyya durante veinticinco años y murió en Sha'ban 357 {cite:tarikh-khulafa-minhaj-1434 p. 608-611}."
  ur: "عباسی خلیفہ [329-333]، ابو اسحاق ابراہیم بن المقتدر، چونتیس سال کی عمر میں؛ اس نے کچھ بھی نہیں بدلا، کبھی کسی لونڈی یا شراب کو ہاتھ نہیں لگایا، بہت زیادہ روزے رکھے - 'مجھے مصحف کے علاوہ کوئی ساتھی نہیں چاہیے'۔ تزون نے اسے 333 میں اندھا کر دیا۔ السندیہ کے خلاف پچیس سال جیل میں رہے، شعبان 357 میں وفات پائی۔ 608-611}۔"
  tr: "Bir Abbasi halifesi [329–333 Hj.], Ebu İshaq İbrahim ibn el-Muqtadir, otuz dört yaşındaki kardeşi el-Radi'ye bağlılık yemini etmişti ve annesi Khalub adında bir köleydi, ya da söylenirse Zehra idi. Hiçbir şeyi değiştirmedi, köle kızına da bakmadı. Oruç tutar, bolca ibadet ederdi, asla şarap içmezdi ve der ki, 'Kur'an'dan başka bir yoldaş istemiyorum.' Sadece Bajkam'da bir katip adı ve yönetimi vardı. 33 Hile yılında Tuzun tarafından çağrıldı ve yirmi beş yıl boyunca El-Sindhiye'nin karşısındaki bir adada hapsedildi, ta ki 57 yılında Şaban'da ölene kadar {atıf:History-Khulafa-minhaj-1434, s. 608-611}. al-Mas'udi'ye göre, kendisi Ebu İshaq İbrahim bin el-Muqtadir. Rabi'al-Awwal 329 Hicri yılında görevden alınana kadar on yıl boyunca bağlılık yemini etmiş, ardından Sefer'den üçüncü gün önce gözleri mühürlenmiş, yani 333 Hicri yılında, böylece halifeliği üç yıl, on bir ay ve yirmi üç gün sürmüştür. Süleyman ibn al-Hasan ibn Mukhlad vezir olarak atanmış, ardından Ahmed ibn Muhammed ibn Maymun, Muhammed ibn Ahmed al-Qaraiti, Ahmed ibn Abdullah el-İsfahani ve Ali ibn Muhammed ibn Muqla galip gelmiştir. Ebu el-Vafa Uzun bu konuda üstün gelmiştir Türklerin ne emri ne de yasağı vardı. Basra'daki Buraidilerin emri güçlendi, gemileri kapattılar ve ordularını su ve topraklarıyla güçlendirdiler. Sultan'ın Hujriyatları ve hizmetkarları onlara katıldı, Sultan'ın ordusu Türkler, Daylamlılar ve Nesil oldu; bir grup Karmatlı ile birlikte Tuzun {cite:Muruj-al-Dhahab, s. 691-692}. El-Mes'udi, Ruqayya ve hizmetkarıyla her gece edebi toplantılar yapardı ve bir şarkıcının bir şiir okurken kendisi de müjdeyi okuduğunu ve bana bir insan anlattığını tekrar kuluna anlattığını duydu. Haber sürdü, bana bir insan söyle, o da sürekli 'iyi haber söyleme' dedi, onlar da kaç dediler İnananların Komutanı bu ayeti bu şekilde seçti, bu yüzden bu onun kendi meselesiydi. El-Rahbah'tan Madiya 'Ana'ya giderken, Süleyman bin Rabi'ah el-Bahili ile Ömer arasında atların melezleşmesi, el-Esma'i, Muaviye ve Matar ibn Darraj'a göre özellikleri ve arenadaki on atın isimleri ve rütbeleri hakkında sordu. İbn al-Athir'de, el-İhşid Muhammed bin Tuğac'a durumundan şikayet eden mektup yazdı ve onu Rakka'ya getirdi, bu yüzden ona saygı gösterdi ve onurlandırdı. Çocukların ayakta durmasını durdurdu ve aralarında yürüdü Ona binmesini emretti, ama Tawzan atından inene kadar böyle yaptı. Tavzon'dan korkarak Mısır ve Şam'a eşlik etmek için çaba gösterdi, Bağdat'a dönmemek için çaba gösterdi, ancak kabul etmedi. El-Muttaqi, Fırat Nehri üzerindeki Rakka'dan Bağdat'a indi, Tavzan onu Sindiyye ile karşıladı, karaya indi, yere öptü ve dedi ki, 'Burada sağ elim ve size itaatimle doluyum, tıpkı onun, bakanın ve grubun olduğu gibi.' Sonra gözlerini kaçırdı ve yorulduğunda, kutsal yerden ve hizmetkarlardan yanından bağırıp çağırdı, dünya titredi. Tavzan, develere gece saldırmalarını emretti, böylece konuşmaları ortaya çıkmasın diye, sesleri susturuldu ve halifelik el-Muttaqi üç yıl yaşadı {atıf:kamil-ibn-al-athir s. 312-313} ve İbn al-Athir ile birlikte, 357 Hicri yılında Şa'ban'ın ortasında evinde öldü ve orada gömüldü {atıf:kamil-ibn-al-athir s. 433} İbn al-Jawzi ile birlikte Musul'a gitti, Banu Hamdan'ın yanında kaldı, onları Tuzun savaşına çağırdı, ardından ona barış için yazdı ve birini ona yemin ettirdi, ancak başarılı oldu. Otuz birinci yılda, hayvan avlamak için El-Şamasiye'ye gitti {atıf:Muntazam-ibn-al-jawzi s. 623, 633}."
  id: "Seorang khalifah Abbasiyah [329–333 H], Abu Ishaq Ibrahim ibn al-Muqtadir, diikrarkan setia setelah saudaranya al-Radi, yang berusia tiga puluh empat tahun, dan ibunya adalah seorang budak bernama Khalub, atau disebut Zahra. Ia tidak pernah mengubah apa pun, juga tidak merawat budak perempuannya. Ia berpuasa dan beribadah dengan melimpah, tidak pernah minum anggur, dan biasa berkata, 'Aku tidak ingin teman selain Al-Qur'an.' Ia hanya memiliki nama dan pengelolaan seorang juru tulis di Bajkam. Ia dipanggil oleh Tuzun pada tahun 33 H, dan dipenjara di sebuah pulau di seberang Al-Sindhiyah selama dua puluh lima tahun hingga ia meninggal di Sha'ban pada tahun 57 {cite:History-Khulafa-minhaj-1434, hlm. 608-611}. Menurut al-Mas'udi, ia adalah Abu Ishaq Ibrahim ibn al-Muqtadir. Ia telah bersumpah setia selama sepuluh tahun sebelum Rabi' al-Awwal pada tahun 329 H, digulingkan, dan matanya disegel pada hari Sabtu untuk hari ketiga sebelum Safar, tahun 333 H, sehingga kekhalifahannya berlangsung selama tiga tahun, sebelas bulan, dan dua puluh tiga hari. Sulayman ibn al-Hasan ibn Mukhlad diangkat sebagai wazir, kemudian Ahmad ibn Muhammad ibn Maymun, Muhammad ibn Ahmad al-Qaraiti, Ahmad ibn Abdullah al-Isfahani, dan Ali ibn Muhammad ibn Muqla menang. Abu al-Wafa Tuzun menang. Turki tidak memiliki perintah atau larangan. Perintah Buraidi di Basra semakin ketat, mereka memblokir kapal-kapal dan memperkuat pasukan mereka dengan air dan daratan. Hujriyat Sultan dan para pelayannya bergabung dengan mereka, dan pasukan Sultan menjadi Turki, Daylamit, dan Generasi, bersama sekelompok Qarmatian, bersama Tuzun {cite:Muruj-al-Dhahab, hlm. 691-692}. Al-Mas'udi mengadakan pertemuan sastra malam dengan Ruqayya dan pelayannya, dan ia mendengar seorang penyanyi membacakan puisi di mana ia membacakan puisi yang membacakan kabar baik dan menceritakan kepada saya seorang manusia kepada hambanya lagi. Kabar baik itu bertahan, jadi katakan kepada saya seorang manusia, dan ia terus berkata jangan katakan kabar baik, sehingga mereka berkata untuk terbang Panglima Orang Beriman memilih ayat ini dengan cara ini, sehingga itu urusannya sendiri. Dalam perjalanan dari Al-Rahbah ke Madiya 'Ana, ia menanyakan kisah Sulayman ibn Rabi'ah al-Bahili dengan Umar tentang hibridisasi kuda, karakteristik mereka menurut al-Asma'i, Muawiyah, dan Matar ibn Darraj, serta nama dan pangkat sepuluh kuda di arena {cite:muruj-al-dhahab, hlm. 695-699}. Di Ibn al-Athir, ia menulis kepada al-Ikhshid Muhammad ibn Tughaj mengeluhkan kondisinya dan membawanya ke Raqqa, sehingga ia menghormati dan menghormatinya. Ia menghentikan posisi anak-anak itu dan berjalan di antara Ia memerintahkan Al-Muttaqi untuk naik, namun ia melakukannya hingga ia turun. Ia berusaha menemaninya ke Mesir dan Levant dan tidak kembali ke Baghdad, karena takut pada Tawzon, namun ia tidak setuju. Al-Muttaqi turun dari Raqqa di Sungai Efrat ke Baghdad, di mana Tawzan menemuinya bersama Sindiyya, mendarat, mencium tanah, dan berkata, 'Di sini aku terpenuhi dengan tangan kananku dan ketaatan kepadamu, seperti padanya, menteri, dan kelompok itu.' Kemudian ia mengalihkan pandangannya, dan ketika ia lelah, ia berteriak dan berteriak dari sisi tubuhnya dari tempat suci dan pelayan, dan dunia bergetar. Tawzan memerintahkan unta-unta untuk menyerang di malam hari agar percakapan mereka tidak terungkap, dan suara mereka dibungkam, dan kekhalifahan al-Muttaqi hidup selama tiga tahun {cite:kamil-ibn-al-athir hlm. 312-313}, dan bersama Ibn al-Athir, di tengah masa Sha'ban pada tahun 357 H, al-Muttaqi meninggal di rumahnya dan dimakamkan di sana {cite:kamil-ibn-al-athir hlm. 433} Bersama Ibn al-Jawzi, ia pergi ke Mosul, tinggal bersama Banu Hamdan, memanggil mereka ke pertempuran Tuzun, lalu menulis surat damai kepadanya dan mengirim seseorang untuk bersumpah kepadanya, namun ia berhasil. Pada tahun tiga puluh satu, ia pergi ke Al-Shamasiyah untuk berburu binatang {cite:Muntazam-ibn-al-jawzi hlm. 623, 633}."
