id: person/salm-sahib-bayt-al-hikma
class: person
label:
  ar: سلم صاحب بيت الحكمة
  en: Salm, master of the House of Wisdom
  es: "Salm, master of the House of Wisdom"
  fr: "Salm, master of the House of Wisdom"
  ur: "سالم، حکمت کے گھر کا مالک"
summary:
  ar: "سلم صاحب بيت الحكمة في عهد المأمون، ذكره ابن النديم فيمن أخرجهم المأمون إلى ملك الروم في طلب ما يختار من العلوم القديمة المخزونة ببلد الروم، مع الحجاج بن مطر وابن البطريق وغيرهم، فحملوا ما وجدوا فأمرهم المأمون بنقله فنقلوه."
  en: "Salm, master of the House of Wisdom under al-Ma'mun; Ibn al-Nadim names him among the embassy the caliph sent to the Byzantine emperor to fetch chosen ancient sciences — with al-Hajjaj ibn Matar, Ibn al-Bitriq and others — who brought back what they found and were ordered to translate it."
  es: "Salm, maestro de la Casa de la Sabiduría bajo al-Ma'mun; Ibn al-Nadim lo menciona entre la embajada que el califa envió al emperador bizantino para traer ciencias antiguas selectas —junto con al-Hajjaj ibn Matar, Ibn al-Bitriq y otros— quienes trajeron lo que encontraron y recibieron la orden de traducirlo."
  fr: "Salm, maître de la Maison de la Sagesse sous al-Ma'mun; Ibn al-Nadim le nomme parmi l'ambassade que le calife envoya à l'empereur byzantin pour rapporter des sciences anciennes choisies — avec al-Hajjaj ibn Matar, Ibn al-Bitriq et d'autres — qui rapportèrent ce qu'ils trouvèrent et reçurent l'ordre de le traduire."
  ur: "سالم، المامون کے تحت حکمت کے گھر کا مالک؛ ابن الندیم نے اس کا نام اس سفارت خانے میں شامل کیا ہے جو خلیفہ نے بازنطینی شہنشاہ کو منتخب قدیم علوم لانے کے لیے بھیجا تھا - الحجاج ابن مطر، ابن البیترک اور دیگر کے ساتھ - جنہوں نے جو کچھ پایا اسے واپس لایا اور انہیں اس کا ترجمہ کرنے کا حکم دیا گیا۔"
