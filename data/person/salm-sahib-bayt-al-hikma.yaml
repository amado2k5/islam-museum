label:
  ar: سلم صاحب بيت الحكمة
  en: Salm, master of the House of Wisdom
summary:
  ar: "سلم صاحب بيت الحكمة في عهد المأمون، ذكره ابن النديم فيمن أخرجهم المأمون إلى ملك الروم في طلب ما يختار من العلوم القديمة المخزونة ببلد الروم، مع الحجاج بن مطر وابن البطريق وغيرهم، فحملوا ما وجدوا فأمرهم المأمون بنقله فنقلوه."
  en: "Salm, master of the House of Wisdom under al-Ma'mun; Ibn al-Nadim names him among the embassy the caliph sent to the Byzantine emperor to fetch chosen ancient sciences — with al-Hajjaj ibn Matar, Ibn al-Bitriq and others — who brought back what they found and were ordered to translate it."
