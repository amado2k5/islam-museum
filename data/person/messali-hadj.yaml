summary:
  ar: "سياسي وطني جزائري (1898–1974) يُلقب بأبي الوطنية الجزائرية؛ أسس نجم شمال إفريقيا (1926) ثم حزب الشعب الجزائري (1937) وحركة انتصار الحريات الديمقراطية والحركة الوطنية الجزائرية، وقضى عقودًا بين السجن والنفي في سبيل استقلال الجزائر عن فرنسا."
  en: "Algerian nationalist politician (1898–1974), often called the father of Algerian nationalism. He founded the Étoile nord-africaine (1926), the Parti du peuple algérien (1937), the MTLD and the Mouvement national algérien, and spent decades in prison and exile in the cause of Algerian independence from France."
  ur: "جزائری قوم پرست سیاست دان (1898–1974) جنہیں جزائری قوم پرستی کا باپ کہا جاتا ہے؛ انہوں نے نجم شمال افریقہ (1926)، پھر حزب الشعب الجزائری (1937) اور بعد کی تحریکیں قائم کیں، اور فرانس سے جزائر کی آزادی کی جدوجہد میں دہائیاں قید و جلاوطنی میں گزاریں۔"
