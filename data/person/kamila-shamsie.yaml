summary:
  ar: "كاملة شمسي (وُلدت سنة 1973) روائية باكستانية بريطانية وُلدت في كراتشي في أسرة من الكتّاب؛ والدتها الصحفية والمحررة منيزة شمسي، وخالة والدتها الكاتبة عطية حسين. تلقت تعليمها في مدرسة كراتشي النحوية وكلية هاملتون وجامعة ماساتشوستس في أمهرست، ونشرت ثماني روايات من «In the City by the Sea» (1998) إلى «Best of Friends» (2022)؛ وفازت روايتها «Home Fire» (2017) بجائزة المرأة للرواية. ومن كتبها غير الروائية «Offence — The Muslim Case» (2009). انتقلت إلى لندن سنة 2007 وتحمل الجنسيتين الباكستانية والبريطانية."
  en: "Kamila Shamsie (born 1973) is a Pakistani-British novelist born in Karachi into a family of writers — her mother is the journalist and editor Muneeza Shamsie and her great-aunt was the writer Attia Hosain. Educated at Karachi Grammar School, Hamilton College and the University of Massachusetts Amherst, she has published eight novels from In the City by the Sea (1998) to Best of Friends (2022); Home Fire (2017) won the Women's Prize for Fiction. Her non-fiction includes Offence — The Muslim Case (2009). She moved to London in 2007 and holds dual Pakistani and British nationality."
  ur: "کاملہ شمسی (پیدائش 1973) کراچی میں پیدا ہونے والی پاکستانی برطانوی ناول نگار ہیں، جن کا تعلق ادیبوں کے خاندان سے ہے — ان کی والدہ صحافی و ایڈیٹر منیزہ شمسی ہیں اور ان کی پرخالہ مصنفہ عطیہ حسین تھیں۔ کراچی گرامر اسکول، ہیملٹن کالج اور یونیورسٹی آف میساچوسٹس ایمہرسٹ سے تعلیم پائی، اور «In the City by the Sea» (1998) سے «Best of Friends» (2022) تک آٹھ ناول شائع کیے؛ «Home Fire» (2017) نے ویمنز پرائز برائے فکشن جیتا۔ ان کی غیر افسانوی کتابوں میں «Offence — The Muslim Case» (2009) شامل ہے۔ 2007 میں لندن منتقل ہو گئیں اور دوہری پاکستانی و برطانوی شہریت رکھتی ہیں۔"

