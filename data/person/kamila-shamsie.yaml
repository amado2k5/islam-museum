summary:
  ar: "كاملة شمسي ⁦(وُلدت سنة 1973)⁩ روائية باكستانية بريطانية وُلدت في كراتشي في أسرة من الكتّاب؛ والدتها الصحفية والمحررة منيزة شمسي، وخالة والدتها الكاتبة عطية حسين. تلقت تعليمها في مدرسة كراتشي النحوية وكلية هاملتون وجامعة ماساتشوستس في أمهرست، ونشرت ثماني روايات من «In the City by the Sea» (1998) إلى «Best of Friends» (2022)؛ وفازت روايتها «Home Fire» (2017) بجائزة المرأة للرواية. ومن كتبها غير الروائية «Offence — The Muslim Case» (2009). انتقلت إلى لندن سنة 2007 وتحمل الجنسيتين الباكستانية والبريطانية."
  en: "Kamila Shamsie (born 1973) is a Pakistani-British novelist born in Karachi into a family of writers — her mother is the journalist and editor Muneeza Shamsie and her great-aunt was the writer Attia Hosain. Educated at Karachi Grammar School, Hamilton College and the University of Massachusetts Amherst, she has published eight novels from In the City by the Sea (1998) to Best of Friends (2022); Home Fire (2017) won the Women's Prize for Fiction. Her non-fiction includes Offence — The Muslim Case (2009). She moved to London in 2007 and holds dual Pakistani and British nationality."
  ur: "کاملہ شمسی ⁦(پیدائش 1973)⁩ کراچی میں پیدا ہونے والی پاکستانی برطانوی ناول نگار ہیں، جن کا تعلق ادیبوں کے خاندان سے ہے — ان کی والدہ صحافی و ایڈیٹر منیزہ شمسی ہیں اور ان کی پرخالہ مصنفہ عطیہ حسین تھیں۔ کراچی گرامر اسکول، ہیملٹن کالج اور یونیورسٹی آف میساچوسٹس ایمہرسٹ سے تعلیم پائی، اور «In the City by the Sea» (1998) سے «Best of Friends» (2022) تک آٹھ ناول شائع کیے؛ «Home Fire» (2017) نے ویمنز پرائز برائے فکشن جیتا۔ ان کی غیر افسانوی کتابوں میں «Offence — The Muslim Case» (2009) شامل ہے۔ 2007 میں لندن منتقل ہو گئیں اور دوہری پاکستانی و برطانوی شہریت رکھتی ہیں۔"
  es: "Kamila Shamsie (nacida en 1973) es una novelista pakistaní-británica nacida en Karachi en el seno de una familia de escritores: su madre es la periodista y editora Muneeza Shamsie y su tía abuela fue la escritora Attia Hosain. Estudió en la Karachi Grammar School, el Hamilton College y la Universidad de Massachusetts Amherst. Ha publicado ocho novelas, desde In the City by the Sea (1998) hasta Best of Friends (2022); Home Fire (2017) ganó el Premio de Ficción Femenina. Entre sus obras de no ficción se encuentra Offense—The Muslim Case (2009). Se mudó a Londres en 2007 y posee doble nacionalidad pakistaní y británica."
  fr: "Kamila Shamsie (née en 1973) est une romancière pakistano-britannique née à Karachi dans une famille d'écrivains: sa mère est la journaliste et éditrice Muneeza Shamsie et sa grand-tante était l'écrivaine Attia Hosain. Après des études à la Karachi Grammar School, au Hamilton College et à l'Université du Massachusetts à Amherst, elle a publié huit romans, de *In the City by the Sea* (1998) à *Best of Friends* (2022); *Home Fire* (2017) a remporté le Women's Prize for Fiction. Parmi ses essais figure *Offense—The Muslim Case* (2009). Installée à Londres depuis 2007, elle possède la double nationalité pakistanaise et britannique."
  tr: "Kamla Shamsi (1973 doğumlu), Karaçi'de doğmuş Pakistanlı-İngiliz bir romancıdır; annesi gazeteci ve editör Muneeza Shamsi, annesinin teyzesi ise yazar Atiya Hussain'dir. Karachi Grammar School, Hamilton College ve Massachusetts Üniversitesi Amherst'te eğitim görmüş ve \"In the City by the Sea\" (1998) ile \"Best of Friends\" (2022) arasında sekiz roman yayımlamıştır; romanı \"Home Fire\" (2017) Kadınlar Roman Ödülü'nü kazanmıştır. Kurgu dışı kitapları arasında \"Offence — The Muslim Case\" (2009) bulunmaktadır. 2007'de Londra'ya taşındı ve hem Pakistan hem de İngiliz vatandaşlığına sahiptir."
  id: "Kamla Shamsi (lahir 1973) adalah seorang novelis Pakistan-Inggris yang lahir di Karachi dalam keluarga penulis; ibunya adalah jurnalis dan editor Muneeza Shamsi, dan bibi dari pihak ibu adalah penulis Atiya Hussain. Dia menempuh pendidikan di Karachi Grammar School, Hamilton College, dan University of Massachusetts Amherst, serta telah menerbitkan delapan novel mulai dari \"In the City by the Sea\" (1998) hingga \"Best of Friends\" (2022); novelnya \"Home Fire\" (2017) memenangkan Women's Prize for Novel. Di antara buku non-fiksinya adalah \"Offense — The Muslim Case\" (2009). Dia pindah ke London pada tahun 2007 dan memegang kewarganegaraan Pakistan dan Inggris."

