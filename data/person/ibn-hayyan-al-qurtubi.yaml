id: person/ibn-hayyan-al-qurtubi
class: person
label: { ar: "ابن حيان المؤرخ الأندلسي" }
summary:
  ar: "أبو مروان ابن حيان المؤرخ الأندلسي، صاحب المقتبس في أخبار بلد الأندلس والمقتبس في تاريخ رجال الأندلس وكتاب المتين وكتاب الدولة العامرية والتاريخ الكبير في أخبار أهل الأندلس؛ يستشهد به المقري في نفح الطيب عشرات المرات في فتح الأندلس وأخبار الأمويين بها، وعنده أن قنطرة قرطبة الكبرى بُنيت على أمر عمر بن عبد العزيز على النهر الأعظم بدار مملكتها قرطبة، وأن من أراد الوقوف على فتنة برشبنة وبطليوس وما جرى فيها من مباني الإسلام فعليه بتاريخ ابن حيان {cite:nafh-tib-maqqari p. 189, 354, 137}."
  en: "Abu Marwan Ibn Hayyan, the Andalusi historian whose Muqtabis, Matin, book of the Amirid state and 'Great History of the People of al-Andalus' al-Maqqari cites dozens of times for the conquest and the Umayyad centuries — including his note that Cordoba's great bridge was built by order of Umar ibn Abd al-Aziz {cite:nafh-tib-maqqari p. 189, 354}."
  es: "Abu Marwan Ibn Hayyan, el historiador andalusí cuyo libro Muqtabis, Matin, del estado amirí y 'Gran historia del pueblo de al-Andalus' al-Maqqari cita docenas de veces sobre la conquista y los siglos omeyas, incluida su nota de que el gran puente de Córdoba fue construido por orden de Umar ibn Abd al-Aziz {cita:nafh-tib-maqqari p. 189, 354}."
  fr: "Abu Marwan Ibn Hayyan, l'historien andalou dont Muqtabis, Matin, livre de l'État amiride et « Grande Histoire du peuple d'al-Andalus » al-Maqqari cite des dizaines de fois la conquête et les siècles omeyyades — y compris sa note selon laquelle le grand pont de Cordoue a été construit sur ordre d'Umar ibn Abd al-Aziz {cite:nafh-tib-maqqari p. 189, 354}."
  ur: "ابو مروان ابن حیان، اندلس کا مؤرخ جس کے مقتبس، متین، امیری ریاست کی کتاب اور 'اندلس کے لوگوں کی عظیم تاریخ' المقاری نے درجنوں مرتبہ فتح اور اموی صدیوں کے حوالے سے نقل کیا ہے {حوالہ: نفح تبع مقری ص۔ 189، 354}۔"
