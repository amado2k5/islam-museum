label: { ar: "ابن حيان المؤرخ الأندلسي" }
summary:
  ar: "أبو مروان ابن حيان المؤرخ الأندلسي، صاحب المقتبس في أخبار بلد الأندلس والمقتبس في تاريخ رجال الأندلس وكتاب المتين وكتاب الدولة العامرية والتاريخ الكبير في أخبار أهل الأندلس؛ يستشهد به المقري في نفح الطيب عشرات المرات في فتح الأندلس وأخبار الأمويين بها، وعنده أن قنطرة قرطبة الكبرى بُنيت على أمر عمر بن عبد العزيز على النهر الأعظم بدار مملكتها قرطبة، وأن من أراد الوقوف على فتنة برشبنة وبطليوس وما جرى فيها من مباني الإسلام فعليه بتاريخ ابن حيان {cite:nafh-tib-maqqari p. 189, 354, 137}."
  en: "Abu Marwan Ibn Hayyan, the Andalusi historian whose Muqtabis, Matin, book of the Amirid state and 'Great History of the People of al-Andalus' al-Maqqari cites dozens of times for the conquest and the Umayyad centuries — including his note that Cordoba's great bridge was built by order of Umar ibn Abd al-Aziz {cite:nafh-tib-maqqari p. 189, 354}."
