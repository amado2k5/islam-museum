summary:
  ar: "من بني ليث، كان في سرية ابن أبي حدرد إلى إضم فقتل عامر بن الأضبط الأشجعي بعد أن سلّم بتحية الإسلام، لشيء كان بينهما؛ قُبلت فيه الدية بحنين ودعا عليه النبي: اللهم لا تغفر لمحلّم، ويروي الحسن البصري أنه مات بعد سبع فلفظته الأرض؛ يسميه ابن إسحاق ملجماً وابن هشام محلّماً."
  en: "Of Banu Layth; in Ibn Abi Hadrad's detachment to Idam he killed Amir ibn al-Adbat al-Ashja'i after the man had given the greeting of Islam, over an old grudge; blood-money was accepted at Hunayn and the Prophet prayed 'O God, do not forgive Muhallim'; al-Hasan al-Basri reports he died within seven days and the earth cast him out. Ibn Ishaq calls him Muljim, Ibn Hisham Muhallim."
