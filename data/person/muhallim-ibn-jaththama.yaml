summary:
  ar: "من بني ليث، كان في سرية ابن أبي حدرد إلى إضم فقتل عامر بن الأضبط الأشجعي بعد أن سلّم بتحية الإسلام، لشيء كان بينهما؛ قُبلت فيه الدية بحنين ودعا عليه النبي: اللهم لا تغفر لمحلّم، ويروي الحسن البصري أنه مات بعد سبع فلفظته الأرض؛ يسميه ابن إسحاق ملجماً وابن هشام محلّماً."
  en: "Of Banu Layth; in Ibn Abi Hadrad's detachment to Idam he killed Amir ibn al-Adbat al-Ashja'i after the man had given the greeting of Islam, over an old grudge; blood-money was accepted at Hunayn and the Prophet prayed 'O God, do not forgive Muhallim'; al-Hasan al-Basri reports he died within seven days and the earth cast him out. Ibn Ishaq calls him Muljim, Ibn Hisham Muhallim."
  es: "De Banu Layth; en el destacamento de Ibn Abi Hadrad a Idam, mató a Amir ibn al-Adbat al-Ashja'i después de que este le diera el saludo del Islam, debido a un antiguo rencor; se aceptó dinero de sangre en Hunayn y el Profeta oró: «¡Oh Dios, no perdones a Muhallim!»; al-Hasan al-Basri relata que murió a los siete días y la tierra lo expulsó. Ibn Ishaq lo llama Muljim, Ibn Hisham Muhallim."
  fr: "Ibn Abi Hadrad, membre de la tribu Banu Layth, assassina Amir ibn al-Adbat al-Ashja'i après que ce dernier eut prononcé le salut de l'islam, en raison d'une vieille rancune. Le prix du sang fut accepté à Hunayn et le Prophète implora: « Ô Dieu, ne pardonne pas à Muhallim. » Al-Hasan al-Basri rapporte qu'il mourut sept jours plus tard et que la terre le rejeta. Ibn Ishaq le nomme Muljim, Ibn Hisham Muhallim."
  ur: "بنو لیث کے؛ ابن ابی حدرد کی ادم سے لاتعلقی میں اس نے امیر بن العدبۃ الاشجعی کو ایک پرانی رنجش پر اس شخص کے اسلام کا سلام دینے کے بعد قتل کر دیا۔ حنین میں خون کی رقم قبول کی گئی اور نبی نے دعا کی کہ اے اللہ، محرم کو معاف نہ کر۔ حسن البصری کا بیان ہے کہ وہ سات دن کے اندر فوت ہوگیا اور زمین نے اسے نکال دیا۔ ابن اسحاق اسے ملجم کہتے ہیں، ابن ہشام محلم کہتے ہیں۔"
