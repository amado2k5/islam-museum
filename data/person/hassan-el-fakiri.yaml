summary:
  ar: "لاعب كرة قدم نرويجي سابق من أصل مغربي (وُلد سنة 1977 في تمسمان بالمغرب)، لعب لمنتخب النرويج ثماني مباريات، وتنقّل بين لين وبران وموناكو وبوروسيا مونشنغلادباخ، ثم اتجه إلى التدريب فعمل مساعداً في سانت إتيان ومدرباً لتطوير اللاعبين في بران."
  en: "Former Norwegian footballer of Moroccan origin (born 1977 in Temsamane, Morocco), capped eight times by Norway, who played for Lyn, Brann, Monaco and Borussia Mönchengladbach before moving into coaching, as an assistant at Saint-Étienne and a player development coach at Brann."
