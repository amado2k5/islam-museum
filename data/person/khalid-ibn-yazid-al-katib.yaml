label: { ar: "خالد بن يزيد الكاتب", en: "Khalid ibn Yazid al-Katib", es: "Khalid ibn Yazid al-Katib", fr: "Khalid ibn Yazid al-Katib", ur: "خالد بن یزید الکتب" }
summary:
  ar: "خالد بن يزيد التميمي أبو الهيثم، خراساني الأصل، كان أجدّ كتاب الجيش ببغداد وله شعر مروي، وعاش دهرًا طويلًا واختلط في آخر عمره. نادم علي بن هشام فبلغه في ندمائه حتى قُتل، ثم صحب الفضل بن مروان فذكره للمعتصم بالماحوزة قبل أن تُبنى سرّ من رأى فأمر بإحضاره واستنشده فأعجب به، ولما بُنيت سامراء قال فيها شعره المشهور فاستحسنه الفضل وأوصله إلى المعتصم فأعطاه ثلاثمائة وخمسين دينارًا. ومن شعره مطلع قصيدته «إن كنتَ تهواني فأذني يا تاركَ الجسم بلا قلب». وكان يمشي فيصبيان الجُلَّ يرجمونه ويقولون «يا خالد يا بارد» فيجيب «ويلكم أنا بارد وأنا الذي أقول» ويتلو شعره. توفي سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 35-37}."
  en: "Khalid ibn Yazid al-Tamimi Abu'l-Haytham — dean of the diwan al-jaysh secretaries at Baghdad, poet and wit, companion of Ali ibn Hisham then of al-Fadl ibn Marwan who presented him to al-Mu'tasim at al-Mahuza before Samarra was built; paid 350 dinars for his verses on the new city. In old age boys stoned him crying 'cold Khalid!', and he answered 'woe to you — cold, when I am the one who says—' and recited his verse {cite:muntazam-ibn-al-jawzi p. 35-37}."
  es: "Khalid ibn Yazid al-Tamimi Abu'l-Haytham — decano de los secretarios del diwan al-jaysh en Bagdad, poeta e ingenioso, compañero de Ali ibn Hisham y luego de al-Fadl ibn Marwan, quien lo presentó a al-Mu'tasim en al-Mahuza antes de la construcción de Samarra; pagó 350 dinares por sus versos sobre la nueva ciudad. En su vejez, unos muchachos lo apedrearon gritando \"¡Frío Khalid!\", y él respondió \"¡Ay de vosotros, fríos, cuando soy yo quien dice...!\" y recitó su verso {cite:muntazam-ibn-al-jawzi p. 35-37}."
  fr: "Khalid ibn Yazid al-Tamimi Abu'l-Haytham, doyen des secrétaires du diwan al-jaysh à Bagdad, poète et esprit brillant, compagnon d'Ali ibn Hisham puis d'al-Fadl ibn Marwan qui le présenta à al-Mu'tasim à al-Mahuza avant la construction de Samarra, paya 350 dinars pour ses vers sur la nouvelle ville. Dans sa vieillesse, des garçons le lapidèrent en criant « Khalid le froid ! », et il répondit: « Malheur à vous ! Froid, alors que c'est moi qui dis… », et récita son vers {cite: muntazam-ibn-al-jawzi p. 35-37}."
  ur: "خالد بن یزید التمیمی ابو الہیثم - بغداد میں دیوان الجیش سکریٹریز کے ڈین، شاعر اور دانشور، علی ابن ہشام کے ساتھی، اس وقت کے الفضل ابن مروان کے ساتھی جنہوں نے سامرہ کی تعمیر سے پہلے المحوزہ میں المعتصم کو پیش کیا؛ نئے شہر پر اپنی آیات کے لیے 350 دینار ادا کیے تھے۔ بڑھاپے میں لڑکوں نے اسے ’’ٹھنڈا خالد‘‘ پکارتے ہوئے سنگسار کیا، اور اس نے جواب دیا ’’تجھ پر افسوس - سردی، جب کہنے والا میں ہوں‘‘ اور اس کی آیت پڑھی۔ 35-37}۔"
