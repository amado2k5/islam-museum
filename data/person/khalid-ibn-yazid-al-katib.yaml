id: person/khalid-ibn-yazid-al-katib
class: person
label: { ar: "خالد بن يزيد الكاتب", en: "Khalid ibn Yazid al-Katib" }
summary:
  ar: "خالد بن يزيد التميمي أبو الهيثم، خراساني الأصل، كان أجدّ كتاب الجيش ببغداد وله شعر مروي، وعاش دهرًا طويلًا واختلط في آخر عمره. نادم علي بن هشام فبلغه في ندمائه حتى قُتل، ثم صحب الفضل بن مروان فذكره للمعتصم بالماحوزة قبل أن تُبنى سرّ من رأى فأمر بإحضاره واستنشده فأعجب به، ولما بُنيت سامراء قال فيها شعره المشهور فاستحسنه الفضل وأوصله إلى المعتصم فأعطاه ثلاثمائة وخمسين دينارًا. ومن شعره مطلع قصيدته «إن كنتَ تهواني فأذني يا تاركَ الجسم بلا قلب». وكان يمشي فيصبيان الجُلَّ يرجمونه ويقولون «يا خالد يا بارد» فيجيب «ويلكم أنا بارد وأنا الذي أقول» ويتلو شعره. توفي سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 35-37}."
  en: "Khalid ibn Yazid al-Tamimi Abu'l-Haytham — dean of the diwan al-jaysh secretaries at Baghdad, poet and wit, companion of Ali ibn Hisham then of al-Fadl ibn Marwan who presented him to al-Mu'tasim at al-Mahuza before Samarra was built; paid 350 dinars for his verses on the new city. In old age boys stoned him crying 'cold Khalid!', and he answered 'woe to you — cold, when I am the one who says—' and recited his verse {cite:muntazam-ibn-al-jawzi p. 35-37}."
