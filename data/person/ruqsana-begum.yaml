summary:
  ar: "كيك بوكسر وملاكمة بريطانية وُلدت في لندن سنة 1983 لأسرة من أصل بنغلاديشي. تدرّبت سراً نحو خمس سنوات خوفاً من اعتراض أسرتها، ثم فازت باللقب البريطاني سنة 2010 وبلقب عالمي سنة 2016، وصمّمت خط حجاب رياضي للنساء، وألّفت كتاب «مقاتلة بالفطرة». وهي أيضاً مهندسة معمارية بالتدريب."
  en: "British kickboxer and boxer born in London in 1983 to a family of Bangladeshi origin. She trained in secret for almost five years before telling her family, won the British title in 2010 and a world title in 2016, designed a sports-hijab line for women, and wrote the book Born Fighter. She is also a trained architect."
