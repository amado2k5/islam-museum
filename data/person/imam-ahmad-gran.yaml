summary:
  ar: "الإمام الجراد أحمد مجاهد بلاد الحبشة، في شذرات الذهب سنة أربع وثلاثين وتسع مئة أخذ مدينة هرر من بلاد الحبشة وضعف عن مقاومته سلطانها ولم يزل أمره يعظم حتى صار إلى ما صار إليه واستفتح كثيراً من بلاد الحبشة وقهر الكفار وواظب على الجهاد والغزو في سبيل الله ونقل عنه في ذلك ما يبهر العقول حتى قيل ما تشبه فتوحاته إلا فتوحات الصحابة وحكي من أمر شجاعته وإجراء أموره على قوانين الشريعة المطهرة شيء كثير {cite:shadharat-dhahab p. 617}."
  en: "Imam Ahmad Gran of Harar — Shadharat records his seizure of Harar from the Abyssinian lands, his irresistible rise, the conquest of much of Abyssinia, and a jihad so wondrous 'it was said his conquests resemble only the Companions' conquests', all conducted on the paths of the shari'a {cite:shadharat-dhahab p. 617}."
