id: person/imam-ahmad-gran
class: person
label: { ar: "الإمام أحمد جران", en: "Imam Ahmad Gran", es: "Imam Ahmad Gran", fr: "Imam Ahmad Gran", ur: "امام احمد گران" }
summary:
  ar: "الإمام الجراد أحمد مجاهد بلاد الحبشة، في شذرات الذهب سنة أربع وثلاثين وتسع مئة أخذ مدينة هرر من بلاد الحبشة وضعف عن مقاومته سلطانها ولم يزل أمره يعظم حتى صار إلى ما صار إليه واستفتح كثيراً من بلاد الحبشة وقهر الكفار وواظب على الجهاد والغزو في سبيل الله ونقل عنه في ذلك ما يبهر العقول حتى قيل ما تشبه فتوحاته إلا فتوحات الصحابة وحكي من أمر شجاعته وإجراء أموره على قوانين الشريعة المطهرة شيء كثير {cite:shadharat-dhahab p. 617}."
  en: "Imam Ahmad Gran of Harar — Shadharat records his seizure of Harar from the Abyssinian lands, his irresistible rise, the conquest of much of Abyssinia, and a jihad so wondrous 'it was said his conquests resemble only the Companions' conquests', all conducted on the paths of the shari'a {cite:shadharat-dhahab p. 617}."
  es: "El Imam Ahmad Gran de Harar — Shadharat registra su toma de Harar de las tierras abisinias, su ascenso irresistible, la conquista de gran parte de Abisinia y una yihad tan maravillosa que \"se decía que sus conquistas se parecían solo a las conquistas de los Compañeros\", todo llevado a cabo en los caminos de la sharia {cite:shadharat-dhahab p. 617}."
  fr: "L'imam Ahmad Gran de Harar — Shadharat relate sa prise de Harar sur les terres abyssiniennes, son ascension irrésistible, la conquête d'une grande partie de l'Abyssinie et un jihad si prodigieux « qu'on disait que ses conquêtes ne ressemblaient qu'à celles des Compagnons », le tout mené selon les voies de la charia {cite:shadharat-dhahab p. 617}."
  ur: "ہرار کے امام احمد گران - شدارت نے حبشی سرزمین سے حرار پر قبضہ، اس کا ناقابل شکست عروج، حبشہ کے زیادہ تر علاقوں کی فتح، اور ایک ایسا حیرت انگیز جہاد درج کیا ہے، 'کہا جاتا ہے کہ اس کی فتوحات صرف صحابہ کی فتوحات سے مشابہت رکھتی ہیں'، یہ سب کچھ شریعت اسلامیہ کے راستوں پر کیا گیا تھا۔ 617}۔"
  tr: "Habeşistan'ın İmam el-Cerad Ahmed Mücahid, 934 H yılında Şadharat el-Dhahab'da Habeşistan'dan Harar şehrini ele geçirdi, direnişiyle otoritesini zayıflattı ve davası büyümeye devam etti, ta ki elde ettiği noktaya ulaşana kadar. Habeşistan'ın büyük bir kısmını fethetti, kâfirleri yendi ve Allah yolunda cihat ve savaşlarda ısrar etti. Bu konuda onun hakkında söylenen sözler zihinleri öyle bir şekilde şaşırtır ki, sahabelerin zaferlerinden başka hiçbir şeyin onun zaferlerine benzemediği söylenir. Cesareti ve Şeriat'ın saf yasalarına göre işleri yürütmesi hakkında çok şey söylenmiştir {atıf:shadharat-dhahab, s. 617}."
  id: "Imam al-Jarad Ahmad Mujahid dari Abyssinia, di Shadharat al-Dhahab pada tahun 934 H, merebut kota Harar dari Abyssinia, melemahkan otoritasnya karena perlawanannya, dan perjuangannya terus berkembang hingga mencapai apa yang telah dicapainya. Ia menaklukkan sebagian besar Abyssinia, menaklukkan kaum kafir, dan terus berjuang dalam jihad serta pertempuran di jalan Allah. Kata-kata tentang dirinya dalam hal ini membuat pikiran terkejut, sampai-sampai dikatakan bahwa tidak ada yang menyerupai penaklukannya kecuali para sahabat. Banyak yang telah dikatakan tentang keberaniannya dan kepemimpinannya sesuai hukum murni Syariah {cite:shadharat-dhahab, hlm. 617}."
