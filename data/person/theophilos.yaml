summary:
  ar: "ملك الروم خرج في عساكره ومعه ملوك برجان والبرغر والصقالبة حتى نزل على زبطرة من الثغر الخزري فافتتحها بالسيف وسبى وأغار على بلاد ملطية سنة ثلاث وعشرين ومائتين، فلقي الأفشين في بلاد الروم فهزمه وقتل أكثر بطارقته وحماه رجل من المتنصرة يقال له نصير {cite:muruj-al-dhahab p. 449-450}."
  en: "The Byzantine emperor whose sack of Zibatra provoked al-Mu'tasim's march — routed by al-Afshin and shielded by the convert Nasir {cite:muruj-al-dhahab p. 449-450}."
  es: "El emperador bizantino cuyo saqueo de Zibatra provocó la marcha de al-Mu'tasim, derrotado por al-Afshin y protegido por el converso Nasir {cite:muruj-al-dhahab p. 449-450}."
  fr: "L'empereur byzantin dont le sac de Zibatra a provoqué la marche d'al-Mu'tasim — mis en déroute par al-Afshin et protégé par le converti Nasir {cite:muruj-al-dhahab p. 449-450}."
  ur: "بازنطینی شہنشاہ جس کی زباطرہ کی بوری نے المعتصم کے مارچ کو اکسایا تھا - جسے الفشین نے شکست دی تھی اور تبدیل کرنے والے ناصر کی طرف سے حفاظت کی گئی تھی۔ 449-450}۔"
  tr: "Roma kralı, ordularıyla birlikte Burjan, Berger ve Slav krallarıyla birlikte yürüyerek Hazar sınırından Zabtra'ya çıkarma yaptı, kılıçla ele geçirdi, ele geçirdi ve 223 Hicri yılında Malatya topraklarına baskın düzenledi. Afshin ile Roma topraklarında karşılaştı, onu yendi ve haraç ile daha fazlasını öldürdü. Nasir adında bir Hristiyan tarafından korundu {cite:muruj-al-dhahab, s. 449-450}."
  id: "Raja Romawi berbaris keluar bersama pasukannya bersama raja-raja Burjan, Berger, dan bangsa Slavia, hingga ia mendarat di Zabtra dari perbatasan Khazar, merebutnya dengan pedang, merebutnya, dan menyerang tanah Malatya pada tahun 223 H. Ia bertemu Afshin di tanah Romawi, mengalahkannya, dan membunuh lebih banyak lagi dengan upetinya. Ia dilindungi oleh seorang pria Kristen bernama Nasir {cite:muruj-al-dhahab, hlm. 449-450}."
