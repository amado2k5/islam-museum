summary:
  ar: "عبد القادر السبكي المصري المجذوب؛ قال في الكواكب: كان مجذوباً ثم أفاق في آخر عمره وصار يصلي ويقرأ كل يوم ختمة مع بقاء أحواله من الكشف والرؤى، وهو راكب حارته يسوقها على الماء أيام وفاء النيل، وكان يخدم الأرامل ويشتري لهن الحوائج ويضع كل ما يشتريه في إناء واحد من زيت وشيرج وعسل ورب وغير ذلك ثم يعطي كل واحدة حاجتها من غير اختلاط، وكان تارة يلبس زي الجند وتارة زي الريافة وتارة زي الفقراء، وكان يعتب من ينكر عليه؛ مات في جمادى الآخرة {cite:shadharat-dhahab p. 326-327}."
  en: "'Abd al-Qadir al-Sabki — a majdhub who 'came to' late in life and began a daily khatma, yet kept riding his mare over the water in the days of the Nile's flood; he served the widows — buying oil, butter, honey and treacle in a single vessel and doling each her need unmingled — dressed by turns as a soldier, a horseman and a faqir, chiding those who denied him; died Jumada II [960] {cite:shadharat-dhahab p. 326-327}."
