id: person/quraysh-ibn-badran
class: person
label: { ar: "قريش بن بدران العقيلي", en: "Quraysh ibn Badran al-Uqayli", es: "Quraysh ibn Badran al-Uqayli", fr: "Quraysh ibn Badran al-Uqayli", ur: "قریش ابن بدران عقیلی" }
summary:
  ar: "قريش بن بدران بن المقلد العقيلي أمير بني عقيل وصاحب الموصل بعد قرواش بن المقلد سنة أربع وأربعين وأربعمائة؛ حمى بلاد الجزيرة من الغز وناصب البساسيري حين خرج على الخليفة القائم {cite:muntazam-ibn-al-jawzi j.8 p.489-490}. قام بالأمر بعد قرواش سنة ٤٤٢ وبعد بركة بن المقلد زعيم الدولة سنة ٤٤٣، وقصد الأنبار سنة ٤٤٦ ففتحها وخطب بها وبالموصل {cite:muntazam-ibn-al-jawzi j.8 p.489,493,502}."
  en: "Succeeding Qirwash in 444, the Uqaylid amir of Mosul who fought the Ghuzz in the Jazira and stood against al-Basasiri's rebellion on the caliph al-Qa'im {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  es: "Sucediendo a Qirwash en 444, el emir uqaylid de Mosul que luchó contra los Ghuzz en el Jazira y se opuso a la rebelión de al-Basasiri contra el califa al-Qa'im {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  fr: "Succédant à Qirwash en 444, l'émir Uqaylide de Mossoul qui a combattu les Ghuzz dans la Jazira et s'est opposé à la rébellion d'al-Basasiri contre le calife al-Qa'im {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  ur: "444 میں قرواش کی کامیابی کے بعد، موصل کا عقیلی امیر جس نے جزیرہ میں غزو سے جنگ کی اور خلیفہ القائم کے خلاف البصیری کی بغاوت کے خلاف کھڑے ہوئے۔"
  tr: "Qureyş bin Badran ibn al-Muqallid el-Aqili, Banu Aqil Emiri ve 444 Hicri yılında Kurvaş ibn el-Muqallid'den sonra Musul'un hükümdarı; Halife el-Qa'im'e karşı isyan ettiğinde Cazire topraklarını Gazilerden ve Nasib el-Basasiri'den korudu {cite:Muntazam-ibn-al-Jawzi J.8 s.489-490}. 442'de Karwash'tan sonra ve 443'te devletin lideri Baraka ibn al-Muqallid'den sonra komutayı devraldı, 446'da Anbar'a gitti, şehri fethetti ve orada ve Musul'da vaazlar verdi {cite:Muntazam-ibn-al-Jawzi J.8 s.489,493,502}."
  id: "Quraysh ibn Badran ibn al-Muqallid al-Aqili, Emir Banu Aqil dan penguasa Mosul setelah Qurwasha ibn al-Muqallid pada tahun 444 H; ia melindungi tanah Jazira dari Ghazis dan Nasib al-Basasiri ketika memberontak melawan Khalifah al-Qa'im {cite:Muntazam-ibn-al-Jawzi J.8 hlm.489-490}. Ia mengambil alih komando setelah Qarwash pada tahun 442 dan setelah Baraka ibn al-Muqallid, pemimpin negara pada tahun 443, lalu pergi ke Anbar pada tahun 446, menaklukkannya, dan menyampaikan khotbah di sana dan Mosul {cite:Muntazam-ibn-al-Jawzi J.8 hlm.489,493,502}."
