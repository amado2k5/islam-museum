label:
  ar: "علي بن محمد ابن غانم المقدسي"
  en: "Ali ibn Muhammad ibn Ghanim al-Maqdisi"
summary:
  ar: "علي بن محمد بن علي بن خليل الخزرجي، نور الدين، المعروف بابن غانم المقدسي الأصل القاهري، رأس الحنفية في عصره. تفقه على ابن النجار الحنبلي وابن الشلبي وناصر الدين الطبلاوي واللقاني المالكي وأبي الحسن البكري والشهاب الرملي، وتفقه عليه الشهابان الغنيمي والخفاجي. أفتى مدة حياته، وولي إمامة الأشرفية ومشيختها والتدريس. من تصانيفه شرح على «كنز الدقائق»، و«أوضح رمز على نظم الكنز»، وشرح «الأشباه والنظائر»، و«الفائق في اللفظ الرائق»، و«بغية المرتاد لتصحيح الضاد». توفي سنة 1004 هـ بحسب ما ذكره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  en: "Ali ibn Muhammad ibn Ali ibn Khalil al-Khazraji, Nur al-Din, known as Ibn Ghanim al-Maqdisi by origin and of Cairo, head of the Hanafis of his age. He studied with Ibn al-Najjar al-Hanbali, Ibn al-Shalabi, Nasir al-Din al-Tablawi, al-Laqani the Maliki, Abu al-Hasan al-Bakri and al-Shihab al-Ramli, and al-Shihabani al-Ghunaymi and al-Khafaji studied under him. He issued legal opinions all his life and held the imamate and teaching of the Ashrafiyya. His works include a commentary on Kanz al-daqa'iq, Awdah ramz 'ala nazm al-kanz, a commentary on al-Ashbah wa-al-naza'ir, al-Fa'iq, and Bughyat al-murtad. The book gives 1004 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
