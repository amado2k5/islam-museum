summary:
  ar: "علي بن محمد بن علي بن خليل الخزرجي، نور الدين، المعروف بابن غانم المقدسي الأصل القاهري، رأس الحنفية في عصره. تفقه على ابن النجار الحنبلي وابن الشلبي وناصر الدين الطبلاوي واللقاني المالكي وأبي الحسن البكري والشهاب الرملي، وتفقه عليه الشهابان الغنيمي والخفاجي. أفتى مدة حياته، وولي إمامة الأشرفية ومشيختها والتدريس. من تصانيفه شرح على «كنز الدقائق»، و«أوضح رمز على نظم الكنز»، وشرح «الأشباه والنظائر»، و«الفائق في اللفظ الرائق»، و«بغية المرتاد لتصحيح الضاد». توفي سنة 1004 هـ بحسب ما ذكره الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  en: "Ali ibn Muhammad ibn Ali ibn Khalil al-Khazraji, Nur al-Din, known as Ibn Ghanim al-Maqdisi by origin and of Cairo, head of the Hanafis of his age. He studied with Ibn al-Najjar al-Hanbali, Ibn al-Shalabi, Nasir al-Din al-Tablawi, al-Laqani the Maliki, Abu al-Hasan al-Bakri and al-Shihab al-Ramli, and al-Shihabani al-Ghunaymi and al-Khafaji studied under him. He issued legal opinions all his life and held the imamate and teaching of the Ashrafiyya. His works include a commentary on Kanz al-daqa'iq, Awdah ramz 'ala nazm al-kanz, a commentary on al-Ashbah wa-al-naza'ir, al-Fa'iq, and Bughyat al-murtad. The book gives 1004 AH as his death year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  es: "Ali ibn Muhammad ibn Ali ibn Khalil al-Khazraji, Nur al-Din, conocido como Ibn Ghanim al-Maqdisi por origen y natural de El Cairo, jefe de los Hanafis de su época. Estudió con Ibn al-Najjar al-Hanbali, Ibn al-Shalabi, Nasir al-Din al-Tablawi, al-Laqani el Maliki, Abu al-Hasan al-Bakri y al-Shihab al-Ramli, y al-Shihabani al-Ghunaymi y al-Khafaji estudiaron con él. Emitió opiniones legales toda su vida y mantuvo el imamato y la enseñanza de Ashrafiyya. Sus obras incluyen un comentario sobre Kanz al-daqa'iq, Awdah ramz 'ala nazm al-kanz, un comentario sobre al-Ashbah wa-al-naza'ir, al-Fa'iq y Bughyat al-murtad. El libro indica 1004 AH como año de su muerte. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
  fr: "Ali ibn Muhammad ibn Ali ibn Khalil al-Khazraji, Nur al-Din, connu sous le nom d'Ibn Ghanim al-Maqdisi d'origine et du Caire, chef des Hanafis de son époque. Il a étudié avec Ibn al-Najjar al-Hanbali, Ibn al-Shalabi, Nasir al-Din al-Tablawi, al-Laqani le Maliki, Abu al-Hasan al-Bakri et al-Shihab al-Ramli, et al-Shihabani al-Ghunaymi et al-Khafaji ont étudié sous lui. Il a émis des avis juridiques toute sa vie et a occupé l'imamat et l'enseignement de l'Achrafiyya. Ses œuvres comprennent un commentaire sur Kanz al-daqa'iq, Awdah ramz 'ala nazm al-kanz, un commentaire sur al-Ashbah wa-al-naza'ir, al-Fa'iq et Bughyat al-murtad. Le livre indique l'année 1004 de l'Hégire comme année de son décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15420}"
