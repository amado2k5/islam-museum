summary:
  ar: "عاطف رحمان ميان (وُلد في 28 يونيو 1975) اقتصادي باكستاني أمريكي، أستاذ الاقتصاد والسياسات العامة والتمويل في جامعة برينستون ومدير مركز جوليس-رابينوفيتش للسياسات العامة والتمويل فيها. تربط أبحاثه بين التمويل والاقتصاد الكلي، وجادل كتابه «بيت الدَّين» (2014، مع أمير صوفي) بأن دَين الأسر هو سبب الركود الكبير. عُيّن في سبتمبر 2018 في المجلس الاستشاري الاقتصادي الباكستاني ثم أُقيل خلال أسبوع بعد حملة استهدفت معتقده الأحمدي، فأثار ذلك إدانة عالمية من الاقتصاديين."
  en: "Atif Rehman Mian (born 28 June 1975) is a Pakistani-American economist, professor of economics, public policy and finance at Princeton University and director of its Julis-Rabinowitz Center for Public Policy and Finance. His research links finance and the macroeconomy, and his book House of Debt (2014, with Amir Sufi) argued that household debt caused the Great Recession. Appointed to Pakistan's Economic Advisory Council in September 2018, he was removed within a week after a campaign against his Ahmadi faith, an episode condemned by economists worldwide."
  ur: "عاطف رحمان میاں (پیدائش 28 جون 1975ء) ایک پاکستانی نژاد امریکی ماہر اقتصادیات ہیں، پرنسٹن یونیورسٹی میں اقتصادیات، عوامی پالیسی اور مالیات کے پروفیسر اور اس کے جولس۔رابینووٹز سینٹر برائے عوامی پالیسی و مالیات کے ڈائریکٹر ہیں۔ ان کی تحقیق مالیات اور کلّی معیشت کو جوڑتی ہے، اور ان کی کتاب ”ہاؤس آف ڈیٹ“ (2014ء، عامر صوفی کے ساتھ) کا موقف تھا کہ گھریلو قرضے عظیم کساد بازاری کا سبب بنے۔ ستمبر 2018ء میں وہ پاکستان کی اقتصادی مشاورتی کونسل کے رکن مقرر ہوئے لیکن ان کے احمدی عقیدے کے خلاف مہم کے بعد ایک ہفتے میں ہٹا دیے گئے، جس پر دنیا بھر کے ماہرین اقتصادیات نے مذمت کی۔"
