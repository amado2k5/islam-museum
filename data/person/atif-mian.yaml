summary:
  ar: "عاطف رحمان ميان ⁦(وُلد في 28 يونيو 1975)⁩ اقتصادي باكستاني أمريكي، أستاذ الاقتصاد والسياسات العامة والتمويل في جامعة برينستون ومدير مركز جوليس-رابينوفيتش للسياسات العامة والتمويل فيها. تربط أبحاثه بين التمويل والاقتصاد الكلي، وجادل كتابه «بيت الدَّين» ⁦(2014، مع أمير صوفي)⁩ بأن دَين الأسر هو سبب الركود الكبير. عُيّن في سبتمبر 2018 في المجلس الاستشاري الاقتصادي الباكستاني ثم أُقيل خلال أسبوع بعد حملة استهدفت معتقده الأحمدي، فأثار ذلك إدانة عالمية من الاقتصاديين."
  en: "Atif Rehman Mian (born 28 June 1975) is a Pakistani-American economist, professor of economics, public policy and finance at Princeton University and director of its Julis-Rabinowitz Center for Public Policy and Finance. His research links finance and the macroeconomy, and his book House of Debt (2014, with Amir Sufi) argued that household debt caused the Great Recession. Appointed to Pakistan's Economic Advisory Council in September 2018, he was removed within a week after a campaign against his Ahmadi faith, an episode condemned by economists worldwide."
  ur: "عاطف رحمان میاں ⁦(پیدائش 28 جون 1975ء)⁩ ایک پاکستانی نژاد امریکی ماہر اقتصادیات ہیں، پرنسٹن یونیورسٹی میں اقتصادیات، عوامی پالیسی اور مالیات کے پروفیسر اور اس کے جولس۔رابینووٹز سینٹر برائے عوامی پالیسی و مالیات کے ڈائریکٹر ہیں۔ ان کی تحقیق مالیات اور کلّی معیشت کو جوڑتی ہے، اور ان کی کتاب ”ہاؤس آف ڈیٹ“ ⁦(2014ء، عامر صوفی کے ساتھ)⁩ کا موقف تھا کہ گھریلو قرضے عظیم کساد بازاری کا سبب بنے۔ ستمبر 2018ء میں وہ پاکستان کی اقتصادی مشاورتی کونسل کے رکن مقرر ہوئے لیکن ان کے احمدی عقیدے کے خلاف مہم کے بعد ایک ہفتے میں ہٹا دیے گئے، جس پر دنیا بھر کے ماہرین اقتصادیات نے مذمت کی۔"
  es: "Atif Rehman Mian (nacido el 28 de junio de 1975) es un economista pakistaní-estadounidense, profesor de economía, políticas públicas y finanzas en la Universidad de Princeton y director de su Centro Julis-Rabinowitz de Políticas Públicas y Finanzas. Su investigación vincula las finanzas con la macroeconomía, y en su libro *House of Debt* (2014, escrito junto con Amir Sufi) argumentó que la deuda de los hogares fue la causa de la Gran Recesión. Nombrado miembro del Consejo Asesor Económico de Pakistán en septiembre de 2018, fue destituido una semana después tras una campaña en contra de su fe ahmadí, un episodio condenado por economistas de todo el mundo."
  fr: "Atif Rehman Mian (né le 28 juin 1975) est un économiste pakistano-américain, professeur d'économie, de politiques publiques et de finance à l'Université de Princeton et directeur du Centre Julis-Rabinowitz pour les politiques publiques et la finance de cette université. Ses recherches portent sur les liens entre finance et macroéconomie, et son ouvrage « House of Debt » (2014, coécrit avec Amir Sufi) soutient que l'endettement des ménages a été à l'origine de la Grande Récession. Nommé au Conseil consultatif économique du Pakistan en septembre 2018, il a été démis de ses fonctions une semaine plus tard à la suite d'une campagne de dénigrement contre sa foi ahmadie, un épisode condamné par les économistes du monde entier."
  tr: "Atif Rehman Mian (d. 28 Haziran 1975), Pakistan asıllı Amerikalı bir ekonomist, Princeton Üniversitesi'nde ekonomi, kamu politikası ve finans profesörü ve oradaki Jules-Rabinovitch Kamu Politikası ve Finans Merkezi'nin direktörüdür. Araştırmaları finans ve makroekonomiyi birbirine bağlayır ve \"Baituddin\" (2014, Amir Sufi ile birlikte) adlı kitabı, hanehalkı borcunun Büyük Resesyon'un nedeni olduğunu savunur. Eylül 2018'de Pakistan Ekonomik Danışma Konseyi'ne atandı ve Ahmedi inançlarını hedef alan bir kampanyanın ardından bir hafta içinde görevden alındı; bu kampanya ekonomistler tarafından küresel kınamaya yol açtı."
  id: "Atif Rehman Mian (lahir 28 Juni 1975) adalah seorang ekonom Pakistan-Amerika, profesor ekonomi, kebijakan publik, dan keuangan di Universitas Princeton serta direktur Jules-Rabinovitch Center for Public Policy and Finance di sana. Penelitiannya menghubungkan keuangan dan makroekonomi, dan bukunya \"Baituddin\" (2014, bersama Amir Sufi) berpendapat bahwa utang rumah tangga adalah penyebab Resesi Besar. Ia diangkat pada September 2018 ke Dewan Penasihat Ekonomi Pakistan dan diberhentikan dalam waktu seminggu setelah kampanye menargetkan keyakinan Ahmadi-nya, yang memicu kecaman global dari para ekonom."
