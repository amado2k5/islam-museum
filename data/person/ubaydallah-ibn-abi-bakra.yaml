summary:
  ar: "عبيد الله بن أبي بكرة؛ ولاه زياد بن أبي سفيان سجستان بعد عزل الربيع بن زياد فغزا فلما كان بزران بعث إليه رتبيل يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فوهب له مائتي ألف فتم الصلح على ألف ألف درهم وأمضاه زياد فأقام بها إلى أن مات زياد."
  en: "Ubaydallah ibn Abi Bakra; Ziyad's governor of Sijistan after al-Rabi's dismissal — at Barzan he granted Rutbil peace for his land and Kabul's at a million two hundred thousand, waived two hundred thousand, and concluded at a million dirhams which Ziyad ratified; he held the post until Ziyad's death."
