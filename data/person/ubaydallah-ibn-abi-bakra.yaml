summary:
  ar: "عبيد الله بن أبي بكرة؛ ولاه زياد بن أبي سفيان سجستان بعد عزل الربيع بن زياد فغزا فلما كان بزران بعث إليه رتبيل يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فوهب له مائتي ألف فتم الصلح على ألف ألف درهم وأمضاه زياد فأقام بها إلى أن مات زياد."
  en: "Ubaydallah ibn Abi Bakra; Ziyad's governor of Sijistan after al-Rabi's dismissal — at Barzan he granted Rutbil peace for his land and Kabul's at a million two hundred thousand, waived two hundred thousand, and concluded at a million dirhams which Ziyad ratified; he held the post until Ziyad's death."
  es: "Ubaydallah ibn Abi Bakra, gobernador de Sijistan por Ziyad tras la destitución de al-Rabi, otorgó a Rutbil la paz por su territorio y el de Kabul por un millón doscientos mil, renunció a doscientos mil y concluyó el acuerdo por un millón de dirhams, que Ziyad ratificó; ocupó el cargo hasta la muerte de Ziyad."
  fr: "Ubaydallah ibn Abi Bakra; gouverneur de Ziyad au Sijistan après le renvoi d'al-Rabi — à Barzan, il accorda la paix à Rutbil pour ses terres et celles de Kaboul à un million deux cent mille dirhams, renonça à deux cent mille dirhams et conclut à un million de dirhams, ce que Ziyad ratifia; il occupa le poste jusqu'à la mort de Ziyad."
