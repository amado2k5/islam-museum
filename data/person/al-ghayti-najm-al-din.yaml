summary:
  ar: "نجم الدين الغيطي السكندري ثم المصري، الإمام العلامة المحدث المسند شيخ الإسلام؛ ولد في أثناء العشر الأول من القرن العاشر، وقرأ على القاضي زكريا البخاري ومسلم كاملين ولبس منه خرقة التصوف وسمع على عبد الحق السنباطي سنن ابن ماجه والموطأ وقرأ على الكمال الطويل، وأفتى ودرّس في حياة مشايخه وانتهت إليه الرياسة في علم الحديث والتفسير والتصوف، ولم يزل آمراً بالمعروف ناهياً عن المنكر يواجه الأمراء والأكابر لا يخاف في الله لومة لائم، وتولى مشيخة الصلاحية بجوار الإمام الشافعي ومشيخة الخانقاه السرياقوسية من غير سؤال منه؛ ووصفه القاضي محب الدين الحنفي: «حافظ عصره ومحدث مصره ووحيد دهره... إذا تكلم في الحديث بلفظه الجاري أقرّ كل مسلم بأنه البخاري»؛ ومن مؤلفاته المعراج المتداول يقرؤه علماء الأزهر كل سنة في رجب {cite:shadharat-dhahab p. 406-407}."
  en: "Najm al-Din al-Ghayti — Alexandria-born musnid of Egypt, 'the Bukhari of his age' per qadi Muhibb al-Din; holder of the Salahiyya mashyakha and Siryaqusiyya khanqah unsought, an unafraid enjoiner of right before amirs; his Mi'raj book read at the Azhar every Rajab {cite:shadharat-dhahab p. 406-407}."
