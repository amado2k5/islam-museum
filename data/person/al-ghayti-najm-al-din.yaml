summary:
  ar: "نجم الدين الغيطي السكندري ثم المصري، الإمام العلامة المحدث المسند شيخ الإسلام؛ ولد في أثناء العشر الأول من القرن العاشر، وقرأ على القاضي زكريا البخاري ومسلم كاملين ولبس منه خرقة التصوف وسمع على عبد الحق السنباطي سنن ابن ماجه والموطأ وقرأ على الكمال الطويل، وأفتى ودرّس في حياة مشايخه وانتهت إليه الرياسة في علم الحديث والتفسير والتصوف، ولم يزل آمراً بالمعروف ناهياً عن المنكر يواجه الأمراء والأكابر لا يخاف في الله لومة لائم، وتولى مشيخة الصلاحية بجوار الإمام الشافعي ومشيخة الخانقاه السرياقوسية من غير سؤال منه؛ ووصفه القاضي محب الدين الحنفي: في وصف مختصر هنا: «حافظ عصره ومحدث مصره ووحيد دهره»، وقال: «إذا تكلم في الحديث بلفظه الجاري أقرّ كل مسلم بأنه البخاري»؛ ومن مؤلفاته المعراج المتداول يقرؤه علماء الأزهر كل سنة في رجب {cite:shadharat-dhahab p. 406-407}."
  en: "Najm al-Din al-Ghayti — Alexandria-born musnid of Egypt, 'the Bukhari of his age' per qadi Muhibb al-Din; holder of the Salahiyya mashyakha and Siryaqusiyya khanqah unsought, an unafraid enjoiner of right before amirs; his Mi'raj book read at the Azhar every Rajab {cite:shadharat-dhahab p. 406-407}."
  fr: "Najm al-Din al-Ghayti — musnid d’Égypte né à Alexandrie, « al-Bukhari de son temps » selon le cadi Muhibb al-Din ; titulaire, sans les avoir sollicitées, des directions de la Salahiyya et de la khanqah Siryaqusiyya, il exhortait au bien sans crainte devant les émirs ; son livre du Mi’raj était lu à al-Azhar chaque rajab {cite:shadharat-dhahab p. 406-407}."
  es: "Najm al-Din al-Ghayti: musnid de Egipto nacido en Alejandría, 'el Bukhari de su época' según el cadí Muhibb al-Din; poseedor del Salahiyya mashyakha y Siryaqusiyya khanqah no buscado, un valiente defensor del derecho ante los emires; su libro Mi'raj se lee en el Azhar cada Rajab {cita: shadharat-dhahab p. 406-407}."
  ur: "نجم الدین الغیطی - مصر کے اسکندریہ میں پیدا ہونے والے مسنید، 'اپنے زمانے کے بخاری' فی قاضی محب الدین؛ صلاحیہ مشائخ اور سریا قوسیہ خانقاہ کا حامل، امیروں کے سامنے حق کا بے خوف حکم دینے والا؛ ان کی معراج کتاب ازہر ہر رجب میں پڑھی گئی 406-407}۔"
  tr: "Necmeddin el-Gayti el-İskenderi, sonra da seçkin alim, hadis üstadı ve İslam şeyhi el-Misri; Onuncu yüzyılın ilk on yılında doğdu ve Kadı Zekeriya el-Buhari ve Müslim'den bütünüyle ilim öğrendi ve ondan tasavvufu aldı; Abdül-Haqk el-Sunbati, Sünan İbn Majah ve el-Muvatta'dan ders aldı; el-Kamal el-Tawil'den ilim öğrendi; şeyhlerinin ömrü boyunca fetvalar verdi ve dersler verdi; hadis, tefsir ve tasavvuf ilmindeki liderliği onunla son buldu; her zaman iyiliği emredip kötülüğü yasakladı, prensler ve ileri gelenlerle yüzleşti, Allah yolunda hiçbir eleştirmenin kınamasından korkmadı; İmam Şafiî'nin yanında el-Salahiyye şeyhliğini ve Hankaha el-Siriykusiyye şeyhliğini, kendisinden istenmeden üstlendi. Hakim Muhib el-Din el-Hanafi onu burada kısaca şöyle tanımlamıştır: “Zamanının ezbercisi, ülkesinin hadis üstadı ve çağının eşsiz âlimi” ve şöyle demiştir: “Hadis hakkında günümüzdeki üslubuyla konuştuğunda, her Müslüman onun Buhari olduğunu kabul eder”; eserleri arasında, her yıl Receb ayında El-Ezher âlimleri tarafından okunan, yaygın olarak bilinen El-Mi'rac da bulunmaktadır. {kaynak: Şadharat-Dhaba s. 406-407}"
  id: "Najm al-Din al-Ghaiti al-Iskandari, kemudian al-Misri, ulama terkemuka, ahli hadis, dan syekh Islam; Beliau lahir pada dekade pertama abad kesepuluh, dan beliau belajar dengan Hakim Zakariya al-Bukhari dan Muslim secara menyeluruh dan menerima jubah Sufi dari mereka, dan beliau mendengar dari Abd al-Haqq al-Sunbati Sunan Ibn Majah dan al-Muwatta, dan beliau belajar dengan al-Kamal al-Tawil, dan beliau mengeluarkan fatwa dan mengajar selama masa hidup para syekhnya, dan kepemimpinan dalam ilmu hadits, tafsir, dan Sufisme berakhir padanya, dan beliau selalu menyeru kepada kebaikan dan melarang kejahatan, menghadapi para pangeran dan pejabat tinggi, tidak takut akan celaan kritikus mana pun dalam membela agama Allah, dan beliau mengambil alih kepemimpinan al-Salahiyya di samping Imam al-Shafi’i dan kepemimpinan Khanqah al-Siriyaqusiyya tanpa diminta; Dan Hakim Muhibb al-Din al-Hanafi menggambarkannya secara singkat di sini: “Penghafal hadits di zamannya, ahli hadits di negaranya, dan satu-satunya di eranya,” dan beliau berkata: “Ketika beliau berbicara tentang hadits dengan redaksi yang digunakannya saat ini, setiap Muslim mengakui bahwa beliau adalah al-Bukhari”; dan di antara karya-karyanya adalah kitab al-Mi’raj yang banyak beredar, yang dibaca oleh para ulama al-Azhar setiap tahun di bulan Rajab {kutip:shadharat-dhahab hlm. 406-407}."
