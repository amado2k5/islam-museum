label: { ar: "أبو عمران الفاسي", en: "Abu Imran al-Fasi", fr: "Abu Imran al-Fasi", es: "Abu Imran al-Fasi", ur: "ابو عمران الفاسی" }
summary:
  ar: "شيخ المذهب المالكي بالقيروان في القرن الخامس؛ لقيه وفد كدالة راجعاً من الحج فسألوه أن يصحبهم من تلميذه فندبهم وكتب لهم إلى وجاج بن زلو اللمطي بسجلماسة وعهد إليه أن يلتمس لهم من يثق بدينه وفقهه {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  en: "Abu Imran al-Fasi, the Maliki master of Kairouan; the Guddala pilgrims asked him for a companion-scholar and he wrote to Wajjaj b. Zallu at Sijilmasa {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  fr: "Abu Imran al-Fasi, le maître malikite de Kairouan ; les pèlerins guddala lui demandèrent un savant pour les accompagner, et il écrivit à Wajjaj b. Zallu à Sijilmassa {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  es: "Abu Imran al-Fasi, el maestro Maliki de Kairuán; Los peregrinos de Guddala le pidieron un compañero erudito y le escribió a Wajjaj b. Zallu en Sijilmasa {citar: Tarikh-ibn-Khaldun-ibar p. 1645}."
  ur: "ابو عمران الفاسی، کیروان کے مالکی ماسٹر؛ گڈالہ کے زائرین نے اس سے ایک ساتھی عالم طلب کیا اور اس نے وجاج بن کو لکھا۔ زَلّو عَلَی صَجِلَمَسَا {حوالہ: تاریخ ابن خلدون ابر ص۔ 1645}۔"
  tr: "Beşinci yüzyılda Kayrevan'da Maliki mezhebine mensup bir şeyh; Hac'dan dönen Kadala kabilesinden bir heyet onunla karşılaştı ve öğrencilerinden birini onlarla birlikte göndermesini istedi. Bunun üzerine şeyh onları görevlendirdi ve Sijilmasa'daki Vajaj bin Zalu el-Lamti'ye yazarak, dinine ve fıkıhına güvendiği birini bulması için ona emanet etti. {Kaynak:tarikh-ibn-khaldun-ibar s. 1645}"
  id: "Syekh dari mazhab Maliki di Kairouan pada abad kelima; sebuah delegasi dari suku Kadala menemuinya saat kembali dari ibadah haji dan memintanya untuk mengirim salah satu muridnya bersama mereka, maka beliau menunjuk mereka dan menulis surat kepada Wajaj bin Zalu al-Lamti di Sijilmasa dan mempercayakan kepadanya untuk mencari seseorang yang agama dan fiqihnya dipercaya olehnya {cite:tarikh-ibn-khaldun-ibar p. 1645}."
