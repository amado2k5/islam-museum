summary:
  ar: "سياسية بنغلاديشية وُلدت في 28 سبتمبر 1947 في تونجيبارا، ابنة الشيخ مجيب الرحمن مؤسس بنغلاديش. نجت من اغتيال أسرتها سنة 1975 وهي في أوروبا، وعاشت في المنفى في الهند، وعادت سنة 1981 لتترأس رابطة عوامي، فترأست الوزراء من 1996 إلى 2001 ومن 2009 حتى استقالتها في 5 أغسطس 2024 إثر انتفاضة يوليو، فغادرت إلى الهند، وأُدينت غيابيًا في نوفمبر 2025. وهي أطول رئيسات الحكومات خدمةً في العالم."
  en: "Bangladeshi politician, born on 28 September 1947 at Tungipara, a daughter of Sheikh Mujibur Rahman, the founder of Bangladesh. She survived the 1975 murder of her family while in Europe, lived in exile in India, returned in 1981 and has led the Awami League since, serving as prime minister from 1996 to 2001 and from 2009 until her resignation on 5 August 2024 in the July uprising, when she left for India; in November 2025 she was convicted in absentia. She is the world's longest-serving female head of government."
  ur: "بنگلہ دیشی سیاست دان، جو 28 ستمبر 1947ء کو تونگیپاڑہ میں پیدا ہوئیں، بنگلہ دیش کے بانی شیخ مجیب الرحمان کی بیٹی ہیں۔ 1975ء میں خاندان کے قتل سے یورپ میں ہونے کی وجہ سے بچ گئیں، ہندوستان میں جلا وطنی گزاری، 1981ء میں واپس آئیں اور عوامی لیگ کی سربراہی سنبھالی؛ 1996ء سے 2001ء اور 2009ء سے 5 اگست 2024ء کو جولائی بغاوت میں استعفے تک وزیر اعظم رہیں، پھر ہندوستان چلی گئیں اور نومبر 2025ء میں غیر حاضری میں سزا پائی۔ وہ دنیا کی سب سے طویل عرصہ خدمات انجام دینے والی خاتون سربراہ حکومت ہیں۔"
