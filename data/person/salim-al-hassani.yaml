  ar: "مهندس عراقي بريطاني وُلد سنة 1940 في بغداد، أستاذ سابق للهندسة الميكانيكية في معهد مانشستر للعلوم والتكنولوجيا. مؤسس ورئيس مؤسسة العلوم والتقنية والحضارة، ومحرّر كتاب «1001 اختراع: التراث الإسلامي في عالمنا» الذي عرّف جمهورًا واسعًا بالحضارة العلمية الإسلامية."
  en: "Iraqi-British engineer, born in 1940 in Baghdad, former professor of mechanical engineering at UMIST. Founder and chairman of the Foundation for Science, Technology and Civilisation, and editor of 1001 Inventions: Muslim Heritage in Our World, which brought Islamic scientific civilisation to a wide public."
  ur: "عراقی نژاد برطانوی انجینئر، 1940ء میں بغداد میں پیدا ہوئے، یو ایم آئی ایس ٹی ⁦(UMIST)⁩ میں مکینیکل انجینئری کے سابق پروفیسر۔ فاؤنڈیشن فار سائنس، ٹیکنالوجی اینڈ سولائزیشن کے بانی اور چیئرمین، اور کتاب «1001 Inventions: Muslim Heritage in Our World» کے مدیر جس نے اسلامی علمی تہذیب کو وسیع قارئین تک پہنچایا۔"
