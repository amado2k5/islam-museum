summary:
  ar: "سياسي ورجل أعمال نيجيري وُلد في جادا سنة 1946. عمل في مصلحة الجمارك عشرين عاما، ثم صار نائب رئيس نيجيريا في عهد أوباسانجو (1999–2007)، وخاض سباق الرئاسة ست مرات دون أن يفوز، وانضم سنة 2025 إلى المؤتمر الديمقراطي الأفريقي."
  en: "Nigerian politician and businessman born in Jada in 1946. He worked in the Nigeria Customs Service for twenty years, then served as vice president under Olusegun Obasanjo (1999–2007), ran for the presidency six times without winning it, and joined the African Democratic Congress in 2025."
  ur: "نائجریائی سیاست دان اور تاجر، 1946 میں جادا میں پیدا ہوئے۔ انھوں نے نائجریا کسٹمز سروس میں بیس برس گزارے، پھر اوباسانجو کے نائب صدر رہے (1999ء–2007ء)، چھ بار صدارت کے امیدوار بنے مگر کامیاب نہ ہوئے، اور 2025 میں افریقی جمہوری کانگریس میں شامل ہوئے۔"
