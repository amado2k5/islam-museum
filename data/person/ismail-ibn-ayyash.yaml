label: { ar: "إسماعيل بن عياش", en: "Isma'il ibn Ayyash", es: "Isma'il ibn Ayyash", fr: "Isma'il ibn Ayyash", ur: "اسماعیل بن عیاش" }
summary:
  ar: "إسماعيل بن عياش العنسي الحمصي، محدث الشام في القرن الثاني؛ عند البلاذري: كتب إليه عبد الملك بن صالح يستفتيه في أمر أهل قبرس فأجاب أنهم «أذلاء مقهورون يغلبهم الروم على أنفسهم ونسائهم فقد يحق علينا أن نمنعهم ونحميهم» وأن يُقَرّوا على عهدهم وذمتهم، مستشهداً بكتاب حبيب بن مسلمة لأهل تقليس في عهده — أن يقع للمسلمين شغل عنهم فيقهرهم عدوهم فذلك غير ناقض عهدهم — وبأن الوليد بن يزيد أجلاهم إلى الشام فاستقبحه المسلمون واستعظمه الفقهاء فردّهم يزيد بن الوليد واستحسن المسلمون ذلك ورأوه عدلاً."
  en: "Isma'il ibn Ayyash al-Ansi of Hims, the hadith-master of second-century Syria; in al-Baladhuri: Abd al-Malik ibn Salih wrote consulting him on the people of Cyprus, and he answered that they are 'a humbled, conquered folk whom the Byzantines master over their own lives and women — so it is our duty to defend and protect them' and to keep them on their covenant and dhimma, citing Habib ibn Maslama's own treaty-letter to Taqlis — that an enemy overpowering them while the Muslims are occupied does not break their treaty — and recalling that al-Walid ibn Yazid's exile of them to Syria was denounced by the Muslims and abhorred by the jurists, while Yazid ibn al-Walid's returning them was approved as justice."
  es: "Isma'il ibn Ayyash al-Ansi de Hims, el maestro de hadices de la Siria del siglo II; en al-Baladhuri: Abd al-Malik ibn Salih le escribió consultándole sobre el pueblo de Chipre, y él respondió que son 'un pueblo humillado y conquistado al que los bizantinos dominan sobre sus propias vidas y mujeres, por lo que es nuestro deber defenderlos y protegerlos' y mantenerlos en su pacto y dhimma, citando la propia carta de tratado de Habib ibn Maslama a Taqlis, que dice que un enemigo que los domina mientras los musulmanes están ocupados no rompe su tratado, y recordando que el exilio de ellos a Siria por parte de al-Walid ibn Yazid fue denunciado por los musulmanes y aborrecido por los juristas, mientras que el regreso de Yazid ibn al-Walid fue aprobado como justicia."
  fr: "Isma'il ibn Ayyash al-Ansi de Hims, maître du hadith en Syrie au IIe siècle, rapporte dans al-Baladhuri: Abd al-Malik ibn Salih lui écrivit pour le consulter au sujet du peuple chypriote, et il répondit qu'il s'agissait d'un peuple humilié et conquis, soumis à l'oppression byzantine et à la domination sur leurs vies et leurs femmes. Il est donc de notre devoir de les défendre et de les protéger, de les maintenir dans leur engagement et leur dhimma, citant la lettre de traité d'Habib ibn Maslama à Taqlis – selon laquelle la victoire d'un ennemi sur eux pendant l'occupation des territoires musulmans ne constitue pas une violation de leur traité – et rappelant que l'exil de ces derniers en Syrie par al-Walid ibn Yazid avait été dénoncé par les musulmans et condamné par les juristes, tandis que leur retour par Yazid ibn al-Walid avait été approuvé comme justice."
  ur: "اسماعیل بن عیاش الانسی حمص، دوسری صدی کے شام کے ماہر حدیث؛ البلادوری میں ہے: عبد الملک بن صالح نے قبرص کے لوگوں کے بارے میں ان سے مشورہ کرتے ہوئے لکھا، اور اس نے جواب دیا کہ وہ ایک عاجز، فتح یافتہ قوم ہیں جنہیں بازنطینی اپنی جانوں اور عورتوں پر حاکم بناتے ہیں، لہذا ہمارا فرض ہے کہ ان کی حفاظت اور حفاظت کریں اور ان کے ساتھ اپنے عہد پر قائم رہیں اور ذمبلی کے ساتھ حسن سلوک کریں۔ تقلید - کہ جب کوئی دشمن مسلمانوں پر قابض ہے تو ان پر غالب آجائے وہ ان کے معاہدے کو نہیں توڑتا - اور یاد کرتے ہوئے کہ الولید بن یزید کی شام میں ان کی جلاوطنی کو مسلمانوں نے مذمت اور فقہاء کی طرف سے ناپسندیدہ قرار دیا تھا، جبکہ یزید بن الولید کا ان کی واپسی کو انصاف کے طور پر منظور کیا گیا تھا۔"
  tr: "İkinci yüzyılda el-Şam'ın hadis âlimi İsmail bin Eyyaş el-Ansi el-Himsi; el-Baladhuri'ye göre: Abdülmelik ibn Salih ona Kıbrıs halkı üzerinde bir hüküm talebinde bulundu; o da \"aşağılanmış, ezilmiş, Romalılar tarafından kendileri ve kadınları üzerinde egemenlik altına alındıklarını, böylece onları engelleme ve koruma hakkımız olduğunu\" ve Habib bin Maslama'nın Taqlis halkına yazdığı mektubunu alıntılayarak ahit ve vicdanlarını kabul etmeleri gerektiğini belirtti; Müslümanların dikkatlerini dağıtıp düşmanları tarafından ezilmesi gerektiğini, bunun antlaşmalarını bozmayacağını belirtti. Ayrıca el-Velid bin Yezid'in onları Suriye'ye sürdüğünü, ancak Müslümanların onu sevmediğini, hukukçuların ise onu sevmediğini, ancak Yezid bin Velid'in onu reddettiğini, Müslümanların bunu kabul edip onu adil gördüğünü söyledi."
  id: "Ismail ibn Ayyash al-Ansi al-Himsi, seorang ulama hadis al-Sham pada abad kedua; menurut al-Baladhuri: Abd al-Malik ibn Salih menulis kepadanya meminta keputusan atas rakyat Siprus, dan ia menjawab bahwa mereka \"dipermalukan, tertindas, didominasi oleh orang Romawi atas diri mereka sendiri dan wanita mereka, sehingga kami berhak mencegah dan melindungi mereka,\" dan bahwa mereka harus mengakui perjanjian dan hati nurani mereka, mengutip surat Habib ibn Maslama kepada rakyat Taqlis selama pemerintahannya—bahwa Muslim harus teralihkan oleh gangguan mereka dan dikalahkan oleh musuh mereka, karena hal itu tidak akan melanggar perjanjian mereka. Ia juga mengatakan bahwa al-Walid ibn Yazid mengusir mereka ke Suriah, tetapi Muslim tidak menyukainya dan para ahli hukum tidak menyukainya, tetapi Yazid ibn al-Walid menolaknya, dan umat Muslim menerima hal itu serta melihatnya sebagai adil."
