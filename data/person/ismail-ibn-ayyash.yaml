id: person/ismail-ibn-ayyash
class: person
label: { ar: "إسماعيل بن عياش", en: "Isma'il ibn Ayyash" }
summary:
  ar: "إسماعيل بن عياش العنسي الحمصي، محدث الشام في القرن الثاني؛ عند البلاذري: كتب إليه عبد الملك بن صالح يستفتيه في أمر أهل قبرس فأجاب أنهم «أذلاء مقهورون يغلبهم الروم على أنفسهم ونسائهم فقد يحق علينا أن نمنعهم ونحميهم» وأن يُقَرّوا على عهدهم وذمتهم، مستشهداً بكتاب حبيب بن مسلمة لأهل تقليس في عهده — أن يقع للمسلمين شغل عنهم فيقهرهم عدوهم فذلك غير ناقض عهدهم — وبأن الوليد بن يزيد أجلاهم إلى الشام فاستقبحه المسلمون واستعظمه الفقهاء فردّهم يزيد بن الوليد واستحسن المسلمون ذلك ورأوه عدلاً."
  en: "Isma'il ibn Ayyash al-Ansi of Hims, the hadith-master of second-century Syria; in al-Baladhuri: Abd al-Malik ibn Salih wrote consulting him on the people of Cyprus, and he answered that they are 'a humbled, conquered folk whom the Byzantines master over their own lives and women — so it is our duty to defend and protect them' and to keep them on their covenant and dhimma, citing Habib ibn Maslama's own treaty-letter to Taqlis — that an enemy overpowering them while the Muslims are occupied does not break their treaty — and recalling that al-Walid ibn Yazid's exile of them to Syria was denounced by the Muslims and abhorred by the jurists, while Yazid ibn al-Walid's returning them was approved as justice."
