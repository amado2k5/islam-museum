summary:
  ar: "عالمة آثار وكاتبة تركية (1914–2024) متخصصة في الحضارتين السومرية والحيثية، ومن أطول النساء عمرًا في تركيا؛ عاشت 110 سنوات. وُلدت في بورصة لأبوين من تتار القرم، ودرست الحيثيات في جامعة أنقرة على أيدي علماء ألمان لاجئين، ثم عملت عقودًا في متحف الشرق القديم بإسطنبول حيث فهرست آلاف الألواح المسمارية. اشتهرت بكتبها التي تردّ قصص القرآن والتوراة والإنجيل إلى أصول سومرية، وبمواقفها العلمانية، وحُوكمت سنة 2006 بتهمة إثارة الكراهية الدينية فبرّأتها المحكمة. توفيت في مرسين عن 110 سنوات."
  en: "Turkish archaeologist and writer (1914–2024) specialising in Sumerian and Hittite civilisation, who lived to 110. Born at Bursa to Crimean Tatar parents, she studied Hittitology at Ankara University under refugee German scholars, then spent decades at Istanbul's Museum of the Ancient Orient cataloguing thousands of cuneiform tablets. She became famous for books tracing narratives of the Quran, the Torah and the Gospel to Sumerian antecedents, and for her secularist advocacy; tried in 2006 for inciting religious hatred over her headscarf thesis, she was acquitted. She died at Mersin aged 110."
  ur: "ترک ماہرِ آثارِ قدیمہ و مصنفہ (1914–2024)، سومیری اور حتی تہذیب کی ماہر، جو 110 برس کی عمر تک زندہ رہیں۔ بورصہ میں قریم تاتار والدین کے ہاں پیدا ہوئیں؛ انقرہ یونیورسٹی میں پناہ گزین جرمن اساتذہ سے حتیات پڑھی، پھر استنبول کے قدیم مشرق عجائب گھر میں دہائیوں تک ہزاروں میخی تختیوں کی فہرست سازی کی۔ وہ اپنی کتابوں کے لیے مشہور ہوئیں جن میں قرآن، تورات اور انجیل کی داستانوں کی جڑیں سومیری روایات میں تلاش کی گئیں، اور اپنی سیکولر وکالت کے لیے بھی؛ 2006ء میں مذہبی منافرت کے الزام میں مقدمہ چلا اور وہ بری ہو گئیں۔ مرسین میں 110 برس کی عمر میں وفات پائی۔"
  es: "Arqueóloga y escritora turca (1914-2024), especializada en las civilizaciones sumeria e hitita, que vivió hasta los 110 años. Nacida en Bursa de padres tártaros de Crimea, estudió hititología en la Universidad de Ankara con eruditos alemanes refugiados y posteriormente pasó décadas en el Museo del Antiguo Oriente de Estambul catalogando miles de tablillas cuneiformes. Se hizo famosa por sus libros que rastreaban los orígenes sumerios de las narrativas del Corán, la Torá y el Evangelio, y por su defensa del laicismo. En 2006, fue juzgada por incitar al odio religioso a raíz de su tesis sobre el velo islámico, pero fue absuelta. Falleció en Mersin a los 110 años."
  fr: "Archéologue et écrivaine turque (1914-2024), spécialiste des civilisations sumérienne et hittite, décédée à l'âge de 110 ans. Née à Bursa de parents tatars de Crimée, elle étudia l'hittitologie à l'université d'Ankara auprès de chercheurs allemands réfugiés, puis passa plusieurs décennies au Musée de l'Orient ancien d'Istanbul à cataloguer des milliers de tablettes cunéiformes. Elle devint célèbre pour ses ouvrages retraçant les origines sumériennes des récits du Coran, de la Torah et des Évangiles, ainsi que pour son engagement en faveur de la laïcité. Poursuivie en 2006 pour incitation à la haine religieuse en raison de sa thèse sur le port du voile, elle fut acquittée. Elle mourut à Mersin à l'âge de 110 ans."
  tr: "Sümer ve Hitit uygarlıkları üzerine uzmanlaşmış Türk arkeolog ve yazar (1914–2024) ve Türkiye'nin en uzun yaşayan kadınlarından biridir; 110 yıl yaşadı. Bursa'da Kırım Tatar ebeveynlerin çocuğu olarak doğdu, Ankara Üniversitesi'nde Alman mülteci akademisyenlerin yanında Hitit eğitimi aldı, ardından İstanbul'daki Antik Doğu Müzesi'nde binlerce çivi yazısı tabletini kataloglayarak onlarca yıl çalıştı. Kuran, Tora ve İncil'den Sümer kökenlerine kadar hikayeleri izleyen kitapları ve seküler duruşlarıyla ün kazandı. 2006'da dini nefreti kışkırtmakla suçlanarak yargılandı, ancak mahkeme tarafından beraat etti. 110 yaşında Mersin'de hayatını kaybetti."
  id: "Seorang arkeolog dan penulis Turki (1914–2024), yang mengkhususkan diri dalam peradaban Sumeria dan Hittite, serta salah satu wanita dengan umur terpanjang di Turki; ia hidup selama 110 tahun. Ia lahir di Bursa dari orang tua Tatar Krimea, belajar Hittite di Universitas Ankara di bawah bimbingan para sarjana pengungsi Jerman, lalu bekerja selama puluhan tahun di Museum Timur Kuno di Istanbul, mengkatalogkan ribuan tablet kuneiform. Ia menjadi terkenal karena buku-bukunya yang menelusuri kisah dari Al-Quran, Taurat, dan Alkitab hingga asal-usul Sumeria, serta karena sikap sekulernya. Ia diadili pada tahun 2006 atas tuduhan menghasut kebencian agama, namun dibebaskan oleh pengadilan. Ia meninggal di Mersin pada usia 110 tahun."
