summary:
  ar: "عالمة آثار وكاتبة تركية (1914–2024) متخصصة في الحضارتين السومرية والحيثية، ومن أطول النساء عمرًا في تركيا؛ عاشت 110 سنوات. وُلدت في بورصة لأبوين من تتار القرم، ودرست الحيثيات في جامعة أنقرة على أيدي علماء ألمان لاجئين، ثم عملت عقودًا في متحف الشرق القديم بإسطنبول حيث فهرست آلاف الألواح المسمارية. اشتهرت بكتبها التي تردّ قصص القرآن والتوراة والإنجيل إلى أصول سومرية، وبمواقفها العلمانية، وحُوكمت سنة 2006 بتهمة إثارة الكراهية الدينية فبرّأتها المحكمة. توفيت في مرسين عن 110 سنوات."
  en: "Turkish archaeologist and writer (1914–2024) specialising in Sumerian and Hittite civilisation, who lived to 110. Born at Bursa to Crimean Tatar parents, she studied Hittitology at Ankara University under refugee German scholars, then spent decades at Istanbul's Museum of the Ancient Orient cataloguing thousands of cuneiform tablets. She became famous for books tracing narratives of the Quran, the Torah and the Gospel to Sumerian antecedents, and for her secularist advocacy; tried in 2006 for inciting religious hatred over her headscarf thesis, she was acquitted. She died at Mersin aged 110."
  ur: "ترک ماہرِ آثارِ قدیمہ و مصنفہ (1914–2024)، سومیری اور حتی تہذیب کی ماہر، جو 110 برس کی عمر تک زندہ رہیں۔ بورصہ میں قریم تاتار والدین کے ہاں پیدا ہوئیں؛ انقرہ یونیورسٹی میں پناہ گزین جرمن اساتذہ سے حتیات پڑھی، پھر استنبول کے قدیم مشرق عجائب گھر میں دہائیوں تک ہزاروں میخی تختیوں کی فہرست سازی کی۔ وہ اپنی کتابوں کے لیے مشہور ہوئیں جن میں قرآن، تورات اور انجیل کی داستانوں کی جڑیں سومیری روایات میں تلاش کی گئیں، اور اپنی سیکولر وکالت کے لیے بھی؛ 2006ء میں مذہبی منافرت کے الزام میں مقدمہ چلا اور وہ بری ہو گئیں۔ مرسین میں 110 برس کی عمر میں وفات پائی۔"
