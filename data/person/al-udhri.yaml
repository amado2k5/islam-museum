label: { ar: "أبو العباس العذري أحمد بن عمر", en: "Abu al-Abbas al-Udhri Ahmad ibn Umar", fr: "Abu al-Abbas al-Udhri Ahmad ibn Umar", es: "Abu al-Abbas al-Udhri Ahmad ibn Umar", ur: "ابو العباس الذری احمد بن عمر" }
summary:
  ar: "أبو العباس العذري أحمد بن عمر بن أنس بن دلاث الأندلسي الدلائي — ودلايه من عمل المرية — كان حافظاً محدثاً متقناً؛ حج سنة ثمان وأربعمائة مع أبويه مجاوراً ثمانية أعوام ومحب هو أباذر فتخرج به وروى عن أبي الحسن بن جهضم وطائفة؛ مات في شعبان سنة ثمان وسبعين وأربعمائة وله نحو ثمانين سنة {cite:shadharat-dhahab p. 365-366}."
  en: "Abu al-Abbas al-Udhri Ahmad b. Umar b. Anas al-Dala'i of the Almeria district — the exacting hafiz-muhaddith; made hajj in 408 with both parents and stayed eight years as a mujawir where Abu Dharr al-Harawi studied under him; died Sha'ban 478 nearing eighty {cite:shadharat-dhahab p. 365-366}."
  fr: "Abu al-Abbas al-Udhri Ahmad b. Umar b. Anas al-Dala'i du district d'Almeria - le hafiz-muhaddith exigeant ; fait hajj en 408 avec les deux parents et est resté huit ans comme mujawir où Abou Dharr al-Harawi a étudié sous lui ; est mort chaabane 478 près de quatre-vingts {cite:shadharat-dhahab p. 365-366}."
  es: "Abu al-Abbas al-Udhri Ahmad b. Umar b. Anas al-Dala'i del distrito de Almería, el exigente hafiz-muhaddith, realizó el Hajj en 408 con ambos padres y permaneció ocho años como mujawir, donde Abu Dharr al-Harawi estudió con él; Sha'ban murió en 478 cerca de los ochenta años {cita: shadharat-dhahab págs. 365-366}."
  ur: "ابو العباس الذری احمد ب۔ عمر بی۔ المیریا ضلع کے انس الدالعی - مستحب حافظ محدث؛ 408 میں دونوں والدین کے ساتھ حج کیا اور آٹھ سال ایک مجاور کی حیثیت سے رہے جہاں ابوذر الحروی نے ان کے ماتحت تعلیم حاصل کی۔ شعبان سنہ 478 میں اسی کے قریب وفات پائی۔ 365-366}۔"
  tr: "Ebu el-Abbas el-Adhri Ahmed ibn Ömer bin Anas ibn Dalath el-Endülüs el-Dala'i — daliyası El-Muriya'nın eserinden alınmıştır — ezberci, hadis alimi ve titiz bir adamdı; dört yüz dört yüz hicri yılında, sekiz yıl boyunca yanında yaşayan ebeveynleriyle birlikte Hac yaptı. Abadhar'ı sevdiği için mezun oldu ve Ebu el-Hasan ibn Jahdam ile bir grubundan rivayetçi oldu; Şaban'da dört yüz yetmiş sekizde öldü ve yaklaşık seksen yaşındaydı {atıf:Shadharat-Dhahab, s. 365-366}."
  id: "Abu al-Abbas al-Adhri Ahmad ibn Umar ibn Anas ibn Dalath al-Andalusi al-Dala'i — yang daliyahnya berasal dari karya Al-Muriya — adalah seorang penghafal dan ulama hadis serta teliti; ia melaksanakan Haji pada tahun empat ratus empat ratus H bersama orang tuanya, tinggal di sebelahnya selama delapan tahun. Ia adalah kekasih kepada Abadhar, sehingga ia lulus dengan agama itu dan menceritakan dari Abu al-Hasan ibn Jahdam dan kelompoknya; ia meninggal di Sha'ban pada tahun empat ratus tujuh puluh delapan dan berusia sekitar delapan puluh tahun {cite:shadharat-dhahab, hlm. 365-366}."
