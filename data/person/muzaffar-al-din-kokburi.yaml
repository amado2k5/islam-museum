id: person/muzaffar-al-din-kokburi
class: person
label: { ar: "مظفر الدين كوكبوري", en: "Muzaffar al-Din Kökburi" }
summary:
  ar: "مظفر الدين أبو سعيد كوكبوري بن الأمير زين الدين علي كوجك التركماني — وكوجك بالعربي اللطيف القدر — صاحب إربل؛ ولي مملكة إربل بعد موت أبيه سنة ثلاث وستين وله أربع عشرة سنة فتعصب عليه أتابكه مجاهد الدين قيماز وأقام أخاه يوسف، ثم اتصل بخدمة السلطان صلاح الدين وتمكن منه وتزوج بأخته ربيعة واقفة مدرسة الصاحبة بشرقي الصالحية وشهد معه عدة مواقف، ولما مات أخوه ثامن عشر رمضان سنة ست وثمانين وخمسمائة على عكا أعطاه صلاح الدين إربل وشهرزور وأخذ منه حران والرها ودامت أيامه إلى سنة ثلاثين وستمائة {cite:kamil-ibn-al-athir p. 199} {cite:shadharat-dhahab p. 138}؛ وكان من أدين الملوك وأجودهم وأكثرهم براً ومعروفاً على صغر مملكته: قناطير مقنطرة من الخبز تفرق يومياً على الحاويج في مواضع البلد، وأربع خانقات للزمنى والعميان يتفقدهم بنفسه كل اثنين وخميس، ودار للنساء الأرامل ودار للضعفاء ودار للأيتام ودار للملاقيط رتب فيها المراضع، ودار مضيف لكل قادم على البلد، وكان يسير في كل سنة دفعتين من أصحابه بالمال يفك بها أسرى المسلمين من أيدي الفرنج، ويقيم كل سنة سبيلاً للحاج مع أمين بخمسة آلاف دينار للحرمين، وهو أول من أجرى الماء إلى جبل عرفات وعمل بالجبل مصانع للماء؛ وأما احتفاله بالمولد في الثامن من ربيع الأول وسنة في الثاني عشر لأجل الاختلاف فعجائب: الزف بالإبل والبقر والغنى والطبول والمغانى إلى الميدان فالنحر والقدور، وسماعات بعد المغرب بالقلعة بشموع تحمل كل واحدة على بغل، وصبيحة المولد الخلع والبقج والنفقة على الفقهاء والوعاظ والقراء والشعراء؛ قال ابن شهبة كانت نفقته على المولد كل سنة ثلاثمائة ألف دينار وعلى الأسرى مائتي ألف وعلى دار المضيف مائة ألف وعلى الخانقاه مائة ألف وعلى الحرمين والسبيل وعرفات ثلاثين ألفاً، غير صدقة السرمات في رمضان بقلعة إربل؛ وأوصى أن يحمل إلى مكة فيدفن في حرم الله فحمل في تابوت إلى الكوفة ولم يتفق خروج الحاج في تلك السنة من التتار فدفن عند أمير المؤمنين علي بن أبي طالب {cite:shadharat-dhahab p. 138-140}."
  en: "Muzaffar al-Din Kökburi — lord of Irbil from boyhood under Saladin's gift (Harran and Edessa surrendered for it), and for fifty years its most charitable prince: daily bread by the qintar for the needy, four khanqahs for the lame and blind he visited twice weekly in person, houses for widows, orphans and foundlings, two annual missions buying Muslim captives free of the Franks, a Hajj road-fund of five thousand dinars for the Haramayn, the first water run to Arafat, and the great mawlid of 8 Rabi' I (300,000 dinars a year on it alone, per Ibn Shihba); he died in 630 and, the Hajj blocked by the Tatars, was buried at Kufa near Ali {cite:shadharat-dhahab p. 138-140}."
