label: { ar: "مظفر الدين كوكبوري", en: "Muzaffar al-Din Kökburi" }
summary:
  ar: "مظفر الدين كوكبوري بن زين الدين علي أخو زين الدين يوسف صاحب إربل؛ لما مات أخوه ثامن عشر رمضان سنة ست وثمانين وخمسمائة وهما عند صلاح الدين بالعسكر، وصف العماد الكاتب في البرق الشامي أنهم جاءوا يعزونه فإذا هو في شغل شاغل عن العزاء مهتم بالاحتياط على ما خلفه جالساً في خيام أخيه وقد قبض على جماعة من أمرائه واعتقلهم، فأرسل إلى صلاح الدين يطلب إربل نزولاً عن حران والرها فأقطعه إياها وأضاف إليها شهرزور وأعمالها ودربند قربابلي وبني قفجاق، فملكها وبقي — بقول ابن الأثير — غصة في حلق البيت الأتابكي لا يقدرون على إساغتها {cite:kamil-ibn-al-athir p. 199}."
  en: "Muzaffar al-Din Kökburi — al-Imad al-Katib watched him skip his brother's mourning to seize the amirs' tents and bargain Irbil out of Saladin in exchange for Harran and Edessa, with Shahrazur's revenues added; thereafter 'a bone in the Atabegid house's throat' {cite:kamil-ibn-al-athir p. 199}."
