id: person/muzaffar-al-din-kokburi
class: person
label: { ar: "مظفر الدين كوكبوري", en: "Muzaffar al-Din Kökburi" , ur: "مظفر الدین کوکبری", es: "Muzaffar al-Din Kökburi", fr: "Muzaffar al-Din Kökburi"}
summary:
  ar: "مظفر الدين أبو سعيد كوكبوري بن الأمير زين الدين علي كوجك التركماني — وكوجك بالعربي اللطيف القدر — صاحب إربل؛ ولي مملكة إربل بعد موت أبيه سنة ثلاث وستين وله أربع عشرة سنة فتعصب عليه أتابكه مجاهد الدين قيماز وأقام أخاه يوسف، ثم اتصل بخدمة السلطان صلاح الدين وتمكن منه وتزوج بأخته ربيعة واقفة مدرسة الصاحبة بشرقي الصالحية وشهد معه عدة مواقف، ولما مات أخوه ثامن عشر رمضان سنة ست وثمانين وخمسمائة على عكا أعطاه صلاح الدين إربل وشهرزور وأخذ منه حران والرها ودامت أيامه إلى سنة ثلاثين وستمائة {cite:kamil-ibn-al-athir p. 199} {cite:shadharat-dhahab p. 138}؛ وكان من أدين الملوك وأجودهم وأكثرهم براً ومعروفاً على صغر مملكته: قناطير مقنطرة من الخبز تفرق يومياً على الحاويج في مواضع البلد، وأربع خانقات للزمنى والعميان يتفقدهم بنفسه كل اثنين وخميس، ودار للنساء الأرامل ودار للضعفاء ودار للأيتام ودار للملاقيط رتب فيها المراضع، ودار مضيف لكل قادم على البلد، وكان يسير في كل سنة دفعتين من أصحابه بالمال يفك بها أسرى المسلمين من أيدي الفرنج، ويقيم كل سنة سبيلاً للحاج مع أمين بخمسة آلاف دينار للحرمين، وهو أول من أجرى الماء إلى جبل عرفات وعمل بالجبل مصانع للماء؛ وأما احتفاله بالمولد في الثامن من ربيع الأول وسنة في الثاني عشر لأجل الاختلاف فعجائب: الزف بالإبل والبقر والغنى والطبول والمغانى إلى الميدان فالنحر والقدور، وسماعات بعد المغرب بالقلعة بشموع تحمل كل واحدة على بغل، وصبيحة المولد الخلع والبقج والنفقة على الفقهاء والوعاظ والقراء والشعراء؛ قال ابن شهبة كانت نفقته على المولد كل سنة ثلاثمائة ألف دينار وعلى الأسرى مائتي ألف وعلى دار المضيف مائة ألف وعلى الخانقاه مائة ألف وعلى الحرمين والسبيل وعرفات ثلاثين ألفاً، غير صدقة السرمات في رمضان بقلعة إربل؛ وأوصى أن يحمل إلى مكة فيدفن في حرم الله فحمل في تابوت إلى الكوفة ولم يتفق خروج الحاج في تلك السنة من التتار فدفن عند أمير المؤمنين علي بن أبي طالب {cite:shadharat-dhahab p. 138-140}."
  en: "Muzaffar al-Din Kökburi — lord of Irbil from boyhood under Saladin's gift (Harran and Edessa surrendered for it), and for fifty years its most charitable prince: daily bread by the qintar for the needy, four khanqahs for the lame and blind he visited twice weekly in person, houses for widows, orphans and foundlings, two annual missions buying Muslim captives free of the Franks, a Hajj road-fund of five thousand dinars for the Haramayn, the first water run to Arafat, and the great mawlid of 8 Rabi' I (300,000 dinars a year on it alone, per Ibn Shihba); he died in 630 and, the Hajj blocked by the Tatars, was buried at Kufa near Ali {cite:shadharat-dhahab p. 138-140}."
  ur: "اربل کے حکمران؛ ماخذ محتاجوں، یتیموں اور بیواؤں کے لیے ان کے اداروں، قیدیوں کی رہائی اور حج کے راستے پر اخراجات کا ذکر کرتے ہیں۔ {cite:kamil-ibn-al-athir}"
  es: "Muzaffar al-Din Kökburi — señor de Irbil desde niño por donación de Saladino (Harran y Edesa se rindieron a cambio), y durante cincuenta años su príncipe más caritativo: pan diario por qintar para los necesitados, cuatro khanqahs para cojos y ciegos que visitaba dos veces por semana en persona, casas para viudas, huérfanos y expósitos, dos misiones anuales comprando cautivos musulmanes libres de los francos, un fondo para la construcción de carreteras del Hajj de cinco mil dinares para los Haramayn, el primer acarreo de agua a Arafat y el gran mawlid del 8 de Rabi' I (300.000 dinares al año solo en él, según Ibn Shihba); murió en 630 y, con el Hajj bloqueado por los tártaros, fue enterrado en Kufa cerca de Ali {cite:shadharat-dhahab p. 138-140}."
  fr: "Muzaffar al-Din Kökburi — seigneur d'Erbil depuis son enfance grâce au don de Saladin (Harran et Édesse se rendirent en échange), et pendant cinquante ans son prince le plus charitable: distribution quotidienne de pain par qintar aux nécessiteux, quatre khanqahs pour les boiteux et les aveugles qu'il visitait en personne deux fois par semaine, maisons pour les veuves, les orphelins et les enfants trouvés, deux missions annuelles rachetant des captifs musulmans aux Francs, un fonds de cinq mille dinars pour la route du Hajj pour les Haramayn, le premier acheminement d'eau vers Arafat, et le grand mawlid du 8 Rabi' I (300 000 dinars par an rien que pour cela, selon Ibn Shihba); il mourut en 630 et, le Hajj étant bloqué par les Tatars, fut enterré à Kufa près d'Ali {cite: shadharat-dhahab p. 138-140}."
  tr: "Muzafferdin Ebu Seyid Kokburi, Prens Zeyneddin Ali Kojak el-Türkmeni'nin oğlu — Arapçada Kojak, nazik ve yoksul — Erbil'in hükümdarıydı; babasının ölümünden sonra, on dört yaşındayken altmış üç yaşında Erbil Krallığı'nın hükümdarı oldu. Atabega Mücahiddin Kımaz ona düşmanca davrandı ve kardeşi Yusuf'u yerleştirdi. Daha sonra Sultan Salaheddin'in hizmetine katıldı, onun kontrolünü ele geçirdi, Sahiba Şerqi el-Salihiye okulunun kurucusu olan kız kardeşi Rabia ile evlendi ve onunla birçok savaşa tanık oldu. Kardeşi Ramazan ayının on sekizinde, beş yüz seksen altıncı yılın Akka'da öldüğünde, Salah al-Din ona bahis etti Harran ve Edessa'nın alındığı Erbil ve Şahrazur yılları 630 Hicri yılına kadar sürdü {cite:kamil-ibn-al-athir s. 199} {cite:shadharat-dhahab s. 138}; krallığının küçük olmasına rağmen en dindar, cömert ve tanınmış krallar arasındaydı: kasabanın çeşitli yerlerinde ihtiyaç sahiplerine günlük olarak dağıtılan ekmek yığınları, her Pazartesi ve Perşembe bizzat kontrol eden yaşlılar ve körler için dört hanqat, dul kadınlar için bir ev, zayıflar için bir ev, bir yetimhane, hemşirelerin düzenlendiği bir cımbız evi, kasabaya gelen her ziyaretçi için bir misafirhane ve her yıl seyahat ediyordu Yoldaşlarından iki grup, Müslüman esirleri Frankların elinden kurtarırdı ve her yıl Amin ile birlikte beş bin dinar karşılığında İki Kutsal Camiye hac güzergahı kurardı. Arafat Dağı'na su sağlayan ilk kişi oldu ve dağda su fabrikaları kurdu. Rebi'l-Avval'ın sekizinci günü ve yılın on ikinci yılında farklılıklar nedeniyle Mevlid kutlaması harikaydı: develer, inekler, şarkılar, davul ve şarkılarla meydana düğün alayı, sonra kurbanlar ve çömlekler, ardından kalede mumlarla eşek üzerinde taşınan Mağrip, Mevlid sabahı ise khul', bagj ve masraflar Hukukçular, vaizler, şiirciler ve şairler; İbn Şahba, Mevlid için yıllık harcamalarının üç yüz bin dinar, iki yüz bin mahkumlar için, yüz bin misafirhane, hanka için yüz bin ve İki Kutsal Camii, Sabil ve Arafat için otuz bin olduğunu, ayrıca Ramazan ayında Erbil Kalesi'nde Sarmat'ın yardımını saymıyorum bile. Mekke'ye götürülmesini ve Allah'ın kutsal alanına gömülmesini tavsiye etti, böylece tabutla Kufe'ye taşındı. Hacının o yıl Tatarlardan ayrılışı tesadüf etmedi, bu yüzden Müminler Komutanı Ali ibn Ebu Talib ile birlikte defnedildi {atıf: shadharat-dhahab, s. 138-140}."
  id: "Muzaffar al-Din Abu Sa'id Kokburi putra Pangeran Zain al-Din Ali Kojak al-Turkmani — dan Kojak dalam bahasa Arab, yang lemah lembut dan miskin — adalah penguasa Erbil; ia menjadi penguasa Kerajaan Erbil setelah ayahnya meninggal dalam enam puluh tiga tahun saat berusia empat belas tahun. Atabega Mujahid al-Din Qimaz menjadi bermusuhan dengannya dan menikahi saudaranya Yusuf. Ia kemudian bergabung dengan pelayanan Sultan Salah al-Din, menguasai Sultan Al-Din, menikahi saudara perempuannya Rabia, pendiri aliran Sahiba Sharqi al-Salihiyah dan menyaksikan beberapa pertempuran dengannya. Ketika saudaranya meninggal pada tanggal delapan belas Ramadan tahun lima ratus delapan puluh enam di Acre, Salah al-Din memberinya Erbil dan Shahrazur, dari mana Harran dan Edessa diambil, dan hari-harinya berlangsung hingga tahun 630 H {cite:kamil-ibn-al-athir hlm. 199} {cite:shadharat-dhahab hlm. 138}; ia termasuk raja paling taat, murah hati, dan terkenal meskipun kerajaannya kecil: tumpukan roti dibagikan setiap hari kepada yang membutuhkan di berbagai bagian kota, empat khanqat untuk lansia dan tunanetra yang memeriksa langsung setiap Senin dan Kamis, rumah untuk janda, rumah untuk orang lemah, panti asuhan, rumah pinset tempat perawat ditempatkan, rumah tamu untuk setiap pengunjung kota, dan ia melakukan perjalanan setiap tahun Dua kelompok temannya biasa membebaskan tawanan Muslim dari tangan orang Franka, dan setiap tahun ia mendirikan jalur ziarah bersama Amin seharga lima ribu dinar ke Dua Masjid Suci. Ia adalah yang pertama menyalurkan air ke Gunung Arafat dan mendirikan pabrik air di gunung itu. Adapun perayaannya atas Mawlid pada tanggal delapan Rabi' al-Awwal dan tahun kedua belas karena perbedaan perbedaan, itu luar biasa: prosesi pernikahan dengan unta, sapi, nyanyian, genderang, dan lagu ke alun-alun, lalu korban dan pot, dan setelah Maghrib di benteng dengan lilin yang dibawa dengan keledai, dan pada pagi hari Mawlid, khul', bagj, dan biaya untuk Ahli hukum, pengkhotbah, pembaca, dan penyair; Ibn Shahba mengatakan pengeluaran tahunan untuk Mawlid adalah tiga ratus ribu dinar, dua ratus ribu untuk tahanan, seratus ribu untuk rumah tamu, seratus ribu untuk khanqah, dan tiga puluh ribu untuk Dua Masjid Suci, Sabil, dan Arafat, belum lagi amal Sarmat selama Ramadan di Benteng Erbil. Ia merekomendasikan agar ia dibawa ke Mekah dan dimakamkan di tempat suci Tuhan, sehingga ia dibawa dalam peti mati ke Kufa. Kepergian peziarah dari Tatar pada tahun itu bukanlah kebetulan, sehingga ia dimakamkan bersama Panglima Orang Beriman, Ali ibn Abi Talib {cite:shadharat-dhahab, hlm. 138-140}."
