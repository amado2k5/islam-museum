class: person
label: { ar: "الضحاك بن قيس الشيباني الخارجي", en: "al-Dahhak ibn Qays al-Shaybani al-Khariji" }
summary:
  ar: "أمير الخوارج في فتنة آخر بني أمية، خرج بالجزيرة حتى غلب عليها وأخذ الموصل ثم سار في ذي القعدة سنة سبع وعشرين ومائة فدخل العراق، وصالحه عبد الله بن عمر بن عبد العزيز عامل مروان على أن تكون له الكوفة وسوادها وما غلب عليه وتكون لابن عمر واسط وميسان وتستر وميسان وكور الجدة والأهواز وفارس، فاستعمل على الكوفة ملحان الشيباني ثم المثنى بن عمران العائذي، وجمع إليه جموعاً لم يجتمع للخوارج قبله مثلها حتى قيل إنهم بلغوا مائة ألف وعشرين ألفاً {cite:tabari-khayyat-part2 p. 641-643}."
  en: "Leader of the Kharijites in the strife at the end of the Umayyad dynasty. He rose in al-Jazira and prevailed there, took Mosul, then in Dhu al-Qa'da 127 marched into Iraq. Abd Allah ibn Umar ibn Abd al-Aziz, Marwan's governor, made terms with him: Kufa and its countryside, and what he had taken, were to be his, while Ibn Umar was to hold Wasit, Maysan, Tustar, Maysan again, Kur al-Jadda, al-Ahwaz and Fars. He set Mulhan al-Shaybani, and then al-Muthanna ibn Imran al-A'idhi, over Kufa, and gathered hosts such as the Kharijites had never assembled before, said to have reached 120,000 {cite:tabari-khayyat-part2 p. 641-643}."
