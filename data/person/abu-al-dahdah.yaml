  ar: "أبو الدحداح الأنصاري، صحابي يذكره الشيخ عمر عبد الكافي مثالًا لعلوّ الهمة في البذل: لما سمع آية القرض الحسن أقرض الله بستانه، وأخرج امرأته أم الدحداح أطفالها منه."
  en: "Abu al-Dahdah al-Ansari, a Companion whom Sheikh Omar Abdelkafy cites as an example of high resolve in giving: on hearing the verse of the goodly loan he lent his orchard to God, and his wife Umm al-Dahdah took her children out of it."
