summary:
  ar: "أكاديمية ومؤلفة كندية من أصل تونسي، زوجة ماهر عرار، قادت حملة عامة لإطلاق سراحه من سجنه في سوريا، ثم عملت منسّقة وطنية لمجموعة مراقبة الحريات المدنية الدولية وكتبت كتبًا عن تجربتها."
  en: "Tunisian-born Canadian academic and author, the wife of Maher Arar, who campaigned publicly for his release from imprisonment in Syria, later served as national coordinator of the International Civil Liberties Monitoring Group, and wrote books about the experience."
  ur: "تیونس نژاد کینیڈین ماہر تعلیم و مصنفہ، ماہر ارار کی اہلیہ، جنہوں نے شام میں ان کی قید سے رہائی کے لیے عوامی مہم چلائی، بعد میں انٹرنیشنل سول لبرٹیز مانیٹرنگ گروپ کی قومی رابطہ کار رہیں اور اپنے تجربے پر کتابیں لکھیں۔"
