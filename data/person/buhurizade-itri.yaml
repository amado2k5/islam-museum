summary:
  ar: "بطاقة أولية لبخور زاده مصطفى أفندي المعروف بعطري، موسيقار وخطاط إسطنبول العثماني في القرن الثامن عشر، توفي سنة ١٧١١م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Buhurizade Mustafa Efendi 'Itri', the eighteenth-century Ottoman composer and calligrapher of Istanbul, d. 1711; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Buhurizade Mustafa Efendi 'Itri', compositor y calígrafo otomano del siglo XVIII originario de Estambul, fallecido en 1711; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Buhurizade Mustafa Efendi « Itri », compositeur et calligraphe ottoman du XVIIIe siècle originaire d'Istanbul, décédé en 1711; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "اٹھارویں صدی کے عثمانی موسیقار اور استنبول کے خطاط، بوہری زادے مصطفیٰ آفندی 'اتری' کے لیے ڈرافٹ کارڈ۔ 1711; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Bakhurzadeh Mustafa Effendi, nam-ı diğer Attari için ön kart; 1711 yılında ölen Osmanlı İstanbul'unda müzisyen ve hattatçı olarak bilinir; önemli kişilerin sözlükleriyle anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Bakhurzadeh Mustafa Effendi, yang dikenal sebagai Attari, seorang musisi dan kaligrafer Istanbul Ottoman pada abad kedelapan belas, yang meninggal pada tahun 1711 M; ia dikenang oleh kamus tokoh-tokoh terkenal dan biografinya belum pernah diulas di halaman tersebut."
