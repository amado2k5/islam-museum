label: { ar: "محرز المدلجي", en: "Muhriz al-Mudliji", es: "Muhriz al-Mudliji", fr: "Muhriz al-Mudliji", ur: "محریز المدلجی" }
summary:
  ar: "القائف الذي صدقه النبي محمد بن عبد الله في قيافته فحجت به طائفة من فقهاء الأمصار في الحكم بالقيافة تعجباً من تعجبه منها وتصديقه إياه {cite:muruj-al-dhahab p. 481}. وعند الواقدي قتل يوم الغابة في خمسة أو ستة من المشركين قتلهم النبي بيده في تلك الغزوة على ما حكاه المسعودي {cite:muruj-al-dhahab p. 580}"
  en: "The tracker of Mudlij whose reading the Prophet confirmed — cited by the jurists who upheld qiyafa as evidence {cite:muruj-al-dhahab p. 481}."
  es: "El rastreador de Mudlij cuya lectura fue confirmada por el Profeta — citado por los juristas que defendieron la qiyafa como evidencia {cite:muruj-al-dhahab p. 481}."
  fr: "Le traqueur de Mudlij dont la lecture a été confirmée par le Prophète — cité par les juristes qui ont soutenu la qiyafa comme preuve {cite:muruj-al-dhahab p. 481}."
  ur: "مدلج کا سراغ لگانے والا جس کے پڑھنے سے نبی نے تصدیق کی ہے - جو فقہاء نے قیافہ کو بطور ثبوت پیش کیا ہے 481}۔"
  tr: "Peygamber Muhammed bin Abdullah'ın Kıyameti ve bölgelerden bir grup fıhil, Kıyafe'nin yargısı üzerine Hac yapmış, onun hayranlığı ve inancı karşısında hayranlık ve inanç karşısında (atı:muruj-al-dhahab, s. 481} el-Vaqidi'ye göre, orman gününde, Peygamber'in o savaşta kendi eliyle öldürdüğü beş ya da altı çok tanrılı tarafından öldürülmüştür; bu riwayete el Mes'udi tarafından rivayet edilmiştir {cite:muruj-al-dhahab, s. 580}"
  id: "Qayyf, yang dipercaya oleh Nabi Muhammad ibn Abdullah dalam Qiyaf-nya, dan sekelompok ahli hukum dari daerah tersebut melaksanakan Haji atas penilaiannya oleh Qiyafah, terkejut dengan kekaguman dan kepercayaannya kepadanya {cite:muruj-al-dhahab, hlm. 481}. Menurut al-Waqidi, pada hari hutan, ia dibunuh oleh lima atau enam musyrik yang dibunuh oleh Nabi dengan tangannya sendiri dalam pertempuran itu, seperti yang diceritakan oleh al-Mas'udi {cite:muruj-al-dhahab, hlm. 580}"
