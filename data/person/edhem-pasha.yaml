summary:
  ar: "أدهم باشا (1844 – 17 ديسمبر 1909)، المعروف أيضًا بغازی أدهم باشا، مشير عثماني كان نائب عثمان نوري باشا في دفاع بلفنة سنة 1877، ثم قاد الجيش العثماني الذي هزم اليونان على جبهة تساليا في حرب 1897 فمنحه السلطان عبد الحميد الثاني لقب «غازي»، وتولّى وزارة الحرب أسبوعين سنة 1909 قبل أن يموت في مصر في العام نفسه. وهو غير إبراهيم أدهم باشا الصدر الأعظم."
  en: "Edhem Pasha (1844 – 17 December 1909), also known as Gazi Edhem Pasha, was an Ottoman field marshal who was Osman Nuri Pasha's deputy at the defence of Plevna in 1877 and then commanded the army that defeated Greece on the Thessalian front in the Greco-Turkish War of 1897, for which Sultan Abdul Hamid II gave him the title Gazi. He was Minister of War for two weeks in 1909 and died in Egypt later that year. He is not Ibrahim Edhem Pasha, the grand vizier."
  ur: "ادہم پاشا (1844ء – 17 دسمبر 1909ء)، جو غازی ادہم پاشا بھی کہلائے، عثمانی مشیر تھے؛ 1877ء میں پلیونہ کے دفاع میں عثمان نوری پاشا کے نائب رہے، پھر 1897ء کی جنگ میں تھیسالی محاذ پر یونان کو شکست دینے والی فوج کے سپہ سالار ہوئے جس پر سلطان عبدالحمید ثانی نے انھیں «غازی» کا لقب دیا۔ 1909ء میں دو ہفتے وزیرِ جنگ رہے اور اسی سال مصر میں وفات پائی۔ یہ صدرِ اعظم ابراہیم ادہم پاشا سے مختلف شخص ہیں۔"
