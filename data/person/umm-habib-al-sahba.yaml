gender: female
traditions: [sunni]
summary:
  ar: "تغلبية؛ كانت من سبي بني تغلب المرتدين عليهم ربيعة بن بجير بالمضيح والمصيد حين هزمهم خالد بن الوليد في طريقه إلى الشام وبعث بالسبي إلى أبي بكر، وهي أم عمر بن علي بن أبي طالب."
  en: "A Taghlibi woman; she was among the captives of the apostate Banu Taghlib under Rabi'a ibn Bujayr at al-Mudayyih and al-Musayyid when Khalid ibn al-Walid defeated them on his way to Syria and sent the captives to Abu Bakr; she is the mother of Umar ibn Ali ibn Abi Talib."
  es: "Una mujer taghlib; estuvo entre los cautivos de los apóstatas Banu Taghlib bajo el mando de Rabi'a ibn Bujayr en al-Mudayyih y al-Musayyid cuando Khalid ibn al-Walid los derrotó en su camino a Siria y envió a los cautivos a Abu Bakr; es la madre de Umar ibn Ali ibn Abi Talib."
  fr: "Une femme Taghlibi; elle faisait partie des captives des Banu Taghlib apostats sous Rabi'a ibn Bujayr à al-Mudayyih et al-Musayyid lorsque Khalid ibn al-Walid les vainquit sur son chemin vers la Syrie et envoya les captifs à Abu Bakr; elle est la mère d'Umar ibn Ali ibn Abi Talib."
  ur: "تغلبی عورت؛ وہ مرتد بنو تغلب کی اسیروں میں سے تھیں جو ربیعہ بن بُزیر کے ماتحت المدیہ اور المسیّد میں تھیں جب خالد بن ولید نے شام جاتے ہوئے انہیں شکست دی اور اسیروں کو ابوبکر کے پاس بھیجا۔ وہ عمر بن علی ابن ابی طالب کی والدہ ہیں۔"
  tr: "Taghlibiyah; Banu Taghlib'in esirlerinden biriydi; Banu'nun Rahmi'ye karşı dinden dönmüş Rabi'ah ibn Bujir'i Al-Mudih ve Al-Maḥad'da al-Maḥad'da tutsaklar kurmuştu; Halid bin al-Velid onları Levant'a giderken yenip esirleri Ebu Bekir'e göndermişti; Ebu Bekir, Ömer bin Ali ibn Abi Talib'in annesiydi."
  id: "Taghlibiyah; dia adalah salah satu tawanan Banu Taghlib, yang memiliki murtad melawan mereka, Rabi'ah ibn Bujir dalam Al-Mudih dan Al-Maḥad, ketika Khalid ibn al-Walid mengalahkan mereka dalam perjalanan ke Levant dan mengirim tawanan itu ke Abu Bakr, ibu dari Umar ibn Ali ibn Abi Talib."
