summary:
  ar: "شهاب الدين أحمد بن حجر الهيتمي السعدي الأنصاري الشافعي، الإمام العلامة البحر الزاخر؛ ولد في رجب سنة تسع وتسعمائة بمحلة أبي الهيثم من إقليم الغريسة بمصر، ومات أبوه وهو صغير فكفله الإمامان شمس الدين بن أبي الجمائل وشمس الدين الشناوي، ونقله الشناوي إلى مقام سيدي أحمد البدوي ثم إلى جامع الأزهر سنة أربع وعشرين فأخذ عن علماء مصر منهم القاضي زكريا وعبد الحق السنباطي والسمهودي والرملي والطبلاوي واللقاني وأذنوا له بالإفتاء والتدريس وعمره دون العشرين، وقدم مكة سنة ثلاث وثلاثين فحج وجاور ثم نزع سنة أربعين فجاور بمكة يدرس ويفتي ويؤلف؛ ومن مؤلفاته شرح المشكاة وشرح المنهاج وشرحان على الإرشاد وشرح الهمزية البوصيرية وشرح الأربعين النووية والصواعق المحرقة وكف الرعاع عن محرمات اللهو والسماع والزواجر عن اقتراف الكبائر ونصيحة الملوك وشرح العباب المسمى بالإيضاح وتحذير الثقات عن أكل الكفتة والقات ومناقب أبي حنيفة؛ وكان شيخ الإسلام خاتمة العلماء الأعلام إمام الحرمين؛ توفي بمكة في رجب ودُفن بالمعلاة في تربة الطبريين {cite:shadharat-dhahab p. 370-371}."
  en: "Ibn Hajar al-Haytami — b. Rajab 909 at Abu al-Haytham in Gharbiyya, orphaned young and fostered by Ibn Abi al-Jamayil and al-Shinnawi, licensed to teach before twenty; from 940 a Meccan mujawir teaching, issuing fatwas and writing: Sharh al-Mishkat, Sharh al-Minhaj, al-Sawa'iq al-Muhriqa, Kaff al-Ri'a', al-Zawajir; 'shaykh al-Islam, seal of the scholars, imam of the two Harams'; died at Mecca in Rajab 973, buried at Ma'la {cite:shadharat-dhahab p. 370-371}."
