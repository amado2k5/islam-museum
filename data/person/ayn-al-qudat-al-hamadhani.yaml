label: { ar: "عين القضاة الهمذاني" }
names:
  - { value: "أبو المعالي عبد الله بن محمد الميانجي عين القضاة الهمذاني", kind: full }
summary:
  ar: "الفقيه العلامة الأديب أبو المعالي عبد الله بن محمد الميانجي — من ميانة بلد بأذربيجان — أحد من كان يُضرب به المثل في الذكاء؛ دخل في التصوف ودقائقه ومعاني إشارات القوم حتى ارتبط عليه الخلق، ثم صُلب بهمذان على تلك الألفاظ الكفرية سنة خمس وعشرين وخمسمائة {cite:shadharat-dhahab p. 555}."
  en: "The jurist, scholar and litterateur Abu al-Ma'ali Abdallah ibn Muhammad al-Miyanji — of Miyana in Azerbaijan — proverbial for brilliance; he entered Sufism and its subtleties until people flocked to him, then was crucified at Hamadan over those utterances deemed unbelief, in 525 {cite:shadharat-dhahab p. 555}."
  es: "El jurista, erudito y literato Abu al-Ma'ali Abdallah ibn Muhammad al-Miyanji —de Miyana en Azerbaiyán— proverbial por su brillantez; se adentró en el sufismo y sus sutilezas hasta que la gente acudió a él, y luego fue crucificado en Hamadán por aquellas declaraciones consideradas incredulidad, en 525 {cite:shadharat-dhahab p. 555}."
  fr: "Le juriste, érudit et homme de lettres Abu al-Ma'ali Abdallah ibn Muhammad al-Miyanji — de Miyana en Azerbaïdjan — proverbial pour sa brillance; il entra dans le soufisme et ses subtilités jusqu'à ce que les gens affluent vers lui, puis fut crucifié à Hamadan pour ces propos considérés comme de l'incroyance, en 525 {cite:shadharat-dhahab p. 555}."
  ur: "فقیہ، عالم اور ادیب ابو المعالی عبد اللہ ابن محمد المیانجی - آذربائیجان میں میانہ کے - شاندار کے لئے کہاوت؛ وہ تصوف اور اس کی باریکیوں میں داخل ہوا یہاں تک کہ لوگ اس کے پاس آنے لگے، پھر 525 میں ان باتوں پر جن کو کفر سمجھا جاتا تھا ہمدان میں مصلوب کیا گیا۔ 555}۔"
