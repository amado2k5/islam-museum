  ar: "الفقيه العلامة الأديب أبو المعالي عبد الله بن محمد الميانجي — من ميانة بلد بأذربيجان — أحد من كان يُضرب به المثل في الذكاء؛ دخل في التصوف ودقائقه ومعاني إشارات القوم حتى ارتبط عليه الخلق، ثم صُلب بهمذان على تلك الألفاظ الكفرية سنة خمس وعشرين وخمسمائة {cite:shadharat-dhahab p. 555}."
  en: "The jurist, scholar and litterateur Abu al-Ma'ali Abdallah ibn Muhammad al-Miyanji — of Miyana in Azerbaijan — proverbial for brilliance; he entered Sufism and its subtleties until people flocked to him, then was crucified at Hamadan over those utterances deemed unbelief, in 525 {cite:shadharat-dhahab p. 555}."
