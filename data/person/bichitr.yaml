summary:
  ar: "مصور مغولي من أواخر عهد جهانگير وعهد شاه جهان، اشتهر بسلسلة بورتريهات باهرة في ثلاثينيات القرن السابع عشر، خطه لامع صلب وألوانه جريئة، وأقدم أعماله الموقعة «جهانگير يفضل شيخًا صوفيًا على الملوك» {cite:beach-grand-mogul-1978 p. 100} {cite:beach-grand-mogul-1978 p. 101}."
  en: "Mughal painter of the later Jahangir and Shah Jahan periods, known for a brilliant series of portraits in the 1630s, with hard, brilliant line and bold colour; his earliest signed work is Jahangir Preferring a Sufi Shaikh to Kings {cite:beach-grand-mogul-1978 p. 100} {cite:beach-grand-mogul-1978 p. 101}."
  ur: "جہانگیر کے آخری اور شاہ جہان کے دور کے مغل مصور، 1630ء کی دہائی کی شاندار شبیہوں کے سلسلے کے لیے مشہور، چمکدار سخت لکیر اور جرات مند رنگ؛ ان کا پہلا دستخطی کام «جہانگیر ایک صوفی شیخ کو بادشاہوں پر ترجیح دیتے ہوئے» ہے {cite:beach-grand-mogul-1978 p. 100} {cite:beach-grand-mogul-1978 p. 101}۔"
