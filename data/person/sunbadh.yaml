summary:
  ar: "سنباذ، مجوسي من قرية أهروانة بضواحي نيسابور؛ شكلت حركته أول رد فعل لمقتل أبي مسلم فخرج غضباً لقتله وطلباً للأخذ بثأره، فالتف حوله الأتباع وغلب على نيسابور وقومس والري وتسمى باسم «فيروز أصبهذ» واستولى على خزائن أبي مسلم وأعلن أنه سيهاجم مكة ويهدم الكعبة انتقاماً؛ واتسمت حركته بثلاثة دوافع — سياسية بالثأر لأبي مسلم من المنصور، وعقدية اشتقت مبادئها من الخرمية والمزدكية القديمة واعتقد أتباعها بإمامة أبي مسلم وأزليته وأنه لم يمت، وعنصرية تطلعت إلى إحياء الدولة الفارسية — حتى أرسل إليه أبو جعفر جيشاً بقيادة جهور بن مرّار العجلي اصطدم به بين همذان والري وقضى عليه سنة ١٣٧هـ بعد سبعين يوماً من قيامها {cite:tarikh-dawla-abbasiyya-taqqush p. 53-55}."
  en: "Sunbadh — the Zoroastrian of Aharwana who rose for Abu Muslim's blood as 'Firuz Aspahbadh', seized Nishapur, Qumis and Rayy, and fell to Jahwar ibn Marrar after seventy days, 137 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 53-55}."
  es: "Sunbadh: el zoroástrico de Aharwana que se levantó por la sangre de Abu Muslim como 'Firuz Aspahbadh', se apoderó de Nishapur, Qumis y Rayy, y cayó ante Jahwar ibn Marrar después de setenta días, 137 AH {cita:tarikh-dawla-abbasiyya-taqqush p. 53-55}."
  fr: "Sunbadh — le zoroastrien d'Aharwana qui s'est levé pour le sang d'Abu Muslim sous le nom de « Firuz Aspahbadh », s'est emparé de Nishapur, Qumis et Rayy, et est tombé aux mains de Jahwar ibn Marrar après soixante-dix jours, 137 AH {cite: tarikh-dawla-abbasiyya-taqqush p. 53-55}."
  ur: "سنبد - اہروانہ کا زرتشتی جو ابو مسلم کے خون کے لیے 'فیروز اسپہباد' کے طور پر اٹھ کھڑا ہوا، نیشاپور، قمیس اور رے پر قبضہ کر لیا اور ستر دن کے بعد جوار ابن مرار کے پاس جا گرا، 137 ہجری 53-55}۔"
  tr: "Nişapur'un dışındaki Ahrawana köyünden bir Magian olan Sinbadh, Ebu Müslim'in öldürülmesine ilk tepki olarak ortaya çıktı. Öldürülmesine öfkeyle ayağa kalktı ve intikam peşinde koştu. Takipçileri etrafında toplandı ve Nişapur, Qumis'e hakim oldu ve 'Fairuz Asbahd' olarak bilinen Rayy, Ebu Müslim'in hazinelerini ele geçirdi ve intikam olarak Mekke'ye saldırıp Kabe'yi yok edeceğini ilan etti. Hareketi üç amaçla karakterize edildi: siyasi olarak Ebu Müslüman'ın intikamını al-Mansur'a karşı almak; eski Hurramiyya ve Mazdakiyya'dan türetilen doktrinsel bir ilke; takipçileri Ebu Müslim'in imateliğine ve sonsuzluğuna inanıyordu, ölmediğine inanıyordu; ve yeniden canlandırmaya çalışan ırkçılık Pers devleti — ta ki Ebu Ca'fer, Jahur ibn Marar el-Ecli komutasındaki bir ordu gönderene kadar; bu ordu, Hamaman ile Rayy arasında çatıştı ve kuruluşundan yetmiş gün sonra 137 Hicri'de onu öldürdü {atıf:Tarikh-dawla-abbasiyya-taqqush s. 53-55}."
  id: "Sinbadh, seorang Magian dari desa Ahrawana di pinggiran Nishapur, adalah reaksi pertama terhadap pembunuhan Abu Muslim. Ia bangkit dengan marah atas pembunuhan Abu Muslim dan mencari balas dendam. Para pengikutnya berkumpul di sekitarnya, dan ia menguasai Nishapur, Qumis, dan Rayy, yang dikenal sebagai 'Fairuz Asbahd,' merebut harta Abu Muslim, dan mengumumkan bahwa ia akan menyerang Mekah dan menghancurkan Ka'bah sebagai balas dendam. Gerakannya ditandai oleh tiga motif—politik dalam membalas dendam Abu Muslim terhadap al-Mansur; prinsip doktrin yang berasal dari Khurramiyya dan Mazdakiyya kuno, yang para pengikutnya percaya pada immate dan keabadian Abu Muslim dan bahwa ia tidak mati; serta rasisme yang berusaha menghidupkan kembali Negara Persia — hingga Abu Ja'far mengirim pasukan yang dipimpin oleh Jahur ibn Marar al-Ajli, yang bertempur dengannya antara Hamadan dan Rayy dan membunuhnya pada tahun 137 H setelah tujuh puluh hari sejak pendiriannya {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 53-55}."
