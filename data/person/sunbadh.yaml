summary:
  ar: "سنباذ، مجوسي من قرية أهروانة بضواحي نيسابور؛ شكلت حركته أول رد فعل لمقتل أبي مسلم فخرج غضباً لقتله وطلباً للأخذ بثأره، فالتف حوله الأتباع وغلب على نيسابور وقومس والري وتسمى باسم «فيروز أصبهذ» واستولى على خزائن أبي مسلم وأعلن أنه سيهاجم مكة ويهدم الكعبة انتقاماً؛ واتسمت حركته بثلاثة دوافع — سياسية بالثأر لأبي مسلم من المنصور، وعقدية اشتقت مبادئها من الخرمية والمزدكية القديمة واعتقد أتباعها بإمامة أبي مسلم وأزليته وأنه لم يمت، وعنصرية تطلعت إلى إحياء الدولة الفارسية — حتى أرسل إليه أبو جعفر جيشاً بقيادة جهور بن مرّار العجلي اصطدم به بين همذان والري وقضى عليه سنة ١٣٧هـ بعد سبعين يوماً من قيامها {cite:tarikh-dawla-abbasiyya-taqqush p. 53-55}."
  en: "Sunbadh — the Zoroastrian of Aharwana who rose for Abu Muslim's blood as 'Firuz Aspahbadh', seized Nishapur, Qumis and Rayy, and fell to Jahwar ibn Marrar after seventy days, 137 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 53-55}."
