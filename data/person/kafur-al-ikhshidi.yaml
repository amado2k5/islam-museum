label: { ar: "كافور الإخشيدي" }
summary:
  ar: "الأستاذ كافور، مملوك الإخشيد محمد بن طغج، صار صاحب مصر بعده فلما مات اختل النظام وقلت الأموال على الجند فكتب جماعة إلى المعز العبيدي يطلبون عسكراً ليسلموا إليه مصر {cite:tarikh-khulafa-minhaj-1434 p. 615,620}. اشتراه الإخشيد وتقدم عنده حتى صار أكبر قواده لعقله ورأيه وشجاعته ثم صار أتابك ولده من بعده وكان عبياً فبقي الاسم لأبي القاسم أنوجور والدست لكافور فأحسن سياسة الأمور إلى أن مات أنوجور؛ ومعناه بالعربي مأمون {cite:shadharat-dhahab p. 29}."
  en: "Ustad Kafur, the Ikhshid's mamluk and successor in Egypt; on his death order broke down, the troops' pay ran short, and notables wrote to the Ubaydid al-Mu'izz asking for an army to hand him the country {cite:tarikh-khulafa-minhaj-1434 p. 615,620}."
