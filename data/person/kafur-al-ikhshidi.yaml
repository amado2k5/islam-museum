id: person/kafur-al-ikhshidi
class: person
label: { ar: "كافور الإخشيدي" }
summary:
  ar: "الأستاذ كافور، مملوك الإخشيد محمد بن طغج، صار صاحب مصر بعده فلما مات اختل النظام وقلت الأموال على الجند فكتب جماعة إلى المعز العبيدي يطلبون عسكراً ليسلموا إليه مصر {cite:tarikh-khulafa-minhaj-1434 p. 615,620}. اشتراه الإخشيد وتقدم عنده حتى صار أكبر قواده لعقله ورأيه وشجاعته ثم صار أتابك ولده من بعده وكان عبياً فبقي الاسم لأبي القاسم أنوجور والدست لكافور فأحسن سياسة الأمور إلى أن مات أنوجور؛ ومعناه بالعربي مأمون {cite:shadharat-dhahab p. 29}."
  en: "Ustad Kafur, the Ikhshid's mamluk and successor in Egypt; on his death order broke down, the troops' pay ran short, and notables wrote to the Ubaydid al-Mu'izz asking for an army to hand him the country {cite:tarikh-khulafa-minhaj-1434 p. 615,620}."
  es: "Ustad Kafur, mameluco y sucesor de Ikhshid en Egipto; tras su muerte, el orden se quebró, la paga de las tropas se agotó y notables escribieron a Ubaydid al-Mu'izz pidiéndole un ejército para entregarle el país {cite:tarikh-khulafa-minhaj-1434 p. 615,620}."
  fr: "Ustad Kafur, le mamelouk et successeur de l'Ikhshid en Égypte; à sa mort, l'ordre s'est effondré, la solde des troupes est devenue insuffisante et des notables ont écrit à l'Ubaydid al-Mu'izz pour lui demander une armée afin de lui remettre le pays {cite:tarikh-khulafa-minhaj-1434 p. 615,620}."
  ur: "استاد کافور، مصر میں اخشد کے مملوک اور جانشین؛ اس کی موت کا حکم ٹوٹنے پر، فوجیوں کی تنخواہیں کم ہو گئیں، اور قابل ذکر لوگوں نے عبید المعز کو خط لکھا کہ وہ ملک اس کے حوالے کرنے کے لیے فوج طلب کرے {حوالہ:تاریخ-خلفاء منہاج-1434 ص۔ 615,620}۔"
  tr: "El-İhşid Muhammed bin Tuğac'ın kölesi Profesör Kafur, ondan sonra Mısır'ın hükümdarı oldu. O öldüğünde sistem bozuldu ve ordunun serveti azaldı. El-Mu'izz el-Ubaydi'ye Mısır'ı kendisine teslim etmeleri için askerlerden rica eden mektup yazdı {atıf:Tarikh-Khulafa-minhaj-1434 s. 615,620}. Al-İhşid onu satın aldı ve zekâsı, görüşü ve cesareti sayesinde en büyük komutanı olana kadar ilerledi. Daha sonra köle olan oğlu Atabek oldu. Adı Abu al-Kasim Anujor olarak kaldı, Kafur'a al-Dast olarak da geçti, bu yüzden Anujur ölene kadar politikasını geliştirdi; Arapça'da 'Ma'mun' anlamına gelir {atıf:shadharat-dhahab, s. 29}."
  id: "Profesor Kafur, budak al-Ikhshid Muhammad ibn Tughaj, menjadi penguasa Mesir setelahnya. Ketika ia meninggal, sistem terganggu dan kekayaan tentara menipis. Ia menulis surat kepada al-Mu'izz al-Ubaydi meminta tentara menyerahkan Mesir kepadanya {cite:Tarikh-Khulafa-minhaj-1434 hlm. 615,620}. Al-Ikhshid membelinya dan maju bersamanya hingga ia menjadi komandan terbesarnya karena kecerdasan, pendapat, dan keberaniannya. Ia kemudian menjadi Atabek, putranya setelahnya, yang menjadi budak. Nama itu tetap Abu al-Qasim Anujor dan al-Dast menjadi Kafur, sehingga ia memperbaiki kebijakannya hingga Anujur wafat; dalam bahasa Arab, artinya 'Ma'mun' {cite:shadharat-dhahab, hlm. 29}."
