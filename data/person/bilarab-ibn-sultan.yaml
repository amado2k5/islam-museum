roles: [ruler, faqih]
gender: male
summary:
  ar: "بلعرب بن سلطان بن سيف بن مالك اليعربي، ثالث الأئمة اليعاربة في عمان، من الإباضية، بويع له بنزوى سنة 1091 هـ، ومات في حصار أخيه سيف له في حصن يبرين، وتذكر المصادر وفاته سنة 1104 هـ."
  en: "Bil'arab ibn Sultan ibn Sayf ibn Malik al-Ya'rubi, the third Ya'rubi imam of Oman, of the Ibadi school; he was given the oath at Nizwa in 1091 AH and died during his brother Sayf's siege of him in the fort of Yabrin; the card dates his death 1692 and al-Zirikli prints 1104 AH."
  es: "Bil'arab ibn Sultan ibn Sayf ibn Malik al-Ya'rubi, el tercer imán Ya'rubi de Omán, de la escuela ibadí; prestó juramento en Nizwa en 1091 AH y murió durante el asedio de su hermano Sayf en la fortaleza de Yabrin; la estampa fecha su muerte en 1692 y al-Zirikli imprime 1104 AH."
  fr: "Bil'arab ibn Sultan ibn Sayf ibn Malik al-Ya'rubi, le troisième imam Ya'rubi d'Oman, de l'école ibadite; il prêta serment à Nizwa en 1091 AH et mourut lors du siège de la forteresse de Yabrin par son frère Sayf; la carte date sa mort de 1692 et al-Zirikli imprime 1104 AH."
  ur: "عمان کے تیسرے یاروبی امام بلعرب بن سلطان ابن سیف بن مالک ال یاروبی، عبادی مکتب کے؛ اسے 1091 ہجری میں نزوا میں بیعت دی گئی اور یبرین کے قلعہ میں اپنے بھائی سیف کے محاصرے کے دوران اس کی موت ہوگئی۔ کارڈ پر ان کی وفات کی تاریخ 1692 ہے اور الزرکلی نے 1104 ہجری چھاپی۔"
  tr: "Umman'daki üçüncü Ya'aruba imamı Balarab bin Sultan bin Saif bin Malik Al-Ya'rubi, İbadilerden olup 1091 Hicri'nde Nizwa'da ona bağlılık yemini etmiş ve kardeşi Saif Luh'un Yabrin kalesinde kuşatması sırasında ölmüştür. Kaynaklar onun 1104 Hicri yılında öldüğünden bahsetmektedir."
  id: "Balarab bin Sultan bin Saif bin Malik Al-Ya'rubi, imam Ya'aruba ketiga di Oman, dari Ibadi, telah bersumpah setia kepadanya pada Nizwa tahun 1091 H, dan meninggal saat pengepungan saudaranya Saif Luh di benteng Yabrin. Sumber menyebutkan kematiannya pada tahun 1104 H."
