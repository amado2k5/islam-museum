  ar: كتب إلى محمد بن عبيد الله بما أجمع عليه ابن عباد قبل ليلة الأضحى بصعدة.
  en: Wrote to Muhammad ibn Ubaydallah of what Ibn Abbad had agreed, before the night of Adha at Sa'da.
  ur: عید الاضحیٰ کی رات سے پہلے صعدہ میں محمد بن عبید اللہ کو لکھا کہ ابن عباد نے کیا ٹھانا ہے۔
  es: "Le escribió a Muhammad ibn Ubaydallah sobre lo que Ibn Abbad había acordado, antes de la noche de Adha en Sa'da."
  fr: "Il écrivit à Muhammad ibn Ubaydallah au sujet de ce qu'Ibn Abbad avait convenu, avant la nuit d'Adha à Sa'da."
  tr: "Muhammed ibn Ubeyd Allah'a, Sa'de'deki Ramazan Bayramı gecesinden önce İbn Abbad'ın üzerinde anlaştığı bir mektup yazdı."
  id: "Ia menulis kepada Muhammad ibn Ubayd Allah dengan apa yang disepakati Ibn 'Abbad sebelum malam Idul Fitri di Sa'dah."
