summary:
  ar: "قارئ قرآن إندونيسي من آتشيه، وُلد في سيغلي في 21 سبتمبر 1993، وتخرّج في الهندسة المعمارية بمعهد باندونغ للتكنولوجيا سنة 2015، وكان إمامًا في مسجد سلمان بالمعهد أثناء دراسته ثم في مسجد اللطيف بباندونغ. بلغت قناته على يوتيوب 4,120,000 مشترك و608,396,619 مشاهدة و1,042 مقطعًا بحسب vidIQ كما في 12 نوفمبر 2026، وأسّس منصة نجايلاه لتعليم القرآن."
  en: "Indonesian Qur'an reciter from Aceh, born in Sigli on 21 September 1993; he graduated in architecture from the Bandung Institute of Technology (ITB) in 2015 and served as imam at the institute's Salman Mosque while a student, and afterwards at the Al Lathif Mosque in Bandung. His YouTube channel counted 4,120,000 subscribers, 608,396,619 views and 1,042 videos as read by vidIQ on 12 November 2026, and he founded the Ngajilah.id Qur'an-learning platform."
  ur: "آچے سے تعلق رکھنے والے انڈونیشی قاریِ قرآن، جو 21 ستمبر 1993ء کو سگلی میں پیدا ہوئے؛ انہوں نے 2015ء میں بانڈونگ انسٹی ٹیوٹ آف ٹیکنالوجی (ITB) سے آرکیٹیکچر میں گریجویشن کی اور طالب علمی کے زمانے میں ادارے کی سلمان مسجد کے امام رہے، بعد ازاں بانڈونگ کی مسجد اللطیف میں بھی امامت کی۔ 12 نومبر 2026ء کی vidIQ قرأت کے مطابق ان کے یوٹیوب چینل کے سبسکرائبر 4,120,000، ویوز 608,396,619 اور ویڈیوز 1,042 تھیں، اور انہوں نے قرآن سیکھنے کا پلیٹ فارم Ngajilah.id قائم کیا۔"
  es: "Recitador indonesio del Corán originario de Aceh, nacido en Sigli el 21 de septiembre de 1993. Se graduó en arquitectura en el Instituto Tecnológico de Bandung (ITB) en 2015 y fue imán en la Mezquita Salman del instituto mientras estudiaba, y posteriormente en la Mezquita Al Lathif de Bandung. Su canal de YouTube contaba con 4.120.000 suscriptores, 608.396.619 visualizaciones y 1.042 vídeos, según datos de vidIQ del 12 de noviembre de 2026. Además, fundó la plataforma de aprendizaje del Corán Ngajilah.id."
