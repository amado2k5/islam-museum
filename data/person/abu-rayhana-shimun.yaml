summary:
  ar: "شمعون بن يزيد بن خناقة، أبو ريحانة الأزدي، وقيل الأنصاري، ويقال مولى رسول الله، له صحبة وشهد فتح دمشق. روى عن النبي، وعنه أبو الحصين الهيثم بن شفي ومجاهد بن جبر وشهر بن حوشب. قال ابن حبان: اسمه شمعون، وقيل عبد الله بن النضر، والأول أصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
  en: "Shimun ibn Yazid ibn Khunaqa, Abu Rayhana, a Companion who took part in the conquest of Damascus. He narrated from the Prophet, and Mujahid ibn Jabr and Shahr ibn Hawshab narrated from him. Ibn Hibban noted that his name is given as Shimun, or as Abd Allah ibn al-Nadr, the first being the sounder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
sources: [source/fiqh-mawsua-kuwaitiyya-noor-v3]
