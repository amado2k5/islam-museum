summary:
  ar: "شمعون بن يزيد بن خناقة، أبو ريحانة الأزدي، وقيل الأنصاري، ويقال مولى رسول الله، له صحبة وشهد فتح دمشق. روى عن النبي، وعنه أبو الحصين الهيثم بن شفي ومجاهد بن جبر وشهر بن حوشب. قال ابن حبان: اسمه شمعون، وقيل عبد الله بن النضر، والأول أصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
  en: "Shimun ibn Yazid ibn Khunaqa, Abu Rayhana, a Companion who took part in the conquest of Damascus. He narrated from the Prophet, and Mujahid ibn Jabr and Shahr ibn Hawshab narrated from him. Ibn Hibban noted that his name is given as Shimun, or as Abd Allah ibn al-Nadr, the first being the sounder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
  ur: "شمعون بن یزید بن خنقہ، ابو ریحانہ؛ دمشق کی فتح میں شریک صحابی؛ نبی سے روایت کیا اور مجاہد بن جبر و دیگر نے ان سے روایت کیا۔"
  fr: "Shimun ibn Yazid ibn Khunaqa, Abu Rayhana, Compagnon qui prit part à la conquête de Damas. Il rapporta du Prophète, et Mujahid ibn Jabr et Shahr ibn Hawshab rapportèrent de lui. Ibn Hibban nota que son nom est donné comme Shimun, ou comme Abd Allah ibn al-Nadr, le premier étant le plus sûr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
  es: "Shimun ibn Yazid ibn Khunaqa, Abu Rayhana, un Compañero que participó en la conquista de Damasco. Narró del Profeta, y Mujahid ibn Jabr y Shahr ibn Hawshab narraron de él. Ibn Hibban señaló que su nombre aparece como Shimun o como Abd Allah ibn al-Nadr, siendo el primero el más nítido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
  tr: "Şamun ibn Yezid ibn Hanaka, Ebu Rahmetü'l-Azdi veya el-Ensari olarak da anılır ve rivayete göre Allah Resulü'nün azatlı kölelerinden biriydi. Peygamberin sahabelerindendi ve Şam'ın fethine şahit oldu. Peygamberden hadisler rivayet etti ve Ebu Hüseyin el-Haytham ibn Şafi, Mücahid ibn Cebr ve Şehr ibn Havshab ondan rivayet etmişlerdir. İbn Hibban şöyle demiştir: Adı Şamun'du, ayrıca Abdullah ibn el-Nadr olduğu da söylenir, ancak ilki daha doğrudur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3482}"
  id: "Sham'un ibn Yazid ibn Khanaqah, Abu Rayhanah al-Azdi, atau ada juga yang mengatakan al-Ansari, dan dikatakan bahwa ia adalah seorang budak yang dibebaskan oleh Rasulullah. Ia adalah sahabat Nabi dan menyaksikan penaklukan Damaskus. Ia meriwayatkan hadits dari Nabi, dan Abu al-Husayn al-Haytham ibn Shafi, Mujahid ibn Jabr, dan Shahr ibn Hawshab meriwayatkan darinya. Ibn Hibban berkata: Namanya adalah Sham'un, dan ada juga yang mengatakan bahwa namanya adalah Abdullah ibn al-Nadr, tetapi yang pertama lebih benar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3482}"
