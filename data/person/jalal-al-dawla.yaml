id: person/jalal-al-dawla
class: person
label: { ar: "جلال الدولة أبو طاهر بن بهاء الدولة" }
summary:
  ar: "جلال الدولة أبو طاهر ولد بهاء الدولة بن عضد الدولة، تسلطن سنة ست عشرة وأربعمائة حين مات السلطان شرف الدولة وهو بالبصرة، فخلع على وزيره علم الدين شرف الملك أبي سعيد بن ماكولا، ثم عدل الجند عنه إلى الملك أبي كاليجار فخُطب لهذا ببغداد {cite:shadharat-dhahab p. 204}. وعند ابن الجوزي خُطب لجلال الدولة بعد أخيه مشرف الدولة سنة ٤١٦ بثلاثة ألقاب، وفيها نُهبت الأهواز بجنده ستة عشر يومًا سنة ٤٢١، وطرده الغلمان إلى عكبرا سنة ٤٢٣ فعاد بشفاعة كمال الدولة أبي سنان، ثم أسروه وأهانوه في رمضان ٤٢٤ فنجّده القاعد أبو الوفاء ولجأ إلى دار الشريف المرتضى بالكرخ حتى عادوا يقبلون الأرض {cite:muntazam-ibn-al-jawzi j.8 p.363, 388, 404-410, 414-417}."
  en: "Jalal al-Dawla Abu Tahir, son of Baha' al-Dawla — succeeded at Basra when Sultan Sharaf al-Dawla died in 416, robed his vizier Ibn Makula, then the army defected to Abu Kalijar who was proclaimed at Baghdad {cite:shadharat-dhahab p. 204}."
gender: male
died: { edtf: "1044~", hijri: "0435", calendar: julian, precision: year, status: tradition, derived: true, note: "مات بالخوانق سنة خمس وثلاثين وأربعمائة وعاش اثنتين وخمسين سنة وكانت دولته سبع عشرة سنة وخلّف عشرين ولداً بنين وبنات؛ وولي بعده ابنه الملك العزيز أبو منصور فكاتب ابن عمه أبا كاليجار فخُطب للاثنين معاً {cite:shadharat-dhahab p. 254-255}." }
