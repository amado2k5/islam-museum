id: person/jalal-al-dawla
class: person
label: { ar: "جلال الدولة أبو طاهر بن بهاء الدولة" , ur: "جلال الدولہ", en: "Jalal al-Dawla", es: "Jalal al-Dawla", fr: "Jalal al-Dawla"}
summary:
  ar: "جلال الدولة أبو طاهر ولد بهاء الدولة بن عضد الدولة، تسلطن سنة ست عشرة وأربعمائة حين مات السلطان شرف الدولة وهو بالبصرة، فخلع على وزيره علم الدين شرف الملك أبي سعيد بن ماكولا، ثم عدل الجند عنه إلى الملك أبي كاليجار فخُطب لهذا ببغداد {cite:shadharat-dhahab p. 204}. وعند ابن الجوزي خُطب لجلال الدولة بعد أخيه مشرف الدولة سنة ٤١٦ بثلاثة ألقاب، وفيها نُهبت الأهواز بجنده ستة عشر يومًا سنة ٤٢١، وطرده الغلمان إلى عكبرا سنة ٤٢٣ فعاد بشفاعة كمال الدولة أبي سنان، ثم أسروه وأهانوه في رمضان ٤٢٤ فنجّده القاعد أبو الوفاء ولجأ إلى دار الشريف المرتضى بالكرخ حتى عادوا يقبلون الأرض {cite:muntazam-ibn-al-jawzi j.8 p.363, 388, 404-410, 414-417}. ثم شغب عليه الجند سنة ٤٢٧ فرموه بآجرتين فتلقى إحداهما بيده وخرج نصف الليل إلى دجلة فأغرقوا سميريته تقديرًا أنه فيها ومضى مستترًا إلى دار المرتضى {cite:muntazam-ibn-al-jawzi j.8 p.431}، وفي رمضان ٤٢٩ استُقرئ في ألقابه «شاهنشاه الأعظم ملك الملوك» فأنكر العامة ورموا الخطيب بالآجر {cite:muntazam-ibn-al-jawzi j.8 p.439}، وفي ذي القعدة ٤٣٠ شغب الأتراك لما تأخرت أقساطهم وامتنعت أقواتهم فأبَوا قراءة رقعته وطلبوا وساطة الخليفة، حتى صلى الخطيب يوم عيد الأضحى ببراثا وليس وراءه إلا ثلاثة {cite:muntazam-ibn-al-jawzi j.8 p.446-447}، وخرج يزور المشهدين ماشيًا حافيًا من القير إلى مشهد الحائر ومن الخندق إلى مشهد الكوفة نحو فرسخ {cite:muntazam-ibn-al-jawzi j.8 p.447}. وأُرجف بموته سنة ٤٣٥ فانزعج الناس ونقلوا أموالهم إلى دار الخلافة حتى خرج فتقعّد على كرسي فرآه الناس فسكتوا ثم توفي ليلة الجمعة خامس شعبان ٤٣٥ وغسّله أبو القاسم بن شاهين الواعظ وعبد القادر بن السماك ودُفن بدار الملكة حيث دُفن عضد الدولة وبهاء الدولة، وكانت ولايته ست عشرة سنة وأحد عشر شهرًا وعمره إحدى وخمسون سنة وأشهر وخلف خمس عشرة ابنة وأولادًا ذكورًا {cite:muntazam-ibn-al-jawzi j.8 p.458-460}."
  en: "Jalal al-Dawla Abu Tahir, son of Baha' al-Dawla — succeeded at Basra when Sultan Sharaf al-Dawla died in 416, robed his vizier Ibn Makula, then the army defected to Abu Kalijar who was proclaimed at Baghdad {cite:shadharat-dhahab p. 204}."
  ur: "بہاء الدولہ کا بیٹا اور بویہی حکمران؛ اس کی حکومت بغداد، بصرہ اور ابو کالیجار کے ساتھ اقتدار کی کشمکش سے وابستہ تھی۔ {cite:shadharat-dhahab}"
  es: "Jalal al-Dawla Abu Tahir, hijo de Baha' al-Dawla, triunfó en Basora cuando el sultán Sharaf al-Dawla murió en 416, vistió a su visir Ibn Makula, luego el ejército desertó y se pasó a Abu Kalijar, quien fue proclamado en Bagdad {cita: shadharat-dhahab p. 204}."
  fr: "Jalal al-Dawla Abu Tahir, fils de Baha' al-Dawla — réussit à Bassorah lorsque le sultan Sharaf al-Dawla mourut en 416, revêtit son vizir Ibn Makula, puis l'armée fit défection vers Abu Kalijar qui fut proclamé à Bagdad {cite: shadharat-dhahab p. 204}."
  tr: "Baha'l-Dawla ibn 'Adud al-Dawla'nın oğlu Celal al-Dawla Abu Tahir, Sultan Şeraf al-Dawla'nın Basra'da ölmesiyle dört yüz on altı Hâm yılında iktidara geldi. Veziri Alam al-Din Sharaf al-Malik Abu Sa'id ibn Makula'yı görevden aldı, ardından askerler ondan Kral Abu Kalijar'a geçti ve Kral Abu Kalijar Bağdat'ta vaaz verdi {cite:shadharat-dhahab s. 204}. İbn al-Jawzi'de, kardeşi Müşerref el-Devle'nin ardından 416 Hicri yılında üç unvanla Celal-Devle'ye hitap etti. Bu dönemde Ahvaz, 421 Hicri'nde askerleri tarafından on altı gün boyunca yağmalandı. Çocuklar onu 423 Hicri'de Ekber'e sürdüler, ancak Kamal el-Devle Ebu Sinan'ın aracılığıyla geri döndü. Daha sonra Ramazan 424'te onu yakalayıp küçük düşürdü. El-Kaid Ebu el-Wafa tarafından bulundu ve Karkh'taki el-Şerif el-Murtada'nın evinde sığındı; sonra geri dönerek toprağı öptüler {cite:Muntazam-ibn-al-Jawzi j.8 s.363, 388, 404-410, 414-417}. Sonra askerler 427 Hicri'de onu isyan etti, iki tuğla ile fırlattılar ve o da birini elle aldı. Gece yarısı Dicle'e gitti, orada Sümer topraklarını boğdular, orada olduğunu düşündüler ve el-Murtada'nın evine saklandı {alıntı: Muntazam-ibn-al-Jawzi j.8 s.431}. Ramazan 429'da \"Şahanşah, Kralların Kralı\" unvanlarıyla anıldı, ancak halkı reddetti ve vaizi tuğla ile fırlattı {atıf:Muntazam-ibn-al-Jawzi j.8 s.439}. Zulü Kı'de 430'da, taksitleri gecikince ve yiyecekleri çekilince Türkler isyan etti, bu yüzden mektubunu okumayı reddettiler ve halifenin aracılığını istediler; ta ki vaiz Baratha'da Ramazan Bayramı'nda namaz kılana kadar Arkasında sadece üç tane {cite:muntazam-ibn-al-jawzi J.8 s.446-447} ve iki türbeyi ziyaret etmek için çıplak ayakla topraktan Al-Ha'ir türbesine ve hendekten Kufa türbesine doğru bir farsakh (cite:muntazam-ibn-al-jawzi j.8 s.447} yürür. 435 Hicri'deki ölümü onu sarstı; bu durum halkı rahatsız etti ve servetlerini halifeliğe taşıdı, ta ki ayrılıp bir sandalyeye oturana kadar. Halk onu gördü ve sessiz kaldı. 435 yılının 5'i Cuma gecesi öldü ve Ebu el-Kasım bin Şahin el-Vaiz ile Abdülkadir ibn el-Sammak tarafından yıkandı. Kraliyet sarayında defnedildi; burada 'Adud al-Dawla ve Baha' al-Dawla gömüldü. Saltanatı on altı yıl on bir ay sürdü, elli bir yaş bir aylıktı ve geride on beş kız ve oğul bıraktı {atıf:Muntazam-ibn-al-Jawzi J.8 s.458-460}."
  id: "Jalal al-Dawla Abu Tahir, putra Baha al-Dawla ibn 'Adud al-Dawla, naik ke tampuk kekuasaan pada tahun empat ratus enam belas H ketika Sultan Sharaf al-Dawla wafat di Basra. Ia mencopot wazirnya Alam al-Din Sharaf al-Malik Abu Sa'id ibn Makula, lalu para prajurit pindah darinya ke Raja Abu Kalijar, yang kemudian memberikan khotbah di Baghdad {cite:shadharat-dhahab hlm. 204}. Di Ibn al-Jawzi, ia berbicara kepada Jalal al-Dawla setelah saudaranya Musharraf al-Dawla pada tahun 416 H dengan tiga gelar. Selama waktu ini, Ahvaz dijarah oleh tentaranya selama enam belas hari pada tahun 421 H. Para anak laki-laki mengusirnya ke Akbar pada tahun 423 H, tetapi ia kembali melalui perantaraan Kamal al-Dawla Abu Sinan. Ia kemudian menangkap dan mempermalukannya pada Ramadan 424. Ia ditemukan oleh al-Qa'id Abu al-Wafa dan mencari perlindungan di rumah al-Sharif al-Murtada di Karkh sampai mereka kembali untuk mencium tanah itu {cite:muntazam-ibn-al-jawzi j.8 hlm.363, 388, 404-410, 414-417}. Kemudian para prajurit memberontakkannya pada tahun 427 H, melemparkannya dengan dua batu bata, dan ia menerima salah satunya dengan tangan. Ia pergi pada tengah malam ke Tigris, di mana mereka menenggelamkan tanah Sumeria-nya, memperkirakan itu ada, dan bersembunyi ke rumah al-Murtada {cite:muntazam-ibn-al-jawzi j.8 hlm.431}. Pada Ramadan 429, ia disebut dengan gelar \"Shahanshah yang Agung, Raja segala Raja,\" tetapi ia menolak rakyat biasa dan melemparkan pengkhotbah itu dengan batu bata {cite:muntazam-ibn-al-jawzi j.8 hlm.439}. Dalam Dhu al-Qi'dah 430, orang Turki memberontak ketika pembayaran mereka tertunda dan makanan mereka ditarik, sehingga mereka menolak membaca suratnya dan meminta perantaraan khalifah, sampai pengkhotbah berdoa pada Idul Fitri di Baratha Di belakangnya hanya ada tiga {cite:muntazam-ibn-al-jawzi J.8 hlm.446-447}, dan ia berangkat mengunjungi dua makam itu tanpa alas kaki dari tanah menuju makam Al-Ha'ir, dan dari parit ke makam Kufa menuju farsakh {cite:muntazam-ibn-al-jawzi j.8 hlm.447}. Ia terguncang oleh kematiannya pada tahun 435 H, yang membuat rakyat marah dan memindahkan kekayaan mereka ke kekhalifahan hingga ia pergi dan duduk di kursi. Rakyat melihatnya dan terdiam. Ia meninggal pada malam Jumat, 5 Sha'ban tahun 435, dan dimandikan oleh Abu al-Qasim ibn Shahin al-Wa'iz dan Abd al-Qadir ibn al-Sammak. Ia dimakamkan di istana kerajaan, tempat 'Adud al-Dawla dan Baha' al-Dawla dimakamkan. Masa pemerintahannya berlangsung enam belas tahun sebelas bulan, dan ia berusia lima puluh satu tahun satu bulan, dan ia meninggalkan lima belas putri dan putra {cite:muntazam-ibn-al-jawzi J.8 hlm.458-460}."
