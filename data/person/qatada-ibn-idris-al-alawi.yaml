id: person/qatada-ibn-idris-al-alawi
class: person
label: { ar: "قتادة بن إدريس العلوي أمير مكة" }
summary:
  ar: "أمير مكة شريفاً علوياً حسينياً، اتسعت ولايته من حدود اليمن إلى المدينة وله قلعة ينبع، واستكثر من المماليك وخافه العرب خوفاً عظيماً؛ كان أول ملكه حسن السيرة أزال عنها العبيد المفسدين وحمى البلاد وأحسن إلى الحجاج ثم أساء السيرة وجدد المكوس بمكة ونهب الحاج في بعض السنين، وقيل في موته سنة ثمان عشرة وستمائة إن ابنه الحسن خنقه، وكان يقول الشعر فلما طلب ليحضر عند أمير الحاج كعادة أمراء مكة امتنع فعوتب من بغداد فأجاب بأبيات منها: ما أنا إلا المسك في كل بلدةٍ يضوع وأما عندكم فيضيع {cite:kamil-ibn-al-athir p. 426-427}."
