id: person/qatada-ibn-idris-al-alawi
class: person
label: { ar: "قتادة بن إدريس العلوي أمير مكة" , ur: "قتادہ بن ادریس علوی، امیر مکہ", en: "Qatada ibn Idris al-Alawi, emir of Mecca", es: "Qatada ibn Idris al-Alawi, emir of Mecca", fr: "Qatada ibn Idris al-Alawi, emir of Mecca"}
summary:
  ar: "أمير مكة شريفاً علوياً حسينياً، اتسعت ولايته من حدود اليمن إلى المدينة وله قلعة ينبع، واستكثر من المماليك وخافه العرب خوفاً عظيماً؛ كان أول ملكه حسن السيرة أزال عنها العبيد المفسدين وحمى البلاد وأحسن إلى الحجاج ثم أساء السيرة وجدد المكوس بمكة ونهب الحاج في بعض السنين، وقيل في موته سنة ثمان عشرة وستمائة إن ابنه الحسن خنقه، وكان يقول الشعر فلما طلب ليحضر عند أمير الحاج كعادة أمراء مكة امتنع فعوتب من بغداد فأجاب بأبيات منها: ما أنا إلا المسك في كل بلدةٍ يضوع وأما عندكم فيضيع {cite:kamil-ibn-al-athir p. 426-427}."
  ur: "علوی حسینی شریف اور امیر مکہ جن کی عمل داری یمن کی سرحد سے مدینہ تک پہنچی؛ ابن اثیر ان کی حکومت، حاجیوں پر محصولات اور 618 ہجری میں ان کی وفات کی روایات بیان کرتے ہیں۔ {cite:kamil-ibn-al-athir}"
  en: "An Alid sharif and emir of Mecca whose authority extended from Yemen's borders to Medina; Ibn al-Athir describes his rule, pilgrimage levies and the reports of his death in 618 AH. {cite:kamil-ibn-al-athir}"
  es: "Ibn al-Athir describe su gobierno, los impuestos de peregrinación y los relatos de su muerte en el año 618 de la Hégira. {cite:kamil-ibn-al-athir}"
  fr: "Un chérif alide et émir de La Mecque dont l'autorité s'étendait des frontières du Yémen à Médine; Ibn al-Athir décrit son règne, les taxes du pèlerinage et les récits de sa mort en 618 AH. {cite:kamil-ibn-al-athir}"
  tr: "Mekke Emiri soylu bir Alevi Hüseyni hükümdarıydı. Yönetimi Yemen sınırlarından Medine'ye kadar uzanıyordu ve Yanbu'da bir kalesi vardı. Birçok Memlük kazandı ve Araplar ondan çok korkuyordu. İlk saltanatı iyi niyetliydi; yozlaşmış köleleri uzaklaştırdı, toprağı korudu, hacılara iyi davrandı, sonra kötü davrandı, Mekke'de vergileri yeniledi ve birkaç yıl hacıyı yağmaladı. 1860 yılında öldüğünde oğlu el-Hasan'ın onu boğduğu söylenir. Şiir okudu, ancak Mekke prensleri için gelenek olduğu üzere hacı Emiri huzuruna çıkmak istediğinde reddetti, bu yüzden Bağdat'ı azarlayıp şöyle dizeler söyledi: 'Her şehirde ben sadece misk'im, kayboldum, sana gelince kayboldu.' (alıntı:) Kamil-ibn-al-Athir s. 426-427}."
  id: "Emir Mekah adalah seorang penguasa bangsawan Alawi Husayni. Kekuasaannya membentang dari perbatasan Yaman hingga Madinah, dan ia memiliki benteng di Yanbu. Ia mendapatkan banyak Mamluk, dan orang Arab sangat takut padanya. Masa pemerintahannya yang pertama bersifat baik, ia mengusir budak korup, melindungi tanah, memperlakukan para peziarah dengan baik, lalu berperilaku buruk, memperbarui pajak di Mekah, dan menjarah para peziarah pada beberapa tahun. Konon setelah kematiannya pada tahun 1860, putranya al-Hasan mencekiknya. Ia membacakan puisi, tetapi ketika ia meminta untuk tampil di hadapan Emir peziarah, seperti kebiasaan para pangeran Mekah, ia menolak, sehingga ia menegur Baghdad dan menjawab dengan ayat-ayat seperti: 'Aku hanyalah musk di setiap kota, kota itu hilang, dan untukmu, itu hilang.' {cite:kamil-ibn-al-athir hlm. 426-427}."
