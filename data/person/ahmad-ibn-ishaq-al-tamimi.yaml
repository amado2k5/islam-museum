summary:
  ar: "أحمد بن إسحاق بن عطية بن عبد الله بن سعد، أبو الحسن التميمي الصيدلاني، مقرئ سمع من أبي طاهر المخلص وأبي القاسم الصيدلاني، وكان من آخر القراء المذكورين بحسن الحفظ وإتقان الروايات. من تصانيفه «الواضح في القراءات العشر». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3481}"
  en: "Ahmad ibn Ishaq ibn Atiya, Abu al-Hasan al-Tamimi al-Sayda'lani, a reciter of the Qur'an who heard from Abu Tahir al-Mukhallis and Abu al-Qasim al-Saydalani, noted for his memory and mastery of the transmissions. His work is al-Wadih fi al-qira'at al-'ashr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3481}"
