summary:
  ar: "أحمد بن إسحاق بن عطية بن عبد الله بن سعد، أبو الحسن التميمي الصيدلاني، مقرئ سمع من أبي طاهر المخلص وأبي القاسم الصيدلاني، وكان من آخر القراء المذكورين بحسن الحفظ وإتقان الروايات. من تصانيفه «الواضح في القراءات العشر». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3481}"
  en: "Ahmad ibn Ishaq ibn Atiya, Abu al-Hasan al-Tamimi al-Sayda'lani, a reciter of the Qur'an who heard from Abu Tahir al-Mukhallis and Abu al-Qasim al-Saydalani, noted for his memory and mastery of the transmissions. His work is al-Wadih fi al-qira'at al-'ashr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3481}"
  fr: "Ahmad ibn Ishaq ibn Atiya, Abu al-Hasan al-Tamimi al-Sayda'lani, récitant du Coran qui entendit Abu Tahir al-Mukhallis et Abu al-Qasim al-Saydalani, connu pour sa mémoire et sa maîtrise des transmissions. Son œuvre est al-Wadih fi al-qira'at al-'ashr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3481}"
  es: "Ahmad ibn Ishaq ibn Atiya, Abu al-Hasan al-Tamimi al-Sayda'lani, un recitador del Corán que escuchó a Abu Tahir al-Mukhallis y Abu al-Qasim al-Saydalani, destacado por su memoria y dominio de las transmisiones. Su obra es al-Wadih fi al-qira'at al-'ashr. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3481}"
  ur: "احمد بن اسحاق بن عطیہ، ابو الحسن التمیمی السیدالانی، قرآن کے ایک قاری جنہوں نے ابو طاہر المخلیس اور ابو القاسم السیدالانی سے سنا، اپنی یادداشت اور نشریات میں مہارت کے لیے مشہور ہے۔ ان کا کام الوادیۃ فی القراءۃ العشر ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3481}"
