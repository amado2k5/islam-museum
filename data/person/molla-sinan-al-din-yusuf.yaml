summary:
  ar: "الملا سنان الدين يوسف بن خضر بك الحنفي؛ قال في الشقائق كان فاضلاً كثير الاطلاع على العلوم عقلياتها وشرعياتها وداني الذل للغاية يتوقد ذكاء وفطنة وكان لحدة ذهنه وقوة فطنته غلب على طبعه إيراد الشكوك والشبهات وقلما يلتفت إلى تحقيق المسائل حتى إن والده لامه على ذلك وقال له يوماً وهو يأكل معه لحماً بلغ بك الشك إلى مرتبة يمكن أن تشك في أن هذا الظرف من نحاس قال يمكن ذلك لأن للحواس أغاليط فغضب والده وضرب بالطبق رأسه، ولما مات والده كان مناهزاً للعشرين سنة فأعطاه السلطان محمد إحدى المدارس الثمان ثم أعطاه دار الحديث بأدرنة ثم جعله معلماً لنفسه ومال إلى صحبته وكان لا يفارقه ولما جاء المولى علي القوشجي أخذ عنه العلوم الرياضية ولازمه بإشارة من السلطان محمد وكتب حواشي على شرح الجغميني لقاضي زاده ثم جعله السلطان محمد وزيراً في سنة خمس وسبعين ثم وقع بينه وبين السلطان أمر كان سبباً لعزله وحبسه فاجتمع علماء البلدة وقالوا لابد من إطلاقه وإلا نحرق كتبنا في الديوان العالي ونترك ملكك فأخرج وسلم إليهم فأعطاه قضاء سفلي حصار مع مدرسته، توفي في حدود سنة إحدى وتسعين وثمانمائة {cite:shadharat-dhahab p. 351-352}."
  en: "Molla Sinan al-Din — Khidr Beg's brilliant, doubt-prone son (his father struck him with a plate when he conceded he might doubt the dish was copper); Mehmed II's teacher and favourite, 'Ali al-Qushji's pupil in mathematics, vizier in 875, then disgraced until the ulama threatened to burn their books in the Divan; died ~891 {cite:shadharat-dhahab p. 351-352}."
  es: "Molla Sinan al-Din — Hijo brillante y propenso a las dudas de Khidr Beg (su padre lo golpeó con un plato cuando admitió que podría dudar de que el plato fuera de cobre); maestro y favorito de Mehmed II, alumno de matemáticas de 'Ali al-Qushji, visir en 875, luego deshonrado hasta que los ulemas amenazaron con quemar sus libros en el Diván; murió alrededor de 891 {cita: shadharat-dhahab pág. 351-352}."
  fr: "Molla Sinan al-Din — fils brillant et sujet au doute de Khidr Beg (son père l'a frappé avec une assiette lorsqu'il a admis qu'il pouvait douter que le plat soit en cuivre); professeur et favori de Mehmed II, élève d'Ali al-Qushji en mathématiques, vizir en 875, puis déshonoré jusqu'à ce que les oulémas menacent de brûler leurs livres dans le Divan; mort vers 891 {cite: shadharat-dhahab p. 351-352}."
  ur: "مولا سنان الدین — خضر بیگ کا ہونہار، شکوک و شبہات کا شکار بیٹا ⁦(اس کے والد نے اسے ایک پلیٹ سے مارا جب اس نے اعتراف کیا کہ اسے شک ہے کہ برتن تانبے کا ہے)⁩؛ محمد ثانی کے استاد اور پسندیدہ، ریاضی میں علی القشجی کے شاگرد، 875 میں وزیر، پھر اس وقت تک ذلیل ہوئے جب تک کہ علماء نے دیوان میں ان کی کتابوں کو جلانے کی دھمکی نہ دی۔ وفات ~ 891 {حوالہ: شدھارت ذہاب صفحہ۔ 351-352}۔"
  tr: "Mele Sinan al-Din Yusuf bin Hidr Bey al-Hanafi şöyle demiştir: O, erdemli bir adamdı, bilimler, onların mantıkları ve hukuki hükümleri hakkında çok bilgiliydi ve son derece alçakgönüllüydü. Zekası keskin ve keskin bir sezgiye sahipti. Keskin zekâsı ve güçlü sezgisi onu şüphelere ve şüphelere açık hale getirdi, nadiren meseleleri araştırmaya dikkat etti. Babası bile bunu suçladı. Bir gün ona et yerken dedi ki, bu durumun bakırdan yapıldığını düşünecek kadar şüphe duyuyordu. 'Belki de duyuların hataları olduğu içindir.' dedi. Öfkelendi. Babası kafasına bir tepsi vurdu. Babası öldüğünde yaklaşık yirmi yaşındaydı. Sultan Muhammed ona sekiz okuldan birini verdi, ardından Edirne'de Dar al-Hadis'i verdi, öğretmeni yaptı ve o da onun arkadaşlığına yöneldi, onu hiç bırakmadı. Mevlay Ali Kuşji geldiğinde, ondan matematik öğrendi ve Sultan Muhammed'in talimatıyla onunla kaldı. El-Cagmini'nin Kadi Zada üzerine yorumuna kenar notları yazdı. Sultan Muhammed onu yetmiş beşinci yılda bakan olarak atadı. Sonra, kendisiyle sultan arasında bir anlaşmazlık çıktı ve bu da onun görevden alınmasına ve hapsedilmesine yol açtı, bu yüzden kasabanın alimleri toplandı. Onlar, 'Serbest bırakılmalı, yoksa yüksek mahkemede kitaplarımızı yakar ve krallığından ayrılırız.' dediler. Bunun üzerine çıkarıldı ve okuluyla birlikte Hisar'ın alt bölgesini onlara verdiler. Yaklaşık 891 Hicri yılında öldü {kaynak: shadharat-dhahab, s. 351-352}."
  id: "Mulla Sinan al-Din Yusuf ibn Khidr Bey al-Hanafi berkata: Dia adalah orang yang berbudi luhur, sangat berpengetahuan tentang ilmu pengetahuan, rasionalitasnya, dan putusan hukumnya, dan dia sangat rendah hati. Dia tajam dalam kecerdasan dan wawasan tajam. Ketajaman pikiran dan wawasan tajamnya membuatnya mudah ragu dan curiga, dan dia jarang memperhatikan penyelidikan masalah. Ayahnya bahkan menyalahkannya atas hal itu. Suatu hari dia berkata kepadanya, saat makan daging bersamanya, dia meragukannya sampai meragukannya sampai dia bisa meragukan bahwa keadaan ini terbuat dari tembaga. Dia berkata, 'Mungkin karena indra memiliki kesalahan.' Dia menjadi marah. Ayahnya memukul kepalanya dengan piring. Ketika ayahnya meninggal, ia berusia sekitar dua puluh tahun. Sultan Muhammad memberinya salah satu dari delapan sekolah, lalu memberinya Dar al-Hadith di Edirne, kemudian menjadikannya guru, dan ia condong ke kelompoknya dan tidak pernah meninggalkannya. Ketika Mawlay Ali al-Qushji datang, ia belajar matematika darinya dan tinggal bersamanya atas arahan Sultan Muhammad. Ia menulis catatan pinggir tentang komentar al-Jaghmini tentang Qadi Zada. Sultan Muhammad mengangkatnya sebagai menteri pada tahun tujuh puluh lima. Kemudian, terjadi perselisihan antara ia dan sultan yang menyebabkan pemecatan dan penahanannya, sehingga para ulama kota berkumpul. Mereka berkata, 'Dia harus dibebaskan, atau kami akan membakar buku-buku kami di pengadilan tinggi dan meninggalkan kerajaanmu.' Maka dia dibawa keluar dan diserahkan kepada mereka, yang memberinya distrik bawah Hisar beserta sekolahnya. Dia meninggal sekitar tahun 891 H {cite:shadharat-dhahab, hlm. 351-352}."
