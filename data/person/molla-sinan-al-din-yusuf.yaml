summary:
  ar: "الملا سنان الدين يوسف بن خضر بك الحنفي؛ قال في الشقائق كان فاضلاً كثير الاطلاع على العلوم عقلياتها وشرعياتها وداني الذل للغاية يتوقد ذكاء وفطنة وكان لحدة ذهنه وقوة فطنته غلب على طبعه إيراد الشكوك والشبهات وقلما يلتفت إلى تحقيق المسائل حتى إن والده لامه على ذلك وقال له يوماً وهو يأكل معه لحماً بلغ بك الشك إلى مرتبة يمكن أن تشك في أن هذا الظرف من نحاس قال يمكن ذلك لأن للحواس أغاليط فغضب والده وضرب بالطبق رأسه، ولما مات والده كان مناهزاً للعشرين سنة فأعطاه السلطان محمد إحدى المدارس الثمان ثم أعطاه دار الحديث بأدرنة ثم جعله معلماً لنفسه ومال إلى صحبته وكان لا يفارقه ولما جاء المولى علي القوشجي أخذ عنه العلوم الرياضية ولازمه بإشارة من السلطان محمد وكتب حواشي على شرح الجغميني لقاضي زاده ثم جعله السلطان محمد وزيراً في سنة خمس وسبعين ثم وقع بينه وبين السلطان أمر كان سبباً لعزله وحبسه فاجتمع علماء البلدة وقالوا لابد من إطلاقه وإلا نحرق كتبنا في الديوان العالي ونترك ملكك فأخرج وسلم إليهم فأعطاه قضاء سفلي حصار مع مدرسته، توفي في حدود سنة إحدى وتسعين وثمانمائة {cite:shadharat-dhahab p. 351-352}."
  en: "Molla Sinan al-Din — Khidr Beg's brilliant, doubt-prone son (his father struck him with a plate when he conceded he might doubt the dish was copper); Mehmed II's teacher and favourite, 'Ali al-Qushji's pupil in mathematics, vizier in 875, then disgraced until the ulama threatened to burn their books in the Divan; died ~891 {cite:shadharat-dhahab p. 351-352}."
