label: { ar: "حنظلة بن صفوان الكلبي" }
summary:
  ar: "عند البلاذري: أخو بشر بن صفوان — وفي نسخة «أبو بشر» — ولّي إفريقية بعد كلثوم بن عياض فقاتل الخوارج وتوفي هناك وهو والٍ وانصرف عنه عبد الرحمن بن حبيب الفهري حين خالف على الوليد بن يزيد. ويذكر الكتاب أن هشاماً أعاده إلى إمرة مصر للمرة الثانية سنة 119هـ، ثم أرسله إلى إفريقية سنة 124هـ بعد مقتل كلثوم بن عياض القشيري. {cite:salabi-umayyad-state-2020 p.485}"
  en: "In al-Baladhuri: brother of Bishr ibn Safwan — one copy has 'father of Bishr' — appointed over Ifriqiya after Kulthum ibn Iyad; he fought the Khawarij and died there in office, Abd al-Rahman ibn Habib al-Fihri withdrawing from him when he opposed al-Walid ibn Yazid."
