id: person/hanzala-ibn-safwan-al-kalbi
class: person
label: { ar: "حنظلة بن صفوان الكلبي" }
summary:
  ar: "عند البلاذري: أخو بشر بن صفوان — وفي نسخة «أبو بشر» — ولّي إفريقية بعد كلثوم بن عياض فقاتل الخوارج وتوفي هناك وهو والٍ وانصرف عنه عبد الرحمن بن حبيب الفهري حين خالف على الوليد بن يزيد. ويذكر الكتاب أن هشاماً أعاده إلى إمرة مصر للمرة الثانية سنة 119هـ، ثم أرسله إلى إفريقية سنة 124هـ بعد مقتل كلثوم بن عياض القشيري. {cite:salabi-umayyad-state-2020 p.485}"
  en: "In al-Baladhuri: brother of Bishr ibn Safwan — one copy has 'father of Bishr' — appointed over Ifriqiya after Kulthum ibn Iyad; he fought the Khawarij and died there in office, Abd al-Rahman ibn Habib al-Fihri withdrawing from him when he opposed al-Walid ibn Yazid."
  es: "En al-Baladhuri: hermano de Bishr ibn Safwan —una copia dice 'padre de Bishr'— fue nombrado jefe de Ifriqiya después de Kulthum ibn Iyad; luchó contra los Khawarij y murió allí en el cargo, Abd al-Rahman ibn Habib al-Fihri se retiró de él cuando se opuso a al-Walid ibn Yazid."
  fr: "Dans al-Baladhuri: frère de Bishr ibn Safwan — une copie porte la mention « père de Bishr » — nommé à la tête d'Ifriqiya après Kulthum ibn Iyad; il combattit les Kharijites et mourut en fonction, Abd al-Rahman ibn Habib al-Fihri se retirant de lui lorsqu'il s'opposa à al-Walid ibn Yazid."
  ur: "البلادوری میں: بشر بن صفوان کے بھائی - ایک نقل میں 'بشر کا باپ' ہے - کلثوم ابن عیاض کے بعد عفریقیہ پر مقرر کیا گیا ہے۔ اس نے خوارج سے جنگ کی اور وہیں عہدہ پر مر گیا، عبدالرحمٰن بن حبیب الفہری اس سے دستبردار ہو گئے جب اس نے الولید بن یزید کی مخالفت کی۔"
  tr: "El-Baladhuri'ye göre: O, Bişr bin Safvan'ın kardeşiydi — ve 'Ebu Bişr' versiyonunda — Kultum bin İyad'dan sonra İfrikiye valisi olmuştur. Haricilerle savaşmış ve orada vali olarak ölmüştür; Abdülrahman ibn Habib el-Fihri, el-Velid bin Yezid'e karşı çıktığında ondan ayrılmıştır. Kitapta, Hişam'ın onu 119 Hicri'de ikinci kez Mısır valiliğine geri getirdiği, ardından 124 Hicri yılında Kultum bin İyad-el-Kuşayri'nin öldürülmesinden sonra İfrikiye'ye gönderdiği belirtilir. {cite:Selabi-Umayyad-devlet-2020 s.485}"
  id: "Menurut al-Baladhuri: Ia adalah saudara Bishr ibn Safwan — dan dalam versi 'Abu Bishr' — ia adalah gubernur Ifriqiya setelah Kulthum ibn Iyad. Ia melawan Kharijit dan meninggal di sana sebagai gubernur, dan Abd al-Rahman ibn Habib al-Fihri membelot darinya ketika ia menentang al-Walid ibn Yazid. Buku tersebut menyebutkan bahwa Hisham mengembalikannya kembali menjadi gubernur Mesir untuk kedua kalinya pada tahun 119 H, lalu mengirimnya ke Ifriqiya pada tahun 124 H setelah pembunuhan Kulthum ibn Iyad al-Qushayri. {sitasi:Negara-Salabi-Umayyad-2020 hlm.485}"
