id: person/abu-bakr-ibn-al-pahlawan
class: person
label: { ar: "أبو بكر بن البهلوان", en: "Abu Bakr ibn al-Pahlawan", fr: "Abu Bakr ibn al-Pahlawan", es: "Abu Bakr ibn al-Pahlawan", ur: "ابوبکر ابن پہلوان" }
summary:
  ar: "الأمير أبو بكر بن البهلوان صاحب أذربيجان، آخر أتابكة الإلدكزية بها؛ يذكر ابن الأثير أنه كان مشغولاً بالشرب ليلاً ونهاراً لا يفيق ولا ينظر في أمر مملكته ورعيته، فأهمل ثغوره حتى استولى الكرج على دوين سنة تسع وتسعين وخمسمائة وأكثروا في أهلها {cite:kamil-ibn-al-athir p. 283-284}."
  en: "Last Eldiguzid Atabeg of Azerbaijan — in Ibn al-Athir's portrait a ruler 'occupied with drink night and day' who ignored his frontiers until the Georgians stormed Dvin in 599 {cite:kamil-ibn-al-athir p. 283-284}."
  fr: "Dernier atabeg ildeguzide d'Azerbaïdjan — dans le portrait d'Ibn al-Athir, un souverain « occupé à boire nuit et jour » qui négligea ses frontières jusqu'à ce que les Géorgiens prennent d'assaut Dvin en 599 {cite:kamil-ibn-al-athir p. 283-284}."
  es: "Último Atabeg Eldiguzid de Azerbaiyán: en el retrato de Ibn al-Athir, un gobernante \"ocupado con la bebida día y noche\" que ignoró sus fronteras hasta que los georgianos asaltaron Dvin en 599 {cite:kamil-ibn-al-athir p. 283-284}."
  ur: "آذربائیجان کا آخری الدیگوزید اطابیگ - ابن الثیر کی تصویر میں ایک حکمران 'رات دن شراب پینے میں مصروف' ہے جس نے اپنی سرحدوں کو نظر انداز کیا یہاں تک کہ جارجیائیوں نے 599 میں ڈیوین پر حملہ کر دیا۔ 283-284}۔"
  tr: "Azerbaycan hükümdarı ve oradaki İldegiziya Atabeglerinin sonuncusu olan Prens Ebu Bekir ibn el-Bahlavan hakkında İbn el-Athir, onun gece gündüz içki içmekle meşgul olduğunu, asla uyanmadığını ve krallığının ve tebaasının işleriyle ilgilenmediğini, bu yüzden sınırlarını ihmal ettiğini ve Gürcülerin Hicri 599 yılında Dvin'i ele geçirip halkı arasında çoğalmasına kadar bu durumun devam ettiğini belirtir. {kaynak: Kamil İbn el-Athir, s. 283-284}"
  id: "Pangeran Abu Bakr ibn al-Bahlawan, penguasa Azerbaijan, Atabeg terakhir dari Ildegizia di sana; Ibn al-Athir menyebutkan bahwa ia sibuk minum siang dan malam, tidak pernah bangun atau memperhatikan urusan kerajaannya dan rakyatnya, sehingga ia mengabaikan perbatasannya sampai bangsa Georgia merebut Dvin pada tahun 599 H dan berkembang biak di antara penduduknya {kutip:kamil-ibn-al-athir hlm. 283-284}."
