summary:
  ar: "أبو سعد عبد الله بن أبي السري محمد بن هبة الله بن مطهر بن علي بن أبي عصرون التميمي الحديثي ثم الموصلي، شرف الدين ابن أبي عصرون؛ الفقيه الشافعي من أعيان الفقهاء وفضلاء عصره؛ تفقه على القاضي المرتضى الشهرزوري وأسعد الميهني وأبي الفتح ابن برهان، ودرس بالموصل وبحلب وبالزاوية الغربية من جامع دمشق، وتولى القضاء بسنجار ونصيبين وحران ثم بدمشق سنة ثلاث وسبعين وخمسمائة؛ تعين بالشام وتقدم عند نور الدين وبنى له المدارس بحلب وحماة وحمص وبعلبك؛ صنف صفوة المذهب من نهاية المطلب في سبع مجلدات والانتصار والمرشد والتيسير في الخلاف {cite:wafayat-ayan}."
  en: "Sharaf al-Din Ibn Abi Asrun (492–585) — leading Shafi'i jurist of Mosul, Aleppo and Damascus under Nur al-Din; qadi of several cities and finally of Damascus; author of Safwat al-Madhhab in seven volumes and other works {cite:wafayat-ayan}."
