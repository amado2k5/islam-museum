summary:
  ar: "أبو سعد عبد الله بن أبي السري محمد بن هبة الله بن مطهر بن علي بن أبي عصرون التميمي الحديثي ثم الموصلي، شرف الدين ابن أبي عصرون؛ الفقيه الشافعي من أعيان الفقهاء وفضلاء عصره؛ تفقه على القاضي المرتضى الشهرزوري وأسعد الميهني وأبي الفتح ابن برهان، ودرس بالموصل وبحلب وبالزاوية الغربية من جامع دمشق، وتولى القضاء بسنجار ونصيبين وحران ثم بدمشق سنة ثلاث وسبعين وخمسمائة؛ تعين بالشام وتقدم عند نور الدين وبنى له المدارس بحلب وحماة وحمص وبعلبك؛ صنف صفوة المذهب من نهاية المطلب في سبع مجلدات والانتصار والمرشد والتيسير في الخلاف {cite:wafayat-ayan}."
  en: "Sharaf al-Din Ibn Abi Asrun (492–585) — leading Shafi'i jurist of Mosul, Aleppo and Damascus under Nur al-Din; qadi of several cities and finally of Damascus; author of Safwat al-Madhhab in seven volumes and other works {cite:wafayat-ayan}."
  es: "Sharaf al-Din Ibn Abi Asrun (492–585), destacado jurista shafi'i de Mosul, Alepo y Damasco bajo Nur al-Din; cadí de varias ciudades y finalmente de Damasco; autor de Safwat al-Madhhab en siete volúmenes y otras obras {citar:wafayat-ayan}."
  fr: "Sharaf al-Din Ibn Abi Asrun (492-585) — éminent juriste shafi'ite de Mossoul, Alep et Damas sous Nur al-Din; cadi de plusieurs villes et enfin de Damas; auteur de Safwat al-Madhhab en sept volumes et d'autres ouvrages {cite: wafayat-ayan}."
  ur: "شرف الدین ابن ابی عصرون (492-585) - نورالدین کے ماتحت موصل، حلب اور دمشق کے معروف شافعی فقیہ؛ کئی شہروں کی قضا اور آخر میں دمشق۔ سات جلدوں اور دیگر تصانیف میں صفوت المذہب کے مصنف۔"
  tr: "Ebu Said Abdullah ibn Abi el-Sari Muhammed ibn Hibatullah ibn Mutahhar ibn Ali ibn Abi Asrun al-Tamimi al-Hadithi (o zamanlar el-Mevsili), Şeraf al-Din ibn Abi Asrun; Şafii fıkıh döneminin önde gelen hukukçularından ve erdemli figürlerinden biriydi. Yargıç el-Murtada el-Şehrazuri, As'ad el-Mihani ve Ebu el-Feth ibn Burhan'dan fıkıh eğitimi aldı. Musul, Halep ve batı Zhâh'ta ders verdi Şam Camii'nin awiyası. Sincar, Nisibi ve Harran'da yargıç olarak görev yaptı, ardından 573 Hicri yılında Şam'da görev yaptı. Levant'ta görevlendirildi, Nur al-Din'in emrinde ilerledi ve Halep, Hama, Homs ve Baalbek'te onun için okullar kurdu. Yedi ciltlik Safwat al-Madhhab min Nihayat al-Muttalib ile Al-Intisar, Al-Murmurşid ve Al-Taysir fi al-Khilaf adlı eserleri kaleme aldı. Wafayat-ayan}."
  id: "Abu Sa'd Abdullah ibn Abi al-Sari Muhammad ibn Hibatullah ibn Mutahhar ibn Ali ibn Abi Asrun al-Tamimi al-Hadithi kemudian al-Mawsili, Sharaf al-Din ibn Abi Asrun; ahli hukum Shafi'i ini adalah salah satu ahli hukum terkemuka dan tokoh berbudi luhur pada zamannya. Ia mempelajari hukum di bawah bimbingan Hakim al-Murtada al-Shahrazuri, As'ad al-Mihani, dan Abu al-Fath ibn Burhan. Ia mengajar di Mosul, Aleppo, dan zawiya barat Masjid Damaskus. Ia menjabat sebagai hakim di Sinjar, Nisibi, dan Harran, kemudian di Damaskus pada tahun 573 H. Ia diangkat di Levant, naik di bawah Nur al-Din, dan mendirikan sekolah-sekolah untuknya di Aleppo, Hama, Homs, dan Baalbek. Ia menulis Safwat al-Madhhab min Nihayat al-Muttalib dalam tujuh jilid, serta Al-Intisar, Al-Murmurshid, dan Al-Taysir fi al-Khilaf {cite:Wafayat-Ayan}."
