summary:
  ar: موسيقي طارقي نيجري وُلد سنة 1984؛ طوّر غيتار الطوارق بإدخال تأثيرات إلكترونية، وأصدر ألبومات منها «أفريكا فيكتيم» و«جِنازة للنائمين»، ومثّل في فيلم «أكودوغان».
  en: Tuareg musician from Niger born in 1984; he pushed Tuareg guitar into electronic territory on albums such as Afrique Victime and Funeral for Justice, and starred in the Saharan film Akounak Tedalat
    Taha Tazoughai.
