    ادا کیا۔
  es: "Músico tuareg originario de Níger, nacido en 1984; llevó la guitarra tuareg al terreno electrónico en álbumes como Afrique Victime y Funeral for Justice, y protagonizó la película sahariana Akounak Tedalat Taha Tazoughai."
  fr: "Musicien touareg du Niger né en 1984; il a poussé la guitare touareg dans le territoire électronique sur des albums tels que Afrique Victime et Funeral for Justice, et a joué dans le film saharien Akounak Tedalat Taha Tazoughai."
