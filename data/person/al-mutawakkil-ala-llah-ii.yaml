id: person/al-mutawakkil-ala-llah-ii
class: person
label: { ar: "المتوكل على الله الثاني عبد العزيز بن يعقوب" }
summary:
  ar: "خليفة القاهرة [٨٨٤–٩٠٣هـ]، أبو العز عبد العزيز بن يعقوب بن المتوكل، ولد سنة تسع عشرة وثمان مئة وأمه بنت جندي حاج ملك ولم يل والده الخلافة، نشأ معظماً محبوباً للخاصة والعامة لخصاله الجميلة وتواضعه وكثرة أدبه وله اشتغال بالعلم قرأ على والد المؤلف وغيره وزوجه عمه المستكفي بابنته فأولدها ولداً صالحاً فهو هاشمي بين هاشميين، بويع بالخلافة يوم الاثنين سادس عشري المحرم سنة أربع وثمانين بحضرة السلطان والقضاة وكان يوماً مشهوداً، وفي أيامه حج قايتباي برسم الحج وهو أمر لم يعهد لملك من أكثر من مئة سنة وفرق بالمدينة ستة آلاف دينار وبمكة خمسة، مات المتوكل يوم الأربعاء سلخ المحرم سنة ثلاث وتسع مئة وعهد بالخلافة لابنه يعقوب ولقبه المستمسك بالله {cite:tarikh-khulafa-minhaj-1434 p. 778-780}."
  en: "Cairo caliph [884–903] — a Hashimi between Hashimis, who read hadith with the author's father; hailed in the sultan's presence 16 Muharram 884. In his reign Qaytbay made the hajj no sultan had made for over a century; he died Wednesday, last of Muharram 903, naming his son Ya'qub al-Mustamsik {cite:tarikh-khulafa-minhaj-1434 p. 778-780}."
