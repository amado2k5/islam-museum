id: person/al-mutawakkil-ala-llah-ii
class: person
label: { ar: "المتوكل على الله الثاني عبد العزيز بن يعقوب", en: "al-Mutawakkil ala Allah II, Abd al-Aziz ibn Ya'qub", fr: "al-Mutawakkil ala Allah II, Abd al-Aziz ibn Ya'qub", es: "al-Mutawakkil ala Allah II, Abd al-Aziz ibn Ya'qub", ur: "المتوکل علی اللہ ثانی، عبد العزیز ابن یعقوب" }
summary:
  ar: "خليفة القاهرة [٨٨٤–٩٠٣هـ]، أبو العز عبد العزيز بن يعقوب بن المتوكل، ولد سنة تسع عشرة وثمان مئة وأمه بنت جندي حاج ملك ولم يل والده الخلافة، نشأ معظماً محبوباً للخاصة والعامة لخصاله الجميلة وتواضعه وكثرة أدبه وله اشتغال بالعلم قرأ على والد المؤلف وغيره وزوجه عمه المستكفي بابنته فأولدها ولداً صالحاً فهو هاشمي بين هاشميين، بويع بالخلافة يوم الاثنين سادس عشري المحرم سنة أربع وثمانين بحضرة السلطان والقضاة وكان يوماً مشهوداً، وفي أيامه حج قايتباي برسم الحج وهو أمر لم يعهد لملك من أكثر من مئة سنة وفرق بالمدينة ستة آلاف دينار وبمكة خمسة، مات المتوكل يوم الأربعاء سلخ المحرم سنة ثلاث وتسع مئة وعهد بالخلافة لابنه يعقوب ولقبه المستمسك بالله {cite:tarikh-khulafa-minhaj-1434 p. 778-780}."
  en: "Cairo caliph [884–903] — a Hashimi between Hashimis, who read hadith with the author's father; hailed in the sultan's presence 16 Muharram 884. In his reign Qaytbay made the hajj no sultan had made for over a century; he died Wednesday, last of Muharram 903, naming his son Ya'qub al-Mustamsik {cite:tarikh-khulafa-minhaj-1434 p. 778-780}."
  fr: "Le Caire calife [884-903] – un Hashimi entre Hashimis, qui a lu des hadiths avec le père de l'auteur ; En présence du sultan, 16 Muharram 884. Dans son règne Qaytbay a fait le hajj qu'aucun sultan avait fait depuis plus d'un siècle ; il est mort mercredi, dernier de Muharram 903, nommant son fils Ya'qub al-Mustamsik {cite:tarikh-khulafa-minhaj-1434 p. 778-780}."
  es: "Califa de El Cairo [884–903] — un Hashimi entre Hashimis, que leía hadices con el padre del autor; aclamado en presencia del sultán el 16 de Muharram de 884. Durante su reinado, Qaytbay realizó el Hajj que ningún sultán había realizado en más de un siglo; murió el miércoles, último día de Muharram de 903, nombrando a su hijo Ya'qub al-Mustamsik {cite:tarikh-khulafa-minhaj-1434 p. 778-780}."
  ur: "قاہرہ خلیفہ [884-903] - ہاشمیوں کے درمیان ایک ہاشمی، جو مصنف کے والد کے ساتھ حدیث پڑھتا ہے۔ سلطان کی موجودگی میں 16 محرم 884 کو خوش آمدید کہا گیا۔ قیتبے نے اپنے دور حکومت میں وہ حج کیا جو ایک صدی سے زیادہ عرصے سے کسی سلطان نے نہیں کیا تھا۔ ان کا انتقال بدھ، آخری محرم 903، اپنے بیٹے کا نام یعقوب المستمسک رکھا۔ 778-780}۔"
