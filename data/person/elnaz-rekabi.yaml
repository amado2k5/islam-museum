summary:
  ar: "متسلقة إيرانية، وُلدت في زنجان سنة 1989. فازت ببرونزية المسابقة المجمّعة في بطولة العالم 2021 وبثلاث ميداليات في البطولات الآسيوية. وفي أكتوبر 2022 نافست في نهائي بطولة آسيا في سيول دون غطاء رأس، أثناء احتجاجات مهسا أميني؛ وقالت في توضيح نشرته إن الغطاء سقط سهواً، بينما نقلت بي بي سي لاحقاً عن مصدر مطّلع أن بيانها صدر تحت الضغط."
  en: "Iranian competition climber, born in Zanjan in 1989. She won bronze in the combined event at the 2021 World Championships and three medals at the Asian Championships. In October 2022 she competed in the Asian Championships final in Seoul without a headscarf, during the Mahsa Amini protests; her own posted explanation said the scarf had fallen off inadvertently, while the BBC later reported, citing an informed source, that her statement had been made under pressure."
  ur: "ایرانی مقابلہ جاتی کوہ پیما، 1989 میں زنجان میں پیدا ہوئیں۔ انہوں نے 2021 کی عالمی چیمپئن شپ کے مرکب مقابلے میں کانسی اور ایشیائی چیمپئن شپ میں تین تمغے جیتے۔ اکتوبر 2022 میں انہوں نے سیول میں ایشیائی چیمپئن شپ کے فائنل میں سر ڈھانپے بغیر حصہ لیا، مہسا امینی احتجاج کے دنوں میں؛ ان کی اپنی شائع کردہ وضاحت کے مطابق اسکارف اتفاقاً گر گیا تھا، جبکہ بی بی سی نے بعد میں ایک باخبر ذریعے کے حوالے سے کہا کہ ان کا بیان دباؤ کے تحت دیا گیا تھا۔"
  es: "Escaladora iraní, nacida en Zanjan en 1989. Ganó la medalla de bronce en la prueba combinada en el Campeonato Mundial de 2021 y tres medallas en el Campeonato Asiático. En octubre de 2022, compitió en la final del Campeonato Asiático en Seúl sin velo, durante las protestas de Mahsa Amini; su propia explicación publicada decía que el velo se le había caído accidentalmente, mientras que la BBC informó posteriormente, citando una fuente informada, que su declaración había sido hecha bajo presión."
  fr: "Grimpeuse iranienne de compétition, née à Zanjan en 1989, elle a remporté la médaille de bronze au combiné aux Championnats du monde de 2021 et trois médailles aux Championnats d'Asie. En octobre 2022, elle a participé à la finale des Championnats d'Asie à Séoul sans foulard, en pleine période de manifestations suite au décès de Mahsa Amini. Dans une explication publiée sur les réseaux sociaux, elle a déclaré que son foulard était tombé accidentellement, tandis que la BBC a rapporté par la suite, citant une source bien informée, que sa déclaration avait été faite sous la pression."
  tr: "1989 yılında Zancan doğumlu İranlı bir dağcı. 2021 Dünya Şampiyonası'nda birleşik branşta bronz, Asya Şampiyonası'nda ise üç madalya kazandı. Ekim 2022'de, Mahsa Amini'nin protestoları sırasında başörtüsüz olarak Seul'de düzenlenen Asya Şampiyonası finalinde yarıştı; kapağın yanlışlıkla düştüğünü açıkladı, BBC ise daha sonra bilgili bir kaynağa açıklamasının baskı altında verildiğini aktardı."
  id: "Seorang pendaki Iran, lahir di Zanjan pada tahun 1989. Ia meraih medali perunggu di nomor gabungan di Kejuaraan Dunia 2021 dan tiga medali di Kejuaraan Asia. Pada Oktober 2022, ia berkompetisi di final Kejuaraan Asia di Seoul tanpa penutup kepala selama protes Mahsa Amini; ia menjelaskan bahwa penutup itu jatuh karena kesalahan, sementara BBC kemudian mengutip sumber yang sangat berpengetahuan mengatakan pernyataannya dikeluarkan di bawah tekanan."
