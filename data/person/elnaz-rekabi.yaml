summary:
  ar: "متسلقة إيرانية، وُلدت في زنجان سنة 1989. فازت ببرونزية المسابقة المجمّعة في بطولة العالم 2021 وبثلاث ميداليات في البطولات الآسيوية. وفي أكتوبر 2022 نافست في نهائي بطولة آسيا في سيول دون غطاء رأس، أثناء احتجاجات مهسا أميني؛ وقالت في توضيح نشرته إن الغطاء سقط سهواً، بينما نقلت بي بي سي لاحقاً عن مصدر مطّلع أن بيانها صدر تحت الضغط."
  en: "Iranian competition climber, born in Zanjan in 1989. She won bronze in the combined event at the 2021 World Championships and three medals at the Asian Championships. In October 2022 she competed in the Asian Championships final in Seoul without a headscarf, during the Mahsa Amini protests; her own posted explanation said the scarf had fallen off inadvertently, while the BBC later reported, citing an informed source, that her statement had been made under pressure."
  ur: "ایرانی مقابلہ جاتی کوہ پیما، 1989 میں زنجان میں پیدا ہوئیں۔ انہوں نے 2021 کی عالمی چیمپئن شپ کے مرکب مقابلے میں کانسی اور ایشیائی چیمپئن شپ میں تین تمغے جیتے۔ اکتوبر 2022 میں انہوں نے سیول میں ایشیائی چیمپئن شپ کے فائنل میں سر ڈھانپے بغیر حصہ لیا، مہسا امینی احتجاج کے دنوں میں؛ ان کی اپنی شائع کردہ وضاحت کے مطابق اسکارف اتفاقاً گر گیا تھا، جبکہ بی بی سی نے بعد میں ایک باخبر ذریعے کے حوالے سے کہا کہ ان کا بیان دباؤ کے تحت دیا گیا تھا۔"
