summary:
  ar: "أبو مسلم عبد الله بن ثُوَب الخولاني، تابعي مخضرم من زهّاد الشام، ترجمه البخاري في «التاريخ الكبير» وذكر أنه توفي في زمن معاوية، وعدّه ابن الصلاح والسيوطي في المخضرمين الذين لم يذكرهم مسلم. يجمع له أحمد بن حنبل في «الزهد» أخباراً: وعظه معاوية على منبر دمشق، واستسقاءه للناس في القحط، وكثرة ركوعه، وقول كعب: حكيم هذه الأمة أبو مسلم {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}."
  en: "Abu Muslim Abd Allah ibn Thuwab al-Khawlani, a mukhadram Successor and one of the renunciants of Syria; al-Bukhari's al-Tarikh al-Kabir records that he died in the time of Mu'awiya, and Ibn al-Salah and al-Suyuti count him among the mukhadramun whom Muslim did not list. Ahmad ibn Hanbal's al-Zuhd gathers reports of him: his admonition of Mu'awiya on the pulpit of Damascus, his prayer for rain in a drought, his many prostrations, and Ka'b's saying: the sage of this community is Abu Muslim {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}."
  ur: "ابو مسلم عبد اللہ بن ثُوَب خولانی، مخضرم تابعی اور شام کے زاہدوں میں سے؛ امام بخاری کی «التاریخ الکبیر» کے مطابق وہ معاویہ کے زمانے میں فوت ہوئے، اور ابن الصلاح اور سیوطی انہیں ان مخضرمین میں گنتے ہیں جنہیں امام مسلم نے ذکر نہیں کیا۔ احمد بن حنبل کی «الزہد» ان کے اخبار جمع کرتی ہے: دمشق کے منبر پر معاویہ کو نصیحت، قحط میں بارش کی دعا، کثرتِ رکوع، اور کعب کا قول: اس امت کے حکیم ابو مسلم ہیں {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}۔"
  fr: "Abu Muslim Abd Allah ibn Thuwab al-Khawlani, Successeur mukhadram et l'un des renonçants de Syrie ; al-Tarikh al-Kabir d'al-Bukhari rapporte qu'il mourut au temps de Mu'awiya, et Ibn al-Salah et al-Suyuti le comptent parmi les mukhadramun que Muslim n'a pas recensés. Le Zuhd d'Ahmad ibn Hanbal réunit des récits sur lui : son admonestation de Mu'awiya sur la chaire de Damas, sa prière pour la pluie lors d'une sécheresse, ses nombreuses prosternations, et la parole de Ka'b : le sage de cette communauté est Abu Muslim {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}."
  es: "Abu Muslim Abd Allah ibn Thuwab al-Khawlani, un sucesor mukhadram y uno de los renunciantes de Siria; al-Bukhari, en al-Tarikh al-Kabir, registra que murió en tiempos de Mu'awiya, e Ibn al-Salah y al-Suyuti lo incluyen entre los mukhadramun que Muslim no mencionó. Ahmad ibn Hanbal, en al-Zuhd, recopila relatos sobre él: su amonestación a Mu'awiya desde el púlpito de Damasco, su oración por la lluvia en una sequía, sus numerosas postraciones y el dicho de Ka'b: el sabio de esta comunidad es Abu Muslim {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}."
  tr: "Önde gelen Tabiinlerden (Sahabelerin haleflerinden) ve Suriye'nin zahitlerinden biri olan Ebu Müslim Abdullah ibn Sevb el-Havlani, Buhari tarafından \"el-Tarih el-Kebir\" (Büyük Tarih) adlı eserinde anılmış ve Muaviye döneminde vefat ettiği belirtilmiştir. İbn el-Salah ve el-Suyuti onu, Müslim'in zikretmediği Tabiinler arasına dahil etmişlerdir. Ahmed ibn Hanbel, \"el-Zuhd\" (Zilecilik) adlı eserinde onun hakkında şu rivayetleri derlemiştir: Şam'daki minberden Muaviye'ye verdiği hutbe, kuraklık sırasında yağmur duası, namazda sık sık secde etmesi ve Ka'b'ın \"Bu ümmetin bilge adamı Ebu Müslim'dir\" sözü. {cite:tarikh-kabir-hyderabad-3-1 s. 58-59} {cite:zuhd-ahmad-dkim-1983 s. 471-474} {alıntı:mukaddime-ibn-salah-itr s. 304}."
  id: "Abu Muslim Abdullah ibn Thawb al-Khawlani, seorang Tabi'i terkemuka (penerus para Sahabat) dan salah satu pertapa Suriah, disebutkan oleh al-Bukhari dalam kitabnya \"al-Tarikh al-Kabir\" (Sejarah Agung), yang menyatakan bahwa ia meninggal pada masa pemerintahan Mu'awiya. Ibn al-Salah dan al-Suyuti memasukkannya ke dalam kelompok Tabi'in yang tidak disebutkan oleh Muslim. Ahmad ibn Hanbal mengumpulkan catatan tentangnya dalam kitabnya \"al-Zuhd\" (Pertapaan): khutbahnya kepada Mu'awiya dari mimbar di Damaskus, doanya memohon hujan selama masa kekeringan, sujudnya yang sering dalam shalat, dan pernyataan Ka'b: \"Orang bijak umat ini adalah Abu Muslim.\" {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {kutip:muqaddima-ibn-salah-itr hal. 304}."
