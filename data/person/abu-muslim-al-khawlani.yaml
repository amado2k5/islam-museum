summary:
  ar: "أبو مسلم عبد الله بن ثُوَب الخولاني، تابعي مخضرم من زهّاد الشام، ترجمه البخاري في «التاريخ الكبير» وذكر أنه توفي في زمن معاوية، وعدّه ابن الصلاح والسيوطي في المخضرمين الذين لم يذكرهم مسلم. يجمع له أحمد بن حنبل في «الزهد» أخباراً: وعظه معاوية على منبر دمشق، واستسقاءه للناس في القحط، وكثرة ركوعه، وقول كعب: حكيم هذه الأمة أبو مسلم {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}."
  en: "Abu Muslim Abd Allah ibn Thuwab al-Khawlani, a mukhadram Successor and one of the renunciants of Syria; al-Bukhari's al-Tarikh al-Kabir records that he died in the time of Mu'awiya, and Ibn al-Salah and al-Suyuti count him among the mukhadramun whom Muslim did not list. Ahmad ibn Hanbal's al-Zuhd gathers reports of him: his admonition of Mu'awiya on the pulpit of Damascus, his prayer for rain in a drought, his many prostrations, and Ka'b's saying: the sage of this community is Abu Muslim {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}."
  ur: "ابو مسلم عبد اللہ بن ثُوَب خولانی، مخضرم تابعی اور شام کے زاہدوں میں سے؛ امام بخاری کی «التاریخ الکبیر» کے مطابق وہ معاویہ کے زمانے میں فوت ہوئے، اور ابن الصلاح اور سیوطی انہیں ان مخضرمین میں گنتے ہیں جنہیں امام مسلم نے ذکر نہیں کیا۔ احمد بن حنبل کی «الزہد» ان کے اخبار جمع کرتی ہے: دمشق کے منبر پر معاویہ کو نصیحت، قحط میں بارش کی دعا، کثرتِ رکوع، اور کعب کا قول: اس امت کے حکیم ابو مسلم ہیں {cite:tarikh-kabir-hyderabad-3-1 p. 58-59} {cite:zuhd-ahmad-dkim-1983 p. 471-474} {cite:muqaddima-ibn-salah-itr p. 304}۔"
