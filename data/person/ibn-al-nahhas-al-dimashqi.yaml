summary:
  ar: "محيي الدين أحمد بن إبراهيم بن النحاس الدمشقي الشافعي، في شذرات الذهب صنف في الجهاد كتاباً حافلاً سماه مصارع العشاق فاستجيب فيه دعاؤه إذ قال في أول سجعة فيه أحمدك اللهم وأسألك أعلى رتب الشهادة واختصره هو بنفسه وله تنبيه الغافلين عن أعمال الجاهلين في الحوادث والبدع نفيس في بابه وقُتل بدمياط لما دهمها الفرنج فخرج هو وجماعة من أهلها وجرت وقعة كبيرة فقتل في المعركة مقبلاً غير مدبر سنة أربع عشرة وثمان مئة {cite:shadharat-dhahab p. 113-114}."
  en: "Damascene Shafi'i who asked in the opening of his Mashari' al-Ashwaq for 'the highest rank of martyrdom' — and was killed facing the Franks in the great fight at Damietta in 814 {cite:shadharat-dhahab p. 113-114}."
