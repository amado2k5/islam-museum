summary:
  ar: "أبو سعيد أحمد بن محمد بن زياد بن الأعرابي، بصري الأصل نزل مكة وكان شيخ الحرم في وقته، صحب الجنيد وعمرو بن عثمان المكي والنوري، وسمع بدمشق والرملة ومصر وبغداد، وروى عنه ابن خفيف وابن المقرئ وابن منده. وثّقه السلمي والخليلي، وصنّف للصوفية كتباً، ومال إلى مذهب أصحاب الحديث والظاهر. توفي بمكة سنة 340 أو 341هـ {cite:tarikh-dimashq-amrawi-v5 p. 353-357} {cite:mawsuat-a3lam-ulama-adaba p.153}."
  en: "Abu Sa'id Ahmad ibn Muhammad ibn Ziyad ibn al-A'rabi, of Basran origin, settled in Mecca and was the shaykh of the Sanctuary in his day; he kept company with al-Junayd, Amr ibn Uthman al-Makki and al-Nuri, heard hadith in Damascus, Ramla, Egypt and Baghdad, and Ibn Khafif, Ibn al-Muqri' and Ibn Manda narrated from him. Al-Sulami and al-Khalili called him trustworthy; he wrote books for the Sufis and inclined to the school of the hadith scholars and the Zahiris. He died in Mecca in 340 or 341 AH {cite:tarikh-dimashq-amrawi-v5 p. 353-357} {cite:mawsuat-a3lam-ulama-adaba p.153}."
  ur: "ابو سعید احمد بن محمد بن زیاد بن الاعرابی، اصلاً بصری، مکہ میں آباد ہوئے اور اپنے زمانے میں حرم کے شیخ تھے؛ جنید، عمرو بن عثمان مکی اور نوری کی صحبت پائی، دمشق، رملہ، مصر اور بغداد میں حدیث سنی، اور ان سے ابن خفیف، ابن المقرئ اور ابن مندہ نے روایت کی۔ سلمی اور خلیلی نے انہیں ثقہ کہا؛ انہوں نے صوفیہ کے لیے کتابیں لکھیں اور اصحابِ حدیث و ظاہر کے مذہب کی طرف مائل تھے۔ مکہ میں 340 یا 341ھ میں فوت ہوئے {cite:tarikh-dimashq-amrawi-v5 p. 353-357} {cite:mawsuat-a3lam-ulama-adaba p.153}۔"
