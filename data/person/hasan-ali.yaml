summary:
  ar: "عالم ومربٍّ في شمال لندن، أسس أكاديمية سفر سنة 1998 أثناء إمامته للجمعية الثقافية الإسلامية في لندن، ويقود أكاديمية سفر ومنشورات سفر التي تُستخدم مناهجها في أكثر من ستين دولة؛ تخرج عالما سنة 1997 ونال ماجستير علم النفس التربوي من جامعة لندن سنة 2006."
  en: "North London scholar and educator who founded Safar Academy in 1998 while imam of the London Islamic Cultural Society and leads Safar Academy and Safar Publications, whose curriculum is used in more than sixty countries; he graduated as an 'alim in 1997 and took a master's in educational psychology at the University of London in 2006."
  ur: "شمالی لندن کے عالم و معلم، جنہوں نے 1998 میں لندن اسلامک کلچرل سوسائٹی کے امام ہوتے ہوئے سفر اکیڈمی قائم کی اور سفر اکیڈمی و سفر پبلیکیشنز کی قیادت کرتے ہیں جن کا نصاب ساٹھ سے زائد ممالک میں استعمال ہوتا ہے؛ وہ 1997 میں عالم فارغ ہوئے اور 2006 میں جامعہ لندن سے تعلیمی نفسیات میں ماسٹرز کیا۔"
  es: "Académico y educador del norte de Londres que fundó la Academia Safar en 1998 mientras era imán de la Sociedad Cultural Islámica de Londres y dirige la Academia Safar y Safar Publications, cuyo plan de estudios se utiliza en más de sesenta países; se graduó como 'alim en 1997 y obtuvo una maestría en psicología educativa en la Universidad de Londres en 2006."
  fr: "Érudit et éducateur du nord de Londres, il a fondé la Safar Academy en 1998 alors qu'il était imam de la London Islamic Cultural Society et dirige la Safar Academy et Safar Publications, dont le programme est utilisé dans plus de soixante pays; il a obtenu son diplôme d'« alim » en 1997 et une maîtrise en psychologie de l'éducation à l'Université de Londres en 2006."
