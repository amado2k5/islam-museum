summary:
  ar: "عالم ومربٍّ في شمال لندن، أسس أكاديمية سفر سنة 1998 أثناء إمامته للجمعية الثقافية الإسلامية في لندن، ويقود أكاديمية سفر ومنشورات سفر التي تُستخدم مناهجها في أكثر من ستين دولة؛ تخرج عالما سنة 1997 ونال ماجستير علم النفس التربوي من جامعة لندن سنة 2006."
  en: "North London scholar and educator who founded Safar Academy in 1998 while imam of the London Islamic Cultural Society and leads Safar Academy and Safar Publications, whose curriculum is used in more than sixty countries; he graduated as an 'alim in 1997 and took a master's in educational psychology at the University of London in 2006."
