class: person
label: { ar: "عبيد بن أيوب العنبري أبو المطرب", en: "Ubayd ibn Ayyub al-'Anbari", es: "Ubayd ibn Ayyub al-'Anbari", fr: "Ubayd ibn Ayyub al-'Anbari", ur: "عبید بن ایوب الانباری" }
summary:
  ar: "أبو المطرب عبيد بن أيوب العنبري شاعر، استشهد به المسعودي في باب الغيلان والسعالى بقوله وحالفني الوحوش على الوفاء وغولاً قفرة ذكراً وأنثى كأن عليهما قطع النجاد، وقوله فلله در الغول أي رفيقة لصاحب قفر حالف وهو معبر {cite:muruj-al-dhahab p. 470-471}."
  en: "The poet Abu al-Mutrib whose verses al-Mas'udi cites for the ghul and sa'la — the desert's sworn companion and the male and female ghul of the waste {cite:muruj-al-dhahab p. 470-471}."
  es: "El poeta Abu al-Mutrib, cuyos versos cita al-Mas'udi para el ghul y el sa'la — el compañero jurado del desierto y el ghul masculino y femenino del páramo {cite:muruj-al-dhahab p. 470-471}."
  fr: "Le poète Abu al-Mutrib dont al-Mas'udi cite les vers pour le ghul et le sa'la — le compagnon juré du désert et le ghul masculin et féminin du désert {cite:muruj-al-dhahab p. 470-471}."
  ur: "وہ شاعر ابو المطرب جس کی آیات المسعودی نے غلو اور صلہ کے لیے نقل کیا ہے - صحرا کا حلف اٹھانے والا ساتھی اور فضلے کا نر اور مادہ غُل {حوالہ: مروج الذہب صفحہ 150۔ 470-471}۔"
  tr: "Ebu el-Mutareb Ubeyd bin Eyyub el-Anbari, al-Mas'udi tarafından ghilan ve sa'ali bölümünde şöyle dediği şöyle demiştir: 'Ve vahşi hayvanlar bana sadakatle bağlılık yemini ettiler, vahşi bir hortlak, erkek ve dişi bir halde, sanki eyerle kesilmiş gibi.' Onun 'Tanrı adına, gulyabaninin tozu' demek, bağlılık yemini eden bir baraj sahibine yoldaş anlamına gelir ve bu bir pasajdır {atı:muruj-al-dhahab, s. 470-471}."
  id: "Abu al-Mutareb Ubayd ibn Ayyub al-Anbari adalah seorang penyair, yang dikutip oleh al-Mas'udi dalam bab tentang ghilan dan sa'ali, mengatakan: 'Dan binatang buas itu bersumpah setia kepadaku, dan hantu liar, laki-laki dan betina, seolah-olah mereka dipotong oleh pelana.' Perkataannya: 'Demi Tuhan, debu hantu' berarti teman bagi pemilik barisan yang bersumpah setia, dan itu adalah bagian {cite:muruj-al-dhahab, hlm. 470-471}."
