summary:
  ar: "مهاجم سعودي معتزل، وُلد في جدة سنة 1959 لأسرة من أصل سوداني، وقضى مسيرته كلها مع نادي النصر. هو الهداف التاريخي لمنتخب السعودية برصيد 72 هدفًا في 117 مباراة، والهداف التاريخي للنصر وللدوري السعودي، وقاد بلاده إلى كأس آسيا 1984 و1988، واعتزل سنة 1998. لُقّب «بيليه العرب»، وجاء ثالثًا في تصويت الاتحاد الدولي لتاريخ وإحصاءات كرة القدم على لاعب القرن في آسيا."
  en: "Saudi Arabian former professional footballer (striker), born in Jeddah in 1959 to a family of Sudanese origin, who spent his entire club career at Al-Nassr. He is Saudi Arabia's all-time leading scorer with 72 goals in 117 internationals, Al-Nassr's record scorer and the Saudi Pro League's all-time top scorer; he led his country to the AFC Asian Cup titles of 1984 and 1988 and retired in 1998. Nicknamed 'the Arabian Pelé', he finished third in the IFFHS vote for Asia's Player of the Century."
  ur: "سعودی سابق پیشہ ور فٹبالر (اسٹرائیکر)، 1959 میں جدہ میں سوڈانی نژاد خاندان میں پیدا ہوئے اور اپنا پورا کلب کیریئر النصر میں گزارا۔ وہ 117 بین الاقوامی میچوں میں 72 گول کے ساتھ سعودی عرب کے ہمہ وقتی سرفہرست گول اسکورر، النصر کے ریکارڈ اسکورر اور سعودی پرو لیگ کے ہمہ وقتی سرفہرست اسکورر ہیں؛ انہوں نے اپنے ملک کو 1984 اور 1988 کے اے ایف سی ایشین کپ جتوائے اور 1998 میں ریٹائر ہوئے۔ انہیں «عرب پیݪے» کہا جاتا تھا اور وہ آئی ایف ایف ایچ ایس کے ایشیا کے صدی کے بہترین کھلاڑی کے ووٹ میں تیسرے نمبر پر رہے۔"
