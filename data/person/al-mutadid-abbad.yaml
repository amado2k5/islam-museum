summary:
  ar: "المعتضد بالله أبو عمرو عباد بن الظافر بن قريش؛ لما مات والده القاضي محمد قام مقامه سنة ثلاث وثلاثين وأربعمائة وتسمّى أولاً بفخر الدولة ثم بالمعتضد؛ وقال ابن بسّام في الذخيرة: قطب رحى الفتنة ومنتهى غاية المحنة، من رجل لا يُبت له قائم ولا حسيد، ولا سلّم منه قريب ولا بعيد، جبار إبرم الأمر وهو متناقض، وأسد فترس الطلا وهو رابض، متعسكف اهتدى ومنتقم قطع فما أبقى، ثار والناس حرب وضبط شأنه بين قائم وقاعد حتى طالت يده واتسع بلده وكثر عديده؛ وكان مع ذلك قد نظر في الأدب قبل الميل إلى طلب السلطان فحصل منه على قطعة وافرة من الشعر ذات طلاوة {cite:wafayat-ayan}."
  en: "al-Mu'tadid 'Abbad (r. 433–461) — the fearsome Abbadid who built Seville into a power; Ibn Bassam's famous portrait: 'the pivot of the fitna, whose arm lengthened and lands widened' — also a natural poet {cite:wafayat-ayan}."
