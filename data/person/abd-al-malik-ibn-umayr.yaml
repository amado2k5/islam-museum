roles: [muhaddith]
gender: male
summary:
  ar: "عبد الملك بن عمير بن سويد القرشي أو اللخمي، المعروف بالقبطي، حافظ ومحدث الكوفة ومسند أهلها وقاضيها، رأى علياً؛ توفي نحو سنة ١٣٦هـ، وقد اختلف النقاد في ضبطه."
  en: "Abd al-Malik ibn Umayr ibn Suwayd al-Qurashi, or al-Lakhmi, known as al-Qibti, the hadith scholar, chain-bearer and judge of Kufa who saw Ali; he died about 136 AH, and the critics differed on his precision."
  fr: "Abd al-Malik ibn Umayr ibn Suwayd al-Qurashi, ou al-Lakhmi, dit al-Qibti, traditionniste, porteur de chaînes et cadi de Koufa qui vit Ali ; il mourut vers 136 H, et les critiques divergèrent sur sa précision."
  es: "Abd al-Malik ibn Umayr ibn Suwayd al-Qurashi, o al-Lakhmi, conocido como al-Qibti, el erudito de hadices, portador de la cadena y juez de Kufa que vio a Ali; murió alrededor del año 136 AH, y los críticos discreparon sobre la precisión de sus afirmaciones."
  ur: "عبد الملک بن عمیر بن سوید القرشی، یا الخمی، جسے القبطی کے نام سے جانا جاتا ہے، حدیث کے عالم، سلسلہ کوفہ کا علمبردار اور قاضی جس نے علی کو دیکھا؛ اس کی وفات تقریباً 136 ہجری میں ہوئی، اور ناقدین نے اس کی درستگی میں اختلاف کیا۔"
