summary:
  ar: "بطاقة أولية للشيخ بدر الدين محمود السماوي، قاضي العسكر ومفتي موسى جلبي وعالم الفقه والمنطق الذي قاد لاحقاً حركة مسلحة فأُعدم سنة ١٤١٦م؛ تذكره كتب التاريخ العثماني ومعاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Shaykh Badr al-Din Mahmud al-Simavi, the kazasker and jurist-theologian who later led an armed movement and was executed in 1416; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Shaykh Badr al-Din Mahmud al-Simavi, el kazasker y jurista-teólogo que más tarde lideró un movimiento armado y fue ejecutado en 1416; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de convocation du cheikh Badr al-Din Mahmud al-Simavi, le kazasker et juriste-théologien qui mena plus tard un mouvement armé et fut exécuté en 1416; la source n'est pas encore vérifiée sur la page."
  ur: "شیخ بدر الدین محمود السیماوی کے لیے ڈرافٹ کارڈ، جو قازق اور فقیہ ماہر تھے جنہوں نے بعد میں ایک مسلح تحریک کی قیادت کی اور 1416 میں انہیں پھانسی دے دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Askeri yargıç, Musa Çelebi Müftüsü ve hukuk ile mantık alimi Şeyh Badr al-Din Mahmud el-Samawi'nin ön kartı; daha sonra silahlı bir harekete öncülük eden ve 1416 yılında idam edilen kişi; Osmanlı tarih kitaplarında ve önemli kişilerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sheikh Badr al-Din Mahmoud al-Samawi, hakim militer, Mufti Musa Çelebi, dan sarjana hukum serta logika, yang kemudian memimpin gerakan bersenjata dan dieksekusi pada tahun 1416 M; ia disebutkan dalam buku sejarah Ottoman dan kamus tokoh-tokoh terkemuka, dan biografinya belum pernah diulas di halaman tersebut."
