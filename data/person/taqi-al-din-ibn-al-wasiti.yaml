summary:
  ar: "شيخ الإسلام بركة الشام وقطب الوقت؛ رحل في طلب الحديث فسمع ببغداد والموصل وحلب وحران، ودرّس بالصاحبة بقاسيون نحو عشرين سنة وولي في آخر عمره مشيخة دار الحديث الظاهرية؛ قال ابن الزملكاني في حقه: مبالغاً في إنكار المنكر لا يبالي على من أنكر، داعيةً إلى عقيدة أهل السنة والسلف الصالح؛ وقال البرزالي: تفرد بعلو الإسناد وكثرة الروايات والعبادة ولم يخلف مثله {cite:shadharat-dhahab p. 733-734}."
  en: "'Syria's blessing, the pole of the age' — twenty years at the Sahibiyya, the Zahiriyya dar al-hadith at the end; al-Barzali: 'unique in isnad-loftiness, transmission and worship, and left no like' {cite:shadharat-dhahab p. 733-734}."
  es: "'La bendición de Siria, el polo de la era': veinte años en la Sahibiyya, la Zahiriyya dar al-hadith al final; al-Barzali: 'único en la elevación del isnad, la transmisión y la adoración, y no dejó igual' {cita: shadharat-dhahab págs. 733-734}."
  fr: "« La bénédiction de la Syrie, le pôle de l'époque » — vingt ans à la Sahibiyya, la Zahiriyya dar al-hadith à la fin; al-Barzali: « unique en termes d'isnad-élévation, de transmission et d'adoration, et n'a laissé aucun semblable » {cite: shadharat-dhahab p. 733-734}."
  ur: "'شام کی برکت، عمر کا قطب' - صاحبیہ کے آخر میں بیس سال، ظاہریہ دار الحدیث؛ البرزالی: 'اسناد بلندی، نشر و اشاعت اور عبادت میں منفرد، اور اس جیسا کوئی نہیں چھوڑا۔ 733-734}۔"
  tr: "Şeyh al-Islam, Barakat al-Sham ve zamanının kutbu; hadis peşinde seyahat etti, Bağdat, Musul, Halep ve Harran'ı dinledi, yaklaşık yirmi yıl boyunca Kasiyoun'daki Al-Sahiba'da ders verdi ve ilerleyen yıllarında Zahiriyye Hadis Evi'nin şeyhi oldu. İbn al-Zamalkani onun hakkında şöyle demiştir: Kötülüğü inkar ederken abartılı davrandı, onu yapanlara kayıtsızdı, Ehlsünnet ve doğru seleflere çağrıda bulundu. El-Barzali şöyle dedi: Yüksek aktarım zinciri, sayısız rivayet ve ibadet ile benzersizdi ve onun gibi birini asla bırakmadı {atıf:şadharat-dhahab s. 733-734}."
  id: "Shaykh al-Islam, Barakat al-Sham dan kutub zamannya; ia melakukan perjalanan mengejar hadis, mendengarkan Baghdad, Mosul, Aleppo, dan Harran, serta mengajar di Al-Sahiba di Qasioun selama sekitar dua puluh tahun, dan di tahun-tahun terakhirnya menjadi sheikh Rumah Hadis Zahiriyya. Ibn al-Zamalkani berkata tentangnya: Ia melebih-lebihkan dalam menyangkal kejahatan, acuh tak acuh terhadap mereka yang melakukannya, menyeru pada ajaran Ahl al-Sunnah dan para pendahulu yang benar. Al-Barzali berkata: Ia unik dalam rantai transmisi yang tinggi, banyak narasi, dan ibadah, dan tidak pernah meninggalkan siapa pun seperti dirinya {cite:shadharat-dhahab hlm. 733-734}."
