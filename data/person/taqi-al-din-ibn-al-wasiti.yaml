summary:
  ar: "شيخ الإسلام بركة الشام وقطب الوقت؛ رحل في طلب الحديث فسمع ببغداد والموصل وحلب وحران، ودرّس بالصاحبة بقاسيون نحو عشرين سنة وولي في آخر عمره مشيخة دار الحديث الظاهرية؛ قال ابن الزملكاني في حقه: مبالغاً في إنكار المنكر لا يبالي على من أنكر، داعيةً إلى عقيدة أهل السنة والسلف الصالح؛ وقال البرزالي: تفرد بعلو الإسناد وكثرة الروايات والعبادة ولم يخلف مثله {cite:shadharat-dhahab p. 733-734}."
  en: "'Syria's blessing, the pole of the age' — twenty years at the Sahibiyya, the Zahiriyya dar al-hadith at the end; al-Barzali: 'unique in isnad-loftiness, transmission and worship, and left no like' {cite:shadharat-dhahab p. 733-734}."
