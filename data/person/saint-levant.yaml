summary:
  ar: فنان فلسطيني جزائري فرنسي وُلد في غزة سنة 2000 ونشأ بين الأردن وفلسطين؛ يغني بالعربية والإنجليزية والفرنسية تحت اسم «سان لوفان»، وصار من أبرز الأصوات الفلسطينية الشابة في البوب العالمي.
  en: Palestinian-Algerian-French singer and rapper born in Gaza in 2000 and raised between Jordan and Palestine; performing in Arabic, English and French as Saint Levant, he has become one of the most
    prominent young Palestinian voices in global pop.
  ur: فلسطینی، الجزائری، فرانسیسی گلوکار اور ریپر جو 2000 میں غزہ میں پیدا ہوا اور اردن اور فلسطین میں پلا؛ سینٹ لیونٹ کے نام سے عربی، انگریزی اور فرانسیسی میں گاتا ہے اور عالمی پاپ میں نمایاں نوجوان فلسطینی
    آواز ہے۔
  es: "Cantante y rapero palestino-argelino-francés nacido en Gaza en el año 2000 y criado entre Jordania y Palestina; actúa en árabe, inglés y francés bajo el nombre de Saint Levant, y se ha convertido en una de las voces jóvenes palestinas más destacadas del pop mundial."
  fr: "Chanteur et rappeur palestino-algérien-français né à Gaza en 2000 et ayant grandi entre la Jordanie et la Palestine; se produisant en arabe, en anglais et en français sous le nom de Saint Levant, il est devenu l'une des voix jeunes palestiniennes les plus importantes de la pop mondiale."
  tr: "2000 yılında Gazze'de doğmuş ve Ürdün ile Filistin arasında büyümüş Filistinli-Cezayirli-Fransız sanatçı; 'Saint-Levan' adıyla Arapça, İngilizce ve Fransızca şarkı söylüyor ve küresel pop dünyasında en önde gelen genç Filistinli seslerden biri haline geldi."
  id: "Seorang seniman Palestina-Aljazair-Prancis yang lahir di Gaza pada tahun 2000 dan dibesarkan di antara Yordania dan Palestina; ia bernyanyi dalam bahasa Arab, Inggris, dan Prancis dengan nama 'Saint-Levan' dan telah menjadi salah satu suara muda Palestina paling menonjol dalam pop global."
