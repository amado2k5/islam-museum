id: person/abu-shuja-al-rudhrawari
class: person
label:
  ar: "أبو شجاع الروذراوري"
  en: "Abu Shuja al-Rudhrawari"
  fr: "Abu Shuja al-Rudhrawari"
  es: "Abu Shuja al-Rudhrawari"
  ur: "ابو شجاع الدراوری۔"
roles: [vizier]
gender: male
summary:
  ar: "محمد بن الحسين بن محمد بن عبد الله، أبو شجاع الروذراوري، ظهير الدين، وزير المقتدي العباسي من سنة 476 هـ إلى عزله سنة 484 هـ، عالم بالأدب وصاحب ذيل تجارب الأمم، جاور بالمدينة بعد حجه سنة 487 هـ ودفن بالبقيع."
  en: "Muhammad ibn al-Husayn ibn Muhammad ibn Abdallah, Abu Shuja al-Rudhrawari, Zahir al-Din, vizier to the Abbasid al-Muqtadi from 476 AH until his dismissal in 484 AH, learned in letters, author of the continuation of Tajarib al-Umam; after the pilgrimage of 487 AH he stayed in Medina and was buried at al-Baqi'. Al-Zirikli prints 437-488 AH (1045-1095)."
  fr: "Muhammad ibn al-Husayn ibn Muhammad ibn Abdallah, Abu Shuja al-Rudhrawari, Zahir al-Din, vizir de l'Abbasside al-Muqtadi de 476 H à sa révocation en 484 H, lettré et auteur de la continuation de Tajarib al-Umam ; après le pèlerinage de 487 H, il resta à Médine et fut enterré à al-Baqi'. Al-Zirikli donne 437-488 H (1045-1095)."
  es: "Muhammad ibn al-Husayn ibn Muhammad ibn Abdallah, Abu Shuja al-Rudhrawari, Zahir al-Din, visir del abasí al-Muqtadi desde el año 476 de la Hégira hasta su destitución en el año 484 de la Hégira, erudito en letras, autor de la continuación de Tajarib al-Umam; tras la peregrinación del año 487 de la Hégira, permaneció en Medina y fue enterrado en al-Baqi'. Al-Zirikli imprime entre los años 437 y 488 de la Hégira (1045-1095)."
  ur: "محمد بن الحسین بن محمد بن عبد اللہ، ابو شجاع الدروری، ظاہر الدین، عباسی مقتدی کے وزیر 476 ہجری سے 484 ہجری میں ان کی برطرفی تک، خطوط میں سیکھے گئے، تاجریب الامہ کے تسلسل کے مصنف؛ 487 ہجری کی زیارت کے بعد آپ نے مدینہ میں قیام کیا اور البقیع میں دفن ہوئے۔ الزرکلی 437-488 ہجری (1045-1095) پرنٹ کرتا ہے۔"
