summary:
  ar: "محمد بن الحسين بن محمد بن عبد الله، أبو شجاع الروذراوري، ظهير الدين، وزير المقتدي العباسي من سنة 476 هـ إلى عزله سنة 484 هـ، عالم بالأدب وصاحب ذيل تجارب الأمم، جاور بالمدينة بعد حجه سنة 487 هـ ودفن بالبقيع."
  en: "Muhammad ibn al-Husayn ibn Muhammad ibn Abdallah, Abu Shuja al-Rudhrawari, Zahir al-Din, vizier to the Abbasid al-Muqtadi from 476 AH until his dismissal in 484 AH, learned in letters, author of the continuation of Tajarib al-Umam; after the pilgrimage of 487 AH he stayed in Medina and was buried at al-Baqi'. Al-Zirikli prints 437-488 AH (1045-1095)."
