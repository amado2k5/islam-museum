    standing: main
    stance: { ar: "حافظ ثقة من كبار الحفاظ", en: "A trustworthy hafiz, one of the great hafizes" }
    summary:
      ar: "الذهبي: الحافظ الثقة صاحب التصانيف، ومن كبار الحفاظ وأئمة الأعلام، وقول أبي هاشم الخلال ⁦(عند الخطيب)⁩: كان أبو بكر أحفظ من أبيه؛ والدارقطني: ثقة إلا أنه كثير الخطأ في الكلام على الحديث؛ وابن عدي: معروف بالطلب، وعامة ما كتب مع أبيه، وهو مقبول عند أصحاب الحديث."
      en: "Al-Dhahabi: the trustworthy hafiz, author of works, one of the great hafizes and leading figures; Abu Hashim al-Khallal (via al-Khatib): Abu Bakr had a better memory than his father; al-Daraqutni: trustworthy, but often in error when speaking on hadith; Ibn Adi: known for his pursuit of learning, most of what he wrote he wrote with his father, and he is accepted by the hadith scholars."
    holders: [person/al-dhahabi, person/al-daraqutni]
    sources: [source/mizan-itidal-azimabadi-v2]
  - tradition: sunni
    id: sunni-jarh
    standing: secondary
    stance: { ar: "كلام أبيه فيه ومن تبعه", en: "His father's word and those who followed it" }
    summary:
      ar: "روى ابن عدي بإسناده عن أبي داود: ابني عبد الله كذاب، وقال ابن صاعد: كفانا ما قال أبوه فيه؛ ونقل عن إبراهيم الأصبهاني تكذيبه. ويروي ابن عدي أنه نُسب في أول أمره إلى شيء من النصب، فنفاه ابن الفرات من بغداد، ثم ردّه علي بن عيسى فحدّث وأظهر فضائل علي؛ ويقول الذهبي إنه كان قوي النفس، وكان بينه وبين ابن صاعد وابن جرير ما كان."
      en: "Ibn Adi relates with his chain that Abu Dawud said: my son Abd Allah is a liar, and Ibn Sa'id said: what his father said of him suffices us; he also quotes Ibrahim al-Isbahani calling him a liar. Ibn Adi relates that early on he was linked to some hostility to Ali (nasb), so Ibn al-Furat banished him from Baghdad, then Ali ibn Isa brought him back and he narrated and made known the merits of Ali; al-Dhahabi says he was strong-willed, and that there was enmity between him and Ibn Sa'id and Ibn Jarir."
