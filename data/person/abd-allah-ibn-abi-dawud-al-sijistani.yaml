summary:
  ar: "أبو بكر عبد الله بن سليمان بن الأشعث السجستاني، ابن صاحب السنن، يصفه الذهبي في «ميزان الاعتدال» بالحافظ الثقة صاحب التصانيف، ومن كبار الحفاظ وأئمة الأعلام. ذكر الذهبي ما قيل فيه — كلمة أبيه فيه وتكذيب إبراهيم الأصبهاني، وتوثيق الدارقطني مع كثرة خطئه في الكلام على الحديث، وقبول أهل الحديث له عند ابن عدي — وما جرى بينه وبين ابن صاعد وابن جرير، وأورده دفاعاً عنه. له «المصاحف» و«التفسير» وكتب أخرى عند ابن النديم، وتوفي سنة 316هـ {cite:mizan-itidal-azimabadi-v2 p. 42-43} {cite:fihrist-ibn-al-nadim p. 324-325}."
  en: "Abu Bakr Abd Allah ibn Sulayman ibn al-Ash'ath al-Sijistani, son of the author of the Sunan, whom al-Dhahabi's Mizan al-I'tidal calls the trustworthy hafiz and author of works, one of the great hafizes and leading figures. Al-Dhahabi lists what was said against him — his father's word about him and Ibrahim al-Isbahani's charge of lying, al-Daraqutni's 'trustworthy, but often in error when speaking on hadith', Ibn Adi's 'accepted by the hadith scholars' — and his quarrels with Ibn Sa'id and Ibn Jarir, and includes him in order to defend him. Ibn al-Nadim lists his Kitab al-Masahif, a Tafsir and other books; he died in 316 AH {cite:mizan-itidal-azimabadi-v2 p. 42-43} {cite:fihrist-ibn-al-nadim p. 324-325}."
  ur: "ابو بکر عبد اللہ بن سلیمان بن الاشعث سجستانی، صاحبِ سنن کے بیٹے، جنہیں ذہبی «میزان الاعتدال» میں ثقہ حافظ اور صاحبِ تصانیف، بڑے حفاظ اور ائمۂ اعلام میں سے کہتے ہیں۔ ذہبی ان کے بارے میں کہی گئی باتیں — ان کے والد کا قول اور ابراہیم اصبہانی کی تکذیب، دارقطنی کا ‘ثقہ مگر حدیث پر کلام میں کثیر الخطا’، ابن عدی کا ‘اہلِ حدیث کے ہاں مقبول’ — اور ابن صاعد اور ابن جریر سے ان کے جھگڑے ذکر کرتے ہیں، اور ان کا دفاع کرتے ہیں۔ ابن الندیم ان کی کتاب المصاحف، ایک تفسیر اور دیگر کتب گنواتے ہیں؛ وفات 316ھ {cite:mizan-itidal-azimabadi-v2 p. 42-43} {cite:fihrist-ibn-al-nadim p. 324-325}۔"
