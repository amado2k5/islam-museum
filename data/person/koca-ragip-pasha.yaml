roles: [vizier, poet, writer]
gender: male
summary:
  ar: "محمد راغب باشا، سياسي تركي عصامي وعالم بالعربية، ولي مصر وحلب والشام وبلغ الصدارة العظمى ست سنوات في عهد عثمان الثالث ومصطفى الثالث، وله مكتبة تعرف باسمه و«سفينة الراغب» وديوان بكل من العربية والتركية والفارسية، توفي بالآستانة سنة 1176 هـ."
  en: "Muhammad Ragib Pasha, a self-made Ottoman statesman and scholar of Arabic who governed Egypt, Aleppo and Syria and was grand vizier for six years under Uthman III and Mustafa III; founder of the library that bears his name, author of Safinat al-Ragib and of a diwan in each of Arabic, Turkish and Persian; died in Istanbul in 1176 AH (1763)."
  es: "Muhammad Ragib Pasha, estadista otomano y erudito árabe que se hizo a sí mismo, gobernó Egipto, Alepo y Siria, y fue gran visir durante seis años bajo los reinados de Uthman III y Mustafa III; fundador de la biblioteca que lleva su nombre, autor de Safinat al-Ragib y de un diwan en árabe, turco y persa; murió en Estambul en 1176 AH (1763)."
