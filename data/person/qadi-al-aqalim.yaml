summary:
  ar: "قاضي الأقاليم عز الدين عبد العزيز البغدادي المقدسي الحنبلي الشيخ الإمام العالم المفسر؛ ولد ببغداد سنة سبعين وسبعمائة واشتغل بها ثم قدم دمشق فأخذ الفقه عن ابن اللحام وعرض عليه الخرقي واعتنى بالوعظ وعلم الحديث ودرس وأفتى، وله مصنفات منها مختصر المغني وشرح الشاطبية وصنف في المعاني والبيان وجمع كتاباً سماه القمر المنير في أحاديث البشير النذير، وولي قضاء بيت المقدس بعد فتنة التنك في سنة أربع وثمانمائة وهو أول حنبلي ولي القدس وطالت مدته وجرى له فصول، ثم ولي المؤيدية بالقاهرة ثم ولي قضاء الديار المصرية في جمادى الآخرة سنة تسع وعشرين ثم ولي قضاء دمشق في دفعات يكون مجموعها ثمان سنين، وكان يسمى بقاضي الأقاليم لأنه ولي قضاء بغداد والعراق وبيت المقدس ومصر والشام، وكان فقيهاً ديناً متقشفاً عديم التكلف في ملبسه ومركبه ولما ولي قضاء مصر صار يمشي لحاجته في الأسواق ويردف عبده على بغلته وكان جميع ولاياته من غير سعي، وتوفي بدمشق ليلة الأحد مستهل ذي القعدة سنة ست وأربعين وثمانمائة ودفن عند قبر والده بمقابر باب كيسان {cite:shadharat-dhahab p. 259-260}."
  en: "'Qadi of the Realms' (b. Baghdad 770) — the only man to hold the judgeships of Baghdad, Jerusalem (first Hanbali ever, after Timur's sack, 804), Egypt (829) and Damascus; author of Mukhtasar al-Muqni', a Shatibiyya commentary and Qamar al-Munir on hadith; rode the Cairo markets himself with his servant behind him on the mule, 'all his offices came unsought'; died Damascus beginning of Dhu al-Qa'da 846, buried beside his father at Bab Kisan {cite:shadharat-dhahab p. 259-260}."
  es: "'Qadi de los Reinos' (n. Bagdad 770): el único hombre que ocupó los cargos de juez de Bagdad, Jerusalén (el primer Hanbali de la historia, después del saqueo de Timur, 804), Egipto (829) y Damasco; autor de Mukhtasar al-Muqni', un comentario de Shatibiyya y Qamar al-Munir sobre hadices; él mismo viajó por los mercados de El Cairo con su sirviente detrás de él en la mula, \"todos sus cargos no fueron buscados\"; Murió en Damasco a principios de Dhu al-Qa'da en 846, enterrado junto a su padre en Bab Kisan {citar: shadharat-dhahab p. 259-260}."
  fr: "« Qadi des Royaumes » (né à Bagdad en 770) — le seul homme à occuper les postes de juge de Bagdad, de Jérusalem (le premier Hanbali, après le limogeage de Timur, 804), d'Égypte (829) et de Damas; auteur de Mukhtasar al-Muqni', un commentaire de Shatibiyya et de Qamar al-Munir sur les hadiths; il parcourait lui-même les marchés du Caire avec son domestique derrière lui sur la mule, « toutes ses fonctions n'étaient pas recherchées »; mort à Damas au début de Dhu al-Qa'da 846, enterré à côté de son père à Bab Kisan {cite: shadharat-dhahab p. 259-260}."
  ur: "'علاقوں کا قادی' ⁦(بغداد 770)⁩ - بغداد، یروشلم ⁦(پہلے حنبلی، تیمور کی برطرفی کے بعد، 804)⁩، مصر (829) اور دمشق کے ججوں کے عہدے پر فائز ہونے والا واحد شخص؛ مختار المقنی کے مصنف، شاطبیہ تفسیر اور حدیث پر قمر المنیر؛ قاہرہ کے بازاروں میں خچر پر اپنے پیچھے اپنے نوکر کے ساتھ سوار ہوا، 'اس کے تمام دفاتر غیر مطلوب آئے'۔ ذوالقعدہ 846 کے آغاز میں دمشق کی وفات ہوئی، باب کسان میں اپنے والد کے پاس دفن ہوئے۔ 259-260}۔"
  tr: "Vilayetlerin hakimi İzzeddin Abdülaziz el-Bağdadi el-Makdisi el-Hanbali, şeyh, imam, alim ve tefsirci; 770 Hicri yılında Bağdat'ta doğdu ve orada çalıştı, ardından Şam'a geldi, burada İbn el-Laham'ın yanında fıkıh okudu ve el-Khurqi çalıştı. Kendini vaazlara, hadis bilimine adadı, fetvalar öğretti ve yayımladı. Muhtesar-el-Mughni ve Şerh el-Şatibiye gibi eserler yazdı. Anlamlar ve retorik üzerine eserler yazdı, el-Beşîr el-Nadir'in hadisleri üzerine 'El-Kamar el-Münir' adlı bir kitap hazırladı ve 804 Hicri Tank kargaşasından sonra Kudüs hakimi olarak atandı. Kudüs'ü yöneten ilk Hanbali oldu ve görev süresi uzun sürdü. Birkaç mevsim görev yaptı, ardından Kahire'deki Al-Mu'eyyadiyya yargıcı, yirmi dokuzuncu yılda Cumada al-Akhirah'da Mısır topraklarının hakimi ve ardından sekiz yıl boyunca Şam yargıcı olarak görev yaptı. Bağdat, Irak, Kudüs, Mısır ve Şam yargılarını yürüttüğü için vilayet hakimi olarak anıldı. Dini bir hukukçu, münzeviydi ve kıyafeti ile aracında gösterişsizdi. Mısır hakimi olduğunda, ihtiyaçları için pazarlarda yürür, hizmetkarını katırıyla kovalardı ve tüm valilikleri zahmetsizce gerçekleşti. 846 Hicri yılında, Zulüd-Qi'dah'ın başlangıcında, Pazar gecesi Şam'da öldü ve babasının mezarının yakınında, Bab Kisan mezarlığında defnedildi {alıntı::Shadharat-Dhahab, s. 259-260}."
  id: "Hakim provinsi, Izz al-Din Abdul Aziz al-Baghdadi al-Maqdisi al-Hanbali, seorang sheikh, imam, cendekiawan, dan penafsir; ia lahir di Baghdad pada tahun 770 H dan bekerja di sana, kemudian datang ke Damaskus, di mana ia belajar hukum di bawah bimbingan Ibn al-Laham dan mempelajari al-Khurqi. Ia mendedikasikan dirinya untuk berkhotbah, ilmu hadis, serta mengajar dan mengeluarkan fatwa. Ia menulis karya-karya termasuk Mukhtasar al-Mughni dan Sharh al-Shatibiyyah. Ia menulis karya tentang makna dan retorika, menyusun sebuah buku berjudul 'Al-Qamar al-Munir' tentang hadits al-Bashir al-Nadir, dan menunjuk hakim Yerusalem setelah kekacauan Tank pada 804 H. Ia adalah Hanbali pertama yang memerintah Yerusalem, dan masa jabatannya berlangsung lama. Ia menjalani beberapa musim, kemudian diangkat sebagai hakim Al-Mu'ayyadiyya di Kairo, kemudian sebagai hakim tanah Mesir di Jumada al-Akhirah pada tahun dua puluh sembilan, dan kemudian menjabat sebagai hakim Damaskus dalam jumlah total delapan tahun. Ia disebut hakim provinsi karena memegang kehakiman Baghdad, Irak, Yerusalem, Mesir, dan Levant. Ia adalah seorang ahli hukum agama, pertapa dan sederhana dalam pakaian dan kendaraannya. Ketika menjadi hakim Mesir, ia berjalan di pasar untuk kebutuhannya, mengejar pelayannya dengan keledai, dan semua jabatan gubernurnya berjalan tanpa usaha. Ia meninggal di Damaskus pada malam Minggu, awal Dhu al-Qi'dah, tahun 846 H, dan dimakamkan di dekat makam ayahnya di pemakaman Bab Kisan {cite:shadharat-dhahab, hlm. 259-260}."
