names:
  - { value: "قاضي الأقاليم عز الدين أبو البركات عبد العزيز بن الإمام العلامة علاء الدين أبي الحسن علي بن العز بن عبد العزيز بن عبد المحمود البغدادي مولداً ثم المقدسي الحنبلي", kind: full }
gender: male
summary:
  ar: "قاضي الأقاليم عز الدين عبد العزيز البغدادي المقدسي الحنبلي الشيخ الإمام العالم المفسر؛ ولد ببغداد سنة سبعين وسبعمائة واشتغل بها ثم قدم دمشق فأخذ الفقه عن ابن اللحام وعرض عليه الخرقي واعتنى بالوعظ وعلم الحديث ودرس وأفتى، وله مصنفات منها مختصر المغني وشرح الشاطبية وصنف في المعاني والبيان وجمع كتاباً سماه القمر المنير في أحاديث البشير النذير، وولي قضاء بيت المقدس بعد فتنة التنك في سنة أربع وثمانمائة وهو أول حنبلي ولي القدس وطالت مدته وجرى له فصول، ثم ولي المؤيدية بالقاهرة ثم ولي قضاء الديار المصرية في جمادى الآخرة سنة تسع وعشرين ثم ولي قضاء دمشق في دفعات يكون مجموعها ثمان سنين، وكان يسمى بقاضي الأقاليم لأنه ولي قضاء بغداد والعراق وبيت المقدس ومصر والشام، وكان فقيهاً ديناً متقشفاً عديم التكلف في ملبسه ومركبه ولما ولي قضاء مصر صار يمشي لحاجته في الأسواق ويردف عبده على بغلته وكان جميع ولاياته من غير سعي، وتوفي بدمشق ليلة الأحد مستهل ذي القعدة سنة ست وأربعين وثمانمائة ودفن عند قبر والده بمقابر باب كيسان {cite:shadharat-dhahab p. 259-260}."
  en: "'Qadi of the Realms' (b. Baghdad 770) — the only man to hold the judgeships of Baghdad, Jerusalem (first Hanbali ever, after Timur's sack, 804), Egypt (829) and Damascus; author of Mukhtasar al-Muqni', a Shatibiyya commentary and Qamar al-Munir on hadith; rode the Cairo markets himself with his servant behind him on the mule, 'all his offices came unsought'; died Damascus beginning of Dhu al-Qa'da 846, buried beside his father at Bab Kisan {cite:shadharat-dhahab p. 259-260}."
