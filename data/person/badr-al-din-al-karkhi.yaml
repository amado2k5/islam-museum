summary:
  ar: "محمد بن محمد الكرخي، بدر الدين، فقيه عارف بالتفسير اشتهر بمصر وتوفي فيها سنة 1006 هـ، من كتبه مجمع البحرين حاشية على تفسير الجلالين."
  en: "Muhammad ibn Muhammad al-Karkhi, Badr al-Din, a jurist learned in exegesis, well known in Egypt where he died in 1006 AH (1598); author of Majma' al-Bahrayn, a gloss on Tafsir al-Jalalayn."
  es: "Muhammad ibn Muhammad al-Karkhi, Badr al-Din, un jurista versado en exégesis, muy conocido en Egipto, donde murió en 1006 AH (1598); autor de Majma' al-Bahrayn, una glosa sobre Tafsir al-Jalalayn."
  fr: "Muhammad ibn Muhammad al-Karkhi, Badr al-Din, juriste versé dans l'exégèse, bien connu en Égypte où il mourut en 1006 AH (1598); auteur de Majma' al-Bahrayn, une glose sur Tafsir al-Jalalayn."
  ur: "محمد بن محمد الکرخی، بدر الدین، ایک فقیہ جو تفسیر میں سیکھے، مصر میں مشہور ہیں جہاں ان کی وفات 1006 ہجری (1598) میں ہوئی؛ مجمع البحرین کے مصنف، تفسیر الجلائن پر ایک تالیف۔"
  tr: "Muhammed ibn Muhammed el-Karhi, Badr al-Din, Mısır'da ünlü bir tefsir hukukçusu ve mistikti, 1006 Hicri yılında orada öldü. Kitapları arasında, Tafsir'i celayn'a dair kenar tefsir olan Majma' al-Bahrain' de bulunmaktadır."
  id: "Muhammad ibn Muhammad al-Karkhi, Badr al-Din, adalah seorang ahli hukum dan mistikus tafsir, terkenal di Mesir dan meninggal di sana pada tahun 1006 H. Di antara bukunya adalah Majma' al-Bahrain, sebuah komentar marginal atas Tafsir al-Jalalayn."
