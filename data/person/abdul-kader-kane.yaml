summary:
  ar: "عبد القادر كان (نحو 1726–1807)، عالم وقاضٍ تورودبي من السالوم، صار سنة 1776 أول ألمامي لإمامة فوتا تورو الإسلامية خلفاً لسليمان بال، فحكم ثلاثين عاماً: هزم مور براكنة وترارزة، وصدّ الفرنسيين عن تجارة الرقيق عبر بلاده، وأُسر بعد هزيمة بونخوي سنة 1796 ثم أُطلق، وقُتل سنة 1807 فيما تقوله المقالة الفرنسية وويكي بيانات، بينما تجعل المقالة الإنجليزية مقتله في معركة غوريكي سنة 1806."
  en: "Abdul Kader Kane (c. 1726–1807), a Torodbe scholar and qadi from the Saloum who in 1776 became the first Almaami of the Islamic Imamate of Futa Toro, succeeding Sulayman Bal. He ruled for thirty years: he defeated the Brakna and Trarza Moors, barred the French slave trade through his state, was captured after the Bunxoy disaster of 1796 and released, and was killed in 1807 on the French article's and Wikidata's dating — the English article instead places his death at the battle of Gouriki in 1806."
  ur: "عبد القادر کان (تقریباً 1726–1807)، سالوم کے توروڈبے عالم اور قاضی، جو 1776 میں سلیمان بال کے جانشین کے طور پر فوٹا ٹورو کی اسلامی امامت کے پہلے المامی بنے۔ انھوں نے تیس برس حکومت کی: برکنا اور ترارزہ موروں کو شکست دی، اپنے علاقے سے فرانسیسی غلام تجارت کا راستہ بند کیا، 1796 میں بنژوئے کی شکست کے بعد قید ہوئے اور رہا ہوئے، اور فرانسیسی مقالے اور ویکی ڈیٹا کی تاریخ کے مطابق 1807 میں قتل ہوئے — جبکہ انگریزی مقالہ ان کی وفات 1806 میں گوریکی کی جنگ میں بتاتا ہے۔"

