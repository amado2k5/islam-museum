  note: "The manner and year of his death are genuinely contested between the sources. The French article states that he was assassinated on 4 April 1807 in a plot organised by the Jagoordo, the assembly of electors, and Wikidata's death value is the same day at day precision. The English article instead reports that in 1806, after repeated French raids, Bundu and Kaarta invaded Futa Toro and Abdul Kader was shot by the Almaami of Bundu on his prayer mat at the losing battle of Gouriki, and its summary line dates the death 26 April 1806. The record builds 4 April 1807 on the two agreeing sources and carries the English account here in full, under the status debated. The Hijri year 1222 is the tabular conversion of the built date, marked derived."
