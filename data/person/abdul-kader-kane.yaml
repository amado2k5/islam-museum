summary:
  ar: "عبد القادر كان ⁦(نحو 1726–1807)⁩، عالم وقاضٍ تورودبي من السالوم، صار سنة 1776 أول ألمامي لإمامة فوتا تورو الإسلامية خلفاً لسليمان بال، فحكم ثلاثين عاماً: هزم مور براكنة وترارزة، وصدّ الفرنسيين عن تجارة الرقيق عبر بلاده، وأُسر بعد هزيمة بونخوي سنة 1796 ثم أُطلق، وقُتل سنة 1807 فيما تقوله المقالة الفرنسية وويكي بيانات، بينما تجعل المقالة الإنجليزية مقتله في معركة غوريكي سنة 1806."
  en: "Abdul Kader Kane (c. 1726–1807), a Torodbe scholar and qadi from the Saloum who in 1776 became the first Almaami of the Islamic Imamate of Futa Toro, succeeding Sulayman Bal. He ruled for thirty years: he defeated the Brakna and Trarza Moors, barred the French slave trade through his state, was captured after the Bunxoy disaster of 1796 and released, and was killed in 1807 on the French article's and Wikidata's dating — the English article instead places his death at the battle of Gouriki in 1806."
  fr: "Abdul Kader Kane (v. 1726–1807), savant et cadi torodbe du Saloum qui devint en 1776 le premier almamy de l'imamat islamique du Fouta-Toro, succédant à Sulayman Bal. Il régna trente ans : il vainquit les Maures Brakna et Trarza, interdit la traite française des esclaves à travers son État, fut capturé après le désastre de Bunxoy en 1796 puis libéré, et fut tué en 1807 selon la datation de l'article français et de Wikidata — l'article anglais place au contraire sa mort à la bataille de Gouriki en 1806."
  ur: "عبد القادر کان ⁦(تقریباً 1726–1807)⁩، سالوم کے توروڈبے عالم اور قاضی، جو 1776 میں سلیمان بال کے جانشین کے طور پر فوٹا ٹورو کی اسلامی امامت کے پہلے المامی بنے۔ انھوں نے تیس برس حکومت کی: برکنا اور ترارزہ موروں کو شکست دی، اپنے علاقے سے فرانسیسی غلام تجارت کا راستہ بند کیا، 1796 میں بنژوئے کی شکست کے بعد قید ہوئے اور رہا ہوئے، اور فرانسیسی مقالے اور ویکی ڈیٹا کی تاریخ کے مطابق 1807 میں قتل ہوئے — جبکہ انگریزی مقالہ ان کی وفات 1806 میں گوریکی کی جنگ میں بتاتا ہے۔"
  es: "Abdul Kader Kane (c. 1726–1807), un erudito torodbe y cadí de Saloum, se convirtió en 1776 en el primer Almaami del Imamato Islámico de Futa Toro, sucediendo a Sulayman Bal. Gobernó durante treinta años: derrotó a los moros brakna y trarza, prohibió el comercio francés de esclavos a través de su estado, fue capturado tras el desastre de Bunxoy en 1796 y liberado, y murió en 1807 según la fecha del artículo francés y de Wikidata; el artículo en inglés, en cambio, sitúa su muerte en la batalla de Gouriki en 1806."
  tr: "Abdülkadir Kane (yaklaşık 1726–1807), Saloum kabilesinden bir alim ve kadı olup, 1776 yılında Süleyman Bal'ın yerine geçerek İslami Futa Toro'nun ilk imamı oldu. Otuz yıl boyunca hüküm sürdü: Brakna ve Trarza'daki Mağribileri yendi, Fransızların ülkesinden geçen köle ticaretini püskürttü, 1796'da Bonkhoy yenilgisinden sonra esir alındı, ardından serbest bırakıldı ve Fransızca makaleye ve Wikidata'ya göre 1807'de öldürüldü; İngilizce makale ise ölümünü 1806'daki Goriki Muharebesi'nde gerçekleştiğini belirtiyor."
  id: "Abd al-Qadir Kane (sekitar 1726–1807), seorang cendekiawan dan hakim dari suku Saloum, menjadi Imam pertama Futa Toro Islam pada tahun 1776, menggantikan Sulayman Bal. Ia memerintah selama tiga puluh tahun: ia mengalahkan bangsa Moor di Brakna dan Trarza, mengusir Prancis dari perdagangan budak melalui negaranya, ditangkap setelah kekalahan Bonkhoy pada tahun 1796, kemudian dibebaskan, dan terbunuh pada tahun 1807, menurut artikel Prancis dan Wikidata, sementara artikel Inggris menyebutkan kematiannya dalam Pertempuran Goriki pada tahun 1806."

