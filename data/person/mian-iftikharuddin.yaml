summary:
  ar: "سياسي وصحفي باكستاني (1907–1962) من أسرة ميان في باغبانبورا بلاهور، أمناء بساتين شاليمار. ترأس فرع حزب المؤتمر في البنجاب ثم انضم إلى الرابطة الإسلامية سنة 1945، وصار وزير البنجاب لإعادة توطين اللاجئين، وأسس عبر «بروغريسيف بيبرز» صحف باكستان تايمز وإمروز وليل ونهار ذات التوجه التقدمي."
  en: "Pakistani politician and newspaper founder (1907–1962) of Lahore's Mian family of Baghbanpura, custodians of the Shalimar Gardens. He presided over the Punjab Congress, joined the Muslim League in 1945, served as Punjab's minister for the rehabilitation of refugees, and founded the progressive newspapers The Pakistan Times, Imroze and Lail-o-Nahar through Progressive Papers."
  ur: "پاکستانی سیاست دان و اخبار نویس (1907ء–1962ء) جن کا تعلق لاہور کے باغبانپورہ کے میاں خاندان، شالیمار باغ کے نگرانوں، سے تھا۔ پنجاب کانگریس کے صدر رہے، 1945ء میں مسلم لیگ میں شامل ہوئے، پنجاب کے وزیرِ بحالیاتِ مہاجرین بنے، اور پروگریسو پیپرز کے ذریعے ترقی پسند اخبارات پاکستان ٹائمز، امروز اور لیل و نہار جاری کیے۔"
