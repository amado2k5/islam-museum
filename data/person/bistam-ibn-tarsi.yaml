summary:
  ar: "دهقان بابل وخطرنية؛ أسلم بعد فتح السواد فلم يعرض له عمر ولم يخرج الأرض من يده وأزال الجزية عن رقبته."
  en: "dihqan of Babil and Khutarniyya; converted after the Sawad's conquest — Umar left his land in his hand and lifted the jizya."
  es: "Dihqan de Babil y Khutarniyya; convertido después de la conquista de Sawad: Umar dejó su tierra en sus manos y levantó la jizya."
  fr: "dihqan de Babil et Khutarniyya; converti après la conquête des Sawad — Umar a laissé sa terre entre ses mains et a levé la jizya."
  ur: "بابل اور خترنیہ کے دہقان؛ سواد کی فتح کے بعد تبدیل ہوا - عمر نے اپنی زمین اس کے ہاتھ میں چھوڑی اور جزیہ اٹھا لیا۔"
  tr: "Babil ve Khatarniyya'nın köylüleri; El-Sawad'ın fethinden sonra İslam'a geçti, bu yüzden Ömer ona boyun eğmedi, toprağı elinden almadı, boynundan cizyeyi de çıkarmadı."
  id: "Para petani Babilonia dan Khatarniyya; ia memeluk Islam setelah penaklukan Al-Sawad, sehingga Umar tidak tunduk kepadanya, ia juga tidak mengambil tanah dari tangannya, juga tidak mengambil jizya dari lehernya."
