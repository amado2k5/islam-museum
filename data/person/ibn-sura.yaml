summary:
  ar: "الوجيه أبو الفتوح ناصر بن أبي الحسن علي بن خلف الأنصاري المعروف بابن صورة؛ سمسار الكتب بمصر وله في ذلك حظ كبير؛ كان يعقد مجلساً في دهليز داره يومي الأحد والأربعاء يجتمع عنده أعيان الرؤساء والفضلاء وتُعرض عليهم الكتب التي تُباع إلى انقضاء وقت السوق؛ فلما مات السلفي سار إلى الإسكندرية لبيع كتبه {cite:wafayat-ayan}."
  en: "Abu al-Futuh Nasir b. Ali b. Khalaf al-Ansari, 'Ibn Sura' (d. 607) — Cairo's celebrated book auctioneer; his Sunday and Wednesday sales drew the city's notables and scholars; he traveled to Alexandria to auction al-Silafi's library {cite:wafayat-ayan}."
