summary:
  ar: "الوجيه أبو الفتوح ناصر بن أبي الحسن علي بن خلف الأنصاري المعروف بابن صورة؛ سمسار الكتب بمصر وله في ذلك حظ كبير؛ كان يعقد مجلساً في دهليز داره يومي الأحد والأربعاء يجتمع عنده أعيان الرؤساء والفضلاء وتُعرض عليهم الكتب التي تُباع إلى انقضاء وقت السوق؛ فلما مات السلفي سار إلى الإسكندرية لبيع كتبه {cite:wafayat-ayan}."
  en: "Abu al-Futuh Nasir b. Ali b. Khalaf al-Ansari, 'Ibn Sura' (d. 607) — Cairo's celebrated book auctioneer; his Sunday and Wednesday sales drew the city's notables and scholars; he traveled to Alexandria to auction al-Silafi's library {cite:wafayat-ayan}."
  es: "Abu al-Futuh Nasir b. Ali b. Khalaf al-Ansari, 'Ibn Sura' (m. 607) — El célebre subastador de libros de El Cairo; sus ventas de los domingos y miércoles atraían a notables y eruditos de la ciudad; viajó a Alejandría para subastar la biblioteca de al-Silafi {cite:wafayat-ayan}."
  fr: "Abu al-Futuh Nasir b. Ali b. Khalaf al-Ansari, 'Ibn Sura' (d. 607) — le célèbre commissaire-priseur de livres du Caire; ses ventes du dimanche et du mercredi attiraient les notables et les érudits de la ville; il s'est rendu à Alexandrie pour vendre aux enchères la bibliothèque d'al-Silafi {cite:wafayat-ayan}."
  ur: "ابو الفتوح ناصر ب۔ علی بی خلف الانصاری، 'ابن سورہ' ⁦(متوفی 607)⁩ - قاہرہ کا مشہور کتاب نیلام کرنے والا؛ اس کی اتوار اور بدھ کی فروخت نے شہر کے معززین اور علماء کو اپنی طرف متوجہ کیا۔ اس نے السلفی کی لائبریری کو نیلام کرنے کے لیے اسکندریہ کا سفر کیا۔"
