summary:
  ar: "\u0642\u0627\u0631\u0626 \u0648\u0625\u0645\u0627\u0645 \u064a\u0645\u0646\u064a \u2066(\u0648\u064f\u0644\u062f 1980)\u2069 \u062a\u062e\u0631\u0651\u062c \u0641\u064a \u062d\u0644\u0642\u0627\u062a \u0627\u0644\u062a\u062d\u0641\u064a\u0638 \u0628\u062c\u0627\u0645\u0639 \u0628\u0644\u0627\u0644 \u0628\u0646 \u0631\u0628\u0627\u062d \u0641\u064a \u0635\u0646\u0639\u0627\u0621 \u0648\u0623\u0645\u0651 \u0641\u064a\u0647 \u0627\u0644\u062a\u0631\u0627\u0648\u064a\u062d \u0645\u0646 1994\u060c \u0648\u0633\u062c\u0651\u0644 \u0627\u0644\u0645\u0635\u062d\u0641 \u0643\u0627\u0645\u0644\u064b\u0627 \u0641\u064a \u0627\u0644\u064a\u0645\u0646\u060c \u0648\u064a\u0624\u0645\u0651 \u0645\u0646\u0630 2006 \u0641\u064a \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0634\u0631\u0642\u064a\u0629 \u0628\u0627\u0644\u0633\u0639\u0648\u062f\u064a\u0629\u060c \u0648\u062a\u064f\u0630\u0627\u0639 \u0642\u0631\u0627\u0621\u062a\u0647 \u0639\u0644\u0649 \u0642\u0646\u0627\u0629 \u0627\u0644\u0645\u062c\u062f \u0644\u0644\u0642\u0631\u0622\u0646."
  en: "Yemeni reciter and imam (born 1980) who came out of the memorisation circles of the Bilal ibn Rabah Mosque in Sanaa, led the tarawih there from 1994, recorded the complete Qur'an in Yemen and has led prayers in Saudi Arabia's Eastern Province since 2006; his recitation is broadcast on Al-Majd Quran channel."
  ur: "\u06cc\u0645\u0646\u06cc \u0642\u0627\u0631\u06cc \u0627\u0648\u0631 \u0627\u0645\u0627\u0645 \u2066(\u067e\u06cc\u062f\u0627\u0626\u0634 1980\u0621)\u2069\u060c \u062c\u0648 \u0635\u0646\u0639\u0627\u0621 \u06a9\u06cc \u062c\u0627\u0645\u0639 \u0628\u0644\u0627\u0644 \u0628\u0646 \u0631\u0628\u0627\u062d \u06a9\u06d2 \u062d\u0641\u0638 \u06a9\u06d2 \u062d\u0644\u0642\u0648\u06ba \u0633\u06d2 \u0646\u06a9\u0644\u06d2\u060c 1994\u0621 \u0633\u06d2 \u0648\u06c1\u0627\u06ba \u062a\u0631\u0627\u0648\u06cc\u062d \u067e\u0691\u06be\u0627\u0626\u06cc\u060c \u06cc\u0645\u0646 \u0645\u06cc\u06ba \u0645\u06a9\u0645\u0644 \u0642\u0631\u0622\u0646 \u0631\u06cc\u06a9\u0627\u0631\u0688 \u06a9\u06cc\u0627 \u0627\u0648\u0631 2006\u0621 \u0633\u06d2 \u0633\u0639\u0648\u062f\u06cc \u0639\u0631\u0628 \u06a9\u06d2 \u0645\u0634\u0631\u0642\u06cc \u0635\u0648\u0628\u06d2 \u0645\u06cc\u06ba \u0627\u0645\u0627\u0645\u062a \u06a9\u0631 \u0631\u06c1\u06d2 \u06c1\u06cc\u06ba\u061b \u0627\u0646 \u06a9\u06cc \u062a\u0644\u0627\u0648\u062a \u0627\u0644\u0645\u062c\u062f \u0642\u0631\u0622\u0646 \u0686\u06cc\u0646\u0644 \u067e\u0631 \u0646\u0634\u0631 \u06c1\u0648\u062a\u06cc \u06c1\u06d2\u06d4"
