summary:
  ar: "قارئ وإمام يمني ⁦(وُلد 1980)⁩ تخرّج في حلقات التحفيظ بجامع بلال بن رباح في صنعاء وأمّ فيه التراويح من 1994، وسجّل المصحف كاملًا في اليمن، ويؤمّ منذ 2006 في المنطقة الشرقية بالسعودية، وتُذاع قراءته على قناة المجد للقرآن."
  en: "Yemeni reciter and imam (born 1980) who came out of the memorisation circles of the Bilal ibn Rabah Mosque in Sanaa, led the tarawih there from 1994, recorded the complete Qur'an in Yemen and has led prayers in Saudi Arabia's Eastern Province since 2006; his recitation is broadcast on Al-Majd Quran channel."
  ur: "یمنی قاری اور امام ⁦(پیدائش 1980ء)⁩، جو صنعاء کی جامع بلال بن رباح کے حفظ کے حلقوں سے نکلے، 1994ء سے وہاں تراویح پڑھائی، یمن میں مکمل قرآن ریکارڈ کیا اور 2006ء سے سعودی عرب کے مشرقی صوبے میں امامت کر رہے ہیں؛ ان کی تلاوت المجد قرآن چینل پر نشر ہوتی ہے۔"
  es: "Recitador e imán yemení (nacido en 1980) que surgió de los círculos de memorización de la mezquita Bilal ibn Rabah en Sanaa, dirigió las oraciones de tarawih allí desde 1994, grabó el Corán completo en Yemen y ha dirigido oraciones en la Provincia Oriental de Arabia Saudita desde 2006; su recitación se transmite por el canal Al-Majd Quran."
  fr: "Récitateur et imam yéménite (né en 1980) issu des cercles de mémorisation de la mosquée Bilal ibn Rabah à Sanaa, a dirigé les prières de tarawih depuis 1994, a enregistré le Coran complet au Yémen et dirige les prières dans la province orientale d'Arabie saoudite depuis 2006; sa récitation est diffusée sur la chaîne Al-Majd Quran."
  tr: "Yemenli bir isimam ve dindar (1980 doğumlu), Sana'a'daki Bilal bin Rabah Camii'nde ezber çevrelerinden mezun oldu ve 1994'te orada teravih namazlarını yönetti. Yemen'de tüm Kur'an'ı kaydetti ve 2006'dan beri Suudi Arabistan'ın Doğu Eyaleti'nde namazları yönetiyor. Onun ilavetleri Al-Majd Kur'an Kanalı'nda yayınlanmaktadır."
  id: "Sebagai pembaca dan imam Yaman (lahir 1980), ia lulus dari lingkaran hafalan di Masjid Bilal bin Rabah di Sana'a dan memimpin shalat Taraweeh di sana pada tahun 1994. Ia merekam seluruh Al-Quran di Yaman dan telah memimpin shalat sejak 2006 di Provinsi Timur Arab Saudi. Bacaannya disiarkan di Saluran Al-Majd Quran."
