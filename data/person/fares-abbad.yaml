summary:
  ar: "قارئ وإمام يمني ⁦(وُلد 1980)⁩ تخرّج في حلقات التحفيظ بجامع بلال بن رباح في صنعاء وأمّ فيه التراويح من 1994، وسجّل المصحف كاملًا في اليمن، ويؤمّ منذ 2006 في المنطقة الشرقية بالسعودية، وتُذاع قراءته على قناة المجد للقرآن."
  en: "Yemeni reciter and imam (born 1980) who came out of the memorisation circles of the Bilal ibn Rabah Mosque in Sanaa, led the tarawih there from 1994, recorded the complete Qur'an in Yemen and has led prayers in Saudi Arabia's Eastern Province since 2006; his recitation is broadcast on Al-Majd Quran channel."
  ur: "یمنی قاری اور امام ⁦(پیدائش 1980ء)⁩، جو صنعاء کی جامع بلال بن رباح کے حفظ کے حلقوں سے نکلے، 1994ء سے وہاں تراویح پڑھائی، یمن میں مکمل قرآن ریکارڈ کیا اور 2006ء سے سعودی عرب کے مشرقی صوبے میں امامت کر رہے ہیں؛ ان کی تلاوت المجد قرآن چینل پر نشر ہوتی ہے۔"
