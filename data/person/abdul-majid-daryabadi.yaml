summary:
  ar: "عالم وكاتب ومفسّر هندي (1892–1977) من درياباد في بارابنكي، صاحب «تفسير ماجدي» بالأردية والإنجليزية ومحرّر أسبوعية «صدق جديد» حتى وفاته. مرّ في شبابه بفترة عقلانية ولاأدرية نحو 1909–1918 ثم عاد إلى الإسلام، وأخذ البيعة عن أشرف علي التهانوي سنة 1928 وجددها عند حسين أحمد المدني، وكتب أكثر من سبعين كتابًا في التفسير والسيرة والفلسفة وعلم النفس."
  en: "Indian scholar, writer and exegete (1892–1977) of Daryabad in Barabanki district, author of the Tafsir-e-Majidi in Urdu and English and editor of the weekly Sidq-e-Jadid until his death. In his youth he passed through a rationalist and agnostic period, about 1909–1918, then returned to Islam, took the oath of allegiance from Ashraf Ali Thanwi in 1928 and renewed it under Hussain Ahmad Madani, and wrote more than seventy books on exegesis, biography, philosophy and psychology."
  ur: "بھارتی عالم، ادیب و مفسر (1892ء–1977ء) جن کا تعلق بارہ بنکی کے دریا آباد سے تھا، اردو و انگریزی «تفسیر ماجدی» کے مصنف اور ہفت روزہ «صدق جدید» کے تاحیات مدیر۔ نوجوانی میں تقریباً 1909ء–1918ء عقل پرستی و لاادریت کے دور سے گزرے پھر اسلام کی طرف لوٹ آئے، 1928ء میں اشرف علی تھانوی سے بیعت کی اور حسین احمد مدنی کے ہاتھ پر اس کی تجدید کی، اور تفسیر، سیرت، فلسفہ و نفسیات پر ستر سے زائد کتابیں لکھیں۔"
