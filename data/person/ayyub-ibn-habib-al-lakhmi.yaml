summary:
  ar: "ابن أخت موسى بن نصير، اجتمع عليه أهل الأندلس بعد مقتل عبد العزيز بن موسى سنة 97هـ، بعد فترة من الاضطراب، وكان رجلاً صالحاً فاضلاً، ولم تطل ولايته، ويذكر الكتاب أن أهل الأندلس نصّبوه ليدبر الأمور حتى يُعيَّن والٍ من قبل الخلافة {cite:salabi-umayyad-state-2020 p.83}."
  tr: "Musa bin Nusayr'ın yeğeni, 97 H yılında Abdulaziz ibn Musa'nın öldürülmesinden sonra, bir çalkantı döneminin ardından Endülüs halkı, etrafında toplandı. O, doğru ve erdemli bir adamdı ve yönetimi uzun sürmedi. Kitapta, el-Endülüs halkının onu işleri yönetmek üzere atadığı ve halifelik tarafından vali olarak atandığı belirtilir {cite:salabi-umayyad-state-2020 s.83}."
  id: "Keponakan Musa ibn Nusayr, masyarakat al-Andalus berkumpul di sekitarnya setelah pembunuhan Abdul Aziz ibn Musa pada tahun 97 H, setelah masa gejolak. Ia adalah orang yang benar dan berbudi luhur, dan pemerintahannya tidak bertahan lama. Buku tersebut menyebutkan bahwa rakyat al-Andalus menunjuknya untuk mengelola urusan hingga ia diangkat sebagai gubernur oleh kekhalifahan {cite:salabi-umayyad-state-2020 hlm.83}."
