summary:
  ar: "محمود بن غيلان المروزي، أبو أحمد العدوي مولاهم، وصفه الذهبي بالإمام الحافظ الحجة من أئمة الأثر، وروى عنه أصحاب الكتب الستة سوى أبي داود؛ ورجّح الذهبي أن وفاته في رمضان سنة 239 هـ."
  en: "Mahmud ibn Ghaylan al-Marwazi, Abu Ahmad al-Adawi by clientage, whom al-Dhahabi calls the imam, memoriser and proof, one of the leading men of the transmitted reports, and from whom the compilers of the six books except Abu Dawud narrated; al-Dhahabi holds that he died in Ramadan 239 AH."
  es: "Mahmud ibn Ghaylan al-Marwazi, Abu Ahmad al-Adawi por clientelismo, a quien al-Dhahabi llama el imán, memorizador y verificador, uno de los principales hombres de los informes transmitidos, y de quien narraron los compiladores de los seis libros excepto Abu Dawud; al-Dhahabi sostiene que murió en Ramadán 239 AH."
  fr: "Mahmud ibn Ghaylan al-Marwazi, fils d'Abu Ahmad al-Adawi, que al-Dhahabi appelle l'imam, mémorisateur et témoin, l'un des principaux hommes des rapports transmis, et de qui les compilateurs des six livres, à l'exception d'Abu Dawud, ont rapporté; al-Dhahabi soutient qu'il est mort en Ramadan 239 AH."
  ur: "محمود بن غیلان المروازی، ابو احمد العدوی بذریعہ مؤکل، جنہیں الذہبی نے امام، حافظ اور ثبوت کہا ہے، نقل شدہ رپورٹوں کے سرکردہ افراد میں سے ایک ہیں، اور جن سے ابوداؤد کے علاوہ چھ کتابوں کے مرتب کرنے والوں نے روایت کی ہے۔ الذہبی کا خیال ہے کہ ان کی وفات رمضان المبارک 239 ہجری میں ہوئی۔"
  tr: "Mahmud bin Ghalan al-Marwazi, Ebu Ahmed el-Adavi, onların özgür bırakılmış, el-Dhahabi tarafından imam, ezberleyen ve kanıt olarak tanımlanmıştır; bu kanıt, altı kitabın yazarları tarafından Ebu Davud hariç anlatılmıştır; el-Dahabi, onun 239 Hicri yılında Ramazan'da öldüğünü öne sürmüştür."
  id: "Mahmoud ibn Ghailan al-Marwazi, Abu Ahmad al-Adawi, mantan mereka, digambarkan oleh al-Dhahabi sebagai Imam, pengapal, dan bukti, salah satu tradisi utama, yang diceritakan darinya oleh penulis enam kitab kecuali Abu Dawood; al-Dhahabi menyatakan bahwa ia meninggal pada Ramadan tahun 239 H."
