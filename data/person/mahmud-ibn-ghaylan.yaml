  ar: "محمود بن غيلان المروزي، أبو أحمد العدوي مولاهم، وصفه الذهبي بالإمام الحافظ الحجة من أئمة الأثر، وروى عنه أصحاب الكتب الستة سوى أبي داود؛ ورجّح الذهبي أن وفاته في رمضان سنة 239 هـ."
