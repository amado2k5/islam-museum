    ar: "أحمد زويل الكيميائي المصري أسس علم كيمياء الفيمتو ولُقّب أبا كيمياء الفيمتو، ونال نوبل الكيمياء سنة ١٩٩٩ منفرداً فكان أول مصري وعربي ينالها في العلوم."
    en: "Ahmed Zewail, the Egyptian chemist who founded femtochemistry — 'the father of femtochemistry' — took the 1999 Nobel in chemistry alone, the first Egyptian and Arab to win one in the sciences."
