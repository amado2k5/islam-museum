summary:
  ar: "كيميائي مصري أمريكي، وُلد في دمنهور سنة 1946 ونشأ في دسوق ودرس في جامعة الإسكندرية، وأسس علم كيمياء الفيمتو حتى لُقّب «أبو كيمياء الفيمتو»، ونال جائزة نوبل في الكيمياء سنة 1999 منفردا فكان أول مصري وعربي ينال جائزة نوبل في فرع علمي، وأسس مدينة زويل للعلوم والتكنولوجيا، وتوفي سنة 2016."
  en: "Egyptian-American chemist, born in Damanhur in 1946, raised in Desouk and educated at Alexandria University. He founded femtochemistry and was known as the 'father of femtochemistry'; he received the 1999 Nobel Prize in Chemistry alone, the first Egyptian and Arab to win a Nobel Prize in a scientific field, founded the Zewail City of Science and Technology, and died in 2016."
  ur: "مصری نژاد امریکی کیمیا دان، جو 1946 میں دمنھور میں پیدا ہوئے، دسوق میں پلے بڑھے اور جامعہ اسکندریہ سے تعلیم پائی۔ انہوں نے فیمٹو کیمسٹری کی بنیاد رکھی اور «فیمٹو کیمسٹری کے بانی» کہلائے؛ 1999 میں تنہا کیمسٹری کا نوبل انعام پایا، جو کسی سائنسی شعبے میں نوبل پانے والے پہلے مصری اور عرب بنے، زویل سٹی آف سائنس اینڈ ٹیکنالوجی قائم کی، اور 2016 میں وفات پائی۔"
