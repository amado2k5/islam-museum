summary:
  ar: "بكلربك الجزائر من صفر ٩٦٠هـ/يناير ١٥٥٢م خلفاً لحسن بن خير الدين. عمل داخلياً على تحقيق الوحدة التامة بين أجزاء الجزائر وإخضاع الصحراء إليها ليتفرغ للأندلس، وخارجياً على إبعاد الأسبان نهائياً ووضع حد لمشاغبات الدولة السعدية وإعلان الجهاد العام نحو الأندلس. فأخضع الإمارات المستقلة، ووقف مع أبي حسون الوطاسي ضد السعديين فدخلت القوات العثمانية فاس في ٣ صفر ٩٦١هـ/٨ يناير ١٥٥٤م ⁦(النص المطبوع «٩٦٤هـ»)⁩ وأعلن الباب العالي ضم المغرب، ومكث في فاس أربعة أشهر استرجع خلالها باديس من الأسبان وحاول استبدال بوحسون بالشريف الإدريسي مولاي بوبكر قبل أن تضطره ثورة الأهالي لإعادته بشروط الحفاظ على السيادة العثمانية. ولما اكتشفت المخابرات العثمانية مؤامرة السعديين مع أسبانيا أرسل السلطان أربعين سفينة وأمر بمهاجمة وهران؛ استعد لها بنحو سبعين سفينة وأربعين ألف جند لكنه توفي بالطاعون في رجب ٩٦٣هـ/١٥٥٦م عن سبعين سنة {cite:dawlat-uthmaniyya-salabi p. 235-243}."
  en: "Beylerbey of Algiers from Safar 960/January 1552. Internally he sought complete unity of all Algeria, the Sahara included, to be free for al-Andalus; externally to expel Spain, fence off Sa'di trouble, and proclaim general jihad toward al-Andalus. Backing the Wattasid Bu Hasun, Ottoman forces entered Fez 3 Safar 961/8 January 1554 (the printed text reads 964) and the Porte declared Morocco annexed; in four months there he recovered Badis from Spain and tried replacing Bu Hasun with the Idrisi sharif Mawlay Bu Bakr before the people's rising forced him back under Ottoman suzerainty terms. When Ottoman intelligence uncovered the Sa'di-Spanish plot, Süleyman sent forty ships and ordered Oran attacked; Salih readied seventy ships and forty thousand men, but died of plague in Rajab 963/1556, aged seventy {cite:dawlat-uthmaniyya-salabi p. 235-243}."
  ur: "الجزائر کا عثمانی بیگلربیگی؛ ابو حسون کی حمایت میں فاس کی مہم چلائی، اور وهران کی مہم کی تیاری کے دوران طاعون سے وفات پائی۔ {cite:dawlat-uthmaniyya-salabi}"
  es: "Beylerbey de Argel desde Safar 960/enero de 1552. Internamente buscaba la unidad completa de toda Argelia, incluido el Sahara, para que fuera libre para al-Ándalus; externamente expulsar a España, contener los problemas sa'díes y proclamar la yihad general hacia al-Ándalus. Apoyando al Wattasí Bu Hasun, las fuerzas otomanas entraron en Fez el 3 de Safar 961/8 de enero de 1554 (el texto impreso dice 964) y la Sublime Puerta declaró anexionado Marruecos; en cuatro meses allí recuperó Badis de España e intentó reemplazar a Bu Hasun con el sharif Idrisi Mawlay Bu Bakr antes de que el levantamiento popular lo obligara a regresar bajo los términos de la soberanía otomana. Cuando la inteligencia otomana descubrió la conspiración sa'dí-española, Solimán envió cuarenta barcos y ordenó atacar Orán; Salih preparó setenta barcos y cuarenta mil hombres, pero murió de peste en Rajab 963/1556, a la edad de setenta años {cite:dawlat-uthmaniyya-salabi p. 235-243}."
  fr: "Beylerbey d'Alger à partir du 3 Safar 960/janvier 1552. Sur le plan intérieur, il œuvrait à l'unification complète de toute l'Algérie, Sahara compris, afin qu'elle soit libre pour al-Andalus; sur le plan extérieur, il cherchait à expulser l'Espagne, à contenir les troubles saadiens et à proclamer le jihad général vers al-Andalus. Soutenant le Wattasid Bu Hasun, les forces ottomanes entrèrent à Fès le 3 Safar 961/8 janvier 1554 (le texte imprimé indique 964) et la Sublime Porte déclara le Maroc annexé; en quatre mois, il reprit Badis aux Espagnols et tenta de remplacer Bu Hasun par l'Idrisi Sharif Mawlay Bu Bakr avant que le soulèvement populaire ne le contraigne à se soumettre à la suzeraineté ottomane. Lorsque les services de renseignement ottomans découvrirent le complot saadien-espagnol, Soliman envoya quarante navires et ordonna l'attaque d'Oran. Salih prépara soixante-dix navires et quarante mille hommes, mais mourut de la peste en Rajab 963/1556, à l'âge de soixante-dix ans {cite:dawlat-uthmaniyya-salabi p. 235-243}."
