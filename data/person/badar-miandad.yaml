summary:
  ar: "قوّال باكستاني (1962–2007) من أسرة قوالين في باكپتن، ابن عم نصرت فتح علي خان وصهره، بدأ في 1975 وصار من أشهر القوالين في منتصف الثمانينيات، ولحّن لأفلام هندية وباكستانية، واشتهر بـ«دم دم حسین مولا حسین» و«گنج شکر والیاں دا راجا»، وجرّب مزج القوالي بالإيقاعات الحديثة."
  en: "Pakistani qawwal (1962–2007) of a qawwal family of Pakpattan, cousin and brother-in-law of Nusrat Fateh Ali Khan, who began in 1975, was among Pakistan's best-known qawwals by the mid-1980s, scored Indian and Pakistani films, was known for 'Dam Dam Hussain Maula Hussain' and 'Ganj Shakar Walian Da Raja', and experimented with qawwali fusion."
  ur: "پاکپتن کے قوال خاندان سے پاکستانی قوال ⁦(1962ء–2007ء)⁩، نصرت فتح علی خان کے چچا زاد اور برادرِ نسبتی، جنھوں نے 1975ء میں آغاز کیا، اسّی کی دہائی کے وسط تک پاکستان کے معروف قوالوں میں شمار ہوئے، ہندوستانی اور پاکستانی فلموں کی موسیقی دی، «دم دم حسین مولا حسین» اور «گنج شکر ولیاں دا راجا» سے مشہور ہوئے، اور قوالی کے فیوژن کے تجربے کیے۔"
