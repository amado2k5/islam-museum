summary:
  ar: "عالم هندي (1878–1926) من فرنجي محل في لكهنؤ، ألّف 111 كتابًا في الحديث والتفسير والفقه والتصوف وغيرها. أسس مدرسة نظامية لكهنؤ وجمعية خدام الكعبة (1914)، وكان عضوًا مؤسسًا في دار المصنفين (أكاديمية شبلي) وفي الجامعة الملية الإسلامية (1920). نشط في حركة الخلافة، وأصدر فتوى بالجهاد ضد الإنجليز، ودعا إلى الوحدة بين الهندوس والمسلمين، وكان من مراسلي غاندي ومحترميه."
  en: "Indian scholar (1878–1926) of Firangi Mahal in Lucknow, author of 111 books across hadith, exegesis, jurisprudence, Sufism and other fields. He founded Lucknow's Madarsa-i-Nizamia and the Anjuman-i-Khuddam-i-Kabba (1914), and was a founder member of Darul Musannefin (the Shibli Academy) and of Jamia Millia Islamia (1920). Active in the Khilafat movement, he issued a fatwa of jihad against the British, preached Hindu-Muslim unity, and corresponded with Gandhi, who held him in regard."
  ur: "ہندوستانی عالم (1878ء–1926ء) جن کا تعلق لکھنؤ کے فرنگی محل سے تھا اور جنھوں نے حدیث، تفسیر، فقہ، تصوف اور دیگر علوم میں 111 کتابیں لکھیں۔ لکھنؤ میں مدرسہ نظامیہ اور انجمن خدام کعبہ (1914ء) قائم کی، دار المصنفین شبلی اکیڈمی اور جامعہ ملیہ اسلامیہ (1920ء) کے بانی ارکان میں سے تھے۔ تحریک خلافت میں سرگرم رہے، انگریزوں کے خلاف جہاد کا فتویٰ دیا، ہندو مسلم اتحاد کی دعوت دی، اور گاندھی جی سے خط کتابت اور احترام کا رشتہ رکھا۔"
