roles: [judge, statesman, scholar]
gender: male
summary:
  ar: "محمد قدري باشا، من رجال القضاء في مصر، ولد في ملوي سنة 1237 هـ الموافقة 1821 م، مربي ولي عهد الخديوي ثم ناظر الحقانية ووزير المعارف، وصاحب «مرشد الحيران»، توفي بالقاهرة سنة 1306 هـ الموافقة 1888 م."
  en: "Muhammad Qadri Pasha, an Egyptian jurist born in Mallawi in 1237 AH (1821 CE), tutor to the khedive's heir, then minister of justice and of education; author of Murshid al-Hayran; died in Cairo in 1306 AH (1888 CE)."
  es: "Muhammad Qadri Pasha, jurista egipcio nacido en Mallawi en 1237 AH (1821 d. C.), tutor del heredero del jedive, luego ministro de justicia y de educación; autor de Murshid al-Hayran; murió en El Cairo en 1306 AH (1888 d. C.)."
  fr: "Muhammad Qadri Pacha, juriste égyptien né à Mallawi en 1237 AH (1821 CE), précepteur de l'héritier du khédive, puis ministre de la justice et de l'éducation; auteur de Murshid al-Hayran; mort au Caire en 1306 AH (1888 CE)."
  ur: "محمد قادری پاشا، ایک مصری فقیہ جو 1237 ہجری ⁦(1821 عیسوی)⁩ میں ملاوی میں پیدا ہوئے، کھیڈیو کے وارث کے ٹیوٹر، اس وقت کے وزیر انصاف اور تعلیم؛ مرشد الحیران کے مصنف؛ 1306ھ ⁦(1888ء)⁩ میں قاہرہ میں وفات پائی۔"
  tr: "Mısır'daki yargıçlardan biri olan Muhammed Kadri Paşa, 1237 Hicri yılında (1821 M.S.'ye karşılık gelir) Malavi'de doğmuştur; Hediv'in veliaht prensi, o dönemde Haqqaniyya'nın denetçisi, Eğitim Bakanı ve 'Murşid el-Hirran'ın yazarıdır. 1306 Hicri yılında, yani 1888 yılında Kahire'de öldü."
  id: "Muhammad Qadri Pasha, salah satu hakim di Mesir, lahir di Mallawi pada tahun 1237 H (setara dengan 1821 M), adalah mentor Putra Mahkota Khediv, kemudian pengawas Haqqaniyya, Menteri Pendidikan, dan penulis 'Murshid al-Hirran.' Ia meninggal di Kairo pada tahun 1306 H, yang bertepatan dengan tahun 1888 M."
