summary:
  ar: 'فلكي ومهندس وصانع آلات من عُرْض في بادية الشام ⁦(وُلد نحو 1200، توفي
    بمراغة نحو 1266)⁩؛ عمل بدمشق قبل 1239 مهندساً ومعلماً للهندسة، وصنع في
    1252/1253 «الآلة الكاملة» للملك المنصور بحمص، ثم استدعاه نصير الدين
    الطوسي إلى مراغة فشارك في بناء المرصد وآلاته وأرصاد الزيج الإيلخاني.
    مصنفاه «رسالة الرصد» في آلات الرصد و«كتاب الهيئة» في الفلك النظري،
    وفيه قضيته الهندسية المعروفة بقضية العرضي {cite:schmidl-urdi-bea-2007}
    {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
  en: 'Astronomer, engineer and instrument maker from Urd in the Syrian
    desert (born c. 1200, died at Maragha c. 1266); worked at Damascus
    before 1239 as an engineer and teacher of geometry, built the
    so-called perfect instrument for al-Malik al-Mansur of Hims in
    1252/1253, then joined Nasir al-Din al-Tusi at Maragha where he helped
    build the observatory, its instruments and the Ilkhani Zij
    observations. His treatises are the Risalat al-Rasd on observational
    instruments and the Kitab al-Haya on theoretical astronomy, which
    contains the geometrical result known as the Urdi lemma
    {cite:schmidl-urdi-bea-2007} {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
  ur: 'بادیۂ شام کے عرض سے تعلق رکھنے والے ماہر فلکیات، انجینئر اور آلات
    ساز ⁦(پیدائش تقریباً 1200ء، وفات مراغہ تقریباً 1266ء)⁩؛ 1239ء سے پہلے
    دمشق میں انجینئر اور استادِ ہندسہ رہے، 1252/1253ء میں حمص کے الملک
    المنصور کے لیے «کامل آلہ» بنایا، پھر نصیر الدین طوسی کے بلانے پر مراغہ
    گئے جہاں رصدگاہ کی تعمیر، آلات اور زیجِ ایلخانی کے ارصاد میں شریک ہوئے۔
    تصانیف: رسالت الرصد ⁦(رصدی آلات)⁩ اور کتاب الھیئت ⁦(نظری فلکیات)⁩ جس میں ان
    کی ہندسی قضیہ، معروف بہ قضیۂ عرضی، ہے {cite:schmidl-urdi-bea-2007}
    {cite:wikipedia-muayyad-al-din-al-urdi-en}۔'
