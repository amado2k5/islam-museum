summary:
  ar: "فقيه الشام وشيخ الإسلام؛ تفقه على ابن الصلاح وابن عبد السلام وجلس للإشغال وله بضع وعشرون سنة وكتب على الفتاوى وله ثلاثون سنة، وكانت الفتاوى تأتيه من الأقطار، ومعظم قضاة الشام وما حولها تلامذته؛ قال الذهبي: انتهت إليه رئاسة المذهب في الدنيا وكان ممن بلغ رتبة الاجتهاد، وقال ابن قاضي شهبة: كان أفقه نفساً وأزكى قريحة من النووي وأكثر محفوظاً منه، وكان بينه وبين النووي وحشة؛ ودرّس بالبادرائية ودفن بمقبرة باب الصغير {cite:shadharat-dhahab p. 722-724}."
  en: "Syria's chief jurist — teaching at twenty-odd, writing responsa at thirty, fatwas arriving from every quarter and most of Syria's qadis his pupils; al-Dhahabi: 'the headship of the madhhab worldwide ended with him, a rank-of-ijtihad man'; Ibn Qadi Shuhba rated him subtler and better-stored than al-Nawawi {cite:shadharat-dhahab p. 722-724}."
