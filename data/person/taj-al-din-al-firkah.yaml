summary:
  ar: "فقيه الشام وشيخ الإسلام؛ تفقه على ابن الصلاح وابن عبد السلام وجلس للإشغال وله بضع وعشرون سنة وكتب على الفتاوى وله ثلاثون سنة، وكانت الفتاوى تأتيه من الأقطار، ومعظم قضاة الشام وما حولها تلامذته؛ قال الذهبي: انتهت إليه رئاسة المذهب في الدنيا وكان ممن بلغ رتبة الاجتهاد، وقال ابن قاضي شهبة: كان أفقه نفساً وأزكى قريحة من النووي وأكثر محفوظاً منه، وكان بينه وبين النووي وحشة؛ ودرّس بالبادرائية ودفن بمقبرة باب الصغير {cite:shadharat-dhahab p. 722-724}."
  en: "Syria's chief jurist — teaching at twenty-odd, writing responsa at thirty, fatwas arriving from every quarter and most of Syria's qadis his pupils; al-Dhahabi: 'the headship of the madhhab worldwide ended with him, a rank-of-ijtihad man'; Ibn Qadi Shuhba rated him subtler and better-stored than al-Nawawi {cite:shadharat-dhahab p. 722-724}."
  es: "El principal jurista de Siria: enseñaba a los veintitantos años, escribía responsa a los treinta, recibía fatuas de todas partes y la mayoría de los cadíes de Siria eran sus alumnos; al-Dhahabi: \"con él terminó la dirección de la madhhab en todo el mundo, un hombre de rango ijtihad\"; Ibn Qadi Shuhba lo consideró más sutil y con mejor memoria que al-Nawawi {cita: shadharat-dhahab págs. 722-724}."
  fr: "Le plus grand juriste de Syrie — enseignant à une vingtaine d'années, écrivant des responsa à trente ans, des fatwas arrivant de tous les horizons et la plupart des qadis de Syrie étant ses élèves; al-Dhahabi: « la direction du madhhab dans le monde s'est terminée avec lui, un homme de rang ijtihad »; Ibn Qadi Shuhba le considérait comme plus subtil et mieux conservé qu'al-Nawawi {cite: shadharat-dhahab p. 722-724}."
