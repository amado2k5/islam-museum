summary:
  ar: "بطاقة أولية لميري حسين باشا، الصدر الأعظم العثماني مرتين في عهد أحمد الأول ومصطفى الأول ⁦(١٦١٢–١٦٢٢م)⁩، توفي سنة ١٦٢٤م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Mere Huseyin Pasha, twice Ottoman grand vizier under Ahmed I and Mustafa I (1612–1622), d. 1624; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Mere Huseyin Pasha, dos veces gran visir otomano bajo Ahmed I y Mustafa I (1612–1622), fallecido en 1624; la entrada de la fuente aún no se ha verificado en la página."
  fr: "Carte de convocation pour Mere Huseyin Pacha, deux fois grand vizir ottoman sous Ahmed Ier et Mustafa Ier (1612-1622), décédé en 1624; la source n'est pas encore vérifiée sur la page."
  ur: "میرے حسین پاشا کے لیے ڈرافٹ کارڈ، احمد اول اور مصطفی اول (1612-1622) کے تحت دو مرتبہ عثمانی وزیر اعظم، ڈی۔ 1624; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Ahmed I ve Mustafa I döneminde iki kez Osmanlı Sadrazami olan Mir Hüseyin Paşa'nın (1612–1622) ön kartı; Osmanlı tarih kitaplarında anılmakta ve biyografisi henüz sayfada gözden geçirilmemiştir."
  id: "Kartu pendahuluan Mir Hussein Pasha, Wazir Agung Ottoman dua kali selama masa pemerintahan Ahmed I dan Mustafa I (1612–1622 M), yang meninggal pada tahun 1624 M; ia dikenang dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman tersebut."
