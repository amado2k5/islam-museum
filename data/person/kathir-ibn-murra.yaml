summary:
  ar: "طلب منه عبد العزيز بن مروان، والي مصر، أن يكتب له ما سمعه من أصحاب النبي، إلا أحاديث أبي هريرة فإنها عند غيره؛ يذكر الكتاب هذا الخبر في سياق بدايات التدوين في العصر الأموي {cite:umayyad-birth-to-fall-2006 p. 168}."
  tr: "Mısır valisi Abdülaziz bin Mervan, Peygamber'in sahabelerinden duyduklarını yazmasını istedi; Ebu Hureyre'nin hadisleri de dahil olmak üzere diğerleri hariç; kitap bu haberi Emevi döneminde belgelerin başlangıcı bağlamında anmaktadır {cite:umayyad-birth-to-fall-2006, s. 168}."
  id: "Abd al-Aziz ibn Marwan, gubernur Mesir, memintanya untuk menuliskan apa yang telah didengarnya dari para sahabat Nabi, kecuali hadis Abu Huraira, yang di antaranya; kitab ini menyebutkan laporan ini dalam konteks awal dokumentasi pada era Umayyah {cite:umayyad-birth-to-fall-2006, hlm. 168}."
