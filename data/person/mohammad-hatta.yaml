summary:
  ar: "سياسي إندونيسي من قادة الاستقلال، وُلد في بوكيتنغي بغرب سومطرة سنة 1902. درس في روتردام وقاد رابطة الطلبة الإندونيسيين في هولندا، ونفته السلطات الهولندية إلى ديغول وباندا، وأعلن مع سوكارنو استقلال إندونيسيا في 17 أغسطس 1945، فكان أول نائب رئيس للبلاد (1945-1956) ورئيس وزرائها الثالث، واشتُهر بلقب «المُعلِن» وبأبي التعاونيات الإندونيسية."
  en: "Indonesian statesman and independence leader, born at Bukittinggi, West Sumatra, in 1902. He studied at Rotterdam, led the Indonesian students' association in the Netherlands, was exiled by the Dutch to Digul and Banda, and with Sukarno proclaimed Indonesia's independence on 17 August 1945; he served as the country's first vice president (1945-1956) and third prime minister, and is remembered as 'the Proclamator' and the father of Indonesian cooperatives."
  ur: "انڈونیشی سیاست دان اور رہنما ئے آزادی، جو 1902ء میں مغربی سماٹرا کے بوکیتنگی میں پیدا ہوئے۔ روٹرڈم میں تعلیم پائی، ہالینڈ میں انڈونیشی طلبہ کی انجمن کی قیادت کی، ولندیزیوں نے انہیں دیگول اور بانڈا جلاوطن کیا، اور 17 اگست 1945ء کو سوکارنو کے ساتھ انڈونیشیا کی آزادی کا اعلان کیا؛ ملک کے پہلے نائب صدر (1945ء–1956ء) اور تیسرے وزیرِ اعظم رہے، اور وہ 'اعلان کرنے والے' اور انڈونیشی تعاونیت کے بانی کے طور پر یاد کیے جاتے ہیں۔"
