summary:
  ar: "محمد بن أبي بكر بن داود الحموي، أبو الفضل، المعروف بمحب الدين ابن تقي الدين، من كبار علماء عصره وفقهاء الحنفية وجد أبي المحبي صاحب «خلاصة الأثر»، ولد في حماة وسكن دمشق وتوفي فيها، ومن كتبه «عمدة الحكام» و«تنزيل الآيات»."
  en: "Muhammad ibn Abi Bakr al-Hamawi, Abu al-Fadl, known as Muhibb al-Din ibn Taqi al-Din, a leading scholar of his age and Hanafi jurist, grandfather of Abu al-Muhibbi, author of Khulasat al-Athar; born in Hama, he settled in Damascus and died there, and wrote among others Umdat al-Hukkam and Tanzil al-Ayat."
