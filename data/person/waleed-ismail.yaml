summary:
  ar: "وليد إسماعيل (وُلد 1975م) داعية مصري سلفي عُرف بمناظراته التلفزيونية والمباشرة في الدفاع عن الصحابة وأهل البيت، وهو عضو ائتلاف التيار الإسلامي للدفاع عن الصحب والآل والمتحدث باسمه، وتُبث مناظراته ودروسه عبر قناته الرسمية على يوتيوب."
  en: "Waleed Ismail (born 1975) is an Egyptian Salafi preacher known for televised and livestreamed debates in defence of the Companions and the Prophet's household; he is a member and spokesman of the Islamic Current Coalition for the Defense of the Companions and Ahl al-Bayt, and his debates and lessons are carried on his official YouTube channel."
  ur: "ولید اسماعیل (پیدائش 1975ء) مصری داعی ہیں جو صحابہ و اہل بیت کے دفاع میں ٹیلی وژن اور براہِ راست مناظروں کے لیے جانے جاتے ہیں؛ وہ «ائتلاف الصحب والآل» کے رکن و ترجمان ہیں اور ان کے مناظرے ان کے سرکاری یوٹیوب چینل پر نشر ہوتے ہیں۔"
