summary:
  ar: "عالمة مواد وفيزيائية تركية، وُلدت في إسطنبول سنة 1985. تقود مجموعة «المفككات المطابقة» في مختبر الوسائط بمعهد ماساتشوستس للتقنية، وتصنع أجهزة كهروميكانيكية مرنة تلتصق بالجسد للاستشعار وحصاد الطاقة، وهي أول عالمة تركية تصبح زميلة صغيرة في جمعية الزملاء بجامعة هارفارد."
  en: "Turkish materials scientist and physicist, born in Istanbul in 1985. She leads the Conformable Decoders research group at the MIT Media Lab, building flexible electromechanical devices that conform to the human body for sensing and energy harvesting, and she was the first Turkish scientist to become a Junior Fellow of the Harvard Society of Fellows."
  ur: "ترک مادہ سائنس دان اور طبیعیات دان، جو 1985 میں استنبول میں پیدا ہوئیں۔ وہ ایم آئی ٹی میڈیا لیب میں «کنفارمبل ڈیکوڈرز» تحقیقی گروپ کی سربراہ ہیں، جو انسانی جسم سے ہم آہنگ لچکدار برقی میکانکی آلات بناتا ہے، اور وہ ہارورڈ سوسائٹی آف فیلوز کی جونیئر فیلو بننے والی پہلی ترک سائنس دان ہیں۔"
