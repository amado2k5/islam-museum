summary:
  ar: "عالمة مواد وفيزيائية تركية، وُلدت في إسطنبول سنة 1985. تقود مجموعة «المفككات المطابقة» في مختبر الوسائط بمعهد ماساتشوستس للتقنية، وتصنع أجهزة كهروميكانيكية مرنة تلتصق بالجسد للاستشعار وحصاد الطاقة، وهي أول عالمة تركية تصبح زميلة صغيرة في جمعية الزملاء بجامعة هارفارد."
  en: "Turkish materials scientist and physicist, born in Istanbul in 1985. She leads the Conformable Decoders research group at the MIT Media Lab, building flexible electromechanical devices that conform to the human body for sensing and energy harvesting, and she was the first Turkish scientist to become a Junior Fellow of the Harvard Society of Fellows."
  ur: "ترک مادہ سائنس دان اور طبیعیات دان، جو 1985 میں استنبول میں پیدا ہوئیں۔ وہ ایم آئی ٹی میڈیا لیب میں «کنفارمبل ڈیکوڈرز» تحقیقی گروپ کی سربراہ ہیں، جو انسانی جسم سے ہم آہنگ لچکدار برقی میکانکی آلات بناتا ہے، اور وہ ہارورڈ سوسائٹی آف فیلوز کی جونیئر فیلو بننے والی پہلی ترک سائنس دان ہیں۔"
  es: "Científica de materiales y física turca, nacida en Estambul en 1985. Dirige el grupo de investigación Conformable Decoders en el MIT Media Lab, donde construye dispositivos electromecánicos flexibles que se adaptan al cuerpo humano para la detección y la recolección de energía, y fue la primera científica turca en convertirse en Junior Fellow de la Harvard Society of Fellows."
  fr: "Physicienne et spécialiste des matériaux turque, née à Istanbul en 1985. Elle dirige le groupe de recherche Conformable Decoders au MIT Media Lab, où elle conçoit des dispositifs électromécaniques flexibles qui s'adaptent au corps humain pour la détection et la récupération d'énergie. Elle a été la première scientifique turque à devenir membre junior de la Harvard Society of Fellows."
  tr: "1985 yılında İstanbul'da doğmuş Türk malzeme bilimci ve fizikçidir. Massachusetts Teknoloji Enstitüsü Medya Laboratuvarı'nda 'Eşleştirme Sökücüler' grubuna liderlik etmekte olup, vücuda algılama ve enerji toplama için bağlanan esnek elektromekanik cihazlar üretmektedir. Harvard Üniversitesi'nde genç araştırmacı olan ilk Türk bilim insanıdır."
  id: "Seorang ilmuwan material dan fisikawan Turki, lahir di Istanbul pada tahun 1985. Ia memimpin kelompok 'Matching Disassemblers' di Media Laboratory di Massachusetts Institute of Technology, memproduksi perangkat elektromekanik fleksibel yang dipasang pada tubuh untuk penginderaan dan pengambilan energi. Ia adalah ilmuwan Turki pertama yang menjadi junior fellow di Harvard University."
