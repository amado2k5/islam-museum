summary:
  ar: "يُعرف بوُلّد، روى عن القعنبي وغيره وكان نحويًا مجودًا وروى كتب النحو واللغة وكان ثقة؛ توفي في رجب سنة ثلاث وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 134}."
  en: "Known as 'Wullad', a grammarian of real merit who transmitted the nahw and lugha books from al-Qa'nabi and others — trustworthy; he died in Rajab 263 {cite:muntazam-ibn-al-jawzi p. 134}."
  es: "Conocido como 'Wullad', un gramático de verdadero mérito que transmitió los libros nahw y lugha de al-Qa'nabi y otros —digno de confianza—; murió en Rajab 263 {cite:muntazam-ibn-al-jawzi p. 134}."
  fr: "Connu sous le nom de 'Wullad', grammairien de grand mérite qui a transmis les livres nahw et lugha d'al-Qa'nabi et d'autres - digne de confiance; il est mort en Rajab 263 {cite:muntazam-ibn-al-jawzi p. 134}."
  ur: "'ولاد' کے نام سے جانا جاتا ہے، حقیقی قابلیت کا ایک گرائمر جس نے القنبی اور دیگر سے نحو اور لغوی کتابیں منتقل کیں - ثقہ؛ آپ کی وفات رجب 263 میں ہوئی۔ 134}۔"
  tr: "Çocuk olarak bilinir, el-Ka'nabi ve diğerlerinden rivayet edilmiştir, yetkin bir dilbilgicisiydi, dilbilgisi ve dil kitaplarını anlatırdı ve güvenilirdi; 263 yılında Recep'te öldü {atıf:muntazam-ibn-al-jawzi s. 134}."
  id: "Ia dikenal sebagai anak laki-laki, diceritakan dari al-Qa'nabi dan lainnya, seorang ahli tata bahasa yang mahir, menceritakan tata bahasa dan buku-buku linguistik, serta dapat dipercaya; ia meninggal di Rajab pada tahun 263 {cite:muntazam-ibn-al-jawzi hlm. 134}."
