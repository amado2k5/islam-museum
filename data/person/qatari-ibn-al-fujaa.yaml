label: { ar: "قطري بن الفجاءة", en: "Qatari ibn al-Fuja'a", es: "Qatari ibn al-Fuja'a", fr: "Qatari ibn al-Fuja'a", ur: "قطری ابن الفجا" }
summary:
  ar: "قطري بن الفجاءة؛ كان مع عبد الرحمن بن سمرة من الأشراف في سيرة كابل. وعند المسعودي كتب إلى سميرة بن الجعد سمير الحجاج شعراً يدعوه حتى لحق به، وكتب سميرة إلى الحجاج فمن مبلغ الحجاج أن سميرة قلا كل دين غير دين الخوارج {cite:muruj-al-dhahab p. 127-128}"
  en: "Qatari ibn al-Fuja'a; among the ashraf who rode with Ibn Samura to Kabul — later the Kharijite chieftain."
  es: "el qatarí ibn al-Fuja'a; entre los ashraf que cabalgaron con Ibn Samura a Kabul (más tarde el jefe jarijita)."
  fr: "le Qatari ibn al-Fuja'a; parmi les Achraf qui chevauchèrent avec Ibn Samura jusqu'à Kaboul – plus tard le chef Kharijite."
  ur: "قطری ابن الفجا؛ ان اشرفیوں میں سے جو ابن سمرہ کے ساتھ کابل گئے تھے - بعد میں خوارجی سردار۔"
  tr: "Katri ibn al-Faja'ah; Kabil Sirat'ındaki soylulardan biri olan Abd al-Rahman ibn Samura ile birlikteydi. al-Mas'udi'ye göre Samira ibn al-Ja'd'a ona şiiri yazdı ve ona katılana kadar onu çağırdı. Samira el-Hacąc'a yazdı ve el-Hacac'ın raporuna göre Samira, Haricilerin dini dışındaki tüm dinleri söyledi. {atıf:Muruj-al-Dhahab s. 127-128}"
  id: "Qatri ibn al-Faja'ah; ia bersama Abd al-Rahman ibn Samura, salah satu bangsawan di Sirat Kabul. Menurut al-Mas'udi al-Mas'udi Samir al-Hajjaj menulis puisi untuk Samira ibn al-Ja'd memanggilnya hingga ia bergabung dengannya. Samira menulis kepada al-Hajjaj, dan dari laporan al-Hajjaj bahwa Samira menyebutkan setiap agama selain agama Kharijit. {cite:muruj-al-dhahab hlm. 127-128}"
