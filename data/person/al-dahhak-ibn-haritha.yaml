summary:
  ar: "صحابي خزرجي أنصاري؛ ذكره موسى بن عقبة في البدريين وذكره عروة في أهل العقبة، ووصفه أبو حاتم بأنه عقّبي بدري."
  en: "A Khazraji Ansari Companion; Musa ibn Uqba names him among the Badriyya and Urwa among the people of al-Aqaba — Abu Hatim describes him as Aqabi and Badri."
  fr: "Compagnon ansarite khazrajite ; Musa ibn Uqba le nomme parmi les gens de Badr et Urwa parmi ceux d’al-Aqaba — Abu Hatim le décrit comme Aqabi et Badri."
  ur: "خزرجی انصاری صحابی؛ موسی بن عقبہ انہیں بدریوں میں اور عروہ اہل عقبہ میں گناتے ہیں — ابو حاتم انہیں عقبی اور بدری کہتے ہیں۔"
  es: "Un compañero Khazraji Ansari; Musa ibn Uqba lo nombra entre los Badriyya y Urwa entre la gente de al-Aqaba; Abu Hatim lo describe como Aqabi y Badri."
  tr: "Peygamber Efendimiz'in Hazrec kabilesinden bir sahabesi olan Ensarî'dir. Musa ibn Ukbe, Bedriyyinler arasında ondan söz etmiş, Urve de Akabeliler arasında ondan bahsetmişti. Ebu Hatim onu Akbi Bedriyyin olarak tanımladı."
  id: "Seorang sahabat Nabi dari suku Khazraj, seorang Ansari. Musa bin Uqba menyebutkan dia di antara kaum Badriyyin, dan Urwa menyebutkan dia di antara penduduk Aqaba. Abu Hatim menggambarkannya sebagai seorang Aqbi Badriyyin."
