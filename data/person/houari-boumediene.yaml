summary:
  ar: "هواري بومدين (1932–1978)، ضابط وسياسي جزائري، اسمه عند الولادة محمد بن إبراهيم بوخروبة؛ قاد الجناح العسكري لجبهة التحرير الوطني في حرب الاستقلال، وصار وزيرا للدفاع بعد الاستقلال، ثم أطاح بأحمد بن بلة سنة 1965 وحكم الجزائر رئيسا لمجلس الثورة ثم رئيسا للجمهورية حتى وفاته في المنصب."
  en: "Houari Boumédiène (1932–1978) was an Algerian officer and politician, born Mohammed ben Brahim Boukharouba. He commanded the FLN's military wing in the war of independence, became minister of defence after independence, then overthrew Ahmed Ben Bella in 1965 and ruled Algeria, as chairman of the Revolutionary Council and then as president, until his death in office."
  ur: "ہواری بومدین ⁦(1932ء–1978ء)⁩ جزائری افسر اور سیاست دان تھے، پیدائشی نام محمد بن ابراہیم بوخروبہ؛ جنگ آزادی میں جبهة التحرير الوطني کے عسکری ونگ کے کمانڈر رہے، آزادی کے بعد وزیر دفاع بنے، پھر 1965ء میں احمد بن بیلا کو ہٹا کر مجلسِ ثورہ کے چیئرمین اور پھر صدر کی حیثیت سے وفات تک جزائر پر حکمران رہے۔"
  es: "Houari Boumédiène (1932-1978) fue un oficial y político argelino, nacido como Mohammed ben Brahim Boukharouba. Comandó el ala militar del FLN en la guerra de independencia, se convirtió en ministro de defensa tras la independencia, luego derrocó a Ahmed Ben Bella en 1965 y gobernó Argelia, primero como presidente del Consejo Revolucionario y luego como presidente, hasta su muerte en el cargo."
  fr: "Houari Boumédiène (1932-1978) était un officier et homme politique algérien, né Mohammed ben Brahim Boukharouba. Il commanda la branche militaire du FLN pendant la guerre d'indépendance, devint ministre de la Défense après l'indépendance, puis renversa Ahmed Ben Bella en 1965 et dirigea l'Algérie, d'abord comme président du Conseil révolutionnaire, puis comme président, jusqu'à sa mort en fonction."
  tr: "Houari Boumediene (1932–1978), Cezayirli bir subay ve siyasetçiydi, doğum adı Mohamed Ben Ibrahim Boukhrouba; Bağımsızlık Savaşı sırasında Ulusal Kurtuluş Cephesi'nin askeri kanadını yönetti, bağımsızlıktan sonra Savunma Bakanı oldu, ardından 1965'te Ahmed Ben Bella'yı devirdi ve Cezayir'i Devrim Konseyi Başkanı olarak yönetti, ardından görevdeyken vefat edene kadar Cumhurbaşkanı olarak görev yaptı."
  id: "Houari Boumediene (1932–1978) adalah seorang perwira dan politisi Aljazair, lahir dengan nama Mohamed Ben Ibrahim Boukhrouba; ia memimpin sayap militer Front Pembebasan Nasional selama Perang Kemerdekaan, menjadi Menteri Pertahanan setelah kemerdekaan, kemudian menggulingkan Ahmed Ben Bella pada tahun 1965 dan memerintah Aljazair sebagai Presiden Dewan Revolusioner, kemudian Presiden Republik hingga wafat saat menjabat."
