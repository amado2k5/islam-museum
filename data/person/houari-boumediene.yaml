summary:
  ar: "هواري بومدين (1932–1978)، ضابط وسياسي جزائري، اسمه عند الولادة محمد بن إبراهيم بوخروبة؛ قاد الجناح العسكري لجبهة التحرير الوطني في حرب الاستقلال، وصار وزيرا للدفاع بعد الاستقلال، ثم أطاح بأحمد بن بلة سنة 1965 وحكم الجزائر رئيسا لمجلس الثورة ثم رئيسا للجمهورية حتى وفاته في المنصب."
  en: "Houari Boumédiène (1932–1978) was an Algerian officer and politician, born Mohammed ben Brahim Boukharouba. He commanded the FLN's military wing in the war of independence, became minister of defence after independence, then overthrew Ahmed Ben Bella in 1965 and ruled Algeria, as chairman of the Revolutionary Council and then as president, until his death in office."
  ur: "ہواری بومدین (1932ء–1978ء) جزائری افسر اور سیاست دان تھے، پیدائشی نام محمد بن ابراہیم بوخروبہ؛ جنگ آزادی میں جبهة التحرير الوطني کے عسکری ونگ کے کمانڈر رہے، آزادی کے بعد وزیر دفاع بنے، پھر 1965ء میں احمد بن بیلا کو ہٹا کر مجلسِ ثورہ کے چیئرمین اور پھر صدر کی حیثیت سے وفات تک جزائر پر حکمران رہے۔"
