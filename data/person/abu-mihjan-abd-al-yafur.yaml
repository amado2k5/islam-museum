id: person/abu-mihjan-abd-al-yafur
class: person
label:
  ar: أبو محجن عبد آل يعفر
  en: Abu Mihjan, of the slaves of Al Ya'fur
  ur: ابو محجن، آل یعفر کا غلام
summary:
  ar: رجل ذكره الكتاب بهذا الاسم أخذ رسول الهادي في سفرته الأولى وحلق رأسه ولحيته وضربه، ثم ابتُلي في يديه حتى مات، بحسب راويين من همدان.
  en: A man the book names so, who in al-Hadi's first journey seized his messenger, shaved his head and beard and struck him, and was afterwards afflicted in his hands until he died, according to two narrators of Hamdan.
  ur: اس نام سے کتاب میں مذکور ایک شخص جس نے ہادی کے پہلے سفر میں ان کے قاصد کو پکڑا، اس کا سر اور داڑھی مونڈی اور اسے مارا، اور پھر ہمدان کے دو راویوں کے مطابق ہاتھوں میں مبتلا ہو کر مر گیا۔
