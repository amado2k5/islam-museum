summary:
  ar: "العباس بن عبد الله أبو الفضل الطرطوشي، سكن بغداد وحدّث عن جماعة، وروى عنه ابن أبي الدنيا وابن صاعد وابن مخلد، وكان ثقة صدوقًا صالحًا. قال ابن مخلد: ما رأيته ضحك ولا تبسّم. توفي بسرّ من رأى سنة سبع وستين ومائتين وقيل سنة ثمان وستين {cite:muntazam-ibn-al-jawzi p. 61}."
  en: "Al-Abbas ibn Abdallah Abu'l-Fadl al-Tartushi of Baghdad — a trustworthy, upright transmitter heard by Ibn Abi'l-Dunya, Ibn Sa'id and Ibn Makhlad, of whom Ibn Makhlad said he never saw him laugh or even smile; died at Samarra in 267, or 268 by another report {cite:muntazam-ibn-al-jawzi p. 61}."
