id: person/al-abbas-ibn-abdallah-al-tartushi
class: person
label: { ar: "العباس بن عبد الله الطرطوشي", en: "al-Abbas ibn Abdallah al-Tartushi", fr: "Al-Abbas ibn Abdallah al-Tartushi", es: "al-Abbas ibn Abdallah al-Tartushi", ur: "العباس ابن عبداللہ الطرطوشی۔" }
summary:
  ar: "العباس بن عبد الله أبو الفضل الطرطوشي، سكن بغداد وحدّث عن جماعة، وروى عنه ابن أبي الدنيا وابن صاعد وابن مخلد، وكان ثقة صدوقًا صالحًا. قال ابن مخلد: ما رأيته ضحك ولا تبسّم. توفي بسرّ من رأى سنة سبع وستين ومائتين وقيل سنة ثمان وستين {cite:muntazam-ibn-al-jawzi p. 61}."
  en: "Al-Abbas ibn Abdallah Abu'l-Fadl al-Tartushi of Baghdad — a trustworthy, upright transmitter heard by Ibn Abi'l-Dunya, Ibn Sa'id and Ibn Makhlad, of whom Ibn Makhlad said he never saw him laugh or even smile; died at Samarra in 267, or 268 by another report {cite:muntazam-ibn-al-jawzi p. 61}."
  fr: "Al-Abbas ibn Abdallah Abu al-Fadl al-Tartushi de Bagdad — transmetteur digne de confiance et droit, entendu par Ibn Abi al-Dunya, Ibn Sa’id et Ibn Makhlad, dont ce dernier dit ne l’avoir jamais vu rire ni même sourire ; mort à Samarra en 267 H, ou 268 H selon un autre récit {cite:muntazam-ibn-al-jawzi p. 61}."
  es: "Al-Abbas ibn Abdallah Abu'l-Fadl al-Tartushi de Bagdad: un transmisor honesto y confiable escuchado por Ibn Abi'l-Dunya, Ibn Sa'id e Ibn Makhlad, de quien Ibn Makhlad dijo que nunca lo vio reír o incluso sonreír; Murió en Samarra en 267, o 268 según otro informe {citar:muntazam-ibn-al-jawzi p. 61}."
  ur: "بغداد کے العباس ابن عبداللہ ابو الفضل الطرطوشی - ایک قابل اعتماد، سیدھا ٹرانسمیٹر جسے ابن ابی الدنیا، ابن سعید اور ابن مخلد نے سنا، جن کے بارے میں ابن مخلد نے کہا کہ میں نے اسے کبھی ہنستے یا مسکراتے نہیں دیکھا۔ سامراء میں 267 یا 268 میں ایک اور روایت کے مطابق وفات پائی۔ 61}۔"
