summary:
  ar: "قائد جمع من العجم قاتل أبا عبيدة عند الفرات في وقعة الجسر وانهزم فيها المسلمون بعد قطع الجسر {cite:muruj-al-dhahab p. 604}. وقال عند المسعودي المحبة تقع بين العاقلين لتشاكلهما في العقل ولا تقع بين الأحمقين لأن العقل يجري على ترتيب والحمق لا يجري على ترتيب {cite:muruj-al-dhahab p. 360}"
  en: "The Persian commander at the Bridge battle where the Muslims, their bridge cut, were routed {cite:muruj-al-dhahab p. 604}."
  es: "El comandante persa en la batalla del puente donde los musulmanes, con su puente cortado, fueron derrotados {cite:muruj-al-dhahab p. 604}."
  fr: "Le commandant perse lors de la bataille du pont où les musulmans, leur pont coupé, furent mis en déroute {cite:muruj-al-dhahab p. 604}."
  ur: "برج جنگ میں فارسی کمانڈر جہاں مسلمانوں کو، ان کا پل کاٹا گیا، شکست دی گئی {حوالہ: مروج الذہب ص۔ 604}۔"
  tr: "Köprü Savaşı'nda Ebu Ubeyde ile savaşan bir grup Arap olmayanların lideri; köprü kesildikten sonra Müslümanlar yenilmişti {atıf:muruj-al-dhahab, s. 604}. El-Mes'udi şöyle demiştir: Akılcı insanlar arasında aşk vardır çünkü akıl benzerdir, ancak aptallar arasında olmaz, çünkü akıl düzeni takip eder, aptallık ise düzeni takip etmez. {atıf:Muruj-al-Dhahab, s. 360}"
  id: "Seorang pemimpin kelompok non-Arab yang bertempur melawan Abu Ubaidah di Sungai Efrat dalam Pertempuran Jembatan, di mana umat Muslim dikalahkan setelah jembatan itu terputus {cite:muruj-al-dhahab, hlm. 604}. Al-Mas'udi berkata: Cinta terjadi di antara orang rasional karena mereka serupa dalam akal, tetapi tidak terjadi di antara orang bodoh, karena akal mengikuti keteraturan, dan kebodohan tidak mengikuti keteraturan. {cite:muruj-al-dhahab, hlm. 360}"
