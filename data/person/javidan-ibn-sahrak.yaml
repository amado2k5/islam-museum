id: person/javidan-ibn-sahrak
class: person
label: { ar: "جاويدان بن سهرك", en: "Javidan Ibn Sahrak" }
summary:
  ar: "جاويدان بن سهرك أستاذ بابك، من رجالي العلوج المتحرمين المتشاجرين على التملك بجبال البذ من الخرمية، خرج بألفي شاة إلى زنجان فدخلها وباعها فأدركه الثلج فرجع إلى قرية بلال أباذ فأنزله جزيرها على أم بابك فوجد بابكا خبيثا شهما فهم فطلبه من أمه بخمسين درهما في الشهر، ثم نهض أبو عمران إليه فخاربه فهزمه وقتله ورجع إلى جبله فمات بعد ثلاثة أيام {cite:fihrist-ibn-al-nadim p. 480-481}."
  en: "The Khurrami warlord of Badhdh whose widow raised Babak over his own host {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
