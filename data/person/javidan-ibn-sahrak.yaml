label: { ar: "جاويدان بن سهرك", en: "Javidan Ibn Sahrak", es: "Javidan Ibn Sahrak", fr: "Javidan Ibn Sahrak", ur: "جاوید ابن سہرک" }
summary:
  ar: "جاويدان بن سهرك أستاذ بابك، من رجالي العلوج المتحرمين المتشاجرين على التملك بجبال البذ من الخرمية، خرج بألفي شاة إلى زنجان فدخلها وباعها فأدركه الثلج فرجع إلى قرية بلال أباذ فأنزله جزيرها على أم بابك فوجد بابكا خبيثا شهما فهم فطلبه من أمه بخمسين درهما في الشهر، ثم نهض أبو عمران إليه فخاربه فهزمه وقتله ورجع إلى جبله فمات بعد ثلاثة أيام {cite:fihrist-ibn-al-nadim p. 480-481}."
  en: "The Khurrami warlord of Badhdh whose widow raised Babak over his own host {cite:fihrist-ibn-al-nadim}"
  es: "El caudillo Khurrami de Badhdh cuya viuda crió a Babak sobre su propio ejército {cite:fihrist-ibn-al-nadim}"
  fr: "Le chef de guerre Khurrami de Badhdh dont la veuve a élevé Babak au-dessus de sa propre armée {cite:fihrist-ibn-al-nadim}"
  ur: "بدھ کا خرمی سپہ سالار جس کی بیوہ نے بابک کو اپنے ہی میزبان پر اٹھایا۔"
  tr: "Al-'Aluj'un adamlarından biri olan Babak'ın öğretmeni Jawidan ibn Sahrak, Al-Khurramiyah'dan Badh dağlarının mülkiyeti konusunda tartışan ve yasak olan adamlardan biri, iki bin koyunla Zancan'a gitti, oraya girdi, sattı ve kar tarafından yakalandı. Bilal Abaz köyüne döndü ve Um Babak'ta adasını kurdu. Babak'ın kurnaz ve vahşi olduğunu gördü, anladı ve annesinden ayda elli dirhem istedi. Sonra Ebu İmran ona ayağa kalktı, onu yok etti, yendi, öldürdü ve üç gün sonra dağına döndü {atıf:Fihrist-ibn-al-Nadim s. 480-481}."
  id: "Jawidan ibn Sahrak, guru Babak, salah satu orang Al-'Aluj, yang dilarang dan bertengkar atas kepemilikan gunung Badh dari Al-Khurramiyah, pergi bersama dua ribu domba ke Zanjan, masuk ke sana, menjualnya, dan tertangkap salju. Ia kembali ke desa Bilal Abaz, yang menetap di pulau itu di um Babak. Ia mendapati Babak licik dan garang, dan ia mengerti serta meminta ibunya lima puluh dirham per bulan. Kemudian Abu Imran bangkit kepadanya, menghancurkannya, mengalahkannya, membunuhnya, dan kembali ke gunungnya dan meninggal setelah tiga hari {cite:fihrist-ibn-al-nadim hlm. 480-481}."
