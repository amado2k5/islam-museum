summary:
  ar: "أمير أفغانستان مرتين (1863-1866 و1868-1879)، أحد أبناء دوست محمد خان مؤسس أسرة بركزاي. ورث الإمارة عن أبيه سنة 1863 ثم خسرها لأخيه محمد أفضل خان في حرب أهلية واستعادها سنة 1868. حاول إصلاح الإدارة والجيش، وأنشأ أول خدمة بريدية وأول مدرسة في أفغانستان، وسعى لحفظ الحياد بين بريطانيا وروسيا حتى انتهى رفضه بعثة بريطانية دائمة إلى الحرب الإنجليزية الأفغانية الثانية، فمات في مزار شريف سنة 1879 وهو في طريقه لطلب العون الروسي."
  en: "Emir of Afghanistan twice (1863–1866 and 1868–1879), a son of Dost Mohammad Khan, founder of the Barakzai dynasty. He inherited the emirate from his father in 1863, lost it to his brother Mohammad Afzal Khan in a civil war, and regained it in 1868. He tried to reform the administration and the army, created Afghanistan's first postal service and first school, and sought neutrality between Britain and Russia until his refusal of a permanent British mission brought on the Second Anglo-Afghan War; he died at Mazar-e Sharif in 1879 on his way to seek Russian aid."
  ur: "افغانستان کے دو مرتبہ امیر (1863ء–1866ء اور 1868ء–1879ء)، بارکزئی خاندان کے بانی دوست محمد خان کے ایک بیٹے۔ 1863ء میں والد سے امارت ورثے میں پائی، خانہ جنگی میں بھائی محمد افضل خان سے ہارے اور 1868ء میں دوبارہ حاصل کی۔ انتظام اور فوج کی اصلاح کی کوشش کی، افغانستان کی پہلی ڈاک سروس اور پہلا اسکول قائم کیا اور برطانیہ و روس کے درمیان غیر جانبداری چاہی، حتیٰ کہ مستقل برطانوی مشن سے انکار دوسری اینگلو افغان جنگ کا سبب بنا؛ 1879ء میں روسی مدد حاصل کرنے جاتے ہوئے مزار شریف میں وفات پائی۔"
