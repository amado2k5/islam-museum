summary:
  ar: "سنان باشا الكبير، وزير عثماني وقائد في عهد سليم الثاني؛ قاد فتح تونس سنة 982هـ ⁦(1574م)⁩ مع قلج علي، ثم قاد الحملة الكبرى إلى اليمن فدخل مكة وجازان وأنقذ والي تعز وهزم الزيود في جبل الأغبر وجهّز حملة عدن."
  en: "Koca Sinan Pasha, Ottoman vizier and commander under Selim II; led the conquest of Tunis in 982/1574 with Qilij Ali, then the great Yemen expedition — entering Mecca and Jazan, relieving the governor of Taiz, routing the Zaydis at Mount al-Aghbar and preparing the Aden expedition."
  es: "Koca Sinan Pasha, visir y comandante otomano bajo el mando de Selim II; dirigió la conquista de Túnez en 982/1574 con Qilij Ali, y luego la gran expedición a Yemen, entrando en La Meca y Jazan, liberando al gobernador de Taiz, derrotando a los zaidíes en el monte al-Aghbar y preparando la expedición a Adén."
  fr: "Koca Sinan Pacha, vizir ottoman et commandant sous Selim II; a mené la conquête de Tunis en 982/1574 avec Qilij Ali, puis la grande expédition du Yémen — entrant à La Mecque et à Jazan, soulevant le gouverneur de Taïz, mettant en déroute les Zaydis au mont al-Aghbar et préparant l'expédition d'Aden."
  ur: "کوکا سنان پاشا، عثمانی وزیر اور سلیم II کے ماتحت کمانڈر؛ 982/1574 میں قلیج علی کے ساتھ تیونس کی فتح کی قیادت کی، اس کے بعد یمن کی عظیم مہم - مکہ اور جازان میں داخل ہوئے، تائز کے گورنر کو فارغ کیا، کوہ الاغبر پر زیدیوں کو راستہ دیا اور عدن کی مہم کی تیاری کی۔"
