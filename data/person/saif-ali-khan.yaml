summary:
  ar: "ممثل ومنتج هندي (وُلد سنة 1970) في نيودلهي، ابن الممثلة شارميلا طاغور ولاعب الكريكيت منصور علي خان باتودي والرئيس الاسمي لعائلة باتودي منذ 2011؛ من نجوم السينما الهندية منذ التسعينيات («ديل شاهتا هي» و«كال هو نا هو» و«هم تم»)، نال جائزة الفيلم الوطنية وبادما شري (2010)."
  en: "Indian actor and producer (born 1970) at New Delhi, son of the actress Sharmila Tagore and the cricketer Mansur Ali Khan Pataudi and titular head of the Pataudi family since 2011; a leading Hindi-film star since the 1990s (Dil Chahta Hai, Kal Ho Naa Ho, Hum Tum), he won a National Film Award and received the Padma Shri in 2010."
  ur: "بھارتی اداکار اور پروڈیوسر (پیدائش 1970) جو نئی دہلی میں پیدا ہوئے، اداکارہ شرمیلا ٹیگور اور کرکٹر منصور علی خان پٹودی کے بیٹے اور 2011 سے خاندانِ پٹودی کے رسمی سربراہ ہیں؛ نوے کی دہائی سے ہندی سنیما کے نمایاں ستارے («دل چاہتا ہے»، «کل ہو نہ ہو»، «ہم تم»)، قومی فلم ایوارڈ یافتہ اور پدم شری (2010) سے نوازے گئے۔"
