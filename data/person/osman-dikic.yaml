summary:
  ar: "شاعر وكاتب مسرحي ومحرر بوسني من موستار عرّف بنفسه صربياً من أهل الإسلام: تعلّم في بلغراد وإسطنبول وفيينا، وحرّر «موساوات» و«غيرت» وأسس صحيفة «ساموبرافا»، وكتب السيفدالينكا والمسرحيات الشعبية، وجمع خمسة آلاف بيت في «لؤلؤة الهرسك» للأكاديمية الصربية، ومات بالسل في الثالثة والثلاثين."
  en: "Bosnian poet, dramatist and editor from Mostar who declared himself a Serb of the Islamic faith: educated in Belgrade, Istanbul and Vienna, he edited Musavat and Gajret, founded the paper Samouprava, wrote sevdalinkas and folk dramas, collected the 5,000-verse Hercegovački biser for the Serbian Academy, and died of tuberculosis at thirty-three."
  ur: "موستار سے تعلق رکھنے والے بوسنیائی شاعر، ڈراما نگار اور مدیر جنھوں نے خود کو اسلام پر ایمان رکھنے والا صرب قرار دیا: بلغراد، استنبول اور ویانا میں تعلیم پائی، «موساوات» اور «غیرت» کی ادارت کی، اخبار «ساموپراوا» نکالا، سیودالنکا اور لوک ڈرامے لکھے، پانچ ہزار اشعار پر مشتمل «ہرچےگوواچکی بسر» صربی اکادمی کے لیے جمع کیا، اور 33 برس کی عمر میں تپ دق سے وفات پائی۔"
