summary:
  ar: لاعبة كرة قدم وطبيبة دنماركية أفغانية وُلدت سنة 1988 في هرات؛ لجأت إلى الدنمارك طفلة بعد مقتل والدها، وصارت من أبرز مهاجمي الكرة الدنماركية والأوروبية وأكثر من 100 مباراة دولية، وتخرجت طبيبة سنة 2022.
  en: Danish-Afghan footballer and physician born in Herat in 1988; after fleeing to Denmark as a child following her father's killing, she became one of Europe's leading strikers with over 100 international
    caps, and qualified as a doctor in 2022.
  ur: ڈینش افغان فٹبالر اور طبیبہ جو 1988 میں ہرات میں پیدا ہوئی؛ والدہ کے قتل کے بعد بچپن میں ڈنمارک پناہ گزین ہوئی، یورپ کی مقدم اسٹرائیکروں میں بنی، سو سے زائد بین الاقوامی میچ کھیلی اور 2022 میں ڈاکٹر
    بنی۔
  es: "Futbolista y médica danesa-afgana nacida en Herat en 1988; tras huir a Dinamarca de niña después del asesinato de su padre, se convirtió en una de las delanteras más destacadas de Europa con más de 100 partidos internacionales y se licenció en medicina en 2022."
  fr: "Footballeuse et médecin dano-afghane née à Hérat en 1988; après avoir fui au Danemark enfant suite à l'assassinat de son père, elle est devenue l'une des meilleures attaquantes d'Europe avec plus de 100 sélections internationales, et a obtenu son diplôme de médecin en 2022."
