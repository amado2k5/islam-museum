summary:
  ar: "نادر انقطاع (وُلد 8 تشرين الأول 1955) عالم ومهندس كهرباء إيراني-أمريكي، أستاذ في جامعة بنسلفانيا ورائد في المواد الخارقة (الميتامواد) والبصريات النانوية والبلازمونيات. أخذ دكتوراه معهد كاليفورنيا للتقانة (كالتك) سنة 1982، ونال ميدالية إسحاق نيوتن 2020 وميدالية فرانكلين 2023."
  en: "Nader Engheta (born 8 October 1955) is an Iranian-American scientist and electrical engineer, a professor at the University of Pennsylvania and a pioneer of metamaterials, nanophotonics and plasmonics. He took his Caltech doctorate in 1982 and received the 2020 Isaac Newton Medal and the 2023 Franklin Medal."
