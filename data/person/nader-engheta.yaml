summary:
  ar: "نادر انقطاع ⁦(وُلد 8 تشرين الأول 1955)⁩ عالم ومهندس كهرباء إيراني-أمريكي، أستاذ في جامعة بنسلفانيا ورائد في المواد الخارقة ⁦(الميتامواد)⁩ والبصريات النانوية والبلازمونيات. أخذ دكتوراه معهد كاليفورنيا للتقانة ⁦(كالتك)⁩ سنة 1982، ونال ميدالية إسحاق نيوتن 2020 وميدالية فرانكلين 2023."
  en: "Nader Engheta (born 8 October 1955) is an Iranian-American scientist and electrical engineer, a professor at the University of Pennsylvania and a pioneer of metamaterials, nanophotonics and plasmonics. He took his Caltech doctorate in 1982 and received the 2020 Isaac Newton Medal and the 2023 Franklin Medal."
  es: "Nader Engheta (nacido el 8 de octubre de 1955) es un científico e ingeniero eléctrico iraní-estadounidense, profesor de la Universidad de Pensilvania y pionero en metamateriales, nanofotónica y plasmónica. Se doctoró en Caltech en 1982 y recibió la Medalla Isaac Newton en 2020 y la Medalla Franklin en 2023."
  fr: "Nader Engheta (né le 8 octobre 1955) est un scientifique et ingénieur électricien irano-américain, professeur à l'Université de Pennsylvanie et pionnier des métamatériaux, de la nanophotonique et de la plasmonique. Il a obtenu son doctorat au Caltech en 1982 et a reçu la médaille Isaac Newton en 2020 et la médaille Franklin en 2023."
  ur: "نادر اینگھیٹا ⁦(پیدائش 8 اکتوبر 1955)⁩ ایک ایرانی نژاد امریکی سائنسدان اور الیکٹریکل انجینئر، یونیورسٹی آف پنسلوانیا کے پروفیسر اور میٹا میٹریلز، نینو فوٹونکس اور پلازمونکس کے علمبردار ہیں۔ اس نے 1982 میں کیلٹیک ڈاکٹریٹ کی اور 2020 آئزک نیوٹن میڈل اور 2023 فرینکلن میڈل حاصل کیا۔"
  tr: "Nader Enghatat (d. 8 Ekim 1955), İran-Amerikalı bilim insanı ve elektrik mühendisi, Pennsylvania Üniversitesi'nde profesör ve metamalzemeler, nanooptik ve plazmonik alanlarında öncüdür. Doktorasını 1982 yılında California Teknoloji Enstitüsü'nden (Caltech) almış, 2020 yılında Isaac Newton Madalyası'nı ve 2023'te Franklin Madalyası'nı almıştır."
  id: "Nader Enghatat (lahir 8 Oktober 1955) adalah seorang ilmuwan dan insinyur listrik Iran-Amerika, profesor di University of Pennsylvania, serta pelopor dalam bidang metamaterial, nanooptik, dan plasmonik. Ia meraih gelar PhD dari California Institute of Technology (Caltech) pada tahun 1982 dan menerima Medali Isaac Newton pada tahun 2020 serta Medali Franklin pada tahun 2023."
