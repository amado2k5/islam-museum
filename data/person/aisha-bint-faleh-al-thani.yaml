summary:
  ar: تربوية وسيدة أعمال قطرية. مؤسِّسة ورئيسة مجموعة الفالح التعليمية ⁦(Al Faleh Educational Holding)⁩، أول شركة قطرية تقودها امرأة تُدرج في البورصة، وعضوة سابقة في المجلس الأعلى للتعليم.
  en: Qatari educationist and businesswoman. Founder and chairperson of Al Faleh Educational Holding, the first woman-led Qatari company listed on the stock exchange, and former member of the Supreme Education
    Council.
  fr: "Pédagogue et femme d’affaires qatarienne. Fondatrice et présidente d’Al Faleh Educational Holding, première société qatarienne dirigée par une femme à être cotée en Bourse, et ancienne membre du Conseil suprême de l’éducation."
  ur: قطری معلمی اور کاروباری خاتون۔ الفالح ایجوکیشنل ہولڈنگ کی بانی اور چیئرپرسن — اسٹاک ایکسچینج میں درج ہونے والی پہلی خاتون قیادت والی قطری کمپنی — اور سپریم ایجوکیشن کونسل کی سابق رکن۔
  es: "Educadora y empresaria catarí. Fundadora y presidenta de Al Faleh Educational Holding, la primera empresa catarí dirigida por una mujer que cotiza en bolsa, y exmiembro del Consejo Supremo de Educación."
  tr: "Katarlı eğitimci ve iş kadını. Katar borsasında işlem gören ilk kadın liderliğindeki şirket olan Al Faleh Educational Holding'in kurucusu ve başkanı ve eski Yüksek Eğitim Konseyi üyesi."
  id: "Pendidik dan pengusaha wanita Qatar. Pendiri dan ketua Al Faleh Educational Holding, perusahaan Qatar pertama yang dipimpin oleh seorang wanita yang terdaftar di bursa saham, dan mantan anggota Dewan Pendidikan Tertinggi."
