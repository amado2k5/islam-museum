summary:
  ar: "بطاقة أولية لمحمد راشد، مؤرخ وقاضٍ عثماني القرن الثامن عشر صاحب التاريخ الرشدي، توفي سنة ١٧٣٥م؛ تذكره كتب التاريخ ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Mehmed Rashid, the eighteenth-century Ottoman historian and judge author of Tarih-i Rashid, d. 1735; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Mehmed Rashid, historiador y juez otomano del siglo XVIII, autor de Tarih-i Rashid, fallecido en 1735; la entrada de la fuente aún no se ha verificado en la página."
  fr: "Fiche de candidature de Mehmed Rashid, historien et juge ottoman du XVIIIe siècle, auteur du Tarih-i Rashid, mort en 1735; la source n'est pas encore vérifiée sur la page."
  ur: "محمد رشید کے لیے ڈرافٹ کارڈ، اٹھارویں صدی کے عثمانی مورخ اور تاریخ راشد کے جج مصنف، ڈی۔ 1735; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "1735 yılında ölen, on sekizinci yüzyıl Osmanlı tarihçisi ve Rushdi Tarihi'nin yargıç yazarı Muhammed Raşid'in ön kartı; tarih kitaplarında anılmaktadır, ancak biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Muhammad Rashid, seorang sejarawan Ottoman abad kedelapan belas dan penulis hakim Sejarah Rushdi, yang meninggal pada tahun 1735 M; ia dikenang dalam buku sejarah, tetapi biografinya belum pernah diulas di halaman."
