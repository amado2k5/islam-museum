summary:
  ar: "محمد ظهير الدين ميرزا علي بخت بهادر، من ذرية أورنغزيب، وصاحب «واقعات عظفري»، تنقل بين دلهي ولكنهو ومرشداباد ومدراس، وتوفي بمدراس سنة 1234هـ ⁦(1818م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 862-863}."
  en: "Muhammad Zahir al-Din Mirza 'Ali Bakht Bahadur, known as Azfari, a descendant of Awrangzib and author of the Waqi'at-i Azfari; he moved between Delhi, Lucknow and Murshidabad and died at Madras in 1234 AH (1818) {cite:encyclopaedia-of-islam-2 vol. 1 p. 862-863}."
  es: "Muhammad Zahir al-Din Mirza 'Ali Bakht Bahadur, conocido como Azfari, descendiente de Awrangzib y autor del Waqi'at-i Azfari; se movió entre Delhi, Lucknow y Murshidabad y murió en Madrás en 1234 AH (1818) {cite:encyclopaedia-of-islam-2 vol. 1 p. 862-863}."
  fr: "Muhammad Zahir al-Din Mirza 'Ali Bakht Bahadur, connu sous le nom d'Azfari, descendant d'Awrangzib et auteur du Waqi'at-i Azfari; il a vécu entre Delhi, Lucknow et Murshidabad et est décédé à Madras en 1234 AH (1818) {cite:encyclopaedia-of-islam-2 vol. 1 p. 862-863}."
  ur: "محمد ظہیر الدین مرزا علی بخت بہادر، جسے ازفاری کے نام سے جانا جاتا ہے، اورنگزیب کی اولاد اور وقعتِ ازفاری کے مصنف؛ وہ دہلی، لکھنؤ اور مرشد آباد کے درمیان منتقل ہوئے اور 1234ھ (1818) میں مدراس میں انتقال کر گئے۔ 1 ص۔ 862-863}۔"
  tr: "Aurangzeb'in soyundan gelen ve 'Aqeat Azfari' adlı eserin yazarı Muhammed Zahiruddin Mirza Ali Bakht Bahadur, Delhi ile Buthu, Murshidabad ve Madras arasında seyahat etti ve 1234 Hicri (1818 AD) yılında Madras'ta öldü {atıf:İslam Ansiklopedisi-2 cilt 1, s. 862-863}."
  id: "Muhammad Zahiruddin Mirza Ali Bakht Bahadur, keturunan Aurangzeb dan penulis 'Aqeat Azfari', melakukan perjalanan antara Delhi tetapi Buthu, Murshidabad, dan Madras, dan meninggal di Madras pada tahun 1234 H (1818 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 862-863}."
