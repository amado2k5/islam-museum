summary:
  ar: "فيزيائي نووي ومهندس معادن باكستاني، وُلد في بهوبال سنة 1936 وتوفي في إسلام آباد سنة 2021. هاجر إلى باكستان سنة 1952، وتدرّب في جامعات أوروبا الغربية، وأسّس سنة 1976 مختبرات الأبحاث الهندسية في كاهوتا — مختبرات خان البحثية لاحقا — التي بنت برنامج تخصيب اليورانيوم الباكستاني بالطرد المركزي. سنة 2004 خضع لاستجواب حول شبكة انتشار نووي واعترف علنا، فعفا عنه الرئيس مشرف ووُضع قيد الإقامة الجبرية سنوات. أُقيمت له جنازة رسمية في مسجد فيصل."
  en: "Pakistani nuclear physicist and metallurgical engineer, born in Bhopal in 1936 and died in Islamabad in 2021. He emigrated to Pakistan in 1952, trained at Western European universities, and in 1976 founded the Engineering Research Laboratories at Kahuta — later Khan Research Laboratories — which built Pakistan's centrifuge uranium enrichment programme. In 2004 he was debriefed over a nuclear proliferation network and confessed on television; President Musharraf pardoned him and he spent years under house arrest. He was given a state funeral at Faisal Mosque."
  ur: "پاکستانی جوہری طبیعیات دان اور دھات کاری کے انجینئر، جو 1936ء میں بھوپال میں پیدا ہوئے اور 2021ء میں اسلام آباد میں وفات پائی۔ وہ 1952ء میں پاکستان ہجرت کر آئے، مغربی یورپ کی جامعات سے تربیت پائی، اور 1976ء میں کاہوٹا میں انجینئرنگ ریسرچ لیبارٹریز — بعد میں خان ریسرچ لیبارٹریز — قائم کیں، جنھوں نے پاکستان کا سینٹری فیوج یورینیم افزودگی پروگرام بنایا۔ 2004ء میں ان سے جوہری پھیلاؤ کے نیٹ ورک پر تفتیش ہوئی اور انھوں نے ٹیلی ویژن پر اعتراف کیا؛ صدر مشرف نے انھیں معاف کر دیا اور وہ برسوں نظر بند رہے۔ ان کا جنازہ سرکاری اعزاز کے ساتھ فیصل مسجد میں ادا کیا گیا۔"
