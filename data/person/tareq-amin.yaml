  es: "Ejecutivo jordano-estadounidense de telecomunicaciones e inteligencia artificial. Lideró el desarrollo de Rakuten Mobile en Japón —la primera red Open RAN totalmente nativa de la nube del mundo— y posteriormente dirigió HUMAIN, la empresa nacional de inteligencia artificial de Arabia Saudita."
