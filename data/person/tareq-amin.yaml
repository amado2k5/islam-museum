  ar: "تقني ومسؤول تنفيذي أردني أمريكي في الاتصالات والذكاء الاصطناعي؛ قاد بناء شبكة راكوتن موبايل اليابانية المبنية بالكامل على الحوسبة السحابية وتقنية ⁦(Open RAN)⁩، ثم تولى قيادة شركة هيومين السعودية للذكاء الاصطناعي."
