summary:
  ar: "سيد محمد نقيب العطاس ⁦(1931–2026)⁩ فيلسوف ومتافيزيقي ماليزي، أستاذ ملكي فخري ومؤسس معهد ISTAC للفكر والحضارة الإسلامية بكوالالمبور. اشتهر بمشروع «أسلمة المعرفة» الذي طرحه في كتابيه «الإسلام والعلمنة» و«Prolegomena»، وهو مشروع أثّر في حركات التعليم الإسلامي المعاصر."
  en: "Syed Muhammad Naquib al-Attas (1931–2026) was a Malaysian philosopher and metaphysician, holder of a royal chair and founder of the ISTAC institute of Islamic thought and civilisation in Kuala Lumpur. He is best known for the 'Islamisation of knowledge' project set out in Islam and Secularism and Prolegomena to the Metaphysics of Islam, a framework that shaped contemporary Islamic education movements."
  ur: "سید محمد نقیب العطاس ⁦(1931–2026)⁩ ملائیشیائی فلسفی اور مابعد الطبیعیات دان تھے، رائل چیئر کے حامل اور کوالالمپور میں ISTAC ادارۂ اسلامی فکر و تہذیب کے بانی۔ وہ «اسلامی تکوینِ علم» کی مہم کے لیے مشہور ہیں جو انہوں نے «Islam and Secularism» اور «Prolegomena» میں پیش کی اور جس نے عصری اسلامی تعلیمی تحریکوں کو متاثر کیا۔"
  es: "Syed Muhammad Naquib al-Attas (1931-2026) fue un filósofo y metafísico malasio, titular de una cátedra real y fundador del Instituto ISTAC de pensamiento y civilización islámica en Kuala Lumpur. Es conocido principalmente por el proyecto de «islamización del conocimiento», expuesto en «Islam y secularismo» y «Prolegómenos a la metafísica del Islam», un marco que influyó en los movimientos de educación islámica contemporáneos."
  fr: "Syed Muhammad Naquib al-Attas (1931-2026) était un philosophe et métaphysicien malaisien, titulaire d'une chaire royale et fondateur de l'Institut ISTAC de pensée et de civilisation islamiques à Kuala Lumpur. Il est surtout connu pour son projet d'« islamisation du savoir », exposé dans son ouvrage *Islam et laïcité* et *Prolégomènes à la métaphysique de l'islam*, un cadre théorique qui a influencé les mouvements d'éducation islamique contemporains."
  tr: "Syed Muhammad Naqeeb Al-Atas (1931–2026), Malezyalı filozof ve metafizikçi, fahri kraliyet profesörü ve Kuala Lumpur'daki ISTAC İslami Düşünce ve Medeniyet Enstitüsü'nün kurucusuydu. \"Bilginin İslamlaştırılması\" projesiyle ünlendi; bu projeyi \"İslam ve Sekülerleşme\" ve \"Prolegomena\" adlı kitaplarında sundu; bu proje çağdaş İslami eğitim hareketlerini etkiledi."
  id: "Syed Muhammad Naqeeb Al-Atas (1931–2026) adalah seorang filsuf dan metafisikawan Malaysia, profesor kehormatan kerajaan, serta pendiri Institut Pemikiran dan Peradaban Islam ISTAC di Kuala Lumpur. Ia menjadi terkenal berkat proyek \"Islamisasi Pengetahuan,\" yang ia presentasikan dalam bukunya \"Islam dan Sekularisasi\" serta \"Prolegomena,\" sebuah proyek yang memengaruhi gerakan pendidikan Islam kontemporer."
