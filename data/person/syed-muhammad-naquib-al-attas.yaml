summary:
  ar: "سيد محمد نقيب العطاس ⁦(1931–2026)⁩ فيلسوف ومتافيزيقي ماليزي، أستاذ ملكي فخري ومؤسس معهد ISTAC للفكر والحضارة الإسلامية بكوالالمبور. اشتهر بمشروع «أسلمة المعرفة» الذي طرحه في كتابيه «الإسلام والعلمنة» و«Prolegomena»، وهو مشروع أثّر في حركات التعليم الإسلامي المعاصر."
  en: "Syed Muhammad Naquib al-Attas (1931–2026) was a Malaysian philosopher and metaphysician, holder of a royal chair and founder of the ISTAC institute of Islamic thought and civilisation in Kuala Lumpur. He is best known for the 'Islamisation of knowledge' project set out in Islam and Secularism and Prolegomena to the Metaphysics of Islam, a framework that shaped contemporary Islamic education movements."
  ur: "سید محمد نقیب العطاس ⁦(1931–2026)⁩ ملائیشیائی فلسفی اور مابعد الطبیعیات دان تھے، رائل چیئر کے حامل اور کوالالمپور میں ISTAC ادارۂ اسلامی فکر و تہذیب کے بانی۔ وہ «اسلامی تکوینِ علم» کی مہم کے لیے مشہور ہیں جو انہوں نے «Islam and Secularism» اور «Prolegomena» میں پیش کی اور جس نے عصری اسلامی تعلیمی تحریکوں کو متاثر کیا۔"
