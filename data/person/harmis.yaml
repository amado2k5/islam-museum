summary:
  ar: "هرمس العالم الذي كان في بابل من أكملهم عقلا وأصوبهم علما وألطفهم نظرا، فلما تشتت العلماء بعد ظهور النبي سقط إلى أرض مصر فملك أهلها وعمر أرضها وأصلح أحوال سكانها وأظهر علمه فيها، وبقي جل العلم وأكثره ببابل {cite:fihrist-ibn-al-nadim p. 332-333}."
  en: "Hermes — the Babylonian sage who took the sciences to Egypt in Abu Sahl's account {cite:fihrist-ibn-al-nadim}"
