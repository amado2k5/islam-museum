label: { ar: "هرمس", en: "Harmis", es: "Harmis", fr: "Harmis", ur: "ہرمیس" }
summary:
  ar: "هرمس العالم الذي كان في بابل من أكملهم عقلا وأصوبهم علما وألطفهم نظرا، فلما تشتت العلماء بعد ظهور النبي سقط إلى أرض مصر فملك أهلها وعمر أرضها وأصلح أحوال سكانها وأظهر علمه فيها، وبقي جل العلم وأكثره ببابل {cite:fihrist-ibn-al-nadim p. 332-333}."
  en: "Hermes — the Babylonian sage who took the sciences to Egypt in Abu Sahl's account {cite:fihrist-ibn-al-nadim}"
  es: "Hermes — el sabio babilonio que llevó las ciencias a Egipto según el relato de Abu Sahl {cite:fihrist-ibn-al-nadim}"
  fr: "Hermès — le sage babylonien qui apporta les sciences en Égypte selon le récit d'Abu Sahl {cite:fihrist-ibn-al-nadim}"
  ur: "ہرمیس - بابلی بابا جو ابو سہل کے بیان میں علوم کو مصر لے گیا"
  tr: "Babil'deki âlim Hermes, zekâ açısından en eksiksiz, bilgide doğru ve anlayışta en yumuşak olanlardan biriydi. Peygamber'in gelişinden sonra alimler dağıldığında, Mısır topraklarına düştü, halkını yönetti, topraklarını geliştirdi, sakinlerinin koşullarını iyileştirdi ve bilgisini orada ortaya koydu. Bilginin çoğu Babil'de kaldı {atıf:fihrist-ibn-al-nadim s. 332-333}."
  id: "Hermes, sarjana di Babilon, termasuk yang paling lengkap dalam kecerdasan, benar dalam pengetahuan, dan lembut dalam wawasan. Ketika para ulama tercerai-berai setelah kemunculan Nabi, ia jatuh ke tanah Mesir, memerintah rakyatnya, mengembangkan tanahnya, memperbaiki kondisi penduduknya, dan mengungkapkan pengetahuannya di sana. Sebagian besar pengetahuan tetap berada di Babilon {cite:fihrist-ibn-al-nadim hlm. 332-333}."
