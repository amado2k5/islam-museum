summary:
  ar: "عبد الله بن محمد بن يوسف، أبو محمد، البلوي الشبيبي القيرواني، فقيه. أخذ عن أبي الحسن العواني وأبي عمران المناوي وأبي عبد الله الغلال ومحمد الهسكوري وغيرهم، وعنه أبو القاسم بن ناجي والبرزلي وأبو حفص المسراتي. أقام نحو خمس وثلاثين سنة يدرّس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8200}"
  en: "Abd Allah ibn Muhammad ibn Yusuf, Abu Muhammad al-Balawi al-Shabibi of Qayrawan, a jurist. He studied with Abu al-Hasan al-Awwani, Abu Imran al-Manawi, Abu Abd Allah al-Ghallal and Muhammad al-Haskuri; Abu al-Qasim ibn Najji, al-Barzali and Abu Hafs al-Masrati heard him. He taught for about thirty-five years. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8200}"
