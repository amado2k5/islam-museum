summary:
  ar: "سياسية بريطانية من حزب العمال، وُلدت في بيشواناث بسيلهيت في بنغلاديش سنة 1975، وهاجرت مع أسرتها إلى شرق لندن في السابعة، وكانت أول أسرتها دخولا للجامعة فدرست في كلية سانت جون بأوكسفورد. عملت في البحث وحقوق الإنسان والتماسك المجتمعي قبل البرلمان، وانتُخبت سنة 2010 أولَ شخص من أصل بنغلاديشي في مجلس العموم وضمن أوائل النائبات المسلمات، وشغلت منصب وكيلة وزارة الدولة لشؤون التشرد والديمقراطية (2024-2025)."
  en: "British Labour Party politician, born at Bishwanath, Sylhet, Bangladesh, in 1975, who emigrated with her family to London's East End at seven and was the first in her family to go to university, reading PPE at St John's College, Oxford. She worked in research, human rights and community cohesion before Parliament, was elected in 2010 as the first person of Bangladeshi origin to sit in the House of Commons and one of the UK's first female Muslim MPs, and served as Parliamentary Under-Secretary of State for Homelessness and Democracy (2024–2025)."
  ur: "برطانوی لیبر پارٹی کی سیاست دان، جو 1975 میں بنگلہ دیش کے سلہٹ کے بشواناتھ میں پیدا ہوئیں، سات برس کی عمر میں خاندان کے ساتھ لندن کے ایسٹ اینڈ منتقل ہوئیں اور خاندان کی پہلی فرد کے طور پر جامعہ گئیں، جہاں انھوں نے سینٹ جانز کالج، آکسفورڈ میں تعلیم حاصل کی۔ پارلیمان سے پہلے وہ تحقیق، انسانی حقوق اور سماجی ہم آہنگی کے شعبوں میں کام کرتی رہیں، 2010 میں ایوانِ زیریں میں منتخب ہونے والی بنگلہ دیشی نژاد پہلی شخصیت اور برطانیہ کی پہلی مسلم خواتین ارکان میں شامل ہوئیں، اور 2024ء–2025ء میں بے گھری اور جمہوریت کی پارلیمانی انڈر سیکرٹری رہیں۔"
