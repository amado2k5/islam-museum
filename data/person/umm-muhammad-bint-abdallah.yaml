summary:
  ar: "أم محمد بنت عبد الله بن عثمان بن أبي العاص الثقفي امرأة سلم بن زياد؛ قطعت معه النهر إلى خراسان وكانت أول عربية عبر بها النهر فولدت له ابناً سماه السغدي واستعارت من امرأة صاحب السغد حليها فكرته عليها وذهبت به."
  en: "Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi, Salm ibn Ziyad's wife; she crossed the river with him — the first Arab woman across — bore the son he named al-Sughdi, and borrowed the Sughd lord's wife's jewels, wore and returned them."
