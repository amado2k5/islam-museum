label: { ar: "أم محمد بنت عبد الله بن عثمان الثقفية", en: "Umm Muhammad bint Abdallah al-Thaqafiyya", es: "Umm Muhammad bint Abdallah al-Thaqafiyya", fr: "Umm Muhammad bint Abdallah al-Thaqafiyya", ur: "ام محمد بنت عبداللہ الثقفیہ" }
summary:
  ar: "أم محمد بنت عبد الله بن عثمان بن أبي العاص الثقفي امرأة سلم بن زياد؛ قطعت معه النهر إلى خراسان وكانت أول عربية عبر بها النهر فولدت له ابناً سماه السغدي واستعارت من امرأة صاحب السغد حليها فكرته عليها وذهبت به."
  en: "Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi, Salm ibn Ziyad's wife; she crossed the river with him — the first Arab woman across — bore the son he named al-Sughdi, and borrowed the Sughd lord's wife's jewels, wore and returned them."
  es: "Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi, esposa de Salm ibn Ziyad; cruzó el río con él —la primera mujer árabe en cruzarlo—, dio a luz al hijo al que llamó al-Sughdi, y tomó prestadas las joyas de la esposa del señor Sughd, las usó y las devolvió."
  fr: "Umm Muhammad bint Abdallah ibn Uthman ibn Abi al-As al-Thaqafi, l'épouse de Salm ibn Ziyad; elle traversa le fleuve avec lui — la première femme arabe à le faire — donna naissance au fils qu'il nomma al-Sughdi, et emprunta les bijoux de l'épouse du seigneur Sughd, les porta et les rendit."
  ur: "ام محمد بنت عبداللہ بن عثمان بن ابی العاص ثقفی، سلم بن زیاد کی بیوی؛ اس نے اس کے ساتھ دریا کو پار کیا - پہلی عرب عورت جس کے پار اس نے بیٹا پیدا کیا جس کا نام اس نے السغدی رکھا، اور سغد کے رب کی بیوی کے زیورات ادھار لیے، پہنائے اور واپس کردیے۔"
