perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni tradition holds that Abu Talib died without embracing Islam, citing the hadith report that at his death he would not pronounce the shahada, while honoring his lifelong protection of the Prophet.", ar: "تروي السنة أن أبا طالب مات على غير الإسلام، وتستدل بالخبر أنه أبى عند موته أن ينطق الشهادة، وتُجِلّ مع ذلك حمايته للنبي عمرًا." }
    sources: [source/ibn-sad-tabaqat-bewley]
  - tradition: academic
    id: academic
    summary: { en: "Historians note that the reports about his deathbed were written after the Sunni-Shia split and serve each side's position; his pagan milieu and his steadfast protection are both documented, his inner conviction is not.", ar: "يشير المؤرخون إلى أن أخبار موته كُتبت بعد انشقاق السنة والشيعة فخدمت كلا الفريقين؛ حمايته موثقة أما قناعته الباطنة فغير موثقة." }
    sources: [source/madelung-1997]
  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition holds that Abu Talib was a believer who concealed his faith to keep his position among Quraysh and so protect his nephew, and venerates him accordingly.", ar: "يذهب التراث الإمامي إلى أن أبا طالب كان مؤمنًا كتم إيمانه ليبقي منزلته في قريش فيحمي بها ابن أخيه، ويوقّره على ذلك." }
    sources: [source/momen-1985]
