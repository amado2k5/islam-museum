summary:
  ar: "سياسي بوسني من ليفنو، مؤسس المنظمة الشعبية المسلمة وأول رئيس لها وأول رئيس للبرلمان البوسني سنة 1910: ملّاك من أسرة قبطانات ليفنو القديمة، قاد حركة الاستقلال الوقفي والتعليمي للمسلمين، ومات في منصبه بعد أسابيع من انعقاد البرلمان."
  en: "Bosnian politician from Livno, founder and first president of the Muslim People's Organisation (1906) and first president of the Bosnian Diet (1910): a landowner of the old Livno captain family who led the movement for waqf and educational autonomy and died in office weeks after the Diet first convened."
  ur: "لیونو سے تعلق رکھنے والے بوسنیائی سیاست دان، مسلم پیپلز آرگنائزیشن (1906ء) کے بانی اور پہلے صدر اور 1910ء میں بوسنیائی پارلیمان کے پہلے صدر: لیونو کے قدیم کپتان خاندان کے زمیندار، وقف و تعلیمی خود مختاری کی تحریک کے رہنما، پارلیمان کے پہلے اجلاس کے چند ہفتوں بعد عہدے پر ہی وفات پائی۔"
