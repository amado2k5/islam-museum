summary:
  ar: "رجل دولة قازاقي سوفييتي وعالم وناشر (1894–1938): مفوض الداخلية (1920) ثم مفوض التعليم (1921) في جمهورية تركستان، وشارك في إقامة حكم تركستان الذاتي سنة 1917، وكان من أبرز العاملين على الترسيم الوطني لآسيا الوسطى واستعادة اسم «القازاق». اعتُقل في يوليو 1937 وأُعدم في سجن بوتيركا بموسكو في 10 فبراير 1938 ورُدّ اعتباره سنة 1957."
  en: "Kazakh Soviet statesman, scholar and publicist (1894–1938): people's commissar of internal affairs (1920) and then of education (1921) of the Turkestan ASSR, a participant in creating the Turkestan Autonomy in 1917, and a leading worker for the national delimitation of Central Asia and for restoring the name 'Kazakh'. Arrested in July 1937, he was shot in Moscow's Butyrka Prison on 10 February 1938 and rehabilitated in 1957."
  ur: "قازاق سوویت ریاستی رہنما، عالم اور صحافی (1894–1938): ترکستان جمہوریہ کے مفوضِ داخلہ (1920) اور پھر مفوضِ تعلیم (1921)، 1917 میں ترکستان خودمختاری کے قیام میں شریک، وسطی ایشیا کی قومی حدبندی اور «قازاق» نام کی بحالی کے نمایاں کارکن۔ جولائی 1937 میں گرفتار ہوئے، 10 فروری 1938 کو ماسکو کی بوترکا جیل میں گولی مار دیے گئے اور 1957 میں بحالِ حیثیت ہوئے۔"
