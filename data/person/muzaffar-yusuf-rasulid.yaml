class: person
label:
  ar: الملك المظفر شمس الدين يوسف بن عمر
  en: al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar
  es: "al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar"
  fr: "al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar"
  ur: "المالک المظفر شمس الدین یوسف ابن عمر"
summary:
  ar: "الملك المظفر شمس الدين يوسف بن عمر بن علي بن رسول، ثالث ملوك بني رسول باليمن؛ قام بالأمر بعد مقتل أبيه سنة 648هـ، وكان عادلاً محسناً، وفرض الأتاوة على نفسه لملوك مصر من الترك لما استقلوا بالملك وما زال يصانعهم بها، وشغل أول ملكه بحصن الدملوة وبثورة أحمد الموطىء الزيدي الذي ملك عشرين حصناً من حصون الزيدية وملك صفد، ولم يزل والياً على اليمن إلى أن هلك بغتة سنة 694هـ لست وأربعين سنة من ملكه."
  en: "Al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar, third Rasulid king of Yemen; taking power after his father's killing in 648 AH, he was just and beneficent, assessed upon himself the atawa tribute to Egypt's Turkish kings and kept buying their goodwill, spent his first reign besieging the Damluwa fortress and fighting the Zaydi claimant Ahmad al-Mu'ti who took twenty Zaydi fortresses and Safad — and remained wali of Yemen until he died suddenly in 694 in the forty-sixth year of his rule."
  es: "Al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar, tercer rey rasulí de Yemen, tomó el poder tras el asesinato de su padre en el año 648 de la Hégira. Fue justo y benéfico, se impuso el tributo atawa a los reyes turcos de Egipto y se dedicó a ganarse su favor. Durante su primer reinado, se dedicó a asediar la fortaleza de Damluwa y a luchar contra el pretendiente zaidí Ahmad al-Mu'ti, quien tomó veinte fortalezas zaidíes y Safad. Permaneció como wali de Yemen hasta su repentina muerte en el año 694, en el cuadragésimo sexto año de su reinado."
  fr: "Al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar, troisième roi rasulide du Yémen; accédant au pouvoir après l'assassinat de son père en 648 AH, il fut juste et bienfaisant, s'imposa le tribut atawa aux rois turcs d'Égypte et s'assura leur bienveillance, passa son premier règne à assiéger la forteresse de Damluwa et à combattre le prétendant zaydite Ahmad al-Mu'ti qui s'empara de vingt forteresses zaydites et de Safad — et resta wali du Yémen jusqu'à sa mort subite en 694, dans la quarante-sixième année de son règne."
  ur: "المالک المظفر شمس الدین یوسف ابن عمر، یمن کا تیسرا رسول بادشاہ؛ 648 ہجری میں اپنے والد کے قتل کے بعد اقتدار سنبھالنے کے بعد، وہ عادل اور مہربان تھا، اس نے مصر کے ترک بادشاہوں کو عطوا خراج تحسین پیش کیا اور ان کی خیر خواہی کو خریدتے رہے، اپنا پہلا دور حکومت دملوہ قلعہ کا محاصرہ کرتے ہوئے اور زیدی دعویدار احمد الموطی سے لڑتے رہے - جس نے بیس سعیدی اور یحیدی اور یحییٰ کو لے لیا یہاں تک کہ وہ باقی رہے۔ اپنی حکومت کے چھیالیسویں سال 694ء میں اچانک انتقال کر گئے۔"
  tr: "Kral El-Muzaffar Şemseddin Yusuf ibn Ömer ibn Ali ibn Rasul, Yemen'deki Banu Rasul'un üçüncü kralı, babasının 648 Hicri yılındaki ölümünden sonra tahta geçti. Adil ve iyilikseverdi, Mısır kralları bağımsız olduklarında Mısır krallarına vergi koydu ve hâlâ orada desteklemeye devam ediyor. İlk olarak Damlava kalesinde ve yirmi Zeydi kalesini yöneten ve Safad'ı yöneten Ahmed al-Muwatta al-Zaydi'nin isyanında hüküm sürdü. 694 Hicri'de, saltanatının kırk altı yılı boyunca aniden ölene kadar Yemen valisi olarak kaldı."
  id: "Raja Al-Muzaffar Shams al-Din Yusuf ibn Umar ibn Ali ibn Rasul, raja ketiga Banu Rasul di Yaman, mengambil alih setelah kematian ayahnya pada tahun 648 H. Ia adil dan baik hati, dan mengenakan upeti kepada dirinya sendiri kepada raja-raja Mesir dari Turki ketika mereka merdeka dan terus mendukung mereka di sana. Ia pertama kali memerintah di benteng Damlawa dan dalam pemberontakan Ahmad al-Muwatta al-Zaydi, yang memerintah dua puluh benteng Zaydi dan memerintah Safad. Ia tetap menjadi gubernur Yaman hingga meninggal secara mendadak pada tahun 694 H, empat puluh enam tahun pemerintahannya."
