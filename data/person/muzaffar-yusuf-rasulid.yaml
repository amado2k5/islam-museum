label:
  ar: الملك المظفر شمس الدين يوسف بن عمر
  en: al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar
summary:
  ar: "الملك المظفر شمس الدين يوسف بن عمر بن علي بن رسول، ثالث ملوك بني رسول باليمن؛ قام بالأمر بعد مقتل أبيه سنة 648هـ، وكان عادلاً محسناً، وفرض الأتاوة على نفسه لملوك مصر من الترك لما استقلوا بالملك وما زال يصانعهم بها، وشغل أول ملكه بحصن الدملوة وبثورة أحمد الموطىء الزيدي الذي ملك عشرين حصناً من حصون الزيدية وملك صفد، ولم يزل والياً على اليمن إلى أن هلك بغتة سنة 694هـ لست وأربعين سنة من ملكه."
  en: "Al-Malik al-Muzaffar Shams al-Din Yusuf ibn Umar, third Rasulid king of Yemen; taking power after his father's killing in 648 AH, he was just and beneficent, assessed upon himself the atawa tribute to Egypt's Turkish kings and kept buying their goodwill, spent his first reign besieging the Damluwa fortress and fighting the Zaydi claimant Ahmad al-Mu'ti who took twenty Zaydi fortresses and Safad — and remained wali of Yemen until he died suddenly in 694 in the forty-sixth year of his rule."
