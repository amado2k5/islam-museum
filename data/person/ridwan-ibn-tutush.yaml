label:
  ar: رضوان بن تتش
  en: Ridwan ibn Tutush
  es: "Ridwan ibn Tutush"
  fr: "Ridwan ibn Tutush"
summary:
  ar: "رضوان بن تاج الدولة تتش بن ألب أرسلان؛ كان أبوه أوصى أصحابه قبل المصاف بطاعته فلما قتل تتش بالري سنة 488هـ بلغه الخبر عند هيت فعاد إلى حلب، وثار جناح الدولة الحسن بن أفتكين بقلعتها من الليل ونادى بشعاره فخطب له على منابرها وأعمالها وأحسن تدبير دولته، وحاصر نصيبين مع الألبي سنة 499هـ، وكان أخوه دقاق بدمشق فتنازعا الملك."
  en: "Ridwan ibn Taj al-Dawla Tutush ibn Alp Arslan; his father had commended him to his men before battle, and when Tutush fell at Rayy in 488 AH the news reached him at Hit — he returned to Aleppo where Janah al-Dawla al-Hasan ibn Aftakin seized the citadel by night, proclaimed him from its pulpits and managed his state well; he besieged Nisibis with al-Albi in 499 and contested kingship with his brother Duqaq at Damascus."
  es: "Ridwan ibn Taj al-Dawla Tutush ibn Alp Arslan; su padre lo había recomendado a sus hombres antes de la batalla, y cuando Tutush cayó en Rayy en el año 488 de la Hégira, la noticia le llegó a Hit. Regresó a Alepo, donde Janah al-Dawla al-Hasan ibn Aftakin tomó la ciudadela por la noche, lo proclamó desde sus púlpitos y administró bien su estado. Sitió Nisibis con al-Albi en el año 499 y disputó el trono con su hermano Duqaq en Damasco."
  fr: "Ridwan ibn Taj al-Dawla Tutush ibn Alp Arslan; son père l'avait recommandé à ses hommes avant la bataille, et lorsque Tutush tomba à Rayy en 488 AH, la nouvelle lui parvint à Hit — il retourna à Alep où Janah al-Dawla al-Hasan ibn Aftakin s'empara de la citadelle de nuit, le proclama depuis ses chaires et géra bien son État; il assiégea Nisibis avec al-Albi en 499 et contesta le trône avec son frère Duqaq à Damas."
