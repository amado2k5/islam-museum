summary:
  ar: "ثابت بن كعب بن جابر المازني مزيقياء، المعروف بثابت قطنة؛ من شعراء خراسان وفرسانها، ذهبت عينه فكان يحشوها قطنة فسمي به؛ استعمله يزيد بن المهلب على بعض كور خراسان، فلما علا المنبر أرتج عليه فلم ينطق حتى نزل، فدخل عليه الناس فقال: فإن لا أقم فيكم خطيباً فإنني بسيفي إذا جد الوغى لحطيب، فقالوا: لو كنت قلت هذا على المنبر لكنت أخطب الناس؛ ذكره ابن قتيبة في طبقات الشعراء {cite:wafayat-ayan}."
  en: "Thabit 'Qutna' — the Khurasani warrior-poet of Yazid b. al-Muhallab's staff, nicknamed for the cotton in his lost eye; famed for the frozen-on-the-minbar anecdote and his sword-line {cite:wafayat-ayan}."
