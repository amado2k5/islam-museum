label: { ar: "ثابت قطنة", en: "Thabit Qutna", es: "Thabit Qutna", fr: "Thabit Qutna", ur: "ثابت قطنا" }
summary:
  ar: "ثابت بن كعب بن جابر المازني مزيقياء، المعروف بثابت قطنة؛ من شعراء خراسان وفرسانها، ذهبت عينه فكان يحشوها قطنة فسمي به؛ استعمله يزيد بن المهلب على بعض كور خراسان، فلما علا المنبر أرتج عليه فلم ينطق حتى نزل، فدخل عليه الناس فقال: فإن لا أقم فيكم خطيباً فإنني بسيفي إذا جد الوغى لحطيب، فقالوا: لو كنت قلت هذا على المنبر لكنت أخطب الناس؛ ذكره ابن قتيبة في طبقات الشعراء {cite:wafayat-ayan}."
  en: "Thabit 'Qutna' — the Khurasani warrior-poet of Yazid b. al-Muhallab's staff, nicknamed for the cotton in his lost eye; famed for the frozen-on-the-minbar anecdote and his sword-line {cite:wafayat-ayan}."
  es: "Thabit 'Qutna', el guerrero-poeta de Jorasán del séquito de Yazid b. al-Muhallab, apodado así por el algodón en su ojo perdido; famoso por la anécdota del minbar congelado y su frase sobre la espada {cite:wafayat-ayan}."
  fr: "Thabit 'Qutna' — le guerrier-poète khurasani de l'équipe de Yazid b. al-Muhallab, surnommé pour le coton dans son œil perdu; célèbre pour l'anecdote du gel sur le minbar et sa ligne d'épée {cite:wafayat-ayan}."
  ur: "ثابت 'قطنا' - یزید بن کا خراسانی جنگجو شاعر۔ المحلب کا عملہ، جسے اس کی کھوئی ہوئی آنکھ میں روئی کا نام دیا گیا ہے۔ منجمد آن دی منبر کہانی اور اس کی تلوار کی لکیر کے لیے مشہور ہے۔"
  tr: "Thabit ibn Ka'b ibn Jabir al-Mazni Muziqiya, Thabit Qutna olarak bilinir, Horasan'ın şairlerinden ve şövalyelerinden biriydi. Gözü kaybolmuştu ve onu Qutna ile doldururdu, bu yüzden onun adını aldı; Yezid bin al-Muhallab onu Horasan'ın bazı tepelerine atladı. Minbe çıktığında titredi ve atından inene kadar konuşmadı. Halk içeri girdi ve dediler ki: Aranızdan vaiz yapmazsam, Khtib için savaş hazır olduğunda kılıcımla olacağım. Dediler ki: Bunu kürsüde söyleseydim, halka hitap ederdim; bunu İbn Qutaybah Tabaqat al-Shu'ara'da belirtmiştir {cite:wafayat-ayan}."
  id: "Thabit ibn Ka'b ibn Jabir al-Mazni Muziqiya, yang dikenal sebagai Thabit Qutna, adalah salah satu penyair dan ksatria Khurasan. Matanya hilang dan ia biasa mengisinya dengan Qutna, sehingga ia dinamai menurut namanya; Yazid ibn al-Muhallab menunjuknya di beberapa bukit Khorasan. Ketika ia naik ke mimbar, ia gemetar dan tidak berbicara sampai turun dari kuda. Orang-orang masuk dan berkata: Jika aku tidak menjadikan seorang pengkhotbah di antara kalian, aku akan membawa pedangku saat pertempuran untuk Khtib siap. Mereka berkata: Jika aku mengatakan ini di mimbar, aku akan berbicara kepada rakyat; ini disebutkan oleh Ibn Qutaybah dalam Tabaqat al-Shu'ara {cite:wafayat-ayan}."
