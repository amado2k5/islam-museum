summary:
  ar: "شاعرة جاهلية من بني قيس بن ثعلبة، أخت طرفة بن العبد لأمه، أكثر شعرها في رثاء أخيها طرفة وزوجها عمرو بن مرثد وابنها علقمة الذين قتلوا يوم قلاب؛ يترجم لها كحالة في «أعلام النساء»."
  en: "A pre-Islamic poet of Qays ibn Tha'laba, maternal half-sister of Tarafa ibn al-Abd, whose verse is mostly elegy for Tarafa and for her husband Amr ibn Marthad and son Alqama, killed on the Day of Qulab; Kahhala includes her in A'lam al-Nisa'."
  ur: "قیس بن ثعلبہ کی ایک جاہلی شاعرہ، طرفہ بن العبد کی ماں جائی بہن، جن کے زیادہ تر اشعار طرفہ اور اپنے شوہر عمرو بن مرثد اور بیٹے علقمہ کے مرثیے ہیں جو یومِ قلاب میں مارے گئے؛ کحالہ «اعلام النساء» میں ان کا ترجمہ دیتے ہیں۔"
