summary:
  ar: "يزيد بن يزيد، الساجد الحميد الحامد الشديد. كان في سجوده يقول: خبثت أنفسنا بالذنوب فطيّبنا بالمغفرة. سمع ذلك منه الخليل البصري."
  en: "Yazid ibn Yazid, a prostrating worshipper, praising and thankful, strong in devotion; in his prostration he used to say: our souls were made foul by sins, so make us pure through forgiveness; al-Khalil al-Basri heard him say it."
  ur: "یزید بن یزید سجدہ کرنے والے، حمد کرنے والے اور عبادت میں مضبوط تھے۔ سجدے میں کہا کرتے: ہمارے نفس گناہوں سے آلودہ ہو گئے، تو ہمیں بخشش سے پاک کر دے۔ یہ بات خلیل بصری نے ان سے سنی۔"
  es: "Yazid ibn Yazid, un adorador que se postraba, alababa y agradecía, fuerte en devoción; en su postración solía decir: nuestras almas fueron manchadas por los pecados, así que purifícanos mediante el perdón; al-Khalil al-Basri lo escuchó decirlo."
  fr: "Yazid ibn Yazid, un adorateur prosterné, louant et reconnaissant, fort dans sa dévotion; dans sa prosternation, il avait coutume de dire: nos âmes ont été souillées par les péchés, purifiez-nous donc par le pardon; al-Khalil al-Basri l'a entendu le dire."
  tr: "Yezid bin Yezid, secde, övgüye değer ve en övgüye değer. Secdesinde şöyle derdi: Günahlarla kendimizi yozlaştırdık, ama affedilmekle memnun olduk. El-Halil el-Basri bunu ondan duydu."
  id: "Yazid ibn Yazid, yang sujud, terpuji, dan paling terpuji. Dalam sujudnya, ia berkata: Kami telah merusak diri kami dengan dosa, tetapi kami senang dengan pengampunan. Al-Khalil al-Basri mendengar hal ini darinya."
