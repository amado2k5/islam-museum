id: person/zayn-al-din-ibn-naja
class: person
label: { ar: "زين الدين علي بن نجا", en: "Zayn al-Din Ali ibn Naja", es: "Zayn al-Din Ali ibn Naja", fr: "Zayn al-Din Ali ibn Naja", ur: "زین الدین علی ابن نجا۔" }
summary:
  ar: "زين الدين علي بن نجا الواعظ القاضي المعروف بابن نجية؛ أدخله المصريون المتواطئون على إعادة الدولة العلوية في أمرهم ورتبوا له منصب القضاء، فلما علم حقيقة الأمر حضر عند صلاح الدين وأعلمه به، فأمره بملازمتهم ومخالطتهم ومواطأتهم وتعريفه بما يتجدد أولاً بأول ففعل حتى كشف الأمر كله وقبض على المقدمين فصلبوا ثاني رمضان سنة تسع وستين وخمسمائة؛ ويذكرون أن القاضي الفاضل كلفه بكشف الأمر لما شك في عبد الصمد الكاتب {cite:kamil-ibn-al-athir p. 53-54}."
  en: "Ali ibn Naja 'Ibn Najiyya', preacher and qadi — let into the Fatimid-restoration circle as its designated judge, he reported it to Saladin and was ordered to keep their confidence and feed him every new development until the plot and its Frankish correspondence were exposed and the leaders crucified {cite:kamil-ibn-al-athir p. 53-54}."
  es: "Ali ibn Naja 'Ibn Najiyya', predicador y cadí, admitido en el círculo de la restauración fatimí como su juez designado, informó a Saladino y se le ordenó mantener la confidencialidad y mantenerlo al tanto de cada nuevo acontecimiento hasta que la conspiración y su correspondencia franca fueran expuestas y los líderes crucificados {cite:kamil-ibn-al-athir p. 53-54}."
  fr: "Ali ibn Naja 'Ibn Najiyya', prédicateur et cadi — admis dans le cercle de la restauration fatimide en tant que juge désigné, l'a rapporté à Saladin et a reçu l'ordre de garder leur confiance et de lui faire part de chaque nouveau développement jusqu'à ce que le complot et sa correspondance franque soient exposés et les chefs crucifiés {cite:kamil-ibn-al-athir p. 53-54}."
  ur: "علی بن ناجا 'ابن ناجیہ'، مبلغ اور قاضی - کو فاطمی بحالی کے دائرے میں اس کے نامزد جج کے طور پر جانے دیا، اس نے صلاح الدین کو اس کی اطلاع دی اور اسے حکم دیا گیا کہ وہ ان کا اعتماد برقرار رکھے اور اسے ہر نئی پیشرفت فراہم کرے جب تک کہ اس سازش اور اس کی فرینکش خط و کتابت کا پردہ فاش نہ ہو جائے اور قائدین کو مصلوب کر دیا جائے۔ 53-54}۔"
  tr: "İbn Naciye olarak bilinen vaiz ve yargıç Zeydin Ali bin Naja, Alaoui devletinin yeniden kurulmasında suç ortağı olan Mısırlılar tarafından işlerine dahil edilip yargıç olarak atandı. Gerçeği öğrendiğinde Salah al-Din'e gitti ve durumu bildirdi. Ona onlarla birlikte gitmesini, onlarla iş birliği yapmasını ve son gelişmeleri bildirmesini emretti. Tüm mesele ortaya çıkana kadar, liderler tutuklanıp 569 Hicri yılının ikinci Ramazan'ında çarmıha gerilene kadar böyle yaptı. Erdemli hakimin, Abd al-Samad al-Katib'e şüpheyle yaklaştığında onu bu işi ortaya çıkarmakla görevlendirdiği belirtilir {cite:kamil-ibn-al-athir s. 53-54}."
  id: "Zain al-Din Ali ibn Naja, pendakwah dan hakim yang dikenal sebagai Ibn Najiyyah, dibawa oleh orang Mesir, yang turut serta dalam memulihkan negara Alaou, dalam urusan mereka dan mengangkatnya sebagai hakim. Ketika mengetahui kebenaran masalah ini, ia menemui Salah al-Din dan memberitahunya. Ia memerintahkannya untuk menemani mereka, bersekutu dengan mereka, dan memberitahukan kabar terbaru. Ia melakukannya sampai seluruh masalah terungkap, para pemimpin ditangkap, dan mereka disalibkan pada tanggal kedua Ramadan tahun 569 H. Disebutkan bahwa hakim yang berbudi luhur menugaskannya untuk mengungkap masalah tersebut ketika ia meragukan Abd al-Samad al-Katib {cite:kamil-ibn-al-athir hlm. 53-54}."
