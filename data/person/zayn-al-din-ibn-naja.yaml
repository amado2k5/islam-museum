summary:
  ar: "زين الدين علي بن نجا الواعظ القاضي المعروف بابن نجية؛ أدخله المصريون المتواطئون على إعادة الدولة العلوية في أمرهم ورتبوا له منصب القضاء، فلما علم حقيقة الأمر حضر عند صلاح الدين وأعلمه به، فأمره بملازمتهم ومخالطتهم ومواطأتهم وتعريفه بما يتجدد أولاً بأول ففعل حتى كشف الأمر كله وقبض على المقدمين فصلبوا ثاني رمضان سنة تسع وستين وخمسمائة؛ ويذكرون أن القاضي الفاضل كلفه بكشف الأمر لما شك في عبد الصمد الكاتب {cite:kamil-ibn-al-athir p. 53-54}."
  en: "Ali ibn Naja 'Ibn Najiyya', preacher and qadi — let into the Fatimid-restoration circle as its designated judge, he reported it to Saladin and was ordered to keep their confidence and feed him every new development until the plot and its Frankish correspondence were exposed and the leaders crucified {cite:kamil-ibn-al-athir p. 53-54}."
