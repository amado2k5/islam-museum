summary:
  ar: "أبو مسلم الكجي انتقل أبوه إلى البصرة وبنى دارا بالجص والآجر فكان يقول للصناع كج أكج أي استعملوا الجص فغلب عليه هذا الكلام فسمي الكجي، وكان أبو مسلم من جلة المحدثين من عالية الإسناد وله كتاب السنن وكتاب المسند {cite:fihrist-ibn-al-nadim p. 324}."
  en: "Al-Kajji — named for his father's gypsum-builders' cry 'kajj akajj' {cite:fihrist-ibn-al-nadim}"
  es: "Al-Kajji — llamado así por el grito de los constructores de yeso de su padre, 'kajj akajj' {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Kajji — nommé d'après le cri de guerre de son père, « kajj akajj », un constructeur de gypse {cite:fihrist-ibn-al-nadim}"
  ur: "الکاجی - اپنے والد کے جپسم بنانے والوں کی پکار 'کج اکاج' کے نام پر رکھا گیا {حوالہ: فہرست ابن الندیم"
  tr: "Ebu Müslim el-Kaci: Babası Basra'ya taşındı ve sıva ile tuğladan bir ev inşa etti. Zanaatkârlara 'kaj akj' derdi, yani sıva kullandılar, bu da konuşmasında yaygınlaştı, bu yüzden ona al-kaji dendi. Ebu Müslim, yüksek bir aktarım zincirine sahip önde gelen hadis âlimlerinden biriydi ve Sünan kitabı ile Musnad kitaplarını yazdı {atıf:fihrist-ibn-al-nadim s. 324}."
  id: "Abu Muslim al-Kaji: Ayahnya pindah ke Basra dan membangun rumah dengan plester dan bata. Ia biasa menyebut para pengrajin 'kaj akj,' artinya mereka menggunakan plester, yang menjadi umum dalam ucapannya, sehingga ia disebut al-kaji. Abu Muslim adalah salah satu ulama hadits terkemuka dengan jaringan transmisi yang tinggi dan menulis kitab Sunan serta kitab Musnad {cite:fihrist-ibn-al-nadim hlm. 324}."
