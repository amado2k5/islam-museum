summary:
  ar: "مير محمد تقي، المعروف بمير تقي مير (1723 – 20 سبتمبر 1810)، شاعر أردي من الهند المغولية، وأحد مؤسسي الغزل الأردي الكلاسيكي، يُلقَّب بخدا سخن أي إله الشعر. وُلد في أغرا ونشأ في دلهي التي أحبها وكتب مراثيها عند نهبها، ثم انتقل إلى بلاط آصف الدولة في لكناو حيث قضى بقية عمره. ترك سيرته الذاتية «ذكر مير» وديواناً ضخماً غلب عليه الحزن والوجد."
  en: "Mir Muhammad Taqi, known as Mir Taqi Mir (1723 – 20 September 1810), was an Urdu poet of Mughal India and one of the founders of the classical Urdu ghazal, remembered as Khuda-e-Sukhan, the god of poetry. Born at Agra, he lived his prime at Delhi, whose sackings his verse mourns, then moved to Asaf-ud-Daula's court at Lucknow for the rest of his life. He left an autobiography, Zikr-e-Mir, and a vast diwan marked by grief and longing."
  ur: "میر محمد تقی، معروف بہ میر تقی میر (1723ء – 20 ستمبر 1810ء)، مغلیہ ہندوستان کے اردو شاعر اور کلاسیکی اردو غزل کے بانیوں میں سے تھے، جنھیں خداے سخن کہا جاتا ہے۔ آگرہ میں پیدا ہوئے، دہلی میں پروان چڑھے جس کی بربادی کا دکھ ان کے کلام میں نمایاں ہے، پھر لکھنؤ میں آصف الدولہ کے دربار سے وابستہ ہو کر بقیہ زندگی وہیں گزاری۔ انھوں نے اپنی سوانح ”ذکرِ میر“ اور غم و اشتیاق سے بھرپور ایک ضخیم دیوان چھوڑا۔"

