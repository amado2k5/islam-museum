summary:
  ar: "أخو عبد الملك وساعده الأيمن في كل شئون الدولة؛ هرب معه إلى السلطان العثماني، وبويع سلطاناً في ميدان وادي المخازن يوم ٣٠ جمادى الآخرة ٩٨٦هـ/٤ أغسطس ١٥٧٨م بعد أن كتم مع الحاجب رضوان موت أخيه حتى تم النصر وقاد مقدمة الجيش صادماً مؤخرة البرتغاليين. استمر على منهج أخيه: بناء المؤسسات، محاسبة الوزراء على أوقات العمل، اختراع حروف رمزية للمراسلات السرية، فصل القضاء عن التنفيذية وترؤسه مجلس المظالم بجامع القصبة، إقامة محطات حراسة للقوافل كل عشرين كيلومتراً، إنشاء مجلس الديوان المرن، تطوير الجيش على النظام العثماني وإسناد القيادات للكفاءة، المستشفيات الميدانية ودار العدة لصناعة المدافع وتطوير الأسطول في العرائش وسلا، ثم مدّ نفوذه نحو بلاد السودان الغربي ولعب موازنات الأسبان والإنجليز والعثمانيين {cite:dawlat-uthmaniyya-salabi p. 265-270}. ولما وصل قلج علي الجزائر لضم المغرب سنة ٩٨٩هـ/١٥٨١م رابط بقواته عند نهر تانسيفت وسدّ مداخل مملكته وحصّن الثغور ووجه سفارة إلى إستانبول، بعد شبه اتفاق عسكري مع ملك إسبانيا مقابل التنازل عن العرائش — فتراجع العثمانيون. وترددت السفارات بين الأستانة وفاس بين ٩٩٧هـ/١٥٨٨م و٩٩٩هـ/١٥٩٠م واستقبل سفيراً عثمانياً سنة ٩٩٨هـ/١٥٨٩م، دون أن يتحقق تحالف استرداد الأندلس لانشغال الدولة بالصفويين والهابسبورج والحجاز {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  en: "Abd al-Malik's brother and right hand in all state affairs; he fled with him to the Ottoman sultan and was acclaimed on the field of Wadi al-Makhazin, 30 Jumada II 986/4 August 1578, having concealed his brother's death with the chamberlain Ridwan and led the vanguard into the Portuguese rear. He continued his brother's programme: building institutions, holding ministers to office hours, a cipher alphabet for secret correspondence, separation of the judiciary with his own mazalim council at the Qasba mosque of Marrakesh, guarded stations every twenty kilometres for caravans, the flexible Diwan council, an army on the Ottoman model with merit-based commands, field hospitals, a gun foundry, the Larache and Salé fleets — then extended Sa'di sway over the western Sudan and played Spain, England and the Ottomans off one another {cite:dawlat-uthmaniyya-salabi p. 265-270}. When Uluj Ali reached Algiers to annex Morocco in 989/1581, al-Mansur camped at the Tensift, sealed his passes, fortified the shores and sent an embassy to Istanbul — after a near-agreement with Spain trading Larache for military aid — and the Ottomans backed off. Embassies shuttled between Istanbul and Fez in 997–999/1588–1590 and he received an Ottoman envoy in 998/1589, yet the al-Andalus alliance never materialised, the Porte busy with Safavids, Habsburgs and the Hejaz {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  fr: "Frère et bras droit d'Abd al-Malik dans toutes les affaires de l'État, il s'enfuit avec lui auprès du sultan ottoman et fut acclamé sur le champ de Wadi al-Makhazin le 30 joumada II 986 H/4 août 1578 ap. J.-C., après avoir dissimulé la mort de son frère avec le chambellan Ridwan et mené l'avant-garde sur les arrières portugais. Il poursuivit son programme : institutions, horaires pour les ministres, alphabet chiffré pour la correspondance secrète, séparation du judiciaire avec son conseil des mazalim à la mosquée de la Qasba de Marrakech, postes gardés tous les vingt kilomètres pour les caravanes, conseil souple du Diwan, armée sur le modèle ottoman et commandements au mérite, hôpitaux de campagne, fonderie de canons, flottes de Larache et de Salé. Il étendit ensuite le pouvoir saadien au Soudan occidental et joua l'Espagne, l'Angleterre et les Ottomans les uns contre les autres {cite:dawlat-uthmaniyya-salabi p. 265-270}. À l'arrivée d'Uluj Ali à Alger pour annexer le Maroc en 989 H/1581 ap. J.-C., al-Mansur campa au Tensift, ferma les cols, fortifia les côtes et envoya une ambassade à Istanbul, après avoir presque conclu avec l'Espagne un échange de Larache contre une aide militaire ; les Ottomans reculèrent. Des ambassades circulèrent entre Istanbul et Fès en 997–999 H/1588–1590 ap. J.-C. et il reçut un envoyé ottoman en 998 H/1589 ap. J.-C., mais l'alliance pour al-Andalus ne se réalisa jamais, la Porte étant occupée par les Safavides, les Habsbourg et le Hedjaz {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  es: "Hermano de Abd al-Malik y su mano derecha en todos los asuntos de Estado, huyó con él al sultán otomano y fue aclamado en el campo de batalla de Wadi al-Makhazin, el 30 de Jumada II de 986/4 de agosto de 1578, tras haber ocultado la muerte de su hermano con el chambelán Ridwan y haber liderado la vanguardia hacia la retaguardia portuguesa. Continuó el programa de su hermano: la construcción de instituciones, la imposición de horarios de trabajo a los ministros, un alfabeto cifrado para la correspondencia secreta, la separación del poder judicial con su propio consejo mazalim en la mezquita Qasba de Marrakech, puestos de vigilancia cada veinte kilómetros para caravanas, el flexible consejo Diwan, un ejército al estilo otomano con mandos basados en el mérito, hospitales de campaña, una fundición de cañones, las flotas de Larache y Salé; luego extendió el dominio sadí sobre el Sudán occidental y enfrentó a España, Inglaterra y los otomanos entre sí {cite:dawlat-uthmaniyya-salabi p. 265-270}. Cuando Uluj Ali llegó a Argel para anexionarse Marruecos en 989/1581, al-Mansur acampó en Tensift, selló sus pasos, fortificó las costas y envió una embajada a Estambul —tras un casi acuerdo con España a cambio de Larache por ayuda militar— y los otomanos retrocedieron. Las embajadas viajaron entre Estambul y Fez en 997–999/1588–1590 y recibió a un enviado otomano en 998/1589, pero la alianza de al-Ándalus nunca se materializó, ya que la Sublime Puerta estaba ocupada con los safávidas, los Habsburgo y el Hiyaz {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  ur: "عبد الملک کا بھائی اور تمام ریاستی امور میں دایاں ہاتھ؛ وہ اس کے ساتھ عثمانی سلطان کے پاس بھاگا اور وادی المخازین کے میدان میں 30 جمادی الثانی 986/4 اگست 1578 کو سراہا گیا، اس نے چیمبرلین رضوان کے ساتھ اپنے بھائی کی موت کو چھپایا اور پرتگالیوں کے عقب میں ہراول دستہ کی قیادت کی۔ اس نے اپنے بھائی کے پروگرام کو جاری رکھا: اداروں کی تعمیر، وزراء کو دفتری اوقات کار پر فائز کرنا، خفیہ خط و کتابت کے لیے ایک حرف تہجی، مراکش کی قصبہ مسجد میں عدلیہ کی اپنی مجلسی کونسل کے ساتھ علیحدگی، قافلوں کے لیے ہر بیس کلومیٹر کے فاصلے پر پہرے دار اسٹیشن، لچکدار دیوان کمانڈر کے ساتھ کمانڈر فیلڈ مین، ایک فوجی کمانڈر کے ساتھ ایک ماڈل۔ ہسپتال، بندوق کی فاؤنڈری، لاراشے اور سالے کے بحری بیڑے - پھر مغربی سوڈان پر سعدی کا غلبہ بڑھایا اور اسپین، انگلستان اور عثمانیوں کو ایک دوسرے کے خلاف کھیلا۔ 265-270}۔ جب الوج علی 989/1581 میں مراکش کو الحاق کرنے کے لیے الجزائر پہنچا تو المنصور نے Tensift میں ڈیرہ ڈالا، اس کے پاسوں پر مہر لگا دی، ساحلوں کو مضبوط کیا اور ایک سفارت خانہ استنبول بھیج دیا - فوجی امداد کے لیے اسپین کے ساتھ تجارتی لاراشے کے ساتھ قریبی معاہدے کے بعد - اور عثمانیوں نے پیچھے ہٹ لیا۔ 997-999/1588-1590 میں استنبول اور فیز کے درمیان سفارت خانے بند ہو گئے اور اسے 998/1589 میں ایک عثمانی ایلچی ملا، اس کے باوجود الاندلس اتحاد کبھی عمل میں نہیں آیا، پورٹے صفویوں، ہیبسبرگ اور حجاز کے ساتھ مصروف تھے۔ 270-271}۔"
  tr: "Abdülmalik'in kardeşi ve tüm devlet işlerinde sağ kolu olan kişi, onunla birlikte Osmanlı Sultanı'na kaçtı ve 30 Cemâdî Sanî 986 Hicri/4 Ağustos 1578'de Vadi el-Makhazin Meydanı'nda Sultan ilan edildi. Bu olay, kendisi ve kâhyası Rızavan'ın kardeşinin ölümünü zafer elde edilene kadar gizli tutmasının ardından gerçekleşti. Daha sonra ordunun öncü birliklerine liderlik ederek Portekiz artçı birlikleriyle çatıştı. Kardeşinin politikalarını sürdürdü: kurumlar inşa etti, bakanların çalışma saatlerinden sorumlu tuttu, gizli yazışmalar için şifreli mektuplar icat etti, yargıyı yürütme organından ayırdı ve Kasbah Camii'nde Şikayetler Konseyi'ne başkanlık etti, kervanlar için her yirmi kilometrede bir nöbetçi kulübesi kurdu, Esnek Divan Konseyi'ni oluşturdu, orduyu Osmanlı sistemine göre geliştirdi ve liderliği yetkinliğe göre atadı, sahra hastaneleri ve top imalat atölyesi kurdu ve Larache ve Salé'de filoyu geliştirdi. Daha sonra etkisini Batı Afrika topraklarına doğru genişletti ve İspanyollar, İngilizler ve Osmanlılar arasında denge kurmaya çalıştı. Kılıç Ali, 989 Hicri/1581 Miladi yılında Fas'ı ilhak etmek için Cezayir'e vardığında, kuvvetlerini Tensift Nehri'ne konuşlandırarak krallığının girişlerini kapattı ve sınırlarını güçlendirdi. Ardından, İspanya Kralı ile yarı askeri bir anlaşma yaparak Larache'nin teslimi karşılığında İstanbul'a bir elçilik gönderdi; bu noktada Osmanlılar geri çekildi. 997 Hicri/1588 Miladi ile 999 Hicri/1590 yılları arasında İstanbul ve Fez arasında elçilikler alışverişi devam etti ve 998 Hicri/1589 yılında bir Osmanlı elçisi kabul etti. Ancak, Osmanlı devletinin Safeviler, Habsburglar ve Hicaz ile meşgul olması nedeniyle Endülüs'ün yeniden fethi için yapılan ittifak gerçekleşmedi. {cite:dawlat-uthmaniyya-salabi s. 270-271}"
  id: "Saudara laki-laki Abd al-Malik dan tangan kanan dalam semua urusan negara melarikan diri bersamanya ke Sultan Utsmaniyah dan diproklamasikan sebagai Sultan di Lapangan Wadi al-Makhazin pada tanggal 30 Jumada al-Thani 986 H/4 Agustus 1578 M, setelah ia dan pengawalnya, Ridwan, merahasiakan kematian saudaranya hingga kemenangan tercapai. Ia kemudian memimpin barisan depan tentara, bertempur melawan barisan belakang Portugis. Ia melanjutkan kebijakan saudaranya: membangun lembaga-lembaga, meminta pertanggungjawaban para menteri atas jam kerja mereka, menciptakan surat-surat berkode untuk korespondensi rahasia, memisahkan cabang peradilan dari cabang eksekutif dan memimpin Dewan Pengaduan di Masjid Kasbah, mendirikan pos penjagaan untuk kafilah setiap dua puluh kilometer, menciptakan Dewan Diwan Fleksibel, mengembangkan tentara sesuai dengan sistem Utsmaniyah dan menugaskan kepemimpinan berdasarkan kompetensi, mendirikan rumah sakit lapangan dan bengkel untuk pembuatan meriam, serta mengembangkan armada di Larache dan Salé. Kemudian ia memperluas pengaruhnya ke wilayah Afrika Barat dan memainkan peran penyeimbang antara Spanyol, Inggris, dan Ottoman. Ketika Kilij Ali tiba di Aljir untuk mencaplok Maroko pada tahun 989 H/1581 M, ia menempatkan pasukannya di Sungai Tensift, memblokir pintu masuk ke kerajaannya dan memperkuat perbatasannya. Ia kemudian mengirimkan duta besar ke Istanbul setelah kesepakatan semi-militer dengan Raja Spanyol sebagai imbalan atas penyerahan Larache—pada saat itulah Ottoman mundur. Pertukaran duta besar terus terjadi antara Istanbul dan Fez antara tahun 997 H/1588 M dan 999 H/1590 M, dan ia menerima duta besar Ottoman pada tahun 998 H/1589 M. Namun, aliansi untuk penaklukan kembali Andalusia tidak terwujud karena negara Ottoman sibuk dengan Safawi, Habsburg, dan Hejaz. {cite:dawlat-uthmaniyya-salabi p. 270-271}"
