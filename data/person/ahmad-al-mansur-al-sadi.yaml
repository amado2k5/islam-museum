summary:
  ar: "أخو عبد الملك وساعده الأيمن في كل شئون الدولة؛ هرب معه إلى السلطان العثماني، وبويع سلطاناً في ميدان وادي المخازن يوم ٣٠ جمادى الآخرة ٩٨٦هـ/٤ أغسطس ١٥٧٨م بعد أن كتم مع الحاجب رضوان موت أخيه حتى تم النصر وقاد مقدمة الجيش صادماً مؤخرة البرتغاليين. استمر على منهج أخيه: بناء المؤسسات، محاسبة الوزراء على أوقات العمل، اختراع حروف رمزية للمراسلات السرية، فصل القضاء عن التنفيذية وترؤسه مجلس المظالم بجامع القصبة، إقامة محطات حراسة للقوافل كل عشرين كيلومتراً، إنشاء مجلس الديوان المرن، تطوير الجيش على النظام العثماني وإسناد القيادات للكفاءة، المستشفيات الميدانية ودار العدة لصناعة المدافع وتطوير الأسطول في العرائش وسلا، ثم مدّ نفوذه نحو بلاد السودان الغربي ولعب موازنات الأسبان والإنجليز والعثمانيين {cite:dawlat-uthmaniyya-salabi p. 265-270}. ولما وصل قلج علي الجزائر لضم المغرب سنة ٩٨٩هـ/١٥٨١م رابط بقواته عند نهر تانسيفت وسدّ مداخل مملكته وحصّن الثغور ووجه سفارة إلى إستانبول، بعد شبه اتفاق عسكري مع ملك إسبانيا مقابل التنازل عن العرائش — فتراجع العثمانيون. وترددت السفارات بين الأستانة وفاس بين ٩٩٧هـ/١٥٨٨م و٩٩٩هـ/١٥٩٠م واستقبل سفيراً عثمانياً سنة ٩٩٨هـ/١٥٨٩م، دون أن يتحقق تحالف استرداد الأندلس لانشغال الدولة بالصفويين والهابسبورج والحجاز {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  en: "Abd al-Malik's brother and right hand in all state affairs; he fled with him to the Ottoman sultan and was acclaimed on the field of Wadi al-Makhazin, 30 Jumada II 986/4 August 1578, having concealed his brother's death with the chamberlain Ridwan and led the vanguard into the Portuguese rear. He continued his brother's programme: building institutions, holding ministers to office hours, a cipher alphabet for secret correspondence, separation of the judiciary with his own mazalim council at the Qasba mosque of Marrakesh, guarded stations every twenty kilometres for caravans, the flexible Diwan council, an army on the Ottoman model with merit-based commands, field hospitals, a gun foundry, the Larache and Salé fleets — then extended Sa'di sway over the western Sudan and played Spain, England and the Ottomans off one another {cite:dawlat-uthmaniyya-salabi p. 265-270}. When Uluj Ali reached Algiers to annex Morocco in 989/1581, al-Mansur camped at the Tensift, sealed his passes, fortified the shores and sent an embassy to Istanbul — after a near-agreement with Spain trading Larache for military aid — and the Ottomans backed off. Embassies shuttled between Istanbul and Fez in 997–999/1588–1590 and he received an Ottoman envoy in 998/1589, yet the al-Andalus alliance never materialised, the Porte busy with Safavids, Habsburgs and the Hejaz {cite:dawlat-uthmaniyya-salabi p. 270-271}."
