label: { ar: "أحمد المنصور الذهبي السعدي", en: "Ahmad al-Mansur al-Dhahabi al-Sa'di", fr: "Ahmad al-Mansur al-Dhahabi al-Sa'di", es: "Ahmad al-Mansur al-Dhahabi al-Sa'di", ur: "احمد المنصور الذہبی السعدی" }
