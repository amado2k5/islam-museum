summary:
  ar: "سياسي تنزاني (مواليد 1948) نجل عبيد كرومي أول رئيس لزنجبار. عمل محاسبا وموظفا حكوميا في زنجبار، ثم نائبا عن راها ليو ووزيرا، وصار الرئيس السادس لزنجبار من 8 نوفمبر 2000 إلى 3 نوفمبر 2010. شاب انتخابيه نزاعات واتهامات بالتزوير، لكنه أنهى ولايته بحوارات مصالحة واستفتاء سنة 2010 أقرّ حكومة الوحدة الوطنية، وسلّم السلطة سلميا. وهو مستشار جامعة مبيا للعلوم والتقنية."
  en: "Tanzanian politician (born 1948), the son of Abeid Karume, Zanzibar's first president. He worked as an accountant and government officer in Zanzibar, then as a representative for Raha Leo and a minister, and became the sixth president of Zanzibar from 8 November 2000 to 3 November 2010. His two elections were disputed, but he closed his presidency with reconciliation talks and a 2010 referendum approving a government of national unity, and handed over power peacefully. He is chancellor of Mbeya University of Science and Technology."
  ur: "تنزانیہ کے سیاست دان (پیدائش 1948ء)، زنجبار کے پہلے صدر عبید کرومی کے بیٹے۔ وہ زنجبار میں محاسب اور سرکاری افسر رہے، پھر راہا لیو سے نمائندہ اور وزیر بنے، اور 8 نومبر 2000ء سے 3 نومبر 2010ء تک زنجبار کے چھٹے صدر رہے۔ ان کے دونوں انتخابات متنازع رہے، لیکن انہوں نے اپنی مدت کا اختتام مفاہمتی مذاکرات اور 2010ء کے ریفرنڈم سے کیا جس نے قومی اتحاد کی حکومت کی منظوری دی، اور پُرامن طور پر اقتدار منتقل کیا۔ وہ مبیا یونیورسٹی آف سائنس اینڈ ٹیکنالوجی کے چانسلر ہیں۔"
