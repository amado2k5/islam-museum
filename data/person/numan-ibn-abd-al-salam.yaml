summary:
  ar: "النعمان بن عبد السلام أبو المنذر، من المتقدمين من أهل أصبهان. كان والده يلي أمر السلطان، فترك ما ورثه من ضيعة ومال زهدًا فيه، وصحب سفيان الثوري ومالك بن أنس. ورأى رجل في منامه ملكًا يقول لآخر على سور المدينة: اقلب، فقال: كيف أقلب والنعمان بن عبد السلام قائم يصلي."
  en: "al-Nu'man ibn Abd al-Salam, Abu al-Mundhir, among the early people of Isfahan; his father held the ruler's affairs and left an estate and wealth, which he gave up in asceticism; he kept company with Sufyan al-Thawri and Malik ibn Anas. A man saw in a dream an angel on the wall of Medina telling another to turn over; the other asked how he could turn when al-Nu'man was standing in prayer."
  ur: "نعمان بن عبد السلام ابو المنذر، اصفہان کے قدیم لوگوں میں سے۔ ان کے والد سلطان کے معاملات سنبھالتے تھے، مگر انہوں نے وراثت میں ملنے والی جائیداد اور مال زہد کی بنا پر چھوڑ دیا؛ وہ سفیان ثوری اور مالک بن انس کے ساتھ رہے۔ ایک شخص نے خواب میں دیکھا کہ مدینہ کی فصیل پر ایک فرشتہ دوسرے سے کہہ رہا ہے کہ پلٹ جاؤ؛ اس نے پوچھا کہ میں کیسے پلٹوں جبکہ نعمان نماز پڑھتے کھڑے ہیں۔"
