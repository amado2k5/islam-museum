  es: "Cantante y artista de nasheed sudafricano nacido en Pretoria en 1974; pionero del nasheed en lengua inglesa con álbumes desde 1996, entre los que se incluyen Mountains of Makkah y City of Medina, ha colaborado con Yusuf Islam y actúa para familias de todo el mundo."
