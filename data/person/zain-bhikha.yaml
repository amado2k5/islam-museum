  ar: مغنٍّ ومنشد جنوب إفريقي وُلد سنة 1974 في بريتوريا؛ من روّاد النشيد بالإنجليزية، أصدر ألبومات منذ 1996 منها «Mountains of Makkah» و«City of Medina»، وتعاون مع يوسف إسلام ويغني للأطفال والأسر في العالم.
