summary:
  ar: أخو أبي العتاهية والي صنعاء، أرسله بخمسين فارساً إلى الهادي في درب بني صريم لأيام بقيت من المحرم سنة 286هـ وسار مع جيش الهادي إلى خرفان والسبيع ثم إلى حوث.
  en: Brother of Abu al-Atahiya, governor of Sanaa, whom he sent with fifty horsemen to al-Hadi at the al-Darb of Banu Sarim in the last days of Muharram 286 AH, and who went with al-Hadi's army to Khirfan and al-Subay' and then to Hawth.
  ur: صنعاء کے والی ابو العتاہیہ کے بھائی جنہیں انہوں نے محرم 286ھ کے آخری دنوں میں پچاس سواروں کے ساتھ بنو صریم کے الدرب میں ہادی کے پاس بھیجا، اور جو ہادی کے لشکر کے ساتھ خرفان اور السبیع اور پھر حوث گئے۔
