summary:
  ar: "روائي تركي، وُلد في إسطنبول سنة 1952، ترك دراسة العمارة ليتفرغ للكتابة، وبنى رواياته على التوتر بين الشرق والغرب وبين التراث والحداثة في مدينته، وبيعت كتبه بأكثر من ثلاثة عشر مليون نسخة في ثلاث وستين لغة، ونال جائزة نوبل في الأدب سنة 2006 فكان أول تركي ينال جائزة نوبل، وحوكم في بلاده على خلفية تصريحات عن مقتل الأرمن والأكراد ثم أُسقطت التهم، وهو أستاذ في جامعة كولومبيا ومؤسس متحف البراءة الفعلي في إسطنبول."
  en: "Turkish novelist, born in Istanbul in 1952. He left architecture studies to write full-time and built his novels on the tension between East and West, tradition and modernity in his native city; his books have sold over thirteen million copies in sixty-three languages. He received the 2006 Nobel Prize in Literature, the first Turk to win a Nobel Prize, was prosecuted in Turkey over remarks about the killing of Armenians and Kurds before the charges were dropped, and is a professor at Columbia University and the founder of the real Museum of Innocence in Istanbul."
  ur: "ترکی ناول نگار، جو 1952 میں استنبول میں پیدا ہوئے۔ انہوں نے تعمیرات کی تعلیم چھوڑ کر خود کو لکھنے کے لیے وقف کیا اور اپنے شہر میں مشرق و مغرب اور روایت و جدیدیت کے تصادم کو اپنے ناولوں کا موضوع بنایا؛ ان کی کتابیں تریسٹھ زبانوں میں ایک کروڑ تیس لاکھ سے زائد فروخت ہوئیں۔ انہیں 2006 میں ادب کا نوبل انعام ملا — وہ نوبل پانے والے پہلے ترک بنے — ارمنیوں اور کردوں کے قتل کے بارے میں بیانات پر ان پر وطن میں مقدمہ چلا پھر الزامات ختم ہوئے، اور وہ کولمبیا یونیورسٹی میں استاد اور استنبول میں حقیقی «معصومیت میوزیم» کے بانی ہیں۔"
