summary:
  ar: "عالم وزعيم استقلال أويغوري؛ أول رئيس وزراء لجمهورية تركستان الشرقية الأولى ووحيدها (نوفمبر 1933 – أبريل 1934)، وُلد في يونيو 1883 في أتوش، وأُعدم بحسب الراجح شنقًا في يوليو 1934."
  en: "Uyghur scholar and independence leader; the first and only prime minister of the First East Turkestan Republic (November 1933 to April 1934), born in June 1883 at Atush and reportedly executed by hanging in July 1934."
  ur: "اویغور عالم اور رہنما؛ جمہوریہ مشرقی ترکستان کے پہلے اور واحد وزیر اعظم (نومبر 1933ء تا اپریل 1934ء)، جون 1883ء میں آتوش میں پیدا ہوئے اور روایت کے مطابق جولائی 1934ء میں پھانسی دیے گئے۔"
