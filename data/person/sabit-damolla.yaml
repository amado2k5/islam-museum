  note: "Captured by Khoja Niyaz's forces near Aksu in late April 1934 and handed to Sheng Shicai. The English article's main account, citing Forbes (Warlords and Muslims in Chinese Central Asia, p. 123), gives his execution reportedly by hanging in July 1934 at Aksu; the same article also carries a later allegation that he was instead secretly imprisoned at Ürümqi by Sheng Shicai — a passage internally tied to events of 1944 — and the Chinese article's infobox places his death at Dihua (Ürümqi) in 1934. The month follows Forbes; the place is contested between Aksu and Ürümqi, so the death is carried as debated. Wikidata carries 1934 at year precision, consistent with the Forbes account. No Hijri pairing is attested in the sources read, so no hijri key is carried."
  sources: [source/wikipedia-sabit-damolla-en, source/wikipedia-sabit-damolla-zh, source/wikidata-sabit-damolla]
