label: { ar: "الضحاك ذو الأفواه", en: "al-Dahhak dhu al-afwah", fr: "Al-Dahhak Dhu al-Afwah", es: "al-Dahhak dhu al-afwah", ur: "الضحاک ذو الافواہ" }
summary:
  ar: "الضحاك ذو الأفواه تنازعت فيه الفرس والعرب من أي الفريقين هو، خرج بكتفيه حيتان لا تغذيان إلا بأدمغة الناس فكان وزيره يذبح كل يوم كبشاً ورجلاً ويخلط أدمغتهما ويطعمهما إياها ويطرد من تخلص إلى الجبال فتوحشوا وتناسلوا فهم بدء الأكراد على قول، واجتمعت إلى حربه جماعة وفاهم أفريدون وقد شالوا راية من الجلود تسميها الفرس درفش كاوان فأخذه أفريدون وقيده في جبل دنباوند، والفرس لا يتناكرون خبره {cite:muruj-al-dhahab p. 439-440}. وفي حكاية أبي سهل بن نوبخت بالفهرست أنه بن قي بنى مدينة اشتق اسمها من اسم المشتري جمع فيها العلم والعلماء وبنى بها اثني عشر قصرا على عدد بروج السماء سماها بأسمائها وخزن كتب أهل العلم وأسكنها العلماء {cite:fihrist-ibn-al-nadim p. 332}"
  en: "The tyrant on whose shoulders grew two serpents fed daily on human brains — the spared tribute fleeing to the mountains whence one tale derives the Kurds — until Afridun's host under the leather standard Darafsh-i Kaviyan took and bound him in Mount Damavand {cite:muruj-al-dhahab p. 439-440}."
  fr: "Tyran sur les épaules duquel poussèrent deux serpents nourris chaque jour de cervelles humaines — les victimes épargnées fuyant vers les montagnes, dont un récit fait venir les Kurdes — jusqu’à ce que l’armée d’Afridun, sous l’étendard de cuir Darafsh-i Kaviyan, le capture et l’enchaîne au mont Damavand {cite:muruj-al-dhahab p. 439-440}."
  es: "El tirano sobre cuyos hombros crecían dos serpientes que se alimentaban diariamente de cerebros humanos —el tributo perdonado huía a las montañas de donde, según una leyenda, derivan los kurdos— hasta que el ejército de Afridun, bajo el estandarte de cuero Darafsh-i Kaviyan, lo capturó y lo ató en el monte Damavand {cite:muruj-al-dhahab p. 439-440}."
  ur: "وہ ظالم جس کے کندھوں پر دو سانپ بڑھتے تھے روزانہ انسانی دماغوں پر پلتے تھے - بچا ہوا خراج پہاڑوں کی طرف بھاگتا تھا جہاں سے ایک کہانی کردوں سے نکلتی تھی - یہاں تک کہ آفریدون کے میزبان نے چمڑے کے معیار دارافش کاویان کے تحت اسے دماوند پہاڑ میں باندھ دیا تھا۔ 439-440}۔"
  tr: "Ağızlı Zahhak'ın hangi gruba ait olduğu Persler ve Araplar arasında tartışmalıydı. Omuzlarından sadece insan beyniyle beslenen iki yılan çıkıyordu. Veziri her gün bir koç ve bir insan keser, beyinlerini karıştırır ve yılanlara yedirirdi. Kaçanları dağlara sürerdi; orada vahşileşip çoğaldılar ve bir rivayete göre Kürtlerin kökenini oluşturdular. Bir grup onunla savaşmak için toplandı ve Afridun ile karşılaştılar. Perslerin Darfash Kawan adını verdikleri deriden bir sancak taşıyorlardı. Afridun onu yakalayıp Damavand Dağı'na hapsetti. Persler onun hikayesini inkar etmezler. {cite:muruj-al-dhahab s. 439-440}. Fihrist'teki Ebu Sahl ibn Nawbakht hikayesinde, adını Jüpiter'den alan bir şehir kurduğu belirtilir. Orada ilim ve âlimleri topladı ve gökyüzünün her bir takımyıldızı için birer tane olmak üzere on iki saray inşa ettirdi ve onlara buna göre isimler verdi. Âlimlerin kitaplarını depoladı ve şehirde muhafaza etti. {cite:fihrist-ibn-al-nadim s. 332}"
  id: "Zahhak, yang bermulut besar, diperselisihkan oleh Persia dan Arab mengenai kelompok mana yang termasuk di dalamnya. Dua ular muncul dari bahunya yang hanya memakan otak manusia. Wazirnya akan menyembelih seekor domba jantan dan seorang manusia setiap hari, mencampur otak mereka, dan memberikannya kepada ular-ular itu. Ia akan mengusir mereka yang melarikan diri ke pegunungan, di mana mereka menjadi liar dan berkembang biak, dan menurut satu catatan, mereka adalah asal mula orang Kurdi. Sekelompok orang berkumpul untuk melawannya, dan mereka bertemu dengan Afridun. Mereka membawa panji yang terbuat dari kulit, yang oleh orang Persia disebut Darfash Kawan. Afridun menangkapnya dan memenjarakannya di Gunung Damavand. Orang Persia tidak menyangkal kisahnya. {cite:muruj-al-dhahab hlm. 439-440}. Dalam kisah Abu Sahl ibn Nawbakht dalam Fihrist, disebutkan bahwa ia membangun sebuah kota yang namanya berasal dari Jupiter. Ia mengumpulkan ilmu pengetahuan dan para ulama di sana dan membangun dua belas istana, satu untuk setiap rasi bintang di langit, dan menamainya sesuai dengan rasi bintang tersebut. Ia menyimpan buku-buku para ulama dan menempatkannya di kota itu. {cite:fihrist-ibn-al-nadim p. 332}"
