summary:
  ar: "الضحاك ذو الأفواه تنازعت فيه الفرس والعرب من أي الفريقين هو، خرج بكتفيه حيتان لا تغذيان إلا بأدمغة الناس فكان وزيره يذبح كل يوم كبشاً ورجلاً ويخلط أدمغتهما ويطعمهما إياها ويطرد من تخلص إلى الجبال فتوحشوا وتناسلوا فهم بدء الأكراد على قول، واجتمعت إلى حربه جماعة وفاهم أفريدون وقد شالوا راية من الجلود تسميها الفرس درفش كاوان فأخذه أفريدون وقيده في جبل دنباوند، والفرس لا يتناكرون خبره {cite:muruj-al-dhahab p. 439-440}."
  en: "The tyrant on whose shoulders grew two serpents fed daily on human brains — the spared tribute fleeing to the mountains whence one tale derives the Kurds — until Afridun's host under the leather standard Darafsh-i Kaviyan took and bound him in Mount Damavand {cite:muruj-al-dhahab p. 439-440}."
