summary:
  ar: "عبد الرحمن بن أحمد بن محمد بن عبد الرحمن، أبو الفرج السرخسي، أحد الأجلاء من الأئمة، فقيه شافعي تفقه على القاضي الحسين، وسمع أبا القاسم القشيري وآخرين، وروى عنه أبو طاهر السنجي وغيره، قال ابن السمعاني إنه حفظ مذهب الشافعي ومعرفته، وله التعليقة والإملاء. (٤٣٢-٤٩٤ وقيل ٥٠٠ه). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13347}"
  en: "Abd al-Rahman ibn Ahmad ibn Muhammad, Abu al-Faraj al-Sarakhsi, a Shafi'i jurist who studied with al-Qadi al-Husayn, heard al-Qushayri and others, and was narrated from by Abu Tahir al-Sinji. Ibn al-Sam'ani said he preserved and mastered al-Shafi'i's school. His works include al-Ta'liqa and al-Imla'. Dates 432 to 494, or 500 H as printed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13347}"
