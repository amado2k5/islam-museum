summary:
  ar: "السلطان سليم الأول (حكم ٩١٨–٩٢٦هـ/١٥١٢–١٥٢٠م)؛ تربع على العرش العثماني سنة ٩١٨هـ، وأظهر منذ بداية حكمه ميلاً إلى تصفية خصومه ولو كانوا من إخوته وأبنائهم، وكان يحب الأدب والشعر الفارسي والتاريخ، ورغم قسوته كان يميل إلى صحبة رجال العلم ويصطحب المؤرخين والشعراء إلى ميدان القتال ليسجلوا تطورات المعارك. وقد أحدث تغييراً جذرياً في سياسة الدولة الجهادية: توقف الزحف نحو الغرب الأوروبي أو كاد واتجهت الدولة نحو المشرق الإسلامي — لحماية آسيا الصغرى والعالم السني من سياسة الدولة الصفوية في بسط المذهب الشيعي، ولإنقاذ المقدسات من التحرك الصليبي الجديد للأسبان في البحر المتوسط والبرتغاليين في المحيط الهندي والبحر الأحمر. فسارت سياسته على القضاء على الدولة الصفوية وضم الدولة المملوكية وحماية الأراضي المقدسة وملاحقة الأساطيل البرتغالية ودعم حركة الجهاد البحري في شمال أفريقية {cite:dawlat-uthmaniyya-salabi p. 176-177}."
  en: "Selim I (r. 1512–1520 CE) — the stern sultan who turned Ottoman jihad eastward: against the Safavids, the Portuguese in the Indian Ocean, and the Mamluks {cite:dawlat-uthmaniyya-salabi p. 176-177}."
