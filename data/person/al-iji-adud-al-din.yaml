summary:
  ar: "عضد الدين أبو الفضل عبد الرحمن الإيجي، من علماء الكلام وأصول الفقه، وصاحب مؤلفات في هذين الفنين؛ ذكرت المصادر أنه حُبس بقلعة دريميار حتى مات في سجنه."
  en: "Adud al-Din Abu al-Fadl al-Iji, a scholar of kalam and legal theory and author of works in both fields; the sources report that he was imprisoned at the Dizmar fortress until he died there."
  es: "Adud al-Din Abu al-Fadl al-Iji, erudito en kalam y teoría jurídica, y autor de obras en ambos campos; según las fuentes, estuvo encarcelado en la fortaleza de Dizmar hasta su muerte."
  fr: "Adud al-Din Abu al-Fadl al-Iji, un érudit du kalam et de la théorie juridique et auteur d'ouvrages dans les deux domaines; les sources rapportent qu'il fut emprisonné dans la forteresse de Dizmar jusqu'à sa mort sur place."
  ur: "عدوالدین ابو الفضل العجی، کلام اور قانونی تھیوری کے اسکالر اور دونوں شعبوں میں کام کے مصنف؛ ذرائع کا کہنا ہے کہ وہ دزمر قلعے میں اس وقت تک قید رہے جب تک کہ وہ وہاں مر گیا۔"
  tr: "'Adud al-Din Abu al-Fadl Abd al-Rahman al-Iji, teoloji ve hukuk prensipleri alanında bir âlim ve bu iki alanda eserlerin yazarıdır; kaynaklar, onun Darimyar kalesinde hapsedildiğini ve hapiste öldüğünü belirtir."
  id: "'Adud al-Din Abu al-Fadl Abd al-Rahman al-Iji, seorang sarjana teologi dan prinsip hukum, serta penulis karya di kedua bidang ini; sumber-sumber menyebutkan bahwa ia dipenjara di benteng Darimyar hingga meninggal di penjaranya."
