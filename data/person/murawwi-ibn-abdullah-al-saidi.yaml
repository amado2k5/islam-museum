summary:
  ar: رجل من همدان بايع الهادي مع أحمد بن الضحاك، وشارك في خبر دعائه على أبي محجن وجفتم.
  en: A man of Hamdan who pledged to al-Hadi with Ahmad ibn al-Dahhak and shares in the report of his prayers against Abu Mihjan and Jaftam.
  ur: ہمدان کا ایک شخص جس نے احمد بن ضحاک کے ساتھ ہادی سے بیعت کی اور ابو محجن اور جفتم کے خلاف ان کی دعاؤں کی خبر میں شریک ہے۔
  es: "Un hombre de Hamdan que juró lealtad a al-Hadi junto con Ahmad ibn al-Dahhak y comparte el relato de sus oraciones contra Abu Mihjan y Jaftam."
  fr: "Un homme de Hamdan qui a prêté allégeance à al-Hadi avec Ahmad ibn al-Dahhak et partage le récit de ses prières contre Abu Mihjan et Jaftam."
