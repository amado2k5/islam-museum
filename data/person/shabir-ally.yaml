summary:
  ar: "داعية ومناظر غوياني كندي، وُلد في غيانا نحو سنة 1953 وانتقل إلى كندا سنة 1978، ويرأس مركز المعلومات والدعوة الدولي في تورنتو، ويقدّم البرنامج التلفزيوني والرقمي «دع القرآن يتحدث» (Let the Quran Speak)، وله كتب ومناظرات واسعة في مقارنة الأديان."
  en: "Guyanese-Canadian preacher and debater, born in Guyana around 1953 and moved to Canada in 1978. He is president of the Islamic Information & Dawah Centre International in Toronto and presents the television and online programme Let the Quran Speak; he has written and debated widely on comparative religion."
  ur: "گویانی نژاد کینیڈین مبلغ اور مناظر، جو تقریباً 1953 میں گویانہ میں پیدا ہوئے اور 1978 میں کینیڈا منتقل ہوئے۔ وہ ٹورنٹو میں بین الاقوامی مرکزِ معلومات و دعوت کے صدر ہیں اور ٹیلی ویژن و آن لائن پروگرام «قرآن کو بولنے دو» پیش کرتے ہیں۔"
  es: "Predicador y orador guyanés-canadiense, nacido en Guyana alrededor de 1953 y radicado en Canadá desde 1978. Es presidente del Centro Internacional de Información y Dawah Islámica en Toronto y presenta el programa de televisión y en línea \"Que hable el Corán\"; ha escrito y debatido extensamente sobre religión comparada."
  fr: "Prédicateur et orateur guyano-canadien, né au Guyana vers 1953 et installé au Canada en 1978. Il est président du Centre international d'information et de prédication islamiques de Toronto et présente l'émission télévisée et en ligne « Let the Quran Speak »; il a beaucoup écrit et participé à de nombreux débats sur les religions comparées."
  tr: "Kanadalı Guyanalı vaiz ve tartışmacı, yaklaşık 1953 yılında Guyana'da doğmuş ve 1978'de Kanada'ya taşınmıştır. Toronto'da Uluslararası Bilgi ve Savunuculuk Merkezi'nin başında, televizyon ve dijital program \"Let the Quran Speak\"i sunmakta ve dinleri karşılaştıran kapsamlı kitaplar ve tartışmalar yürütmektedir."
  id: "Seorang pengkhotbah dan debater asal Kanada Guyana, lahir di Guyana sekitar tahun 1953 dan pindah ke Kanada pada tahun 1978. Ia memimpin International Information and Advocacy Center di Toronto, membawakan program televisi dan digital \"Let the Quran Speak,\" serta memiliki buku dan debat yang luas membandingkan agama."
