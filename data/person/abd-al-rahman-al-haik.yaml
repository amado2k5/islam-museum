label:
  ar: عبد الرحمن الحائك التطاوني
  en: Abd al-Rahman al-Haik al-Tatwani, Maliki jurist
  ur: عبدالرحمن الحائک التطاونی
summary:
  ar: 'عبد الرحمن الحائك، أبو زيد، التطاوني، الفقيه المحقق، أخذ عن الشيخ التاودي والشيخ
    البناني والشيخ جسوس وغيرهم، وعنه الشيخ الرهوني والشيخ المأمون إجلال الحسني قاضي
    تطاوين وغيرهما. كان حيا سنة 1220ه بحسب ما ذكر المدخل، وله «فتاوى غاية في التحرير».
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7519} '
  en: 'Abd al-Rahman al-Haik, Abu Zayd, of Tetouan, a careful jurist. He studied with
    Shaykh al-Tawdi, Shaykh al-Banani and Shaykh Jasus, and taught Shaykh al-Rahuni
    and Shaykh al-Mamun Ijlal al-Hasani, judge of Tetouan. The entry says he was alive
    in 1220 AH and attributes to him Fatawa Ghayat fi al-Tahrir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7519} '
  ur: 'عبدالرحمن الحائک، ابوزید تطاونی، محقق فقیہ؛ شیخ التاودی، شیخ البنانی اور شیخ
    جسوس سے پڑھا، اور ان سے شیخ الرہونی اور قاضیِ تطاوین المأمون اجلال الحسنی نے علم
    حاصل کیا۔ مدخل کے مطابق 1220ھ میں زندہ تھے، اور ان کی «فتاویٰ غایۃ فی التحریر»
    ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7519} '
