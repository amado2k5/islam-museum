summary:
  ar: "موسيقي ومعلّم صوفي هندي (1882–1927)، وُلد في برودة وتوفي في دلهي؛ رائد نقل التصوف إلى الغرب، تلقى التربية والإجازة في أربع طرق صوفية عن شيخه سيد أبو هاشم مدني، وأسس الطريقة الصوفية في لندن سنة 1914، وله مؤلفات موسيقية وصوفية كثيرة جُمعت لاحقًا في «الرسالة الصوفية»."
  en: "Indian musician and Sufi teacher (1882–1927), born in Baroda and died in Delhi. A pioneer of the transmission of Sufism to the West, he received training and authorisation in four Sufi orders from his teacher Sayyid Abu Hashim Madani, founded the Sufi Order in London in 1914, and left many musical and Sufi works, later collected as The Sufi Message."
  ur: "ہندوستانی موسیقار اور صوفی استاد (1882–1927)، بڑودہ میں پیدا ہوئے اور دہلی میں وفات پائی؛ مغرب تک تصوف پہنچانے کے اولین مبلغ، اپنے استاد سید ابو ہاشم مدنی سے چار صوفی سلسلوں کی تربیت و اجازت حاصل کی، 1914 میں لندن میں صوفی سلسلے کی بنیاد رکھی، اور ان کی موسیقی و تصوف پر متعدد تصانیف بعد میں «صوفی پیغام» میں جمع ہوئیں۔"
