summary:
  ar: "الملك الأشرف جان بلاط أبو النصر سلطان مصر؛ اشتراه بشتك الدوادار وقدمه للأشرف قايتباي فجعله خاصكياً وقربه إليه وعلمه القرآن والحساب، وأعطاه تقدمة ألف، وولى الدوادارية الكبرى في زمن الناصر بن قايتباي ثم نيابة حلب ست سنين ثم نيابة الشام سبعة أشهر، ثم قدم القاهرة فولي الإمرة الكبرى وزُوّج بأخت السلطان الظاهر قانصوه، وصار العادل طومان باي يرمي الفتنة بينه وبين الظاهر حتى تنافرا فغلبه جان بلاط فتسلطن في ضحوة يوم الاثنين ثاني ذي القعدة سنة خمس وتسعمائة، فأقام نصف سنة وستة عشر يوماً وبنى المدرسة الجنبلاطية خارج باب النصر، ثم خُلع ونُفي إلى الإسكندرية وقتل بها خنقاً سنة ست وتسعمائة، ودُفن بها نحو شهر ثم نُقل إلى القاهرة فدُفن بتربة أستاذه قايتباي ثم رُدّ إلى تربته التي أعدها خارج باب النصر فنُقل إليها ولم تتغير جثته {cite:shadharat-dhahab p. 445}."
  en: "Qaytbay's mamluk, taught by him Qur'an and reckoning; grand dawadar under al-Nasir, governor of Aleppo six years and Damascus seven months, then amir-kabir in Cairo; overcame al-Zahir Qansuh and took the sultanate on 2 Dhu'l-Qa'da 905 for half a year, built the Janbalatiyya madrasa, then was deposed and strangled at Alexandria — his body carried to Qaytbay's tomb then to his own outside Bab al-Nasr, reportedly unchanged {cite:shadharat-dhahab p. 445}."
  es: "Mameluco de Qaytbay, quien le enseñó el Corán y el cálculo; gran dawadar bajo al-Nasir, gobernador de Alepo durante seis años y de Damasco durante siete meses, luego amir-kabir en El Cairo; venció a al-Zahir Qansuh y tomó el sultanato el 2 de Dhu'l-Qa'da de 905 durante medio año, construyó la madrasa Janbalatiyya, luego fue depuesto y estrangulado en Alejandría; su cuerpo fue llevado a la tumba de Qaytbay y luego a la suya propia fuera de Bab al-Nasr, según se informa, sin cambios {cite:shadharat-dhahab p. 445}."
  fr: "Le mamelouk de Qaytbay, qui lui enseigna le Coran et le calcul; grand dawadar sous al-Nasir, gouverneur d'Alep pendant six ans et de Damas pendant sept mois, puis amir-kabir au Caire; il vainquit al-Zahir Qansuh et prit le sultanat le 2 Dhu'l-Qa'da 905 pour six mois, fit construire la madrasa Janbalatiyya, puis fut déposé et étranglé à Alexandrie — son corps fut transporté au tombeau de Qaytbay puis à son propre tombeau à l'extérieur de Bab al-Nasr, apparemment inchangé {cite:shadharat-dhahab p. 445}."
  ur: "قطبی کا مملوک، اس کے ذریعہ قرآن اور حساب کی تعلیم؛ الناصر کے ماتحت عظیم الشان دعوتر، حلب کے گورنر چھ سال اور دمشق سات ماہ، پھر قاہرہ میں امیر کبیر؛ الظاہر قنسوہ پر غالب آیا اور 2 ذوالقعدہ 905 کو نصف سال تک سلطنت سنبھالی، مدرسہ جنبلتیہ بنایا، پھر اسکندریہ میں معزول اور گلا گھونٹ دیا گیا- اس کی لاش کو قطبی کے مقبرے پر لے جایا گیا پھر باب النصر کے باہر اس کے اپنے پاس لے جایا گیا، مبینہ طور پر کوئی تبدیلی نہیں کی گئی۔ 445}"
  tr: "Mısır Sultanı el-Nasr'ın babası Kral el-Eşref Jan Balat, Davadar'dan gelen şikayetle onu satın aldı ve onu özel bir hizmetkar yaptı, yanına getirdi, Kur'an ve aritmetiği öğretti ve ona bir adak binde birini verdi. Büyük Davadar'ı el-Nasır bin Kaitbey döneminde eldi, ardından altı yıl Halep'in valisi, ardından yedi ay el-Şam valiliği yaptı. Daha sonra Kahire'ye geldi, büyük emirliği devraldı ve Sultan el-Zahir Qansuh'un kız kardeşiyle evlendi. Adil Tuman Bey, kendisiyle el-Zahir arasında anlaşmazlık yaratmaya başladı, ta ki düşmanca hale gelene kadar ve Jan Balat onu yenerek Zham'ın ikinci günü Pazartesi sabahı tahta çıktı. Dokuz yüz elli yıl Hicri yılında, yarım yıl on altı gün kaldı ve Bab al-Nasr dışında Jumblati okulunu inşa etti. Daha sonra tahttan indirildi ve İskenderiye'ye sürgün edildi; burada 906 yılında boğularak öldürüldü. Yaklaşık bir ay orada gömüldü, ardından Kahire'ye nakledildi ve öğretmeni Qaitbay'in mezarına gömüldü, ardından bedeni değiştirilmediği Bab al-Nasr dışında hazırladığı mezara geri döndü {cite:shadharat-dhahab, s. 445}."
  id: "Raja al-Ashraf Jan Balat, ayah al-Nasr, Sultan Mesir, membelinya dengan keluhan dari Dawadar dan memperkenalkannya kepada al-Ashraf Qaitbay, yang menjadikannya pelayan khusus, mendekatkannya, mengajarinya Al-Qur'an dan aritmatika, serta memberinya persembahan seperseribu persembahan. Ia memegang Grand Dawadar pada masa al-Nasir ibn Qaitbay, lalu wakil Aleppo selama enam tahun, kemudian wakil kerajaan al-Sham selama tujuh bulan. Kemudian ia datang ke Kairo dan mengambil alih emirat besar itu dan menikahi saudari Sultan al-Zahir Qansuh. Tuman Bey yang adil mulai menimbulkan perselisihan antara dirinya dan al-Zahir hingga mereka menjadi bermusuhan, dan Jan Balat mengalahkannya, lalu naik takhta pada pagi hari Senin, hari kedua Dhu al-Qi'dah. Pada tahun sembilan ratus lima puluh tahun H, ia tinggal selama setengah tahun enam belas hari dan membangun sekolah Jumblati di luar Bab al-Nasr. Ia kemudian digulingkan dan diasingkan ke Alexandria, di mana ia dicekik hingga tewas pada tahun 906. Ia dimakamkan di sana selama sekitar sebulan, lalu dipindahkan ke Kairo, di mana ia dimakamkan di makam gurunya Qaitbay, lalu kembali ke makam yang ia siapkan di luar Bab al-Nasr, di mana jasadnya tidak diubah {cite:shadharat-dhahab, hlm. 445}."
