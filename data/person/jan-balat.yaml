summary:
  ar: "الملك الأشرف جان بلاط أبو النصر سلطان مصر؛ اشتراه بشتك الدوادار وقدمه للأشرف قايتباي فجعله خاصكياً وقربه إليه وعلمه القرآن والحساب، وأعطاه تقدمة ألف، وولى الدوادارية الكبرى في زمن الناصر بن قايتباي ثم نيابة حلب ست سنين ثم نيابة الشام سبعة أشهر، ثم قدم القاهرة فولي الإمرة الكبرى وزُوّج بأخت السلطان الظاهر قانصوه، وصار العادل طومان باي يرمي الفتنة بينه وبين الظاهر حتى تنافرا فغلبه جان بلاط فتسلطن في ضحوة يوم الاثنين ثاني ذي القعدة سنة خمس وتسعمائة، فأقام نصف سنة وستة عشر يوماً وبنى المدرسة الجنبلاطية خارج باب النصر، ثم خُلع ونُفي إلى الإسكندرية وقتل بها خنقاً سنة ست وتسعمائة، ودُفن بها نحو شهر ثم نُقل إلى القاهرة فدُفن بتربة أستاذه قايتباي ثم رُدّ إلى تربته التي أعدها خارج باب النصر فنُقل إليها ولم تتغير جثته {cite:shadharat-dhahab p. 445}."
  en: "Qaytbay's mamluk, taught by him Qur'an and reckoning; grand dawadar under al-Nasir, governor of Aleppo six years and Damascus seven months, then amir-kabir in Cairo; overcame al-Zahir Qansuh and took the sultanate on 2 Dhu'l-Qa'da 905 for half a year, built the Janbalatiyya madrasa, then was deposed and strangled at Alexandria — his body carried to Qaytbay's tomb then to his own outside Bab al-Nasr, reportedly unchanged {cite:shadharat-dhahab p. 445}."
