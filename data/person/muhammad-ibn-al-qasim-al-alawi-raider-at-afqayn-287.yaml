label:
  ar: "محمد بن القاسم العلوي، صاحب غارة أفقين"
  en: "Muhammad ibn al-Qasim al-Alawi, who led the raid on Afqayn"
  ur: "محمد بن قاسم علوی، افقین کے چھاپے کے سالار"
summary:
  ar: "علوي من ولد العباس بن علي أرسله الهادي مع علي بن محمد للغارة على أفقين، وضرب رجلاً من المهرة على جمل من الغنيمة ثم عفا عنه صاحبه."
  en: "An Alawi of the line of al-Abbas ibn Ali whom al-Hadi sent with Ali ibn Muhammad to raid Afqayn, and who struck a man of al-Mahra over a camel from the spoils, the man then pardoning him."
  ur: "عباس بن علی کی اولاد کا ایک علوی جسے ہادی نے علی بن محمد کے ساتھ افقین پر چھاپے کے لیے بھیجا، اور جس نے غنیمت کے ایک اونٹ پر مہرہ کے ایک شخص کو مارا، پھر اس نے معاف کر دیا۔"
