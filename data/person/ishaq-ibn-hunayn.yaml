id: person/ishaq-ibn-hunayn
class: person
label: { ar: "إسحاق بن حنين", en: "Ishaq Ibn Hunayn", es: "Ishaq Ibn Hunayn", fr: "Ishaq Ibn Hunayn", ur: "اسحاق ابن حنین" }
summary:
  ar: "أبو يعقوب إسحاق بن حنين في تجار أبيه في الفضل وصحة النقل من اللغة اليونانية والسريانية إلى العربية وكان فصيحا بالعربية يزيد على أبيه في ذلك وخدم من خدمه أبوه من الخلفاء والرؤساء، وكان منقطعا إلى القاسم بن عبيد الله وخصيصا به مقدما عنده يفضي إليه بأسراره، ولحقه في آخر عمره الفالج وبه مات وتوفي في شهر ربيع الآخر سنة ثمان وتسعين ومائتين، وله من الكتب سوى ما نقل من الكتب القديمة كتاب الأدوية المفردة على الحروف وكتاب الكناش اللطيف وكتاب تاريخ الأطباء وكتاب الأدوية المفردة اللطيف على الحروف {cite:fihrist-ibn-al-nadim p. 415}. ونقل كتاب إقليدس في أصول الهندسة وأصلحه ثابت بن قرة الحراني {cite:fihrist-ibn-al-nadim p. 371}"
  en: "Ishaq ibn Hunayn — surpassed his father in Arabic eloquence; author of the History of Physicians; d. 298 {cite:fihrist-ibn-al-nadim}"
  es: "Ishaq ibn Hunayn — superó a su padre en elocuencia árabe; autor de la Historia de los médicos; m. 298 {cite:fihrist-ibn-al-nadim}"
  fr: "Ishaq ibn Hunayn — surpassa son père en éloquence arabe; auteur de l'Histoire des médecins; mort en 298 {cite:fihrist-ibn-al-nadim}"
  ur: "اسحاق بن حنین - عربی فصاحت میں اپنے والد سے آگے نکل گئے۔ ڈاکٹروں کی تاریخ کے مصنف؛ d 298 {حوالہ: فہرست ابن الندیم}"
  tr: "Ebu Ya'qub İshaq ibn Huneyn, babasının tüccarları arasında Yunanca ve Süryanice'den Arapçaya doğru aktarımı ve doğruluğuyla öne çıkıyordu. Arapçada çok iyi konuşuyordu ve bu konuda babasını geride bırakıyordu. Babası halifeler ve reisler arasında hizmet etti. Özellikle sunumcusu olan ve sırlarını paylaşan el-Kasım bin Ubeydallah'a bağlıydı. İlerleyen yıllarında felç geçirdi, öldü ve 298 Hicri yılında Rabi'l-Thani'de hayatını kaybetti. Eski kitaplardan aktardığı kitapların yanı sıra 'El-Adviyat el-Müfrada el-Huruf' gibi kitapları da vardı: 'Geç Defter', 'Hekimlerin Tarihi,' ve 'El-Adwiyat el-Mufradah el-Haruf' {atıf:fihrist-ibn-al-nadim s. 415}. Ayrıca Öklid'in geometri prensipleri üzerine kitabından alıntı yaptı ve Tebit ibn Qurra el-Harrani tarafından doğrulandı {atıf:fihrist-ibn-al-nadim s. 371}"
  id: "Abu Ya'qub Ishaq ibn Hunayn dalam buku pedagang ayahnya dikenal karena kebajikan dan ketepatan transmisi dari bahasa Yunani dan Suryani ke Arab. Ia fasih berbahasa Arab dan melampaui ayahnya dalam hal ini. Ayahnya melayani di antara khalifah dan kepala suku. Ia setia kepada al-Qasim ibn Ubayd Allah, terutama kepadanya, yang menjadi pembawa acaranya dan mempercayakan rahasianya. Di tahun-tahun terakhirnya, ia mengalami stroke, meninggal karenanya, dan meninggal di Rabi' al-Thani pada tahun 298 H. Ia juga memiliki buku-buku selain yang ia kirimkan dari buku-buku lama, seperti 'Al-Adwiyat al-Mufradah al-al-Huruf,' 'The Late Notebook,' 'History of Physicians,' dan 'Al-Adwiyat al-Mufradah al-al-Haruf' {cite:Fihrist-ibn-al-Nadim hlm. 415}. Ia juga mengutip buku Euclid tentang prinsip-prinsip geometri dan diautentikasi oleh Thabit ibn Qurra al-Harrani {cite:fihrist-ibn-al-nadim hlm. 371}"
