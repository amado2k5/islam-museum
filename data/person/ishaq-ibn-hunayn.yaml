label: { ar: "إسحاق بن حنين", en: "Ishaq Ibn Hunayn" }
summary:
  ar: "أبو يعقوب إسحاق بن حنين في تجار أبيه في الفضل وصحة النقل من اللغة اليونانية والسريانية إلى العربية وكان فصيحا بالعربية يزيد على أبيه في ذلك وخدم من خدمه أبوه من الخلفاء والرؤساء، وكان منقطعا إلى القاسم بن عبيد الله وخصيصا به مقدما عنده يفضي إليه بأسراره، ولحقه في آخر عمره الفالج وبه مات وتوفي في شهر ربيع الآخر سنة ثمان وتسعين ومائتين، وله من الكتب سوى ما نقل من الكتب القديمة كتاب الأدوية المفردة على الحروف وكتاب الكناش اللطيف وكتاب تاريخ الأطباء وكتاب الأدوية المفردة اللطيف على الحروف {cite:fihrist-ibn-al-nadim p. 415}. ونقل كتاب إقليدس في أصول الهندسة وأصلحه ثابت بن قرة الحراني {cite:fihrist-ibn-al-nadim p. 371}"
  en: "Ishaq ibn Hunayn — surpassed his father in Arabic eloquence; author of the History of Physicians; d. 298 {cite:fihrist-ibn-al-nadim}"
