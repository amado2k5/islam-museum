summary:
  ar: "عالم آثار وموظف حكومي باكستاني من كوهات في خيبر بختونخوا. نال الماجستير في الآثار من جامعة بيشاور أولا على دفعته بميدالية ذهبية، والدكتوراه من جامعة برلين الحرة سنة 2011، وزمالة فولبرايت لما بعد الدكتوراه في جامعة ويسكونسن ماديسون، ودرّس الآثار قرابة عشر سنوات في جامعة هزارة، ثم عُيّن سنة 2014 مديرا لمديرية الآثار والمتاحف في خيبر بختونخوا ثم مديرا عاما لها، وقاد مشاريع لتوثيق تراث غاندهارا والمتاحف، وألّف «نشأة الهندوسية في غاندهارا»، وحاز وسام فخر الأداء الرئاسي سنة 2018؛ وفي 2019 اعتقله مكتب المحاسبة الوطني بتهم إساءة استعمال السلطة ثم أُفرج عنه بكفالة وأعيد إلى منصبه."
  en: "Pakistani archaeologist and civil servant from Kohat in Khyber Pakhtunkhwa. He took an MA in archaeology from the University of Peshawar, first in his class with a gold medal, a PhD from the Free University of Berlin in 2011, and a Fulbright postdoctoral fellowship at the University of Wisconsin–Madison; he taught archaeology at Hazara University for almost ten years, was appointed director of the Khyber Pakhtunkhwa Directorate of Archaeology and Museums in 2014 and later its director general, led Gandhara heritage and museum projects, authored Emergence of Hinduism in Gandhara, and received the Presidential Pride of Performance in 2018; in 2019 the National Accountability Bureau arrested him on allegations of misuse of authority, after which he was granted bail and reinstated."
  ur: "پاکستانی ماہر آثار قدیمہ اور سرکاری افسر، جن کا تعلق خیبر پختونخوا کے شہر کوہاٹ سے ہے۔ انھوں نے پشاور یونیورسٹی سے آثار قدیمہ میں ایم اے اپنی جماعت میں اول آ کر طلائی تمغے کے ساتھ کیا، 2011ء میں فری یونیورسٹی برلن سے پی ایچ ڈی کی اور یونیورسٹی آف وسکونسن میڈیسن میں فلبرائٹ پوسٹ ڈاکٹریٹ فیلوشپ حاصل کی؛ تقریباً دس سال ہزارہ یونیورسٹی میں آثار قدیمہ پڑھایا، پھر 2014ء میں خیبر پختونخوا کے ڈائریکٹوریٹ آف آرکیالوجی اینڈ میوزیمز کے ڈائریکٹر اور بعد میں ڈائریکٹر جنرل مقرر ہوئے، گندھارا کے ورثے اور عجائب گھروں کے منصوبوں کی قیادت کی، کتاب «Emergence of Hinduism in Gandhara» لکھی اور 2018ء میں صدارتی تمغۂ حسن کارکردگی پایا؛ 2019ء میں قومی احتساب بیورو نے انھیں اختیارات کے ناجائز استعمال کے الزامات پر گرفتار کیا، بعد ازاں انھیں ضمانت ملی اور وہ بحال ہو گئے۔"
