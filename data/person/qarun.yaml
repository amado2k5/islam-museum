summary:
  ar: "قارون كما يذكره الشيخ عمر عبد الكافي في دروس «النبأ الصافي»: صاحب المال الذي نسب ماله إلى علمه فنسي فضل الله، والذي ظلم قومه فلا يصلح لقيادتهم، ومثال يستحضره الشيخ في الحديث عن المسؤولية وعن ترديد الأقوال المتكبرة. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  en: "Qarun as Sheikh Omar Abdelkafy mentions him in the series 'Al Naba Al Safi': a man who credited his wealth to his own knowledge and forgot God's favour, who oppressed his people and was unfit to lead them, and an example the Sheikh brings up when speaking of responsibility and of repeating proud words. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  ur: "قارون، جیسا کہ شیخ عمر عبدالکافی نے سلسلہ «النبأ الصافی» میں ان کا ذکر کیا: وہ شخص جس نے اپنے مال کو اپنے علم کا نتیجہ سمجھا اور اللہ کے فضل کو بھلا دیا، جس نے اپنی قوم پر ظلم کیا اور قیادت کے لائق نہ رہا، اور وہ مثال جو شیخ ذمہ داری اور متکبرانہ باتوں کو دہرانے کے موضوع پر پیش کرتے ہیں۔ {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
