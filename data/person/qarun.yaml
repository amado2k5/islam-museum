summary:
  ar: "قارون كما يذكره الشيخ عمر عبد الكافي في دروس «النبأ الصافي»: صاحب المال الذي نسب ماله إلى علمه فنسي فضل الله، والذي ظلم قومه فلا يصلح لقيادتهم، ومثال يستحضره الشيخ في الحديث عن المسؤولية وعن ترديد الأقوال المتكبرة. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  en: "Qarun as Sheikh Omar Abdelkafy mentions him in the series 'Al Naba Al Safi': a man who credited his wealth to his own knowledge and forgot God's favour, who oppressed his people and was unfit to lead them, and an example the Sheikh brings up when speaking of responsibility and of repeating proud words. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  ur: "قارون، جیسا کہ شیخ عمر عبدالکافی نے سلسلہ «النبأ الصافی» میں ان کا ذکر کیا: وہ شخص جس نے اپنے مال کو اپنے علم کا نتیجہ سمجھا اور اللہ کے فضل کو بھلا دیا، جس نے اپنی قوم پر ظلم کیا اور قیادت کے لائق نہ رہا، اور وہ مثال جو شیخ ذمہ داری اور متکبرانہ باتوں کو دہرانے کے موضوع پر پیش کرتے ہیں۔ {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  es: "Qarun, como lo menciona el jeque Omar Abdelkafy en la serie 'Al Naba Al Safi': un hombre que atribuyó su riqueza a su propio conocimiento y olvidó el favor de Dios, que oprimió a su pueblo y no era apto para liderarlo, y un ejemplo que el jeque menciona al hablar de responsabilidad y de repetir palabras orgullosas. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  fr: "Qarun, comme l'évoque le cheikh Omar Abdelkafy dans la série « Al Naba Al Safi », est un homme qui attribuait sa richesse à son propre savoir et oubliait la grâce divine, qui opprimait son peuple et était inapte à le diriger. Le cheikh le cite en exemple lorsqu'il parle de responsabilité et de l'orgueil démesuré."
  tr: "Karun, Şeyh Ömer Abdulkafi'nin \"Al-Naba' Al-Safi\" derslerinde belirttiği gibi: zenginliği bilgisine atfedilen ve Allah'ın lütfunu unutan zengin adam, halkına kötülük eden kişi ise onları yönetmeye layık değildir. Şeyh, sorumluluk tartışırken ve kibirli sözleri tekrarlarken bir örnek verdi. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
  id: "Qarun, seperti yang disebutkan Sheikh Omar Abdul Kafi dalam pelajaran \"Al-Naba' Al-Safi\": orang kaya yang kekayaannya dikaitkan dengan pengetahuannya dan melupakan kasih karunia Tuhan, dan orang yang menyakiti rakyatnya tidak layak memimpin mereka. Sheikh memberikan contoh saat membahas tanggung jawab dan mengulang kata-kata sombong. {cite:assabile-omar-abdelkafy al-naba-al-safi/ep06 00:17:30} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:07:00} {cite:assabile-omar-abdelkafy al-naba-al-safi/ep02 00:23:30}"
