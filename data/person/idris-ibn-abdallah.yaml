id: person/idris-ibn-abdallah
class: person
label: { ar: "إدريس بن عبد الله", en: "Idris ibn 'Abd Allah" }
summary:
  ar: "أخو محمد وإبراهيم ابني عبد الله بن الحسن، مضى بعد انفراد إخوته إلى المغرب فأجابه خلق من الناس، وبعث المنصور من اغتاله بالسم فيما احتوى عليه من مدن المغرب، فقام ولده إدريس بن إدريس مقامه فعرف البلد بهم وقيل بلد إدريس بن إدريس {cite:muruj-al-dhahab p. 285}. وعند ابن خلدون وفر إلى المغرب بعد يوم فخ الذي قتل فيه حسين بن علي بن حسن المثلث سنة 169هـ ونزل على أوربة سنة 172هـ وأميرهم يومئذ أبو ليلى إسحاق بن محمد بن عبد الحميد فأجاره وجمع البرابر على دعوته واجتمعت عليه زواغة ولواتة وسراتة وغماتة ونفزة ومكناسة وغمارة وكافة برابرة المغرب فبايعوه وتم له الملك والسلطان بالمغرب {cite:tarikh-ibn-khaldun-ibar p. 1627}"
  en: "The Hasanid refugee to the Maghreb — answered by the people, poisoned by al-Mansur's agent, succeeded by his posthumous son Idris II whose dynasty named the land {cite:muruj-al-dhahab p. 285}."
