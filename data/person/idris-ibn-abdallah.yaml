id: person/idris-ibn-abdallah
class: person
label: { ar: "إدريس بن عبد الله", en: "Idris ibn 'Abd Allah", es: "Idris ibn 'Abd Allah", fr: "Idris ibn 'Abd Allah", ur: "ادریس بن عبداللہ" }
summary:
  ar: "أخو محمد وإبراهيم ابني عبد الله بن الحسن، مضى بعد انفراد إخوته إلى المغرب فأجابه خلق من الناس، وبعث المنصور من اغتاله بالسم فيما احتوى عليه من مدن المغرب، فقام ولده إدريس بن إدريس مقامه فعرف البلد بهم وقيل بلد إدريس بن إدريس {cite:muruj-al-dhahab p. 285}. وعند ابن خلدون وفر إلى المغرب بعد يوم فخ الذي قتل فيه حسين بن علي بن حسن المثلث سنة 169هـ ونزل على أوربة سنة 172هـ وأميرهم يومئذ أبو ليلى إسحاق بن محمد بن عبد الحميد فأجاره وجمع البرابر على دعوته واجتمعت عليه زواغة ولواتة وسراتة وغماتة ونفزة ومكناسة وغمارة وكافة برابرة المغرب فبايعوه وتم له الملك والسلطان بالمغرب {cite:tarikh-ibn-khaldun-ibar p. 1627}"
  en: "The Hasanid refugee to the Maghreb — answered by the people, poisoned by al-Mansur's agent, succeeded by his posthumous son Idris II whose dynasty named the land {cite:muruj-al-dhahab p. 285}."
  es: "El refugiado hasánida al Magreb —respondido por el pueblo, envenenado por el agente de al-Mansur, sucedido por su hijo póstumo Idris II cuya dinastía dio nombre a la tierra {cite:muruj-al-dhahab p. 285}."
  fr: "Le réfugié hassanide au Maghreb — répondu par le peuple, empoisonné par l'agent d'al-Mansur, remplacé par son fils posthume Idris II dont la dynastie a nommé la terre {cite:muruj-al-dhahab p. 285}."
  ur: "مغرب کو حسنی پناہ گزین - لوگوں کی طرف سے جواب دیا گیا، المنصور کے ایجنٹ کے ذریعہ زہر دیا گیا، اس کے بعد اس کے بعد کے بیٹے ادریس دوم نے جانشین بنایا جس کے خاندان نے اس زمین کا نام رکھا {حوالہ: مروج الذہاب صفحہ 285}۔"
  tr: "Abdullah ibn al-Hasan'ın oğulları Muhammed ve İbrahim'in kardeşi olan Sherssur, kardeşleri yalnız ayrıldıktan sonra Fas'a gitti ve bir grup insan ona karşılık verdi. Al-Mansur, kendisini zehirle öldürenleri Fas şehirlerine gönderdi. Oğlu İdris bin İdris onun yerine geçti ve kasaba onlara tanındı; bunun İdris ibn İdris kasabası olduğu söylenir. Muruj-al-Dhahab, s. 285}. İbn Haldun'a göre, 169 Hicri'de Hüseyin bin Ali ibn Hasan el-Muthallath'ın öldürüldüğü bir tuzak gününden sonra Fas'a kaçtı. 172 Hicri'de Urba'ya yerleşti. O dönemdeki liderleri Ebu Leyla bin Muhammed bin Abdül-Hamid onu korudu ve çağrısına karşı barbarları topladı. Zuagha, Luwata, Sarata, Ghamata, Nafza, Meknasah, Ghamara ve Fas'ın tüm Berberileri ona bağlılık yemini etti ve Fas'ta krallık ve sultanlık verildi. {cite:History-ibn-khaldun-ibar s. 1627}"
  id: "Saudara Muhammad dan Ibrahim, putra Abdullah ibn al-Hasan, ia pergi ke Maroko setelah saudara-saudaranya pergi sendirian, dan sekelompok orang meresponsnya. Al-Mansur mengirim mereka yang membunuhnya dengan racun ke kota-kota Maroko. Putranya Idris ibn Idris menggantikannya, dan kota itu menjadi dikenal oleh mereka, dan dikatakan kota itu adalah Idris ibn Idris {cite:Muruj-al-Dhahab, hlm. 285}. Menurut Ibn Khaldun, ia melarikan diri ke Maroko setelah hari jebakan di mana Husayn ibn Ali ibn Hasan al-Muthallath tewas pada tahun 169 H. Ia menetap di Urba pada tahun 172 H. Pemimpin mereka saat itu, Abu Layla ibn Muhammad ibn Abd al-Hamid, melindunginya dan mengumpulkan orang-orang barbar untuk menentang panggilannya. Zouagha, Luwata, Sarata, Ghamata, Nafza, Meknasah, Ghamara, dan semua Berber Maroko bersumpah setia kepadanya, dan ia dianugerahi raja serta sultan di Maroko. {cite:History-ibn-khaldun-ibar hlm. 1627}"
