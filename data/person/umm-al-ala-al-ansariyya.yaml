summary:
  ar: 'صحابية أنصارية من المبايعات؛ روت حديثاً في الصحيحين عن نزول عثمان بن مظعون في بيتها عند توزيع الأنصار للمهاجرين وموته عندها، ورؤيتها له عيناً جارية وقول النبي: «ذلك عمله»؛ ويرجح ابن حجر أنها والدة خارجة بن زيد بن ثابت.'
  en: An Ansari Companion among those who pledged; she narrated in the two collections the story of Uthman ibn Maz'un's lodging in her house when the Ansar divided the Muhajirun among them and his death there, her seeing a flowing spring for
    him and the Prophet's words 'That is his deed'; Ibn Hajar judges her the mother of Kharija ibn Zayd ibn Thabit.
  ur: "بیعت کرنے والی انصاری صحابیہ؛ دونوں صحیحین میں عثمان بن مظعون کے اس کے گھر ٹھہرنے کی کہانی بیان کی۔"
  es: "Una compañera de los Ansar entre los que se comprometieron; narró en las dos colecciones la historia de la estancia de Uthman ibn Maz'un en su casa cuando los Ansar dividieron a los Muhajirun entre ellos y su muerte allí, viendo ella un manantial que brotaba para él y las palabras del Profeta: \"Ese es su acto\"; Ibn Hajar la considera la madre de Kharija ibn Zayd ibn Thabit."
  fr: "Compagne Ansar parmi ceux qui ont prêté serment, elle a narré dans les deux recueils l'histoire d'Uthman ibn Maz'un logeant dans sa maison lorsque les Ansar se sont partagé les Muhajirun et sa mort là-bas, elle voyant une source jaillir pour lui et les paroles du Prophète « Tel est son acte »; Ibn Hajar la considère comme la mère de Kharija ibn Zayd ibn Thabit."
