summary:
  ar: 'صحابية أنصارية من المبايعات؛ روت حديثاً في الصحيحين عن نزول عثمان بن مظعون في بيتها عند توزيع الأنصار للمهاجرين وموته عندها، ورؤيتها له عيناً جارية وقول النبي: «ذلك عمله»؛ ويرجح ابن حجر أنها والدة خارجة بن زيد بن ثابت.'
  en: An Ansari Companion among those who pledged; she narrated in the two collections the story of Uthman ibn Maz'un's lodging in her house when the Ansar divided the Muhajirun among them and his death there, her seeing a flowing spring for
    him and the Prophet's words 'That is his deed'; Ibn Hajar judges her the mother of Kharija ibn Zayd ibn Thabit.
