summary:
  ar: "الملك العادل سيف الدين أبو بكر بن الملك الكامل ناصر الدين محمد؛ استخلفه أبوه بالديار المصرية وهو أصغر أولاده؛ وملك الملك المسعود مكة وبلاد الحجاز مضافة إلى اليمن؛ فأقام العادل في المملكة سنة ويوم الجمعة من ذي القعدة سنة سبع وثلاثين وستمائة قبض عليه أمراء دولته بظاهر بلبيس وطلبوا أخاه الملك الصالح نجم الدين أيوب فدخل القاهرة في الساعة الثانية من يوم الأحد السابع والعشرين من ذي القعدة من السنة المذكورة — قال ابن خلكان: وكنت إذ ذاك بالقاهرة — وأُدخل أخوه الملك العادل في محفة وحوله جماعة من الأجناد يحفظونه وحُمل إلى القلعة واعتقل بها؛ وأخذ الملك الصالح دمشق من يده بعد ذلك وأبقى عليه بعلبك ثم توفي في الاعتقال {cite:wafayat-ayan}."
  en: "Al-Malik al-Adil II Sayf al-Din Abu Bakr — last Ayyubid sultan of Egypt; his own amirs seized him outside Bilbays in Dhu al-Qa'da 637 and raised his brother al-Salih Ayyub (Ibn Khallikan was in Cairo and watched him carried through in a litter); later given Baalbek, and died in custody at the Cairo citadel in Shawwal 645 {cite:wafayat-ayan}."
