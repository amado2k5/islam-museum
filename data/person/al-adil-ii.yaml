summary:
  ar: "الملك العادل سيف الدين أبو بكر بن الملك الكامل ناصر الدين محمد؛ استخلفه أبوه بالديار المصرية وهو أصغر أولاده؛ وملك الملك المسعود مكة وبلاد الحجاز مضافة إلى اليمن؛ فأقام العادل في المملكة سنة ويوم الجمعة من ذي القعدة سنة سبع وثلاثين وستمائة قبض عليه أمراء دولته بظاهر بلبيس وطلبوا أخاه الملك الصالح نجم الدين أيوب فدخل القاهرة في الساعة الثانية من يوم الأحد السابع والعشرين من ذي القعدة من السنة المذكورة — قال ابن خلكان: وكنت إذ ذاك بالقاهرة — وأُدخل أخوه الملك العادل في محفة وحوله جماعة من الأجناد يحفظونه وحُمل إلى القلعة واعتقل بها؛ وأخذ الملك الصالح دمشق من يده بعد ذلك وأبقى عليه بعلبك ثم توفي في الاعتقال {cite:wafayat-ayan}."
  en: "Al-Malik al-Adil II Sayf al-Din Abu Bakr — last Ayyubid sultan of Egypt; his own amirs seized him outside Bilbays in Dhu al-Qa'da 637 and raised his brother al-Salih Ayyub (Ibn Khallikan was in Cairo and watched him carried through in a litter); later given Baalbek, and died in custody at the Cairo citadel in Shawwal 645 {cite:wafayat-ayan}."
  fr: "Al-Malik al-Adil II Sayf al-Din Abu Bakr — dernier sultan ayyoubide d’Égypte ; ses propres émirs le saisirent près de Bilbays en dhu al-qi’da 637 H et élevèrent son frère al-Salih Ayyub au pouvoir (Ibn Khallikan, alors au Caire, le vit traverser la ville en litière) ; il reçut ensuite Baalbek et mourut en détention à la citadelle du Caire en shawwal 645 H {cite:wafayat-ayan}."
  es: "Al-Malik al-Adil II Sayf al-Din Abu Bakr — último sultán ayubí de Egipto; sus propios emires lo apresaron en las afueras de Bilbays en Dhu al-Qa'da 637 y criaron a su hermano al-Salih Ayyub (Ibn Khallikan estaba en El Cairo y lo vio ser llevado en una litera); más tarde se le dio Baalbek y murió bajo custodia en la ciudadela de El Cairo en Shawwal 645 {cite:wafayat-ayan}."
  ur: "المالک العدل ثانی سیف الدین ابوبکر - مصر کے آخری ایوبی سلطان؛ ذی القعدہ 637 میں اس کے اپنے امیروں نے اسے بلبیس کے باہر پکڑ لیا اور اس کے بھائی صالح ایوب کو اٹھایا ⁦(ابن خلیقان قاہرہ میں تھا اور اسے کوڑے میں لے جاتے دیکھا)⁩؛ بعد میں اسے بعلبیک دیا گیا، اور شوال 645 میں قاہرہ کے قلعے میں حراست میں انتقال کر گئے۔"
  tr: "El-Malik el-Adil Seyf el-Din Ebu Bekir ibn el-Malik el-Kamil Nasir el-Din Muhammed; babası onu Mısır topraklarında halefi olarak atamıştı ve o, oğullarının en küçüğüydü; ve el-Malik el-Mas'ud, Yemen'e ek olarak Mekke ve Hicaz topraklarını yönetti; Böylece el-Adil bir yıl boyunca krallıkta kaldı ve 637. yılın Zilhicce ayının Cuma günü, devletinin prensleri onu Bilbeis dışında yakaladılar ve kardeşi el-Malik el-Salih Necm el-Din Eyyub'u istediler. Bunun üzerine, adı geçen yılın Zilhicce ayının 27. Pazar günü saat ikide Kahire'ye girdi —İbn Hallikan dedi ki: Ben o sırada Kahire'deydim— ve kardeşi el-Malik el-Adil bir sedyeyle getirildi, etrafında onu koruyan bir grup asker vardı ve kaleye götürülerek orada hapsedildi; el-Malik el-Salih daha sonra Şam'ı ondan aldı ve onu Baalbek'te bıraktı, sonra hapiste öldü. {Kaynak: Vefayyat-ayan}"
  id: "Al-Malik al-Adil Saif al-Din Abu Bakr ibn al-Malik al-Kamil Nasir al-Din Muhammad; ayahnya menunjuknya sebagai penggantinya di wilayah Mesir, dan dia adalah putra bungsunya; dan al-Malik al-Mas'ud memerintah Mekah dan wilayah Hijaz serta Yaman; Maka al-Adil tinggal di kerajaan itu selama setahun, dan pada hari Jumat Dzul Qa'dah tahun 637, para pangeran kerajaannya menangkapnya di luar Bilbeis dan mereka menuntut saudaranya, al-Malik al-Salih Najm al-Din Ayyub, sehingga ia memasuki Kairo pada jam kedua hari Minggu, tanggal 27 Dzul Qa'dah tahun tersebut — Ibnu Khallikan berkata: Saya berada di Kairo pada waktu itu — dan saudaranya, al-Malik al-Adil, dibawa masuk dengan tandu, dan di sekelilingnya ada sekelompok tentara yang menjaganya, dan ia dibawa ke Benteng dan dipenjara di sana; dan al-Malik al-Salih merebut Damaskus darinya setelah itu dan meninggalkannya di Baalbek, kemudian ia meninggal dalam penjara {kutipan: wafayat-ayan}."
