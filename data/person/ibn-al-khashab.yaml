id: person/ibn-al-khashab
class: person
label: { ar: "أبو الحسن ابن الخشاب القارئ" }
summary:
  ar: "أبو الحسن ابن الخشاب القارئ، كان مليح الصوت حسن التلاوة، وهو تلميذ أبي بكر بن الآدمي الموصوف بطيب التلاوة، وعليه تلقن أبو الحسين بن الرفاء. وأنه قرأ في جامع الرصافة في بعض الليالي الأحياء قوله تعالى ألم يأن للذين آمنوا أن تخشع قلوبهم لذكر الله فتواجد صوفاً وقال بلى قد آن ثم جلس وبكى طويلاً وسكت سكتة طالت فحرك فإذا هو ميت {cite:muntazam-ibn-al-jawzi j.7 p.228}."
  tr: "Ebu el-Hasan ibn el-Khashab, yani okuyan, güzel bir sese ve güzel bir okumaya sahipti. Ebu Bekir bin el-Ademi'nin öğrencisiydi, yetenekli bir şifacı olarak tanımlanır ve Ebu el-Hüseyin ibn el-Rifa da buna göre eğitilmiştir. Rusafa Camii'nde bazı canlı gecelerde şu ayeti okudu: 'Kalplerini Allah'ı anmaya alçaltmaya inananların zamanı gelmedi mi?' Sonra bir bez içinde toplandı ve 'Evet, geldi.' dedi. Sonra oturup uzun süre ağladı, sonra ölene kadar hareket etti. {Kaynak:Muntazam-ibn-al-Jawzi j.7 s.228}."
  id: "Abu al-Hasan ibn al-Khashab, sang pembaca, memiliki suara yang indah dan pembacaan yang indah. Ia adalah murid Abu Bakr ibn al-Adami, yang digambarkan sebagai pembaca yang terampil, dan Abu al-Husayn ibn al-Rifa' diajarkan sesuai itu. Ia melafalkan di Masjid Rusafa pada beberapa malam kehidupan sebuah ayat: 'Bukankah sudah tiba waktunya bagi mereka yang percaya bahwa hatinya harus merendahkan diri untuk mengenang Allah?' Kemudian ia mengenakan kain dan berkata, 'Ya, sudah tiba.' Kemudian ia duduk dan menangis lama, lalu bergerak hingga ia meninggal. {cite:Muntazam-ibn-al-Jawzi j.7 hlm.228}."
