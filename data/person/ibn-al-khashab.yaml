summary:
  ar: "أبو الحسن ابن الخشاب القارئ، كان مليح الصوت حسن التلاوة، وهو تلميذ أبي بكر بن الآدمي الموصوف بطيب التلاوة، وعليه تلقن أبو الحسين بن الرفاء. وأنه قرأ في جامع الرصافة في بعض الليالي الأحياء قوله تعالى ألم يأن للذين آمنوا أن تخشع قلوبهم لذكر الله فتواجد صوفاً وقال بلى قد آن ثم جلس وبكى طويلاً وسكت سكتة طالت فحرك فإذا هو ميت {cite:muntazam-ibn-al-jawzi j.7 p.228}."
