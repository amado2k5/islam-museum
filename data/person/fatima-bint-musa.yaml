summary:
  ar: "بطاقة أولية لفاطمة بنت موسى الكاظم المعروفة بالمعصومة في التراث الإمامي، أخت علي بن موسى الرضا وصاحبة المشهد بقم، توفيت نحو سنة ٨١٦م؛ تذكرها كتب التراجم ولم تُراجع ترجمتها على الصفحة بعد."
  en: "Draft card for Fatima bint Musa al-Kazim, known in Imami tradition as al-Ma'suma, sister of Ali al-Rida whose shrine at Qum bears her name, d. about 816; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Fatima bint Musa al-Kazim, conocida en la tradición imamí como al-Ma'suma, hermana de Ali al-Rida, cuyo santuario en Qum lleva su nombre, fallecida alrededor del año 816; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature pour Fatima bint Musa al-Kazim, connue dans la tradition Imami sous le nom d'al-Ma'suma, sœur d'Ali al-Rida dont le sanctuaire à Qom porte son nom, décédée vers 816; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "فاطمہ بنت موسیٰ کاظم کے لیے کارڈ کا مسودہ، جسے امامی روایت میں الماسومہ کے نام سے جانا جاتا ہے، علی الرضا کی بہن جن کا مزار قم میں ہے، ڈی۔ تقریباً 816؛ سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "İmam mirasında Ma'sumah olarak bilinen, Ali ibn Musa al-Ridha'nın kız kardeşi ve Kum'daki türbenin yazarı Fatimah bint Musa al-Kadhim'in ilk kartı yaklaşık 816 yılında vefat etmiştir; biyografik kitaplarda kendisi ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Fatimah bint Musa al-Kadhim, yang dikenal sebagai Ma'sumah dalam warisan Imani, saudara perempuan Ali ibn Musa al-Ridha dan penulis makam di Qom, yang meninggal sekitar tahun 816 M; buku biografi menyebutkannya dan biografinya belum ditinjau di halaman tersebut."
