gender: male
summary:
  ar: "مجد الدين ابن جماعة الكناني المقدسي الشافعي مؤذن مدرسة طماج وخطيبها؛ كان أديباً مدرساً شاعراً بارزاً ولد ببيت المقدس سنة تسع وسبعين وسبعمائة فأحفظ القرآن والمنهاج والألفية وقرأ الفقه على ولده الشيخ أبي العباس أحمد المقدسي والنحو على ولده الشيخ يحيى وأخذ المذهب عن ولده الشيخ يحيى والتفسير عن الشيخ العفيف سليمان بن رميثة ودرس معهم ونوب الخطابة فحصل له بذلك محل حسن وقرأ عليه الشيخ شيخ الإسلام زكريا واشتغل وتصدى للإفتاء والتدريس بقية عمره وعزل من قضاء القدس إلى التدريس بالمدرسة الحنبلية والمقاصد والممدود، توفي في اليوم الثالث من شهر رمضان سنة خمس وستين وثمانمائة {cite:shadharat-dhahab p. 305-306}."
  en: "Majd al-Din ibn Jama'a (b. Jerusalem 779) — muezzin-khatib of Madrasa Tumaj, Shafi'i jurist-poet trained by his own father and brothers; taught at the Hanbali madrasa and al-Maqasid; died the third day of Ramadan 865 {cite:shadharat-dhahab p. 305-306}."
