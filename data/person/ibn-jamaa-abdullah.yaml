summary:
  ar: "مجد الدين ابن جماعة الكناني المقدسي الشافعي مؤذن مدرسة طماج وخطيبها؛ كان أديباً مدرساً شاعراً بارزاً ولد ببيت المقدس سنة تسع وسبعين وسبعمائة فأحفظ القرآن والمنهاج والألفية وقرأ الفقه على ولده الشيخ أبي العباس أحمد المقدسي والنحو على ولده الشيخ يحيى وأخذ المذهب عن ولده الشيخ يحيى والتفسير عن الشيخ العفيف سليمان بن رميثة ودرس معهم ونوب الخطابة فحصل له بذلك محل حسن وقرأ عليه الشيخ شيخ الإسلام زكريا واشتغل وتصدى للإفتاء والتدريس بقية عمره وعزل من قضاء القدس إلى التدريس بالمدرسة الحنبلية والمقاصد والممدود، توفي في اليوم الثالث من شهر رمضان سنة خمس وستين وثمانمائة {cite:shadharat-dhahab p. 305-306}."
  en: "Majd al-Din ibn Jama'a (b. Jerusalem 779) — muezzin-khatib of Madrasa Tumaj, Shafi'i jurist-poet trained by his own father and brothers; taught at the Hanbali madrasa and al-Maqasid; died the third day of Ramadan 865 {cite:shadharat-dhahab p. 305-306}."
  es: "Majd al-Din ibn Jama'a (n. Jerusalén 779) - muezzin-khatib de la madrasa Tumaj, jurista y poeta shafi'i formado por su propio padre y sus hermanos; enseñó en la madrasa Hanbali y al-Maqasid; murió el tercer día del Ramadán 865 {cita: shadharat-dhahab p. 305-306}."
  fr: "Majd al-Din ibn Jama'a (né à Jérusalem en 779) — muezzin-khatib de Madrasa Tumaj, juriste-poète shafi'i formé par son propre père et ses frères; enseigné à la madrasa Hanbali et à al-Maqasid; est décédé le troisième jour du Ramadan 865 {cite: shadharat-dhahab p. 305-306}."
  ur: "مجد الدین ابن جماعہ ⁦(ب۔ یروشلم 779)⁩ - مدرسہ تماج کے مؤذن خطیب، شافعی فقیہ شاعر جو ان کے اپنے والد اور بھائیوں سے تربیت یافتہ؛ حنبلی کے مدرسے اور المقاصد میں پڑھایا۔ رمضان المبارک 865 کے تیسرے دن وفات پائی۔ 305-306}۔"
  tr: "Majd el-Din ibn Cema'ah el-Kinani el-Makdisi el-Şafii, Temec okulunun müezzini ve vaizi; önemli bir edebiyatçı, öğretmen ve şairdi. 779 Hicri yılında Kudüs'te doğdu. Kur'an'ı, Minhacı ve Alfiyye'yi ezberledi. Oğlu Şeyh Ebu Abbas Ahmed al-Maqdisi'den fıkıh aldı, oğlu Şeyh Yahya'dan ise dilbilgisi aldı, ve medhabı oğlu Şeyh Yahya'dan, tefsirleri ise iffetli Şeyh Süleyman bin Rumaytha'dan öğrendi. Onlarla birlikte çalıştı ve vekil vaiz oldu. Şeyh al-İslam Zekeriye onun yanında eğitim aldı, fetva vermeye ve hayatının geri kalanını öğretmenliğe adadı. Kudüs yargısından alınarak Hanbali okulunda, Makasid'de ve Al-Mamddud'da öğretmenlik yaptı. 865 Hicri yılının Ramazan ayının üçüncü gününde vefat etti {alıntı:Shadharat-Dhahab, s. 305-306}."
  id: "Majd al-Din ibn Jama'ah al-Kinani al-Maqdisi al-Shafi'i, muezzin dan pengkhotbah aliran Tamaj; ia adalah tokoh sastra, guru, dan penyair terkemuka. Ia lahir di Yerusalem pada tahun 779 H. Ia menghafal Al-Qur'an, Minhaj, dan Alfiyya. Ia belajar hukum di bawah bimbingan putranya Sheikh Abu al-Abbas Ahmad al-Maqdisi, tata bahasa bersama putranya Sheikh Yahya, dan belajar madhhab dari putranya Sheikh Yahya, dan tafsir dari Sheikh Suleiman bin Rumaytha yang suci. Ia belajar dengan mereka dan menjadi wakil pengkhotbah. Sheikh al-Islam Zakariya belajar di bawah biauannya, mendedikasikan dirinya untuk mengeluarkan fatwa, dan mengajar sepanjang hidupnya. Ia dipindahkan dari peradilan Yerusalem untuk mengajar di sekolah Hanbali, Maqasid, dan Al-Mamddud. Ia meninggal pada hari ketiga Ramadan tahun 865 H {cite:Shadharat-Dhahab, hlm. 305-306}."
