summary:
  ar: "أحمد بن عبد اللطيف بن القاضي أحمد، شهاب الدين البشبيشي، ولد ببشبيش من أعمال المحلة بالغربية، من علماء الشافعية، محقق حجة ثقة متضلع من فنون كثيرة، لازم أبا الضياء الشبراملسي، وتصدر للإفتاء والتدريس بالجامع الأزهر، ثم أقام بمكة يدرس، وتوفي ببلده. من تصانيفه «التحفة السنية بأجوبة الأسئلة المرضية». عاش بين 1040 و1096هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  en: "Ahmad ibn Abd al-Latif ibn al-Qadi Ahmad, Shihab al-Din al-Bashbishi, born in Bashbish in the Gharbiyya province of Egypt, a Shafi'i scholar, a careful, trustworthy and well-versed authority in many sciences. He studied with Abu al-Diya' al-Shabramallisi, taught and gave fatwas at al-Azhar, taught in Mecca, and died in his town. His work is 'al-Tuhfa al-sunniyya' on questions and answers. He lived from 1040 to 1096 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  fr: "Ahmad ibn Abd al-Latif ibn al-Qadi Ahmad, Shihab al-Din al-Bashbishi, né à Bashbish dans la province égyptienne de Gharbiyya, savant chaféite, autorité soigneuse, fiable et versée dans de nombreuses sciences. Il étudia auprès d'Abu al-Diya' al-Shabramallisi, enseigna et délivra des fatwas à al-Azhar, enseigna à La Mecque et mourut dans sa ville. Son œuvre est « al-Tuhfa al-sunniyya », sur des questions et réponses. Il vécut de 1040 à 1096 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  es: "Ahmad ibn Abd al-Latif ibn al-Qadi Ahmad, Shihab al-Din al-Bashbishi, nació en Bashbish, en la provincia de Gharbiyya, Egipto. Fue un erudito shafi'í, una autoridad cuidadosa, confiable y versada en diversas ciencias. Estudió con Abu al-Diya' al-Shabramallisi, enseñó y emitió fatuas en al-Azhar, impartió clases en La Meca y falleció en su ciudad natal. Su obra es «al-Tuhfa al-sunniyya», sobre preguntas y respuestas. Vivió entre 1040 y 1096 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  ur: "احمد بن عبداللطیف ابن القدی احمد، شہاب الدین البشبیشی، مصر کے صوبہ غربیہ میں بشبش میں پیدا ہوئے، ایک شافعی عالم، محتاط، ثقہ اور بہت سے علوم کے ماہر تھے۔ اس نے ابو الدیع الشبرملیسی سے تعلیم حاصل کی، الازہر میں پڑھایا اور فتویٰ دیا، مکہ میں پڑھایا، اور اپنے قصبے میں وفات پائی۔ سوال و جواب پر ان کا کام 'التحفہ السنیہ' ہے۔ وہ 1040 سے 1096 ہجری تک زندہ رہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2054}"
  tr: "Ahmed ibn Abdüllatif ibn Kadı Ahmed, Şihabü'ddin el-Başbişi, Garbiye Valiliği'nin el-Mahalla ilçesine bağlı Başbişi'de doğdu. Şafiî mezhebine mensup, saygın ve güvenilir bir otorite olan Başbişi, birçok alanda bilgi sahibiydi. Ebu el-Diya el-Şubremsi'nin öğrencisi oldu ve fetvalar verme ve El-Ezher Camii'nde ders verme konusunda öne çıkan bir şahsiyet haline geldi. Daha sonra Mekke'de ikamet etti, burada ders verdi ve memleketinde vefat etti. Eserleri arasında \"El-Tuhfa el-Saniyya bi-Ajwibat el-As'ila el-Mardiyya\" (Değerli Hediye: Tatmin Edici Sorulara Cevaplar) bulunmaktadır. 1040 ile 1096 Hicri yılları arasında yaşamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2054}"
  id: "Ahmad ibn Abd al-Latif ibn al-Qadi Ahmad, Shihab al-Din al-Bashbishi, lahir di Bashbish, sebuah distrik al-Mahalla di Kegubernuran Gharbia. Beliau adalah seorang ulama mazhab Syafi'i, seorang tokoh yang sangat dihormati dan terpercaya, mahir dalam berbagai disiplin ilmu. Beliau belajar di bawah bimbingan Abu al-Diya' al-Shubramalsi dan menjadi tokoh terkemuka dalam mengeluarkan fatwa dan mengajar di Masjid al-Azhar. Kemudian beliau menetap di Mekah, tempat beliau mengajar, dan meninggal di kota kelahirannya. Di antara karyanya adalah \"Al-Tuhfa al-Saniyya bi-Ajwibat al-As'ila al-Mardiyya\" (Karunia Berharga: Jawaban atas Pertanyaan yang Memuaskan). Beliau hidup antara tahun 1040 dan 1096 Hijriah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
