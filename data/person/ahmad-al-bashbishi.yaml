summary:
  ar: "أحمد بن عبد اللطيف بن القاضي أحمد، شهاب الدين البشبيشي، ولد ببشبيش من أعمال المحلة بالغربية، من علماء الشافعية، محقق حجة ثقة متضلع من فنون كثيرة، لازم أبا الضياء الشبراملسي، وتصدر للإفتاء والتدريس بالجامع الأزهر، ثم أقام بمكة يدرس، وتوفي ببلده. من تصانيفه «التحفة السنية بأجوبة الأسئلة المرضية». عاش بين 1040 و1096هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
  en: "Ahmad ibn Abd al-Latif ibn al-Qadi Ahmad, Shihab al-Din al-Bashbishi, born in Bashbish in the Gharbiyya province of Egypt, a Shafi'i scholar, a careful, trustworthy and well-versed authority in many sciences. He studied with Abu al-Diya' al-Shabramallisi, taught and gave fatwas at al-Azhar, taught in Mecca, and died in his town. His work is 'al-Tuhfa al-sunniyya' on questions and answers. He lived from 1040 to 1096 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2054}"
