summary:
  ar: "من أكبر علماء العربية، من أزد عمان، نشأ في البصرة، ويُرجح أنه مبتكر كثير من المفاهيم العلمية في النحو والتحليل اللغوي. وذكر الجاحظ في رسالته الهاشمية عند المسعودي أنه وضع كتاباً في الإيقاع وتراكيب الأصوات وهو لم يعالج وتراً ولا مس بيده قضيباً قط، وكتب كتاباً في الكلام لو جهد كل بليغ أن يتعمد ذلك الخطأ لما وقع له، وعمد إلى الشطرنج فزاده في الدولاب حملاً فلعب به أناس من حاشية الشطرنجيين ثم رموا به {cite:muruj-al-dhahab p. 677-678}، وعند ابن النديم أن الأصول والمسائل في كتاب سيبويه له وأنه أستاذ سيبويه الذي أخذ عنه النحو، وأخذ هو عن عيسى بن عمر الثقفي {cite:fihrist-ibn-al-nadim p. 110,142-143}"
  en: "One of the greatest scholars of Arabic, of the Azd of Oman, raised in Basra. He is likely the originator of many of the scientific concepts and methods of Arabic grammar and linguistic analysis."
