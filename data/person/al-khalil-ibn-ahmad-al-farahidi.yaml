summary:
  ar: "من أكبر علماء العربية، من أزد عمان، نشأ في البصرة، ويُرجح أنه مبتكر كثير من المفاهيم العلمية في النحو والتحليل اللغوي. وذكر الجاحظ في رسالته الهاشمية عند المسعودي أنه وضع كتاباً في الإيقاع وتراكيب الأصوات وهو لم يعالج وتراً ولا مس بيده قضيباً قط، وكتب كتاباً في الكلام لو جهد كل بليغ أن يتعمد ذلك الخطأ لما وقع له، وعمد إلى الشطرنج فزاده في الدولاب حملاً فلعب به أناس من حاشية الشطرنجيين ثم رموا به {cite:muruj-al-dhahab p. 677-678}، وعند ابن النديم أن الأصول والمسائل في كتاب سيبويه له وأنه أستاذ سيبويه الذي أخذ عنه النحو، وأخذ هو عن عيسى بن عمر الثقفي {cite:fihrist-ibn-al-nadim p. 110,142-143}"
  en: "One of the greatest scholars of Arabic, of the Azd of Oman, raised in Basra. He is likely the originator of many of the scientific concepts and methods of Arabic grammar and linguistic analysis."
  es: "Fue uno de los más grandes eruditos del árabe, perteneciente al Azd de Omán, y se crió en Basora. Probablemente sea el creador de muchos de los conceptos y métodos científicos de la gramática y el análisis lingüístico árabes."
  fr: "L'un des plus grands érudits arabes, de l'Azd d'Oman, élevé à Bassora. Il est probablement à l'origine de nombreux concepts et méthodes scientifiques de la grammaire arabe et de l'analyse linguistique."
  ur: "عمان کے ازد کے عربی کے سب سے بڑے عالموں میں سے ایک، بصرہ میں پرورش پائی۔ غالباً وہ عربی گرامر اور لسانی تجزیہ کے بہت سے سائنسی تصورات اور طریقوں کا موجد ہے۔"
  tr: "Arapça'nın en büyük bilginlerinden biriydi, Azd Umman'dan gelmiş, Basra'da büyümüş ve dilbilgisi ile dil analizinde birçok bilimsel kavramı yenilediğine inanılır. Al-Jahiz, Al-Mas'udi ile yazdığı Haşimi risalesinde, ritim ve ses yapıları üzerine bir kitap yazdığını, ancak tellere hitap etmediğini veya elindeki bir çubuğa dokunmadığını belirtmiştir. Konuşma üzerine bir kitap yazmıştır; her etkileyici kişi böyle bir hata yapmaya kalkarsa bile başına gelmezdi. Saçka yöneldi, dolaba bir yük ekledi, satranç çevresinden bazıları onunla oynadı ve sonra fırlattı {alıntı:Muruj-al-Dhahab s. 677-678}. İbn el-Nadim'e göre, ilkeler ve meseleler Sibawayh'in kitabında yer alır ve Sibawayh'in öğretmeni olarak dilbilgisi öğrenilmiş, ayrıca İsa ibn Umar al-Thaqafi'den öğrenmiştir {atıf:Fihrist-ibn-al-Nadim s. 110,142-143}"
  id: "Ia adalah salah satu sarjana bahasa Arab terbesar, dari Azd Oman, tumbuh besar di Basra, dan diyakini telah menginovasi banyak konsep ilmiah dalam tata bahasa dan analisis linguistik. Al-Jahiz menyebutkan dalam risalah Hashemite bersama Al-Mas'udi bahwa ia menulis buku tentang ritme dan struktur suara sementara ia tidak pernah berbicara dengan senar atau menyentuh tongkat di tangannya. Ia menulis buku tentang pidato yang jika setiap orang fasih mencoba melakukan kesalahan seperti itu, hal itu tidak akan terjadi padanya. Ia beralih ke catur, menambahkan beban ke lemari, yang dimainkan oleh beberapa anggota rombongan catur lalu melemparkannya {cite:Muruj-al-Dhahab hlm. 677-678}. Menurut Ibn al-Nadim, prinsip dan isu-isu tersebut ada dalam buku Sibawayh dan bahwa ia adalah guru Sibawayh yang menjadi sumber tata bahasa, dan ia belajar dari Isa ibn Umar al-Thaqafi {sitasi: fihrist-ibn-al-nadim hlm. 110,142-143}"
