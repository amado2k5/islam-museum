    ar: "الخليل بن أحمد الفراهيدي من أكبر علماء العربية من أزد عمان نشأ بالبصرة، ويُرجح أنه مبتكر كثير من مفاهيم النحو والتحليل اللغوي."
    en: "Al-Khalil ibn Ahmad al-Farahidi, of Oman's Azd raised in Basra, is among the greatest scholars of Arabic — probably the inventor of many of its grammatical and prosodic concepts."
