summary:
  ar: "بكجور، مولى قرعويه وصاحب حلب نحو ست سنين ثم والي حمص لأبي المعالي الحمداني فعمرها وحفظ طرقها، ثم انتقل إلى ولاية دمشق في أواخر القرن الرابع الهجري."
  en: "Bakjur, mamluk of Qarghuya who held Aleppo about six years, then governed Homs for Abu al-Ma'ali the Hamdanid — rebuilding it and securing its roads — before moving to the governorship of Damascus, late 4th c. AH."
  es: "Bakjur, mameluco de Qarghuya que gobernó Alepo durante unos seis años, luego gobernó Homs para Abu al-Ma'ali el Hamdaní —reconstruyéndola y asegurando sus caminos— antes de pasar al gobierno de Damasco, a finales del siglo IV de la Hégira."
  fr: "Bakjur, mamelouk de Qarghuya qui a détenu Alep pendant environ six ans, puis a gouverné Homs pour Abu al-Ma'ali le Hamdanide — la reconstruisant et sécurisant ses routes — avant de passer au gouvernement de Damas, à la fin du IVe siècle AH."
  ur: "قرغویا کا مملوک، بکجور جس نے تقریباً چھ سال حلب پر قبضہ کیا، پھر حمص پر ابو المعالی ہمدانیوں کے لیے حکومت کی - اس کی تعمیر نو اور اس کی سڑکوں کو محفوظ بنایا - اس سے پہلے کہ دمشق کی گورنری میں جانے سے پہلے، 4 ویں صدی کے آخر میں۔ ھ۔"
  tr: "Bakjur, Kara'uyye'nin özgürleştirilmiş adamı ve yaklaşık altı yıl boyunca Halep'in hükümdarı, ardından Abu al-Ma'ali al-Hamdani döneminde Homs valisi olarak burayı inşa etti ve yollarını korudu, ardından dördüncü yüzyılın sonlarında Şam valiliğine geçti."
  id: "Bakjur, mantan orang Qara'uyyah dan penguasa Aleppo selama sekitar enam tahun, kemudian gubernur Homs di bawah Abu al-Ma'ali al-Hamdani, yang membangunnya dan menjaga jalurnya, kemudian pindah ke jabatan gubernur Damaskus pada akhir abad keempat H."
