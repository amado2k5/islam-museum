summary:
  ar: "يوسف بن أيوب بن يوسف بن الحسين بن وهّرة أبو يعقوب الهمذاني، الفقيه العالم الزاهد صاحب المقامات؛ قدم بغداد في صباه فلازم الإمام أبا إسحاق الشيرازي حتى برع في الفقه وسمع بأصبهان وسمرقند ثم زهد في ذلك واشتغل بالعبادة والمجاهدة، وقدم بغداد سنة خمس عشرة وخمسمائة فعُقد له الوعظ بالمدرسة النظامية وصادف قبولاً عظيماً، ثم سكن مرو وخرج إلى هراة {cite:wafayat-ayan}."
  tr: "Yusuf ibn Eyyub ibn Yusuf ibn al-Hüseyin ibn Wahra Ebu Ya'qub al-Hamadhani, hukukçu, alim, münzevi ve makamın ustası; gençliğinde Bağdat'a geldi ve İmam Ebu İshaq el-Şirazi ile birlikte oldu; fıkhih alanında üstün oldu, İsfahan ve Semerkand'dan haber aldı, sonra bunu zahileştirdi ve kendini ibadet ve mücadeleye adadı. 500 Hicri yılında Bağdat'a geldi ve burada Nizamiyya okulunda vaaz vermek üzere görevlendirildi; okul çok beğenildi. Daha sonra Merw'e yerleşti ve Herat'a gitti {kaynak:wafayat-ayan}."
  id: "Yusuf ibn Ayyub ibn Yusuf ibn al-Husayn ibn Wahra Abu Ya'qub al-Hamadhani, seorang ahli hukum, cendekiawan, pertapa, dan ahli maqamat; ia tiba di Baghdad saat muda dan menemani Imam Abu Ishaq al-Shirazi hingga ia unggul dalam bidang hukum, mendengar dari Isfahan dan Samarkand, lalu membahaskan hal ini dan mendedikasikan dirinya pada ibadah serta perjuangan. Ia tiba di Baghdad pada tahun 500 H, di mana ia ditugaskan untuk berkhotbah di sekolah Nizamiyya, yang sangat diterima. Kemudian ia menetap di Marw dan pergi ke Herat {cite:wafayat-ayan}."
