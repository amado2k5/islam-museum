summary:
  ar: "عيسى بن دينار بن واقد، وقيل ابن وهب، أبو محمد القرطبي المالكي، فقيه الأندلس في عصره. ولي قضاء طليطلة للحكم، والشورى بقرطبة، وطاف في طلب الحديث، وله «كتاب الهدية» في عشرة أجزاء. توفي سنة 212هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3135}"
  en: "Isa ibn Dinar ibn Waqid, also given as Ibn Wahb, Abu Muhammad al-Qurtubi, a Maliki jurist, the leading jurist of al-Andalus in his time. He was appointed qadi of Toledo under al-Hakam and head of the consultative council in Cordoba, travelled in search of hadith, and wrote the ten-part Kitab al-Hidaya. He died in 212 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3135}"
