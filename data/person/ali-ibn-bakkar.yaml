summary:
  ar: "أبو الحسن علي بن بكار، زاهد مرابط سكن المصيصة على الثغر، صحب إبراهيم بن أدهم وأبا إسحاق الفزاري ومخلد بن الحسين، وروى الحديث بحسب «حلية الأولياء»."
  en: "Abu al-Hasan Ali ibn Bakkar, an ascetic who lived as a frontier guard at al-Massisa, a companion of Ibrahim ibn Adham, Abu Ishaq al-Fazari and Makhlad ibn al-Husayn, and a transmitter of hadith according to Hilyat al-Awliya."
  ur: "ابو الحسن علی بن بکار ایک زاہد تھے جو سرحد پر مصیصہ میں مرابط رہے۔ وہ ابراہیم بن ادہم، ابو اسحاق فزاری اور مخلد بن حسین کی صحبت میں رہے، اور «حلیۃ الاولیاء» کے مطابق حدیث بھی روایت کی۔"
  es: "Abu al-Hasan Ali ibn Bakkar, un asceta que vivió como guardia fronterizo en al-Massisa, compañero de Ibrahim ibn Adham, Abu Ishaq al-Fazari y Makhlad ibn al-Husayn, y transmisor de hadices según Hilyat al-Awliya."
  fr: "Abu al-Hasan Ali ibn Bakkar, un ascète qui vivait comme garde-frontière à al-Massisa, compagnon d'Ibrahim ibn Adham, Abu Ishaq al-Fazari et Makhlad ibn al-Husayn, et transmetteur de hadith selon Hilyat al-Awliya."
  tr: "Sınırda El-Masisah'ta yaşayan ve sadık bir zühi olan Ebu el-Hasan Ali bin Bakkar, İbrahim bin Adham, Ebu İshaq el-Fazari ve Muhhid bin el-Hüseyin ile birlikte gitti ve 'Hilyat al-Awliya'ya göre hadisler anlattı."
  id: "Abu al-Hasan Ali ibn Bakkar, seorang pertapa dan teguh yang tinggal di Al-Masisah di perbatasan, menemani Ibrahim ibn Adham, Abu Ishaq al-Fazari, dan Mukhlid ibn al-Husayn, serta menceritakan hadits menurut 'Hilyat al-Awliya'."
