summary:
  ar: "بطاقة أولية لعبيد الله بن محمود المعروف بخواجة أحرار، شيخ النقشبندية في ما وراء النهر وسياسي القرن الخامس عشر النافذ في بلاط تيمورية، توفي سنة ١٤٩٠م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ubayd Allah ibn Mahmud known as Khawaja Ahrar, the fifteenth-century Naqshbandi shaykh of Transoxiana and influential figure in the Timurid court, d. 1490; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Ubayd Allah ibn Mahmud conocido como Khawaja Ahrar, el shaykh naqshbandi del siglo XV de Transoxiana y figura influyente en la corte timúrida, fallecido en 1490; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature d'Ubayd Allah ibn Mahmud, connu sous le nom de Khawaja Ahrar, cheikh naqshbandi du XVe siècle de Transoxiane et figure influente à la cour timouride, mort en 1490; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عبید اللہ ابن محمود کے لیے ڈرافٹ کارڈ جسے خواجہ احرار کے نام سے جانا جاتا ہے، ٹرانسکسیانا کے پندرہویں صدی کے نقشبندی شیخ اور تیموری دربار میں بااثر شخصیت، ڈی۔ 1490; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Neqşebendî hanedanının Transoksiana şeyhi ve 15. yüzyılda Timuri sarayında etkili bir siyasetçi olan Ubeyd Allah ibn Mahmud için ön kart; kendisi Nobles'ın sözlüklerinde anılmaktadır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Ubayd Allah ibn Mahmoud, yang dikenal sebagai Khawaja Ahrar, Sheikh dinasti Naqshbandi di Transoxiana dan seorang politikus berpengaruh abad kelima belas di istana Timurid, yang meninggal pada tahun 1490 M; ia disebutkan dalam kamus para tokoh, dan biografinya belum pernah ditinjau di halaman tersebut."
