    note: "Recorded under the SHIA-MAPPING RULE, with the mapping stated. Two independent traditions attest Shia for him personally. (1) The Persian tradition: the Persian Wikipedia article's text places him personally among the Sheikhi lutis of Tabriz — 'he was among the Sheikhi lutis', the city's lutis following two currents, the Sheikhiyya and the Shar'iyya — and the Persian historiography behind it (Kasravi, in the accounts quoted from him) describes his personal Twelver devotion: a banner raised in the name of the Master of the Age, the Twelfth Imam, oaths sworn by Abu'l-Fadl, mourning assemblies for al-Husayn that he himself held, and his self-description as the executor of the Najaf ulama's fatwas. (2) The infobox tradition: the Russian Wikipedia infobox gives his confession for him personally as 'Shia Islam'; the Hebrew infobox and an older English infobox ('Twelver Shi'a Islam') carry the same value and are counted as that one family, not as further sources. MAPPING: 'Shia' attested by both traditions, with the branch-supporting context Twelver throughout — a Sheikhi affiliation (the Sheikhiyya is a Twelver current) and Twelfth-Imam devotion — so the value is recorded shia-twelver. The Encyclopaedia Iranica names no school; it records only his 1894-95 pilgrimage to the Atabat and his defence of the Shi'ite pilgrims at Samarra, practice and context that support but do not carry the attestation."
