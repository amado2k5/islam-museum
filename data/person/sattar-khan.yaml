summary:
  ar: "قائد عسكري للثورة الدستورية الإيرانية (1868–1914) من أذربيجان الإيرانية، قاد دفاع تبريز ضد قوات محمد علي شاه في 1908-09 فنال لقب «سردار ملي» (القائد الوطني)، وجُرح في واقعة حديقة أتابك بطهران سنة 1910 وبقي عاجزًا حتى وفاته، ودُفن في مرقد شاه عبد العظيم بالري."
  en: "Military leader of the Iranian Constitutional Revolution (1868–1914) from Iranian Azerbaijan. He led the defence of Tabriz against Mohammad Ali Shah's forces in 1908-09 and was awarded the title Sardar-e Melli, 'National Commander'; wounded at the Atabak Park incident in Tehran in 1910, he remained disabled until his death and was buried at the Shah-Abdol-Azim shrine in Ray."
  ur: "ایرانی آئینی انقلاب کے عسکری رہنما (1868–1914)، ایرانی آذربائیجان سے؛ انہوں نے 1908-09 میں تبریز کا محمد علی شاہ کی فوجوں سے دفاع کیا اور «سردارِ ملی» کا خطاب پایا؛ 1910 میں تہران کے اتابک پارک واقعے میں زخمی ہو کر عمر بھر معذور رہے اور وفات کے بعد ری کے شاہ عبد العظیم مزار میں دفن ہوئے۔"
