summary:
  ar: "سياسي باكستاني من بلوشستان، شغل منصب رئيس وزراء باكستان المؤقت الثامن والأطول خدمة بين رؤساء الحكومات المؤقتة ⁦(14 أغسطس 2023 – 4 مارس 2024)⁩. عضو مجلس الشيوخ عن بلوشستان منذ 2018، شارك في تأسيس حزب عوامي بلوشستان سنة 2018 واستقال من مقعده ومن الحزب لتولي الحكومة المؤقتة، ثم عاد إلى مجلس الشيوخ في أبريل 2024. وكان قبل ذلك المتحدث الرسمي باسم حكومة بلوشستان (2015–2017)."
  en: "Pakistani politician from Balochistan who served as the eighth and longest-serving caretaker prime minister of Pakistan (14 August 2023 – 4 March 2024). A senator from Balochistan from 2018, he co-founded the Balochistan Awami Party in 2018 and resigned both his Senate seat and the party to head the caretaker government; he returned to the Senate in April 2024. Before national politics he was spokesperson of the Balochistan government (2015–2017)."
  ur: "بلوچستان سے تعلق رکھنے والے پاکستانی سیاست دان، جو 14 اگست 2023ء سے 4 مارچ 2024ء تک پاکستان کے آٹھویں اور سب سے طویل عرصے تک خدمات انجام دینے والے نگران وزیر اعظم رہے۔ 2018ء سے بلوچستان سے سینیٹر، انھوں نے 2018ء میں بلوچستان عوامی پارٹی کی بنیاد رکھنے میں حصہ لیا اور نگران حکومت کی سربراہی کے لیے سینیٹ کی نشست اور جماعت دونوں سے استعفیٰ دیا؛ اپریل 2024ء میں دوبارہ سینیٹ میں واپس آئے۔ اس سے قبل وہ حکومت بلوچستان کے ترجمان ⁦(2015ء–2017ء)⁩ رہے۔"
  es: "Político pakistaní de Baluchistán que se desempeñó como el octavo y más longevo primer ministro interino de Pakistán (14 de agosto de 2023 - 4 de marzo de 2024). Senador por Baluchistán desde 2018, cofundó el Partido Awami de Baluchistán ese mismo año y renunció tanto a su escaño en el Senado como al partido para encabezar el gobierno interino; regresó al Senado en abril de 2024. Antes de dedicarse a la política nacional, fue portavoz del gobierno de Baluchistán (2015-2017)."
  fr: "Homme politique pakistanais originaire du Baloutchistan, il a été le huitième Premier ministre intérimaire du Pakistan, et celui qui a exercé le plus longtemps cette fonction (du 14 août 2023 au 4 mars 2024). Sénateur du Baloutchistan depuis 2018, il a cofondé le Parti Awami du Baloutchistan la même année et a démissionné de son siège au Sénat ainsi que du parti pour prendre la tête du gouvernement intérimaire; il a réintégré le Sénat en avril 2024. Avant de se lancer en politique nationale, il a été porte-parole du gouvernement du Baloutchistan (2015-2017)."
  tr: "Belucistanlı bir Pakistanlı siyasetçi olan Scully, geçici hükümet başkanları arasında Pakistan'ın sekizinci ve en uzun süre görev yapan geçici başbakanı olarak görev yaptı (14 Ağustos 2023 – 4 Mart 2024). 2018'den beri Belucistan Senatosu üyesi olan Sher, 2018'de Belucistan Awami Partisi'ni kurdu, geçici hükümeti devralmak için koltuğundan ve partisinden istifa etti, ardından Nisan 2024'te Senato'ya geri döndü. Bundan önce, Belucistan hükümetinin resmi sözcüsüydü (2015–2017)."
  id: "Seorang politisi Pakistan dari Balochistan, ia menjabat sebagai Perdana Menteri sementara Pakistan kedelapan dan terlama di antara para kepala pemerintahan sementara (14 Agustus 2023 – 4 Maret 2024). Sebagai anggota Senat Balochistan sejak 2018, ia ikut mendirikan Partai Awami Balochistan pada 2018 dan mengundurkan diri dari kursi dan partainya untuk mengambil alih pemerintahan sementara, kemudian kembali ke Senat pada April 2024. Sebelumnya, ia adalah juru bicara resmi pemerintahan Balochistan (2015–2017)."
