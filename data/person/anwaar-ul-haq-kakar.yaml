summary:
  ar: "سياسي باكستاني من بلوشستان، شغل منصب رئيس وزراء باكستان المؤقت الثامن والأطول خدمة بين رؤساء الحكومات المؤقتة (14 أغسطس 2023 – 4 مارس 2024). عضو مجلس الشيوخ عن بلوشستان منذ 2018، شارك في تأسيس حزب عوامي بلوشستان سنة 2018 واستقال من مقعده ومن الحزب لتولي الحكومة المؤقتة، ثم عاد إلى مجلس الشيوخ في أبريل 2024. وكان قبل ذلك المتحدث الرسمي باسم حكومة بلوشستان (2015–2017)."
  en: "Pakistani politician from Balochistan who served as the eighth and longest-serving caretaker prime minister of Pakistan (14 August 2023 – 4 March 2024). A senator from Balochistan from 2018, he co-founded the Balochistan Awami Party in 2018 and resigned both his Senate seat and the party to head the caretaker government; he returned to the Senate in April 2024. Before national politics he was spokesperson of the Balochistan government (2015–2017)."
  ur: "بلوچستان سے تعلق رکھنے والے پاکستانی سیاست دان، جو 14 اگست 2023ء سے 4 مارچ 2024ء تک پاکستان کے آٹھویں اور سب سے طویل عرصے تک خدمات انجام دینے والے نگران وزیر اعظم رہے۔ 2018ء سے بلوچستان سے سینیٹر، انھوں نے 2018ء میں بلوچستان عوامی پارٹی کی بنیاد رکھنے میں حصہ لیا اور نگران حکومت کی سربراہی کے لیے سینیٹ کی نشست اور جماعت دونوں سے استعفیٰ دیا؛ اپریل 2024ء میں دوبارہ سینیٹ میں واپس آئے۔ اس سے قبل وہ حکومت بلوچستان کے ترجمان (2015ء–2017ء) رہے۔"
