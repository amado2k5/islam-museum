summary:
  ar: "الشيخ منصور (ق. 1760 – 13 أبريل 1794)، وُلد باسم أوشورما، إمام وقائد عسكري شيشاني قاد منذ 1785 أول مقاومة منظمة للتوسع الروسي في شمال القوقاز: أباد قوة الكولونيل بييري عند ألدي، وحاصر قيزلار، وظل يقاتل في شركسيا حتى أُسر عند سقوط أنابا سنة 1791، فمات سجينًا في شليسلبورغ. عدّه الإمام شامل سلفًا له وصاحب الفضل في إحياء الإسلام في القوقاز."
  en: "Sheikh Mansur (c. 1760 – 13 April 1794), born Ushurma, was a Chechen imam and military commander who from 1785 led the first organised resistance to Russian expansion in the North Caucasus — destroying Colonel Pieri's column at Aldy, besieging Kizlyar, and fighting on in Circassia until his capture at the fall of Anapa in 1791; he died a prisoner at Shlisselburg. Imam Shamil revered him as a forerunner and credited him with the Muslim revival of the Caucasus."
  ur: "شیخ منصور (ق۔ 1760ء – 13 اپریل 1794ء)، پیدائشی نام اشورما، چیچن امام اور فوجی قائد تھے جنہوں نے 1785ء سے شمالی قفقاز میں روسی توسیع کے خلاف پہلی منظم مزاحمت کی قیادت کی: الدی میں کرنل پیری کے دستے کو نیست و نابود کیا، قزلار کا محاصرہ کیا، اور شرکسیا میں لڑتے رہے حتیٰ کہ 1791ء میں اناپا کے سقوط پر گرفتار ہوئے؛ شلیسلبرگ میں قیدی کی حیثیت سے وفات پائی۔ امام شامل انہیں اپنا پیش رو اور قفقاز میں اسلامی احیاء کا بانی مانتے تھے۔"

