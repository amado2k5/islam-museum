  precision: year
  status: debated
  note: "No birth record exists; the year is inference and tradition. The English article infers c. 1760 from his own statement to his Russian captors in 1791 that he was a little over thirty (Musaev's biography), and one of Wikidata's two birth statements gives 1760 while the other gives June 1762, the value the Urdu article's lead follows. Rival traditions run far earlier — the TDV encyclopedia records researchers giving 1722 and 1748, the Arabic article's infobox gives 1732 while its body gives 1748, and the English and Urdu category sets file him variously under 1732, 1743, 1750 and 1760 births; the earliest of these descend from the eighteenth-century confusion of Mansur with the Dominican Giovanni Battista Boetti, which the English article (after Knysh) treats as a hoax. The record follows c. 1760 as the only reading anchored in the man's own words, with the spread preserved. He was born at Aldy (Aldi) on the Sunzha river in Chechnya, which has no museum place record, so no born_in edge is written. The Hijri year is omitted, since the rival years pair inconsistently."
  sources: [source/wikipedia-sheikh-mansur-en, source/wikipedia-sheikh-mansur-ar, source/wikipedia-sheikh-mansur-ur, source/wikidata-sheikh-mansur, source/tdv-seyh-mansur]

