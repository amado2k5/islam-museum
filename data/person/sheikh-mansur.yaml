faith:
  - value: unknown
    basis: unknown
    note: >-
      His Naqshbandi affiliation is stated in full, because it is
      the attestation this record had to test. Mustafa Aydin's
      entry in the TDV Islam Encyclopedia (2010) asserts it in
      terms of personal initiation, writing that Sheikh Mansur
      "was initiated into the Naqshbandi order in Dagestan"
      (intisap); the Arabic article likewise states that he was
      affiliated with the Naqshbandi tariqa, and the Urdu article
      has him enter a Naqshbandi madrasa in Dagestan, citing
      Schaefer's history; Wikidata files him with a structured
      religion value of Naqshbandi alongside Sunni Islam. Against
      this stands the specialist verdict — the English article,
      citing Michael Kemper's Encyclopaedia of Islam Three entry
      on Chechnya (2012), reports that the affiliation is
      frequently assumed but that there is no evidence of it, and
      Alexander Knysh's Encyclopaedia of Islam entry on Ushurma
      remarks that Mansur lacked the Sufi credentials of later
      Caucasian leaders and apparently any formal religious
      education, contemporary Russian and Ottoman sources
      reporting a shepherd who by some accounts could not read.
      No text read names an initiating shaykh, an ijaza or a
      datable act of initiation; the asserting texts transmit one
      later tradition, and the two encyclopedia treatments that
      examined the primary record reject it. Under the founder
      rulings the doubt is decisive, so settlement is withheld
      and his faith is recorded as unknown. What is documented is
      his practice — from 1784 he preached strict adherence to
      the Sharia and the abandonment of customary law, wine and
      tobacco, and styled himself sheikh and imam of the mountain
      peoples.
    sources: [source/wikipedia-sheikh-mansur-en, source/wikipedia-sheikh-mansur-ar, source/wikipedia-sheikh-mansur-ur, source/wikidata-sheikh-mansur, source/tdv-seyh-mansur]

