summary:
  ar: "بطاقة أولية لبير محمد بن عمر شيخ التيموري، حاكم فتح فرغانة والأمير الجليلي، توفي سنة ١٤٠٩م؛ تذكره كتب التاريخ ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Pir Muhammad ibn Umar Shaikh, the Timurid prince who governed Fergana, d. 1409; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Pir Muhammad ibn Umar Shaikh, el príncipe timúrida que gobernó Fergana, fallecido en 1409; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de recrutement de Pir Muhammad ibn Umar Shaikh, prince timouride qui gouverna Fergana, mort en 1409; la source n'est pas encore vérifiée sur la page."
  ur: "فرغانہ پر حکومت کرنے والے تیموری شہزادے پیر محمد بن عمر شیخ کے لیے کارڈ کا مسودہ، ڈی۔ 1409; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Bir Muhammed bin Ömer için, Fergana fethi hükümdarı ve Fergana fethi hükümdarı ile 1409 yılında ölen Celile prensi için ön kart; tarih kitaplarında hatırlanmaktadır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Bir Muhammad bin Umar, Sheikh Al-Timurid dan penguasa penaklukan Fergana serta pangeran Galilea, yang meninggal pada tahun 1409 M; ia dikenang dalam buku sejarah, dan biografinya belum pernah diulas di halaman."
