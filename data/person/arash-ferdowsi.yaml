summary:
  ar: "أراش فردوسي (وُلد 7 أكتوبر 1985) رجل أعمال أمريكي من أصل إيراني، شارك في تأسيس شركة دروبوكس. وُلد في أوفرلاند بارك بولاية كانساس لأبوين مهاجرين إيرانيين، ودرس الهندسة الكهربائية وعلوم الحاسوب في معهد ماساتشوستس للتقنية، وتركه في فصله الأخير، وأطلق دروبوكس مع درو هيوستن سنة 2007 وشغل منصب مديرها التقني حتى 2016."
  en: "Arash Ferdowsi (born 7 October 1985) is an American entrepreneur of Iranian descent, a co-founder of Dropbox. Born in Overland Park, Kansas, to Iranian immigrant parents, he studied electrical engineering and computer science at the Massachusetts Institute of Technology, left in his final semester, and launched Dropbox with Drew Houston in 2007, serving as its chief technology officer until 2016."
  ur: "آرش فردوسی (پیدائش 7 اکتوبر 1985ء) ایرانی نژاد امریکی کاروباری شخصیت اور ڈراپ باکس کے شریک بانی ہیں۔ وہ اوورلینڈ پارک، کنساس میں ایرانی مہاجر والدین کے گھر پیدا ہوئے، ایم آئی ٹی میں برقی انجینئرنگ و کمپیوٹر سائنس پڑھی، آخری سمسٹر میں ادارہ چھوڑا، اور 2007ء میں ڈریو ہیوسٹن کے ساتھ ڈراپ باکس قائم کی، 2016ء تک اس کے چیف ٹیکنالوجی آفیسر رہے۔"
