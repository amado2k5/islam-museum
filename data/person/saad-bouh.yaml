summary:
  ar: "شيخ صوفي قادري موريتاني (1848-1917)، ابن الشيخ محمد فاضل مؤسس الطريقة الفاضلية والأخ الأصغر للشيخ ماء العينين. صدَّره أبوه في الثامنة عشرة إلى بلاد القبلة (الترارزة) لنشر الفاضلية، فبنى شبكة من الزوايا وصدَّر مئات الشيوخ في أنحاء غرب إفريقيا، وتوسَّط بين الإدارة الفرنسية والحكام المحليين، وكتب «النصيحة» المشهورة إلى أخيه يحضّه فيها على ترك جهاد الفرنسيين — بينما تذكره التراجم العربية مشاركاً في الحملات الجهادية إلى جانب أخيه. توفي في مركزه الدراسي بنمجاط سنة 1917 وخلف عشرات المؤلفات في الفقه والتصوف."
  en: "Mauritanian Qadiri Sufi sheikh (1848–1917), a son of Muhammad Fadil, founder of the Fadiliyya, and the younger brother of Ma al-'Aynayn. Sent by his father at eighteen to carry the Fadiliyya into the Trarza and Senegal, he built a network of zawiyas and consecrated hundreds of sheikhs across West Africa, mediated between the French administration and local rulers, and in his famous Nasiha counselled his brother against waging jihad on France — while the Arabic biographical tradition instead remembers him campaigning beside his brother. He died at his study centre of Nimjat in 1917, leaving dozens of works on fiqh and Sufism."
  ur: "موریطانیہ کے قادری صوفی شیخ (1848ء–1917ء)، سلسلۂ فاضلیہ کے بانی شیخ محمد فاضل کے صاحبزادے اور شیخ ماء العینین کے چھوٹے بھائی۔ والد نے اٹھارہ برس کی عمر میں انھیں فاضلیہ کی تبلیغ کے لیے ترارزہ بھیجا؛ انھوں نے مغربی افریقا میں زاویوں کا جال بچھایا اور سیکڑوں شیوخ کو اجازت دی، فرانسیسی انتظامیہ اور مقامی حکمرانوں کے درمیان ثالثی کی، اور اپنے مشہور «نصیحہ» میں بھائی کو فرانس کے خلاف جہاد سے باز رہنے کی تلقین کی — جبکہ عربی تراجم انھیں بھائی کے ساتھ جہادی مہموں میں شریک بتاتی ہیں۔ 1917ء میں نمجاط کے اپنے علمی مرکز میں وفات پائی اور فقہ و تصوف پر درجنوں کتابیں چھوڑیں۔"

