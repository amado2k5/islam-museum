relations:
  - type: member_of
    target: group/qadiriyya
    note: "Commissioned propagator of the Fadiliyya, the Qadiriyya branch his father Muhammad Fadil founded: at eighteen his father sent him into the Trarza to spread the order, and he made his base first at Touizikt and from 1909 at Nimjat. The French biography records that by 1888 he was recognised as the branch's sole representative in Senegal, and that he consecrated sheikhs authorised to distribute the wird across West Africa — 664 of them in Talibouya Niang's count; the English article describes him at the centre of a network of teachers, schools and zawiyas across the Sahel and Sahara. The same member_of edge, to the same group entity, is used by his brother Ma al-'Aynayn's record and by Sidiyya Baba's for the sister branches."
    sources:
      - source/wikipedia-saad-bouh-ar
      - source/wikipedia-saad-bouh-fr
      - source/wikipedia-saad-buh-en

faith:
  - value: sufi
    basis: documented
    note: "His personal mastership of the Fadiliyya is attested by three independent families: the Arabic biography (his father 'dispatched him to the land of the Qibla, to spread the Fadiliyya', his followers multiplied, and his own works include books of tasawwuf), the English article — resting on Marty (1917) and Robinson (2000) — which calls him a 'Qadiriyyah, Fadiliyya Sufi' heading a network of zawiyas and disciples, and the French biography (Marty 1916; Boubrik 1999; Thilmans), which records his consecration of hundreds of sheikhs authorised to give the Fadiliyya wird. The segment is recorded as sufi on that mastership, following the precedents of person/sidiyya-baba and his brother person/ma-al-aynayn. No source read names a school of law for him: his Nimjat centre taught the Maliki manuals (the Risala, Ibn Ashir, Khalil's Mukhtasar), but a curriculum is not an attestation of the man's own school, so no sunni-maliki segment is recorded."
    sources:
      - source/wikipedia-saad-bouh-ar
      - source/wikipedia-saad-buh-en
      - source/wikipedia-saad-bouh-fr

