summary:
  ar: "شيخ صوفي قادري موريتاني (1848-1917)، ابن الشيخ محمد فاضل مؤسس الطريقة الفاضلية والأخ الأصغر للشيخ ماء العينين. صدَّره أبوه في الثامنة عشرة إلى بلاد القبلة ⁦(الترارزة)⁩ لنشر الفاضلية، فبنى شبكة من الزوايا وصدَّر مئات الشيوخ في أنحاء غرب إفريقيا، وتوسَّط بين الإدارة الفرنسية والحكام المحليين، وكتب «النصيحة» المشهورة إلى أخيه يحضّه فيها على ترك جهاد الفرنسيين — بينما تذكره التراجم العربية مشاركاً في الحملات الجهادية إلى جانب أخيه. توفي في مركزه الدراسي بنمجاط سنة 1917 وخلف عشرات المؤلفات في الفقه والتصوف."
  en: "Mauritanian Qadiri Sufi sheikh (1848–1917), a son of Muhammad Fadil, founder of the Fadiliyya, and the younger brother of Ma al-'Aynayn. Sent by his father at eighteen to carry the Fadiliyya into the Trarza and Senegal, he built a network of zawiyas and consecrated hundreds of sheikhs across West Africa, mediated between the French administration and local rulers, and in his famous Nasiha counselled his brother against waging jihad on France — while the Arabic biographical tradition instead remembers him campaigning beside his brother. He died at his study centre of Nimjat in 1917, leaving dozens of works on fiqh and Sufism."
  ur: "موریطانیہ کے قادری صوفی شیخ ⁦(1848ء–1917ء)⁩، سلسلۂ فاضلیہ کے بانی شیخ محمد فاضل کے صاحبزادے اور شیخ ماء العینین کے چھوٹے بھائی۔ والد نے اٹھارہ برس کی عمر میں انھیں فاضلیہ کی تبلیغ کے لیے ترارزہ بھیجا؛ انھوں نے مغربی افریقا میں زاویوں کا جال بچھایا اور سیکڑوں شیوخ کو اجازت دی، فرانسیسی انتظامیہ اور مقامی حکمرانوں کے درمیان ثالثی کی، اور اپنے مشہور «نصیحہ» میں بھائی کو فرانس کے خلاف جہاد سے باز رہنے کی تلقین کی — جبکہ عربی تراجم انھیں بھائی کے ساتھ جہادی مہموں میں شریک بتاتی ہیں۔ 1917ء میں نمجاط کے اپنے علمی مرکز میں وفات پائی اور فقہ و تصوف پر درجنوں کتابیں چھوڑیں۔"
  es: "El jeque sufí mauritano qadiri (1848-1917), hijo de Muhammad Fadil, fundador de la Fadiliyya, y hermano menor de Ma al-'Aynayn, fue enviado por su padre a los dieciocho años para llevar la Fadiliyya a Trarza y Senegal. Allí construyó una red de zawiyas y consagró a cientos de jeques en África Occidental, medió entre la administración francesa y los gobernantes locales, y en su famosa Nasiha aconsejó a su hermano que no emprendiera la yihad contra Francia; sin embargo, la tradición biográfica árabe lo recuerda haciendo campaña junto a él. Falleció en su centro de estudios de Nimjat en 1917, dejando decenas de obras sobre fiqh y sufismo."
  fr: "Cheikh soufi qadiri mauritanien (1848-1917), fils de Muhammad Fadil, fondateur de la Fadiliyya, et frère cadet de Ma al-'Aynayn. Envoyé par son père à l'âge de dix-huit ans pour implanter la Fadiliyya en Trarza et au Sénégal, il établit un réseau de zawiyas et consacra des centaines de cheikhs à travers l'Afrique de l'Ouest. Il joua également un rôle de médiateur entre l'administration française et les dirigeants locaux, et, dans sa célèbre Nasiha, il conseilla à son frère de ne pas mener le djihad contre la France – tandis que la tradition biographique arabe le présente au contraire comme combattant aux côtés de son frère. Il mourut à Nimjat, son centre d'études, en 1917, laissant derrière lui de nombreux ouvrages sur le fiqh et le soufisme."
  tr: "Fadhili tarikatının kurucusu Şeyh Muhammed Fadil'in oğlu ve Şeyh Ma el-Aynayn'ın küçük kardeşi olan Sufi Şeyh Qadri Moritani'yi (1848-1917) ifade etti. On sekiz yaşında babası onu Fadliyya'yı yayması için Kıble (Trarza) diyarına gönderdi; burada bir zaviye ağı kurdu ve Batı Afrika genelinde yüzlerce şeyh dağıttı, Fransız yönetimi ile yerel yöneticiler arasında arabuluculuk yaptı ve kardeşine Fransız cihadını bırakması için ünlü \"Öğüt\" yazdı—Arap biyografilerinde ise kardeşiyle birlikte cihatçı seferlere katıldığı belirtilir. 1917'de Ben Mjjat'taki çalışma merkezinde öldü ve geride onlarca fıkıh ve tasavvuf eser bıraktı."
  id: "Sufi Sheikh Qadri Mauritani (1848-1917), putra Sheikh Muhammad Fadil, pendiri tarekat Fadhili, dan adik dari Sheikh Ma al-Aynayn. Pada usia delapan belas tahun, ayahnya mengirimnya ke tanah Qibla (Trarza) untuk menyebarkan Fadliyya, di mana ia membangun jaringan zawiya dan mengeluarkan ratusan sheikh di seluruh Afrika Barat, menjadi mediator antara administrasi Prancis dan penguasa lokal, serta menulis \"Nasihat\" terkenal kepada saudaranya yang mendesaknya untuk meninggalkan jihad Prancis—sementara biografi Arab menyebutkan ia ikut serta dalam kampanye jihadis bersama saudaranya. Ia meninggal di pusat studinya di Ben Mjjat pada tahun 1917 dan meninggalkan puluhan karya dalam bidang hukum dan sufisme."

