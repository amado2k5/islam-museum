summary:
  ar: "جاود كريم (وُلد 28 أكتوبر 1979) مهندس برمجيات ورجل أعمال ألماني أمريكي من أصل بنغلاديشي، شارك في تأسيس يوتيوب سنة 2005 وكان أول من رفع مقطع فيديو عليه («أنا في حديقة الحيوان»). وُلد في ميرزه بورغ بألمانيا الشرقية لأب بنغلاديشي وأم ألمانية، وعمل قبل يوتيوب في باي بال حيث صمم أجزاء من نظامها لمكافحة الاحتيال."
  en: "Jawed Karim (born 28 October 1979) is a German and American software engineer and internet entrepreneur of Bangladeshi descent, a co-founder of YouTube in 2005 and the first person to upload a video to it ('Me at the zoo'). Born in Merseburg, East Germany, to a Bangladeshi father and a German mother, he worked at PayPal before YouTube, where he designed core components including its real-time anti-fraud system."
  ur: "جاوید کریم (پیدائش 28 اکتوبر 1979ء) جرمن و امریکی سافٹ ویئر انجینئر اور انٹرنیٹ کاروباری شخصیت ہیں، جو بنگلہ دیشی نژاد ہیں؛ وہ 2005ء میں یوٹیوب کے شریک بانی اور اس پر پہلی ویڈیو اپ لوڈ کرنے والے شخص تھے۔ وہ مشرقی جرمنی کے شہر مرسبرگ میں بنگلہ دیشی والد اور جرمن والدہ کے ہاں پیدا ہوئے اور یوٹیوب سے قبل پے پال میں کام کرتے تھے۔"
