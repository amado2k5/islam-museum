summary:
  ar: "زكريا بن يحيى بن عبد الرحمن بن محمد بن عدي الضبي البصري الساجي، أبو يحيى، محدث البصرة في عصره وحافظ ثقة، له كتاب في «علل الحديث» وكتاب «اختلاف الفقهاء»، وتوفي بالبصرة سنة 307 هـ، 220 إلى 307 هـ عند الزركلي {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 pp. 46-47} {cite:shadharat-dhahab vol. 4 p. 36} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 14 pp. 136-137}."
  en: "Zakariyya ibn Yahya ibn Abd al-Rahman ibn Muhammad ibn Adi al-Dabbi al-Basri al-Saji, Abu Yahya, the hadith scholar of Basra in his time, a trusted hafiz, author of a book on the defects of hadith (Ilal al-Hadith) and of Ikhtilaf al-Fuqaha'; he died at Basra in 307 AH (920 CE), and al-Zirikli prints his years as 220 to 307 AH {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 pp. 46-47} {cite:shadharat-dhahab vol. 4 p. 36} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 14 pp. 136-137}."
  es: "Zakariyya ibn Yahya ibn Abd al-Rahman ibn Muhammad ibn Adi al-Dabbi al-Basri al-Saji, Abu Yahya, el erudito en hadices de Basora en su tiempo, un hafiz confiable, autor de un libro sobre los defectos del hadiz (Ilal al-Hadith) y de Ikhtilaf al-Fuqaha'; murió en Basora en 307 d. H. (920 d. C.), y al-Zirikli imprime sus años entre 220 y 307 d. H. {cita: alam-zirikli-dar-al-ilm-2002 vol. 3 págs. 46-47} {citar: shadharat-dhahab vol. 4p. 36} {citar:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 14 págs. 136-137}."
  fr: "Zakariyya ibn Yahya ibn Abd al-Rahman ibn Muhammad ibn Adi al-Dabbi al-Basri al-Saji, Abu Yahya, l'érudit des hadiths de Bassorah en son temps, un hafiz de confiance, auteur d'un livre sur les défauts du hadith (Ilal al-Hadith) et d'Ikhtilaf al-Fuqaha'; il mourut à Bassorah en 307 AH (920 CE), et al-Zirikli imprime ses années entre 220 et 307 AH {cite:alam-zirikli-dar-al-ilm-2002 vol. 3 pp. 46-47} {cite: shadharat-dhahab vol. 16 heures. 36} {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 14 p. 136-137}."
  ur: "زکریا بن یحییٰ بن عبدالرحمٰن بن محمد بن عدی الدبی البصری الساجی، ابو یحییٰ، اپنے زمانے میں بصرہ کے محدث، ثقہ حافظ، احادیث کے نقائص ⁦(اِلال الحدیث)⁩ اور اختلاف الافضل پر کتاب کے مصنف۔ ان کی وفات 307 ہجری ⁦(920 عیسوی)⁩ میں بصرہ میں ہوئی اور الزرکلی نے اس کے سال 220 تا 307 ہجری لکھے ہیں۔ 3 صفحہ 46-47} {حوالہ: شدارت ذہاب جلد 4ص 36} {حوالہ: وفی-بی-ل-وفایت-سفادی-در-احیا-2000 جلد۔ 14 صفحہ 136-137}۔"
