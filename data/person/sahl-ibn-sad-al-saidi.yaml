summary:
  ar: "صحابي ساعدي يروي عنه حديث «ازهد في الدنيا يحبك الله وازهد فيما في أيدي الناس يحبك الناس» وهو الحديث الحادي والثلاثون من الأربعين النووية، أخرجه ابن ماجه (4102) من رواية أبي حازم عنه، ومن حديثه عند الترمذي (2320) «لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافراً منها شربة». وعنده في مسلم أن «أبا تراب» كان أحب أسماء علي إليه — سماه به النبي وهو يمسح التراب عن ظهره {cite:sahih-muslim 2409}"
  en: "A Sa'idi Companion who transmits 'renounce the world and God will love you; renounce what is in people's hands and people will love you', the thirty-first hadith of al-Nawawi's Forty, transmitted by Ibn Majah (4102) through Abu Hazim from him; his other reports include 'were the world worth a mosquito's wing to God He would not give an unbeliever a drink of it' in al-Tirmidhi (2320)."
