summary:
  ar: "صحابي ساعدي يروي عنه حديث «ازهد في الدنيا يحبك الله وازهد فيما في أيدي الناس يحبك الناس» وهو الحديث الحادي والثلاثون من الأربعين النووية، أخرجه ابن ماجه (4102) من رواية أبي حازم عنه، ومن حديثه عند الترمذي (2320) «لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى كافراً منها شربة». وعنده في مسلم أن «أبا تراب» كان أحب أسماء علي إليه — سماه به النبي وهو يمسح التراب عن ظهره {cite:sahih-muslim 2409}"
  en: "A Sa'idi Companion who transmits 'renounce the world and God will love you; renounce what is in people's hands and people will love you', the thirty-first hadith of al-Nawawi's Forty, transmitted by Ibn Majah (4102) through Abu Hazim from him; his other reports include 'were the world worth a mosquito's wing to God He would not give an unbeliever a drink of it' in al-Tirmidhi (2320)."
  ur: "ساعدی صحابی جن سے «دنیا سے بے رغبت رہو تو اللہ تم سے محبت کرے؛ لوگوں کے ہاتھ کی چیز سے بے رغبت رہو تو لوگ تم سے محبت کریں» کی حدیث منقول ہے۔"
  es: "Un compañero Sa'idi que transmite 'renuncia al mundo y Dios te amará; renuncia a lo que está en manos de la gente y la gente te amará', el trigésimo primer hadiz de los Cuarenta de al-Nawawi, transmitido por Ibn Majah (4102) a través de Abu Hazim de él; sus otros informes incluyen 'si el mundo valiera para Dios el ala de un mosquito, no le daría a un incrédulo ni una gota de él' en al-Tirmidhi (2320)."
  fr: "Un Compagnon Saïdi qui transmet « renoncez au monde et Dieu vous aimera; renoncez à ce qui est entre les mains des gens et les gens vous aimeront », le trente et unième hadith des Quarante d'al-Nawawi, transmis par Ibn Majah (4102) par Abu Hazim de lui; ses autres rapports incluent « si le monde valait une aile de moustique pour Dieu, Il n'en donnerait pas à un incroyant à boire » dans al-Tirmidhi (2320)."
