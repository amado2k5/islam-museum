summary:
  ar: "شيخ ومؤلف مقيم في كندا، أخذ الإجازات في القرآن والحديث والفقه والسيرة عن علماء طرابلس بلبنان، ثم تفرّغ للدعوة والتعليم ويدرّس في مسجد الاعتصام بمدينة لافال. تركز دروسه على السيرة والتفسير وأسماء الله، واشتهر بسلسلة مؤلفة من أربعة مجلدات في السيرة النبوية."
  en: "Canada-based sheikh and author who took ijazas in Qur'an, hadith, fiqh and sirah from scholars of Tripoli, Lebanon, then devoted himself full-time to preaching and teaching at al-I'tissam Mosque in Laval. His lessons centre on the Prophet's biography, tafsir and the divine names, and he is best known for an acclaimed four-volume series on the Prophet's life."
  ur: "کینیڈا مقیم شیخ اور مصنف جنہوں نے طرابلس ⁦(لبنان)⁩ کے علماء سے قرآن، حدیث، فقہ اور سیرت میں اجازات لیں، پھر دعوت و تدریس کو وقف کیا اور لاوال کی مسجد الاعتصام میں پڑھاتے ہیں۔ ان کے دروس سیرت، تفسیر اور اسمائے الٰہی پر مرکوز ہیں اور وہ سیرت نبوی پر چار جلدوں کی مشہور سیریز کے لیے پہچانے جاتے ہیں۔"
