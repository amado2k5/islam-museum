summary:
  ar: "من حفاظ الحديث الرحّالين، قدم بغداد وحدّث بها عن خلق كثير، وهو أول من صنّف المسند بالكوفة، وتوفي سنة 228هـ (842م). وفي تاريخ بغداد (ترجمة 7483): ضعّفه النسائي وقال الجوزجاني ساقط متلوّن ترك حديثه، وقيل اضربوا على حديثه مائة أقلام، ومات في رمضان سنة ثمان وعشرين ومائتين بالعسكر — أول من مات بسامراء من المحدثين المُقْدِمين — وكان لا يخضب {cite:tarikh-baghdad-khatib j.11 p.176-177}."
  en: "Travelling hadith memorist who came to Baghdad, first to compile a musnad in Kufa; died 228 AH (842 CE). Tarikh Baghdad (#7483): al-Nasa'i rated him weak and al-Juzjani 'worthless and fickle'; he died Ramadan 228 at the 'Askar — the first of the muhaddithin who had moved to Samarra to die there — and never dyed his hair {cite:tarikh-baghdad-khatib j.11 p.176-177}."
