summary:
  ar: "رجل دولة أردني من أصل فلسطيني (1894–1956)، وُلد في عكا وشكّل اثنتي عشرة حكومة، وتولى رئاسة وزراء شرق الأردن ثم الأردن أربع مرات بين 1938 و1955 في عهد الملوك عبد الله الأول وطلال والحسين؛ امتدت حكوماته عبر الحرب العالمية الثانية والاستقلال وحرب 1948، وكان رئيسًا لمجلس الأعيان بين 1947 و1951."
  en: "Jordanian statesman of Palestinian origin (1894–1956), born at Acre, who formed twelve governments and served four terms as prime minister of Transjordan and then Jordan between 1938 and 1955, under Kings Abdullah I, Talal and Hussein. His governments spanned the Second World War, Jordanian independence and the 1948 war; he was president of the Senate from 1947 to 1951."
  ur: "فلسطینی نژاد اردنی رجلِ ریاست (1894–1956)، عکہ میں پیدا ہوئے، بارہ حکومتیں تشکیل دیں اور 1938 سے 1955 کے درمیان شاہ عبد اللہ اول، شاہ طلال اور شاہ حسین کے عہد میں چار بار شرق اردن اور پھر اردن کے وزیر اعظم رہے؛ ان کی حکومتیں دوسری جنگ عظیم، اردن کی آزادی اور 1948 کی جنگ پر محیط رہیں، اور وہ 1947 سے 1951 تک مجلس اعیان کے صدر رہے۔"
