summary:
  ar: "عالم وداعية سعودي، وُلد سنة 1956. كان من رموز تيار الصحوة في التسعينيات واعتُقل سنوات، ثم تحوّل إلى خطاب إصلاحي في التسامح والحوار، ومن كتبه «أسئلة الثورة»؛ اعتُقل مجددًا سنة 2017."
  en: "Saudi scholar and preacher, born in 1956. A figure of the 1990s Sahwa movement who spent years in prison, he later moved to a reformist discourse of tolerance and dialogue, authoring As’ilat al-Thawra; he was detained again in 2017."
  ur: "سعودی عالم اور مبلغ، 1956 میں پیدا ہوئے۔ وہ 1990ء کی دہائی کی صحوہ تحریک کے رہنما رہے اور برسوں قید میں گزاری، پھر رواداری اور مکالمے کے اصلاحی خطاب کی طرف مائل ہوئے؛ کتاب «أسئلة الثورة» کے مولف؛ 2017 میں دوبارہ گرفتار ہوئے۔"
  es: "Erudito y predicador saudí, nacido en 1956. Figura destacada del movimiento Sahwa de la década de 1990, pasó años en prisión y posteriormente adoptó un discurso reformista de tolerancia y diálogo, siendo autor de As'ilat al-Thawra; fue detenido de nuevo en 2017."
  fr: "Érudit et prédicateur saoudien, né en 1956. Figure du mouvement Sahwa des années 1990, il a passé des années en prison avant de se tourner vers un discours réformiste de tolérance et de dialogue, et de publier As'ilat al-Thawra; il a été de nouveau arrêté en 2017."
  tr: "1956 doğumlu bir Suudi akademisyen ve vaiz. 1990'larda Uyanış hareketinin sembollerinden biriydi ve yıllarca hapis yattı, ardından hoşgörü ve diyalog üzerine reformist bir söyleme dönüştü. Kitapları arasında 'Devrim Soruları' da var; 2017'de tekrar tutuklandı."
  id: "Seorang cendekiawan dan pengkhotbah Saudi, lahir pada tahun 1956. Ia adalah salah satu simbol gerakan Kebangkitan pada tahun 1990-an dan dipenjara selama bertahun-tahun, kemudian berubah menjadi wacana reformis tentang toleransi dan dialog. Di antara bukunya adalah 'Questions of the Revolution'; ia kembali ditangkap pada tahun 2017."
