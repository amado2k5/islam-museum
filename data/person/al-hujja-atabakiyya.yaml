summary:
  ar: "الحجة الأتابكية امرأة الملك الأشرف موسى بن العادل، تركان بنت الملك عز الدين مسعود بن قطب الدين مودود بن أتابك زنكي — أميرة زنكية تزوجها الأشرف؛ صاحبة المدرسة والتربة بجبل قاسيون بدمشق {cite:shadharat-dhahab p. 207}."
  en: "al-Hujja al-Atabakiyya (d. 640) — the Zengid princess Turkan bint Izz al-Din Mas'ud b. Qutb al-Din Mawdud b. Atabak Zengi, wife of al-Malik al-Ashraf Musa, foundress of a madrasa and turba on Mount Qasyun {cite:shadharat-dhahab p. 207}."
  es: "al-Hujja al-Atabakiyya (m. 640): la princesa zengid Turkan bint Izz al-Din Mas'ud b. Qutb al-Din Mawdud b. Atabak Zengi, esposa de al-Malik al-Ashraf Musa, fundador de una madrasa y turba en el monte Qasyun {cita: shadharat-dhahab p. 207}."
  fr: "al-Hujja al-Atabakiyya (morte en 640) — la princesse zengide Turkan bint Izz al-Din Mas'ud b. Qutb al-Din Mawdud b. Atabak Zengi, épouse d'al-Malik al-Ashraf Musa, fondateur d'une madrasa et d'une turba sur le mont Qasyun {cite: shadharat-dhahab p. 207}."
  ur: "الحجاۃ الاطبکیہ ⁦(متوفی 640)⁩ - زنگد شہزادی ترکان بنت عزالدین مسعود بی۔ قطب الدین مودود اتبک زینگی، المالک الاشرف موسیٰ کی بیوی، کوہ قصیون پر ایک مدرسہ اور تربہ کے بانی 207}۔"
  tr: "El-Hucce el-Atabeg, Kral el-Eşref Musa bin el-Adil'in eşi, Turkan, Kral İzzeddin Mes'ud bin Kutbeddin Mevdud ibn Atabeg Zangi'nin kızı — el-Eşref ile evlendirilen bir Zangid prensesi; Şam'daki Kasioun Dağı'ndaki okulun ve toprağın sahibi {atıf:shadharat-dhahab, s. 207}."
  id: "Al-Hujjah al-Atabeg, istri Raja al-Ashraf Musa ibn al-Adil, Turkan, putri Raja Izz al-Din Mas'ud ibn Qutb al-Din Mawdud ibn Atabeg Zangi — seorang putri Zangid yang dinikah oleh al-Ashraf; pemilik sekolah dan tanah di Gunung Qasioun di Damaskus {cite:shadharat-dhahab, hlm. 207}."
