  ar: "سنان ريس (ت. 1546)، قرصان بربري وقائد بحري عثماني، الرجل الثاني بعد خير الدين بربروسا؛ قاتل في معركة بروزة سنة 1538 وصار اسمه في المراجع الأوروبية مقترنًا بلقب «اليهودي»، وهو لقب متنازع على دلالته حتى اليوم."
