    note: >-
      His personal faith is not settled. A modern tradition, built on
      sixteenth-century Christian references that call him 'the Jew'
      (English state papers of 1533; a Portuguese report of 1528) and
      repeated by Kritzler (2009), holds that he was born to a Sephardic
      Jewish family exiled from Spain or Portugal. Against this, the
      contemporary chronicler López de Gómara explained the epithet
      differently — as marking his escape from Christian ships — and Ottoman
      sources are silent about his origins. The attestation is epithet-based
      and contested, so no religion or school is recorded; FLAGGED for the
      coordinator. Settled jewish/documented by the founder's ruling of 1
      November 2026 (rulings packet #3, 2d: the state-paper tradition is
      preferred over Gómara's counter-reading).
