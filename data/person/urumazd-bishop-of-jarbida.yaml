class: person
label: { ar: "عرماز أسقف جربدة", en: "Urmazd bishop of Jarbida", es: "Urmazd bishop of Jarbida", fr: "Urmazd bishop of Jarbida", ur: "جربیدہ کا ارمازد بشپ" }
summary:
  ar: "أسقف مدينة جربدة من مدن الإفرنجة، أهدى سنة ثمان وعشرين وثلاثمائة إلى الحكم بن عبد الرحمن ولي عهد أبيه صاحب الأندلس كتاباً فيه أسماء ملوك الإفرنجة من قلودية إلى لذريق بن قارله، وجده المسعودي بفسطاط مصر سنة ست وثلاثين وثلاثمائة {cite:muruj-al-dhahab p. 358-359}."
  en: "Bishop of Jarbida (Gerona) among the Franks; in 328 he sent al-Hakam, heir of Abd al-Rahman of al-Andalus, a book with the Frankish regnal list from Qaludiya to Ludhriq ibn Qarla — al-Mas'udi found a copy at Fustat in 336 {cite:muruj-al-dhahab p. 358-359}."
  es: "Obispo de Jarbida (Gerona) entre los francos; en 328 envió a al-Hakam, heredero de Abd al-Rahman de al-Andalus, un libro con la lista real franca desde Qaludiya hasta Ludhriq ibn Qarla — al-Mas'udi encontró una copia en Fustat en 336 {cite:muruj-al-dhahab p. 358-359}."
  fr: "Évêque de Jarbida (Gérone) parmi les Francs; en 328, il envoya à al-Hakam, héritier d'Abd al-Rahman d'al-Andalus, un livre contenant la liste royale franque de Qaludiya à Ludhriq ibn Qarla — al-Mas'udi en trouva une copie à Fustat en 336 {cite:muruj-al-dhahab p. 358-359}."
  ur: "بشپ آف جربیڈا ⁦(جیرونا)⁩ فرینکوں میں؛ 328 میں اس نے الاندلس کے عبدالرحمٰن کے وارث الحکم کو ایک کتاب بھیجی جس میں فرانکی حکومت کی فہرست قلودیہ سے لذریق ابن قرلہ کے پاس تھی- المسعودی نے 336 میں فوستات میں ایک نسخہ پایا۔ 358-359}۔"
