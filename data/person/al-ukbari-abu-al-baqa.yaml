class: person
label: { ar: "أبو البقاء العكبري", en: "Abu al-Baqa' al-Ukbari", fr: "Abu al-Baqa' al-Ukbari", es: "Abu al-Baqa' al-Ukbari", ur: "ابو الباقع العکبری۔" }
summary:
  ar: "أبو البقاء عبد الله بن الحسين بن عبد الله العكبري الضرير النحوي، إمام النحو بالبصرة في عصره وصاحب التبيان في إعراب القرآن واللباب في علل البناء والإعراب؛ توفي سنة ست عشرة وستمائة {cite:kamil-ibn-al-athir p. 399}."
  en: "Abu al-Baqa' Abdallah ibn al-Husayn al-Ukbari — the blind grammarian of Basra, author of al-Tibyan on Qur'anic i'rab and al-Lubab; died 616 {cite:kamil-ibn-al-athir p. 399}."
  fr: "Abu al-Baqa' Abdallah ibn al-Husayn al-Ukbari - le grammairien aveugle de Bassorah, auteur d'al-Tibyan sur le Coran i'rab et al-Lubab ; mort en 616 {cite:kamil-ibn-al-athir p. 399}."
  es: "Abu al-Baqa' Abdallah ibn al-Husayn al-Ukbari, el gramático ciego de Basora, autor de al-Tibyan sobre i'rab y al-Lubab coránicos; murió en 616 {citar:kamil-ibn-al-athir p. 399}."
  ur: "ابو البقع عبداللہ ابن الحسین الاکبری - بصرہ کے نابینا گرامر، قرآنی اعراب اور اللباب پر الطبیان کے مصنف؛ وفات 616 {حوالہ: کامل ابن الاثیر ص۔ 399}۔"
  tr: "Ebu el-Baqa' Abdullah ibn el-Hüseyin ibn Abdullah el-'Ekbari, kör dilbilgicisi, zamanının Basra'da dilbilgisi imamı ve el-Tibyan fi I'rab al-Qur'an wa al-Lubab fi 'İlal el-Bina' ve el-I'rab'ın yazarı; 660 Hicri yılında vefat etti {atıf: kamil-ibn-al-athir s. 399}."
  id: "Abu al-Baqa' Abdullah ibn al-Husayn ibn Abdullah al-'Akbari, seorang ahli tata bahasa buta, imam tata bahasa di Basra pada zamannya, dan penulis al-Tibyan fi I'rab al-Qur'an wa al-Lubab fi 'Ilal al-Bina' wa al-I'rab; ia meninggal pada tahun 660 H {cite:kamil-ibn-al-athir hlm. 399}."
