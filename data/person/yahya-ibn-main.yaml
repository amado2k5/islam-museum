id: person/yahya-ibn-main
class: person
label: { ar: "يحيى بن معين", en: "Yahya ibn Ma'in", es: "Yahya ibn Ma'in", fr: "Yahya ibn Ma'in", ur: "یحییٰ بن معین" }
summary:
  ar: "المحدث الشهيد، أشخصه المأمون سنة ثمان عشرة ضمن السبعة الأوائل فامتحنه بخلق القرآن فأجاب تقية ورده إلى بغداد وكان يقول هو وغيره أجبنا خوفاً من السيف {cite:tarikh-khulafa-minhaj-1434 p. 490}، وعند المسعودي بلغ خمساً وسبعين سنة وأشهراً ومات بالمدينة وقيل سنة ثلاث وثلاثين ومائتين وهو الأكثر {cite:muruj-al-dhahab p. 512}. وعند ابن النديم توفي سنة ثلاث وثلاثين ومائتين وله كتاب التاريخ عمله أصحابه عنه ولم يعمله هو {cite:fihrist-ibn-al-nadim p. 322}. وفي تاريخ بغداد ⁦(ترجمة 7484)⁩: أبو زكريا يحيى بن معين بن عون بن زياد بن بسطام المري من غطفان، مولى الجنيد بن عبد الرحمن المري لا عربي المحض، ولد سنة ثمان وخمسين ومائة في آخر خلافة المنصور، من قرية عقيا قرب الأنبار على اثني عشر فرسخاً من بغداد وكان أبوه كاتباً لعبد الله بن مالك؛ ورث ألف ألف درهم وخمسين ألفاً فأنفقها كلها على الحديث حتى لم يبق له ما يلبسه؛ سمع ابن المبارك وهشيماً وعيسى بن يونس وابن عيينة وغندراً والقطان وابن مهدي ووكيعاً وأبا معاوية، وروى عنه أحمد بن حنبل وأبو خيثمة والدورقيان والصاغاني والعباس الدوري ويعقوب بن شيبة والبخاري وحنبل بن إسحاق وأبو داود. وقال ابن المديني انتهى علم الناس إلى يحيى بن معين، وكان أحمد لا يسميه إلا أبا زكريا ويقول ههنا رجل خلقه الله لهذا الشأن يظهر كذب الكذابين {cite:tarikh-baghdad-khatib j.11 p.177-180}."
  en: "The celebrated traditionist — among the seven first tested at the mihna in 218, dead at Medina aged seventy-five, most reports in 233 {cite:muruj-al-dhahab p. 512}. Ibn al-Khatib's long entry (#7484): Abu Zakariyya b. Ma'in b. 'Awn b. Ziyad b. Bistam al-Murri of Ghatafan — a mawla, not Arab-born, 'a mawla of al-Junayd b. Abd al-Rahman al-Murri'; born 158 in al-Mansur's last year, of 'Aqya near al-Anbar twelve farsakhs from Baghdad where his father was a katib; inherited one million and fifty thousand dirhams and spent it all on hadith 'until nothing remained to wear'; his teachers Ibn al-Mubarak, Hushaym, 'Isa b. Yunus, Ibn 'Uyayna, Ghundar, al-Qattan, Ibn Mahdi, Waki' and Abu Mu'awiya; his students Ahmad, Abu Khaythama, the two Dawraqis, al-Saghani, al-'Abbas al-Duri, Ya'qub b. Shayba, al-Bukhari, Hanbal b. Ishaq and Abu Dawud. Ibn al-Madini: 'men's knowledge ended at Yahya b. Ma'in'; Ahmad called him only 'Abu Zakariyya' — never by name — and said 'God created this man for this matter, to expose the liars' lies' {cite:tarikh-baghdad-khatib j.11 p.177-180}."
  es: "El célebre tradicionalista — entre los siete primeros examinados en la mihna en 218, murió en Medina a los setenta y cinco años, la mayoría de los informes en 233 {cite:muruj-al-dhahab p. 512}. Entrada larga de Ibn al-Khatib (#7484): Abu Zakariyya b. Ma'in b. 'Awn b. Ziyad b. Bistam al-Murri de Ghatafan — un mawla, no nacido en Arabia, 'un mawla de al-Junayd b. Abd al-Rahman al-Murri'; nació en 158 en el último año de al-Mansur, de 'Aqya cerca de al-Anbar doce farsakhs de Bagdad donde su padre era un katib; heredó un millón cincuenta mil dirhams y lo gastó todo en hadiz 'hasta que no le quedó nada que ponerse'; sus maestros Ibn al-Mubarak, Hushaym, 'Isa b. Yunus, Ibn 'Uyayna, Ghundar, al-Qattan, Ibn Mahdi, Waki' y Abu Mu'awiya; sus alumnos Ahmad, Abu Khaythama, los dos Dawraqis, al-Saghani, al-'Abbas al-Duri, Ya'qub b. Shayba, al-Bujari, Hanbal b. Ishaq y Abu Dawud. Ibn al-Madini: 'el conocimiento de los hombres terminó en Yahya b. Principal'; Ahmad lo llamó sólo 'Abu Zakariyya', nunca por su nombre, y dijo: 'Dios creó a este hombre para este asunto, para exponer las mentiras de los mentirosos' {cita:tarikh-baghdad-khatib j.11 p.177-180}."
  fr: "Le célèbre traditionniste — parmi les sept premiers à être testés à la mihna en 218, mourut à Médine à l'âge de soixante-quinze ans, la plupart des sources datant de 233 {cite:muruj-al-dhahab p. 512}. Longue notice d'Ibn al-Khatib (#7484): Abu Zakariyya b. Ma'in b. 'Awn b. Ziyad b. Bistam al-Murri de Ghatafan — un mawla, non né arabe, « un mawla d'al-Junayd b. Abd al-Rahman al-Murri »; né en 158, la dernière année d'al-Mansur, d'Aqya près d'al-Anbar, à douze farsakhs de Bagdad où son père était katib; hérita d'un million cinquante mille dirhams et les dépensa entièrement en hadith « jusqu'à ce qu'il ne lui reste plus rien à porter »; ses professeurs Ibn al-Mubarak, Hushaym, 'Isa b. Yunus, Ibn 'Uyayna, Ghundar, al-Qattan, Ibn Mahdi, Waki' et Abu Mu'awiya; ses étudiants Ahmad, Abu Khaythama, les deux Dawraqis, al-Saghani, al-'Abbas al-Duri, Ya'qub b. Shayba, al-Bukhari, Hanbal b. Ishaq et Abou Dawud. Ibn al-Madini: « la connaissance des hommes prit fin à Yahya b. Principal'; Ahmad l'a appelé seulement « Abu Zakariyya » – jamais par son nom – et a dit: « Dieu a créé cet homme dans ce but, pour dénoncer les mensonges des menteurs » {cite:tarikh-baghdad-khatib j.11 p.177-180}."
  ur: "مشہور روایت دان - 218 میں میہنا میں پہلی بار آزمائے گئے سات افراد میں سے، مدینہ میں 75 سال کی عمر میں انتقال کر گئے، 233 میں سب سے زیادہ رپورٹیں {حوالہ: مروج الذہب ص. 512}۔ ابن الخطیب کا طویل اندراج (#7484): ابو زکریا بن۔ Ma'in b. 'عون بی۔ زیاد بی۔ بسطام المری آف غطفان - ایک مولا، عرب میں پیدا نہیں ہوا، 'الجنید بن کا ایک مولا۔ عبدالرحمن المری'؛ المنصور کے آخری سال 158 میں بغداد سے بارہ فرسخ کے فاصلے پر الانبار کے قریب آقیہ میں پیدا ہوئے جہاں ان کے والد کاتب تھے۔ 10 لاکھ 50 ہزار درہم وراثت میں ملے اور یہ سب کچھ حدیث پر خرچ کیا جب تک کہ پہننے کے لیے کچھ نہ بچا۔ ان کے اساتذہ ابن المبارک، ہشیم، عیسیٰ بن۔ یونس، ابن عیینہ، غندر، القطان، ابن مہدی، وکیع اور ابو معاویہ؛ ان کے شاگرد احمد، ابو خیثمہ، دو دوراقی، الصغانی، العباس الدوری، یعقوب بن۔ شعبہ، البخاری، حنبلی، ج. اسحاق اور ابوداؤد۔ ابن المدینی: مردوں کے علم کا خاتمہ یحییٰ پر ہوا۔ Ma'in'; احمد نے اسے صرف 'ابو زکریا' کہا - کبھی بھی نام سے نہیں - اور کہا کہ 'خدا نے اس آدمی کو اس کام کے لیے پیدا کیا ہے تاکہ جھوٹوں کے جھوٹ کو بے نقاب کیا جائے'۔"
  tr: "Şehit hadis âlimi, el-Memun'un on sekiz Hâsır yılında ilk yedi kişiden biri olarak tanımlayıp Kur'an'ı yaratarak onu sınamıştır. Kendisinin aldatmasına karşılık vererek onu Bağdat'a geri göndererek şöyle dedi: O ve diğerleri kılıç korkusuyla cevap verdiler {atıf:Tarih-Khulafa-minhaj-1434, s. 490}. El-Mes'udi'ye göre, yetmiş beş yaşına ve ayına ulaşmış ve Medine'de ölmüştür; bunun 233 yılında olduğu söylenir; bu yıl en yüksek yıldır {atıf:Muruj-al-Dhahab, s. 512}. İbn el-Nadim'e göre, 233 Hicri yılında ölmüştür ve sahabelerinin onun hakkında yazdığı bir tarih kitabı vardır, ancak kendisi yazmamıştır {atıf:Fihrist-ibn-al-Nadim s. 322}. Bağdat Tarihi'nde (biyografi 7484): Ebu Zekeriye Yahya ibn Ma'in ibn Awn ibn Ziyad ibn Bastam al-Marri, Getafan'dan, al-Junayd ibn Abd al-Rahman al-Marri'nin özgür adamı, saf bir Arap değil, 158 Hicri yılında, el-Mansur'un halifeliğinin sonunda, Bağdat'tan on iki farsakh uzaklıktaki Akiya köyünde doğmuştur. Babası Abdullah ibn Malik'in kâtipiydi; bin elli bin direk miras aldı Hams ve tamamen hadise harcadı; İbn el-Mübarek, Haşima, İsa ibn Yunus, İbn Uyaynah, Ghandra, el-Qattan, İbn Mehdi, Vakiya ve Ebu Muaviye'den haber aldı. Ahmed ibn Hanbal, Ebu Haytame, el-Durqiyan, el-Saghani, el-Abbas el-Duri, Ya'qub bin Şeybe, el-Buhari, Hanbal ibn İshaq ve Ebu Davud'dan haber aldı. İbn el-Madini şöyle dedi: Halkın bilgisi Yahya ibn Ma'in ile sona erdi ve Ahmed ona sadece Ebu Zekeriye dedi ve şöyle dedi: İşte Allah tarafından bu iş için yaratılmış bir adam, yalancıların yalanlarını ortaya çıkarıyor {atıf:Tarikh-baghdad-khatib j.11 s.177-180}."
  id: "Ulama hadis yang gugur, yang diidentifikasi al-Ma'mun pada tahun delapan belas H sebagai salah satu tujuh orang pertama dan mengujinya dengan menciptakan Al-Qur'an. Ia menanggapi penyamarannya dan mengembalikannya ke Baghdad, berkata: Ia dan yang lain menjawab karena takut akan pedang {cite:History-Khulafa-minhaj-1434, hlm. 490}. Menurut al-Mas'udi, ia mencapai tujuh puluh lima tahun dan bulan dan meninggal di Madinah, dan dikatakan pada tahun 233, yang merupakan tahun paling {cite:muruj-al-dhahab, hlm. 512}. Menurut Ibn al-Nadim, ia meninggal pada tahun 233 H, dan ia memiliki buku sejarah yang ditulis oleh para sahabatnya tentang dirinya, tetapi ia sendiri tidak {cite:fihrist-ibn-al-nadim hlm. 322}. Dalam Sejarah Baghdad (biografi 7484): Abu Zakariya Yahya ibn Ma'in ibn Awn ibn Ziyad ibn Bastam al-Marri dari Ghatafan, bekas hamba al-Junayd ibn Abd al-Rahman al-Marri, bukan murni Arab, lahir pada tahun 158 H di akhir kekhalifahan al-Mansur, dari desa Aqiya dekat Anbar, dua belas farsakh dari Baghdad. Ayahnya adalah juru tulis untuk Abdullah ibn Malik; ia mewarisi satu seribu lima puluh ribu dirham dan menghabiskan seluruh waktu untuk hadis sampai ia tidak punya pakaian tersisa; ia mendengar dari Ibn al-Mubarak, Hashima, Isa ibn Yunus, Ibn 'Uyaynah, Ghandra, al-Qattan, Ibn Mahdi, Waki'a, dan Abu Muawiya. Ahmad ibn Hanbal, Abu Khaythamah, al-Durqiyan, al-Saghani, al-Abbas al-Duri, Ya'qub ibn Shaybah, al-Bukhari, Hanbal ibn Ishaq, dan Abu Dawud. Ibn al-Madini berkata: Pengetahuan rakyat berakhir dengan Yahya ibn Ma'in, dan Ahmad hanya memanggilnya Abu Zakariya dan berkata: Inilah seorang manusia yang diciptakan Allah untuk hal ini, mengungkap kebohongan para pembohong {cite:Tarikh-baghdad-khatib j.11 hlm.177-180}."
