class: person
label: { ar: "يحيى بن معين", en: "Yahya ibn Ma'in" }
summary:
  ar: "المحدث الشهيد، أشخصه المأمون سنة ثمان عشرة ضمن السبعة الأوائل فامتحنه بخلق القرآن فأجاب تقية ورده إلى بغداد وكان يقول هو وغيره أجبنا خوفاً من السيف {cite:tarikh-khulafa-minhaj-1434 p. 490}، وعند المسعودي بلغ خمساً وسبعين سنة وأشهراً ومات بالمدينة وقيل سنة ثلاث وثلاثين ومائتين وهو الأكثر {cite:muruj-al-dhahab p. 512}. وعند ابن النديم توفي سنة ثلاث وثلاثين ومائتين وله كتاب التاريخ عمله أصحابه عنه ولم يعمله هو {cite:fihrist-ibn-al-nadim p. 322}. وفي تاريخ بغداد (ترجمة 7484): أبو زكريا يحيى بن معين بن عون بن زياد بن بسطام المري من غطفان، مولى الجنيد بن عبد الرحمن المري لا عربي المحض، ولد سنة ثمان وخمسين ومائة في آخر خلافة المنصور، من قرية عقيا قرب الأنبار على اثني عشر فرسخاً من بغداد وكان أبوه كاتباً لعبد الله بن مالك؛ ورث ألف ألف درهم وخمسين ألفاً فأنفقها كلها على الحديث حتى لم يبق له ما يلبسه؛ سمع ابن المبارك وهشيماً وعيسى بن يونس وابن عيينة وغندراً والقطان وابن مهدي ووكيعاً وأبا معاوية، وروى عنه أحمد بن حنبل وأبو خيثمة والدورقيان والصاغاني والعباس الدوري ويعقوب بن شيبة والبخاري وحنبل بن إسحاق وأبو داود. وقال ابن المديني انتهى علم الناس إلى يحيى بن معين، وكان أحمد لا يسميه إلا أبا زكريا ويقول ههنا رجل خلقه الله لهذا الشأن يظهر كذب الكذابين {cite:tarikh-baghdad-khatib j.11 p.177-180}."
  en: "The celebrated traditionist — among the seven first tested at the mihna in 218, dead at Medina aged seventy-five, most reports in 233 {cite:muruj-al-dhahab p. 512}. Ibn al-Khatib's long entry (#7484): Abu Zakariyya b. Ma'in b. 'Awn b. Ziyad b. Bistam al-Murri of Ghatafan — a mawla, not Arab-born, 'a mawla of al-Junayd b. Abd al-Rahman al-Murri'; born 158 in al-Mansur's last year, of 'Aqya near al-Anbar twelve farsakhs from Baghdad where his father was a katib; inherited one million and fifty thousand dirhams and spent it all on hadith 'until nothing remained to wear'; his teachers Ibn al-Mubarak, Hushaym, 'Isa b. Yunus, Ibn 'Uyayna, Ghundar, al-Qattan, Ibn Mahdi, Waki' and Abu Mu'awiya; his students Ahmad, Abu Khaythama, the two Dawraqis, al-Saghani, al-'Abbas al-Duri, Ya'qub b. Shayba, al-Bukhari, Hanbal b. Ishaq and Abu Dawud. Ibn al-Madini: 'men's knowledge ended at Yahya b. Ma'in'; Ahmad called him only 'Abu Zakariyya' — never by name — and said 'God created this man for this matter, to expose the liars' lies' {cite:tarikh-baghdad-khatib j.11 p.177-180}."
