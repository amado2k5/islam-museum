  ar: "المحدث الشهيد، أشخصه المأمون سنة ثمان عشرة ضمن السبعة الأوائل فامتحنه بخلق القرآن فأجاب تقية ورده إلى بغداد وكان يقول هو وغيره أجبنا خوفاً من السيف {cite:tarikh-khulafa-minhaj-1434 p. 490}، وعند المسعودي بلغ خمساً وسبعين سنة وأشهراً ومات بالمدينة وقيل سنة ثلاث وثلاثين ومائتين وهو الأكثر {cite:muruj-al-dhahab p. 512}.، وعند ابن النديم توفي سنة ثلاث وثلاثين ومائتين وله كتاب التاريخ عمله أصحابه عنه ولم يعمله هو {cite:fihrist-ibn-al-nadim p. 322}"
  en: "The celebrated traditionist — among the seven first tested at the mihna in 218, dead at Medina aged seventy-five, most reports in 233 {cite:muruj-al-dhahab p. 512}."
