id: person/ibn-al-zaghuni
class: person
label: { ar: "ابن الزاغوني" }
names:
  - { value: "أبو الحسن علي بن عبيد الله بن ناصر بن السري الزاغوني الجبلي", kind: full }
summary:
  ar: "شيخ الحنابلة وواعظهم أبو الحسن علي بن عبيد الله الزاغوني؛ ولد في جمادى الأولى سنة خمس وخمسين وأربعمائة وقرأ القرآن بالروايات وطلب الحديث بنفسه وقرأ الفقه على القاضي يعقوب البرزنجي، وكان متقناً في علوم شتى من الأصول والفروع والوعظ والحديث وصنف في ذلك كله: له الإقناع والواضح والخلاف الكبير والمفردات في مجلدين والتخليص في الفرائض والإيضاح في أصول الدين وغرر البيان في أصول الفقه وديوان خطب وتاريخ على السنين ومناسك الحج؛ قال ابن الجوزي صحبته زماناً وكانت له حلقة بالمنصور يناظر فيها يوم الجمعة ثم يعظ، وقال ابن ناصر كان فقيه الوقت؛ توفي يوم الأحد سادس عشر المحرم سنة سبع وعشرين وخمسمائة ودفن بمقبرة الإمام أحمد {cite:shadharat-dhahab p. 560-561}."
  en: "Shaykh and preacher of the Hanbalis, Abu al-Hasan Ali ibn Ubaydallah al-Zaghuni; b. Jumada I 455, read the Qur'an in the readings, sought hadith himself, and read fiqh under qadi Ya'qub al-Barzanji; master of usul, furu', preaching and hadith, and author of al-Iqna', al-Wadih, al-Khilaf al-kabir, the two-volume Mufradat, al-Takhlis on inheritance, al-Idah on usul al-din, Ghurar al-bayan on usul al-fiqh, a diwan of sermons, an annalistic history and a manasik — Ibn al-Jawzi kept his company and he held a Friday circle of munazara then wa'z at al-Mansur, Ibn Nasir calling him 'the jurist of the age'; d. Sunday 16 Muharram 527, buried at Imam Ahmad's cemetery {cite:shadharat-dhahab p. 560-561}."
  es: "el jeque y predicador de los Hanbalis, Abu al-Hasan Ali ibn Ubaydallah al-Zaghuni; b. Jumada I 455, leyó el Corán en las lecturas, buscó hadices él mismo y leyó fiqh bajo el cadí Ya'qub al-Barzanji; maestro de usul, furu', predicación y hadices, y autor de al-Iqna', al-Wadih, al-Khilaf al-kabir, el Mufradat en dos volúmenes, al-Takhlis sobre la herencia, al-Idah sobre usul al-din, Ghurar al-bayan sobre usul al-fiqh, un diwan de sermones, una historia analística y un manasik - Ibn al-Jawzi mantuvo su compañía y celebró un círculo de munazara los viernes y luego wa'z en al-Mansur; Ibn Nasir lo llamó \"el jurista de la época\"; d. Domingo 16 Muharram 527, enterrado en el cementerio del Imam Ahmad {cita: shadharat-dhahab p. 560-561}."
  fr: "Cheikh et prédicateur des Hanbalis, Abu al-Hasan Ali ibn Ubaydallah al-Zaghuni; b. Jumada I 455, a lu le Coran dans les lectures, a recherché le hadith lui-même et a lu le fiqh sous le qadi Ya'qub al-Barzanji; maître de l'usul, du furu', de la prédication et du hadith, et auteur d'al-Iqna', al-Wadih, al-Khilaf al-kabir, du Mufradat en deux volumes, al-Takhlis sur l'héritage, al-Idah sur usul al-din, Ghurar al-bayan sur usul al-fiqh, un diwan de sermons, une histoire annalistique et un manasik — Ibn al-Jawzi a tenu compagnie et il tint un cercle de munazara puis de wa'z le vendredi à al-Mansur, Ibn Nasir l'appelant « le juriste de l'époque »; d. Dimanche 16 Muharram 527, inhumé au cimetière de l'Imam Ahmad {cite: shadharat-dhahab p. 560-561}."
  ur: "حنبلیوں کے شیخ اور مبلغ ابو الحسن علی ابن عبیداللہ الزغنی؛ ب جمادی الثانی 455، قراء ت میں قرآن پڑھا، خود حدیث کی تلاش کی، اور قاضی یعقوب البرزانجی کے تحت فقہ پڑھا۔ اصول، فروع، تبلیغ اور حدیث کے ماہر، اور الاقنا، الوادیث، الخلف الکبیر، دو جلدوں پر مشتمل مفردات، التخلیص پر وراثت، الاضحیٰ پر اصول الدین، ثور البیان پر اصول الفقہ، ایک تاریخ الفقہ، ایک انسان کی تاریخ کے مصنف ہیں۔ ابن الجوزی نے اپنی صحبت برقرار رکھی اور اس نے جمعہ کا ایک حلقہ منذرا منعقد کیا پھر المنصور میں وعظ کیا، ابن ناصر نے اسے 'عمر کا فقیہ' کہا؛ d اتوار 16 محرم 527، امام احمد کے قبرستان میں سپرد خاک 560-561}۔"
  tr: "Hanbalilerin şeyhi ve vaizi Ebu el-Hasan Ali bin Ubeydullah el-Zaghuni, dört yüz elli beş yılında Cumada-evval'de doğdu. Kur'an'ı rivayetlerle birlikte okudu, kendisi hadis aradı ve yargıç Ya'qub al-Barzanji'nin yanında fıkıh çalıştı. Temeller, dallar, vaaz ve hadis gibi çeşitli bilim dallarında bilgiliydi ve bunların hepsinde eserler yazdı: 'Al-İkna', 'Al-Wadih', 'Al-Khilaf al-Kabir', 'Al-Mufradat' adlı iki ciltlik 'Al-Mufradat' adlı eserleri kaleme aldı -Halis fi el-Fera'id, 'İdhah fi Usul al-Din', 'Ghurar al-Bayan fi al-Fiqh, fıkıh ilkeleri üzerine vaazlar ve yıllar ile hac ritüelleri üzerine vaazlar ve tarih derlemesi. İbn el-Cavazi bir zamanlar yoldaş olduğunu ve Cuma günleri münazara yaptığı ve ardından vaaz verdiği bir çember olduğunu söyledi. İbn Nasir ise o dönemin bir hukukçu olduğunu söyledi; 527 Hicri Muharremin on altısı Pazar günü vefat etti ve İmam Ahmed mezarlığına defnedildi {alıntı:Shadharat-Dhahab, s. 560-561}."
  id: "Sheikh dan pengkhotbah Hanbali, Abu al-Hasan Ali ibn Ubayd Allah al-Zaghuni, lahir di Jumada al-Awwal pada tahun empat ratus lima puluh lima. Ia membaca Al-Qur'an dengan riwayat, mencari hadis sendiri, dan mempelajari hukum di bawah Hakim Ya'qub al-Barzanji. Ia menguasai berbagai ilmu termasuk dasar-dasar, cabang, dakwah, dan hadits, serta menulis karya-karya di semua bidang tersebut: ia menulis 'Al-Iqna', 'Al-Wadih', 'Al-Khilaf al-Kabir', 'Al-Mufradat' dalam dua jilid, 'Al-Khafradat' lis fi al-Fara'id, 'Idhah fi Usul al-Din', 'Ghurar al-Bayan fi al-Fiqh, kumpulan khotbah tentang prinsip fiqdensi, serta kumpulan khotbah dan sejarah tentang tahun' serta ritual ziarah. Ibn al-Jawzi mengatakan bahwa ia pernah menjadi teman dan pernah berkumpul dengan al-Mansur di mana ia berdebat pada hari Jumat lalu berkhotbah. Ibn Nasir mengatakan ia adalah seorang ahli hukum pada masa itu; ia meninggal pada hari Minggu, tanggal keenam belas Muharram, 527 H, dan dimakamkan di pemakaman Imam Ahmad {cite:Shadharat-Dhahab, hlm. 560-561}."
