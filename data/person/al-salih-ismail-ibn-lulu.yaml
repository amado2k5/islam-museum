summary:
  ar: "صاحب الموصل بعد أبيه بدر الدين لؤلؤ؛ كان قد سير مع ولده الصالح إسماعيل مدداً لهلاكو سنة خمس وخمسين حين قصد بغداد {cite:shadharat-dhahab p. 278}؛ أخذت التتار الموصل بالخديعة سنة ستين بعد حصار أشهر وبذلوا السيف تسعة أيام وأبقوه أياماً ثم قتلوه وقتلوا ولده علاء الدين الملك {cite:shadharat-dhahab p. 308}."
  en: "Lord of Mosul after Badr al-Din Lu'lu' — the same prince his father had sent with his contingent to Hulagu's Baghdad campaign in 655; when the Tatars took Mosul by ruse in 660 they spared him days, then killed him and his son Ala al-Din {cite:shadharat-dhahab p. 278, 308}."
  fr: "Seigneur de Mossoul après Badr al-Din Lu'lu' - le même prince que son père avait envoyé avec son contingent à la campagne de Bagdad de Hulagu en 655 ; quand les Tatars ont pris Mossoul par ruse en 660 ils lui ont épargné des jours, puis l'ont tué et son fils Ala al-Din {cite:shadharat-dhahab p. 278, 308}."
  es: "Señor de Mosul después de Badr al-Din Lu'lu', el mismo príncipe que su padre había enviado con su contingente a la campaña de Hulagu en Bagdad en 655; cuando los tártaros tomaron Mosul por astucia en 660, le perdonaron la vida durante unos días, luego lo mataron a él y a su hijo Ala al-Din {cita: shadharat-dhahab p. 278, 308}."
  ur: "بدر الدین لولو کے بعد موصل کا رب - وہی شہزادہ جس کے والد نے 655 میں ہلاگو کی بغداد مہم کے لیے اپنے دستے کے ساتھ بھیجا تھا۔ جب تاتاریوں نے 660 میں موصل پر قبضہ کر لیا تو انہوں نے اسے دن بچا لیا، پھر اسے اور اس کے بیٹے علاء الدین کو قتل کر دیا۔ 278، 308}۔"
