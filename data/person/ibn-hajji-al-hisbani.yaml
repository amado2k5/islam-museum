summary:
  ar: "القاضي شهاب الدين أبو العباس أحمد بن حجي الحسباني الدمشقي الأطروش الشافعي، ولد ليلة الأربعاء خامس ذي الحجة سنة ثمان عشرة وثمانمائة، وسمع قبل طرشه على الحافظ ابن حجر والمستدعلاء الدين بن بردس البعالي وغيرهما، وأذن للنعيمي في الرواية عنه وأجازه بكل ما تجوز له روايته؛ توفي يوم الأربعاء سابع رمضان سنة سبع وتسعمائة ودفن بمقبرة باب الفراديس {cite:shadharat-dhahab p. 450}."
  en: "The deaf judge of Damascus, b. 5 Dhu'l-Hijja 818 — before his hearing went he had already listened to Ibn Hajar himself and Ibn Burdis al-Ba'ali; the chronicler al-Nu'aymi was licensed to transmit all he had from him; d. Wednesday 7 Ramadan 907, buried at Bab al-Faradis cemetery {cite:shadharat-dhahab p. 450}."
  es: "El juez sordo de Damasco, n. 5 Dhu'l-Hijja 818 — antes de perder el oído ya había escuchado al propio Ibn Hajar y a Ibn Burdis al-Ba'ali; el cronista al-Nu'aymi recibió autorización para transmitir todo lo que tenía de él; m. miércoles 7 Ramadan 907, enterrado en el cementerio Bab al-Faradis {cite:shadharat-dhahab p. 450}."
  fr: "Le juge sourd de Damas, né le 5 Dhu'l-Hijja 818 — avant de perdre l'ouïe, il avait déjà écouté Ibn Hajar lui-même et Ibn Burdis al-Ba'ali; le chroniqueur al-Nu'aymi fut autorisé à transmettre tout ce qu'il avait de lui; mort le mercredi 7 Ramadan 907, enterré au cimetière de Bab al-Faradis {cite:shadharat-dhahab p. 450}."
  ur: "دمشق کے بہرے جج، بی. 5 ذی الحجہ 818 - سننے سے پہلے وہ خود ابن حجر اور ابن بردیس البعلی کو سن چکے تھے۔ مؤرخین النعیمی کو لائسنس دیا گیا تھا کہ وہ اپنے پاس موجود تمام چیزوں کو منتقل کر سکے۔ d بدھ 7 رمضان 907، باب الفرادیس قبرستان میں سپرد خاک 450}۔"
