summary:
  ar: "القاضي شهاب الدين أبو العباس أحمد بن حجي الحسباني الدمشقي الأطروش الشافعي، ولد ليلة الأربعاء خامس ذي الحجة سنة ثمان عشرة وثمانمائة، وسمع قبل طرشه على الحافظ ابن حجر والمستدعلاء الدين بن بردس البعالي وغيرهما، وأذن للنعيمي في الرواية عنه وأجازه بكل ما تجوز له روايته؛ توفي يوم الأربعاء سابع رمضان سنة سبع وتسعمائة ودفن بمقبرة باب الفراديس {cite:shadharat-dhahab p. 450}."
  en: "The deaf judge of Damascus, b. 5 Dhu'l-Hijja 818 — before his hearing went he had already listened to Ibn Hajar himself and Ibn Burdis al-Ba'ali; the chronicler al-Nu'aymi was licensed to transmit all he had from him; d. Wednesday 7 Ramadan 907, buried at Bab al-Faradis cemetery {cite:shadharat-dhahab p. 450}."
