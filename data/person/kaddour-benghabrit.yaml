summary:
  ar: "عالم وموظف رفيع جزائري (1868-1954) عمل مترجماً ودبلوماسياً لدى الخارجية الفرنسية وفي خدمة سلطان المغرب، وأسس المعهد الإسلامي ومسجد باريس الكبير وكان أول رئيس له (1926-1954)، وعُرف في الحرب العالمية الثانية بحماية اليهود في المسجد وإصدار شهادات هوية مسلمة لهم."
  en: "Algerian scholar and high official (1868-1954) who served France as interpreter and diplomat and the Sultan of Morocco as head of protocol; he founded the Muslim Institute of the Grand Mosque of Paris and was its first rector (1926-1954), and during the Second World War sheltered Jews at the mosque and issued them Muslim identity certificates."
  ur: "الجزائری عالم اور اعلیٰ عہدے دار (1868ء–1954ء) جنہوں نے فرانس کے لیے مترجم و سفارت کار اور سلطانِ مراکش کے لیے رئیسِ پروٹوکول کی خدمات انجام دیں؛ انہوں نے پیرس کی عظیم مسجد کا مسلم انسٹی ٹیوٹ قائم کیا اور اس کے پہلے ریکٹر رہے (1926ء–1954ء)، اور دوسری جنگِ عظیم کے دوران یہودیوں کو مسجد میں پناہ دی اور انہیں مسلمان شناختی سرٹیفکیٹ جاری کیے۔"
