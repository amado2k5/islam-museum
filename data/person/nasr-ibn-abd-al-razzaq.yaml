summary:
  ar: "قاضي القضاة عماد الدين أبو صالح الجيلي الحنبلي، ابن عبد الرزاق بن الشيخ عبد القادر الجيلي؛ درس وأفتى وناظر وبرع في المذهب، وولي القضاء سنة ثلاث وعشرين وعزل بعد أشهر؛ ولاه الظاهر بن الناصر قضاء القضاة بجميع مملكته وقبله بشرط أن يورث ذوي الأرحام، فأرسل إليه عشرة آلاف دينار يوفي بها ديون من في سجنه من المدينين ورد إليه النظر في جميع الوقوف؛ وكان متحرياً في القضاء قوي النفس في الحق عديم المحاباة، يصلي جماعة ويخرج إلى الجامع زاجلاً ويلبس القطن؛ ولما عزله المستنصر أنشد «حمدت الله لما قضى لي بالخلاص من القضاء»؛ صنف إرشاد المبتدين في الفقه وأخرج لنفسه أربعين حديثاً؛ توفي ودفن بتربة الإمام أحمد {cite:shadharat-dhahab p. 161-162}."
  en: "Nasr b. Abd al-Razzaq al-Jili (~563–633) — Abd al-Qadir al-Jilani's grandson and qadi al-qudat of Egypt under al-Zahir and al-Mustansir, accepting office on condition that kin inherit its posts; he used a ten-thousand-dinar caliphal grant to free imprisoned debtors, rode modestly to the mosque, and greeted his dismissal with a verse of thanks; buried at Imam Ahmad's cemetery {cite:shadharat-dhahab p. 161-162}."
  es: "Nasr b. Abd al-Razzaq al-Jili (~563–633) — Nieto de Abd al-Qadir al-Jilani y cadí al-qudat de Egipto bajo al-Zahir y al-Mustansir, aceptó el cargo con la condición de que los parientes heredaran sus puestos; utilizó una concesión califal de diez mil dinares para liberar a deudores encarcelados, cabalgó modestamente a la mezquita y saludó su destitución con un verso de agradecimiento; enterrado en el cementerio del Imam Ahmad {cite:shadharat-dhahab p. 161-162}."
  fr: "Nasr b. Abd al-Razzaq al-Jili (~563–633) — Petit-fils d'Abd al-Qadir al-Jilani et cadi al-qudat d'Égypte sous al-Zahir et al-Mustansir, acceptant le poste à condition que sa famille en hérite; il utilisa une subvention califale de dix mille dinars pour libérer des débiteurs emprisonnés, se rendit modestement à la mosquée et salua son renvoi par un verset de remerciement; enterré au cimetière de l'imam Ahmad {cite:shadharat-dhahab p. 161-162}."
  ur: "نصر بی۔ عبد الرزاق الجیلی (~563–633) - عبد القادر الجیلانی کا پوتا اور مصر کا قاضی القدات الظاہر اور المستنصر کے ماتحت، عہدہ اس شرط پر قبول کرنا کہ رشتہ دار اس کے عہدوں کا وارث ہوں؛ اس نے دس ہزار دینار کی خلیفہ گرانٹ کو قیدی قرض داروں کو آزاد کرنے کے لیے استعمال کیا، مسجد تک معمولی سواری کی، اور شکریہ کی آیت کے ساتھ اپنی برطرفی کا استقبال کیا۔ امام احمد کے قبرستان میں دفن کیا گیا 161-162}۔"
  tr: "Baş Yargıç İmadeddin Ebu Salih el-Cili el-Hanbali, Abd al-Razzaq ibn Şeyh Abdül-Kadır el-Cilli'nin oğlu; eğitim gördü, fetva verdi, münazara yaptı ve okulda başarılı oldu. 23. yılda yargıyı üstlendi ve birkaç ay sonra görevden alındı. El-Zahir bin el-Nasir onu tüm krallıklarının hakimi olarak atadı ve akrabalarını miras alması şartıyla kabul etti. Borç borçlarını ödemesi için ona on bin dinar gönderdi veya hapishanede oldu ve her durumda tekrar göreve iade edildi. Yargıda titizdi, doğruda güçlüydü ve kayırmacılıktan yoksundu. Cemaati birlikte namaz kıvırdı, bir demet içinde camiye çıktı ve pamuk giydi. El-Mustansir onu görevden aldığında, 'Beni yargıdan kurtaran yargı için Allah'a şükürler olsun' dedi. 'İrşad el-Mübtidîn fi fıkıh'ı yazdı ve kendisi için kırk hadis yazdı. Öldü ve İmam Ahmed'in türbesine defnedildi {alıntı::] Shadharat-Dhahab, s. 161-162}."
  id: "Ketua Hakim Imad al-Din Abu Salih al-Jili al-Hanbali, putra Abd al-Razzaq ibn Sheikh Abd al-Qadir al-Jili; ia belajar, mengeluarkan fatwa, berdebat, dan unggul di sekolah. Ia mengambil alih jabatan peradilan pada tahun 23 dan diberhentikan setelah beberapa bulan. Al-Zahir ibn al-Nasir mengangkatnya sebagai hakim di semua kerajaannya dan menerimanya dengan syarat ia mewarisi kerabat. Ia mengirimkan sepuluh ribu dinar untuk melunasi utang berhutang di penjaranya, dan ia diangkat kembali dalam semua kasus. Ia rajin dalam penilaian, teguh dalam kebenaran, dan tanpa pilih kasih. Ia berdoa dalam jamaah, pergi ke masjid dalam ikatan, dan mengenakan kapas. Ketika al-Mustansir memecatnya, ia mengucapkan, 'Aku memuji Allah atas hukuman yang menyelamatkanku dari penghakiman.' Ia menulis 'Irshad al-Mubtideen fiqh' dan menghasilkan empat puluh hadis untuk dirinya sendiri. Ia wafat dan dimakamkan di makam Imam Ahmad {cite:Shadharat-Dhahab, hlm. 161-162}."
