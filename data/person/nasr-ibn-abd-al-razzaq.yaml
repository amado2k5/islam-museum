summary:
  ar: "قاضي القضاة عماد الدين أبو صالح الجيلي الحنبلي، ابن عبد الرزاق بن الشيخ عبد القادر الجيلي؛ درس وأفتى وناظر وبرع في المذهب، وولي القضاء سنة ثلاث وعشرين وعزل بعد أشهر؛ ولاه الظاهر بن الناصر قضاء القضاة بجميع مملكته وقبله بشرط أن يورث ذوي الأرحام، فأرسل إليه عشرة آلاف دينار يوفي بها ديون من في سجنه من المدينين ورد إليه النظر في جميع الوقوف؛ وكان متحرياً في القضاء قوي النفس في الحق عديم المحاباة، يصلي جماعة ويخرج إلى الجامع زاجلاً ويلبس القطن؛ ولما عزله المستنصر أنشد «حمدت الله لما قضى لي بالخلاص من القضاء»؛ صنف إرشاد المبتدين في الفقه وأخرج لنفسه أربعين حديثاً؛ توفي ودفن بتربة الإمام أحمد {cite:shadharat-dhahab p. 161-162}."
  en: "Nasr b. Abd al-Razzaq al-Jili (~563–633) — Abd al-Qadir al-Jilani's grandson and qadi al-qudat of Egypt under al-Zahir and al-Mustansir, accepting office on condition that kin inherit its posts; he used a ten-thousand-dinar caliphal grant to free imprisoned debtors, rode modestly to the mosque, and greeted his dismissal with a verse of thanks; buried at Imam Ahmad's cemetery {cite:shadharat-dhahab p. 161-162}."
