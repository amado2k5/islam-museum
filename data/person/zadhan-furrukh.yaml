summary:
  ar: "رئيس ديوان الخراج بالعراق في عهد الحجاج بن يوسف، وكان يكتب بالفارسية. نقل الديوان صالح بن عبد الرحمن إلى العربية بأمر من الحجاج، وقُتل زاذان بعد ذلك في فتنة عبد الرحمن بن محمد بن الأشعث {cite:khudari-umayyad-state p.356} {cite:khudari-umayyad-state p.361}."
  tr: "Al-Hajjaj ibn Yusuf döneminde Irak'taki Kharaj Diwan'ın başıydı ve Farsça yazdı. Diwan, el-Haccac'ın emriyle Salih ibn Abd al-Rahman tarafından Arapçaya çevrildi ve Zadhan daha sonra Abd al-Rahman ibn Muhammed ibn al-Ash'ath'ın isyanında öldürüldü {cite:Khudari-umayyad-state s.356} {cite:Khudari-umayyad-state s.361}."
  id: "Ia adalah kepala Kharaj Diwan di Irak selama masa pemerintahan Al-Hajjaj ibn Yusuf, dan menulis dalam bahasa Persia. Diwan ini diterjemahkan ke dalam bahasa Arab oleh Saleh ibn Abd al-Rahman atas perintah al-Hajjaj, dan Zadhan kemudian tewas dalam pemberontakan Abd al-Rahman ibn Muhammad ibn al-Ash'ath {cite:Khudari-umayyad-state hlm.356} {cite:Khudari-umayyad-state hlm.361}."
