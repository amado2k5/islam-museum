summary:
  ar: "واعظ أسترالي من أصل لبناني يقيم في سيدني، معروف بخطبه ومحاضراته الحماسية الوجدانية التي لاقت انتشارًا واسعًا بين الشباب المسلم عبر الإنترنت. قدّم محتوى لشبكة «ون باث» وشارك في البرنامج الإذاعي «سيدني دين تيم» والفيلم القصير «الفرصة الأخيرة»، ومن أشهر مقاطعه مقابلته مع علي بنات في «موهوب بالسرطان» لقناة «ليفينغ مسلم»، وتنتشر محاضراته عبر قناته «محاضرات من محمد حبلص»."
  en: "An Australian preacher of Lebanese origin living in Sydney, known for passionate, emotional talks and reminders that reached a wide young Muslim audience online. He produced content for One Path Network, was part of the Sydney Deen Team radio programme and the short film 'Last Chance'; his best-known video is his interview with Ali Banat, 'Gifted with Cancer', for Living Muslim, and his lectures circulate through his 'Lectures From Mohamed Hoblos' channel."
  ur: "لبنانی نژاد آسٹریلوی واعظ جو سڈنی میں مقیم ہیں؛ اپنی پرجوش اور جذباتی تقاریر اور نصیحتوں کے لیے مشہور ہیں جو آن لائن نوجوان مسلمانوں میں وسیع پیمانے پر پھیلیں۔ انہوں نے ون پاتھ نیٹ ورک کے لیے مواد تیار کیا، سڈنی دین ٹیم ریڈیو پروگرام اور مختصر فلم «آخری موقع» میں حصہ لیا؛ ان کی مشہور ترین ویڈیو لیونگ مسلم کے لیے علی بنات سے انٹرویو «کینسر کا تحفہ» ہے۔"
