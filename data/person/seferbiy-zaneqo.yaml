summary:
  ar: "أمير ودبلوماسي وزعيم مقاومة شركسي من قبيلة الناتوخاي. أُرسل رهينة إلى روسيا سنة 1807 فتعلّم في ليسيه ريشيليو في أوديسا، ثم خدم الدولة العثمانية وقاد الوفد الشركسي إلى القسطنطينية سنة 1831، وعُيّن واليا عثمانيا على شركسيا في حرب القرم، وترأس الاتحاد الشركسي في 1859–1860؛ وهو مصمم العلم الوطني الشركسي."
  en: "Circassian (Adyghe) prince, diplomat and resistance leader from the Natukhay. Sent to Russia as a hostage in 1807 and educated at the Richelieu Lyceum in Odessa, he later served the Ottoman Empire, led the 1831 Circassian delegation to Constantinople, was appointed Ottoman governor of Circassia during the Crimean War, and headed the Circassian Confederation in 1859–1860; he designed the Circassian national flag."
  ur: "سرکسی (ادیگے) شہزادہ، سفارت کار اور مزاحمتی رہنما۔ 1807 میں روس کو یرغمال بنا کر بھیجے گئے اور اوڈیسا کے ریشیلیو لائسیم میں تعلیم پائی؛ بعد میں سلطنتِ عثمانیہ کی خدمت کی، 1831 میں سرکسی وفد کی قیادت قسطنطنیہ کی، جنگِ کریمیا میں سرکسیا کے عثمانی والی مقرر ہوئے اور 1859–1860 میں سرکسی کنفیڈریشن کے سربراہ رہے؛ سرکسی قومی پرچم انہی کا طراحی کردہ ہے۔"
