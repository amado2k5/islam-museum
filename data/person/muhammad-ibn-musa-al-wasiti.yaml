  ar: "أبو بكر الواسطي أصله من خراسان من فرغانة وكان يعرف بابن الفرغاني وهو من قدماء أصحاب الجنيد، استوطن مرو؛ قال محمد بن عبد الله الواعظ سمعت أبا بكر بن موسى الفرغاني يقول: ابتليت بزمان ليس فيه آداب الإسلام ولا أخلاق الجاهلية ولا أخلاق ذوي المروءة؛ قال السلمي توفي الواسطي بعد العشرين وثلاثمائة {cite:muntazam-ibn-al-jawzi p. 262}."
  en: "Abu Bakr al-Wasiti of Farghana, among the earliest companions of al-Junayd, resident of Marw; his own complaint survives — 'I am afflicted with an age that has neither the manners of Islam, nor the ethics of the Jahiliyya, nor the code of men of honor.' Al-Sulami places his death after 320 {cite:muntazam-ibn-al-jawzi p. 262}."
