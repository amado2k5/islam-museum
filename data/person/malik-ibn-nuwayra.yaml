summary:
  ar: "رئيس بني حنظلة بن مالك من بني يَربوع بن حنظلة من تميم، سُمّي الجفول لكثرة جفاله لقومه؛ عامل النبي على صدقات بني حنظلة فلما قُبض خلّى ما كان في يده من الفرائض وقال «شأنكم بأموالكم يا بني حنظلة»؛ فأسرته سرية ضرار بن الأزور الأسدي بعد بزاخة وأتى به خالداً فأمر بضرب عنقه وقال لخالد «إني والله ما ارتددت»، وشهد أبو قتادة الأنصاري أن بني حنظلة وضعوا السلاح وأذّنوا، فكان قتله مما عاتب به عمرُ أبا بكر قائلاً «بعثت رجلاً يقتل المسلمين ويعذب بالنار»؛ وقال أخوه متمم لعمر إنه كان يوقد ناره إلى الصبح مخافة أن يأتيه ضيف فلا يعرف مكانه، ووصفه راكباً الفرس الجرور قائداً الجمل الثفال بين المزادتين النضوحين في الليلة القرة."
  en: "Chief of Banu Hanzala ibn Malik of Banu Yarbu' ibn Hanzala of Tamim, nicknamed al-Jaful for the many camels he slaughtered for his people; the Prophet's agent over Banu Hanzala's alms, who on the Prophet's death released what dues were in his hands saying 'see to your own wealth, Banu Hanzala'; a squadron of Dirar ibn al-Azwar al-Asadi captured him after Buzakha and brought him to Khalid, who ordered his neck struck — Malik telling Khalid 'by God I did not apostatize', and Abu Qatada al-Ansari testifying Banu Hanzala had laid down their arms and called the adhan; his killing was among what Umar rebuked Abu Bakr for — 'you sent a man who kills Muslims and tortures with fire'; his brother Mutammim told Umar he used to keep his fire lit till morning lest a guest come and not know its place, describing him riding the strong horse leading the thirsty camel between two brimming water-skins on the cold night."
  es: "Jefe de Banu Hanzala ibn Malik de Banu Yarbu' ibn Hanzala de Tamim, apodado al-Jaful por los muchos camellos que sacrificó para su pueblo; el agente del Profeta sobre las limosnas de Banu Hanzala, quien a la muerte del Profeta entregó lo que tenía en sus manos diciendo 'cuida de tu propia riqueza, Banu Hanzala'; un escuadrón de Dirar ibn al-Azwar al-Asadi lo capturó después de Buzakha y lo llevó ante Khalid, quien ordenó que le cortaran el cuello; Malik le dijo a Khalid 'por Dios, no aposté', y Abu Qatada al-Ansari testificó que Banu Hanzala había depuesto las armas y llamado al adhan; su asesinato fue uno de los motivos por los que Umar reprendió a Abu Bakr: 'enviaste a un hombre que mata musulmanes y tortura con fuego'; Su hermano Mutammim le contó a Umar que solía mantener el fuego encendido hasta la mañana para que ningún invitado llegara y no supiera dónde estaba, describiéndolo cabalgando sobre el fuerte caballo que guiaba al sediento camello entre dos odres de agua rebosantes en la fría noche."
  fr: "Chef des Banu Hanzala, ibn Malik de Banu Yarbu' ibn Hanzala de Tamim, surnommé al-Jaful pour les nombreux chameaux qu'il a sacrifiés pour son peuple; agent du Prophète pour les aumônes des Banu Hanzala, qui, à la mort du Prophète, a distribué les sommes qui lui étaient dues en disant: « Occupez-vous de vos propres biens, Banu Hanzala »; une escadrille de Dirar ibn al-Azwar al-Asadi le captura après Buzakha et l'amena à Khalid, qui ordonna qu'on lui tranche la gorge — Malik disant à Khalid: « Par Dieu, je n'ai pas apostasié », et Abu Qatada al-Ansari témoigna que les Banu Hanzala avaient déposé les armes et appelé à l'adhan; son meurtre figurait parmi les reproches qu'Umar a adressés à Abu Bakr — « tu as envoyé un homme qui tue les musulmans et torture par le feu »; Son frère Mutammim raconta à Umar qu'il avait l'habitude de laisser son feu allumé jusqu'au matin de peur qu'un invité ne vienne et ne sache pas où il se trouvait, le décrivant chevauchant le cheval robuste menant le chameau assoiffé entre deux outres d'eau débordantes par la nuit froide."
  ur: "بنو حنظلہ بن مالک بنو یربو بن حنظلہ بنو تمیم کے سردار، جن کو اپنے لوگوں کے لیے ذبح کیے گئے بہت سے اونٹوں کی وجہ سے الجافل کہا جاتا ہے۔ بنو حنظلہ کے صدقات پر نبی کا ایجنٹ، جس نے رسول اللہ کی وفات پر ان کے ہاتھ میں کیا واجبات تھے یہ کہہ کر جاری کر دیا کہ بنو حنظلہ اپنے مال کو دیکھو۔ بزخہ کے بعد دیرار بن الازور الاسدی کا ایک دستہ اسے پکڑ کر خالد کے پاس لے آیا، جس نے اس کی گردن مارنے کا حکم دیا - مالک نے خالد سے کہا 'خدا کی قسم میں نے مرتد نہیں کیا'، اور ابو قتادہ الانصاری بنو حنظلہ کی گواہی دیتے ہوئے اپنے ہتھیار رکھ کر اذان دی تھی۔ اس کا قتل ان میں سے تھا جس کے لیے عمر نے ابوبکر کو ڈانٹا تھا - 'تم نے ایک شخص کو بھیجا جو مسلمانوں کو قتل کرتا ہے اور آگ سے اذیت دیتا ہے'۔ اس کے بھائی مطمم نے عمر سے کہا کہ وہ صبح تک آگ جلاتے رہتے تھے کہیں ایسا نہ ہو کہ کوئی مہمان آئے اور اسے اس کی جگہ کا پتہ نہ چلے، اس کا بیان ہے کہ وہ مضبوط گھوڑے پر سوار ہو کر پیاسے اونٹ کو سردی کی رات میں پانی کی دو کھالوں کے درمیان لے جاتا تھا۔"
  tr: "Banu Hanzala ibn Malik'in Banu Yarbu' ibn Hanzala Tamim'den reisi, halkı hakkında büyük bilgisizliği nedeniyle El-Ceful olarak anılır; Peygamber'in Banu Hanzala için verdiği sadakaların mütevellisiydi. Vefat ettiğinde, sahip olduğu mirası bıraktı ve dedi ki, 'İşin servetinle, Banu Hanzala.' Ailesi Dhirar ibn el-Ezver el-Asadiyi'yi bir savaştan sonra yakalayıp Halid'e getirdi; Halid, başının kesilmesini emretti ve Halid'e, 'Allah'a yemin ederim, ben dinden dönmedim.' dedi. Ebu Katadah el-Ensari, Banu Hanzela'nın silahlarını bırakıp izin verdiğini, bu yüzden onu öldürmenin suçlamalar arasında olduğunu ifade etti Ömer Ebu Bekir dedi ki, \"Müslümanları öldürüp ateşle işkence etmek için bir adam gönderdim\"; kardeşi Tammum, Ömer'e sabaha kadar ateşini yakacağını, misafirin gelip nerede olduğunu bilmeyeceğinden korktuğunu söyledi. Onu şehrin gecesi devam eden iki açık artırma arasında develeri sürükleyerek at sürerken anlattı."
  id: "Kepala Banu Hanzala ibn Malik dari Banu Yarbu' ibn Hanzala dari Tamim, disebut Al-Jaful karena ketidaktahuannya yang besar terhadap rakyatnya; ia adalah wali sedekah Nabi untuk Banu Hanzala. Ketika ia wafat, ia meninggalkan warisan yang dimilikinya dan berkata, 'Urusanmu adalah dengan kekayaanmu, Banu Hanzala.' Keluarganya menangkap Dhirar ibn al-Azwar al-Asadi setelah pertempuran dan membawanya kepada Khalid, yang memerintahkan pemenggalannya dipukul dan berkata kepada Khalid, 'Demi Allah, aku tidak murtad.' Abu Qatadah al-Ansari bersaksi bahwa Banu Hanzala meletakkan senjata mereka dan memberi izin, sehingga membunuhnya termasuk tuduhan Umar Abu Bakr berkata, \"Aku mengirim seorang pria untuk membunuh Muslim dan menyiksa mereka dengan api\"; saudaranya Tammum mengatakan kepada Umar bahwa ia akan menyalakan apinya hingga pagi karena takut ada tamu datang tanpa tahu keberadaannya. Ia menggambarkan Umar menunggang kuda dengan mengenakan drag, memimpin unta di antara dua lelang yang sedang berlangsung pada malam kota."
