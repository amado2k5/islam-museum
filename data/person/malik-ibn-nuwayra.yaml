summary:
  ar: "رئيس بني حنظلة بن مالك من بني يَربوع بن حنظلة من تميم، سُمّي الجفول لكثرة جفاله لقومه؛ عامل النبي على صدقات بني حنظلة فلما قُبض خلّى ما كان في يده من الفرائض وقال «شأنكم بأموالكم يا بني حنظلة»؛ فأسرته سرية ضرار بن الأزور الأسدي بعد بزاخة وأتى به خالداً فأمر بضرب عنقه وقال لخالد «إني والله ما ارتددت»، وشهد أبو قتادة الأنصاري أن بني حنظلة وضعوا السلاح وأذّنوا، فكان قتله مما عاتب به عمرُ أبا بكر قائلاً «بعثت رجلاً يقتل المسلمين ويعذب بالنار»؛ وقال أخوه متمم لعمر إنه كان يوقد ناره إلى الصبح مخافة أن يأتيه ضيف فلا يعرف مكانه، ووصفه راكباً الفرس الجرور قائداً الجمل الثفال بين المزادتين النضوحين في الليلة القرة."
  en: "Chief of Banu Hanzala ibn Malik of Banu Yarbu' ibn Hanzala of Tamim, nicknamed al-Jaful for the many camels he slaughtered for his people; the Prophet's agent over Banu Hanzala's alms, who on the Prophet's death released what dues were in his hands saying 'see to your own wealth, Banu Hanzala'; a squadron of Dirar ibn al-Azwar al-Asadi captured him after Buzakha and brought him to Khalid, who ordered his neck struck — Malik telling Khalid 'by God I did not apostatize', and Abu Qatada al-Ansari testifying Banu Hanzala had laid down their arms and called the adhan; his killing was among what Umar rebuked Abu Bakr for — 'you sent a man who kills Muslims and tortures with fire'; his brother Mutammim told Umar he used to keep his fire lit till morning lest a guest come and not know its place, describing him riding the strong horse leading the thirsty camel between two brimming water-skins on the cold night."
