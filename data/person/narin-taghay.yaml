summary:
  ar: "أمير وصفه الخشاب بالجرأة والغدر والطموح الذي لا حدّ له {cite:jami-al-tawarikh-khashshab-1960 p. 87}. دبّر مع أتباعه اغتيال غياث الدين بن رشيد الدين بعد أن لم تنجح وشايته لدى السلطان {cite:jami-al-tawarikh-khashshab-1960 p. 87}، فذهب إلى منزل الوزير ومعه سلاح مخبأ في ثيابه، فجرّده أخو الوزير من سلاحه عند الباب {cite:jami-al-tawarikh-khashshab-1960 p. 88}. وعدهُ الوزير بالتأييد، ثم ذهب إلى السلطان أبي سعيد وأخبره، فأمر بالقبض عليه {cite:jami-al-tawarikh-khashshab-1960 p. 88}، وقُبض عليه بعد أن فرّ، وأُحضر إلى القصر ولقي الحكم الذي يستحقه {cite:jami-al-tawarikh-khashshab-1960 p. 89}."
  en: "An amir whom the introduction describes as bold, treacherous and boundlessly ambitious {cite:jami-al-tawarikh-khashshab-1960 p. 87}. He planned with his followers to kill Ghiyath al-Din, son of Rashid al-Din, after a denunciation to the Sultan had failed {cite:jami-al-tawarikh-khashshab-1960 p. 87}. He went to the wazir's house with a weapon hidden in his clothes, but the wazir's brother took the weapon from him at the door {cite:jami-al-tawarikh-khashshab-1960 p. 88}. The wazir promised him support and then took the matter to Abu Sa'id, who ordered his arrest {cite:jami-al-tawarikh-khashshab-1960 p. 88}. He was caught after fleeing and brought to the palace {cite:jami-al-tawarikh-khashshab-1960 p. 89}."
  ur: "ایک امیر جنہیں خشاب نے دلیر، غدار اور لامحدود جاہ پسند بتایا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 87}۔ انہوں نے غیاث الدین بن رشید الدین کے قتل کی سازش کی {cite:jami-al-tawarikh-khashshab-1960 p. 87}، مگر ہتھیار دروازے پر چھین لیا گیا {cite:jami-al-tawarikh-khashshab-1960 p. 88}۔ ابوسعید کے حکم پر گرفتار ہوئے {cite:jami-al-tawarikh-khashshab-1960 p. 88}۔"
  fr: "Un émir que l'introduction décrit comme audacieux, traître et d'une ambition sans limites {cite:jami-al-tawarikh-khashshab-1960 p. 87}. Après l'échec d'une dénonciation auprès du sultan, il prépara avec ses partisans le meurtre de Ghiyath al-Din, fils de Rashid al-Din {cite:jami-al-tawarikh-khashshab-1960 p. 87}. Il se rendit chez le vizir avec une arme cachée dans ses vêtements, mais le frère du vizir la lui prit à la porte {cite:jami-al-tawarikh-khashshab-1960 p. 88}. Le vizir porta l'affaire à Abu Sa'id, qui ordonna son arrestation {cite:jami-al-tawarikh-khashshab-1960 p. 88}. Il fut arrêté après avoir tenté de fuir {cite:jami-al-tawarikh-khashshab-1960 p. 89}."
  es: "Un emir que la introducción describe como audaz, traidor y de ambición sin límites {cite:jami-al-tawarikh-khashshab-1960 p. 87}. Tras el fracaso de una denuncia ante el sultán, planeó con sus seguidores el asesinato de Ghiyath al-Din, hijo de Rashid al-Din {cite:jami-al-tawarikh-khashshab-1960 p. 87}. Fue a casa del visir con un arma oculta en la ropa, pero el hermano del visir se la quitó en la puerta {cite:jami-al-tawarikh-khashshab-1960 p. 88}. El visir llevó el asunto a Abu Sa'id, quien ordenó su arresto {cite:jami-al-tawarikh-khashshab-1960 p. 88}. Fue capturado tras intentar huir {cite:jami-al-tawarikh-khashshab-1960 p. 89}."
