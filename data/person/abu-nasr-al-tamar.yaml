summary:
  ar: "عبد الملك بن عبد العزيز القشيري النسوي الدقيقي التمار الزاهد، أبو نصر التمار، محدث روى عن حماد بن سلمة وروى عنه مسلم، ويذكر الصفدي وابن العماد وفاته سنة 228 هـ، وقال ابن العماد إنه الزاهد ببغداد."
  en: "Abd al-Malik ibn Abd al-Aziz al-Qushayri al-Nasawi al-Daqiqi al-Tammar, the ascetic known as Abu Nasr al-Tammar, a hadith transmitter from Hammad ibn Salama on whom Muslim drew; al-Safadi and Ibn al-Imad give his death in 228 AH, and Ibn al-Imad calls him the ascetic in Baghdad."
  fr: "Abd al-Malik ibn Abd al-Aziz al-Qushayri al-Nasawi al-Daqiqi al-Tammar, l'ascète connu sous le nom d'Abu Nasr al-Tammar, transmetteur de hadith d'après Hammad ibn Salama, auquel Muslim puisa ; al-Safadi et Ibn al-Imad donnent sa mort en 228 H, et Ibn al-Imad l'appelle l'ascète de Bagdad."
  es: "Abd al-Malik ibn Abd al-Aziz al-Qushayri al-Nasawi al-Daqiqi al-Tammar, el asceta conocido como Abu Nasr al-Tammar, un transmisor de hadices de Hammad ibn Salama en quien Muslim se basó; al-Safadi e Ibn al-Imad dan su muerte en 228 AH, e Ibn al-Imad lo llama el asceta de Bagdad."
