summary:
  ar: "عبد الرحمن بن محمد بن أحمد الشربيني، فقيه شافعي مصري، ولي مشيخة الجامع الأزهر سنة 1322-1324 هـ، وتوفي بالقاهرة. من تصانيفه «حاشية على شرح بهجة الطلاب» في فروع الفقه الشافعي، و«تقرير على شرح جمع الجوامع» في الأصول، و«تقرير على شرح تلخيص المفتاح» في البلاغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1628}"
  en: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, an Egyptian Shafi'i jurist who was Shaykh of al-Azhar from 1322 to 1324 AH and died in Cairo. His works include a gloss on the commentary on Bahjat al-tullab in Shafi'i law, a report on the commentary on Jam' al-jawami' in usul, and a report on the commentary on Talkhis al-miftah in rhetoric. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1628}"
  fr: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, juriste shafi'ite égyptien qui fut cheikh d'al-Azhar de 1322 à 1324 H et mourut au Caire. Ses œuvres comprennent une glose sur le commentaire de la Bahjat al-tullab en droit shafi'ite, un exposé sur le commentaire du Jam' al-jawami' en fondements du droit, et un exposé sur le commentaire du Talkhis al-miftah en rhétorique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1628}"
  es: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, jurista egipcio shafi'í, fue jeque de al-Azhar entre 1322 y 1324 AH y falleció en El Cairo. Entre sus obras destacan una glosa sobre el comentario a Bahjat al-tullab en derecho shafi'í, un informe sobre el comentario a Jam' al-jawami' en usul y un informe sobre el comentario a Talkhis al-miftah en retórica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1628}"
