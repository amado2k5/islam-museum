summary:
  ar: "عبد الرحمن بن محمد بن أحمد الشربيني، فقيه شافعي مصري، ولي مشيخة الجامع الأزهر سنة 1322-1324 هـ، وتوفي بالقاهرة. من تصانيفه «حاشية على شرح بهجة الطلاب» في فروع الفقه الشافعي، و«تقرير على شرح جمع الجوامع» في الأصول، و«تقرير على شرح تلخيص المفتاح» في البلاغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1628}"
  en: "Abd al-Rahman ibn Muhammad ibn Ahmad al-Sharbini, an Egyptian Shafi'i jurist who was Shaykh of al-Azhar from 1322 to 1324 AH and died in Cairo. His works include a gloss on the commentary on Bahjat al-tullab in Shafi'i law, a report on the commentary on Jam' al-jawami' in usul, and a report on the commentary on Talkhis al-miftah in rhetoric. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1628}"
