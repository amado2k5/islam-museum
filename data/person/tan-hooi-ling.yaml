summary:
  ar: "تان هوي لينغ (واسمها الصيني تشين هويلينغ) سيدة أعمال ماليزية المولد سنغافورية، شاركت في تأسيس شركة غراب وكانت مديرتها التشغيلية؛ نشأت في كوالالمبور وبيتالينغ جايا لأب مهندس مدني وأم سمسارة، ودرست الهندسة الميكانيكية في جامعة باث، وعملت في ماكينزي آند كومباني التي رعت ماجستيرها في إدارة الأعمال في كلية هارفارد للأعمال، حيث كتبت مع زميلها أنتوني تان — ولا قرابة بينهما رغم تشابه اللقب — خطة العمل التي صارت مايتكسي سنة 2012، ثم عادت إلى غراب بدوام كامل سنة 2015 وتنحت عن أدوارها التشغيلية بنهاية 2023."
  en: "Tan Hooi Ling (Chinese name Chen Huiling) is a Malaysian-born Singaporean businesswoman, co-founder of Grab and its chief operating officer; raised in Kuala Lumpur and Petaling Jaya to a civil-engineer father and a remisier mother, she read mechanical engineering at the University of Bath, worked at McKinsey & Company, which sponsored her Harvard Business School MBA, where she and her classmate Anthony Tan — no relation, despite the shared surname — wrote the business plan that became MyTeksi in 2012; she returned to Grab full-time in 2015 and stepped down from her operational roles at the end of 2023."
  ur: "ٹان ہوئی لنگ (چینی نام چن ہوئی لنگ) ملائیشیا میں پیدا ہونے والی سنگاپوری کاروباری خاتون ہیں، گریب کی شریک بانی اور اس کی چیف آپریٹنگ آفیسر رہیں؛ کوالالمپور و پیٹالنگ جایا میں ایک سول انجینئر والد اور دلال والدہ کے ہاں پرورش پائی، باتھ یونیورسٹی سے میکانیکل انجینئرنگ پڑھی، میکنزی اینڈ کمپنی میں کام کیا جس نے ان کی ہارورڈ بزنس اسکول ایم بی اے کی کفالت کی، جہاں انھوں نے اپنے ہم جماعت انتھونی ٹان — مشترکہ خاندانی نام کے باوجود جن سے ان کا کوئی رشتہ نہیں — کے ساتھ وہ کاروباری منصوبہ لکھا جو 2012 میں مائی ٹیکسی بنا؛ 2015 میں وہ مستقل طور پر گریب واپس آئیں اور 2023 کے اختتام پر عملی کرداروں سے الگ ہو گئیں۔"
