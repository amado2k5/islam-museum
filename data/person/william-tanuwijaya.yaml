summary:
  ar: "ويليام تانوويجايا (وُلد في 11 تشرين الثاني 1981 في بيماتانغسيانتار بشمال سومطرة) رائد أعمال إندونيسي، شارك في تأسيس شركة التجارة الإلكترونية توكوبيديا التي أُطلقت سنة 2009؛ عمل ليالي كاملة حارسًا في مقهى إنترنت ليمول دراسته في جامعة بينوس بعد إصابة أبيه بالسرطان، وقاد توكوبيديا رئيسًا لمجلس إدارتها ورئيسًا تنفيذيًا ثم شريكًا في رئاسة مجموعة غوتو بعد اندماج 2021، ونال وسام ساتيالانكانا ويرا كاريا سنة 2019 ومثل إندونيسيا قائدًا عالميًا شابًا في المنتدى الاقتصادي العالمي."
  en: "William Tanuwijaya (born 11 November 1981 in Pematangsiantar, North Sumatra) is an Indonesian entrepreneur, co-founder of the e-commerce company Tokopedia, launched in 2009; he worked twelve-hour nights in an internet cafe to pay his way through BINUS University after his father was diagnosed with cancer, led Tokopedia as chairman and CEO and then as co-chairman of the GoTo group after the 2021 merger, received the Satyalancana Wira Karya in 2019, and has represented Indonesia as a Young Global Leader at the World Economic Forum."
  ur: "ولیم تانووجایا (پیدائش 11 نومبر 1981، پیماتانگسیانتار، شمالی سماٹرا) انڈونیشیائی کاروباری ہیں، 2009 میں شروع ہونے والی ای کامرس کمپنی ٹوکوپیڈیا کے شریک بانی؛ والد کی سرطان میں مبتلا ہونے کے بعد انھوں نے بینوس یونیورسٹی کی فیس کے لیے انٹرنیٹ کیفے میں بارہ گھنٹے کی رات کی نوکری کی، ٹوکوپیڈیا کی چیئرمین و چیف ایگزیکٹو کے طور پر قیادت کی اور 2021 کے انضمام کے بعد گوٹو گروپ کے شریک چیئرمین رہے، 2019 میں انھیں ساتیالانچانا ویرا کاریا ملا اور عالمی اقتصادی فورم میں انڈونیشیا کی نوجوان عالمی رہنما کے طور پر نمائندگی کی۔"
