summary:
  ar: "بطاقة أولية لأحمد باشا الهرسكي، الصدر الأعظم العثماني من أصل بوسني هرسلي الذي تولى الصدارة خمس مرات في عهدي بايزيد الثاني وسليم الأول وتوفي سنة ١٥١٧م؛ تذكر كتب التاريخ العثماني ترجمته ولم تُراجع على الصفحة بعد."
  en: "Draft card for Hersekzade Ahmed Pasha, the Bosnian-Herzegovinian born five-time Ottoman grand vizier under Bayezid II and Selim I, d. 1517; Ottoman chronicle sources name him but the entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Hersekzade Ahmed Pasha, el gran visir otomano nacido en Bosnia-Herzegovina que ocupó el cargo en cinco ocasiones bajo los reinados de Bayezid II y Selim I, fallecido en 1517; las crónicas otomanas lo mencionan, pero la entrada aún no ha sido verificada en la página."
  fr: "Fiche de convocation pour Hersekzade Ahmed Pacha, le grand vizir ottoman né en Bosnie-Herzégovine à cinq reprises sous Bayezid II et Selim Ier, décédé en 1517; les sources des chroniques ottomanes le nomment mais l'entrée n'est pas encore vérifiée sur la page."
  ur: "ہرسک زادے احمد پاشا کے لیے ڈرافٹ کارڈ، جو بوسنیائی-ہرزیگووینیا میں پیدا ہوئے، بایزید دوم اور سلیم اول کے دور میں پانچ مرتبہ عثمانی عظیم وزیر رہے، ڈی۔ 1517; عثمانی تاریخ کے ذرائع نے اس کا نام بتایا ہے لیکن صفحہ پر اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Bayezid II ve Selim I döneminde beş kez cumhurbaşkanlığını üstlenen ve 1517'de ölen Bosnalı Hersli kökenli Osmanlı Sadrazami Ahmed Paşa Herski'nin ön kartı; Osmanlı tarih kitaplarında onun çevirisi geçer ve henüz sayfada incelenmemiştir."
  id: "Kartu awal Ahmed Pasha Herski, Wazir Agung Ottoman asal Bosnia Hersli, yang menjabat sebagai presiden lima kali selama masa pemerintahan Bayezid II dan Selim I dan meninggal pada tahun 1517 M; Buku sejarah Ottoman menyebutkan terjemahannya dan belum pernah diulas di halaman."
