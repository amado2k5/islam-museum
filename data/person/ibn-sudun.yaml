summary:
  ar: "علي بن سودون الدمشقي الشافعي؛ ولد بدمشق سنة أربع وثمانين وسبعمائة وكان ابن قاضٍ ولما بلغ أطمعه أهل جنون ومزح فكان أول من أحدث خيال الظل بدمشق وعمل بذلك ونما به أمره فأنس به الأمراء والعظماء وصار مقرباً عندهم وذلك لأجل مزحه وأضحكته لا لمعنى آخر ولم يكن محبوباً عند الناس كله وكان يأتي منه في المجالس آفات كثيرة ولا يناقش في شيء ويمزح كثيراً ويبلغ من السخف بأهل العلم، ورث نفسه في قصيدة مشهورة، توفي في رجب سنة ثمان وستين وثمانمائة بدمشق وله نحو خمس وثمانون سنة {cite:shadharat-dhahab p. 308-309}."
  en: "'Ali ibn Sudun (b. Damascus 784) — the celebrated jester who 'first brought the shadow-play (khayal al-zill) to Damascus,' companion of amirs who mourned his own self in a famous elegy; died Rajab 868 at ~85 {cite:shadharat-dhahab p. 308-309}."
  es: "'Ali ibn Sudun (n. Damasco 784) — el célebre bufón que «introdujo por primera vez el teatro de sombras (khayal al-zill) en Damasco», compañero de emires que lamentó su propia muerte en una famosa elegía; murió en Rajab 868 a los ~85 años {cita: shadharat-dhahab págs. 308-309}."
  fr: "'Ali ibn Sudun (né à Damas en 784) — le célèbre bouffon qui « a introduit pour la première fois le théâtre d'ombres (khayal al-zill) à Damas », compagnon d'émirs qui a pleuré sa propre mort dans une célèbre élégie; est mort en Rajab 868 à ~85 ans {cite: shadharat-dhahab p. 308-309}."
  ur: "'علی ابن سدون ⁦(بمقابلہ دمشق 784)⁩ - مشہور طنز کرنے والا جو 'پہلے دمشق میں شیڈو پلے ⁦(خیال الزل)⁩ لایا'، امیروں کا ساتھی جس نے ایک مشہور محفل میں اپنے نفس کا ماتم کیا۔ وفات 868 رجب 85 میں ہوئی۔ 308-309}۔"
  tr: "Ali ibn Sudun al-Dimashqi al-Shafi'i; 784 Hicri yılında Şam'da doğdu. Bir yargıcın oğluydu. Yetişkinliğe ulaştığında, deliler ve soytarılar tarafından açgözlüydü. Şam'da gölge hayal gücünü ilk yaratan kişi oldu, buna göre hareket etti ve statüsü yükseldi; şakaları ve kahkahaları sayesinde prenslere ve büyük insanlara sevinç getirdi, başka bir nedenle değil, onlara yakınlaştı. Herkes tarafından sevilmezdi. Toplantılarda sık sık birçok kusur getirirdi, hiçbir şey hakkında tartışmazdı, çok şaka yapardı ve alimler arasında alay konusu olurdu. Kendisini ünlü bir şiirde miras almıştır. 868 Hicri yılında, yaklaşık seksen beş yaşında Şam'da Recep'te öldü {atıf: shadharat-dhahab, s. 308-309}."
  id: "Ali ibn Sudun al-Dimashqi al-Shafi'i; ia lahir di Damaskus pada tahun 784 H. Ia adalah putra seorang hakim. Ketika dewasa, ia serakah terhadap orang-orang gila dan badut. Ia adalah yang pertama menciptakan bayangan di Damaskus, bertindak atasnya, dan statusnya tumbuh, membawa sukacita bagi para pangeran dan orang-orang besar serta menjadi dekat dengan mereka karena lelucon dan tawanya, bukan karena alasan lain. Ia tidak dicintai oleh semua orang. Ia sering membawa banyak kesalahan dalam pertemuan, tidak pernah berdebat tentang apa pun, banyak bercanda, dan sampai pada titik olok-olok para ulama. Ia mewarisi dirinya dalam sebuah puisi terkenal. Ia meninggal di Rajab pada tahun 868 H di Damaskus pada usia sekitar delapan puluh lima tahun {cite:shadharat-dhahab, hlm. 308-309}."
