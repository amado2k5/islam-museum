summary:
  ar: "علي بن سودون الدمشقي الشافعي؛ ولد بدمشق سنة أربع وثمانين وسبعمائة وكان ابن قاضٍ ولما بلغ أطمعه أهل جنون ومزح فكان أول من أحدث خيال الظل بدمشق وعمل بذلك ونما به أمره فأنس به الأمراء والعظماء وصار مقرباً عندهم وذلك لأجل مزحه وأضحكته لا لمعنى آخر ولم يكن محبوباً عند الناس كله وكان يأتي منه في المجالس آفات كثيرة ولا يناقش في شيء ويمزح كثيراً ويبلغ من السخف بأهل العلم، ورث نفسه في قصيدة مشهورة، توفي في رجب سنة ثمان وستين وثمانمائة بدمشق وله نحو خمس وثمانون سنة {cite:shadharat-dhahab p. 308-309}."
