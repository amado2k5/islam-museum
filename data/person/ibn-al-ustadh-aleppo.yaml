summary:
  ar: "قاضي حلب؛ اشتغل في المذهب وبرع في العلوم والحديث وأفتى ودرس وولي القضاء بحلب في الدولتين الناصرية والظاهرية؛ قال الذهبي كان صدراً معظماً وافر الحرمة مجموع الفضائل؛ من تصانيفه شرح الوسيط في نحو عشر مجلدات لكن عز وجود شيء منه والظاهر أنه عدم في فتنة التتار بحلب فإنه أصيب بماله وأهله فيها؛ وقال السبكي له حواش على فتاوى ابن الصلاح تدل على فضل كثير واستحضار للمذهب جيد {cite:shadharat-dhahab p. 534-535}."
  en: "Qadi of Aleppo under the Nasiri and Zahiri regimes (b. 611) — Dhahabi: 'a grand, honoured figure, an aggregate of virtues'; his ten-volume Sharh al-Wasit survived scarcely at all, presumed lost in the Tatar sack of Aleppo where his wealth and family were struck; al-Subki praises his glosses on Ibn al-Salah's fatwas {cite:shadharat-dhahab p. 534-535}."
  es: "Qadi de Alepo bajo los regímenes Nasiri y Zahiri (n. 611) — Dhahabi: 'una figura grandiosa y honrada, un conjunto de virtudes'; su obra de diez volúmenes, Sharh al-Wasit, apenas sobrevivió, presumiblemente perdida en el saqueo tártaro de Alepo, donde su riqueza y su familia fueron atacadas; al-Subki elogia sus glosas sobre las fatuas de Ibn al-Salah {cite:shadharat-dhahab p. 534-535}."
  fr: "Cadi d'Alep sous les régimes Nasiri et Zahiri (né en 611) — Dhahabi: « une figure grandiose et honorée, un concentré de vertus »; son Sharh al-Wasit en dix volumes a à peine survécu, présumé perdu lors du sac d'Alep par les Tatars, où sa fortune et sa famille furent anéanties; al-Subki fait l'éloge de ses gloses sur les fatwas d'Ibn al-Salah {cite: shadharat-dhahab p. 534-535}."
  ur: "ناصری اور ظاہری حکومتوں کے تحت حلب کا قادی ⁦(ب. 611)⁩ - ذہبی: 'ایک عظیم، معزز شخصیت، فضائل کا مجموعہ'؛ اس کی دس جلدوں پر مشتمل شارح الوصیت بہت کم بچ پایا، خیال کیا جاتا ہے کہ حلب کے تاتاری بوری میں گم ہو گیا جہاں اس کی دولت اور خاندان کو مارا گیا۔ السبکی نے ابن الصلاح کے فتاویٰ پر اس کی تعریف کی ہے۔ 534-535}۔"
