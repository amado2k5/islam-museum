summary:
  ar: "قاضي حلب؛ اشتغل في المذهب وبرع في العلوم والحديث وأفتى ودرس وولي القضاء بحلب في الدولتين الناصرية والظاهرية؛ قال الذهبي كان صدراً معظماً وافر الحرمة مجموع الفضائل؛ من تصانيفه شرح الوسيط في نحو عشر مجلدات لكن عز وجود شيء منه والظاهر أنه عدم في فتنة التتار بحلب فإنه أصيب بماله وأهله فيها؛ وقال السبكي له حواش على فتاوى ابن الصلاح تدل على فضل كثير واستحضار للمذهب جيد {cite:shadharat-dhahab p. 534-535}."
  en: "Qadi of Aleppo under the Nasiri and Zahiri regimes (b. 611) — Dhahabi: 'a grand, honoured figure, an aggregate of virtues'; his ten-volume Sharh al-Wasit survived scarcely at all, presumed lost in the Tatar sack of Aleppo where his wealth and family were struck; al-Subki praises his glosses on Ibn al-Salah's fatwas {cite:shadharat-dhahab p. 534-535}."
