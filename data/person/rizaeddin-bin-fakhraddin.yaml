summary:
  ar: "عالم ومؤلف تتري وباشكيري (1859–1936)، من أكثر كتّاب حركة الجديد إنتاجًا. كان قاضيًا في الإدارة الدينية للمسلمين بأوفا منذ 1891، وحرّر صحيفة «وقت» وأسس مجلة «شورى» (1908–1918)، وصار مفتي روسيا الأوروبية من مطلع عشرينيات القرن العشرين حتى وفاته، وأشهر أعماله مصنّف التراجم «آثار»."
  en: "Tatar and Bashkir scholar and publicist (1859–1936), one of the most productive authors of the Jadid movement. A qadi of the Muslim religious administration at Ufa from 1891, he edited the newspaper Waqt and founded the journal Shura (1908–1918), and was mufti of European Russia from the early 1920s until his death; his best-known work is the biographical compendium Asar."
  ur: "تاتاری اور باشقیر عالم اور مصنف (1859–1936)، تحریکِ جدید کے سب سے زیادہ لکھنے والے مصنفین میں سے ایک۔ 1891 سے اوفا کی مسلم دینی انتظامیہ کے قاضی رہے، اخبار «وقت» کے مدیر اور مجلہ «شورا» (1908–1918) کے بانی، اور 1920 کی دہائی کے اوائل سے وفات تک یورپی روس کے مفتی؛ ان کا مشہور ترین کام سوانحی مجموعہ «آثار» ہے۔"
