label:
  ar: كربوقا صاحب الموصل
  en: Kerbogha, lord of Mosul
summary:
  ar: "كربوقا، من أمراء السلجوقية وصاحب الموصل؛ ملكها بعد أقسنقر وبوزان لما قبضهما تتش بحلب، ودارت بينه وبين سقمان بن أرتق فتن وحروب أسر في بعضها ياقوتي ابن سقمان فحبسه بقلعة ماردين عند المغني صاحب الحصون، وسار لحصار آمد فقاتله سقمان قتالاً شديداً ثم هزمه وتوفي سنة 495هـ فولي الموصل بعده موسى التركماني."
  en: "Kerbogha, a Seljuk amir and lord of Mosul; he held it after Aqsunqur and Bozan when Tutush seized them at Aleppo, waged a running war with Sukman ibn Artuq in which he captured Sukman's son Yaquti and held him at Mardin's fortress with the castellan al-Mughni, marched against Amid and fought Sukman bitterly before beating him, and died in 495 AH when Musa al-Turkmani took Mosul after him."
