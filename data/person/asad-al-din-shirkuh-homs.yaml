summary:
  ar: "الملك المجاهد أسد الدين شيركوه بن محمد صاحب حمص، ابن أخي أسد الدين شيركوه صاحب صلاح الدين؛ وكانت له أيضاً الرحبة وتدمر وما كسا من بلاد الخابور، وخلف جماعة من الأولاد فقام مقامه في الملك ولده الملك المنصور ناصر الدين إبراهيم {cite:shadharat-dhahab p. 184}."
  en: "Asad al-Din Shirkuh II of Homs (b. 569, d. Tuesday 9 Rajab 637) — nephew of Saladin's uncle, holding al-Rahba, Tadmur and the Khabur towns; succeeded by his son al-Malik al-Mansur Ibrahim {cite:shadharat-dhahab p. 184}."
  es: "Asad al-Din Shirkuh II de Homs (n. 569, m. martes 9 Rajab 637) — sobrino del tío de Saladino, poseedor de las ciudades de al-Rahba, Tadmur y Khabur; sucedido por su hijo al-Malik al-Mansur Ibrahim {cita:shadharat-dhahab p. 184}."
  fr: "Asad al-Din Shirkuh II de Homs (né en 569, mort le mardi 9 Rajab 637) — neveu de l'oncle de Saladin, détenant al-Rahba, Tadmur et les villes de Khabur; remplacé par son fils al-Malik al-Mansur Ibrahim {cite: shadharat-dhahab p. 184}."
  ur: "حمص کا اسدالدین شرکوہ دوم ⁦(پیدائش 569، وفات منگل 9 رجب 637)⁩ - صلاح الدین کے چچا کا بھتیجا، الرحبہ، تدمر اور خبر قصبوں پر قابض؛ اس کے بیٹے المالک المنصور ابراہیم نے جانشین بنایا۔ 184}۔"
  tr: "Mücadele eden kral Asad al-Din Şirküh bin Muhammed, Homs'un hükümdarı, Salah al-Din'in sahibi Esed-Din Şirkuh'un yeğeni; ayrıca Rahba, Palmira ve Habur topraklarına da sahipti. Geride bir grup oğul bıraktı ve krallıktaki halefi oğlu Kral el-Mansur Nasireddin İbrahim tarafından kuruldu {kaynak: shadharat-dhahab, s. 184}."
  id: "Raja yang berjuang, Asad al-Din Shirkuh ibn Muhammad, penguasa Homs, keponakan Asad al-Din Shirkuh, pemilik Salah al-Din; ia juga memiliki wilayah Rahba, Palmyra, dan tanah Khabur. Ia meninggalkan sekelompok putra, dan penerusnya di kerajaan didirikan oleh putranya, Raja al-Mansur Nasir al-Din Ibrahim {cite:shadharat-dhahab, hlm. 184}."
