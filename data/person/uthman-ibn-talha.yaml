summary:
  ar: حاجب الكعبة؛ قُتل أبوه وعمه بأحد، ثم أسلم في هدنة الحديبية وهاجر مع خالد بن الوليد، وشهد الفتح فأعطاه النبي مفتاح الكعبة، ودخل معه الكعبة؛ وتوفي بالمدينة سنة 42هـ على الراجح.
  en: The keeper of the Kaaba; his father and uncle were killed at Uhud, then he embraced Islam during the truce of al-Hudaybiyya and emigrated with Khalid ibn al-Walid; he was at the conquest, where the Prophet handed him the key of the Kaaba
    and entered it with him; he died in Medina in 42 AH on the sounder view.
