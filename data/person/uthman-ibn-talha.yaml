summary:
  ar: حاجب الكعبة؛ قُتل أبوه وعمه بأحد، ثم أسلم في هدنة الحديبية وهاجر مع خالد بن الوليد، وشهد الفتح فأعطاه النبي مفتاح الكعبة، ودخل معه الكعبة؛ وتوفي بالمدينة سنة 42هـ على الراجح.
  en: The keeper of the Kaaba; his father and uncle were killed at Uhud, then he embraced Islam during the truce of al-Hudaybiyya and emigrated with Khalid ibn al-Walid; he was at the conquest, where the Prophet handed him the key of the Kaaba
    and entered it with him; he died in Medina in 42 AH on the sounder view.
  ur: "کعبہ کا نگران؛ اس کے والد اور چچا احد میں مارے گئے، پھر وہ حدیبیہ کی جنگ بندی میں مسلمان ہوا اور ہجرت کر کے آیا۔"
  es: "El guardián de la Kaaba; su padre y su tío fueron asesinados en Uhud, luego abrazó el Islam durante la tregua de al-Hudaybiyya y emigró con Khalid ibn al-Walid; estuvo presente en la conquista, donde el Profeta le entregó la llave de la Kaaba y entró con él; murió en Medina en el año 42 de la Hégira en la visión más elevada."
  fr: "Le gardien de la Kaaba; son père et son oncle furent tués à Uhud, puis il embrassa l'islam pendant la trêve d'al-Hudaybiyya et émigra avec Khalid ibn al-Walid; il était présent lors de la conquête, où le Prophète lui remit la clé de la Kaaba et y entra avec lui; il mourut à Médine en 42 AH selon la version la plus fiable."
