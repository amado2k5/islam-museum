class: person
label: { ar: "بغا الصغير", en: "Bugha the Younger", es: "Bugha the Younger", fr: "Bugha the Younger", ur: "بگھا چھوٹا" }
summary:
  ar: "أمير تركي اصطنع باغر التركي وملأ عينه من الصلات، وعزم على قتل المتوكل فامتحنه ثلاثاً أولاً بابنه فارس ثم بأخيه وصيف ثم بالمنتصر، فلما عرض عليه قتل المنتصر قال باغر يقتل الابن والأب باق نبدأ بالأب أولاً فنقتله، فعلم بغا أنه قاتل المتوكل وتوجها في التدبير {cite:muruj-al-dhahab p. 503-504}. وعند المسعودي خرج من سامرا سنة أربع وخمسين ومائتين إلى ناحية الموصل فانتهبت الموالي داره وانفض الجيش عنه، فانحدر في زورق متنكراً فوقع به بعض المغاربة بجسر سامرا فقتلوه ونصبوا رأسه بسامرا ثم أخذ إلى مدينة السلام فنصب على الجسر، وكان المعتز في حياته لا يلتذ بالنوم ولا يخلع سلاحه خوفاً منه ويقول إني لأخاف أن ينزل علي بغا من السماء {cite:muruj-al-dhahab p. 552-553}"
  en: "The Turkish amir who tested Baghir's resolve three times — son, brother, heir — before the answer 'we begin with the father' sealed al-Mutawakkil's fate {cite:muruj-al-dhahab p. 503-504}."
  es: "El emir turco que puso a prueba la determinación de Baghir tres veces —hijo, hermano, heredero— antes de que la respuesta \"empezamos con el padre\" sellara el destino de al-Mutawakkil {cite:muruj-al-dhahab p. 503-504}."
  fr: "L'émir turc qui a mis à l'épreuve la détermination de Baghir à trois reprises — fils, frère, héritier — avant que la réponse « nous commençons par le père » ne scelle le destin d'al-Mutawakkil {cite:muruj-al-dhahab p. 503-504}."
  ur: "ترک امیر جس نے باغیر کے عزم کو تین بار آزمایا - بیٹا، بھائی، وارث - اس کے جواب سے پہلے 'ہم باپ سے شروع کرتے ہیں' نے المتوکل کی قسمت پر مہر ثبت کردی۔ 503-504}۔"
  tr: "Türk prensi Türk Bagher'i uydurdu ve gözlerini dualarla doldurdu. El-Mutawakkil'i öldürmeye karar verdi, bu yüzden onu üç kez sınattı: önce oğlu Faris, sonra kardeşi Saif, sonra el-Muntasir ile. El-Muntasir'i öldürmesi teklif edildiğinde, Bağır dedi ki, 'Oğlu öldürülsün, baba kalsın. Babadan başlayalım ve onu öldürelim.' Bugha, el-Mutavakkil'i öldürdüğünü öğrendi ve plana devam ettiler. {Kaynak:Muruj-al-Dhahab, s. 503-504}. El-Mes'udi ile birlikte 254 Hicri yılında Samarra'dan Musul bölgesine doğru ayrıldı. Mevaliler evini yağmaladılar ve ordu ondan dağıldı. Gizli bir tekneyle indi ve Samarra köprüsünde bazı Faslılar tarafından saldırıya uğradı, öldürüldü ve başını Samarra'ya gömdü. Barış şehrine götürüldü ve köprüye yerleştirildi. El-Mu'tazz, korktuğu için uyumaktan ya da silahını çıkarmaktan hiç hoşlanmadı ve şöyle dedi: 'Korkarım ki gökten üzerime bir ghara inecek.' {kaynak:Muruj-al-Dhahab s. 552-553}"
  id: "Seorang pangeran Turki memalsukan Bagher Turki dan memenuhi matanya dengan doa. Ia bertekad untuk membunuh al-Mutawakkil, sehingga ia mengujinya tiga kali: pertama dengan putranya Faris, lalu dengan saudaranya Saif, lalu dengan al-Muntasir. Ketika ia ditawari untuk membunuh al-Muntasir, Bagher berkata, 'Biarlah anaknya dibunuh dan ayahnya akan tetap tinggal. Mari kita mulai dengan ayahnya dan membunuhnya.' Bugha mengetahui bahwa ia telah membunuh al-Mutawakkil dan mereka melanjutkan rencana tersebut. {cite:muruj-al-dhahab, hlm. 503-504}. Bersama al-Mas'udi, ia meninggalkan Samarra pada tahun 254 H menuju wilayah Mosul. Para mawalis menjarah rumahnya dan pasukan berpisah darinya. Ia turun dengan perahu yang menyamar dan diserang oleh beberapa orang Maroko di jembatan Samarra, membunuhnya dan menancapkan kepalanya di Samarra. Ia dibawa ke kota damai dan diletakkan di atas jembatan. Al-Mu'tazz tidak pernah menikmati tidur atau melucutkan senjata karena takut padanya, berkata, 'Aku takut sebuah ghara akan turun dari langit kepadaku.' {cite:muruj-al-dhahab hlm. 552-553}"
