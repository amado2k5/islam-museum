id: person/bugha-al-saghir
class: person
label: { ar: "بغا الصغير", en: "Bugha the Younger" }
summary:
  ar: "أمير تركي اصطنع باغر التركي وملأ عينه من الصلات، وعزم على قتل المتوكل فامتحنه ثلاثاً أولاً بابنه فارس ثم بأخيه وصيف ثم بالمنتصر، فلما عرض عليه قتل المنتصر قال باغر يقتل الابن والأب باق نبدأ بالأب أولاً فنقتله، فعلم بغا أنه قاتل المتوكل وتوجها في التدبير {cite:muruj-al-dhahab p. 503-504}.، وعند المسعودي خرج من سامرا سنة أربع وخمسين ومائتين إلى ناحية الموصل فانتهبت الموالي داره وانفض الجيش عنه، فانحدر في زورق متنكراً فوقع به بعض المغاربة بجسر سامرا فقتلوه ونصبوا رأسه بسامرا ثم أخذ إلى مدينة السلام فنصب على الجسر، وكان المعتز في حياته لا يلتذ بالنوم ولا يخلع سلاحه خوفاً منه ويقول إني لأخاف أن ينزل علي بغا من السماء {cite:muruj-al-dhahab p. 552-553}"
  en: "The Turkish amir who tested Baghir's resolve three times — son, brother, heir — before the answer 'we begin with the father' sealed al-Mutawakkil's fate {cite:muruj-al-dhahab p. 503-504}."
