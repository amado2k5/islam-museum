id: person/yusuf-ibn-tashfin
class: person
label: { ar: "يوسف بن تاشفين أمير المسلمين" , ur: "یوسف بن تاشفین", en: "Yusuf ibn Tashfin", es: "Yusuf ibn Tashfin", fr: "Yusuf ibn Tashfin"}
summary:
  ar: "صاحب سبتة ومراكش، أرسل إلى المقتدي سنة تسع وسبعين يطلب أن يسلطنه وأن يقلده ما بيده من البلاد فبعث إليه الخلع والأعلام والتقليد ولقبه بأمير المسلمين ففرح بذلك وسر به فقهاء المغرب وهو الذي أنشأ مدينة مراكش {cite:tarikh-khulafa-minhaj-1434 p. 652}. وعند ابن خلدون واختط مدينة مراكش سنة 454هـ ولقيه المعتمد بن عباد وابن الأفطس بالزلاقة من نواحي بطليوس فكان للمسلمين عليه دفاع لمتونة ثم رجع فتقبض على المعتمد وقاده أسيراً إلى مراكش {cite:tarikh-ibn-khaldun-ibar p. 1646-1648}"
  en: "Lord of Sabta and Marrakesh; in 479 he asked al-Muqtadi for investiture — the robes, banners and title amir al-muslimin came, to the Maghreb jurists' joy. He founded Marrakesh {cite:tarikh-khulafa-minhaj-1434 p. 652}."
  ur: "مرابطی حکمران جس نے زلاقہ کی جنگ میں شرکت کی اور اندلس میں مرابطی اقتدار بڑھایا؛ اشبیلیہ اور بطلیوس کی مہمات اس کے عہد سے وابستہ ہیں۔ {cite:wafayat-ayan}"
  es: "Señor de Sabta y Marrakech; en 479 solicitó la inversión de al-Muqtadi, y para alegría de los juristas del Magreb, recibió las vestiduras, los estandartes y el título de emir al-muslimin. Fundó Marrakech {cite:tarikh-khulafa-minhaj-1434 p. 652}."
  fr: "Seigneur de Sabta et de Marrakech, il sollicita en 479 un investissement auprès d'al-Muqtadi. Les robes, les bannières et le titre d'émir des musulmans lui furent accordés, à la grande joie des juristes maghrébins. Il fonda Marrakech (voir: Tarikh-Khulafa-Minhaj-1434, p. 652)."
  tr: "Ceuta ve Marakeş hükümdarı, yetmiş dokuzuncu yılda El-Muqtadi'ye yetki vermesini ve sahip olduğu toprakları taklit etmesini istedi. Ona Müslümanların Komutanı unvanını verdi ve Müslümanlar bundan memnun oldu, Fas hukukçularını da memnun etti. Marakeş şehrini kuran kişi oydu {cite:History-Khulafa-Minhaj-1434, s. 652}. İbn Haldun ile birlikte 454 Hicri'de Marakeş şehrini haritaladı. Al-Mu'tamid ibn Abbad ve İbn al-Aftas, Müslümanların Lamtuna'yı savunduğu Badajoul yakınlarındaki Zallaka'da onunla karşılaştılar. Sonra geri döndü, Al-Mu'tamid'i yakaladı ve onu Marakeş'e esir aldı {cite:Tarikh-ibn-khaldun-ibar s. 1646-1648}"
  id: "Penguasa Ceuta dan Marrakesh mengirim surat kepada Al-Muqtadi pada tahun tujuh puluh sembilan meminta agar diberikan otoritas dan meniru tanah yang dimilikinya. Ia mengirimkan gelar Komandan Muslim, dan ia senang dengan hal itu serta menyenangkan para ahli hukum Maroko. Ia adalah orang yang mendirikan kota Marrakesh {cite:History-Khulafa-Minhaj-1434, hlm. 652}. Bersama Ibn Khaldun, ia memetakan kota Marrakesh pada tahun 454 H. Al-Mu'tamid ibn Abbad dan Ibn al-Aftas bertemu dengannya di Zallaqa dekat Badajoul, tempat umat Muslim mempertahankan Lamtuna. Ia kemudian kembali, menangkap Al-Mu'tamid, dan membawanya ke Marrakesh {cite:Tarikh-ibn-khaldun-ibar hlm. 1646-1648}"
