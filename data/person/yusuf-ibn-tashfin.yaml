label: { ar: "يوسف بن تاشفين أمير المسلمين" }
summary:
  ar: "صاحب سبتة ومراكش، أرسل إلى المقتدي سنة تسع وسبعين يطلب أن يسلطنه وأن يقلده ما بيده من البلاد فبعث إليه الخلع والأعلام والتقليد ولقبه بأمير المسلمين ففرح بذلك وسر به فقهاء المغرب وهو الذي أنشأ مدينة مراكش {cite:tarikh-khulafa-minhaj-1434 p. 652}. وعند ابن خلدون واختط مدينة مراكش سنة 454هـ ولقيه المعتمد بن عباد وابن الأفطس بالزلاقة من نواحي بطليوس فكان للمسلمين عليه دفاع لمتونة ثم رجع فتقبض على المعتمد وقاده أسيراً إلى مراكش {cite:tarikh-ibn-khaldun-ibar p. 1646-1648}"
  en: "Lord of Sabta and Marrakesh; in 479 he asked al-Muqtadi for investiture — the robes, banners and title amir al-muslimin came, to the Maghreb jurists' joy. He founded Marrakesh {cite:tarikh-khulafa-minhaj-1434 p. 652}."
