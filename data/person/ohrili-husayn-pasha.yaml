summary:
  ar: "بطاقة أولية لحسين باشا الأوخريدي، الصدر الأعظم العثماني في أوائل عهد عثمان الثاني الذي لقّب بطاغية حسين لعهده القصير الدامي، أُعدم سنة ١٦٢٢م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ohrili Huseyin Pasha, the Ottoman grand vizier in early Osman II's reign nicknamed for his brief bloody term, executed in 1622; the source entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Ohrili Huseyin Pasha, el gran visir otomano a principios del reinado de Osman II, apodado así por su breve y sangriento mandato, ejecutado en 1622; la entrada de origen aún no se ha verificado en la página."
  fr: "Fiche d'engagement d'Ohrili Huseyin Pacha, grand vizir ottoman du début du règne d'Osman II, surnommé ainsi en raison de son bref mandat sanglant, exécuté en 1622; la source n'est pas encore vérifiée sur la page."
  ur: "اوہریلی حسین پاشا کے لیے ڈرافٹ کارڈ، جو عثمانی عظیم وزیر عثمان II کے دور حکومت میں اس کی مختصر خونی مدت کے لیے عرفی نام تھا، 1622 میں پھانسی دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Osman II'nin erken dönemlerinde Osmanlı Sadrazami olan Hüseyin Paşa el-Okhridi'nin ön kartı, kısa ve kanlı hükümdarlığı nedeniyle Hüseyin'in zorbalığı olarak adlandırılmıştı ve 1622 yılında idam edilmiştir; Osmanlı tarih kitaplarında kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Hussein Pasha al-Okhridi, Wazir Agung Ottoman pada awal pemerintahan Osman II, yang disebut tiran Hussein karena masa pemerintahannya yang singkat dan berdarah, dieksekusi pada tahun 1622 M; Buku sejarah Ottoman menyebutkannya dan biografinya belum pernah diulas di halaman."
