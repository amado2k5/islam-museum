summary:
  ar: "أبو روح الفرج بن سعيد الصوفي، لوم طريق الأئمة والأوتاد. روى عنه عثمان بن عمار قول أيوب السختياني ويونس بن عبيد وابن عون وثابت البناني في الاستدراج والعجب والشكر، ومن قول أيوب: إذا ضيّع العبد الشكر استدرجه الله، وإذا عرف الاستدراج بصدق خضع، فإذا خضع غفر الله عثرته."
  en: "Abu Ruh al-Faraj ibn Sa'id al-Sufi, reproached for the path of the imams and the pillars; he relates a discussion of Ayyub al-Sakhtiyani, Yunus ibn Ubayd, Ibn Awn and Thabit al-Bunani on istidraj (being led on by God through apparent favour), vanity at God's favour, and thanks; Ayyub said that when a servant wastes thanks God leads him on, and that when a servant who knows this humbles himself, God pardons his fall."
  ur: "ابو روح فرج بن سعید صوفی، ائمہ اور اوتاد کی راہ پر ملامت کیے گئے۔ انہوں نے ایوب سختیانی، یونس بن عبید، ابن عون اور ثابت بنانی کی گفتگو نقل کی جو استدراج، نعمت پر غرور اور شکر کے بارے میں تھی؛ ایوب نے کہا کہ جب بندہ شکر ضائع کرتا ہے تو اللہ اسے استدراج میں ڈال دیتا ہے، اور جو اس کو جان کر عاجزی اختیار کرے تو اللہ اس کی لغزش معاف کرتا ہے۔"
