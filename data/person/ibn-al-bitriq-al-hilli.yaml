  ar: "ابن البطريق الحلي"
  en: "Ibn al-Bitriq al-Hilli"
roles: [scholar, poet, theologian]
gender: male
summary:
  ar: "يحيى بن الحسن بن الحسين بن علي بن محمد بن البطريق، أبو الحسين الأسدي الحلي، باحث من فقهاء الإمامية، من أهل الحلة، سكن بغداد مدة ونزل بواسط وكان في حلب سنة 596 هـ، من كتبه «العمدة في عيون صحاح الأخبار» و«اتفاق صحاح الأثر في إمامة الأئمة الاثني عشر»، توفي سنة 600 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 141}."
  en: "Yahya ibn al-Hasan ibn al-Husayn ibn Ali ibn Muhammad ibn al-Bitriq, Abu al-Husayn al-Asadi al-Hilli, a researcher counted among the Imami (Twelver Shi'i) jurists; from Hilla, he lived for a time in Baghdad, stayed in Wasit and was in Aleppo in 596 AH, and his books include al-Umda fi uyun sihah al-akhbar and Ittifaq sihah al-athar fi imamat al-a'imma al-ithna ashar; he died in 600 AH (1204 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 141}."
