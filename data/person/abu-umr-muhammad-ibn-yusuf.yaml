label: { ar: "القاضي أبو عمرو محمد بن يوسف" }
summary:
  ar: "قاضي بغداد؛ أحضره الوزير حامد بن العباس مع القاضي أبي جعفر بن البهلول ووجوه الفقهاء والشهود لاستفتائهم في أمر الحلاج فقالوا لا يغت ففي أمره بشيء إلا أن يصح عندنا ما يوجب قتله، فلما سئل الحلاج عن كتابه في حج البيت بالدار قال أخذته من كتاب الإخلاص للحسن البصري قال له القاضي كذبت يا حلال الدم قد سمعناه بمكة وليس فيه هذا، فكتب بإباحة دمه وكتب بعده من حضر المجلس {cite:kamil-ibn-al-athir p. 94-95}."
  en: "The qadi of Baghdad who presided over al-Hallaj's examination under vizier Hamid ibn al-Abbas; when al-Hallaj cited a house-hajj text from the Hasan al-Basri Ikhlas, Abu Umar answered you lie, licit-blood; we heard that book in Mecca and this is not in it, and wrote the fatwa shedding his blood {cite:kamil-ibn-al-athir p. 94-95}."
