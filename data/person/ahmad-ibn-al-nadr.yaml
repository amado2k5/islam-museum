summary:
  ar: "أحمد بن سليمان بن عبد الله الناعبي المعروف بابن النضر ⁦(٦٥٥ - ٦٩٠هـ = ١٢٥٦ - ١٢٩١م)⁩: عالم وشاعر عُماني من سمائل في العهد النبهاني، من مؤلفاته «الدعائم»، قُتل على يد السلطان خردلة بن سماعة النبهاني، بحسب مقالة ويكيبيديا العربية؛ وهو غير أحمد بن النضر النيسابوري."
  en: "Ahmad ibn Sulayman ibn Abd Allah al-Na'abi, known as Ibn al-Nadr (655 to 690 AH = 1256 to 1291): an Omani scholar and poet of Samail in the Nabhani period, author of al-Da'a'im, killed on the orders of the sultan Khardala ibn Sam'a al-Nabhani, according to the Arabic Wikipedia article; a different man from Ahmad ibn al-Nadr al-Naysaburi."
