summary:
  ar: "مرابط سنغامبي وألمامي (1809 – 18 يوليو 1867)، معلّم قرآن من الريب (باديبو) من نسل الدنيانكي، صار تلميذًا للطريقة التيجانية ولقي الحاج عمر تال سنة 1846 فسمّاه قائدًا تيجانيًا للمنطقة. حكم الريب من 1861 ثم معظم سالوم، وأسس نيورو دو ريب، وأدخل لات ديور وألبوري ندياي في الإسلام، وهزم الفرنسيين في باثي باديان سنة 1865، وقُتل في معركة فاندان-تيوتيون (سومب) في 18 يوليو 1867؛ وقبره في فاندين مزار يُحجّ إليه."
  en: "Senegambian marabout and Almami (1809 – 18 July 1867), a Quran teacher of the Rip (Badibu) of Denianke descent who became a disciple of the Tijaniyya, met El Hadj Umar Tall in 1846 and was named by him Tijani leader for the region. From 1861 he ruled the Rip and then most of Saloum, founded Nioro du Rip, converted Lat Dior and Alboury Ndiaye, defeated the French at Pathé Badiane in 1865, and was killed at the battle of Fandane-Thiouthioune (Somb) on 18 July 1867; his tomb at Fandène is a place of pilgrimage."
  ur: "سینیگامبی مرابط اور المامی (1809ء – 18 جولائی 1867ء)، ریب (بادیبو) کے قرآن کے استاد اور دنیانکے نسل سے تھے؛ طریقہ تیجانیہ کے مرید بنے، 1846ء میں الحاج عمر تال سے ملاقات ہوئی جنہوں نے انہیں علاقے کا تیجانی قائد مقرر کیا۔ 1861ء سے ریب اور پھر بیشتر سالوم پر حکومت کی، نیورو دو ریب کی بنیاد رکھی، لات دیور اور البوری ندیائے کو اسلام میں داخل کیا، 1865ء میں پاتھے بادیان میں فرانسیسیوں کو شکست دی، اور 18 جولائی 1867ء کو فاندان-تیوتیون (سومب) کی لڑائی میں مارے گئے؛ فاندین میں ان کا مزار زیارت گاہ ہے۔"
