summary:
  ar: "قطب نفط ومحسن أذربيجاني (1838–1924؛ سنة مولده متنازع عليها)، ابن إسكافي فقير في باكو صار من أغنى رجال الإمبراطورية الروسية بعد تفجر نفطه سنة 1877؛ موّل أول مسرح أذربيجاني وأول مدرسة علمانية للبنات المسلمات في القوقاز ومشروعات خيرية واسعة."
  en: "Azerbaijani oil magnate and philanthropist (1838–1924; his birth year is disputed), a Baku shoemaker's son who became one of the richest men in the Russian Empire after oil struck on his land in 1877. He funded the first Azerbaijani national theatre, the first secular Muslim girls' school in the Caucasus, and a wide charitable empire."
  ur: "آذربائیجانی تیل کے بڑے صنعت کار اور مخیر (1838–1924؛ سنِ ولادت متنازع ہے)؛ باکو کے ایک غریب موچی کے بیٹے، 1877 میں اپنی زمین سے تیل نکلنے پر روسی سلطنت کے امیر ترین افراد میں شامل ہو گئے؛ پہلے آذربائیجانی قومی تھیٹر اور قفقاز میں مسلم لڑکیوں کے پہلے سیکولر اسکول کے بانی و کفیل۔"
