  note: "Born at Baku, son of the shoemaker Muhammedtaghi Taghiyev. His birth year is genuinely split: the English article's lead gives 25 January in each of three years — 1821, 1823 or 1838; the Azerbaijani article leads with 1838 and notes another source gives 1823; the Russian article gives '1823 or January 1838' and reports his daughter's memoir that he lived 86 years and died in 1924, which yields 1838; the Arabic article gives 1823; Wikidata carries only 1838 (January 1838 on the Julian model, and 1838). The record follows 1838, the reading of the Azerbaijani article, of Wikidata and of the daughter's arithmetic, at month precision, with the queue's 1823 and the English article's 1821 preserved as disclosed alternatives. The Hijri year 1253 is the tabular conversion of January 1838. The museum has no place entity for Baku, so no born_in edge is written."
