summary:
  ar: "من فقهاء المدينة في الطبقة الثالثة، وأبوه ذكوان أخو أبي لؤلؤة؛ ذكر الشيرازي أنه وفد على هشام بن عبد الملك بحساب ديوان المدينة، وأن ربيعة قال إنه لم يرَ عالماً إلا ابن هرمز الأصم، وأن مالكاً أخذ عنه الفقه. وعبد الرحمن بن أبي الزناد واسم أبي الزناد عبد الله بن ذكوان من فقهاء المحدثين توفي ببغداد سنة أربع وسبعين ومائة وله كتاب الفرائض وكتاب رأي الفقهاء السبعة من أهل المدينة وما اختلفوا فيه {cite:fihrist-ibn-al-nadim p. 315}"
  en: "A Medinan jurist of the third generation; Shirazi reports his mission to Hisham ibn Abd al-Malik about the Medina accounts, and that Malik took fiqh from him."
