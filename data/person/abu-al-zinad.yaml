summary:
  ar: "من فقهاء المدينة في الطبقة الثالثة، وأبوه ذكوان أخو أبي لؤلؤة؛ ذكر الشيرازي أنه وفد على هشام بن عبد الملك بحساب ديوان المدينة، وأن ربيعة قال إنه لم يرَ عالماً إلا ابن هرمز الأصم، وأن مالكاً أخذ عنه الفقه. وعبد الرحمن بن أبي الزناد واسم أبي الزناد عبد الله بن ذكوان من فقهاء المحدثين توفي ببغداد سنة أربع وسبعين ومائة وله كتاب الفرائض وكتاب رأي الفقهاء السبعة من أهل المدينة وما اختلفوا فيه {cite:fihrist-ibn-al-nadim p. 315}"
  en: "A Medinan jurist of the third generation; Shirazi reports his mission to Hisham ibn Abd al-Malik about the Medina accounts, and that Malik took fiqh from him."
  fr: "Juriste médinois de la troisième génération ; al-Shirazi rapporte sa mission auprès de Hisham ibn Abd al-Malik au sujet des comptes de Médine, et que Malik reçut de lui le fiqh."
  es: "Shirazi, jurista medinense de tercera generación, relata su misión a Hisham ibn Abd al-Malik sobre los relatos de Medina, y que Malik aprendió fiqh de él."
  ur: "تیسری نسل کا ایک مدنی فقیہ؛ شیرازی نے ہشام بن عبد الملک کو مدینہ کے احوال کے بارے میں اپنے مشن کی اطلاع دی اور یہ کہ مالک نے ان سے فقہ حاصل کیا۔"
  tr: "O, Medine'nin üçüncü dereceden hukukçularından biriydi ve babası Dakvan, Ebu Lulua'nın kardeşiydi. Şirazi, Hişam ibn Abdülmalik'i Medine hazinesinin hesaplarıyla ziyaret ettiğini ve Rabi'a'nın İbn Hurmuz el-Asamm'dan başka bir alim görmediğini ve Malik'in ondan fıkıh öğrendiğini söylediğini belirtmiştir. Babasının adı Abdullah ibn Dakvan olan Abdülrahman ibn Abi el-Zinad, Hicri 174 yılında Bağdat'ta vefat eden hadis alimlerinden biriydi. Miras hukuku üzerine bir kitap ve Medine'nin yedi hukukçusunun görüşleri ve ihtilaf noktaları üzerine bir kitap yazmıştır. {cite:fihrist-ibn-al-nadim s. 315}"
  id: "Beliau adalah salah satu ahli hukum terkemuka ketiga di Madinah, dan ayahnya, Dhakwan, adalah saudara laki-laki Abu Lu'lu'a. Al-Shirazi menyebutkan bahwa beliau mengunjungi Hisham ibn Abd al-Malik dengan membawa catatan perbendaharaan Madinah, dan bahwa Rabi'a mengatakan bahwa beliau belum pernah melihat seorang ulama selain Ibn Hurmuz al-Asamm, dan bahwa Malik belajar fiqih darinya. Abd al-Rahman ibn Abi al-Zinad, yang nama ayahnya adalah Abdullah ibn Dhakwan, adalah salah satu ulama hadits yang meninggal di Baghdad pada tahun 174 H. Beliau menulis sebuah buku tentang hukum warisan dan sebuah buku tentang pendapat tujuh ahli hukum Madinah dan poin-poin perbedaan pendapat mereka. {cite:fihrist-ibn-al-nadim p. 315}"
