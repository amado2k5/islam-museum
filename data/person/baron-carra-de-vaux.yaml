summary:
  ar: "مستشرق فرنسي من أوائل القرن العشرين، صنّف في الفلسفة الإسلامية: «مفكرو الإسلام» في خمسة مجلدات، وكتابين عن ابن سينا والغزالي، و«المحمدية» الذي عرض فيه لكثير من الفرق الإسلامية {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 45} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46}. ينقل غلاب عنه أن القرآن ليس كتاباً فلسفياً، لكنه يعرض مسائل فلسفية في صورة إلهامية {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}، وأنه تناول مسائل الألوهية والوحدانية والقدرة والتنزه عن الإنسال ومخالفة الحوادث {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 54}. وينتقد غلاب قراءته لآية النور بوصفها تشبيهاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 59}. هذه كلها أقوال كارادي فو كما نقلها غلاب، وتنسب إليه هنا."
