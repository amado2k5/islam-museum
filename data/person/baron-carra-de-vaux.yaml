summary:
  ar: "مستشرق فرنسي من أوائل القرن العشرين، صنّف في الفلسفة الإسلامية: «مفكرو الإسلام» في خمسة مجلدات، وكتابين عن ابن سينا والغزالي، و«المحمدية» الذي عرض فيه لكثير من الفرق الإسلامية {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 45} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 46}. ينقل غلاب عنه أن القرآن ليس كتاباً فلسفياً، لكنه يعرض مسائل فلسفية في صورة إلهامية {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 47}، وأنه تناول مسائل الألوهية والوحدانية والقدرة والتنزه عن الإنسال ومخالفة الحوادث {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 54}. وينتقد غلاب قراءته لآية النور بوصفها تشبيهاً {cite:al-islam-kama-yarahu-al-urubiyyun-azhar p. 59}. هذه كلها أقوال كارادي فو كما نقلها غلاب، وتنسب إليه هنا."
  tr: "Yirminci yüzyılın başlarından Fransız bir oryantalist olan Sher, İslam felsefesi alanında beş ciltlik 'İslam Düşünürleri' adlı eser, İbn Sina ve el-Hazali üzerine iki kitap ve 'El-Muhammadiyah' adlı eserler yazmıştır, burada birçok İslami mezhebe sundu {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 45} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 46}. Ghallab, Kur'an'ın felsefi bir kitap olmadığını, felsefi meseleleri ilahi bir biçimde sunduğunu {cite:al-islam-kama-yarahu-al-urubiyyun-azhar s. 47} ve ilahi güç, birlik, güç, enkarnasyondan yükselme ve olayların çelişkisi gibi konuları ele aldığını söyler {cite:al-islam-kama-yarahu-al-urubiyyyun-azhar s. 54}. Ghallab, Işık Ayeti'ni bir benzetme olarak okumasını eleştirir {atıf:al-islam-kama-yarahu-al-urubiyyun-azhar s. 59}. Bunların hepsi Ghallab tarafından aktarılan Karadi Fou'nun sözleridir ve burada ona atfedilir."
  id: "Sebagai orientalis Prancis dari awal abad kedua puluh, ia menulis dalam filsafat Islam: 'Thinkers of Islam' dalam lima jilid, dua buku tentang Ibn Sina dan al-Ghazali, serta 'Al-Muhammadiyah,' di mana ia mempresentasikan kepada banyak sekte Islam {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 45} {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 46}. Ghallab mengutipnya mengatakan bahwa Al-Qur'an bukanlah kitab filsafat, melainkan menyampaikan isu-isu filsafat dalam bentuk ilahi {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 47}, dan bahwa Al-Islam-kama-yarahu-al-urubiyyun-azhar hlm. 47}, dan bahwa Al-Islam-kama-yarahu-al-urubiyyun-azhar hlm. 54}. Ghallab mengkritik pembacaannya terhadap Ayat Cahaya sebagai perumpamaan {cite:al-islam-kama-yarahu-al-urubiyyun-azhar hlm. 59}. Semua ini adalah perkataan Karadi Fou seperti yang dilaporkan oleh Ghallab, dan dikaitkan dengannya di sini."
