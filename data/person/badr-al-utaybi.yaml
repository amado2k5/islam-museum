summary:
  ar: "عالم ومحدّث سعودي من الطائف، وُلد فيها سنة 1392هـ، لازم الشيخ عبد العزيز بن باز عشر سنين وقرأ عليه كتب السنة، وحصل على الإجازة الحديثية من أكثر من مائة وخمسين شيخا، ودرّس في مساجد الطائف، وتولى إدارة مركز الدعوة والإرشاد فيها، وله مؤلفات وتحقيقات في التوحيد والحديث."
  en: "Saudi scholar and hadith specialist from Taif, born there in 1392 AH. He accompanied Sheikh Abd al-Aziz ibn Baz for ten years and read the hadith collections with him, received hadith ijazahs from more than 150 scholars, taught in Taif's mosques, directed the city's Dawah and Guidance Centre, and has written and edited works on tawhid and hadith."
  ur: "طائف کے سعودی عالم اور محدث، 1392ھ میں وہیں پیدا ہوئے۔ انہوں نے دس برس شیخ عبد العزیز بن باز کی صحبت اختیار کی اور ان سے کتبِ حدیث پڑھیں، ڈیڑھ سو سے زائد شیوخ سے اجازۂ حدیث حاصل کی، طائف کی مساجد میں تدریس کی، وہاں کے مرکزِ دعوت و ارشاد کی ادارت سنبھالی، اور توحید و حدیث پر ان کی تصانیف و تحقیقات ہیں۔"
