  fr: "Abaza Muhammad Pacha"
  ur: "اباظہ محمد پاشا"
  es: "Abaza Muhammad Pasha"
summary:
  ar: "أباظة محمد باشا، بيلربي مرعش، شارك في الحرب ضد الروس سنة 1183هـ/1769م، وقاد الجناح الأيمن في معركة قاغول ⁦(1 أغسطس 1770م)⁩، وعُزل بعد أن بدّد أموال التجنيد. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  en: "Abaza Muhammad Pasha, beylerbey of Marash, who served in the war against Russia from 1769, commanded the right wing at Kagul on 1 August 1770, and was later dismissed and exiled for squandering money raised for troops. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  fr: "Abaza Muhammad Pacha, beylerbey de Maraş, qui servit dans la guerre contre la Russie à partir de 1769, commanda l'aile droite à Kagul le 1er août 1770, et fut plus tard destitué et exilé pour avoir dilapidé l'argent destiné à lever des troupes. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  ur: "اباظہ محمد پاشا، مرعش کے بیلربی، جنہوں نے 1769ء سے روس کے خلاف جنگ میں حصہ لیا، 1 اگست 1770ء کو قاغول کی جنگ میں دائیں بازو کی کمان کی، اور بعد میں فوج کے لیے جمع کی گئی رقم اڑانے پر معزول اور جلاوطن ہوئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  es: "Abaza Muhammad Pasha, beylerbey de Marash, quien sirvió en la guerra contra Rusia desde 1769, comandó el ala derecha en Kagul el 1 de agosto de 1770, y posteriormente fue destituido y exiliado por malgastar el dinero recaudado para las tropas. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  tr: "Maraş Beylerbeyi Abaza Muhammed Paşa, Hicri 1183/Miladi 1769 yılında Ruslara karşı yapılan savaşa katılmış ve Kevsul Muharebesi'nde (1 Ağustos 1770) sağ kanadı yönetmiştir. Asker alımı için ayrılan fonları zimmetine geçirdiği gerekçesiyle görevden alınmıştır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  id: "Abaza Muhammad Pasha, Beylerbey dari Marash, berpartisipasi dalam perang melawan Rusia pada tahun 1183 H/1769 M, dan memimpin sayap kanan dalam Pertempuran Kagul (1 Agustus 1770 M). Ia dipecat setelah menyalahgunakan dana perekrutan. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
