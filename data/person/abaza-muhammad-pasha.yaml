summary:
  ar: "أباظة محمد باشا، بيلربي مرعش، شارك في الحرب ضد الروس سنة 1183هـ/1769م، وقاد الجناح الأيمن في معركة قاغول (1 أغسطس 1770م)، وعُزل بعد أن بدّد أموال التجنيد. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  en: "Abaza Muhammad Pasha, beylerbey of Marash, who served in the war against Russia from 1769, commanded the right wing at Kagul on 1 August 1770, and was later dismissed and exiled for squandering money raised for troops. {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
  ur: "اباظہ محمد پاشا، مرعش کے بیلربی، جنہوں نے 1769ء سے روس کے خلاف جنگ میں حصہ لیا، 1 اگست 1770ء کو قاغول کی جنگ میں دائیں بازو کی کمان کی، اور بعد میں فوج کے لیے جمع کی گئی رقم اڑانے پر معزول اور جلاوطن ہوئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 24}"
