  ar: "مستشرقة إسكتلندية من كامبريدج، مكتشفة الترجمة السريانية السينائية، اشترت في السويس سنة 1895 رقًّا طرسيًا ظهرت تحته أوراق قرآنية نشرتها مع ألفونس منگانا سنة 1914 {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
