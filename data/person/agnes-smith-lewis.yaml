class: person
label: { ar: "أغنس سميث لويس", en: "Agnes Smith Lewis", fr: "Agnes Smith Lewis", ur: "ایگنس اسمتھ لیوس", es: "Agnes Smith Lewis" }
summary:
  ar: "مستشرقة إسكتلندية من كامبريدج، مكتشفة الترجمة السريانية السينائية، اشترت في السويس سنة 1895 رقًّا طرسيًا ظهرت تحته أوراق قرآنية نشرتها مع ألفونس منگانا سنة 1914 {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  en: "Scottish Orientalist of Cambridge, discoverer of the Sinaitic Syriac version, who bought at Suez in 1895 a palimpsest whose under-text included Qur'anic leaves, published with Alphonse Mingana in 1914 {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  fr: "Orientaliste écossaise de Cambridge, découvreuse de la version syriaque sinaïtique, qui acheta à Suez en 1895 un palimpseste dont le texte sous-jacent comprenait des feuillets coraniques, publiés avec Alphonse Mingana en 1914 {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  ur: "کیمبرج کی اسکاٹش مستشرق، سینائی سریانی ترجمے کی دریافت کنندہ، جنہوں نے 1895ء میں سوئز سے ایک طِرس ⁦(پالمپسسٹ)⁩ خریدا جس کی زیریں تحریر میں قرآنی اوراق تھے، اور انہیں الفانس منگانا کے ساتھ 1914ء میں شائع کیا {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}۔"
  es: "Orientalista escocés de Cambridge, descubridor de la versión siríaca sinaítica, que compró en Suez en 1895 un palimpsesto cuyo texto subyacente incluía hojas coránicas, publicado con Alphonse Mingana en 1914 {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
  tr: "Cambridge'li İskoç bir oryantalist olan ve Süryani Sinaiçe çevirisini keşfeden kişi, 1895'te Süveyş'te Kur'an metinlerinin yer aldığı bir parşömen satın aldı ve bunu 1914'te Alphonse Mingana ile birlikte yayınladı {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 s. 6}."
  id: "Seorang orientalis Skotlandia dari Cambridge, penemu terjemahan Siria Sinaitik, membeli di Suez pada tahun 1895 sebuah perkamen yang berisi lembaran Al-Qur'an, yang kemudian diterbitkannya bersama Alphonse Mingana pada tahun 1914 {cite:mingana-lewis-leaves-from-three-ancient-qurans-1914 p. 6}."
