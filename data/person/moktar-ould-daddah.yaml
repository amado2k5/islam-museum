summary:
  ar: "سياسي موريتاني (1924–2003) من أسرة مرابطية في بوتلميت، أول موريتاني يحصل على شهادة جامعية (الحقوق، باريس)، شغل منصب أول رئيس وزراء للبلاد (1957–1961) وأول رئيس لها (1960–1978)، فأسّس الجمهورية الإسلامية الموريتانية عند الاستقلال وحكم بنظام الحزب الواحد تحت برنامج «الاشتراكية الإسلامية» وخاض حرب الصحراء الغربية، حتى أطاح به انقلاب عسكري في 10 يوليو 1978؛ وبعد السجن والمنفى في فرنسا عاد سنة 2001 وتوفي في باريس في 14 أكتوبر 2003."
  en: "Mauritanian politician (1924–2003) from a marabout family of Boutilimit, the first Mauritanian to hold a university degree (law, Paris), who served as the country's first prime minister (1957–1961) and first president (1960–1978), founding the Islamic Republic of Mauritania at independence, ruling through a one-party state under a programme of 'Islamic socialism', and fighting the Western Sahara war, until a military coup deposed him on 10 July 1978; after imprisonment and exile in France he returned in 2001 and died in Paris on 14 October 2003."
  ur: "موریتانی سیاست دان (1924ء–2003ء)، بوتیلمیت کے ایک مرابط خاندان سے؛ یونیورسٹی ڈگری (قانون، پیرس) پانے والے پہلے موریتانی؛ ملک کے پہلے وزیرِ اعظم (1957ء–1961ء) اور پہلے صدر (1960ء–1978ء) رہے، آزادی پر اسلامی جمہوریہ موریتانیہ کی بنیاد رکھی، یک جماعتی نظام اور «اسلامی اشتراکیت» کے پروگرام کے تحت حکومت کی اور مغربی صحارا کی جنگ لڑی، حتیٰ کہ 10 جولائی 1978ء کو فوجی بغاوت نے انھیں ہٹا دیا؛ قید اور فرانس میں جلاوطنی کے بعد 2001ء میں واپس آئے اور 14 اکتوبر 2003ء کو پیرس میں انتقال ہوا۔"
