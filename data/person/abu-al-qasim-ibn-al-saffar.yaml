label: { ar: "أبو القاسم ابن الصفار الأندلسي", en: "Abu al-Qasim Ibn al-Saffar al-Andalusi", ur: "ابو القاسم ابن الصفار اندلسی", fr: "Abu al-Qasim Ibn al-Saffar al-Andalusi" }
summary:
  ar: "رياضي وفلكي أندلسي من تلاميذ مسلمة المجريطي في قرطبة، انتقل إلى دانية، صاحب «تحفة الطلاب في العمل بالأسطرلاب» التي تُرجمت إلى اللاتينية نحو 1134م {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
  en: "Andalusian mathematician and astronomer, pupil of Maslama al-Majriti at Cordoba, who moved to Denia; author of Tuhfat al-tullab fi al-amal bil-asturlab, translated into Latin about 1134 {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
  ur: "اندلسی ریاضی دان اور ماہرِ فلکیات، قرطبہ میں مسلمہ المجریطی کے شاگرد، جو دانیہ منتقل ہوئے؛ «تحفۃ الطلاب فی العمل بالاسطرلاب» کے مصنف، جس کا تقریباً 1134ء میں لاطینی ترجمہ ہوا {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}۔"
  fr: "Mathématicien et astronome andalou, élève de Maslama al-Majriti à Cordoue, qui s'installa à Denia ; auteur du Tuhfat al-tullab fi al-amal bil-asturlab, traduit en latin vers 1134 {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
faith:
  - value: sunni
    basis: documented
    note: "Muslim basis is documented: he belonged to the Cordoban school of Maslama al-Majriti, taught and wrote in Arabic in al-Andalus, and is listed among the scholars of the Muslim nations in Sa'id al-Andalusi's Tabaqat al-umam {cite:bea-ibn-al-saffar}. The 'sunni' value is the museum's declared frame for an Andalusi scholar of the Sunni milieu; no personal madhhab is asserted beyond the record."
