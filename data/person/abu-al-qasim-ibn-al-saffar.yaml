summary:
  ar: "رياضي وفلكي أندلسي من تلاميذ مسلمة المجريطي في قرطبة، انتقل إلى دانية، صاحب «تحفة الطلاب في العمل بالأسطرلاب» التي تُرجمت إلى اللاتينية نحو 1134م {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
  en: "Andalusian mathematician and astronomer, pupil of Maslama al-Majriti at Cordoba, who moved to Denia; author of Tuhfat al-tullab fi al-amal bil-asturlab, translated into Latin about 1134 {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
  ur: "اندلسی ریاضی دان اور ماہرِ فلکیات، قرطبہ میں مسلمہ المجریطی کے شاگرد، جو دانیہ منتقل ہوئے؛ «تحفۃ الطلاب فی العمل بالاسطرلاب» کے مصنف، جس کا تقریباً 1134ء میں لاطینی ترجمہ ہوا {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}۔"
