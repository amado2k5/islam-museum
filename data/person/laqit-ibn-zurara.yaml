id: person/laqit-ibn-zurara
class: person
label: { ar: "لقيط بن زرارة" }
summary:
  ar: "أبو حنظلة لقيط بن زرارة بن عدس بن ثعلبة بن يربوع التميمي، سيد بني دارم؛ شهد يوم شعب جبلة على تميم والرباب فأقبل على برذون مجفف بديباج عليه سرج مذهب من سروج كسرى وكان أول عربي تجفف، وحجي بينه وبين شريح بن الأحوص فأقحم فرسه الجرف قائلاً «إن تقدم تُنحر أو تأخر تُعقر» فطعنه شريح فسقط مرتثاً، وجعل يقول عند موته «يا ليت شعري عنك دختنوس إذا أتاها خبر المرموس أتحلق القرون أم تميس لا بل تميس إنها عروس»، وجعل بنو عبس يضربونه وهو ميت فبلغ ذلك دختنوس فقالت «لقد ضربوا وجهاً عليه مهابة... فلو أنكم لقيتم لقيطاً صبرتم للأسنة والقنا» {cite:ansab-al-ashraf p. 30-31}."
  en: "Laqit ibn Zurara Abu Hanzhala, chief of Banu Darim; at Sha'b Jabala he rode the first caparisoned horse in Arab memory under a gilded Sasanian saddle, charged the ravine on his horse's 'advance or be hamstrung', was speared by Shurayh ibn al-Ahwas and died calling on his wife Dukhtanus {cite:ansab-al-ashraf p. 30-31}."
