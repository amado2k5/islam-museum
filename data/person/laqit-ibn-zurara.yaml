id: person/laqit-ibn-zurara
class: person
label: { ar: "لقيط بن زرارة" }
summary:
  ar: "أبو حنظلة لقيط بن زرارة بن عدس بن ثعلبة بن يربوع التميمي، سيد بني دارم؛ شهد يوم شعب جبلة على تميم والرباب فأقبل على برذون مجفف بديباج عليه سرج مذهب من سروج كسرى وكان أول عربي تجفف، وحجي بينه وبين شريح بن الأحوص فأقحم فرسه الجرف قائلاً «إن تقدم تُنحر أو تأخر تُعقر» فطعنه شريح فسقط مرتثاً، وجعل يقول عند موته «يا ليت شعري عنك دختنوس إذا أتاها خبر المرموس أتحلق القرون أم تميس لا بل تميس إنها عروس»، وجعل بنو عبس يضربونه وهو ميت فبلغ ذلك دختنوس فقالت «لقد ضربوا وجهاً عليه مهابة... فلو أنكم لقيتم لقيطاً صبرتم للأسنة والقنا» {cite:ansab-al-ashraf p. 30-31}."
  en: "Laqit ibn Zurara Abu Hanzhala, chief of Banu Darim; at Sha'b Jabala he rode the first caparisoned horse in Arab memory under a gilded Sasanian saddle, charged the ravine on his horse's 'advance or be hamstrung', was speared by Shurayh ibn al-Ahwas and died calling on his wife Dukhtanus {cite:ansab-al-ashraf p. 30-31}."
  es: "Laqit ibn Zurara Abu Hanzhala, jefe de Banu Darim; en Sha'b Jabala montó el primer caballo engalanado en la memoria árabe bajo una silla sasánida dorada, cargó contra el barranco en el 'avance o serás desgarrado' de su caballo, fue lanceado por Shurayh ibn al-Ahwas y murió llamando a su esposa Dukhtanus {cite:ansab-al-ashraf p. 30-31}."
  fr: "Laqit ibn Zurara Abu Hanzhala, chef des Banu Darim; à Sha'b Jabala, il monta le premier cheval caparaçonné de mémoire arabe sous une selle sassanide dorée, chargea le ravin sur l'« avance ou être entravé » de son cheval, fut transpercé par Shurayh ibn al-Ahwas et mourut en rendant visite à sa femme Dukhtanus {cite:ansab-al-ashraf p. 30-31}."
  ur: "بنو داریم کے سردار لقیط بن زرارہ ابو حنظلہ؛ شعب جبلہ میں اس نے عربی یادداشت کے پہلے گھوڑے پر سونے کی ساسانی کاٹھی کے نیچے سواری کی، اپنے گھوڑے کے 'آگے بڑھنے یا کٹے ہوئے' پر گھاٹی کو چارج کیا، شوریٰ ابن الاحواس نے نیزہ دیا اور اپنی بیوی دختنوس کو پکارتے ہوئے انتقال کر گئے۔ 30-31}۔"
  tr: "Banu Darim'in ustası Ebu Hanzala Laqit ibn Zurara ibn Adas ibn Thalaba ibn Yarbu' al-Tamimi, Tamim ve Rabab'a karşı Şa'b Ciblah gününe tanıklık etti. Brokarla kurutulmuş bir barduna yaklaştı, Hosrov'un altın eyerlerinden yapılmış bir eyerde. Kuruyan ilk Arap oydu. Şuray ibn el-Ahvas ile tartıştı; Şuray, atını kılıca soktu ve şöyle dedi: \"İlerlersen ya da gecikirsen, katledilecek.\" Shurayh onu bıçakladı ve titreyerek yere yığıldı. Öldüğünde, \"Keşke saçım senden olsaydı, Dakhtanus, marmosun haberi ona ulaştığında, boynuzlarını mı yoksa Tamis'i mi tıraş ederdin?\" Derdi. Banu Abs, o ölüyken onu dövmeye başladı ve Dakhtannus bunu duydu, \"Bir yüzü hayranlıkla çarptılar... Bir ile karşılaşsaydın, mızraklara ve mızraklara sabırlı olurdun.\" {alıntı:Ansab-al-Ashraf, s. 30-31}."
  id: "Abu Hanzala Laqit ibn Zurara ibn Adas ibn Thalaba ibn Yarbu' al-Tamimi, penguasa Banu Darim, menyaksikan hari Sha'b Jiblah melawan Tamim dan Rabab. Ia mendekati seorang bardun yang dikeringkan dengan brokat di atas pelana yang terbuat dari pelana berlapis emas milik Khosrow. Ia adalah orang Arab pertama yang kering. Ia berdebat dengan Shurayh ibn al-Ahwas, yang memasukkan kudanya ke dalam pedang, berkata, \"Jika kamu maju atau menunda, kamu akan dibantai tered.\" Shurayh menusuknya, dan dia jatuh gemetar. Saat kematiannya, dia berkata, \"Andai saja rambutku darimu, Dakhtanus, ketika kabar tentang marmos sampai padanya, apakah kamu akan mencukur tanduknya atau Tamis? Sebenarnya, Tamis, dia adalah pengantin.\" Banu Abs mulai memukulnya saat dia mati, dan Dakhtannus mendengar hal itu, berkata, \"Mereka telah memukul wajah dengan rasa kagum... Jika kau bertemu, kau akan sabar dengan tombak dan tombak itu.\" {cite:Ansab-al-Ashraf, hlm. 30-31}."
