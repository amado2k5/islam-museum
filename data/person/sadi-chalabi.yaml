summary:
  ar: "المولى سعد الدين عيسى بن أميز خان الحنفي المعروف بسعدي جلبي، أحد موالي الروم المشهورين بالعلم والدين والرياسة؛ كان أصله من ولاية قسطموني ثم دخل القسطنطينية مع والده ونشأ في طلب العلم ووصل إلى خدمة الساموني، ثم صار مدرساً بمدرسة محمود باشا بالقسطنطينية ثم سلطانية بروسا ثم صار قاضياً بالقسطنطينية ثم عُزل وأعيد إلى إحدى الثمان ثم صار مفتياً مدة طويلة؛ قال في الشقائق كان فائقاً على أقرانه في تدريسه وفي قضائه مرضي السيرة محمود الطريقة دقيق الافتعال مقبول الجواب مبتدئاً إلى الصواب طاهر اللسان لا يذكر أحداً إلا بخير، وكان قوي الحفظ جداً، وله رسائل وتعليقات وكتب حواشٍ مفيدة على تفسير البيضاوي متداولة بين العلماء وشرح مختصر مفيد للهداية، وبنى داراً للقراء بقرب داره بالقسطنطينية؛ توفي عند صلاة الجمعة ثاني عيد الفطر بعلة النقرس وأقيم مفتياً عوضه جاوي زاده {cite:shadharat-dhahab p. 678-679}."
  en: "Sa'di Chalabi — Kastamonu-born, trained in Constantinople to al-Samuni's service; Mahmud Pasha madrasa, then the Sultaniyya of Bursa, qadi of Constantinople, then long-serving mufti; 'superior to his peers, short on words, prompt to the right answer' — glosses on Baydawi's tafsir circulating among scholars, a short Hidaya sharh, a house for Qur'an readers beside his own; died at Friday prayer on the second day of 'Id al-Fitr [945] of gout, Jawizade succeeding him as mufti {cite:shadharat-dhahab p. 678-679}."
died: { edtf: "1539-04-05~", hijri: "0945-10-02~", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي عند صلاة الجمعة ثاني عيد الفطر 945 بعلة النقرس {cite:shadharat-dhahab p. 679}", sources: [source/shadharat-dhahab] }
