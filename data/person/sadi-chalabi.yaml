summary:
  ar: "المولى سعد الدين عيسى بن أميز خان الحنفي المعروف بسعدي جلبي، أحد موالي الروم المشهورين بالعلم والدين والرياسة؛ كان أصله من ولاية قسطموني ثم دخل القسطنطينية مع والده ونشأ في طلب العلم ووصل إلى خدمة الساموني، ثم صار مدرساً بمدرسة محمود باشا بالقسطنطينية ثم سلطانية بروسا ثم صار قاضياً بالقسطنطينية ثم عُزل وأعيد إلى إحدى الثمان ثم صار مفتياً مدة طويلة؛ قال في الشقائق كان فائقاً على أقرانه في تدريسه وفي قضائه مرضي السيرة محمود الطريقة دقيق الافتعال مقبول الجواب مبتدئاً إلى الصواب طاهر اللسان لا يذكر أحداً إلا بخير، وكان قوي الحفظ جداً، وله رسائل وتعليقات وكتب حواشٍ مفيدة على تفسير البيضاوي متداولة بين العلماء وشرح مختصر مفيد للهداية، وبنى داراً للقراء بقرب داره بالقسطنطينية؛ توفي عند صلاة الجمعة ثاني عيد الفطر بعلة النقرس وأقيم مفتياً عوضه جاوي زاده {cite:shadharat-dhahab p. 678-679}."
  en: "Sa'di Chalabi — Kastamonu-born, trained in Constantinople to al-Samuni's service; Mahmud Pasha madrasa, then the Sultaniyya of Bursa, qadi of Constantinople, then long-serving mufti; 'superior to his peers, short on words, prompt to the right answer' — glosses on Baydawi's tafsir circulating among scholars, a short Hidaya sharh, a house for Qur'an readers beside his own; died at Friday prayer on the second day of 'Id al-Fitr [945] of gout, Jawizade succeeding him as mufti {cite:shadharat-dhahab p. 678-679}."
  es: "Sa'di Chalabi — nacido en Kastamonu, formado en Constantinopla al servicio de al-Samuni; madrasa de Mahmud Pasha, luego Sultaniyya de Bursa, cadí de Constantinopla, luego muftí de larga trayectoria; 'superior a sus pares, de pocas palabras, rápido para la respuesta correcta' — glosas sobre el tafsir de Baydawi que circulan entre los eruditos, un breve Hidaya sharh, una casa para lectores del Corán junto a la suya; murió en la oración del viernes del segundo día de 'Eid al-Fitr [945] de gota, Jawizade lo sucedió como muftí {cite:shadharat-dhahab p. 678-679}."
  fr: "Sa'di Chalabi — né à Kastamonu, formé à Constantinople au service d'al-Samuni; madrasa Mahmud Pacha, puis Sultaniyya de Bursa, cadi de Constantinople, puis mufti de longue date; « supérieur à ses pairs, concis, prompt à donner la bonne réponse » — glose sur le tafsir de Baydawi circulant parmi les savants, un court Hidaya sharh, une maison pour les lecteurs du Coran à côté de la sienne; mourut à la prière du vendredi le deuxième jour de l'Aïd al-Fitr [945] de la goutte, Jawizade lui succédant comme mufti {cite: shadharat-dhahab p. 678-679}."
  ur: "سعدی چلبی — کسطامونو میں پیدا ہوا، قسطنطنیہ میں السمونی کی خدمت میں تربیت یافتہ؛ محمود پاشا مدرسہ، پھر برسا کی سلطانیہ، قسطنطنیہ کے قاضی، پھر طویل خدمت کرنے والے مفتی؛ 'اپنے ساتھیوں سے برتر، الفاظ میں مختصر، صحیح جواب دینے کے لیے فوری' - علماء میں گردش کرنے والی بیضاوی کی تفسیر پر چمک، ایک مختصر ہدایہ شارح، قرآن پڑھنے والوں کے لیے ان کے اپنے پاس ایک مکان؛ عید الفطر کے دوسرے دن جمعہ کی نماز کے وقت گاؤٹ کی وجہ سے وفات پاگئے، جاوید زادے ان کے بعد مفتی مقرر ہوئے۔ 678-679}۔"
  tr: "Mawla Saad al-Din Isa ibn Amiz Khan al-Hanafi, Saadi Celabi olarak bilinir, bilgisi, dini ve liderliğiyle ünlü Roma mevalilerinden biriydi; aslen Kastemonia eyaletindendi, sonra babasıyla birlikte Konstantinopolis'e girdi, bilgi peşinde büyüdü ve Samouni'nin hizmetine ulaştı. Daha sonra Mahmud Paşa'nın İstanbul'daki okulunda öğretmen oldu, ardından Prusya Sultanlığı oldu, ardından Konstantinopolis'te yargıç oldu, görevden alındı, yeniden görevine getirildi ve uzun süre müftü olarak görev yaptı. Al-Shaqa'iq'ta öğretim ve yargıda akranlarından üstün olduğunu, yargısında ise iyi bir davranışa sahip olduğunu söyledi. Yöntem kesin, uydurma ve doğru yaklaşımla başlayarak kabul edilebilir bir cevaptır. Diliyle saftır ve sadece iyi olmaktan bahseder. Çok ezberleyiciydi. Al-Baydawi'nin Tafsir'i üzerine alimler arasında dolaşan mektuplar, tefsirler ve faydalı notlar yazdı; ayrıca rehberliğe dair kısa ve faydalı bir tefsir de ekledi. İstanbul'daki evinin yakınında bir evi inşa etti; Bayram Bayramı'nın ikinci günü Cuma namazında gut hastalığından öldü ve yerine bir müfti atandı {atıf:shadharat-dhahab, s. 678-679}."
  id: "Mawla Saad al-Din Isa ibn Amiz Khan al-Hanafi, yang dikenal sebagai Saadi Jalabi, adalah salah satu mawali Romawi yang terkenal karena pengetahuan, agama, dan kepemimpinannya; asalnya dari provinsi Castesemonia, kemudian ia masuk ke Konstantinopel bersama ayahnya, tumbuh dalam pencarian ilmu, dan melayani Samouni. Ia kemudian menjadi guru di sekolah Mahmoud Pasha di Konstantinopel, kemudian Kesultanan Prusia, kemudian menjadi hakim di Konstantinopel, diberhentikan, diangkat kembali, dan menjabat sebagai mufti dalam waktu yang lama. Ia mengatakan dalam Al-Shaqa'iq bahwa ia unggul dibandingkan rekan-rekannya dalam pengajaran dan peradilan, dan dalam kehakimannya, Mahmoud memiliki perilaku yang baik. Metodenya tepat, dibuat-buat, dan jawabannya dapat diterima, dimulai dengan pendekatan yang benar. Ia berbahasa murni dan hanya menyebutkan yang baik. Ia sangat mudah menghafal. Ia menulis surat, komentar, dan catatan berguna tentang Tafsir Al-Baydawi yang beredar di antara para cendekiawan, serta komentar singkat dan berguna tentang bimbingan. Ia membangun rumah untuk pembaca di dekat rumahnya di Konstantinopel; ia meninggal saat salat Jumat pada hari kedua Idul Fitri karena asam urat, dan seorang mufti diangkat menggantikannya {cite:shadharat-dhahab, hlm. 678-679}."
