gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل الكوفة يذكرها ابن الجوزي في «صفة الصفوة» بين عابدات الكوفة، كان سفيان الثوري وابن المبارك يزورونها، فلما اقترح عليها الثوري أن تكتب إلى بني عمها ليغيّروا سوء حالها قالت إنها لا تسأل الدنيا من يملكها فكيف تسألها من لا يملكها؛ وبلغ ابن المبارك أن سفيان تزوجها."
  en: "A devout woman of Kufa whom Ibn al-Jawzi lists in Sifat al-Safwa among the women ascetics of Kufa. Sufyan al-Thawri and Ibn al-Mubarak used to visit her; when al-Thawri suggested she write to her cousins to relieve her poverty, she said she did not ask the world even of its Owner, so how could she ask it of those who do not own it. Ibn al-Mubarak heard that Sufyan later married her."
  es: "Una mujer devota de Kufa, a quien Ibn al-Jawzi menciona en Sifat al-Safwa entre las ascetas de Kufa. Sufyan al-Thawri e Ibn al-Mubarak solían visitarla; cuando al-Thawri le sugirió que escribiera a sus primos para aliviar su pobreza, ella respondió que no le pedía nada al mundo ni siquiera a su Dueño, así que ¿cómo podría pedírselo a quienes no lo poseen? Ibn al-Mubarak supo que Sufyan se casó con ella más tarde."
  fr: "Une femme pieuse de Koufa, mentionnée par Ibn al-Jawzi dans son ouvrage Sifat al-Safwa parmi les ascètes de Koufa. Sufyan al-Thawri et Ibn al-Mubarak venaient lui rendre visite. Lorsqu'al-Thawri lui suggéra d'écrire à ses cousins pour soulager sa pauvreté, elle répondit qu'elle ne demandait rien au monde, même à son Maître, et qu'il lui était donc impossible de le demander à ceux qui n'en étaient pas propriétaires. Ibn al-Mubarak apprit que Sufyan l'épousa plus tard."
  ur: "کوفہ کی ایک پرہیزگار خاتون جس کو ابن الجوزی نے صفات الصفوی میں کوفہ کی عورتوں میں سے ذکر کیا ہے۔ سفیان الثوری اور ابن المبارک ان کے پاس جایا کرتے تھے۔ جب الثوری نے مشورہ دیا کہ وہ اپنی غربت دور کرنے کے لیے اپنے کزنز کو لکھے تو اس نے کہا کہ اس نے دنیا سے اس کے مالک سے بھی نہیں پوچھا تو وہ ان سے کیسے پوچھ سکتی ہے جو اس کے مالک نہیں ہیں۔ ابن مبارک نے سنا کہ سفیان نے بعد میں اس سے شادی کر لی۔"
  tr: "Kufe'den bir ibadet eden, İbn al-Jawzi'nin 'Sifat al-Safwa' adlı eserinde Kufe'ye ibadet edenler arasında bahsettiği bir ibadet eden. Sufyan al-Thawri ve İbn al-Mubarek onu ziyaret ederdi. El-Thevri, kötü durumunu değiştirmesi için kuzenlerine yazmasını önerdiğinde, dünyaya kimin sahip olduğunu sormadığını, o halde dünyanın kim sahip olmadığını nasıl sorabileceğini söyledi. İbn el-Mübarek, Sufyan'ın kendisiyle evlendiğini öğrendi."
  id: "Seorang penyembah dari Kufa yang disebutkan oleh Ibn al-Jawzi dalam 'Sifat al-Safwa' di antara para pemuja Kufa. Sufyan al-Thawri dan Ibn al-Mubarak biasa mengunjunginya. Ketika al-Thawri menyarankan agar dia menulis surat kepada sepupunya untuk mengubah kondisinya, dia mengatakan dia tidak bertanya kepada dunia siapa yang memilikinya, jadi bagaimana dunia bisa bertanya siapa yang tidak memilikinya? Ibn al-Mubarak mengetahui bahwa Sufyan telah menikahinya."
