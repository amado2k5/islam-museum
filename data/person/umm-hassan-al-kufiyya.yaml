summary:
  ar: "عابدة من أهل الكوفة يذكرها ابن الجوزي في «صفة الصفوة» بين عابدات الكوفة، كان سفيان الثوري وابن المبارك يزورونها، فلما اقترح عليها الثوري أن تكتب إلى بني عمها ليغيّروا سوء حالها قالت إنها لا تسأل الدنيا من يملكها فكيف تسألها من لا يملكها؛ وبلغ ابن المبارك أن سفيان تزوجها."
  en: "A devout woman of Kufa whom Ibn al-Jawzi lists in Sifat al-Safwa among the women ascetics of Kufa. Sufyan al-Thawri and Ibn al-Mubarak used to visit her; when al-Thawri suggested she write to her cousins to relieve her poverty, she said she did not ask the world even of its Owner, so how could she ask it of those who do not own it. Ibn al-Mubarak heard that Sufyan later married her."
