  en: "Murra ibn Ali al-Rudhayni al-Ijli; in al-Baladhuri set over Sisar in al-Rashid's last days — Uthman al-Awdi could not wrest it while Murra took most of Adharbayjan from him — paying its kharaj on muqata'a under al-Amin until the fitna."
