id: person/murra-ibn-ali-al-rudhayni
class: person
label: { ar: "مرة بن علي الرديني", en: "Murra ibn Ali al-Rudhayni", es: "Murra ibn Ali al-Rudhayni", fr: "Murra ibn Ali al-Rudhayni", ur: "مرہ ابن علی الردعینی" }
summary:
  ar: "مرة بن علي الرديني العجلي؛ عند البلاذري وجهه الرشيد في آخر أيامه على سيسر فحاول عثمان الأودي مغالبته عليها فلم يقدر وغلبه على ما كان في يده من أذربيجان أو أكثره وظل يؤدي خراج سيسر في أيام محمد بن الرشيد على مقاطعة حتى وقعت الفتنة."
  en: "Murra ibn Ali al-Rudhayni al-Ijli; in al-Baladhuri set over Sisar in al-Rashid's last days — Uthman al-Awdi could not wrest it while Murra took most of Adharbayjan from him — paying its kharaj on muqata'a under al-Amin until the fitna."
  es: "Murra ibn Ali al-Rudhayni al-Ijli; en al-Baladhuri se estableció sobre Sisar en los últimos días de al-Rashid (Uthman al-Awdi no pudo arrebatárselo mientras Murra le quitó la mayor parte de Adharbayjan) pagando su kharaj en muqata'a bajo al-Amin hasta la fitna."
  fr: "Murra ibn Ali al-Rudhayni al-Ijli; à al-Baladhuri réglé sur Sisar dans les derniers jours d'al-Rashid - Uthman al-Awdi n'a pas pu l'arracher tandis que Murra lui a pris la majeure partie d'Adharbayjan - payant son kharaj sur muqata'a sous al-Amin jusqu'à la fitna."
  ur: "مرہ ابن علی الردعینی الاجلی؛ الرشید کے آخری ایام میں البلادوری نے سیسار پر قائم کیا - عثمان العودی اس کو نہیں چھیڑ سکا جب کہ مرہ نے زیادہ تر ادربائیجان اس سے لے لیا - فتنے تک الامین کے ماتحت مقتعہ پر اس کا خرج ادا کیا۔"
  tr: "Murra bin Ali el-Rudayni el-'Acli; el-Beledhuri ile birlikte el-Reşid, son günlerinde Sisar'a yöneldi. Osman el-Avdi onu alt etmeye çalıştı ancak başaramadı; Azerbaycan'dan ya da daha fazlasını aştı. Muhammed bin el-Reşid döneminde bir bölgede Sisar'ın vergisini ödemeye devam etti, ta ki isyan patlak verene kadar."
  id: "Murrah ibn Ali al-Rudayni al-'Ajli; bersama al-Baladhuri, al-Rashid mengalihkan perhatiannya ke Sisar di hari-hari terakhirnya. Uthman al-Awdi mencoba mengalahkannya tetapi gagal, dan ia berhasil mengalahkan apa yang ia miliki dari Azerbaijan atau lebih. Ia terus membayar upeti kepada Sisar pada masa Muhammad ibn al-Rashid di sebuah distrik hingga pecahnya pemberontakan."
