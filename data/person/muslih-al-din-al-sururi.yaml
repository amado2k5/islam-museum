summary:
  ar: "مصطفى بن شعبان الحنفي الرومي، مصلح الدين، المعروف بسروري، فاضل تركي ولد بكليبولي وأخذ عن طاشكبري زاده، له حواش على تفسير البيضاوي وشرح ناقص للبخاري وكتب بالتركية، توفي سنة 969 هـ ودفن في إستانبول."
  en: "Mustafa ibn Sha'ban, a Hanafi of Rum, Muslih al-Din, known as Sururi, a Turkish scholar born in Gallipoli who studied under Tashkoprizade; author of glosses on al-Baydawi's exegesis, an unfinished commentary on al-Bukhari and books in Turkish; died 969 AH (1562) and was buried in Istanbul."
  es: "Mustafa ibn Sha'ban, un hanafí de Rum, Muslih al-Din, conocido como Sururi, fue un erudito turco nacido en Gallipoli que estudió con Tashkoprizade; autor de glosas sobre la exégesis de al-Baydawi, un comentario inacabado sobre al-Bukhari y libros en turco; murió en el año 969 de la Hégira (1562) y fue enterrado en Estambul."
  fr: "Mustafa ibn Sha'ban, un Hanafi de Rum, Muslih al-Din, connu sous le nom de Sururi, un érudit turc né à Gallipoli qui a étudié sous Tashkoprizade; auteur de gloses sur l'exégèse d'al-Baydawi, d'un commentaire inachevé sur al-Bukhari et de livres en turc; mort en 969 AH (1562) et enterré à Istanbul."
