summary:
  ar: "أبو طالب بن عبد السميع، عبد الرحمن بن محمد بن عبد السميع بن أبي تمام الواسطي، المقرئ المعدل، قرأ القراءات على عبد العزيز السماتي وسمع ببغداد وصنف وعني بالحديث، توفي في المحرم سنة 621 هـ عن ثلاث وثمانين سنة {cite:shadharat-dhahab vol. 7 p. 167}."
  en: "Abu Talib ibn Abd al-Sami', Abd al-Rahman ibn Muhammad ibn Abd al-Sami' ibn Abi Tamam al-Wasiti, a Qur'an reciter and accredited notary witness who read the readings under Abd al-Aziz al-Samati, heard from teachers in Baghdad and wrote several works; he died in Muharram 621 AH aged eighty-three {cite:shadharat-dhahab vol. 7 p. 167}."
  es: "Abu Talib ibn Abd al-Sami', Abd al-Rahman ibn Muhammad ibn Abd al-Sami' ibn Abi Tamam al-Wasiti, recitador del Corán y testigo notario acreditado que leía las lecturas bajo la dirección de Abd al-Aziz al-Samati, recibió enseñanzas de maestros en Bagdad y escribió varias obras; murió en Muharram del año 621 de la Hégira a la edad de ochenta y tres años {cite:shadharat-dhahab vol. 7 p. 167}."
  fr: "Abu Talib ibn Abd al-Sami', Abd al-Rahman ibn Muhammad ibn Abd al-Sami' ibn Abi Tamam al-Wasiti, récitateur du Coran et témoin notarié accrédité qui a lu les lectures sous Abd al-Aziz al-Samati, a entendu des enseignants à Bagdad et a écrit plusieurs ouvrages; il est mort en Muharram 621 AH à l'âge de quatre-vingt-trois ans {cite: shadharat-dhahab vol. 7 p. 167}."
  ur: "ابو طالب ابن عبدالسمیع، عبدالرحمٰن بن محمد بن عبدالسمیع ابن ابی تمام الوصطی، ایک قرآنی قاری اور تسلیم شدہ نوٹری گواہ جنہوں نے عبد العزیز السماتی کے ماتحت قراء ت پڑھی، بغداد میں اساتذہ سے سنا اور متعدد تصانیف لکھیں۔ آپ کی وفات محرم 621ھ میں تراسی سال کی عمر میں ہوئی۔ 7 ص۔ 167}۔"
