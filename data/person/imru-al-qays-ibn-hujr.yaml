summary:
  ar: "امرؤ القيس بن حجر الكندي، أشهر شعراء الجاهلية وصاحب إحدى المعلقات؛ طرده أبوه حجر لقوله الشعر فكان يسير في أحياء العرب يشرب الخمر ويتصيد، فلما أتاه نعي أبيه وهو يشرب ويلعب النرد بدمون من أرض اليمن قال «ضيعني صغيراً وحملني دمه كبيراً، لأصحو اليوم ولأسكر غداً، اليوم خمر وغداً أمر» فذهبت مثلاً، وحرم على نفسه الخمر والنساء حتى يقتل من بني أسد مائة ويطلق مائة، فاستنصر بكراً وتغلب فأجاباه حتى وضع السلاح في بني كنانة يظنهم بني أسد، ثم استمد حمير وأزد شنوءة، ولما طلبه المنذر صاحب الحيرة تفرق عنه أصحابه فنزل على السموأل بن عادياء اليهودي بقلعة الأبلق وأودعه أهله وأدراعه وكتب له إلى الحارث بن أبي شمر الغساني ليوصله إلى قيصر يستنصره على ثأر أبيه {cite:kamil-ibn-al-athir p. 384-385}."
  en: "Imru' al-Qays ibn Hujr al-Kindi, the most celebrated of the jahili poets and author of a Mu'allaqa: banished by his father for poetry, he was drinking and playing nard at Damun when word came of Hujr's death — 'he ruined me young and loaded me with his blood grown; today wine, tomorrow the affair' — and swore off wine and women until he had slain a hundred of Banu Asad; when al-Mundhir of al-Hira pursued him he lodged his family and armour with Samaw'al ibn Adiya at al-Ablaq and went on to seek Byzantine help {cite:kamil-ibn-al-athir p. 384-385}."
  es: "Imru' al-Qays ibn Hujr al-Kindi, el más célebre de los poetas jahili y autor de un Mu'allaqa: desterrado por su padre por su poesía, estaba bebiendo y jugando al nardo en Damun cuando llegó la noticia de la muerte de Hujr —'me arruinó joven y me llenó con su sangre madura; hoy vino, mañana el asunto'— y juró no beber vino ni comer mujeres hasta haber matado a cien Banu Asad; cuando al-Mundhir de al-Hira lo persiguió, alojó a su familia y su armadura con Samaw'al ibn Adiya en al-Ablaq y se fue a buscar ayuda bizantina {cite:kamil-ibn-al-athir p. 384-385}."
  fr: "Imru' al-Qays ibn Hujr al-Kindi, le plus célèbre des poètes jahili et auteur d'une Mu'allaqa: banni par son père pour sa poésie, il buvait et jouait au nard à Damun lorsque la nouvelle de la mort de Hujr parvint — « il m'a ruiné jeune et m'a chargé de son sang devenu adulte; aujourd'hui le vin, demain l'affaire » — et jura de ne plus boire de vin ni de femmes jusqu'à ce qu'il ait tué une centaine de Banu Asad; lorsque al-Mundhir d'al-Hira le poursuivit, il logea sa famille et ses armes chez Samaw'al ibn Adiya à al-Ablaq et partit chercher l'aide byzantine {cite:kamil-ibn-al-athir p. 384-385}."
  ur: "عمرو القیس ابن حجر الکندی، جاہلی شاعروں میں سب سے مشہور اور ایک معلق کا مصنف: اس کے والد کی طرف سے شاعری کی وجہ سے جلاوطن کیا گیا، جب حجر کی موت کی خبر آئی تو وہ دمون میں شراب پی رہا تھا اور نارڈ کھیل رہا تھا - 'اس نے مجھے جوان کر دیا اور مجھے اپنے خون سے لاد دیا۔ آج شراب، کل معاملہ'' - اور شراب اور عورتوں کی قسم کھائی یہاں تک کہ بنو اسد کے سو افراد کو قتل کر دیا۔ جب الحیرہ کے المنذر نے اس کا تعاقب کیا تو اس نے اپنے اہل خانہ اور زرہ بکتر کو سماوئل بن عدیہ کے پاس الابلق میں رکھا اور بازنطینی مدد لینے کے لیے آگے بڑھا۔ 384-385}۔"
