summary:
  ar: "مصور صحفي فلسطيني (وُلد سنة 1999) من دير البلح في قطاع غزة، وثّق الحرب على غزة عبر إنستغرام منذ أكتوبر 2023 فوصلت صوره إلى عشرات الملايين؛ اختارته GQ الشرق الأوسط «رجل العام» 2023، وأدرجته مجلة تايم في قائمة المئة الأكثر تأثيراً سنة 2024، وكان أحد أربعة صحفيين فلسطينيين رُشحوا لجائزة نوبل للسلام 2024."
  en: "Palestinian photojournalist (born 1999) from Deir al-Balah in the Gaza Strip, whose Instagram documentation of the Gaza war from October 2023 reached tens of millions; GQ Middle East named him its 2023 Man of the Year, Time listed him among the 100 most influential people of 2024, and he was one of four Palestinian journalists nominated for the 2024 Nobel Peace Prize."
  ur: "فلسطینی فوٹو جرنلسٹ (پیدائش 1999) جن کا تعلق غزہ کی پٹی کے دیر البلح سے ہے؛ اکتوبر 2023 سے انسٹاگرام پر جنگ کی دستاویز سازی نے انہیں دنیا بھر میں شہرت دی؛ ٹائم میگزین کی 2024 کی سو بااثر شخصیات میں شامل ہوئے اور 2024 کے نوبل امن انعام کے لیے نامزد چار فلسطینی صحافیوں میں سے ایک تھے۔"
