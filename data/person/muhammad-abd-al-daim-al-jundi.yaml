summary:
  ar: "الأمين العام لمجمع البحوث الإسلامية بالأزهر الشريف، كتب تصدير طبعة «أصول التربية والتعليم في القرآن الكريم والسنة النبوية» بتاريخ 18 جمادى الأولى 1447هـ، الموافق 9 نوفمبر 2025م {cite:usul-al-tarbiya-azhar p. 10}."
  en: "Secretary-General of the Islamic Research Academy of al-Azhar. He wrote the preface to the 2025 edition of al-Bari's treatise, dated 18 Jumada I 1447 AH (9 November 2025 CE) (p. 10)."
  es: "Secretario General de la Academia de Investigación Islámica de al-Azhar. Escribió el prefacio de la edición de 2025 del tratado de al-Bari, fechado el 18 de Jumada I de 1447 AH (9 de noviembre de 2025 d. C.) (pág. 10)."
  fr: "Secrétaire général de l'Académie de recherche islamique d'al-Azhar. Il a écrit la préface de l'édition 2025 du traité d'al-Bari, datée du 18 Jumada I 1447 AH (9 novembre 2025 CE) (p. 10)."
  ur: "اسلامک ریسرچ اکیڈمی الازہر کے سیکرٹری جنرل۔ انہوں نے الباری کے مقالے کے 2025 ایڈیشن کا پیش لفظ، مورخہ 18 جمادی الثانی 1447 ہجری ⁦(9 نومبر 2025 عیسوی)⁩ ⁦(ص 10)⁩ لکھا۔"
  tr: "El-Ezher-Şerif İslami Araştırmalar Akademisi Genel Sekreteri, 18 Cumade-avvel 1447 Hicri Doğum tarihli \"Kutsal Kuran-ı Kerim ve Peygamber Sünnetinde Eğitimin Temelleri\" adlı eserin önsözünü yazdı ve 9 Kasım 2025 M.S. tarihine karşılık geldi {atıf:usul-al-tarbiya-azhar, s. 10}."
  id: "Sekretaris Jenderal Akademi Riset Islam di Al-Azhar Al-Sharif menulis kata pengantar untuk edisi \"Dasar-dasar Pendidikan dalam Al-Qur'an dan Sunnah Kenabian\" tertanggal 18 Jumada al-Awwal 1447 H, yang bertepatan dengan 9 November 2025 M {cite:usul-al-tarbiya-azhar, hlm. 10}."
