summary:
  ar: "لاعب كرة قدم فرنسي، وُلد في باريس سنة 1991 لأبوين ماليَّين؛ لاعب وسط دفاعي يُعدّ من أعظم لاعبي مركزه: فاز بالدوري الإنجليزي مع ليستر سيتي (2016) ثم مع تشيلسي (2017) — أول لاعب ميداني يفوز بلقبين متتاليين مع ناديين مختلفين منذ إريك كانتونا — وبدوري أبطال أوروبا مع تشيلسي (2021)، وبكأس العالم مع فرنسا (2018)، ثم انتقل إلى الاتحاد السعودي (2023) وفاز معه بالدوري وكأس الملك (2025)."
  en: "French professional footballer, born in Paris in 1991 to Malian parents. A defensive midfielder regarded as one of the greatest in his position: he won the Premier League with Leicester City (2016) and then Chelsea (2017) — the first outfield player to win consecutive English titles with different clubs since Eric Cantona — the UEFA Champions League with Chelsea (2021), and the World Cup with France (2018), before joining Saudi club Al-Ittihad (2023), with whom he won the league and King's Cup double (2025)."
  ur: "فرانسیسی پیشہ ور فٹبالر، 1991 میں پیرس میں مالی والدین کے ہاں پیدا ہوئے؛ دفاعی مڈفیلڈر جنھیں اپنے مقام کے عظیم ترین کھلاڑیوں میں شمار کیا جاتا ہے: لیسٹر سٹی (2016) اور پھر چیلسی (2017) کے ساتھ پریمیئر لیگ جیتی — ایرک کینٹونا کے بعد مختلف کلبوں کے ساتھ مسلسل دو انگریزی خطاب جیتنے والے پہلے آؤٹ فیلڈ کھلاڑی — چیلسی کے ساتھ یوئیفا چیمپئنز لیگ (2021) اور فرانس کے ساتھ ورلڈ کپ (2018) جیتا، پھر سعودی کلب الاتحاد (2023) میں شامل ہوئے جس کے ساتھ لیگ و کنگز کپ کی ڈبل (2025) جیتی۔"
