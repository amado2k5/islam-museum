id: person/abd-allah-ibn-amir
class: person
label: { ar: "عبد الله بن عامر", en: "Abd Allah ibn Amir", fr: "Abd Allah ibn Amir", es: "Abd Allah ibn Amir", ur: "عبداللہ بن عامر" }
summary:
  ar: "قدم البصرة في سنة ثلاثين، ثم خرج إلى فارس فافتتحها، وسيّر مجاشع بن مسعود في أثر يزدجرد {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. وذكر الفهرس شخوصه إلى خراسان وما قام به من فتوح في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581} وعند البلاذري قدم البصرة سنة 29 وقد افتتحت فارس كلها إلا إصطخر وجور."
  en: "He came to Basra in the year 30 AH, then went out to Fars and conquered it, and sent Mujashi' ibn Mas'ud in pursuit of Yazdegerd {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. The index records his march to Khurasan and the conquests he made there in 31 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.581}. According to al-Baladhuri, he came to Basra in the year 29, when all of Fars had been conquered except Istakhr and Jur."
  fr: "Il vint à Bassora en l'an 30 H, puis partit pour le Fars et le conquit, et envoya Mujashi' ibn Mas'ud à la poursuite de Yazdegerd {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. L'index consigne sa marche vers le Khorassan et les conquêtes qu'il y fit en 31 H {cite:tabari-tarikh-abu-al-fadl j.4 p.581}. Selon al-Baladhuri, il vint à Bassora en l'an 29, alors que tout le Fars avait été conquis sauf Istakhr et Jur."
  es: "Llegó a Basora en el año 30 AH, luego salió a Fars y la conquistó, y envió a Mujashi' ibn Mas'ud en persecución de Yazdegerd {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. El índice registra su marcha a Jorasán y las conquistas que realizó allí en el año 31 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.581}. Según al-Baladhuri, llegó a Basora en el año 29, cuando todo Fars había sido conquistado excepto Istakhr y Jur."
  ur: "وہ 30 ہجری میں بصرہ آیا، پھر فارس کی طرف نکلا اور اسے فتح کیا، اور مجاشی ابن مسعود کو یزدگرد کے تعاقب میں بھیجا۔ انڈیکس میں خراسان کی طرف اس کے مارچ اور وہاں پر 31 ہجری میں کی جانے والی فتوحات کو درج کیا گیا ہے۔ بلادوری کے مطابق وہ 29 میں بصرہ آیا جب استخار اور جور کے علاوہ تمام فارس فتح ہو چکا تھا۔"
