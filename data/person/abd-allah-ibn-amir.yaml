label: { ar: "عبد الله بن عامر", en: "Abd Allah ibn Amir" }
summary:
  ar: "قدم البصرة في سنة ثلاثين، ثم خرج إلى فارس فافتتحها، وسيّر مجاشع بن مسعود في أثر يزدجرد {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. وذكر الفهرس شخوصه إلى خراسان وما قام به من فتوح في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581} وعند البلاذري قدم البصرة سنة 29 وقد افتتحت فارس كلها إلا إصطخر وجور."
  en: "He came to Basra in the year 30 AH, then went out to Fars and conquered it, and sent Mujashi' ibn Mas'ud in pursuit of Yazdegerd {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. The index records his march to Khurasan and the conquests he made there in 31 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.581}. According to al-Baladhuri, he came to Basra in the year 29, when all of Fars had been conquered except Istakhr and Jur."
