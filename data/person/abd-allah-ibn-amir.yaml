summary:
  ar: "قدم البصرة في سنة ثلاثين، ثم خرج إلى فارس فافتتحها، وسيّر مجاشع بن مسعود في أثر يزدجرد {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. وذكر الفهرس شخوصه إلى خراسان وما قام به من فتوح في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581} وعند البلاذري قدم البصرة سنة 29 وقد افتتحت فارس كلها إلا إصطخر وجور."
