summary:
  ar: "بطاقة أولية لعبد العزيز بن عمر ابن فهد المكي المعروف بالعز، محدث ومؤرخ مكة القرن السادس عشر، توفي سنة ١٥١٥م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abd al-Aziz ibn Umar Ibn Fahd al-Makki known as al-'Izz, the sixteenth-century muhaddith and historian of Mecca, d. 1515; the source entry is not yet checked on the page."
  es: "Ficha de borrador para Abd al-Aziz ibn Umar Ibn Fahd al-Makki, conocido como al-'Izz, el muhaddith e historiador de La Meca del siglo XVI, fallecido en 1515; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de projet pour Abd al-Aziz ibn Umar Ibn Fahd al-Makki, connu sous le nom d'al-'Izz, le muhaddith et historien de La Mecque du XVIe siècle, mort en 1515; la source n'est pas encore vérifiée sur la page."
  ur: "عبد العزیز ابن عمر ابن فہد المکی کے لیے ڈرافٹ کارڈ جسے العز کے نام سے جانا جاتا ہے، سولہویں صدی کے محدث اور مکہ کے مورخ، ڈی۔ 1515; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "On altıncı yüzyılda Mekke'nin hadis âlimi ve tarihçisi olan Abdul Aziz bin Umar bin Fahd el-Makki'nin ön kartı 1515 yılında ölmüştür; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Abdul Aziz bin Umar bin Fahd al-Makki, yang dikenal sebagai Al-Izz, seorang ulama hadis dan sejarawan Mekah pada abad keenam belas, meninggal pada tahun 1515 M; buku biografi menyebutnya, dan biografinya belum pernah diulas di halaman tersebut."
