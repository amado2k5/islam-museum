summary:
  ar: "أبو القاسم نصر بن أحمد الخبزأرزي البصري الشاعر؛ كان أمياً لا يتهجى ولا يكتب وكان يخبز خبز الأرز بموضع بالبصرة في دكان، وكان ينشد أشعاره على الغزل والناس يزدحمون عليه ويتبركون باستماع شعره ويندهشون من حاله وأمره، وكان أبو الحسين محمد بن أحمد المعروف بابن لنكك البصري الشاعر ينتاب دكانه ليسمع شعره واعتنى به وجمع له ديواناً؛ وذكره الخطيب في تاريخه وروى عنه المعافى بن زكريا النهرواني وأحمد بن منصور النوشري، وذكره الخالديان في كتابهما {cite:wafayat-ayan}."
  en: "Nasr b. Ahmad al-Khubzaruzzi — the illiterate rice-bread baker of Basra whose ghazal drew crowds to his shop; the poet Ibn Lankak frequented his oven and compiled his diwan {cite:wafayat-ayan}."
