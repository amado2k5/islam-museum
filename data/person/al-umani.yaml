label: { ar: "العماني الشاعر", en: "al-'Umani", fr: "al-'Umani", es: "al-'Umani", ur: "العمانی" }
summary:
  ar: "شاعر قام بحضرة الرشيد خطيباً يقرظ محمداً الأمين ويحرضه على تجديد العهد له، فلما قال له أبشر بولاية العهد قال أي والله سرور العشب بالغيث والمرأة النزور بالولد، ولما سأله عن عبد الله المأمون قال مرعى ولا كالسعدان فقال الرشيد قاتله الله من أعرابي ما أعرفه بمواضع الرغبة {cite:muruj-al-dhahab p. 339}."
  en: "The bedouin orator who lauded al-Amin and scorned al-Ma'mun as 'pasture beside sand-grouse' — to the caliph's laughing rebuke {cite:muruj-al-dhahab p. 339}."
  fr: "L'orateur bédouin qui a loué al-Amin et méprisé al-Ma'mun comme « pâturage à côté de sable-grouse » - à la réprimande de rire du calife {cite:muruj-al-dhahab p. 339}."
  es: "El orador beduino que alabó a al-Amin y despreció a al-Ma'mun como 'pastizal junto a la ganga', a la risueña reprimenda del califa {cite:muruj-al-dhahab p. 339}."
  ur: "وہ بدو خطیب جس نے الامین کی تعریف کی اور المامون کو 'ریت کے گھاس کے پاس چراگاہ' کہہ کر طعنہ دیا - خلیفہ کی ہنسی ڈانٹ کے لیے۔ 339}۔"
  tr: "Al-Rashid'e vaaz vererek güvenilir Muhammed'i sözünü yenilemesi için teşvik eden bir şairdi. Ona 'Taç yönetiminde sevinin,' dediğinde, 'Tanrı aşkına, ot yağmurla hoşlanır, kadın ise çocuğa memnun olur.' diye yanıt verdi. Abdullah al-Ma'mun hakkında sorduğunda, 'Otlak, maymun gibi değil.' dedi. Al-Rashid, 'Allah onu öldürsün, bedeviler arasında arzu yerlerini biliyorum.' diye yanıtladı. {kaynak:muruj-al-dhahab, s. 339}."
  id: "Seorang penyair yang menyampaikan khotbah kepada Al-Rashid mendesak Muhammad yang dapat dipercaya untuk memperbarui janjinya. Ketika dia berkata kepadanya, 'Bersukacitalah atas pemerintahan Mahkota,' dia menjawab, 'Demi Tuhan, rumput senang dengan hujan, dan wanita adalah yang senang dengan anak itu.' Ketika dia bertanya tentang Abdullah al-Ma'mun, dia berkata, 'Padang rumput, bukan seperti monyet.' Al-Rashid menjawab, 'Semoga Allah membunuhnya, di antara orang Badui aku tahu tempat-tempat yang diinginkan.' {cite:muruj-al-dhahab, hlm. 339}."
