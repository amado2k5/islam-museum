summary:
  ar: "كاتب وصحفي إيراني (نحو 1870 أو 1875–1908) من شيراز، مؤسس أسبوعية «صور إسرافيل» التقدمية سنة 1907 ومحررها، ومن أعمدة الثورة الدستورية؛ أعدمه محمد علي شاه في باغ شاه بطهران بعد انقلاب يونيو 1908، مع ملك المتكلمين."
  en: "Iranian writer and journalist (c. 1870 or 1875–1908) from Shiraz, founder and editor of the progressive weekly Sur-e Esrafil from 1907 and a pillar of the Constitutional Revolution. Mohammad Ali Shah had him executed at Bagh-e Shah in Tehran after the June 1908 coup, together with Malek al-Motakallemin."
  ur: "ایرانی مصنف و صحافی (تقریباً 1870 یا 1875–1908)، اہل شیراز، ترقی پسند ہفت روزہ «صور اسرافیل» کے بانی و مدیر (1907 سے) اور آئینی انقلاب کے ستون۔ جون 1908 کی بغاوت کے بعد محمد علی شاہ نے انہیں ملک المتکلمین کے ساتھ تہران کے باغ شاہ میں قتل کرایا۔"
