  note: "Executed at Bagh-e Shah, Tehran, in the presence of Mohammad Ali Shah, together with Malek al-Motakallemin, after the coup of June 1908. English Wikipedia's lead and infobox give 23 June 1908, the day of the bombardment of the Majles, and the record follows them; the same article's biography, citing Rozaneh Magazine, says he was arrested and executed on 'Thursday 4 June 1908 (14 Khordad 1287)', a date before the coup the article itself describes — both readings are disclosed. He was strangled and stabbed in the heart, and is reported to have said 'Long live the constitutional government' before his death. The Hijri year 1326 is the derived conversion."
