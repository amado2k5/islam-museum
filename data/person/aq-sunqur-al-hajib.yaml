summary:
  ar: "آق سنقر الحاجب، مملوك ملكشاه السلجوقي، ولاه حلب سنة 480هـ/1087م، وأيّد تتش في محاولته الاستقرار في الشام، ثم انضم إلى بركيارق بعد وفاة ملكشاه، فهزمه تتش قرب حلب في جمادى الأولى 487هـ/مايو 1094م، وكان أبًا لزنكي صاحب الموصل فيما بعد {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
  en: "Aq Sunqur al-Hajib, a mamluk of Malik-shah who appointed him governor of Aleppo in 480/1087. He first supported Tutush's attempt to establish himself in Syria, but after Malik-shah's death he joined Barkiyaruk, and Tutush defeated him near Aleppo in May 1094. He was the father of Zangi, later atabeg of Mosul, and was praised for his justice {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
