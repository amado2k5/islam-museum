summary:
  ar: "آق سنقر الحاجب، مملوك ملكشاه السلجوقي، ولاه حلب سنة 480هـ/1087م، وأيّد تتش في محاولته الاستقرار في الشام، ثم انضم إلى بركيارق بعد وفاة ملكشاه، فهزمه تتش قرب حلب في جمادى الأولى 487هـ/مايو 1094م، وكان أبًا لزنكي صاحب الموصل فيما بعد {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
  en: "Aq Sunqur al-Hajib, a mamluk of Malik-shah who appointed him governor of Aleppo in 480/1087. He first supported Tutush's attempt to establish himself in Syria, but after Malik-shah's death he joined Barkiyaruk, and Tutush defeated him near Aleppo in May 1094. He was the father of Zangi, later atabeg of Mosul, and was praised for his justice {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
  es: "Aq Sunqur al-Hajib, un mameluco de Malik-shah que lo nombró gobernador de Alepo en 480/1087. Inicialmente apoyó el intento de Tutush de establecerse en Siria, pero tras la muerte de Malik-shah se unió a Barkiyaruk, y Tutush lo derrotó cerca de Alepo en mayo de 1094. Fue padre de Zangi, posteriormente atabeg de Mosul, y fue elogiado por su justicia {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
  fr: "Aq Sunqur al-Hajib, un mamelouk de Malik-shah, le nomma gouverneur d'Alep en 480/1087. Il soutint d'abord la tentative de Tutush de s'établir en Syrie, mais après la mort de Malik-shah, il rejoignit Barkiyaruk, et Tutush le vainquit près d'Alep en mai 1094. Il était le père de Zangi, plus tard atabeg de Mossoul, et était loué pour sa justice {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
  ur: "آق سنقر الحجیب، ملک شاہ کا ایک مملوک جس نے اسے 480/1087 میں حلب کا گورنر مقرر کیا۔ اس نے پہلے توتش کی شام میں خود کو قائم کرنے کی کوشش کی حمایت کی، لیکن ملک شاہ کی موت کے بعد وہ برقیاروک میں شامل ہو گیا، اور توتش نے مئی 1094 میں حلب کے قریب اسے شکست دی۔ 1 ص۔ 336}۔"
  tr: "Selçuklu Malikşah'ın Memlükü Aq Sunqur al-Hajib, onu 480 Hicri/1087 yılında Halep valisi olarak atadı. Tutush, Şam'a yerleşme girişimini destekledi, ardından Malikşah'ın ölümünden sonra Birkiyar'a katıldı. Tutush, 487 Hicri / Mayıs 1094 yılında Cumedül-Avval'de Halep yakınlarında onu yendi. Daha sonra Musul'un hükümdarı olan Zengi'nin babasıydı {atıf:İslam Ansiklopedisi-2 cilt 1, s. 336}."
  id: "Aq Sunqur al-Hajib, seorang Mamluk dari Malikshah si Seljuk, mengangkatnya sebagai gubernur Aleppo pada tahun 480 H/1087 M. Tutush mendukung upayanya untuk menetap di Levant, kemudian bergabung dengan Birkiyar setelah kematian Malikshah. Tutush mengalahkannya di dekat Aleppo di Jumada al-Awwal 487 H / Mei 1094 M. Ia adalah ayah dari Zengi, penguasa Mosul yang kemudian {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 336}."
