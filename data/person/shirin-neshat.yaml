summary:
  ar: "مصوّرة وفنانة بصرية وفيلمية إيرانية تعيش في نيويورك، وُلدت في قزوين سنة 1957 ونشأت في بيئة أسرية مسلمة، وغادرت إيران للدراسة في بيركلي سنة 1975 فحالت ثورة 1979 دون عودتها سنوات. بنت شهرتها على سلسلة الصور «نساء الله» (1993–1997) وعلى أعمال فيديو ثنائية الشاشة مثل «مضطرب» و«نشوة» التي نالت الجائزة الدولية في بينالي البندقية سنة 1999، وعلى فيلمها الروائي الأول «نساء بلا رجال» (2009) الذي نال الأسد الفضي لأفضل إخراج. يدور عملها على التضاد بين الإسلام والغرب والأنوثة والذكورة والمنفى والانتماء."
  en: "Iranian photographer, visual artist and filmmaker living in New York, born in Qazvin in 1957 and brought up in a Muslim family environment. She left Iran in 1975 to study at Berkeley, and the 1979 revolution kept her from returning for years. She built her reputation on the Women of Allah photographic series (1993-97) and on two-screen video works such as Turbulent and Rapture, which won the International Award at the 1999 Venice Biennale, and on her first feature film, Women Without Men (2009), which won the Silver Lion for best director. Her work turns on the contrasts between Islam and the West, femininity and masculinity, exile and belonging."
  ur: "ایرانی مصوّرہ، بصری فنکارہ اور فلم ساز جو نیویارک میں رہتی ہیں، 1957 میں قزوین میں پیدا ہوئیں اور ایک مسلم خاندانی ماحول میں پلی بڑھیں۔ وہ 1975 میں برکلے میں تعلیم کے لیے ایران سے گئیں اور 1979 کے انقلاب نے برسوں ان کی واپسی روکے رکھی۔ ان کی شہرت تصویری سلسلے «نساء اللہ» (1993ء–1997ء)، دو اسکرینی ویڈیو اعمال جیسے «مضطرب» اور «نشوہ» — جنھیں 1999 کے وینس بینالے کا بین الاقوامی انعام ملا — اور ان کی پہلی فیچر فلم «مردوں کے بغیر عورتیں» (2009) پر قائم ہے، جس نے بہترین ہدایت کاری کا سلور لائن جیتا۔"
