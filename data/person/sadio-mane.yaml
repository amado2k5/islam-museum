summary:
  ar: "لاعب كرة قدم سنغالي، وُلد في بامبالي بمنطقة سيدهيو سنة 1992؛ جناح النصر السعودي ومنتخب السنغال، ومن أبرز لاعبي جيله الأفارقة: فاز مع ليفربول بالدوري الإنجليزي (2020) ودوري أبطال أوروبا (2019)، وسجل أسرع ثلاثية في تاريخ الدوري الإنجليزي مع ساوثهامبتون (176 ثانية، 2015)، وقاد السنغال إلى أول ألقابها في كأس أمم أفريقيا (2021)، وموّل في قريته بامبالي مسجدًا ومدرسة ومستشفى."
  en: "Senegalese professional footballer, born in Bambali, in the Sédhiou region, in 1992. A winger for Saudi club Al-Nassr and the Senegal national team, he is among the leading African players of his generation: he won the Premier League (2020) and the UEFA Champions League (2019) with Liverpool, scored the Premier League's fastest hat-trick for Southampton (176 seconds, 2015), led Senegal to their first Africa Cup of Nations title (2021), and funded a mosque, a school and a hospital in his home village of Bambali."
  ur: "سینیگال کے پیشہ ور فٹبالر، 1992 میں سیدھیو کے علاقے بمبالی میں پیدا ہوئے؛ سعودی کلب النصر اور سینیگال کی قومی ٹیم کے ونگر، وہ اپنی نسل کے نمایاں افریقی کھلاڑیوں میں سے ہیں: لیورپول کے ساتھ پریمیئر لیگ (2020) اور یوئیفا چیمپئنز لیگ (2019) جیتی، ساؤتھمپٹن کے لیے پریمیئر لیگ کی تیز ترین ہیٹ ٹرک (176 سیکنڈ، 2015) کی، سینیگال کو اس کا پہلا افریقہ کپ آف نیشنز خطاب (2021) دلایا، اور اپنے گاؤں بمبالی میں مسجد، اسکول اور اسپتال کی مالی مدد کی۔"
