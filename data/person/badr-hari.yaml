summary:
  ar: "كيك بوكسر هولندي من أصل مغربي وُلد في أمستردام سنة 1984. فاز ببطولة كي-وان للوزن الثقيل سنة 2007 وبطولة إتس شوتايم سنة 2009، وبلغ نهائي الجائزة الكبرى العالمية مرتين، وحقق 106 انتصارات منها 92 بالضربة القاضية. واتسمت حياته خارج الحلبة بإدانات متكررة في قضايا اعتداء."
  en: "Dutch-Moroccan kickboxer born in Amsterdam in 1984. He won the K-1 Heavyweight Championship in 2007 and the It's Showtime heavyweight title in 2009, reached the K-1 World Grand Prix final twice, and compiled 106 wins, 92 of them by knockout. His life outside the ring was marked by repeated assault convictions."
  ur: "ڈچ مراکشی کک باکسر، 1984 میں ایمسٹرڈیم میں پیدا ہوئے۔ انہوں نے 2007 میں کے-ون ہیوی ویٹ چیمپئن شپ اور 2009 میں اٹس شو ٹائم ہیوی ویٹ ٹائٹل جیتا، دو بار کے-ون ورلڈ گرینڈ پری فائنل تک پہنچے، اور 106 فتوحات حاصل کیں جن میں 92 ناک آؤٹ تھیں۔ رنگ سے باہر ان کی زندگی بار بار حملے کے مقدمات میں سزاؤں سے عبارت رہی۔"
  es: "Kickboxer neerlandés-marroquí nacido en Ámsterdam en 1984. Ganó el Campeonato de Peso Pesado de K-1 en 2007 y el título de peso pesado de It's Showtime en 2009, llegó a la final del Gran Premio Mundial de K-1 en dos ocasiones y acumuló 106 victorias, 92 de ellas por nocaut. Su vida fuera del ring estuvo marcada por repetidas condenas por agresión."
  fr: "Kickboxeur néerlando-marocain né à Amsterdam en 1984. Il a remporté le championnat poids lourds du K-1 en 2007 et le titre poids lourds de l'événement It's Showtime en 2009, a atteint deux fois la finale du Grand Prix mondial du K-1 et compte à son actif 106 victoires, dont 92 par KO. Sa vie hors du ring a été marquée par de multiples condamnations pour agression."
  tr: "1984 yılında Amsterdam'da doğmuş, Fas kökenli Hollandalı bir kickboksçu. 2007'de K-1 sağlık şampiyonluğunu ve 2009'da It's Showtime şampiyonluğunu kazandı, iki kez Dünya Grand Prix finallerine yükseldi ve 106 galibiyet elde etti, bunların 92'si nakavtla gerçekleşti. Ring dışındaki hayatı, saldırı davalarında tekrar tekrar mahkumiyetlerle şekillendi."
  id: "Seorang petinju Belanda keturunan Maroko, lahir di Amsterdam pada tahun 1984. Ia memenangkan kejuaraan K-1 heabulary pada tahun 2007 dan kejuaraan It's Showtime pada tahun 2009, mencapai final World Grand Prix dua kali, dan meraih 106 kemenangan, termasuk 92 dengan knockout. Hidupnya di luar ring ditandai dengan vonis berulang dalam kasus penyerangan."
