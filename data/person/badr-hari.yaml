summary:
  ar: "كيك بوكسر هولندي من أصل مغربي وُلد في أمستردام سنة 1984. فاز ببطولة كي-وان للوزن الثقيل سنة 2007 وبطولة إتس شوتايم سنة 2009، وبلغ نهائي الجائزة الكبرى العالمية مرتين، وحقق 106 انتصارات منها 92 بالضربة القاضية. واتسمت حياته خارج الحلبة بإدانات متكررة في قضايا اعتداء."
  en: "Dutch-Moroccan kickboxer born in Amsterdam in 1984. He won the K-1 Heavyweight Championship in 2007 and the It's Showtime heavyweight title in 2009, reached the K-1 World Grand Prix final twice, and compiled 106 wins, 92 of them by knockout. His life outside the ring was marked by repeated assault convictions."
  ur: "ڈچ مراکشی کک باکسر، 1984 میں ایمسٹرڈیم میں پیدا ہوئے۔ انہوں نے 2007 میں کے-ون ہیوی ویٹ چیمپئن شپ اور 2009 میں اٹس شو ٹائم ہیوی ویٹ ٹائٹل جیتا، دو بار کے-ون ورلڈ گرینڈ پری فائنل تک پہنچے، اور 106 فتوحات حاصل کیں جن میں 92 ناک آؤٹ تھیں۔ رنگ سے باہر ان کی زندگی بار بار حملے کے مقدمات میں سزاؤں سے عبارت رہی۔"
