id: person/harun-al-rashid
class: person
label: { ar: "هارون الرشيد", en: "Harun al-Rashid" }
summary:
  ar: "هارون بن محمد المهدي، خامس خلفاء بني العباس؛ عند البلاذري: غزا بلاد الروم أميراً للصائفة عن أبيه المهدي سنة 163 فحاصر ضمالو وصالح أهلها على الأمان فأنزلوا ببغداد موضع سمالو، ونزل الخليج سنة 165 فرمّ المصيصة ومسجدها وزاد في شحنتها وبنى قصر جسر أذنة على سيحان؛ ولما استخلف بلغه سنة 171 أن الروم ائتمروا لتحصين طرسوس فسبقهم بعمارتها على يد هرثمة بن أعين وفرج بن سليم وسكنها الندبتين، وأمر سنة 180 بابتناء عين زربة وتحصينها وندب إليها المقاتلة وأمر ببناء مدينة الكنيسة السوداء، وسمى مدن الثغور عواصم، وردّ أسرى قبرس بعد حيّ بن معيوف، وأعاد ضياع فلسطين إلى أهلها على يد هرثمة بالتخفيف والردود، وقسم الأموال في الثغور والسواحل وأقام من صناعة الغزو ما لم يقم قبله عند معاوية بن عمرو، وعند السيوطي ولد بالري سنة ثمان وأربعين ومئة وأمه الخيزران أم ولد، وكان يصلي في خلافته كل يوم مئة ركعة إلى أن مات لا يتركها إلا لعلة ويتصدق من صلب ماله كل يوم بألف درهم، وبلغه عن بشر المريسي القول بخلق القرآن فقال لئن ظفرت به لأضربن عنقه، ورام أن يوصل ما بين بحر الروم وبحر القلزم مما يلي الفرما فقال له يحيى بن خالد البرمكي كان يختطف الروم الناس من المسجد الحرام وتدخل مراكبهم إلى الحجاز فتركه، وفي سنة تسع وسبعين اعتمر في رمضان ودام على إحرامه إلى أن حج ومشى من مكة إلى عرفات {cite:tarikh-khulafa-minhaj-1434 p. 456-461} وقال محمد بن علي الخراساني الرشيد أول خليفة لعب بالصوالجة والكرة ورمى النشاب في البرجاس وأول خليفة لعب بالشطرنج من بني العباس، وقال الصولي هو أول من جعل للمغنين مراتب وطبقات {cite:tarikh-khulafa-minhaj-1434 p. 470-471}، وعند المسعودي أن الرشيد حصن الثغور وحصن فيها الحصون مثل طرسوس وأذنة وعمر المصيصة ودور السبيل للمرابطين، وأنه أول خليفة لعب بالصولجان في الميدان ورمى بالنشاب في البرجاس ولعب بالأكرة والطبطاب، وأول من لعب بالشطرنج من خلفاء بني العباس وبالنرد وقدم اللعاب وأجرى عليهم الرزق، فسمى الناس أيامه لنضارتها وكثرة خيرها وخصبها أيام العروس {cite:muruj-al-dhahab p. 670}، وعند المسعودي بويع يوم الجمعة صبيحة الليلة التي مات فيها الهادي لاثنتي عشرة ليلة بقيت من ربيع الأول سنة سبعين ومائة وهو ابن إحدى وعشرين سنة وشهرين، وكان الهادي أراد خلعه فلما قال له إن وصل الأمر إلي وصلت من قطعت وبررت من حرمت وصيرت أولادك أعلى من أولادي وزوجتهم بناتي انجلى غضبه، فوفى له فزوج حمدونة ابنته من جعفر بن موسى وفاطمة من إسماعيل بن موسى، ومات بطوس بقرية سناباذ سنة ثلاث وتسعين ومائة وكانت ولايته ثلاثاً وعشرين سنة وستة أشهر {cite:muruj-al-dhahab p. 322-325}، وحج سنة ثمان وثمانين وهي آخر حجة حجها وقال أبو بكر بن عياش حين اجتاز بالكوفة لا يعود إلى هذه الطريق ولا خليفة من بني العباس بعده أبداً {cite:muruj-al-dhahab p. 330-331}، وأجرى حلبة الخيل يوماً بالرقة فكان فرسه السابق وفرس المأمون الثانية فتمثل الأصمعي بشعر الخنساء {cite:muruj-al-dhahab p. 349-350}، وقال العبدي عند المسعودي كان مواظباً على الحج متابعاً للغزو واتخاذ المصانع والآبار والبرك والقصور في طريق مكة، وبنى الثغور ومدنها وحصنها مثل طرسوس وأذنة وعمر المصيصة ومرعش وأحكم بناء الحربة ودور السبيل للمرابطين، وكان أول خليفة لعب بالصولجان في الميدان ورمى بالنشاب في البرجاس ولعب بالأكرة والطبطاب، وأول من لعب بالشطرنج من خلفاء بني العباس وبالنرد وقدم اللعاب وأجرى عليهم الرزق، فسمى الناس أيامه لنضارتها أيام العروس {cite:muruj-al-dhahab p. 670}. وفي تاريخ بغداد (ترجمة 7347): ولد بالري لثلاث بقين من ذي الحجة سنة خمسين ومائة وقيل سنة تسع وأربعين، وبويع له يوم الجمعة لأربع عشرة ليلة بقيت من ربيع الأول سنة سبعين ببغداد في اليوم الذي مات فيه الهادي وهو ابن تسع عشرة سنة وشهرين وثلاث عشرة ليلة، وفي تلك الليلة وُلد المأمون فقيل ولد فيها خليفة ووُلي خليفة ومات خليفة؛ كان ينزل الخلد وكان يحج عاماً ويغزو عاماً، وإذا حج أحجّ معه مائة من الفقهاء وأبنائهم، وكان يحب الفقه والفقهاء ويكره المراء في الدين والجدال، وبكى عند أبي معاوية الضرير لحديث «وددت أني أقتل في سبيل الله ثم أحيا» وسأله أن يغزو فقال له مكانك في الإسلام أكبر ولكن ترسل الجيوش، ومات بطوس ليلة السبت لأربع خلون من جمادى الآخرة سنة ثلاث وتسعين ومائة ودفن بقرية سناباذ وصلى عليه ابنه صالح وعمره خمس وأربعون سنة وخلافته ثلاث وعشرون سنة وشهران وستة عشر يوماً {cite:tarikh-baghdad-khatib j.11 p.5-15}."
  en: "Harun ibn Muhammad al-Mahdi, fifth Abbasid caliph; in al-Baladhuri: as prince he led the summer raid of year 163 for his father, besieging Damalu and granting its people aman — settled at Baghdad's Samalu quarter — and in year 165 descending on the Gulf, repairing Masisa and its mosque, increasing its garrison and building the Adhana-bridge palace on the Sayhan; as caliph he learned in year 171 that the Byzantines had conspired to fortify Tarsus and forestalled them through Harthama ibn A'yan and Faraj ibn Sulaym, settling the two levies, ordered Ayn Zarba built and fortified in year 180 and the city of the Black Church likewise, named the march cities the 'Awasim, returned the Cypriot captives taken by Hayy ibn Ma'yuf, restored Filastin's deserted estates to their people through Harthama with the takhafif and rudud, disbursed funds through the marches and coasts, and carried the craft of raiding, in Mu'awiya ibn Amr's words, to a pitch unmatched before him. Tarikh Baghdad (#7347): born at Rayy three nights short of Dhu'l-Hijja 150 (another report 149), given the bay'a at Baghdad on Friday 14 Rabi' I 170 — the very day al-Hadi died — aged nineteen years, two months and thirteen days, with al-Ma'mun born that same night; he kept al-Khuld, alternated a year of hajj with a year of ghazw, took a hundred scholars and their sons on pilgrimage, loved fiqh and fuqaha' and loathed kalam disputation; he wept convulsively at Abu Mu'awiya al-Darir's hadith 'I would love to be killed in God's path then live again' yet was told his place in Islam was too great to go raiding in person. He died at Tus on Saturday night, four days into Jumada II 193, buried at Sanabadh with his son Salih praying over him — forty-five years old after twenty-three years, two months and sixteen days of rule {cite:tarikh-baghdad-khatib j.11 p.5-15}."
