summary:
  ar: "هارون بن محمد المهدي، خامس خلفاء بني العباس؛ عند البلاذري: غزا بلاد الروم أميراً للصائفة عن أبيه المهدي سنة 163 فحاصر ضمالو وصالح أهلها على الأمان فأنزلوا ببغداد موضع سمالو، ونزل الخليج سنة 165 فرمّ المصيصة ومسجدها وزاد في شحنتها وبنى قصر جسر أذنة على سيحان؛ ولما استخلف بلغه سنة 171 أن الروم ائتمروا لتحصين طرسوس فسبقهم بعمارتها على يد هرثمة بن أعين وفرج بن سليم وسكنها الندبتين، وأمر سنة 180 بابتناء عين زربة وتحصينها وندب إليها المقاتلة وأمر ببناء مدينة الكنيسة السوداء، وسمى مدن الثغور عواصم، وردّ أسرى قبرس بعد حيّ بن معيوف، وأعاد ضياع فلسطين إلى أهلها على يد هرثمة بالتخفيف والردود، وقسم الأموال في الثغور والسواحل وأقام من صناعة الغزو ما لم يقم قبله عند معاوية بن عمرو، وعند السيوطي ولد بالري سنة ثمان وأربعين ومئة وأمه الخيزران أم ولد، وكان يصلي في خلافته كل يوم مئة ركعة إلى أن مات لا يتركها إلا لعلة ويتصدق من صلب ماله كل يوم بألف درهم، وبلغه عن بشر المريسي القول بخلق القرآن فقال لئن ظفرت به لأضربن عنقه، ورام أن يوصل ما بين بحر الروم وبحر القلزم مما يلي الفرما فقال له يحيى بن خالد البرمكي كان يختطف الروم الناس من المسجد الحرام وتدخل مراكبهم إلى الحجاز فتركه، وفي سنة تسع وسبعين اعتمر في رمضان ودام على إحرامه إلى أن حج ومشى من مكة إلى عرفات {cite:tarikh-khulafa-minhaj-1434 p. 456-461} وقال محمد بن علي الخراساني الرشيد أول خليفة لعب بالصوالجة والكرة ورمى النشاب في البرجاس وأول خليفة لعب بالشطرنج من بني العباس، وقال الصولي هو أول من جعل للمغنين مراتب وطبقات {cite:tarikh-khulafa-minhaj-1434 p. 470-471}، وعند المسعودي أن الرشيد حصن الثغور وحصن فيها الحصون مثل طرسوس وأذنة وعمر المصيصة ودور السبيل للمرابطين، وأنه أول خليفة لعب بالصولجان في الميدان ورمى بالنشاب في البرجاس ولعب بالأكرة والطبطاب، وأول من لعب بالشطرنج من خلفاء بني العباس وبالنرد وقدم اللعاب وأجرى عليهم الرزق، فسمى الناس أيامه لنضارتها وكثرة خيرها وخصبها أيام العروس {cite:muruj-al-dhahab p. 670}، وعند المسعودي بويع يوم الجمعة صبيحة الليلة التي مات فيها الهادي لاثنتي عشرة ليلة بقيت من ربيع الأول سنة سبعين ومائة وهو ابن إحدى وعشرين سنة وشهرين، وكان الهادي أراد خلعه فلما قال له إن وصل الأمر إلي وصلت من قطعت وبررت من حرمت وصيرت أولادك أعلى من أولادي وزوجتهم بناتي انجلى غضبه، فوفى له فزوج حمدونة ابنته من جعفر بن موسى وفاطمة من إسماعيل بن موسى، ومات بطوس بقرية سناباذ سنة ثلاث وتسعين ومائة وكانت ولايته ثلاثاً وعشرين سنة وستة أشهر {cite:muruj-al-dhahab p. 322-325}، وحج سنة ثمان وثمانين وهي آخر حجة حجها وقال أبو بكر بن عياش حين اجتاز بالكوفة لا يعود إلى هذه الطريق ولا خليفة من بني العباس بعده أبداً {cite:muruj-al-dhahab p. 330-331}، وأجرى حلبة الخيل يوماً بالرقة فكان فرسه السابق وفرس المأمون الثانية فتمثل الأصمعي بشعر الخنساء {cite:muruj-al-dhahab p. 349-350}، وقال العبدي عند المسعودي كان مواظباً على الحج متابعاً للغزو واتخاذ المصانع والآبار والبرك والقصور في طريق مكة، وبنى الثغور ومدنها وحصنها مثل طرسوس وأذنة وعمر المصيصة ومرعش وأحكم بناء الحربة ودور السبيل للمرابطين، وكان أول خليفة لعب بالصولجان في الميدان ورمى بالنشاب في البرجاس ولعب بالأكرة والطبطاب، وأول من لعب بالشطرنج من خلفاء بني العباس وبالنرد وقدم اللعاب وأجرى عليهم الرزق، فسمى الناس أيامه لنضارتها أيام العروس {cite:muruj-al-dhahab p. 670}. وفي تاريخ بغداد ⁦(ترجمة 7347)⁩: ولد بالري لثلاث بقين من ذي الحجة سنة خمسين ومائة وقيل سنة تسع وأربعين، وبويع له يوم الجمعة لأربع عشرة ليلة بقيت من ربيع الأول سنة سبعين ببغداد في اليوم الذي مات فيه الهادي وهو ابن تسع عشرة سنة وشهرين وثلاث عشرة ليلة، وفي تلك الليلة وُلد المأمون فقيل ولد فيها خليفة ووُلي خليفة ومات خليفة؛ كان ينزل الخلد وكان يحج عاماً ويغزو عاماً، وإذا حج أحجّ معه مائة من الفقهاء وأبنائهم، وكان يحب الفقه والفقهاء ويكره المراء في الدين والجدال، وبكى عند أبي معاوية الضرير لحديث «وددت أني أقتل في سبيل الله ثم أحيا» وسأله أن يغزو فقال له مكانك في الإسلام أكبر ولكن ترسل الجيوش، ومات بطوس ليلة السبت لأربع خلون من جمادى الآخرة سنة ثلاث وتسعين ومائة ودفن بقرية سناباذ وصلى عليه ابنه صالح وعمره خمس وأربعون سنة وخلافته ثلاث وعشرون سنة وشهران وستة عشر يوماً {cite:tarikh-baghdad-khatib j.11 p.5-15}. هارون بن محمد المهدي، خامس خلفاء بني العباس، وُلد بالري سنة 149هـ/766م في رواية دائرة المعارف الإسلامية وبويع بالخلافة في 15 ربيع الأول 170هـ/786م. تذكر المقالة أن الوزير يحيى بن خالد البرمكي وابنيه حكموا نحو سبع عشرة سنة حتى سقوطهم سنة 187هـ، وأنه نظّم الثغور في وحدة العواصم وقاد الحملات على الروم بنفسه سنتي 187 و190هـ، وأن عهده شهد ثورات في الشام ومصر وإفريقية واليمن وخراسان. وتحكم المقالة بأن تقسيمه الدولة بين أبنائه بدأ انحدارها، وأنه توفي بطوس في 3 جمادى الآخرة 193هـ/809م."
  en: "Harun ibn Muhammad al-Mahdi, fifth Abbasid caliph; in al-Baladhuri: as prince he led the summer raid of year 163 for his father, besieging Damalu and granting its people aman — settled at Baghdad's Samalu quarter — and in year 165 descending on the Gulf, repairing Masisa and its mosque, increasing its garrison and building the Adhana-bridge palace on the Sayhan; as caliph he learned in year 171 that the Byzantines had conspired to fortify Tarsus and forestalled them through Harthama ibn A'yan and Faraj ibn Sulaym, settling the two levies, ordered Ayn Zarba built and fortified in year 180 and the city of the Black Church likewise, named the march cities the 'Awasim, returned the Cypriot captives taken by Hayy ibn Ma'yuf, restored Filastin's deserted estates to their people through Harthama with the takhafif and rudud, disbursed funds through the marches and coasts, and carried the craft of raiding, in Mu'awiya ibn Amr's words, to a pitch unmatched before him. Tarikh Baghdad (#7347): born at Rayy three nights short of Dhu'l-Hijja 150 (another report 149), given the bay'a at Baghdad on Friday 14 Rabi' I 170 — the very day al-Hadi died — aged nineteen years, two months and thirteen days, with al-Ma'mun born that same night; he kept al-Khuld, alternated a year of hajj with a year of ghazw, took a hundred scholars and their sons on pilgrimage, loved fiqh and fuqaha' and loathed kalam disputation; he wept convulsively at Abu Mu'awiya al-Darir's hadith 'I would love to be killed in God's path then live again' yet was told his place in Islam was too great to go raiding in person. He died at Tus on Saturday night, four days into Jumada II 193, buried at Sanabadh with his son Salih praying over him — forty-five years old after twenty-three years, two months and sixteen days of rule {cite:tarikh-baghdad-khatib j.11 p.5-15}. Harun ibn Muhammad al-Mahdi, fifth Abbasid caliph, born at Rayy in 149 AH/766 CE in the account of the Encyclopaedia of Islam and acclaimed caliph on 15 Rabi' I 170 AH/786 CE. The article says the vizier Yahya ibn Khalid al-Barmaki and his sons held power for about seventeen years until their fall in 187 AH, that he organised the frontier zone as the Awasim and led campaigns against the Byzantines himself in 187 and 190 AH, and that his reign saw revolts in Syria, Egypt, Ifriqiya, Yemen and Khurasan. The article judges that his division of the empire among his sons began its decline; he died at Tus on 3 Jumada II 193 AH/809 CE."
  ur: "ہارون بن محمد مہدی، پانچویں عباسی خلیفہ، اسلامی انسائیکلوپیڈیا کی روایت میں رے میں 149ھ/766ء میں پیدا ہوئے اور 15 ربیع الاول 170ھ/786ء کو خلیفہ ہوئے۔ مضمون کے مطابق وزیر یحییٰ بن خالد برمکی اور ان کے بیٹے تقریباً سترہ سال اقتدار میں رہے یہاں تک کہ 187ھ میں ان کا زوال ہوا، انھوں نے سرحدوں کو عواصم کی اکائی میں منظم کیا اور 187ھ اور 190ھ میں رومیوں کے خلاف خود مہمات کی قیادت کی، اور ان کے عہد میں شام، مصر، افریقیہ، یمن اور خراسان میں بغاوتیں ہوئیں۔ مضمون کا فیصلہ ہے کہ بیٹوں میں سلطنت بانٹنے سے اس کا زوال شروع ہوا؛ ان کی وفات طوس میں 3 جمادی الآخر 193ھ/809ء کو ہوئی۔"
  es: "Harun ibn Muhammad al-Mahdi, quinto califa abasí; en al-Baladhuri: como príncipe dirigió la incursión de verano del año 163 para su padre, sitiando Damalu y otorgando a su gente aman —establecidos en el barrio de Samalu de Bagdad— y en el año 165 descendiendo al Golfo, reparando Masisa y su mezquita, aumentando su guarnición y construyendo el palacio del puente Adhana en el Sayhan; Como califa, en el año 171 se enteró de que los bizantinos habían conspirado para fortificar Tarso y los frustró a través de Harthama ibn A'yan y Faraj ibn Sulaym, estableciendo los dos contingentes, ordenó la construcción y fortificación de Ayn Zarba en el año 180 y la ciudad de la Iglesia Negra de igual manera, nombró a las ciudades fronterizas 'Awasim, devolvió a los cautivos chipriotas tomados por Hayy ibn Ma'yuf, restituyó las propiedades abandonadas de Filastin a su gente a través de Harthama con el takhafif y el rudud, desembolsó fondos a través de las marcas y las costas, y llevó el arte del saqueo, en palabras de Mu'awiya ibn Amr, a un nivel sin precedentes. Tarikh Bagdad (#7347): nació en Rayy tres noches antes de Dhu'l-Hijja 150 (otro informe 149), recibió el bay'a en Bagdad el viernes 14 Rabi' I 170 — el mismo día en que murió al-Hadi— a la edad de diecinueve años, dos meses y trece días, con al-Ma'mun nacido esa misma noche; mantuvo al-Khuld, alternó un año de hajj con un año de ghazw, llevó a cien eruditos y sus hijos en peregrinación, amaba el fiqh y el fuqaha' y detestaba las disputas de kalam; lloró convulsivamente con el hadiz de Abu Mu'awiya al-Darir 'Me encantaría morir en el camino de Dios y luego volver a vivir', sin embargo, se le dijo que su lugar en el Islam era demasiado grande como para ir a saquear en persona. Murió en Tus la noche del sábado, cuatro días después del comienzo de Jumada II 193, enterrado en Sanabadh con su hijo Salih orando por él, a los cuarenta y cinco años después de veintitrés años, dos meses y dieciséis días de gobierno {cite:tarikh-baghdad-khatib j.11 p.5-15}. Harun ibn Muhammad al-Mahdi, quinto califa abasí, nació en Rayy en 149 AH/766 d. C. según el relato de la Enciclopedia del Islam y fue proclamado califa el 15 Rabi' I 170 AH/786 d. C. El artículo afirma que el visir Yahya ibn Khalid al-Barmaki y sus hijos detentaron el poder durante unos diecisiete años, hasta su caída en el año 187 de la Hégira. Añadió que organizó la zona fronteriza conocida como Awasim y dirigió personalmente campañas contra los bizantinos en los años 187 y 190 de la Hégira, y que durante su reinado se produjeron revueltas en Siria, Egipto, Ifriqiya, Yemen y Jorasán. El artículo considera que la división del imperio entre sus hijos marcó el inicio de su declive. Murió en Tus el 3 de Jumada II del año 193 de la Hégira (809 d. C.)."
  fr: "Harun ibn Muhammad al-Mahdi, cinquième calife abbasside; selon al-Baladhuri: en tant que prince, il mena le raid d'été de l'année 163 pour son père, assiégeant Damalu et accordant à ses habitants l'aman — installé dans le quartier Samalu de Bagdad — et en l'année 165, descendant sur le Golfe, réparant Masisa et sa mosquée, augmentant sa garnison et construisant le palais du pont Adhana sur le Sayhan; En tant que calife, il apprit en l'an 171 que les Byzantins avaient conspiré pour fortifier Tarse et les devança par l'intermédiaire d'Harthama ibn A'yan et Faraj ibn Sulaym, réglant les deux levées, ordonna la construction et la fortification d'Ayn Zarba en l'an 180 et de la ville de l'Église Noire de même, nomma les villes des marches les 'Awasim, rendit les captifs chypriotes pris par Hayy ibn Ma'yuf, restitua les domaines désertés de Filastin à leur peuple par l'intermédiaire d'Harthama avec le takhafif et le rudud, distribua des fonds à travers les marches et les côtes, et porta l'art du pillage, selon les mots de Mu'awiya ibn Amr, à un niveau inégalé avant lui. Tarikh Baghdad (#7347): né à Rayy trois nuits avant Dhu'l-Hijja 150 (une autre source indique 149), il prêta serment d'allégeance à Bagdad le vendredi 14 Rabi' I 170 — le jour même de la mort d'al-Hadi — à l'âge de dix-neuf ans, deux mois et treize jours, avec al-Ma'mun né la même nuit; il observa le khuld, alterna une année de hajj avec une année de ghazw, emmena une centaine de savants et leurs fils en pèlerinage, aimait le fiqh et le fuqaha' et détestait les disputes sur le kalam; il pleura convulsivement en entendant le hadith d'Abu Mu'awiya al-Darir: « J'aimerais mourir sur le chemin de Dieu et revivre », mais on lui dit que sa place dans l'islam était trop importante pour qu'il puisse participer personnellement à des raids. Il mourut à Tus dans la nuit de samedi à dimanche, quatre jours après le début du mois de Jumada II 193, et fut enterré à Sanabadh, son fils Salih veillant sur lui. Il avait quarante-cinq ans après vingt-trois ans, deux mois et seize jours de règne (voir: Tarikh-Baghdad-Khatib, vol. 11, p. 5-15). Harun ibn Muhammad al-Mahdi, cinquième calife abbasside, naquit à Rayy en 149 AH/766 apr. J.-C., selon l’Encyclopédie de l’Islam, et fut proclamé calife le 15 Rabi’ I 170 AH/786 apr. J.-C. L'article indique que le vizir Yahya ibn Khalid al-Barmaki et ses fils ont exercé le pouvoir pendant environ dix-sept ans, jusqu'à leur chute en 187 AH. Il précise qu'il organisa la zone frontalière sous le nom d'Awasim et mena lui-même des campagnes contre les Byzantins en 187 et 190 AH. Son règne fut marqué par des révoltes en Syrie, en Égypte, en Ifriqiya, au Yémen et au Khorasan. L'article conclut que le partage de l'empire entre ses fils marqua le début de son déclin; il mourut à Tus le 3 Jumada II 193 AH/809 apr. J.-C."
  tr: "Beşinci Abbasi halifesi Harun ibn Muhammed el-Mehdi; el-Baladhuri'ye göre: 163 Hicri'de babası el-Mehdi adına yaz valisi olarak Bizans topraklarına girdi, güvenlik için Damalu ve Saleh'i kuşattı, böylece Bağdat'taki Samalu'ya yerleştiler. 165 Hicri'de Körfez'e yerleşti, el-Musaya ve camisini ezdi, yükünü artırdı ve Sayhan üzerinde Adhana Köprüsü Sarayı'nı inşa etti. 171 Hicri'de milletvekili olarak atandığında, Romalıların Tarsus'u tahkim etmek için komplo kurduğunu öğrendi, ancak Harthama ibn A'yan ve Faraj ibn Sulaym tarafından önce inşa edilerek iki Nadbatin'e yerleşti. 180 Hicri'de Ayn Zerbe'nin inşası ve surlarının güçlendirilmesini emretti Savaşçılar atadı, Kara Kilise şehrinin inşasını emretti, sınır şehirlerini başkent olarak adlandırdı, Hayy ibn Ma'youf'tan sonra Kıbrıs esirlerini geri verdi, Filistin'in Harthama tarafından halkına kaybedilmesini yardım ve misillemelerle geri verdi, sınır ve kıyılarda servet dağıttı ve Muaviye bin Amr ile daha önce yapılmamış bir sefer başlattı. Al-Suyuti'ye göre, 148 Hicri yılında Rayı'da doğmuş, annesi El-Hayzaran (ümmümü Velad) idi. Halifeliği sırasında her gün yüz rekat namaz kıldı ve ölümüne kadar sadece hastalık nedeniyle ve sadaka vererek kaldı Her gün servetini bin dirhem için harcadı ve Biş el-Muraisi ona Kur'an'ın yaratılışını anlattı. Dedi ki, 'Kazanacak olsaydım, boynunu vururdum.' Roma Denizi ile El-Farma'nın ötesindeki Kalizm Denizi arasındaki denizi bağlamayı planlıyordu. Yahya ibn Halid el-Bermaki ona şöyle dedi: Romalılar Mescid'den insanları kaçırırdı ve onların gemileri Hicaz'a girerdi, bu yüzden onu terk etti. Yetmiş dokuzuncu yılda Ramazan'da Umre ayini etti ve Hac edene kadar İhramda kaldı ve Mekke'den Arafat'a yürüdü {alıntı: Tarikh-khulafa-minhaj-1434 s. 456-461} Muhammed bin Ali el-Horasani el-Reşid, barjalara sawalja, top oynayan ve yay atan ilk halife, Abbasilerden satranç oynayan ilk halifedir. El-Suli, şarkıcılara rütbe ve sınıf atayan ilk kişi olduğunu belirtmiştir {atıf:Tarikh-khulafa-minhaj-1434 s. 470-471}. Al-Mas'udi'ye göre, el-Raşid sınırları ve Tarsus, Azna, Ömer el-Masaysa ve Almoravid ilçelerini tahkim etmiştir. Tarlada topuzla oynayan, barjalarda yay atan, Akra ve Tabtab'larla oynayan ilk halifedir ve satranç oynayan ilk kişidir Abbasi halifeleri ve zarlarla tükürük sundu ve besin sağladı. İnsanlar günlerine tazeliği, bol iyiliği ve gelin günlerinde verimliliği nedeniyle adlandırdı {atıf:Muruj-al-Dhahab, s. 670}. El-Mes'udi'ye göre, Cuma sabahı, el-Hadi'nin öldüğü gece, Rabi'l-Avval'den kalan on iki gece boyunca yüz yetmiş yıl yüz yetmiş yıl boyunca bağlılık yemini etti. El-Hadi onu tahttan indirmek istedi, ancak ona dedi ki, 'Eğer iş bana ulaşırsa, kestirdiğim kişilere ulaşırım, mahrum bırakılanları haklı çıkarırım, senin çocukların benim çocuklarımdan üstün olur ve onların eşi benim kızlarım olur, ben özgür kalacağım.' Öfkeliydi ve onun için öldü. Hamdona kızını Cafer ibn Musa ile, Fatimeyi ise İsmail bin Musa ile evlendirdi. Yüz doksan üçüncü yılda Sanabad köyündeki Tus'ta öldü ve hükümdarlığı yirmi üç yıl altı ay sürdü {atıf:Muruj-al-Dhahab s. 322-325} ve seksen sekizinci yılda Hac yaptı, bu onun son Hacıydı. Ebu Bekir bin Ayyaş, Kufe'den geçerken bu yola asla dönmeyeceğini ve ondan sonra Abbasilerden hiçbir halifeyi geri dönmeyeceğini söyledi {alıntı: Muruj-al-Dhahab s. 330-331} ve bir gün Rakka'da bir at halkası düzenledi; burada önceki atı ve Al-Ma'mun'un ikinci atıydı; Al-Asma'i tarafından Al-Khansa şiirleriyle temsil edilmiştir {atıf:Muruj-al-Dhahab s. 349-350}. Al-Mas'udi'ye göre, Al-Abdi, hac yollarında titiz olduğunu, seferleri takip ettiğini, fabrikalar, kuyular, havuzlar ve saraylar kurduğunu söylemiştir. Tarsus, Adhnah, Umar al-Muaysa ve Maraş gibi sınırlar, şehirler ve kaleler inşa etmiş, Almoravidler için mızrak ve yolu ustalıkla inşa etmiştir. Tarlada topuzla oynayan, barjalarda yay atan, Akra ve Tabtab'larla oynayan ilk halife olmuştur ve ilk oynayan oydu Abbasi halifeleri arasında satranç oynar, zarlarla tükürük getirir ve besin sağlardı; bu yüzden insanlar günlerine tazeliği nedeniyle gelin günleri adını verirler {cite:muruj-al-dhahab, s. 670}. Bağdat Tarihi'nde (biyografi 7347): Yüz elli, bazılarına göre kırk dokuzuncu yılda, Zhu'd-Hicce'den üç gün önce Rayy'de doğdu. Cuma günü on dört gece boyunca bağlılık yemini etti, yetmişinci yılda Bağdat'taki Rabi'al-Awwal'dan kaldı ve el-Hadi'nin on dokuz yaş, iki ay ve on üç gece yaşında öldüğü gün kaldı. O gece el-Me'mun doğdu ve bir halifenin doğup halife olarak atandığı, bir halifenin öldüğü söylenir; sonsuz dünyada yerleşir, bir yıl Hac yapar, bir yıl sefer yapardı ve Hac yaptığında yüz kişi ona eşlik ederdi Hukukçular ve oğulları. Fihil ve hukukçuları severdi, kadınları din ve münazara içinde sevmezdi. Hadis üzerine kör Ebu Muaviye önünde ağladı: \"Keşke Allah yolunda öldürülebilseydim ve sonra diriltilseydim.\" Onu bir baskına çıkmasını istedi, ancak o şöyle cevap verdi: İslam'daki yerin daha büyük, ama ordular gönderildi. 193 Hicri yılının 4 Cumesi gecesi Tus'ta öldü ve Sanabadh köyüne defnedildi. Oğlu Salih cenaze namazını onun üzerine yaptı, o 45 yaşındaydı ve halifeliği 23 yıl, iki ay ve on altı gün sürdü {atıf:Tarih-bağdat-khatib J.11, s.5-15}. Beşinci Abbasi halifesi Harun ibn Muhammed el-Mehdi, İslam Ansiklopedisi'ne göre 149 Hicri / 766 yılında Rayı'da doğmuş ve 15 Rebi'l-Avvel 170 Hicri / 786 yılında halifeliğe bağlılık yemini etmiştir. Makalede, vezir Yahya ibn Halid el-Barmaki ve iki oğlunun yaklaşık on yedi yıl hüküm sürdüğü, 187'de düşüşe kadar hüküm sürdükleri belirtilir: Başkentlerin birliği içinde sınırları organize ettiğini ve 187 ile 190 Hicri'de Bizanslılara karşı bizzat seferler düzenlediğini, saltanatının Levant, Mısır, İfrikiye, Yemen ve Horasan'da isyanlara tanık olduğunu belirtir. Makale, devletin oğulları arasında bölünmesinin azalmaya başladığını ve 3 Cumedül-Ahhirah 193 Hicri / 809 M.S. tarihinde Tus'ta öldüğünü savunur."
  id: "Harun ibn Muhammad al-Mahdi, khalifah Abbasiyah kelima; menurut al-Baladhuri: Ia menyerbu tanah Bizantium sebagai gubernur musim panas atas nama ayahnya al-Mahdi pada tahun 163 H, mengepung Damalu dan Saleh untuk keselamatan, sehingga mereka menetap di Baghdad di Samalu. Ia menetap di Teluk pada tahun 165 H, menghancurkan al-Musaysa dan masjidnya, menambah muatan, dan membangun Istana Jembatan Adhana di atas Sayhan. Ketika ia diangkat menjadi wakil pada tahun 171 H, ia mengetahui bahwa bangsa Romawi telah bersekongkol untuk memperkuat Tarsus, tetapi ia mendahului mereka dalam membangunnya oleh Harthama ibn A'yan dan Faraj ibn Sulaym dan menetapkannya di dua Nadbatine. Pada tahun 180 H, ia memerintahkan pembangunan dan penguatan Ain Zarbah Ia menugaskan para pejuang dan memerintahkan pembangunan kota Gereja Hitam, menamai kota-kota perbatasan sebagai ibu kota, mengembalikan tawanan Siprus setelah Hayy ibn Ma'youf, mengembalikan kehilangan Palestina kepada rakyatnya di tangan Harthama melalui bantuan dan pembalasan, membagikan kekayaan di perbatasan dan pesisir, serta memulai kampanye yang belum pernah dilakukan sebelumnya dengan Muawiya ibn Amr. Menurut Al-Suyuti, ia lahir di Rayy pada tahun 148 H, dan ibunya adalah Al-Khayzaran, um Walad. Selama masa kekhalifahannya, ia berdoa seratus rak'ah setiap hari hingga meninggal, meninggalkannya hanya karena sakit dan memberi amal dari Ia menghabiskan hartanya setiap hari untuk seribu dirham, dan Bishr al-Muraisi memberitahunya tentang penciptaan Al-Qur'an. Ia berkata, 'Jika aku menang, aku akan memukul lehernya.' Ia berniat menghubungkan laut antara Laut Romawi dan Laut Qalizm di luar Al-Farma. Yahya ibn Khalid al-Barmaki berkata kepadanya: Orang Romawi biasa menculik orang dari Masjid Suci, dan kapal mereka akan masuk ke Hijaz, jadi ia meninggalkannya. Pada tahun tujuh puluh sembilan, ia melakukan Umrah di Ramadan dan tetap di Ihram hingga ia melaksanakan Haji lalu berjalan dari Mekah ke Arafat {cite: Tarikh-khulafa-minhaj-1434 hlm. 456-461} Muhammad ibn Ali al-Khurasani al-Rashid adalah khalifah pertama yang bermain dengan sawalja, bola, dan melempar busur silang ke barja, serta khalifah pertama yang bermain catur dari Abbasiyah. Al-Suli mengatakan bahwa ia adalah yang pertama memberikan pangkat dan kelas kepada para penyanyi {kutip: Tarikh-khulafa-minhaj-1434 hlm. 470-471}. Menurut al-Mas'udi, al-Rashid memperkuat perbatasan dan memperkuatnya seperti Tarsus, Azna, Umar al-Masaysa, dan distrik Almoravid. Ia adalah khalifah pertama yang bermain dengan gada di ladang, melempar busur silang di barja, dan bermain dengan Akra dan Tabtab, serta yang pertama bermain catur dari Khalifah Abbasiyah dan dengan dadu, ia mempersembahkan air liur dan menyediakan makanan. Orang-orang menamai hari-harinya karena kesegaran, kebaikan yang melimpah, dan kesuburan pada hari-hari pengantin wanita {cite:muruj-al-dhahab, hlm. 670}. Menurut al-Mas'udi, ia diikrarkan setia pada Jumat pagi, malam ketika al-Hadi meninggal, selama dua belas malam tersisa dari Rabi' al-Awwal pada tahun seratus tujuh puluh tahun seratus tujuh puluh. Al-Hadi ingin menggulingkannya, tetapi ketika ia berkata, 'Jika masalah ini sampai padaku, aku akan menjangkau mereka yang kusingkirkan, dan aku akan membenarkan mereka yang terpinggirkan, dan anak-anakmu akan lebih unggul dari anak-anakku, dan istri mereka adalah putriku, aku akan dibebaskan.' Ia marah, sehingga ia meninggal untuknya. Hamdona menikahkan putrinya dengan Ja'far ibn Musa dan Fatimah dengan Ismail ibn Musa. Ia meninggal di Tus, desa Sanabad pada tahun seratus sembilan puluh tiga, dan pemerintahannya berlangsung dua puluh tiga tahun enam bulan {cite:muruj-al-dhahab hlm. 322-325}, dan ia melaksanakan Haji pada tahun delapan puluh delapan, yang merupakan Haji terakhirnya. Abu Bakr ibn Ayyash berkata ketika ia melewati Kufa, ia tidak akan pernah kembali ke jalan ini maupun khalifah dari Abbasiyah setelahnya {cite: Muruj-al-Dhahab hlm. 330-331}, dan suatu hari ia memegang cincin kuda di Raqqa, di mana ia adalah kuda sebelumnya dan kuda kedua Al-Ma'mun, yang diwakili oleh Al-Asma'i melalui puisi Al-Khansa {cite:Muruj-al-Dhahab hlm. 349-350}. Al-Abdi mengatakan menurut Al-Mas'udi bahwa ia rajin dalam ziarah, menindaklanjuti kampanye, mendirikan pabrik, sumur, kolam, dan istana di jalan menuju Mekah. Ia membangun perbatasan, kota, dan benteng seperti Tarsus, Adhnah, Umar al-Musaysa, dan Marash, serta dengan mahir membangun tombak dan jalan bagi orang Almoravid. Ia adalah khalifah pertama yang bermain dengan gada di ladang, melempar busur silang di barja, bermain dengan Akra dan Tabtab, dan menjadi yang pertama bermain Ia bermain catur di antara khalifah Abbasiyah dan dengan dadu, memasukkan air liur dan menyediakan makanan, sehingga orang-orang menamai hari-harinya karena kesegarannya sebagai hari pengantin wanita {cite:muruj-al-dhahab, hlm. 670}. Dalam Sejarah Baghdad (biografi 7347): Ia lahir di Rayy tiga hari sebelum Dhu al-Hijjah pada tahun seratus lima puluh, atau ada yang mengatakan tahun empat puluh sembilan. Ia diikrarkan setia pada hari Jumat selama empat belas malam, dan tinggal dari Rabi' al-Awwal pada tahun tujuh puluh di Baghdad, pada hari al-Hadi meninggal pada usia sembilan belas tahun, dua bulan, dan tiga belas malam. Pada malam itu, al-Ma'mun lahir, dan dikatakan bahwa seorang khalifah lahir dan diangkat sebagai khalifah, lalu seorang khalifah meninggal; ia biasa menetap di dunia abadi, melaksanakan Haji satu tahun, dan melakukan ekspedisi setahun, dan ketika ia melaksanakan Haji, seratus dari mereka akan menemaninya Para ahli hukum dan anak-anak mereka. Ia mencintai hukum dan ahli hukum serta tidak menyukai perempuan dalam agama dan debat. Ia menangis di hadapan Abu Muawiyah yang buta karena hadits itu: \"Aku berharap aku bisa dibunuh di jalan Allah dan kemudian dihidupkan kembali.\" Ia memintanya untuk melakukan serangan, tetapi ia menjawab: Tempatmu dalam Islam lebih besar, tetapi pasukan dikirim. Ia meninggal di Tus pada malam Sabtu, 4 Jumada al-Akhirah, tahun 193 H, dan dimakamkan di desa Sanabadh. Putranya Salih memimpin shalat pemakaman untuknya, dan ia berusia 45 tahun, dan kekhalifahannya berlangsung selama 23 tahun, dua bulan, dan enam belas hari {cite:History-baghdad-khatib J.11, hlm.5-15}. Harun ibn Muhammad al-Mahdi, khalifah Abbasiyah kelima, lahir di Rayy pada tahun 149 H / 766 M menurut Ensiklopedia Islam dan telah bersumpah setia kepada kekhalifahan pada 15 Rabi al-Awwal 170 H / 786 M. Artikel tersebut menyebutkan bahwa wazir Yahya ibn Khalid al-Barmaki dan kedua putranya memerintah selama sekitar tujuh belas tahun hingga kejatuhan mereka pada 187 H, bahwa ia mengatur perbatasan dalam kesatuan ibu kota dan secara pribadi memimpin kampanye melawan Bizantium pada tahun 187 dan 190 M, serta bahwa pemerintahannya menyaksikan pemberontakan di Levant, Mesir, Ifriqiya, Yaman, dan Khorasan. Artikel tersebut berargumen bahwa pembagian negaranya di antara putra-putranya mulai menurun, dan bahwa ia meninggal di Tus pada 3 Jumada al-Akhirah 193 H / 809 M."
