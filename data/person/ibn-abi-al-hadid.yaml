  ar: "الفقيه الأديب عز الدين أبو حامد عبد الحميد بن هبة الله بن محمد بن حسين بن أبي الحديد المدائني؛ انتدب للرد على ضياء الدين بن الأثير صاحب «المثل السائر في أدب الكاتب والشاعر» فجمع مؤاخذاته عليه في كتاب سماه «الفلك الدائر على المثل السائر»؛ كان فقيهاً أديباً فاضلاً وله أشعار ملاحة؛ صاحب الشرح المشهور على نهج البلاغة؛ توفي ببغداد {cite:wafayat-ayan}."
  en: "Izz al-Din Ibn Abi al-Hadid al-Mada'ini (586–655) — the Baghdad faqih-adib, immortal commentator on Nahj al-Balagha; commissioned to refute Ibn al-Athir's al-Mathal al-Sa'ir, which he did in al-Falak al-Da'ir {cite:wafayat-ayan}."
