summary:
  ar: "الفقيه الأديب عز الدين أبو حامد عبد الحميد بن هبة الله بن محمد بن حسين بن أبي الحديد المدائني؛ انتدب للرد على ضياء الدين بن الأثير صاحب «المثل السائر في أدب الكاتب والشاعر» فجمع مؤاخذاته عليه في كتاب سماه «الفلك الدائر على المثل السائر»؛ كان فقيهاً أديباً فاضلاً وله أشعار ملاحة؛ صاحب الشرح المشهور على نهج البلاغة؛ توفي ببغداد {cite:wafayat-ayan}."
  en: "Izz al-Din Ibn Abi al-Hadid al-Mada'ini (586–655) — the Baghdad faqih-adib, immortal commentator on Nahj al-Balagha; commissioned to refute Ibn al-Athir's al-Mathal al-Sa'ir, which he did in al-Falak al-Da'ir {cite:wafayat-ayan}."
  es: "Izz al-Din Ibn Abi al-Hadid al-Mada'ini (586–655): el faqih-adib de Bagdad, comentarista inmortal de Nahj al-Balagha; recibió el encargo de refutar al-Mathal al-Sa'ir de Ibn al-Athir, lo cual hizo en al-Falak al-Da'ir {cita:wafayat-ayan}."
  fr: "Izz al-Din Ibn Abi al-Hadid al-Mada'ini (586-655) — le faqih-adib de Bagdad, commentateur immortel de Nahj al-Balagha; chargé de réfuter al-Mathal al-Sa'ir d'Ibn al-Athir, ce qu'il a fait dans al-Falak al-Da'ir {cite: wafayat-ayan}."
  ur: "عزالدین ابن ابی الحدید المدائنی (586-655) - بغداد کے فقیہ ادیب، نہج البلاغہ پر لافانی مفسر؛ ابن الثیر کی المثل السعیر کی تردید کا حکم دیا، جو اس نے الفلق الدائر میں کیا تھا۔"
  tr: "Hukukçu ve yazar İzz'eddin Ebu Hamid Abd al-Hamid ibn Hibat Allah ibn Muhammed ibn Hüseyin ibn Ebi el-Hadid el-Medeyni; 'Al-Mathal al-Sa'ir fi Adab al-Katib wa al-Sha'ir' adlı eserin yazarı Diya al-Din ibn al-Athir'e yanıt vermekle görevlendirildi. Eleştirilerini 'Yürüyen Atasözü Yörüngesinde Yörünge' adlı kitabında topladı. Bir hukukçu, erdemli bir edebi figür ve 'Navrah şiiri; ünlü Nahj al-Balagha şerhinin yazarı' adlı eserin yazarıydı. Bağdat'ta vefat etti {kaynak:wafayat-ayan}."
  id: "Ahli hukum dan penulis Izz al-Din Abu Hamid Abd al-Hamid ibn Hibat Allah ibn Muhammad ibn Husayn ibn Abi al-Hadid al-Mada'ini; ia ditugaskan untuk menanggapi Diya al-Din ibn al-Athir, penulis 'Al-Mathal al-Sa'ir fi Adab al-Katib wa al-Sha'ir.' Ia mengumpulkan kritiknya dalam sebuah buku yang ia berjudul 'The Orbiting Orbit on the Walking Proverb.' Ia adalah seorang ahli hukum, tokoh sastra yang berbudi luhur, dan penulis 'puisi Navrah; penulis komentar terkenal tentang Nahj al-Balagha.' Ia meninggal di Baghdad {cite:wafayat-ayan}."
