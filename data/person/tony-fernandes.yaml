summary:
  ar: "طوني فرنانديز (وُلد في 30 نيسان 1964 في كوالالمبور) رجل أعمال ماليزي اشترى طيران آسيا المفلسة من الحكومة الماليزية سنة 2001 برينغيت واحد وحولها إلى أنجح شركة طيران منخفض التكلفة في آسيا، بعد مسيرة تنفيذية في وارنر ميوزك، وأسس مجموعة تيون، وامتلك فريق كاترهام للفورمولا 1 ونادي كوينز بارك رينجرز لكرة القدم حتى 2023."
  en: "Tony Fernandes (born 30 April 1964 in Kuala Lumpur) is a Malaysian entrepreneur who bought the failing, government-owned AirAsia in 2001 for one ringgit and turned it into Asia's leading budget airline, after an executive career at Warner Music; he founded the Tune Group, and owned the Caterham Formula One team and Queens Park Rangers football club, the latter until 2023."
  ur: "ٹونی فرنینڈس (پیدائش 30 اپریل 1964، کوالالمپور) ملائیشیائی کاروباری ہیں جنھوں نے 2001 میں ناکام سرکاری ایئرلائن ایئر ایشیا کو ایک رنگٹ میں خرید کر اسے ایشیا کی سرکردہ بجٹ ایئرلائن بنا دیا؛ اس سے پہلے وہ وارنر میوزک میں ایگزیکٹو رہے، انھوں نے ٹیون گروپ قائم کیا، اور کیٹرہم فارمولا ون ٹیم اور کوئینز پارک رینجرز فٹ بال کلب کے مالک رہے — مؤخر الذکر 2023 تک۔"
