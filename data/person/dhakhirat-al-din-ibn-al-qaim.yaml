id: person/dhakhirat-al-din-ibn-al-qaim
class: person
label:
  ar: "ذخيرة الدين أبو العباس أحمد بن القائم"
  en: "Dhakhirat al-Din ibn al-Qa'im"
summary:
  ar: "ولد الخليفة القائم بأمر الله؛ في شعبان سنة أربعين وأربعمائة خُتن بأمر الخليفة وذُكر على المنابر بأنه ولي العهد {cite:muntazam-ibn-al-jawzi j.8 p.479}. توفي في ذي القعدة سنة سبع وأربعين وأربعمائة وكان قد نشأ نشأة حسنة، فعظمت الرزية وجلس رئيس الرؤساء للعزاء في رواق بجناح دار السلام، وأُمر الناس بإخراق الثياب وتشويش العمائم، وقطع الرواق بسرادق وجعل وراءه التابوت فخرج الخليفة فصلّى عليه والناس من بعد السرادق وكبّر أربعًا، وانقطع ضرب الطبل أيام التعزية من دار الخلافة ومن الخيام السلطانية {cite:muntazam-ibn-al-jawzi j.8 p.507}."
  en: "Son of the caliph al-Qa'im — circumcised in Sha'ban 440 and named on the minbars as heir apparent; he died in Dhu'l-Qa'da 447 while still young, to great mourning: the Ra'is al-Ru'asa' held condolence in the Dar al-Salam portico, mourners rent their garments, the bier was set behind a curtain while the caliph prayed over him with four takbirs, and the drums fell silent in both the caliph's palace and the sultan's pavilions {cite:muntazam-ibn-al-jawzi j.8 p.479,507}."
