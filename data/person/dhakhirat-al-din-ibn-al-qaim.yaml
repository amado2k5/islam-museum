id: person/dhakhirat-al-din-ibn-al-qaim
class: person
label:
  ar: "ذخيرة الدين أبو العباس أحمد بن القائم"
  en: "Dhakhirat al-Din ibn al-Qa'im"
  es: "Dhakhirat al-Din ibn al-Qa'im"
  fr: "Dhakhirat al-Din ibn al-Qa'im"
  ur: "ذخیرات الدین ابن القیم"
summary:
  ar: "ولد الخليفة القائم بأمر الله؛ في شعبان سنة أربعين وأربعمائة خُتن بأمر الخليفة وذُكر على المنابر بأنه ولي العهد {cite:muntazam-ibn-al-jawzi j.8 p.479}. توفي في ذي القعدة سنة سبع وأربعين وأربعمائة وكان قد نشأ نشأة حسنة، فعظمت الرزية وجلس رئيس الرؤساء للعزاء في رواق بجناح دار السلام، وأُمر الناس بإخراق الثياب وتشويش العمائم، وقطع الرواق بسرادق وجعل وراءه التابوت فخرج الخليفة فصلّى عليه والناس من بعد السرادق وكبّر أربعًا، وانقطع ضرب الطبل أيام التعزية من دار الخلافة ومن الخيام السلطانية {cite:muntazam-ibn-al-jawzi j.8 p.507}."
  en: "Son of the caliph al-Qa'im — circumcised in Sha'ban 440 and named on the minbars as heir apparent; he died in Dhu'l-Qa'da 447 while still young, to great mourning: the Ra'is al-Ru'asa' held condolence in the Dar al-Salam portico, mourners rent their garments, the bier was set behind a curtain while the caliph prayed over him with four takbirs, and the drums fell silent in both the caliph's palace and the sultan's pavilions {cite:muntazam-ibn-al-jawzi j.8 p.479,507}."
  es: "Hijo del califa al-Qa'im — circuncidado en Sha'ban 440 y nombrado en los minbars como heredero aparente; murió en Dhu'l-Qa'da 447 siendo aún joven, en medio de un gran luto: los Ra'is al-Ru'asa' celebraron el pésame en el pórtico de Dar al-Salam, los dolientes rasgaron sus vestiduras, el féretro fue colocado detrás de una cortina mientras el califa oraba por él con cuatro takbirs, y los tambores enmudecieron tanto en el palacio del califa como en los pabellones del sultán {cite:muntazam-ibn-al-jawzi j.8 p.479,507}."
  fr: "Fils du calife al-Qa'im — circoncis en Sha'ban 440 et nommé sur les minbars comme héritier présomptif; il mourut en Dhu'l-Qa'da 447 alors qu'il était encore jeune, dans un grand deuil: les Ra'is al-Ru'asa' présentèrent leurs condoléances dans le portique Dar al-Salam, les personnes en deuil déchirèrent leurs vêtements, le cercueil fut placé derrière un rideau pendant que le calife priait sur lui avec quatre takbirs, et les tambours se turent aussi bien dans le palais du calife que dans les pavillons du sultan {cite:muntazam-ibn-al-jawzi j.8 p.479,507}."
  ur: "خلیفہ القائم کا بیٹا - شعبان 440 میں ختنہ کیا گیا اور منبروں پر ظاہری وارث کے طور پر نامزد کیا گیا؛ آپ کی وفات ذوالقعدہ 447 میں ہوئی جب کہ وہ ابھی جوان تھے، بڑے سوگ کے ساتھ: رئیس الروساء نے دارالسلام کے صحن میں تعزیت کی، سوگواروں نے اپنے کپڑے پھاڑ لیے، بیئر کو پردے کے پیچھے رکھا گیا تھا جب کہ خلیفہ نے چار تکبیروں کے ساتھ ان پر نماز پڑھی، اور خاموشی اور چپل دونوں میں گرے سلطان کے پویلینز {حوالہ دیں:منتظم ابن الجوزی ج8 صفحہ 479,507}۔"
