summary:
  ar: "حارس مرمى سنغالي محترف (وُلد سنة 1992 في مونتيفيلييه بفرنسا). سرّحه تشيربورغ سنة 2014 فبقي عامًا بلا نادٍ سجّل خلاله نفسه عاطلًا عن العمل، ثم أعاد بناء مسيرته عبر رديف مرسيليا وريمس ورين إلى تشيلسي، حيث فاز بدوري أبطال أوروبا 2021 وسُمّي أفضل حارس مرمى في جوائز فيفا؛ انتقل إلى الأهلي السعودي سنة 2023 وفاز مع السنغال بكأس أمم أفريقيا مرتين (2021 و2025)."
  en: "Senegalese professional goalkeeper (born 1992 in Montivilliers, France). Released by Cherbourg in 2014, he spent a year without a club during which he registered as unemployed, then rebuilt his career through Marseille's reserves, Reims and Rennes to Chelsea, where he won the 2021 Champions League and was named The Best FIFA Men's Goalkeeper; he joined Al-Ahli in 2023 and won two Africa Cup of Nations titles with Senegal (2021 and 2025)."
  ur: "سینیگالی پیشہ ور گول کیپر (پیدائش 1992، مونٹیویلیے، فرانس)۔ 2014 میں شیربورگ نے انہیں فارغ کر دیا اور وہ ایک سال بغیر کسی کلب کے رہے، جس دوران انہوں نے خود کو بے روزگار درج کرایا؛ پھر مارسیلے کے ریزرو، ریمس اور رین سے ہوتے ہوئے چیلسی پہنچے، جہاں انہوں نے 2021 چیمپئنز لیگ جیتی اور فیفا کے بہترین مرد گول کیپر قرار پائے؛ 2023 میں وہ الاہلی (سعودی عرب) میں شامل ہوئے اور سینیگال کے ساتھ دو بار افریقہ کپ آف نیشنز (2021 اور 2025) جیتا۔"
