label: { ar: "الحافظ شمس الدين السخاوي", en: "Shams al-Din al-Sakhawi", fr: "Shams al-Din al-Sakhawi", ur: "حافظ شمس الدین سخاوی", es: "Shams al-Din al-Sakhawi" }
summary:
  ar: "الحافظ شمس الدين أبو الخير محمد بن عبد الرحمن السخاوي الأصل القاهري المولد الشراعي المذهب نزيل الحرمين، في شذرات الذهب ولد في ربيع الأول سنة إحدى وثلاثين وثمان مئة وحفظ القرآن وهو صغير وحفظ عمدة الأحكام والتنبيه والمنهاج وألفية ابن مالك وألفية العراقي والشاطبية والنخبة لابن حجر وكلما حفظ كتاباً عرضه على مشايخه وبرع في الفقه والعربية والقراءات والحديث والتاريخ وشارك في الفرائض والحساب والتفسير وأصول الفقه والميقات وأخذ عن جماعة يزيدون على أربع مئة نفس وأذن له غير واحد بالإفتاء والتدريس والإملاء وسمع الكثير على شيخه الحافظ ابن حجر العسقلاني ولازمه أشد الملازمة وحمل عنه ما لم يشاركه فيه غيره وقال عنه هو أمثل جماعتي وأذن له وكان يروي صحيح البخاري عن أزيد من مئة وعشرين نفساً ورحل إلى الآفاق وجاب البلاد ودخل حلب ودمشق وبيت المقدس واجتمع له من المرويات ما يفوق الوصف وكان بينه وبين النبي عشرة أنفس في الإسناد وحج وجاور مراراً وآخرها جاور المدينة إلى أن مات يوم الأحد ثامن وعشرين شعبان سنة اثنتين وتسع مئة ودفن بالبقيع بجوار مشهد الإمام مالك وعمل الناس من أهل الحرمين والقادمين عليهما عنه شيئاً كثيراً ومن تصانيفه الجواهر والدرر في ترجمة شيخه ابن حجر وفتح المغيث بشرح ألفية الحديث والضوء اللامع لأهل القرن التاسع في عدة مجلدات ذكر فيه لنفسه ترجمة على عادة المحدثين والمقاصد الحسنة في الأحاديث الجارية على الألسنة وهو أجمع وأتقن من كتاب السيوطي المسمى بالجواهر المنتثرة وفي كل واحد منهما ما ليس في الآخر والقول البديع في الصلاة على الحبيب الشفيع وعمدة المحتج في حكم الشطرنج والإعلان بالتوبيخ على من ذم علم التاريخ وهو نفيس جداً والأصل الأصيل في تحريم النقل من التوراة والإنجيل وتحرير الميزان وعمدة القارئ والسامع في ختم الصحيح الجامع وغنية المحتاج في ختم صحيح مسلم وانتهى إليه علم الجرح والتعديل {cite:shadharat-dhahab p. 431-433} {cite:daw-lami-jil-1992 8/2-32}."
  en: "Cairo's last great hadith master (831-902): Ibn Hajar's closest student — 'the best of my company' — a transmission chain of ten souls to the Prophet, over four hundred teachers, four pilgrimages and long sojourns in the two sanctuaries, then a Medinan recluse composing al-Daw' al-Lami' for the ninth century and Fath al-Mughith, dying 28 Sha'ban 902 and buried in al-Baqi' beside Malik; with him the era of jarh wa-ta'dil ended {cite:shadharat-dhahab p. 431-433} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 946-947}."
  fr: "Le dernier grand maître de hadith du Caire (831-902)  : le plus proche élève d'Ibn Hajar — « Le meilleur de ma compagnie  » — une chaîne de transmission de dix âmes au Prophète, plus de quatre cents enseignants, quatre pèlerinages et longs séjours dans les deux sanctuaires, puis un reclus médinois composant al-Daw' al-Lami' pour le IXe siècle et Fath al-Mughith, mourant 28 chaabane 902 et enterré à al-Baqi' à côté de Malik ; avec lui l'ère du jarh wa-ta'dil terminée {cite:shadharat-dhahab p. 431-433} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 946-947}."
  ur: "قاہرہ کے آخری عظیم محدث ⁦(831-902ھ)⁩: ابن حجر کے قریب ترین شاگرد — «میری جماعت کا بہترین» — نبی تک دس وسائط کی سند، چار سو سے زائد مشائخ، چار حج اور حرمین میں طویل مجاورتیں، پھر مدینہ میں مقیم ہو کر «الضوء اللامع» اور «فتح المغیث» جیسی کتابیں لکھیں، 28 شعبان 902ھ کو فوت ہوئے اور بقیع میں امام مالک کے پہلو میں دفن ہوئے؛ ان کے ساتھ جرح و تعدیل کا دور ختم ہوا {cite:shadharat-dhahab p. 431-433} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 946-947}۔"
  es: "El último gran maestro de hadices de El Cairo (831-902): el alumno más cercano de Ibn Hajar —'el mejor de mi compañía'— una cadena de transmisión de diez almas al Profeta, más de cuatrocientos maestros, cuatro peregrinaciones y largas estancias en los dos santuarios, luego un ermitaño de Medina que compuso al-Daw' al-Lami' para el siglo IX y Fath al-Mughith, murió el 28 de Sha'ban de 902 y fue enterrado en al-Baqi' junto a Malik; con él terminó la era de jarh wa-ta'dil {cite:shadharat-dhahab p. 431-433} {cite:encyclopaedia-of-islam-2 vol. 8 pp. 946-947}."
  tr: "El-Hafız Şemseddin Ebu el-Khair Muhammed bin Abdurrahman el-Sakhavi, aslen Kahire'den, Şeriat mezhebi, mezhebinde doğmuş ve İki Kutsal Cami'nin sakini. 831 Hicri yılında Rabi' al-Awwal'daki Şadharat al-Dhahab'da doğmuştur. Genç yaşta Kur'an'ı ezberlemiş, 'Umdat al-Ahkam, Al-Tanbih, Al-Min' İbn Hajar'ın Hacı, Alfiyya İbn Malik, Alfiyya al-Iraqi, al-Shatibiyyah ve al-Nukhbah kitaplarını ezberlediğinde öğretmenlerine sunardı. Fıkıh, Arapça okumalar, okumalar, hadis ve tarihte üstün başarı gösterdi. Miras, aritmetik, tefsir, fıkıh ilkeleri ve mikat derslerine katıldı ve dört yüzü aşan bir grupta eğitim aldı. Birden fazla kişi tarafından fetva verme, öğretme ve dikte etme izni verildi. Öğretmeni Hafız İbn Hajar al-Askelani'den çok şey duydu ve onunla yakından bağlantılıydı. Ondan kimsenin paylaşmadığı şeyleri taşıdı. Onun hakkında \"O cemaatimin en iyisidir\" dedi ve izin aldı. Sahih al-Bukhari'yi yüz yirmiden fazla kişiden anlattı, ufuklara seyahat etti, topraklarda dolaştı, Halep, Şam ve Kudüs'e girdi. Sayısız rivayet topladı ve kendisiyle Peygamber arasında on kişi zincirlenmiş bir aktarım vardı. Hac yaptı ve birçok kez yaşadı, sonuncusu Medine yakınlarındaydı Dokuz yüz yirmi iki hicri yılının Şaban ayının yirmi sekizinci Pazar günü vefat etti ve İmam Malik'in türbesinin yanındaki El-Baqi'ye defnedildi. İki Müdarrik Camii halkı ve buraya gelenler arasında onun hakkında çok şey yaptı. Eserleri arasında, hocası İbn Hacer'in biyografisindeki El-Cevahir Durar, Elfiyye el-Hadis'in açıklaması ile Feti'l-Muğit ve dokuzuncu yüzyıl halkının birkaç ciltte yazdığı El-Dav' el-Lami yer alır; burada kendisinin biyografisini, hadis âlimlerinin geleneğine ve dillerde yaygın olarak dolaşan iyi niyetlere göre anlatmıştır. El-Süyüsü'nün El-Cevahir El-Muntanata adlı kitabından daha kapsamlı ve mükemmelleştirilmiştir ve her birinde Bunlar arasında diğerinde olmayanlar arasında, Sevgili Aracı'ya bereket gönderme hakkındaki zarif ifade, saçmanın hükmündeki argümanın temel direği, çok değerli olan tarih bilimini eleştirenlerin azarlanması, Tevrat ve İncil'den aktarımı yasaklayan orijinal ilke, terazinin düzenlenmesi, Sahih al-Jami'yi tamamlamada okuyucu ve dinleyicinin temel taşları, muhtaçların Sahih Müslüman'ı tamamlamadaki zenginliği ve eleştiri ile doğrulama bilimi ona ulaşmıştır {cite:shadharat-dhahab s. 431-433} {cite:daw-lami-jil-1992 8/2-32} yer alır."
  id: "Al-Hafiz Shams al-Din Abu al-Khair Muhammad ibn Abd al-Rahman al-Sakhawi, berasal dari Kairo, lahir dalam Syariah, sekte dan penghuni Dua Masjid Suci. Ia lahir di Shadharat al-Dhahab di Rabi' al-Awwal pada tahun 831 H. Ia menghafal Al-Qur'an sejak usia muda, menghafal 'Umdat al-Ahkam, Al-Tanbih, Al-Minhaj, Alfiyya Ibn Malik, Alfiyya al-Iraqi, al-Shatibiyyah, dan al-Nukhbah oleh Ibn Hajar. Setiap kali ia menghafal sebuah buku, ia akan mempersembahkannya kepada gurunya. Ia unggul dalam bidang firisprudensi, pembacaan Arab, pembacaan, hadis, dan sejarah. Ia berpartisipasi dalam bidang warisan, aritmatika, tafsir, prinsip fiq, dan miqat, serta belajar di bawah kelompok yang lebih dari empat ratus. Ia diberikan izin oleh lebih dari satu orang untuk mengeluarkan fatwa, mengajar, dan mendikta. Ia banyak mendengar dari gurunya, Hafiz Ibn Hajar al-Asqalani, dan memiliki hubungan erat dengannya. Ia membawa dari gurunya apa yang tidak dimiliki orang lain. Ia berkata tentangnya, \"Dialah yang terbaik di komunitasku,\" dan ia diberi izin. Ia menceritakan Sahih al-Bukhari dari lebih dari seratus dua puluh orang, melakukan perjalanan ke cakrawala, menjelajahi negeri, memasuki Aleppo, Damaskus, dan Yerusalem. Ia mengumpulkan banyak narasi, dan di antara dirinya dan Nabi terdapat sepuluh orang yang dirantai dalam transmisi. Ia melaksanakan Haji dan hidup berkali-kali, dan yang terakhir adalah dekat Madinah Ia meninggal pada hari Minggu, tanggal dua puluh delapan Sha'ban tahun sembilan ratus dua puluh dua H, dan dimakamkan di Al-Baqi' di sebelah makam Imam Malik. Ia banyak berbuat demikian di antara umat Dua Masjid Suci dan mereka yang datang ke sana. Di antara karya-karyanya adalah Al-Jawahir wal-Durar dalam biografi gurunya Ibn Hajar, Fath al-Mughith dengan penjelasan tentang Alfiyyah al-Hadis, dan Al-Daw' al-Lami' oleh orang-orang abad kesembilan dalam beberapa jilid, di mana ia menyebutkan biografi dirinya sesuai kebiasaan para ulama hadis dan niat baik dalam hadits yang umum beredar di bahasa. Ia lebih komprehensif dan sempurna daripada kitab Al-Suuti yang disebut Al-Jawahir Al-Muntanata, dan dalam setiap buku Di antaranya adalah apa yang tidak ada dalam yang lain, pernyataan indah tentang mengirimkan berkat kepada Perantara yang Dikasihi, pilar argumen dalam pemerintahan catur, mengumumkan teguran bagi mereka yang mengkritik ilmu sejarah yang sangat berharga, prinsip asli yang melarang transmisi dari Taurat dan Injil, penyuntingan skala, pilar pembaca dan pendengar dalam menyelesaikan Sahih al-Jami', dan kekayaan orang yang membutuhkan dalam menyelesaikan Sahih Muslim, dan ilmu kritik serta pengesahan yang sampai kepadanya {cite:shadharat-dhahab hlm. 431-433} {cite:daw-lami-jil-1992 8/2-32}."
