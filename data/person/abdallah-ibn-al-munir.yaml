summary:
  ar: "عبد الله بن المنير المروزي، صديق وزاهد؛ روى عنه ابن مخلد وكان ثقة؛ حكى يحيى بن بدر القرشي أنه كان يوم الجمعة قبل الصلاة يكون بقزوين فإذا كان في وقت صلاة الجمعة يُرى في مسجد آمد وكان الناس يقولون إنه يمشي على الماء فقيل له فقال: أما المشي على الماء فلا أدري ولكن إذا أراد الله جمع حافتي النهر حتى يعبر الإنسان؛ وكان إذا خرج إلى البرية مع أصحابه جمع شيئًا كالأشنان فيدخل السوق فيبيعه ويتعيش به، وذُكر أنه مرّ بأسد رابض على الطريق فتقدّم وحده إليه وغمزه ثم قال لأصحابه: مرّوا؛ توفي في رمضان سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 128}."
  en: "Al-Marwazi ascetic heard by Ibn Makhlid; Yahya ibn Badr saw him at Qazwin before Friday prayer then again at the Amid mosque — 'whether I walk on water I do not know, but God gathers the river's edges until a man crosses.' Once, meeting a lion couched on the road, he walked up alone, whispered to it, and told his companions to pass. He died in Ramadan 262 {cite:muntazam-ibn-al-jawzi p. 128}."
  fr: "Ascète de Merv entendu par Ibn Makhlid ; Yahya ibn Badr le vit à Qazwin avant la prière du vendredi, puis de nouveau à la mosquée d'Amid — « que je marche sur l'eau, je ne le sais pas, mais Dieu rapproche les rives du fleuve jusqu'à ce qu'un homme traverse ». Un jour, rencontrant un lion couché sur la route, il s'en approcha seul, lui murmura quelque chose et dit à ses compagnons de passer. Il mourut en ramadan 262 {cite:muntazam-ibn-al-jawzi p. 128}."
  es: "Ibn Makhlid escuchó al asceta Al-Marwazi; Yahya ibn Badr lo vio en Qazwin antes de la oración del viernes y luego en la mezquita de Amid: «No sé si camino sobre el agua, pero Dios aprieta las orillas del río hasta que un hombre lo cruza». En una ocasión, al encontrarse con un león recostado en el camino, se acercó solo, le susurró algo y les dijo a sus compañeros que pasaran. Murió en Ramadán del año 262 {cite:muntazam-ibn-al-jawzi, p. 128}."
  ur: "المروازی سنیاسی ابن مخلد نے سنا۔ یحییٰ بن بدر نے اسے قزوین میں جمعہ کی نماز سے پہلے دیکھا اور پھر مسجد امید میں - 'میں پانی پر چلوں یا نہیں مجھے نہیں معلوم، لیکن خدا دریا کے کناروں کو اس وقت تک جمع کرتا ہے جب تک کہ آدمی پار نہ ہو جائے۔' ایک دفعہ سڑک پر ایک شیر سے ملاقات ہوئی، وہ اکیلا چلا، اس سے سرگوشی کی، اور اپنے ساتھیوں کو گزرنے کو کہا۔ آپ کی وفات رمضان المبارک 262 میں ہوئی۔ 128}۔"
  tr: "Abdullah ibn el-Munir el-Marwazi, bir dost ve zümredendi; İbn Makhlad ondan rivayet etti ve güvenilir biriydi; Yahya ibn Badr el-Kureşi, cuma namazından önce Kazvin'de olduğunu, cuma namazı vakti geldiğinde ise Amid mescidinde görüldüğünü rivayet etti. İnsanlar onun su üzerinde yürüdüğünü söylerdi, bu yüzden kendisine sorulduğunda şöyle dedi: \"Su üzerinde yürümeye gelince, bilmiyorum, fakat Allah dilerse, bir insan karşıya geçebilsin diye nehrin iki yakasını bir araya getirir.\" Arkadaşlarıyla çöle gittiğinde sabunotu gibi bir şey toplar ve onu satarak geçimini sağlardı. Yolda yatan bir aslanın yanından geçtiği, yalnız başına yanına gidip dürttüğü, sonra da arkadaşlarına \"Geçin gidin\" dediği rivayet edilir. 262 yılının Ramazan ayında vefat etti. {cite:muntazam-ibn-al-jawzi s. 128}."
  id: "Abdullah ibn al-Munir al-Marwazi, seorang sahabat dan seorang pertapa; Ibnu Makhlad meriwayatkan darinya dan dia dapat dipercaya; Yahya ibn Badr al-Qurashi meriwayatkan bahwa pada hari Jumat sebelum salat, ia berada di Qazvin, dan ketika tiba waktu salat Jumat, ia terlihat di masjid Amid. Orang-orang biasa mengatakan bahwa ia berjalan di atas air, jadi ketika ditanya tentang hal itu, ia berkata: Mengenai berjalan di atas air, saya tidak tahu, tetapi jika Allah menghendaki, Dia akan menyatukan kedua tepi sungai sehingga seseorang dapat menyeberanginya; dan ketika ia pergi ke padang pasir bersama para sahabatnya, ia akan mengumpulkan sesuatu seperti sabu dan pergi ke pasar untuk menjualnya dan mencari nafkah darinya. Disebutkan bahwa ia melewati seekor singa yang berbaring di jalan, lalu ia mendekatinya sendirian dan menyenggolnya, kemudian ia berkata kepada para sahabatnya: Lewatlah; ia meninggal pada bulan Ramadan tahun 262 {kutip:muntazam-ibn-al-jawzi hlm. 128}."
