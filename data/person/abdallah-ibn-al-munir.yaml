summary:
  ar: "عبد الله بن المنير المروزي، صديق وزاهد؛ روى عنه ابن مخلد وكان ثقة؛ حكى يحيى بن بدر القرشي أنه كان يوم الجمعة قبل الصلاة يكون بقزوين فإذا كان في وقت صلاة الجمعة يُرى في مسجد آمد وكان الناس يقولون إنه يمشي على الماء فقيل له فقال: أما المشي على الماء فلا أدري ولكن إذا أراد الله جمع حافتي النهر حتى يعبر الإنسان؛ وكان إذا خرج إلى البرية مع أصحابه جمع شيئًا كالأشنان فيدخل السوق فيبيعه ويتعيش به، وذُكر أنه مرّ بأسد رابض على الطريق فتقدّم وحده إليه وغمزه ثم قال لأصحابه: مرّوا؛ توفي في رمضان سنة اثنتين وستين ومائتين {cite:muntazam-ibn-al-jawzi p. 128}."
  en: "Al-Marwazi ascetic heard by Ibn Makhlid; Yahya ibn Badr saw him at Qazwin before Friday prayer then again at the Amid mosque — 'whether I walk on water I do not know, but God gathers the river's edges until a man crosses.' Once, meeting a lion couched on the road, he walked up alone, whispered to it, and told his companions to pass. He died in Ramadan 262 {cite:muntazam-ibn-al-jawzi p. 128}."
