summary:
  ar: "إعلامي بريطاني، مؤسس مشارك لمنصة «ذا مسلم فايب» الرقمية ورئيس تحريرها السابق، وهي منصة شبابية انطلقت سنة 2014 لتقديم محتوى إسلامي للمسلمين في الغرب؛ استضاف بودكاست المنصة سنوات، ثم انتقل إلى العمل الخيري الرياضي مع مؤسسة زهرة ترست."
  en: "A British media figure, co-founder and former chief editor of The Muslim Vibe, the grassroots digital media platform launched in 2014 to produce Islamic content for Muslims in the West; he hosted the platform's podcast for years before moving into charity sports work with the Zahra Trust."
  ur: "برطانوی میڈیا شخصیت، «دی مسلم وائب» کے شریک بانی اور سابق چیف ایڈیٹر؛ یہ نچلی سطح کی ڈیجیٹل میڈیا پلیٹ فارم 2014 میں مغرب کے مسلمانوں کے لیے اسلامی مواد پیش کرنے کے لیے شروع ہوئی۔ وہ برسوں پلیٹ فارم کے پوڈکاسٹ کے میزبان رہے، بعد میں زہرہ ٹرسٹ کے ساتھ خیراتی کھیلوں کے کام سے وابستہ ہوئے۔"
