summary:
  ar: "شاعر أديب بصري اتصل بالبرامكة وكان شاعرهم، ونظم كتاب «كليلة ودمنة» شعراً. وهو الذي نقل كتاب كليلة ودمنة إلى الشعر ونقله أيضا علي بن داود وبشر بن المعتمد {cite:fihrist-ibn-al-nadim p. 424}"
  en: "A poet and man of letters from Basra who attached himself to the Barmakids and served as their poet; he versified the Kalila wa-Dimna in verse."
  fr: "Poète et homme de lettres de Bassora qui s'attacha aux Barmécides et fut leur poète ; il mit en vers le livre Kalila wa-Dimna."
  es: "Poeta y hombre de letras de Basora que se unió a los Barmakids y fue su poeta; versificó el Kalila wa-Dimna en verso."
  ur: "بصرہ سے تعلق رکھنے والا ایک شاعر اور خطوط کا آدمی جس نے خود کو برمکیوں سے جوڑا اور ان کے شاعر کے طور پر خدمات انجام دیں۔ اس نے کلیلہ و دمنہ کا ترجمہ آیت میں کیا۔"
  tr: "Basra'lı bir şair ve yazar olan Firist İbn Nadim, Barmaki ailesiyle bağlantılıydı ve onların şairi olarak görev yaptı. \"Kalila ve Dimna\" adlı eseri manzum hale getirdi. Eseri şiire çeviren de kendisiydi ve eser daha sonra Ali ibn Davud ve Bişr ibn el-Mu'tamid tarafından da tercüme edildi. {cite:fihrist-ibn-al-nadim s. 424}"
  id: "Seorang penyair dan penulis dari Basra yang terkait dengan keluarga Barmakid dan menjabat sebagai penyair mereka, ia menggubah kitab \"Kalila wa Dimna\" menjadi bentuk puisi. Dialah yang menerjemahkan kitab \"Kalila wa Dimna\" ke dalam bentuk puisi, dan terjemahan tersebut juga dilakukan oleh Ali ibn Dawud dan Bishr ibn al-Mu'tamid. {cite:fihrist-ibn-al-nadim p. 424}"
