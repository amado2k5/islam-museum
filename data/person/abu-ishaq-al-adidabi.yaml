summary:
  ar: "عالم لغوي وخطّاط من لواتة، من أهل أدِدابية في برقة، عاش في النصف الثاني من القرن الخامس للهجرة، ومات في طرابلس الغرب، وما زال قبره يُزار هناك {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  en: "A philologist and calligrapher of the Luwata Berbers, lived in the second half of the 5th/11th century and died in Tripoli, where his tomb is still venerated. Al-Tidjani possessed several of his autograph copies {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  fr: "Philologue et calligraphe des Berbères Luwata, qui vécut dans la seconde moitié du 5e/11e siècle et mourut à Tripoli, où sa tombe est encore vénérée. Al-Tidjani possédait plusieurs de ses copies autographes {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  es: "Filólogo y calígrafo de los bereberes Luwata, vivió en la segunda mitad del siglo V/XI y murió en Trípoli, donde su tumba aún se venera. Al-Tidjani poseía varias copias autógrafas {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  ur: "لوواٹا بربرز کے ماہر فلسفی اور خطاط، وہ 5ویں/11ویں صدی کے دوسرے نصف میں رہتے تھے اور طرابلس میں انتقال کر گئے تھے، جہاں ان کی قبر کی اب بھی تعظیم کی جاتی ہے۔ التدجانی کے پاس ان کے آٹوگراف کی متعدد کاپیاں تھیں۔ 1 ص۔ 226}۔"
