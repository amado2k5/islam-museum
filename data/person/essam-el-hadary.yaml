summary:
  ar: "حارس مرمى مصري سابق ومدرب حراس مرمى، وُلد في كفر البطيخ بمحافظة دمياط سنة 1973 ويُلقب بـ«السد العالي». قضى أطول فترات مسيرته مع النادي الأهلي (1996–2008)، وخاض مع منتخب مصر 159 مباراة دولية بين 1996 و2018، وهو أكثر حراس مرمى مصر مشاركة دوليًا. دخل تاريخ كأس العالم في روسيا 2018 حين صار، بعمر 45 سنة و161 يومًا، أكبر لاعب يشارك في مباراة بكأس العالم على الإطلاق، وتصدى لركلة جزاء في مباراته تلك. عمل بعد اعتزاله مدربًا لحراس المرمى، ومنها مع منتخب سوريا منذ 2023."
  en: "Egyptian former professional goalkeeper and goalkeeping coach, born in Kafr El Battikh, Damietta in 1973 and nicknamed the 'High Dam'. He spent the largest part of his career at Al Ahly (1996–2008) and won 159 caps for Egypt between 1996 and 2018, the most by an Egyptian goalkeeper. At the 2018 World Cup, aged 45 years and 161 days, he became the oldest player ever to appear in a World Cup match, saving a penalty on his tournament debut. After retiring he became a goalkeeping coach, including with the Syrian national team from 2023."
  ur: "مصری سابق پیشہ ور گول کیپر اور گول کیپنگ کوچ، 1973 میں دمیاط کے قصبے کفر البطیخ میں پیدا ہوئے اور «السد العالي» (اونچا بند) کے لقب سے مشہور ہیں۔ اپنے کیریئر کا سب سے بڑا حصہ ال اہلی میں گزارا (1996–2008) اور 1996 سے 2018 کے درمیان مصر کے لیے 159 بین الاقوامی میچ کھیلے، جو کسی مصری گول کیپر کا ریکارڈ ہے۔ 2018 کے ورلڈ کپ میں 45 سال اور 161 دن کی عمر میں وہ ورلڈ کپ میچ کھیلنے والے تاریخ کے معمر ترین کھلاڑی بنے اور اپنے اس میچ میں پنالٹی بھی روکی۔ ریٹائرمنٹ کے بعد وہ گول کیپنگ کوچ بنے، جن میں 2023 سے شام کی قومی ٹیم کے ساتھ کام شامل ہے۔"
