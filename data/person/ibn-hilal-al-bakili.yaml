summary:
  ar: "أبو نصر أحمد بن هلال البكيلي بن وصيف من المحدثين وهو الذي فتح أمر العزائم في الإسلام وكان مخدوما ومناطقا وله أفعال عجيبة وأعمال حسنة وخواتيم مجربة، وله من الكتب كتاب الروح المتلاشية وكتاب المفاخر في الأعمال وكتاب تفسير ما قالته الشياطين لسليمان بن داود وما أخذ عليهم من العهود {cite:fihrist-ibn-al-nadim p. 431}."
  en: "Ibn Hilal al-Bakili — who opened the science of exorcism in Islam {cite:fihrist-ibn-al-nadim}"
