label: { ar: "ابن هلال البكيلي", en: "Ibn Hilal Al Bakili", es: "Ibn Hilal Al Bakili", fr: "Ibn Hilal Al Bakili", ur: "ابن ہلال البقیلی" }
summary:
  ar: "أبو نصر أحمد بن هلال البكيلي بن وصيف من المحدثين وهو الذي فتح أمر العزائم في الإسلام وكان مخدوما ومناطقا وله أفعال عجيبة وأعمال حسنة وخواتيم مجربة، وله من الكتب كتاب الروح المتلاشية وكتاب المفاخر في الأعمال وكتاب تفسير ما قالته الشياطين لسليمان بن داود وما أخذ عليهم من العهود {cite:fihrist-ibn-al-nadim p. 431}."
  en: "Ibn Hilal al-Bakili — who opened the science of exorcism in Islam {cite:fihrist-ibn-al-nadim}"
  es: "Ibn Hilal al-Bakili — quien abrió la ciencia del exorcismo en el Islam {cite:fihrist-ibn-al-nadim}"
  fr: "Ibn Hilal al-Bakili — qui a introduit la science de l'exorcisme en Islam {cite:fihrist-ibn-al-nadim}"
  ur: "ابن ہلال البقیلی - جس نے اسلام میں فحاشی کی سائنس کھولی"
  tr: "Ebu Nasr Ahmed bin Hilal al-Bukaili ibn Waseef, İslam'da karar meselesini başlatan hadis âlimlerinden biriydi. Bir hizmetçi ve efendiydi; mucizede işler, iyi işler ve denenmiş sonlar vardı. Kitapları arasında Kaybolan Ruh Kitabı, Solan İşler Kitabı ve Süleyman bin Davud'un Şeytanların Söylediklerinin Yorumu ve Onlardan Aldığı Antlaşmalar Kitabı yer alır {atı:fihrist-ibn-al-nadim s. 431}."
  id: "Abu Nasr Ahmad ibn Hilal al-Bukaili ibn Waseef adalah salah satu ulama hadis yang memulai masalah penentuan dalam Islam. Ia adalah seorang pelayan dan guru, dan ia memiliki perbuatan ajaib, perbuatan baik, dan akhir yang teruji. Di antara bukunya adalah Kitab Roh yang Menghilang, Kitab Perbuatan Memudar, dan Kitab Penafsiran Apa yang Dikatakan oleh Setan oleh Sulayman ibn Dawud dan Perjanjian yang Ia Ambil dari Mereka {cite:fihrist-ibn-al-nadim hlm. 431}."
