id: person/ghazan-khan
class: person
label: { ar: "قازان بن أرغون بن أبغا بن هولاكو" }
summary:
  ar: "ملك التتار، دخل في الإسلام سنة أربع وتسعين وست مئة وفرح الناس بذلك وفشا الإسلام في جيشه {cite:tarikh-khulafa-minhaj-1434 p. 731}؛ وفي شذرات الذهب أن شيخ الشيوخ صدر الدين ابن حموية الجويني أخبر الذهبي سنة خمس وتسعين أن غازان أسلم على يده بواسطة نائبه نوروز وكان يوماً مشهوداً {cite:shadharat-dhahab p. 748}."
  en: "King of the Tatars, Hulagu's great-grandson; his conversion in 694 rejoiced the people and spread Islam through his army {cite:tarikh-khulafa-minhaj-1434 p. 731}."
  es: "Rey de los tártaros, bisnieto de Hulagu; su conversión en 694 regocijó al pueblo y extendió el Islam a través de su ejército {cite:tarikh-khulafa-minhaj-1434 p. 731}."
  fr: "Roi des Tatars, arrière-petit-fils de Hulagu; sa conversion en 694 a réjoui le peuple et a répandu l'Islam à travers son armée {cite:tarikh-khulafa-minhaj-1434 p. 731}."
  ur: "تاتاروں کا بادشاہ، ہولاگو کا پڑپوتا؛ 694 میں اس کی تبدیلی سے لوگوں کو خوشی ہوئی اور اپنی فوج کے ذریعے اسلام کو پھیلایا۔ 731}۔"
  tr: "Tatarların kralı olan Tatar, 694 Hicri yılında İslam'ı benimsedi ve halk bundan büyük sevinç duydu, ordusunda İslam'ı yaydı {atıf:Tarikh-Khulafa-Minhaj-1434 s. 731}; Şadharat al-Dhahab'da, şeyhlerin şeyhi Sadr al-Din ibn Hamwiyyah al-Juwayni, 1995'te el-Dahab'a Ghazan'ın vekili Nowruz aracılığıyla İslam'ı benimsediğini ve bunun önemli bir gün olduğunu bildirmiştir {atıf:Shadharat-dhahab, s. 748}."
  id: "Raja Tatar, ia memeluk Islam pada tahun 694 H, dan orang-orang bersukacita, menyebarkan Islam di pasukannya {cite:Tarikh-Khulafa-Minhaj-1434 hlm. 731}; dalam Shadharat al-Dhahab, sheikh sheikh Sadr al-Din ibn Hamwiyyah al-Juwayni memberitahu al-Dhahabi pada tahun 1995 bahwa Ghazan memeluk Islam melalui wakilnya Nowruz, dan itu adalah hari yang penting {cite:Shadharat-dhahab, hlm. 748}."
