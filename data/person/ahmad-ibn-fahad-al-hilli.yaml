summary:
  ar: "أحمد بن محمد بن فهد الأسدي الحلي، فقيه إمامي، مولده في الحلة السيفية ووفاته وقبره بكربلاء سنة 841 هـ، من كتبه «المهذب البارع إلى شرح النافع» و«عدة الداعي»."
  en: "Ahmad ibn Muhammad ibn Fahd al-Asadi al-Hilli, an Imami (Shi'i) jurist, born at al-Hilla al-Sayfiyya, died and buried at Karbala in 841 AH; his books include 'al-Muhadhdhab al-Bari' ila Sharh al-Nafi'' and 'Iddat al-Da'i'."
  fr: "Ahmad ibn Muhammad ibn Fahd al-Asadi al-Hilli, juriste imamite (chiite), né à al-Hilla al-Sayfiyya, mort et enterré à Karbala en 841 H ; ses livres comprennent al-Muhadhdhab al-Bari' ila Sharh al-Nafi' et Iddat al-Da'i."
  es: "Ahmad ibn Muhammad ibn Fahd al-Asadi al-Hilli, un jurista imami (chií), nacido en al-Hilla al-Sayfiyya, murió y fue enterrado en Karbala en 841 d.H.; sus libros incluyen 'al-Muhadhdhab al-Bari' ila Sharh al-Nafi' e 'Iddat al-Da'i'."
  ur: "احمد بن محمد بن فہد الاسدی الحلی، ایک امامی ⁦(شیعہ)⁩ فقیہ، جو الحلۃ الصفیہ میں پیدا ہوئے، انتقال کر گئے اور 841 ہجری میں کربلا میں دفن ہوئے۔ ان کی کتابوں میں 'المحدث الباری' الا شرح النفی' اور 'عدت الدعی' شامل ہیں۔"
