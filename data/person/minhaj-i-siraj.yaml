  ar: "بطاقة أولية لمنهاج السراج الجوزجاني، مؤرخ طبقات ناصري لسلطنة دلهي والغوريين، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Minhaj-i Siraj Juzjani, the historian of the Tabaqat-i Nasiri on the Delhi sultans and Ghurids, named from an open reference description (Wikidata); his al-A'lam entry is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Minhaj-i Siraj Juzjani, el historiador del Tabaqat-i Nasiri sobre los sultanes y gúridas de Delhi, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en al-A'lam aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche provisoire de Minhaj-i Siraj Juzjani, historien du Tabaqat-i Nasiri sur les sultans de Delhi et les Ghurides, nommé d'après une description de référence ouverte (Wikidata); son entrée al-A'lam n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "دہلی کے سلطانوں اور غوریوں پر طبقات ناصری کے مؤرخ منہاجِ سراج جوزجانی کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ سے بیان کیا گیا ہے ⁦(وکی ڈیٹا)⁩؛ اس کے العالم اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Delhi Sultanlığı'nın Nasiri sınıfları ve Ghurid halkı tarihçisi Minhaj al-Siraj al-Jawzjani için ön kart, açık referans açıklamasında (Wikidata) belirtilmiştir. Çevirisi henüz Önemli Sözlük'te incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal untuk Minhaj al-Siraj al-Jawzjani, sejarawan kelas Nasiri dari Kesultanan Delhi dan suku Ghurid, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya belum ditinjau di Kamus Terkenal di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
