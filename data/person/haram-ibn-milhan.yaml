summary:
  en: "A senior Companion from Banu al-Najjar of the Khazraj, maternal uncle of Anas ibn Malik; entrusted with the Prophet's letter to Amir ibn al-Tufayl at Bi'r Ma'una; when stabbed treacherously through his neck from behind, he wiped the blood on his face and uttered his famous words: 'Allahu Akbar, I have triumphed, by the Lord of the Ka'ba!'"
  ar: "صحابي بدري من بني النجار وخال أنس بن مالك؛ حمله النبي كتابه إلى عامر بن الطفيل عند بئر معونة، فلم ينظر في الكتاب وأشار إلى رجل فطعنه بالحربة من خلفه حتى أنفذها، فأخذ حرام الدم ونضحه على وجهه وقال: الله أكبر، فزت ورب الكعبة."
