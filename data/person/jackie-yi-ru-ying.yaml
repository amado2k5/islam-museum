summary:
  ar: "مهندسة كيميائية وباحثة نانوتقنية سنغافورية أمريكية، وُلدت سنة 1966. أسست وقادت معهد الهندسة الحيوية والنانوتقنية في سنغافورة، وابتكرت أنظمة لإيصال الإنسولين تستجيب لمستوى الغلوكوز، وتعمل في مجال المواد النانوية للتطبيقات الطبية."
  en: "Singaporean-American chemical engineer and nanotechnologist, born in 1966. Founding executive director of Singapore’s Institute of Bioengineering and Nanotechnology, she invented glucose-responsive insulin delivery systems (SmartCells) and works on nanomaterials for medical applications."
