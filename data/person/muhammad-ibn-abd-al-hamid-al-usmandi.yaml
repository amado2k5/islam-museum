summary:
  ar: "محمد بن عبد الحميد بن الحسين الأسمندي السمرقندي، أبو الفتح، علاء الدين: فقيه من كبار الحنفية، مناظر من فرسان الكلام، من أهل سمرقند ونسبته إلى أسمند، رحل إلى بغداد وناظر علماءها، 488 إلى 552هـ؛ من كتبه «مختلف الرواية»."
  en: "Muhammad ibn Abd al-Hamid ibn al-Husayn al-Usmandi al-Samarqandi, Abu al-Fath, Ala al-Din: a jurist, one of the great Hanafis and a disputant, from Samarqand, named for the village of Usmand; he travelled to Baghdad and debated its scholars, 488 to 552 AH; author of «Mukhtalaf al-riwaya»."
  es: "Muhammad ibn Abd al-Hamid ibn al-Husayn al-Usmandi al-Samarqandi, Abu al-Fath, Ala al-Din: jurista, uno de los grandes hanafíes y un controvertido, originario de Samarcanda, nombre que recibe del pueblo de Usmand; viajó a Bagdad y debatió con sus eruditos entre los años 488 y 552 de la Hégira; autor de «Mukhtalaf al-riwaya»."
  fr: "Muhammad ibn Abd al-Hamid ibn al-Husayn al-Usmandi al-Samarqandi, Abu al-Fath, Ala al-Din: juriste, l'un des grands hanafites et un disputeur, de Samarcande, nommée d'après le village d'Usmand; il voyagea à Bagdad et débattit avec ses savants, de 488 à 552 AH; auteur de « Mukhtalaf al-riwaya »."
  ur: "محمد بن عبد الحمید بن الحسین العثماندی ال سمرقندی، ابو الفتح، علاء الدین: ایک فقیہ، بڑے حنفیوں میں سے ایک اور ایک متنازعہ، سمرقند سے، جس کا نام عثمان کے گاؤں کے لیے رکھا گیا ہے۔ اس نے بغداد کا سفر کیا اور اس کے علماء سے بحث کی، 488 تا 552 ہجری۔ \"مختلف الروایا\" کے مصنف۔"
  tr: "Muhammed bin Abdülhamid bin Hüseyin el-Esmendi el-Semerkendi, Ebu el-Feth, Alaa al-Din: önde gelen Hanefiler arasında bir hukukçu, teoloji şövalyeleri arasında münazara yapan bir münazaracı olan Semerkand'dan, Asmand'a atfedilen ve 488-552 Hicri yılları arasında Bağdat'a giderek onun alimleriyle tartışmıştır; kitapları arasında 'Mukhtal al-Riwayya' da vardır."
  id: "Muhammad ibn Abd al-Hamid ibn al-Husayn al-Asmandi al-Samarqandi, Abu al-Fath, Alaa al-Din: seorang ahli hukum di antara para Hafi terkemuka, seorang debater di antara para ksatria teologi dari Samarkand, yang dikaitkan dengan Asmand, melakukan perjalanan ke Baghdad dan berdebat dengan para ulamanya pada tahun 488 hingga 552 H; di antara bukunya adalah 'Mukhtal al-Riwayya'."
