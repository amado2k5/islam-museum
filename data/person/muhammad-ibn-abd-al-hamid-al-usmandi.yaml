summary:
  ar: "محمد بن عبد الحميد بن الحسين الأسمندي السمرقندي، أبو الفتح، علاء الدين: فقيه من كبار الحنفية، مناظر من فرسان الكلام، من أهل سمرقند ونسبته إلى أسمند، رحل إلى بغداد وناظر علماءها، 488 إلى 552هـ؛ من كتبه «مختلف الرواية»."
  en: "Muhammad ibn Abd al-Hamid ibn al-Husayn al-Usmandi al-Samarqandi, Abu al-Fath, Ala al-Din: a jurist, one of the great Hanafis and a disputant, from Samarqand, named for the village of Usmand; he travelled to Baghdad and debated its scholars, 488 to 552 AH; author of «Mukhtalaf al-riwaya»."
