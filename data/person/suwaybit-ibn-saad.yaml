summary:
  ar: "صحابي بدري، وفي خبر مزاح نُعَيمان أنه كان في الحملة مع أبي بكر إلى بُصرى وكان على الزاد؛ فلما طلب نعيمان منه طعاماً قال له: لا، حتى يأتي أبو بكر. فلما أراد نعيمان أن يغيظه باع نفسه لأناس على أنه عبد، فأنكر سويبط ذلك وقال إنه حر، حتى جاء أبو بكر فردوا القلائص وأخذوه، فضحك النبي منها حولاً {cite:nihayat-al-arab-nuwayri-vol4-scan p. 6}."
  en: "A Badri Companion. In the jest attributed to Nu'aymān, he was in charge of the provisions on a campaign with Abu Bakr to Busra. Nu'aymān sold him, falsely, as a slave to a caravan; he protested that he was free until Abu Bakr came and the camels were returned. The book says the Prophet laughed at the story for a year {cite:nihayat-al-arab-nuwayri-vol4-scan p. 6}."
  ur: "بدری صحابی۔ نعیمان سے منسوب ایک مزاح میں، ابوبکر کے ساتھ بصری کے سفر میں زاد راہ کے نگران تھے۔ نعیمان نے قافلے والوں کو جھوٹ بول کر انہیں غلام کے طور پر بیچ دیا؛ انہوں نے انکار کیا کہ وہ آزاد ہیں، یہاں تک کہ ابوبکر آئے اور اونٹ واپس کیے گئے۔ کتاب کے مطابق نبی اس قصے پر ایک سال تک ہنستے رہے {cite:nihayat-al-arab-nuwayri-vol4-scan p. 6}۔"
