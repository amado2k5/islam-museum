summary:
  ar: "الأشهب بن بشر الكلبي؛ ولاه الحجاج سجستان لما انقضت سنون صلح رتبيل فعاسر رتبيل في العروض التي أداها فكتب إلى الحجاج يشكوه إليه فعزله الحجاج."
  en: "al-Ashhab ibn Bishr al-Kalbi; al-Hajjaj's governor of Sijistan when the truce-years ended — he pressed Rutbil hard over the 'urud until the king's complaint reached al-Hajjaj, who dismissed him."
  fr: "Al-Ashhab ibn Bishr al-Kalbi ; gouverneur du Sijistan nommé par al-Hajjaj à l’expiration des années de trêve, il pressa durement Rutbil au sujet des ‘urud jusqu’à ce que la plainte du roi parvienne à al-Hajjaj, qui le révoqua."
  es: "Al-Ashhab ibn Bishr al-Kalbi, gobernador de Sijistan por al-Hajjaj cuando terminaron los años de tregua, presionó duramente a Rutbil por el tema del 'urud hasta que la queja del rey llegó a manos de al-Hajjaj, quien lo destituyó."
  ur: "اشہب بن بشر الکلبی؛ سجستان کے گورنر الحجاج نے جب جنگ بندی کے سال ختم ہو گئے - اس نے رطبیل کو اردو پر زور سے دبایا یہاں تک کہ بادشاہ کی شکایت الحجاج تک پہنچ گئی جس نے اسے برطرف کر دیا۔"
