summary:
  ar: "بدر الدين أبو البركات الغزي العامري القرشي الشافعي شيخ الإسلام بدمشق وبحر العلوم؛ ولد وقت العشاء ليلة الاثنين رابع عشر ذي القعدة سنة أربع وتسعمائة، وحمله والده إلى الشيخ أبي الفتح المزي الصوفي فألبسه خرقة التصوف ولقنه الذكر وأجازه بكل ما تجوز له وهو دون السنتين، وقرأ القرآن بالعشر على البدر السنهوري ولزم والده في الفقه والعربية والمنطق وقرأ على تقي الدين بن قاضي عجلون، ثم رحل إلى القاهرة فأخذ عن القاضي زكريا والبرهان بن أبي شريف والقلقشندي والقسطلاني نحو خمس سنين، وتصدَّر للتدريس وهو ابن سبع عشرة سنة؛ وولي مشيخة القراء بالجامع الأموي وإمامة المقصورة ودرس بالعادلية والشامية البرانية والمقدمية والتقوية وجمع له بين التقوية والشامية الجوانية، ولزم العزلة لا يأتي قاضياً ولا حاكماً بل يقصدونه ويستأذنون عليه، ولم يأخذ على الفتوى شيئاً وسدّ باب الهدية مطلقاً؛ وبلغت تصانيفه مائة وخمسة عشر مصنفاً من أشهرها التفاسير الثلاثة المنثور والمنظومان وأشهرها المنظوم الكبير في مائة ألف بيت وثمانين ألف بيت؛ وتوفي يوم الأربعاء سادس عشر شوال ودُفن بتربة الشيخ أرسلان {cite:shadharat-dhahab p. 403-406}."
  en: "Badr al-Din al-Ghazzi — Damascus's shaykh al-Islam; given the khirqa and a full ijaza by Abu al-Fath al-Mizzi before he was two, teaching from seventeen; holder of the Umayyad qurra' mashyakha and six madrasa chairs, who let qadis and na'ibs wait at his door and closed the gift-door absolutely; 115 works including the great verse tafsir in 180,000 verses; died Wednesday 16 Shawwal 984, buried at Shaykh Arslan's turba {cite:shadharat-dhahab p. 403-406}."
  es: "Badr al-Din al-Ghazzi — el shaykh al-Islam de Damasco; Abu al-Fath al-Mizzi le otorgó la khirqa y una ijaza completa antes de cumplir dos años, y enseñó desde los diecisiete; poseedor del mashyakha omeya de la qurra' y seis cátedras de madrasa, que hacía esperar a los cadíes y na'ibs en su puerta y cerraba la puerta de los regalos absolutamente; 115 obras, incluyendo el gran tafsir de versos en 180.000 versos; murió el miércoles 16 de Shawwal de 984, enterrado en el turba del jeque Arslan {cite:shadharat-dhahab p. 403-406}."
  fr: "Badr al-Din al-Ghazzi — le cheikh al-Islam de Damas; reçut la khirqa et une ijaza complète d'Abu al-Fath al-Mizzi avant l'âge de deux ans, enseignant à partir de dix-sept ans; titulaire de la mashyakha qurra' omeyyade et de six chaires de madrasa, qui laissait les qadis et les na'ibs attendre à sa porte et fermait absolument la porte aux dons; 115 ouvrages, dont le grand tafsir de versets en 180 000 versets; décédé le mercredi 16 Shawwal 984, enterré à la turba du cheikh Arslan {cite:shadharat-dhahab p. 403-406}."
  ur: "بدر الدین الغازی - دمشق کے شیخ الاسلام؛ دو سال کی عمر سے پہلے ابو الفتح المیزی کی طرف سے خرقہ اور مکمل اعجاز دیا گیا، سترہ سال کی عمر سے درس دیتے رہے۔ اموی قرہ مشائخ اور مدرسہ کی چھ کرسیوں کا حامل، جس نے قادیان و نایب کو اپنے دروازے پر انتظار کرنے دیا اور تحفہ کا دروازہ بالکل بند کر دیا۔ 115 کام جن میں 180,000 آیات میں عظیم آیت تفسیر بھی شامل ہے۔ بدھ 16 شوال 984 کو وفات پائی، شیخ ارسلان کی تربہ میں تدفین کی گئی۔ 403-406}۔"
  tr: "Badr al-Din Ebu el-Barakat el-Gazi el-Amiri el-Kurashi el-Şafi'i, Şam'daki Şeyh el-İslam ve Bahr al-Ulum; 904 H. Zulüd-Kı'dah'ın on dördüncü Pazartesi günü Işa namazı zamanı doğdu. Babası onu Şeyh Ebu el-Feth el-Mizzi el-Sufi'ye götürdü, ona tasavvuf giydirdi, zikri öğretti ve iki yaşından önce izin verilen her şeyi yapmasına izin verdi. Bedr el-Sanhuri yanında on gün içinde Kur'an okudu, babasının izinden giderek fikıh, Arapça ve mantık derslerinde çalıştı ve Taqi al-Din bin Kaddi Eclin'in yanında eğitim gördü. Sonra Kahire'ye giderek Kadi Zekeriye ve el-Burhan bin yanında eğitim aldı Ebu Şerif, El-Kalqasendi ve El-Kasısani yaklaşık beş yıl boyunca hizmet verdi ve on yedi yaşında öğretmenliğe başladı. Emevi Camii'nde ılahet şeyhi ve maksura imamı olarak atandı; El-Adliyye, El-Şamiyye, El-Baraniyya, El-Mükaddimiye ve Takviyye'de ders verdi. Takvak ve Haşmiyye El-Cavniyye'yi birleştirdi. Hakim veya hakim atamadan inzivaya çekildi, bunun yerine onun iznini aldı. Fetvaları asla kabul etmedi ve armağanların kapısını tamamen kapattı. Eserleri yüz on beşe ulaştı; bunların en ünlüleri üç tafsir Al-Manthor ve Al-Manzuman'dır; en ünlüsü yüz bin ve seksen bin ayetten oluşan Al-Manzum Al-Kabir'dir; Şevval'ın on altıncı günü Çarşamba günü vefat etti ve Şeyh Arslan'ın mezarına defnedildi {kaynak: shadharat-dhahab, s. 403-406}."
  id: "Badr al-Din Abu al-Barakat al-Ghazi al-Amiri al-Qurashi al-Shafi'i, Sheikh al-Islam di Damaskus dan Bahr al-Ulum; lahir pada waktu shalat Isha pada malam Senin, tanggal empat belas Dhu al-Qi'dah, 904 H. Ayahnya membawanya kepada Sheikh Abu al-Fath al-Mizzi al-Sufi, yang memakaikan jubah Sufisme, mengajarinya dhikr, dan mengizinkannya melakukan segala yang diizinkan sebelum usia dua tahun. Ia membaca Al-Qur'an dalam sepuluh hari di bawah Badr al-Sanhuri dan mengikuti ayahnya dalam bidang firispruden, Arab, dan logika, serta belajar di bawah Taqi al-Din ibn Qadi Ajloun. Kemudian ia pergi ke Kairo dan belajar di bawah Qadi Zakariya dan al-Burhan ibn Abu Sharif, Al-Qalqashandi, dan Al-Qastalani selama sekitar lima tahun, dan ia mulai mengajar pada usia tujuh belas tahun. Ia diangkat sebagai sheikh para pembaca di Masjid Umayyah dan imam maqsura, mengajar di Al-Adliyya, Al-Shamiyyah, Al-Baraniyya, Al-Muqaddimiyah, dan Taqwiyyah. Ia menggabungkan Taqwaq dan Al-Hashmiyyah Al-Jawniyyah. Ia menjaga pengasingan tanpa menunjuk hakim atau hakim, melainkan meminta izin. Ia tidak pernah menerima fatwa dan sepenuhnya menutup pintu untuk hadiah. Karyanya mencapai seratus lima belas, yang paling terkenal adalah tiga tafsir Al-Manthor dan Al-Manzuman, yang paling terkenal adalah Al-Manzum Al-Kabir, terdiri dari seratus ribu ayat dan delapan puluh ribu bait; Ia meninggal pada hari Rabu, tanggal enam belas Shawwal, dan dimakamkan di makam Sheikh Arslan {cite:shadharat-dhahab, hlm. 403-406}."
