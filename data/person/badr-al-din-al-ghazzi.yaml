summary:
  ar: "بدر الدين أبو البركات الغزي العامري القرشي الشافعي شيخ الإسلام بدمشق وبحر العلوم؛ ولد وقت العشاء ليلة الاثنين رابع عشر ذي القعدة سنة أربع وتسعمائة، وحمله والده إلى الشيخ أبي الفتح المزي الصوفي فألبسه خرقة التصوف ولقنه الذكر وأجازه بكل ما تجوز له وهو دون السنتين، وقرأ القرآن بالعشر على البدر السنهوري ولزم والده في الفقه والعربية والمنطق وقرأ على تقي الدين بن قاضي عجلون، ثم رحل إلى القاهرة فأخذ عن القاضي زكريا والبرهان بن أبي شريف والقلقشندي والقسطلاني نحو خمس سنين، وتصدَّر للتدريس وهو ابن سبع عشرة سنة؛ وولي مشيخة القراء بالجامع الأموي وإمامة المقصورة ودرس بالعادلية والشامية البرانية والمقدمية والتقوية وجمع له بين التقوية والشامية الجوانية، ولزم العزلة لا يأتي قاضياً ولا حاكماً بل يقصدونه ويستأذنون عليه، ولم يأخذ على الفتوى شيئاً وسدّ باب الهدية مطلقاً؛ وبلغت تصانيفه مائة وخمسة عشر مصنفاً من أشهرها التفاسير الثلاثة المنثور والمنظومان وأشهرها المنظوم الكبير في مائة ألف بيت وثمانين ألف بيت؛ وتوفي يوم الأربعاء سادس عشر شوال ودُفن بتربة الشيخ أرسلان {cite:shadharat-dhahab p. 403-406}."
  en: "Badr al-Din al-Ghazzi — Damascus's shaykh al-Islam; given the khirqa and a full ijaza by Abu al-Fath al-Mizzi before he was two, teaching from seventeen; holder of the Umayyad qurra' mashyakha and six madrasa chairs, who let qadis and na'ibs wait at his door and closed the gift-door absolutely; 115 works including the great verse tafsir in 180,000 verses; died Wednesday 16 Shawwal 984, buried at Shaykh Arslan's turba {cite:shadharat-dhahab p. 403-406}."
