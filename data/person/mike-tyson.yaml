    note: "No source names a school for Tyson. The English article records that he was raised Catholic, was baptized as a Baptist in 1988, and later converted to Islam, stating that he converted before entering prison; it also records his Umrah journeys of 2010 and 2022 and his December 2013 statement that he was very grateful to be a Muslim. The Arabic article gives his religion as Islam in its infobox and repeats the same account; the Urdu article states that he accepted Islam following Muhammad Ali. Wikidata's item likewise names no school. Conversion reporting and public practice are not a school attestation, so the value is unknown. The English and Arabic articles both state that media claims that he converted in prison and took the Muslim name Malik Abdul Aziz are false and that he never changed his given name; that name, which Wikidata's item lists among his aliases and which the Urdu article gives in the form Malik Umar bin Abdul Aziz, is therefore not carried in this record's names."
