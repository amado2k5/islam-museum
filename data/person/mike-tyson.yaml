summary:
  ar: "ملاكم أمريكي محترف سابق (وُلد سنة 1966 في بروكلين بمدينة نيويورك). صار أصغر بطل للوزن الثقيل في التاريخ في العشرين من عمره سنة 1986، وأول ملاكم وزن ثقيل يجمع ألقاب رابطة الملاكمة العالمية والمجلس العالمي للملاكمة والاتحاد الدولي للملاكمة في وقت واحد. امتدت مسيرته من 1985 إلى 2005 مع نزال عودة سنة 2024، وسجله 50 فوزاً (44 بالضربة القاضية) و7 هزائم."
  en: "American former professional boxer (born 1966 in Brooklyn, New York City). He became the youngest heavyweight champion in history at 20 in 1986 and the first heavyweight to hold the WBA, WBC and IBF titles simultaneously. His career ran from 1985 to 2005, with a comeback bout in 2024; his record is 50 wins (44 by knockout) and 7 losses."
  ur: "امریکی سابق پیشہ ور باکسر (پیدائش 1966، بروکلین، نیویارک شہر)۔ وہ 1986 میں 20 سال کی عمر میں تاریخ کے سب سے کم عمر ہیوی ویٹ چیمپئن بنے اور پہلے ہیوی ویٹ تھے جنہوں نے ڈبلیو بی اے، ڈبلیو بی سی اور آئی بی ایف ٹائٹل ایک ساتھ رکھے۔ ان کا کیریئر 1985 سے 2005 تک رہا، 2024 میں ایک واپسی مقابلے کے ساتھ؛ ریکارڈ 50 فتوحات (44 ناک آؤٹ) اور 7 شکستیں۔"
