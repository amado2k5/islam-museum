summary:
  ar: "قلج أرسلان بن مسعود بن قلج أرسلان بن سليمان بن قتلمش، صاحب الروم؛ وصفه الصفدي بالعدل وحسن السياسة وسداد الرأي، وكانت له قونية وأقصرا وسيواس وملطية، وتوفي سنة 588 هـ وخلفه ابنه غياث الدين كيخسرو {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 24 pp. 202-203} {cite:shadharat-dhahab vol. 6 p. 484}."
  en: "Qilij Arslan ibn Mas'ud ibn Qilij Arslan ibn Sulayman ibn Qutlumush, lord of Rum; al-Safadi credits him with justice, good statecraft and sound judgement, his lands were Konya, Aksaray, Sivas and Malatya, and he died in 588 AH (1192 CE), succeeded by his son Ghiyath al-Din Kaykhusraw {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 24 pp. 202-203} {cite:shadharat-dhahab vol. 6 p. 484}."
  es: "Qilij Arslan ibn Mas'ud ibn Qilij Arslan ibn Sulayman ibn Qutlumush, señor de Rum; al-Safadi le atribuye justicia, buen arte de gobernar y buen juicio, sus tierras eran Konya, Aksaray, Sivas y Malatya, y murió en 588 d. H. (1192 d. C.), sucedido por su hijo Ghiyath al-Din Kaykhusraw {citar:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 24 págs. 202-203} {cita: shadharat-dhahab vol. 6p. 484}."
  fr: "Qilij Arslan ibn Mas'ud ibn Qilij Arslan ibn Sulayman ibn Qutlumush, seigneur de Rum; al-Safadi lui attribue la justice, un bon sens politique et un bon jugement, ses terres étaient Konya, Aksaray, Sivas et Malatya, et il mourut en 588 AH (1192 CE), succédé par son fils Ghiyath al-Din Kaykhusraw {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 24 pp. 202-203} {cite: shadharat-dhahab vol. 18h. 484}."
  ur: "قلیج ارسلان ابن مسعود ابن قلیج ارسلان ابن سلیمان ابن قطلموش، روم کے مالک؛ الصفدی نے اسے انصاف، اچھی ریاست سازی اور درست فیصلے کا سہرا دیا، اس کی زمینیں قونیہ، اکسرائے، سیواس اور ملاتیا تھیں، اور اس کی وفات 588 ہجری ⁦(1192 عیسوی)⁩ میں ہوئی، اس کے بعد اس کے بیٹے غیاث الدین کیخسرو نے اس کا جانشین بنایا۔ 24 صفحہ 202-203} {حوالہ: شدھارت ذہاب والیم۔ 6ص۔ 484}۔"
  tr: "Kilij Arslan ibn Mas'ud ibn Qilj Arslan ibn Sulayman ibn Qatlamish, Romalıların hükümdarı; el-Safadi onu adil, siyasi olarak sağlam ve sağduyulu biri olarak tanımlamıştır. Konya, Luxor, Şivas ve Malatya ailesi vardı. 588 Hicri'de öldü ve yerine oğlu Ghiyath al-Din Kaykhosrow geçti {atıf:wafi-bi-l-wafayat-safadi-dar-ihya-2000 cilt 24 s. 202-203} {cite:shadharat-dhahab cilt 6, s. 484}."
  id: "Kilij Arslan ibn Mas'ud ibn Qilj Arslan ibn Sulayman ibn Qatlamish, penguasa Romawi; al-Safadi menggambarkannya sebagai orang yang adil, sehat secara politik, dan bijaksana. Ia memiliki Konya, Luxor, Sivas, dan Malatya. Ia meninggal pada tahun 588 H dan digantikan oleh putranya Ghiyath al-Din Kaykhosrow {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 24 hlm. 202-203} {cite:shadharat-dhahab vol. 6, hlm. 484}."
