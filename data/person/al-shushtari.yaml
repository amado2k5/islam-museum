label: { ar: "أبو الحسن الششتري" }
summary:
  ar: "أبو الحسن علي بن عبد الله الششتري الصوفي الأندلسي، من أهل مرسية في قول؛ قال في عنوان الدراية رحل إلى العدوة وسكن ببجاية مدة ولقي من أصحابنا ناساً وأخذوا عنه وانتفعوا به، له مشاركة في معقول العلوم ومنقولها وفصاحة لسان وطلاقة قلم، وله أتباع كثيرة من الفقراء ومن عامة الناس، وله موضوعات كثيرة وفيها ألغاز وإشارات بحروف أيجد، وله شعر في التحقيق وفي مراتب أهل الطريق، ومن مزاياه ملازمته لبيت الله الحرام والتزامه الاعتمار على الدوام وحجه مع الحجاج في كل عام حتى كان أهل مكة يعتمدون على أقواله ويهتدون بأفعاله؛ وحكى أنه كان في بعض أسفاره في البرية ورجل من أصحابه قد أُسر فسمعه يقول إلينا يا أحمد فسئل من أحمد الذي ناديته فقال من تُسرّون به غداً فلما كان الغد إذا بالرجل المأسور قد ورد؛ وتوفي يوم الخميس تاسع شوال سنة ٦٦٩ {cite:nafh-tib-maqqari p. 204-206}."
  en: "Abu l-Hasan al-Shushtari, the Andalusi Sufi poet; settled at Bijaya, whose students and followers filled the poor and the common folk, famed for letter-riddles and verse on the Path's stations — and for living by the House of God, making umra continually and hajj every year until the Meccans relied on his words; died Thursday 9 Shawwal 669 {cite:nafh-tib-maqqari p. 204-206}."
