label: { ar: "أبو الحسن الششتري", en: "Abu al-Hasan al-Shushtari", fr: "Abu al-Hasan al-Shushtari", es: "Abu al-Hasan al-Shushtari", ur: "ابو الحسن الششتری" }
summary:
  ar: "أبو الحسن علي بن عبد الله الششتري الصوفي الأندلسي، من أهل مرسية في قول؛ قال في عنوان الدراية رحل إلى العدوة وسكن ببجاية مدة ولقي من أصحابنا ناساً وأخذوا عنه وانتفعوا به، له مشاركة في معقول العلوم ومنقولها وفصاحة لسان وطلاقة قلم، وله أتباع كثيرة من الفقراء ومن عامة الناس، وله موضوعات كثيرة وفيها ألغاز وإشارات بحروف أيجد، وله شعر في التحقيق وفي مراتب أهل الطريق، ومن مزاياه ملازمته لبيت الله الحرام والتزامه الاعتمار على الدوام وحجه مع الحجاج في كل عام حتى كان أهل مكة يعتمدون على أقواله ويهتدون بأفعاله؛ وحكى أنه كان في بعض أسفاره في البرية ورجل من أصحابه قد أُسر فسمعه يقول إلينا يا أحمد فسئل من أحمد الذي ناديته فقال من تُسرّون به غداً فلما كان الغد إذا بالرجل المأسور قد ورد؛ وتوفي يوم الخميس تاسع شوال سنة ٦٦٩ {cite:nafh-tib-maqqari p. 204-206}."
  en: "Abu l-Hasan al-Shushtari, the Andalusi Sufi poet; settled at Bijaya, whose students and followers filled the poor and the common folk, famed for letter-riddles and verse on the Path's stations — and for living by the House of God, making umra continually and hajj every year until the Meccans relied on his words; died Thursday 9 Shawwal 669 {cite:nafh-tib-maqqari p. 204-206}."
  fr: "Abu l-Hasan al-Shushtari, le poète soufi andalou  ; installé à Bijaya, dont les étudiants et les disciples remplissaient les pauvres et les gens du peuple, célèbres pour leurs riddles de lettres et leurs vers sur les stations du Sentier – et pour vivre par la Maison de Dieu, faisant umra continuellement et hajj chaque année jusqu’à ce que les Mecquois se fient à ses paroles  ; décédé jeudi 9 Shawwal 669 {cite:nafh-tib-maqqari p. 204-206}."
  es: "Abu l-Hasan al-Shushtari, el poeta sufí andalusí; se estableció en Bijaya, cuyos estudiantes y seguidores llenaban a los pobres y a la gente común, famoso por sus acertijos de letras y versos sobre las estaciones del Camino, y por vivir junto a la Casa de Dios, haciendo la umra continuamente y el hajj cada año hasta que los mecanos confiaron en sus palabras; murió el jueves 9 de Shawwal de 669 {cite:nafh-tib-maqqari p. 204-206}."
  ur: "ابو الحسن الششتری، اندلس کے صوفی شاعر؛ بجیا میں آباد، جس کے شاگردوں اور پیروکاروں نے غریبوں اور عام لوگوں کو بھر دیا، راستے کے مقامات پر حرفی پہیلیوں اور آیتوں کے لیے مشہور تھے - اور خانہ خدا کے پاس رہنے کے لیے، مسلسل عمرہ کرنے اور ہر سال حج کرنے کے لیے یہاں تک کہ مکہ والوں نے اس کے الفاظ پر بھروسہ کیا۔ وفات بروز جمعرات 9 شوال 669۔ 204-206}۔"
  tr: "Murcia'dan Endülüs Sufi Ebu el-Hasan Ali bin Abdullah el-Şuştari şöyle dedi: El-Dirayet unvanıyla El-Adva'ya seyahat etti ve bir süre Bece'de yaşadı, burada bazı sahabelerle tanıştı, ondan öğrendi ve ondan faydalandı. Akıl bilimlerine katıldı ve onları aktardı, konuşması güzel ve kalemi akıcıydı. Fakirler ve halk arasında birçok takipçisi vardı. Daha iyi harflerle bilmeceler ve göndermeler içeren birçok konu yazdı. Yolun insanları ve araştırma üzerine şiirler yazdı. Erdemleri arasında Allah'ın Kutsal Evi'ne bağlılığı ve Umre ayini yapma bağlılığı vardı Her yıl hacılarla birlikte hac yapardı, ta ki Mekke halkı sözlerine güvenip davranışlarıyla yönlendirilene kadar. Çölde yaptığı bazı yolculuklar sırasında, yoldaşlarından birinin esir alındığını ve onun 'Ey Ahmed' dediğini duyduğunu anlattı; ona Ahmad'ın kim olduğunu, seni çağırdığını sordular. Ertesi gün geldiğinde, esir adam gelmişti; 669 yılının Şavval'ın dokuzuncusu Perşembe günü öldü {atıf:nafh-tib-maqqari, s. 204-206}."
  id: "Abu al-Hasan Ali ibn Abdullah al-Shushtari, seorang Sufi Andalusia dari Murcia, berkata: Dengan gelar Al-Dirayah, ia melakukan perjalanan ke Al-Adwa dan tinggal di Bejaia untuk sementara waktu, di mana ia bertemu beberapa sahabat kami, belajar darinya, dan mendapat manfaat darinya. Ia berpartisipasi dalam ilmu rasional dan meneruskannya, fasih dalam ucapan, dan kefasihan dalam tulisannya. Ia memiliki banyak pengikut di kalangan miskin dan masyarakat umum. Ia menulis banyak topik yang mengandung teka-teki dan alusi dalam surat yang lebih baik. Ia menulis puisi tentang penyelidikan dan barisan orang-orang di jalan tersebut. Di antara kebajikannya adalah kepatuhannya pada Rumah Suci Allah dan komitmennya untuk melaksanakan Umrah pada Ia melaksanakan Haji bersama para peziarah setiap tahun hingga rakyat Mekah mengandalkan kata-katanya dan dipandu oleh tindakannya. Ia menceritakan bahwa selama beberapa perjalanannya di padang gurun, seorang pria dari teman-temannya telah ditangkap, dan ia mendengar pria itu berkata, 'Wahai Ahmad,' dan ia ditanya siapa Ahmad, siapa yang Anda panggil. Ia berkata, 'Siapa yang akan Anda ambil besok?' Ketika hari berikutnya tiba, pria tawanan itu telah tiba; ia meninggal pada hari Kamis, tanggal sembilan Shawwal, 669 {cite:nafh-tib-maqqari, hlm. 204-206}."
