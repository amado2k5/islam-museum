summary:
  ar: "سياسي وقانوني إندونيسي من جاوة الوسطى (1904–1982): أول رئيس للجنة الوطنية الإندونيسية المركزية سنة 1945 ونائب عام الجمهورية (1945–1946)، وناشط في المحمدية دافع داخل الجمعية التأسيسية في الخمسينيات عن جعل الإسلام أساسًا للدولة، وسُجن في عهدي سوكارنو وسوهارتو، وسُمّي بطلًا قوميًا سنة 2018."
  en: "Indonesian politician and lawyer from Central Java (1904–1982): first chairman of the Central Indonesian National Committee in 1945 and attorney general of the republic (1945–1946), a Muhammadiyah activist who argued in the 1950s Constitutional Assembly for Islam as the basis of the state, imprisoned under both Sukarno and Suharto, and named a National Hero in 2018."
  ur: "وسطی جاوا سے تعلق رکھنے والے انڈونیشی سیاست دان اور قانون دان (1904ء–1982ء): 1945ء میں مرکزی انڈونیشی قومی کمیٹی کے پہلے صدر اور جمہوریہ کے اٹارنی جنرل (1945ء–1946ء)، محمدیہ کے کارکن جنہوں نے پچاس کی دہائی میں دستور ساز اسمبلی کے اندر اسلام کو ریاست کی بنیاد بنانے کی وکالت کی، سوکارنو اور سوہارتو دونوں کے عہد میں قید رہے اور 2018ء میں قومی ہیرو قرار پائے۔"
