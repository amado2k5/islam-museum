    note: "Two independent sources name Sunni Islam for Abdul-Jabbar himself. The English article states in its lead, and again in its personal-life section, that during the summer of 1968 he took the shahada twice and converted to Sunni Islam from Catholicism; he adopted the name Kareem Abdul-Jabbar and began using it publicly in 1971. The Urdu article independently states in its lead that he came from Christianity first into the Nation of Islam and then entered Sunni Islam. The Arabic article gives his religion as Islam only, naming no school. His teacher Hamaas Abdul Khaalis led the Hanafi Movement, but a teacher's school is not his own attestation, and no source names a madhhab for Abdul-Jabbar himself, so the value recorded is sunni only."
