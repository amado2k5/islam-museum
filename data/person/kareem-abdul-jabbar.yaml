summary:
  ar: "لاعب كرة سلة أمريكي سابق (وُلد سنة 1947 في مدينة نيويورك) باسم فرديناند لويس ألسندور جونيور. لعب في مركز الوسط لجامعة كاليفورنيا في لوس أنجلوس وميلووكي باكس ولوس أنجلوس ليكرز على مدى عشرين موسماً في الدوري الأمريكي للمحترفين، ففاز بست بطولات وست جوائز لأفضل لاعب، وحمل الرقم القياسي للنقاط في تاريخ الدوري (38,387 نقطة) حتى سنة 2023. وهو أيضاً مؤلف وممثل، ونال وسام الحرية الرئاسي سنة 2016."
  en: "American former basketball player (born 1947 in New York City), born Ferdinand Lewis Alcindor Jr. A center for UCLA, the Milwaukee Bucks and the Los Angeles Lakers across 20 NBA seasons, he won six NBA championships and a record six Most Valuable Player awards, and held the NBA career scoring record (38,387 points) until 2023. He is also an author and actor, and received the Presidential Medal of Freedom in 2016."
  ur: "امریکی سابق باسکٹ بال کھلاڑی (پیدائش 1947، نیویارک شہر)، پیدائشی نام فرڈیننڈ لیوس السنڈور جونیئر۔ انہوں نے یو سی ایل اے، ملواکی بکس اور لاس اینجلس لیکرز کے لیے بیس این بی اے سیزن میں سینٹر کھیلا، چھ چیمپئن شپ اور چھ ایم وی پی ایوارڈ جیتے، اور 2023 تک این بی اے کے کیریئر اسکورنگ ریکارڈ (38,387 پوائنٹس) کے حامل رہے۔ وہ مصنف اور اداکار بھی ہیں اور 2016 میں انہیں صدارتی تمغۂ آزادی ملا۔"
