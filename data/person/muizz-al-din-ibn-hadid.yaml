summary:
  ar: "معز الدين أبو المعاني سعد بن علي المعروف بابن حديد، وزير الخليفة الناصر لدين الله، كان حسن السيرة في وزارته؛ ألزم بيته ثم توفي في جمادى الأولى سنة عشر وستمائة فحمل تابوته إلى مشهد أمير المؤمنين علي بالكوفة {cite:kamil-ibn-al-athir p. 361}."
  en: "Al-Nasir's vizier, remembered for 'good conduct in the vizierate' — confined to his house, he died Jumada I 610 and his coffin was carried to Ali's mashhad at Kufa {cite:kamil-ibn-al-athir p. 361}."
  es: "El visir de Al-Nasir, recordado por su \"buena conducta en el visirismo\", confinado a su casa, murió en Jumada I 610 y su ataúd fue llevado al mashhad de Ali en Kufa {cite:kamil-ibn-al-athir p. 361}."
  fr: "Le vizir d'Al-Nasir, dont on se souvient pour sa « bonne conduite dans le vizirat » — confiné dans sa maison, il mourut en Jumada I 610 et son cercueil fut transporté au mashhad d'Ali à Kufa {cite:kamil-ibn-al-athir p. 361}."
  ur: "الناصر کا وزیر، جسے 'وزیریت میں حسن سلوک' کے لیے یاد کیا جاتا تھا - اپنے گھر تک محدود تھا، اس کا انتقال جمادی الثانی 610 میں ہوا اور اس کا تابوت علی کے مشہد کوفہ میں لے جایا گیا ⁦(حوالہ: کامل ابن الاثیر ص)⁩ 361}۔"
