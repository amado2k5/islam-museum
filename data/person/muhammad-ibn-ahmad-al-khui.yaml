summary:
  ar: "محمد بن أحمد بن خليل بن سعادة الخويي، شهاب الدين، أبو عبد الله ⁦(626 - 693 هـ / 1229 - 1294 م)⁩: قاضي دمشق وابن قاضيها، فقيه شافعي باحث، ولد في دمشق وتوفي فيها، وتولى القضاء في القدس وحلب والديار المصرية ثم الشام، وله «أقاليم التعاليم» وشرح على «الفصول الخمسين» ومنظومات. {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 324}"
  en: "Muhammad ibn Ahmad ibn Khalil ibn Sa'ada al-Khu'i, Shihab al-Din, Abu Abdallah (626-693 AH / 1229-1294): qadi of Damascus and son of a qadi, a Shafi'i jurist and researcher born and died in Damascus, who held the judgeship in Jerusalem, Aleppo, the Egyptian lands and Syria, and wrote Aqalim al-Ta'lim, a commentary on al-Fusul al-Khamsun and verse treatises. {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 324}"
