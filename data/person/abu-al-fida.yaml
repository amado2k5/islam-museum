summary:
  ar: "أبو الفداء إسماعيل بن علي، الملك المؤيد عماد الدين، أمير أيوبي وحاكم حماة ومؤرخ وجغرافي، وُلد بدمشق سنة 672هـ/1273م، وتوفي بحماة سنة 732هـ/1331م، وأشهر كتبه المختصر في أخبار البشر وتقويم البلدان. {cite:encyclopaedia-of-islam-2 vol. 1 p. 137}"
  en: "Abu l-Fida, Ismail b. Ali, al-Malik al-Mu'ayyad 'Imad al-Din, a Syrian Ayyubid prince, governor of Hama, historian and geographer, born in Damascus in 672/1273 and died at Hama in 732/1331. His two main works are the Mukhtasar Tarikh al-Bashar and a geography. {cite:encyclopaedia-of-islam-2 vol. 1 p. 137}"
  ur: "ابو الفداء اسماعیل بن علی، الملک المؤید عماد الدین، شامی ایوبی شہزادے، حماۃ کے حاکم، مؤرخ اور جغرافیہ دان، جو دمشق میں 672ھ/1273ء میں پیدا ہوئے اور حماۃ میں 732ھ/1331ء میں وفات پائی۔ ان کی دو مرکزی کتابیں المختصر فی اخبار البشر اور تقویم البلدان ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 137}"
