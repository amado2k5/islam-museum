summary:
  ar: "ابن سوار مقرئ العراق أبو طاهر أحمد بن علي بن عبيد الله بن عمر بن سوار — مصنف المستنير في القراءات؛ كان ثقة مجوداً أقرأ خلقاً وسمع الكثير وحدث عن ابن غيلان وطبقته؛ توفي سنة ست وتسعين وأربعمائة {cite:shadharat-dhahab p. 403}."
  en: "Ibn Suwar, Abu Tahir Ahmad b. Ali b. Ubayd Allah — muqri' of Iraq and author of al-Mustanir on the readings; a trusty master who taught multitudes; died 496 {cite:shadharat-dhahab p. 403}."
  es: "Ibn Suwar, Abu Tahir Ahmad b. Ali b. Ubayd Allah, muqri' de Irak y autor de al-Mustanir sobre las lecturas; un maestro confiable que enseñó a multitudes; murió en 496 {cita: shadharat-dhahab p. 403}."
  fr: "Ibn Suwar, Abu Tahir Ahmad b. Ali b. Ubayd Allah — muqri' d'Irak et auteur d'al-Mustanir sur les lectures; un maître fidèle qui enseignait à des multitudes; décédé en 496 {cite: shadharat-dhahab p. 403}."
  ur: "ابن سوار، ابو طاہر احمد، ب۔ علی بی عبید اللہ - مقری عراق اور المستنیر کے مصنف ایک بھروسہ مند ماسٹر جس نے بھیڑ کو سکھایا؛ متوفی 496۔ 403}۔"
  tr: "Irak'ın okuyucusu İbn Suwar, Ebu Tahir Ahmed ibn Ali ibn Ubeyd Allah ibn Ubeyd Allah ibn Ömer ibn Suwar — El-Mustanir fi el-Qira'at'ın yazarı; güvenilir, çalışkan, terbiyeli, çok şey duyardı ve İbn Ghalan ile sınıfından rivayet ederdi; dört yüz doksan altıncı yılında vefat etti {atıf: şadharat-dhahab, s. 403}."
  id: "Ibn Suwar, pembaca Irak, Abu Tahir Ahmad ibn Ali ibn Ubayd Allah ibn Umar ibn Suwar — penulis Al-Mustanir fi al-Qira'at; ia dapat dipercaya, rajin, sopan, banyak mendengar, dan bercerita dari Ibn Ghailan dan kelasnya; ia meninggal pada tahun empat ratus sembilan puluh enam {cite:shadharat-dhahab, hlm. 403}."
