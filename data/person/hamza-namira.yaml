summary:
  ar: "\u0645\u063a\u0646\u064d\u0651 \u0648\u0645\u0644\u062d\u0646 \u0645\u0635\u0631\u064a (\u0648\u064f\u0644\u062f 1980) \u0623\u0635\u062f\u0631 \u062b\u0644\u0627\u062b\u0629 \u0623\u0644\u0628\u0648\u0645\u0627\u062a \u0645\u0639 \u0623\u0648\u064a\u0643\u0646\u064a\u0646\u063a \u062b\u0645 \u0623\u0644\u0628\u0648\u0645\u064a\u0646 \u0645\u0646 \u0625\u0646\u062a\u0627\u062c\u0647\u060c \u0648\u0644\u062d\u0651\u0646 \u00ab\u064a\u0627 \u0646\u0628\u064a \u0633\u0644\u0627\u0645 \u0639\u0644\u064a\u0643\u00bb \u0644\u0645\u0627\u0647\u0631 \u0632\u064a\u0646\u060c \u0648\u062a\u062f\u0648\u0631 \u0623\u063a\u0627\u0646\u064a\u0647 \u0639\u0644\u0649 \u0627\u0644\u0623\u0645\u0644 \u0648\u0627\u0644\u063a\u0631\u0628\u0629 \u0648\u0627\u0644\u0625\u0646\u0633\u0627\u0646\u060c \u0648\u0644\u064f\u0642\u0651\u0628 \u0628\u0640\u00ab\u0635\u0648\u062a \u0627\u0644\u062b\u0648\u0631\u0629\u00bb \u0641\u064a 2011\u060c \u0648\u0642\u062f\u0651\u0645 \u0628\u0631\u0646\u0627\u0645\u062c \u00ab\u0631\u064a\u0645\u0643\u0633\u00bb \u0639\u0646 \u0627\u0644\u062a\u0631\u0627\u062b \u0627\u0644\u0645\u0648\u0633\u064a\u0642\u064a \u0627\u0644\u0639\u0631\u0628\u064a \u0645\u0646\u0630 2016."
  en: "Egyptian singer-songwriter (born 1980) who released three albums with Awakening and two of his own, composed Maher Zain's 'Ya Nabi Salam Alayka', sings of hope, alienation and the human condition, was dubbed 'the voice of the revolution' in 2011, and has presented 'Remix', a series on Arab musical heritage, since 2016."
