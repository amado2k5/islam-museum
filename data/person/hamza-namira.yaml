summary:
  ar: "مغنٍّ وملحن مصري ⁦(وُلد 1980)⁩ أصدر ثلاثة ألبومات مع أويكنينغ ثم ألبومين من إنتاجه، ولحّن «يا نبي سلام عليك» لماهر زين، وتدور أغانيه على الأمل والغربة والإنسان، ولُقّب بـ«صوت الثورة» في 2011، وقدّم برنامج «ريمكس» عن التراث الموسيقي العربي منذ 2016."
  en: "Egyptian singer-songwriter (born 1980) who released three albums with Awakening and two of his own, composed Maher Zain's 'Ya Nabi Salam Alayka', sings of hope, alienation and the human condition, was dubbed 'the voice of the revolution' in 2011, and has presented 'Remix', a series on Arab musical heritage, since 2016."
  ur: "مصری گلوکار اور نغمہ نگار ⁦(پیدائش 1980ء)⁩، جنھوں نے اویکننگ کے ساتھ تین اور اپنے ادارے سے دو البم جاری کیے، ماہر زین کا «یا نبی سلام علیک» کمپوز کیا، امید، اجنبیت اور انسان کے موضوعات پر گاتے ہیں، 2011ء میں «انقلاب کی آواز» کہلائے، اور 2016ء سے عرب موسیقی کے ورثے پر پروگرام «ریمکس» پیش کرتے ہیں۔"
  es: "Cantautor egipcio (nacido en 1980) que ha publicado tres álbumes con Awakening y dos en solitario, compuso 'Ya Nabi Salam Alayka' de Maher Zain, canta sobre la esperanza, la alienación y la condición humana, fue apodado 'la voz de la revolución' en 2011 y presenta 'Remix', una serie sobre el patrimonio musical árabe, desde 2016."
  fr: "L'auteur-compositeur-interprète égyptien (né en 1980), qui a sorti trois albums avec Awakening et deux en solo, a composé « Ya Nabi Salam Alayka » de Maher Zain, chante l'espoir, l'aliénation et la condition humaine, a été surnommé « la voix de la révolution » en 2011 et présente « Remix », une série sur le patrimoine musical arabe, depuis 2016."
  tr: "Mısırlı şarkıcı ve besteci (1980 doğumlu), Awakening ile üç albüm çıkardı ve ardından kendi prodüktörlüğünde iki albüm çıkardı. Maher Zein için \"Ya Nabi Salam Alayk\"ı besteledi; Zein'in şarkıları umut, yabancılaşma ve insanlık etrafında dönüyor. 2011'de \"Devrimin Sesi\" lakabını aldı ve 2016'dan beri Arap müzik mirası hakkında \"Remix\" programını sundu."
  id: "Seorang penyanyi dan komposer asal Mesir (lahir 1980), ia merilis tiga album bersama Awakening dan kemudian dua album yang diproduseri olehnya. Ia menggubah \"Ya Nabi Salam Alayk\" untuk Maher Zein, yang lagu-lagunya berpusat pada harapan, keterasingan, dan kemanusiaan. Ia dijuluki \"Suara Revolusi\" pada tahun 2011 dan sejak 2016 membawakan program \"Remix\" tentang warisan musik Arab."
