summary:
  ar: "مغنٍّ وملحن مصري ⁦(وُلد 1980)⁩ أصدر ثلاثة ألبومات مع أويكنينغ ثم ألبومين من إنتاجه، ولحّن «يا نبي سلام عليك» لماهر زين، وتدور أغانيه على الأمل والغربة والإنسان، ولُقّب بـ«صوت الثورة» في 2011، وقدّم برنامج «ريمكس» عن التراث الموسيقي العربي منذ 2016."
  en: "Egyptian singer-songwriter (born 1980) who released three albums with Awakening and two of his own, composed Maher Zain's 'Ya Nabi Salam Alayka', sings of hope, alienation and the human condition, was dubbed 'the voice of the revolution' in 2011, and has presented 'Remix', a series on Arab musical heritage, since 2016."
  ur: "مصری گلوکار اور نغمہ نگار ⁦(پیدائش 1980ء)⁩، جنھوں نے اویکننگ کے ساتھ تین اور اپنے ادارے سے دو البم جاری کیے، ماہر زین کا «یا نبی سلام علیک» کمپوز کیا، امید، اجنبیت اور انسان کے موضوعات پر گاتے ہیں، 2011ء میں «انقلاب کی آواز» کہلائے، اور 2016ء سے عرب موسیقی کے ورثے پر پروگرام «ریمکس» پیش کرتے ہیں۔"
