summary:
  ar: "ملاكم أمريكي وناشط، وُلد باسم كاسيوس مارسيلوس كلاي الابن في لويفيل بولاية كنتاكي سنة 1942، وفاز ببطولة العالم للوزن الثقيل ثلاث مرات (1964 و1974 و1978)، واعتنق الإسلام في الستينيات ثم انتقل إلى الإسلام السني في السبعينيات، ورفض التجنيد في حرب فيتنام فجُرّد من ألقابه حتى ألغت المحكمة العليا إدانته سنة 1971، وتوفي سنة 2016."
  en: "American boxer and activist, born Cassius Marcellus Clay Jr. in Louisville, Kentucky, in 1942. He won the world heavyweight championship three times (1964, 1974, 1978), converted to Islam in the 1960s and later moved to Sunni Islam in the 1970s, refused the Vietnam War draft and was stripped of his titles until the Supreme Court overturned his conviction in 1971, and died in 2016."
  ur: "امریکی باکسر اور سماجی کارکن، جو 1942 میں لوئس ول، کینٹکی میں کیسیئس مارسیلس کلے جونیئر کے نام سے پیدا ہوئے۔ انہوں نے تین بار (1964، 1974، 1978) ورلڈ ہیوی ویٹ چیمپئن شپ جیتی، ساٹھ کی دہائی میں اسلام قبول کیا اور ستر کی دہائی میں سنی اسلام کی طرف منتقل ہوئے، ویتنام جنگ میں بھرتی سے انکار پر ان کے خطابات چھین لیے گئے یہاں تک کہ سپریم کورٹ نے 1971 میں ان کی سزا کالعدم قرار دی، اور 2016 میں وفات پائی۔"
