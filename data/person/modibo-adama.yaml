summary:
  ar: "عالم فولاني (1786-1847) تسلّم من عثمان دان فوديو راية الجهاد في فومبينا («البلاد الجنوبية») سنة 1809 فأسس إمارة فومبينا المعروفة بأداماوا، إحدى أكبر إمارات خلافة صكتو، وجعل عاصمتها يولا، وخلفه ابنه محمدو لول. عُرف بزهده وتواضعه حتى لُقّب ببساطة «موديبو» أي العالم."
  en: "Fulani scholar (1786–1847) who received from Usman dan Fodio the flag of jihad for Fombina, 'the southlands', in 1809 and founded the emirate of Fombina, known as Adamawa — one of the largest emirates of the Sokoto Caliphate — ruling from Yola, where his son Muhammadu Lawal succeeded him. He was known for ascetic modesty and preferred the simple title Modibbo, 'learned man', to his royal style."
  ur: "فولانی عالم (1786ء–1847ء) جنھوں نے 1809ء میں عثمان دان فودیو سے فومبینا («جنوبی سرزمین») کے جہاد کا علم حاصل کیا اور فومبینا کی امارت قائم کی جو اداماوا کے نام سے مشہور ہوئی — خلافتِ سوکوٹو کی بڑی امارتوں میں سے ایک — اور یولا سے حکومت کی، جہاں ان کے بیٹے محمدو لول ان کے جانشین ہوئے۔ وہ زہد اور سادگی کے لیے مشہور تھے اور اپنے شاہی لقب پر سادہ «مودیبو» یعنی عالم کہلانا پسند کرتے تھے۔"

