    note: "NOT RECORDED — no fetched source names a school of law or theology, or a Sufi affiliation, for Adama himself. What the sources give is a formation and a milieu: the English article presents a Fulani scholar educated by his father, then under Shehu Muhammad Tahir in Baghirmi and for a decade under Mallam Kiari at Birnin Ngazargamo, who received the Sokoto jihad flag from Usman dan Fodio and administered his emirate on Usman's advice; the French and Arabic articles say no more than this. That Sokoto world was Maliki in law is context about his teachers and his sovereign, not an attestation of the man's own school — a teacher's school never counts, and neither does a movement's. Wikidata carries no religion statement for him at all, not even a generic one. Under the lane's two-source rule and the founder's doubt rule ('if we have doubt then unclassified') the faith is left unknown."

