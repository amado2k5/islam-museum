summary:
  ar: "أديب وصحفي وسياسي مصري (1888–1956)، صاحب رواية «زينب» (1914) التي يعدّها كثير من النقاد أول رواية مصرية حديثة، وصاحب «حياة محمد» (1935) أشهر سيرة نبوية عربية حديثة كُتبت بمنهج نقدي، تولّى وزارة المعارف مرارًا ورئاسة حزب الأحرار الدستوريين ومجلس الشيوخ."
  en: "Egyptian writer, journalist and politician (1888–1956), author of Zaynab (1914), regarded by many critics as the first modern Egyptian novel, and of Hayat Muhammad (1935), the most famous modern Arabic biography of the Prophet written with a critical method. He served repeatedly as minister of education and led the Liberal Constitutional Party and the Senate."
  ur: "مصری ادیب، صحافی اور سیاست دان (1888–1956)، ناول «زینب» (1914) کے مصنف جسے بہت سے نقاد پہلا جدید مصری ناول قرار دیتے ہیں، اور «حیات محمد» (1935) کے مصنف جو تنقیدی اسلوب میں لکھی گئی مشہور ترین جدید عربی سیرت ہے؛ وہ بارہا وزیر تعلیم رہے اور لبرل دستوری جماعت اور مجلس شیوخ کی صدارت کی۔"
