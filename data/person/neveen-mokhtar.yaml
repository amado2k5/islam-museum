summary:
  ar: «داعية إسلامية مصرية وواعظة بوزارة الأوقاف، عُرفت بظهورها التلفزيوني في برامج دينية واجتماعية — منها تقديمها «نفحات إيمانية» على قناة الجمهورية — وبخطاب دعوي يلاحق مشكلات البيوت وقضايا المجتمع، يركز على الأسرة والمرأة وتربية الأبناء وأسئلة العبادات، وبمقاطع قصيرة تنشرها على حسابها في تيك توك.»
  en: "An Egyptian Islamic preacher and a female preacher (wa'iza) at the Ministry of Awqaf, known for her television appearances on religious and social programmes — including presenting 'Nafahat Imaniyya' on Al-Jumhuriya TV — for a dawah discourse that pursues household problems and society's issues, centred on the family, women, child-rearing and questions of worship, and for short clips she publishes on her TikTok account."
  ur: «مصری اسلامی مبلغہ اور وزارتِ اوقاف کی واعظہ؛ دینی و سماجی پروگراموں میں ٹیلی ویژن حاضری — جن میں الجمہوریہ ٹی وی پر «نفحات إيمانية» کی میزبانی شامل ہے — اور گھریلو مسائل و سماجی قضایا پر مرکوز دعوتی خطاب کی وجہ سے معروف ہیں، جس کا محور خاندان، خواتین، بچوں کی تربیت اور عبادات کے سوالات ہیں؛ وہ اپنے ٹک ٹاک حساب پر مختصر کلپس بھی شائع کرتی ہیں۔»
