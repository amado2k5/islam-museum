summary:
  ar: "لاعب كريكت جنوب أفريقي سابق وقائد سابق لمنتخب جنوب أفريقيا، وُلد في ديربان سنة 1983 لأسرة مسلمة من أصل هندي هاجر جدّها من سورات سنة 1927. ضارب أيمن من الطراز الرفيع لعب لجنوب أفريقيا بين 2004 و2019، وهو ثاني أعلى مسجليها في الاختبار برصيد 9282 جولة وثالثهم في مباريات اليوم الواحد برصيد 8113 جولة، وله 28 مئوية اختبار و27 مئوية ليوم واحد، وسجّل سنة 2012 أول ثلاثمائة في تاريخ جنوب أفريقيا في الاختبار (311 بلا خروج أمام إنجلترا)، وصار سنة 2014 أول قائد اختبار دائم غير أبيض لجنوب أفريقيا، واعتزل الكريكت الدولية سنة 2019 ثم عمل مرشدا للضرب ومدربا، ويصفه المصدر بأنه مسلم متدين رفض حمل شعار شركة خمر على زيه."
  en: "South African former cricketer and captain, born in Durban in 1983 to a Muslim family of Indian descent whose grandfather migrated from Surat in 1927. A right-handed top-order batter, he played for South Africa from 2004 to 2019 and is the country's second-highest run-scorer in Tests with 9,282 runs and third-highest in One Day Internationals with 8,113 runs, with 28 Test centuries and 27 ODI centuries. In 2012 he scored South Africa's first Test triple century (311 not out against England), in 2014 he became South Africa's first permanent non-white Test captain, and he retired from international cricket in 2019 before working as a batting mentor and coach. The sources describe him as a devout Muslim who refused to wear an alcohol company's logo on his kit."
  ur: "جنوبی افریقہ کے سابق کرکٹ کھلاڑی اور سابق کپتان، جو 1983 میں ڈربن میں بھارتی نژاد مسلم خاندان میں پیدا ہوئے جس کے دادا 1927 میں سورت سے ہجرت کر کے آئے تھے۔ دائیں ہاتھ کے ممتاز بلے باز کی حیثیت سے انھوں نے 2004ء سے 2019ء تک جنوبی افریقہ کے لیے کھیلا؛ وہ ٹیسٹ کرکٹ میں ملک کے دوسرے سب سے زیادہ رنز بنانے والے کھلاڑی ہیں (9,282 رنز) اور ایک روزہ کرکٹ میں تیسرے نمبر پر ہیں (8,113 رنز)، ان کے نام 28 ٹیسٹ سنچریاں اور 27 ایک روزہ سنچریاں ہیں، 2012 میں انھوں نے جنوبی افریقہ کی پہلی ٹیسٹ ٹرپل سنچری بنائی (انگلینڈ کے خلاف 311 ناٹ آؤٹ)، 2014 میں وہ جنوبی افریقہ کے پہلے مستقل غیر سفید فام ٹیسٹ کپتان بنے، اور 2019 میں بین الاقوامی کرکٹ سے ریٹائر ہو کر بیٹنگ مرشد اور کوچ کے طور پر کام کیا۔ ماخذ انھیں ایک پرہیزگار مسلمان قرار دیتا ہے جنھوں نے اپنی وردی پر شراب ساز کمپنی کا لوگو لگانے سے انکار کیا تھا۔"
