summary:
  ar: "عادل عبد الله علي رجل أعمال بحريني يقيم في الإمارات، هو المؤسس والرئيس التنفيذي لمجموعة العربية للطيران منذ إنشائها في تشرين الأول 2003 كأول شركة طيران منخفض التكلفة في الشرق الأوسط وشمال أفريقيا وأول شركة طيران مملوكة للجمهور في العالم العربي، بعد مسيرة في الخطوط الجوية البريطانية وطيران الخليج، وقاد المجموعة إلى ربح صافٍ قياسي قبل الضريبة قدره 1.6 مليار درهم سنة 2024."
  en: "Adel Abdulla Ali is a Bahraini aviation executive resident in the UAE who founded Air Arabia in October 2003 as the Middle East and North Africa's first low-cost carrier and the Arab world's first publicly owned airline, and has been its Group Chief Executive Officer ever since, after earlier careers at British Airways and Gulf Air; under him the group reported a record net profit before tax of Dhs1.6 billion in 2024."
  fr: "Adel Abdulla Ali, dirigeant bahreïnien de l'aviation résidant aux Émirats arabes unis, fonda Air Arabia en octobre 2003 comme première compagnie à bas coûts du Moyen-Orient et d'Afrique du Nord et première compagnie aérienne du monde arabe ouverte à l'actionnariat public. Il en est depuis le directeur général du groupe, après une carrière chez British Airways et Gulf Air ; sous sa direction, le groupe annonça un bénéfice net avant impôt record de 1,6 milliard de dirhams en 2024."
  ur: "عادل عبد اللہ علی بحرینی ہوابازی ایگزیکٹو ہیں جو متحدہ عرب امارات میں مقیم ہیں؛ انھوں نے اکتوبر 2003 میں ایئر عربیہ کو مشرقِ وسطیٰ و شمالی افریقہ کی پہلی کم لاگت ایئرلائن اور عرب دنیا کی پہلی عوامی ملکیت والی ایئرلائن کے طور پر قائم کیا اور تب سے اس کے گروپ چیف ایگزیکٹو ہیں، اس سے پہلے وہ برٹش ایئرویز اور گلف ایئر میں رہے؛ ان کے دور میں گروپ نے 2024 میں ٹیکس سے قبل 1.6 ارب درہم کا ریکارڈ خالص منافع ظاہر کیا۔"
  es: "Adel Abdulla Ali es un ejecutivo de aviación bareiní residente en los Emiratos Árabes Unidos que fundó Air Arabia en octubre de 2003 como la primera aerolínea de bajo coste de Oriente Medio y el Norte de África y la primera aerolínea de propiedad pública del mundo árabe, y ha sido su director ejecutivo desde entonces, tras haber trabajado anteriormente en British Airways y Gulf Air; bajo su dirección, el grupo registró un beneficio neto récord antes de impuestos de 1.600 millones de dirhams en 2024."
  tr: "Birleşik Arap Emirlikleri'nde ikamet eden Bahreynli iş adamı Adel Abdullah Ali, Ekim 2003'te Orta Doğu ve Kuzey Afrika'nın ilk düşük maliyetli havayolu şirketi ve Arap dünyasının ilk halka açık havayolu şirketi olarak kurulan Air Arabia Group'un kurucusu ve CEO'sudur. Daha önce British Airways ve Gulf Air'de çalışmıştır. Grubu 2024 yılında vergi öncesi 1,6 milyar AED'lik rekor bir net kâra ulaştırmıştır."
  id: "Adel Abdullah Ali, seorang pengusaha Bahrain yang tinggal di Uni Emirat Arab, adalah pendiri dan CEO Air Arabia Group sejak didirikan pada Oktober 2003 sebagai maskapai penerbangan berbiaya rendah pertama di Timur Tengah dan Afrika Utara serta maskapai penerbangan milik publik pertama di dunia Arab, setelah berkarir di British Airways dan Gulf Air. Ia memimpin grup tersebut hingga mencapai rekor laba bersih sebelum pajak sebesar AED 1,6 miliar pada tahun 2024."
