summary:
  ar: "عادل عبد الله علي رجل أعمال بحريني يقيم في الإمارات، هو المؤسس والرئيس التنفيذي لمجموعة العربية للطيران منذ إنشائها في تشرين الأول 2003 كأول شركة طيران منخفض التكلفة في الشرق الأوسط وشمال أفريقيا وأول شركة طيران مملوكة للجمهور في العالم العربي، بعد مسيرة في الخطوط الجوية البريطانية وطيران الخليج، وقاد المجموعة إلى ربح صافٍ قياسي قبل الضريبة قدره 1.6 مليار درهم سنة 2024."
  en: "Adel Abdulla Ali is a Bahraini aviation executive resident in the UAE who founded Air Arabia in October 2003 as the Middle East and North Africa's first low-cost carrier and the Arab world's first publicly owned airline, and has been its Group Chief Executive Officer ever since, after earlier careers at British Airways and Gulf Air; under him the group reported a record net profit before tax of Dhs1.6 billion in 2024."
  ur: "عادل عبد اللہ علی بحرینی ہوابازی ایگزیکٹو ہیں جو متحدہ عرب امارات میں مقیم ہیں؛ انھوں نے اکتوبر 2003 میں ایئر عربیہ کو مشرقِ وسطیٰ و شمالی افریقہ کی پہلی کم لاگت ایئرلائن اور عرب دنیا کی پہلی عوامی ملکیت والی ایئرلائن کے طور پر قائم کیا اور تب سے اس کے گروپ چیف ایگزیکٹو ہیں، اس سے پہلے وہ برٹش ایئرویز اور گلف ایئر میں رہے؛ ان کے دور میں گروپ نے 2024 میں ٹیکس سے قبل 1.6 ارب درہم کا ریکارڈ خالص منافع ظاہر کیا۔"
