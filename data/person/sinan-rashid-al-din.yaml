id: person/sinan-rashid-al-din
class: person
label: { ar: "سنان مقدم الإسماعيلية", en: "Sinan, chief of the Syrian Ismailis", es: "Sinan, chief of the Syrian Ismailis", fr: "Sinan, chief of the Syrian Ismailis" }
summary:
  ar: "سنان مقدم الإسماعيلية ببلاد الشام في عهد صلاح الدين؛ راسله صلاح الدين أن يرسل من يقتل ملك إنكلتار وإن قتل المركيس صاحب صور فله عشرة آلاف دينار، فلم يمكنه قتل ملك إنكلتار ولم ير سنان فيه مصلحة لهم لئلا يخلو وجه صلاح الدين من الفرنج فيتفرغ لهم، فأرسل رجلين في زي الرهبان فأقاما ستة أشهر مع صاحب صيدا وابن بيرزان يظهران العبادة حتى ائتمن بهما المركيس فقتلاه ثالث عشر ربيع الآخر سنة ثمان وثمانين وخمسمائة {cite:kamil-ibn-al-athir p. 213-214}."
  en: "Sinan, master of the Syrian Assassins in Saladin's day — offered ten thousand dinars for the Marquis of Tyre (or the English king, whom he judged unwise to remove lest Saladin turn free hands on the Ismailis), he planted two monk-disguised fidāʾīs in Conrad's circle for six months until they killed him {cite:kamil-ibn-al-athir p. 213-214}."
  es: "Sinan, maestro de los Asesinos sirios en tiempos de Saladino, ofreció diez mil dinares por el marqués de Tiro (o el rey inglés, a quien consideró imprudente eliminar por temor a que Saladino actuara con impunidad contra los ismaelitas). Infiltró a dos fidāʾīs disfrazados de monjes en el círculo de Conrad durante seis meses hasta que lo asesinaron {cite:kamil-ibn-al-athir p. 213-214}."
  fr: "Sinan, maître des Assassins syriens à l'époque de Saladin, offrit dix mille dinars au marquis de Tyr (ou au roi anglais, qu'il jugeait imprudent de destituer de peur que Saladin ne laisse libre cours à son pouvoir sur les Ismaéliens), il infiltra deux fidāʾīs déguisés en moines dans le cercle de Conrad pendant six mois jusqu'à ce qu'ils le tuent {cite:kamil-ibn-al-athir p. 213-214}."
