label: { ar: "سنان مقدم الإسماعيلية", en: "Sinan, chief of the Syrian Ismailis" }
summary:
  ar: "سنان مقدم الإسماعيلية ببلاد الشام في عهد صلاح الدين؛ راسله صلاح الدين أن يرسل من يقتل ملك إنكلتار وإن قتل المركيس صاحب صور فله عشرة آلاف دينار، فلم يمكنه قتل ملك إنكلتار ولم ير سنان فيه مصلحة لهم لئلا يخلو وجه صلاح الدين من الفرنج فيتفرغ لهم، فأرسل رجلين في زي الرهبان فأقاما ستة أشهر مع صاحب صيدا وابن بيرزان يظهران العبادة حتى ائتمن بهما المركيس فقتلاه ثالث عشر ربيع الآخر سنة ثمان وثمانين وخمسمائة {cite:kamil-ibn-al-athir p. 213-214}."
  en: "Sinan, master of the Syrian Assassins in Saladin's day — offered ten thousand dinars for the Marquis of Tyre (or the English king, whom he judged unwise to remove lest Saladin turn free hands on the Ismailis), he planted two monk-disguised fidāʾīs in Conrad's circle for six months until they killed him {cite:kamil-ibn-al-athir p. 213-214}."
