summary:
  ar: "رئاب الشني ممن دعا إلى الله ونبه قومه على آياته في الفترة عند المسعودي، وعده في الموحدين المقرين بالخالق المصدقين بالبعث {cite:muruj-al-dhahab p. 442}."
  en: "One of al-Mas'udi's unitarian warners of the intermission alongside Quss ibn Sa'ida and Bahira {cite:muruj-al-dhahab p. 442}."
  es: "Uno de los advertidores unitarios de al-Mas'udi sobre el intermedio junto a Quss ibn Sa'ida y Bahira {cita:muruj-al-dhahab p. 442}."
  fr: "L'un des avertisseurs unitaires d'al-Mas'udi de l'entracte aux côtés de Quss ibn Sa'ida et Bahira {cite:muruj-al-dhahab p. 442}."
  ur: "المسعودی کے یکتا پرستوں میں سے ایک قوس ابن ساعدہ اور بحیرہ کے ساتھ وقفے کے بارے میں خبردار کرنے والوں میں سے ایک {حوالہ: مروج الذہب ص۔ 442}۔"
  tr: "Ri'ab el-Şani, el-Mes'udi'ye göre dönemde Allah'a seslenip halkını O'nun işaretleri konusunda uyaranlar arasındaydı ve onu Yaratıcıyı kabul eden ve dirilişi onaylayan tek tanrılılar arasında saydı {cit:muruj-al-dhahab, s. 442}."
  id: "Ri'ab al-Shani termasuk di antara mereka yang memanggil Tuhan dan memberi tahu umat-Nya tentang tanda-tanda-Nya selama periode tersebut menurut al-Mas'udi, dan ia menganggapnya sebagai salah satu monoteis yang mengakui Sang Pencipta dan mengonfirmasi kebangkitan {cite:muruj-al-dhahab, hlm. 442}."
