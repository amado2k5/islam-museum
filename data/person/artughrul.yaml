summary:
  ar: "أرطغرل بن سليمان شاه، والد عثمان مؤسس الدولة العثمانية؛ هاجر جدُّه سليمان مع قبيلته التركمانية عام ٦١٧هـ/١٢٢٠م من كردستان إلى بلاد الأناضول فراراً من الغزو المغولي فاستقر في ماينة أخلاط، وتوفي عام ٦٢٨هـ فخلفه ابنه الأوسط أرطغرل الذي واصل التحرك نحو الشمال الغربي ومعه نحو مئة أسرة وأكثر من أربعمائة فارس. وبينما كان فاراً بعشيرته سمع جلبة قتال حامٍ بين مسلمين ونصارى وكانت الغلبة للجيش البيزنطي، فتقدم بكل حماس لنجدة إخوانه في الدين فكان تقدمه سبباً في نصر المسلمين، فقدّر قائد الجيش السلجوقي ذلك وأقطعه أرضاً في الحدود الغربية للأناضول بجوار ثغور الروم، فقامت بين النواة العثمانية وسلاجقة الروم علاقة حميمة استمرت طيلة حياته حتى توفي سنة ٦٩٩هـ/١٢٩٩م فخلفه ابنه عثمان. وتروى المراجع التركية أنه عهد لعثمان بولاية القضاء في قره جه حصار بعد الاستيلاء عليها من البيزنطيين عام ٦٨٤هـ/١٢٨٥م {cite:dawlat-uthmaniyya-salabi p. 44-47}."
  en: "Ertuğrul (d. 1299) — Osman's father: fled the Mongol invasion west with a hundred families and four hundred riders, tipped a losing Seljuk–Byzantine battle to the Muslim side, and was enfeoffed on the Rum marches — the seed of the Ottoman state {cite:dawlat-uthmaniyya-salabi p. 44-47}."
