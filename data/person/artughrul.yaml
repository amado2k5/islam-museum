summary:
  ar: "أرطغرل بن سليمان شاه، والد عثمان مؤسس الدولة العثمانية؛ هاجر جدُّه سليمان مع قبيلته التركمانية عام ٦١٧هـ/١٢٢٠م من كردستان إلى بلاد الأناضول فراراً من الغزو المغولي فاستقر في ماينة أخلاط، وتوفي عام ٦٢٨هـ فخلفه ابنه الأوسط أرطغرل الذي واصل التحرك نحو الشمال الغربي ومعه نحو مئة أسرة وأكثر من أربعمائة فارس. وبينما كان فاراً بعشيرته سمع جلبة قتال حامٍ بين مسلمين ونصارى وكانت الغلبة للجيش البيزنطي، فتقدم بكل حماس لنجدة إخوانه في الدين فكان تقدمه سبباً في نصر المسلمين، فقدّر قائد الجيش السلجوقي ذلك وأقطعه أرضاً في الحدود الغربية للأناضول بجوار ثغور الروم، فقامت بين النواة العثمانية وسلاجقة الروم علاقة حميمة استمرت طيلة حياته حتى توفي سنة ٦٩٩هـ/١٢٩٩م فخلفه ابنه عثمان. وتروى المراجع التركية أنه عهد لعثمان بولاية القضاء في قره جه حصار بعد الاستيلاء عليها من البيزنطيين عام ٦٨٤هـ/١٢٨٥م {cite:dawlat-uthmaniyya-salabi p. 44-47}."
  en: "Ertuğrul (d. 1299) — Osman's father: fled the Mongol invasion west with a hundred families and four hundred riders, tipped a losing Seljuk–Byzantine battle to the Muslim side, and was enfeoffed on the Rum marches — the seed of the Ottoman state {cite:dawlat-uthmaniyya-salabi p. 44-47}."
  es: "Ertuğrul (m. 1299) — padre de Osman: huyó de la invasión mongola hacia el oeste con cien familias y cuatrocientos jinetes, inclinó una batalla perdida entre selyúcidas y bizantinos hacia el lado musulmán y fue enfeudado sobre las marcas del Rum — semilla del estado otomano {cite:dawlat-uthmaniyya-salabi p. 44-47}."
  fr: "Ertuğrul (mort en 1299) — le père d'Osman: a fui l'invasion mongole vers l'ouest avec une centaine de familles et quatre cents cavaliers, a fait basculer une bataille seldjoukide-byzantine perdue du côté musulman et a été investi des marches de Rum — la graine de l'État ottoman {cite: dawlat-uthmaniyya-salabi p. 44-47}."
  ur: "ارطغرل ⁦(متوفی 1299)⁩ — عثمان کے والد: منگول حملے سے مغرب میں سو خاندانوں اور چار سو سواروں کے ساتھ فرار ہو گئے، سلجوک-بازنطینی جنگ میں ہارنے کا اشارہ مسلم فریق کو دیا، اور رم مارچوں پر محصور ہو گیا — جو کہ عثمانی ریاست کا بیج تھا۔ 44-47}۔"
  tr: "Osmanlı İmparatorluğu'nun kurucusu Osman'ın babası Ertuğrul bin Süleyman Şah, 617 Hicri / 1220 yılında Türkmen kabilesiyle birlikte Moğol istilasından kaçmak için Kürdistan'dan Anadolu'ya göç etti, Maina Akhlat'a yerleşti ve 628 Hicri'de öldü. Yerine ortanca oğlu Ertuğrul geçti; Ertuğrul yaklaşık yüz aile ve dört yüzü aşkın Farsla kuzeybatıya doğru hareket etmeye devam etti. Kaşiresiyle kaçarken, Bizans ordusunun üstün geldiği Müslümanlar ve Hristiyanlar arasındaki şiddetli çatışmaları duydu. Dini kardeşlerine coşkuyla yardım etti ve ilerlemesi Müslümanların zaferinin bir nedeni oldu. Selçuklu ordu komutanı, Anadolu'nun batı sınırlarında, Roma sınırlarına yakın toprak tahsis etmeye karar verdi. Osmanlı çekirdeği ile Rum Selçukluları arasında, 699 Hicri/1299 yılında ölümüne kadar süren yakın bir ilişki gelişti ve yerine oğlu Osman geçti. Türk kaynakları, Osman'ın 684 Hicri/1285 yılında Bizanslılardan ele geçirildikten sonra Karacahisar yargı valiliğinin görevlendirildiğini anlatır {cite:dawlat-uthmaniyya-salabi, s. 44-47}."
  id: "Ertugrul ibn Suleiman Shah, ayah dari Osman, pendiri Kekaisaran Ottoman, bermigrasi bersama suku Turkmennya pada tahun 617 H / 1220 M dari Kurdistan ke Anatolia untuk menghindari invasi Mongol, menetap di Maina Akhlat, dan meninggal pada tahun 628 H. Ia digantikan oleh putra tengahnya Ertugrul, yang terus bergerak ke barat laut dengan sekitar seratus keluarga dan lebih dari empat ratus orang Persia. Saat melarikan diri bersama sukunya, ia mendengar pertempuran sengit antara Muslim dan Kristen, dengan tentara Bizantium menang. Ia dengan antusias membantu saudara-saudara agamanya, dan kemajuannya menjadi alasan kemenangan Muslim. Komandan tentara Seljuk memutuskan untuk membagi tanah di perbatasan barat Anatolia dekat perbatasan Romawi. Hubungan erat berkembang antara inti Ottoman dan Seljuk Rum yang bertahan hingga kematiannya pada 699 H/1299 M, digantikan oleh putranya Osman. Referensi Turki menceritakan bahwa Osman dipercayakan untuk memimpin kehakiman di Karacahisar setelah wilayah itu direbut dari Bizantium pada 684 H/1285 M {cite:dawlat-uthmaniyya-salabi, hlm. 44-47}."
