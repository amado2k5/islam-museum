names:
  - { kind: full, lang: ar, value: "أبو جعفر محمد بن أحمد الصيمري" }
summary:
  ar: "وزير معز الدولة بن بويه؛ سيره لمحاربة عمران بن شاهين صاحب البطائح فحاربه مرة بعد مرة وأسر أهله وعياله، فلما مات عماد الدولة سنة 338هـ كتب إليه معز الدولة بالمبادرة إلى شيراز لإصلاح الأمور بها فترك عمران وسار {cite:kamil-ibn-al-athir p. 365-366}. وعند مسكويه اسمه أبو جعفر محمد بن أحمد الصيمري، وكان أول من عبر دجلة إلى الجانب الشرقي في حرب ناصر الدولة سنة 334هـ وهو الذي سكّن الجند بعد النهب، ومات سنة 339هـ في حمى حادة لما عاد لمحاربة عمران بن شاهين {cite:tajarib-al-umam-surush-v6 p. 125-126} {cite:tajarib-al-umam-surush-v6 p. 156}."
  en: "Mu'izz al-Dawla's vizier, sent against Umran ibn Shahin of the marshes campaign after campaign till Imad al-Dawla's death in 338 called him to Shiraz {cite:kamil-ibn-al-athir p. 365-366}. Miskawayh names him Abu Ja'far Muhammad ibn Ahmad al-Saymari: first across the Tigris in the war with Nasir al-Dawla in 334, he restored order after the sack, and died in 339 of an acute fever on campaign against Imran ibn Shahin {cite:tajarib-al-umam-surush-v6 p. 125-126} {cite:tajarib-al-umam-surush-v6 p. 156}."
