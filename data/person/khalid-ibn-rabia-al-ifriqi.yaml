id: person/khalid-ibn-rabia-al-ifriqi
class: person
label: { ar: "خالد بن ربيعة الإفريقي" }
summary:
  ar: "عند البلاذري: كاتب عبد الرحمن بن حبيب الفهري وكان بينه وبين عبد الحميد بن يحيى كاتب مروان بن محمد مودة ومكاتبة فأقرّ مروان عبد الرحمن على ثغر المغرب. مترسل بليغ نشأ في الدواوين وله رسائل مجموعة نحو مائتي ورقة {cite:fihrist-ibn-al-nadim p. 171}"
  en: "In al-Baladhuri: scribe of Abd al-Rahman ibn Habib al-Fihri; between him and Abd al-Hamid ibn Yahya — Marwan ibn Muhammad's scribe — ran friendship and correspondence, whereby Marwan confirmed Abd al-Rahman over the Maghreb frontier."
  es: "En al-Baladhuri: escriba de Abd al-Rahman ibn Habib al-Fihri; entre él y Abd al-Hamid ibn Yahya — escriba de Marwan ibn Muhammad — existió una amistad y correspondencia, mediante la cual Marwan confirmó a Abd al-Rahman en la frontera del Magreb."
  fr: "Dans al-Baladhuri: scribe d'Abd al-Rahman ibn Habib al-Fihri; entre lui et Abd al-Hamid ibn Yahya — le scribe de Marwan ibn Muhammad — s'est établie une amitié et une correspondance, par lesquelles Marwan a confirmé Abd al-Rahman au-delà de la frontière du Maghreb."
  ur: "البلادوری میں ہے: عبد الرحمن بن حبیب الفہری کا کاتب؛ اس کے اور عبد الحمید ابن یحییٰ کے درمیان - مروان بن محمد کے کاتب - نے دوستی اور خط و کتابت چلائی جس کے تحت مروان نے مغرب کی سرحد پر عبدالرحمٰن کی تصدیق کی۔"
  tr: "Al-Baladhuri'ye göre: Abd al-Rahman ibn Habib al-Fihri'nin kâtibi ve onunla Mervan ibn Muhammed'in kâtipi Abd al-Hamid ibn Yahya arasında sevgi ve yazışmalar vardı, bu yüzden Marwan Abd al-Rahman'ı Mağrip sınırında kabul etti. Diwanda büyümüş ve toplamda yaklaşık iki yüz sayfa uzunluğunda mektuplar yazan yetkin bir elçi {atıf:Fihrist-ibn-al-nadim s. 171}"
  id: "Menurut al-Baladhuri: juru tulis Abd al-Rahman ibn Habib al-Fihri, dan antara dia dan Abd al-Hamid ibn Yahya, juru tulis Marwan ibn Muhammad, ada kasih sayang dan korespondensi, sehingga Marwan mengakui Abd al-Rahman di perbatasan Maghreb. Seorang utusan terampil yang tumbuh di diwan dan menulis surat sekitar dua ratus halaman {cite:fihrist-ibn-al-nadim hlm. 171}"
