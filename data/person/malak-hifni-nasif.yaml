summary:
  ar: "كاتبة ومفكرة مصرية ⁦(1886–1918)⁩ عُرفت باسمها الأدبي «باحثة البادية»، من رائدات حركة تحرير المرأة في مصر. كتبت في جريدة الجريدة مقالات في تعليم البنات وحقوق النساء والإصلاح الاجتماعي، جُمعت في «النسائيات»، وأسّست «اتحاد النساء من أجل التعليم»."
  en: "Egyptian essayist and thinker (1886–1918), known by her pen name 'Bahithat al-Badiya' (Seeker in the Desert), a pioneer of the women's emancipation movement in Egypt. She wrote in the newspaper Al-Jarida on girls' education, women's rights and social reform, collected in Al-Nisa'iyyat (Feminist Pieces), and founded the Union for Women's Education."
  ur: "مصری مضمون نگار اور مفکرہ ⁦(1886–1918)⁩ جن کا قلمی نام «باحثۃ البادیہ» تھا اور جو مصر میں تحریکِ نسواں کی رائدوں میں شمار ہیں۔ انہوں نے اخبار الجریدہ میں لڑکیوں کی تعلیم، خواتین کے حقوق اور سماجی اصلاح پر مضامین لکھے جو «النسائیات» میں جمع ہوئے، اور یونین فار ویمنز ایجوکیشن قائم کی۔"
  es: "Ensayista y pensadora egipcia (1886-1918), conocida por su seudónimo «Bahithat al-Badiya» (Buscadora en el Desierto), fue pionera del movimiento de emancipación femenina en Egipto. Escribió en el periódico Al-Jarida sobre la educación de las niñas, los derechos de las mujeres y la reforma social, textos que se recopilaron en Al-Nisa'iyyat (Personajes Feministas), y fundó la Unión para la Educación de las Mujeres."
  fr: "Essayiste et penseuse égyptienne (1886-1918), connue sous son nom de plume « Bahithat al-Badiya » (Chercheuse du désert), elle fut une pionnière du mouvement d'émancipation des femmes en Égypte. Elle écrivit dans le journal Al-Jarida sur l'éducation des filles, les droits des femmes et la réforme sociale; ses articles furent rassemblés dans Al-Nisa'iyyat (Écrits féministes); et elle fonda l'Union pour l'éducation des femmes."
