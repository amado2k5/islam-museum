  id: "Muhammad ibn al-Fudayl ibn Ghazwan al-Dhabi, mantan mereka yang dikenal sebagai Abu Abd al-Rahman, meninggal pada tahun seratus tujuh puluh lima. Ia menulis buku al-Sunan menurut urutan kitab fiqh, kitab tafsir, kitab asketisme, buku puasa, dan buku permohonan {cite:fihrist-ibn-al-nadim hlm. 316}."
