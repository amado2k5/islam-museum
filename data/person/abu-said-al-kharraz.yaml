summary:
  ar: "أبو سعيد أحمد بن عيسى الخراز الصوفي البغدادي، نسبته إلى خرز الجلود، صحب ذا النون المصري والسري السقطي وبشراً الحافي، ويصفه السلمي بإمام القوم في كل فن من علومهم، ويقال إنه أول من تكلم في علم الفناء والبقاء. اجتاز بصيدا من ساحل دمشق في سياحته فترجمه ابن عساكر في «تاريخ دمشق»، وجمع فيها أقواله وأخباره في التوكل والمراقبة والطيّ. اختُلف في وفاته بين 277 و286هـ {cite:tarikh-dimashq-amrawi-v5 p. 129-143}."
  en: "Abu Sa'id Ahmad ibn Isa al-Kharraz, the Baghdadi Sufi, named after the stitching of leather goods, who kept company with Dhu al-Nun al-Misri, al-Sari al-Saqati and Bishr al-Hafi; al-Sulami calls him the imam of the Sufis in every branch of their sciences, and he is said to have been the first to speak of the science of annihilation and subsistence (fana' and baqa'). He passed through Sidon on the Damascus coast in his wanderings, so Ibn Asakir gave him an entry in Tarikh Dimashq, gathering his sayings and reports on trust in God, self-watchfulness and long fasting. His death is put between 277 and 286 AH {cite:tarikh-dimashq-amrawi-v5 p. 129-143}."
  ur: "ابو سعید احمد بن عیسیٰ خراز صوفی بغدادی، جن کی نسبت چمڑے کی سلائی ⁦(خرز)⁩ کے پیشے سے ہے؛ انہوں نے ذو النون مصری، سری سقطی اور بشر حافی کی صحبت پائی۔ سلمی انہیں صوفیہ کے ہر علم میں امام کہتے ہیں، اور کہا جاتا ہے کہ فنا و بقا کے علم میں سب سے پہلے انہوں نے کلام کیا۔ سیاحت کے دوران دمشق کے ساحل پر صیدا سے گزرے، اس لیے ابن عساکر نے «تاریخ دمشق» میں ان کا ترجمہ لکھا اور توکل، مراقبہ اور طیّ ⁦(مسلسل فاقے)⁩ کے بارے میں ان کے اقوال و اخبار جمع کیے۔ ان کی وفات 277 اور 286ھ کے درمیان بتائی گئی ہے {cite:tarikh-dimashq-amrawi-v5 p. 129-143}۔"
