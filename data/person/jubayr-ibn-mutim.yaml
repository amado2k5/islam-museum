summary:
  ar: من أكابر قريش وعلماء النسب؛ قدم على النبي في فداء أسرى بدر فسمعه يقرأ سورة الطور وكان ذلك «أول ما دخل الإيمان في قلبي»، وأسلم بين الحديبية والفتح، وأخذ علم النسب عن أبي بكر.
  en: A leader of Quraysh and a genealogist; he came to the Prophet to ransom the Badr captives and heard him recite al-Tur, which he later said was the first time faith entered his heart; he embraced Islam between al-Hudaybiyya and the conquest,
    and took his knowledge of genealogy from Abu Bakr.
