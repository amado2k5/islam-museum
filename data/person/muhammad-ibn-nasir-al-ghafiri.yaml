summary:
  ar: "محمد بن ناصر بن عامر بن رمثة بن خميس الغافري ⁦(توفي 1140 هـ)⁩: من أئمة عمان، شجاع قوي العصبية مطاع في قومه، اجتمعت الكلمة على إمامته في نزوى سنة 1137 هـ وقاتل المخالفين، وتوفي إثر رصاصة أصابته في معركة بصحار. {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 121}"
  en: "Muhammad ibn Nasir ibn Amir ibn Ramtha ibn Khamis al-Ghafiri (died 1140 AH): one of the imams of Oman, brave and obeyed by his people, on whose imamate agreement was reached at Nizwa in 1137 AH; he fought opponents and died of a bullet wound received in a battle at Sohar. {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 121}"
  es: "Muhammad ibn Nasir ibn Amir ibn Ramtha ibn Khamis al-Ghafiri (fallecido en 1140 AH): uno de los imanes de Omán, valiente y respetado por su pueblo, cuyo acuerdo de imamato se alcanzó en Nizwa en 1137 AH; combatió contra sus oponentes y murió a causa de una herida de bala recibida en una batalla en Sohar. {cite:alam-zirikli-dar-al-ilm-2002 vol. 7 p. 121}"
