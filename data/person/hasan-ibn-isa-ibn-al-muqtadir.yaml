label:
  ar: "الحسن بن عيسى بن المقتدر بالله"
  en: "al-Hasan ibn Isa ibn al-Muqtadir"
summary:
  ar: "علويّ عباسي من أبناء الخلفاء؛ ولد في محرم سنة ثلاث وثلاثمائة، وسمع من مؤديه أحمد بن منصور اليشكري وأبي الأزهر عبد الوهاب بن عبد الرحمن الكاتب، وكان فاضلًا ديّنًا حافظًا لأخبار الخلفاء عارفًا بأيام الناس صالحًا زاهدًا، وترك الخلافة عن قدرة وآثر بها القاهر بالله. توفي سنة أربعين وأربعمائة، وأوصى أن يغسله ويصلي عليه القاضي أبو الحسين بن الغريق وأن يُحمل إلى باب حرب في النهار ويُدفن بغير تابوت؛ حضر جنازته الوزراء كمال الملك وزعيم الملك ومشى البساسيري خلف جنازته من داره إلى قبره، ودُفن بقرب قبر أحمد بن حنبل، وجلس رئيس الرؤساء أبو القاسم من الغد للعزاء {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  en: "An Abbasid prince who 'left the caliphate though able to take it, preferring al-Qahir billah' — born Muharram 303, a virtuous ascetic learned in the history of the caliphs and the days of men. He willed to be washed by the qadi Ibn al-Ghariq and buried by daylight at Bab Harb without a coffin; the viziers Kamal al-Mulk and Za'im al-Mulk attended, al-Basasiri walked behind his bier, and he was laid near Ahmad ibn Hanbal's grave, in 440 {cite:muntazam-ibn-al-jawzi j.8 p.479}."
