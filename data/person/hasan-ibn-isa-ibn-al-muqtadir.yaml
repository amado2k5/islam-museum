class: person
label:
  ar: "الحسن بن عيسى بن المقتدر بالله"
  en: "al-Hasan ibn Isa ibn al-Muqtadir"
  es: "al-Hasan ibn Isa ibn al-Muqtadir"
  fr: "al-Hasan ibn Isa ibn al-Muqtadir"
  ur: "الحسن بن عیسیٰ ابن مقتدیر"
summary:
  ar: "علويّ عباسي من أبناء الخلفاء؛ ولد في محرم سنة ثلاث وثلاثمائة، وسمع من مؤديه أحمد بن منصور اليشكري وأبي الأزهر عبد الوهاب بن عبد الرحمن الكاتب، وكان فاضلًا ديّنًا حافظًا لأخبار الخلفاء عارفًا بأيام الناس صالحًا زاهدًا، وترك الخلافة عن قدرة وآثر بها القاهر بالله. توفي سنة أربعين وأربعمائة، وأوصى أن يغسله ويصلي عليه القاضي أبو الحسين بن الغريق وأن يُحمل إلى باب حرب في النهار ويُدفن بغير تابوت؛ حضر جنازته الوزراء كمال الملك وزعيم الملك ومشى البساسيري خلف جنازته من داره إلى قبره، ودُفن بقرب قبر أحمد بن حنبل، وجلس رئيس الرؤساء أبو القاسم من الغد للعزاء {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  en: "An Abbasid prince who 'left the caliphate though able to take it, preferring al-Qahir billah' — born Muharram 303, a virtuous ascetic learned in the history of the caliphs and the days of men. He willed to be washed by the qadi Ibn al-Ghariq and buried by daylight at Bab Harb without a coffin; the viziers Kamal al-Mulk and Za'im al-Mulk attended, al-Basasiri walked behind his bier, and he was laid near Ahmad ibn Hanbal's grave, in 440 {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  es: "Un príncipe abasí que «abandonó el califato aunque podía tomarlo, prefiriendo a al-Qahir billah» —nacido en Muharram 303, un asceta virtuoso versado en la historia de los califas y los días de los hombres. Quiso ser lavado por el cadí Ibn al-Ghariq y enterrado a la luz del día en Bab Harb sin ataúd; los visires Kamal al-Mulk y Za'im al-Mulk asistieron, al-Basasiri caminó detrás de su féretro, y fue colocado cerca de la tumba de Ahmad ibn Hanbal, en 440 {cite:muntazam-ibn-al-jawzi j.8 p.479}."
  fr: "Prince abbasside qui « quitta le califat bien qu'ayant pu l'accéder, préférant al-Qahir billah » — né en Muharram 303, ascète vertueux et érudit en histoire des califes et des temps des hommes. Il souhaita être lavé par le cadi Ibn al-Ghariq et enterré en plein jour à Bab Harb, sans cercueil; les vizirs Kamal al-Mulk et Za'im al-Mulk y assistèrent, al-Basasiri marcha derrière son cercueil, et il fut inhumé près de la tombe d'Ahmad ibn Hanbal, en 440 av. J.-C. (cit.: muntazam-ibn-al-jawzi j.8 p.479)."
  ur: "ایک عباسی شہزادہ جس نے 'خلافت چھوڑنے کے قابل ہونے کے باوجود القاہر باللہ کو ترجیح دی' - پیدائش 303 محرم، خلفاء کی تاریخ اور مردوں کے زمانے میں سیکھا جانے والا ایک نیک سنت۔ وہ قاضی ابن الغرق کے ہاتھوں غسل دینے اور باب حرب میں بغیر تابوت کے دفن کرنے کی وصیت کرتا تھا۔ وزیر کمال الملک اور ضعیم الملک نے شرکت کی، البصیری اپنے بیئر کے پیچھے چلا، اور اسے احمد بن حنبل کی قبر کے قریب 440 میں سپرد خاک کیا گیا۔"
  tr: "Alevi Abbasi halifelerden biriydi; 303 Hicri yılında Muharrem'de doğdu. Liderleri Ahmed bin Mansur el-Yeşkuri ve Ebu el-Ezher Abdül-Vahhab bin Abdülrahman el-Katib'ten duydu. Erdemli, dindar, halifelerin haberlerini ezberleyen, insanların günlerini bilen ve münzeviydi. Halifeliği kendi gücünden uzak bıraktı ve onu Allah'a kıyasla tercih etti. 440 Hicri yılında öldü. Hakim Ebu el-Katib'ti -Hüseyin bin el-Ghariq, onun cenaze namazıyla yıkanmasını ve yönlendirilmesini emretti; gündüz Bab Harb'a taşınıp tabutsuz defnedilmesini istedi. Bakanlar Kamal al-Mulk ve kralın lideri cenazesine katıldı, el-Basasiri ise cenazesini evinden mezarına kadar takip etti; mezarı Ahmed bin Hanbal'ın mezarının yakınında defnedildi. Şeflerin reisi Ebu el-Qasim ertesi gün oturup başsağlığı diledi {alıntı:Muntazam-ibn-al-Jawzi J. 8 s.479}."
  id: "Alawi Abbasi adalah salah satu khalifah; ia lahir di Muharram pada tahun 303 H. Ia mendengar dari para pemimpinnya Ahmad ibn Mansur al-Yashkuri dan Abu al-Azhar Abd al-Wahhab ibn Abd al-Rahman al-Katib. Ia berbudi luhur, religius, menghafal berita para khalifah, tahu tentang hari-hari manusia, dan pertapa yang berkuasa. Ia meninggalkan kekhalifahan di luar kekuasaannya dan memilihnya daripada Yang Maha Kuasa bersama Tuhan. Ia wafat pada tahun 440 AH. Hakim Abu al-Husayn ibn al-Ghariq memerintahkan agar ia dimandikan dan dipimpin oleh doa pemakaman untuknya, agar ia dibawa ke Bab Harb pada siang hari dan dimakamkan tanpa peti mati. Para menteri Kamal al-Mulk dan pemimpin raja menghadiri pemakamannya, dan al-Basasiri mengikuti pemakamannya dari rumahnya ke makamnya, yang dimakamkan di dekat makam Ahmad ibn Hanbal. Kepala para kepala, Abu al-Qasim, duduk keesokan harinya untuk menyampaikan belasungkawa {cite:muntazam-ibn-al-jawzi j.. 8 hlm.479}."
