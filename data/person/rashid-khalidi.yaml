summary:
  ar: "مؤرخ فلسطيني أمريكي (وُلد في نيويورك سنة 1948)، أستاذ كرسي إدوارد سعيد للدراسات العربية الحديثة في جامعة كولومبيا سابقاً، ومحرر «مجلة الدراسات الفلسطينية» (2002–2020). من كتبه «الهوية الفلسطينية» (1997) و«حرب المئة عام على فلسطين» (2020)."
  en: "Palestinian-American historian (born 1948 in New York), Edward Said Professor Emeritus of Modern Arab Studies at Columbia University and editor of the Journal of Palestine Studies (2002–2020). His books include Palestinian Identity (1997) and The Hundred Years' War on Palestine (2020)."
  ur: "فلسطینی نژاد امریکی مؤرخ (پیدائش 1948ء، نیویارک)، کولمبیا یونیورسٹی میں جدید عرب مطالعات کے ایڈورڈ سعید پروفیسر ایمریٹس اور «جرنل آف فلسطین اسٹڈیز» کے مدیر (2002–2020ء)۔ ان کی کتابوں میں «فلسطینی شناخت» (1997ء) اور «فلسطین پر سو سالہ جنگ» (2020ء) شامل ہیں۔"
