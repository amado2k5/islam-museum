summary:
  ar: "داعية وطبيب مصري، وُلد في المنصورة سنة 1974 وتخرج في كلية الطب بجامعة المنصورة. اشتهر بدروسه للشباب في مسجد السلاب بالمنصورة وببرامجه وسلاسله على القنوات الفضائية، وله عدد من الكتب الدعوية."
  en: "Egyptian preacher and physician, born in Mansoura in 1974 and a graduate of Mansoura University's Faculty of Medicine. He became known for his youth lessons at the Al-Sallab Mosque in Mansoura and for his programmes and series on satellite channels, and has written several devotional books."
  ur: "مصری مبلغ اور طبیب، جو 1974 میں منصورہ میں پیدا ہوئے اور منصورہ یونیورسٹی کے شعبہ طب سے فارغ التحصیل ہیں۔ وہ منصورہ کی مسجد السلاب میں نوجوانوں کے دروس اور سیٹلائٹ چینلوں پر اپنے پروگراموں اور سلسلوں کے لیے مشہور ہوئے، اور ان کی کئی دعوتی کتابیں ہیں۔"
  es: "Predicador y médico egipcio, nacido en Mansoura en 1974 y graduado de la Facultad de Medicina de la Universidad de Mansoura. Se dio a conocer por sus enseñanzas para jóvenes en la mezquita Al-Sallab de Mansoura y por sus programas y series en canales vía satélite, y es autor de varios libros devocionales."
  fr: "Prédicateur et médecin égyptien, né à Mansoura en 1974 et diplômé de la faculté de médecine de l'université de Mansoura, il s'est fait connaître pour ses enseignements destinés aux jeunes à la mosquée Al-Sallab de Mansoura, ainsi que pour ses émissions et séries diffusées sur les chaînes satellitaires. Il est également l'auteur de plusieurs ouvrages de dévotion."
  tr: "1974 yılında Mansura'da doğan Mısırlı vaiz ve hekim olan Sher, Mansura Üniversitesi Tıp Fakültesi'nden mezun oldu. Mansura'daki El-Salab Camii'nde gençlere verdiği dersler, uydu kanallarındaki programları ve dizisleriyle ünlendi, ayrıca birçok dini kitap yazdı."
  id: "Seorang pengkhotbah dan dokter Mesir, lahir di Mansoura pada tahun 1974, ia lulus dari Fakultas Kedokteran Universitas Mansoura. Ia menjadi terkenal karena pelajaran untuk masa muda di Masjid Al-Salab di Mansoura, program dan serinya di saluran satelit, serta menulis beberapa buku keagamaan."
