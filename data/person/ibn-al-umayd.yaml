summary:
  ar: "أبو الفضل محمد بن أبي عبد الله الحسين بن محمد الكاتب، المعروف بابن العميد؛ كاتب ركن الدولة بن بويه وله الرتبة العلية لديه؛ نسب إلى أمه عميد ابنة جرير بن عبد الله البجلي وكانت مشهورة بالجمال؛ من الكاتبين المشاهير في الصنعة؛ شرع في بناء حائط عظيم حول دار مخدومه ركن الدولة؛ وبينه وبين الصاحب ابن عباد تنافس وكان يصرف له الرسائل حين توجه إلى بلاد فارس؛ كانت حسرة في قلب ابن العميد إلى أن مات أن الوالي صرفها لابن العميد على الإهمال مع رقة حاله {cite:wafayat-ayan}."
  en: "Abu al-Fadl Ibn al-Umayd (d. 359) — the celebrated katib of Rukn al-Dawla; nephew of Ibrahim b. Hilal al-Sabi and eponym 'son of the slave-girl Umayd'; his rivalry with al-Sahib Ibn Abbad ran through their letters {cite:wafayat-ayan}."
