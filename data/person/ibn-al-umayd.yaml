died: { edtf: "0970", hijri: "0359", calendar: julian, precision: year, status: debated, derived: true, note: "توفي في سنة تسع وخمسين وثلاثمائة وكذا قال جده إبراهيم الصابئي في كتابه {cite:wafayat-ayan}. وعند مسكويه: «وكانت وفاة الأستاذ الرئيس بهمذان في صفر ليلة الخميس السادس منه سنة ستين وثلثمائة» {cite:tajarib-al-umam-surush-v6 p.314}، أي نحو 9 ديسمبر 970م ⁦(تحويل مشتق)⁩.", sources: [source/wafayat-ayan, source/tajarib-al-umam-surush-v6] }
summary:
  ar: "أبو الفضل محمد بن أبي عبد الله الحسين بن محمد الكاتب، المعروف بابن العميد؛ كاتب ركن الدولة بن بويه وله الرتبة العلية لديه؛ نسب إلى أمه عميد ابنة جرير بن عبد الله البجلي وكانت مشهورة بالجمال؛ من الكاتبين المشاهير في الصنعة؛ شرع في بناء حائط عظيم حول دار مخدومه ركن الدولة؛ وبينه وبين الصاحب ابن عباد تنافس وكان يصرف له الرسائل حين توجه إلى بلاد فارس؛ كانت حسرة في قلب ابن العميد إلى أن مات أن الوالي صرفها لابن العميد على الإهمال مع رقة حاله {cite:wafayat-ayan}."
  en: "Abu al-Fadl Ibn al-Umayd (d. 359) — the celebrated katib of Rukn al-Dawla; nephew of Ibrahim b. Hilal al-Sabi and eponym 'son of the slave-girl Umayd'; his rivalry with al-Sahib Ibn Abbad ran through their letters {cite:wafayat-ayan}."
  es: "Abu al-Fadl Ibn al-Umayd (m. 359), el célebre katib de Rukn al-Dawla; sobrino de Ibrahim b. Hilal al-Sabi y epónimo 'hijo de la esclava Umayd'; su rivalidad con al-Sahib Ibn Abbad se encontraba en sus cartas {cita:wafayat-ayan}."
  fr: "Abu al-Fadl Ibn al-Umayd (mort en 359) — le célèbre katib de Rukn al-Dawla; neveu d'Ibrahim b. Hilal al-Sabi et éponyme « fils de l'esclave Umayd »; sa rivalité avec al-Sahib Ibn Abbad transparaissait dans leurs lettres {cite: wafayat-ayan}."
  ur: "ابو الفضل ابن الامید ⁦(متوفی 359)⁩ - رکن الدولہ کے مشہور کاتب؛ ابراہیم بن کا بھتیجا ہلال السبی اور اسم گرامی 'بیٹا آف لونڈی عمید'؛ الصاحب ابن عباد کے ساتھ ان کی دشمنی ان کے خطوط سے چلتی تھی۔"
  tr: "Ebu el-Fadl Muhammed bin Abi Abdullah el-Hüseyin ibn Muhammed el-Katib, İbn al-'Emid olarak bilinir, Rukn al-Dawla ibn Buyah'ın kâtipiydi ve onunla birlikte en yüksek rütbeyi tutuyordu. Annesi Amid'e atfedilir; Jarir bin Abdullah el-Bajali'nin kızıdır; güzelliğiyle tanınır; zanaatkarlıkta ünlü yazarlardan biriydi. Efendisi Rukn al-Dawla'nın evinin etrafına büyük bir duvar inşa etmeye başladı. Yoldaşı, Pers'e gittiğinde ona mektuplar gönderen yoldaşı İbn Abbad ile rekabet etti. İbn al-Amid derin bir üzüntü içindeydi; vali, hassas durumuna rağmen ihmal nedeniyle mektupları İbn al-'Amid'e tahsis etti {atı:wafayat-ayan}."
  id: "Abu al-Fadl Muhammad ibn Abi Abdullah al-Husayn ibn Muhammad al-Katib, yang dikenal sebagai Ibn al-'Amid, adalah juru tulis Rukn al-Dawla ibn Buyah, memegang pangkat tertinggi bersamanya. Ia dikaitkan dengan ibunya Amid, putri Jarir ibn Abdullah al-Bajali, yang terkenal karena kecantikannya; salah satu penulis terkenal dalam kerajinan. Ia mulai membangun tembok besar di sekitar rumah gurunya, Rukn al-Dawla. Ia bersaing dengan sahabatnya Ibn Abbad, yang mengirimkan surat kepadanya saat ia pergi ke Persia. Ibn al-'Amid sangat berduka hingga ia meninggal, ketika gubernur mengalokasikan surat-surat itu kepada Ibn al-'Amid karena diabaikan meskipun kondisinya sangat rapuh {cite:wafayat-ayan}."
