summary:
  ar: "أبو إسماعيل حماد بن الإمام أبي حنيفة النعمان بن ثابت؛ كان على مذهب أبيه ومن أهل الصلاح والخير على قدم عظيم؛ لما توفي أبوه أصرّ على تسليم الودائع التي عنده من ذهب وفضة لأربابها فزنّها القاضي وقبضها لتبرأ ذمة أبيه؛ كان ولده إسماعيل قاضي البصرة فعُزل عنها بالقاضي يحيى بن أكثم {cite:wafayat-ayan}."
  en: "Hammad b. Abi Hanifa — the great imam's son, on his father's school; famous for insisting the deposits left at his father's death be weighed and handed to the qadi to clear his father's obligation; his own son Isma'il was qadi of Basra {cite:wafayat-ayan}."
  es: "Hammad b. Abi Hanifa — el hijo del gran imán, sobre la escuela de su padre; famoso por insistir en que los depósitos dejados a la muerte de su padre fueran pesados y entregados al cadí para saldar la obligación de su padre; su propio hijo Isma'il fue cadí de Basora {cite:wafayat-ayan}."
  fr: "Hammad b. Abi Hanifa — le fils du grand imam, à l'école de son père; célèbre pour avoir insisté pour que les dépôts laissés à la mort de son père soient pesés et remis au cadi pour régler l'obligation de son père; son propre fils Isma'il était cadi de Basra {cite:wafayat-ayan}."
  ur: "حماد بی ابی حنیفہ - عظیم امام کا بیٹا، اپنے والد کے مکتب میں؛ اپنے والد کی موت کے بعد چھوڑی گئی امانتوں کو تول کر قادی کے حوالے کرنے پر اصرار کرنے کے لیے مشہور ہے تاکہ وہ اپنے والد کی ذمہ داری کو ادا کر سکے۔ اس کا اپنا بیٹا اسماعیل بصرہ کا قاضی تھا۔"
