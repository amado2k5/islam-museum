summary:
  ar: "أبو إسماعيل حماد بن الإمام أبي حنيفة النعمان بن ثابت؛ كان على مذهب أبيه ومن أهل الصلاح والخير على قدم عظيم؛ لما توفي أبوه أصرّ على تسليم الودائع التي عنده من ذهب وفضة لأربابها فزنّها القاضي وقبضها لتبرأ ذمة أبيه؛ كان ولده إسماعيل قاضي البصرة فعُزل عنها بالقاضي يحيى بن أكثم {cite:wafayat-ayan}."
  en: "Hammad b. Abi Hanifa — the great imam's son, on his father's school; famous for insisting the deposits left at his father's death be weighed and handed to the qadi to clear his father's obligation; his own son Isma'il was qadi of Basra {cite:wafayat-ayan}."
