  ar: "داعية بوسني (المولود 1977 في ترافنيك)، من أكثر الأصوات الدينية استماعا في المنطقة الناطقة بالبوسنية؛ درس في الجامعة الإسلامية بالمدينة المنورة ونال الدكتوراه في كلية الدراسات الإسلامية في نوفي بازار سنة 2023، وينشر تسجيلات دروسه يوميا؛ تجاوز عدد متابعي صفحته الرسمية على فيسبوك 372 ألفا في أغسطس 2026."
