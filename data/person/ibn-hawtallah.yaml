id: person/ibn-hawtallah
class: person
label: { ar: "ابن حوط الله الأنصاري" }
summary:
  ar: "أبو محمد عبد الله بن سليمان بن داود بن عمر بن حوط الله الأنصاري الحارثي؛ فقيه جليل أصولي كاتب أديب شاعر متفنن في العلوم ورع دين حافظ ثبت فاضل، درس كتاب سيبويه ومستصفى أبي حامد الغزالي، وكان مشهوراً بالعقل والفضل معظماً عند الملوك، يخطب في مجالس الأمراء والمحافل، ولى قضاء إشبيلية وقرطبة ومرسية وسبتة وسلا وميورقة، فتظاهر بالعدل وعرف بما أبطن من الدين والفضل وكان من العلماء العاملين مجانباً لأهل البدع والأهواء بارع الخط حسن التقييد، وسمع الحديث فحصل له سماع لم يشاركه فيه أحد من أهل الغرب وسمع على الجهابذة كابن بشكوال وقرأ أكثر من ستين تأليفاً بين كبار وصغار وأكثر عن ابن حبيش وابن الفخار والسهيلي، ومولده في محرم سنة ٥٤١ ومات بغرناطة سحر يوم الخميس ثاني ربيع الأول سنة ٦١٢ ونقل في تابوته إلى مالقة فدفن بها {cite:nafh-tib-maqqari p. 338}."
  en: "Ibn Hawtallah al-Ansari al-Harithi — jurist, usuli, secretary, poet and preacher, qadi in turn of Seville, Cordoba, Murcia, Ceuta, Sale and Majorca, 'one of the scholars who worked'; he heard hadith with a sama' none in the West shared and read some sixty works, most under Ibn Hubaysh, Ibn al-Fakhkhar and al-Suhayli; born Muharram 541, died at Granada Thursday 2 Rabi I 612 and was carried in his coffin to burial in Malaga {cite:nafh-tib-maqqari p. 338}."
