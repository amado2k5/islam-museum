id: person/ibn-hawtallah
class: person
label: { ar: "ابن حوط الله الأنصاري" }
summary:
  ar: "أبو محمد عبد الله بن سليمان بن داود بن عمر بن حوط الله الأنصاري الحارثي؛ فقيه جليل أصولي كاتب أديب شاعر متفنن في العلوم ورع دين حافظ ثبت فاضل، درس كتاب سيبويه ومستصفى أبي حامد الغزالي، وكان مشهوراً بالعقل والفضل معظماً عند الملوك، يخطب في مجالس الأمراء والمحافل، ولى قضاء إشبيلية وقرطبة ومرسية وسبتة وسلا وميورقة، فتظاهر بالعدل وعرف بما أبطن من الدين والفضل وكان من العلماء العاملين مجانباً لأهل البدع والأهواء بارع الخط حسن التقييد، وسمع الحديث فحصل له سماع لم يشاركه فيه أحد من أهل الغرب وسمع على الجهابذة كابن بشكوال وقرأ أكثر من ستين تأليفاً بين كبار وصغار وأكثر عن ابن حبيش وابن الفخار والسهيلي، ومولده في محرم سنة ٥٤١ ومات بغرناطة سحر يوم الخميس ثاني ربيع الأول سنة ٦١٢ ونقل في تابوته إلى مالقة فدفن بها {cite:nafh-tib-maqqari p. 338}."
  en: "Ibn Hawtallah al-Ansari al-Harithi — jurist, usuli, secretary, poet and preacher, qadi in turn of Seville, Cordoba, Murcia, Ceuta, Sale and Majorca, 'one of the scholars who worked'; he heard hadith with a sama' none in the West shared and read some sixty works, most under Ibn Hubaysh, Ibn al-Fakhkhar and al-Suhayli; born Muharram 541, died at Granada Thursday 2 Rabi I 612 and was carried in his coffin to burial in Malaga {cite:nafh-tib-maqqari p. 338}."
  es: "Ibn Hawtallah al-Ansari al-Harithi — jurista, usuli, secretario, poeta y predicador, cadí sucesivamente de Sevilla, Córdoba, Murcia, Ceuta, Salé y Mallorca, 'uno de los eruditos que trabajaron'; escuchó hadices con un sama' que nadie en Occidente compartió y leyó unas sesenta obras, la mayoría bajo Ibn Hubaysh, Ibn al-Fakhkhar y al-Suhayli; nació en Muharram de 541, murió en Granada el jueves 2 de Rabi de 612 y fue llevado en su ataúd al entierro en Málaga {cite:nafh-tib-maqqari p. 338}."
  fr: "Ibn Hawtallah al-Ansari al-Harithi — juriste, usuli, secrétaire, poète et prédicateur, cadi tour à tour de Séville, Cordoue, Murcie, Ceuta, Sale et Majorque, « l'un des savants qui ont travaillé »; il entendait des hadiths avec un sama' qu'aucun autre en Occident ne possédait et a lu une soixantaine d'ouvrages, la plupart sous Ibn Hubaysh, Ibn al-Fakhkhar et al-Suhayli; né Muharram 541, mort à Grenade le jeudi 2 Rabi I 612 et a été transporté dans son cercueil jusqu'à son enterrement à Malaga {cite:nafh-tib-maqqari p. 338}."
  ur: "ابن حوت اللہ الانصاری الحارثی - فقیہ، اصولی، سکریٹری، شاعر اور مبلغ، سیویل، قرطبہ، مرسیا، سیوٹا، سیل اور مجورکا کے قاضی، 'کام کرنے والے علماء میں سے ایک'؛ اس نے سماع کے ساتھ حدیث سنی، مغرب میں کسی نے بھی اس کا اشتراک نہیں کیا اور تقریباً ساٹھ کام پڑھے، زیادہ تر ابن حبیش، ابن الفخر اور سہیلی کے تحت۔ محرم 541 میں پیدا ہوئے، جمعرات 2 ربیع الثانی 612 کو غرناطہ میں وفات پائی اور ملاگا میں تدفین کے لیے اپنے تابوت میں لے جایا گیا۔ 338}۔"
  tr: "Ebu Muhammed Abdullah ibn Süleyman ibn Davud ibn Ömer ibn Hut Allah el-Ensari el-Harithi; seçkin bir hukukçu, hukukçu, usul âlim, yazar, edebi şair, bilimlerde yetenekli, dindar ve erdemli bir ezberciydi. Sibevey kitaplarını ve Ebu Hamid el-Gazali'nin Mustasfası'nı inceledi. Zekası ve erdemiyle ünlüydü, krallar tarafından saygı gördü. Prenslerin toplantılarında ve toplantılarında konuşmalar yaptı. Sevilla, Cordoba, Murcia, Ceuta, Salé ve Mallorca'da yargıçlık yaptı. Adil gibi davrandı, gizli dini ve erdemiyle tanındı ve yeniliklerden ve kaprislerden bağımsız çalışan, el yazısında ustaydı. Hadisleri dinledi ve Batı'dan kimsenin paylaşamadığı bir dinleme seviyesi kazandı. İbn Başkuwal gibi büyük alimlerden dinledi ve İbn Habish, İbn el-Fukhar ve el-Suhaili'den hem büyük hem genç altmıştan fazla eser okudu. 541 Hicri Muharrem'de doğdu ve Perşembe günü Şafakta Granada'da öldü; bu Rabi'al-Awwal 612 H.'nin ikinci günüdür. Tabutuyla Malaga'ya nakledildi ve burada defnedildi {cite:nafh-tib-maqqari s. 338}."
  id: "Abu Muhammad Abdullah ibn Sulayman ibn Dawud ibn Umar ibn Hut Allah al-Ansari al-Harithi; seorang ahli hukum, ahli hukum, ulama usul, penulis, penyair sastra, dan ahli dalam ilmu pengetahuan, taat dalam agama, seorang penghafal yang teguh dan berbudi luhur. Ia mempelajari kitab Sibawayh dan Mustasfa Abu Hamid al-Ghazali. Ia terkenal karena kecerdasan dan kebajikannya, dihormati oleh para raja. Ia menyampaikan pidato di pertemuan dan pertemuan para pangeran. Ia pernah menjadi hakim di Sevilla, Cordoba, Murcia, Ceuta, Salé, dan Mallorca. Ia berpura-pura adil, dikenal karena agama dan kebajikan tersembunyi, serta termasuk di antara para cendekiawan yang bekerja secara independen tanpa inovasi dan keinginan, mahir menulis tangan. Ia mendengarkan hadis dan memperoleh tingkat pendengaran yang tidak dimiliki siapa pun dari Barat. Ia mendengar dari ulama besar seperti Ibn Bashkuwal dan membaca lebih dari enam puluh karya, baik yang besar maupun muda, dari Ibn Habish, Ibn al-Fukhar, dan al-Suhaili. Ia lahir pada Muharram 541 H dan meninggal di Granada pada fajar hari Kamis, tanggal kedua Rabi' al-Awwal 612 H. Ia dipindahkan dalam peti matinya ke Malaga di mana ia dimakamkan {cite:nafh-tib-maqqari hlm. 338}."
