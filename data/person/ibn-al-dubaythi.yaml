summary:
  ar: "أبو عبد الله محمد بن سعيد بن أبي طالب يحيى بن أبي الحسن علي بن المساعد السعدي، المعروف بابن الدبيثي؛ الفقيه الشافعي المؤرخ الواسطي نسبة إلى دبيثى قرية بنواحي واسط وأصله من كنجة؛ سمع الحديث كثيراً وعلّق تعاليق مفيدة وكانت له حكايات حسنة يوردها ويستعملها في محاوراته؛ كان في الحديث وأسماء رجاله والتاريخ من الحفاظ المشهورين والنبلاء المذكورين؛ صنف كتاباً جعله ذيلاً على تاريخ بغداد {cite:wafayat-ayan}."
  en: "Ibn al-Dubaythi (d. 637) — the Shafi'i historian of Wasit; a famous hafiz of hadith, rijal and history; author of the great Dhayl (continuation) on the Tarikh Baghdad {cite:wafayat-ayan}."
