died: { edtf: "1239", hijri: "0637", calendar: julian, precision: day, status: tradition, derived: true, note: "توفي يوم الاثنين لثمان خلون من شهر ربيع الآخر سنة سبع وثلاثين وستمائة ببغداد ودفن بالوردية {cite:wafayat-ayan}." }
summary:
  ar: "أبو عبد الله محمد بن سعيد بن أبي طالب يحيى بن أبي الحسن علي بن المساعد السعدي، المعروف بابن الدبيثي؛ الفقيه الشافعي المؤرخ الواسطي نسبة إلى دبيثى قرية بنواحي واسط وأصله من كنجة؛ سمع الحديث كثيراً وعلّق تعاليق مفيدة وكانت له حكايات حسنة يوردها ويستعملها في محاوراته؛ كان في الحديث وأسماء رجاله والتاريخ من الحفاظ المشهورين والنبلاء المذكورين؛ صنف كتاباً جعله ذيلاً على تاريخ بغداد {cite:wafayat-ayan}."
  en: "Ibn al-Dubaythi (d. 637) — the Shafi'i historian of Wasit; a famous hafiz of hadith, rijal and history; author of the great Dhayl (continuation) on the Tarikh Baghdad {cite:wafayat-ayan}."
  es: "Ibn al-Dubaythi (m. 637) — el historiador shafi'í de Wasit; un famoso hafiz de hadices, rijal e historia; autor del gran Dhayl (continuación) sobre el Tarikh Baghdad {cite:wafayat-ayan}."
  fr: "Ibn al-Dubaythi (d. 637) — l'historien shafi'ite de Wasit; un célèbre hafiz de hadith, de rijal et d'histoire; auteur du grand Dhayl (continuation) sur le Tarikh Baghdad {cite:wafayat-ayan}."
  ur: "ابن الدبیثی ⁦(متوفی 637)⁩ - وسط کے شافعی مورخ؛ حدیث، رجال اور تاریخ کے مشہور حافظ؛ بغداد کی تاریخ پر عظیم دھیل ⁦(تسلسل)⁩ کے مصنف"
  tr: "Ebu Abdullah Muhammed ibn Saeed ibn Abi Talib Yahya ibn Abi al-Hasan Ali ibn al-Musa'id al-Sa'di, İbn al-Dubaythi olarak bilinir; Wasithi'nin Şafii hukukçusu ve tarihçisi, Wasit yakınlarındaki Dubaythi köyünden adını taşır, aslen Kanja'dan; hadisleri çokça dinler ve faydalı tefsirler üzerine yorum yapardı. Anlatacak ve sohbetlerinde kullanabileceği iyi hikayeleri vardı; hadisler, rivayetçilerin isimleri ve tarih üzerine ünlü ve asil ezberleyiciler arasındaydı; Bağdat Tarihi'ne ek olarak hazırladığı bir kitap yazdı {cite:wafayat-ayan}."
  id: "Abu Abdullah Muhammad ibn Saeed ibn Abi Talib Yahya ibn Abi al-Hasan Ali ibn al-Musa'id al-Sa'di, dikenal sebagai Ibn al-Dubaythi; ahli hukum dan sejarawan Syafi'i dari Wasithi, dinamai menurut Dubaythi, sebuah desa dekat Wasit, yang berasal dari Kanja; ia banyak mendengar hadis dan memberikan komentar yang berguna. Ia memiliki cerita yang baik untuk diceritakan dan digunakan dalam percakapannya; ia termasuk di antara para penghafal hadits terkenal dan mulia, nama-nama para naratornya, dan sejarahnya; ia menulis sebuah buku yang ia jadikan sebagai suplemen Sejarah Baghdad {cite:wafayat-ayan}."
