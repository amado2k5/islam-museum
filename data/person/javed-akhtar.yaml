summary:
  ar: "شاعر وكاتب أغانٍ وسيناريو هندي (وُلد سنة 1945) من غواليور، نال الشهرة نصفَ ثنائي «سليم–جاويد» صاحب «زنجير» و«ديوار» و«شعلة»، ثم صار من أبرز شعراء الأغنية في السينما الهندية، وعضواً مرشحاً في مجلس الشيوخ (2010–2016)، وأول هندي ينال جائزة ريتشارد دوكينز (2020)."
  en: "Indian poet, lyricist and screenwriter (born 1945) from Gwalior who rose to fame as half of the Salim–Javed duo behind Zanjeer, Deewaar and Sholay, became one of Hindi cinema's foremost lyricists, served as a nominated member of the Rajya Sabha (2010–2016), and in 2020 became the first Indian to receive the Richard Dawkins Award."
  ur: "بھارتی شاعر، نغمہ نگار اور منظر نویس (پیدائش 1945) جن کا تعلق گوالیار سے ہے؛ انھوں نے «زنجیر»، «دیوار» اور «شعلے» کی سلیم–جاوید جوڑی کے نصف کی حیثیت سے شہرت پائی، پھر بھارتی سنیما کے ممتاز ترین نغمہ نگاروں میں شمار ہوئے، راجیہ سبھا کے نامزد رکن (2010–2016) رہے اور 2020 میں رچرڈ ڈاکنز ایوارڈ حاصل کرنے والے پہلے بھارتی بنے۔"
