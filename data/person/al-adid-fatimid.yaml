label: { ar: "العاضد لدين الله آخر خلفاء بني عبيد" }
summary:
  ar: "رابع عشر وآخر ملوك الدولة العبيدية، قام بعد الفائز في أول خلافة المستنجد، وولى أسد الدين شيركوه الوزارة سنة أربع وستين ثم صلاح الدين بعده، وفي سنة سبع وستين أقيمت الخطبة العباسية بمصر والقاهرة وهو شديد المرض فتوفي في يوم عاشوراء وتسلم صلاح الدين القصر بما فيه من الذخائر والنفائس بحيث استمر البيع فيه عشر سنين {cite:tarikh-khulafa-minhaj-1434 p. 679-683}."
  en: "Fourteenth and last Ubaydid caliph; Shirkuh then Salah al-Din viziered under him till the Abbasid khutba was raised in Muharram 567 while he lay dying — he passed on Ashura, his palace's hoards selling for ten years {cite:tarikh-khulafa-minhaj-1434 p. 679-683}."
