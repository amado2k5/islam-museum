id: person/al-adid-fatimid
class: person
label: { ar: "العاضد لدين الله آخر خلفاء بني عبيد", en: "al-Adid li-Din Allah, last Ubaydid caliph" }
summary:
  ar: "رابع عشر وآخر ملوك الدولة العبيدية، قام بعد الفائز في أول خلافة المستنجد، وولى أسد الدين شيركوه الوزارة سنة أربع وستين ثم صلاح الدين بعده، وفي سنة سبع وستين أقيمت الخطبة العباسية بمصر والقاهرة وهو شديد المرض فتوفي في يوم عاشوراء وتسلم صلاح الدين القصر بما فيه من الذخائر والنفائس بحيث استمر البيع فيه عشر سنين {cite:tarikh-khulafa-minhaj-1434 p. 679-683}. خاتمة خلفاء الباطنية، ولد في أول سنة ست وأربعين وخمس مئة وأقامه الصالح ابن رزبك بعد هلاك الفائز، وفي أيامه قدم الحسين بن نزار بن المستنصر العبيدي في جموع من العرب فلما قرب غدر به أصحابه وقبضوا عليه وحملوه إلى العاضد فذبحه صبراً، وفي سنة سبع وستين تجاسر صلاح الدين وقطع خطبته وخطب للخليفة العباسي المستضيء فمات العاضد عقيب ذلك قيل إنه مات غبناً وقيل بإسهال مفرط وقيل دس إليه خاتم مسموم فامتصه وخسر نفسه وعاش إحدى وعشرين سنة وأظهر صلاح الدين الحزن عليه وجلس للعزاء ثم تسلم القصر وما حوى وحول أولاد المستضيء — أي العاضد — وخاصته إلى مكان آخر ورتب لهم كفايتهم {cite:shadharat-dhahab p. 702-703}. ويذكر ابن الأثير أن أهل العاضد كتموا عنه قطع الخطبة حتى توفي ولم يعلم بها، وأنه أرسل إلى صلاح الدين في شدة مرضه يستدعيه فظنه خديعة فلم يمض إليه فلما توفي ندم على تخلفه وكان يصفه بالكرم ولين الجانب وغلبة الخير على طبعه؛ وفي القصر من النفائس ما يخرج عن الإحصاء ومنها حبل الياقوت — وقد شاهده ابن الأثير ووزنه — واللؤلؤ الذي لم يوجد مثله والنصاب الزمرد وطبل القولنج وكتب نفيسة معدومة المثل بيعت جميعها {cite:kamil-ibn-al-athir p. 34}."
  en: "Fourteenth and last Ubaydid caliph; Shirkuh then Salah al-Din viziered under him till the Abbasid khutba was raised in Muharram 567 while he lay dying — he passed on Ashura, his palace's hoards selling for ten years {cite:tarikh-khulafa-minhaj-1434 p. 679-683}."
