id: person/al-adid-fatimid
class: person
label:
  ar: العاضد لدين الله آخر خلفاء بني عبيد
  en: al-Adid li-Din Allah, last Ubaydid caliph
  fr: "Al-Adid li-Din Allah, dernier calife ubaydide"
  ur: العاضد لدین اللہ
  es: "al-Adid li-Din Allah, last Ubaydid caliph"
summary:
  ar: رابع عشر وآخر ملوك الدولة العبيدية، قام بعد الفائز في أول خلافة المستنجد، وولى أسد الدين شيركوه الوزارة سنة أربع وستين
    ثم صلاح الدين بعده، وفي سنة سبع وستين أقيمت الخطبة العباسية بمصر والقاهرة وهو شديد المرض فتوفي في يوم عاشوراء وتسلم صلاح
    الدين القصر بما فيه من الذخائر والنفائس بحيث استمر البيع فيه عشر سنين {cite:tarikh-khulafa-minhaj-1434 p. 679-683}. خاتمة
    خلفاء الباطنية، ولد في أول سنة ست وأربعين وخمس مئة وأقامه الصالح ابن رزبك بعد هلاك الفائز، وفي أيامه قدم الحسين بن نزار
    بن المستنصر العبيدي في جموع من العرب فلما قرب غدر به أصحابه وقبضوا عليه وحملوه إلى العاضد فذبحه صبراً، وفي سنة سبع وستين
    تجاسر صلاح الدين وقطع خطبته وخطب للخليفة العباسي المستضيء فمات العاضد عقيب ذلك قيل إنه مات غبناً وقيل بإسهال مفرط وقيل
    دس إليه خاتم مسموم فامتصه وخسر نفسه وعاش إحدى وعشرين سنة وأظهر صلاح الدين الحزن عليه وجلس للعزاء ثم تسلم القصر وما حوى
    وحول أولاد المستضيء — أي العاضد — وخاصته إلى مكان آخر ورتب لهم كفايتهم {cite:shadharat-dhahab p. 702-703}. ويذكر ابن الأثير
    أن أهل العاضد كتموا عنه قطع الخطبة حتى توفي ولم يعلم بها، وأنه أرسل إلى صلاح الدين في شدة مرضه يستدعيه فظنه خديعة فلم
    يمض إليه فلما توفي ندم على تخلفه وكان يصفه بالكرم ولين الجانب وغلبة الخير على طبعه؛ وفي القصر من النفائس ما يخرج عن الإحصاء
    ومنها حبل الياقوت — وقد شاهده ابن الأثير ووزنه — واللؤلؤ الذي لم يوجد مثله والنصاب الزمرد وطبل القولنج وكتب نفيسة معدومة
    المثل بيعت جميعها {cite:kamil-ibn-al-athir p. 34}.
  en: Fourteenth and last Ubaydid caliph; Shirkuh then Salah al-Din viziered under him till the Abbasid khutba was raised
    in Muharram 567 while he lay dying — he passed on Ashura, his palace's hoards selling for ten years {cite:tarikh-khulafa-minhaj-1434
    p. 679-683}.
  fr: "Quatorzième et dernier calife ubaydide ; Shirkuh puis Salah al-Din furent ses vizirs jusqu’à la proclamation de la khutba abbasside en muharram 567 H, alors qu’il était mourant. Il s’éteignit à Achoura ; la vente des trésors de son palais dura dix ans {cite:tarikh-khulafa-minhaj-1434 p. 679-683}."
  ur: مصر کے آخری فاطمی خلیفہ تھے۔ ان کے عہد میں پہلے شیرکوہ اور پھر صلاح الدین وزیر بنے، اور ان کی وفات کے قریب مصر میں عباسی
    خطبہ بحال ہوا۔ {cite:shadharat-dhahab}
  es: "Decimocuarto y último califa Ubaydid; Shirkuh y luego Salah al-Din fueron visires bajo su mando hasta que se levantó la jutba abasí en Muharram 567 mientras agonizaba; falleció en Ashura, y los tesoros de su palacio se vendieron durante diez años {cite:tarikh-khulafa-minhaj-1434 p. 679-683}."
  tr: "Fatımi halifelerinin on dördüncü ve sonuncusu olan bu halife, ilk halifelik döneminde El-Faiz'den sonra geldi ve 64. yılda Esad El-Din Şirkuh'u vezir olarak atadı, ardından da Selahaddin'i vezir yaptı. 67. yılda, Abbasi hutbesi Mısır ve Kahire'de yapılırken çok hastaydı ve Aşura günü vefat etti. Selahaddin sarayı ve tüm hazinelerini ve değerli eşyalarını devraldı ve burada on yıl boyunca satış devam etti. {cite:tarikh-khulafa-minhaj-1434 s. 679-683}. İsmailî halifelerinin sonuncusu olan bu halife, Hicri 546 yılının ilk yılında doğdu ve El-Faiz'in ölümünden sonra El-Salih İbn Ruzbak tarafından tahta geçirildi. Hüseyin İbn Nizar İbn Müstansir Ubeydi, kendi döneminde Arap gruplarıyla birlikte geldi. Yaklaştığında, arkadaşları ona ihanet ederek onu yakaladılar ve onu Adid'e götürdüler; Adid de onu soğukkanlılıkla katletti. Hicri 567 yılında Selahaddin, onun adına verilen hutbeyi durdurmaya cesaret etti ve hutbeyi Abbasi Halifesi Müstadi adına verdi. Adid kısa süre sonra öldü. Bazı rivayetlere göre kederden öldü, bazı rivayetlere göre şiddetli ishalden öldü, bazı rivayetlere göre ise ağzına zehirli bir yüzük sokuldu ve emdi, böylece hayatını kaybetti. Yirmi bir yıl yaşamıştı. Selahaddin onun için üzüntü duydu ve bir yas töreni düzenledi. Sonra sarayı ve içindekileri ele geçirdi ve Müstadi'nin oğullarını -yani Adid'i- ve maiyetini başka bir yere taşıdı ve ihtiyaçlarının karşılanmasını sağladı. {cite:shadharat-dhahab s. İbn el-Athir, el-Adid'in halkının, vaazın kesilmesini ondan ölümüne kadar sakladığını ve kendisinin de bundan haberdar olmadığını belirtir. Ağır hastalığı sırasında Selahaddin'e bir mesaj göndererek onu çağırmış, ancak Selahaddin bunun bir hile olduğunu düşünerek yanına gitmemiştir. Ölümünden sonra yokluğuna pişman olmuştur. Onu cömert, nazik ve doğasında iyiliğin hakim olduğu biri olarak tanımlamıştır. Sarayda, İbn el-Athir'in görüp tarttığı yakut bir halat, benzeri daha önce hiç bulunmamış inciler, zümrüt bir kuşak, kolik davulu ve eşi benzeri olmayan değerli kitaplar da dahil olmak üzere sayısız kıymetli eşya bulunmaktaydı ve bunların hepsi satılmıştır. {kaynak: kamil-ibn-al-athir s. 34}"
  id: "Khalifah Fatimiyah keempat belas dan terakhir, ia datang setelah Al-Faiz pada kekhalifahan pertama Al-Mustanjid, dan mengangkat Asad Al-Din Shirkuh sebagai wazir pada tahun 64, kemudian Salah Al-Din setelahnya. Pada tahun 67, khutbah Abbasiyah diadakan di Mesir dan Kairo ketika ia sedang sakit parah, sehingga ia meninggal pada hari Asyura, dan Salah Al-Din mengambil alih istana beserta semua harta dan barang berharganya, sehingga penjualan terus berlanjut di sana selama sepuluh tahun. {cite:tarikh-khulafa-minhaj-1434 p. 679-683}. Khalifah Ismailiyah terakhir, ia lahir pada tahun pertama 546 H dan diangkat oleh Al-Salih Ibn Ruzbak setelah kematian Al-Faiz. Pada masanya, Al-Husayn Ibn Nizar Ibn Al-Mustansir Al-Ubaydi datang bersama kelompok-kelompok Arab. Ketika ia mendekat, para sahabatnya mengkhianatinya, menangkapnya, dan membawanya kepada Al-Adid, yang membunuhnya dengan kejam. Pada tahun 567 H, Saladin berani menghentikan khutbah atas namanya dan menyampaikannya atas nama Khalifah Abbasiyah Al-Mustadi’. Al-Adid meninggal tak lama setelah itu. Ada yang mengatakan bahwa ia meninggal karena kesedihan, ada yang mengatakan bahwa ia meninggal karena diare parah, dan ada yang mengatakan bahwa cincin beracun diselipkan ke mulutnya, yang dihisapnya, dan ia kehilangan nyawanya. Ia hidup selama dua puluh satu tahun. Saladin menunjukkan kesedihannya dan mengadakan upacara berkabung. Kemudian ia mengambil alih istana dan segala isinya dan memindahkan putra-putra Al-Mustadi’—yaitu, Al-Adid—dan rombongannya ke tempat lain dan mengatur agar kebutuhan mereka terpenuhi. {cite:shadharat-dhahab p. 702-703} Ibn al-Athir menyebutkan bahwa orang-orang al-Adid merahasiakan penghentian khutbah itu darinya sampai ia meninggal, dan ia tidak mengetahuinya. Ia mengirim pesan kepada Saladin selama sakitnya yang parah, memanggilnya, tetapi Saladin mengira itu tipuan dan tidak pergi menemuinya. Ketika ia meninggal, ia menyesali ketidakhadirannya. Ia menggambarkan al-Adid sebagai orang yang dermawan, lembut, dan memiliki kebaikan yang melimpah dalam sifatnya. Di istana terdapat barang-barang berharga yang tak terhitung jumlahnya, termasuk tali rubi—yang dilihat dan ditimbang oleh Ibn al-Athir—mutiara yang belum pernah ditemukan sebelumnya, selempang zamrud, gendang kolik, dan buku-buku berharga yang tiada duanya, yang semuanya dijual. {cite:kamil-ibn-al-athir p. 34}"
