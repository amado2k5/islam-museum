label: { ar: "سليمان بن علي العباسي", en: "Sulayman ibn Ali al-Abbasi", es: "Sulayman ibn Ali al-Abbasi", fr: "Sulayman ibn Ali al-Abbasi", ur: "سلیمان بن علی العباسی" }
summary:
  ar: "سليمان بن علي بن عبد الله بن العباس؛ ولاه أبو العباس البصرة فبنى على ما رفعه عدي بن أرطاة من حيطان الغرف بناءً بطين ثم تركه وتحول إلى المربد فنزله."
  en: "Sulayman ibn Ali ibn Abdallah ibn al-Abbas; Abu al-Abbas's Basra governor — he built clay rooms atop Adi's raised walls, then quit the palace for the Mirbad."
  es: "Sulayman ibn Ali ibn Abdallah ibn al-Abbas, gobernador de Basora durante el reinado de Abu al-Abbas, construyó habitaciones de arcilla sobre los muros elevados de Adi y luego abandonó el palacio para trasladarse al Mirbad."
  fr: "Sulayman ibn Ali ibn Abdallah ibn al-Abbas; gouverneur de Bassora d'Abu al-Abbas — il fit construire des pièces en argile au sommet des murs surélevés d'Adi, puis quitta le palais pour le Mirbad."
  ur: "سلیمان ابن علی ابن عبداللہ ابن العباس؛ ابو العباس کا بصرہ کا گورنر - اس نے عدی کی بلند دیواروں کے اوپر مٹی کے کمرے بنائے، پھر میرباد کے لیے محل چھوڑ دیا۔"
  tr: "Süleyman bin Ali ibn Abdullah ibn el-Abbas; Ebu el-Abbas onu Basra'ya atadı; Adi ibn Artah'ın odaların duvarlarından yükselttiği yerin üzerine kerpiç bir yapı inşa etti, sonra oradan ayrılıp el-Murbadd'a taşındı ve orada yerleşti."
  id: "Sulayman ibn Ali ibn Abdullah ibn al-Abbas; Abu al-Abbas mengangkatnya ke Basra, dan ia membangun sebuah bangunan tanah di atas apa yang didirikan Adi ibn Artah dari dinding ruangan, lalu meninggalkannya dan pindah ke al-Murbadd, di mana ia menetap di sana."
