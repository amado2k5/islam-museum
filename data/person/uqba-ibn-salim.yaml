label: { ar: "عقبة بن سالم", en: "'Uqba ibn Salim", es: "'Uqba ibn Salim", fr: "'Uqba ibn Salim", ur: "عقبہ بن سلیم" }
summary:
  ar: "فعل بعمان والبحرين ما فعل كياداً لمعن بن زائدة حين قتله أهل اليمن تعصباً لقومه، فقتل عبد القيس وغيرهم من ربيعة وسائر نزار ممن بأرض البحرين وعمان تعصباً لقومه من قحطان {cite:muruj-al-dhahab p. 220}."
  en: "Avenged Ma'n ibn Za'ida in 'Uman and Bahrayn, killing Abd al-Qays and other Rabi'a and Nizar men in Qahtani partisanship {cite:muruj-al-dhahab p. 220}."
  es: "Vengó a Ma'n ibn Za'ida en 'Uman y Bahrayn, matando a Abd al-Qays y otros hombres de Rabi'a y Nizar en el partidismo qahtani {citar:muruj-al-dhahab p. 220}."
  fr: "A vengé Ma'n ibn Za'ida à 'Uman et Bahrayn, tuant Abd al-Qays et d'autres hommes de Rabi'a et Nizar dans le cadre de la partisanerie Qahtani {cite: muruj-al-dhahab p. 220}."
  ur: "معن بن زیدہ نے عمان اور بحرین میں بدلہ لیا، عبد القیس اور دوسرے ربیعہ اور نزار آدمیوں کو قحطانی جماعت میں قتل کر دیا۔ 220}۔"
  tr: "Umman ve Bahreyn'de, Yemen halkı tarafından halkına olan fanatizmden dolayı Ma'n ibn Zaidah'a karşı komplo kurduğu için yaptığı şeyi yaptı. Abdul Kays ve Bahreyn ile Umman topraklarından Rabi'ah ve diğer Nizarlar halkına karşı fanatizm nedeniyle Kahtan'dan öldürüldü {atıf:muruj-al-dhahab, s. 220}."
  id: "Ia melakukan apa yang ia lakukan di Oman dan Bahrain saat ia merencanakan serangan terhadap Ma'n ibn Zaidah ketika rakyat Yaman membunuhnya karena fanatisme demi rakyatnya. Abdul Qais dan lainnya dari Rabi'ah serta Nizar lain dari tanah Bahrain dan Oman dibunuh karena fanatisme terhadap rakyatnya dari Qahtan {cite:muruj-al-dhahab, hlm. 220}."
