summary:
  ar: "خليفة بني أمية بالأندلس؛ ولي بعد أبيه الحكم صغيراً سنه تسع سنين ولقب المؤيد بعد أن قتل ليلتئذ المغيرة أخو أبيه المرشح لأمره، فتناول الفتك به الحاجب محمد بن أبي عامر بممالأة جعفر بن عثمان المصحفي وغالب مولى الحكم، ثم حجره واستولى على الدولة حتى لم يبق له من رسوم الخلافة أكثر من الدعاء على المنابر وكتابة اسمه في السكة والطرز {cite:nafh-tib-maqqari p. 432-434}."
  en: "The Umayyad caliph of al-Andalus acclaimed at nine years old; the hajib Ibn Abi Amir murdered his uncle al-Mughira, isolated him from his wazirs, and reduced his caliphate to the pulpit prayer and the mint legend {cite:nafh-tib-maqqari p. 432-434}."
