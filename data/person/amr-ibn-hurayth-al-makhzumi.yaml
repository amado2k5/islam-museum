summary:
  ar: "رجل من مخزوم بالكوفة؛ عند البلاذري بنى في مسجدها بناء وكان زياد يستخلفه على الكوفة إذا شخص إلى البصرة."
  en: "A Makhzumi of Kufa; in al-Baladhuri he built in its mosque, and Ziyad deputized him over Kufa when he went to Basra."
  es: "Fue un Makhzumi de Kufa; construyó una mezquita en al-Baladhuri, y Ziyad lo designó jefe de Kufa cuando fue a Basora."
  fr: "Un Makhzumi de Kufa; à al-Baladhuri, il fit construire dans sa mosquée, et Ziyad le nomma délégué à Kufa lorsqu'il se rendit à Bassora."
  ur: "کوفہ کا ایک مخزومی؛ بلادوری میں اس نے اس کی مسجد بنائی، اور زیاد نے اسے کوفہ پر تعینات کر دیا جب وہ بصرہ گیا۔"
  tr: "Kufe'deki Makhzum'dan bir adam; el-Baladhuri'ye göre, camide bir bina inşa etmiş ve Ziyad, onu Basra'ya atandığında Kufe'nin yerine yardımcısı olarak atamıştır."
  id: "Seorang pria dari Makhzum di Kufa; menurut al-Baladhuri, ia membangun sebuah bangunan di masjidnya, dan Ziyad mengangkatnya sebagai wakilnya atas Kufa ketika ia ditugaskan ke Basra."
