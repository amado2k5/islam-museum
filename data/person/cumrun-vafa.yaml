summary:
  ar: "كامران وفا (وُلد 1 آب 1960) فيزيائي نظري إيراني-أمريكي، أستاذ هوليس للرياضيات والفلسفة الطبيعية في جامعة هارفارد ثم أستاذها الجامعي (تيمكين) من 2025. أخذ دكتوراه برينستون بإشراف إدوارد ويتن، وطوّر نظرية F سنة 1997، ونال ميدالية ديراك 2008 وجائزة بريكثرو في الفيزياء الأساسية 2017 وجائزة مصطفى 2021."
  en: "Cumrun Vafa (born 1 August 1960) is an Iranian-American theoretical physicist, Hollis Professor of Mathematicks and Natural Philosophy at Harvard University and, from 2025, its Timken University Professor. He took his Princeton doctorate under Edward Witten, developed F-theory in 1997, and received the 2008 Dirac Medal, the 2017 Breakthrough Prize in Fundamental Physics and the 2021 Mustafa Prize."
