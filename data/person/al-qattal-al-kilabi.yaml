  ar: "شاعر لقبه القتال الكلابي واسمه عبد الله بن المضرحي من بني أبي بكر بن كلاب، يعده شرح الحماسة شاعرا إسلاميا أمويا من المقلين {{cite:hamasa-abu-tammam-ed-1916 p.55}}."
