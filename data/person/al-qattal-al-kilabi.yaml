  fr: "Un poète surnommé al-Qattal al-Kilabi, nommé Abd Allah ibn al-Mudarrahi, de Banu Abi Bakr ibn Kilab; le commentaire Hamasa le considère comme un poète islamique de l'époque omeyyade à faible production {{cite:hamasa-abu-tammam-ed-1916 p.55}}."
