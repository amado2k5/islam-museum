summary:
  ar: "عبد الصمد الفلمباني، عالم من باليمبانغ بجزيرة سومطرة، عاش معظم عمره في الحجاز، ألّف بالعربية والملايوية، وترجم إحياء علوم الدين للغزالي إلى الملايوية تحت عنوان سير السالكين، وكان من تلاميذ مؤسس الطريقة السمانية. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  en: "Abd al-Samad al-Palimbani, a religious teacher from Palembang in Sumatra who lived mostly in Arabia, wrote in Arabic and Malay, and translated al-Ghazali's Lubab Ihya' 'Ulum al-Din into Malay as Siyar al-Salikin. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  ur: "عبدالصمد پالمبانی، پالمبانگ (سماٹرا) کے ایک دینی استاد جو زیادہ تر عرب میں رہے، عربی اور ملائی میں لکھتے تھے، اور غزالی کی لباب احیاء علوم الدین کا ملائی ترجمہ سیر السالکین کے نام سے کیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
