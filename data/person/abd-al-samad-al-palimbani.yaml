id: person/abd-al-samad-al-palimbani
class: person
label:
  ar: "عبد الصمد الفلمباني"
  en: "Abd al-Samad al-Palimbani"
  fr: "Abd al-Samad al-Palimbani"
  ur: "عبد الصمد پالمبانی"
  es: "Abd al-Samad al-Palimbani"
summary:
  ar: "عبد الصمد الفلمباني، عالم من باليمبانغ بجزيرة سومطرة، عاش معظم عمره في الحجاز، ألّف بالعربية والملايوية، وترجم إحياء علوم الدين للغزالي إلى الملايوية تحت عنوان سير السالكين، وكان من تلاميذ مؤسس الطريقة السمانية. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  en: "Abd al-Samad al-Palimbani, a religious teacher from Palembang in Sumatra who lived mostly in Arabia, wrote in Arabic and Malay, and translated al-Ghazali's Lubab Ihya' 'Ulum al-Din into Malay as Siyar al-Salikin. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  fr: "Abd al-Samad al-Palimbani, maître religieux de Palembang à Sumatra qui vécut surtout en Arabie, écrivit en arabe et en malais, et traduisit en malais le Lubab Ihya' 'Ulum al-Din d'al-Ghazali sous le titre Siyar al-Salikin. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  ur: "عبدالصمد پالمبانی، پالمبانگ ⁦(سماٹرا)⁩ کے ایک دینی استاد جو زیادہ تر عرب میں رہے، عربی اور ملائی میں لکھتے تھے، اور غزالی کی لباب احیاء علوم الدین کا ملائی ترجمہ سیر السالکین کے نام سے کیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  es: "Abd al-Samad al-Palimbani, un maestro religioso de Palembang, en Sumatra, que vivió principalmente en Arabia, escribió en árabe y malayo, y tradujo la obra de al-Ghazali, Lubab Ihya' 'Ulum al-Din, al malayo con el título de Siyar al-Salikin. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  tr: "Sumatra adasındaki Palembang'dan bir âlim olan Abdülsamed el-Falambani, hayatının büyük bölümünü Hicaz'da geçirdi. Arapça ve Malayca yazdı ve Gazali'nin İhya Ulum el-Din adlı eserini Siyar el-Salikin başlığıyla Malaycaya çevirdi. Samaniyye Sufi tarikatının kurucusunun öğrencisiydi. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
  id: "Abd al-Samad al-Falambani, seorang ulama dari Palembang di pulau Sumatra, menghabiskan sebagian besar hidupnya di Hijaz. Ia menulis dalam bahasa Arab dan Melayu, dan menerjemahkan Ihya Ulum al-Din karya al-Ghazali ke dalam bahasa Melayu dengan judul Siyar al-Salikin. Ia adalah murid dari pendiri tarekat Sufi Samaniyya. {cite:encyclopaedia-of-islam-2 vol. 1 p. 111}"
