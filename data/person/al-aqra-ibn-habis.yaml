summary:
  en: "A paramount chieftain and arbitrator of Banu Tamim in Najd; given one hundred camels at al-Ji'rana among al-Mu'allafa Qulubuhum, he witnessed the conquest of Mecca, Hunayn and al-Ta'if with the Prophet, came with the Tamim delegation in 9 AH and pronounced that the Muslims' orator and poet surpassed Tamim's, after which the delegation accepted Islam; he later took part in the early conquests."
  fr: "Grand chef et arbitre des Banu Tamim au Najd ; il reçut cent chameaux à al-Ji’rana parmi les al-Mu’allafa Qulubuhum, assista avec le Prophète à la conquête de La Mecque, à Hunayn et à al-Ta’if, vint avec la délégation des Tamim en 9 H et déclara que l’orateur et le poète des musulmans surpassaient ceux des Tamim, après quoi la délégation accepta l’islam ; il participa ensuite aux premières conquêtes."
  ar: "سيد بني تميم وحَكَمُهم في الجاهلية؛ أعطاه النبي مئة بعير بالجعرانة في سهم المؤلفة قلوبهم، وشهد معه فتح مكة وحنيناً والطائف، ثم جاء مع وفد بني تميم سنة 9هـ وحكم أن خطيب المسلمين أخطب من خطيبهم وشاعرهم أشعر من شاعرهم فأسلم الوفد؛ وشهد الفتوح الإسلامية."
  ur: "بنو تمیم کے سردار اور ثالث؛ فتح مکہ، حنین اور طائف میں شریک ہوئے، جعرانہ میں سو اونٹ پائے اور بنو تمیم کے وفد کے ساتھ آئے۔ {cite:ibn-hisham-saqqa}"
  es: "Jefe supremo y árbitro de Banu Tamim en Najd; recibió cien camellos en al-Ji'rana entre al-Mu'allafa Qulubuhum, presenció la conquista de La Meca, Hunayn y al-Ta'if con el Profeta, llegó con la delegación de Tamim en el año 9 de la Hégira y declaró que el orador y poeta de los musulmanes superaba al de Tamim, tras lo cual la delegación aceptó el Islam; posteriormente participó en las primeras conquistas."
  tr: "İslam öncesi dönemde Beni Tamim'in lideri ve kadısıydı; Peygamber ona Ciranah'ta, kalpleri kazanılacak olanların payına yüz deve verdi ve onunla birlikte Mekke, Huneyn ve Taif'in fethine şahit oldu. Daha sonra Hicri 9. yılda Beni Tamim heyetiyle birlikte geldi ve Müslümanların hatibinin onların hatibinden daha güzel konuştuğuna ve şairinin onların şairinden daha şiirsel olduğuna hükmetti, böylece heyet İslam'ı kabul etti; ve İslam fetihlerine şahit oldu."
  id: "Pemimpin Bani Tamim dan hakim mereka di era pra-Islam; Nabi memberinya seratus unta di Al-Ji'ranah sebagai bagian dari orang-orang yang hatinya akan dimenangkan, dan dia menyaksikan bersamanya penaklukan Mekah, Hunayn, dan Ta'if, kemudian dia datang dengan delegasi Bani Tamim pada tahun 9 Hijriah dan dia menilai bahwa orator kaum Muslim lebih fasih daripada orator mereka dan penyair mereka lebih puitis daripada penyair mereka, sehingga delegasi tersebut masuk Islam; dan dia menyaksikan penaklukan Islam."
