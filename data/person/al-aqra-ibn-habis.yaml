summary:
  en: "A paramount chieftain and arbitrator of Banu Tamim in Najd; given one hundred camels at al-Ji'rana among al-Mu'allafa Qulubuhum, he witnessed the conquest of Mecca, Hunayn and al-Ta'if with the Prophet, came with the Tamim delegation in 9 AH and pronounced that the Muslims' orator and poet surpassed Tamim's, after which the delegation accepted Islam; he later took part in the early conquests."
  ar: "سيد بني تميم وحَكَمُهم في الجاهلية؛ أعطاه النبي مئة بعير بالجعرانة في سهم المؤلفة قلوبهم، وشهد معه فتح مكة وحنيناً والطائف، ثم جاء مع وفد بني تميم سنة 9هـ وحكم أن خطيب المسلمين أخطب من خطيبهم وشاعرهم أشعر من شاعرهم فأسلم الوفد؛ وشهد الفتوح الإسلامية."
