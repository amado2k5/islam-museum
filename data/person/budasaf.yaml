label: { ar: "بوداسف", en: "Budasaf" }
summary:
  ar: "بوداسف أول من أظهر مذاهب الصابئة على قول المسعودي، خرج هندياً من أرض الهند إلى السند ثم سجستان وزابلستان بلاد فيروز بن كبك ثم كرمان فتنبأ وزعم أنه رسول الله وواسطة بينه وبين خلقه وأتى أرض فارس في أوائل ملك طهمورث وقيل في ملك جم، أمر الناس بالزهد في هذا العالم والاشتغال بما علا من العوالم إذ من هنالك بدء النفوس، وجدد عبادة الأصنام والسجود لها بضروب من الحيل، وقرأ بعض أهل الرواية على باب النوبهار ببلخ كتاباً بالفارسية قال بوداسف أبواب الملوك تحتاج إلى ثلاث خصال عقل وصبر ومال وتحته بالعربية كذب بوداسف الواجب على الحر إذا كان معه واحدة من هذه الثلاث ألا يلزم باب السلطان {cite:muruj-al-dhahab p. 537-539}. وعند ابن النديم نبي السمنية بوداسف وعلى مذهبه كان أكثر أهل ما وراء النهر قبل الإسلام {cite:fihrist-ibn-al-nadim p. 484}"
  en: "Budasaf — first to display the Sabian way, in al-Mas'udi's account: the Indian who crossed Sind, Sijistan, Zabulistan and Kirman claiming prophethood under Tahmurath or Jam, preaching renunciation and the soul's descent from above, and renewing idol-worship by stratagem; his Persian maxim on kings' doors needing wit, patience and wealth stood inscribed at Balkh's Nawbahar with an Arabic retort beneath {cite:muruj-al-dhahab p. 537-539}."
