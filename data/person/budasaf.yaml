summary:
  ar: "بوداسف أول من أظهر مذاهب الصابئة على قول المسعودي، خرج هندياً من أرض الهند إلى السند ثم سجستان وزابلستان بلاد فيروز بن كبك ثم كرمان فتنبأ وزعم أنه رسول الله وواسطة بينه وبين خلقه وأتى أرض فارس في أوائل ملك طهمورث وقيل في ملك جم، أمر الناس بالزهد في هذا العالم والاشتغال بما علا من العوالم إذ من هنالك بدء النفوس، وجدد عبادة الأصنام والسجود لها بضروب من الحيل، وقرأ بعض أهل الرواية على باب النوبهار ببلخ كتاباً بالفارسية قال بوداسف أبواب الملوك تحتاج إلى ثلاث خصال عقل وصبر ومال وتحته بالعربية كذب بوداسف الواجب على الحر إذا كان معه واحدة من هذه الثلاث ألا يلزم باب السلطان {cite:muruj-al-dhahab p. 537-539}. وعند ابن النديم نبي السمنية بوداسف وعلى مذهبه كان أكثر أهل ما وراء النهر قبل الإسلام {cite:fihrist-ibn-al-nadim p. 484}"
  en: "Budasaf — first to display the Sabian way, in al-Mas'udi's account: the Indian who crossed Sind, Sijistan, Zabulistan and Kirman claiming prophethood under Tahmurath or Jam, preaching renunciation and the soul's descent from above, and renewing idol-worship by stratagem; his Persian maxim on kings' doors needing wit, patience and wealth stood inscribed at Balkh's Nawbahar with an Arabic retort beneath {cite:muruj-al-dhahab p. 537-539}."
  es: "Budasaf — el primero en mostrar el camino sabeo, según el relato de al-Mas'udi: el indio que cruzó Sind, Sijistan, Zabulistán y Kirman reclamando la profecía bajo Tahmurath o Jam, predicando la renuncia y el descenso del alma desde lo alto, y renovando la idolatría mediante estratagemas; su máxima persa sobre las puertas de los reyes que necesitaban ingenio, paciencia y riqueza estaba inscrita en el Nawbahar de Balkh con una réplica árabe debajo {cite:muruj-al-dhahab p. 537-539}."
  fr: "Budasaf – le premier à afficher la voie sabéenne, selon le récit d'al-Mas'udi: l'Indien qui traversa le Sind, le Sijistan, le Zabulistan et le Kirman en prétendant être prophète sous Tahmurath ou Jam, prêchant le renoncement et la descente de l'âme d'en haut, et renouvelant le culte des idoles par stratagème; sa maxime persane sur les portes des rois nécessitant esprit, patience et richesse était inscrite à Nawbahar de Balkh avec une réplique arabe en dessous {cite:muruj-al-dhahab p. 537-539}."
  ur: "Budasaf - سب سے پہلے صابیائی طریقے کو ظاہر کرنے کے لیے، المسعودی کے اکاؤنٹ میں: وہ ہندوستانی جو سندھ، سجستان، زابلستان اور کرمان کو عبور کر کے تہمورتھ یا جام کے تحت نبوت کا دعویٰ کرتے ہوئے، ترک کرنے اور اوپر سے روح کے نزول کی تبلیغ کرتے ہیں، اور بت پرستی کی تجدید کرتے ہیں۔ بادشاہوں کے دروازوں پر عقل، صبر اور دولت کی ضرورت کے لیے اس کا فارسی کلام بلخ کے نوبہار میں عربی جواب کے ساتھ کندہ تھا {حوالہ: مروج الذہب ص۔ 537-539}۔"
