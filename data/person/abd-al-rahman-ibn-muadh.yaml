label:
  ar: عبد الرحمن بن معاذ
  en: Abd al-Rahman ibn Muadh (Companion)
  ur: عبدالرحمن بن معاذ (صحابی)
summary:
  ar: 'عبد الرحمن بن معاذ بن عثمان بن عمرو بن كعب بن سعد القرشي التيمي، قال البخاري
    وغيره إن له صحبة، ورُوي عنه حديث خطبة النبي بمنى، وعدّه ابن سعد فيمن شهد الفتح.
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7520} '
  en: 'Abd al-Rahman ibn Muadh ibn Uthman ibn Amr ibn Kab, of the Quraysh (Taym);
    al-Bukhari and others say he was a Companion. A report from him describes the
    Prophet''s address at Mina, and Ibn Sa''d counts him among those who witnessed
    the conquest of Mecca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7520} '
  ur: 'عبدالرحمن بن معاذ بن عثمان بن عمرو بن کعب، قریشی تیمی؛ بخاری وغیرہ نے ان کا
    صحابی ہونا بیان کیا ہے، اور ان سے منیٰ میں نبی کے خطبے کی روایت منقول ہے، اور
    ابن سعد نے انہیں فتح مکہ میں حاضر ہونے والوں میں شمار کیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7520} '
