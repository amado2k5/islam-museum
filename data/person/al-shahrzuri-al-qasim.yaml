class: person
label: { ar: "القاسم الشهرزوري", en: "al-Qasim al-Shahrzuri", fr: "al-Qasim al-Shahrzuri", es: "al-Qasim al-Shahrzuri", ur: "القاسم الشھرزوری" }
summary:
  ar: "أبو أحمد القاسم بن المظفر بن علي بن القاسم الشهرزوري؛ والد قاضي الخافقين أبي بكر محمد والمرتضى أبي محمد عبد الله وأبي منصور المظفر، وهو جد بيت الشهرزوري قضاة الشام والموصل والجزيرة وكلهم إليه ينتسبون؛ كان حاكماً بمدينة إربل مدة وبمدينة سنجار مدة؛ فأما أولاده وأحفاده فعلماء نجباء كرماء ولوا المراتب العلية وتقدموا عند الملوك وتولوا القضاء ونفقت أسواقهم خصوصاً حفيده القاضي كمال الدين محمد ومحيي الدين بن كمال الدين؛ قدم بغداد غير مرة وذكره السمعاني في الذيل والأنساب وذكره أبو البركات ابن المستوفي في تاريخ إربل وأورد له شعراً؛ توفي بالموصل ودفن في التربة المعروفة به المجاورة لمسجد جده أبي الحسن بن فرغان {cite:wafayat-ayan}."
  en: "Abu Ahmad al-Qasim al-Shahrzuri — patriarch of the Shahrzuri house, the family that produced the qadis of Damascus, Mosul and the Jazira; judged at Irbil and Sinjar; father of Qadi al-Khafiqayn and grandfather of Kamal al-Din Muhammad; died at Mosul {cite:wafayat-ayan}."
  fr: "Abu Ahmad al-Qasim al-Shahrzuri – patriarche de la maison Shahrzuri, la famille qui a produit les qadis de Damas, Mossoul et la Jazira ; jugé à Irbil et Sinjar ; père de Qadi al-Khafiqayn et grand-père de Kamal al-Din Muhammad ; décédé à Mossoul {cite:wafayat-ayan}."
  es: "Abu Ahmad al-Qasim al-Shahrzuri — patriarca de la casa Shahrzuri, la familia que produjo a los cadíes de Damasco, Mosul y Jazira; juez en Irbil y Sinjar; padre del cadí al-Khafiqayn y abuelo de Kamal al-Din Muhammad; murió en Mosul {cite:wafayat-ayan}."
  ur: "ابو احمد القاسم ال شہرزوری — شہرزوری گھر کے سرپرست، وہ خاندان جس نے دمشق، موصل اور جزیرہ کی قادیاں تیار کیں۔ اربیل اور سنجار میں فیصلہ قادی الخفیقین کے والد اور کمال الدین محمد کے دادا؛ موصل میں وفات پائی۔"
  tr: "Ebu Ahmed el-Kasım ibn el-Muzaffar ibn Ali bin el-Kasim el-Şahrazuri; Hafiqin yargıcı Ebu Bekir Muhammed, el-Murtada Ebu Muhammed Abdullah ve Ebu Mansur el-Muzaffer'in babasıdır. El-Şehrezuri'nin ailesinin atasıdır; Şam, Musul ve Cezire yargıçlarıdır ve hepsi soylarını ona dayandırır. Bir süre Erbil şehrinde, bir süre ise Sincar şehrinde hükümdarlık yapmıştır. Oğulları ve torunları ise soylu, soylu ve cömert alimlerdi, yüksek rütbelere sahipti, kralların huzurunda yükseldi, yargıçlık yaptı ve pazarlarını harcadı; özellikle torunları Hakim Kamaleddin Muhammed ve Muhyiddin ibn Kamal al-Din. Bağdat'ı birden fazla kez ziyaret etti, el-Sam'ani onu soyağaçlarında andı, Ebu el-Barakat bin el-Mustavfi ise Erbil tarihinde onu anmış ve şiirlerden alıntı yapmıştır. Musul'da öldü ve büyükbabası Ebu el-Hasan bin Farghan'ın camisinin bitişiğindeki ünlü mezarlığa defnedildi {alıntı: Wafayat-ayan}."
  id: "Abu Ahmad al-Qasim ibn al-Muzaffar ibn Ali ibn al-Qasim al-Shahrazuri; ayah dari hakim Khafiqin Abu Bakr Muhammad, al-Murtada Abu Muhammad Abdullah, dan Abu Mansur al-Muzaffar. Ia adalah leluhur keluarga al-Shahrazuri, hakim Levant, Mosul, dan Jazira, yang semuanya menelusuri garis keturunan mereka kepadanya. Ia pernah menjadi penguasa di kota Erbil untuk sementara waktu dan di kota Sinjar untuk beberapa waktu. Adapun putra dan cucunya, mereka adalah bangsawan, ulama yang mulia dan murah hati, memegang pangkat tinggi, naik pangkat di hadapan raja, menjadi hakim, dan menghabiskan pasar mereka, terutama cucu-cucunya, Hakim Kamal al-Din Muhammad dan Muhyiddin ibn Kamal al-Din. Ia mengunjungi Baghdad lebih dari sekali, dan al-Sam'ani menyebutkannya dalam silsilahnya, dan Abu al-Barakat ibn al-Mustawfi menyebutnya dalam sejarah Erbil dan mengutip puisi untuknya. Ia meninggal di Mosul dan dimakamkan di pemakaman terkenal yang bersebelahan dengan masjid kakeknya Abu al-Hasan ibn Farghan {cite:Wafayat-Ayan}."
