label: { ar: "القاسم الشهرزوري", en: "al-Qasim al-Shahrzuri" }
summary:
  ar: "أبو أحمد القاسم بن المظفر بن علي بن القاسم الشهرزوري؛ والد قاضي الخافقين أبي بكر محمد والمرتضى أبي محمد عبد الله وأبي منصور المظفر، وهو جد بيت الشهرزوري قضاة الشام والموصل والجزيرة وكلهم إليه ينتسبون؛ كان حاكماً بمدينة إربل مدة وبمدينة سنجار مدة؛ فأما أولاده وأحفاده فعلماء نجباء كرماء ولوا المراتب العلية وتقدموا عند الملوك وتولوا القضاء ونفقت أسواقهم خصوصاً حفيده القاضي كمال الدين محمد ومحيي الدين بن كمال الدين؛ قدم بغداد غير مرة وذكره السمعاني في الذيل والأنساب وذكره أبو البركات ابن المستوفي في تاريخ إربل وأورد له شعراً؛ توفي بالموصل ودفن في التربة المعروفة به المجاورة لمسجد جده أبي الحسن بن فرغان {cite:wafayat-ayan}."
  en: "Abu Ahmad al-Qasim al-Shahrzuri — patriarch of the Shahrzuri house, the family that produced the qadis of Damascus, Mosul and the Jazira; judged at Irbil and Sinjar; father of Qadi al-Khafiqayn and grandfather of Kamal al-Din Muhammad; died at Mosul {cite:wafayat-ayan}."
