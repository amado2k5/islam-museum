label:
  ar: "جلال الدين الدواني"
  en: "Jalal al-Din Davani"
  es: "Jalal al-Din Davani"
  fr: "Jalal al-Din Davani"
  ur: "جلال الدین داوانی"
roles: [philosopher]
gender: male
summary:
  ar: "محمد بن أسعد الصديقي الدواني، جلال الدين، قاض وباحث يعد من الفلاسفة، ولد في دوان من بلاد كازرون وسكن شيراز وولي قضاء فارس وتوفي بها سنة 918 هـ، من كتبه أنموذج العلوم وإثبات الواجب وحاشية على شرح القوشجي لتجريد الكلام وشرح العقائد العضدية."
  en: "Muhammad ibn As'ad al-Siddiqi al-Dawwani, Jalal al-Din, a judge and scholar counted among the philosophers; born at Dawan in the land of Kazarun, he settled in Shiraz, became judge of Fars and died there in 918 AH (1512); his works include Unmudhaj al-Ulum, Ithbat al-Wajib, a gloss on al-Qushji's commentary on the Tajrid al-Kalam and a commentary on the Adudiyya creed."
  es: "Muhammad ibn As'ad al-Siddiqi al-Dawwani, Jalal al-Din, juez y erudito contado entre los filósofos; nacido en Dawan en la tierra de Kazarun, se estableció en Shiraz, se convirtió en juez de Fars y murió allí en 918 d. H. (1512); sus obras incluyen Unmudhaj al-Ulum, Ithbat al-Wajib, una glosa del comentario de al-Qushji sobre el Tajrid al-Kalam y un comentario sobre el credo Adudiyya."
  fr: "Muhammad ibn As'ad al-Siddiqi al-Dawwani, Jalal al-Din, juge et érudit compté parmi les philosophes; né à Dawan au pays de Kazarun, il s'installa à Chiraz, devint juge du Fars et y mourut en 918 AH (1512); ses œuvres comprennent Unmudhaj al-Ulum, Ithbat al-Wajib, une glose sur le commentaire d'al-Qushji sur le Tajrid al-Kalam et un commentaire sur le credo Adudiyya."
  ur: "محمد بن اسد الصدیقی الدونی، جلال الدین، ایک جج اور عالم فلسفیوں میں شمار ہوتے ہیں۔ سرزمین کازارون کے داوان میں پیدا ہوئے، شیراز میں سکونت اختیار کی، فارس کے قاضی بنے اور وہیں 918ھ (1512) میں وفات پائی۔ ان کی تصانیف میں انمدج العلوم، اثبات الوجیب، القشجی کی تجرید الکلام پر تفسیر اور عدویہ عقیدہ کی تفسیر شامل ہیں۔"
  tr: "Muhammed ibn As'ad al-Siddiqi al-Dawani, Celal-Din, filozoflardan biri olarak kabul edilen bir yargıç ve araştırmacıydı. Kazeroon'daki Duwan'da doğdu, Şiraz'a yerleşti ve Fars yargıcı olarak atandı. 918 Hicri yılında orada öldü. Eserleri arasında 'Bilimlerin Modeli', 'İtbat el-Vacib' ve 'El-Kuşci'nin konuşmanın soyutlanmasına dair şerhi üzerine kenar marjina' ve 'Şerh al-'Aqa'id al-'Adadiyya yer alır."
  id: "Muhammad ibn As'ad al-Siddiqi al-Dawani, Jalal al-Din, adalah seorang hakim dan peneliti yang dianggap sebagai salah satu filsuf. Ia lahir di Duwan, Kazeroon, menetap di Shiraz, dan diangkat menjadi hakim Fars. Ia meninggal di sana pada tahun 918 H. Di antara karyanya adalah 'Model Ilmu Pengetahuan,' 'Ithbat al-Wajib,' dan 'Marginalia tentang komentar al-Qushji tentang abstraksi ucapan' serta 'Sharh al-'Aqa'id al-'Adadiyya."
