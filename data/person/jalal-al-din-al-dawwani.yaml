summary:
  ar: "محمد بن أسعد الصديقي الدواني، جلال الدين، قاض وباحث يعد من الفلاسفة، ولد في دوان من بلاد كازرون وسكن شيراز وولي قضاء فارس وتوفي بها سنة 918 هـ، من كتبه أنموذج العلوم وإثبات الواجب وحاشية على شرح القوشجي لتجريد الكلام وشرح العقائد العضدية."
  en: "Muhammad ibn As'ad al-Siddiqi al-Dawwani, Jalal al-Din, a judge and scholar counted among the philosophers; born at Dawan in the land of Kazarun, he settled in Shiraz, became judge of Fars and died there in 918 AH (1512); his works include Unmudhaj al-Ulum, Ithbat al-Wajib, a gloss on al-Qushji's commentary on the Tajrid al-Kalam and a commentary on the Adudiyya creed."
