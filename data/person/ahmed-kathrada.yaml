summary:
  ar: مناضل وسياسي جنوب أفريقي ضد الأبارتايد، حوكم في محاكمة ريفونيا سنة 1964 وقضى 26 سنة في السجن منها 18 في جزيرة روبن إلى جانب نيلسون مانديلا، ثم أصبح نائبًا ومستشارًا برلمانيًا للرئيس مانديلا، وأسس مؤسسة أحمد كاثرادا سنة 2008.
  en: South African anti-apartheid activist and politician who was convicted in the 1964 Rivonia Trial and spent 26 years in prison, 18 of them on Robben Island alongside Nelson Mandela, then served as an MP and as parliamentary counsellor to President Mandela, and founded the Ahmed Kathrada Foundation in 2008.
  ur: جنوبی افریقی اپارتھائیڈ مخالف کارکن اور سیاست دان جنہیں 1964 کے ریوونیا مقدمے میں سزا ہوئی اور جنہوں نے 26 سال قید میں گزارے، جن میں سے 18 سال روبن جزیرے پر نیلسن منڈیلا کے ساتھ تھے؛ بعد میں وہ رکن پارلیمنٹ اور صدر منڈیلا کے پارلیمانی مشیر رہے۔
