  note: "Executed at Istanbul, strangled in the palace woodshed on Bayram Pasha's order and his body thrown into the sea, as Kâtib Çelebi's Fezleke and Naîmâ report in the TDV entry's account. The Turkish and Persian articles give the day as 27 January 1635 and the TDV entry holds that the chronogram verses confirm Sha'ban 1044, January 1635, against other dates in the sources; the English article gives the year only, the Arabic article gives 1636 against the 1044 pairing, and some biographical sources give 1045 AH instead — all readings preserved here."
