faith:
  - value: sunni-maliki
    basis: self-identified
    note: >-
      His own words, in the quatrain answering Tahir Efendi, who had
      called him a dog (kelp) — "Maliki mezhebim benim zira,
      itikadımca kelp tahirdir", my madhhab is Maliki, for in my
      belief the dog is tahir, pure — a pun on Tahir and pure on
      which he successfully defended himself when tried for the
      verse. The quatrain is quoted in the prose of two independent
      texts, the English article, which translates the line as "For
      my sect is Maliki", and the Turkish article, which glosses
      its first sense as Nef'i being a member of the Maliki
      madhhab. Self-identification quoted in two independent
      sources settles the value at basis self-identified under the
      founder's rule, on the Kâtip Çelebi precedent. The TDV entry
      confirms the exchange with Tâhir Efendi stands in his
      Sihâm-ı Kazâ. Şeyhülislam Yahya's joking quatrain calling
      him kâfir, and his famous reply, are literary sparring
      between poets and attest nothing either way, and the TDV
      entry's signs of Mevlevi sympathy fall short of attested
      order membership and are not relied on.
    sources: [source/wikipedia-nef-i-en, source/wikipedia-nef-i-tr, source/dia-nefi]

