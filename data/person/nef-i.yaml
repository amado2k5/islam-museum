summary:
  ar: "عمر بن محمد، المعروف باسمه القلمي نفعي (نحو 1572 – 27 كانون الثاني 1635)، شاعر ديوان عثماني من حسن قلعة (باسينلر) من أعمال أرضروم، حفيد ميرزا علي والي باسينلر وابن محمد بك والي صاري قامش. جاء إلى إسطنبول في عهد أحمد الأول وتقلّد وظائف مالية منها مفتشية المناجم، وبلغ ذروته في عهد مراد الرابع الذي قرّبه لمدائحه. جمع هجاءه اللاذع في «سهام قضا» فصار أخوف شعراء الهجاء في عصره، وبسبب هجائه بيرم باشا خُنق في حطبخانة القصر وأُلقي جسده في البحر."
  en: "Ömer, known by his pen name Nef'i (c. 1572 – 27 January 1635), was an Ottoman divan poet from Hasankale (Pasinler) in the Erzurum province, grandson of Mirza Ali, governor of Pasinler, and son of Mehmed Bey, governor of Sarıkamış. He came to Istanbul in the reign of Ahmed I, held finance posts including the comptrollership of mines, and reached his height under Murad IV, whose favour his qasidas won. His satires, gathered in the Sihâm-ı Kazâ, made him the most feared satirist of the age; after a satire on Bayram Pasha he was strangled in the palace woodshed and his body thrown into the sea."
  ur: "عمر بن محمد، اپنے قلمی نام نفعی سے مشہور (تقریباً 1572ء – 27 جنوری 1635ء)، ارضروم کے علاقے حسن قلعہ (پاسینلر) سے تعلق رکھنے والے عثمانی دیوان شاعر تھے، پاسینلر کے والی میر زا علی کے پوتے اور صاری قامش کے والی محمد بے کے بیٹے۔ احمد اول کے عہد میں استنبول آئے، کانوں کی نگرانی سمیت مالی عہدے سنبھالے، اور مراد رابع کے عہد میں اپنے قصیدوں سے سلطان کی قربت حاصل کر کے عروج پایا۔ ان کا ہجو مجموعہ «سہامِ قضا» انہیں اپنے عہد کا سب سے خوفناک ہجو گو بنا گیا؛ بیرم پاشا پر ہجو کی وجہ سے انہیں قصر کی لکڑی خانے میں گلا گھونٹ کر ہلاک کیا گیا اور لاش سمندر میں پھینک دی گئی۔"

