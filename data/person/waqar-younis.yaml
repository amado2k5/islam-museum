summary:
  ar: "لاعب كريكت باكستاني سابق ومدرب ومعلّق وقائد سابق لمنتخب باكستان، وُلد في وهري بالبنجاب سنة 1971 لأسرة بنجابية. رامٍ سريع بالذراع اليمنى اشتهر بالتأرجح العكسي وبكرات اليوركر الساحقة للأصابع، لعب لباكستان بين 1989 و2003 في 87 مباراة اختبار أخذ فيها 373 ويكيت و262 مباراة ليوم واحد أخذ فيها 416 ويكيت فكان أصغر رامٍ يبلغ 400 ويكيت في مباريات اليوم الواحد، وشكّل مع وسيم أكرم أحد أخطر هجمات الرمي في العالم، ولعب لسري وغلامورغان في إنجلترا وويلز وفاز مع غلامورغان ببطولة المقاطعات سنة 1997، وقاد باكستان وهو أصغر قائد اختبار باكستاني، ثم درّب منتخب باكستان مدربا للرمي ومدربا رئيسا في فترات متعددة."
  en: "Pakistani former cricketer, coach and commentator and former captain of the Pakistan national team, born in Vehari, Punjab, in 1971 to a Punjabi family. A right-arm fast bowler famed for reverse swing and toe-crushing yorkers, he played for Pakistan from 1989 to 2003, taking 373 wickets in 87 Tests and 416 wickets in 262 One Day Internationals — the youngest bowler to reach 400 ODI wickets — formed one of the world's most feared bowling attacks with Wasim Akram, played for Surrey and Glamorgan in England and Wales and won the County Championship with Glamorgan in 1997, captained Pakistan as its youngest Test captain, and later coached Pakistan as bowling coach and head coach in several spells."
  ur: "پاکستان کے سابق کرکٹ کھلاڑی، کوچ اور مبصر اور قومی ٹیم کے سابق کپتان، جو 1971 میں وہاڑی، پنجاب میں ایک پنجابی خاندان میں پیدا ہوئے۔ دائیں ہاتھ کے تیز گیند باز، جو ریورس سوئنگ اور انگلیاں کچلنے والے یارکرز کے لیے مشہور ہیں، انھوں نے 1989ء سے 2003ء تک پاکستان کے لیے کھیلا، 87 ٹیسٹ میچوں میں 373 وکٹیں اور 262 ایک روزہ میچوں میں 416 وکٹیں لیں — ایک روزہ کرکٹ میں 400 وکٹیں مکمل کرنے والے سب سے کم عمر گیند باز — وسیم اکرم کے ساتھ دنیا کے خوفناک ترین گیند بازی حملوں میں سے ایک تشکیل دیا، انگلینڈ اور ویلز میں سرے اور گلیمورگن کے لیے کھیلے اور 1997 میں گلیمورگن کے ساتھ کاؤنٹی چیمپئن شپ جیتی، پاکستان کے کم عمر ترین ٹیسٹ کپتان کی حیثیت سے قیادت کی، اور بعد میں کئی ادوار میں پاکستان کے باؤلنگ کوچ اور ہیڈ کوچ رہے۔"
