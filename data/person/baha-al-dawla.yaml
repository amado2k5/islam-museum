id: person/baha-al-dawla
class: person
label: { ar: "بهاء الدولة أبو نصر بن عضد الدولة" , ur: "بہاء الدولہ", en: "Baha al-Dawla", es: "Baha al-Dawla", fr: "Baha al-Dawla"}
summary:
  ar: "أبو نصر بن عضد الدولة، جاءه الطائع إلى دار المملكة يعزيه في أخيه شرف الدولة فقبل الأرض غير مرة ثم ركب إلى الطائع فخلع عليه سبع خلع أعلاها سوداء وعمامة سوداء وفي عنقه طوق كبير وفي يديه سواران ومشى الحجاب بين يديه بالسيوف ولقبه الطائع بهاء الدولة وضياء الملة، وقبض على الطائع سنة إحدى وثمانين فجذبه أصحابه من سريره ولفوه في كساء وكتب عليه كتاباً بخلع نفسه وتسليم الأمر إلى القادر {cite:tarikh-khulafa-minhaj-1434 p. 631-632}. وفي يوم الاثنين التاسع من ذي الحجة سنة اثنتين وتسعين ولد له ابناه التوأمان {cite:muntazam-ibn-al-jawzi j.7 p.219}، وفي سنة ثلاث وتسعين قبض على وزيره أبي غالب بن خلف وقرر عليه مائة ألف دينار قاسانية {cite:muntazam-ibn-al-jawzi j.7 p.222}."
  en: "Abu Nasr ibn Adud al-Dawla; on Sharaf al-Dawla's death al-Ta'i' came condoling, then invested him — seven robes, black turban, collar, bracelets, sword-bearers before him — as Baha' al-Dawla wa-Diya' al-Milla. In 381 his men dragged al-Ta'i' from the throne, wrapped him in a cloak and made him depose himself for al-Qadir {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  ur: "عضد الدولہ کا بیٹا اور بویہی حکمران؛ شرف الدولہ کی وفات کے بعد خلیفہ الطائع نے اسے خلعت اور بہاء الدولہ کا لقب دیا۔ {cite:tarikh-khulafa-minhaj-1434}"
  es: "Abu Nasr ibn Adud al-Dawla; tras la muerte de Sharaf al-Dawla, al-Ta'i' acudió a darle el pésame y luego lo invistió —siete túnicas, turbante negro, collar, brazaletes, con portadores de espadas delante de él— como Baha' al-Dawla wa-Diya' al-Milla. En 381, sus hombres arrastraron a al-Ta'i' del trono, lo envolvieron en una capa y lo obligaron a abdicar en favor de al-Qadir {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  fr: "Abou Nasr ibn Adud al-Dawla; à la mort de Sharaf al-Dawla, al-Ta'i' vint présenter ses condoléances, puis l'investit – sept robes, un turban noir, un collier, des bracelets, des porteurs d'épée devant lui – comme Baha' al-Dawla wa-Diya' al-Milla. En 381, ses hommes traînèrent al-Ta'i' hors du trône, l'enveloppèrent dans un manteau et le forcèrent à déposer pour al-Qadir {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  tr: "Ebu Nasr bin 'Adud el-Devle, kardeşi Şeraf el-Devle için başsağlığı dilemek üzere kraliyet sarayına geldi. Toprağı birkaç kez öptü, sonra el-Ta'i'ye bindi, orada yedi rupi, siyah bir üst ve siyah bir sarık, boynunda büyük bir tasma, ellerinde iki bilezik çıkardı ve başörtüsü kılıçlarla önüne taşındı. El-Ta'i'ye Baha' al-Dawla unvanı ve ulusun ışığı verildi. El-Ta'i seksen birinci yılda tutuklandı, bu yüzden yoldaşları onu yatağından çekip bir pelerin sardı ve üzerine kendisini görevden alındığını ilan eden bir mektup yazdı ve konuyu El-Kadir'e teslim etti {cite:Tarikh-Kulafa-minhaj-1434, s. 631-632}. Doksan iki yılın Dhu al-Hicjah'ın dokuzuncusu Pazartesi günü, ikiz oğulları dünyaya geldi {cite:Muntazam-ibn-al-jawzi J.7 s.219} ve doksan üçüncü yılda bakanı Abu Ghalib ibn Khalaf tutuklandı ve yüz bin Kasani dinarı cezasına çarptırıldı {cite:Muntazam-ibn-al-jawzi J.7 s.222}."
  id: "Abu Nasr ibn 'Adud al-Dawla datang ke istana kerajaan untuk menyampaikan belasungkawa kepada saudaranya Sharaf al-Dawla. Ia mencium tanah itu beberapa kali, lalu naik ke al-Ta'i', di mana ia melepas tujuh rupee, baju hitam dan sorban hitam, kerah besar di lehernya, dua gelang di tangan, dan hijab dibawa di hadapannya dengan pedang. Al-Ta'i diberi gelar Baha' al-Dawla dan cahaya bangsa. Al-Ta'i ditangkap pada tahun delapan puluh satu, sehingga teman-temannya menariknya dari tempat tidur, membungkusnya dengan jubah, dan menulis surat di atasnya menyatakan dirinya telah dipindahkan dan menyerahkan perkara itu kepada Al-Qadir {cite:Tarikh-Kulafa-minhaj-1434, hlm. 631-632}. Pada hari Senin, tanggal sembilan Dhu al-Hijjah di tahun sembilan puluh dua, putra kembarnya lahir darinya {cite:Muntazam-ibn-al-jawzi J.7 hlm.219}, dan pada tahun kesembilan puluh tiga, menterinya Abu Ghalib ibn Khalaf ditangkap dan dijatuhi hukuman seratus ribu dinar Qasanian {cite:Muntazam-ibn-al-jawzi J.7 hlm.222}."
