label: { ar: "بهاء الدولة أبو نصر بن عضد الدولة" }
summary:
  ar: "أبو نصر بن عضد الدولة، جاءه الطائع إلى دار المملكة يعزيه في أخيه شرف الدولة فقبل الأرض غير مرة ثم ركب إلى الطائع فخلع عليه سبع خلع أعلاها سوداء وعمامة سوداء وفي عنقه طوق كبير وفي يديه سواران ومشى الحجاب بين يديه بالسيوف ولقبه الطائع بهاء الدولة وضياء الملة، وقبض على الطائع سنة إحدى وثمانين فجذبه أصحابه من سريره ولفوه في كساء وكتب عليه كتاباً بخلع نفسه وتسليم الأمر إلى القادر {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  en: "Abu Nasr ibn Adud al-Dawla; on Sharaf al-Dawla's death al-Ta'i' came condoling, then invested him — seven robes, black turban, collar, bracelets, sword-bearers before him — as Baha' al-Dawla wa-Diya' al-Milla. In 381 his men dragged al-Ta'i' from the throne, wrapped him in a cloak and made him depose himself for al-Qadir {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
