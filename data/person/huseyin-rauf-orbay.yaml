summary:
  ar: "ضابط بحري ورجل دولة تركي من أصل أبخازي، ذاع صيته قائدًا للطراد حميدية في حروب البلقان فعُرف بـ«بطل حميدية»، وكان ناظر البحرية الذي وقّع هدنة مودروس سنة 1918، ثم رئيس حكومة أنقرة في حرب الاستقلال (1922–1923). حُوكم في قضية مؤامرة إزمير وحُكم عليه غيابيًا فقضى سنوات في المنفى، ثم أعيد اعتباره وعاد نائبًا وسفيرًا في لندن."
  en: "Turkish naval officer and statesman of Abkhaz origin who won fame as captain of the cruiser Hamidiye in the Balkan Wars — the 'Hero of Hamidiye' — signed the Armistice of Mudros as Minister of the Navy in 1918, and served as Prime Minister of the Ankara government during the War of Independence (1922–1923). Sentenced in absentia in the İzmir plot trial, he spent years in exile before his rehabilitation, returning as a deputy and ambassador to London."
  ur: "ابخاز نژاد ترک بحری افسر اور مدبر، جو بلقان جنگوں میں کروزر حمیدیہ کے کپتان کی حیثیت سے شہرت پا کر «حمیدیہ کے ہیرو» کہلائے، 1918 میں وزیرِ بحریہ کی حیثیت سے معاہدۂ مودروس پر دستخط کیے، اور جنگِ آزادی میں انقرہ حکومت کے وزیرِ اعظم رہے (1922–1923)۔ ازمیر سازش مقدمے میں غیر حاضری میں سزا پا کر برسوں جلاوطن رہے، پھر بحالی کے بعد رکنِ پارلیمان اور لندن میں سفیر بنے۔"
