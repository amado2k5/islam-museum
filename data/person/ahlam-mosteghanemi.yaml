summary:
  ar: "شاعرة وروائية جزائرية، وُلدت سنة 1953؛ أول امرأة جزائرية تنشر الشعر والرواية بالعربية، وروايتها «ذاكرة الجسد» ⁦(1993)⁩ من أكثر الروايات العربية مبيعًا وحائزة على وسام نجيب محفوظ للأدب."
  en: "Algerian poet and novelist, born in 1953; the first Algerian woman to publish poetry and fiction in Arabic. Her 1993 novel Memory of the Flesh is among the best-selling Arabic novels and won the Naguib Mahfouz Medal for Literature."
  fr: "Poétesse et romancière algérienne née en 1953, première Algérienne à publier poésie et fiction en arabe. Son roman Mémoires de la chair (1993), parmi les romans arabes les plus vendus, reçut la médaille Naguib-Mahfouz de littérature."
  ur: "الجزائری شاعرہ اور ناول نگار، 1953 میں پیدا ہوئیں؛ عربی میں شاعری اور افسانہ شائع کرنے والی پہلی الجزائری خاتون۔ ان کا 1993 کا ناول »ذاکرۃ الجسد« عربی کے مروّج ترین ناولوں میں سے ہے جس نے نجیب محفوظ میڈل فار لیٹرچر جیتا۔"
  es: "Poeta y novelista argelina, nacida en 1953; la primera mujer argelina en publicar poesía y narrativa en árabe. Su novela de 1993, Memoria de la carne, es una de las novelas árabes más vendidas y ganó la Medalla Naguib Mahfouz de Literatura."
  tr: "1953 doğumlu Cezayirli bir şair ve romancı; Arapça şiir ve roman yayınlayan ilk Cezayirli kadın olup, \"Bedenin Hafızası\" (1993) adlı romanı en çok satan Arapça romanlardan biridir ve Naguib Mahfouz Edebiyat Madalyası'nı kazanmıştır."
  id: "Seorang penyair dan novelis Aljazair, lahir pada tahun 1953; wanita Aljazair pertama yang menerbitkan puisi dan novel dalam bahasa Arab, dan novelnya \"Kenangan Tubuh\" (1993) adalah salah satu novel Arab terlaris dan telah memenangkan Medali Sastra Naguib Mahfouz."
