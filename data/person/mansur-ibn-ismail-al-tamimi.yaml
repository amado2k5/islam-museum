summary:
  ar: "أبو الحسن منصور بن إسماعيل التميمي المصري، كان أعمى، وأخذ الفقه عن أصحاب الشافعي وأصحاب أصحابه {cite:tabaqat-fuqaha-abbas-1981 p. 56}. وله مصنفات في المذهب منها «الواجب» و«المستعمل» و«المسافر» و«الهداية» {cite:tabaqat-fuqaha-abbas-1981 p. 56}."
  tr: "Ebu el-Hasan Mansur bin İsmail el-Tamimi el-Masri kördü ve el-Şafi'i ve onun sahabelerinin sahabelerinden fıkıh öğrendi {atıf:tabaqat-fuqaha-abbas-1981, s. 56}. Ayrıca okulda \"El-Vakib\", \"El-Mustamil\", \"El-Musafir\" ve \"El-Hidayah\" gibi eserler de yazdı {atıf:tabaqat-fuqaha-abbas-1981, s. 56}."
  id: "Abu al-Hasan Mansur ibn Ismail al-Tamimi al-Masri adalah seorang ahli hukum buta dan terpelajar dari para sahabat al-Shafi'i dan para sahabatnya {cite:tabaqat-fuqaha-abbas-1981, hlm. 56}. Ia juga menulis karya-karya di sekolah tersebut termasuk \"Al-Wajib,\" \"Al-Musafir,\" dan \"Al-Hidayah\" {cite:tabaqat-fuqaha-abbas-1981, hlm. 56}."
