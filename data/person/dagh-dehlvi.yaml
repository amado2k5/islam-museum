summary:
  ar: "شاعر غزل أردي من دلهي (1831–1905)، وُلد نواب ميرزا خان ونشأ في القلعة الحمراء، وتتلمذ على ذوق وغالب. قضى أربعًا وعشرين سنة في خدمة رامبور، ثم صار شاعر بلاط نظام حيدر آباد السادس وأستاذه. اشتهر بغزلياته العاطفية بلغة بسيطة نقية، وخلّف أربعة دواوين وآلاف الأبيات وتلاميذ كثرًا."
  en: "Delhi Urdu ghazal poet (1831–1905), born Nawab Mirza Khan and raised in the Red Fort, who took poetic counsel from Zauq and Ghalib. After twenty-four years of service at Rampur he became court poet and mentor to the sixth Nizam of Hyderabad. He is remembered for romantic ghazals in simple, chaste Urdu, four divans, some sixteen thousand couplets, and a wide circle of disciples."
  ur: "دہلی کے اردو غزل گو شاعر (1831ء–1905ء)، ولادتاً نواب مرزا خاں، قلعہ معلی میں پرورش پائی اور ذوق و غالب سے فیض حاصل کیا۔ چوبیس سال رام پور میں رہے، پھر نظامِ حیدر آباد کے درباری شاعر اور استاد بنے۔ سادہ و شستہ زبان کی عشقیہ غزل، چار دواوین اور ہزاروں اشعار اور بے شمار شاگرد ان کی پہچان ہیں۔"
