  note: "The year 1535 is common to the English article, the Persian article (which pairs it with 942 AH, the pairing recorded here) and Wikidata. The place is contested: the Persian article has him die in Shah Tahmasp's service and be buried at Tabriz in the Tomb of Two Kamals beside Kamal Khujandi — the account the Encyclopaedia Iranica also reports from the Safavid author Dust Muhammad — while the English article gives Herat as the place of death and the tomb beneath Koh-i Mukhtar at Herat, following Barry. Iranica prints a chronogram date of '935/1535-36', an internally inconsistent pairing (935 AH fell in 1528-29) that is not followed. Because the place of death is contested between Herat and Tabriz, no died_in or buried_in edge is written and both accounts are preserved here."
