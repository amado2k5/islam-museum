summary:
  ar: "كمال الدين بهزاد الهراتي (نحو 1450 – 1535)، أشهر مصوّري المنمنمات في العالم الإسلامي، يتيم تربّى عند الخطاط والمصوّر ميرك نقاش مدير مكتبة البلاط التيموري، فصار سنة 1486 رئيس ورش هراة الملكية في عهد السلطان حسين بايقرا ورعاية علي شير نوائي. بعد سقوط التيموريين انتقل إلى تبريز فترأس مكتبة الشاه طهماسب الصفوي وورشها حتى وفاته. بلغت المنمنمة الفارسية في أسلوبه ذروة نضجها، ومن أشهر أعماله المنسوبة إليه «إغواء يوسف» في «بوستان» سعدي (1488)."
  en: "Kamāl ud-Dīn Behzād of Herat (c. 1450 – 1535), the most famous miniature painter of the Islamic world. Orphaned young, he was raised and trained by the painter-calligrapher Mirak Naqqash, director of the Timurid royal library, and in 1486 became head of the royal ateliers of Herat under Sultan Husayn Bayqara and the patronage of Ali-Shir Nava'i. After the Timurid fall he moved to Tabriz and directed Shah Tahmasp's Safavid royal library and workshop until his death. Persian miniature painting reached its maturity in his style; his most celebrated attributed work is 'The Seduction of Yusuf' in Sa'di's Bustan of 1488."
  ur: "کمال الدین بہزاد ہراتی (تقریباً 1450ء – 1535ء)، عالمِ اسلام کے مشہور ترین مصورِ منمنمات۔ یتیمی میں خطاط و مصور میرک نقاش، مدیرِ کتب خانۂ تیموری، کے ہاں پرورش پائی اور 1486ء میں سلطان حسین بایقرا کے عہد میں علی شیر نوائی کی سرپرستی میں ہرات کی شاہی کارگاہوں کے سربراہ بنے۔ تیموری زوال کے بعد تبریز جا کر شاہ طہماسپ صفوی کے شاہی کتب خانے اور کارگاہ کی تادمِ مرگ نگرانی کی۔ فارسی منمنمہ نگاری ان کے اسلوب میں اپنے عروج کو پہنچی؛ ان کی مشہور ترین منسوب تخلیق سعدی کے «بوستان» (1488ء) کی «اغوائے یوسف» ہے۔"

