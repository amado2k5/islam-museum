  note: "No author gives his birth date — the Encyclopaedia Iranica states plainly that it is unknown — and every figure in the sources is an estimate. The Arabic article gives about 854 AH/about 1450, and Wikidata gives 1450; the English article's infobox gives between 1455 and 1460 (its short description says about 1455/1460); the Persian article gives a range of 855-865 AH; and Michael Barry's monograph argues a life of 1465-1535. The founder's queue lists 1450, which follows the Arabic pairing, and that pairing (854 AH = 1450-51) is recorded as the Hijri year; the whole spread of estimates is preserved here."
