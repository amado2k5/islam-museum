summary:
  ar: "زينب بنت أحمد بن عبد الرحيم المقدسية، المعروفة ببنت الكمال ⁦(646–740هـ)⁩، محدثة جليلة بدمشق، سمعت من محمد بن عبد الهادي وغيره وأجاز لها جمع كبير من الشيوخ، وقُرئت عليها كتب وأجزاء كثيرة، وسمع منها الرحالة ابن بطوطة بجامع بني أمية."
  en: "Zaynab bint Ahmad ibn Abd al-Rahim al-Maqdisiyya, known as Bint al-Kamal (646–740 AH), an eminent hadith transmitter in Damascus who heard from Muhammad ibn Abd al-Hadi and others and held licences from many teachers; a great many books and parts were read to her, and the traveller Ibn Battuta heard hadith from her in the Umayyad Mosque."
