summary:
  ar: "قائد عسكري ريفي (1892–1967)؛ الأخ الأصغر لعبد الكريم الخطابي، درس هندسة المناجم بمدريد، وكان القائد الأعلى لجيش جمهورية الريف ونائب رئيسها، وقاد حملات شفشاون وتطوان ووادي ورغة، ونُفي مع أسرته إلى ريونيون ثم القاهرة، وعاد إلى المغرب فتوفي بالرباط ودُفن بأجدير."
  en: "Riffian military leader (1892–1967), the younger brother of Abd el-Krim. He studied mine engineering in Madrid, was supreme chief of the Republic of the Rif's army and its vice-president, and led the Chefchaouen, Tetouan and Ouergha campaigns; exiled with his family to Réunion and then Cairo, he returned to Morocco and died in Rabat, and was buried at Ajdir."
  ur: "ریفی عسکری قائد (1892–1967)؛ عبد الکریم خطابی کے چھوٹے بھائی، میڈرڈ میں کان کنی کی انجینئرنگ پڑھی، جمہوریۂ ریف کی فوج کے سپریم کمانڈر اور نائب صدر رہے، شفشاون، تطوان اور ورغہ کی مہمات کی قیادت کی؛ خاندان کے ساتھ ری یونین اور پھر قاہرہ جلاوطن رہے، مراکش واپس آئے تو رباط میں وفات پائی اور اخدیر میں دفن ہوئے۔"
