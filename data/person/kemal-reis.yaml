roles: [military-leader]
summary:
  ar: "كمال ريس، الأميرال العثماني؛ ينقل الصلابي أن بايزيد الثاني، جواباً على استغاثة مسلمي الأندلس واتفاقه مع السلطان المملوكي الأشرف، أرسل أسطولاً إلى الشواطئ الإسبانية وأعطى قيادته إلى كمال ريس الذي «أدخل الفزع والخوف والرعب في الأساطيل النصرانية في أواخر القرن الخامس عشر» {cite:dawlat-uthmaniyya-salabi p. 173}. ويذكر الكتاب أن المجاهدين العثمانيين كانوا يغنمون من سواحل النصارى، ودخل كثير منهم في خدمة الأسطول العثماني الناشئ، فاستعملت الدولة قوتها البحرية الجديدة في غرب المتوسط {cite:dawlat-uthmaniyya-salabi p. 173}."
  en: "Kemal Reis, the Ottoman admiral; al-Salabi records that Bayezid II — answering the Andalusian Muslims' appeal under his compact with the Mamluk sultan — sent a fleet to the Spanish coasts under Kemal Reis, who 'struck fear and terror into the Christian fleets in the late fifteenth century' {cite:dawlat-uthmaniyya-salabi p. 173}. The book adds that corsair volunteers joined the young Ottoman navy, which then turned its new strength to the western Mediterranean {cite:dawlat-uthmaniyya-salabi p. 173}."
  es: "Kemal Reis, el almirante otomano; al-Salabi relata que Bayezid II —respondiendo al llamamiento de los musulmanes andalusíes en virtud de su pacto con el sultán mameluco— envió una flota a las costas españolas al mando de Kemal Reis, quien «infundió temor y terror en las flotas cristianas a finales del siglo XV» {cite:dawlat-uthmaniyya-salabi p. 173}. El libro añade que voluntarios corsarios se unieron a la joven armada otomana, que luego dirigió su nueva fuerza hacia el Mediterráneo occidental {cite:dawlat-uthmaniyya-salabi p. 173}."
  fr: "L'amiral ottoman Kemal Reis, selon al-Salabi, aurait envoyé une flotte vers les côtes espagnoles en réponse à l'appel des musulmans andalous, conformément à son pacte avec le sultan mamelouk. Reis, sous son commandement, « sema la terreur parmi les flottes chrétiennes à la fin du XVe siècle » (Dawlat-Uthmaniyya-Salabi, p. 173). L'ouvrage ajoute que des corsaires volontaires rejoignirent la jeune marine ottomane, qui tourna ensuite ses nouvelles forces vers la Méditerranée occidentale (Dawlat-Uthmaniyya-Salabi, p. 173)."
