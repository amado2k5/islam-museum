summary:
  ar: "كمال ريس، الأميرال العثماني؛ ينقل الصلابي أن بايزيد الثاني، جواباً على استغاثة مسلمي الأندلس واتفاقه مع السلطان المملوكي الأشرف، أرسل أسطولاً إلى الشواطئ الإسبانية وأعطى قيادته إلى كمال ريس الذي «أدخل الفزع والخوف والرعب في الأساطيل النصرانية في أواخر القرن الخامس عشر» {cite:dawlat-uthmaniyya-salabi p. 173}. ويذكر الكتاب أن المجاهدين العثمانيين كانوا يغنمون من سواحل النصارى، ودخل كثير منهم في خدمة الأسطول العثماني الناشئ، فاستعملت الدولة قوتها البحرية الجديدة في غرب المتوسط {cite:dawlat-uthmaniyya-salabi p. 173}."
  en: "Kemal Reis, the Ottoman admiral; al-Salabi records that Bayezid II — answering the Andalusian Muslims' appeal under his compact with the Mamluk sultan — sent a fleet to the Spanish coasts under Kemal Reis, who 'struck fear and terror into the Christian fleets in the late fifteenth century' {cite:dawlat-uthmaniyya-salabi p. 173}. The book adds that corsair volunteers joined the young Ottoman navy, which then turned its new strength to the western Mediterranean {cite:dawlat-uthmaniyya-salabi p. 173}."
