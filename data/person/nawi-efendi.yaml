      formation is documented by that same encyclopedia: disciple of Sarhoş
      Bâlî Efendi, then mürid of Kurd Mehmed Efendi, with further training
      under Şeyh Şâban Efendi, and translator of Ibn Arabi's Fusûs al-hikam
      — attested for the man himself, but by one family only. Held unknown
