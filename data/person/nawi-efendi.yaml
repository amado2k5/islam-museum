summary:
  ar: "شاعر عثماني من شعراء الديوان وعالم (1533–1599)، وُلد في مالقرة وتعلّم في إسطنبول، ودرّس في مدارس غاليبولي وأدرنة وإسطنبول، ثم صار معلّمًا لأبناء السلطان مراد الثالث. خلّف ديوانًا كبيرًا، و«نتائج الفنون» الموسوعية، وترجمة منظومة للأربعين حديثًا، و«كشف الحجاب» ترجمته لفصوص الحكم لابن عربي؛ تربّى على التصوف منذ صغره، وتوفي في إسطنبول في 24 يونيو 1599 ولم يترك مالًا، ودُفن في مقبرة جامع الشيخ وفا."
  en: "Ottoman divan poet and scholar (1533–1599), born at Malkara and educated at Istanbul, who taught in the medreses of Gelibolu, Edirne and Istanbul and became tutor to the sons of Sultan Murad III. He left a large Divan, the encyclopaedic Netâyicü'l-fünûn, a verse translation of forty hadiths, and Keşfü'l-hicâb, his translation of Ibn Arabi's Fusûs al-hikam; Sufi-trained from childhood, he died at Istanbul on 24 June 1599 leaving no property, and was buried at the Şeyh Vefâ mosque."
  ur: "عثمانی دیوان شاعر اور عالم (1533–1599ء)، مالقرہ میں پیدا ہوئے اور استنبول میں تعلیم پائی؛ غالیبولی، ادرنہ اور استنبول کے مدارس میں پڑھایا اور سلطان مراد ثالث کے بیٹوں کے اتالیق بنے۔ ان کی یادگار ایک بڑا دیوان، موسوعاتی «نتائج الفنون»، چالیس احادیث کا منظوم ترجمہ اور ابن عربی کی فصوص الحکم کا ترجمہ «کشف الحجاب» ہے؛ بچپن سے صوفیانہ تربیت یافتہ تھے، 24 جون 1599ء کو استنبول میں وفات پائی اور کوئی مال نہ چھوڑا؛ شیخ وفا مسجد کے احاطے میں دفن ہوئے۔"

