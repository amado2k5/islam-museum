summary:
  ar: "شاعر عثماني من شعراء الديوان وعالم (1533–1599)، وُلد في مالقرة وتعلّم في إسطنبول، ودرّس في مدارس غاليبولي وأدرنة وإسطنبول، ثم صار معلّمًا لأبناء السلطان مراد الثالث. خلّف ديوانًا كبيرًا، و«نتائج الفنون» الموسوعية، وترجمة منظومة للأربعين حديثًا، و«كشف الحجاب» ترجمته لفصوص الحكم لابن عربي؛ تربّى على التصوف منذ صغره، وتوفي في إسطنبول في 24 يونيو 1599 ولم يترك مالًا، ودُفن في مقبرة جامع الشيخ وفا."
  en: "Ottoman divan poet and scholar (1533–1599), born at Malkara and educated at Istanbul, who taught in the medreses of Gelibolu, Edirne and Istanbul and became tutor to the sons of Sultan Murad III. He left a large Divan, the encyclopaedic Netâyicü'l-fünûn, a verse translation of forty hadiths, and Keşfü'l-hicâb, his translation of Ibn Arabi's Fusûs al-hikam; Sufi-trained from childhood, he died at Istanbul on 24 June 1599 leaving no property, and was buried at the Şeyh Vefâ mosque."
  ur: "عثمانی دیوان شاعر اور عالم ⁦(1533–1599ء)⁩، مالقرہ میں پیدا ہوئے اور استنبول میں تعلیم پائی؛ غالیبولی، ادرنہ اور استنبول کے مدارس میں پڑھایا اور سلطان مراد ثالث کے بیٹوں کے اتالیق بنے۔ ان کی یادگار ایک بڑا دیوان، موسوعاتی «نتائج الفنون»، چالیس احادیث کا منظوم ترجمہ اور ابن عربی کی فصوص الحکم کا ترجمہ «کشف الحجاب» ہے؛ بچپن سے صوفیانہ تربیت یافتہ تھے، 24 جون 1599ء کو استنبول میں وفات پائی اور کوئی مال نہ چھوڑا؛ شیخ وفا مسجد کے احاطے میں دفن ہوئے۔"
  es: "Poeta y erudito otomano (1533-1599), nacido en Malkara y educado en Estambul, enseñó en las madrasas de Gelibolu, Edirne y Estambul, y fue tutor de los hijos del sultán Murad III. Dejó un extenso Diván, la enciclopédica Netâyicü'l-fünûn, una traducción en verso de cuarenta hadices, y Keşfü'l-hicâb, su traducción del Fusûs al-hikam de Ibn Arabi. Formado en el sufismo desde la infancia, falleció en Estambul el 24 de junio de 1599 sin dejar bienes, y fue enterrado en la mezquita Şeyh Vefâ."
  fr: "Poète et érudit ottoman (1533-1599), né à Malkara et formé à Istanbul, il enseigna dans les médersas de Gelibolu, Edirne et Istanbul et devint précepteur des fils du sultan Murad III. Il laissa un important Divan, l'encyclopédique Netâyicü'l-fünûn, une traduction en vers de quarante hadiths, et Keşfü'l-hicâb, sa traduction du Fusûs al-hikam d'Ibn Arabi. Formé à la tradition soufie dès son enfance, il mourut à Istanbul le 24 juin 1599 sans laisser de biens et fut inhumé à la mosquée Şeyh Vefâ."
  tr: "Maqara doğumlu, İstanbul'da eğitim görmüş, Gelibolu, Edirne ve İstanbul okullarında eğitim görmüş, ardından Sultan III. Murad'ın oğullarına öğretmenlik yapmış Osmanlı şairi ve Diwan alimi (1533–1599) idi. Geride kırk hadisin çevirisi olan ansiklopedik \"Nata'iyat al-Funun\" ve İbn Arabi'nin Fusus al-Hikam'ının çevirisi \"Kaşf el-Hicab\" adlı büyük bir koleksiyon bıraktı; küçük yaşlardan itibaren tasavvuf içinde büyüdü, 24 Haziran 1599'da İstanbul'da hiç servet bırakmadan öldü ve Şeyh Wafa Camii mezarlığına defnedildi."
  id: "Seorang penyair dan cendekiawan Ottoman (1533–1599), lahir di Maqara, dididik di Istanbul, belajar di sekolah-sekolah Gallipoli, Edirne, dan Istanbul, kemudian menjadi guru bagi putra-putra Sultan Murad III. Ia meninggalkan koleksi besar, yaitu \"Nata'iyat al-Funun\" yang ensiklopedia, terjemahan puisi berisi empat puluh hadits, dan \"Kashf al-Hijab,\" terjemahannya atas Fusus al-Hikam karya Ibn Arabi; ia dibesarkan dalam tasawuf sejak usia muda, meninggal di Istanbul pada 24 Juni 1599, tanpa meninggalkan kekayaan, dan dimakamkan di pemakaman Masjid Sheikh Wafa."

