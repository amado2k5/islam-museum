summary:
  ar: "الخارجي الشاعر الذي مدح ابن ملجم في ضربته بقوله يا ضربة من تقي ما أراد بها إلا ليبلغ من ذي العرش رضواناً، فعارضه القاضي أبو الطيب طاهر بن عبد الله الشافعي بيا ضربة من شقي ما أراد بها إلا ليهدم للإسلام أركاناً، وعُدت أبياتهما من أشهر ما قيل في الواقعة {cite:muruj-al-dhahab p. 704-705}."
  en: "The Kharijite poet whose praise of Ibn Muljim's blow ('a pious man's strike, seeking only the Throne-Lord's pleasure') drew qadi Abu'l-Tayyib al-Shafi'i's famous counter-verse — among the most quoted poetry of the assassination {cite:muruj-al-dhahab p. 704-705}."
  es: "El poeta jariyí cuyo elogio del golpe de Ibn Muljim («el golpe de un hombre piadoso, que solo busca el placer del Señor del Trono») provocó el famoso contraverso del cadí Abu'l-Tayyib al-Shafi'i, uno de los poemas más citados del asesinato {cite:muruj-al-dhahab p. 704-705}."
  fr: "Le poète kharijite dont l'éloge du coup d'Ibn Muljim (« le coup d'un homme pieux, ne cherchant que le plaisir du Seigneur du Trône ») a inspiré le célèbre contre-vers du cadi Abu'l-Tayyib al-Shafi'i — parmi les poèmes les plus cités de l'assassinat {cite:muruj-al-dhahab p. 704-705}."
