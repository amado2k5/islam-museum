summary:
  ar: "الخارجي الشاعر الذي مدح ابن ملجم في ضربته بقوله يا ضربة من تقي ما أراد بها إلا ليبلغ من ذي العرش رضواناً، فعارضه القاضي أبو الطيب طاهر بن عبد الله الشافعي بيا ضربة من شقي ما أراد بها إلا ليهدم للإسلام أركاناً، وعُدت أبياتهما من أشهر ما قيل في الواقعة {cite:muruj-al-dhahab p. 704-705}."
  en: "The Kharijite poet whose praise of Ibn Muljim's blow ('a pious man's strike, seeking only the Throne-Lord's pleasure') drew qadi Abu'l-Tayyib al-Shafi'i's famous counter-verse — among the most quoted poetry of the assassination {cite:muruj-al-dhahab p. 704-705}."
