summary:
  ar: "أبو البركات حافظ الدين عبد الله بن أحمد بن محمود النسفي، الفقيه الأصولي المفسر الحنفي، منسوب إلى نسف في أوزبكستان اليوم، توفي سنة 710هـ وقيل 701هـ؛ أخذ عن شمس الأئمة الكردري وخواهر زاده وحميد الدين الضرير، وأخذ عنه حسام الدين السغناقي، وصنّف «مدارك التنزيل» و«كنز الدقائق» و«المنار» وشرحه و«الكافي» و«عمدة العقائد» {cite:tafsir-nasafi-tahqiq-2018-v1 p. 11-12}."
  en: "Abu al-Barakat Hafiz al-Din 'Abd Allah ibn Ahmad ibn Mahmud al-Nasafi, Hanafi jurist, legal theorist and exegete, named after Nasaf in present-day Uzbekistan, who died in 710 AH (or 701); he studied with Shams al-A'imma al-Kardari, Khwaharzada and Hamid al-Din al-Darir, taught Husam al-Din al-Sighnaqi, and wrote Madarik al-Tanzil, Kanz al-Daqa'iq, al-Manar with its commentary, al-Kafi and 'Umdat al-'Aqa'id {cite:tafsir-nasafi-tahqiq-2018-v1 p. 11-12}."
  ur: "ابو البرکات حافظ الدین عبد اللہ بن احمد بن محمود نسفی، حنفی فقیہ، اصولی اور مفسر، آج کے ازبکستان کے شہر نسف کی طرف منسوب، 710ھ میں (اور کہا گیا 701ھ میں) فوت ہوئے؛ شمس الائمہ کردری، خواہر زادہ اور حمید الدین ضریر سے پڑھا، حسام الدین سغناقی ان کے شاگرد تھے، اور «مدارک التنزیل»، «کنز الدقائق»، «المنار» اور اس کی شرح، «الکافی» اور «عمدۃ العقائد» لکھیں {cite:tafsir-nasafi-tahqiq-2018-v1 p. 11-12}۔"
died: { edtf: "1310/1311", hijri: "0710", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي سنة 710هـ، وقيل 701هـ، نقلاً عن «الفوائد البهية» {cite:tafsir-nasafi-tahqiq-2018-v1 p. 11}؛ المقابل الميلادي مشتق.", sources: [source/tafsir-nasafi-tahqiq-2018-v1] }
