    note: "Two independent article texts name his Sufi affiliation personally, in the Idris Senussi pattern of membership stated in text rather than office alone. The English text states that he was initiated in the Naqshbandi Sufi order by Sulayman Arzarumi and trained in Damascus under Abdullah ad-Daghistani, who became his principal murshid (spiritual guide), and its lead calls him a Sufi Muslim leader and Grand Shaykh of the Haqqani branch. The Arabic text states personally that he received the Qadiri order from his father and the Mawlawi order from his maternal grandfather, calls him one of the authorities of Naqshbandi Sufism, and narrates his taking the principles of the path from ad-Daghistani; the Urdu text agrees. No sunni or sunni-hanafi segment is recorded: Sunni denomination and Hanafi jurisprudence appear only in the English infobox, and one infobox never counts; Wikidata gives his religion as Sufism and Islam."
