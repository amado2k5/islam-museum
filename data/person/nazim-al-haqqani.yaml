summary:
  ar: "قائد صوفي تركي قبرصي (1922–2014)، شيخ الفرع الحقاني من الطريقة النقشبندية؛ وُلد في لارنكا بقبرص، ودرس الهندسة الكيميائية والشريعة في إسطنبول، وبُويع في النقشبندية وتدرّب على يد عبد الله الفائز الداغستاني حتى صار مرشده الرئيس، وبعد وفاة مرشده سنة 1973 عُدّ خليفته، فانتشرت دعوته في أوروبا الغربية وأمريكا الشمالية، وتوفي في نيقوسيا الشمالية ودُفن في لفكه."
  en: "Turkish Cypriot Sufi leader (1922–2014), Grand Shaykh of the Haqqani branch of the Naqshbandi order. Born in Larnaca, Cyprus, he studied chemical engineering and sharia in Istanbul, was initiated into the Naqshbandi order and trained under Abdullah al-Faiz ad-Daghistani, his principal guide; after his guide's death in 1973 he was regarded as his successor, and his teaching spread through Western Europe and North America. He died in North Nicosia and was buried at Lefke."
  ur: "ترک قبرصی صوفی رہنما (1922–2014)، سلسلہ نقشبندیہ کی حقانی شاخ کے شیخ؛ لارنکا میں پیدا ہوئے، استنبول میں کیمیائی انجینئرنگ اور شریعت پڑھی، عبد اللہ الفائز داغستانی سے بیعت و تربیت پائی، 1973 میں ان کے جانشین مانے گئے، وفات شمالی نیکوسیا میں ہوئی اور لفکے میں دفن ہوئے۔"
