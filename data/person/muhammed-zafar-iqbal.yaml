summary:
  ar: "فيزيائي وكاتب بنغلاديشي، وُلد في سيلهيت سنة 1952. من رواد أدب الخيال العلمي باللغة البنغالية وكاتب غزير الإنتاج للأطفال والناشئة، عمل باحثًا في الولايات المتحدة ثمانية عشر عامًا ثم عاد إلى بنغلاديش أستاذًا في جامعة شاه جلال للعلوم والتكنولوجيا. هو الشقيق الأصغر للكاتب همايون أحمد، ونجا من محاولة اغتيال سنة 2018."
  en: "Bangladeshi physicist and writer, born in Sylhet in 1952. A pioneer of science fiction in the Bengali language and a prolific author for children and teenagers, he worked as a scientist in the United States for eighteen years before returning to Bangladesh as a professor at Shahjalal University of Science and Technology. He is the younger brother of the writer Humayun Ahmed, and survived an assassination attempt in 2018."
  ur: "بنگلہ دیشی ماہر طبیعیات اور مصنف، جو 1952ء میں سلہٹ میں پیدا ہوئے۔ وہ بنگالی زبان میں سائنس فکشن کے بانیوں میں سے ہیں اور بچوں اور نوجوانوں کے لیے کثیر التصانیف مصنف ہیں؛ انہوں نے اٹھارہ سال امریکہ میں بطور سائنس دان کام کیا، پھر بنگلہ دیش واپس آ کر شاہ جلال یونیورسٹی آف سائنس اینڈ ٹیکنالوجی میں پروفیسر بنے۔ وہ مصنف ہمایوں احمد کے چھوٹے بھائی ہیں اور 2018ء میں قاتلانہ حملے میں بچ گئے۔"
