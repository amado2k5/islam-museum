id: person/ibn-al-baytar
class: person
label: { ar: "ابن البيطار" }
names:
  - { kind: full, lang: ar, value: ضياء الدين عبد الله بن أحمد المالقي العشاب }
summary:
  ar: "ابن البيطار الطبيب البارع ضياء الدين عبد الله بن أحمد المالقي العشاب صاحب كتاب المفردات في الأدوية انتهت إليه معرفة النبات وصفاته ومنافعه وأماكنه وله اتصال بخدمة الكامل ثم ابنه الصالح وكان رئيساً في الديار المصرية توفي بدمشق في شعبان سنة ست وأربعين وست مئة {cite:shadharat-dhahab p. 234}."
  en: "Ibn al-Baytar, the peerless physician and herbalist of Malaga, author of the Mufradat of simples — knowledge of plants, their properties, virtues and habitats ended with him; he served al-Kamil then his son al-Salih and was chief physician in Egypt, dying at Damascus in Sha'ban 646 {cite:shadharat-dhahab p. 234}."
  es: "Ibn al-Baytar, el incomparable médico y herbolario de Málaga, autor del Mufradat de las plantas simples —el conocimiento de las plantas, sus propiedades, virtudes y hábitats terminó con él—, sirvió a al-Kamil y luego a su hijo al-Salih, y fue médico jefe en Egipto, muriendo en Damasco en Sha'ban 646 {cite:shadharat-dhahab p. 234}."
  fr: "Ibn al-Baytar, le médecin et herboriste sans égal de Malaga, auteur du Mufradat des simples — la connaissance des plantes, de leurs propriétés, de leurs vertus et de leurs habitats s'est terminée avec lui; il a servi al-Kamil puis son fils al-Salih et a été médecin en chef en Égypte, mourant à Damas en Sha'ban 646 {cite:shadharat-dhahab p. 234}."
  ur: "ابن البیطار، ملاگا کے بے مثال طبیب اور جڑی بوٹیوں کے ماہر، مفرادات آف سادہ کے مصنف - پودوں، ان کی خصوصیات، فضائل اور رہائش گاہوں کا علم اس کے ساتھ ختم ہوا۔ اس نے الکامل کی خدمت کی اور پھر اس کے بیٹے الصالح کی خدمت کی اور مصر میں چیف فزیشن تھے، شعبان 646 میں دمشق میں وفات پائی۔ 234}۔"
  tr: "İbn el-Beytar, yetenekli hekim Dia'eddin Abdullah ibn Ahmed al-Maliqi el-Ashab, 'Al-Mufradat fi al-Adwa'i' kitabının yazarı, bitkiler, onların özellikleri, faydaları ve yerleri hakkında bilgisine ulaşmıştır. El-Kamil'e hizmet etmekle bağlantılıydı; ardından oğlu el-Salih, Mısır topraklarında liderdi ve 646 Hicri yılında Şaban'da Şam'da öldü {cite:shadharat-dhahab, s. 234}."
  id: "Ibn al-Baytar, dokter terampil Dia' al-Din Abdullah ibn Ahmad al-Maliqi al-Ashab, penulis buku 'Al-Mufradat fi al-Adwa'i,' mencapai pengetahuannya tentang tumbuhan, sifat, manfaatnya, dan tempatnya. Ia terhubung dengan melayani al-Kamil dan kemudian putranya al-Salih, yang merupakan pemimpin di tanah Mesir dan meninggal di Damaskus di Sha'ban pada tahun 646 H {cite:shadharat-dhahab, hlm. 234}."
