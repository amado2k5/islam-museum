  ar: "ابن البيطار الطبيب البارع ضياء الدين عبد الله بن أحمد المالقي العشاب صاحب كتاب المفردات في الأدوية انتهت إليه معرفة النبات وصفاته ومنافعه وأماكنه وله اتصال بخدمة الكامل ثم ابنه الصالح وكان رئيساً في الديار المصرية توفي بدمشق في شعبان سنة ست وأربعين وست مئة {cite:shadharat-dhahab p. 234}."
  en: "Ibn al-Baytar, the peerless physician and herbalist of Malaga, author of the Mufradat of simples — knowledge of plants, their properties, virtues and habitats ended with him; he served al-Kamil then his son al-Salih and was chief physician in Egypt, dying at Damascus in Sha'ban 646 {cite:shadharat-dhahab p. 234}."
