id: person/abd-allah-ibn-jafar-al-wathhab
class: person
label: { ar: "عبد الله بن جعفر المعروف بابن الوثاب", en: "Abdallah ibn Ja'far, known as Ibn al-Wathhab", fr: "Abdallah ibn Ja'far, dit Ibn al-Wathhab", es: "Abdallah ibn Ja'far, known as Ibn al-Wathhab", ur: "عبداللہ ابن جعفر ابن الوہاب کے نام سے مشہور ہیں۔" }
summary:
  ar: "عبد الله بن جعفر المعروف بابن الوثاب، كان منتسباً إلى الطائع لله، فلما قبض على الطائع وخلع هرب وتنقل في البلاد وصار إلى البطيحة وأقام عند مهذب الدولة ثم خرج، ونفذ القادر من أحضره مقبوضاً عليه فحبس ثم هرب فمضى إلى جيلان وادعى أنه هو الطائع لله وذكر لهم علامات عرفها بحكم أنسه بدار الخلافة فقبلوه وعظموه وزوجه ابن العباس أحد أمرائهم ابنته وأقام له الدعوة في بلده وأطاعه أهل نواحٍ أخر وأدوا إليه العشر، ثم ورد قوم منهم إلى بغداد فانكشف لهم حاله فانصرف عنهم {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  en: "Abdallah ibn Ja'far, known as Ibn al-Wathhab, was attached to al-Ta'i li-llah. When al-Ta'i was seized and deposed, he fled and wandered through the lands, reached al-Butayha and stayed with Muhadhdhab al-Dawla, then set out again. Al-Qadir sent to bring him in custody, and he was imprisoned; he later escaped and went to Jaylan, where he claimed to be al-Ta'i li-llah himself, citing signs he recognised from his familiarity with the caliphal palace. They accepted him and held him in high regard; Ibn al-Abbas, one of their amirs, gave him his daughter in marriage and proclaimed his claim in his town. People of other regions obeyed him and paid him the tithe. Then some of them came to Baghdad, his real condition became plain to them, and they turned away from him {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  fr: "Abdallah ibn Ja'far, dit Ibn al-Wathhab, était attaché à al-Ta'i li-llah. Lorsque al-Ta'i fut saisi et déposé, il s'enfuit et erra de pays en pays, atteignit al-Butayha et séjourna chez Muhadhdhab al-Dawla, puis repartit. Al-Qadir le fit ramener sous garde, et il fut emprisonné ; il s'évada plus tard et se rendit au Gilan, où il prétendit être al-Ta'i li-llah lui-même, citant des signes qu'il connaissait par sa familiarité avec le palais califal. Ils l'acceptèrent et le tinrent en haute estime ; Ibn al-Abbas, l'un de leurs émirs, lui donna sa fille en mariage et proclama sa prétention dans sa ville. Des gens d'autres régions lui obéirent et lui payèrent la dîme. Puis certains d'entre eux vinrent à Bagdad, sa vraie condition leur apparut, et ils se détournèrent de lui {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  es: "Abdallah ibn Ja'far, conocido como Ibn al-Wathhab, era leal a al-Ta'i li-llah. Cuando al-Ta'i fue apresado y depuesto, huyó y vagó por las tierras, llegó a al-Butayha y se hospedó con Muhadhdhab al-Dawla, para luego partir de nuevo. Al-Qadir mandó traerlo y fue encarcelado; más tarde escapó y fue a Jaylan, donde afirmó ser el propio al-Ta'i li-llah, citando señales que reconoció por su familiaridad con el palacio califal. Lo aceptaron y lo tuvieron en alta estima; Ibn al-Abbas, uno de sus emires, le dio a su hija en matrimonio y proclamó su derecho al trono en su ciudad. La gente de otras regiones le obedeció y le pagó el diezmo. Entonces algunos de ellos llegaron a Bagdad, su verdadera condición se hizo evidente para ellos, y se apartaron de él {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  ur: "عبداللہ ابن جعفر، جسے ابن الوہاب کہا جاتا ہے، الطائی للہ سے منسلک تھا۔ جب الطائی کو پکڑا گیا اور معزول کیا گیا تو وہ بھاگا اور زمینوں میں گھومتا پھرتا ہوا البطیحہ پہنچا اور محدث الدولہ کے پاس رہا، پھر دوبارہ روانہ ہوا۔ القادر نے اسے حراست میں لینے کے لیے بھیجا، اور اسے قید کر دیا گیا۔ بعد میں وہ فرار ہو گیا اور جیلان چلا گیا، جہاں اس نے خود کو الطائی للہ ہونے کا دعویٰ کیا، ان علامات کا حوالہ دیتے ہوئے جو اس نے خلیفہ کے محل سے اپنی واقفیت سے پہچانا تھا۔ اُنہوں نے اُسے قبول کیا اور اُس کا احترام کیا۔ ابن العباس جو کہ ان کے امیروں میں سے ایک تھا، نے اسے اپنی بیٹی نکاح میں دے دی اور اس کے شہر میں اپنے دعوے کا اعلان کیا۔ دوسرے علاقوں کے لوگ اس کی اطاعت کرتے تھے اور اسے دسواں حصہ ادا کرتے تھے۔ پھر ان میں سے کچھ بغداد آئے تو ان کی اصلی حالت ان پر واضح ہو گئی اور انہوں نے اس سے منہ موڑ لیا۔"
