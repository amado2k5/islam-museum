  ar: "ابنة غليم بن رجار صاحب صقلية؛ ولما هلك غليم ملكت ابنته وهي أم الأنبرور ملك ألمانية في زمان ابن خلكان؛ ثم هلكت وخلفته صغيراً فمُلك واستمر ملكه {cite:wafayat-ayan}."
  en: "Constance of Sicily (Umm al-Anbur) — daughter of William I; ruled Sicily after him and was mother of Frederick II, king of the Germans in Ibn Khallikan's own time, whom she left a minor on the throne {cite:wafayat-ayan}."
  es: "Constanza de Sicilia (Umm al-Anbur) — hija de Guillermo I; gobernó Sicilia después de él y fue madre de Federico II, rey de los alemanes en la época de Ibn Khallikan, a quien dejó siendo menor de edad en el trono {cite:wafayat-ayan}."
  fr: "Constance de Sicile (Umm al-Anbur) — fille de Guillaume Ier; régna sur la Sicile après lui et fut la mère de Frédéric II, roi des Allemands à l'époque d'Ibn Khallikan, qu'elle laissa mineur sur le trône {cite:wafayat-ayan}."
  ur: "Constance of Sicily ⁦(ام الانبر)⁩ - ولیم اول کی بیٹی؛ اس نے اپنے بعد سسلی پر حکومت کی اور ابن خلیقان کے اپنے زمانے میں جرمنوں کے بادشاہ فریڈرک دوم کی ماں تھی، جسے اس نے تخت پر ایک نابالغ چھوڑ دیا تھا۔"
