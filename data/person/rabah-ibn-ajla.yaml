summary:
  ar: "عراف اليمامة الذي قال فيه عروة بن الورد أو غيره جعلت لعراف اليمامة حكمه وعراف نجد إن هما شفياني، عنده المسعودي في العرافين مع الأبلق الأزدي والأحلج الدهري وعروة بن زيد الأزدي وكهند صاحب المستنبر {cite:muruj-al-dhahab p. 484-485}."
  en: "The 'arraf of al-Yamama, judged alongside the 'arraf of Najd in the famous verse — one of the augurs al-Mas'udi names beside al-Ablaq al-Azdi, al-Ahlaj al-Dahri and Kahand of al-Mustanbar {cite:muruj-al-dhahab p. 484-485}."
  es: "El 'arraf de al-Yamama, juzgado junto al 'arraf de Najd en el famoso verso, uno de los nombres augures de al-Mas'udi junto a al-Ablaq al-Azdi, al-Ahlaj al-Dahri y Kahand de al-Mustanbar {citar:muruj-al-dhahab p. 484-485}."
  fr: "Le 'arraf d'al-Yamama, jugé aux côtés du 'arraf du Najd dans le célèbre verset - un des noms d'al-Mas'udi augures à côté d'al-Ablaq al-Azdi, al-Ahlaj al-Dahri et Kahand d'al-Mustanbar {cite:muruj-al-dhahab p. 484-485}."
  ur: "اعراف ال یمامہ، مشہور آیت میں نجد کے اعراف کے ساتھ فیصلہ کیا گیا ہے - المستنبر کے البلق الازدی، الاحلج الدہری اور کہند کے ساتھ مسعودی ناموں میں سے ایک ہے 484-485}۔"
