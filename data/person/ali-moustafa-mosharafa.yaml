  ar: "فيزيائي ورياضي مصري ⁦(1898–1950)⁩، من أوائل علماء الفيزياء النظرية في العالم العربي الحديث. ساهم في نظرية الكم والنسبية، وكتب أوراقًا عن الإشعاع والمادة نالت إشادة أينشتاين، وكان أول عميد مصري لكلية العلوم بجامعة القاهرة."
  en: "Egyptian theoretical physicist and mathematician (1898–1950), among the first theoretical physicists of the modern Arab world. He contributed to quantum theory and relativity, wrote papers on radiation and matter praised by Einstein, and was the first Egyptian dean of the Faculty of Science at Cairo University."
