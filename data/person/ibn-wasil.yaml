summary:
  ar: "قاضي حماة المؤرخ؛ كان إماماً عالماً بعلوم كثيرة خصوصاً العقليات، مفرطاً في الذكاء مداوماً على الاشتغال والتفكر في العلم حتى كان يذهل عمن يجالسه وعن أحوال نفسه، وصنّف تصانيف كثيرة في الأصلين والحكمة والمنطق والعروض والطب والأدبيات {cite:shadharat-dhahab p. 766-767}."
  en: "Hama's qadi-historian — so absorbed in the rational sciences that he forgot his company and his own state; works across usul, hikma, logic, prosody, medicine and letters {cite:shadharat-dhahab p. 766-767}."
  es: "El historiador-cadí de Hama, tan absorto en las ciencias racionales que olvidó su compañía y su propio estado, trabaja en usul, hikma, lógica, prosodia, medicina y letras {cite:shadharat-dhahab p. 766-767}."
  fr: "L'historien qadi de Hama — tellement absorbé par les sciences rationnelles qu'il en oublia sa compagnie et son propre État; ses œuvres couvrent l'usul, le hikma, la logique, la prosodie, la médecine et les lettres {cite:shadharat-dhahab p. 766-767}."
  ur: "حما کا قادی مورخ - عقلی علوم میں اس قدر مشغول تھا کہ وہ اپنی کمپنی اور اپنی ریاست کو بھول گیا تھا۔ اصول، حکمت، منطق، فصاحت، طب اور خطوط پر کام کرتا ہے 766-767}۔"
  tr: "Hama'nın hakimi ve tarihçi; birçok bilimde, özellikle zihniyette bilgili bir imamdı, son derece zeki, sürekli bilgiyle meşgul ve düşüncelere sahipti; yanında oturanlara ve kendi devletlerine hayran kalırdı. Temeller, bilgelik, mantık, prosodi, tıp ve edebiyat üzerine birçok eser yazdı {cite:shadharat-dhahab s. 766-767}."
  id: "Hakim Hama dan sejarawan; ia adalah imam yang menguasai banyak ilmu, terutama mentalitas, sangat cerdas, selalu terlibat dan merenungkan ilmu hingga ia terpesona oleh mereka yang duduk bersamanya dan negaranya sendiri. Ia menulis banyak karya tentang dasar-dasar, kebijaksanaan, logika, prosodi, kedokteran, dan sastra {cite:Shadharat-Dhahab hlm. 766-767}."
