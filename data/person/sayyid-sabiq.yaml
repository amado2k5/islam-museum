summary:
  ar: "فقيه مصري من علماء الأزهر (1915–2000)، صاحب «فقه السنة» الذي عرض أحكام الفقه من أدلتها دون التزام مذهب، فانتشر بين عامة المثقفين، وعمل في وزارة الأوقاف ثم في جامعة أم القرى بمكة، ونال جائزة الملك فيصل في الدراسات الإسلامية سنة 1994."
  en: "Egyptian jurist of al-Azhar (1915–2000), author of Fiqh al-Sunna, which set out the rulings of law from their evidence without binding itself to one school and spread widely among general readers; he worked at the Ministry of Awqaf and then at Umm al-Qura University in Mecca, and received the King Faisal Prize for Islamic Studies in 1994."
  ur: "ازہر کے مصری فقیہ ⁦(1915ء–2000ء)⁩، «فقہ السنہ» کے مصنف، جس نے کسی ایک مذہب کی پابندی کے بغیر دلائل سے فقہی احکام بیان کیے اور عام پڑھے لکھے لوگوں میں پھیل گئی؛ وہ وزارتِ اوقاف اور پھر مکہ کی جامعہ ام القریٰ میں رہے، اور 1994ء میں اسلامی علوم کا شاہ فیصل انعام پایا۔"
