summary:
  ar: "سياسي وعالم عثماني فلسطيني من القدس (1842–1906)، تولّى رئاسة بلدية القدس مرات عدة، ومثّلها في أول برلمان عثماني، ووضع أول معجم كردي-عربي؛ واشتهر برسالة سنة 1899 حذّر فيها من المشروع الاستيطاني في فلسطين وبعث بها إلى تيودور هرتسل عبر كبير حاخامات فرنسا."
  en: "Ottoman Palestinian politician and scholar from Jerusalem (1842–1906). He served several terms as mayor of Jerusalem, represented it in the first Ottoman parliament, and compiled the first Kurdish–Arabic dictionary; he is remembered for his 1899 letter warning against the Zionist project, conveyed to Theodor Herzl through the chief rabbi of France."
  ur: "قدس سے تعلق رکھنے والے عثمانی فلسطینی سیاست دان اور عالم (1842–1906)۔ وہ کئی بار قدس کے میئر رہے، پہلی عثمانی پارلیمنٹ میں اس کی نمائندگی کی، اور پہلی کردی-عربی لغت مرتب کی؛ وہ 1899ء کے اس خط کی وجہ سے یاد کیے جاتے ہیں جس میں انہوں نے فرانس کے بڑے ربی کے ذریعے تھیوڈور ہرزل کو صہیونی منصوبے سے خبردار کیا تھا۔"
