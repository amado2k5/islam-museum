summary:
  ar: "قاضٍ ورجل دولة بنغلاديشي (1 فبراير 1930 – 19 مارس 2022)، رئيس قضاة بنغلاديش من 1990 إلى 1995، تولى الرئاسة بالوكالة في 1990–1991 على رأس الحكومة المؤقتة التي أجرت انتخابات 1991 العامة، ثم انتُخب رئيسًا لولاية كاملة من 1996 إلى 2001. بدأ مسيرته في الخدمة المدنية الباكستانية سنة 1954 وانتقل إلى القضاء سنة 1960، وترأس جمعية الهلال الأحمر البنغلاديشية من 1978 إلى 1982."
  en: "Bangladeshi jurist and statesman (1 February 1930 – 19 March 2022), chief justice of Bangladesh from 1990 to 1995, who as acting president in 1990–91 headed the interim government that held the February 1991 general election, and then served a full presidential term from 1996 to 2001. He began in the Civil Service of Pakistan in 1954, moved to the judicial branch in 1960, and chaired the Bangladesh Red Crescent Society from 1978 to 1982."
  ur: "بنگلہ دیشی منصف اور سیاست دان (1 فروری 1930ء – 19 مارچ 2022ء)، 1990ء سے 1995ء تک بنگلہ دیش کے چیف جسٹس رہے؛ 1990ء–1991ء میں قائم مقام صدر کی حیثیت سے عبوری حکومت کی سربراہی کی جس نے 1991ء کے عام انتخابات کرائے، پھر 1996ء سے 2001ء تک مکمل صدارتی مدت پوری کی۔ انھوں نے 1954ء میں پاکستان کی سول سروس سے آغاز کیا اور 1960ء میں عدلیہ میں منتقل ہوئے۔"
