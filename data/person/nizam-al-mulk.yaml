id: person/nizam-al-mulk
class: person
label: { ar: "نظام الملك وزير ألب أرسلان" }
summary:
  ar: "وزير ألب أرسلان، أبطل ما كان عليه الوزير قبله عميد الملك من سب الأشعرية وانتصر للشافعية وأكرم إمام الحرمين وأبا القاسم القشيري وبنى النظامية وقيل وهي أول مدرسة بنيت للفقهاء {cite:tarikh-khulafa-minhaj-1434 p. 645}؛ وهو الحسن بن علي بن إسحاق الطوسي قوام الدين، قال ابن السمعاني كعبة المجد ومتبع الجود، وكان داود بن ميكائيل أوصى به لولده ألب أرسلان وقال اتخذه والداً لا تخالفه، فلما مات ألب أرسلان أوطد المملكة لولده ملكشاه حتى صار الأمر كله لنظام الملك ولم يبق للسلطان إلا التخت والصيد وأقام على ذلك عشرين سنة، ودخل على المقتدي بالله فأذن له بالجلوس بين يديه وقال له يا حسن؛ وقتله شاب صوفي الشكل من الباطنية ليلة عاشر رمضان ناوله قصة ثم ضربه بسكين في صدره، فيقال إن ملكشاه دس عليه؛ وكان يقول في الحديث إني أعلم أني لست أهلاً لذلك ولكني أريد أربط نفسي في قطار النقلة {cite:shadharat-dhahab p. 381-382}."
  en: "Alp Arslan's vizier; he ended his predecessor Amid al-Mulk's Ash'ari-cursing, championed the Shafi'is, honoured Imam al-Haramayn and al-Qushayri, and built the Nizamiyya — 'said to be the first school built for the jurists' {cite:tarikh-khulafa-minhaj-1434 p. 645}. In 485 a youth in sufi guise handed him a petition and knifed him on the eve of 10 Ramadan — it was said Malikshah had suborned it; for twenty years he had run the whole realm, leaving the sultan 'only the throne and the hunt', and al-Muqtadi had him sit before him saying 'God is pleased with you as the Commander of the Faithful is pleased with you' {cite:shadharat-dhahab p. 381-382}."
