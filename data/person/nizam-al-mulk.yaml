summary:
  ar: "وزير ألب أرسلان، أبطل ما كان عليه الوزير قبله عميد الملك من سب الأشعرية وانتصر للشافعية وأكرم إمام الحرمين وأبا القاسم القشيري وبنى النظامية وقيل وهي أول مدرسة بنيت للفقهاء {cite:tarikh-khulafa-minhaj-1434 p. 645}؛ وهو الحسن بن علي بن إسحاق الطوسي قوام الدين، قال ابن السمعاني كعبة المجد ومتبع الجود، وكان داود بن ميكائيل أوصى به لولده ألب أرسلان وقال اتخذه والداً لا تخالفه، فلما مات ألب أرسلان أوطد المملكة لولده ملكشاه حتى صار الأمر كله لنظام الملك ولم يبق للسلطان إلا التخت والصيد وأقام على ذلك عشرين سنة، ودخل على المقتدي بالله فأذن له بالجلوس بين يديه وقال له يا حسن؛ وقتله شاب صوفي الشكل من الباطنية ليلة عاشر رمضان ناوله قصة ثم ضربه بسكين في صدره، فيقال إن ملكشاه دس عليه؛ وكان يقول في الحديث إني أعلم أني لست أهلاً لذلك ولكني أريد أربط نفسي في قطار النقلة {cite:shadharat-dhahab p. 381-382}. وعند ابن الجوزي خُلع عليه وزيراً لألب أرسلان يوم السبت السابع من المحرم سنة ٤٥٦ يوم قُبض على عميد الملك الكندري {cite:muntazam-ibn-al-jawzi j.8 p.574-576}، وفي فتنة الحنابلة والأشعرية ببغداد كتب إلى الوزير فخر الدولة بن جهير «بالامتعاض مما جرى والغضب لتسلط الحنابلة على الطائفة الأخرى، وأني أرى حسم القول فيما يتعلق بالمدرسة التي بنيتها في أشياء من هذا الجنس» {cite:muntazam-ibn-al-jawzi j.8 p.648}."
  en: "Alp Arslan's vizier; he ended his predecessor Amid al-Mulk's Ash'ari-cursing, championed the Shafi'is, honoured Imam al-Haramayn and al-Qushayri, and built the Nizamiyya — 'said to be the first school built for the jurists' {cite:tarikh-khulafa-minhaj-1434 p. 645}. In 485 a youth in sufi guise handed him a petition and knifed him on the eve of 10 Ramadan — it was said Malikshah had suborned it; for twenty years he had run the whole realm, leaving the sultan 'only the throne and the hunt', and al-Muqtadi had him sit before him saying 'God is pleased with you as the Commander of the Faithful is pleased with you' {cite:shadharat-dhahab p. 381-382}."
  ur: "سلجوقی وزیر جو الپ ارسلان اور ملک شاہ کے عہد سے وابستہ تھا؛ نظامیہ مدارس اور سلطنت کے انتظام میں اس کا اہم کردار تھا۔ {cite:shadharat-dhahab}"
  es: "Visir de Alp Arslan; puso fin a la maldición ash'ari de su predecesor Amid al-Mulk, defendió a los shafi'is, honró al imán al-Haramayn y a al-Qushayri, y construyó la Nizamiyya, «considerada la primera escuela construida para los juristas» {cite:tarikh-khulafa-minhaj-1434 p. 645}. En 485, un joven disfrazado de sufí le entregó una petición y lo apuñaló en la víspera del 10 de Ramadán; se decía que Malikshah lo había sobornado; durante veinte años había gobernado todo el reino, dejando al sultán «solo el trono y la caza», y al-Muqtadi lo hizo sentarse ante él diciendo «Dios está complacido contigo como el Comandante de los Creyentes está complacido contigo» {cite:shadharat-dhahab p. 381-382}."
  fr: "Vizir d'Alp Arslan, il mit fin aux malédictions ash'arites de son prédécesseur Amid al-Mulk, défendit l'école chaféite, honora l'imam al-Haramayn et al-Qushayri, et fit construire la Nizamiyya, considérée comme la première école de juristes (cité: Tarikh Khulafa Minhaj, 1434, p. 645). En 485, un jeune homme déguisé en soufi lui remit une requête et le poignarda à la veille du 10 Ramadan. On dit que Malikshah l'avait corrompue. Pendant vingt ans, il avait gouverné tout le royaume, ne laissant au sultan que le trône et la chasse. Al-Muqtadi le fit asseoir devant lui et lui dit: « Dieu est satisfait de toi, comme le Commandeur des Croyants est satisfait de toi » (cité: Hadharat Dhahab, p. 381-382)."
  tr: "Alp Arslan'ın veziri, önceki vezirin Aş'arilere yönelik hakaretlerini geçersiz kılan, Şafiileri desteklemiş, İki Kutsal Cami imamı Ebu'l-Kasim el-Kuşayri'yi onurlandırmış ve Nizamiyye'yi inşa etmiştir. Söylenir ki, burası hukukçular için inşa edilen ilk okul {cit:Tarikh-Khulafa-minhaj-1434, s. 645}; o, dinin direği olan el-Hasan ibn Ali ibn İshaq al-Tusi'ydi. İbn al-Sam'ani şöyle der: Yücelik Kabesi ve cömertliğin takipçisi. Davud bin Mika'il onu oğlu Alp Arslan'a bırakmış ve ona karşı çıkmayacak bir baba olarak kabul etmesini söylemişti. Alp Arslan öldüğünde, krallık oğlu Malikşah için güçlendi ve o da Tüm işler Nizam al-Mulk'un elindeydi ve sultanın geriye sadece taht ve avcılık kalmıştı; bu görevi yirmi yıl sürdürdü. El-Muktadi Billah'a girdi, ona oturmasına izin verdi ve ona, 'Ey Hasan' dedi. Batiniyah'dan genç bir Sufi onu Ramazan ayının onuncusu gecesi öldürdü, ona bir hikaye anlattı ve sonra göğsüne bıçakla vurdu. Söylenene göre, Malikşah ona bastı; hadislerinde şöyle derdi: 'Buna layık olmadığımı biliyorum ama kendimi taşıma trenine bağlamak istiyorum.' {atıf:Shadharat-Dhahab s. 381-382}. İbn al-Jawzi, Muharrem ayının yedinci Cumartesi günü, 456 H., onu Alp Arslan vezirliğinden görevden aldı; o gün Kral el-Kandari'nin komutanını yakaladığı gün {atı:Muntazam-ibn-al-jawzi J.8 s.574-576}. Bağdat'taki Hanbali ve Ash'ari isyanı sırasında, bakan Fakhr al-Dawla ibn Juhayr'a \"olanlardan duyduğu hoşnutsuzluğu ve Hanbali egemenliğine karşı öfkesini ifade eden bir mektup yazdı; bu tür konularda kurduğum okulla ilgili meseleyi çözdüm\" {cite:Muntazam-ibn-al-jawzi J.8 s.648} yazdı."
  id: "Wazir Alp Arslan, yang meniadakan hinaan wazir sebelumnya terhadap Ash'ari, mendukung para Shafi'i, menghormati Imam Dua Masjid Suci, Abu al-Qasim al-Qushayri, dan membangun Nizamiyya. Dikatakan bahwa ini adalah sekolah pertama yang dibangun untuk para ahli hukum {sitasi: Tarikh-Khulafa-minhaj-1434, hlm. 645}; ia adalah al-Hasan ibn Ali ibn Ishaq al-Tusi, pilar agama. Ibn al-Sam'ani berkata: Ka'bah kemuliaan dan pengikut kemurahan hati. Dawud ibn Mika'il mewariskannya kepada putranya Alp Arslan dan berkata untuk menganggapnya sebagai ayah yang tidak akan menentangnya. Ketika Alp Arslan wafat, kerajaan diperkuat untuk putranya Malikshah hingga ia menjadi Semua urusan berada di bawah Nizam al-Mulk, dan sultan tidak memiliki apa pun selain takhta dan perburuan, yang ia jalani selama dua puluh tahun. Ia memasuki Billah al-Muqtadi, mengizinkannya duduk di hadapannya, dan berkata kepadanya, 'Wahai Hasan.' Seorang pemuda Sufi dari Batiniyyah membunuhnya pada malam tanggal sepuluh Ramadan, yang memberinya sebuah cerita lalu memukulnya di dada dengan pisau. Konon Malikshah menginjaknya; ia biasa berkata dalam hadits, 'Aku tahu aku tidak pantas untuk itu, tapi aku ingin mengikat diriku pada kereta angkut.' {cite:shadharat-dhahab hlm. 381-382}. Ibn al-Jawzi mencopotkannya sebagai wazir Alp Arslan pada hari Sabtu, tanggal tujuh Muharram, 456 H, hari ia menangkap komandan Raja al-Kandari {cite:Muntazam-ibn-al-jawzi J.8 hlm.574-576}. Selama pemberontakan Hanbali dan Ash'ari di Baghdad, ia menulis kepada menteri Fakhr al-Dawla ibn Juhayr \"menyatakan ketidakpuasan atas apa yang telah terjadi dan kemarahan atas dominasi Hanbali atas sekte lain, dan saya melihat masalah terkait sekolah yang saya bangun atas masalah semacam ini sudah selesai\" {cite:Muntazam-ibn-al-jawzi J.8 hlm.648}."
