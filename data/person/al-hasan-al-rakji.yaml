id: person/al-hasan-al-rakji
class: person
label:
  ar: "مؤيد الملك أبو علي الحسن الركجي"
  en: "Mu'ayyad al-Mulk al-Hasan al-Rakji"
  es: "Mu'ayyad al-Mulk al-Hasan al-Rakji"
  fr: "Mu'ayyad al-Mulk al-Hasan al-Rakji"
  ur: "معایۃ الملک الحسن الراکجی"
summary:
  ar: "وزير لمشرف الدولة أبي علي بن بهاء الدولة سنتين ثم عُزل، وكان في زمان عطلته عظيم الجاه. لما قيل إن واسطًا خالية عن مارستان وهي مصر من الأمصار الكبار اختار موضعًا فجعله مارستانًا واتفق عليه جملة وافرة، وفُتح سنة ثلاث عشرة وحُملت إليه الأدوية ورُتّب له الخزّان والأطباء ووقف عليه الأوقاف. تولى إثارة أموال فخر الملك من غير ضرب بعصا فاستخرجها باللطف — منها ما فكّ رموز سجل خزنة الدولة: «الكوسج اللحياني» الذي عنده عشرون ألف دينار و«بسرة بقمعها» التي عندها ثلاثون ألفًا. ونصح ابن الصائبي أن يشتغل «بتاريخ أخيار الناس» فكان ذلك سبب ذيل ابن الصائب على تاريخ سنان. توفي سنة تسع وعشرين وأربعمائة وقد قارب الثمانين {cite:muntazam-ibn-al-jawzi j.8 p.442-444}."
  en: "Vizier of Musharrif al-Dawla for two years, then dismissed yet kept great prestige. Seeing Wasit lacked a bimaristan he chose a site and had the Mu'ayyadi bimaristan built and opened in 413, with medicines, storers, physicians and endowments. He recovered Fakhr al-Mulk's buried monies gently rather than by torture, cracking the cryptic ledger entries, and it was on his advice — 'occupy yourself with the history of virtuous men' — that Ibn al-Sabi' began his famous Dhayl on Sinan's history. Died 429 near eighty {cite:muntazam-ibn-al-jawzi j.8 p.442-444}."
  es: "Visir de Musharrif al-Dawla durante dos años, luego destituido pero conservando gran prestigio. Al ver que Wasit carecía de un bimaristán, eligió un emplazamiento e hizo construir el bimaristán Mu'ayyadi, que abrió sus puertas en 413, con medicinas, almacenes, médicos y donaciones. Recuperó el dinero enterrado de Fakhr al-Mulk con delicadeza, en lugar de mediante tortura, descifrando los crípticos registros contables, y fue por su consejo —«ocúpate de la historia de los hombres virtuosos»— que Ibn al-Sabi' comenzó su famoso Dhayl sobre la historia de Sinan. Murió en 429 cerca de los ochenta años {cite:muntazam-ibn-al-jawzi j.8 p.442-444}."
  fr: "Vizir de Musharrif al-Dawla pendant deux ans, il fut ensuite destitué, tout en conservant un grand prestige. Constatant que Wasit était dépourvue de bimaristan, il choisit un emplacement et fit construire le bimaristan Mu'ayyadi, inauguré en 413, doté de pharmacies, d'entrepôts, de médecins et de dotations. Il récupéra les fonds enfouis de Fakhr al-Mulk avec douceur, sans recourir à la torture, en déchiffrant les inscriptions cryptiques du livre de comptes. C'est sur son conseil – « occupe-toi de l'histoire des hommes vertueux » – qu'Ibn al-Sabi' commença son célèbre Dhayl, consacré à l'histoire de Sinan. Il mourut en 429, à l'âge de quatre-vingts ans."
  ur: "دو سال تک مشرف الدولہ کے وزیر، پھر برطرف، پھر بھی بڑا وقار برقرار رکھا۔ واسط کے پاس بیمارستان کی کمی دیکھ کر اس نے ایک جگہ کا انتخاب کیا اور 413 میں معایدی بیمارستان کو بنایا اور کھولا جس میں ادویات، ذخیرہ کرنے والے، طبیب اور اوقاف تھے۔ اس نے فخر الملک کی مدفون رقم کو تشدد کے بجائے نرمی سے برآمد کیا، خفیہ لیجر کے اندراجات کو توڑ دیا، اور یہ ان کے مشورے پر تھا - 'اپنے آپ کو نیک آدمیوں کی تاریخ سے لگاؤ' - کہ ابن السبی نے سنان کی تاریخ پر اپنی مشہور ڈھیل شروع کی۔ اسّی کے قریب 429 میں وفات پائی۔"
  tr: "İki yıl boyunca devlet denetçisi Ebu Ali bin Baha'el-Devle'nin yanında bakan olarak görev yaptıktan sonra görevden alındı. İzninde bulunduğu süre boyunca büyük bir itibara sahipti. Wasita'nın büyük şehirlerden biri olan Maristan'dan bağımsız olduğu söylendiğinde, bir yer seçip maristan yaptı ve bolca kabul etti. On üçüncü yılda burayı açtı, ilaç getirdi, bir hazine ve doktorlar ayarladı ve üzerine vakıflar yaptı. Fakhr al-Mulk'un servetini sopa kullanmadan yönetti, bu yüzden nazikçe çıkardı—bazılarını devlet hazinesinde çözdü: 'Al-Kusaj al-Lihyani,', yirmi bin dinara sahip olduğu ve 'Basra biqamaha' ise otuz bin dinarına sahipti. İbn el-Sa'ibi ona 'Halkın En İyilerinin Tarihi' üzerinde çalışmasını tavsiye etti; bu nedenle İbn el-Sa'ib Sinan tarihini ekledi. Dört yüz yirmi dokuz yaşında öldü ve neredeyse seksen yaşındaydı {cite:Muntazam-ibn-al-jawzi J.8 s.442-444}."
  id: "Ia menjabat sebagai menteri kepada pengawas negara Abu Ali ibn Baha' al-Dawla selama dua tahun sebelum diberhentikan. Selama cuti, ia memiliki kedudukan tinggi. Ketika dikatakan bahwa Wasita bebas dari maristan, yang merupakan salah satu kota besar, ia memilih lokasi dan menjadikannya maristan dan disetujui dengan baik. Pada tahun ketiga belas, ia membukanya, membawa obat-obatan, mengatur kas dan dokter, serta memberikan dana untuk itu. Ia mengambil alih kekayaan Fakhr al-Mulk tanpa memukul dengan tongkat, sehingga ia mengekstraknya dengan lembut—beberapa di antaranya ia pecahkan dalam catatan kas negara: 'Al-Kusaj al-Lihyani,' yang ia miliki dua puluh ribu dinar, dan 'Basra biqamaha,' yang ia miliki tiga puluh ribu. Ibn al-Sa'ibi menyarankan ia untuk mengerjakan 'Sejarah Orang Terbaik,' yang menjadi alasan Ibn al-Sa'ib menambahkan sejarah Sinan. Ia meninggal pada tahun empat ratus dua puluh sembilan dan hampir berusia delapan puluh tahun {cite:Muntazam-ibn-al-jawzi J.8 hlm.442-444}."
