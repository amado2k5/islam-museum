summary:
  ar: "الوزير الكاتب أبو المغيرة عبد الوهاب بن حزم؛ قال عن نفسه في المطمح إنه في الكتابة أوحد لا ينعت ولا يحد، وكان هو وأبو عامر ابن شهيد خليلي صفاء لا ينفصلان في رواح ولا مقيل كمالك وعقيل وكانا بقرطبة رافعي ألوية الصبوة، وحكى عن نفسه أنه نادم المنصور بن أبي عامر في منية السرور بالزاهرة لما غنتهما الجارية أنس القلوب فسل المنصور حسامه عليها وعليه حتى اعتذر، وتوفي بطليطلة سنة 438هـ {cite:nafh-tib-maqqari p. 652-657}."
  en: "Abu l-Mughira Abd al-Wahhab b. Hazm, self-described 'inimitable' of the chancery and bosom friend of Abu Amir Ibn Shuhayd — the pair proverbially inseparable 'like Malik and Aqil' until Ibn Shuhayd's fall; he tells how al-Mansur nearly unsheathed his sword over the singing-girl Uns al-Qulub's verses at Munyat al-Surur in al-Zahira; he died at Toledo in 438 {cite:nafh-tib-maqqari p. 652-657}."
