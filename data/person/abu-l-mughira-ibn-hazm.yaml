summary:
  ar: "الوزير الكاتب أبو المغيرة عبد الوهاب بن حزم؛ قال عن نفسه في المطمح إنه في الكتابة أوحد لا ينعت ولا يحد، وكان هو وأبو عامر ابن شهيد خليلي صفاء لا ينفصلان في رواح ولا مقيل كمالك وعقيل وكانا بقرطبة رافعي ألوية الصبوة، وحكى عن نفسه أنه نادم المنصور بن أبي عامر في منية السرور بالزاهرة لما غنتهما الجارية أنس القلوب فسل المنصور حسامه عليها وعليه حتى اعتذر، وتوفي بطليطلة سنة 438هـ {cite:nafh-tib-maqqari p. 652-657}."
  en: "Abu l-Mughira Abd al-Wahhab b. Hazm, self-described 'inimitable' of the chancery and bosom friend of Abu Amir Ibn Shuhayd — the pair proverbially inseparable 'like Malik and Aqil' until Ibn Shuhayd's fall; he tells how al-Mansur nearly unsheathed his sword over the singing-girl Uns al-Qulub's verses at Munyat al-Surur in al-Zahira; he died at Toledo in 438 {cite:nafh-tib-maqqari p. 652-657}."
  fr: "Abu l-Mughira Abd al-Wahhab b. Hazm, « inimitable » de la chancellerie selon ses propres mots et ami intime d'Abu Amir Ibn Shuhayd — le couple était proverbialement inséparable « comme Malik et Aqil » jusqu'à la disgrâce d'Ibn Shuhayd ; il raconte comment al-Mansur faillit dégainer son sabre à cause des vers de la chanteuse Uns al-Qulub à Munyat al-Surur, à al-Zahira ; il mourut à Tolède en 438 {cite:nafh-tib-maqqari p. 652-657}."
  es: "Abu l-Mughira Abd al-Wahhab b. Hazm, quien se autodenominaba \"inimitable\" de la cancillería y amigo íntimo de Abu Amir Ibn Shuhayd —la pareja era proverbial e inseparable \"como Malik y Aqil\" hasta la caída de Ibn Shuhayd—, cuenta cómo al-Mansur casi desenvainó su espada sobre los versos de la cantante Uns al-Qulub en Munyat al-Surur en al-Zahira; murió en Toledo en 438 {cite:nafh-tib-maqqari p. 652-657}."
  ur: "ابو المغیرہ عبد الوہاب ب۔ حزم، ابو عامر ابن شھید کے بانی اور باصلاحیت دوست کے بارے میں خود بیان کیا گیا ہے - ابن شھید کے زوال تک 'مالک اور عاقل کی طرح' جوڑی کہلاتی ہے؛ وہ بتاتا ہے کہ کس طرح المنصور نے الزہرہ کے منیات الصور میں گانے والی لڑکی انس القلوب کی آیات پر اپنی تلوار تقریباً کھول دی تھی۔ ان کی وفات 438 میں ٹولیڈو میں ہوئی۔ 652-657}۔"
