id: person/ikrima-mawla-ibn-abbas
class: person
label: { ar: "عكرمة مولى ابن عباس", en: "'Ikrima, Ibn 'Abbas's mawla", es: "'Ikrima, Ibn 'Abbas's mawla", fr: "'Ikrima, Ibn 'Abbas's mawla", ur: "عکرمہ، ابن عباس کا مولا" }
summary:
  ar: "أبو عبد الله مولى عبد الله بن عباس، تناظر مع مولاه في المأمور بذبحه أإسحاق أم إسماعيل فاحتج لإسحاق من القرآن، مات سنة خمس ومائة في اليوم الذي مات فيه كثير عزة فقال الناس مات عظيم الفقهاء وكبير الشعراء، وفيها وفاة الشعبي {cite:muruj-al-dhahab p. 376-377}."
  en: "Ibn 'Abbas's mawla and his sparring partner on the bound son — dead in 105, the same day as Kathir 'Azza {cite:muruj-al-dhahab p. 376-377}."
  es: "El mawla de Ibn 'Abbas y su compañero de entrenamiento en el hijo atado, muerto en 105, el mismo día que Kathir 'Azza {cite:muruj-al-dhahab p. 376-377}."
  fr: "Le mawla d'Ibn 'Abbas et son partenaire d'entraînement sur le fils lié — mort en 105, le même jour que Kathir 'Azza {cite:muruj-al-dhahab p. 376-377}."
  ur: "ابن عباس کا مولا اور اس کے نیزہ بازی کے ساتھی بندھے ہوئے بیٹے پر - 105 میں فوت ہوگئے، اسی دن کثیر عضاء {حوالہ: مروج الذہب ص۔ 376-377}۔"
  tr: "Abdullah ibn Abbas'ın özgür bırakılmış adamı Ebu Abdullah, İsmail'in annesi İshaq'ın katledilmesini emrettiği konuda efendisiyle tartıştı ve Kur'an'dan İshak için savundu. 105 Hicri yılında, birçok onurlu adamın öldüğü gün öldü. Halk dedi ki, 'En büyük hukukçu ve baş şair öldü.' Bu yıl, el-Şa'bi öldü {atıf:Muruj-al-Dhahab, s. 376-377}."
  id: "Abu Abdullah, mantan Abdullah ibn Abbas, berdebat dengan gurunya mengenai hal yang memerintahkan pembantaian Ishaq, ibu Ismail, dan ia berargumen untuk Ishak dalam Al-Qur'an. Ia meninggal pada tahun 105 H, pada hari ketika banyak orang terhormat meninggal. Orang-orang berkata, 'Ahli hukum dan penyair utama telah wafat.' Pada tahun ini, al-Sha'bi wafat {cite:muruj-al-dhahab, hlm. 376-377}."
