summary:
  ar: "أبو عبد الله مولى عبد الله بن عباس، تناظر مع مولاه في المأمور بذبحه أإسحاق أم إسماعيل فاحتج لإسحاق من القرآن، مات سنة خمس ومائة في اليوم الذي مات فيه كثير عزة فقال الناس مات عظيم الفقهاء وكبير الشعراء، وفيها وفاة الشعبي {cite:muruj-al-dhahab p. 376-377}."
  en: "Ibn 'Abbas's mawla and his sparring partner on the bound son — dead in 105, the same day as Kathir 'Azza {cite:muruj-al-dhahab p. 376-377}."
