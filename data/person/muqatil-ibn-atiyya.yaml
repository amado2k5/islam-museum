roles: [scholar, poet]
gender: male
summary:
  ar: "مقاتل بن عطية البكري الحجازي، أبو الهيجاء، أمير وشاعر مدح الكبار واختص بنظام الملك، توفي في حدود سنة ٥٠٥هـ بهراة."
  en: "Muqatil ibn Atiyya al-Bakri al-Hijazi, Abu al-Hayja, a prince and poet who praised the great, became close to Nizam al-Mulk and died about 505 AH at Herat."
  es: "Muqatil ibn Atiyya al-Bakri al-Hijazi, Abu al-Hayja, un príncipe y poeta que elogiaba al grande, se hizo cercano a Nizam al-Mulk y murió alrededor del año 505 AH en Herat."
  fr: "Muqatil ibn Atiyya al-Bakri al-Hijazi, Abu al-Hayja, prince et poète qui a fait l'éloge des grands, s'est rapproché de Nizam al-Mulk et est mort vers 505 AH à Hérat."
  ur: "مقاتل بن عطیہ البکری الحجازی، ابو الحیجہ، ایک شہزادہ اور شاعر جس نے عظیم کی تعریف کی، نظام الملک کے قریب ہوا اور تقریباً 505 ہجری میں ہرات میں وفات پائی۔"
  tr: "Muqatil bin Atiyyah al-Bakri al-Hicazi, Ebu al-Hija, büyükleri öven ve kraliyet sisteminde uzmanlaşmış bir prens ve şairdi. Yaklaşık 505 Hicri yılında Herat'ta öldü."
  id: "Muqatil ibn Atiyyah al-Bakri al-Hijazi, Abu al-Hija, adalah seorang pangeran dan penyair yang memuji para bangsawan dan mengkhususkan diri dalam sistem kerajaan. Ia wafat sekitar tahun 505 H di Herat."
