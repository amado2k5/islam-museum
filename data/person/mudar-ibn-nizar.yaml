  ar: "أحد أبناء نزار، ينسب إليه قسم من عرب الشمال؛ يذكر النويري قصة ميراث أبيه وتحاكم أبنائه إلى الأفعى الجرهمي. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 10}"
  en: "One of Nizar's sons, from whom a branch of the northern Arabs is traced; al-Nuwayri tells the story of his father's inheritance and the sons' dispute before al-Afa al-Jurhumi. {cite:nihayat-al-arab-nuwayri-vol3-scan p. 10}"
  ur: "نزار کے بیٹوں میں سے ایک، جن سے شمالی عربوں کی ایک شاخ کا نسب جوڑا جاتا ہے؛ نویری نے باپ کی میراث کا قصہ نقل کیا ہے۔ {cite:nihayat-al-arab-nuwayri-vol3-scan p. 10}"
