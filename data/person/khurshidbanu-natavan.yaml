summary:
  ar: "شاعرة ومحسنة أذربيجانية (1832–1897)، ابنة مهدي قلي خان آخر خانات قره باغ ووريثته الوحيدة، من أبرز شاعرات الغزل في أذربيجان، كتبت بالأذربيجانية والفارسية، وأسست في شوشا مجلسًا أدبيًا («مجلس الأنس») ومدّت أول خط ماء إلى المدينة، واشتهرت بتربية خيول قره باغ."
  en: "Azerbaijani poet and philanthropist (1832–1897), daughter and sole heir of Mehdigulu Khan, the last khan of Karabakh, and one of Azerbaijan's foremost lyrical poets, writing ghazals in Azerbaijani and Persian. She founded the Majlis-i Uns literary society at Shusha, laid the town's first water main, and was famed for her Karabakh horses."
  ur: "آذربائیجانی شاعرہ اور صاحبِ خیر (1832–1897)، قاراباغ کے آخری خان مہدی قلی خان کی بیٹی اور اکلوتی وارث، آذربائیجان کی نمایاں غزل گو شاعرات میں سے ایک؛ آذربائیجانی اور فارسی میں لکھا۔ انہوں نے شوشا میں ادبی مجلس «مجلسِ انس» قائم کی، شہر تک پانی کی پہلی لائن پہنچائی، اور قاراباغ کے گھوڑوں کی پرورش کے لیے مشہور ہوئیں۔"
