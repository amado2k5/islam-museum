summary:
  en: "Chieftain of Thaqif in al-Ta'if and respected Meccan diplomat; represented Quraysh during negotiations at al-Hudaybiyya and famously reported to Quraysh the unparalleled devotion of the Companions to Muhammad; he embraced Islam in 9 AH and was martyred by his own people while calling them to prayer from his rooftop."
  ar: "سيد ثقيف بالطائف وأحد عظيمي القريتين في الجاهلية؛ فاوض النبي بالحديبية نيابة عن قريش فرأى من إجلال الصحابة له ما بهره فقال لقريش: «أي قوم، والله لقد وفدت على كسرى وقيصر والنجاشي فما رأيت ملكاً يعظمه أصحابه ما يعظم أصحاب محمد محمداً»؛ أسلم سنة 9هـ ورجع يدعو ثقيفاً فرموه بالنبل وهو يؤذن فاستشهد."
  ur: "طائف میں ثقیف کا سردار اور معزز مکی سفارت کار؛ حدیبیہ کے مذاکرات میں قریش کی نمائندگی کی اور وہ معروف مقام رکھتا تھا۔"
  es: "Jefe de Thaqif en al-Ta'if y respetado diplomático de La Meca; representó a los Quraysh durante las negociaciones en al-Hudaybiyya y, según se cuenta, informó a los Quraysh de la devoción sin igual de los Compañeros a Mahoma; abrazó el Islam en el año 9 de la Hégira y fue martirizado por su propio pueblo mientras los llamaba a la oración desde la azotea de su casa."
  fr: "Chef de Thaqif à al-Ta'if et diplomate mecquois respecté; il représenta les Quraysh lors des négociations à al-Hudaybiyya et rapporta aux Quraysh la dévotion sans pareille des Compagnons envers Muhammad; il embrassa l'islam en 9 AH et fut martyrisé par son propre peuple alors qu'il les appelait à la prière depuis le toit de sa maison."
  tr: "Taif'teki Thaqif'in efendisi ve İslam öncesi dönemde iki köyün büyük liderlerinden biri; Peygamber, Kureyş adına Hudeybiye'de müzakere etti ve sahabelerin ona olan saygısını görmek etkileyici oldu ve Kureyş'e şöyle dedi: \"Ey insanlar, Allah'a yemin ederim, Hoşrov, Sezar ve Negus'u ziyaret etmeye geldim ve Muhammed ve Muhammed'in sahabelerinden daha çok onurlandırılan bir kral görmedim.\" 9 Hicri yılında İslam'a geçti ve Thaqif'i ziyaret etmek için geri döndü, ancak azan namazı sırasında ona nebil verildi ve şehit edildi."
  id: "Guru Takhif di Ta'if dan salah satu pemimpin besar dua desa pada era pra-Islam; Nabi bernegosiasi di Hudaybiyyah atas nama Quraisy, dan melihat penghormatan para sahabat kepadanya sangat mengesankan dan berkata kepada Quraisy: \"Wahai umat manusia, demi Tuhan, aku datang mengunjungi Khosrow, Caesar, dan Negus, dan aku belum pernah melihat raja yang sahabatnya lebih menghormatinya daripada sahabat Muhammad dan Muhammad.\" Ia memeluk Islam pada tahun 9 H dan kembali untuk memanggil Thaqif, tetapi mereka menghormatinya dengan nabil saat ia memanggil adhan, dan ia menjadi syahid."
