summary:
  en: "Chieftain of Thaqif in al-Ta'if and respected Meccan diplomat; represented Quraysh during negotiations at al-Hudaybiyya and famously reported to Quraysh the unparalleled devotion of the Companions to Muhammad; he embraced Islam in 9 AH and was martyred by his own people while calling them to prayer from his rooftop."
  ar: "سيد ثقيف بالطائف وأحد عظيمي القريتين في الجاهلية؛ فاوض النبي بالحديبية نيابة عن قريش فرأى من إجلال الصحابة له ما بهره فقال لقريش: «أي قوم، والله لقد وفدت على كسرى وقيصر والنجاشي فما رأيت ملكاً يعظمه أصحابه ما يعظم أصحاب محمد محمداً»؛ أسلم سنة 9هـ ورجع يدعو ثقيفاً فرموه بالنبل وهو يؤذن فاستشهد."
