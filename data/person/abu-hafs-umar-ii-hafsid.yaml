summary:
  ar: "عمر بن أبي بكر الحفصي، أبو حفص، ملك تونس سنة 747 هـ، قتل إخوته الثائرين عليه ثم قتله بعض الجند بقرب قابس بعد عشرة أشهر و13 يوما، سنة 748 هـ الموافقة 1347 م."
  en: "Umar ibn Abi Bakr al-Hafsi, Abu Hafs, king in Tunis from 747 AH, who killed the brothers who rose against him and was himself killed by soldiers near Gabes after ten months and 13 days, in 748 AH (1347)."
  fr: "Umar ibn Abi Bakr al-Hafsi, Abu Hafs, roi à Tunis à partir de 747 H, qui tua les frères soulevés contre lui et fut lui-même tué par des soldats près de Gabès au bout de dix mois et 13 jours, en 748 H (1347)."
  es: "Umar ibn Abi Bakr al-Hafsi, Abu Hafs, rey de Túnez desde el año 747 de la Hégira, quien mató a los hermanos que se rebelaron contra él y fue asesinado por soldados cerca de Gabes diez meses y trece días después, en el año 748 de la Hégira (1347)."
  ur: "عمر بن ابی بکر الحفصی، ابو حفص، تیونس میں 747 ہجری سے بادشاہ، جس نے اپنے خلاف اٹھنے والے بھائیوں کو قتل کیا اور خود 748 ہجری (1347) میں دس ماہ اور 13 دن کے بعد گیبس کے قریب سپاہیوں کے ہاتھوں مارا گیا۔"
