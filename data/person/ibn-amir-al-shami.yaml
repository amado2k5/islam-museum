  ur: "آٹھویں صدی میں سات اصولی قارئین کے درمیان دمشق کے قاری اور اس کے جج عبداللہ بن عامر ال یحسیبی کے لیے ڈرافٹ کارڈ، ڈی۔ 736; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Sekizinci yüzyılda Levant'ın yedi okuyucu arasında yer alan ve yargıcı olan Abdullah ibn Amir al-Yahsabi tarafından hazırlanan ön kart, 736 yılında ölmüştür; Kur'an okumaları ve biyografileri kitaplarıyla anılmaktadır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan oleh Abdullah ibn Amir al-Yahsabi, pembaca dan hakim Levant di antara tujuh pembaca pada abad kedelapan, wafat pada tahun 736 M; ia dikenang melalui buku-buku bacaan Al-Qur'an dan biografi, dan biografinya belum pernah diulas di halaman."
