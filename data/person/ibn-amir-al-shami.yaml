  ar: "بطاقة أولية لعبد الله بن عامر اليحصبي، قارئ الشام وقاضيها من القراء السبعة في القرن الثامن، توفي سنة ٧٣٦م؛ تذكره كتب القراءات والتراجم ولم تُراجع ترجمته على الصفحة بعد."
