summary:
  ar: "الحافظ الحنبلي الفقيه نزيل دمشق؛ سمع ببغداد من ابن الأخضر وابن طبرزد ورحل إلى الأقطار فسمع بأصبهان ونيسابور وهراة وبوشنج ودينور ونهاوند وتستر وطوس والموصل ودمشق وبيت المقدس وحران، وتفقه ببغداد على ابن التاريخي وأبي البقاء العكبري؛ شيخ لدار حديث منبج ثم ولي دار الحديث التي للصاحب ابن شداد بحلب؛ قال البرزالي حافظ دين ثقة وقال أبو شامة كان عالما بالحديث دينا متواضعا {cite:shadharat-dhahab p. 218}."
  en: "The Hanbali hafiz (d. 15 Jumada I 641, Damascus) — one of the great travelling memorizers: Baghdad, Isfahan, Nishapur, Herat, Dinawar, Tustar, Mosul, Jerusalem, Harran; shaykh of Manbij's dar al-hadith then Ibn Shaddad's at Aleppo; Abu Shama prayed over him; buried at Qasyun's foot {cite:shadharat-dhahab p. 217-218}."
  fr: "Le hafiz Hanbali (mort en 15 Jumada I 641, Damas) – l’un des grands mémorisateurs itinérants : Bagdad, Ispahan, Nichapour, Herat, Dinawar, Tustar, Mossoul, Jérusalem, Harran ; shaykh du dar al-hadith de Manbij puis Ibn Shaddad à Alep ; Abou Shama a prié pour lui ; enterré au pied de Qasyun {cite:shadharat-dhahab p. 217-218}."
  es: "El hafiz Hanbali (m. 15 de Jumada I 641, Damasco), uno de los grandes memorizadores viajeros: Bagdad, Isfahán, Nishapur, Herat, Dinawar, Tustar, Mosul, Jerusalén, Harran; el shaykh del dar al-hadith de Manbij y luego el de Ibn Shaddad en Alepo; Abu Shama oró por él; enterrado a los pies de Qasyun {cita: shadharat-dhahab p. 217-218}."
  ur: "حنبلی حافظ ⁦(متوفی 15 جمادی الثانی 641، دمشق)⁩ - عظیم سفری حافظوں میں سے ایک: بغداد، اصفہان، نیشاپور، ہرات، دیناور، تسطار، موصل، یروشلم، حران؛ منبج کے دارالحدیث کے شیخ پھر ابن شداد کا حلب میں؛ ابو شمع نے اس پر نماز پڑھی۔ قصیون کے قدموں میں دفن کیا گیا 217-218}۔"
  tr: "Şam'da yaşayan Hanbali Hafız ve fıkhih; Bağdat'ta İbn al-Akhdar ve İbn Tabarzad'dan haber aldı, çeşitli topraklara seyahat etti ve İsfahan, Nişapur, Herat, Buşeng, Dinur, Havand, Tustar, Tus, Musul, Şam, Kudüs ve Harran'da dinledi. Bağdat'ta İbn al-Tarikh ve Manbic hadis hanedanının şeyhi Ebu al-Baqa al-'Akbari'den fıkıh aldı, ardından Halep'te İbn Şeddad'ın hadis evinin başı oldu. El-Barzali güvenilir bir dini ezberci olduğunu ve Abu Şama'nın hadis konusunda bilgili, alçakgönüllü bir âlim olduğunu söylemiştir {atıft: shadharat-dhahab, s. 218}."
  id: "Hafiz Hanbali dan ahli hukum yang tinggal di Damaskus; ia mendengar di Baghdad dari Ibn al-Akhdar dan Ibn Tabarzad, melakukan perjalanan ke berbagai negeri, dan mendengar di Isfahan, Nishapur, Herat, Busheng, Dinur, Havand, Tustar, Tus, Mosul, Damaskus, Yerusalem, dan Harran. Ia belajar hukum di Baghdad di bawah bimbingan Ibn al-Tarikh dan Abu al-Baqa al-'Akbari, sheikh dari rumah hadis Manbij, kemudian menjadi kepala rumah hadis Ibn Shaddad di Aleppo. Al-Barzali mengatakan ia adalah seorang penghafal agama yang dapat dipercaya dan Abu Shama adalah ulama hadits yang berpengetahuan, rendah hati {cite:shadharat-dhahab, hlm. 218}."
