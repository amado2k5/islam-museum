summary:
  ar: "إبراهيم المجذوب الشهير بأبي لهف؛ كان في أول جذبه مقيماً في البرج الأحمر من قلعة الجبل نحو عشرين سنة، فلما قرب زوال دولة الجراكسة أرسل إلى الغوري يقول له: تحوّل من القلعة وأعطِ المفاتيح لأصحابها، فلم يلقِ الغوري إلى كلامه بالاً وقال هذا مجنون، فنزل الشيخ إبراهيم إلى مصر فزالت دولة الجراكسة بعد سنة. وكان حافياً مكشوف الرأس أكثر إقامته في بيوت الأكابر، وكان يُكشف له عما ينزل بالإنسان من البلاء في المستقبل فيأتي إليه ويخبره أنه نازل به في وقت كذا ويطلب منه مالاً فإذا دفعه إليه تحول البلاء عنه وإلا وقع كما أخبر، وكان يمكث الشهر وأكثر لا ينام بل يجلس يهمهم بالذكر إلى الفجر صيفاً وشتاء؛ توفي سنة أربعين وتسعمائة ودُفن بقنطرة السد في طريق مصر العتيقة {cite:shadharat-dhahab p. 588}."
  en: "The majdhub of the Citadel's Red Tower — twenty years there, then he sent word to al-Ghuri: 'leave the citadel, give the keys to their owners'; dismissed as a madman, he descended to Cairo — and a year later the Circassian state fell. Barefoot and bare-headed, he warned visitors of coming afflictions and went a month sleepless murmuring dhikr; d. 940, buried at Qantarat al-Sadd {cite:shadharat-dhahab p. 588}."
