summary:
  ar: "الشماخ بن ضرار الثملي ويقال التغلبي شاعر؛ كان مع سعيد بن العاص في غزوة أذربيجان وقال في بكير بن شداد: وغنيت عن خيل بموقان أسلمت بكير بني الشداخ فارس أطلال."
  en: "Al-Shammakh ibn Dirar al-Thumali — some say al-Taghlibi — the poet; he rode Sa'id ibn al-As's Azerbaijan raid and sang of Bukayr ibn Shaddad, knight of Atlal."
  fr: "Al-Shammakh ibn Dirar al-Thumali - certains disent al-Taghlibi - le poète ; il a chevauché le raid de Sa'id ibn al-As en Azerbaïdjan et a chanté Bukayr ibn Shaddad, chevalier d'Atlal."
  es: "Al-Shammakh ibn Dirar al-Thumali (algunos dicen que al-Taghlibi) el poeta; dirigió la incursión de Sa'id ibn al-As en Azerbaiyán y cantó sobre Bukayr ibn Shaddad, caballero de Atlal."
  ur: "الشمخ ابن دیر الثمالی - کچھ کہتے ہیں الطغلبی - شاعر؛ اس نے سعید بن العاص کے آذربائیجان کے چھاپے پر سواری کی اور بکر ابن شداد کا گانا گایا جو اٹل کے نائٹ تھا۔"
  tr: "El-Şamax bin Zirar-el-Thumli, aynı zamanda el-Taghlibi olarak da bilinir, bir şairdi; Azerbaycan seferinde Said ibn al-As ile birlikteydi ve Bukir ibn Shaddad hakkında şöyle demiştir: Muqan'ın atları için şarkı söyledim ve harabe şövalyesi Bukayr Banu al-Shadakh'ı kucakladım."
  id: "Al-Shamakh ibn Dhirar al-Thumli, juga disebut al-Taghlibi, adalah seorang penyair; ia bersama Sa'id ibn al-As selama ekspedisi Azerbaijan dan berkata tentang Bukir ibn Shaddad: Saya bernyanyi untuk kuda-kuda Muqan, dan saya memeluk Bukayr Banu al-Shadakh, seorang ksatria reruntuhan."
