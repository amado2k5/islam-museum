summary:
  ar: "طاهر بن محمد بن عمرو بن الليث الصفاري؛ ملك بلاد فارس بعد أسر جده عمرو بن الليث لاثنتي عشرة ليلة بقيت من صفر سنة ثمان وثمانين ومائتين؛ ثم قبض عليه غلام جسده سبك السبكري في سنة ست وتسعين ومائتين ومعه أخوه يعقوب بن محمد وبعث بهما إلى مدينة السلام {cite:wafayat-ayan}."
  en: "Tahir b. Muhammad b. Amr b. al-Layth — Saffarid prince who ruled Fars after his grandfather Amr's capture (288); seized by his own ghulam Subuk in 296 and sent to Baghdad with his brother Ya'qub {cite:wafayat-ayan}."
  es: "Tahir b. Muhammad b. Amr b. al-Layth — Príncipe saffarí que gobernó Fars después de la captura de su abuelo Amr (288); apresado por su propio ghulam Subuk en 296 y enviado a Bagdad con su hermano Ya'qub {cite:wafayat-ayan}."
  fr: "Tahir b. Muhammad b. Amr b. al-Layth — Prince saffaride qui régna sur le Fars après la capture de son grand-père Amr (288); capturé par son propre ghulam Subuk en 296 et envoyé à Bagdad avec son frère Ya'qub {cite:wafayat-ayan}."
  ur: "طاہر ب۔ محمد بی عمرو بی اللیث - صفری شہزادہ جس نے اپنے دادا عمرو کی گرفتاری کے بعد فارس پر حکومت کی (288)؛ 296 میں اس کے اپنے غلام سبوک نے قبضہ کر لیا اور اپنے بھائی یعقوب کے ساتھ بغداد بھیج دیا۔"
  tr: "Tahir ibn Muhammed ibn Amr ibn al-Layth al-Saffari; büyükbabası Amr ibn al-Layth, 288 Hicri yılında Safar'den on iki gece kaldıktan sonra Pers kralı; ardından hizmetkarı Subk al-Subkari, 296 Hicri'de onu kardeşi Ya'qub ibn Muhammed ile birlikte yakalayıp barış şehrine gönderdi {atıf:wafayat-ayan}."
  id: "Tahir ibn Muhammad ibn Amr ibn al-Layth al-Saffari; raja Persia setelah kakeknya Amr ibn al-Layth ditangkap selama dua belas malam yang tersisa dari Safar pada tahun 288 H; kemudian hambanya Subk al-Subkari menangkapnya pada tahun 296 H bersama saudaranya Ya'qub ibn Muhammad, dan mengirim mereka ke kota damai {cite:wafayat-ayan}."
