summary:
  ar: "عابدة واعظة من الأبلة قرب البصرة، يصفها ابن الجوزي في «صفة الصفوة» بكثرة البكاء ومجالس الوعظ التي كان يشهدها الزهاد؛ زارها الفضيل بن عياض، ووصفت نفسها بأنها أمة سوداء، وحجت مع زوجها."
  en: "A devout woman preacher of al-Ubulla near Basra, described by Ibn al-Jawzi in Sifat al-Safwa for her weeping and for the gatherings of admonition that ascetics attended; al-Fudayl ibn Iyad visited her, she called herself 'a black slave-woman', and she made the pilgrimage with her husband."
  ur: "بصرہ کے قریب ابلہ کی ایک عابدہ واعظہ؛ ابن الجوزی «صفۃ الصفوہ» میں ان کے گریہ اور ان وعظ کی مجالس کا ذکر کرتے ہیں جن میں زاہد شریک ہوتے؛ فضیل بن عیاض ان سے ملنے آئے، وہ خود کو «ایک سیاہ فام کنیز» کہتیں، اور اپنے شوہر کے ساتھ حج کیا۔"
