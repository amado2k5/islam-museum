gender: female
roles: [mystic]
summary:
  ar: "عابدة واعظة من الأبلة قرب البصرة، يصفها ابن الجوزي في «صفة الصفوة» بكثرة البكاء ومجالس الوعظ التي كان يشهدها الزهاد؛ زارها الفضيل بن عياض، ووصفت نفسها بأنها أمة سوداء، وحجت مع زوجها."
  en: "A devout woman preacher of al-Ubulla near Basra, described by Ibn al-Jawzi in Sifat al-Safwa for her weeping and for the gatherings of admonition that ascetics attended; al-Fudayl ibn Iyad visited her, she called herself 'a black slave-woman', and she made the pilgrimage with her husband."
  ur: "بصرہ کے قریب ابلہ کی ایک عابدہ واعظہ؛ ابن الجوزی «صفۃ الصفوہ» میں ان کے گریہ اور ان وعظ کی مجالس کا ذکر کرتے ہیں جن میں زاہد شریک ہوتے؛ فضیل بن عیاض ان سے ملنے آئے، وہ خود کو «ایک سیاہ فام کنیز» کہتیں، اور اپنے شوہر کے ساتھ حج کیا۔"
  es: "Una devota predicadora de al-Ubulla, cerca de Basora, descrita por Ibn al-Jawzi en Sifat al-Safwa por su llanto y por las reuniones de exhortación a las que asistían los ascetas; al-Fudayl ibn Iyad la visitó, ella se autodenominó \"una esclava negra\" y realizó la peregrinación con su marido."
  fr: "Une fervente prédicatrice d'al-Ubulla près de Bassora, décrite par Ibn al-Jawzi dans Sifat al-Safwa pour ses pleurs et pour les réunions d'admonition auxquelles assistaient des ascètes; al-Fudayl ibn Iyad lui rendit visite, elle se qualifia elle-même d'« esclave noire », et elle fit le pèlerinage avec son mari."
  tr: "Basra yakınlarındaki El-Abla'dan dindar bir vaiz, İbn el-Cavazi tarafından 'Sifat al-Safwa'da sık sık ağlayan ve münzevilerin katıldığı vaazlara katılan biri olarak tanımlanır; el-Fudayl ibn 'İyad, onu ziyaret etti, kendini siyah bir millet olarak tanımladı ve kocasıyla birlikte Hac yaptı."
  id: "Seorang pengkhotbah taat dari Al-Abla dekat Basra, yang digambarkan oleh Ibn al-Jawzi dalam 'Sifat al-Safwa' sebagai sering menangis dan menghadiri sesi khotbah yang dihadiri para pertapa; al-Fudayl ibn 'Iyad mengunjunginya, menggambarkan dirinya sebagai bangsa kulit hitam, dan melaksanakan Haji bersama suaminya."
