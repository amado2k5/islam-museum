  ar: "ابن أخي صاحب الشامل"
  en: "Ibn Akhi Sahib al-Shamil"
  es: "Ibn Akhi Sahib al-Shamil"
  fr: "Ibn Akhi Sahib al-Shamil"
roles: [scholar, jurist]
gender: male
summary:
  ar: "أحمد بن محمد بن عبد الواحد، أبو منصور بن الصباغ البغدادي، ابن أخي الشيخ أبي نصر بن الصباغ صاحب كتاب الشامل وزوج ابنته، فقيه شافعي تفقه على عمه وعلى القاضي أبي الطيب، وسمع الحديث، وروى عنه محمد بن طاهر المقدسي وآخرون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} قال ابن النجار إنه كان فقيهاً فاضلاً حافظاً للمذهب، وله مصنفات ومجموعات حسنة، وجمع السبكي فتاواه من كلام عمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  en: "Ahmad ibn Muhammad ibn Abd al-Wahid, Abu Mansur ibn al-Sabbagh of Baghdad, nephew and son-in-law of Abu Nasr ibn al-Sabbagh, author of al-Shamil. A Shafi'i jurist, he studied with his uncle and with al-Qadi Abu al-Tayyib, heard hadith and transmitted to Muhammad ibn Tahir al-Maqdisi and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} Ibn al-Najjar called him an excellent jurist who knew the school by heart and left good works; al-Subki says his fatwas were collected from his uncle's words. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  es: "Ahmad ibn Muhammad ibn Abd al-Wahid, Abu Mansur ibn al-Sabbagh de Bagdad, sobrino y yerno de Abu Nasr ibn al-Sabbagh, autor de al-Shamil. Jurista shafi'í, estudió con su tío y con al-Qadi Abu al-Tayyib, escuchó hadices y los transmitió a Muhammad ibn Tahir al-Maqdisi y a otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636} Ibn al-Najjar lo describió como un excelente jurista que conocía la escuela a la perfección y dejó una buena obra; al-Subki afirma que sus fatuas fueron recopiladas de las palabras de su tío. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16636}"
  fr: "Ahmad ibn Muhammad ibn Abd al-Wahid, Abu Mansur ibn al-Sabbagh de Bagdad, neveu et gendre d'Abu Nasr ibn al-Sabbagh, auteur d'al-Shamil, était un juriste chaféite. Il étudia auprès de son oncle et du cadi Abu al-Tayyib, recueillit des hadiths et les transmit à Muhammad ibn Tahir al-Maqdisi et à d'autres. Ibn al-Najjar le qualifiait d'excellent juriste, connaissant parfaitement l'école et ayant laissé une œuvre remarquable; al-Subki affirme que ses fatwas étaient tirées des écrits de son oncle."
