summary:
  ar: "صحابي أوسي بدري من أهل بدر؛ ثبت يوم أحد حين انكشف الناس ونضح عن النبي بالنبل، وشهد الخندق والمشاهد كلها، واستخلفه علي على البصرة بعد الجمل ومات بالكوفة سنة ثمان وثلاثين."
  en: "An Awsi Badri Companion; he stood firm at Uhud when the ranks broke and shielded the Prophet with his arrows, witnessed the Trench and all the battles, governed Basra for Ali after the Camel, and died at Kufa in 38 AH."
  ur: "اوسی بدری صحابی؛ احد میں صفوف ٹوٹنے پر ثابت قدم رہے اور نبی کو اپنے تیروں سے ڈھال بنایا؛ خندق میں شریک۔"
  es: "Fue un compañero de Awsi Badri; se mantuvo firme en Uhud cuando las filas se rompieron y protegió al Profeta con sus flechas, presenció la trinchera y todas las batallas, gobernó Basora para Ali después del Camello y murió en Kufa en el año 38 de la Hégira."
  fr: "Compagnon d'Awsi Badri, il resta ferme à Uhud lorsque les rangs se brisèrent et protégea le Prophète avec ses flèches, fut témoin du Fossé et de toutes les batailles, gouverna Bassora pour Ali après le Chameau et mourut à Kufa en 38 AH."
  tr: "Uhud gününde insanlar ifşa edildiğinde Uhud halkından Awsi Badri'nin sahabesi, Peygamber'in soylular tarafından serpildiği zaman, tüm siperleri ve savaş alanlarını gördü ve Ali onu Deve Atlayı'ndan sonra Basra'nın yardımcısı olarak atadı; otuz sekizinci yılda Kufa'da öldü."
  id: "Sahabat Awsi Badri dari masyarakat Badr tetap teguh pada hari Uhud ketika orang-orang terbongkar dan Nabi dipenuhi bangsawan, menyaksikan semua parit dan medan perang, dan Ali mengangkatnya sebagai wakilnya atas Basra setelah Unta, dan ia wafat di Kufa pada tahun tiga puluh delapan."
