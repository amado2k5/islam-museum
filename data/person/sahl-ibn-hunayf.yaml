summary:
  ar: "صحابي أوسي بدري من أهل بدر؛ ثبت يوم أحد حين انكشف الناس ونضح عن النبي بالنبل، وشهد الخندق والمشاهد كلها، واستخلفه علي على البصرة بعد الجمل ومات بالكوفة سنة ثمان وثلاثين."
  en: "An Awsi Badri Companion; he stood firm at Uhud when the ranks broke and shielded the Prophet with his arrows, witnessed the Trench and all the battles, governed Basra for Ali after the Camel, and died at Kufa in 38 AH."
  ur: "اوسی بدری صحابی؛ احد میں صفوف ٹوٹنے پر ثابت قدم رہے اور نبی کو اپنے تیروں سے ڈھال بنایا؛ خندق میں شریک۔"
