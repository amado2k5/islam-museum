summary:
  ar: "فقيه حنبلي من أهل حرّان، تفقه على الشيخ مجد الدين ابن تيمية وعلى أبي الفرج ابن أبي الفهم وناصر الدين البيضاوي وغيرهم، وصنف كتاب «المختصر» في الفقه، وقد وصل فيه إلى أثناء الزكاة، وهو مشهور يدل على علم صاحبه وجودة فهمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5137}"
  en: "A Hanbali jurist from Harran who studied under Majd al-Din Ibn Taymiyya, Abu al-Faraj Ibn Abi al-Fahm and Nasir al-Din al-Baydawi among others. He wrote the widely known Mukhtasar on law, which reaches the chapter on zakat; the book shows the learning and understanding of its author. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5137}"
