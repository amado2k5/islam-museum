summary:
  ar: "فقيه حنبلي من أهل حرّان، تفقه على الشيخ مجد الدين ابن تيمية وعلى أبي الفرج ابن أبي الفهم وناصر الدين البيضاوي وغيرهم، وصنف كتاب «المختصر» في الفقه، وقد وصل فيه إلى أثناء الزكاة، وهو مشهور يدل على علم صاحبه وجودة فهمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5137}"
  en: "A Hanbali jurist from Harran who studied under Majd al-Din Ibn Taymiyya, Abu al-Faraj Ibn Abi al-Fahm and Nasir al-Din al-Baydawi among others. He wrote the widely known Mukhtasar on law, which reaches the chapter on zakat; the book shows the learning and understanding of its author. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5137}"
  es: "Un jurista hanbalí de Harran que estudió con Majd al-Din Ibn Taymiyya, Abu al-Faraj Ibn Abi al-Fahm y Nasir al-Din al-Baydawi, entre otros. Escribió el conocido Mukhtasar sobre derecho, que incluye el capítulo sobre el zakat; el libro demuestra la erudición y comprensión de su autor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5137}"
  fr: "Juriste hanbalite originaire de Harran, il étudia notamment auprès de Majd al-Din Ibn Taymiyya, Abu al-Faraj Ibn Abi al-Fahm et Nasir al-Din al-Baydawi. Il est l'auteur du célèbre Mukhtasar, traité de droit qui aborde la question de la zakat; cet ouvrage témoigne de l'érudition et de la profondeur de compréhension de son auteur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5137}"
  ur: "حران سے تعلق رکھنے والا ایک حنبلی فقیہ جس نے مجد الدین ابن تیمیہ، ابو الفراج ابن ابی الفہم اور ناصر الدین البیضاوی سے تعلیم حاصل کی۔ انہوں نے قانون پر وسیع پیمانے پر مشہور مختاسر لکھا، جو زکوٰۃ کے باب تک پہنچتا ہے۔ کتاب اپنے مصنف کے سیکھنے اور سمجھنے کو ظاہر کرتی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 5137}"
  tr: "Harran halkından bir Hanbali hukukçu olan Sher, Şeyh Majd el-Din İbn Teymiyye, Ebu el-Faraj bin Ebi el-Fahm, Nasır el-Din el-Beydavi ve diğerlerinden fıkıh eğitimi aldı. Zekât zamanında ulaştığı 'El-Muhtasar' adlı fıkıh kitabını yazdı. Bu kitap, bilimsel bilgisini ve kavrayış kalitesini gösteren iyi bilinir. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-V3 s.5137}"
  id: "Sebagai ahli hukum Hanbali dari masyarakat Harran, ia mempelajari hukum di bawah bimbingan Sheikh Majd al-Din Ibn Taymiyyah, Abu al-Faraj ibn Abi al-Fahm, Nasir al-Din al-Baydawi, dan lainnya. Ia menulis buku 'Al-Mukhtasar' dalam bidang firisprudensi, yang ia capai selama masa zakat. Buku ini sangat terkenal, menunjukkan pengetahuan ilmiah dan kualitas pemahamannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5137}"
