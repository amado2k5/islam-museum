summary:
  ar: "لاعب كريكت أفغاني وقائد منتخب أفغانستان في مباريات العشرين الدولية، وُلد في ننكرهار سنة 1998 لأسرة بشتونية من الشينواري أصلها جلال آباد. رامٍ يدور الكرة بكسر الساق بالذراع اليمنى وضارب أيمن هجومي، لعب في أول مباراة اختبار لأفغانستان سنة 2018، وصار أصغر قائد لفريق اختبار في التاريخ سنة 2019 بعمر 20 سنة و350 يوما، وأصغر لاعب يتصدر تصنيف المجلس الدولي لراميي مباريات اليوم الواحد والعشرينيات سنة 2018، وأسرع رامٍ يبلغ 100 ويكيت في مباريات اليوم الواحد (44 مباراة) وفي العشرينيات الدولية (53 مباراة)، ونال جائزة لاعب العقد في العشرينيات الدولية سنة 2020، ويحمل الرقم القياسي لأكثر الويكيت في العشرينيات الدولية، ويلعب في دوريات الامتياز حول العالم منها الدوري الهندي الممتاز والدوري الباكستاني الممتاز ودوري بيغ باش الأسترالي."
  en: "Afghan cricketer and captain of the Afghanistan national team in Twenty20 Internationals, born in Nangarhar in 1998 to a Shinwari Pashtun family from Jalalabad. A right-arm leg-spin bowler and aggressive right-handed batter, he played in Afghanistan's first Test match in 2018, became the youngest cricketer to captain a Test team in 2019 at 20 years and 350 days, became the youngest player to top the ICC bowler rankings in both ODIs and T20Is in 2018, is the fastest bowler to 100 ODI wickets (44 matches) and to 100 T20I wickets (53 matches), was named the ICC Men's T20I Cricketer of the Decade in 2020, holds the record for the most wickets in men's T20 Internationals, and plays in franchise leagues worldwide including the IPL, the PSL and Australia's Big Bash League."
  ur: "افغان کرکٹ کھلاڑی اور ٹی ٹوئنٹی بین الاقوامی کرکٹ میں افغانستان کی قومی ٹیم کے کپتان، جو 1998 میں ننگرہار میں جلال آباد سے تعلق رکھنے والے شنواری پشتون خاندان میں پیدا ہوئے۔ دائیں ہاتھ سے لیگ اسپن گیند بازی کرنے والے اور جارحانہ دائیں ہاتھ کے بلے باز کی حیثیت سے انھوں نے 2018 میں افغانستان کے پہلے ٹیسٹ میچ میں شرکت کی، 2019 میں 20 برس 350 دن کی عمر میں ٹیسٹ ٹیم کی کپتانی کرنے والے سب سے کم عمر کھلاڑی بنے، 2018 میں ایک روزہ اور ٹی ٹوئنٹی دونوں میں آئی سی سی گیند بازوں کی درجہ بندی میں سرفہرست رہنے والے سب سے کم عمر کھلاڑی بنے، ایک روزہ کرکٹ میں سب سے تیز 100 وکٹیں (44 میچ) اور ٹی ٹوئنٹی بین الاقوامی میں سب سے تیز 100 وکٹیں (53 میچ) مکمل کیں، 2020 میں دہائی کے بہترین مرد ٹی ٹوئنٹی کھلاڑی قرار پائے، مردوں کی ٹی ٹوئنٹی بین الاقوامی کرکٹ میں سب سے زیادہ وکٹوں کا ریکارڈ رکھتے ہیں، اور آئی پی ایل، پی ایس ایل اور آسٹریلیا کی بگ بیش لیگ سمیت دنیا بھر کی فرنچائز لیگز میں کھیلتے ہیں۔"
