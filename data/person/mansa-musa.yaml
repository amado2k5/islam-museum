id: person/mansa-musa
class: person
label:
  ar: منسا موسى
  en: Mansa Musa
summary:
  ar: أشهر ملوك مالي وأعظمهم، ملك نحو ربع قرن وحج بيت الله سنة 724هـ في موكب جاوزت وصائفه اثني عشر ألفاً لابسات أقبية الديباج والحرير اليماني، فكثر الكلام عن بذله وسعة ملكه حتى اشتهرت مملكة مالي في المغرب ومصر والمشرق، وتبادل الهدايا مع السلطان المريني أبي الحسن فكان من جملة ما بعث إليه الزرافة التي تحدث بها أهل المغرب دهراً.
  en: The most famous and greatest of Mali's kings, who reigned about a quarter of a century and made the hajj in 724 AH in a procession of over twelve thousand attendants clad in brocade and Yemeni silk, his largesse and the breadth of his realm becoming proverbial across the Maghreb, Egypt and the East; he exchanged gifts with the Marinid sultan Abu al-Hasan, among them the giraffe that the Maghreb talked about for an age.
