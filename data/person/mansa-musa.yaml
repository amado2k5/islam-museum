label:
  ar: منسا موسى
  en: Mansa Musa
summary:
  ar: "منسا موسى ملك مالي، ويحدد له مقال دائرة المعارف الإسلامية مدة حكم من 712 إلى 738هـ/1312-1337م، وكانت مالي في عهده في ذروة ازدهارها. حج سنة 1324م في موكب ضخم مر بتنبكتو والقاهرة وترك أثرًا عميقًا في المصريين، ثم عاد بالمعماري الأندلسي أبي إسحاق الساحلي وأربعة من الأشراف القرشيين، وبنى مساجد وأرسل علماء إلى فاس وتبادل السفارات مع السلطان المريني أبي الحسن. وتحفظ التقاليد الشفهية في السودان ذكره في أسطورة فاجيجي."
  en: "Mansa Musa was king of Mali; the Encyclopaedia of Islam gives his reign as 712 to 738 AH, 1312 to 1337, at the peak of Mali's prosperity. He made the pilgrimage in 1324 with a vast entourage that passed through Timbuktu and Cairo and deeply impressed the Egyptians, and returned with the Andalusian architect Abu Ishaq al-Sahili and four sharifs of Quraysh. He built mosques, sent scholars to Fes and exchanged embassies with the Marinid sultan Abu al-Hasan, and oral tradition in the Sudan remembers him in the Fajigi legend."
  ur: "منسا موسیٰ مالی کے بادشاہ تھے؛ دائرۃ المعارف اسلامیہ ان کا دورِ حکومت 712ھ سے 738ھ یعنی 1312ء سے 1337ء بتاتی ہے، جب مالی خوشحالی کے عروج پر تھا۔ انہوں نے 1324ء میں بڑے قافلے کے ساتھ حج کیا جو تمبکتو اور قاہرہ سے گزرا اور مصریوں پر گہرا اثر چھوڑ گیا، اور وہ اندلسی معمار ابو اسحاق الساحلی اور قریش کے چار شرفا کو ساتھ لائے۔ انہوں نے مسجدیں بنوائیں، علما کو فاس بھیجا اور مرینی سلطان ابو الحسن سے سفارتوں کا تبادلہ کیا، اور سوڈان کی زبانی روایت انہیں فاجیجی کی کہانی میں یاد رکھتی ہے۔"
