summary:
  ar: "أبو الحسن محمد بن علي بن سهل بن مصلح الماسرجسي، فقيه شافعي نيسابوري، تفقه بخراسان والعراق والحجاز وصحب أبا إسحاق المروزي إلى مصر، ودرس بنيسابور بعد عودته سنة 344 هـ وتفقه عليه القاضي أبو الطيب الطبري، وتوفي سنة 384 هـ عن ست وسبعين سنة، وقيل سنة 383 هـ."
  en: "Abu l-Hasan Muhammad ibn Ali ibn Sahl ibn Muslih al-Masarjisi, a Shafi'i jurist of Nishapur; he studied in Khurasan, Iraq and the Hijaz and accompanied Abu Ishaq al-Marwazi to Egypt, taught in Nishapur after returning in 344 AH, where the qadi Abu l-Tayyib al-Tabari studied under him; died in 384 AH at seventy-six, though 383 AH is also given."
  fr: "Abu l-Hasan Muhammad ibn Ali ibn Sahl ibn Muslih al-Masarjisi, juriste shafiite de Nishapur ; il étudia au Khurasan, en Irak et au Hijaz et accompagna Abu Ishaq al-Marwazi en Égypte, enseigna à Nishapur après son retour en 344 H, où le cadi Abu l-Tayyib al-Tabari étudia auprès de lui ; mort en 384 H à soixante-seize ans, bien que 383 H soit aussi donné."
