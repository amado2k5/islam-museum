label: { ar: "السلطان الظاهر جقمق", en: "Sultan al-Zahir Jaqmaq" }
summary:
  ar: "الملك الظاهر أبو سعيد جقمق بن عبد الله العلائي الظاهري سلطان الديار المصرية والبلاد الشامية والأقطار الحجازية الرابع والثلاثون من ملوك الترك والعاشر من الجراكسة، في شذرات الذهب أقيم سلطاناً سنة اثنتين وأربعين وثمان مئة بعد خلع الملك العزيز بن برسباي إذ كان له في السلطنة ثلاثة أشهر وتوطدت لجقمق الدولة خصوصاً بعد أن قتل نائب حلب ونائب الشام لما خرجا عن طاعته وغزا في أيامه رودس ولم يفتحها وعمر في أيامه أشياء كثيرة من مساجد وجوامع وقناطر وجسور وعمر عين حنين وأصلح مجاريها وعمر مسجد الخيف بمنى وجدد في الحرم الشريف مواضع ومرم الكعبة وصرف مالاً عظيماً في جهات الخير وكان مغرماً بحب الأيتام والإحسان إليهم محباً للعلماء والفقهاء والأشراف والصالحين يقوم لمن يدخل عليه منهم فقيهاً فاضلاً شجاعاً عارفاً بأنواع الفروسية لم يزن ولم يلط ولم يسكر عفيفاً عن المنكرات والفروج لا يُعلم أحد من ملوك مصر في الدولة الأيوبية والتركية على طريقته من العفة والعبادة مرض في أواخر ذي الحجة سنة ست وخمسين وخلع نفسه من السلطنة يوم الخميس الحادي والعشرين من محرم هذه السنة وسلطن ولده الملك المنصور عثمان ثم توفي ليلة الثلاثاء ثالث صفر بعد خلعه باثني عشر يوماً عن نيف وثمانين سنة وكانت مدة سلطنته أربع عشرة سنة وعشرة أشهر ثم خلع ولده المنصور بعد أربعين يوماً من ولايته وحبس بالإسكندرية وتولى السلطنة الملك الأشرف إينال {cite:shadharat-dhahab p. 299-300}."
  en: "Tenth Circassian sultan (842-857): took power after the three-month reign of Barsbay's son, campaigned vainly at Rhodes, restored the pilgrim works at Ayn Hunayn and Mina's Khayf mosque, and — 'no king of Egypt in the Ayyubid or Turkish state matched his piety' — abdicated to his son, dying twelve days later at eighty {cite:shadharat-dhahab p. 299-300}."
