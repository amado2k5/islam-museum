label: { ar: "السلطان الظاهر جقمق", en: "Sultan al-Zahir Jaqmaq", es: "Sultan al-Zahir Jaqmaq", fr: "Sultan al-Zahir Jaqmaq", ur: "سلطان الظاہر جقمق" }
summary:
  ar: "الملك الظاهر أبو سعيد جقمق بن عبد الله العلائي الظاهري سلطان الديار المصرية والبلاد الشامية والأقطار الحجازية الرابع والثلاثون من ملوك الترك والعاشر من الجراكسة، في شذرات الذهب أقيم سلطاناً سنة اثنتين وأربعين وثمان مئة بعد خلع الملك العزيز بن برسباي إذ كان له في السلطنة ثلاثة أشهر وتوطدت لجقمق الدولة خصوصاً بعد أن قتل نائب حلب ونائب الشام لما خرجا عن طاعته وغزا في أيامه رودس ولم يفتحها وعمر في أيامه أشياء كثيرة من مساجد وجوامع وقناطر وجسور وعمر عين حنين وأصلح مجاريها وعمر مسجد الخيف بمنى وجدد في الحرم الشريف مواضع ومرم الكعبة وصرف مالاً عظيماً في جهات الخير وكان مغرماً بحب الأيتام والإحسان إليهم محباً للعلماء والفقهاء والأشراف والصالحين يقوم لمن يدخل عليه منهم فقيهاً فاضلاً شجاعاً عارفاً بأنواع الفروسية لم يزن ولم يلط ولم يسكر عفيفاً عن المنكرات والفروج لا يُعلم أحد من ملوك مصر في الدولة الأيوبية والتركية على طريقته من العفة والعبادة مرض في أواخر ذي الحجة سنة ست وخمسين وخلع نفسه من السلطنة يوم الخميس الحادي والعشرين من محرم هذه السنة وسلطن ولده الملك المنصور عثمان ثم توفي ليلة الثلاثاء ثالث صفر بعد خلعه باثني عشر يوماً عن نيف وثمانين سنة وكانت مدة سلطنته أربع عشرة سنة وعشرة أشهر ثم خلع ولده المنصور بعد أربعين يوماً من ولايته وحبس بالإسكندرية وتولى السلطنة الملك الأشرف إينال {cite:shadharat-dhahab p. 299-300}."
  en: "Tenth Circassian sultan (842-857): took power after the three-month reign of Barsbay's son, campaigned vainly at Rhodes, restored the pilgrim works at Ayn Hunayn and Mina's Khayf mosque, and — 'no king of Egypt in the Ayyubid or Turkish state matched his piety' — abdicated to his son, dying twelve days later at eighty {cite:shadharat-dhahab p. 299-300}."
  es: "Décimo sultán circasiano (842-857): tomó el poder después del reinado de tres meses del hijo de Barsbay, hizo campaña en vano en Rodas, restauró las obras de peregrinación en Ayn Hunayn y la mezquita Khayf de Mina, y —«ningún rey de Egipto en el estado ayubí o turco igualó su piedad»— abdicó en favor de su hijo, muriendo doce días después a los ochenta años {cite:shadharat-dhahab p. 299-300}."
  fr: "Dixième sultan circassien (842-857): prit le pouvoir après le règne de trois mois du fils de Barsbay, mena une campagne vaine à Rhodes, restaura les œuvres de pèlerinage à Ayn Hunayn et la mosquée Khayf de Mina, et — « aucun roi d'Égypte dans l'État ayyoubide ou turc n'égala sa piété » — abdiqua en faveur de son fils, mourant douze jours plus tard à quatre-vingts ans {cite: shadharat-dhahab p. 299-300}."
  ur: "دسویں سرکیسیئن سلطان (842-857): بارسبے کے بیٹے کے تین ماہ کے دور حکومت کے بعد اقتدار سنبھالا، روڈز میں بیکار مہم چلائی، عین حنین اور مینا کی خیف مسجد میں زائرین کے کاموں کو بحال کیا، اور - 'ایوبی یا ترکی میں مصر کا کوئی بادشاہ نہیں تھا' - بعد میں اس کے بیٹے کے ساتھ مل کر اس کے بیٹے کی بادشاہت سے میل کھاتا تھا۔ اسّی پر {حوالہ: شدھارت ذہاب ص۔ 299-300}۔"
  tr: "Kral Al-Zahir Abu Sa'id Jaqmaq bin Abdullah Al-Al-Alai Al-Zahiri, Mısır, Levant ve Hicazi topraklarının Sultanı, Türklerin otuz dördüncü ve Çerkeslerin onuncu kralı idi. Kral Al-Aziz bin Barsbay'ın tahttan indirilmesinden sonra, üç ay iktidarda kaldığı için 842 Hicri yılında Şadharat al-Dhahab'da sultan olarak kuruldu. Jaqmaq'ın devleti, özellikle Halep milletvekilini ve Suriye milletvekilini itaatsizlik ettiklerinde öldürdükten sonra sağlamlaştı. Saltanatı sırasında Rodos'u işgal etti ancak fethedemedi. Saltanatı sırasında birçok şey inşa edildi Camiler, camiler, köprüler, Ayn Hanin'in yaşı ve güzergahı onarıldı, Mina'daki Hayf Camii Kutsal Camii'nde ve Kabe'nin meramında yenilendi, iyilik yollarına büyük para harcadı; yetimleri sevmeye ve onlara iyilik yapmaya, alimleri, hukukçuları, soyluları ve doğru olanları sevmeye tutkuyla bağlıydı. Aralarına girenlerin yanında erdemli, cesur, binicilik türlerini bilen, tartmayan, eğilmeyen, sarhoş olmayan, kötülüklerden ve tavuklardan iffetli biri olarak ayağa kalktı. Eyyubi ve Türk devletlerindeki Mısır kralları arasında kimse onun iffet ve ibadet biçimini bilmez. Elli altıncı yılın Zulhicce ayının sonunda, o yılın Muharrem'in yirmi birinci günü Perşembe günü sultanlıktan feragat etti ve oğlu el-Mansur Osman iktidara geldi. Tahttan çekildikten on iki gün sonra, Sefer'in üçüncü Salı gecesi, seksen iki yaşında öldü. Saltanatı on dört yıl on ay sürdü. Oğlu el-Mansur, saltanatından kırk gün sonra tahttan indirildi, İskenderiye'de hapsedildi ve Kral el-Eşref İnal sultanlığı devraldı {kaynak:shadharat-dhahab, s. 299-300}."
  id: "Raja Al-Zahir Abu Sa'id Jaqmaq bin Abdullah Al-Alai Al-Zahiri adalah Sultan Mesir, Levant, dan wilayah Hejazi, raja ke-34 Turki dan raja kesepuluh Circassia. Ia diangkat sebagai Sultan di Shadharat al-Dhahab pada tahun 842 H setelah penggulingan Raja Al-Aziz bin Barsbay, karena ia memiliki masa jabatan selama tiga bulan. Negara Jaqmaq menjadi lebih kuat, terutama setelah ia membunuh wakil Aleppo dan wakil Suriah ketika mereka membangkang. Ia menyerbu Rhodes selama masa pemerintahannya tetapi tidak menaklukkannya. Selama masa pemerintahannya, banyak hal dibangun Masjid, masjid, jembatan, dan zaman Ain Hanin beserta alurnya diperbaiki, dan Masjid Al-Khayf di Mina direnovasi di Masjid Suci serta tempat-tempat dan maram Ka'bah serta menghabiskan banyak uang untuk tujuan kebaikan dan ia sangat bersemangat untuk mengasihi anak yatim piatu dan berbuat baik kepada mereka, mencintai para cendekiawan, ahli hukum, bangsawan, dan orang benar. Ia membela mereka yang masuk di antara mereka sebagai seorang yang berbudi luhur, berani, berpengetahuan tentang jenis penunggang kuda, yang tidak bertimbang tubuh, tidak membungkuk, dan tidak mabuk, suci dari kejahatan dan ayam. Tidak ada seorang pun raja Mesir di negara Ayyubiyah dan Turki yang mengetahui cara kesucian dan ibadahnya. Sebuah penyakit di Pada akhir Dhu al-Hijjah tahun lima puluh enam, ia turun tahta dari kesultanan pada hari Kamis, tanggal dua puluh satu Muharram tahun itu, dan putranya al-Mansur Uthman mengambil alih kekuasaan. Ia meninggal pada malam Selasa, tanggal tiga Safar, dua belas hari setelah turun tahta, pada usia delapan puluh dua tahun. Pemerintahannya berlangsung selama empat belas tahun sepuluh bulan. Putranya al-Mansur digulingkan empat puluh hari setelah pemerintahannya, dipenjara di Alexandria, dan Raja al-Ashraf Inal mengambil alih kesultanan {cite:shadharat-dhahab, hlm. 299-300}."
