summary:
  ar: "ملك ليبيا (1889–1983)؛ وُلد بالجغبوب، وخلف ابن عمه أحمد الشريف في زعامة الطريقة السنوسية 1916، وصار أمير برقة ثم طرابلس، فنُفي إلى مصر زمن الاستعمار الإيطالي، ثم أُعلن ملكًا على المملكة الليبية المتحدة في 24 ديسمبر 1951 حتى أطاح به انقلاب 1 سبتمبر 1969، فعاش منفيًا في القاهرة حيث توفي ودُفن بالبقيع في المدينة المنورة."
  en: "King of Libya (1889–1983). Born at Jaghbub, he succeeded his cousin Ahmed Sharif as head of the Senussi order in 1916, became Emir of Cyrenaica and then of Tripolitania, spent the Italian colonial period in exile in Egypt, and was proclaimed king of the United Kingdom of Libya on 24 December 1951; deposed by the coup of 1 September 1969, he lived in exile in Cairo, where he died, and was buried in Al-Baqi Cemetery, Medina."
  ur: "لیبیا کے بادشاہ (1889–1983)؛ جغبوب میں پیدا ہوئے، 1916 میں اپنے چچا زاد احمد الشریف کے بعد سنوسی سلسلے کے سربراہ بنے، برقہ اور پھر طرابلس کے امیر ہوئے، اطالوی دور میں مصر میں جلاوطنی گزاری، اور 24 دسمبر 1951 کو متحدہ مملکتِ لیبیا کے بادشاہ قرار پائے؛ یکم ستمبر 1969 کی بغاوت میں معزول ہو کر قاہرہ میں جلاوطنی میں وفات پائی اور مدینہ کے جنت البقیع میں دفن ہوئے۔"
