summary:
  ar: "ملك ليبيا (1889–1983)؛ وُلد بالجغبوب، وخلف ابن عمه أحمد الشريف في زعامة الطريقة السنوسية 1916، وصار أمير برقة ثم طرابلس، فنُفي إلى مصر زمن الاستعمار الإيطالي، ثم أُعلن ملكًا على المملكة الليبية المتحدة في 24 ديسمبر 1951 حتى أطاح به انقلاب 1 سبتمبر 1969، فعاش منفيًا في القاهرة حيث توفي ودُفن بالبقيع في المدينة المنورة."
  en: "King of Libya (1889–1983). Born at Jaghbub, he succeeded his cousin Ahmed Sharif as head of the Senussi order in 1916, became Emir of Cyrenaica and then of Tripolitania, spent the Italian colonial period in exile in Egypt, and was proclaimed king of the United Kingdom of Libya on 24 December 1951; deposed by the coup of 1 September 1969, he lived in exile in Cairo, where he died, and was buried in Al-Baqi Cemetery, Medina."
  ur: "لیبیا کے بادشاہ (1889–1983)؛ جغبوب میں پیدا ہوئے، 1916 میں اپنے چچا زاد احمد الشریف کے بعد سنوسی سلسلے کے سربراہ بنے، برقہ اور پھر طرابلس کے امیر ہوئے، اطالوی دور میں مصر میں جلاوطنی گزاری، اور 24 دسمبر 1951 کو متحدہ مملکتِ لیبیا کے بادشاہ قرار پائے؛ یکم ستمبر 1969 کی بغاوت میں معزول ہو کر قاہرہ میں جلاوطنی میں وفات پائی اور مدینہ کے جنت البقیع میں دفن ہوئے۔"
  es: "Rey de Libia (1889-1983). Nacido en Jaghbub, sucedió a su primo Ahmed Sharif como jefe de la orden Senussi en 1916, se convirtió en emir de Cirenaica y luego de Tripolitania, pasó el período colonial italiano en el exilio en Egipto y fue proclamado rey del Reino Unido de Libia el 24 de diciembre de 1951; depuesto por el golpe de Estado del 1 de septiembre de 1969, vivió en el exilio en El Cairo, donde murió, y fue enterrado en el cementerio de Al-Baqi, en Medina."
  fr: "Roi de Libye (1889-1983). Né à Jaghbub, il succède à son cousin Ahmed Sharif à la tête de l'ordre Senoussi en 1916, devient émir de Cyrénaïque puis de Tripolitaine, passe la période coloniale italienne en exil en Égypte et est proclamé roi du Royaume-Uni de Libye le 24 décembre 1951; déposé par le coup d'État du 1er septembre 1969, il vit en exil au Caire, où il meurt et est enterré au cimetière Al-Baqi, à Médine."
  tr: "Libya Kralı (1889–1983); El-Cegbub doğumlu, 1916'da kuzeni Ahmed el-Şerif'in yerine Sanusi tarikatının başında görev aldı. Önce Kireneyka, ardından Trablus Emiri oldu. İtalyan sömürge döneminde Mısır'a sürgün edildi, ardından 24 Aralık 1951'de Birleşik Krallık Libya Kralı ilan edildi ve 1 Eylül 1969 darbesiyle devrildi. Kahire'de sürgünde yaşadı, burada öldü ve Medine'deki Al-Baqi'de defnedildi."
  id: "Raja Libya (1889–1983); lahir di Al-Jaghbub, menggantikan sepupunya Ahmed al-Sharif memimpin ordo Sanusi pada tahun 1916. Ia menjadi Emir Cyrenaica dan kemudian Tripoli. Ia diasingkan ke Mesir selama masa kolonial Italia, kemudian dinyatakan sebagai Raja Kerajaan Bersatu Libya pada 24 Desember 1951, hingga ia digulingkan oleh kudeta 1 September 1969. Ia hidup dalam pengasingan di Kairo, di mana ia meninggal dan dimakamkan di Al-Baqi' di Madinah."
