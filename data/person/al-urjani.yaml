summary:
  ar: "ناصح الدين أبو بكر أحمد بن محمد بن الحسين الأرجاني؛ كان فقيهاً شاعراً ونائباً في القضاء بتستر وبعسكر مكرم، ذكره العماد الكاتب الأصبهاني في كتاب الخريدة وقال إنه كان في عنفوان عمره بالمدرسة النظامية بأصبهان من عهد نظام الملك إلى آخر عهده سنة أربع وأربعين وخمسمائة، ومن قوله في نفسه: أنا أشعرُ الفقهاءِ غيرَ مدافعٍ في العصرِ وأما أفقهُ الشعراءِ {cite:wafayat-ayan}."
  en: "Nasih al-Din al-Urjani — faqih-poet, deputy qadi at Tustar and Askar Mukram, remembered by al-Imad al-Katib from the Nizamiyya of Isfahan; of himself he wrote 'I am the most poetic of jurists and the most learned of poets' {cite:wafayat-ayan}."
