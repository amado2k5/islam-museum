summary:
  ar: "ناصح الدين أبو بكر أحمد بن محمد بن الحسين الأرجاني؛ كان فقيهاً شاعراً ونائباً في القضاء بتستر وبعسكر مكرم، ذكره العماد الكاتب الأصبهاني في كتاب الخريدة وقال إنه كان في عنفوان عمره بالمدرسة النظامية بأصبهان من عهد نظام الملك إلى آخر عهده سنة أربع وأربعين وخمسمائة، ومن قوله في نفسه: أنا أشعرُ الفقهاءِ غيرَ مدافعٍ في العصرِ وأما أفقهُ الشعراءِ {cite:wafayat-ayan}."
  en: "Nasih al-Din al-Urjani — faqih-poet, deputy qadi at Tustar and Askar Mukram, remembered by al-Imad al-Katib from the Nizamiyya of Isfahan; of himself he wrote 'I am the most poetic of jurists and the most learned of poets' {cite:wafayat-ayan}."
  fr: "Nasih al-Din al-Urjani – faqih-poet, qadi adjoint à Tustar et Askar Mukram, rappelé par al-Imad al-Katib de la Nizamiyya d’Ispahan  ; de lui-même il a écrit « Je suis le plus poétique des juristes et le plus savant des poètes  » {cite:wafayat-ayan}."
  es: "Nasih al-Din al-Urjani — faqih-poeta, cadí adjunto en Tustar y Askar Mukram, recordado por al-Imad al-Katib de la Nizamiyya de Isfahan; de sí mismo escribió: \"Soy el más poético de los juristas y el más erudito de los poetas\" {cite:wafayat-ayan}."
  ur: "ناصح الدین الارجانی — فقیہ شاعر، تستار میں نائب قادی اور عسکر مکرم، جسے اصفہان کے نظامیہ سے العماد الکاتب نے یاد کیا؛ اس نے اپنے بارے میں لکھا کہ 'میں فقہاء میں سب سے زیادہ شاعر ہوں اور شاعروں میں سب سے زیادہ عالم ہوں'۔"
  tr: "Nasih al-Din Ebu Bekir Ahmed bin Muhammed bin el-Hüseyin el-Arcani; Bastarr'da ve onurlu orduda hukukçu, şair ve yardımcı yargıçtı. İmad el-Katib el-İsfahani tarafından el-Khuraidah adlı kitabında anıldı; kendisi, Nizam al-Mulk döneminden 544 Hicri yılındaki saltanatının sonuna kadar İsfahan'daki Nizamiye okulunda hayatının en parlak döneminde olduğunu söyledi. Kendi sözleri arasında: 'Ben en şiirsel hukukçuyum, dönemin savunucusu değilim, ama en bilgili şairim."
  id: "Nasih al-Din Abu Bakr Ahmad ibn Muhammad ibn al-Husayn al-Arjani; ia adalah seorang ahli hukum, penyair, dan wakil hakim di Bastarr serta dalam tentara terhormat. Ia disebutkan oleh Imad al-Katib al-Isfahani dalam bukunya al-Khuraidah, yang mengatakan bahwa ia berada di puncak kehidupannya di sekolah Nizamiyyah di Isfahan sejak era Nizam al-Mulk hingga akhir pemerintahannya pada tahun 544 H. Di antara kata-katanya sendiri: 'Saya adalah ahli hukum yang paling puitis, bukan pembela zaman itu, tetapi penyair paling berpengetahuan {cite:wafayat-ayan}."
