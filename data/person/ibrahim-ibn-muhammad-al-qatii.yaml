  ar: "أبو القاسم القطيعي، كان يسكن قطيعة عيسى بن علي وحدّث عن جماعة، روى عنه القاضي المحاملي وأبو الحسين بن المنادي والخطبي وغيرهم، وقال الدارقطني هو ثقة صدوق؛ مات في جمادى الآخرة سنة إحدى وثلاثمائة وكان حسن المعرفة بالحديث ثقة متيقظًا، منزله بالجانب الغربي {cite:muntazam-ibn-al-jawzi p. 208}."
