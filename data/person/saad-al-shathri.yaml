summary:
  ar: "عالم سعودي في أصول الفقه، وُلد في الرياض سنة 1387هـ، وهو ابن المستشار ناصر الشثري. درّس في كلية الشريعة بجامعة الإمام محمد بن سعود ثم في كلية الحقوق والعلوم السياسية بجامعة الملك سعود، وعُيّن عضوا في هيئة كبار العلماء ومستشارا في الديوان الملكي برتبة وزير، وخطب بعرفة سنة 1438هـ، وله أكثر من ستين مؤلفا."
  en: "Saudi scholar of usul al-fiqh, born in Riyadh in 1387 AH, son of the royal advisor Nasir al-Shathri. He taught at the College of Sharia of Imam Muhammad ibn Saud University and then at King Saud University's College of Law and Political Science, was appointed to the Council of Senior Scholars and as an advisor in the Royal Court with the rank of minister, delivered the Arafat sermon in 1438 AH, and has written more than sixty books."
  ur: "اصولِ فقہ کے سعودی عالم، 1387ھ میں ریاض میں پیدا ہوئے، مشیر ناصر الشثری کے صاحبزادے ہیں۔ جامعہ امام محمد بن سعود کے کلیہ الشریعہ اور پھر جامعہ شاہ سعود کے کالج آف لا میں تدریس کی، ہیئتِ کبار العلماء کے رکن اور دیوانِ شاہی میں وزیر کے درجے کے مشیر مقرر ہوئے، 1438ھ میں خطبہ عرفہ دیا، اور ان کی ساٹھ سے زائد تصانیف ہیں۔"
