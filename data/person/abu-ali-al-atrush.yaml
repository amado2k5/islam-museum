label: { ar: "أبو علي بن الأطروش العلوي", en: "Abu Ali Ibn al-Atrush al-Alawi", fr: "Abu Ali Ibn al-Atrush al-Alawi", es: "Abu Ali Ibn al-Atrush al-Alawi", ur: "ابو علی ابن الطروش العلوی۔" }
summary:
  ar: "علوي كان معتقلاً عند أبي الحسن بن كاكي فلما شرب ابن كاكي ليلة وتفرق أصحابه قام إليه العلوي ليقتله فظفر به وقتله واختفى، فلما أصبح أخرجوه من خفيته وألبسوه القلنسوة وبايعوه فأصبح أميراً وجعل مقدم جيشه علي بن خرشيد، ثم لعب يوماً بالكرة فسقط عن دابته فمات {cite:kamil-ibn-al-athir p. 129-130}."
  en: "The captive Alid who killed his gaoler Abu'l-Hasan ibn Kaki in a drunken night; the troops dragged him from hiding, acclaimed him amir, and he soon died falling from his mount at polo {cite:kamil-ibn-al-athir p. 129-130}."
  fr: "L'alide captif qui tua son geôlier Abu'l-Hasan ibn Kaki lors d'une nuit d'ivresse ; les troupes le tirèrent de sa cachette, l'acclamèrent émir, et il mourut peu après d'une chute de sa monture au polo {cite:kamil-ibn-al-athir p. 129-130}."
  es: "El cautivo Alid que mató a su carcelero Abu'l-Hasan ibn Kaki en una noche de borrachera; las tropas lo sacaron de su escondite, lo aclamaron amir y pronto murió al caer de su montura en polo {cite:kamil-ibn-al-athir p. 129-130}."
  ur: "اسیر علید جس نے نشے کی حالت میں اپنے گولی چلانے والے ابو الحسن ابن ککی کو رات میں قتل کر دیا۔ فوجوں نے اسے چھپنے سے گھسیٹ لیا، اسے امیر کہا، اور وہ جلد ہی پولو پر اپنے پہاڑ سے گرتے ہوئے مر گیا۔ 129-130}۔"
