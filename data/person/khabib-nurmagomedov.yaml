summary:
  ar: "مقاتل فنون قتالية مختلطة روسي معتزل من أصل آفاري داغستاني، وُلد في قرية سيلدي سنة 1988، حمل لقب الوزن الخفيف في يو إف سي من 2018 إلى 2021، واعتزل بسجل نظيف من 29 فوزا دون أي هزيمة، وهو أول مسلم يفوز بلقب في يو إف سي، وأُدرج في قاعة مشاهير المنظمة سنة 2022."
  en: "Russian former mixed martial artist of Avar Dagestani origin, born in the village of Sildi in 1988. He held the UFC lightweight championship from 2018 to 2021 and retired undefeated at 29-0, the first Muslim to win a UFC title; he was inducted into the UFC Hall of Fame in 2022."
  ur: "روسی سابق مکسڈ مارشل آرٹس کھلاڑی، جو داغستان کے آوار خاندان سے ہیں اور 1988 میں گاؤں سلدی میں پیدا ہوئے۔ وہ 2018 سے 2021 تک UFC لائٹ ویٹ چیمپئن رہے، 29-0 کے ناقابلِ شکست ریکارڈ کے ساتھ ریٹائر ہوئے، UFC ٹائٹل جیتنے والے پہلے مسلمان بنے، اور 2022 میں UFC ہال آف فیم میں شامل ہوئے۔"
