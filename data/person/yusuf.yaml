summary:
  ar: "نبي وابن نبي. عند البخاري قال النبي «الكريم ابن الكريم ابن الكريم ابن الكريم: يوسف بن يعقوب بن إسحاق بن إبراهيم» {cite:sahih-al-bukhari 3382}، و«لو لبثت في السجن ما لبث يوسف ثم أتاني الداعي لأجبته» {cite:sahih-al-bukhari 3387}، وفي دعائه على مضر «اجعلها سنين كسني يوسف» {cite:sahih-al-bukhari 3386}."
  en: "Prophet son of a prophet: 'the noble son of the noble son of the noble son of the noble' {cite:sahih-al-bukhari 3382}, and the Prophet would have answered the call even after Yusuf's years in prison {cite:sahih-al-bukhari 3387}."
