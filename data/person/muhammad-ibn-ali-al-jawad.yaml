id: person/muhammad-ibn-ali-al-jawad
class: person
label: { ar: "محمد بن علي الجواد", en: "Muhammad al-Jawad", es: "Muhammad al-Jawad", fr: "Muhammad al-Jawad", ur: "محمد الجواد" }
summary:
  ar: "محمد بن علي بن موسى بن جعفر، قبض لخمس خلون من ذي الحجة سنة تسع عشرة ومائتين وهو ابن خمس وعشرين سنة ودفن ببغداد بمقابر قريش مع جده موسى بن جعفر وصلى عليه الواثق، وقيل إن أم الفضل بنت المأمون سمته حين قدمت به من المدينة إلى المعتصم، واختلف أهل الإمامة في سنه عند وفاة أبيه {cite:muruj-al-dhahab p. 443}."
  en: "Ali al-Rida's son — dead Dhu'l-Hijja 219 aged twenty-five, buried by his grandfather Musa at the Quraysh graves, al-Wathiq praying over him {cite:muruj-al-dhahab p. 443}."
  es: "El hijo de Ali al-Rida — murió en Dhu'l-Hijja 219 a la edad de veinticinco años, enterrado por su abuelo Musa en las tumbas de los Quraysh, al-Wathiq orando sobre él {cite:muruj-al-dhahab p. 443}."
  fr: "Le fils d'Ali al-Rida — mort le 219 Dhu'l-Hijja à l'âge de vingt-cinq ans, enterré par son grand-père Musa dans les tombes des Quraysh, al-Wathiq priant sur lui {cite:muruj-al-dhahab p. 443}."
  ur: "علی الرضا کا بیٹا - وفات 219 ذی الحجہ 25 سال کی عمر میں، ان کے دادا موسیٰ نے قریش کی قبروں میں دفن کیا، الوثیق ان پر دعا کرتے ہوئے {حوالہ: مروج الذہب صفحہ 443}۔"
  tr: "Muhammed ibn Ali ibn Musa ibn Ja'far, Dhu al-Hijjah'tan beş yıl sonra, 200 Hicri yılında, yirmi beş yaşında vefat etti ve Bağdat'taki Qureyş mezarlığında, büyükbabası Musa ibn Ca'far'ın yanında defnedildi. El-Vetik, onun cenaze namazını onun üzerine kıldı. Ümmü el-Fadl bint al-Ma'mun'un onu Medine'den al-Mu'tasim'e getirilirken ismini verdiği söylenir. İmamatlık halkı, babasının ölüm anındaki yaşı konusunda farklı düşünmüştür {atıf:Muruj-al-Dhahab, s. 443}."
  id: "Muhammad ibn Ali ibn Musa ibn Ja'far wafat lima tahun setelah Dhu al-Hijjah pada tahun 200 H pada usia dua puluh lima tahun dan dimakamkan di Baghdad di pemakaman Quraisy bersama kakeknya Musa ibn Ja'far. Al-Wathiq memimpin shalat pemakaman untuknya. Konon um al-Fadl bint al-Ma'mun menamainya ketika ia dibawa dari Madinah ke al-Mu'tasim. Orang-orang Imamate berbeda pendapat mengenai usianya saat ayahnya wafat {cite:muruj-al-dhahab, hlm. 443}."
