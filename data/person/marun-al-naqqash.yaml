summary:
  ar: "تاجر وكاتب مسرحي لبناني (1817–1855)؛ وُلد في صيدا ونشأ في بيروت، وعمل رئيسًا لكُتّاب الجمارك وعضوًا في غرفة التجارة، وسافر إلى إيطاليا سنة 1846 فعاد ليقدّم «البخيل» المأخوذة عن موليير (نُشرت 1847 وعُرضت 1848)، وهي أول عرض مسرحي معروف بالعربية، ثم مسرحيتين أصليتين، وتوفي بالحمى في طرسوس سنة 1855."
  en: "Lebanese merchant and playwright (1817–1855). Born at Sidon and raised in Beirut, he worked as chief clerk of the Beirut customs and sat on the city's chamber of commerce; a business journey to Italy in 1846 led him to stage Al-bakhil, his Arabic adaptation of Molière's Miser (published 1847, performed 1848) — the first known theatre performance in Arabic — followed by two original plays. He died of fever at Tarsus in 1855."
  ur: "لبنانی تاجر اور ڈراما نگار (1817–1855)؛ صیدا میں پیدا ہوئے اور بیروت میں پلے بڑھے، کسٹمز کے چیف کلرک اور ایوان تجارت کے رکن رہے؛ 1846 میں اٹلی کے سفر کے بعد انہوں نے مولییر کے ڈرامے سے ماخوذ «البخیل» پیش کیا (شائع 1847، پیشکش 1848)، جو عربی زبان کی پہلی معروف تھیٹر پیشکش شمار ہوتی ہے، اور دو مزید ڈرامے لکھے؛ 1855 میں طرسوس میں بخار سے انتقال ہوا۔"
