  ar: "بطاقة أولية لعلاء الدين ابن بلبان الحنبلي، فقيه دمشق في القرن السابع عشر صاحب اختصار منتهى الإرادات، توفي سنة ١٦٧٢م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
