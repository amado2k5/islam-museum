  ur: "علاء الدین ابن بلبن الحنبلی کے لیے مسودہ کارڈ، سترہویں صدی کے دمشق کے فقیہ، منتہٰی الاعرادات کے مصنف، ڈی۔ 1672; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "On yedinci yüzyılda Şam'da hukukçu olan ve Muntaha al-Iradat'ın kısaltmasının yazarı Ala al-Din ibn Balban al-Hanbali'nin ön kartı 1672 yılında ölmüştür; önemli kişilerin sözlüklerinde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan oleh Ala al-Din ibn Balban al-Hanbali, seorang ahli hukum Damaskus pada abad ketujuh belas dan penulis ringkasan Muntaha al-Iradat, meninggal pada tahun 1672 M; ia disebutkan dalam kamus tokoh-tokoh terkemuka, dan biografinya belum pernah ditinjau di halaman tersebut."
