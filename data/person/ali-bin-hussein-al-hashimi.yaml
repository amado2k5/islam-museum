summary:
  ar: "علي بن الحسين الهاشمي (وُلد في مكة سنة 1879 – توفي في بغداد في 13 فبراير 1935)، أكبر أبناء الشريف حسين بن علي من الشريفة عابدية بنت عبد الله. تلقى دروسه في مكة ثم إسطنبول، وكان من قادة الثورة العربية الكبرى، وظل وليًا لعهد أبيه في الحجاز بينما صار أخواه عبد الله وفيصل ملكين على شرق الأردن والعراق. تنازل له أبوه عن ألقابه الدنيوية في أكتوبر 1924 بعد تقدم ابن سعود، فصار ثاني وآخر ملوك المملكة الحجازية الهاشمية وشريف مكة، ودافع عن جدة والمدينة حتى سقطت المملكة في ديسمبر 1925، فغادر إلى الهند ثم العراق واستقر في بغداد حتى وفاته، ودُفن في المقبرة الملكية بالأعظمية. ابنه عبد الإله صار وصيًا على عرش العراق، وابنته عالية صارت ملكة العراق بزواجها من الملك غازي."
  en: "Ali bin Hussein al-Hashimi (born at Mecca in 1879 – died at Baghdad on 13 February 1935) was the eldest son of Sharif Hussein bin Ali by Sharifa Abdiyya bint Abdullah. Educated at Mecca and then Istanbul, he was one of the leaders of the Great Arab Revolt and remained his father's heir in the Hejaz while his brothers Abdullah and Faisal became kings of Transjordan and Iraq. His father abdicated his secular titles to him in October 1924 as Ibn Saud advanced, making him the second and last King of the Hashemite Kingdom of Hejaz and Grand Sharif of Mecca; he defended Jeddah and Medina until the kingdom fell in December 1925, then left for India and Iraq and settled at Baghdad until his death, and was buried in the royal cemetery at Adhamiyah. His son Abd al-Ilah became regent of Iraq, and his daughter Aliya became Queen of Iraq by her marriage to King Ghazi."
  ur: "علی بن حسین ہاشمی (ولادت: مکہ، 1879ء – وفات: بغداد، 13 فروری 1935ء) شریف حسین بن علی کے سب سے بڑے بیٹے تھے۔ انہوں نے مکہ اور استنبول میں تعلیم پائی، ثورۂ عربیہ کے قائدین میں سے تھے، اور اکتوبر 1924ء میں والد کی دست برداری پر حجاز کے دوسرے اور آخری بادشاہ بنے؛ دسمبر 1925ء میں مملکت کے خاتمے پر عراق چلے گئے اور بغداد ہی میں وفات پا کر اعظمیہ کے شاہی قبرستان میں دفن ہوئے۔ ان کے بیٹے عبد الالٰہ عراق کے وصی بنے۔"
