summary:
  ar: "ملاكم أمريكي سابق في الوزن الثقيل، وُلد في بروكلين بنيويورك سنة 1967. فاز بالميدالية الفضية الأولمبية سنة 1988، وأصبح بطل العالم المطلق للوزن الثقيل سنة 1992 بتغلبه على إيفاندر هوليفيلد، وأنهى مسيرته في الملاكمة بسجل 43 فوزاً مقابل هزيمة واحدة، وفاز بألقاب المنظمات الأربع الكبرى، ثم خاض نزالاً وحيداً في المواي تاي سنة 2013."
  en: "American former heavyweight boxer, born in Brooklyn, New York, in 1967. He won the Olympic silver medal in 1988, became the undisputed world heavyweight champion in 1992 by defeating Evander Holyfield, finished his boxing career with 43 wins against a single loss, held titles from all four major sanctioning bodies, and fought a single Muay Thai bout in 2013."
  ur: "امریکی سابق ہیوی ویٹ باکسر، 1967 میں بروکلن، نیویارک میں پیدا ہوئے۔ انہوں نے 1988 میں اولمپک چاندی کا تمغہ جیتا، 1992 میں ایوانڈر ہولی فیلڈ کو ہرا کر غیر متنازع عالمی ہیوی ویٹ چیمپئن بنے، اپنے باکسنگ کیریئر کا اختتام 43 فتوحات اور صرف ایک شکست کے ساتھ کیا، چاروں بڑی تنظیموں کے ٹائٹل جیتے، اور 2013 میں ایک واحد موئے تھائی مقابلہ لڑا۔"
