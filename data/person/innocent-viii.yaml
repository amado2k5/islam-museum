summary:
  ar: "إينوسنت الثامن، بابا روما في عهد بايزيد الثاني؛ ينقل الصلابي أن فرسان القديس يوحنا في رودس، بعد أن كسبوا بالأمير جم امتيازات من بايزيد ومن أنصار جم بالقاهرة وحصلوا أموالاً ضخمة، باعوا رهينتهم إلى البابا إينوسنت الثامن {cite:dawlat-uthmaniyya-salabi p. 164}."
  en: "Innocent VIII, pope in Bayezid II's reign; al-Salabi records that the Knights of St John at Rhodes — having turned Prince Cem into privileges extracted from both Bayezid and Cem's Cairo backers — sold their hostage to Pope Innocent VIII {cite:dawlat-uthmaniyya-salabi p. 164}."
  es: "Inocencio VIII, papa durante el reinado de Bayezid II; al-Salabi registra que los Caballeros de San Juan en Rodas, tras haber convertido al príncipe Cem en una fuente de privilegios extraídos tanto de Bayezid como de los partidarios de Cem en El Cairo, vendieron a su rehén al papa Inocencio VIII {cite:dawlat-uthmaniyya-salabi p. 164}."
  fr: "Innocent VIII, pape sous le règne de Bayezid II; al-Salabi rapporte que les Chevaliers de Saint-Jean à Rhodes — ayant transformé le prince Cem en privilèges extorqués à la fois à Bayezid et aux soutiens de Cem au Caire — ont vendu leur otage au pape Innocent VIII {cite:dawlat-uthmaniyya-salabi p. 164}."
  ur: "معصوم VIII، بایزید II کے دور میں پوپ؛ السلابی نے ریکارڈ کیا ہے کہ روڈز کے سینٹ جان کے شورویروں نے - پرنس سیم کو بایزید اور سیم کے قاہرہ کے حامیوں سے حاصل کردہ مراعات میں تبدیل کر دیا تھا - اپنے یرغمالی کو پوپ انوسنٹ ہشتم کو فروخت کر دیا تھا۔ 164}۔"
