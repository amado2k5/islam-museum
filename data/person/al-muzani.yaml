label: { ar: "المزني", en: "al-Muzani", fr: "al-Muzani", es: "al-Muzani", ur: "المزانی" }
summary:
  ar: "أبو إبراهيم إسماعيل بن يحيى المزني صاحب المختصر، من أصحاب محمد بن إدريس الشافعي وأخذ العلم عنه، توفي بمصر يوم الخميس لست بقين من شهر ربيع الأول سنة أربع وستين ومائتين {cite:muruj-al-dhahab p. 576-577}."
  en: "Abu Ibrahim Isma'il b. Yahya al-Muzani, author of the Mukhtasar and al-Shafi'i's great pupil — died in Egypt, Rabi' I 264 {cite:muruj-al-dhahab p. 576-577}."
  fr: "Abu Ibrahim Isma'il b. Yahya al-Muzani, auteur du Mukhtasar et grand élève d'al-Shafi'i – est mort en Égypte, Rabi' I 264 {cite:muruj-al-dhahab p. 576-577}."
  es: "Abu Ibrahim Ismail b. Yahya al-Muzani, autor del Mukhtasar y gran alumno de al-Shafi'i, murió en Egipto, Rabi' I 264 {cita:muruj-al-dhahab p. 576-577}."
  ur: "ابو ابراہیم اسماعیل بن یحییٰ المزانی، مختار کے مصنف اور شافعی کے عظیم شاگرد - مصر میں وفات، ربیع اول 264 {حوالہ: مروج الذہب ص۔ 576-577}۔"
  tr: "Mukhtasar'ın yazarı Ebu İbrahim İsmail bin Yahya el-Muzani, Muhammed bin İdris el-Şafii'nin bir arkadaşıydı ve ondan öğrendi. 264 Hicri yılında Rebi'l-Avvel ayından altı ay önce, Perşembe günü Mısır'da öldü {atıf:muruj-al-dhahab, s. 576-577}."
  id: "Abu Ibrahim Ismail ibn Yahya al-Muzani, penulis Mukhtasar, adalah sahabat Muhammad ibn Idris al-Shafi'i dan belajar darinya. Ia meninggal di Mesir pada hari Kamis, enam bulan sebelum bulan Rabi' al-Awwal tahun 264 H {cite:muruj-al-dhahab, hlm. 576-577}."
