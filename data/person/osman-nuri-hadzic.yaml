summary:
  ar: "كاتب ومفكر بوسني من موستار، شارك في تأسيس مجلة «بهار» (1900)، وكتب «الإسلام والثقافة» (1894) و«محمد والقرآن» (1931) وهو تاريخ ثقافي للإسلام، وأدار مدرسة القضاة الشرعيين في سراييفو."
  en: "Bosnian writer and intellectual from Mostar who co-founded the journal Behar (1900), wrote Islam i kultura (Islam and Culture, 1894) and Muhammed i Koran (Muhammed and the Quran, 1931), a cultural history of Islam, and directed the Sarajevo School of Sharia Judges."
  ur: "موستار سے تعلق رکھنے والے بوسنیائی ادیب اور مفکر، مجلہ «بہار» (1900ء) کے شریک بانی، «اسلام اور ثقافت» (1894ء) اور «محمد اور قرآن» (1931ء) کے مصنف — جو اسلام کی ایک ثقافتی تاریخ ہے — اور سرائیوو کے قضاۃِ شرعیہ اسکول کے مدیر۔"
