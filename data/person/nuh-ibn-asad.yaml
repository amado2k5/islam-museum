summary:
  ar: "نوح بن أسد؛ آخر من فتح كاسان وأورشت من فرغانة وقد انتقض أهلهما في خلافة المنصور ويقال المنتصر."
  en: "Nuh ibn Asad; last conqueror of the breached Kasan and Urusht of Farghana, under al-Mansur — some say al-Muntasir."
  es: "Nuh ibn Asad; último conquistador de Kasan y Urusht de Farghana, bajo el mando de al-Mansur —algunos dicen al-Muntasir—."
  fr: "Nuh ibn Asad; dernier conquérant de Kasan et d'Urusht de Farghana, sous le règne d'al-Mansur — certains disent al-Muntasir."
  ur: "نوح ابن اسد؛ المنصور کے ماتحت فرغانہ کے ٹوٹے ہوئے کسان اور ارشت کا آخری فاتح - بعض المنتصر کہتے ہیں۔"
  tr: "Nuh ibn Asad; Fergana'dan Kasan ve Orsht'u fetheden son kişidir; Fergana'nın halkı El-Mansur halifeliği sırasında isyan etmiş ve kendisine El-Muntasir de denir."
  id: "Nuh ibn Asad; yang terakhir menaklukkan Kasan dan Orsht dari Fergana, yang rakyatnya memberontak selama kekhalifahan Al-Mansur, dan ia juga disebut Al-Muntasir."
