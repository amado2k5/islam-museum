summary:
  ar: "السلطان محمد شاه (1877-1957)، الإمام الثامن والأربعون للنزارية الإسماعيلية منذ سنة 1885 حين خلف والده وهو في السابعة، فامتدت إمامته 72 سنة. وُلد في كراتشي وتلقى تعليما إسلاميا وغربيا وقضى مدة في إيتون وكامبريدج. قاد وفد مسلمي الهند إلى نائب الملك سنة 1906، وكان من مؤسسي الرابطة الإسلامية لعموم الهند وأول رئيس دائم لها، ودفع باتجاه جامعة عليكره، ومثّل الهند في عصبة الأمم ورأس جمعيتها (1937-1938). أصلح مؤسسات جماعته وأصدر دساتير إسماعيلية ودعا إلى تعليم المرأة والإصلاح الاجتماعي، وعُرف أيضا بملكيته لخيول السباق الأصيلة."
  en: "Sultan Muhammad Shah (1877–1957), 48th Imam of the Nizari Ismailis from 1885, when he succeeded his father at the age of seven, in an imamate that lasted 72 years. Born in Karachi, he received both an Islamic and a Western education, including Eton and Cambridge. He headed the 1906 Muslim deputation to the Viceroy, was a founder and the first permanent president of the All-India Muslim League, campaigned for Aligarh Muslim University, represented India at the League of Nations and presided over its Assembly (1937–1938). He reformed his community's institutions, promulgated Ismaili constitutions, and campaigned for women's education and social reform; he was also a noted owner and breeder of Thoroughbred racehorses."
  ur: "سلطان محمد شاہ (1877ء–1957ء)، نزاری اسماعیلیوں کے اڑتالیسویں امام، جو 1885ء میں سات سال کی عمر میں اپنے والد کے جانشین بنے اور جن کی امامت 72 سال جاری رہی۔ کراچی میں پیدا ہوئے، اسلامی اور مغربی دونوں تعلیم حاصل کی، ایٹن اور کیمبرج میں بھی پڑھے۔ 1906ء میں وائسرائے کے پاس مسلم وفد کی قیادت کی، آل انڈیا مسلم لیگ کے بانیوں اور اس کے پہلے مستقل صدر رہے، علی گڑھ مسلم یونیورسٹی کے قیام کی کوشش کی، جمعیت اقوام میں ہندوستان کی نمائندگی کی اور اس کی اسمبلی کی صدارت کی (1937ء–1938ء)۔ انہوں نے اپنی جماعت کے ادارے اصلاح کیے، اسماعیلی آئین جاری کیے اور خواتین کی تعلیم اور سماجی اصلاح کی دعوت دی؛ وہ اصیل نسل کے گھوڑوں کے مشہور مالک بھی تھے۔"
