summary:
  ar: "مخرج وكاتب سيناريو إيراني، وُلد في همايون شهر قرب أصفهان سنة 1972؛ من أبرز صنّاع السينما الإيرانية والعالمية في القرن الحادي والعشرين، إذ فاز فيلمه «انفصال» (2011) بالدب الذهبي وبجائزة الأوسكار لأفضل فيلم دولي — أول فيلم إيراني يفوز بها — ثم فاز بها ثانية بـ«البائع» (2016)، ونال «عن إيلي» (2009) الدب الفضي و«بطل» (2021) الجائزة الكبرى في كان، واختير في قائمة تايم 100 سنة 2012 ومُنح وسام جوقة الشرف الفرنسي."
  en: "Iranian film director and screenwriter, born in Homayoon Shahr near Isfahan in 1972 and among the most prominent filmmakers of Iranian and world cinema in the 21st century. His A Separation (2011) won the Golden Bear and the Academy Award for Best International Feature Film — the first Iranian film to win it — and he won the award again with The Salesman (2016); About Elly (2009) won the Silver Bear for Best Director and A Hero (2021) the Cannes Grand Prix. He was named to the Time 100 in 2012 and received France's Legion of Honour."
  ur: "ایرانی فلم ہدایت کار و منظر نویس، 1972 میں اصفہان کے قریب ہمایوں شہر میں پیدا ہوئے؛ اکیسویں صدی کی ایرانی اور عالمی سنیما کی نمایاں ترین شخصیات میں سے ایک، ان کی «جدائی» (2011) نے گولڈن بیئر اور بہترین بین الاقوامی فیچر فلم کا اکیڈمی ایوارڈ جیتا — یہ ایوارڈ جیتنے والی پہلی ایرانی فلم — اور انھوں نے «دی سیلز مین» (2016) سے یہ ایوارڈ دوبارہ جیتا؛ «اباؤٹ ایلی» (2009) پر سلور بیئر اور «اے ہیرو» (2021) پر کان کا گرینڈ پرکس ملا، وہ 2012 میں ٹائم 100 میں شامل ہوئے اور انھیں فرانس کا لیجن آف آنر ملا۔"
