id: person/ibn-sida
class: person
label: { ar: "ابن سيده المرسي" }
summary:
  ar: "الفقيه أبو الحسن علي بن أحمد المعروف بابن سيده؛ إمام في اللغة والعربية وهُمام في الفئة الأدبية، كان منقطعاً إلى الموفق صاحب دانية وبها أدرك أمانيه ووجد تجرده للعلم وفراغه وتفرد بتلك الإراعة ولا سيما كتابه المسمى بالمحكم فإنه أبدع كتاب وأحكم، ولمامات الموفق خاف من ابنه إقبال الدولة وأطاف به مكروهاً ففر إلى بعض الأعمال المجاورة وكتب إليه منها مستعطفاً بقصيدته التي أولها: ألا هل إلى تقبيل راحتك اليمنى سبيل فإن الأمن في ذاك واليمنا {cite:nafh-tib-maqqari p. 31}."
  en: "Ibn Sida (Abu al-Hasan Ali ibn Ahmad) — the blind imam of Arabic and letters at Murcia, attached to al-Muwaffaq lord of Denia where he found leisure for the Muhkam, 'the most wondrous and soundest of books'; fearing the son Iqbal al-Dawla he fled and sent his famous plea 'is there a way to kiss your right hand? for in that lies safety' {cite:nafh-tib-maqqari p. 31}."
  es: "Ibn Sida (Abu al-Hasan Ali ibn Ahmad), el imán ciego de árabe y letras en Murcia, vinculado a al-Muwaffaq, señor de Denia, donde encontró tiempo para el Muhkam, \"el más maravilloso y sólido de los libros\"; temiendo al hijo Iqbal al-Dawla, huyó y envió su famosa súplica: \"¿Hay alguna manera de besar tu mano derecha? Porque en eso reside la seguridad\" {cite:nafh-tib-maqqari p. 31}."
  fr: "Ibn Sida (Abu al-Hasan Ali ibn Ahmad) — l'imam aveugle de l'arabe et des lettres à Murcie, attaché à al-Muwaffaq, seigneur de Denia, où il trouvait du loisir pour le Muhkam, « le plus merveilleux et le plus solide des livres »; craignant le fils Iqbal al-Dawla, il s'enfuit et envoya son célèbre plaidoyer « y a-t-il un moyen de baiser ta main droite ? car c'est là que réside la sécurité » {cite: nafh-tib-maqqari p. 31}."
  ur: "ابن سیدہ ⁦(ابو الحسن علی ابن احمد)⁩ - مرسیہ میں عربی اور حروف کے نابینا امام، الموفق لارڈ آف دینیا سے منسلک، جہاں اس نے محکم کے لیے فرصت پائی، 'سب سے حیرت انگیز اور بہترین کتاب'؛ بیٹے اقبال الدولہ سے ڈر کر بھاگا اور اپنی مشہور التجا بھیجی کہ کیا تیرا داہنا ہاتھ چومنے کا کوئی طریقہ ہے؟ کیونکہ اسی میں سلامتی ہے۔ 31}۔"
  tr: "Hukukçu Ebu el-Hasan Ali bin Ahmed, nam-ı diğer İbn Sidah, dil ve Arapça imamı ve edebi alanda önde gelen bir figürdü. Daniya'nın sahibi el-Muvaffaq'tan ayrıldı, burada arzularını gerçekleştirdi ve bilgiye ve tembelliğe bağlılığını buldu. Bu olağanüstü alanda, özellikle El-Muhkem adlı kitabında benzersizdi; çünkü en yaratıcı ve bilge yazardı. El-Muvaffaq'ın ölümünden sonra oğlu İkbal el-Devle'den korktu ve onu hoşnutsuzlukla çevreledi, bu yüzden komşu ofislere kaçtı ve ona şiiriyle yazdı: \"Sağ avucunu öpmenin bir yolu var mı? Çünkü güvenlik onda ve sağ elde {atıf:naf-tib-maqqari, s. 31}.\""
  id: "Ahli hukum Abu al-Hasan Ali ibn Ahmad, yang dikenal sebagai Ibn Sidah, adalah seorang imam dalam bahasa dan bahasa Arab serta tokoh terkemuka di bidang sastra. Ia terpisah dari al-Muwaffaq, pemilik Daniya, di mana ia mewujudkan aspirasinya dan menemukan pengabdiannya pada pengetahuan dan kemalasan. Ia unik di bidang luar biasa itu, terutama bukunya yang berjudul Al-Muhkam, karena ia adalah penulis paling kreatif dan bijaksana. Setelah kematian al-Muwaffaq, ia takut pada putranya Iqbal al-Dawla dan mengelilinginya dengan rasa tidak suka, sehingga ia melarikan diri ke beberapa kantor tetangga dan menulis kepadanya dengan puisi yang dimulai: \"Apakah ada cara untuk mencium telapak tangan kananmu? Karena keselamatan ada di tangan itu dan di tangan kanan {cite:nafh-tib-maqqari, hlm. 31}.\""
