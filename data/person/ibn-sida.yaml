label: { ar: "ابن سيده المرسي" }
summary:
  ar: "الفقيه أبو الحسن علي بن أحمد المعروف بابن سيده؛ إمام في اللغة والعربية وهُمام في الفئة الأدبية، كان منقطعاً إلى الموفق صاحب دانية وبها أدرك أمانيه ووجد تجرده للعلم وفراغه وتفرد بتلك الإراعة ولا سيما كتابه المسمى بالمحكم فإنه أبدع كتاب وأحكم، ولمامات الموفق خاف من ابنه إقبال الدولة وأطاف به مكروهاً ففر إلى بعض الأعمال المجاورة وكتب إليه منها مستعطفاً بقصيدته التي أولها: ألا هل إلى تقبيل راحتك اليمنى سبيل فإن الأمن في ذاك واليمنا {cite:nafh-tib-maqqari p. 31}."
  en: "Ibn Sida (Abu al-Hasan Ali ibn Ahmad) — the blind imam of Arabic and letters at Murcia, attached to al-Muwaffaq lord of Denia where he found leisure for the Muhkam, 'the most wondrous and soundest of books'; fearing the son Iqbal al-Dawla he fled and sent his famous plea 'is there a way to kiss your right hand? for in that lies safety' {cite:nafh-tib-maqqari p. 31}."
