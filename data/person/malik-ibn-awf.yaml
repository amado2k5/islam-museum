  ur: "ہوازن کے نوجوان قائد جنہوں نے حنین میں قبائلی اتحاد کی قیادت کی؛ چند ہفتوں بعد اسلام قبول کیا، جعرانہ میں نبی سے صلح کی اور اپنی قوم کو ان کے گھروں اور اموال کی طرف واپس لے گئے۔ {cite:ibn-ishaq-guillaume}"
