summary:
  en: "The young commander of Hawazin who fielded the tribal confederation against the Muslims at Hunayn — and within weeks accepted Islam, reconciled with the Prophet at al-Ji'rana, and led his people back to their faith and their property."
  ar: "القائد الشاب لهوازن الذي ساق الاتحاد القبلي في مقابل المسلمين بحُنين — ثم أسلم بعد أسابيع، وصالحه النبي بالجعرانة، وعاد بقومه إلى ديارهم وأموالهم."
  ur: "ہوازن کے نوجوان قائد جنہوں نے حنین میں قبائلی اتحاد کی قیادت کی؛ چند ہفتوں بعد اسلام قبول کیا، جعرانہ میں نبی سے صلح کی اور اپنی قوم کو ان کے گھروں اور اموال کی طرف واپس لے گئے۔ {cite:ibn-ishaq-guillaume}"
  es: "El joven comandante de Hawazin que dirigió la confederación tribal contra los musulmanes en Hunayn, y que pocas semanas después aceptó el Islam, se reconcilió con el Profeta en al-Ji'rana y condujo a su pueblo de regreso a su fe y a sus propiedades."
  fr: "Le jeune commandant de Hawazin qui a mené la confédération tribale contre les musulmans à Hunayn — et en quelques semaines, il s'est converti à l'islam, s'est réconcilié avec le Prophète à al-Ji'rana et a ramené son peuple à sa foi et à ses biens."
  tr: "Müslümanlara karşı aşiret birliğini Hunayn ile yöneten genç Hawazin, birkaç hafta sonra İslam'a geçti, Peygamber tarafından Ca'ranah'ta barıştı ve halkıyla birlikte evlerine ve servetlerine döndü."
  id: "Pemimpin muda Hawazin, yang memimpin persatuan suku melawan Muslim dengan Hunayn—lalu memeluk Islam setelah beberapa minggu, didamaikan oleh Nabi di Al-Ja'ranah, dan kembali bersama rakyatnya ke rumah dan kekayaan mereka."
