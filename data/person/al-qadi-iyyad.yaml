summary:
  ar: "قاضي سبتة مدة ثم قاضي غرناطة، الحافظ المحدث صاحب الشفا الذي لم يسبق إلى مثله ومشارق الأنوار في غريب الصحيحين والموطأ، كان إمام وقته في علوم شتى مفرط الذكاء عديم النظير شديد التعصب للسنة والتمسك بها حتى أمر بإحراق كتب الغزالي لأمر توهمه منها فقيل فيه ظلموا عياضاً وهو يحلم عنهم والظلم بين العالمين قديم جعلوا مكان الراء عيناً في اسمه كي يكتموه وإنه لمعلوم، ولد سنة ست وسبعين وأربع مئة وتوفي سنة أربع وأربعين وخمس مئة {cite:shadharat-dhahab p. 619}."
  en: "Qadi 'Iyad the Maliki hadith-master, judge of Ceuta then Granada, author of the unmatched al-Shifa'; so fiercely attached to the Sunna that he ordered al-Ghazali's books burned over something he suspected in them — 'they wronged 'Iyad while he forbore them: they put an 'ayn for the ra' in his name to conceal him, yet he is well known' {cite:shadharat-dhahab p. 619}."
