summary:
  ar: "قاضي سبتة مدة ثم قاضي غرناطة، الحافظ المحدث صاحب الشفا الذي لم يسبق إلى مثله ومشارق الأنوار في غريب الصحيحين والموطأ، كان إمام وقته في علوم شتى مفرط الذكاء عديم النظير شديد التعصب للسنة والتمسك بها حتى أمر بإحراق كتب الغزالي لأمر توهمه منها فقيل فيه ظلموا عياضاً وهو يحلم عنهم والظلم بين العالمين قديم جعلوا مكان الراء عيناً في اسمه كي يكتموه وإنه لمعلوم، ولد سنة ست وسبعين وأربع مئة وتوفي سنة أربع وأربعين وخمس مئة {cite:shadharat-dhahab p. 619}."
  en: "Qadi 'Iyad the Maliki hadith-master, judge of Ceuta then Granada, author of the unmatched al-Shifa'; so fiercely attached to the Sunna that he ordered al-Ghazali's books burned over something he suspected in them — 'they wronged 'Iyad while he forbore them: they put an 'ayn for the ra' in his name to conceal him, yet he is well known' {cite:shadharat-dhahab p. 619}."
  fr: "Qadi 'Iyad le maître de hadith Maliki, juge de Ceuta puis de Grenade, auteur de l'incomparable al-Shifa' ; Si farouchement attaché à la Sunna qu'il a ordonné les livres d'al-Ghazali brûlés sur quelque chose qu'il soupçonnait en eux - « ils ont fait du tort à Iyad pendant qu'il les négligeait : ils ont mis un \"ayn pour le ra\" dans son nom pour le cacher, mais il est bien connu.\" {cite:shadharat-dhahab p. 619}."
  es: "Qadi 'Iyad, el maestro de hadices malikí, juez de Ceuta y luego de Granada, autor del inigualable al-Shifa'; tan fervientemente apegado a la Sunna que ordenó quemar los libros de al-Ghazali por algo que sospechaba que contenían: 'ofendieron a 'Iyad mientras él los toleraba: pusieron un 'ayn para el ra' en su nombre para ocultarlo, sin embargo, es bien conocido' {cite:shadharat-dhahab p. 619}."
  ur: "قاضی 'عیاد مالکی حدیث کے ماہر، سیوٹا پھر غرناطہ کے جج، بے مثال الشفاء کے مصنف'؛ سنت سے اس قدر شدید لگاؤ تھا کہ اس نے الغزالی کی کتابوں کو اس چیز پر جلانے کا حکم دیا جس میں اسے شبہ تھا - 'انہوں نے 'عیاد' پر ظلم کیا جب کہ اس نے ان سے منع کیا: انہوں نے اسے چھپانے کے لیے اس کے نام پر 'را کے لیے عین' لگا دیا، پھر بھی وہ مشہور ہے۔ 619}۔"
  tr: "Bir süre Ceuta'nın hakimi, ardından Granada hakimi, El-Şifa'nın ezbercisi ve hadis âlimi olan ve nadir Sahiheyn ve El-Muvatta'daki Meşriq el-Enver, zamanının önde gelen âlimi, son derece zeki, eşsiz ve Sünnet'e derin bağlılıkla bağlıydı; öyle ki yanlış anladığı bir şey yüzünden El-Gazali'nin kitaplarının yakılmasını emretti. İyad'ın onları rüyasında gördüğü sırada ona kötülük ettikleri söylenirdi. İki dünya arasındaki adaletsizlik sonsuzdur ve bunu gizlemek için adındaki 'r' harfinin yerini koydular, oysa bu iyi bilinmektedir. 476 Hicri yılında doğdu ve 544 Hicri'de öldü {atıf:şadharat-dhahab, s. 619}."
  id: "Hakim Ceuta untuk sementara waktu, kemudian hakim Granada, pengapal dan ulama hadis Al-Shifa, yang tiada tandingannya, serta Mashriq al-Anwar dalam Sahihayn dan Al-Muwatta yang langka, adalah ulama terkemuka pada zamannya, sangat cerdas, tiada tanding, dan sangat setia pada Sunnah serta mematuhinya, sampai-sampai ia memerintahkan pembakaran buku-buku Al-Ghazali karena sesuatu yang ia salahpahami. Dikatakan bahwa mereka telah menyakiti Iyad saat ia bermimpi tentang mereka. Ketidakadilan antara kedua dunia itu abadi, dan mereka menempatkan 'r' dalam namanya untuk menyembunyikannya, meskipun sudah dikenal luas. Ia lahir pada tahun 476 H dan meninggal pada 544 H {cite:shadharat-dhahab, hlm. 619}."
