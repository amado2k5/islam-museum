summary:
  ar: "أبو محمد عبد الله بن الأمير يعقوب المنصور الموحدي، الملقب بالعادل؛ لما تولى عبد الواحد بمراكش كان بالأندلس فامتنع بمرسية ورأى أنه أحق بالأمر، فزحف نحو المغرب وقاسى شدائد في طريقه وقاتل أخاه أبا العلا إدريس الذي استبد بالأمر وتلقب بالمأمون {cite:wafayat-ayan}."
  en: "Abu Muhammad Abd Allah, son of the amir Ya'qub al-Mansur al-Muwahhidi, known as al-Adil. When Abd al-Wahid took power at Marrakesh he was in al-Andalus and held out at Murcia, believing himself more entitled to the command; he marched toward the Maghrib, endured hardships on the way, and fought his brother Abu al-Ala Idris, who had seized the command and styled himself al-Ma'mun {cite:wafayat-ayan}."
  fr: "Abu Muhammad Abd Allah, fils de l’émir Ya’qub al-Mansur al-Muwahhidi, connu comme al-Adil. Lorsqu’Abd al-Wahid prit le pouvoir à Marrakech, il était en al-Andalus et tint bon à Murcie, s’estimant plus digne du commandement ; il marcha vers le Maghreb, endura des épreuves en chemin et combattit son frère Abu al-Ala Idris, qui avait accaparé le commandement et pris le titre d’al-Ma’mun {cite:wafayat-ayan}."
  es: "Abu Muhammad Abd Allah, hijo del emir Ya'qub al-Mansur al-Muwahhidi, conocido como al-Adil. Cuando Abd al-Wahid tomó el poder en Marrakech, se encontraba en al-Ándalus y se mantuvo firme en Murcia, creyendo tener más derecho al mando; marchó hacia el Magreb, soportó penurias en el camino y luchó contra su hermano Abu al-Ala Idris, quien se había apoderado del mando y se hacía llamar al-Ma'mun {cite:wafayat-ayan}."
  ur: "ابو محمد عبد اللہ، امیر یعقوب المنصور المواحدی کے بیٹے، العدل کے نام سے مشہور ہیں۔ جب عبد الواحد نے مراکش میں اقتدار سنبھالا تو وہ الاندلس میں تھا اور مرسیہ میں تھا، اور اپنے آپ کو حکم کا زیادہ حقدار سمجھتا تھا۔ اس نے مغرب کی طرف کوچ کیا، راستے میں سختیاں برداشت کیں، اور اپنے بھائی ابو الاعلیٰ ادریس سے لڑا، جس نے کمان پکڑ لی تھی اور اپنے آپ کو المامون بنا لیا تھا۔"
