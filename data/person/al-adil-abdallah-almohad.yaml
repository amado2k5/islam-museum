summary:
  ar: "أبو محمد عبد الله بن الأمير يعقوب المنصور الموحدي، الملقب بالعادل؛ لما تولى عبد الواحد بمراكش كان بالأندلس فامتنع بمرسية ورأى أنه أحق بالأمر، فزحف نحو المغرب وقاسى شدائد في طريقه وقاتل أخاه أبا العلا إدريس الذي استبد بالأمر وتلقب بالمأمون {cite:wafayat-ayan}."
  en: "Abu Muhammad Abd Allah, son of the amir Ya'qub al-Mansur al-Muwahhidi, known as al-Adil. When Abd al-Wahid took power at Marrakesh he was in al-Andalus and held out at Murcia, believing himself more entitled to the command; he marched toward the Maghrib, endured hardships on the way, and fought his brother Abu al-Ala Idris, who had seized the command and styled himself al-Ma'mun {cite:wafayat-ayan}."
