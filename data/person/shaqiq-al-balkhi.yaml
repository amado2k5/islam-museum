summary:
  ar: "أبو علي شقيق بن إبراهيم البلخي؛ من مشايخ خراسان وله لسان في التوكل وحسن الكلام فيه؛ أستاذ إبراهيم بن أدهم وأخذ عنه الطريق؛ خرج إلى بلاد الترك للتجارة وهو حدث فأنكر عليه عالم من عبّاد الأصنام احتجاجاً بالرزق فكان ذلك سبب زهده فتصّدق بما يملك وطلب العلم {cite:wafayat-ayan}."
  en: "Shaqiq b. Ibrahim al-Balkhi — the Khurasanian shaykh of tawakkul and teacher of Ibrahim b. Adham; a merchant's journey among the Turks turned him to asceticism and learning {cite:wafayat-ayan}."
  es: "Shaqiq b. Ibrahim al-Balkhi — el shaykh jorasán de tawakkul y maestro de Ibrahim b. Adham; un viaje de comerciante entre los turcos lo llevó al ascetismo y al aprendizaje {cite:wafayat-ayan}."
  fr: "Shaqiq b. Ibrahim al-Balkhi — le cheikh khurasanien de tawakkul et maître d'Ibrahim b. Adham; un voyage de marchand parmi les Turcs l'a conduit à l'ascétisme et à l'apprentissage {cite:wafayat-ayan}."
  ur: "شقیق ب۔ ابراہیم البالخی - توکل کے خراسانی شیخ اور ابراہیم بن کے استاد۔ ادھم; ترکوں کے درمیان ایک سوداگر کے سفر نے اسے سنت پرستی اور سیکھنے کی طرف موڑ دیا۔"
  tr: "Ebu Ali Şaqiq bin İbrahim el-Balxi, Tanrı'ya olan güveni ve dilinde güzel konuşmalarıyla tanınan Horasan'ın şeyhlerinden biriydi; İbrahim bin Adham'ın öğretmeniydi ve onun yolunu seçti. Gençken ticaret için Türklerin topraklarına gitmiş, ancak putperestler arasında bir alim geçimini itiraz ederek ona karşı çıkmış, bu yüzden mal-mülküne göre sadaka vermiş ve bilgi aramıştır. {alıntı:vafayat-ayan}."
  id: "Abu Ali Shaqiq ibn Ibrahim al-Balkhi adalah salah satu sheikh Khurasan, dikenal karena kepercayaannya kepada Tuhan dan fasih dalam bahasanya; ia adalah guru Ibrahim ibn Adham dan menempuh jalannya. Ia pergi ke tanah Turki untuk berdagang saat masih muda, tetapi seorang ulama di antara para penyembah berhala menentangnya sebagai protes terhadap mata pencahariannya, yang menjadi alasan asketismenya, sehingga ia memberikan amal sesuai harta bendanya dan mencari ilmu. {cite:wafayat-ayan}."
