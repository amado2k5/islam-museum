id: person/abu-tammam
education:
  did_you_know:
    ar: "قال أبو تمام في فتح المعتصم عمورية سنة ٢٢٣هـ قصيدته المشهورة «السيف أصدق أنباء من الكتب»، وكان المنجمون حكموا للمعتصم عند تجهزه أن الطالع نحس."
    en: "For al-Mu'tasim's taking of Amorium in 223 AH Abu Tammam spoke his famous ode 'the sword brings truer news than books' — though the astrologers had judged the campaign's omen ill."
    ur: "معتصم کی ۲۲۳ھ میں عموریہ کی فتح پر ابوتمام نے مشہور قصیدہ «السيف أصدق أنباء من الكتب» کہا، حالانکہ منجموں نے مہم کی شروعات پر بدشگونی بتائی تھی۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/muruj-al-dhahab]
class: person
label: { ar: "أبو تمام الطائي", en: "Abu Tammam al-Ta'i", fr: "Abu Tammam al-Ta'i", es: "Abu Tammam al-Ta'i", ur: "ابو تمام الطائی" }
summary:
  ar: "الشاعر الكبير، قال في فتح المعتصم عمورية سنة ثلاث وعشرين قصيدته المشهورة السيف أصدق أنباء من الكتب في حده الحد بين الجد واللعب، وكان المنجمون حكموا للمعتصم عند تجهزه أن الطالع نحس وأنه يكسر فكان من نصره ما لم يخف {cite:tarikh-khulafa-minhaj-1434 p. 523}. وعند المسعودي ألف كتاب الحماسة وفي الناس من سماه كتاب الخبية، وصنف أبو بكر الصولي كتاباً في أخباره وشعره {cite:muruj-al-dhahab p. 463}"
  en: "The great poet; for the year-223 conquest of Amorium he composed his famous ode, declaring the sword a truer source of news than books and contrasting earnest with jest, then questioning reports and the stars; the astrologers had foretold an ill-omened rising and defeat {cite:tarikh-khulafa-minhaj-1434 p. 523}."
  fr: "Grand poète ; pour la conquête d'Amorium en 223, il composa sa célèbre ode : « L'épée est plus véridique que les livres ; sur son tranchant se séparent le sérieux et la plaisanterie », puis interrogea les prédictions et les étoiles, car les astrologues avaient annoncé un départ de mauvais augure et la défaite {cite:tarikh-khulafa-minhaj-1434 p. 523}."
  es: "El gran poeta; para la conquista de Amorium en el año 223 compuso su famosa oda, declarando que la espada era una fuente de noticias más veraz que los libros y contrastando la seriedad con la broma, para luego cuestionar los informes y las estrellas; los astrólogos habían pronosticado un ascenso y una derrota de mal agüero {cite:tarikh-khulafa-minhaj-1434 p. 523}."
  ur: "عظیم شاعر؛ اموریم کی فتح کے سال 223 کے لیے اس نے اپنی مشہور غزل لکھی، جس میں تلوار کو کتابوں سے زیادہ خبروں کا ذریعہ قرار دیا اور مذاق کے ساتھ متضاد بیان کیا، پھر رپورٹوں اور ستاروں پر سوالیہ نشان لگایا۔ نجومیوں نے ایک منحوس عروج و شکست کی پیشین گوئی کی تھی۔ 523}۔"
  tr: "Büyük şair, Hicri 23 yılında el-Mu'tasim'in Amorium'u fethini anlatan ünlü şiirinde şöyle buyurmuştur: \"Kılıç, haberlerinde kitaplardan daha doğrudur; ucu ciddiyet ile şaka arasındaki çizgidir.\" Astrologlar, el-Mu'tasim'e sefere hazırlanırken, burçların uğursuz olduğunu ve yenileceğini tahmin etmişlerdi, ancak zaferi inkar edilemezdi. {kaynak:tarikh-khulafa-minhaj-1434 s. 523}. El-Mas'udi ayrıca bazılarının \"Gizli Kitap\" olarak adlandırdığı \"El-Hamasa\" adlı kitabı yazmış ve Ebu Bekir el-Suli onun hayatı ve şiirleri hakkında bir kitap derlemiştir. {kaynak:muruj-al-dhahab s. 463}"
  id: "Penyair besar itu, dalam puisinya yang terkenal tentang penaklukan Amorium oleh al-Mu'tasim pada tahun 23 Hijriah, berkata: \"Pedang lebih benar dalam menyampaikan kabar daripada buku; ujungnya adalah garis pemisah antara keseriusan dan candaan.\" Para ahli astrologi telah meramalkan kepada al-Mu'tasim, ketika ia sedang mempersiapkan kampanye, bahwa horoskopnya tidak beruntung dan bahwa ia akan dikalahkan, namun kemenangannya tak terbantahkan. {cite:tarikh-khulafa-minhaj-1434 hlm. 523}. Al-Mas'udi juga menulis buku \"Al-Hamasa,\" yang oleh sebagian orang disebut \"Kitab yang Tersembunyi,\" dan Abu Bakr al-Suli menyusun sebuah buku tentang kehidupan dan puisinya. {cite:muruj-al-dhahab hlm. 463}"
