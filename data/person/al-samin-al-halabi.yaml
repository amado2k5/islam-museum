summary:
  ar: "السمين الحلبي، وُلد في حلب وعاش سنين طويلة في مصر، وأخذ النحو عن أبي حيان الأندلسي والقراءات عن تقي الدين الصائغ، وعلّم في جامع ابن طولون وجامع الإمام الشافعي بالقاهرة، وهو صاحب «عمدة الحفاظ في تفسير أشرف الألفاظ»."
  en: "al-Samin al-Halabi, born at Aleppo, who lived many years in Egypt, learned grammar from Abu Hayyan al-Andalusi and the readings from Taqi al-Din al-Sa'igh, and taught at the mosques of Ibn Tulun and of al-Shafi'i in Cairo; author of Umdat al-huffaz fi tafsir ashraf al-alfaz."
  es: "al-Samin al-Halabi, nacido en Alepo, que vivió muchos años en Egipto, aprendió gramática de Abu Hayyan al-Andalusi y las lecturas de Taqi al-Din al-Sa'igh y enseñó en las mezquitas de Ibn Tulun y de al-Shafi'i en El Cairo; autor del Umdat al-huffaz fi tafsir ashraf al-alfaz."
  fr: "al-Samin al-Halabi, né à Alep, qui vécut de longues années en Égypte, apprit la grammaire d'Abu Hayyan al-Andalusi et les lectures de Taqi al-Din al-Sa'igh et enseigna dans les mosquées d'Ibn Tulun et d'al-Shafi'i au Caire ; auteur de l'Umdat al-huffaz fi tafsir ashraf al-alfaz."
  ur: "السمین الحلبی، حلب میں پیدا ہوئے، برسوں مصر میں رہے، ابو حیان اندلسی سے نحو اور تقی الدین صائغ سے قراءات پڑھیں، اور قاہرہ میں ابن طولون اور امام شافعی کی مساجد میں درس دیا؛ عمدۃ الحفاظ فی تفسیر اشرف الالفاظ کے مصنف۔"
