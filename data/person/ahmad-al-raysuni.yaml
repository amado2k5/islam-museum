summary:
  ar: "أحمد بن محمد بن عبد الله الريسوني الحسني الإدريسي العروسي، أبو العباس، ثائر له زعامة من بني عروس في المغرب الأقصى، سجنه السلطان الحسن ثم صار معتمداً لعبد العزيز في طنجة وقاتل الإسبان وصالحهم، وأسره ابن عبد الكريم الخطابي فمات بتماسنت في الريف سنة ١٩٢٥م."
  en: "Ahmad ibn Muhammad ibn Abd Allah al-Raysuni al-Hasani al-Idrisi al-Arusi, Abu al-Abbas, a rebel leader of the Bani Arus in the far Maghrib, jailed by Sultan Hasan, then deputy of Abd al-Aziz at Tangier, who fought and made peace with the Spaniards, was captured by Ibn Abd al-Karim al-Khattabi and died at Tamasint in the Rif, 1925."
