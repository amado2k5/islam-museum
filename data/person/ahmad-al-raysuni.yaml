summary:
  ar: "أحمد بن محمد بن عبد الله الريسوني الحسني الإدريسي العروسي، أبو العباس، ثائر له زعامة من بني عروس في المغرب الأقصى، سجنه السلطان الحسن ثم صار معتمداً لعبد العزيز في طنجة وقاتل الإسبان وصالحهم، وأسره ابن عبد الكريم الخطابي فمات بتماسنت في الريف سنة ١٩٢٥م."
  en: "Ahmad ibn Muhammad ibn Abd Allah al-Raysuni al-Hasani al-Idrisi al-Arusi, Abu al-Abbas, a rebel leader of the Bani Arus in the far Maghrib, jailed by Sultan Hasan, then deputy of Abd al-Aziz at Tangier, who fought and made peace with the Spaniards, was captured by Ibn Abd al-Karim al-Khattabi and died at Tamasint in the Rif, 1925."
  fr: "Ahmad ibn Muhammad ibn Abd Allah al-Raysuni al-Hasani al-Idrisi al-Arusi, Abu al-Abbas, chef rebelle des Bani Arus au Maghreb extrême, emprisonné par le sultan Hasan, puis représentant d'Abd al-Aziz à Tanger. Après des guerres et des paix avec les Espagnols, il fut capturé par Ibn Abd al-Karim al-Khattabi et mourut à Tamasint dans le Rif en 1925."
  es: "Ahmad ibn Muhammad ibn Abd Allah al-Raysuni al-Hasani al-Idrisi al-Arusi, Abu al-Abbas, un líder rebelde de los Bani Arus en el extremo Magreb, encarcelado por el sultán Hasan, entonces lugarteniente de Abd al-Aziz en Tánger, que luchó y firmó la paz con los españoles, fue capturado por Ibn Abd al-Karim al-Khattabi y murió en Tamasint, en el Rif, en 1925."
