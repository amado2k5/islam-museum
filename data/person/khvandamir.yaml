summary:
  ar: "غياث الدين محمد المعروف بخواندمير (1475 – 1535)، مؤرخ فارسي من هراة، سبط المؤرخ مير خواند صاحب «روضة الصفا» وتلميذه، أتمّ المجلد السابع من كتاب جدّه وخاتمته. عمل منشيًا ودبلوماسيًا وصدرًا في أواخر الدولة التيمورية، ثم كتب تاريخه العام «حبيب السير» في هراة الصفوية، قبل أن يلتحق ببابر في الهند سنة 1528 ويكتب «قانون همايوني» في سيرة همايون. مات في دلهي ودُفن قرب ضريح نظام الدين أولياء كما أوصى."
  en: "Ghiyath al-Din Muhammad, known as Khvandamir (1475 – 1535), a Persian historian of Herat, grandson and pupil of the historian Mirkhvand of the Rawzat as-safa, whose seventh volume and epilogue he completed. He served the late Timurids as secretary, diplomat and sadr, wrote his universal history Habib al-siyar in Safavid Herat, then joined Babur in India in 1528 and composed the Qanun-i Humayuni on Humayun's reign. He died at Delhi and was buried, as he had willed, near the shrine of Nizamuddin Auliya."
  ur: "غیاث الدین محمد معروف بہ خواندمیر (1475ء – 1535ء)، ہرات کے فارسی مؤرخ، «روضۃ الصفا» کے مصنف میر خواند کے نواسے اور شاگرد، جن کے ساتویں جلد اور خاتمے کی تکمیل انھوں نے کی۔ انھوں نے آخری تیموری دور میں منشی، سفیر اور صدر کی خدمات انجام دیں، صفوی ہرات میں اپنی عالمی تاریخ «حبیب السیر» لکھی، پھر 1528ء میں ہندوستان جا کر بابر سے ملحق ہوئے اور ہمایوں کے عہد پر «قانونِ ہمایونی» تصنیف کی۔ دہلی میں وفات پائی اور اپنی وصیت کے مطابق نظام الدین اولیاء کے مزار کے قریب دفن ہوئے۔"

