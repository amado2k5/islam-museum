id: person/abu-bakr-al-bardai
class: person
label: { ar: "أبو بكر البردعي", en: "Abu Bakr Al Bardai", fr: "Abu Bakr al-Barda'i", es: "Abu Bakr Al Bardai", ur: "ابوبکر البردائی" }
summary:
  ar: "أبو بكر البردعي محمد بن عبد الله رآه ابن النديم في سنة أربعين وثلاثمائة وكان له آنسا يظهر مذهب الاعتزال وكان خارجيا وأحد فقهائهم، وقال له إن له في الفقه عدة كتب منها كتاب المرشد في الفقه وكتاب الرد على المخالفين في الفقه وكتاب تذكرة الغريب في الفقه وكتاب التبصر للمتعلمين وكتاب الاحتجاج على المخالفين وكتاب الجامع في أصول الفقه وكتاب الدعاء وكتاب الناسخ والمنسوخ في القرآن وكتاب السنة والجماعة وكتاب الإمامة وكتاب نقض كتاب ابن الراوندي في الإمامة وكتاب تحريم المسكر وكتاب الرد على من قال بالمتعة {cite:fihrist-ibn-al-nadim p. 330}."
  en: "Abu Bakr al-Barda'i — the Khariji-Mu'tazili jurist Ibn al-Nadim met in 340 {cite:fihrist-ibn-al-nadim}"
  fr: "Abu Bakr al-Barda'i — le juriste kharijite et mu'tazilite qu'Ibn al-Nadim rencontra en 340 {cite:fihrist-ibn-al-nadim}"
  es: "Abu Bakr al-Barda'i - el jurista Khariji-Mu'tazili Ibn al-Nadim se reunió en 340 {cita:fihrist-ibn-al-nadim}"
  ur: "ابو بکر البرداعی - خارجی معتزلی فقیہ ابن الندیم نے 340 میں ملاقات کی۔"
  tr: "İbn el-Nadim, Ebu Bekr el-Barda'i Muhammed ibn Abdullah'ı Hicri 340 yılında görmüştür. Kendisinin, açıkça Mu'tezile mezhebini benimseyen, Harici ve onların fıkıhçılarından bir arkadaşı vardı. Ona, fıkıh konusunda çeşitli kitapları olduğunu, bunların arasında Fıkra Rehberi, Fıkramda Muhaliflerin Reddi, Fıkrada Yabancılar İçin Hatırlatma, Öğrenciler İçin Bilgi, Muhaliflerin Argümanları, Fıkra Prensipleri Üzerine Kapsamlı Kitap, Dua Kitabı, Kur'an'daki Nesih ve Neshedilmiş Ayetler Kitabı, Sünnet ve Topluluk Kitabı, İmamet Kitabı, İbn el-Ravandi'nin İmamet Kitabının Reddi, Sarhoş Edici Maddelerin Yasaklanması ve Geçici Evlilikten Bahsedenlerin Reddi gibi eserlerin bulunduğunu söyledi. {cite:fihrist-ibn-al-nadim s. 330}"
  id: "Abu Bakr al-Barda’i Muhammad ibn Abdullah dilihat oleh Ibn al-Nadim pada tahun 340 H. Beliau memiliki seorang sahabat yang secara terbuka menganut doktrin Mu’tazilah dan merupakan seorang Kharijite serta salah satu ahli hukum mereka. Dia memberitahunya bahwa dia memiliki beberapa buku tentang fiqih, termasuk: Petunjuk tentang Fiqih, Bantahan terhadap Para Penentang dalam Fiqih, Peringatan bagi Orang Asing dalam Fiqih, Wawasan bagi Para Pelajar, Argumentasi Para Penentang, Kitab Komprehensif tentang Prinsip-Prinsip Fiqih, Kitab Doa, Kitab Pembatalan dan Ayat-ayat yang Dibatalkan dalam Al-Qur'an, Kitab Sunnah dan Masyarakat, Kitab Imamah, Bantahan terhadap Kitab Imamah Ibn al-Rawandi, Larangan Minuman Keras, dan Bantahan terhadap Mereka yang Mengatakan tentang Pernikahan Sementara {cite:fihrist-ibn-al-nadim p. 330}."
