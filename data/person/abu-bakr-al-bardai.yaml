id: person/abu-bakr-al-bardai
class: person
label: { ar: "أبو بكر البردعي", en: "Abu Bakr Al Bardai" }
summary:
  ar: "أبو بكر البردعي محمد بن عبد الله رآه ابن النديم في سنة أربعين وثلاثمائة وكان له آنسا يظهر مذهب الاعتزال وكان خارجيا وأحد فقهائهم، وقال له إن له في الفقه عدة كتب منها كتاب المرشد في الفقه وكتاب الرد على المخالفين في الفقه وكتاب تذكرة الغريب في الفقه وكتاب التبصر للمتعلمين وكتاب الاحتجاج على المخالفين وكتاب الجامع في أصول الفقه وكتاب الدعاء وكتاب الناسخ والمنسوخ في القرآن وكتاب السنة والجماعة وكتاب الإمامة وكتاب نقض كتاب ابن الراوندي في الإمامة وكتاب تحريم المسكر وكتاب الرد على من قال بالمتعة {cite:fihrist-ibn-al-nadim p. 330}."
  en: "Abu Bakr al-Barda'i — the Khariji-Mu'tazili jurist Ibn al-Nadim met in 340 {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim, source/muruj-al-dhahab]
