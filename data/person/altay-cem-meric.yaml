summary:
  ar: "طبيب وكاتب وصانع محتوى تركي، وُلد سنة 1991 في أنقرة، تخرّج في كلية الطب بجامعة نجم الدين أربكان في قونية ويمارس الطب، عُرف بقصة عودته من الإلحاد إلى الإسلام بعد فترة تساؤل، وبكتبِه وقناته في الإيمان والفلسفة والعلوم الإسلامية، وأسّس دار تين للنشر. بلغت قناته على يوتيوب 539,000 مشترك كما في 3 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish physician, author and content creator, born in 1991 in Ankara. He graduated from Necmettin Erbakan University's Faculty of Medicine in Konya and practises medicine, is known for his return from atheism to Islam after a period of questioning, for his books and his channel on faith, philosophy and the Islamic sciences, and founded the Tin publishing house. His YouTube channel counted 539,000 subscribers as of 3 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک طبیب، مصنف اور مواد ساز، جو 1991ء میں انقرہ میں پیدا ہوئے، قونیہ کی نجم الدین اربکان یونیورسٹی کے شعبۂ طب سے فارغ التحصیل ہوئے اور طب کی مشق کرتے ہیں، ایک دورِ تساؤل کے بعد الحاد سے اسلام کی طرف واپسی کی اپنی کہانی، اپنی کتابوں اور ایمان، فلسفہ اور اسلامی علوم پر اپنے چینل کے لیے جانے جاتے ہیں، اور تین اشاعتی ادارے کے بانی ہیں۔ vidIQ کے مطابق 3 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 539,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Médico, autor y creador de contenido turco, nacido en 1991 en Ankara. Se graduó de la Facultad de Medicina de la Universidad Necmettin Erbakan en Konya y ejerce la medicina. Es conocido por su conversión del ateísmo al islam tras un periodo de dudas, por sus libros y su canal sobre fe, filosofía y ciencias islámicas, y fundó la editorial Tin. Su canal de YouTube contaba con 539 000 suscriptores al 3 de noviembre de 2026, según vidIQ (dato desactualizado de la plataforma, no verificado por ningún museo)."
  fr: "Médecin, auteur et créateur de contenu turc, né en 1991 à Ankara, il est diplômé de la faculté de médecine de l'université Necmettin Erbakan de Konya. Il exerce la médecine et est connu pour sa conversion de l'athéisme à l'islam après une période de questionnement, pour ses livres et sa chaîne YouTube consacrés à la foi, à la philosophie et aux sciences islamiques. Il a également fondé la maison d'édition Tin. Sa chaîne YouTube comptait 539 000 abonnés au 3 novembre 2026 selon vidIQ – un chiffre ancien, non vérifié par un musée."
  tr: "1991 yılında Ankara'da doğan Türk doktor, yazar ve içerik üreticisi, Konya'daki Necmettin Erbakan Üniversitesi Tıp Fakültesi'nden mezun olmuş ve tıp pratiği yapmaktadır. Ateizmden bir süre sorgulamadan sonra İslam'a dönüşü, inanç, felsefe ve İslam bilimleri üzerine kitapları ve kanalıyla tanınır ve Tinn Yayınevi'ni kurmuştur. YouTube kanalı, müze tarafından doğrulanmış bilgi içermeyen bir tarihçi platform numarası olan vidIQ'ye göre 3 Kasım 2026 itibarıyla 539.000 aboneye ulaşmıştır."
  id: "Seorang dokter, penulis, dan pembuat konten asal Turki, lahir tahun 1991 di Ankara, lulus dari Fakultas Kedokteran di Universitas Necmettin Erbakan di Konya dan berpraktik sebagai dokter. Ia dikenal karena kembalinya dari ateisme ke Islam setelah masa pertanyaan, serta buku dan salurannya tentang iman, filsafat, dan ilmu Islam, serta mendirikan Tinn Publishing House. Saluran YouTube-nya mencapai 539.000 pelanggan per 3 November 2026, menurut vidIQ, yang merupakan nomor platform sejarawan tanpa fakta yang diverifikasi oleh museum."
