summary:
  ar: "أوس بن حذيفة الثقفي، صحابي، وفد على النبي في وفد ثقيف من بني مالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14953} روى عن النبي وعن علي بن أبي طالب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14953} وروى عنه ابنه عمرو، وابن ابنه عثمان بن عبد الله، والنعمان بن سالم، وجماعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14953}"
  en: "Aws ibn Hudhayfa al-Thaqafi, a Companion who came to the Prophet with the delegation of Thaqif from Banu Malik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14953} He narrated from the Prophet and from Ali ibn Abi Talib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14953} Those who narrated from him include his son Amr, his grandson Uthman ibn Abd Allah, al-Nu'man ibn Salim and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14953}"
