id: person/al-talamanke
class: person
label: { ar: "أبو عمر الطلمنكي أحمد بن محمد المعافري", en: "Abu Umar al-Talamanki Ahmad ibn Muhammad al-Ma'afiri", fr: "Abu Umar al-Talamanki Ahmad ibn Muhammad al-Ma'afiri", es: "Abu Umar al-Talamanki Ahmad ibn Muhammad al-Ma'afiri", ur: "ابو عمر التلمانکی احمد بن محمد المعفری" }
summary:
  ar: "أبو عمر أحمد بن محمد بن عبد الله بن عيسى المعافري الأندلسي الطلمنكي، المقري الحادث الحافظ عالم أهل قرطبة صاحب التصانيف، وله تسعون سنة؛ حج فأخذ بمصر عن أبي بكر الأدفوي وأبي بكر المهندس وخلق كثير، وكان خبيراً في علوم القرآن تفسيره وقراءاته وإعرابه وأحكامه ومعانيه؛ قال ابن بشكوال كان سيفاً مجرداً على أهل الأهواء والبدع قامعاً لهم غيوراً على الشريعة {cite:shadharat-dhahab p. 243-244}."
  en: "Abu Umar Ahmad al-Talamanke al-Ma'afiri of Cordoba — the city's master reciter and hadith scholar, expert in every Qur'anic science; Ibn Bashkuwal called him 'an unsheathed sword against people of whims and innovations'. Ninety years old, he died in 429 {cite:shadharat-dhahab p. 243-244}."
  fr: "Abu Umar Ahmad al-Talamanke al-Ma'afiri de Cordoue - le maître récitant et érudit du hadith de la ville, expert dans toutes les sciences coraniques ; Ibn Bashkuwal l'appelait « une épée dégainée contre les gens de caprices et d'innovations ». Quatre-vingt-dix ans, il meurt en 429 {cite:shadharat-dhahab p. 243-244}."
  es: "Abu Umar Ahmad al-Talamanke al-Ma'afiri de Córdoba — el maestro recitador y erudito de hadices de la ciudad, experto en todas las ciencias coránicas; Ibn Bashkuwal lo llamó \"una espada desenvainada contra la gente de caprichos e innovaciones\". Murió a los noventa años en 429 {cite:shadharat-dhahab p. 243-244}."
  ur: "ابو عمر احمد الطلمانکے المافری آف قرطبہ - شہر کے بڑے قاری اور حدیث کے اسکالر، ہر قرآنی سائنس میں ماہر؛ ابن بشکوال نے اسے 'لوگوں اور بدعات کے خلاف ایک بے بند تلوار' کہا۔ نوے سال کی عمر میں 429 میں وفات پائی۔ 243-244}۔"
  tr: "Ebu Ömer Ahmed bin Muhammed bin Abdullah ibn İsa el-Ma'afiri el-Endülüs el-Telimanki, el-Maqri, Hadis, Hadis, Hadis, Kordoba halkının alimi, eserlerin yazarı ve doksan yaşında; Hac yapmış ve Mısır'da Ebu Bekir el-Adfavi, Ebu Bekir el-Muhandis ve daha birçok kişinin yanında eğitim görmüştür. Kur'an ilimleri konusunda uzmandı: yorumu, okunması, dilbilgisi, hükümleri ve anlamları; İbn Başkuwal, onun kaprislere ve yeniliklere karşı keskin bir kılıç olduğunu, onları bastırdığını ve Şeriat'a gayretli olduğunu söylemiştir {atı: şadharat-dhahab s. 243-244}."
  id: "Abu Umar Ahmad ibn Muhammad ibn Abdullah ibn Isa al-Ma'afiri al-Andalusi al-Talimanki, al-Maqri, Hadits, Hadits, Hadits, ulama masyarakat Cordoba, penulis karya, dan berusia sembilan puluh tahun; ia melaksanakan Haji dan belajar di Mesir di bawah bimbingan Abu Bakr al-Adfawi, Abu Bakr al-Muhandis, dan banyak lainnya. Ia adalah ahli dalam ilmu Al-Qur'an: penafsiran, pembacaan, tata bahasa, keputusan, dan makna; Ibn Bashkuwal mengatakan ia adalah pedang tajam terhadap orang-orang yang suka berniat dan berinovasi, menekan mereka dan bersemangat untuk Syariah {cite:shadharat-dhahab hlm. 243-244}."
