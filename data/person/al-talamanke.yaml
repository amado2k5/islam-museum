label: { ar: "أبو عمر الطلمنكي أحمد بن محمد المعافري" }
summary:
  ar: "أبو عمر أحمد بن محمد بن عبد الله بن عيسى المعافري الأندلسي الطلمنكي، المقري الحادث الحافظ عالم أهل قرطبة صاحب التصانيف، وله تسعون سنة؛ حج فأخذ بمصر عن أبي بكر الأدفوي وأبي بكر المهندس وخلق كثير، وكان خبيراً في علوم القرآن تفسيره وقراءاته وإعرابه وأحكامه ومعانيه؛ قال ابن بشكوال كان سيفاً مجرداً على أهل الأهواء والبدع قامعاً لهم غيوراً على الشريعة {cite:shadharat-dhahab p. 243-244}."
  en: "Abu Umar Ahmad al-Talamanke al-Ma'afiri of Cordoba — the city's master reciter and hadith scholar, expert in every Qur'anic science; Ibn Bashkuwal called him 'an unsheathed sword against people of whims and innovations'. Ninety years old, he died in 429 {cite:shadharat-dhahab p. 243-244}."
