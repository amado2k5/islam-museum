summary:
  ar: "ناصيف بن عبد الله بن ناصيف بن جنبلاط، الشهير باليازجي، شاعر من كبار الأدباء في عصره، أصله من حمص ومولده في كفرشيما بلبنان ووفاته ببيروت ١٢١٤ إلى ١٢٨٧هـ الموافقة ١٨٠٠ إلى ١٨٧١م، خدم الأمير بشير الشهابي في الكتابة نحو اثنتي عشرة سنة ثم انقطع للتأليف والتدريس."
  en: "Nasif ibn Abd Allah ibn Nasif ibn Janbalat, known as al-Yaziji, a poet and one of the leading men of letters of his time; his family was from Homs, he was born at Kafarshima in Lebanon and died in Beirut, 1214 to 1287 AH, 1800 to 1871 CE; he served the Emir Bashir al-Shihabi as a scribe for about twelve years, then gave himself to writing and teaching."
