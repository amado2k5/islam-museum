  tr: "Haydarabad'ın ikinci Nizamı Nasir Jank Mir Ahmad'ın ön kartı; 1748'de babası Asaf Jah'ın yerine geçen ve 1750 yılında Dekkan'daki Halifelik Savaşı'nda ölmüştür; Önemli Sözlüklerde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Nasir Jank Mir Ahmad, Nizam kedua Hyderabad, yang menggantikan ayahnya Asaf Jah pada tahun 1748 M dan tewas dalam Perang Khalifah di Deccan pada tahun 1750 M; ia disebutkan dalam Kamus Terkenal dan biografinya belum pernah diulas di halaman tersebut."
