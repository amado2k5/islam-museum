summary:
  ar: "حسام الدين حسن بن علي الأبيوردي الشافعي نزيل مكة؛ نسبة إلى أباورد بلدة بخراسان، أخذ عن السعد التفتازاني وغيره وبرع في المعقولات ودخل اليمن فاجتمع بالناصر ففوض إليه تدريس بعض المدارس بتعز فعاجلته المنية بها، وصنف ربيع الجنان في المعاني والبيان {cite:shadharat-dhahab p. 129}."
  en: "Husam al-Din al-Abiwardi of Abiward in Khurasan, later of Mecca — pupil of Sa'd al-Din al-Taftazani, brilliant in the rational sciences; al-Nasir of Yemen charged him with teaching at Ta'izz's madrasas, where death overtook him in 815; author of Rabi' al-Jinan on semantics and rhetoric {cite:shadharat-dhahab p. 129}."
  es: "Husam al-Din al-Abiwardi de Abiward en Jorasán, más tarde de La Meca, discípulo de Sa'd al-Din al-Taftazani, brillante en las ciencias racionales; al-Nasir de Yemen le encargó la enseñanza en las madrasas de Ta'izz, donde la muerte lo sorprendió en 815; autor de Rabi' al-Jinan sobre semántica y retórica {cite:shadharat-dhahab p. 129}."
  fr: "Husam al-Din al-Abiwardi d'Abiward au Khorasan, plus tard à La Mecque — élève de Sa'd al-Din al-Taftazani, brillant dans les sciences rationnelles; al-Nasir du Yémen le chargea d'enseigner dans les madrasas de Ta'izz, où la mort le surprit en 815; auteur de Rabi' al-Jinan sur la sémantique et la rhétorique {cite:shadharat-dhahab p. 129}."
  ur: "خراسان میں ابیوارد کے حسام الدین العبیوردی، بعد میں مکہ کے - سعدالدین تفتازانی کے شاگرد، عقلی علوم میں شاندار؛ یمن کے النصیر نے اس پر طائز کے مدرسوں میں تعلیم دینے کا الزام لگایا، جہاں 815 میں اس پر موت آ گئی۔ ربیع الجنان کے مصنف معنوی اور بیانات پر {حوالہ: شدارت ذہاب ص۔ 129}۔"
  tr: "Hüsameddin Hasan ibn Ali el-Abiwardi el-Şafii, Horasan'daki Abward kasabasından adını alan Mekke'de ikamet eden, el-Sa'd el-Teftazani ve diğerlerinin yanında eğitim aldı, akıl bilimlerinde üstün oldu ve Yemen'e girdi, Taiz'de bazı okulları öğretmenliği için ona emanet eden el-Nasir ile tanıştı. Orada hızla vefat etti ve anlamları ve hitabeti açısından Rabi' al-Jinan adlı eserini yazdı."
  id: "Hussam al-Din Hasan ibn Ali al-Abiwardi al-Shafi'i, penduduk Mekah, dinamai menurut Abward, sebuah kota di Khorasan, belajar di bawah bimbingan al-Sa'd al-Taftazani dan lainnya, unggul dalam ilmu rasional, dan masuk Yaman, bertemu dengan al-Nasir, yang mempercayakannya untuk mengajar beberapa sekolah di Taiz. Ia meninggal di sana dengan cepat, dan menulis Rabi' al-Jinan dalam makna dan kefasihan."
