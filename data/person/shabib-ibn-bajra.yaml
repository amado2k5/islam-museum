id: person/shabib-ibn-bajra
class: person
label: { ar: "شبيب بن بجرة الأشجعي" }
summary:
  ar: "ذكر الطبري أن ابن ملجم أتى رجلاً من أشجع يقال له شبيب بن بجرة في سياق الإعداد لاغتيال علي {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وعند المسعودي لقّبه ابن ملجم فقال هل لك في شرف الدنيا والآخرة تساعدني على قتل علي فقال ثكلتك أمك قد عرفت غناءه في الإسلام فأقنعه بقتل إخوانهم المصلين فضرب يومئذ فوقعت ضربته بعتبة الباب، وهرب إلى رحله فقتله ابن عمه عبد الله بن نجدة {cite:muruj-al-dhahab p. 702}"
  tr: "El-Taberi, İbn Mulcam'ın Ali'yi öldürmeye hazırlanırken Aşca'dan Shabib ibn Bajrah adında bir adama geldiğini belirtti {cite:tabari-history-abu-al-fadl j.5 s.144}. Al-Mas'udi ona İbn Muljam unvanını verdi ve şöyle dedi: Bu dünyanın ve ahiretin şerefi için bana Ali'yi öldürmeme yardım edecek misin? Dedi ki, 'Annen yas tuttu; onun İslam'daki şarkılarını biliyordu, bu yüzden onu ibadet edenleri öldürmesi için ikna etti. O gün dövüldü ve darbesi kapıya düştü. Yolculuk sırasında kaçtı, ancak kuzeni Abdullah ibn Najdah onu öldürdü {cite:muruj-al-dhahab s. 702}"
  id: "Al-Tabari menyebutkan bahwa Ibn Muljam datang kepada seorang pria dari Ashja' bernama Shabib ibn Bajrah dalam konteks persiapan pembunuhan Ali {cite:tabari-history-abu-al-fadl j.5 hlm.144}. Al-Mas'udi memberinya gelar Ibn Muljam dan berkata: Apakah engkau demi kehormatan dunia ini dan akhirat ingin membantuku membunuh Ali? Ia berkata, 'Ibumu sedang berduka; ia tahu nyanyiannya dalam Islam, jadi ia meyakinkan Ali untuk membunuh sesama penganut mereka. Hari itu ia dipukuli, dan pukulannya jatuh di ambang pintu. Ia melarikan diri dalam perjalanan, tetapi sepupunya Abdullah ibn Najdah membunuhnya {cite:muruj-al-dhahab hlm. 702}"
