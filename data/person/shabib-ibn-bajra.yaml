label: { ar: "شبيب بن بجرة الأشجعي" }
summary:
  ar: "ذكر الطبري أن ابن ملجم أتى رجلاً من أشجع يقال له شبيب بن بجرة في سياق الإعداد لاغتيال علي {cite:tabari-tarikh-abu-al-fadl j.5 p.144}. وعند المسعودي لقّبه ابن ملجم فقال هل لك في شرف الدنيا والآخرة تساعدني على قتل علي فقال ثكلتك أمك قد عرفت غناءه في الإسلام فأقنعه بقتل إخوانهم المصلين فضرب يومئذ فوقعت ضربته بعتبة الباب، وهرب إلى رحله فقتله ابن عمه عبد الله بن نجدة {cite:muruj-al-dhahab p. 702}"
