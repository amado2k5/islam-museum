label:
  ar: ورش غلام عثمان
  en: Warash, Uthman's servant
  es: "Warash, Uthman's servant"
  fr: "Warash, Uthman's servant"
  ur: "وارث، عثمان کا خادم"
summary:
  ar: غلام عثمان الذي اعترضه المنصرفون من جيش أهل مصر بحسمى وهو على بعير مقبل من المدينة فقرروه فأظهر كتاباً إلى ابن أبي سرح صاحب مصر فيه إذا قدم عليك الجيش فاقطع يد فلان واقتل فلاناً وأحصى أكثر من في الجيش، وعلم القوم أن الكتاب بخط مروان فرجعوا وحاصروا عثمان {cite:muruj-al-dhahab p. 638}.
  en: Uthman's servant caught at Hasma carrying the fateful letter to Ibn Abi Sarh — cut this man's hand, kill that one — written in Marwan's hand; its discovery turned the army back to the siege {cite:muruj-al-dhahab p. 638}.
  es: "El sirviente de Uthman fue capturado en Hasma llevando la fatídica carta a Ibn Abi Sarh —corta la mano de este hombre, mata a aquel— escrita de puño y letra de Marwan; su descubrimiento hizo que el ejército volviera al asedio {cite:muruj-al-dhahab p. 638}."
  fr: "Le serviteur d'Uthman fut surpris à Hasma portant la lettre fatidique à Ibn Abi Sarh — couper la main de cet homme, tuer celui-là — écrite de la main de Marwan; sa découverte força l'armée à reprendre le siège {cite:muruj-al-dhahab p. 638}."
  ur: "عثمان کا نوکر ابن ابی سرح کے نام خطیر خط لے کر جاتے ہوئے اسماء کے پاس پکڑا گیا - اس شخص کا ہاتھ کاٹ دو، اس کو مار دو - مروان کے ہاتھ میں لکھا ہوا تھا۔ اس کی دریافت نے فوج کو دوبارہ محاصرے کی طرف موڑ دیا {حوالہ: مروج الذہب صفحہ 638}۔"
  tr: "Osman'ın hizmetçisi, Medine'den gelen deveyle Mısır ordusunun kafirleri tarafından kesin bir şekilde durduruldu ve kesin bir yenilgiye uğratıldı. Mısır hükümdarı İbn Ebi Sarh'a bir mektup gösterdi; mektupta, ordu sana gelirse falancının elini kes, falancıyı öldür ve orduda en çok kişi olduğunu belirtti. Halk, mektubun Mervan'ın el yazısıyla yazıldığını öğrendi, geri döndü ve Osman kuşattı {atıf:muruj-al-dhahab, s. 638}."
  id: "Hamba Utsman, yang secara tegas dicegat oleh kaum kafir dari tentara Mesir saat menunggang unta dari Madinah, dikalahkan dengan telak. Ia menunjukkan surat kepada Ibn Abi Sarh, penguasa Mesir, yang menyatakan bahwa jika pasukan menyerang Anda, potong tangan si anu, bunuh si anu, dan hitung yang paling banyak di dalam pasukan. Orang-orang mengetahui bahwa surat itu ditulis dengan tulisan tangan Marwan, sehingga mereka kembali dan mengepung Utsman {cite:muruj-al-dhahab, hlm. 638}."
