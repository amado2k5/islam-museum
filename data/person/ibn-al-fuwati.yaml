summary:
  ar: "عبد الرزاق «ابن الفوطي»، مؤرخ بغدادي فيلسوف النزعة تلميذ الطوسي صاحب «مجمع الآداب» و«الحوادث الجامعة»؛ توفي سنة 723هـ ⁦(1323م)⁩."
  en: "Abd al-Razzaq “Ibn al-Fuwati” (1244–1323), Baghdadi historian, pupil of al-Tusi, author of Majma' al-Adab and al-Hawadith al-Jami'a."
  es: "Abd al-Razzaq “Ibn al-Fuwati” (1244-1323), historiador bagdadí, alumno de al-Tusi, autor de Majma' al-Adab y al-Hawadith al-Jami'a."
  fr: "Abd al-Razzaq « Ibn al-Fuwati » (1244-1323), historien baghdadi, élève d'al-Tusi, auteur de Majma' al-Adab et d'al-Hawadith al-Jami'a."
  ur: "عبد الرزاق \"ابن الفواتی\" (1244-1323)، بغدادی مورخ، الطوسی کے شاگرد، مجمع الادب اور الحوادۃ الجامع کے مصنف۔"
  tr: "Abdul Razzaq 'İbn el-Futi', Bağdatlı bir tarihçi, eğilimli filozof, el-Tusi'nin öğrencisi, 'Majma' al-Adab' ve 'Al-Hawadith al-Jami' eserlerinin yazarıydı; 723 Hicri (1323 M.S.) yılında vefat etti."
  id: "Abdul Razzaq 'Ibn al-Futi' adalah seorang sejarawan Baghdadi, filsuf kecenderungan, murid al-Tusi, penulis 'Majma' al-Adab' dan 'Al-Hawadith al-Jami'; ia meninggal pada tahun 723 H (1323 M)."
