summary:
  ar: "مفكر وسياسي مصري (1872-1963)، مؤسس صحيفة «الجريدة» وحزب الأمة سنة 1907، ورئيس دار الكتب المصرية ثم أول رئيس للجامعة المصرية. لُقّب «أستاذ الجيل»، وكان من أبرز منظّري القومية المصرية والليبرالية، وصاحب القول المشهور «الاختلاف في الرأي لا يفسد للود قضية»."
  en: "Egyptian intellectual and politician (1872-1963), founder of the newspaper al-Jarida and of Hizb al-Umma in 1907, director of the National Library and first president of the Egyptian University. Known as 'Professor of the Generation', he was a leading theorist of Egyptian nationalism and liberalism."
  ur: "مصری مفکر اور سیاست دان (1872-1963)، اخبار «الجریدہ» اور حزب الامہ (1907) کے بانی، دار الکتب مصریہ کے سربراہ اور مصری جامعہ کے پہلے صدر۔ انہیں «استادِ نسل» کہا جاتا ہے اور وہ مصری قومیت اور لبرل ازم کے نمایاں نظریہ ساز تھے۔"
