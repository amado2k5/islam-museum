summary:
  ar: "حاكم البحرين من وفاة أبيه عيسى بن علي سنة 1932 حتى وفاته سنة 1942، وكان نائب الحاكم الفعلي منذ سنة 1923. وُلد سنة 1872 ثاني أبناء عيسى بن علي، وفي عهده بدأ إنتاج أول بئر نفط على الضفة الغربية للخليج سنة 1932، وأسّس الحكم البلدي وطوّر التعليم والصحة والكهرباء والماء بمعاونة المستشار تشارلز بلغريف."
  en: "Hakim (ruler) of Bahrain from the death of his father Isa bin Ali in 1932 until his own death in 1942, having been deputy ruler in fact since 1923. Born in 1872, the second of Isa bin Ali's sons, he saw the first oil well on the western shore of the Gulf begin production in 1932, founded municipal government and developed education, health, electricity and water services, assisted by the adviser Charles Belgrave."
  ur: "1932ء میں اپنے والد عیسیٰ بن علی کی وفات سے 1942ء میں اپنی وفات تک بحرین کے حاکم، اور 1923ء سے درحقیقت نائب حاکم۔ 1872ء میں عیسیٰ بن علی کے دوسرے بیٹے پیدا ہوئے؛ ان کے دور میں 1932ء میں خلیج کے مغربی کنارے پر پہلے تیل کے کنویں سے پیداوار شروع ہوئی، بلدیاتی حکومت قائم ہوئی اور مشیر چارلس بیلگریو کی معاونت سے تعلیم، صحت، بجلی اور پانی کی خدمات نے ترقی کی۔"
