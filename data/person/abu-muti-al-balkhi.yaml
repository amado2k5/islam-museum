  es: "Al-Hakam ibn Abd Allah, Abu Muti al-Balkhi, jurista y autor del Fiqh al-akbar, que estudió con Abu Hanifa, fue juez de Balkh y murió en el año 199 de la Hégira."
  ur: "الحکم بن عبد اللہ، ابو مطیع البالخی، ایک فقیہ اور فقہ اکبر کے مصنف، جنہوں نے ابو حنیفہ سے تعلیم حاصل کی، بلخ کے قاضی کے طور پر خدمات انجام دیں اور 199 ہجری میں وفات پائی۔"
