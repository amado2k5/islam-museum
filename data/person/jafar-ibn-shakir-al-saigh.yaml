summary:
  ar: "أبو محمد الصائغ، سمع من عفان وقبيصة وأبي نعيم وغيرهم، روى عنه ابن صاعد وابن مخلد وأبو الحسين بن المنادي والنجاد وأبو بكر الشافعي، وكان عابدًا زاهدًا ثقة صدوقًا متقنًا ضابطًا وانتفع به خلق كثير وأكثر الناس عنه لثقته وصلاحه، بلغ تسعين سنة غير أشهر يسيرة؛ توفي في ذي الحجة ودفن في مقابر باب التوبة ببغداد {cite:muntazam-ibn-al-jawzi p. 180}."
  en: "Abu Muhammad al-Sa'igh, the devout, exacting traditionist of 'Affan, Qabisa and Abu Nu'aym — most people's most-trusted authority; near ninety, he died in Dhu'l-Hijja and was buried at Baghdad's Bab al-Tawba cemetery {cite:muntazam-ibn-al-jawzi p. 180}."
