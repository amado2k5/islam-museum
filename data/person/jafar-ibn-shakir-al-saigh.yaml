summary:
  ar: "أبو محمد الصائغ، سمع من عفان وقبيصة وأبي نعيم وغيرهم، روى عنه ابن صاعد وابن مخلد وأبو الحسين بن المنادي والنجاد وأبو بكر الشافعي، وكان عابدًا زاهدًا ثقة صدوقًا متقنًا ضابطًا وانتفع به خلق كثير وأكثر الناس عنه لثقته وصلاحه، بلغ تسعين سنة غير أشهر يسيرة؛ توفي في ذي الحجة ودفن في مقابر باب التوبة ببغداد {cite:muntazam-ibn-al-jawzi p. 180}."
  en: "Abu Muhammad al-Sa'igh, the devout, exacting traditionist of 'Affan, Qabisa and Abu Nu'aym — most people's most-trusted authority; near ninety, he died in Dhu'l-Hijja and was buried at Baghdad's Bab al-Tawba cemetery {cite:muntazam-ibn-al-jawzi p. 180}."
  es: "Abu Muhammad al-Sa'igh, el devoto y exigente tradicionalista de 'Affan, Qabisa y Abu Nu'aym, la autoridad más confiable para la mayoría de la gente; cerca de los noventa años, murió en Dhu'l-Hijja y fue enterrado en el cementerio Bab al-Tawba de Bagdad {cite:muntazam-ibn-al-jawzi p. 180}."
  fr: "Abu Muhammad al-Sa'igh, le dévot et exigeant traditionaliste d'Affan, Qabisa et Abu Nu'aym — l'autorité la plus digne de confiance pour la plupart des gens; près de quatre-vingt-dix ans, il mourut en Dhu'l-Hijja et fut enterré au cimetière Bab al-Tawba de Bagdad {cite:muntazam-ibn-al-jawzi p. 180}."
  ur: "ابو محمد الصائغ، عفان، قبیصہ اور ابو نعیم کے متقی، پریکٹس کرنے والے روایت کرنے والے - زیادہ تر لوگوں کا سب سے قابل اعتماد اتھارٹی؛ نوے کے قریب آپ کی وفات ذوالحجہ میں ہوئی اور بغداد کے باب التوبہ قبرستان میں دفن ہوئے۔ 180}۔"
  tr: "Ebu Muhammed el-Sa'igh, Affan, Kabise, Ebu Nuaym ve diğerlerinden haber aldı. İbn Said, İbn Mukhlad, Ebu el-Hüseyin bin el-Munadi, el-Najad ve Ebu Bekir el-Şafii ondan rivayet etti. O, dindar, münzevi, güvenilir, titiz ve disiplinli bir ibadet edendi. Birçok kişi onun güvenilirliği ve doğruluğu sayesinde ondan faydalandı. Doksan yaşındaydı, az sayıdaki ünlü değildi; Dhu al-Hijjah'da öldü ve Bağdat'taki Bab al-Tewbah mezarlığına defnedildi {cite:muntazam-ibn-al-jawzi s. 180}."
  id: "Abu Muhammad al-Sa'igh mendengar dari Affan, Qabisa, Abu Nu'aym, dan lainnya. Ibn Sa'id, Ibn Mukhlad, Abu al-Husayn ibn al-Munadi, al-Najad, dan Abu Bakr al-Shafi'i menceritakan darinya. Ia adalah seorang pemuja yang taat, pertapa, dapat dipercaya, tepat, dan disiplin. Banyak orang mendapat manfaat darinya karena kepercayaan dan kebenarannya. Ia berusia sembilan puluh tahun, tidak sedikit yang terkenal; ia meninggal di Dhu al-Hijjah dan dimakamkan di pemakaman Bab al-Tawbah di Baghdad {cite:muntazam-ibn-al-jawzi hlm. 180}."
