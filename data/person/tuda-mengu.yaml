summary:
  ar: "تدان بن منكوتمر، ملك الدست بالشمال بعد أبيه سنة 681هـ؛ جلس على كرسي ملكهم بصراي فأقام خمس سنين ثم ترهب وخرج عن الملك سنة 686هـ وانقطع إلى صحبة المشايخ الفقراء، فملك مكانه قلابغا."
  en: "Tuda-Mengu ibn Mengu-Timur, king of the northern Dasht after his father in 681 AH; he sat five years on their throne at Saray then turned dervish, quit the kingship in 686 and devoted himself to the company of the poor shaykhs — Qalabgha succeeding."
