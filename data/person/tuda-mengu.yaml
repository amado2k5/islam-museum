label:
  ar: تدان بن منكوتمر ملك الدست
  en: Tuda-Mengu ibn Mengu-Timur
  es: "Tuda-Mengu ibn Mengu-Timur"
  fr: "Tuda-Mengu ibn Mengu-Timur"
summary:
  ar: "تدان بن منكوتمر، ملك الدست بالشمال بعد أبيه سنة 681هـ؛ جلس على كرسي ملكهم بصراي فأقام خمس سنين ثم ترهب وخرج عن الملك سنة 686هـ وانقطع إلى صحبة المشايخ الفقراء، فملك مكانه قلابغا."
  en: "Tuda-Mengu ibn Mengu-Timur, king of the northern Dasht after his father in 681 AH; he sat five years on their throne at Saray then turned dervish, quit the kingship in 686 and devoted himself to the company of the poor shaykhs — Qalabgha succeeding."
  es: "Tuda-Mengu ibn Mengu-Timur, rey de los Dasht del norte tras su padre en el año 681 de la Hégira; reinó durante cinco años en Saray, luego se convirtió en derviche, renunció al trono en el año 686 y se dedicó a la compañía de los shaykhs pobres, sucediendo a Qalabgha."
  fr: "Tuda-Mengu ibn Mengu-Timur, roi du Dasht du Nord après son père en 681 AH; il siégea cinq ans sur leur trône à Saray puis devint derviche, quitta la royauté en 686 et se consacra à la compagnie des pauvres cheikhs — Qalabgha lui succédant."
