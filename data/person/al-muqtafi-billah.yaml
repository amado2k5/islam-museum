id: person/al-muqtafi-billah
class: person
label: { ar: "المقتفي لأمر الله محمد بن المستظهر", en: "al-Muqtafi li-Amr Allah Muhammad ibn al-Mustazhir", fr: "al-Muqtafi li-Amr Allah Muhammad ibn al-Mustazhir", es: "al-Muqtafi li-Amr Allah Muhammad ibn al-Mustazhir" }
summary:
  ar: "خليفة عباسي [٥٣٠–٥٥٥هـ]، أبو عبد الله محمد بن المستظهر، ولد في الثاني والعشرين من ربيع الأول سنة تسع وثمانين وأربع مئة وأمه حبشية، بويع عند خلع ابن أخيه الراشد وعمره أربعون سنة، وسبب تلقيبه أنه رأى في منامه قبل أن يستخلف بستة أيام رسول الله وهو يقول له سيصل هذا الأمر إليك فاقتف بي، وصادره السلطان مسعود ثم أعادت إليه بلاده فتمكن وزادت حرمته وعلت كلمته وكان ذلك مبدأ صلاح الدولة العباسية، وكتب المقتفي عهداً لنور الدين وولاه مصر، وقال الذهبي كان من سروات الخلفاء عالماً ديناً شجاعاً حليماً لا يجري في دولته أمر وإن صغر إلا بتوقيعه، وجدد باباً للكعبة واتخذ من العتيق تابوتاً لدفنه، ومات ليلة الأحد ثاني ربيع الأول سنة خمس وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 671-675}."
  en: "Abbasid caliph [530–555], hailed at forty when his nephew was deposed — his laqab from a dream of the Prophet bidding him 'follow my steps'. Stripped by Mas'ud, his famous answer won his estates back; with the sultans broken his word rose — 'the beginning of the Abbasid state's recovery'. Dhahabi: among the noblest caliphs, nothing ran without his rescript. He deeded Egypt to Nur al-Din, renewed the Ka'ba's door, and died Sunday 2 Rabi' I 555 {cite:tarikh-khulafa-minhaj-1434 p. 671-675}."
  fr: "Le calife abbasside [530-555], salué à quarante ans quand son neveu a été déposé - son laqab d'un rêve du Prophète lui demandant de \"suivre mes pas\". Dépouillé par Mas'ud, sa célèbre réponse a reconquis ses domaines ; avec les sultans brisé son mot rose - « le début de la reprise de l'état abbasside ». Dhahabi  : parmi les plus nobles califes, rien ne courait sans son rescrit. Il a fait l'Égypte à Nour al-Din, renouvelé la porte de la Kaaba, et est mort dimanche 2 Rabi 'I 555 {cite:tarikh-khulafa-minhaj-1434 p. 671-675}."
  es: "Califa abasí [530–555], aclamado a los cuarenta años cuando su sobrino fue depuesto; su laqab surgió de un sueño en el que el Profeta le ordenaba «seguir mis pasos». Despojado por Mas'ud, su famosa respuesta le permitió recuperar sus propiedades; con los sultanes derrotados, su palabra se alzó: «el comienzo de la recuperación del estado abasí». Dhahabi: entre los califas más nobles, nada se llevaba a cabo sin su autorización. Cedió Egipto a Nur al-Din, restauró la puerta de la Kaaba y murió el domingo 2 de Rabi' I de 555 {cite:tarikh-khulafa-minhaj-1434 p. 671-675}."
