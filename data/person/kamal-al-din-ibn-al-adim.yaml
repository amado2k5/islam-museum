id: person/kamal-al-din-ibn-al-adim
class: person
label: { ar: "كمال الدين ابن العديم" }
summary:
  ar: "الصاحب المؤرخ، قدم إلى مصر رسولاً يطلب النجدة على التتار لما نزلوا على آمد سنة سبع وخمسين فجمع قطز الأمراء والأعيان {cite:tarikh-khulafa-minhaj-1434 p. 719-720}."
  en: "The historian-envoy who came to Egypt begging aid against the Tatars in 657, prompting Qutuz's council {cite:tarikh-khulafa-minhaj-1434 p. 719-720}."
  es: "El historiador enviado que llegó a Egipto pidiendo ayuda contra los tártaros en 657, lo que provocó el consejo de Qutuz {cite:tarikh-khulafa-minhaj-1434 p. 719-720}."
  fr: "L'historien-envoyé qui est venu en Égypte implorer de l'aide contre les Tatars en 657, incitant le conseil de Qutuz {cite:tarikh-khulafa-minhaj-1434 p. 719-720}."
  ur: "مؤرخ ایلچی جو 657 میں تاتاریوں کے خلاف مدد کی بھیک مانگنے مصر آیا تھا، قطوز کی کونسل کو اشارہ کرتا تھا۔ 719-720}۔"
  tr: "Yazar, tarihçi, 57 yılında Tatarlar Amad'a yerleştiğinde yardım istemek için Mısır'a bir elçi gönderdi ve Qutuz prensleri ve ileri gelenleri topladı {atıf:Tarikh-khulafa-minhaj-1434, s. 719-720}."
  id: "Penulis, sang sejarawan, mengirim utusan ke Mesir untuk meminta bantuan melawan Tatar ketika mereka menetap di Amad pada tahun 57, dan Qutuz mengumpulkan para pangeran dan tokoh penting {cite:Tarikh-khulafa-minhaj-1434, hlm. 719-720}."
