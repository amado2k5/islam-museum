summary:
  ar: "سلطان المغرب العلوي من سنة 1672 إلى وفاته سنة 1727، وثاني ملوك الدولة العلوية وأطولهم حكماً في تاريخ المغرب بخمسة وخمسين عاماً. وُلد بسجلماسة نحو سنة 1645، وبويع بفاس بعد وفاة أخيه الرشيد، فوحّد البلاد بعد حروب طويلة ضد ابن أخيه أحمد بن محرز وغيره، واتخذ مكناس عاصمة وبنى فيها مجمعاً قصرياً ضخماً، واسترجع المعمورة والعرائش وأصيلة من الإسبان وطنجة من الإنجليز."
  en: "The 'Alawi Sultan of Morocco from 1672 until his death in 1727, second ruler of the 'Alawi dynasty, whose fifty-five years on the throne make him the longest-reigning sultan in Moroccan history. Born at Sijilmasa around 1645, he was proclaimed at Fez on his brother al-Rashid's death, unified the country after long wars against his nephew Ahmed ben Mehrez and others, made Meknes his capital and raised an enormous palace complex there, and recovered La Mamora, Larache and Asilah from Spain and Tangier from England."
  ur: "مراکش کے علوی سلطان 1672 سے 1727 میں وفات تک، علوی خاندان کے دوسرے حکمران، جن کے پچپن سالہ دور نے انہیں مراکش کی تاریخ کا سب سے طویل عہدے والا سلطان بنا دیا۔ تقریباً 1645 میں سجلماسہ میں پیدا ہوئے، بھائی الرشید کی وفات پر فاس میں سلطان قرار پائے، اپنے بھتیجے احمد بن محرز اور دیگر کے خلاف طویل جنگوں کے بعد ملک کو متحد کیا، مکناس کو دارالحکومت بنایا اور وہاں عظیم محل کمپلیکس تعمیر کرایا، اور المعمورہ، العرائش اور اصیلہ اسپین سے اور طنجہ انگلینڈ سے واپس لیا۔"
