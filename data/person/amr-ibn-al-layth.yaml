id: person/amr-ibn-al-layth
class: person
label: { ar: "عمرو بن الليث الصفار" }
summary:
  ar: "أسره إسماعيل بن أحمد في سنة سبع وثمانين ومائتين، وذكر الطبري أن المعتضد ذم عمراً في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند المسعودي وردت هداياه على المعتضد سنة ثلاث وثمانين ومائتين فيها مائة دابة من مهاري خراسان وأربعة آلاف ألف درهم وصنم من صفر على مثال امرأة لها أربع أيد عليها وشاحان من فضة مرصعان بالجوهر وبين يديه أصنام صغار على عجل تجره الجهازات، حمله من مدن افتتحها من بلاد الهند وجبالها مما يلي بسط ومعبر وبلاد الدوار وكابل وباميان، فنصب للناس بمجلس الشرطة ثلاثة أيام وسمت العامة هذا التمثال شغلاً لاشتغالهم عن أعمالهم بالنظر إليه {cite:muruj-al-dhahab p. 601-602}، وعند ابن الجوزي وفي سنة 287هـ جاءه إسماعيل بن أحمد ببلخ فانهزم وأخذ وكان يقول لو أردت أن أعمل جسراً من ذهب على نهر بلخ لفعلت وكان يحمل فرشه ومطبخه على ستمائة جمل {cite:muntazam-ibn-al-jawzi p. 309-310} وعند ابن الجوزي خرج من نيسابور فخالفه رافع بن هرثمة إليها سنة ثلاث وثمانين فهزمه وقتله، وفي محرم سنة خمس وثمانين قُرئ في دار المعتضد كتاب توليته ما وراء نهر بلخ وعزل أحمد بن إسماعيل {cite:muntazam-ibn-al-jawzi p. 162, 294}."
