id: person/amr-ibn-al-layth
class: person
label: { ar: "عمرو بن الليث الصفار" }
summary:
  ar: "أسره إسماعيل بن أحمد في سنة سبع وثمانين ومائتين، وذكر الطبري أن المعتضد ذم عمراً في ذلك {cite:tabari-tarikh-abu-al-fadl j.10 p.76} {cite:tabari-tarikh-abu-al-fadl j.10 p.77}. وعند المسعودي وردت هداياه على المعتضد سنة ثلاث وثمانين ومائتين فيها مائة دابة من مهاري خراسان وأربعة آلاف ألف درهم وصنم من صفر على مثال امرأة لها أربع أيد عليها وشاحان من فضة مرصعان بالجوهر وبين يديه أصنام صغار على عجل تجره الجهازات، حمله من مدن افتتحها من بلاد الهند وجبالها مما يلي بسط ومعبر وبلاد الدوار وكابل وباميان، فنصب للناس بمجلس الشرطة ثلاثة أيام وسمت العامة هذا التمثال شغلاً لاشتغالهم عن أعمالهم بالنظر إليه {cite:muruj-al-dhahab p. 601-602}، وعند ابن الجوزي وفي سنة 287هـ جاءه إسماعيل بن أحمد ببلخ فانهزم وأخذ وكان يقول لو أردت أن أعمل جسراً من ذهب على نهر بلخ لفعلت وكان يحمل فرشه ومطبخه على ستمائة جمل {cite:muntazam-ibn-al-jawzi p. 309-310} وعند ابن الجوزي خرج من نيسابور فخالفه رافع بن هرثمة إليها سنة ثلاث وثمانين فهزمه وقتله، وفي محرم سنة خمس وثمانين قُرئ في دار المعتضد كتاب توليته ما وراء نهر بلخ وعزل أحمد بن إسماعيل {cite:muntazam-ibn-al-jawzi p. 162, 294}."
  tr: "287 Hicri yılında İsmail ibn Ahmed tarafından esir alındı ve el-Taberi, bu {cite:tabari-tarikh-abu-al-fadl j.10 s.76} {cite:tabari-tarikh-abu-al-fadl j.10 s.77} adlı eserinde el-Mu'tadid'in bir ömür boyu eleştirildiğini belirtir. El-Mes'udi'ye göre, hediyeleri 283 Hicri yılında el-Mu'tadid'e sunulmuştur; içinde Horasan'ın ustalıklı zanaatından yüz hayvan, dört bin dirhem ve sıfırdan yapılmış bir heykel, üzerinde dört eli olan bir kadın gibi bir heykel, mücevherle süslenmiş iki gümüş hamal ve önünde aletlerle aceleyle çekilen küçük putlar vardı. Bunları Hindistan topraklarından ve dağlarından fethettiği şehirlerden, Dawar, Kabil ve Bamiyan ovaları, geçiş noktaları ve topraklarından taşıdı. Polis konseyinde halk için üç gün boyunca kurdu ve halk bu heykeli işlerinden dikkatlerini dağıtmak olarak adlandırdı. alıntı:Muruj-al-Dhahab s. 601-602} ve İbn al-Jawzi'ye göre, 287 Hicri yılında İsmail ibn Ahmed Balkh'ta ona geldi, onu yendi ve aldı. Der ki, 'Balkh Nehri üzerinde altın bir köprü yapmak isteseydim, yapardım.' Eşyalarını ve mutfağını altı yüz deveyle taşıdı. {cite:Muntazam-ibn-al-jawzi s. 309-310} İbn al-Jawzi'ye göre, Nişapur'dan ayrıldı ve Rafi' ibn Harthama seksen üçüncü yılda ona karşı çıktı, onu yendi ve öldürdü. Seksen beşinci yılın Muharrem'inde, el-Mu'tadid Hanedanı'nda Balkh Nehri'nin ötesindeki atanması ve Ahmed'in görevden alınmasıyla ilgili bir mektup okundu. İbn İsmail {atıf:Muntazam-ibn-al-jawzi s. 162, 294}."
  id: "Ia ditangkap oleh Ismail ibn Ahmad pada tahun 287 H, dan al-Tabari menyebutkan bahwa al-Mu'tadid dikritik seumur hidup dalam {cite:tabari-tarikh-abu-al-fadl j.10 hlm.76} {cite:tabari-tarikh-abu-al-fadl j.10 hlm.77}. Menurut al-Mas'udi, hadiah-hadiahnya diberikan kepada al-Mu'tadid pada tahun 283 H, berisi seratus hewan dari kerajinan terampil Khorasan, empat ribu dirham, dan sebuah arca dari nol, seperti wanita dengan empat tangan di atasnya, dua porter perak yang dihiasi permata, dan di depannya terdapat patung-patung kecil yang ditarik dengan tergesa-gesa dengan alat. Ia membawanya dari kota-kota yang ditaklukkannya dari tanah India dan pegunungannya, termasuk dataran, persimpangan, dan tanah Dawar, Kabul, dan Bamiyan. Ia mendirikan dewan polisi untuk rakyat selama tiga hari, dan masyarakat umum menamai patung ini sebagai pengalihan dari pekerjaan mereka dengan melihatnya. Sebut: Muruj-al-Dhahab hlm. 601-602}, dan menurut Ibn al-Jawzi, pada tahun 287 H, Ismail ibn Ahmad datang kepadanya di Balkh, mengalahkannya, dan membawanya. Ia biasa berkata, 'Jika aku ingin membangun jembatan emas di atas Sungai Balkh, aku akan melakukannya.' Ia membawa perabotan dan dapurnya dengan enam ratus unta. {cite:Muntazam-ibn-al-jawzi hlm. 309-310} Menurut Ibn al-Jawzi, ia meninggalkan Nishapur, dan Rafi' ibn Harthama menentangnya pada tahun delapan puluh tiga, mengalahkannya, dan membunuhnya. Pada Muharram tahun delapan puluh lima, sebuah surat dibacakan di Rumah al-Mu'tadid tentang pengangkatannya di seberang Sungai Balkh dan pemecatan Ahmad. Ibn Ismail {cite:Muntazam-ibn-al-jawzi hlm. 162, 294}."
