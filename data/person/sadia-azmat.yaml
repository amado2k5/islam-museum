summary:
  ar: "سعدية عظمت فنانة كوميدية ومؤلفة ومذيعة إنجليزية، وُلدت في لايتون بلندن. بدأت الكوميديا الارتجالية سنة 2010 بعد عملها في مراكز اتصالات، وقدّمت عروضًا في مهرجان إدنبرة فرينج، وصنعت للبي بي سي الفيلم القصير «أشياء سُئلت عنها بوصفي مسلمة بريطانية» (2015)، وقدّمت بودكاست «نو كنتري فور يونغ وومن» (2018–2020)، ونشرت مذكراتها «سيكس بومب» سنة 2022."
  en: "Sadia Azmat is an English stand-up comedian, author and broadcaster, born in Leyton, London. She began stand-up in 2010 after working in call centres, performed shows at the Edinburgh Fringe, made the BBC short Things I Have Been Asked As a British Muslim (2015), hosted the podcast No Country for Young Women (2018-2020), and published her memoir Sex Bomb in 2022."
  ur: "سعدیہ عظمت انگریز اسٹینڈ اپ مزاح نگار، مصنف اور نشریاتی پیش کار ہیں، جو لندن کے لیٹن میں پیدا ہوئیں۔ انہوں نے کال سینٹروں میں کام کے بعد 2010 میں اسٹینڈ اپ شروع کیا، ایڈنبرا فرنج میں شوز پیش کیے، بی بی سی کے لیے مختصر فلم «ایک برطانوی مسلمان کی حیثیت سے مجھ سے پوچھے گئے سوالات» (2015) بنائی، پوڈکاسٹ «نو کنٹری فار ینگ ویمن» (2018–2020) کی میزبانی کی، اور 2022 میں اپنی یادداشت «سیکس بوم» شائع کی۔"

