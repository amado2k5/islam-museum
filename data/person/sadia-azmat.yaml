summary:
  ar: "سعدية عظمت فنانة كوميدية ومؤلفة ومذيعة إنجليزية، وُلدت في لايتون بلندن. بدأت الكوميديا الارتجالية سنة 2010 بعد عملها في مراكز اتصالات، وقدّمت عروضًا في مهرجان إدنبرة فرينج، وصنعت للبي بي سي الفيلم القصير «أشياء سُئلت عنها بوصفي مسلمة بريطانية» (2015)، وقدّمت بودكاست «نو كنتري فور يونغ وومن» (2018–2020)، ونشرت مذكراتها «سيكس بومب» سنة 2022."
  en: "Sadia Azmat is an English stand-up comedian, author and broadcaster, born in Leyton, London. She began stand-up in 2010 after working in call centres, performed shows at the Edinburgh Fringe, made the BBC short Things I Have Been Asked As a British Muslim (2015), hosted the podcast No Country for Young Women (2018-2020), and published her memoir Sex Bomb in 2022."
  ur: "سعدیہ عظمت انگریز اسٹینڈ اپ مزاح نگار، مصنف اور نشریاتی پیش کار ہیں، جو لندن کے لیٹن میں پیدا ہوئیں۔ انہوں نے کال سینٹروں میں کام کے بعد 2010 میں اسٹینڈ اپ شروع کیا، ایڈنبرا فرنج میں شوز پیش کیے، بی بی سی کے لیے مختصر فلم «ایک برطانوی مسلمان کی حیثیت سے مجھ سے پوچھے گئے سوالات» (2015) بنائی، پوڈکاسٹ «نو کنٹری فار ینگ ویمن» (2018–2020) کی میزبانی کی، اور 2022 میں اپنی یادداشت «سیکس بوم» شائع کی۔"
  es: "Sadia Azmat es una comediante, autora y locutora inglesa, nacida en Leyton, Londres. Comenzó a hacer monólogos en 2010 tras trabajar en centros de atención telefónica, actuó en el Festival Fringe de Edimburgo, realizó el cortometraje de la BBC Things I Have Been Asked As a British Muslim (2015), presentó el podcast No Country for Young Women (2018-2020) y publicó sus memorias Sex Bomb en 2022."
  fr: "Sadia Azmat est une humoriste, auteure et animatrice anglaise, née à Leyton, à Londres. Elle a commencé le stand-up en 2010 après avoir travaillé dans des centres d'appels, s'est produite au Festival Fringe d'Édimbourg, a réalisé le court-métrage de la BBC Things I Have Been Asked As a British Muslim (2015), a animé le podcast No Country for Young Women (2018-2020) et a publié ses mémoires Sex Bomb en 2022."
  tr: "Saadia Azam, Londra'nın Layton kentinde doğmuş İngiliz bir komedyen, yazar ve sunucudur. 2010 yılında çağrı merkezlerinde çalıştıktan sonra, Edinburgh Fringe Festivali'nde sahne alma, BBC kısa filmi \"Things I Was Asked About as a British Muslim Woman\" (2015) yaptıktan sonra, \"No Country for Young Women\" podcast'ini (2018–2020) sunduktan ve 2022'de anı kitabı \"Sex Bomb\"u yayımladıktan sonra doğaçlama komediye başladı."
  id: "Saadia Azam adalah seorang komedian, penulis, dan presenter asal Inggris, lahir di Layton, London. Ia mulai berkarya komedi improvisasi pada tahun 2010 setelah bekerja di call center, tampil di Edinburgh Fringe Festival, membuat film pendek BBC \"Things I Was Asked About as a British Muslim Woman\" (2015), membawakan podcast \"No Country for Young Women\" (2018–2020), dan menerbitkan memoarnya \"Sex Bomb\" pada tahun 2022."

