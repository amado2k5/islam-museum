summary:
  ar: "مفسر بغداد ومفتيها ⁦(1217–1270هـ)⁩، صاحب «روح المعاني». ولد في الكرخ ببغداد في أسرة علمية، وحفظ القرآن ومتونًا كثيرة صغيرًا، ولازم علاء الدين الموصلي أربع عشرة سنة، وأخذ الطريقة النقشبندية عن ضياء الدين خالد النقشبندي؛ وكان شافعيًا ثم قلّد أبا حنيفة في المعاملات مدة إفتائه. عُزل من الإفتاء فسافر إلى إسلامبول، ومات ببغداد في ذي القعدة 1270هـ عن ثلاث وخمسين سنة."
  en: "Exegete and mufti of Baghdad (1217–1270 AH), author of Ruh al-Ma'ani. Born in al-Karkh, Baghdad, into a learned family, he memorised the Qur'an and many primers as a child, studied with Ala' al-Din al-Mawsili for fourteen years and took the Naqshbandi path from Diya' al-Din Khalid al-Naqshbandi; a Shafi'i, he followed Abu Hanifa in transactions while he held the office of mufti. Dismissed from it, he travelled to Istanbul, and died in Baghdad in Dhu al-Qa'da 1270 at fifty-three."
  ur: "بغداد کے مفسر اور مفتی ⁦(1217–1270ھ)⁩، «روح المعانی» کے مصنف۔ بغداد کے کرخ میں ایک علمی خاندان میں پیدا ہوئے، بچپن میں قرآن اور بہت سے متون حفظ کیے، علاء الدین موصلی کے ساتھ چودہ برس رہے، اور ضیاء الدین خالد نقشبندی سے طریقۂ نقشبندیہ لیا؛ شافعی تھے، پھر افتا کے دوران معاملات میں امام ابو حنیفہ کی تقلید کی۔ افتا سے معزول ہو کر استنبول گئے، اور ذی القعدہ 1270ھ میں تریپن برس کی عمر میں بغداد میں وفات پائی۔"
