summary:
  ar: "أبو العباس أحمد بن محمد بن سهل بن عطاء، العامل الظريف والكامل النظيف، مودع القرآن شماره، صحب الجنيد وتلقى عنه. روى عنه تلاميذه أقوالًا في الأدب بآداب السنة، وفي الفرق بين الأسماء الإلهية، وفي أن ذكر الثواب عن ذكر الله غفلة، وأن من ألزم نفسه آداب السنة غمر الله قلبه بنور المعرفة."
  en: "Abu al-Abbas Ahmad ibn Muhammad ibn Sahl ibn Ata, a dedicated worker and pure-hearted man, who kept the Qur'an in his breast and whose outward speech was clear; he stood among the ranks of the captives and the stations of the afflicted, and wished for what they had been given of purity and elevation, and was tried with what he wished for; his students relate his sayings: whoever binds himself to the courtesies of the Sunna, God fills his heart with the light of knowledge; remembering the reward while remembering God is heedlessness of God; worship is leaving one's own choice and remaining in need; and beware of looking at a creature when you can look at the Truth."
  ur: "ابو العباس احمد بن محمد بن سہل بن عطاء، ایک محنتی اور پاک دل شخص، جنہوں نے قرآن اپنے سینے میں محفوظ کیا؛ ان کے شاگردوں نے ان کے اقوال نقل کیے: جو سنت کے آداب اپنے اوپر لازم کر لے اللہ اس کے دل کو معرفت کے نور سے بھر دیتا ہے؛ ثواب کو یاد کرنا اللہ کو یاد کرنے سے غفلت ہے؛ عبودیت اپنے اختیار کو چھوڑنے اور محتاجی پر قائم رہنے کا نام ہے؛ اور جب حق کو دیکھ سکو تو کسی مخلوق کو دیکھنے سے بچو۔"
  es: "Abu al-Abbas Ahmad ibn Muhammad ibn Sahl ibn Ata, un trabajador dedicado y hombre de corazón puro, que guardaba el Corán en su pecho y cuyo habla exterior era clara; estuvo entre las filas de los cautivos y las posiciones de los afligidos, y deseó lo que a ellos se les había dado de pureza y elevación, y fue probado con lo que deseaba; sus estudiantes relatan sus dichos: quien se aferra a las cortesías de la Sunna, Dios llena su corazón con la luz del conocimiento; recordar la recompensa mientras se recuerda a Dios es descuido de Dios; la adoración es dejar la propia elección y permanecer en la necesidad; y cuidado de mirar a una criatura cuando se puede mirar la Verdad."
  fr: "Abou al-Abbas Ahmad ibn Muhammad ibn Sahl ibn Ata, homme dévoué et au cœur pur, qui gardait le Coran en lui et dont les paroles étaient empreintes de clarté, se tint parmi les captifs et les affligés, aspirant à la pureté et à l'élévation dont ils bénéficiaient, et fut éprouvé par ce qu'il désirait. Ses disciples rapportent ses paroles: quiconque s'attache aux préceptes de la Sunna, Dieu remplit son cœur de la lumière de la connaissance; se souvenir de la récompense tout en se souvenant de Dieu est une forme d'insouciance envers Dieu; l'adoration consiste à renoncer à son propre choix et à demeurer dans le besoin; et prenez garde de regarder une créature quand vous pouvez contempler la Vérité."
