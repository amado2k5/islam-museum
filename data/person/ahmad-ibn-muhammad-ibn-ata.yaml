summary:
  ar: "أبو العباس أحمد بن محمد بن سهل بن عطاء، العامل الظريف والكامل النظيف، مودع القرآن شماره، صحب الجنيد وتلقى عنه. روى عنه تلاميذه أقوالًا في الأدب بآداب السنة، وفي الفرق بين الأسماء الإلهية، وفي أن ذكر الثواب عن ذكر الله غفلة، وأن من ألزم نفسه آداب السنة غمر الله قلبه بنور المعرفة."
  en: "Abu al-Abbas Ahmad ibn Muhammad ibn Sahl ibn Ata, a dedicated worker and pure-hearted man, who kept the Qur'an in his breast and whose outward speech was clear; he stood among the ranks of the captives and the stations of the afflicted, and wished for what they had been given of purity and elevation, and was tried with what he wished for; his students relate his sayings: whoever binds himself to the courtesies of the Sunna, God fills his heart with the light of knowledge; remembering the reward while remembering God is heedlessness of God; worship is leaving one's own choice and remaining in need; and beware of looking at a creature when you can look at the Truth."
  ur: "ابو العباس احمد بن محمد بن سہل بن عطاء، ایک محنتی اور پاک دل شخص، جنہوں نے قرآن اپنے سینے میں محفوظ کیا؛ ان کے شاگردوں نے ان کے اقوال نقل کیے: جو سنت کے آداب اپنے اوپر لازم کر لے اللہ اس کے دل کو معرفت کے نور سے بھر دیتا ہے؛ ثواب کو یاد کرنا اللہ کو یاد کرنے سے غفلت ہے؛ عبودیت اپنے اختیار کو چھوڑنے اور محتاجی پر قائم رہنے کا نام ہے؛ اور جب حق کو دیکھ سکو تو کسی مخلوق کو دیکھنے سے بچو۔"
