id: person/thimal-ibn-salih
class: person
label:
  ar: ثمال بن صالح بن مرداس
  en: Mu'izz al-Dawla Thimal
  es: "Mu'izz al-Dawla Thimal"
  fr: "Mu'izz al-Dawla Thimal"
  ur: "معیز الدولہ تھمل"
roles:
- emir
gender: male
summary:
  ar: ثمال بن صالح بن مرداس الكلابي، أبو علوان، معز الدولة، من ملوك الدولة المرداسية بحلب، ولي الملك سنة 434هـ وملك حلب ثانية سنة 453هـ، وتوفي بها سنة 454هـ.
  en: Thimal ibn Salih ibn Mirdas al-Kilabi, Abu Alwan, Mu'izz al-Dawla, one of the Mirdasid kings of Aleppo, who took rule in 434 AH, retook Aleppo in 453 AH and died there in 454 AH.
  es: "Thimal ibn Salih ibn Mirdas al-Kilabi, Abu Alwan, Mu'izz al-Dawla, uno de los reyes mirdasíes de Alepo, que tomó el poder en el año 434 de la Hégira, reconquistó Alepo en el año 453 de la Hégira y murió allí en el año 454 de la Hégira."
  fr: "Thimal ibn Salih ibn Mirdas al-Kilabi, Abu Alwan, Mu'izz al-Dawla, l'un des rois mirdasides d'Alep, qui prit le pouvoir en 434 AH, reprit Alep en 453 AH et y mourut en 454 AH."
  ur: "تھمل بن صالح ابن میرداس الکلبی، ابو علوان، معیز الدولہ، حلب کے میرداسد بادشاہوں میں سے ایک، جنہوں نے 434 ہجری میں حکومت کی، 453 ہجری میں حلب پر دوبارہ قبضہ کیا اور 454 ہجری میں وہیں وفات پائی۔"
  tr: "Thamal ibn Salih ibn Mirdas al-Kilabi, Abu Alwan, Mu'izz al-Dawla, Halep'teki Mirdasid devletinin krallarından biriydi. 434 Hicri'de tahta çıktı, 453 Hicri'de tekrar Halep'i yönetti ve 454 Hicri'de orada öldü."
  id: "Thamal ibn Salih ibn Mirdas al-Kilabi, Abu Alwan, Mu'izz al-Dawla, adalah salah satu raja negara Mirdasid di Aleppo. Ia naik takhta pada tahun 434 H dan kembali memerintah Aleppo pada 453 H, dan meninggal di sana pada 454 H."
