summary:
  ar: "مدرّب ومحاضر مصري في الصحة النفسية وبناء الوعي، مؤسس منصة Mental Health Hub ومؤلف كتاب «استراحة نفسية». يجمع محتواه بين علم النفس الحديث والقيم الروحية الإسلامية، وتشمل أعماله دورات مسجلة وبودكاست «بهدوء» و«سكون» وسلسلة «وعي»، ويتابعه ملايين عبر منصات التواصل وقناته على يوتيوب."
  en: "Egyptian trainer and lecturer in mental health and awareness-building, founder of the Mental Health Hub platform and author of the book 'Istiraha Nafsiyya' (A Psychological Break). His content joins modern psychology to Islamic spiritual values; his work includes recorded courses, the podcasts 'Behudoo' (Calmly) and 'Sukoon', and the 'Wa'i' (Awareness) series, and millions follow him across social platforms and his YouTube channel."
  ur: "مصری مدرّب اور ذہنی صحت و آگاہی کے لیکچرر، Mental Health Hub پلیٹ فارم کے بانی اور کتاب «استراحة نفسية» کے مصنف۔ ان کا مواد جدید نفسیات کو اسلامی روحانی اقدار سے جوڑتا ہے؛ ان کے کاموں میں ریکارڈ شدہ کورسز، پوڈکاسٹ «بهدوء» و «سكون» اور سلسلہ «وعي» شامل ہیں، اور لاکھوں افراد سوشل پلیٹ فارمز اور ان کے یوٹیوب چینل پر ان کی پیروی کرتے ہیں۔"
