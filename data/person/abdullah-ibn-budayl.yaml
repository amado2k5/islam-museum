summary:
  ar: "من قادة ميمنة علي في صفين، ويذكر الصلابي أنه تولى الميمنة في اليوم الثاني من القتال بعد أن أبدله علي من الأشعث بن قيس، وأنه استشهد في الوقعة {cite:sallabi-ali-vol2 p. 106}."
  en: "A commander of Ali's right wing at Siffin; on the second day Ali put him in place of al-Ash'ath ibn Qays, and he was killed in the fighting, according to al-Sallabi."
