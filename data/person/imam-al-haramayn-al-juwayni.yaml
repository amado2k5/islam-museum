summary:
  ar: "شيخ الشافعية في عصره ورئيسها بنيسابور، إمام الحرمين أبو المعالي عبد الملك الجويني؛ وُلد ببشتنكان من أعمال نيسابور سنة ٤١٩هـ وتفقه على والده أبي محمد حتى مات وله عشرون سنة فأُقعد مكانه للتدريس، وأحكم الأصول على أبي القاسم الإسفراييني الإسكاف، فلما ظهرت فتنة اللعن على المنابر سنة ٤٤٥هـ خرج إلى بغداد وصحب الوزير الكندري مدة يناظر في حضرته، ثم نُفي فجاور بمكة والمدينة أربع سنين يدرس ويفتي فقيل له إمام الحرمين، ورجع بعد الدولة النظامية فدرس بنظامية نيسابور نحو ثلاثين سنة يقعد بين يديه نحو ثلاثمائة، وتخرج به الغزالي وغيره، وتوفي ببشتقان سنة ٤٧٨هـ {cite:tarikh-islam-dhahabi pp. 229-239} {cite:encyclopaedia-of-islam-2 vol. 2 pp. 605-606}."
  en: "The shaykh and head of the Shafi'is at Nishapur, Imam al-Haramayn Abu al-Ma'ali Abd al-Malik al-Juwayni; born at Bushtanikan outside Nishapur in 419/1028, he studied fiqh under his father Abu Muhammad and took his chair before he was twenty, mastered usul under Abu al-Qasim al-Isfara'ini al-Iskaf, was driven out in the pulpit-cursing ordeal of 445/1053 to Baghdad where he debated in the vizier al-Kunduri's presence, then was exiled and taught at Mecca and Medina for four years — whence his title — and returned under Nizam al-Mulk to teach at the Nishapur Nizamiyya for nearly thirty years before three hundred students a day, training al-Ghazali among others, and died at Bushtanqan in 478/1085 {cite:tarikh-islam-dhahabi pp. 229-239} {cite:encyclopaedia-of-islam-2 vol. 2 pp. 605-606}."
  ur: "نیشاپور میں شوافع کے شیخ اور سردار، امام الحرمین ابو المعالی عبدالملک جوینی؛ 419ھ/1028ء میں نیشاپور کے نواحی گاؤں بشتنکان میں پیدا ہوئے، والد ابو محمد سے فقہ پڑھی اور بیس سال کی عمر سے پہلے ان کی جگہ درس دینے بیٹھ گئے، ابو القاسم اسفرائینی اسکاف سے اصول میں مہارت حاصل کی، 445ھ/1053ء کی منبروں پر لعن کی فتنہ میں بغداد نکل گئے جہاں وزیر کندری کی حضوری میں مناظرے کیے، پھر جلاوطن ہو کر مکہ اور مدینہ میں چار سال درس و افتاء کیا جہاں انھیں اپنا لقب ملا، نظام الملک کے عہد میں لوٹ کر نیشاپور کی نظامیہ میں تقریباً تیس سال روزانہ تین سو طلبہ کے سامنے درس دیا، غزالی سمیت بہت سے ائمہ ان کے تلامذہ ہوئے، اور 478ھ/1085ء میں بشتقان میں فوت ہوئے {cite:tarikh-islam-dhahabi pp. 229-239} {cite:encyclopaedia-of-islam-2 vol. 2 pp. 605-606}۔"
