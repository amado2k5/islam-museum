summary:
  ar: "شيخ الشافعية في عصره؛ لما بلغ عميد الملك الكندري وزير ألب أرسلان في تعصبه على الأشعرية أن خاطب السلطان في لعن الرافضة على منابر خراسان فأذن له فأمر بلعنهم وأضاف إليهم الأشعرية، أنف من ذلك أئمة خراسان ففارقوها وأقام الجويني بمكة أربع سنين يدرس ويفتي فلهذا قيل له إمام الحرمين، فلما جاءت الدولة النظامية أحضر من انتزح منهم وأكرمهم، وكان قد خرج إلى بغداد وصحب العميد الكندري مدة يناظر في حضرته الأكابر حتى تهذب في النظر وشاع ذكره {cite:shadharat-dhahab p. 309-310}."
  en: "Shaykh of the Shafi'is — driven from Khurasan when the vizier al-Kunduri obtained Alp Arslan's licence to curse the Rafida and the Ash'aris from the minbars; his four years teaching at Mecca gave him the title Imam al-Haramayn, and Nizam al-Mulk's reign brought the exiles home in honour {cite:shadharat-dhahab p. 309-310}."
