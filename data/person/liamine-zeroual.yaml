summary:
  ar: "اليمين زروال (1941–2026)، ضابط وسياسي جزائري من مجاهدي حرب الاستقلال؛ كان وزيرا للدفاع ثم رئيسا للدولة سنة 1994 خلفا للمجلس الأعلى للدولة، وانتُخب رئيسا للجمهورية سنة 1995 فحكم حتى سنة 1999 في قلب العشرية السوداء، وتوفي في الجزائر العاصمة في 28 مارس 2026."
  en: "Liamine Zéroual (1941–2026) was an Algerian officer and politician, a veteran of the war of independence. He was minister of defence, then head of state in 1994 in succession to the High Council of State, and was elected president in 1995, ruling until 1999 in the midst of the civil war; he died in Algiers on 28 March 2026."
  ur: "الیمین زروال (1941ء–2026ء) جزائری افسر اور سیاست دان تھے، جنگ آزادی کے مجاہد؛ وہ وزیر دفاع رہے، پھر 1994ء میں مجلسِ اعلیٰ ریاست کے بعد سربراہ ریاست بنے، اور 1995ء میں صدر منتخب ہو کر 1999ء تک خانہ جنگی کے عروج میں حکمران رہے۔ وہ 28 مارچ 2026ء کو الجزائر شہر میں وفات پا گئے۔"
