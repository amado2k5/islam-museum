summary:
  ar: من الخشيميين الذين أخرجهم الهادي من نجران سنة 286هـ فأوثقهم وحبسهم في الغيل قرب صعدة.
  en: One of the Khushaymis whom al-Hadi put out of Najran in 286 AH, fettered and jailed at al-Ghayl near Sa'da.
  ur: خشیمیوں میں سے ایک جنہیں ہادی نے 286ھ میں نجران سے نکالا، بیڑیاں پہنائیں اور صعدہ کے قریب الغیل میں قید کیا۔
  es: "Uno de los Khushaymis a quienes al-Hadi expulsó de Najran en el año 286 de la Hégira, fue encadenado y encarcelado en al-Ghayl, cerca de Sa'da."
  fr: "L'un des Khushaymis qu'al-Hadi a chassés de Najran en 286 AH, enchaîné et emprisonné à al-Ghayl près de Sa'da."
  tr: "Bunlar, Al-Hadi'nin Hicri 286 yılında Necran'dan kovduğu Haşimiyin kabilesindendi; bu yüzden onları bağlayıp Sa'de yakınlarındaki Al-Ghayl'da hapsetti."
  id: "Mereka berasal dari kaum Khashimiyin, yang diusir Al-Hadi dari Najran pada tahun 286 H, lalu ia mengikat mereka dan memenjarakan mereka di Al-Ghayl dekat Sa'dah."
