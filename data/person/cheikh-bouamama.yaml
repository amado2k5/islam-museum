summary:
  ar: "قائد مقاومة جزائري (مختلف في سنة ميلاده: 1833 أو نحو 1840 – 1908)؛ من أولاد سيدي الشيخ بفجيج، أسس زاويته بمغرار التحتاني وقاد مقاومة الجنوب الوهراني والصحراء ضد الغزو الفرنسي من 1881 حتى وفاته بالعيون سيدي ملوك قرب وجدة."
  en: "Algerian resistance leader (birth year contested: 1833 or c. 1840 – 1908). Of the Awlad Sidi Shaykh of Figuig, he founded his zawiya at Moghrar Tahtani and led the resistance of the South Oranais and the Sahara to the French conquest from 1881 until his death at El Aioun Sidi Mellouk, near Oujda."
  ur: "جزائری مزاحمتی رہنما (سالِ ولادت متنازع: 1833 یا تقریباً 1840 – 1908)؛ فجیج کے اولاد سیدی شیخ سے تعلق، مغرار التحتانی میں اپنی زاویہ قائم کی اور 1881 سے وفات تک جنوبی وہران اور صحرا میں فرانسیسی قبضے کی مزاحمت کی قیادت کی؛ وفات العیون سیدی ملوک، وجدة کے قریب ہوئی۔"
