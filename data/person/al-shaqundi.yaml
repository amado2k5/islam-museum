id: person/al-shaqundi
class: person
label: { ar: "الشقندي", en: "al-Shaqundi", fr: "al-Shaqundi", es: "al-Shaqundi", ur: "الشقندی" }
summary:
  ar: "أبو الوليد إسماعيل بن محمد الشقندي الأندلسي، صاحب الرسالة المشهورة في تفضيل الأندلس على بر العدوة التي يستشهد بها المقري مراراً في نفح الطيب؛ من قوله فيها غرناطة دمشق بلاد الأندلس ومسرح الأبصار ومطمح الأنفس ولم تخلُ من أشراف أماثيل وعلماء أكابر وشعراء أفاضل، ومن محاسن إشبيلية عنده اعتدال هوائها وعذوبة مائها {cite:nafh-tib-maqqari p. 612-613, 550-551}."
  en: "Abu l-Walid al-Shaqundi, author of the famous epistle on al-Andalus's superiority over the farther shore — cited throughout Nafh al-Tib; of Granada he wrote it is 'the Damascus of al-Andalus, the theatre of eyes and ambition of souls' {cite:nafh-tib-maqqari p. 612-613}."
  fr: "Abu l-Walid al-Shaqundi, auteur de la célèbre épître sur la supériorité d'al-Andalus sur le rivage le plus éloigné - cité dans tout Nafh al-Tib ; de Grenade, il a écrit que c'est « le Damas d'al-Andalus, le théâtre des yeux et de l'ambition des âmes » {cite:nafh-tib-maqqari p. 612-613}."
  es: "Abu l-Walid al-Shaqundi, autor de la famosa epístola sobre la superioridad de al-Ándalus sobre la otra orilla —citada en todo Nafh al-Tib—, escribió sobre Granada que es «la Damasco de al-Ándalus, el teatro de los ojos y la ambición de las almas» {cite:nafh-tib-maqqari p. 612-613}."
  ur: "ابو الولید الشقندی، دور ساحل پر اندلس کی برتری پر مشہور خط کے مصنف - پورے نفح الطب میں نقل کیا گیا ہے۔ غرناطہ کے بارے میں اس نے لکھا ہے کہ 'اندلس کا دمشق، آنکھوں کا تھیٹر اور روحوں کی آرزو ہے'۔ 612-613}۔"
  tr: "Ebu el-Velid İsmail bin Muhammed el-Şakandi el-Endülüs, el-Endülüs'ün el-Adva topraklarına tercih edilmesi üzerine ünlü eserin yazarıdır; el-Maqri bu toprağı Nafh al-Tib'de defalarca alıntılamıştır; Granada, Şam, Endülüs toprağı, görüş tiyatrosu ve ruhların hırsı olarak söylediği sözlerden, elitlerin, büyük alimlerin ve seçkin şairlerin soyluluğu da yok değildi. Sevilla'nın güzellikleri arasında ılıman havası ve suyunun tazeliği vardı {atıf:nafh-tib-maqqari s. 612-613, 550-551}."
  id: "Abu al-Walid Ismail ibn Muhammad al-Shaqandi al-Andalusi, penulis risalah terkenal tentang preferensi al-Andalus dibandingkan tanah al-Adwa, yang sering dikutip al-Maqri dalam Nafh al-Tib; dari kata-katanya tentang wilayah itu sebagai Granada, Damaskus, tanah al-Andalus, teater penglihatan, dan ambisi jiwa, dan tidak tanpa kebangsawanan para elit, cendekiawan besar, dan penyair terkemuka. Di antara keindahan Sevilla adalah udara yang sedang dan kesegaran airnya {cite:nafh-tib-maqqari hlm. 612-613, 550-551}."
