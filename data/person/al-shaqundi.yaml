label: { ar: "الشقندي", en: "al-Shaqundi", fr: "al-Shaqundi", es: "al-Shaqundi" }
summary:
  ar: "أبو الوليد إسماعيل بن محمد الشقندي الأندلسي، صاحب الرسالة المشهورة في تفضيل الأندلس على بر العدوة التي يستشهد بها المقري مراراً في نفح الطيب؛ من قوله فيها غرناطة دمشق بلاد الأندلس ومسرح الأبصار ومطمح الأنفس ولم تخلُ من أشراف أماثيل وعلماء أكابر وشعراء أفاضل، ومن محاسن إشبيلية عنده اعتدال هوائها وعذوبة مائها {cite:nafh-tib-maqqari p. 612-613, 550-551}."
  en: "Abu l-Walid al-Shaqundi, author of the famous epistle on al-Andalus's superiority over the farther shore — cited throughout Nafh al-Tib; of Granada he wrote it is 'the Damascus of al-Andalus, the theatre of eyes and ambition of souls' {cite:nafh-tib-maqqari p. 612-613}."
  fr: "Abu l-Walid al-Shaqundi, auteur de la célèbre épître sur la supériorité d'al-Andalus sur le rivage le plus éloigné - cité dans tout Nafh al-Tib ; de Grenade, il a écrit que c'est « le Damas d'al-Andalus, le théâtre des yeux et de l'ambition des âmes » {cite:nafh-tib-maqqari p. 612-613}."
  es: "Abu l-Walid al-Shaqundi, autor de la famosa epístola sobre la superioridad de al-Ándalus sobre la otra orilla —citada en todo Nafh al-Tib—, escribió sobre Granada que es «la Damasco de al-Ándalus, el teatro de los ojos y la ambición de las almas» {cite:nafh-tib-maqqari p. 612-613}."
