summary:
  ar: "أبو الوليد إسماعيل بن محمد الشقندي الأندلسي، صاحب الرسالة المشهورة في تفضيل الأندلس على بر العدوة التي يستشهد بها المقري مراراً في نفح الطيب؛ من قوله فيها غرناطة دمشق بلاد الأندلس ومسرح الأبصار ومطمح الأنفس ولم تخلُ من أشراف أماثيل وعلماء أكابر وشعراء أفاضل، ومن محاسن إشبيلية عنده اعتدال هوائها وعذوبة مائها {cite:nafh-tib-maqqari p. 612-613, 550-551}."
  en: "Abu l-Walid al-Shaqundi, author of the famous epistle on al-Andalus's superiority over the farther shore — cited throughout Nafh al-Tib; of Granada he wrote it is 'the Damascus of al-Andalus, the theatre of eyes and ambition of souls' {cite:nafh-tib-maqqari p. 612-613}."
