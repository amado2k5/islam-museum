summary:
  ar: "القاضي ناصر الدين أبو البقاء ابن زريق الصالحي الحنبلي الإمام العالم المحدث؛ ولد بصالحية دمشق في شوال سنة اثنتي عشرة وثمانمائة وهو من ذرية شيخ الإسلام أبي عمر وقرأ على علماء عصره وبرع ومهر وأفاد وعلم وروى عنه خلق من الأعيان وكان منور الشيبة شكلاً حسناً على طريقة السلف الصالح وولي النظر على مدرسة جده أبي عمر مدة طويلة وناب في الحكم ثم تنزه عن ذلك، توفي بالصالحية عشية يوم السبت تاسع جمادى الآخرة سنة تسع وتسعين وثمانمائة {cite:shadharat-dhahab p. 365-366}."
  en: "Ibn Zurayq (b. Salihiyya Shawwal 812) — of the Abu 'Umar line, 'the grey-haired handsome one on the salaf's way', long nazir of his grandfather's madrasa then withdrew from office; died eve of Saturday 9 Jumada II 899 {cite:shadharat-dhahab p. 365-366}."
