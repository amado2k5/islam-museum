summary:
  ar: "القاضي ناصر الدين أبو البقاء ابن زريق الصالحي الحنبلي الإمام العالم المحدث؛ ولد بصالحية دمشق في شوال سنة اثنتي عشرة وثمانمائة وهو من ذرية شيخ الإسلام أبي عمر وقرأ على علماء عصره وبرع ومهر وأفاد وعلم وروى عنه خلق من الأعيان وكان منور الشيبة شكلاً حسناً على طريقة السلف الصالح وولي النظر على مدرسة جده أبي عمر مدة طويلة وناب في الحكم ثم تنزه عن ذلك، توفي بالصالحية عشية يوم السبت تاسع جمادى الآخرة سنة تسع وتسعين وثمانمائة {cite:shadharat-dhahab p. 365-366}."
  en: "Ibn Zurayq (b. Salihiyya Shawwal 812) — of the Abu 'Umar line, 'the grey-haired handsome one on the salaf's way', long nazir of his grandfather's madrasa then withdrew from office; died eve of Saturday 9 Jumada II 899 {cite:shadharat-dhahab p. 365-366}."
  es: "Ibn Zurayq (n. Salihiyya Shawwal 812) — de la línea de Abu 'Umar, 'el apuesto de cabellos grises en el camino de los salaf', fue nazir durante mucho tiempo de la madrasa de su abuelo y luego se retiró del cargo; murió la víspera del sábado 9 de Jumada II 899 {cita: shadharat-dhahab pág. 365-366}."
  fr: "Ibn Zurayq (né en Salihiyya Shawwal 812) — de la lignée d'Abu 'Umar, « le bel homme aux cheveux gris sur la voie des salaf », longtemps nazir de la madrasa de son grand-père, puis se retira de ses fonctions; mourut la veille du samedi 9 Jumada II 899 {cite: shadharat-dhahab p. 365-366}."
  ur: "ابن زریق ⁦(پیدائش صالحیہ شوال 812)⁩ - ابو عمر کے سلسلے میں سے، 'سلف کے راستے پر سفید بالوں والا خوبصورت'، اپنے دادا کے مدرسے کے لمبے نذیر پھر عہدے سے دستبردار ہو گئے؛ وصال بروز ہفتہ 9 جمادی الثانی 899۔ 365-366}۔"
  tr: "Hakim Nasir al-Din Ebu el-Baka bin Zurayq el-Salihi el-Hanbali bir imam, alim ve hadis âlimiydi; 800 Hicri yılında Şam'ın Şem bölgesindeki Salihiye'de doğdu. Şeyh el-İslam Ebu Ömer'in soyundan gelmiş, zamanının alimlerinden eğitim almış, başarılı olmuş, başarılı olmuş, fayda sağlamış, öğretmiş ve ondan rivayet etmiştir. Doğru seleflerin tarzını takip eden, yakışıklı görünümlü parlak bir ihtiyardı. Uzun süre büyükbabası Ebu Ömer'in okulunu yönetti, yönetimi vekil etti ve sonra ondan uzaklaştı. 899 Hicri yılının 9 Cumartesi akşamı Salihiye'de vefat etti. {atıf:Shadharat-Dhahab, s. 365-366}."
  id: "Hakim Nasir al-Din Abu al-Baqa ibn Zurayq al-Salihi al-Hanbali adalah seorang imam, ulama, dan ulama hadis; ia lahir di Salihiyah, Damaskus, di Shawwal pada tahun 800 H. Ia adalah keturunan Sheikh al-Islam Abu Umar, belajar di bawah para ulama pada zamannya, unggul, unggul, mendapat manfaat, mengajar, dan menceritakan darinya. Ia adalah seorang tetua yang bersinar dengan penampilan tampan mengikuti gaya para pendahulu yang benar. Ia mengawasi sekolah kakeknya Abu Umar untuk waktu yang lama, menunjuk pemerintahan sebagai wakil dan kemudian menjauhkan diri dari sana. Ia meninggal di Salihiyah pada malam Sabtu, 9 Jumada al-Akhirah, 899 H. {cite:shadharat-dhahab, hlm. 365-366}."
