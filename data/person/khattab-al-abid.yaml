summary:
  ar: "خطاب العابد، شارد عن الخطايا، طارد للراحات. قال: إن العبد ليذنب الذنب فيما بينه وبين الله، فيلقى إخوانه فيرون أثر ذلك عليه."
  en: "Khattab al-Abid, who turned away from sins and pursued the ease of the next life; he said: a servant may commit a sin between himself and God, and then his brothers meet him and see its trace upon him."
  ur: "خطاب عابد گناہوں سے دور رہنے والے اور آخرت کی راحت کے طلب گار تھے۔ انہوں نے کہا: بندہ اپنے اور اللہ کے درمیان گناہ کرتا ہے، پھر جب اپنے بھائیوں سے ملتا ہے تو وہ اس کا اثر اس پر دیکھ لیتے ہیں۔"
  es: "Khattab al-Abid, quien se apartó de los pecados y buscó la comodidad de la otra vida, dijo: un siervo puede cometer un pecado entre él y Dios, y entonces sus hermanos se encuentran con él y ven la huella de ese pecado en él."
  fr: "Khattab al-Abid, qui s'est détourné des péchés et a recherché la facilité de la vie après la mort, a dit: un serviteur peut commettre un péché entre lui et Dieu, et ensuite ses frères le rencontrent et en voient la trace sur lui."
  tr: "Günahlardan sapan ibadet edenin söylemi, dünyanın geri kalanını kovar. Dedi ki: Hizmetkâr, kendisiyle Allah arasında olan şeyde günah işler, kardeşleriyle karşılaşır ve bunun kendisi üzerindeki etkisini görür."
  id: "Omongan penyembah, seseorang yang teralihkan dari dosa, mengusir seluruh dunia. Dia berkata: Hamba berdosa, dalam apa yang ada di antara dirinya dan Allah, dan dia bertemu saudara-saudaranya dan melihat dampaknya padanya."
