summary:
  ar: "قباث بن أشيم الليثي، من بني ليث؛ يروي الحاكم أن عبد الملك بن مروان سأله: أنت أكبر أم رسول الله؟ فقال: رسول الله أكبر مني وأنا أسنّ منه، ويروي قصة إسلامه حين أخبره النبي بخاطر حدّث به نفسه ولم ينطق به، وحديثه في فضل صلاة الجماعة {cite:mustadrak-ilmiyya-ata-v3 p. 724-725}."
  en: "Qubath ibn Ashyam al-Laythi, of Banu Layth. Al-Hakim reports that 'Abd al-Malik ibn Marwan asked him, 'Are you greater or the Messenger of God?' and he answered, 'The Messenger of God is greater than I, and I am older than he'; he also gives the story of his conversion, when the Prophet told him of a thought he had never spoken aloud, and his hadith on the merit of praying in congregation {cite:mustadrak-ilmiyya-ata-v3 p. 724-725}."
  ur: "قباث بن اشیم لیثی، بنو لیث سے۔ حاکم روایت کرتے ہیں کہ عبد الملک بن مروان نے ان سے پوچھا: 'تم بڑے ہو یا رسول اللہ؟' تو انہوں نے کہا: 'رسول اللہ مجھ سے بڑے ہیں اور میں عمر میں ان سے زیادہ ہوں'؛ وہ ان کے اسلام کا قصہ بھی لاتے ہیں جب نبی نے انہیں ان کے ایک ایسے خیال کی خبر دی جو انہوں نے کبھی زبان پر نہیں لایا تھا، اور باجماعت نماز کی فضیلت میں ان کی حدیث {cite:mustadrak-ilmiyya-ata-v3 p. 724-725}۔"
