summary:
  ar: "روائية وأكاديمية كويتية نشأت في الكويت لأم أمريكية وأب كويتي، حصلت على الماجستير في الكتابة الإبداعية من جامعة إدنبرة، ثم نالت الدكتوراه في رواية المرأة العربية ونظرية الصدمة الأدبية، وتعمل أستاذة مساعدة للأدب الإنجليزي في الجامعة الأمريكية في الكويت. روايتها الأولى «The Pact We Made» (2019) تدور في الكويت المعاصرة، وروايتها الثانية «Silence Is a Sense» (2021) تتبع لاجئة سورية في بريطانيا. كتبت في «الغارديان» و«ليت هب» وملحق التايمز الأدبي."
  en: "Kuwaiti novelist and academic. She grew up in Kuwait, with an American mother and a Kuwaiti father, took a master's in creative writing at the University of Edinburgh, and earned a doctorate on Arab women's fiction and literary trauma theory; she is an assistant professor of English literature at the American University of Kuwait. Her debut novel, The Pact We Made (2019), is set in contemporary Kuwait; her second, Silence Is a Sense (2021), follows a Syrian refugee in Britain. She has written for The Guardian, LitHub and the Times Literary Supplement."
  ur: "کویتی ناول نگار اور استاد؛ کویت میں پرورش پائی، والدہ امریکی اور والد کویتی ہیں۔ انہوں نے ایڈنبرا یونیورسٹی سے تخلیقی تحریر میں ماسٹرز اور عرب خواتین کے فکشن اور ادبی صدمے کے نظریے پر ڈاکٹریٹ کی، اور اب امریکن یونیورسٹی آف کویت میں انگریزی ادب کی اسسٹنٹ پروفیسر ہیں۔ ان کے ناول «The Pact We Made» (2019) اور «Silence Is a Sense» (2021) ہیں۔"
