label: { ar: "ميسرة بن مسروق العبسي", en: "Maysara ibn Masruq al-Absi", es: "Maysara ibn Masruq al-Absi", fr: "Maysara ibn Masruq al-Absi" }
summary:
  ar: "ميسرة بن مسروق العبسي، من أمراء سرايا أبي عبيدة؛ عند البلاذري: قال بعضهم إنه أول من قطع الدرب — درب بغراس — وجّهه أبو عبيدة فلقي جمعاً للروم معهم مستعربة من غسان وتنوخ وإياد يريدون اللحاق بهرقل فأوقع بهم وقتل منهم مقتلة عظيمة، وقيل إنما بلغ زندة؛ ويخالفه من يجعل أول القاطعين عمير بن سعد في أمر جبلة أو أبا عبيدة نفسه."
  en: "Maysara ibn Masruq al-Absi, raiding commander of Abu Ubayda; in al-Baladhuri: some hold he was the first to cut the Darb — the Baghras pass — sent by Abu Ubayda, meeting a Byzantine gathering with musta'riba of Ghassan, Tanukh and Iyad bound for Heraclius, whom he shattered with a great slaughter, or by another report reaching Zanda; against those who make the first crosser Umayr ibn Sa'd on Jabala's affair or Abu Ubayda himself."
  es: "Maysara ibn Masruq al-Absi, comandante de incursiones de Abu Ubayda; en al-Baladhuri: algunos sostienen que fue el primero en cortar el Darb —el paso de Baghras— enviado por Abu Ubayda, encontrándose con una reunión bizantina con musta'riba de Ghassan, Tanukh e Iyad que se dirigían a Heraclio, a quien destrozó con una gran matanza, o según otro informe que llegó a Zanda; en contra de aquellos que hacen que el primer en cruzar fuera Umayr ibn Sa'd en el asunto de Jabala o el propio Abu Ubayda."
  fr: "Maysara ibn Masruq al-Absi, commandant des raids d'Abu Ubayda; selon al-Baladhuri: certains affirment qu'il fut le premier à couper le Darb — le col de Baghras — envoyé par Abu Ubayda, rencontrant un rassemblement byzantin avec les musta'riba de Ghassan, Tanukh et Iyad en route pour Héraclius, qu'il anéantit par un grand massacre, ou selon un autre rapport parvenu à Zanda; contre ceux qui font d'Umayr ibn Sa'd le premier à traverser, dans l'affaire de Jabala ou d'Abu Ubayda lui-même."
