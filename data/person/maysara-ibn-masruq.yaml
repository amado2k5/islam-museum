label: { ar: "ميسرة بن مسروق العبسي", en: "Maysara ibn Masruq al-Absi" }
summary:
  ar: "ميسرة بن مسروق العبسي، من أمراء سرايا أبي عبيدة؛ عند البلاذري: قال بعضهم إنه أول من قطع الدرب — درب بغراس — وجّهه أبو عبيدة فلقي جمعاً للروم معهم مستعربة من غسان وتنوخ وإياد يريدون اللحاق بهرقل فأوقع بهم وقتل منهم مقتلة عظيمة، وقيل إنما بلغ زندة؛ ويخالفه من يجعل أول القاطعين عمير بن سعد في أمر جبلة أو أبا عبيدة نفسه."
  en: "Maysara ibn Masruq al-Absi, raiding commander of Abu Ubayda; in al-Baladhuri: some hold he was the first to cut the Darb — the Baghras pass — sent by Abu Ubayda, meeting a Byzantine gathering with musta'riba of Ghassan, Tanukh and Iyad bound for Heraclius, whom he shattered with a great slaughter, or by another report reaching Zanda; against those who make the first crosser Umayr ibn Sa'd on Jabala's affair or Abu Ubayda himself."
