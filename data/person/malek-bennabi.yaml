summary:
  ar: "مفكر وفيلسوف حضاري جزائري ⁦(1905–1973)⁩، من أبرز منظّري النهضة الإسلامية الحديثة. عاش في المنفى بفرنسا ومصر وكُتبت فيهما أغلب كتبه، ومن مؤلفاته «شروط النهضة» و«مشكلة الأفكار في العالم الإسلامي» و«ظاهرة القرآن» و«وجهة العالم الإسلامي»، وصكّ مفهوم «القابلية للاستعمار»."
  en: "Algerian civilizational philosopher (1905–1973), among the foremost theorists of modern Islamic renaissance. Exiled in France and Egypt where most of his books were written, his works include The Conditions of Renaissance, The Problem of Ideas in the Muslim World, The Qur'anic Phenomenon and Vocation of Islam; he coined the concept of 'colonizability'."
  ur: "الجزائری تہذیبی فلسفی ⁦(1905–1973)⁩ جو جدید اسلامی نشاۃِ ثانیہ کے ممتاز نظریہ سازوں میں شمار ہوتے ہیں۔ فرانس اور مصر میں جلاوطن رہے جہاں ان کی بیشتر کتابیں لکھی گئیں؛ ان کی تصانیف میں «شروط النھضہ»، «مشکلۃ الافکار فی العالم الاسلامي»، «ظاھرۃ القرآن» اور «وجہۃ العالم الاسلامي» شامل ہیں، اور انہوں نے «قابلیتِ استعمار» کا تصور دیا۔"
  es: "Filósofo argelino de la civilización (1905-1973), uno de los teóricos más destacados del renacimiento islámico moderno. Exiliado en Francia y Egipto, donde escribió la mayor parte de sus libros, entre sus obras destacan Las condiciones del Renacimiento, El problema de las ideas en el mundo musulmán, El fenómeno coránico y La vocación del Islam; acuñó el concepto de «colonizabilidad»."
  fr: "Philosophe civilisationnel algérien (1905-1973), l'un des plus importants théoriciens de la renaissance islamique moderne. Exilé en France et en Égypte où il a écrit la plupart de ses ouvrages, il est notamment l'auteur des <i>Conditions de la renaissance</i>, du <i>Problème des idées dans le monde musulman</i>, du <i>Phénomène coranique</i> et de <i>Vocation de l'islam</i>; il a forgé le concept de « colonisabilité »."
