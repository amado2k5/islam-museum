summary:
  ar: "أبو صالح منصور بن نوح بن نصر بن إسماعيل بن أحمد بن أسد بن سامان، أحد الملوك السامانية؛ صنف له أبو بكر الرازي كتابه في الطب المعروف بالمنصوري في حال صغره ليشتغل به، وحكى ابن جلجل أن الرازي صنف له كتاباً في إثبات صناعة الكيمياء فوهبه ألف دينار ثم عجز عن إخراج ما وعد إلى الفعل؛ وكانت وفاته في شوال سنة خمس وستين وثلاثمائة {cite:wafayat-ayan}."
  en: "Mansur b. Nuh (d. 365) — Samanid amir to whom al-Razi dedicated his medical compendium al-Mansuri; the alchemy-book story with al-Razi; the Samanid house ruled 136 years {cite:wafayat-ayan}."
