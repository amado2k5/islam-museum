summary:
  ar: "أبو صالح منصور بن نوح بن نصر بن إسماعيل بن أحمد بن أسد بن سامان، أحد الملوك السامانية؛ صنف له أبو بكر الرازي كتابه في الطب المعروف بالمنصوري في حال صغره ليشتغل به، وحكى ابن جلجل أن الرازي صنف له كتاباً في إثبات صناعة الكيمياء فوهبه ألف دينار ثم عجز عن إخراج ما وعد إلى الفعل؛ وكانت وفاته في شوال سنة خمس وستين وثلاثمائة {cite:wafayat-ayan}."
  en: "Mansur b. Nuh (d. 365) — Samanid amir to whom al-Razi dedicated his medical compendium al-Mansuri; the alchemy-book story with al-Razi; the Samanid house ruled 136 years {cite:wafayat-ayan}."
  es: "Mansur b. Nuh (m. 365) — Emir samaní a quien al-Razi dedicó su compendio médico al-Mansuri; la historia del libro de alquimia con al-Razi; la casa samaní gobernó 136 años {cite:wafayat-ayan}."
  fr: "Mansur b. Nuh (d. 365) — Émir samanide à qui al-Razi a dédié son recueil médical al-Mansuri; l'histoire du livre d'alchimie avec al-Razi; la maison samanide a régné 136 ans {cite:wafayat-ayan}."
  ur: "منصور بی نوح ⁦(متوفی 365)⁩ - سامانی امیر جن کے نام الرازی نے اپنا طبی مجموعہ المنصوری وقف کیا تھا۔ الرازی کے ساتھ کیمیا کتاب کی کہانی؛ سامانی گھرانے نے 136 سال حکومت کی۔"
