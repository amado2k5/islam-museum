summary:
  ar: "محمد بن علي الأردبيلي الغروي الحائري، عالم بالتراجم إمامي من أهل أردبيل، أقام في أصفهان وأخذ عن المجلسي، وله «جامع الرواة» كتبه سنة 1100 هـ."
  en: "Muhammad ibn Ali al-Ardabili al-Gharawi al-Ha'iri, an Imami scholar of biographical literature from Ardabil who stayed in Isfahan and studied with al-Majlisi; author of Jami' al-Ruwat, written in 1100 AH."
  es: "Muhammad ibn Ali al-Ardabili al-Gharawi al-Ha'iri, un erudito imami de literatura biográfica de Ardabil que permaneció en Isfahán y estudió con al-Majlisi; autor de Jami' al-Ruwat, escrito en 1100 AH."
  fr: "Muhammad ibn Ali al-Ardabili al-Gharawi al-Ha'iri, un érudit Imami en littérature biographique d'Ardabil qui est resté à Ispahan et a étudié avec al-Majlisi; auteur de Jami' al-Ruwat, écrit en 1100 AH."
  ur: "محمد بن علی الاردبیلی الغراوی الحیری، اردبیل کے سوانحی ادب کے امامی عالم جنہوں نے اصفہان میں قیام کیا اور مجلسی سے تعلیم حاصل کی۔ 1100 ہجری میں لکھی گئی جامع الروات کے مصنف۔"
  tr: "Muhammed bin Ali el-Erdebili el-Gharawi el-Ha'iri, Erdebil'den bir İmam biyografi yazarıydı. İsfahan'da yaşadı ve el-Majlisi'nin yanında eğitim aldı. 1100 H yılında yazdığı 'Jami' al-Ruwat' adlı kitabı yazdı."
  id: "Muhammad ibn Ali al-Ardabili al-Gharawi al-Ha'iri adalah seorang biografer Imami dari Ardabil. Ia tinggal di Isfahan dan belajar di bawah bimbingan al-Majlisi. Ia menulis 'Jami' al-Ruwat,' yang ditulis pada tahun 1100 H."
