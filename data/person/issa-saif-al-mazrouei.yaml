  ar: "عيسى سيف محمد المزروعي فريق ركن مهندس إماراتي يشغل رئاسة أركان القوات المسلحة الإماراتية منذ كانون الثاني 2023، عُيّن بمرسوم اتحادي بمرتبة وزير خلفًا لحمد محمد ثاني الرميثي. لا توجد عنه مقالة ويكيبيديا بأي لغة؛ يستند هذا السجل إلى عنصر ويكي بيانات له وإلى تقرير التعيين الرسمي."
