summary:
  ar: "أبو زيد عبد الحميد بن الوليد بن المغيرة المصري، المعروف بكبد، من أصحاب الشافعي المصريين، قديم الوفاة، ذكره الدارقطني فيمن روى عن الشافعي {cite:tabaqat-fuqaha-abbas-1981 p. 54}. قال ابن يونس: سُمي كبداً لأنه كان ثقيلاً (حاشية المحقق، PDF ص54)."
  en: "Abu Zayd Abd al-Hamid ibn al-Walid ibn al-Mughira al-Misri, known as Kabd, one of al-Shafi'i's Egyptian companions, who died in an earlier period; al-Daraqutni mentioned him among those who transmitted from al-Shafi'i {cite:tabaqat-fuqaha-abbas-1981 p. 54}. Ibn Yunus said he was called Kabd because he was heavy (editor's note, PDF p. 54)."
