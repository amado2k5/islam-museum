summary:
  ar: "عماد الدين زنكي بن قطب الدين مودود بن زنكي، صاحب سنجار ثم حلب؛ زوج أخت الملك الصالح إسماعيل بن نور الدين، وتولى نور الدين تربيته وكان يحبه ويؤثره؛ لما مات ابن أخيه الملك الصالح سنة سبع وسبعين أوصى بحلب لعز الدين مسعود صاحب الموصل دونه، فلجّ يطلبها بمبادلة سنجار مهدداً بتسليم سنجار إلى صلاح الدين حتى تسلم حلب وأخذ أخوه سنجار عنه {cite:kamil-ibn-al-athir p. 106-108}."
