label: { ar: "هشام بن الكلبي", en: "Hisham ibn al-Kalbi" }
summary:
  ar: "هشام بن محمد بن السائب الكلبي النسابة، مات سنة أربع ومائتين وهي سنة وفاة الشافعي {cite:muruj-al-dhahab p. 418}. وروى ابن النديم عنه أن أول من وضع الخط العربي قوم من العرب العاربة نزلوا في عدنان بن أدد وهم أبو جاد وهواز وحطي وكلمون وصعفض وقرشات ملوك مدين أهلكة يوم الظلة فوضعوا الكتابة على أسمائهم {cite:fihrist-ibn-al-nadim p. 9-10}. وفي تاريخ بغداد (ترجمة 7386): كوفي قدم بغداد وحدّث بها عن أبيه، وروى عنه ابنه العباس وخليفة بن خياط وشبابة المسفري ومحمد بن سعد كاتب الواقدي ومحمد بن أبي السري وأبو الأشعث أحمد بن المقدام؛ وقال عن نفسه حفظت ما لم يحفظه أحد ونسيت ما لم ينسه أحد، وحكى أنه حفظ القرآن في ثلاثة أيام؛ وقال أحمد بن حنبل هشام بن الكلبي من يحدث عنه إنما هو صاحب نسب وشعر، ومات سنة أربع ومائتين وقيل سنة ست ومائتين {cite:tarikh-baghdad-khatib j.11 p.45-47}"
  en: "The genealogist Ibn al-Kalbi — dead in 204, the year of al-Shafi'i's death {cite:muruj-al-dhahab p. 418}. Tarikh Baghdad (#7386): a Kufan who came to Baghdad and transmitted from his father; his pupils include his son al-'Abbas, Khalifa b. Khayyat, Shabba al-Misfari, Muhammad b. Sa'd (al-Waqidi's katib), Muhammad b. Abi'l-Sari and Abu'l-Ash'ath Ahmad b. al-Miqdam; his own boast — 'I memorised what no one memorised and forgot what no one forgot' — and that he learnt the Qur'an in three days; Ahmad b. Hanbal dismissed him as 'a man of genealogy and verse, no one transmits his hadith'; died 204, another report 206 {cite:tarikh-baghdad-khatib j.11 p.45-47}."
