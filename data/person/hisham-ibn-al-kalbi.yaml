summary:
  ar: "هشام بن محمد بن السائب الكلبي النسابة، مات سنة أربع ومائتين وهي سنة وفاة الشافعي {cite:muruj-al-dhahab p. 418}. وروى ابن النديم عنه أن أول من وضع الخط العربي قوم من العرب العاربة نزلوا في عدنان بن أدد وهم أبو جاد وهواز وحطي وكلمون وصعفض وقرشات ملوك مدين أهلكة يوم الظلة فوضعوا الكتابة على أسمائهم {cite:fihrist-ibn-al-nadim p. 9-10}. وفي تاريخ بغداد ⁦(ترجمة 7386)⁩: كوفي قدم بغداد وحدّث بها عن أبيه، وروى عنه ابنه العباس وخليفة بن خياط وشبابة المسفري ومحمد بن سعد كاتب الواقدي ومحمد بن أبي السري وأبو الأشعث أحمد بن المقدام؛ وقال عن نفسه حفظت ما لم يحفظه أحد ونسيت ما لم ينسه أحد، وحكى أنه حفظ القرآن في ثلاثة أيام؛ وقال أحمد بن حنبل هشام بن الكلبي من يحدث عنه إنما هو صاحب نسب وشعر، ومات سنة أربع ومائتين وقيل سنة ست ومائتين {cite:tarikh-baghdad-khatib j.11 p.45-47}"
  en: "The genealogist Ibn al-Kalbi — dead in 204, the year of al-Shafi'i's death {cite:muruj-al-dhahab p. 418}. Tarikh Baghdad (#7386): a Kufan who came to Baghdad and transmitted from his father; his pupils include his son al-'Abbas, Khalifa b. Khayyat, Shabba al-Misfari, Muhammad b. Sa'd (al-Waqidi's katib), Muhammad b. Abi'l-Sari and Abu'l-Ash'ath Ahmad b. al-Miqdam; his own boast — 'I memorised what no one memorised and forgot what no one forgot' — and that he learnt the Qur'an in three days; Ahmad b. Hanbal dismissed him as 'a man of genealogy and verse, no one transmits his hadith'; died 204, another report 206 {cite:tarikh-baghdad-khatib j.11 p.45-47}."
  es: "El genealogista Ibn al-Kalbi — muerto en 204, el año de la muerte de al-Shafi'i {cite:muruj-al-dhahab p. 418}. Tarikh Baghdad (#7386): un kufano que llegó a Bagdad y transmitió de su padre; entre sus discípulos se encuentran su hijo al-'Abbas, Khalifa b. Khayyat, Shabba al-Misfari, Muhammad b. Sa'd (katib de al-Waqidi), Muhammad b. Abi'l-Sari y Abu'l-Ash'ath Ahmad b. al-Miqdam; su propio alarde — 'memoricé lo que nadie memorizó y olvidé lo que nadie olvidó' — y que aprendió el Corán en tres días; Ahmad b. Hanbal lo desestimó como 'un hombre de genealogía y verso, nadie transmite su hadiz'; murió en 204, otro informe en 206 {cite:tarikh-baghdad-khatib j.11 p.45-47}."
  fr: "Le généalogiste Ibn al-Kalbi – décédé en 204, l'année de la mort d'al-Shafi'i {cite:muruj-al-dhahab p. 418}. Tarikh Baghdad (#7386): un Koufan venu à Bagdad et transmettant l'enseignement de son père; parmi ses élèves figurent son fils al-'Abbas, Khalifa b. Khayyat, Shabba al-Misfari, Muhammad b. Sa'd (katib d'al-Waqidi), Muhammad b. Abi'l-Sari et Abu'l-Ash'ath Ahmad b. al-Miqdam; il se vantait: « J'ai mémorisé ce que personne n'a mémorisé et oublié ce que personne n'a oublié » – et d'avoir appris le Coran en trois jours; Ahmad b. Hanbal le qualifiait d'« homme de généalogie et de vers, dont personne ne transmet les hadiths ». mort 204, autre rapport 206 {cite:tarikh-baghdad-khatib j.11 p.45-47}."
  ur: "ماہر نسب ابن الکلبی - کا انتقال 204 میں ہوا، الشافعی کی وفات کا سال۔ 418}۔ تاریخ بغداد (#7386): ایک کوفان جو بغداد آیا اور اپنے والد سے منتقل ہوا۔ ان کے شاگردوں میں ان کا بیٹا العباس، خلیفہ بن۔ خیاط، شبہ المسفاری، محمد بن۔ سعد ⁦(الواقدی کاتب)⁩، محمد بن۔ ابی الساری اور ابوالاشعث احمد بن۔ المقدم؛ اس کا اپنا فخر - 'میں نے وہ حفظ کیا جو کسی نے یاد نہیں کیا اور وہ بھول گیا جو کوئی نہیں بھولا' - اور یہ کہ اس نے تین دن میں قرآن سیکھا۔ احمد بی۔ حنبل نے اسے 'نسب اور آیت کا آدمی، کوئی اس کی حدیث نقل نہیں کرتا' کہہ کر مسترد کر دیا۔ وفات 204، دوسری رپورٹ 206 {حوالہ:تاریخ بغداد خطیب ج.11 ص.45-47}۔"
  tr: "Soybilimci Hisham ibn Muhammed bin el-Saib el-Kalbi, 204 yılında öldü; bu yıl el-Şafii'nin ölüm yılıdır {atıf:muruj-al-dhahab, s. 418}. İbn el-Nadim, Arap alfabesini ilk kuranların, Adnan ibn Addad'ın yönetiminde yerleşen Arap kabilesinden bir grup Arap olduğunu anlatmıştır: Ebu Jad, Hawaz, Hawaz, Hawaz, Kalmun, Sa'fad ve Qarşat, Gölge Günü'nde ölen ve isimlerine yazı koymuşlardır {atıf:fihrist-ibn-al-nadim s. 9-10}. Ve Tarih Bağdat'ta (biyografi 7386): Bir Kufi Bağdat'a geldi ve oradaki babasından rivayet etti. Oğlu El-Abbas, Halife ibn Hayyat, Şababa el-Musafari, el-Vaqidi'nin kâtipi Muhammed bin Ebi el-Sari ve Ebu el-Eşat Ahmed bin Mikdam ondan rivayet etti; kendisi hakkında şöyle dedi: Kimsenin ezberlemediğini ve kimsenin unutmadığını ezberledim. Ayrıca Kur'an'ı üç günde ezberlediğini anlattı; Ahmed bin Hanbal Hişam ibn el-Kalbi, kendisinden rivayet edenlerin sadece soy ve şiir sahibi bir adam olduğunu, 204 yılında öldüğünü ve 206 yılında söylendiğini söyledi {atıf:Tarikh-baghdad-khatib J.11 s.45-47}"
  id: "Hisham ibn Muhammad ibn al-Sa'ib al-Kalbi, seorang ahli silsilah, meninggal pada tahun 204, yaitu tahun kematian al-Shafi'i {cite:muruj-al-dhahab, hlm. 418}. Ibn al-Nadim menceritakan darinya bahwa yang pertama mendirikan aksara Arab adalah sekelompok Arab dari suku Arab yang menetap di bawah Adnan ibn Addad: Abu Jad, Hawaz, Hawaz, Kalmun, Sa'fad, dan Qarshath, raja-raja Midian, yang gugur pada Hari Bayangan dan menandai tulisan tersebut pada nama mereka {cite:fihrist-ibn-al-nadim hlm. 9-10}. Dan dalam Tarikh Baghdad (biografi 7386): Seorang Kufi datang ke Baghdad dan menceritakan dari ayahnya di sana. Putranya Al-Abbas, Khalifa ibn Khayyat, Shababa al-Musafari, Muhammad ibn Sa'd, juru tulis al-Waqidi, Muhammad ibn Abi al-Sari, dan Abu al-Ash'ath Ahmad ibn al-Miqdam menceritakan darinya; ia berkata tentang dirinya: Aku menghafal apa yang tidak dihafal dan tidak ada yang lupa. Ia juga menceritakan bahwa ia menghafal Al-Qur'an dalam tiga hari; Ahmad ibn Hanbal Hisham ibn al-Kalbi berkata siapa pun yang menceritakan darinya hanyalah orang keturunan dan puisi, dan ia wafat pada tahun 204, dan dikatakan 206 {cite:Tarikh-baghdad-khatib J.11 hlm.45-47}"
