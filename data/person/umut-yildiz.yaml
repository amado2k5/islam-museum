summary:
  ar: "فيزيائي فلكي تركي، وُلد سنة 1980. عمل سنوات في مختبر الدفع النفاث التابع لناسا في الاتصالات الفضائية العميقة وتحليل البيانات الضخمة، بعد دراسته في أنقرة وخرونينغن ولايدن، ثم عاد إلى تركيا ويعمل مديرًا للتواصل العلمي وعضو هيئة تدريس في جامعة الشرق الأوسط التقنية."
  en: "Turkish astrophysicist, born in 1980. After studying at Ankara, Groningen and Leiden, he worked for years at NASA's Jet Propulsion Laboratory on deep-space communication and big-data analysis, then returned to Turkey, where he serves as Director of Science Communication and a faculty member at Middle East Technical University."
  ur: "ترک فلکی طبیعیات دان، جو 1980 میں پیدا ہوئے۔ انقرہ، خرونینگن اور لائڈن میں تعلیم کے بعد انہوں نے ناسا کے جیٹ پروپلشن لیبارٹری میں گہرے خلائی رابطے اور بڑے اعداد و شمار کے تجزیے پر برسوں کام کیا، پھر ترکی لوٹ آئے اور مشرق وسطیٰ تکنیکی یونیورسٹی میں سائنسی ابلاغ کے ڈائریکٹر اور استاد ہیں۔"
