summary:
  ar: "فيزيائي فلكي تركي، وُلد سنة 1980. عمل سنوات في مختبر الدفع النفاث التابع لناسا في الاتصالات الفضائية العميقة وتحليل البيانات الضخمة، بعد دراسته في أنقرة وخرونينغن ولايدن، ثم عاد إلى تركيا ويعمل مديرًا للتواصل العلمي وعضو هيئة تدريس في جامعة الشرق الأوسط التقنية."
  en: "Turkish astrophysicist, born in 1980. After studying at Ankara, Groningen and Leiden, he worked for years at NASA's Jet Propulsion Laboratory on deep-space communication and big-data analysis, then returned to Turkey, where he serves as Director of Science Communication and a faculty member at Middle East Technical University."
  ur: "ترک فلکی طبیعیات دان، جو 1980 میں پیدا ہوئے۔ انقرہ، خرونینگن اور لائڈن میں تعلیم کے بعد انہوں نے ناسا کے جیٹ پروپلشن لیبارٹری میں گہرے خلائی رابطے اور بڑے اعداد و شمار کے تجزیے پر برسوں کام کیا، پھر ترکی لوٹ آئے اور مشرق وسطیٰ تکنیکی یونیورسٹی میں سائنسی ابلاغ کے ڈائریکٹر اور استاد ہیں۔"
  es: "Astrofísico turco, nacido en 1980. Tras estudiar en Ankara, Groningen y Leiden, trabajó durante años en el Laboratorio de Propulsión a Chorro de la NASA en comunicaciones del espacio profundo y análisis de macrodatos, para luego regresar a Turquía, donde ejerce como Director de Comunicación Científica y es miembro del profesorado de la Universidad Técnica de Oriente Medio."
  fr: "Astrophysicien turc, né en 1980. Après des études à Ankara, Groningen et Leiden, il a travaillé pendant des années au Jet Propulsion Laboratory de la NASA sur les communications spatiales lointaines et l'analyse de données massives, puis est retourné en Turquie, où il est directeur de la communication scientifique et membre du corps professoral de l'Université technique du Moyen-Orient."
  tr: "Türk astrofizikçi, 1980 doğumlu. Ankara, Groningen ve Leiden'de eğitim aldıktan sonra NASA'nın Jet İtki Laboratuvarı'nda derin uzay iletişimi ve büyük veri analizi alanında yıllarca çalıştı, ardından Türkiye'ye dönerek Orta Doğu Teknik Üniversitesi'nde Bilimsel İletişim Direktörü ve öğretim üyesi olarak çalıştı."
  id: "Astrofisikawan Turki, lahir tahun 1980. Ia bekerja bertahun-tahun di Jet Propulsion Laboratory NASA dalam komunikasi ruang angkasa dalam dan analisis big data, setelah belajar di Ankara, Groningen, dan Leiden, lalu kembali ke Turki untuk bekerja sebagai Direktur Komunikasi Ilmiah dan anggota fakultas di Middle East Technical University."
