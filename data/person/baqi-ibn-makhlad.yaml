id: person/baqi-ibn-makhlad
class: person
label: { ar: "بقي بن مخلد الأندلسي" }
summary:
  ar: "أبو عبد الرحمن الأندلسي ⁦(ت 276هـ)⁩، كانت له رحلة مشهورة وطلب مشهور، سمع من أحمد بن حنبل وغيره من الأئمة، وله تصانيف كثيرة منها مسنده روى فيه عن ألف وستمائة صحابي بل يزيدون، وجمع إلى العلم الصلاح والتقوى؛ وجاءت امرأة تشكو أن ابنها أسرته الروم ولا تقدر على فدائه فقال لها انصرفي حتى أنظر في أمره وأطرق ثم قال افتح فمك ففتحته بكل ما استطعته حتى مال ودعا بالفدية {cite:muntazam-ibn-al-jawzi p. 110-111}. وعند المقري ومن رحلته سمع بمكة ودخل العراق فلقي من أهل الكوفة إبراهيم بن أبي العنبس قاضيها وسمع ببغداد من القاضي إسماعيل وأحمد بن زهير بن حرب وعبد الله بن الإمام أحمد بن حنبل والحارث بن أبي أسامة وكتب عن ابن أبي خيثمة وسمع من ابن قتيبة كثيراً من كتبه ومن المبرد وثعلب وسمع بالقيروان من بكر بن حماد التاهرتي وانصرف إلى الأندلس بعلم كثير فمال الناس إليه {cite:nafh-tib-maqqari p. 50}"
  en: "Baqi ibn Makhlad al-Andalusi (d. 276), the famous traveller for hadith, student of Ahmad ibn Hanbal, author of a musnad on over sixteen hundred Companions; the tale of the woman whose son the Byzantines held captive — he emptied into her lap every dirham he had {cite:muntazam-ibn-al-jawzi p. 110-111}."
  es: "Baqi ibn Makhlad al-Andalusi (m. 276), el famoso viajero de hadices, discípulo de Ahmad ibn Hanbal, autor de un musnad sobre más de mil seiscientos Compañeros; la historia de la mujer cuyo hijo fue mantenido cautivo por los bizantinos: él vació en su regazo cada dirham que tenía {cite:muntazam-ibn-al-jawzi p. 110-111}."
  fr: "Baqi ibn Makhlad al-Andalusi (mort en 276), le célèbre voyageur pour les hadiths, élève d'Ahmad ibn Hanbal, auteur d'un musnad sur plus de seize cents Compagnons; l'histoire de la femme dont le fils était retenu captif par les Byzantins — il lui a donné tous les dirhams qu'il possédait {cite: muntazam-ibn-al-jawzi p. 110-111}."
  ur: "باقی ابن مقلد الاندلسی ⁦(متوفی 276)⁩، حدیث کا مشہور مسافر، احمد بن حنبل کا شاگرد، سولہ سو سے زائد صحابہ پر مسند کا مصنف؛ اس عورت کی کہانی جس کے بیٹے کو بازنطینیوں نے قید کر رکھا تھا - اس نے ہر درہم اس کی گود میں خالی کر دیا 110-111}۔"
  tr: "Ebu Abdülrahman el-Endülüsi (ö. 276 H) ünlü bir yolculuk yaptı ve bilgi aradı. Ahmed ibn Hanbal ve diğer imamlardan dinledi. Musnad da dahil olmak üzere birçok eser yazdı; burada bin altı yüz arkadaşından ve daha fazlasından rivayet etti ve onu doğruluk ve takvazlık bilgisiyle topladı. Bir kadın, oğlunun Romalılar tarafından esir alındığından ve onu kurtaramayacağından şikayet ederek geldi. Kadın ona, 'Onun işine bakana kadar dön ve araştır.' dedi. Sonra dedi ki, 'Ağzını aç.' Elimden geldiğince açtım, ta ki o dönüp fidye isteene kadar {cite:muntazam-ibn-al-jawzi s. 110-111}. El-Makri ile birlikte ve yolculuğu sırasında Mekke'de dinledi ve Irak'a girdi. Kufa'dan yargıcı İbrahim bin Ebi el-Enbas ile tanıştı. Bağdat'ta Hakim İsmail, Ahmed bin Zuhayr ibn Harb, Abdullah ibn İmam Ahmed ibn Hanbal ve El-Haris ibn Ebi Usama'dan dinledi. İbn Ebi Khaythamah'dan yazdı ve birçok kitabını İbn Kutaybe'den, El-Mübared ve Ta'lab'dan dinledi. Ayrıca Kairuan'da Bakr ibn Hammad Al-Tahirti'den de dinledi. Daha sonra çok bilgiyle Endülüs'e gitti ve insanlar ona yöneldi {atıf:nafh-tib-maqqari, s. 50}."
  id: "Abu Abd al-Rahman al-Andalusi (wafat 276 H) telah melakukan perjalanan terkenal dan mencari ilmu. Ia mendengar dari Ahmad ibn Hanbal dan imam-imam lainnya. Ia menulis banyak karya, termasuk Musnad-nya, di mana ia menceritakan dari seribu enam ratus sahabat, bahkan lebih banyak lagi, dan mengumpulkan dia dengan pengetahuan tentang kebenaran dan kesalehan. Seorang wanita datang mengeluh bahwa putranya telah ditangkap oleh orang Romawi dan tidak dapat menebusnya. Dia berkata, 'Berbaliklah sampai aku menyelidiki dan menyelidiki masalahnya.' Lalu dia berkata, 'Buka mulutmu.' Aku membukanya sekuat tenaga sampai dia berbalik dan memanggil tebusan {cite:muntazam-ibn-al-jawzi hlm. 110-111}. Bersama Al-Maqri, dan selama perjalanannya, ia mendengar di Mekah dan memasuki Irak. Ia bertemu Ibrahim ibn Abi Al-Anbas, hakimnya dari Kufa. Ia mendengar di Baghdad dari Hakim Ismail, Ahmad ibn Zuhayr ibn Harb, Abdullah ibn Imam Ahmad ibn Hanbal, dan Al-Harith ibn Abi Usama. Ia menulis dari Ibn Abi Khaythamah, dan mendengar banyak bukunya dari Ibn Qutaybah, termasuk dari Al-Mubarrad dan Ta'lab. Ia juga mendengar di Kairouan dari Bakr ibn Hammad Al-Tahirti. Ia kemudian pergi ke Andalusia dengan banyak pengetahuan, dan orang-orang beralih kepadanya {cite:nafh-tib-maqqari, hlm. 50}."
