id: person/baqi-ibn-makhlad
class: person
label: { ar: "بقي بن مخلد الأندلسي" }
summary:
  ar: "أبو عبد الرحمن الأندلسي (ت 276هـ)، كانت له رحلة مشهورة وطلب مشهور، سمع من أحمد بن حنبل وغيره من الأئمة، وله تصانيف كثيرة منها مسنده روى فيه عن ألف وستمائة صحابي بل يزيدون، وجمع إلى العلم الصلاح والتقوى؛ وجاءت امرأة تشكو أن ابنها أسرته الروم ولا تقدر على فدائه فقال لها انصرفي حتى أنظر في أمره وأطرق ثم قال افتح فمك ففتحته بكل ما استطعته حتى مال ودعا بالفدية {cite:muntazam-ibn-al-jawzi p. 110-111}.، وعند المقري ومن رحلته سمع بمكة ودخل العراق فلقي من أهل الكوفة إبراهيم بن أبي العنبس قاضيها وسمع ببغداد من القاضي إسماعيل وأحمد بن زهير بن حرب وعبد الله بن الإمام أحمد بن حنبل والحارث بن أبي أسامة وكتب عن ابن أبي خيثمة وسمع من ابن قتيبة كثيراً من كتبه ومن المبرد وثعلب وسمع بالقيروان من بكر بن حماد التاهرتي وانصرف إلى الأندلس بعلم كثير فمال الناس إليه {cite:nafh-tib-maqqari p. 50}"
  en: "Baqi ibn Makhlad al-Andalusi (d. 276), the famous traveller for hadith, student of Ahmad ibn Hanbal, author of a musnad on over sixteen hundred Companions; the tale of the woman whose son the Byzantines held captive — he emptied into her lap every dirham he had {cite:muntazam-ibn-al-jawzi p. 110-111}."
