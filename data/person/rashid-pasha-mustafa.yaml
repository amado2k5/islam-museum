summary:
  ar: "مصطفى رشيد باشا (وُلد في إسطنبول في 13 مارس 1800 – توفي فيها في 7 يناير 1858)، رجل دولة ودبلوماسي عثماني، صدر أعظم ست مرات في عهد عبد المجيد الأول، والمهندس الرئيس للتنظيمات وصاحب الدور الأول في صياغة خط شريف كلخانة سنة 1839 الذي أعلن أمن النفوس والأموال والأعراض والمساواة أمام القانون، وربّى جيل الإصلاحيين الذي منه عالي باشا وفؤاد باشا."
  en: "Mustafa Reşid Pasha (born in Istanbul on 13 March 1800 – died there on 7 January 1858) was an Ottoman statesman and diplomat, six times Grand Vizier under Abdülmecid I, the chief architect of the Tanzimat reforms and the leading hand behind the Edict of Gülhane of 1839, which proclaimed security of life, property and honour and equality before the law; he raised the generation of reformers that included Âli Pasha and Fuad Pasha."
  ur: "مصطفیٰ رشید پاشا (پیدائش: استنبول، 13 مارچ 1800ء – وفات: استنبول، 7 جنوری 1858ء)، عثمانی سیاست دان و سفارت کار، عبد المجید اول کے عہد میں چھ بار صدرِ اعظم رہے، دورِ تنظیمات کے معمارِ اعلیٰ اور 1839ء کے فرمانِ گلخانہ کے اصل مصنف تھے۔"
