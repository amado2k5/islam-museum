summary:
  ar: "مصطفى رشيد باشا، مهندس التنظيمات العثمانية؛ تلا على لسان السلطان عبد المجيد الأول خط شريف كلخانة سنة ١٨٣٩م الذي ساوى بين الرعايا المسلمين وغير المسلمين، فاستنكره العلماء وكفّروه ورأوا الخط منافياً للقرآن ومثيراً للقلاقل بين الرعية، ويذكر الصلابي أن إصداره كان ثمناً نالته بريطانيا وأوروبا مقابل تسوية النزاع مع محمد علي باشا. وأنشأ رشيد باشا مجلساً للنواب ووضع قانوناً للعقوبات وفق الشرائع الحديثة واستقدم فرنسياً لوضع قانون حديث وأنشأ بنكاً جديداً للدولة وأصدر أوراقاً مالية بلا رصيد معدني ففقدت قيمتها، وأُقصي سنة ١٨٤١م ثم عاد بعد أربع سنوات {cite:dawlat-uthmaniyya-salabi p. 375-376}."
  en: "Mustafa Reshid Pasha — the Tanzimat architect who read the Gülhane decree (1839) proclaiming equality of Muslim and non-Muslim subjects, built the deputies' council, modern penal code and state bank, and was denounced by the ulema for it {cite:dawlat-uthmaniyya-salabi p. 375-376}."
