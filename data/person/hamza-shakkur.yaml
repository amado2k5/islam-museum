summary:
  ar: "منشد دمشقي (1944–2009) لُقّب بشيخ المنشدين، منشد الجامع الأموي بدمشق ورئيس رابطة المنشدين في سوريا منذ 1974، أسس في 1983 مع جلال الدين فايس فرقة الكندي التي جالت بالإنشاد الصوفي والمولوية الدمشقية من الهند إلى الولايات المتحدة، وكان كذلك بطلًا لسوريا في كمال الأجسام."
  en: "Damascene munshid (1944–2009) called 'the shaykh of munshids', singer of the Umayyad Mosque of Damascus and president of Syria's league of munshids from 1974, who founded Ensemble Al-Kindi with Jalal al-Din Weiss in 1983 and toured Damascene Sufi song and Mevlevi performance from India to the United States; he was also a Syrian bodybuilding champion."
  ur: "دمشق کے منشد ⁦(1944ء–2009ء)⁩، جنھیں «شیخ المنشدین» کہا گیا، جامع اموی دمشق کے منشد اور 1974ء سے شام کی رابطۂ منشدین کے صدر، جنھوں نے 1983ء میں جلال الدین فائس کے ساتھ الکندی ensemble قائم کیا اور دمشقی صوفی انشاد اور مولوی رقص کو ہندوستان سے امریکا تک لے گئے؛ وہ شام کے باڈی بلڈنگ چیمپئن بھی تھے۔"
