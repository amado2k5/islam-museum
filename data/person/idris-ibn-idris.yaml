id: person/idris-ibn-idris
class: person
label: { ar: "إدريس بن إدريس", en: "Idris ibn Idris", es: "Idris ibn Idris", fr: "Idris ibn Idris", ur: "ادریس بن ادریس" }
summary:
  ar: "قام مقام أبيه إدريس بن عبد الله بعدما اغتاله عامل المنصور بالسم، فعرف بلد المغرب بهم وقيل بلد إدريس بن إدريس {cite:muruj-al-dhahab p. 285}."
  en: "Idris II — the son who held his poisoned father's Moroccan realm until the land itself was called 'the country of Idris ibn Idris' {cite:muruj-al-dhahab p. 285}."
  es: "Idris II — el hijo que mantuvo el reino marroquí de su padre envenenado hasta que la tierra misma fue llamada 'el país de Idris ibn Idris' {cite:muruj-al-dhahab p. 285}."
  fr: "Idris II — le fils qui a conservé le royaume marocain de son père empoisonné jusqu'à ce que le pays lui-même soit appelé « le pays d'Idris ibn Idris » {cite:muruj-al-dhahab p. 285}."
  ur: "ادریس دوم - وہ بیٹا جس نے اپنے زہر آلود باپ کی مراکش کی سلطنت کو سنبھالے رکھا یہاں تک کہ اس سرزمین کو 'ادریس ابن ادریس کا ملک' کہا جاتا تھا {حوالہ: مروج الذہب صفحہ 285}۔"
  tr: "El-Mansur valisi onu zehirle öldürdükten sonra babası İdris ibn Abdullah'ın yerine geçti ve Mağrip toprağı onlar tarafından bilinir; buranın İdris ibn İdris'in toprakları olduğu söylenir {atıf:muruj-al-dhahab s. 285}."
  id: "Ia menggantikan ayahnya Idris ibn Abdullah setelah gubernur al-Mansur membunuhnya dengan racun, dan tanah Maghreb menjadi dikenal oleh mereka, dan dikatakan sebagai tanah Idris ibn Idris {cite:muruj-al-dhahab hlm. 285}."
