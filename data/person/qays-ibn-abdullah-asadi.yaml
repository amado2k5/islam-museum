summary:
  ar: "رجل من بني أسد بن خزيمة، هاجر إلى الحبشة مع امرأته بركة بنت يسار؛ ويصفه ابن إسحاق بأنه كان ظئراً لعبيد الله بن جحش وأم حبيبة."
  en: A man of Banu Asad ibn Khuzayma; he emigrated to Abyssinia with his wife Baraka bint Yasar. Ibn Ishaq describes him as a foster-nurse of Ubaydullah ibn Jahsh and Umm Habiba.
  ur: "بنو اسد بن خزیمہ کا شخص؛ بیوی برکہ بنت یاسر کے ساتھ حبشہ ہجرت کیا؛ ابن اسحاق اسے عبید اللہ کی دایہ بتاتا ہے۔"
  es: "Era un hombre de la tribu Banu Asad ibn Khuzayma; emigró a Abisinia con su esposa Baraka bint Yasar. Ibn Ishaq lo describe como nodriza de Ubaydullah ibn Jahsh y Umm Habiba."
  fr: "Issu de la tribu des Banu Asad ibn Khuzayma, il émigra en Abyssinie avec son épouse Baraka bint Yasar. Ibn Ishaq le décrit comme nourrice d'Ubaydullah ibn Jahsh et d'Umm Habiba."
  tr: "Banu Asad ibn Khuzaymah'tan bir adam, eşi Baraka bint Yasar ile birlikte Habeşistan'a göç etmiştir; İbn İshaq onu Ubayd Allah ibn Jahsh ve um Habiba'nın soyundan olarak tanımlar."
  id: "Seorang pria dari Banu Asad ibn Khuzaymah bermigrasi ke Abyssinia bersama istrinya Baraka bint Yasar; Ibn Ishaq menggambarkannya sebagai keturunan Ubayd Allah ibn Jahsh dan um Habiba."
