summary:
  ar: "جرّاح عيون بنغلاديشي ورائد طبّ عيون المجتمع، وُلد في غوبالغانج سنة 1946. أسس مستشفى موجيبونيسا للعيون، أول مستشفى عيون مسجّل في بنغلاديش، وكان رئيس التحرير المؤسس لمجلة بنغلاديش لطب العيون. عمل مستشارا لرئيسة الوزراء الشيخة حسينة في الصحة ورعاية الأسرة والرعاية الاجتماعية من 2009 إلى 2013، وخدم ثلاث دورات في المجلس التنفيذي لمنظمة الصحة العالمية، ونال جائزة المنظمة لليوم العالمي بلا تدخين سنة 2010 عن عمله في مكافحة التبغ."
  en: "Bangladeshi ophthalmic surgeon and pioneer of community ophthalmology, born in Gopalganj in 1946. He founded Mojibunnessa Eye Hospital, the first registered eye hospital in Bangladesh, and was founding editor-in-chief of the Bangladesh Ophthalmic Journal. Health, Family Welfare and Social Welfare adviser to Prime Minister Sheikh Hasina from 2009 to 2013, he served three terms on the WHO Executive Board and received the WHO World No Tobacco Day Award in 2010 for his anti-smoking work."
  ur: "بنگلہ دیشی ماہر عینیات اور کمیونٹی طبِ چشم کے بانیوں میں سے ایک، جو 1946ء میں گوپال گنج میں پیدا ہوئے۔ انھوں نے موجیب النساء آئی ہسپتال قائم کیا، جو بنگلہ دیش کا پہلا رجسٹرڈ آئی ہسپتال تھا، اور بنگلہ دیش آفتھالمک جرنل کے بانی مدیر اعلیٰ رہے۔ وہ 2009ء سے 2013ء تک وزیر اعظم شیخ حسینہ کے مشیر برائے صحت، خاندانی بہبود اور سماجی بہبود رہے، عالمی ادارہ صحت کے ایگزیکٹو بورڈ کے تین مرتبہ رکن رہے اور 2010ء میں انھیں تنظیم کا عالمی یومِ ترکِ تمباکو ایوارڈ ملا۔"
  es: "Cirujano oftalmólogo bangladesí y pionero de la oftalmología comunitaria, nacido en Gopalganj en 1946. Fundó el Hospital Oftalmológico Mojibunnessa, el primer hospital oftalmológico registrado en Bangladesh, y fue editor jefe fundador de la Revista Oftalmológica de Bangladesh. Asesor de Salud, Bienestar Familiar y Bienestar Social de la Primera Ministra Sheikh Hasina de 2009 a 2013, formó parte del Consejo Ejecutivo de la OMS durante tres mandatos y recibió el Premio del Día Mundial Sin Tabaco de la OMS en 2010 por su labor antitabaco."
  fr: "Chirurgien ophtalmologue bangladais et pionnier de l'ophtalmologie communautaire, né à Gopalganj en 1946, il a fondé l'hôpital ophtalmologique Mojibunnessa, premier hôpital ophtalmologique enregistré du Bangladesh, et a été le rédacteur en chef fondateur du Bangladesh Ophthalmic Journal. Conseiller de la Première ministre Sheikh Hasina pour la santé, le bien-être familial et les affaires sociales de 2009 à 2013, il a siégé trois mandats au Conseil exécutif de l'OMS et a reçu le Prix de l'OMS pour la Journée mondiale sans tabac en 2010 pour son action contre le tabagisme."
  tr: "Bangladeşli bir göz cerrahı ve topluluk oftalmolojisinin öncüsü olan Sher, 1946'da Gobangang'da doğdu. Bangladeş'teki ilk kayıtlı göz hastanesi olan Mujibunisa Göz Hastanesi'ni kurdu ve Bangladesh Journal of Ophthalmology'nin kurucu genel yayın yönetmeni oldu. 2009-2013 yılları arasında Başbakan Sheikh Hasina'ya sağlık, aile bakımı ve sosyal bakım konularında danışmanlık yaptı, Dünya Sağlık Örgütü Yürütme Kurulu'nda üç dönem görev yaptı ve 2010'da tütün kontrolü konusundaki çalışmaları nedeniyle kuruluşun Tütün Yok Günü ödülünü aldı."
  id: "Sebagai ahli bedah mata asal Bangladesh dan pelopor oftalmologi komunitas, ia lahir di Gobangang pada tahun 1946. Ia mendirikan Mujibunisa Eye Hospital, rumah sakit mata terdaftar pertama di Bangladesh, dan merupakan pemimpin redaksi pendiri Bangladesh Journal of Ophthalmology. Ia pernah menjadi penasihat Perdana Menteri Sheikh Hasina dalam bidang kesehatan, perawatan keluarga, dan sosial dari tahun 2009 hingga 2013, menjabat tiga periode di Dewan Eksekutif Organisasi Kesehatan Dunia, dan menerima penghargaan No Tobacco Day dari organisasi tersebut pada tahun 2010 atas karyanya di bidang pengendalian tembakau."
