summary:
  ar: "جرّاح عيون بنغلاديشي ورائد طبّ عيون المجتمع، وُلد في غوبالغانج سنة 1946. أسس مستشفى موجيبونيسا للعيون، أول مستشفى عيون مسجّل في بنغلاديش، وكان رئيس التحرير المؤسس لمجلة بنغلاديش لطب العيون. عمل مستشارا لرئيسة الوزراء الشيخة حسينة في الصحة ورعاية الأسرة والرعاية الاجتماعية من 2009 إلى 2013، وخدم ثلاث دورات في المجلس التنفيذي لمنظمة الصحة العالمية، ونال جائزة المنظمة لليوم العالمي بلا تدخين سنة 2010 عن عمله في مكافحة التبغ."
  en: "Bangladeshi ophthalmic surgeon and pioneer of community ophthalmology, born in Gopalganj in 1946. He founded Mojibunnessa Eye Hospital, the first registered eye hospital in Bangladesh, and was founding editor-in-chief of the Bangladesh Ophthalmic Journal. Health, Family Welfare and Social Welfare adviser to Prime Minister Sheikh Hasina from 2009 to 2013, he served three terms on the WHO Executive Board and received the WHO World No Tobacco Day Award in 2010 for his anti-smoking work."
  ur: "بنگلہ دیشی ماہر عینیات اور کمیونٹی طبِ چشم کے بانیوں میں سے ایک، جو 1946ء میں گوپال گنج میں پیدا ہوئے۔ انھوں نے موجیب النساء آئی ہسپتال قائم کیا، جو بنگلہ دیش کا پہلا رجسٹرڈ آئی ہسپتال تھا، اور بنگلہ دیش آفتھالمک جرنل کے بانی مدیر اعلیٰ رہے۔ وہ 2009ء سے 2013ء تک وزیر اعظم شیخ حسینہ کے مشیر برائے صحت، خاندانی بہبود اور سماجی بہبود رہے، عالمی ادارہ صحت کے ایگزیکٹو بورڈ کے تین مرتبہ رکن رہے اور 2010ء میں انھیں تنظیم کا عالمی یومِ ترکِ تمباکو ایوارڈ ملا۔"
