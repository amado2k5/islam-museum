label: { ar: "ابن سناء الملك" }
names:
  - { value: "القاضي أبو القاسم هبة الله بن القاضي الرشيد أبي الفضل جعفر بن المعتمد سناء الملك المصري الأديب", kind: full }
summary:
  ar: "ابن سناء الملك القاضي أبو القاسم هبة الله بن القاضي الرشيد جعفر المصري الأديب صاحب الديوان المشهور؛ قرأ على الشريف الخطيب والنحو على ابن برني وسمع من السلفي وكتب بديوان الإنشاء، وكان بارع الترسل والنظم كثير التخصيص والتنعم محظوظاً من الدنيا، اختصر كتاب الحيوان للجاحظ وسماها روح الحيوان، وله ديوان جميعه موشحات سماه در الطراز، وجمع من الرسائل الدائرة بينه وبين القاضي الفاضل؛ ودخل مصر في عصره شرف الدين بن عنين فعملوا له الدعوات وقالوا هذا شاعر الشام وجرت لهم محافل، وقال العماد الكاتب كنت عند القاضي الفاضل في خيمته فأطعمني تصيدة كتبها إليه ابن سناء الملك وسنه لم يبلغ عشرين سنة فعجبت منها؛ توفي في العشر الأول من رمضان سنة ثمان وستمائة بالقاهرة عن بضع وستين سنة {cite:shadharat-dhahab p. 43-44}."
  en: "Ibn Sana' al-Mulk, the qadi Abu al-Qasim Hibatallah, son of the qadi al-Rashid — Egyptian man of letters with the famed diwan; he served the diwan al-insha', was master of epistle and verse, abridged al-Jahiz's Kitab al-Hayawan as Ruh al-Hayawan, composed Dar al-Tiraz, a diwan all of muwashshahat, and gathered his correspondence with al-Qadi al-Fadil — when Sharaf al-Din Ibn Unayn came to Egypt they feted him as 'the poet of Syria'; al-Imad the katib recalls al-Qadi al-Fadil feeding him, in his tent, a tasida that Ibn Sana' al-Mulk had written him before the age of twenty. He died in the first ten days of Ramadan 608 at Cairo, aged about sixty-five {cite:shadharat-dhahab p. 43-44}."
  es: "Ibn Sana' al-Mulk, el cadí Abu al-Qasim Hibatallah, hijo del cadí al-Rashid, fue un hombre de letras egipcio con el famoso diwan; sirvió al diwan al-insha', fue maestro de epístola y verso, abrevió el Kitab al-Hayawan de al-Jahiz como Ruh al-Hayawan, compuso Dar al-Tiraz, un diwan de muwashshahat, y reunió su correspondencia con al-Qadi al-Fadil. Cuando Sharaf al-Din Ibn Unayn llegó a Egipto, lo agasajaron como \"el poeta de Siria\". Al-Imad el Katib recuerda que al-Qadi al-Fadil le dio de comer, en su tienda, una tasida que Ibn Sana' al-Mulk le había escrito antes de los veinte años. Murió en los primeros diez días de Ramadán del año 608 en El Cairo, a la edad de unos sesenta y cinco años {cite:shadharat-dhahab p. 43-44}."
  fr: "Ibn Sana' al-Mulk, fils du cadi al-Qasim Hibatallah et du cadi al-Rashid, était un homme de lettres égyptien réputé, qui officiait au diwan al-insha'. Maître de l'épître et de la poésie, il abrégea le Kitab al-Hayawan d'al-Jahiz sous le titre de Ruh al-Hayawan, composa Dar al-Tiraz, un diwan entièrement consacré aux muwashshahat, et rassembla sa correspondance avec le cadi al-Fadil. Lors de la venue en Égypte de Sharaf al-Din Ibn Unayn, il fut accueilli en grande pompe comme « le poète de Syrie ». Le katib al-Imad raconte qu'al-Fadil lui offrit, sous sa tente, une tasida qu'Ibn Sana' al-Mulk lui avait écrite avant l'âge de vingt ans. Il mourut au Caire durant les dix premiers jours du Ramadan 608, à l'âge d'environ soixante-cinq ans (cf. shadharat-dhahab, p. 43-44)."
  ur: "ابن ثناء الملک، قاضی ابو القاسم ہیبت اللہ، قاضی الرشید کے بیٹے - مشہور دیوان کے ساتھ خطوط کا مصری شخص؛ اس نے دیوان الانشا کی خدمت کی، خط اور آیت کے ماہر تھے، الجہیز کی کتاب الحیوان کو روح الحیوان کے طور پر مختصر کیا، دار الطراز، تمام مواشہات کا دیوان لکھا، اور القادی الفاضل کے ساتھ خط و کتابت جمع کی- جب وہ مصر کے شاعر بن کر شرف النا کے پاس آئے۔ شام'؛ العماد کاتب نے القادی الفادل کو اپنے خیمے میں کھانا کھلاتے ہوئے یاد کیا، ایک تسیدہ جسے ابن ثناء الملک نے بیس سال کی عمر سے پہلے لکھا تھا۔ آپ کا انتقال رمضان المبارک کے پہلے دس دنوں میں 608ء میں قاہرہ میں ہوا، اس کی عمر تقریباً پینسٹھ سال تھی۔ 43-44}۔"
  tr: "İbn Sana'a al-Malik, yargıç Ebu el-Kasım Hibat Allah ibn el-Kaddi el-Reşid, Cafer el-Masri, edebi figür ve Divan'ın ünlü yazarı; el-Şerif el-Hatib'in yanında ve dilbilgisini İbn Barni'den aldı, Selefilerden dinledi ve Diwan el-İnşa ile yazdı. Şiir yazma ve yazma konusunda yetenekliydi, sık sık dünyevi yaşamın tadını çıkardı ve uzmanlaştı. El-Cahiz'in Al-Hayawan kitabını kısalttı ve ona Ruh al-Hayawan adını verdi. Ayrıca hepsine Durr al-Taraz adını verdiği bir diwan yazdı ve kendisiyle erdemli hakim arasında dolaşan yazışmaları topladı. Şerafeddin bin Anin onun döneminde Mısır'a girdi ve ona davetler verdiler, 'Bu Levant'ın şairidir.' dediler, ve onlar için toplantılar düzenlendi. Kâtip El-İmad şöyle dedi: Erdemli yargıçla çadırındaydım ve bana İbn Sana'l-Mulk tarafından yirmi yaşına bile girmemişken yazdığı bir mektubu verdi ve buna şaşırdım; Ramazan'ın ilk on gününde, 608 Hicri yılında, Kahire'de altmış yaşında öldü. [alıntı:] Shadharat-Dhahab, s. 43-44}."
  id: "Ibn Sana'a al-Malik, hakim Abu al-Qasim Hibat Allah ibn al-Qadi al-Rashid, Ja'far al-Masri, tokoh sastra, dan penulis terkenal Diwan; ia belajar di bawah bimbingan al-Sharif al-Khatib dan tata bahasa di bawah Ibn Barni, mendengar dari para Salafi, dan menulis bersama Diwan al-Insha. Ia mahir dalam menulis dan menulis puisi, sering kali mengkhususkan diri dan menikmati kehidupan duniawi. Ia merangkum buku Al-Hayawan karya Al-Jahiz dan menamainya Ruh al-Hayawan. Ia juga menulis sebuah diwan yang semuanya ia sebut Durr al-Taraz, dan ia mengumpulkan surat-menyurat yang beredar antara dirinya dan hakim yang berbudi luhur. Sharaf al-Din ibn 'Anin memasuki Mesir pada masanya, dan mereka mengadakan undangan untuknya, berkata, 'Inilah penyair Levant,' dan diadakan pertemuan untuk mereka. Al-Imad sang juru tulis berkata: Saya bersama hakim yang berbudi luhur di tendanya dan memberi saya surat yang ditulis kepadanya oleh Ibn Sana' al-Mulk ketika usianya belum genap dua puluh tahun, dan saya terkejut; ia meninggal dalam sepuluh hari pertama Ramadan tahun 608 H di Kairo pada usia enam puluh tahun. {cite:] Shadharat-Dhahab, hlm. 43-44}."
