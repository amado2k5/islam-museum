names:
  - { value: "القاضي أبو القاسم هبة الله بن القاضي الرشيد أبي الفضل جعفر بن المعتمد سناء الملك المصري الأديب", kind: full }
summary:
  ar: "ابن سناء الملك القاضي أبو القاسم هبة الله بن القاضي الرشيد جعفر المصري الأديب صاحب الديوان المشهور؛ قرأ على الشريف الخطيب والنحو على ابن برني وسمع من السلفي وكتب بديوان الإنشاء، وكان بارع الترسل والنظم كثير التخصيص والتنعم محظوظاً من الدنيا، اختصر كتاب الحيوان للجاحظ وسماها روح الحيوان، وله ديوان جميعه موشحات سماه در الطراز، وجمع من الرسائل الدائرة بينه وبين القاضي الفاضل؛ ودخل مصر في عصره شرف الدين بن عنين فعملوا له الدعوات وقالوا هذا شاعر الشام وجرت لهم محافل، وقال العماد الكاتب كنت عند القاضي الفاضل في خيمته فأطعمني تصيدة كتبها إليه ابن سناء الملك وسنه لم يبلغ عشرين سنة فعجبت منها؛ توفي في العشر الأول من رمضان سنة ثمان وستمائة بالقاهرة عن بضع وستين سنة {cite:shadharat-dhahab p. 43-44}."
  en: "Ibn Sana' al-Mulk, the qadi Abu al-Qasim Hibatallah, son of the qadi al-Rashid — Egyptian man of letters with the famed diwan; he served the diwan al-insha', was master of epistle and verse, abridged al-Jahiz's Kitab al-Hayawan as Ruh al-Hayawan, composed Dar al-Tiraz, a diwan all of muwashshahat, and gathered his correspondence with al-Qadi al-Fadil — when Sharaf al-Din Ibn Unayn came to Egypt they feted him as 'the poet of Syria'; al-Imad the katib recalls al-Qadi al-Fadil feeding him, in his tent, a tasida that Ibn Sana' al-Mulk had written him before the age of twenty. He died in the first ten days of Ramadan 608 at Cairo, aged about sixty-five {cite:shadharat-dhahab p. 43-44}."
