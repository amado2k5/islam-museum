summary:
  ar: "جنرال وسياسي غيني (1934–2008) من موساياه لومبايا قرب دوبريكا، من شعب السوسو، خدم في الجيشين الفرنسي والغيني وقاد انقلاب أبريل 1984 بعد وفاة الرئيس أحمد سيكو توري فصار ثاني رئيس لغينيا (1984–2008) وحكم أولا بالمجلس العسكري ثم بأحزاب متعددة شكلية حتى مات في كوناكري في 22 ديسمبر 2008."
  en: "Guinean general and politician (1934–2008) from Moussayah Loumbaya near Dubréka, a member of the Susu people, who served in the French and Guinean armies and led the April 1984 coup after President Ahmed Sékou Touré's death, becoming Guinea's second president (1984–2008); he ruled first through a military committee and then under a formally multiparty system until he died in Conakry on 22 December 2008."
  ur: "گنی جنرل و سیاست دان (1934ء–2008ء)، دوبریکا کے قریب موسایا لومبایا سے، سوسو قوم سے؛ فرانسیسی اور گنی افواج میں خدمت کی اور صدر احمد سیکو تورے کی وفات کے بعد اپریل 1984ء کی بغاوت کی قیادت کر کے گنی کے دوسرے صدر (1984ء–2008ء) بنے، حتیٰ کہ 22 دسمبر 2008ء کو کوناکری میں انتقال ہوا۔"
