    note: "No source consulted names a school or order for Fitrat. The English, Russian and Uzbek infoboxes carry no religion field, and Wikidata records only Islam in general. The texts attest his maktab and Mir-i-Arab madrasa formation in Bukhara, a devout Muslim father (family background), early pan-Islamic writings from his Istanbul years, and a later reformist critique of the clerical establishment: in a 1929 autobiographical statement he wrote that he had wanted to separate religion from superstition and had found that nothing remained of religion once it was separated. That statement is a scholarly description of his reform thought in a single tradition, not an affiliation attestation and not a second-source attestation of personal unbelief. Jadidism is a movement, not a school. With no school reading in any source, the value is unknown under the two-source rule (generic-only configuration)."
