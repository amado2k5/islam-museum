summary:
  ar: "كاتب وعالم وسياسي أوزبكي من بخارى (1886–1938م)، من أبرز منظّري حركة الجديد في آسيا الوسطى، تولى مناصب في حكومة جمهورية بخارى الشعبية السوفييتية، ودرّس في جامعات طشقند وسمرقند، وأُعدم في التطهير الكبير."
  en: "Uzbek Jadid writer, scholar and politician from Bukhara (1886–1938), a leading ideologue of the Central Asian jadid movement who served in the government of the Bukharan People's Soviet Republic, taught at universities in Tashkent and Samarkand, and was executed in the Great Purge."
