summary:
  ar: "سياسي بنغلاديشي (17 مارس 1920 – 15 أغسطس 1975)، مؤسس بنغلاديش وأول رئيس لها، قاد رابطة عوامي إلى فوزها في انتخابات باكستان سنة 1970، وأعلن استقلال بنغلاديش في مارس 1971، فترأس الحكومة المؤقتة أثناء حرب التحرير وهو سجين في باكستان الغربية، ثم ترأس الوزراء من 1972 إلى 1975 ورئاسة الجمهورية سنة 1975، واغتيل مع معظم أسرته في انقلاب عسكري في دكا. ابنته الكبرى شيخة حسينة."
  en: "Bangladeshi politician (17 March 1920 – 15 August 1975), the founder of Bangladesh and its first president. He led the Awami League to victory in Pakistan's 1970 general election, proclaimed Bangladesh's independence in March 1971 and headed its provisional government during the Liberation War while imprisoned in West Pakistan, then served as prime minister from 1972 to 1975 and as president in 1975, until he was assassinated with most of his family in a military coup at Dhaka. His eldest daughter is Sheikh Hasina."
  ur: "بنگلہ دیشی سیاست دان (17 مارچ 1920ء – 15 اگست 1975ء)، بنگلہ دیش کے بانی اور اس کے پہلے صدر۔ انھوں نے 1970ء کے پاکستانی عام انتخابات میں عوامی لیگ کو فتح دلائی، مارچ 1971ء میں بنگلہ دیش کی آزادی کا اعلان کیا اور جنگ آزادی کے دوران مغربی پاکستان میں قید رہتے ہوئے عبوری حکومت کی سربراہی کی، پھر 1972ء سے 1975ء تک وزیر اعظم اور 1975ء میں صدر رہے، حتیٰ کہ ڈھاکہ میں ایک فوجی بغاوت میں اپنے بیشتر خاندان سمیت قتل کر دیے گئے۔ ان کی بڑی بیٹی شیخ حسینہ ہیں۔"
