summary:
  ar: "محمد بن أحمد محيي الدين، نشانجي زاده، فقيه حنفي رومي، كان قاضيا في أدرنة وتوفي بها بحسب الزركلي، له الفتاوى الرومية ونور العينين، اختصر به جامع الفصولين، ومقصد الأمة من مسند الأئمة؛ توفي سنة 1031 هـ."
  en: "Muhammad ibn Ahmad Muhyi al-Din, known as Nishanjizade, a Hanafi jurist of Rum who, according to al-Zirikli, was judge in Edirne and died there; author of al-Fatawa al-Rumiyya, Nur al-aynayn (an abridgement of Jami al-fusulayn) and Maqsad al-umma min musnad al-a'imma; died 1031 AH (1621 or 1622)."
  es: "Muhammad ibn Ahmad Muhyi al-Din, conocido como Nishanjizade, un jurista hanafí de Rum que, según al-Zirikli, fue juez en Edirne y murió allí; autor de al-Fatawa al-Rumiyya, Nur al-aynayn (un compendio de Jami al-fusulayn) y Maqsad al-umma min musnad al-a'imma; murió en 1031 AH (1621 o 1622)."
