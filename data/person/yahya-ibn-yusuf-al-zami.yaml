  ur: "یحییٰ بن یوسف الزمی"
roles: [scholar]
gender: male
summary:
  ar: "أبو زكريا الزمي؛ روى عنه محمد بن إسحاق الصاغاني والبخاري وأبو حاتم الرازي وحنبل بن إسحاق والقاسم بن زاهر بن حرب وأبو بكر بن أبي الدنيا؛ قال أبو حاتم كتبنا عنه بالري قديماً ثم ببغداد وهو عندي صدوق، وقال أبو زرعة هو ثقة من قرية بخراسان يقال لها زَمّ. توفي ببغداد — قيل في رجب سنة خمس وعشرين ومائتين وقيل سنة ست وعشرين وقيل سنة تسع عشرة ومائتين {cite:tarikh-baghdad-khatib j.11 p.167}."
  en: "Abu Zakariyya al-Zami — transmitted from by al-Saghani, al-Bukhari, Abu Hatim, Hanbal b. Ishaq and Ibn Abi'l-Dunya; Abu Hatim: 'we wrote from him at Rayy long ago, then at Baghdad — he is truthful with me', Abu Zur'a: 'trustworthy, of a Khurasani village called Zamm'. Died at Baghdad, variously dated Rajab 225, 226 or 219 {cite:tarikh-baghdad-khatib j.11 p.167}."
  es: "Abu Zakariyya al-Zami — transmitido por al-Saghani, al-Bukhari, Abu Hatim, Hanbal b. Ishaq e Ibn Abi'l-Dunya; Abu Hatim: 'escribimos de él en Rayy hace mucho tiempo, luego en Bagdad; él es sincero conmigo', Abu Zur'a: 'digno de confianza, de una aldea de Khurasani llamada Zamm'. Murió en Bagdad, con fechas diversas de Rajab 225, 226 o 219 {cita:tarikh-baghdad-khatib j.11 p.167}."
  fr: "Abu Zakariyya al-Zami — transmis par al-Saghani, al-Bukhari, Abu Hatim, Hanbal b. Ishaq et Ibn Abi'l-Dunya; Abu Hatim: « nous avons écrit de lui à Rayy il y a longtemps, puis à Bagdad — il est véridique avec moi », Abu Zur'a: « digne de confiance, d'un village Khurasani appelé Zamm ». Décédé à Bagdad, daté de Rajab 225, 226 ou 219 {cite:tarikh-baghdad-khatib j.11 p.167}."
  ur: "ابو زکریا الزامی - الصغانی، البخاری، ابو حاتم، حنبلی سے منقول۔ اسحاق اور ابن ابی الدنیا؛ ابو حاتم: 'ہم نے ان سے بہت پہلے رے میں لکھا تھا، پھر بغداد میں - وہ میرے ساتھ سچا ہے'، ابو زرعہ: 'ثم نامی خراسانی گاؤں کا'۔ بغداد میں وفات ہوئی، مختلف تاریخ 225، 226 یا 219 کو۔ 11 صفحہ 167}۔"
