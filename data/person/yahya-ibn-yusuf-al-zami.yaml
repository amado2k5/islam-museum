summary:
  ar: "أبو زكريا الزمي؛ روى عنه محمد بن إسحاق الصاغاني والبخاري وأبو حاتم الرازي وحنبل بن إسحاق والقاسم بن زاهر بن حرب وأبو بكر بن أبي الدنيا؛ قال أبو حاتم كتبنا عنه بالري قديماً ثم ببغداد وهو عندي صدوق، وقال أبو زرعة هو ثقة من قرية بخراسان يقال لها زَمّ. توفي ببغداد — قيل في رجب سنة خمس وعشرين ومائتين وقيل سنة ست وعشرين وقيل سنة تسع عشرة ومائتين {cite:tarikh-baghdad-khatib j.11 p.167}."
  en: "Abu Zakariyya al-Zami — transmitted from by al-Saghani, al-Bukhari, Abu Hatim, Hanbal b. Ishaq and Ibn Abi'l-Dunya; Abu Hatim: 'we wrote from him at Rayy long ago, then at Baghdad — he is truthful with me', Abu Zur'a: 'trustworthy, of a Khurasani village called Zamm'. Died at Baghdad, variously dated Rajab 225, 226 or 219 {cite:tarikh-baghdad-khatib j.11 p.167}."
