  fr: "Siraj al-Din al-Urmawi"
  ur: "سراج الدین الارماوی"
roles: [scholar, writer]
gender: male
summary:
  ar: "محمود بن أبي بكر بن أحمد، أبو الثناء، سراج الدين الأرموي، عالم بالأصول والمنطق من الشافعية، أصله من أرمية، قرأ بالموصل وسكن دمشق وتوفي بقونية، صاحب مطالع الأنوار في المنطق ولطائف الحكمة، توفي سنة 682 هـ."
  en: "Mahmud ibn Abi Bakr ibn Ahmad, Abu al-Thana', Siraj al-Din al-Urmawi, a Shafi'i scholar of legal theory and logic from a family of Urmiya; he studied in Mosul, settled in Damascus and died in Konya; author of Matali' al-Anwar on logic and Lata'if al-Hikma; died 682 AH (1283)."
  es: "Mahmud ibn Abi Bakr ibn Ahmad, Abu al-Thana', Siraj al-Din al-Urmawi, un erudito shafi'i de teoría jurídica y lógica de una familia de Urmiya; estudió en Mosul, se estableció en Damasco y murió en Konya; autor de Matali' al-Anwar sobre lógica y Lata'if al-Hikma; murió en 682 AH (1283)."
  fr: "Mahmud ibn Abi Bakr ibn Ahmad, Abu al-Thana', Siraj al-Din al-Urmawi, un érudit chaféite de théorie juridique et de logique issu d'une famille d'Urmiya; il a étudié à Mossoul, s'est installé à Damas et est mort à Konya; auteur de Matali' al-Anwar sur la logique et de Lata'if al-Hikma; mort en 682 AH (1283)."
  ur: "محمود ابن ابی بکر بن احمد، ابو الثنا' سراج الدین الارماوی، ارمیہ کے خاندان سے قانونی نظریہ اور منطق کے شافعی اسکالر؛ اس نے موصل میں تعلیم حاصل کی، دمشق میں سکونت اختیار کی اور قونیہ میں وفات پائی۔ متلی الانوار پر منطق اور لطائف الحکمہ کے مصنف؛ وفات 682ھ (1283)۔"
