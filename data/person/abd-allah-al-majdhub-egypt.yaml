summary:
  ar: "الشيخ عبد الله المجذوب الحبشي الأصل المعروف بشيخ الحشاشة؛ دخل مصر وبنى له تربة حفرتها عند غريقة طريق المجاورين بطلعت المكس نحو بلاط الحكمة، ومات فيها ودُفن بها وهي معروفة إلى الآن عند مجاوري الشيخ إدريس، وكانت داهية عقله ولا ينام ليلاً ولا نهاراً، وكان كثيراً ما يحضر زوجته معه في الوقفة {cite:shadharat-dhahab p. 592}."
  en: "The Abyssinian-born majdhub 'shaykh of the hashish-takers' — built himself a turba at the Gharqi gateway on the mujawirin road, 'his intellect a calamity, never sleeping night or day', whose vigil-stand endures by Shaykh Idris's mujawirin {cite:shadharat-dhahab p. 592}."
