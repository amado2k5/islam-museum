summary:
  ar: "أمير الحرورية الأول، جعلوه عليهم حين انحاز اثنا عشر ألفاً من القراء وغيرهم إلى حروراء بعد تحكيم صفين، وخرج علي إليهم فكانت له معهم مناظرات فدخلوا جميعاً الكوفة {cite:muruj-al-dhahab p. 685}."
  en: "The first commander of the Hururiyya — chosen over the twelve thousand qurra' who withdrew to Harura' after the arbitration, until Ali debated them back into Kufa {cite:muruj-al-dhahab p. 685}."
  es: "El primer comandante de la Hururiyya, elegido entre los doce mil qurra' que se retiraron a Harura' después del arbitraje, hasta que Ali los convenció de regresar a Kufa {cite:muruj-al-dhahab p. 685}."
  fr: "Le premier commandant de la Hururiyya — choisi parmi les douze mille qurra' qui se retirèrent à Harura' après l'arbitrage, jusqu'à ce qu'Ali les ramène à Kufa {cite:muruj-al-dhahab p. 685}."
  ur: "حوریہ کا پہلا کمانڈر - بارہ ہزار قراء پر چنا گیا جو ثالثی کے بعد حررہ کی طرف واپس چلا گیا، یہاں تک کہ علی نے ان سے کوفہ واپس آکر بحث کی۔ 685}۔"
  tr: "Haruriyyah'ın ilk Emiri, Siffin'in arabuluculuğundan sonra on iki bin Kur'an ve diğerleri Harura'nın tarafını tutunca onu onlara karşı atadı. Ali onlara gitti ve onlarla tartışmalar yaptı, böylece hepsi Kufe'ye girdi {cite:muruj-al-dhahab, s. 685}."
  id: "Emir pertama Haruriyyah mengangkatnya melawan mereka ketika dua belas ribu Al-Qur'an dan lainnya berpihak pada Harura setelah arbitrase Siffin. Ali pergi menemui mereka, dan ia berdebat dengan mereka, sehingga mereka semua memasuki Kufa {cite:muruj-al-dhahab, hlm. 685}."
