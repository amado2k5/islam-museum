summary:
  ar: "صحابية من بني دوس من الأزد؛ أسلمت وبقيت بدار قومها بذي الخلصة فصبرت على الأذى وكاد كفار قومها أن يفتنوها فثبتت حتى أسلم على يديها بعضهم، ولما توفي زوجها أبو الفكر وهبت نفسها للنبي، ويروى أنها صاحبة قوله تعالى في سورة الأحزاب «وامرأة مؤمنة إن وهبت نفسها للنبي». وهي غير أم شريك القرشية العامرية."
  en: "A Companion of Banu Daws of al-Azd; she embraced Islam and stayed among her people at Dhu al-Khalasa, enduring their pressure until some of her persecutors themselves converted; after her husband Abu al-Fakr died she offered herself to the Prophet, and she is reported to be the 'believing woman who gives herself to the Prophet' of Surat al-Ahzab. Distinct from Umm Sharik al-Qurashiyya al-Amiriyya."
