summary:
  ar: "صحابية من بني دوس من الأزد؛ أسلمت وبقيت بدار قومها بذي الخلصة فصبرت على الأذى وكاد كفار قومها أن يفتنوها فثبتت حتى أسلم على يديها بعضهم، ولما توفي زوجها أبو الفكر وهبت نفسها للنبي، ويروى أنها صاحبة قوله تعالى في سورة الأحزاب «وامرأة مؤمنة إن وهبت نفسها للنبي». وهي غير أم شريك القرشية العامرية."
  en: "A Companion of Banu Daws of al-Azd; she embraced Islam and stayed among her people at Dhu al-Khalasa, enduring their pressure until some of her persecutors themselves converted; after her husband Abu al-Fakr died she offered herself to the Prophet, and she is reported to be the 'believing woman who gives herself to the Prophet' of Surat al-Ahzab. Distinct from Umm Sharik al-Qurashiyya al-Amiriyya."
  ur: "ازد کے بنو دوس کی صحابیہ؛ مسلمان ہوئیں اور ذو الخلصہ میں اپنے قوم کے درمیان رہیں، ان کے دباؤ سہتی ہوئیں یہاں تک کہ وہ نکل آئیں۔"
  es: "Una compañera de Banu Daws de al-Azd, abrazó el Islam y permaneció entre su gente en Dhu al-Khalasa, soportando la presión hasta que algunos de sus perseguidores se convirtieron. Tras la muerte de su esposo Abu al-Fakr, se ofreció al Profeta, y se dice que es la «mujer creyente que se entrega al Profeta» de la Sura al-Ahzab. Es distinta de Umm Sharik al-Qurashiyya al-Amiriyya."
  fr: "Compagne des Banu Daws d'al-Azd, elle embrassa l'islam et demeura parmi les siens à Dhu al-Khalasa, supportant leurs persécutions jusqu'à ce que certains d'entre eux se convertissent eux-mêmes. Après la mort de son époux, Abu al-Fakr, elle se donna au Prophète et est considérée comme la « croyante qui se donne au Prophète » mentionnée dans la sourate al-Ahzab. À ne pas confondre avec Umm Sharik al-Qurashiyya al-Amiriyya."
  tr: "El-Ezd'den Banu Daws'tan bir yoldaş; İslam'ı benimsedi ve Zhu'l-Khalisa'deki evinde kaldı, zorluklara katlandı ve kafirleri neredeyse onu ayarttı, bu yüzden bazıları onun aracılığıyla İslam'ı benimseyene kadar kararlı kaldı. Kocası Ebu el-Fikr vefat ettiğinde, kendini Peygamber'e adadı. Ahzab Suresi'nde şu ayetin yazarı olduğu rivayet edilir: \"Ve kendini Peygamber'e adanarsa iman eden bir kadındır.\" O, Kureyşi Amiriyyah'ın Şerek'inin annesi değildir."
  id: "Seorang sahabat dari Banu Daws dari Al-Azd; ia memeluk Islam dan tetap tinggal di rumah kaumnya di Dhu al-Khalisa, menahan kesulitan, dan orang-orang kafir di kaumnya hampir menggodanya, sehingga ia tetap teguh hingga beberapa dari mereka memeluk Islam melalui dirinya. Ketika suaminya, Abu al-Fikr, wafat, ia mendedikasikan diri kepada Nabi. Dikatakan bahwa ia adalah penulis ayat dalam Surah Al-Ahzab: \"Dan seorang wanita beriman jika ia mendedikasikan diri kepada Nabi.\" Ia bukanlah ibu dari Sharek dari Quraiyah Amiriyyah."
