summary:
  ar: "عالم وفقيه وناشط اجتماعي بنغلاديشي، وُلد في مقاطعة لاكشميبور سنة 1981، درس في مدارس قومية وتخرج في دار العلوم هاتهزاري، وأسس مؤسسة السنة الخيرية ويرأسها، وأسس موقع الأسئلة والأجوبة IQA.info، وتصل محاضراته إلى الملايين عبر قناة يوتيوب بدأت قناةً للمؤسسة ثم صارت تحمل اسمه."
  en: "Bangladeshi Islamic scholar, jurist and social activist, born in Lakshmipur District in 1981. He studied in Qawmi madrasas and graduated from Darul Uloom Hathazari, founded and chairs the As-Sunnah Foundation charity, and founded the IQA.info question-and-answer site; his lectures reach millions through a YouTube channel that began as the Foundation's and now carries his name."
  ur: "بنگلہ دیشی اسلامی عالم، فقیہ اور سماجی کارکن، جو 1981 میں ضلع لکشمی پور میں پیدا ہوئے۔ انہوں نے قومی مدارس میں تعلیم حاصل کی اور دارالعلوم ہاٹھازاری سے فارغ التحصیل ہوئے، اس-سنہ فاؤنڈیشن کی بنیاد رکھی اور اس کے چیئرمین ہیں، اور IQA.info سوالات و جوابات کی ویب سائٹ قائم کی؛ ان کے خطبات ایک یوٹیوب چینل کے ذریعے لاکھوں تک پہنچتے ہیں جو پہلے فاؤنڈیشن کا تھا اور اب ان کے نام سے ہے۔"
