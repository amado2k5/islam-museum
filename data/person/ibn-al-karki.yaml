summary:
  ar: "زين الدين ابن الكركي الحنفي المصري مسند الديار المصرية؛ سمع على شيخ الإسلام جلال الدين البلقيني وأجاز له شيخنا ابن حجر وجمع السماعات وجالس كبراء عصره، وقُتل غرقاً في بركة الفيل يوم الثلاثاء خامس شعبان سنة اثنتين وعشرين وتسعمائة ومشى في جنازته السلطان طومان باي الثاني ماشياً {cite:shadharat-dhahab p. 473}."
  en: "Egypt's musnid — heard under Jalal al-Din al-Bulqini, had Ibn Hajar's ijaza, and sat with the greats of his age; drowned in the Elephant Pond on Tuesday 5 Sha'ban 922, and Sultan Tuman Bay II walked in his funeral {cite:shadharat-dhahab p. 473}."
