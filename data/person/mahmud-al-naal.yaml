id: person/mahmud-al-naal
class: person
label: { ar: "محمود النعال" }
names:
  - { value: "ناصر الدين أبو الثناء وأبو الشكر محمود بن عثمان بن مكارم النعال البغدادي الأزجي الفقيه الحنبلي الواعظ الزاهد", kind: full }
summary:
  ar: "ناصر الدين محمود بن عثمان النعال البغدادي الفقيه الحنبلي الواعظ الزاهد؛ ولد سنة ثلاث وعشرين وخمسمائة ببغداد وحفظ مختصر الخرقي وقرأ على أبي الفتح ابن المني وصحب الشيخ عبد القادر مدة وتأدب به، وكان يجلس في رباطه للوعظ وكان رباطه مجمعاً للفقراء وأهل الدين والفقهاء الغرباء حتى قيل إن الاشتغال في رباطه بالعلم أكثر من الاشتغال في سائر المدارس، سكنه الشيخ موفق الدين المقدسي والحافظ عبد الغني وأخوه الشيخ العماد والحافظ عبد القادر الرهاوي وغيرهم من أكابر الرحالين؛ قال أبو الفرج بن الحنبلي كانوا ينكرون المنكر ويريقون الخمور وضُرب مرات وهو شديد في دين الله له إقدام وجهاد، وكان مهيباً لطيفاً مبتسماً يصوم الدهر ويختم القرآن كل يوم وليلة ولا يأكل إلا من غزل عمته؛ توفي ليلة الأربعاء عاشر صفر سنة تسع وستمائة عن أزيد من ثمانين سنة ودفن برباطه {cite:shadharat-dhahab p. 46-47}."
  en: "Nasir al-Din Mahmud b. Uthman al-Na'al, Baghdadi Hanbali jurist, preacher and ascetic; b. 523, memorized the Khiraqi, read under Ibn al-Mani, and long kept Abd al-Qadir al-Jilani's company. His ribat became the meeting-house of the poor, the pious and travelling jurists — its scholarship said to exceed all the madrasas'; al-Muwaffaq al-Maqdisi, the hafiz Abd al-Ghani, his brother al-Imad and al-Rahawi all lodged there. Ibn al-Hanbali: they denounced wrong and spilled out wine and he was beaten again and again — fierce in God's religion; smiling, ever-fasting, finishing the Qur'an daily, eating only what his aunt spun. He died Wednesday night 10 Safar 609 past eighty, buried in his ribat {cite:shadharat-dhahab p. 46-47}."
  es: "Nasir al-Din Mahmud b. Uthman al-Na'al, jurista, predicador y asceta hanbalí de Bagdad; n. 523, memorizó el Khiraqi, estudió con Ibn al-Mani y mantuvo durante mucho tiempo la compañía de Abd al-Qadir al-Jilani. Su ribat se convirtió en la casa de reunión de los pobres, los piadosos y los juristas itinerantes; se decía que su erudición superaba a la de todas las madrasas; al-Muwaffaq al-Maqdisi, el hafiz Abd al-Ghani, su hermano al-Imad y al-Rahawi se hospedaron allí. Ibn al-Hanbali: denunciaban la injusticia y derramaban vino, y él era golpeado una y otra vez; feroz en la religión de Dios; sonriente, siempre en ayunas, terminaba el Corán diariamente, comiendo solo lo que hilaba su tía. Murió el miércoles por la noche, 10 de Safar de 609, pasadas las ochenta, enterrado en su ribat {cite:shadharat-dhahab p. 46-47}."
  fr: "Nasir al-Din Mahmud b. Uthman al-Na'al, juriste hanbalite bagdadien, prédicateur et ascète, né en 523, mémorisa le Coran khiraqi, étudia auprès d'Ibn al-Mani et fréquenta longtemps Abd al-Qadir al-Jilani. Son ribat devint le lieu de rencontre des pauvres, des pieux et des juristes itinérants – son érudition surpassait, disait-on, celle de toutes les madrasas. Al-Muwaffaq al-Maqdisi, le hafiz Abd al-Ghani, son frère al-Imad et al-Rahawi y séjournèrent. Ibn al-Hanbali: ils dénoncèrent l'injustice et répandirent du vin, ce qui lui valut d'être battu à maintes reprises – fervent dans la religion de Dieu; souriant, jeûnant sans cesse, achevant la lecture du Coran chaque jour et ne se nourrissant que du fil de sa tante. Il est décédé mercredi soir 10 Safar 609 après quatre-vingts ans, enterré dans son ribat {cite:shadharat-dhahab p. 46-47}."
  ur: "ناصر الدین محمود ب۔ عثمان النال، بغدادی حنبلی فقیہ، مبلغ اور سنیاسی؛ ب 523، خراقی کو حفظ کیا، ابن المنی کے تحت پڑھا، اور طویل عرصے تک عبد القادر الجیلانی کی صحبت میں رہے۔ اس کی رباط غریبوں، متقیوں اور سفر کرنے والے فقہاء کی مجلس بن گئی - اس کا وظیفہ تمام مدارس سے بڑھ گیا۔ الموفق المقدسی، حافظ عبد الغنی، ان کے بھائی عماد اور الرحاوی سب وہاں مقیم تھے۔ ابن الحنبلی: انہوں نے غلط کی مذمت کی اور شراب پھینک دی اور اسے بار بار مارا پیٹا گیا - خدا کے دین میں سخت؛ مسکراتے ہوئے، ہمیشہ روزہ رکھنے والے، روزانہ قرآن ختم کرتے، وہی کھاتے جو اس کی خالہ نے کاتا تھا۔ ان کا انتقال بدھ کی رات 10 صفر 609 بجکر 80 منٹ پر ہوا، ان کی رباط میں تدفین ہوئی۔ 46-47}۔"
  tr: "Nasir al-Din Mahmud bin Osman el-Na'al el-Bağdadi, Hanbali hukukçu, vaiz ve münzevi; 523 Hicri yılında Bağdat'ta doğdu, Mukhtasar al-Kharqi'yi ezberledi, Ebu el-Feth İbn el-Munna'nın yanında çalıştı, bir süre Şeyh Abdül-Kadir'e eşlik etti ve onunla çalıştı. Vaaz vermek için ribatında otururdu ve ribatı yoksullar, din alimleri ve yabancı hukukçular için bir toplanma yeriydi; bilgiye olan bağlılığının diğer okullara göre daha yüksek olduğu söylenirdi. Burada Şeyh Muwaffaq al-Din al-Maqdisi, al-Hafız Abd al-Ghani, kardeşi Şeyh al-Imad, el-Hafız Abd al-Kadir al-Rahhawi ve diğerleri yaşardı. En büyük yolgahlardan biri olan Ebu el-Faraj bin Hanbali şöyle demiştir: Kötülüğü inkar ederler, alkol kusarlar ve bazen Allah'ın dininde katı davranırken vururlardı. Cesur ve mücadeleciydi. Onurlu, nazik ve gülümseyen biriydi, ömür boyu oruç tutar, her gün ve gece Kur'an'ı tamamlar, sadece teyzesinin ipliğini yerdi. Altı yüz seksen yılın Safar ayının onuncu Çarşamba gecesi vefat etti ve bağlılığıyla defnedildi {atıf:shadharat-dhahab s. 46-47}."
  id: "Nasir al-Din Mahmoud ibn Uthman al-Na'al al-Baghdadi, seorang ahli hukum Hanbali, penceramah, dan pertapa Hanbali; lahir pada tahun 523 H di Baghdad, ia menghafal Mukhtasar al-Kharqi, belajar di bawah bimbingan Abu al-Fath Ibn al-Munna, menemani Sheikh Abd al-Qadir untuk sementara waktu, dan belajar dengannya. Ia biasa duduk di ribat untuk berkhotbah, dan ribatnya menjadi tempat berkumpul bagi orang miskin, ulama agama, dan ahli hukum asing, sehingga dikatakan bahwa dedikasinya terhadap pengetahuan lebih besar daripada aliran lain. Tempat ini dihuni oleh Sheikh Muwaffaq al-Din al-Maqdisi, al-Hafiz Abd al-Ghani, saudaranya Sheikh al-Imad, al-Hafiz Abd al-Qadir al-Rahhawi, dan lainnya. Di antara para pengembara terbesar; Abu al-Faraj ibn al-Hanbali berkata: Mereka biasa menyangkal kejahatan, memuntahkan alkohol, dan kadang-kadang menyerang saat taat dalam agama Allah. Dia berani dan berusaha. Dia bermartabat, lembut, dan tersenyum, berpuasa seumur hidup, menyelesaikan Al-Quran setiap hari dan malam, dan hanya makan benang bibinya. Dia meninggal pada malam Rabu, tanggal sepuluh Safar, tahun enam ratus delapan puluh, dan dimakamkan dalam ikatannya {cite:shadharat-dhahab hlm. 46-47}."
