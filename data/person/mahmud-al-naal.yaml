summary:
  ar: "ناصر الدين محمود بن عثمان النعال البغدادي الفقيه الحنبلي الواعظ الزاهد؛ ولد سنة ثلاث وعشرين وخمسمائة ببغداد وحفظ مختصر الخرقي وقرأ على أبي الفتح ابن المني وصحب الشيخ عبد القادر مدة وتأدب به، وكان يجلس في رباطه للوعظ وكان رباطه مجمعاً للفقراء وأهل الدين والفقهاء الغرباء حتى قيل إن الاشتغال في رباطه بالعلم أكثر من الاشتغال في سائر المدارس، سكنه الشيخ موفق الدين المقدسي والحافظ عبد الغني وأخوه الشيخ العماد والحافظ عبد القادر الرهاوي وغيرهم من أكابر الرحالين؛ قال أبو الفرج بن الحنبلي كانوا ينكرون المنكر ويريقون الخمور وضُرب مرات وهو شديد في دين الله له إقدام وجهاد، وكان مهيباً لطيفاً مبتسماً يصوم الدهر ويختم القرآن كل يوم وليلة ولا يأكل إلا من غزل عمته؛ توفي ليلة الأربعاء عاشر صفر سنة تسع وستمائة عن أزيد من ثمانين سنة ودفن برباطه {cite:shadharat-dhahab p. 46-47}."
  en: "Nasir al-Din Mahmud b. Uthman al-Na'al, Baghdadi Hanbali jurist, preacher and ascetic; b. 523, memorized the Khiraqi, read under Ibn al-Mani, and long kept Abd al-Qadir al-Jilani's company. His ribat became the meeting-house of the poor, the pious and travelling jurists — its scholarship said to exceed all the madrasas'; al-Muwaffaq al-Maqdisi, the hafiz Abd al-Ghani, his brother al-Imad and al-Rahawi all lodged there. Ibn al-Hanbali: they denounced wrong and spilled out wine and he was beaten again and again — fierce in God's religion; smiling, ever-fasting, finishing the Qur'an daily, eating only what his aunt spun. He died Wednesday night 10 Safar 609 past eighty, buried in his ribat {cite:shadharat-dhahab p. 46-47}."
