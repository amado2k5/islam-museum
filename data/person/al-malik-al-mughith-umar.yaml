summary:
  ar: "ابن الملك الصالح أيوب؛ لم يحفظ عنه كلمة فحش؛ حبسه الملك الصالح إسماعيل وضيّق عليه السامري فمات غماً وغبناً ودفن بتربة جده الملك الكامل {cite:shadharat-dhahab p. 223}."
  en: "Al-Salih Ayyub's son (d. 642) — of whom no foul word was ever recorded; imprisoned by al-Salih Isma'il and squeezed by the minister 'the Samaritan', he died of grief and was buried in his grandfather al-Kamil's tomb {cite:shadharat-dhahab p. 223}."
  es: "Hijo de Al-Salih Ayyub (m. 642), de quien nunca se registró una palabra grosera; encarcelado por al-Salih Isma'il y oprimido por el ministro 'el Samaritano', murió de pena y fue enterrado en la tumba de su abuelo al-Kamil {cite:shadharat-dhahab p. 223}."
  fr: "Le fils d'Al-Salih Ayyub (d. 642) — dont aucun mot grossier n'a jamais été enregistré; emprisonné par al-Salih Isma'il et pressé par le ministre « le Samaritain », il mourut de chagrin et fut enterré dans le tombeau de son grand-père al-Kamil {cite:shadharat-dhahab p. 223}."
  ur: "الصالح ایوب کا بیٹا ⁦(متوفی 642)⁩ - جس کے بارے میں کبھی کوئی غلط لفظ درج نہیں کیا گیا تھا۔ الصالح اسماعیل کے ذریعہ قید کیا گیا اور وزیر سامری کے ذریعہ نچوڑا گیا، وہ غم کی حالت میں فوت ہوا اور اپنے دادا کامل کے مقبرے میں دفن ہوا۔ 223}۔"
  tr: "Doğru kral Eyyub'un oğlu; hakkında tek bir küfür bile saklamadı; doğru kral İsmail onu hapsetti ve Samiriyeli onu taciz etti, bu yüzden keder ve keder içinde öldü ve büyükbabası el-Malik el-Kamil'in mezarına gömüldü {kaynak: shadharat-dhahab, s. 223}."
  id: "Putra raja yang benar Ayyub; ia tidak menyimpan sepatah kata pun yang melampau; raja yang benar Ismail memenjarakannya, dan orang Samaria itu mengganggunya, sehingga ia meninggal dalam kesedihan dan kesedihan, dan dimakamkan di makam kakeknya al-Malik al-Kamil {cite:shadharat-dhahab, hlm. 223}."
