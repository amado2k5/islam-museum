label: { ar: "علقمة بن صفوان الكناني", en: "Alqama ibn Safwan", es: "Alqama ibn Safwan", fr: "Alqama ibn Safwan", ur: "علقمہ بن صفوان" }
summary:
  ar: "علقمة بن صفوان بن أمية بن محرّب الكناني، جد مروان بن الحكم لأمه؛ خرج ليلة يريد مالاً له بمكة فانتهى إلى حائط حرمان فظهر له شق الجني فقال علقم إني مقتول وإن لحمي مأكول بالمسلول ضرب غلام مشمول أضربهم رحب الذراع بهلول، فتضاربا فخرا ميتين، ومشهور عند العرب أن علقمة قتلته الجن {cite:muruj-al-dhahab p. 473-474}."
  en: "Alqama ibn Safwan al-Kinani, Marwan's maternal grandfather — waylaid at the wall of Harman by the half-man jinn Shiqq; they exchanged verse then blows and both fell dead, whence the saying that the jinn killed Alqama {cite:muruj-al-dhahab p. 473-474}."
  es: "Alqama ibn Safwan al-Kinani, abuelo materno de Marwan, fue emboscado en la muralla de Harman por el genio mitad hombre Shiqq; intercambiaron versos y luego golpes, y ambos cayeron muertos, de donde proviene el dicho de que el genio mató a Alqama {cite:muruj-al-dhahab p. 473-474}."
  fr: "Alqama ibn Safwan al-Kinani, le grand-père maternel de Marwan, fut pris en embuscade au mur de Harman par le djinn mi-homme Shiqq; ils échangèrent des vers puis des coups et tous deux tombèrent morts, d'où le dicton selon lequel le djinn tua Alqama {cite:muruj-al-dhahab p. 473-474}."
  ur: "علقمہ بن صفوان الکنانی، مروان کے نانا - آدھے انسان جن شق کے ذریعہ حرمین کی دیوار پر لیٹ گئے؛ انہوں نے آیت کا تبادلہ کیا پھر ہاتھا پائی ہوئی اور دونوں مر گئے، یہ کہا جاتا ہے کہ جنوں نے علقمہ کو مار ڈالا۔ 473-474}۔"
