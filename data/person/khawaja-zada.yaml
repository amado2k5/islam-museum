summary:
  ar: "الملا مصلح الدين مصطفى خواجه زاده البرساوي الحنفي؛ كان والده من التجار صاحب ثروة عظيمة وكان أولاده في غاية الرفاهية وعين للمترجم في شبابه كل يوم درهماً واحداً وكان ذلك لاشتغاله بالعلم وتركه طريقة والده فإنه سخط عليه لذلك ثم دأب في الطلب واتصل بخدمة المولى ابن قاضي آيا سلوق فقرأ عنده الأصلين والمعاني والبيان ثم وصل إلى خدمة خضر بك بن جلال وقرأ عليه علوماً كثيرة وكان يكرمه إكراماً عظيماً وكان يقول إذا أشكلت عليه مسألة لتعرض على العقل السليم يريد به خواجه زاده، ثم تنقل في المدارس مع الفقر الشديد وحفظ شرح المواقف ثم جعله السلطان محمد معلماً لنفسه وقرأ عليه تصريف العزي للزنجاني في الصرف فكتب عليه حاشية نفيسة وتقرب عند السلطان غاية القرب إلى أن صار قاضياً للعسكر وكان والده وقتئذ في الحيف والاحتياج فسار إلى ولده من برسا إلى أدرنة وخرج ولده للقائه ومعه علماء البلد وأشرافه ونزل خواجه زاده له عن فرسه وعانقه وعمل له ولإخوته ضيافة عظيمة وجمع فيها العلماء والأكابر وجلس هو في صدر المجلس ووالده عنده فلم يمكن إخوته الجلوس لازدحام الأكابر فقاموا مع الخدم بعد ما كانوا فيه من الرفاهية، ثم أعطاه السلطان محمد تدريس سلطانية برسا وعين له خمسين درهماً وهو ابن ثلاث وثلاثين سنة ثم أعطاه مدرسته بقسطنطينية وصنف هناك كتاب التهافت بأمر السلطان ثم استقضى بأدرنة ثم استفتى بقسطنطينية ثم أعطي قضاء إزنيق وتدريسها فذهب إليها وترك القضاء وبقي على التدريس إلى أن مات السلطان محمد فأتى قسطنطينية وأعطاه السلطان بايزيد سلطانية برسا وعين له مائة درهم ثم أعطاه فتيا برسا وقد اختلت رجلاه ويده اليمنى فكان يكتب باليسرى وكتب حاشية على شرح المواقف بأمر بايزيد إلى مباحث الوجود ثم توفي سنة ثلاث وتسعين وثمانمائة وله حواش على شرح هداية الحكمة وشرح على الطوالع وحواش على التلويح {cite:shadharat-dhahab p. 354-356}."
  en: "Khawaja-zada — the merchant's son paid one dirham a day for choosing scholarship over trade, Khidr Beg's 'sound mind', Mehmed II's own teacher who wrote the Tahafut at his command; the famous scene where his once-scornful father came poor to Edirne and found no seat for his other sons amid the ulama; ended paralyzed on his right side writing hashiyas with his left hand; died 893 {cite:shadharat-dhahab p. 354-356}."
  es: "Khawaja-zada — el hijo del comerciante, que pagaba un dirham al día por elegir la erudición sobre el comercio; la \"mente sana\" de Khidr Beg; el propio maestro de Mehmed II, que escribió el Tahafut por orden suya; la famosa escena en la que su padre, antes desdeñoso, llegó pobre a Edirne y no encontró sitio para sus otros hijos entre los ulemas; terminó paralizado del lado derecho escribiendo hashiyas con la mano izquierda; murió en 893 {cita: shadharat-dhahab págs. 354-356}."
  fr: "Khawaja-zada — le fils du marchand qui payait un dirham par jour pour avoir choisi l'érudition plutôt que le commerce, « l'esprit sain » de Khidr Beg, le propre professeur de Mehmed II qui écrivit le Tahafut sur son ordre; la fameuse scène où son père, autrefois méprisant, vint pauvre à Edirne et ne trouva aucune place pour ses autres fils parmi les oulémas; finit paralysé du côté droit, écrivant des hashiyas de la main gauche; mourut en 893 {cite:shadharat-dhahab p. 354-356}."
  ur: "خواجہ زادہ - تاجر کے بیٹے نے تجارت پر وظیفہ منتخب کرنے کے لیے ایک درہم یومیہ ادا کیا، خضر بیگ کا 'صاف ذہن'، محمد ثانی کا اپنا استاد جس نے اس کے حکم پر طافوت لکھا؛ وہ مشہور منظر جہاں اس کا کبھی حقارت زدہ باپ غریب ایڈرن آیا اور اسے اپنے دوسرے بیٹوں کے لیے علماء کے درمیان کوئی نشست نہیں ملی۔ اپنے بائیں ہاتھ سے حشیہ لکھتے ہوئے دائیں طرف مفلوج وفات 893۔ 354-356}۔"
  tr: "Mele Muslih-Din Mustafa Khwaja Zada al-Barsawi al-Hanafi; babası büyük servetli bir tüccardı ve çocukları son derece varlıklıydı. Gençliğinde, bilgiye olan ilgisi ve babasının yolundan ayrılması nedeniyle her gün bir dirhem tercüman tutardı; bu da onu öfkelendirdi. Daha sonra Mawla Ibn Qadi Aya Suluk'un hizmetini aramaya devam etti ve onunla bağlantı kurdu; burada iki ilkeyi, anlamlarını ve bayanı inceledi. Sonra Khidr Bey ibn Jalal'ın hizmetine ulaştı, onun yanında birçok bilim eğitimi aldı, ona büyük bir onur verdi ve derdi ki, bir sorun olursa, Sağlıklı bir zihne Khwaja Zade'nin istediğini sunması gereken bir mesele vardı. Sonra ağır yoksulluğa rağmen okullarda dolaştı ve durumların açıklamalarını ezberledi. Sultan Muhammed onu öğretmen yaptı ve Al-Zanjani'nin Al-Uzzi'nin morfolojisini ona okudu. Üzerine değerli bir kenar not yazdı ve Sultan ile çok yakınlaştı, ta ki askeri yargıç olana kadar. O dönemde babası zor durumda ve ihtiyaç içindeydi. Oğlunun yanına Barsa'dan Edirne'ye gitti ve oğlu ülkenin alimleri ve soylularıyla birlikte onu karşılamaya gitti. Khwaja Zada onun için atından indi, onu kucakladı ve çalıştı O ve kardeşleri büyük misafirperverlik gösterdiler, alimleri ve ileri gelenleri bir araya getirdiler. Babası yanında kalırken o meclisin başında oturdu. Kardeşleri yaşlıların kalabalığı nedeniyle oturamadı, lükslerine rağmen hizmetçilerle birlikte kaldılar. Sonra Sultan Mehmed ona İran'da Sultanlık öğretimini verdi ve otuz üç yaşında elli dirhem verdi. Sonra ona İstanbul'daki okulunu verdi ve orada 'El-Tahafat bi Amr al-Sultan' adlı kitabı yazdı. Daha sonra Edirne'de yargıçlık yaptı, ardından İstanbul'da fetva aradı. Yargıç olarak atandı ve orada ders verdi, oraya gitti, yargıyı bıraktı ve öğretime devam etti Sultan Muhammed öldüğünde Konstantinopolis'e gitti ve Sultan Bayezid ona Pers Sultanlığı'nı verdi, yüz dirhem verdi, ardından bacakları ve sağ eli zayıf halde ona bir fetva verdi. Sol eliyle yazdı ve Bayezid'in varoluş araştırmasına dair emriyle durumların açıklamasına dair kenar tehyet yazdı. 893 Hicri yılında öldü. Hidayet al-Hikmah'ın açıklaması üzerine kenar notları, sonuçları üzerine yorumlar ve ipucu üzerine kenar notları yazdı {atıf:şadharat-dhahab, s. 354-356}."
  id: "Mulla Muslih al-Din Mustafa Khwaja Zada al-Barsawi al-Hanafi; ayahnya adalah seorang pedagang yang sangat kaya, dan anak-anaknya sangat makmur. Di masa mudanya, ia menunjuk seorang penerjemah satu dirham setiap hari karena obsesinya pada pengetahuan dan meninggalkan jalan ayahnya, yang membuatnya marah. Ia kemudian terus berusaha dan terlibat dalam pelayanan Mawla Ibn Qadi Aya Suluq, di mana ia mempelajari dua prinsip, makna, dan bayan. Kemudian ia melayani Khidr Bey ibn Jalal, mempelajari banyak ilmu di bawahnya, dan menghormatinya dengan kehormatan besar, serta sering berkata bahwa jika ada masalah, Ia memiliki sesuatu untuk disampaikan kepada pikiran waras apa yang diinginkan Khwaja Zada. Ia kemudian berpindah-pindah sekolah meskipun sangat miskin dan menghafal penjelasan situasi. Sultan Muhammad menjadikannya gurunya dan membacakan morfologi Al-Uzzi oleh Al-Zanjani. Ia menulis sebuah marginalia yang berharga tentang itu, dan ia menjadi sangat dekat dengan Sultan hingga menjadi hakim militer. Pada saat itu, ayahnya sedang dalam kesulitan dan membutuhkan. Ia melakukan perjalanan ke Barsa ke Edirne untuk menemui putranya, dan putranya pergi menemuinya bersama para ulama dan bangsawan negara. Khwaja Zada turun dari kudanya untuknya, memeluknya, dan bekerja Ia dan saudara-saudaranya menikmati keramahan besar, mengumpulkan para cendekiawan dan pejabat penting. Ia duduk memimpin dewan sementara ayahnya tinggal bersamanya. Saudara-saudaranya tidak bisa duduk karena keramaian para tetua, sehingga mereka tetap bersama para pelayan meskipun mereka mewah. Kemudian Sultan Mehmed memberinya ajaran Kesultanan di Persia dan menunjukkannya lima puluh dirham pada usia tiga puluh tiga tahun. Ia kemudian memberinya sekolah di Konstantinopel dan menulis buku 'Al-Tahafat bi Amr al-Sultan' di sana. Ia kemudian menjadi hakim di Edirne, kemudian mencari fatwa di Konstantinopel. Ia diangkat sebagai hakim dan mengajar di sana, sehingga ia pergi ke sana, meninggalkan dunia peradilan, dan terus mengajar hingga Ketika Sultan Muhammad wafat, ia pergi ke Konstantinopel, dan Sultan Bayezid memberinya Kesultanan Persa, menunjuk seratus dirham, lalu memberinya fatwa Persa, dengan kaki dan tangan kanannya lemah. Ia menulis dengan tangan kiri, dan menulis komentar pinggiran atas penjelasan situasi oleh perintah Bayezid untuk penelitian keberadaan. Ia meninggal pada tahun 893 H. Ia menulis catatan pinggir tentang penjelasan Hidayat al-Hikmah, komentar tentang konsekuensinya, dan catatan pinggir tentang petunjuk {cite:shadharat-dhahab, hlm. 354-356}."
