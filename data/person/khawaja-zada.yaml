names:
  - { value: "المولى مصلح الدين مصطفى بن يوسف بن صنالح البرساوي الحنفي المعروف بخواجه زاده", kind: full }
gender: male
summary:
  ar: "الملا مصلح الدين مصطفى خواجه زاده البرساوي الحنفي؛ كان والده من التجار صاحب ثروة عظيمة وكان أولاده في غاية الرفاهية وعين للمترجم في شبابه كل يوم درهماً واحداً وكان ذلك لاشتغاله بالعلم وتركه طريقة والده فإنه سخط عليه لذلك ثم دأب في الطلب واتصل بخدمة المولى ابن قاضي آيا سلوق فقرأ عنده الأصلين والمعاني والبيان ثم وصل إلى خدمة خضر بك بن جلال وقرأ عليه علوماً كثيرة وكان يكرمه إكراماً عظيماً وكان يقول إذا أشكلت عليه مسألة لتعرض على العقل السليم يريد به خواجه زاده، ثم تنقل في المدارس مع الفقر الشديد وحفظ شرح المواقف ثم جعله السلطان محمد معلماً لنفسه وقرأ عليه تصريف العزي للزنجاني في الصرف فكتب عليه حاشية نفيسة وتقرب عند السلطان غاية القرب إلى أن صار قاضياً للعسكر وكان والده وقتئذ في الحيف والاحتياج فسار إلى ولده من برسا إلى أدرنة وخرج ولده للقائه ومعه علماء البلد وأشرافه ونزل خواجه زاده له عن فرسه وعانقه وعمل له ولإخوته ضيافة عظيمة وجمع فيها العلماء والأكابر وجلس هو في صدر المجلس ووالده عنده فلم يمكن إخوته الجلوس لازدحام الأكابر فقاموا مع الخدم بعد ما كانوا فيه من الرفاهية، ثم أعطاه السلطان محمد تدريس سلطانية برسا وعين له خمسين درهماً وهو ابن ثلاث وثلاثين سنة ثم أعطاه مدرسته بقسطنطينية وصنف هناك كتاب التهافت بأمر السلطان ثم استقضى بأدرنة ثم استفتى بقسطنطينية ثم أعطي قضاء إزنيق وتدريسها فذهب إليها وترك القضاء وبقي على التدريس إلى أن مات السلطان محمد فأتى قسطنطينية وأعطاه السلطان بايزيد سلطانية برسا وعين له مائة درهم ثم أعطاه فتيا برسا وقد اختلت رجلاه ويده اليمنى فكان يكتب باليسرى وكتب حاشية على شرح المواقف بأمر بايزيد إلى مباحث الوجود ثم توفي سنة ثلاث وتسعين وثمانمائة وله حواش على شرح هداية الحكمة وشرح على الطوالع وحواش على التلويح {cite:shadharat-dhahab p. 354-356}."
  en: "Khawaja-zada — the merchant's son paid one dirham a day for choosing scholarship over trade, Khidr Beg's 'sound mind', Mehmed II's own teacher who wrote the Tahafut at his command; the famous scene where his once-scornful father came poor to Edirne and found no seat for his other sons amid the ulama; ended paralyzed on his right side writing hashiyas with his left hand; died 893 {cite:shadharat-dhahab p. 354-356}."
