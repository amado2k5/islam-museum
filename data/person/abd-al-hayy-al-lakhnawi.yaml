  ar: "أبو الحسنات محمد عبد الحي اللكنوي، عالم حنفي هندي من مدرسة فرنكي محل بلكناو، وُلد ببانده بيلكهند سنة 1264هـ/1848م، وله حواشٍ على كتب الدرس الهندي وكتاب الفوائد البهية في تراجم الحنفية. {cite:encyclopaedia-of-islam-2 vol. 1 p. 85}"
