label: { ar: "وصيف التركي" }
summary:
  ar: "من قادة الجند الأتراك في سامراء، قُتل سنة ثلاث وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.374}. وعند المسعودي أمر بحرق البساط الذي كان تحت المتوكل ليلة الحادثة وعليه صورة شيرويه وصورة يزيد بن الوليد بعد أن سأل عنه المنتصر، وأسجن محبوبة حين غنت أي عيش يلذ لي لا أرى فيه جعفراً {cite:muruj-al-dhahab p. 512, 515}"
  tr: "Samarra'daki Türk askerlerinin komutanlarından biri olan Mus'udi, 253 Hicri yılında öldürüldü {cite:tabari-tarikh-abu-al-fadl J.9 s.374}. Al-Mas'udi'ye göre, olayın yaşandığı gece al-Mutawakkil'in altında bulunan halının yakılmasını emretti; halı, el-Muntasir sorduktan sonra Şiruyah ve Yezid ibn al-Walid'in heykelini taşıyordu. Mahbuba, 'Neler benim için ne güzel bir hayat var, içinde Ja'far'ı görmediğim' şarkısını söylediğinde hapsedildi {cite:muruj-al-dhahab s. 512, 515}"
  id: "Salah satu komandan tentara Turki di Samarra, ia tewas pada tahun 253 H {cite:tabari-tarikh-abu-al-fadl J.9 hlm.374}. Menurut al-Mas'udi, ia memerintahkan pembakaran karpet yang berada di bawah al-Mutawakkil pada malam kejadian, yang memuat gambar Shiruyah dan Yazid ibn al-Walid setelah al-Muntasir menanyakannya. Mahbuba dipenjara ketika ia menyanyikan, 'Betapa indahnya hidup bagiku, di mana aku tidak melihat Ja'far' {cite:muruj-al-dhahab hlm. 512, 515}"
