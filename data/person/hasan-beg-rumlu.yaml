summary:
  ar: "بطاقة أولية لحسن بيك روملو، المؤرخ والجندي الصفوي صاحب «أحسن التواريخ» في تاريخ الصفويين، توفي سنة ١٥٧٧م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Hasan Beg Rumlu, the Safavid historian and soldier author of Ahsan al-Tawarikh, d. 1577; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Hasan Beg Rumlu, el historiador y soldado safávida autor de Ahsan al-Tawarikh, fallecido en 1577; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Hasan Beg Rumlu, historien et soldat safavide auteur d'Ahsan al-Tawarikh, mort en 1577; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "حسن بیگ روملو کے لیے ڈرافٹ کارڈ، صفوی مورخ اور احسن التواریخ کے سپاہی مصنف، ڈی۔ 1577; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Safevi tarihçisi ve Safevi askeri ve 1577 yılında ölen 'Ahsan al-Tawarikh' adlı eserin yazarı Hasan Bey Rumlu'nun ön kartı; önemli şahsiyetlerin sözlükleriyle anılmakta ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan oleh Hassan Bey Rumlu, sejarawan dan prajurit Safavid serta penulis 'Ahsan al-Tawarikh' dalam sejarah Safawi, yang meninggal pada tahun 1577 M; ia dikenang oleh kamus tokoh-tokoh terkenal dan biografinya belum pernah diulas di halaman tersebut."
