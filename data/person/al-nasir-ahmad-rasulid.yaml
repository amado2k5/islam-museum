class: person
label: { ar: "الملك الناصر أحمد بن الأشرف الرسولي", en: "al-Malik al-Nasir Ahmad ibn al-Ashraf, Rasulid", fr: "al-Malik al-Nasir Ahmad ibn al-Ashraf, rassoulide", es: "al-Malik al-Nasir Ahmad ibn al-Ashraf, Rasulid", ur: "الملک النصیر احمد بن الاشرف، رسول" }
summary:
  ar: "الملك الناصر أحمد بن الأشرف إسماعيل بن الأفضل عباس صاحب اليمن استقر في المملكة بعد أبيه سنة ثلاث وثمان مئة وجرت له كائنات وكان فاجراً جائراً قال ابن حجر مات بسبب صاعقة سقطت على حصنه من زجاج فارتاع من صوتها فتوعك ثم مات في سادس عشر جمادى الآخرة سنة سبع وعشرين وثمان مئة وعلق ابن العماد قال الله تعالى ويرسل الصواعق فيصيب بها من يشاء {cite:shadharat-dhahab p. 190}."
  en: "Rasulid king of Yemen (r. 803-827) — 'dissolute and tyrannical' per Ibn Hajar, who records that he died of fright after lightning struck his glass fortress {cite:shadharat-dhahab p. 190}."
  fr: "Rasulid roi du Yémen (r. 803-827) - « dissolute et tyrannique » par Ibn Hajar, qui enregistre qu'il est mort de peur après la foudre a frappé sa forteresse de verre {cite:shadharat-dhahab p. 190}."
  es: "Rey rasulí de Yemen (r. 803-827) — 'disoluto y tiránico' según Ibn Hajar, quien registra que murió de miedo después de que un rayo impactara su fortaleza de cristal {cite:shadharat-dhahab p. 190}."
  ur: "یمن کا رسولی بادشاہ (r. 803-827) - ابن حجر کے مطابق 'منحرف اور ظالم'، جو درج کرتا ہے کہ وہ اپنے شیشے کے قلعے پر بجلی گرنے کے بعد خوفزدہ ہو کر مر گیا (حوالہ: شدھارت ذہاب صفحہ 190}۔"
  tr: "Yemen hükümdarı Kral El-Nasir Ahmed ibn el-Eşref İsmail bin el-Afdal Abbas, babasından sonra 800 Hile yılında Krallığa yerleşti. Birçok zorluk yaşadı ve kötü ve adaletsiz bir insandı. İbn Hajar şöyle dedi: Camdan yapılmış kalesine düşen bir yıldırım çarpması sonucu öldü, bu yüzden kalenin sesinden korktu ve hastalandı. Sonra 827 Hicri yılında, Cumadeliu-Ahhirah'ın on altısı ayında öldü. İbn al-İmad şöyle yorum yaptı: Allah şöyle buyurdu: 'Ve yıldırım gönderir ve istediği kişiye vurur.' {atıf:şadharat-dhahab, s. 190}."
  id: "Raja Al-Nasir Ahmad ibn al-Ashraf Ismail ibn al-Afdal Abbas, penguasa Yaman, menetap di Kerajaan setelah ayahnya pada tahun 800 H. Ia mengalami banyak penderitaan dan merupakan orang yang jahat dan tidak adil. Ibn Hajar berkata: Ia meninggal karena kilat yang jatuh ke bentengnya yang terbuat dari kaca, sehingga ia ketakutan oleh suara itu dan jatuh sakit. Kemudian ia meninggal pada tanggal keenam belas Jumada al-Akhirah tahun 827 H. Ibn al-Imad berkomentar: Allah Yang Maha Kuasa berfirman: 'Dan Dia mengirimkan petir dan menyambar siapa pun yang Dia kehendaki.' {cite:shadharat-dhahab, hlm. 190}."
