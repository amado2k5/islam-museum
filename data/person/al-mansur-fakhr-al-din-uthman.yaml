summary:
  ar: "بطاقة أولية للمنصور فخر الدين عثمان، سلطان المماليك الذي حكم قصيراً سنة ١٤٥٣م بين عهدي عثمان بن إينال وإينال؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Mansur Fakhr al-Din Uthman, the Mamluk sultan who ruled briefly in 1453 between the reigns of Uthman ibn Inal and Inal; the dynastic handbook entry is not yet checked on the page."
  fr: "Projet de carte pour al-Mansur Fakhr al-Din Uthman, le sultan mamelouk qui a régné brièvement en 1453 entre les règnes d'Uthman ibn Inal et Inal ; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  es: "Ficha preliminar para al-Mansur Fakhr al-Din Uthman, el sultán mameluco que gobernó brevemente en 1453 entre los reinados de Uthman ibn Inal e Inal; la entrada del manual dinástico aún no se ha comprobado en la página."
  ur: "المنصور فخر الدین عثمان کے لیے مسودہ کارڈ، مملوک سلطان جس نے 1453 میں عثمان ابن انال اور انال کے دور حکومت کے درمیان مختصر عرصے کے لیے حکومت کی۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1453 yılında Osman bin İnal ve İnal dönemleri arasında kısa bir süre hüküm süren Memlükler Sultanı Al-Mansur Fakhr al-Din Osman için ön bir kart; İslam Devletleri sözlüklerinde bahsedilmekte ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Al-Mansur Fakhr al-Din Uthman, Sultan Mamluk yang memerintah singkat pada tahun 1453 M antara masa pemerintahan Uthman ibn Inal dan Inal; kartu ini disebutkan dalam kamus Negara-negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
