    ar: "السيرافي أبو سعيد النحوي شرح كتاب سيبويه فظهر له في التصنيف ما لم يظهر لغيره ممن يعاني هذا الشأن، وله في النحو واللغة مصنفات."
    en: "Al-Sirafi, the grammarian Abu Sa'id, commented on Sibawayhi's Book with an insight in composition no fellow-worker in the field had shown — and wrote further works in grammar and language."
    ur: "سیرافی ابو سعید نحوی نے سیبویہ کی کتاب کی شرح کی اور تصنیف میں وہ بصیرت دکھائی جو اس فن کے اور کسی کاریگر کو حاصل نہ تھی — اور نحو و لغت میں مزید تصانیف لکھیں۔"
