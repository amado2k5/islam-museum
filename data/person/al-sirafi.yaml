summary:
  ar: "أبو سعيد الحسن بن عبد الله بن المرزبان السيرافي، النحوي اللغوي المشهور؛ شرح كتاب سيبويه فظهر له بالاطلاع والبحث في حال التصنيف ما لم يظهر لغيره ممن يعاني هذا الشأن، وصنف بعد ذلك كتاب «الإقناع» فكأنه ثمرة استفادته حال البحث والتصنيف ومات قبل إتمامه فأكمله ولده أبو محمد يوسف، وكان له ببغداد مجلس يقرأ فيه العلماء عليه حتى إن خازن دار العلم عبد السلام البصري كان من جلسائه {cite:wafayat-ayan p. 72-73}."
  en: "Abu Sa'id al-Sirafi — the celebrated grammarian whose commentary on Sibawayh's Kitab revealed things no one else in the field had seen, and whose al-Iqna' was completed by his son Abu Muhammad; his Baghdad majlis drew even the keeper of Dar al-'Ilm's library {cite:wafayat-ayan p. 72-73}."
  fr: "Abu Sa'id al-Sirafi - le célèbre grammairien dont le commentaire sur Kitab de Sibawayh a révélé des choses que personne d'autre dans le domaine n'avait vues, et dont al-Iqna' a été complété par son fils Abu Muhammad ; son majlis de Bagdad a attiré même le gardien de la bibliothèque de Dar al-'Ilm {cite:wafayat-ayan p. 72-73}."
  es: "Abu Sa'id al-Sirafi, el célebre gramático cuyo comentario sobre el Kitab de Sibawayh reveló cosas que nadie más en el campo había visto, y cuyo al-Iqna' fue completado por su hijo Abu Muhammad; su majlis de Bagdad atrajo incluso al guardián de la biblioteca de Dar al-'Ilm {cite:wafayat-ayan p. 72-73}."
  ur: "ابو سعید الصرافی - مشہور گرامر جس نے سباویہ کی کتاب پر تبصرہ کرتے ہوئے ایسی چیزیں ظاہر کیں جو میدان میں کسی اور نے نہیں دیکھی تھیں، اور جن کا الاقنا ان کے بیٹے ابو محمد نے مکمل کیا تھا۔ ان کی بغداد کی مجلس نے دارالعلم کے کتب خانہ کے محافظ کو بھی متوجہ کیا۔ 72-73}۔"
  tr: "Ünlü dilbilimci ve dilbilimci Ebu Said el-Hasan bin Abdullah ibn el-Marzuban el-Sirafi; Sibawayh'in kitabını açıkladı; bu kitap, derleme sürecinde yaptığı çalışma ve araştırmalarla kendisine fark etti, ancak bu konuda mücadele eden diğerleri tarafından bulunamadı. Daha sonra, araştırma ve derleme sırasında verdiği faydanın meyvesiymiş gibi 'El-İkna' adlı kitabı yazdı. Kitabı tamamlamadan öldü ve oğlu Ebu Muhammed Yusuf tamamladı. Bağdat'ta alimlerin ona kitap okuyabildiği bir toplantı düzenledi; öyle ki Dar al-Ilm Abd al-Salam al-Basri de onun katılımcılarından biriydi {atıf:wafayat-ayan, s. 72-73}."
  id: "Abu Sa'id al-Hasan ibn Abdullah ibn al-Marzuban al-Sirafi, ahli tata bahasa dan ahli bahasa terkenal; ia menjelaskan buku Sibawayh, yang menjadi jelas baginya melalui studi dan penelitiannya dalam proses penyusunan, yang tidak ditemukan oleh orang lain yang sedang berjuang dengan masalah ini. Kemudian, ia menulis buku 'Al-Iqna', seolah-olah buku itu adalah hasil dari manfaatnya selama penelitian dan penyusunan. Ia meninggal sebelum selesai, dan putranya Abu Muhammad Yusuf menyelesaikannya. Ia mengadakan pertemuan di Baghdad di mana para ulama dapat membacakan untuknya, sampai-sampai bendahara Dar al-Ilm Abd al-Salam al-Basri menjadi salah satu pesertanya {cite:wafayat-ayan, hlm. 72-73}."
