summary:
  ar: "يوسف نابي (1642 – 13 نيسان 1712) شاعر ديوان عثماني وُلد في أورفة، انتقل إلى إسطنبول في الرابعة والعشرين فذاع صيته، وصحب الصدر الأعظم مصطفى باشا ولازمه في حملة لهستان سنة 1672 فكتب «فتحنامه كمانيچه». حجّ سنة 1679 ودوّن رحلته في «تحفة الحرمين»، ثم أقام نحو 25 سنة في حلب حيث نظم «خيرية» سنة 1701 لابنه أبي الخير، وهو ديوان نصائح صار أشهر أعماله. عاد إلى إسطنبول مع بلطجي محمد باشا وتولّى أمانة دار الضرب والمقابلة، ومات فيها ودُفن في مقبرة قرجه أحمد بأسكدار."
  en: "Yusuf Nabi (1642 – 13 April 1712) was an Ottoman Divan poet born at Urfa who came to Istanbul at twenty-four and made his name, joined Sultan Mehmed IV's court circles and the 1672 Polish campaign, of which he wrote the Fetihname-i Kamaniçe. He made the Hajj in 1679 and recorded it in the Tuhfetü'l-Harameyn, then lived some twenty-five years in Aleppo, where in 1701 he composed the Hayriyye, a book of counsel for his son Ebulhayr that became his most famous work. He returned to Istanbul with Baltacı Mehmed Pasha, held the mint superintendency and the chief registrarship, died there and was buried in Karacaahmet cemetery in Üsküdar."
  ur: "یوسف نبی (1642ء – 13 اپریل 1712ء) عثمانی دیوان شاعر تھے، اورفہ میں پیدا ہوئے، چوبیس سال کی عمر میں استنبول آئے اور نام پایا، 1672ء کی پولینڈ مہم میں شریک ہو کر «فتح نامۂ کمانیچہ» لکھی۔ 1679ء میں حج کیا اور سفرنامہ «تحفۃ الحرمین» لکھا، پھر تقریباً 25 سال حلب میں رہے جہاں 1701ء میں اپنے بیٹے ابوالخیر کے لیے نصائح کی کتاب «خیریہ» نظم کی، جو ان کی مشہور ترین تصنیف بنی۔ بلتاجی محمد پاشا کے ساتھ استنبول واپس آئے، دارالضرب کی امانت اور باش مقالہ جی کا عہدہ پایا، وہیں وفات پائی اور اسکدار کے قراجہ احمد قبرستان میں دفن ہوئے۔"

