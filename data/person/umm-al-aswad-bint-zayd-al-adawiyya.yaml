gender: female
roles: [mystic]
summary:
  ar: "عابدة من بني عدي بالبصرة أرضعتها معاذة العدوية؛ يروي ابن الجوزي في «صفة الصفوة» وصية معاذة لها بأكل الحلال، وقولها: ما أكلت شبهة إلا فاتتني فريضة أو ورد من أورادي."
  en: "A devout woman of Banu Adi in Basra who was nursed by Mu'adha al-Adawiyya; Ibn al-Jawzi's Sifat al-Safwa records Mu'adha's charge to her to eat only what is lawful, and her saying that whenever she ate something doubtful she missed an obligatory prayer or one of her devotions."
  ur: "بصرہ کے بنو عدی کی ایک عابدہ جنہیں معاذہ العدویہ نے دودھ پلایا تھا؛ ابن الجوزی کی «صفۃ الصفوہ» میں معاذہ کی انہیں حلال کھانے کی وصیت اور ان کا یہ قول مذکور ہے کہ جب بھی انہوں نے مشتبہ چیز کھائی تو کوئی فرض یا وِرد چھوٹ گیا۔"
  es: "Una mujer devota de Banu Adi en Basora que fue amamantada por Mu'adha al-Adawiyya; el Sifat al-Safwa de Ibn al-Jawzi registra la exhortación de Mu'adha a que comiera solo lo lícito, y ella diciendo que cada vez que comía algo dudoso, se perdía una oración obligatoria o una de sus devociones."
  fr: "Une femme pieuse de Banu Adi à Bassora, nourrie par Mu'adha al-Adawiyya; le Sifat al-Safwa d'Ibn al-Jawzi rapporte que Mu'adha lui avait enjoint de ne manger que ce qui était licite, et qu'elle disait que chaque fois qu'elle mangeait quelque chose de douteux, elle manquait une prière obligatoire ou l'une de ses dévotions."
  tr: "Basra'daki Banu 'Adi'den bir ibadet eden, Mu'adh al-'Adawiya tarafından emzirilen bir ibadet eden; İbn al-Jawzi, 'Sifat al-Safwa'da Mu'adh'ın ona yasal yemesini öğütlediğini ve şöyle dediğini anlatır: 'Hiçbir şüphe yemedim, sadece bir zorunlu eylemi ya da kurtlarımın gülünü kaçırdım.'"
  id: "Seorang pemuja dari Banu 'Adi di Basra, dirawat oleh Mu'adh al-'Adawiya; Ibn al-Jawzi menceritakan dalam 'Sifat al-Safwa' nasihat Mu'adh kepadanya untuk makan dengan sah, dan dia berkata: 'Aku tidak pernah makan keraguan kecuali aku melewatkan satu tindakan wajib atau sepotong mawar dari serigalaku.'"
