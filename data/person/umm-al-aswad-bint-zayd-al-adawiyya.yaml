summary:
  ar: "عابدة من بني عدي بالبصرة أرضعتها معاذة العدوية؛ يروي ابن الجوزي في «صفة الصفوة» وصية معاذة لها بأكل الحلال، وقولها: ما أكلت شبهة إلا فاتتني فريضة أو ورد من أورادي."
  en: "A devout woman of Banu Adi in Basra who was nursed by Mu'adha al-Adawiyya; Ibn al-Jawzi's Sifat al-Safwa records Mu'adha's charge to her to eat only what is lawful, and her saying that whenever she ate something doubtful she missed an obligatory prayer or one of her devotions."
  ur: "بصرہ کے بنو عدی کی ایک عابدہ جنہیں معاذہ العدویہ نے دودھ پلایا تھا؛ ابن الجوزی کی «صفۃ الصفوہ» میں معاذہ کی انہیں حلال کھانے کی وصیت اور ان کا یہ قول مذکور ہے کہ جب بھی انہوں نے مشتبہ چیز کھائی تو کوئی فرض یا وِرد چھوٹ گیا۔"
