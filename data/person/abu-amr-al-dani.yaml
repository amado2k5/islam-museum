summary:
  ar: "عثمان بن سعيد الداني أبو عمرو، إمام علم القراءات ومن حفاظ الحديث، من دانية بالأندلس ⁦(٣٧١–٤٤٤هـ)⁩، صاحب «التيسير» وأكثر من مئة تصنيف."
  en: "Uthman ibn Sa'id al-Dani Abu Amr of Denia, master of the Qur'anic readings and hadith (371–444/981–1053), author of al-Taysir and over a hundred works."
  fr: "Uthman ibn Sa'id al-Dani, Abu Amr de Denia, maître des lectures coraniques et du hadith (371–444/981–1053), auteur d'al-Taysir et de plus d'une centaine d'ouvrages."
  es: "Uthman ibn Sa'id al-Dani Abu Amr de Denia, maestro de las lecturas coránicas y los hadices (371–444/981–1053), autor de al-Taysir y más de cien obras."
  ur: "عثمان بن سعید الدانی ابو عمرو دینیہ، قرآنی پڑھنے اور حدیث کے ماہر (371-444/981-1053)، التیسر کے مصنف اور سو سے زیادہ کام۔"
  tr: "Osman ibn Said el-Dani Ebu Amr, okuma ilminin imamı ve hadis ezbercilerinden biri, Endülüs'ün Denia şehrinden (371-444 Hicri), \"El-Taysir\" adlı eserin ve yüzden fazla sınıflandırmanın yazarı."
  id: "Uthman ibn Saeed al-Dani Abu Amr, Imam ilmu bacaan dan salah satu penghafal Hadits, dari Denia di Andalusia (371–444 H), penulis kitab “Al-Taysir” dan lebih dari seratus klasifikasi."
