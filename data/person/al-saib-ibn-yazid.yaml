id: person/al-saib-ibn-yazid
class: person
label: { ar: "السائب بن يزيد", en: "al-Sa'ib ibn Yazid", fr: "al-Sa'ib ibn Yazid", ur: "السائب بن يزيد", es: "al-Sa'ib ibn Yazid" }
summary:
  ar: "صحابي مدني شهد مع النبي وهو غلام؛ حكت خالته عنه أنها ذهبت به إلى النبي وقالت إن ابن أختي وجع فمسح رأسه ودعا له بالبركة ثم توضأ فشرب من وضوئه وقام خلف ظهره فرأى خاتم النبوة بين كتفيه مثل زر الحجلة {cite:sahih-al-bukhari 190}. وروى عن النبي ما يزيد على الثلاثين حديثاً."
  en: "A Medinan Companion who saw the Prophet as a boy and reported the seal of prophethood between his shoulders {cite:sahih-al-bukhari 190}; he narrated over thirty hadiths."
  fr: "Un Compagnon de Médine qui a vu le Prophète comme un garçon et a rapporté le sceau de la prophétie entre ses épaules {cite:sahih-al-bukhari 190}Il a rapporté plus de trente hadiths."
  ur: "مدینی صحابی جنہوں نے بچپن میں نبی کو دیکھا اور ان کے کندھوں کے درمیان مہرِ نبوت کی خبر دی؛ مدینہ کے آخری فوت ہونے والے صحابی میں سے۔"
  es: "Un compañero de Medina que vio al Profeta cuando era niño e informó del sello de la profecía entre sus hombros {cita:sahih-al-bukhari 190}; narró más de treinta hadices."
  tr: "Medine'den bir sahabe, Peygamber'e çocukken tanıklık etti; teyzesi ona onu Peygamber'e götürdüğünü ve yeğenimin acı çektiğini söyledi, bunun üzerine başını sildi ve bereketini diledi, ardından abdest aldı, temizliğinden içti, sırtında durdu ve omuzlarında bir düğme gibi Peygamberlik Mührünü gördü {cit:sahih-al-bukhari 190}. Peygamber'den otuzdan fazla hadis rivayet etti."
  id: "Seorang sahabat dari Madinah bersaksi bersama Nabi ketika ia masih kecil; bibinya memberitahunya bahwa ia telah membawanya kepada Nabi dan berkata bahwa keponakanku sedang kesakitan, maka ia mengelap kepalanya dan berdoa memohon berkah, lalu melakukan wudhu, minum dari wudhu, berdiri di belakang punggungnya, dan melihat Segel Kenabian di antara bahunya seperti kancing {cite:sahih-al-bukhari 190}. Ia menceritakan lebih dari tiga puluh hadis dari Nabi."
