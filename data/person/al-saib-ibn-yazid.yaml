summary:
  ar: "صحابي مدني شهد مع النبي وهو غلام؛ حكت خالته عنه أنها ذهبت به إلى النبي وقالت إن ابن أختي وجع فمسح رأسه ودعا له بالبركة ثم توضأ فشرب من وضوئه وقام خلف ظهره فرأى خاتم النبوة بين كتفيه مثل زر الحجلة {cite:sahih-al-bukhari 190}. وروى عن النبي ما يزيد على الثلاثين حديثاً."
  en: "A Medinan Companion who saw the Prophet as a boy and reported the seal of prophethood between his shoulders {cite:sahih-al-bukhari 190}; he narrated over thirty hadiths."
