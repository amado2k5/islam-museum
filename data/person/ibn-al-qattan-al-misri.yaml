summary:
  ar: "شمس الدين ابن القطان المصري الشافعي؛ كان أبوه قطاناً وأخوه كذلك واشتغل بالعلم ومهر ولازم الشيخ بهاء الدين بن عقيل وصاهره على بنت له من جارية وسكن مصر ودرس وأفتى وصنف، قال ابن حجر قرأت عليه وأجاز لي وكان ماهراً في القراءات والعربية والحساب وناب في الحكم بأخيه فتهالك على ذلك إلى أن مات، توفي في أواخر شوال عن نيف وثمانين سنة {cite:shadharat-dhahab p. 112}."
  en: "Shams al-Din Ibn al-Qattan (d. ~82) — son and brother of cotton-merchants who excelled instead in learning; pupil-son-in-law of Ibn 'Aqil, Ibn Hajar's own teacher ('I read on him and he licensed me'); wore himself out deputising the judgeship for his brother; died late Shawwal 812 {cite:shadharat-dhahab p. 112}."
