names:
  - { value: "شمس الدين محمد بن علي بن محمد بن عمر بن عيسى المصري الشافعي المعروف بابن القطان", kind: full }
gender: male
summary:
  ar: "شمس الدين ابن القطان المصري الشافعي؛ كان أبوه قطاناً وأخوه كذلك واشتغل بالعلم ومهر ولازم الشيخ بهاء الدين بن عقيل وصاهره على بنت له من جارية وسكن مصر ودرس وأفتى وصنف، قال ابن حجر قرأت عليه وأجاز لي وكان ماهراً في القراءات والعربية والحساب وناب في الحكم بأخيه فتهالك على ذلك إلى أن مات، توفي في أواخر شوال عن نيف وثمانين سنة {cite:shadharat-dhahab p. 112}."
  en: "Shams al-Din Ibn al-Qattan (d. ~82) — son and brother of cotton-merchants who excelled instead in learning; pupil-son-in-law of Ibn 'Aqil, Ibn Hajar's own teacher ('I read on him and he licensed me'); wore himself out deputising the judgeship for his brother; died late Shawwal 812 {cite:shadharat-dhahab p. 112}."
  es: "Shams al-Din Ibn al-Qattan (m. ~82) — hijo y hermano de comerciantes de algodón que sobresalió en el aprendizaje; discípulo y yerno de Ibn 'Aqil, el propio maestro de Ibn Hajar ('Estudié con él y me autorizó'); se agotó sustituyendo a su hermano en el cargo de juez; murió a finales de Shawwal 812 {cita: shadharat-dhahab p. 112}."
  fr: "Shams al-Din Ibn al-Qattan (d. ~82) — fils et frère de marchands de coton qui excellait plutôt dans l'apprentissage; élève-gendre d'Ibn 'Aqil, le propre maître d'Ibn Hajar (« J'ai étudié avec lui et il m'a autorisé »); s'est épuisé à suppléer son frère à la fonction de juge; mort à la fin du Shawwal 812 {cite:shadharat-dhahab p. 112}."
  ur: "شمس الدین ابن القطان ⁦(متوفی ~82)⁩ - کپاس کے بیوپاریوں کا بیٹا اور بھائی جنہوں نے سیکھنے کی بجائے مہارت حاصل کی۔ ابن عاقل کے شاگرد، ابن حجر کے اپنے استاد ⁦('میں نے اس پر پڑھا اور اس نے مجھے لائسنس دیا')⁩؛ اپنے بھائی کے لیے جج کا عہدہ سونپتے ہوئے خود کو باہر پہنا دیا۔ متوفی شوال 812۔ 112}۔"
  tr: "Şemseddin İbn el-Kattan el-Masri el-Şafii; babası pamuk tüccarı ve aynı zamanda kardeşiydi. Bilgiyle meşguldü, çeyiz ödüyordu ve Şeyh Baha'ddin ibn Aqil ile yakındı; nişanlısı onu bir köle kızdan olan kızla evlendirdi. Mısır'da yaşadı, ders verdi, fetva verdi ve kitaplar yazdı. İbn Hacar şöyle dedi: Onunla çalıştım ve bunu yapma yetkisi vardı. Okuma, Arapça ve aritmetik konusunda yetenekliydi ve kardeşi tarafından yargıç olarak atandı, ancak bu durumda öldü ve öldü. Seksen yaşından büyük bir yaşta Şavval'ın sonlarında vefat etti {atıf: shadharat-dhahab, s. 112}."
  id: "Shams al-Din Ibn al-Qattan al-Masri al-Shafi'i; ayahnya adalah pedagang kapas dan juga saudaranya. Ia terlibat dalam ilmu pengetahuan, membayar mas kawin, dan dekat dengan Sheikh Baha' al-Din ibn Aqil, dan tunangannya menikahkannya dengan seorang putri dari seorang budak perempuan. Ia tinggal di Mesir, mengajar, mengeluarkan fatwa, dan menulis buku. Ibn Hajar berkata: Saya belajar dengannya, dan ia diberi wewenang untuk melakukannya. Ia mahir membaca, Arab, dan berhitung, dan diangkat sebagai hakim oleh saudaranya, tetapi ia meninggal dalam keadaan itu hingga meninggal. Ia meninggal pada akhir Shawwal pada usia lebih dari delapan puluh {cite:shadharat-dhahab, hlm. 112}."
