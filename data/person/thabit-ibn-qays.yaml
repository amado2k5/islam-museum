summary:
  ar: 'خطيب الأنصار؛ خطب لما قدم النبي المدينة فقال: «نمنعك مما نمنع منه أنفسنا وأولادنا، فما لنا؟» قال: «الجنة»، وأول مشاهده أحد، وبشره النبي بالجنة، واستُشهد يوم اليمامة.'
  en: The orator of the Ansar; when the Prophet arrived in Medina he spoke, saying 'We will protect you as we protect ourselves and our children; what do we get?', and the Prophet answered 'Paradise'; his first campaign was Uhud, the Prophet
    gave him the good news of Paradise, and he was killed at al-Yamama.
