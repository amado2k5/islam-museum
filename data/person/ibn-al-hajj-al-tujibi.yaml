id: person/ibn-al-hajj-al-tujibi
class: person
label: { ar: "ابن الحاج التجيبي" }
names:
  - { value: "قاضي الجماعة أبو عبد الله محمد بن أحمد بن خلف التجيبي القرطبي المالكي", kind: full }
summary:
  ar: "قاضي الجماعة أبو عبد الله محمد بن أحمد بن خلف التجيبي القرطبي المالكي؛ روى عن أبي علي الغساني وطائفة، وكان من جلّة العلماء وكبارهم متبحراً في العلوم والآداب، ولم يكن أحد في زمانه أطلب للعلم منه مع الدين والخشوع؛ قتل ظلماً بجامع قرطبة في صلاة الجمعة سنة تسع وعشرين وخمسمائة وله إحدى وسبعون سنة {cite:shadharat-dhahab p. 573-574}."
  en: "Qadi al-jama'a Abu Abdallah Muhammad ibn Ahmad ibn Khalaf al-Tujibi of Cordoba, Maliki; transmitted from Abu Ali al-Ghassani and others — one of the great elders of learning, deep in sciences and letters, none of his age more devoted to seeking knowledge, with piety and humility; killed unjustly in Cordoba's mosque during the Friday prayer in 529 at seventy-one {cite:shadharat-dhahab p. 573-574}."
  es: "Qadi al-jama'a Abu Abdallah Muhammad ibn Ahmad ibn Khalaf al-Tujibi de Córdoba, Maliki; transmitido por Abu Ali al-Ghassani y otros: uno de los grandes ancianos del saber, profundo en ciencias y letras, ninguno de su época más dedicado a la búsqueda del conocimiento, con piedad y humildad; asesinado injustamente en la mezquita de Córdoba durante la oración del viernes en 529 a los setenta y un años {cite:shadharat-dhahab p. 573-574}."
  fr: "Qadi al-jama'a Abu Abdallah Muhammad ibn Ahmad ibn Khalaf al-Tujibi de Cordoue, Maliki; transmis par Abu Ali al-Ghassani et d'autres — l'un des grands anciens du savoir, versé dans les sciences et les lettres, aucun de son époque plus dévoué à la recherche du savoir, avec piété et humilité; tué injustement dans la mosquée de Cordoue pendant la prière du vendredi en 529 à l'âge de soixante-et-onze ans {cite: shadharat-dhahab p. 573-574}."
  ur: "قادی الجماعۃ ابو عبد اللہ محمد بن احمد بن خلف الطجیبی آف قرطبہ، مالکی؛ ابو علی الغسانی اور دیگر سے نقل کیا گیا ہے - علم کے عظیم بزرگوں میں سے ایک، علوم اور خطوط میں گہرا، ان کی عمر میں سے کسی نے علم حاصل کرنے کے لیے، تقویٰ اور عاجزی کے ساتھ وقف نہیں کیا۔ قرطبہ کی مسجد میں 529 میں نماز جمعہ کے دوران اکہتر میں ناحق قتل کیا گیا 573-574}۔"
  tr: "Topluluğun hakimi Ebu Abdullah Muhammed bin Ahmed ibn Khalaf el-Tujibi el-Kurtubi el-Maliki, Ebu Ali el-Ghassani ve bir grubundan rivayet etti. O, bilim ve edebiyatta bilgili seçkin ve seçkin alimler arasındaydı. Zamanında kimse din ve alçakgönüllülükle ondan daha çok bilgi aramadı. Beş yüz yirmi dokuzuncu Hicri yılında, Cordoba camiasında cuma namazı sırasında haksız yere öldürüldü ve yetmiş bir yaşındaydı {cite:shadharat-dhahab, s. 573-574}."
  id: "Hakim komunitas, Abu Abdullah Muhammad ibn Ahmad ibn Khalaf al-Tujibi al-Qurtubi al-Maliki, menceritakan dari Abu Ali al-Ghassani dan kelompoknya. Ia termasuk ulama terkemuka dan terkemuka, mahir dalam ilmu pengetahuan dan sastra. Tidak ada yang lebih banyak mencari ilmu di zamannya selain dirinya dengan agama dan kerendahan hati. Ia dibunuh secara tidak adil di masjid Cordoba saat salat Jumat tahun lima ratus dua puluh sembilan H, dan usianya tujuh puluh satu tahun {cite:shadharat-dhahab, hlm. 573-574}."
