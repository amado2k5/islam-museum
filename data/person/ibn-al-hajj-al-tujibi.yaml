summary:
  ar: "قاضي الجماعة أبو عبد الله محمد بن أحمد بن خلف التجيبي القرطبي المالكي؛ روى عن أبي علي الغساني وطائفة، وكان من جلّة العلماء وكبارهم متبحراً في العلوم والآداب، ولم يكن أحد في زمانه أطلب للعلم منه مع الدين والخشوع؛ قتل ظلماً بجامع قرطبة في صلاة الجمعة سنة تسع وعشرين وخمسمائة وله إحدى وسبعون سنة {cite:shadharat-dhahab p. 573-574}."
  en: "Qadi al-jama'a Abu Abdallah Muhammad ibn Ahmad ibn Khalaf al-Tujibi of Cordoba, Maliki; transmitted from Abu Ali al-Ghassani and others — one of the great elders of learning, deep in sciences and letters, none of his age more devoted to seeking knowledge, with piety and humility; killed unjustly in Cordoba's mosque during the Friday prayer in 529 at seventy-one {cite:shadharat-dhahab p. 573-574}."
