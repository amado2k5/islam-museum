id: person/dhu-al-kala
class: person
label: { ar: "ذو الكلاع ملك حمير", en: "Dhu'l-Kala', king of Himyar" }
summary:
  ar: "ملك حمير وفد على أبي بكر ومعه ألف عبد دون من كان معه من عشيرته وعليه التاج والحلل والبرود، فلما شاهد من أبي بكر ما عليه من الشملة والعباءة والزهد والتواضع ألقى ما كان عليه وتزيا بزيه حتى رؤي يوماً في سوق من أسواق المدينة وعلى كتفيه جلد شاة، ففزعت عشيرته فقالوا قد فضحتنا بين المهاجرين والأنصار فقال أفأردتم مني أن أكون ملكاً جباراً في الجاهلية جباراً في الإسلام لا ها الله لا تكون طاعة الرب إلا بالتواضع لله والزهد في هذه الدنيا {cite:muruj-al-dhahab p. 596}. وقيل قتل بصفين مع هاشم بن عتبة المرقال وكان صاحب لواء ذي الكلاع رجلاً من عذرة يقول أثبت فإني لست من فرعي مضر نحن اليمانيون ما فينا ضجر {cite:muruj-al-dhahab p. 674}"
  en: "The crowned Himyarite king who came with a thousand slaves and brocade, saw Abu Bakr's rough cloak, cast off his own and took his fashion — till his clan found him in Medina's market in a sheepskin, and heard his answer: 'Shall I be a tyrant in Jahiliyya and a tyrant in Islam? Worship is only through humility' {cite:muruj-al-dhahab p. 596}."
