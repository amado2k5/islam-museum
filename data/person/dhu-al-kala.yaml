summary:
  ar: "ملك حمير وفد على أبي بكر ومعه ألف عبد دون من كان معه من عشيرته وعليه التاج والحلل والبرود، فلما شاهد من أبي بكر ما عليه من الشملة والعباءة والزهد والتواضع ألقى ما كان عليه وتزيا بزيه حتى رؤي يوماً في سوق من أسواق المدينة وعلى كتفيه جلد شاة، ففزعت عشيرته فقالوا قد فضحتنا بين المهاجرين والأنصار فقال أفأردتم مني أن أكون ملكاً جباراً في الجاهلية جباراً في الإسلام لا ها الله لا تكون طاعة الرب إلا بالتواضع لله والزهد في هذه الدنيا {cite:muruj-al-dhahab p. 596}. وقيل قتل بصفين مع هاشم بن عتبة المرقال وكان صاحب لواء ذي الكلاع رجلاً من عذرة يقول أثبت فإني لست من فرعي مضر نحن اليمانيون ما فينا ضجر {cite:muruj-al-dhahab p. 674}"
  en: "The crowned Himyarite king who came with a thousand slaves and brocade, saw Abu Bakr's rough cloak, cast off his own and took his fashion — till his clan found him in Medina's market in a sheepskin, and heard his answer: 'Shall I be a tyrant in Jahiliyya and a tyrant in Islam? Worship is only through humility' {cite:muruj-al-dhahab p. 596}."
  es: "El rey himyarita coronado, que llegó con mil esclavos y brocados, vio el tosco manto de Abu Bakr, se deshizo del suyo y adoptó su estilo, hasta que su clan lo encontró en el mercado de Medina vestido con una piel de oveja y escuchó su respuesta: \"¿Acaso seré un tirano en la época preislámica y un tirano en el Islam? La adoración solo se alcanza mediante la humildad\" {cite:muruj-al-dhahab p. 596}."
  fr: "Le roi himyarite couronné, venu avec mille esclaves et du brocart, vit le manteau grossier d'Abu Bakr, abandonna le sien et adopta sa mode — jusqu'à ce que son clan le retrouve au marché de Médine vêtu d'une peau de mouton et entende sa réponse: « Dois-je être un tyran dans la Jahiliyya et un tyran dans l'Islam ? Le culte ne s'obtient que par l'humilité » {cite: muruj-al-dhahab p. 596}."
  ur: "تاج پوش ہماری بادشاہ جو ہزار غلاموں کے ساتھ آیا تھا، اس نے ابوبکر کی کھردری چادر دیکھی، خود کو اتار دیا اور اپنا فیشن لے لیا، یہاں تک کہ اس کے قبیلے نے اسے مدینہ کے بازار میں بھیڑ کی چمڑی میں پایا، اور اس کا جواب سنا: کیا میں جاہلیت میں ظالم اور اسلام میں ظالم رہوں؟ عبادت صرف عاجزی سے ہوتی ہے۔ 596}۔"
