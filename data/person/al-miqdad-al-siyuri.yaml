summary:
  ar: "مقداد بن عبد الله السيوري الحلي الأسدي، فقيه إمامي من تلاميذ الشهيد الأول، توفي في النجف سنة 826 هـ الموافقة 1423 م، صاحب «كنز العرفان في فقه القرآن» و«إرشاد الطالبين»."
  en: "Miqdad ibn Abdallah al-Siyuri al-Hilli, an Imami (Twelver) jurist and pupil of al-Shahid al-Awwal, who died in Najaf in 826 AH, 1423 CE; author of Kanz al-'Irfan on the jurisprudence of the Qur'an and of Irshad al-Talibin."
  fr: "Miqdad ibn Abdallah al-Siyuri al-Hilli, un juriste imami (douze) et élève d'al-Shahid al-Awwal, mort à Najaf en 826 de l’hégire, 1423 de notre ère ; auteur de Kanz al-'Irfan sur la jurisprudence du Coran et d'Irshad al-Talibin."
  es: "Miqdad ibn Abdallah al-Siyuri al-Hilli, jurista imamí (duodecimano) y discípulo de al-Shahid al-Awwal, que murió en Najaf en el año 826 de la Hégira (1423 d. C.); autor de Kanz al-'Irfan sobre la jurisprudencia del Corán y de Irshad al-Talibin."
  ur: "مقداد بن عبداللہ السیوری الحلی، امامی ⁦(بارہ)⁩ فقیہ اور الشہد الاول کے شاگرد، جن کا انتقال نجف میں 826 ہجری، 1423 عیسوی میں ہوا؛ فقہ القرآن اور ارشاد الطالبین پر کنز العرفان کے مصنف۔"
  tr: "Miqdad bin Abdullah Al-Sayyuri Al-Hilli Al-Asadi, İmam bir hukukçu ve İlk Şehit'in öğrencisiydi. 826 Hicri yılında (1423 M.S.'ye denk gelir) Necef'te öldü. \"Kanz al-Irfan fi Fiqh al-Qur'an\" ve \"Irshad al-Talibin\" adlı eserlerin yazarıydı."
  id: "Miqdad bin Abdullah Al-Sayyuri Al-Hilli Al-Asadi adalah seorang ahli hukum Imami dan murid Syuhada Pertama. Ia meninggal di Najaf pada tahun 826 H (sesuai dengan tahun 1423 M). Ia adalah penulis \"Kanz al-Irfan fi Fiqh al-Qur'an\" dan \"Irshad al-Talibin.\""
