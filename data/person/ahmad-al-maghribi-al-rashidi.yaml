summary:
  ar: "أحمد بن عبد الرزاق بن محمد بن أحمد، المشهور بالمغربي الرشيدي، مغربي الأصل من أهل رشيد بمصر، ولد بها وتوفي فيها. حفظ القرآن ببلده، ثم قدم القاهرة وأخذ عن شيوخ كثيرين بالأزهر، ولازم الشبراملسي، ورجع إلى بلده فصار شيخ الشافعية بها. من مؤلفاته حاشية على شرح المنهاج للرملي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  en: "Ahmad ibn Abd al-Razzaq ibn Muhammad ibn Ahmad, known as al-Maghribi al-Rashidi, of Moroccan origin from Rashid in Egypt, where he was born and died. He memorised the Qur'an in his town, studied in Cairo at al-Azhar with many teachers, and was a close pupil of al-Shabramallisi. Back home he became the shaykh of the Shafi'is there. His works include a gloss on al-Ramli's commentary on al-Minhaj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
