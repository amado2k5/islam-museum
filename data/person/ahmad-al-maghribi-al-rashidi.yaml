summary:
  ar: "أحمد بن عبد الرزاق بن محمد بن أحمد، المشهور بالمغربي الرشيدي، مغربي الأصل من أهل رشيد بمصر، ولد بها وتوفي فيها. حفظ القرآن ببلده، ثم قدم القاهرة وأخذ عن شيوخ كثيرين بالأزهر، ولازم الشبراملسي، ورجع إلى بلده فصار شيخ الشافعية بها. من مؤلفاته حاشية على شرح المنهاج للرملي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  en: "Ahmad ibn Abd al-Razzaq ibn Muhammad ibn Ahmad, known as al-Maghribi al-Rashidi, of Moroccan origin from Rashid in Egypt, where he was born and died. He memorised the Qur'an in his town, studied in Cairo at al-Azhar with many teachers, and was a close pupil of al-Shabramallisi. Back home he became the shaykh of the Shafi'is there. His works include a gloss on al-Ramli's commentary on al-Minhaj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  fr: "Ahmad ibn Abd al-Razzaq ibn Muhammad ibn Ahmad, connu comme al-Maghribi al-Rashidi, d'origine marocaine, était de Rashid en Égypte, où il naquit et mourut. Il mémorisa le Coran dans sa ville, étudia au Caire à al-Azhar auprès de nombreux maîtres et fut un proche élève d'al-Shabramallisi. De retour chez lui, il devint le cheikh des chaféites de la ville. Ses œuvres comprennent une glose du commentaire d'al-Ramli sur al-Minhaj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
  es: "Ahmad ibn Abd al-Razzaq ibn Muhammad ibn Ahmad, conocido como al-Maghribi al-Rashidi, era de origen marroquí y provenía de Rashid, Egipto, donde nació y murió. Memorizó el Corán en su ciudad natal, estudió en El Cairo, en al-Azhar, con numerosos maestros, y fue un discípulo cercano de al-Shabramallisi. De regreso a su tierra natal, se convirtió en el shaykh de los shafi'ís. Entre sus obras se incluye una glosa sobre el comentario de al-Ramli a al-Minhaj. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1645}"
