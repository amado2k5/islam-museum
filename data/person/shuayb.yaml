label: { ar: "شعيب", en: "Shu'ayb", es: "Shu'ayb", fr: "Shu'ayb", ur: "شعیب" }
summary:
  ar: "شعيب بن نويل بن رعويل بن مر بن عنقاء بن مدين بن إبراهيم، نبي مدين الذي زوجه موسى ابنته، دعا قومه فكذبوه فوعدهم بعذاب يوم الظلة في ملك كلمن من ملوك بني المحض، وانحاز بمن آمن معه إلى الأيكة وهي غيضة نحو مدين، فلما اشتد الحر على المكذبين طلبوه وأخرجوه من مكانهم فجعل الله السحابة الظليلة عليهم ناراً، وهو غير شعيب بن مهدم نبي حضورا وبينهما مئون من السنين، وكان بين موسى والمسيح ألف نبي {cite:muruj-al-dhahab p. 459, 464}."
  en: "The prophet of Madyan, son-in-law-by-marriage to Moses, whose people expelling him drew the canopy of fire in Kalamn's reign — distinct from Shu'ayb ibn Mihdam of Banu Hudura by centuries, in a span al-Mas'udi fills with a thousand prophets between Moses and Christ {cite:muruj-al-dhahab p. 459, 464}."
  es: "El profeta de Madyan, yerno político de Moisés, cuyo pueblo, al expulsarlo, dibujó el dosel de fuego durante el reinado de Kalamn, distinto de Shu'ayb ibn Mihdam de Banu Hudura por siglos, en un lapso que al-Mas'udi llena con mil profetas entre Moisés y Cristo {cite:muruj-al-dhahab p. 459, 464}."
  fr: "Le prophète de Madyan, gendre par mariage de Moïse, dont le peuple l'expulsa dessina le dais de feu sous le règne de Kalamn — distinct de Shu'ayb ibn Mihdam de Banu Hudura par des siècles, dans un intervalle qu'al-Mas'udi remplit de mille prophètes entre Moïse et le Christ {cite:muruj-al-dhahab p. 459, 464}."
  ur: "مدین کے نبی، داماد کی شادی موسیٰ سے ہوئی، جس کے لوگوں نے اسے نکال کر کالمن کی بادشاہی میں آگ کا سائبان کھینچا - جو صدیوں کے حساب سے بنو ہدورہ کے شعیب بن محدم سے ممتاز ہے، ایک عرصے میں المسعودی ایک ہزار پیغمبروں سے بھرا ہوا ہے۔ 459، 464}۔"
  tr: "Şuayb ibn Nu'il ibn Ra'wil ibn Ra'wil ibn Murr ibn Anqa ibn Midian ibn İbrahim, Midyan'ın peygamberi, Musa'nın kızını ona evlendirdiği için halkını çağırdı ama onu reddetti. Banu al-Mahd'ın her kralının krallığında Gölge Günü cezasını onlara vaat etti. Kendisiyle birlikte inananların yanında Midian yakınlarındaki bir ghidah olan İsk'e destek oldu. İnkarcılara karşı ateş arttığında, onu aradılar ve yerlerinden kovdular, böylece Allah üzerlerindeki gölge bulutu ateşe çevirdi. O, Şuayb ibn Mahdham'ın peygamberi değildi, bir peygamber değildi ve aralarında yüz yıl vardı. Musa ile Mesih arasında bin peygamber vardı {cite:muruj-al-dhahab s. 459, 464}."
  id: "Shu'ayb ibn Nu'il ibn Ra'wil ibn Murr ibn Anqa ibn Midian ibn Ibrahim, nabi Midian, yang Musa menikahkan putrinya kepadanya, memanggil kaumnya tetapi menolaknya. Ia menjanjikan hukuman pada Hari Bayangan di kerajaan masing-masing raja Banu al-Mahd. Ia berpihak pada mereka yang beriman bersamanya ke Isk, yang merupakan sebuah ghidah dekat Midian. Ketika panas memuncak terhadap para penyangkal, mereka mencarinya dan mengusirnya dari tempat mereka, sehingga Allah menjadikan awan bayangan itu seperti api. Ia bukanlah nabi Shu'ayb ibn Mahdham, seorang nabi yang hadir, dan di antara mereka terdapat seratus tahun. Di antara Musa dan Mesias terdapat seribu nabi {cite:muruj-al-dhahab hlm. 459, 464}."
