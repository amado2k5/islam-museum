label: { ar: "شعيب", en: "Shu'ayb" }
summary:
  ar: "شعيب بن نويل بن رعويل بن مر بن عنقاء بن مدين بن إبراهيم، نبي مدين الذي زوجه موسى ابنته، دعا قومه فكذبوه فوعدهم بعذاب يوم الظلة في ملك كلمن من ملوك بني المحض، وانحاز بمن آمن معه إلى الأيكة وهي غيضة نحو مدين، فلما اشتد الحر على المكذبين طلبوه وأخرجوه من مكانهم فجعل الله السحابة الظليلة عليهم ناراً، وهو غير شعيب بن مهدم نبي حضورا وبينهما مئون من السنين، وكان بين موسى والمسيح ألف نبي {cite:muruj-al-dhahab p. 459, 464}."
  en: "The prophet of Madyan, son-in-law-by-marriage to Moses, whose people expelling him drew the canopy of fire in Kalamn's reign — distinct from Shu'ayb ibn Mihdam of Banu Hudura by centuries, in a span al-Mas'udi fills with a thousand prophets between Moses and Christ {cite:muruj-al-dhahab p. 459, 464}."
