summary:
  ar: "أخت الحجاج بن يوسف، من ربات العقل والحزم، طلقها المغيرة بن شعبة فردت عليه، وتغزّل بها الشاعر محمد بن عبد الله النميري في قصيدة بلغت عبد الملك والحجاج؛ يروي خبرها كحالة في «أعلام النساء»."
  en: "Sister of al-Hajjaj ibn Yusuf, a woman of intelligence and resolve; divorced by al-Mughira ibn Shu'ba, she answered him sharply, and the poet Muhammad ibn Abd Allah al-Numayri composed a love poem about her that reached Abd al-Malik and al-Hajjaj. Kahhala tells her story in A'lam al-Nisa'."
  ur: "حجاج بن یوسف کی بہن، عقل اور عزم والی خاتون؛ مغیرہ بن شعبہ نے طلاق دی تو انہوں نے انہیں کرارا جواب دیا، اور شاعر محمد بن عبد اللہ النمیری نے ان پر غزل کہی جو عبد الملک اور حجاج تک پہنچی۔ کحالہ «اعلام النساء» میں ان کا واقعہ نقل کرتے ہیں۔"
