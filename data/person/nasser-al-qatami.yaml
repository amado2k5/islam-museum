summary:
  ar: "قارئ قرآن سعودي ومؤلف، إمام وخطيب جامع عبد الله بن ناصر المهيني بالرياض. بدأ الإمامة في الرابعة عشرة من عمره، وأشرف ودرّس في حلقات تحفيظ القرآن أكثر من أحد عشر عاماً، وصدر له أكثر من عشرين إصداراً صوتياً وعدد من المؤلفات في تدبر القرآن."
  en: "Saudi Qur'an reciter and author, imam and khatib of the Abdullah ibn Nasser Al-Muhaini Mosque in Riyadh. He began leading prayer at the age of fourteen, supervised and taught Qur'an memorisation circles for more than eleven years, and has issued more than twenty audio releases and several books on contemplation of the Qur'an."
  ur: "سعودی قاریِ قرآن اور مصنف، ریاض میں جامع عبد اللہ بن ناصر مہینی کے امام و خطیب۔ انھوں نے چودہ برس کی عمر میں امامت کا آغاز کیا، گیارہ سال سے زائد عرصہ حفظِ قرآن کے حلقات کی نگرانی و تدریس کی، اور ان کی بیس سے زائد آڈیو ریلیزز اور تدبرِ قرآن پر کئی کتب شائع ہو چکی ہیں۔"
