summary:
  ar: "قارئ قرآن سعودي ومؤلف، إمام وخطيب جامع عبد الله بن ناصر المهيني بالرياض. بدأ الإمامة في الرابعة عشرة من عمره، وأشرف ودرّس في حلقات تحفيظ القرآن أكثر من أحد عشر عاماً، وصدر له أكثر من عشرين إصداراً صوتياً وعدد من المؤلفات في تدبر القرآن."
  en: "Saudi Qur'an reciter and author, imam and khatib of the Abdullah ibn Nasser Al-Muhaini Mosque in Riyadh. He began leading prayer at the age of fourteen, supervised and taught Qur'an memorisation circles for more than eleven years, and has issued more than twenty audio releases and several books on contemplation of the Qur'an."
  ur: "سعودی قاریِ قرآن اور مصنف، ریاض میں جامع عبد اللہ بن ناصر مہینی کے امام و خطیب۔ انھوں نے چودہ برس کی عمر میں امامت کا آغاز کیا، گیارہ سال سے زائد عرصہ حفظِ قرآن کے حلقات کی نگرانی و تدریس کی، اور ان کی بیس سے زائد آڈیو ریلیزز اور تدبرِ قرآن پر کئی کتب شائع ہو چکی ہیں۔"
  es: "Recitador y autor saudí del Corán, imán y predicador de la mezquita Abdullah ibn Nasser Al-Muhaini en Riad. Comenzó a dirigir la oración a los catorce años, supervisó e impartió clases en círculos de memorización del Corán durante más de once años, y ha publicado más de veinte grabaciones de audio y varios libros sobre la contemplación del Corán."
  fr: "Récitation du Coran et auteur saoudien, imam et khatib de la mosquée Abdullah ibn Nasser Al-Muhaini à Riyad. Il a commencé à diriger la prière à l'âge de quatorze ans, a supervisé et enseigné dans des cercles de mémorisation du Coran pendant plus de onze ans, et a publié plus de vingt enregistrements audio et plusieurs ouvrages sur la contemplation du Coran."
  tr: "Suudi Kur'an'ı okuyor ve yazar, Riyad'daki Abdullah bin Nasser Al-Muhayni Camii'nin imamı ve vaizi. On dört yaşında namaz kılmaya başladı, on bir yıldan fazla Kur'an ezberleme çevrelerinde denetçilik ve ders verdi, yirmiden fazla sesli yayın ve Kur'an teürkürü üzerine birkaç eser yayımladı."
  id: "Seorang pembaca Al-Qur'an dan penulis asal Saudi, imam dan pengkhotbah Masjid Abdullah bin Nasser Al-Muhayni di Riyadh. Ia mulai memimpin shalat pada usia empat belas tahun, mengawasi dan mengajar di lingkaran hafalan Al-Qur'an selama lebih dari sebelas tahun, serta menerbitkan lebih dari dua puluh publikasi audio dan beberapa karya tentang kontemplasi Al-Qur'an."
