summary:
  ar: "القعقاع بن يزيد، ممن كان يجلس مع ابن شبرمة وفضل والحارث العكلي والمغيرة بالليل يتذاكرون الفقه {cite:tabaqat-fuqaha-abbas-1981 p. 45}. يذكر محقق الطبعة أن بعض النسخ والطبعة الأخرى تقرأ «القمقاع بن حكيم»، وأن القعقاع بن حكيم من أهل المدينة {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  en: "al-Qa'qa' ibn Yazid, one of those who used to sit at night with Ibn Shubruma, Fadl, al-Harith al-Ukli and al-Mughira, discussing jurisprudence {cite:tabaqat-fuqaha-abbas-1981 p. 45}. The editor notes that some manuscripts and the other edition read «al-Qamqa' ibn Hakim», and that al-Qa'qa' ibn Hakim was from Medina {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  fr: "al-Qa'qa' ibn Yazid, l'un de ceux qui avaient l'habitude de s'asseoir la nuit avec Ibn Shubruma, Fadl, al-Harith al-Ukli et al-Mughira, discutant de jurisprudence {cite:tabaqat-fuqaha-abbas-1981 p. 45}. L'éditeur note que certains manuscrits et l'autre édition lisaient « al-Qamqa' ibn Hakim », et que al-Qa'qa' ibn Hakim était de Médine {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  es: "al-Qa'qa' ibn Yazid, uno de los que solían sentarse por la noche con Ibn Shubruma, Fadl, al-Harith al-Ukli y al-Mughira, discutiendo jurisprudencia {cite:tabaqat-fuqaha-abbas-1981 p. 45}. El editor señala que algunos manuscritos y la otra edición leen «al-Qamqa' ibn Hakim», y que al-Qa'qa' ibn Hakim era de Medina {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
