summary:
  ar: "القعقاع بن يزيد، ممن كان يجلس مع ابن شبرمة وفضل والحارث العكلي والمغيرة بالليل يتذاكرون الفقه {cite:tabaqat-fuqaha-abbas-1981 p. 45}. يذكر محقق الطبعة أن بعض النسخ والطبعة الأخرى تقرأ «القمقاع بن حكيم»، وأن القعقاع بن حكيم من أهل المدينة {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  en: "al-Qa'qa' ibn Yazid, one of those who used to sit at night with Ibn Shubruma, Fadl, al-Harith al-Ukli and al-Mughira, discussing jurisprudence {cite:tabaqat-fuqaha-abbas-1981 p. 45}. The editor notes that some manuscripts and the other edition read «al-Qamqa' ibn Hakim», and that al-Qa'qa' ibn Hakim was from Medina {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
