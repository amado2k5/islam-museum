  ur: "بکی کے لیے ڈرافٹ کارڈ، سلیمان دی میگنیفیسینٹ کے دور میں شاعروں کے سلطان، ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے نامزد کیا گیا؛ اس کے العالم اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
