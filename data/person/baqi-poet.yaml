  id: "Kartu pendahuluan untuk Baqi, penyair terbesar para sultan dan raja para penyair pada masa pemerintahan Suleiman yang Agung, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya belum ditinjau di Kamus Terkenal di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
