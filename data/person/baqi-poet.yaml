  ar: "بطاقة أولية لباقي، شاعر السلاطين الأعظم وملك الشعراء في عهد سليمان القانوني، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في معجم الأعلام على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
