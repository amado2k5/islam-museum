summary:
  ar: "عالمة أحياء جزيئية أردنية وأستاذة في الجامعة الهاشمية، متخصصة في وراثة الشركس والشيشان في الأردن ودراسات الارتباط الجينومي وأخلاقيات أبحاث الخلايا الجذعية، ومؤسسة برنامج «نحن نحب القراءة» الذي فاز بجائزة الملك سيجونغ لليونسكو لمحو الأمية سنة 2017، ومن المناصرات لنظرية التطور البيولوجي في إطار إسلامي."
  en: "Jordanian molecular biologist and professor at the Hashemite University, specialising in the genetics of Circassian and Chechen populations in Jordan, genome-wide association studies and stem-cell research ethics. She founded the We Love Reading programme, which won the UNESCO King Sejong Literacy Prize in 2017, and is an advocate of the theory of biological evolution in relation to Islam."
  ur: "اردنی سالماتی حیاتیات دان اور جامعہ ہاشمیہ کی پروفیسر، جو اردن میں چرکس اور چیچن آبادیوں کی جینیات، جینوم گیر مطالعات اور سٹیم سیل تحقیق کی اخلاقیات کی ماہر ہیں۔ انہوں نے «نحن نحب القراءة» (We Love Reading) پروگرام قائم کیا جس نے 2017 میں یونیسکو کا کنگ سیجونگ لٹریسی پرائز جیتا، اور وہ اسلام کے تناظر میں حیاتیاتی ارتقا کی نظریے کی حامی ہیں۔"
