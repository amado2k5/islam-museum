summary:
  ar: "شيخ الأندلس في العربية والقراءات؛ أخذ القراءات عن أبي بكر بن صاف والعربية عن أبي ذر بن أبي ركب الخشني وساد أهل عصره في العربية؛ توفي بإشبيلية بعد أخذ الروم لها في شعبان، فقد هاله نطق الناقوس وخرس الأذان فما زال يتلهف ويتأسف ويضطرب إلى أن قضى نحبه، وقيل مات يوم أخذها {cite:shadharat-dhahab p. 244}."
  en: "Shaykh of al-Andalus in Arabic and the readings (b. 566) — pupil of Abu Bakr b. Saf and Abu Dharr b. Abi Rakb; he died in Seville within weeks of its surrender in Sha'ban 646, destroyed, the source says, by the sound of the church bell where the adhan had gone silent — one report has him die the very day it fell {cite:shadharat-dhahab p. 244}."
