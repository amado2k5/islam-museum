summary:
  ar: "شيخ الأندلس في العربية والقراءات؛ أخذ القراءات عن أبي بكر بن صاف والعربية عن أبي ذر بن أبي ركب الخشني وساد أهل عصره في العربية؛ توفي بإشبيلية بعد أخذ الروم لها في شعبان، فقد هاله نطق الناقوس وخرس الأذان فما زال يتلهف ويتأسف ويضطرب إلى أن قضى نحبه، وقيل مات يوم أخذها {cite:shadharat-dhahab p. 244}."
  en: "Shaykh of al-Andalus in Arabic and the readings (b. 566) — pupil of Abu Bakr b. Saf and Abu Dharr b. Abi Rakb; he died in Seville within weeks of its surrender in Sha'ban 646, destroyed, the source says, by the sound of the church bell where the adhan had gone silent — one report has him die the very day it fell {cite:shadharat-dhahab p. 244}."
  es: "Shaykh de al-Andalus en árabe y las lecturas (n. 566) — discípulo de Abu Bakr b. Saf y Abu Dharr b. Abi Rakb; murió en Sevilla pocas semanas después de su rendición en Sha'ban 646, destruido, según la fuente, por el sonido de la campana de la iglesia donde el adhan había enmudecido; un relato dice que murió el mismo día en que cayó {cita: shadharat-dhahab p. 244}."
  fr: "Cheikh d'al-Andalus en arabe et les lectures (né en 566) — élève d'Abu Bakr b. Saf et d'Abu Dharr b. Abi Rakb; il mourut à Séville quelques semaines après sa reddition en Sha'ban 646, détruite, selon la source, par le son de la cloche de l'église où l'adhan s'était tu — un rapport indique qu'il mourut le jour même de sa chute {cite: shadharat-dhahab p. 244}."
  ur: "شیخ الاندلس عربی میں اور ریڈنگز ⁦(متوفی 566)⁩ - ابوبکر بن کے شاگرد۔ صف اور ابوذر ب۔ ابی رکب; وہ شعبان 646 میں ہتھیار ڈالنے کے ہفتوں کے اندر سیویل میں مر گیا، تباہ ہو گیا، ذریعہ کا کہنا ہے کہ چرچ کی گھنٹی کی آواز سے جہاں اذان خاموش ہو گئی تھی - ایک رپورٹ میں بتایا گیا ہے کہ وہ اسی دن مر گیا جس دن یہ گرا تھا۔ 244}۔"
  tr: "Endülüs Şeyhi Arapça ve Kur'an okumalarında; okumaları Ebu Bekir bin Saf'tan, Arapça'yı Ebu Dharr bin Ebi Rukab el-Haşni'den öğrendi ve zamanının Arapça'daki baskın figürüydü; Romalılar Şeban'da esir aldıktan sonra Sevilla'da öldü; çan sesi ve ezan sessizliğinden korktu, ve vefat edene kadar özlem, pişmanlık ve üzüntü içinde kaldı. Söylenir ki, ezarı aldığı gün öldü {atıf:şadharat-dhahab, s. 244}."
  id: "Sheikh al-Andalus dalam bacaan Arab dan Al-Qur'an; ia mempelajari bacaan dari Abu Bakr ibn Saf dan bahasa Arab dari Abu Dharr ibn Abi Rukab al-Khashni, dan menjadi tokoh dominan pada zamannya dalam bahasa Arab; ia meninggal di Sevilla setelah orang Romawi mengambilnya dalam Sha'ban, karena ia ketakutan oleh suara lonceng dan keheningan panggilan shalat, dan ia terus merindukan, menyesal, dan berduka hingga meninggal dunia. Konon ia meninggal pada hari ia mengambilnya {cite:shadharat-dhahab, hlm. 244}."
