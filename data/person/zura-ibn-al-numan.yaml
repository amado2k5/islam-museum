id: person/zura-ibn-al-numan
class: person
label: { ar: "زرعة بن النعمان", en: "Zur'a ibn al-Nu'man", es: "Zur'a ibn al-Nu'man", fr: "Zur'a ibn al-Nu'man", ur: "زرعہ ابن النعمان" }
summary:
  ar: "زرعة بن النعمان — وقيل النعمان بن زرعة — من بني تغلب؛ عند البلاذري: هو الذي أنشد عمر بن الخطاب الله في بني تغلب «فإنهم قوم من العرب نائفون من الجزية، وهم قوم شديدة فكايتهم فلا يغن عدوك عليك بهم» فردهم عمر بعد فرارهم وصالحهم على ضعف الصدقة."
  en: "Zur'a ibn al-Nu'man — by another naming al-Nu'man ibn Zur'a — of Banu Taghlib; in al-Baladhuri: he it was who adjured Umar ibn al-Khattab by God on Taghlib's behalf — 'they are a people of Arabs who would scorn the jizya, and a people of stout valour; let not your enemy gain strength against you by them' — whereupon Umar brought them back from flight and compounded with them for the double sadaqa."
  es: "Zur'a ibn al-Nu'man — por otro nombre al-Nu'man ibn Zur'a — de Banu Taghlib; en al-Baladhuri: fue él quien conjuró a Umar ibn al-Khattab por Dios en favor de Taghlib — 'son un pueblo de árabes que despreciarían la jizya, y un pueblo de gran valor; no dejes que tu enemigo gane fuerza contra ti por medio de ellos' — entonces Umar los trajo de vuelta de su huida y pagó con ellos la doble sadaqa."
  fr: "Zur'a ibn al-Nu'man — également nommé al-Nu'man ibn Zur'a — de Banu Taghlib; selon al-Baladhuri: c'est lui qui a exhorté Umar ibn al-Khattab par Dieu en faveur de Taghlib — « Ce sont des Arabes qui méprisent la jizya et un peuple d'une vaillance inébranlable; que votre ennemi ne prenne pas de force contre vous grâce à eux » — sur quoi Umar les ramena de leur fuite et conclut avec eux une double sadaqa."
  ur: "زرعہ ابن النعمان - بنو تغلب کے ایک اور نام النعمان بن زرعہ سے؛ البلادوری میں ہے: وہ وہی تھا جس نے عمر بن الخطاب کو تغلب کی طرف سے خدا کی طرف سے مبعوث کیا تھا - 'وہ عرب کے لوگ ہیں جو جزیہ کو حقیر سمجھتے ہیں، اور بہادر لوگ ہیں۔ ان کے ذریعے تمہارا دشمن تمہارے خلاف طاقت نہ پکڑے''- اس پر عمر نے انہیں بھاگ کر واپس لایا اور ان کے ساتھ دوگنا صدقہ کیا۔"
