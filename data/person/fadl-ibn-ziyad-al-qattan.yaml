summary:
  ar: "الفضل بن زياد القطان، من أخص أصحاب أحمد بن حنبل وممن أكثر الرواية عنه في المسائل؛ حدث عنه يعقوب بن سفيان الفسوي والحسن بن عبد الوهاب بن أبي العنبر وأحمد بن محمد بن إسماعيل الأدمي وجعفر بن محمد الصندلي، وقال أبو بكر الخلال: الفضل بن زياد من المتقدمين عند أبي عبد الله، وكان أبو عبد الله يعرف قدره ويكرمه، ويصلى بأبي عبد الله {cite:tarikh-baghdad-khatib j.10 p.363}."
  en: "Al-Fadl b. Ziyad al-Qattan — the companion closest to Ahmad ibn Hanbal and the most prolific transmitter of his responsa; Abu Bakr al-Khallal counts him among Ahmad's foremost circle {cite:tarikh-baghdad-khatib j.10 p.363}."
