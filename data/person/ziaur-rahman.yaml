summary:
  ar: "قائد عسكري وسياسي بنغلاديشي (19 يناير 1936 – 30 مايو 1981)، سادس رؤساء بنغلاديش ومؤسس الحزب الوطني البنغلاديشي. خدم في الجيش الباكستاني، وأذاع إعلان استقلال بنغلاديش من شيتاغونغ في مارس 1971 وقاد قطاعًا وقوة في حرب التحرير، ثم ترأس أركان الجيش بعد 1975 وتولى الرئاسة من 1977 حتى اغتياله في شيتاغونغ، فأعاد التعددية الحزبية وأسس الحزب الوطني سنة 1978. زوجته خالدة ضياء."
  en: "Bangladeshi military leader and politician (19 January 1936 – 30 May 1981), the sixth president of Bangladesh and the founder of the Bangladesh Nationalist Party. He served in the Pakistan Army, broadcast the declaration of Bangladesh's independence from Chittagong in March 1971 and commanded a sector and a brigade force in the Liberation War, then headed the army after 1975 and held the presidency from 1977 until his assassination at Chittagong, restoring multi-party politics and founding the BNP in 1978. His wife was Khaleda Zia."
  ur: "بنگلہ دیشی فوجی رہنما اور سیاست دان (19 جنوری 1936ء – 30 مئی 1981ء)، بنگلہ دیش کے چھٹے صدر اور بنگلہ دیش نیشنلسٹ پارٹی کے بانی۔ انھوں نے پاکستانی فوج میں خدمات انجام دیں، مارچ 1971ء میں چٹاگانگ سے بنگلہ دیش کی آزادی کا اعلان نشر کیا اور جنگ آزادی میں ایک سیکٹر اور بریگیڈ فورس کی کمان کی، پھر 1975ء کے بعد فوج کی سربراہی کی اور 1977ء سے چٹاگانگ میں اپنے قتل تک صدر رہے؛ انھوں نے کثیر الجماعتی سیاست بحال کی اور 1978ء میں بی این پی قائم کی۔ ان کی اہلیہ خالدہ ضیاء تھیں۔"
