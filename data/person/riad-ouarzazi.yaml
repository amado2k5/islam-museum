summary:
  ar: "داعية ومدرّس مغربي المولد مقيم في تورونتو بكندا. وُلد في الدار البيضاء ونال شهادات في التعليم الإسلامي من جامعة عبد الله هناك، وانتقل إلى الولايات المتحدة سنة 1988 فدرس الإدارة الدولية ونظم المعلومات الحاسوبية في جامعة غولدن غيت، ثم انتقل إلى كندا سنة 2001 وأخذ يلقي المحاضرات وخطب الجمعة في مساجد منطقة تورونتو الكبرى. وهو عضو في مجلس الأئمة الكندي ومدير الشؤون الدينية في ICNA كندا، ودرّس في معهد المغرب، وتنتشر محاضراته المسجلة في بودكاست مسلم سنترال منذ سنة 2012."
  en: "A Moroccan-born dawah speaker and teacher based in Toronto, Canada. Born in Casablanca, he took Islamic education degrees at Abdullah University there, moved to the United States in 1988 — where he read international management and computer information systems at Golden Gate University — and moved to Canada in 2001, giving lectures and Friday sermons in the mosques of the Greater Toronto Area. He is a member of the Canadian Council of Imams, serves as Director of Religious Affairs at ICNA Canada, has taught with AlMaghrib Institute, and his recorded lectures circulate as a Muslim Central podcast running since 2012."
  ur: "مراکش میں پیدا ہونے والے داعی اور مدرس، کینیڈا کے شہر ٹورنٹو میں مقیم۔ کاسا بلانکا میں پیدا ہوئے اور وہیں عبد اللہ یونیورسٹی سے اسلامی تعلیم کی اسناد حاصل کیں، 1988 میں امریکا منتقل ہوئے جہاں گولڈن گیٹ یونیورسٹی سے انٹرنیشنل مینجمنٹ اور کمپیوٹر انفارمیشن سسٹمز کی تعلیم لی، پھر 2001 میں کینیڈا آ گئے اور گریٹر ٹورنٹو ایریا کی مساجد میں محاضرات اور خطباتِ جمعہ دینے لگے۔ کینیڈین کونسل آف امامز کے رکن اور ICNA کینیڈا کے ڈائریکٹر آف ریلیجس افیئرز ہیں، المغرب انسٹی ٹیوٹ میں تدریس کر چکے ہیں، اور ان کی ریکارڈ شدہ محاضرات 2012 سے مسلم سینٹرل پوڈکاسٹ میں جاری ہیں۔"
