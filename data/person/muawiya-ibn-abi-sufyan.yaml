summary:
  ar: "قرشي أموي، ولد قبل البعثة بخمس سنين في الأشهر؛ صحب النبي وكتب له، وولاه عمر الشام بعد أخيه يزيد بن أبي سفيان وأقره عثمان، ثم لم يبايع علياً وحاربه واستقل بالشام وأضاف إليها مصر، وتسمى بالخلافة بعد الحكمين، واجتمع الناس عليه عام الجماعة، وروى المسعودي خدعته المشهورة لعمرو بن العاص بعد الحكمين: أمر بالطعام وأن يقوم شبعان موالي عمرو فيقعد مكانهم مواليه ثم يغلق الباب، فلما بقي قال بيني وبينك أمران البيعة لي أو أقتلك، فاستوثقا فبايعه أهل الشام وانصرف خليفة، وصالحه الحسن؛ واختلف في وقت إسلامه {cite:muruj-al-dhahab p. 691-692} ومن أخلاقه عند المسعودي أنه كان يخرج فيقول يا غلام أخرج الكرسي فيوضع بالمسجد ويسند ظهره إلى المقصورة وتقوم الأحراس فيتقدم إليه الضعيف والأعرابي والصبي والمرأة ومن لا أحد له فيقول ظلمت فيقول أعزوه، ثم يؤذن للناس على قدر منازلهم فيقول إنما سميتم أشرافاً لأنكم شرفتم من دونكم بهذا المجلس ارفعوا إلينا حوائج من لا يصل إلينا {cite:muruj-al-dhahab p. 31-32} ولما احتضر تمثل هو الموت لا منجى من الموت والذي تحاذر بعد الموت أدهى وأفظع ثم قال اللهم أقل العثرة واعف عن الزلة، فبلغ ذلك سعيد بن المسيب فقال لقد رغب إلى من لا مرغوب إليه مثله وإني لأرجو ألا يعذبه الله، ودخل الحمام في بدء علته فرأى نحول جسمه فبكى وقال أرى الليالي أسرعت في نقضي {cite:muruj-al-dhahab p. 49-50}، وعند المسعودي نادى منادي المأمون سنة اثنتي عشرة ومائتين برئت الذمة من أحد ذكر معاوية بخير أو قدمه على أحد من أصحاب رسول الله وأنشئت الكتب إلى الآفاق بلعنه على المنابر فأعظم الناس ذلك واضطربت العامة فأشير عليه بتركه {cite:muruj-al-dhahab p. 433-434}، وروى المسعودي حيلته في البطريق الذي لطم حر وجه أسير قرشي صاح أين أنت عنا يا معاوية، فأجمل الأمر سنين مع رجل من صور حتى اختطفه بمركب مفرش بالبساط السوسنجرد من ضيعته على خليج القسطنطينية، فاقتص منه القرشي على بساط معظم الروم ثم رده مكرماً فقال ملك الروم هذا أمكر الملوك وأدهى العرب ولو هم بأخذي لتمت له الحيلة علي {cite:muruj-al-dhahab p. 584-587}، وعند المسعودي سأل مطر بن دراج أي الخيل أفضل وأوجز فقال الذي إذا استقبلته قلت نافر وإذا استدبرته قلت زاخر وإذا استعرضته قلت زافر سوطه عنانه وهواه أمامه، فقال فأي البراذين شر فقال الغليظ الرقبة الكثير الجلبة الذي إذا أرسلته قال أمسكني وإذا أمسكته قال أرسلني {cite:muruj-al-dhahab p. 697}"
  en: A Qurashi of the Umayyad clan, born five years before the mission on the best-known account; he accompanied the Prophet and wrote for him, Umar appointed him over Syria after his brother Yazid ibn Abi Sufyan and Uthman kept him there, then
    he did not pledge to Ali and fought him, took Syria for himself and added Egypt, took the title of caliph after the two arbitrators, and the people gathered on him in the year of the community when al-Hasan made peace with him; the time of
    his conversion is disputed.
