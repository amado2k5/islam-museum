id: person/muawiya-ibn-abi-sufyan
education:
  did_you_know:
    ar: "معاوية بن أبي سفيان صحب النبي وكتب له الوحي، وولاه عمر الشام بعد أخيه يزيد؛ اجتمع الناس عليه عام الجماعة ودامت إمارته على الشام نحو أربعين سنة."
    en: "Mu'awiya ibn Abi Sufyan kept the Prophet's company and wrote for him; Umar appointed him over Syria after his brother Yazid, and the people united under him in the Year of Unity — some forty years governing Syria."
    ur: "معاویہ بن ابی سفیان نبی کے ساتھ رہے اور کاتب تھے؛ عمر نے انہیں بھائی یزید کے بعد شام کا عامل بنایا اور عامِ جماعت میں لوگ ان پر جمع ہوئے — شام پر چالیس سال حکومت۔"
    sources: [source/ibn-hajar-isaba, source/muruj-al-dhahab]
