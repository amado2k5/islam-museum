summary:
  ar: "قرشي أموي، ولد قبل البعثة بخمس سنين في الأشهر؛ صحب النبي وكتب له، وولاه عمر الشام بعد أخيه يزيد بن أبي سفيان وأقره عثمان، ثم لم يبايع علياً وحاربه واستقل بالشام وأضاف إليها مصر، وتسمى بالخلافة بعد الحكمين، واجتمع الناس عليه عام الجماعة، وروى المسعودي خدعته المشهورة لعمرو بن العاص بعد الحكمين: أمر بالطعام وأن يقوم شبعان موالي عمرو فيقعد مكانهم مواليه ثم يغلق الباب، فلما بقي قال بيني وبينك أمران البيعة لي أو أقتلك، فاستوثقا فبايعه أهل الشام وانصرف خليفة ، وصالحه الحسن؛ واختلف في وقت إسلامه {cite:muruj-al-dhahab p. 691-692}"
  en: A Qurashi of the Umayyad clan, born five years before the mission on the best-known account; he accompanied the Prophet and wrote for him, Umar appointed him over Syria after his brother Yazid ibn Abi Sufyan and Uthman kept him there, then
    he did not pledge to Ali and fought him, took Syria for himself and added Egypt, took the title of caliph after the two arbitrators, and the people gathered on him in the year of the community when al-Hasan made peace with him; the time of
    his conversion is disputed.
