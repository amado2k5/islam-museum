summary:
  ar: "قرشي أموي، ولد قبل البعثة بخمس سنين في الأشهر؛ صحب النبي وكتب له، وولاه عمر الشام بعد أخيه يزيد بن أبي سفيان وأقره عثمان، ثم لم يبايع علياً وحاربه واستقل بالشام وأضاف إليها مصر، وتسمى بالخلافة بعد الحكمين، واجتمع الناس عليه عام الجماعة، وروى المسعودي خدعته المشهورة لعمرو بن العاص بعد الحكمين: أمر بالطعام وأن يقوم شبعان موالي عمرو فيقعد مكانهم مواليه ثم يغلق الباب، فلما بقي قال بيني وبينك أمران البيعة لي أو أقتلك، فاستوثقا فبايعه أهل الشام وانصرف خليفة، وصالحه الحسن؛ واختلف في وقت إسلامه {cite:muruj-al-dhahab p. 691-692} ومن أخلاقه عند المسعودي أنه كان يخرج فيقول يا غلام أخرج الكرسي فيوضع بالمسجد ويسند ظهره إلى المقصورة وتقوم الأحراس فيتقدم إليه الضعيف والأعرابي والصبي والمرأة ومن لا أحد له فيقول ظلمت فيقول أعزوه، ثم يؤذن للناس على قدر منازلهم فيقول إنما سميتم أشرافاً لأنكم شرفتم من دونكم بهذا المجلس ارفعوا إلينا حوائج من لا يصل إلينا {cite:muruj-al-dhahab p. 31-32} ولما احتضر تمثل هو الموت لا منجى من الموت والذي تحاذر بعد الموت أدهى وأفظع ثم قال اللهم أقل العثرة واعف عن الزلة، فبلغ ذلك سعيد بن المسيب فقال لقد رغب إلى من لا مرغوب إليه مثله وإني لأرجو ألا يعذبه الله، ودخل الحمام في بدء علته فرأى نحول جسمه فبكى وقال أرى الليالي أسرعت في نقضي {cite:muruj-al-dhahab p. 49-50}، وعند المسعودي نادى منادي المأمون سنة اثنتي عشرة ومائتين برئت الذمة من أحد ذكر معاوية بخير أو قدمه على أحد من أصحاب رسول الله وأنشئت الكتب إلى الآفاق بلعنه على المنابر فأعظم الناس ذلك واضطربت العامة فأشير عليه بتركه {cite:muruj-al-dhahab p. 433-434}، وروى المسعودي حيلته في البطريق الذي لطم حر وجه أسير قرشي صاح أين أنت عنا يا معاوية، فأجمل الأمر سنين مع رجل من صور حتى اختطفه بمركب مفرش بالبساط السوسنجرد من ضيعته على خليج القسطنطينية، فاقتص منه القرشي على بساط معظم الروم ثم رده مكرماً فقال ملك الروم هذا أمكر الملوك وأدهى العرب ولو هم بأخذي لتمت له الحيلة علي {cite:muruj-al-dhahab p. 584-587}، وعند المسعودي سأل مطر بن دراج أي الخيل أفضل وأوجز فقال الذي إذا استقبلته قلت نافر وإذا استدبرته قلت زاخر وإذا استعرضته قلت زافر سوطه عنانه وهواه أمامه، فقال فأي البراذين شر فقال الغليظ الرقبة الكثير الجلبة الذي إذا أرسلته قال أمسكني وإذا أمسكته قال أرسلني {cite:muruj-al-dhahab p. 697}"
  en: "A Qurashi of the Umayyad clan, son of Abu Sufyan and Hind bint Utba, who accompanied the Prophet and served as one of his scribes. Umar put him in charge in Syria after his brother Yazid, and he later refused allegiance to Ali, fought him at Siffin, and was recognised as caliph in the year of the community, 41/661, when al-Hasan stood down. He ruled until 60/680, held the Byzantine front by land and sea, governed through tribal leaders, and had the oath taken to his son Yazid; the Encyclopaedia of Islam reports that later writers judged him in sharply different ways."
  ur: "اموی قبیلے کا قریشی، ابو سفیان اور ہند بنت عتبہ کا بیٹا، جو نبی کے ساتھ رہا اور ان کے کاتبوں میں شمار ہوا۔ عمر نے بھائی یزید کے بعد انہیں شام میں مقرر کیا؛ بعد میں انہوں نے علی کی بیعت نہ کی اور صفین میں ان سے لڑے، اور 41ھ/661ء میں عام الجماعت کے سال، جب حسن دستبردار ہوئے، خلیفہ تسلیم کیے گئے۔ انہوں نے 60ھ/680ء تک حکومت کی، بیزنطیوں کے خلاف بری اور بحری محاذ سنبھالا، قبائلی سرداروں کے ذریعے نظم چلایا اور بیٹے یزید کے لیے بیعت لی؛ دائرۃ المعارف اسلامیہ کے مطابق بعد کے مصنفین نے ان کے بارے میں بہت مختلف رائے رکھی۔"
  es: "Un Qurashi del clan Omeya, hijo de Abu Sufyan y Hind bint Utba, acompañó al Profeta y fue uno de sus escribas. Umar lo puso al mando de Siria tras la muerte de su hermano Yazid, y posteriormente se negó a jurar lealtad a Ali, luchó contra él en Siffin y fue reconocido como califa en el año de la comunidad, 41/661, cuando al-Hasan abdicó. Gobernó hasta el año 60/680, controló el frente bizantino por tierra y mar, gobernó a través de líderes tribales y juró lealtad a su hijo Yazid; la Enciclopedia del Islam informa que escritores posteriores lo juzgaron de maneras muy diferentes."
  fr: "Qurassien de la lignée omeyyade, fils d'Abu Sufyan et de Hind bint Utba, il accompagna le Prophète et fut l'un de ses scribes. Après la mort de son frère Yazid, Umar le nomma à la tête de la Syrie. Plus tard, il refusa de prêter allégeance à Ali, le combattit à Siffin et fut reconnu calife en l'an 41 de l'Hégire (661 ap. J.-C.), lorsque al-Hasan abdiqua. Il régna jusqu'en 60 (680 ap. J.-C.), soutint le front byzantin par voie terrestre et maritime, gouverna par l'intermédiaire de chefs tribaux et fit prêter serment à son fils Yazid. L'Encyclopédie de l'Islam rapporte que les auteurs postérieurs portèrent des jugements très divergents à son sujet."
  tr: "Görevden beş yıl önce, aylar içinde doğan bir Emevi Kureyşşi; Peygamber'e eşlik etti ve ona yazdı. Ömer, kardeşi Yezid bin Ebi Sufyan'dan sonra onu Suriye valisi olarak atadı ve Osman tarafından onaylandı. Ali'ye bağlılık etmedi, onunla savaştı ve Suriye'de bağımsızlığını kazandı, Mısır'ı da ekledi. İki hükümdarın adını taşıyan halifelik olarak adlandırıldı ve halk genel mecliste etrafında toplandı. El-Mes'udi, iki hükümdardan sonra Amr ibn al-As'ı ünlü aldatmacasını anlattı: Yemek emretti, Amr'in sadık hizmetkarlarının tatmin olacağını ve takipçilerinin yerlerine oturacağını söyledi, sonra kapı kapanacaktı. Kaldığında dedi ki: Seninle aramızda iki şey var: bana bağlılık yemini etmek ya da seni öldürmek. Güven kazandı, bu yüzden el-Şam halkı ona bağlılık yemini etti, o da ayrıldı ve el-Hasan onunla barıştı. İslam'a geçiş zamanı konusunda anlaşmazlık vardı {cite:muruj-al-dhahab s. 691-692}. El-Mes'udi ile olan ahlaklarından biri, 'Ey çocuk, sandalyeyi çıkar' demesi, camiye koyması, sırtı çevreye yaslanarak, muhafızların ayağa kalkması idi. Zayıflar, Bedeviler, çocuk, kadın ve diğerleri ona yaklaşır ve 'Ona haksızlık ettim' derdi, o da 'Onu onurlandırdım.' Derdi. Sonra halkı rütbelerine göre çağırır ve şöyle derdi: 'Size soylu denildi çünkü bu toplantıyla başkalarını onurlandırdınız. Bize ulaşamayanların ihtiyaçlarını bize iletin.' {alıntı: Muruj-al-Dhahab s. 31-32} Öldüğünde, ölümde bedenlenmişti, ölümden bir sığınak değildi ve ölümden sonra korktuğu şey daha korkunç ve korkunçtu. Sonra dedi ki, Ey Allah, tökezlemeyi azalt ve bu hatayı affet. Said ibn al-Musayyib bunu duyunca, \"İstenmeyen birini arzuladı ve umarım Allah onu cezalandırmaz,\" dedi. Hastalığının başında banyoya girdi ve bedeninin zayıflığını gördü, ağladı ve dedi ki, \"Gecelerin hızla geçtiğini görüyorum. Muruj-al-Dhahab s. 49-50} ve el-Mes'udi ile birlikte el-Me'mun'un çağrısı iki yüz on iki yılda çağrıldı. Antlaşma, Muaviye veya onun Allah'ın Elçisi'nin sahabelerinden herhangi birine tercih ettiği herhangi bir şeyden geçersiz kılındı ve vaaz kürsülerinde ona lanet edilen kitaplar kuruldu; bu da insanları coşturdu ve halkı huzursuz etti, bu yüzden ayrılması önerildi {atı:Muruj-al-Dhahab s. 433-434}. Al-Mas'udi, bir Kureyşli esirin yüzüne tokat atan ve 'Nereden geldin, Muaviye?' diye bağıran penguen hakkında kurnazlığını anlattı. En güzel şey, Sur'dan bir adamla yıllarca birlikte vakit geçirmekti, ta ki onu bir teknede kaçırana kadar Konstantinopolis Körfezi'ndeki mülkünden susanjerd halıyla kaplı bir halı. Kuraşi, Romalıların çoğu halısına bundan intikam aldı, sonra onurla geri verdi. Roma kralı dedi ki, 'Bu kralların kurnazlığı ve Arapların en kurnazıdır. Beni alırlarsa, bana karşı kandırılacaktır.' {atıf:Muruj-al-Dhahab s. 584-587}. Al-Mas'udi, Matar ibn Darraj'a hangi atın daha iyi ve daha özlü olduğunu sordu. O dedi ki: Onunla karşılaşırsan, geri çekilen olduğunu söylersin; sırtını döndüğünde zengin olduğunu söylersin; ona gösterdiğinde kırbacının çekildiğini ve tutkusunun önünde olduğunu söylersin. O da dedi ki, 'İki parmaktan hangisi kötüdür?' Dedi ki, 'Kalın boyunlu, tam bir karmaşa.' Onu gönderdiğinde, 'Beni yakala,' der, sen yakaladığında ise 'Beni gönder' der {cite:muruj-al-dhahab, s. 697}"
  id: "Seorang Umayyah Quraisy, lahir lima tahun sebelum misi, dalam beberapa bulan; ia menemani Nabi dan menulis surat kepadanya. Umar mengangkatnya sebagai gubernur Suriah setelah saudaranya Yazid ibn Abi Sufyan dan menyetujuinya oleh Uthman. Ia tidak bersumpah setia kepada Ali, melawannya, dan menjadi merdeka di Suriah, menambahkan Mesir ke dalamnya. Dinamakan kekhalifahan sesuai nama kedua penguasa, dan rakyat berkumpul di sekelilingnya dalam sidang umum. Al-Mas'udi menceritakan penipuan terkenalnya terhadap Amr ibn al-As setelah dua penguasa: Ia memesan makanan dan bahwa para pelayan setia Amr akan puas dan pengikutnya duduk menggantikan mereka, lalu pintu akan ditutup. Ketika ia tinggal, ia berkata: Antara kau dan aku, ada dua hal: bersumpah setia padaku atau bunuh kau. Dia mendapatkan kepercayaan, sehingga rakyat al-Sham bersumpah setia kepadanya, dan dia pergi, dan al-Hasan berdamai dengannya. Ada perselisihan tentang waktu dia berpindah ke Islam {cite:muruj-al-dhahab hlm. 691-692}. Di antara moralnya dengan al-Mas'udi adalah dia akan keluar dan berkata, 'Wahai anak, keluarkan kursi,' dan meletakkannya di masjid, dengan punggungnya bersandar pada pagar, dan para penjaga akan berdiri. Yang lemah, Badui, anak laki-laki, wanita, dan siapa pun akan mendekatinya, dan berkata, 'Aku telah menyakitinya,' dan dia berkata, 'Aku menghormatinya.' Kemudian dia memanggil orang-orang sesuai dengan pangkat mereka dan berkata, 'Kalian hanya disebut bangsawan karena kalian telah menghormati orang lain dengan pertemuan ini. Bangkitkan kepada kami kebutuhan mereka yang tidak menjangkau kami.' {cite: muruj-al-dhahab hlm. 31-32} Ketika ia meninggal, ia berwujud dalam kematian, bukan tempat perlindungan dari kematian, dan apa yang ia takutkan setelah mati lebih mengerikan dan mengerikan. Kemudian ia berkata, Ya Allah, kurangi kesandungan dan ampunilah kesalahan. Ketika Sa'id ibn al-Musayyib mendengar ini, ia berkata: Ia menginginkan seseorang yang tidak diinginkan, dan aku berharap Allah tidak menghukumnya. Ia masuk ke kamar mandi di awal penyakitnya dan melihat kelemahan tubuhnya, lalu ia menangis dan berkata, \"Aku melihat malam-malam semakin cepat berlalu {cite: Muruj-al-Dhahab hlm. 49-50} dan bersama al-Mas'udi sang pemanggil al-Ma'mun memanggil pada tahun dua ratus dua belas. Perjanjian itu dibersihkan dari segala penyebutan Muawiyah atau preferensinya atas sahabat Rasulullah, dan buku-buku didirikan hingga sejauh mungkin dengan mengutuknya di mimbar, yang membuat orang ramai menjadi hebat dan masyarakat terganggu, sehingga disarankan agar ia pergi {cite:Muruj-al-dhahab hlm. 433-434}. Al-Mas'udi menceritakan kelicikannya tentang penguin yang menampar wajah tawanan Quraisy dan berteriak, 'Dari mana kamu dari kami, Muawiyah?' Hal terindah adalah bertahun-tahun bersama seorang pria dari Tirus sampai dia menculiknya di perahu Sebuah karpet yang ditutupi dengan karpet susanjerd dari tanahnya di Teluk Konstantinopel. Qurashi membalas dendam atas sebagian besar karpet Romawi, lalu mengembalikannya dengan terhormat. Raja Romawi berkata, 'Inilah kelicikan para raja dan kecerdikan terbesar orang Arab. Jika mereka menangkapku, dia akan tertipu melawanku.' {cite:muruj-al-dhahab hlm. 584-587}. Al-Mas'udi bertanya kepada Matar ibn Darraj kuda mana yang lebih baik dan lebih ringkas. Dia berkata: Jika kamu bertemu dengannya, kamu bilang dia adalah seorang yang suka mundur; ketika kamu membelakanginya, kamu bilang dia seorang yang kaya; dan ketika kamu menunjukkannya, kamu bilang cambuknya dihembuskan, dan nafsunya ada di hadapannya. Dia berkata, 'Mana dari dua orang itu yang jahat?' Dia berkata, 'Yang leher tebal, sangat keributan.' Yang, ketika kamu mengirimnya, berkata, 'Tangkap aku,' dan ketika kamu menangkapnya, dia berkata, 'Kirim aku' {cite:muruj-al-dhahab, hlm. 697}"
