summary:
  ar: "مسند خراسان أبو الحسن ظاهر بن طاهر الشحامي؛ سمع الكثير وأملى ما يربو على ألف مجلس وكان عالماً بمعرفة العلل، وله تاريخ كبير؛ توفي في ربيع الآخر سنة ثلاث وثلاثين وخمسمائة {cite:shadharat-dhahab p. 584}."
  en: "Musnid of Khurasan Abu al-Hasan Zahir ibn Tahir al-Shahhami; he heard copiously, dictated over a thousand sessions, was versed in hadith defects, and authored a large history; d. Rabi' II 533 {cite:shadharat-dhahab p. 584}."
  es: "Musnid de Khurasan Abu al-Hasan Zahir ibn Tahir al-Shahhami; escuchó copiosamente, dictó más de mil sesiones, estaba versado en los defectos de los hadices y fue autor de una larga historia; d. Rabi' II 533 {cita: shadharat-dhahab p. 584}."
  fr: "Musnid du Khurasan Abu al-Hasan Zahir ibn Tahir al-Shahhami; il a entendu abondamment, a dicté plus d'un millier de séances, était versé dans les défauts des hadiths et a écrit une grande histoire; d. Rabi' II 533 {cite: shadharat-dhahab p. 584}."
  ur: "مسند آف خراسان ابو الحسن ظاہر ابن طاہر الشحامی؛ اس نے کثرت سے سنا، ایک ہزار سے زائد سیشنوں کا حکم دیا، حدیث کے نقائص پر عبور حاصل تھا، اور ایک بڑی تاریخ تصنیف کی۔ d ربیع دوم 533 {حوالہ: شدّرت ذہب ص۔ 584}۔"
  tr: "Horasan Ebu el-Hasan Zahir bin Tahir el-Şahami'nin Musnadı; çok şey duydu ve binin üzerinde oturumu dikte etti. 'İlal' bilgisi konusunda bilgiliydi ve büyük bir geçmişi vardı; beş yüz otuz üçüncü yılda Rabi' al-Akhir'de öldü {atıf: shadharat-dhahab, s. 584}."
  id: "Musnad Khurasan Abu al-Hasan Zahir ibn Tahir al-Shahami; ia banyak mendengar dan mendiktekan lebih dari seribu sidang. Ia menguasai pengetahuan 'ilal' dan memiliki sejarah yang besar; ia meninggal di Rabi' al-Akhir pada tahun lima ratus tiga puluh tiga {cite:shadharat-dhahab, hlm. 584}."
