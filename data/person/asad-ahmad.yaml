summary:
  ar: "صحفي ومقدّم أخبار بريطاني، وُلد في لندن سنة 1969 لأبوين باكستانيين. عمل متداولًا للعملات وباحثًا في مجلس اللوردات قبل أن يلتحق ببي بي سي سنة 1996، فعمل في ميدلاندز واسكتلندا ثم صار من مقدّمي أخبار بي بي سي لندن، ونال جائزة مراسل العام في لندن من الجمعية الملكية للتلفزيون سنة 2006."
  en: "British journalist and news presenter, born in London in 1969 to Pakistani parents. He worked as a foreign-exchange dealer and a House of Lords researcher before joining the BBC in 1996, worked in the Midlands and Scotland, and became a BBC London presenter, winning the Royal Television Society's London Reporter of the Year award in 2006."
