summary:
  ar: "ابن خير الدين بربروسة؛ عيّنه الباب العالي حاكماً على الجزائر بعد وفاة حسن آغا الطوشي فقدمها سنة ٩٥١هـ/١٥٤٤م، ووالدته من الأسر الجزائرية المعروفة. حال وصوله حصّن مدينة الجزائر في المواضع التي كشف هجوم شارل الخامس ضعفها، ثم انصرف إلى حل مشكلة تلمسان: قاد الجيش الإسلامي فمنع قوة وهران الإسبانية من إعادة أبو زيان أحمد الثاني، ودعم حليفه الملك حسن وترك حامية بقيادة القائد محمد في قلعة المشوار. وطرد السعديين من تلمسان ووطد الحكم العثماني فيها سنة ٩٥٩هـ/١٥٥١م ⁦(النص المطبوع «١١٥١م»)⁩. غير أنه انتهج سياسة مضادة لكل القوى الأجنبية ومنها فرنسا، ورفض عرض سفيرها بالمساعدة العسكرية قائلاً إن قضية الجهاد خاصة بالمسلمين وإنه لا ينتصر بكافر على كافر، فأوغر السفير صدر الباب العالي بأن سلطته المطلقة ستحطم وحدة الدولة، فعزله السلطان سليمان في صفر ٩٦٠هـ/يناير ١٥٥٢م بدعوى الإساءة إلى حسن الجوار مع المغرب وأسند البكلربكية إلى صالح رايس {cite:dawlat-uthmaniyya-salabi p. 229-235}. وبعد مصرع حسن قورصو سنة ٩٦٤هـ/١٥٥٧م أعاده السلطان إلى الجزائر؛ فجند عشرة آلاف من زواوة وتزوج ابنة سلطان كوكو بن القاضي، وعين بويحيى الرايس على باديس التي ضيقت على الملاحة الأسبانية، وحارب عبد العزيز بن عباس أمير قلعة بني عباس حتى قتل واعترف بخلفه أحمد مقران. ثم اعتقلته الإنكشارية صيف ٩٦٩هـ/١٥٦١م متّهمة إياه بنية الاستقلال فأرسل مقيداً إلى استانبول، لكن السلطان أعاده للمرة الثالثة أواخر ٩٧٠هـ/١٥٦٢م معززاً بعشر سفن. فحاصر وهران في ١٣ أبريل ١٥٦٣م بخمس عشرة ألف بندقية وألف فارس واثني عشر ألفاً من زواوة وبني عباس ثم رفع الحصار لتوالي النجدات، وشارك في حصار مالطة ٩٧٣هـ/١٥٦٥م بخمس وعشرين سفينة وثلاثة آلاف رجل، حتى أسند إليه سليم الثاني قيادة الأسطول العامة سنة ٩٧٥هـ/١٥٦٧م {cite:dawlat-uthmaniyya-salabi p. 245-252}."
  en: "Khayr al-Din Barbarossa's son, of a noted Algerian family on his mother's side; the Porte's governor of Algiers from 951/1544. He refortified the city's weak points shown by Charles V's attack, kept the Oran force from restoring Abu Zayyan Ahmad II at Tlemcen, secured the Ottoman garrison at al-Mashwar castle, and drove the Sa'dis out by 959/1551 (printed '1151'). But his hostility to all foreign powers — France included — and his refusal of the French envoy's military aid ('jihad is the Muslims' affair; I will not win by an infidel against an infidel') let the envoy poison the Porte's ear: Süleyman deposed him in Safar 960/January 1552, giving the beylerbeylik to Salih Reis {cite:dawlat-uthmaniyya-salabi p. 229-235}. After Hasan Corso's death in 964/1557 the sultan restored him; he raised ten thousand Zawawa, married Sultan Kuku's daughter, set Bu Yahya over Badis, fought Abd al-Aziz b. Abbas of Qal'at Bani Abbas until his fall, and recognised his successor Ahmad Muqran. The Janissaries, fearing he meant independence, arrested him in summer 969/1561 and shipped him bound to Istanbul — yet the sultan returned him a third time in late 970/1562 with ten warships. He besieged Oran on 13 April 1563 with fifteen thousand musketeers, a thousand horse, and twelve thousand Zawawa and Bani Abbas, lifting it as relief converged; shared in the Malta siege of 973/1565 with twenty-five ships and three thousand men; and in 975/1567 Selim II made him commander-in-chief of the fleet {cite:dawlat-uthmaniyya-salabi p. 245-252}."
  es: "Hijo de Khayr al-Din Barbarroja, perteneciente a una destacada familia argelina por parte materna, fue gobernador de Argel por la Sublime Puerta desde 951/1544. Reforzó los puntos débiles de la ciudad, expuestos tras el ataque de Carlos V, impidió que las fuerzas de Orán restauraran a Abu Zayyan Ahmad II en Tremecén, aseguró la guarnición otomana en el castillo de al-Mashwar y expulsó a los sadíes hacia 959/1551 (impreso como '1151'). Pero su hostilidad hacia todas las potencias extranjeras —incluida Francia— y su negativa a la ayuda militar del enviado francés («la yihad es asunto de los musulmanes; no ganaré por medio de un infiel contra otro») permitieron que el enviado envenenara los oídos de la Sublime Puerta: Solimán lo depuso en Safar 960/enero de 1552, otorgando el beylerbeylik a Salih Reis {cite:dawlat-uthmaniyya-salabi p. 229-235}. Tras la muerte de Hasan Corso en 964/1557, el sultán lo restituyó; reclutó a diez mil zawawa, se casó con la hija del sultán Kuku, puso a Bu Yahya al frente de Badis, luchó contra Abd al-Aziz b. Abbas de Qal'at Bani Abbas hasta su caída y reconoció a su sucesor Ahmad Muqran. Los jenízaros, temiendo que pretendiera la independencia, lo arrestaron en el verano de 969/1561 y lo enviaron a Estambul, pero el sultán lo devolvió por tercera vez a finales de 970/1562 con diez buques de guerra. Sitió Orán el 13 de abril de 1563 con quince mil mosqueteros, mil jinetes y doce mil hombres de Zawawa y Bani Abbas, levantándola a medida que llegaban los refuerzos; participó en el asedio de Malta de 973/1565 con veinticinco barcos y tres mil hombres; y en 975/1567 Selim II lo nombró comandante en jefe de la flota {cite:dawlat-uthmaniyya-salabi p. 245-252}."
  fr: "Fils de Khayr al-Din Barberousse, issu d'une illustre famille algérienne du côté maternel, il fut gouverneur d'Alger pour la Sublime Porte de 951 à 1544. Il renforça les points faibles de la ville, mis en évidence par l'attaque de Charles Quint, empêcha les troupes d'Oran de rétablir Abou Zayyan Ahmad II à Tlemcen, sécurisa la garnison ottomane du château d'al-Mashwar et chassa les Sa'dis en 959 (1551, date imprimée: 1151). Cependant, son hostilité envers toutes les puissances étrangères, y compris la France, et son refus de l'aide militaire de l'envoyé français (« le djihad est l'affaire des musulmans; je ne vaincrai pas par un infidèle contre un infidèle ») permirent à ce dernier de corrompre la Sublime Porte: Soliman le déposa en Safar 960 (janvier 1552) et confia le beylerbeylik à Salih Reis. 229-235}. Après la mort d'Hasan Corso en 964/1557, le sultan le rétablit dans ses fonctions; il leva dix mille Zawawa, épousa la fille du sultan Kuku, installa Bu Yahya à la tête de Badis, combattit Abd al-Aziz b. Abbas de Qal'at Bani Abbas jusqu'à sa chute et reconnut son successeur, Ahmad Muqran. Les janissaires, craignant qu'il ne cherche l'indépendance, l'arrêtèrent à l'été 969/1561 et l'emmenèrent à Istanbul; cependant, le sultan le ramena une troisième fois fin 970/1562 avec dix navires de guerre. Il assiégea Oran le 13 avril 1563 avec quinze mille mousquetaires, mille cavaliers et douze mille Zawawa et Bani Abbas, et leva la ville à l'arrivée des renforts; il participa au siège de Malte en 973/1565 avec vingt-cinq navires et trois mille hommes; et en 975/1567 Selim II le nomma commandant en chef de la flotte {cite:dawlat-uthmaniyya-salabi p. 245-252}."
  ur: "خیرالدین بارباروسا کا بیٹا، اپنی والدہ کی طرف سے ایک مشہور الجزائری خاندان سے؛ 951/1544 سے الجزائر کا پورٹ کا گورنر۔ اس نے چارلس پنجم کے حملے سے دکھائے گئے شہر کے کمزور مقامات کو بحال کیا، اورن فورس کو ابو زیان احمد II کو تلمسن میں بحال کرنے سے روک دیا، المشور قلعہ میں عثمانی فوج کی چھاؤنی کو محفوظ بنایا، اور 959/1551 تک سعدیوں کو بھگا دیا ⁦(مطبوعہ '1151')⁩۔ لیکن تمام غیر ملکی طاقتوں کے ساتھ اس کی دشمنی - جس میں فرانس بھی شامل تھا - اور فرانسیسی ایلچی کی فوجی امداد سے انکار ⁦('جہاد مسلمانوں کا معاملہ ہے؛ میں کسی کافر سے کسی کافر کے خلاف نہیں جیتوں گا')⁩ ایلچی کو پورٹ کے کان میں زہر آلود کرنے دیتا ہے: سلیمان نے صفر 960/جنوری 1552 کو اسے معزول کر دیا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 229-235}۔ 964/1557 میں حسن کورسو کی موت کے بعد سلطان نے اسے بحال کیا۔ اس نے دس ہزار زاویہ اٹھائے، سلطان کوکو کی بیٹی سے شادی کی، بو یحییٰ کو بادیس پر کھڑا کیا، عبد العزیز بن سے لڑا۔ عباس قلات بنی عباس کے زوال تک، اور اپنے جانشین احمد مقرن کو پہچانا۔ جنیسریوں نے، اس خوف سے کہ اس کا مطلب آزادی ہے، اسے 969/1561 کے موسم گرما میں گرفتار کیا اور اسے استنبول بھیج دیا - پھر بھی سلطان نے اسے تیسری بار 970/1562 کے آخر میں دس جنگی جہازوں کے ساتھ واپس کیا۔ اس نے 13 اپریل 1563 کو اوران کا محاصرہ کر کے پندرہ ہزار مشکیت کاروں، ایک ہزار گھوڑوں اور بارہ ہزار زاویہ اور بنی عباس کے ساتھ مل کر امدادی سامان کے طور پر اٹھا لیا۔ 973/1565 کے مالٹا کے محاصرے میں پچیس جہازوں اور تین ہزار آدمیوں کے ساتھ شریک ہوئے۔ اور 975/1567 میں سلیم ثانی نے انہیں بحری بیڑے کا کمانڈر انچیف بنایا۔ 245-252}۔"
  tr: "İbn Hayreddin Barbarossa; Hasan Ağa el-Tuşi'nin ölümünden sonra Yüce Kapı tarafından Cezayir valisi olarak atandı; Cezayir 951 Hicri / 1544 yılında buraya geldi. Annesi tanınmış bir Cezayirli aileden geliyordu. Varışında, V. Charles'ın saldırısıyla zayıflayan bölgelerde Cezayir şehrini tahkim etti, ardından Tlemcen meselesini çözmeye yöneldi: İslam ordusuna liderlik etti, İspanyol Oran kuvvetlerinin Abu Zayan Ahmad II'yi geri almasını engelledi, müttefiki Kral Hassan'ı destekledi ve komutan Muhammed komutasında Al-Mishwar kalesinde bir garnizon bıraktı. Saadlıları Tlemcen'den kovdu ve 959 Hicri/1551 M.S.'de Osmanlı yönetimini pekiştirdi (basılı metin \"1151 AD\"). Ancak, Fransa da dahil olmak üzere tüm yabancı güçlere karşı bir politika benimsedi ve elçinin askeri yardım teklifini reddetti; cihat meselesinin sadece Müslümanlara özgü olduğunu ve hiçbir kâfirin diğerini yenemeyeceğini söyledi. Büyükelçi, mutlak otoritesinin devletin birliğini yok edeceğine inanarak Yüce Kapı'yı kandırdı. Sultan Süleyman, Sefer 960 Hicri / Ocak 1552'de Fas ile iyi komşuluğu zedelediği suçlamasıyla onu görevden aldı ve İncil otoritesini Salih Rice'a verdi {cite:dawlat-uthmaniyya-salabi s. 229-235}. Hasan Qorsu'nun 964 Hicri/1557 yılında ölümünden sonra Sultan onu Cezayir'e geri gönderdi; on bin Zouawa topladı ve Sultan Koku bin el-Kadi'nin kızıyla evlendi, Badis'in başına Bouyahya al-Rais'i atadı; bu da İspanyol seyrüseferini kısıtladı ve Bani Abbas kalesinin emiri Abdülaziz bin Abbas ile savaştı; ta ki öldürülene ve halefi Ahmed Muqran tanınana kadar. Sonra Yeniçeriler onu 969 Hicri/1561 yazında bağımsızlık niyetiyle tutukladılar, bu yüzden zincirlerle İstanbul'a gönderildi, ancak Sultan onu üçüncü kez 970 Hicri/1562 MS sonlarında on gemiyle takviye ederek geri verdi. 13 Nisan 1563'te Oran'ı on beş bin tüfek, bin süvari ve Zouawa ile Bani Abbas'tan on iki bin askerle kuşattı, ardından takviyeleri sürekli takviye etmek için kuşatmayı kaldırdı. 973 Hicri/1565 yılında Malta kuşatmasına yirmi beş gemi ve üç bin adamla katıldı; ta ki Selim II ona 975 Hicri/1567 M.S. yılında genel filonun komutasını emanet edene kadar {cite:dawlat-uthmaniyya-salabi, s. 245-252}."
  id: "Ibn Khayr al-Din Barbarossa; diangkat oleh Sublime Porte sebagai gubernur Aljazair setelah kematian Hassan Agha al-Tushi, yang datang ke sana pada tahun 951 H / 1544 M. Ibunya berasal dari keluarga Aljazair yang terkenal. Setibanya di sana, ia memperkuat kota Aljir di daerah yang melemah akibat serangan Charles V, lalu beralih menyelesaikan masalah Tlemcen: ia memimpin tentara Islam, mencegah pasukan Oran Spanyol merebut kembali Abu Zayan Ahmad II, mendukung sekutunya Raja Hassan, dan meninggalkan garnisun di bawah komandan Muhammad di benteng Al-Mishwar. Ia mengusir orang Saadis dari Tlemcen dan memperkuat kekuasaan Ottoman di sana pada 959 H/1551 M (teks cetak \"1151 M\"). Namun, ia mengadopsi kebijakan yang menentang semua kekuatan asing, termasuk Prancis, dan menolak tawaran bantuan militer duta besarnya, dengan alasan bahwa isu jihad hanya ditujukan oleh Muslim dan tidak ada kafir yang bisa mengalahkan yang lain. Duta besar menipu Sublime Porte, percaya bahwa otoritas mutlaknya akan menghancurkan kesatuan negara. Sultan Suleiman memecatnya pada Safar 960 H / Januari 1552 M dengan tuduhan merugikan lingkungan baik dengan Maroko dan menyerahkan otoritas alkitabiah kepada Saleh Rice {cite:dawlat-uthmaniyya-salabi hlm. 229-235}. Setelah kematian Hassan Qorsu pada tahun 964 H/1557 M, Sultan mengembalikannya ke Aljazair; ia merekrut sepuluh ribu Zouawa dan menikahi putri Sultan Koku bin al-Qadi, mengangkat Bouyahya al-Rais atas Badis, yang membatasi navigasi Spanyol, dan bertempur melawan Abd al-Aziz ibn Abbas, Emir benteng Bani Abbas, hingga ia tewas dan penerusnya Ahmad Muqran diakui. Kemudian para Janissari menangkapnya pada musim panas 969 H/1561 M, menuduhnya berniat merdeka, sehingga ia dikirim dengan rantai ke Istanbul, tetapi Sultan mengembalikannya untuk ketiga kalinya pada akhir 970 H/1562 M, diperkuat dengan sepuluh kapal. Ia mengepung Oran pada 13 April 1563 M, dengan lima belas ribu senapan, seribu kavaleri, dan dua belas ribu dari Zouawa dan Bani Abbas, lalu mengangkat pengepungan untuk terus memperkuat bala bantuan. Ia ikut serta dalam pengepungan Malta pada tahun 973 H/1565 M dengan dua puluh lima kapal dan tiga ribu orang, hingga Selim II mempercayakan kepadanya untuk memimpin armada umum pada tahun 975 H/1567 M {cite:dawlat-uthmaniyya-salabi, hlm. 245-252}."
