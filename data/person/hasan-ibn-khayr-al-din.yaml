summary:
  ar: "ابن خير الدين بربروسة؛ عيّنه الباب العالي حاكماً على الجزائر بعد وفاة حسن آغا الطوشي فقدمها سنة ٩٥١هـ/١٥٤٤م، ووالدته من الأسر الجزائرية المعروفة. حال وصوله حصّن مدينة الجزائر في المواضع التي كشف هجوم شارل الخامس ضعفها، ثم انصرف إلى حل مشكلة تلمسان: قاد الجيش الإسلامي فمنع قوة وهران الإسبانية من إعادة أبو زيان أحمد الثاني، ودعم حليفه الملك حسن وترك حامية بقيادة القائد محمد في قلعة المشوار. وطرد السعديين من تلمسان ووطد الحكم العثماني فيها سنة ٩٥٩هـ/١٥٥١م (النص المطبوع «١١٥١م»). غير أنه انتهج سياسة مضادة لكل القوى الأجنبية ومنها فرنسا، ورفض عرض سفيرها بالمساعدة العسكرية قائلاً إن قضية الجهاد خاصة بالمسلمين وإنه لا ينتصر بكافر على كافر، فأوغر السفير صدر الباب العالي بأن سلطته المطلقة ستحطم وحدة الدولة، فعزله السلطان سليمان في صفر ٩٦٠هـ/يناير ١٥٥٢م بدعوى الإساءة إلى حسن الجوار مع المغرب وأسند البكلربكية إلى صالح رايس {cite:dawlat-uthmaniyya-salabi p. 229-235}. وبعد مصرع حسن قورصو سنة ٩٦٤هـ/١٥٥٧م أعاده السلطان إلى الجزائر؛ فجند عشرة آلاف من زواوة وتزوج ابنة سلطان كوكو بن القاضي، وعين بويحيى الرايس على باديس التي ضيقت على الملاحة الأسبانية، وحارب عبد العزيز بن عباس أمير قلعة بني عباس حتى قتل واعترف بخلفه أحمد مقران. ثم اعتقلته الإنكشارية صيف ٩٦٩هـ/١٥٦١م متّهمة إياه بنية الاستقلال فأرسل مقيداً إلى استانبول، لكن السلطان أعاده للمرة الثالثة أواخر ٩٧٠هـ/١٥٦٢م معززاً بعشر سفن. فحاصر وهران في ١٣ أبريل ١٥٦٣م بخمس عشرة ألف بندقية وألف فارس واثني عشر ألفاً من زواوة وبني عباس ثم رفع الحصار لتوالي النجدات، وشارك في حصار مالطة ٩٧٣هـ/١٥٦٥م بخمس وعشرين سفينة وثلاثة آلاف رجل، حتى أسند إليه سليم الثاني قيادة الأسطول العامة سنة ٩٧٥هـ/١٥٦٧م {cite:dawlat-uthmaniyya-salabi p. 245-252}."
  en: "Khayr al-Din Barbarossa's son, of a noted Algerian family on his mother's side; the Porte's governor of Algiers from 951/1544. He refortified the city's weak points shown by Charles V's attack, kept the Oran force from restoring Abu Zayyan Ahmad II at Tlemcen, secured the Ottoman garrison at al-Mashwar castle, and drove the Sa'dis out by 959/1551 (printed '1151'). But his hostility to all foreign powers — France included — and his refusal of the French envoy's military aid ('jihad is the Muslims' affair; I will not win by an infidel against an infidel') let the envoy poison the Porte's ear: Süleyman deposed him in Safar 960/January 1552, giving the beylerbeylik to Salih Reis {cite:dawlat-uthmaniyya-salabi p. 229-235}. After Hasan Corso's death in 964/1557 the sultan restored him; he raised ten thousand Zawawa, married Sultan Kuku's daughter, set Bu Yahya over Badis, fought Abd al-Aziz b. Abbas of Qal'at Bani Abbas until his fall, and recognised his successor Ahmad Muqran. The Janissaries, fearing he meant independence, arrested him in summer 969/1561 and shipped him bound to Istanbul — yet the sultan returned him a third time in late 970/1562 with ten warships. He besieged Oran on 13 April 1563 with fifteen thousand musketeers, a thousand horse, and twelve thousand Zawawa and Bani Abbas, lifting it as relief converged; shared in the Malta siege of 973/1565 with twenty-five ships and three thousand men; and in 975/1567 Selim II made him commander-in-chief of the fleet {cite:dawlat-uthmaniyya-salabi p. 245-252}."
