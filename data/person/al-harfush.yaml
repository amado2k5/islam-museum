summary:
  ar: "صاحب كتاب الحرفيش في الوعظ؛ كان رجلاً عالماً زاهداً صوفياً واعظاً مشهوراً بالخير وللناس فيه اعتقاد زائد ويخبر بأشياء فتقع كما يقول، وجاور بمكة أكثر من ثلاثين سنة ومات في أول سنة إحدى وثمانمائة {cite:shadharat-dhahab p. 15}."
  en: "Author of the book al-Harfish on wa'z (preaching): a learned, ascetic Sufi preacher renowned for his goodness, whom people held in exceptional esteem and who foretold events that came to pass as he said. He lived in Mecca for over thirty years and died at the beginning of 801 {cite:shadharat-dhahab p. 15}."
  fr: "Auteur du livre al-Harfish sur le wa’z (prédication) : prédicateur soufi savant et ascète, réputé pour sa bonté, auquel les gens vouaient une estime exceptionnelle et qui, selon le récit, annonçait des événements se réalisant comme il l’avait dit. Il vécut à La Mecque plus de trente ans et mourut au début de 801 H {cite:shadharat-dhahab p. 15}."
  es: "Autor del libro al-Harfish sobre el wa'z (la predicación): un erudito y asceta predicador sufí, reconocido por su bondad, a quien la gente tenía en excepcional estima y que predijo acontecimientos que se cumplieron tal como los anunció. Vivió en La Meca durante más de treinta años y falleció a principios del año 801 {cita: shadharat-dhahab, pág. 15}."
  ur: "کتاب الحرفش آن واز ⁦(تبلیغ)⁩ کے مصنف: ایک عالم، صوفی مبلغ جو اپنی نیکی کے لیے مشہور تھے، جن کی لوگ غیر معمولی عزت کرتے تھے اور جس نے ان واقعات کی پیشین گوئی کی تھی جو اس کے کہنے کے مطابق پیش آئیں۔ وہ تیس سال سے زیادہ مکہ میں رہے اور 801 کے شروع میں وفات پائی۔ 15}۔"
