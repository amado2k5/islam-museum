summary:
  en: "A Mudliji horseman who chased the bounty on the fugitives; when his mare sank beneath him twice he sought safe-conduct instead, and spent the rest of the day turning pursuers away — 'the day's beginning against them, its end guarding them'."
  ar: "فارس مدلجي خرج في طلب الجائزة المرصودة للقبض على النبي وأبي بكر؛ فلما ساخت يدا فرسه في الأرض مرتين ناداهم بالأمان وعرض عليهم الزاد، ثم رجع يصرف الطلب عنهما — فكان أول النهار جاهداً عليهما وآخره حارساً لهما."
  es: "Un jinete Mudliji que perseguía la recompensa por los fugitivos; cuando su yegua se hundió dos veces, pidió salvoconducto y pasó el resto del día ahuyentando a sus perseguidores: \"el día comenzó en su contra y terminó protegiéndolos\"."
  fr: "Un cavalier Mudliji qui poursuivait les fugitifs pour la prime offerte; lorsque sa jument s'est effondrée sous lui à deux reprises, il a plutôt demandé un sauf-conduit et a passé le reste de la journée à repousser ses poursuivants — « le début de la journée contre eux, sa fin à les protéger »."
  ur: "ایک مڈلیجی گھڑ سوار جس نے مفروروں پر فضل کا پیچھا کیا۔ جب اس کی گھوڑی اس کے نیچے دو بار ڈوب گئی تو اس کے بجائے اس نے حفاظت کی تلاش کی، اور باقی سارا دن تعاقب کرنے والوں کو دور کرنے میں گزارا - 'ان کے خلاف دن کا آغاز، اس کا انجام ان کی حفاظت میں'۔"
  tr: "Faris Madlaji, Peygamber ve Ebu Bekir'in yakalanması için ayrılan ödülü aramak üzere dışarı çıktı; atını yere indirdiğinde, güvenlik için onları iki kez çağırdı ve erzak sundu, sonra isteklerini geri çekmek için geri döndü — ve ilk günü onlara karşı mücadele ederek ve sonunda onları koruyarak geçirdi."
  id: "Faris Madlaji pergi mencari hadiah yang disediakan untuk menangkap Nabi dan Abu Bakr; ketika kudanya sudah di tanah, ia memanggil mereka dua kali untuk keselamatan dan menawarkan bekal, lalu kembali untuk menarik permintaan itu — dan ia menghabiskan hari pertama melawan mereka dan menjaga mereka di akhir hari."
