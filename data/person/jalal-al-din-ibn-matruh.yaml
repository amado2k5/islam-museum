summary:
  ar: "جلال الدين أبو الحسين يحيى بن عبد العظيم بن يحيى بن محمد بن علي بن إبراهيم بن الحسين بن مطروح المصري؛ من أهل صعيد مصر ونشأ بها وقام بقوص مدة وتنقل في الأعمال والولايات ثم اتصل بخدمة السلطان الملك الصالح أبي الفتح أيوب نجم الدين ابن الملك الكامل وكان إذ ذاك نائباً عن أبيه بالديار المصرية، فلما ملك الملك الصالح دمشق صار ابن مطروح في صورة وزير لها، وله محاسن في الشعر؛ وقال ابن خلكان: وكنت ألازمه فتأخرت عنه مدة وكنت إذ ذاك نائباً في الحكم بالقاهرة المحروسة عن قاضي القضاة بدر الدين المعروف بقاضي سنجار {cite:wafayat-ayan}."
  en: "Jalal al-Din Yahya b. Abd al-Azim Ibn Matruh — of Asyut via Qus; served al-Malik al-Salih Najm al-Din Ayyub as his father's na'ib, then as vizier of Damascus; Ibn Khallikan, then deputy qadi of Cairo under Badr al-Din b. Jama'a, records their acquaintance first-hand {cite:wafayat-ayan}."
  es: "Jalal al-Din Yahya b. Abd al-Azim Ibn Matruh — de Asyut vía Qus; sirvió a al-Malik al-Salih Najm al-Din Ayyub como na'ib de su padre, luego como visir de Damasco; Ibn Khallikan, entonces cadí adjunto de El Cairo bajo Badr al-Din b. Jama'a, registra su relación de primera mano {cite:wafayat-ayan}."
  fr: "Jalal al-Din Yahya b. Abd al-Azim Ibn Matruh — d'Assiout via Qus; a servi al-Malik al-Salih Najm al-Din Ayyub comme na'ib de son père, puis comme vizir de Damas; Ibn Khallikan, alors cadi adjoint du Caire sous Badr al-Din b. Jama'a, enregistre leur connaissance de première main {cite: wafayat-ayan}."
  ur: "جلال الدین یحییٰ بی۔ عبد العظیم ابن مطروح - اسیوت بذریعہ قوس؛ المالک الصالح نجم الدین ایوب کو اپنے والد کے نائب، پھر دمشق کے وزیر کے طور پر خدمات انجام دیں۔ ابن خلقان، بدر الدین کے ماتحت قاہرہ کا نائب قادی۔ جماعۃ، ان کے شناسا کو پہلے ہاتھ سے درج کرتی ہے۔"
