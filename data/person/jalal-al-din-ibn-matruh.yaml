summary:
  ar: "جلال الدين أبو الحسين يحيى بن عبد العظيم بن يحيى بن محمد بن علي بن إبراهيم بن الحسين بن مطروح المصري؛ من أهل صعيد مصر ونشأ بها وقام بقوص مدة وتنقل في الأعمال والولايات ثم اتصل بخدمة السلطان الملك الصالح أبي الفتح أيوب نجم الدين ابن الملك الكامل وكان إذ ذاك نائباً عن أبيه بالديار المصرية، فلما ملك الملك الصالح دمشق صار ابن مطروح في صورة وزير لها، وله محاسن في الشعر؛ وقال ابن خلكان: وكنت ألازمه فتأخرت عنه مدة وكنت إذ ذاك نائباً في الحكم بالقاهرة المحروسة عن قاضي القضاة بدر الدين المعروف بقاضي سنجار {cite:wafayat-ayan}."
  en: "Jalal al-Din Yahya b. Abd al-Azim Ibn Matruh — of Asyut via Qus; served al-Malik al-Salih Najm al-Din Ayyub as his father's na'ib, then as vizier of Damascus; Ibn Khallikan, then deputy qadi of Cairo under Badr al-Din b. Jama'a, records their acquaintance first-hand {cite:wafayat-ayan}."
