label: { ar: "الحسن الأعشم القرمطي" }
summary:
  ar: "الحسن بن أحمد الأعشم، من قادة القرامطة بالأحساء؛ سار ومقدمتهم من الأحساء إلى ديار مصر سنة 363هـ فحصرها فكتب إليه المعز لدين الله كتاباً يذكر فيه نسب نفسه وأهل بيته وأن الدعوة واحدة وأن دعوتهم إنما كانت إليه وإلى آبائه من قبله ووعده وبالغ وتهدده، فلما وصله الكتاب كتب تحته «قُلّ تحصيلك وكثّر تخويفك ونحن سائرون إليك على أثره والسلام» وسار حتى نزل على مصر {cite:kamil-ibn-al-athir p. 470}."
  en: "Al-Hasan al-A'sam the Qarmatian; he marched the Bahrayn host on Egypt in 363. To al-Mu'izz's letter urging common allegiance and threats he answered on the same sheet: 'Write less, threaten less — we are marching on it behind this letter' {cite:kamil-ibn-al-athir p. 470}."
