id: person/hasan-al-asam
class: person
label: { ar: "الحسن الأعشم القرمطي" }
summary:
  ar: "الحسن بن أحمد الأعشم، من قادة القرامطة بالأحساء؛ سار ومقدمتهم من الأحساء إلى ديار مصر سنة 363هـ فحصرها فكتب إليه المعز لدين الله كتاباً يذكر فيه نسب نفسه وأهل بيته وأن الدعوة واحدة وأن دعوتهم إنما كانت إليه وإلى آبائه من قبله ووعده وبالغ وتهدده، فلما وصله الكتاب كتب تحته «قُلّ تحصيلك وكثّر تخويفك ونحن سائرون إليك على أثره والسلام» وسار حتى نزل على مصر {cite:kamil-ibn-al-athir p. 470}."
  en: "Al-Hasan al-A'sam the Qarmatian; he marched the Bahrayn host on Egypt in 363. To al-Mu'izz's letter urging common allegiance and threats he answered on the same sheet: 'Write less, threaten less — we are marching on it behind this letter' {cite:kamil-ibn-al-athir p. 470}."
  es: "Al-Hasan al-A'sam el Cármata; marchó con el ejército de Bahrayan sobre Egipto en 363. A la carta de al-Mu'izz que instaba a la lealtad común y contenía amenazas, respondió en la misma hoja: 'Escriba menos, amenace menos; marchamos tras esta carta' {cite:kamil-ibn-al-athir p. 470}."
  fr: "Al-Hasan al-A'sam le Qarmate; il a fait marcher l'armée de Bahrayn sur l'Égypte en 363. À la lettre d'al-Mu'izz exhortant à une allégeance commune et aux menaces, il a répondu sur la même feuille: « Écrivez moins, menacez moins — nous marchons sur ce terrain derrière cette lettre » {cite: kamil-ibn-al-athir p. 470}."
  tr: "Al-Hasan ibn Ahmed al-A'sham, Al-Ahsa'daki Karmatlı liderlerden biri, 363 Hicri yılında liderleriyle birlikte Al-Ahsa'dan Mısır topraklarına yürüdü, kuşattı ve Al-Mu'izz li-Din Allah ona soyunu ve ailesinin bir olduğunu belirten bir mektup yazdı; çağrılarının sadece ona ve ondan önceki atalarına ait olduğunu, vaat ve uyarıda bulunduğunu belirtti. Mektubu aldığında şöyle yazdı: \"Takibini azalt ve korkularını artır, biz de onun izinden gideceğiz. Selamün aleyküm.\" Mısır'a yerleşene kadar yola çıktı {cite:kamil-ibn-al-athir, s. 470}."
  id: "Al-Hasan ibn Ahmad al-A'sham, salah satu pemimpin Qarmatia di Al-Ahsa, berbaris bersama pemimpin mereka dari Al-Ahsa ke tanah Mesir pada tahun 363 H, mengepungnya, dan Al-Mu'izz li-Din Allah menulis surat kepadanya yang menyebutkan garis keturunannya dan bahwa keluarganya adalah satu, dan panggilan mereka hanya kepada dirinya dan leluhurnya sebelum ini, menjanjikan dan memperingatkannya. Ketika menerima surat itu, ia menulis: \"Kurangi pengejaranmu dan tingkatkan ketakutanmu, maka kami akan mengikuti jejaknya. Salam sejahtera.\" Ia berangkat hingga menetap di Mesir {cite:kamil-ibn-al-athir, hlm. 470}."
