summary:
  ar: "خيرول تانجونغ (وُلد في 18 حزيران 1962 في جاكرتا) رجل أعمال إندونيسي، مؤسس ورئيس مجموعة سي تي كورب التي تضم بنك ميغا وقناتي ترانس وترانس7 التلفزيونيتين ومتاجر ترانسمارت والعقارات؛ تخرج في طب الأسنان في جامعة إندونيسيا وبدأ التجارة طالبًا، وتولى منصب وزير تنسيق الشؤون الاقتصادية سنة 2014، وعُين في مجلس مستشاري رئيس الجمهورية سنة 2026."
  en: "Chairul Tanjung (born 18 June 1962 in Jakarta) is an Indonesian businessman, founder and chairman of CT Corp, the conglomerate spanning Bank Mega, the Trans TV and Trans7 channels, Transmart retail and property; a dentistry graduate of the University of Indonesia who began trading as a student, he served as Coordinating Minister for Economic Affairs in 2014 and was appointed to the Presidential Advisory Council in 2026."
  ur: "خیرول تانجونگ (پیدائش 18 جون 1962، جکارتہ) انڈونیشیائی کاروباری ہیں، سی ٹی کارپ کے بانی و چیئرمین، جس میں بینک میگا، ٹرانس ٹی وی اور ٹرانس 7 چینلز، ٹرانس مارٹ خردہ فروشی اور جائیداد شامل ہیں؛ یونیورسٹی آف انڈونیشیا سے دندان سازی کے فارغ التحصیل، انھوں نے طالب علمی میں تجارت شروع کی، 2014 میں معاشی امور کے رابطہ وزیر رہے اور 2026 میں صدارتی مشاورتی کونسل کے رکن بنے۔"
