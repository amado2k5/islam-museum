summary:
  ar: "غسان بن عباد من أهل سواد الكوفة؛ وجهه المأمون إلى بشر بن داود فأخرجه في الأمان وورد به مدينة السلام وخلف على ثغر السند موسى بن يحيى البرمكي."
  en: "Ghassan ibn Abbad of Kufa's sawad; al-Ma'mun's man who drew Bishr ibn Dawud out in aman and left Musa ibn Yahya al-Barmaki over the thaghr."
  es: "Ghassan ibn Abbad del sawad de Kufa; El hombre de al-Ma'mun que sacó a Bishr ibn Dawud en aman y dejó a Musa ibn Yahya al-Barmaki sobre el thaghr."
  fr: "Ghassan ibn Abbad du sawad de Kufa; l'homme d'al-Ma'mun qui a attiré Bishr ibn Dawud à aman et a laissé Musa ibn Yahya al-Barmaki sur le thaghr."
  ur: "غسان بن عباد کوفہ کے سواد؛ المامون کا وہ شخص جس نے بشر بن داؤد کو امان میں نکالا اور موسیٰ بن یحییٰ برمکی کو طغر پر چھوڑ دیا۔"
  tr: "Savad Kufe halkından Gassan ibn 'Abbad; el-Me'mun onu Bişr bin Davud'a gönderdi, o da onu güvenliğe götürdü, barış şehrine getirdi ve zincirin sınırında Musa ibn Yahya el-Barmaki'nin yerine geçti."
  id: "Ghassan ibn 'Abbad dari suku Sawad Kufa; al-Ma'mun mengirimnya kepada Bishr ibn Dawud, yang membawanya ke tempat aman, membawanya ke kota damai, dan menggantikan Musa ibn Yahya al-Barmaki di perbatasan rantai tersebut."
