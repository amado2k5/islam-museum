label: { ar: "حاتم الطائي", en: "Hatim al-Ta'i", es: "Hatim al-Ta'i", fr: "Hatim al-Ta'i", ur: "حاتم الطائی" }
summary:
  ar: "الجود المضروب به المثل، وقبره ببقة أعلى جبل لواد يقال له الخابل عند المسعودي، وعن يمين قبره أربع جوار من حجارة وعن يساره أربع كلهن صاحبة شعر منشور محتجرات على قبره كالنائحات عليه لم ير مثل بياض أجسامهن، فإذا هدأت العيون سمعت أصوات الجن بالنياحة عليه إلى أن يطلع الفجر، وحديث أبي البختري الذي نادى قبره أقرنا فعقر له حاتم ناقته ثم أتاه عدي بن حاتم ببعير مكانها إنفاذاً لما أراه في النوم، قال سالم بن زرارة الغطفاني قرى قبره الأضياف إذ نزلوا به ولم يقر قبر قبله الدهر راكباً {cite:muruj-al-dhahab p. 474-476}."
  en: "The proverb of generosity — his grave at Baqqa above the wadi al-Khabil is flanked by eight stone maids with loosed hair like mourners, whose laments are heard by night; the tale of Abu al-Bakhtari whose camel Hatim hamstrung from the grave until Adi replaced it, sent in a dream, made his tomb proverbial for hospitality itself {cite:muruj-al-dhahab p. 474-476}."
  es: "El proverbio de la generosidad: su tumba en Baqqa, sobre el wadi al-Khabil, está flanqueada por ocho doncellas de piedra con el cabello suelto como plañideras, cuyos lamentos se oyen por la noche; la historia de Abu al-Bakhtari, cuyo camello Hatim quedó cojo de la tumba hasta que Adi lo reemplazó, enviado en un sueño, hizo que su tumba fuera proverbial por la hospitalidad misma {cite:muruj-al-dhahab p. 474-476}."
  fr: "Le proverbe de la générosité — sa tombe à Baqqa au-dessus du wadi al-Khabil est flanquée de huit servantes de pierre aux cheveux défaits comme des pleureuses, dont les lamentations sont entendues la nuit; l'histoire d'Abu al-Bakhtari dont le chameau Hatim a été attaché à la tombe jusqu'à ce qu'Adi le remplace, envoyé en rêve, a fait de sa tombe un symbole d'hospitalité {cite:muruj-al-dhahab p. 474-476}."
  ur: "سخاوت کی کہاوت - وادی الخبیل کے اوپر بقعہ میں اس کی قبر پر آٹھ پتھر کی لونڈیاں ہیں جن کے بال سوگواروں کی طرح کھلے ہوئے ہیں، جن کی آہیں رات کو سنائی دیتی ہیں۔ ابو البختاری کی کہانی جس کی اونٹنی حاتم نے قبر سے کٹا ہوا تھا یہاں تک کہ عدی نے اس کی جگہ لے لی، خواب میں بھیجا، اس کی قبر کو مہمان نوازی کے لیے کہاوت بنا دیا۔ 474-476}۔"
  tr: "'al-joud' atasözü Kur'an'da geçer. Mezarı Baka'da, el-Mes'udi'ye göre El-Khabil adlı vadide bir dağın tepesindedir. Sağında dört taş, solunda dört taş vardır; hepsinin saçları yayılmış ve mezarının üzerine taşlanmış, bedenlerinin beyazlığını hiç görmemiş yas tutanlar gibidir. Gözler sakinleştiğinde, şafak ağlarına kadar cinlerin onun için ağıt sesleri duyar. Mezar çağıran Ebu el-Bahtari'nin hadisi boğuktu, bu yüzden Hatim devesini kesti, ardından 'Adi ibn Hatim ona yerine bir deve getirdi ve uykusunda gördüklerini gerçekleştirdi. Salim bin Zurara el-Ghatfani, misafirlerin orada kaldıklarında mezarını ziyaret ettiklerini ve önünde hiçbir mezarın zamanla yerleşmediğini söyledi. {atıf:Muruj-al-Dhahab s. 474-476}."
  id: "Peribahasa 'al-joud' disebutkan dalam Al-Qur'an. Makamnya berada di Baqa, di puncak gunung di lembah yang disebut Al-Khabil menurut al-Mas'udi. Di sebelah kanannya ada empat batu dan di sebelah kirinya empat, semuanya dengan rambut terurai dan dilempari batu di atas makamnya, seperti para pelayat yang belum pernah melihat tubuh mereka yang putih. Ketika mata tenang, suara jin yang meratap untuknya hingga fajar terdengar. Hadits Abu al-Bakhtari, yang menyebut makamnya, bersuara serak, sehingga Hatim menyembelih untanya, lalu 'Adi ibn Hatim membawakan seekor unta sebagai gantinya, memenuhi apa yang dilihatnya dalam tidurnya. Salim ibn Zurara al-Ghatfani mengatakan bahwa para tamu mengunjungi makamnya saat mereka tinggal di sana, dan tidak ada makam sebelum dia yang pernah ditempati oleh perjalanan waktu. {cite:Muruj-al-Dhahab hlm. 474-476}."
