label: { ar: "حاتم الطائي", en: "Hatim al-Ta'i" }
summary:
  ar: "الجود المضروب به المثل، وقبره ببقة أعلى جبل لواد يقال له الخابل عند المسعودي، وعن يمين قبره أربع جوار من حجارة وعن يساره أربع كلهن صاحبة شعر منشور محتجرات على قبره كالنائحات عليه لم ير مثل بياض أجسامهن، فإذا هدأت العيون سمعت أصوات الجن بالنياحة عليه إلى أن يطلع الفجر، وحديث أبي البختري الذي نادى قبره أقرنا فعقر له حاتم ناقته ثم أتاه عدي بن حاتم ببعير مكانها إنفاذاً لما أراه في النوم، قال سالم بن زرارة الغطفاني قرى قبره الأضياف إذ نزلوا به ولم يقر قبر قبله الدهر راكباً {cite:muruj-al-dhahab p. 474-476}."
  en: "The proverb of generosity — his grave at Baqqa above the wadi al-Khabil is flanked by eight stone maids with loosed hair like mourners, whose laments are heard by night; the tale of Abu al-Bakhtari whose camel Hatim hamstrung from the grave until Adi replaced it, sent in a dream, made his tomb proverbial for hospitality itself {cite:muruj-al-dhahab p. 474-476}."
