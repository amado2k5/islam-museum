summary:
  ar: "محمد مصدق (1882–1967)، محامٍ وسياسي إيراني، رئيس وزراء إيران من 1951 إلى 1953. درس الحقوق في فرنسا وسويسرا ونال الدكتوراه، وقاد تأميم شركة النفط الأنجلو-إيرانية فأطاح به انقلاب آب 1953 المدعوم أمريكيًا وبريطانيًا، وحُوكم أمام محكمة عسكرية ثم عاش تحت الإقامة الجبرية في أحمد آباد حتى وفاته في 5 آذار 1967."
  en: "Mohammad Mosaddegh (1882–1967) was an Iranian lawyer and politician, prime minister of Iran from 1951 to 1953. Educated in law in France and Switzerland, where he took a doctorate, he led the nationalisation of the Anglo-Iranian Oil Company, was overthrown in the August 1953 coup backed by the United States and Britain, tried before a military court, and lived under house arrest at Ahmadabad until his death on 5 March 1967."
  ur: "محمد مصدق (1882ء–1967ء) ایرانی وکیل اور سیاست دان تھے، 1951ء سے 1953ء تک ایران کے وزیرِ اعظم رہے۔ انہوں نے فرانس اور سوئٹزرلینڈ میں قانون کی تعلیم اور ڈاکٹریٹ حاصل کی، اینگلو-ایرانین آئل کمپنی کی قومی تحویل کی قیادت کی، اگست 1953ء کی امریکی و برطانوی حمایت یافتہ بغاوت میں معزول ہوئے، فوجی عدالت میں مقدمہ چلا اور 5 مارچ 1967ء کو وفات تک احمد آباد میں نظر بند رہے۔"
