summary:
  ar: "مصرفي وسياسي باكستاني (وُلد 1949)، رئيس وزراء باكستان من أغسطس 2004 إلى نوفمبر 2007، ووزير المالية (1999–2007)، قضى ثلاثة عقود في سيتي بنك حتى رئاسة «سيتي برايفت بنك» في نيويورك، وقاد برنامج الخصخصة والتحرير الاقتصادي، ثم استقر في لندن بعد ترك المنصب."
  en: "Pakistani banker and politician (born 1949), prime minister of Pakistan from August 2004 to November 2007 and finance minister (1999–2007), who spent three decades at Citibank up to the presidency of Citi Private Bank in New York, led the privatisation and economic-liberalisation programme, and settled in London after leaving office."
  ur: "پاکستانی بینکار اور سیاست دان (پیدائش 1949ء)، اگست 2004ء سے نومبر 2007ء تک پاکستان کے وزیرِ اعظم اور وزیرِ خزانہ (1999ء–2007ء)، جنہوں نے سٹی بینک میں تین دہائیاں گزاریں اور نیویارک میں سٹی پرائیویٹ بینک کی صدارت تک پہنچے، نجکاری اور اقتصادی آزاد روی کے پروگرام کی قیادت کی، اور عہدہ چھوڑنے کے بعد لندن میں مقیم ہو گئے۔"
