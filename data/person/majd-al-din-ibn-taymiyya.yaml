summary:
  ar: "شيخ الإسلام الحنبلي، جد شيخ الإسلام تقي الدين ابن تيمية؛ ولد بحران وحفظ بها القرآن وسمع من عمه الخطيب فخر الدين والحافظ عبد القادر الرهاوي، وارتحل إلى بغداد سنة ثلاث وستمائة مع ابن عمه سيف الدين عبد الغني فأقام بها ست سنين، وتفقه على أبي بكر بن غنيمة والفخر إسماعيل وأتقن العربية والحساب والجبر والمقابلة؛ قال الذهبي عن شيخنا تقي الدين إن جده ربّى اليتامى؛ وقال جمال الدين بن مالك للمجد: ليّن لك الفقه كما ليّن الحديد لداود؛ وقال ابن رجب كان يفتي أحياناً أن الطلاق الثلاث المجموعة إنما يقع منها واحدة فقط؛ من مصنفاته المنتقى من أحاديث الأحكام والمحرر في الفقه ومنتهى الغاية في شرح الهداية وأطراف أحاديث التفسير والأحكام الكبرى {cite:shadharat-dhahab p. 265-266}."
  en: "Shaykh al-islam of Harran (b. ~590, d. Eid al-Fitr) — grandfather of Taqi al-Din Ibn Taymiyya, who told Dhahabi his grandfather had raised the orphans and recited the khilaf questions to Fakhr Isma'il at thirteen; author of al-Muntaqa fi Ahadith al-Ahkam, al-Muharrar fi al-Fiqh and Muntaha al-Ghaya on the Hidaya; Ibn Rajab records his fatwa that a triple divorce uttered together counts as one {cite:shadharat-dhahab p. 265-266}."
  es: "Shaykh al-islam de Harran (n. ~590, m. Eid al-Fitr): abuelo de Taqi al-Din Ibn Taymiyya, quien le dijo a Dhahabi que su abuelo había criado a los huérfanos y recitado las preguntas del khilaf a Fakhr Isma'il a los trece años; autor de al-Muntaqa fi Ahadith al-Ahkam, al-Muharrar fi al-Fiqh y Muntaha al-Ghaya sobre Hidaya; Ibn Rajab registra su fatwa de que un triple divorcio pronunciado juntos cuenta como uno {cita: shadharat-dhahab p. 265-266}."
  fr: "Shaykh al-islam de Harran (né ~ 590, décédé à l'Aïd al-Fitr) - grand-père de Taqi al-Din Ibn Taymiyya, qui a dit à Dhahabi que son grand-père avait élevé les orphelins et récité les questions du khilaf à Fakhr Isma'il à treize ans; auteur d'al-Muntaqa fi Ahadith al-Ahkam, al-Muharrar fi al-Fiqh et Muntaha al-Ghaya sur la Hidaya; Ibn Rajab enregistre sa fatwa selon laquelle un triple divorce prononcé ensemble compte pour un {cite: shadharat-dhahab p. 265-266}."
  ur: "شیخ الاسلام حران ⁦(متوفی ~590، وفات عید الفطر)⁩ - تقی الدین ابن تیمیہ کے دادا، جنہوں نے ذہبی کو بتایا کہ ان کے دادا نے یتیموں کی پرورش کی تھی اور تیرہ سال کی عمر میں فخر اسماعیل کو خلافت کے سوالات سنائے تھے۔ المنتقہ فی احادیث الاحکام، المحرر فی الفقہ اور منتہا الغیا آن ہدایہ کے مصنف؛ ابن رجب نے اپنا فتویٰ درج کیا ہے کہ ایک ساتھ کہی جانے والی تین طلاقیں ایک شمار ہوتی ہیں۔ 265-266}۔"
  tr: "Şeyh al-İslam el-Hanbali, Şeyh el-İslam Taki al-Din İbn Teymiyye'nin dedesi olarak Bahran'da doğdu ve orada Kur'an'ı ezberledi; amcası vaiz Fakhr al-Din ve hafız Abdül-Kadir el-Rahhavi'den dinledi. 603 Hicri yılında kuzeni Seyfeddin Abdül-Gani ile birlikte Bağdat'a gitti ve orada altı yıl kaldı. Ebu Bekir İb'in yanında hukuk eğitimi aldı n Ghanimah ve Fakhr İsmail, Arapça, aritmetik, cebir ve el-Muqelde ustalıklarını öğrendiler. El-Dahab, Şeyh Taki al-Din hakkında büyükbabasının yetim çocukları yetiştirdiğini söyledi; Cemaleddin ibn Malik Majd'a şöyle dedi: 'Fıkıh Davut için demir kadar yumuşaktır.' İbn Recep bazen üç birleşik boşanmanın sadece bir kez gerçekleştiğine dair fetvalar yayımladı. Eserleri arasında 'Hadis el-Ahkam'dan Seçilmiş', 'El-Muharrir fil-el-Fiqh' yer alır: 'Muntaha al-Ghaya fi Sharh al-Hidayah,', ve 'Thirif al-Tafsir wal-Ahkam al-Kubra' {kaynak: shadharat-dhahab, s. 265-266}."
  id: "Shaykh al-Islam al-Hanbali, kakek dari Shaykh al-Islam Taqi al-Din Ibn Taymiyyah, lahir di Bahran dan menghafal Al-Qur'an di sana, serta mendengar dari pamannya, pengkhotbah Fakhr al-Din dan hafiz Abd al-Qadir al-Rahhawi. Ia melakukan perjalanan ke Baghdad pada tahun 603 H bersama sepupunya Saif al-Din Abd al-Ghani, di mana ia tinggal selama enam tahun. Ia belajar hukum di bawah bimbingan Abu Bakr ibn Ghanimah dan Fakhr Ismail, menguasai bahasa Arab, aritmatika, aljabar, dan al-Muqalla. Al-Dhahab berkata tentang Sheikh Taqi al-Din bahwa kakeknya membesarkan anak yatim; Jamal al-Din ibn Malik berkata kepada Majd: 'Fiyamah itu selembut besi bagi Daud.' Ibn Rajab kadang-kadang mengeluarkan fatwa bahwa tiga perceraian gabungan hanya terjadi sekali. Di antara karyanya adalah 'Dipilih dari Hadis al-Ahkam,' 'Al-Muharrar fi al-Fiqh,' 'Muntaha al-Ghaya fi Sharh al-Hidayah,' dan 'Thirif al-Tafsir wal-Ahkam al-Kubra' {kutip:' Shadharat-Dhahab, hlm. 265-266}."
