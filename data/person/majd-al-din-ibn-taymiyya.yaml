summary:
  ar: "شيخ الإسلام الحنبلي، جد شيخ الإسلام تقي الدين ابن تيمية؛ ولد بحران وحفظ بها القرآن وسمع من عمه الخطيب فخر الدين والحافظ عبد القادر الرهاوي، وارتحل إلى بغداد سنة ثلاث وستمائة مع ابن عمه سيف الدين عبد الغني فأقام بها ست سنين، وتفقه على أبي بكر بن غنيمة والفخر إسماعيل وأتقن العربية والحساب والجبر والمقابلة؛ قال الذهبي عن شيخنا تقي الدين إن جده ربّى اليتامى؛ وقال جمال الدين بن مالك للمجد: ليّن لك الفقه كما ليّن الحديد لداود؛ وقال ابن رجب كان يفتي أحياناً أن الطلاق الثلاث المجموعة إنما يقع منها واحدة فقط؛ من مصنفاته المنتقى من أحاديث الأحكام والمحرر في الفقه ومنتهى الغاية في شرح الهداية وأطراف أحاديث التفسير والأحكام الكبرى {cite:shadharat-dhahab p. 265-266}."
  en: "Shaykh al-islam of Harran (b. ~590, d. Eid al-Fitr) — grandfather of Taqi al-Din Ibn Taymiyya, who told Dhahabi his grandfather had raised the orphans and recited the khilaf questions to Fakhr Isma'il at thirteen; author of al-Muntaqa fi Ahadith al-Ahkam, al-Muharrar fi al-Fiqh and Muntaha al-Ghaya on the Hidaya; Ibn Rajab records his fatwa that a triple divorce uttered together counts as one {cite:shadharat-dhahab p. 265-266}."
