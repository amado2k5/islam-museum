  ar: "صاحب ديوان الإنشاء للسلطان محمد بن ملكشاه ثم اتصل بابنه مسعود، فأُخذ أسيراً وذُبح بين يدي الملك محمود في ربيع الأول سنة أربع عشرة وخمسمائة وقد نيف على الستين؛ كان من أفراد الدهر وحامل لواء النظم والنثر وهو صاحب «لامية العجم» وله ديوان شعر جيد {cite:shadharat-dhahab p. 521-522}."
