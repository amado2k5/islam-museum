summary:
  ar: "صاحب ديوان الإنشاء للسلطان محمد بن ملكشاه ثم اتصل بابنه مسعود، فأُخذ أسيراً وذُبح بين يدي الملك محمود في ربيع الأول سنة أربع عشرة وخمسمائة وقد نيف على الستين؛ كان من أفراد الدهر وحامل لواء النظم والنثر وهو صاحب «لامية العجم» وله ديوان شعر جيد {cite:shadharat-dhahab p. 521-522}."
  en: "Mu'ayyid al-Din al-Tughra'i — head of the diwan al-insha' for Sultan Muhammad b. Malikshah then his son Mas'ud; taken captive and slaughtered before King Mahmud in Rabi' I 514, past sixty; one of the age's singular men of verse and prose, author of the Lamiyyat al-Ajam {cite:shadharat-dhahab p. 521-522}."
  fr: "Mu'ayyid al-Din al-Tughra'i - chef du diwan al-insha 'pour Sultan Muhammad b. Malikshah puis son fils Mas'ud ; capturé et massacré devant le roi Mahmud en Rabi I 514, soixante ans passé ; l'un des hommes singuliers de l'âge de vers et de prose, auteur de la Lamiyyat al-Ajam {cite:shadharat-dhahab p. 521-522}."
  es: "Mu'ayyid al-Din al-Tughra'i — jefe del diwan al-insha' del sultán Muhammad b. Malikshah y luego de su hijo Mas'ud; capturado y asesinado ante el rey Mahmud en Rabi' I 514, pasados los sesenta años; uno de los hombres singulares de la época en verso y prosa, autor del Lamiyyat al-Ajam {cite:shadharat-dhahab p. 521-522}."
