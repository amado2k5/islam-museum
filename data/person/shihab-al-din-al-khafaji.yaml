label: { ar: "الشهاب الخفاجي", en: "al-Shihab al-Khafaji (Ahmad ibn Muhammad ibn 'Umar)" }
summary:
  ar: "أحمد بن محمد بن عمر، أبو العباس، الخفاجي، المصري الحنفي، قاضي القضاة وصاحب التصانيف في الأدب واللغة، ورئيس المؤلفين ورأس المصنفين في عصره. من تصانيفه: نسيم الرياض في شرح شفاء القاضي عياض، وعناية القاضي وكفاية الراضي وهو حاشية على تفسير البيضاوي، وشفاء العليل فيما في كلام العرب من الدخيل. والتاريخ في المدخل مكتوب بترتيب معكوس (1069-979)، والمثبت هنا 979-1069هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10357}"
  en: "Ahmad ibn Muhammad ibn 'Umar, Abu al-'Abbas al-Khafaji of Cairo, a Hanafi judge, and a prolific author on literature and language, the leading writer of his time. His works include Nasim al-Riyad, a commentary on al-Qadi 'Iyad's al-Shifa'; 'Inayat al-Qadi wa-Kifayat al-Radi, a gloss on al-Baydawi's Quran commentary; and Shifa' al-'Alil on foreign words in Arabic. The heading prints the dates in reverse; this entry reads them as 979 to 1069 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10357}"
