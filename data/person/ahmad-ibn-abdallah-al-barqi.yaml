summary:
  ar: "أبو بكر البرقي من أهل برقة، حدّث وكان ثقة ثبتًا؛ قيل إن أخاه محمدًا كان قد صنّف التاريخ ولم يتمّه فأتمّه هو وحدّث به وكان إسنادها واحدًا، وكان يمشي في سوق الدواب فضربته دابة فمات من يومه، وذلك في رمضان هذه السنة {cite:muntazam-ibn-al-jawzi p. 152}."
  en: "Abu Bakr of Barqa, a sound traditionist who completed and transmitted the Tarikh his brother Muhammad had left unfinished — one isnad through it; a beast struck him in the beasts-of-burden market and he died the same day, in Ramadan 270 {cite:muntazam-ibn-al-jawzi p. 152}."
  fr: "Abu Bakr de Barqa, traditionniste solide ayant achevé et transmis le Tarikh laissé inachevé par son frère Muhammad, avec un même isnad ; un animal le frappa au marché aux bêtes de somme et il mourut le jour même, en ramadan 270 H {cite:muntazam-ibn-al-jawzi p. 152}."
  es: "Abu Bakr de Barqa, un auténtico tradicionalista que completó y transmitió el Tarikh que su hermano Muhammad había dejado inconcluso —un isnad a través de él—, una bestia lo atacó en el mercado de animales de carga y murió ese mismo día, en Ramadán 270 {cite:muntazam-ibn-al-jawzi p. 152}."
  ur: "ابوبکر آف برقہ، ایک صحیح روایت پسند جنہوں نے تاریخ کو مکمل کیا اور اس کی ترسیل اپنے بھائی محمد نے ادھوری چھوڑ دی تھی - اس کے ذریعے ایک سند؛ حیوانوں کے بازار میں اسے ایک درندے نے مارا اور وہ اسی دن رمضان المبارک 270 میں فوت ہو گیا۔ 152}۔"
  tr: "Barka halkından Ebu Bekr el-Barki, hadis rivayet etmiş ve güvenilir bir kişiydi. Rivayetlere göre, kardeşi Muhammed tarihi derlemiş ancak tamamlamamış, bu yüzden o tamamlamış ve rivayet etmiştir; hadisin isnadı da birdir. Hayvan pazarında yürürken bir hayvan ona çarpmış ve o gün ölmüştür. Bu olay bu yılın Ramazan ayında olmuştur. {Kaynak: Muntazam ibn el-Cevzi, s. 152}"
  id: "Abu Bakr al-Barqi, dari kaum Barqa, meriwayatkan hadits dan merupakan seorang yang terpercaya dan dapat diandalkan. Dikatakan bahwa saudaranya Muhammad telah menyusun sejarah tersebut tetapi tidak menyelesaikannya, sehingga ia menyelesaikannya dan meriwayatkannya, dan sanadnya hanya satu. Ia sedang berjalan di pasar hewan ketika seekor hewan menabraknya dan ia meninggal pada hari itu juga, dan itu terjadi pada bulan Ramadan tahun ini {cite:muntazam-ibn-al-jawzi p. 152}."
