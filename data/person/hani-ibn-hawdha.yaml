  id: "Nakha'i menyebutnya dalam daftar gubernur Ali sebagai gubernur Kufa {cite:sallabi-ali-vol1, hlm. 358}, tetapi buku tersebut tidak menyebutkan tanggal atau berita masa jabatannya di tempat ini."
