summary:
  ar: طه بن مهنا الجبريني المحتد الحلبي ⁦(1084-1178هـ/1673-1764م)⁩، فاضل له كتابة على بعض «صحيح البخاري»، وكتاب في تراجم أهل بدر، ونظم، بحسب الزركلي نقلاً عن «سلك الدرر» {cite:alam-zirikli-1927-v2 p. 52}.
  en: Taha ibn Muhanna, of Jibrin origin, of Aleppo (1084-1178 AH / 1673-1764), a scholar who wrote on part of Sahih al-Bukhari and a book on the lives of the people of Badr, and composed verse, according to al-Zirikli citing Silk al-Durar.
  ur: طہٰ بن مہنا، اصلاً جبرین کے، حلبی ⁦(1084-1178ھ/1673-1764ء)⁩، ایک فاضل جنہوں نے صحیح بخاری کے کچھ حصے پر لکھا، اہلِ بدر کے تراجم پر کتاب لکھی اور شعر کہے، زرکلی کے مطابق جو «سلک الدرر» سے نقل کرتے ہیں۔
