summary:
  ar: "أبو زكريا يحيى النووي فقيه شافعي ومحدث، وُلد في المحرم سنة 631هـ في نوى جنوب دمشق، وجاء به أبوه إلى المدرسة الرواحية بدمشق سنة 649هـ. تولى مشيخة دار الحديث الأشرفية سنة 665هـ، وعاش متقشفاً ورفض الراتب، وانفرد برفض توقيع فتوى تجيز جبايات السلطان بيبرس فأخرجه من دمشق، وتوفي في نوى في رجب سنة 676هـ. من أبرز مصنفاته شرح صحيح مسلم، ومنهاج الطالبين، والروضة، والأذكار، ورياض الصالحين، والأربعون النووية، وقد عدّته دائرة المعارف الإسلامية من أعلى المراجع في المذهب الشافعي."
  en: "Abu Zakariyya Yahya al-Nawawi was a Shafi'i jurist and hadith scholar, born in Muharram 631 AH at Nawa south of Damascus and brought by his father to the Rawahiyya madrasa in Damascus in 649. He headed the Ashrafiyya dar al-hadith from 665, lived frugally and declined a salary, was alone in refusing to sign a fatwa approving Sultan Baybars's levies and was expelled from Damascus, and died at Nawa in Rajab 676. His best known works are the commentary on Sahih Muslim, Minhaj al-Talibin, the Rawda, al-Adhkar, Riyad al-Salihin and the Forty Hadiths, and the Encyclopaedia of Islam ranks him among the highest authorities of the Shafi'i school."
  fr: "Abu Zakariyya Yahya al-Nawawi était un juriste chaféite et érudit du hadith, né à Muharram 631 de l’hégire à Nawa au sud de Damas et amené par son père à la madrasa Rawahiyya à Damas en 649. Il dirigea les Ashrafiyya dar al-hadith à partir de 665, vécut frugalement et déclina un salaire, fut seul à refuser de signer une fatwa approuvant les prélèvements du sultan Baybars et fut expulsé de Damas il meurt à Nawa, Rajab 676. Ses œuvres les plus connues sont les commentaires sur Sahih Muslim, Minhaj al-Talibin, Rawda, al-Adhkar, Riyad al-Salihin et les Quarante Hadiths, et l'Encyclopédie de l'Islam le classe parmi les plus hautes autorités de l'école chaféite."
  ur: "ابو زکریا یحییٰ نووی شافعی فقیہ اور محدث تھے، محرم 631ھ میں دمشق کے جنوب میں نوى میں پیدا ہوئے اور والد انہیں 649ھ میں دمشق کے مدرسہ رواحیہ میں لائے۔ انہوں نے 665ھ میں دار الحدیث اشرفیہ کی مشیخت سنبھالی، سادگی سے رہے اور تنخواہ لینے سے انکار کیا، سلطان بیبرس کی وصولیوں کو جائز ٹھہرانے والے فتوے پر تنہا دستخط سے انکار کیا اور دمشق سے نکالے گئے، اور رجب 676ھ میں نوى میں فوت ہوئے۔ ان کی نمایاں تصانیف صحیح مسلم کی شرح، منہاج الطالبین، روضہ، الاذکار، ریاض الصالحین اور اربعین ہیں، اور اسلامی دائرۃ المعارف انہیں شافعی مذہب کی بلند ترین اسناد میں شمار کرتا ہے۔"
  es: "Abu Zakariyya Yahya al-Nawawi fue un jurista shafi'í y erudito en hadices, nacido en Muharram del año 631 de la Hégira en Nawa, al sur de Damasco, y llevado por su padre a la madrasa Rawahiyya en Damasco en el año 649. Dirigió el Ashrafiyya dar al-hadith desde el año 665, vivió con austeridad y rechazó un salario, fue el único en negarse a firmar una fatwa que aprobaba los impuestos del sultán Baybars y fue expulsado de Damasco, y murió en Nawa en Rajab del año 676. Sus obras más conocidas son el comentario sobre Sahih Muslim, Minhaj al-Talibin, el Rawda, al-Adhkar, Riyad al-Salihin y los Cuarenta Hadices, y la Enciclopedia del Islam lo sitúa entre las máximas autoridades de la escuela shafi'í."
  tr: "Ebu Zekeriye Yahya el-Nawawi, 631 Hicri yılında Şam'ın güneyindeki Nawa'da Muharrem'de doğmuş bir Şafi hukukçusu ve hadis alimiydi. Babası onu 649 Hicri yılında Şam'daki Rawahiyya okuluna götürdü. 665 Hicri'nde Dar al-Hadis al-Ashrafiyye'nin liderliğini üstlendi, münzevi bir şekilde yaşadı, maaş almayı reddetti ve fatı imzalamayı reddeden tek yetkili kişiydi Sultan Baybars'ın vergilerini kabul ederek onu Şam'dan kovdu. 676 Hicri Recep'te Nawa'da öldü. En önemli eserleri arasında Şerh Sahih Müslim, Minhaj el-Talibin, el-Ravidah, el-Adhkar, Riyad el-Salihin ve el-Erba'un el-Nevawiyyah yer alır. İslami Ansiklopedi, onu Şafii okulunun en yüksek referanslarından biri olarak kabul eder."
  id: "Abu Zakariya Yahya al-Nawawi adalah seorang ahli hukum dan ulama hadis Shafi'i, lahir di Muharram pada tahun 631 H di Nawa, selatan Damaskus. Ayahnya membawanya ke sekolah Rawahiyya di Damaskus pada tahun 649 H. Ia mengambil alih kepemimpinan Dar al-Hadith al-Ashrafiyyah pada tahun 665 H, hidup secara asketis, menolak gaji, dan menjadi satu-satunya otoritas untuk menolak menandatangani fatwa yang mengizinkan pajak Sultan Baybars, mengusirnya dari Damaskus. Ia meninggal di Nawa pada Rajab tahun 676 H. Di antara karya-karya terpentingnya adalah Sharh Sahih Muslim, Minhaj al-Talibin, al-Rawdah, al-Adhkar, Riyadh al-Salihin, dan al-Arba'un al-Nawawiyyah. Ensiklopedia Islam menganggapnya sebagai salah satu referensi tertinggi dalam mazhab Shafi'i."
