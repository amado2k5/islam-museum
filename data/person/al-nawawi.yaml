  en: "The jurist and ascetic Imam Abu Zakariyya Yahya al-Nawawi; compiler of the 'Arba'un', forty-two concise hadiths built on Ibn al-Salah's twenty-six, which became one of the most memorised and commented collections in Islam. Al-Dhahabi's Siyar entry (juz 17, p. 340) has him born in Muharram 631 AH at Nawa to a grocer father who moved him to Damascus in 649; he memorised al-Tanbih in four and a half months and a quarter of al-Muhadhdhab in a year, stayed in Medina on pilgrimage and devoted himself to study, and among his works are Minhaj Sharh Muslim, Riyad al-Salihin, al-Adhkar, al-Irshad and al-Taqrib {cite:siyar-alam-nubala 17/340}. Al-Dhahabi's Tadhkirat al-Huffaz entry (part 4, p. 1470) styles him 'the imam, hafiz, matchless, exemplar', has him memorising al-Tanbih in four and a half months and a quarter of al-Muhadhdhab by heart within the year, and lists his hearing of the Six Books, the Musnad, the Muwatta', al-Daraqutni's Sunan and more {cite:tabaqat-huffaz 4/1470}."
  ur: "فقیہ، زاہد اور قدوہ امام ابو زکریا یحییٰ نووی؛ «الاربعین» کے مرتب، جو ابن الصلاح کی چھبیس جامع احادیث پر چالیس دو احادیث کا مجموعہ ہے اور اسلام کی سب سے زیادہ حفظ اور شرح کی جانے والی کتب میں شمار ہوتا ہے۔"
