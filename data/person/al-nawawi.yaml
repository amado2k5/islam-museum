summary:
  ar: "أبو زكريا يحيى النووي فقيه شافعي ومحدث، وُلد في المحرم سنة 631هـ في نوى جنوب دمشق، وجاء به أبوه إلى المدرسة الرواحية بدمشق سنة 649هـ. تولى مشيخة دار الحديث الأشرفية سنة 665هـ، وعاش متقشفاً ورفض الراتب، وانفرد برفض توقيع فتوى تجيز جبايات السلطان بيبرس فأخرجه من دمشق، وتوفي في نوى في رجب سنة 676هـ. من أبرز مصنفاته شرح صحيح مسلم، ومنهاج الطالبين، والروضة، والأذكار، ورياض الصالحين، والأربعون النووية، وقد عدّته دائرة المعارف الإسلامية من أعلى المراجع في المذهب الشافعي."
  en: "Abu Zakariyya Yahya al-Nawawi was a Shafi'i jurist and hadith scholar, born in Muharram 631 AH at Nawa south of Damascus and brought by his father to the Rawahiyya madrasa in Damascus in 649. He headed the Ashrafiyya dar al-hadith from 665, lived frugally and declined a salary, was alone in refusing to sign a fatwa approving Sultan Baybars's levies and was expelled from Damascus, and died at Nawa in Rajab 676. His best known works are the commentary on Sahih Muslim, Minhaj al-Talibin, the Rawda, al-Adhkar, Riyad al-Salihin and the Forty Hadiths, and the Encyclopaedia of Islam ranks him among the highest authorities of the Shafi'i school."
  ur: "ابو زکریا یحییٰ نووی شافعی فقیہ اور محدث تھے، محرم 631ھ میں دمشق کے جنوب میں نوى میں پیدا ہوئے اور والد انہیں 649ھ میں دمشق کے مدرسہ رواحیہ میں لائے۔ انہوں نے 665ھ میں دار الحدیث اشرفیہ کی مشیخت سنبھالی، سادگی سے رہے اور تنخواہ لینے سے انکار کیا، سلطان بیبرس کی وصولیوں کو جائز ٹھہرانے والے فتوے پر تنہا دستخط سے انکار کیا اور دمشق سے نکالے گئے، اور رجب 676ھ میں نوى میں فوت ہوئے۔ ان کی نمایاں تصانیف صحیح مسلم کی شرح، منہاج الطالبین، روضہ، الاذکار، ریاض الصالحین اور اربعین ہیں، اور اسلامی دائرۃ المعارف انہیں شافعی مذہب کی بلند ترین اسناد میں شمار کرتا ہے۔"
