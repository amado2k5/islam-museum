summary:
  ar: "الفقيه الإمام الزاهد القدوة أبو زكريا يحيى النووي؛ جمع «الأربعين» في الأحاديث الجامعة فأخذ أحاديث مجلس «الأحاديث الكلية» لابن الصلاح الستة والعشرين وزاد عليها حتى تمت اثنين وأربعين حديثاً، فاشتهرت وكثر حفظها وعني بها الشارحون. سكن المدرسة الرواحية بدمشق وقال بقيت نحو سنتين لم أضع جنبي إلى الأرض وكان قوتي جراية المدرسة، وكان يقرأ كل يوم اثني عشر درساً، ولزم الاشتغال نحو عشرين سنة حتى فاق الأقران؛ وولي مشيخة دار الحديث الأشرفية بعد أبي شامة وكان لا يتناول من معلومها شيئاً، ولم يتزوج ولم يأكل في اليوم إلا أكلة واحدة. ومن تصانيفه «الروضة» و«المنهاج» و«المجموع» في شرح المهذب و«منهاج» شرح مسلم و«الأذكار» و«رياض الصالحين» و«الإرشاد» و«التقريب» و«التبيان» {cite:shadharat-dhahab p. 618-620}."
  en: "The jurist and ascetic Imam Abu Zakariyya Yahya al-Nawawi; compiler of the 'Arba'un', forty-two concise hadiths built on Ibn al-Salah's twenty-six, which became one of the most memorised and commented collections in Islam."
  ur: "فقیہ، زاہد اور قدوہ امام ابو زکریا یحییٰ نووی؛ «الاربعین» کے مرتب، جو ابن الصلاح کی چھبیس جامع احادیث پر چالیس دو احادیث کا مجموعہ ہے اور اسلام کی سب سے زیادہ حفظ اور شرح کی جانے والی کتب میں شمار ہوتا ہے۔"
