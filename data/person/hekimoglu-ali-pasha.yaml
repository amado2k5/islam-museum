id: person/hekimoglu-ali-pasha
class: person
label:
  ar: "علي باشا حكيم أوغلو"
  en: "Hekimoğlu Ali Pasha"
  ur: "حکیم اوغلو علی پاشا"
summary:
  ar: "علي باشا الملقب «حكيم أوغلو» (ابن الطبيب)، ابن نوح أفندي رئيس أطباء القصر؛ وُلد سنة ١١١٠هـ/١٦٩٩م وكان أخيار إخوته؛ تولى ولايات الأناضول وتبريز وديار بكر في عهد محمود الأول وفتح تبريز ورومية، ثم والي البوسنة سنة ١١٤٩هـ/١٧٣٦م فأظهر في الحرب بسالة عظيمة، وتولى الصدارة العظمى ويُعرف بلقبه «شيخ الوزراء» في التواريخ {cite:sicill-i-osmani vol. 1, 'Ali Paşa (Hekimzâde)'}."
  en: "Ali Pasha, nicknamed 'Hekimoğlu' (son of the physician), son of the palace chief physician Nuh Efendi; born 1110/1699, 'the most excellent of his brothers'; governor of Anatolia, Tabriz and Diyarbekir under Mahmud I, he retook Tabriz and Rumiyya, then as governor of Bosnia in 1149/1736–37 'showed outstanding valour in the war'; he reached the grand vizierate and chronicles title him 'Şeyhü'l-vüzera' {cite:sicill-i-osmani vol. 1, 'Ali Paşa (Hekimzâde)'}."
  ur: "علی پاشا ملقب «حکیم اوغلو»، شاہی سرِطبیب نوح افندی کا بیٹا؛ ١١١٠ھ/١٦٩٩ء میں پیدا ہوا اور اپنے بھائیوں میں ممتاز تھا؛ سلطان محمود اول کے عہد میں اناطولیہ، تبریز اور دیار بکر کا والی رہا اور تبریز و رومیہ فتح کیے، پھر ١١٤٩ھ/١٧٣٦ء میں بوسنہ کا والی بنا اور جنگ میں غیر معمولی جرأت دکھائی؛ صدر اعظم بنا اور تاریخوں میں «شیخ الوزرا» کہلایا {cite:sicill-i-osmani vol. 1, 'Ali Paşa (Hekimzâde)'}."
