summary:
  ar: "الشيخ الخامس للطريقة الجهرية، وهي منحوان (أخوية) صوفية نقشبندية في شمال غرب الصين، من نحو 1849 إلى 1871. ورث المشيخة عن والده وأستاذه ما ييده، وجعل من جينجيبو مركزًا دينيًا وتجاريًا غنيًا، وكان من كبار قادة ثورة المسلمين ضد أسرة تشينغ منذ 1862 حتى استسلامه وإعدامه مع ابنه ما ياوبانغ في 2 آذار 1871."
  en: "The fifth shaykh of the Jahriyya, a Naqshbandi Sufi menhuan (order) in northwest China, from about 1849 to 1871. He inherited the leadership from his father and teacher Ma Yide, made Jinjipu a wealthy religious and commercial centre, and was one of the main leaders of the Muslim rebellion against the Qing from 1862 until his surrender and execution, with his son Ma Yaobang, on 2 March 1871."
  ur: "شمال مغربی چین میں نقشبندی صوفی منحوان (سلسلے) جہریہ کے پانچویں شیخ، تقریباً 1849ء سے 1871ء تک۔ انہوں نے قیادت اپنے والد اور استاد ما ییدہ سے ورثے میں پائی، جن جی پو کو ایک مالدار دینی و تجارتی مرکز بنایا، اور 1862ء سے چنگ خاندان کے خلاف مسلم بغاوت کے بڑے قائدین میں رہے، یہاں تک کہ 2 مارچ 1871ء کو اپنے بیٹے ما یاؤبانگ سمیت خود کو حوالے کرنے کے بعد قتل کیے گئے۔"
