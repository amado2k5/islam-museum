  note: "Executed on Zuo Zongtang's orders at Jinjipu on 2 March 1871, with his son Ma Yaobang and over eighty rebel officials (Dillon 1999, via the English article); the Chinese article gives the same event under the lunar date Tongzhi 10/1/13, executed by slow slicing at Wuzhong Siqiliangzi with his son. Some accounts said he was murdered by a traitor within his own ranks (English article). The Hijri year 1288 is the conversion of 2 March 1871, hence derived. Neither Jinjipu nor Wuzhong has a museum place record, so no died_in or buried_in relation is written; his tomb shrine (gongbei) traditions — Dongta near Wuzhong against Xuanhuagang in Zhangjiachuan — are carried in the prose."
  sources: [source/wikipedia-ma-hualong-en, source/wikipedia-ma-hualong-zh, source/wikidata-ma-hualong]
faith:
  - value: sufi
    basis: documented
    note: "Two independent texts name his personal standing in a Sufi order. The English article (from Dillon 1999 and Lipman 1998) makes him the fifth shaykh of the Jahriyya, a Naqshbandi menhuan, who succeeded about 1849 to his father Ma Yide — named as both his father and his teacher — and gives his occupation as Sufi shaykh. The Chinese article, an independent tradition, calls him grand jiaozhu of the Jahriyya, records his Sufi path-name (daohao) Tabirat Allah and his rank-name 'Thirteenth Master' (Shisan Taiye) in the order's transmission, and his early career as an ahong. Headship alone would not be recorded; what the two texts attest is his own transmitted rank and practice within the order, received from his teacher. The English article's infobox further gives Sunni, Hanafi and Maturidi, but those values rest on the single Encyclopaedia of Islam Three entry cited for them — one infobox, one source family — so no sunni-hanafi segment is recorded. Wikidata gives Islam (Q432) in general."
    sources: [source/wikipedia-ma-hualong-en, source/wikipedia-ma-hualong-zh, source/wikidata-ma-hualong]
