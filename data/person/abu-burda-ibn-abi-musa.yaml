summary:
  ar: "تابعي يروي عن أبيه أبي موسى الأشعري حديث البتع والمزر — «كل مسكر حرام» — وهو الحديث السادس والأربعون من زيادات ابن رجب على الأربعين، أخرجه البخاري (4343) ومسلم (1733)، وقيل له وما البتع فقال نبيذ العسل والمزر نبيذ الشعير ⁦(جامع العلوم والحكم ص 881)⁩. وعند المسعودي اسمه عامر وكان كوفياً ممن مات في أيام يزيد بن عبد الملك {cite:muruj-al-dhahab p. 191}"
  en: "A Successor who transmits from his father Abu Musa al-Ash'ari the hadith of al-Bit' and al-Mizr — 'every intoxicant is forbidden' — the forty-sixth hadith of Ibn Rajab's additions to the Forty, transmitted by al-Bukhari (4343) and Muslim (1733); asked what al-Bit' was, he said honey-wine, and al-Mizr barley-wine (Jami' al-Ulum wal-Hikam p. 881)."
  fr: "Successeur qui transmet de son père Abu Musa al-Ash'ari le hadith d'al-Bit' et d'al-Mizr — « tout enivrant est interdit » —, quarante-sixième hadith des ajouts d'Ibn Rajab aux Quarante, transmis par al-Bukhari (4343) et Muslim (1733) ; interrogé sur ce qu'était al-Bit', il dit le vin de miel, et al-Mizr le vin d'orge (Jami' al-Ulum wal-Hikam p. 881)."
  es: "Un Sucesor que transmite de su padre Abu Musa al-Ash'ari el hadiz de al-Bit' y al-Mizr — 'todo intoxicante está prohibido' — el cuadragésimo sexto hadiz de las adiciones de Ibn Rajab a los Cuarenta, transmitido por al-Bukhari (4343) y Muslim (1733); al preguntársele qué era al-Bit', dijo vino de miel, y al-Mizr vino de cebada (Jami' al-Ulum wal-Hikam p. 881)."
