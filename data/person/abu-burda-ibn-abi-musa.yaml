summary:
  ar: "تابعي يروي عن أبيه أبي موسى الأشعري حديث البتع والمزر — «كل مسكر حرام» — وهو الحديث السادس والأربعون من زيادات ابن رجب على الأربعين، أخرجه البخاري (4343) ومسلم (1733)، وقيل له وما البتع فقال نبيذ العسل والمزر نبيذ الشعير (جامع العلوم والحكم ص 881). وعند المسعودي اسمه عامر وكان كوفياً ممن مات في أيام يزيد بن عبد الملك {cite:muruj-al-dhahab p. 191}"
  en: "A Successor who transmits from his father Abu Musa al-Ash'ari the hadith of al-Bit' and al-Mizr — 'every intoxicant is forbidden' — the forty-sixth hadith of Ibn Rajab's additions to the Forty, transmitted by al-Bukhari (4343) and Muslim (1733); asked what al-Bit' was, he said honey-wine, and al-Mizr barley-wine (Jami' al-Ulum wal-Hikam p. 881)."
