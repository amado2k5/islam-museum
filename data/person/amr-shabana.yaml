  ar: "لاعب اسكواش مصري محترف سابق، وُلد في القاهرة سنة 1979. فاز ببطولة العالم المفتوحة أربع مرات (2003 و2005 و2007 و2009)، وهو أول مصري يفوز باللقب وأول مصري يتصدر التصنيف العالمي في أبريل 2006، واعتزل في أغسطس 2015."
