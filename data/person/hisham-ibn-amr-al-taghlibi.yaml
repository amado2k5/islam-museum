class: person
label: { ar: "هشام بن عمرو التغلبي", en: "Hisham ibn Amr al-Taghlibi", es: "Hisham ibn Amr al-Taghlibi", fr: "Hisham ibn Amr al-Taghlibi", ur: "ہشام بن عمرو الطغلبی" }
summary:
  ar: "هشام بن عمرو التغلبي؛ ولاه المنصور السند ففتح ما استغلق وأفتتح قشيراً وأصاب سباياً ورقيقاً كثيراً وفتح الملتان وأجل المتغلبة عن قندابيل وفتح القندهار في السفن وهدم بدها وبنى موضعه مسجداً فأخصبت البلاد في ولايته."
  en: "Hisham ibn Amr al-Taghlibi; al-Mansur's Sind governor — Multan retaken, Qandabil's mutaghalliba expelled, Qandahar's budd razed for a mosque, the land prosperous under him."
  es: "Hisham ibn Amr al-Taghlibi, gobernador de Sind por al-Mansur, recuperó Multan, expulsó al mutaghalliba de Qandabil, arrasó el budd de Qandahar para construir una mezquita y la tierra prosperó bajo su mandato."
  fr: "Hisham ibn Amr al-Taghlibi; gouverneur du Sind d'al-Mansur — Multan repris, le mutaghalliba de Qandabil expulsé, le budd de Qandahar rasé pour une mosquée, la région prospère sous son règne."
  ur: "ہشام بن عمرو الطغلبی؛ المنصور کا سندھ کا گورنر — ملتان پر دوبارہ قبضہ کر لیا گیا، قندبیل کا متغلیبہ نکال دیا گیا، قندھار کی بڈ کو ایک مسجد کے لیے مسمار کر دیا گیا، اس کے ماتحت زمین خوشحال تھی۔"
  tr: "Hisham bin Amr al-Taghlibi; el-Mansur onu destekçi olarak atadı; o da kapalı olanı fethetti, bir kaleyi fethetti ve birçok esir ve köle esir aldı. Multan'ı fethetti, el-Mutaghlabah'ı Qandabil'den kovdu, Kandahar'ı gemilerle fethetti, sınırlarını yıktı ve yerine bir cami inşa etti; bu da kendi yönetimi altındaki toprakları zenginleştirdi."
  id: "Hisham ibn Amr al-Taghlibi; al-Mansur mengangkatnya sebagai pendukung, yang menaklukkan wilayah yang tertutup, menaklukkan benteng, dan menangkap banyak tawanan serta budak. Ia menaklukkan Multan, mengusir al-Mutaghlabah dari Qandabil, menaklukkan Kandahar dengan kapal, merobohkan perbatasannya, dan membangun masjid di tempatnya, yang memperkaya tanah di bawah pemerintahannya."
