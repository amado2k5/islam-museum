summary:
  ar: "براجوغو بانغيستو (وُلد باسم فانغ دجوين فين في 13 أيار 1944 في بنغكايانغ بكاليمانتان الغربية) رجل أعمال إندونيسي من أصل هاكا صيني، مؤسس مجموعة باريتو باسيفيك في البتروكيماويات والطاقة الحرارية الأرضية؛ بدأ موظفًا في شركة أخشاب، وأسس باريتو باسيفيك تيمبر التي صارت أكبر شركة مدرجة في بورصة جاكرتا سنة 1993، ويُعد أغنى شخص في جنوب شرق آسيا."
  en: "Prajogo Pangestu (born Phang Djoen Phen on 13 May 1944 in Bengkayang, West Kalimantan) is an Indonesian businessman of Hakka Chinese descent, founder of the Barito Pacific Group in petrochemicals and geothermal energy; he began as a timber company employee, founded Barito Pacific Timber, which became the Jakarta exchange's largest listed company in 1993, and is counted the wealthiest person in Southeast Asia."
  ur: "پراجوگو پانگیستو (پیدائش بطور فانگ جوئین فین 13 مئی 1944، بنگکایانگ، مغربی کالیمانتان) ہاکا چینی نسل کے انڈونیشیائی کاروباری ہیں، پیٹروکیمیکل اور جیوتھرمل توانائی میں بارِتو پیسیفک گروپ کے بانی؛ لکڑی کی کمپنی کے ملازم سے آغاز کیا، بارِتو پیسیفک ٹمبر قائم کی جو 1993 میں جکارتہ اسٹاک ایکسچینج کی سب سے بڑی درج شدہ کمپنی بنی، اور انھیں جنوب مشرقی ایشیا کا امیر ترین شخص گنا جاتا ہے۔"
