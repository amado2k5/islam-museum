label:
  ar: وانودين بن خزرون المغراوي
  en: Wanudin ibn Khazrun al-Maghrawi
summary:
  ar: "وانودين بن خزرون بن فلفول المغراوي، ثاني ملوك بني خزرون بسجلماسة؛ استأمن إلى زيري بن عطية بفاس مع وجوه بني خزر فأمّنهم، ثم رجع إلى عمله فاستقل بملك سجلماسة منذ أول سنة 390هـ مقيماً فيها للدعوة المروانية على عقد واضح الصقلبي بمال مفروض وعدة من الخيل والدرق يحملانها كل سنة، ولما انتثر سلك الخلافة بقرطبة استبد بأعمال سجلماسة وتغلب على عمل درعة، وخلفه ابنه مسعود، وكان أمر بني خزرون آخذاً في التضاؤل حتى هلكوا بسجلماسة وطرابلس في فتوح المرابطين."
  en: "Wanudin ibn Khazrun ibn Fulful al-Maghrawi, second Khazrunid king of Sijilmasa; pardoned by Ziri ibn Atiyya at Fez, he returned to his charge and held Sijilmasa's kingship from 390 under the Marwanid da'wa on Wadih's covenant of a yearly tribute in coin, horses and shields — when the Cordoban caliphate's thread snapped he ruled Sijilmasa and conquered Dra'a independently, leaving it to his son Mas'ud, until the Almoravid conquests destroyed the Banu Khazrun."
