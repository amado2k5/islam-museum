id: person/wanudin-ibn-khazrun
class: person
label:
  ar: وانودين بن خزرون المغراوي
  en: Wanudin ibn Khazrun al-Maghrawi
  es: "Wanudin ibn Khazrun al-Maghrawi"
  fr: "Wanudin ibn Khazrun al-Maghrawi"
  ur: "ونودین ابن خزرون المغراوی"
summary:
  ar: "وانودين بن خزرون بن فلفول المغراوي، ثاني ملوك بني خزرون بسجلماسة؛ استأمن إلى زيري بن عطية بفاس مع وجوه بني خزر فأمّنهم، ثم رجع إلى عمله فاستقل بملك سجلماسة منذ أول سنة 390هـ مقيماً فيها للدعوة المروانية على عقد واضح الصقلبي بمال مفروض وعدة من الخيل والدرق يحملانها كل سنة، ولما انتثر سلك الخلافة بقرطبة استبد بأعمال سجلماسة وتغلب على عمل درعة، وخلفه ابنه مسعود، وكان أمر بني خزرون آخذاً في التضاؤل حتى هلكوا بسجلماسة وطرابلس في فتوح المرابطين."
  en: "Wanudin ibn Khazrun ibn Fulful al-Maghrawi, second Khazrunid king of Sijilmasa; pardoned by Ziri ibn Atiyya at Fez, he returned to his charge and held Sijilmasa's kingship from 390 under the Marwanid da'wa on Wadih's covenant of a yearly tribute in coin, horses and shields — when the Cordoban caliphate's thread snapped he ruled Sijilmasa and conquered Dra'a independently, leaving it to his son Mas'ud, until the Almoravid conquests destroyed the Banu Khazrun."
  es: "Wanudin ibn Khazrun ibn Fulful al-Maghrawi, segundo rey Khazruní de Sijilmasa; perdonado por Ziri ibn Atiyya en Fez, regresó a su cargo y mantuvo el reinado de Sijilmasa desde el año 390 bajo la da'wa Marwaní, en virtud del pacto de Wadih de un tributo anual en monedas, caballos y escudos. Cuando el califato cordobés se desmoronó, gobernó Sijilmasa y conquistó Dra'a de forma independiente, dejándosela a su hijo Mas'ud, hasta que las conquistas almorávides destruyeron a los Banu Khazrun."
  fr: "Wanudin ibn Khazrun ibn Fulful al-Maghrawi, deuxième roi khazrunide de Sijilmasa; gracié par Ziri ibn Atiyya à Fès, il reprit ses fonctions et exerça le pouvoir sur Sijilmasa à partir de 390 sous la da'wa marwanide, en vertu d'un pacte de Wadih prévoyant un tribut annuel en pièces de monnaie, chevaux et boucliers. Lorsque le califat de Cordoue s'effondra, il gouverna Sijilmasa et conquit Dra'a de manière indépendante, la laissant à son fils Mas'ud, jusqu'à ce que les conquêtes almoravides anéantissent les Banu Khazrun."
  ur: "ونودین ابن خزرون ابن فلفل المغراوی، سجلماسا کا دوسرا خزرونید بادشاہ؛ زری ابن عطیہ کے ذریعہ فیض میں معافی دی گئی، وہ اپنے چارج پر واپس آیا اور مرواند دعوہ کے تحت 390 سے سجلماسا کی بادشاہی پر فائز رہا جس میں ودیہ کے عہد میں سکوں، گھوڑوں اور ڈھالوں میں سالانہ خراج تحسین پیش کیا گیا - جب قرطبہ خلافت کا دھاگہ ٹوٹ گیا تو اس نے صیغہ میں حکومت کرنے کے لیے اسے چھوڑ دیا۔ اس کا بیٹا مسعود، یہاں تک کہ الموراود کی فتوحات نے بنو خزرون کو تباہ کر دیا۔"
  tr: "Ve Sijilmasa'daki Hazrun hanedanının ikinci kralı Anudin ibn Khazrun ibn Falful al-Maghrawi, önemli Hazarlarla birlikte Fes'te Ziri ibn Atiyah'ın yanına sığındı ve onları güvence altına aldı. Daha sonra görevine döndü ve 390 Hicri başından itibaren Sijilmasa kralı olarak bağımsız oldu; burada sabit bir para ve yıllık birkaç at ve süvariyle Marwani misyonu için açık bir sözleşme altında yaşadı. Cordoba'daki halifelik dağıldığında, Sijilmasa'nın kontrolünü ele geçirdi ve yerine oğlu Mas'ud'un geçtiği Dira'a işlerine hakim oldu. Banu Hazrun'un gücü azalıyordu ve Almoravid fetihleri sırasında Sijilmasa ve Trablus'ta yok oldular."
  id: "Dan Anudin ibn Khazrun ibn Falful al-Maghrawi, raja kedua dinasti Khazrun di Sijilmasa, mencari perlindungan bersama Ziri ibn Atiyah di Fez bersama para Khazar terkemuka dan mengamankan mereka. Ia kemudian kembali ke posisinya dan merdeka sebagai raja Sijilmasa sejak awal tahun 390 H, tinggal di sana dengan kontrak jelas untuk misi Marwanid dengan jumlah uang tetap dan beberapa kuda serta kavaleri yang dibawa setiap tahun. Ketika kekhalifahan di Cordoba tercerai, ia mengambil alih Sijilmasa dan menguasai pekerjaan Dira'a, yang digantikan oleh putranya Mas'ud. Kekuatan Banu Khazrun mulai menurun hingga mereka punah di Sijilmasa dan Tripoli selama penaklukan Almoravid."
