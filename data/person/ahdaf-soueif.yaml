summary:
  ar: "روائية ومعلّقة ثقافية وسياسية مصرية، وُلدت في القاهرة في 23 مارس 1950. حصلت على الدكتوراه في اللسانيات من جامعة لانكستر، وتكتب أساسًا بالإنجليزية، وقد رُشحت روايتها «خارطة الحب» (1999) لجائزة بوكر؛ أسست مهرجان فلسطين للأدب وكتبت «القاهرة: مدينتي، ثورتنا» (2012)."
  en: "Egyptian novelist and cultural and political commentator, born in Cairo on 23 March 1950. She took a doctorate in linguistics at the University of Lancaster and writes principally in English; her second novel, The Map of Love (1999), was shortlisted for the Booker Prize. She founded the Palestine Festival of Literature and wrote Cairo: My City, Our Revolution (2012)."
  ur: "مصری ناول نگار اور ثقافتی و سیاسی مبصر، 23 مارچ 1950 کو قاہرہ میں پیدا ہوئیں۔ انہوں نے لانکیسٹر یونیورسٹی سے لسانیات میں ڈاکٹریٹ کی اور بنیادی طور پر انگریزی میں لکھتی ہیں؛ ان کا دوسرا ناول «دی میپ آف لو» (1999) بکر پرائز کے لیے شارٹ لسٹ ہوا۔ انہوں نے فلسطین فیسٹیول آف لٹریچر کی بنیاد رکھی اور «کائرو: مائی سٹی، آؤر ریوولوشن» (2012) لکھی۔"
