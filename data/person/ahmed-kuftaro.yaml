summary:
  ar: "مفتي الجمهورية العربية السورية من 1964 حتى وفاته سنة 2004، وشيخ الطريقة النقشبندية الصوفية في سورية. وُلد في دمشق لأسرة كردية الأصل، وتلقّى تعليمًا شرعيًّا تقليديًّا، فتدرّج في إدارة الإفتاء من مدرّس ديني في القنيطرة إلى مفتي دمشق ثم المفتي العام، وأسّس مؤسسات تعليمية وخيرية وجماعة دعوية حملت اسمه ⁦(الكفتارية)⁩. عُرف بدعوته إلى الحوار بين الأديان، وبقي أربعين عامًا في أعلى منصب إفتائي رسمي في سورية."
  en: "Grand Mufti of Syria from 1964 until his death in 2004, and sheikh of the Naqshbandi Sufi order in Syria. Born in Damascus to a family of Kurdish origin, he received a classical religious education and rose through the ifta administration from mosque teacher in Quneitra to Mufti of Damascus and then Grand Mufti, founding schools, charities and the devotional community that bore his name (the Kaftariyya). He was known for advocating interreligious dialogue and held Syria's highest official fatwa office for forty years."
  ur: "شام کے مفتیِ اعظم 1964 سے 2004 میں اپنی وفات تک، اور شام میں نقشبندی صوفی سلسلے کے شیخ۔ دمشق میں کرد نژاد خاندان میں پیدا ہوئے، روایتی دینی تعلیم حاصل کی، اور ادارۂ افتاء میں قنیطرہ کے دینی مدرس سے ترقی کر کے دمشق کے مفتی اور پھر مفتیِ اعظم بنے؛ اسکول، فلاحی ادارے اور اپنے نام کی دعوتی جماعت ⁦(کفتاریہ)⁩ قائم کی۔ بین المذاہب مکالمے کی دعوت کے لیے مشہور رہے اور چالیس برس شام کے اعلیٰ ترین سرکاری منصبِ افتاء پر فائز رہے۔"
