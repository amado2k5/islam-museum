names:
  - { value: "أبو الفتح أحمد بن محمد بن أحمد بن سعيد الأصبهاني الشافعي التاجر", kind: full }
summary:
  ar: "فقيه طوس الشافعي الملقب بأبي الفتح الحداد؛ تفقه وحظي عند إمام الحرمين الذي كان معجباً بفصاحته وحسن كلامه، ثم درّس في حياة الإمام وولي قضاء طوس ثم صُرف، وكما رزق الغزالي السعادة في حسن التصنيف رزق هذا السعادة في المناظرة والعبارة الحسنة المهذبة، وقال الذهبي: كان أعلم أهل طوس مع الغزالي ومن أنظر أهل زمانه؛ توفي في ذي القعدة سنة خمسمائة عن اثنتين وتسعين سنة {cite:shadharat-dhahab p. 410}."
  en: "The Shafi'i faqih of Tus Abu al-Fath al-Haddad — Imam al-Haramayn delighted in his eloquence, he lectured in the imam's lifetime and held the qada' of Tus; al-Dhahabi counted him, with al-Ghazali, the most learned man of Tus and the keenest debater of his age; d. Dhu al-Qa'da 500 at ninety-two {cite:shadharat-dhahab p. 410}."
  fr: "Le juriste shafi'ite de Tus Abu al-Fath al-Haddad — l'Imam al-Haramayn se plaisait à son éloquence ; il enseigna du vivant de l'imam et exerça la judicature de Tus ; al-Dhahabi le comptait, avec al-Ghazali, comme l'homme le plus savant de Tus et le débatteur le plus subtil de son temps ; mort en Dhu al-Qa'da 500 à quatre-vingt-douze ans {cite:shadharat-dhahab p. 410}."
  es: "El faqih shafi'i de Tus, Abu al-Fath al-Haddad —el Imam al-Haramayn se deleitaba con su elocuencia, dio conferencias durante la vida del imán y mantuvo el qada' de Tus; al-Dhahabi lo consideró, junto con al-Ghazali, el hombre más erudito de Tus y el debatiente más brillante de su época; murió en Dhu al-Qa'da 500 a los noventa y dos años {cite:shadharat-dhahab p. 410}."
  ur: "طوس ابو الفتح الحداد کے شافعی فقیہ - امام الحرمین اپنی فصاحت و بلاغت سے خوش ہوئے، انہوں نے امام کی زندگی میں ہی درس دیا اور طوس کی قضا کی۔ الذہبی نے ان کا شمار الغزالی کے ساتھ کیا، جو طوس کا سب سے زیادہ عالم اور اپنے زمانے کا سب سے بڑا بحث کرنے والا تھا۔ d ذوالقعدہ 500 بانوے پر {حوالہ: شدّرت ذہاب ص۔ 410}۔"
  tr: "Tuslu Şafiî fıkıhçı, lakabı Ebu el-Feth el-Haddad olan bu kişi, fıkıh eğitimi aldı ve hitabet yeteneği ve güzel konuşmasıyla İki Kutsal Mescid-i Haram İmamı'nın beğenisini kazandı. İmam'ın hayatta olduğu dönemde ders verdi ve Tus kadısı olarak atandı, ardından görevden alındı. Gazali'nin güzel bir yazıya sahip olması gibi, bu adam da güzel bir tartışma yeteneğine ve incelikli bir ifadeye sahipti. El-Dhahabi şöyle demiştir: \"Gazali ile birlikte Tus'un en bilgili kişisi ve zamanının en basiretli insanlarından biriydi. 500 yılında Zülkade'de doksan iki yaşında vefat etti.\" {kaynak: Şadharat-Dhahab s. 410}"
  id: "Ulama mazhab Syafi'i dari Tus, yang dijuluki Abu al-Fath al-Haddad, mempelajari ilmu hukum dan mendapatkan restu dari Imam Dua Masjid Suci, yang mengagumi kefasihan dan tutur katanya yang baik. Kemudian ia mengajar selama masa hidup Imam dan diangkat menjadi hakim di Tus, lalu diberhentikan. Sebagaimana al-Ghazali diberkahi dengan kemampuan menulis yang baik, orang ini diberkahi dengan kemampuan berdebat yang baik dan ungkapan yang baik dan halus. Al-Dhahabi berkata: Ia adalah orang yang paling berilmu di Tus bersama al-Ghazali dan salah satu orang yang paling berwawasan luas pada zamannya. Ia meninggal pada bulan Dzul Qa'dah tahun 500 pada usia sembilan puluh dua tahun. {cite:shadharat-dhahab p. 410}"
