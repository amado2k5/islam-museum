summary:
  ar: "فقيه طوس الشافعي الملقب بأبي الفتح الحداد؛ تفقه وحظي عند إمام الحرمين الذي كان معجباً بفصاحته وحسن كلامه، ثم درّس في حياة الإمام وولي قضاء طوس ثم صُرف، وكما رزق الغزالي السعادة في حسن التصنيف رزق هذا السعادة في المناظرة والعبارة الحسنة المهذبة، وقال الذهبي: كان أعلم أهل طوس مع الغزالي ومن أنظر أهل زمانه؛ توفي في ذي القعدة سنة خمسمائة عن اثنتين وتسعين سنة {cite:shadharat-dhahab p. 410}."
  en: "The Shafi'i faqih of Tus Abu al-Fath al-Haddad — Imam al-Haramayn delighted in his eloquence, he lectured in the imam's lifetime and held the qada' of Tus; al-Dhahabi counted him, with al-Ghazali, the most learned man of Tus and the keenest debater of his age; d. Dhu al-Qa'da 500 at ninety-two {cite:shadharat-dhahab p. 410}."
