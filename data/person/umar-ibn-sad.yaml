id: person/umar-ibn-sad
class: person
label: { ar: "عمر بن سعد بن أبي وقاص" }
summary:
  ar: "ابن سعد بن أبي وقاص، وجهه عبيد الله بن زياد أميراً على أربعة آلاف لقتال الحسين ووعده ولاية الري إن ظفر به، فضاق عليه حتى قتل يوم كربلاء؛ وينسب إليه قتل الحسين لأنه كان الأمير على الخيل كما قال ابن عبد البر، وروى أهل الكوفة أنه هو قاتله ونفى ذلك إبراهيم بن سعد {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  en: "Son of Sa'd ibn Abi Waqqas; Ubayd Allah ibn Ziyad sent him in command of four thousand against al-Husayn with the governorship of Rayy as his promised prize, and it was under his command that Karbala fell. Kufans name him the killer; Ibn Abd al-Barr explains the ascription by his command of the cavalry, while Ibrahim ibn Sa'd transmitted a report denying it {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  es: "Hijo de Sa'd ibn Abi Waqqas; Ubayd Allah ibn Ziyad lo envió al mando de cuatro mil hombres contra al-Husayn con el gobierno de Rayy como premio prometido, y fue bajo su mando que cayó Karbala. Los kufanos lo llaman el asesino; Ibn Abd al-Barr explica esta atribución por su mando de la caballería, mientras que Ibrahim ibn Sa'd transmitió un informe que lo desmentía {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  fr: "Fils de Sa'd ibn Abi Waqqas, Ubayd Allah ibn Ziyad l'envoya à la tête de quatre mille hommes contre al-Husayn, avec le gouvernement de Rayy comme récompense promise. C'est sous son commandement que Karbala tomba. Les habitants de Koufa le considèrent comme le vainqueur; Ibn Abd al-Barr justifie cette attribution par son commandement de la cavalerie, tandis qu'Ibrahim ibn Sa'd a transmis un récit la réfutant (voir: Tarikh-Khulafa-Minhaj-1434, p. 341-342)."
  ur: "سعد بن ابی وقاص کے بیٹے؛ عبید اللہ ابن زیاد نے اسے حسین کے خلاف چار ہزار کی کمان دے کر رے کی گورنری کے ساتھ اس کے وعدے کے انعام کے طور پر بھیجا، اور ان کے حکم سے کربلا کا سقوط ہوا۔ کوفوں نے اسے قاتل کا نام دیا۔ ابن عبد البر نے اپنے گھڑ سواروں کے حکم سے اس تصنیف کی وضاحت کی ہے جبکہ ابراہیم بن سعد نے اس کی تردید کرتے ہوئے ایک روایت نقل کی ہے۔ 341-342}۔"
