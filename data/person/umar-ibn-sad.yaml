label: { ar: "عمر بن سعد بن أبي وقاص" }
summary:
  ar: "ابن سعد بن أبي وقاص، وجهه عبيد الله بن زياد أميراً على أربعة آلاف لقتال الحسين ووعده ولاية الري إن ظفر به، فضاق عليه حتى قتل يوم كربلاء؛ وينسب إليه قتل الحسين لأنه كان الأمير على الخيل كما قال ابن عبد البر، وروى أهل الكوفة أنه هو قاتله ونفى ذلك إبراهيم بن سعد {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
  en: "Son of Sa'd ibn Abi Waqqas; Ubayd Allah ibn Ziyad sent him in command of four thousand against al-Husayn with the governorship of Rayy as his promised prize, and it was under his command that Karbala fell. Kufans name him the killer; Ibn Abd al-Barr explains the ascription by his command of the cavalry, while Ibrahim ibn Sa'd transmitted a report denying it {cite:tarikh-khulafa-minhaj-1434 p. 341-342}."
