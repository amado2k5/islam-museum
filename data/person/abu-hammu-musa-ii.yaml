id: person/abu-hammu-musa-ii
class: person
label:
  ar: السلطان أبو حمو موسى الثاني
  en: Sultan Abu Hammu Musa II
  fr: "Le sultan Abu Hammu Musa II"
  es: "Sultan Abu Hammu Musa II"
  ur: "سلطان ابو حمو موسیٰ دوم"
summary:
  ar: "أبو حمو موسى بن يوسف بن عبد الرحمن، سلطان بني عبد الواد بتلمسان وصاحب «الكرة الثالثة»؛ نجا من نكبة أهله إلى تونس فنزل على الحاجب ابن تافراكين الذي حمى له أنفه وأبى عن إنزاجه لسلطان أبي عنان، فرجع بمدد الدواودة وزغبة واقتحم تلمسان يوم الأربعاء لثمان خلون من ربيع الأول سنة 760هـ وبويع بالخلافة، وأجفل أمام عساكر المغرب ثم عاد إليها ثالثاً، وكان سلطاناً عالماً كتب في الأنساب والأخبار وجمع العلماء في حضرته ومنهم ابن خلدون الذي أتم عنده تلخيص كتابه العبر."
  en: "Abu Hammu Musa ibn Yusuf ibn Abd al-Rahman, the Abd al-Wadid sultan of Tlemcen of the 'third return'; he escaped his family's ruin to Tunis where the hajib Ibn Tafrakin sheltered him and refused Sultan Abu Inan's demand for his extradition, then came back with Dawawida and Zaghba support and stormed Tlemcen on Wednesday 8 Rabi I 760 AH, taking the bay'a of the caliphate, was driven out before the Maghreb's armies and returned a third time — a scholar-sultan who wrote on genealogies and history, hosting the learned at his court, Ibn Khaldun among them, who finished the abridgement of al-Ibar under him."
  fr: "Abu Hammu Musa ibn Yusuf ibn Abd al-Rahman, sultan abdalwadide de Tlemcen du « troisième retour » ; il échappa à la ruine de sa famille en gagnant Tunis, où le hajib Ibn Tafrakin l'abrita et refusa d'accéder à la demande d'extradition du sultan Abu Inan, puis revint avec l'appui des Dawawida et des Zaghba et prit Tlemcen d'assaut le mercredi 8 Rabi I 760 H, recevant la bay'a du califat ; chassé devant les armées du Maghreb, il revint une troisième fois — sultan lettré qui écrivit sur les généalogies et l'histoire, accueillant les savants à sa cour, parmi lesquels Ibn Khaldun, qui acheva sous lui l'abrégé d'al-Ibar."
  es: "Abu Hammu Musa ibn Yusuf ibn Abd al-Rahman, el sultán Abd al-Wadid de Tlemcen del 'tercer regreso'; escapó de la ruina de su familia a Túnez, donde el hajib Ibn Tafrakin lo acogió y rechazó la demanda de extradición del sultán Abu Inan, luego regresó con el apoyo de Dawawida y Zaghba y asaltó Tlemcen el miércoles 8 de Rabi I de 760 AH, tomando el bay'a del califato, fue expulsado ante los ejércitos del Magreb y regresó por tercera vez, un sultán erudito que escribió sobre genealogías e historia, recibiendo a los sabios en su corte, entre ellos Ibn Khaldun, quien terminó la compendio de al-Ibar bajo su mandato."
  ur: "ابو حمو موسیٰ بن یوسف بن عبدالرحمن، 'تیسری واپسی' کے تلمسن کے عبد الودید سلطان؛ وہ اپنے خاندان کی بربادی سے بچ کر تیونس چلا گیا جہاں حاجی ابن تفرقین نے اسے پناہ دی اور سلطان ابو انان کی حوالگی کے مطالبے سے انکار کر دیا، پھر دعویدہ اور زاغبہ کی حمایت کے ساتھ واپس آیا اور بدھ 8 ربیع الثانی 760 ہجری کو تلمسن پر حملہ کر دیا، بیعت لے کر تیونس کو باہر نکال دیا گیا، اور تیسرے خلیفہ کی واپسی سے قبل مقبرہ کو باہر نکال دیا گیا۔ وقت - ایک عالم-سلطان جس نے شجرہ نسب اور تاریخ پر لکھا، اپنے دربار میں علماء کی میزبانی کی، ان میں ابن خلدون بھی شامل ہے، جس نے اپنے تحت الابر کا خلاصہ مکمل کیا۔"
  tr: "Tlemcen'deki Beni Abdülvad Sultanı ve \"Üçüncü Top\"un sahibi Ebu Hammu Musa bin Yusuf bin Abdülrahman; halkının başına gelen felaketten Tunus'a kaçarak, kendisini koruyan ve Sultan Ebu Anan'a götürmeyi reddeden kâhin İbn Tefrakin'in yanında kaldı. Böylece Davevde ve Züğbe'nin desteğiyle geri döndü ve Hicri 760 yılının Rebiü'l-Evvel ayının sekizinci Çarşamba günü Tlemcen'e saldırdı ve halife olarak biat etti. Mağrip ordularının önünden kaçtı ve sonra üçüncü kez geri döndü. Soy ağaçları ve haberler üzerine yazılar yazan ve aralarında İbn Haldun'un da bulunduğu âlimleri huzurunda toplayan bilgili bir sultandı; İbn Haldun, onunla birlikte El-İbar adlı kitabının özetini tamamladı."
  id: "Abu Hammu Musa bin Yusuf bin Abd al-Rahman, Sultan Bani Abd al-Wad di Tlemcen dan pemilik “Bola Ketiga”; ia melarikan diri dari bencana yang menimpa kaumnya ke Tunis dan tinggal bersama bendahara Ibn Tafrakin, yang melindunginya dan menolak untuk memindahkannya ke Sultan Abu Anan. Maka ia kembali dengan dukungan Dawawda dan Zughba dan menyerbu Tlemcen pada hari Rabu, tanggal delapan Rabi’ al-Awwal tahun 760 H, dan disumpah setia sebagai Khalifah. Ia melarikan diri dari pasukan Maghreb dan kemudian kembali untuk ketiga kalinya. Ia adalah seorang Sultan yang berilmu yang menulis tentang silsilah dan berita serta mengumpulkan para ulama di hadapannya, termasuk Ibn Khaldun, yang menyelesaikan ringkasan bukunya Al-Ibar bersamanya."
