summary:
  ar: "حاكم المغرب من سنة 1927 إلى 1961، سلطانا ثم أول ملوك المغرب المستقل. وُلد في فاس سنة 1909 واعتلى العرش خلفا لوالده يوسف، ونفته سلطات الحماية الفرنسية سنة 1953 ثم عاد سنة 1955 وقاد بلاده إلى الاستقلال سنة 1956، واتخذ لقب الملك سنة 1957، وتوفي في الرباط سنة 1961 فخلفه ابنه الحسن الثاني."
  en: "Ruler of Morocco from 1927 to 1961, as sultan and then as the first king of independent Morocco. Born at Fes in 1909, he succeeded his father Yusef, was exiled by the French protectorate authorities in 1953, returned in 1955 and led his country to independence in 1956, took the title of king in 1957, and died at Rabat in 1961, succeeded by his son Hassan II."
  ur: "1927 سے 1961 تک مراکش کے حکمران، پہلے سلطان اور پھر آزاد مراکش کے پہلے بادشاہ۔ وہ 1909 میں فاس میں پیدا ہوئے، اپنے والد یوسف کے جانشین بنے، 1953 میں فرانسیسی حکام نے انہیں جلاوطن کیا، 1955 میں واپس آئے اور 1956 میں ملک کو آزادی دلائی، 1957 میں بادشاہ کا لقب اختیار کیا، اور 1961 میں رباط میں وفات پائی؛ ان کے جانشین ان کے بیٹے حسن ثانی بنے۔"
