summary:
  ar: "حاكم المغرب من سنة 1927 إلى 1961، سلطانا ثم أول ملوك المغرب المستقل. وُلد في فاس سنة 1909 واعتلى العرش خلفا لوالده يوسف، ونفته سلطات الحماية الفرنسية سنة 1953 ثم عاد سنة 1955 وقاد بلاده إلى الاستقلال سنة 1956، واتخذ لقب الملك سنة 1957، وتوفي في الرباط سنة 1961 فخلفه ابنه الحسن الثاني."
  en: "Ruler of Morocco from 1927 to 1961, as sultan and then as the first king of independent Morocco. Born at Fes in 1909, he succeeded his father Yusef, was exiled by the French protectorate authorities in 1953, returned in 1955 and led his country to independence in 1956, took the title of king in 1957, and died at Rabat in 1961, succeeded by his son Hassan II."
  ur: "1927 سے 1961 تک مراکش کے حکمران، پہلے سلطان اور پھر آزاد مراکش کے پہلے بادشاہ۔ وہ 1909 میں فاس میں پیدا ہوئے، اپنے والد یوسف کے جانشین بنے، 1953 میں فرانسیسی حکام نے انہیں جلاوطن کیا، 1955 میں واپس آئے اور 1956 میں ملک کو آزادی دلائی، 1957 میں بادشاہ کا لقب اختیار کیا، اور 1961 میں رباط میں وفات پائی؛ ان کے جانشین ان کے بیٹے حسن ثانی بنے۔"
  es: "Gobernante de Marruecos desde 1927 hasta 1961, primero como sultán y luego como primer rey del Marruecos independiente. Nacido en Fez en 1909, sucedió a su padre Yusef, fue exiliado por las autoridades del protectorado francés en 1953, regresó en 1955 y condujo a su país a la independencia en 1956, asumió el título de rey en 1957 y murió en Rabat en 1961, siendo sucedido por su hijo Hassan II."
  fr: "Souverain du Maroc de 1927 à 1961, en tant que sultan puis premier roi du Maroc indépendant. Né à Fès en 1909, il succède à son père Youssef, est exilé par les autorités du protectorat français en 1953, revient en 1955 et mène son pays à l'indépendance en 1956, prend le titre de roi en 1957 et meurt à Rabat en 1961. Son fils, Hassan II, lui succède."
  tr: "1927'den 1961'e kadar Fas'ı yönetti, ardından sultan ve bağımsız Fas'ın ilk kralı oldu. 1909'da Fes'te doğdu ve babası Youssef'in yerine tahta çıktı. 1953'te Fransız himayesi yetkilileri tarafından sürgüne gönderildi, ardından 1955'te geri döndü ve 1956'da ülkesini bağımsızlığa taşıdı. 1957'de kral unvanını aldı ve 1961'de Rabat'ta öldü; yerine oğlu Hassan II geçti."
  id: "Ia memerintah Maroko dari tahun 1927 hingga 1961, kemudian sebagai sultan dan kemudian raja pertama Maroko merdeka. Ia lahir di Fez pada tahun 1909 dan naik takhta menggantikan ayahnya, Youssef. Ia diasingkan oleh otoritas protektorat Prancis pada tahun 1953, kemudian kembali pada tahun 1955 dan memimpin negaranya menuju kemerdekaan pada tahun 1956. Ia naik ke gelar raja pada tahun 1957 dan meninggal di Rabat pada tahun 1961, digantikan oleh putranya Hassan II."
