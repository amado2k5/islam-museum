summary:
  ar: "داعية ومغنية دينية إندونيسية شابة، وُلدت في سورابايا في 8 أغسطس 2000، وهي كبرى بنات العالم الجاوي الشرقي إدي رحمة الله المعروف بـ«كياي غرانات». اشتهرت بدعوتها المرحة المتخللة بإنشاد الصلوات على وسائل التواصل، وتخرّجت سنة 2023 في الاتصال والدعوة الإسلامية من جامعة سونن أمبل الإسلامية الحكومية في سورابايا، وتدير معهد أبيها «رحمة الله»، ويتابعها الملايين عبر حساباتها."
  en: "Young Indonesian preacher and religious singer, born in Surabaya on 8 August 2000, the eldest daughter of the East Java kiai Edy Rahmatullah, known as 'Kyai Granat'. She became known for cheerful dakwah interwoven with sholawat singing on social media, graduated in Islamic communication and broadcasting from UIN Sunan Ampel Surabaya in 2023, and manages her father's Pondok Pesantren Rahmatullah; her accounts are followed by millions."
  ur: "نوجوان انڈونیشی مبلغہ اور دینی نعت خواں، جو 8 اگست 2000ء کو سورابایا میں پیدا ہوئیں اور مشرقی جاوا کے عالم ایڈی رحمت اللہ، المعروف «کیائی گرانات»، کی سب سے بڑی بیٹی ہیں۔ وہ سوشل میڈیا پر صلوٰۃ خوانی سے مزین خوش مزاج دعوت سے مشہور ہوئیں، 2023ء میں یو آئی این سونن امپیل سورابایا سے اسلامی ابلاغ و نشریات میں گریجویشن کیا، اور اپنے والد کے مدرسے «رحمۃ اللہ» کی نگرانی کرتی ہیں؛ ان کے کھاتوں کے لاکھوں پیروکار ہیں۔"
