summary:
  ar: "داعية ومغنية دينية إندونيسية شابة، وُلدت في سورابايا في 8 أغسطس 2000، وهي كبرى بنات العالم الجاوي الشرقي إدي رحمة الله المعروف بـ«كياي غرانات». اشتهرت بدعوتها المرحة المتخللة بإنشاد الصلوات على وسائل التواصل، وتخرّجت سنة 2023 في الاتصال والدعوة الإسلامية من جامعة سونن أمبل الإسلامية الحكومية في سورابايا، وتدير معهد أبيها «رحمة الله»، ويتابعها الملايين عبر حساباتها."
  en: "Young Indonesian preacher and religious singer, born in Surabaya on 8 August 2000, the eldest daughter of the East Java kiai Edy Rahmatullah, known as 'Kyai Granat'. She became known for cheerful dakwah interwoven with sholawat singing on social media, graduated in Islamic communication and broadcasting from UIN Sunan Ampel Surabaya in 2023, and manages her father's Pondok Pesantren Rahmatullah; her accounts are followed by millions."
  ur: "نوجوان انڈونیشی مبلغہ اور دینی نعت خواں، جو 8 اگست 2000ء کو سورابایا میں پیدا ہوئیں اور مشرقی جاوا کے عالم ایڈی رحمت اللہ، المعروف «کیائی گرانات»، کی سب سے بڑی بیٹی ہیں۔ وہ سوشل میڈیا پر صلوٰۃ خوانی سے مزین خوش مزاج دعوت سے مشہور ہوئیں، 2023ء میں یو آئی این سونن امپیل سورابایا سے اسلامی ابلاغ و نشریات میں گریجویشن کیا، اور اپنے والد کے مدرسے «رحمۃ اللہ» کی نگرانی کرتی ہیں؛ ان کے کھاتوں کے لاکھوں پیروکار ہیں۔"
  es: "Joven predicadora y cantante religiosa indonesia, nacida en Surabaya el 8 de agosto de 2000, hija mayor del kiai de Java Oriental Edy Rahmatullah, conocido como 'Kyai Granat'. Se hizo famosa por su alegre prédica islámica (dakwah) combinada con cantos de sholawat en las redes sociales, se graduó en comunicación y radiodifusión islámica en la UIN Sunan Ampel Surabaya en 2023 y administra el Pondok Pesantren Rahmatullah de su padre; sus cuentas son seguidas por millones de personas."
  fr: "Jeune prédicatrice et chanteuse religieuse indonésienne, née à Surabaya le 8 août 2000, fille aînée du kiai Edy Rahmatullah de Java oriental, surnommé « Kyai Granat », elle s'est fait connaître par ses prédications joyeuses, mêlées à des chants religieux, sur les réseaux sociaux. Diplômée en communication et radiodiffusion islamiques de l'UIN Sunan Ampel de Surabaya en 2023, elle gère le Pondok Pesantren Rahmatullah de son père; ses comptes sont suivis par des millions de personnes."
  tr: "8 Ağustos 2000'de Surabaya'da doğan genç bir Endonezyalı vaiz ve dini şarkıcı olan Eddy, Doğu Cava dünyasının en büyük kızı Eddy, Allah rahmet etsin ve \"Kiay Granat\" olarak bilinir. Sosyal medyada dualarla aralaşan eğlenceli çağrılarıyla ünlendi. 2023 yılında Surabaya'daki Sonen Ampal State İslam Üniversitesi'nden İslami iletişim ve vaaz bölümünden mezun oldu. Babası tarafından yönetilen \"Rahmatullah\" enstitüsünü yönetiyor ve hesapları aracılığıyla milyonlarca kişi tarafından takip ediliyor."
  id: "Seorang pengkhotbah dan penyanyi agama muda asal Indonesia, lahir di Surabaya pada 8 Agustus 2000, ia adalah putri sulung dari dunia Jawa Timur, Eddy, semoga Allah merahmati dirinya, yang dikenal sebagai \"Kiay Granat.\" Ia menjadi terkenal karena panggilan yang ceria dan diselingi doa di media sosial. Ia lulus pada tahun 2023 dalam bidang komunikasi Islam dan khotbah dari Universitas Islam Negeri Sonen Ampal di Surabaya. Ia menjalankan institut ayahnya \"Rahmatullah,\" dan diikuti jutaan orang melalui akun-akunnya."
