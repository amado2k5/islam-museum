roles: [preacher]
summary:
  en: "A Meccan seeker who rejected the idols of his people and sought 'the religion of Abraham' years before the Prophet's mission — the tradition's example of the hanif, the indigenous monotheist."
  ar: "باحث مكي رفض أصنام قومه وطلب «دين إبراهيم» قبل بعثة النبي بسنين — مثال التراث على الحنيف، الموحّد البدوي. وفي الصحيح أن النبي لقيه بأسفل بلدح قبل الوحي فقدمت سفرة فأبى أن يأكل منها وقال «إني لست آكل مما تذبحون على أنصابكم»، وأنه خرج إلى الشام يسأل عن الدين فلم يجد في اليهودية والنصرانية بغيته حتى قال «اللهم إني أشهدك أني على دين إبراهيم» {cite:sahih-al-bukhari 3826} {cite:sahih-al-bukhari 3827}."
  es: "Un buscador de La Meca que rechazó los ídolos de su pueblo y buscó \"la religión de Abraham\" años antes de la misión del Profeta: el ejemplo tradicional del hanif, el monoteísta autóctono."
  fr: "Un chercheur mecquois qui rejeta les idoles de son peuple et rechercha « la religion d'Abraham » des années avant la mission du Prophète — l'exemple traditionnel du hanif, le monothéiste indigène."
  ur: "ایک مکہ کا متلاشی جس نے اپنے لوگوں کے بتوں کو مسترد کر دیا اور پیغمبر کے مشن سے برسوں پہلے 'دین ابراہیم' کی تلاش کی - حنیف کی روایت کی مثال، مقامی توحید پرست۔"
  tr: "Bir Mekkeli araştırmacı, halkının putlarını reddetmiş ve Peygamber'in görevinden yıllar önce 'İbrahim'in dini'ni istemiştir — bu, geleneksel bir tek tanrıcı, bedevi tek tanrılı örneğidir. Gerçek rivayette, Peygamber vahyden önce Balde'nin alt kısmında onunla karşılaşmış, bu yüzden bir sofra sunulmuş, ancak ondan yemek istemeyip 'Sadakalarınızda kurban ettiğiniz şeyden yemem.' dedi. Ayrıca din hakkında sormak için Levant'a gitti, ancak 'Ey Allah, sana şahit olarak şahit oluyorum ki İbrahim'in dininde olduğumu söyleyene kadar' dedi. {cite:sahih-al-bukhari 3826} {cite:sahih-al-bukhari 3827}} dedi."
  id: "Seorang peneliti Mekah menolak berhala bangsanya dan meminta 'agama Abraham' bertahun-tahun sebelum misi Nabi — contoh tradisional monoteis, monetik Badui. Dalam riwayat otentik, Nabi bertemu dengannya di bagian bawah Baldah sebelum wahyu, sehingga sebuah meja disediakan, tetapi dia menolak makan dari sana dan berkata, 'Aku tidak makan dari apa yang kamu korbankan sebagai sedekahmu.' Dia juga pergi ke Levant untuk bertanya tentang agama, tetapi tidak menemukan tujuan dalam Yudaisme atau Kristen sampai dia berkata, 'Ya Allah, aku bersaksi kepada-Mu bahwa aku berada dalam agama Abraham' {cite:sahih-al-bukhari 3826} {cite:sahih-al-bukhari 3827}."
