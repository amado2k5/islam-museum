id: person/ali-ibn-dirr-governor-of-aden-288
class: person
label:
  ar: "علي بن دَرّ والي عدن سنة 288هـ"
  en: "Ali ibn Dirr, governor of Aden, 288 AH"
  ur: "علی بن درّ، عدن کا والی، 288ھ"
  es: "Ali ibn Dirr, governor of Aden, 288 AH"
  fr: "Ali ibn Dirr, governor of Aden, 288 AH"
summary:
  ar: "رجل من الطبريين وصفه الراوي بالعفة والورع والعلم بالحلال والحرام، وجهه الهادي من جيشان واليًا على عدن في ربيع الأول 288هـ."
  en: "A man of the Tabaris whom the narrator describes as chaste, devout and learned in the lawful and the forbidden, sent by al-Hadi from Jayshan as governor of Aden in Rabi I 288 AH."
  ur: "طبریوں کا ایک شخص جسے راوی پاک دامن، پرہیزگار اور حلال و حرام کا عالم بتاتا ہے، جسے ہادی نے ربیع الاول 288ھ میں جیشان سے عدن کا والی بنا کر بھیجا۔"
  es: "Un hombre de la tribu Tabaris, a quien el narrador describe como casto, devoto y versado en lo lícito y lo ilícito, enviado por al-Hadi desde Jayshan como gobernador de Adén en Rabi I 288 AH."
  fr: "Un homme des Tabaris que le narrateur décrit comme chaste, pieux et savant dans le licite et l'interdit, envoyé par al-Hadi de Jayshan comme gouverneur d'Aden en Rabi I 288 AH."
  tr: "Tiberyalılardan bir adam, anlatıcı tarafından iffetli, dindar ve neyin yasal, neyin yasa dışı olduğunu bilen biri olarak tanımlanır. Yüzü, iki ordudan Al-Hadi'dir; Rabi'al-Awwal 288 H.'de Aden valisiydi."
  id: "Seorang pria dari Tiberia, yang digambarkan oleh narator sebagai suci, saleh, dan berpengetahuan tentang apa yang sah dan tidak sah. Wajahnya adalah Al-Hadi dari dua pasukan, gubernur Aden pada Rabi' al-Awwal 288 H."
