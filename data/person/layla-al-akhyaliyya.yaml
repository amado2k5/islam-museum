class: person
label: { ar: "ليلى الأخيلية", en: "Layla al-Akhyaliyya", es: "Layla al-Akhyaliyya", fr: "Layla al-Akhyaliyya", ur: "لیلۃ الاخیالیہ" }
summary:
  ar: "الشاعرة؛ عند البلاذري عن المدائني أتت الحجاج فوصلها وسألته أن يكتب لها إلى عامله بالري فلما صارت بساوة ماتت فدفنت هناك. وعند المسعودي لم يظهر الحجاج لندمائه بشاشة كيوم دخلت عليه ليلى الأخيلية فاعتذرت إليه في مرورها بقبر توبة بن الحمير وقالت سمعته يقول ولو أن ليلى الأخيلية سلمت علي وفوقي جندل وصفائح لسلمت تسليم البشاشة وكان معي نسوة سمعن قوله فكرهت أن أكذبه، فاستحسن قولها وقضى حوائجها، وروى حماد الراوية أنها نزلت إلى قبره فانفرج عن طائر كالحمامة البيضاء فضربت صدرها فوقعت ميتة فدفنت إلى جانبه {cite:muruj-al-dhahab p. 131-132}"
  en: "the poetess; in al-Baladhuri via al-Mada'ini, she came to al-Hajjaj who honored her, and asked a letter to his Rayy agent — dying at Sawa, where she lies buried."
  es: "La poetisa; en al-Baladhuri vía al-Mada'ini, llegó a al-Hajjaj, quien la honró y le pidió una carta para su agente Rayy; murió en Sawa, donde está enterrada."
  fr: "la poétesse; à al-Baladhuri via al-Mada'ini, elle vint à al-Hajjaj qui l'honora et lui demanda une lettre pour son agent Rayy — mourant à Sawa, où elle repose."
  ur: "شاعرہ؛ البلادھوری میں المدائنی کے ذریعے، وہ الحجاج کے پاس آئی جس نے اس کی عزت کی، اور اپنے رے ایجنٹ کو ایک خط پوچھا - جو صوا میں مر رہا تھا، جہاں وہ دفن ہے۔"
  tr: "Al-Madaini'den Al-Baladhuri'ye göre, Al-Hajjaj ona gelmiş ve Rayy'deki valisine onun adına yazmasını istemiştir. Bilge olunca öldü ve orada defnedildi. Al-Mas'udi'ye göre, Al-Hac, Leyla Al-Akhiliyyah içeri girip Tawbah ibn Al-Himyar'ın mezarından geçtiği için özür dilediği günkü gibi yas tutanlarına gülümseyerek görünmedi; şöyle dedi: Eğer Layla Al-Akhiliyya bana üstümde sandaletler ve çarşaflarla selam verseydi, onu sevinçle karşılardı. Yanımda söylediklerini duyan kadınlar vardı ve ona yalan söyleyeceğimi düşündüm. Onun sözlerini beğendi ve ihtiyaçlarını karşıladı. Anlatıcı Hammad, onun mezarına inip beyaz bir güvercin gibi bir kuş gördüğünü, göğsüne vurduğunu ve öldüğünü, bu yüzden yanına gömüldüğünü anlattı {alıntı: Muruj-al-Dhahab s. 131-132}"
  id: "Menurut Al-Baladhuri dari Al-Madaini, Al-Hajjaj datang kepadanya, dan ia memintanya menulis surat untuknya kepada gubernurnya di Rayy. Ketika ia menjadi seorang resi di sana, ia meninggal dan dimakamkan di sana. Menurut Al-Mas'udi, Al-Hajjaj tidak muncul kepada para pelayat dengan senyum seperti hari ketika Layla Al-Akhiliyyah masuk dan meminta maaf kepadanya karena melewati makam Tawbah ibn Al-Himyar, berkata: Saya mendengar ia berkata bahwa jika Layla Al-Akhiliyya menyambut saya dengan sandal dan seprai di atas saya, ia pasti akan menyambutnya dengan sukacita. Saya memiliki wanita bersama saya yang mendengar apa yang ia katakan, dan saya pikir saya akan berbohong kepadanya. Ia menyukai kata-katanya dan memenuhi kebutuhannya. Hammad, sang narator, menceritakan bahwa ia turun ke makamnya dan melihat seekor burung seperti merpati putih, memukul dadanya, dan ia jatuh mati, sehingga ia dikuburkan di sampingnya {cite:Muruj-al-Dhahab hlm. 131-132}"
