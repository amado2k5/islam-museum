class: person
label: { ar: "ليلى الأخيلية", en: "Layla al-Akhyaliyya" }
summary:
  ar: "الشاعرة؛ عند البلاذري عن المدائني أتت الحجاج فوصلها وسألته أن يكتب لها إلى عامله بالري فلما صارت بساوة ماتت فدفنت هناك.، وعند المسعودي لم يظهر الحجاج لندمائه بشاشة كيوم دخلت عليه ليلى الأخيلية فاعتذرت إليه في مرورها بقبر توبة بن الحمير وقالت سمعته يقول ولو أن ليلى الأخيلية سلمت علي وفوقي جندل وصفائح لسلمت تسليم البشاشة وكان معي نسوة سمعن قوله فكرهت أن أكذبه، فاستحسن قولها وقضى حوائجها، وروى حماد الراوية أنها نزلت إلى قبره فانفرج عن طائر كالحمامة البيضاء فضربت صدرها فوقعت ميتة فدفنت إلى جانبه {cite:muruj-al-dhahab p. 131-132}"
  en: "the poetess; in al-Baladhuri via al-Mada'ini, she came to al-Hajjaj who honored her, and asked a letter to his Rayy agent — dying at Sawa, where she lies buried."
