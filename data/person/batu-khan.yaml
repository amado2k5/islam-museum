summary:
  ar: "باتو أمير مغولي، ثاني أبناء جوجي بن جنكيز خان، فاتح روسيا ومؤسس القبيلة الذهبية على الفولغا. ورث بعد وفاة أبيه سنة 624هـ/1227م الأراضي الغربية من إقطاعه، وقاد الجيش المغولي إلى روسيا وبولندا والمجر بين 633 و639هـ، ثم ثبّت حكمه في سهوب القبجاق. عاداه كيوك، وقام هو بدور حاسم في تنصيب منكو خاناً أعظم سنة 649هـ/1251م، وتوفي على الأرجح سنة 653هـ/1255م {cite:encyclopaedia-of-islam-2 vol. 1 p. 1165}."
  en: "Batu was a Mongol prince, the second son of Jochi son of Genghis Khan, the conqueror of Russia and founder of the Golden Horde on the Volga. He inherited the western part of his father's appanage on Jochi's death in 624/1227, commanded the Mongol army that struck Russia, Poland and Hungary between 633/1236 and 639/1241, and then settled his rule in the Kipchak Steppe. An enemy of Guyuk, he played the decisive part in raising Mongke to the Great Khanate in 649/1251, and most likely died in 653/1255 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1165}."
  ur: "باتو منگول شہزادہ، چنگیز خان کے بیٹے جوجی کے دوسرے بیٹے، روس کے فاتح اور وولگا پر قبیلۂ زریں کے بانی تھے۔ باپ کی وفات پر 624ھ/1227ء میں انہیں جاگیر کا مغربی حصہ ملا؛ انہوں نے 633ھ/1236ء سے 639ھ/1241ء کے درمیان روس، پولینڈ اور ہنگری پر حملہ کرنے والی منگول فوج کی کمان کی، پھر دشتِ قپچاق میں اپنی حکومت مستحکم کی۔ گیوک ان کے دشمن تھے اور انہوں نے 649ھ/1251ء میں منگو کو عظیم خان بنوانے میں فیصلہ کن کردار ادا کیا؛ غالباً 653ھ/1255ء میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1165}."
