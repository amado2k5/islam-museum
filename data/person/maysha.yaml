summary:
  ar: "ميشاء ابنة زاذويه مرزبان سرخس؛ وقعت في سهم عبد الله بن خازم السلمي في غنيمة صلح سرخس فاتخذها وسماها ميشاء."
  en: "Maysha', daughter of Zadhuya marzban of Sarakhs; she fell in Ibn Khazim al-Sulami's lot of the Sarakhs treaty, who took her and named her Maysha'."
  es: "Maysha', hija de Zadhuya marzban de Sarakhs; le tocó estar en la lista de Ibn Khazim al-Sulami del tratado de Sarakhs, quien la tomó y la llamó Maysha'."
  fr: "Maysha', fille de Zadhuya marzban de Sarakhs; elle est tombée dans le sort d'Ibn Khazim al-Sulami lors du traité de Sarakhs, qui l'a prise et l'a nommée Maysha'."
  ur: "مائیشا، سرخ کے زادھویا مرزبان کی بیٹی؛ وہ ابن خزیم السلمی کے سرخ کے معاہدے میں پڑ گئی، جس نے اسے لے لیا اور اس کا نام میشا رکھا۔"
  tr: "Sarakhs valisi Zadhuyeh'in kızı Misha; Sarakhs Antlaşması'nın ganimeti için Abdullah bin Khazim Al-Sulemi'nin okuna düştü, bu yüzden onu aldı ve Mişa adını verdi."
  id: "Misha, putri Zadhuyeh, gubernur Sarakhs; dia jatuh ke dalam panah Abdullah bin Khazim Al-Sulami dalam rampasan Perjanjian Sarakhs, sehingga dia membawanya dan menamainya Misha."
