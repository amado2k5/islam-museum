id: person/ibn-makula
class: person
label: { ar: "قاضي القضاة ابن ما كولا الحسين بن علي العجلي" }
summary:
  ar: "قاضي القضاة أبو عبد الله ابن ما كولا الحسين بن علي بن جعفر العجلي الجرباذقاني، شافعي المذهب، من ولد الأمير أبي دلف العجلي؛ تولى قضاء القضاة ببغداد سنة عشرين وأربعمائة، قال الخطيب: كان عارفاً بمذهب الشافعي وسمع من ابن منده بأصبهان، ولم نر قاضياً أنزه منه؛ ووالده الأمير أبو نصر علي بن هبة الله مصنف «الإكمال في أسماء الرجال»؛ ولد سنة ثمان وستين وثلاثمائة ومات في شوال سنة سبع وأربعين وأربعمائة وهو على قضائه {cite:shadharat-dhahab p. 276}. ويذكر ابن الجوزي كتاب عهده بقضاء القضاة الذي قُرئ سنة ٤٢٠ وأعيدت قراءته سنة ٤٢٣ {cite:muntazam-ibn-al-jawzi j.8 p.387} {cite:muntazam-ibn-al-jawzi j.8 p.404}."
  en: "Chief qadi Abu Abdallah 'Ibn Makula' al-Husayn b. Ali al-Ijli al-Jarbadhaqani, Shafi'i, of the Abu Dulaf al-Ijli line; held Baghdad's chief judgeship from 420 — al-Khatib says he knew the Shafi'i madhhab, heard Ibn Manda at Isfahan, and 'we never saw a more scrupulous qadi'; his father Abu Nasr authored *al-Ikmal fi Asma' al-Rijal*; born 368, died in office Shawwal 447 {cite:shadharat-dhahab p. 276}."
