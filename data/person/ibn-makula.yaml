id: person/ibn-makula
class: person
label: { ar: "قاضي القضاة ابن ما كولا الحسين بن علي العجلي" }
summary:
  ar: "قاضي القضاة أبو عبد الله ابن ما كولا الحسين بن علي بن جعفر العجلي الجرباذقاني، شافعي المذهب، من ولد الأمير أبي دلف العجلي؛ تولى قضاء القضاة ببغداد سنة عشرين وأربعمائة، قال الخطيب: كان عارفاً بمذهب الشافعي وسمع من ابن منده بأصبهان، ولم نر قاضياً أنزه منه؛ ووالده الأمير أبو نصر علي بن هبة الله مصنف «الإكمال في أسماء الرجال»؛ ولد سنة ثمان وستين وثلاثمائة ومات في شوال سنة سبع وأربعين وأربعمائة وهو على قضائه {cite:shadharat-dhahab p. 276}. ويذكر ابن الجوزي كتاب عهده بقضاء القضاة الذي قُرئ سنة ٤٢٠ وأعيدت قراءته سنة ٤٢٣ {cite:muntazam-ibn-al-jawzi j.8 p.387} {cite:muntazam-ibn-al-jawzi j.8 p.404}."
  en: "Chief qadi Abu Abdallah 'Ibn Makula' al-Husayn b. Ali al-Ijli al-Jarbadhaqani, Shafi'i, of the Abu Dulaf al-Ijli line; held Baghdad's chief judgeship from 420 — al-Khatib says he knew the Shafi'i madhhab, heard Ibn Manda at Isfahan, and 'we never saw a more scrupulous qadi'; his father Abu Nasr authored *al-Ikmal fi Asma' al-Rijal*; born 368, died in office Shawwal 447 {cite:shadharat-dhahab p. 276}."
  es: "Cadí jefe Abu Abdallah 'Ibn Makula' al-Husayn b. Ali al-Ijli al-Jarbadhaqani, Shafi'i, de la línea Abu Dulaf al-Ijli; ocupó el cargo de juez principal de Bagdad desde 420; al-Khatib dice que conocía la madhab shafí, escuchó a Ibn Manda en Isfahán y que «nunca vimos un cadí más escrupuloso»; su padre Abu Nasr fue el autor de *al-Ikmal fi Asma' al-Rijal*; nacido en 368, muerto en el cargo Shawwal 447 {cita: shadharat-dhahab p. 276}."
  fr: "Cadi en chef Abu Abdallah 'Ibn Makula' al-Husayn b. Ali al-Ijli al-Jarbadhaqani, Shafi'i, de la lignée Abu Dulaf al-Ijli; a occupé le poste de juge en chef de Bagdad à partir de 420 — al-Khatib dit qu'il connaissait le madhhab Shafi'i, qu'il a entendu Ibn Manda à Ispahan et que « nous n'avons jamais vu de cadi plus scrupuleux »; son père Abu Nasr est l'auteur de *al-Ikmal fi Asma' al-Rijal*; né en 368, décédé en fonction Shawwal 447 {cite: shadharat-dhahab p. 276}."
  ur: "چیف قاضی ابو عبداللہ 'ابن مکولہ' الحسین بن. علی الاجلی الجربدقانی، شافعی، ابو دلف الجلی سطر کے؛ 420 سے بغداد کے چیف منصف کے عہدے پر فائز رہے — الخطیب کہتے ہیں کہ وہ شافعی مذھب کو جانتے تھے، ابن مندہ کو اصفہان میں سنا، اور 'ہم نے اس سے زیادہ بدتمیز قاضی کبھی نہیں دیکھا'؛ ان کے والد ابو نصر نے *الاکمال فی اسماء الرجال* کی تصنیف کی۔ پیدائش 368، دفتر شوال 447 میں وفات پائی۔ 276}۔"
  tr: "Şafii mezhebinden, Baş Yargıç Ebu Abdullah ibn Ma Kula el-Hüseyin bin Ali ibn Ca'fer el-Ajli el-Cerbadqani, Ebu Dulf el-Ecli'nin oğlu olarak doğdu; dört yüz yirmi yaşında Bağdat'ta yargıç olarak görev yaptı. El-Hatib şöyle dedi: Şafii mezhebi hakkında bilgiliydi ve İsfahan'da İbn Mandah'tan dinledi, ondan daha erdemli bir hakim bulamadık. Babası, 'El-İkmal fi Asma' el-Rijal' adlı eserin yazarı Prens Ebu Nasr Ali ibn Hibat Allah'tı; 368 Hicri yılında doğmuş ve 447 Hicri yılında, yargıçlık yaparken Şevval'de ölmüştür {atıf:şadharat-dhahab, s. 276}. İbn al-Jawzi, döneminin Hakimler kitabı olarak anıldığını belirtir; kitap 420 Hicri'de okunmuş ve 423'te tekrar okunmuştur {atıf:Muntazam-ibn-al-jawzi J.8 s.387} {cite:Muntazam-ibn-al-jawzi J.8 s.404}."
  id: "Hakim Agung Abu Abdullah ibn Ma Kula al-Husayn ibn Ali ibn Ja'far al-Ajli al-Jarbadqani, dari aliran Syafi'i, lahir dari Emir Abu Dulf al-Ajli; ia menjabat sebagai hakim di Baghdad pada tahun empat ratus dua puluh. Al-Khatib berkata: Ia berpengetahuan tentang aliran Syafi'i dan mendengar dari Ibn Mandah di Isfahan, dan kami belum menemukan hakim yang lebih berbudi luhur darinya. Ayahnya adalah Pangeran Abu Nasr Ali ibn Hibat Allah, penulis 'Al-Ikmal fi Asma' al-Rijal; lahir pada tahun 368 H dan meninggal di Shawwal pada tahun 447 H, saat menjabat sebagai hakim {cite:shadharat-dhahab, hlm. 276}. Ibn al-Jawzi menyebutkan kitab pada zamannya sebagai hakim hakim, yang dibacakan pada tahun 420 H dan dibaca ulang pada tahun 423 {cite:Muntazam-ibn-al-jawzi J.8 hlm.387} {cite:Muntazam-ibn-al-jawzi J.8 hlm.404}."
