  es: "Empresaria emiratí; presidenta y directora general del Grupo Easa Saleh Al Gurg (ESAG), con unas treinta líneas de negocio, una de las primeras mujeres emiratíes en formar parte de consejos de administración y una figura habitual en las listas internacionales de mujeres de negocios árabes más influyentes."
  fr: "Femme d'affaires émiratie; présidente et directrice générale du groupe Easa Saleh Al Gurg (ESAG), qui compte une trentaine de secteurs d'activité, parmi les premières femmes émiraties à siéger à des conseils d'administration et figurant régulièrement sur les listes internationales de femmes d'affaires arabes influentes."
