  ar: سيدة أعمال إماراتية؛ رئيسة ومديرة عام مجموعة عيسى صالح القرق ⁦(ESAG)⁩ ذات النشاطات الثلاثين، ومن أوائل الإماراتيات في مجالس الشركات ومن أقوى سيدات الأعمال العربيات في القوائم الدولية.
