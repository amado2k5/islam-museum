summary:
  ar: "الفقيه الحنبلي البغدادي؛ روى عن القاضي أبي يعلى وابن المهتدي وابن المسلمة والصريفيني وابن النقور، وتفقه على الشريف أبي جعفر ثم القاضي يعقوب ثم القاضي البرزبني، وأفتى ودرس وجمع كتباً كثيرة لم يسبق إلى جمع مثلها وكان حسن السيرة جميل الطريقة سديد الأقدية؛ توفي عاشر المحرم سنة ثلاث عشرة وخمسمائة ودفن إلى جانب أبي بكر الخلال عند رجل الإمام أحمد {cite:shadharat-dhahab p. 520-521}."
  en: "The Baghdadi Hanbali faqih Abu Sa'd al-Mukharrimi — pupil of the Sharif Abu Ja'far and the qadis Ya'qub and al-Barzabani, who collected a library no one before him had matched; d. 10 Muharram 513, buried beside Abu Bakr al-Khallal at Imam Ahmad's feet {cite:shadharat-dhahab p. 520-521}."
  fr: "Abu Sa'd al-Mukharrimi – élève du Sharif Abu Ja'far et le qadis Ya'qub et al-Barzabani, qui a recueilli une bibliothèque que personne avant lui n'avait égalé ; décédé 10 Muharram 513, enterré à côté d'Abu Bakr al-Khallal aux pieds de l'Imam Ahmad {cite:shadharat-dhahab p. 520-521}."
  es: "El faqih bagdadí Hanbali Abu Sa'd al-Mukharrimi, alumno del Sharif Abu Ja'far y de los qadis Ya'qub y al-Barzabani, que reunió una biblioteca que nadie antes que él había igualado; d. 10 Muharram 513, enterrado junto a Abu Bakr al-Khallal a los pies del Imam Ahmad {cita: shadharat-dhahab p. 520-521}."
  ur: "بغدادی حنبلی فقیہ ابو سعد المخریمی - شریف ابو جعفر کے شاگرد اور قادیان یعقوب اور البرزبانی، جنہوں نے ایک ایسی لائبریری جمع کی جس کا ان سے پہلے کسی نے مماثلت نہیں دی تھی۔ d 10 محرم 513، امام احمد کے قدموں میں ابو بکر الخلال کے پاس دفن کیا گیا 520-521}۔"
