summary:
  ar: "الفقيه الحنبلي البغدادي؛ روى عن القاضي أبي يعلى وابن المهتدي وابن المسلمة والصريفيني وابن النقور، وتفقه على الشريف أبي جعفر ثم القاضي يعقوب ثم القاضي البرزبني، وأفتى ودرس وجمع كتباً كثيرة لم يسبق إلى جمع مثلها وكان حسن السيرة جميل الطريقة سديد الأقدية؛ توفي عاشر المحرم سنة ثلاث عشرة وخمسمائة ودفن إلى جانب أبي بكر الخلال عند رجل الإمام أحمد {cite:shadharat-dhahab p. 520-521}."
  en: "The Baghdadi Hanbali faqih Abu Sa'd al-Mukharrimi — pupil of the Sharif Abu Ja'far and the qadis Ya'qub and al-Barzabani, who collected a library no one before him had matched; d. 10 Muharram 513, buried beside Abu Bakr al-Khallal at Imam Ahmad's feet {cite:shadharat-dhahab p. 520-521}."
