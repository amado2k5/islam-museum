id: person/abu-said-ilkhan
class: person
label: { ar: "أبو سعيد بن خدابنده", en: "Abu Sa'id ibn Khudabanda", fr: "Abu Sa'id ibn Khudabanda", es: "Abu Sa'id ibn Khudabanda", ur: "ابو سعید بن خدابندہ" }
summary:
  ar: "ملك التتار بعد أبيه، أمر بالعدل وأقام السنة والترضي عن الشيخين ثم عثمان ثم علي في الخطبة وسكن كثير من الفتن وكان من خير ملوك التتار وأحسنهم طريقة واستمر إلى أن مات سنة ست وثلاثين وسبع مئة ولم يقم لهم من بعده قائمة بل تفرقوا شذر مذر {cite:tarikh-khulafa-minhaj-1434 p. 735}."
  en: "Khudabanda's son, best of the Tatar kings — he restored the Sunna and the four-caliph order in the khutba; on his death in 736 their house crumbled {cite:tarikh-khulafa-minhaj-1434 p. 735}."
  fr: "Fils de Khudabanda, le meilleur des rois tatars : il rétablit la sunna et l'ordre des quatre califes dans la khutba ; à sa mort en 736, leur maison s'effondra {cite:tarikh-khulafa-minhaj-1434 p. 735}."
  es: "Hijo de Khudabanda, el mejor de los reyes tártaros, restauró la Sunna y el orden de los cuatro califas en la jutba; a su muerte en 736, su casa se desmoronó {cite:tarikh-khulafa-minhaj-1434 p. 735}."
  ur: "خدابندہ کا بیٹا، تاتاری بادشاہوں میں سب سے اچھا - اس نے خطبہ میں سنت اور چار خلیفہ کی ترتیب کو بحال کیا۔ 736 میں ان کی وفات پر ان کا مکان گر گیا 735}۔"
  tr: "Babasının ardından Tatarların kralı olan bu kişi, adaleti sağladı, Sünneti tesis etti ve önce Osman'ı, sonra da Ali'yi vaazlarında memnun etti. Birçok fitneyi yatıştırdı ve Tatar krallarının en iyi ve en erdemlilerinden biriydi. Yedi yüz otuz altı yılında vefat edene kadar hüküm sürdü ve ondan sonra başka bir ayaklanma olmadı, aksine her yöne dağıldılar. {cite:tarikh-khulafa-minhaj-1434 s. 735}"
  id: "Raja Tatar setelah ayahnya, ia menegakkan keadilan dan menetapkan Sunnah, serta senang dengan khutbah kedua Syekh, Utsman, dan Ali. Ia juga meredakan banyak pemberontakan dan merupakan salah satu raja Tatar terbaik dan paling berbudi luhur. Ia memerintah hingga wafat pada tahun 736, dan mereka tidak bangkit setelahnya, melainkan berpencar ke segala arah. {cite:tarikh-khulafa-minhaj-1434 p. 735}."
