summary:
  ar: "هشام بن عمار بن نصير السلمي الدمشقي، راوي قراءة عبد الله بن عامر اليحصبي؛ ولد سنة 153هـ وتوفي سنة 245هـ، وقيل 244هـ، وكان عالم أهل دمشق وخطيبهم ومقرئهم ومحدثهم ومفتيهم {cite:nashr-dahman-damascus-1345-v1 p. 155}."
  en: "Hisham ibn 'Ammar ibn Nusayr al-Sulami of Damascus, transmitter of the reading of 'Abd Allah ibn 'Amir al-Yahsubi; born in 153 AH and died in 245 AH, or 244 by another report, he was in Ibn al-Jazari's phrase the scholar of the people of Damascus, their preacher, reader, hadith transmitter and mufti {cite:nashr-dahman-damascus-1345-v1 p. 155}."
  ur: "ہشام بن عمار بن نصیر سلمی دمشقی، عبد اللہ بن عامر یحصبی کی قراءت کے راوی؛ 153ھ میں پیدا ہوئے اور 245ھ میں فوت ہوئے، اور ایک قول میں 244ھ؛ ابن الجزری کے الفاظ میں وہ اہلِ دمشق کے عالم، خطیب، مقرئ، محدث اور مفتی تھے {cite:nashr-dahman-damascus-1345-v1 p. 155}."
  es: "Hisham ibn 'Ammar ibn Nusayr al-Sulami de Damasco, transmisor de la lectura de 'Abd Allah ibn 'Amir al-Yahsubi; nació en 153 AH y murió en 245 AH, o 244 según otro informe, fue en palabras de Ibn al-Jazari el erudito de la gente de Damasco, su predicador, lector, transmisor de hadices y muftí {cite:nashr-dahman-damascus-1345-v1 p. 155}."
  fr: "Hisham ibn 'Ammar ibn Nusayr al-Sulami de Damas, transmetteur de la lecture de 'Abd Allah ibn 'Amir al-Yahsubi; né en 153 AH et mort en 245 AH, ou 244 selon un autre rapport, il était dans l'expression d'Ibn al-Jazari le savant des habitants de Damas, leur prédicateur, lecteur, transmetteur de hadiths et mufti {cite:nashr-dahman-damascus-1345-v1 p. 155}."
  tr: "Hisham ibn Ammar ibn Nasir al-Sulami al-Dimashqi, Abdullah ibn Amir al-Yahsabi'nin okuntularının anlatıcısıdır; 153 Hicri doğumlu ve 245 Hicri yıllarında ölmüştür, bazıları ise 244 H der ki. Şam halkının alimi, hatibi, şifaetçisi, hadis alimi ve müftüsüydü {cite:nashr-dahman-damascus-1345-v1, s. 155}."
  id: "Hisham ibn Ammar ibn Nasir al-Sulami al-Dimashqi, seorang narator pembacaan Abdullah ibn Amir al-Yahsabi; lahir pada tahun 153 H dan meninggal pada 245 H, dan beberapa mengatakan 244 H. Ia adalah seorang cendekiawan, orator, pembaca, ulama hadis, dan mufti dari masyarakat Damaskus {cite:nashr-dahman-damascus-1345-v1, hlm. 155}."
