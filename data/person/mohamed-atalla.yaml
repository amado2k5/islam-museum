summary:
  ar: "مهندس وفيزيائي ومشفِّر مصري-أمريكي ⁦(1924–2009)⁩، وُلد في بورسعيد ودرس في جامعة القاهرة ثم نال الماجستير والدكتوراه في الهندسة الميكانيكية من جامعة بوردو ⁦(1947 و1949)⁩. عمل في مختبرات بِل منذ 1949 وطوّر التخميل السطحي بالأكسدة الحرارية فحلّ مشكلة حالات سطح السيليكون، ثم صنع مع زميله داون كانغ أول ترانزستور موسفت عام 1959 — أكثر الأجهزة تصنيعاً في التاريخ وركيزة الإلكترونيات الحديثة. أسس لاحقاً شركة عطا الله لأمن البيانات ⁦(1972)⁩ وأصدر «صندوق عطا الله» أول وحدة أمن أجهزة يؤمّن معظم معاملات الصراف الآلي في العالم، ولُقّب «أب الرقم السري»، وأُدخل قاعة مشاهير المخترعين الوطنيين عام 2009 {cite:wikipedia-mohamed-atalla-en}."
  en: "Egyptian-American engineer, physicist, cryptographer and entrepreneur ⁦(1924–2009)⁩, born in Port Said and educated at Cairo University then Purdue ⁦(MSc 1947, PhD 1949 in mechanical engineering)⁩. At Bell Labs from 1949 he developed surface passivation by thermal oxidation, solving the silicon surface-state problem, then built the first MOSFET with Dawon Kahng in 1959 — the most-fabricated device in history and the foundation of modern electronics. He later founded the data-security company Atalla Corporation ⁦(1972)⁩ and released the 'Atalla Box', the first hardware security module, which secured most of the world's ATM transactions; he was called the 'Father of the PIN' and was inducted into the National Inventors Hall of Fame in 2009 {cite:wikipedia-mohamed-atalla-en}."
  ur: "مصری نژاد امریکی انجینئر، طبیعیات دان، خفیہ نگار اور کاروباری ⁦(1924–2009)⁩، بورسعید میں پیدا ہوئے، جامعہ قاہرہ اور پھر پرڈیو سے تعلیم پائی ⁦(میکینیکل انجینئرنگ میں ایم ایس سی 1947 اور پی ایچ ڈی 1949)⁩۔ 1949 سے بیل لیبز میں حرارتی آکسیڈیشن سے سطحی تخمیل تیار کر کے سلیکون کی سطحی حالتوں کا مسئلہ حل کیا، پھر 1959 میں داون کانگ کے ساتھ پہلا موسفیٹ بنایا — تاریخ کا سب سے زیادہ تیار شدہ آلہ اور جدید الیکٹرانکس کی بنیاد۔ بعد میں ڈیٹا سکیورٹی کمپنی عطا اللہ کارپوریشن ⁦(1972)⁩ بنائی اور پہلی ہارڈویئر سکیورٹی ماڈیول «عطا اللہ باکس» جاری کی جس نے دنیا کی بیشتر اے ٹی ایم لین دین محفوظ کیے؛ «پن کے بابا» کہلائے اور 2009 میں قومی ایجاد کنندگان ہال آف فیم میں شامل ہوئے {cite:wikipedia-mohamed-atalla-en}۔"
kids:
  ar: "مهندس مصري اسمه محمد عطا الله صنع مع زميله داون كانغ في عام 1959 قطعة صغيرة اسمها موسفت، وهي مفتاح إلكتروني لا يكاد يُرى، وصارت اليوم في كل هاتف وحاسوب وسيارة بالمليارات — فهي أكثر شيء صنعه البشر عدداً في التاريخ."
  en: "An Egyptian engineer named Mohamed Atalla built, with his colleague Dawon Kahng in 1959, a tiny electronic switch called the MOSFET — today it sits inside every phone, computer and car by the billion, the most-manufactured object in human history."
  ur: "محمد عطا اللہ نامی مصری انجینئر نے 1959 میں اپنے ساتھی داون کانگ کے ساتھ ایک بہت چھوٹا برقی سوئچ بنایا جسے موسفیٹ کہتے ہیں — آج یہ ہر فون، کمپیوٹر اور گاڑی میں اربوں کی تعداد میں موجود ہے، اور یہ تاریخ میں سب سے زیادہ بنائی گئی چیز ہے۔"
