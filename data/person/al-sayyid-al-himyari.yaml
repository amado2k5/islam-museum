summary:
  ar: "شاعر آل البيت، له في الحسين بن علي أشعار كثيرة منها يا شعب رضوى ما لمن بك لا يرى وما إليه من الصبابة أولق، وذكر إسماعيل الساحر راويته أنه ما مات إلا على قوله بالكيسانية، وأنكر علي بن محمد النوفلي نسبة قصيدة تجعفرت بسم الله إليه {cite:muruj-al-dhahab p. 75-76}."
  en: "The Alids' poet — his Husayn elegies include 'people of Radwa, what of one who weeps unseen'; his rawi Isma'il al-Sahir held he died a Kaysani, while al-Nawfali disputed the attribution of a famous ode {cite:muruj-al-dhahab p. 75-76}."
  fr: "Le poète des Alids – ses élégies Husayn comprennent « le peuple de Radwa, qu'en est-il de celui qui pleure invisible » ; son crudi Isma'il al-Sahir a soutenu qu'il est mort en Kaysani, tandis qu'al-Nawfali a contesté l'attribution d'une ode célèbre {cite:muruj-al-dhahab p. 75-76}."
  es: "El poeta de los Alids —sus elegías de Husayn incluyen «gente de Radwa, ¿qué decir de aquel que llora sin ser visto?»; su rawi Isma'il al-Sahir sostenía que murió siendo Kaysani, mientras que al-Nawfali cuestionó la atribución de una famosa oda {cite:muruj-al-dhahab p. 75-76}."
