    note: "No source read attests a religion or a school for Lahouti himself. The English article makes no statement of his religion and files him only under the category 'Iranian Marxists'; the Persian infobox leaves its religion (مذهب) field blank and lists Marxism in its school-of-thought field, a political ideology rather than a religion attestation; Iranica's lead likewise calls him a 'Marxist poet'. His parents' affiliations are family background and are not transferred: the Persian article names his father as a follower of the Ni'matullahi Sufi order and, on Lahouti's own letter, his mother as a follower of the Yarsan faith. His youthful clerical schooling and early religious and mystic poetry are formation and repertoire, and Iranica's record that his later poetry urged people to 'denounce religion' and embrace communism is the advocacy of his writings; neither amounts to a documented profession of personal unbelief, so the atheist-or-sceptic bar of two independent sources is not met. Wikidata carries no religion value at all."
