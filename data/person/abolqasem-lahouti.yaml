summary:
  ar: "شاعر وناشط سياسي إيراني سوفييتي (1887–1957) من كرمانشاه، قاد انتفاضة الدرك في تبريز سنة 1922 ثم فرّ إلى الاتحاد السوفييتي، فصار مؤسس الشعر الطاجيكي السوفييتي وكاتب كلمات نشيد جمهورية طاجيكستان السوفييتية ووزير ثقافتها."
  en: "Iranian-Soviet poet and political activist (1887-1957) from Kermanshah who led the 1922 gendarmerie uprising at Tabriz, fled to the Soviet Union, and became the founder of Soviet Tajik poetry, the lyricist of the Tajik SSR anthem, and Soviet Tajikistan's minister of culture."
