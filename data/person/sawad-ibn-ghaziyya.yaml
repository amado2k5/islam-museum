summary:
  en: "An Ansari Companion at Badr who, when the Prophet's arrow nicked him while straightening the ranks, bared his own belly for retaliation; the Prophet embraced him instead — the best-known of the 'wonders of faith' vignettes from the battle."
  ar: "صحابي أنصاري وقف يوم بدر متقدماً على الصف فأوجعه النبي بقدحٍ وهو يسوّي الصفوف، فكشف عن بطنه طالباً القصاص، فعانقه النبي؛ وتروى قصته في «روائع الإيمان» من مشاهد بدر."
  ur: "بدر کا انصاری صحابی جسے صف سیدھی کرتے نبی کے تیر نے چھوا تو اس نے بدلے کے لیے اپنا پیٹ ننگا کیا۔"
  es: "Un compañero de los Ansar en Badr, quien, cuando la flecha del Profeta lo rozó mientras ordenaba las filas, se desnudó el vientre en represalia; el Profeta lo abrazó en su lugar, la más conocida de las anécdotas de \"maravillas de la fe\" de la batalla."
  fr: "Un Compagnon Ansari à Badr qui, lorsque la flèche du Prophète l'effleura alors qu'il redressait les rangs, découvrit son propre ventre en guise de représailles; le Prophète l'embrassa à la place — la plus connue des anecdotes sur les « merveilles de la foi » de la bataille."
  tr: "Badr gününde bir Ansari yoldaş sırayı yönetiyordu ve Peygamber, sıraları düzleştirirken onu mızrakla acıttı, bu yüzden Badr karnını açıp intikam talep etti ve Peygamber onu kucakladı; hikayesi \"İnanç Mucizesi\"nde Bedr sahnelerinden anlatılmıştır."
  id: "Seorang sahabat Ansari berdiri pada hari Badr memimpin barisan, dan Nabi menyakitinya dengan tombak saat dia sedang meratakan barisan, sehingga dia membuka perutnya menuntut pembalasan, dan Nabi memeluknya; kisahnya diceritakan dalam \"Keajaiban Iman\" dari adegan Badr."
