  ar: "كبير جرهم وسيدهم في قصة إسماعيل؛ زوّج إسماعيل ابنته بعد طلاقه امرأته الأولى، فولدت له اثني عشر ولداً، ثم انتقلت إليه زعامة مكة بعد نابت وقيدار فصارت الولاية في جرهم زهاء عشرين قرناً؛ وهو غير عمرو بن الحارث بن مضاض الذي دفن غزالي الكعبة عند جلاء جرهم."
  en: "Chief of Jurhum in the story of Ismail; he gave Ismail his daughter after Ismail divorced his first wife, and she bore twelve sons; after Nabit and Qaydar the leadership of Mecca passed to him and stayed with Jurhum for about twenty centuries. Not to be confused with Amr ibn al-Harith ibn Mudad who buried the Kaaba's gazelles when Jurhum left."
