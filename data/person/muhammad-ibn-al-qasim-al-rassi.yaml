summary:
  ar: عم الهادي، أمّه في صلاة العشاء بالفرع بعد أن جعل الهادي الأمر إليه، ثم طلب منه الاستغفار لتقدمه عليه.
  en: An uncle of al-Hadi, who led the night prayer at al-Fur' after al-Hadi put the matter to him, and then asked al-Hadi to ask forgiveness for him for having gone before him.
  ur: ہادی کے چچا، جنہوں نے فرع میں ہادی کے معاملہ ان کے سپرد کرنے کے بعد عشاء کی نماز پڑھائی اور پھر ہادی سے کہا کہ ان کے لیے استغفار کریں کہ وہ ان سے آگے بڑھے۔
