id: person/muhammad-ibn-al-qasim-al-rassi
class: person
label:
  ar: محمد بن القاسم الرسي
  en: Muhammad ibn al-Qasim al-Rassi
  ur: محمد بن قاسم رسی
  es: "Muhammad ibn al-Qasim al-Rassi"
  fr: "Muhammad ibn al-Qasim al-Rassi"
summary:
  ar: عم الهادي، أمّه في صلاة العشاء بالفرع بعد أن جعل الهادي الأمر إليه، ثم طلب منه الاستغفار لتقدمه عليه.
  en: An uncle of al-Hadi, who led the night prayer at al-Fur' after al-Hadi put the matter to him, and then asked al-Hadi to ask forgiveness for him for having gone before him.
  ur: ہادی کے چچا، جنہوں نے فرع میں ہادی کے معاملہ ان کے سپرد کرنے کے بعد عشاء کی نماز پڑھائی اور پھر ہادی سے کہا کہ ان کے لیے استغفار کریں کہ وہ ان سے آگے بڑھے۔
  es: "Un tío de al-Hadi, que dirigió la oración nocturna en al-Fur' después de que al-Hadi le planteara el asunto, le pidió entonces a al-Hadi que pidiera perdón por él por haberse adelantado."
  fr: "Un oncle d'al-Hadi, qui dirigea la prière de nuit à al-Fur' après qu'al-Hadi lui eut soumis la question, et qui demanda ensuite à al-Hadi de demander pardon pour lui pour être passé avant lui."
  tr: "El-Hadi'nin amcası ve annesi, El-Hadi'nin işi ona emanet ettikten sonra Al-Far'da İsha namazı sırasında, öncelik için af dilemesini istedi."
  id: "Paman Al-Hadi, ibunya, saat shalat Isha di Al-Far' setelah Al-Hadi mempercayakan perkara itu kepadanya, kemudian memintanya untuk meminta maaf agar dia menjadi yang utama."
