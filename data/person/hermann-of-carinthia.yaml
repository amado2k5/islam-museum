kids:
  ar: "هرمان الكارنثي ترجم إلى اللاتينية كتباً عربية في الفلك والهندسة فقرأها طلاب أوروبا."
  en: "Hermann of Carinthia translated Arabic books on the stars and on geometry into Latin so that students in Europe could read them."
  ur: "ہرمن کارنتھیائی نے ستاروں اور ہندسے کی عربی کتابیں لاطینی میں ترجمہ کیں تاکہ یورپ کے طلبہ انہیں پڑھ سکیں۔"
