summary:
  ar: "هرمان الكارنثي، ويسميه الموسوعة أيضاً هرمان الدلماطي، مترجم لاتيني من القرن الثاني عشر للميلاد كان من الرهبان الذين كلفهم بطرس المبجل بترجمة نصوص إسلامية إلى اللاتينية، وتنسب إليه ترجمة كتاب الكرة المسطحة لبطلميوس عن صيغة مسلمة المجريطي العربية، ونسخة لاتينية من أصول إقليدس مبنية على أصل عربي متأخر، وترجمة المدخل الكبير لأبي معشر سنة 1150م باسم هرمانوس الثاني الألماني، وتحذر المقالات من أن الأسماء تتعدد ولا تذكر ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
  en: "Hermann of Carinthia, called Hermann of Dalmatia elsewhere in the Encyclopaedia of Islam, was a twelfth-century Latin translator, one of the scholars Peter the Venerable commissioned to put Islamic texts into Latin. The articles credit him with Ptolemy's Planisphaerium rendered from Maslama al-Majriti's Arabic version, a Latin Euclid's Elements made from a later Arabic recension, and, under the name Hermannus Secundus or the German, a 1150 translation of Abu Ma'shar's Great Introduction. They give neither birth nor death dates {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
  ur: "ہرمن کارنتھیائی، جنہیں دائرۃ المعارف الاسلامیہ دوسری جگہ ہرمن دلماتی بھی کہتا ہے، بارہویں صدی عیسوی کے لاطینی مترجم تھے اور ان علما میں شامل تھے جنہیں پیٹر محترم نے اسلامی متون کے لاطینی ترجمے پر مقرر کیا۔ مقالات ان سے بطلیموس کی کتاب کرۂ مسطحہ کا وہ ترجمہ منسوب کرتے ہیں جو مسلمہ مجریطی کے عربی نسخے سے کیا گیا، اقلیدس کے اصول کا ایک متاخر عربی نسخے پر مبنی لاطینی ترجمہ، اور ہرمانوس ثانی یا جرمن کے نام سے ابو معشر کے المدخل الکبیر کا 1150ء کا ترجمہ۔ ان کی ولادت اور وفات کی تاریخیں مقالات میں نہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
