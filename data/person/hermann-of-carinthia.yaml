summary:
  ar: "هرمان الكارنثي، ويسميه الموسوعة أيضاً هرمان الدلماطي، مترجم لاتيني من القرن الثاني عشر للميلاد كان من الرهبان الذين كلفهم بطرس المبجل بترجمة نصوص إسلامية إلى اللاتينية، وتنسب إليه ترجمة كتاب الكرة المسطحة لبطلميوس عن صيغة مسلمة المجريطي العربية، ونسخة لاتينية من أصول إقليدس مبنية على أصل عربي متأخر، وترجمة المدخل الكبير لأبي معشر سنة 1150م باسم هرمانوس الثاني الألماني، وتحذر المقالات من أن الأسماء تتعدد ولا تذكر ميلاده ولا وفاته {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
  en: "Hermann of Carinthia, called Hermann of Dalmatia elsewhere in the Encyclopaedia of Islam, was a twelfth-century Latin translator, one of the scholars Peter the Venerable commissioned to put Islamic texts into Latin. The articles credit him with Ptolemy's Planisphaerium rendered from Maslama al-Majriti's Arabic version, a Latin Euclid's Elements made from a later Arabic recension, and, under the name Hermannus Secundus or the German, a 1150 translation of Abu Ma'shar's Great Introduction. They give neither birth nor death dates {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
  ur: "ہرمن کارنتھیائی، جنہیں دائرۃ المعارف الاسلامیہ دوسری جگہ ہرمن دلماتی بھی کہتا ہے، بارہویں صدی عیسوی کے لاطینی مترجم تھے اور ان علما میں شامل تھے جنہیں پیٹر محترم نے اسلامی متون کے لاطینی ترجمے پر مقرر کیا۔ مقالات ان سے بطلیموس کی کتاب کرۂ مسطحہ کا وہ ترجمہ منسوب کرتے ہیں جو مسلمہ مجریطی کے عربی نسخے سے کیا گیا، اقلیدس کے اصول کا ایک متاخر عربی نسخے پر مبنی لاطینی ترجمہ، اور ہرمانوس ثانی یا جرمن کے نام سے ابو معشر کے المدخل الکبیر کا 1150ء کا ترجمہ۔ ان کی ولادت اور وفات کی تاریخیں مقالات میں نہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
  es: "Hermann de Carintia, llamado Hermann de Dalmacia en otras partes de la Enciclopedia del Islam, fue un traductor latino del siglo XII, uno de los eruditos a quienes Pedro el Venerable encargó la traducción de textos islámicos al latín. Los artículos le atribuyen el Planisphaerium de Ptolomeo, traducido de la versión árabe de Maslama al-Majriti, los Elementos de Euclides en latín, basados en una recensión árabe posterior, y, bajo el nombre de Hermannus Secundus o el Alemán, una traducción de 1150 de la Gran Introducción de Abu Ma'shar. No proporcionan fechas de nacimiento ni de muerte {cite:encyclopaedia-of-islam-2 vol. 7 p. 791} {cite:encyclopaedia-of-islam-2 vol. 1 p. 771} {cite:encyclopaedia-of-islam-2 vol. 10 p. 847}."
  fr: "Hermann de Carinthie, également appelé Hermann de Dalmatie dans l'Encyclopédie de l'Islam, était un traducteur latin du XIIe siècle, l'un des érudits chargés par Pierre le Vénérable de traduire des textes islamiques en latin. Les articles lui attribuent la traduction du Planisphaerium de Ptolémée à partir de la version arabe de Maslama al-Majriti, une traduction latine des Éléments d'Euclide réalisée à partir d'une recension arabe postérieure, et, sous le nom d'Hermannus Secundus ou l'Allemand, une traduction de 1150 de la Grande Introduction d'Abu Ma'shar. Aucune date de naissance ni de décès n'est mentionnée."
  tr: "Karintiya Herman, aynı zamanda Herman the Dalmaçian olarak da bilinir, 12. yüzyılda Latince çevirmendir ve Peter the Venerable tarafından İslami metinleri Latince'ye çevirmek üzere görevlendirilen keşişlerden biriydi. Ptolemy'nin Flat Ball'ını, Muslima al-Magriti'nin Arapça formundan, daha sonraki Arapça kökenlere dayanan Oklid kanonlarının Latince versiyonundan çevirdiği ve 1150 yılında Almanya Kralı Hermanus II adıyla Ebu Ma'shar'a Büyük Giriş'in çevirisini yaptığı kabul edilir. Makaleler, isimlerin çok sayıda olduğu ve doğumunun ya da ölümünden bahsetmediği uyarısında bulunur {cite:Encyclopaedia-of-Islam-2 cilt 7, s. 791} {cite:Encyclopaedia-of-Islam-2 cilt 10, s. 847}."
  id: "Herman dari Carinthia, juga dikenal sebagai Herman si Dalmatia, adalah seorang penerjemah Latin abad ke-12 yang merupakan salah satu biksu yang ditugaskan oleh Peter the Venerable untuk menerjemahkan teks Islam ke dalam bahasa Latin. Ia dikenal sebagai penerjemah Flat Ball karya Ptolemy dari bentuk Arab Muslima al-Magriti, versi Latin dari kanon Euclid yang didasarkan pada asal Arab yang lebih baru, serta terjemahan Great Introduction to Abu Ma'shar pada tahun 1150 M dengan nama Hermanus II dari Jerman. Artikel-artikel memperingatkan bahwa nama-nama tersebut sangat banyak dan tidak menyebutkan kelahiran atau kematiannya {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 791} {cite:Encyclopaedia-of-Islam-2 vol. 10, hlm. 847}."
