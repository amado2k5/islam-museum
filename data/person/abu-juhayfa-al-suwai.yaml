summary:
 ar: "أبو جحيفة وهب بن عبد الله السوائي، ويقال وهب بن وهب، ويقال له وهب الخير، من بني حرثان بن سواءة بن عامر بن صعصعة؛ من صغار الصحابة، توفي النبي وهو لم يبلغ الحلم وقد سمع منه، نزل الكوفة وابتنى بها داراً، وجعله علي على بيت المال بالكوفة وشهد معه مشاهده كلها {cite:istiab-alam-2002 p. 788}؛ مات في ولاية بشر بن مروان كما قال خليفة {cite:mustadrak-ilmiyya-ata-v3 p. 716}."
 en: "Abu Juhayfa Wahb ibn 'Abd Allah al-Suwa'i (or Wahb ibn Wahb), called Wahb al-Khayr, of Hurthan ibn Suwa'a ibn 'Amir ibn Sa'sa'a; one of the younger Companions, he had not reached puberty when the Prophet died but had heard from him; he settled in Kufa and built a house there, and 'Ali put him over the treasury at Kufa and he was with 'Ali in all his battles {cite:istiab-alam-2002 p. 788}; he died while Bishr ibn Marwan was governor, as Khalifa says {cite:mustadrak-ilmiyya-ata-v3 p. 716}."
 ur: "ابو جحیفہ وہب بن عبد اللہ سوائی (یا وہب بن وہب)، جنہیں وہب الخیر کہا جاتا تھا، حرثان بن سواءہ بن عامر بن صعصعہ کی اولاد سے؛ کم عمر صحابہ میں سے، نبی کی وفات کے وقت بالغ نہیں ہوئے تھے مگر ان سے سنا تھا؛ کوفہ میں آ کر گھر بنایا، اور علی نے انہیں کوفہ کے بیت المال پر مقرر کیا اور وہ علی کے ساتھ ان کی تمام جنگوں میں رہے {cite:istiab-alam-2002 p. 788}؛ خلیفہ کے مطابق وہ بشر بن مروان کی ولایت میں فوت ہوئے {cite:mustadrak-ilmiyya-ata-v3 p. 716}۔"
