summary:
 ar: "وهب بن عبد الله بن مسلم بن جنادة، أبو جحيفة السوائي، ويقال له وهب الخير، من صغار أصحاب النبي، روى عنه وعن البراء بن عازب وعلي بن أبي طالب، وروى عنه إسماعيل بن أبي خالد والحكم بن عتيبة والشعبي وغيرهم. ولي بيت المال والشرطة لعلي. ذكر الواقدي أنه توفي في ولاية بشر بن مروان، وأنه آخر من مات بالكوفة من الصحابة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13746-13747}. وتاريخ وفاته في الكتاب (؟-64 ه)."
 en: "Wahb ibn Abd Allah ibn Muslim ibn Janada, Abu Juhayfa al-Suwa'i, called Wahb al-Khayr, one of the younger companions of the Prophet. He narrated from the Prophet, al-Bara ibn Azib and Ali ibn Abi Talib, and Isma'il ibn Abi Khalid, al-Hakam ibn Utayba and al-Sha'bi narrated from him. He held the treasury and the police for Ali. According to al-Waqidi he died in the governorship of Bishr ibn Marwan and was the last companion to die in Kufa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13746-13747}. The book gives his death as 64 AH, with the year marked as uncertain."
 ur: "وہب بن عبد اللہ بن مسلم بن جنادہ، ابو جحیفہ سوائی، جنہیں وہب الخیر بھی کہا جاتا تھا، نبی کے کم عمر صحابہ میں سے تھے۔ انہوں نے نبی، براء بن عازب اور علی بن ابی طالب سے روایت کی، اور ان سے اسماعیل بن ابی خالد، حکم بن عتیبہ اور شعبی نے روایت کی۔ وہ علی کے زمانے میں بیت المال اور پولیس کے ذمہ دار رہے۔ واقدی کے مطابق وہ بشر بن مروان کی ولایت میں فوت ہوئے اور کوفہ میں آخری صحابی تھے جو فوت ہوئے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13746-13747}۔ کتاب ان کی وفات 64 ہجری بتاتی ہے۔"
