summary:
 ar: "أبو جحيفة وهب بن عبد الله السوائي، ويقال وهب بن وهب، ويقال له وهب الخير، من بني حرثان بن سواءة بن عامر بن صعصعة؛ من صغار الصحابة، توفي النبي وهو لم يبلغ الحلم وقد سمع منه، نزل الكوفة وابتنى بها داراً، وجعله علي على بيت المال بالكوفة وشهد معه مشاهده كلها {cite:istiab-alam-2002 p. 788}؛ مات في ولاية بشر بن مروان كما قال خليفة {cite:mustadrak-ilmiyya-ata-v3 p. 716}."
 en: "Abu Juhayfa Wahb ibn 'Abd Allah al-Suwa'i (or Wahb ibn Wahb), called Wahb al-Khayr, of Hurthan ibn Suwa'a ibn 'Amir ibn Sa'sa'a; one of the younger Companions, he had not reached puberty when the Prophet died but had heard from him; he settled in Kufa and built a house there, and 'Ali put him over the treasury at Kufa and he was with 'Ali in all his battles {cite:istiab-alam-2002 p. 788}; he died while Bishr ibn Marwan was governor, as Khalifa says {cite:mustadrak-ilmiyya-ata-v3 p. 716}."
 ur: "ابو جحیفہ وہب بن عبد اللہ سوائی ⁦(یا وہب بن وہب)⁩، جنہیں وہب الخیر کہا جاتا تھا، حرثان بن سواءہ بن عامر بن صعصعہ کی اولاد سے؛ کم عمر صحابہ میں سے، نبی کی وفات کے وقت بالغ نہیں ہوئے تھے مگر ان سے سنا تھا؛ کوفہ میں آ کر گھر بنایا، اور علی نے انہیں کوفہ کے بیت المال پر مقرر کیا اور وہ علی کے ساتھ ان کی تمام جنگوں میں رہے {cite:istiab-alam-2002 p. 788}؛ خلیفہ کے مطابق وہ بشر بن مروان کی ولایت میں فوت ہوئے {cite:mustadrak-ilmiyya-ata-v3 p. 716}۔"
 fr: "Abu Juhayfa Wahb ibn 'Abd Allah al-Suwa'i (ou Wahb ibn Wahb), appelé Wahb al-Khayr, de Hurthan ibn Suwa'a ibn 'Amir ibn Sa'sa'a ; l'un des plus jeunes Compagnons, il n'avait pas atteint la puberté à la mort du Prophète mais l'avait entendu ; il s'établit à Koufa et y bâtit une maison, et 'Ali le plaça à la tête du trésor de Koufa ; il fut avec 'Ali dans toutes ses batailles {cite:istiab-alam-2002 p. 788} ; il mourut pendant que Bishr ibn Marwan était gouverneur, comme le dit Khalifa {cite:mustadrak-ilmiyya-ata-v3 p. 716}."
 es: "Abu Juhayfa Wahb ibn 'Abd Allah al-Suwa'i (o Wahb ibn Wahb), llamado Wahb al-Khayr, de Hurthan ibn Suwa'a ibn 'Amir ibn Sa'sa'a; uno de los Compañeros más jóvenes, no había alcanzado la pubertad cuando murió el Profeta pero había oído hablar de él; se estableció en Kufa y construyó una casa allí, y 'Ali lo puso al frente del tesoro en Kufa y estuvo con 'Ali en todas sus batallas {cite:istiab-alam-2002 p. 788}; murió mientras Bishr ibn Marwan era gobernador, como dice Khalifa {cite:mustadrak-ilmiyya-ata-v3 p. 716}."
 tr: "Ebu Cüheyfe Vahb ibn Abdullah el-Suvey, Vahb ibn Vahb ve Vahb el-Hayr olarak da bilinen, Beni Hartan ibn Suvey ibn Emir ibn Sasa'ah kabilesinden, genç sahabelerden biridir. Peygamberimiz o henüz reşit değilken vefat etmiş ve ondan bir şeyler duymuştu. Kufe'ye yerleşti ve orada bir ev inşa etti. Ali onu Kufe'deki hazineye atadı ve onunla birlikte tüm savaşlarına şahit oldu {cite:istiab-alam-2002 s. 788}; Halifenin dediği gibi, Bişr ibn Mervan'ın valiliği sırasında vefat etti {cite:mustadrak-ilmiyya-ata-v3 s. 716}."
 id: "Abu Juhayfah Wahb ibn Abdullah al-Suwa’i, juga dikenal sebagai Wahb ibn Wahb, dan juga disebut Wahb al-Khayr, dari Bani Harthan ibn Suwa’ah ibn Amir ibn Sa’sa’ah; salah satu sahabat yang lebih muda. Nabi wafat ketika ia masih kecil, dan ia telah mendengar kabar darinya. Ia menetap di Kufa dan membangun rumah di sana. Ali menunjuknya sebagai bendahara di Kufa, dan ia menyaksikan semua pertempurannya bersama beliau {cite:istiab-alam-2002 hlm. 788}; ia meninggal dunia pada masa pemerintahan Bishr ibn Marwan, sebagaimana dikatakan Khalifa {cite:mustadrak-ilmiyya-ata-v3 hlm. 716}."
