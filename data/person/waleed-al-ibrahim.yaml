  en: Saudi media businessman born in 1954; he founded the Middle East Broadcasting Center (MBC) in London in 1991 — the first independent Arab satellite channel — and built it into the Arab world's largest
    media group with MBC, Al Arabiya, Al Hadath and the Shahid platform.
  ur: سعودی میڈیا کاروباری جو 1954 میں پیدا ہوا؛ اس نے 1991 میں لندن میں Middle East Broadcasting Center ⁦(MBC)⁩ قائم کیا — پہلا آزاد عرب سیٹلائٹ چینل — اور اسے MBC، العربیہ، الحدث اور شاہد پلیٹ فارم کے
    ساتھ عرب دنیا کا سب سے بڑا میڈیا گروپ بنایا۔
  es: "Empresario saudí del sector de los medios de comunicación, nacido en 1954; fundó el Middle East Broadcasting Center (MBC) en Londres en 1991 —el primer canal satelital árabe independiente— y lo convirtió en el mayor grupo mediático del mundo árabe con MBC, Al Arabiya, Al Hadath y la plataforma Shahid."
  fr: "Homme d'affaires saoudien des médias né en 1954, il a fondé le Middle East Broadcasting Center (MBC) à Londres en 1991 — la première chaîne satellitaire arabe indépendante — et l'a transformé en le plus grand groupe de médias du monde arabe avec MBC, Al Arabiya, Al Hadath et la plateforme Shahid."
