summary:
  ar: رجل أعمال إعلامي سعودي وُلد سنة 1954؛ أسس مجموعة إم بي سي ⁦(MBC)⁩ سنة 1991 في لندن — أول قناة فضائية عربية مستقلة — وبناها إلى أكبر مجموعة إعلامية في العالم العربي بقنوات إم بي سي والعربية والحدث
