summary:
  ar: "محمد بن أحمد بن يحيى بن حجازي العشماوي الأزهري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} تفقه على الشيخ عبد الديوي، والشهاب أحمد بن عمر الديربي، وسمع الحديث على الزرقاني، ولما توفي أخذ الكتب الستة عن تلميذه الشهاب أحمد بن عبد اللطيف المنزلي، وانفرد عنه غالب فضلاء العصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} قال عنه الجبرتي: الشيخ الإمام الفقيه المحدث المسند. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} والمصدر المذكور: عجائب الآثار للجبرتي، وقد ذُكر رقم الجزء والصفحة بصيغة غير واضحة في المسح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} وتاريخ الوفاة في رأس الترجمة «١١٦٧ هجرية» مع علامة استفهام في أوله، فيُذكر بهذا التحفظ."
  en: "Muhammad ibn Ahmad ibn Yahya ibn Hijazi al-Ashmawi al-Azhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} He studied fiqh under Shaykh Abd al-Diwi and al-Shihab Ahmad ibn Umar al-Dayrabi, heard hadith from al-Zurqani, and after his death took the six books from his pupil al-Shihab Ahmad ibn Abd al-Latif al-Manzili, a transmission in which most of the learned men of his age were unique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Jabarti called him the imam, the jurist, the hadith scholar and the transmitter by chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The source cited is al-Jabarti's 'Aja'ib al-athar; the volume and page reference is not clear in the scan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The heading gives 1167 AH with a question mark at its start, so the date is stated with that caution."
