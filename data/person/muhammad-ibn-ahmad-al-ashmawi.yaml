summary:
  ar: "محمد بن أحمد بن يحيى بن حجازي العشماوي الأزهري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} تفقه على الشيخ عبد الديوي، والشهاب أحمد بن عمر الديربي، وسمع الحديث على الزرقاني، ولما توفي أخذ الكتب الستة عن تلميذه الشهاب أحمد بن عبد اللطيف المنزلي، وانفرد عنه غالب فضلاء العصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} قال عنه الجبرتي: الشيخ الإمام الفقيه المحدث المسند. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} والمصدر المذكور: عجائب الآثار للجبرتي، وقد ذُكر رقم الجزء والصفحة بصيغة غير واضحة في المسح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} وتاريخ الوفاة في رأس الترجمة «١١٦٧ هجرية» مع علامة استفهام في أوله، فيُذكر بهذا التحفظ."
  en: "Muhammad ibn Ahmad ibn Yahya ibn Hijazi al-Ashmawi al-Azhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} He studied fiqh under Shaykh Abd al-Diwi and al-Shihab Ahmad ibn Umar al-Dayrabi, heard hadith from al-Zurqani, and after his death took the six books from his pupil al-Shihab Ahmad ibn Abd al-Latif al-Manzili, a transmission in which most of the learned men of his age were unique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Jabarti called him the imam, the jurist, the hadith scholar and the transmitter by chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The source cited is al-Jabarti's 'Aja'ib al-athar; the volume and page reference is not clear in the scan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} The heading gives 1167 AH with a question mark at its start, so the date is stated with that caution."
  es: "Muhammad ibn Ahmad ibn Yahya ibn Hijazi al-Ashmawi al-Azhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Estudió fiqh con Shaykh Abd al-Diwi y al-Shihab Ahmad ibn Umar al-Dayrabi, escuchó hadices de al-Zurqani, y después de su muerte tomó los seis libros de su discípulo al-Shihab Ahmad ibn Abd al-Latif al-Manzili, una transmisión en la que la mayoría de los hombres sabios de su época fueron únicos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Jabarti lo llamó el imán, el jurista, el erudito de hadices y el transmisor por cadena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} La fuente citada es 'Aja'ib al-athar' de al-Jabarti; la referencia de volumen y página no es clara en el escaneo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} El encabezado da 1167 AH con un signo de interrogación al principio, por lo que la fecha se indica con esa precaución."
  fr: "Muhammad ibn Ahmad ibn Yahya ibn Hijazi al-Ashmawi al-Azhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Il étudia le fiqh auprès du cheikh Abd al-Diwi et d'al-Shihab Ahmad ibn Umar al-Dayrabi, reçut des hadiths d'al-Zurqani, et après la mort de ce dernier, il reçut les six livres de son disciple al-Shihab Ahmad ibn Abd al-Latif al-Manzili, une transmission unique parmi les savants de son époque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} Al-Jabarti le qualifia d'imam, de juriste, de spécialiste du hadith et de transmetteur par chaîne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} La source citée est l'ouvrage d'al-Jabarti, 'Aja'ib al-athar; la référence du volume et de la page n'est pas claire dans le document numérisé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17709} L'en-tête indique l'année 1167 AH, précédée d'un point d'interrogation; la date est donc mentionnée avec prudence."
  ur: "محمد بن احمد بن یحییٰ بن حجازی العشموی الازہری۔ انہوں نے فقہ کی تعلیم شیخ عبد الدیوی اور الشہاب احمد بن عمر الدربی سے حاصل کی، الزرقانی سے حدیثیں سنی، اور اپنی وفات کے بعد اپنے شاگرد احمد عبد الذی الشعباء الشیخ سے چھ کتابیں لیں۔ ٹرانسمیشن جس میں اس کی عمر کے زیادہ تر علمی آدمی منفرد تھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17709} الجبرتی نے انہیں امام، فقیہ، حدیث کا عالم اور سلسلہ وار نقل کرنے والا کہا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17709} جس کا حوالہ دیا گیا ہے وہ الجبرتی کی 'عجائب الاطہر' ہے۔ اسکین میں حجم اور صفحہ کا حوالہ واضح نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17709} سرخی 1167 ہجری کو شروع میں سوالیہ نشان کے ساتھ بتاتی ہے، اس لیے اس تاریخ کو احتیاط کے ساتھ بیان کیا گیا ہے۔"
  tr: "Muhammed bin Ahmed bin Yahya bin Hicazi Al-Ashmawi Al-Azhari. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s. 17709} Şeyh Abd al-Diwi ve al-Shihab Ahmed bin Umar al-Darbi'den fıkıh okudu ve hadisleri el-Zerqani'den dinledi. Öldüğünde, öğrencisi el-Şihab Ahmed bin Abdul Latif el-Manzali'den altı kitabı öğrendi ve dönemin çoğu alimi ondan rivayet etti. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.17709} Al-Jabarti onun hakkında şöyle demiştir: şeyh, imam, hukukçu, hadis alimi ve Musnad. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17709} Alıntılanan kaynak al-Jabarti'nin 'Aja'ib al-Athar'ıdır ve cilt ile sayfa numaraları ankette belirsiz biçimde belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17709} ve biyografinin başında ölüm tarihi \"1167 Hj\" olarak ve başında soru işareti yer alarak bu çekinceyi belirtmektedir."
  id: "Muhammad bin Ahmad bin Yahya bin Hijazi Al-Ashmawi Al-Azhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.m. 17709} Ia mempelajari hukum di bawah bimbingan Sheikh Abd al-Diwi dan al-Shihab Ahmad bin Umar al-Darbi, serta mendengar hadis dari al-Zarqani. Ketika ia meninggal, ia mempelajari enam kitab dari muridnya al-Shihab Ahmad bin Latif al-Manzali, dan sebagian besar ulama pada masa itu menceritakan darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17709} Al-Jabarti berkata tentang dirinya: sheikh, imam, ahli hukum, ulama hadits, dan Musnad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17709} Sumber yang dikutip adalah 'Aja'ib al-Athar' oleh al-Jabarti, dan volume serta nomor halamannya disebutkan dalam format yang tidak jelas dalam survei. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17709} dan tanggal kematian di awal biografi sebagai \"1167 AH\" dengan tanda tanya di awal, sehingga menyebutkan keberatan ini."
