summary:
  ar: "ضابط وسياسي نيجيري (1938–1976) من كانو، تدرّب في ساندهيرست وقاد الفرقة الثانية في الحرب الأهلية، ثم قاد الانقلاب المضاد في يوليو 1975 وحكم نيجيريا رئيسا للدولة حتى اغتياله في لاغوس في 13 فبراير 1976 أثناء محاولة انقلاب فاشلة. يحمل مطار لاغوس الدولي اسمه."
  en: "Nigerian officer and politician (1938–1976) from Kano who trained at Sandhurst, commanded the Second Division in the civil war, led the counter-coup of July 1975 and ruled Nigeria as head of state until his assassination in Lagos on 13 February 1976 during a failed coup attempt. Lagos's international airport bears his name."
  ur: "نائجریائی فوجی افسر اور سیاست دان (1938ء–1976ء)، کانو سے تعلق؛ سینڈہرسٹ میں تربیت پائی، خانہ جنگی میں دوسری ڈویژن کی کمان کی، جولائی 1975 کی جوابی بغاوت کی قیادت کی اور سربراہِ مملکت کے طور پر نائجریا پر حکمرانی کی، حتیٰ کہ 13 فروری 1976 کو لاگوس میں ایک ناکام بغاوت کے دوران قتل ہوئے۔ لاگوس کا بین الاقوامی ہوائی اڈا ان کے نام پر ہے۔"
