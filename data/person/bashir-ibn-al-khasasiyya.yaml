summary:
  ar: بشير بن معبد، وقيل ابن يزيد بن معد بن ضباب بن سبع، المعروف بابن الخصاصية، صحابي. وكان اسمه زحما فسماه النبي بشيرا. روى عن النبي، وروى عنه بشير بن نهيك وجرى بن كليب وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}
  en: Bashir ibn Ma'bad, or as some say ibn Yazid ibn Ma'd ibn Dabab ibn Sab', known as Ibn al-Khasasiyya, a Companion. His name was Zahm, and the Prophet named him Bashir. He related from the Prophet, and Bashir ibn Nuhayk and Jarr ibn Kulayb and others related from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}
  ur: بشیر بن معبد، اور بعض کے نزدیک بشیر بن یزید بن معد بن ضباب بن سبع، جو ابن الخصاصیہ کے نام سے مشہور ہیں، صحابی تھے۔ ان کا نام زحم تھا اور نبی نے انہیں بشیر کا نام دیا۔ انہوں نے نبی سے روایت کیا، اور ان سے بشیر بن نہیک اور جری بن کلیب وغیرہ نے روایت کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}
  es: "Bashir ibn Ma'bad, o como algunos dicen ibn Yazid ibn Ma'd ibn Dabab ibn Sab', conocido como Ibn al-Khasasiyya, un Compañero. Su nombre era Zahm, y el Profeta lo llamó Bashir. Él transmitió del Profeta, y Bashir ibn Nuhayk, Jarr ibn Kulayb y otros transmitieron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}"
  fr: "Bashir ibn Ma'bad, ou selon certains ibn Yazid ibn Ma'd ibn Dabab ibn Sab', connu sous le nom d'Ibn al-Khasasiyya, était un Compagnon. Son nom était Zahm, et le Prophète le nomma Bashir. Il rapporta des hadiths du Prophète, et Bashir ibn Nuhayk, Jarr ibn Kulayb et d'autres encore rapportèrent de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}"
  tr: "Bashir ibn Ma'bad, İbn Yezid ibn Ma'ad ibn Dbab ibn Saba', yani İbn al-Khasasiyah'ın bir sahabeydi denir. Adı Zahma'ydı, bu yüzden Peygamber ona Bashir adını verdi. Peygamber'den rivayet etti, Bashir ibn Nahik, Jari ibn Kulayb ve diğerleri ondan rivayet etti. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.5495}"
  id: "Bashir ibn Ma'bad, dan dikatakan Ibn Yazid ibn Ma'ad ibn Dbab ibn Saba', yang dikenal sebagai Ibn al-Khasasiyah, adalah sahabatnya. Namanya Zahma, sehingga Nabi menamainya Bashir. Ia menceritakan dari Nabi, dan Bashir ibn Nahik, Jari ibn Kulayb, dan lainnya menceritakan darinya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.5495}"
