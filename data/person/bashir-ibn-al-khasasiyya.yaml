summary:
  ar: بشير بن معبد، وقيل ابن يزيد بن معد بن ضباب بن سبع، المعروف بابن الخصاصية، صحابي. وكان اسمه زحما فسماه النبي بشيرا. روى عن النبي، وروى عنه بشير بن نهيك وجرى بن كليب وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}
  en: Bashir ibn Ma'bad, or as some say ibn Yazid ibn Ma'd ibn Dabab ibn Sab', known as Ibn al-Khasasiyya, a Companion. His name was Zahm, and the Prophet named him Bashir. He related from the Prophet, and Bashir ibn Nuhayk and Jarr ibn Kulayb and others related from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}
  ur: بشیر بن معبد، اور بعض کے نزدیک بشیر بن یزید بن معد بن ضباب بن سبع، جو ابن الخصاصیہ کے نام سے مشہور ہیں، صحابی تھے۔ ان کا نام زحم تھا اور نبی نے انہیں بشیر کا نام دیا۔ انہوں نے نبی سے روایت کیا، اور ان سے بشیر بن نہیک اور جری بن کلیب وغیرہ نے روایت کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5495}
