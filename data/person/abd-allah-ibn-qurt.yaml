summary:
  ar: "عبد الله بن قرط الثمالي الأزدي، صحابي كان أميرا على حمص من قبل أبي عبيدة، روى عن النبي وعن خالد بن الوليد وعمرو بن سعيد بن العاص، وعنه أبو عامر عبد الله بن يحيى الهوزني وعبد الله بن محصن. قال ابن يونس: قُتل بأرض الروم شهيدا، وتوفي سنة 56هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Abd Allah ibn Qurt al-Thumali al-Azdi, a Companion who was governor of Homs under Abu Ubayda. He narrated from the Prophet, from Khalid ibn al-Walid and from Amr ibn Sa'id ibn al-As; Abu Amir Abd Allah ibn Yahya al-Hawzani and Abd Allah ibn Mahsan narrated from him. Ibn Yunus said he was killed as a martyr in Byzantine land; the page gives 56 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  fr: "Abd Allah ibn Qurt al-Thumali al-Azdi, Compagnon qui fut gouverneur de Homs sous Abu Ubayda. Il transmit du Prophète, de Khalid ibn al-Walid et d'Amr ibn Sa'id ibn al-As ; Abu Amir Abd Allah ibn Yahya al-Hawzani et Abd Allah ibn Mahsan transmirent de lui. Ibn Yunus dit qu'il fut tué en martyr en terre byzantine ; la page donne 56 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  ur: "عبد اللہ بن قرط ثمالی ازدی؛ وہ صحابی جو ابو عبیدہ کی طرف سے حمص کے امیر رہے؛ نبی، خالد بن ولید اور عمرو بن سعید سے روایت کیا۔"
  es: "Abd Allah ibn Qurt al-Thumali al-Azdi, un Compañero que fue gobernador de Homs bajo el mandato de Abu Ubayda. Narró del Profeta, de Khalid ibn al-Walid y de Amr ibn Sa'id ibn al-As; Abu Amir Abd Allah ibn Yahya al-Hawzani y Abd Allah ibn Mahsan narraron de él. Ibn Yunus dijo que murió como mártir en tierras bizantinas; la página indica el año 56 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  tr: "Peygamberin sahabelerinden Abdullah ibn Kurt el-Sümali el-Azdi, Ebu Ubeyde tarafından Humus valiliğine atanmıştır. Peygamberden, Halid ibn el-Velid'den ve Amr ibn Said ibn el-As'tan hadisler rivayet etmiştir. Ondan rivayet edenler arasında Ebu Emir Abdullah ibn Yahya el-Havzani ve Abdullah ibn Muhsin de bulunmaktadır. İbn Yunus şöyle demiştir: Roma topraklarında şehit edilmiş ve Hicri 56 yılında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3491}"
  id: "Abdullah ibn Qurt al-Thumali al-Azdi, seorang sahabat Nabi, diangkat menjadi gubernur Homs oleh Abu Ubaidah. Ia meriwayatkan hadits dari Nabi, Khalid ibn al-Walid, dan Amr ibn Saeed ibn al-As. Perawi hadits darinya antara lain Abu Amir Abdullah ibn Yahya al-Hawzani dan Abdullah ibn Muhsin. Ibn Yunus berkata: Ia syahid di negeri Romawi dan wafat pada tahun 56 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
died: { edtf: "0676", hijri: "0056", calendar: julian, precision: year, status: tradition, derived: true, note: "Martyred in Byzantine territory, 56 AH (Ibn Yunus, al-Isaba p. 931); CE year converted from the Hijri", sources: [source/ibn-hajar-isaba] }
