summary:
  ar: "عبد الله بن قرط الثمالي الأزدي، صحابي كان أميرا على حمص من قبل أبي عبيدة، روى عن النبي وعن خالد بن الوليد وعمرو بن سعيد بن العاص، وعنه أبو عامر عبد الله بن يحيى الهوزني وعبد الله بن محصن. قال ابن يونس: قُتل بأرض الروم شهيدا، وتوفي سنة 56هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
  en: "Abd Allah ibn Qurt al-Thumali al-Azdi, a Companion who was governor of Homs under Abu Ubayda. He narrated from the Prophet, from Khalid ibn al-Walid and from Amr ibn Sa'id ibn al-As; Abu Amir Abd Allah ibn Yahya al-Hawzani and Abd Allah ibn Mahsan narrated from him. Ibn Yunus said he was killed as a martyr in Byzantine land; the page gives 56 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3491}"
