summary:
  ar: "زعيم قبلي وديني پشتوني من شمال وزيرستان ⁦(نحو 1897–1960)⁩، اسمه حاجي ميرزا علي خان وزير. بعد حجّه سنة 1923 استقر في قرية إيبي وشنّ حرب عصابات على الحكم البريطاني من 1936، ثم أعلن مع حلفائه في قرار بانو سنة 1947 مطلب پشتونستان المستقلة، وواصل المقاومة المسلحة ضد باكستان من قاعدته في غورويك حتى وفاته سنة 1960 دون أن يستسلم قط."
  en: "Pashtun tribal and religious leader of North Waziristan (c. 1897–1960), born Haji Mirza Ali Khan Wazir. After his Hajj in 1923 he settled at the village of Ipi and from 1936 waged guerrilla war against British rule; in 1947 he and his allies proclaimed the Bannu Resolution demanding an independent Pashtunistan, and he continued armed resistance against Pakistan from his base at Gurwek until his death in 1960, never surrendering."
  ur: "شمالی وزیرستان کے پشتون قبائلی و دینی رہنما ⁦(تقریباً 1897ء–1960ء)⁩، اصل نام حاجی میرزا علی خان وزیر۔ 1923ء میں حج کے بعد ایپی گاؤں میں مقیم ہوئے اور 1936ء سے انگریز حکومت کے خلاف گوریلا جنگ لڑی؛ 1947ء میں بنوں قرارداد کے ذریعے آزاد پختونستان کا مطالبہ کیا اور 1960ء میں وفات تک پاکستان کے خلاف مسلح مزاحمت جاری رکھی، کبھی ہتھیار نہ ڈالے۔"
  es: "Líder tribal y religioso pastún de Waziristán del Norte (c. 1897–1960), nacido Haji Mirza Ali Khan Wazir. Tras su peregrinación a La Meca en 1923, se estableció en la aldea de Ipi y, a partir de 1936, libró una guerra de guerrillas contra el dominio británico; en 1947, él y sus aliados proclamaron la Resolución de Bannu, exigiendo un Pashtunistán independiente, y continuó la resistencia armada contra Pakistán desde su base en Gurwek hasta su muerte en 1960, sin rendirse jamás."
  fr: "Chef tribal et religieux pachtoune du Waziristan du Nord (vers 1897-1960), né Haji Mirza Ali Khan Wazir. Après son pèlerinage à La Mecque en 1923, il s'installe au village d'Ipi et, à partir de 1936, mène une guérilla contre le régime britannique; en 1947, avec ses alliés, il proclame la résolution de Bannu exigeant un Pashtounistan indépendant, et il poursuit la résistance armée contre le Pakistan depuis sa base de Gurwek jusqu'à sa mort en 1960, sans jamais se rendre."
  tr: "Kuzey Veziristan'dan (yaklaşık 1897–1960) bir kabile ve dini Peştun lider olan Hacı Mirza Ali Khan Wazir. 1923'teki hac yolculuğundan sonra Ibbi köyüne yerleşti ve 1936'dan itibaren İngiliz yönetimine karşı gerilla savaşı yürüttü, ardından 1947'de Bano Kararı'nda müttefikleriyle birlikte bağımsız Peştunistan talebini ilan etti. Gurwik'teki üssünden Pakistan'a karşı silahlı direnişi sürdürdü ve 1960'taki ölümüne kadar hiç teslim olmadı."
  id: "Seorang pemimpin suku dan religius Pashtun dari Waziristan Utara (sekitar 1897–1960), bernama Haji Mirza Ali Khan Wazir. Setelah ziarahnya pada tahun 1923, ia menetap di desa Ibbi dan melancarkan perang gerilya melawan pemerintahan Inggris sejak 1936, kemudian menyatakan tuntutan kemerdekaan Pashtunistan bersama sekutunya dalam Keputusan Bano tahun 1947. Ia terus melakukan perlawanan bersenjata terhadap Pakistan dari basisnya di Gurwik hingga wafat pada tahun 1960, tanpa pernah menyerah."
