summary:
  ar: "زعيم قبلي وديني پشتوني من شمال وزيرستان (نحو 1897–1960)، اسمه حاجي ميرزا علي خان وزير. بعد حجّه سنة 1923 استقر في قرية إيبي وشنّ حرب عصابات على الحكم البريطاني من 1936، ثم أعلن مع حلفائه في قرار بانو سنة 1947 مطلب پشتونستان المستقلة، وواصل المقاومة المسلحة ضد باكستان من قاعدته في غورويك حتى وفاته سنة 1960 دون أن يستسلم قط."
  en: "Pashtun tribal and religious leader of North Waziristan (c. 1897–1960), born Haji Mirza Ali Khan Wazir. After his Hajj in 1923 he settled at the village of Ipi and from 1936 waged guerrilla war against British rule; in 1947 he and his allies proclaimed the Bannu Resolution demanding an independent Pashtunistan, and he continued armed resistance against Pakistan from his base at Gurwek until his death in 1960, never surrendering."
  ur: "شمالی وزیرستان کے پشتون قبائلی و دینی رہنما (تقریباً 1897ء–1960ء)، اصل نام حاجی میرزا علی خان وزیر۔ 1923ء میں حج کے بعد ایپی گاؤں میں مقیم ہوئے اور 1936ء سے انگریز حکومت کے خلاف گوریلا جنگ لڑی؛ 1947ء میں بنوں قرارداد کے ذریعے آزاد پختونستان کا مطالبہ کیا اور 1960ء میں وفات تک پاکستان کے خلاف مسلح مزاحمت جاری رکھی، کبھی ہتھیار نہ ڈالے۔"
