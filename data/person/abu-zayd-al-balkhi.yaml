summary:
  ar: "أبو زيد أحمد بن سهل البلخي، حكيم متعدد العلوم؛ يروي ياقوت أنه لما كان في عنفوان شبابه دعته نفسه إلى أن يسافر من بلخ إلى أرض العراق ويجثو بين يدي العلماء، فتوجه إليها راجلاً مع الحاج وأقام بها ثماني سنين وطوّف البلاد المتاخمة لها ولقي الكبار والأعيان، وتتلمذ لأبي يوسف يعقوب بن إسحاق الكندي وحصّل من عنده علوماً جمة وتعمق في علم الفلسفة وجمع على أسرار علم التنجيم والهيئة وبرز في علوم الطب والطبائع وبحث عن أصول الدين {cite:duha-islam p. 434-435}."
  en: "Abu Zayd Ahmad ibn Sahl al-Balkhi — the polymath who walked from Balkh to Iraq, spent eight years among its scholars, and sat under al-Kindi mastering philosophy, astronomy and medicine {cite:duha-islam p. 434-435}."
  fr: "Abu Zayd Ahmad ibn Sahl al-Balkhi, savant universel qui marcha de Balkh jusqu'en Irak, passa huit ans parmi ses savants et étudia auprès d'al-Kindi, maîtrisant philosophie, astronomie et médecine {cite:duha-islam p. 434-435}."
  es: "Abu Zayd Ahmad ibn Sahl al-Balkhi, el polímata que caminó desde Balkh hasta Irak, pasó ocho años entre sus eruditos y se sentó con al-Kindi para dominar la filosofía, la astronomía y la medicina {cite:duha-islam p. 434-435}."
  ur: "ابو زید احمد بن سہل بلخی - ایک کثیر الثقافتی جو بلخ سے عراق تک گیا، اس نے اپنے علماء کے درمیان آٹھ سال گزارے، اور الکندی کے تحت بیٹھ کر فلسفہ، فلکیات اور طب میں مہارت حاصل کی۔ 434-435}۔"
  tr: "Çok ilimlerde bilgili bir bilge olan Ebu Zeyd Ahmed ibn Sahl el-Belkhi; Yakut rivayet eder ki, gençliğinin en güzel çağındayken, ruhu onu Belh'ten Irak topraklarına gidip âlimlerin yanında oturmaya çağırdı. Bunun üzerine hacılarla birlikte yürüyerek oraya gitti, sekiz yıl orada kaldı, komşu toprakları gezdi, büyüklerle ve ileri gelenlerle görüştü ve Ebu Yusuf Yakub ibn İshak el-Kindi'nin öğrencisi oldu, ondan çok şey öğrendi, felsefe ilmine daldı, astroloji ve astronomi ilminin sırlarını topladı, tıp ve doğa bilimlerinde üstün başarı gösterdi ve dinin esaslarını araştırdı. {Kaynak: Duha-İslam, s. 434-435}"
  id: "Abu Zayd Ahmad ibn Sahl al-Balkhi, seorang bijak yang menguasai banyak ilmu; Yaqut meriwayatkan bahwa ketika ia masih muda, jiwanya memanggilnya untuk melakukan perjalanan dari Balkh ke negeri Irak dan belajar di bawah bimbingan para ulama, maka ia pergi ke sana dengan berjalan kaki bersama para peziarah dan tinggal di sana selama delapan tahun dan berkeliling negeri-negeri tetangga serta bertemu dengan para tetua dan tokoh terkemuka, dan ia menjadi murid Abu Yusuf Yaqub ibn Ishaq al-Kindi dan memperoleh banyak ilmu darinya dan ia mendalami ilmu filsafat dan mengumpulkan rahasia ilmu astrologi dan astronomi dan ia unggul dalam ilmu kedokteran dan ilmu alam dan ia meneliti dasar-dasar agama {cite:duha-islam p. 434-435}."
