summary:
  ar: "أبو زيد أحمد بن سهل البلخي، حكيم متعدد العلوم؛ يروي ياقوت أنه لما كان في عنفوان شبابه دعته نفسه إلى أن يسافر من بلخ إلى أرض العراق ويجثو بين يدي العلماء، فتوجه إليها راجلاً مع الحاج وأقام بها ثماني سنين وطوّف البلاد المتاخمة لها ولقي الكبار والأعيان، وتتلمذ لأبي يوسف يعقوب بن إسحاق الكندي وحصّل من عنده علوماً جمة وتعمق في علم الفلسفة وجمع على أسرار علم التنجيم والهيئة وبرز في علوم الطب والطبائع وبحث عن أصول الدين {cite:duha-islam p. 434-435}."
  en: "Abu Zayd Ahmad ibn Sahl al-Balkhi — the polymath who walked from Balkh to Iraq, spent eight years among its scholars, and sat under al-Kindi mastering philosophy, astronomy and medicine {cite:duha-islam p. 434-435}."
