summary:
  ar: "مغنّي راب مغربي أمريكي، وُلد باسم كريم خربوش في الدار البيضاء سنة 1984، وهاجر مع عائلته إلى نيويورك في الثالثة عشرة من عمره. بنى شهرته بسلسلة أقراص «مدينة الكوكايين»، ووقّع سنة 2012 مع باد بوي ومايباك ميوزيك، وبلغت أغنيته «لا تُنسى» (Unforgettable) سنة 2017 الشهادة الماسية، وهو أكثر فنان مولود في أفريقيا استماعًا على منصات البث."
  en: "Moroccan-American rapper, born Karim Kharbouch in Casablanca in 1984, who immigrated with his family to New York City at the age of 13. He built his reputation with the Cocaine City DVD series, signed with Bad Boy and Maybach Music in 2012, and earned a diamond certification for his 2017 single \"Unforgettable\"; he is the most-streamed African-born musical artist."
  ur: "مراکش نژاد امریکی ریپر، جو 1984 میں کاسا بلانکا میں کریم خربوش کے نام سے پیدا ہوئے اور تیرہ سال کی عمر میں خاندان کے ساتھ نیویارک منتقل ہوئے۔ انہوں نے «کوکین سٹی» ڈی وی ڈی سلسلے سے شہرت پائی، 2012 میں بیڈ بوائے اور مے بیک میوزک سے معاہدہ کیا، اور ان کے 2017 کے گانے «ان فارگیٹیبل» کو ڈائمنڈ سند ملی؛ وہ افریقہ میں پیدا ہونے والے سب سے زیادہ سنے جانے والے فنکار ہیں۔"
