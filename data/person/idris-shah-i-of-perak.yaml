summary:
  ar: "سلطان فيرق (1849–1916)، السلطان الثامن والعشرون، حكم من سنة 1887 بعد وفاة صهره السلطان يوسف شرف الدين، وأدخل فيرق في الولايات الملايوية الاتحادية سنة 1895–1896، ويُذكر بمسجد العبودية في بوكيت تشاندان الذي بناه وفاءً لنذرٍ قطعه في مرضه واكتمل بعد وفاته."
  en: "Sultan of Perak (1849–1916), the 28th sultan, who reigned from 1887 after the death of his father-in-law Sultan Yusuf Sharifuddin, brought Perak into the Federated Malay States in 1895–1896, and is remembered for the Ubudiah Mosque at Bukit Chandan, built under a vow he made in illness and completed after his death."
  ur: "سلطان پیراک (1849ء–1916ء)، اٹھائیسویں سلطان، جنہوں نے 1887ء میں اپنے سسر سلطان یوسف شرف الدین کی وفات کے بعد حکومت سنبھالی، پیراک کو وفاقی ملائی ریاستوں میں شامل کیا (1895ء–1896ء) اور بوکیت چاندان کی مسجد عبودیہ کے لیے مشہور ہیں جو انہوں نے بیماری میں منت مانی تھی اور ان کی وفات کے بعد مکمل ہوئی۔"
