label:
  ar: كعب الأحبار
  en: Ka'b al-Ahbar
  es: "Ka'b al-Ahbar"
  fr: "Ka'b al-Ahbar"
  ur: "کعب الاحبار"
summary:
  ar: من أحبار يهود اليمن أسلم في خلافة أبي بكر أو عمر؛ قال له عمر ماذا تجدون في التوراة فقال أجدك في التوراة تقتل شهيداً
    وقال له إنا لنجدك في كتاب الله على باب من أبواب جهنم تمنع الناس أن يقعوا فيها. وذكر ابن خلدون عن معاوية أنه سأله عن إرم
    ذات العماد بعد قصة عبد الله بن قلابة فقال هي إرم ذات العماد من سيدخلها رجل أحمر أشقر قصير على حاجبه خال وعلى عنقه خال
    يخرج في طلب إبل له ثم التفت فأبصر ابن قلابة فقال هذا والله ذلك الرجل، وهي من مداخل وهم أهل التفسير عنده {cite:muqaddima-ibn-khaldun
    p. 26}
  en: a Yemeni Jewish scholar converted under Abu Bakr or Umar; told Umar 'I find you in the Torah killed a martyr' and 'we
    find you in God's book at a gate of Jahannam, barring people from it'.
  es: "Un erudito judío yemení, convertido bajo la tutela de Abu Bakr o Umar, le dijo a Umar: \"Te encuentro en la Torá matando a un mártir\" y \"Te encontramos en el libro de Dios a las puertas del Infierno, impidiendo el paso a la gente\"."
  fr: "un érudit juif yéménite converti sous Abu Bakr ou Umar; a dit à Umar: « Je te trouve dans la Torah tué en martyr » et « nous te trouvons dans le livre de Dieu à une porte de l'Enfer, interdisant l'accès aux gens »."
  ur: "ایک یمنی یہودی عالم ابوبکر یا عمر کے تحت تبدیل ہوا؛ عمر سے کہا کہ میں تمہیں تورات میں ایک شہید کو پاتا ہوں اور ہم تمہیں خدا کی کتاب میں جہنم کے دروازے پر پاتے ہیں اور لوگوں کو اس سے روکتے ہیں۔"
  tr: "Yemen Yahudilerinin hahamlarından biri, Ebu Bekir veya Ömer halifeliği sırasında İslam'ı benimsedi; Ömer ona, 'Tevrat'ta ne buluyorsun?' diye sordu. O da şöyle cevap verdi: 'Seni Tevrat'ta şehit olarak öldürülmüş buluyorum.' O da şöyle cevap verdi: 'Gerçekten de seni Allah'ın Kitabı'nda, insanların düşmesini engelleyen cehennem kapısında bulacağız.' İbn Haldun, Muaviy'nin Abdullah ibn Qilaba hikayesinden sonra ona sütunlu İram hakkında sorduğunu anlatır. Şöyle demiştir: Sütunlu İramdır. O da dedi ki, 'Sütunlu İram.' Dedi ki, 'Sütunlu İram.' Dedi ki, 'Direkli İram.' Dedi ki, 'Kim girecek?': Kaşlı, boynunda bir ben, deve aramaya çıkan kısa kırmızı bir adam. Sonra dönüp İbn Qilabah'ı gördü ve dedi ki, 'Tanrı aşkına, o adam.' Bu girişlerden biridir ve ona göre tercümanlar arasındadırlar. {alıntı:Muqaddima-ibn-Khaldun, s. 26}"
  id: "Salah satu rabbi Yahudi Yaman memeluk Islam selama kekhalifahan Abu Bakr atau Umar; Umar bertanya kepadanya, 'Apa yang kamu temukan dalam Taurat?' Dia menjawab, 'Aku menemukan kamu dibunuh sebagai syahid dalam Taurat.' Dia menjawab, 'Memang, kami akan menemukanmu dalam Kitab Allah di gerbang Neraka yang mencegah orang jatuh ke dalamnya.' Ibn Khaldun menyebutkan bahwa Muawiya bertanya kepadanya tentang Iram dengan tiang setelah kisah Abdullah ibn Qilaba. Dia berkata: Itu Iram dengan tiang. Dia berkata, 'Itu Iram dengan tiang.' Dia berkata, 'Itu Iram dengan tiang.' Dia berkata, 'Siapa yang akan masuk?' Seorang pria pendek berwarna merah dengan alis dan tahi lalat di lehernya yang keluar mencari unta. Kemudian dia berbalik dan melihat Ibn Qilabah dan berkata, 'Demi Tuhan, orang itu.' Itu salah satu pintu masuk, dan mereka termasuk penafsir menurut dia. Muqaddima-ibn-Khaldun, hlm. 26}"
