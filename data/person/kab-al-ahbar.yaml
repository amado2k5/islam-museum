summary:
  ar: من أحبار يهود اليمن أسلم في خلافة أبي بكر أو عمر؛ قال له عمر ماذا تجدون في التوراة فقال أجدك في التوراة تقتل شهيداً
    وقال له إنا لنجدك في كتاب الله على باب من أبواب جهنم تمنع الناس أن يقعوا فيها. وذكر ابن خلدون عن معاوية أنه سأله عن إرم
    ذات العماد بعد قصة عبد الله بن قلابة فقال هي إرم ذات العماد من سيدخلها رجل أحمر أشقر قصير على حاجبه خال وعلى عنقه خال
    يخرج في طلب إبل له ثم التفت فأبصر ابن قلابة فقال هذا والله ذلك الرجل، وهي من مداخل وهم أهل التفسير عنده {cite:muqaddima-ibn-khaldun
    p. 26}
  en: a Yemeni Jewish scholar converted under Abu Bakr or Umar; told Umar 'I find you in the Torah killed a martyr' and 'we
    find you in God's book at a gate of Jahannam, barring people from it'.
  es: "Un erudito judío yemení, convertido bajo la tutela de Abu Bakr o Umar, le dijo a Umar: \"Te encuentro en la Torá matando a un mártir\" y \"Te encontramos en el libro de Dios a las puertas del Infierno, impidiendo el paso a la gente\"."
  fr: "un érudit juif yéménite converti sous Abu Bakr ou Umar; a dit à Umar: « Je te trouve dans la Torah tué en martyr » et « nous te trouvons dans le livre de Dieu à une porte de l'Enfer, interdisant l'accès aux gens »."
