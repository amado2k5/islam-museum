id: person/kab-al-ahbar
class: person
label: { ar: "كعب الأحبار", en: "Ka'b al-Ahbar" }
summary:
  ar: "من أحبار يهود اليمن أسلم في خلافة أبي بكر أو عمر؛ قال له عمر ماذا تجدون في التوراة فقال أجدك في التوراة تقتل شهيداً وقال له إنا لنجدك في كتاب الله على باب من أبواب جهنم تمنع الناس أن يقعوا فيها.، وذكر ابن خلدون عن معاوية أنه سأله عن إرم ذات العماد بعد قصة عبد الله بن قلابة فقال هي إرم ذات العماد من سيدخلها رجل أحمر أشقر قصير على حاجبه خال وعلى عنقه خال يخرج في طلب إبل له ثم التفت فأبصر ابن قلابة فقال هذا والله ذلك الرجل، وهي من مداخل وهم أهل التفسير عنده {cite:muqaddima-ibn-khaldun p. 26}"
  en: "a Yemeni Jewish scholar converted under Abu Bakr or Umar; told Umar 'I find you in the Torah killed a martyr' and 'we find you in God's book at a gate of Jahannam, barring people from it'."
