  ar: "داعية ومناظر في لندن، اشتهر بمناظراته في ركن المتحدثين في هايد بارك، وهو الوجه الأبرز لمنصة «دي يو إس دعوة» بالفيديو التابعة لمسجد دار السنة في أكتون؛ يناظر ملحدين ومسيحيين ومخالفين في مسائل العقيدة، ودرست بحثية أكاديمية أسلوبه الخطابي سنة 2025."
