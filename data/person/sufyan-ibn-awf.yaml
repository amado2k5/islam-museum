roles: [companion]
summary:
  ar: "صحابي غامدي أزدي، صاحب الصوائف؛ كان له بأس ونجدة وسخاء، أغار على هيت والأنبار في أيام علي، واستعمله معاوية على الصوائف، ومات سنة ثلاث وخمسين على أصح الأقوال."
  en: "A Ghamidi Azdi Companion, commander of the summer expeditions; a man of valour, hardiness and generosity. He raided Hit and al-Anbar in Ali's days, Mu'awiya put him over the summer campaigns, and he died in 53 AH on the soundest report."
  ur: "غامدی ازدی صحابی، گرمیوں کی مہمات کا سردار؛ شجاع، مضبوط اور فیاض شخص؛ ہیت اور الانبار پر چھاپے مارے۔"
  es: "Un compañero de Ghamidi Azdi, comandante de las expediciones de verano; un hombre de valor, resistencia y generosidad. Saqueó Hit y al-Anbar en tiempos de Ali, Mu'awiya lo puso al mando de las campañas de verano y murió en el año 53 de la Hégira, según los informes más fidedignos."
  fr: "Compagnon de Ghamidi Azdi, commandant des expéditions d'été, homme de vaillance, de robustesse et de générosité, il mena des raids sur Hit et al-Anbar sous le règne d'Ali. Mu'awiya le chargea ensuite des campagnes d'été, et il mourut en 53 AH, selon les témoignages les plus fiables."
  tr: "Sawa'if'in yazarı Ghamidi Azdi'nin bir yoldaşıydı; cesur, yardımsever ve cömertti. Ali'nin döneminde Hit ve Anbar'a baskın düzenledi, Muaviye tarafından Sawa'if'in başına atandı ve en doğru anlatımlara göre elli üçüncü yılda öldü."
  id: "Seorang teman Ghamidi Azdi, penulis Sawa'if; ia berani, membantu, dan murah hati. Ia menyerang Hit dan Anbar pada masa Ali, diangkat oleh Muawiyah sebagai pemimpin Sawa'if, dan meninggal pada tahun lima puluh tiga menurut catatan paling akurat."
