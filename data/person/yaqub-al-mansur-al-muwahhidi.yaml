summary:
  ar: "أمير المؤمنين الموحدي صاحب بلاد المغرب؛ كان صافي السمرة جداً إلى الطول جميل الوجه جهوري الصوت جزل الألفاظ، وكان مفتناً في العلوم عارفاً بالأصول والفروع والترسل والتواريخ والهندسة والطب؛ لما انقضت الهدنة بينه وبين الأذفونش صاحب غرب الأندلس في أواخر سنة تسعين وخمس مئة عزم على محاربة الفرنج فمرض بسلا مرضاً شديداً حتى أيس منه أطباؤه ثم نهض وقاتلهم في وقعة الأرك {cite:wafayat-ayan p. 3-6}."
  en: "The Almohad caliph al-Mansur, victor of Alarcos — dark, tall, handsome and sonorous, versed in usul, furu', chancery, history, geometry and medicine; when the truce with Alfonso of Castile lapsed at the end of 590 he fell deathly ill at Salé on the eve of the campaign, then rose and broke the Franks {cite:wafayat-ayan p. 3-6}."
