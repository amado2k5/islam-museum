summary:
  ar: "أمير المؤمنين الموحدي صاحب بلاد المغرب؛ كان صافي السمرة جداً إلى الطول جميل الوجه جهوري الصوت جزل الألفاظ، وكان مفتناً في العلوم عارفاً بالأصول والفروع والترسل والتواريخ والهندسة والطب؛ لما انقضت الهدنة بينه وبين الأذفونش صاحب غرب الأندلس في أواخر سنة تسعين وخمس مئة عزم على محاربة الفرنج فمرض بسلا مرضاً شديداً حتى أيس منه أطباؤه ثم نهض وقاتلهم في وقعة الأرك {cite:wafayat-ayan p. 3-6}. واسترجع مدينة شلب من الإفرنج سنة 586 بعد أن ملكوها فحاصرها بنفسه وأخذها وأنفذ جيشاً ففتح أربع مدن مما أخذه الإفرنج قبل ذلك بأربعين سنة {cite:nafh-tib-maqqari p. 384}. وتوفي سنة 595؛ وما يقال إنه ساح في الأرض وتخلى عن الملك ووصل إلى الشام ودفن بالبقاع لا أصل له، وصرح بإبطال ذلك الشريف الغرناطي في شرح مقصورة حازم وقال إن ذلك من هذيان العامة لولوعهم بالسلطان المذكور {cite:nafh-tib-maqqari p. 386-387}."
  en: "The Almohad caliph al-Mansur, victor of Alarcos — dark, tall, handsome and sonorous, versed in usul, furu', chancery, history, geometry and medicine; when the truce with Alfonso of Castile lapsed at the end of 590 he fell deathly ill at Salé on the eve of the campaign, then rose and broke the Franks {cite:wafayat-ayan p. 3-6}."
  es: "El califa almohade al-Mansur, vencedor de Alarcos, moreno, alto, guapo y de voz sonora, versado en usul, furu', cancillería, historia, geometría y medicina; cuando la tregua con Alfonso de Castilla expiró a finales del 590, enfermó gravemente en Salé en vísperas de la campaña, luego se levantó y derrotó a los francos {cite:wafayat-ayan p. 3-6}."
  fr: "Le calife almohade al-Mansur, vainqueur d'Alarcos — brun, grand, beau et sonore, versé dans l'usul, le furu', la chancellerie, l'histoire, la géométrie et la médecine; lorsque la trêve avec Alphonse de Castille a expiré à la fin de 590, il tomba mortellement malade à Salé à la veille de la campagne, puis se releva et brisa les Francs {cite:wafayat-ayan p. 3-6}."
  ur: "الموحد خلیفہ المنصور، الارکوس کا فاتح - سیاہ، لمبا، خوبصورت اور خوبصورت، اصول، فرو، تاریخ، جیومیٹری اور طب میں ماہر؛ جب 590 کے آخر میں کاسٹیل کے الفانسو کے ساتھ جنگ بندی ختم ہوگئی تو وہ مہم کے موقع پر سالے میں جان لیوا بیمار پڑ گیا، پھر اٹھ کر فرینک کو توڑ دیا۔ 3-6}۔"
  tr: "Müsadık Almohad'ın Komutanı, Magrip'in hükümdarı, çok açık tenli, uzun boylu, yakışıklı, yüksek sesli ve etkileyici sözlere sahipti. Bilimlerde hayran, temel konular, dallar, yazışmalar, tarih, mühendislik ve tıp konularında bilgiliydi. Batı el-Endülüs hükümdarı Al-Adfunish ile arasındaki ateşkes, 590 H.H sonlarında sona erdiğinde, Franklarla savaşmaya karar verdi. Sale'de o kadar ağır hastalandı ki doktorları umutsuzluğa kapıldı, ardından ayağa kalkıp Ark Muharebesi'nde onlarla savaştı {cite:wafayat-ayan, s. 3-6}. Franklar şehri 586'da Franklardan aldıktan sonra Şalib şehrini geri aldı, kendisi kuşattı, ele geçirdi ve bir ordu göndererek Frankların kırk yıl önce ele geçirdiği dört şehri ele geçirdi {cite:nafh-tib-maqqari, s. 384}. 595 yılında öldü; ülkede dolaştığı, krallığı terk ettiği, Levant'a ulaştığı ve kökeni olmayan Bekaa'ya gömüldüğü söylenir. Şerif el-Gernati, Hazim'in Maksurası üzerine yaptığı yorumda bunu geçersiz saydı ve bunun yaygın bir deliryum olduğunu, çünkü bahsedilen sultana duydukları özlem nedeniyle olduğunu belirtti {cite:nafh-tib-maqqari s. 386-387}."
  id: "Komandan Almohad yang Setia, penguasa Maghreb, berkulit sangat cerah hingga tinggi, tampan, dengan suara keras dan kata-kata yang fasih. Ia adalah seorang penggemar ilmu pengetahuan, menguasai dasar-dasar, cabang, korespondensi, sejarah, teknik, dan kedokteran. Ketika gencatan senjata berakhir antara ia dan Al-Adfunish, penguasa barat al-Andalus, pada akhir tahun 590 H, ia memutuskan untuk melawan bangsa Franka. Ia jatuh sakit parah di Salé hingga para dokternya putus asa, lalu bangkit dan bertempur melawan mereka dalam Pertempuran Ark {cite:wafayat-ayan, hlm. 3-6}. Ia merebut kembali kota Shalb dari bangsa Frank pada tahun 586 setelah mereka merebutnya, mengepungnya sendiri, merebutnya, dan mengirim pasukan, merebut empat kota yang telah direbut oleh bangsa Frank empat puluh tahun sebelumnya {cite:nafh-tib-maqqari, hlm. 384}. Ia meninggal pada tahun 595; konon ia mengembara di tanah itu, meninggalkan kerajaan, mencapai Levant, dan dimakamkan di Bekaa tanpa asal-usul. Sharif al-Gharnati menyatakan hal ini tidak sah dalam komentarnya atas Maqsurah Hazim, mengatakan bahwa itu adalah deluan umum karena kerinduan mereka terhadap sultan yang disebutkan {cite:nafh-tib-maqqari hlm. 386-387}."
