summary:
  ar: "أمير المؤمنين الموحدي صاحب بلاد المغرب؛ كان صافي السمرة جداً إلى الطول جميل الوجه جهوري الصوت جزل الألفاظ، وكان مفتناً في العلوم عارفاً بالأصول والفروع والترسل والتواريخ والهندسة والطب؛ لما انقضت الهدنة بينه وبين الأذفونش صاحب غرب الأندلس في أواخر سنة تسعين وخمس مئة عزم على محاربة الفرنج فمرض بسلا مرضاً شديداً حتى أيس منه أطباؤه ثم نهض وقاتلهم في وقعة الأرك {cite:wafayat-ayan p. 3-6}. واسترجع مدينة شلب من الإفرنج سنة 586 بعد أن ملكوها فحاصرها بنفسه وأخذها وأنفذ جيشاً ففتح أربع مدن مما أخذه الإفرنج قبل ذلك بأربعين سنة {cite:nafh-tib-maqqari p. 384}. وتوفي سنة 595؛ وما يقال إنه ساح في الأرض وتخلى عن الملك ووصل إلى الشام ودفن بالبقاع لا أصل له، وصرح بإبطال ذلك الشريف الغرناطي في شرح مقصورة حازم وقال إن ذلك من هذيان العامة لولوعهم بالسلطان المذكور {cite:nafh-tib-maqqari p. 386-387}."
  en: "The Almohad caliph al-Mansur, victor of Alarcos — dark, tall, handsome and sonorous, versed in usul, furu', chancery, history, geometry and medicine; when the truce with Alfonso of Castile lapsed at the end of 590 he fell deathly ill at Salé on the eve of the campaign, then rose and broke the Franks {cite:wafayat-ayan p. 3-6}."
