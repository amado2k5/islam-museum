id: person/muhammad-ibn-al-uqbani
class: person
label: { ar: "محمد بن العقباني", en: "Muhammad ibn al-Uqbani", es: "Muhammad ibn al-Uqbani", fr: "Muhammad ibn al-Uqbani", ur: "محمد ابن العقبانی۔" }
summary:
  ar: "محمد بن أحمد بن قاسم بن سعيد، أبو عبد الله العقباني التلمساني، فقيه من أهل تلمسان، ولي فيها قضاء الجماعة. من تصانيفه تحفة الناظر وغنية الذاكر في حفظ الشعائر وتغيير المناكر، وهو في الحسبة. توفي سنة إحدى وسبعين وثمانمائة بحسب الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  en: "Muhammad ibn Ahmad ibn Qasim ibn Sa'id, Abu Abd Allah al-Uqbani al-Tilimsani: a jurist of Tlemcen who held the judgeship of the congregation there. His book Tuhfat al-Nazir wa Ghunyat al-Dhakir on guarding the rites and changing what is wrong treats enjoining good and forbidding evil. The book gives his death as 871 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  es: "Muhammad ibn Ahmad ibn Qasim ibn Sa'id, Abu Abd Allah al-Uqbani al-Tilimsani: jurista de Tlemcen que ejerció como juez de la congregación. Su libro Tuhfat al-Nazir wa Ghunyat al-Dhakir, sobre la observancia de los ritos y la corrección de las faltas, trata sobre la importancia de ordenar el bien y prohibir el mal. El libro indica que falleció en el año 871 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  fr: "Muhammad ibn Ahmad ibn Qasim ibn Sa'id, Abu Abd Allah al-Uqbani al-Tilimsani: juriste de Tlemcen, il exerça la fonction de juge de la congrégation locale. Son ouvrage, Tuhfat al-Nazir wa Ghunyat al-Dhakir, traite de la préservation des rites et de la correction des erreurs, et aborde l'injonction du bien et l'interdiction du mal. Le livre indique sa mort en 871 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  ur: "محمد بن احمد بن قاسم بن سعید، ابو عبد اللہ العقبانی التلمسانی: تلمسن کے ایک فقیہ جو وہاں جماعت کی قضاء پر فائز تھے۔ ان کی کتاب تحفۃ الناظیر و غنیۃ الذکر عبادات کی حفاظت اور برائی کو بدلنے کے لیے نیکی کا حکم دینے اور برائی سے منع کرنے پر مشتمل ہے۔ کتاب میں ان کی وفات 871ھ بتائی گئی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7164}"
  tr: "Muhammed bin Ahmed ibn Kasım ibn Sa'id, Ebu Abdullah el-Uqbani el-Tilimsani, Tlemcenli bir hukukçu olup orada yargıç olarak görev yapmıştır. Eserleri arasında Tuhfat al-Nazir ve Ghaniyat al-Zikr fi Hafiz al-Sha'ir wa Tagheel al-Mankar bulunmaktadır ve kendisi hisbe'dedir. Kur'an'a göre sekiz yüz yetmiş bir yılda öldü. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7164}"
  id: "Muhammad ibn Ahmad ibn Qasim ibn Sa'id, Abu Abdullah al-Uqbani al-Tilimsani, adalah seorang ahli hukum dari Tlemcen, yang menjabat sebagai hakim di sana. Di antara karya-karyanya adalah Tuhfat al-Nazir dan Ghaniyat al-Dhikir fi Hafiz al-Sha'ir wa Tagheel al-Mankar, dan ia berada dalam hisbah. Ia wafat pada tahun delapan ratus tujuh puluh satu menurut Al-Qur'an. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.7164}"
