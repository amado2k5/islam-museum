label: { ar: "محمد بن العقباني", en: "Muhammad ibn al-Uqbani" }
summary:
  ar: "محمد بن أحمد بن قاسم بن سعيد، أبو عبد الله العقباني التلمساني، فقيه من أهل تلمسان، ولي فيها قضاء الجماعة. من تصانيفه تحفة الناظر وغنية الذاكر في حفظ الشعائر وتغيير المناكر، وهو في الحسبة. توفي سنة إحدى وسبعين وثمانمائة بحسب الكتاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
  en: "Muhammad ibn Ahmad ibn Qasim ibn Sa'id, Abu Abd Allah al-Uqbani al-Tilimsani: a jurist of Tlemcen who held the judgeship of the congregation there. His book Tuhfat al-Nazir wa Ghunyat al-Dhakir on guarding the rites and changing what is wrong treats enjoining good and forbidding evil. The book gives his death as 871 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7164}"
