summary:
  ar: "رامي رمح باكستاني، وُلد في ميان جنو بمقاطعة خانيوال في البنجاب سنة 1997، نشأ في أسرة فقيرة وتدرب في طفولته في ساحات البيوت والشوارع، وهو أول رياضي باكستاني في ألعاب القوى يتأهل مباشرة للأولمبياد بالمعايير الحديثة، وأول باكستاني يبلغ نهائي حدث في بطولة العالم، ونال فضية بطولة العالم 2023 في بودابست، وفاز بذهبية أولمبياد باريس 2024 برمية 92.97 مترا، وهو رقم أولمبي وآسيوي جديد وسادس أطول رمية في تاريخ رمي الرمح، فصار أول باكستاني يفوز بميدالية أولمبية في ألعاب القوى وأول بطل أولمبي باكستاني في رياضة فردية، وكان قد كسر حاجز التسعين مترا أول مرة في ألعاب الكومنولث 2022 برقم 90.18 مترا فكان أول رياضي من جنوب آسيا يتجاوزها، ونال وسامي الفخر بالأداء (2022) وهلال الامتياز (2024)."
  en: "Pakistani javelin thrower, born in Mian Channu, Khanewal District, Punjab, in 1997. Raised in a poor family and trained as a boy in courtyards and streets, he is the first Pakistani track and field athlete to earn direct Olympic qualification under modern entry standards and the first Pakistani to reach a World Championships final. He took silver at the 2023 World Championships in Budapest and won gold at the Paris 2024 Olympics with a throw of 92.97 metres — a new Olympic and Asian record and the sixth-longest throw in javelin history — becoming Pakistan's first Olympic medallist in athletics and its first individual Olympic gold medallist. He had first breached 90 metres at the 2022 Commonwealth Games (90.18 m), the first South Asian to do so, and received the Pride of Performance (2022) and Hilal-e-Imtiaz (2024) awards."
  ur: "پاکستانی نیزہ پھینکنے والے کھلاڑی، جو 1997 میں پنجاب کے ضلع خانیوال کے شہر میاں چنوں میں پیدا ہوئے۔ غریب خاندان سے تعلق رکھنے والے ندیم نے بچپن میں گھروں کے صحنوں اور گلیوں میں تربیت حاصل کی؛ وہ جدید داخلی معیار کے تحت اولمپکس کے لیے براہِ راست کوالیفائی کرنے والے پہلے پاکستانی ایتھلیٹ اور عالمی چیمپئن شپ کے فائنل تک پہنچنے والے پہلے پاکستانی ہیں۔ انھوں نے 2023 کی عالمی چیمپئن شپ ⁦(بڈاپسٹ)⁩ میں چاندی کا تمغا جیتا اور پیرس 2024 اولمپکس میں 92.97 میٹر کی تھرو کے ساتھ طلائی تمغا جیتا — یہ نیا اولمپک اور ایشیائی ریکارڈ اور نیزہ بازی کی تاریخ کی چھٹی طویل ترین تھرو ہے — یوں وہ ایتھلیٹکس میں پاکستان کے پہلے اولمپک تمغا یافتہ اور پہلے انفرادی طلائی تمغا یافتہ بن گئے۔ اس سے پہلے 2022 کے دولتِ مشترکہ کھیلوں میں 90.18 میٹر کے ساتھ وہ 90 میٹر کا ہندسہ عبور کرنے والے پہلے جنوبی ایشیائی بنے تھے۔ انھیں تمغۂ حسنِ کارکردگی (2022) اور ہلالِ امتیاز (2024) سے نوازا گیا۔"
  es: "Lanzador de jabalina pakistaní, nacido en Mian Channu, distrito de Khanewal, Punjab, en 1997. Criado en una familia humilde y entrenado desde niño en patios y calles, es el primer atleta pakistaní de atletismo en obtener la clasificación olímpica directa según los estándares de entrada modernos y el primero en llegar a una final de un Campeonato Mundial. Ganó la medalla de plata en el Campeonato Mundial de Budapest 2023 y la de oro en los Juegos Olímpicos de París 2024 con un lanzamiento de 92,97 metros —un nuevo récord olímpico y asiático y el sexto lanzamiento más largo en la historia de la jabalina— convirtiéndose en el primer medallista olímpico de Pakistán en atletismo y su primer medallista de oro olímpico individual. Superó los 90 metros por primera vez en los Juegos de la Commonwealth de 2022 (90,18 m), siendo el primer surasiático en lograrlo, y recibió los premios Pride of Performance (2022) y Hilal-e-Imtiaz (2024)."
  fr: "Lanceur de javelot pakistanais, né à Mian Channu, dans le district de Khanewal (Pendjab), en 1997, il a grandi dans une famille modeste et s'est entraîné dès son plus jeune âge dans les cours et les rues. Il est le premier athlète pakistanais à avoir obtenu une qualification olympique directe selon les critères d'admission actuels et le premier Pakistanais à atteindre une finale des Championnats du monde. Médaillé d'argent aux Championnats du monde de Budapest en 2023, il a remporté l'or aux Jeux olympiques de Paris en 2024 avec un lancer de 92,97 mètres – un nouveau record olympique et asiatique, et le sixième meilleur lancer de l'histoire du javelot – devenant ainsi le premier médaillé olympique pakistanais en athlétisme et son premier champion olympique individuel. Il avait franchi la barre des 90 mètres pour la première fois aux Jeux du Commonwealth de 2022 (90,18 m), une première pour un Sud-Asiatique, et a reçu les prix Pride of Performance (2022) et Hilal-e-Imtiaz (2024)."
  tr: "Rami Ram, 1997 yılında Pencap'ın Khanewal bölgesindeki Mian Geno'da doğan Pakistanlı bir cirit atıcıdır. Fakir bir ailede büyüdü ve çocukluğunda ev ve sokak arenalarında antrenman yaptı. Modern standartlarda doğrudan Olimpiyatlara katılmaya hak kazanan ilk Pakistanlı sporcudur, Dünya Şampiyonası'nda bir etkinliğin finaline ulaşan ilk Pakistanlıdır, 2023 Budapeşte Dünya Şampiyonası'nda gümüş madalya kazanmış ve Paris 2024 Olimpiyatları'nda 92,97 metre atışıyla altın madalya kazanarak yeni bir Olimpiyat ve Asya rekoru kırdı; cirit atma tarihindeki altıncı en uzun atış oldu ve kazanan ilk Pakistanlı oldu Atletizmde Olimpiyat madalyası ve bireysel sporlarda ilk Pakistan Olimpiyat şampiyonu olarak, 2022 İngiliz Milletler Topluluğu Oyunları'nda 90.18 metrelik atışla 90 metre barajını ilk kez aşarak bu barajı aşan ilk Güney Asyalı sporcu oldu. Wasimi, performans onuru (2022) ve Mükemmellik Hilal'ı (2024) kazandı."
  id: "Rami Ram adalah atlet lempar lembing asal Pakistan, lahir di Mian Geno, distrik Khanewal, Punjab pada tahun 1997. Ia tumbuh dalam keluarga miskin dan berlatih di arena rumah serta arena jalanan saat masa kecilnya. Ia adalah atlet Pakistan pertama di bidang atletik yang lolos langsung ke Olimpiade dengan standar modern, orang Pakistan pertama yang mencapai final suatu nomor di Kejuaraan Dunia, memenangkan medali perak di Kejuaraan Dunia 2023 di Budapest, dan meraih medali emas di Olimpiade Paris 2024 dengan lemparan sejauh 92,97 meter, rekor baru Olimpiade dan Asia, serta lemparan lempar terpanjang keenam dalam sejarah lempar lembing, menjadi orang Pakistan pertama yang menang Dengan medali Olimpiade di bidang atletik dan juara Olimpiade Pakistan pertama di cabang olahraga individu, ia untuk pertama kalinya menembus batas 90 meter di Commonwealth Games 2022 dengan lemparan 90,18 meter, menjadi atlet Asia Selatan pertama yang melampauinya. Wasimi meraih penghargaan performa (2022) dan Crescent of Excellence (2024)."
