summary:
  ar: "رامي رمح باكستاني، وُلد في ميان جنو بمقاطعة خانيوال في البنجاب سنة 1997، نشأ في أسرة فقيرة وتدرب في طفولته في ساحات البيوت والشوارع، وهو أول رياضي باكستاني في ألعاب القوى يتأهل مباشرة للأولمبياد بالمعايير الحديثة، وأول باكستاني يبلغ نهائي حدث في بطولة العالم، ونال فضية بطولة العالم 2023 في بودابست، وفاز بذهبية أولمبياد باريس 2024 برمية 92.97 مترا، وهو رقم أولمبي وآسيوي جديد وسادس أطول رمية في تاريخ رمي الرمح، فصار أول باكستاني يفوز بميدالية أولمبية في ألعاب القوى وأول بطل أولمبي باكستاني في رياضة فردية، وكان قد كسر حاجز التسعين مترا أول مرة في ألعاب الكومنولث 2022 برقم 90.18 مترا فكان أول رياضي من جنوب آسيا يتجاوزها، ونال وسامي الفخر بالأداء (2022) وهلال الامتياز (2024)."
  en: "Pakistani javelin thrower, born in Mian Channu, Khanewal District, Punjab, in 1997. Raised in a poor family and trained as a boy in courtyards and streets, he is the first Pakistani track and field athlete to earn direct Olympic qualification under modern entry standards and the first Pakistani to reach a World Championships final. He took silver at the 2023 World Championships in Budapest and won gold at the Paris 2024 Olympics with a throw of 92.97 metres — a new Olympic and Asian record and the sixth-longest throw in javelin history — becoming Pakistan's first Olympic medallist in athletics and its first individual Olympic gold medallist. He had first breached 90 metres at the 2022 Commonwealth Games (90.18 m), the first South Asian to do so, and received the Pride of Performance (2022) and Hilal-e-Imtiaz (2024) awards."
  ur: "پاکستانی نیزہ پھینکنے والے کھلاڑی، جو 1997 میں پنجاب کے ضلع خانیوال کے شہر میاں چنوں میں پیدا ہوئے۔ غریب خاندان سے تعلق رکھنے والے ندیم نے بچپن میں گھروں کے صحنوں اور گلیوں میں تربیت حاصل کی؛ وہ جدید داخلی معیار کے تحت اولمپکس کے لیے براہِ راست کوالیفائی کرنے والے پہلے پاکستانی ایتھلیٹ اور عالمی چیمپئن شپ کے فائنل تک پہنچنے والے پہلے پاکستانی ہیں۔ انھوں نے 2023 کی عالمی چیمپئن شپ (بڈاپسٹ) میں چاندی کا تمغا جیتا اور پیرس 2024 اولمپکس میں 92.97 میٹر کی تھرو کے ساتھ طلائی تمغا جیتا — یہ نیا اولمپک اور ایشیائی ریکارڈ اور نیزہ بازی کی تاریخ کی چھٹی طویل ترین تھرو ہے — یوں وہ ایتھلیٹکس میں پاکستان کے پہلے اولمپک تمغا یافتہ اور پہلے انفرادی طلائی تمغا یافتہ بن گئے۔ اس سے پہلے 2022 کے دولتِ مشترکہ کھیلوں میں 90.18 میٹر کے ساتھ وہ 90 میٹر کا ہندسہ عبور کرنے والے پہلے جنوبی ایشیائی بنے تھے۔ انھیں تمغۂ حسنِ کارکردگی (2022) اور ہلالِ امتیاز (2024) سے نوازا گیا۔"
