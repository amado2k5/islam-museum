summary:
  ar: "مونتيك سينغ أهلواليا (وُلد في 24 نوفمبر 1943) اقتصادي هندي وموظف حكومي، كان نائب رئيس لجنة التخطيط في الهند (2004–2014) برتبة وزير، وأول مدير لمكتب التقييم المستقل في صندوق النقد الدولي (2001–2004)، وشغل أرفع المناصب الاقتصادية في الحكومة الهندية ومنها أمين المالية. حاصل على منحة رودس، التحق بالبنك الدولي سنة 1968 فأصبح أصغر رئيس شعبة فيه، وهو من أبرز وجوه عصر الإصلاح الاقتصادي الهندي، ونال وسام بادما فيبوشان سنة 2011."
  en: "Montek Singh Ahluwalia (born 24 November 1943) is an Indian economist and civil servant who served as deputy chairman of the Planning Commission of India (2004–2014) with the rank of a cabinet minister, as the first director of the International Monetary Fund's Independent Evaluation Office (2001–2004), and in India's senior economic posts, including finance secretary. A Rhodes scholar who joined the World Bank in 1968 and became its youngest division chief, he is a central figure of India's economic-reform era and received the Padma Vibhushan in 2011."
  ur: "مونٹیک سنگھ اہلوالیہ (پیدائش 24 نومبر 1943ء) ایک بھارتی ماہر اقتصادیات اور سرکاری افسر ہیں جو ہندوستان کے پلاننگ کمیشن کے نائب صدر (2004ء–2014ء) بطور وفاقی وزیر رہے، بین الاقوامی مالیاتی فنڈ کے آزاد جائزہ دفتر کے پہلے ڈائریکٹر (2001ء–2004ء) رہے، اور بھارتی حکومت کے اعلیٰ اقتصادی عہدوں پر فائز رہے جن میں سیکرٹری خزانہ بھی شامل ہے۔ روڈز اسکالر کی حیثیت سے وہ 1968ء میں عالمی بینک میں شامل ہوئے اور اس کے کم عمر ترین ڈویژن چیف بنے؛ وہ بھارت کے اقتصادی اصلاحات کے دور کی مرکزی شخصیات میں سے ہیں اور 2011ء میں پدم وبھوشن سے نوازے گئے۔"
