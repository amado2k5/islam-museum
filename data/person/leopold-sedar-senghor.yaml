summary:
  ar: "شاعر وسياسي سنغالي كاثوليكي، وُلد في جوال سنة 1906، شارك في تأسيس فكرة «الزنوجة»، وصار أول رئيس للسنغال (1960–1980)، وهو مدرج في هذا المتحف بوصفه معاصرًا ثقافيًا مُكرَّمًا في قائمة المؤسس، لا بوصفه مسلمًا."
  en: "Senegalese Catholic poet and statesman, born at Joal in 1906. He co-founded the idea of négritude and became the first president of Senegal (1960-1980). He appears in this museum as an honoured cultural contemporary named in the founder's list — not as a Muslim."
  ur: "سینیگالی کیتھولک شاعر اور سیاست دان، جو 1906 میں جوال میں پیدا ہوئے۔ انہوں نے «زنوجیت» (نیگریٹیوڈ) کے نظریے کی بنیاد رکھنے میں حصہ لیا اور سینیگال کے پہلے صدر (1960–1980) بنے۔ وہ اس میوزیم میں بانی کی فہرست میں درج ایک معزز ثقافتی ہم عصر کی حیثیت سے شامل ہیں — مسلمان کی حیثیت سے نہیں۔"
