    basis: documented
    note: "Senghor was a Roman Catholic, not a Muslim. He is in the museum only because the founder's century list names him an honoured cultural contemporary: the founding president of Muslim-majority Senegal and a major theorist of African culture, whose career belongs to the world his Muslim contemporaries lived in. Two sources attest the Catholicism independently of each other: Wikidata records his religion (P140) as the Catholic Church (Q9592), and the BlackPast encyclopedia entry records that he was raised in his parents' Catholic faith, was sent to a Catholic mission school, decided at thirteen to enter the Catholic priesthood and attended the Libermann seminary in Dakar before leaving it in 1926 for secular schooling; the English and Arabic articles describe the same Catholic mission schooling and seminary years. Nothing in this record presents him as a Muslim."
    sources: [source/wikidata-leopold-sedar-senghor, source/blackpast-senghor, source/wikipedia-leopold-sedar-senghor-en]
