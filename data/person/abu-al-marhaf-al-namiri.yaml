summary:
  ar: "أبو المرهف نصر بن منصور بن الحسن بن جوشن النميري، الضرير الشاعر المشهور؛ قدم بغداد في صباه وسكنها إلى حين وفاته وحفظ القرآن وتفقه على مذهب الإمام أحمد بن حنبل وسمع الحديث وقرأ الأدب على أبي منصور ابن الجواليقي؛ كُف بصره بالجدري وعمره أربع عشرة سنة؛ مدح الخلفاء والوزراء والأكابر وحدّث وكان زاهداً ورعاً حسن المقاصد في الشعر وله ديوان شعر؛ ذكره العماد الأصبهاني في الخريدة {cite:wafayat-ayan}."
  en: "Abu al-Marhaf Nasr b. Mansur al-Namiri — blind poet of Baghdad, a Hanbali who lost his sight to smallpox at fourteen; a pious ascetic who praised caliphs and viziers; pupil in adab of Ibn al-Jawaliqi; author of a diwan {cite:wafayat-ayan}."
  fr: "Abu al-Marhaf Nasr b. Mansur al-Namiri — poète aveugle de Bagdad, hanbalite qui perdit la vue à cause de la variole à quatorze ans ; ascète pieux qui fit l'éloge de califes et de vizirs ; élève en lettres d'Ibn al-Jawaliqi ; auteur d'un diwan {cite:wafayat-ayan}."
  es: "Abu al-Marhaf Nasr b. Mansur al-Namiri — poeta ciego de Bagdad, hanbalí que perdió la vista a causa de la viruela a los catorce años; un asceta piadoso que alabó a califas y visires; discípulo en adab de Ibn al-Jawaliqi; autor de un diwan {cite:wafayat-ayan}."
  ur: "ابو المرحاف نصر ب۔ منصور النمیری — بغداد کا نابینا شاعر، ایک حنبلی جس نے چودہ سال کی عمر میں چیچک کی وجہ سے بینائی کھو دی تھی۔ ایک متقی سنی جس نے خلفاء اور وزیروں کی تعریف کی۔ ابن الجولیکی کے ادب میں شاگرد؛ دیوان کے مصنف"
  tr: "Ünlü kör şair Ebu el-Murhaf Nasr ibn Mansur ibn el-Hasan ibn Cevşan el-Numayri; gençliğinde Bağdat'a gelmiş ve ölümüne kadar orada yaşamıştır. Kur'an'ı ezberlemiş ve İmam Ahmed ibn Hanbel ekolüne göre fıkıh eğitimi almıştır. Hadisleri dinlemiş ve Ebu Mansur ibn el-Cevaliki ile edebiyat çalışmıştır. On dört yaşında çiçek hastalığı nedeniyle görme yetisini kaybetmiştir. Halifeleri, bakanları ve ileri gelenleri övmüş ve hadis rivayet etmiştir. Zühvetli, dindar ve şiirinde iyi niyetli bir kişiydi. Şiir koleksiyonu bulunmaktadır. İmad el-İsfahani, onu Haride adlı eserinde anmıştır."
  id: "Abu al-Murhaf Nasr ibn Mansur ibn al-Hasan ibn Jawshan al-Numayri, penyair buta yang terkenal; ia datang ke Baghdad di masa mudanya dan tinggal di sana hingga wafatnya. Ia menghafal Al-Qur'an dan mempelajari fiqih menurut mazhab Imam Ahmad ibn Hanbal. Ia mendengar hadits dan mempelajari sastra dengan Abu Mansur ibn al-Jawaliqi. Ia kehilangan penglihatannya karena cacar pada usia empat belas tahun. Ia memuji para khalifah, menteri, dan pejabat tinggi, serta meriwayatkan hadits. Ia adalah seorang pertapa, saleh, dan memiliki niat baik dalam puisi. Ia memiliki kumpulan puisi. Al-Imad al-Isfahani menyebutkannya dalam al-Kharida."
