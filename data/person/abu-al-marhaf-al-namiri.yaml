summary:
  ar: "أبو المرهف نصر بن منصور بن الحسن بن جوشن النميري، الضرير الشاعر المشهور؛ قدم بغداد في صباه وسكنها إلى حين وفاته وحفظ القرآن وتفقه على مذهب الإمام أحمد بن حنبل وسمع الحديث وقرأ الأدب على أبي منصور ابن الجواليقي؛ كُف بصره بالجدري وعمره أربع عشرة سنة؛ مدح الخلفاء والوزراء والأكابر وحدّث وكان زاهداً ورعاً حسن المقاصد في الشعر وله ديوان شعر؛ ذكره العماد الأصبهاني في الخريدة {cite:wafayat-ayan}."
  en: "Abu al-Marhaf Nasr b. Mansur al-Namiri — blind poet of Baghdad, a Hanbali who lost his sight to smallpox at fourteen; a pious ascetic who praised caliphs and viziers; pupil in adab of Ibn al-Jawaliqi; author of a diwan {cite:wafayat-ayan}."
