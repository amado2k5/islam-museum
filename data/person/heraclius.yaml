summary:
  en: "Byzantine emperor (610–641) who drove the Sasanians back, recovered Jerusalem and the True Cross, and then lost Syria and Egypt to the Muslim armies. The Arabic sources call him Hirakl or Kaysar and report a letter from the Prophet and an audience in which he questioned Abu Sufyan. Encyclopaedia of Islam articles describe his Persian campaigns, the Yarmuk in 636 and his policy in Egypt."
  ar: "إمبراطور بيزنطة ⁦(610–641م)⁩ الذي دفع الساسانيين وأعاد القدس وخشبة الصليب، ثم خسرت جيوشه الشام ومصر أمام المسلمين. تسميه المصادر العربية هرقل أو القيصر، وتنقل رسالة من النبي ومقابلة سأل فيها أبا سفيان. وتصف مقالات دائرة المعارف الإسلامية حملاته على الفرس واليرموك سنة 636م وسياسته في مصر. وذكر ابن خلدون في علامات النبوة أن هرقل لما جاءه كتاب النبي يدعوه إلى الإسلام أحضر من وجد من قريش وفيهم أبو سفيان فسألهم بما يأمركم فقال أبو سفيان بالصلاة والزكاة والصلة والعفاف فقال إن يكن ما تقول حقاً فهو نبي وسيملك ما تحت قدمي هاتين، فأخذ من الدعاء إلى العبادة دليلاً على صحة نبوته ولم يحتج إلى معجزة {cite:muqaddima-ibn-khaldun p. 91}"
  ur: "بازنطینی شہنشاہ، 610 سے 641ء، جس نے ساسانیوں کو پیچھے دھکیلا، بیت المقدس اور صلیب کی لکڑی واپس لی، اور پھر شام اور مصر مسلم لشکروں کے ہاتھوں کھو دیے۔ عربی ماخذ اسے ہرقل یا قیصر کہتے ہیں اور نبی کے خط اور اس ملاقات کا ذکر کرتے ہیں جس میں اس نے ابو سفیان سے سوال کیا۔ دائرہ معارف اسلامیہ کے مضامین اس کی فارسی مہمات، 636ء کے یرموک اور مصر میں اس کی پالیسی کو بیان کرتے ہیں۔"
