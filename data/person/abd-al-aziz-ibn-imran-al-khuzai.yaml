summary:
  ar: "عبد العزيز بن عمران بن أيوب بن مقلاص، الإمام أبو علي الخزاعي مولاهم المصري الفقيه، أخذ عن الشافعي وعن عبد الله بن وهب، وروى عنه أبو زرعة وأبو حاتم وغيرهما. كان فقيهًا زاهدًا، وهو ابن بنت سعيد بن أبي أيوب. توفي سنة 234 {cite:tabaqat-shafiiyya-subki p. 264-265}."
  en: "Abd al-Aziz ibn Imran, Abu 'Ali al-Khuza'i of Egypt (d. 234) — a faqih and ascetic who studied under al-Shafi'i and 'Abd Allah b. Wahb, transmitted to Abu Zur'a and Abu Hatim, and was a grandson-in-law of Sa'id b. Abi Ayyub {cite:tabaqat-shafiiyya-subki p. 264-265}."
  ur: "عبد العزیز بن عمران، ابو علی خزاعی مصری (مت 234ھ) — فقیہ و زاہد؛ امام شافعی اور عبد اللہ بن وہب کے تلمذ، ابو زرعہ اور ابو حاتم ان سے روایت کرتے ہیں؛ سعید بن ابی ایوب کے داماد یا نواسہ {cite:tabaqat-shafiiyya-subki p. 264-265}."
