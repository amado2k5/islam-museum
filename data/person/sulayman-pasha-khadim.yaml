summary:
  ar: "سليمان باشا الخادم، والي مصر في عهد سليمان القانوني وقائد الحملة العثمانية الكبرى على الهند سنة ٩٤٤هـ تقريباً؛ تلقى مرسوماً سلطانياً يأمره بتجهيز أسطول في السويس والخروج إلى الهند للجهاد وقطع الطرق المؤدية إلى مكة المكرمة عن البرتغاليين، فوصل جدة في سبعة أيام ثم اتجه إلى كمران وسيطر على عدن وعيّن عليها حامية من ستمائة جندي، وواصل إلى الهند فحاصر ديو ولم يتمكن من اقتحامها وانسحب بعد أن فقد نحو أربعمائة من رجاله، ثم استولى على إحدى القلاع الأمامية وأسر ثمانين برتغالياً، ولولا الإمدادات البرتغالية الجديدة لاستسلمت القلاع كلها {cite:dawlat-uthmaniyya-salabi p. 196}."
  en: "Sulayman Pasha al-Khadim — governor of Egypt under Sulayman the Magnificent who led the 1538 Ottoman expedition to India: he garrisoned Aden, besieged Diu, captured a forward castle with eighty prisoners and withdrew when Portuguese reinforcements arrived {cite:dawlat-uthmaniyya-salabi p. 196}."
