summary:
  ar: "عبد الواحد بن التين، أبو محمد الصفاقسي المغربي المالكي، فقيه محدث مفسر، عنده عناية زائدة بالفقه ممزوجة بكثير من كلام المدونة وشراحها، واعتمده ابن حجر في شرح البخاري. توفي سنة 611هـ، ومن تصانيفه «الخبر الفصيح في شرح البخاري الصحيح». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  en: "Abd al-Wahid ibn al-Tin, Abu Muhammad al-Safaqusi al-Maghribi al-Maliki, a jurist, hadith scholar and exegete (d. 611 AH). His work joins fiqh with much of the Mudawwana and its commentators, and Ibn Hajar relied on him in his commentary on al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  es: "Abd al-Wahid ibn al-Tin, Abu Muhammad al-Safaqusi al-Maghribi al-Maliki, jurista, erudito en hadices y exégeta (m. 611 AH). Su obra integra el fiqh con gran parte de la Mudawwana y sus comentaristas, e Ibn Hajar se basó en él para su comentario sobre al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  fr: "Abd al-Wahid ibn al-Tin, Abu Muhammad al-Safaqusi al-Maghribi al-Maliki, juriste, spécialiste du hadith et exégète (mort en 611 AH). Son œuvre concilie le fiqh avec une grande partie de la Mudawwana et de ses commentateurs; Ibn Hajar s’est appuyé sur lui dans son commentaire d’al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  ur: "عبد الواحد ابن الطین، ابو محمد الصفقوسی المغربی المالکی، فقیہ، محدث اور مفسر ⁦(متوفی 611ھ)⁩۔ اس کا کام فقہ میں زیادہ تر مدوانہ اور اس کے مفسرین سے ملتا ہے، اور ابن حجر نے البخاری کی تفسیر میں اس پر انحصار کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص3478}"
  tr: "Abd al-Wahid ibn al-Tin, Ebu Muhammed el-Safaqsi el-Mağribi el-Maliki, bir hukukçu, hadis alimi ve tefsirciydi; Mudawwana'nın sözleri ve tefsirleriyle harmanlanmış olağanüstü bir fikıh ilgisi vardı ve İbn Hajar, el-Buhari üzerine yazdığı tefsirde ona dayandı. 611 Hicri yılında öldü. Eserleri arasında 'Al-Khabar al-Fasih fi Sharh al-Bukhari al-Sahih' bulunmaktadır. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.3478}"
  id: "Abd al-Wahid ibn al-Tin, Abu Muhammad al-Safaqsi al-Maghribi al-Maliki, adalah seorang ahli hukum, ulama hadis, dan penafsir, dengan minat luar biasa dalam bidang hukum yang bercampur dengan banyak kata-kata dan komentar Mudawwana, dan Ibn Hajar mengandalkan beliau dalam komentarnya tentang al-Bukhari. Ia meninggal pada tahun 611 H. Di antara karyanya adalah 'Al-Khabar al-Fasih fi Sharh al-Bukhari al-Sahih'. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.3478}"
