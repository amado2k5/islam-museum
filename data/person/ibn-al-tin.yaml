summary:
  ar: "عبد الواحد بن التين، أبو محمد الصفاقسي المغربي المالكي، فقيه محدث مفسر، عنده عناية زائدة بالفقه ممزوجة بكثير من كلام المدونة وشراحها، واعتمده ابن حجر في شرح البخاري. توفي سنة 611هـ، ومن تصانيفه «الخبر الفصيح في شرح البخاري الصحيح». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
  en: "Abd al-Wahid ibn al-Tin, Abu Muhammad al-Safaqusi al-Maghribi al-Maliki, a jurist, hadith scholar and exegete (d. 611 AH). His work joins fiqh with much of the Mudawwana and its commentators, and Ibn Hajar relied on him in his commentary on al-Bukhari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3478}"
