summary:
  ar: "سياسي غيني (1945–2026) وُلد في ديمبوكرو، مفتش خزانة ومنفيّ سابق في ساحل العاج، عيّنه الرئيس لانسانا كونتي رئيسا لوزراء غينيا في 9 يوليو 1996 — أول من شغل المنصب منذ 1984 — حتى إقالته في 8 مارس 1999؛ ثم قاد اتحاد القوى الجمهورية المعارض، وأُصيب إصابة خطيرة في احتجاج 28 سبتمبر 2009، وحلّ ثالثا في الانتخابات الرئاسية سنة 2010، وتوفي في منفاه بمستشفى في باريس في 25 سبتمبر 2026."
  en: "Guinean politician (1945–2026) born at Dimbokro, a treasury inspector and former exile in Côte d'Ivoire whom President Lansana Conté appointed Prime Minister of Guinea on 9 July 1996 — the first holder of the office since 1984 — until his dismissal on 8 March 1999; he then led the opposition Union of Republican Forces (UFR), was seriously injured in the 28 September 2009 stadium protest, placed third in the 2010 presidential election, and died in exile at a Paris hospital on 25 September 2026."
  ur: "گنی سیاست دان (1945ء–2026ء)، دیمبوکرو میں پیدا ہوئے؛ خزانہ انسپکٹر اور کوٹ ڈی آئیور میں جلاوطنی گزارنے والے؛ صدر لانسانا کونتے نے انھیں 9 جولائی 1996ء کو گنی کا وزیرِ اعظم مقرر کیا — 1984ء کے بعد اس عہدے کے پہلے حامل — حتیٰ کہ 8 مارچ 1999ء کو برطرف ہوئے؛ پھر حزبِ اختلاف اتحادِ افواجِ جمہوریہ (UFR) کی قیادت کی، 28 ستمبر 2009ء کے سٹیڈیم احتجاج میں شدید زخمی ہوئے، 2010ء کے صدارتی انتخاب میں تیسرے نمبر پر رہے، اور 25 ستمبر 2026ء کو پیرس کے ایک اسپتال میں جلاوطنی میں انتقال ہوا۔"
