summary:
  ar: "مغنية مكسيكية وشخصية على وسائل التواصل، وُلدت في مازاتلان سنة 1999 باسم كينيا غوادالوبي فلوريس أوسونا؛ بدأت صانعة محتوى على يوتيوب ضمن فريق جوكيلوب، ثم انطلقت منفردة ووقّعت مع ليزوس ميوزك سنة 2018 بأولى أغانيها «بور سييمبري»، وأصدرت ألبومات «كامبيوس دي لونا» (2022) و«كيه 23» (2023) و«بينك أورا» (2024)، وفازت بجوائز إم تي في أوروبا وعدة جوائز إم تي في مياو ورُشّحت لجائزة غرامي اللاتينية. لا يذكر أي مصدر قرئ في هذه الجولة دينًا لها."
  en: "Mexican singer and social-media personality, born in Mazatlán in 1999 as Kenia Guadalupe Flores Osuna. She began as a YouTube content creator with the Jukilop team, then went solo, signed with Lizos Music in 2018 with her debut single 'Por Siempre', and released the albums Cambios de Luna (2022), K23 (2023) and Pink Aura (2024); she has won an MTV Europe Music Award and multiple MTV MIAW Awards and was nominated for a Latin Grammy Award. No source read in this run attests any religion for her."
  ur: "میکسیکن گلوکارہ اور سوشل میڈیا شخصیت، 1999 میں مازاتلان میں کینیا گواڈالوپے فلورس اوسونا کے نام سے پیدا ہوئیں؛ یوٹیوب پر جوکیلوب ٹیم کے ساتھ مواد ساز کے طور پر آغاز کیا، پھر تنہا آگے بڑھیں، 2018 میں لِزوس میوزک سے معاہدہ کر کے پہلا گانا «پور سیئمپرے» جاری کیا، اور البمز «کامبیوس دے لونا» (2022)، «کے 23» (2023) اور «پنک اورا» (2024) جاری کیے؛ ایم ٹی وی یورپ ایوارڈ اور متعدد ایم ٹی وی میاؤ ایوارڈز جیتے اور لاطینی گریمی کے لیے نامزد ہوئیں۔ اس جولے میں پڑھے گئے کسی ماخذ میں ان کا کوئی مذہب مذکور نہیں۔"
