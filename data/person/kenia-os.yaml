summary:
  ar: "مغنية مكسيكية وشخصية على وسائل التواصل، وُلدت في مازاتلان سنة 1999 باسم كينيا غوادالوبي فلوريس أوسونا؛ بدأت صانعة محتوى على يوتيوب ضمن فريق جوكيلوب، ثم انطلقت منفردة ووقّعت مع ليزوس ميوزك سنة 2018 بأولى أغانيها «بور سييمبري»، وأصدرت ألبومات «كامبيوس دي لونا» (2022) و«كيه 23» (2023) و«بينك أورا» (2024)، وفازت بجوائز إم تي في أوروبا وعدة جوائز إم تي في مياو ورُشّحت لجائزة غرامي اللاتينية. لا يذكر أي مصدر قرئ في هذه الجولة دينًا لها."
  en: "Mexican singer and social-media personality, born in Mazatlán in 1999 as Kenia Guadalupe Flores Osuna. She began as a YouTube content creator with the Jukilop team, then went solo, signed with Lizos Music in 2018 with her debut single 'Por Siempre', and released the albums Cambios de Luna (2022), K23 (2023) and Pink Aura (2024); she has won an MTV Europe Music Award and multiple MTV MIAW Awards and was nominated for a Latin Grammy Award. No source read in this run attests any religion for her."
  ur: "میکسیکن گلوکارہ اور سوشل میڈیا شخصیت، 1999 میں مازاتلان میں کینیا گواڈالوپے فلورس اوسونا کے نام سے پیدا ہوئیں؛ یوٹیوب پر جوکیلوب ٹیم کے ساتھ مواد ساز کے طور پر آغاز کیا، پھر تنہا آگے بڑھیں، 2018 میں لِزوس میوزک سے معاہدہ کر کے پہلا گانا «پور سیئمپرے» جاری کیا، اور البمز «کامبیوس دے لونا» (2022)، «کے 23» (2023) اور «پنک اورا» (2024) جاری کیے؛ ایم ٹی وی یورپ ایوارڈ اور متعدد ایم ٹی وی میاؤ ایوارڈز جیتے اور لاطینی گریمی کے لیے نامزد ہوئیں۔ اس جولے میں پڑھے گئے کسی ماخذ میں ان کا کوئی مذہب مذکور نہیں۔"
  es: "Cantante mexicana y personalidad de las redes sociales, nacida en Mazatlán en 1999 como Kenia Guadalupe Flores Osuna. Comenzó como creadora de contenido en YouTube con el equipo Jukilop, luego inició su carrera en solitario, firmó con Lizos Music en 2018 con su sencillo debut \"Por Siempre\" y lanzó los álbumes Cambios de Luna (2022), K23 (2023) y Pink Aura (2024). Ha ganado un MTV Europe Music Award y varios MTV MIAW Awards, y fue nominada a un Latin Grammy. Ninguna fuente consultada en este artículo menciona su religión."
  fr: "Chanteuse et influenceuse mexicaine, née à Mazatlán en 1999 sous le nom de Kenia Guadalupe Flores Osuna, elle a débuté comme créatrice de contenu sur YouTube avec l'équipe Jukilop avant de se lancer en solo. En 2018, elle signe chez Lizos Music avec son premier single « Por Siempre » et sort les albums « Cambios de Luna » (2022), « K23 » (2023) et « Pink Aura » (2024). Elle a remporté un MTV Europe Music Award et plusieurs MTV MIAW Awards et a été nommée aux Latin Grammy Awards. Aucune source consultée ne mentionne de religion à son sujet."
  tr: "Meksikalı şarkıcı ve sosyal medya kişiliği olan Sher, 1999'da Mazatlán'da Kenya Guadalupe Flores Osuna adıyla doğdu; JokKilop ekibiyle YouTube içerik üreticisi olarak başladı, ardından solo olarak başladı ve 2018'de ilk şarkısı \"Por Siembri\" ile Lyzos Music ile anlaştı. \"Campios de Luna\" (2022), \"K23\" (2023) ve \"Pink Aura\" (2024) albümlerini çıkardı. MTV Avrupa Ödülleri ve birkaç MTV Miao Ödülü kazandı, ayrıca Latin Grammy Ödülü'ne aday gösterildi. Bu turne sırasında dini hakkında hiçbir kaynak belirtilmedi."
  id: "Penyanyi dan tokoh media sosial asal Meksiko, lahir di Mazatlán pada tahun 1999 dengan nama Kenya Guadalupe Flores Osuna, ia memulai karier sebagai kreator konten YouTube bersama tim JokKilop, lalu meluncurkan diri sendiri dan menandatangani kontrak dengan Lyzos Music pada tahun 2018 dengan lagu pertamanya \"Por Siembri.\" Ia merilis album \"Campios de Luna\" (2022), \"K23\" (2023), dan \"Pink Aura\" (2024). Ia memenangkan MTV Europe Awards dan beberapa MTV Miao Awards serta dinominasikan untuk Latin Grammy Award. Tidak ada sumber yang menyebutkan agamanya selama tur ini."
