summary:
  ar: "صاحب الأندلس، الأمير عبد الرحمن بن محمد الأموي المرواني، لما ضعف أمر الأمة قويت همته وقال أنا أولى الناس بالخلافة وتسمى بأمير المؤمنين الناصر لدين الله واستولى على أكثر الأندلس وكانت له الهيبة الزائدة والجهاد والغزو والسيرة المحمودة استأصل المتغلبين وفتح سبعين حصناً {cite:tarikh-khulafa-minhaj-1434 p. 605}. وعند المسعودي أنه في وقته كان صاحب الأندلس يركب في مائة ألف ذو منعة بالرجال والمال والكراع، وأنه قبض على وزيره أحمد بن إسحاق لأمر استحق عليه فيه العقوبة فقتله، وغزا سمورة مملكة الجلالقة فكانت وقعة شوال سنة سبع وعشرين وثلاثمائة التي قتل فيها من المسلمين نحو خمسين ألفاً {cite:muruj-al-dhahab p. 359-361} وكان توليته من الغريب إذ كان شاباً وأعمامه حاضرون فتصدى إليها واحتازها دونهم، ووجد الأندلس مضطربة بالمخالفين فأطفأ نيران المتغلبين واستقامت له بعد نيف وعشرين سنة، ودامت أيامه نحو خمسين سنة استفحل فيها ملك بني أمية، وهو أول من تسمى منهم بالأندلس بأمير المؤمنين لما التاث أمر الخلافة بالمشرق وبلغه قتل المقتدر سنة سبع عشرة وثلاثمائة، وتناول سبتة من أيدي أهلها وأطاعه بنو إدريس وملوك زناتة، وهزم عام الخندق سنة ثلاث وعشرين فقعد عن الغزو بنفسه وصار يردد الصوائف كل سنة {cite:nafh-tib-maqqari p. 389-390}."
  en: "The Andalusian amir Abd al-Rahman ibn Muhammad the Umayyad; as the umma weakened he grew resolute — 'I am the worthiest of the caliphate' — styled amir al-mu'minin al-Nasir li-Din Allah, mastered most of al-Andalus, rooted out the usurpers and took seventy fortresses {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  fr: "L'émir andalou Abd al-Rahman ibn Muhammad l'Omeyyade ; alors que la communauté s'affaiblissait, il se montra résolu — « je suis le plus digne du califat » —, prit le titre d'amir al-mu'minin al-Nasir li-Din Allah, se rendit maître de la plus grande partie d'al-Andalus, extirpa les usurpateurs et prit soixante-dix forteresses {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  ur: "اندلس کے اموی حکمران عبد الرحمن بن محمد، جنہوں نے الناصر لدین اللہ اور امیر المؤمنین کے القاب اختیار کیے اور اندلس کے بیشتر حصے پر اپنی حکومت مضبوط کی۔ {cite:tarikh-khulafa-minhaj-1434}"
  es: "El amir andalusí Abd al-Rahman ibn Muhammad el Omeya; a medida que la umma se debilitaba, se volvió resuelto — 'Soy el más digno del califato' — llamado amir al-mu'minin al-Nasir li-Din Allah, dominó la mayor parte de al-Ándalus, expulsó a los usurpadores y tomó setenta fortalezas {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  tr: "Endülüs hükümdarı Prens Abdülrahman ibn Muhammed el-Umavi el-Mervani, Müslüman topluluğunun işleri zayıfladığında hırsı daha da arttı. Kendisini halifeliğe en layık kişi ilan etti ve kendisine Müminlerin Komutanı, Allah'ın Dinini Savunan olarak hitap etti. Endülüs'ün büyük bir bölümünü ele geçirdi ve büyük prestiji, cihadı, fetihleri ve övgüye değer davranışlarıyla tanındı. Gaspçıları ortadan kaldırdı ve yetmiş kaleyi fethetti. {cite:tarikh-khulafa-minhaj-1434 s. 605}. El-Mas'udi, hükümdarlığı sırasında Endülüs hükümdarının yüz bin güçlü adamla, zenginlik ve at bakımından zengin bir orduyla yola çıktığını belirtir. Ayrıca veziri Ahmed ibn İshak'ı cezayı hak eden bir suçtan tutuklayıp idam ettirdi. Daha sonra Hicri 327 yılında Şevval Savaşı'nda Galiçya Krallığı Zamora'yı işgal etti ve bu savaşta yaklaşık elli bin Müslüman öldürüldü. {cite:muruj-al-dhahab s. 359-361} Görevlendirilmesi garipti çünkü genç bir adamdı ve amcaları da oradaydı, bu yüzden yönetimi onlardan habersiz devraldı ve ele geçirdi. Endülüs'ü muhaliflerle karışıklık içinde buldu, bu yüzden gaspçıların ateşini söndürdü ve yirmi yıldan fazla bir süre sonra bölge onun için düzene girdi. Yaklaşık elli yıl süren hükümdarlığı boyunca Beni Emevilerin yönetimi yoğunlaştı. Doğu'da halifelik meselesi karışıklığa düştüğünde ve Hicri 317 yılında Muktedir'in öldürüldüğü haberi kendisine ulaştığında, Endülüs'te Müminlerin Komutanı olarak adlandırılan ilk kişi oldu. Ceuta'yı halkının elinden aldı ve Banu İdris ile Zenata kralları ona itaat etti. Hicri 23 yılında Hendek yılında yenilgiye uğradı, bu yüzden kendisi savaşmayı bıraktı ve her yıl yaz seferlerini tekrarlamaya başladı. {Kaynak:nafh-tib-maqqari s. 389-390}"
  id: "Penguasa Andalusia, Pangeran Abd al-Rahman ibn Muhammad al-Umawi al-Marwani, ketika keadaan komunitas Muslim melemah, ambisinya semakin kuat. Ia menyatakan dirinya sebagai orang yang paling layak untuk menjadi khalifah dan menyebut dirinya sebagai Panglima Kaum Beriman, Pembela Agama Allah. Ia menguasai sebagian besar Andalusia dan dikenal karena prestisenya yang besar, jihad dan penaklukannya, serta perilakunya yang terpuji. Ia membasmi para perampas kekuasaan dan menaklukkan tujuh puluh benteng. {cite:tarikh-khulafa-minhaj-1434 p. 605}. Al-Mas'udi menyatakan bahwa selama pemerintahannya, penguasa Andalusia akan berkuda dengan seratus ribu orang kuat, kaya akan harta benda dan kuda. Ia juga menangkap wazirnya, Ahmad ibn Ishaq, karena kejahatan yang pantas dihukum dan mengeksekusinya. Kemudian ia menyerbu kerajaan Galicia, Zamora, dalam Perang Syawal tahun 327 H, di mana sekitar lima puluh ribu Muslim tewas. {kutip:muruj-al-dhahab hlm. 359-361} Pengangkatannya aneh karena ia masih muda dan paman-pamannya hadir, sehingga ia mengambil alih dan merebutnya tanpa mereka. Ia mendapati Andalusia dalam kekacauan akibat para pembangkang, sehingga ia memadamkan api para perampas kekuasaan dan wilayah itu kembali dikuasainya setelah lebih dari dua puluh tahun. Masa pemerintahannya berlangsung sekitar lima puluh tahun, di mana kekuasaan Bani Umayyah semakin menguat. Ia adalah orang pertama dari mereka yang disebut Amirul Mukminin di Andalusia ketika masalah kekhalifahan menjadi kacau di Timur dan berita tentang pembunuhan Al-Muqtadir pada tahun 317 H sampai kepadanya. Ia merebut Ceuta dari tangan penduduknya dan Bani Idris serta raja-raja Zenata menaatinya. Ia dikalahkan pada tahun Parit pada tahun 23 Hijriah, sehingga ia berhenti berperang sendiri dan mulai mengulangi kampanye musim panas setiap tahun {cite:nafh-tib-maqqari hlm. 389-390}."
