education:
  did_you_know:
    ar: "عبد الرحمن الناصر أمير الأندلس الأموي المرواني؛ لما ضعف أمر الأمة قويت همته فتسمى بأمير المؤمنين والناصر لدين الله واستولى على أكثر الأندلس."
    en: "Abd al-Rahman al-Nasir, the Marwanid Umayyad emir of al-Andalus — when the community's affairs weakened, his resolve rose: he took the titles Commander of the Faithful and al-Nasir li-Din Allah and mastered most of al-Andalus."
    ur: "عبدالرحمن ناصر، اندلس کا اموی مروانی امیر — جب امت کے حالات کمزور ہوئے تو اس کا حوصلہ بڑھا: اس نے امیر المومنین اور الناصر لدین اللہ کے القاب لیے اور زیادہ تر اندلس پر قابض ہوا۔"
    sources: [source/nafh-tib-maqqari, source/tarikh-ibn-khaldun-ibar]
