id: person/abd-al-rahman-iii-al-nasir
class: person
label: { ar: "عبد الرحمن الناصر لدين الله الأموي" }
summary:
  ar: "صاحب الأندلس، الأمير عبد الرحمن بن محمد الأموي المرواني، لما ضعف أمر الأمة قويت همته وقال أنا أولى الناس بالخلافة وتسمى بأمير المؤمنين الناصر لدين الله واستولى على أكثر الأندلس وكانت له الهيبة الزائدة والجهاد والغزو والسيرة المحمودة استأصل المتغلبين وفتح سبعين حصناً {cite:tarikh-khulafa-minhaj-1434 p. 605}.، وعند المسعودي أنه في وقته كان صاحب الأندلس يركب في مائة ألف ذو منعة بالرجال والمال والكراع، وأنه قبض على وزيره أحمد بن إسحاق لأمر استحق عليه فيه العقوبة فقتله، وغزا سمورة مملكة الجلالقة فكانت وقعة شوال سنة سبع وعشرين وثلاثمائة التي قتل فيها من المسلمين نحو خمسين ألفاً {cite:muruj-al-dhahab p. 359-361}"
  en: "The Andalusian amir Abd al-Rahman ibn Muhammad the Umayyad; as the umma weakened he grew resolute — 'I am the worthiest of the caliphate' — styled amir al-mu'minin al-Nasir li-Din Allah, mastered most of al-Andalus, rooted out the usurpers and took seventy fortresses {cite:tarikh-khulafa-minhaj-1434 p. 605}."
