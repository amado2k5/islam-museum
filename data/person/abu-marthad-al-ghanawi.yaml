roles: [companion]
gender: male
summary:
  ar: "صحابي غنوي اسمه كناز بن الحصين، حليف حمزة؛ ذكره موسى بن عقبة وابن إسحاق في البدريين، وروى عن النبي حديث النهي عن الجلوس على القبور والصلاة إليها، وسكن الشام."
  en: "A Ghanawi Companion named Kunaz ibn al-Husayn, an ally of Hamza; Musa ibn Uqba and Ibn Ishaq name him among the Badriyya. He narrated the prohibition on sitting on graves and praying toward them, and lived in Syria."
  ur: "غنوی صحابی کناز بن حسین، حمزہ کے حلیف؛ موسی بن عقبہ اور ابن اسحاق انہیں بدریوں میں شمار کرتے ہیں؛ شراب کی تحریم کی روایت ان سے منقول ہے۔"
