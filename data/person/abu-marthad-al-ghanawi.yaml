  ar: "أبو مرثد الغنوي؛ وعند ابن الأثير توفي سنة اثنتي عشرة وهو بدري، وكان ابنه مرثد بن أبي مرثد قُتل بالرجيع وهو بدري أيضًا {cite:kamil-ibn-al-athir p. 247}."
