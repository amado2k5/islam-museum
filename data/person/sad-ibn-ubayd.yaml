roles: [companion]
gender: male
summary:
  ar: "صحابي أوسي أنصاري، أبو زيد القارئ الذي جمع القرآن؛ شهد بدراً وكان يؤم بمسجد قباء في زمن النبي وأبي بكر وعمر، وذكره ابن نمير فيمن استشهد بالقادسية سنة ست عشرة."
  en: "An Awsi Ansari Companion, Abu Zayd al-Qari who gathered the Qur'an; a Badri who led the prayers at the Quba mosque in the Prophet's, Abu Bakr's and Umar's times. Ibn Numayr reports him martyred at al-Qadisiyya in 16 AH."
  ur: "اوسی انصاری صحابی، ابو زید القاری جس نے قرآن جمع کیا؛ بدری جو نبی، ابو بکر اور عمر کے زمانے میں مسجد قباء میں نماز پڑھاتا تھا۔"
  es: "Abu Zayd al-Qari, compañero de los Ansari y compilador del Corán, y un Badri que dirigió las oraciones en la mezquita de Quba en tiempos del Profeta, Abu Bakr y Umar, fueron martirizados por Ibn Numayr, quien relata que fue martirizado en al-Qadisiyya en el año 16 de la Hégira."
  fr: "Abu Zayd al-Qari, un Compagnon Awsi Ansari qui a compilé le Coran, était un Badri qui dirigeait la prière à la mosquée de Quba aux époques du Prophète, d'Abu Bakr et d'Umar. Ibn Numayr rapporte qu'il fut martyrisé à al-Qadisiyya en l'an 16 de l'Hégire."
  tr: "Ewsi el-Ensari'nin sahabesi Kur'an'ı düzenleyen Kur'an şivitçisi Ebu Zeyd, Peygamber Ebu Bekir ve Ömer zamanında Kübe Camii'nde Badr'a tanıklık etmiş ve namaz kılmıştır. İbn Numayr, onu on altıncı yılda el-Kadisiye'de şehit olanlar arasında anmıştır."
  id: "Sahabat Awsi al-Ansari, Abu Zayd, pembaca Al-Qur'an yang menyusun Al-Qur'an, menyaksikan Badr dan memimpin shalat di Masjid Quba pada masa Nabi, Abu Bakr, dan Umar. Ibn Numayr menyebutnya di antara mereka yang gugur di al-Qadisiyyah pada tahun enam belas."
