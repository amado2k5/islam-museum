summary:
  ar: "صحابي أوسي أنصاري، أبو زيد القارئ الذي جمع القرآن؛ شهد بدراً وكان يؤم بمسجد قباء في زمن النبي وأبي بكر وعمر، وذكره ابن نمير فيمن استشهد بالقادسية سنة ست عشرة."
  en: "An Awsi Ansari Companion, Abu Zayd al-Qari who gathered the Qur'an; a Badri who led the prayers at the Quba mosque in the Prophet's, Abu Bakr's and Umar's times. Ibn Numayr reports him martyred at al-Qadisiyya in 16 AH."
  ur: "اوسی انصاری صحابی، ابو زید القاری جس نے قرآن جمع کیا؛ بدری جو نبی، ابو بکر اور عمر کے زمانے میں مسجد قباء میں نماز پڑھاتا تھا۔"
