summary:
  ar: "مدرب كرة قدم فرنسي ولاعب وسط مهاجم سابق، وُلد في مرسيليا سنة 1972؛ صانع ألعاب لكان وبوردو ويوفنتوس وريال مدريد، سجل هدفين في فوز فرنسا بنهائي كأس العالم 1998، وفاز بالكرة الذهبية 1998 وبجائزة أفضل لاعب في العالم ثلاث مرات، وسجل هدف الفوز الطائر في نهائي دوري الأبطال 2002، وطُرد في نهائي كأس العالم 2006؛ وكمدرب لريال مدريد فاز بثلاثة ألقاب متتالية لدوري الأبطال (2016–2018) وبلقب ثانٍ للدوري الإسباني في فترته الثانية."
  en: "French football manager and former attacking midfielder, born in Marseille in 1972. A playmaker for Cannes, Bordeaux, Juventus and Real Madrid, he scored twice in France's 1998 World Cup final win, won the 1998 Ballon d'Or and FIFA World Player of the Year three times, scored the winning volley in the 2002 Champions League final, and was sent off in the 2006 World Cup final; as Real Madrid coach he won three consecutive Champions League titles (2016-2018) and a second La Liga title in his second spell."
  ur: "فرانسیسی فٹبال مینیجر اور سابق حملہ آور مڈفیلڈر، 1972 میں مارسیلے میں پیدا ہوئے؛ کان، بورڈو، یووینٹس اور ریال میڈرڈ کے پلے میکر، انہوں نے فرانس کی 1998 ورلڈ کپ فائنل جیت میں دو گول کیے، 1998 بالن ڈی اور جیتا اور تین بار فیفا ورلڈ پلیئر آف دی ایئر رہے، 2002 چیمپئنز لیگ فائنل میں فاتح والی گول کیا، اور 2006 ورلڈ کپ فائنل میں باہر بھیجے گئے؛ ریال میڈرڈ کے کوچ کی حیثیت سے انہوں نے مسلسل تین چیمپئنز لیگ خطابات (2016–2018) اور دوسری مدت میں دوسرا لا لیگا خطاب جیتا۔"
