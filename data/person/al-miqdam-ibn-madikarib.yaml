summary:
  ar: صحابي شامي يكنى أبا كريمة ⁦(وقيل أبا يحيى)⁩، نزل حمص وروى عن النبي وعن خالد بن الوليد ومعاذ وأبي أيوب؛ ولما قيل له إن الناس يزعمون أنه لم ير النبي قال إنه رآه وأخذ بشحمة أذنه؛ ذكره ابن سعد في أهل الشام وقال مات سنة 87هـ وهو ابن إحدى وتسعين.
  en: A Companion who lived in Syria, called Abu Karima (or Abu Yahya); he settled at Homs and narrated from the Prophet, Khalid ibn al-Walid, Mu'adh and Abu Ayyub; when told that people claimed he never saw the Prophet he swore he had, and that
    the Prophet had taken him by the lobe of his ear; Ibn Sa'd lists him among the Syrians and says he died in 87 AH aged ninety-one.
  fr: "Un compagnon qui vivait en Syrie, appelé Abu Karima (ou Abu Yahya) ; il s'est installé à Homs et a raconté du Prophète, Khalid ibn al-Walid, Mu'adh et Abu Ayyub ; lorsqu'on lui a dit que les gens ont affirmé qu'il n'a jamais vu le Prophète qu'il avait juré, et que le Prophète l'avait pris par le lobe de son oreille ; Ibn Sa'd le répertorie parmi les Syriens et dit qu'il est mort en 87 de l’hégire âgé de quatre-vingt-onze ans."
  ur: "شام میں رہنے والے صحابی، ابو کریمہ ⁦(یا ابو یحییٰ)⁩ کہلاتے؛ حمص میں رہے اور نبی، خالد بن ولید، معاذ اور دیگر سے روایت کیا۔"
  es: "Un Compañero que vivió en Siria, llamado Abu Karima (o Abu Yahya); se estableció en Homs y narró del Profeta, Khalid ibn al-Walid, Mu'adh y Abu Ayyub; cuando le dijeron que la gente afirmaba que nunca había visto al Profeta, juró que sí lo había visto, y que el Profeta lo había tomado por el lóbulo de la oreja; Ibn Sa'd lo incluye entre los sirios y dice que murió en el año 87 AH a la edad de noventa y un años."
