summary:
  ar: صحابي شامي يكنى أبا كريمة (وقيل أبا يحيى)، نزل حمص وروى عن النبي وعن خالد بن الوليد ومعاذ وأبي أيوب؛ ولما قيل له إن الناس يزعمون أنه لم ير النبي قال إنه رآه وأخذ بشحمة أذنه؛ ذكره ابن سعد في أهل الشام وقال مات سنة 87هـ وهو ابن إحدى وتسعين.
  en: A Companion who lived in Syria, called Abu Karima (or Abu Yahya); he settled at Homs and narrated from the Prophet, Khalid ibn al-Walid, Mu'adh and Abu Ayyub; when told that people claimed he never saw the Prophet he swore he had, and that
    the Prophet had taken him by the lobe of his ear; Ibn Sa'd lists him among the Syrians and says he died in 87 AH aged ninety-one.
