    note: "FLAGGED for the founder: the unbelief reading is strong in one tradition but contested, and does not meet the two-independent-source bar. The English article's lead states that Hamza, born to a devout Muslim family, 'became an atheist over time'; its text records that Kokand clergy accused him of promoting atheism, that he campaigned against religious fanaticism and superstition, promoted the hujum, and intended to remove the shrine at Shohimardon whose custodians, he held, extorted the peasants; Wikidata likewise carries atheism, and he was among the first Uzbeks to join the Communist Party. Against this, the Russian and Uzbek articles make no atheist attestation at all, and the Russian article records that since independence his Soviet-era portrait has been contested in Uzbekistan to the point that he has been publicly declared 'an enemy of the Uzbek people and Islam' amid the renaming of places that bore his name. The atheist portrait descends substantially from Soviet-era hagiography of an anti-religious campaigner, an interested source family. Both readings are preserved here and the value is unknown under the doubt rule, pending the founder's ruling on whether anti-religious activism of this documented strength should be recorded as atheist-or-sceptic."
