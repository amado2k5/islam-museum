summary:
  ar: "شاعر وكاتب مسرحي وملحن أوزبكي (1889–1929م)، مؤسس الأشكال الموسيقية الأوزبكية الحديثة والواقعية الاجتماعية الأوزبكية، ومعلم جديدي فتح مدارس للفقراء وحارب الخرافة ودافع عن تعليم النساء، رُجم حتى الموت في شاه مردان."
  en: "Uzbek poet, playwright and composer (1889–1929), founder of modern Uzbek musical forms and Uzbek social realism, a Jadid schoolteacher who opened schools for the poor, campaigned against superstition and for women's education, and was stoned to death at Shohimardon."
