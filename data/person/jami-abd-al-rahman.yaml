summary:
  ar: "شاعر فارسي وصوفي من جام، نُسب إليها، وصنّف في الشعر والتصوف. ولد بجام من قصبات خراسان واشتغل بالعلوم العقلية والشرعية فأتقنها ثم صحب مشايخ الصوفية وتلقن الذكر من الشيخ سعد الدين كاشغري وصحب خواجه عبيد الله السمرقندي وانتسب إليه أسمى الانتساب، وبلغ صيت فضله الآفاق حتى دعاه السلطان بايزيد خان إلى مملكته فتجهز وسافر من خراسان إلى همدان ثم اعتذر أنه لا يقدر على الدخول إلى بلاد الروم لما يسمع فيها من الطاعون، وله مؤلفات جمة منها شرح فصوص الحكم وشرح الكافية وهو أحسن شروحها وشواهد النبوة ونفحات الأنس وسلسلة الذهب والدرة الفاخرة، توفي بهراة سنة ثمان وتسعين وثمانمائة {cite:shadharat-dhahab p. 360-361}."
  en: "The Persian poet and Sufi of Jam — Sa'd al-Din Kashghari's disciple and Khwaja 'Ubaydallah Ahrar's companion, 'the wonder of his age in learning, deeds, letters and poetry'; Sharh Fusus al-Hikam, the best sharh of the Kafiya, Nafahat al-Uns, Silsilat al-Dhahab, al-Durra al-Fakhira; he got as far as Hamadan answering Bayezid's summons then begged off for the plague in Rum; died at Herat 898, his chronogram 'whoever enters it is safe' {cite:shadharat-dhahab p. 360-361}."
