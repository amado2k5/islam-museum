summary:
  ar: "شاعر فارسي وصوفي من جام، نُسب إليها، وصنّف في الشعر والتصوف. ولد بجام من قصبات خراسان واشتغل بالعلوم العقلية والشرعية فأتقنها ثم صحب مشايخ الصوفية وتلقن الذكر من الشيخ سعد الدين كاشغري وصحب خواجه عبيد الله السمرقندي وانتسب إليه أسمى الانتساب، وبلغ صيت فضله الآفاق حتى دعاه السلطان بايزيد خان إلى مملكته فتجهز وسافر من خراسان إلى همدان ثم اعتذر أنه لا يقدر على الدخول إلى بلاد الروم لما يسمع فيها من الطاعون، وله مؤلفات جمة منها شرح فصوص الحكم وشرح الكافية وهو أحسن شروحها وشواهد النبوة ونفحات الأنس وسلسلة الذهب والدرة الفاخرة، توفي بهراة سنة ثمان وتسعين وثمانمائة {cite:shadharat-dhahab p. 360-361}."
  en: "The Persian poet and Sufi of Jam — Sa'd al-Din Kashghari's disciple and Khwaja 'Ubaydallah Ahrar's companion, 'the wonder of his age in learning, deeds, letters and poetry'; Sharh Fusus al-Hikam, the best sharh of the Kafiya, Nafahat al-Uns, Silsilat al-Dhahab, al-Durra al-Fakhira; he got as far as Hamadan answering Bayezid's summons then begged off for the plague in Rum; died at Herat 898, his chronogram 'whoever enters it is safe' {cite:shadharat-dhahab p. 360-361}."
  es: "El poeta persa y sufí de Jam — discípulo de Sa'd al-Din Kashghari y compañero de Khwaja 'Ubaydallah Ahrar, 'la maravilla de su época en saber, obras, letras y poesía'; Sharh Fusus al-Hikam, el mejor sharh de los Kafiya, Nafahat al-Uns, Silsilat al-Dhahab, al-Durra al-Fakhira; llegó hasta Hamadán respondiendo a la convocatoria de Bayezid y luego se excusó por la peste en Rum; murió en Herat en 898, su cronograma 'quien entra en él está a salvo' {cite:shadharat-dhahab p. 360-361}."
  fr: "Le poète et soufi persan de Jam — disciple de Sa'd al-Din Kashghari et compagnon de Khwaja 'Ubaydallah Ahrar, « la merveille de son époque par son savoir, ses actes, ses lettres et sa poésie »; Sharh Fusus al-Hikam, le meilleur sharh de la Kafiya, Nafahat al-Uns, Silsilat al-Dhahab, al-Durra al-Fakhira; il parvint jusqu'à Hamadan en répondant à l'appel de Bayezid, puis dut s'absenter à cause de la peste à Rum; mourut à Hérat en 898, son chronogramme dit « quiconque y entre est en sécurité » {cite: shadharat-dhahab p. 360-361}."
  ur: "فارسی شاعر اور جام کے صوفی - سعدالدین کاشغری کے شاگرد اور خواجہ 'عبیداللہ احرار' کے ساتھی، 'تعلیم، اعمال، خطوط اور شاعری میں ان کی عمر کا کمال'؛ شرح فسوس الحکم، قافیہ کی بہترین شرح، نفحات الانس، سلسلۃ الذہاب، الدرۃ الفخیرہ؛ وہ بایزید کی طلبی کا جواب دیتے ہوئے حمدان تک پہنچا اور پھر رم میں طاعون کی بھیک مانگی۔ ہرات 898 میں وفات پائی، ان کی تاریخ 'جو اس میں داخل ہوا محفوظ ہے' 360-361}۔"
  tr: "Cem'den bir Fars ve Sufi şair olan Bajam, ona atfedildi ve şiir ile tasavvuf yazdı. Bajam, Horasan Kasbat'ında doğdu ve rasyonel ve dini bilimlerle uğraştı, bunları ustalıkla öğrendi. Daha sonra Sufi şeyhlerine eşlik etti ve Şeyh Saad al-Din Kaşgari'den anma öğrendi, onun Khwaja Ubayd Allah el-Samarqandi'ye eşlik etti ve ona en yüksek bağlılık derecesi kazandı. Erdemi geniş çapta tanındı ta ki Sultan Bayezid Han onu davet edene kadar krallığını da aldıktan sonra Horasan'dan Hamadan'a kadar hazırlık yaptı ve seyahat etti, ardından veba nedeniyle Romalıların topraklarına giremediği için kendini affettirdi. Şerh Fusus el-Hikam, en iyi yorumlarından biri olan Şerh el-Kafiya, Şahid el-Nubuvah, Nefahat el-Uns, Silsilat el-Dhahab ve el-Durra el-Fakhira gibi birçok eser yazdı. 898 Hicri yılında Harat'ta öldü {alıntı: Shadharat-Dhahab, s. 360-361}."
  id: "Seorang penyair Persia dan Sufi dari Jam, ia dikaitkan dengan Kasbat dan menulis puisi serta Sufisme. Bajam lahir di Kasbat Khorasan dan terlibat dalam ilmu rasional dan agama, menguasainya. Ia kemudian mendampingi para sheikh Sufi dan belajar kenangan dari Sheikh Saad al-Din Kashgari, mendampingi Khwaja Ubayd Allah al-Samarqandi, yang menjadi afiliasi tertingginya. Kebajikannya menjadi terkenal di mana-mana hingga Sultan Bayezid Khan mengundangnya ke kerajaannya, sehingga ia mempersiapkan diri dan melakukan perjalanan dari Khorasan ke Hamadan, lalu meminta izin karena tidak dapat memasuki tanah Romawi akibat wabah. Ia menulis banyak karya, termasuk Sharh Fusus al-Hikam, Sharh al-Kafiya, yang merupakan salah satu komentar terbaiknya, Shahid al-Nubuwwah, Nafahat al-Uns, Silsilat al-Dhahab, dan al-Durra al-Fakhira. Ia meninggal di Harat pada tahun 898 H {cite:Shadharat-Dhahab, hlm. 360-361}."
