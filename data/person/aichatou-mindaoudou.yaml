summary:
  ar: دبلوماسية وسياسية نيجرية وُلدت سنة 1959. وزيرة خارجية النيجر مرتين ⁦(1999–2001 و2011–2016)⁩، ومبعوثة أممية سابقة ترأست بعثات حفظ سلام في دارفور ⁦(UNAMID)⁩ وساحل العاج.
  en: Nigerien diplomat and politician, born 1959. Twice Minister of Foreign Affairs of Niger (1999–2001 and 2011–2016), and a senior UN envoy who headed peacekeeping missions in Darfur (UNAMID) and Côte
    d'Ivoire.
  ur: نائیجر کی سفارت کار اور سیاست دان، 1959 میں پیدا ہوئیں۔ دو بار نائیجر کی وزیر خارجہ ⁦(1999–2001 اور 2011–2016)⁩ اور دارفور ⁦(UNAMID)⁩ اور آئیوری کوسٹ میں امن مہمات کی سربراہ رہنے والی سینئر اقوام
    متحدہ ایلچی۔
  es: "Diplomático y político nigerino, nacido en 1959. Fue dos veces Ministro de Asuntos Exteriores de Níger (1999-2001 y 2011-2016) y alto enviado de la ONU, dirigiendo misiones de mantenimiento de la paz en Darfur (UNAMID) y Costa de Marfil."
  fr: "Diplomate et homme politique nigérien, né en 1959. Deux fois ministre des Affaires étrangères du Niger (1999-2001 et 2011-2016), et un envoyé spécial de l'ONU qui a dirigé des missions de maintien de la paix au Darfour (MINUAD) et en Côte d'Ivoire."
  tr: "1959 doğumlu Nijerli bir diplomat ve siyasetçi. Nijer'de iki kez Dışişleri Bakanı olarak görev yaptı (1999-2001 ve 2011-2016) ve Darfur (UNAMID) ve Fildişi Sahili'ndeki barış koruma misyonlarına başkanlık eden eski bir BM elçisidir."
  id: "Seorang diplomat dan politikus Niger kelahiran 1959. Ia menjabat dua kali sebagai Menteri Luar Negeri Niger (1999–2001 dan 2011–2016), dan merupakan mantan utusan PBB yang memimpin misi perdamaian di Darfur (UNAMID) dan Pantai Gading."
