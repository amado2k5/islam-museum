summary:
  ar: "أبو بكر أحمد بن محمد بن علي بن الحسين بن يحيى السيبي. ولد بقصر ابن هبيرة سنة ست وتسعين ومائتين، ودخل بغداد بعد أن أحرق القرمطي قصر ابن هبيرة سنة أربع عشرة وثلاثمائة، ودرس على أبي إسحاق المروزي، ورجع إلى قصره ونشر بها مذهب الشافعي، ومات في أول يوم من رجب سنة اثنتين وسبعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}. حاشية الكتاب تذكر أن نسبه ورد في بعض المصادر «الحسن» و«السني»، والنسبة إلى «السيب» بنواحي قصر ابن هبيرة {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu Bakr Ahmad ibn Muhammad ibn Ali ibn al-Husayn ibn Yahya al-Sibi. He was born in Qasr Ibn Hubayra in 296, and entered Baghdad after the Qarmati had burned Qasr Ibn Hubayra in 314. He studied under Abu Ishaq al-Marwazi, then returned to his qasr and spread the Shafi'i madhhab there, and died on the first day of Rajab 372 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. The book's editorial note says that his nisba appears in some sources as «al-Hasan» and «al-Sunni», and that the nisba «al-Sibi» refers to al-Sayb, in the districts of Qasr Ibn Hubayra {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
