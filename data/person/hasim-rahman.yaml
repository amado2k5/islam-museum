summary:
  ar: "ملاكم أمريكي محترف سابق (وُلد سنة 1972 في بالتيمور بولاية ماريلاند). بطل عالم للوزن الثقيل مرتين: أسقط لينوكس لويس بالضربة القاضية في أبريل 2001 فانتزع الألقاب الموحدة للمجلس العالمي للملاكمة والاتحاد الدولي للملاكمة والمنظمة الدولية للملاكمة واللقب الخطي وهو الطرف الأضعف بنسبة 20 إلى 1، وخسر نزال الإعادة في نوفمبر من العام نفسه، ثم حمل لقب المجلس العالمي للملاكمة مجدداً في 2005–2006. سجله 50 فوزاً (41 بالضربة القاضية) و10 هزائم وتعادلان."
  en: "American former professional boxer (born 1972 in Baltimore, Maryland). A two-time world heavyweight champion, he knocked out Lennox Lewis in April 2001 to win the unified WBC, IBF, IBO and lineal titles as a 20-to-1 underdog, lost the rematch that November, and held the WBC title again in 2005-2006. His record stands at 50 wins (41 by knockout), 10 losses and 2 draws."
  ur: "امریکی سابق پیشہ ور باکسر (پیدائش 1972، بالٹی مور، میری لینڈ)۔ دو مرتبہ کے عالمی ہیوی ویٹ چیمپئن؛ انہوں نے اپریل 2001 میں لینکس لیوس کو ناک آؤٹ کر کے متحدہ ڈبلیو بی سی، آئی بی ایف، آئی بی او اور لائنل ٹائٹل جیتے جبکہ وہ 20 سے 1 کے انڈرڈاگ تھے، اسی نومبر میں ری میچ ہار گئے، اور 2005–2006 میں دوبارہ ڈبلیو بی سی ٹائٹل رکھا۔ ان کا ریکارڈ 50 فتوحات (41 ناک آؤٹ)، 10 شکستیں اور 2 ڈرا ہے۔"
