summary:
  ar: "ملاكم أمريكي محترف سابق ⁦(وُلد سنة 1972 في بالتيمور بولاية ماريلاند)⁩. بطل عالم للوزن الثقيل مرتين: أسقط لينوكس لويس بالضربة القاضية في أبريل 2001 فانتزع الألقاب الموحدة للمجلس العالمي للملاكمة والاتحاد الدولي للملاكمة والمنظمة الدولية للملاكمة واللقب الخطي وهو الطرف الأضعف بنسبة 20 إلى 1، وخسر نزال الإعادة في نوفمبر من العام نفسه، ثم حمل لقب المجلس العالمي للملاكمة مجدداً في 2005–2006. سجله 50 فوزاً ⁦(41 بالضربة القاضية)⁩ و10 هزائم وتعادلان."
  en: "American former professional boxer (born 1972 in Baltimore, Maryland). A two-time world heavyweight champion, he knocked out Lennox Lewis in April 2001 to win the unified WBC, IBF, IBO and lineal titles as a 20-to-1 underdog, lost the rematch that November, and held the WBC title again in 2005-2006. His record stands at 50 wins (41 by knockout), 10 losses and 2 draws."
  ur: "امریکی سابق پیشہ ور باکسر ⁦(پیدائش 1972، بالٹی مور، میری لینڈ)⁩۔ دو مرتبہ کے عالمی ہیوی ویٹ چیمپئن؛ انہوں نے اپریل 2001 میں لینکس لیوس کو ناک آؤٹ کر کے متحدہ ڈبلیو بی سی، آئی بی ایف، آئی بی او اور لائنل ٹائٹل جیتے جبکہ وہ 20 سے 1 کے انڈرڈاگ تھے، اسی نومبر میں ری میچ ہار گئے، اور 2005–2006 میں دوبارہ ڈبلیو بی سی ٹائٹل رکھا۔ ان کا ریکارڈ 50 فتوحات ⁦(41 ناک آؤٹ)⁩، 10 شکستیں اور 2 ڈرا ہے۔"
  es: "Exboxeador profesional estadounidense (nacido en 1972 en Baltimore, Maryland). Dos veces campeón mundial de peso pesado, noqueó a Lennox Lewis en abril de 2001 para ganar los títulos unificados del CMB, la FIB, la OIB y el título lineal, siendo el menos favorito con una desventaja de 20 a 1. Perdió la revancha en noviembre de ese mismo año y volvió a ostentar el título del CMB entre 2005 y 2006. Su récord es de 50 victorias (41 por nocaut), 10 derrotas y 2 empates."
  fr: "Ancien boxeur professionnel américain (né en 1972 à Baltimore, Maryland). Double champion du monde des poids lourds, il a mis KO Lennox Lewis en avril 2001, remportant ainsi les titres unifiés WBC, IBF, IBO et linéaire, alors qu'il était donné perdant à 20 contre 1. Il a perdu le match revanche en novembre de la même année, puis a de nouveau détenu le titre WBC en 2005-2006. Son palmarès est de 50 victoires (dont 41 par KO), 10 défaites et 2 nuls."
  tr: "Eski profesyonel Amerikalı boksör (1972, Baltimore, Maryland doğumlu). İki kez dünya ağır siklet şampiyonu: Nisan 2001'de Lewis'i nakavtla nakavt etti, Dünya Boks Konseyi, Uluslararası Boks Federasyonu ve Uluslararası Boks Organizasyonu'nun birleşik unvanlarını ve lineer unvanı 20-1 mağlubiyetle kazandı. Aynı yılın Kasım ayında rövanşta kaybetti, ardından 2005–2006 sezonunda tekrar Dünya Boks Konseyi unvanını geri aldı. 50 galibiyet (41'i nakavt), 10 mağlubiyet ve 2 beraberlik kaydetti."
  id: "Mantan petinju profesional Amerika (lahir 1972 di Baltimore, Maryland). Juara dunia kelas berat dua kali: menjatuhkan Lewis dengan KO pada April 2001, merebut gelar gabungan World Boxing Council, International Boxing Federation, dan International Boxing Organization, serta gelar linear dengan margin kekalahan 20-1. Ia kalah dalam pertandingan ulang pada November tahun yang sama, lalu merebut kembali gelar World Boxing Council lagi pada 2005–2006. Ia mencatat 50 kemenangan (41 lewat KO), 10 kekalahan, dan 2 seri."
