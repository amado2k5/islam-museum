summary:
  ar: "بطاقة أولية للمتوكل يحيى شرف الدين، إمام الدولة الزيدية في اليمن في القرن السادس عشر، توفي سنة ١٥٥٥م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for al-Mutawakkil Yahya Sharaf al-Din, the sixteenth-century imam of the Zaydi state of Yemen, d. 1555; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para al-Mutawakkil Yahya Sharaf al-Din, imán del estado zaidí de Yemen en el siglo XVI, fallecido en 1555; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'al-Mutawakkil Yahya Sharaf al-Din, l'imam du XVIe siècle de l'État zaydite du Yémen, mort en 1555; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "یمن کی زیدی ریاست کے سولہویں صدی کے امام، المتوکل یحیی شرف الدین کے لیے مسودہ کارڈ۔ 1555; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Yemen'deki Zeydi devletinin 1555 yılında vefat eden on altıncı yüzyılda Yemen'deki Zeydi devletinin imamı olan El-Mutevakkil Yahya Şeraf el-Din'in ön kartı; İslam Devletleri Sözlükleri'nde adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Al-Mutawakkil Yahya Sharaf al-Din, Imam negara Zaydi di Yaman pada abad keenam belas, yang meninggal pada tahun 1555 M; ia disebutkan dalam Kamus Negara-Negara Islam dan biografinya belum ditinjau di halaman tersebut."
