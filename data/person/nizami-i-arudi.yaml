summary:
  ar: "نظامي عروضي السمرقندي كاتب فارسي من القرن السادس الهجري، صاحب كتاب «چهار مقاله» المسمى أيضاً «مجمع النوادر»، وقد كُتب نحو سنة 551هـ/1156م. تذكر دائرة المعارف الإسلامية أنه كان في خدمة عمر الخيام سنة 506هـ/1112م، وأنه زار قبره سنة 530هـ/1135م، وأن أخباره عن الخيام ضمن فصله عن المنجمين تنم عن إعجابه بأستاذه القديم، وتصفه كذلك بأنه أوثق مصدر في أخبار الشاعر الفرخي {cite:encyclopaedia-of-islam-2 vol. 10 p. 882}. لا تتوافر في المصادر المقروءة تواريخ ميلاده ووفاته."
  en: "Nizami-i 'Arudi of Samarqand was a Persian prose author of the 6th/12th century, writer of the Chahar maqala, also called Majma' al-nawadir, composed about 551/1156. The Encyclopaedia of Islam reports him in the service of 'Umar Khayyam in 506/1112 and visiting Khayyam's tomb in 530/1135, and notes that his accounts of Khayyam, placed in his chapter on astronomers and astrologers, reflect his admiration for his former master; elsewhere it calls him the most reliable informant on the poet Farrukhi {cite:encyclopaedia-of-islam-2 vol. 10 p. 882}. The sources read give no dates of his birth or death."
  ur: "نظامی عروضی سمرقندی چھٹی صدی ہجری کے فارسی نثر نگار تھے، جنہوں نے «چہار مقالہ» لکھی، جسے «مجمع النوادر» بھی کہا جاتا ہے، اور جو تقریباً 551ھ/1156ء میں تحریر ہوئی۔ دائرۃ المعارف الاسلامیہ کے مطابق وہ 506ھ/1112ء میں عمر خیام کی خدمت میں تھے اور 530ھ/1135ء میں ان کی قبر کی زیارت کی، اور فلکیات و نجوم کے باب میں خیام کے بارے میں ان کے بیانات اپنے سابق استاد کی تحسین کا اظہار ہیں؛ وہی مضمون شاعر فرخی کے بارے میں انہیں سب سے قابلِ اعتماد راوی بھی قرار دیتا ہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 882}۔ پڑھے گئے مآخذ میں ان کی پیدائش اور وفات کی تاریخیں نہیں ملتیں۔"
