  ar: "عبد الرحيم غرين"
  en: "Abdur Raheem Green"
  ur: "عبد الرحیم گرین"
summary:
  ar: "داعية بريطاني، ومؤسس منظمة آيَرا (أكاديمية التعليم والبحث الإسلامي) ورئيس مجلس إدارتها. وُلد باسم أنتوني واتسواف غافن غرين في دار السلام في سبتمبر 1964 لأبٍ إداري في الإمبراطورية البريطانية وأم بولندية، ونشأ كاثوليكيًا وتعلّم في كلية أمبلفورث، واعتنق الإسلام سنة 1988. اشتهر بالدعوة في ركن الخطباء في هايد بارك وفي البرامج التلفزيونية، وأسّس سنة 2009 منظمة آيَرا الدعوية التي يرأس مجلس إدارتها."
  en: "A British dawah preacher, and the founder and chairman of iERA, the Islamic Education and Research Academy. Born Anthony Waclaw Gavin Green in Dar es Salaam in September 1964 to a father who was a colonial administrator in the British Empire and a Polish mother, he was raised a Roman Catholic, educated at Ampleforth College, and embraced Islam in 1988. He became known for dawah at Speakers' Corner in Hyde Park and in televised settings, and in 2009 he founded iERA, the dawah charity whose chairmanship he holds."
  ur: "برطانوی داعی، اور iERA (اسلامی تعلیم و تحقیق اکیڈمی) کے بانی و چیئرمین۔ ستمبر 1964 میں دارالسلام میں اینتھونی واٹسلاف گیون گرین کے نام سے پیدا ہوئے؛ والد برطانوی سلطنت کے نوآبادیاتی افسر اور والدہ پولش تھیں۔ کیتھولک ماحول میں پرورش پائی، ایمپل فورتھ کالج میں تعلیم حاصل کی اور 1988 میں اسلام قبول کیا۔ ہائیڈ پارک کے اسپیکرز کارنر اور ٹیلی ویژن پر دعوت سے شہرت ملی، اور 2009 میں دعوتی خیراتی تنظیم iERA کی بنیاد رکھی جس کی صدارت ان کے پاس ہے۔"
