summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، كانت إذا صلت العتمة قامت على سطح تناجي ربها: «غارت النجوم، ونامت العيون، وغلّقت الملوك أبوابها، وبابك مفتوح، وخلا كل حبيب بحبيبه»، ثم تدعو عند السحر."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who after the night prayer would stand on a rooftop addressing her Lord — 'the stars have set, eyes sleep, kings have locked their doors, and Your door is open; every lover is alone with his beloved' — and pray again at dawn."
