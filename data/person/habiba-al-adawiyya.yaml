gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، كانت إذا صلت العتمة قامت على سطح تناجي ربها: «غارت النجوم، ونامت العيون، وغلّقت الملوك أبوابها، وبابك مفتوح، وخلا كل حبيب بحبيبه»، ثم تدعو عند السحر."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who after the night prayer would stand on a rooftop addressing her Lord — 'the stars have set, eyes sleep, kings have locked their doors, and Your door is open; every lover is alone with his beloved' — and pray again at dawn."
  es: "Una mujer devota de Basora, descrita por Ibn al-Jawzi en Sifat al-Safwa, después de la oración nocturna se ponía en una azotea dirigiéndose a su Señor: «Las estrellas se han puesto, los ojos duermen, los reyes han cerrado sus puertas, y Tu puerta está abierta; cada amante está a solas con su amada», y volvía a orar al amanecer."
  fr: "Une femme pieuse de Bassora, dont Ibn al-Jawzi a parlé dans Sifat al-Safwa, racontait qu'après la prière de la nuit, elle se tenait sur un toit et s'adressait à son Seigneur: « Les étoiles se sont couchées, les yeux dorment, les rois ont verrouillé leurs portes, et Ta porte est ouverte; chaque amoureux est seul avec son bien-aimé », puis priait à nouveau à l'aube."
  ur: "بصرہ کی ایک پرہیزگار خاتون ابن الجوزی نے صفات الصفوی میں درج کی ہے، جو رات کی نماز کے بعد چھت پر کھڑی اپنے رب سے مخاطب ہوتی تھی - 'ستارے ڈوب گئے، آنکھیں سو گئیں، بادشاہوں نے اپنے دروازے بند کر لیے، اور تیرا دروازہ کھلا ہے۔ ہر عاشق اپنے محبوب کے ساتھ تنہا ہوتا ہے' - اور فجر کے وقت دوبارہ دعا کریں۔"
  tr: "İbn al-Jawzi'nin 'Elitlerin Tanımı'nda bahsettiği Basra'lı bir ibadet eden, karanlık çöktüğünde çatıda durup Rabbisine dua ederdi: 'Yıldızlar karardı, gözler uyudu, krallar kapılarını kapattı, kapınız açık ve her sevgili sevgilisiyle yalnız,' sonra şafakta yalvarırdı."
  id: "Seorang penyembah dari Basra, yang disebutkan oleh Ibn al-Jawzi dalam 'Deskripsi Orang Elit,' ketika gelap tiba, akan berdiri di atap untuk memohon kepada Tuannya: 'Bintang-bintang telah gelap, mata telah tertidur, raja-raja telah menutup pintunya, pintumu terbuka, dan setiap kekasih sendirian bersama kekasihnya,' lalu dia akan memohon saat fajar."
