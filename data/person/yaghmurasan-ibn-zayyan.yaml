summary:
  ar: "مؤسس دولة بني عبد الواد بتلمسان من زناتة؛ داخله بنو مرين وتمسك بالدعوة الحفصية وكان منذ تقلد طاعة آل عبد الواد يغذ السير في الغارات فاختطف وسُمي بالمعتضد، وحاصر تلمسان ثمان سنين ثم دخلها فلم يبق على ملك بني عبد الواد إلا سنة ثم قتل في حربه عليها سنة 681هـ {cite:tarikh-ibn-khaldun-ibar p. 1707-1708}."
  en: "Founder of the Abd al-Wadid sultanate of Tlemcen from Zanata; besieged Tlemcen eight years, took it, was titled al-Mu'tadid and was killed warring for it in 681 {cite:tarikh-ibn-khaldun-ibar p. 1707-1708}."
