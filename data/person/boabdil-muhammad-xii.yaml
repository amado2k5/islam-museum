id: person/boabdil-muhammad-xii
class: person
label: { ar: "أبو عبد الله محمد آخر ملوك غرناطة" }
summary:
  ar: "أبو عبد الله محمد بن السلطان أبي الحسن بن سعد بن علي بن يوسف بن محمد الغني بالله الأنصاري الخزرجي، آخر سلاطين بني نصر بغرناطة الذي انقرضت بدولته مملكة الإسلام بالأندلس ومحيت رسومها؛ سلّم الحمراء للنصارى في ثاني ربيع الأول سنة سبع وتسعين وثمانمائة على سبعة وستين شرطاً نقضوها بعد، وانتقل إلى البشرات فأندرش ثم احتال في الرحيل إلى بر العدوة فنزل بمليلة واستوطن فاساً، وبنى بها قصوراً على طريق بنيان الأندلس رآها المقري ودخلها بنفسه، وكتب إلى سلطان فاس الشيخ الوطاسي رسالته الموسومة بالروض العاطر الأنفاس في التوسل إلى المولى الإمام سلطان فاس من إنشاء أبي عبد الله محمد بن عبد الله العربي العقيلي، وتوفي بفاس عام أربعين وتسعمائة ودُفن بإزاء المصلّى خارج باب الشريعة وخلف ولدين يوسف وأحمد، وعاقبة ذريته بفاس أنهم لحقوا بأوقاف الفقراء والمساكين ويُعدّون من جملة الشحاذين كما شهدهم المقري سنة ١٠٢٧ {cite:nafh-tib-maqqari p. 528-529}."
  en: "Abu Abdallah Muhammad (Boabdil), last Nasrid sultan of Granada — he surrendered the Alhambra on sixty-seven broken conditions, withdrew through the Alpujarras to Fez, built Andalusi-style palaces al-Maqqari himself entered, addressed his famous begging-letter to the Wattasid sultan, died there in 940 and left descendants whom al-Maqqari found living off the poor's waqfs, 'counted among the beggars' {cite:nafh-tib-maqqari p. 528-529}."
  es: "Abu Abdallah Muhammad (Boabdil), último sultán nazarí de Granada, entregó la Alhambra tras sesenta y siete condiciones incumplidas, se retiró a través de las Alpujarras hasta Fez, construyó palacios de estilo andalusí en los que entró el propio al-Maqqari, dirigió su famosa carta de súplica al sultán wattasí, murió allí en 940 y dejó descendientes a quienes al-Maqqari encontró viviendo de los waqfs de los pobres, «contados entre los mendigos» {cite:nafh-tib-maqqari p. 528-529}."
  fr: "Abu Abdallah Muhammad (Boabdil), dernier sultan nasride de Grenade, a cédé l'Alhambra sous soixante-sept conditions non respectées, s'est retiré à travers les Alpujarras jusqu'à Fès, a fait construire des palais de style andalou où al-Maqqari lui-même est entré, a adressé sa célèbre lettre de mendicité au sultan wattaside, y est mort en 940 et a laissé des descendants qu'al-Maqqari a trouvés vivant des waqfs des pauvres, « comptés parmi les mendiants » {cite:nafh-tib-maqqari p. 528-529}."
  ur: "ابو عبد اللہ محمد ⁦(بوعبدل)⁩، غرناطہ کے آخری نصری سلطان - اس نے 67 ٹوٹی پھوٹی شرائط پر الحمبرا کے حوالے کیا، الپوجراس سے ہوتے ہوئے فیز کی طرف پیچھے ہٹ گئے، اندلس کے طرز کے محلات المقاری خود داخل ہوئے، اپنے مشہور بھیک نامہ سے خطاب کیا اور وطاطسیدوں کو یہیں چھوڑ دیا اور وہیں وفات پا گئے۔ المقاری نے غریبوں کے وقفوں سے زندگی گزارتے ہوئے پایا، 'فقیروں میں شمار کیا جاتا ہے'۔ 528-529}۔"
  tr: "Granada'nın son Nasr sultanı Ebu Abdullah Muhammed bin Sultan Ebu el-Hasan ibn Saad ibn Ali ibn Yusuf ibn Muhammed el-Ghani Billah el-Ensari el-Khazraji, devleti Endülüs'teki İslam krallığını sona erdiren ve gelenekleri silinmiş olan, 897 Hicri yılının ikinci Rabi'al-Awwal'ında Hristiyanlara altmış yedi şartla Alhambra'yı teslim etti. El-Bişrat'a taşındı ve ardından Adwa topraklarına taşınma planı yaptı; burada Melilla'ya yerleşti, Fez'e yerleşti ve Banyan al-Andalus yolunda saraylar inşa etti; al-Maqri burayı görüp girdi Kendisi Fıs Sultanı Şeyh Al-Watasi'ye 'El-Rawd El-Atir El-Anfas', Efendi İmam Sultan'a aracılık etmek için Ebu Abdullah Muhammed bin Abdullah El-Arabi El-Akili'nin yaratılması' başlıklı mektubunu yazdı. 1940 Hicri yılında Fes'te öldü ve Bab al-Şeri'a dışındaki namaz salonunun karşısında defnedildi; geride iki oğlu, Yusuf ve Ahmed bıraktı. Fes'teki soyundan gelenlerin kaderi, yoksulların ve muhtaçların bağışlarına katılmaları ve dilenciler arasında sayılmasıydı; bunu 1027'de Al-Maqari tanıklık etti {cite:nafh-tib-maqqari, s. 528-529}."
  id: "Abu Abdullah Muhammad ibn Sultan Abu al-Hasan ibn Saad ibn Ali ibn Yusuf ibn Muhammad al-Ghani Billah al-Ansari al-Khazraji, sultan Nasr terakhir di Granada, yang negaranya mengakhiri kerajaan Islam di al-Andalus dan adat-adatnya dihapuskan, menyerahkan Alhambra kepada umat Kristen pada tanggal kedua Rabi' al-Awwal tahun 897 H, dengan enam puluh tujuh syarat, yang kemudian mereka langgar. Ia pindah ke al-Bishrat dan kemudian merancang rencana untuk pindah ke tanah Adwa, di mana ia menetap di Melilla, menetap di Fez, dan membangun istana di sana di jalan menuju Banyan al-Andalus, yang dilihat dan dimasuki al-Maqri Ia sendiri menulis surat kepada Sultan Fez, Sheikh Al-Watasi, berjudul 'Al-Rawd Al-Atir Al-Anfas dalam memohon perantaraan kepada Guru, Imam Sultan Fez, melalui penciptaan Abu Abdullah Muhammad bin Abdullah Al-Arabi Al-Aqili.' Ia meninggal di Fez pada tahun 1940 H. dan dimakamkan di seberang aula salat di luar Bab al-Shari'a, meninggalkan dua putra, Yusuf dan Ahmad. Nasib keturunannya di Fez adalah mereka bergabung dengan anugerah bagi orang miskin dan membutuhkan dan termasuk pengemis, seperti yang disaksikan oleh Al-Maqari pada tahun 1027 {cite:nafh-tib-maqqari, hlm. 528-529}."
