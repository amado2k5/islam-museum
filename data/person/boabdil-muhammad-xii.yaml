label: { ar: "أبو عبد الله محمد آخر ملوك غرناطة" }
summary:
  ar: "أبو عبد الله محمد بن السلطان أبي الحسن بن سعد بن علي بن يوسف بن محمد الغني بالله الأنصاري الخزرجي، آخر سلاطين بني نصر بغرناطة الذي انقرضت بدولته مملكة الإسلام بالأندلس ومحيت رسومها؛ سلّم الحمراء للنصارى في ثاني ربيع الأول سنة سبع وتسعين وثمانمائة على سبعة وستين شرطاً نقضوها بعد، وانتقل إلى البشرات فأندرش ثم احتال في الرحيل إلى بر العدوة فنزل بمليلة واستوطن فاساً، وبنى بها قصوراً على طريق بنيان الأندلس رآها المقري ودخلها بنفسه، وكتب إلى سلطان فاس الشيخ الوطاسي رسالته الموسومة بالروض العاطر الأنفاس في التوسل إلى المولى الإمام سلطان فاس من إنشاء أبي عبد الله محمد بن عبد الله العربي العقيلي، وتوفي بفاس عام أربعين وتسعمائة ودُفن بإزاء المصلّى خارج باب الشريعة وخلف ولدين يوسف وأحمد، وعاقبة ذريته بفاس أنهم لحقوا بأوقاف الفقراء والمساكين ويُعدّون من جملة الشحاذين كما شهدهم المقري سنة ١٠٢٧ {cite:nafh-tib-maqqari p. 528-529}."
  en: "Abu Abdallah Muhammad (Boabdil), last Nasrid sultan of Granada — he surrendered the Alhambra on sixty-seven broken conditions, withdrew through the Alpujarras to Fez, built Andalusi-style palaces al-Maqqari himself entered, addressed his famous begging-letter to the Wattasid sultan, died there in 940 and left descendants whom al-Maqqari found living off the poor's waqfs, 'counted among the beggars' {cite:nafh-tib-maqqari p. 528-529}."
