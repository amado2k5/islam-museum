  id: "Abu Abdullah ibn Razam, penulis buku di mana ia membantah kaum Ismaili dan mengungkap doktrin mereka. Ibn al-Nadim mengutip bukunya dalam redaksi dalam artikel tentang doktrin Ismaili, mengatakan: 'Aku bebas dari perjanjian tentang kebenaran dan berbohong tentangnya.' {cite:fihrist-ibn-al-nadim hlm. 264}."
