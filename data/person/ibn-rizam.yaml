  ar: "أبو عبد الله بن رزام صاحب الكتاب الذي رد فيه على الإسماعيلية وكشف مذاهبهم، وأورد ابن النديم كتابه بلفظه في مقالة الكلام على مذهب الإسماعيلية وقال وأنا برئ من العهدة في الصدق عنه والكذب فيه {cite:fihrist-ibn-al-nadim p. 264}."
