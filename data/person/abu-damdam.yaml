summary:
  ar: "أبو دمدم، بطل حكايات طريفة ذُكر في القرن العاشر الميلادي، تنسب إليه أقوال حمقاء وفتاوى فكاهية، وقد يكون هو الزاهد الذي قدّم سمعته بدل الزكاة لعباد الله، وهي هوية ترجّحها الموسوعة ولا تجزم بها. {cite:encyclopaedia-of-islam-2 vol. 1 p. 132}"
  en: "Abu Damdam, the hero of a collection of anecdotes cited already in the tenth century, to whom foolish remarks and comical legal rulings are attributed. The encyclopaedia thinks he may be the devotee who offered his good name instead of zakat. {cite:encyclopaedia-of-islam-2 vol. 1 p. 132}"
  ur: "ابو دمدم، دسویں صدی میں نقل ہونے والی لطیفوں کی ایک کتاب کے ہیرو، جن کی طرف بے تکی باتیں اور مزاحیہ فقہی فیصلے منسوب ہیں۔ موسوعہ کا خیال ہے کہ وہ وہی عابد ہو سکتے ہیں جنہوں نے زکوٰۃ کے بدلے اپنی نیک نامی پیش کی۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 132}"
