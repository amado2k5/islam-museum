summary:
  ar: "قارئ قرآن كردي عراقي من إقليم كردستان العراق، يُدرج ضمن قرّاء المصحف الكامل برواية حفص عن عاصم، وتصفه ملفات القرّاء بأنه إمام في السليمانية. بدأت قناته على يوتيوب في 1 ديسمبر 2012، وبلغت 1,670,000 مشترك و372,622,074 مشاهدة و1,943 مقطعًا بحسب vidIQ كما في 9 نوفمبر 2026، وبلغت صفحته على فيسبوك 5,300,000 متابع بحسب بيانات منشور مؤرخ في 13 يناير 2026، وحسابه على إنستغرام 1,000,000 متابع بحسب منشوره المؤرخ في 4 نوفمبر 2026. نصّ تلاوته عربي كما هو عند كل قارئ، ومحتوى أدعيته وتأطير صفحاته يجريان بالكردية السورانية والعربية."
  en: "Kurdish Iraqi Quran reciter from the Kurdistan Region of Iraq, listed among the full-mushaf reciters in the Hafs 'an 'Asim narration; reciter profiles describe him as an imam in Sulaymaniyah. His YouTube channel, started on 1 December 2012, counted 1,670,000 subscribers, 372,622,074 views and 1,943 videos as read by vidIQ on 9 November 2026; his Facebook page counted 5,300,000 followers by post metadata of 13 January 2026, and his Instagram account 1,000,000 followers by his own post of 4 November 2026. The recited text is Arabic, as for every reciter; his supplication content and his pages' framing run in Sorani Kurdish and Arabic."
  ur: "عراق کے کردستان خطے سے تعلق رکھنے والے کرد عراقی قاریِ قرآن، جو حفص عن عاصم کی روایت میں مکمل مصحف کے قاریوں میں درج ہیں؛ قاری پروفائلز انھیں سلیمانیہ کا امام بیان کرتے ہیں۔ ان کا یوٹیوب چینل یکم دسمبر 2012ء کو شروع ہوا اور 9 نومبر 2026ء کی vidIQ قرأت کے مطابق اس کے سبسکرائبر 1,670,000، ویوز 372,622,074 اور ویڈیوز 1,943 تھے؛ ان کے فیس بک پیج کے فالوور 13 جنوری 2026ء کی پوسٹ میٹا ڈیٹا کے مطابق 5,300,000 اور انسٹاگرام اکاؤنٹ کے فالوور 4 نومبر 2026ء کی اپنی پوسٹ کے مطابق 1,000,000 تھے۔ ان کی تلاوت کا متن ہر قاری کی طرح عربی ہے، جب کہ ان کی دعاؤں کا مواد اور صفحات کی پیش کش سورانی کردی اور عربی میں ہے۔"
