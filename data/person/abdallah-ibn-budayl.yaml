summary:
  ar: "عبد الله بن بديل بن ورقاء الخزاعي؛ عند البلاذري وجهه عمر إلى أصبهان سنة 23 ففتح جي صلحاً بعد قتال وبارز الفادوسفان مرزبانها فأكرمه وصالحه على الجزية لأهل بلده فوفى وأخذ اليهودية وغلب على أرض أصبهان وطساسيجها وعاملهم في الخراج نحو معاملة أهل الأهواز."
  en: "Abdallah ibn Budayl ibn Warqa' al-Khuza'i; in al-Baladhuri sent by Umar to Isbahan in 23 — took Jayy by treaty after fighting, dueled and honored the fleeing marzban al-Fadhusfan, secured jizya for his townspeople, mastered Isbahan's land and tasasij, and set its kharaj on al-Ahwaz's model."
