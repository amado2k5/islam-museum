summary:
  ar: "عبد الله بن بديل بن ورقاء الخزاعي؛ عند البلاذري وجهه عمر إلى أصبهان سنة 23 ففتح جي صلحاً بعد قتال وبارز الفادوسفان مرزبانها فأكرمه وصالحه على الجزية لأهل بلده فوفى وأخذ اليهودية وغلب على أرض أصبهان وطساسيجها وعاملهم في الخراج نحو معاملة أهل الأهواز."
  en: "Abdallah ibn Budayl ibn Warqa' al-Khuza'i; in al-Baladhuri sent by Umar to Isbahan in 23 — took Jayy by treaty after fighting, dueled and honored the fleeing marzban al-Fadhusfan, secured jizya for his townspeople, mastered Isbahan's land and tasasij, and set its kharaj on al-Ahwaz's model."
  fr: "Abdallah ibn Budayl ibn Warqa' al-Khuza'i ; chez al-Baladhuri, envoyé par Umar à Ispahan en 23 — il prit Jayy par traité après combat, affronta en combat singulier et honora le marzban en fuite al-Fadhusfan, garantit la jizya pour les gens de sa ville, se rendit maître de la terre d'Ispahan et de ses tasasij, et fixa son kharaj sur le modèle d'al-Ahwaz."
  es: "Abdallah ibn Budayl ibn Warqa' al-Khuza'i; en al-Baladhuri enviado por Umar a Isbahan en 23 - tomó Jayy por tratado después de luchar, se batió en duelo y honró al marzban al-Fadhusfan que huía, aseguró la jizya para sus habitantes, dominó la tierra y las tasasij de Isbahan, y estableció su kharaj según el modelo de al-Ahwaz."
  ur: "عبداللہ بن بدیل بن ورقع الخزاعی؛ 23 میں عمر کی طرف سے اسبہان کو بھیجے گئے البلادھوری میں - لڑائی کے بعد معاہدے کے ذریعے جے کو لیا، بھاگنے والے مرزبان الفدصفان کی عزت افزائی کی، اس کے شہر والوں کے لیے جزیہ حاصل کیا، اسبہان کی زمین اور تسجی میں مہارت حاصل کی، اور اس کا خراج الاہواز کے نمونے پر قائم کیا۔"
  tr: "Abdullah bin Badil bin Warqa' el-Khuza'i; el-Baladhuri'ye göre Ömer onu 23 yılında İsfahan'a gönderdi. Savaşarak Jay'i barışçıl bir şekilde fethetti ve mezhebinin valisi el-Fadusfan ile savaştı. Bunun üzerine Fadusfan ona saygı gösterdi ve ülkesinin halkına vergi ödeme şartıyla onunla barıştı. Yükümlülüğünü yerine getirdi, Yahudi topluluğunu yanına aldı, İsfahan topraklarını ve çevresini fethetti ve onlara Ahvaz halkıyla aynı şekilde vergi uyguladı."
  id: "Abdullah bin Badil bin Warqa’ al-Khuza’i; menurut al-Baladhuri, Umar mengirimnya ke Isfahan pada tahun 23. Ia menaklukkan Jayy secara damai setelah berperang dan melawan al-Fadusfan, marzbannya, sehingga ia menghormatinya dan berdamai dengannya dengan syarat membayar upeti kepada penduduk negerinya. Ia memenuhi kewajibannya dan membawa komunitas Yahudi serta menaklukkan tanah Isfahan dan distrik-distriknya dan memperlakukan mereka dalam hal pajak dengan cara yang sama seperti penduduk Ahwaz."
