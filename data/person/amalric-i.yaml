summary:
  ar: "مري، وهو أمالريك الأول في المصادر اللاتينية، ملك بيت المقدس الفرنجي الذي تولى الملك في ربيع الأول 558هـ/فبراير 1163م بحسب دائرة المعارف الإسلامية. وجّه حملات إلى مصر الفاطمية بين 559 و564هـ/1164 و1168م، وتنافس مع نور الدين محمود على السيطرة عليها، وتحالف مع الوزير شاور، ثم حاصر دمياط سنة 565هـ/1169م دون أن يظفر بها. ويقول ابن الأثير إنه مات في سنة 569هـ وكان أعظم ملوك الفرنج شجاعة ورأياً، وخلفه ابنه المجذوم {cite:encyclopaedia-of-islam-2 vol. 8 p. 141} {cite:kamil-ibn-al-athir p. 68}."
  en: "Amalric I, called Mari or Amaury in the sources, was the Frankish king of Jerusalem who, according to the Encyclopaedia of Islam, came to the throne in Rabi' I 558/February 1163. He sent armies into Fatimid Egypt between 559/1164 and 564/1168 in rivalry with Nur al-Din Mahmud, allied himself with the vizier Shawar, and besieged Damietta in 565/1169 without taking it. Ibn al-Athir says he died in 569 AH, the bravest and shrewdest of the Frankish kings, and was followed by a leper son {cite:encyclopaedia-of-islam-2 vol. 8 p. 141} {cite:kamil-ibn-al-athir p. 68}."
  ur: "مری، لاطینی ماخذ میں امالرک اول، فرنگی بیت المقدس کا بادشاہ تھا جو دائرۃ المعارف الاسلامیہ کے مطابق ربیع الاول 558ھ/فروری 1163ء میں تخت نشین ہوا۔ اس نے 559 تا 564ھ/1164 تا 1168ء کے دوران نور الدین محمود کے ساتھ مقابلے میں فاطمی مصر پر لشکر بھیجے، وزیر شاور کا حلیف بنا اور 565ھ/1169ء میں دمیاط کا محاصرہ کیا مگر اسے فتح نہ کر سکا۔ ابن اثیر کے مطابق وہ 569ھ میں فوت ہوا، فرنگی بادشاہوں میں سب سے بہادر اور دانا، اور اس کا جانشین جذام زدہ بیٹا ہوا {cite:encyclopaedia-of-islam-2 vol. 8 p. 141} {cite:kamil-ibn-al-athir p. 68}."
