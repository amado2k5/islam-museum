kids:
  ar: "مري كان ملك القدس عند الفرنج، وحاول أكثر من مرة أن يدخل مصر لكنه لم ينجح."
  en: "Amalric was the Frankish king of Jerusalem; he led armies into Egypt several times but never held it."
  ur: "امالرک بیت المقدس کا فرنگی بادشاہ تھا، اس نے کئی بار مصر میں لشکر بھیجے مگر اسے قبضے میں نہ رکھ سکا۔"
