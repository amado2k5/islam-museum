summary:
  ar: "رجل من بني عبس بالكوفة؛ عند البلاذري قال للمستخبرين عن سعد بن أبي وقاص إنه كان لا يقسم بالسوية ولا يعدل في القضية فدعا عليه سعد أن كان كاذباً فأطل عمره وأدم فقره وأعم بصره وعرضه للفتن فرآه عبد الملك بن عمير يتعرض للإماء في السكك يقول كبير مفتون أصابتني دعوة سعد."
  en: "A man of Banu Abs at Kufa; in al-Baladhuri he told the investigators Sa'd 'neither divided equally nor judged justly' — whereupon Sa'd's prayer befell him, Abd al-Malik ibn Umayr seeing him in the alleys saying 'an old man tried — Sa'd's prayer struck me.'"
