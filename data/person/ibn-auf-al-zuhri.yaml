label: { ar: "ابن عوف الزهري" }
names:
  - { value: "نضير الإسلام أبو الطاهر إسماعيل بن مكي بن إسماعيل بن عيسى بن عوف الزهري الإسكندراني المالكي", kind: full }
summary:
  ar: "نضير الإسلام أبو الطاهر إسماعيل بن مكي بن إسماعيل بن عوف الزهري الإسكندراني المالكي، شيخ الإسكندرية؛ تفقه على أبي بكر الطرطوشي وسمع منه ومن أبي عبد الله الرازي، وبرع في المذهب وتخرج به الأصحاب، وقصده السلطان صلاح الدين وسمع منه الموطأ؛ توفي في شعبان سنة إحدى وثمانين وخمسمائة وله ست وتسعون سنة — وهو اليوم الذي توفي فيه الإمام السهيلي {cite:shadharat-dhahab p. 748, 752}."
  en: "Nadir al-Islam Abu al-Tahir Isma'il b. Makki Ibn Auf al-Zuhri al-Iskandarani the Maliki, shaykh of Alexandria; trained under Abu Bakr al-Turtushi, heard from him and from Abu Abdallah al-Razi, excelled in the madhhab and taught its scholars — Salah al-Din himself sought him out and heard the Muwatta from him. He died in Sha'ban 581 at ninety-six, on the same day as Imam al-Suhayli {cite:shadharat-dhahab p. 748, 752}."
  es: "Nadir al-Islam Abu al-Tahir Isma'il b. Makki Ibn Auf al-Zuhri al-Iskandarani, el malikí, shaykh de Alejandría, se formó con Abu Bakr al-Turtushi, escuchó sus enseñanzas y las de Abu Abdallah al-Razi, sobresalió en la escuela jurídica y enseñó a sus eruditos. El propio Salah al-Din lo buscó y escuchó de él el Muwatta. Murió en Sha'ban 581 a los noventa y seis años, el mismo día que el Imam al-Suhayli {cite: shadharat-dhahab p. 748, 752}."
  fr: "Nadir al-Islam Abu al-Tahir Isma'il b. Makki Ibn Auf al-Zuhri al-Iskandarani, dit le Maliki, cheikh d'Alexandrie, formé par Abu Bakr al-Turtushi, dont il reçut l'enseignement ainsi que celui d'Abu Abdallah al-Razi, excella dans l'école malikite et enseigna à ses savants. Saladin lui-même le consulta et reçut de lui la Muwatta. Il mourut en Sha'ban 581 à l'âge de quatre-vingt-seize ans, le même jour que l'imam al-Suhayli (voir: shadharat-dhahab, p. 748, 752)."
  ur: "نادر الاسلام ابو الطاہر اسماعیل بی۔ مکی ابن عوف الزہری الاسکندرانی مالکی، شیخ سکندریہ؛ ابو بکر الطرطوشی کے زیر تربیت، ان سے اور ابو عبداللہ الرازی سے سنا، مذھب میں کمال حاصل کیا اور اس کے علماء کو سکھایا - خود صلاح الدین نے ان کی تلاش کی اور ان سے موطا سنا۔ آپ کی وفات شعبان 581 میں چھیانوے میں ہوئی، اسی دن امام سہیلی نے فرمایا۔ 748، 752}۔"
  tr: "Nadir el-İslam Ebu el-Tahir İsmail ibn Makki ibn İsmaili ibn Avf el-Zuhri el-İskenderi el-Maliki, İskenderiye Şeyhi; Ebu Bekir el-Turtuşi'nin yanında fıkıh okudu ve ondan ve Ebu Abdullah el-Razi'den dinledi. Medhabda üstün başarı gösterdi ve sahabelerle mezun oldu. Sultan Salaheddin onu ziyaret etti ve muvatta'yı ondan dinledi; 581 Hicri yılında Şaban'da doksan altı yaşında öldü — aynı gün İmam el-Suhaili de vefat etti {atı:şadharat-dhahab s. 748, 752}."
  id: "Nadir al-Islam Abu al-Tahir Ismail ibn Makki ibn Isma'il ibn Awf al-Zuhri al-Iskandariani al-Maliki, Sheikh Alexandria; ia belajar hukum di bawah Abu Bakr al-Turtushi dan mendengar kabar darinya dan Abu Abdullah al-Razi. Ia unggul dalam madhhab dan lulus bersama para sahabat. Sultan Salah al-Din mengunjunginya dan mendengar Muwatta darinya; ia meninggal di Sha'ban pada tahun 581 H pada usia sembilan puluh enam tahun — pada hari yang sama Imam al-Suhaili wafat {cite:shadharat-dhahab hlm. 748, 752}."
