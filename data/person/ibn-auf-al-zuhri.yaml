summary:
  ar: "نضير الإسلام أبو الطاهر إسماعيل بن مكي بن إسماعيل بن عوف الزهري الإسكندراني المالكي، شيخ الإسكندرية؛ تفقه على أبي بكر الطرطوشي وسمع منه ومن أبي عبد الله الرازي، وبرع في المذهب وتخرج به الأصحاب، وقصده السلطان صلاح الدين وسمع منه الموطأ؛ توفي في شعبان سنة إحدى وثمانين وخمسمائة وله ست وتسعون سنة — وهو اليوم الذي توفي فيه الإمام السهيلي {cite:shadharat-dhahab p. 748, 752}."
  en: "Nadir al-Islam Abu al-Tahir Isma'il b. Makki Ibn Auf al-Zuhri al-Iskandarani the Maliki, shaykh of Alexandria; trained under Abu Bakr al-Turtushi, heard from him and from Abu Abdallah al-Razi, excelled in the madhhab and taught its scholars — Salah al-Din himself sought him out and heard the Muwatta from him. He died in Sha'ban 581 at ninety-six, on the same day as Imam al-Suhayli {cite:shadharat-dhahab p. 748, 752}."
