summary:
  ar: "داعية وناشط إندونيسي من سوراكارتا (نحو 1876–1926)، تاجر باتيك تعلّم في المعاهد الشرعية وحجّ فتسمّى بالحاج محمد مصباح، ومن قادة الجناح اليساري في شريكة الإسلام ومؤسسي صحافة «مدان مسلمين» و«إسلام برغيراك»، واشتهر بدعوته إلى توافق الإسلام والشيوعية حتى لُقّب «الحاج الأحمر»، ونُفي إلى مانوكواري فمات فيها سنة 1926."
  en: "Indonesian preacher and activist from Surakarta (c. 1876–1926), a batik trader educated in the pesantren who took the name Haji Mohammad Misbach after his Hajj, a leader of Sarekat Islam's left wing and founder of the journals Medan Moeslimin and Islam Bergerak, famous for arguing that Islam and communism are compatible — the 'Red Haji' — and exiled to Manokwari, where he died in 1926."
  ur: "سوراکارتا کے انڈونیشی مبلغ اور کارکن (تقریباً 1876ء–1926ء)، باٹک کے تاجر جو مدارس میں پڑھے اور حج کے بعد حاجی محمد مصباح کہلائے، شریکۃ اسلام کے بائیں بازو کے رہنما اور «مدان مسلمین» اور «اسلام برگرک» کے بانی، اسلام اور کمیونزم کی مطابقت کی دعوت سے مشہور ہوئے — «سرخ حاجی» — اور مانوک واری جلاوطن ہوئے جہاں 1926ء میں وفات پائی۔"
