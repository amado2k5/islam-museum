summary:
  ar: "رجل دولة وإداري عثماني، تولى الصدارة العظمى مرتين سنة 1909، وكان قبل ذلك المفتش العام الإصلاحي على مقدونيا (1902–1908). وُلد في جزيرة مدللي لأسرة تجار تركية ذات أصول يونانية جزئية، وارتقى من كاتب إلى والٍ على أضنة واليمن، وتولى وزارة الداخلية في حكومة كامل باشا، وختم مسيرته سفيرًا في فيينا حيث توفي."
  en: "Ottoman statesman and administrator, twice Grand Vizier in 1909 and before that the reforming Inspector-General of Macedonia (1902–1908). Born on Lesbos to a Turkish merchant family of partly Greek descent, he rose from clerk to governor of Adana and Yemen, served as Interior Minister under Kâmil Pasha, and ended his career as ambassador in Vienna, where he died."
  ur: "عثمانی مدبر اور منتظم، 1909 میں دو مرتبہ صدرِ اعظم اور اس سے پہلے مقدونیہ کے اصلاح پسند مفتشِ عام (1902–1908)۔ لسبوس میں جزوی یونانی نسل کے ایک ترک تاجر خاندان میں پیدا ہوئے؛ منشی سے ترقی کر کے ادانہ اور یمن کے والی بنے، کامل پاشا کی حکومت میں وزیرِ داخلہ رہے، اور اپنے دور کا اختتام ویانا میں سفیر کی حیثیت سے کیا جہاں ان کا انتقال ہوا۔"
