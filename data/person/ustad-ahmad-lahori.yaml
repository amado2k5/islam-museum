summary:
  ar: "الأستاذ أحمد لاهوري (ق. 1580 – 1649)، المعروف أيضًا بأحمد معمار، مهندس معماري ومهندس في خدمة الإمبراطور المغولي شاه جهان. تسمّيه الحوليات الرسمية لشاه جهان، مع الأستاذ حميد، بين مهندسي القلعة الحمراء في دلهي (1639–1648). ويوصف على نطاق واسع بأنه مهندس تاج محل في أغرة، لكن هوية مهندس تاج محل ليست معروفة على وجه اليقين؛ فالدليل الصريح الوحيد على النسبة إليه قصيدة لابنه لطف الله مهندس كُتبت بعد وفاته."
  en: "Ustad Ahmad Lahori (c. 1580 – 1649), also known as Ahmad Mi'mar, was an architect and engineer in the service of the Mughal emperor Shah Jahan. Shah Jahan's official chronicle names him, together with Ustad Hamid, among the architects of the Red Fort in Delhi (1639-1648). He is widely described as the architect of the Taj Mahal in Agra, but the identity of the Taj Mahal's architect is not definitely known; the only explicit evidence for the attribution to Ahmad is a poem by his son Lutfullah Muhandis, written after Ahmad's death."
  ur: "استاد احمد لاہوری (تقریباً 1580ء – 1649ء)، جنھیں احمد معمار بھی کہا جاتا ہے، مغل شہنشاہ شاہ جہاں کے معمار اور انجینئر تھے۔ شاہ جہاں کی سرکاری تواریخ انھیں استاد حمید کے ساتھ دہلی کے لال قلعے (1639ء–1648ء) کے معماروں میں شمار کرتی ہیں۔ انھیں عموماً آگرہ کے تاج محل کا معمار بیان کیا جاتا ہے، لیکن تاج محل کے معمار کی شناخت یقینی طور پر معلوم نہیں؛ اس نسبت کا واحد صریح ثبوت ان کے بیٹے لطف اللہ مہندس کی ایک نظم ہے جو احمد کی وفات کے بعد لکھی گئی۔"

