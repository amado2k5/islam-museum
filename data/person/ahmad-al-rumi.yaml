gender: male
summary:
  ar: أحمد بن عبد القادر الرومي القبرسي، متصوف رومي، صاحب «مجالس الأبرار ومسالك الأخيار» شرح مئة حديث في مئة مجلس، توفي سنة 1043هـ.
  en: Ahmad ibn Abd al-Qadir al-Rumi al-Qubrusi, a Sufi of the Rum lands, author of Majalis al-Abrar wa Masalik al-Akhyar, an explanation of one hundred hadiths in one hundred sessions, d. 1043 AH.
  fr: "Ahmad ibn Abd al-Qadir al-Rumi al-Qubrusi, soufi des terres de Rum, auteur de Majalis al-Abrar wa Masalik al-Akhyar, explication de cent hadiths en cent séances ; mort en 1043 H."
  es: "Ahmad ibn Abd al-Qadir al-Rumi al-Qubrusi, un sufí de las tierras de Rum, autor de Majalis al-Abrar wa Masalik al-Akhyar, una explicación de cien hadices en cien sesiones, d. 1043 h."
  ur: "احمد بن عبد القادر الرومی القبروسی، روم کے ایک صوفی، مجالس الابرار و مسالک الاخیار کے مصنف، ایک سو سیشن میں ایک سو احادیث کی تفسیر، د. 1043ھ۔"
  tr: "Romalı bir sufi olan ve \"Majalis al-Abrar wa Masalik al-Akhyar\" (Salihlerin Meclisleri ve İyiliğin Yolları) adlı eserin yazarı Ahmed ibn Abd al-Qadir al-Rumi al-Qubrusi, yüz hadisi yüz oturumda açıklamış olup, Hicri 1043 yılında vefat etmiştir."
  id: "Ahmad ibn Abd al-Qadir al-Rumi al-Qubrusi, seorang Sufi Romawi, penulis \"Majalis al-Abrar wa Masalik al-Akhyar\" (Majelis Orang-orang Saleh dan Jalan-jalan Kebaikan), yang menjelaskan seratus hadits dalam seratus sesi, wafat pada tahun 1043 Hijriah."
