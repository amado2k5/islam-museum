summary:
  ar: "أبو الحجاج يوسف بن محمد الموفق المعروف بابن الخلال، صاحب ديوان الإنشاء بمصر في دولة الحافظ أبي الميمون عبد المجيد العبيدي ومن بعده؛ وصفه عماد الدين الأصبهاني بأنه «ناظر مصر وإنسان ناظره وجامع مفاخره» وكان إليه الإنشاء وله قوة على الترسل يكتب كما يشاء؛ وحدث القاضي الفاضل عبد الرحيم بن علي البيساني أنه حين قدم ديوان المكاتبات غلاماً وسأله ابن الخلال ما الذي أعددت لفن الكتابة من الآلات قال ليس عندي سوى حفظ القرآن وكتاب الحماسة فقال في هذا بلاغ وأمره بملازمته ثم بتحليل شعر الحماسة فحلله مرتين — وشكك ابن خلكان في الرواية لأن القاضي الفاضل لم يدخل مصر إلا في أيام الظافر بن الحافظ {cite:wafayat-ayan p. 219-220}. وعاش كثيراً وعطل في آخر عمره وأضر ولزم بيته حتى مات في جمادى الآخرة سنة ست وستين وخمسمائة {cite:wafayat-ayan p. 219, 224}."
  en: "al-Muwaffaq 'Ibn al-Khallal' — Fatimid head of the diwan al-insha' under al-Hafiz, called by Imad al-Din 'Egypt's eye and the pupil of its eye'; the al-Qadi al-Fadil anecdote has him admitting the boy on the strength of the Qur'an and the Hamasa alone and making him parse the Hamasa twice; he outlived his faculties and died 23 Jumada II 566 {cite:wafayat-ayan p. 219-224}."
  es: "al-Muwaffaq 'Ibn al-Khallal' — jefe fatimí del diwan al-insha' bajo al-Hafiz, llamado por Imad al-Din 'el ojo de Egipto y la pupila de su ojo'; la anécdota de al-Qadi al-Fadil dice que admitió al niño basándose únicamente en el Corán y la Hamasa y le hizo analizar la Hamasa dos veces; sobrevivió a sus facultades y murió el 23 de Jumada II de 566 {cita:wafayat-ayan págs. 219-224}."
  fr: "al-Muwaffaq 'Ibn al-Khallal' — chef fatimide du diwan al-insha' sous al-Hafiz, appelé par Imad al-Din « l'œil de l'Égypte et la pupille de son œil »; l'anecdote d'al-Qadi al-Fadil raconte qu'il admit le garçon sur la seule base du Coran et du Hamasa et lui fit analyser le Hamasa deux fois; il survécut à ses facultés et mourut le 23 Jumada II 566 {cite:wafayat-ayan p. 219-224}."
  ur: "الموفق 'ابن الخلال' - الحافظ کے ماتحت دیوان الانشا کا فاطمی سربراہ، جسے عماد الدین 'مصر کی آنکھ اور اس کی آنکھ کی پتلی' کہتے ہیں۔ القدی الفاضل کے قصے میں اس نے صرف قرآن اور حماسہ کی طاقت پر لڑکے کو تسلیم کیا اور اسے حماسہ کی دو بار تجزیہ کرائی۔ اس نے اپنی صلاحیتوں کو ختم کیا اور 23 جمادی الثانی 566 میں وفات پائی۔ 219-224}۔"
  tr: "Ebu el-Hacı Yusuf bin Muwaffaq, nam-ı diğer İbn el-Hallal, hadis Ebu el-Maymun Abdül-Majid el-Obaidi döneminde Mısır'da Diwan el-İnşe'nin sahibiydi ve ondan sonra İmaddin el-İsfahani onu 'Mısır'ın gözlemcisi, onu gözlemleyen kişi ve erdemlerinin toplayıcısı' olarak tanımlamıştır. Bestelemede önemli rol oynamış ve istediği gibi aktarma ve yazma gücüne sahipti. Erdemli yargıç Abd al-Rahi ibn Ali el-Baysani, Diwan el-Musabibat'ı genç bir adama sunduğunda ve yazma sanatı için hangi aletler hazırladığını sorduğunda, 'Elimde sadece Kur'an ve el-Hamese kitabı ezberim var.' dediğini anlattı. O da ona eşlik etmesini, ardından iki kez analiz ettiği el-Hamasa'nın şiirini analiz etmesini emretti. — İbn Hallikan rivayete şüpheyle yaklaştı çünkü erdemli hakim Mısır'a sadece el-Zafir bin Hafız dönemlerinde girdi {alıntı:Wafayat-Ayan s. 219-220}. Uzun bir hayat yaşadı, hayatının son yıllarında engelli oldu, zarar gördü ve beş yüz altmış altıncı yılda Jumada al-Akhirah'da ölene kadar evde kaldı {cite:wafayat-ayan s. 219, 224}."
  id: "Abu al-Hajjaj Yusuf ibn Muhammad al-Muwaffaq, yang dikenal sebagai Ibn al-Khallal, pemilik Diwan al-Insha di Mesir pada masa hadis Abu al-Maymun Abd al-Majid al-Obaidi dan setelahnya, Imad al-Din al-Isfahani menggambarkannya sebagai 'pengamat Mesir, orang yang mengamatinya, dan pengumpul kebajikannya.' Ia berperan penting dalam menulis dan memiliki kekuatan untuk menyampaikan dan menulis sesuai keinginannya. Hakim yang berbudi luhur Abd al-Isfahani -Rahim ibn Ali al-Baysani menceritakan bahwa ketika ia menyerahkan Diwan al-Musabibat kepada seorang pemuda dan bertanya alat apa yang telah ia siapkan untuk seni menulis, ia berkata: 'Saya hanya memiliki hafalan Al-Qur'an dan kitab al-Hamasah.' Ia menjawab dan memerintahkannya untuk menemaninya, lalu menganalisis puisi al-Hamasa, yang ia analisis dua kali. — Ibn Khallikan meragukan riwayat itu karena hakim yang berbudi luhur tidak masuk ke Mesir kecuali pada masa al-Zafir ibn al-Hafiz {sitip:' Wafayat-Ayan hlm. 219-220}. Ia menjalani hidup yang panjang, menjadi cacat di tahun-tahun terakhir hidupnya, mengalami luka-luka, dan tinggal di rumah hingga meninggal di Jumada al-Akhirah pada tahun lima ratus enam puluh enam {cite:wafayat-ayan hlm. 219, 224}."
