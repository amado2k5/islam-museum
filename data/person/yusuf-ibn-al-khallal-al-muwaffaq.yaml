summary:
  ar: "أبو الحجاج يوسف بن محمد الموفق المعروف بابن الخلال، صاحب ديوان الإنشاء بمصر في دولة الحافظ أبي الميمون عبد المجيد العبيدي ومن بعده؛ وصفه عماد الدين الأصبهاني بأنه «ناظر مصر وإنسان ناظره وجامع مفاخره» وكان إليه الإنشاء وله قوة على الترسل يكتب كما يشاء؛ وحدث القاضي الفاضل عبد الرحيم بن علي البيساني أنه حين قدم ديوان المكاتبات غلاماً وسأله ابن الخلال ما الذي أعددت لفن الكتابة من الآلات قال ليس عندي سوى حفظ القرآن وكتاب الحماسة فقال في هذا بلاغ وأمره بملازمته ثم بتحليل شعر الحماسة فحلله مرتين — وشكك ابن خلكان في الرواية لأن القاضي الفاضل لم يدخل مصر إلا في أيام الظافر بن الحافظ {cite:wafayat-ayan p. 219-220}. وعاش كثيراً وعطل في آخر عمره وأضر ولزم بيته حتى مات في جمادى الآخرة سنة ست وستين وخمسمائة {cite:wafayat-ayan p. 219, 224}."
  en: "al-Muwaffaq 'Ibn al-Khallal' — Fatimid head of the diwan al-insha' under al-Hafiz, called by Imad al-Din 'Egypt's eye and the pupil of its eye'; the al-Qadi al-Fadil anecdote has him admitting the boy on the strength of the Qur'an and the Hamasa alone and making him parse the Hamasa twice; he outlived his faculties and died 23 Jumada II 566 {cite:wafayat-ayan p. 219-224}."
