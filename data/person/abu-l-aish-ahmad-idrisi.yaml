summary:
  ar: "بطاقة أولية لأبي العيش أحمد بن القاسم كنون الإدريسي، أمير الأدارسة بالمغرب في أربعينيات القرن الرابع الهجري، توفي سنة ٩٥٤م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu al-Aysh Ahmad ibn al-Qasim Kannun, the Idrisid emir of Morocco in the 940s, d. 954; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abu al-Aysh Ahmad ibn al-Qasim Kannun, el emir idrisí de Marruecos en la década de 940, fallecido en 954; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de projet pour Abu al-Aysh Ahmad ibn al-Qasim Kannun, l'émir idrisside du Maroc dans les années 940, mort en 954; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "940 کی دہائی میں مراکش کے ادریسی امیر ابو العیش احمد بن القاسم کنون کے لیے ڈرافٹ کارڈ۔ 954; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Hicri 4. yüzyılın kırklı yıllarında Fas'taki İdrisiler Emiri olan ve 954 yılında vefat eden Ebu el-Aiş Ahmed ibn el-Kâsım Kanun el-İdrisi'nin ön profili; İslam ülkelerinin sözlüklerinde adı geçmektedir ve biyografisi bu sayfada henüz incelenmemiştir."
  id: "Profil awal Abu al-Aish Ahmad ibn al-Qasim Kanun al-Idrisi, Emir Idrisid di Maroko pada tahun 1840-an Hijriah, yang meninggal pada tahun 954 M; ia disebutkan dalam kamus-kamus negara-negara Islam, dan biografinya belum diulas di halaman ini."
