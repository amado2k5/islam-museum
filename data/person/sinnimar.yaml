id: person/sinnimar
class: person
label: { ar: "سِنِمَّار", en: "Sinnimar", es: "Sinnimar", fr: "Sinnimar", ur: "سنیمار" }
summary:
  ar: "البناء الذي شيّد الخورنق والسدير للنعمان بن امرئ القيس وكملهما في عشرين سنة؛ لما وقف عليه النعمان واستجاده قال له سنمار: «لو شئت أن أجعله يدور مع الشمس لفعلت»، فأمر النعمان بطرحه من أعلى شرفاته فضُرب به المثل: «جزاه جزاء سنمار» {cite:umari-masalik-1924 p. 230}."
  en: "The builder who raised al-Khawarnaq and al-Sadir for al-Nu'man ibn Imri' al-Qays over twenty years; when the king marvelled and feared him, Sinnimar boasted 'had I wished, I could have made it turn with the sun' — and was thrown from its highest balcony, begetting the proverb 'he was repaid Sinnimar's reward' {cite:umari-masalik-1924 p. 230}."
  es: "El constructor que levantó al-Khawarnaq y al-Sadir para al-Nu'man ibn Imri' al-Qays durante veinte años; cuando el rey se maravilló y le temió, Sinnimar se jactó: \"Si hubiera querido, podría haberlo hecho girar con el sol\", y fue arrojado desde su balcón más alto, dando origen al proverbio \"fue recompensado con la misma moneda que Sinnimar\" {cite:umari-masalik-1924 p. 230}."
  fr: "Le constructeur qui a élevé al-Khawarnaq et al-Sadir pour al-Nu'man ibn Imri' al-Qays pendant plus de vingt ans; lorsque le roi s'émerveilla et le craignit, Sinnimar se vanta: « Si je l'avais voulu, j'aurais pu le faire tourner avec le soleil » — et fut jeté de son plus haut balcon, engendrant le proverbe « il a reçu la récompense de Sinnimar » {cite:umari-masalik-1924 p. 230}."
  ur: "وہ بلڈر جس نے نعمان بن عمری القیس کے لیے الخوارنق اور الصدیر کو بیس سال میں اٹھایا۔ جب بادشاہ حیران ہوا اور اس سے خوفزدہ ہوا تو سنیمار نے فخر کیا 'اگر میں چاہتا تو اسے سورج کے ساتھ موڑ دیتا' - اور اسے اس کی سب سے اونچی بالکونی سے پھینک دیا گیا، اس کہاوت کو جنم دیا کہ 'اسے سنیمار کا انعام دیا گیا'۔ 230}۔"
  tr: "Al-Khurnaq ve Al-Sudeir'in yaptığı yapı, Al-Nu'man ibn Imru' Al-Qais tarafından inşa edilmiş ve yirmi yılda tamamlanmıştır; Al-Nu'man yardım istediğinde Sinmar ona şöyle dedi: \"Eğer onu güneşle yörüngede çevirmek isteseydin, yapardım.\" Al-Nu'man, yapıyı üst balkonlarından atmasını emretti ve bunu bir söz olarak kullandı: \"Sinmar'ın ödülü ona verilsin\" {cite:umari-masalik-1924, s. 230}."
  id: "Struktur yang dibangun Al-Khurnaq dan Al-Sudair oleh Al-Nu'man ibn Imru' Al-Qais dan selesai dalam dua puluh tahun; ketika Al-Nu'man datang dan meminta bantuan, Sinmar berkata kepadanya: \"Jika kamu ingin membuatnya mengorbit dengan matahari, aku pasti akan melakukannya.\" Al-Nu'man memerintahkan agar ia dilempar dari balkon atasnya, dan ia menggunakannya sebagai pepatah: \"Semoga ia diberi ganjaran Sinmar\" {cite:umari-masalik-1924, hlm. 230}."
