summary:
  ar: "البناء الذي شيّد الخورنق والسدير للنعمان بن امرئ القيس وكملهما في عشرين سنة؛ لما وقف عليه النعمان واستجاده قال له سنمار: «لو شئت أن أجعله يدور مع الشمس لفعلت»، فأمر النعمان بطرحه من أعلى شرفاته فضُرب به المثل: «جزاه جزاء سنمار» {cite:umari-masalik-1924 p. 230}."
  en: "The builder who raised al-Khawarnaq and al-Sadir for al-Nu'man ibn Imri' al-Qays over twenty years; when the king marvelled and feared him, Sinnimar boasted 'had I wished, I could have made it turn with the sun' — and was thrown from its highest balcony, begetting the proverb 'he was repaid Sinnimar's reward' {cite:umari-masalik-1924 p. 230}."
