summary:
  ar: 'أم المؤمنين، تُلقب أم المساكين لإطعامها إياهم وصدقتها عليهم؛ تزوجها النبي بعد حفصة وأقامت عنده أشهراً ثم ماتت في حياته، وفي زوجها السابق خلاف: عبد الله بن جحش الذي استُشهد بأحد أو الطفيل ثم عبيدة ابنا الحارث.'
  en: 'A Mother of the Believers called ''Umm al-Masakin'' (mother of the poor) for feeding and giving to them; the Prophet married her after Hafsa, she stayed with him some months and died in his lifetime; her earlier husband is disputed: Abdullah
    ibn Jahsh, martyred at Uhud, or al-Tufayl and then Ubayda, sons of al-Harith.'
