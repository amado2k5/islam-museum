summary:
  ar: 'أم المؤمنين، تُلقب أم المساكين لإطعامها إياهم وصدقتها عليهم؛ تزوجها النبي بعد حفصة وأقامت عنده أشهراً ثم ماتت في حياته، وفي زوجها السابق خلاف: عبد الله بن جحش الذي استُشهد بأحد أو الطفيل ثم عبيدة ابنا الحارث.'
  en: 'A Mother of the Believers called ''Umm al-Masakin'' (mother of the poor) for feeding and giving to them; the Prophet married her after Hafsa, she stayed with him some months and died in his lifetime; her earlier husband is disputed: Abdullah
    ibn Jahsh, martyred at Uhud, or al-Tufayl and then Ubayda, sons of al-Harith.'
  ur: "ام المؤمنین، مسکینوں کو کھلانے اور دینے پر «ام المساکین» کہلائی؛ نبی نے حفصہ کے بعد ان سے شادی کی۔"
  es: "Una Madre de los Creyentes llamada 'Umm al-Masakin' (madre de los pobres) por alimentarlos y darles; el Profeta se casó con ella después de Hafsa, ella permaneció con él algunos meses y murió en vida de él; su esposo anterior es objeto de disputa: Abdullah ibn Jahsh, martirizado en Uhud, o al-Tufayl y luego Ubayda, hijos de al-Harith."
  fr: "Une Mère des Croyants appelée 'Umm al-Masakin' (mère des pauvres) pour les avoir nourris et leur avoir donné; le Prophète l'épousa après Hafsa, elle resta avec lui quelques mois et mourut de son vivant; son premier mari est contesté: Abdullah ibn Jahsh, martyrisé à Uhud, ou al-Tufayl puis Ubayda, fils d'al-Harith."
  tr: "Müminlerin annesi, 'Fakirlerin Annesi' lakabını almıştır çünkü onları besler ve sadaka yapardı; Peygamber Hafsa'dan sonra onunla evlendi, aylarca onunla kaldı ve sonra onun yaşamı boyunca öldü. Önceki eşleri arasında farklılıklar vardır: Uhud'da şehit edilen Abdullah ibn Jahsh ya da El-Tufey, o zamanlar Übeyde, El-Harit'in oğlu."
  id: "Ibu para mukmin, dijuluki 'Ibu Orang Miskin' karena ia memberi makan dan memberi sedekah kepada mereka; Nabi menikahinya setelah Hafsa, tinggal bersamanya selama berbulan-bulan, lalu meninggal selama hidupnya. Di antara suami-suami sebelumnya terdapat perbedaan: Abdullah ibn Jahsh, yang menjadi syahid di Uhud, atau Al-Tufayl, kemudian Ubaydah, putra Al-Harith."
