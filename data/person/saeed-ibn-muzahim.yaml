summary:
  ar: 'سعيد بن مزاحم بن أبي مزاحم الأموي، مولى عمر بن عبد العزيز. روى عن أبيه، وعنه
    قتيبة بن سعيد، وأخرج له حديث هرش الكعبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7517} '
  en: 'Sa''id ibn Muzahim ibn Abi Muzahim al-Umawi, a client of Umar ibn Abd al-Aziz.
    He narrated from his father, and Qutayba ibn Sa''id narrated from him; the entry
    notes one hadith for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7517} '
  ur: 'سعید بن مزاحم بن ابی مزاحم اموی، عمر بن عبدالعزیز کے آزاد کردہ؛ اپنے والد سے
    روایت کی، اور ان سے قتیبہ بن سعید نے، اور ان کی ایک حدیث مدخل میں مذکور ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7517} '
