summary:
  ar: 'سعيد بن مزاحم بن أبي مزاحم الأموي، مولى عمر بن عبد العزيز. روى عن أبيه، وعنه
    قتيبة بن سعيد، وأخرج له حديث هرش الكعبي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7517} '
  en: 'Sa''id ibn Muzahim ibn Abi Muzahim al-Umawi, a client of Umar ibn Abd al-Aziz.
    He narrated from his father, and Qutayba ibn Sa''id narrated from him; the entry
    notes one hadith for him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7517} '
  ur: 'سعید بن مزاحم بن ابی مزاحم اموی، عمر بن عبدالعزیز کے آزاد کردہ؛ اپنے والد سے
    روایت کی، اور ان سے قتیبہ بن سعید نے، اور ان کی ایک حدیث مدخل میں مذکور ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.7517} '
  es: "Sa'id ibn Muzahim ibn Abi Muzahim al-Umawi, cliente de Umar ibn Abd al-Aziz. Él narró de su padre, y Qutayba ibn Sa'id narró de él; la entrada señala un hadiz para él. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7517}"
  fr: "Sa'id ibn Muzahim ibn Abi Muzahim al-Umawi, un client d'Umar ibn Abd al-Aziz. Il a raconté de son père, et Qutayba ibn Sa'id a raconté de lui; l'entrée note un hadith pour lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7517}"
  tr: "Ömer bin Abdülaziz'in özgür kalanı Saeed ibn Muzahim ibn Ebi Muzahim el-Umavi. Babasından rivayet etti; babasından Qutaybah ibn Sa'id rivayet edildi ve ayrıca Haş-al-Ka'bi'nin hadislerini de ondan rivayet etti. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7517}"
  id: "Saeed ibn Muzahim ibn Abi Muzahim al-Umawi, mantan Umar ibn Abd al-Aziz. Ia menceritakan dari ayahnya, dari siapa Qutaybah ibn Sa'id diceritakan, dan ia juga menceritakan hadis Hashh al-Ka'bi darinya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7517}"
