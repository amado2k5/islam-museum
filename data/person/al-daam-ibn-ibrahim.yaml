id: person/al-daam-ibn-ibrahim
class: person
label:
  ar: الدعام بن إبراهيم
  en: Al-Da'am ibn Ibrahim
  fr: "Al-Da’am ibn Ibrahim"
  ur: دعام بن ابراہیم
summary:
  ar: من ملوك اليمن المتغلبة كتب إلى الهادي يسأله ولاية البلد الذي هو فيه فاشترط عليه الحكم بكتاب الله وسنة رسوله.
  en: One of the Yemeni rulers who had taken power, who wrote to al-Hadi asking the governorship of the land he held and was told it required ruling by the Book of God and the sunna.
  fr: "L’un des souverains yéménites qui avaient pris le pouvoir, qui écrivit à al-Hadi pour demander le gouvernement du territoire qu’il détenait et reçut pour réponse que cela exigeait de gouverner selon le Livre de Dieu et la sunna."
  ur: یمن کے غالب آنے والے حکمرانوں میں سے ایک جس نے ہادی کو اپنے علاقے کی ولایت کے لیے لکھا اور جسے کتاب اللہ اور سنت کے مطابق حکم کی شرط بتائی گئی۔
