  ar: "عبد الكريم بن أبي العوجاء، مولى من أشهر من نُسب إلى الزندقة في العصر العباسي الأول؛ يذكر المسعودي أنه صنّف في المذاهب المانية والديصانية والمرقونية التي كثر بها الزنادقة، ويعده أحمد أمين في صف من اشتهروا بالزندقة في ذلك العصر مع الحمادين الثلاثة وبشار بن برد وابن المقفع ومطيع بن إياس وصالح بن عبد القدوس {cite:duha-islam p. 139, 149}."
