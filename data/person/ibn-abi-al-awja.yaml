summary:
  ar: "عبد الكريم بن أبي العوجاء، مولى من أشهر من نُسب إلى الزندقة في العصر العباسي الأول؛ يذكر المسعودي أنه صنّف في المذاهب المانية والديصانية والمرقونية التي كثر بها الزنادقة، ويعده أحمد أمين في صف من اشتهروا بالزندقة في ذلك العصر مع الحمادين الثلاثة وبشار بن برد وابن المقفع ومطيع بن إياس وصالح بن عبد القدوس {cite:duha-islam p. 139, 149}."
  en: "Abd al-Karim ibn Abi al-Awja' — the most famous of the accused zindiqs, author (per al-Mas'udi) of works in the Manichaean, Daysanite and Marcionite doctrines {cite:duha-islam p. 139, 149}."
  es: "Abd al-Karim ibn Abi al-Awja' — el más famoso de los zindiqs acusados, autor (según al-Mas'udi) de obras en las doctrinas maniquea, daysanita y marcionita {cite:duha-islam p. 139, 149}."
  fr: "Abd al-Karim ibn Abi al-Awja' — le plus célèbre des zindiqs accusés, auteur (selon al-Mas'udi) d'œuvres dans les doctrines manichéennes, daysanites et marcionites {cite:duha-islam p. 139, 149}."
  ur: "عبد الکریم ابن ابی العوجہ - ملزم زندیقوں میں سب سے مشہور، مانیکیائی، ڈیسانائٹ اور مارکیونائٹ عقائد میں کام کے مصنف ⁦(فی المسعودی)⁩ 139، 149}۔"
  tr: "Abd al-Kerim ibn Abi al-Awja, erken Abbasi döneminde sapkınlığa atfedilen en ünlü özgür kişilerden biridir; al-Mas'udi, sapkın öğretilerin yaygın olduğu Alman, Desanian ve Marquni okulları üzerine eserler yazdığını belirtir. Ahmed Amin, onu o dönemde sapkınlıkla ünlü olanlar arasında sayar: Bashar ibn Burd, İbn al-Muqaffa', Muti' ibn Iyas ve Salih ibn Abd al-Quddus {atı:Duha-Islam, s. 139, 149}."
  id: "Abd al-Karim ibn Abi al-Awja, salah satu mantan budak paling terkenal yang dikaitkan dengan ajaran sesat pada era awal Abbasiyah; al-Mas'udi menyebutkan bahwa ia menulis karya tentang aliran Jerman, Desanian, dan Marquni di mana doktrin sesat tersebar luas. Ahmad Amin menganggapnya sebagai salah satu yang terkenal karena bid'ah pada masa itu bersama tiga Hammad, Bashar ibn Burd, Ibn al-Muqaffa', Muti' ibn Iyas, dan Salih ibn Abd al-Quddus {cite:Duha-Islam, hlm. 139, 149}."
