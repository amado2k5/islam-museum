summary:
  ar: "بطرس بن بولس البستاني (ت ١٨٨٣م)؛ صاحب «دائرة المعارف العربية»، عالم واسع الاطلاع. ولد في إحدى قرى لبنان وقصد بيروت صغيراً فدرس اليونانية والعبرانية والإنكليزية وقرأ مبادئ العلوم، واشتغل بالمطالعة والتأليف، فصنّف «محيط المحيط» في اللغة في مجلدين واختصره باسم «قطر المحيط»، وله «كشف الحجاب» في علم الحساب و«مفتاح المصباح» في النحو. وأنشأ مستعيناً بابنه الأكبر سليم أربع صحف هي «نفير سورية» و«الجنان» و«الجنة» و«الجنينة»، وأعظم آثاره «دائرة المعارف» أكمل منها سبع مجلدات وتولى أبناؤه من بعده إتمامها فطبعوا أربع مجلدات ولم تكمل. توفي في بيروت {cite:al-aalam tarjama}."
  en: "Butrus al-Bustani (d. 1883 CE) — author of the Muhit al-Muhit dictionary and founder of the Arabic encyclopaedia Da'irat al-Ma'arif {cite:al-aalam tarjama}."
