summary:
  ar: "الحسن بن أحمد القرمطي المعروف بالأعصم؛ تغلّب على دمشق قبل سنة ستين وثلاثمائة، وفيها نزل جعفر بن فلاح الكتامي نائب الفاطميين إلى الدكة فوق نهر يزيد بظاهر دمشق فخرج إليه الأعصم وهو عليل فظفر به فأسره وقتله وقتل من أصحابه خلقاً كثيراً يوم الخميس سادس ذي القعدة {cite:shadharat-dhahab p. 29}."
  en: "al-Hasan b. Ahmad al-Qarmati, called al-A'sam — held Damascus before 360, then captured and killed the ailing Fatimid governor Ja'far b. Fallah at the dikka over the Yazid river outside Damascus on Thursday 6 Dhu'l-Qa'da 360 {cite:shadharat-dhahab p. 29}."
  es: "al-Hasan b. Ahmad al-Qarmati, llamado al-A'sam, controló Damasco antes del año 360, luego capturó y mató al enfermo gobernador fatimí Ja'far b. Fallah en la dikka sobre el río Yazid, a las afueras de Damasco, el jueves 6 de Dhu'l-Qa'da de 360 {cite:shadharat-dhahab p. 29}."
  fr: "al-Hasan b. Ahmad al-Qarmati, appelé al-A'sam, a tenu Damas avant 360, puis a capturé et tué le gouverneur fatimide malade Ja'far b. Fallah à la dikka sur la rivière Yazid à l'extérieur de Damas le jeudi 6 Dhu'l-Qa'da 360 {cite:shadharat-dhahab p. 29}."
  ur: "الحسن بی احمد القرماتی، جسے الاعصام کہا جاتا ہے - نے 360 سے پہلے دمشق پر قبضہ کیا، پھر بیمار فاطمی گورنر جعفر بن کو گرفتار کر کے قتل کر دیا۔ 6 ذوالقعدہ 360 بروز جمعرات دمشق کے باہر دریائے یزید کے اوپر دکہ کے مقام پر فلاہ۔ 29}۔"
