summary:
  ar: "حسين سجواني (وُلد سنة 1953 في دبي)، ملياردير إماراتي ومؤسس شركة داماك العقارية سنة 2002 ومجموعة داماك الاستثمارية الخاصة. قدّرت فوربس ثروته بنحو 15.3 مليار دولار سنة 2026. بدأ مسيرته في شركة أبوظبي لصناعات الغاز سنة 1981 ثم أسس مشروعاً للتموين ما يزال يعمل باسم جلوبال لوجيستكس سيرفيسز، وأعلن في كانون الثاني 2025 مع الرئيس الأميركي المنتخب دونالد ترامب استثماراً بقيمة 20 مليار دولار لبناء مراكز بيانات في الولايات المتحدة."
  en: "Hussain Sajwani (born 1953 in Dubai) is an Emirati billionaire businessman and the founder of DAMAC Properties, founded in 2002, and of his private investment company DAMAC Group. Forbes put his net worth at US$15.3 billion in 2026. He began his career at Abu Dhabi Gas Industries in 1981 and founded a catering venture that still operates as Global Logistics Services; in January 2025 he announced, alongside US President-elect Donald Trump, a US$20 billion investment to build data centres across the United States."
  ur: "حسین سجوانی (پیدائش 1953، دبئی) اماراتی ارب پتی تاجر اور 2002 میں قائم ہونے والی داماک پراپرٹیز اور اپنی نجی سرمایہ کاری کمپنی داماک گروپ کے بانی ہیں۔ فوربز نے 2026 میں ان کی دولت کا تخمینہ 15.3 ارب ڈالر لگایا۔ انہوں نے 1981 میں ابوظہبی گیس انڈسٹریز سے اپنے کیریئر کا آغاز کیا اور ایک کیٹرنگ کاروبار قائم کیا جو گلوبل لوجسٹکس سروسز کے نام سے اب بھی چل رہا ہے؛ جنوری 2025 میں انہوں نے امریکی صدر منتخب ڈونلڈ ٹرمپ کے ہمراہ امریکا میں ڈیٹا سینٹرز کی تعمیر کے لیے 20 ارب ڈالر کی سرمایہ کاری کا اعلان کیا۔"

