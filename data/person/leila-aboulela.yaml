summary:
  ar: روائية سودانية بريطانية وُلدت في الخرطوم سنة 1964؛ تكتب بالإنجليزية روايات عن الإيمان والهجرة والحب، منها «المترجم» و«ممرات النور» و«برّ الصدق»، وحازت جائزة كين الجزائرية وجائزة بن بينتر سنة 2025.
  en: Sudanese-British novelist born in Khartoum in 1964; she writes in English about faith, migration and love in novels such as The Translator, Minaret and River Spirit, and won the inaugural PEN Pinter
    Prize in 2025.
  ur: سودانی برطانوی ناول نگار جو 1964 میں خرتوم میں پیدا ہوئی؛ انگریزی میں ایمان، ہجرت اور محبت پر ناول لکھتی ہے جیسے The Translator، Minaret اور River Spirit، اور 2025 میں پہلا PEN Pinter پرائز جیتا۔
  es: "Novelista sudanesa-británica nacida en Jartum en 1964; escribe en inglés sobre la fe, la migración y el amor en novelas como El traductor, Minarete y Espíritu del río, y ganó el primer Premio PEN Pinter en 2025."
  fr: "Romancière soudano-britannique née à Khartoum en 1964; elle écrit en anglais sur la foi, la migration et l'amour dans des romans tels que The Translator, Minaret et River Spirit, et a remporté le premier prix PEN Pinter en 2025."
  tr: "1964 yılında Hartum'da doğmuş Sudanlı-İngiliz romancı; \"The Translator,\" \"Passages of Light\" ve \"The Righteous of Truth\" gibi inanç, göç ve aşk üzerine İngilizce romanlar yazmaktadır. 2025 yılında Cezayir Keen Ödülü ve Ben Pinter Ödülü'nü kazanmıştır."
  id: "Seorang novelis Sudan-Inggris yang lahir di Khartoum pada tahun 1964; ia menulis novel berbahasa Inggris tentang iman, migrasi, dan cinta, termasuk \"The Translator,\" \"Passages of Light,\" dan \"The Righteousness of Truth.\" Ia memenangkan Algerian Keen Prize dan Ben Pinter Prize pada tahun 2025."
