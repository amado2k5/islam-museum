summary:
  ar: "أكاديمي نيجيري وُلد في جيغا سنة 1957، عالم سياسة درّس في جامعة بايرو بكانو وصار نائبا لمستشارها (2005)، وعُرف قبل ذلك رئيسا لنقابة أساتذة الجامعات. ترأس اللجنة الانتخابية الوطنية المستقلة (2010–2015) وأشرف على انتخابات 2011 و2015 التي شهدت أول انتقال ديمقراطي للسلطة إلى المعارضة في نيجيريا. عُيّن سنة 2025 مستشارا خاصا للرئيس تينوبو في إصلاحات الثروة الحيوانية."
  en: "Nigerian academic born in Jega in 1957, a political scientist who taught at Bayero University Kano and became its vice-chancellor in 2005, after earlier prominence as president of the Academic Staff Union of Universities. He chaired the Independent National Electoral Commission (2010–2015), conducting the 2011 and 2015 elections, the latter producing Nigeria's first democratic transfer of power to an opposition party. In 2025 he was appointed Special Adviser to President Tinubu on livestock reforms."
  ur: "نائجریائی ماہرِ تعلیم، 1957 میں جیگا میں پیدا ہوئے؛ سیاسیات کے استاد، بایرو یونیورسٹی کانو میں پڑھایا اور 2005 میں اس کے وائس چانسلر بنے، اس سے پہلے یونیورسٹی اساتذہ کی یونین کے صدر کے طور پر جانے جاتے تھے۔ وہ قومی انتخابی کمیشن کے چیئرمین رہے (2010ء–2015ء) اور 2011 و 2015 کے انتخابات کرائے، جن میں سے موخر الذکر سے نائجریا میں پہلی بار جمہوری طور پر اقتدار حزبِ اختلاف کو منتقل ہوا۔ 2025 میں وہ صدر تینوبو کے خصوصی مشیر برائے اصلاحاتِ مال مویشی مقرر ہوئے۔"
