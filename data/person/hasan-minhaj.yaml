summary:
  ar: "كوميدي وممثل أمريكي من أصل هندي، وُلد في ديفيس بكاليفورنيا سنة 1985 لأبوين مسلمين من عليكرة؛ برز مراسلًا أقدم في «ذا ديلي شو» (2014–2018)، ثم قدّم برنامجه «باتريوت آكت» على نتفليكس (2018–2020) الفائز بجوائز إيمي وبيبودي وويبي، وعروضه الارتجالية المنفردة «الملك العائد» و«مهرّج الملك»."
  en: "American comedian and actor of Indian origin, born in Davis, California, in 1985 to Muslim parents from Aligarh. He rose as a senior correspondent on The Daily Show (2014–2018), then hosted his Netflix show Patriot Act (2018–2020), which won Emmy, Peabody and Webby awards, alongside the stand-up specials Homecoming King and The King's Jester."
  ur: "بھارتی نژاد امریکی مزاح نگار و اداکار، 1985 میں ڈیوس، کیلیفورنیا میں علی گڑھ کے مسلمان والدین کے گھر پیدا ہوئے؛ «دی ڈیلی شو» (2014–2018) میں سینئر نمائندے کے طور پر ابھرے، پھر نیٹ فلکس پر «پیٹریاٹ ایکٹ» (2018–2020) پیش کیا جس نے ایمی، پی باڈی اور ویبی ایوارڈز جیتے۔"
  es: "Comediante y actor estadounidense de origen indio, nacido en Davis, California, en 1985 de padres musulmanes de Aligarh. Se dio a conocer como corresponsal sénior en The Daily Show (2014-2018), y posteriormente presentó su programa de Netflix Patriot Act (2018-2020), que ganó premios Emmy, Peabody y Webby, además de los especiales de comedia Homecoming King y The King's Jester."
  fr: "Humoriste et acteur américain d'origine indienne, né à Davis, en Californie, en 1985 de parents musulmans originaires d'Aligarh. Il s'est fait connaître comme correspondant principal du Daily Show (2014-2018), puis a animé sa propre émission sur Netflix, Patriot Act (2018-2020), qui a remporté des Emmy Awards, des Peabody Awards et des Webby Awards, ainsi que ses spectacles d'humour Homecoming King et The King's Jester."
  tr: "Hint kökenli Amerikalı komedyen ve oyuncu, 1985 yılında Davis, Kaliforniya'da Alikra'dan Müslüman ebeveynlerin çocuğu olarak doğdu; The Daily Show'da kıdemli muhabir olarak ortaya çıktı (2014–2018), ardından Netflix'te Emmy, Peabody ve Webby kazanan \"Patriot Act\" adlı programını sundu ve ayrıca solo doğaçlamaları \"The Returning King\" ve \"The King's Clown\" ile birlikte sundu."
  id: "Seorang komedian dan aktor Amerika keturunan India, lahir di Davis, California pada tahun 1985 dari orang tua Muslim asal Alikra; ia muncul sebagai reporter senior di The Daily Show (2014–2018), lalu membawakan acaranya \"Patriot Act\" di Netflix (2018–2020), yang memenangkan Emmy, Peabody, dan Webby, serta improvisasi solonya \"The Returning King\" dan \"The King's Clown.\""
