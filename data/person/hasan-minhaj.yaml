  ar: "كوميدي وممثل أمريكي من أصل هندي، وُلد في ديفيس بكاليفورنيا سنة 1985 لأبوين مسلمين من عليكرة؛ برز مراسلًا أقدم في «ذا ديلي شو» (2014–2018)، ثم قدّم برنامجه «باتريوت آكت» على نتفليكس (2018–2020) الفائز بجوائز إيمي وبيبودي وويبي، وعروضه الارتجالية المنفردة «الملك العائد» و«مهرّج الملك»."
  en: "American comedian and actor of Indian origin, born in Davis, California, in 1985 to Muslim parents from Aligarh. He rose as a senior correspondent on The Daily Show (2014–2018), then hosted his Netflix show Patriot Act (2018–2020), which won Emmy, Peabody and Webby awards, alongside the stand-up specials Homecoming King and The King's Jester."
