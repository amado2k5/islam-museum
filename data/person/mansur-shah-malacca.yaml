summary:
  ar: "سلطان منصور شاه ⁦(ت. 1477)⁩، سادس سلاطين ملقا وابن مظفر شاه. وُلد باسم راجا عبد الله وخلف أباه سنة 1459 فحكم حتى 1477، وبلغت ملقا في عهده أقصى اتساعها في شبه جزيرة الملايو وشرق سومطرة، وخفّض ضرائب التجارة فازدهر ميناؤها. وكان ذا اهتمام شخصي بالإسلام: درس التصوف على مولانا أبي بكر، وأمر بترجمة كتاب دار المنظوم إلى الملايوية، واستشار علماء فاساي في مسائل الدين. نقش شاهد قبره يؤرخ وفاته برجب 882هـ، وله قراءة منافسة تجعلها 880هـ."
  en: "Sultan Mansur Shah (d. 1477), sixth sultan of Malacca and son of Muzaffar Shah. Born Raja Abdullah, he succeeded his father in 1459 and ruled until 1477, bringing Malacca to its greatest extent across the Malay Peninsula and eastern Sumatra, and lowered trade taxes so that its port flourished. He took a personal interest in Islam: he studied Sufism under Maulana Abu Bakar, ordered the Darul Manzum translated into Malay, and consulted the scholars of Pasai on religious questions. His tombstone inscription dates his death to Rajab 882 AH, with a rival reading of 880 AH."
  ur: "سلطان منصور شاہ ⁦(وفات 1477ء)⁩، ملاکا کے چھٹے سلطان اور مظفر شاہ کے بیٹے۔ وہ راجا عبد اللہ کے نام سے پیدا ہوئے اور 1459ء میں اپنے والد کے جانشین بن کر 1477ء تک حکمران رہے؛ ان کے عہد میں ملاکا جزیرہ نما ملایا اور مشرقی سماٹرا میں اپنی وسیع ترین حد کو پہنچی اور تجارتی محصولات میں کمی سے اس کی بندرگاہ پھلی پھولی۔ انھیں اسلام سے ذاتی دلچسپی تھی: انھوں نے مولانا ابو بکر سے تصوف کی تعلیم حاصل کی، کتاب دار المنظوم کا ملائی ترجمہ کرایا اور دینی مسائل میں پاسائی کے علما سے مشورہ کیا۔ ان کے مزار کے کتبے میں ان کی وفات رجب 882ھ درج ہے، جس کی ایک مقابل قراءت 880ھ بھی ہے۔"
  es: "El sultán Mansur Shah (fallecido en 1477), sexto sultán de Malaca e hijo de Muzaffar Shah, nació como Raja Abdullah. Sucedió a su padre en 1459 y gobernó hasta 1477, extendiendo el imperio de Malaca a lo largo de la península malaya y el este de Sumatra, y reduciendo los impuestos comerciales para que su puerto prosperara. Se interesó personalmente por el islam: estudió sufismo con Maulana Abu Bakar, ordenó la traducción del Darul Manzum al malayo y consultó a los eruditos de Pasai sobre cuestiones religiosas. La inscripción de su lápida fecha su muerte en Rajab 882 AH, aunque existe una lectura alternativa que la sitúa en 880 AH."
  fr: "Le sultan Mansur Shah (mort en 1477), sixième sultan de Malacca et fils de Muzaffar Shah, né Raja Abdullah, succéda à son père en 1459 et régna jusqu'en 1477. Sous sa présidence, Malacca atteignit son apogée en s'étendant sur la péninsule malaise et l'est de Sumatra, et son port prospéra grâce à une baisse des taxes commerciales. Il s'intéressa personnellement à l'islam: il étudia le soufisme auprès de Maulana Abu Bakar, ordonna la traduction du Darul Manzum en malais et consulta les érudits de Pasai sur des questions religieuses. L'inscription funéraire date sa mort de Rajab 882 AH, une autre version mentionnant 880 AH."
  tr: "Sultan Mansur Şah (ö. 1477), Malakka'nın altıncı sultanı ve Muzaffar Şah'ın oğlu. Raja Abdullah adıyla doğdu ve 1459'da babasının yerine geçti, 1477'ye kadar hüküm sürdü. Saltanatı sırasında Malakka en geniş yayılımını Malay Yarımadası ve Doğu Sumatra'da gerçekleştirdi, ticaret vergileri azaltıldı ve limanı refah kazandı. İslam'a kişisel bir ilgisi vardı: Mawlana Abu Bakr'ın yanında tasavvuf çalıştı, Dar al-Manzum'un Malaycaya çevrilmesini emretti ve dini konularda Vasay âlimlerine danıştı. Mezar taşındaki yazıt, ölümünü 882 Hicri Recep'e tarihlendirir ve 880 Hicri yılına tarihlenen rakip bir okuma vardır."
  id: "Sultan Mansur Shah (wafat 1477), Sultan Malaka keenam dan putra Muzaffar Shah. Ia lahir dengan nama Raja Abdullah dan menggantikan ayahnya pada tahun 1459, memerintah hingga 1477. Selama masa pemerintahannya, Malaka mencapai jangkauan terbesar di Semenanjung Melayu dan Sumatra Timur, dan pajak perdagangan dikurangi, sehingga pelabuhannya makmur. Ia memiliki minat pribadi pada Islam: ia mempelajari Sufisme di bawah Mawlana Abu Bakr, memerintahkan penerjemahan Dar al-Manzum ke dalam bahasa Melayu, dan berkonsultasi dengan ulama Vasay mengenai isu agama. Prasasti di batu nisannya mencatat kematiannya pada Rajab 882 H, dan ia memiliki bacaan yang bersaing yang memperkirakan bahwa ia berasal dari tahun 880 H."

