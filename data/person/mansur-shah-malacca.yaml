  note: "Died in 1477: so the English article's lead and Wikidata's single death value (+1477), and the Malay article gives October 1477. The Hijri year recorded is the one his tombstone inscription itself carries in the decipherment published by Moquette and Winstedt — Wednesday in Rajab 882 AH, which falls in 1477. A rival decipherment of the same stones, Hervey's, reads Rajab 880 AH (1475), the figure in the title of Winstedt's 1918 paper; that variant is preserved here, and the 1477/882 pairing is the one the standard accounts keep."
