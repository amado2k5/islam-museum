summary:
  ar: "سلطان منصور شاه (ت. 1477)، سادس سلاطين ملقا وابن مظفر شاه. وُلد باسم راجا عبد الله وخلف أباه سنة 1459 فحكم حتى 1477، وبلغت ملقا في عهده أقصى اتساعها في شبه جزيرة الملايو وشرق سومطرة، وخفّض ضرائب التجارة فازدهر ميناؤها. وكان ذا اهتمام شخصي بالإسلام: درس التصوف على مولانا أبي بكر، وأمر بترجمة كتاب دار المنظوم إلى الملايوية، واستشار علماء فاساي في مسائل الدين. نقش شاهد قبره يؤرخ وفاته برجب 882هـ، وله قراءة منافسة تجعلها 880هـ."
  en: "Sultan Mansur Shah (d. 1477), sixth sultan of Malacca and son of Muzaffar Shah. Born Raja Abdullah, he succeeded his father in 1459 and ruled until 1477, bringing Malacca to its greatest extent across the Malay Peninsula and eastern Sumatra, and lowered trade taxes so that its port flourished. He took a personal interest in Islam: he studied Sufism under Maulana Abu Bakar, ordered the Darul Manzum translated into Malay, and consulted the scholars of Pasai on religious questions. His tombstone inscription dates his death to Rajab 882 AH, with a rival reading of 880 AH."
  ur: "سلطان منصور شاہ (وفات 1477ء)، ملاکا کے چھٹے سلطان اور مظفر شاہ کے بیٹے۔ وہ راجا عبد اللہ کے نام سے پیدا ہوئے اور 1459ء میں اپنے والد کے جانشین بن کر 1477ء تک حکمران رہے؛ ان کے عہد میں ملاکا جزیرہ نما ملایا اور مشرقی سماٹرا میں اپنی وسیع ترین حد کو پہنچی اور تجارتی محصولات میں کمی سے اس کی بندرگاہ پھلی پھولی۔ انھیں اسلام سے ذاتی دلچسپی تھی: انھوں نے مولانا ابو بکر سے تصوف کی تعلیم حاصل کی، کتاب دار المنظوم کا ملائی ترجمہ کرایا اور دینی مسائل میں پاسائی کے علما سے مشورہ کیا۔ ان کے مزار کے کتبے میں ان کی وفات رجب 882ھ درج ہے، جس کی ایک مقابل قراءت 880ھ بھی ہے۔"

