summary:
  ar: "صحابي بعثه عتاب بن أسيد إلى النبي في حاجة وهو واقف بعرفة في حجة الوداع، فوقف تحت ناقته ولغامها يقع على رأسه فسمعه يقول: لا تجوز وصية لوارث، والولد للفراش وللعاهر الحجر؛ يرويه ابن إسحاق عن ليث بن أبي سليم عن شهر بن حوشب عنه."
  en: "A Companion whom Attab ibn Asid sent to the Prophet on an errand while he stood at Arafat in the Farewell Pilgrimage; he stood under the Prophet's camel with its foam falling on his head and heard him say that no bequest is valid for an heir, the child belongs to the bed and the adulterer gets the stone; Ibn Ishaq has it from Layth ibn Abi Sulaym from Shahr ibn Hawshab from him."
