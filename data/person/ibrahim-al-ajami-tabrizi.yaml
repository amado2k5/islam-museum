summary:
  ar: "إبراهيم العجمي نزيل مصر؛ كان رقيقاً للشيخ دمرداش والشيخ شاهين في الطريق على سيدي عمر روشني بتبريز، ثم دخل مصر في دولة ابن عثمان وأقام بمدرسة بباب زويلة فحصل له القبول التام وأخذ عنه خلق كثير من الأعاجم والأروام، وكان يفسر القرآن العظيم ويقرئ في رسائل القوم مدة طويلة حتى وُشي به إلى السلطان لكثرة مريديه وأتباعه وقيل له تُخشى أن يملك مصر، فطلبه السلطان إلى الروم بسبب ذلك ثم رجع إلى مصر وطرد من كان عنده من المريدين والأتباع امتثالاً لأمر السلطان؛ ثم بنى له تكية مقابل المؤيدية وجعل له فيها مدفناً وبنى حوله خلاوي للفقراء، وكان له يد طولى في المعقولات وعلم الكلام ونظم تائية جمع فيها معالم الطريق، وكان ينهى جماعته أن يحج الواحد منهم حتى يعرف الله المعرفة الخاصة عند القوم؛ توفي بمصر سنة أربعين وتسعمائة {cite:shadharat-dhahab p. 587}."
  en: "The Tabrizi Sufi of the 'Umar Rawsani line — at Bab Zuwayla's madrasa he interpreted the Qur'an and taught the brethren's epistles until his murids grew so numerous the sultan was told 'he may yet take Egypt'; summoned to Rum, sent back and ordered to disperse his followers, he received a takiyya facing the Mu'ayyadiyya with khalawi for the poor; his rule: no disciple performs hajj until he knows God; d. Cairo 940 {cite:shadharat-dhahab p. 587}."
  es: "El sufí de Tabriz, de la línea de 'Umar Rawsani, en la madrasa de Bab Zuwayla interpretó el Corán y enseñó las epístolas de los hermanos hasta que sus murids se hicieron tan numerosos que se le dijo al sultán que \"aún podría tomar Egipto\"; convocado a Rum, enviado de vuelta y con la orden de dispersar a sus seguidores, recibió una takiyya frente a los Mu'ayyadiyya con khalawi para los pobres; su regla: ningún discípulo realiza el hajj hasta que conoce a Dios; murió en El Cairo en 940 {cita: shadharat-dhahab p. 587}."
  fr: "Le soufi de Tabriz, de la lignée d'Umar Rawsani, interpréta le Coran et enseigna les épîtres des frères à la madrasa de Bab Zuwayla jusqu'à ce que ses disciples soient si nombreux que le sultan fut informé qu'il pourrait conquérir l'Égypte. Convoqué à Rum, renvoyé et sommé de disperser ses fidèles, il reçut une takiyya face à la Mu'ayyadiyya, assortie d'une khalawi pour les pauvres. Sa règle: aucun disciple n'accomplit le hajj avant de connaître Dieu. Il mourut au Caire en 940."
  ur: "تبریزی صوفی عمر رسانی سلسلہ - باب زاویلہ کے مدرسے میں اس نے قرآن کی تشریح کی اور بھائیوں کے خطوط پڑھائے یہاں تک کہ اس کے مریدوں کی تعداد اتنی بڑھ گئی کہ سلطان کو کہا گیا کہ 'وہ ابھی مصر لے سکتا ہے'۔ اسے روم میں بلایا گیا، واپس بھیجا گیا اور اپنے پیروکاروں کو منتشر کرنے کا حکم دیا، اس نے معاویہ کے سامنے غریبوں کے لیے خلوی کے ساتھ ایک تکیہ وصول کیا۔ اس کا قاعدہ: کوئی شاگرد اس وقت تک حج نہیں کرتا جب تک کہ وہ خدا کو نہ پہچان لے۔ d قاہرہ 940 {حوالہ: شدارت ذہاب ص۔ 587}۔"
