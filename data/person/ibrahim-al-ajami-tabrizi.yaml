summary:
  ar: "إبراهيم العجمي نزيل مصر؛ كان رقيقاً للشيخ دمرداش والشيخ شاهين في الطريق على سيدي عمر روشني بتبريز، ثم دخل مصر في دولة ابن عثمان وأقام بمدرسة بباب زويلة فحصل له القبول التام وأخذ عنه خلق كثير من الأعاجم والأروام، وكان يفسر القرآن العظيم ويقرئ في رسائل القوم مدة طويلة حتى وُشي به إلى السلطان لكثرة مريديه وأتباعه وقيل له تُخشى أن يملك مصر، فطلبه السلطان إلى الروم بسبب ذلك ثم رجع إلى مصر وطرد من كان عنده من المريدين والأتباع امتثالاً لأمر السلطان؛ ثم بنى له تكية مقابل المؤيدية وجعل له فيها مدفناً وبنى حوله خلاوي للفقراء، وكان له يد طولى في المعقولات وعلم الكلام ونظم تائية جمع فيها معالم الطريق، وكان ينهى جماعته أن يحج الواحد منهم حتى يعرف الله المعرفة الخاصة عند القوم؛ توفي بمصر سنة أربعين وتسعمائة {cite:shadharat-dhahab p. 587}."
  en: "The Tabrizi Sufi of the 'Umar Rawsani line — at Bab Zuwayla's madrasa he interpreted the Qur'an and taught the brethren's epistles until his murids grew so numerous the sultan was told 'he may yet take Egypt'; summoned to Rum, sent back and ordered to disperse his followers, he received a takiyya facing the Mu'ayyadiyya with khalawi for the poor; his rule: no disciple performs hajj until he knows God; d. Cairo 940 {cite:shadharat-dhahab p. 587}."
