  ar: "شيخ برازيلي من أصل عربي، وُلد في سوريا وهاجر طفلًا إلى البرازيل، ودرس العلوم الشرعية أحد عشر عامًا في الجامعة الإسلامية بالمدينة المنورة. يعمل في الدعوة منذ عقود، وهو مستشار ديني لرابطة الفقهاء الإسلاميين ⁦(ANAJI)⁩ ونائب رئيس اتحاد المؤسسات الإسلامية، ويظهر في الإعلام البرازيلي حديثًا عن الإسلام."
  en: "Brazil-based sheikh of Arab origin, born in Syria and brought to Brazil as a child; he studied Islamic theology for eleven years at the Islamic University of Madinah. Active in da'wah for decades, he is religious adviser to ANAJI ⁦(the National Association of Islamic Jurists)⁩ and vice-president of the national union of Islamic entities, appearing in Brazilian media to speak about Islam."
  ur: "عرب نژاد برازیلی شیخ جو سوریہ میں پیدا ہوئے اور بچپن میں برازیل آئے؛ انہوں نے مدینہ کی اسلامی یونیورسٹی میں گیارہ سال علوم شرعیہ پڑھے۔ وہ دہائیوں سے دعوت میں مصروف ہیں، ماہرین فقہ کی قومی انجمن ⁦(ANAJI)⁩ کے مذہبی مشیر اور اسلامی اداروں کی قومی یونین کے نائب صدر ہیں، اور برازیلی میڈیا میں اسلام پر بات کرتے ہیں۔"
