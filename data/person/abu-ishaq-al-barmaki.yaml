summary:
  ar: "أبو إسحاق إبراهيم بن عمر بن أحمد البرمكي ⁦(361–445هـ)⁩، فقيه حنبلي بغدادي من تلاميذ أبي بكر القطيعي، روى عنه «فضائل الصحابة» لأحمد بن حنبل، وقوبلت النسخة الخطية الفريدة للكتاب على نسخته؛ قال ابن أبي يعلى إنه كان ناسكاً زاهداً فقيهاً قيماً بالفرائض، وله حلقة بجامع المنصور."
  en: "Abu Ishaq Ibrahim ibn Umar ibn Ahmad al-Barmaki (361–445 AH), a Hanbali jurist of Baghdad and pupil of Abu Bakr al-Qati'i, through whom Ahmad ibn Hanbal's Fada'il al-Sahaba was transmitted; the book's unique manuscript was collated with his copy. Ibn Abi Ya'la describes him as devout, ascetic, a jurist expert in inheritance law, with a circle in the Mansur mosque."
