summary:
  ar: "أبو إسحاق إبراهيم بن عمر بن أحمد البرمكي ⁦(361–445هـ)⁩، فقيه حنبلي بغدادي من تلاميذ أبي بكر القطيعي، روى عنه «فضائل الصحابة» لأحمد بن حنبل، وقوبلت النسخة الخطية الفريدة للكتاب على نسخته؛ قال ابن أبي يعلى إنه كان ناسكاً زاهداً فقيهاً قيماً بالفرائض، وله حلقة بجامع المنصور."
  en: "Abu Ishaq Ibrahim ibn Umar ibn Ahmad al-Barmaki (361–445 AH), a Hanbali jurist of Baghdad and pupil of Abu Bakr al-Qati'i, through whom Ahmad ibn Hanbal's Fada'il al-Sahaba was transmitted; the book's unique manuscript was collated with his copy. Ibn Abi Ya'la describes him as devout, ascetic, a jurist expert in inheritance law, with a circle in the Mansur mosque."
  fr: "Abu Ishaq Ibrahim ibn Umar ibn Ahmad al-Barmaki (361–445 H), juriste hanbalite de Bagdad et élève d'Abu Bakr al-Qati'i, par qui furent transmis les Fada'il al-Sahaba d'Ahmad ibn Hanbal ; l'unique manuscrit du livre fut collationné avec sa copie. Ibn Abi Ya'la le décrit comme pieux, ascète, juriste expert en droit successoral, et tenant un cercle dans la mosquée d'al-Mansur."
  es: "Abu Ishaq Ibrahim ibn Umar ibn Ahmad al-Barmaki (361–445 AH), jurista hanbalí de Bagdad y discípulo de Abu Bakr al-Qati'i, transmitió la obra Fada'il al-Sahaba de Ahmad ibn Hanbal; el manuscrito original de este libro fue cotejado con su copia. Ibn Abi Ya'la lo describe como un hombre devoto, asceta y experto en derecho sucesorio, con un círculo de seguidores en la mezquita de Mansur."
  ur: "ابو اسحاق ابراہیم بن عمر بن احمد البرمکی ⁦(361-445 ہجری)⁩، بغداد کے حنبلی فقیہ اور ابو بکر القطی کے شاگرد، جن کے ذریعے احمد بن حنبل کی فدائیل الصحابہ منتقل ہوئی؛ کتاب کا منفرد مخطوطہ اس کی کاپی کے ساتھ ملایا گیا تھا۔ ابن ابی یعلی نے اسے ایک متقی، سنیاسی، وراثت کے قانون میں ماہر فقیہ کے طور پر بیان کیا ہے، جس کا مسجد منصور میں ایک حلقہ ہے۔"
  tr: "Bağdatlı Hanbeli hukukçu Ebu İshak İbrahim ibn Ömer ibn Ahmed el-Barmaki (361-445 Hicri), Ebu Bekr el-Kati'i'nin öğrencilerinden biriydi. Ahmed ibn Hanbel'in \"Sahabelerin Faziletleri\" adlı eserini ondan rivayet etmiş ve kitabın eşsiz el yazması nüshası onun nüshasıyla karşılaştırılmıştır. İbn Abi Ya'la, onun bir zahit, dindar bir hukukçu ve miras hukuku konusunda uzman olduğunu ve Mansur Camii'nde bir cemaati olduğunu söylemiştir."
  id: "Abu Ishaq Ibrahim ibn Umar ibn Ahmad al-Barmaki (361–445 H), seorang ahli hukum Hanbali dari Baghdad, adalah salah satu murid Abu Bakr al-Qati’i. Ia meriwayatkan kitab “Keutamaan Para Sahabat” karya Ahmad ibn Hanbal darinya, dan salinan manuskrip unik kitab tersebut dibandingkan dengan salinannya. Ibn Abi Ya’la mengatakan bahwa ia adalah seorang pertapa, seorang ahli hukum yang taat, dan ahli dalam hukum warisan, serta memiliki kelompok belajar di Masjid al-Mansur."
