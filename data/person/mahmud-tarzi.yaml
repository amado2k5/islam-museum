summary:
  ar: "سياسي ومفكر وصحفي أفغاني (1865-1933)، أبو الصحافة الأفغانية. نُفي مع أسرته إلى كراتشي ثم الدولة العثمانية حيث التقى جمال الدين الأفغاني وتأثر بأفكاره الإصلاحية، وعاد إلى أفغانستان سنة 1902 فأسس صحيفة «سراج الأخبار» (1911-1919) لسان حركة الشباب الأفغان، وصار وزيرا للخارجية ⁦(1919-1922 و1924-1927)⁩ وقاد الوفد الأفغاني في مفاوضات الاستقلال. هو والد الملكة ثريا وصهر الملك أمان الله. مات منفيا في إسطنبول."
  en: "Afghan statesman, thinker and journalist (1865–1933), the father of Afghan journalism. Exiled with his family to Karachi and then the Ottoman Empire, where he met Jamal al-Din al-Afghani and absorbed his reformist ideas, he returned to Afghanistan in 1902 and founded the newspaper Seraj al-Akhbar (1911–1919), the voice of the Young Afghan movement; he became foreign minister (1919–1922 and 1924–1927) and led the Afghan delegation in the independence negotiations. He was Queen Soraya's father and King Amanullah's father-in-law. He died in exile at Istanbul."
  ur: "افغان سیاست دان، مفکر اور صحافی ⁦(1865ء–1933ء)⁩، افغان صحافت کے بانی۔ خاندان کے ساتھ کراچی اور پھر سلطنتِ عثمانیہ جلاوطن ہوئے، جہاں جمال الدین افغانی سے ملاقات کی اور ان کے اصلاحی خیالات سے متاثر ہوئے؛ 1902ء میں افغانستان واپس آ کر اخبار «سراج الاخبار» ⁦(1911ء–1919ء)⁩ جاری کیا جو نوجوان افغان تحریک کی آواز تھا، وزیرِ خارجہ بنے ⁦(1919ء–1922ء اور 1924ء–1927ء)⁩ اور آزادی کی مذاکرات میں افغان وفد کی قیادت کی۔ ملکہ ثریا کے والد اور بادشاہ امان اللہ کے سسر تھے۔ استنبول میں جلاوطنی میں وفات پائی۔"
  es: "Estadista, pensador y periodista afgano (1865-1933), considerado el padre del periodismo afgano. Exiliado con su familia a Karachi y posteriormente al Imperio Otomano, donde conoció a Jamal al-Din al-Afghani y asimiló sus ideas reformistas, regresó a Afganistán en 1902 y fundó el periódico Seraj al-Akhbar (1911-1919), portavoz del movimiento de la Juventud Afgana. Fue ministro de Asuntos Exteriores (1919-1922 y 1924-1927) y lideró la delegación afgana en las negociaciones de independencia. Fue padre de la reina Soraya y suegro del rey Amanullah. Falleció en el exilio en Estambul."
  fr: "Homme d'État, penseur et journaliste afghan (1865-1933), il est considéré comme le père du journalisme afghan. Exilé avec sa famille à Karachi puis dans l'Empire ottoman, où il rencontra Jamal al-Din al-Afghani et s'imprégna de ses idées réformistes, il retourna en Afghanistan en 1902 et fonda le journal Seraj al-Akhbar (1911-1919), organe du mouvement de la Jeunesse afghane. Il devint ministre des Affaires étrangères (1919-1922 et 1924-1927) et dirigea la délégation afghane lors des négociations d'indépendance. Il était le père de la reine Soraya et le beau-père du roi Amanullah. Il mourut en exil à Istanbul."
  tr: "Afgan siyasetçi, düşünür ve gazeteci (1865-1933), Afgan gazeteciliğinin babası. Ailesiyle birlikte Karaçi'ye, ardından Osmanlı İmparatorluğu'na sürgün edildi; burada Cemaleddin el-Afgan ile tanıştı ve onun reformist fikirlerinden etkilendi. 1902'de Afganistan'a döndü ve Afgan gençlik hareketinin sözcüsü olan 'Siraj al-Akhbar' (1911-1919) gazetesini kurdu, Dışişleri Bakanı oldu (1919-1922 ve 1924-1927) ve Afgan heyetine bağımsızlık müzakerelerinde liderlik etti. Kraliçe Thuraya'nın babası ve Kral Amanullah'ın damadıydı. İstanbul'da sürgünde öldü."
  id: "Politikus, pemikir, dan jurnalis Afghanistan (1865-1933), bapak jurnalisme Afghanistan. Ia diasingkan bersama keluarganya ke Karachi dan kemudian ke Kekaisaran Ottoman, di mana ia bertemu Jamal al-Din al-Afghani dan dipengaruhi oleh gagasan reformisnya. Ia kembali ke Afghanistan pada tahun 1902 dan mendirikan surat kabar 'Siraj al-Akhbar' (1911-1919), corong gerakan pemuda Afghanistan, menjadi Menteri Luar Negeri (1919-1922 dan 1924-1927), serta memimpin delegasi Afghanistan dalam negosiasi kemerdekaan. Ia adalah ayah dari Ratu Thuraya dan menantu Raja Amanullah. Ia meninggal dalam pengasingan di Istanbul."
