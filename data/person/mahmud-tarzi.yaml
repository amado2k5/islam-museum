summary:
  ar: "سياسي ومفكر وصحفي أفغاني (1865-1933)، أبو الصحافة الأفغانية. نُفي مع أسرته إلى كراتشي ثم الدولة العثمانية حيث التقى جمال الدين الأفغاني وتأثر بأفكاره الإصلاحية، وعاد إلى أفغانستان سنة 1902 فأسس صحيفة «سراج الأخبار» (1911-1919) لسان حركة الشباب الأفغان، وصار وزيرا للخارجية (1919-1922 و1924-1927) وقاد الوفد الأفغاني في مفاوضات الاستقلال. هو والد الملكة ثريا وصهر الملك أمان الله. مات منفيا في إسطنبول."
  en: "Afghan statesman, thinker and journalist (1865–1933), the father of Afghan journalism. Exiled with his family to Karachi and then the Ottoman Empire, where he met Jamal al-Din al-Afghani and absorbed his reformist ideas, he returned to Afghanistan in 1902 and founded the newspaper Seraj al-Akhbar (1911–1919), the voice of the Young Afghan movement; he became foreign minister (1919–1922 and 1924–1927) and led the Afghan delegation in the independence negotiations. He was Queen Soraya's father and King Amanullah's father-in-law. He died in exile at Istanbul."
  ur: "افغان سیاست دان، مفکر اور صحافی (1865ء–1933ء)، افغان صحافت کے بانی۔ خاندان کے ساتھ کراچی اور پھر سلطنتِ عثمانیہ جلاوطن ہوئے، جہاں جمال الدین افغانی سے ملاقات کی اور ان کے اصلاحی خیالات سے متاثر ہوئے؛ 1902ء میں افغانستان واپس آ کر اخبار «سراج الاخبار» (1911ء–1919ء) جاری کیا جو نوجوان افغان تحریک کی آواز تھا، وزیرِ خارجہ بنے (1919ء–1922ء اور 1924ء–1927ء) اور آزادی کی مذاکرات میں افغان وفد کی قیادت کی۔ ملکہ ثریا کے والد اور بادشاہ امان اللہ کے سسر تھے۔ استنبول میں جلاوطنی میں وفات پائی۔"
