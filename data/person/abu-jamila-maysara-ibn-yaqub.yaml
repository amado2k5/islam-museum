summary:
 ar: "ميسرة بن يعقوب، أبو جميلة، الطُّهوي الكوفي، وكان صاحب راية علي بن أبي طالب، روى عن علي والحسن بن علي وعثمان بن عفان، وروى عنه حصين بن عبد الرحمن السلمي وعطاء بن السائب وأبو خباب الكلبي وغيرهم. ذكره ابن حبان في الثقات، وروى له أبو داود والترمذي والنسائي وابن ماجه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}. وتاريخ وفاته في الكتاب غير معلوم."
 en: "Maysara ibn Ya'qub, Abu Jamila al-Tuhawi al-Kufi, who carried the banner of Ali ibn Abi Talib. He narrated from Ali, al-Hasan ibn Ali and Uthman ibn Affan; Husayn ibn Abd al-Rahman al-Sulami, Ata ibn al-Sa'ib and Abu Khabbab al-Kalbi narrated from him. Ibn Hibban mentions him among the trustworthy, and Abu Dawud, al-Tirmidhi, al-Nasa'i and Ibn Majah narrated from him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}. The book gives no dates for him."
 ur: "میسرہ بن یعقوب، ابو جمیلہ طہوی کوفی، جو علی بن ابی طالب کے علم بردار تھے۔ انہوں نے علی، حسن بن علی اور عثمان بن عفان سے روایت کی، اور ان سے حصین بن عبد الرحمن سلمی، عطاء بن سائب اور ابو خباب کلبی نے روایت کی۔ ابن حبان نے انہیں ثقات میں ذکر کیا، اور ابو داؤد، ترمذی، نسائی اور ابن ماجہ نے ان سے روایت لی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}۔ کتاب میں ان کی تاریخ وفات معلوم نہیں۔"
