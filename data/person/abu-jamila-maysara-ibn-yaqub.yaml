summary:
 ar: "ميسرة بن يعقوب، أبو جميلة، الطُّهوي الكوفي، وكان صاحب راية علي بن أبي طالب، روى عن علي والحسن بن علي وعثمان بن عفان، وروى عنه حصين بن عبد الرحمن السلمي وعطاء بن السائب وأبو خباب الكلبي وغيرهم. ذكره ابن حبان في الثقات، وروى له أبو داود والترمذي والنسائي وابن ماجه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}. وتاريخ وفاته في الكتاب غير معلوم."
 en: "Maysara ibn Ya'qub, Abu Jamila al-Tuhawi al-Kufi, who carried the banner of Ali ibn Abi Talib. He narrated from Ali, al-Hasan ibn Ali and Uthman ibn Affan; Husayn ibn Abd al-Rahman al-Sulami, Ata ibn al-Sa'ib and Abu Khabbab al-Kalbi narrated from him. Ibn Hibban mentions him among the trustworthy, and Abu Dawud, al-Tirmidhi, al-Nasa'i and Ibn Majah narrated from him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}. The book gives no dates for him."
 ur: "میسرہ بن یعقوب، ابو جمیلہ طہوی کوفی، جو علی بن ابی طالب کے علم بردار تھے۔ انہوں نے علی، حسن بن علی اور عثمان بن عفان سے روایت کی، اور ان سے حصین بن عبد الرحمن سلمی، عطاء بن سائب اور ابو خباب کلبی نے روایت کی۔ ابن حبان نے انہیں ثقات میں ذکر کیا، اور ابو داؤد، ترمذی، نسائی اور ابن ماجہ نے ان سے روایت لی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}۔ کتاب میں ان کی تاریخ وفات معلوم نہیں۔"
 fr: "Maysara ibn Ya'qub, Abu Jamila al-Tuhawi al-Kufi, qui porta l'étendard d'Ali ibn Abi Talib. Il rapporta d'Ali, d'al-Hasan ibn Ali et d'Uthman ibn Affan ; Husayn ibn Abd al-Rahman al-Sulami, Ata ibn al-Sa'ib et Abu Khabbab al-Kalbi rapportèrent de lui. Ibn Hibban le mentionne parmi les hommes dignes de confiance, et Abu Dawud, al-Tirmidhi, al-Nasa'i et Ibn Majah rapportèrent de lui {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}. Le livre ne donne aucune date pour lui."
 es: "Maysara ibn Ya'qub, Abu Jamila al-Tuhawi al-Kufi, que llevaba el estandarte de Ali ibn Abi Talib. Narró de Ali, al-Hasan ibn Ali y Uthman ibn Affan; Husayn ibn Abd al-Rahman al-Sulami, Ata ibn al-Sa'ib y Abu Khabbab al-Kalbi narraron de él. Ibn Hibban lo menciona entre los dignos de confianza, y Abu Dawud, al-Tirmidhi, al-Nasa'i e Ibn Majah narraron sobre él {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.13747}. El libro no da fechas para él."
 tr: "Maysarah ibn Ya'qub, Abu Jamilah, al-Tuhawi al-Kufi, Ali ibn Abi Talib'in sancaktarıydı. Ali, al-Hasan ibn Ali ve Uthman ibn Affan'dan hadisler rivayet etmiştir. Ondan hadis rivayet edenler arasında Hüseyin ibn Abd al-Rahman al-Sulami, Ata ibn al-Sa'ib, Abu Khabbab al-Kalbi ve diğerleri bulunmaktadır. İbn Hibban, güvenilir raviler kitabında ondan bahsetmekte, Abu Dawud, al-Tirmidhi, al-Nasa'i ve İbn Majah da ondan hadis rivayet etmişlerdir. Kitapta ölüm tarihi bilinmemektedir."
 id: "Maysarah ibn Ya'qub, Abu Jamilah, al-Tuhawi al-Kufi, adalah pembawa panji Ali ibn Abi Talib. Ia meriwayatkan hadits dari Ali, al-Hasan ibn Ali, dan Uthman ibn Affan. Perawi hadits darinya antara lain Husayn ibn Abd al-Rahman al-Sulami, Ata ibn al-Sa'ib, Abu Khabbab al-Kalbi, dan lainnya. Ibn Hibban menyebutkannya dalam bukunya tentang perawi terpercaya, dan Abu Dawud, al-Tirmidhi, al-Nasa'i, dan Ibn Majah meriwayatkan hadits darinya. Tanggal kematiannya tidak diketahui dalam buku tersebut."
