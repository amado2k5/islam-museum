class: person
label: { ar: "أبو القاسم الأزهري الصيرفي البغدادي", en: "Abu al-Qasim al-Azhari al-Sayrafi al-Baghdadi", fr: "Abu al-Qasim al-Azhari al-Sayrafi al-Baghdadi", es: "Abu al-Qasim al-Azhari al-Sayrafi al-Baghdadi", ur: "ابو القاسم الازہری السیرافی البغدادی" }
summary:
  ar: "أبو القاسم عبيد الله بن أحمد بن عثمان البغدادي الصيرفي الأزهري، الحافظ كاتب الكثير عني بالحديث وروى عن القطيعي وطبقته؛ توفي في صفر سنة خمس وثلاثين وأربعمائة عن ثمانين سنة {cite:shadharat-dhahab p. 255}."
  en: "Ubayd Allah b. Ahmad al-Azhari al-Sayrafi of Baghdad — the hafiz who wrote much and busied himself with hadith, transmitting from al-Qati'i and his peers; died in Safar 435 aged eighty {cite:shadharat-dhahab p. 255}."
  fr: "Ubayd Allah ibn Ahmad al-Azhari al-Sayrafi de Bagdad — hafiz qui écrivit abondamment et se consacra au hadith, transmettant d’al-Qati’i et de ses pairs ; mort en safar 435 H à quatre-vingts ans {cite:shadharat-dhahab p. 255}."
  es: "Ubayd Allah b. Ahmad al-Azhari al-Sayrafi de Bagdad — el hafiz que escribió mucho y se dedicó al estudio de los hadices, transmitiéndolos de al-Qati'i y sus compañeros; murió en Safar 435 a la edad de ochenta años {cite:shadharat-dhahab p. 255}."
  ur: "عبید اللہ بی۔ بغداد کے احمد الازہری السرافی - وہ حافظ جس نے بہت کچھ لکھا اور اپنے آپ کو حدیث میں مصروف رکھا، القطی اور اس کے ساتھیوں سے نقل کیا؛ صفر 435 میں اسّی سال کی عمر میں وفات پائی۔ 255}۔"
  tr: "Ebu el-Kâsım Ubeyd Allah ibn Ahmed ibn Osman el-Bağdadi el-Seyrefî el-Ezhari, ezberci, birçok hadisin kâtibi, hadislerle ilgilenen ve el-Katiî ve onun sınıfından rivayet eden; Hicri 435 yılının Safer ayında seksen yaşında vefat etmiştir. {Kaynak: Şadharat-dahab s. 255}"
  id: "Abu al-Qasim Ubayd Allah ibn Ahmad ibn Uthman al-Baghdadi al-Sayrafi al-Azhari, seorang penghafal, juru tulis banyak hadits, ahli hadits dan meriwayatkan dari al-Qati’i dan golongannya; beliau wafat pada bulan Safar tahun 435 H pada usia delapan puluh tahun. {kutip:shadharat-dhahab hlm. 255}."
