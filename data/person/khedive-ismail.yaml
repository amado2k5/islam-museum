summary:
  ar: "إسماعيل باشا، خديوي مصر من 1863 إلى 1879، ابن إبراهيم باشا وحفيد محمد علي، وُلد بالقاهرة سنة 1830 وتعلم في باريس. سعى إلى استقلال أكبر عن السلطان العثماني وإلى تحديث مصر وبناء إمبراطورية أفريقية، فنال لقب الخديوي بفرمان 1867، وأسس دار الكتب والمتحف والبريد، وافتُتحت قناة السويس في عهده. أوقعته الديون في رقابة أوروبية وباع حصته في القناة سنة 1875، وعزله السلطان سنة 1879 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205}."
  en: "Ismail Pasha, khedive of Egypt 1863-79, son of Ibrahim Pasha and grandson of Muhammad Ali, born in Cairo in 1830 and educated partly in Paris. He sought greater independence from the Ottoman sultan, modernisation and an African empire; the firman of 1867 gave him the title khedive, he founded the national library, a museum and a postal service, and the Suez Canal opened in his reign. Debt brought European financial control, he sold his canal shares in 1875, and the sultan deposed him in 1879 {cite:encyclopaedia-of-islam-2 vol. 4 p. 205}."
  ur: "اسماعیل پاشا، 1863ء سے 1879ء تک مصر کے خدیو، ابراہیم پاشا کے بیٹے اور محمد علی کے پوتے، 1830ء میں قاہرہ میں پیدا ہوئے اور کچھ تعلیم پیرس میں پائی۔ انہوں نے عثمانی سلطان سے زیادہ آزادی، جدید کاری اور افریقی سلطنت کی کوشش کی؛ 1867ء کے فرمان سے خدیو کا لقب ملا، قومی کتب خانہ، عجائب گھر اور ڈاک قائم کی اور ان کے دور میں نہر سویز کھلی۔ قرض سے یورپی مالی نگرانی آئی، 1875ء میں نہر کے حصے بیچے اور 1879ء میں سلطان نے انہیں معزول کیا {cite:encyclopaedia-of-islam-2 vol. 4 p. 205}."
