kids:
  ar: "إسماعيل كان حاكماً لمصر أراد أن يجعلها حديثة، فبنى مدارس ومكتبة ومتحفاً وافتُتحت قناة السويس في عهده."
  en: "Ismail ruled Egypt and wanted to make it modern, so he built schools, a library and a museum, and the Suez Canal opened while he ruled."
