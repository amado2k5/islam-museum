summary:
  ar: "فيلسوف وكاتب سويسري وُلد في جنيف سنة 1962 لأسرة مصرية، وهو حفيد حسن البنا مؤسس الإخوان المسلمين، شغل كرسي الدراسات الإسلامية المعاصرة في جامعة أكسفورد وكتب في الإسلام والهوية المسلمة في أوروبا والإصلاح، وأدين في سويسرا إدانة نهائية سنة 2025 وفي فرنسا سنة 2026 بتهم اغتصاب، والحكم الفرنسي قابل للاستئناف."
  en: "Swiss philosopher and writer born in Geneva in 1962 to an Egyptian family, a grandson of Hassan al-Banna, founder of the Muslim Brotherhood. He held the chair of Contemporary Islamic Studies at Oxford and wrote on Islam, Muslim identity in Europe and reform. He was convicted of rape in Switzerland, the conviction becoming final in 2025, and in France in 2026, where the judgment remains subject to appeal."
  ur: "سوئس فلسفی و مصنف، جو 1962 میں جنیوا میں ایک مصری گھرانے میں پیدا ہوا اور حسن البنا، اخوان المسلمون کے بانی، کا نواسہ ہے۔ اس نے آکسفورڈ میں عصری اسلامی مطالعات کی کرسی سنبھالی اور اسلام، یورپ میں مسلم شناخت اور اصلاح پر لکھا۔ اسے سوئٹزرلینڈ میں زیادتی کے جرم میں سزا ہوئی جو 2025 میں حتمی ہو گئی، اور فرانس میں 2026 میں سزا سنائی گئی، جس کے خلاف اپیل ممکن ہے۔"
