summary:
  ar: "محمد بن عبد الله بن أحمد، الخطيب العمري التمرتاشي الغزي الحنفي، شمس الدين ⁦(939 - 1004هـ / 1532 - 1596م)⁩، شيخ الحنفية في عصره، من أهل غزة ولد فيها وتوفي فيها؛ ومن كتبه «تنوير الأبصار» في الفقه وشرحه «منح الغفار» {cite:al-aalam}."
  en: "Muhammad ibn Abdallah ibn Ahmad al-Khatib al-'Umari al-Tumurtashi al-Ghazzi al-Hanafi, Shams al-Din (939-1004 AH / 1532-1596), described by al-Zirikli as the leading Hanafi of his time, a native of Gaza who was born and died there; his books include the jurisprudence manual Tanwir al-absar and its commentary Minah al-ghaffar {cite:al-aalam}."
