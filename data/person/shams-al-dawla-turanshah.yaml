summary:
  ar: "شمس الدولة تورانشاه بن أيوب أخو صلاح الدين الأكبر؛ أباد بالسيف من لجأ من السودان إلى الجيزة بعد وقعة بين القصرين سنة أربع وستين وخمسمائة، وسار في جمادى الأولى سنة ثمان وستين من مصر إلى بلد النوبة فحصر قلعة ابزيم حتى سلمها أهلها فملكها، ثم رأى عدم الحاصل وقشف العيش فعاد إلى مصر وكان عامة الغنيمة العبيد والجواري، وكان سبب المسير أن صلاح الدين وأهله خافوا أن يدخل نور الدين مصر فيأخذها فأرادوا تملك بلاد يلجأون إليها؛ ثم استأذن نور الدين في قصد عبد النبي صاحب زبيد لقطعه الخطبة العباسية فسار في مستهل رجب سنة تسع وستين فافتتح زبيد عنوة وأقام فيها الخطبة العباسية {cite:kamil-ibn-al-athir p. 18-19، 45-46، 52-53}."
  en: "Saladin's elder brother — destroyed the Sudanese remnant at Giza in 564, probed Nubia in 568 (taking Ibrim's fort, abandoning the barren country), then in Rajab 569 stormed Zabid and planted the Abbasid khutba in Yemen, founding the Ayyubid conquest there {cite:kamil-ibn-al-athir p. 18-19, 45-46, 52-53}."
