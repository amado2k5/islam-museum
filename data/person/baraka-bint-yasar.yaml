summary:
  ar: "مولاة أبي سفيان بن حرب، امرأة قيس بن عبد الله الأسدي؛ كانت ظِئراً لعبيد الله بن جحش وأم حبيبة، وهاجرت معهما إلى الحبشة."
  en: Freedwoman of Abu Sufyan ibn Harb, wife of Qays ibn Abdullah al-Asadi; she was a foster-nurse to Ubaydullah ibn Jahsh and Umm Habiba and emigrated with them to Abyssinia.
  ur: "ابو سفیان بن حرب کی آزاد کردہ لونڈی، قیس بن عبد اللہ الاسدی کی بیوی؛ عبید اللہ بن جحش اور ام حبیبہ کی دایہ اور ان کے ساتھ ہجرت کی۔"
  es: "Liberta de Abu Sufyan ibn Harb, esposa de Qays ibn Abdullah al-Asadi; fue nodriza adoptiva de Ubaydullah ibn Jahsh y Umm Habiba y emigró con ellos a Abisinia."
  fr: "Affranchie d'Abu Sufyan ibn Harb, épouse de Qays ibn Abdullah al-Asadi; elle fut nourrice d'Ubaydullah ibn Jahsh et d'Umm Habiba et émigra avec eux en Abyssinie."
  tr: "Qays ibn Abdullah al-Asadi'nin eşi Ebu Sufyan bin Harb'ın özgür kadını, Ubayd Allah ibn Jahsh ve um Habiba'nın soyundan geliyordu ve onlarla birlikte Habeşistan'a göç etti."
  id: "Wanita bebas Abu Sufyan ibn Harb, istri Qays ibn Abdullah al-Asadi, adalah keturunan Ubayd Allah ibn Jahsh dan um Habiba, dan ia ikut berhijrah bersama mereka ke Abyssinia."
