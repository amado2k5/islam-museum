summary:
  ar: "أستاذة أمريكية في الدراسات الدينية بجامعة بوسطن، وُلدت سنة 1972. اشتهرت ببحوثها النسوية في الفقه والأخلاق الإسلامية وسيرة النبي، ومن كتبها «الأخلاق الجنسية والإسلام» و«الإمام الشافعي» و«حيوات محمد»."
  en: "American professor of religious studies at Boston University, born in 1972. She is recognised for feminist scholarship on Islamic jurisprudence, ethics and the prophetic biography, with books including Sexual Ethics and Islam, Imam Shafi’i and The Lives of Muhammad."
  ur: "بوسٹن یونیورسٹی میں مطالعاتِ دینیات کی امریکی پروفیسر، 1972 میں پیدا ہوئیں۔ وہ فقہِ اسلامی، اخلاقیات اور سیرتِ نبوی پر نسوانی زاویے کی تحقیق کے لیے جانی جاتی ہیں؛ ان کی کتابوں میں Sexual Ethics and Islam، Imam Shafi’i اور The Lives of Muhammad شامل ہیں۔"
  es: "Profesora estadounidense de estudios religiosos en la Universidad de Boston, nacida en 1972. Es reconocida por sus estudios feministas sobre la jurisprudencia islámica, la ética y la biografía profética, con libros como Ética sexual e Islam, Imam Shafi'i y Las vidas de Mahoma."
  fr: "Professeure américaine d'études religieuses à l'Université de Boston, née en 1972. Elle est reconnue pour ses travaux féministes sur la jurisprudence islamique, l'éthique et la biographie prophétique, avec des ouvrages tels que Sexual Ethics and Islam, Imam Shafi'i et The Lives of Muhammad."
  tr: "Boston Üniversitesi'nde 1972 doğumlu Amerikalı din bilimleri profesörü. İslami fıkıh, etik ve Peygamber'in biyografisi üzerine feminist araştırmalarıyla tanınır. Kitapları arasında 'Cinsel Etik ve İslam', 'İmam el-Şafii' ve 'Muhammed'in Hayatları' bulunmaktadır."
  id: "Seorang profesor studi agama asal Amerika di Boston University, lahir pada tahun 1972. Ia dikenal atas penelitian feminisnya tentang yurisprudensi Islam, etika, dan biografi Nabi. Di antara bukunya adalah 'Etika Seksual dan Islam,' 'Imam al-Shafi'i,' dan 'The Lives of Muhammad.'"
