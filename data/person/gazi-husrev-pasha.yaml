  ar: "بطاقة أولية لغازي خسرو باشا البوسنوي، الصدر الأعظم العثماني في عهد مراد الرابع الذي قاد حملة القوقاز واستردّ يروان، توفي سنة ١٦٣٢م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Gazi Husrev Pasha the Bosnian, the Ottoman grand vizier under Murad IV who led the Caucasus campaign and recovered Yerevan, d. 1632; the source entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Gazi Husrev Pasha el Bosnio, el gran visir otomano bajo Murad IV que dirigió la campaña del Cáucaso y recuperó Ereván, fallecido en 1632; la entrada de la fuente aún no se ha verificado en la página."
  fr: "Fiche de convocation de Gazi Husrev Pacha le Bosniaque, grand vizir ottoman sous Murad IV qui mena la campagne du Caucase et reprit Erevan, mort en 1632; la source n'est pas encore vérifiée sur la page."
  ur: "غازی حسریو پاشا بوسنیائی کے لیے کارڈ کا مسودہ، مراد چہارم کے ماتحت عثمانی عظیم وزیر، جس نے قفقاز کی مہم کی قیادت کی اور یریوان کو دوبارہ حاصل کیا۔ 1632; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Murad IV döneminde Osmanlı Sadrazami olan ve Kafkasya seferini yöneten ve Erivan'ı geri alan Gazi Hosrow Paşa el-Bosnavi'nin ön kartı 1632'de ölmüştür; Osmanlı tarih kitaplarında adı geçmektedir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Gazi Khosrow Pasha al-Bosnavi, Wazir Agung Ottoman pada masa pemerintahan Murad IV, yang memimpin kampanye Kaukasus dan merebut kembali Yerevan, meninggal pada tahun 1632 M; ia disebutkan dalam buku sejarah Ottoman, dan biografinya belum pernah diulas di halaman tersebut."
