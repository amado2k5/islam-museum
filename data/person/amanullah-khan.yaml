summary:
  ar: "أمير أفغانستان (1919-1926) ثم أول ملوكها (1926-1929)، ثالث أبناء الأمير حبيب الله خان. نال استقلال أفغانستان التام عن بريطانيا بعد الحرب الإنجليزية الأفغانية الثالثة سنة 1919، وأصدر أول دستور أفغاني، ودفع إصلاحات واسعة في التعليم وحقوق المرأة والإدارة حتى أثارت المعارضة المحافظة حربا أهلية فتنازل عن العرش في يناير 1929 وعاش منفيا في أوروبا حتى وفاته في زيورخ سنة 1960."
  en: "Emir of Afghanistan (1919–1926) and then its first king (1926–1929), third son of Emir Habibullah Khan. He won Afghanistan's full independence from Britain after the Third Anglo-Afghan War of 1919, promulgated the country's first constitution, and drove wide reforms in education, women's rights and administration until conservative opposition brought civil war; he abdicated in January 1929 and lived in exile in Europe until his death at Zurich in 1960."
  ur: "افغانستان کے امیر (1919ء–1926ء) اور پھر پہلے بادشاہ (1926ء–1929ء)، امیر حبیب اللہ خان کے تیسرے بیٹے۔ 1919ء کی تیسری اینگلو افغان جنگ کے بعد برطانیہ سے افغانستان کی مکمل آزادی حاصل کی، ملک کا پہلا آئین جاری کیا اور تعلیم، خواتین کے حقوق اور انتظام میں وسیع اصلاحات کیں، حتیٰ کہ قدامت پسند مخالفت خانہ جنگی کا سبب بنی؛ جنوری 1929ء میں تخت چھوڑا اور 1960ء میں زیورخ میں وفات تک یورپ میں جلاوطنی کی زندگی گزاری۔"
