label: { ar: "مجاعة بن سعر التميمي", en: "Mujja'a ibn Si'r al-Tamimi", es: "Mujja'a ibn Si'r al-Tamimi", fr: "Mujja'a ibn Si'r al-Tamimi", ur: "معاذ بن سیر التمیمی۔" }
summary:
  ar: "مجاعة بن سعر التميمي؛ ولاه الحجاج ثغر مكران بعد العلافيين فغزا فغنم وفتح طوائف من قندابيل ثم أتم فتحها محمد بن القاسم ومات بعد سنة بمكران."
  en: "Mujja'a ibn Si'r al-Tamimi; al-Hajjaj's frontier man after the Allafis — raided and opened parts of Qandabil, completed by Muhammad ibn al-Qasim; died in Makran within the year."
  es: "Mujja'a ibn Si'r al-Tamimi, el hombre de la frontera de al-Hajjaj después de los Allafis, asaltó y abrió partes de Qandabil, completadas por Muhammad ibn al-Qasim; murió en Makran en el plazo de un año."
  fr: "Mujja'a ibn Si'r al-Tamimi; homme de frontière d'al-Hajjaj après les Allafis — a mené des raids et ouvert des parties de Qandabil, achevé par Muhammad ibn al-Qasim; est mort à Makran dans l'année."
  ur: "مغیث ابن سیر التمیمی؛ علافیوں کے بعد الحجاج کے فرنٹیئر مین - نے قندبیل کے کچھ حصوں پر چھاپہ مارا اور اسے کھولا، جسے محمد بن القاسم نے مکمل کیا تھا۔ سال کے اندر مکران میں وفات پائی۔"
  tr: "Maj'ah ibn Sa'ar al-Tamimi; el-Hacac, onu Al-Ala'is'ten sonra Makran sınırına atadı; burada Qandabil'in gruplarını yağmaladı, esir aldı ve ele geçirdi, ardından Muhammed bin el-Kasim fethi tamamladı ve bir yıl sonra Makran'da öldü."
  id: "Maj'ah ibn Sa'ar al-Tamimi; al-Hajjaj mengangkatnya di perbatasan Makran setelah Al-Ala'i, di mana ia menyerang, menangkap, dan menangkap kelompok Qandabil, kemudian Muhammad ibn al-Qasim menyelesaikan penaklukan dan meninggal setahun kemudian di Makran."
