summary:
  ar: "ريفيرتر قائد قطلوني مسيحي، تسميه دائرة المعارف الإسلامية في المصادر العربية الروبرتير، وكان على رأس المليشيا المسيحية في خدمة المرابطين، وقاد في عهد علي بن يوسف القوات الخفيفة المؤلفة من المرتزقة المسيحيين في المغرب. وتقول الموسوعة إنه قُتل سنة 539هـ/1145م في اشتباك مع الموحدين في شرق المغرب. ولا تذكر المقالات المقروءة ميلاده ولا أي صلة له بسرقسطة {cite:encyclopaedia-of-islam-2 vol. 1 p. 97} {cite:encyclopaedia-of-islam-2 vol. 1 p. 412}."
  en: "Reverter was a Catalan Christian commander, called al-Ruburtayr in Arabic sources as given in the Encyclopaedia of Islam, who led the Christian militia in Almoravid service and under Ali ibn Yusuf commanded the light forces of Christian mercenaries kept in Morocco. The Encyclopaedia says he was killed in 539/1145 in a clash with the Almohads in eastern Morocco. The articles read give neither his birth nor any link between him and Zaragoza {cite:encyclopaedia-of-islam-2 vol. 1 p. 97} {cite:encyclopaedia-of-islam-2 vol. 1 p. 412}."
  ur: "ریورٹر ایک کیٹالان مسیحی سپہ سالار تھے، جنہیں دائرۃ المعارف الاسلامیہ عربی ماخذ کے مطابق الروبرتیر لکھتی ہے؛ وہ مرابطین کی خدمت میں مسیحی فوجی دستے کے سربراہ تھے اور علی بن یوسف کے دور میں مراکش میں رکھے گئے مسیحی کرائے کے سپاہیوں کے ہلکے دستوں کی کمان کرتے تھے۔ دائرۃ المعارف کے مطابق وہ 539ھ/1145ء میں مشرقی مراکش میں موحدین سے ایک جھڑپ میں مارے گئے۔ پڑھے گئے مضامین ان کی پیدائش بتاتے ہیں نہ ان کا سرقسطہ سے کوئی تعلق {cite:encyclopaedia-of-islam-2 vol. 1 p. 97} {cite:encyclopaedia-of-islam-2 vol. 1 p. 412}."
