summary:
  ar: "محدث هندي ديوبندي ⁦(1875–1933)⁩، شيخ الحديث في دار العلوم ديوبند، من أعاظم مدرّسي الصحيحين في شبه القارة. عُرف بذاكرة فائقة وأصالة تحقيق، ومن مصنفاته المطبوعة عن دروسه «فيض الباري على صحيح البخاري» و«العرف الشذي» و«مشكلات القرآن»."
  en: "Indian Deobandi hadith scholar (1875–1933), Shaykh al-Hadith at Darul Uloom Deoband, among the greatest teachers of the two Sahihs in the subcontinent. Known for prodigious memory and authentic scholarship; his published lectures include Fayd al-Bari on Sahih al-Bukhari, Al-'Arf al-Shadhi and Mushkilat al-Qur'an."
  ur: "ہندوستانی دیوبندی محدث ⁦(1875–1933)⁩ جو دار العلوم دیوبند کے شیخ الحدیث اور برِصغیر میں صحیحین کے عظیم ترین مدرسین میں شمار ہوتے ہیں۔ وہ غیر معمولی حافظے اور مستند تحقیق کے لیے جانے جاتے ہیں؛ ان کے دروس پر مبنی مطبوعہ کاموں میں «فیض الباری علی صحیح البخاری»، «العرف الشذی» اور «مشکلات القرآن» شامل ہیں۔"
  es: "Erudito indio deobandi en hadices (1875-1933), Shaykh al-Hadith en Darul Uloom Deoband, fue uno de los más grandes maestros de los dos Sahihs en el subcontinente. Conocido por su memoria prodigiosa y su erudición auténtica, entre sus conferencias publicadas se incluyen Fayd al-Bari sobre Sahih al-Bukhari, Al-'Arf al-Shadhi y Mushkilat al-Qur'an."
  fr: "Érudit indien du hadith deoband (1875-1933), cheikh al-Hadith à Darul Uloom Deoband, il compte parmi les plus grands maîtres des deux Sahihs du sous-continent indien. Reconnu pour sa mémoire prodigieuse et son érudition authentique, il a publié des conférences telles que Fayd al-Bari sur le Sahih al-Bukhari, Al-'Arf al-Shadhi et Mushkilat al-Qur'an."
  tr: "Hintli bir Deobandi hadis âlimi (1875–1933), Dar al-Uloom Deoband'da hadis ustası olan ve alt kıtadaki iki Sahih'in en büyük öğretmenlerinden biridir. Olağanüstü hafızası ve özgün özgünlüğüyle tanınıyordu ve dersleri üzerine yayımlanan eserleri arasında \"Fayd al-Bari 'ala Sahih al-Bukhari,\" \"Al-'Urf al-Shadhi\" ve \"Mushkilat al-Qur'an\" yer alıyor."
  id: "Seorang ulama hadis Deobandi India (1875–1933), guru hadis di Dar al-Uloom Deoband, salah satu guru terbesar dari dua Sahih di anak benua. Ia dikenal karena ingatan luar biasa dan keaslian yang otentik, dan di antara karya-karyanya yang diterbitkan tentang pelajarannya adalah \"Fayd al-Bari 'ala Sahih al-Bukhari,\" \"Al-'Urf al-Shadhi,\" dan \"Mushkilat al-Qur'an.\""
