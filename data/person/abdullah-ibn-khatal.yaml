summary:
  en: "A former Muslim sent by the Prophet to collect sadaqa; he killed his Muslim servant over a meal, apostatized with the collected camels, and kept two singing girls who performed lampoons against the Prophet; he was ordered killed on the Conquest and slain clinging to the Kaaba curtains."
  ar: "كان أسلم فبعثه النبي مصدّقًا، فقتل غلامًا مسلمًا كان معه على طعام وارتد بالصدقة، واقتنى قينتين تهجوان النبي؛ فأهدر دمه يوم الفتح وقُتل وهو متعلق بأستار الكعبة."
