  en: Ala al-Dawla ibn Kakuya
summary:
  ar: "علاء الدولة بن كاكويه، ملك الديلم على أصفهان؛ أطاع السلطان محمود بن سبكتكين وخطب له سنة 420هـ، وقصد مسعود بن محمود أصفهان فملكها منه واستخلف عليها بعض أصحابه فثار أهلها بعامله وقتلوه، وكان أمير الري سنة 429هـ حين اقتحمها الغز فأفحشوا في النهب والقتل."
  en: "Ala al-Dawla ibn Kakuya, Daylamite king of Isfahan; he gave Sultan Mahmud ibn Subuktigin allegiance and the khutba in 420 AH, and when Mas'ud ibn Mahmud took Isfahan and left a lieutenant the townsfolk rose and killed him — he was amir of Rayy in 429 when the Ghuzz stormed it with plunder and massacre."
