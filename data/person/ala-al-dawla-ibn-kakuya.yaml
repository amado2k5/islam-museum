id: person/ala-al-dawla-ibn-kakuya
class: person
label:
  ar: علاء الدولة بن كاكويه
  en: Ala al-Dawla ibn Kakuya
  fr: "Ala al-Dawla ibn Kakuya"
  es: "Ala al-Dawla ibn Kakuya"
summary:
  ar: "علاء الدولة بن كاكويه، ملك الديلم على أصفهان؛ أطاع السلطان محمود بن سبكتكين وخطب له سنة 420هـ، وقصد مسعود بن محمود أصفهان فملكها منه واستخلف عليها بعض أصحابه فثار أهلها بعامله وقتلوه، وكان أمير الري سنة 429هـ حين اقتحمها الغز فأفحشوا في النهب والقتل."
  en: "Ala al-Dawla ibn Kakuya, Daylamite king of Isfahan; he gave Sultan Mahmud ibn Subuktigin allegiance and the khutba in 420 AH, and when Mas'ud ibn Mahmud took Isfahan and left a lieutenant the townsfolk rose and killed him — he was amir of Rayy in 429 when the Ghuzz stormed it with plunder and massacre."
  fr: "Ala al-Dawla ibn Kakuya, roi Daylamite d'Ispahan ; il a donné Sultan Mahmud ibn Subuktigin allégeance et la khutba en 420 de l’hégire, et quand Mas'ud ibn Mahmud a pris Ispahan et a laissé un lieutenant le citadin s'est levé et l'a tué - il était émir de Rayy en 429 lorsque les Ghuzz l'ont avec pillage et massacre."
  es: "Ala al-Dawla ibn Kakuya, rey daylamita de Isfahán, juró lealtad al sultán Mahmud ibn Subuktigin y le ofreció el sermón en el año 420 de la Hégira. Cuando Mas'ud ibn Mahmud tomó Isfahán y dejó un lugarteniente, los habitantes de la ciudad se sublevaron y lo mataron. Era emir de Rayy en el año 429, cuando los Ghuzz la asaltaron con saqueos y masacres."
