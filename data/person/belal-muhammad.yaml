summary:
  ar: "مقاتل فنون قتالية مختلطة أمريكي من أصل فلسطيني ⁦(وُلد سنة 1988 في شيكاغو لأبوين فلسطينيين)⁩. بطل تيتان إف سي لوزن الوسط سنة 2016، ثم فاز ببطولة يو إف سي لوزن الوسط في يوليو 2024 فصار أول بطل في يو إف سي من أصل فلسطيني، وخسر اللقب في مايو 2025. معروف بدعمه العلني لفلسطين ورفعه علمها عند الوزن الرسمي."
  en: "American mixed martial artist of Palestinian descent (born 1988 in Chicago to Palestinian parents). Titan FC welterweight champion in 2016, he won the UFC welterweight championship in July 2024 — the first UFC champion of Palestinian descent — and lost the title in May 2025. He is known for his outspoken support of Palestine and for carrying its flag at weigh-ins."
  ur: "فلسطینی نژاد امریکی مخلوط مارشل آرٹسٹ ⁦(پیدائش 1988، شکاگو، فلسطینی والدین کے ہاں)⁩۔ 2016 میں ٹائٹن ایف سی ویلٹر ویٹ چیمپئن؛ جولائی 2024 میں یو ایف سی ویلٹر ویٹ چیمپئن شپ جیت کر فلسطینی نژاد پہلے یو ایف سی چیمپئن بنے اور مئی 2025 میں خطاب ہار گئے۔ وہ فلسطین کی کھلی حمایت اور وزن کے موقع پر اس کا پرچم اٹھانے کے لیے معروف ہیں۔"
  es: "Luchador estadounidense de artes marciales mixtas de ascendencia palestina (nacido en 1988 en Chicago, de padres palestinos). Campeón de peso wélter de Titan FC en 2016, ganó el campeonato de peso wélter de la UFC en julio de 2024 —el primer campeón de la UFC de ascendencia palestina— y perdió el título en mayo de 2025. Es conocido por su firme apoyo a Palestina y por portar su bandera en los pesajes."
  fr: "Combattant américain de MMA d'origine palestinienne (né en 1988 à Chicago de parents palestiniens). Champion des poids welters du Titan FC en 2016, il a remporté le titre de champion des poids welters de l'UFC en juillet 2024 – devenant ainsi le premier champion de l'UFC d'origine palestinienne – avant de le perdre en mai 2025. Il est connu pour son soutien indéfectible à la Palestine et pour arborer son drapeau lors des pesées."
  tr: "Filistin kökenli Amerikalı karma dövüş sanatları dövüşçüsü (1988'de Chicago'da Filistinli ebeveynlerin çocuğu olarak doğdu). 2016'da Titan FC orta sıklet şampiyonu oldu, ardından Temmuz 2024'te UFC orta sıklet şampiyonluğunu kazanarak Mayıs 2025'te unvanını kaybetti ve Filistin kökenli ilk UFC şampiyonu oldu. Filistin'e kamuoyunda verdiği destek ve resmi yarı orta sıklet etkinliklerinde bayrağını çekmesi ile tanınır."
  id: "Petarung seni bela diri campuran Amerika keturunan Palestina (lahir pada 1988 di Chicago dari orang tua Palestina). Dia adalah juara kelas menengah Titan FC pada 2016, kemudian memenangkan kejuaraan kelas menengah UFC pada Juli 2024, menjadi juara UFC pertama keturunan Palestina, kehilangan gelarnya pada Mei 2025. Dia dikenal karena dukungan publiknya untuk Palestina dan mengibarkan benderanya di acara resmi kelas welter."
