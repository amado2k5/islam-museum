summary:
  ar: "مقاتل فنون قتالية مختلطة أمريكي من أصل فلسطيني (وُلد سنة 1988 في شيكاغو لأبوين فلسطينيين). بطل تيتان إف سي لوزن الوسط سنة 2016، ثم فاز ببطولة يو إف سي لوزن الوسط في يوليو 2024 فصار أول بطل في يو إف سي من أصل فلسطيني، وخسر اللقب في مايو 2025. معروف بدعمه العلني لفلسطين ورفعه علمها عند الوزن الرسمي."
  en: "American mixed martial artist of Palestinian descent (born 1988 in Chicago to Palestinian parents). Titan FC welterweight champion in 2016, he won the UFC welterweight championship in July 2024 — the first UFC champion of Palestinian descent — and lost the title in May 2025. He is known for his outspoken support of Palestine and for carrying its flag at weigh-ins."
  ur: "فلسطینی نژاد امریکی مخلوط مارشل آرٹسٹ (پیدائش 1988، شکاگو، فلسطینی والدین کے ہاں)۔ 2016 میں ٹائٹن ایف سی ویلٹر ویٹ چیمپئن؛ جولائی 2024 میں یو ایف سی ویلٹر ویٹ چیمپئن شپ جیت کر فلسطینی نژاد پہلے یو ایف سی چیمپئن بنے اور مئی 2025 میں خطاب ہار گئے۔ وہ فلسطین کی کھلی حمایت اور وزن کے موقع پر اس کا پرچم اٹھانے کے لیے معروف ہیں۔"
