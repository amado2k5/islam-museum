summary:
  ar: "الملك الأمجد مجد الدين أبو المظفر بهرام شاه بن فروخشاه؛ تملك بعلبك بعد والده خمسين سنة وكان جوداً كريماً شاعراً محسناً، ثم أخرجه منها الأشرف بن العادل فانتقل إلى دمشق {cite:wafayat-ayan}؛ وفي الشذرات قتله مملوك له جميل سرقت له أدواة من ذهب تساوي مائتي دينار فظهرت عنده فلما كانت ليلة الأربعاء ثامن شوال فتح الخزانة وأخذ سيف الأمجد وكان يلعب بالشطرنج فضربه في كتفه وطعنه في خاصرته فمات، وهرب المملوك فطاردته المماليك وقتلوه، ودفن الأمجد بتربة أبيه على الشرف الشمالي، ورئي في المنام فقيل له ما فعل الله بك فقال «كنت من ذنبي على وجل * زال عني ذلك الوجل * أمنت نفسي بوائقها * عشت لما مت يا رجل» {cite:shadharat-dhahab p. 127}."
  en: "Al-Malik al-Amjad Bahram Shah b. Farrukhshah (d. 628) — Ayyubid prince of Baalbek until al-Ashraf expelled him; a diwan poet, murdered by his own mamluk at Damascus {cite:wafayat-ayan}."
  fr: "Al-Malik al-Amjad Bahram Shah ibn Farrukhshah (mort en 628 H) — prince ayyoubide de Baalbek jusqu’à son expulsion par al-Ashraf ; poète auteur d’un diwan, assassiné par son propre mamelouk à Damas {cite:wafayat-ayan}."
  es: "Al-Malik al-Amjad Bahram Shah n. Farrukhshah (m. 628): príncipe ayubí de Baalbek hasta que al-Ashraf lo expulsó; un poeta diwan, asesinado por su propio mameluco en Damasco {cita:wafayat-ayan}."
  ur: "الملک امجد بہرام شاہ بی۔ فرخشاہ ⁦(متوفی 628)⁩ - بعلبیک کا ایوبی شہزادہ جب تک کہ اشرف نے اسے ملک بدر نہ کر دیا۔ ایک دیوان شاعر، دمشق میں اپنے ہی مملوک کے ہاتھوں قتل ہوا۔"
  tr: "Kral Amcad Majd Al-Din Ebu Al-Muzaffar Bahram Şah bin Farrukhşah; babasından sonra elli yıl boyunca Baalbek'i yönetti. Cömert, soylu, şair ve hayırseverdi. Sonra Al-Ashraf bin Al-Adil onu oradan kovdu, bu yüzden Şam'a taşındı. {cite:wafayat-ayan}. El-Şedharat'ta, iki yüz dinar değerinde altın kaplarını çalan güzel bir Memlük tarafından öldürüldüğü belirtilir. Kaplar onun elinde bulundu ve Şevval ayının sekizinci Çarşamba gecesi hazineyi açıp Amcad'ın kılıcını aldı. Satranç oynuyordu, bu yüzden onu omzundan vurdu ve yanından bıçakladı, Amcad öldü. Memlük kaçtı, ancak Memlükler onu takip edip öldürdüler. Amcad, kuzeydeki yüksek bir yerde bulunan babasının türbesine gömüldü. Rüyasında kendisine, \"Allah sana ne yaptı?\" diye soruldu. O da, \"Günahımdan korkuyordum, fakat o korku beni terk etti. Kendimi onun kötülüklerinden korudum. Ey insan, öldüğümde yaşadım.\" dedi. {kaynak: Şadharat-dahab s. 127}"
  id: "Raja Al-Amjad Majd Al-Din Abu Al-Muzaffar Bahram Shah bin Farrukhshah; ia memerintah Baalbek setelah ayahnya selama lima puluh tahun. Ia dermawan, mulia, seorang penyair, dan seorang pemberi manfaat. Kemudian Al-Ashraf bin Al-Adil mengusirnya dari sana, sehingga ia pindah ke Damaskus. {cite:wafayat-ayan}. Dalam Al-Shadharat, disebutkan bahwa ia dibunuh oleh seorang Mamluk cantik yang mencuri wadah emas senilai dua ratus dinar. Wadah-wadah itu ditemukan di tangannya, dan pada malam Rabu, tanggal delapan Syawal, ia membuka perbendaharaan dan mengambil pedang Al-Amjad. Ia sedang bermain catur, lalu ia memukul bahunya dan menusuk sisinya, dan ia meninggal. Mamluk itu melarikan diri, tetapi para Mamluk mengejarnya dan membunuhnya. Al-Amjad dimakamkan di makam ayahnya di dataran tinggi utara. Ia terlihat dalam mimpi, dan dikatakan kepadanya, \"Apa yang Allah lakukan kepadamu?\" Dia berkata, \"Aku takut akan dosaku, tetapi rasa takut itu telah meninggalkanku. Aku telah melindungi diriku dari kejahatannya. Aku hidup ketika aku mati, wahai manusia.\" {cite:shadharat-dhahab p. 127}."
