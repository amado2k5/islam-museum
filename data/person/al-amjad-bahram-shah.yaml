summary:
  ar: "الملك الأمجد مجد الدين أبو المظفر بهرام شاه بن فروخشاه؛ تملك بعلبك بعد والده خمسين سنة وكان جوداً كريماً شاعراً محسناً، ثم أخرجه منها الأشرف بن العادل فانتقل إلى دمشق {cite:wafayat-ayan}؛ وفي الشذرات قتله مملوك له جميل سرقت له أدواة من ذهب تساوي مائتي دينار فظهرت عنده فلما كانت ليلة الأربعاء ثامن شوال فتح الخزانة وأخذ سيف الأمجد وكان يلعب بالشطرنج فضربه في كتفه وطعنه في خاصرته فمات، وهرب المملوك فطاردته المماليك وقتلوه، ودفن الأمجد بتربة أبيه على الشرف الشمالي، ورئي في المنام فقيل له ما فعل الله بك فقال «كنت من ذنبي على وجل * زال عني ذلك الوجل * أمنت نفسي بوائقها * عشت لما مت يا رجل» {cite:shadharat-dhahab p. 127}."
  en: "Al-Malik al-Amjad Bahram Shah b. Farrukhshah (d. 628) — Ayyubid prince of Baalbek until al-Ashraf expelled him; a diwan poet, murdered by his own mamluk at Damascus {cite:wafayat-ayan}."
