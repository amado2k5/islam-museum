summary:
  ar: "سياسي فلسطيني من القدس (1893–1982)، أمين اللجنة التنفيذية للمؤتمر العربي الفلسطيني وأمين المجلس الإسلامي الأعلى، ومؤسس الحزب العربي الفلسطيني سنة 1935 ورئيسه، ثم رئيس اللجنة العربية العليا؛ قاد الوفد العربي إلى مؤتمر لندن 1939، وكان وزير خارجية حكومة عموم فلسطين سنة 1948، وانتهت مسيرته مستشارًا للملك سعود في السعودية وتوفي في الرياض."
  en: "Palestinian politician from Jerusalem (1893–1982), secretary of the Palestine Arab Congress executive and of the Supreme Muslim Council, founder and chairman of the Palestine Arab Party (1935) and later chairman of the Arab Higher Committee. Exiled during the 1936–1939 revolt, he led the Arab delegation to the 1939 London Conference, was foreign minister of the All-Palestine Government in 1948, and ended his career in Saudi Arabia as an adviser to King Saud; he died at Riyadh."
  ur: "یروشلم سے تعلق رکھنے والے فلسطینی سیاست دان (1893–1982)، فلسطین عرب کانگریس کی عاملہ کمیٹی اور سپریم مسلم کونسل کے سیکرٹری، 1935 میں فلسطین عرب پارٹی کے بانی و صدر اور بعد میں عرب اعلیٰ کمیٹی کے چیئرمین؛ 1939 کی لندن کانفرنس میں عرب وفد کی قیادت کی، 1948 میں آل فلسطین حکومت کے وزیر خارجہ رہے، اور اپنے آخری برس سعودی عرب میں شاہ سعود کے مشیر کے طور پر گزارے؛ وفات ریاض میں ہوئی۔"
