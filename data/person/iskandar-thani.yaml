summary:
  ar: "إسكندر الثاني علاء الدين مغايات شاه ⁦(نحو 1610 – 15 شباط 1641)⁩، ثالث عشر سلاطين آتشيه. ابن سلطان بهانغ أحمد شاه الثاني، جُلب طفلًا إلى آتشيه بعد فتحها بهانغ سنة 1617، وتزوّج ابنة إسكندر مودا، بوتري سري علم — السلطانة تاج العالم لاحقًا — وخلف حماه سنة 1636. كان حاكمًا قويًا مركِّزًا للسلطة، وبلاطه مركزًا للعلم الشرعي برعايته نور الدين الرانيري منذ 1637، ومات سنة 1641 فخلَفته أرملته."
  en: "Iskandar Thani Alauddin Mughayat Syah (c. 1610 – 15 February 1641) was the thirteenth sultan of Aceh. A son of Sultan Ahmad Shah II of Pahang, he was brought as a child to Aceh after its conquest of Pahang in 1617, married Iskandar Muda's daughter Putri Sri Alam — the later Sultana Taj al-Alam — and succeeded his father-in-law in 1636. A strong, centralising ruler whose court was a centre of Islamic learning under his patronage of Nuruddin ar-Raniri from 1637, he died in 1641 and was succeeded by his widow."
  ur: "اسکندر ثانی علاء الدین مغایت شاہ ⁦(تقریباً 1610ء – 15 فروری 1641ء)⁩ آچے کے تیرہویں سلطان تھے۔ پہانگ کے سلطان احمد شاہ دوم کے بیٹے، 1617ء میں پہانگ کی فتح کے بعد بچپن میں آچے لائے گئے، اسکندر مودا کی بیٹی پوتری سری عالم — بعد کی سلطانہ تاج العالم — سے شادی کی اور 1636ء میں سسر کے جانشین ہوئے۔ طاقتور اور مرکزیت پسند حکمران، جن کا دربار 1637ء سے نور الدین الرانیری کی سرپرستی میں اسلامی علم کا مرکز رہا؛ 1641ء میں وفات پر ان کی بیوہ جانشین ہوئیں۔"
  es: "Iskandar Thani Alauddin Mughayat Syah (c. 1610 – 15 de febrero de 1641) fue el decimotercer sultán de Aceh. Hijo del sultán Ahmad Shah II de Pahang, fue llevado de niño a Aceh tras la conquista de Pahang en 1617, se casó con Putri Sri Alam, hija de Iskandar Muda —la futura sultana Taj al-Alam— y sucedió a su suegro en 1636. Gobernante fuerte y centralizador, cuya corte fue un centro de aprendizaje islámico bajo el patrocinio de Nuruddin ar-Raniri desde 1637, murió en 1641 y fue sucedido por su viuda."
  fr: "Iskandar Thani Alauddin Mughayat Syah (vers 1610 – 15 février 1641) fut le treizième sultan d'Aceh. Fils du sultan Ahmad Shah II de Pahang, il fut amené enfant à Aceh après la conquête de Pahang par cette dernière en 1617. Il épousa Putri Sri Alam, fille d'Iskandar Muda et future sultane Taj al-Alam, et succéda à son beau-père en 1636. Souverain fort et centralisateur, sa cour devint un centre d'études islamiques sous le patronage de Nuruddin ar-Raniri à partir de 1637. Il mourut en 1641 et sa veuve lui succéda."
  tr: "İskandar II Aladdin Maghayat Shah (yaklaşık 1610 – 15 Şubat 1641), Aceh'in on üçüncü Sultanıydı. Sultan Bahang Ahmad Shah II'nin oğlu olan Şah, 1617'de Hang'ın fethinden sonra Aceh'de bir çocuk sahibi oldu, Iskandar Muda'nın kızı Putri Sri Alam ile evlendi — daha sonra Sultan Taj Alam—ve 1636'da kayınvalidesinin yerine geçti. Güçlü bir hükümdar ve otorite merkeziydi; sarayı 1637'den itibaren himayesi altında dini bilgi merkezi oldu. 1641'de öldü ve onu dul bıraktı."
  id: "Iskandar II Aladdin Maghayat Shah (sekitar 1610 – 15 Februari 1641), adalah Sultan Aceh yang ketiga belas. Putra Sultan Bahang Ahmad Shah II, ia memiliki seorang anak di Aceh setelah penaklukan Hang pada tahun 1617, menikah dengan putri Iskandar Muda, Putri Sri Alam—yang kemudian menjadi Sultan Taj Alam—dan menggantikan ibu mertuanya pada tahun 1636. Ia adalah penguasa yang berkuasa dan pusat otoritas, dan istananya menjadi pusat ilmu keagamaan di bawah naungan Skandar sejak tahun 1637. Ia meninggal pada tahun 1641, meninggalkannya sebagai janda."

