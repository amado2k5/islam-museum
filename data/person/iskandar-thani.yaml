summary:
  ar: "إسكندر الثاني علاء الدين مغايات شاه (نحو 1610 – 15 شباط 1641)، ثالث عشر سلاطين آتشيه. ابن سلطان بهانغ أحمد شاه الثاني، جُلب طفلًا إلى آتشيه بعد فتحها بهانغ سنة 1617، وتزوّج ابنة إسكندر مودا، بوتري سري علم — السلطانة تاج العالم لاحقًا — وخلف حماه سنة 1636. كان حاكمًا قويًا مركِّزًا للسلطة، وبلاطه مركزًا للعلم الشرعي برعايته نور الدين الرانيري منذ 1637، ومات سنة 1641 فخلَفته أرملته."
  en: "Iskandar Thani Alauddin Mughayat Syah (c. 1610 – 15 February 1641) was the thirteenth sultan of Aceh. A son of Sultan Ahmad Shah II of Pahang, he was brought as a child to Aceh after its conquest of Pahang in 1617, married Iskandar Muda's daughter Putri Sri Alam — the later Sultana Taj al-Alam — and succeeded his father-in-law in 1636. A strong, centralising ruler whose court was a centre of Islamic learning under his patronage of Nuruddin ar-Raniri from 1637, he died in 1641 and was succeeded by his widow."
  ur: "اسکندر ثانی علاء الدین مغایت شاہ (تقریباً 1610ء – 15 فروری 1641ء) آچے کے تیرہویں سلطان تھے۔ پہانگ کے سلطان احمد شاہ دوم کے بیٹے، 1617ء میں پہانگ کی فتح کے بعد بچپن میں آچے لائے گئے، اسکندر مودا کی بیٹی پوتری سری عالم — بعد کی سلطانہ تاج العالم — سے شادی کی اور 1636ء میں سسر کے جانشین ہوئے۔ طاقتور اور مرکزیت پسند حکمران، جن کا دربار 1637ء سے نور الدین الرانیری کی سرپرستی میں اسلامی علم کا مرکز رہا؛ 1641ء میں وفات پر ان کی بیوہ جانشین ہوئیں۔"

