summary:
  ar: "مدرب كرة قدم جزائري ولاعب سابق ⁦(وُلد سنة 1976 في شامبيني سور مارن بفرنسا)⁩. لاعب وسط مثّل الجزائر في عشرين مباراة دولية ولعب لأندية أوروبية عدة منها باريس سان جيرمان ومرسيليا ومانشستر سيتي؛ كمدرب فاز بلقبي دوري نجوم قطر مع لخويا ⁦(الدحيل الآن)⁩، وقاد الجزائر إلى لقب كأس أمم أفريقيا 2019، وعاد إلى الدحيل سنة 2025."
  en: "Algerian football manager and former player (born 1976 in Champigny-sur-Marne, France). A midfielder capped twenty times by Algeria who played for Paris Saint-Germain, Marseille, Manchester City and others; as a manager he won two Qatar Stars League titles with Lekhwiya (now Al-Duhail), led Algeria to the 2019 Africa Cup of Nations title, and returned to Al-Duhail in 2025."
  ur: "الجزائر کے فٹبال مینیجر اور سابق کھلاڑی ⁦(پیدائش 1976، شامپینی سور مارن، فرانس)⁩۔ مڈفیلڈر کی حیثیت سے الجزائر کے لیے بیس میچ کھیلے اور پیرس سینٹ جرمین، مارسیل، مانچسٹر سٹی وغیرہ کے لیے کھیلے؛ مینیجر کی حیثیت سے لخويا ⁦(موجودہ الدحیل)⁩ کے ساتھ دو قطر اسٹارز لیگ خطابات جیتے، الجزائر کو 2019 افریقہ کپ آف نیشنز دلایا، اور 2025 میں الدحیل واپس آئے۔"
  es: "Entrenador y exfutbolista argelino (nacido en 1976 en Champigny-sur-Marne, Francia). Fue centrocampista internacional con Argelia en veinte ocasiones y jugó en equipos como el Paris Saint-Germain, el Marsella y el Manchester City, entre otros. Como entrenador, ganó dos títulos de la Liga de las Estrellas de Catar con el Lekhwiya (actualmente Al-Duhail), llevó a Argelia a conquistar la Copa Africana de Naciones de 2019 y regresó al Al-Duhail en 2025."
  fr: "Entraîneur et ancien joueur algérien (né en 1976 à Champigny-sur-Marne, France). Milieu de terrain international algérien à vingt reprises, il a évolué notamment au Paris Saint-Germain, à Marseille et à Manchester City. En tant qu'entraîneur, il a remporté deux titres de champion du Qatar avec Lekhwiya (aujourd'hui Al-Duhail), a mené l'Algérie à la victoire lors de la Coupe d'Afrique des Nations 2019 et est retourné à Al-Duhail en 2025."
  tr: "Cezayirli futbol antrenörü ve eski oyuncu (1976'da Fransa'nın Champagne-sur-Marne kentinde doğdu). Cezayir'i yirmi uluslararası maçta temsil eden ve Paris Saint-Germain, Marsilya ve Manchester City dahil olmak üzere birçok Avrupa kulübünde oynamış bir orta saha oyuncusu; antrenör olarak Lekhwiya (şimdiki Al-Duhail) ile iki Katar Yıldızlar Ligi şampiyonluğu kazandı, Cezayir'i 2019 Afrika Uluslar Kupası şampiyonluğuna taşıdı ve 2025'te Al-Duhail'e geri döndü."
  id: "Seorang pelatih sepak bola Aljazair dan mantan pemain (lahir tahun 1976 di Champagne-sur-Marne, Prancis). Gelandang yang mewakili Aljazair dalam dua puluh pertandingan internasional dan bermain untuk beberapa klub Eropa termasuk Paris Saint-Germain, Marseille, dan Manchester City; sebagai pelatih, ia memenangkan dua gelar Qatar Stars League bersama Lekhwiya (sekarang Al-Duhail), memimpin Aljazair meraih gelar Piala Afrika 2019, dan kembali ke Al-Duhail pada tahun 2025."
