summary:
  ar: "مدرب كرة قدم جزائري ولاعب سابق (وُلد سنة 1976 في شامبيني سور مارن بفرنسا). لاعب وسط مثّل الجزائر في عشرين مباراة دولية ولعب لأندية أوروبية عدة منها باريس سان جيرمان ومرسيليا ومانشستر سيتي؛ كمدرب فاز بلقبي دوري نجوم قطر مع لخويا (الدحيل الآن)، وقاد الجزائر إلى لقب كأس أمم أفريقيا 2019، وعاد إلى الدحيل سنة 2025."
  en: "Algerian football manager and former player (born 1976 in Champigny-sur-Marne, France). A midfielder capped twenty times by Algeria who played for Paris Saint-Germain, Marseille, Manchester City and others; as a manager he won two Qatar Stars League titles with Lekhwiya (now Al-Duhail), led Algeria to the 2019 Africa Cup of Nations title, and returned to Al-Duhail in 2025."
  ur: "الجزائر کے فٹبال مینیجر اور سابق کھلاڑی (پیدائش 1976، شامپینی سور مارن، فرانس)۔ مڈفیلڈر کی حیثیت سے الجزائر کے لیے بیس میچ کھیلے اور پیرس سینٹ جرمین، مارسیل، مانچسٹر سٹی وغیرہ کے لیے کھیلے؛ مینیجر کی حیثیت سے لخويا (موجودہ الدحیل) کے ساتھ دو قطر اسٹارز لیگ خطابات جیتے، الجزائر کو 2019 افریقہ کپ آف نیشنز دلایا، اور 2025 میں الدحیل واپس آئے۔"
