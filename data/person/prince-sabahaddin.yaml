summary:
  ar: "الأمير محمد صباح الدين (وُلد في إسطنبول في 13 فبراير 1879 – توفي في نوشاتيل بسويسرا في 30 يونيو 1948)، أمير عثماني وعالم اجتماع ومفكر ليبرالي، ابن السلطانة سنيحة بنت السلطان عبد المجيد الأول، أسّس جمعية التشبّث الشخصي وعدم المركزية وحزب الأحرار، وقاد المعارضة الليبرالية للاتحاد والترقي، ونُفي عن بلاده مرات."
  en: "Prince Mehmed Sabahaddin (born in Istanbul on 13 February 1879 – died at Neuchâtel, Switzerland, on 30 June 1948) was an Ottoman prince, sociologist and liberal thinker, son of Seniha Sultan, daughter of Sultan Abdülmecid I. He founded the League of Private Initiative and Decentralization and the Liberty Party, led the liberal opposition to the Committee of Union and Progress, and was repeatedly exiled."
  ur: "شہزادہ محمد صباح الدین (پیدائش: استنبول، 13 فروری 1879ء – وفات: نوشاتیل، سوئٹزرلینڈ، 30 جون 1948ء)، عثمانی شہزادے، ماہرِ سماجیات اور لبرل مفکر؛ سلطان عبدالمجید اول کی صاحبزادی سنیحہ سلطان کے بیٹے؛ «تشبُّثِ شخصی و عدمِ مرکزیت» کی انجمن اور احرار پارٹی کے بانی، اتحاد و ترقی کے لبرل مخالف اور بارہا جلاوطن رہے۔"
