label: { ar: "الخياط المنجم", en: "Al Khayyat Al Munajjim" }
summary:
  ar: "أبو علي الخياط يحيى بن غالب وقيل إسماعيل بن محمد تلميذ ماشاء الله من أفاضل المنجمين، وله كتاب المدخل وكتاب المسائل وكتاب المعاني وكتاب الدول وكتاب المواليد وكتاب تحويل سني المواليد وكتاب المنثور عمله ليحيى بن خالد وكتاب قضيب الذهب وكتاب تحاويل سني العالم وكتاب النكت {cite:fihrist-ibn-al-nadim p. 385-386}."
  en: "Abu Ali al-Khayyat — Masha'allah's pupil, court astrologer to Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
