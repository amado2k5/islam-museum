id: person/al-khayyat-al-munajjim
class: person
label: { ar: "الخياط المنجم", en: "Al Khayyat Al Munajjim", es: "Al Khayyat Al Munajjim", fr: "Al Khayyat Al Munajjim", ur: "الخیاط المنجم" }
summary:
  ar: "أبو علي الخياط يحيى بن غالب وقيل إسماعيل بن محمد تلميذ ماشاء الله من أفاضل المنجمين، وله كتاب المدخل وكتاب المسائل وكتاب المعاني وكتاب الدول وكتاب المواليد وكتاب تحويل سني المواليد وكتاب المنثور عمله ليحيى بن خالد وكتاب قضيب الذهب وكتاب تحاويل سني العالم وكتاب النكت {cite:fihrist-ibn-al-nadim p. 385-386}."
  en: "Abu Ali al-Khayyat — Masha'allah's pupil, court astrologer to Yahya al-Barmaki {cite:fihrist-ibn-al-nadim}"
  es: "Abu Ali al-Khayyat - alumno de Masha'allah, astrólogo de la corte de Yahya al-Barmaki {cita:fihrist-ibn-al-nadim}"
  fr: "Abu Ali al-Khayyat - élève de Masha'allah, astrologue de la cour de Yahya al-Barmaki {cite: fihrist-ibn-al-nadim}"
  ur: "ابو علی الخیاط - ماشاء اللہ کے شاگرد، یحییٰ البرمکی کے درباری نجومی"
  tr: "Ebu Ali el-Xeyyet Yahya bin Ghalib ya da denilen adı altında İsmail bin Muhammed, seçkin astrologlardan biri olan Maşallah'ın öğrencisiydi. Al-Madkhal, Kitab al-Masa'il, Kitab al-Ma'ani, Kitab al-Duwal, Kitab al-Mawalid, Kitab al-Muwlid, Kitab al-Manthur, Yahya ibn Khalid'in eserleri, Kitab al-Dhahab, Kitab Tahawil Sunni al-Alam ve Kitab al-Nukat {cite:fihrist-ibn-al-nadim s. 385-386} adlı kitabı yazdı."
  id: "Abu Ali al-Khayyat Yahya ibn Ghalib, atau disebut Ismail ibn Muhammad, adalah murid Mashallah, salah satu ahli astrologi terkemuka. Ia menulis buku Al-Madkhal, Kitab al-Masa'il, Kitab al-Ma'ani, Kitab al-Duwal, Kitab al-Mawalid, Kitab al-Muwlid, Kitab al-Manthur, karyanya oleh Yahya ibn Khalid, Kitab al-Dhahab, Kitab Tahawil Sunni al-Al-Alam, dan Kitab al-Nukat {cite:fihrist-ibn-al-nadim hlm. 385-386}."
