summary:
  ar: "الخارجي الذي أخبر النبي أنه يقتل في المارقين، طلبه علي بعد النهروان في القتلى فقيل له ما أصبنا شيئاً فقال والله لقد قتل في يومه هذا وما كذبني رسول الله ولا كذبت عليه قوموا بجمعكم فاطلبوه فأصابوه في دهاس من الأرض فوقه زهاء مائة قتيل فأخرجوه يجر برجله {cite:muruj-al-dhahab p. 48}."
  en: "The Kharijite foretold to fall among the Mariqi — Ali would not accept 'we found nothing', sent the whole company back into the slain, and he was dragged from beneath a hundred corpses in a hollow {cite:muruj-al-dhahab p. 48}."
  es: "El jariyita predijo que caería entre los mariqi; Ali no aceptó \"no encontramos nada\", envió a toda la compañía de vuelta a los muertos y fue arrastrado de debajo de cien cadáveres en un hueco {cite:muruj-al-dhahab p. 48}."
  fr: "Le Kharijite prédit tomber parmi les Mariqi — Ali n'accepta pas « nous n'avons rien trouvé », renvoya toute la compagnie dans le massacre, et il fut traîné sous une centaine de cadavres dans un creux {cite:muruj-al-dhahab p. 48}."
  ur: "خارجی نے مرقی کے درمیان گرنے کی پیشین گوئی کی تھی - علی قبول نہیں کرے گا 'ہمیں کچھ نہیں ملا'، پوری کمپنی کو مقتول میں واپس بھیج دیا، اور اسے ایک کھوکھلی میں سو لاشوں کے نیچے سے گھسیٹا گیا۔ 48}۔"
