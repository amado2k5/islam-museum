summary:
  ar: "السلطان إبراهيم بن أحمد؛ تولى الحكم وأحوال الدولة مضطربة، وفي عهده جهز العثمانيون الجيوش والأسطول وأعلنوا الحرب على البنادقة التي كانت تهيمن على جزيرة كريت والحركة التجارية في بحر إيجة، فاعتُقل جميع البنادقة في طول البلاد وعرضها وصودرت أموالهم وسيّرت حملة إلى جزيرة كريت عام ١٠٥٥هـ/١٦٤٥م فاستولت على أجزاء منها. لكن الجنود تمردوا في استانبول وقرروا عزله وتولية ابنه محمد الرابع الذي لم يتم السابعة من عمره، فقُتل إبراهيم وقد امتد حكمه ثماني سنين وتسعة أشهر وكان عمره أربعاً وثلاثين سنة {cite:dawlat-uthmaniyya-salabi p. 307}."
  en: "Ibrahim I (r. 1640–1648) — opened the long Cretan war against Venice in 1645 by seizing Venetian goods and shipping a fleet to Crete; deposed and killed in the Istanbul mutiny that enthroned his seven-year-old son Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307}."
