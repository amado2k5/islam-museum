summary:
  ar: "السلطان إبراهيم بن أحمد؛ تولى الحكم وأحوال الدولة مضطربة، وفي عهده جهز العثمانيون الجيوش والأسطول وأعلنوا الحرب على البنادقة التي كانت تهيمن على جزيرة كريت والحركة التجارية في بحر إيجة، فاعتُقل جميع البنادقة في طول البلاد وعرضها وصودرت أموالهم وسيّرت حملة إلى جزيرة كريت عام ١٠٥٥هـ/١٦٤٥م فاستولت على أجزاء منها. لكن الجنود تمردوا في استانبول وقرروا عزله وتولية ابنه محمد الرابع الذي لم يتم السابعة من عمره، فقُتل إبراهيم وقد امتد حكمه ثماني سنين وتسعة أشهر وكان عمره أربعاً وثلاثين سنة {cite:dawlat-uthmaniyya-salabi p. 307}."
  en: "Ibrahim I (r. 1640–1648) — opened the long Cretan war against Venice in 1645 by seizing Venetian goods and shipping a fleet to Crete; deposed and killed in the Istanbul mutiny that enthroned his seven-year-old son Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307}."
  es: "Ibrahim I (r. 1640–1648) — inició la larga guerra cretense contra Venecia en 1645 al apoderarse de bienes venecianos y enviar una flota a Creta; fue depuesto y asesinado en el motín de Estambul que entronizó a su hijo de siete años, Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307}."
  fr: "Ibrahim Ier (r. 1640–1648) — a ouvert la longue guerre crétoise contre Venise en 1645 en s'emparant des biens vénitiens et en envoyant une flotte en Crète; déposé et tué lors de la mutinerie d'Istanbul qui a porté sur le trône son fils de sept ans, Mehmed IV {cite:dawlat-uthmaniyya-salabi p. 307}."
  ur: "ابراہیم اول (r. 1640-1648) - 1645 میں وینس کے خلاف طویل کریٹن جنگ کا آغاز کیا جس میں وینس کے سامان پر قبضہ کر کے اور ایک بحری بیڑا کریٹ بھیج دیا۔ استنبول کی بغاوت میں معزول اور مارا گیا جس نے اپنے سات سالہ بیٹے محمد چہارم کو تخت نشین کیا۔ 307}۔"
  tr: "Sultan İbrahim bin Ahmad, devlet karışıklık içindeyken iktidara geldi. Saltanatı sırasında Osmanlılar ordular ve donatmalar yaptı, Venediklilere savaş ilan etti; Venedikliler Girit'i ve Ege Denizi'nde ticareti domine ediyordu. Ülke genelindeki tüm Venediklileri tutukladı, paralarına el koydu ve 1055 Hicri / 1645 yılında Girit'e bir sefer düzenleyerek ordunun bir kısmını ele geçirdi. Ancak askerler İstanbul'da isyan etti ve onu tahttan indirip henüz yedi yaşına girmemiş oğlu Mehmed IV'ü atamaya karar verdiler. İbrahim öldürüldü ve hükümdarlığı sekiz yıl dokuz ay sürdü, otuz dört yaşındaydı."
  id: "Sultan Ibrahim ibn Ahmad mengambil alih kekuasaan saat negara sedang kacau. Selama pemerintahannya, Ottoman melengkapi pasukan dan armada serta menyatakan perang terhadap orang Venesia, yang menguasai Kreta dan perdagangan di Laut Aegea. Ia menangkap semua orang Venesia di seluruh negeri, menyita uang mereka, dan melancarkan kampanye ke Kreta pada tahun 1055 H / 1645 M, merebut sebagian wilayah tersebut. Namun, para tentara memberontak di Istanbul dan memutuskan untuk menggulingkannya serta mengangkat putranya Mehmed IV, yang belum genap tujuh tahun. Ibrahim tewas, dan pemerintahannya berlangsung delapan tahun sembilan bulan, dan usianya tiga puluh empat tahun."
