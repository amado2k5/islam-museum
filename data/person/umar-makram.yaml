summary:
  ar: "السيد عمر مكرم، نحو 1755-1822م، زعيم شعبي في القاهرة بين 1791 و1809، ونقيب الأشراف في مصر منذ نوفمبر 1793. نظّم مقاومة شعبية للفرنسيين، وشارك في تولية محمد علي سنة 1805، ثم عارض مطالبه الضريبية فنُفي إلى دمياط سنة 1809 وإلى طنطا، وتوفي هناك سنة 1822 {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  en: "Al-Sayyid Umar Makram, c. 1755-1822, was the charismatic leader of the common people in Cairo between 1791 and 1809 and naqib al-ashraf of Egypt from November 1793. He helped organise popular resistance to the French, took part in making Muhammad Ali governor in 1805, then opposed his tax demands and was banished to Damietta in 1809 and later to Tanta, where he died in 1822 {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  ur: "السید عمر مکرم، تقریباً 1755ء تا 1822ء، 1791ء سے 1809ء تک قاہرہ کے عوام کے کرشماتی رہنما اور نومبر 1793ء سے مصر کے نقیب الاشراف تھے۔ انہوں نے فرانسیسیوں کے خلاف عوامی مزاحمت منظم کرنے میں مدد کی، 1805ء میں محمد علی کو والی بنانے میں حصہ لیا، پھر ان کے محصولات کے مطالبات کی مخالفت کی تو 1809ء میں دمیاط اور بعد میں طنطا جلاوطن ہوئے جہاں 1822ء میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  es: "Al-Sayyid Umar Makram, c. 1755-1822, fue el carismático líder del pueblo llano en El Cairo entre 1791 y 1809 y naqib al-ashraf de Egipto desde noviembre de 1793. Ayudó a organizar la resistencia popular contra los franceses, participó en la elección de Muhammad Ali como gobernador en 1805, luego se opuso a sus demandas fiscales y fue desterrado a Damietta en 1809 y más tarde a Tanta, donde murió en 1822 {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  fr: "Al-Sayyid Umar Makram, v. 1755-1822, fut le chef charismatique du peuple du Caire entre 1791 et 1809 et naqib al-ashraf d'Égypte à partir de novembre 1793. Il aida à organiser la résistance populaire contre les Français, participa à la nomination de Muhammad Ali comme gouverneur en 1805, puis s'opposa à ses demandes fiscales et fut banni à Damiette en 1809 et plus tard à Tanta, où il mourut en 1822 {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  tr: "Sayyid Omar Makram, yaklaşık 1755-1822, 1791 ile 1809 yılları arasında Kahire'de popüler bir liderdi ve Kasım 1793'ten beri Mısır'daki Ashraf Sendikası'nın başındaydı. Fransızlara karşı halk direnişini organize etti ve 1805'te Muhammed Ali'nin atanmasına katıldı, ardından vergi taleplerine karşı çıktı ve 1809'da Damietta'ya, ardından 1822'de öldüğü Tanta'ya sürgüne gitti {cite:Encyclopaedia-of-Islam-2 cilt 10, s. 889}."
  id: "Sayyid Omar Makram, sekitar tahun 1755-1822, adalah seorang pemimpin populer di Kairo antara tahun 1791 dan 1809, serta kepala Sindikat Ashraf di Mesir sejak November 1793. Ia mengorganisir perlawanan rakyat terhadap Prancis dan ikut serta dalam pengangkatan Muhammad Ali pada tahun 1805, kemudian menentang tuntutan pajaknya, yang membawanya ke pengasingan ke Damietta pada tahun 1809 dan ke Tanta, di mana ia meninggal pada tahun 1822 {cite:Encyclopaedia-of-Islam-2 vol. 10, hlm. 889}."
