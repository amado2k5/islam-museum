summary:
  ar: "السيد عمر مكرم، نحو 1755-1822م، زعيم شعبي في القاهرة بين 1791 و1809، ونقيب الأشراف في مصر منذ نوفمبر 1793. نظّم مقاومة شعبية للفرنسيين، وشارك في تولية محمد علي سنة 1805، ثم عارض مطالبه الضريبية فنُفي إلى دمياط سنة 1809 وإلى طنطا، وتوفي هناك سنة 1822 {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  en: "Al-Sayyid Umar Makram, c. 1755-1822, was the charismatic leader of the common people in Cairo between 1791 and 1809 and naqib al-ashraf of Egypt from November 1793. He helped organise popular resistance to the French, took part in making Muhammad Ali governor in 1805, then opposed his tax demands and was banished to Damietta in 1809 and later to Tanta, where he died in 1822 {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
  ur: "السید عمر مکرم، تقریباً 1755ء تا 1822ء، 1791ء سے 1809ء تک قاہرہ کے عوام کے کرشماتی رہنما اور نومبر 1793ء سے مصر کے نقیب الاشراف تھے۔ انہوں نے فرانسیسیوں کے خلاف عوامی مزاحمت منظم کرنے میں مدد کی، 1805ء میں محمد علی کو والی بنانے میں حصہ لیا، پھر ان کے محصولات کے مطالبات کی مخالفت کی تو 1809ء میں دمیاط اور بعد میں طنطا جلاوطن ہوئے جہاں 1822ء میں فوت ہوئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 889}."
