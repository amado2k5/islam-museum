  tr: "Ya'qub bin Tariq, seçkin astrologlardan biridir. 'Cep İplerini Kesmek', 'Yarım Gün Kemerinden Yükselen' ve 'Zej' adlı kitapları yazmıştır; bu kitap zincirde 'Djed' derecesine (astronomi diploması) kadar çözülür; ikincisi astronomi üzerine ve devlet bilimi üzerine ikinci kitaptır {atıf:Fihrist-ibn-al-Nadim s. 388}."
  id: "Ya'qub ibn Tariq adalah salah satu astrolog terkemuka. Ia menulis buku 'Memotong Tali Saku,' 'Apa yang Terangkat dari Lengkungan Setengah Hari,' dan 'The Zij,' yang larut dalam rantai hingga tingkat 'Djed' (gelar dalam astronomi), yang kedua tentang astronomi dan yang kedua tentang ilmu keadaan {cite:fihrist-ibn-al-nadim hlm. 388}."
