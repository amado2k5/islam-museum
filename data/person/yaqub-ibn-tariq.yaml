  ar: "يعقوب بن طارق من أفاضل المنجمين، وله كتاب تقطيع كردجات الجيب وكتاب ما ارتفع من قوس نصف النهار وكتاب الزيج محلول في السندهند لدرجة درجة وهو كتابان الأول في علم الفلك والثاني في علم الدول {cite:fihrist-ibn-al-nadim p. 388}."
