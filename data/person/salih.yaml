summary:
  ar: "نبي ثمود. عند البخاري أن النبي لما مر بالحجر — مساكن ثمود — في غزوة تبوك قال «لا تدخلوا مساكن الذين ظلموا أنفسهم إلا أن تكونوا باكين أن يصيبكم ما أصابهم» ثم تقنع بردائه وهو على الرحل {cite:sahih-al-bukhari 3380} {cite:sahih-al-bukhari 3381}."
  en: "Thamud's prophet — the Prophet passed their dwellings at al-Hijr on the Tabuk road and forbade entering them except weeping {cite:sahih-al-bukhari 3380}."
