summary:
  ar: "صلى على معاوية بن يزيد ليكون الأمر له من بعده، فلما كبر الثانية طعن فسقط ميتاً قبل تمام الصلاة {cite:muruj-al-dhahab p. 70}."
  en: "He led Mu'awiya II's funeral prayer hoping for the succession — and was stabbed dead at the second takbir before the prayer ended {cite:muruj-al-dhahab p. 70}."
  fr: "Il dirigea la prière funèbre de Mu'awiya II dans l'espoir de la succession - et fut poignardé mort au deuxième takbir avant la fin de la prière {cite:muruj-al-dhahab p. 70}."
  es: "Dirigió la oración fúnebre de Mu'awiya II con la esperanza de la sucesión, y fue apuñalado mortalmente en el segundo takbir antes de que terminara la oración {cite:muruj-al-dhahab p. 70}."
  ur: "اس نے جانشینی کی امید میں معاویہ دوم کی نماز جنازہ پڑھائی - اور نماز ختم ہونے سے پہلے دوسری تکبیر پر چاقو کے وار کر کے ہلاک کر دیا گیا۔ 70}۔"
  tr: "Emrin kendisinden sonra kendisi olması için Muaviye ibn Yezid üzerinde dua etti. İkinci kez büyüdüğünde, bıçaklandı ve namazı tamamlamadan önce yere yığıldı {atıf:Muruj-al-Dhahab, s. 70}."
  id: "Ia berdoa untuk Muawiyah ibn Yazid agar perintah itu diterima setelahnya. Ketika ia dewasa untuk kedua kalinya, ia ditusuk dan jatuh mati sebelum menyelesaikan solat {cite:muruj-al-dhahab, hlm. 70}."
