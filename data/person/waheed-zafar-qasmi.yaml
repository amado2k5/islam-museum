summary:
  ar: "قارئ قرآن وناعت باكستاني، شقيق القارئين ظاهر قاسمي وشاكر قاسمي. بدأ القراءة في السابعة من عمره، وفاز بمسابقات دولية في ماليزيا (1969) وليبيا (1979) والسعودية (1980) وسوريا (1981)، وارتبط بإذاعة باكستان وتلفزيونها، ونال تمغة حسن الأداء سنة 1984، وهو مقيم في كراتشي."
  en: "Pakistani Qur'an reciter and naat singer, brother of the reciters Zahir Qasmi and Shakir Qasmi. He began reciting at the age of seven and won international recitation competitions in Malaysia (1969), Libya (1979), Saudi Arabia (1980) and Syria (1981); he worked with Radio Pakistan and PTV, received the Pride of Performance in 1984, and lives in Karachi."
  ur: "پاکستانی قاریِ قرآن اور نعت خواں، قاری ظاہر قاسمی اور قاری شاکر قاسمی کے بھائی۔ انھوں نے سات سال کی عمر میں قراءت شروع کی اور ملائیشیا (1969ء)، لیبیا (1979ء)، سعودی عرب (1980ء) اور شام (1981ء) میں بین الاقوامی مقابلے جیتے؛ ریڈیو پاکستان اور پی ٹی وی سے وابستہ رہے، 1984ء میں تمغائے حسنِ کارکردگی ملا، اور وہ کراچی میں مقیم ہیں۔"
