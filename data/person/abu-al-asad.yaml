  ar: "مولى أمير المؤمنين وقائد من قواد المنصور؛ عند البلاذري وجه إلى البصرة أيام مقام عبد الله بن علي بها وهو الذي أدخل عبد الله بن علي الكوفة وحفر النهر المعروف بأبي أسد عند البطيحة حين عسكر بينه وبين عسكر عيسى بن موسى وهو يحارب إبراهيم بن عبد الله بن الحسن."
  en: "al-Mansur's mawla-commander; in al-Baladhuri sent to Basra during Abdallah ibn Ali's stay there and the one who brought him into Kufa — he dug Nahr Abi al-Asad at the Batayih while camped opposite Isa ibn Musa's force in the war on Ibrahim ibn Abdallah al-Hasani."
