class: person
label: { ar: "أبو الأسد", en: "Abu al-Asad", fr: "Abu al-Asad", es: "Abu al-Asad", ur: "ابو الاسد" }
summary:
  ar: "مولى أمير المؤمنين وقائد من قواد المنصور؛ عند البلاذري وجه إلى البصرة أيام مقام عبد الله بن علي بها وهو الذي أدخل عبد الله بن علي الكوفة وحفر النهر المعروف بأبي أسد عند البطيحة حين عسكر بينه وبين عسكر عيسى بن موسى وهو يحارب إبراهيم بن عبد الله بن الحسن."
  en: "al-Mansur's mawla-commander; in al-Baladhuri sent to Basra during Abdallah ibn Ali's stay there and the one who brought him into Kufa — he dug Nahr Abi al-Asad at the Batayih while camped opposite Isa ibn Musa's force in the war on Ibrahim ibn Abdallah al-Hasani."
  fr: "Affranchi et commandant d'al-Mansur ; chez al-Baladhuri, envoyé à Bassora pendant le séjour d'Abdallah ibn Ali et celui qui le fit entrer à Koufa — il creusa le Nahr Abi al-Asad dans les Bata'ih alors qu'il campait face à l'armée d'Isa ibn Musa, dans la guerre contre Ibrahim ibn Abdallah al-Hasani."
  es: "El mawla-comandante de al-Mansur; en al-Baladhuri fue enviado a Basora durante la estancia de Abdallah ibn Ali allí y fue quien lo llevó a Kufa; cavó Nahr Abi al-Asad en Batayih mientras acampaba frente a las fuerzas de Isa ibn Musa en la guerra contra Ibrahim ibn Abdallah al-Hasani."
  ur: "المنصور کا مولا کمانڈر؛ البلادوری میں عبداللہ ابن علی کے وہاں قیام کے دوران بصرہ بھیجا اور جس نے انہیں کوفہ میں لایا - اس نے بطیح میں نہر ابی الاسد کو کھود کر ابراہیم بن عبداللہ الحسنی کے خلاف جنگ میں عیسیٰ بن موسیٰ کی فوج کے سامنے پڑاؤ ڈالا۔"
