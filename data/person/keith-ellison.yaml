summary:
  ar: "محامٍ وسياسي أمريكي من حزب منيسوتا الديمقراطي-الفلاحي-العمالي، وُلد في ديترويت سنة 1963 ونشأ كاثوليكيًا ثم اعتنق الإسلام أثناء دراسته الجامعية. كان أول مسلم يُنتخب لكونغرس الولايات المتحدة (2007–2019) وأول أمريكي أفريقي يمثل منيسوتا فيه، وشارك في رئاسة الكتلة التقدمية، ثم أصبح سنة 2019 المدعي العام لمنيسوتا فكان أول مسلم يفوز بمنصب على مستوى ولاية أمريكية بأكملها."
  en: "American lawyer and Democratic-Farmer-Labor politician, born in Detroit in 1963, raised Catholic and converted to Islam while at university. He was the first Muslim elected to the United States Congress (2007–2019) and the first African American to represent Minnesota there, co-chaired the Congressional Progressive Caucus, and in 2019 became attorney general of Minnesota — the first Muslim in the United States to win statewide office."
  ur: "امریکی وکیل اور ڈیموکریٹک سیاست دان، جو 1963 میں ڈیٹرائٹ میں پیدا ہوئے، کیتھولک ماحول میں پرورش پائی اور یونیورسٹی کے دوران اسلام قبول کیا۔ وہ امریکی کانگریس کے لیے منتخب ہونے والے پہلے مسلمان تھے (2007ء–2019ء)، کانگریشنل پروگریسو کاکس کے شریک صدر رہے، اور 2019 میں منی سوٹا کے اٹارنی جنرل بنے — امریکہ میں ریاستی سطح کا عہدہ جیتنے والے پہلے مسلمان۔"
