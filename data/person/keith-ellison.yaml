summary:
  ar: "محامٍ وسياسي أمريكي من حزب منيسوتا الديمقراطي-الفلاحي-العمالي، وُلد في ديترويت سنة 1963 ونشأ كاثوليكيًا ثم اعتنق الإسلام أثناء دراسته الجامعية. كان أول مسلم يُنتخب لكونغرس الولايات المتحدة (2007–2019) وأول أمريكي أفريقي يمثل منيسوتا فيه، وشارك في رئاسة الكتلة التقدمية، ثم أصبح سنة 2019 المدعي العام لمنيسوتا فكان أول مسلم يفوز بمنصب على مستوى ولاية أمريكية بأكملها."
  en: "American lawyer and Democratic-Farmer-Labor politician, born in Detroit in 1963, raised Catholic and converted to Islam while at university. He was the first Muslim elected to the United States Congress (2007–2019) and the first African American to represent Minnesota there, co-chaired the Congressional Progressive Caucus, and in 2019 became attorney general of Minnesota — the first Muslim in the United States to win statewide office."
  ur: "امریکی وکیل اور ڈیموکریٹک سیاست دان، جو 1963 میں ڈیٹرائٹ میں پیدا ہوئے، کیتھولک ماحول میں پرورش پائی اور یونیورسٹی کے دوران اسلام قبول کیا۔ وہ امریکی کانگریس کے لیے منتخب ہونے والے پہلے مسلمان تھے ⁦(2007ء–2019ء)⁩، کانگریشنل پروگریسو کاکس کے شریک صدر رہے، اور 2019 میں منی سوٹا کے اٹارنی جنرل بنے — امریکہ میں ریاستی سطح کا عہدہ جیتنے والے پہلے مسلمان۔"
  es: "Abogado estadounidense y político del Partido Demócrata-Agrario-Laborista, nacido en Detroit en 1963, fue criado en la fe católica y se convirtió al islam durante su etapa universitaria. Fue el primer musulmán elegido al Congreso de los Estados Unidos (2007-2019) y el primer afroamericano en representar a Minnesota en dicho congreso. Copresidió el Caucus Progresista del Congreso y, en 2019, se convirtió en fiscal general de Minnesota, siendo el primer musulmán en los Estados Unidos en ganar un cargo estatal."
  fr: "Avocat et homme politique américain du Parti démocrate-paysan-ouvrier (DFL), né à Détroit en 1963, il a été élevé dans la religion catholique et s'est converti à l'islam pendant ses études universitaires. Il a été le premier musulman élu au Congrès des États-Unis (2007-2019) et le premier Afro-Américain à y représenter le Minnesota. Il a coprésidé le Caucus progressiste du Congrès et est devenu, en 2019, procureur général du Minnesota, devenant ainsi le premier musulman aux États-Unis à occuper une fonction à l'échelle de l'État."
  tr: "Minnesota Demokrat-Tarım-İşçi Partisi'nden Amerikalı bir avukat ve politikacı, 1963'te Detroit'te doğmuş, Katolik olarak yetişmiş ve üniversite eğitimi sırasında İslam'a geçmiştir. Amerika Birleşik Devletleri Kongresi'ne seçilen ilk Müslüman (2007–2019) ve Minnesota'yı temsil eden ilk Afrikalı Amerikalı olmuştur. Ayrıca İlerici Grup'a başkanlık etti, ardından 2019'da Minnesota Başsavcısı oldu ve tüm ABD eyaletinde bir görev üstlenen ilk Müslüman oldu."
  id: "Seorang pengacara dan politisi Amerika dari Partai Demokrat-Agraria-Buruh Minnesota, lahir di Detroit pada tahun 1963, dibesarkan sebagai Katolik, dan kemudian memeluk Islam selama studi universitasnya. Ia adalah Muslim pertama yang terpilih ke Kongres Amerika Serikat (2007–2019) dan orang Afrika-Amerika pertama yang mewakili Minnesota di sana. Ia juga memimpin Progressive Caucus, lalu pada tahun 2019 menjadi Jaksa Agung Minnesota, menjadi Muslim pertama yang memegang jabatan di tingkat seluruh negara bagian AS."
