summary:
  ar: "بطاقة أولية لرفيع الدرجات، إمبراطور مغولي لأشهر سنة 1719 تحت السيدين، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Rafi ud-Darajat, Mughal emperor for months of 1719 under the Sayyid brothers, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Rafi ud-Darajat, emperador mogol durante los meses de 1719 bajo los hermanos Sayyid, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de convocation de Rafi ud-Darajat, empereur moghol pour les mois de 1719 sous les frères Sayyid, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "سید برادران کے تحت 1719 کے مہینوں کے لیے مغل شہنشاہ رفیع الدراجات کے لیے ڈرافٹ کارڈ، جس کا نام کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "1719 ayları için iki lordun yönetiminde yüksek rütbeli bir Moğol imparatoru için ön kart, açık bir referans tanımında (Wikidata) bahsedilmiştir. Hassan İbrahim'in İslam Tarihi'ndeki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu pendahuluan untuk seorang pejabat tinggi, kaisar Mongol untuk bulan 1719 di bawah dua penguasa, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
