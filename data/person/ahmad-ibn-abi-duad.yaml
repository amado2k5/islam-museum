label: { ar: "أحمد بن أبي دؤاد" }
summary:
  ar: "قاضي المعتصم، قال كان المعتصم يخرج ساعده إلي ويقول يا أبا عبد الله عض ساعدي بأكثر قوتك فأمتنع فيقول إنه لا يضرني فأروم ذلك فإذا هو لا تعمل فيه الأسنة فضلاً عن الأسنان {cite:tarikh-khulafa-minhaj-1434 p. 521} وعند السيوطي استولى على الواثق وحمله على التشدد في المحنة ودعا الناس إلى القول بخلق القرآن ويقال إنه رجع عنه قبل موته، ومقته الواثق يوم أقام عليه الشيخ الأزدي الحجة {cite:tarikh-khulafa-minhaj-1434 p. 531}."
  en: "Al-Mu'tasim's judge; he reported the caliph would bare his forearm — 'Bite it with all your strength; it does not hurt me' — and spears, let alone teeth, made no mark {cite:tarikh-khulafa-minhaj-1434 p. 521}."
