id: person/ahmad-ibn-abi-duad
class: person
label: { ar: "أحمد بن أبي دؤاد" }
summary:
  ar: "قاضي المعتصم، قال كان المعتصم يخرج ساعده إلي ويقول يا أبا عبد الله عض ساعدي بأكثر قوتك فأمتنع فيقول إنه لا يضرني فأروم ذلك فإذا هو لا تعمل فيه الأسنة فضلاً عن الأسنان {cite:tarikh-khulafa-minhaj-1434 p. 521} وعند السيوطي استولى على الواثق وحمله على التشدد في المحنة ودعا الناس إلى القول بخلق القرآن ويقال إنه رجع عنه قبل موته، ومقته الواثق يوم أقام عليه الشيخ الأزدي الحجة {cite:tarikh-khulafa-minhaj-1434 p. 531} وعند السيوطي أصابه الفالج في سنة اثنتين وثلاثين فصيره حجراً ملقى {cite:tarikh-khulafa-minhaj-1434 p. 538}. وعند المسعودي حكمه المعتصم في قدور طبخها ندماؤه فأكل من كل قدر كما أكل من أولها ثم وصفها كلها بصفات سر أهلها بها وسأل ثلاث عشرة حاجة فلم يرد عن شيء منها {cite:muruj-al-dhahab p. 484-485}، قال ابن النديم أحمد بن أبي دؤاد من أولاد إياد بن نزار بن معد مولده بالبصرة سنة ١٦٠ ووفاته سنة ٢٤٠ في خلافة المتوكل وهو من فضلاء المعتزلة وممن جرد في إظهار المذهب والذب عن أهله والعناية به وهو من صنايع يحيى بن خالد وبه اتصل بالمأمون ومن جهة المأمون وصل بالمعتصم، وكان لأحمد أولاد أغرب في أسمائهم وكناهم {cite:fihrist-ibn-al-nadim p. 527-528}"
  en: "Al-Mu'tasim's judge; he reported the caliph would bare his forearm — 'Bite it with all your strength; it does not hurt me' — and spears, let alone teeth, made no mark {cite:tarikh-khulafa-minhaj-1434 p. 521}."
