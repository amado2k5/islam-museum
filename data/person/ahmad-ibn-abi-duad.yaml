id: person/ahmad-ibn-abi-duad
class: person
label: { ar: "أحمد بن أبي دؤاد", en: "Ahmad ibn Abi Du'ad", fr: "Ahmad ibn Abi Du'ad", es: "Ahmad ibn Abi Du'ad", ur: "احمد بن ابی داؤد" }
summary:
  ar: "قاضي المعتصم، قال كان المعتصم يخرج ساعده إلي ويقول يا أبا عبد الله عض ساعدي بأكثر قوتك فأمتنع فيقول إنه لا يضرني فأروم ذلك فإذا هو لا تعمل فيه الأسنة فضلاً عن الأسنان {cite:tarikh-khulafa-minhaj-1434 p. 521} وعند السيوطي استولى على الواثق وحمله على التشدد في المحنة ودعا الناس إلى القول بخلق القرآن ويقال إنه رجع عنه قبل موته، ومقته الواثق يوم أقام عليه الشيخ الأزدي الحجة {cite:tarikh-khulafa-minhaj-1434 p. 531} وعند السيوطي أصابه الفالج في سنة اثنتين وثلاثين فصيره حجراً ملقى {cite:tarikh-khulafa-minhaj-1434 p. 538}. وعند المسعودي حكمه المعتصم في قدور طبخها ندماؤه فأكل من كل قدر كما أكل من أولها ثم وصفها كلها بصفات سر أهلها بها وسأل ثلاث عشرة حاجة فلم يرد عن شيء منها {cite:muruj-al-dhahab p. 484-485}، قال ابن النديم أحمد بن أبي دؤاد من أولاد إياد بن نزار بن معد مولده بالبصرة سنة ١٦٠ ووفاته سنة ٢٤٠ في خلافة المتوكل وهو من فضلاء المعتزلة وممن جرد في إظهار المذهب والذب عن أهله والعناية به وهو من صنايع يحيى بن خالد وبه اتصل بالمأمون ومن جهة المأمون وصل بالمعتصم، وكان لأحمد أولاد أغرب في أسمائهم وكناهم {cite:fihrist-ibn-al-nadim p. 527-528}"
  en: "Al-Mu'tasim's judge; he reported the caliph would bare his forearm — 'Bite it with all your strength; it does not hurt me' — and spears, let alone teeth, made no mark {cite:tarikh-khulafa-minhaj-1434 p. 521}."
  fr: "Juge d'al-Mu'tasim, il racontait que le calife découvrait son avant-bras et lui demandait de le mordre de toutes ses forces sans lui faire mal ; les lances, encore moins les dents, n'y laissaient pas de marque {cite:tarikh-khulafa-minhaj-1434 p. 521}."
  es: "El juez de Al-Mu'tasim informó que el califa mostraba su antebrazo: «Muérdelo con todas tus fuerzas; no me hace daño», y las lanzas, y mucho menos los dientes, no le hacían daño {cite:tarikh-khulafa-minhaj-1434 p. 521}."
  ur: "المعتصم کا قاضی؛ اس نے بتایا کہ خلیفہ اپنا بازو ننگا کر دے گا - 'اسے اپنی پوری طاقت سے کاٹو۔ اس سے مجھے کوئی تکلیف نہیں ہوتی' — اور نیزے، دانتوں کو چھوڑ دیں، کوئی نشان نہیں بنایا۔ 521}۔"
  tr: "Mu'tesim'in veziri şöyle dedi: Mu'tesim bana kolunu uzatır ve \"Ey Ebu Abdullah, tüm gücünle kolumu ısır\" derdi. Ben reddederdim ve o da \"Bana zarar vermez\" derdi. Ben de denedim ve bakın, mızraklar bile zarar veremezdi, dişlerden bahsetmiyorum bile. {kaynak:tarikh-khulafa-minhaj-1434 s. 521} Suyuti'ye göre, Suyuti, Vathiq'i kontrol altına aldı ve onu çilede katı olmaya zorladı ve insanları Kur'an'ın yaratılmışlığına inanmaya çağırdı. Ölümünden önce tövbe ettiği ve Şeyh Azdi'nin aleyhindeki delilleri sunduğu gün Vathiq'in ondan nefret ettiği söylenir. {kaynak:tarikh-khulafa-minhaj-1434 s. 531} Suyuti'ye göre, otuz ikinci yılında felç geçirdi ve hareketsiz bir taşa dönüştü. {cite:tarikh-khulafa-minhaj-1434 s. 538} Ve El-Mas'udi'ye göre, El-Mu'tesim, arkadaşlarının pişirdiği kapları değerlendirdi, her birinden ilk kaptaki gibi yedi, sonra hepsini sahiplerini memnun edecek özelliklerle tanımladı ve on üç şey istedi ve bunların hiçbiri reddedilmedi. {cite:muruj-al-dhahab s. 484-485}. İbn El-Nadim şöyle dedi: İyad ibn Nizar ibn Ma'ad'ın soyundan olan Ahmed ibn Abi Du'ad, 160 yılında Basra'da doğdu ve 240 yılında El-Mutavakkil'in halifeliği döneminde öldü. O, seçkin Mu'tezililerden ve mezhebi yaymaya, halkını savunmaya ve korumaya kendini adamış olanlardan biriydi. Yahya ibn Halid'in himayesindekilerden biriydi ve onun aracılığıyla El-Ma'mun ile, El-Ma'mun aracılığıyla da El-Mu'tasim ile bağlantı kurdu. Ahmed'in isimleri ve lakapları alışılmadık olan çocukları vardı. {cite:fihrist-ibn-al-nadim s. 527-528}"
  id: "Hakim Al-Mu'tasim berkata: Al-Mu'tasim akan mengulurkan lengannya kepadaku dan berkata, \"Wahai Abu Abdullah, gigit lenganku sekuat tenaga.\" Aku akan menolak, dan dia akan berkata, \"Itu tidak akan membahayakanku.\" Maka aku akan mencoba melakukannya, dan lihatlah, tombak pun tidak dapat melukainya, apalagi gigi. {cite:tarikh-khulafa-minhaj-1434 p. 521} Menurut Al-Suyuti, ia menguasai Al-Wathiq dan memaksanya untuk bersikap tegas dalam cobaan tersebut dan menyeru orang-orang untuk percaya pada penciptaan Al-Qur'an. Dikatakan bahwa ia menarik kembali pernyataannya sebelum kematiannya, dan Al-Wathiq membencinya pada hari ketika Syekh Al-Azdi menyampaikan bukti yang memberatkannya. {cite:tarikh-khulafa-minhaj-1434 p. 531} Menurut Al-Suyuti, ia menderita stroke pada tahun tiga puluh dua, yang mengubahnya menjadi batu yang terbaring. {kutip:tarikh-khulafa-minhaj-1434 hlm. 538} Dan menurut Al-Mas’udi, Al-Mu’tasim menilai panci-panci yang dimasak oleh para sahabatnya, lalu ia makan dari setiap panci seperti ia makan dari panci pertama, kemudian ia menggambarkan semuanya dengan kualitas yang menyenangkan pemiliknya, dan ia meminta tiga belas hal, dan tidak satu pun dari permintaannya ditolak {kutip:muruj-al-dhahab hlm. 484-485}. Ibn Al-Nadim berkata: Ahmad ibn Abi Du’ad, dari keturunan Iyad ibn Nizar ibn Ma’ad, lahir di Basra pada tahun 160 dan meninggal pada tahun 240 pada masa kekhalifahan Al-Mutawakkil. Ia adalah salah satu Mu’tazilah terkemuka dan salah satu orang yang berdedikasi untuk menyebarkan doktrin, membela umatnya, dan menjaganya. Dia adalah salah satu anak didik Yahya ibn Khalid, dan melalui dia dia terhubung dengan Al-Ma’mun, dan melalui Al-Ma’mun dia terhubung dengan Al-Mu’tasim. Ahmad memiliki anak-anak yang nama dan julukannya tidak biasa {cite:fihrist-ibn-al-nadim p. 527-528}"
