label: { ar: "عمرو بن عبيد أبو عثمان" }
summary:
  ar: "عمرو بن عبيد بن باب مولى بني تميم، أبو عثمان، من شيوخ المعتزلة وأصحاب واصل بن عطاء، وقال إن عمر بن عبد العزيز أخذ الخلافة بغير حقها كما روي عنه، وله مع المنصور أخبار منها قوله له لما بايع المهدي يا أبا عثمان، ومات في أيام المنصور سنة أربع وأربعين ومائة وقيل سنة خمس وأربعين ومائة {cite:muruj-al-dhahab p. 214-216}.، وقال في عمر بن عبد العزيز أخذ الخلافة بغير حقها ولا باستحقاق لها ثم استحقها بالعدل حين أخذها {cite:muruj-al-dhahab p. 184}"
  en: "Amr ibn Ubayd ibn Bab, mawla of Banu Tamim, Abu Uthman — shaykh of the Mu'tazila beside Wasil ibn Ata'; his exchanges with al-Mansur are recorded, and he died in al-Mansur's reign in 144 or 145 {cite:muruj-al-dhahab p. 214-216}."
