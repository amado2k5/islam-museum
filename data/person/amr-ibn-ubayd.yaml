id: person/amr-ibn-ubayd
class: person
label: { ar: "عمرو بن عبيد أبو عثمان" }
summary:
  ar: "عمرو بن عبيد بن باب مولى بني تميم، أبو عثمان، من شيوخ المعتزلة وأصحاب واصل بن عطاء، وقال إن عمر بن عبد العزيز أخذ الخلافة بغير حقها كما روي عنه، وله مع المنصور أخبار منها قوله له لما بايع المهدي يا أبا عثمان، ومات في أيام المنصور سنة أربع وأربعين ومائة وقيل سنة خمس وأربعين ومائة {cite:muruj-al-dhahab p. 214-216}. وقال في عمر بن عبد العزيز أخذ الخلافة بغير حقها ولا باستحقاق لها ثم استحقها بالعدل حين أخذها {cite:muruj-al-dhahab p. 184}، وعند ابن الإخشيد أنه لما مات الحسن وجلس قتادة مجلسه اعتزله ونفر معه فسماها قتادة المعتزلة فأظهر تقبله {cite:fihrist-ibn-al-nadim p. 557}، وحكى ابن النديم أنه عاب واصل بن عطاء بطول عنقه فقال له واصل من عاب الصنعة فقد عاب الصانع لتعلق ما بينهما فاسترجع عمرو وقال لا أعود إلى مثلها يا أبا حذيفة ثم ناظره واصل فقطعه {cite:fihrist-ibn-al-nadim supplement p. 525}"
  en: "Amr ibn Ubayd ibn Bab, mawla of Banu Tamim, Abu Uthman — shaykh of the Mu'tazila beside Wasil ibn Ata'; his exchanges with al-Mansur are recorded, and he died in al-Mansur's reign in 144 or 145 {cite:muruj-al-dhahab p. 214-216}."
  es: "Amr ibn Ubayd ibn Bab, mawla de Banu Tamim, Abu Uthman — shaykh de los Mu'tazila junto a Wasil ibn Ata'; sus intercambios con al-Mansur están registrados, y murió durante el reinado de al-Mansur en 144 o 145 {cite:muruj-al-dhahab p. 214-216}."
  fr: "Amr ibn Ubayd ibn Bab, mawla de Banu Tamim, Abu Uthman — cheikh des Mu'tazila aux côtés de Wasil ibn Ata'; ses échanges avec al-Mansur sont enregistrés, et il mourut sous le règne d'al-Mansur en 144 ou 145 {cite:muruj-al-dhahab p. 214-216}."
  ur: "عمرو بن عبید بن باب، بنو تمیم کے مولا، ابو عثمان - واصل ابن عطاء کے پاس معتزلہ کے شیخ؛ المنصور کے ساتھ اس کے تبادلے درج ہیں، اور اس کی وفات المنصور کے دور حکومت میں 144 یا 145 میں ہوئی۔ 214-216}۔"
  tr: "Banu Tamim'in özgür bırakılmış adamı Amr bin Ubeyd ibn Bab, Ebu Üsmen, Mu'tazila şeyhlerinden ve Vesil ibn Ata'nın yoldaşlarından biriydi. Kendisinden rivayet edildiği üzere, Ömer bin Abdülaziz'in halifeliği hak ettiği payı olmadan aldığını söyledi. El-Mansur ile ilgili raporları vardır; buna 'Mehdi itaat ettiğinde, ey Ebu Osman' demiştir. 144 Hicri yılında el-Mansur'un zamanında öldüğü ve 145 Hicri'de de söylendiği söylenir. {atıf:Muruj-al-Dhahab, s. 214-216}. Ömer bin Abdülaziz hakkında, halifeliği hak ettiği hak veya hak olmadan aldığını, sonra hak ettiğinde hak ettiğini söyledi {alıntı: Muruj-al-Dhahab s. 184}. İbn al-Ihhşid'e göre, el-Hasan öldüğünde ve Katadah onun sarayında oturduğunda, ondan çekildi ve ona katıldı, bu yüzden ona Kataza'yı Mu'tazila olarak koydu, kabul ettiğini gösterdi {atıf:Fihrist-ibn-al-Nadim s. 557}. İbn el-Nadim, uzun boynuyla Vesil bin Ata'yı eleştirdiğini ve ona şöyle dediğini anlattı: \"Wasil, zanaatkârı eleştiren o zanaatkârı da aralarındaki bağ nedeniyle eleştirmiştir.\" Amr hatırlayarak, \"Aynı şeye dönmeyeceğim, ey Ebu Hudhayfa.\" Sonra Vesil ona baktı ve sözünü kesti {atıf:fihrist-ibn-al-nadim ek s. 525}"
  id: "Amr ibn Ubayd ibn Bab, mantan Banu Tamim, Abu Uthman, adalah salah satu sheikh Mu'tazila dan sahabat Wasil ibn Ata. Ia mengatakan bahwa Umar ibn Abd al-Aziz mengambil kekhalifahan tanpa bagian yang seharusnya, seperti yang diceritakan darinya. Ia memiliki laporan kepada al-Mansur, termasuk perkataannya kepadanya, 'Ketika Mahdi bersumpah setia, wahai Abu Uthman.' Ia meninggal pada masa al-Mansur tahun 144 H, dan juga dikatakan pada tahun 145 H. {cite:muruj-al-dhahab, hlm. 214-216}. Ia berkata tentang Umar ibn Abd al-Aziz bahwa ia mengambil kekhalifahan tanpa hak atau haknya yang sah, lalu ia pantas mendapatkannya dengan adil ketika mengambilnya {cite:muruj-al-dhahab hlm. 184}. Menurut Ibn al-Ikhshid, ketika al-Hasan wafat dan Qatadah duduk di istananya, ia menarik diri dan bergabung dengannya, sehingga ia menamainya Qatadah si Mu'tazila, menunjukkan penerimaannya {cite:fihrist-ibn-al-nadim hlm. 557}. Ibn al-Nadim menceritakan bahwa ia mengkritik Wasil ibn Ata dengan lehernya yang panjang dan berkata kepadanya, \"Wasil, siapa pun yang mengkritik pengrajin, telah mengkritik pengrajin karena hubungan di antara mereka.\" Amr teringat dan berkata, \"Aku tidak akan kembali ke hal yang sama, wahai Abu Hudhayfah.\" Kemudian Wasil menatapnya dan memotong pembicaraannya {cite:fihrist-ibn-al-nadim supplement hlm. 525}"
