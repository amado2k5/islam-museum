summary:
  en: "A warrior of Banu Ka'b of Khuza'a who, following the conquest of Mecca, ambushed and killed Ibn al-Anwa' al-Hudhali for pre-Islamic blood; the Prophet strongly condemned the act, paid the victim's wergild himself, and delivered the sermon of Mecca's perpetual inviolability."
  ar: "رجل من بني كعب من خزاعة غدر بابن الأنوع الهذلي بعد الفتح فقتله بثأر قديم؛ فأنكر النبي صنيعه أشد الإنكار وقال «إن خراشًا لقتّال»، وودى القتيل من ماله وخطب في حرمة مكة."
