summary:
  ar: "أبو عمر يوسف بن هارون الكندي المعروف بالرمادي، شاعر أهل قرطبة المشهور المقدم على الشعراء؛ روى عن أبي علي القالي كتاب «النوادر» من تأليفه وأخذ عنه أبو عمر ابن عبد البر، وعدّه الحميدي في جذوة المقتبس مع امرئ القيس والمتنبي ممن فتح الشعر بكندة {cite:wafayat-ayan}."
  en: "Abu Umar Yusuf ibn Harun al-Kindi, known as al-Rammadi, the well-known poet of Cordoba, foremost among its poets. He transmitted from Abu Ali al-Qali the book al-Nawadir, a work of al-Qali's own composition, and Abu Umar ibn Abd al-Barr took from him as well; al-Humaydi, in Jadhwat al-Muqtabis, counted him with Imru' al-Qays and al-Mutanabbi among those who opened poetry with Kinda {cite:wafayat-ayan}."
