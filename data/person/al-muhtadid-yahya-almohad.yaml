summary:
  ar: "أبو زكريا يحيى بن الناصر محمد بن يعقوب الموحدي، الملقب بالمعتضد؛ اختاره أهل مراكش للخلافة بعد خلع عبد الواحد المخلوع، فما لبث أياماً قلائل حتى ادعى أبو العلا إدريس الخلافة بإشبيلية وبايعه أهل الأندلس، فحاصره يحيى بمراكش ثم انهزم أصحابه وأخرجه أهل المدينة متشائمين به، فاستجار بقوم في حصن في جهة تلمسان فطعنه غلام لهم كان عنده ثأر بأبيه فقتله {cite:wafayat-ayan}."
  en: "Abu Zakariyya Yahya ibn al-Nasir Muhammad ibn Ya'qub al-Muwahhidi, titled al-Mu'tadid. The people of Marrakesh chose him as caliph after Abd al-Wahid al-Makhlu' had been deposed. Within a few days Abu al-'Ala Idris claimed the caliphate at Seville and the people of al-Andalus pledged allegiance to him; Yahya besieged him in Marrakesh, but then his companions were routed, and the people of the city, regarding him as ill-omened, expelled him. He sought protection among a people in a fort in the direction of Tlemcen, and a young man of theirs, who held a vendetta against him over his father, stabbed him and killed him {cite:wafayat-ayan}."
  fr: "Abu Zakariyya Yahya ibn al-Nasir Muhammad ibn Ya'qub al-Muwahhidi, intitulé al-Mu'tadid. Les habitants de Marrakech l'ont choisi comme calife après qu'Abd al-Wahid al-Makhlu' ait été déposé. En quelques jours Abu al-'Ala Idris a réclamé le califat à Séville et les gens d'al-Andalus lui ont prêté allégeance ; Yahya l'assiégea à Marrakech, mais ses compagnons furent mis en déroute, et les habitants de la ville, le considérant comme mal venu, le chassèrent. Il chercha protection auprès d'un peuple dans un fort en direction de Tlemcen, et un de leurs jeunes hommes, qui tenait une vendetta contre lui sur son père, le poignarda et le tua {cite:wafayat-ayan}."
  es: "Abu Zakariyya Yahya ibn al-Nasir Muhammad ibn Ya'qub al-Muwahhidi, con el título de al-Mu'tadid. El pueblo de Marrakech lo eligió califa tras la deposición de Abd al-Wahid al-Makhlu'. A los pocos días, Abu al-'Ala Idris reclamó el califato en Sevilla y el pueblo de al-Ándalus le juró lealtad. Yahya lo sitió en Marrakech, pero sus compañeros fueron derrotados y los habitantes de la ciudad, considerándolo de mal agüero, lo expulsaron. Buscó refugio entre un pueblo en una fortaleza cerca de Tlemcen, y un joven de allí, que le guardaba rencor por la muerte de su padre, lo apuñaló y lo mató {cite:wafayat-ayan}."
  ur: "ابو زکریا یحییٰ بن الناصر محمد بن یعقوب المواحدی، المعتدد کے عنوان سے۔ عبد الواحد المخلو کے معزول ہونے کے بعد مراکش کے لوگوں نے انہیں خلیفہ منتخب کیا۔ چند دنوں کے اندر ابو العلا ادریس نے سیویل میں خلافت کا دعویٰ کیا اور اندلس کے لوگوں نے اس کی بیعت کی۔ یحییٰ نے مراکش میں اس کا محاصرہ کر لیا، لیکن پھر اس کے ساتھیوں کو شکست دے دی گئی، اور شہر کے لوگوں نے اسے بدشگونی سمجھ کر نکال دیا۔ اس نے تلمسن کی سمت ایک قلعے میں لوگوں کے درمیان حفاظت کی کوشش کی، اور ان میں سے ایک نوجوان نے، جس نے اس کے خلاف اس کے باپ کے خلاف انتقامی کارروائی کی، اس پر وار کر کے اسے قتل کر دیا۔"
