summary:
  ar: "أبو زكريا يحيى بن الناصر محمد بن يعقوب الموحدي، الملقب بالمعتضد؛ اختاره أهل مراكش للخلافة بعد خلع عبد الواحد المخلوع، فما لبث أياماً قلائل حتى ادعى أبو العلا إدريس الخلافة بإشبيلية وبايعه أهل الأندلس، فحاصره يحيى بمراكش ثم انهزم أصحابه وأخرجه أهل المدينة متشائمين به، فاستجار بقوم في حصن في جهة تلمسان فطعنه غلام لهم كان عنده ثأر بأبيه فقتله {cite:wafayat-ayan}."
  en: "Abu Zakariyya Yahya ibn al-Nasir Muhammad ibn Ya'qub al-Muwahhidi, titled al-Mu'tadid. The people of Marrakesh chose him as caliph after Abd al-Wahid al-Makhlu' had been deposed. Within a few days Abu al-'Ala Idris claimed the caliphate at Seville and the people of al-Andalus pledged allegiance to him; Yahya besieged him in Marrakesh, but then his companions were routed, and the people of the city, regarding him as ill-omened, expelled him. He sought protection among a people in a fort in the direction of Tlemcen, and a young man of theirs, who held a vendetta against him over his father, stabbed him and killed him {cite:wafayat-ayan}."
