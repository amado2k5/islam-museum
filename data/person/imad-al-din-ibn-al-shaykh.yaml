summary:
  ar: "الصاحب الرئيس أبو الفتح عمر بن شيخ الشيوخ الجويني الشافعي؛ ولي تدريس الشافعية ومشهد الحسين ومشيخة الشيوخ بالديار المصرية، وقام بسلطنة الجواد ثم دخل الديار المصرية فلامه صاحبها العادل أبو بكر فردّهم بخلع الجواد من السلطنة فلم يمكنه، فجهّز تعلية من الإسماعيلية فقتله في جمادى الأولى وله خمس وخمسون سنة {cite:shadharat-dhahab p. 189}."
  en: "Imad al-Din Ibn al-Shaykh (killed Jumada I 636, aged 55) — mashyakhat al-shuyukh of Egypt and Hussayn-mashhad warden who backed al-Jawad's claim and was assassinated from Ismailiyya on al-Adil II's instigation {cite:shadharat-dhahab p. 189}."
  es: "Imad al-Din Ibn al-Shaykh (mató a Jumada I en 636, 55 años) - mashyakhat al-shuyukh de Egipto y guardián de Hussayn-mashhad que respaldó el reclamo de al-Jawad y fue asesinado en Ismailiyya por instigación de al-Adil II {cita: shadharat-dhahab p. 189}."
  fr: "Imad al-Din Ibn al-Shaykh (tué à Jumada I 636, âgé de 55 ans) — mashyakhat al-shuyukh d'Égypte et directeur de Hussayn-mashhad qui a soutenu la revendication d'al-Jawad et a été assassiné depuis Ismailiyya à l'instigation d'al-Adil II {cite: shadharat-dhahab p. 189}."
