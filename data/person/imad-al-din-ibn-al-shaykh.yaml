  ar: "الصاحب الرئيس أبو الفتح عمر بن شيخ الشيوخ الجويني الشافعي؛ ولي تدريس الشافعية ومشهد الحسين ومشيخة الشيوخ بالديار المصرية، وقام بسلطنة الجواد ثم دخل الديار المصرية فلامه صاحبها العادل أبو بكر فردّهم بخلع الجواد من السلطنة فلم يمكنه، فجهّز تعلية من الإسماعيلية فقتله في جمادى الأولى وله خمس وخمسون سنة {cite:shadharat-dhahab p. 189}."
