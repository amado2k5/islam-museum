summary:
  ar: "سبيعة بنت الحارث الأسلمية، زوجة سعد بن خولة الذي توفي عنها بمكة، فوضعت بعد وفاته بليال، فقال لها أبو السنابل بن بعكك إن أجلها أربعة أشهر وعشر، فأتت النبي فقال: «قد حللتِ فانكحي من شئت»؛ روى حديثها فقهاء المدينة والكوفة من التابعين، وروى عنها ابن عمر حديث الموت بالمدينة {cite:istiab-alam-2002 p. 912-913}."
  en: "Subay'a bint al-Harith al-Aslamiyya, wife of Sa'd ibn Khawla, who died at Mecca; she gave birth a few nights after his death, and when Abu al-Sanabil ibn Ba'kak told her that her waiting period was four months and ten days, she went to the Prophet, who said, 'You are free; marry whom you wish'; the jurists of Medina and Kufa among the Successors transmitted her hadith, and Ibn 'Umar narrated from her the hadith on dying in Medina {cite:istiab-alam-2002 p. 912-913}."
  ur: "سبیعہ بنت الحارث اسلمیہ، سعد بن خولہ کی بیوی جو مکہ میں فوت ہوئے؛ ان کی وفات کے چند راتوں بعد ان کے ہاں ولادت ہوئی، اور جب ابو السنابل بن بعکک نے کہا کہ ان کی عدت چار مہینے دس دن ہے تو وہ نبی کے پاس گئیں، جنہوں نے فرمایا: «تم حلال ہو گئیں، جس سے چاہو نکاح کر لو»؛ مدینہ اور کوفہ کے فقہائے تابعین نے ان کی حدیث روایت کی، اور ابن عمر نے ان سے مدینہ میں موت کی حدیث روایت کی {cite:istiab-alam-2002 p. 912-913}۔"
