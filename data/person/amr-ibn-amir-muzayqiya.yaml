id: person/amr-ibn-amir-muzayqiya
class: person
label: { ar: "عمرو بن عامر مزيقياء", en: "Amr ibn Amir Muzayqiya", es: "Amr ibn Amir Muzayqiya", fr: "Amr ibn Amir Muzayqiya", ur: "عمرو بن عامر مغیثیہ" }
summary:
  ar: "عمرو بن عامر بن ماء السماء بن حارثة الغطريف بن ثعلبة بن امرئ القيس بن مازن بن الأزد، انتهت إليه الرياسة في ولد قحطان حين أرسل الله عليهم سيل العرم فتفرقوا في البلدان، وذكر أنه لما خرج من مأرب لم يزل مقيماً على ماء غسان حتى أدركه الموت وكان عمره ثمانمائة سنة أربعمائة سوقة وأربعمائة ملكاً {cite:muruj-al-dhahab p. 425-426, 489}."
  en: "Amr ibn Amir, called Muzayqiya — last holder of the leadership over Qahtan's sons when the 'Arim flood scattered them through the lands; his stay at the Ghassan water gave the tribe its name, and his years are put at eight hundred {cite:muruj-al-dhahab p. 425-426, 489}."
  es: "Amr ibn Amir, llamado Muzayqiya, fue el último en ostentar el liderazgo sobre los hijos de Qahtan cuando la inundación de 'Arim los dispersó por las tierras; su estancia en las aguas de Ghassan dio nombre a la tribu, y se calcula que vivió ochocientos años {cite:muruj-al-dhahab p. 425-426, 489}."
  fr: "Amr ibn Amir, appelé Muzayqiya — dernier détenteur de la direction sur les fils de Qahtan lorsque le déluge d'Arim les a dispersés à travers les terres; son séjour aux eaux de Ghassan a donné son nom à la tribu, et ses années sont estimées à huit cents {cite: muruj-al-dhahab p. 425-426, 489}."
  ur: "عمرو بن عامر، جسے مزاقیہ کہا جاتا ہے - قحطان کے بیٹوں پر قیادت کا آخری حامل تھا جب ارم سیلاب نے انہیں زمینوں میں بکھیر دیا تھا۔ غسان کے پانی میں اس کے قیام نے اس قبیلے کو اس کا نام دیا، اور اس کے سال آٹھ سو بتائے گئے ہیں۔ 425-426، 489}۔"
  tr: "Amr ibn Amir ibn Ma'al-Sama' ibn Haritha al-Ghatrif ibn Tha'laba ibn Imru' al-Qais ibn Mazen ibn al-Azd. Allah 'Arm' tufanını gönderdiğinde Qahtan'ın soyundan gelenler arasında liderlik kazandı ve onlar topraklara dağıldı. Marib'den ayrıldığında, ölümüne kadar Gassan sularında yaşamaya devam ettiğini belirtti. Sekiz yüz yaşındaydı, dört yüz dört yüz kraldı {cite:muruj-al-dhahab, s. 425-426, 489}."
  id: "Amr ibn Amir ibn Ma' al-Sama' ibn Haritha al-Ghatrif ibn Tha'laba ibn Imru' al-Qais ibn Mazen ibn al-Azd. Ia memimpin keturunan Qahtan ketika Allah mengirimkan banjir 'Arm kepada mereka, dan mereka tercerai-berai di tanah-tanah. Ia menyebutkan bahwa ketika meninggalkan Marib, ia tetap tinggal di perairan Ghassan hingga kematian menimpanya. Ia berusia delapan ratus tahun, empat ratus empat ratus raja {cite:muruj-al-dhahab, hlm. 425-426, 489}."
