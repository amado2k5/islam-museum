summary:
  ar: "عمرو بن عامر بن ماء السماء بن حارثة الغطريف بن ثعلبة بن امرئ القيس بن مازن بن الأزد، انتهت إليه الرياسة في ولد قحطان حين أرسل الله عليهم سيل العرم فتفرقوا في البلدان، وذكر أنه لما خرج من مأرب لم يزل مقيماً على ماء غسان حتى أدركه الموت وكان عمره ثمانمائة سنة أربعمائة سوقة وأربعمائة ملكاً {cite:muruj-al-dhahab p. 425-426, 489}."
  en: "Amr ibn Amir, called Muzayqiya — last holder of the leadership over Qahtan's sons when the 'Arim flood scattered them through the lands; his stay at the Ghassan water gave the tribe its name, and his years are put at eight hundred {cite:muruj-al-dhahab p. 425-426, 489}."
