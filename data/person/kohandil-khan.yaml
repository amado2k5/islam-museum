summary:
  ar: "سردار باركزاي على قندهار (1830–1839 و1842–1855)، أحد «إخوة دل» الذين حكموا إمارة قندهار جماعيا بعد انفصالها عن الدولة الدرانية، والأخ غير الشقيق لأمير كابل دوست محمد خان. نُفي مع إخوته إلى إيران في الحرب الإنجليزية الأفغانية الأولى ثم عاد فاستعاد قندهار، وأثارت وفاته في هراة سنة 1855 نزاعا على الخلافة مهّد لضمّ دوست محمد قندهار إلى ملكه."
  en: "Barakzai sardar of Kandahar (1830–1839 and 1842–1855), one of the 'Dil brothers' who ruled the Principality of Kandahar collectively after its break from the Durrani Empire, and a half-brother of the Kabul amir Dost Mohammad Khan. Exiled with his brothers to Persia during the First Anglo-Afghan War, he returned and recovered Kandahar; his death at Herat in 1855 set off a succession struggle that opened the way for Dost Mohammad's conquest of Kandahar."
  ur: "قندھار کے بارکزئی سردار (1830–1839ء اور 1842–1855ء)، «دل برادران» میں سے ایک جنہوں نے قندھار کی امارت پر مشترکہ حکومت کی، اور کابل کے امیر دوست محمد خان کے سوتیلے بھائی۔ پہلی اینگلو افغان جنگ میں ایران جلاوطن ہوئے، پھر واپس آ کر قندھار دوبارہ حاصل کیا؛ 1855ء میں ہرات میں ان کی وفات سے جانشینی کا تنازع کھڑا ہوا جس سے دوست محمد کی قندھار فتح کی راہ ہموار ہوئی۔"
