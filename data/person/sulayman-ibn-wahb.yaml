summary:
  ar: "من كبار الكتاب، استُوزر للمعتمد على الله لست خلون من ذي الحجة سنة ثلاث وستين ومائتين بعد هلاك عبيد الله بن يحيى بن خاقان وهرب الحسين بن مخلد {cite:muntazam-ibn-al-jawzi p. 120}."
  en: "A leading secretary of the Abbasid administration; he was made vizier to al-Mu'tamid on 6 Dhu'l-Hijja 263 after Ubaydallah ibn Yahya's death and Ibn Makhlad's flight {cite:muntazam-ibn-al-jawzi p. 120}."
  es: "Un destacado secretario de la administración abasí; fue nombrado visir de al-Mu'tamid el 6 de Dhu'l-Hijja de 263 después de la muerte de Ubaydallah ibn Yahya y la huida de Ibn Makhlad {citar:muntazam-ibn-al-jawzi p. 120}."
  fr: "Un secrétaire éminent de l'administration abbasside; il fut nommé vizir d'al-Mu'tamid le 6 Dhu'l-Hijja 263 après la mort d'Ubaydallah ibn Yahya et la fuite d'Ibn Makhlad {cite:muntazam-ibn-al-jawzi p. 120}."
  ur: "عباسی انتظامیہ کا ایک سرکردہ سیکرٹری؛ عبیداللہ ابن یحییٰ کی وفات اور ابن مخلد کی پرواز کے بعد آپ کو 6 ذی الحجہ 263 کو معتمد کا وزیر بنایا گیا تھا۔ 120}۔"
  tr: "Büyük yazarlar arasında, 263 Hicce'de Zhu'dAllah ibn Yahya ibn Khaqan'ın ölümünden ve el-Hüseyin ibn Muhhid'in kaçışından sonra Zhu'd-ala Allah 'Lam Khalun'dan rehberlik istemiştir {atıf:muntazam-ibn-al-jawzi, s. 120}."
  id: "Di antara para penulis besar, ia mencari bimbingan dari al-Mu'tamad 'ala Allah 'Lam Khalun dalam Dhu al-Hijjah pada tahun 263 H, setelah kematian Ubayd Allah ibn Yahya ibn Khaqan dan pelarian al-Husayn ibn Mukhlid {cite:muntazam-ibn-al-jawzi, hlm. 120}."
