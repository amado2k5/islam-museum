summary:
  ar: "أبو أيوب سليمان بن وهب بن سعيد بن عمرو بن حصين بن قيس بن فنال؛ من أسرة كتّاب عريقة — جده قيس كتب لمروان بن الحكم ثم لعبد الملك ثم لهشام؛ كتب للمأمون وهو ابن أربع عشرة سنة ثم للمعتصم ثم للواثق ثم ولي الوزارة للمهتدي بالله ثم للمعتمد على الله وله ديوان رسائل؛ وقام في الأتراك حين انقادوا للمهتدي بعد مواعظه فقال: هذا سوء رأي منكم، إن أعطاكم بلسانه فنيته فيكم غير هذا وسيأتي عليكم جميعاً ويفرق جمعكم، فاسترجعوا وجاءوا المهتدي بالخناجر {cite:muruj-al-dhahab p. 560}؛ وكان هو وأخوه الحسن بن وهب من أعيان عصرهما وقد مدحهما أبو تمام والبحتري {cite:wafayat-ayan}."
  en: "Abu Ayyub Sulayman b. Wahb (d. c. 270 in custody) — vizier of al-Muhtadi and al-Mu'tamid who wrote for al-Ma'mun at fourteen; scion of a katib dynasty back to Mu'awiya's Syria; the man whose warning set the Turks back on al-Muhtadi {cite:muruj-al-dhahab p. 560} {cite:wafayat-ayan}."
