summary:
  ar: "عبد الله بن السائب بن أبي السائب صيفي بن عابد، أبو عبد الرحمن، المخزومي المكي، مقرئ مكة، وله صحبة ورواية. قرأ القرآن على أبيّ بن كعب، وحدّث عنه وعن عمر، وحدّث عنه ابن أبي مليكة وعطاء. قيل: توفي في إمارة ابن الزبير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15413}"
  en: "Abd Allah ibn al-Sa'ib ibn Abi al-Sa'ib Sayfi ibn Abid, Abu Abd al-Rahman, of the Makhzum of Makka, reader of the Qur'an for Makka, a companion who also transmitted reports. He recited the Qur'an to Ubayy ibn Ka'b and transmitted from him and from Umar; Ibn Abi Mulayka and Ata transmitted from him. It is said that he died in the rule of Ibn al-Zubayr. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15413}"
