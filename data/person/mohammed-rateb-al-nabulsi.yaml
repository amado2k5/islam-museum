summary:
  ar: "داعية وكاتب سوري، وُلد في دمشق سنة 1938، عمل أستاذا في جامعة دمشق قرابة ثلاثين عاما، واشتهر بدروسه في الإعجاز العلمي في القرآن والسنة وبسلاسله عن أسماء الله الحسنى والشمائل النبوية، وأسس «موسوعة النابلسي للعلوم الإسلامية» على الإنترنت ومجمعا علميا في دمشق."
  en: "Syrian preacher and writer, born in Damascus in 1938. He taught at Damascus University for about thirty years, became known for his lectures on the scientific inimitability (i'jaz) of the Quran and the Sunna and for his series on the names of God and the Prophet's character, and founded the online Nabulsi Encyclopedia of Islamic Sciences and a scholarly complex in Damascus."
  ur: "شامی مبلغ اور مصنف، جو 1938 میں دمشق میں پیدا ہوئے۔ وہ تقریباً تیس برس جامعہ دمشق میں استاد رہے، قرآن و سنت کے علمی اعجاز پر اپنے دروس اور اسمائے حسنیٰ اور شمائلِ نبوی پر اپنی سلاسل کی وجہ سے مشہور ہوئے، اور انہوں نے آن لائن «موسوعہ النابلسی» اور دمشق میں ایک علمی مجمع قائم کیا۔"
  es: "Predicador y escritor sirio, nacido en Damasco en 1938. Impartió clases en la Universidad de Damasco durante unos treinta años, se hizo conocido por sus conferencias sobre la inimitabilidad científica (i'jaz) del Corán y la Sunna, así como por su serie sobre los nombres de Dios y el carácter del Profeta, y fundó la enciclopedia en línea Nabulsi de ciencias islámicas y un complejo académico en Damasco."
  fr: "Prédicateur et écrivain syrien, né à Damas en 1938. Il a enseigné à l'université de Damas pendant une trentaine d'années, s'est fait connaître pour ses conférences sur l'inimitabilité scientifique (i'jaz) du Coran et de la Sunna et pour sa série sur les noms de Dieu et le caractère du Prophète, et a fondé l'encyclopédie en ligne Nabulsi des sciences islamiques et un complexe universitaire à Damas."
  tr: "1938'de Şam'da doğan Suriyeli vaiz ve yazar olan D'Im, Şam Üniversitesi'nde yaklaşık otuz yıl profesör olarak çalıştı. Kur'an ve Sünnet'teki bilimsel mucizeler üzerine verdiği dersler, Allah'ın Güzel İsimleri ve Peygamberlik Nitelikleri serisiyle ünlendi; ayrıca \"El-Nabulsi İslam Bilimleri Ansiklopedisi\"ni çevrimiçi olarak kurdu ve Şam'da bir bilimsel akademi kurdu."
  id: "Seorang pengkhotbah dan penulis Suriah, lahir di Damaskus pada tahun 1938, ia bekerja sebagai profesor di Universitas Damaskus selama hampir tiga puluh tahun. Ia menjadi terkenal karena pelajarannya tentang mukjizat ilmiah dalam Al-Qur'an dan Sunnah, seri tentang Nama-nama Indah Allah dan atribut Nabi, serta mendirikan \"Ensiklopedia Ilmu Islam Al-Nabulsi\" secara daring dan akademi ilmiah di Damaskus."
