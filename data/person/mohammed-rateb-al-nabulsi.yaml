summary:
  ar: "داعية وكاتب سوري، وُلد في دمشق سنة 1938، عمل أستاذا في جامعة دمشق قرابة ثلاثين عاما، واشتهر بدروسه في الإعجاز العلمي في القرآن والسنة وبسلاسله عن أسماء الله الحسنى والشمائل النبوية، وأسس «موسوعة النابلسي للعلوم الإسلامية» على الإنترنت ومجمعا علميا في دمشق."
  en: "Syrian preacher and writer, born in Damascus in 1938. He taught at Damascus University for about thirty years, became known for his lectures on the scientific inimitability (i'jaz) of the Quran and the Sunna and for his series on the names of God and the Prophet's character, and founded the online Nabulsi Encyclopedia of Islamic Sciences and a scholarly complex in Damascus."
  ur: "شامی مبلغ اور مصنف، جو 1938 میں دمشق میں پیدا ہوئے۔ وہ تقریباً تیس برس جامعہ دمشق میں استاد رہے، قرآن و سنت کے علمی اعجاز پر اپنے دروس اور اسمائے حسنیٰ اور شمائلِ نبوی پر اپنی سلاسل کی وجہ سے مشہور ہوئے، اور انہوں نے آن لائن «موسوعہ النابلسی» اور دمشق میں ایک علمی مجمع قائم کیا۔"
