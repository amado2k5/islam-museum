summary:
  ar: "جمال الدين محمد بن بوري أمير دمشق؛ تولى الإمارة بعد مقتل أخيه محمود سنة ثلاث وثلاثين فدامت إمارته عشرة أشهر وتوفي في شعبان سنة أربع وثلاثين وخمسمائة فتولى بعده أبق {cite:shadharat-dhahab p. 583, 586}."
  en: "Jamal al-Din Muhammad ibn Buri, Burid amir of Damascus; he took the amirate after his brother Mahmud's murder in 533, held it ten months, and died in Sha'ban 534, whereupon Abaq succeeded {cite:shadharat-dhahab p. 583, 586}."
  es: "Jamal al-Din Muhammad ibn Buri, emir burid de Damasco; tomó el emirato después del asesinato de su hermano Mahmud en 533, lo mantuvo durante diez meses y murió en Sha'ban 534, tras lo cual Abaq le sucedió {cite:shadharat-dhahab p. 583, 586}."
  fr: "Jamal al-Din Muhammad ibn Buri, émir Burid de Damas; il prit l'émirat après le meurtre de son frère Mahmud en 533, le détint pendant dix mois et mourut en Sha'ban 534, après quoi Abaq lui succéda {cite: shadharat-dhahab p. 583, 586}."
  ur: "جمال الدین محمد بن بری، دمشق کے برید امیر؛ اس نے 533 میں اپنے بھائی محمود کے قتل کے بعد امارت حاصل کی، اسے دس مہینے تک برقرار رکھا، اور شعبان 534 میں وفات پائی، جس کے بعد اباق جانشین ہوا 583، 586}۔"
  tr: "Cemaleddin Muhammed bin Buri, Şam Emiriydi; kardeşi Mahmud'un otuz üçüncü yılında suikast edilmesinden sonra emirliği devraldı. Emirliği on ay sürdü ve beş yüz otuz dört yılında Şaban'da öldü, sonrasında ise kaldı {cite:shadharat-dhahab, s. 583, 586}."
  id: "Jamal al-Din Muhammad ibn Buri adalah Emir Damaskus; ia mengambil alih emirat setelah pembunuhan saudaranya Mahmud pada tahun tiga puluh tiga. Emiratnya berlangsung sepuluh bulan, dan ia meninggal di Sha'ban pada tahun lima ratus tiga puluh empat, setelah itu ia tetap tinggal {cite:shadharat-dhahab, hlm. 583, 586}."
