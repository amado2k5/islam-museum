summary:
 ar: "الحارث بن سويد، أبو عائشة، التيمي الكوفي، إمام ثقة رفيع المحل، روى عن ابن مسعود وعمر وعلي وغيرهم، وروى عنه إبراهيم التيمي وعمارة بن عمير وثمامة بن عقبة وغيرهم. قال ابن معين ثقة، وذكره ابن حبان في الثقات، وقال ابن سعد إنه توفي في آخر خلافة عبد الله بن الزبير. ويقال إنه أدرك الجاهلية ونزل الكوفة ولم ير النبي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13751-13752}. والكتاب يذكر وفاته (؟-72 ه)."
 en: "Harith ibn Suwayd, Abu Aisha al-Taymi al-Kufi, a trustworthy imam of high standing. He narrated from Ibn Mas'ud, Umar and Ali and others, and Ibrahim al-Taymi, Umara ibn Umayr and Thumama ibn Uqba narrated from him. Ibn Ma'in called him trustworthy, Ibn Hibban listed him among the trustworthy, and Ibn Sa'd said he died at the end of the caliphate of Abd Allah ibn al-Zubayr. It is said that he lived in the pre-Islamic period, settled in Kufa and did not see the Prophet {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13751-13752}. The book gives his death as 72 AH."
 ur: "حارث بن سوید، ابو عائشہ تیمی کوفی، ثقہ امام اور بلند مرتبے کے حامل۔ انہوں نے ابن مسعود، عمر اور علی وغیرہم سے روایت کی، اور ان سے ابراہیم تیمی، عمارہ بن عمیر اور ثمامہ بن عقبہ نے روایت کی۔ ابن معین نے انہیں ثقہ کہا، ابن حبان نے ثقات میں ذکر کیا، اور ابن سعد کے مطابق وہ عبداللہ بن زبیر کی خلافت کے آخر میں فوت ہوئے۔ کہا جاتا ہے کہ انہوں نے جاہلیت کا زمانہ پایا اور کوفہ میں اترے مگر نبی کو نہیں دیکھا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13751-13752}۔ کتاب ان کی وفات 72 ہجری بتاتی ہے۔"
