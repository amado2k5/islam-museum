summary:
  ar: "أحمد بن سلمان بن الحسن، أبو بكر النجاد، من أهل بغداد، من علماء الحنابلة، كان رأسا في الفقه والرواية، سمع الحسن بن مكرم وأبا داود السجستاني وإبراهيم الحربي، وروى عنه عمر بن شاهين وابن بطة وأبو حفص العكبري. كان له بجامع المنصور حلقة قبل الجمعة للفتوى وحلقة بعدها للإملاء. من تصانيفه «السنن» و«الفوائد» في الحديث. عاش بين 253 و348هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  en: "Ahmad ibn Salman ibn al-Hasan, Abu Bakr al-Najjad, of Baghdad, a Hanbali scholar who led in law and transmission. He heard from al-Hasan ibn Makram, Abu Dawud al-Sijistani and Ibrahim al-Harbi; Ibn Shahin, Ibn Batta and Abu Hafs al-Ukbari transmitted from him. He held a circle before the Friday prayer for fatwas and another after it for dictation at the mosque of al-Mansur. His works include 'al-Sunan' and 'al-Fawa'id' in hadith. He lived from 253 to 348 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  es: "Ahmad ibn Salman ibn al-Hasan, Abu Bakr al-Najjad, de Bagdad, fue un erudito hanbalí que destacó en derecho y transmisión de enseñanzas. Recibió enseñanzas de al-Hasan ibn Makram, Abu Dawud al-Sijistani e Ibrahim al-Harbi; Ibn Shahin, Ibn Batta y Abu Hafs al-Ukbari transmitieron enseñanzas de él. Celebraba una reunión antes de la oración del viernes para emitir fatuas y otra después para dictar textos en la mezquita de al-Mansur. Entre sus obras destacan 'al-Sunan' y 'al-Fawa'id' sobre hadices. Vivió entre el 253 y el 348 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  fr: "Ahmad ibn Salman ibn al-Hasan, Abu Bakr al-Najjad, de Bagdad, était un savant hanbalite de renom en droit et en transmission du hadith. Il fut l'élève d'al-Hasan ibn Makram, d'Abu Dawud al-Sijistani et d'Ibrahim al-Harbi; Ibn Shahin, Ibn Batta et Abu Hafs al-Ukbari reçurent de lui des enseignements. Avant la prière du vendredi, il tenait une réunion pour les fatwas et une autre après, pour la dictée, à la mosquée al-Mansur. Parmi ses œuvres figurent « al-Sunan » et « al-Fawa'id », recueils de hadiths. Il vécut de 253 à 348 de l'Hégire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  ur: "احمد بن سلمان بن الحسن، ابو بکر النجد، بغداد کے، ایک حنبلی عالم جنہوں نے قانون اور نشریات میں رہنمائی کی۔ انہوں نے حسن بن مکرم، ابوداؤد السجستانی اور ابراہیم الحربی سے سنا۔ ابن شاہین، ابن بطہ اور ابو حفص الکبری نے ان سے روایت کی ہے۔ اس نے جمعہ کی نماز سے پہلے ایک حلقہ فتویٰ کے لیے اور اس کے بعد دوسرا حلقہ مسجد المنصور میں ڈکٹیشن کے لیے رکھا۔ ان کی تصانیف میں حدیث میں 'السنن' اور 'الفوائد' شامل ہیں۔ وہ 253 سے 348 ہجری تک زندہ رہا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2072}"
  tr: "Bağdatlı Ahmed ibn Salman ibn el-Hasan, Ebu Bekir el-Neced, Hanbeli âlimi ve fıkıh ve hadis rivayetinde önde gelen bir şahsiyetti. Hasan ibn Makram, Ebu Davud el-Sijistani ve İbrahim el-Harbi'nin yanında eğitim gördü ve hadisleri Ömer ibn Şahin, İbn Batta ve Ebu Hafs el-Ekberi'ye rivayet etti. Cuma namazlarından önce Mansur Camii'nde fıkıh görüşleri vermek için bir çalışma grubu ve sonrasında hadis dikte etmek için başka bir çalışma grubu düzenledi. Eserleri arasında hadis üzerine \"el-Sünen\" ve \"el-Fevaid\" bulunmaktadır. Hicri 253 ile 348 yılları arasında yaşamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2072}"
  id: "Ahmad ibn Salman ibn al-Hasan, Abu Bakr al-Najad, dari Baghdad, adalah seorang ulama Hanbali dan tokoh terkemuka dalam bidang fiqih dan periwayatan hadits. Ia belajar di bawah bimbingan al-Hasan ibn Makram, Abu Dawud al-Sijistani, dan Ibrahim al-Harbi, dan meriwayatkan hadits dari mereka kepada Umar ibn Shahin, Ibn Batta, dan Abu Hafs al-Akbari. Ia mengadakan majelis studi di Masjid al-Mansur sebelum shalat Jumat untuk memberikan pendapat hukum dan majelis studi lainnya setelahnya untuk mendikte hadits. Di antara karyanya adalah \"al-Sunan\" dan \"al-Fawa'id\" tentang hadits. Ia hidup antara tahun 253 dan 348 Hijriah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
