summary:
  ar: "أحمد بن سلمان بن الحسن، أبو بكر النجاد، من أهل بغداد، من علماء الحنابلة، كان رأسا في الفقه والرواية، سمع الحسن بن مكرم وأبا داود السجستاني وإبراهيم الحربي، وروى عنه عمر بن شاهين وابن بطة وأبو حفص العكبري. كان له بجامع المنصور حلقة قبل الجمعة للفتوى وحلقة بعدها للإملاء. من تصانيفه «السنن» و«الفوائد» في الحديث. عاش بين 253 و348هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  en: "Ahmad ibn Salman ibn al-Hasan, Abu Bakr al-Najjad, of Baghdad, a Hanbali scholar who led in law and transmission. He heard from al-Hasan ibn Makram, Abu Dawud al-Sijistani and Ibrahim al-Harbi; Ibn Shahin, Ibn Batta and Abu Hafs al-Ukbari transmitted from him. He held a circle before the Friday prayer for fatwas and another after it for dictation at the mosque of al-Mansur. His works include 'al-Sunan' and 'al-Fawa'id' in hadith. He lived from 253 to 348 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
