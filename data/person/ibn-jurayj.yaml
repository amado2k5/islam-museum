id: person/ibn-jurayj
class: person
label: { ar: "ابن جريج", en: "Ibn Jurayj", es: "Ibn Jurayj", fr: "Ibn Jurayj", ur: "ابن جریج" }
summary:
  ar: "عبد الملك بن عبد العزيز بن جريج مولى آل أسيد بن أبي العيص بن أمية ويكنى أبا الوليد توفي سنة خمسين ومائة وله كتاب السنن ويحتوي على مثل ما تحتوي عليه كتب السنن مثل الطهارة والصيام والصلاة والزكاة وغير ذلك {cite:fihrist-ibn-al-nadim p. 316}."
  en: "Ibn Jurayj — the Meccan author of the early Sunan {cite:fihrist-ibn-al-nadim}"
  es: "Ibn Jurayj — el autor mecano de los primeros Sunan {cite:fihrist-ibn-al-nadim}"
  fr: "Ibn Jurayj — l'auteur mecquois des premiers Sunan {cite:fihrist-ibn-al-nadim}"
  ur: "ابن جریج - ابتدائی سنن کا مکی مصنف"
  tr: "Abdülmelik bin Abdülaziz ibn Küreyc, El-Asid bin Ebi el-Ays ibn Emiyye'nin özgür kalanı ve Ebu elli Welid'in 100. yılında vefat etti. Sünen kitabını yazdı ve sünnet kitaplarında bulunanlara benzer arınma, oruç, dua, zekat ve diğerlerini içerir {atıf:fihrist-ibn-al-nadim s. 316}."
  id: "Abdul Malik ibn Abdul Aziz ibn Jurayj, mantan budak Al-Asid ibn Abi al-'Ais ibn Umayyah, yang dikenal sebagai Abu al-Walid, meninggal pada tahun seratus lima puluh. Ia menulis sebuah kitab Sunan yang memuat yang mirip dengan apa yang terkandung dalam kitab Sunnah, seperti penyucian, puasa, doa, zakat, dan lainnya {cite:fihrist-ibn-al-nadim hlm. 316}."
