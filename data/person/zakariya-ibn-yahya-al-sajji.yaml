summary:
  ar: "أبو يحيى زكريا بن يحيى الساجي البصري، أخذ عن الربيع والمزني، ومات بالبصرة سنة سبع وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 55}. وله كتاب «اختلاف الفقهاء» وكتاب «علل الحديث» {cite:tabaqat-fuqaha-abbas-1981 p. 55}."
  tr: "Ebu Yahya Zekeriye ibn Yahya el-Saci el-Basri, el-Rabi' ve el-Muzani'nin yanında eğitim aldı ve üç yüz Hicri yılında Basra'da öldü {atıf:tabaqat-fuqaha-abbas-1981, s. 55}. Ayrıca \"İhtilaf el-Fuqaha\" ve \"Hadislerin Kusurları\" adlı kitabı da yazdı {atıf:tabaqat-fuqaha-abbas-1981, s. 55}."
  id: "Abu Yahya Zakariya ibn Yahya al-Saji al-Basri belajar di bawah bimbingan al-Rabi' dan al-Muzani, dan meninggal di Basra pada tahun tiga ratus H {cite:tabaqat-fuqaha-abbas-1981, hlm. 55}. Ia juga menulis buku \"Ikhtilaf al-Fuqaha\" dan buku \"Defects of Hadith\" {cite:tabaqat-fuqaha-abbas-1981, hlm. 55}."
