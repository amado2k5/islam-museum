gender: male
roles: [mystic, transmitter]
summary:
  ar: "حامد بن المسيب بن الحسين المؤذن، مؤذن الجامع، يعرف بشادة. كان يعرف بالدعاء المجاب، من الأمناء والنصحاء. حدّث عن سليمان بن حرب وأزهر بن سعيد."
  en: "Hamid ibn al-Musayyab ibn al-Husayn, the muezzin of the main mosque, called Shadhah; he was known for prayers that were answered, and was among the trustworthy and sincere. He narrated from Sulayman ibn Harb and Azhar ibn Sa'id."
  ur: "حامد بن مسیب بن حسین، جامع مسجد کے مؤذن، جو شاذہ کے نام سے مشہور تھے۔ ان کی دعا قبول ہونے کے لیے جانے جاتے تھے، اور امانت دار اور خیرخواہ لوگوں میں سے تھے۔ انہوں نے سلیمان بن حرب اور ازہر بن سعید سے روایت کی۔"
  es: "Hamid ibn al-Musayyab ibn al-Husayn, el muecín de la mezquita principal, llamado Shadhah, era conocido por la fidelidad de sus oraciones y por ser una persona de gran confianza y sinceridad. Narró de Sulayman ibn Harb y Azhar ibn Sa'id."
  fr: "Hamid ibn al-Musayyab ibn al-Husayn, le muezzin de la mosquée principale, appelée Shadhah, était réputé pour ses prières exaucées et comptait parmi les hommes dignes de confiance et sincères. Il rapportait des hadiths de Sulayman ibn Harb et d'Azhar ibn Sa'id."
  tr: "Caminin müezzi, Şada olarak bilinen Hamid ibn al-Musayyib ibn al-Mu'adhdhin'in kendisidir. Cevaplı dualarıyla tanınır ve güvenilir, samimi danışmanlar arasındaydı. Süleyman bin Harb ve Azhar ibn Sa'id'den rivayet ederdi."
  id: "Hamid ibn al-Musayyib ibn al-Husayn al-Mu'adhdhin, muezzin masjid yang dikenal sebagai Shada. Ia dikenal karena memohon dengan jawaban yang dijawab, dan termasuk di antara penasihat yang dapat dipercaya dan tulus. Ia menceritakan dari Sulayman ibn Harb dan Azhar ibn Sa'id."
