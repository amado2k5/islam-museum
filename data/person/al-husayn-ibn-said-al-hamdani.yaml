summary:
  ar: "الحسين بن سعيد بن حمدان؛ أخو أبي فراس الحمداني؛ أول من ولي حلب من بني حمدان تسامها في رجب سنة اثنتين وثلاثين وثلاثمائة منتزعاً إياها من يد أحمد بن سعيد الكلابي صاحب الإخشيد؛ وكان شجاعاً موصوفاً وفيه يقول ابن المنحم: وإذا رأوه مقبلاً قالوا ألا إن النايا تحت راية ذاكا {cite:wafayat-ayan}."
  en: "Al-Husayn b. Sa'id b. Hamdan (d. 338, Mosul) — Abu Firas's brother and the first Hamdanid to hold Aleppo, wrested in Rajab 332 from the Ikhshid's commander; buried in the mosque he built at Dayr al-A'la {cite:wafayat-ayan}."
  es: "Al-Husayn b. Sa'id b. Hamdan (m. 338, Mosul) — Hermano de Abu Firas y el primer Hamdaní en controlar Alepo, arrebatada en Rajab 332 al comandante de los Ikhshid; enterrado en la mezquita que construyó en Dayr al-A'la {cite:wafayat-ayan}."
  fr: "Al-Husayn b. Sa'id b. Hamdan (d. 338, Mossoul) — Frère d'Abu Firas et premier Hamdanide à tenir Alep, arrachée en Rajab 332 au commandant des Ikhshid; enterré dans la mosquée qu'il a construite à Dayr al-A'la {cite:wafayat-ayan}."
  ur: "الحسین بی سعید بی۔ ہمدان ⁦(متوفی 338، موصل)⁩ — ابو فراس کا بھائی اور حلب پر قبضہ کرنے والا پہلا ہمدان، رجب 332 میں اخشد کے کمانڈر سے چھینا گیا۔ اس مسجد میں دفن کیا گیا جسے اس نے دیر الاعلیٰ میں بنایا تھا۔"
  tr: "El-Hüseyin bin Said ibn Hamdan; Ebu Firas el-Hamdani'nin kardeşi; 332 Hicri yılında Recep'te yükseltilen Banu Hamdan'dan Halep'i ilk yöneten kişi, el-İhşid hükümdarı Ahmed bin Said el-Kilabi'den aldı; cesurdu ve cesur olarak tanımlandı; İbn al-Munhim şöyle der: 'Ve onu yaklaşırken gördüklerinde, 'Gerçekten de flüt onun bayrağı altındadır.' dediler. {alıntı:wafayat-ayan}."
  id: "Al-Husayn ibn Sa'id ibn Hamdan; saudara Abu Firas al-Hamdani; yang pertama memerintah Aleppo dari Banu Hamdan, yang dinaikkan di Rajab pada tahun 332 H, merebutnya dari Ahmad ibn Sa'id al-Kilabi, penguasa al-Ikhshid; ia berani dan digambarkan sebagai pemberani, dan Ibn al-Munhim berkata: 'Dan ketika mereka melihatnya mendekat, mereka berkata, 'Memang, seruling itu berada di bawah panji orang itu.' {cite:wafayat-ayan}."
