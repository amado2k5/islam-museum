summary:
  ar: "عدّاءة أفغانية في سباق 100 متر، وُلدت في ولاية كابيسا سنة 1989. كانت الرياضية الأفغانية الوحيدة في أولمبياد لندن 2012، حيث سجلت أفضل زمن شخصي لها وهو 14.42 ثانية، وأُدرجت في قائمة بي بي سي لأبرز 100 امرأة سنة 2015."
  en: "Afghan sprinter in the 100 metres, born in Kapisa Province in 1989. She was Afghanistan's only female athlete at the 2012 London Olympics, where she set a personal best of 14.42 seconds, and she was named to the BBC's 100 Women list in 2015."
  ur: "افغان 100 میٹر کی دوڑ کی کھلاڑی، 1989 میں صوبہ کپیسا میں پیدا ہوئیں۔ وہ لندن 2012 اولمپکس میں افغانستان کی واحد خاتون کھلاڑی تھیں، جہاں انہوں نے 14.42 سیکنڈ کا اپنا ذاتی بہترین وقت دیا، اور 2015 میں بی بی سی کی 100 خواتین کی فہرست میں شامل ہوئیں۔"
