summary:
  ar: ناشر وكاتب بريطاني مسلم؛ أسس وحرّر مجلة «إسلاميكا» ⁦(Islamica)⁩ الشهيرة في التسعينيات، وكتب وصمم كتبًا في التاريخ الإسلامي منها «تاريخ الإسلام المصور»، ويعمل مستشار تصميم ومحرر.
  en: 'British Muslim publisher and writer; founder and editor of the acclaimed 1990s magazine Islamica, he has written and designed books on Islamic history including Islam: An Illustrated History and
    works as a design consultant and editor.'
  ur: 'برطانوی مسلم ناشر اور مصنف؛ 90 کی دہائی کی مشہور میگزین Islamica کے بانی اور ایڈیٹر، اسلامی تاریخ پر کتابوں — بشمول Islam: An Illustrated History — کے لکھاری اور ڈیزائنر، اور ڈیزائن مشیر اور ایڈیٹر۔'
  es: "Editor y escritor musulmán británico; fundador y editor de la aclamada revista Islamica de la década de 1990, ha escrito y diseñado libros sobre historia islámica, entre ellos Islam: An Illustrated History, y trabaja como consultor de diseño y editor."
  fr: "Éditeur et écrivain musulman britannique; fondateur et rédacteur en chef du magazine renommé des années 1990, Islamica, il a écrit et conçu des livres sur l'histoire islamique, notamment Islam: An Illustrated History, et travaille comme consultant en design et éditeur."
  tr: "Britanyalı Müslüman bir yayıncı ve yazar; 1990'larda ünlü Islamica dergisini kurdu ve editörlüğünü yaptı, ayrıca \"The Illustrated History of Islam\" dahil olmak üzere İslam tarihi üzerine kitaplar yazdı ve tasarladı. Ayrıca tasarım danışmanı ve editör olarak da çalışmaktadır."
  id: "Seorang penerbit dan penulis Muslim Inggris; ia mendirikan dan mengedit majalah terkenal Islamica pada tahun 1990-an, serta menulis dan merancang buku tentang sejarah Islam termasuk \"The Illustrated History of Islam.\" Ia juga bekerja sebagai konsultan desain dan editor."
