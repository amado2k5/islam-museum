label: { ar: "المنذر بن الجارود العبدي", en: "al-Mundhir ibn al-Jarud al-Abdi", es: "al-Mundhir ibn al-Jarud al-Abdi", fr: "al-Mundhir ibn al-Jarud al-Abdi", ur: "المنذر ابن جارود العبدی" }
summary:
  ar: "المنذر بن الجارود العبدي؛ كلم معاوية بن أبي سفيان في حفر نهر ثار فكتب إلى زياد فحفر نهر معقل فيما يقولون."
  en: "Al-Mundhir ibn al-Jarud al-Abdi; he spoke to Mu'awiya about digging the Tharr canal, so the letter went to Ziyad and the Ma'qil canal was dug, as they tell it."
  es: "Al-Mundhir ibn al-Jarud al-Abdi habló con Mu'awiya sobre la excavación del canal de Tharr, por lo que la carta llegó a Ziyad y se excavó el canal de Ma'qil, según cuentan."
  fr: "Al-Mundhir ibn al-Jarud al-Abdi; il a parlé à Mu'awiya du creusement du canal de Tharr, la lettre est donc allée à Ziyad et le canal de Ma'qil a été creusé, comme ils le racontent."
  ur: "المنذر ابن الجرود العبدی؛ اس نے معاویہ سے نہر تھر کھودنے کی بات کی تو وہ خط زیاد کے پاس گیا اور نہر معقل کھودی گئی جیسا کہ وہ بتاتے ہیں۔"
  tr: "El-Mundhir bin el-Cerud el-Abdi; Muaviye bin Ebi Sufyan ile Thar Nehri'nin kazılması hakkında konuştu, bu yüzden Ziyad'a yazdı; Ziyad da onların söylediğine göre Ma'qil Nehri'ni kazdı."
  id: "Al-Mundhir ibn al-Jarud al-Abdi; ia berbicara kepada Muawiyah ibn Abi Sufyan tentang penggalian Sungai Thar, maka ia menulis kepada Ziyad, yang menggali Sungai Ma'qil, menurut apa yang mereka katakan."
