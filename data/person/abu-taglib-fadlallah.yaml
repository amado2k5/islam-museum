id: person/abu-taglib-fadlallah
class: person
label: { ar: "أبو تغلب فضل الله بن ناصر الدولة", en: "Abu Taghlib Fadl Allah ibn Nasir al-Dawla", fr: "Abu Taghlib Fadl Allah ibn Nasir al-Dawla", es: "Abu Taghlib Fadl Allah ibn Nasir al-Dawla", ur: "ابو تغلب فضل اللہ ابن ناصر الدولہ" }
summary:
  ar: "الغدانفر أبو تغلب فضل الله بن ناصر الدولة بن حمدان، آخر أمراء بني حمدان بالجزيرة؛ قاتل عضد الدولة عن الموصل ثم انهزم إلى الشام فحال بينه وبين دمشق قسّام الذي تغلب عليها، ورحل إلى ناوى فجاءه كتاب العزيز يدعوه إلى مصر فامتنع وترددت الرسل، واجتمع بقائد العزيز عند طبريّة وأمده بكل ما أحب ولم يتح له أخذ دمشق سلماً، ثم سار إلى الرملة فحسبه دغفل بن المقرج الجراحي والفضل صاحب العزيز مقصداً لحربهما فجمعا العساكر وانهزمت عقيل عنه فلم يبق معه إلا نحو سبعمائة من غلمانه فأُخذ أسيراً وقتله دغفل سنة 369هـ وأرسل رأسه إلى مصر {cite:kamil-ibn-al-athir p. 512-514}."
  en: "The Ghadanfar Abu Taghlib Fadlallah, last Hamdanid amir of the Jazira; driven from Mosul by Adud al-Dawla, kept out of Damascus by Qassam, he was taken near Ramla in 369 when his Uqayli allies melted away, and Daghful the Jarrahid killed him lest al-Aziz make him a client — his head went to Egypt {cite:kamil-ibn-al-athir p. 512-514}."
  fr: "Al-Ghadanfar Abu Taghlib Fadlallah, dernier émir hamdanide de la Jazira ; chassé de Mossoul par Adud al-Dawla, tenu à l'écart de Damas par Qassam, il fut capturé près de Ramla en 369 après la défection de ses alliés uqaylites. Le Jarrahite Daghful le tua de peur qu'al-Aziz n'en fasse son client ; sa tête fut envoyée en Égypte {cite:kamil-ibn-al-athir p. 512-514}."
  es: "El Ghadanfar Abu Taghlib Fadlallah, último emir hamdánida de Jazira; expulsado de Mosul por Adud al-Dawla, mantenido fuera de Damasco por Qassam, fue capturado cerca de Ramla en 369 cuando sus aliados uqayli se dispersaron, y Daghful el Jarrahid lo mató para que al-Aziz no lo convirtiera en su cliente; su cabeza fue a Egipto {cite:kamil-ibn-al-athir p. 512-514}."
  ur: "غضنفر ابو تغلب فضل اللہ، جزیرہ کے آخری ہمدانی امیر؛ عود الدولہ کے ذریعہ موصل سے نکالا گیا، جسے قاسم نے دمشق سے باہر رکھا، اسے 369 میں رملہ کے قریب لے جایا گیا جب اس کے عقیلی اتحادی پگھل گئے، اور داغفل جراحد نے اسے قتل کردیا تاکہ العزیز اسے اپنا مؤکل نہ بنا لے - اس کا سر مصر چلا گیا۔ 512-514}۔"
  tr: "Cezire'deki Beni Hamdan prenslerinin sonuncusu olan El-Gadanfar Ebu Teğlib Fadl Allah ibn Nasir el-Davla ibn Hamdan, Musul için Adud el-Davla ile savaştı, sonra yenildi ve Levant'a kaçtı. Şam'ı fethetmiş olan Kassam, onun oraya ulaşmasını engelledi. Nawa'ya gitti ve ona el-Aziz'den Mısır'a davet eden bir mektup geldi, ancak reddetti. Elçiler sürekli gidip geliyordu ve Tiberias'ta el-Aziz'in komutanıyla görüştü; komutan ona istediği her şeyi sağladı. Şam'ı barışçıl bir şekilde ele geçiremedi. Sonra Ramla'ya yürüdü ve Daghfal ibn el-Muqrij el-Jarahi ve el-Aziz'in arkadaşı el-Fadl, onun savaşlarının hedefi olduğunu düşündüler. Ordular topladılar ve Akil onun tarafından yenilgiye uğratıldı, böylece yanında sadece yaklaşık yedi yüz hizmetkarı kaldı. Esir alındı ve Daghfal onu Hicri 369 yılında öldürdü ve başını Mısır'a gönderdi. {cite:kamil-ibn-al-athir s. 512-514}"
  id: "Al-Ghadanfar Abu Taghlib Fadl Allah ibn Nasir al-Dawla ibn Hamdan, pangeran terakhir Banu Hamdan di Jazira, berperang melawan Adud al-Dawla untuk merebut Mosul, kemudian ia dikalahkan dan melarikan diri ke Levant. Qassam, yang telah menaklukkan Damaskus, mencegahnya mencapai kota itu. Ia pergi ke Nawa, dan sebuah surat dari al-Aziz datang kepadanya yang mengundangnya ke Mesir, tetapi ia menolak. Para utusan terus datang dan pergi, dan ia bertemu dengan komandan al-Aziz di Tiberias, yang menyediakan segala yang diinginkannya. Ia tidak mampu merebut Damaskus dengan damai. Kemudian ia berbaris ke Ramla, dan Daghfal ibn al-Muqrij al-Jarahi dan al-Fadl, sahabat al-Aziz, mengira ia adalah target perang mereka. Mereka mengumpulkan pasukan, dan Aqil dikalahkan olehnya, sehingga hanya sekitar tujuh ratus pelayannya yang tersisa bersamanya. Dia ditawan, dan Daghfal membunuhnya pada tahun 369 H dan mengirimkan kepalanya ke Mesir. {cite:kamil-ibn-al-athir p. 512-514}."
