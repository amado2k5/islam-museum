label: { ar: "أبو تغلب فضل الله بن ناصر الدولة" }
summary:
  ar: "الغدانفر أبو تغلب فضل الله بن ناصر الدولة بن حمدان، آخر أمراء بني حمدان بالجزيرة؛ قاتل عضد الدولة عن الموصل ثم انهزم إلى الشام فحال بينه وبين دمشق قسّام الذي تغلب عليها، ورحل إلى ناوى فجاءه كتاب العزيز يدعوه إلى مصر فامتنع وترددت الرسل، واجتمع بقائد العزيز عند طبريّة وأمده بكل ما أحب ولم يتح له أخذ دمشق سلماً، ثم سار إلى الرملة فحسبه دغفل بن المقرج الجراحي والفضل صاحب العزيز مقصداً لحربهما فجمعا العساكر وانهزمت عقيل عنه فلم يبق معه إلا نحو سبعمائة من غلمانه فأُخذ أسيراً وقتله دغفل سنة 369هـ وأرسل رأسه إلى مصر {cite:kamil-ibn-al-athir p. 512-514}."
  en: "The Ghadanfar Abu Taghlib Fadlallah, last Hamdanid amir of the Jazira; driven from Mosul by Adud al-Dawla, kept out of Damascus by Qassam, he was taken near Ramla in 369 when his Uqayli allies melted away, and Daghful the Jarrahid killed him lest al-Aziz make him a client — his head went to Egypt {cite:kamil-ibn-al-athir p. 512-514}."
