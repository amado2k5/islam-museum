  ar: "شيخ وزعيم عسكري سوري (1883–1950) من أعيان العلويين في جبال الساحل، قاد ثورة الساحل ضد الانتداب الفرنسي (1919–1921)، ورفض مشروع الدولة العلوية المنفصلة، واعتزل السياسة بعد عفو 1922 حتى وفاته في طرطوس."
  en: "Syrian sheikh and military leader (1883–1950), an Alawite notable of the coastal mountains who led the revolt of the Syrian coast against the French Mandate (1919–1921), refused the project of a separate Alawite state, and withdrew from politics after the amnesty of 1922 until his death at Tartus."
  ur: "شامی شیخ اور عسکری رہنما (1883–1950)، ساحلی پہاڑوں کے علوی اعیان میں سے، جنہوں نے فرانسیسی مینڈیٹ کے خلاف ساحلی بغاوت (1919–1921) کی قیادت کی، الگ علوی ریاست کے منصوبے کو مسترد کیا، اور 1922 کی عام معافی کے بعد طرطوس میں اپنی وفات تک سیاست سے کنارہ کش رہے۔"
