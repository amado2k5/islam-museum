summary:
  ar: "سياسي وأديب سندي (1904–1995) من سنّ: بدأ في حركة الخلافة وهو ابن ست عشرة سنة، وصار رئيس رابطة السند الإسلامية 1943 ثم انشق عن الرابطة، فأسس حركات «جيئي سندھ» المنادية باستقلال السند، وقضى نحو ثلاثين عاما بين السجن والإقامة الجبرية، وألّف أكثر من ستين كتابا في تاريخ السند وثقافتها ودينها."
  en: "Sindhi politician and writer (1904–1995) from Sann: he began in the Khilafat movement at sixteen, rose to president of the Sindh Muslim League in 1943, broke with the League, and founded the Jeay Sindh movements for a separate Sindhi homeland — spending some thirty years in prison or house arrest and writing more than sixty books on Sindh's history, culture and religion."
  ur: "Sindhi politician and writer (1904–1995) from Sann: he began in the Khilafat movement at sixteen, rose to president of the Sindh Muslim League in 1943, broke with the League, and founded the Jeay Sindh movements for a separate Sindhi homeland — spending some thirty years in prison or house arrest and writing more than sixty books on Sindh's history, culture and religion."
