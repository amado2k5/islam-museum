summary: {ar: 'محمد بن عبد الكبير الكتاني، أبو الفيض وأبو عبد الله: فقيه متفلسف متصوف من أهل فاس ومؤسس الطريقة الكتانية بالمغرب، شقيق محمد عبد الحي صاحب فهرس الفهارس، سجن وجلد ومات بفاس الجديدة سنة ١٣٢٧ هـ الموافقة ١٩٠٩ م.', en: 'Muhammad ibn Abd al-Kabir al-Kettani, Abu al-Fayd and Abu Abd Allah: a jurist and philosophically inclined Sufi of Fez, founder of the Kattaniyya order in Morocco and brother of Muhammad Abd al-Hayy, author of «Fihris al-Fahaaris»; jailed and flogged, he died in Fes al-Jadid in 1327 AH (1909 CE).', es: "Muhammad ibn Abd al-Kabir al-Kettani, Abu al-Fayd y Abu Abd Allah: jurista y sufí de inclinación filosófica de Fez, fundador de la orden Kattaniyya en Marruecos y hermano de Muhammad Abd al-Hayy, autor de «Fihris al-Fahaaris»; encarcelado y azotado, murió en Fez al-Jadid en 1327 AH (1909 d. C.).", fr: "Muhammad ibn Abd al-Kabir al-Kettani, Abu al-Fayd et Abu Abd Allah: juriste et soufi à tendance philosophique de Fès, fondateur de l'ordre Kattaniyya au Maroc et frère de Muhammad Abd al-Hayy, auteur de « Fihris al-Fahaaris »; emprisonné et fouetté, il mourut à Fès al-Jadid en 1327 AH (1909 CE).", ur: "محمد بن عبد الکبیر الکیتانی، ابو الفائد اور ابو عبد اللہ: ایک فقیہ اور فلسفیانہ طور پر مائل فیز کے صوفی، مراکش میں کتانیہ حکم کے بانی اور محمد عبد الحی کے بھائی، \"فہریس الفھارس\" کے مصنف؛ جیل میں ڈالا اور کوڑے مارے گئے، اس کا انتقال 1327 ہجری ⁦(1909 عیسوی)⁩ میں فی الجدید میں ہوا۔", tr: "Muhammed bin Abdülkabir el-Kattani, Ebu el-Fayd ve Ebu Abdullah: Fesli bir hukukçu, felsefi Sufi ve Fas'ta Kattaniyya tarikatının kurucusu, dizin dizininin yazarı Muhammed Abd al-Hayy'in kardeşi. Hapsedildi, kırbaçlandı ve 1327 Hicri'nde, yani 1909 M.S. Yeni Fes'te öldü.", id: "Muhammad ibn Abd al-Kabir al-Kattani, Abu al-Fayd dan Abu Abdullah: seorang ahli hukum, sufi filsafat, dari Fez dan pendiri tarekat Kattaniyya di Maroko, saudara Muhammad Abd al-Hayy, penulis indeks indeks. Ia dipenjara, dicambuk, dan meninggal di New Fez pada tahun 1327 H, sesuai dengan tahun 1909 M."}
