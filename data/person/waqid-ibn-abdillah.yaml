summary:
  ar: تميمي يربوعي حليف بني عدي؛ شهد بدراً، وهو الذي رمى عمرو بن الحضرمي بسهم فقتله في سرية نخلة، فنزلت آية الشهر الحرام، وكانت بنو يربوع تفخر بأن منهم أول من قتل قتيلاً من المشركين في الإسلام؛ ومات في أول خلافة عمر.
  en: A Tamimi of Banu Yarbu', ally of Banu Adi; he was at Badr, and he is the one who shot Amr ibn al-Hadrami dead with an arrow in the Nakhla raid, after which the verse about the sacred month was revealed; Banu Yarbu' used to boast that one
    of them was the first to kill a polytheist in Islam; he died at the start of Umar's caliphate.
  ur: "بنو یربوع کا تمیمی، بنو عدي کا حلیف؛ بدر میں تھا اور وہی ہے جس نے نخلہ کی مہم میں عمرو بن حضرمی کو تیر مار کر قتل کیا۔"
  es: "Tamimi, de Banu Yarbu', aliado de Banu Adi; estuvo en Badr, y fue él quien mató a Amr ibn al-Hadrami de una flecha en la incursión de Nakhla, tras lo cual se reveló el versículo sobre el mes sagrado; Banu Yarbu' solía jactarse de que uno de ellos fue el primero en matar a un politeísta en el Islam; murió al comienzo del califato de Umar."
  fr: "Un Tamimi des Banu Yarbu', allié des Banu Adi; il était à Badr, et c'est lui qui abattit Amr ibn al-Hadrami d'une flèche lors du raid de Nakhla, après quoi le verset concernant le mois sacré fut révélé; les Banu Yarbu' se vantaient d'avoir été le premier à tuer un polythéiste en Islam; il mourut au début du califat d'Umar."
  tr: "Banu 'Adi'nin müttefiki Tamimi Yarbu'i; Bedr'e tanık oldu ve Nakhla seferinde Amr ibn al-Hadrami ile okla vurup öldüren kişiydi. Kutsal ayın ayeti ortaya çıktı ve Banu Yarbu', İslam'da bir kafiri öldüren ilk kişi olmaktan gurur duydu; Ömer halifeliğinin başında öldü."
  id: "Tamimi Yarbu'i, sekutu Banu 'Adi; ia menyaksikan Badr dan dialah yang menembak Amr ibn al-Hadrami dengan panah dan membunuhnya dalam ekspedisi Nakhla. Bait bulan suci itu diungkapkan, dan Banu Yarbu' bangga menjadi yang pertama membunuh seorang politeis dalam Islam; ia meninggal pada awal kekhalifahan Umar."
