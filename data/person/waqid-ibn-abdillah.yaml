summary:
  ar: تميمي يربوعي حليف بني عدي؛ شهد بدراً، وهو الذي رمى عمرو بن الحضرمي بسهم فقتله في سرية نخلة، فنزلت آية الشهر الحرام، وكانت بنو يربوع تفخر بأن منهم أول من قتل قتيلاً من المشركين في الإسلام؛ ومات في أول خلافة عمر.
  en: A Tamimi of Banu Yarbu', ally of Banu Adi; he was at Badr, and he is the one who shot Amr ibn al-Hadrami dead with an arrow in the Nakhla raid, after which the verse about the sacred month was revealed; Banu Yarbu' used to boast that one
    of them was the first to kill a polytheist in Islam; he died at the start of Umar's caliphate.
