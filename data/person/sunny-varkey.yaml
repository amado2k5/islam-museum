summary:
  ar: "ساني فايركي (وُلد في 9 نيسان 1957 في راني بولاية كيرالا)، رجل أعمال تربوي ومحسن هندي يقيم في دبي، مؤسس مجموعة جيمس للتعليم ورئيسها التنفيذي، وهي أكبر مشغّل لمدارس خاصة من الروضة حتى الثانوية في العالم، ومؤسس مؤسسة فايركي وجائزة المعلم العالمية التابعة لها. وهو سفير نوايا حسنة لليونسكو، وانضم إلى تعهد العطاء سنة 2015، ونال وسام بادما شري سنة 2009."
  en: "Sunny Varkey (born 9 April 1957 at Ranni, Kerala) is an Indian education entrepreneur and philanthropist based in Dubai, founder and executive chairman of GEMS Education, the world's largest operator of private kindergarten-to-grade-12 schools, and founder of the Varkey Foundation and its Global Teacher Prize. A UNESCO Goodwill Ambassador, he joined The Giving Pledge in 2015 and received the Padma Shri in 2009."
  ur: "سنی ورکی (پیدائش 9 اپریل 1957، رانی، کیرالا) دبئی میں مقیم بھارتی تعلیمی کاروباری اور مخیر ہیں، جیمز ایجوکیشن کے بانی و ایگزیکٹو چیئرمین، جو نجی کنڈرگارٹن تا بارہویں جماعت کے اسکولوں کا دنیا کا سب سے بڑا آپریٹر ہے، اور ورکی فاؤنڈیشن اور اس کے عالمی استاد انعام کے بانی ہیں۔ وہ یونیسکو کے خیر سگالی سفیر ہیں، 2015 میں دی گیونگ پلیج میں شامل ہوئے اور 2009 میں پدم شری ملا۔"

