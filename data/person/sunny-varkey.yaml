summary:
  ar: "ساني فايركي ⁦(وُلد في 9 نيسان 1957 في راني بولاية كيرالا)⁩، رجل أعمال تربوي ومحسن هندي يقيم في دبي، مؤسس مجموعة جيمس للتعليم ورئيسها التنفيذي، وهي أكبر مشغّل لمدارس خاصة من الروضة حتى الثانوية في العالم، ومؤسس مؤسسة فايركي وجائزة المعلم العالمية التابعة لها. وهو سفير نوايا حسنة لليونسكو، وانضم إلى تعهد العطاء سنة 2015، ونال وسام بادما شري سنة 2009."
  en: "Sunny Varkey (born 9 April 1957 at Ranni, Kerala) is an Indian education entrepreneur and philanthropist based in Dubai, founder and executive chairman of GEMS Education, the world's largest operator of private kindergarten-to-grade-12 schools, and founder of the Varkey Foundation and its Global Teacher Prize. A UNESCO Goodwill Ambassador, he joined The Giving Pledge in 2015 and received the Padma Shri in 2009."
  ur: "سنی ورکی ⁦(پیدائش 9 اپریل 1957، رانی، کیرالا)⁩ دبئی میں مقیم بھارتی تعلیمی کاروباری اور مخیر ہیں، جیمز ایجوکیشن کے بانی و ایگزیکٹو چیئرمین، جو نجی کنڈرگارٹن تا بارہویں جماعت کے اسکولوں کا دنیا کا سب سے بڑا آپریٹر ہے، اور ورکی فاؤنڈیشن اور اس کے عالمی استاد انعام کے بانی ہیں۔ وہ یونیسکو کے خیر سگالی سفیر ہیں، 2015 میں دی گیونگ پلیج میں شامل ہوئے اور 2009 میں پدم شری ملا۔"
  es: "Sunny Varkey (nacido el 9 de abril de 1957 en Ranni, Kerala) es un empresario y filántropo indio del sector educativo, afincado en Dubái. Es fundador y presidente ejecutivo de GEMS Education, la mayor operadora mundial de colegios privados desde preescolar hasta bachillerato, y fundador de la Fundación Varkey y su Premio Global al Docente. Embajador de Buena Voluntad de la UNESCO, se unió a The Giving Pledge en 2015 y recibió el premio Padma Shri en 2009."
  fr: "Sunny Varkey (né le 9 avril 1957 à Ranni, au Kerala) est un entrepreneur indien du secteur de l'éducation et un philanthrope installé à Dubaï. Il est le fondateur et président exécutif de GEMS Education, le plus grand réseau mondial d'établissements scolaires privés, de la maternelle à la terminale, et le fondateur de la Fondation Varkey et de son Prix mondial de l'enseignement. Ambassadeur de bonne volonté de l'UNESCO, il a rejoint l'initiative « The Giving Pledge » en 2015 et a reçu le Padma Shri en 2009."
  tr: "Sunny Vierke (9 Nisan 1957, Rani, Kerala doğumlu), Dubai'de yaşayan Hintli bir eğitim iş insanı ve hayırseverdir, anaokulundan liseye kadar özel okulların dünyanın en büyük işletmecisi olan GEMS Education Group'un kurucusu ve CEO'su ile Vierke Vakfı ve Küresel Öğretmen Ödülü'nün kurucusudur. UNESCO İyi Niyet Elçisidir, 2015'te Giving Pledge'e katıldı ve 2009'da Padma Shri ödülünü aldı."
  id: "Sunny Vierke (lahir 9 April 1957 di Rani, Kerala) adalah seorang pengusaha pendidikan dan dermawan India yang tinggal di Dubai, pendiri dan CEO GEMS Education Group, operator sekolah swasta terbesar di dunia dari taman kanak-kanak hingga sekolah menengah, serta pendiri Vierke Foundation dan Global Teacher Award-nya. Ia adalah Duta Goodwill UNESCO, bergabung dengan Giving Pledge pada tahun 2015, dan menerima Padma Shri pada tahun 2009."

