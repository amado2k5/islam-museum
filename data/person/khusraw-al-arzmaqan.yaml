summary:
  ar: "خسرو الأرزمقان من جوخى من قرية على النهر وان، زعم أن النور كان حيا لم يزل وكان نائما فغشيته الظلمة وأخذت منه نورا، فأرسل إليها بابن الأحياء ليسترده، وكان يطعن على عيسى ويكتم مذهبه ولا يذيعه ولا كتاب له {cite:fihrist-ibn-al-nadim p. 475-476}."
  en: "Khusraw al-Arzmaqan — the sleeping-light doctrine {cite:fihrist-ibn-al-nadim}"
