summary:
  ar: "خسرو الأرزمقان من جوخى من قرية على النهر وان، زعم أن النور كان حيا لم يزل وكان نائما فغشيته الظلمة وأخذت منه نورا، فأرسل إليها بابن الأحياء ليسترده، وكان يطعن على عيسى ويكتم مذهبه ولا يذيعه ولا كتاب له {cite:fihrist-ibn-al-nadim p. 475-476}."
  en: "Khusraw al-Arzmaqan — the sleeping-light doctrine {cite:fihrist-ibn-al-nadim}"
  es: "Khusraw al-Arzmaqan — la doctrina de la luz durmiente {cite:fihrist-ibn-al-nadim}"
  fr: "Khusraw al-Arzmaqan — la doctrine de la lumière du sommeil {cite:fihrist-ibn-al-nadim}"
  ur: "خسرو الارزمقان - نیند کی روشنی کا نظریہ {حوالہ: فہرست ابن الندیم}"
  tr: "Wan Nehri kenarındaki bir köyden Johi'den Khusraw al-Arzmaqan, ışığın hâlâ canlı ve uyuduğunu iddia ederek, karanlığın onu sardığını ve ışığı aldığını söyledi. Onu getirmesi için yaşayan bir oğlunu gönderdi; İsa'ya saldıracak, öğretisini gizleyecek ama bunu ya da kitabını yayınlamayacak {cite:fihrist-ibn-al-nadim s. 475-476}."
  id: "Khusraw al-Arzmaqan dari Jokhi dari sebuah desa di tepi sungai Wan, mengklaim bahwa cahaya itu masih hidup dan tertidur, sehingga kegelapan menyelimutinya dan mengambil cahaya darinya. Ia mengirim seorang putra orang hidup untuk menjemputnya, dan ia menyerang Yesus serta menyembunyikan ajarannya tetapi tidak menyebarkannya atau bukunya {cite:fihrist-ibn-al-nadim hlm. 475-476}."
