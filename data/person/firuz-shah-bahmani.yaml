summary:
  ar: "سلطان بهمني في الدكن (حكم 1397-1422)، ابن داود شاه وحفيد مؤسس الدولة علاء الدين بهمن شاه، وأخو أحمد شاه الأول. نشأ في كنف محمد شاه الثاني الذي زوّجه ابنته وجعله ولي عهده، ثم انتزع العرش سنة 1397 من السلطان الدمية شمس الدين. وسّع مملكته وحارب فيجايانغارا مراراً فغلب في 1398 و1406 وهُزم عند بانغال سنة 1419. بنى مدينة فيروز آباد، وجعل الدكن مركزاً ثقافياً يستقدم العلماء والأدباء من الخليج. في أواخر أيامه مال إلى الزهد، ثم أُكره على التنازل لأخيه أحمد سنة 1422 وتوفي في غلبرغا في 1 أكتوبر 1422 ودُفن في هفت غنبذ."
  en: "Bahmani sultan of the Deccan (r. 1397–1422), son of Dawud Shah and grandson of the dynasty's founder Ala al-Din Bahman Shah, and brother of Ahmad Shah I. Raised by Muhammad Shah II, who married him to his daughter and made him heir presumptive, he seized the throne in 1397 from the puppet sultan Shams al-Din. He expanded the kingdom and fought Vijayanagara repeatedly, winning in 1398 and 1406 but losing at Pangal in 1419. He built the city of Firozabad and made the Deccan a cultural centre, recruiting scholars and men of letters from the Persian Gulf. In his last years he turned to asceticism; forced to abdicate to his brother Ahmad in 1422, he died at Gulbarga on 1 October 1422 and was buried in the Haft Gumbaz."
  ur: "دکن کے بہمنی سلطان (دورِ حکومت 1397ء–1422ء)، داود شاہ کے بیٹے اور سلسلے کے بانی علاء الدین بہمن شاہ کے پوتے، اور احمد شاہ اول کے بھائی۔ وہ محمد شاہ ثانی کے زیرِ سرپرستی پلے، جنھوں نے اپنی بیٹی ان سے بیاہی اور انھیں ولی عہد بنایا؛ پھر 1397ء میں انھوں نے کٹھ پتلی سلطان شمس الدین سے تخت چھین لیا۔ انھوں نے سلطنت کو وسعت دی اور وجے نگر سے بارہا جنگ کی، 1398ء اور 1406ء میں کامیاب رہے مگر 1419ء میں پانگل کے مقام پر شکست کھائی۔ انھوں نے فیروز آباد شہر بسایا اور دکن کو ثقافتی مرکز بنایا، خلیجِ فارس سے علما و ادبا کو بلایا۔ آخری برسوں میں وہ زہد کی طرف مائل ہوئے؛ 1422ء میں اپنے بھائی احمد کے حق میں دستبردار ہونے پر مجبور ہوئے اور 1 اکتوبر 1422ء کو گلبرگہ میں وفات پائی اور ہفت گنبد میں دفن ہوئے۔"

