summary:
  ar: "سلطان بهمني في الدكن ⁦(حكم 1397-1422)⁩، ابن داود شاه وحفيد مؤسس الدولة علاء الدين بهمن شاه، وأخو أحمد شاه الأول. نشأ في كنف محمد شاه الثاني الذي زوّجه ابنته وجعله ولي عهده، ثم انتزع العرش سنة 1397 من السلطان الدمية شمس الدين. وسّع مملكته وحارب فيجايانغارا مراراً فغلب في 1398 و1406 وهُزم عند بانغال سنة 1419. بنى مدينة فيروز آباد، وجعل الدكن مركزاً ثقافياً يستقدم العلماء والأدباء من الخليج. في أواخر أيامه مال إلى الزهد، ثم أُكره على التنازل لأخيه أحمد سنة 1422 وتوفي في غلبرغا في 1 أكتوبر 1422 ودُفن في هفت غنبذ."
  en: "Bahmani sultan of the Deccan (r. 1397–1422), son of Dawud Shah and grandson of the dynasty's founder Ala al-Din Bahman Shah, and brother of Ahmad Shah I. Raised by Muhammad Shah II, who married him to his daughter and made him heir presumptive, he seized the throne in 1397 from the puppet sultan Shams al-Din. He expanded the kingdom and fought Vijayanagara repeatedly, winning in 1398 and 1406 but losing at Pangal in 1419. He built the city of Firozabad and made the Deccan a cultural centre, recruiting scholars and men of letters from the Persian Gulf. In his last years he turned to asceticism; forced to abdicate to his brother Ahmad in 1422, he died at Gulbarga on 1 October 1422 and was buried in the Haft Gumbaz."
  ur: "دکن کے بہمنی سلطان ⁦(دورِ حکومت 1397ء–1422ء)⁩، داود شاہ کے بیٹے اور سلسلے کے بانی علاء الدین بہمن شاہ کے پوتے، اور احمد شاہ اول کے بھائی۔ وہ محمد شاہ ثانی کے زیرِ سرپرستی پلے، جنھوں نے اپنی بیٹی ان سے بیاہی اور انھیں ولی عہد بنایا؛ پھر 1397ء میں انھوں نے کٹھ پتلی سلطان شمس الدین سے تخت چھین لیا۔ انھوں نے سلطنت کو وسعت دی اور وجے نگر سے بارہا جنگ کی، 1398ء اور 1406ء میں کامیاب رہے مگر 1419ء میں پانگل کے مقام پر شکست کھائی۔ انھوں نے فیروز آباد شہر بسایا اور دکن کو ثقافتی مرکز بنایا، خلیجِ فارس سے علما و ادبا کو بلایا۔ آخری برسوں میں وہ زہد کی طرف مائل ہوئے؛ 1422ء میں اپنے بھائی احمد کے حق میں دستبردار ہونے پر مجبور ہوئے اور 1 اکتوبر 1422ء کو گلبرگہ میں وفات پائی اور ہفت گنبد میں دفن ہوئے۔"
  es: "Bahmani, sultán del Decán (r. 1397–1422), hijo de Dawud Shah y nieto del fundador de la dinastía, Ala al-Din Bahman Shah, y hermano de Ahmad Shah I. Criado por Muhammad Shah II, quien lo casó con su hija y lo nombró heredero presuntivo, se apoderó del trono en 1397 del sultán títere Shams al-Din. Expandió el reino y luchó repetidamente contra Vijayanagara, obteniendo victorias en 1398 y 1406, pero siendo derrotado en Pangal en 1419. Fundó la ciudad de Firozabad e hizo del Decán un centro cultural, reclutando a eruditos y hombres de letras del Golfo Pérsico. En sus últimos años se volcó al ascetismo; obligado a abdicar en favor de su hermano Ahmad en 1422, murió en Gulbarga el 1 de octubre de 1422 y fue enterrado en el Haft Gumbaz."
  fr: "Sultan bahmani du Deccan (r. 1397-1422), fils de Dawud Shah et petit-fils du fondateur de la dynastie, Ala al-Din Bahman Shah, et frère d'Ahmad Shah Ier, fut élevé par Muhammad Shah II, qui le maria à sa fille et le désigna comme héritier présomptif. Il s'empara du trône en 1397, renversant le sultan fantoche Shams al-Din. Il étendit le royaume et affronta Vijayanagara à plusieurs reprises, remportant des victoires en 1398 et 1406, mais subissant une défaite à Pangal en 1419. Il fit construire la ville de Firozabad et fit du Deccan un centre culturel, attirant des érudits et des lettrés du Golfe persique. À la fin de sa vie, il se retira dans l'ascétisme; contraint d'abdiquer en faveur de son frère Ahmad en 1422, il mourut à Gulbarga le 1er octobre 1422 et fut inhumé au Haft Gumbaz."
  tr: "Dekkan Sultanı Bahmani (1397-1422 yılları arasında hüküm sürdü), Davud Şah'ın oğlu, devletin kurucusu Alauddin Bahman Shah'ın torunu ve Ahmad Shah I'in kardeşi. Muhammed Şah II'nin emrinde büyüdü; Muhammed Şah kızıyla evlendi ve onu veliaht prensi yaptı, ardından 1397'de kukla Sultan Şemsuddin'den tahtı ele geçirdi. Krallığını genişletti ve Vijayana'da savaştı Gara'yı defalarca yendi, 1398 ve 1406'da yendi, 1419'da Bangla'da yenildi. Firozabad şehrini inşa etti ve Dekkan'ı Körfez'den bilim insanları ve yazarları çeken bir kültür merkezi haline getirdi. İlerleyen yıllarında münzeviye yöneldi, ardından 1422'de kardeşi Ahmad'a tahttan feragat etmek zorunda kaldı. 1 Ekim 1422'de Galbarga'da öldü ve Haft Ghanbadh'a defnedildi."
  id: "Sultan Bahmani dari Deccan (memerintah 1397-1422), putra Dawood Shah, cucu pendiri negara Alauddin Bahman Shah, dan saudara Ahmad Shah I. Ia tumbuh di bawah Muhammad Shah II, yang menikahi putrinya dan menjadikannya putra mahkota, kemudian merebut takhta pada tahun 1397 dari boneka Sultan Shamsuddin. Ia memperluas kerajaannya dan bertarung melawan Vijayanagara berulang kali, mengalahkannya pada tahun 1398 dan 1406 serta dikalahkan di Bangla pada tahun 1419. Ia membangun kota Firozabad dan menjadikan Deccan sebagai pusat budaya yang menarik para cendekiawan dan penulis dari Teluk. Di tahun-tahun terakhirnya, ia cenderung ke arah asketisme, lalu terpaksa turun tahta kepada saudaranya Ahmad pada tahun 1422. Ia meninggal di Galbarga pada 1 Oktober 1422 dan dimakamkan di Haft Ghanbadh."

