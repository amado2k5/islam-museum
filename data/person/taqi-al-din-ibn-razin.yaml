summary:
  ar: "شيخ الإسلام قاضي القضاة؛ حفظ «التنبيه» في صغره ثم «الوسيط» و«المفضل» و«المستصفى» للغزالي، وأفتى وله ثماني عشرة سنة، ولازم ابن الصلاح بدمشق وقرأ القراءات على السخاوي وأخذ العربية عن ابن يعيش، وولي وكالة بيت المال في أيام الناصر، ثم تحول من هولاكو إلى مصر ودرس بالظاهرية، وولي قضاء القضاة فلم يأخذ عليه رزقاً تديناً وورعاً؛ وممن تخرج به بدر الدين بن جماعة، ونقل عنه الإمام النووي {cite:shadharat-dhahab p. 644-645}."
  en: "Hama's shaykh al-islam — fatwa at eighteen, Ibn al-Salah's companion, driven to Egypt by Hulagu; as qadi al-qudat he refused the stipend 'out of scruple'; Badr al-Din b. Jama'a among his graduates and al-Nawawi among his transmitters; d. Cairo 3 Rajab {cite:shadharat-dhahab p. 644-645}."
  es: "Shaykh al-islam de Hama — fatwa a los dieciocho años, compañero de Ibn al-Salah, expulsado a Egipto por Hulagu; como qadi al-qudat rechazó el estipendio \"por escrúpulos\"; Badr al-Din b. Jama'a entre sus graduados y al-Nawawi entre sus transmisores; murió en El Cairo el 3 de Rajab {cita: shadharat-dhahab págs. 644-645}."
  fr: "Le cheikh al-islam de Hama — fatwa à dix-huit ans, compagnon d'Ibn al-Salah, chassé en Égypte par Hulagu; en tant que cadi al-qudat, il refusa le salaire « par scrupule »; Badr al-Din b. Jama'a parmi ses diplômés et al-Nawawi parmi ses transmetteurs; d. Le Caire 3 Rajab {cite: shadharat-dhahab p. 644-645}."
  ur: "حما کے شیخ الاسلام - اٹھارہ سال کا فتویٰ، ابن الصلاح کا ساتھی، حلاگو کے ذریعے مصر چلا گیا۔ قاضی القضات کے طور پر اس نے وظیفہ سے انکار کر دیا۔ بدر الدین بی۔ اس کے فارغ التحصیلوں میں جامعہ اور اس کے نشر کرنے والوں میں النبوی؛ d قاہرہ 3 رجب {حوالہ: شدّرت ذہاب ص۔ 644-645}۔"
