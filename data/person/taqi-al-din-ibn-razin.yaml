summary:
  ar: "شيخ الإسلام قاضي القضاة؛ حفظ «التنبيه» في صغره ثم «الوسيط» و«المفضل» و«المستصفى» للغزالي، وأفتى وله ثماني عشرة سنة، ولازم ابن الصلاح بدمشق وقرأ القراءات على السخاوي وأخذ العربية عن ابن يعيش، وولي وكالة بيت المال في أيام الناصر، ثم تحول من هولاكو إلى مصر ودرس بالظاهرية، وولي قضاء القضاة فلم يأخذ عليه رزقاً تديناً وورعاً؛ وممن تخرج به بدر الدين بن جماعة، ونقل عنه الإمام النووي {cite:shadharat-dhahab p. 644-645}."
  en: "Hama's shaykh al-islam — fatwa at eighteen, Ibn al-Salah's companion, driven to Egypt by Hulagu; as qadi al-qudat he refused the stipend 'out of scruple'; Badr al-Din b. Jama'a among his graduates and al-Nawawi among his transmitters; d. Cairo 3 Rajab {cite:shadharat-dhahab p. 644-645}."
