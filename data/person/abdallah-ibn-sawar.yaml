id: person/abdallah-ibn-sawar
class: person
label: { ar: "عبد الله بن سوار العبدي", en: "Abdallah ibn Sawar al-Abdi", fr: "Abdallah ibn Sawar al-Abdi", es: "Abdallah ibn Sawar al-Abdi", ur: "عبداللہ ابن سوار العبدی" }
summary:
  ar: "عبد الله بن سوار العبدي؛ ولي ثغر الهند فغزا القيقان وأصاب مغنماً وأهدى إلى معاوية خيلاً قيقانية ثم رجع فاستجاشوا الترك فقتلوه وكان سخياً لم يوقد أحد ناراً غير ناره في عسكره فأطعم الناس الخبيص ثلاثاً حين عملت نفساء."
  en: "Abdallah ibn Sawar al-Abdi; frontier lord who gifted Mu'awiya Qiqani horses, then died at Qiqan to Turkish aid — so generous no other fire burned in his camp, and a lying-in woman's khabis meant three days' khabis for all."
  fr: "Abdallah ibn Sawar al-Abdi ; seigneur de la frontière qui offrit à Mu'awiya des chevaux de Qiqan, puis mourut à Qiqan face aux secours turcs — si généreux qu'aucun autre feu ne brûlait dans son camp, et que le khabis d'une accouchée signifiait trois jours de khabis pour tous."
  es: "Abdullah ibn Sawar al-Abdi, señor fronterizo que regaló caballos a Mu'awiya Qiqani y que luego murió en Qiqan gracias a la ayuda turca, fue tan generoso que no había otro fuego encendido en su campamento, y el khabis de una mujer puérpera significaba tres días de khabis para todos."
  ur: "عبداللہ ابن سوار العبدی؛ فرنٹیئر لارڈ جس نے معاویہ کیقانی کو گھوڑے تحفے میں دیے، پھر ترکی کی مدد کے لیے کیقان میں ہی دم توڑ گئے - اتنی فراخ دلی سے اس کے کیمپ میں کوئی آگ نہیں جلتی تھی، اور ایک لیٹی ہوئی عورت کے خبیث کا مطلب سب کے لیے تین دن کا خبیث تھا۔"
  tr: "Abdullah bin Suwar al-Abdi, Hindistan sınırından sorumluydu. Kaykan'a baskın düzenleyerek ganimet elde etti. Kaykan atlarını Muaviye'ye hediye etti. Sonra geri döndü ve Türkler onu kışkırtarak öldürdüler. Cömert bir insandı. Kampında kendisinden başka kimse ateş yakmazdı. Bir kadın doğum yaptığında üç gün boyunca insanlara kuzu eti yedirdi."
  id: "Abdullah bin Suwar al-Abdi bertanggung jawab atas perbatasan India. Dia menyerang Qayqan dan memperoleh rampasan perang. Dia menghadiahkan kuda-kuda Qayqan kepada Muawiyah. Kemudian dia kembali, dan orang-orang Turki terprovokasi dan membunuhnya. Dia adalah orang yang dermawan. Tidak seorang pun menyalakan api selain apinya sendiri di perkemahannya. Dia memberi makan orang-orang dengan khabis selama tiga hari ketika seorang wanita melahirkan."
