summary:
  ar: "عبد الله بن سوار العبدي؛ ولي ثغر الهند فغزا القيقان وأصاب مغنماً وأهدى إلى معاوية خيلاً قيقانية ثم رجع فاستجاشوا الترك فقتلوه وكان سخياً لم يوقد أحد ناراً غير ناره في عسكره فأطعم الناس الخبيص ثلاثاً حين عملت نفساء."
  en: "Abdallah ibn Sawar al-Abdi; frontier lord who gifted Mu'awiya Qiqani horses, then died at Qiqan to Turkish aid — so generous no other fire burned in his camp, and a lying-in woman's khabis meant three days' khabis for all."
