summary:
  ar: "المنجاب بن راشد الضبي؛ استأذن في بناء حمام بالبصرة فأذن له وفيه يقول المحتضر يا رب قائلة يوماً وقد لغبت كيف الطريق إلى حمام منجاب."
  en: "Al-Munjab ibn Rashid al-Dabbi; granted leave for a Basra bathhouse, the dying man's verse asks 'how is the road to Minjab's bath?'."
  fr: "Al-Munjab ibn Rashid al-Dabbi ; permis pour un bain Bassora, le verset de l'homme mourant demande \"comment est la route du bain de Minjab ?\"."
  es: "Al-Munjab ibn Rashid al-Dabbi; se le concedió permiso para ir a un baño público en Basora, y el verso del moribundo pregunta: \"¿Cómo es el camino al baño de Minjab?\"."
  ur: "المنجب ابن راشد الدبی؛ بصرہ کے حمام کے لیے رخصت دی گئی، مرنے والے آدمی کی آیت پوچھتی ہے کہ 'منجب کے غسل کا راستہ کیسا ہے؟'۔"
  tr: "Al-Munjab bin Rashid Al-Dabi; Basra'da bir hamam inşa etmek için izin istedi ve izin aldı. Orada ölen adam şöyle der: 'Ey Rabbim, bir gün hamam kaybolduğunda, Munjab hamamına giden yol nasıl?'"
  id: "Al-Munjab bin Rashid Al-Dhabi; ia meminta izin untuk membangun pemandian di Basra, dan ia diizinkan. Dalam surat itu, pria yang sekarat berkata, 'Ya Tuhan, suatu hari ketika ia telah hilang, bagaimana jalan menuju pemandian Munjab?'"
