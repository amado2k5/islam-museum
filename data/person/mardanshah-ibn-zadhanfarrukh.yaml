summary:
  ar: "ابن كاتب الحجاج الفارسي؛ عند البلاذري لما قلد الحجاج صالح بن عبد الرحمن نقل الديوان إلى العربية قال له كيف تصنع بدهوية وششوية قال أكتب عشر ونصف عشر قال فكيف تصنع بويد قال أكتبه أيضاً فقال قطع الله أصلك من الدنيا كما قطعت أصل الفارسية."
  en: "Son of al-Hajjaj's Persian scribe; in al-Baladhuri he challenged Salih ibn Abd al-Rahman's Arabization: 'what of dahwiya and shashwiya?' — 'I write ushr and half-ushr'; 'and wid?' — 'likewise' — and cried 'may God cut your root from this world as you have cut Persian's root.'"
