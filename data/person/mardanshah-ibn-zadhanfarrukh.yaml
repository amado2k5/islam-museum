id: person/mardanshah-ibn-zadhanfarrukh
class: person
label: { ar: "مردانشاه بن زادان فروخ", en: "Mardanshah ibn Zadhanfarrukh", es: "Mardanshah ibn Zadhanfarrukh", fr: "Mardanshah ibn Zadhanfarrukh", ur: "مردان شاہ ابن زادنفرخ" }
summary:
  ar: "ابن كاتب الحجاج الفارسي؛ عند البلاذري لما قلد الحجاج صالح بن عبد الرحمن نقل الديوان إلى العربية قال له كيف تصنع بدهوية وششوية قال أكتب عشر ونصف عشر قال فكيف تصنع بويد قال أكتبه أيضاً فقال قطع الله أصلك من الدنيا كما قطعت أصل الفارسية."
  en: "Son of al-Hajjaj's Persian scribe; in al-Baladhuri he challenged Salih ibn Abd al-Rahman's Arabization: 'what of dahwiya and shashwiya?' — 'I write ushr and half-ushr'; 'and wid?' — 'likewise' — and cried 'may God cut your root from this world as you have cut Persian's root.'"
  es: "Hijo del escriba persa de al-Hajjaj; en al-Baladhuri desafió la arabización de Salih ibn Abd al-Rahman: '¿Y qué hay de dahwiya y shashwiya?' — 'Yo escribo ushr y medio ushr'; '¿Y wid?' — 'Igualmente' — y exclamó '¡Que Dios te arranque la raíz de este mundo como tú has arrancado la raíz del persa!'."
  fr: "Fils du scribe persan d'al-Hajjaj, il contesta dans al-Baladhuri l'arabisation de Salih ibn Abd al-Rahman: « Qu'en est-il de dahwiya et shashwiya ? » — « J'écris ushr et demi-ushr »; « et wid ? » — « De même » — et s'écria: « Que Dieu retranche ta racine de ce monde comme tu as retranché la racine du persan ! »"
  ur: "الحجاج کے فارسی کاتب کا بیٹا؛ البلادوری میں اس نے صالح بن عبدالرحمن کی عربیت کو چیلنج کیا: 'دحویہ اور شاشویہ کا کیا؟' - 'میں عشر اور نصف عشر لکھتا ہوں'؛ 'اور wid؟' - 'اسی طرح' - اور پکارا 'خدا تمہاری جڑ اس دنیا سے کاٹ دے جیسا کہ تم نے فارسی کی جڑ کاٹی ہے۔'"
