id: person/qawam-al-din-al-kaki
class: person
label: { ar: "قوام الدين الكاكي", en: "Qawam al-Din al-Kaki" }
summary:
  ar: "محمد بن محمد بن أحمد السنجاري الخجندي، المعروف بقوام الدين الكاكي. فقيه حنفي وأصولي، أخذ عن علاء الدين عبد العزيز البخاري، وقرأ عليه الهداية، وعن حسام الدين حسن السغناقي. قدم القاهرة، ثم أقام بجامع ماردين يفتي ويدرس إلى أن مات سنة تسع وأربعين وسبعمائة. من تصانيفه: معراج الدراية شرح الهداية، وجامع الأسرار في شرح المنار، وعيون المذاهب الكاملي، وبنيان الوصول في شرح الأصول للبزدوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7163}"
  en: "Muhammad ibn Muhammad ibn Ahmad al-Sinjari al-Khujandi, known as Qawam al-Din al-Kaki: a Hanafi jurist and legal theorist. He studied with Ala al-Din Abd al-Aziz al-Bukhari, reading al-Hidaya with him, and with Husam al-Din Hasan al-Sighnaqi. He reached Cairo and then taught and issued fatwas at the Mosque of Mardin until his death in 749 AH. Works attributed to him include Mi'raj al-Dirayat (a commentary on al-Hidaya) and Jami al-Asrar (a commentary on al-Manar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7163}"
