id: person/qawam-al-din-al-kaki
class: person
label: { ar: "قوام الدين الكاكي", en: "Qawam al-Din al-Kaki", es: "Qawam al-Din al-Kaki", fr: "Qawam al-Din al-Kaki" }
summary:
  ar: "محمد بن محمد بن أحمد السنجاري الخجندي، المعروف بقوام الدين الكاكي. فقيه حنفي وأصولي، أخذ عن علاء الدين عبد العزيز البخاري، وقرأ عليه الهداية، وعن حسام الدين حسن السغناقي. قدم القاهرة، ثم أقام بجامع ماردين يفتي ويدرس إلى أن مات سنة تسع وأربعين وسبعمائة. من تصانيفه: معراج الدراية شرح الهداية، وجامع الأسرار في شرح المنار، وعيون المذاهب الكاملي، وبنيان الوصول في شرح الأصول للبزدوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7163}"
  en: "Muhammad ibn Muhammad ibn Ahmad al-Sinjari al-Khujandi, known as Qawam al-Din al-Kaki: a Hanafi jurist and legal theorist. He studied with Ala al-Din Abd al-Aziz al-Bukhari, reading al-Hidaya with him, and with Husam al-Din Hasan al-Sighnaqi. He reached Cairo and then taught and issued fatwas at the Mosque of Mardin until his death in 749 AH. Works attributed to him include Mi'raj al-Dirayat (a commentary on al-Hidaya) and Jami al-Asrar (a commentary on al-Manar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7163}"
  es: "Muhammad ibn Muhammad ibn Ahmad al-Sinjari al-Khujandi, conocido como Qawam al-Din al-Kaki, fue un jurista y teórico jurídico hanafí. Estudió con Ala al-Din Abd al-Aziz al-Bukhari, leyendo con él al-Hidaya, y con Husam al-Din Hasan al-Sighnaqi. Llegó a El Cairo, donde enseñó y emitió fatuas en la Mezquita de Mardin hasta su muerte en el año 749 de la Hégira. Entre las obras que se le atribuyen se encuentran Mi'raj al-Dirayat (un comentario sobre al-Hidaya) y Jami al-Asrar (un comentario sobre al-Manar). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7163}"
  fr: "Muhammad ibn Muhammad ibn Ahmad al-Sinjari al-Khujandi, connu sous le nom de Qawam al-Din al-Kaki, était un juriste et théoricien du droit hanafite. Il étudia auprès d'Ala al-Din Abd al-Aziz al-Bukhari, avec lequel il lut al-Hidaya, et auprès de Husam al-Din Hasan al-Sighnaqi. Il se rendit au Caire, puis enseigna et émit des fatwas à la mosquée de Mardin jusqu'à sa mort en 749 AH. Parmi les œuvres qui lui sont attribuées figurent Mi'raj al-Dirayat (un commentaire d'al-Hidaya) et Jami al-Asrar (un commentaire d'al-Manar)."
