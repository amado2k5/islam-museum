summary:
  ar: "سياسي مالي (1915–1977) من باماكو، بدأ معلما ثم شارك في تأسيس الاتحاد السوداني، وصار رئيس وزراء اتحاد مالي سنة 1959 ثم أول رئيس لمالي المستقلة (1960–1968) مطبّقا اشتراكية إفريقية وقائدا في حركة عدم الانحياز ومنظمة الوحدة الإفريقية، حتى أطاح به موسى تراوري سنة 1968 فسُجن ومات في سجنه بباماكو في 16 مايو 1977."
  en: "Malian politician (1915–1977) from Bamako who began as a teacher, co-founded the Sudanese Union, became prime minister of the Mali Federation in 1959 and then first president of independent Mali (1960–1968), applying African socialism and leading in the Non-Aligned Movement and the Organisation of African Unity, until Moussa Traoré overthrew him in 1968; he was imprisoned and died a prisoner in Bamako on 16 May 1977."
  ur: "مالی سیاست دان (1915ء–1977ء)، باماکو سے؛ استاد کے طور پر آغاز کیا، سوڈانی یونین کے شریک بانی بنے، 1959ء میں مالی فیڈریشن کے وزیرِ اعظم اور پھر آزاد مالی کے پہلے صدر (1960ء–1968ء) رہے، افریقی سوشلزم نافذ کیا اور غیر وابستہ تحریک اور تنظیمِ وحدتِ افریقہ میں قیادت کی، حتیٰ کہ 1968ء میں موسی تراورے نے انھیں ہٹا دیا؛ قید ہوئے اور 16 مئی 1977ء کو باماکو میں قید ہی میں انتقال ہوا۔"
