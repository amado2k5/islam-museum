summary:
  ar: "عبد الرحمن بن زياد؛ ولاه معاوية خراسان بعد عزل سعيد بن عثمان وكان شريفاً ومات معاوية وهو عليها."
  en: "Abd al-Rahman ibn Ziyad; a sharif whom Mu'awiya made over Khurasan after Sa'id ibn Uthman's dismissal — he held it at Mu'awiya's death."
  fr: "Abd al-Rahman ibn Ziyad ; un noble que Mu'awiya plaça à la tête du Khorassan après la révocation de Sa'id ibn Uthman — il le gouvernait à la mort de Mu'awiya."
  es: "Abd al-Rahman ibn Ziyad; un sharif que Mu'awiya entregó a Khurasan después del despido de Sa'id ibn Uthman; lo retuvo tras la muerte de Mu'awiya."
  ur: "عبدالرحمٰن بن زیاد؛ ایک شریف جسے معاویہ نے سعید بن عثمان کی برطرفی کے بعد خراسان پر قبضہ کیا تھا - اس نے اسے معاویہ کی موت پر اپنے پاس رکھا۔"
  tr: "Abdülrahman ibn Ziyad; Muaviye, Said ibn Osman'ı görevden aldıktan sonra onu Horasan valisi olarak atadı. Kendisi soylu bir kişiydi ve Muaviye, o görevdeyken vefat etti."
  id: "Abd al-Rahman ibn Ziyad; Muawiyah mengangkatnya sebagai gubernur Khurasan setelah memecat Saeed ibn Uthman. Dia adalah seorang bangsawan, dan Muawiyah meninggal dunia saat dia menjabat sebagai gubernur di sana."
