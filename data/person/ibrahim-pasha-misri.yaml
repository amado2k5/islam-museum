summary:
  ar: "إبراهيم باشا بن محمد علي باشا والي مصر؛ قاد حملة قمع التمرد في المورة فتحركت جيوش مصر بقيادته ومستشاره سليمان باشا الفرنساوي بحراً من الإسكندرية عام ١٢٣٩هـ/١٨٢٤م باتجاه كريت وشبه جزيرة المورة، ففتح نافرين عام ١٢٤٠هـ ودخل أثينا عام ١٢٤١هـ رغم معاونة اللورد كوشران لليونانيين. ثم قاد جيوش أبيه لاحتلال الشام فهزم الجيش العثماني واستكمل السيطرة عليه، وألغى القيود المفروضة على النصارى واليهود في البلاد التي سيطر عليها تحت دعوى المساواة والحرية، وفتح الباب للبعثات التبشيرية الفرنسية والأمريكية، حتى انتهى الأمر باتفاقية لندن سنة ١٨٤٠م التي حددت الوجود المصري في الشام بحياة محمد علي {cite:dawlat-uthmaniyya-salabi p. 365-368}."
  en: "Ibrahim Pasha, Muhammad Ali's son — crushed the Morea revolt taking Navarino and Athens, then conquered Syria where he lifted restrictions on Christians and Jews and opened the country to Western missions; the 1840 London convention forced Egypt's withdrawal {cite:dawlat-uthmaniyya-salabi p. 365-368}."
  es: "Ibrahim Pasha, hijo de Muhammad Ali, aplastó la revuelta de Morea tomando Navarino y Atenas, luego conquistó Siria donde levantó las restricciones a cristianos y judíos y abrió el país a las misiones occidentales; la convención de Londres de 1840 obligó a Egipto a retirarse {cite:dawlat-uthmaniyya-salabi p. 365-368}."
  fr: "Ibrahim Pacha, fils de Muhammad Ali, a écrasé la révolte de Morée en prenant Navarin et Athènes, puis a conquis la Syrie où il a levé les restrictions imposées aux chrétiens et aux juifs et a ouvert le pays aux missions occidentales; la convention de Londres de 1840 a forcé l'Égypte à se retirer {cite:dawlat-uthmaniyya-salabi p. 365-368}."
  ur: "ابراہیم پاشا، محمد علی کے بیٹے - نے موریا کی بغاوت کو کچل دیا جس میں ناوارینو اور ایتھنز شامل تھے، پھر شام کو فتح کیا جہاں اس نے عیسائیوں اور یہودیوں پر سے پابندیاں ہٹا دیں اور ملک کو مغربی مشنوں کے لیے کھول دیا۔ 1840 کے لندن کنونشن نے مصر کی دستبرداری پر مجبور کر دیا {حوالہ: دولت عثمانیہ صلابی ص۔ 365-368}۔"
  tr: "Mısır valisi İbrahim Paşa ibn Muhammed Ali Paşa, Mores'teki isyanı bastırma seferine liderlik etti. Mısır orduları, onun komutası ve danışmanı Fransız Süleyman Paşa yönetiminde, 1239 Hicri/1824 yılında İskenderiye'den deniz yoluyla Girit ve Morea Yarımadası'na doğru ilerledi. Lord Cochran'ın Yunanlara yardımına rağmen 1240 Hicri'nde Nefrin'i fethetti ve 1241 Hicri'de Atina'ya girdi. Daha sonra babasının ordularını Levant'ı işgal etmek için yönetti, Osmanlı ordusunu yendi ve kontrolünü tamamladı. Eşitlik ve özgürlük bahanesiyle kontrol ettiği topraklarda Hristiyanlar ve Yahudilere uygulanan kısıtlamaları kaldırdı ve Fransız ve Amerikan misyonerlik misyonlarının kapılarını açtı; bu antlaşma, 1840'ta Londra Antlaşması ile sonuçlandı; bu antlaşma, Muhammed Ali'nin yaşamı sırasında Levant'taki Mısır varlığını tanımladı {cite:dawlat-uthmaniyya-salabi, s. 365-368}."
  id: "Ibrahim Pasha ibn Muhammad Ali Pasha, gubernur Mesir, memimpin kampanye untuk menekan pemberontakan di Mores. Tentara Mesir, di bawah komando dan penasihatnya Suleiman Pasha dari Prancis, bergerak melalui laut dari Alexandria pada tahun 1239 H/1824 M menuju Kreta dan Semenanjung Morea. Ia menaklukkan Nafrin pada tahun 1240 H dan memasuki Athena pada 1241 H meskipun bantuan Lord Cochran kepada orang Yunani. Ia kemudian memimpin pasukan ayahnya untuk menduduki Levant, mengalahkan tentara Ottoman, dan menyelesaikan kendalinya. Ia mencabut pembatasan yang dikenakan pada umat Kristen dan Yahudi di tanah yang ia kuasai dengan dalih kesetaraan dan kebebasan, serta membuka pintu bagi misi misionaris Prancis dan Amerika, yang berpuncak pada Perjanjian London tahun 1840, yang mendefinisikan kehadiran Mesir di Levant selama masa Muhammad Ali {cite:dawlat-uthmaniyya-salabi, hlm. 365-368}."
