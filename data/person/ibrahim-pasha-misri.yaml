summary:
  ar: "إبراهيم باشا بن محمد علي باشا والي مصر؛ قاد حملة قمع التمرد في المورة فتحركت جيوش مصر بقيادته ومستشاره سليمان باشا الفرنساوي بحراً من الإسكندرية عام ١٢٣٩هـ/١٨٢٤م باتجاه كريت وشبه جزيرة المورة، ففتح نافرين عام ١٢٤٠هـ ودخل أثينا عام ١٢٤١هـ رغم معاونة اللورد كوشران لليونانيين. ثم قاد جيوش أبيه لاحتلال الشام فهزم الجيش العثماني واستكمل السيطرة عليه، وألغى القيود المفروضة على النصارى واليهود في البلاد التي سيطر عليها تحت دعوى المساواة والحرية، وفتح الباب للبعثات التبشيرية الفرنسية والأمريكية، حتى انتهى الأمر باتفاقية لندن سنة ١٨٤٠م التي حددت الوجود المصري في الشام بحياة محمد علي {cite:dawlat-uthmaniyya-salabi p. 365-368}."
  en: "Ibrahim Pasha, Muhammad Ali's son — crushed the Morea revolt taking Navarino and Athens, then conquered Syria where he lifted restrictions on Christians and Jews and opened the country to Western missions; the 1840 London convention forced Egypt's withdrawal {cite:dawlat-uthmaniyya-salabi p. 365-368}."
