id: person/samira-ibn-al-jad
class: person
label:
  ar: سميرة بن الجعد الشيباني
  en: Samira ibn al-Ja'd al-Shaybani
  es: "Samira ibn al-Ja'd al-Shaybani"
  fr: "Samira ibn al-Ja'd al-Shaybani"
  ur: "سمیرہ بن الجعد الشیبانی"
summary:
  ar: أبو الجعد سمير الحجاج من بني شيبان، كتب إليه قطري بن الفجاءة شعراً يدعوه حتى لحق بالخوارج، وكتب إلى الحجاج كتاباً في أسفله أبيات منها فمن مبلغ الحجاج أن سميرة قلا كل دين غير دين الخوارج، وله أشعار كثيرة في الزهد والموت {cite:muruj-al-dhahab p. 127-129}.
  en: al-Hajjaj's Shaybani boon-companion won over by Qatari ibn al-Fuja'a's verse — he answered with his own lines renouncing 'every creed but the Kharijites'' and defected beyond reach {cite:muruj-al-dhahab p. 127-129}.
  es: "El compañero de Shaybani de al-Hajjaj, convencido por el verso de Qatari ibn al-Fuja'a, respondió con sus propias líneas renunciando a \"todo credo excepto el de los jariyitas\" y desertó sin remedio {cite:muruj-al-dhahab p. 127-129}."
  fr: "Le compagnon de Shaybani d'al-Hajjaj, conquis par le verset de Qatari ibn al-Fuja'a, répondit par ses propres vers renonçant à « toute croyance sauf les Kharijites » et fit défection hors de portée {cite:muruj-al-dhahab p. 127-129}."
  ur: "الحجاج کے شیبانی ساتھی کو قطری ابن الفضع کی آیت سے فتح حاصل ہوئی - اس نے اپنے ہی خطوط کے ساتھ جواب دیا کہ ہر مسلک کو ترک کر دیا اور خارجیوں کے علاوہ دسترس سے باہر ہو گیا۔ 127-129}۔"
  tr: "Ebu el-Ceyd Samir el-Haccac Banu Şeyban'dandı. Katarlı bin el-Faca'ah ona Haricilere katılana kadar ona şiirler yazdı. En altta el-Hacč'a bir mektup yazdı, bazılarında dizeler vardı. El-Hacac'ın raporlarından biri, Samira'nın Hariciler dışındaki tüm dinleri söylediği yer alıyor. Ayrıca asketizm ve ölüm üzerine birçok şiir yazdı {atıf:muruj-al-dhahab, s. 127-129}."
  id: "Abu al-Ja'd Samir al-Hajjaj berasal dari Banu Shayban. Qatari ibn al-Faja'ah menulis puisi kepadanya yang memanggilnya hingga ia bergabung dengan Kharijit. Ia menulis surat kepada al-Hajjaj di bagian bawah, beberapa di antaranya berisi ayat. Di antara laporan al-Hajjaj adalah bahwa Samira mengucapkan setiap agama selain Kharijit. Ia juga menulis banyak puisi tentang pertapa dan kematian {cite:muruj-al-dhahab, hlm. 127-129}."
