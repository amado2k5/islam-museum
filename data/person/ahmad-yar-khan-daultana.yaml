summary:
  ar: "رئيس قبيلة دولتانة في لُدّن وسياسي بنجابي (1896–1940)، انتُخب لعضوية مجالس البنجاب التشريعية في 1921 و1926 و1930 ثم مجلس البنجاب التشريعي في 1937، وكان أمين حزب الاتحاد وسكرتيرًا برلمانيًا رئيسًا لحكومة البنجاب، وعُيّن قائدًا في رتبة الإمبراطورية البريطانية سنة 1939. وهو والد ممتاز دولتانة."
  en: "Chief of the Daultanas of Luddan and a Punjabi politician (1896–1940), elected to the Punjab legislatures in 1921, 1926 and 1930 and to the Punjab Legislative Assembly in 1937, secretary of the Unionist Party and Chief Parliamentary Secretary of the Punjab government, appointed CBE in 1939. He was the father of Mumtaz Daultana."
  ur: "لدن کے دولتانہ قبیلے کے سردار اور پنجابی سیاست دان (1896ء–1940ء)، جو 1921، 1926 اور 1930 میں پنجاب کی قانون ساز مجالس اور 1937 میں پنجاب قانون ساز اسمبلی کے رکن بنے، یونینسٹ پارٹی کے سیکرٹری اور پنجاب حکومت کے چیف پارلیمانی سیکرٹری رہے، اور 1939 میں سی بی ای بنائے گئے۔ وہ ممتاز دولتانہ کے والد تھے۔"
