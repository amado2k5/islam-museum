summary:
  ar: "القاضي مجير الدين أبو اليمن عبد الرحمن العليمي الحنبلي المتوفى سنة ٩٢٧هـ؛ صاحب الأنس الجليل بتاريخ القدس والخليل الذي جمع فيه خلاصة تواريخ القدس وأضاف إليه نبذة من الحوادث والوفيات، وكان شروعه في ذي الحجة سنة ٩٠٠هـ وفرغ بعد أربعة أشهر {cite:kashf-zunun-furqan p. 649-650}."
  en: "Qadi Mujir al-Din al-Ulaymi al-Hanbali, d. AH 927 — author of al-Uns al-Jalil, the classic history of Jerusalem and Hebron, begun in Dhu al-Hijja 900 and finished in four months {cite:kashf-zunun-furqan p. 649-650}."
  es: "Qadi Mujir al-Din al-Ulaymi al-Hanbali, m. 927 H.H. autor de al-Uns al-Jalil, la historia clásica de Jerusalén y Hebrón, iniciada en Dhu al-Hijja 900 y terminada en cuatro meses {citar:kashf-zunun-furqan p. 649-650}."
  fr: "Qadi Mujir al-Din al-Ulaymi al-Hanbali, d. AH 927 — auteur d'al-Uns al-Jalil, l'histoire classique de Jérusalem et d'Hébron, commencée à Dhu al-Hijja 900 et terminée en quatre mois {cite:kashf-zunun-furqan p. 649-650}."
  ur: "قاضی مجیر الدین العلمی الحنبلی، د. 927ھ - الانس الجلیل کے مصنف، یروشلم اور ہیبرون کی کلاسیکی تاریخ، ذی الحجہ 900 میں شروع ہوئی اور چار مہینوں میں ختم ہوئی۔ 649-650}۔"
