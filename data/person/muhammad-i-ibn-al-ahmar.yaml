id: person/muhammad-i-ibn-al-ahmar
class: person
label: { ar: "محمد بن يوسف بن نصر بن الأحمر" }
summary:
  ar: "مؤسس دولة بني الأحمر بالأندلس؛ أصلهم من أرجونة من حصون قرطبة ولهم فيها سلف في أبناء الجند يعرفون ببني نصر وينسبون إلى سعد بن عبادة سيد الخزرج، فلما فشل ريح الموحدين تصدى للثورة على ابن هود وبويع سنة 629هـ على الدعاء للأمير أبي زكريا صاحب إفريقية وكان يعرف بالشيخ ويلقب بأبي دبوس، وأطاعته حيان وشريش سنة 630هـ ودخل إشبيلية سنة 632هـ وفتك بابن الباجي، ثم تغلب على غرناطة سنة 635هـ بمداخلة أهلها واستقر بها بعد مهلك ابن هود {cite:tarikh-ibn-khaldun-ibar p. 1008-1009}."
  en: "Founder of the Nasrid house: of Arjuna's military families near Cordoba, counted to Sa'd b. Ubada of the Khazraj; rose against Ibn Hud in 629 under Hafsid allegiance, took Jaen, Jerez, Seville and finally Granada in 635 by its people's complicity {cite:tarikh-ibn-khaldun-ibar p. 1008-1009}."
