id: person/muhammad-i-ibn-al-ahmar
class: person
label: { ar: "محمد بن يوسف بن نصر بن الأحمر" }
summary:
  ar: "مؤسس دولة بني الأحمر بالأندلس؛ أصلهم من أرجونة من حصون قرطبة ولهم فيها سلف في أبناء الجند يعرفون ببني نصر وينسبون إلى سعد بن عبادة سيد الخزرج، فلما فشل ريح الموحدين تصدى للثورة على ابن هود وبويع سنة 629هـ على الدعاء للأمير أبي زكريا صاحب إفريقية وكان يعرف بالشيخ ويلقب بأبي دبوس، وأطاعته حيان وشريش سنة 630هـ ودخل إشبيلية سنة 632هـ وفتك بابن الباجي، ثم تغلب على غرناطة سنة 635هـ بمداخلة أهلها واستقر بها بعد مهلك ابن هود {cite:tarikh-ibn-khaldun-ibar p. 1008-1009}."
  en: "Founder of the Nasrid house: of Arjuna's military families near Cordoba, counted to Sa'd b. Ubada of the Khazraj; rose against Ibn Hud in 629 under Hafsid allegiance, took Jaen, Jerez, Seville and finally Granada in 635 by its people's complicity {cite:tarikh-ibn-khaldun-ibar p. 1008-1009}."
  es: "Fundador de la casa nazarí: de las familias militares de Arjuna cerca de Córdoba, contado por Sa'd b. Ubada del Khazraj; se alzó contra Ibn Hud en 629 bajo la lealtad de los Hafsíes, tomó Jaén, Jerez, Sevilla y finalmente Granada en 635 con la complicidad de su pueblo {cite:tarikh-ibn-khaldun-ibar p. 1008-1009}."
  fr: "Fondateur de la maison nasride: des familles militaires d'Arjuna près de Cordoue, compté comme Sa'd b. Ubada des Khazraj; se souleva contre Ibn Hud en 629 sous l'allégeance des Hafsides, prit Jaen, Jerez, Séville et finalement Grenade en 635 avec la complicité de son peuple {cite:tarikh-ibn-khaldun-ibar p. 1008-1009}."
  ur: "نصری گھر کا بانی: قرطبہ کے قریب ارجن کے فوجی خاندانوں میں سے، سعد بن میں شمار ہوتا ہے۔ خزرج کا عبادہ؛ 629 میں حفصید کی بیعت کے تحت ابن ہود کے خلاف اٹھ کھڑا ہوا، 635 میں جین، جیریز، سیویل اور آخر میں گراناڈا پر اپنی عوام کی ملی بھگت سے قبضہ کر لیا۔ 1008-1009}۔"
  tr: "Al-Andalus'taki Banu al-Ahmar devletinin kurucusudur; kökenleri Kordoba'nın kalelerinden biri olan Arjuna'dan gelir ve orada, Banu Nasr olarak bilinen askerlerin oğulları arasında ataları vardır; bu askerler soylarını Hazraj'ın lideri Sa'd ibn Ubadah'a dayandırırlar. Almohad rüzgarı dinince, İbn Hud'a karşı isyan etti ve 629 Hicri yılında İfriqiya hükümdarı Prens Abu Zekariya için dua etmek üzere bağlılık yemini etti. Şeyh olarak biliniyordu ve Ebu Dabbous lakabıyla anılıyordu. Hayyan ve Şuraiş 630 Hicri'de ona itaat etti, 632 H.'de Sevilla'ya girdi ve İbn al-Baji'yi öldürdü. Daha sonra 635 Hicri'de halkının müdahalesiyle Granada'yı fethetti ve İbn Hud'un yenilgisinden sonra oraya yerleşti {alıntı:] Tarih-ibn-haldun-ibar s. 1008-1009}."
  id: "Pendiri negara Banu al-Ahmar di al-Andalus; asal-usulnya berasal dari Arjuna, salah satu benteng Córdoba, dan mereka memiliki leluhur di sana di antara putra-putra prajurit yang dikenal sebagai Banu Nasr, yang menelusuri garis keturunan mereka ke Sa'd ibn Ubadah, kepala Khazraj. Ketika angin Almohad mereda, ia memberontak melawan Ibn Hud dan bersumpah setia pada tahun 629 H untuk berdoa bagi Pangeran Abu Zakariya, penguasa Ifriqiya. Ia dikenal sebagai Sheikh dan dijuluki Abu Dabbous. Hayyan dan Shuraish menaatinya pada 630 H, memasuki Sevilla pada 632 H, dan membunuh Ibn al-Baji. Ia kemudian menaklukkan Granada pada 635 H dengan campur tangan rakyatnya dan menetap di sana setelah kekalahan Ibn Hud {cite:History-ibn-khaldun-ibar hlm. 1008-1009}."
