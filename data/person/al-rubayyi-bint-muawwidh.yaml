  ar: صحابية من بني عدي بن النجار؛ بايعت بيعة الشجرة، وروت أنها كانت تغزو مع النبي فتسقي القوم وتخدمهم وتداوي الجرحى، وروت وصف وضوئه، وحديثها عن زفافها وضرب الدف يوم بنى بها.
  en: A Companion of Banu Adi ibn al-Najjar; she gave the pledge under the tree, narrated that women campaigned with the Prophet giving water, serving and tending the wounded, described his ablution, and told of her wedding day when girls played
