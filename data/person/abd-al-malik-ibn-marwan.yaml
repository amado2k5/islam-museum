label: { ar: "عبد الملك بن مروان", en: "Abd al-Malik ibn Marwan", ur: "عبد الملک بن مروان" }
summary:
  ar: "خامس خلفاء بني أمية، حكم من 65 إلى 86هـ/685 إلى 705م. استعاد وحدة الدولة بعد هزيمة مصعب بن الزبير ومقتل عبد الله بن الزبير في مكة، وجعل الحجاج واليه على العراق، وجعل العربية لغة دواوين المال، وسك دينارا إسلاميا ذهبيا، وبنى قبة الصخرة في بيت المقدس بحسب دائرة المعارف الإسلامية. وتوفي في شوال 86هـ/أكتوبر 705م وخلفه ابنه الوليد."
  en: "Fifth caliph of the Umayyad line, reigning 65-86/685-705. He restored the unity of the state after the defeat of Musab ibn al-Zubayr and the killing of Abdullah ibn al-Zubayr at Mecca, relied on al-Hajjaj to govern Iraq, made Arabic the language of the financial offices, issued an Islamic gold dinar, and, according to the Encyclopaedia of Islam, built the Dome of the Rock at Jerusalem. He died in Shawwal 86/October 705 and was succeeded by his son al-Walid."
  ur: "اموی سلسلے کے پانچویں خلیفہ، جن کی حکومت 65 سے 86ھ/685 سے 705ء تک رہی۔ انھوں نے مصعب بن الزبیر کی شکست اور مکہ میں عبداللہ بن الزبیر کے قتل کے بعد ریاست کی وحدت بحال کی، عراق کی حکومت میں حجاج پر بھروسا کیا، مالی دفاتر کی زبان عربی کی، اسلامی سونے کا دینار جاری کیا، اور دائرۃ المعارف اسلامیہ کے مطابق بیت المقدس میں قبۃ الصخرہ تعمیر کروائی۔ ان کی وفات شوال 86ھ/اکتوبر 705ء میں ہوئی اور ان کے بیٹے ولید ان کے جانشین بنے۔"
