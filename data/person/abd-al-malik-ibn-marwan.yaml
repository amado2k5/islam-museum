summary:
  ar: "الخليفة الأموي، كان الحجاج عامله، وخلعه أصحاب ابن الأشعث بقولهم إن خلع الحجاج خلع عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.338}، وتوفي في سنة ست وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.418}. وعند المسعودي بويع ليلة الأحد غرة رمضان سنة خمس وستين وتوفي بدمشق يوم السبت لأربع عشرة مضت من شوال سنة ست وثمانين وهو ابن ست وستين سنة، وكان يحب الشعر والفخر والتقريظ والغالب عليه البخل وكانت له أقدام على الدماء، ولما نادم الشعبي قال له لا تساعدني على ما قبح ولا ترد على الخطأ في مجلسي وأرني فهمك في طرفك وسمعك واعلم أن صواب الاستماع أكثر من صواب القول {cite:muruj-al-dhahab p. 86-87} وقتل عمرو بن سعيد الأشدق سنة سبعين، وكان بينهما مكاتبات طلباً للملك، فأغلق عليه الحاجب الباب دون أصحابه وأمر أبا الزعيزعة فضرب عنقه ورمى برأسه إلى أصحابه فتفرقوا، وقيل شد عليه جامعة ثم أمر أخاه عبد العزيز بذبحه فقال له عمرو اغدر يا ابن الزرقاء، وألقى على الناس بدر الدنانير فاشتغلوا بها عن القتال {cite:muruj-al-dhahab p. 95-97} وكتب إلى الحجاج أن صف لي الفتنة فكتب إن الفتنة تشب بالنجوى وتحصد بالشكوى وتنتج بالخطب فكتب إنك قد أصبت وأحسنت الصفة فإن أردت أن يستقيم لك من قبلك نخذهم بالجماعة وأعطهم عطاء الفرقة وألصق بهم الحاجة {cite:muruj-al-dhahab p. 111}. ولما بلغه خلع ابن الأشعث صعد المنبر فقال اللهم لا تسلطنا على من هو خير منا ولا تسلط علينا من نحن خير منه اللهم سلط سيف أهل الشام على أهل العراق حتى يبلغ رضاك فإذا بلغه فلا تجاوز به سخطك {cite:muruj-al-dhahab p. 111}. وحج في بعض أعوامه فأمر للناس بالعطاء فخرجت بدرة مكتوب عليها من الصدقة فأبى أهل المدينة قبولها وقالوا إنما كان عطاؤنا من الفيء فضرب لهم على المنبر مثل الحية حافظة الكنز وقال يا معشر قريش وليكم عمر فكان فظاً غليظاً فسمعتم له وأطعتم ثم وليكم عثمان فكان سهلاً ليناً فعدوتم عليه فقتلتموه وبعثنا عليكم مسلم بن عقبة يوم الحرة فقتلتموه فنحن نعلم أنكم لا تحبوننا أبداً وأنتم تذكرون يوم الحرة ونحن لا نحبكم أبداً ونحن نذكر مقتل عثمان {cite:muruj-al-dhahab p. 113} ذكر الكتاب أنه أول من أفرد يوماً للنظر في المظالم، وحدّد المهر بأربعمائة دينار حداً أعلى، وأمر بإنفاذ أقضية عبد الله بن الزبير ولم يردّها. {cite:salabi-umayyad-state-2020 p.27-28} ويذكر الكتاب أنه كان يوصي قادته بالحذر من البيات ويرسل العيون قبل كل جيش، وأنه شاور الناس قبل بعث الجيش إلى أرض الروم، وأن في وصيته لأبنائه أمرهم أن يصدروا عن رأي عمر بن عبد العزيز ويشاوروه، وأنه أوصى الوليد بإكرام الحجاج لأنه مهّد له البلاد. ويذكر أنه مات بدمشق سنة 86هـ وصلى عليه الوليد، ودُفن بين باب الجابية وباب الصغير. {cite:salabi-umayyad-state-2020 p.115-128}"
  en: "Caliph of the Umayyads; al-Hajjaj was his governor, and the companions of Ibn al-Ash'ath deposed him, saying that deposing al-Hajjaj meant deposing Abd al-Malik {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. He died in 86 {cite:tabari-tarikh-abu-al-fadl j.6 p.418}. According to al-Mas'udi, he was given the oath of allegiance on the night of Sunday, the first of Ramadan 65, and died at Damascus on Saturday, fourteen days into Shawwal 86, aged sixty-six. He loved poetry, boasting and panegyric; avarice predominated in him, and he was ready to shed blood. When he kept company with al-Sha'bi, he said to him: 'Do not help me in what is ugly, and do not correct my error in my assembly. Show me your understanding through your glance and your hearing, and know that the rightness of listening is greater than the rightness of speech' {cite:muruj-al-dhahab p. 86-87}. He killed Amr ibn Sa'id al-Ashdaq in 70, after letters had passed between them seeking power. The chamberlain shut the door on Amr, leaving his companions outside; Abu al-Za'za'a was ordered to strike his neck, and his head was thrown to his companions, who scattered. It is also said that a chain was put on him, and then he ordered his brother Abd al-Aziz to slaughter him; Amr said to him: 'Betray, O son of al-Zarqa'!' and he threw dinars among the people, who busied themselves with them and stopped fighting {cite:muruj-al-dhahab p. 95-97}. He wrote to al-Hajjaj asking him to describe the strife to him. Al-Hajjaj wrote that strife is kindled by secret talk, reaped by complaint and produced by sermons. He wrote back that he had hit the mark and described it well; if he wanted his subjects to be straight with him, he should subdue them with unity, give them the gifts of division, and attach need to them {cite:muruj-al-dhahab p. 111}. When news of Ibn al-Ash'ath's deposition reached him, he went up the pulpit and said: 'O God, do not give us power over one better than us, nor give those better than us power over us. O God, unleash the sword of the people of Syria against the people of Iraq until it reaches Your pleasure; and when it reaches it, do not pass beyond Your wrath with it' {cite:muruj-al-dhahab p. 111}. In one of his years of pilgrimage he ordered gifts distributed to the people; a purse was brought out, inscribed 'from the alms', and the people of Medina refused to accept it, saying that their gift came from the fay'. He struck them on the pulpit with the parable of the serpent guarding its treasure, and said: 'O assembly of Quraysh, you had Umar as your governor; he was harsh and rough, and you listened to him and obeyed. Then you had Uthman, who was gentle and mild, and you attacked him and killed him. Then we sent Muslim ibn Uqba against you on the day of al-Harra, and you killed him. We know that you will never love us, and you remember the day of al-Harra, and we will never love you, and we remember the killing of Uthman' {cite:muruj-al-dhahab p. 113}. The book mentions that he was the first to set aside a day for examining grievances, set four hundred dinars as the upper limit for dowries, and ordered that the judgments of Abd Allah ibn al-Zubayr be enforced without reversing them. {cite:salabi-umayyad-state-2020 p.27-28} The book also says that he urged his commanders to beware of night raids and sent spies ahead of every army; that he consulted people before sending an army to the land of the Romans; that in his advice to his sons he told them to act on the opinion of Umar ibn Abd al-Aziz and consult him; and that he advised al-Walid to honour al-Hajjaj, because he had paved the way for him. It also says that he died in Damascus in 86 AH; al-Walid led the funeral prayer over him, and he was buried between Bab al-Jabiya and Bab al-Saghir. {cite:salabi-umayyad-state-2020 p.115-128}"
