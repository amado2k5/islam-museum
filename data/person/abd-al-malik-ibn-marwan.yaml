id: person/abd-al-malik-ibn-marwan
class: person
label: { ar: "عبد الملك بن مروان" }
summary:
  ar: "الخليفة الأموي، كان الحجاج عامله، وخلعه أصحاب ابن الأشعث بقولهم إن خلع الحجاج خلع عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.338}، وتوفي في سنة ست وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.418}.، وعند المسعودي بويع ليلة الأحد غرة رمضان سنة خمس وستين وتوفي بدمشق يوم السبت لأربع عشرة مضت من شوال سنة ست وثمانين وهو ابن ست وستين سنة، وكان يحب الشعر والفخر والتقريظ والغالب عليه البخل وكانت له أقدام على الدماء، ولما نادم الشعبي قال له لا تساعدني على ما قبح ولا ترد على الخطأ في مجلسي وأرني فهمك في طرفك وسمعك واعلم أن صواب الاستماع أكثر من صواب القول {cite:muruj-al-dhahab p. 86-87} وقتل عمرو بن سعيد الأشدق سنة سبعين، وكان بينهما مكاتبات طلباً للملك، فأغلق عليه الحاجب الباب دون أصحابه وأمر أبا الزعيزعة فضرب عنقه ورمى برأسه إلى أصحابه فتفرقوا، وقيل شد عليه جامعة ثم أمر أخاه عبد العزيز بذبحه فقال له عمرو اغدر يا ابن الزرقاء، وألقى على الناس بدر الدنانير فاشتغلوا بها عن القتال {cite:muruj-al-dhahab p. 95-97}"
