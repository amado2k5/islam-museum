summary:
  ar: "رائدة تحرير المرأة الإندونيسية (1872–1946)، المشهورة بنياي أحمد دحلان، زوجة مؤسس المحمدية أحمد دحلان وابنة قاضٍ وعالم من بلاط يوجياكارتا؛ أسست مجموعة صوبو تريسنو سنة 1914 ثم جمعية العائشية النسائية في 22 نيسان 1917 وقادتها حتى 1934، وترأست مؤتمر المحمدية سنة 1926 كأول امرأة تترأس مؤتمرًا كهذا، وأُعلنت بطلة قومية سنة 1971."
  en: "Indonesian women's emancipation figure (1872–1946), better known as Nyai Ahmad Dahlan: wife of Muhammadiyah's founder Ahmad Dahlan and daughter of a Yogyakarta court ulama. She founded the Sopo Tresno prayer group in 1914 and the women's organisation Aisyiyah on 22 April 1917, led Aisyiyah until 1934, chaired the Muhammadiyah Congress of 1926 as the first woman to chair such a conference, and was declared a National Hero of Indonesia in 1971."
  ur: "انڈونیشیا کی خواتین کی آزادی کی رہنما (1872ء–1946ء)، نیائی احمد دہلان کے نام سے مشہور؛ محمدیہ کے بانی احمد دہلان کی اہلیہ اور یوگیاکارتا کے درباری عالم کی بیٹی۔ انہوں نے 1914ء میں سوپو تریسنو کی جماعت اور 22 اپریل 1917ء کو خواتین کی تنظیم عائشیہ کی بنیاد رکھی، 1934ء تک اس کی قیادت کی، 1926ء میں محمدیہ کانگریس کی صدارت کرنے والی پہلی خاتون بنیں، اور 1971ء میں انہیں انڈونیشیا کی قومی ہیرو قرار دیا گیا۔"
