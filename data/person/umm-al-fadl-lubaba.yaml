summary:
  ar: 'زوج العباس بن عبد المطلب وأم عبد الله بن عباس، أخت ميمونة أم المؤمنين؛ قال ابن سعد إنها أول امرأة آمنت بعد خديجة، وقال النبي في أخواتها: «الأخوات الأربع مؤمنات»؛ وكان النبي يزورها وهي من المنجبات.'
  en: The wife of al-Abbas ibn Abd al-Muttalib and mother of Abdullah ibn Abbas, sister of the Mother of the Believers Maymuna; Ibn Sa'd says she was the first woman to believe after Khadija, and the Prophet said of her sisters 'The four sisters
    are believers'; he used to visit her and she was among the women who bore illustrious children.
