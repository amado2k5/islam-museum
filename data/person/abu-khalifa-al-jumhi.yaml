label: { ar: "أبو خليفة الفضل بن الحباب الجمحي", en: "Abu Khalifa al-Jumhi", fr: "Abu Khalifa al-Jumhi", es: "Abu Khalifa al-Jumhi", ur: "ابو خلیفہ الجمحی" }
summary:
  ar: "مولى آل جمح من قريش، خطيب البصريين ونديمهم الفصيح الذي لا يتكلف الإعراب بل صار له كالطبع، ورد في وفد أهل البصرة على المعتضد في مراكب بيض مشحمة يشكون الجدب وجور العمال فخطابهم بسجعه المشهور غمر العامر ودثر الظاهر وأناخت علينا المصائب، وأجاب الوزير القاسم بن عبيد الله عن مسألة فرائض الإبل فقال المعتضد هذا شيطان قذف به البحر ومثله فليفد على الملوك فكتب لهم عما يريدون، وولي القضاء بعد ذلك، وتوفي بالبصرة سنة خمس وثلثمائة {cite:muruj-al-dhahab p. 602-604}."
  en: "The Basran mawla and wit whose rhymed embassy won al-Mu'tadid over — 'a devil the sea cast up; let his like seek audience of kings' — later qadi, died 305 {cite:muruj-al-dhahab p. 602-604}."
  fr: "Le mawla et bel esprit de Bassora dont l'ambassade en prose rimée gagna al-Mu'tadid — « un diable que la mer a rejeté ; que ses pareils cherchent audience auprès des rois » —, plus tard cadi, mort en 305 {cite:muruj-al-dhahab p. 602-604}."
  es: "El mawla y el ingenio de Basora cuya embajada rimada convenció a al-Mu'tadid —'un demonio arrojado por el mar; que otros como él busquen audiencia con los reyes'—, más tarde cadí, murió en 305 {cite:muruj-al-dhahab p. 602-604}."
  ur: "بصران مولا اور عقل جس کی شاعری سفارت نے المتدید کو جیت لیا - 'ایک شیطان سمندر نے پھینک دیا؛ اس کی طرح بادشاہوں کے سامعین کو تلاش کرنے دیں' - بعد میں قاضی، وفات 305 602-604}۔"
  tr: "Kureyşli Mevla el-Cuma, Basralıların hatibi ve hitabeti güçlü bir yoldaşıydı; dilbilgisini hiç önemsemezdi, aksine bu onun için doğal bir yetenek haline gelmişti. Basra halkının heyetiyle birlikte beyaz yağlı gemilerle Mu'tedid'in yanına gelen Mevla el-Cuma, kuraklıktan ve işçilerin haksızlığından şikayet ediyordu. Bunun üzerine onlara meşhur kafiyeli nesiriyle şöyle seslendi: \"Yerleşim yerleri sular altında kaldı, görünenler silindi ve felaketler başımıza geldi.\" Vezir Kâsım bin Ubeydullah, develerin yükümlülükleri hakkında sorulan soruya şöyle cevap verdi: \"Bu, denizin kustuğu bir şeytandır ve onun gibileri kralların başına da gelecektir.\" Böylece onların istediklerini yazdı ve daha sonra yargı işini üstlendi. 305 yılında Basra'da vefat etti. {Kaynak: Muruj el-Dhahab s. 602-604}"
  id: "Mawla Al Jumah dari Quraysh, orator Basra dan sahabat mereka yang fasih berbicara, yang tidak terlalu memperhatikan tata bahasa tetapi seolah-olah itu sudah menjadi kebiasaan baginya. Ia datang dalam delegasi penduduk Basra kepada Al-Mu’tadid dengan kapal-kapal putih yang diminyaki, mengeluh tentang kekeringan dan ketidakadilan terhadap para pekerja. Maka ia menyampaikan pidatonya dengan prosa berima yang terkenal: “Yang berpenduduk diliputi dan yang terlihat lenyap, dan malapetaka menimpa kita.” Menteri Al-Qasim bin Ubaid Allah menjawab pertanyaan tentang kewajiban unta, lalu Al-Mu’tadid berkata: “Ini adalah setan yang dimuntahkan laut, dan yang seperti dia seharusnya datang kepada raja-raja.” Maka ia menuliskan apa yang mereka inginkan, dan setelah itu ia mengambil alih peradilan, dan ia meninggal di Basra pada tahun 305. {cite:muruj-al-dhahab p. 602-604}."
