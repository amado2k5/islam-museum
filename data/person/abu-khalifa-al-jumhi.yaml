summary:
  ar: "مولى آل جمح من قريش، خطيب البصريين ونديمهم الفصيح الذي لا يتكلف الإعراب بل صار له كالطبع، ورد في وفد أهل البصرة على المعتضد في مراكب بيض مشحمة يشكون الجدب وجور العمال فخطابهم بسجعه المشهور غمر العامر ودثر الظاهر وأناخت علينا المصائب، وأجاب الوزير القاسم بن عبيد الله عن مسألة فرائض الإبل فقال المعتضد هذا شيطان قذف به البحر ومثله فليفد على الملوك فكتب لهم عما يريدون، وولي القضاء بعد ذلك، وتوفي بالبصرة سنة خمس وثلثمائة {cite:muruj-al-dhahab p. 602-604}."
  en: "The Basran mawla and wit whose rhymed embassy won al-Mu'tadid over — 'a devil the sea cast up; let his like seek audience of kings' — later qadi, died 305 {cite:muruj-al-dhahab p. 602-604}."
