summary:
  ar: "جُعلت قهرمانة دار المقتدر بالله سنة 298هـ فكانت تؤدي الرسائل من المقتدر وأمه إلى الوزير، وقال ابن الأثير إنما ذكرها لأن لها فيما بعد من الحكم في الدولة ما أوجب ذكرها {cite:kamil-ibn-al-athir p. 47-48}."
  en: "Palace stewardess (qahramana) of al-Muqtadir's household from 298, carrying messages between caliph, mother and vizier; Ibn al-Athir flags her later sway over the state {cite:kamil-ibn-al-athir p. 47-48}."
  es: "Mayordoma de palacio (qahramana) de la casa de al-Muqtadir desde 298, llevando mensajes entre el califa, la madre y el visir; Ibn al-Athir destaca su posterior influencia sobre el estado {cite:kamil-ibn-al-athir p. 47-48}."
  fr: "Intendante du palais (qahramana) de la maison d'al-Muqtadir à partir de 298, transportant des messages entre le calife, sa mère et le vizir; Ibn al-Athir signale son influence ultérieure sur l'État {cite:kamil-ibn-al-athir p. 47-48}."
  ur: "298 سے المقتدیر کے گھر کی محل کی نگران ⁦(قہرمانہ)⁩ جو خلیفہ، والدہ اور وزیر کے درمیان پیغامات لے کر جاتی ہے۔ ابن الاثیر نے بعد میں ریاست پر اپنا جھنڈا لہرایا۔ 47-48}۔"
