summary:
  ar: "حجر بن الحارث بن عمرو الكندي، أكبر أولاد الحارث وأبو الشاعر امرئ القيس؛ ملكه أبوه على بني أسد بن خزيمة وغطفان وكنانة وله عليهم جائزة وإتاوة، فلما بعث جبايته طردت بنو أسد رسله فسار إليهم فأخذ سرواتهم وأباح الأموال وحبس جماعة من أشرافهم فيهم عبيد بن الأبرص، ثم تكهن كاهنهم عوف بن ربيعة فهجموا عليه في قبته فقتله علباء بن الحارث الكاهلي وكان حجر قتل أباه، وانتهبت قيس وكنانة أسلابه {cite:kamil-ibn-al-athir p. 382-383}."
  en: "Hujr ibn al-Harith al-Kindi, eldest of al-Harith's sons and father of the poet Imru' al-Qays; placed over Asad, Ghatafan and Kinana with a yearly levy, he seized their chiefs and plundered their goods when they expelled his collectors — until their kahin prophesied his fall and Ilba' ibn al-Harith speared him in his tent, avenging his own father {cite:kamil-ibn-al-athir p. 382-383}."
  es: "Hujr ibn al-Harith al-Kindi, el mayor de los hijos de al-Harith y padre del poeta Imru' al-Qays; puesto sobre Asad, Ghatafan y Kinana con un impuesto anual, se apoderó de sus jefes y saqueó sus bienes cuando expulsaron a sus recaudadores, hasta que su kahin profetizó su caída e Ilba' ibn al-Harith lo lanceó en su tienda, vengando a su propio padre {cite:kamil-ibn-al-athir p. 382-383}."
  fr: "Hujr ibn al-Harith al-Kindi, l'aîné des fils d'al-Harith et père du poète Imru' al-Qays; placé sur Asad, Ghatafan et Kinana avec une levée annuelle, il s'empara de leurs chefs et pilla leurs biens lorsqu'ils expulsèrent ses collecteurs — jusqu'à ce que leur kahin prophétise sa chute et qu'Ilba' ibn al-Harith le transperce de sa lance dans sa tente, vengeant ainsi son propre père {cite:kamil-ibn-al-athir p. 382-383}."
  ur: "حارث بن حارث الکندی، حارث کے بیٹوں میں سب سے بڑے اور شاعر عمرو القیس کے والد؛ اسد، غطفان اور کنانہ پر سالانہ محصول لگا کر اس نے ان کے سرداروں کو پکڑ لیا اور ان کا مال لوٹ لیا جب انہوں نے اس کے جمع کرنے والوں کو نکال دیا- یہاں تک کہ ان کے کاہین نے اس کے زوال کی پیشین گوئی کی اور علبہ بن حارث نے اپنے ہی باپ کا بدلہ لیتے ہوئے اسے اپنے خیمے میں پھینک دیا۔ 382-383}۔"
  tr: "Hujr ibn al-Harith ibn Amr al-Kindi el-Harit'in en büyük oğlu ve şair İmru' el-Kais'in babasıdır; babası Banu Asad ibn Khuzaymah, Ghatfan ve Kinana'ya hükmediyordu ve onlara ödül ve haraç veriyordu. Vergisini gönderdiğinde, Banu Asad elçilerini kovdu, bu yüzden onlara yürüdü, servetlerini ele geçirdi ve Ubeyd ibn al-Abras'ın da aralarında bulunduğu bir grup soylularını hapse attı. Sonra kahin Awf ibn Rabi'ah kubbesinde ona saldırdı, onu öldürdü ve el-'Alba ibn al-Harit al-Kahili'yi öldürdü, Hajar ise babasını öldürdü. Qays ve Nanana soygununu yağmaladılar {cite:kamil-ibn-al-athir s. 382-383}."
  id: "Hujr ibn al-Harith ibn Amr al-Kindi, putra sulung al-Harith dan ayah penyair Imru' al-Qais; ayahnya memerintah Banu Asad ibn Khuzaymah, Ghatfan, dan Kinana, dan ia menerima hadiah serta upeti atas mereka. Ketika ia mengirimkan pajaknya, Banu Asad mengusir utusannya, sehingga ia berjalan ke arah mereka, merebut harta mereka, dan memenjarakan sekelompok bangsawan mereka, termasuk Ubayd ibn al-Abras. Kemudian peramal mereka, Awf ibn Rabi'ah, menyerangnya di kubahnya, membunuhnya dan membunuhnya al-'Alba ibn al-Harith al-Kahili sementara Hajar membunuh ayahnya. Qays dan Nanana menjarah perampokannya {cite:kamil-ibn-al-athir hlm. 382-383}."
