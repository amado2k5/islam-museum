summary:
  ar: "حجر بن الحارث بن عمرو الكندي، أكبر أولاد الحارث وأبو الشاعر امرئ القيس؛ ملكه أبوه على بني أسد بن خزيمة وغطفان وكنانة وله عليهم جائزة وإتاوة، فلما بعث جبايته طردت بنو أسد رسله فسار إليهم فأخذ سرواتهم وأباح الأموال وحبس جماعة من أشرافهم فيهم عبيد بن الأبرص، ثم تكهن كاهنهم عوف بن ربيعة فهجموا عليه في قبته فقتله علباء بن الحارث الكاهلي وكان حجر قتل أباه، وانتهبت قيس وكنانة أسلابه {cite:kamil-ibn-al-athir p. 382-383}."
  en: "Hujr ibn al-Harith al-Kindi, eldest of al-Harith's sons and father of the poet Imru' al-Qays; placed over Asad, Ghatafan and Kinana with a yearly levy, he seized their chiefs and plundered their goods when they expelled his collectors — until their kahin prophesied his fall and Ilba' ibn al-Harith speared him in his tent, avenging his own father {cite:kamil-ibn-al-athir p. 382-383}."
