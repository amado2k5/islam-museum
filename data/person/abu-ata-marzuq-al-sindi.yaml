id: person/abu-ata-marzuq-al-sindi
class: person
label: { ar: "مرزوق السندي", en: "Marzuq al-Sindi", fr: "Marzuq al-Sindi", es: "Marzuq al-Sindi", ur: "مرزوق السندی" }
summary:
  ar: "أبو عطاء مرزوق السندي الشاعر، ويُقال أبو العناس ويُقال إنه الحسن؛ من موالي أسد بن خزيمة، كان في لسانه عجمة يدلّ من الجيم زاياً ومن الشين سيناً، وحكى حماد الراوية وحماد عجرد وحماد بن الزبرقان وبكر بن مصعب المزني أنهم دعوه في ليلة فاحتالوا له ليقول «جرادة وزج وشيطان» ليظهر لثغته؛ وكان يتشيع ويهاجي البحتري {cite:wafayat-ayan}."
  en: "Abu Ata Marzuq al-Sindi — the lisping client-poet of Asad b. Khuzayma whom Hammad al-Rawiya's circle once baited into saying 'jarada wa-zaj wa-shaytan'; exchanged satires with al-Buhturi {cite:wafayat-ayan}."
  fr: "Abu Ata Marzuq al-Sindi — le poète client des Asad b. Khuzayma, au parler zézayant, que le cercle de Hammad al-Rawiya amena un jour par ruse à dire « jarada wa-zaj wa-shaytan » ; il échangea des satires avec al-Buhturi {cite:wafayat-ayan}."
  es: "Abu Ata Marzuq al-Sindi, el cliente-poeta ceceante de Asad b. Khuzayma, a quien el círculo de Hammad al-Rawiya una vez incitó a decir 'jarada wa-zaj wa-shaytan'; intercambió sátiras con al-Buhturi {cita:wafayat-ayan}."
  ur: "ابو عطا مرزوق السندی - اسد بن کے لب و لہجے والا مؤکل شاعر۔ خزیمہ جن کو حماد الراویہ کے حلقے نے ایک بار 'جرادہ و زج و شیطان' کہنے کی ترغیب دی تھی۔ البطوری کے ساتھ طنز کا تبادلہ کیا۔"
