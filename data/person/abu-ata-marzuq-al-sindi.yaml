summary:
  ar: "أبو عطاء مرزوق السندي الشاعر، ويُقال أبو العناس ويُقال إنه الحسن؛ من موالي أسد بن خزيمة، كان في لسانه عجمة يدلّ من الجيم زاياً ومن الشين سيناً، وحكى حماد الراوية وحماد عجرد وحماد بن الزبرقان وبكر بن مصعب المزني أنهم دعوه في ليلة فاحتالوا له ليقول «جرادة وزج وشيطان» ليظهر لثغته؛ وكان يتشيع ويهاجي البحتري {cite:wafayat-ayan}."
  en: "Abu Ata Marzuq al-Sindi — the lisping client-poet of Asad b. Khuzayma whom Hammad al-Rawiya's circle once baited into saying 'jarada wa-zaj wa-shaytan'; exchanged satires with al-Buhturi {cite:wafayat-ayan}."
