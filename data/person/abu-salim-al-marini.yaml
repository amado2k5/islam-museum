  ar: "إبراهيم بن علي بن عثمان بن يعقوب المريني، أبو سالم، السلطان المستعين بالله: من ملوك بني مرين في المغرب الأقصى، بويع سنة 760هـ بعد مقام في الأندلس، واستعان بابن خلدون في كتابة سره، وخلع ثم قتل سنة 762هـ."
  en: "Ibrahim ibn Ali ibn Uthman ibn Ya'qub al-Marini, Abu Salim, the sultan al-Musta'in billah: one of the Marinid kings of the far Maghrib, pledged to in 760 AH after a stay in al-Andalus, who made Ibn Khaldun keeper of his secret correspondence; he was deposed and killed in 762 AH."
