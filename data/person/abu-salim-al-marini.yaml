roles: [ruler]
gender: male
summary:
  ar: "إبراهيم بن علي بن عثمان بن يعقوب المريني، أبو سالم، السلطان المستعين بالله: من ملوك بني مرين في المغرب الأقصى، بويع سنة 760هـ بعد مقام في الأندلس، واستعان بابن خلدون في كتابة سره، وخلع ثم قتل سنة 762هـ."
  en: "Ibrahim ibn Ali ibn Uthman ibn Ya'qub al-Marini, Abu Salim, the sultan al-Musta'in billah: one of the Marinid kings of the far Maghrib, pledged to in 760 AH after a stay in al-Andalus, who made Ibn Khaldun keeper of his secret correspondence; he was deposed and killed in 762 AH."
  fr: "Ibrahim ibn Ali ibn Uthman ibn Ya'qub al-Marini, Abu Salim, le sultan al-Musta'in billah : l'un des rois mérinides du Maghreb extrême, qui reçut l'allégeance en 760 H après un séjour en al-Andalus et confia à Ibn Khaldun sa correspondance secrète ; il fut déposé et tué en 762 H."
  es: "Ibrahim ibn Ali ibn Uthman ibn Ya'qub al-Marini, Abu Salim, el sultán al-Musta'in billah: uno de los reyes mariníes del Magreb lejano, a quien se le juró lealtad en el año 760 AH después de una estancia en al-Ándalus, quien nombró a Ibn Khaldun custodio de su correspondencia secreta; fue depuesto y asesinado en el año 762 AH."
  ur: "ابراہیم بن علی ابن عثمان بن یعقوب المرینی، ابو سلیم، سلطان المستعین باللہ: دور مغرب کے مرینی بادشاہوں میں سے ایک، اندلس میں قیام کے بعد 760 ہجری میں عہد کیا، جس نے ابن خلدون کو اپنا رازداری کا نگران بنایا؛ وہ 762 ہجری میں معزول اور قتل ہوا۔"
  tr: "İbrahim ibn Ali ibn Osman ibn Yakub el-Marini, Ebu Salim, Sultan el-Musta'in Billah: Fas'ın en batısındaki Beni Marin kabilesinin krallarından biriydi. Endülüs'te kaldıktan sonra 760 Hicri yılında biat aldı. Sırlarını yazmak için İbn Haldun'dan yardım istedi. 762 Hicri yılında tahttan indirildi ve ardından öldürüldü."
  id: "Ibrahim ibn Ali ibn Uthman ibn Yaqub al-Marini, Abu Salim, Sultan al-Musta’in Billah: Salah satu raja Banu Marin di ujung barat Maroko. Ia menerima baiat pada tahun 760 H setelah tinggal di Andalusia. Ia meminta bantuan Ibn Khaldun dalam menuliskan rahasia-rahasianya. Ia digulingkan dan kemudian dibunuh pada tahun 762 H."
