label: { ar: "أبو حاتم الرازي الداعي", en: "Abu Hatim Al Razi Al Dai", fr: "Abu Hatim al-Razi le da'i", es: "Abu Hatim Al Razi Al Dai", ur: "ابو حاتم الرازی الدائی" }
summary:
  ar: "أبو حاتم أحمد بن حمدان الرازي داعي الري عند الإسماعيلية، وله كتاب الزينة كبير نحو أربع مائة ورقة وكتاب الجامع فيه فقة وغير ذلك {cite:fihrist-ibn-al-nadim p. 673}. وله كتاب الزينة كبير نحو أربع مائة ورقة وكتاب الجامع فيه فقه وغير ذلك {cite:fihrist-ibn-al-nadim p. 268}"
  en: "Ismaili da'i of Rayy — Kitab al-Zina (~400 folios) and al-Jami' {cite:fihrist-ibn-al-nadim}"
  fr: "Da'i ismaélien de Rayy — Kitab al-Zina (environ 400 feuillets) et al-Jami' {cite:fihrist-ibn-al-nadim}"
  es: "Ismaili da'i de Rayy - Kitab al-Zina (~400 folios) y al-Jami' {cita:fihrist-ibn-al-nadim}"
  ur: "اسماعیلی داعی آف رے - کتاب الزینا ⁦(~400 فولیو)⁩ اور الجامع {حوالہ: فہرست ابن الندیم}"
  tr: "Rayy'lı İsmailî misyoneri Ebu Hatim Ahmed ibn Hamdan el-Razi, yaklaşık dört yüz sayfadan oluşan büyük bir kitap olan el-Zina'yı ve fıkıh ve diğer konuları içeren kapsamlı el-Cami' kitabını yazmıştır. {cite:fihrist-ibn-al-nadim s. 673}. Ayrıca yaklaşık dört yüz sayfadan oluşan büyük bir kitap olan el-Zina'yı ve fıkıh ve diğer konuları içeren kapsamlı el-Cami' kitabını da yazmıştır. {cite:fihrist-ibn-al-nadim s. 268}"
  id: "Abu Hatim Ahmad ibn Hamdan al-Razi, seorang misionaris Ismaili dari Rayy, menulis kitab besar al-Zina, yang terdiri dari sekitar empat ratus halaman, dan kitab komprehensif al-Jami', yang berisi yurisprudensi dan subjek lainnya. {cite:fihrist-ibn-al-nadim hlm. 673}. Ia juga menulis kitab besar al-Zina, yang terdiri dari sekitar empat ratus halaman, dan kitab komprehensif al-Jami', yang berisi yurisprudensi dan subjek lainnya. {cite:fihrist-ibn-al-nadim hlm. 268}"
