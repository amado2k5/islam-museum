summary:
  ar: "عالم مسلم ملايوي من كلنتن، وُلد في نهاية سبتمبر 1870، وهو الابن الأكبر لتوان تابال، وعُيّن مفتيًا رابعًا لكلنتن في 21 أغسطس 1916 خلفًا لأخيه الأصغر الحاج وان موسى، وبقي في المنصب حتى وفاته سنة 1920."
  en: "Malay Muslim scholar of Kelantan, born at the end of September 1870, the eldest son of Tuan Tabal. He was appointed the fourth Mufti of Kelantan on 21 August 1916, succeeding his younger brother Haji Wan Musa, and held the office until his death in 1920."
