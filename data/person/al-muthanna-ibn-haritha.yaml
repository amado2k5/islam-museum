id: person/al-muthanna-ibn-haritha
class: person
label: { ar: "المثنى بن حارثة", en: "al-Muthanna ibn Haritha" }
summary:
  ar: "ورد ذكره في فهرس الجزء الثالث مع أبي عبيد بن مسعود في أخبار سنة ثلاث عشرة «ذكر خبر المثنى بن حارثة وأبي عبيد بن مسعود» {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. وعند البلاذري: المثنى بن حارثة بن سلامة بن ضمضم الشيباني كان يغير على السواد في رجال من قومه فكتب له أبو بكر عهداً على من أسلم منهم لقتال الفرس فنزل خفان ودعا قومه فأسلموا وكتب أبو بكر يأمره بالسمع والطاعة لخالد بن الوليد فلقيه بالنباج ولقي جابان بنهر الدم وهو أول فاتحي السواد."
  en: "His name appears in the index of the third volume, alongside Abu Ubayd ibn Mas'ud, for the year 13: 'Account of al-Muthanna ibn Haritha and Abu Ubayd ibn Mas'ud' {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. According to al-Baladhuri, al-Muthanna ibn Haritha ibn Salama ibn Dimdim al-Shaybani used to raid al-Sawad with men of his people. Abu Bakr wrote him a written commission over those of them who had embraced Islam, to fight the Persians; he alighted at Khafan and summoned his people, and they became Muslims. Abu Bakr then wrote ordering him to hear and obey Khalid ibn al-Walid; he met him at al-Nabaj, and met Jaban at Nahr al-Dam. He was the first conqueror of al-Sawad."
