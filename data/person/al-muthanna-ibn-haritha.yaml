id: person/al-muthanna-ibn-haritha
class: person
label: { ar: "المثنى بن حارثة", en: "al-Muthanna ibn Haritha", fr: "al-Muthanna ibn Haritha" , ur: "مثنیٰ بن حارثہ", es: "al-Muthanna ibn Haritha"}
summary:
  ar: "ورد ذكره في فهرس الجزء الثالث مع أبي عبيد بن مسعود في أخبار سنة ثلاث عشرة «ذكر خبر المثنى بن حارثة وأبي عبيد بن مسعود» {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. وعند البلاذري: المثنى بن حارثة بن سلامة بن ضمضم الشيباني كان يغير على السواد في رجال من قومه فكتب له أبو بكر عهداً على من أسلم منهم لقتال الفرس فنزل خفان ودعا قومه فأسلموا وكتب أبو بكر يأمره بالسمع والطاعة لخالد بن الوليد فلقيه بالنباج ولقي جابان بنهر الدم وهو أول فاتحي السواد."
  en: "His name appears in the index of the third volume, alongside Abu Ubayd ibn Mas'ud, for the year 13: 'Account of al-Muthanna ibn Haritha and Abu Ubayd ibn Mas'ud' {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. According to al-Baladhuri, al-Muthanna ibn Haritha ibn Salama ibn Dimdim al-Shaybani used to raid al-Sawad with men of his people. Abu Bakr wrote him a written commission over those of them who had embraced Islam, to fight the Persians; he alighted at Khafan and summoned his people, and they became Muslims. Abu Bakr then wrote ordering him to hear and obey Khalid ibn al-Walid; he met him at al-Nabaj, and met Jaban at Nahr al-Dam. He was the first conqueror of al-Sawad."
  fr: "Son nom apparaît dans l'index du troisième volume, aux côtés d'Abu Ubayd ibn Mas'ud, pour l'année 13 : \"Compte d'al-Muthanna ibn Haritha et Abu Ubayd ibm Mas'ud\" {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. Selon al-Baladhuri, al-Muthanna ibn Haritha ibn Salama ibn Dimdim al-Shaybani avait l’habitude de faire des raids sur al-Sawad avec des hommes de son peuple. Abu Bakr lui a écrit une commission sur ceux d'entre eux qui avaient embrassé l'islam, pour combattre les Perses ; Il descendit à Khafan et appela son peuple, et ils devinrent musulmans. Abou Bakr lui ordonna alors d'entendre et d'obéir à Khalid ibn al-Walid ; il le rencontra à al-Nabaj, et rencontra Jaban à Nahr al-Dam. Il fut le premier conquérant d'al-Sawad."
  ur: "بنو شیبان کے قائد؛ بلاذری عراق کی ابتدائی مہمات، ابو بکر کی طرف سے انہیں دیے گئے فرمان اور خالد بن ولید کے ساتھ ان کے تعاون کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "Su nombre aparece en el índice del tercer volumen, junto con Abu Ubayd ibn Mas'ud, para el año 13: «Relato de al-Muthanna ibn Haritha y Abu Ubayd ibn Mas'ud» {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. Según al-Baladhuri, al-Muthanna ibn Haritha ibn Salama ibn Dimdim al-Shaybani solía saquear al-Sawad con hombres de su pueblo. Abu Bakr le escribió una comisión por escrito para aquellos de ellos que se habían convertido al Islam, para luchar contra los persas; desembarcó en Khafan y convocó a su gente, y se convirtieron al Islam. Abu Bakr le escribió entonces ordenándole que escuchara y obedeciera a Khalid ibn al-Walid; se reunió con él en al-Nabaj y con Jaban en Nahr al-Dam. Fue el primer conquistador de al-Sawad."
