summary:
  ar: "صحفية ومؤلفة وصانعة أفلام بريطانية باكستانية، وُلدت في أجدابيا بليبيا سنة 1973 لأسرة من بافا في خيبر بختونخوا. عملت مقدّمة طقس في بي بي سي منذ 2008، وانتقلت إلى التلفزيون الباكستاني سنة 2013، وأنتجت فيلم «جانان» (2016)، ونشرت مذكراتها سنة 2018، وأطلقت سنة 2025 حزب الجمهورية الباكستاني."
  en: "British-Pakistani journalist, author and filmmaker, born in Ajdabiya, Libya, in 1973 to a family from Baffa in Khyber Pakhtunkhwa. A BBC weather presenter from 2008, she moved to Pakistani television in 2013, produced the film Janaan (2016), published a memoir in 2018, and in 2025 launched the Pakistan Republic Party."
  ur: "برطانوی پاکستانی صحافی، مصنفہ اور فلم ساز، جو 1973 میں لیبیا کے شہر اجدابیا میں خیبر پختونخوا کے علاقے بافہ سے تعلق رکھنے والے خاندان میں پیدا ہوئیں۔ 2008 سے بی بی سی کی موسمی پیش کار رہیں، 2013 میں پاکستانی ٹیلی ویژن سے وابستہ ہوئیں، فلم «جانان» (2016) پروڈیوس کی، 2018 میں یادداشتیں شائع کیں اور 2025 میں پاکستان ریپبلک پارٹی کی بنیاد رکھی۔"
  es: "Periodista, escritora y cineasta británico-pakistaní, nacida en Ajdabiya, Libia, en 1973 en el seno de una familia originaria de Baffa, en Khyber Pakhtunkhwa. Presentadora del tiempo en la BBC desde 2008, se incorporó a la televisión pakistaní en 2013, produjo la película Janaan (2016), publicó sus memorias en 2018 y en 2025 fundó el Partido de la República de Pakistán."
  fr: "Journaliste, auteure et réalisatrice britannico-pakistanaise, née à Ajdabiya, en Libye, en 1973, dans une famille originaire de Baffa, dans la province de Khyber Pakhtunkhwa. Présentatrice météo à la BBC à partir de 2008, elle a rejoint la télévision pakistanaise en 2013, produit le film Janaan (2016), publié ses mémoires en 2018 et fondé le Parti républicain du Pakistan en 2015."
  tr: "Britanyalı-Pakistanlı gazeteci, yazar ve film yapımcısı olan Sher, 1973 yılında Libya'nın Ajdabiya kentinde, Hayber Pakhtunkhwa'daki Bafa'dan bir ailede doğdu. 2008'den beri BBC'de hava durumu sunucusu olarak çalışıyor, 2013'te Pakistan televizyonuna geçti, 'Janan' (2016) filmini üretti, 2018'de anılarını yayımladı ve 2025'te Pakistan Cumhuriyeti Partisi'ni başlattı."
  id: "Seorang jurnalis, penulis, dan pembuat film Britania-Pakistan, ia lahir di Ajdabiya, Libya, pada tahun 1973 dari keluarga Bafa di Khyber Pakhtunkhwa. Ia telah bekerja sebagai pembawa acara cuaca di BBC sejak 2008, pindah ke televisi Pakistan pada 2013, memproduksi film 'Janan' (2016), menerbitkan memoarnya pada 2018, dan meluncurkan Partai Republik Pakistan pada 2025."

