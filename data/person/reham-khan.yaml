summary:
  ar: "صحفية ومؤلفة وصانعة أفلام بريطانية باكستانية، وُلدت في أجدابيا بليبيا سنة 1973 لأسرة من بافا في خيبر بختونخوا. عملت مقدّمة طقس في بي بي سي منذ 2008، وانتقلت إلى التلفزيون الباكستاني سنة 2013، وأنتجت فيلم «جانان» (2016)، ونشرت مذكراتها سنة 2018، وأطلقت سنة 2025 حزب الجمهورية الباكستاني."
  en: "British-Pakistani journalist, author and filmmaker, born in Ajdabiya, Libya, in 1973 to a family from Baffa in Khyber Pakhtunkhwa. A BBC weather presenter from 2008, she moved to Pakistani television in 2013, produced the film Janaan (2016), published a memoir in 2018, and in 2025 launched the Pakistan Republic Party."
  ur: "برطانوی پاکستانی صحافی، مصنفہ اور فلم ساز، جو 1973 میں لیبیا کے شہر اجدابیا میں خیبر پختونخوا کے علاقے بافہ سے تعلق رکھنے والے خاندان میں پیدا ہوئیں۔ 2008 سے بی بی سی کی موسمی پیش کار رہیں، 2013 میں پاکستانی ٹیلی ویژن سے وابستہ ہوئیں، فلم «جانان» (2016) پروڈیوس کی، 2018 میں یادداشتیں شائع کیں اور 2025 میں پاکستان ریپبلک پارٹی کی بنیاد رکھی۔"

