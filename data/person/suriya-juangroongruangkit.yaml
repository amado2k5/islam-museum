summary:
  ar: "سياسي تايلندي من أصل صيني، وُلد في بانكوك سنة 1954. مهندس تدرّب في جامعة كاليفورنيا ببيركلي ثم عمل في صناعة السيارات، وتولى حقائب الصناعة والنقل مرارا منذ 1998، وصار نائبا لرئيس الوزراء، وتولى رئاسة الوزراء بالوكالة لأيام في 1–3 يوليو 2025 أثناء تعليق مهام بايتونغتارن شيناواترا."
  en: "Thai politician of Thai Chinese descent, born in Bangkok in 1954. A Berkeley-trained manufacturing engineer who worked in the car industry, he has held the industry and transport portfolios repeatedly since 1998, served as deputy prime minister, and briefly acted as prime minister on 1–3 July 2025 during Paetongtarn Shinawatra's suspension."
  ur: "تھائی چینی نژاد تھائی سیاست دان، 1954ء میں بینکاک میں پیدا ہوئے۔ برکلے سے تربیت یافتہ مینوفیکچرنگ انجینئر جنھوں نے کار صنعت میں کام کیا؛ وہ 1998ء سے بار بار صنعت اور نقل و حمل کی وزارتیں سنبھال چکے ہیں، نائب وزیرِ اعظم رہے، اور پائتونگتارن شناواترا کی معطلی کے دوران 1–3 جولائی 2025ء کو مختصر مدت کے لیے قائم مقام وزیرِ اعظم رہے۔"
