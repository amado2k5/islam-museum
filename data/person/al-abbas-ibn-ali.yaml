  es: "Hijo de Ali y Umm al-Banin, asesinado junto a al-Husayn en 'Ashura' 61, uno de los cinco hijos a través de los cuales continuó el linaje de Ali {cite:muruj-al-dhahab p. 60,62}."
  ur: "ام البنین کے ذریعہ علی کا بیٹا - 'عاشورہ' 61 کو الحسین کے ساتھ مارا گیا، ان پانچ بیٹوں میں سے ایک جن کے ذریعے علی کا سلسلہ جاری رہا {حوالہ: مروج الذہب ص۔ 60,62}۔"
