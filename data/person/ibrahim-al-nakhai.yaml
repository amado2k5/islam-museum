summary:
  ar: "أبو عمران إبراهيم بن يزيد النخعي، من فقهاء التابعين، نشأ في أهل بيت فقه؛ قال أحمد إنه مات سنة ست وتسعين، وقال الشعبي حين بلغه موته: لو قلت أنعى العلم ما خلف بعده مثله {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  tr: "Tabi'in'in hukukçularından biri olan Ebu İmran İbrahim bin Yezid el-Nakha'i, fıkıh ailesinde büyüdü; Ahmed doksan altıncı yılda öldüğünü söyledi ve el-Şa'bi onun ölümünde şöyle dedi: Eğer bilginin unutulmayacağını söylesem, ondan sonra onun gibi bir şey gelmez {atıf:tabaqat-fuqaha-abbas-1981, s. 44} dedi."
  id: "Abu Imran Ibrahim ibn Yazid al-Nakha'i, salah satu ahli hukum Tabi'in, tumbuh di antara keluarga firih; Ahmad mengatakan ia meninggal pada tahun sembilan puluh enam, dan al-Sha'bi berkata saat kematiannya: Jika saya mengatakan bahwa pengetahuan tidak akan terlupakan setelahnya, maka tidak akan ada yang seperti itu setelahnya {cite:tabaqat-fuqaha-abbas-1981, hlm. 44}."
