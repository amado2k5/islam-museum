summary:
  ar: "قاضٍ ومفكر هندي (1849-1928) صار أول هندي في لجنة الاستئناف بمجلس الملك الخاص البريطاني، ومؤسس الجمعية الوطنية المركزية المحمدية وفرع لندن للرابطة الإسلامية. كتابه «روح الإسلام» (1891) من أشهر ما دافع به كاتب مسلم عن الإسلام أمام القراء الإنجليز، مع «تاريخ مختصر للعرب» و«القانون المحمدي»."
  en: "Indian jurist and writer (1849–1928) who became the first Indian appointed to the Judicial Committee of the Privy Council, founder of the Central National Muhammedan Association and of the Muslim League's London branch. His The Spirit of Islam (1891) is among the most influential defences of Islam addressed to English readers, alongside A Short History of the Saracens and Mahommedan Law."
  ur: "ہندوستانی قاضی و مصنف (1849ء–1928ء) جو برطانوی پریوی کونسل کی عدالتی کمیٹی میں مقرر ہونے والے پہلے ہندوستانی بنے، اور مرکزی قومی محمدن ایسوسی ایشن اور مسلم لیگ کی لندن شاخ کے بانی تھے۔ ان کی کتاب «روحِ اسلام» (1891ء) انگریزی قارئین کے سامنے اسلام کے دفاع کی مؤثر ترین کتابوں میں سے ایک ہے، «ساراسینوں کی مختصر تاریخ» اور «محمدن قانون» کے ساتھ۔"

