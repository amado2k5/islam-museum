    sources: [source/encyclopedia-of-religion-syed-ameer-ali, source/wikipedia-syed-ameer-ali-en]
    note: "Recorded under the founder's Shia-mapping rule, on two independent sources attesting 'Shia', with the mapping and its basis stated here. (1) The Encyclopedia of Religion entry (Lelyveld, 1987) attests not only the milieu — his family 'join[ed] a small community of fellow Shīʿī Muslims of Iranian descent', and he was formed by Sayyid Karamat Ali's treatise in 'the rationalistic Muʿtazili tradition of Shīʿī scholasticism' — but Ameer Ali's own adherence: writing of his defence of the caliphate, it concludes that he 'remained ultimately committed to the apostolic Shīʿī imamate', citing his own Mahommedan Law (1912 ed., vol. 1, p. 6). (2) The English Wikipedia article independently attests the same Shia identity through the family's claimed descent 'to Muhammad through his daughter Fatima from Imam Ali al-Rida, the eighth Shia Imam' — family attestation, which alone would never count, and which the Oxford Dictionary of National Biography corroborates in the same terms (a Shia family from Mashhad, Iran, whose origins shaped his own sense of identity, with lifelong links to the Hooghly Imambara). Neither source names a branch. The branch in this segment is the founder's mapping, and its support is stated plainly: the family's claimed descent is from Ali al-Rida, the eighth Imam of the Twelver line; the Indian Shia community of Iranian descent the family joined, and the Imambara world Ameer Ali remained tied to, are Twelver; nothing in any source points to any other Shia branch. His own writing argued positions across the divide — he defended the Sunni caliphate in The Spirit of Islam while holding the imamate — and the museum records the segment as mapped, not as a school he named for himself."

