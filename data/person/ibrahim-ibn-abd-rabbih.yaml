summary:
  ar: "إبراهيم بن عبد ربه الصوفي؛ قال المناوي في طبقاته زاهد شهود بالصلاح معدود من ذوي الفلاح أخذ عن الشيخ محمد الغمري والشيخ مدين وغيرهما وكان مقيماً في خلوة بجامع الزاهد وللناس فيه اعتقاد وربما لقن الذكر وسلك بل كان من أرباب الأحوال، دخل مرة بيت الشيخ مدين في مولده فأكل طعام المولد كله وأكل مرة لحم بقرة كاملة ثم طوى بعدها سنة ومن كراماته ما حكاه الشيخ أمين الدين إمام جامع الغمري أنه قال له ابنتك نسأل في مهماتنا فقال من بينه وبين أخيه ذراع من تراب فاسألي أجيبك فمرضت بنته فالتمسوا لها بطيخة فما وجدت فأتى إلى قبره وقال الوعد ثم رجع بعد العشاء فوجد في سلم بيته بطيخة لم يعلم من أين جاءت، توفي في صفر سنة ثمان وسبعين وثمانمائة ودفن بباب جامع الزاهد {cite:shadharat-dhahab p. 323-324}."
  en: "Ibn 'Abd Rabbih — the Sufi of Jami' al-Zahid's khalwa 'counted among the felicitous': once ate a whole ox then fasted the year after; at his grave the promised watermelon appeared in a disciple's stairwell; died Safar 878, buried at the mosque's gate {cite:shadharat-dhahab p. 323-324}."
  es: "Ibn 'Abd Rabbih — el sufí de la khalwa de Jami' al-Zahid 'contado entre los afortunados': una vez comió un buey entero y luego ayunó el año siguiente; en su tumba apareció la sandía prometida en la escalera de un discípulo; murió en Safar 878, enterrado en la puerta de la mezquita {cita: shadharat-dhahab págs. 323-324}."
  fr: "Ibn 'Abd Rabbih — le soufi de la khalwa de Jami' al-Zahid « compté parmi les heureux »: mangea un jour un bœuf entier puis jeûna l'année suivante; sur sa tombe, la pastèque promise apparut dans la cage d'escalier d'un disciple; mourut le Safar 878, enterré à la porte de la mosquée {cite: shadharat-dhahab p. 323-324}."
  ur: "ابن عبد ربیح - جامع الزاہد کے خلوہ کے صوفی 'خوش نصیبوں میں شمار ہوتے ہیں': ایک بار پورا بیل کھایا پھر سال بعد روزہ رکھا؛ اس کی قبر پر وعدہ کیا ہوا تربوز ایک شاگرد کی سیڑھی میں نمودار ہوا۔ صفر 878 میں وفات پائی، مسجد کے دروازے پر دفن ہوئے۔ 323-324}۔"
  tr: "İbrahim bin Abd Rabbih al-Sufi; Al-Manawi, Tabakat'ında kendisinin bir münzevi, doğruluğun şahidi, zenginler arasında sayılan ve bilgili biri olduğunu söylemiştir. Şeyh Muhammed el-Ghamri, Şeyh Madyan ve diğerlerinin yanında eğitim gördü. İnsanların inandığı Al-Zahid Camii'nde inzivada yaşadı. Bazen anma öğrendi ve hatta manevi rehberlik uyguladı. Bir keresinde Şeyh Madyan'ın doğum gününde evine girdi, doğum günü için tüm yiyecekleri yedi, bir keresinde bütün dana eti yedi, sonra bir yıl sonra pes etti. Mucizelerinden biri, El-Ghumri Camii imamı Şeyh Amin al-Din'in ona söyledikleridir. Kızınız, görevlerimizi soruyoruz. Dedi ki, 'Onunla kardeşi arasında bir arşın toz var, sor, sana cevap vereceğim.' Kızı hastalandı, ona bir karpuz istediler ama bulamadı. Mezarına gidip söz verdi, sonra Isha'nın peşinden döndü ve evinin kapısında kaynağı bilinmeyen bir karpuz buldu. 878 Hicri yılında Safar'da öldü ve zahhi camisinin kapısına defnedildi {atıf:shadharat-dhahab, s. 323-324}."
  id: "Ibrahim ibn Abd Rabbih al-Sufi; Al-Manawi mengatakan dalam Tabaqatnya bahwa ia adalah seorang pertapa, saksi kebenaran, termasuk di antara orang kaya dan berpengetahuan di kalangan orang kaya. Ia belajar di bawah bimbingan Sheikh Muhammad al-Ghamri, Sheikh Madyan, dan lainnya. Ia tinggal dalam persembunyian di Masjid Al-Zahid, tempat orang-orang beriman. Kadang-kadang ia belajar mengenang dan bahkan mempraktikkan bimbingan spiritual. Ia pernah masuk ke rumah Sheikh Madyan saat ulang tahunnya, memakan semua makanan ulang tahun, dan sekali makan daging sapi utuh, lalu melipat setahun kemudian. Di antara mukjizatnya adalah apa yang diceritakan Sheikh Amin al-Din, imam Masjid Al-Ghumri, yang dikatakan kepadanya. Putrimu, kami bertanya tentang tugas kami. Dia berkata, 'Di antara dia dan saudaranya ada satu hasta debu, maka mintalah, aku akan menjawabmu.' Putrinya jatuh sakit, jadi mereka meminta semangka untuknya, tetapi dia tidak menemukannya. Dia pergi ke makamnya dan membuat janji, lalu kembali mengejar Isha dan menemukan semangka di pintu rumahnya yang sumbernya tidak diketahui. Dia meninggal di Safar pada tahun 878 H dan dimakamkan di gerbang masjid pertapa {cite:shadharat-dhahab, hlm. 323-324}."
