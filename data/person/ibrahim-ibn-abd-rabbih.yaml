summary:
  ar: "إبراهيم بن عبد ربه الصوفي؛ قال المناوي في طبقاته زاهد شهود بالصلاح معدود من ذوي الفلاح أخذ عن الشيخ محمد الغمري والشيخ مدين وغيرهما وكان مقيماً في خلوة بجامع الزاهد وللناس فيه اعتقاد وربما لقن الذكر وسلك بل كان من أرباب الأحوال، دخل مرة بيت الشيخ مدين في مولده فأكل طعام المولد كله وأكل مرة لحم بقرة كاملة ثم طوى بعدها سنة ومن كراماته ما حكاه الشيخ أمين الدين إمام جامع الغمري أنه قال له ابنتك نسأل في مهماتنا فقال من بينه وبين أخيه ذراع من تراب فاسألي أجيبك فمرضت بنته فالتمسوا لها بطيخة فما وجدت فأتى إلى قبره وقال الوعد ثم رجع بعد العشاء فوجد في سلم بيته بطيخة لم يعلم من أين جاءت، توفي في صفر سنة ثمان وسبعين وثمانمائة ودفن بباب جامع الزاهد {cite:shadharat-dhahab p. 323-324}."
  en: "Ibn 'Abd Rabbih — the Sufi of Jami' al-Zahid's khalwa 'counted among the felicitous': once ate a whole ox then fasted the year after; at his grave the promised watermelon appeared in a disciple's stairwell; died Safar 878, buried at the mosque's gate {cite:shadharat-dhahab p. 323-324}."
