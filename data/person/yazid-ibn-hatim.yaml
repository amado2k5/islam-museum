id: person/yazid-ibn-hatim
class: person
label: { ar: "يزيد بن حاتم المهلبي" }
summary:
  ar: "عند البلاذري: يزيد بن حاتم بن قبيصة بن المهلب ولّي إفريقية بعد هزارمرد فخرج في خمسين ألفاً وشيّعه المنصور إلى بيت المقدس وأنفق عليه مالاً عظيماً فقتل أبا خاتم الإباضي باطر إبليس ودخل إفريقية فاستقامت له ثم ولّي بعده روح بن حاتم."
  en: "In al-Baladhuri: Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab governed Ifriqiya after Hazarmard — he went out in fifty thousand, al-Mansur escorting him to Bayt al-Maqdis with great spending; he killed Abu Khatim al-Ibadi at Batr Iblis and entered Ifriqiya which settled for him; Rawh ibn Hatim ruled after him."
  es: "En al-Baladhuri: Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab gobernó Ifriqiya después de Hazarmard; salió en cincuenta mil personas, y al-Mansur lo escoltó hasta Bayt al-Maqdis con grandes gastos; mató a Abu Khatim al-Ibadi en Batr Iblis y entró en Ifriqiya, que se conformó con él; Rawh ibn Hatim gobernó después de él."
  fr: "Dans al-Baladhuri: Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab a gouverné l'Ifriqiya après Hazarmard — il est sorti en cinquante mille, al-Mansur l'escortant à Bayt al-Maqdis avec de grandes dépenses; il tua Abu Khatim al-Ibadi à Batr Iblis et entra en Ifriqiya qui s'installa pour lui; Rawh ibn Hatim a régné après lui."
  ur: "البلادوری میں ہے: یزید بن حاتم ابن قبیصہ ابن المحلب نے ہزارمرد کے بعد افریقیہ پر حکومت کی - وہ پچاس ہزار میں نکلا، المنصور نے اسے بڑے خرچ کے ساتھ بیت المقدس لے جایا۔ اس نے ابو خاتم العبادی کو بتر ابلیس میں قتل کر دیا اور عفریقیہ میں داخل ہوا جو اس کے لیے آباد تھا۔ ان کے بعد راو بن حاتم نے حکومت کی۔"
