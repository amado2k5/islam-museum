summary:
  ar: "عند البلاذري: يزيد بن حاتم بن قبيصة بن المهلب ولّي إفريقية بعد هزارمرد فخرج في خمسين ألفاً وشيّعه المنصور إلى بيت المقدس وأنفق عليه مالاً عظيماً فقتل أبا خاتم الإباضي باطر إبليس ودخل إفريقية فاستقامت له ثم ولّي بعده روح بن حاتم."
  en: "In al-Baladhuri: Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab governed Ifriqiya after Hazarmard — he went out in fifty thousand, al-Mansur escorting him to Bayt al-Maqdis with great spending; he killed Abu Khatim al-Ibadi at Batr Iblis and entered Ifriqiya which settled for him; Rawh ibn Hatim ruled after him."
