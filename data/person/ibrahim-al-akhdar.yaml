summary:
  ar: "قارئ وإمام سعودي من المدينة المنورة ⁦(وُلد 1364هـ/1944)⁩، قرأ القراءات العشر على عبد الفتاح القاضي، وأمّ في المسجد الحرام ثم في المسجد النبوي تسع سنين من 1406هـ، ودرّس في الجامعة الإسلامية، وكان ممن اقترحوا على ابن باز إنشاء كلية القرآن الكريم فيها."
  en: "Saudi reciter and imam from Medina (born 1364 AH/1944) who read the ten readings with Abd al-Fattah al-Qadi, led prayers at the Masjid al-Haram and then for nine years from 1406 AH at the Prophet's Mosque, taught at the Islamic University of Madinah, and was among those who proposed its Faculty of the Qur'an to Ibn Baz."
  ur: "مدینہ منورہ کے سعودی قاری اور امام ⁦(پیدائش 1364ھ/1944ء)⁩، جنھوں نے عبد الفتاح القاضی سے قراءاتِ عشرہ پڑھیں، مسجد حرام اور پھر 1406ھ سے نو برس مسجد نبوی میں امامت کی، اسلامی یونیورسٹی مدینہ میں پڑھایا، اور ان لوگوں میں تھے جنھوں نے ابن باز کو وہاں کلیۃ القرآن کے قیام کی تجویز دی۔"
