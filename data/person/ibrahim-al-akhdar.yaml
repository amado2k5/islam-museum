summary:
  ar: "\u0642\u0627\u0631\u0626 \u0648\u0625\u0645\u0627\u0645 \u0633\u0639\u0648\u062f\u064a \u0645\u0646 \u0627\u0644\u0645\u062f\u064a\u0646\u0629 \u0627\u0644\u0645\u0646\u0648\u0631\u0629 \u2066(\u0648\u064f\u0644\u062f 1364\u0647\u0640/1944)\u2069\u060c \u0642\u0631\u0623 \u0627\u0644\u0642\u0631\u0627\u0621\u0627\u062a \u0627\u0644\u0639\u0634\u0631 \u0639\u0644\u0649 \u0639\u0628\u062f \u0627\u0644\u0641\u062a\u0627\u062d \u0627\u0644\u0642\u0627\u0636\u064a\u060c \u0648\u0623\u0645\u0651 \u0641\u064a \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u062b\u0645 \u0641\u064a \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u0646\u0628\u0648\u064a \u062a\u0633\u0639 \u0633\u0646\u064a\u0646 \u0645\u0646 1406\u0647\u0640\u060c \u0648\u062f\u0631\u0651\u0633 \u0641\u064a \u0627\u0644\u062c\u0627\u0645\u0639\u0629 \u0627\u0644\u0625\u0633\u0644\u0627\u0645\u064a\u0629\u060c \u0648\u0643\u0627\u0646 \u0645\u0645\u0646 \u0627\u0642\u062a\u0631\u062d\u0648\u0627 \u0639\u0644\u0649 \u0627\u0628\u0646 \u0628\u0627\u0632 \u0625\u0646\u0634\u0627\u0621 \u0643\u0644\u064a\u0629 \u0627\u0644\u0642\u0631\u0622\u0646 \u0627\u0644\u0643\u0631\u064a\u0645 \u0641\u064a\u0647\u0627."
  en: "Saudi reciter and imam from Medina (born 1364 AH/1944) who read the ten readings with Abd al-Fattah al-Qadi, led prayers at the Masjid al-Haram and then for nine years from 1406 AH at the Prophet's Mosque, taught at the Islamic University of Madinah, and was among those who proposed its Faculty of the Qur'an to Ibn Baz."
  ur: "\u0645\u062f\u06cc\u0646\u06c1 \u0645\u0646\u0648\u0631\u06c1 \u06a9\u06d2 \u0633\u0639\u0648\u062f\u06cc \u0642\u0627\u0631\u06cc \u0627\u0648\u0631 \u0627\u0645\u0627\u0645 \u2066(\u067e\u06cc\u062f\u0627\u0626\u0634 1364\u06be/1944\u0621)\u2069\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0639\u0628\u062f \u0627\u0644\u0641\u062a\u0627\u062d \u0627\u0644\u0642\u0627\u0636\u06cc \u0633\u06d2 \u0642\u0631\u0627\u0621\u0627\u062a\u0650 \u0639\u0634\u0631\u06c1 \u067e\u0691\u06be\u06cc\u06ba\u060c \u0645\u0633\u062c\u062f \u062d\u0631\u0627\u0645 \u0627\u0648\u0631 \u067e\u06be\u0631 1406\u06be \u0633\u06d2 \u0646\u0648 \u0628\u0631\u0633 \u0645\u0633\u062c\u062f \u0646\u0628\u0648\u06cc \u0645\u06cc\u06ba \u0627\u0645\u0627\u0645\u062a \u06a9\u06cc\u060c \u0627\u0633\u0644\u0627\u0645\u06cc \u06cc\u0648\u0646\u06cc\u0648\u0631\u0633\u0679\u06cc \u0645\u062f\u06cc\u0646\u06c1 \u0645\u06cc\u06ba \u067e\u0691\u06be\u0627\u06cc\u0627\u060c \u0627\u0648\u0631 \u0627\u0646 \u0644\u0648\u06af\u0648\u06ba \u0645\u06cc\u06ba \u062a\u06be\u06d2 \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0627\u0628\u0646 \u0628\u0627\u0632 \u06a9\u0648 \u0648\u06c1\u0627\u06ba \u06a9\u0644\u06cc\u06c3 \u0627\u0644\u0642\u0631\u0622\u0646 \u06a9\u06d2 \u0642\u06cc\u0627\u0645 \u06a9\u06cc \u062a\u062c\u0648\u06cc\u0632 \u062f\u06cc\u06d4"
