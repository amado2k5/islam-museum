summary:
  ar: "قارئ وإمام سعودي من المدينة المنورة ⁦(وُلد 1364هـ/1944)⁩، قرأ القراءات العشر على عبد الفتاح القاضي، وأمّ في المسجد الحرام ثم في المسجد النبوي تسع سنين من 1406هـ، ودرّس في الجامعة الإسلامية، وكان ممن اقترحوا على ابن باز إنشاء كلية القرآن الكريم فيها."
  en: "Saudi reciter and imam from Medina (born 1364 AH/1944) who read the ten readings with Abd al-Fattah al-Qadi, led prayers at the Masjid al-Haram and then for nine years from 1406 AH at the Prophet's Mosque, taught at the Islamic University of Madinah, and was among those who proposed its Faculty of the Qur'an to Ibn Baz."
  ur: "مدینہ منورہ کے سعودی قاری اور امام ⁦(پیدائش 1364ھ/1944ء)⁩، جنھوں نے عبد الفتاح القاضی سے قراءاتِ عشرہ پڑھیں، مسجد حرام اور پھر 1406ھ سے نو برس مسجد نبوی میں امامت کی، اسلامی یونیورسٹی مدینہ میں پڑھایا، اور ان لوگوں میں تھے جنھوں نے ابن باز کو وہاں کلیۃ القرآن کے قیام کی تجویز دی۔"
  es: "Recitador e imán saudí de Medina (nacido en 1364 AH/1944) que leyó las diez lecturas con Abd al-Fattah al-Qadi, dirigió las oraciones en la Mezquita Sagrada (Masjid al-Haram) y luego durante nueve años a partir de 1406 AH en la Mezquita del Profeta, enseñó en la Universidad Islámica de Medina y estuvo entre quienes propusieron su Facultad del Corán a Ibn Baz."
  fr: "Récitateur et imam saoudien de Médine (né en 1364 AH/1944) qui a lu les dix lectures avec Abd al-Fattah al-Qadi, a dirigé les prières à la Masjid al-Haram puis pendant neuf ans à partir de 1406 AH à la Mosquée du Prophète, a enseigné à l'Université islamique de Médine et a été parmi ceux qui ont proposé sa Faculté du Coran à Ibn Baz."
  tr: "Medine'den bir Suudi şahmetçi ve imam olan Suud, Abdulfettah El-Kadi döneminde On Qira'at'ı okudu, 1406 Hicri'den itibaren dokuz yıl boyunca Mescid'de ve ardından Peygamber Camii'nde annelik yaptı. İslam Üniversitesi'nde eğitim gördü ve İbn Baz'a orada bir Kur'an-ı Kerim koleji kurulmasını önerenlerden biriydi."
  id: "Seorang pembaca dan imam Saudi dari Madinah (lahir 1364 H / 1944 M), ia membacakan Ten Qira'at di bawah Abdul Fattah Al-Qadi, menjadi ibu di Masjid Agung dan kemudian di Masjid Nabi selama sembilan tahun sejak 1406 H. Ia belajar di Universitas Islam dan termasuk di antara mereka yang menyarankan kepada Ibn Baz untuk mendirikan sebuah Kolej Al-Qur'an di sana."
