summary:
  ar: "مغنٍّ وعازف غيتار وملحّن سنغالي، وُلد في بودور على نهر السنغال سنة 1953 ⁦(تختلف المصادر بين 12 نوفمبر و13 يونيو)⁩. يغني أساسًا بلغة البولار ويروّج لتقاليد الناطقين بها في فوتا تورو، ودمج موسيقاه بالريغي والسالسا والإلكترونيكا، وغنّى في موسيقى فيلم «النمر الأسود»، وله نشاط إنساني مع برنامج الأمم المتحدة الإنمائي ومنظمة مكافحة التصحر."
  en: "Senegalese singer, guitarist and composer, born at Podor on the Senegal River in 1953 (the sources divide between 12 November and 13 June). He sings primarily in Pulaar and promotes the traditions of its speakers in Futa Tooro, fused his music with ragga, salsa and electronica, sang on the Black Panther film scores, and works with the UNDP and the UNCCD on development and desertification."
  ur: "سینیگال کے گلوکار، گٹار نواز و موسیقی ساز، جو 1953 میں دریائے سینیگال کے کنارے پودور میں پیدا ہوئے ⁦(مآخذ 12 نومبر اور 13 جون میں منقسم ہیں)⁩۔ بنیادی طور پر پولار زبان میں گاتے ہیں اور فوتا تورو کی روایات کو فروغ دیتے ہیں؛ ان کی آواز «بلیک پینتھر» فلموں کی موسیقی میں شامل ہے، اور وہ اقوام متحدہ کے ترقیاتی پروگرام کے ساتھ انسانی خدمت میں سرگرم ہیں۔"
  es: "Cantante, guitarrista y compositor senegalés, nacido en Podor, a orillas del río Senegal, en 1953 (las fuentes discrepan entre el 12 de noviembre y el 13 de junio). Canta principalmente en pulaar y promueve las tradiciones de sus hablantes en futa tooro. Ha fusionado su música con ragga, salsa y electrónica, participó en la banda sonora de la película Black Panther y colabora con el PNUD y la CNULD en temas de desarrollo y desertificación."
  fr: "Chanteur, guitariste et compositeur sénégalais, né à Podor, sur le fleuve Sénégal, en 1953 (les sources divergent entre le 12 novembre et le 13 juin). Il chante principalement en pulaar et promeut les traditions de ses locuteurs au Fouta Tooro. Sa musique fusionne le ragga, la salsa et l'électro, il a participé à la bande originale du film Black Panther et collabore avec le PNUD et la CNULCD sur les questions de développement et de lutte contre la désertification."
  tr: "1953'te Senegal Nehri kıyısındaki Boodor'da doğmuş Senegalli bir şarkıcı, gitarist ve bestecidir (kaynaklar 12 Kasım ile 13 Haziran arasında değişmektedir). Ağırlıklı olarak Kutup dilinde şarkı söyler ve Futa Toro'daki konuşmacıların geleneklerini yayımlar; müziğini reggae, salsa ve elektronik ile harmanlar. \"Black Panther\" filminin müziğinde şarkı söyledi ve Birleşmiş Milletler Kalkınma Programı ile Çölleşmeyle Mücadele Örgütü ile insani yardım faaliyetlerinde aktiftir."
  id: "Seorang penyanyi, gitaris, dan komposer Senegal, lahir di Boodor di Sungai Senegal pada tahun 1953 (sumber bervariasi antara 12 November hingga 13 Juni). Ia terutama bernyanyi dalam bahasa Kutub dan mempromosikan tradisi penutur di Futa Toro, memadukan musiknya dengan reggae, salsa, dan electronica. Ia bernyanyi dalam musik untuk film \"Black Panther,\" dan aktif dalam kegiatan kemanusiaan bersama Program Pembangunan Perserikatan Bangsa-Bangsa dan Organisasi untuk Memerangi Penggurunan."
