summary:
  ar: "مغنٍّ وعازف غيتار وملحّن سنغالي، وُلد في بودور على نهر السنغال سنة 1953 (تختلف المصادر بين 12 نوفمبر و13 يونيو). يغني أساسًا بلغة البولار ويروّج لتقاليد الناطقين بها في فوتا تورو، ودمج موسيقاه بالريغي والسالسا والإلكترونيكا، وغنّى في موسيقى فيلم «النمر الأسود»، وله نشاط إنساني مع برنامج الأمم المتحدة الإنمائي ومنظمة مكافحة التصحر."
  en: "Senegalese singer, guitarist and composer, born at Podor on the Senegal River in 1953 (the sources divide between 12 November and 13 June). He sings primarily in Pulaar and promotes the traditions of its speakers in Futa Tooro, fused his music with ragga, salsa and electronica, sang on the Black Panther film scores, and works with the UNDP and the UNCCD on development and desertification."
  ur: "سینیگال کے گلوکار، گٹار نواز و موسیقی ساز، جو 1953 میں دریائے سینیگال کے کنارے پودور میں پیدا ہوئے (مآخذ 12 نومبر اور 13 جون میں منقسم ہیں)۔ بنیادی طور پر پولار زبان میں گاتے ہیں اور فوتا تورو کی روایات کو فروغ دیتے ہیں؛ ان کی آواز «بلیک پینتھر» فلموں کی موسیقی میں شامل ہے، اور وہ اقوام متحدہ کے ترقیاتی پروگرام کے ساتھ انسانی خدمت میں سرگرم ہیں۔"
