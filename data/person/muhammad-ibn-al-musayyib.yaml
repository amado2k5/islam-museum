id: person/muhammad-ibn-al-musayyib
class: person
label:
  ar: أبو الدرداء محمد بن المسيب العقيلي
  en: Abu al-Darda' Muhammad ibn al-Musayyib al-Uqayli
  es: "Abu al-Darda' Muhammad ibn al-Musayyib al-Uqayli"
  fr: "Abu al-Darda' Muhammad ibn al-Musayyib al-Uqayli"
  ur: "ابو الدرداء محمد بن المسیب العقیلی"
summary:
  ar: "أبو الدرداء محمد بن المسيب بن رافع بن مقلد أمير بني عقيل؛ مؤسس ملكهم بالموصل إذ قتل أبا طاهر وأصحابه وسار إلى الموصل فملكها، ولما بعث بهاء الدولة أبا جعفر الحجاج بن هرمز فغلب عليها زحف لحربه في قومه ومن اجتمع إليه من العرب فكان الظفر للديلم، وتوفي سنة 386هـ فولي إمارة بني عقيل أخوه علي ثم استقر الملك لأخيهما المقلد."
  en: "Abu al-Darda' Muhammad ibn al-Musayyib ibn Rafi' ibn Muqallad, amir of Banu Uqayl and founder of their rule at Mosul — he killed Abu Tahir and his companions and took the city; when Baha' al-Dawla sent Abu Ja'far al-Hajjaj ibn Hurmuz who seized it, he marched against him with his people and rallied Arabs but the Daylamites prevailed; he died in 386 AH, the emirate passing to his brother Ali then settling with their brother al-Muqallad."
  es: "Abu al-Darda' Muhammad ibn al-Musayyib ibn Rafi' ibn Muqallad, emir de Banu Uqayl y fundador de su gobierno en Mosul, mató a Abu Tahir y a sus compañeros y tomó la ciudad; cuando Baha' al-Dawla envió a Abu Ja'far al-Hajjaj ibn Hurmuz, quien la tomó, marchó contra él con su gente y reunió a los árabes, pero los daylamitas prevalecieron; murió en el año 386 de la Hégira, el emirato pasó a su hermano Ali y luego se estableció con su hermano al-Muqallad."
  fr: "Abu al-Darda' Muhammad ibn al-Musayyib ibn Rafi' ibn Muqallad, émir des Banu Uqayl et fondateur de leur règne à Mossoul, tua Abu Tahir et ses compagnons et s'empara de la ville. Lorsque Baha' al-Dawla envoya Abu Ja'far al-Hajjaj ibn Hurmuz qui la conquit, il marcha contre lui avec son peuple et rallia les Arabes, mais les Daylamites l'emportèrent. Il mourut en 386 AH, l'émirat passant à son frère Ali qui s'installa ensuite avec leur frère al-Muqallad."
  ur: "ابو الدرداء محمد بن المسیب بن رافع ابن مقلد، بنو عقیل کے امیر اور موصل میں ان کی حکومت کا بانی - اس نے ابو طاہر اور اس کے ساتھیوں کو قتل کر کے شہر پر قبضہ کر لیا۔ جب بہاء الدولہ نے ابو جعفر الحجاج ابن ہرمز کو بھیجا جس نے اس پر قبضہ کیا تو اس نے اپنی قوم کے ساتھ اس کے خلاف کوچ کیا اور عربوں کو اکٹھا کیا لیکن دیلامائٹس غالب آگئے۔ ان کا انتقال 386 ہجری میں ہوا، امارت ان کے بھائی علی کے پاس چلی گئی اور پھر وہ اپنے بھائی المقلد کے ساتھ آباد ہوئے۔"
