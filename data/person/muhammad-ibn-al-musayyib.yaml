id: person/muhammad-ibn-al-musayyib
class: person
label:
  ar: أبو الدرداء محمد بن المسيب العقيلي
  en: Abu al-Darda' Muhammad ibn al-Musayyib al-Uqayli
summary:
  ar: "أبو الدرداء محمد بن المسيب بن رافع بن مقلد أمير بني عقيل؛ مؤسس ملكهم بالموصل إذ قتل أبا طاهر وأصحابه وسار إلى الموصل فملكها، ولما بعث بهاء الدولة أبا جعفر الحجاج بن هرمز فغلب عليها زحف لحربه في قومه ومن اجتمع إليه من العرب فكان الظفر للديلم، وتوفي سنة 386هـ فولي إمارة بني عقيل أخوه علي ثم استقر الملك لأخيهما المقلد."
  en: "Abu al-Darda' Muhammad ibn al-Musayyib ibn Rafi' ibn Muqallad, amir of Banu Uqayl and founder of their rule at Mosul — he killed Abu Tahir and his companions and took the city; when Baha' al-Dawla sent Abu Ja'far al-Hajjaj ibn Hurmuz who seized it, he marched against him with his people and rallied Arabs but the Daylamites prevailed; he died in 386 AH, the emirate passing to his brother Ali then settling with their brother al-Muqallad."
