summary:
  ar: "عالم ومدرّس أمريكي من دالاس بولاية تكساس، مؤسس معهد قلم ورئيسه. حفظ القرآن في كراتشي صغيراً، وتخرّج في برنامج العالم بجامعة بنورية، ونال درجتين في العربية والدراسات الإسلامية من جامعتي كراتشي والسند، ويدرّس في معهد قلم الشرعي؛ ومن أشهر أعماله الصوتية «بودكاست السيرة» و«بودكاست التفسير»."
  en: "American scholar and teacher from Dallas, Texas, founder and president of the Qalam Institute. He memorised the Qur'an in Karachi as a boy, graduated from Jamia Binoria's alim programme, took degrees in Arabic and Islamic studies from the University of Karachi and the University of Sindh, and teaches at Qalam Seminary; his best-known audio works are the complete Seerah Podcast and the Tafsir Podcast."
  ur: "ڈلاس، ٹیکساس سے تعلق رکھنے والے امریکی عالم و مدرس، قلم انسٹی ٹیوٹ کے بانی و صدر۔ انہوں نے بچپن میں کراچی میں قرآن حفظ کیا، جامعہ بنوریہ کے عالم پروگرام سے فارغ ہوئے، کراچی یونیورسٹی اور سندھ یونیورسٹی سے عربی و اسلامی علوم کی اسناد لیں، اور قلم سیمینری میں پڑھاتے ہیں؛ ان کی مشہور آڈیو تصانیف میں سیرت پوڈکاسٹ اور تفسیر پوڈکاسٹ شامل ہیں۔"
