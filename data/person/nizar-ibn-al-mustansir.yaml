id: person/nizar-ibn-al-mustansir
class: person
label: { ar: "نزار بن المستنصر صاحب الدعوة النزارية" }
summary:
  ar: "نزار بن المستنصر — أخو المستعلي بالله العبيدي الذي تنسب إليه الدعوة النزارية بقلعة ألموت؛ هرب في أيام أخيه إلى الإسكندرية فبايعه أمنها وساعده قاضيها ابن عمار ومتوليها افتكين، فنازلهم الأفضل أمير الجيوش فبرز له افتكين فهزمه ثم نازلهم ثانياً وظفر بهم ورجع إلى القاهرة بافتكين ونزار فذبح افتكين وبنى على نزار حائطاً فهلك — وذلك في صدر سنة خمس وتسعين وأربعمائة {cite:shadharat-dhahab p. 402}."
  en: "Nizar b. al-Mustansir — al-Musta'li's brother to whom the Nizari da'wa of Alamut is traced; he fled to Alexandria where its security chief, its qadi Ibn Ammar and its mutawalli Iftikin backed him, until al-Afdal besieged them, beat Iftikin in the field, took both to Cairo, beheaded Iftikin and immured Nizar alive — at the opening of 495 {cite:shadharat-dhahab p. 402}."
  es: "Nizar b. al-Mustansir — hermano de al-Musta'li, a quien se remonta la da'wa nizarí de Alamut; huyó a Alejandría, donde su jefe de seguridad, su cadí Ibn Ammar y su mutawalli Iftikin lo apoyaron, hasta que al-Afdal los asedió, derrotó a Iftikin en el campo, los llevó a ambos a El Cairo, decapitó a Iftikin y emparedó vivo a Nizar — a principios del año 495 {cite:shadharat-dhahab p. 402}."
  fr: "Nizar b. al-Mustansir — le frère d'al-Musta'li à qui l'on attribue la da'wa nizarite d'Alamut; il s'enfuit à Alexandrie où son chef de la sécurité, son cadi Ibn Ammar et son mutawalli Iftikin le soutinrent, jusqu'à ce qu'al-Afdal les assiège, batte Iftikin sur le champ de bataille, les emmène tous deux au Caire, décapite Iftikin et emmure Nizar vivant — au début de l'année 495 {cite:shadharat-dhahab p. 402}."
  ur: "نثار بی۔ المستنصر - المستعلی کا بھائی جس سے الموت کی نظری دعوت کا سراغ ملتا ہے۔ وہ اسکندریہ بھاگ گیا جہاں اس کے سیکورٹی چیف، اس کے قاضی ابن عمار اور اس کے متولی عفتکین نے اس کی حمایت کی، یہاں تک کہ الفدل نے ان کا محاصرہ کر لیا، عفتکین کو میدان میں مارا، دونوں کو قاہرہ لے گئے، عفتکین کا سر قلم کر دیا اور نزار کو زندہ جلا دیا — 495 کے آغاز پر۔ 402}۔"
