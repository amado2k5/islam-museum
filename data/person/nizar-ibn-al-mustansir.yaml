label: { ar: "نزار بن المستنصر صاحب الدعوة النزارية" }
summary:
  ar: "نزار بن المستنصر — أخو المستعلي بالله العبيدي الذي تنسب إليه الدعوة النزارية بقلعة ألموت؛ هرب في أيام أخيه إلى الإسكندرية فبايعه أمنها وساعده قاضيها ابن عمار ومتوليها افتكين، فنازلهم الأفضل أمير الجيوش فبرز له افتكين فهزمه ثم نازلهم ثانياً وظفر بهم ورجع إلى القاهرة بافتكين ونزار فذبح افتكين وبنى على نزار حائطاً فهلك — وذلك في صدر سنة خمس وتسعين وأربعمائة {cite:shadharat-dhahab p. 402}."
  en: "Nizar b. al-Mustansir — al-Musta'li's brother to whom the Nizari da'wa of Alamut is traced; he fled to Alexandria where its security chief, its qadi Ibn Ammar and its mutawalli Iftikin backed him, until al-Afdal besieged them, beat Iftikin in the field, took both to Cairo, beheaded Iftikin and immured Nizar alive — at the opening of 495 {cite:shadharat-dhahab p. 402}."
