  note: "Died of heart problems at Calcutta on 9 December 1932, her fifty-second birthday, shortly after presiding over a session of the Indian Women's Conference: the English article, Banglapedia and Wikidata agree. Her grave at Sodepur, rediscovered through the historian Amalendu De, lies in the campus of Panihati Girls' High School. Calcutta has no museum place entity yet, so no died_in relation is written. The Hijri year (1351) is derived by tabular conversion (9 December 1932 falls in Ramadan 1351)."
