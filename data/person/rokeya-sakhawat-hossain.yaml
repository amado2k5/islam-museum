summary:
  ar: "كاتبة ومربية ومصلحة اجتماعية بنغالية (1880-1932)، رائدة تحرير المرأة في البنغال. منعتها أسرتها من المدرسة فتعلّمت البنغالية والإنجليزية في البيت، وكتبت «حلم سلطانة» (1905) و«أبارودباسيني» (1931) نقدا لنظام الحجاب الصارم، وأسست بعد وفاة زوجها مدرسة سخاوات التذكارية للبنات في كلكتا وأدارتها حتى وفاتها، وأسست سنة 1916 جمعية نساء الإسلام ⁦(أنجمن خواتين إسلام)⁩ لتعليم النساء وتشغيلهن."
  en: "Bengali writer, educator and social reformer (1880–1932), a pioneer of women's liberation in Bengal. Barred from school, she learnt Bengali and English at home; she wrote Sultana's Dream (1905) and Abarodhbasini (1931), her critique of extreme purdah, founded the Sakhawat Memorial Girls' School at Calcutta after her husband's death and ran it until her own death, and in 1916 founded the Anjuman-e-Khawateen-e-Islam (Muslim Women's Association) for women's education and employment."
  ur: "بنگالی مصنفہ، ماہرِ تعلیم اور سماجی مصلح ⁦(1880ء–1932ء)⁩، بنگال میں خواتین کی آزادی کی پیش رو۔ اسکول سے روکے جانے پر انھوں نے گھر پر بنگلہ اور انگریزی سیکھی؛ «سلطاناز ڈریم» ⁦(1905ء)⁩ اور «ابارودھ باسنی» ⁦(1931ء)⁩ لکھیں، شوہر کی وفات کے بعد کلکتہ میں سخاوت میموریل گرلز اسکول قائم کیا اور وفات تک چلایا، اور 1916ء میں انجمنِ خواتینِ اسلام قائم کی۔"
  es: "Escritora, educadora y reformadora social bengalí (1880-1932), pionera de la liberación femenina en Bengala. Excluida de la escuela, aprendió bengalí e inglés en casa; escribió El sueño de Sultana (1905) y Abarodhbasini (1931), su crítica al purdah extremo; fundó la Escuela para Niñas Sakhawat Memorial en Calcuta tras la muerte de su marido y la dirigió hasta su propia muerte; y en 1916 fundó la Anjuman-e-Khawateen-e-Islam (Asociación de Mujeres Musulmanas) para la educación y el empleo de las mujeres."
  fr: "Écrivaine, éducatrice et réformatrice sociale bengalie (1880-1932), pionnière de l'émancipation des femmes au Bengale. Exclue de l'école, elle apprit le bengali et l'anglais à la maison; elle écrivit Sultana's Dream (1905) et Abarodhbasini (1931), sa critique du purdah extrême, fonda la Sakhawat Memorial Girls' School à Calcutta après la mort de son mari et la dirigea jusqu'à son propre décès, et en 1916 fonda l'Anjuman-e-Khawateen-e-Islam (Association des femmes musulmanes) pour l'éducation et l'emploi des femmes."
  tr: "Bengalli bir yazar, eğitimci ve sosyal aktivist (1880-1932), Bengal'de kadınların özgürleşmesinde öncü. Ailesi okula gitmesini engellediği için evde Bengalce ve İngilizce öğrendi. \"Sultana'nın Rüyası\" (1905) ve \"Aparudbasini\" (1931) adlı eserlerini yazarak katı başörtüsü sistemini eleştirdi. Eşinin ölümünden sonra Kalküta'da Sakhawat Kız Anı Okulu'nu kurdu ve ölümüne kadar yönetti. 1916'da kadınları eğitmek ve istihdam etmek amacıyla İslam Kadınları Derneği'ni (Anjman Khawateen Islam) kurdu."
  id: "Seorang penulis, pendidik, dan aktivis sosial Bengali (1880-1932), pelopor pembebasan perempuan di Bengal. Keluarganya menghalanginya untuk sekolah, sehingga ia belajar bahasa Bengali dan Inggris di rumah. Ia menulis \"Mimpi Sultana\" (1905) dan \"Aparudbasini\" (1931) yang mengkritik sistem hijab yang ketat. Setelah kematian suaminya, ia mendirikan Sekolah Peringatan Sakhawat untuk Anak Perempuan di Kalkuta dan mengelolanya hingga wafat. Pada tahun 1916, ia mendirikan Asosiasi Perempuan Islam (Anjman Khawateen Islam) untuk mendidik dan mempekerjakan perempuan."
