summary:
  ar: "كاتبة ومربية ومصلحة اجتماعية بنغالية (1880-1932)، رائدة تحرير المرأة في البنغال. منعتها أسرتها من المدرسة فتعلّمت البنغالية والإنجليزية في البيت، وكتبت «حلم سلطانة» (1905) و«أبارودباسيني» (1931) نقدا لنظام الحجاب الصارم، وأسست بعد وفاة زوجها مدرسة سخاوات التذكارية للبنات في كلكتا وأدارتها حتى وفاتها، وأسست سنة 1916 جمعية نساء الإسلام (أنجمن خواتين إسلام) لتعليم النساء وتشغيلهن."
  en: "Bengali writer, educator and social reformer (1880–1932), a pioneer of women's liberation in Bengal. Barred from school, she learnt Bengali and English at home; she wrote Sultana's Dream (1905) and Abarodhbasini (1931), her critique of extreme purdah, founded the Sakhawat Memorial Girls' School at Calcutta after her husband's death and ran it until her own death, and in 1916 founded the Anjuman-e-Khawateen-e-Islam (Muslim Women's Association) for women's education and employment."
  ur: "بنگالی مصنفہ، ماہرِ تعلیم اور سماجی مصلح (1880ء–1932ء)، بنگال میں خواتین کی آزادی کی پیش رو۔ اسکول سے روکے جانے پر انھوں نے گھر پر بنگلہ اور انگریزی سیکھی؛ «سلطاناز ڈریم» (1905ء) اور «ابارودھ باسنی» (1931ء) لکھیں، شوہر کی وفات کے بعد کلکتہ میں سخاوت میموریل گرلز اسکول قائم کیا اور وفات تک چلایا، اور 1916ء میں انجمنِ خواتینِ اسلام قائم کی۔"
