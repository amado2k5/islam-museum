summary:
  ar: "داعية مصري وُلد في القاهرة سنة 1978، خرّيج كلية التجارة بجامعة عين شمس ومعهد إعداد الدعاة بوزارة الأوقاف، أعدّ وقدّم بحسب ويكيبيديا العربية أكثر من خمسين برنامجًا تلفزيونيًّا وإذاعيًّا منذ 2003 على قنوات منها اقرأ والنهار وأون؛ ويحفظ له أرشيف أسابيل ثلاث سلاسل رمضانية، منها «عيش اللحظة» عن لحظات الحياة الكبرى وأسماء الله الحسنى، و«هدايا الرحمن» عن الأعمال اليسيرة ذات الأجر الكبير."
  en: "Egyptian preacher born in Cairo in 1978, a graduate of the Faculty of Commerce at Ain Shams University and of the preachers' institute of the Ministry of Awqaf, who according to the Arabic Wikipedia has prepared and presented more than fifty television and radio programmes since 2003, on channels including Iqraa, al-Nahar and ON; the Assabile archive keeps three of his Ramadan series, among them 'Ish al-Lahza' ('Live the Moment'), on life's great moments and the divine names, and 'Hadaya al-Rahman' ('Gifts of the Merciful'), on small deeds with great reward."
  ur: "مصری داعی، 1978 میں قاہرہ میں پیدا ہوئے، جامعہ عین شمس کے کلیۂ تجارت اور وزارتِ اوقاف کے ادارۂ تیاریِ دعاۃ کے فارغ التحصیل، جنہوں نے عربی ویکیپیڈیا کے مطابق 2003 سے اقرأ، النہار اور اون جیسے چینلوں پر پچاس سے زیادہ ٹیلی وژن اور ریڈیو پروگرام تیار کیے اور پیش کیے؛ اسابیل آرکائیو میں ان کے تین رمضانی سلسلے محفوظ ہیں، جن میں «عیش اللحظہ» ⁦(زندگی کے بڑے لمحات اور اسمائے حسنیٰ پر)⁩ اور «ہدایا الرحمن» ⁦(بڑے اجر والے چھوٹے اعمال پر)⁩ شامل ہیں۔"
