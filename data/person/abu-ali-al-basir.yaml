label: { ar: "أبو علي البصير", en: "Abu 'Ali al-Basir", fr: "Abu 'Ali al-Basir", es: "Abu 'Ali al-Basir", ur: "ابو علی البصیر" }
summary:
  ar: "شاعر من أطبع الناس في زمانه لا يزال يأتي بالبيت النادر والمثل السائر، وهو فوق نظرائه في وقته ودون البحتري، هجا سعيد بن حميد رأس من يدعي البلاغة مني ومن الناس كلهم في حر أمي {cite:muruj-al-dhahab p. 529-530}."
  en: "The 'most naturally gifted poet of his time' — below al-Buhturi but above his peers, Sa'id ibn Humayd's satirist {cite:muruj-al-dhahab p. 529-530}."
  fr: "Le « poète le plus naturellement doué de son temps » — inférieur à al-Buhturi mais supérieur à ses pairs, satiriste de Sa'id ibn Humayd {cite:muruj-al-dhahab p. 529-530}."
  es: "El \"poeta más talentoso de su tiempo\" —por debajo de al-Buhturi pero por encima de sus compañeros, el satírico de Sa'id ibn Humayd {cite:muruj-al-dhahab p. 529-530}."
  ur: "'اپنے زمانے کا سب سے فطری طور پر باصلاحیت شاعر' - البطوری کے نیچے لیکن اپنے ہم عصروں سے اوپر، سعید بن حمید کا طنز نگار {حوالہ: مروج الذہب ص۔ 529-530}۔"
  tr: "Döneminin en güzel sözlü insanlarından biri olan şair, hâlâ nadir bulunan dizeler ve özdeyişler ortaya koymaktadır. Döneminin akranlarından üstün, El-Buhturi'den ise aşağıdadır. Said bin Hamid, \"Annemin tebessümüyle benden ve bütün insanlardan belagat iddiasında bulunanın\" başını hicvetmiştir. {Kaynak: Muruj-al-Dhahab s. 529-530}"
  id: "Seorang penyair yang merupakan salah satu orang paling fasih pada zamannya, ia masih menghasilkan syair dan peribahasa yang langka. Ia berada di atas rekan-rekannya pada zamannya dan di bawah Al-Buhturi. Saeed bin Hamid menyindir kepala orang yang mengklaim kefasihan dariku dan semua orang dalam kemarahan ibuku {kutip:muruj-al-dhahab hlm. 529-530}."
