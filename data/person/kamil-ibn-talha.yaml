roles: [muhaddith]
gender: male
summary:
  ar: "كامل بن طلحة الجحدري البصري، أبو يحيى، محدث نزل بغداد وعدّه الذهبي صدوقاً شيخ البصرة في وقته؛ اختلف فيه النقاد بين توثيق أحمد بن حنبل وقول ابن معين فيه ليس بشيء، وتوفي سنة 231 هـ."
  en: "Kamil ibn Talha al-Jahdari al-Basri, Abu Yahya, hadith scholar who settled in Baghdad and whom al-Dhahabi calls truthful and the shaykh of Basra in his time; critics differed, from Ahmad ibn Hanbal's trust to Ibn Ma'in's remark that he was nothing, and he died in 231 AH."
  es: "Kamil ibn Talha al-Jahdari al-Basri, Abu Yahya, erudito de hadices que se estableció en Bagdad y a quien al-Dhahabi llama veraz y shaykh de Basora en su tiempo; los críticos discreparon, desde la confianza de Ahmad ibn Hanbal hasta el comentario de Ibn Ma'in de que no era nada, y murió en el año 231 AH."
  fr: "Kamil ibn Talha al-Jahdari al-Basri, Abu Yahya, érudit du hadith qui s'est installé à Bagdad et qu'al-Dhahabi qualifie de véridique et de cheikh de Bassora à son époque; les critiques ont divergé, allant de la confiance d'Ahmad ibn Hanbal à la remarque d'Ibn Ma'in selon laquelle il n'était rien, et il est mort en 231 AH."
  ur: "کامل بن طلحہ الجہدری البصری، ابو یحییٰ، حدیث کے اسکالر جو بغداد میں مقیم تھے اور جنہیں الذہبی اپنے زمانے میں صادق اور بصرہ کا شیخ کہتے ہیں؛ احمد بن حنبل کے اعتماد سے لے کر ابن معین کے اس قول تک کہ وہ کچھ نہیں تھے، ناقدین نے اختلاف کیا، اور ان کی وفات 231 ہجری میں ہوئی۔"
  tr: "Kamil ibn Talha al-Jahdari al-Basri, Ebu Yahya, Bağdat'ta yaşamış bir hadis âlimiydi ve el-Dhahabi'yi kendi döneminde Basra Şeyhi olarak doğru kabul ederdi; eleştirmenler, Ahmed ibn Hanbal'ın doğruluğu ile İbn Ma'in'in geçersiz olduğu görüşü arasında farklı görüşler sergiledi ve 231 H yılında öldü."
  id: "Kamil ibn Talha al-Jahdari al-Basri, Abu Yahya, adalah seorang ulama hadis yang tinggal di Baghdad dan menganggap al-Dhahabi sebagai Syaikh Basra pada masanya; para kritikus berbeda pendapat antara pengesahan Ahmad ibn Hanbal dan pandangan Ibn Ma'in bahwa itu tidak sah, dan ia meninggal pada tahun 231 H."
