id: person/ubayd-allah-al-mahdi
class: person
label:
  ar: عبيد الله المهدي
summary:
  ar: جد بني عبيد خلفاء المصريين، ظهرت دعوته باليمن سنة سبعين وأقام على ذلك إلى سنة ثمان وسبعين فحج تلك السنة واجتمع بقبيلة
    من كتامة فأعجبهم حاله فصحبهم إلى المغرب فكان ذلك أول شأن المهدي {cite:tarikh-khulafa-minhaj-1434 p. 568}، ومات في أيام
    الراضي وكانت أيامه خمساً وعشرين سنة وهو جد خلفاء المصريين الذين يسمونهم الجهلة بالفاطميين، وقام بالأمر بعده ابنه القائم
    بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 603}. وفي حكاية ابن رزام عند ابن النديم أنه سعيد بن الحسين بن عبد الله بن
    ميمون وكان الحسين مات في حياة أبيه ولم يزل عبد الله وولده بعد خروجهم من البصرة يدعون أنهم من ولد عقيل وكانوا قد أحكموا
    النسب بالبصرة، ثم خرج إلى مصر فادعى أنه علوي فاطمي وتسمى بعبيد الله وعاشر النواصي ووجوه أصحاب السلطان وتخوض في الأموال
    وبلغ خبره المعتضد فكتب في القبض عليه فهرب إلى المغرب وقد كانت دعاته هناك قد غلبت على طائفتين من البربر فوطأ لنفسه ذلك
    البلد {cite:fihrist-ibn-al-nadim p. 265}، وعند ابن الأثير اختلف العلماء في صحة نسبه فقيل هو محمد بن عبد الله بن ميمون
    بن محمد بن إسماعيل بن جعفر بن محمد بن علي بن الحسين بن علي بن أبي طالب وقيل هو عبيد الله بن أحمد بن إسماعيل الثاني، ونسبه
    من ينسبه إلى عبد الله بن ميمون القداح الذي تُنسب إليه القداحية {cite:kamil-ibn-al-athir p. 19}، وعند ابن خلدون وهاجر بعد
    موت أبيه محمد الحبيب في زي التجار فطلبه المكتفي ومر بمصر وعلىها عيسى النوشري فاعتذر له عن المؤاكلة بالصوم ثم أمتحته فلم
    تشهد له أحواله بشيء حتى دل عليه سؤال ابنه أبي القاسم عن كلب صيد ضاع له فعلم أن هذه الدالة في طلب الضائع منافية للرقبة
    والخوف فخلى سبيله، ثم سار إلى سجلماسة وبها إليشع بن مدرار فأكرمه ثم جاءه كتاب زيادة الله فحبسه حتى لما ملك أبو عبد الله
    الشيعي أفريقية سار إليه فأخرجه وابنه أبا القاسم وأركبهما ومشى مع رؤساء القبائل بين يديهما وهو يقول هذا مولاكم ويبكي من
    شدة الفرح، واستولى على ملك بني الأغلب بإفريقية وتلقب بالمهدي أمير المؤمنين {cite:tarikh-ibn-khaldun-ibar p. 802-803}
  en: Forefather of the Ubaydid caliphs of Egypt; his da'wa appeared in Yemen in 270 and held till 278, when he hajj'd and
    met a band of Kutama — they liked his state, he went with them to the Maghreb, the Mahdi's first affair {cite:tarikh-khulafa-minhaj-1434
    p. 568}.
  es: "Antepasado de los califas Ubaydíes de Egipto; su da'wa apareció en Yemen en 270 y se mantuvo hasta 278, cuando realizó el Hajj y conoció a un grupo de Kutama; les gustó su estado, y fue con ellos al Magreb, el primer encuentro del Mahdi {cite:tarikh-khulafa-minhaj-1434 p. 568}."
  fr: "Ancêtre des califes Ubaydides d'Égypte; sa da'wa est apparue au Yémen en 270 et s'est maintenue jusqu'en 278, date à laquelle il a fait le hajj et rencontré un groupe de Kutama — ils ont aimé son État, il est allé avec eux au Maghreb, la première affaire du Mahdi {cite:tarikh-khulafa-minhaj-1434 p. 568}."
  ur: "مصر کے عبیدیت خلفاء کے جد امجد؛ اس کی دعوت 270 میں یمن میں ظاہر ہوئی اور 278 تک جاری رہی، جب اس نے حج کیا اور کوٹامہ کے ایک گروہ سے ملاقات کی - انہیں اس کی ریاست پسند آئی، وہ ان کے ساتھ مغرب میں گئے، جو مہدی کا پہلا معاملہ تھا۔ 568}۔"
  tr: "O, Mısırlıların halifeleri Banu Ubeyd'in atasıydı. Görevi 70 Hicri yılında Yemen'de ortaya çıktı ve yetmiş sekizinci yıla kadar orada kaldı. O yıl Hac yaptı ve Katama'dan bir kabileyle görüştü; bu kabileler durumunu takdir etti ve onları Mağrip'e kadar eşlik etti. Bu, Mehdi'nin ilk atamasıydı {atıf:Tarih-Külefe minhaj-1434 s. 568}. Yirmi beş yaşındaki el-Radi'nin günlerinde öldü. O, cahillerin Fatimiler dediği Mısırlı halifelerin atasıydı. Yerine oğlu el-Kaim bi-Amr Allah geçti {cite:History-Khulafa-minhaj-1434, s. 603}. İbn Razam'ın İbn el-Nadim ile olan hikayesinde, Seyid ibn el-Hüseyin ibn Abdullah ibn Maymun'dur. Hüseyin, babasının yaşamı sırasında öldü. Abdullah ve oğulları, Basra'dan ayrıldıktan sonra kendilerini Aqil'in soyundan geldiklerini ve Basra'da soy kurduklarını iddia ettiler. Sonra Mısır'a giderek kendini Ubeyd Allah adında bir Alevi Fatımi olarak tanıttı, Nawasi ve önde gelen yöneticilerle ilişki kurdu ve mali anlaşmazlıklara girdi. Al-Mu'tadid onu duydu ve tutuklandığını yazdı, bu yüzden misyonerlerinin zaten bulunduğu Fas'a kaçtı İki Berber grubuna hakim olduğundan, o topraklara ayak bastı {atıf:Fihrist-ibn-al-nadim s. 265}. İbn el-Athir'e göre, alimler soyunun doğruluğu konusunda farklı görüşlere sahiptir; kendisinin Muhammed ibn Abdullah ibn Maymun ibn Muhammed ibn İsmail ibn Ca'far ibn Muhammed ibn Ali ibn el-Hüseyin ibn Ali ibn Ebi Talib olduğu söylenir ve kendisinin Ubeyd Allah ibn Ahmed ibn İsmail II olduğu söylenir. Soyu, Kadahiya da ona atfedilen Abdullah ibn Maymun al-Kaddah'a atfedilir {atıf: Kamil ibn al-Athir s. 19} ve babası Muhammed el-Habib'in ölümünden sonra tüccar kılığında göç eden İbn Haldun ile birlikte. El-Muktafi onu aradı ve Mısır ile İsa el-Nushari'den geçti, oruç tutmadığı için özür diledi. Sonra durumuna tanıklık edildi, ancak durumu hiçbir şeye tanıklık etmedi, ta ki oğlu Ebu el-Kasim kayıp bir av köpeği hakkında soru sorana kadar. Kayıpları aramanın vicdan ve korkuya aykırı olduğunu anladı ve serbest bırakıldı. Sonra Elişa ibn Medrar'ın bulunduğu Sijilmasa'ya gitti ve onu onurlandırdı. Sonra Ziyad Allah'tan bir mektup geldi ve onu hapsetti Ebu Abdullah el-Şii İfrikiye'yi yönettiğinde, ona gidip oğlu Ebu el-Kasim ile birlikte onları sürdü ve aşiret liderleriyle birlikte yürüyerek, 'Bu sizin efendinizdir' diyerek büyük sevinçle ağladı. İfrikiye'de Banu Aghlab krallığını ele geçirdi ve 'Al-Mehdi, Müminlerin Komutanı' unvanını aldı {atıf: Tarikh-ibn-khaldun-ibar s. 802-803}"
  id: "Ia adalah leluhur Banu Ubayd, khalifah Mesir. Misinya muncul di Yaman pada tahun tujuh puluh H, dan ia tinggal di sana hingga tahun tujuh puluh delapan. Pada tahun itu, ia melaksanakan Haji dan bertemu dengan suku dari Katama, yang mengagumi keadaannya dan menemani mereka ke Maghreb. Ini adalah penunjukan pertama Mahdi {cite:History-Khulafa-minhaj-1434 hlm. 568}. Ia meninggal pada masa al-Radi, yang berusia dua puluh lima tahun. Ia adalah leluhur para khalifah Mesir, yang oleh orang bodoh disebut sebagai Fatimiyah. Ia digantikan oleh putranya al-Qa'im bi-Amr Allah {cite:History-Khulafa-minhaj-1434, hlm. 603}. Dalam kisah Ibn Razam bersama Ibn al-Nadim, ia adalah Sa'id ibn al-Husayn ibn Abdullah ibn Maymun. Husayn meninggal saat ayahnya masih hidup. Abdullah dan putra-putranya, setelah meninggalkan Basra, mengaku sebagai keturunan Aqil dan telah menetap garis keturunan di Basra. Kemudian ia pergi ke Mesir, mengaku sebagai seorang Alawit Fatimid bernama Ubayd Allah, dan ia bergaul dengan Nawasi serta penguasa terkemuka serta terlibat dalam perselisihan keuangan. Al-Mu'tadid mendengar tentang dirinya dan menulis tentang penangkapannya, sehingga ia melarikan diri ke Maroko, di mana para misionarisnya sudah melarikan diri Wilayah ini mendominasi dua kelompok Berber, sehingga ia menginjakkan kaki di tanah itu {cite:fihrist-ibn-al-nadim hlm. 265}. Menurut Ibn al-Athir, para ulama berbeda pendapat mengenai keaslian garis keturunannya; dikatakan bahwa ia adalah Muhammad ibn Abdullah ibn Maymun ibn Muhammad ibn Ismail ibn Ja'far ibn Muhammad ibn Ali ibn al-Husayn ibn Ali ibn Abi Talib, dan dikatakan bahwa ia adalah Ubayd Allah ibn Ahmad ibn Ismail II. Garis keturunannya dikaitkan dengan Abdullah ibn Maymun al-Qaddah, yang menjadi milik Qadahiya {cite: kamil-ibn-al-athir hlm. 19} dan bersama Ibn Khaldun, yang bermigrasi setelah kematian ayahnya Muhammad al-Habib dengan menyamar sebagai pedagang. Al-Muktafi mencarinya dan melewati Mesir serta Isa al-Nushari, yang meminta maaf kepadanya karena tidak berpuasa. Kemudian dia disahkan tentang kondisinya, tetapi kondisinya tidak membuktikan apa pun sampai putranya Abu al-Qasim mengajukan pertanyaan tentang anjing pemburu yang hilang. Dia menyadari bahwa tanda mencari yang hilang ini bertentangan dengan hati nurani dan ketakutan, sehingga dia dibebaskan. Kemudian dia pergi ke Sijilmasa, di mana Elisha ibn Madrar hadir, dan menghormatinya. Kemudian surat dari Ziad Allah datang kepadanya, dan dia memenjarakannya sampai Ketika Abu Abdullah al-Shi'i memerintah Ifriqiya, ia mendekatinya, membawanya keluar bersama putranya Abu al-Qasim, menunggang mereka, dan berjalan bersama para pemimpin suku di hadapan mereka, sambil berkata, 'Ini tuanmu,' sambil menangis dengan sukacita besar. Ia merebut kerajaan Banu Aghlab di Ifriqiya dan diberi gelar 'Al-Mahdi, Panglima Orang Beriman' {cite:Tarikh-ibn-khaldun-ibar hlm. 802-803}"
