class: person
label: { ar: "عبيد الله المهدي" }
summary:
  ar: "جد بني عبيد خلفاء المصريين، ظهرت دعوته باليمن سنة سبعين وأقام على ذلك إلى سنة ثمان وسبعين فحج تلك السنة واجتمع بقبيلة من كتامة فأعجبهم حاله فصحبهم إلى المغرب فكان ذلك أول شأن المهدي {cite:tarikh-khulafa-minhaj-1434 p. 568}، ومات في أيام الراضي وكانت أيامه خمساً وعشرين سنة وهو جد خلفاء المصريين الذين يسمونهم الجهلة بالفاطميين، وقام بالأمر بعده ابنه القائم بأمر الله {cite:tarikh-khulafa-minhaj-1434 p. 603}.، وفي حكاية ابن رزام عند ابن النديم أنه سعيد بن الحسين بن عبد الله بن ميمون وكان الحسين مات في حياة أبيه ولم يزل عبد الله وولده بعد خروجهم من البصرة يدعون أنهم من ولد عقيل وكانوا قد أحكموا النسب بالبصرة، ثم خرج إلى مصر فادعى أنه علوي فاطمي وتسمى بعبيد الله وعاشر النواصي ووجوه أصحاب السلطان وتخوض في الأموال وبلغ خبره المعتضد فكتب في القبض عليه فهرب إلى المغرب وقد كانت دعاته هناك قد غلبت على طائفتين من البربر فوطأ لنفسه ذلك البلد {cite:fihrist-ibn-al-nadim p. 265}، وعند ابن الأثير اختلف العلماء في صحة نسبه فقيل هو محمد بن عبد الله بن ميمون بن محمد بن إسماعيل بن جعفر بن محمد بن علي بن الحسين بن علي بن أبي طالب وقيل هو عبيد الله بن أحمد بن إسماعيل الثاني، ونسبه من ينسبه إلى عبد الله بن ميمون القداح الذي تُنسب إليه القداحية {cite:kamil-ibn-al-athir p. 19}، وعند ابن خلدون وهاجر بعد موت أبيه محمد الحبيب في زي التجار فطلبه المكتفي ومر بمصر وعلىها عيسى النوشري فاعتذر له عن المؤاكلة بالصوم ثم أمتحته فلم تشهد له أحواله بشيء حتى دل عليه سؤال ابنه أبي القاسم عن كلب صيد ضاع له فعلم أن هذه الدالة في طلب الضائع منافية للرقبة والخوف فخلى سبيله، ثم سار إلى سجلماسة وبها إليشع بن مدرار فأكرمه ثم جاءه كتاب زيادة الله فحبسه حتى لما ملك أبو عبد الله الشيعي أفريقية سار إليه فأخرجه وابنه أبا القاسم وأركبهما ومشى مع رؤساء القبائل بين يديهما وهو يقول هذا مولاكم ويبكي من شدة الفرح، واستولى على ملك بني الأغلب بإفريقية وتلقب بالمهدي أمير المؤمنين {cite:tarikh-ibn-khaldun-ibar p. 802-803}"
  en: "Forefather of the Ubaydid caliphs of Egypt; his da'wa appeared in Yemen in 270 and held till 278, when he hajj'd and met a band of Kutama — they liked his state, he went with them to the Maghreb, the Mahdi's first affair {cite:tarikh-khulafa-minhaj-1434 p. 568}."
