summary:
  ar: "سيف الدين البكتمري القاهري الحنفي النحوي؛ قال السيوطي في حسن المحاضرة وطبقات النحاة شيخنا الإمام العلامة ولد تقريباً على رأس ثمانمائة وأخذ عن السراج قارئ الهداية والزين التفهني ولزم العلامة كمال الدين بن الهمام وانتفع به وبرع في الفقه والأصول والنحو وغير ذلك وكان شيخه ابن الهمام يقول عنده محقق الديار المصرية مع ما هو عليه من سلوك طريق السلف والعبادة والخير وعدم التردد إلى أبناء الدنيا، واستنابه ابن الهمام في مشيخة الشيخونية لما حج أول مرة وولي مشيخة مدرسة زين الدين الأستادار ثم درس التفسير بالمنصورية والفقه بالأشرفية العتيقة وسئل تدريس الحديث في مدرسة العيني فامتنع مع الإلحاح عليه وله حاشية مطولة على توضيح ابن هشام كثيرة الفوائد، توفي يوم الثلاثاء ثاني عشري ذي القعدة وهو آخر شيوخ السيوطي موتاً لم يتأخر بعده أحد ممن أخذ عنه العلم إلا رجل قرأ عليه ورقات المنهاج وأرثاه السيوطي بالقصيدة {cite:shadharat-dhahab p. 332-333}."
  en: "Al-Baktmari (b. ~800) — Ibn al-Humam's deputy at the Shaykhuniyya, called by him 'the muhaqqiq of the Egyptian lands'; refused the 'Ayni-madrasa hadith chair; al-Suyuti's last surviving shaykh, elegised in a famous qasida; died Tuesday 12 Dhu'l-Qa'da (~883) {cite:shadharat-dhahab p. 332-333}."
  es: "Al-Baktmari (n. ~800): diputado de Ibn al-Humam en Shaykhuniyya, llamado por él 'el muhaqqiq de las tierras egipcias'; rechazó la silla del hadiz 'Ayni-madrasa; el último shaykh superviviente de al-Suyuti, elegido en una famosa qasida; murió el martes 12 Dhu'l-Qa'da (~883) {cita:shadharat-dhahab p. 332-333}."
  fr: "Al-Baktmari (né ~ 800) — adjoint d'Ibn al-Humam à la Shaykhuniyya, appelé par lui « le muhaqqiq des terres égyptiennes »; refusé la chaire de hadith 'Ayni-madrasa; le dernier shaykh survivant d'al-Suyuti, élégié dans une célèbre qasida; décédé mardi 12 Dhu'l-Qa'da (~ 883) {cite: shadharat-dhahab p. 332-333}."
  ur: "البکتماری ⁦(پیدائش ~ 800)⁩ - شیخونیہ میں ابن الہمام کا نائب، جسے وہ 'مصری سرزمین کا محقق' کہتے تھے۔ 'عینی مدرسہ حدیث کی کرسی' سے انکار کیا؛ السیوطی کے آخری زندہ رہنے والے شیخ، مشہور قصیدہ میں مقیم؛ وفات بروز منگل 12 ذوالقعدہ (~883) 332-333}۔"
  tr: "Seyf-ed-Din el-Baktamri el-Kahri el-Hanefi el-Nehvi; El-Suyuti Hasan el-Muhadara ve Tabakat el-Nuhawāt'ta şöyle demiştir: Şeyhimiz, seçkin imam, yaklaşık sekiz yüz yaşında doğdu ve el-Siraj'ın yanında eğitim aldı, el-Hidaya ve el-Zeyn el-Tefahani'yi okudu. Âlim Kamaleddin bin Hummam'a bağlı kaldı, ondan faydalandı, fıkâh, ilkeler, dilbilgisi ve diğer alanlarda üstün oldu. Öğretmeni İbn el-Humam, seleflerinin yoluna bağlı kalmasına rağmen, Mısır topraklarının araştırmacısı olarak kullandı; ibn el-Humam, Hac sırasında onu Şeyhuniyye şeyhdiliğinde vekil olarak atadı. İlk kez Zeynetdin el-Ustadar okulunun şeyhdimi olarak atandı, ardından Mansuriyye'de Tefsir, eski Ashrafiyye'de fıkıh eğitimi aldı. El-Eyni okulunda hadis öğretmesi istendi, ancak ısrarına rağmen reddetti. İbn Hisham'ın açıklaması üzerine uzun bir kenar notu var, bu çok faydalıdır. Zuld-Kı'dah'ın on ikinci Salı günü vefat etti ve el-Süyütü'nin son öğretmeniydi. Ondan öğrenen kimse uzun süre sonra ölmedi, sadece Minhaj sayfalarını okuyan bir adam ve el-Suyuti ona şiiri miras bıraktı {atıf:şadharat-dhahab, s. 332-333}."
  id: "Saif al-Din al-Baktamri al-Qahiri al-Hanafi al-Nahwi; Al-Suyuti berkata dalam Hasan al-Muhadara wa Tabaqat al-Nuhawāt: Sheikh kita, Imam terkemuka, lahir sekitar usia delapan ratus tahun, dan ia belajar di bawah al-Siraj, membaca al-Hidaya dan al-Zayn al-Tafahani. Ia berpegang pada ulama Kamal al-Din ibn al-Hummam, mendapat manfaat darinya, unggul dalam bidang hukum, prinsip, tata bahasa, dan bidang lainnya. Gurunya Ibn al-Humam menggunakannya sebagai peneliti tanah Mesir, meskipun ia setia pada jalan para pendahulu, ibadah, kebaikan, dan tidak ragu kepada rakyat dunia. Ibn al-Humam mengangkatnya sebagai wakil Sheikhuniyya sheikhdom saat ia melaksanakan Haji. Untuk pertama kalinya, ia diangkat sebagai sheikhdom mazhab Zain al-Din al-Udtakar, kemudian belajar Tafsir di Mansuriyya dan fiqh. Ia diminta mengajar hadits di mazhab Al-Ayni, tetapi menolak meskipun ia bersikeras. Ia memiliki catatan panjang di pinggir penjelasan Ibn Hisham, yang sangat bermanfaat. Ia meninggal pada hari Selasa, tanggal dua belas Dhu al-Qi'dah, dan ia adalah guru terakhir al-Suyuti. Tidak ada yang belajar darinya yang meninggal lama setelahnya kecuali seorang yang membaca halaman Minhaj, dan al-Suyuti mewariskan puisi {cite:shadharat-dhahab, hlm. 332-333}."
