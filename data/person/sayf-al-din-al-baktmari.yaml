gender: male
summary:
  ar: "سيف الدين البكتمري القاهري الحنفي النحوي؛ قال السيوطي في حسن المحاضرة وطبقات النحاة شيخنا الإمام العلامة ولد تقريباً على رأس ثمانمائة وأخذ عن السراج قارئ الهداية والزين التفهني ولزم العلامة كمال الدين بن الهمام وانتفع به وبرع في الفقه والأصول والنحو وغير ذلك وكان شيخه ابن الهمام يقول عنده محقق الديار المصرية مع ما هو عليه من سلوك طريق السلف والعبادة والخير وعدم التردد إلى أبناء الدنيا، واستنابه ابن الهمام في مشيخة الشيخونية لما حج أول مرة وولي مشيخة مدرسة زين الدين الأستادار ثم درس التفسير بالمنصورية والفقه بالأشرفية العتيقة وسئل تدريس الحديث في مدرسة العيني فامتنع مع الإلحاح عليه وله حاشية مطولة على توضيح ابن هشام كثيرة الفوائد، توفي يوم الثلاثاء ثاني عشري ذي القعدة وهو آخر شيوخ السيوطي موتاً لم يتأخر بعده أحد ممن أخذ عنه العلم إلا رجل قرأ عليه ورقات المنهاج وأرثاه السيوطي بالقصيدة {cite:shadharat-dhahab p. 332-333}."
  en: "Al-Baktmari (b. ~800) — Ibn al-Humam's deputy at the Shaykhuniyya, called by him 'the muhaqqiq of the Egyptian lands'; refused the 'Ayni-madrasa hadith chair; al-Suyuti's last surviving shaykh, elegised in a famous qasida; died Tuesday 12 Dhu'l-Qa'da (~883) {cite:shadharat-dhahab p. 332-333}."
