summary:
  ar: "جمال عبد الناصر (15 يناير 1918 – 28 سبتمبر 1970)، ضابط وسياسي مصري قاد تنظيم الضباط الأحرار وثورة يوليو 1952، وتولى رئاسة مصر فأمّم قناة السويس سنة 1956 وواجه العدوان الثلاثي، وأقام الوحدة مع سوريا (1958–1961)، وقاد مشروعا اشتراكيا قوميا عربيا، وخسر حرب 1967 فاستقال ثم عاد بضغط شعبي، وتوفي بنوبة قلبية في ختام قمة عربية سنة 1970، فشيّعه ملايين المصريين ودُفن في مسجده بالقاهرة."
  en: "Gamal Abdel Nasser (15 January 1918 – 28 September 1970) was an Egyptian officer and politician who led the Free Officers and the July 1952 revolution and ruled Egypt as its second president. He nationalized the Suez Canal in 1956 and faced down the Tripartite Aggression, formed the United Arab Republic with Syria (1958–61), led an Arab nationalist and socialist project, lost the 1967 war, resigned and returned under popular pressure, and died of a heart attack at the close of an Arab summit in 1970; millions mourned him in Cairo, where he was buried at his mosque."
  ur: "جمال عبد الناصر (15 جنوری 1918ء – 28 ستمبر 1970ء) مصری افسر اور سیاست دان تھے جنہوں نے فری آفیسرز اور جولائی 1952ء کے انقلاب کی قیادت کی اور مصر کے دوسرے صدر بنے۔ انہوں نے 1956ء میں نہر سوئز کو قومی ملکیت میں لیا، شام کے ساتھ اتحاد (1958ء–1961ء) قائم کیا، 1967ء کی جنگ ہارے، استعفیٰ دیا اور عوامی دباؤ پر واپس آئے، اور 1970ء میں دل کے دورے سے وفات پائی۔"
