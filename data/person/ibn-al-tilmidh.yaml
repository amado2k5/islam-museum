label: { ar: "أمين الدولة ابن التلميذ", en: "Amin al-Dawla Ibn al-Tilmidh" }
died: { edtf: "1165", hijri: "0560", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في صفر سنة ستين وخمسمائة ببغداد وقد ناهز المائة من عمره {cite:wafayat-ayan}." }
summary:
  ar: "أبو الحسن هبة الله بن أبي الغنائم صاعد بن هبة الله المعروف بابن التلميذ النصراني الطبيب البغدادي؛ قال فيه العماد الأصبهاني: سلطان الحكماء، مقصد العالم في علم الطب، بقراط عصره وجالينوس زمانه، ختم به هذا العلم؛ عاش نبيلاً جليلاً طويلاً وكان شيخ النصارى وقسيسهم ورأسهم وله في النظم كلمات رائقة؛ وله في الطب تصانيف منها كتاب «أقراباذين» الذي يعمل به أطباء عصره وكناش وحواشٍ على كليات ابن سينا؛ وكان كثير التواضع؛ وتفرده ابن الأزرق بأنه مات في عيد النصارى ولم يبق ببغداد من الجانبين من لم يحضر البيعة ويشهد جنازته؛ ومن مروءته أن ظهر داره كان يلي المدرسة النظامية فإذا مرض فقيه نقله إليه وقام على مرضه فإذا أبل وهب له دينارين وصرفه {cite:wafayat-ayan}."
  en: "Amin al-Dawla Ibn al-Tilmidh (d. Safar 560, near age 100) — Baghdad's Christian physician-in-chief, head of its Christian community; al-Imad called him 'sultan of the hakims, the seal of medicine'; author of the Aqrabadhin still used by the physicians of his day; famously humble beside his Nizamiyya-adjacent home where he nursed sick fuqaha' {cite:wafayat-ayan}."
