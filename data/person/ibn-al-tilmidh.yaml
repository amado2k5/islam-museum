summary:
  ar: "أبو الحسن هبة الله بن أبي الغنائم صاعد بن هبة الله المعروف بابن التلميذ النصراني الطبيب البغدادي؛ قال فيه العماد الأصبهاني: سلطان الحكماء، مقصد العالم في علم الطب، بقراط عصره وجالينوس زمانه، ختم به هذا العلم؛ عاش نبيلاً جليلاً طويلاً وكان شيخ النصارى وقسيسهم ورأسهم وله في النظم كلمات رائقة؛ وله في الطب تصانيف منها كتاب «أقراباذين» الذي يعمل به أطباء عصره وكناش وحواشٍ على كليات ابن سينا؛ وكان كثير التواضع؛ وتفرده ابن الأزرق بأنه مات في عيد النصارى ولم يبق ببغداد من الجانبين من لم يحضر البيعة ويشهد جنازته؛ ومن مروءته أن ظهر داره كان يلي المدرسة النظامية فإذا مرض فقيه نقله إليه وقام على مرضه فإذا أبل وهب له دينارين وصرفه {cite:wafayat-ayan}."
  en: "Amin al-Dawla Ibn al-Tilmidh (d. Safar 560, near age 100) — Baghdad's Christian physician-in-chief, head of its Christian community; al-Imad called him 'sultan of the hakims, the seal of medicine'; author of the Aqrabadhin still used by the physicians of his day; famously humble beside his Nizamiyya-adjacent home where he nursed sick fuqaha' {cite:wafayat-ayan}."
  es: "Amin al-Dawla Ibn al-Tilmidh (m. Safar 560, cerca de los 100 años) — Médico jefe cristiano de Bagdad, líder de su comunidad cristiana; al-Imad lo llamó 'sultán de los hakims, el sello de la medicina'; autor del Aqrabadhin, todavía utilizado por los médicos de su época; famoso por su humildad junto a su casa adyacente a Nizamiyya, donde cuidaba a los fuqaha enfermos {cite:wafayat-ayan}."
  fr: "Amin al-Dawla Ibn al-Tilmidh (mort en Safar 560, près de 100 ans) — médecin en chef chrétien de Bagdad, chef de sa communauté chrétienne; al-Imad l'appelait « sultan des hakims, le sceau de la médecine »; auteur de l'Aqrabadhin encore utilisé par les médecins de son époque; réputé pour son humilité à côté de sa maison adjacente à Nizamiyya où il soignait les fuqaha' malades {cite:wafayat-ayan}."
  ur: "امین الدولہ ابن التلمذ ⁦(متوفی صفر 560، عمر 100 کے قریب)⁩ - بغداد کا عیسائی طبیب، اس کی عیسائی برادری کا سربراہ؛ عماد نے اسے 'حکیموں کا سلطان، طب کی مہر' کہا۔ اقربادین کے مصنف جو آج بھی اپنے دور کے معالجین کے ذریعہ استعمال ہوتے ہیں۔ اپنے نظامیہ سے متصل گھر کے پاس مشہور طور پر عاجز تھا جہاں اس نے بیمار فقہا کی عیادت کی۔"
  tr: "Hristiyan öğrenci ve Bağdatlı hekimin oğlu olarak bilinen Ebu el-Hasan Hibatullah ibn Abi el-Ghanaim Sa'id bin Hibat Allah onun hakkında şöyle demiştir: 'Bilgelerin sultanı, tıp bilgininin hedefi, döneminin Hipokratı ve Galen, bu bilgiyi onunla mühürlemiştir. O, soylu, onurlu ve uzun bir yaşam sürdü, Hristiyanların yaşlısı, rahibi ve lideriydi ve etkileyici şiirler yazdı. Ayrıca tıp alanında da eserler yazdı, bunlar arasında 'Aqrabidhin' adlı kitap da var, ki bu eserler kendi döneminin hekimleri tarafından kullanılıyordu, ayrıca İbn Sina'nın okulları hakkında defterler ve notlar da vardı. Çok mütevazıydı; İbn el-Azraq, Hristiyan bayramında ölmesiyle benzersizdi ve Bağdat'ta hiçbir tarafta sadakat yemini etmeyen ve cenazesine katılmayan kimse kalmadı. Asil işleri arasında, Nizamiyye okuluna gitmesi ve hastalanırsa bir hukukçu onu yanına götürüp hastalığına bakması vardı. Öldüğünde ona iki dinar verir ve harcardı {atıf:wafayat-ayan}."
  id: "Abu al-Hasan Hibatullah ibn Abi al-Ghanaim Sa'id ibn Hibat Allah, yang dikenal sebagai putra mahasiswa Kristen dan dokter Baghdadi, berkata tentangnya: 'Sultan para bijaksana, tujuan para sarjana dalam bidang kedokteran, Hippocrates pada zamannya dan Galen, yang mengukuhkan pengetahuan ini bersamanya. Ia menjalani kehidupan yang mulia, bermartabat, dan panjang, serta merupakan tua, imam, dan pemimpin umat Kristen, serta menulis puisi-puisi yang fasih. Ia juga menulis karya-karya di bidang kedokteran, termasuk buku 'Aqrabidhin,' yang digunakan oleh para dokter pada zamannya, serta buku catatan dan catatan tentang perguruan tinggi Ibn Sina. Ia sangat rendah hati; Ibn al-Azraq unik karena ia meninggal pada hari raya Kristen, dan tidak ada yang tinggal di Baghdad di kedua sisi yang tidak menghadiri janji kesetiaan dan menghadiri pemakamannya. Di antara perbuatan mulianya adalah ia akan bersekolah di sekolah Nizamiyya, dan jika jatuh sakit, seorang ahli hukum akan membawanya dan merawat penyakitnya. Ketika ia meninggal, ia akan memberinya dua dinar dan menghabiskannya {cite:Wafayat-Ayan}."
