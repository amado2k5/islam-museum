summary:
  ar: "كاتب ومفكر وصحفي ومترجم ودبلوماسي نمساوي-باكستاني، وُلد باسم ليوبولد فايس في لمبرغ سنة 1900 لأسرة يهودية، واعتنق الإسلام السني في برلين سنة 1926، وجاب العالم العربي مراسلًا، وقرّب من الملك عبد العزيز في الحجاز، ثم خدم باكستان الوليدة مديرًا لإدارة الإعمار الإسلامي ومبعوثًا لها إلى الأمم المتحدة. أشهر كتبه «الطريق إلى مكة» (1954) وترجمته وتفسيره للقرآن «رسالة القرآن»."
  en: "Austro-Hungarian-born Pakistani writer, thinker, journalist, translator and diplomat, born Leopold Weiss at Lemberg in 1900 to a Jewish family. He converted to Sunni Islam in Berlin in 1926, travelled the Arab world as a correspondent, was close to King Abdul Aziz in the Hejaz, and served the new state of Pakistan as Director of the Department of Islamic Reconstruction and as its envoy to the United Nations. His best-known books are The Road to Mecca (1954) and his Qur'an translation and commentary, The Message of the Qur'an."
  ur: "آسٹروی۔ہنگری نژاد پاکستانی مصنف، مفکر، صحافی، مترجم اور سفارت کار، جو 1900 میں لمبرگ میں ایک یہودی خاندان میں لیوپولڈ ویز کے نام سے پیدا ہوئے۔ انھوں نے 1926 میں برلن میں اسلام قبول کیا، بطور نامہ نگار عرب دنیا کا سفر کیا، حجاز میں شاہ عبد العزیز کے قریب رہے، پھر نئی مملکت پاکستان کی خدمت بطور ڈائریکٹر محکمہ تعمیرِ نوِ اسلام اور اقوام متحدہ میں پاکستان کے مندوب کی۔ ان کی مشہور کتابیں «دی روڈ ٹو مکہ» (1954) اور ان کا ترجمۂ قرآن و تفسیر «دی میسج آف دی قرآن» ہیں۔"
