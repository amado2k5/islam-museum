label: { ar: "رفيع أبو العالية الرياحي", en: "Rufay' Abu al-Aliya al-Riyahi", es: "Rufay' Abu al-Aliya al-Riyahi", fr: "Rufay' Abu al-Aliya al-Riyahi", ur: "رفیع ابو العالیہ الریحی" }
summary:
  ar: "رفيع أبو العالية الرياحي وهو مولى لامرأة من بني رياح؛ كان مع سعيد بن عثمان حين قطع النهر بجنده فقال رفيع أبو العالية رفعة وعلو."
  en: "Rufay' Abu al-Aliya al-Riyahi, a Riyah woman's mawla; he crossed the river with Sa'id ibn Uthman's army — 'Rufay' Abu al-Aliya: elevation and height'."
  es: "Rufay' Abu al-Aliya al-Riyahi, un mawla de una mujer de Riyah; cruzó el río con el ejército de Sa'id ibn Uthman — 'Rufay' Abu al-Aliya: elevación y altura'."
  fr: "Rufay' Abu al-Aliya al-Riyahi, le mawla d'une femme de Riyah; il a traversé le fleuve avec l'armée de Sa'id ibn Uthman — 'Rufay' Abu al-Aliya: élévation et hauteur'."
  ur: "رفیع ابو العالیہ الریحی، ایک ریا خاتون کا مولا؛ اس نے سعید بن عثمان کے لشکر کے ساتھ دریا کو عبور کیا - 'روفع' ابو العالیہ: بلندی اور اونچائی'۔"
  tr: "Rafi' Abu al-'Aliya al-Riyahi, Banu Riyah'dan bir kadının özgür bıraktığı bir adam, Said bin Osman ile birlikte askeriyle birlikte nehri geçti. Rafi' Abu al-'Aliya, 'Onu kaldır ve dirilt.' dedi."
  id: "Rafi' Abu al-'Aliya al-Riyahi, seorang mantan wanita dari Banu Riyah, bersama Sa'id ibn Uthman saat menyeberangi sungai bersama prajuritnya. Rafi' Abu al-'Aliya berkata, 'Bangkitkan dia dan besarkan dia.'"
