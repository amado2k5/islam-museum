gender: male
roles: [ruler, caliph]
summary:
  ar: "السلطان وحيد الدين محمد السادس، آخر سلاطين الدولة العثمانية؛ وصفه الصلابي بأنه كان قابعاً في الأستانة مستكيناً لما يجري عليه من الذل زمن الاحتلال بعد الحرب العالمية الأولى، ونقلت الصحف عنه إهدار دم مصطفى كمال واعتباره عاصياً متمرداً، وهو ما زاد في سخط الناس عليه مقارنة بكفاح كمال {cite:dawlat-uthmaniyya-salabi p. 468}."
  en: "Mehmed VI Vahdeddin — the last Ottoman sultan, in occupied Istanbul, reported by the press as having declared Mustafa Kemal's blood lawful while the national resistance grew. Al-Salabi also records that the Allies and Greeks took Izmir in 1338 AH with British consent {cite:dawlat-uthmaniyya-salabi p. 468}."
  es: "Mehmed VI Vahdeddin, el último sultán otomano, en el Estambul ocupado, declaró lícita la muerte de Mustafa Kemal, según informó la prensa, mientras crecía la resistencia nacional. Al-Salabi también registra que los Aliados y los griegos tomaron Esmirna en 1338 AH con el consentimiento británico {cite:dawlat-uthmaniyya-salabi p. 468}."
  fr: "Mehmed VI Vahdeddin, le dernier sultan ottoman, aurait, selon la presse, déclaré légitime le sang de Mustafa Kemal à Istanbul, alors que la résistance nationale s'intensifiait. Al-Salabi rapporte également que les Alliés et les Grecs prirent Izmir en 1338 AH avec l'accord des Britanniques (cite: dawlat-uthmaniyya-salabi, p. 468)."
  ur: "مقبوضہ استنبول میں آخری عثمانی سلطان محمود ششم وحیدالدین نے پریس کے ذریعے مصطفٰی کمال کے خون کو حلال قرار دیا جب کہ قومی مزاحمت میں اضافہ ہوا۔ الصلبی نے یہ بھی درج کیا ہے کہ اتحادیوں اور یونانیوں نے 1338 ہجری میں انگریزوں کی رضامندی سے ازمیر پر قبضہ کر لیا۔ 468}۔"
  tr: "Osmanlı İmparatorluğu'nun son sultanı Sultan Wahideddin Mehmed VI, onu İstanbul'da hapsedilmiş ve I. Dünya Savaşı sonrası işgal sırasında yaşadığı aşağılanmaya boyun eğmiş olarak tanımlamıştır. Gazeteler, Mustafa Kemal'in kanını döktüğünü ve onu isyankar bir isyancı olarak gördüğünü bildirmiştir; bu durum, Kemal'in mücadelesine kıyasla kamuoyunun öfkesini artırmıştır {cite:dawlat-uthmaniyya-salabi, s. 468}."
  id: "Sultan Wahid al-Din Mehmed VI, sultan terakhir Kekaisaran Ottoman, menggambarkannya sebagai dikurung di Istanbul, tunduk pada penghinaan yang dialaminya selama pendudukan pasca Perang Dunia I. Surat kabar melaporkan dia menumpahkan darah Mustafa Kemal dan menganggapnya sebagai pemberontak yang tidak patuh, yang meningkatkan kemarahan publik dibandingkan perjuangan Kemal {cite:dawlat-uthmaniyya-salabi, hlm. 468}."
