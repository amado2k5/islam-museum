summary:
  ar: "أبو إسماعيل حماد بن أبي سليمان، مولى إبراهيم بن أبي موسى الأشعري، تفقه بإبراهيم النخعي؛ مات سنة تسع عشرة ومائة، وقيل سنة عشرين، وقال إبراهيم حين سُئل من يخلفه: حماد {cite:tabaqat-fuqaha-abbas-1981 p. 44}."
  tr: "İbrahim ibn Abi Musa el-Eş'ari'nin özgür bıraktığı Ebu İsmail Hammad bin Ebu Ebu Süleyman, İbrahim el-Nakha'i'nin yanında fıkıh eğitimi aldı; 191 Hicri yılında, bazılarına göre 20 yılında öldü. Halefi sorulduğunda İbrahim şöyle dedi: Hammad {atıf:tabaqat-fuqaha-abbas-1981, s. 44}."
  id: "Abu Ismail Hammad ibn Abi Sulayman, mantan Ibrahim ibn Abi Musa al-Ash'ari, mempelajari fiqh. Ibrahim al-Nakha'i; ia meninggal pada tahun 191 H, dan beberapa mengatakan pada tahun 20. Ketika ditanya tentang penerusnya, Ibrahim berkata: Hammad {cite:tabaqat-fuqaha-abbas-1981, hlm. 44}."
