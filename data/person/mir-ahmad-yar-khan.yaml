summary:
  ar: "آخر خانات قلات (1902–1979): خلف والده أعظم جان سنة 1933، وتردد في الانضمام سنة 1947 ثم وقّع انضمام قلات إلى باكستان في 27 مارس 1948، ورأس اتحاد ولايات بلوشستان من 1952 حتى حلّ الاتحاد وانتهاء الخانية في 14 أكتوبر 1955، واعتُقل سنة 1958 بعد أن أعلن نفسه خانا من جديد، ثم صار حاكما لبلوشستان 1974–1977، وألّف سيرته السياسية «داخل بلوشستان» (1975)."
  en: "The last Khan of Kalat (1902–1979): he succeeded his father Azam Jan in 1933, held out through 1947 before signing Kalat's accession to Pakistan on 27 March 1948, headed the Baluchistan States Union from 1952 until its dissolution ended the khanate on 14 October 1955, was arrested in 1958 after briefly declaring himself Khan again, served as Governor of Balochistan in 1974–1977, and wrote a political autobiography, Inside Baluchistan (1975)."
  ur: "قلات کے آخری خان (1902ء–1979ء): 1933ء میں اپنے والد اعظم جان کے جانشین بنے، 1947ء میں الحاق سے ہچکچاتے رہے اور بالآخر 27 مارچ 1948ء کو قلات کے پاکستان سے الحاق پر دستخط کیے، 1952ء سے بلوچستان ریاستوں کے اتحاد کے سربراہ رہے حتیٰ کہ 14 اکتوبر 1955ء کو اتحاد کی تحلیل سے خانیت ختم ہو گئی، 1958ء میں خود کو دوبارہ خان قرار دینے پر گرفتار ہوئے، 1974ء–1977ء میں بلوچستان کے گورنر رہے، اور اپنی سیاسی خود نوشت «انسائیڈ بلوچستان» (1975ء) لکھی۔"
