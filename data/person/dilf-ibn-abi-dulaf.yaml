id: person/dilf-ibn-abi-dulaf
class: person
label: { ar: "دلف بن أبي دلف", en: "Dilf ibn Abi Dulaf", es: "Dilf ibn Abi Dulaf", fr: "Dilf ibn Abi Dulaf", ur: "دلف ابن ابی دلف" }
summary:
  ar: "ابن أبي دلف القاسم بن عيسى العجلي، كان ينتقص علي بن أبي طالب وأباه متشيع، وادعى أبو دلف أنه ولدته جارية وقع عليها وهي حائض، وشنع عليه بعد وفاته وحدث أنه رآه في المنام عرياناً في غرفة فيها أثر نار ورماد يقول لكنا إذا متنا بعثنا ونسأل بعده عن كل شيء {cite:muruj-al-dhahab p. 452-453}."
  en: "Abu Dulaf's nasibi son — disgraced by his father's confession and haunted by a dream of him naked amid ash, quoting 'when we die we are raised and asked' {cite:muruj-al-dhahab p. 452-453}."
  es: "El hijo nasibi de Abu Dulaf, deshonrado por la confesión de su padre y atormentado por un sueño en el que se veía desnudo entre cenizas, citando \"cuando morimos resucitamos y se nos pregunta\" {cite:muruj-al-dhahab p. 452-453}."
  fr: "Le fils nasibi d'Abu Dulaf — déshonoré par les aveux de son père et hanté par un rêve de lui nu au milieu des cendres, citant « quand nous mourons, nous sommes ressuscités et interrogés » {cite:muruj-al-dhahab p. 452-453}."
  ur: "ابو دلف کا ناصبی بیٹا - اپنے باپ کے اعتراف سے رسوا ہوا اور راکھ کے درمیان اپنے ننگے خواب سے پریشان ہوا، اس کا حوالہ دیتے ہوئے کہ 'جب ہم مرتے ہیں تو ہمیں اٹھایا جاتا ہے' {حوالہ: مروج الذہب صفحہ 452-453}۔"
  tr: "İbn Ebi Dulf el-Kasım ibn İsa el-Ecli, babası Şii olan Ali ibn Ebi Talib'i küçümserdi. Ebu Dulf, adet döneminde karşısına çıkan bir köle kız doğurduğunu iddia etti. Ölümünden sonra onu eleştirdi ve rüyasında ateş ve kül izleri olan bir odada çıplak gördüğünü bildirdi. Dedi ki, 'Ama öldüğümüzde dirileceğiz ve her şeyi ondan soracağız.' {atıf:Muruj-al-Dhahab s. 452-453}."
  id: "Ibn Abi Dulf al-Qasim ibn Isa al-Ajli sering merendahkan Ali ibn Abi Talib, yang ayahnya Syiah. Abu Dulf mengklaim bahwa dia melahirkan seorang budak perempuan yang dia hadapi saat gadis itu sedang menstruasi. Setelah kematiannya, dia mengkritiknya dan melaporkan bahwa dia melihatnya telanjang dalam mimpi di sebuah ruangan dengan jejak api dan abu. Dia berkata, 'Tetapi ketika kita mati, kita akan dibangkitkan dan ditanya tentang segala hal kepadanya.' {cite:muruj-al-dhahab hlm. 452-453}."
