summary:
  ar: "دقوز خاتون زوجة الإلخان هولاكو المفضلة، وكانت نصرانية نسطورية، وتوفيت سنة 663هـ/1265م. وبحسب دائرة المعارف الإسلامية رعت النصارى في دولة هولاكو، وأعانت اليعاقبة، وساعدت على كسب نصارى الشام إلى جانب الإلخانيين. وعند سقوط بغداد سنة 656هـ/1258م وقع الإبقاء على النصارى ومن لجأ إليهم من المسلمين بإلحاحها، ومُنح الجاثليق دار الدويدار ودار الفلك ورباطاً للنساء، وتذكر الدائرة أن هذه السياسة جاءت أحياناً على حساب المسلمين {cite:encyclopaedia-of-islam-2 vol. 3 p. 601} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1155} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1027}."
  en: "Doquz Khatun was the favourite wife of the Ilkhan Hulegu, a Nestorian Christian, who died in 663/1265. According to the Encyclopaedia of Islam she favoured Christians in Hulegu's realm, helped the Jacobites, and helped win the Christians of Syria to the Ilkhan's cause. At the fall of Baghdad in 656/1258 the Christians, and the Muslims who took refuge with them, were spared at her insistence, and the Catholicos was given the caliphal palaces of Dar al-Duwaydar and Dar al-Falak and a women's ribat; the article adds that her favour sometimes came at the expense of Muslims {cite:encyclopaedia-of-islam-2 vol. 3 p. 601} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1155} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1027}."
  ur: "دقوز خاتون ایل خان ہلاکو کی چہیتی بیوی اور نسطوری عیسائی تھیں، اور 663ھ/1265ء میں فوت ہوئیں۔ دائرۃ المعارف الاسلامیہ کے مطابق انہوں نے ہلاکو کی سلطنت میں عیسائیوں کی سرپرستی کی، یعقوبیوں کی مدد کی اور شام کے عیسائیوں کو ایل خان کے حق میں جیتنے میں مدد دی۔ 656ھ/1258ء میں بغداد کے سقوط کے وقت ان کے اصرار پر عیسائیوں اور ان کے پاس پناہ لینے والے مسلمانوں کو بخش دیا گیا، اور جاثلیق کو خلافتی محلات دار الدویدار، دار الفلک اور خواتین کا رباط دیا گیا؛ مضمون کہتا ہے کہ ان کی یہ مہربانی بعض اوقات مسلمانوں کی قیمت پر ہوئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 601} {cite:encyclopaedia-of-islam-2 vol. 3 p. 1155} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1027}."
