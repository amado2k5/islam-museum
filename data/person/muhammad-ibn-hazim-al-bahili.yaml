summary:
  ar: "شاعر قال في إمارة الحسن بن سهل بارك الله للحسن ولبوران في الختن يا ابن هارون قد ظفرت ولكن ببنست من، فلما نمي إلى المأمون قال والله ما ندري خيراً أراد أم شراً {cite:muruj-al-dhahab p. 424}."
  en: "The poet of the Buran wedding's double-edged epigram — 'you have triumphed, but by the basest of men' — which left al-Ma'mun unsure whether praise or blame was meant {cite:muruj-al-dhahab p. 424}."
  es: "El epigrama de doble filo del poeta de la boda de Buran — 'habéis triunfado, pero por el más vil de los hombres' — que dejó a al-Ma'mun sin saber si se trataba de alabanza o reproche {cite:muruj-al-dhahab p. 424}."
  fr: "L'épigramme à double tranchant du poète du mariage de Buran — « vous avez triomphé, mais par le plus vil des hommes » — qui a laissé al-Ma'mun incertain s'il s'agissait d'éloges ou de blâmes {cite:muruj-al-dhahab p. 424}."
  ur: "بران کی شادی کے دوہرے مصرعے کے شاعر - 'تم نے فتح حاصل کی ہے، لیکن مردوں کی بنیادوں سے' - جس نے المامون کو اس بات کا یقین نہیں چھوڑا کہ تعریف یا الزام کا مطلب ہے {حوالہ: مروج الذہب صفحہ۔ 424}۔"
