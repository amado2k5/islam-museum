summary:
  ar: "آخر سلطان لسولو صاحب سيادة فعلية (حكم 1894–1915، وبقي صاحب اللقب حتى وفاته)، وُلد باسم أمير الكرام. وقّع معاهدة كرام–بيتس مع الولايات المتحدة سنة 1899، وقاوم الضم الأمريكي بعد إلغائها سنة 1904، ثم تنازل عن السيادة بموجب اتفاقية كاربنتر سنة 1915 محتفظًا بلقبه وبمكانته رأسًا للإسلام في سولو. جلس لاحقًا في مجلس الشيوخ الفلبيني (1931–1934) وتوفي في مايمبونغ سنة 1936."
  en: "The last sultan of Sulu to hold sovereignty (reigned 1894–1915, titular until his death), born Amirul Kiram. He signed the Kiram–Bates Treaty with the United States in 1899, resisted American annexation after its abrogation in 1904, and surrendered sovereignty under the Carpenter Agreement of 1915, keeping his title and his role as head of Islam in Sulu. He later sat in the Philippine Senate (1931–1934) and died at Maimbung in 1936."
  ur: "سولو کے آخری سلطان جنہیں اصل اقتدار حاصل رہا (حکومت 1894ء–1915ء، وفات تک نامی سلطان)، ولادت کا نام امیر الکرام تھا۔ انہوں نے 1899ء میں امریکا سے کرام–بیٹس معاہدہ کیا، 1904ء میں اس کی منسوخی کے بعد امریکی الحاق کی مزاحمت کی، اور 1915ء کے کارپنٹر معاہدے کے تحت اقتدار سے دستبردار ہوئے، البتہ لقب اور سولو میں اسلام کے سربراہ کا منصب برقرار رکھا۔ بعد ازاں فلپائن سینیٹ کے رکن رہے (1931ء–1934ء) اور 1936ء میں مائمبونگ میں وفات پائی۔"
