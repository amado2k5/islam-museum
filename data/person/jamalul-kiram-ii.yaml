summary:
  ar: "آخر سلطان لسولو صاحب سيادة فعلية ⁦(حكم 1894–1915، وبقي صاحب اللقب حتى وفاته)⁩، وُلد باسم أمير الكرام. وقّع معاهدة كرام–بيتس مع الولايات المتحدة سنة 1899، وقاوم الضم الأمريكي بعد إلغائها سنة 1904، ثم تنازل عن السيادة بموجب اتفاقية كاربنتر سنة 1915 محتفظًا بلقبه وبمكانته رأسًا للإسلام في سولو. جلس لاحقًا في مجلس الشيوخ الفلبيني (1931–1934) وتوفي في مايمبونغ سنة 1936."
  en: "The last sultan of Sulu to hold sovereignty (reigned 1894–1915, titular until his death), born Amirul Kiram. He signed the Kiram–Bates Treaty with the United States in 1899, resisted American annexation after its abrogation in 1904, and surrendered sovereignty under the Carpenter Agreement of 1915, keeping his title and his role as head of Islam in Sulu. He later sat in the Philippine Senate (1931–1934) and died at Maimbung in 1936."
  ur: "سولو کے آخری سلطان جنہیں اصل اقتدار حاصل رہا ⁦(حکومت 1894ء–1915ء، وفات تک نامی سلطان)⁩، ولادت کا نام امیر الکرام تھا۔ انہوں نے 1899ء میں امریکا سے کرام–بیٹس معاہدہ کیا، 1904ء میں اس کی منسوخی کے بعد امریکی الحاق کی مزاحمت کی، اور 1915ء کے کارپنٹر معاہدے کے تحت اقتدار سے دستبردار ہوئے، البتہ لقب اور سولو میں اسلام کے سربراہ کا منصب برقرار رکھا۔ بعد ازاں فلپائن سینیٹ کے رکن رہے ⁦(1931ء–1934ء)⁩ اور 1936ء میں مائمبونگ میں وفات پائی۔"
  es: "El último sultán de Sulu en ostentar la soberanía (reinó de 1894 a 1915, con título nobiliario hasta su muerte), nació como Amirul Kiram. Firmó el Tratado Kiram-Bates con Estados Unidos en 1899, resistió la anexión estadounidense tras su abrogación en 1904 y cedió la soberanía en virtud del Acuerdo Carpenter de 1915, conservando su título y su papel como líder del islam en Sulu. Posteriormente, fue senador estatal de Filipinas (1931-1934) y falleció en Maimbung en 1936."
  fr: "Le dernier sultan de Sulu à avoir exercé la souveraineté (règne: 1894-1915, titre honorifique jusqu’à sa mort), né Amirul Kiram, signa le traité Kiram-Bates avec les États-Unis en 1899, s’opposa à l’annexion américaine après son abrogation en 1904 et céda sa souveraineté en vertu de l’accord Carpenter de 1915, conservant son titre et son rôle de chef de l’islam à Sulu. Il siégea ensuite au Sénat philippin (1931-1934) et mourut à Maimbung en 1936."
  tr: "Sulu'nun son egemen sultanı (1894–1915 yılları arasında hüküm sürdü, ölümüne kadar bu unvanı korudu), Karam Prensi olarak doğdu. 1899'da Amerika Birleşik Devletleri ile Kram–Pates Antlaşması'nı imzaladı, 1904'te Amerikan ilhakına karşı çıktı, ardından 1915'te Carpenter Anlaşması kapsamında egemenliğinden vazgeçti ve Sulu'daki İslam başkanı unvanını ve görevini korudu. Daha sonra Filipinler Senatosu'nda (1931–1934) görev yaptı ve 1936'da Mayimpong'da öldü."
  id: "Sultan berdaulat terakhir Sulu (memerintah 1894–1915, tetap memegang gelar hingga wafat), lahir sebagai Pangeran Karam. Ia menandatangani Perjanjian Kram–Pates dengan Amerika Serikat pada tahun 1899, menolak aneksasi Amerika setelah pembatalan pada tahun 1904, kemudian melepaskan kedaulatan berdasarkan Perjanjian Tukang Kayu pada tahun 1915, mempertahankan gelar dan posisinya sebagai kepala Islam di Sulu. Ia kemudian duduk di Senat Filipina (1931–1934) dan meninggal di Mayimpong pada tahun 1936."
