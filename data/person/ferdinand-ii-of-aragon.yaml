kids:
  ar: "فرناندو ملك أرغون تزوج إيزابيلا ملكة قشتالة، وحكما معاً وانتهت في زمنهما دولة بني نصر في غرناطة."
  en: "Ferdinand was the king of Aragon who married Queen Isabella of Castile, and in their time the Nasrid kingdom of Granada came to an end."
  ur: "فرڈیننڈ آراگون کے بادشاہ تھے جنہوں نے قشتالہ کی ملکہ ازابیلا سے شادی کی، اور ان کے زمانے میں غرناطہ کی نصری سلطنت ختم ہوئی۔"
