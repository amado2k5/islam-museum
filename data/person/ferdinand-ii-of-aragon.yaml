summary:
  ar: "ملك أرغون وزوج إيزابيلا ملكة قشتالة، ويُعرفان معاً بالملكين الكاثوليكيين. تذكر دائرة المعارف الإسلامية أن تاج أرغون آل إليه سنة 1479م، وأنه وزوجته نسّقا الهجوم المسيحي على مملكة غرناطة النصرية: سقطت لوشة سنة 1486م ومالقة والمرية بعدها، وبازا سنة 1489م، ثم سُلّمت غرناطة في 2 يناير 1492م الموافق ربيع الأول 897هـ، ودخل الملكان الحمراء في 6 يناير. وتذكر المقالة أنه توفي في 22 يناير 1516م {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}."
  en: "King of Aragon and husband of Isabella of Castile, the two being known together as the Catholic Monarchs. The Encyclopaedia of Islam says the crown of Aragon passed to him in 1479 and that he and his wife co-ordinated the Christian offensive against the Nasrid kingdom of Granada: Loja fell in 1486, Malaga and Almeria soon after, Baza in 1489, and Granada was surrendered on 2 January 1492 (Rabi I 897), the monarchs entering the Alhambra on 6 January. The articles give his death as 22 January 1516 {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}."
  ur: "آراگون کے بادشاہ اور قشتالہ کی ملکہ ازابیلا کے شوہر؛ دونوں مل کر کیتھولک بادشاہین کہلاتے ہیں۔ اسلامی دائرۃ المعارف کے مطابق 1479ء میں آراگون کا تاج ان کے پاس آیا اور انہوں نے اپنی اہلیہ کے ساتھ مل کر نصری مملکتِ غرناطہ پر مسیحی یلغار کو منظم کیا: 1486ء میں لوجہ گرا، پھر ملقہ اور المریہ، 1489ء میں بازا، اور غرناطہ 2 جنوری 1492ء، یعنی ربیع الاول 897ھ، کو حوالے کر دیا گیا اور دونوں بادشاہ 6 جنوری کو الحمراء میں داخل ہوئے۔ مضامین کے مطابق ان کی وفات 22 جنوری 1516ء کو ہوئی {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}۔"
