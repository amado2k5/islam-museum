summary:
  ar: "ملك أرغون وزوج إيزابيلا ملكة قشتالة، ويُعرفان معاً بالملكين الكاثوليكيين. تذكر دائرة المعارف الإسلامية أن تاج أرغون آل إليه سنة 1479م، وأنه وزوجته نسّقا الهجوم المسيحي على مملكة غرناطة النصرية: سقطت لوشة سنة 1486م ومالقة والمرية بعدها، وبازا سنة 1489م، ثم سُلّمت غرناطة في 2 يناير 1492م الموافق ربيع الأول 897هـ، ودخل الملكان الحمراء في 6 يناير. وتذكر المقالة أنه توفي في 22 يناير 1516م {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}."
  en: "King of Aragon and husband of Isabella of Castile, the two being known together as the Catholic Monarchs. The Encyclopaedia of Islam says the crown of Aragon passed to him in 1479 and that he and his wife co-ordinated the Christian offensive against the Nasrid kingdom of Granada: Loja fell in 1486, Malaga and Almeria soon after, Baza in 1489, and Granada was surrendered on 2 January 1492 (Rabi I 897), the monarchs entering the Alhambra on 6 January. The articles give his death as 22 January 1516 {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}."
  ur: "آراگون کے بادشاہ اور قشتالہ کی ملکہ ازابیلا کے شوہر؛ دونوں مل کر کیتھولک بادشاہین کہلاتے ہیں۔ اسلامی دائرۃ المعارف کے مطابق 1479ء میں آراگون کا تاج ان کے پاس آیا اور انہوں نے اپنی اہلیہ کے ساتھ مل کر نصری مملکتِ غرناطہ پر مسیحی یلغار کو منظم کیا: 1486ء میں لوجہ گرا، پھر ملقہ اور المریہ، 1489ء میں بازا، اور غرناطہ 2 جنوری 1492ء، یعنی ربیع الاول 897ھ، کو حوالے کر دیا گیا اور دونوں بادشاہ 6 جنوری کو الحمراء میں داخل ہوئے۔ مضامین کے مطابق ان کی وفات 22 جنوری 1516ء کو ہوئی {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}۔"
  es: "Rey de Aragón y esposo de Isabel de Castilla, ambos conocidos como los Reyes Católicos. La Enciclopedia del Islam afirma que la corona de Aragón le fue entregada en 1479 y que él y su esposa coordinaron la ofensiva cristiana contra el reino nazarí de Granada: Loja cayó en 1486, Málaga y Almería poco después, Baza en 1489, y Granada se rindió el 2 de enero de 1492 (Rabi I 897), entrando los monarcas en la Alhambra el 6 de enero. Los artículos indican que murió el 22 de enero de 1516 {cite:encyclopaedia-of-islam-2 vol. 1 p. 520} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1081} {cite:encyclopaedia-of-islam-2 vol. 1 p. 727}."
  fr: "Roi d'Aragon et époux d'Isabelle de Castille, le couple était connu sous le nom de Rois Catholiques. L'Encyclopédie de l'Islam indique que la couronne d'Aragon lui revint en 1479 et que lui et son épouse coordonnèrent l'offensive chrétienne contre le royaume nasride de Grenade: Loja tomba en 1486, Malaga et Almeria peu après, Baza en 1489, et Grenade capitula le 2 janvier 1492 (Rabi I 897), les monarques entrant dans l'Alhambra le 6 janvier. Les articles mentionnent sa mort le 22 janvier 1516."
  tr: "Aragon Kralı ve eşi Kastilya Kraliçesi Isabella, her ikisi de Katolik hükümdarlar olarak bilinir. İslam Ansiklopedisi, Aragon tacının 1479 yılında ona ait olduğunu ve kendisi ile eşinin Nazarene Krallığı'na yönelik Hristiyan saldırısını koordine ettiğini belirtir: Louche 1486'da düştü, ardından Malaga ve Almería, 1489'da Baza ise düştü. Granada daha sonra 2 Ocak 1492'de, yani Rabi'al-Awwal 897 H.'ye karşılık gelirken devredildi ve iki kızıl kral 6 Ocak'ta girdi. Makalede onun 22 Ocak 1516'da öldüğü belirtilir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 520} {cite:Encyclopaedia-of-Islam-2 cilt 7, s. 1081} {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 727}."
  id: "Raja Aragon dan suaminya Isabella, Ratu Kastilia, keduanya dikenal sebagai raja Katolik. Ensiklopedia Islam menyebutkan bahwa mahkota Aragon menjadi miliknya pada tahun 1479 M, dan bahwa ia serta istrinya mengoordinasikan serangan Kristen terhadap Kerajaan Granada Nazare: Louche jatuh pada tahun 1486 M, diikuti oleh Malaga dan Almería setelahnya, dan Baza pada tahun 1489 M. Granada kemudian diserahkan pada 2 Januari 1492 M, setara dengan Rabi' al-Awwal tahun 897 H, dan kedua raja merah masuk pada 6 Januari. Artikel tersebut menyebutkan bahwa ia meninggal pada 22 Januari 1516 {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 520} {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 1081} {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 727}."
