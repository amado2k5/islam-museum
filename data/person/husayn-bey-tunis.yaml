  ar: "حسين بن محمود بن علي تركي (١٧٧٨–١٨٣٥م)؛ أمير تونس. ولد فيها وتخلى له أبوه عن أمورها فحسنت سيرته، ولما توفي والده استقل بالأمر سنة ١٢٣٩هـ، وأنشأ أسطولاً حسناً واتخذ جيشاً من أهل المملكة، وحملت إليه الخلعة من الدولة العثمانية سنة ١٢٤٧هـ، وكان محباً للخير فيه حزم وشجاعة وحلم. توفي في إمارته {cite:al-aalam tarjama}."
