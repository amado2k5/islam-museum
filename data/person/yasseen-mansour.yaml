summary:
  ar: "ياسين منصور (وُلد سنة 1961 أو 1962)، رجل أعمال وملياردير مصري، شريك في ملكية مجموعة منصور ورئيس مجلس إدارة شركة بالم هيلز للتعمير. هو الابن الأصغر للطفي منصور مؤسس المجموعة، وشقيق رجلَي الأعمال محمد منصور ويوسف منصور. بُرّئ من تهم فساد سنة 2011 بعد دفعه 250 مليون جنيه مصري للسلطات، وظهرت له حسابات متعددة في بنك كريدي سويس ضمن تسريبات أسرار سويسرا."
  en: "Yasseen Mansour (born 1961 or 1962) is an Egyptian billionaire businessman, a part owner of the Mansour Group and chairman of Palm Hills Developments. The youngest son of the group's founder Loutfy Mansour and a brother of the businessmen Mohamed Mansour and Youssef Mansour, he was cleared of corruption charges in 2011 after paying 250 million Egyptian pounds to the authorities, and multiple Credit Suisse accounts of his appeared in the Suisse Secrets leaks."
  ur: "یاسین منصور (پیدائش 1961 یا 1962) مصری ارب پتی تاجر ہیں، منصور گروپ کے شریک مالک اور پام ہلز ڈیولپمنٹس کے چیئرمین ہیں۔ وہ گروپ کے بانی لطفی منصور کے سب سے چھوٹے بیٹے اور تاجروں محمد منصور اور یوسف منصور کے بھائی ہیں۔ 2011 میں انہیں حکام کو 250 ملین مصری پاؤنڈ ادا کرنے کے بعد بدعنوانی کے الزامات سے بری کر دیا گیا، اور سوئس سیکرٹس لیکس میں کریڈٹ سوئس میں ان کے متعدد کھاتے سامنے آئے۔"

