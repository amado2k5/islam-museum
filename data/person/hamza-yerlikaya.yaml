summary:
  ar: "مصارع روماني تركي، وُلد في إسطنبول سنة 1976. بطل أولمبي مرتين (1996 و2000) وبطل عالم ثلاث مرات وبطل أوروبا ثماني مرات، وسُمّي مصارع القرن لدى الاتحاد الدولي. وبعد اعتزاله صار نائبًا في البرلمان ورئيسًا للاتحاد التركي للمصارعة ونائبًا لوزير الشباب والرياضة."
  en: "Turkish Greco-Roman wrestler, born in Istanbul in 1976. A two-time Olympic champion (1996, 2000), three-time world champion and eight-time European champion, he was named FILA's Wrestler of the Century. After retiring he became a member of parliament, president of the Turkish Wrestling Federation and a deputy minister of youth and sports."
  ur: "ترک گریکو رومن پہلوان، جو 1976 میں استنبول میں پیدا ہوئے۔ دو بار اولمپک چیمپئن (1996، 2000)، تین بار عالمی چیمپئن اور آٹھ بار یورپی چیمپئن؛ انہیں فیلا نے صدی کا پہلوان قرار دیا۔ ریٹائرمنٹ کے بعد وہ رکن پارلیمان، ترک ریسلنگ فیڈریشن کے صدر اور نائب وزیرِ کھیل بنے۔"
