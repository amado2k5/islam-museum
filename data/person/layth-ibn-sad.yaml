label: { ar: "الليث بن سعد", en: "al-Layth ibn Sa'd", es: "al-Layth ibn Sa'd", fr: "al-Layth ibn Sa'd", ur: "لیث بن سعد" }
summary:
  ar: "الليث بن سعد الفهمي المصري، فقيه مصر ومحدثها في القرن الثاني؛ عند البلاذري: كتب إليه عبد الملك بن صالح والي الثغور يستفتيه مع فقهاء عصره في أمر أهل قبرس حين أحدثوا حدثاً، فأفتى بأنهم متهمون بغش أهل الإسلام ومناصحة الروم وأن ينبذ إليهم عهدهم ويُنظروا سنة يأتمرون — فمن أحب اللحاق ببلاد المسلمين ذمّةً قُبل ومن أراد بلاد الروم انتحى إليها ومن أقام على الحرب أقام — محتجاً بقوله تعالى في نبذ العهد على سواء عند خوف الخيانة. وعند ابن النديم كان من أصحاب مالك وعلى مذهبه ثم اختار لنفسه وكان يكاتب مالكا ويسأله وله كتاب التاريخ وكتاب مسائل في الفقه {cite:fihrist-ibn-al-nadim p. 281}"
  en: "al-Layth ibn Sa'd al-Fahmi of Egypt, the jurist and hadith-master of second-century Egypt; in al-Baladhuri: Abd al-Malik ibn Salih, governor of the marches, wrote consulting him among the jurists of the age about the people of Cyprus when they gave fresh offence, and he ruled them suspect of betraying the Muslims and counselling the Byzantines — advising that their treaty be denounced with a year's grace for them to choose: whoever wished might enter the Muslims' lands as a dhimmi, whoever wished might withdraw to Byzantium, and whoever remained stayed at war — arguing from the verse on denouncing covenants openly when treachery is feared."
  es: "al-Layth ibn Sa'd al-Fahmi de Egipto, jurista y maestro de hadices del Egipto del siglo II; en al-Baladhuri: Abd al-Malik ibn Salih, gobernador de las marcas, escribió consultándolo entre los juristas de la época acerca del pueblo de Chipre cuando volvieron a ofender, y él los consideró sospechosos de traicionar a los musulmanes y aconsejó a los bizantinos, recomendándoles que denunciaran su tratado con un año de gracia para que eligieran: quien quisiera podría entrar en las tierras de los musulmanes como dhimmi, quien quisiera podría retirarse a Bizancio, y quien se quedara permanecería en guerra, argumentando a partir del versículo sobre denunciar abiertamente los pactos cuando se teme la traición."
  fr: "Al-Layth ibn Sa'd al-Fahmi d'Égypte, juriste et maître du hadith du IIe siècle en Égypte, rapporte dans al-Baladhuri: Abd al-Malik ibn Salih, gouverneur des Marches, l'a consulté parmi les juristes de l'époque au sujet des habitants de Chypre, suite à une nouvelle offense. Al-Layth les a jugés suspects de trahison envers les musulmans et de collusion avec les Byzantins, leur conseillant de dénoncer leur traité et leur accordant un an de délai pour choisir: entrer en terres musulmanes comme dhimmi, se retirer à Byzance, ou rester en guerre. Il s'appuyait sur le verset relatif à la dénonciation publique des alliances en cas de crainte de trahison."
  ur: "مصر کے الف لیث بن سعد الفہمی، دوسری صدی کے مصر کے فقیہ اور حدیث کے ماہر؛ البلادھوری میں: مارچوں کے گورنر عبد الملک بن صالح نے قبرص کے لوگوں کے بارے میں ان سے مشورہ کرتے ہوئے لکھا کہ جب انہوں نے تازہ جرم کیا، اور اس نے ان پر مسلمانوں کے ساتھ غداری کرنے اور بازنطینیوں کو مشورہ دینے کا شبہ قرار دیا - یہ مشورہ دیا کہ ان کے معاہدے کی مذمت کی جائے جو مسلمانوں کے لیے ایک سال کے لیے منتخب کرنا چاہتے ہیں: ایک ذمی، جو چاہے بازنطیم سے دستبردار ہو سکتا ہے، اور جو بھی جنگ میں رہا - جب خیانت کا اندیشہ ہو تو کھلے عام معاہدوں کی مذمت کرنے پر آیت سے بحث۔"
  tr: "İkinci yüzyılda Mısır'ın fıkhihi ve hadis âlimi olan El-Leyt bin Seyd el-Fehmi el-Masri; el-Baladhuri'ye göre: Sınır valisi Abdülmelik bin Salih, zamanının hukukçularıyla birlikte Kıbrıs halkının bir olaya neden olduğu durumlarda kendisine ve kendisine soran bir mektup yazdı. Fetva yayımladı; bu kişilerin İslam halkını aldatmakla ve Romalılara öğüt vermekle suçlandıklarını, ahitlerinden vazgeçmelerini ve ahdin sünnetidir. — Müslümanların topraklarına katılmak isteyen onun önünde bir zimmidir; Romalıların topraklarına katılmak isteyen ondan çekilir, savaşta kalan ise kalır — ihanet korkusuyla ahdi terk etmek konusunda Allah'ın sözlerini referans göstererek. İbn el-Nadim'e göre, Malik'in takipçileri arasındaydı ve onun doktrinini takip etti, sonra Malik'e yazdı ve ona sorular sordu. Tarih üzerine bir kitap ve fıkıh konularında bir kitap yazdı {alıntı:Fihrist-ibn-al-Nadim s. 281}"
  id: "Al-Layth ibn Sa'd al-Fahmi al-Masri, seorang ahli hukum dan ulama hadis Mesir pada abad kedua; menurut al-Baladhuri: Abd al-Malik ibn Salih, gubernur perbatasan, menulis kepadanya bersama para ahli hukum zamannya mengenai rakyat Siprus ketika mereka menyebabkan insiden. Ia mengeluarkan fatwa yang menyatakan bahwa mereka dituduh menipu umat Islam dan menasihati orang Romawi, serta mereka harus melepaskan perjanjian mereka dan pertimbangkan Sunnah perjanjian. — Siapa pun yang ingin bergabung dengan tanah Muslim adalah dhimmi di hadapannya, dan siapa pun yang ingin bergabung dengan tanah Romawi menarik diri darinya, dan siapa pun yang bertahan dalam perang tetap tinggal — mengutip firman Tuhan tentang meninggalkan perjanjian sama saat takut dikhianati. Menurut Ibn al-Nadim, dia termasuk pengikut Malik dan mengikuti ajarannya, kemudian dia menulis kepada Malik dan menanyainya. Dia menulis sebuah buku tentang sejarah dan sebuah buku tentang masalah hukum {cite:Fihrist-ibn-al-Nadim p. 281}"
