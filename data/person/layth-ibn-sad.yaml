id: person/layth-ibn-sad
class: person
label: { ar: "الليث بن سعد", en: "al-Layth ibn Sa'd" }
summary:
  ar: "الليث بن سعد الفهمي المصري، فقيه مصر ومحدثها في القرن الثاني؛ عند البلاذري: كتب إليه عبد الملك بن صالح والي الثغور يستفتيه مع فقهاء عصره في أمر أهل قبرس حين أحدثوا حدثاً، فأفتى بأنهم متهمون بغش أهل الإسلام ومناصحة الروم وأن ينبذ إليهم عهدهم ويُنظروا سنة يأتمرون — فمن أحب اللحاق ببلاد المسلمين ذمّةً قُبل ومن أراد بلاد الروم انتحى إليها ومن أقام على الحرب أقام — محتجاً بقوله تعالى في نبذ العهد على سواء عند خوف الخيانة. وعند ابن النديم كان من أصحاب مالك وعلى مذهبه ثم اختار لنفسه وكان يكاتب مالكا ويسأله وله كتاب التاريخ وكتاب مسائل في الفقه {cite:fihrist-ibn-al-nadim p. 281}"
  en: "al-Layth ibn Sa'd al-Fahmi of Egypt, the jurist and hadith-master of second-century Egypt; in al-Baladhuri: Abd al-Malik ibn Salih, governor of the marches, wrote consulting him among the jurists of the age about the people of Cyprus when they gave fresh offence, and he ruled them suspect of betraying the Muslims and counselling the Byzantines — advising that their treaty be denounced with a year's grace for them to choose: whoever wished might enter the Muslims' lands as a dhimmi, whoever wished might withdraw to Byzantium, and whoever remained stayed at war — arguing from the verse on denouncing covenants openly when treachery is feared."
