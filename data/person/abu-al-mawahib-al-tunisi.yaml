summary:
  ar: "أبو المواهب محمد بن أحمد الشيخ الإمام المدقق التونسي الشاذلي نزيل مصر، وهو الذي كان متصدراً في قبالة رواق المغاربة بالجامع الأزهر، وكان صاحب أوراد وأحوال؛ أخذ عنه التصوفَ برهانُ الدين الأقصرائي فنُسب إليه «المواهبي»، توفي سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 426, 454}."
  en: "The Shadhili of Tunis resident in Cairo, seated facing the Maghreb riwaq at the Azhar, a man of litanies and states; Burhan al-Din al-Iqsara'i took the path from him and was named 'al-Muwahhibi' after him; d. 901 {cite:shadharat-dhahab p. 426, 454}."
  fr: "Le shadhilite de Tunis établi au Caire, assis face au riwaq des Maghrébins à al-Azhar, homme de litanies et d'états spirituels ; Burhan al-Din al-Iqsara'i reçut de lui la voie et fut nommé « al-Muwahhibi » d'après lui ; mort en 901 {cite:shadharat-dhahab p. 426, 454}."
  es: "El Shadhili de Túnez, residente en El Cairo, sentado frente al riwaq del Magreb en Al-Azhar, un hombre de letanías y estados; Burhan al-Din al-Iqsara'i siguió su camino y fue llamado 'al-Muwahhibi' en su honor; m. 901 {citado como shadharat-dhahab p. 426, 454}."
  ur: "قاہرہ میں مقیم تیونس کا شادھیلی، ازہر میں مغرب ریواق کے سامنے بیٹھا ہوا ہے، ایک لیٹنیوں اور ریاستوں کا آدمی؛ برہان الدین اقصری نے ان سے راستہ اختیار کیا اور ان کے نام پر 'المواحبی' کا نام دیا گیا۔ d 901 {حوالہ: شدھارت ذہاب ص۔ 426، 454}۔"
  tr: "Mısır'da ikamet eden, El-Azhar Camii'nin Fas revakının karşısında önemli bir konumda bulunan, dualar ve sözlerle tanınan Ebu el-Mevahib Muhammed ibn Ahmed el-Şeyh el-İmam el-Mudaqqiq el-Tunisi el-Şazili; Burhan el-Din el-Aksarai ondan tasavvuf öğrenmiş ve ona \"el-Mevahibi\" lakabı verilmiştir. Dokuz yüz bir yılında vefat etmiştir. {Kaynak: Şadharat-dahab s. 426, 454}"
  id: "Abu al-Mawahib Muhammad ibn Ahmad al-Shaykh al-Imam al-Mudaqqiq al-Tunisi al-Shadhili, penduduk Mesir, yang menduduki posisi penting di seberang serambi Maroko di Masjid Al-Azhar, dan beliau adalah seorang ahli syani dan negara; Burhan al-Din al-Aqsarai belajar Sufisme darinya dan disebut sebagai “al-Mawahibi” olehnya. Beliau wafat pada tahun 901 {cite:shadharat-dhahab hlm. 426, 454}."
