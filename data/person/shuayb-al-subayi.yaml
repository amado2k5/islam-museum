summary:
  ar: رجل من أهل السبيع في أرحب من عشيرة الدعام، يروي عنه رجل أنه شُفي من مرض في حلقه بعد أن أكل خاتم كتاب للهادي.
  en: A man of al-Subay' in Arhab, of al-Da'am's clan, of whom a narrator relates that he recovered from a throat illness after eating the seal of a letter from al-Hadi.
  ur: ارحب کے سبیع کا ایک شخص، دعام کے قبیلے کا، جس کی بابت ایک راوی بیان کرتا ہے کہ وہ ہادی کے خط کی مہر کھا کر حلق کی بیماری سے شفایاب ہوا۔
