label:
  ar: شعيب السبيعي
  en: Shu'ayb al-Subay'i
  ur: شعیب سبیعی
  es: "Shu'ayb al-Subay'i"
  fr: "Shu'ayb al-Subay'i"
summary:
  ar: رجل من أهل السبيع في أرحب من عشيرة الدعام، يروي عنه رجل أنه شُفي من مرض في حلقه بعد أن أكل خاتم كتاب للهادي.
  en: A man of al-Subay' in Arhab, of al-Da'am's clan, of whom a narrator relates that he recovered from a throat illness after eating the seal of a letter from al-Hadi.
  ur: ارحب کے سبیع کا ایک شخص، دعام کے قبیلے کا، جس کی بابت ایک راوی بیان کرتا ہے کہ وہ ہادی کے خط کی مہر کھا کر حلق کی بیماری سے شفایاب ہوا۔
  es: "Un hombre de al-Subay' en Arhab, del clan de al-Da'am, de quien un narrador relata que se recuperó de una enfermedad de garganta después de comer el sello de una carta de al-Hadi."
  fr: "Un homme d'al-Subay' à Arhab, du clan d'al-Da'am, dont un narrateur raconte qu'il guérit d'une maladie de la gorge après avoir mangé le sceau d'une lettre d'al-Hadi."
  tr: "Arhab'daki Al-Suba' halkından bir adam, Al-Da'kabilesine mensup, bir adam tarafından Al-Hadi için bir kitap yüzüğü yedikten sonra boğaz hastalığından iyileştiğini öğrenir."
  id: "Seorang pria dari suku Al-Suba' di Arhab, bagian dari suku Al-Da'am, diberitahu oleh seorang pria bahwa ia pulih dari penyakit tenggorokan setelah memakan cincin buku untuk Al-Hadi."
