summary:
  ar: "أحد أبناء الخليفة هشام بن عبد الملك؛ يذكر الكتاب أنه حج بالناس سنة تسع عشرة ومئة، في جملة أبناء هشام الذين أسند إليهم الخليفة الغزو والحج {cite:salabi-umayyad-state-2020 p.470}."
  tr: "Halife Hişam bin Abdülmelik'in oğullarından biri; kitapta, 1900 yılında Hacam oğulları arasında, halifenin sefer ve hac görevini emanet ettiği Hişam oğulları arasında halkı Hac yolculuğuna götürdüğünü belirtir {cite:Salabi-umayyad-state-2020 s.470}."
  id: "Salah satu putra Khalifah Hisham ibn Abd al-Malik; buku tersebut menyebutkan bahwa ia memimpin umat dalam Haji pada tahun 1900, di antara putra-putra Hisham yang dipercayakan oleh khalifah untuk ekspedisi dan haji {cite:salabi-umayyad-state-2020 hlm.470}."
