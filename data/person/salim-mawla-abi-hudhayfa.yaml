summary:
  ar: من السابقين الأولين؛ أعتقته امرأة من الأنصار فوالى أبا حذيفة الذي تبناه، ثم رُدّ إلى مواليه لما نزلت آية الأحزاب في التبني؛ كان يؤم المهاجرين الأولين في مسجد قباء وفيهم أبو بكر وعمر، وقصة إرضاعه بسبب سهلة بنت سهيل مشهورة.
  en: One of the earliest Muslims; a woman of the Ansar freed him and he attached himself to Abu Hudhayfa, who adopted him, then he was returned to his own clients when the verse in al-Ahzab about adoption was revealed; he led the first emigrants
    in prayer at the mosque of Quba, among them Abu Bakr and Umar, and the story of his being nursed because of Sahla bint Suhayl is well known.
  ur: "ابتدائی مسلمانوں میں سے؛ انصار کی ایک عورت نے آزاد کیا اور وہ ابو حذیفہ سے لگا جس نے اسے گود لیا۔"
  es: "Fue uno de los primeros musulmanes; una mujer de los Ansar lo liberó y él se unió a Abu Hudhayfa, quien lo adoptó. Luego fue devuelto a sus antiguos clientes cuando se reveló el versículo de al-Ahzab sobre la adopción. Dirigió la oración de los primeros emigrantes en la mezquita de Quba, entre ellos Abu Bakr y Umar, y es bien conocida la historia de cómo fue amamantado por Sahla bint Suhayl."
  fr: "L'un des premiers musulmans; une femme des Ansar l'affranchit et il se lia à Abu Hudhayfa, qui l'adopta; puis il retourna auprès de ses propres protégés lorsque le verset d'al-Ahzab concernant l'adoption fut révélé; il dirigea la prière des premiers émigrants à la mosquée de Quba, parmi lesquels Abu Bakr et Umar, et l'histoire de son allaitement par Sahla bint Suhayl est bien connue."
  tr: "En erken evlat edinenlerden biri; Ensar'dan bir kadın onu özgür bıraktı, ardından Abu Hudhaifa onu evlat edindi, ardından evlat edinme konusundaki müttefiklerin ayeti ortaya çıkınca mawwalına döndü. Ebu Bekir ve Ömer dahil olmak üzere Kube Camii'ndeki ilk göçmenleri yönetti. Sahla bint Suhail yüzünden emzirilmesi hikayesi iyi bilinir."
  id: "Di antara para pengadopsi awal paling awal; seorang wanita dari Ansar membebaskannya, sehingga ia diikuti oleh Abu Hudhaifa, yang mengadopsinya, lalu kembali ke mawwalnya ketika ayat konfederasi tentang adopsi diungkapkan. Ia memimpin para emigran awal di Masjid Quba, termasuk Abu Bakr dan Umar. Kisah tentang menyusuinya karena Sahla bint Suhail sudah sangat dikenal."
