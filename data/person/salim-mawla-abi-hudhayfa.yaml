summary:
  ar: من السابقين الأولين؛ أعتقته امرأة من الأنصار فوالى أبا حذيفة الذي تبناه، ثم رُدّ إلى مواليه لما نزلت آية الأحزاب في التبني؛ كان يؤم المهاجرين الأولين في مسجد قباء وفيهم أبو بكر وعمر، وقصة إرضاعه بسبب سهلة بنت سهيل مشهورة.
  en: One of the earliest Muslims; a woman of the Ansar freed him and he attached himself to Abu Hudhayfa, who adopted him, then he was returned to his own clients when the verse in al-Ahzab about adoption was revealed; he led the first emigrants
    in prayer at the mosque of Quba, among them Abu Bakr and Umar, and the story of his being nursed because of Sahla bint Suhayl is well known.
