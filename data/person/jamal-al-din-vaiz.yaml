summary:
  ar: "واعظ وكاتب دستوري إيراني (1862–1908) من همدان، استقر في إصفهان ثم غدا أشهر وعّاظ طهران الدستوريين، وكتب «لباس التقوى» وشارك في «الرؤيا الصادقة»، ففرّ بعد قصف المجلس سنة 1908 وقُتل في بروجرد بأمر محمد علي شاه، وهو والد الكاتب محمد علي جمال زاده."
  en: "Iranian constitutional preacher and writer (1862–1908) from Hamadan who settled in Isfahan and became Tehran's most famous constitutional preacher. He wrote Lebas ot-taqva and co-wrote The True Dream, fled after the bombardment of the Majles in 1908, and was killed at Borujerd on Mohammad Ali Shah's order. He was the father of the writer Mohammad Ali Jamalzadeh."
  ur: "ایرانی آئینی مبلغ و مصنف (1862–1908)، اہل ہمدان، جو اصفہان میں مقیم ہوئے اور تہران کے مشہور ترین آئینی واعظ بنے۔ انہوں نے «لباس التقویٰ» لکھی اور «رؤیای صادقہ» میں شریک رہے؛ 1908 میں مجلس پر گولہ باری کے بعد فرار ہوئے اور محمد علی شاہ کے حکم پر بروجرد میں قتل کیے گئے۔ وہ مصنف محمد علی جمال زادہ کے والد تھے۔"
