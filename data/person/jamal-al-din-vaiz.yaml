    note: "No consulted source names a school for him personally. English Wikipedia quotes one scholarly characterisation, Nikki Keddie's (Modern Iran, Yale University Press, 2003, pp. 179-180): the popular preachers 'were not themselves believers in any usual sense', and Sayyed Jamal ad-Din Esfahani 'was described by his son as a freethinker' — a single tradition, reported at second hand through his son Jamalzadeh, which does not meet the two-independent-traditions bar for atheist-or-sceptic. The same article records that he 'advised the Shia masses' and preached in concepts 'particularly central in Shi'ism, as Justice and Oppression', and the Persian article and encyclopedia tradition present him simply as a Muslim preacher of the constitutional cause, a sayyid and a preacher in Karbala and Najaf as well as across Iran — milieu and practice, not an attestation of school. Under the doubt rule the value stays unknown, with Keddie's wording preserved here in full."
