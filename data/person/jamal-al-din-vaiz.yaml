  calendar: gregorian
  precision: year
  status: historical
  derived: false
  note: "Killed at Borujerd in 1326 AH (1908). After the bombardment of the Majles he fled Tehran in disguise, heading for Najaf by way of Hamadan, where he took refuge with Mozaffar al-Molk; betrayed by him, he was sent to Borujerd and killed there by its governor on Mohammad Ali Shah's order, as the Persian Wikipedia article recounts; one charge against him was his part in the anti-despotism booklet The True Dream. English Wikipedia gives only the year 1908 and Keddie's statement that the Shah 'had them both killed in 1908', of Va'iz and Malek al-Motakallemin. His grave is recorded by the Persian tradition as remaining at Borujerd."
  sources: [source/wikipedia-jamal-al-din-vaiz-fa, source/wikipedia-jamal-al-din-vaiz-en]
