  note: "Born at Hamadan in 1279 AH, as the Persian encyclopedia tradition drawn on by the Persian Wikipedia article records — he was the son of Aqa Sayyed Ali Ameli, settled at Isfahan and took his name Esfahani from that city; English Wikipedia gives the Gregorian year 1862, which agrees with 1279 AH. The Hijri year 1279 is the Persian tradition's own."
