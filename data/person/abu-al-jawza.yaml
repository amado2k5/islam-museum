summary:
  ar: "أوس بن عبد الله، أبو الجوزاء الربعي البصري، تابعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} حدّث عن عائشة وابن عباس وعبد الله بن عمرو بن العاص وغيرهم، وروى عنه أبو الأشهب العطاردي وعمرو بن مالك النكري وبديل بن ميسرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} كان من العباد الذين وقفوا في وجه الحجاج، وقيل إنه قُتل يوم الجماجم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} وأُثر عنه أنه قال إنه لم يلعن شيئًا قط ولم يؤذِ أحدًا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
  en: "Aws ibn Abd Allah, Abu al-Jawza al-Rib'i al-Basri, a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He narrated from Aisha, Ibn Abbas and Abd Allah ibn Amr ibn al-As; Abu al-Ashhab al-Utaridi, Amr ibn Malik al-Nakri and Badil ibn Maysara narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He was one of the worshippers who stood against al-Hajjaj, and he is said to have been killed on the day of al-Jamajim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He is reported to have said that he never cursed anything and never harmed anyone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
  fr: "Aws ibn Abd Allah, Abu al-Jawza al-Rib'i al-Basri, un Successeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} Il rapporta d'Aisha, d'Ibn Abbas et d'Abd Allah ibn Amr ibn al-As ; Abu al-Ashhab al-Utaridi, Amr ibn Malik al-Nakri et Badil ibn Maysara rapportèrent de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} Il fut l'un des dévots qui se levèrent contre al-Hajjaj, et l'on dit qu'il fut tué le jour d'al-Jamajim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} On rapporte qu'il dit n'avoir jamais maudit quoi que ce soit ni fait de tort à personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
  es: "Aws ibn Abd Allah, Abu al-Jawza al-Rib'i al-Basri, un Sucesor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} Narró de Aisha, Ibn Abbas y Abd Allah ibn Amr ibn al-As; Abu al-Ashhab al-Utaridi, Amr ibn Malik al-Nakri y Badil ibn Maysara narraron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} Fue uno de los adoradores que se opusieron a al-Hajjaj, y se dice que fue asesinado el día de al-Jamajim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} Se dice que afirmó que nunca maldijo nada ni dañó a nadie. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
  ur: "اوس بن عبد اللہ، ابو الجوزا الربیع البصری، جانشین۔ انہوں نے عائشہ، ابن عباس اور عبداللہ بن عمرو بن العاص ما سے روایت کی ہے۔ ابو الاشہب الطریدی، عمرو بن مالک النکری اور بدیل بن میسرہ نے ان سے روایت کی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 14950} وہ ان نمازیوں میں سے تھا جو حجاج کے خلاف کھڑے ہوئے تھے، اور کہا جاتا ہے کہ وہ یوم الجامع میں مارا گیا تھا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 14950} اس کے بارے میں کہا جاتا ہے کہ اس نے کبھی کسی چیز پر لعنت نہیں کی اور نہ ہی کسی کو نقصان پہنچایا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 14950}"
