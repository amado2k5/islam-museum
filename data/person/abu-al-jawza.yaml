summary:
  ar: "أوس بن عبد الله، أبو الجوزاء الربعي البصري، تابعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} حدّث عن عائشة وابن عباس وعبد الله بن عمرو بن العاص وغيرهم، وروى عنه أبو الأشهب العطاردي وعمرو بن مالك النكري وبديل بن ميسرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} كان من العباد الذين وقفوا في وجه الحجاج، وقيل إنه قُتل يوم الجماجم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} وأُثر عنه أنه قال إنه لم يلعن شيئًا قط ولم يؤذِ أحدًا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
  en: "Aws ibn Abd Allah, Abu al-Jawza al-Rib'i al-Basri, a Successor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He narrated from Aisha, Ibn Abbas and Abd Allah ibn Amr ibn al-As; Abu al-Ashhab al-Utaridi, Amr ibn Malik al-Nakri and Badil ibn Maysara narrated from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He was one of the worshippers who stood against al-Hajjaj, and he is said to have been killed on the day of al-Jamajim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950} He is reported to have said that he never cursed anything and never harmed anyone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14950}"
