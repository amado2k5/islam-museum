label: { ar: "عيسى بن عمر الثقفي", en: "Isa Ibn Umar Al Thaqafi", es: "Isa Ibn Umar Al Thaqafi", fr: "Isa Ibn Umar Al Thaqafi", ur: "عیسیٰ ابن عمر الثقفی" }
summary:
  ar: "عيسى بن عمر الثقفي البصري من مقدمي نحويي البصرة، ليس بعيسى بن عمر الهمداني الكوفي، أخذ عن عبد الله بن أبي إسحاق الحضرمي وأخذ عنه الخليل بن أحمد، وكان ضريرا أحد فراء البصريين ومات سنة تسع وأربعين ومائة، وله كتاب الجامع وكتاب المكمل اللذان قال ابن النديم إنهما فقدا منذ المدة الطويلة ولم يقعا إلى أحد ولا خبر أحد أنه رآهما {cite:fihrist-ibn-al-nadim p. 110-111}."
  en: "Blind Basran grammarian (d. 149), al-Khalil teacher; his Jami and Mukammal already lost {cite:fihrist-ibn-al-nadim}"
  es: "Gramático ciego de Basran (m. 149), maestro de al-Khalil; su Jami y Mukammal ya perdieron {cita:fihrist-ibn-al-nadim}"
  fr: "Grammairien basran aveugle (mort en 149), professeur d'al-Khalil; son Jami et Mukammal ont déjà perdu {cite:fihrist-ibn-al-nadim}"
  ur: "نابینا بصران گرامر ⁦(متوفی 149)⁩، الخلیل استاد؛ اس کا جامی اور مکمل پہلے ہی کھو چکے ہیں"
  tr: "İsa ibn Ömer el-Tekafi el-Basri, Basra'nın önde gelen dilbilgicilerinden biriydi, İsa ibn Ömer el-Hemdani el-Kufi değil. Abdullah ibn Ebi İshaq el-Hadrami ve ondan el-Halil ibn Ahmed ders aldı. Kördü, Fara'el-Beşranlılardan biri ve yüz kırk dokuzuncu yılda öldü. İbn el-Nadim'in uzun zaman önce kaybolduğunu ve kimsenin başına gelmediğini söylediği El-Cemi ve Kitab el-Mukalim kitaplarını yazdı; kimse onları gördüğünden haberdar değildir {atıf:Fihrist-ibn-al-Nadim s. 110-111}."
  id: "Isa ibn Umar al-Thaqafi al-Basri adalah salah satu ahli tata bahasa terkemuka di Basra, bukan Isa ibn Umar al-Hamdani al-Kufi. Ia belajar di bawah bimbingan Abdullah ibn Abi Ishaq al-Hadrami dan dari dia al-Khalil ibn Ahmad. Ia buta, salah satu dari Fara' al-Basrani, dan meninggal pada tahun seratus empat puluh sembilan. Ia menulis buku Al-Jami' dan Kitab al-Mukalim, yang menurut Ibn al-Nadim telah lama hilang dan tidak pernah terjadi pada siapa pun, juga tidak ada yang tahu bahwa ia melihatnya {cite:fihrist-ibn-al-nadim hlm. 110-111}."
