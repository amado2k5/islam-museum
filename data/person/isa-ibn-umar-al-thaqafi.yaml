id: person/isa-ibn-umar-al-thaqafi
class: person
label: { ar: "عيسى بن عمر الثقفي", en: "Isa Ibn Umar Al Thaqafi" }
summary:
  ar: "عيسى بن عمر الثقفي البصري من مقدمي نحويي البصرة، ليس بعيسى بن عمر الهمداني الكوفي، أخذ عن عبد الله بن أبي إسحاق الحضرمي وأخذ عنه الخليل بن أحمد، وكان ضريرا أحد فراء البصريين ومات سنة تسع وأربعين ومائة، وله كتاب الجامع وكتاب المكمل اللذان قال ابن النديم إنهما فقدا منذ المدة الطويلة ولم يقعا إلى أحد ولا خبر أحد أنه رآهما {cite:fihrist-ibn-al-nadim p. 110-111}."
  en: "Blind Basran grammarian (d. 149), al-Khalil teacher; his Jami and Mukammal already lost {cite:fihrist-ibn-al-nadim}"
