summary:
  ar: "خليفة عباسي [٦٤٠–٦٥٦هـ]، عبد الله بن المستنصر واسمه أحمد، أقامه الدويدار والشرابي لما مات أبوه دون عمه الخفاجي للينه وضعف رأيه ليكون لهما الأمر، وكان أبوه قد استكثر من الجند جداً ومع ذلك يصانع التتار ويهاديهم فلما استخلف كان خلياً من الرأي والتدبير فأشار عليه الوزير العلقمي بقطع أكثر الجند وأن مصانعة التتار يحصل بها المقصود ففعل ذلك، وكان العلقمي حريصاً على إزالة الدولة العباسية ونقلها إلى العلوية والرسل في السر بينه وبين التتار والمستعصم تائه في لذاته لا يطلع على الأمور {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}، فلما وصل التتار بمقدمهم هولاكو خرج إليهم بناء على وعد الوزير المكذوب فقتل الخليفة رفساً سنة ست وخمسين ولم يدفن على ما ظن الذهبي وكانت بلية لم يصب الإسلام بمثلها {cite:tarikh-khulafa-minhaj-1434 p. 715-716}. وعند ابن خلدون وكانت الفتنة ببغداد لا تزال متصلة بين الشيعة وأهل السنة وبين الحنابلة وسائر أهل المذاهب وبين العيارين والدعار، ولما نزل هلاكو بغداد خرج إليه الوزير ابن العلقمي فاستأمن لنفسه ورجع بالأمان إلى المستعصم وأنه يبقيه على خلافته كما فعل بملك بلاد الروم فخرج المستعصم ومعه أهل بيته ورجال مملكته فقتلوا {cite:tarikh-ibn-khaldun-ibar p. 900-901} آخر الخلفاء العراقيين، ولد سنة تسع وست مئة في خلافة جد أبيه واستخلف في جمادى الأولى سنة أربعين وكان حليماً كريماً سليم الباطن قليل الرأي حسن الديانة مبغضاً للبدعة في الجملة، وقتلته التتار رفساً في آخر المحرم سنة ست وخمسين وست مئة وكان الأمر أشغل من أن يوجد مؤرخ لموته أو مواراة جسده {cite:shadharat-dhahab p. 278-279}."
  en: "Abbasid caliph [640–656], the last of Baghdad — raised over his fierce uncle al-Khafaji for his softness, that the duwaydar and sharabi might rule. Empty of counsel, he cut most of the host his father had mustered on al-Alqami's advice, while the vizier wrote secretly to the Tatars meaning to move the caliphate to the Alids — 'and al-Musta'sim wandered in his pleasures' {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}."
