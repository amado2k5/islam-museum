summary:
  ar: "خليفة عباسي [٦٤٠–٦٥٦هـ]، عبد الله بن المستنصر واسمه أحمد، أقامه الدويدار والشرابي لما مات أبوه دون عمه الخفاجي للينه وضعف رأيه ليكون لهما الأمر، وكان أبوه قد استكثر من الجند جداً ومع ذلك يصانع التتار ويهاديهم فلما استخلف كان خلياً من الرأي والتدبير فأشار عليه الوزير العلقمي بقطع أكثر الجند وأن مصانعة التتار يحصل بها المقصود ففعل ذلك، وكان العلقمي حريصاً على إزالة الدولة العباسية ونقلها إلى العلوية والرسل في السر بينه وبين التتار والمستعصم تائه في لذاته لا يطلع على الأمور {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}، فلما وصل التتار بمقدمهم هولاكو خرج إليهم بناء على وعد الوزير المكذوب فقتل الخليفة رفساً سنة ست وخمسين ولم يدفن على ما ظن الذهبي وكانت بلية لم يصب الإسلام بمثلها {cite:tarikh-khulafa-minhaj-1434 p. 715-716}. وعند ابن خلدون وكانت الفتنة ببغداد لا تزال متصلة بين الشيعة وأهل السنة وبين الحنابلة وسائر أهل المذاهب وبين العيارين والدعار، ولما نزل هلاكو بغداد خرج إليه الوزير ابن العلقمي فاستأمن لنفسه ورجع بالأمان إلى المستعصم وأنه يبقيه على خلافته كما فعل بملك بلاد الروم فخرج المستعصم ومعه أهل بيته ورجال مملكته فقتلوا {cite:tarikh-ibn-khaldun-ibar p. 900-901} آخر الخلفاء العراقيين، ولد سنة تسع وست مئة في خلافة جد أبيه واستخلف في جمادى الأولى سنة أربعين وكان حليماً كريماً سليم الباطن قليل الرأي حسن الديانة مبغضاً للبدعة في الجملة، وقتلته التتار رفساً في آخر المحرم سنة ست وخمسين وست مئة وكان الأمر أشغل من أن يوجد مؤرخ لموته أو مواراة جسده {cite:shadharat-dhahab p. 278-279}."
  en: "Abbasid caliph [640–656], the last of Baghdad — raised over his fierce uncle al-Khafaji for his softness, that the duwaydar and sharabi might rule. Empty of counsel, he cut most of the host his father had mustered on al-Alqami's advice, while the vizier wrote secretly to the Tatars meaning to move the caliphate to the Alids — 'and al-Musta'sim wandered in his pleasures' {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}."
  fr: "Le calife abbasside [640-656], le dernier de Bagdad – a soulevé sur son oncle féroce al-Khafaji pour sa douceur, que le duwaydar et le sharabi pourraient régner. Vide de conseil, il coupa la majeure partie de l'hôte que son père avait rassemblé sur les conseils d'Al-Alqami, tandis que le vizir écrivait secrètement aux Tatars pour signifier de déplacer le califat aux Alids - \"et al-Musta'sim erra dans ses plaisirs\" {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}."
  ur: "640 تا 656 ہجری کے عباسی خلیفہ اور بغداد کے آخری عباسی حکمران؛ موجودہ عربی روایت ان کی تخت نشینی اور ہلاکو کی آمد کے بعد 656 ہجری میں ان کے قتل کا ذکر کرتی ہے۔ {cite:shadharat-dhahab}"
  es: "Califa abasí [640–656], el último de Bagdad, fue elevado por encima de su fiero tío al-Khafaji por su suavidad, para que el duwaydar y el sharabi pudieran gobernar. Sin consejo, redujo a la mayor parte del ejército que su padre había reunido siguiendo el consejo de al-Alqami, mientras el visir escribía en secreto a los tártaros con la intención de trasladar el califato a los alíes, «y al-Musta'sim vagaba en sus placeres» {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}."
  tr: "Babası öldüğünde, Amcasi halifesi Abdullah ibn al-Mustansir, adı Ahmed (640–656 H) olarak atandı, ancak amcası el-Hafaci, zayıflığı ve zayıf görüşü nedeniyle zayıftı, bu da onların işini kolaylaştırdı. Babası asker sayısını büyük ölçüde artırmıştı, ancak yine de Tatarlara yardım ediyor ve rehberlik ediyordu. Atandığında görüşü ve yönetimi yoktu. Vezir el-Alqami ona askerlerin çoğunu kesmesini tavsiye etti ve Tatarların hedefe ulaşacağını söyledi ve bunu başardı. Al-Alqami, Abbasi devletini kaldırıp onu Alevilere ve elçilere gizli olarak kendisi ile elçiler arasında devretmek istiyordu Tatarlar ve el-Musta'im, kendi zevklerine kapılmış, olaylardan habersizdi {atıf:Tarikh-Khulafa-minhaj-1434 s. 703,710-711}. Tatarlar liderleri Hulagu ile geldiklerinde, sahte vezirin vaadi üzerine onlara gitti ve 1956'da Halife Rafsa'yı öldürdü, ancak Rafsa, el-Dhahabi'nin inandığı gibi gömülmedi. Bu, İslam'ın şimdiye kadar yaşadığı hiçbir felaket değildi {cite:History-Khulafa-minhaj-1434, s. 715-716}. İbn Haldun'a göre, Bağdat'ta Şiiler ve Sünniler, Hanbaliler ve diğer düşünce mezheleri ile iki halife ile Daar arasında hâlâ süren anlaşmazlıklar devam ediyordu. Bağdat'ın yıkımı başladığında, vezir İbn el-Alqami ona gitti, güvenliğini sağladı ve Bizanslıların yönetiminde olduğu gibi onu halife olarak tutmak amacıyla el-Mustasim'e sağ salim döndü. El-Mustasim ailesi ve krallığının adamlarıyla birlikte dışarı çıktı ve onlar öldürüldü. {alıntı:Tarikh-ibn-khaldun-ibar s. 900-901}, son Iraklı halife, babasının babasının halifeliği sırasında altı yüz dokuzuncu yılda doğdu ve kırk yılında Cumeda'l-Avval'de halef olarak atandı Hoşgörülü, soylu, sağduyulu, az yargılı, iyi niyetli biriydi ve genel olarak yenilikten nefret ederdi. Tatarlar onu 656 Hicri yılındaki Muharrem sonunda tekmeleyerek öldürdü; bu durum ölümü için bir tarihçi bulmak ya da cesedini saklamak için çok endişe vericiydi {atıf:shadharat-dhahab, s. 278-279}."
  id: "Seorang khalifah Abbasiyah [640–656 H], Abdullah ibn al-Mustansir, bernama Ahmad, diangkat oleh al-Dwaidar dan al-Sharabi ketika ayahnya meninggal, tetapi pamannya al-Khafaji lemah karena kelemahan dan pendapat yang lemah, sehingga mereka lebih mudah. Ayahnya telah meningkatkan jumlah prajurit secara signifikan, namun ia masih membantu dan membimbing Tatar. Ketika diangkat, ia kurang memiliki pendapat dan manajemen. Wazir al-Alqami menyarankan agar ia memutuskan sebagian besar tentara, mengklaim bahwa Tatar akan mencapai tujuan tersebut, dan ia berhasil. Al-Alqami sangat ingin menyingkirkan negara Abbasiyah dan memindahkannya kepada Alawit dan utusan secara rahasia antara dirinya dan utusan-utusan Tatar dan al-Musta'im tenggelam dalam kesenangan mereka sendiri, tidak menyadari masalah ini {cite:Tarikh-Khulafa-minhaj-1434 hlm. 703,710-711}. Ketika Tatar tiba bersama pemimpin mereka Hulagu, ia pergi menemui mereka berdasarkan janji wazir palsu dan membunuh Khalifah Rafsa pada tahun 1956, tetapi ia tidak dikubur seperti yang diyakini al-Dhahabi. Itu adalah bencana yang belum pernah dialami Islam {cite:History-Khulafa-minhaj-1434, hlm. 715-716}. Menurut Ibn Khaldun, perselisihan di Baghdad masih berlangsung antara Syiah dan Sunni, Hanbalis dan aliran pemikiran lain, serta antara dua khalifah dan Da'ar. Ketika kehancuran Baghdad terjadi, wazir Ibn al-Alqami pergi menemuinya, mengamankan keselamatannya, dan kembali dengan selamat ke al-Musta'sim, dengan niat mempertahankannya sebagai khalifah seperti yang telah ia lakukan pada pemerintahan Bizantium. Al-Musta'sim pergi bersama keluarganya dan orang-orang kerajaannya, dan mereka dibunuh. {cite:Tarikh-ibn-khaldun-ibar hlm. 900-901}, khalifah Irak terakhir, lahir pada tahun enam ratus sembilan selama kekhalifahan kakek dari pihak ayahnya dan diangkat sebagai penerus di Jumada al-Awwal pada tahun empat puluh Ia bersikap pemarah, mulia, waras, kurang berpenilaian, berniat baik, dan secara umum membenci inovasi. Tatar menendangnya hingga tewas pada akhir Muharram tahun 656 H, yang terlalu mengkhawatirkan untuk menemukan sejarawan kematiannya atau menyembunyikan jenazahnya {cite:shadharat-dhahab, hlm. 278-279}."
