label: { ar: "المستعصم بالله عبد الله بن المستنصر آخر خلفاء بغداد" }
summary:
  ar: "خليفة عباسي [٦٤٠–٦٥٦هـ]، عبد الله بن المستنصر واسمه أحمد، أقامه الدويدار والشرابي لما مات أبوه دون عمه الخفاجي للينه وضعف رأيه ليكون لهما الأمر، وكان أبوه قد استكثر من الجند جداً ومع ذلك يصانع التتار ويهاديهم فلما استخلف كان خلياً من الرأي والتدبير فأشار عليه الوزير العلقمي بقطع أكثر الجند وأن مصانعة التتار يحصل بها المقصود ففعل ذلك، وكان العلقمي حريصاً على إزالة الدولة العباسية ونقلها إلى العلوية والرسل في السر بينه وبين التتار والمستعصم تائه في لذاته لا يطلع على الأمور {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}."
  en: "Abbasid caliph [640–656], the last of Baghdad — raised over his fierce uncle al-Khafaji for his softness, that the duwaydar and sharabi might rule. Empty of counsel, he cut most of the host his father had mustered on al-Alqami's advice, while the vizier wrote secretly to the Tatars meaning to move the caliphate to the Alids — 'and al-Musta'sim wandered in his pleasures' {cite:tarikh-khulafa-minhaj-1434 p. 703,710-711}."
