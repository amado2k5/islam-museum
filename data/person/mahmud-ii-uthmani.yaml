summary:
  ar: "السلطان العثماني محمود الثاني بن عبد الحميد الأول، وُلد عام 1785م وحكم من 1223هـ/1808م إلى 1255هـ/1839م، وتولى العرش بعد انقلاب بيرقدار ومقتل سليم الثالث. تذكر دائرة المعارف الإسلامية أنه استعاد سلطة المركز على الولايات، وألغى الإنكشارية عام 1826م وأقام جيشًا جديدًا على النمط الغربي، وأعاد تنظيم الإدارة في وزارات ومجالس، فيما خسرت الدولة أرضًا في الحروب مع روسيا واليونان وأمام محمد علي، وتوفي في 1 تموز 1839م بعد هزيمة نزيب. ويحكم كاتب المقالة بأن إصلاحاته وضعت المجتمع العثماني على طريق التحديث بلا رجعة، ويذكر الصلابي أنه ترسم خطى الحضارة الغربية في الزي."
  en: "Mahmud II, son of Abd al-Hamid I, was Ottoman sultan from 1223/1808 to 1255/1839, coming to the throne after the Bayrakdar coup and the killing of Selim III. The Encyclopaedia of Islam reports that he restored the centre's authority over the provinces, abolished the Janissaries in 1826, built a new Western-style army and reorganised the administration into ministries and councils, while the empire lost ground to Russia, Greece and Muhammad Ali, and that he died on 1 July 1839 after the defeat at Nizib. Its author judges that his reforms set Ottoman society irrevocably on the road to modernisation, while al-Salabi says he followed Western civilisation in dress."
  ur: "محمود ثانی بن عبدالحمید اول 1223ھ/1808ء سے 1255ھ/1839ء تک عثمانی سلطان رہے، اور بیرق دار کی بغاوت اور سلیم سوم کے قتل کے بعد تخت نشین ہوئے۔ انسائیکلوپیڈیا آف اسلام کے مطابق انہوں نے صوبوں پر مرکز کا اقتدار بحال کیا، 1826ء میں ینی چری ختم کیے، مغربی طرز کی نئی فوج بنائی اور انتظامیہ کو وزارتوں اور مجالس میں منظم کیا، جبکہ سلطنت روس، یونان اور محمد علی کے مقابل زمین کھوتی رہی، اور وہ نصیبین کی شکست کے بعد یکم جولائی 1839ء کو فوت ہوئے۔ مضمون نگار کا فیصلہ ہے کہ ان کی اصلاحات نے عثمانی معاشرے کو جدیدیت کی راہ پر ڈال دیا، جبکہ صلابی کہتے ہیں کہ انہوں نے لباس میں مغربی تہذیب کی پیروی کی۔"
