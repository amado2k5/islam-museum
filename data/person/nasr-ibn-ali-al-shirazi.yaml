summary:
  ar: "نصر بن علي بن محمد، أبو عبد الله الشيرازي الفارسي الفسوي، المعروف بابن أبي مريم، خطيب شيراز وعالمها وأديبها، والمرجوع إليه في الأمور الشرعية والمشكلات الأدبية. أخذ عنه محمود بن حمزة الكرماني. من تصانيفه «تفسير القرآن» و«الموضح في القراءات الثمان». توفي بعد سنة 565هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  en: "Nasr ibn Ali ibn Muhammad, Abu Abd Allah al-Shirazi al-Farisi al-Fasawi, known as Ibn Abi Maryam, preacher, scholar and man of letters of Shiraz, to whom people turned in legal matters and literary problems. Mahmud ibn Hamza al-Kirmani studied with him. His works include a Qur'an commentary and 'al-Muwadih fi al-qira'at al-thaman'. He died after 565 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
