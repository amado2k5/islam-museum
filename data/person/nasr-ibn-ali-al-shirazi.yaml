summary:
  ar: "نصر بن علي بن محمد، أبو عبد الله الشيرازي الفارسي الفسوي، المعروف بابن أبي مريم، خطيب شيراز وعالمها وأديبها، والمرجوع إليه في الأمور الشرعية والمشكلات الأدبية. أخذ عنه محمود بن حمزة الكرماني. من تصانيفه «تفسير القرآن» و«الموضح في القراءات الثمان». توفي بعد سنة 565هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  en: "Nasr ibn Ali ibn Muhammad, Abu Abd Allah al-Shirazi al-Farisi al-Fasawi, known as Ibn Abi Maryam, preacher, scholar and man of letters of Shiraz, to whom people turned in legal matters and literary problems. Mahmud ibn Hamza al-Kirmani studied with him. His works include a Qur'an commentary and 'al-Muwadih fi al-qira'at al-thaman'. He died after 565 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  es: "Nasr ibn Ali ibn Muhammad, Abu Abd Allah al-Shirazi al-Farisi al-Fasawi, conocido como Ibn Abi Maryam, fue un predicador, erudito y hombre de letras de Shiraz, a quien la gente acudía en asuntos legales y problemas literarios. Mahmud ibn Hamza al-Kirmani estudió con él. Entre sus obras se incluyen un comentario del Corán y «al-Muwadih fi al-qira'at al-thaman». Falleció después del año 565 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  fr: "Nasr ibn Ali ibn Muhammad, Abu Abd Allah al-Shirazi al-Farisi al-Fasawi, connu sous le nom d'Ibn Abi Maryam, était un prédicateur, un érudit et un homme de lettres de Shiraz, vers lequel on se tournait pour les questions juridiques et littéraires. Mahmud ibn Hamza al-Kirmani fut son élève. Parmi ses œuvres figurent un commentaire du Coran et « al-Muwadih fi al-qira'at al-thaman ». Il mourut après 565 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2072}"
  ur: "نصر ابن علی ابن محمد، ابو عبد اللہ الشیرازی الفارسی الفسوی، ابن ابی مریم کے نام سے مشہور، مبلغ، عالم اور شیراز کے خطوط کے آدمی، جن کی طرف لوگ قانونی معاملات اور ادبی مسائل میں رجوع کرتے تھے۔ محمود بن حمزہ الکرمانی نے ان سے تعلیم حاصل کی۔ ان کی تصانیف میں قرآن کی تفسیر اور 'الموادح فی القراط الثمان' شامل ہیں۔ 565ھ کے بعد وفات پائی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2072}"
