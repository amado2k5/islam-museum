summary:
  ar: "أبو محمد عبد الرحمن بن أبي حاتم محمد بن إدريس الحنظلي الرازي (240–327هـ)، حافظ الري وابن حافظها؛ رحل به أبوه صغيراً سنة 255 ثم رحل بنفسه إلى الشام ومصر وأصبهان، وأخذ عن أبيه وأبي زرعة، وصنف «الجرح والتعديل» و«علل الحديث» والتفسير المسند و«الرد على الجهمية»؛ توفي في المحرم سنة 327هـ."
  en: "Abu Muhammad Abd al-Rahman ibn Abi Hatim Muhammad ibn Idris al-Hanzali al-Razi (240–327 AH), the hafiz of Rayy and son of its hafiz; his father took him travelling as a boy in 255, and he later travelled himself to Syria, Egypt and Isfahan; he learned from his father and Abu Zur'a and wrote al-Jarh wa-l-Ta'dil, Ilal al-Hadith, a Qur'an commentary of transmitted reports and al-Radd ala al-Jahmiyya; he died in Muharram 327 AH (938 CE)."
