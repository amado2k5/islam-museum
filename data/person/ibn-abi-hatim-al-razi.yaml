summary:
  ar: "أبو محمد عبد الرحمن بن أبي حاتم محمد بن إدريس الحنظلي الرازي ⁦(240–327هـ)⁩، حافظ الري وابن حافظها؛ رحل به أبوه صغيراً سنة 255 ثم رحل بنفسه إلى الشام ومصر وأصبهان، وأخذ عن أبيه وأبي زرعة، وصنف «الجرح والتعديل» و«علل الحديث» والتفسير المسند و«الرد على الجهمية»؛ توفي في المحرم سنة 327هـ."
  en: "Abu Muhammad Abd al-Rahman ibn Abi Hatim Muhammad ibn Idris al-Hanzali al-Razi (240–327 AH), the hafiz of Rayy and son of its hafiz; his father took him travelling as a boy in 255, and he later travelled himself to Syria, Egypt and Isfahan; he learned from his father and Abu Zur'a and wrote al-Jarh wa-l-Ta'dil, Ilal al-Hadith, a Qur'an commentary of transmitted reports and al-Radd ala al-Jahmiyya; he died in Muharram 327 AH (938 CE)."
  es: "Abu Muhammad Abd al-Rahman ibn Abi Hatim Muhammad ibn Idris al-Hanzali al-Razi (240–327 AH), hafiz de Rayy e hijo de su hafiz; su padre lo llevó de viaje cuando era niño en 255, y más tarde viajó él mismo a Siria, Egipto e Isfahán; aprendió de su padre y de Abu Zur'a y escribió al-Jarh wa-l-Ta'dil, Ilal al-Hadith, un comentario del Corán sobre relatos transmitidos y al-Radd ala al-Jahmiyya; murió en Muharram 327 AH (938 d. C.)."
  fr: "Abu Muhammad Abd al-Rahman ibn Abi Hatim Muhammad ibn Idris al-Hanzali al-Razi (240–327 AH), le hafiz de Rayy et fils de son hafiz; son père l'emmena en voyage lorsqu'il était enfant en 255, et il voyagea plus tard lui-même en Syrie, en Égypte et à Ispahan; il apprit de son père et d'Abu Zur'a et écrivit al-Jarh wa-l-Ta'dil, Ilal al-Hadith, un commentaire du Coran sur les rapports transmis et al-Radd ala al-Jahmiyya; il mourut en Muharram 327 AH (938 CE)."
  ur: "ابو محمد عبدالرحمن بن ابی حاتم محمد بن ادریس الحنظلی الرازی ⁦(240-327ھ)⁩، رے کے حافظ اور اس کے حافظ کے بیٹے؛ اس کے والد اسے 255 میں لڑکپن میں سفر پر لے گئے اور بعد میں اس نے خود شام، مصر اور اصفہان کا سفر کیا۔ اس نے اپنے والد اور ابو زرعہ سے علم حاصل کیا اور الجرح والتعدیل، اِلال الحدیث، نقل شدہ رپورٹوں کی قرآن کی تفسیر اور الرد العلا الجہمیہ لکھی۔ آپ کی وفات محرم 327ھ ⁦(938ء)⁩ میں ہوئی۔"
  tr: "Ebu Muhammed Abdülrahman ibn Ebi Hatim Muhammed ibn İdris el-Hanzali el-Razi (240–327 H), Hafız el-Rayy ve onun ezberleyicisinin oğlu; babası çocukken 255 Hicri yılında onunla birlikte seyahat etti, ardından kendisi Levant, Mısır ve İsfahan'a giderek babası ve Ebu Zur'ah'ın yanında eğitim aldı ve 'El-Cerh ve el-Ta'dil', 'İlal al-Hadis', Musned Tefsir'i ve 'Radd 'ala al-Jahmiyye'yi kaleme aldı. 327 Hicri yılında Muharrem'de öldü."
  id: "Abu Muhammad Abd al-Rahman ibn Abi Hatim Muhammad ibn Idris al-Hanzali al-Razi (240–327 H), Hafiz al-Rayy dan putra dari pengapalnya; ayahnya bepergian bersamanya saat kecil pada tahun 255 H, kemudian ia sendiri melakukan perjalanan ke Levant, Mesir, dan Isfahan, belajar di bawah bimbingan ayahnya dan Abu Zur'ah, serta menulis 'Al-Jarh wa al-Ta'dil,' 'Ilal al-Hadith,' Tafsir Musnad, dan 'Radd 'ala al-Jahmiyyah.' Ia meninggal di Muharram pada tahun 327 H."
