summary:
  ar: "إبراهيم بن عيسى الزاهد، صحب معروف الكرخي، وسمع من أبي داود الطيالسي ومحمد بن المقرئ. كان إذا فرغ من صلاة السحر دعا لليهود والنصارى والمجوس بالهداية، ثم قال: اللهم إن كنت مدخلي النار فعظّم خلقتي حتى لا يكون لأمة محمد موضع فيها. ومن كلامه: المؤمن حسن الظن بالله، واثق بوعده، والخوف محجة والشوق مطية، والحياء أمير."
  en: "Ibrahim ibn Isa al-Zahid, who kept company with Ma'ruf al-Karkhi and heard from Abu Dawud al-Tayalisi and Muhammad ibn al-Muqri'. After his dawn prayer he prayed for the Jews, Christians and Magians to be guided, then said: O God, if You are to put me in the Fire, enlarge my body until there is no room in it for the community of Muhammad. Among his sayings: the believer thinks well of God and trusts His promise; fear is the road, longing the mount, and shame the commander."
  ur: "ابراہیم بن عیسیٰ زاہد، جنہوں نے معروف کرخی کی صحبت کی اور ابو داود طیالسی اور محمد بن مقری سے سنا۔ صبح کی نماز کے بعد یہودیوں، عیسائیوں اور مجوسیوں کے لیے ہدایت کی دعا کرتے، پھر کہتے: اے اللہ، اگر تو مجھے آگ میں داخل کرنے والا ہے تو میرا جسم اتنا بڑا کر دے کہ امت محمد کے لیے اس میں جگہ نہ رہے۔ ان کے اقوال میں: مومن اللہ کے بارے میں اچھا گمان رکھتا ہے اور اس کے وعدے پر بھروسہ کرتا ہے؛ خوف راستہ ہے، شوق سواری ہے، اور حیا امیر ہے۔"
