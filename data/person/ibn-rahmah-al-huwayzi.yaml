summary:
  ar: "عبد علي بن ناصر بن رحمة الحويزي، من كبار الشعراء في عصره، اتصل بحكام البصرة وولاتها، وكان يجيد النظم بالتركية والفارسية، له ديوان شعر وعدة كتب، ويذكر الزركلي وفاته سنة 1053 هـ."
  en: "Abd Ali ibn Nasir ibn Rahmah al-Huwayzi, counted among the leading poets of his age, who attached himself to the rulers of Basra and composed in Turkish and Persian as well as Arabic; author of a diwan and several books; al-Zirikli gives his death as 1053 AH."
  es: "Abd Ali ibn Nasir ibn Rahmah al-Huwayzi, considerado uno de los poetas más importantes de su época, se unió a los gobernantes de Basora y compuso en turco, persa y árabe; autor de un diván y varios libros; al-Zirikli sitúa su muerte en el año 1053 de la Hégira."
