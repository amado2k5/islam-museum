label: { ar: "زيادة الله بن الأغلب" }
summary:
  ar: "آخر أمراء الأغالبة على إفريقية، هرب من وجه المهدي العبيدي إلى مصر ثم أتى العراق وخرجت المغرب عن أمر بني العباس من هذا التاريخ {cite:tarikh-khulafa-minhaj-1434 p. 587}.، وعند المسعودي وردت هديته أبي مضر زيادة الله بن عبد الله على مدينة السلام سنة خمس وتسعين فيها مائتا خادم أسود وأبيض ومائة وخمسون جارية ومائة من الخيل العربية، وأخرجه من إفريقية أبو عبد الله المحتسب الداعية الذي ظهر في كتامة يدعو إلى عبيد الله سنة ست وتسعين وقيل خمس وتسعين ومائتين {cite:muruj-al-dhahab p. 647-648}"
  en: "The last Aghlabid amir of Ifriqiya; he fled the Ubaydid Mahdi to Egypt then Iraq — and the Maghreb left the Abbasids' command {cite:tarikh-khulafa-minhaj-1434 p. 587}."
