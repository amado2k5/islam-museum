id: person/ziyadat-allah-iii
class: person
label: { ar: "زيادة الله بن الأغلب" }
summary:
  ar: "آخر أمراء الأغالبة على إفريقية، هرب من وجه المهدي العبيدي إلى مصر ثم أتى العراق وخرجت المغرب عن أمر بني العباس من هذا التاريخ {cite:tarikh-khulafa-minhaj-1434 p. 587}. وعند المسعودي وردت هديته أبي مضر زيادة الله بن عبد الله على مدينة السلام سنة خمس وتسعين فيها مائتا خادم أسود وأبيض ومائة وخمسون جارية ومائة من الخيل العربية، وأخرجه من إفريقية أبو عبد الله المحتسب الداعية الذي ظهر في كتامة يدعو إلى عبيد الله سنة ست وتسعين وقيل خمس وتسعين ومائتين {cite:muruj-al-dhahab p. 647-648}، وعند ابن الأثير أنه بقي بعد خروجه عند المحابة مدة وهو مدمن الخمر واستمساح الملاهى وقيل بل سُمّ على يد بعض علمائه فسقط شعر لحيته، فعاد إلى مصر وقصد بيت المقدس فتوفى بالرملة ودُفن بها، وكانت مدة ملك بني الأغلب مائة سنة واثنتي عشرة سنة {cite:kamil-ibn-al-athir p. 17-18}، وعند ابن خلدون وهرب من رقادة إلى مصر حين ملك أبو عبد الله الشيعي البلاد سنة 296هـ ونهب أهل رقادة قصور بني الأغلب {cite:tarikh-ibn-khaldun-ibar p. 803}"
  en: "The last Aghlabid amir of Ifriqiya; he fled the Ubaydid Mahdi to Egypt then Iraq — and the Maghreb left the Abbasids' command {cite:tarikh-khulafa-minhaj-1434 p. 587}."
