id: person/ziyadat-allah-iii
class: person
label: { ar: "زيادة الله بن الأغلب" }
summary:
  ar: "آخر أمراء الأغالبة على إفريقية، هرب من وجه المهدي العبيدي إلى مصر ثم أتى العراق وخرجت المغرب عن أمر بني العباس من هذا التاريخ {cite:tarikh-khulafa-minhaj-1434 p. 587}. وعند المسعودي وردت هديته أبي مضر زيادة الله بن عبد الله على مدينة السلام سنة خمس وتسعين فيها مائتا خادم أسود وأبيض ومائة وخمسون جارية ومائة من الخيل العربية، وأخرجه من إفريقية أبو عبد الله المحتسب الداعية الذي ظهر في كتامة يدعو إلى عبيد الله سنة ست وتسعين وقيل خمس وتسعين ومائتين {cite:muruj-al-dhahab p. 647-648}، وعند ابن الأثير أنه بقي بعد خروجه عند المحابة مدة وهو مدمن الخمر واستمساح الملاهى وقيل بل سُمّ على يد بعض علمائه فسقط شعر لحيته، فعاد إلى مصر وقصد بيت المقدس فتوفى بالرملة ودُفن بها، وكانت مدة ملك بني الأغلب مائة سنة واثنتي عشرة سنة {cite:kamil-ibn-al-athir p. 17-18}، وعند ابن خلدون وهرب من رقادة إلى مصر حين ملك أبو عبد الله الشيعي البلاد سنة 296هـ ونهب أهل رقادة قصور بني الأغلب {cite:tarikh-ibn-khaldun-ibar p. 803}"
  en: "The last Aghlabid amir of Ifriqiya; he fled the Ubaydid Mahdi to Egypt then Iraq — and the Maghreb left the Abbasids' command {cite:tarikh-khulafa-minhaj-1434 p. 587}."
  es: "El último emir aglabí de Ifriqiya; huyó del Ubaydid Mahdi a Egipto y luego a Irak, y el Magreb abandonó el mando de los abasíes {cita:tarikh-khulafa-minhaj-1434 p. 587}."
  fr: "Le dernier émir aghlabide d'Ifriqiya; il a fui l'Ubaydid Mahdi vers l'Égypte puis l'Irak — et le Maghreb a quitté le commandement des Abbassides {cite:tarikh-khulafa-minhaj-1434 p. 587}."
  ur: "افریقیہ کا آخری اضلاب امیر؛ اس نے عبید مہدی کو مصر اور پھر عراق فرار کر دیا - اور مغرب نے عباسیوں کے حکم کو چھوڑ دیا 587}۔"
  tr: "Ifriqiya'nın son Aglebi prensi olan Ifrikiye, el-Mehdi el-Ubeydi'den Mısır'a kaçtı, ardından Irak'a geldi ve Fas o tarihten itibaren Abbasi hanedanından ayrıldı {atıf:History-Khulafa-minhaj-1434, s. 587}. Al-Mas'udi'ye göre, hediyesi 95 H. yılında Ebu Mudar Ziyadullah ibn Abdullah tarafından Salam şehrine alınmıştır; bu armağan, içinde iki yüz siyahi-beyaz hizmetçi, yüz elli köle kız ve yüz Arap atı bulunmuştur. Ayrıca, Kutama'da doksan altıncı yılda, bazılarına göre iki yüz doksan beş yılda Ubeyd Allah'a seslenen vaiz Ebu Abdullah el-Muhtasib tarafından da Ifriqiya'dan bildirilmiştir {cite:muruj-al-dhahab, s. 647-648}. İbn al-Athir'e göre, ayrıldıktan sonra bir süre alkol ve eğlence parklarının timsahına bağımlı olduğu sürede gözde kalmış, bazıları ise zehirlenmiştir Bazı alimlerinin elinden sakallı saçları döküldü, bu yüzden Mısır'a döndü ve Kudüs'e gitti, burada Ramla'da öldü ve orada defnedildi. Aghlab hanedanının hükümdarlığı yüz on iki yıl sürdü {atıf:kamil-ibn-al-athir s. 17-18}. İbn Haldun'a göre, Ebu Abdullah Şii 296 Hile ülkeyi yönettiğinde Rakkad'dan Mısır'a kaçtı ve Raqqad halkı Aglab saraylarını yağmaladı {cite:Tarikh-ibn-khaldun-ibar s. 803}"
  id: "Pangeran Aghlabid terakhir dari Ifriqiya, ia melarikan diri dari al-Mahdi al-Ubaydi ke Mesir, kemudian datang ke Irak, dan Maroko memisahkan diri dari dinasti Abbasiyah sejak tanggal itu {cite:History-Khulafa-minhaj-1434, hlm. 587}. Menurut Al-Mas'udi, hadiah itu diterima oleh Abu Mudar Ziyadullah ibn Abdullah ke kota Salam pada tahun 95 H, yang mencakup dua ratus pelayan kulit hitam dan putih, seratus lima puluh budak perempuan, dan seratus kuda Arab. Surat ini juga dilaporkan dari Ifriqiya oleh Abu Abdullah al-Muhtasib, pendakwah yang muncul di Kutama memanggil Ubayd Allah pada tahun sembilan puluh enam, atau beberapa mengatakan dua ratus sembilan puluh lima {cite:muruj-al-dhahab, hlm. 647-648}. Menurut Ibn al-Athir, setelah kepergiannya, ia tetap disukai untuk sementara waktu sementara saat kecanduan alkohol dan buaya taman hiburan, bahkan beberapa orang diracun Di tangan beberapa cendekiawannya, rambut janggutnya rontok, sehingga ia kembali ke Mesir dan menuju Yerusalem, di mana ia meninggal di Ramla dan dimakamkan di sana. Masa pemerintahan dinasti Aghlab berlangsung seratus dua belas tahun {cite:kamil-ibn-al-athir hlm. 17-18}. Menurut Ibn Khaldun, ia melarikan diri dari Raqqad ke Mesir ketika Abu Abdullah si Syiah memerintah tanah itu pada tahun 296 H, dan penduduk Raqqad menjarah istana-istana Aghlab {cite:Tarikh-ibn-khaldun-ibar hlm. 803}"
