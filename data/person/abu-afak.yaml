summary:
  ar: "شيخ من بني عمرو بن عوف ثم من بني عبيدة من الأوس؛ يقول ابن إسحاق إن نفاقه ظهر حين قُتل الحارث بن سويد بن الصامت فقال شعراً يذم فيه راكباً فرّق جمع أولاد قيلة، فقال النبي: من لي بهذا الخبيث؟ فقتله سالم بن عمير؛ وفي بيتي أمامة المزيرية إشارة إلى كبر سنه."
  en: "An old man of Banu Amr ibn Awf, then of Banu Ubayda, of al-Aws; Ibn Ishaq says his hypocrisy became open when al-Harith ibn Suwayd ibn al-Samit was killed, and he composed verses reviling a rider who had split the unity of the sons of Qayla; the Prophet said 'who will deal with this wretch for me?' and Salim ibn Umayr killed him; Umama al-Muzayriyya's verses allude to his great age."
