roles: [poet]
summary:
  ar: "شيخ من بني عمرو بن عوف ثم من بني عبيدة من الأوس؛ يقول ابن إسحاق إن نفاقه ظهر حين قُتل الحارث بن سويد بن الصامت فقال شعراً يذم فيه راكباً فرّق جمع أولاد قيلة، فقال النبي: من لي بهذا الخبيث؟ فقتله سالم بن عمير؛ وفي بيتي أمامة المزيرية إشارة إلى كبر سنه."
  en: "An old man of Banu Amr ibn Awf, then of Banu Ubayda, of al-Aws; Ibn Ishaq says his hypocrisy became open when al-Harith ibn Suwayd ibn al-Samit was killed, and he composed verses reviling a rider who had split the unity of the sons of Qayla; the Prophet said 'who will deal with this wretch for me?' and Salim ibn Umayr killed him; Umama al-Muzayriyya's verses allude to his great age."
  fr: "Un vieillard des Banu Amr ibn Awf, puis des Banu Ubayda, des Aws ; Ibn Ishaq dit que son hypocrisie devint manifeste lorsqu'al-Harith ibn Suwayd ibn al-Samit fut tué, et qu'il composa des vers injuriant un cavalier qui avait divisé l'unité des fils de Qayla ; le Prophète dit « qui me débarrassera de ce misérable ? » et Salim ibn Umayr le tua ; les vers d'Umama al-Muzayriyya font allusion à son grand âge."
  es: "Un anciano de Banu Amr ibn Awf, luego de Banu Ubayda, de al-Aws; Ibn Ishaq dice que su hipocresía quedó al descubierto cuando al-Harith ibn Suwayd ibn al-Samit fue asesinado, y compuso versos que insultaban a un jinete que había dividido la unidad de los hijos de Qayla; el Profeta dijo '¿quién se ocupará de este miserable por mí?' y Salim ibn Umayr lo mató; los versos de Umama al-Muzayriyya aluden a su avanzada edad."
