summary:
  en: "The senior Umayyad whom Quraysh and Kinana chose to lead them in the Fijar war against Qays 'Aylan, for his standing in age and honour; father of Abu Sufyan."
  ar: "الشيخ الأموي الذي قاد قريشاً وكنانة كلها في حرب الفجار ضد قيس عيلان لمكانته فيهم سناً وشرفاً؛ وهو والد أبي سفيان. وعند المسعودي أن الجن قتلته وأنهم قالوا فيه بيتين وقبر حرب بمكان قفر وليس قرب قبر حرب قبر، واستدل القوم على أنهما من قول الجن بأن أحداً من الناس لا يتأتى له أن ينشدهما ثلاث مرات متواليات لا يتتعتع فيهما {cite:muruj-al-dhahab p. 474}"
  es: "El alto rango del Imperio Omeya, a quien Quraysh y Kinana eligieron para liderarlos en la guerra de Fijar contra Qays 'Aylan, por su edad y honor; padre de Abu Sufyan."
  fr: "Le doyen des Omeyyades que les Quraysh et les Kinana ont choisi pour les mener dans la guerre des Fidjar contre Qays 'Aylan, en raison de son âge et de son honneur; père d'Abu Sufyan."
  ur: "وہ بزرگ اموی جن کو قریش اور کنانہ نے قیس عیلان کے خلاف فجر کی جنگ میں ان کی قیادت کے لیے منتخب کیا، اس کی عمر اور عزت کی وجہ سے؛ ابو سفیان کے والد"
  tr: "Yaş ve onur açısından aralarındaki konumu nedeniyle tüm Kureyş ve Kinana'yı Kays Aylan'a karşı kötü savaşta yöneten Emevi şeyhi; Ebu Sufyan'ın babasıdır. El-Mes'udi'ye göre, cinler onu öldürmüştür ve bununla ilgili iki ayet olduğunu söylerler; Harb'ın mezarı ise Harb'ın mezarına yakın olmayan ıssız bir yerde vardır. Halk, cinlerin ifadesinden, kimsenin bu mezarları üç kez arka arkaya uyanmadan okuyamadığını çıkarmıştır. {alıntı:Muruj-al-Dhahab, s. 474}"
  id: "Sheikh Umayyah yang memimpin seluruh Quraisy dan Kinana dalam perang orang jahat melawan Qays Aylan karena statusnya di antara mereka dalam usia dan kehormatan; dia adalah ayah dari Abu Sufyan. Menurut al-Mas'udi, jin membunuhnya, dan mereka mengatakan ada dua ayat tentangnya, dan makam Harb berada di tempat tandus, tidak dekat dengan makam Harb. Orang-orang menyimpulkan dari pernyataan jin bahwa tidak ada seorang pun di antara umat yang bisa mengucapkannya tiga kali berturut-turut tanpa terbangun. {kutip: Muruj-al-Dhahab, hlm. 474}"
