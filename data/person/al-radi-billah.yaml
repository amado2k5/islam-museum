label: { ar: "الراضي بالله أبو العباس محمد بن المقتدر", en: "al-Radi bi-llah Abu al-Abbas Muhammad ibn al-Muqtadir", fr: "al-Radi bi-llah Abu al-Abbas Muhammad ibn al-Muqtadir", es: "al-Radi bi-llah Abu al-Abbas Muhammad ibn al-Muqtadir", ur: "الردی باللہ ابو العباس محمد بن المقتدیر" }
summary:
  ar: "خليفة عباسي [٣٢٢–٣٢٩هـ]، أبو العباس محمد بن المقتدر بن المعتضد، ولد سنة سبع وتسعين وأمه أمة رومية اسمها ظلوم، بويع له يوم خلع القاهر في سادس جمادى الآخرة سنة اثنتين وعشرين فأمر ابن مقلة أن يكتب كتاباً فيه مثالب القاهر يقرأ على الناس {cite:tarikh-khulafa-minhaj-1434 p. 603}، ومات في ربيع الآخر سنة تسع وعشرين وله إحدى وثلاثون سنة ونصف وكان سمحاً كريماً أديباً شاعراً فصيحاً محباً للعلماء وله شعر مدون سمع الحديث من البغوي وغيره، وقال الخطيب للراضي فضائل منها أنه آخر خليفة له شعر مدون وآخر خليفة انفرد بتدبير الجيوش والأموال وآخر خليفة خطب يوم الجمعة وآخر خليفة جالس الندماء وآخر خليفة سافر بزي القدماء {cite:tarikh-khulafa-minhaj-1434 p. 606}. وعند المسعودي هو محمد بن جعفر المقتدر يكنى أبا العباس وأمه أم ولد يقال لها ظلوم، بويع يوم الخميس لست خلون من جمادى الأولى سنة اثنتين وعشرين وثلثمائة ومات حتف أنفه بمدينة السلام في ربيع الأول سنة تسع وعشرين فكانت خلافته ست سنين وأحد عشر شهراً، وكان أديباً شاعراً ظريفاً إن لم يضاه ابن المعتز فما نقص عنه، وله يا رب ليل قد دنا مزاره يسترني ومؤنسي أزاره، واستوزر ابن مقلة وعبد الرحمن بن عيسى بن الجراح ومحمد بن القاسم الكرخي وسليمان بن الحسن بن مخلد والفضل بن جعفر الفرات وابن محمد البريدي، وارتاض بالعلم وفنون الأدب وخاض في بحور الجدليين وأدبه العروضي على أخبار قتيبة بن مسلم {cite:muruj-al-dhahab p. 676-681}، وعند المسعودي كان كثير الاستعمال للطيب حسن الهيئة سخياً جواداً مقرباً لأهل العلم والأدب لا ينصرف عنه نديم إلا بصلة أو خلعة أو طيب، وعوتب فقال أستحسن فعل السفاح لأنه كان لا يحضره نديم ولا مغن فينصرف إلا بصلة وكان لا يؤخر إحسان محسن لغد، وكان الغالب عليه راغب الخادم وزيرك ومن غلمانه ذكي، ودفع إليه مؤدبه العروضي يوم مهرجان ديناراً ودرهماً عليهما صورة بجكم شاك في سلاحه ومكتوب إنما العز للأمير المعظم سيد الناس بجكم فاعتراه هم حتى أنشده العروضي شعر المأمون صل الندمان يوم المهرجان بصاف من معتقة الدنان فطرب وقعد في مجلس التاج على دجلة فكان من أحسن أيامه، وبلغ من كرمه أن جاريتين غنتا ضيفاً أجنبياً حتى استراح بين يديه فرحل فوهب له الراضي ما كان عليه من لباس وفرش نحو ألف دينار {cite:muruj-al-dhahab p. 685-689} وعند ابن الجوزي ورد إليه كتاب من ملك الروم سنة ست وعشرين بالرومية بالذهب والترجمة بالعربية بالفضة يطلب الهدنة فكتب الجواب بقبول الهدية والإذن في الفداء وهدنة سنة، وقطع يد ابن مقلة اليمنى سنة ست وعشرين لما ضمن فيه لابن رائق ألفي ألف دينار {cite:muntazam-ibn-al-jawzi p. 588-589}."
  en: "Abbasid caliph [322–329], Abu'l-Abbas Muhammad ibn al-Muqtadir, born 297 to a Roman slave Zulum, hailed the day al-Qahir was deposed — Ibn Muqla wrote up the deposed caliph's faults to be read to the people {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  fr: "Le calife abbasside [322-329], Abu'l-Abbas Muhammad ibn al-Muqtadir, né 297 d'un esclave romain Zulum, a salué le jour où al-Qahir a été déposé - Ibn Muqla a écrit les fautes du calife déposé pour être lu au peuple {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  es: "El califa abasí [322–329], Abu'l-Abbas Muhammad ibn al-Muqtadir, nacido en 297 de un esclavo romano llamado Zulum, celebró el día en que al-Qahir fue depuesto. Ibn Muqla escribió las faltas del califa depuesto para que fueran leídas al pueblo {cite:tarikh-khulafa-minhaj-1434 p. 603}."
  ur: "عباسی خلیفہ [322-329]، ابو العباس محمد ابن المقتدیر، جو 297 میں ایک رومی غلام زولوم کے ہاں پیدا ہوئے، نے القاہر کے معزول ہونے کے دن کی تعریف کی - ابن مقلہ نے معزول خلیفہ کے عیوب کو لوگوں کے سامنے پڑھا جانے کے لیے لکھا۔ 603}۔"
  tr: "Bir Abbasi halifesi [322–329 H.C.], Ebu el-Abbas Muhammed bin al-Muqtadir ibn al-Mu'tadid, doksan yedinci yılda Zlum adında bir Romalı kölenin çocuğu olarak doğdu. Yirmi iki yılın 6. Cumadeliu-Akhirah'ında el-Kahir'in tahttan indirildiği gün bağlılık yemini etti. İbn Mukalla, ona el-Kahir'in kusurlarını içeren bir kitap yazmasını emretti {alıntı:Tarikh-khulafa-minhaj-1434, s. 603}. Yirmi dokuz yılında, Rabi'al-Akhir'de otuz bir buçuk yaşında vefat etti. Cömert, cömert, edebi figür, etkileyici bir şair ve sevgi dolu alimdi; kayıtlı şiirleri ve duyulmuş hadisleri vardı El-Bağhavi ve diğerleri arasında. El-Hatib, el-Radi'ye erdemler atfetti; bunlar arasında şiir yazan son halife, orduları ve serveti yöneten son halife, Cuma vaazları veren son halife, pişman olanlarla oturan son halife ve kadimlerin kıyafetleriyle seyahat eden son halife olduğu yer almaktadır {cite:History-khulafa-minhaj-1434, s. 606}. El-Mes'udi'ye göre, kendisi Muhammed bin Ca'fer el-Muktadir, yani Ebu el-Abbas'tır ve annesi Zilum adında bir oğlunun annesiydi. 322 Hicri yılında, Cumada'd-Avval'den altı gün önce, Perşembe günü bağlılık yemini etti. 29 yılında Rabi'al-Awwal'daki barış şehrinde öldü, bu yüzden halifeliği altı yıl on bir ay sürdü. O bir edebi figürdü, esprili bir şairdi ve İbn al-Mu'tazz ona yetişemezse küçümsenmezdi. Bir gecesi yaklaşan türbesi vardı ve belinden korunmak istedi. İbn Mukalla ve Abdülrahman ibn İsa rehberlik aradı. İbn el-Cerrah, Muhammed ibn el-Kasım el-Karhi, Süleyman ibn el-Hasan ibn Mukhlad, el-Fadl ibn Ca'fer el-Furat ve İbn Muhammed el-Buraidi. Bilgi ve edebi sanatlara dalmış, diyalektik ölçülerine ve Qutaybah bin Müslüm'ün raporlarına dayanan prosodik edebiyatına dalmıştı {alıntı:muruj-al-dhahab, s. 676-681}. El-Mes'udi'ye göre sık sık 'teyib' (iyilik), iyi görünümlü, cömert ve cömert kelimesini kullanırdı ve alimler ile edebiyatçılarla yakındı. Hiçbir yoldaş, sadece bir bağ, bir cübbe ya da iyi bir ilişkiyle yüz çevirmezdi. Yanında bir yoldaş ya da şarkıcı olmadığı için kesmeyi tercih ettiğini söyleyerek azarlandı ve bu yüzden ayrılırdı. Tek bir olay dışında ve Mohsen'in iyiliğini yarına ertelemedi. Çoğunlukla Ragheb al-Khadem, sizin bakanınızdı ve gençlerinden biri zekiydi. Prosodik öğretmeni bayram gününde ona silahında bir sallanma resmi ve 'Şan, büyük prens, halkın efendisine aittir, yargınla birlikte' yazılı bir dinar ve bir dirhem ödedi. Onu vurdular, ta ki al-'Arudi el-Ma'mun şiirini okuyana kadar. Bayram günü, pişmanlık duası yaşlı adamın yerinden gelen açık bir işaretle vuruldu. Çok sevindi ve en iyi günlerinden biri olan Dicle Nehri'ndeki Taç toplantısına oturdu. Cömertliği o kadar ileri gitti ki, iki hizmetçi yabancı misafir olarak şarkı söyledi, ta ki dinlenene kadar. Onun önünde yola çıktı ve Al-Radi ona yaklaşık bin dinar giysi ve eşya hediye etti {cite:muruj-al-dhahab s. 685-689} İbn al-Jawzi, yirmi altıncı yılda Bizans kralından altın ve Arapça gümüş çevirisi olan bir mektup aldı; ateşkes talebinde bulundu. Hediyeyi kabul eden, fidye izni ve bir yıllık ateşkes içeren yanıtı yazdı. İbn Muqalla'nın sağ eli, yirmi altıncı yılda kesildi çünkü İbn Ra'iq'a iki bin dinar vaat etti {cite:Muntazam-ibn-al-jawzi s. 588-589}."
  id: "Seorang khalifah Abbasiyah [322–329 H], Abu al-Abbas Muhammad ibn al-Muqtadir ibn al-Mu'tadid, lahir pada tahun sembilan puluh tujuh dari seorang budak Romawi bernama Zlum. Ia disumpah setia pada hari al-Qahir digulingkan pada tanggal enam Jumada al-Akhirah tahun dua puluh dua. Ibn Muqalla memerintahkannya menulis sebuah buku yang memuat kelemahan al-Qahir untuk dibacakan kepada masyarakat {sitasi: Tarikh-khulafa-minhaj-1434, hlm. 603}. Ia meninggal di Rabi' al-Akhir pada tahun dua puluh sembilan pada usia tiga puluh satu setengah. Ia adalah sosok sastra yang murah hati, murah hati, penyair fasih, dan menyukai para ulama, dengan puisi tercatat dan hadis yang didengar Di antara al-Baghawi dan lainnya. Al-Khatib mengaitkan kebajikan kepada al-Radi, termasuk bahwa ia adalah khalifah terakhir yang menulis puisi, khalifah terakhir yang mengelola pasukan dan kekayaan, khalifah terakhir yang menyampaikan khotbah Jumat, khalifah terakhir yang duduk bersama orang-orang yang menyesal, dan khalifah terakhir yang bepergian dengan pakaian orang kuno {cite:History-khulafa-minhaj-1434, hlm. 606}. Menurut al-Mas'udi, ia adalah Muhammad ibn Ja'far al-Muqtadir, dikenal sebagai Abu al-Abbas, dan ibunya adalah ibu dari seorang putra bernama Dhulum. Ia bersumpah setia pada hari Kamis, enam hari sebelum Jumada al-Awwal, tahun 322 H. Ia meninggal di kota damai di Rabi' al-Awwal pada tahun 29, sehingga masa kejayaannya berlangsung enam tahun sebelas bulan. Ia adalah sosok sastra, penyair yang cerdas, dan jika Ibn al-Mu'tazz tidak bisa menandinginya, ia tidak akan berkurang. Ia mengalami malam yang makamnya semakin dekat, dan ia mencari perlindungan dari kain pinggangnya. Ibn Muqalla dan Abd al-Rahman ibn Isa mencari bimbingan. Ibn al-Jarrah, Muhammad ibn al-Qasim al-Karkhi, Sulayman ibn al-Hasan ibn Mukhlad, al-Fadl ibn Ja'far al-Furat, dan Ibn Muhammad al-Buraidi. Ia tenggelam dalam pengetahuan dan seni sastra, mendalami dialektika dan sastra prosodiknya berdasarkan laporan Qutaybah ibn Muslim {cite:muruj-al-dhahab, hlm. 676-681}. Menurut al-Mas'udi, ia sering menggunakan kata 'tayyib' (kebaikan), penampilan baik, murah hati, dan murah hati, serta dekat dengan para sarjana dan sastrawan. Tidak ada teman yang akan berpaling kecuali melalui hubungan, jubah, atau yang baik. Ia ditegur, mengatakan ia lebih suka melakukan pembantaian karena tidak ditemani oleh teman atau penyanyi, sehingga ia akan pergi. Kecuali satu insiden, dan dia tidak menunda kebaikan Mohsen untuk besok. Dia terutama adalah Ragheb al-Khadem, menterimu, dan salah satu pemudanya cerdik. Guru prosodiknya memberinya satu dinar dan dirham pada hari festival, keduanya dengan gambar guncangan di senjatanya dan tertuliskan: 'Kemuliaan milik pangeran agung, penguasa rakyat, dengan penilaianmu.' Mereka memukulnya sampai al-'Arudi membacakan puisi al-Ma'mun. Pada hari perayaan, doa penyesalan itu dipukul oleh tanda jelas dari tempat pria tua itu. Dia sangat senang dan duduk di pertemuan Mahkota di Tigris, yang merupakan salah satu hari terbaiknya. Kemurahan hatinya sampai dua pelayan bernyanyi sebagai tamu asing sampai dia beristirahat. Di hadapannya, ia berangkat, dan Al-Radi menghadiahkan sekitar seribu dinar dalam bentuk pakaian dan perlengkapan {cite:muruj-al-dhahab hlm. 685-689} Ibn al-Jawzi menerima surat dari raja Bizantium pada tahun dua puluh enam di Rumiya dalam emas dan terjemahan dalam bahasa Arab dalam perak, meminta gencatan senjata. Ia menulis balasan menerima hadiah, izin tebusan, dan gencatan senjata selama satu tahun. Tangan kanan Ibn Muqalla dipotong pada tahun dua puluh enam karena ia menjamin dua ribu dinar kepada Ibn Ra'iq {cite:Muntazam-ibn-al-jawzi hlm. 588-589}."
