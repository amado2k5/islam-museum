label: { ar: "الراضي بالله أبو العباس محمد بن المقتدر" }
summary:
  ar: "خليفة عباسي [٣٢٢–٣٢٩هـ]، أبو العباس محمد بن المقتدر بن المعتضد، ولد سنة سبع وتسعين وأمه أمة رومية اسمها ظلوم، بويع له يوم خلع القاهر في سادس جمادى الآخرة سنة اثنتين وعشرين فأمر ابن مقلة أن يكتب كتاباً فيه مثالب القاهر يقرأ على الناس {cite:tarikh-khulafa-minhaj-1434 p. 603}، ومات في ربيع الآخر سنة تسع وعشرين وله إحدى وثلاثون سنة ونصف وكان سمحاً كريماً أديباً شاعراً فصيحاً محباً للعلماء وله شعر مدون سمع الحديث من البغوي وغيره، وقال الخطيب للراضي فضائل منها أنه آخر خليفة له شعر مدون وآخر خليفة انفرد بتدبير الجيوش والأموال وآخر خليفة خطب يوم الجمعة وآخر خليفة جالس الندماء وآخر خليفة سافر بزي القدماء {cite:tarikh-khulafa-minhaj-1434 p. 606}.، وعند المسعودي هو محمد بن جعفر المقتدر يكنى أبا العباس وأمه أم ولد يقال لها ظلوم، بويع يوم الخميس لست خلون من جمادى الأولى سنة اثنتين وعشرين وثلثمائة ومات حتف أنفه بمدينة السلام في ربيع الأول سنة تسع وعشرين فكانت خلافته ست سنين وأحد عشر شهراً، وكان أديباً شاعراً ظريفاً إن لم يضاه ابن المعتز فما نقص عنه، وله يا رب ليل قد دنا مزاره يسترني ومؤنسي أزاره، واستوزر ابن مقلة وعبد الرحمن بن عيسى بن الجراح ومحمد بن القاسم الكرخي وسليمان بن الحسن بن مخلد والفضل بن جعفر الفرات وابن محمد البريدي، وارتاض بالعلم وفنون الأدب وخاض في بحور الجدليين وأدبه العروضي على أخبار قتيبة بن مسلم {cite:muruj-al-dhahab p. 676-681}"
  en: "Abbasid caliph [322–329], Abu'l-Abbas Muhammad ibn al-Muqtadir, born 297 to a Roman slave Zulum, hailed the day al-Qahir was deposed — Ibn Muqla wrote up the deposed caliph's faults to be read to the people {cite:tarikh-khulafa-minhaj-1434 p. 603}."
