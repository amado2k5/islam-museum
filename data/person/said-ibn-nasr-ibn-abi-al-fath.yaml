summary:
  ar: "أبو عثمان سعيد بن نصر، يعرف بابن أبي الفتح ⁦(315–395هـ)⁩، كان أبوه من كبار موالي عبد الرحمن الناصر المقدّمين عنده؛ أكثر عنه ابن عبد البر وأثنى عليه، وروى عنه «المجتبى» لقاسم بن أصبغ، وعنه قرأ رواية يحيى بن يحيى للموطأ التي بنى عليها التمهيد، عن قاسم بن أصبغ ووهب بن مسرة عن ابن وضاح {cite:tamhid-furqan-2017-v1 p. 14} {cite:tamhid-furqan-2017-v1 p. 201}."
  en: "Abu 'Uthman Sa'id b. Nasr, known as Ibn Abi al-Fath (315–395 AH), whose father was among the senior clients favoured by 'Abd al-Rahman al-Nasir; Ibn 'Abd al-Barr transmitted much from him and praised him, received from him Qasim b. Asbagh's *al-Mujtaba*, and heard from him the recension of the Muwatta' by Yahya b. Yahya on which the Tamhid rests, via Qasim b. Asbagh and Wahb b. Masarra from Ibn Waddah {cite:tamhid-furqan-2017-v1 p. 14} {cite:tamhid-furqan-2017-v1 p. 201}."
  ur: "ابو عثمان سعید بن نصر، ابن ابی الفتح کے نام سے معروف (315–395ھ)، جن کے والد عبد الرحمٰن الناصر کے مقرب بڑے موالی میں سے تھے؛ ابن عبد البر نے ان سے بکثرت روایت کی اور ان کی تعریف کی، ان سے قاسم بن اصبغ کی «المجتبیٰ» لی، اور ان سے یحییٰ بن یحییٰ کی روایتِ موطأ سنی جس پر تمہید کی بنیاد ہے، قاسم بن اصبغ اور وہب بن مسرہ کے واسطے سے ابن وضاح سے {cite:tamhid-furqan-2017-v1 p. 14} {cite:tamhid-furqan-2017-v1 p. 201}۔"
