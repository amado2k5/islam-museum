summary:
  ar: "الخليل بن أحمد القاضي ⁦(ت 378هـ)⁩، شيخ أهل الرأي في عصره؛ كان متقدماً في علم الفقه والوعظ، وسمع الحديث من محمد بن إسحاق بن خزيمة وأقرانه وسمع بالعراق البغوي وابن صاعد وأقرانهما، وتوفي في جمادى الآخرة سنة ثمان وسبعين وثلثمائة {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  en: "Al-Khalil b. Ahmad the qadi (d. 378), shaykh of the Hanafis in his time — foremost in fiqh and preaching; he heard hadith from Muhammad b. Ishaq b. Khuzayma and his peers and in Iraq from al-Baghawi and Ibn al-Sa'id and theirs; he died Jumada II 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  es: "Al-Khalil b. Ahmad el cadí (m. 378), shaykh de los hanafíes en su tiempo, el más importante en fiqh y predicación; escuchó hadices de Muhammad b. Ishaq b. Khuzayma y sus compañeros y en Irak de al-Baghawi e Ibn al-Sa'id y los de ellos; murió en Jumada II 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  fr: "Al-Khalil b. Ahmad le cadi (d. 378), cheikh des Hanafites de son temps — premier en fiqh et en prédication; il a entendu des hadiths de Muhammad b. Ishaq b. Khuzayma et de ses pairs et en Irak d'al-Baghawi et d'Ibn al-Sa'id et des leurs; il est mort Jumada II 378 {cite:muntazam-ibn-al-jawzi j.7 p.146}."
  ur: "الخلیل ب۔ احمد قادی ⁦(متوفی 378)⁩، اپنے زمانے میں حنفیوں کے شیخ - فقہ اور تبلیغ میں سب سے آگے؛ اس نے محمد سے حدیث سنی۔ اسحاق بی۔ خزیمہ اور ان کے ہم عمر افراد اور عراق میں البغوی اور ابن السعید اور ان سے؛ ان کی وفات جمادی الثانی 378ء میں ہوئی۔"
  tr: "Kendi döneminin önde gelen görüş âlimi El-Halil bin Ahmed el-Kadi (ö. 378 H) fıkıh ve vaaz konusunda ileri biriydi. Muhammed bin İshaq ibn Huzeymah ve onun meslektaşlarından, ayrıca el-Irak el-Baghavi, İbn Said ve onların akranlarından hadisler duydu. 378 Hicri yılında Cumada-el-Ahhirah'da öldü {atıf:muntazam-ibn-al-jawzi j.7 s.146}."
  id: "Al-Khalil ibn Ahmad al-Qadi (wafat 378 H), ulama terkemuka pada zamannya, maju dalam bidang hukum dan dakwah. Ia mendengar hadits dari Muhammad ibn Ishaq ibn Khuzaymah dan rekan-rekannya, serta dari al-Iraq al-Baghawi, Ibn Sa'id, dan rekan-rekan mereka. Ia meninggal di Jumada al-Akhirah pada tahun 378 H {cite:muntazam-ibn-al-jawzi j.7 hlm.146}."
