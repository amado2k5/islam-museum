  note: "His birth year is genuinely contested and the record does not smooth it over. The English and Urdu articles headline 1 March 1894, which the record follows, but both pair that date with 4 Jumada al-Ula 1324 AH — a Hijri date that converts to 1906, not 1894. The Urdu article's birth section further records a Shawwal 1314 AH birth from Kokab's Hayat-e-Salik, and a 1324 AH / 1906 CE reading supported by three printed biographies (Hayat-e-Salik; Mehr Ali Shah's Al-Yawaqit al-Mihriyya, 1384/1964; Sharaf Qadri's Tazkira Akabir Ahl-e-Sunnat, 1976). The Arabic article, from the Royal Aal al-Bayt Encyclopaedia of Islamic Civilisation, gives 1324–1391 AH / 1904–1971 CE, and Wikidata likewise gives 1904. The Hijri year shown is the conversion of the followed Gregorian date; the sources' own pairing is 1324. Budaun has no place entity, so no born_in edge is written."
