summary:
  ar: "مفسر ومفتٍ وعالم من شبه القارة (1894–1971 على رواية، والخلاف مسجل في محله)، وُلد في أجهاني بقضاء بدايون وتوفي في كجرات بالبنجاب الباكستاني، حيث درّس وأفتى عقوداً. تتلمذ في مدرسة شمس العلوم ببدايون والجامعة النعيمية بمراد آباد، ولقّب بحكيم الأمة، وأشهر آثاره «تفسير نعيمي» في أحد عشر مجلداً و«مرآة المناجيح» شرح مشكاة المصابيح."
  en: "Qur'an commentator, mufti and scholar of the subcontinent (1894–1971 on the followed reading; the conflict is recorded in the birth note), born at Ujhani in Budaun district and died at Gujrat in Pakistani Punjab, where he taught and issued fatwas for decades. He studied at Madrasa Shamsul Uloom, Budaun, and Jamia Naeemia, Moradabad, was honoured as Hakim al-Ummat, and is known for the eleven-volume Tafsir Naeemi and Mirat al-Manajih, his commentary on the Mishkat al-Masabih."
  ur: "برصغیر کے مفسر، مفتی اور عالم (1894ء–1971ء، متنازع تاریخِ ولادت اس کے نوٹ میں درج ہے)، اوجھیانی، ضلع بدایوں میں پیدا ہوئے اور گجرات (پنجاب، پاکستان) میں وصال ہوا، جہاں انھوں نے برسوں تدریس و افتا کیا۔ مدرسہ شمس العلوم بدایوں اور جامعہ نعیمیہ مراد آباد سے تعلیم پائی، «حکیم الامت» کا لقب ملا، اور مشہور تصانیف میں «تفسیر نعیمی» (11 جلدیں) اور «مرآۃ المناجیح» شامل ہیں۔"
