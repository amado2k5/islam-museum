summary:
  ar: "بطاقة أولية لقمر الدين آصف جاه الأول، وزير المغول الذي استقل بحيدر آباد، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Qamar al-Din Asaf Jah I, the Mughal vizier who made Hyderabad effectively independent, named from an open reference description (Wikidata); his entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Qamar al-Din Asaf Jah I, el visir mogol que hizo que Hyderabad fuera efectivamente independiente, nombrado a partir de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature pour Qamar al-Din Asaf Jah I, le vizir moghol qui a rendu Hyderabad effectivement indépendante, nommée d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "قمرالدین آصف جاہ اول کے لیے ڈرافٹ کارڈ، مغل وزیر جس نے حیدرآباد کو مؤثر طریقے سے آزاد کرایا، جس کا نام کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Haydarabad'da bağımsızlık kazanan Babür bakanı Qamar al-Din Asaf Jah I'in ön kartı açık bir referans açıklamasında (Wikidata) belirtilmiştir. Hasan İbrahim'in İslam Tarihi çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal Qamar al-Din Asaf Jah I, menteri Mughal yang merdeka di Hyderabad, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahan Sejarah Islam karya Hasan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
