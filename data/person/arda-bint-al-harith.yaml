summary:
  ar: "أردة بنت الحارث بن كلدة امرأة عتبة بن غزوان؛ كانت تحرض الناس على القتال يوم مدينة الفرات وهي تقول إن يهزموكم تولجوا فينا الغلف."
  en: "Arda bint al-Harith ibn Kallada, Utba ibn Ghazwan's wife; she goaded the men at the al-Furat city fight with her verse 'if they rout you, you'll enter us uncircumcised'."
  es: "Arda bint al-Harith ibn Kallada, esposa de Utba ibn Ghazwan, incitó a los hombres en la batalla de la ciudad de al-Furat con su verso: \"Si os derrotan, entraréis entre nosotros sin circuncidar\"."
  fr: "Arda bint al-Harith ibn Kallada, l'épouse d'Utba ibn Ghazwan; elle a provoqué les hommes lors du combat de la ville d'al-Furat avec son verset « s'ils vous mettent en déroute, vous entrerez chez nous incirconcis »."
  ur: "اردہ بنت الحارث ابن کلدہ، عتبہ بن غزوان کی بیوی؛ اس نے الفرات شہر کے مردوں کو اپنی آیت 'اگر وہ آپ کو شکست دیں گے تو آپ ہمیں بغیر ختنہ کے داخل کریں گے' کے ساتھ لڑنے پر مجبور کیا۔"
  tr: "Utbah bin Gazvan'ın eşi Ardah bint al-Harith ibn Kalda, Fırat şehri gününde insanları savaşmaya kışkırttı ve şöyle dedi: 'Eğer sizi yenerlerse, kamuflajı bize karşı çevirirsiniz.'"
  id: "Ardah bint al-Harith ibn Kalda, istri Utbah ibn Ghazwan, menghasut orang-orang untuk berperang pada hari kota Efrat, dengan berkata, 'Jika mereka mengalahkanmu, kamu akan membalikkan kamuflase itu melawan kami.'"
