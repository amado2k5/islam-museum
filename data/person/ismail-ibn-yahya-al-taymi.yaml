summary:
  ar: "إسماعيل بن يحيى بن إسماعيل بن عمر بن مسلم التيمي، صاحب الشافعي، وكان فقيهًا حاذقًا ثقة في الحديث وله عبادة وفضل وكان من خيار خلق الله ملازمًا للرباط؛ توفي يوم الأربعاء لأربع وعشرين ليلة خلت من ربيع الأول سنة أربع وستين ومائتين وصلى عليه الربيع بن سليمان {cite:muntazam-ibn-al-jawzi p. 136}."
  en: "Al-Shafi'i's companion al-Taymi — an adept jurist, trustworthy in hadith, a man of worship and merit who kept to the ribat; he died Wednesday 24 Rabi' I 264 and al-Rabi' ibn Sulayman led his funeral prayer {cite:muntazam-ibn-al-jawzi p. 136}."
  es: "El compañero de Al-Shafi'i, al-Taymi, un jurista experto, digno de confianza en los hadices, un hombre de culto y mérito que se mantuvo fiel al ribat, murió el miércoles 24 de Rabi' I de 264 y al-Rabi' ibn Sulayman dirigió su oración fúnebre {cite:muntazam-ibn-al-jawzi p. 136}."
  fr: "Le compagnon d'Al-Shafi'i, al-Taymi — un juriste compétent, digne de confiance en matière de hadith, un homme pieux et méritant qui respectait le ribat; il est décédé le mercredi 24 Rabi' I 264 et al-Rabi' ibn Sulayman a dirigé sa prière funéraire {cite:muntazam-ibn-al-jawzi p. 136}."
  ur: "شافعی کے ساتھی التیمی - ایک ماہر فقیہ، حدیث میں ثقہ، عبادت اور قابلیت کا آدمی جو رباط پر قائم تھا؛ ان کا انتقال بدھ 24 ربیع الثانی 264 کو ہوا اور ربیع ابن سلیمان نے ان کی نماز جنازہ پڑھائی۔ 136}۔"
  tr: "İsmail ibn Yahya ibn İsmail ibn Ömer ibn Müslim el-Teymi, el-Şafii'nin sahabi, hadis konusunda yetenekli ve güvenilir bir hukukçuydu; ibadet ve erdemiyle tanınır, Allah'ın yaratılışının en iyilerinden biriydi, her zaman ribatta kararlıydı. 264 Hicri yılında, Rabi'al-Awwal'dan yirmi dört gece önce, Çarşamba günü vefat etti ve el-Rabi' ibn Süleyman onun üzerine cenaze namazını yaptı {cite:muntazam-ibn-al-jawzi, s. 136}."
  id: "Ismail ibn Yahya ibn Ismail ibn Umar ibn Muslim al-Taymi, sahabat al-Shafi'i, adalah seorang ahli hukum hadis yang terampil dan dapat dipercaya, dikenal karena penyembahan dan kebajikannya, serta termasuk yang terbaik dari ciptaan Allah, selalu teguh dalam ribat. Ia wafat pada hari Rabu, dua puluh empat malam sebelum Rabi' al-Awwal pada tahun 264 H, dan al-Rabi' ibn Sulayman memimpin doa pemakaman untuknya {cite:muntazam-ibn-al-jawzi, hlm. 136}."
