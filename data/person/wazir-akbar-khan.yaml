summary:
  ar: "أمير وجنرال من أسرة بركزاي، ابن الأمير دوست محمد خان؛ أمير كابل من ديسمبر 1842 إلى أبريل 1843، ووزير أبيه ووليه على العهد حتى وفاته. ذاع صيته في معركة جمرود سنة 1837، وقاد الحزب الوطني في كابل أثناء الحرب الإنجليزية الأفغانية الأولى، فأبادت قواته الجيش البريطاني الهندي المنسحب في يناير 1842. توفي بالكوليرا في جلال آباد سنة 1847."
  en: "Barakzai prince and general, son of Emir Dost Mohammad Khan; Emir of Kabul from December 1842 to April 1843 and his father's vizier and heir apparent until his death. He won fame at the Battle of Jamrud in 1837 and led the Kabul national party in the First Anglo-Afghan War, whose forces destroyed the retreating British-Indian army in January 1842. He died of cholera at Jalalabad in 1847."
  ur: "بارکزئی شہزادے اور جنرل، امیر دوست محمد خان کے بیٹے؛ دسمبر 1842ء سے اپریل 1843ء تک کابل کے امیر اور وفات تک والد کے وزیر اور ولی عہد۔ 1837ء میں جمرود کی جنگ سے شہرت پائی اور پہلی اینگلو افغان جنگ میں کابل کی قومی جماعت کی قیادت کی، جس کی افواج نے جنوری 1842ء میں پسپا ہوتی برطانوی ہندی فوج کو تباہ کر دیا۔ 1847ء میں جلال آباد میں ہیضے سے وفات پائی۔"
