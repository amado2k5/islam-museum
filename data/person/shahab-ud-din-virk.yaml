summary:
  ar: "محامٍ وسياسي بنجابي من مقاطعة سيالكوت في الهند البريطانية (توفي 1946)، انتُخب لعضوية المجلس التشريعي في البنجاب سنة 1923 وتولى رئاسته ثلاث دورات متتالية (1925–1936)، ثم كان أول رئيس لمجلس البنجاب التشريعي بعد إنشائه (1937–1945). لا تسجل المصادر المتاحة تاريخ ميلاده."
  en: "Punjabi lawyer and politician of British India from Sialkot District (died 1946), elected to the Punjab Legislative Council in 1923 and its President for three consecutive terms (1925–1936), then the first Speaker of the Punjab Legislative Assembly from 1937 to 1945. No consulted source records his birth date."
  ur: "برطانوی ہند میں ضلع سیالکوٹ کے پنجابی وکیل و سیاست دان (وفات 1946)، جو 1923 میں پنجاب قانون ساز کونسل کے رکن بنے اور 1925 تا 1936 تین مسلسل مدتوں تک اس کے صدر رہے، پھر 1937 تا 1945 پنجاب قانون ساز اسمبلی کے پہلے سپیکر رہے۔ ان کی تاریخ پیدائش کسی ماخذ میں درج نہیں۔"
