summary:
  ar: "داعية ومناظر بريطاني في ركن الخطباء بهايد بارك في لندن، وأحد مؤسسي قناة «دعوة وايز» (DawahWise) ومديريها مع منصور؛ تُبث مناظراته وحواراته مع المسيحيين والملحدين واليهود وغيرهم عبر القناة، ويشارك في بثوثها المباشرة وسلسلتها الحوارية «إزالة الغموض عن الهندوسية»."
  en: "British street preacher and debater at Speakers' Corner in London's Hyde Park, and a co-founder and co-host of the DawahWise channel with Mansur; his debates and conversations with Christians, atheists, Jews and others are broadcast on the channel, and he takes part in its live streams and its 'Demystifying Hinduism' dialogue series."
  ur: "لندن کے ہائیڈ پارک کے اسپیکرز کارنر میں برطانوی مبلغ اور مباحث، اور «دعوہ وائز» (DawahWise) چینل کے منصور کے ساتھ شریک بانی اور میزبان؛ عیسائیوں، ملحدوں، یہودیوں اور دیگر کے ساتھ ان کے مباحثے اور گفتگوئیں چینل پر نشر ہوتی ہیں، اور وہ اس کی براہِ راست نشریات اور «ہندو مت کی وضاحت» مکالماتی سلسلے میں شریک ہوتے ہیں۔"
  es: "Predicador callejero británico y participante en debates en Speakers' Corner, en Hyde Park, Londres, y cofundador y copresentador del canal DawahWise junto con Mansur; sus debates y conversaciones con cristianos, ateos, judíos y otros se emiten en el canal, y participa en sus transmisiones en directo y en su serie de diálogos \"Desmitificando el hinduismo\"."
  fr: "Prédicateur de rue et orateur britannique à Speakers' Corner, dans le Hyde Park de Londres, il est également cofondateur et coanimateur de la chaîne DawahWise avec Mansur; ses débats et conversations avec des chrétiens, des athées, des juifs et d'autres sont diffusés sur la chaîne, et il participe à ses diffusions en direct et à sa série de dialogues « Démystifier l'hindouisme »."
  tr: "Londra'daki Hyde Park'taki Orators' Corner'da bulunan İngiliz vaiz ve tartışmacı, Mansour ile birlikte \"DawahWise\" kanalının kurucularından ve yöneticilerinden biri; kanal aracılığıyla Hristiyanlar, ateistler, Yahudiler ve diğerleriyle yapılan tartışma ve diyaloglarını yayınlıyor, canlı yayınlarına ve \"Mistifying Hinduism\" adlı sohbet programına katılıyor."
  id: "Seorang pengkhotbah dan debater Inggris di Orators' Corner di Hyde Park, London, serta salah satu pendiri dan direktur saluran \"DawahWise\" bersama Mansour; dia menyiarkan debat dan dialog Mansour dengan umat Kristen, ateis, Yahudi, dan lainnya melalui saluran tersebut, serta berpartisipasi dalam siaran langsung dan seri bincang-bincang \"Demistifying Hinduism.\""
