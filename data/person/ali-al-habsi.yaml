summary:
  ar: "حارس مرمى عُماني وُلد سنة 1981، وأول لاعب عُماني يبني مسيرة احترافية في أوروبا: لين النرويجي، وبولتون واندررز، وويغان أثلتيك الذي فاز معه بكأس الاتحاد الإنجليزي سنة 2013، وريدينغ، والهلال السعودي، ووست بروميتش ألبيون. كان حارس عُمان الأول لنحو عقدين، وفاز معها بكأس الخليج سنة 2009 ونال لقب أفضل حارس في البطولة أربع مرات، واعتزل سنة 2020."
  en: "Omani goalkeeper, born in 1981, and the first Omani footballer to build a career in Europe: Lyn in Norway, Bolton Wanderers, Wigan Athletic — with whom he won the FA Cup in 2013 — Reading, Al-Hilal in Saudi Arabia and West Bromwich Albion. Oman's first-choice goalkeeper for nearly two decades, he won the Arabian Gulf Cup with Oman in 2009 and was named the tournament's best goalkeeper four times. He retired in 2020."
  ur: "عمانی گول کیپر، 1981 میں پیدا ہوئے، اور یورپ میں کریئر بنانے والے پہلے عمانی فٹبالر: ناروے کے لین، بولٹن وانڈررز، ویگن ایتھلیٹک — جن کے ساتھ انہوں نے 2013 میں ایف اے کپ جیتا — ریڈنگ، سعودی الہلال اور ویسٹ برومویچ البیون۔ تقریباً دو دہائیوں تک عمان کے پہلے پسندیدہ گول کیپر رہے، 2009 میں عمان کے ساتھ عربین گلف کپ جیتا اور چار بار ٹورنامنٹ کے بہترین گول کیپر قرار پائے۔ 2020 میں ریٹائر ہوئے۔"
