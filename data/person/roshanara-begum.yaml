summary:
  ar: "روشن آرا بيغوم (3 سبتمبر 1617 – 11 سبتمبر 1671) أميرة مغولية وشاعرة، ثالث بنات الإمبراطور شاه جهان والممتاز محل. أنقذت أخاها أورنكزيب بتحذيره من مؤامرة أبيها، فكافأها بعد اعتلائه العرش بلقب «بادشاه بيغوم» خلفًا لأختها جهنرا، فصارت أقوى نساء الإمبراطورية حتى سقطت من الحظوة وجُردت من سلطتها وأُمرت باعتزال صالح في قصر حديقتها خارج دلهي، حيث دُفنت في «روشن آرا باغ» الذي أنشأته."
  en: "Roshanara Begum (3 September 1617 – 11 September 1671) was a Mughal princess and poet, the third daughter of Emperor Shah Jahan and Mumtaz Mahal. She saved her brother Aurangzeb by warning him of their father's plot against him, and on his accession he made her Padshah Begum in her sister Jahanara's place, the most powerful woman of the empire — until she fell from favour, was stripped of her powers and ordered into pious seclusion in her garden palace outside Delhi, where she is buried in the Roshanara Bagh she commissioned."
  ur: "روشن آرا بیگم (3 ستمبر 1617ء – 11 ستمبر 1671ء) مغل شہزادی اور شاعرہ تھیں، شہنشاہ شاہ جہاں اور ممتاز محل کی تیسری صاحبزادی۔ انھوں نے اپنے بھائی اورنگزیب کو والد کی سازش سے خبردار کر کے بچایا، تو تخت نشینی پر اورنگزیب نے انھیں اپنی بہن جہاں آرا کی جگہ «پادشاہ بیگم» بنایا اور وہ سلطنت کی سب سے طاقتور خاتون بن گئیں — یہاں تک کہ وہ عنایت سے گر گئیں، ان کے اختیارات چھن گئے اور انھیں دہلی کے باہر اپنے باغیچہ محل میں عبادت و اعتکاف کی زندگی کا حکم ہوا، جہاں وہ اپنے بنوائے ہوئے روشن آرا باغ میں دفن ہیں۔"

