summary:
  ar: "شاعر وكاتب باشكيري وتتاري (1880–1934)، من قادة الاتجاه الديمقراطي في الأدب التتري ومن مؤسسي أدب الأطفال القومي. وُلد في زيليم كارانوفو في أسرة معلّم، وتشكّل في مدارس أوتياشيفو وطرويسك وقازان وأوفا، وبعد وفاة عبد الله توقاي سنة 1913 صار الصوت الأبرز في الأدب التتري، ونال لقب شاعر شعب باشكيريا سنة 1923."
  en: "Bashkir and Tatar poet and writer (1880–1934), a leader of the democratic trend in Tatar literature and a founder of national children's literature. Born at Zilim-Karanovo into a teacher's family and formed at the madrasas of Utyashevo, Troitsk, Kazan and Ufa, he became the leading voice of Tatar literature after Gabdulla Tukay's death in 1913, and was named People's Poet of Bashkortostan in 1923."
  ur: "باشقیر اور تاتاری شاعر و ادیب (1880–1934)، تاتاری ادب کے جمہوری رجحان کے رہنماؤں اور قومی بچوں کے ادب کے بانیوں میں سے۔ زیلیم کارانوو میں ایک استاد کے گھرانے میں پیدا ہوئے، اوتیاشیو، تروئتسک، قازان اور اوفا کے مدارس میں تربیت پائی، 1913 میں عبداللہ توقائی کی وفات کے بعد تاتاری ادب کی نمایاں ترین آواز بنے، اور 1923 میں باشقیرستان کے عوامی شاعر قرار پائے۔"
