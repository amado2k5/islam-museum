summary:
  ar: "شاعر كشميري لُقّب بـ«شاعر كشمير»، أدخل أسلوباً جديداً في الشعر الكشميري ووسّع موضوعاته إلى الحب والوحدة الاجتماعية والإصلاح، وعمل موظفاً في إدارة الإيرادات (بتواري) متنقلاً في أرجاء الوادي."
  en: "Kashmiri poet honoured as Shayar-e-Kashmir, 'the poet of Kashmir', who brought a new style to Kashmiri poetry and widened its themes to love, communal unity and social reform, while working as a revenue official (patwari) posted across the valley."
  ur: "کشمیری شاعر جنھیں «شاعرِ کشمیر» کہا جاتا ہے؛ انھوں نے کشمیری شاعری میں نیا اسلوب متعارف کرایا اور اس کے موضوعات کو محبت، فرقہ وارانہ ہم آہنگی اور سماجی اصلاح تک وسعت دی، جب کہ وہ وادی میں پٹواری کے عہدے پر فائز رہے۔"
