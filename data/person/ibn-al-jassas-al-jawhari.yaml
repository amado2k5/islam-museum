summary:
  ar: "أبو عبد الله ابن الحصاص الجوهري؛ قبض عليه في جمادى الأولى سنة اثنتين وثلاثمائة وأُخذ منه ما قدره ستة عشر ألف ألف دينار عينًا وورقًا وأنيَّةً وثيابًا وخيلًا وخدمًا {cite:muntazam-ibn-al-jawzi p. 419}."
  en: "Abu Abdallah ibn al-Jassas (al-Hasas) the jeweller; arrested in Jumada I 302, sixteen million dinars in cash, silver, vessels, clothes, horses and servants seized from him {cite:muntazam-ibn-al-jawzi p. 419}."
  es: "Abu Abdallah ibn al-Jassas (al-Hasas), el joyero; arrestado en Jumada I 302, dieciséis millones de dinares en efectivo, plata, vasijas, ropa, caballos y sirvientes fueron confiscados de él {cite:muntazam-ibn-al-jawzi p. 419}."
  fr: "Abu Abdallah ibn al-Jassas (al-Hasas) le joaillier; arrêté en Jumada I 302, seize millions de dinars en espèces, argent, récipients, vêtements, chevaux et serviteurs saisis chez lui {cite: muntazam-ibn-al-jawzi p. 419}."
  ur: "ابو عبداللہ ابن الجصاص ⁦(الحصص)⁩ جوہری؛ جمادیہ اول 302 میں گرفتار کیا گیا، اس کے پاس سے سولہ ملین دینار نقد، چاندی، برتن، کپڑے، گھوڑے اور نوکر برآمد ہوئے۔ 419}۔"
  tr: "Ebu Abdullah bin el-Hasas el-Cevari; üç yüz iki yüz yaşında Cumede el-Avval'de yakalandı ve ondan yaklaşık on altı bin dinar ayni, kağıt, çatal gereç, giysi, at ve hizmetçi aldı {atıf:Muntazam-ibn-al-Jawzi, s. 419}."
  id: "Abu Abdullah ibn al-Hasas al-Jawhari; ia ditangkap di Jumada al-Awwal pada tahun tiga ratus dua ratus dan mengambil dari namanya sekitar enam belas ribu dinar dalam bentuk barang, kertas, peralatan, pakaian, kuda, dan pelayan {cite:muntazam-ibn-al-jawzi, hlm. 419}."
