id: person/abu-umar-abd-al-aziz-ibn-marwan-al-bahrani
class: person
label:
  ar: أبو عمر عبد العزيز بن مروان البحراني
  en: Abu Umar Abd al-Aziz ibn Marwan of Bahrain
  fr: "Abu Umar Abd al-Aziz ibn Marwan de Bahreïn"
  ur: ابو عمر عبد العزیز بن مروان بحرینی
  es: "Abu Umar Abd al-Aziz ibn Marwan of Bahrain"
summary:
  ar: رجل من أهل البحرين يكنى أبا عمر، ولاه الهادي أثافت، وقتله أرحب بن الدعام وبنو سلمان فيها سنة 285هـ بحسب الكتاب.
  en: A man of Bahrain with the kunya Abu Umar, whom al-Hadi put over Athafit and whom Arhab ibn al-Da'am and Banu Salman killed there in 285 AH, by the book's account.
  fr: "Un homme de Bahreïn portant la kunya Abu Umar, qu'al-Hadi plaça à la tête d'Athafit et qu'Arhab ibn al-Da'am et les Banu Salman y tuèrent en 285 H, selon le récit du livre."
  ur: بحرین کا ایک شخص، کنیت ابو عمر، جسے ہادی نے اثافت پر مقرر کیا اور جسے کتاب کے مطابق 285ھ میں ارحب بن دعام اور بنو سلمان نے وہیں قتل کیا۔
  es: "Un hombre de Bahréin con la kunya Abu Umar, a quien al-Hadi puso al frente de Athafit y a quien Arhab ibn al-Da'am y Banu Salman mataron allí en el año 285 AH, según relata el libro."
  tr: "Kitaba göre, Bahreynli ve lakabı Ebu Ömer olan bir adam, El-Hadi Athaft tarafından atanmış ve Arhab bin El-Da'am ile Beni Salman kabilesi tarafından Hicri 285 yılında orada öldürülmüştür."
  id: "Seorang pria dari Bahrain, yang dijuluki Abu Omar, diangkat oleh Al-Hadi Athaft, dan Arhab bin Al-Da’am serta Bani Salman membunuhnya di sana pada tahun 285 Hijriah, menurut kitab tersebut."
