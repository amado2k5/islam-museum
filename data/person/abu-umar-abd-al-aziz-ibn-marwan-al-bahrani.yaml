summary:
  ar: رجل من أهل البحرين يكنى أبا عمر، ولاه الهادي أثافت، وقتله أرحب بن الدعام وبنو سلمان فيها سنة 285هـ بحسب الكتاب.
  en: A man of Bahrain with the kunya Abu Umar, whom al-Hadi put over Athafit and whom Arhab ibn al-Da'am and Banu Salman killed there in 285 AH, by the book's account.
  ur: بحرین کا ایک شخص، کنیت ابو عمر، جسے ہادی نے اثافت پر مقرر کیا اور جسے کتاب کے مطابق 285ھ میں ارحب بن دعام اور بنو سلمان نے وہیں قتل کیا۔
