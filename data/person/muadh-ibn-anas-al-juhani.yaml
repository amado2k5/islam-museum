summary:
  ar: "معاذ بن أنس الجهني الأنصاري، صحابي غزا مع النبي، ونزل مصر. روى عن النبي وعن أبي الدرداء وكعب الأحبار، وعنه ابنه سهل بن معاذ ولم يرو عنه غيره، وهو لين الحديث. ذكر العسكري ما يدل على أنه بقي إلى خلافة عبد الملك بن مروان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
  en: "Muadh ibn Anas al-Juhani al-Ansari, a Companion who fought with the Prophet and settled in Egypt. He narrated from the Prophet, Abu al-Darda' and Ka'b al-Ahbar; only his son Sahl narrated from him, and his hadith is weak. Al-Askari indicates that he lived into the caliphate of Abd al-Malik ibn Marwan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3495}"
