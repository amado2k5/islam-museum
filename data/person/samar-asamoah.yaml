summary:
  ar: "مقدمة بودكاست وكاتبة بريطانية أسلمت في التاسعة عشرة، من أصل أفريقي كاريبي وُلدت ونشأت في لندن؛ بدأت لبس النقاب سنة 2009 وأطلقت من إذاعة رمضانية محلية سنة 2019 بودكاست «يوميات المنتقبة» الذي يشارك قصص النساء المنتقبات من أنحاء العالم، وألفت كتاب «كيف تكونين أمًا مسلمة عزباء»، وهي فنانة ومعالجة بالحجامة مقيمة في نيوكاسل أبون تاين."
  en: "British podcast host and author who embraced Islam at 19; of African Caribbean heritage and born and raised in London. She began wearing the niqab in 2009 and in 2019 grew a local Ramadan radio show into The Niqabi Diaries podcast, which shares the stories of niqab-wearing women around the world. She is the author of How to Be a Single Muslim Mum, and an artist and hijama therapist based in Newcastle upon Tyne."
  ur: "برطانوی پوڈکاسٹ میزبان اور مصنفہ جنہوں نے انیس سال کی عمر میں اسلام قبول کیا؛ افریقی کیریبین پس منظر سے تعلق رکھتی ہیں اور لندن میں پیدا ہوئیں اور پلی بڑھیں۔ انہوں نے 2009 میں نقاب پہننا شروع کیا اور 2019 میں ایک مقامی رمضان ریڈیو شو سے «دی نقابی ڈائریز» پوڈکاسٹ کا آغاز کیا، جو دنیا بھر کی نقاب پوش خواتین کی کہانیاں پیش کرتا ہے۔ وہ «ہاؤ ٹو بی اے سنگل مسلم مم» کی مصنفہ، فنکارہ اور حجامہ معالجہ ہیں اور نیو کیسل اپون ٹائن میں مقیم ہیں۔"
  es: "Presentadora de podcasts y autora británica que abrazó el islam a los 19 años; de ascendencia afrocaribeña, nació y creció en Londres. Comenzó a usar el niqab en 2009 y en 2019 transformó un programa de radio local sobre el Ramadán en el podcast The Niqabi Diaries, que comparte las historias de mujeres que usan niqab en todo el mundo. Es autora de How to Be a Single Muslim Mum, artista y terapeuta de hijama, residente en Newcastle upon Tyne."
  fr: "Animatrice de podcast et auteure britannique, elle s'est convertie à l'islam à l'âge de 19 ans. D'origine afro-caribéenne, elle est née et a grandi à Londres. Elle porte le niqab depuis 2009 et, en 2019, a transformé une émission de radio locale diffusée pendant le Ramadan en podcast, « The Niqabi Diaries », qui partage les témoignages de femmes portant le niqab à travers le monde. Elle est l'auteure de « How to Be a Single Muslim Mum » et exerce également comme artiste et thérapeute spécialisée dans la hijama, installée à Newcastle upon Tyne."
  tr: "On dokuz yaşında İslam'a geçen, Afrikalı Karayipler kökenli, Londra'da doğup büyüyen İngiliz podcast sunucusu ve yazar; 2009'da niqab takmaya başladı ve 2019'da yerel bir Ramazan radyo istasyonundan 'Niqab Günlüğü' adlı podcast'i başlattı; bu podcast niqab takan kadınların hikayelerini paylaşıyor ve 'How to Be a Single Muslim Mother' adlı kitabı yazdı. Newcastle upon Tyne'da yaşayan bir sanatçı ve kupa terapistidir."
  id: "Seorang pembawa podcast dan penulis asal Inggris yang memeluk Islam pada usia sembilan belas tahun, berasal dari Afrika Karibia, lahir dan besar di London; ia mulai mengenakan niqab pada tahun 2009 dan meluncurkan podcast 'Diary of the Niqab' dari stasiun radio lokal Ramadan pada tahun 2019, yang membagikan kisah perempuan yang mengenakan niqab, dan menulis buku 'How to Be a Single Muslim Mother.' Ia adalah seorang seniman dan terapis cupping yang berbasis di Newcastle upon Tyne."
