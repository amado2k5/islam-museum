summary:
  ar: "مقدمة بودكاست وكاتبة بريطانية أسلمت في التاسعة عشرة، من أصل أفريقي كاريبي وُلدت ونشأت في لندن؛ بدأت لبس النقاب سنة 2009 وأطلقت من إذاعة رمضانية محلية سنة 2019 بودكاست «يوميات المنتقبة» الذي يشارك قصص النساء المنتقبات من أنحاء العالم، وألفت كتاب «كيف تكونين أمًا مسلمة عزباء»، وهي فنانة ومعالجة بالحجامة مقيمة في نيوكاسل أبون تاين."
  en: "British podcast host and author who embraced Islam at 19; of African Caribbean heritage and born and raised in London. She began wearing the niqab in 2009 and in 2019 grew a local Ramadan radio show into The Niqabi Diaries podcast, which shares the stories of niqab-wearing women around the world. She is the author of How to Be a Single Muslim Mum, and an artist and hijama therapist based in Newcastle upon Tyne."
  ur: "برطانوی پوڈکاسٹ میزبان اور مصنفہ جنہوں نے انیس سال کی عمر میں اسلام قبول کیا؛ افریقی کیریبین پس منظر سے تعلق رکھتی ہیں اور لندن میں پیدا ہوئیں اور پلی بڑھیں۔ انہوں نے 2009 میں نقاب پہننا شروع کیا اور 2019 میں ایک مقامی رمضان ریڈیو شو سے «دی نقابی ڈائریز» پوڈکاسٹ کا آغاز کیا، جو دنیا بھر کی نقاب پوش خواتین کی کہانیاں پیش کرتا ہے۔ وہ «ہاؤ ٹو بی اے سنگل مسلم مم» کی مصنفہ، فنکارہ اور حجامہ معالجہ ہیں اور نیو کیسل اپون ٹائن میں مقیم ہیں۔"
