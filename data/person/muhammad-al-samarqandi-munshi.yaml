summary:
  ar: "السيد شهاب الدين محمد بن السديد السمرقندي الحسيني المنشي؛ قال في النور عن جدنا: كان من فضلاء عصره، يكتب بخمسة ألسنة بالعربية والتركية والفارسية والطخارية والأوزبكية وبها ينشئ وينشد، وكان حافظاً للقرآن ضابطاً لكثير من الآداب، وأخذ الحديث عن السيد أبي الفضل المدني وشهاب الدين الحسيني والعجز السمرقندي؛ وكانت مكتبته تزيد على ألف وتسعين كتاباً وعلى مائة نسخة حديث، وكان يطالع كثيراً ويستحسن ويحاضر طلبة العلم؛ توفي ليلة الخميس تاسع المحرم في قصبة حيان {cite:shadharat-dhahab p. 435}."
  en: "Shihab al-Din Muhammad al-Samarqandi al-Husayni — munshi who wrote and composed in Arabic, Turkish, Persian, Tajik and Uzbek; Qur'an-hafiz, hadith student of Abu al-Fadl al-Madani; his library held over 1,090 books and a hundred hadith codices; died Thursday eve 9 Muharram 996 at Hayyan {cite:shadharat-dhahab p. 435}."
