summary:
  ar: "السيد شهاب الدين محمد بن السديد السمرقندي الحسيني المنشي؛ قال في النور عن جدنا: كان من فضلاء عصره، يكتب بخمسة ألسنة بالعربية والتركية والفارسية والطخارية والأوزبكية وبها ينشئ وينشد، وكان حافظاً للقرآن ضابطاً لكثير من الآداب، وأخذ الحديث عن السيد أبي الفضل المدني وشهاب الدين الحسيني والعجز السمرقندي؛ وكانت مكتبته تزيد على ألف وتسعين كتاباً وعلى مائة نسخة حديث، وكان يطالع كثيراً ويستحسن ويحاضر طلبة العلم؛ توفي ليلة الخميس تاسع المحرم في قصبة حيان {cite:shadharat-dhahab p. 435}."
  en: "Shihab al-Din Muhammad al-Samarqandi al-Husayni — munshi who wrote and composed in Arabic, Turkish, Persian, Tajik and Uzbek; Qur'an-hafiz, hadith student of Abu al-Fadl al-Madani; his library held over 1,090 books and a hundred hadith codices; died Thursday eve 9 Muharram 996 at Hayyan {cite:shadharat-dhahab p. 435}."
  es: "Shihab al-Din Muhammad al-Samarqandi al-Husayni — munshi que escribió y compuso en árabe, turco, persa, tayiko y uzbeko; Qu'an-hafiz, estudiante de hadices de Abu al-Fadl al-Madani; su biblioteca contenía más de 1090 libros y cien códices de hadices; murió el jueves víspera del 9 de Muharram de 996 en Hayyan {cite:shadharat-dhahab p. 435}."
  fr: "Shihab al-Din Muhammad al-Samarqandi al-Husayni — munshi qui écrivait et composait en arabe, turc, persan, tadjik et ouzbek; hafiz du Coran, étudiant en hadiths d'Abu al-Fadl al-Madani; sa bibliothèque contenait plus de 1 090 livres et une centaine de codex de hadiths; est décédé le jeudi soir 9 Muharram 996 à Hayyan {cite: shadharat-dhahab p. 435}."
  ur: "شہاب الدین محمد ال سمرقندی الحسینی - منشی جس نے عربی، ترکی، فارسی، تاجک اور ازبک میں لکھا اور کمپوز کیا۔ حافظ قرآن، ابو الفضل مدنی کے شاگرد حدیث؛ ان کی لائبریری میں 1,090 سے زیادہ کتابیں اور ایک سو حدیث کے رموز موجود تھے۔ آپ کا انتقال جمعرات کی شام 9 محرم 996 کو حیان میں ہوا۔ 435}۔"
  tr: "Seyyid Şihab el-Din Muhammed bin el-Sadid el-Sadra'l-Sadraāḥānī el-Ḥaḥāḥī el-Şahaḥāṭīnī el-Ḥāḥāḥī el-Munşi; büyükbabamızdan al-Nur'da şöyle demiştir: Kendi döneminin seçkin alimleri arasındaydı, beş dilde yazmıştı: Arapça, Türkçe, Farsça, Tukhari ve Özbekçe, ve Kitapta okundu. Kur'an'ı ezberlemiş, birçok edebin ustasıydı ve Seyyid Ebu el-Fadl el-Medeni, Şihab el-Dīḥāḥīnī ve al-ʿajz al-Samarqandī'den hadisler öğrenmiştir. Kütüphanesi bin doksan kitabı ve yüz adet hadis nüshasını aşmıştır. Bilgi öğrencilerine çokça okudu, övdü ve ders verdi; Muharrem ayının dokuzuncusu Perşembe gecesi Hayyan kasabasında vefat etti {alıntı: Shadharat-Dhahab, s. 435}."
  id: "Sayyid Shihab al-Din Muhammad ibn al-Sadid al-Sadrāḥānī al-Ḥaḥāḥī al-Ḥaḥāṭīnī al-Ḥāḥāḥī al-Munshi; ia berkata dalam al-Nur dari kakek kami: Ia termasuk ulama terkemuka pada zamannya, menulis dalam lima bahasa: Arab, Turki, Persia, Tukhari, dan Uzbek, serta membaca dan membaca dalam bahasa tersebut. Ia adalah seorang penghafal Al-Qur'an, ahli dalam berbagai tata krama, dan mempelajari hadits dari Sayyid Abu al-Fadl al-Madani, Shihab al-Dīḥāḥīnī, dan al-ʿajz al-Samarqandī. Perpustakaannya melebihi seribu sembilan puluh buku dan seratus eksemplar hadits. Ia membaca secara luas, memuji dan memberi ceramah kepada para pelajar ilmu; ia wafat pada malam Kamis, tanggal sembilan Muharram, di kota Hayyan {cite:Shadhat-Dhahab, hlm. 435}."
