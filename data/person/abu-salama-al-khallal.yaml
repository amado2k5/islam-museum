id: person/abu-salama-al-khallal
class: person
label:
  ar: أبو سلمة الخلال
  en: Abu Salama al-Khallal
  ur: ابو سلمہ خلال
gender: male
roles:
- vizier
summary:
  ar: داعي بني العباس بالكوفة، أوصى إليه بكير بن ماهان وأقرّه الإمام محمد بن علي، وكان يبيع الخل، ونزل عنده أبو العباس وأبو جعفر حين قدما الكوفة؛ ثم جعله أبو العباس وزيراً ولُقّب «وزير آل محمد»، وقتله رجل بعثه أبو مسلم، فيما يروي الدينوري {cite:akhbar-tiwal-amir p. 334} {cite:akhbar-tiwal-amir p. 359} {cite:akhbar-tiwal-amir p. 370}.
  en: The Abbasid missionary at Kufa, appointed by Bukayr ibn Mahan and confirmed by the imam Muhammad ibn Ali; a vinegar-seller, he hosted Abu al-Abbas and Abu Ja'far when they came to Kufa. Abu al-Abbas then made him vizier, known as 'the vizier of the family of Muhammad', and he was killed by a man sent by Abu Muslim, as al-Dinawari reports {cite:akhbar-tiwal-amir p. 334} {cite:akhbar-tiwal-amir p. 359} {cite:akhbar-tiwal-amir p. 370}.
  ur: کوفہ میں بنو عباس کے داعی، جنہیں بکیر بن ماہان نے مقرر کیا اور امام محمد بن علی نے برقرار رکھا؛ وہ سرکہ فروش تھے اور ابو العباس اور ابو جعفر کوفہ آئے تو انہی کے مہمان ہوئے۔ پھر ابو العباس نے انہیں وزیر بنایا اور وہ «وزیرِ آلِ محمد» کہلائے، اور دینوری کی روایت میں ابو مسلم کے بھیجے ہوئے ایک آدمی نے انہیں قتل کیا {cite:akhbar-tiwal-amir p. 334} {cite:akhbar-tiwal-amir p. 359} {cite:akhbar-tiwal-amir p. 370}۔
