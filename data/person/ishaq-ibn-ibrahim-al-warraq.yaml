summary:
  ar: "إسحاق الوراق، راوي اختيار خلف بن هشام وحده في قول ابن الجزري، توفي سنة 286هـ؛ وصفه بأنه ثقة قيّم بالقراءة ضابط لها منفرد برواية اختيار خلف لا يُعرف غيره {cite:nashr-dahman-damascus-1345-v1 p. 202}."
  en: "Ishaq al-Warraq, transmitter of the choice of Khalaf ibn Hisham, who died in 286 AH. Ibn al-Jazari describes him as reliable, a firm upholder and exact master of the reading, singular in his transmission of Khalaf's choice and known for nothing else {cite:nashr-dahman-damascus-1345-v1 p. 202}."
  ur: "اسحاق وراق، خلف بن ہشام کے اختیار کے راوی، 286ھ میں فوت ہوئے؛ ابن الجزری انہیں ثقہ، قراءت پر قائم اور اس کے ضابط، خلف کے اختیار کی روایت میں منفرد اور کسی اور چیز کے ساتھ نہ جانے جانے والے بتاتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 202}."
  es: "Ishaq al-Warraq, transmisor de la elección de Khalaf ibn Hisham, quien murió en el año 286 de la Hégira. Ibn al-Jazari lo describe como confiable, un firme defensor y un maestro exacto de la lectura, singular en su transmisión de la elección de Khalaf y conocido por nada más {cite:nashr-dahman-damascus-1345-v1 p. 202}."
  fr: "Ishaq al-Warraq, transmetteur du choix de Khalaf ibn Hisham, décédé en 286 AH. Ibn al-Jazari le décrit comme fiable, un fervent défenseur et un maître exact de la lecture, singulier dans sa transmission du choix de Khalaf et connu pour rien d'autre {cite:nashr-dahman-damascus-1345-v1 p. 202}."
