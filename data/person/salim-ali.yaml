summary:
  ar: "عالم طيور وطبيعة هندي، لُقّب بـ«رجل الطيور في الهند»: أول هندي أجرى مسوحًا منهجية للطيور في أنحاء الهند، وشخصية محورية في جمعية بومباي للتاريخ الطبيعي، وشارك س. ديلون ريبلي في تأليف «دليل طيور الهند وباكستان» بأجزائه العشرة؛ نال بادما بهوشان (1958) وبادما فيبهوشان (1976)."
  en: "Indian ornithologist and naturalist, known as the Birdman of India: the first Indian to conduct systematic bird surveys across India, a key figure behind the Bombay Natural History Society after 1947, and co-author with S. Dillon Ripley of the ten-volume Handbook of the Birds of India and Pakistan; he received the Padma Bhushan (1958) and the Padma Vibhushan (1976)."
  ur: "ہندوستانی ماہرِ طیور اور فطری تاریخ، «برڈ مین آف انڈیا» کے لقب سے مشہور: بھارت بھر میں پرندوں کا باقاعدہ سروے کرنے والے پہلے ہندوستانی، بمبئی نیچرل ہسٹری سوسائٹی کی مرکزی شخصیت، اور ایس ڈلن رپلے کے ساتھ دس جلدوں پر مشتمل «ہینڈ بک آف دی برڈز آف انڈیا اینڈ پاکستان» کے شریک مصنف؛ انھیں پدم بھوشن (1958ء) اور پدم وبھوشن (1976ء) سے نوازا گیا۔"
