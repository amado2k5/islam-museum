summary:
  ar: "سراج الدين أبو حفص عمر بن علي بن أحمد الأنصاري الأندلسي ثم القاهري الشافعي، المعروف بابن الملقن، حافظ مصر ومحدثها وفقيهها الشافعي في القرن الثامن الهجري؛ ولد بالقاهرة يوم السبت رابع عشر ربيع الأول سنة ٧٢٣هـ، وتوفي أبوه وله سنة فرباه زوج أمه الملقن معلِّم القرآن بالجامع الطولوني فعُرف به، وتخرج بالرحبي ومغلطاي ورحل إلى دمشق سنة ٧٧٧هـ فأفتى ودرّس وكتب له تاج الدين السبكي تقريظاً على شرح المنهاج، وامتحن سنة ٧٨٠هـ في قصة برقوق والأمير بركة فلم يدخل في النيابة بعدها، وصنّف نحو ثلاثمائة مصنف احترق أكثرها قبل موته بيسير، وتوفي في سادس شهر ربيع الأول سنة ٨٠٤هـ ودفن بحوش الصوفية خارج باب النصر {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}."
  en: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, Andalusi by origin then Cairene, known as Ibn al-Mulaqqin — Egypt's hafiz, muhaddith and Shafi'i jurist of the eighth Hijri century; born at Cairo on Saturday 14 Rabi' I 723, orphaned at one year and raised by his mother's husband al-Mulaqqin, the Qur'an teacher of the Tulunid mosque, from whom he took his name; he trained under al-Rahbi and Mughaltay, travelled to Damascus in 777 and gave fatwas and lessons, earning a written commendation from Taj al-Din al-Subki on his Sharh al-Minhaj; tried in 780 in the Barquq–Baraka affair, he never entered the judiciary again; he wrote near three hundred works, most of them burnt shortly before his death, and died on 6 Rabi' I 804, buried beside his father in the hawsh of the Sufis outside Bab al-Nasr {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}."
  ur: "سراج الدین ابوحفص عمر بن علی بن احمد انصاری اندلسی، بعد میں قاہری شافعی — معروف بہ ابن ملقن — آٹھویں صدی ہجری کے مصر کے حافظ، محدث اور شافعی فقیہ؛ ہفتہ 14 ربیع الاول 723ھ کو قاہرہ میں پیدا ہوئے، ایک سال کی عمر میں یتیم ہوئے اور اپنی والدہ کے شوہر ملقن — جامع طولون کے معلم قرآن — کے گھر پلے جن کے نام سے مشہور ہوئے؛ رحبی اور مغلطائے سے تربیت پائی، 777ھ میں دمشق کا سفر کیا اور فتویٰ اور تدریس دی، تاج الدین سبکی نے ان کے شرح المنهاج پر تحریری تقریظ لکھی؛ 780ھ میں برقوق اور امیر برکہ کے معاملے میں آزمائے گئے اور پھر کبھی نیابت میں نہ داخل ہوئے؛ تقریباً تین سو تصانیف لکھیں جن میں سے اکثر وفات سے کچھ پہلے جل گئیں؛ 6 ربیع الاول 804ھ کو فوت ہوئے اور باب النصر کے باہر حوش صوفیہ میں اپنے والد کے پہلو میں دفن ہوئے {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}۔"
  es: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, de origen andalusí y luego cairota, conocido como Ibn al-Mulaqqin, hafiz, muhaddith y jurista shafi'í de Egipto del siglo VIII de la Hégira; nació en El Cairo el sábado 14 de Rabi' I de 723, quedó huérfano al año y fue criado por el esposo de su madre, al-Mulaqqin, maestro del Corán de la mezquita Tulunid, de quien tomó su nombre; se formó con al-Rahbi y Mughaltay, viajó a Damasco en 777 y dio fatuas y lecciones, ganándose una elogio escrito de Taj al-Din al-Subki en su Sharh al-Minhaj; juzgado en 780 en el asunto Barquq-Baraka, nunca volvió a entrar en la judicatura; Escribió cerca de trescientas obras, la mayoría de las cuales se quemaron poco antes de su muerte, y murió el 6 de Rabi' I de 804, enterrado junto a su padre en el hawsh de los sufíes fuera de Bab al-Nasr {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}."
  fr: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, d'origine andalouse puis cairote, connu sous le nom d'Ibn al-Mulaqqin — hafiz, muhaddith et juriste chaféite égyptien du VIIIe siècle de l'Hégire; né au Caire le samedi 14 Rabi' I 723, orphelin à l'âge d'un an et élevé par le mari de sa mère, al-Mulaqqin, le professeur de Coran de la mosquée toulounide, dont il prit le nom; il se forma auprès d'al-Rahbi et de Mughaltay, se rendit à Damas en 777 et donna des fatwas et des leçons, obtenant une recommandation écrite de Taj al-Din al-Subki sur son Sharh al-Minhaj; jugé en 780 dans l'affaire Barquq-Baraka, il n'entra plus jamais dans le système judiciaire; Il a écrit près de trois cents œuvres, dont la plupart ont brûlé peu avant sa mort, et il est mort le 6 Rabi' I 804, enterré à côté de son père dans le hawsh des Soufis à l'extérieur de Bab al-Nasr {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}."
  tr: "Siraj al-Din Ebu Hafs Ömer bin Ali bin Ahmed el-Ensari el-Endülüsi, o zamanlar el-Kahiri el-Şafii, İbn el-Mulqan olarak bilinir, Mısır'ın hafizi, hadis âlimi ve sekizinci yüzyılda Şafi fıhiliydi; 723 Hicri Rabi'l-Awwal'ın on dördüncü günü Kahire'de doğdu. Babası bir yaşında vefat etti, bu yüzden annesinin babası, Kur'an öğretmeni, onu Tuluni Camii'nde büyüttü ve bu konuda tanındı. El-Rahbi ve Mughlatai'den mezun oldu ve 777 Hicri'de Şam'a gitti; burada fetvalar verdi, öğretti ve Taceddin el-Subki onun için Minhaj üzerine eleştirel bir tefsir yazdı. 780 Hicri yılında Barquq hikayesinde sınavı verdi. Prens Baraka bundan sonra vekil olmadı. Yaklaşık üç yüz eser yazdı, bunların çoğu ölümünden önce yakıldı. 804 Hicri yılında, Rabi'al-Awwal'ın altıncısında öldü ve Bab al-Nasr dışındaki Sufi avlularına defnedildi {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl s. 121-123}."
  id: "Siraj al-Din Abu Hafs Umar ibn Ali ibn Ahmad al-Ansari al-Andalusi, kemudian al-Qahiri al-Shafi'i, dikenal sebagai Ibn al-Mulqan, adalah Hafiz Mesir, ulama hadis dan ahli hukum Shafi'i pada abad kedelapan H; lahir di Kairo pada hari Sabtu, tanggal keempat belas Rabi' al-Awwal, 723 H. Ayahnya meninggal pada usia satu tahun, sehingga kakek dari pihak ibu, guru Al-Qur'an, membesarkannya di Masjid Tulani, dan ia dikenal karenanya. Ia lulus dari Al-Rahbi dan Mughlatai dan melakukan perjalanan ke Damaskus pada tahun 777 H, di mana ia mengeluarkan fatwa, mengajar, dan Taj al-Din al-Subki menulis untuknya dalam komentar kritis tentang Minhaj. Ia mengikuti ujian pada tahun 780 H, dalam kisah Barquq. Pangeran Baraka tidak menjadi wakil setelah itu. Ia menulis sekitar tiga ratus karya, sebagian besar dibakar sebelum kematiannya. Ia meninggal pada tanggal enam Rabi' al-Awwal tahun 804 H dan dimakamkan di halaman Sufi di luar Bab al-Nasr {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl hlm. 121-123}."
