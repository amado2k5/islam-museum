summary:
  ar: "سراج الدين أبو حفص عمر بن علي بن أحمد الأنصاري الأندلسي ثم القاهري الشافعي، المعروف بابن الملقن، حافظ مصر ومحدثها وفقيهها الشافعي في القرن الثامن الهجري؛ ولد بالقاهرة يوم السبت رابع عشر ربيع الأول سنة ٧٢٣هـ، وتوفي أبوه وله سنة فرباه زوج أمه الملقن معلِّم القرآن بالجامع الطولوني فعُرف به، وتخرج بالرحبي ومغلطاي ورحل إلى دمشق سنة ٧٧٧هـ فأفتى ودرّس وكتب له تاج الدين السبكي تقريظاً على شرح المنهاج، وامتحن سنة ٧٨٠هـ في قصة برقوق والأمير بركة فلم يدخل في النيابة بعدها، وصنّف نحو ثلاثمائة مصنف احترق أكثرها قبل موته بيسير، وتوفي في سادس شهر ربيع الأول سنة ٨٠٤هـ ودفن بحوش الصوفية خارج باب النصر {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}."
  en: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, Andalusi by origin then Cairene, known as Ibn al-Mulaqqin — Egypt's hafiz, muhaddith and Shafi'i jurist of the eighth Hijri century; born at Cairo on Saturday 14 Rabi' I 723, orphaned at one year and raised by his mother's husband al-Mulaqqin, the Qur'an teacher of the Tulunid mosque, from whom he took his name; he trained under al-Rahbi and Mughaltay, travelled to Damascus in 777 and gave fatwas and lessons, earning a written commendation from Taj al-Din al-Subki on his Sharh al-Minhaj; tried in 780 in the Barquq–Baraka affair, he never entered the judiciary again; he wrote near three hundred works, most of them burnt shortly before his death, and died on 6 Rabi' I 804, buried beside his father in the hawsh of the Sufis outside Bab al-Nasr {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}."
  ur: "سراج الدین ابوحفص عمر بن علی بن احمد انصاری اندلسی، بعد میں قاہری شافعی — معروف بہ ابن ملقن — آٹھویں صدی ہجری کے مصر کے حافظ، محدث اور شافعی فقیہ؛ ہفتہ 14 ربیع الاول 723ھ کو قاہرہ میں پیدا ہوئے، ایک سال کی عمر میں یتیم ہوئے اور اپنی والدہ کے شوہر ملقن — جامع طولون کے معلم قرآن — کے گھر پلے جن کے نام سے مشہور ہوئے؛ رحبی اور مغلطائے سے تربیت پائی، 777ھ میں دمشق کا سفر کیا اور فتویٰ اور تدریس دی، تاج الدین سبکی نے ان کے شرح المنهاج پر تحریری تقریظ لکھی؛ 780ھ میں برقوق اور امیر برکہ کے معاملے میں آزمائے گئے اور پھر کبھی نیابت میں نہ داخل ہوئے؛ تقریباً تین سو تصانیف لکھیں جن میں سے اکثر وفات سے کچھ پہلے جل گئیں؛ 6 ربیع الاول 804ھ کو فوت ہوئے اور باب النصر کے باہر حوش صوفیہ میں اپنے والد کے پہلو میں دفن ہوئے {cite:shadharat-dhahab 7/44-45} {cite:durar-kamina-jil-1993 dhayl pp. 121-123}۔"
