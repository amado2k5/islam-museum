summary:
  ar: "علي بن الحسين بن سهل المعروف بشيلمة، كان مع صاحب الزنج إلى آخر أيامه ثم لحق بأبي أحمد الموفق في الأمان، فرُفع إلى المعتضد بالله أنه يدعو إلى رجل لم يُوقَف على اسمه وأنه قد أفسد جماعة، فأخذه المعتضد فقرّره فلم يُقِرّ، وسأله عن الرجل الذي يدعو إليه فقال لو كان تحت قدمي ما رفعتها عنه، فقُتل وصُلب لسبع خلون من المحرم سنة ثمانين ومائتين {cite:muntazam-ibn-al-jawzi p. 141-142}."
  en: "Ali ibn al-Husayn ibn Sahl, known as Shaylama — a companion of the Zanj leader to his last days who then joined al-Muwaffaq under amnesty; denounced to al-Mu'tadid as a secret propagandist, he refused to name the man he called to, saying 'were he beneath my foot I would not lift it', and was killed and gibbeted on 23 Muharram 280 {cite:muntazam-ibn-al-jawzi p. 141-142}."
  es: "Ali ibn al-Husayn ibn Sahl, conocido como Shaylama, compañero del líder Zanj hasta sus últimos días, quien luego se unió a al-Muwaffaq bajo amnistía; denunciado ante al-Mu'tadid como propagandista secreto, se negó a nombrar al hombre al que llamó, diciendo 'aunque estuviera bajo mi pie, no lo levantaría', y fue asesinado y colgado en la horca el 23 de Muharram de 280 {cite:muntazam-ibn-al-jawzi p. 141-142}."
  fr: "Ali ibn al-Husayn ibn Sahl, connu sous le nom de Shaylama — un compagnon du chef Zanj jusqu'à ses derniers jours qui a ensuite rejoint al-Muwaffaq sous amnistie; dénoncé à al-Mu'tadid comme un propagandiste secret, il a refusé de nommer l'homme qu'il a appelé, disant « s'il était sous mon pied, je ne le soulèverais pas », et a été tué et pendu le 23 Muharram 280 {cite:muntazam-ibn-al-jawzi p. 141-142}."
  ur: "علی بن الحسین ابن سہل، جسے شیلمہ کے نام سے جانا جاتا ہے - زنج کے رہنما کے آخری ایام تک کے ساتھی تھے جنہوں نے پھر عام معافی کے تحت الموفق میں شمولیت اختیار کی۔ المتدید کو ایک خفیہ پروپیگنڈہ کرنے والے کے طور پر ملامت کرتے ہوئے، اس نے اس شخص کا نام بتانے سے انکار کر دیا جس کو اس نے پکارا تھا، یہ کہتے ہوئے کہ 'اگر وہ میرے پاؤں کے نیچے ہوتا تو میں اسے نہ اٹھاتا'، اور 23 محرم 280 کو قتل کر دیا گیا اور غیبت کر دی گئی۔ 141-142}۔"
  tr: "Ali ibn al-Husayn ibn Sahl, namı diğer Şilima olarak, Zanj liderinin son günlerine kadar yanındaydı, sonra Ebu Ahmed el-Muvaffaq'a güvenle katıldı. El-Mu'tadid Billah'a, adı tanınmayan bir adamı çağırdığını ve bir topluluğu yozlaştırdığını söyledi. El-Mu'tadid onu aldı ama kabul etmedi. Çağırdığı adamı sordu ve o dedi ki, 'Ayaklarımın altında olsaydı, onu ondan kaldırmazdım.' 280 Hicri yılında Muharrem önünde yedi kez öldürüldü ve çarmıha gerildi {alıntı:Muntazam-ibn-al-jawzi s. 141-142}."
  id: "Ali ibn al-Husayn ibn Sahl, yang dikenal sebagai Shilima, bersama pemimpin Zanj hingga hari-hari terakhirnya, lalu ia bergabung dengan Abu Ahmad al-Muwaffaq dengan selamat. Ia menyampaikan kepada al-Mu'tadid Billah bahwa ia memanggil seorang pria yang namanya tidak dikenal dan telah merusak sebuah komunitas. Al-Mu'tadid mengambilnya, tetapi ia menolak menerimanya. Ia menanyakan tentang orang yang ia panggil, dan ia berkata, 'Jika ia berada di bawah kakiku, aku tidak akan mengambilnya darinya.' Ia dibunuh dan disalibkan tujuh kali di hadapan Muharram pada tahun 280 H {cite:Muntazam-ibn-al-jawzi hlm. 141-142}."
