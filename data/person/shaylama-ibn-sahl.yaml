summary:
  ar: "علي بن الحسين بن سهل المعروف بشيلمة، كان مع صاحب الزنج إلى آخر أيامه ثم لحق بأبي أحمد الموفق في الأمان، فرُفع إلى المعتضد بالله أنه يدعو إلى رجل لم يُوقَف على اسمه وأنه قد أفسد جماعة، فأخذه المعتضد فقرّره فلم يُقِرّ، وسأله عن الرجل الذي يدعو إليه فقال لو كان تحت قدمي ما رفعتها عنه، فقُتل وصُلب لسبع خلون من المحرم سنة ثمانين ومائتين {cite:muntazam-ibn-al-jawzi p. 141-142}."
  en: "Ali ibn al-Husayn ibn Sahl, known as Shaylama — a companion of the Zanj leader to his last days who then joined al-Muwaffaq under amnesty; denounced to al-Mu'tadid as a secret propagandist, he refused to name the man he called to, saying 'were he beneath my foot I would not lift it', and was killed and gibbeted on 23 Muharram 280 {cite:muntazam-ibn-al-jawzi p. 141-142}."
