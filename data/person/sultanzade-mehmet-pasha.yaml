summary:
  ar: "بطاقة أولية لسلطان زاده محمد باشا، بيلربي مصر ثم الصدر الأعظم العثماني في ١٦٤٤–١٦٤٦م في عهد إبراهيم، أُعدم سنة ١٦٤٦م؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Sultanzade Mehmet Pasha, the beylerbey of Egypt then Ottoman grand vizier of 1644–1646 under Ibrahim, executed in 1646; the source entry is not yet checked on the page."
  es: "Boleta de nombramiento para Sultanzade Mehmet Pasha, beylerbey de Egipto y luego gran visir otomano entre 1644 y 1646 bajo el mandato de Ibrahim, ejecutada en 1646; la entrada de origen aún no ha sido verificada en la página."
  fr: "Carte de conscription du sultan Mehmet Pacha, beylerbey d'Égypte puis grand vizir ottoman de 1644 à 1646 sous Ibrahim, exécutée en 1646; la source n'est pas encore vérifiée sur la page."
  ur: "سلطان زادے مہمت پاشا کے لیے کارڈ کا مسودہ، مصر کے اس وقت کے عثمانی وزیر اعظم 1644-1646، ابراہیم کے تحت، 1646 میں پھانسی دی گئی۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İbrahim'in saltanatı sırasında Mısır'ın lideri ve ardından 1644-1646 yılları arasında Osmanlı İmparatorluğu'nun Sadrazami olan Sultanzadeh Muhammed Paşa'nın ön kartı; Osmanlı tarih kitaplarında adı geçmektedir ve çevirisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Sultanzadeh Muhammad Pasha, pemimpin Mesir dan kemudian Wazir Agung Kekaisaran Ottoman dari tahun 1644 hingga 1646 M selama masa pemerintahan Ibrahim, dieksekusi pada tahun 1646 M; ia disebutkan dalam buku sejarah Ottoman, dan terjemahannya belum pernah diulas di halaman tersebut."
