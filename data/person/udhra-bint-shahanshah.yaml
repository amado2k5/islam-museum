summary:
  ar: "عذراء عصمة الدين خاتون بنت شاهنشاه بن أيوب، أميرة من الأيوبيين وبنت أخي السلطان صلاح الدين، وإليها تنسب المدرسة العذراوية في دمشق وهي من آثارها، وتوفيت بدمشق سنة 593 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 222} {cite:wafayat-ayan}."
  en: "Udhra, Ismat al-Din Khatun, daughter of Shahanshah ibn Ayyub, an Ayyubid princess and the niece of Sultan Salah al-Din; the Udhrawiyya madrasa in Damascus is among her monuments and is named for her; she died in Damascus in 593 AH (1196 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 222} {cite:wafayat-ayan}."
  es: "Udhra, Ismat al-Din Khatun, hija de Shahanshah ibn Ayyub, una princesa ayubí y sobrina del sultán Salah al-Din; la madrasa Udhrawiyya en Damasco se encuentra entre sus monumentos y lleva su nombre; murió en Damasco en el año 593 AH (1196 d. C.) {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 222} {cite:wafayat-ayan}."
  fr: "Udhra, Ismat al-Din Khatun, fille de Shahanshah ibn Ayyub, une princesse ayyoubide et la nièce du sultan Salah al-Din; la madrasa Udhrawiyya à Damas est parmi ses monuments et porte son nom; elle est décédée à Damas en 593 AH (1196 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 4 p. 222} {cite:wafayat-ayan}."
  ur: "اُدھرا، عصمت الدین خاتون، شہنشاہ ابن ایوب کی بیٹی، ایک ایوبی شہزادی اور سلطان صلاح الدین کی بھانجی؛ دمشق میں اُدرویہ مدرسہ اس کی یادگاروں میں سے ہے اور اس کا نام اس کے نام پر رکھا گیا ہے۔ ان کا انتقال دمشق میں 593 ہجری ⁦(1196 عیسوی)⁩ میں ہوا۔ 4ص 222} {حوالہ: وفایت-عیان}۔"
  tr: "Azraa İsmet al-Din Hatun bint Şahanshah ibn Ayyub, Eyübi prensesi ve Sultan Salah al-Din'in yeğeni, Şam'daki Adhrawiyya okulunun ona atfedildiği ve kalıntıları arasında yer aldığı bir okuldur. 593 Hicri yılında Şam'da öldü {cite:alam-zirikli-dar-al-ilm-2002 cilt 4, s. 222} {cite:wafayat-ayan}."
  id: "Azraa Ismat al-Din Khatun bint Shahanshah ibn Ayyub, seorang putri Ayyubiyah dan keponakan Sultan Salah al-Din, yang mana aliran Adhrawiyya di Damaskus dikaitkan dan termasuk di antara peninggalannya. Ia meninggal di Damaskus pada tahun 593 H {cite:alam-zirikli-dar-al-ilm-2002 vol. 4, hlm. 222} {cite:wafayat-ayan}."
