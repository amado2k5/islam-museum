summary:
  ar: "سياسي مالاوي (مواليد 1978) نجل الرئيس باكيلي مولوزي. انتُخب نائبا عن ماشينغا الشمالية الشرقية سنة 2004 وبقي حتى 2019، وقاد الجبهة الديمقراطية للوحدة، واعتُقل سنة 2012 إثر تجمع للمعارضة، وتولى حقائب وزارية في حكومتي جويس باندا وبيتر موثاريكا بينها التخطيط الاقتصادي والموارد الطبيعية والداخلية والأراضي والصحة، وترشح للرئاسة سنة 2019 وكان مرشح موثاريكا لمنصب نائب الرئيس سنة 2020."
  en: "Malawian politician (born 1978), the son of President Bakili Muluzi. He was elected MP for Machinga North East in 2004 and held the seat until 2019, led the United Democratic Front, was arrested in 2012 after an opposition rally, and held ministerial portfolios under Presidents Joyce Banda and Peter Mutharika — economic planning, natural resources, home affairs, lands and health — stood for the presidency in 2019 and was Mutharika's running mate in 2020."
  ur: "ملاوی کے سیاست دان (پیدائش 1978ء)، صدر بکیلی مولوزی کے بیٹے۔ وہ 2004ء میں ماشینگا شمال مشرق سے رکنِ پارلیمنٹ منتخب ہوئے اور 2019ء تک رہے، یونائیٹڈ ڈیموکریٹک فرنٹ کی قیادت کی، 2012ء میں ایک اپوزیشن ریلی کے بعد گرفتار ہوئے، اور صدور جوائس بانڈا اور پیٹر موتھاریکا کی حکومتوں میں اقتصادی منصوبہ بندی، قدرتی وسائل، داخلہ، اراضی اور صحت کی وزارتیں سنبھالیں، 2019ء میں صدارتی امیدوار بنے اور 2020ء میں موتھاریکا کے نائب صدارتی امیدوار تھے۔"
