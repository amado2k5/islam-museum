label:
  ar: دقاق بن تتش
  en: Duqaq ibn Tutush
summary:
  ar: "دقاق بن تاج الدولة تتش بن ألب أرسلان؛ كان بقلعة دمشق لما قتل أبوه سنة 488هـ فبعث إليه ساوتكين الخادم يستدعيه للملك فسار إليه ووصل دمشق قبل أن يدركه أخوه رضوان، وأشار عليه باغيسيان صاحب أنطاكية بالاستبداد بدمشق على أخيه ففعل، واستوزر الخوارزمي وحكمه في دولته، وتوفي سنة 497هـ فاستقل أتابكه طغركين بالملك وخطب لأخيه تلتاش صبياً مراهقاً."
  en: "Duqaq ibn Taj al-Dawla Tutush ibn Alp Arslan; he was in Damascus castle when his father fell in 488 AH, summoned to kingship by Sawtakin the eunuch and reached Damascus before his brother Ridwan's courier — on Yaghisiyan of Antioch's advice he held Damascus independently of his brother, made al-Khawarizmi his vizier and controller of the state, and died in 497, whereupon his atabeg Tughtakin took power and proclaimed his infant brother Tultash."
