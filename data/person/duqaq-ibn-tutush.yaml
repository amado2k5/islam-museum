summary:
  ar: "دقاق بن تاج الدولة تتش بن ألب أرسلان؛ كان بقلعة دمشق لما قتل أبوه سنة 488هـ فبعث إليه ساوتكين الخادم يستدعيه للملك فسار إليه ووصل دمشق قبل أن يدركه أخوه رضوان، وأشار عليه باغيسيان صاحب أنطاكية بالاستبداد بدمشق على أخيه ففعل، واستوزر الخوارزمي وحكمه في دولته، وتوفي سنة 497هـ فاستقل أتابكه طغركين بالملك وخطب لأخيه تلتاش صبياً مراهقاً."
  en: "Duqaq ibn Taj al-Dawla Tutush ibn Alp Arslan; he was in Damascus castle when his father fell in 488 AH, summoned to kingship by Sawtakin the eunuch and reached Damascus before his brother Ridwan's courier — on Yaghisiyan of Antioch's advice he held Damascus independently of his brother, made al-Khawarizmi his vizier and controller of the state, and died in 497, whereupon his atabeg Tughtakin took power and proclaimed his infant brother Tultash."
  es: "Duqaq ibn Taj al-Dawla Tutush ibn Alp Arslan; se encontraba en el castillo de Damasco cuando su padre cayó en el año 488 de la Hégira, fue llamado al trono por Sawtakin el eunuco y llegó a Damasco antes que el mensajero de su hermano Ridwan. Siguiendo el consejo de Yaghisiyan de Antioquía, gobernó Damasco independientemente de su hermano, nombró a al-Khawarizmi su visir y controlador del estado, y murió en el año 497, tras lo cual su atabeg Tughtakin tomó el poder y proclamó a su hermano pequeño Tultash."
  fr: "Duqaq ibn Taj al-Dawla Tutush ibn Alp Arslan; il se trouvait au château de Damas lorsque son père tomba en 488 AH, appelé à la royauté par Sawtakin l'eunuque et arriva à Damas avant le messager de son frère Ridwan — sur les conseils de Yaghisiyan d'Antioche, il détint Damas indépendamment de son frère, fit d'al-Khawarizmi son vizir et contrôleur de l'État, et mourut en 497, après quoi son atabeg Tughtakin prit le pouvoir et proclama son jeune frère Tultash."
  ur: "دقاق ابن تاج الدولہ طوتش ابن الپ ارسلان; وہ دمشق کے قلعے میں تھا جب 488 ہجری میں اس کے والد کا انتقال ہوا، خواجہ سرا ساوتاکین کے ذریعہ بادشاہی کے لیے بلایا گیا اور اپنے بھائی رضوان کے کورئیر سے پہلے دمشق پہنچا - انطاکیہ کے مشورے پر اس نے دمشق کو اپنے بھائی سے آزاد رکھا، الخوارزمی کو اپنا وزیر اور حاکم بنایا، جہاں اس کی وفات ہوئی، 488 ہجری میں اس کی ریاست کا کنٹرول تھا۔ اقتدار سنبھالا اور اپنے شیر خوار بھائی طلعت کا اعلان کیا۔"
  tr: "Daqaq ibn Tac al-Dawla Tutuch ibn Alp Arslan; babası 488 Hicri yılında öldürüldüğünde Şam kalesindeydi. Onu krala çağırması için hizmetçi Savetkin'i gönderdi, bu yüzden ona yürüdü ve kardeşi Ridwan yetişmeden önce Şam'a ulaştı. Antakya hükümdarı Baghisian, ona kardeşi yerine Şam'ı despotlaştırmasını tavsiye etti ve o da bunu yaptı. El-Hwarizmi'yi bakan olarak atadı ve devletini yönetti. 497 Hicri'de öldü, böylece Atabega Tuğrkin kral oldu ve genç yaşta kardeşi Tlataş'a evlenme teklif etti."
  id: "Daqaq ibn Taj al-Dawla Tutuch ibn Alp Arslan; ia berada di benteng Damaskus ketika ayahnya dibunuh pada tahun 488 H. Ia mengirim Savetkin sebagai pelayan untuk memanggilnya kepada raja, sehingga ia berjalan ke arahnya dan tiba di Damaskus sebelum saudaranya Ridwan menyusulnya. Baghisian, penguasa Antiokhia, menyarankan agar ia menindas Damaskus atas saudaranya, dan ia melakukannya. Ia mengangkat Al-Khwarizmi sebagai menteri dan memerintah negaranya. Ia meninggal pada tahun 497 H, sehingga Atabega Tughrkin menjadi raja dan melamar saudaranya Tlatash saat masih remaja."
