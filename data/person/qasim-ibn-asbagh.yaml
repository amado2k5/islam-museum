id: person/qasim-ibn-asbagh
class: person
label: { ar: "قاسم بن أصبغ" }
summary:
  ar: "محدث قرطبة؛ قدم العراق سنة 276هـ مع صاحبه محمد بن أيمن فوجدا أبا داود قد مات قبل وصولهما بيسير فعمل كل واحد منهما مصنفاً في السنن على أبواب كتاب أبي داود وخرجا الحديث من روايتهما عن شيوخهما، ثم اختصر قاسم كتابه وسماه المجتنى وابتدأ اختصاره في المحرم سنة 324هـ وجعله باسم الحكم المستنصر وفيه من الحديث المسند ألفان وأربعمائة وتسعون حديثاً في سبعة أجزاء، ومولده يوم الاثنين عاشر ذي الحجة سنة 147هـ {cite:nafh-tib-maqqari p. 50-51}."
  en: "Qasim b. Asbagh of Cordoba, who reached Iraq in 276 days after Abu Dawud's death and wrote a sunan on his arrangement, abridged in 324 as al-Mujtana for al-Hakam al-Mustansir — 2,490 musnad hadiths in seven volumes {cite:nafh-tib-maqqari p. 50-51}."
  es: "Qasim b. Asbagh de Córdoba, que llegó a Irak 276 días después de la muerte de Abu Dawud y escribió un sunan sobre su arreglo, resumido en 324 como al-Mujtana para al-Hakam al-Mustansir: 2.490 hadices musnad en siete volúmenes {cita:nafh-tib-maqqari p. 50-51}."
  fr: "Qassim b. Asbagh de Cordoue, qui atteignit l'Irak 276 jours après la mort d'Abou Dawud et écrivit un sunan sur son arrangement, abrégé en 324 sous le titre al-Mujtana pour al-Hakam al-Mustansir — 2 490 hadiths musnad en sept volumes {cite:nafh-tib-maqqari p. 50-51}."
  ur: "قاسم بی۔ قرطبہ کا اصبغ، جو ابو داؤد کی وفات کے 276 دنوں میں عراق پہنچا اور اس کی ترتیب پر سنن لکھی، 324 میں الحکم المستنصر کے لیے المجتنا کے طور پر اختصار کیا - سات جلدوں میں 2,490 مسند احادیث {حوالہ: ناف تبع مقری ص. 50-51}۔"
  tr: "Kordoba'nın hadis alimi; 276 Hicri yılında yoldaşı Muhammed bin Eyman ile birlikte Irak'a geldi ve Ebu Davud'u varışlarından kısa bir süre önce ölü buldular. Her biri, Ebu Davud'un kitabının bölümleri altında bir sünen derlemesi derledi ve öğretmenlerinden rivayetlerinden hadisler çıkardı. Sonra Kasım kitabını kısalttı ve 324 Hicri yılında Muharrem'de kısaltmaya başladı ve ona El-Hakam el-Mustansir adını verdi. Kitap, Musned'den yedi cilt halinde iki bin dört yüz doksan hadis içerir. Zhu-Hicce'nin onuncu Pazartesi günü doğdu {atıf:naf-tib-maqqari, s. 50-51}."
  id: "Ulama hadis dari Cordoba; ia tiba di Irak pada tahun 276 H bersama sahabatnya Muhammad ibn Ayman, dan mereka menemukan Abu Dawood telah meninggal tak lama sebelum kedatangan mereka. Masing-masing dari mereka menyusun kumpulan Sunan di bawah bab-bab kitab Abu Dawood dan mengambil hadis dari riwayat mereka dari para guru mereka. Kemudian Qasim mempersingkat bukunya dan menamainya Al-Mujtna, memulai ringkasannya pada Muharram tahun 324 H, menamainya Al-Hakam al-Mustansir. Buku ini berisi dua ribu empat ratus sembilan puluh hadis dari Musnad dalam tujuh jilid. Ia lahir pada hari Senin, tanggal sepuluh Dhu al-Hijjah 147 H {cite:nafh-tib-maqqari, hlm. 50-51}."
