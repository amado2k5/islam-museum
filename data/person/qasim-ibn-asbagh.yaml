label: { ar: "قاسم بن أصبغ" }
summary:
  ar: "محدث قرطبة؛ قدم العراق سنة 276هـ مع صاحبه محمد بن أيمن فوجدا أبا داود قد مات قبل وصولهما بيسير فعمل كل واحد منهما مصنفاً في السنن على أبواب كتاب أبي داود وخرجا الحديث من روايتهما عن شيوخهما، ثم اختصر قاسم كتابه وسماه المجتنى وابتدأ اختصاره في المحرم سنة 324هـ وجعله باسم الحكم المستنصر وفيه من الحديث المسند ألفان وأربعمائة وتسعون حديثاً في سبعة أجزاء، ومولده يوم الاثنين عاشر ذي الحجة سنة 147هـ {cite:nafh-tib-maqqari p. 50-51}."
  en: "Qasim b. Asbagh of Cordoba, who reached Iraq in 276 days after Abu Dawud's death and wrote a sunan on his arrangement, abridged in 324 as al-Mujtana for al-Hakam al-Mustansir — 2,490 musnad hadiths in seven volumes {cite:nafh-tib-maqqari p. 50-51}."
