summary:
  ar: "ثامن أمراء بني أمية بقرطبة (سنة ٢٧٥–٣٠٠هـ)؛ قال ابن خلدون: كان خراج الأندلس قبله ثلاثمائة ألف دينار مائة ألف للجيوش ومائة ألف للنفقة في النوائب ومائة ألف ذخيرة ووفراً فأنفق الوفر حين اضطربت عليه نواحي الأندلس بالثوار والمتغلبين وقلّ الخراج {cite:nafh-tib-maqqari p. 388}. ومن نظمه: يا مهجة المشتاق ما أوجعك ويا أسير الحب ما أخشعك، وكتب إلى وزيره النضر بن سلمة لما لم يعجبه رأيه: أنت يا نضر عدة الكنيف {cite:nafh-tib-maqqari pp. 388–389}."
  en: "Eighth Umayyad emir of Córdoba (AH 275–300): the treasury's third-of-a-million reserve was consumed by years of revolt and warlordry across the provinces; a poet-emir whose lampoon to his vizier al-Nadr ibn Salama ran 'you are fit only for the privy' {cite:nafh-tib-maqqari pp. 388–389}."
