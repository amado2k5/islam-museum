summary:
  ar: مهندسة وتنفيذية إماراتية؛ قادت كأول امرأة إماراتية إدارة عشرات آلاف العاملين في شركة الجابر للإنشاءات ثم قيادة العمليات في مجموعة الجابر، ومن رائدات مهندسات ومديرات البناء في الخليج.
  en: Emirati engineer and executive; the first Emirati woman to run tens of thousands of staff as head of the Al Jaber construction company's operations and later group COO, and a pioneer for women engineers
    and executives in Gulf construction.
  ur: اماراتی انجینئر اور منتظمہ؛ الجابر تعمیراتی کمپنی کے آپریشنز کی سربراہ کے طور پر دسیوں ہزار ملازمین چلانے والی پہلی اماراتی خاتون اور بعد میں گروپ کی سی او او، خلیجی تعمیرات میں خواتین انجینئرز و
    منتظمین کی پیش رفت۔
  es: "Ingeniera y ejecutiva emiratí; la primera mujer emiratí en dirigir a decenas de miles de empleados como jefa de operaciones de la constructora Al Jaber y, posteriormente, directora de operaciones del grupo, y pionera para las mujeres ingenieras y ejecutivas en la construcción del Golfo Pérsico."
  fr: "Ingénieure et dirigeante émiratie; première femme émiratie à diriger des dizaines de milliers d'employés en tant que directrice des opérations de la société de construction Al Jaber, puis directrice générale du groupe, et pionnière pour les femmes ingénieures et dirigeantes dans le secteur de la construction du Golfe."
  tr: "Bir Emirlikli mühendis ve yönetici olarak; ilk Emirlikli kadın olarak, Al Jaber İnşaat Şirketi'nde on binlerce işçinin yönetimini yönetti, ardından Al Jaber Group'ta operasyonları yönetti ve Körfez'deki öncü kadın mühendis ve inşaat yöneticilerinden biri oldu."
  id: "Seorang insinyur dan eksekutif Emirat; sebagai wanita Emirat pertama, ia memimpin manajemen puluhan ribu pekerja di Al Jaber Construction Company, kemudian memimpin operasi di Al Jaber Group, dan menjadi salah satu insinyur dan manajer konstruksi perempuan pelopor di Teluk."
