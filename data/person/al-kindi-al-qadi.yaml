label: { ar: "الكندي صاحب قضاة مصر", en: "al-Kindi, chronicler of the judges of Egypt", es: "al-Kindi, chronicler of the judges of Egypt", fr: "al-Kindi, chronicler of the judges of Egypt", ur: "الکندی، مصر کے قاضیوں کا تاریخ ساز" }
summary:
  ar: "أبو عمر محمد بن يوسف الكندي المصري؛ أول من جمع أخبار قضاة مصر إلى سنة ٢٤٦هـ، وذيّل عليه ابن زولاق ثم ابن حجر العسقلاني بمجلد كبير سماه رفع الإصر عن قضاة مصر {cite:kashf-zunun-furqan p. 253}."
  en: "Abu Umar Muhammad ibn Yusuf al-Kindi — the first compiler of the judges of Egypt, to AH 246, continued by Ibn Zulaq and crowned by Ibn Hajar's Raf' al-Isr {cite:kashf-zunun-furqan p. 253}."
  es: "Abu Umar Muhammad ibn Yusuf al-Kindi — el primer compilador de los jueces de Egipto, hasta el año 246 de la Hégira, continuado por Ibn Zulaq y coronado por el Raf' al-Isr de Ibn Hajar {cite:kashf-zunun-furqan p. 253}."
  fr: "Abu Umar Muhammad ibn Yusuf al-Kindi — le premier compilateur des juges d'Égypte, jusqu'en 246 AH, poursuivi par Ibn Zulaq et couronné par le Raf' al-Isr d'Ibn Hajar {cite:kashf-zunun-furqan p. 253}."
  ur: "ابو عمر محمد بن یوسف الکندی - مصر کے قاضیوں کا پہلا مرتب، ہجری 246 تک، ابن ذوالق نے جاری رکھا اور ابن حجر کی رف العسر نے تاج پہنایا۔ 253}۔"
  tr: "Ebu Ömer Muhammed bin Yusuf el-Kindi el-Masri; Mısır yargıçlarının haberlerini 246 Hicri yılına kadar ilk toplayan kişi, ardından İbn Zulak ve ardından İbn Hacar el-Eskelani 'Raf' al-Isr 'an Qudat Misr adlı büyük bir ciltte yer aldı {cite:kashf-zunun-furqan, s. 253}."
  id: "Abu Umar Muhammad ibn Yusuf al-Kindi al-Masri; yang pertama mengumpulkan berita tentang para hakim Mesir hingga tahun 246 H, diikuti oleh Ibn Zulaq dan kemudian Ibn Hajar al-Asqalani dalam sebuah buku besar berjudul 'Raf' al-Isr 'an Qudat Misr {cite:kashf-zunun-furqan, hlm. 253}."
