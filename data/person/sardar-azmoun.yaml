summary:
  ar: "لاعب كرة قدم إيراني محترف ⁦(وُلد سنة 1995 في كنبد كاووس)⁩. مهاجم من أصل تركماني صار أصغر لاعب إيراني في الدوري الروسي الممتاز مع روبين قازان، وتألق مع روستوف وزينيت سانت بطرسبرغ — حيث أنهى موسم 2020–21 هدافًا مشاركًا للدوري وأفضل لاعب فيه — ثم لعب لباير ليفركوزن وروما قبل انضمامه إلى شباب الأهلي سنة 2024؛ دولي إيراني منذ 2014 سجّل أكثر من خمسين هدفًا دوليًا."
  en: "Iranian professional footballer (born 1995 in Gonbad-e Kavus). A striker of Turkmen origin who became Iran's youngest player in the Russian Premier League with Rubin Kazan and starred for Rostov and Zenit Saint Petersburg — finishing as the league's co-top scorer and Player of the Season in 2020–21 — before playing for Bayer Leverkusen and Roma and joining Shabab Al Ahli in 2024; an Iran international since 2014 with more than fifty international goals."
  ur: "ایرانی پیشہ ور فٹبالر ⁦(پیدائش 1995، گنبد کاووس)⁩۔ ترکمان نژاد اسٹرائیکر جو روبن قازان کے ساتھ روسی پریمیئر لیگ کھیلنے والے کم عمر ترین ایرانی بنے، روستوف اور زینیٹ سینٹ پیٹرزبرگ کے لیے نمایاں رہے — 2020–21 میں لیگ کے مشترکہ ٹاپ اسکورر اور سیزن کے بہترین کھلاڑی — پھر بائر لیورکوزن اور روما کے بعد 2024 میں شباب الاہلی میں شامل ہوئے؛ 2014 سے ایران کے بین الاقوامی کھلاڑی، پچاس سے زائد بین الاقوامی گول کر چکے ہیں۔"
  es: "Futbolista profesional iraní (nacido en 1995 en Gonbad-e Kavus). Delantero de origen turcomano que se convirtió en el jugador más joven de Irán en la Premier League rusa con el Rubin Kazan y brilló en el Rostov y el Zenit de San Petersburgo —terminando como máximo goleador y Jugador de la Temporada 2020-21— antes de jugar en el Bayer Leverkusen y la Roma y unirse al Shabab Al Ahli en 2024; internacional con Irán desde 2014 con más de cincuenta goles internacionales."
  fr: "Footballeur professionnel iranien (né en 1995 à Gonbad-e Kavus). Attaquant d'origine turkmène, il est devenu le plus jeune joueur iranien à évoluer en première division russe avec le Rubin Kazan. Il a ensuite brillé à Rostov et au Zenit Saint-Pétersbourg, terminant co-meilleur buteur du championnat et élu joueur de la saison 2020-2021. Il a ensuite joué pour le Bayer Leverkusen et la Roma, avant de rejoindre Shabab Al Ahli en 2024. International iranien depuis 2014, il compte plus de cinquante buts en sélection."
  tr: "İranlı profesyonel futbolcu (1995'te Kanbad Kavus'ta doğdu). Türkmen kökenli bir forvet olan Sher, Rubin Kazan ile birlikte Rusya Premier Ligi'nde en genç İranlı oyuncu oldu ve Rostov ile Zenit Saint Petersburg'da parladı — 2020–21 sezonunu ligin golcü ve en iyi oyuncusu olarak tamamladı — ardından Bayer Leverkusen ve Roma'da oynadıktan sonra 2024'te Shabab Al Ahli'ye katıldı; 2014'ten beri İranlı bir milli oyuncu olup elliden fazla uluslararası gol attı."
  id: "Seorang pemain sepak bola profesional Iran (lahir tahun 1995 di Kanbad Kavus). Penyerang asal Turkmen, ia menjadi pemain Iran termuda di Liga Premier Rusia bersama Rubin Kazan, dan bersinar bersama Rostov dan Zenit Saint Petersburg — di mana ia menyelesaikan musim 2020–21 sebagai pencetak gol terbanyak dan pemain terbaik liga — lalu bermain untuk Bayer Leverkusen dan Roma sebelum bergabung dengan Shabab Al Ahli pada tahun 2024; pemain internasional Iran sejak 2014 yang telah mencetak lebih dari lima puluh gol internasional."
