summary:
  ar: "لاعب كرة قدم إيراني محترف (وُلد سنة 1995 في كنبد كاووس). مهاجم من أصل تركماني صار أصغر لاعب إيراني في الدوري الروسي الممتاز مع روبين قازان، وتألق مع روستوف وزينيت سانت بطرسبرغ — حيث أنهى موسم 2020–21 هدافًا مشاركًا للدوري وأفضل لاعب فيه — ثم لعب لباير ليفركوزن وروما قبل انضمامه إلى شباب الأهلي سنة 2024؛ دولي إيراني منذ 2014 سجّل أكثر من خمسين هدفًا دوليًا."
  en: "Iranian professional footballer (born 1995 in Gonbad-e Kavus). A striker of Turkmen origin who became Iran's youngest player in the Russian Premier League with Rubin Kazan and starred for Rostov and Zenit Saint Petersburg — finishing as the league's co-top scorer and Player of the Season in 2020–21 — before playing for Bayer Leverkusen and Roma and joining Shabab Al Ahli in 2024; an Iran international since 2014 with more than fifty international goals."
  ur: "ایرانی پیشہ ور فٹبالر (پیدائش 1995، گنبد کاووس)۔ ترکمان نژاد اسٹرائیکر جو روبن قازان کے ساتھ روسی پریمیئر لیگ کھیلنے والے کم عمر ترین ایرانی بنے، روستوف اور زینیٹ سینٹ پیٹرزبرگ کے لیے نمایاں رہے — 2020–21 میں لیگ کے مشترکہ ٹاپ اسکورر اور سیزن کے بہترین کھلاڑی — پھر بائر لیورکوزن اور روما کے بعد 2024 میں شباب الاہلی میں شامل ہوئے؛ 2014 سے ایران کے بین الاقوامی کھلاڑی، پچاس سے زائد بین الاقوامی گول کر چکے ہیں۔"
