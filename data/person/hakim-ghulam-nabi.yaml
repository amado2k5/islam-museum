summary:
  ar: "حكيم غلام نبي (ت. 1916) طبيب يوناني هندي في لاهور، ألّف نحو أربعين كتابا طبيا بالأردية وأصدر مجلة طبية، وكان صديقا لمحمد إقبال ومعالجا لأمراء نابها وخيربور."
  en: "Hakim Ghulam Nabi (d. 1916) was an Indian Unani physician of Lahore who wrote some forty medical books in Urdu and published a medical journal; he was a friend of Muhammad Iqbal and treated the rulers of Nabha and Khairpur."
  ur: "حکیم غلام نبی (وفات 1916ء) لاہور کے ہندوستانی طبیبِ یونانی تھے، اردو میں تقریباً چالیس طبی کتب لکھیں اور ایک طبی رسالہ جاری کیا؛ وہ محمد اقبال کے دوست اور نابھہ و خیرپور کے حکمرانوں کے معالج تھے۔"
