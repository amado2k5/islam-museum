summary:
  ar: نورة الكعبي ⁦(1979–)⁩ وزيرة دولة إماراتية، شغلت حقيبة الثقافة والشباب ⁦(2017–2023)⁩ وقادت تطوير قطاع الإعلام والثقافة الإماراتي، وعضوة في مجالس إعلامية وثقافية وطنية.
  en: Noura al-Kaabi (born 1979) is an Emirati minister of state who served as Minister of Culture and Youth (2017–2023), led the development of the UAE's media and culture sector, and sits on national
    media and cultural boards.
  ur: نورہ الکعبی ⁦(1979–)⁩ اماراتی وزیرِ مملکت ہیں جو وزیرِ ثقافت و نوجوان ⁦(2017–2023)⁩ رہیں، UAE کے میڈیا و ثقافتی شعبے کی ترقی کی قیادت کی اور قومی میڈیا و ثقافتی بورڈوں کی رکن ہیں۔
  es: "Noura al-Kaabi (nacida en 1979) es una ministra de Estado emiratí que se desempeñó como Ministra de Cultura y Juventud (2017-2023), lideró el desarrollo del sector de los medios de comunicación y la cultura de los EAU y forma parte de juntas directivas nacionales de medios de comunicación y cultura."
  fr: "Noura al-Kaabi (née en 1979) est une ministre d'État émiratie qui a été ministre de la Culture et de la Jeunesse (2017-2023), a dirigé le développement du secteur des médias et de la culture des Émirats arabes unis et siège au sein de conseils nationaux des médias et de la culture."
  tr: "Noura Al Kaabi (1979–), Kültür ve Gençlik Bakanlığı'nı (2017–2023) yürütmüş, BAE medya ve kültür sektörünün gelişimine öncülük etmiş ve ulusal medya ve kültür konseylerinin üyesidir."
  id: "Noura Al Kaabi (1979–) adalah Menteri Negara Emirat, yang pernah menjabat di Kementerian Kebudayaan dan Pemuda (2017–2023), memimpin pengembangan sektor media dan budaya UEA, serta anggota dewan media dan budaya nasional."
