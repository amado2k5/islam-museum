summary:
  ar: "أول نساء بوبال حكمًا في وسط الهند: تزوّجت نضر محمد خان سنة 1817، وخلفته نوابًا في 14 تشرين الثاني 1819، وحكمت حتى تنازلها في 29 تشرين الثاني 1837 لصالح صهرها وابنتها سكندر بيكم. بنت الجامع الكبير في بوبال ومشروع مياه للمدينة، وظلّت مؤثرة في شؤون الدولة في عهود صهرها وابنتها وحفيدتها شاه جهان بيكم. وُلدت باسم گوہر بيكم، وتصفها مقالة الأردية بطول العبادة والكرم."
  en: "First of the women rulers of Bhopal in central India: she married Nazar Mohammad Khan in 1817, succeeded him as nawab on 14 November 1819, and ruled until her abdication on 29 November 1837 in favour of her son-in-law and her daughter Sikandar Begum. She built Bhopal's great Jama Masjid and a waterworks for the city, and remained influential in state affairs through the reigns of her son-in-law, her daughter and her granddaughter Shah Jahan Begum. Born Gauhar Begum, she is described by the Urdu article as a woman of long devotions and open-handed charity."
  ur: "وسط ہندوستان کی ریاست بھوپال کی پہلی خاتون حکمران: 1817 میں نواب نذر محمد خان سے شادی ہوئی، 14 نومبر 1819 کو ان کی جانشین بنیں اور 29 نومبر 1837 کو اپنے داماد اور بیٹی سکندر بیگم کے حق میں دستبردار ہونے تک حکمران رہیں۔ انہوں نے بھوپال کی عظیم جامع مسجد اور شہر کے لیے واٹر ورکس بنوایا، اور داماد، بیٹی اور نواسی شاہ جہاں بیگم کے ادوار میں ریاستی امور پر اثر انداز رہیں۔ پیدائشی نام گوہر بیگم تھا؛ اردو مقالہ ان کی طویل عبادت اور سخاوت کا ذکر کرتا ہے۔"
