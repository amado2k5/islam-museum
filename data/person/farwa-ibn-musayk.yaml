summary:
  ar: "سيد من مراد وشاعر؛ قدم على النبي مفارقاً لملوك كندة فأسلم، وسأله النبي عن يوم الردم الذي أثخنت فيه همدان قومه، واستعمله على مراد وزبيد ومذحج كلها وبعث معه خالد بن سعيد على الصدقة؛ وارتد عليه عمرو بن معدي كرب بعد وفاة النبي وهجاه. ويذكر البلاذري أن النبي بعثه مع قيس بن المكشوح إلى اليمن لقتال الأسود العنسي."
  en: "A chief of Murad and poet; he came to the Prophet breaking with the kings of Kinda and embraced Islam, the Prophet asked him about the Day of al-Radm on which Hamdan had crushed his people, and set him over Murad, Zubayd and all Madhhij with Khalid ibn Sa'id sent with him over the sadaqa; after the Prophet's death Amr ibn Ma'dikarib rebelled against him and satirised him. Al-Baladhuri adds that the Prophet sent him with Qays ibn al-Makshuh to Yemen against al-Aswad al-Ansi."
  ur: "مراد کا سردار اور شاعر؛ کندہ کے بادشاہوں سے بغاوت کر کے نبی کے پاس آیا اور مسلمان ہوا، نبی نے اس سے قیامت کے دن کے بارے میں پوچھا۔"
  es: "Jefe de Murad y poeta, se presentó ante el Profeta tras romper con los reyes de Kinda y convertirse al Islam. El Profeta le preguntó sobre el Día de al-Radm, en el que Hamdan había derrotado a su pueblo, y lo puso al frente de Murad, Zubayd y todos los Madhhij, junto con Khalid ibn Sa'id, a cargo de la caridad. Tras la muerte del Profeta, Amr ibn Ma'dikarib se rebeló contra él y lo satirizó. Al-Baladhuri añade que el Profeta lo envió con Qays ibn al-Makshuh a Yemen contra al-Aswad al-Ansi."
  fr: "Chef de Murad et poète, il se présenta au Prophète après avoir rompu avec les rois de Kinda et embrassé l'islam. Le Prophète l'interrogea sur le jour d'al-Radm, où Hamdan avait écrasé son peuple, et le chargea de Murad, Zubayd et de tout Madhhij, accompagné de Khalid ibn Sa'id, chargé de la sadaqa. Après la mort du Prophète, Amr ibn Ma'dikarib se rebella contre lui et le ridiculisa. Al-Baladhuri ajoute que le Prophète l'envoya au Yémen avec Qays ibn al-Makshuh contre al-Aswad al-Ansi."
  tr: "Murad'dan bir usta ve şairdi; Kindah krallarından ayrıldıktan sonra Peygamber'e geldi, ardından İslam'a geçti. Peygamber, Hamdan'ın halkını yoğunlaştırdığı, onu Murad, Zabid ve Medhhic'in üzerine atandığı ve Halid bin Sa'id'i sadaka olarak gönderdiği sel günü hakkında sordu. Amr ibn Ma'di Karb, Peygamber'in ölümünden sonra dinden döndü ve onu hicvetti. Al-Baladhuri, Peygamber'in onu Qays ibn al-Makshuh ile birlikte Yemen'e el-Esvad el-Ansi ile savaşması için gönderdiğini belirtir."
  id: "Seorang guru dari Murad dan seorang penyair; ia datang kepada Nabi setelah meninggalkan raja-raja Kindah, lalu memeluk Islam. Nabi menanyakan tentang hari banjir ketika Hamdan memperkuat kaumnya, mengangkatnya sebagai pengganti Murad, Zabid, dan Madhhij, serta mengirim Khalid ibn Sa'id bersamanya sebagai sedekah. Amr ibn Ma'di Karb murtad setelah kematian Nabi dan menyindir beliau. Al-Baladhuri menyebutkan bahwa Nabi mengirimnya bersama Qays ibn al-Makshuh ke Yaman untuk melawan al-Aswad al-'Ansi."
