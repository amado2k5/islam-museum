summary:
  ar: "سيد من مراد وشاعر؛ قدم على النبي مفارقاً لملوك كندة فأسلم، وسأله النبي عن يوم الردم الذي أثخنت فيه همدان قومه، واستعمله على مراد وزبيد ومذحج كلها وبعث معه خالد بن سعيد على الصدقة؛ وارتد عليه عمرو بن معدي كرب بعد وفاة النبي وهجاه. ويذكر البلاذري أن النبي بعثه مع قيس بن المكشوح إلى اليمن لقتال الأسود العنسي."
  en: "A chief of Murad and poet; he came to the Prophet breaking with the kings of Kinda and embraced Islam, the Prophet asked him about the Day of al-Radm on which Hamdan had crushed his people, and set him over Murad, Zubayd and all Madhhij with Khalid ibn Sa'id sent with him over the sadaqa; after the Prophet's death Amr ibn Ma'dikarib rebelled against him and satirised him. Al-Baladhuri adds that the Prophet sent him with Qays ibn al-Makshuh to Yemen against al-Aswad al-Ansi."
