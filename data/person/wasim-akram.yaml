summary:
  ar: "لاعب كريكت باكستاني سابق وقائد سابق لمنتخب باكستان، وُلد في لاهور سنة 1966 لأسرة بنجابية. رامٍ سريع بالذراع اليسرى لُقّب بسلطان التأرجح، لعب لباكستان بين 1984 و2003 في 104 مباريات اختبار أخذ فيها 414 ويكيت و356 مباراة ليوم واحد أخذ فيها 502 ويكيت فكان أول رامٍ يبلغ 500 ويكيت في مباريات اليوم الواحد، وفاز مع باكستان بكأس العالم 1992 ونال جائزة لاعب المباراة في النهائي، ولعب للانكشير في إنجلترا (1988-1998)، ودخل قاعة مشاهير المجلس الدولي للكريكت سنة 2009 ونال وسام هلال الامتياز سنة 2019، وشُخّص بالسكري في الثلاثين من عمره فصار من وجوه التوعية به."
  en: "Pakistani former cricketer and captain of the Pakistan national team, born in Lahore in 1966 to a Punjabi family. A left-arm fast bowler known as the Sultan of Swing, he played for Pakistan from 1984 to 2003, taking 414 wickets in 104 Tests and 502 wickets in 356 One Day Internationals — the first bowler to reach 500 ODI wickets — won the 1992 Cricket World Cup with Pakistan and was Player of the Match in the final, played for Lancashire in England (1988–1998), was inducted into the ICC Cricket Hall of Fame in 2009, received the Hilal-e-Imtiaz in 2019, and, diagnosed with diabetes at thirty, became a prominent diabetes-awareness campaigner."
  ur: "پاکستان کے سابق کرکٹ کھلاڑی اور قومی ٹیم کے سابق کپتان، جو 1966 میں لاہور میں ایک پنجابی خاندان میں پیدا ہوئے۔ بائیں ہاتھ کے تیز گیند باز، جو «سلطان آف سوئنگ» کے لقب سے مشہور ہیں، انھوں نے 1984ء سے 2003ء تک پاکستان کے لیے کھیلا، 104 ٹیسٹ میچوں میں 414 وکٹیں اور 356 ایک روزہ میچوں میں 502 وکٹیں لیں — ایک روزہ کرکٹ میں 500 وکٹیں مکمل کرنے والے پہلے گیند باز — پاکستان کے ساتھ 1992ء کرکٹ ورلڈ کپ جیتا اور فائنل میں میچ کے بہترین کھلاڑی رہے، انگلینڈ میں لنکاشائر کے لیے کھیلے ⁦(1988ء–1998ء)⁩، 2009 میں آئی سی سی کرکٹ ہال آف فیم میں شامل ہوئے، 2019 میں ہلالِ امتیاز ملا، اور تیس برس کی عمر میں ذیابیطس کی تشخیص کے بعد اس مرض سے آگاہی کے ممتاز کارکن بنے۔"
  es: "Exjugador de críquet pakistaní y capitán de la selección nacional de Pakistán, nacido en Lahore en 1966 en el seno de una familia punjabí. Lanzador rápido zurdo conocido como el Sultán del Swing, jugó para Pakistán desde 1984 hasta 2003, consiguiendo 414 wickets en 104 Tests y 502 wickets en 356 One Day Internationals (el primer lanzador en alcanzar los 500 wickets en ODI). Ganó la Copa Mundial de Críquet de 1992 con Pakistán y fue el Jugador del Partido en la final. Jugó para Lancashire en Inglaterra (1988-1998). Fue incluido en el Salón de la Fama del Críquet de la ICC en 2009. Recibió el Hilal-e-Imtiaz en 2019 y, diagnosticado con diabetes a los treinta años, se convirtió en un destacado activista de la concienciación sobre la diabetes."
  fr: "Ancien joueur de cricket pakistanais et capitaine de l'équipe nationale du Pakistan, né à Lahore en 1966 dans une famille punjabie. Lanceur rapide gaucher surnommé le Sultan du Swing, il a joué pour le Pakistan de 1984 à 2003, prenant 414 guichets en 104 tests et 502 guichets en 356 matchs internationaux d'un jour (ODI) — le premier lanceur à atteindre 500 guichets en ODI — a remporté la Coupe du monde de cricket de 1992 avec le Pakistan et a été élu homme du match en finale. Il a également joué pour le Lancashire en Angleterre (1988-1998), a été intronisé au Temple de la renommée du cricket de l'ICC en 2009, a reçu la Hilal-e-Imtiaz en 2019 et, diagnostiqué diabétique à l'âge de trente ans, est devenu un fervent militant de la sensibilisation au diabète."
  tr: "Eski Pakistanlı kriketçi ve Pakistan milli takımının eski kaptanı, 1966'da Lahor'da Pencaplı bir ailede doğdu. Ram, Swing'in Sultanı lakabıyla anılan sol kol oyuncusudur. 1984 ile 2003 yılları arasında Pakistan için 104 Test maçında oynadı, 414 wicket ve 356 tek günlük wicket aldı, 502 wicket aldı ve 500 tek günlük wicket alan ilk Ram oldu. 1992 Dünya Kupası'nı Pakistan ile kazandı ve finalde Maçın Adamı ödülünü kazandı. İngiltere'de Lancashire için oynadı (1988-1998), 2009'da ICC Onur Listesi'ne alındı, 2019'da Hilal Mükemmellik Madalyası'nı aldı ve otuzlu yaşlarında diyabet teşhisi kondu; bu konuda farkındalık yaratmada önde gelen bir figür oldu."
  id: "Mantan pemain kriket Pakistan dan mantan kapten tim nasional Pakistan, lahir di Lahore pada tahun 1966 dari keluarga Punjabi. Ram adalah pemain tangan kiri yang dijuluki Sultan of Swing. Ia bermain untuk Pakistan antara tahun 1984 dan 2003 dalam 104 pertandingan Test, mengambil 414 wicket dan 356 wicket satu hari, mengambil 502 wicket, menjadi Ram pertama yang mencapai 500 wicket satu hari. Ia memenangkan Piala Dunia 1992 bersama Pakistan dan meraih penghargaan Man of the Match di final. Ia bermain untuk Lancashire di Inggris (1988-1998), dimasukkan ke ICC Hall of Fame pada 2009, menerima Hilal Excellence Medal pada 2019, dan didiagnosis menderita diabetes di usia tiga puluhan serta menjadi tokoh penting dalam meningkatkan kesadaran tentang hal ini."
