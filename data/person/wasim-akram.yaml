summary:
  ar: "لاعب كريكت باكستاني سابق وقائد سابق لمنتخب باكستان، وُلد في لاهور سنة 1966 لأسرة بنجابية. رامٍ سريع بالذراع اليسرى لُقّب بسلطان التأرجح، لعب لباكستان بين 1984 و2003 في 104 مباريات اختبار أخذ فيها 414 ويكيت و356 مباراة ليوم واحد أخذ فيها 502 ويكيت فكان أول رامٍ يبلغ 500 ويكيت في مباريات اليوم الواحد، وفاز مع باكستان بكأس العالم 1992 ونال جائزة لاعب المباراة في النهائي، ولعب للانكشير في إنجلترا (1988-1998)، ودخل قاعة مشاهير المجلس الدولي للكريكت سنة 2009 ونال وسام هلال الامتياز سنة 2019، وشُخّص بالسكري في الثلاثين من عمره فصار من وجوه التوعية به."
  en: "Pakistani former cricketer and captain of the Pakistan national team, born in Lahore in 1966 to a Punjabi family. A left-arm fast bowler known as the Sultan of Swing, he played for Pakistan from 1984 to 2003, taking 414 wickets in 104 Tests and 502 wickets in 356 One Day Internationals — the first bowler to reach 500 ODI wickets — won the 1992 Cricket World Cup with Pakistan and was Player of the Match in the final, played for Lancashire in England (1988–1998), was inducted into the ICC Cricket Hall of Fame in 2009, received the Hilal-e-Imtiaz in 2019, and, diagnosed with diabetes at thirty, became a prominent diabetes-awareness campaigner."
  ur: "پاکستان کے سابق کرکٹ کھلاڑی اور قومی ٹیم کے سابق کپتان، جو 1966 میں لاہور میں ایک پنجابی خاندان میں پیدا ہوئے۔ بائیں ہاتھ کے تیز گیند باز، جو «سلطان آف سوئنگ» کے لقب سے مشہور ہیں، انھوں نے 1984ء سے 2003ء تک پاکستان کے لیے کھیلا، 104 ٹیسٹ میچوں میں 414 وکٹیں اور 356 ایک روزہ میچوں میں 502 وکٹیں لیں — ایک روزہ کرکٹ میں 500 وکٹیں مکمل کرنے والے پہلے گیند باز — پاکستان کے ساتھ 1992ء کرکٹ ورلڈ کپ جیتا اور فائنل میں میچ کے بہترین کھلاڑی رہے، انگلینڈ میں لنکاشائر کے لیے کھیلے (1988ء–1998ء)، 2009 میں آئی سی سی کرکٹ ہال آف فیم میں شامل ہوئے، 2019 میں ہلالِ امتیاز ملا، اور تیس برس کی عمر میں ذیابیطس کی تشخیص کے بعد اس مرض سے آگاہی کے ممتاز کارکن بنے۔"
