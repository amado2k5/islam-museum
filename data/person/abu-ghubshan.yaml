summary:
  en: "The Khuzaʾi who held the guardianship of the Kaaba on behalf of Hubba bint Hulayl and sold it to Qusayy for a skin of wine — the purchase Khuzaʾa resented, sparking the war that ended their rule of Mecca."
  ar: "الخزاعي الذي كان وكيل حُبّى بنت هليل على سدانة الكعبة، فاشترى منه قصي ولاية البيت بزقّ من الخمر؛ فلم ترض خزاعة بهذا البيع فكان سبباً في الحرب التي أخرجتهم من ولاية مكة."
  fr: "Le Khuza'ite qui détenait la garde de la Kaaba pour le compte de Hubba bint Hulayl et la vendit à Qusayy pour une outre de vin — achat que les Khuza'a n'acceptèrent pas, déclenchant la guerre qui mit fin à leur domination sur La Mecque."
  es: "Los Khuzaʾi, que custodiaban la Kaaba en nombre de Hubba bint Hulayl, la vendieron a Qusayy por un odre de vino; esta compra fue motivo de resentimiento para los Khuzaʾa, lo que desencadenó la guerra que puso fin a su dominio sobre La Meca."
