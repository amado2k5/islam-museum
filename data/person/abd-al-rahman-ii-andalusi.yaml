id: person/abd-al-rahman-ii-andalusi
class: person
label: { ar: "عبد الرحمن الثاني بن الحكم", en: "Abd al-Rahman II ibn al-Hakam", fr: "Abd al-Rahman II ibn al-Hakam", es: "Abd al-Rahman II ibn al-Hakam", ur: "عبدالرحمٰن ثانی ابن الحکم" }
summary:
  ar: "خامس أمراء بني أمية بقرطبة ⁦(سنة ٢٠٦–٢٣٨هـ)⁩؛ قدم عليه سنة ٢٠٦هـ زرياب المغني من العراق مولى المهدي ومتعلم إبراهيم الموصلي فركب بنفسه لتلقيه وأقام عنده بخير حال وأورث صناعة الغناء بالأندلس {cite:nafh-tib-maqqari p. 380}. وفي أيامه ظهر المجوس ودخلوا إشبيلية سنة ٢٣٠هـ فقاتلهم المسلمون بعد مقام صعب وأحرقوا بعض مراكبهم ورحلوا إلى شدونة فلتيلة فباجة فأشبونة، وتقدم بإصلاح ما خربوه واكتفى حاميتها {cite:nafh-tib-maqqari p. 382}. وسنته ٢٣١هـ بعث العساكر إلى جليقية فحاصروا ليون ورموها بالمجانيق وأحرقوها وثَلَموا في سورها الذي بلغ عرضه سبعة عشر ذراعاً، وفي سنة ٢٢٩هـ أوقع ابنه محمد بالمشركين عند بنبلونة وقتل غرسية صاحبها {cite:nafh-tib-maqqari pp. 381–382}."
  en: "Fifth Umayyad emir of Córdoba (AH 206–238): he rode out himself to welcome Ziryab from Iraq in 206; in 230 the Majus stormed Seville and were beaten back through Sidonia, Niebla, Beja and Lisbon; in 231 his mangonels took León — its wall seventeen cubits thick proved too wide to raze {cite:nafh-tib-maqqari pp. 380–382}."
  fr: "Cinquième émir omeyyade de Cordoue (206–238 H) : il alla lui-même accueillir Ziryab venu d'Irak en 206 ; en 230 les Majus prirent d'assaut Séville et furent repoussés par Sidonia, Niebla, Beja et Lisbonne ; en 231 ses mangonneaux prirent León — son rempart épais de dix-sept coudées se révéla trop large pour être rasé {cite:nafh-tib-maqqari pp. 380–382}."
  es: "Quinto emir omeya de Córdoba (AH 206–238): salió personalmente a recibir a Ziryab de Irak en 206; en 230 los Majus asaltaron Sevilla y fueron rechazados a través de Sidonia, Niebla, Beja y Lisboa; en 231 sus mangoneles tomaron León; su muralla de diecisiete codos de espesor resultó demasiado ancha para ser arrasada {cite:nafh-tib-maqqari pp. 380–382}."
  ur: "قرطبہ کا پانچواں اموی امیر ⁦(ھ 206-238)⁩: وہ 206 میں عراق سے زریاب کے استقبال کے لیے خود نکلا۔ 230 میں مجوس نے سیویل پر حملہ کیا اور سیڈونیا، نیبلا، بیجا اور لزبن کے ذریعے واپس مارا گیا۔ 231 میں اس کے مینگونلز نے لیون کو لے لیا - اس کی دیوار سترہ ہاتھ موٹی تھی جو اسے گرانے کے لیے بہت چوڑی ثابت ہوئی"
  tr: "Kurtuba'nın beşinci Emevi emiri (206-238 Hicri); 206 Hicri yılında, Irak'tan gelen, el-Mehdi'nin himayesinde ve İbrahim el-Mevsili'nin öğrencisi olan şarkıcı Ziryab ona geldi. Şahsen onu karşılamaya gitti ve onunla iyi şartlarda kaldı ve şarkıcılık sanatını Endülüs'e miras bıraktı {kaynak: nafh-tib-makqari s. 380}. Onun döneminde, Mecusiler ortaya çıktı ve 230 Hicri yılında Sevilla'ya girdi. Müslümanlar zorlu bir mücadeleden sonra onlarla savaştı ve bazı gemilerini yaktılar; Mecusiler Sedona'ya, sonra Valletta'ya, sonra Beja'ya, sonra da Lizbon'a gittiler. Onların tahrip ettiklerini onarmaya girişti ve garnizon için yeterli oldu {kaynak: nafh-tib-makqari s. 382}. Hicri 231 yılında Galiçya'ya asker gönderdi ve Lyon'u kuşattılar, mancınıklarla bombaladılar, yaktılar ve on yedi arşın genişliğindeki surlarını yıktılar. Hicri 229 yılında oğlu Muhammed, Pamplona yakınlarındaki müşriklere saldırdı ve hükümdarı García'yı öldürdü. {cite:nafh-tib-maqqari ss. 381–382}"
  id: "Yang kelima dari emir Umayyah Cordoba (206–238 H); pada tahun 206 H, Ziryab, seorang penyanyi dari Irak, klien al-Mahdi dan murid Ibrahim al-Mawsili, datang kepadanya. Ia sendiri pergi menemuinya dan tinggal bersamanya dalam kondisi yang baik, dan ia mewariskan seni menyanyi kepada Andalusia {cite:nafh-tib-maqqari hlm. 380}. Pada masanya, kaum Majusi muncul dan memasuki Sevilla pada tahun 230 H. Kaum Muslim memerangi mereka setelah perlawanan yang sulit dan membakar beberapa kapal mereka, dan mereka pergi ke Sedona, kemudian ke Valletta, kemudian ke Beja, kemudian ke Lisbon. Ia kemudian memperbaiki apa yang telah mereka hancurkan dan mencukupi kebutuhan garnisunnya {cite:nafh-tib-maqqari hlm. 382}. Pada tahun 231 H, ia mengirim pasukan ke Galicia, dan mereka mengepung Lyon, membombardirnya dengan ketapel, membakarnya, dan merobohkan temboknya yang lebarnya tujuh belas hasta. Pada tahun 229 H, putranya Muhammad menyerang kaum politeis di dekat Pamplona dan membunuh García, penguasanya. {cite:nafh-tib-maqqari hlm. 381–382}"
