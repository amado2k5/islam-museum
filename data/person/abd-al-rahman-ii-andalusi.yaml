label: { ar: "عبد الرحمن الثاني بن الحكم" }
summary:
  ar: "خامس أمراء بني أمية بقرطبة (سنة ٢٠٦–٢٣٨هـ)؛ قدم عليه سنة ٢٠٦هـ زرياب المغني من العراق مولى المهدي ومتعلم إبراهيم الموصلي فركب بنفسه لتلقيه وأقام عنده بخير حال وأورث صناعة الغناء بالأندلس {cite:nafh-tib-maqqari p. 380}. وفي أيامه ظهر المجوس ودخلوا إشبيلية سنة ٢٣٠هـ فقاتلهم المسلمون بعد مقام صعب وأحرقوا بعض مراكبهم ورحلوا إلى شدونة فلتيلة فباجة فأشبونة، وتقدم بإصلاح ما خربوه واكتفى حاميتها {cite:nafh-tib-maqqari p. 382}. وسنته ٢٣١هـ بعث العساكر إلى جليقية فحاصروا ليون ورموها بالمجانيق وأحرقوها وثَلَموا في سورها الذي بلغ عرضه سبعة عشر ذراعاً، وفي سنة ٢٢٩هـ أوقع ابنه محمد بالمشركين عند بنبلونة وقتل غرسية صاحبها {cite:nafh-tib-maqqari pp. 381–382}."
  en: "Fifth Umayyad emir of Córdoba (AH 206–238): he rode out himself to welcome Ziryab from Iraq in 206; in 230 the Majus stormed Seville and were beaten back through Sidonia, Niebla, Beja and Lisbon; in 231 his mangonels took León — its wall seventeen cubits thick proved too wide to raze {cite:nafh-tib-maqqari pp. 380–382}."
