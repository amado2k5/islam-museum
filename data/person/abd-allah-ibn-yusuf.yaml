summary:
  ar: "عبد الله بن يوسف التنيسي، أصله دمشقي، حافظ من أثبات رواة الموطأ عن مالك، سمع من سعيد بن عبد العزيز ومالك والليث، وتوفي سنة ٢١٨هـ = ٨٣٣م بحسب شذرات الذهب؛ ولا يُخلط بغيره من المسمّين عبد الله بن يوسف."
  en: "Abd Allah ibn Yusuf al-Tinnisi, of Damascene origin, a hafiz and one of the most reliable narrators of the Muwatta from Malik; he heard from Sa'id ibn Abd al-Aziz, Malik and al-Layth and died in 218 AH = 833, according to Shadharat al-Dhahab. He is not to be confused with other men named Abd Allah ibn Yusuf."
  fr: "Abd Allah ibn Yusuf al-Tinnisi, d'origine damascène, hafiz et l'un des transmetteurs les plus fiables du Muwatta de Malik ; il entendit Sa'id ibn Abd al-Aziz, Malik et al-Layth et mourut en 218 H = 833, selon Shadharat al-Dhahab. Il ne doit pas être confondu avec d'autres hommes nommés Abd Allah ibn Yusuf."
  es: "Abd Allah ibn Yusuf al-Tinnisi, originario de Damasco, fue un hafiz y uno de los narradores más fiables del Muwatta de Malik. Según Shadharat al-Dhahab, escuchó de Sa'id ibn Abd al-Aziz, Malik y al-Layth, y falleció en el año 218 de la Hégira (833 d. C.). No debe confundirse con otros hombres llamados Abd Allah ibn Yusuf."
  ur: "عبد اللہ بن یوسف التنیسی، دمشقی نژاد، ایک حافظ اور مالک سے موطا کے سب سے معتبر راویوں میں سے ایک؛ انہوں نے سعید بن عبد العزیز، مالک اور لیث سے سنا اور شہادت الذہب کے مطابق 218 ہجری = 833 میں وفات پائی۔ اسے عبداللہ ابن یوسف نامی دوسرے مردوں کے ساتھ الجھنا نہیں چاہیے۔"
  tr: "Aslen Şamlı olan Abdullah bin Yusuf el-Tanisi, hadis ezbercisi ve Malik'in rivayetine göre el-Muvatta'nın en güvenilir ravilerinden biriydi. Said bin Abdül Aziz, Malik ve el-Layth'ten hadis rivayet etmiş ve Şadharat el-Dhahab'a göre Hicri 218 = Miladi 833 yılında vefat etmiştir; Abdullah bin Yusuf adındaki diğer kişilerle karıştırılmamalıdır."
  id: "Abdullah bin Yusuf al-Tanisi, yang berasal dari Damaskus, adalah seorang penghafal hadits dan salah satu perawi hadits al-Muwatta’ yang paling terpercaya berdasarkan riwayat Malik. Ia mendengar hadits dari Saeed bin Abdul Aziz, Malik dan al-Layth, dan meninggal pada tahun 218 H = 833 M menurut Shadharat al-Dhahab; dan ia tidak boleh disamakan dengan orang lain yang bernama Abdullah bin Yusuf."
