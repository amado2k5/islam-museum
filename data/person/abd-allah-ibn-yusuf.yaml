summary:
  ar: "عبد الله بن يوسف التنيسي، أصله دمشقي، حافظ من أثبات رواة الموطأ عن مالك، سمع من سعيد بن عبد العزيز ومالك والليث، وتوفي سنة ٢١٨هـ = ٨٣٣م بحسب شذرات الذهب؛ ولا يُخلط بغيره من المسمّين عبد الله بن يوسف."
  en: "Abd Allah ibn Yusuf al-Tinnisi, of Damascene origin, a hafiz and one of the most reliable narrators of the Muwatta from Malik; he heard from Sa'id ibn Abd al-Aziz, Malik and al-Layth and died in 218 AH = 833, according to Shadharat al-Dhahab. He is not to be confused with other men named Abd Allah ibn Yusuf."
