summary:
  ar: أبو الهادي إلى الحق، لقيه عنده محمد بن عبيد الله بالفرع في ذي الحجة وأكرمه وأنزله قرب داره.
  en: The father of al-Hadi ila al-Haqq, with whom Muhammad ibn Ubaydallah stayed at al-Fur' in Dhu al-Hijja; he honoured him and lodged him near his house.
  ur: ہادی الی الحق کے والد، جن کے پاس محمد بن عبید اللہ ذو الحجہ میں فرع میں ٹھہرے؛ انہوں نے ان کی عزت کی اور اپنے گھر کے قریب ٹھہرایا۔
  es: "El padre de al-Hadi ila al-Haqq, con quien Muhammad ibn Ubaydallah se hospedó en al-Fur' en Dhu al-Hijja; lo honró y lo hospedó cerca de su casa."
  fr: "Le père d'al-Hadi ila al-Haqq, avec qui Muhammad ibn Ubaydallah séjourna à al-Fur' en Dhu al-Hijja; il l'honora et le logea près de sa maison."
  tr: "Ebu el-Hadi ila-Hakk, Muhammed bin Ubeydullah, Zulhice'de Al-Far'da onu karşıladı, onurlandırdı ve evinin yakınında indirdi."
  id: "Abu al-Hadi ila al-Haqq, Muhammad ibn Ubayd Allah bertemu dengannya di Al-Far' di Dhu al-Hijjah, menghormatinya, dan membawanya turun dekat rumahnya."
