summary:
  ar: "أبو عبد الله من الأبناء، توفي سنة أربع ومائة وقيل سنة عشر ومائة بصنعاء وهو ابن تسعين سنة، اختلف أصحاب التواريخ في وفاته {cite:muruj-al-dhahab p. 191-192}.، وعده ابن خلدون فيمن أدخل على التفسير أخبار بني إسرائيل الموضوعة التي حذر منها الرسول في قوله بلغوا عني ولو آية وحدثوا عن بني إسرائيل ولا حرج {cite:muqaddima-ibn-khaldun p. 27}"
  en: "Abu 'Abd Allah of the Persian abna' — died at San'a' in 104 or 110, aged ninety; the chronicles disagree {cite:muruj-al-dhahab p. 191-192}."
