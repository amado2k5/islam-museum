class: person
label: { ar: "وهب بن منبه", en: "Wahb ibn Munabbih", es: "Wahb ibn Munabbih", fr: "Wahb ibn Munabbih", ur: "وھب بن منبہ" }
summary:
  ar: "أبو عبد الله من الأبناء، توفي سنة أربع ومائة وقيل سنة عشر ومائة بصنعاء وهو ابن تسعين سنة، اختلف أصحاب التواريخ في وفاته {cite:muruj-al-dhahab p. 191-192}. وعده ابن خلدون فيمن أدخل على التفسير أخبار بني إسرائيل الموضوعة التي حذر منها الرسول في قوله بلغوا عني ولو آية وحدثوا عن بني إسرائيل ولا حرج {cite:muqaddima-ibn-khaldun p. 27}"
  en: "Abu 'Abd Allah of the Persian abna' — died at San'a' in 104 or 110, aged ninety; the chronicles disagree {cite:muruj-al-dhahab p. 191-192}."
  es: "Abu 'Abd Allah del persa abna' — murió en Sana' en 104 o 110, a la edad de noventa años; las crónicas discrepan {cite:muruj-al-dhahab p. 191-192}."
  fr: "Abu 'Abd Allah de la tribu perse abna' — est mort à San'a' en 104 ou 110, à l'âge de quatre-vingt-dix ans; les chroniques divergent {cite:muruj-al-dhahab p. 191-192}."
  ur: "فارسی ابنا کے ابو عبد اللہ - صنعاء میں 104 یا 110 میں فوت ہوئے، نوے کی عمر میں۔ تواریخ میں اختلاف ہے {حوالہ: مروج الذہب ص۔ 191-192}۔"
  tr: "Ebu Abdullah oğullarından biriydi, 104 Hicri yılında ya da 100 Hicri olarak Sana'a'da doksan yaşında öldü. Tarihçiler ölümü konusunda farklı görüşler bildirmektedir {atıf:Muruj-al-Dhahab s. 191-192}. İbn Haldun, onu İsrailoğulları'nın uydurma raporlarını tefsire sokanlar arasında saymıştır; Peygamber ise buna karşı uyarıda bulunmuştur: 'Benden bir ayet olsa bile ilet, İsrailoğulları'ndan rivayet et, zarar yoktur.' {alıntı:Muqaddima-ibn-haldun, s. 27}"
  id: "Abu Abdullah adalah salah satu putranya, wafat pada tahun 104 H, atau dikatakan 100 H, di Sana'a pada usia sembilan puluh tahun. Para sejarawan berbeda pendapat mengenai kematiannya {cite:muruj-al-dhahab hlm. 191-192}. Ibn Khaldun menganggapnya sebagai salah satu yang memperkenalkan laporan palsu tentang Anak-anak Israel ke dalam tafsir, yang telah diperingatkan Nabi dalam ucapannya: 'Sampaikan dari aku meskipun itu ayat dan ceritakan dari Anak-anak Israel, maka tidak ada bahaya.' {cite:Muqaddima-ibn-khaldun, hlm. 27}"
