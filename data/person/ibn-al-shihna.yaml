summary:
  ar: "محب الدين ابن الشحنة الحلبي الحنفي؛ حفظ القرآن ومتوناً وبرع في الفقه والأصول والنحو والأدب فتولى قضاء قضاة الحنفية بحلب ثم دمشق، قبض عليه الظاهر برقوق سنة ثلاث وتسعين وسبعمائة فقدم إلى القاهرة ثم أفرج عنه، وقبض عليه الملك الناصر فرج سنة ثلاث عشرة وثمانمائة لقيامه مع جماعة عليه ثم أفرج عنه فاستقر في قضاء حلب وأعطي تداريس بدمشق؛ عمل تاريخاً عليفاً فيه أوهام عديدة وله نظم فائق وخط رائق وألفية رجز تشتمل على عشرة علوم وألفية اختصر فيها منظومة النسفي وضم إليها مذهب أحمد وتأليف في الفقه والأصول والتفسير، توفي بحلب يوم الجمعة ثاني عشر ربيع الآخر {cite:shadharat-dhahab p. 121-122}."
  en: "Muhibb al-Din Ibn al-Shihna (b. 749), Hanafi chief qadi of Aleppo then Damascus — imprisoned by Barquq in 793 and again by al-Nasir Faraj in 813; author of a history of Aleppo, a rajaz alfiyya spanning ten sciences, and another abridging al-Nasafi's manzuma with Hanbali additions; died at Aleppo, Friday 12 Rabi' II 815 {cite:shadharat-dhahab p. 121-122}."
  es: "Muhibb al-Din Ibn al-Shihna (n. 749), cadí jefe hanafí de Alepo y luego Damasco, encarcelado por Barquq en 793 y nuevamente por al-Nasir Faraj en 813; autor de una historia de Alepo, un rajaz alfiyya que abarca diez ciencias y otro que une el manzuma de al-Nasafi con adiciones hanbali; murió en Alepo el viernes 12 Rabi' II 815 {cita: shadharat-dhahab p. 121-122}."
  fr: "Muhibb al-Din Ibn al-Shihna (né en 749), chef cadi Hanafi d'Alep puis de Damas — emprisonné par Barquq en 793 puis par al-Nasir Faraj en 813; auteur d'une histoire d'Alep, d'un rajaz alfiyya couvrant dix sciences et d'un autre reliant le manzuma d'al-Nasafi aux ajouts hanbalis; décédé à Alep, vendredi 12 Rabi' II 815 {cite: shadharat-dhahab p. 121-122}."
  ur: "محب الدین ابن الشینا ⁦(وفات 749)⁩، حلب پھر دمشق کے حنفی سردار قاضی - 793 میں برقوق اور پھر 813 میں الناصر فراج کے ہاتھوں قید ہوئے۔ حلب کی تاریخ کے مصنف، دس علوم پر محیط رجز الفیہ، اور ایک اور النصفی کا منظومہ حنبلی اضافے کے ساتھ؛ 12 ربیع الثانی 815 بروز جمعہ حلب میں وفات پائی۔ 121-122}۔"
  tr: "Muhibeddin İbn el-Şuşahana el-Halabi el-Hanefi; Kur'an'ı ezberledi, metni okudu, fikıh, ilkeler, dilbilgisi ve edebiyatta üstün başarı gösterdi. Halep'te ve ardından Şam'da Hanefi için yargıç olarak görev yaptı. 793 Hicri'nde el-Zahir Barquq tarafından tutuklandı, ardından Kahire'ye döndü ve serbest bırakıldı. Kral el-Nasir Farac onu 800 yılında tutukladı Ah, ona karşı bir grupla birlikte durduğu için serbest bırakıldı, Halep bölgesine yerleşti ve Şam'da eğitim aldı. Birçok hayali şiirle dolu zengin bir tarih, zarif bir kompozisyon ve on bilim içeren bir Rajaz alfiyesi yazdı. El-Nasafi'nin şiirini kısalttı, Ahmad'ın okulunu da dahil etti ve fikıh, ilke ve tefsir üzerine eserler yazdı. Cuma günü, Rabi' al-Thani'nin on ikinci günü Halep'te vefat etti {atıf: Shadharat-Dhahab, s. 121-122}."
  id: "Muhib al-Din Ibn al-Shuḥāna al-Halabi al-Hanafi; ia menghafal Al-Qur'an, membaca teks, unggul dalam fiker, prinsip, tata bahasa, dan sastra. Ia menjabat sebagai hakim untuk Hanafi di Aleppo dan kemudian di Damaskus. Ia ditangkap oleh al-Zahir Barquq pada tahun 793 H, kemudian kembali ke Kairo, dan dibebaskan. Raja al-Nasir Faraj menangkapnya pada tahun 800 H karena berdiri bersama kelompok yang melawannya, kemudian ia dibebaskan, menetap di distrik Aleppo, dan mendapat studi di Damaskus. Ia menulis sejarah yang kaya dengan banyak puisi imajinasi, komposisi yang halus, dan alfiyya rajaz yang memuat sepuluh ilmu. Ia merangkum puisi al-Nasafi, termasuk aliran Ahmad dan menulis karya-karya dalam bidang fiqh, prinsip, dan tafsir. Ia meninggal di Aleppo pada hari Jumat, tanggal kedua belas Rabi' al-Thani {cite::) Shadharat-Dhahab, hlm. 121-122}."
