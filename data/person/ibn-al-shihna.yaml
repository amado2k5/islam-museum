summary:
  ar: "محب الدين ابن الشحنة الحلبي الحنفي؛ حفظ القرآن ومتوناً وبرع في الفقه والأصول والنحو والأدب فتولى قضاء قضاة الحنفية بحلب ثم دمشق، قبض عليه الظاهر برقوق سنة ثلاث وتسعين وسبعمائة فقدم إلى القاهرة ثم أفرج عنه، وقبض عليه الملك الناصر فرج سنة ثلاث عشرة وثمانمائة لقيامه مع جماعة عليه ثم أفرج عنه فاستقر في قضاء حلب وأعطي تداريس بدمشق؛ عمل تاريخاً عليفاً فيه أوهام عديدة وله نظم فائق وخط رائق وألفية رجز تشتمل على عشرة علوم وألفية اختصر فيها منظومة النسفي وضم إليها مذهب أحمد وتأليف في الفقه والأصول والتفسير، توفي بحلب يوم الجمعة ثاني عشر ربيع الآخر {cite:shadharat-dhahab p. 121-122}."
  en: "Muhibb al-Din Ibn al-Shihna (b. 749), Hanafi chief qadi of Aleppo then Damascus — imprisoned by Barquq in 793 and again by al-Nasir Faraj in 813; author of a history of Aleppo, a rajaz alfiyya spanning ten sciences, and another abridging al-Nasafi's manzuma with Hanbali additions; died at Aleppo, Friday 12 Rabi' II 815 {cite:shadharat-dhahab p. 121-122}."
