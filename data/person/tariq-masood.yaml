summary:
  ar: "داعية ومفتٍ باكستاني وُلد في سرغودها بالبنجاب سنة 1975، درس المنهج النظامي ⁦(درس نظامي)⁩ في جامعة الرشيد بكراجي وتخصص في الفقه، ويُدرّس فيها وفي دار إفتائها، وهو إمام مسجد الفلاحية بكراجي، واشتهر بخطبه الأردية المنشورة على يوتيوب ووسائل التواصل بأسلوب مباشر يتناول الأسرة والزواج وقضايا المجتمع."
  en: "Pakistani preacher and mufti born in Sargodha, Punjab, in 1975. He completed the Dars-i Nizami curriculum at Jamia Tur Rasheed in Karachi, specialised in fiqh, lectures there and in its Darul Ifta, and serves as imam of Masjid al-Falahia in Karachi. He is known for Urdu sermons distributed on YouTube and social media, in a direct style addressing family, marriage and social questions."
  ur: "پاکستانی مبلغ و مفتی، جو 1975ء میں پنجاب کے سرگودھا میں پیدا ہوئے۔ کراچی کی جامعۃ الرشید میں درسِ نظامی مکمل کیا، فقہ میں مہارت حاصل کی، وہیں اور اس کے دار الافتا میں تدریس کرتے ہیں اور کراچی کی مسجد الفلاحیہ کے امام ہیں۔ خاندان، شادی اور سماجی مسائل پر براہِ راست انداز میں اردو خطبات سے شہرت پائی۔"
  es: "Predicador y muftí pakistaní nacido en Sargodha, Punjab, en 1975. Completó el programa de estudios Dars-i Nizami en Jamia Tur Rasheed, Karachi, donde se especializó en fiqh (jurisprudencia islámica). Imparte clases allí y en su Darul Ifta, y es imán de la mezquita Masjid al-Falahia en Karachi. Es conocido por sus sermones en urdu, difundidos en YouTube y redes sociales, en los que aborda con franqueza temas familiares, matrimoniales y sociales."
  fr: "Prédicateur et mufti pakistanais né à Sargodha, au Pendjab, en 1975. Il a suivi le cursus Dars-i Nizami à la Jamia Tur Rasheed de Karachi, s'est spécialisé en fiqh (jurisprudence islamique), où il enseigne, ainsi qu'à sa Darul Ifta (école coranique). Il est également imam de la mosquée al-Falahia à Karachi. Il est connu pour ses sermons en ourdou, diffusés sur YouTube et les réseaux sociaux, où il aborde avec franchise les questions familiales, matrimoniales et sociales."
  tr: "1975 yılında Pencap'ın Sargodha kentinde doğan Pakistanlı vaiz ve müfti olan Sher, Karaçi'deki Al-Rasheed Üniversitesi'nde Nizami müfredatını (Nizami dersi) okudu ve fıkıh alanında uzmanlaştı. Burada ve Dar al-Ifta'da ders vermektedir. Karaçi'deki El-Falahiya Camii'nin imamı olup, aile, evlilik ve sosyal konuları doğrudan ele alan YouTube ve sosyal medyada yayımlanan Urduca vaazlarıyla ünlüdür."
  id: "Seorang pengkhotbah dan mufti Pakistan yang lahir di Sargodha, Punjab, pada tahun 1975, ia mempelajari kurikulum Nizami (pelajaran Nizami) di Universitas Al-Rasheed di Karachi, dengan spesialisasi dalam bidang hukum. Ia mengajar di sana dan di Dar al-Ifta. Ia adalah imam Masjid Al-Falahiya di Karachi dan terkenal dengan khotbahnya dalam bahasa Urdu yang dipublikasikan di YouTube dan media sosial dengan gaya langsung yang membahas isu keluarga, pernikahan, dan sosial."
