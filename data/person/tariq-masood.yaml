summary:
  ar: "داعية ومفتٍ باكستاني وُلد في سرغودها بالبنجاب سنة 1975، درس المنهج النظامي ⁦(درس نظامي)⁩ في جامعة الرشيد بكراجي وتخصص في الفقه، ويُدرّس فيها وفي دار إفتائها، وهو إمام مسجد الفلاحية بكراجي، واشتهر بخطبه الأردية المنشورة على يوتيوب ووسائل التواصل بأسلوب مباشر يتناول الأسرة والزواج وقضايا المجتمع."
  en: "Pakistani preacher and mufti born in Sargodha, Punjab, in 1975. He completed the Dars-i Nizami curriculum at Jamia Tur Rasheed in Karachi, specialised in fiqh, lectures there and in its Darul Ifta, and serves as imam of Masjid al-Falahia in Karachi. He is known for Urdu sermons distributed on YouTube and social media, in a direct style addressing family, marriage and social questions."
  ur: "پاکستانی مبلغ و مفتی، جو 1975ء میں پنجاب کے سرگودھا میں پیدا ہوئے۔ کراچی کی جامعۃ الرشید میں درسِ نظامی مکمل کیا، فقہ میں مہارت حاصل کی، وہیں اور اس کے دار الافتا میں تدریس کرتے ہیں اور کراچی کی مسجد الفلاحیہ کے امام ہیں۔ خاندان، شادی اور سماجی مسائل پر براہِ راست انداز میں اردو خطبات سے شہرت پائی۔"
