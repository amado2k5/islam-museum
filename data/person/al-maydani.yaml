  ar: "أبو الفضل أحمد بن محمد بن أحمد بن إبراهيم الميداني النيسابوري الأديب؛ اختص بصحبة أبي الحسن الواحدي صاحب التفسير وأتقن فن العربية خصوصاً اللغة وأمثال العرب؛ من تصانيفه كتاب «الأمثال» المنسوب إليه ولم يُعمل مثله في بابه وكتاب «السامي في الأسامي»؛ وابنه أبو سعد سعيد بن أحمد فاضل أيضاً وله كتاب «الأسمى في الأسماء» وتوفي سنة تسع وثلاثين وخمسمائة {cite:wafayat-ayan}."
  en: "Abu al-Fadl al-Maydani al-Nisaburi (d. 518) — the great collector of Arab proverbs (Majma' al-Amthal), companion of the mufassir al-Wahidi; his son Abu Sa'd wrote al-Asma fi al-Asma' {cite:wafayat-ayan}."
