summary:
  ar: "قارئ قرآن مصري (1938–2016) من برما بالغربية، تلقّى رواية ورش بالمعهد الأحمدي بطنطا، واعتُمد قارئًا بالإذاعة المصرية في 1962 وهو في الثانية والعشرين بعد أن عرفه رواد مسجد الحسين جنديًا يؤذن ويقرأ فيه، وظل يقرأ قرآن الفجر على الهواء من كبرى مساجد مصر."
  en: "Egyptian Qur'an reciter (1938–2016) from Birma in Gharbia who learned the Warsh reading at the Ahmadi institute in Tanta and was admitted as an Egyptian Radio reciter in 1962, aged 22, after worshippers at al-Hussein Mosque came to know him as a conscript giving the adhan and reciting there; he went on reciting the dawn Qur'an live from Egypt's great mosques."
  ur: "مصری قاریِ قرآن ⁦(1938ء–2016ء)⁩، غربیہ کے برما سے، جنھوں نے طنطا کے معہدِ احمدی میں روایتِ ورش سیکھی اور 1962ء میں بائیس برس کی عمر میں مصری ریڈیو کے قاری بنے، جب مسجد حسین کے نمازی انھیں فوجی سپاہی کے طور پر وہاں اذان اور تلاوت کرتے جان چکے تھے؛ بعد میں مصر کی بڑی مساجد سے فجر کی تلاوت براہِ راست کرتے رہے۔"
  es: "Recitador egipcio del Corán (1938-2016) originario de Birma, en Gharbia, que aprendió la lectura Warsh en el instituto Ahmadi de Tanta y fue admitido como recitador de la Radio Egipcia en 1962, a los 22 años, después de que los fieles de la mezquita de al-Hussein lo conocieran como un recluta que realizaba el adhan y recitaba allí; continuó recitando el Corán del amanecer en directo desde las grandes mezquitas de Egipto."
  fr: "Récitateur du Coran égyptien (1938-2016) originaire de Birma en Gharbia, qui a appris la lecture Warsh à l'institut Ahmadi de Tanta et a été admis comme récitant à la radio égyptienne en 1962, à l'âge de 22 ans, après que les fidèles de la mosquée al-Hussein l'aient reconnu comme un conscrit donnant l'adhan et récitant là-bas; il a continué à réciter le Coran de l'aube en direct depuis les grandes mosquées d'Égypte."
  tr: "Burma, Garbia'dan Mısırlı bir Kur'an okuyucu (1938–2016) olan Sher, Tanta'daki Ahmadi Enstitüsü'nde Ursh rivayetini aldı. 1962'de, yirmi iki yaşında, El-Hüseyin Camii'ni ziyaret edenlerin onu namaz kılıp okan bir asker olarak tanımasının ardından, Mısır Radyosu tarafından okunma sertifikası aldı. Mısır'ın en büyük camilerinden birinden canlı olarak Fencr Kur'an'ı okumaya devam etti."
  id: "Sebagai pembaca Al-Qur'an Mesir (1938–2016) dari Burma, Gharbia, ia menerima narasi Ursh di Institut Ahmadi di Tanta. Ia disertifikasi sebagai pembaca Al-Qur'an oleh Radio Mesir pada tahun 1962 pada usia dua puluh dua tahun, setelah pengunjung Masjid Al-Hussein mengenalinya sebagai seorang prajurit yang berdoa dan membaca di sana. Ia terus membacakan Al-Qur'an Fajr secara langsung dari salah satu masjid terbesar di Mesir."
