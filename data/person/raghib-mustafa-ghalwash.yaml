summary:
  ar: "قارئ قرآن مصري (1938–2016) من برما بالغربية، تلقّى رواية ورش بالمعهد الأحمدي بطنطا، واعتُمد قارئًا بالإذاعة المصرية في 1962 وهو في الثانية والعشرين بعد أن عرفه رواد مسجد الحسين جنديًا يؤذن ويقرأ فيه، وظل يقرأ قرآن الفجر على الهواء من كبرى مساجد مصر."
  en: "Egyptian Qur'an reciter (1938–2016) from Birma in Gharbia who learned the Warsh reading at the Ahmadi institute in Tanta and was admitted as an Egyptian Radio reciter in 1962, aged 22, after worshippers at al-Hussein Mosque came to know him as a conscript giving the adhan and reciting there; he went on reciting the dawn Qur'an live from Egypt's great mosques."
  ur: "مصری قاریِ قرآن ⁦(1938ء–2016ء)⁩، غربیہ کے برما سے، جنھوں نے طنطا کے معہدِ احمدی میں روایتِ ورش سیکھی اور 1962ء میں بائیس برس کی عمر میں مصری ریڈیو کے قاری بنے، جب مسجد حسین کے نمازی انھیں فوجی سپاہی کے طور پر وہاں اذان اور تلاوت کرتے جان چکے تھے؛ بعد میں مصر کی بڑی مساجد سے فجر کی تلاوت براہِ راست کرتے رہے۔"
