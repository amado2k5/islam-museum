summary:
  ar: "\u0642\u0627\u0631\u0626 \u0642\u0631\u0622\u0646 \u0645\u0635\u0631\u064a (1938\u20132016) \u0645\u0646 \u0628\u0631\u0645\u0627 \u0628\u0627\u0644\u063a\u0631\u0628\u064a\u0629\u060c \u062a\u0644\u0642\u0651\u0649 \u0631\u0648\u0627\u064a\u0629 \u0648\u0631\u0634 \u0628\u0627\u0644\u0645\u0639\u0647\u062f \u0627\u0644\u0623\u062d\u0645\u062f\u064a \u0628\u0637\u0646\u0637\u0627\u060c \u0648\u0627\u0639\u062a\u064f\u0645\u062f \u0642\u0627\u0631\u0626\u064b\u0627 \u0628\u0627\u0644\u0625\u0630\u0627\u0639\u0629 \u0627\u0644\u0645\u0635\u0631\u064a\u0629 \u0641\u064a 1962 \u0648\u0647\u0648 \u0641\u064a \u0627\u0644\u062b\u0627\u0646\u064a\u0629 \u0648\u0627\u0644\u0639\u0634\u0631\u064a\u0646 \u0628\u0639\u062f \u0623\u0646 \u0639\u0631\u0641\u0647 \u0631\u0648\u0627\u062f \u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0633\u064a\u0646 \u062c\u0646\u062f\u064a\u064b\u0627 \u064a\u0624\u0630\u0646 \u0648\u064a\u0642\u0631\u0623 \u0641\u064a\u0647\u060c \u0648\u0638\u0644 \u064a\u0642\u0631\u0623 \u0642\u0631\u0622\u0646 \u0627\u0644\u0641\u062c\u0631 \u0639\u0644\u0649 \u0627\u0644\u0647\u0648\u0627\u0621 \u0645\u0646 \u0643\u0628\u0631\u0649 \u0645\u0633\u0627\u062c\u062f \u0645\u0635\u0631."
  en: "Egyptian Qur'an reciter (1938\u20132016) from Birma in Gharbia who learned the Warsh reading at the Ahmadi institute in Tanta and was admitted as an Egyptian Radio reciter in 1962, aged 22, after worshippers at al-Hussein Mosque came to know him as a conscript giving the adhan and reciting there; he went on reciting the dawn Qur'an live from Egypt's great mosques."
  ur: "\u0645\u0635\u0631\u06cc \u0642\u0627\u0631\u06cc\u0650 \u0642\u0631\u0622\u0646 (1938\u0621\u20132016\u0621)\u060c \u063a\u0631\u0628\u06cc\u06c1 \u06a9\u06d2 \u0628\u0631\u0645\u0627 \u0633\u06d2\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0637\u0646\u0637\u0627 \u06a9\u06d2 \u0645\u0639\u06c1\u062f\u0650 \u0627\u062d\u0645\u062f\u06cc \u0645\u06cc\u06ba \u0631\u0648\u0627\u06cc\u062a\u0650 \u0648\u0631\u0634 \u0633\u06cc\u06a9\u06be\u06cc \u0627\u0648\u0631 1962\u0621 \u0645\u06cc\u06ba \u0628\u0627\u0626\u06cc\u0633 \u0628\u0631\u0633 \u06a9\u06cc \u0639\u0645\u0631 \u0645\u06cc\u06ba \u0645\u0635\u0631\u06cc \u0631\u06cc\u0688\u06cc\u0648 \u06a9\u06d2 \u0642\u0627\u0631\u06cc \u0628\u0646\u06d2\u060c \u062c\u0628 \u0645\u0633\u062c\u062f \u062d\u0633\u06cc\u0646 \u06a9\u06d2 \u0646\u0645\u0627\u0632\u06cc \u0627\u0646\u06be\u06cc\u06ba \u0641\u0648\u062c\u06cc \u0633\u067e\u0627\u06c1\u06cc \u06a9\u06d2 \u0637\u0648\u0631 \u067e\u0631 \u0648\u06c1\u0627\u06ba \u0627\u0630\u0627\u0646 \u0627\u0648\u0631 \u062a\u0644\u0627\u0648\u062a \u06a9\u0631\u062a\u06d2 \u062c\u0627\u0646 \u0686\u06a9\u06d2 \u062a\u06be\u06d2\u061b \u0628\u0639\u062f \u0645\u06cc\u06ba \u0645\u0635\u0631 \u06a9\u06cc \u0628\u0691\u06cc \u0645\u0633\u0627\u062c\u062f \u0633\u06d2 \u0641\u062c\u0631 \u06a9\u06cc \u062a\u0644\u0627\u0648\u062a \u0628\u0631\u0627\u06c1\u0650 \u0631\u0627\u0633\u062a \u06a9\u0631\u062a\u06d2 \u0631\u06c1\u06d2\u06d4"
