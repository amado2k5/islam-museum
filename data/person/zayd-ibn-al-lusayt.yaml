summary:
  ar: "كان في رحل عمارة بن حزم، ويصفه ابن إسحاق بالمنافق؛ نُسب إليه قول عن ضلال ناقة النبي أخبر النبي بمكان الناقة، ويختلف الناس في توبته."
  en: He was in the litter of Umara ibn Hazm, and Ibn Ishaq calls him a hypocrite; a saying about the Prophet's strayed she-camel was attributed to him, to which the Prophet answered by announcing where the camel was. People differ on his repentance.
  es: "Pertenecía a la misma camada que Umara ibn Hazm, e Ibn Ishaq lo tacha de hipócrita; se le atribuye un dicho sobre la camella extraviada del Profeta, a lo que este respondió anunciando dónde se encontraba. Existen diferentes versiones sobre su arrepentimiento."
  fr: "Il faisait partie de la portée d'Umara ibn Hazm, et Ibn Ishaq le qualifie d'hypocrite; on lui attribue un hadith concernant la chamelle égarée du Prophète, auquel le Prophète répondit en révélant où elle se trouvait. Les avis divergent quant à son repentir."
  ur: "وہ عمارہ بن حزم کے کوڑے میں تھا، اور ابن اسحاق نے اسے منافق کہا ہے۔ نبی کی بھٹکی ہوئی اونٹنی کے بارے میں ایک قول ان سے منسوب کیا گیا تھا، جس کے جواب میں نبی نے اعلان کیا کہ اونٹ کہاں ہے۔ اس کی توبہ میں لوگوں کا اختلاف ہے۔"
