summary:
  ar: دين شمس الدين ⁦(1958–)⁩ عالم وسياسي إندونيسي، ترأس جمعية Muhammadiyah أكبر المنظمات الإسلامية الحديثة في العالم دورتين ⁦(2005–2015)⁩، وترأس مجلس العلماء الإندونيسي، وهو من وجوه الحوار بين الأديان
    في آسيا.
  en: Din Syamsuddin (born 1958) is an Indonesian scholar and organisation leader who chaired Muhammadiyah, the world's largest modernist Islamic mass movement, for two terms (2005–2015), later headed the
    Indonesian Council of Ulama (MUI) advisory board, and became a leading Asian figure in interfaith peace work.
  ur: دین شمس الدین ⁦(1958–)⁩ انڈونیشین عالم اور تنظیمی قائد ہیں جو دنیا کی سب سے بڑی جدید اسلامی عوامی تنظیم Muhammadiyah کے دو مدتوں ⁦(2005–2015)⁩ تک صدر رہے، بعد ازاں انڈونیشین کونسل آف علما ⁦(MUI)⁩
    کے مشاورتی بورڈ کے سربراہ رہے اور ایشیا میں بین المذاہب امن کے معروف چہرہ ہیں۔
  es: "Din Syamsuddin (nacido en 1958) es un académico y líder de organizaciones indonesio que presidió Muhammadiyah, el movimiento islámico de masas modernista más grande del mundo, durante dos mandatos (2005-2015), posteriormente dirigió el consejo asesor del Consejo Indonesio de Ulemas (MUI) y se convirtió en una figura asiática destacada en el trabajo por la paz interreligiosa."
  fr: "Din Syamsuddin (né en 1958) est un érudit et dirigeant d'organisation indonésien qui a présidé Muhammadiyah, le plus grand mouvement de masse islamique moderniste au monde, pendant deux mandats (2005-2015), a ensuite dirigé le conseil consultatif du Conseil indonésien des oulémas (MUI) et est devenu une figure asiatique de premier plan dans le travail de paix interreligieux."
  tr: "Din Şemsuddin (1958–) Endonezyalı bir akademisyen ve siyasetçiydi. Dünyanın en büyük modern İslami örgütü olan Muhammediye Derneği'ne iki dönem başkanlık etti (2005–2015) ve Asya'da dinlerarası diyalogda önde gelen bir figür olan Endonezya Alimler Konseyi'ne başkanlık etti."
  id: "Din Shamsuddin (1958–) adalah seorang ulama dan politikus Indonesia. Ia memimpin Asosiasi Muhammadiyah, organisasi Islam modern terbesar di dunia, selama dua periode (2005–2015), dan memimpin Dewan Ulama Indonesia, tokoh terkemuka dalam dialog antaragama di Asia."
