summary:
  ar: "ثالث رؤساء دولة الإمارات العربية المتحدة وحاكم أبوظبي منذ 2022، ثالث أبناء زايد بن سلطان آل نهيان. وُلد سنة 1961 وتخرج في أكاديمية ساندهيرست العسكرية سنة 1979 وخدم في القوات المسلحة حتى صار جنرالًا، ثم ولي عهد أبوظبي سنة 2004، وتولى القيادة الفعلية للدولة بعد إصابة أخيه خليفة بجلطة سنة 2014، وخلفه عند وفاته في مايو 2022 فانتُخب رئيسًا في 14 مايو 2022. قاد سياسة خارجية تدخلية، وشاركت الإمارات في عهده في الحرب على تنظيم الدولة وفي اليمن، وقطعت العلاقات مع قطر سنة 2017، ووقّعت اتفاقات أبراهام مع إسرائيل سنة 2020، واستقبل البابا فرنسيس في أول زيارة بابوية لشبه الجزيرة العربية سنة 2019. وهو معارض صريح للإخوان المسلمين ولإيران."
  en: "Third President of the United Arab Emirates and ruler of Abu Dhabi since 2022, the third son of Zayed bin Sultan Al Nahyan. Born in 1961, he graduated from the Royal Military Academy Sandhurst in 1979, served in the armed forces and rose to general, became crown prince of Abu Dhabi in 2004, and took de facto leadership of the state after his half-brother Khalifa's stroke in 2014; on Khalifa's death in May 2022 he succeeded him and was elected president on 14 May 2022. He has led an interventionist foreign policy: the war against ISIS, the Yemen intervention, the 2017 rupture with Qatar, the 2020 Abraham Accords with Israel, and the first papal visit to the Arabian Peninsula in 2019. He is a declared opponent of the Muslim Brotherhood and of Iran."
  ur: "متحدہ عرب امارات کے تیسرے صدر اور 2022ء سے ابوظبی کے حکمران، زاید بن سلطان آل نہیان کے تیسرے صاحبزادے۔ 1961ء میں پیدا ہوئے، 1979ء میں رائل ملٹری اکیڈمی سینڈہرسٹ سے فارغ التحصیل ہوئے، مسلح افواج میں خدمات انجام دے کر جنرل بنے، 2004ء میں ابوظبی کے ولی عہد ہوئے، اور 2014ء میں اپنے سوتیلے بھائی خلیفہ کو فالج ہونے کے بعد ریاست کی عملی قیادت سنبھالی؛ مئی 2022ء میں خلیفہ کی وفات پر جانشین بنے اور 14 مئی 2022ء کو صدر منتخب ہوئے۔ انہوں نے مداخلت پسند خارجہ پالیسی کی قیادت کی: داعش کے خلاف جنگ، یمن میں مداخلت، 2017ء میں قطر سے تعلقات کی قطع، 2020ء میں اسرائیل کے ساتھ ابراہیمی معاہدے، اور 2019ء میں جزیرہ نما عرب کی پہلی پوپ کی آمد۔ وہ اخوان المسلمون اور ایران کے کھلے مخالف ہیں۔"
  es: "Tercer presidente de los Emiratos Árabes Unidos y gobernante de Abu Dabi desde 2022, tercer hijo de Zayed bin Sultan Al Nahyan. Nacido en 1961, se graduó de la Real Academia Militar de Sandhurst en 1979, sirvió en las fuerzas armadas y alcanzó el rango de general, se convirtió en príncipe heredero de Abu Dabi en 2004 y asumió el liderazgo de facto del Estado tras el derrame cerebral de su hermanastro Khalifa en 2014. Tras la muerte de Khalifa en mayo de 2022, lo sucedió y fue elegido presidente el 14 de mayo de 2022. Ha liderado una política exterior intervencionista: la guerra contra el ISIS, la intervención en Yemen, la ruptura con Catar en 2017, los Acuerdos de Abraham con Israel en 2020 y la primera visita papal a la Península Arábiga en 2019. Es un declarado opositor de los Hermanos Musulmanes y de Irán."
  fr: "Troisième président des Émirats arabes unis et dirigeant d'Abou Dhabi depuis 2022, il est le troisième fils de Zayed ben Sultan Al Nahyan. Né en 1961, il est diplômé de l'Académie royale militaire de Sandhurst (promotion 1979), a servi dans les forces armées jusqu'au grade de général, est devenu prince héritier d'Abou Dhabi en 2004 et a assumé de facto la direction de l'État après l'accident vasculaire cérébral de son demi-frère Khalifa en 2014. À la mort de ce dernier en mai 2022, il lui a succédé et a été élu président le 14 mai 2022. Il a mené une politique étrangère interventionniste: la guerre contre Daech, l'intervention au Yémen, la rupture des relations avec le Qatar en 2017, les accords d'Abraham avec Israël en 2020 et la première visite papale dans la péninsule arabique en 2019. Il est un opposant déclaré aux Frères musulmans et à l'Iran."
  tr: "Birleşik Arap Emirlikleri'nin üçüncü cumhurbaşkanı ve 2022'den beri Abu Dabi'nin yöneticisi, Zayed bin Sultan Al Nahyan'ın üçüncü oğludur. 1961 doğumlu, 1979'da Sandhurst Askeri Akademisi'nden mezun oldu, general olana kadar silahlı kuvvetlerde görev yaptı, ardından 2004'te Abu Dabi'nin veliaht prensi oldu, 2014'te kardeşi Halife'nin felç geçirmesiyle devletin fiili liderliğini üstlendi, ölümünden sonra onun yerine geçti. Mayıs 2022'de cumhurbaşkanı seçildi. Müdahaleci bir dış politika yürüttü ve görev süresi boyunca BAE, IŞİD'e ve Yemen'e karşı savaşa katıldı, 2017'de Katar ile ilişkileri kesti, 2020'de İsrail ile İbrahim Anlaşmaları'nı imzaladı ve 2019'da Papa Francis'i Arap Yarımadası'na yaptığı ilk papalık ziyaretinde karşıladı. Müslüman Kardeşler ve İran'a açık sözlü bir muhaliftir."
  id: "Presiden ketiga Uni Emirat Arab dan penguasa Abu Dhabi sejak 2022, putra ketiga Zayed bin Sultan Al Nahyan. Ia lahir pada 1961, lulus dari Akademi Militer Sandhurst pada 1979, bertugas di angkatan bersenjata hingga menjadi jenderal, kemudian putra mahkota Abu Dhabi pada 2004, mengambil alih kepemimpinan negara setelah saudaranya Khalifa mengalami stroke pada 2014, menggantikannya setelah kematiannya pada Mei 2022, dan terpilih sebagai presiden pada 14 Mei 2022. Ia memimpin kebijakan luar negeri intervensi, dan selama masa jabatannya, UEA berpartisipasi dalam perang melawan ISIS dan di Yaman, memutuskan hubungan dengan Qatar pada 2017, menandatangani Abraham Accords dengan Israel pada 2020, dan menerima Paus Fransiskus dalam kunjungan kepausan pertamanya ke Semenanjung Arab pada 2019. Ia adalah penentang vokal Ikhwanul Muslimin dan Iran."
