summary:
  ar: "ثالث رؤساء دولة الإمارات العربية المتحدة وحاكم أبوظبي منذ 2022، ثالث أبناء زايد بن سلطان آل نهيان. وُلد سنة 1961 وتخرج في أكاديمية ساندهيرست العسكرية سنة 1979 وخدم في القوات المسلحة حتى صار جنرالًا، ثم ولي عهد أبوظبي سنة 2004، وتولى القيادة الفعلية للدولة بعد إصابة أخيه خليفة بجلطة سنة 2014، وخلفه عند وفاته في مايو 2022 فانتُخب رئيسًا في 14 مايو 2022. قاد سياسة خارجية تدخلية، وشاركت الإمارات في عهده في الحرب على تنظيم الدولة وفي اليمن، وقطعت العلاقات مع قطر سنة 2017، ووقّعت اتفاقات أبراهام مع إسرائيل سنة 2020، واستقبل البابا فرنسيس في أول زيارة بابوية لشبه الجزيرة العربية سنة 2019. وهو معارض صريح للإخوان المسلمين ولإيران."
  en: "Third President of the United Arab Emirates and ruler of Abu Dhabi since 2022, the third son of Zayed bin Sultan Al Nahyan. Born in 1961, he graduated from the Royal Military Academy Sandhurst in 1979, served in the armed forces and rose to general, became crown prince of Abu Dhabi in 2004, and took de facto leadership of the state after his half-brother Khalifa's stroke in 2014; on Khalifa's death in May 2022 he succeeded him and was elected president on 14 May 2022. He has led an interventionist foreign policy: the war against ISIS, the Yemen intervention, the 2017 rupture with Qatar, the 2020 Abraham Accords with Israel, and the first papal visit to the Arabian Peninsula in 2019. He is a declared opponent of the Muslim Brotherhood and of Iran."
  ur: "متحدہ عرب امارات کے تیسرے صدر اور 2022ء سے ابوظبی کے حکمران، زاید بن سلطان آل نہیان کے تیسرے صاحبزادے۔ 1961ء میں پیدا ہوئے، 1979ء میں رائل ملٹری اکیڈمی سینڈہرسٹ سے فارغ التحصیل ہوئے، مسلح افواج میں خدمات انجام دے کر جنرل بنے، 2004ء میں ابوظبی کے ولی عہد ہوئے، اور 2014ء میں اپنے سوتیلے بھائی خلیفہ کو فالج ہونے کے بعد ریاست کی عملی قیادت سنبھالی؛ مئی 2022ء میں خلیفہ کی وفات پر جانشین بنے اور 14 مئی 2022ء کو صدر منتخب ہوئے۔ انہوں نے مداخلت پسند خارجہ پالیسی کی قیادت کی: داعش کے خلاف جنگ، یمن میں مداخلت، 2017ء میں قطر سے تعلقات کی قطع، 2020ء میں اسرائیل کے ساتھ ابراہیمی معاہدے، اور 2019ء میں جزیرہ نما عرب کی پہلی پوپ کی آمد۔ وہ اخوان المسلمون اور ایران کے کھلے مخالف ہیں۔"
