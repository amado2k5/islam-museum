summary:
  ar: "الأمير الكبير الذي لقب بالملك الكامل؛ نزل في آخر سنة تسع وسبعين إلى الشام غازياً فنزل قريباً من عكا فخضع له أهلها وراسلوه في الهدنة، وجاء إلى خدمته عيسى بن مهنا فصفح عنه وأكرمه؛ وولي نيابة دمشق له عز الدين أزدمار الجمدار الذي استشهد على حمص سنة ثمانين {cite:shadharat-dhahab p. 634, 643}."
  en: "The great amir titled al-Malik al-Kamil — at the end of 679 he came down on Syria as a raider, camped near Acre until its people sued for truce, and received Isa b. Muhanna into his service; his Damascus na'ib Azdamur died martyred at Homs in 680 {cite:shadharat-dhahab p. 634, 643}."
