names:
  - { value: "السلطان الملك الكامل سنقر الأشقر الصالحي النجمي", kind: full }
summary:
  ar: "الأمير الكبير الذي لقب بالملك الكامل؛ نزل في آخر سنة تسع وسبعين إلى الشام غازياً فنزل قريباً من عكا فخضع له أهلها وراسلوه في الهدنة، وجاء إلى خدمته عيسى بن مهنا فصفح عنه وأكرمه؛ وولي نيابة دمشق له عز الدين أزدمار الجمدار الذي استشهد على حمص سنة ثمانين {cite:shadharat-dhahab p. 634, 643}."
  en: "The great amir titled al-Malik al-Kamil — at the end of 679 he came down on Syria as a raider, camped near Acre until its people sued for truce, and received Isa b. Muhanna into his service; his Damascus na'ib Azdamur died martyred at Homs in 680 {cite:shadharat-dhahab p. 634, 643}."
  es: "El gran emir titulado al-Malik al-Kamil — a finales de 679 llegó a Siria como asaltante, acampó cerca de Acre hasta que su gente pidió una tregua y recibió a Isa b. Muhanna a su servicio; su na'ib Azdamur de Damasco murió martirizado en Homs en 680 {cite:shadharat-dhahab p. 634, 643}."
  fr: "Le grand émir titré al-Malik al-Kamil — à la fin de 679, il descendit sur la Syrie en tant que pillard, campa près d'Acre jusqu'à ce que ses habitants demandent une trêve, et reçut Isa b. Muhanna à son service; son na'ib Azdamur de Damas mourut martyr à Homs en 680 {cite:shadharat-dhahab p. 634, 643}."
  ur: "عظیم امیر المالک الکامل کے عنوان سے - 679 کے آخر میں وہ ایک حملہ آور کے طور پر شام پر اترا، ایکڑ کے قریب ڈیرہ ڈالا یہاں تک کہ اس کے لوگوں نے جنگ بندی کے لئے مقدمہ کیا اور عیسیٰ بن کا استقبال کیا۔ موہنا ان کی خدمت میں؛ ان کے دمشق کے نائب عزدامور نے 680 میں حمص میں شہادت پائی۔ 634، 643}۔"
  tr: "Büyük prens, Kral El-Kamil unvanını taşıyordu, 79 Hicri'nin son yılında savaşçı olarak Şam'a indi, Akka yakınlarına indi; burada halk ona boyun eğdi ve ateşkesle yazıştı. İsa ibn Muhanna ona hizmet etmeye geldi, onu affetti ve onurlandırdı. Şam'ın vekili, seksen yılında Homs'ta şehit edilen İzzeddin Azdmar al-Jamdar tarafından onun yerine atandı {atıf:shadharat-dhahab, s. 634, 643}."
  id: "Pangeran agung bergelar Raja Al-Kamil turun pada tahun terakhir tujuh puluh sembilan AH sebagai pejuang ke Levant, mendarat di dekat Acre, di mana rakyatnya tunduk kepadanya dan berkorespondensi dengannya dalam gencatan senjata. Isa ibn Muhanna datang untuk melayaninya, mengampuninya, dan menghormatinya. Wakil Damaskus diangkat untuknya oleh Izz al-Din Azdmar al-Jamdar, yang menjadi martir di Homs pada tahun delapan puluh {cite:shadharat-dhahab, hlm. 634, 643}."
