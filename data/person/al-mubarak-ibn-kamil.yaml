summary:
  ar: "المبارك بن كامل الطغري البغدادي المحدث الحنبلي مفيد العراق أبو بكر؛ ولد يوم الخميس ثاني عشر ذي الحجة سنة خمس وتسعين وأربعمائة وقرأ القرآن بالروايات وسمع الحديث الكثير وأول سماعه سنة ست وخمسمائة وعني بهذا الشأن سمع من أبي القاسم بن بيان وابن نبهات وغيرهما؛ قال ابن الجوزي وما زال يسمع العالي والنازل ويتتبع المشايخ في الروايات وينقل السماعات فلو قيل إنه سمع من ثلاثة آلاف شيخ لم يبعد القائل وجالس الحفاظ وكتب بخطه الكثير وانتهت إليه معرفة المشايخ ومقدار ما سمعوا والإجازات إلا أنه كان قليل التحقيق فيما ينقل من السماع مجازقة لكونه يأخذ عن ذلك ثمناً وكان فقيراً إلى ما يأخذ وكان كثير الأولاد وله كتاب سلوة الأحزان نحو ثلاثمائة جزء وأكثر وكان صدوقاً؛ توفي يوم الجمعة تاسع عشر جمادى الأولى سنة ثلاث وأربعين وخمسمائة ودفن بالشونيزية {cite:shadharat-dhahab p. 615-616}."
  en: "Al-Mubarak ibn Kamil al-Tughri of Baghdad, the Hanbali muhaddith, mufid of Iraq; b. Thursday 12 Dhu al-Hijja 495, he read the Qur'an in its readings and heard hadith widely from 506 on, pursuing the shaykhs of every riwaya — Ibn al-Jawzi: 'were it said he heard from three thousand shaykhs the claim would not strain'; he sat with the huffaz, copied much, and became the final authority on who heard what from whom — though he took pay for passing on samā' certificates and was poor to what he earned; his Salwat al-Ahzan runs near three hundred juz'; a truthful man, he died Friday 19 Jumada I 543 and was buried at the Shuniziyya {cite:shadharat-dhahab p. 615-616}."
  fr: "Al-Moubarak ibn Kamil al-Tughri de Bagdad, le Hanbali muhaddith, mufide d'Irak  ; né jeudi 12 Dhu al-Hijja 495, il lut le Coran dans ses lectures et entendit largement les hadiths de 506, poursuivant les shaykhs de chaque riwaya - Ibn al-Jawzi  : « S'il avait dit qu'il n'entendrait de trois mille shakhs  » il s'assit avec le huffaz, copia beaucoup, et devint l'autorité finale sur qui entendait quoi de qui - bien qu'il ait été payé pour la transmission des certificats de sam et qu'il fût pauvre à ce qu'il gagnait ; son Salwat al-Ahzan court près de trois cents juz ' ; un homme véridique, il est mort vendredi 19 Jumada I 543 et a été enterré à la Shuniziyya {cite:shadharat-dhahab p. 615-616}."
  es: "Al-Mubarak ibn Kamil al-Tughri de Bagdad, el muhaddith hanbalí, mufid de Irak; n. Jueves 12 Dhu al-Hijja 495, leyó el Corán en sus lecturas y escuchó hadices extensamente desde 506 en adelante, siguiendo a los shaykhs de cada riwaya — Ibn al-Jawzi: 'si se dijera que escuchó a tres mil shaykhs, la afirmación no sería exagerada'; se sentaba con los huffaz, copiaba mucho y se convirtió en la autoridad final sobre quién escuchó qué de quién — aunque cobraba por transmitir certificados samā' y era pobre en comparación con lo que ganaba; su Salwat al-Ahzan tiene cerca de trescientos juz'; un hombre veraz, murió el viernes 19 Jumada I 543 y fue enterrado en Shuniziyya {cite:shadharat-dhahab p. 615-616}."
  ur: "المبارک ابن کامل الطغری بغداد، حنبلی محدث، مؤلف عراق؛ ب جمعرات 12 ذی الحجہ 495 کو اس نے قرآن پڑھا اور 506 سے بڑے پیمانے پر حدیثیں سنی، ہر رویہ کے شیخوں کا تعاقب کیا - ابن الجوزی: 'اگر یہ کہا جائے کہ تین ہزار شیوخ سے سنا ہے تو دعویٰ تنگ نہیں ہوگا'؛ وہ حفاظ کے ساتھ بیٹھا، بہت کچھ نقل کیا، اور اس پر حتمی اتھارٹی بن گیا کہ کس نے کس سے کیا سنا - حالانکہ اس نے سماع کے سرٹیفکیٹ دینے کی تنخواہ لی اور جو کمایا اس سے غریب تھا۔ اس کی صلوۃ الاحزان تین سو جوز کے قریب ہے۔ ایک سچے آدمی تھے، ان کا انتقال جمعہ 19 جمادی الثانی 543ء میں ہوا اور شونیضیہ میں دفن ہوئے۔ 615-616}۔"
  tr: "El-Mübarek ibn Kamil el-Tuğri el-Bağdadi, Hanbelî hadis âlimi, Mufid el-Irak, Ebu Bekir; Zhu Hicce'nin on ikinci Perşembe günü, dört yüz doksan beş hicri doğumlu Zümhe, Kur'an'ı rivayetlerle birlikte okudu ve birçok hadis dinledi. İlk dinlemesi 506 H yılındaydı. Bu konuyla ilgilendi ve Ebu el-Kasım bin Bayan, İbn Nabet ve diğerlerinden dinledi; İbn al-Cavazi şöyle dedi: Hâlâ yüksek ve alçakları dinler, şeyhlerin rivayetlerini takip eder ve rivayetleri aktarır. Eğer üç bin şeyhten duyduğu söylenirse, konuşan çok uzakta olmazdı, ezberleyenlerle oturup el yazısıyla çok şey yazdı. Şeyhler hakkında, duyduklarının kapsamı ve yetkiler hakkında bilgisi vardı, ancak işitmekten iletilenlerin doğrulanması çok azdı; bu da kendi çıkarına bir sebepti, çünkü bunun için ücret aldı. Aldığı şeyleri alacak kadar fakirdi, çok çocuğu vardı ve 'Salvat' el-Ahzan' (yaklaşık üç yüz cilt veya daha fazla) kitabına sahipti. Doğruydu. Cuma günü, on dokuzuncu Cuma günü, beş yüz kırk üç Hicri tarihinde öldü ve Şuniziyye'ye defnedildi {atıf:shadharat-dhahab, s. 615-616}."
  id: "Al-Mubarak ibn Kamil al-Tughri al-Baghdadi, ulama hadis Hanbali, Mufid al-Iraq, Abu Bakr; lahir pada hari Kamis, tanggal dua belas Dhu al-Hijjah, empat ratus sembilan puluh lima H, ia membaca Al-Qur'an dengan riwayat dan mendengar banyak hadits. Sidang pertamanya adalah pada tahun 506 H. Ia membahas hal ini dan mendengar dari Abu al-Qasim ibn Bayan, Ibn Nabhat, dan lainnya; Ibn al-Jawzi berkata, dan ia masih mendengarkan yang tinggi dan yang rendah, mengikuti para sheikh dalam narasi, dan menyampaikan narasi tersebut. Jika dikatakan bahwa ia mendengar dari tiga ribu sheikh, sang penceramah tidak akan jauh, dan ia duduk bersama para pengapal dan menulis banyak dengan tulisan tangannya. Ia memiliki pengetahuan tentang para sheikh, sejauh mana apa yang mereka dengar, dan izin, tetapi ia memiliki sedikit bukti atas apa yang disampaikan dari pendengaran, yang merupakan alasan untuk kebaikannya sendiri, karena ia menerima bayaran untuk itu. Ia cukup miskin untuk menerima apa yang diterimanya, memiliki banyak anak, dan memiliki buku 'Salwat al-Ahzan' (sekitar tiga ratus jilid atau lebih). Ia jujur. Ia meninggal pada hari Jumat, tanggal 19 Jumada al-Awwal, lima ratus empat puluh tiga H, dan dimakamkan di Shuniziyyah {cite:shadharat-dhahab, hlm. 615-616}."
