summary:
  ar: "المبارك بن كامل الطغري البغدادي المحدث الحنبلي مفيد العراق أبو بكر؛ ولد يوم الخميس ثاني عشر ذي الحجة سنة خمس وتسعين وأربعمائة وقرأ القرآن بالروايات وسمع الحديث الكثير وأول سماعه سنة ست وخمسمائة وعني بهذا الشأن سمع من أبي القاسم بن بيان وابن نبهات وغيرهما؛ قال ابن الجوزي وما زال يسمع العالي والنازل ويتتبع المشايخ في الروايات وينقل السماعات فلو قيل إنه سمع من ثلاثة آلاف شيخ لم يبعد القائل وجالس الحفاظ وكتب بخطه الكثير وانتهت إليه معرفة المشايخ ومقدار ما سمعوا والإجازات إلا أنه كان قليل التحقيق فيما ينقل من السماع مجازقة لكونه يأخذ عن ذلك ثمناً وكان فقيراً إلى ما يأخذ وكان كثير الأولاد وله كتاب سلوة الأحزان نحو ثلاثمائة جزء وأكثر وكان صدوقاً؛ توفي يوم الجمعة تاسع عشر جمادى الأولى سنة ثلاث وأربعين وخمسمائة ودفن بالشونيزية {cite:shadharat-dhahab p. 615-616}."
  en: "Al-Mubarak ibn Kamil al-Tughri of Baghdad, the Hanbali muhaddith, mufid of Iraq; b. Thursday 12 Dhu al-Hijja 495, he read the Qur'an in its readings and heard hadith widely from 506 on, pursuing the shaykhs of every riwaya — Ibn al-Jawzi: 'were it said he heard from three thousand shaykhs the claim would not strain'; he sat with the huffaz, copied much, and became the final authority on who heard what from whom — though he took pay for passing on samā' certificates and was poor to what he earned; his Salwat al-Ahzan runs near three hundred juz'; a truthful man, he died Friday 19 Jumada I 543 and was buried at the Shuniziyya {cite:shadharat-dhahab p. 615-616}."
