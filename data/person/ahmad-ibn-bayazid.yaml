summary:
  ar: "الأمير أحمد، أخو السلطان [[person/selim-i-ottoman|سليم الأول]]؛ ينقل الصلابي أنه فرّ من وجه سليم إلى المماليك في مقدمة الأمراء العثمانيين الفارين، وأن السلطات المملوكية أرادت اتخاذ وجود هؤلاء الأمراء لديها أداة لإثارة المتاعب في وجه سليم {cite:dawlat-uthmaniyya-salabi p. 184-185}."
  en: "Prince Ahmad, brother of Sultan [[person/selim-i-ottoman|Selim I]]; al-Salabi places him foremost among the Ottoman princes who fled to the Mamluks, whose court meant to use them as instruments of trouble against Selim {cite:dawlat-uthmaniyya-salabi p. 184-185}."
  fr: "Le prince Ahmad, frère du sultan [[person/selim-i-ottoman|Selim Ier]] ; al-Salabi le place au premier rang des princes ottomans réfugiés chez les Mamelouks, dont la cour comptait se servir pour susciter des troubles contre Selim {cite:dawlat-uthmaniyya-salabi p. 184-185}."
  es: "El príncipe Ahmad, hermano del sultán [[person/selim-i-ottoman|Selim I]]; al-Salabi lo sitúa en primer lugar entre los príncipes otomanos que huyeron a los mamelucos, cuya corte pretendía utilizarlos como instrumentos de agitación contra Selim {cite:dawlat-uthmaniyya-salabi p. 184-185}."
  ur: "شہزادہ احمد، سلطان کے بھائی [[شخص/سلیمِ عثمانی|سلیم اول]]؛ الصلبی نے اسے عثمانی شہزادوں میں سرفہرست رکھا ہے جو مملوکوں کی طرف بھاگے تھے، جن کے دربار کا مقصد انہیں سلیم کے خلاف مصیبت کے ہتھیار کے طور پر استعمال کرنا تھا۔ 184-185}۔"
  tr: "Sultan Selim I'in kardeşi Prens Ahmed; El-Salabi'nin bildirdiğine göre, kaçan Osmanlı prenslerinin en önünde Selim'den kaçarak Memlüklere sığınmış ve Memlük yetkilileri bu prenslerin varlığını Selim'e karşı karışıklık çıkarmak için bir araç olarak kullanmak istemişlerdir. {Kaynak: Dawlat-uthmaniyya-salabi s. 184-185}."
  id: "Pangeran Ahmed, saudara Sultan Selim I; Al-Salabi melaporkan bahwa ia melarikan diri dari Selim ke Mamluk di barisan depan para pangeran Ottoman yang melarikan diri, dan bahwa otoritas Mamluk ingin menggunakan kehadiran para pangeran ini sebagai alat untuk menimbulkan masalah terhadap Selim {cite:dawlat-uthmaniyya-salabi hlm. 184-185}."
