summary:
  ar: "أحمد بن عبد الله الجزائري الزواوي، فاضل مالكي من قبيلة زواوة، كانت إقامته بالجزائر، له اللامية في علم الكلام المسماة الجزائرية في العقائد الإيمانية وقد شرحها السنوسي. يذكر الزركلي 800-884 هـ."
  en: "Ahmad ibn Abdallah al-Jaza'iri al-Zawawi, a Maliki scholar of the Zawawa tribe who lived in Algiers; author of a lam-rhymed poem on theology, al-Jaza'iriyya fi al-Aqa'id al-Imaniyya, on which al-Sanusi wrote a commentary. Al-Zirikli prints 800-884 AH (1398-1479)."
