  ar: "أبو خراش حويلد بن مرة الهذلي، شاعر مخضرم من هذيل أسلم ومات في خلافة عمر، لدغته حية وهو يستقي ماءً لحجاج يمنيين، وكان من الشعراء الذين يسبقون الخيل. {cite:encyclopaedia-of-islam-2 vol. 1 p. 155}"
  en: "Abu Khirash Huwaylid b. Murra al-Hudhali, a mukhadram Arab poet of the tribe of Hudhayl who was converted to Islam and died under the caliphate of 'Umar, bitten by a snake while drawing water for Yemenite pilgrims. {cite:encyclopaedia-of-islam-2 vol. 1 p. 155}"
  ur: "ابو خراش حویلد بن مرہ الہذلی، ہذیل کے مخضرم عرب شاعر، جو مسلمان ہوئے اور عمرؓ کی خلافت میں یمنی حاجیوں کے لیے پانی بھرتے ہوئے سانپ کے کاٹنے سے فوت ہوئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 155}"
