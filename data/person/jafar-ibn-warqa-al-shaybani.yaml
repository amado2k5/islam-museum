summary:
  ar: "متولي أعمال الكوفة وطريق مكة؛ سار أمام الحجاج بألف رجل من بني شيبان خوفاً من أبي طاهر القرمطي فلقيه فقاتله فلما طلع جمع من القرامطة عن يمينه انهزم ودخل أبو طاهر الكوفة سنة 312هـ {cite:kamil-ibn-al-athir p. 115-116}."
  en: "Governor of Kufa and the pilgrim road; marching ahead of the hajj caravan with a thousand Shaybanis he fought Abu Tahir and broke, opening Kufa to the Qarmatians in 312 {cite:kamil-ibn-al-athir p. 115-116}."
  es: "Gobernador de Kufa y del camino de peregrinación; marchando delante de la caravana del Hajj con mil Shaybanis, luchó contra Abu Tahir y lo derrotó, abriendo Kufa a los cármatas en el año 312 {cite:kamil-ibn-al-athir p. 115-116}."
  fr: "Gouverneur de Kufa et de la route des pèlerins; marchant en tête de la caravane du hajj avec mille Shaybanis, il combattit Abu Tahir et brisa, ouvrant Kufa aux Qarmates en 312 {cite:kamil-ibn-al-athir p. 115-116}."
