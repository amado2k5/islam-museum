id: person/ibn-bint-al-shafii
class: person
label: { ar: "ابن بنت الشافعي أحمد بن محمد بن عبد الله", en: "Ibn Bint al-Shafi'i Ahmad ibn Muhammad ibn Abd Allah", es: "Ibn Bint al-Shafi'i Ahmad ibn Muhammad ibn Abd Allah", fr: "Ibn Bint al-Shafi'i Ahmad ibn Muhammad ibn Abd Allah", ur: "ابن بنت الشافعی احمد بن محمد بن عبد اللہ" }
summary:
  ar: "ابن بنت الشافعي أحمد بن محمد بن عبد الله بن محمد بن العباس بن عثمان بن شافع، فقيه شافعي جليل من أهل بغداد؛ تفقه بأبيه وبإسحاق وأبي ثور، وصنف كتابين في فضائل الشافعي والثناء عليه، وانتهت إليه رئاسة العلم ببغداد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11489}."
  en: "Ibn Bint al-Shafi'i, Ahmad ibn Muhammad ibn Abd Allah ibn Shafi', a Shafi'i jurist of Baghdad; he studied with his father, with Ishaq and with Abu Thawr, wrote two works on al-Shafi'i's merits, and the leadership of learning in Baghdad came to him {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11489}."
  es: "Ibn Bint al-Shafi'i, Ahmad ibn Muhammad ibn Abd Allah ibn Shafi', un jurista shafi'í de Bagdad; estudió con su padre, con Ishaq y con Abu Thawr, escribió dos obras sobre los méritos de al-Shafi'i, y el liderazgo del saber en Bagdad recayó sobre él {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11489}."
  fr: "Ibn Bint al-Shafi'i, Ahmad ibn Muhammad ibn Abd Allah ibn Shafi', un juriste shafi'i de Bagdad; il a étudié avec son père, avec Ishaq et avec Abu Thawr, a écrit deux ouvrages sur les mérites d'al-Shafi'i, et la direction de l'apprentissage à Bagdad lui est venue {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11489}."
  ur: "ابن بنت الشافعی، احمد بن محمد بن عبد اللہ بن شفیع، بغداد کے شافعی فقیہ؛ اس نے اپنے والد اسحاق اور ابو ثور کے ساتھ تعلیم حاصل کی، الشافعی کی فضیلت پر دو کتابیں لکھیں، اور بغداد میں علم کی قیادت ان کے پاس آئی۔"
  tr: "İbn bint al-Şafi'i Ahmed ibn Muhammad ibn Abdullah ibn Muhammed ibn el-Abbas ibn Osman ibn Şafii, Bağdat'tan seçkin bir Şafii hukukçusudur; babası İshaq ve Ebu Savr'dan fıkıh eğitimi aldı, el-Şafi'i erdemleri üzerine iki kitap yazdı ve onu övdü ve sonunda Bağdat'ta bilgi başkanı oldu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11489}."
  id: "Ibn bint al-Shafi'i Ahmad ibn Muhammad ibn Abdullah ibn Muhammad ibn al-Abbas ibn Uthman ibn Shafi'i, seorang ahli hukum Shafi'i terkemuka dari Baghdad; ia mempelajari hukum di bawah bimbingan ayahnya, Ishaq, dan Abu Thawr, menulis dua buku tentang kebajikan al-Shafi'i dan memujinya, dan akhirnya menjadi kepala ilmu pengetahuan di Baghdad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11489}."
