summary:
  ar: 'حاجب السلطان عبد الملك المعتصم بالله؛ لم يعلم بموت سيده يوم وادي المخازن إلا هو وأحمد المنصور، فصار يقول للجند: «السلطان يأمر فلاناً أن يذهب إلى موضع كذا، وفلاناً يلزم الراية، وفلاناً يتقدم وفلاناً يتأخر» — كاتمين الأمر حتى تم النصر {cite:dawlat-uthmaniyya-salabi p. 265}.'
  en: Sultan Abd al-Malik's chamberlain; he and Ahmad al-Mansur alone knew of his master's death on the day of Wadi al-Makhazin, and he kept telling the troops, 'the sultan orders so-and-so to that spot, so-and-so to hold the banner, so-and-so forward, so-and-so back' — concealing it until victory was complete {cite:dawlat-uthmaniyya-salabi p. 265}.
  es: "El chambelán del sultán Abd al-Malik; solo él y Ahmad al-Mansur sabían de la muerte de su señor el día de Wadi al-Makhazin, y no dejaba de decirles a las tropas: \"El sultán ordena a fulano que vaya a ese lugar, a mengano que sostenga el estandarte, a mengano que avance, a mengano que retroceda\", ocultándolo hasta que la victoria fue completa {cite:dawlat-uthmaniyya-salabi p. 265}."
  fr: "Le chambellan du sultan Abd al-Malik; lui et Ahmad al-Mansur étaient les seuls à connaître la mort de son maître le jour de Wadi al-Makhazin, et il n'arrêtait pas de dire aux troupes: « le sultan ordonne à untel d'aller à cet endroit, à untel de tenir la bannière, à untel d'avancer, à untel de reculer », dissimulant la nouvelle jusqu'à ce que la victoire soit complète {cite:dawlat-uthmaniyya-salabi p. 265}."
  ur: "سلطان عبد الملک کا چیمبرلین؛ اسے اور احمد المنصور کو وادی المخازین کے دن اپنے آقا کی موت کا علم تھا، اور وہ فوجوں سے کہتا رہا کہ سلطان فلاں کو اس جگہ، فلاں فلاں کو جھنڈا تھامنے کا حکم دیتا ہے، فلاں فلاں آگے، فلاں فلاں پیچھے، اسے چھپاتا رہا یہاں تک کہ فتح مکمل ہو جائے۔ 265}۔"
