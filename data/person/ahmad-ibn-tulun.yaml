summary:
  ar: "أمير، أرسل إليه المعتز أن يذهب إلى المستعين فيقتله فقال والله لا أقتل أولاد الخلفاء {cite:tarikh-khulafa-minhaj-1434 p. 556}. وعند المسعودي وكل بالمستعين حين أحدر إلى واسط قبل ولايته مصر {cite:muruj-al-dhahab p. 545}، وعند المسعودي مات بمصر يوم السبت لعشر خلون من ذي القعدة سنة سبعين ومائتين وله خمس وستون سنة وكانت ولايته سبع عشرة سنة، ولما يئس من نفسه بايع لابنه أبي الجيش خمارويه بالأمر من بعده {cite:muruj-al-dhahab p. 579}، وعند ابن الجوزي لما أحدر المستعين إلى واسط سئل من يختار أن يكون في صحبته فقال أحمد بن طولون فبعثوه معه فأحسن صحبته، وكتب إليه غلمان المتوكل أن اقتله فإن قتلته ولّيناك واسطاً فكتب إليهم والله لا أرى لله قتلت خليفة بايعته أبداً، فلما قُتل المستعين غسل جثته وكفّنها وواراها، وقال حين دخل مصر غاية ما وُعدت في قتل المستعين ولاية واسط فتركت ذلك لله فعوّضني ولاية مصر والشام؛ وركب يوماً إلى الصيد فغاصت يد دابة في وسط الرمل فكشف فوجد مطلباً فيه من المال ما قيمته ألف ألف دينار فأنفق معظمه في البر والصدقة وبناء الجامع، وقال له وكيله يوماً ربما امتدت إليك الكف المطوّقة والمعصم فيه السوار والكف الناعم فأنا منع هذه الطبقة فقال ويحك هؤلاء المستورون الذين يحسبهم الجاهل أغنياء من التعفف احذر أن ترد يداً امتدت إليك، وأحسن بعض التجار التجارة فدفع إليه خمسين ألف دينار فقال المعبّر قد سمّت همة التاجر إلى مكسب لا يشبه خطره فأمر أن ترد إليه فلمّا اشتد مرضه خرج المسلمون بالمصاحف واليهود بالتوراة والنصارى بالإنجيل والمعلمون بالصبيان وكثر الدعاء في الصحراء والمساجد فلما أحس بذلك رفع يده وقال يا رب ارحم من جهل مقدار نفسه فأبطرته نعمك عليه، وخلف عشرة آلاف ألف دينار وسبعة آلاف مملوك وعلى مربطه سبعة آلاف فرس وستة آلاف جمل وبغل وثلاثمائة مركب خاصة ومائة مركب حربية وأربعة وعشرين ألف غلام، وكان خراج مصر في أيامه أربعة آلاف ألف درهم وثلاثمائة ألف دينار، وأنفق على الجامع مائة وعشرين ألف دينار ويتصدق بثلاثة آلاف دينار شاذة سوى الراتب، وكان راتب مطبخه كل يوم ألف دينار ويجرّي على أهل المساجد كل شهر ألف دينار وعلى مقرأة الثغر كذلك {cite:muntazam-ibn-al-jawzi j.5 p. 76-77}"
  en: "The commander; al-Mu'tazz sent him to kill al-Musta'in and he answered 'by God, I do not kill the sons of caliphs' {cite:tarikh-khulafa-minhaj-1434 p. 556}."
