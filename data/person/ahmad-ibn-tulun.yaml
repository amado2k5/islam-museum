id: person/ahmad-ibn-tulun
education:
  did_you_know:
    ar: "أحمد بن طولون الذي دانت له مصر وفرّع فيها الدولة الطولونية؛ عند السيوطي أرسل إليه المعتز أن يقتل المستعين فقال والله لا أقتل أولاد الخلفاء."
    en: "Ahmad ibn Tulun, to whom Egypt fell and who ramified the Tulunid state there — when al-Mu'tazz sent him word to kill al-Musta'in he answered, per al-Suyuti, 'By God, I will not kill the sons of caliphs'."
    ur: "احمد بن طولون، جس کے ہاتھ مصر آیا اور طولونی سلطنت پھیلائی — جب معتز نے مستعین کو مارنے کا حکم بھیجا تو سیوطی کے مطابق بولا «خلفا کے بیٹوں کو نہیں ماروں گا»۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/muruj-al-dhahab]
class: person
label: { ar: "أحمد بن طولون", en: "Ahmad ibn Tulun", ur: "احمد بن طولون", es: "Ahmad ibn Tulun", fr: "Ahmad ibn Tulun" }
summary:
  ar: "أمير، أرسل إليه المعتز أن يذهب إلى المستعين فيقتله فقال والله لا أقتل أولاد الخلفاء {cite:tarikh-khulafa-minhaj-1434 p. 556}. وعند المسعودي وكل بالمستعين حين أحدر إلى واسط قبل ولايته مصر {cite:muruj-al-dhahab p. 545}، وعند المسعودي مات بمصر يوم السبت لعشر خلون من ذي القعدة سنة سبعين ومائتين وله خمس وستون سنة وكانت ولايته سبع عشرة سنة، ولما يئس من نفسه بايع لابنه أبي الجيش خمارويه بالأمر من بعده {cite:muruj-al-dhahab p. 579}، وعند ابن الجوزي لما أحدر المستعين إلى واسط سئل من يختار أن يكون في صحبته فقال أحمد بن طولون فبعثوه معه فأحسن صحبته، وكتب إليه غلمان المتوكل أن اقتله فإن قتلته ولّيناك واسطاً فكتب إليهم والله لا أرى لله قتلت خليفة بايعته أبداً، فلما قُتل المستعين غسل جثته وكفّنها وواراها، وقال حين دخل مصر غاية ما وُعدت في قتل المستعين ولاية واسط فتركت ذلك لله فعوّضني ولاية مصر والشام؛ وركب يوماً إلى الصيد فغاصت يد دابة في وسط الرمل فكشف فوجد مطلباً فيه من المال ما قيمته ألف ألف دينار فأنفق معظمه في البر والصدقة وبناء الجامع، وقال له وكيله يوماً ربما امتدت إليك الكف المطوّقة والمعصم فيه السوار والكف الناعم فأنا منع هذه الطبقة فقال ويحك هؤلاء المستورون الذين يحسبهم الجاهل أغنياء من التعفف احذر أن ترد يداً امتدت إليك، وأحسن بعض التجار التجارة فدفع إليه خمسين ألف دينار فقال المعبّر قد سمّت همة التاجر إلى مكسب لا يشبه خطره فأمر أن ترد إليه فلمّا اشتد مرضه خرج المسلمون بالمصاحف واليهود بالتوراة والنصارى بالإنجيل والمعلمون بالصبيان وكثر الدعاء في الصحراء والمساجد فلما أحس بذلك رفع يده وقال يا رب ارحم من جهل مقدار نفسه فأبطرته نعمك عليه، وخلف عشرة آلاف ألف دينار وسبعة آلاف مملوك وعلى مربطه سبعة آلاف فرس وستة آلاف جمل وبغل وثلاثمائة مركب خاصة ومائة مركب حربية وأربعة وعشرين ألف غلام، وكان خراج مصر في أيامه أربعة آلاف ألف درهم وثلاثمائة ألف دينار، وأنفق على الجامع مائة وعشرين ألف دينار ويتصدق بثلاثة آلاف دينار شاذة سوى الراتب، وكان راتب مطبخه كل يوم ألف دينار ويجرّي على أهل المساجد كل شهر ألف دينار وعلى مقرأة الثغر كذلك {cite:muntazam-ibn-al-jawzi j.5 p. 76-77}. وتحفظ قاعدة البرديات العربية براءة من أحمد بن طولون أمير مصر محفوظة على verso مخطوط سرياني، تسجل رفع دعوى من أحد مواليه، مؤرخة بين ٨٧٠–٨٨٢م بالإسكندرية {cite:apd P.Lond.inv. Syriac Mss. BM Add 12137}"
  en: "The commander; al-Mu'tazz sent him to kill al-Musta'in and he answered 'by God, I do not kill the sons of caliphs' {cite:tarikh-khulafa-minhaj-1434 p. 556}. The Arabic Papyrology Database preserves a patent of Ahmad ibn Tulun, governor of Egypt, kept as a flyleaf of a Syriac manuscript, recording the removal of one of his clients, dated 870–882 CE in Alexandria {cite:apd P.Lond.inv. Syriac Mss. BM Add 12137}."
  ur: "امیر؛ معتز نے اسے مستعین کو قتل کرنے کا کہا تو اس نے جواب دیا «اللہ کی قسم، میں خلفا کے بیٹوں کو نہیں مارتا» {cite:tarikh-khulafa-minhaj-1434 p. 556}۔ مسعودی کے مطابق وہ مصر میں ہفتے کے دن ذی قعدہ کی دس تاريخ کو 270ھ میں فوت ہوا، عمر پینسٹھ برس اور ولایت سترہ برس {cite:muruj-al-dhahab p. 579}۔"
  es: "El comandante al-Mu'tazz lo envió a matar a al-Musta'in y él respondió: «¡Por Dios, no mato a los hijos de los califas!» {cite:tarikh-khulafa-minhaj-1434 p. 556}. La base de datos de papirología árabe conserva una patente de Ahmad ibn Tulun, gobernador de Egipto, guardada como una hoja de guarda de un manuscrito siríaco, que registra la destitución de uno de sus clientes, fechada entre 870 y 882 d. C. en Alejandría {cite:apd P.Lond.inv. Syriac Mss. BM Add 12137}."
  fr: "Le commandant al-Mu'tazz l'envoya tuer al-Musta'in, qui répondit: « Par Dieu, je ne tue pas les fils des califes » {cite: tarikh-khulafa-minhaj-1434 p. 556}. La base de données de papyrologie arabe conserve une patente d'Ahmad ibn Tulun, gouverneur d'Égypte, figurant sur une page de garde d'un manuscrit syriaque, relatant la destitution d'un de ses clients, datée de 870-882 apr. J.-C. à Alexandrie {cite: apd P.Lond.inv. Syriac Mss. BM Add 12137}."
  tr: "El-Mu'tazz'ın kendisine el-Musta'in'e gidip onu öldürmesi emrini gönderdiği Emir, \"Allah'a yemin ederim ki halifelerin oğullarını öldürmeyeceğim\" dedi. {kaynak:tarikh-khulafa-minhaj-1434 s. 556}. El-Mas'udi'ye göre, Mısır valiliğinden önce Wasit'e gönderildiğinde el-Musta'in'in sorumluluğu ona verilmişti. {kaynak:muruj-al-dhahab s. 545}. El-Mas'udi'ye göre, 270 Hicri yılının Zilhicce ayının onuncu günü Cumartesi günü Mısır'da altmış beş yaşında vefat etti ve saltanatı on yedi yıl sürdü. Kendi hayatından ümitsizliğe düştüğünde, oğlu Ebu el-Ceyş Humarawayh'ı halefi olarak biat etti. {kaynak:muruj-al-dhahab s. 579} İbn el-Cevzi'ye göre, Mustafan Vasit'e gönderildiğinde, yanında kimin olmasını istediği sorulmuş ve o da Ahmed ibn Tulun demiş. Bunun üzerine onu yanına göndermişler ve Ahmed ibn Tulun ona iyi bir arkadaş olmuş. Mutevakkil'in hizmetkarları ona, \"Onu öldür, eğer öldürürsen seni Vasit valisi olarak atayacağız\" diye yazmışlar. O da onlara, \"Allah'a yemin ederim ki, biat ettiğim bir halifeyi öldürdüğümü görmüyorum\" diye cevap vermiş. Mustafan öldürüldüğünde, cesedini yıkamış, kefenlemiş ve gömmüş. Mısır'a girdiğinde, \"Mustain'i öldürmem karşılığında bana vaat edilen en büyük şey Vasit valiliğiydi, bu yüzden Allah için bunu bıraktım, Allah da bana Mısır ve Suriye valiliğini verdi\" demiş. Bir gün ava çıkmışken bir hayvanın toynaklarından biri kuma saplanmış. Mezarı açtı ve bir milyon dinar içeren bir hazine buldu. Bunun çoğunu hayır işlerine, sadaka vermeye ve bir cami inşa etmeye harcadı. Bir gün vekili ona, \"Belki de bilezikli ve yumuşak bilekli bir el sana uzanır. Ben bu tür kişilerin istemesini engelleyen kişiyim.\" dedi. O da, \"Yazık sana! Bunlar, cahillerin tevazuları yüzünden zengin sandıkları, sağduyulu kişilerdir. Sana uzatılan eli geri çevirmekten sakın.\" diye cevap verdi. İyi bir anlaşma yapmış bir tüccar ona elli bin dinar verdi. Tercüman, \"Tüccarın hırsı, değerine denk olmayan bir kâr seviyesine ulaştı.\" dedi. Bunun üzerine paranın kendisine iade edilmesini emretti. Hastalığı kötüleştiğinde, Müslümanlar Kur'an'larla, Yahudiler Tevrat'la, Hristiyanlar İncil'le ve öğretmenler çocuklarla yola çıktılar. Çölde ve camilerde bolca dua edildi. Bunu sezince ellerini kaldırdı ve şöyle dedi: \"Ey Rabbim, kendi değerinden habersiz olana ve nimetleri onu kibirli kılana merhamet et.\" Geride on milyon dinar, yedi bin köle, yedi bin at, altı bin deve ve katır, üç yüz özel gemi, yüz savaş gemisi ve yirmi dört bin hizmetçi bıraktı. Mısır'ın geliri... Günleri dört milyon dirhem ve üç yüz bin dinar değerindeydi. Camiye yüz yirmi bin dinar harcadı ve maaşına ek olarak üç bin dinar sadaka verdi. Mutfağının günlük ücreti bin dinardı ve cami cemaatine ve sınır bölgesindeki Kur'an okuluna da aylık bin dinar ödedi. {cite:muntazam-ibn-al-jawzi j.5 p. 76-77} Arap papirüs arşivinde, Mısır Emiri Ahmed ibn Tulun'un, müvekkillerinden birinin İskenderiye'de 870-882 yılları arasında açtığı bir davayı kaydeden bir Süryanice el yazmasının arka yüzünde yer alan bir masumiyet belgesi muhafaza edilmektedir. {cite:apd P.Lond.inv. Syriac Mss. BM Add 12137}"
  id: "Amir, yang kepadanya al-Mu'tazz mengirim perintah untuk pergi ke al-Musta'in dan membunuhnya, berkata, \"Demi Allah, aku tidak akan membunuh putra-putra para khalifah\" {cite:tarikh-khulafa-minhaj-1434 p. 556}. Menurut al-Mas'udi, ia dipercayakan dengan al-Musta'in ketika ia diutus ke Wasit sebelum masa jabatannya sebagai gubernur Mesir {cite:muruj-al-dhahab p. 545}. Menurut al-Mas'udi, ia meninggal di Mesir pada hari Sabtu, tanggal sepuluh Dzul Qi'dah tahun 270 H, pada usia enam puluh lima tahun, dan masa pemerintahannya berlangsung selama tujuh belas tahun. Ketika ia putus asa akan nyawanya sendiri, ia berjanji setia kepada putranya, Abu al-Jaysh Khumarawayh, sebagai penggantinya {cite:muruj-al-dhahab p. 579} Dan menurut Ibnu al-Jawzi, ketika al-Musta’in diutus ke Wasit, ia ditanya siapa yang akan dipilihnya untuk menemaninya, dan ia berkata Ahmad bin Tulun, maka mereka mengutusnya bersamanya dan ia menjadi teman yang baik baginya. Para pelayan al-Mutawakkil menulis kepadanya, “Bunuh dia, dan jika engkau membunuhnya, kami akan mengangkatmu sebagai gubernur Wasit.” Maka ia menulis kepada mereka, “Demi Allah, aku tidak melihat bahwa aku telah membunuh seorang khalifah yang kepadanya aku telah berjanji setia.” Ketika al-Musta’in terbunuh, ia memandikan jenazahnya, mengkafaninya, dan menguburkannya. Ketika ia memasuki Mesir, ia berkata, “Yang paling dijanjikan kepadaku dalam membunuh al-Musta’in adalah jabatan gubernur Wasit, maka aku meninggalkannya demi Allah, maka Dia menggantiku dengan jabatan gubernur Mesir dan Suriah.” Suatu hari, ia sedang berburu ketika kuku binatang tenggelam ke dalam pasir. Ia menyingkapnya dan menemukan harta karun berisi satu juta dinar. Sebagian besar hartanya dihabiskan untuk amal, sedekah, dan pembangunan masjid. Suatu hari, agennya berkata kepadanya, \"Mungkin ada tangan yang dihiasi gelang dan pergelangan tangan yang lembut akan mengulurkan tangan kepadamu. Akulah yang mencegah orang seperti ini untuk meminta.\" Ia menjawab, \"Celakalah kamu! Mereka adalah orang-orang yang bijaksana yang disangka orang bodoh sebagai orang kaya karena kesopanan mereka. Hati-hati jangan menolak tangan yang terulurkan kepadamu.\" Seorang pedagang yang telah melakukan transaksi yang menguntungkan memberinya lima puluh ribu dinar. Penerjemah berkata, \"Ambisi pedagang itu telah mencapai tingkat keuntungan yang tidak sebanding dengan nilainya.\" Maka ia memerintahkan uang itu dikembalikan kepadanya. Ketika penyakitnya memburuk, umat Muslim keluar dengan Al-Qur'an, umat Yahudi dengan Taurat, umat Kristen dengan Injil, dan para guru dengan anak-anak. Doa dipanjatkan secara berlimpah di padang pasir dan masjid-masjid. Ketika ia merasakan hal ini, ia mengangkat tangannya dan berkata, \"Ya Tuhan, kasihanilah orang yang tidak menyadari nilainya sendiri, dan yang berkat-berkatnya telah membuatnya sombong.\" Ia meninggalkan sepuluh juta dinar, tujuh ribu budak, tujuh ribu kuda, enam ribu unta dan keledai, tiga ratus kapal pribadi, seratus kapal perang, dan dua puluh empat ribu pelayan. Pendapatan Mesir adalah... Pendapatannya selama bertahun-tahun berjumlah empat juta dirham dan tiga ratus ribu dinar. Ia menghabiskan seratus dua puluh ribu dinar untuk masjid dan memberikan tiga ribu dinar sebagai sedekah, di samping gajinya. Gaji harian untuk dapurnya adalah seribu dinar, dan ia membayar seribu dinar setiap bulan kepada orang-orang di masjid dan sekolah Al-Quran di wilayah perbatasan juga. {cite:muntazam-ibn-al-jawzi j.5 p. 76-77}. Arsip papirus Arab menyimpan sertifikat tidak bersalah dari Ahmad ibn Tulun, Emir Mesir, yang tersimpan di balik manuskrip Suriah, yang mencatat gugatan yang diajukan oleh salah satu kliennya, bertanggal antara 870–882 M di Alexandria. {cite:apd P.Lond.inv. Manuskrip Siria BM Add 12137}"
