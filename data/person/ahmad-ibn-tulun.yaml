id: person/ahmad-ibn-tulun
education:
  did_you_know:
    ar: "أحمد بن طولون الذي دانت له مصر وفرّع فيها الدولة الطولونية؛ عند السيوطي أرسل إليه المعتز أن يقتل المستعين فقال والله لا أقتل أولاد الخلفاء."
    en: "Ahmad ibn Tulun, to whom Egypt fell and who ramified the Tulunid state there — when al-Mu'tazz sent him word to kill al-Musta'in he answered, per al-Suyuti, 'By God, I will not kill the sons of caliphs'."
    ur: "احمد بن طولون، جس کے ہاتھ مصر آیا اور طولونی سلطنت پھیلائی — جب معتز نے مستعین کو مارنے کا حکم بھیجا تو سیوطی کے مطابق بولا «خلفا کے بیٹوں کو نہیں ماروں گا»۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/muruj-al-dhahab]
