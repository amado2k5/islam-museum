summary:
  ar: "إبراهيم بن سعد الملوي، المعروف بالآيات، الموصوف بالكرامات. روى عنه أبو الحارث الأولاسي أخبارًا عن الصلاة على الماء وعن ترك التعلق بالخلق، ووصله بعد موته برسالة فيها الصبر على القدر والرضا والتوكل والنهي عن الاعتماد على المخلوقين."
  en: "Ibrahim ibn Sa'd al-Mulawi, known for signs and marked by marvels; Abu al-Harith al-Awlasi relates from him an account of prayer by the sea, a warning against binding the heart to creatures, and a letter sent after his death on patience with the decree, contentment, trust in God and the refusal to rely on people."
  ur: "ابراہیم بن سعد ملوی، نشانیوں کے لیے مشہور اور کرامات سے موصوف۔ ابو الحارث اولاسی نے ان سے سمندر کے کنارے نماز اور مخلوق سے دل نہ لگانے کی نصیحت نقل کی، اور ان کے انتقال کے بعد ایک خط جس میں تقدیر پر صبر، رضا، اللہ پر توکل اور لوگوں پر اعتماد نہ کرنے کی تلقین تھی۔"
