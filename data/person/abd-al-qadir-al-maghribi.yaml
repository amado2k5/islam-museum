summary:
  ar: "عبد القادر بن مصطفى المغربي الطرابلسي، نائب رئيس المجمع العلمي العربي بدمشق، من العلماء باللغة والأدب، ولد باللاذقية سنة 1284 هـ الموافقة 1868 م وتوفي بدمشق سنة 1375 هـ الموافقة 1956 م."
  en: "Abd al-Qadir ibn Mustafa al-Maghribi al-Tarabulsi, deputy president of the Arab Academy of Damascus and a scholar of language and literature; born in Latakia in 1284 AH (1868 CE), died in Damascus in 1375 AH (1956 CE)."
  fr: "Abd al-Qadir ibn Mustafa al-Maghribi al-Tarabulsi, vice-président de l'Académie arabe de Damas et savant de la langue et de la littérature ; né à Lattaquié en 1284 H (1868 ap. J.-C.), mort à Damas en 1375 H (1956 ap. J.-C.)."
  es: "Abd al-Qadir ibn Mustafa al-Maghribi al-Tarabulsi, vicepresidente de la Academia Árabe de Damasco y erudito en lengua y literatura; nació en Latakia en 1284 AH (1868 d. C.) y murió en Damasco en 1375 AH (1956 d. C.)."
  ur: "عبد القادر بن مصطفی المغربی الترابلسی، عرب اکیڈمی دمشق کے نائب صدر؛ آپ 1284ھ ⁦(1868ء)⁩ میں لطاکیہ میں پیدا ہوئے، دمشق میں 1375ھ ⁦(1956ء)⁩ میں وفات پائی۔"
  tr: "Şam'daki Arap Bilimler Akademisi Başkan Yardımcısı Abdülkadir bin Mustafa el-Mağribi el-Tarabulsi, dil ve edebiyat alanında bir âlimdi. Hicri 1284 yılında (miladi 1868) Latakia'da doğmuş ve Hicri 1375 yılında (miladi 1956) Şam'da vefat etmiştir."
  id: "Abdul Qadir bin Mustafa Al-Maghribi Al-Tarabulsi, Wakil Presiden Akademi Ilmu Pengetahuan Arab di Damaskus, adalah seorang ahli bahasa dan sastra. Beliau lahir di Latakia pada tahun 1284 H, yang bertepatan dengan tahun 1868 M, dan meninggal di Damaskus pada tahun 1375 H, yang bertepatan dengan tahun 1956 M."
