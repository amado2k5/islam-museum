summary:
  ar: "محمد بن عبد الله بن أحمد البسطامي الرزجاهي، فقيه أديب محدث، تفقه على الأستاذ أبي سهل الصعلوكي، وسمع أبا بكر أحمد بن إبراهيم الإسماعيلي وأبا أحمد بن عدي الجرجاني وأبا أحمد الحاكم الحافظ وأبا علي بن المغيرة، وروى عنه الحافظ أبو بكر البيهقي وأبو عبد الله الثقفي. ولد سنة 341 وكان يجلس لسماع الحديث والأدب وله حلقة، وانتقل في آخر عمره إلى بسطام ومات بها في ربيع الأول سنة 422 {cite:tabaqat-shafiiyya-subki j.3 p.63-64}."
  en: "Muhammad ibn Abdallah al-Bastami al-Ruzjahi (b. 341, d. Rabi' I 422) — a faqih, littérateur and hadith man; studied fiqh under the master Abu Sahl al-Su'luki, heard Ibn 'Adi of Jurjan and Abu Ahmad al-Hakim, and transmitted to al-Bayhaqi and Abu 'Abdallah al-Thaqafi. He held a circle for hadith and letters, and moved to Bastam late in life, dying there {cite:tabaqat-shafiiyya-subki j.3 p.63-64}."
  ur: "محمد بن عبد اللہ بسطامی رزجاہی ⁦(پ 341ھ، مت 422ھ)⁩ — فقیہ، ادیب اور محدث؛ استاذ ابو سہل صعلوکی سے فقہ سیکھی؛ ابن عدی جرجانی اور ابو احمد حاکم سے سنا؛ بیہقی اور ابو عبد اللہ ثقفی ان سے روایت کرتے ہیں۔ حدیث و ادب کی مجلس رکھتے تھے، آخرِ عمر بسطام منتقل ہو کر وہیں وفات پائی {cite:tabaqat-shafiiyya-subki j.3 p.63-64}."
  es: "Muhammad ibn Abdallah al-Bastami al-Ruzjahi (n. 341, m. Rabi' I 422): faqih, literato y hadiz; Estudió fiqh con el maestro Abu Sahl al-Su'luki, escuchó a Ibn 'Adi de Jurjan y Abu Ahmad al-Hakim, y lo transmitió a al-Bayhaqi y Abu 'Abdallah al-Thaqafi. Mantuvo un círculo de hadices y letras, y se mudó a Bastam en una etapa avanzada de su vida, donde murió {cita:tabaqat-shafiiyya-subki j.3 p.63-64}."
  fr: "Muhammad ibn Abdallah al-Bastami al-Ruzjahi (né en 341, décédé à Rabi' I en 422) — un faqih, un littérateur et un homme de hadiths; a étudié le fiqh auprès du maître Abu Sahl al-Su'luki, a entendu Ibn 'Adi de Jurjan et Abu Ahmad al-Hakim, et l'a transmis à al-Bayhaqi et Abu 'Abdallah al-Thaqafi. Il a tenu un cercle de hadiths et de lettres et a déménagé à Bastam tard dans sa vie, y mourant {cite: tabaqat-shafiiyya-subki j.3 p.63-64}."
  tr: "Muhammed ibn Abdullah ibn Ahmed al-Bastami al-Razjahi, bir hukukçu, edebi figür ve hadis âlimiydi. Fıkıh eğitimini öğretmen Ebu Sahl el-Sa'luki'nin yanında aldı. Ebu Bekir Ahmed bin İbrahim el-İsmaili, Ebu Ahmed bin Adi el-Jurcani, hadis âlimi Ebu Ahmed el-Hakim ve Ebu Ali ibn el-Muğira'dan dinledi. Hafız Ebu Bekir el-Bayhaqi ve Ebu Abdullah el-Tekafi ondan rivayet etmiştir. 341 Hicri yılında doğmuş, hadis ve edebiyat dinler, bir çevresi vardı. İlerleyen yıllarında Bastam'a taşındı ve orada Rabi'al-Awwal 422'de vefat etti {atıf: tabaqat-shafiiyya-subki j.3 s.63-64}."
  id: "Muhammad ibn Abdullah ibn Ahmad al-Bastami al-Razjahi adalah seorang ahli hukum, tokoh sastra, dan ulama hadis. Ia mempelajari fiksi di bawah bimbingan guru Abu Sahl al-Sa'luki. Ia mendengar dari Abu Bakr Ahmad ibn Ibrahim al-Isma'ili, Abu Ahmad ibn Adi al-Jurjani, Abu Ahmad al-Hakim, ulama hadits, dan Abu Ali ibn al-Mughira. Hafiz Abu Bakr al-Bayhaqi dan Abu Abdullah al-Thaqafi menceritakan darinya. Ia lahir pada tahun 341 H dan biasa mendengarkan hadits dan sastra serta memiliki lingkaran keluarga. Pada tahun-tahun terakhirnya, ia pindah ke Bastam dan meninggal di sana pada Rabi' al-Awwal 422 {cite:tabaqat-shafiiyya-subki j.3 hlm.63-64}."
