  ur: "محمد بن عبد اللہ بسطامی"
roles: [scholar]
gender: male
summary:
  ar: "محمد بن عبد الله بن أحمد البسطامي الرزجاهي، فقيه أديب محدث، تفقه على الأستاذ أبي سهل الصعلوكي، وسمع أبا بكر أحمد بن إبراهيم الإسماعيلي وأبا أحمد بن عدي الجرجاني وأبا أحمد الحاكم الحافظ وأبا علي بن المغيرة، وروى عنه الحافظ أبو بكر البيهقي وأبو عبد الله الثقفي. ولد سنة 341 وكان يجلس لسماع الحديث والأدب وله حلقة، وانتقل في آخر عمره إلى بسطام ومات بها في ربيع الأول سنة 422 {cite:tabaqat-shafiiyya-subki j.3 p.63-64}."
  en: "Muhammad ibn Abdallah al-Bastami al-Ruzjahi (b. 341, d. Rabi' I 422) — a faqih, littérateur and hadith man; studied fiqh under the master Abu Sahl al-Su'luki, heard Ibn 'Adi of Jurjan and Abu Ahmad al-Hakim, and transmitted to al-Bayhaqi and Abu 'Abdallah al-Thaqafi. He held a circle for hadith and letters, and moved to Bastam late in life, dying there {cite:tabaqat-shafiiyya-subki j.3 p.63-64}."
  ur: "محمد بن عبد اللہ بسطامی رزجاہی (پ 341ھ، مت 422ھ) — فقیہ، ادیب اور محدث؛ استاذ ابو سہل صعلوکی سے فقہ سیکھی؛ ابن عدی جرجانی اور ابو احمد حاکم سے سنا؛ بیہقی اور ابو عبد اللہ ثقفی ان سے روایت کرتے ہیں۔ حدیث و ادب کی مجلس رکھتے تھے، آخرِ عمر بسطام منتقل ہو کر وہیں وفات پائی {cite:tabaqat-shafiiyya-subki j.3 p.63-64}."
