summary:
  ar: "مهندس إنشائي بنغلاديشي أمريكي، وُلد في دكا سنة 1929 وتوفي سنة 1982، ابتكر الأنظمة الإنشائية الأنبوبية التي قامت عليها ناطحات السحاب الحديثة، ومن أعماله برج سيرز في شيكاغو (برج ويليس اليوم) ومركز جون هانكوك ومحطة الحج في مطار جدة، ولُقّب «أبا التصاميم الأنبوبية» و«آينشتاين الهندسة الإنشائية»."
  en: "Bangladeshi-American structural engineer, born in Dhaka in 1929 and died in 1982, who invented the tubular structural systems on which the modern skyscraper rests. His works include the Sears Tower in Chicago (now the Willis Tower), the John Hancock Center and the Hajj terminal at Jeddah airport; he was called the 'father of tubular designs' and the 'Einstein of structural engineering'."
  ur: "بنگلہ دیشی نژاد امریکی ساختی انجینئر، جو 1929 میں ڈھاکہ میں پیدا ہوئے اور 1982 میں وفات پائی، جنہوں نے ٹیوبی ساختی نظام ایجاد کیے جن پر جدید فلک بوس عمارتیں قائم ہیں۔ ان کے کاموں میں شکاگو کا سیئرز ٹاور (آج کا ولس ٹاور)، جان ہینکاک سینٹر اور جدہ ہوائی اڈے کا حج ٹرمینل شامل ہیں؛ انہیں «ٹیوبی ڈیزائن کا بانی» اور «ساختی انجینئرنگ کا آئن اسٹائن» کہا گیا۔"
