  ar: "أحد الدعاة بخراسان؛ عند البلاذري أقطع الخورنق في الدولة المباركة وهو جد عبد الرحمن بن إسحاق القاضي بمدينة السلام في خلافة المأمون والمعتصم وكان مولى للرباب وأحدث قبة الخورنق في خلافة أبي العباس ولم تكن قبل ذلك."
  en: "One of the Khurasan da'is; in al-Baladhuri al-Khawarnaq was granted him under the blessed dawla — grandfather of Abd al-Rahman ibn Ishaq the qadi of Madinat al-Salam under al-Ma'mun and al-Mu'tasim — and he raised al-Khawarnaq's dome in Abu al-Abbas's reign."
