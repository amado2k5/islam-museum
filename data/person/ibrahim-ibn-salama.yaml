class: person
label: { ar: "إبراهيم بن سلمة", en: "Ibrahim ibn Salama", es: "Ibrahim ibn Salama", fr: "Ibrahim ibn Salama", ur: "ابراہیم بن سلمہ" }
summary:
  ar: "أحد الدعاة بخراسان؛ عند البلاذري أقطع الخورنق في الدولة المباركة وهو جد عبد الرحمن بن إسحاق القاضي بمدينة السلام في خلافة المأمون والمعتصم وكان مولى للرباب وأحدث قبة الخورنق في خلافة أبي العباس ولم تكن قبل ذلك."
  en: "One of the Khurasan da'is; in al-Baladhuri al-Khawarnaq was granted him under the blessed dawla — grandfather of Abd al-Rahman ibn Ishaq the qadi of Madinat al-Salam under al-Ma'mun and al-Mu'tasim — and he raised al-Khawarnaq's dome in Abu al-Abbas's reign."
  es: "Uno de los Khurasan da'is; en al-Baladhuri se le concedió al-Khawarnaq bajo el bendito dawla, abuelo de Abd al-Rahman ibn Ishaq, cadí de Madinat al-Salam bajo al-Ma'mun y al-Mu'tasim, y levantó la cúpula de al-Khawarnaq durante el reinado de Abu al-Abbas."
  fr: "L'un des da'is du Khurasan; à al-Baladhuri, al-Khawarnaq lui fut accordé sous la bienheureuse dawla — grand-père d'Abd al-Rahman ibn Ishaq, le cadi de Madinat al-Salam sous al-Ma'mun et al-Mu'tasim — et il éleva le dôme d'al-Khawarnaq sous le règne d'Abu al-Abbas."
  ur: "خراسان داعی میں سے ایک؛ البلادوری میں الخوارناق نے انہیں بابرکت دعوت کے تحت عطا کیا - عبدالرحمٰن بن اسحاق کے دادا جو المعون اور المعتصم کے ماتحت مدینۃ السلام کے قادی تھے - اور انہوں نے ابو العباس کے دور میں الخوارنق کا گنبد بلند کیا۔"
  tr: "Horasan'daki vaizlerden biri; Al-Baladhuri'ye göre, kutsal devlet sırasında Al-Khurnag'ı kesmiştir. Al-Ma'mun ve Al-Mu'tasim halifeliği sırasında Al-Salam şehrinde yargıç olan Abd al-Rahman ibn Ishaq'ın büyükbabasıydı. Al-Rabab'ın özgür bir kölesiydi ve daha önce var olmayan Ebu el-Abbas halifeliği sırasında El-Hurnag Kubbesi'ni kurmuştur."
  id: "Salah satu pengkhotbah di Khorasan; menurut Al-Baladhuri, ia memutuskan hubungan dengan Al-Khurnag selama masa keberuntungan. Ia adalah kakek Abd al-Rahman ibn Ishaq, hakim di kota Al-Salam pada masa kekhalifahan Al-Ma'mun dan Al-Mu'tasim. Ia adalah budak yang dibebaskan dari Al-Rabab dan mendirikan Kubah Al-Khurnag pada masa kekhalifahan Abu al-Abbas, yang sebelumnya belum ada."
