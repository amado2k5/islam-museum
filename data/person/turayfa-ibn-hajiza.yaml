summary:
  ar: "أخو ممن بن حاجزة؛ كتب إليه أبو بكر يأمره بقتال الفجاءة بجير بن إياس السلمي — وقد كان يقتل المسلمين والمرتدين — فقاتله فأسره وبعث به إليه؛ ويقال إن أبا بكر كتب إلى معن في أمر الفجاءة فوجّه إليه طريفة أخاه فأسره."
  en: "Brother of Mam'un ibn Hajiza; Abu Bakr wrote to him ordering him to fight al-Fuja'a Bujayr ibn Iyas al-Sulami — who was killing Muslims and apostates alike — so he fought, captured and sent him to him; others report Abu Bakr wrote to Ma'n concerning al-Fuja'a and Ma'n sent his brother Turayfa to capture him."
