summary:
  ar: "أخو ممن بن حاجزة؛ كتب إليه أبو بكر يأمره بقتال الفجاءة بجير بن إياس السلمي — وقد كان يقتل المسلمين والمرتدين — فقاتله فأسره وبعث به إليه؛ ويقال إن أبا بكر كتب إلى معن في أمر الفجاءة فوجّه إليه طريفة أخاه فأسره."
  en: "Brother of Mam'un ibn Hajiza; Abu Bakr wrote to him ordering him to fight al-Fuja'a Bujayr ibn Iyas al-Sulami — who was killing Muslims and apostates alike — so he fought, captured and sent him to him; others report Abu Bakr wrote to Ma'n concerning al-Fuja'a and Ma'n sent his brother Turayfa to capture him."
  es: "Hermano de Mam'un ibn Hajiza; Abu Bakr le escribió ordenándole que luchara contra al-Fuja'a Bujayr ibn Iyas al-Sulami, quien estaba matando tanto a musulmanes como apóstatas, así que luchó contra él, lo capturó y se lo envió; otros informan que Abu Bakr le escribió a Ma'n acerca de al-Fuja'a y Ma'n envió a su hermano Turayfa para capturarlo."
  fr: "Frère de Mam'un ibn Hajiza; Abu Bakr lui écrivit pour lui ordonner de combattre al-Fuja'a Bujayr ibn Iyas al-Sulami — qui tuait aussi bien les musulmans que les apostats — il le combattit, le captura et le lui envoya; d'autres rapportent qu'Abu Bakr écrivit à Ma'n au sujet d'al-Fuja'a et que Ma'n envoya son frère Turayfa le capturer."
  ur: "مامون بن حجیزہ کے بھائی؛ ابوبکر نے اسے لکھا کہ اسے الفضعہ بوجائر بن ایاس السلمی سے لڑنے کا حکم دیا جائے - جو مسلمانوں اور مرتدوں کو یکساں طور پر قتل کر رہا تھا - چنانچہ اس نے لڑا، گرفتار کر لیا اور اسے اس کے پاس بھیج دیا۔ دوسرے کہتے ہیں کہ ابوبکر نے فجاع کے بارے میں معن کو خط لکھا اور معن نے اپنے بھائی تریفہ کو اس کو پکڑنے کے لیے بھیجا۔"
