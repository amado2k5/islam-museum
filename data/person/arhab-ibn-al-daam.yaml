summary:
  ar: ابن للدعام بن إبراهيم دخل أثافت مع بني سلمان وهاجم خيوان وقتل في أثافت أبا عمر والي الهادي بحسب الكتاب، سنة 285هـ.
  en: A son of al-Da'am ibn Ibrahim who entered Athafit with Banu Salman, made for Khiwan and, in the book's account, killed al-Hadi's governor Abu Umar at Athafit, in 285 AH.
  ur: دعام بن ابراہیم کا بیٹا جو بنو سلمان کے ساتھ اثافت میں داخل ہوا، خیوان کی طرف بڑھا اور کتاب کے بیان میں 285ھ میں اثافت میں ہادی کے والی ابو عمر کے قتل میں شریک تھا۔
