id: person/arhab-ibn-al-daam
class: person
label:
  ar: أرحب بن الدعام
  en: Arhab ibn al-Da'am
  ur: ارحب بن دعام
  es: "Arhab ibn al-Da'am"
  fr: "Arhab ibn al-Da'am"
summary:
  ar: ابن للدعام بن إبراهيم دخل أثافت مع بني سلمان وهاجم خيوان وقتل في أثافت أبا عمر والي الهادي بحسب الكتاب، سنة 285هـ.
  en: A son of al-Da'am ibn Ibrahim who entered Athafit with Banu Salman, made for Khiwan and, in the book's account, killed al-Hadi's governor Abu Umar at Athafit, in 285 AH.
  ur: دعام بن ابراہیم کا بیٹا جو بنو سلمان کے ساتھ اثافت میں داخل ہوا، خیوان کی طرف بڑھا اور کتاب کے بیان میں 285ھ میں اثافت میں ہادی کے والی ابو عمر کے قتل میں شریک تھا۔
  es: "Un hijo de al-Da'am ibn Ibrahim, que entró en Athafit con Banu Salman, se dirigió a Khiwan y, según el relato del libro, mató al gobernador de al-Hadi, Abu Umar, en Athafit, en el año 285 de la Hégira."
  fr: "Un fils d'al-Da'am ibn Ibrahim qui entra à Athafit avec Banu Salman, se dirigea vers Khiwan et, selon le récit du livre, tua le gouverneur d'al-Hadi, Abu Umar, à Athafit, en 285 AH."
  tr: "İbn el-Da'bin İbrahim, Banu Salman ile birlikte Athafat'a girdi, Khiwan'a saldırdı ve kitaba göre el-Hadi valisi Ebu Ömer tarafından 285 Hicri yılında Athafat'ta öldürüldü."
  id: "Ibn al-Da'am ibn Ibrahim memasuki Athafat bersama Banu Salman, menyerang Khiwan, dan dibunuh di Athafat oleh Abu Umar, gubernur al-Hadi menurut kitab tersebut, pada tahun 285 H."
