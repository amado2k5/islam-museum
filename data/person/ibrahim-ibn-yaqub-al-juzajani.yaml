id: person/ibrahim-ibn-yaqub-al-juzajani
class: person
label:
  ar: "أبو إسحاق الجوزجاني"
  en: "Ibrahim ibn Ya'qub al-Juzajani"
  es: "Ibrahim ibn Ya'qub al-Juzajani"
  fr: "Ibrahim ibn Ya'qub al-Juzajani"
  ur: "ابراہیم بن یعقوب الجوزانی"
roles: [muhaddith]
gender: male
summary:
  ar: "إبراهيم بن يعقوب بن إسحاق السعدي الجوزجاني، أبو إسحاق، محدث الشام وأحد الحفاظ المصنفين، ولد في جوزجان من كور بلخ ورحل إلى مكة والبصرة والرملة ثم سكن دمشق إلى وفاته سنة 259هـ، وله كتاب في الجرح والتعديل وكتاب في الضعفاء."
  en: "Ibrahim ibn Ya'qub al-Juzajani, Abu Ishaq, the hadith scholar of Syria and one of the memorisers and authors, born in Juzjan in the districts of Balkh; he travelled to Mecca, Basra and Ramla and then lived in Damascus until his death in 259 AH, and wrote a book on criticism and accreditation and a book on weak narrators."
  es: "Ibrahim ibn Ya'qub al-Juzajani, Abu Ishaq, erudito de hadices de Siria y uno de los memorizadores y autores, nació en Juzjan, en los distritos de Balkh; viajó a La Meca, Basora y Ramla y luego vivió en Damasco hasta su muerte en el año 259 de la Hégira, y escribió un libro sobre crítica y acreditación y un libro sobre narradores débiles."
  fr: "Ibrahim ibn Ya'qub al-Juzajani, Abu Ishaq, érudit syrien du hadith et mémorisateur, est né à Juzjan, dans le district de Balkh. Il voyagea à La Mecque, Bassora et Ramla, puis vécut à Damas jusqu'à sa mort en 259 AH. Il écrivit un livre sur la critique et l'accréditation ainsi qu'un livre sur les narrateurs faibles."
  ur: "ابراہیم بن یعقوب الجوجانی، ابو اسحاق، شام کے عالم حدیث اور حافظوں اور مصنفین میں سے ایک، جو بلخ کے اضلاع میں جوزجان میں پیدا ہوئے؛ اس نے مکہ، بصرہ اور رملہ کا سفر کیا اور پھر 259 ہجری میں اپنی وفات تک دمشق میں مقیم رہے، اور تنقید و تصدیق پر ایک کتاب اور ضعیف راویوں پر ایک کتاب لکھی۔"
  tr: "İbrahim ibn Ya'qub bin İshaq el-Sa'di el-Cevcani, Ebu İshaq, Levant'ın bir hadis âlimi ve yazar ezbercilerden biriydi. Balh bölgesindeki Cevzcan'da doğdu, Mekke, Basra ve Ramla'ya seyahat etti, ardından 259 Hicri yılında ölümüne kadar Şam'da yerleşti. Eleştiri ve doğruluk üzerine kitaplar ile zayıf rivayetler üzerine kitaplar yazdı."
  id: "Ibrahim ibn Ya'qub ibn Ishaq al-Sa'di al-Jawzjani, Abu Ishaq, adalah seorang ulama hadis dari Levant dan salah satu pengamal yang berkarya. Ia lahir di Jawzjan, dari distrik Balkh, dan melakukan perjalanan ke Mekah, Basra, dan Ramla, lalu menetap di Damaskus hingga wafat pada tahun 259 H. Ia menulis buku-buku tentang kritik dan otentikasi, serta buku tentang narasi lemah."
