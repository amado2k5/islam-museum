summary:
  ar: "إبراهيم بن يعقوب بن إسحاق السعدي الجوزجاني، أبو إسحاق، محدث الشام وأحد الحفاظ المصنفين، ولد في جوزجان من كور بلخ ورحل إلى مكة والبصرة والرملة ثم سكن دمشق إلى وفاته سنة 259هـ، وله كتاب في الجرح والتعديل وكتاب في الضعفاء."
  en: "Ibrahim ibn Ya'qub al-Juzajani, Abu Ishaq, the hadith scholar of Syria and one of the memorisers and authors, born in Juzjan in the districts of Balkh; he travelled to Mecca, Basra and Ramla and then lived in Damascus until his death in 259 AH, and wrote a book on criticism and accreditation and a book on weak narrators."
