summary:
  ar: "فتى من قريش عرضته سادات قريش على أبي طالب ليتخذه ولداً مقابل تسليم ابن أخيه النبي للقتل."
  en: "A young Quraysh man whom the notables offered to Abu Talib as an adopted son in exchange for handing over his nephew to be killed."
  es: "Un joven de la tribu Quraysh a quien los notables ofrecieron a Abu Talib como hijo adoptivo a cambio de que les entregara a su sobrino para que lo mataran."
  fr: "Un jeune homme qurayshite que les notables ont offert à Abou Talib comme fils adoptif en échange de la livraison de son neveu pour qu'il soit tué."
  ur: "قریش کا ایک نوجوان جسے معززین نے ابو طالب کو اپنے بھتیجے کو قتل کرنے کے بدلے میں ایک لے پالک بیٹے کے طور پر پیش کیا۔"
  tr: "Kurayşlı bir çocuk, Kurayş liderlerinin Ebu Talib'e oğlu olarak almasını teklif etti; karşılığında yeğenini Peygamber'e idam için teslim etmesi karşılığında."
  id: "Seorang anak dari Quraisy yang ditawarkan para pemimpin Quraisy kepada Abu Talib untuk dijadikan anak sebagai imbalan menyerahkan keponakannya kepada Nabi untuk dieksekusi."
