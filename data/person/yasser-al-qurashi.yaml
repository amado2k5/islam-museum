summary:
  ar: "قارئ قرآن مصري وُلد سنة 1976 في قرية دير الجنادلة بمحافظة أسيوط. حفظ القرآن في قريته ثم في القاهرة، وحصل على إجازات في رواية حفص والتجويد والقراءات العليا، وكان إمامًا وخطيبًا بمسجد موسى بن نصير بمدينة الشروق في القاهرة، ثم انتقل إلى مسجد في الإمارات؛ وله مصحف مرتل كامل متداول عالميًا."
  en: "Egyptian Qur'an reciter born in 1976 in the village of Deir Ganadleh in Asyut province. He memorised the Qur'an in his village and then in Cairo, earned ijazas in the Hafs reading, in tajwid and in the higher readings, served as imam and preacher at the Musa ibn Nusayr Mosque in Al-Shorouk City, Cairo, and later joined a mosque in the United Arab Emirates; his complete recorded murattal circulates worldwide."
  ur: "مصری قاریِ قرآن، جو 1976ء میں صوبہ اسیوط کے گاؤں دیر الجنادلہ میں پیدا ہوئے۔ انھوں نے اپنے گاؤں اور پھر قاہرہ میں قرآن حفظ کیا، روایتِ حفص، تجوید اور قراءاتِ علیا میں اجازات حاصل کیں، قاہرہ کے شہر الشروق میں مسجد موسیٰ بن نصیر کے امام و خطیب رہے، پھر متحدہ عرب امارات کی ایک مسجد سے وابستہ ہوئے؛ ان کا مکمل مرتل مصحف دنیا بھر میں رائج ہے۔"
