summary:
  ar: "عالم وفقيه ومفسّر عثماني تركي ⁦(1878–1942)⁩، لُقّب بـإلماللي نسبة إلى مسقط رأسه. كلفته الحكومة التركية بكتابة تفسير وترجمة القرآن بالتركية فأنجز «حق ديني قرآن ديلي» ⁦(Hak Dini Kur'an Dili)⁩ في تسع مجلدات، وهو أشهر تفسير تركي حديث، وشغل عضوية البرلمان ووزارة الأوقاف."
  en: "Ottoman-Turkish scholar, jurist and exegete (1878–1942), surnamed Elmalili after his birthplace. The Turkish government commissioned him to write a Qur'an translation and commentary in Turkish, producing the nine-volume Hak Dini Kur'an Dili — the most famous modern Turkish tafsir; he also sat in parliament and served as minister of pious foundations."
  ur: "عثمانی ترک عالم، فقیہ اور مفسر ⁦(1878–1942)⁩ جن کا لقب المللی ان کے مسقط راس پر ہے۔ ترک حکومت نے انہیں ترکی میں قرآن کا ترجمہ اور تفسیر لکھنے کی ذمہ داری دی جس کے نتیجے میں نو جلدی «حق دینی قرآن دیلی» وجود میں آئی — جدید ترکی تفسیر کا مشہور ترین کام؛ وہ رکنِ پارلیمان اور وزیرِ اوقاف بھی رہے۔"
  es: "Erudito, jurista y exégeta otomano-turco (1878-1942), apodado Elmalili por su lugar de nacimiento. El gobierno turco le encargó la traducción y el comentario del Corán al turco, obra que dio como resultado el Hak Dini Kur'an Dili, un tafsir turco moderno de nueve volúmenes, el más famoso. También fue miembro del parlamento y ministro de fundaciones religiosas."
