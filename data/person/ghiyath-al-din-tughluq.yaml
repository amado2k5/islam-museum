summary:
  ar: "مؤسس الدولة التغلقية في سلطنة دلهي وأول سلاطينها (1320–1325). عُرف قبل اعتلائه العرش باسم غازي ملك، وذاع صيته في خدمة الخلجيين حاكمًا لملتان وديبالبور ومنازلًا للمغول على الحدود الشمالية الغربية، ثم أطاح بخسرو خان واعتلى عرش دلهي سنة 1320 وأسّس مدينة تغلق آباد، ومات سنة 1325 حين انهار عليه فسطاط خشبي أُعدّ لاستقباله في طريق عودته من البنغال."
  en: "Founder of the Tughluq dynasty of the Delhi Sultanate and its first sultan (1320–1325). Known before his accession as Ghazi Malik, he rose in Khalji service as governor of Multan and Dipalpur and won renown fighting the Mongols on the north-west frontier. In 1320 he overthrew Khusrau Khan, took the throne of Delhi and founded the city of Tughluqabad. He died in 1325 when a wooden reception pavilion collapsed on him as he returned from Bengal."
  ur: "سلطنتِ دہلی کے تغلق خاندان کے بانی اور اس کے پہلے سلطان (1320–1325)۔ تخت نشینی سے پہلے وہ غازی ملک کے نام سے مشہور تھے؛ خلجی خدمت میں ملتان اور دیپالپور کے گورنر کی حیثیت سے شہرت پائی اور شمال مغربی سرحد پر منگولوں سے لڑے۔ 1320 میں انھوں نے خسرو خان کو ہٹا کر دہلی کا تخت سنبھالا اور تغلق آباد کا شہر بسایا۔ 1325 میں بنگال سے واپسی پر استقبال کے لیے بنایا گیا لکڑی کا خیمہ گرنے سے ان کا انتقال ہوا۔"
