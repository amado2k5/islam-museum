  ar: "فيلسوف مغربي، وُلد سنة 1944، متخصص في المنطق وفلسفة اللغة والأخلاق. طوّر «نموذج الائتمانية» ورؤية للحداثة الإسلامية مؤسسة على الأخلاق، ومن كتبه «روح الحداثة» و«سؤال الأخلاق» و«الحق العربي في الاختلاف الفلسفي»."
  en: "Moroccan philosopher, born in 1944, specialising in logic, philosophy of language and ethics. He developed the “trusteeship paradigm” and an ethically grounded vision of Islamic modernity, authoring Ruh al-Hadatha, Su’al al-Akhlaq and al-Haqq al-’Arabi fi al-Ikhtilaf al-Falsafi."
  ur: "مراکشی فلسفی، 1944 میں پیدا ہوئے اور منطق، فلسفۂ زبان اور اخلاقیات کے ماہر۔ انہوں نے «امانت دارانہ نمونہ» ⁦(ائتمانیہ)⁩ اور اخلاق پر قائم اسلامی جدیدیت کا وژن دیا؛ کتب میں «روح الحداثہ»، «سؤال الأخلاق» اور «الحق العربي في الاختلاف الفلسفي» شامل ہیں۔"
