summary:
  ar: "الشهاب الحجازي الشاعر المفلق؛ ولد في شعبان سنة تسعين وسبعمائة وسمع على المجد الحنفي والبرهان الأبناسي وأجاز له العراقي والهيثمي وعني بالأدب كثيراً حتى صار أوحد أهل زمانه وصنف كتباً أدبية منها روض الآداب والقواعد والمقامات والتذكرة وغير ذلك ونظم ونثر وتاريخ وكتب الخط الحسن وتميز في فنون لكنه هجر ما عدا الأدب منها وأثنى عليه الأكابر مع المداومة على التلاوة والكتابة وحسن العشرة والمجالسة وحلو الكلام وطرح التكلف، توفي في شهر رمضان سنة خمس وسبعين وثمانمائة {cite:shadharat-dhahab p. 319}."
  en: "Al-Shihab al-Hijazi (b. Sha'ban 790) — 'singular poet of his age,' author of Rawd al-Adab, al-Qawa'id, al-Maqamat and al-Tadhkira; praised by the great for his recitation, fine hand and sweet company; died Ramadan 875 {cite:shadharat-dhahab p. 319}."
