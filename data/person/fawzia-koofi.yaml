summary:
  ar: "سياسية أفغانية وناشطة في حقوق المرأة وكاتبة، وُلدت سنة 1975 في بدخشان. عملت ضابطة لحماية الطفل لدى اليونيسف (2002–2004)، وانتُخبت سنة 2005 عضوة في مجلس الشعب عن بدخشان فصارت أول امرأة تتولى منصب النائب الثاني لرئيس البرلمان الأفغاني. صاغت مشروع قانون القضاء على العنف ضد المرأة (2009)، ونجت من محاولات اغتيال عدة، وكانت عضوة في فريق الحكومة الأفغانية المفاوض مع طالبان في الدوحة، وتعيش في المنفى في لندن منذ 2021."
  en: "Afghan politician, women's rights activist and writer, born in 1975 in Badakhshan. She worked as a child protection officer for UNICEF (2002–2004), was elected to the Wolesi Jirga for Badakhshan in 2005 and became the first female Second Deputy Speaker of the Afghan parliament. She drafted the Elimination of Violence Against Women legislation (2009), survived several assassination attempts, sat on the Afghan government's peace negotiation team with the Taliban in Doha, and has lived in exile in London since 2021."
  ur: "افغان سیاست دان، خواتین کے حقوق کی کارکن اور مصنفہ، 1975ء میں بدخشاں میں پیدا ہوئیں۔ انھوں نے یونیسیف میں چائلڈ پروٹیکشن آفیسر کے طور پر کام کیا (2002ء–2004ء)، 2005ء میں بدخشاں سے ولوسی جرگہ کی رکن منتخب ہوئیں اور افغان پارلیمنٹ کی پہلی خاتون سیکنڈ ڈپٹی اسپیکر بنیں۔ انھوں نے خواتین کے خلاف تشدد کے خاتمے کا قانون تیار کیا (2009ء)، کئی قاتلانہ حملوں میں بچیں، دوحہ میں طالبان کے ساتھ حکومتی مذاکراتی ٹیم کی رکن رہیں، اور 2021ء سے لندن میں جلاوطنی کی زندگی گزار رہی ہیں۔"
