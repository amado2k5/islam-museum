label: { ar: "أزاذبه" }
summary:
  ar: "عند البلاذري: صاحب مسالح كسرى فيما بينه وبين العرب لقي خالد بن الوليد بمجتمع الأنهار فقاتله المسلمون وهزموه."
  en: "In al-Baladhuri: lord of Khosrow's frontier posts facing the Arabs; he met Khalid ibn al-Walid at the rivers' confluence — the Muslims fought and routed him."
  es: "En al-Baladhuri: señor de los puestos fronterizos de Cosroes que daban a los árabes; se encontró con Khalid ibn al-Walid en la confluencia de los ríos; los musulmanes lucharon contra él y lo derrotaron."
  fr: "Dans al-Baladhuri: seigneur des postes frontières de Khosrow face aux Arabes; il rencontra Khalid ibn al-Walid au confluent des rivières — les musulmans le combattirent et le mirent en déroute."
  ur: "البلادوری میں: خسرو کی سرحدی چوکیوں کا رب جس کا سامنا عربوں سے ہوتا ہے۔ اس کی ملاقات دریاؤں کے سنگم پر خالد بن الولید سے ہوئی - مسلمانوں نے اس سے لڑائی کی اور اسے شکست دی۔"
  tr: "El-Baladhuri'ye göre: Khosrow'un Araplar ile Araplar arasındaki Yollar adlı eserinin yazarı Halid bin el-Velid, nehir cemaatinde buluştu; burada Müslümanlar onunla savaştı ve onu mağlup etti."
  id: "Menurut Al-Baladhuri: Penulis Khosrow's Pathways between him and the Arabs, Khalid ibn al-Walid bertemu di komunitas sungai, di mana Muslim bertempur dan mengalahkannya."
