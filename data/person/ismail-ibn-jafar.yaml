summary:
  ar: "إسماعيل بن جعفر الصادق بن محمد الباقر، الهاشمي القرشي، أكبر أبناء جعفر الصادق، وإليه تنسب الإسماعيلية التي قالت بإمامته بعد أبيه، ويذكر الزركلي أنه جد الخلفاء الفاطميين وأنه توفي في حياة والده سنة 143 هـ، وأن كتب التاريخ لا تدل على أن له شأنا مذكورا في حياته."
  en: "Isma'il ibn Ja'far al-Sadiq ibn Muhammad al-Baqir, Hashimi and Qurashi, eldest son of Ja'far al-Sadiq, from whom the Isma'ili branch of Shi'ism takes its name because it holds his imamate after his father; al-Zirikli calls him the forefather of the Fatimid caliphs, says he died in his father's lifetime in 143 AH, and notes that the history books show nothing of consequence about him in his life."
  es: "Isma'il ibn Ja'far al-Sadiq ibn Muhammad al-Baqir, hashími y qurashi, hijo mayor de Ja'far al-Sadiq, de quien la rama ismaelita del chiismo toma su nombre porque ostenta su imamato después de su padre; al-Zirikli lo llama el antepasado de los califas fatimíes, dice que murió en vida de su padre en el año 143 AH, y señala que los libros de historia no muestran nada de importancia sobre él en su vida."
  fr: "Isma'il ibn Ja'far al-Sadiq ibn Muhammad al-Baqir, Hashimi et Qurashi, fils aîné de Ja'far al-Sadiq, dont la branche ismaélienne du chiisme tire son nom car elle tient son imamat après son père; al-Zirikli le qualifie d'ancêtre des califes fatimides, dit qu'il mourut du vivant de son père en 143 AH, et note que les livres d'histoire ne montrent rien d'important à son sujet dans sa vie."
  ur: "اسماعیل بن جعفر الصادق بن محمد الباقر، ہاشمی اور قریشی، جعفر الصادق کے بڑے بیٹے، جن سے شیعوں کی اسماعیلی شاخ نے اس کا نام لیا کیونکہ یہ ان کے والد کے بعد ان کی امامت رکھتی ہے۔ الزرکلی اسے فاطمی خلفاء کا جد امجد کہتا ہے، کہتا ہے کہ وہ اپنے والد کی زندگی میں 143 ہجری میں فوت ہوا، اور نوٹ کرتا ہے کہ تاریخ کی کتابیں ان کی زندگی میں ان کے بارے میں کوئی نتیجہ نہیں بتاتی ہیں۔"
  tr: "Haşimi Quraşi'si İsmail bin Ca'far el-Sadiq ibn Muhammed el-Baqir, Ca'far el-Sadiq'in en büyük oğludur. İsmaililer ona atfedilir ve babasından sonra imatlığını ilan etmiştir. El-Zerkali, Fatımı halifelerinin atası olduğunu ve babasının hayattayken, 143 Hicri yılında öldüğünü belirtir. Tarihsel kayıtlar, yaşamı boyunca önemli bir statü olduğunu göstermez."
  id: "Ismail ibn Ja'far al-Sadiq ibn Muhammad al-Baqir, Qurashi Hashemite, adalah putra sulung Ja'far al-Sadiq. Ismaili dikaitkan dengan dia, yang mengklaim imamate setelah ayahnya. Al-Zarkali menyebutkan bahwa ia adalah leluhur khalifah Fatimiyah dan meninggal saat ayahnya masih hidup pada tahun 143 H. Catatan sejarah tidak menunjukkan bahwa ia memiliki status signifikan selama hidupnya."
