id: person/ali-ibn-al-junayd-al-iskafi
class: person
label: { ar: "علي بن الجنيد الإسكافي", en: "'Ali ibn al-Junayd al-Iskafi", es: "'Ali ibn al-Junayd al-Iskafi", fr: "'Ali ibn al-Junayd al-Iskafi", ur: "علی ابن جنید الاسکافی" }
summary:
  ar: "مضحك المعتصم ونديمه، من طرفه أنه فسا في كم ابن حماد حين دنا يساره فقال ما أرى شيئاً ولكني لم أعلم أن في جوف ثيابك كنيفاً، وقال للمعتصم حين منع منه سندان غلامه إن رأيت سندان التركي فأقره مني السلام حاله أنك جعلت بيني وبينك إنساناً رأيتك قبل أن أراه وقد اشتقت إليه {cite:muruj-al-dhahab p. 441-442}."
  en: "Al-Mu'tasim's jester whose 'convey my regards to Sindan — I saw you before I saw him' reduced the caliph to helpless laughter {cite:muruj-al-dhahab p. 441-442}."
  es: "El bufón de Al-Mu'tasim, cuyo \"transmítele mis saludos a Sindan; te vi antes de verlo a él\", hizo que el califa estallara en una risa incontrolable {cite:muruj-al-dhahab p. 441-442}."
  fr: "Le bouffon d'Al-Mu'tasim dont le « Transmets mes salutations à Sindan — je t'ai vu avant de le voir » a réduit le calife à un rire impuissant {cite:muruj-al-dhahab p. 441-442}."
  ur: "المعتصم کے مضحکہ خیز جس نے 'سندن کو میرا سلام پیش کیا - میں نے اسے دیکھنے سے پہلے آپ کو دیکھا تھا' نے خلیفہ کو بے بسی سے ہنسا دیا {حوالہ: مروج الذہب صفحہ 441-442}۔"
  tr: "Al-Mu'tasim ve yoldaşı güldüler, çünkü sol tarafına yaklaştığında İbn Hammad'ın kollarına girdi ve dedi ki, 'Hiçbir şey görmüyorum, ama kıyafetlerinin içinde kefen olduğunu bilmiyordum.' Hizmetçisinin örsü verilmediğinde, al-Mu'tasim'e şöyle dedi: 'Eğer Türk'ün örsünü görürsen, onu benim selamlarımla selamla, sanki aramızda görmeden önce gördüğüm ve özlediğim bir adam yaratmışsın.' {atıf:Muruj-al-Dhahab s. 441-442}."
  id: "Al-Mu'tasim dan temannya tertawa, karena ia menyelinap ke lengan baju Ibn Hammad saat mendekati kirinya dan berkata, 'Aku tidak melihat apa-apa, tapi aku tidak tahu ada kain kafan di dalam pakaianmu.' Ia berkata kepada al-Mu'tasim, ketika ia tidak diberi landasan besi pelayannya, 'Jika kau melihat landasan milik orang Turki, sambutlah dia dengan salamku, seolah-olah kau telah membuat antara aku dan dirimu seorang pria yang kulihat sebelum aku melihatnya, dan aku merindukannya.' {cite:muruj-al-dhahab hlm. 441-442}."
