summary:
  ar: "الأمير شرف يعقوب بن محمد الموصلي الذي أقام بالشام وتقدم فيه؛ كان سنة عشرين وستمائة أميراً على حجاج الشام فاجتمع العرب في خلق كثير وأرادوا قطع الطريق عليهم فمنعهم بالرغبة والرهبة ثم صانعهم بمال وثياب فأعطى الجميع من ماله ولم يأخذ من الحجاج الدرهم الفرد، يقول ابن الأثير: فعل فعلاً جميلاً وكان عنده كثير من العلوم ويرجع إلى دين متين {cite:kamil-ibn-al-athir p. 438}."
  en: "The Mosuli commander of the Syrian pilgrimage of 620 — when the Arabs massed to cut the road he bought them off with his own money and robes 'taking not a single dirham from the pilgrims', praised by Ibn al-Athir for learning and firm religion {cite:kamil-ibn-al-athir p. 438}."
