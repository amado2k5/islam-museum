id: person/sharaf-yaqub-hajj-amir
class: person
label: { ar: "شرف يعقوب بن محمد أمير الحجاج", en: "Sharaf Ya'qub ibn Muhammad, commander of the Syrian hajj", es: "Sharaf Ya'qub ibn Muhammad, commander of the Syrian hajj", fr: "Sharaf Ya'qub ibn Muhammad, commander of the Syrian hajj", ur: "شرف یعقوب بن محمد، شامی حج کے کمانڈر" }
summary:
  ar: "الأمير شرف يعقوب بن محمد الموصلي الذي أقام بالشام وتقدم فيه؛ كان سنة عشرين وستمائة أميراً على حجاج الشام فاجتمع العرب في خلق كثير وأرادوا قطع الطريق عليهم فمنعهم بالرغبة والرهبة ثم صانعهم بمال وثياب فأعطى الجميع من ماله ولم يأخذ من الحجاج الدرهم الفرد، يقول ابن الأثير: فعل فعلاً جميلاً وكان عنده كثير من العلوم ويرجع إلى دين متين {cite:kamil-ibn-al-athir p. 438}."
  en: "The Mosuli commander of the Syrian pilgrimage of 620 — when the Arabs massed to cut the road he bought them off with his own money and robes 'taking not a single dirham from the pilgrims', praised by Ibn al-Athir for learning and firm religion {cite:kamil-ibn-al-athir p. 438}."
  es: "El comandante mosuli de la peregrinación siria del año 620, cuando los árabes se agruparon para cortar el camino, los sobornó con su propio dinero y túnicas, \"sin tomar ni un solo dirham de los peregrinos\", elogiado por Ibn al-Athir por su erudición y firme religión {cite:kamil-ibn-al-athir p. 438}."
  fr: "Le commandant mosoulien du pèlerinage syrien de 620 — lorsque les Arabes se massèrent pour couper la route, il les acheta avec son propre argent et ses robes « ne prenant pas un seul dirham aux pèlerins », loué par Ibn al-Athir pour son érudition et sa religion ferme {cite:kamil-ibn-al-athir p. 438}."
  ur: "620 کے شامی حجاج کے موصلی کمانڈر - جب عرب سڑک کاٹنے کے لیے جمع ہوئے تو اس نے انھیں اپنے پیسوں اور لباس سے خریدا 'حاجیوں سے ایک درہم بھی نہیں لیا'، ابن الثیر نے دین سیکھنے اور پختہ ہونے کے لیے اس کی تعریف کی ہے۔ 438}۔"
  tr: "Şam'da ikamet eden ve oraya ilerleyen Prens Şeref Yaqub bin Muhammed el-Mevsili, 620 Hicri yılında Levant hacılarının komutanıydı. Araplar çok sayıda toplandı ve yollarını kapatmak istediler, ancak o arzu ve korkudan onları engelledi, sonra para ve giysiyle onları yaptı, servetinden herkese verdi ve hacılardan tek bir dirhem bile almadı. İbn al-Athir şöyle der: Güzel bir iş yaptı, çok bilgiye sahipti ve sağlam bir dine döndü {atıf:kamil-ibn-al-athir s. 438}."
  id: "Pangeran Sharaf Yaqub ibn Muhammad al-Mawsili, yang tinggal di Levant dan maju ke sana, adalah komandan para peziarah Levant pada tahun 620 H. Orang Arab berkumpul dalam jumlah besar dan ingin menghalangi jalan mereka, tetapi ia menghalangi mereka karena keinginan dan ketakutan, lalu membuat mereka dengan uang dan pakaian, memberikan semua orang dari kekayaannya dan tidak mengambil satu dirham pun dari para peziarah. Ibn al-Athir berkata: Ia melakukan perbuatan indah, memiliki banyak pengetahuan, dan kembali ke agama yang teguh {cite:kamil-ibn-al-athir hlm. 438}."
