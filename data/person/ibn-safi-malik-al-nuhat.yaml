summary:
  ar: "ملك النحاة أبو نزار الحسن بن صافي البغدادي الفقيه الأصولي المصنف في الأصلين والنحو وفنون الأدب؛ لقب نفسه ملك النحاة ويغضب على من لا يدعوه بذلك، وله ديوان شعر، تفقه على أحمد الأشنهي تلميذ المتولي وقرأ أصول الفقه على ابن برهان وأصول الدين على أبي عبد الله القيرواني والخلاف على أسعد الميهني والنحو على التبريزي وبرع فيه، وسافر إلى خراسان والهند ثم سكن واسط مدة وأخذ عنه جماعة من أهلها ثم استوطن دمشق وصنف في النحو كتباً كبيرة وفي الفقه كتاباً واحداً ومختصرين في الأصولين، وكان نحوياً بارعاً أصولياً متكلماً فصيحاً كثير العجب والتيه، وتوفي بدمشق في شوال سنة ثمان وستين وخمسمائة عن ثمانين سنة ودفن بباب الصغير {cite:shadharat-dhahab p. 707-708}."
  en: "Malik al-Nuhat Abu al-Nizar al-Hasan ibn Safi of Baghdad — 'king of grammarians', a title he gave himself and resented those who withheld; jurist, usuli and man of letters who read usul on Ibn Burhan, kalam on al-Qayrawani, khilaf on As'ad al-Mayhani and nahw on al-Tibrizi, travelled to Khurasan and India, settled at Wasit then Damascus where he wrote large grammar works; vain yet brilliant, d. Shawwal 568 at Damascus aged eighty, buried at Bab al-Saghir {cite:shadharat-dhahab p. 707-708}."
  es: "Malik al-Nuhat Abu al-Nizar al-Hasan ibn Safi de Bagdad — 'rey de los gramáticos', título que él mismo se otorgó y del que se resintió con quienes se lo negaban; jurista, usuli y hombre de letras que leyó usul sobre Ibn Burhan, kalam sobre al-Qayrawani, khilaf sobre As'ad al-Mayhani y nahw sobre al-Tibrizi, viajó a Jorasán y a la India, se estableció en Wasit y luego en Damasco, donde escribió grandes obras gramaticales; vanidoso pero brillante, murió en Shawwal de 568 en Damasco a la edad de ochenta años, enterrado en Bab al-Saghir {cite:shadharat-dhahab p. 707-708}."
  fr: "Malik al-Nuhat Abu al-Nizar al-Hasan ibn Safi de Bagdad — « roi des grammairiens », titre qu'il s'était lui-même attribué et dont il s'irritait de ceux qui le lui refusaient; juriste, usuli et homme de lettres qui étudia l'usul sur Ibn Burhan, le kalam sur al-Qayrawani, le khilaf sur As'ad al-Mayhani et le nahw sur al-Tibrizi, voyagea au Khorasan et en Inde, s'établit à Wasit puis à Damas où il écrivit d'importants ouvrages de grammaire; vaniteux mais brillant, mort en Shawwal 568 à Damas à l'âge de quatre-vingts ans, enterré à Bab al-Saghir {cite: shadharat-dhahab p. 707-708}."
  ur: "ملک النوحات ابو النظر الحسن ابن صفی بغداد کے - 'گرامر کا بادشاہ'، ایک لقب اس نے اپنے آپ کو دیا اور روکنے والوں سے ناراضگی ظاہر کی۔ فقیہ، اصولی اور خطوط کا آدمی جس نے ابن برہان پر اصول، القیروانی پر کلام، اسد المہانی پر خلافت اور تبریزی پر نحو پڑھا، خراسان اور ہندوستان کا سفر کیا، واسط پھر دمشق میں سکونت اختیار کی جہاں اس نے گرامر کے بڑے کام لکھے۔ بیکار ابھی تک شاندار، ڈی. شوال 568 کو دمشق میں اسّی سال کی عمر میں باب الصغیر میں دفن کیا گیا۔ 707-708}۔"
  tr: "Dilbilgicilerin kralı, hukukçu, usuli, 'al-Usul al-Mustaq' (İlkeler, Dilbilgisi ve Edebiyat Sanatları) kitabının yazarı Ebu Nizar el-Hasan ibn Safi el-Bağdadi'ydi; kendisini dilbilgicilerin kralı olarak adlandırıyor ve kendisine böyle demeyenlere kızıyordu. Ahmad el-Aşnahi'nin yanında bir şiir kitabı yazdı, el-Mutavalli'nin öğrencisi olarak Ahmad el-Eşnahi'nin yanında bir şiir kitabı yazdı, İbn Burhan'dan fıkıh ilkelerini, Ebu Abdullah el-Qayrawani'den din ilkelerini çalıştı, As'ad el-Mihani ile anlaşmazlık yaşadı ve dilbilgisini el-Tebrizi ile anladı. Horasan ve Hindistan'a seyahat etti, ardından bir süre Vasit'te yerleşti, burada bir grup halkını inceledi, ardından Şam'a yerleşti ve yazdı Büyük dilbilgisi kitapları yazdı ve fıkıhta bir kitap vardı, ayrıca fıkıh ilkeleri üzerine özlü kitaplar vardı. Yetenekli bir dilbilgicisi, hukukçu, etkileyici bir konuşmacıydı ve sık sık şaşırıp kafası karışıyordu. 568 Hicri yılında, seksen yaşında Şam'da Şevval'de öldü ve Bab al-Saghir'de defnedildi {kaynak: shadharat-dhahab, s. 707-708}."
  id: "Raja para ahli tata bahasa adalah Abu Nizar al-Hasan ibn Safi al-Baghdadi, seorang ahli hukum, usuli, penulis 'al-Usul al-Mustaq' (Prinsip Prinsip, Tata Bahasa, dan Seni Sastra); ia menyebut dirinya Raja para ahli tata bahasa dan marah kepada mereka yang tidak memanggilnya demikian. Ia menulis kumpulan puisi di bawah Ahmad al-Ashnahi, seorang murid al-Mutawalli, mempelajari prinsip fiqh. Ibn Burhan, prinsip agama di bawah Abu Abdullah al-Qayrawani, tidak setuju dengan As'ad al-Mihani, dan tata bahasa dengan al-Tabrizi, dan unggul di bidang itu. Ia melakukan perjalanan ke Khorasan dan India, lalu menetap di Wasit untuk sementara waktu, di mana ia mempelajari sekelompok penduduknya, kemudian menetap di Damaskus dan menulis di Ia menulis buku-buku tata bahasa utama, dan dalam bidang hukum terdapat satu buku dan yang ringkas tentang prinsip-prinsip fiqh. Ia adalah ahli tata bahasa yang terampil, ahli hukum, pembicara yang fasih, dan sering terkejut serta bingung. Ia meninggal di Damaskus di Shawwal pada tahun 568 H pada usia delapan puluh tahun dan dimakamkan di Bab al-Saghir {cite:shadharat-dhahab, hlm. 707-708}."
