summary:
  ar: "حافظ ومحدث من جرجان، تربى في حجر والده وطلب العلم في شيوخ جرجان. جمع بين الفقه والحديث ورياسة الدين والدنيا، وصنّف «الصحيح»، وأخذ عنه ابنه أبو سعيد وفقهاء جرجان {cite:tabaqat-fuqaha-abbas-1981 p. 61}. قال شيخ الشيرازي القاضي أبو الطيب الطبري: دخلت جرجان قاصداً إليه وهو حي فمات قبل أن ألقاه {cite:tabaqat-fuqaha-abbas-1981 p. 61}. وذكر الشيرازي وفاته «نيف وسبعين وثلاثمائة» {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "A memorizer and hadith scholar of Jurjan, raised by his father and educated by the scholars of Jurjan."
