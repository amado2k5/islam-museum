label: { ar: "العباس بن الوليد", en: "al-'Abbas ibn al-Walid", fr: "Al-Abbas ibn al-Walid", ur: "عباس بن الولید", es: "al-'Abbas ibn al-Walid" }
summary:
  ar: "قائد أموي، ابن الخليفة الوليد بن عبد الملك، شارك مع عمه مسلمة بن عبد الملك في فتح طوانة وسبستيا وأماسية وأنطاكية في بيسيديا، وقاتل يزيد بن المهلب، وشارك في انقلاب سنة 126هـ، ثم سُجن ومات في الوباء بحرّان سنة 132هـ. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  en: "Umayyad general and son of the caliph al-Walid I. With his uncle Maslama ibn 'Abd al-Malik he took Tuwana in Cappadocia and later Sebastopol in Cilicia and Amasia in Pontus (93/712), and he fought Yazid ibn al-Muhallab. He joined the coup of 126/744 against al-Walid II, was imprisoned by Marwan II and died in prison at Harran in 132/750. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  fr: "Général omeyyade et fils du calife al-Walid Ier. Avec son oncle Maslama ibn Abd al-Malik, il prit Tuwana en Cappadoce, puis Sébastopol en Cilicie et Amasia dans le Pont (93 H/712), et combattit Yazid ibn al-Muhallab. Il participa au coup d’État de 126 H/744 contre al-Walid II, fut emprisonné par Marwan II et mourut en prison à Harran en 132 H/750. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  ur: "اموی سپہ سالار، خلیفہ الولید اول کے بیٹے۔ اپنے چچا مسلمہ کے ساتھ طوانہ، سبستیا اور اماسیہ کی فتوحات میں شریک ہوئے، یزید بن المہلب کے خلاف لڑے، 126/744 کی بغاوت میں شامل ہوئے، اور 132/750 میں حرّان کی قید میں وبا سے وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  es: "General omeya e hijo del califa al-Walid I. Junto con su tío Maslama ibn 'Abd al-Malik, conquistó Tuwana en Capadocia y posteriormente Sebastopol en Cilicia y Amasia en el Ponto (93/712), y combatió contra Yazid ibn al-Muhallab. Se unió al golpe de Estado de 126/744 contra al-Walid II, fue encarcelado por Marwan II y murió en prisión en Harran en 132/750. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
