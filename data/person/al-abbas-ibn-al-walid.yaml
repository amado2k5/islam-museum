id: person/al-abbas-ibn-al-walid
class: person
label: { ar: "العباس بن الوليد", en: "al-'Abbas ibn al-Walid", ur: "عباس بن الولید" }
summary:
  ar: "قائد أموي، ابن الخليفة الوليد بن عبد الملك، شارك مع عمه مسلمة بن عبد الملك في فتح طوانة وسبستيا وأماسية وأنطاكية في بيسيديا، وقاتل يزيد بن المهلب، وشارك في انقلاب سنة 126هـ، ثم سُجن ومات في الوباء بحرّان سنة 132هـ. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  en: "Umayyad general and son of the caliph al-Walid I. With his uncle Maslama ibn 'Abd al-Malik he took Tuwana in Cappadocia and later Sebastopol in Cilicia and Amasia in Pontus (93/712), and he fought Yazid ibn al-Muhallab. He joined the coup of 126/744 against al-Walid II, was imprisoned by Marwan II and died in prison at Harran in 132/750. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
  ur: "اموی سپہ سالار، خلیفہ الولید اول کے بیٹے۔ اپنے چچا مسلمہ کے ساتھ طوانہ، سبستیا اور اماسیہ کی فتوحات میں شریک ہوئے، یزید بن المہلب کے خلاف لڑے، 126/744 کی بغاوت میں شامل ہوئے، اور 132/750 میں حرّان کی قید میں وبا سے وفات پائی۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 31–32}"
