  ar: "فيزيائي فلكي فرنسي، وُلد سنة 1958؛ مدير أبحاث في المركز الوطني للبحث العلمي ومدير سابق لمرصد ليون ⁦(2005–2015)⁩. اشتهر بأبحاثه في تشكّل المجرات وبكتاباته في العلم والإسلام بعد اعتناقه الإسلام."
