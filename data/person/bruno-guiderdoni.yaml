  id: "Seorang astrofisikawan Prancis, lahir pada tahun 1958; Direktur Riset di National Center for Scientific Research dan mantan Direktur Lyon Observatory (2005–2015). Ia menjadi terkenal karena penelitiannya tentang pembentukan galaksi dan tulisannya tentang sains dan Islam setelah memeluk Islam."
