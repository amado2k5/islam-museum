  es: "Astrofísico francés, nacido en 1958; director de investigación del CNRS y exdirector del Observatorio de Lyon (2005-2015). Conocido por su trabajo sobre la formación de galaxias y por sus escritos sobre ciencia e islam tras su conversión, adoptando el nombre de Abd al Haqq."
  fr: "Astrophysicien français, né en 1958; directeur de recherche au CNRS et ancien directeur de l'Observatoire de Lyon (2005-2015). Connu pour ses travaux sur la formation des galaxies et pour ses écrits sur la science et l'islam après sa conversion, sous le nom d'Abd al Haqq."
