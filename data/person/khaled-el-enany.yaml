  ar: عالم مصريات وأستاذ جامعي مصري وُلد سنة 1971. المدير العام لمنظمة اليونسكو منذ نوفمبر 2025، أول عربي ومسلم يقود المنظمة، ووزير سابق للسياحة والآثار في مصر.
