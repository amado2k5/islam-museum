  es: "Egiptólogo y profesor egipcio, nacido en 1971. Director General de la UNESCO desde noviembre de 2025, el primer árabe y el primer musulmán en dirigir la organización, y ex Ministro de Turismo y Antigüedades de Egipto."
  fr: "Égyptologue et professeur égyptien, né en 1971. Directeur général de l'UNESCO depuis novembre 2025, premier Arabe et premier musulman à diriger l'organisation, et ancien ministre égyptien du Tourisme et des Antiquités."
