summary:
  ar: "أبو القاسم يوسف بن علي بن جبارة الهذلي، رحل من المغرب إلى المشرق وطاف البلاد وروى عن أئمة القراءة حتى ما وراء النهر، وألّف «الكامل» جمع فيه خمسين قراءة وألفاً وأربعمائة وتسعاً وخمسين رواية وطريقاً؛ توفي سنة 465هـ {cite:nashr-dahman-damascus-1345-v1 p. 45}."
  en: "Abu al-Qasim Yusuf ibn 'Ali ibn Jabbara al-Hudhali travelled from the Maghrib to the East and toured its lands, taking from the masters of the readings as far as Transoxiana, and wrote al-Kamil, which gathers fifty readings with fourteen hundred and fifty-nine riwayas and lines of transmission; he died in 465 AH {cite:nashr-dahman-damascus-1345-v1 p. 45}."
  ur: "ابو القاسم یوسف بن علی بن جبارہ ہذلی نے مغرب سے مشرق کا سفر کیا، بلاد کا چکر لگایا اور ماوراء النہر تک ائمۂ قراءت سے روایت لی، اور «الکامل» لکھی جس میں پچاس قراءتیں اور چودہ سو انسٹھ روایات و طرق جمع ہیں؛ 465ھ میں فوت ہوئے {cite:nashr-dahman-damascus-1345-v1 p. 45}."
