summary:
  ar: "ضابط مصري من أصل فلاحي (1841-1911) قاد الحركة الوطنية المعروفة بالثورة العرابية: احتج مع زملائه الضباط على امتيازات الأتراك والشراكسة وعلى الرقابة المالية الأنجلو-فرنسية، وصار وزيرا للحربية في وزارة محمود سامي البارودي الوطنية (فبراير 1882)، وقاوم الاحتلال البريطاني حتى هزيمته في التل الكبير (13 سبتمبر 1882)، فحوكم ونُفي إلى سيلان حتى سنة 1901، وتوفي في القاهرة سنة 1911."
  en: "Egyptian officer of fellah origin (1841–1911) who led the nationalist movement known as the 'Urabi revolt: he protested with his fellow officers against Turco-Circassian privilege and Anglo-French financial control, became Minister of War in Mahmud Sami al-Barudi's nationalist ministry (February 1882), and resisted the British occupation until his defeat at Tell el-Kebir (13 September 1882). He was tried and exiled to Ceylon until 1901, and died in Cairo in 1911."
  ur: "مصری افسر (1841-1911) جو کسان خاندان سے اٹھے اور «عرابی بغاوت» کہلانے والی قومی تحریک کے قائد بنے: انہوں نے ساتھی افسروں کے ساتھ ترک و شرکسی استحقاق اور انگریزی-فرانسیسی مالی کنٹرول کے خلاف احتجاج کیا، محمود سامی البارودی کی قوم پرست وزارت میں وزیرِ جنگ بنے (فروری 1882)، اور تل الکبیر کی شکست (13 ستمبر 1882) تک برطانوی قبضے کی مزاحمت کی۔ ان پر مقدمہ چلا اور وہ 1901 تک سیلون میں جلاوطن رہے؛ 1911 میں قاہرہ میں وفات پائی۔"
