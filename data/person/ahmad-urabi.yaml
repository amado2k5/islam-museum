summary:
  ar: "ضابط مصري من أصل فلاحي (1841-1911) قاد الحركة الوطنية المعروفة بالثورة العرابية: احتج مع زملائه الضباط على امتيازات الأتراك والشراكسة وعلى الرقابة المالية الأنجلو-فرنسية، وصار وزيرا للحربية في وزارة محمود سامي البارودي الوطنية ⁦(فبراير 1882)⁩، وقاوم الاحتلال البريطاني حتى هزيمته في التل الكبير ⁦(13 سبتمبر 1882)⁩، فحوكم ونُفي إلى سيلان حتى سنة 1901، وتوفي في القاهرة سنة 1911."
  en: "Egyptian officer of fellah origin (1841–1911) who led the nationalist movement known as the 'Urabi revolt: he protested with his fellow officers against Turco-Circassian privilege and Anglo-French financial control, became Minister of War in Mahmud Sami al-Barudi's nationalist ministry (February 1882), and resisted the British occupation until his defeat at Tell el-Kebir (13 September 1882). He was tried and exiled to Ceylon until 1901, and died in Cairo in 1911."
  ur: "مصری افسر (1841-1911) جو کسان خاندان سے اٹھے اور «عرابی بغاوت» کہلانے والی قومی تحریک کے قائد بنے: انہوں نے ساتھی افسروں کے ساتھ ترک و شرکسی استحقاق اور انگریزی-فرانسیسی مالی کنٹرول کے خلاف احتجاج کیا، محمود سامی البارودی کی قوم پرست وزارت میں وزیرِ جنگ بنے ⁦(فروری 1882)⁩، اور تل الکبیر کی شکست ⁦(13 ستمبر 1882)⁩ تک برطانوی قبضے کی مزاحمت کی۔ ان پر مقدمہ چلا اور وہ 1901 تک سیلون میں جلاوطن رہے؛ 1911 میں قاہرہ میں وفات پائی۔"
  es: "Oficial egipcio de origen fellah (1841-1911) que lideró el movimiento nacionalista conocido como la 'Revuelta de Urabi: protestó junto a sus compañeros oficiales contra los privilegios turco-circasiáticos y el control financiero anglo-francés, se convirtió en Ministro de Guerra en el ministerio nacionalista de Mahmud Sami al-Barudi (febrero de 1882) y resistió la ocupación británica hasta su derrota en Tell el-Kebir (13 de septiembre de 1882). Fue juzgado y exiliado a Ceilán hasta 1901, y murió en El Cairo en 1911."
  fr: "Officier égyptien d'origine fellah (1841-1911), il mena le mouvement nationaliste connu sous le nom de révolte d'Urabi. Avec ses camarades, il protesta contre les privilèges turco-circassiens et la mainmise financière franco-britannique. Devenu ministre de la Guerre au sein du gouvernement nationaliste de Mahmoud Sami al-Barudi (février 1882), il résista à l'occupation britannique jusqu'à sa défaite à Tell el-Kebir (13 septembre 1882). Jugé et exilé à Ceylan jusqu'en 1901, il mourut au Caire en 1911."
  tr: "Mısır'da köylü kökenli bir subay olan (1841-1911), Urabi Devrimi olarak bilinen ulusal harekete önderlik etti: Subay arkadaşlarıyla birlikte Türklerin ve Çerkeslerin ayrıcalıklarına ve İngiliz-Fransız mali kontrolüne karşı protesto etti, Mahmud Sami el-Baroudi'nin ulusal kabinesinde Savaş Bakanı oldu (Şubat 1882) ve Tell el Kebir'deki yenilgisine (13 Eylül 1882) kadar İngiliz işgaline direndi, bu yüzden yargılandı ve 1901 yılına kadar Seylan'a sürgün edildi ve 1911'de Kahire'de öldü."
  id: "Seorang perwira Mesir keturunan petani (1841-1911) yang memimpin gerakan nasional yang dikenal sebagai Revolusi Urabi: ia memprotes bersama rekan-rekan perwiranya terhadap hak istimewa orang Turki dan Sirkasia serta terhadap kendali keuangan Inggris-Prancis, dan menjadi Menteri Perang dalam kabinet nasional Mahmoud Sami al-Baroudi (Februari 1882), dan melawan pendudukan Inggris hingga kekalahannya di Tell El Kebir (13 September 1882), sehingga ia diadili dan diasingkan ke Ceylon hingga tahun 1901, dan meninggal di Kairo pada tahun 1911."
