id: person/abd-al-rahman-abu-zayd-al-fasi
class: person
gender: male
label:
  ar: عبد الرحمن بن عبد القادر الفاسي (أبو زيد)
  en: Abd al-Rahman ibn Abd al-Qadir al-Fasi (Abu Zayd, Maliki scholar of Fez)
summary:
  ar: فقيه مالكي فاسي من أهل الفهرية، محدث وأديب، مشارك في أنواع من العلوم؛ أخذ عن والده وعمه أحمد ومحمد بن أحمد الفاسي والقاضي ابن سودة وعبد الوهاب بن العربي، وكان والده يقول إنه سيوطي زمانه. من تصانيفه مفتاح الشفاء وأزهار البساتين والتوقيت والأقنوم في مبادئ العلوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  en: A Maliki scholar of Fez of the Fihriya, traditionist and man of letters, learned in several sciences; he studied with his father, his uncle Ahmad, Muhammad ibn Ahmad al-Fasi, the judge Ibn Sawda and Abd al-Wahhab ibn al-Arabi; his father called him the Suyuti of his age. Works include Miftah al-Shifa and Azhar al-Basatin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  ur: فاس کے مالکی عالم، فہری خاندان سے، محدث اور ادیب؛ اپنے والد اور چچا احمد وغیرہ سے پڑھا؛ والد کہتے تھے کہ وہ اپنے زمانے کے سیوطی ہیں؛ تصانیف میں مفتاح الشفاء اور أزہار البساتین ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
