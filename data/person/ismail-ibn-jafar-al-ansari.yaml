  ar: "إسماعيل بن جعفر بن أبي كثير الأنصاري، أبو إبراهيم، قارئ أهل المدينة في عصره ومن موالي بني زريق، رحل إلى بغداد وأدب علي بن المهدي وتوفي بها سنة 180 هـ، وروى عنه أصحاب الكتب الستة وقال ابن معين ثقة مأمون."
