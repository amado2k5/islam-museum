summary:
  ar: "سليمان بال ⁦(نحو 1720–1775/1776)⁩، عالم تورودبي من فوتا تورو في وادي السنغال، قاد الثورة التي أطاحت بمملكة دنيانكي وأسّست إمامة فوتا تورو الإسلامية، ورفض أن يتولّى الإمامة بنفسه، وقُتل وهو يحارب مور براكنة. ترك لأهل فوتا وصيّته الشهيرة: ألّا يتحوّل منصب الإمام إلى ملك وراثي، وأن يُنتحى كل إمام أثرى."
  en: "Sulayman Bal (c. 1720–1775/1776), a Torodbe scholar of Futa Toro in the Senegal valley who led the revolution that overthrew the Denyanke kingdom and founded the Islamic Imamate of Futa Toro, refused the imamate for himself, and was killed fighting the Brakna Moors. He left the people of Futa his celebrated charge: that the imamate must never become a hereditary kingship, and that any imam who grows rich is to be deposed."
  ur: "سلیمان بال ⁦(تقریباً 1720–1775/1776)⁩، وادی سینیگال کے علاقے فوٹا ٹورو کے توروڈبے عالم، جنھوں نے اس انقلاب کی قیادت کی جس نے ڈینیانکے بادشاہت کو ختم کر کے فوٹا ٹورو کی اسلامی امامت قائم کی، خود امامت قبول کرنے سے انکار کیا، اور برکنا موروں سے لڑتے ہوئے شہید ہوئے۔ انھوں نے فوٹا کے لوگوں کو اپنی مشہور وصیت چھوڑی کہ امامت کبھی موروثی بادشاہت نہ بنے اور جو امام مالدار ہو جائے اسے معزول کر دیا جائے۔"
  es: "Sulayman Bal (c. 1720–1775/1776), un erudito torodbe de Futa Toro en el valle del Senegal que lideró la revolución que derrocó al reino de Denyanke y fundó el Imamato Islámico de Futa Toro, rechazó el imamato para sí mismo y murió luchando contra los moros brakna. Dejó al pueblo de Futa su célebre mandato: que el imamato jamás se convirtiera en una monarquía hereditaria y que cualquier imán que se enriqueciera debía ser depuesto."
  fr: "Sulayman Bal (vers 1720-1775/1776), érudit torodbé du Fouta Toro dans la vallée du Sénégal, mena la révolution qui renversa le royaume de Denyanke et fonda l'imamat islamique du Fouta Toro. Il refusa lui-même l'imamat et fut tué au combat contre les Maures de Brakna. Il laissa au peuple du Fouta son célèbre précepte: l'imamat ne devait jamais devenir une royauté héréditaire et tout imam qui s'enrichissait devait être déposé."
  tr: "Suleiman Bal (yaklaşık 1720–1775/1776), Senegal Vadisi'ndeki Fota Toro'dan bir Toroudi bilgini, Dnyanke Krallığı'nı deviren ve İslami İmamı Fota Toro'yu kuran devrimi yönetti. Kendisi imam olmayı reddetti ve Mor Bracena ile savaşırken öldürüldü. Fota halkına ünlü vasiyetini bıraktı: imamlık makamının kalıtsal kral olmaması ve her zengin imamın çekilmesi."
  id: "Suleiman Bal (sekitar 1720–1775/1776), seorang cendekiawan Toroudi dari Fota Toro di Lembah Senegal, memimpin revolusi yang menggulingkan Kerajaan Dnyanke dan mendirikan Imamate Islam Fota Toro. Ia menolak untuk mengambil alih imaman sendiri dan tewas saat berperang melawan Mor Bracena. Ia meninggalkan wasiat terkenalnya kepada rakyat Fota: bahwa posisi imam tidak boleh menjadi raja turun-temurun, dan setiap imam kaya harus mundur."

