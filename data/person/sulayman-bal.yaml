summary:
  ar: "سليمان بال (نحو 1720–1775/1776)، عالم تورودبي من فوتا تورو في وادي السنغال، قاد الثورة التي أطاحت بمملكة دنيانكي وأسّست إمامة فوتا تورو الإسلامية، ورفض أن يتولّى الإمامة بنفسه، وقُتل وهو يحارب مور براكنة. ترك لأهل فوتا وصيّته الشهيرة: ألّا يتحوّل منصب الإمام إلى ملك وراثي، وأن يُنتحى كل إمام أثرى."
  en: "Sulayman Bal (c. 1720–1775/1776), a Torodbe scholar of Futa Toro in the Senegal valley who led the revolution that overthrew the Denyanke kingdom and founded the Islamic Imamate of Futa Toro, refused the imamate for himself, and was killed fighting the Brakna Moors. He left the people of Futa his celebrated charge: that the imamate must never become a hereditary kingship, and that any imam who grows rich is to be deposed."
  ur: "سلیمان بال (تقریباً 1720–1775/1776)، وادی سینیگال کے علاقے فوٹا ٹورو کے توروڈبے عالم، جنھوں نے اس انقلاب کی قیادت کی جس نے ڈینیانکے بادشاہت کو ختم کر کے فوٹا ٹورو کی اسلامی امامت قائم کی، خود امامت قبول کرنے سے انکار کیا، اور برکنا موروں سے لڑتے ہوئے شہید ہوئے۔ انھوں نے فوٹا کے لوگوں کو اپنی مشہور وصیت چھوڑی کہ امامت کبھی موروثی بادشاہت نہ بنے اور جو امام مالدار ہو جائے اسے معزول کر دیا جائے۔"

