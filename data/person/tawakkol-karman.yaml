summary:
  ar: "صحافية وسياسية يمنية ومدافعة عن حقوق الإنسان، وُلدت في محافظة تعز سنة 1979، وشاركت في تأسيس منظمة «صحفيات بلا قيود» سنة 2005 وقادت الاحتجاجات الأسبوعية في صنعاء منذ 2007، ثم برزت وجها عالميا لانتفاضة اليمن سنة 2011، ونالت جائزة نوبل للسلام في العام نفسه مع إلين جونسون سيرليف وليما غبوي، فكانت أول يمنية وأول عربية وثاني مسلمة تنال جائزة نوبل، وتعيش في إسطنبول منذ سيطرة الحوثيين على صنعاء."
  en: "Yemeni journalist, politician and human rights activist, born in Taiz Governorate in 1979. She co-founded Women Journalists Without Chains in 2005 and led weekly protests in Sana'a from 2007, then became the international face of Yemen's 2011 uprising. She received the 2011 Nobel Peace Prize with Ellen Johnson Sirleaf and Leymah Gbowee — the first Yemeni, the first Arab woman and the second Muslim woman to win a Nobel Prize — and has lived in Istanbul since the Houthi takeover of Sana'a."
  ur: "یمنی صحافی، سیاست دان اور انسانی حقوق کی علمبردار، جو 1979 میں محافظہ تعز میں پیدا ہوئیں۔ انہوں نے 2005 میں «صحفیات بلا قیود» کی بنیاد رکھنے میں حصہ لیا اور 2007 سے صنعاء میں ہفتہ وار احتجاج کی قیادت کی، پھر 2011 کی یمنی بغاوت کا عالمی چہرہ بنیں۔ انہیں اسی سال ایلن جانسن سرلیف اور لیما گبووی کے ساتھ نوبل امن انعام ملا — وہ یہ انعام پانے والی پہلی یمنی، پہلی عرب خاتون اور دوسری مسلم خاتون بنیں — اور حوثیوں کے صنعاء پر قبضے کے بعد سے استنبول میں مقیم ہیں۔"
