summary:
  ar: "صحافية وسياسية يمنية ومدافعة عن حقوق الإنسان، وُلدت في محافظة تعز سنة 1979، وشاركت في تأسيس منظمة «صحفيات بلا قيود» سنة 2005 وقادت الاحتجاجات الأسبوعية في صنعاء منذ 2007، ثم برزت وجها عالميا لانتفاضة اليمن سنة 2011، ونالت جائزة نوبل للسلام في العام نفسه مع إلين جونسون سيرليف وليما غبوي، فكانت أول يمنية وأول عربية وثاني مسلمة تنال جائزة نوبل، وتعيش في إسطنبول منذ سيطرة الحوثيين على صنعاء."
  en: "Yemeni journalist, politician and human rights activist, born in Taiz Governorate in 1979. She co-founded Women Journalists Without Chains in 2005 and led weekly protests in Sana'a from 2007, then became the international face of Yemen's 2011 uprising. She received the 2011 Nobel Peace Prize with Ellen Johnson Sirleaf and Leymah Gbowee — the first Yemeni, the first Arab woman and the second Muslim woman to win a Nobel Prize — and has lived in Istanbul since the Houthi takeover of Sana'a."
  ur: "یمنی صحافی، سیاست دان اور انسانی حقوق کی علمبردار، جو 1979 میں محافظہ تعز میں پیدا ہوئیں۔ انہوں نے 2005 میں «صحفیات بلا قیود» کی بنیاد رکھنے میں حصہ لیا اور 2007 سے صنعاء میں ہفتہ وار احتجاج کی قیادت کی، پھر 2011 کی یمنی بغاوت کا عالمی چہرہ بنیں۔ انہیں اسی سال ایلن جانسن سرلیف اور لیما گبووی کے ساتھ نوبل امن انعام ملا — وہ یہ انعام پانے والی پہلی یمنی، پہلی عرب خاتون اور دوسری مسلم خاتون بنیں — اور حوثیوں کے صنعاء پر قبضے کے بعد سے استنبول میں مقیم ہیں۔"
  es: "Periodista, política y activista de derechos humanos yemení, nacida en la gobernación de Taiz en 1979. Cofundó Mujeres Periodistas Sin Cadenas en 2005 y lideró protestas semanales en Saná desde 2007, convirtiéndose posteriormente en el rostro internacional del levantamiento yemení de 2011. Recibió el Premio Nobel de la Paz 2011 junto con Ellen Johnson Sirleaf y Leymah Gbowee —la primera yemení, la primera mujer árabe y la segunda mujer musulmana en ganar un Premio Nobel— y reside en Estambul desde la toma de Saná por los hutíes."
  fr: "Journaliste, femme politique et militante des droits humains yéménite, née dans le gouvernorat de Taïz en 1979, elle a cofondé Femmes journalistes sans chaînes en 2005 et a mené des manifestations hebdomadaires à Sanaa à partir de 2007. Elle est ensuite devenue la figure internationale du soulèvement yéménite de 2011. Elle a reçu le prix Nobel de la paix 2011 conjointement avec Ellen Johnson Sirleaf et Leymah Gbowee – la première Yéménite, la première femme arabe et la deuxième femme musulmane à recevoir un prix Nobel – et vit à Istanbul depuis la prise de contrôle de Sanaa par les Houthis."
  tr: "Yemenli gazeteci, politikacı ve insan hakları savunucusu olan Sherly, 1979'da Taiz Vilayeti'nde doğdu; 2005'te \"Kısıtlamasız Gazeteciler\" örgütünün kuruluşuna katıldı ve 2007'den beri Sana'a'da haftalık protestolara liderlik etti. Daha sonra 2011'de Yemen ayaklanmasının küresel bir figürü haline geldi ve aynı yıl Ellen Johnson Sirleaf ve Lima Gbowee ile birlikte Nobel Barış Ödülü'nü kazandı. Nobel Ödülü alan ilk Yemenli, ilk Arap kadın ve ikinci Müslüman kadın oldu; Husiler Sana'a'yı ele geçirdiğinden beri İstanbul'da yaşıyor."
  id: "Seorang jurnalis, politisi, dan pembela hak asasi manusia Yaman, lahir di Gubernur Taiz pada tahun 1979, ia ikut serta dalam pendirian organisasi \"Journalists Without Limits\" pada tahun 2005 dan memimpin protes mingguan di Sana'a sejak 2007. Ia kemudian menjadi tokoh global dalam pemberontakan Yaman pada tahun 2011 dan memenangkan Hadiah Nobel Perdamaian pada tahun yang sama bersama Ellen Johnson Sirleaf dan Lima Gbowee. Ia menjadi orang Yaman pertama, perempuan Arab pertama, dan perempuan Muslim kedua yang menerima Hadiah Nobel, serta telah tinggal di Istanbul sejak Houthi menguasai Sana'a."
