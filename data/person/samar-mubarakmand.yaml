summary:
  ar: "فيزيائي نووي باكستاني وُلد في راولبندي سنة 1942. عمل في هيئة الطاقة الذرية الباكستانية فرأس مجموعة التشخيص المسؤولة عن قياسات الاختبارات الباردة للأجهزة النووية، وأدار مديرية التطوير التقني، وأسّس اللجنة الوطنية للهندسة والعلوم «نسكوم». يُعرف بأبحاثه في مطيافية غاما وبعمله في برنامج الردع النووي والبرنامج المتكامل للصواريخ."
  en: "Pakistani nuclear physicist born in Rawalpindi in 1942. At the Pakistan Atomic Energy Commission he headed the Diagnostic Group responsible for measurements in the cold tests of nuclear devices, directed the Directorate of Technical Development, and founded the National Engineering and Scientific Commission (NESCOM). He is known for gamma spectroscopy research and his work in the nuclear deterrent and integrated missile programmes."
  ur: "پاکستانی جوہری طبیعیات دان جو 1942ء میں راولپنڈی میں پیدا ہوئے۔ پاکستان جوہری توانائی کمیشن میں وہ ڈائیگناسٹک گروپ کے سربراہ رہے جو جوہری آلات کے سرد ٹیسٹوں کی پیمائش کا ذمہ دار تھا، ڈائریکٹوریٹ آف ٹیکنیکل ڈویلپمنٹ کے ڈائریکٹر رہے، اور قومی انجینئرنگ و سائنسی کمیشن (نیس کوم) کے بانی ہیں۔ وہ گاما سپیکٹروسکوپی کی تحقیق اور جوہری بازدار و مربوط میزائل پروگراموں میں اپنے کام کے لیے جانے جاتے ہیں۔"
