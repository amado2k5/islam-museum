  ar: "مصطفى سليمان (وُلد في أغسطس 1984 في لندن) رائد أعمال بريطاني في الذكاء الاصطناعي من أصل سوري، شارك في تأسيس ديب مايند سنة 2010 وإنفليكشن إيه آي سنة 2022، وأصبح الرئيس التنفيذي لقطاع الذكاء الاصطناعي في مايكروسوفت في مارس 2024، وهو مؤلف كتاب «الموجة القادمة» (2023)."
