id: person/baliq
class: person
label: { ar: "بليق" }
summary:
  ar: "صاحب مؤنس المظفر وأثق أصحابه؛ كان وابنه علي من قواده ويُقبّل يده ويخدمه، واتفق مع ابن مقلة وسيماء على خلع القاهر فأظهروا أن أبا طاهر القرمطي ورد الكوفة ليخرجوا بالجيش، فقبض عليهما القاهر أول شعبان سنة 321هـ مع مؤنس، ثم قتلهم في شعبان فذبح ابنه علياً وحُمل رأسه في طشت بين يديه حتى دخل عليه فلما رآه بكى وأخذه يقبّله ويترشفه فأمر به فذُبح أيضاً وحُمل رأسه مع رأس ابنه إلى مؤنس فلما رآهما تشاغل واسترجع ولعن قاتلهما فذُبح هو أيضاً وجُعل رأسه في طشت وطيف بالرؤوس في جانبي بغداد ونودي عليها هذا جزاء من يخون الإمام ويسعى في فساد دولته ثم أعيدت إلى خزانة الرؤوس كما جرت العادة {cite:kamil-ibn-al-athir p. 190-195}."
  en: "Mu'nis al-Muzaffar's chief officer; seized with him in the fake-Qarmatian ruse of 321, then slaughtered — his son's head carried to him in a basin, his own carried with it to Mu'nis, all three heads paraded round Baghdad then returned to the treasury of heads {cite:kamil-ibn-al-athir p. 190-195}."
  es: "El oficial principal de Mu'nis al-Muzaffar; fue apresado junto con él en la falsa estratagema qarmatiana del año 321, y luego sacrificado: la cabeza de su hijo fue llevada a él en una palangana, la suya propia fue llevada con ella a Mu'nis, las tres cabezas fueron paseadas por Bagdad y luego devueltas al tesoro de cabezas {cite:kamil-ibn-al-athir p. 190-195}."
  fr: "Le principal officier de Mu'nis al-Muzaffar; capturé avec lui lors de la fausse ruse qarmate de 321, puis massacré — la tête de son fils lui fut apportée dans un bassin, la sienne emportée avec elle à Mu'nis, les trois têtes furent promenées dans Bagdad puis retournées au trésor des têtes {cite:kamil-ibn-al-athir p. 190-195}."
  ur: "معنیس المظفر کا چیف آفیسر؛ اس کے ساتھ 321 کے جعلی قرمطین میں پکڑا گیا، پھر اسے ذبح کر دیا گیا- اس کے بیٹے کا سر ایک بیسن میں اس کے پاس لے جایا گیا، اس کا اپنا اسے معنیس کے پاس لے گیا، تینوں سر بغداد کے گرد چکر لگائے پھر سروں کے خزانے میں واپس آئے۔ 190-195}۔"
  tr: "Mu'nais al-Muzaffar'ın yoldaşı ve en güvendiği yoldaşı; o ve oğlu Ali komutanları arasındaydı, elini öptüler ve ona hizmet ettiler. İbn Muqla ve Sima ile el-Kahir'i tahttan indirmeyi kabul ettiler ve Ebu Tahir el-Karmati'nin Kufa'ya geri dönüp bir ordu gönderdiğini gösterdiler. El-Kahir, 321 Hicri yılında Şaban ayının ilk gününde Mu'anislerle birlikte onları yakaladı, sonra Şaban'da öldürdü. Oğlu Ali katledildi ve başı önünde bir leğene kondu, ta ki yanına girene kadar. Onu görünce ağladı, onu öpmek ve yudumlamak için götürdü. Onun da katledilmesini emretti ve başını oğlunun başıyla birlikte Mu'nis'e taşıdı. Onları görünce dikkatleri dağıldı O kurtarıldı ve katillerine lanetlendi, bu yüzden o da katledildi, başı bir leğene kondu ve başları Bağdat'ın yanlarına sarıldı. Bu, İmam'a ihanet edenlerin ve devletini yozlaştırmaya çalışanların cezası olarak ilan edildi. Sonra başlar her zamanki gibi hazineye geri verildi {cite:kamil-ibn-al-athir s. 190-195}."
  id: "Mu'nais adalah teman dan sahabat paling dipercaya Mu'nais al-Muzaffar; dia dan putranya Ali termasuk di antara para komandannya, mencium tangannya, dan melayaninya. Dia sepakat dengan Ibn Muqla dan Sima untuk menggulingkan al-Qahir, dan mereka menunjukkan bahwa Abu Tahir al-Qarmati telah kembali ke Kufa untuk mengirim tentara. Al-Qahir menangkap mereka pada tanggal pertama Sha'ban tahun 321 H bersama Mu'anis, lalu membunuh mereka di Sha'ban. Putranya Ali dibantai, dan kepalanya diletakkan di sebuah baskom di hadapannya sampai dia masuk ke arahnya. Ketika dia melihatnya, dia menangis, membawanya untuk dicium dan diminum. Dia memerintahkan agar dia juga disembelih, dan membawa kepala anaknya bersama kepala putranya ke Mu'ni. Ketika dia melihat mereka, mereka menjadi terganggu Ia diselamatkan dan dikutuk pembunuh mereka, sehingga ia juga dibantai, kepalanya diletakkan di baskom, dan kepalanya dibungkus di sisi Baghdad. Ini dinyatakan sebagai hukuman bagi mereka yang mengkhianati Imam dan berusaha merusak negaranya. Kemudian kepala-kepala itu dikembalikan ke kas seperti biasa {cite:kamil-ibn-al-athir hlm. 190-195}."
