summary:
  ar: "صاحب مؤنس المظفر وأثق أصحابه؛ كان وابنه علي من قواده ويُقبّل يده ويخدمه، واتفق مع ابن مقلة وسيماء على خلع القاهر فأظهروا أن أبا طاهر القرمطي ورد الكوفة ليخرجوا بالجيش، فقبض عليهما القاهر أول شعبان سنة 321هـ مع مؤنس، ثم قتلهم في شعبان فذبح ابنه علياً وحُمل رأسه في طشت بين يديه حتى دخل عليه فلما رآه بكى وأخذه يقبّله ويترشفه فأمر به فذُبح أيضاً وحُمل رأسه مع رأس ابنه إلى مؤنس فلما رآهما تشاغل واسترجع ولعن قاتلهما فذُبح هو أيضاً وجُعل رأسه في طشت وطيف بالرؤوس في جانبي بغداد ونودي عليها هذا جزاء من يخون الإمام ويسعى في فساد دولته ثم أعيدت إلى خزانة الرؤوس كما جرت العادة {cite:kamil-ibn-al-athir p. 190-195}."
  en: "Mu'nis al-Muzaffar's chief officer; seized with him in the fake-Qarmatian ruse of 321, then slaughtered — his son's head carried to him in a basin, his own carried with it to Mu'nis, all three heads paraded round Baghdad then returned to the treasury of heads {cite:kamil-ibn-al-athir p. 190-195}."
