summary:
  ar: "خطاط من سادات هراة في العهد الصفوي، أتقن التعليق والنستعليق، وتعلم الشكسته من شاملو ثم هذّبه ووضع قواعده حتى سُمّي «خط شفيعا» {cite:salim-tarikh-khatt-o-khattatin-2001 p. 152}."
  en: "Calligrapher from a well-known Sayyid family of Herat in the Safavid period, master of ta'liq and nasta'liq, who learned shikasta from Shamlu, refined it and fixed its rules, so that it came to be called 'Shafi'a script' {cite:salim-tarikh-khatt-o-khattatin-2001 p. 152}."
  ur: "صفوی عہد میں ہرات کے مشہور سادات خاندان کے خطاط، تعلیق اور نستعلیق کے ماہر، جنہوں نے شاملو سے شکستہ سیکھا، اسے سنوارا اور اس کے قواعد مقرر کیے، یہاں تک کہ اسے «خطِ شفیعا» کہا جانے لگا {cite:salim-tarikh-khatt-o-khattatin-2001 p. 152}۔"
