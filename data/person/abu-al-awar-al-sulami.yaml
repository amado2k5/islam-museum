summary:
  ar: "أحد قواد معاوية بصفين، وكله بالشريعة على الفرات مع أربعين ألفاً وكان على مقدمته فحال بين جيش علي والماء حتى قال عمرو بن العاص لمعاوية إن علياً لا يموت عطشاً هو وتسعون ألفاً وسيوفهم على عواتقهم فقال معاوية لا والله أو يموتوا عطشاً كما مات عثمان {cite:muruj-al-dhahab p. 667-668}."
  en: "Mu'awiya's commander holding Siffin's water-gate — forty thousand men blocking Ali's army from the Euphrates until the night-charge broke through {cite:muruj-al-dhahab p. 667-668}."
  fr: "Le commandant de Mu'awiya qui tenait l'accès à l'eau à Siffin — quarante mille hommes barrant l'Euphrate à l'armée d'Ali jusqu'à ce que la charge nocturne passe {cite:muruj-al-dhahab p. 667-668}."
  es: "El comandante de Mu'awiya controlaba la puerta de agua de Siffin: cuarenta mil hombres impedían que el ejército de Ali llegara al Éufrates hasta que la carga nocturna logró abrirse paso {cite:muruj-al-dhahab p. 667-668}."
  ur: "معاویہ کا سپہ سالار صفین کے پانی کے دروازے پر تھا - چالیس ہزار آدمی فرات سے علی کی فوج کو روکتے رہے یہاں تک کہ رات کا چارج ختم ہو گیا۔ 667-668}۔"
  tr: "Siffin'de Muaviye'nin komutanlarından biri olan ve kırk bin adamıyla Fırat Nehri'nin başında bulunan Amr ibn al-As, Ali'nin ordusunun su bulmasını engelliyordu. Amr ibn al-As, Muaviye'ye Ali'nin, omuzlarında kılıçlarıyla doksan bin adamıyla birlikte susuzluktan ölmeyeceğini söyledi. Muaviye, \"Hayır, Allah'a yemin ederim ki ölmezler, yoksa Osman gibi susuzluktan ölürler.\" dedi. {kaynak: Muruj-al-Dhahab s. 667-668}"
  id: "Salah satu komandan Muawiyah di Siffin, dan dia bertanggung jawab atas Sungai Eufrat dengan empat puluh ribu orang, dan dia berada di garis depan, sehingga dia mencegah pasukan Ali mendapatkan air, sampai Amr ibn al-As berkata kepada Muawiyah bahwa Ali tidak akan mati kehausan, dia dan sembilan puluh ribu orang dengan pedang di pundak mereka. Muawiyah berkata, “Tidak, demi Allah, atau mereka akan mati kehausan seperti Utsman mati.” {kutipan:muruj-al-dhahab hlm. 667-668}."
