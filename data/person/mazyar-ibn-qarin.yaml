class: person
label: { ar: "مازيار بن قارن", en: "Mazyar ibn Qarin", es: "Mazyar ibn Qarin", fr: "Mazyar ibn Qarin", ur: "مزیار بن قرین" }
summary:
  ar: "مازيار بن قارن أصبهبذ طبرستان؛ افتتح مع محمد بن موسى بن حفص بن عمر بن العلاء جبال شروين أمنع جبال طبرستان في خلافة المأمون فولاه المأمون أعمال طبرستان والرويان ودنباوند وسمّاه محمداً وجعل له مرتبة الأصبهبذ فأقرّه المعتصم ثم كفر وغدر بعد ست سنين فأخذته حيلة أخيه قوهيار مع الحسن بن الحسين وحمل إلى سر من رأى سنة خمس وعشرين ومائتين فضرب بالسياط حتى مات وصلب مع بابك على العقبة. وعند المسعودي ضرب بالسوط حتى مات ثم شهر وصلب إلى جانب بابك ومالت خشبته إلى خشبته فتدانت أجسامهما وكان قد رغب المعتصم في أموال كثيرة إن من عليه بالبقاء فأبى وتمثل إن الأسود أسود الغيل همتها يوم الكريهة في المسلوب لا السلب {cite:muruj-al-dhahab p. 451}"
  en: "Mazyar ibn Qarin, Ispahbadh of Tabaristan; he conquered the impregnable Shirwin mountains with Muhammad ibn Musa under al-Ma'mun, who named him Muhammad and gave him the Ispahbadh's rank over Tabaristan, al-Ruwayan and Dumbawand. Al-Mu'tasim confirmed him; six years in he apostatized and broke faith — taken by his brother Quhyar's ambush-ruse with al-Hasan ibn al-Husayn, carried to Samarra in 225, flogged to death and crucified beside Babak."
  es: "Mazyar ibn Qarin, Ispahbadh de Tabaristán, conquistó las inexpugnables montañas Shirwin junto a Muhammad ibn Musa bajo el mando de al-Ma'mun, quien lo bautizó como Muhammad y le otorgó el rango de Ispahbadh sobre Tabaristán, al-Ruwayan y Dumbawand. Al-Mu'tasim lo confirmó; seis años después, apostató y rompió su fe. Fue capturado mediante una emboscada de su hermano Quhyar junto con al-Hasan ibn al-Husayn, llevado a Samarra en el año 225, azotado hasta la muerte y crucificado junto a Babak."
  fr: "Mazyar ibn Qarin, Ispahbadh du Tabaristan, conquit les imprenables montagnes de Shirwin avec Muhammad ibn Musa sous le commandement d'al-Ma'mun, qui le nomma Muhammad et lui conféra le titre d'Ispahbadh sur le Tabaristan, al-Ruwayan et Dumbawand. Al-Mu'tasim le confirma. Six ans plus tard, il apostasia et renonça à sa foi: capturé par une embuscade tendue par son frère Quhyar et al-Hasan ibn al-Husayn, il fut conduit à Samarra en 225, flagellé à mort et crucifié aux côtés de Babak."
  ur: "مزیار بن قرین، طبرستان کا اصفہ آباد؛ اس نے محمد بن موسیٰ کے ساتھ المامون کے ماتحت شیروین پہاڑوں کو ناقابل تسخیر فتح کیا، جس نے اس کا نام محمد رکھا اور اسے طبرستان، الرویان اور دمباونڈ پر اسپہ باد کا درجہ دیا۔ المعتصم نے اس کی تصدیق کی۔ چھ سال میں اس نے مرتد کیا اور ایمان توڑ دیا - اس کے بھائی کوہیار کے الحسن بن الحسین کے ساتھ گھات لگا کر 225 میں سامرا لے جایا گیا، کوڑے مارے گئے اور بابک کے پاس مصلوب کیا گیا۔"
  tr: "Tabaristan'ın Maziyar ibn Qaranı Asbahbdh; Muhammed ibn Musa ibn Hafs ibn Umar ibn Al-Ala' ile birlikte Şirwin Dağları'nı fethetti ve el-Ma'mun halifeliği sırasında Tabaristan dağlarını tahkim etti. Al-Ma'mun onu Tabaristan, Ruyan ve Dunbayvand'ın valileri olarak atadı, Muhammed adını verdi ve Asbahbadh rütbesi verdi. Al-Mu'tasim onu onayladı, ardından altı yıl sonra inanmadığını ilan etti ve ihanete uğradı. Kardeşi Quhyyar'ın al-Hasan ibn al-Husayn ile kurnazlığı onu aldı ve 225 Hicri yılında görenlerin sırrına götürüldü. Ölümüne kadar kırbaçlandı ve Akabe'deki Babak'ta çarmıha gerildi. El-Mes'udi'ye göre, ölene kadar kırbaçlandı, sonra kapınızın yanında çarmıha gerildi ve odunu onun tahtasına yaslandı, böylece bedenleri birbirine yakın oldu. El-Mutasim büyük bir para istemişti ama kalmayı reddetti. Ghal-ghayb'in siyahları hapsedildi, utanç günündeki hırsları yağmalamada değil, çalınmakta idi {atıf:muruj-al-dhahab s. 451}"
  id: "Maziyar ibn Qaran Asbahbdh dari Tabaristan; ia menaklukkan Pegunungan Shirwin bersama Muhammad ibn Musa ibn Hafs ibn Umar ibn Al-Ala' dan memperkuat pegunungan Tabaristan selama kekhalifahan al-Ma'mun. Al-Ma'mun mengangkatnya sebagai gubernur Tabaristan, Ruyan, dan Dunbayvand, menamainya Muhammad, dan memberinya gelar Asbahbadh. Al-Mu'tasim menyetujuinya, lalu menyatakan tidak percaya dan mengkhianati setelah enam tahun. Kecerdikan saudaranya Quhyyar dengan al-Hasan ibn al-Husayn membawanya dan ia dibawa ke rahasia orang-orang yang melihat pada tahun 225 H. Ia dicambuk hingga meninggal dan disalibkan di Babak pada Aqaba. Menurut al-Mas'udi, dia dicambuk sampai mati, lalu disalibkan di samping pintumu, dan kayunya bersandar pada kayunya, sehingga tubuh mereka berdekatan. Al-Mu'tasim menginginkan sejumlah besar uang, tetapi dia menolak tinggal. Singa hitam ghal-ghayb dipenjara, ambisi mereka pada hari aib adalah pada yang dicuri, bukan pada penjarahan {cite:muruj-al-dhahab hlm. 451}"
