label: { ar: "مازيار بن قارن", en: "Mazyar ibn Qarin" }
summary:
  ar: "مازيار بن قارن أصبهبذ طبرستان؛ افتتح مع محمد بن موسى بن حفص بن عمر بن العلاء جبال شروين أمنع جبال طبرستان في خلافة المأمون فولاه المأمون أعمال طبرستان والرويان ودنباوند وسمّاه محمداً وجعل له مرتبة الأصبهبذ فأقرّه المعتصم ثم كفر وغدر بعد ست سنين فأخذته حيلة أخيه قوهيار مع الحسن بن الحسين وحمل إلى سر من رأى سنة خمس وعشرين ومائتين فضرب بالسياط حتى مات وصلب مع بابك على العقبة."
  en: "Mazyar ibn Qarin, Ispahbadh of Tabaristan; he conquered the impregnable Shirwin mountains with Muhammad ibn Musa under al-Ma'mun, who named him Muhammad and gave him the Ispahbadh's rank over Tabaristan, al-Ruwayan and Dumbawand. Al-Mu'tasim confirmed him; six years in he apostatized and broke faith — taken by his brother Quhyar's ambush-ruse with al-Hasan ibn al-Husayn, carried to Samarra in 225, flogged to death and crucified beside Babak."
