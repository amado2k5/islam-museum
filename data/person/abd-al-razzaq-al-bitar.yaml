summary:
  ar: "عبد الرزاق بن حسن البيطار الميداني الدمشقي (ت ١٣٣٥هـ/١٩١٧م)؛ عالم بالدين ضليع في الأدب والتاريخ والموسيقى. مولده ووفاته في دمشق. حفظ القرآن في صباه ومهر في علومه وكان حسن الصوت وله نظم، واشتغل في الأدب مدة واقتصر في آخر أمره على علمي الكتاب والسنة، وكان من دعاة الإصلاح في الإسلام، وقوراً حسن المفاكهة طيب النفس. من كتبه «حلية البشر في تاريخ القرن الثالث عشر» ترجم فيه معاصريه {cite:al-aalam tarjama}."
  en: "Abd al-Razzaq al-Bitar (d. 1335 AH/1917 CE) — Damascene reformist scholar and author of Hilyat al-Bashar, the biographical dictionary of the thirteenth century AH {cite:al-aalam tarjama}."
