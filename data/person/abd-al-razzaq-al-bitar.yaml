summary:
  ar: "عبد الرزاق بن حسن البيطار الميداني الدمشقي ⁦(ت ١٣٣٥هـ/١٩١٧م)⁩؛ عالم بالدين ضليع في الأدب والتاريخ والموسيقى. مولده ووفاته في دمشق. حفظ القرآن في صباه ومهر في علومه وكان حسن الصوت وله نظم، واشتغل في الأدب مدة واقتصر في آخر أمره على علمي الكتاب والسنة، وكان من دعاة الإصلاح في الإسلام، وقوراً حسن المفاكهة طيب النفس. من كتبه «حلية البشر في تاريخ القرن الثالث عشر» ترجم فيه معاصريه {cite:al-aalam tarjama}."
  en: "Abd al-Razzaq al-Bitar (d. 1335 AH/1917 CE) — Damascene reformist scholar and author of Hilyat al-Bashar, the biographical dictionary of the thirteenth century AH {cite:al-aalam tarjama}."
  fr: "Abd al-Razzaq al-Bitar (m. 1335 H/1917 ap. J.-C.) — savant réformiste damascène et auteur de la Hilyat al-Bashar, le dictionnaire biographique du XIIIe siècle de l'hégire {cite:al-aalam tarjama}."
  es: "Abd al-Razzaq al-Bitar (m. 1335 AH/1917 CE) — Erudito reformista damasceno y autor de Hilyat al-Bashar, el diccionario biográfico del siglo XIII AH {cite:al-aalam tarjama}."
  ur: "عبد الرزاق البطار ⁦(متوفی 1335 ہجری/1917 عیسوی)⁩ ایک دمشقی اصلاح پسند عالم اور تیرھویں صدی ہجری کی سوانحی لغت 'حلیۃ البشر' کے مصنف تھے۔"
  tr: "Abdülrazzak ibn Hasan el-Beytar el-Meydani el-Dimaşki (ö. 1335 Hicri/1917 Miladi); edebiyat, tarih ve müzikte bilgili bir din alimiydi. Şam'da doğdu ve öldü. Gençliğinde Kur'an'ı ezberledi ve ilimlerde üstün başarı gösterdi. Güzel bir sesi vardı ve şiirler yazdı. Bir süre edebiyatla ilgilendi, ancak son yıllarında tamamen Kur'an ve Sünnet ilmine odaklandı. İslam'da reformun savunucusu, vakarlı, zeki ve iyi huylu bir insandı. Kitapları arasında, çağdaşlarının biyografilerini yazdığı \"Hilyat el-Beşar fi Tarikh el-Karn el-Talith Aşar\" (On Üçüncü Yüzyıl Tarihinde İnsanlığın Süsü) bulunmaktadır."
  id: "Abd al-Razzaq ibn Hasan al-Baytar al-Maydani al-Dimashqi (wafat 1335 H/1917 M); seorang ulama yang mahir dalam bidang sastra, sejarah, dan musik. Ia lahir dan wafat di Damaskus. Ia menghafal Al-Quran di masa mudanya dan unggul dalam ilmu-ilmunya. Ia memiliki suara yang indah dan menggubah puisi. Ia sempat berkecimpung dalam bidang sastra, tetapi di tahun-tahun terakhirnya, ia hanya fokus pada studi Al-Quran dan Sunnah. Ia adalah pendukung reformasi dalam Islam, bermartabat, cerdas, dan berwatak baik. Di antara buku-bukunya adalah \"Hilyat al-Bashar fi Tarikh al-Qarn al-Thalith Ashar\" (Perhiasan Umat Manusia dalam Sejarah Abad Ketigabelas), di mana ia menulis biografi para tokoh sezamannya."
