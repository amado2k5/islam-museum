summary:
  ar: "سناتورة ومربية وداعية سلام فلبينية مسلمة ⁦(14 سبتمبر 1930 – 28 نوفمبر 2024)⁩؛ وُلدت في سيسي بأرخبيل سولو وتخرّجت في جامعة الفلبين ديليمان، وخدمت في مجلس مقاطعة سولو ⁦(1971–1976)⁩ ثم صارت أول امرأة مسلمة تُنتخب لعضوية مجلس الشيوخ الفلبيني ⁦(1987–1995)⁩، وأسّست مؤسسة «مغباسّا كيتا» لمحو الأمية وشاركت في مساعي السلام التي أفضت إلى اتفاق 1996، وتوفيت في كيزون سيتي عن 94 عامًا."
  en: "Filipina Muslim senator, educator and peace advocate ⁦(14 September 1930 – 28 November 2024)⁩. Born in Siasi in the Sulu archipelago and a graduate of the University of the Philippines Diliman, she served on the Sulu Provincial Board ⁦(1971–1976)⁩ before becoming the first Muslim woman elected to the Senate of the Philippines ⁦(1987–1995)⁩; she founded the Magbassa Kita literacy foundation and took part in the peace work behind the 1996 settlement, dying in Quezon City aged 94."
  ur: "فلپائنی مسلم سینیٹر، معلمہ اور امن کی علمبردار ⁦(14 ستمبر 1930 – 28 نومبر 2024)⁩۔ سولو جزائر کے شہر سیاسی میں پیدا ہوئیں اور یونیورسٹی آف فلپائن دیلیمان سے فارغ التحصیل ہوئیں؛ سولو صوبائی بورڈ ⁦(1971–1976)⁩ میں رہیں اور پھر فلپائن کی سینیٹ ⁦(1987–1995)⁩ میں منتخب ہونے والی پہلی مسلم خاتون بنیں؛ خواندگی کی تنظیم «ماگباسا کیتا» کی بانی اور 1996 کے صلح معاہدے کی سرگرمیوں میں شریک رہیں؛ کویزون سٹی میں 94 برس کی عمر میں انتقال ہوا۔"
