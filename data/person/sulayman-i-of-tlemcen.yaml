summary:
  ar: "سليمان بن عبد الله بن الحسن بن الحسن بن علي بن أبي طالب، أخو إدريس، يذكر الصفدي أنه خرج بفخ ثم ينقل رواية البيهقي أنه نجا ودخل المغرب وانتهى إلى تلمسان حيث أكرمه بنو أخيه، وأن ذريته حكمت الغرب الأوسط وأشهرهم حمزة بن سليمان."
  en: "Sulayman ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, brother of Idris; al-Safadi says he went out at Fakhkh, then reports al-Bayhaqi's account that he escaped, entered the Maghrib and came to Tlemcen, where his brother's sons honoured him; his descendants held rule in the Central Maghrib, the best known being Hamza ibn Sulayman."
  es: "Sulayman ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, hermano de Idris; al-Safadi dice que salió en Fakhkh, luego relata la versión de al-Bayhaqi de que escapó, entró en el Magreb y llegó a Tlemcen, donde los hijos de su hermano lo honraron; sus descendientes gobernaron en el Magreb Central, siendo el más conocido Hamza ibn Sulayman."
  fr: "Sulayman ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, frère d'Idris; al-Safadi dit qu'il est sorti à Fakhkh, puis rapporte le récit d'al-Bayhaqi selon lequel il s'est échappé, est entré au Maghreb et est arrivé à Tlemcen, où les fils de son frère l'ont honoré; ses descendants ont régné sur le Maghreb central, le plus connu étant Hamza ibn Sulayman."
  ur: "سلیمان بن عبداللہ ابن الحسن ابن الحسن ابن علی ابن ابی طالب، ادریس کے بھائی؛ الصفادی کہتے ہیں کہ وہ فخ میں نکلے، پھر البیحقی کے بیان میں کہا گیا ہے کہ وہ فرار ہو گیا، مغرب میں داخل ہوا اور تلمسن آیا، جہاں اس کے بھائی کے بیٹوں نے اس کی عزت کی۔ اس کی اولاد نے وسطی مغرب میں حکمرانی کی، سب سے زیادہ مشہور حمزہ بن سلیمان تھے۔"
  tr: "Süleyman ibn Abdullah ibn el-Hasan ibn el-Hasan ibn Ali ibn Abi Talib, İdris'in kardeşi. El-Safadi, bir tuzakla yola çıktığını belirtir, ardından el-Bayhaqi'nin rivayetini aktarır; hayatta kaldığını, Mağrip'e girdiğini ve sonunda Tlemcen'e gittiğini, burada yeğenlerinin onu onurlandırdığını anlatır. Soyundan gelenler Orta Batı'yı yönetmiştir; en ünlüsü Hamza bin Süleyman'dır."
  id: "Sulayman ibn Abdullah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, saudara Idris. Al-Safadi menyebutkan bahwa ia berangkat dengan jebakan, lalu menyampaikan kisah al-Bayhaqi bahwa ia selamat, memasuki Maghreb, dan berakhir di Tlemcen, di mana keponakannya menghormatinya. Keturunannya memerintah Midwest, yang paling terkenal adalah Hamza ibn Sulayman."
