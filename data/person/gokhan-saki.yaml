summary:
  ar: "كيك بوكسر تركي هولندي ومقاتل فنون قتالية مختلطة وُلد في سخيدام سنة 1983 لأبوين تركيين من قارص. فاز ببطولة كي-وان العالمية في هاواي سنة 2008، وكان أول بطل لغلوري في وزن خفيف الثقيل سنة 2014، ثم خاض نزالين في بطولة القتال النهائي (UFC)."
  en: "Turkish-Dutch kickboxer and mixed martial artist born in Schiedam in 1983 to Turkish parents from Kars. He won the K-1 World Grand Prix 2008 tournament in Hawaii, became the inaugural Glory Light Heavyweight Champion in 2014, and later fought twice in the UFC."
