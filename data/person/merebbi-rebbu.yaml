summary:
  ar: "الشيخ محمد مصطفى مربيه ربه بن ماء العينين (1881–1942)، علامة ومجاهد مغربي صحراوي، الولد الثاني عشر للشيخ ماء العينين. أسس زاوية هصباوة بصبويا سنة 1913، وبعد وفاة أخيه أحمد الهيبة سنة 1919 بُويع في مؤتمر كردوس قائدًا وإمامًا للمجاهدين، فقاد المقاومة ضد فرنسا في سوس والأطلس الصغير ثلاثة وعشرين عامًا حتى سقطت كردوس سنة 1934، فانسحب إلى الصحراء الإسبانية وأسس زاوية طرفاية (1937) وتوفي بتافودارت سنة 1942. خلّف مؤلفات كثيرة في التصوف والفقه والطب والشعر والتاريخ."
  en: "Shaykh Muhammad Mustafa Murabbih Rabbuh ibn Ma al-'Aynayn (1881–1942), Moroccan-Saharan scholar and mujahid, the twelfth son of Shaykh Ma al-'Aynayn. He founded the zawiya of Hasbawa at Sbouya in 1913, and on his brother Ahmed al-Hiba's death in 1919 he was given allegiance at the Kerdous conference as leader and imam of the mujahidin; he then led the resistance to France in the Souss and the Anti-Atlas for twenty-three years, until Kerdous fell in 1934, whereupon he withdrew to the Spanish Sahara, founded the zawiya of Tarfaya (1937), and died at Tafoudart in 1942. He left many works on Sufism, fiqh, medicine, poetry and history."
  ur: "شیخ محمد مصطفیٰ مربيہ ربہ بن ماء العینین (1881–1942)، مغربی صحرائی عالم اور مجاہد، شیخ ماء العینین کے بارہویں بیٹے۔ انھوں نے 1913ء میں صبویا میں زاویہ ہصباوہ قائم کیا، اور 1919ء میں بھائی احمد الہیبہ کی وفات پر کاردوس کی کانفرنس میں انھیں مجاہدین کا قائد و امام منتخب کیا گیا؛ پھر انھوں نے سوس اور صغیر اطلس میں فرانس کے خلاف تئیس سال مزاحمت کی قیادت کی، یہاں تک کہ 1934ء میں کاردوس سقوط پذیر ہوا، تو وہ ہسپانوی صحارا چلے گئے، طرفایہ کا زاویہ قائم کیا (1937ء) اور 1942ء میں تافودارت میں وفات پائی۔ انھوں نے تصوف، فقہ، طب، شعر اور تاریخ پر بہت سی کتابیں چھوڑیں۔"
