summary:
  ar: "أبو مسلم، ويقال أبو عمرو، عبيدة بن عمرو السلماني المرادي الهمداني؛ أسلم قبل وفاة النبي بسنتين ولم يره، ومات سنة اثنتين وسبعين، وقال أبو إسحاق إنه لم يكن بالكوفة أعلم بالفريضة منه ومن الحارث الأعور {cite:tabaqat-fuqaha-abbas-1981 p. 43}."
  tr: "Ebu Müslim, diğer adıyla Ebu Amr, Ubeyde bin Amr el-Selmani el-Murad el-Hamdani'dir; Peygamber'in ölümünden iki yıl önce İslam'ı benimsemiş ve onu görmemiş, yetmiş iki yaşında vefat etmiştir. Ebu İshaq, Kufe'de namaz hakkında kendisinden veya el-Haris el-A'war'dan daha bilgili kimsenin olmadığını söylemiştir {atıf:tabaqat-fuqaha-abbas-1981, s. 43}."
  id: "Abu Muslim, juga disebut Abu Amr, adalah Ubaidah ibn Amr al-Salmani al-Muradi al-Hamdani; ia memeluk Islam dua tahun sebelum wafatnya Nabi dan tidak melihatnya, dan wafat pada tahun tujuh puluh dua. Abu Ishaq berkata bahwa tidak ada seorang pun di Kufa yang lebih memahami doa wajib daripada dirinya atau al-Harith al-A'war {cite:tabaqat-fuqaha-abbas-1981, hlm. 43}."
