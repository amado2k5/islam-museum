summary:
  ar: "إسكندر السادس، بابا روما بعد إينوسنت الثامن؛ ينقل الصلابي أن الأمير جم انتقل إليه بعد موت سلفه فلم يُبق عليه كثيراً حيث قُتل، واتهمت كتب التاريخ في ذلك بايزيد الثاني الذي تخلص من خطر أخيه — وهو اتهام ينقله الكتاب عن المؤرخين {cite:dawlat-uthmaniyya-salabi p. 164}. ويذكر أن إسكندر السادس أقام بناءً على طلب البنادقة حلفاً ضد العثمانيين ضم فرنسا وإسبانيا بعد استيلائهم على لبانتو {cite:dawlat-uthmaniyya-salabi p. 173}."
  en: "Alexander VI, pope after Innocent VIII; al-Salabi relays that Prince Cem passed to him on Innocent's death and was killed soon after — the chronicles, as the book reports, accusing Bayezid II of ridding himself of his brother {cite:dawlat-uthmaniyya-salabi p. 164}. The same pope, at Venice's request, raised a league of France and Spain against the Ottomans after Lepanto fell {cite:dawlat-uthmaniyya-salabi p. 173}."
