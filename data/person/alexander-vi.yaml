gender: male
roles: [religious-leader]
summary:
  ar: "إسكندر السادس، بابا روما بعد إينوسنت الثامن؛ ينقل الصلابي أن الأمير جم انتقل إليه بعد موت سلفه فلم يُبق عليه كثيراً حيث قُتل، واتهمت كتب التاريخ في ذلك بايزيد الثاني الذي تخلص من خطر أخيه — وهو اتهام ينقله الكتاب عن المؤرخين {cite:dawlat-uthmaniyya-salabi p. 164}. ويذكر أن إسكندر السادس أقام بناءً على طلب البنادقة حلفاً ضد العثمانيين ضم فرنسا وإسبانيا بعد استيلائهم على لبانتو {cite:dawlat-uthmaniyya-salabi p. 173}."
  en: "Alexander VI, pope after Innocent VIII; al-Salabi relays that Prince Cem passed to him on Innocent's death and was killed soon after — the chronicles, as the book reports, accusing Bayezid II of ridding himself of his brother {cite:dawlat-uthmaniyya-salabi p. 164}. The same pope, at Venice's request, raised a league of France and Spain against the Ottomans after Lepanto fell {cite:dawlat-uthmaniyya-salabi p. 173}."
  fr: "Alexandre VI, pape après Innocent VIII ; al-Salabi rapporte que le prince Cem lui est passé à la mort d'Innocent et a été tué peu de temps après - les chroniques, comme le rapporte le livre, accusant Bayezid II de se débarrasser de son frère {cite:dawlat-uthmaniyya-salabi p. 164}. Le même pape, à la demande de Venise, a soulevé une ligue de France et d'Espagne contre les Ottomans après la chute de Lépante {cite:dawlat-uthmaniyya-salabi p. 173}."
  es: "Alejandro VI, papa después de Inocencio VIII; al-Salabi relata que el príncipe Cem pasó a su cargo tras la muerte de Inocencio y fue asesinado poco después; las crónicas, como relata el libro, acusan a Bayezid II de haberse deshecho de su hermano {cite:dawlat-uthmaniyya-salabi p. 164}. El mismo papa, a petición de Venecia, formó una liga de Francia y España contra los otomanos tras la caída de Lepanto {cite:dawlat-uthmaniyya-salabi p. 173}."
  ur: "الیگزینڈر ششم، معصوم ہشتم کے بعد پوپ؛ الصلابی نے بیان کیا کہ شہزادہ سیم انوسنٹ کی موت کے بعد ان کے پاس گیا اور اس کے فوراً بعد اسے قتل کر دیا گیا - جیسا کہ کتاب کی رپورٹ کے مطابق، بایزید ثانی پر الزام لگایا گیا ہے کہ اس نے اپنے بھائی سے جان چھڑائی۔ 164}۔ اسی پوپ نے وینس کی درخواست پر لیپینٹو کے گرنے کے بعد عثمانیوں کے خلاف فرانس اور اسپین کی ایک لیگ بنائی۔ 173}۔"
  tr: "Innocent VIII'den sonra Roma Papası olan Alexander VI; Al-Salabi, Prens Cem'in selefinin ölümünden sonra oraya taşındığını ve bu yüzden öldürüldüğü için uzun kalmadığını bildirir. Tarih kitapları, Bayezid II'yi kardeşinin tehlikesini ortadan kaldırarak suçlar—bu suçlama tarihçiler tarafından da aktarılır {cite:dawlat-uthmaniyya-salabi s. 164}. Alexander VI'nın, Venediklilerin isteği üzerine, Bantu'ları ele geçirdikten sonra Fransa ve İspanya'yı Osmanlılara ilhak ederek onlara karşı bir ittifak kurduğu belirtilir {cite:dawlat-uthmaniyya-salabi, s. 173}."
  id: "Alexander VI, Paus Roma setelah Innocent VIII; Al-Salabi melaporkan bahwa Pangeran Cem pindah ke sana setelah kematian pendahulunya, sehingga ia tidak lama tinggal karena ia dibunuh. Buku sejarah menuduh Bayezid II melakukan hal ini dengan menghilangkan bahaya yang dialami saudaranya—tuduhan yang dikutip oleh sejarawan {cite:dawlat-uthmaniyya-salabi hlm. 164}. Disebutkan bahwa Alexander VI, atas permintaan orang Venesia, membentuk aliansi melawan Ottoman dengan menganeksasi Prancis dan Spanyol setelah mereka merebut suku Bantu {cite:dawlat-uthmaniyya-salabi, hlm. 173}."
