label: { ar: "الحارث بن عبد الله بن أبي ربيعة المخزومي القباع", en: "al-Harith ibn Abdallah ibn Abi Rabi'a 'al-Quba''", fr: "Al-Harith ibn Abd Allah ibn Abi Rabi’a, « al-Quba’ »", es: "al-Harith ibn Abdallah ibn Abi Rabi'a 'al-Quba''", ur: "حارث بن عبداللہ ابن ابی ربیعہ القبہ" }
summary:
  ar: "الحارث بن عبد الله بن أبي ربيعة المخزومي الملقب القباع؛ ولى عبد العزيز بن عبد الله بن عامر سجستان في أيام ابن الزبير فأدخلوه زرنج وحاربوا رتبيل."
  en: "Al-Harith ibn Abdallah ibn Abi Rabi'a al-Makhzumi, called al-Quba'; he gave Abd al-Aziz ibn Abdallah ibn Amir Sijistan in Ibn al-Zubayr's days, and they warred on Rutbil."
  fr: "Al-Harith ibn Abd Allah ibn Abi Rabi’a al-Makhzumi, appelé al-Quba’ ; il confia le Sijistan à Abd al-Aziz ibn Abd Allah ibn Amir à l’époque d’Ibn al-Zubayr, et ils combattirent Rutbil."
  es: "Al-Harith ibn Abdallah ibn Abi Rabi'a al-Makhzumi, llamado al-Quba'; le dio a Abd al-Aziz ibn Abdallah ibn Amir Sijistan en los días de Ibn al-Zubayr, y lucharon contra Rutbil."
  ur: "الحارث بن عبداللہ ابن ابی ربیعہ المخزومی، جسے القوبہ کہا جاتا ہے؛ اس نے ابن الزبیر کے زمانے میں عبد العزیز بن عبداللہ ابن عامر کو سجستان دیا اور انہوں نے رتبیل پر جنگ کی۔"
  tr: "El-Harit ibn Abdullah ibn Ebi Rabi'ah el-Mekhzumi, lakaplı el-Kuba; İbn Zubeyr döneminde Sijistan'ın Emiri olarak Abdülaziz ibn Abdullah ibn Emir'i atadı, böylece onu Zerenc'e getirdiler ve Ratbil ile savaştılar."
  id: "Al-Harith ibn Abdullah ibn Abi Rabi'ah al-Makhzumi, dijuluki al-Quba'; ia mengangkat Abd al-Aziz ibn Abdullah ibn Amir dari Sijistan pada masa Ibn al-Zubayr, sehingga mereka membawanya ke Zaranj dan melawan Ratbil."
