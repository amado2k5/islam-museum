id: person/umar-ibn-faraj-al-rukhji
class: person
label: { ar: "عمر بن فرج الرخجي", en: "Umar ibn Faraj al-Rukhji", es: "Umar ibn Faraj al-Rukhji", fr: "Umar ibn Faraj al-Rukhji", ur: "عمر بن فراج الرخجی" }
summary:
  ar: "عند البلاذري حول فوهة نهر الميمون في أيام الواثق على يديه. وعند المسعودي كان من علية الكتاب فسخط عليه المتوكل سنة ثلاث وثلاثين ومائتين فأخذ منه مالاً وجوهراً نحو مائة وعشرين ألف ألف دينار ومن أخيه نحو مائة وخمسين ألف ألف وصولح على أحد وعشرين ألف ألف درهم ثم أمر أن يصفع كل يوم فأحصى ستة آلاف صفعة وألبس جبة صوف ثم رضي عنه {cite:muruj-al-dhahab p. 488-489}"
  en: "In al-Baladhuri, under whom Nahr al-Maymun's mouth was redirected in al-Wathiq's days."
  es: "En al-Baladhuri, bajo cuyo mandato se redirigió la voz de Nahr al-Maymun en tiempos de al-Wathiq."
  fr: "Dans al-Baladhuri, sous qui la bouche de Nahr al-Maymun fut redirigée du temps d'al-Wathiq."
  ur: "البلادوری میں، جس کے ماتحت نہر المیمون کا منہ الوثیق کے دنوں میں ری ڈائریکٹ کیا گیا تھا۔"
  tr: "al-Baladhuri'ye göre, o, al-Wathiq döneminde Maimun Nehri'nin ağzındaydı. al-Mas'udi'ye göre, kitabın en üst sıralarındandı, bu yüzden al-Mutawakkil 233 Hile yılında ondan hoşlanmadı, bu yüzden ondan yaklaşık yüz yirmi bin dinar, kardeşinden ise yüz elli bin dinar, yirmi bir bin dirhem aldı. Sonra her gün altı bin tokat sayarak ve yün bir cübbe giyerek tokat yedirmesini emretti, sonra ondan memnun oldu {cite:muruj-al-dhahab, s. 488-489}"
  id: "Menurut al-Baladhuri, ia berada di muara Sungai Maimun pada masa al-Wathiq di bawah kekuasaannya. Menurut al-Mas'udi, ia berada di puncak buku, sehingga al-Mutawakkil tidak senang padanya pada tahun 233 H, sehingga ia mengambil uang dan perhiasan sekitar seratus dua puluh ribu dinar, dari saudaranya sekitar seratus lima puluh ribu, mencapai dua puluh satu ribu dirham. Kemudian ia memerintahkan agar ia ditampar setiap hari, dengan jumlah enam ribu tamparan, dan mengenakan jubah wol, lalu ia senang dengannya {cite:muruj-al-dhahab, hlm. 488-489}"
