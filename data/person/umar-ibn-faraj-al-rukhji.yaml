summary:
  ar: "عند البلاذري حول فوهة نهر الميمون في أيام الواثق على يديه. وعند المسعودي كان من علية الكتاب فسخط عليه المتوكل سنة ثلاث وثلاثين ومائتين فأخذ منه مالاً وجوهراً نحو مائة وعشرين ألف ألف دينار ومن أخيه نحو مائة وخمسين ألف ألف وصولح على أحد وعشرين ألف ألف درهم ثم أمر أن يصفع كل يوم فأحصى ستة آلاف صفعة وألبس جبة صوف ثم رضي عنه {cite:muruj-al-dhahab p. 488-489}"
  en: "In al-Baladhuri, under whom Nahr al-Maymun's mouth was redirected in al-Wathiq's days."
