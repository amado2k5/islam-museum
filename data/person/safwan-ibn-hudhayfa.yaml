class: person
label: { ar: "صفوان بن حذيفة بن اليمان", en: "Safwan ibn Hudhayfa", es: "Safwan ibn Hudhayfa", fr: "Safwan ibn Hudhayfa", ur: "صفوان بن حذیفہ" }
summary:
  ar: "ابن حذيفة بن اليمان، دعاه أبوه على فراش مرضه هو وأخاه سعداً إلى الشهادة مع علي فقال احملاني وكونا معه فستكون له حروب يهلك فيها خلق فاجتهدا أن تستشهدا معه فإنه على الحق، فاستشهدا جميعاً بصفين سنة ست وثلاثين {cite:muruj-al-dhahab p. 675}."
  en: "Hudhayfa ibn al-Yaman's son — borne with his brother Sa'd to Siffin on their dying father's command 'strive for martyrdom with him, for he is upon the truth'; both fell there in 36 AH {cite:muruj-al-dhahab p. 675}."
  es: "El hijo de Hudhayfa ibn al-Yaman fue llevado junto con su hermano Sa'd a Siffin por orden de su padre moribundo: «Esfuérzate por alcanzar el martirio con él, pues él está en la verdad»; ambos cayeron allí en el año 36 de la Hégira {cita:muruj-al-dhahab p. 675}."
  fr: "Le fils de Hudhayfa ibn al-Yaman — emmené avec son frère Sa'd à Siffin sur le commandement de leur père mourant « luttez pour le martyre avec lui, car il est sur la vérité »; tous deux y tombèrent en 36 AH {cite: muruj-al-dhahab p. 675}."
  ur: "حذیفہ بن یمان کا بیٹا - اپنے بھائی سعد کے ساتھ ان کے مرتے ہوئے باپ کے حکم پر 'اس کے ساتھ شہادت کی کوشش کرو، کیونکہ وہ حق پر ہے'۔ دونوں وہاں 36 ہجری میں گرے۔ 675}۔"
  tr: "Babası İbn Hudhayfah ibn al-Yaman, onu ve kardeşi Sa'd'ı hasta yatağında Ali ile şehit olarak çağırdı. Dedi ki, 'Bana dayan ve onunla ol, çünkü onun savaşları olacak ve insanlar ölecek. Bu yüzden onunla birlikte şehit olmaya çalıştılar, çünkü o gerçeği doğrudur.' Hepsi otuz altıncı yılda Siffin'de şehit oldular {atıf:muruj-al-dhahab, s. 675}."
  id: "Ibn Hudhayfah ibn al-Yaman, ayahnya, memanggil dia dan saudaranya Sa'd di ranjang sakit untuk menjadi syahid bersama Ali. Dia berkata, 'Bertahanlah dan bersama-Nya, karena dia akan menghadapi perang yang akan binasa. Maka mereka berusaha menjadi martir bersamanya, karena dia berpegang pada kebenaran.' Mereka semua menjadi martir di Siffin pada tahun tiga puluh enam {cite:muruj-al-dhahab, hlm. 675}."
