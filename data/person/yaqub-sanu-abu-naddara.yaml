summary:
  ar: "يعقوب بن رفائيل صنوع، المعروف بأبي نظارة، كاتب مسرحي يهودي مصري (1839-1912)، أثّر في الثورة العرابية بالتدريس والمحاضرة والكتابة والتمثيل الساخر، وأصدر جريدة أبي نظارة زرقا الكاريكاتيرية، واضطر إلى مغادرة مصر سنة 1878م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 160}"
  en: "Yaqub b. Rafa'il Sanu, known as Abu Naddara (James Sanua), a prolific Jewish Egyptian playwright (1839-1912) who influenced the 'Urabi revolt through teaching, lectures, writing and satirical performances, published the cartoon sheet Abu Naddara Zarqa, and had to leave Egypt in 1878. {cite:encyclopaedia-of-islam-2 vol. 1 p. 160}"
  ur: "یعقوب بن رفائیل صنوع، جو ابو نظارہ (جیمز صنوع) کے نام سے مشہور ہیں، مصر کے یہودی ڈرامہ نگار (1839-1912ء)، جنہوں نے تدریس، لیکچر، تحریر اور طنزیہ ڈراموں سے عرابی تحریک پر اثر ڈالا، کارٹونوں والا پرچہ ابو نظارہ زرقا نکالا، اور 1878ء میں مصر چھوڑنے پر مجبور ہوئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 160}"
