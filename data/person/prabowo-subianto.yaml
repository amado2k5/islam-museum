summary:
  ar: "سياسي إندونيسي ورجل أعمال وضابط متقاعد، وُلد في جاكرتا سنة 1951، وهو ابن الاقتصادي سوميترو جويوهاديكوسومو. خدم في القوات الخاصة وقاد القيادة الاستراتيجية الاحتياطية قبل تسريحه من الجيش سنة 1998، وأسّس حزب غيريندرا، وتولّى وزارة الدفاع من 2019 إلى 2024، ثم صار رئيس إندونيسيا الثامن في 20 أكتوبر 2024."
  en: "Indonesian politician, businessman and retired general, born in Jakarta in 1951, the son of the economist Sumitro Djojohadikusumo. He served in the Special Forces (Kopassus) and led the Strategic Reserves Command (Kostrad) before his discharge from the army in 1998, founded the Gerindra Party, served as minister of defence from 2019 to 2024, and became Indonesia's eighth president on 20 October 2024."
  ur: "انڈونیشی سیاست دان، کاروباری اور ریٹائرڈ جنرل، جو 1951ء میں جکارتہ میں پیدا ہوئے؛ ماہرِ معاشیات سومیترو جویوہادیکوسومو کے بیٹے ہیں۔ خصوصی دستوں ⁦(کوپاسوس)⁩ میں خدمت کی اور 1998ء میں فوج سے برطرفی سے پہلے اسٹریٹجک ریزرو کمان ⁦(کوسٹراڈ)⁩ کی قیادت کی، گیریندرا پارٹی قائم کی، 2019ء سے 2024ء تک وزیرِ دفاع رہے، اور 20 اکتوبر 2024ء کو انڈونیشیا کے آٹھویں صدر بنے۔"
  es: "Político, empresario y general retirado indonesio, nacido en Yakarta en 1951, hijo del economista Sumitro Djojohadikusumo. Sirvió en las Fuerzas Especiales (Kopassus) y dirigió el Comando de Reservas Estratégicas (Kostrad) antes de su baja del ejército en 1998. Fundó el Partido Gerindra, fue ministro de Defensa de 2019 a 2024 y se convirtió en el octavo presidente de Indonesia el 20 de octubre de 2024."
  fr: "Homme politique, homme d'affaires et général à la retraite indonésien, né à Jakarta en 1951, fils de l'économiste Sumitro Djojohadikusumo. Il a servi dans les forces spéciales (Kopassus) et dirigé le commandement des réserves stratégiques (Kostrad) avant de quitter l'armée en 1998. Fondateur du parti Gerindra, il a été ministre de la Défense de 2019 à 2024 et est devenu le huitième président de l'Indonésie le 20 octobre 2024."
  tr: "1951 yılında Cakarta'da doğan Endonezyalı bir politikacı, iş insanı ve emekli subay olan Smitro, ekonomist Sumitro Joyohadikusomo'nun oğludur. Özel kuvvetlerde görev yaptı ve Yedek Stratejik Komutanlığı'nı yönetti, 1998'de ordudan terhis oldu, Gerendra Partisi'ni kurdu, 2019-2024 yılları arasında Savunma Bakanı olarak görev yaptı ve ardından 20 Ekim 2024'te Endonezya'nın sekizinci cumhurbaşkanı oldu."
  id: "Seorang politikus, pengusaha, dan perwira pensiunan Indonesia, lahir di Jakarta pada tahun 1951, ia adalah putra ekonom Sumitro Joyohadikusomo. Ia pernah bertugas di pasukan khusus dan memimpin Komando Strategis Cadangan sebelum diberhentikan dari militer pada tahun 1998, mendirikan Partai Gerendra, menjabat sebagai Menteri Pertahanan dari 2019 hingga 2024, dan kemudian menjadi presiden Indonesia kedelapan pada 20 Oktober 2024."
