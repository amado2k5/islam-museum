summary:
  ar: "سياسي إندونيسي ورجل أعمال وضابط متقاعد، وُلد في جاكرتا سنة 1951، وهو ابن الاقتصادي سوميترو جويوهاديكوسومو. خدم في القوات الخاصة وقاد القيادة الاستراتيجية الاحتياطية قبل تسريحه من الجيش سنة 1998، وأسّس حزب غيريندرا، وتولّى وزارة الدفاع من 2019 إلى 2024، ثم صار رئيس إندونيسيا الثامن في 20 أكتوبر 2024."
  en: "Indonesian politician, businessman and retired general, born in Jakarta in 1951, the son of the economist Sumitro Djojohadikusumo. He served in the Special Forces (Kopassus) and led the Strategic Reserves Command (Kostrad) before his discharge from the army in 1998, founded the Gerindra Party, served as minister of defence from 2019 to 2024, and became Indonesia's eighth president on 20 October 2024."
  ur: "انڈونیشی سیاست دان، کاروباری اور ریٹائرڈ جنرل، جو 1951ء میں جکارتہ میں پیدا ہوئے؛ ماہرِ معاشیات سومیترو جویوہادیکوسومو کے بیٹے ہیں۔ خصوصی دستوں (کوپاسوس) میں خدمت کی اور 1998ء میں فوج سے برطرفی سے پہلے اسٹریٹجک ریزرو کمان (کوسٹراڈ) کی قیادت کی، گیریندرا پارٹی قائم کی، 2019ء سے 2024ء تک وزیرِ دفاع رہے، اور 20 اکتوبر 2024ء کو انڈونیشیا کے آٹھویں صدر بنے۔"
