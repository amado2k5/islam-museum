summary:
  ar: "صحفية وكاتبة نسوية مصرية أمريكية، وُلدت سنة 1967 في بورسعيد. عملت مراسلة لرويترز في القاهرة والقدس وكتبت في صحف عالمية، وانتقلت إلى الولايات المتحدة سنة 2000. تعرّضت للضرب والاعتداء الجنسي من شرطة مكافحة الشغب المصرية أثناء تغطيتها احتجاجات ميدان التحرير في نوفمبر 2011. من كتبها «الحجاب وغشاء البكارة» (2015) و«الخطايا السبع الضرورية للنساء والفتيات» (2019)، وهي من رائدات حركة #MosqueMeToo."
  en: "Egyptian-American journalist and feminist writer, born in 1967 in Port Said. She worked as a Reuters correspondent in Cairo and Jerusalem and wrote for publications worldwide, moving to the United States in 2000. Egyptian riot police beat and sexually assaulted her while she covered the Tahrir Square protests in November 2011. Her books are Headscarves and Hymens (2015) and The Seven Necessary Sins for Women and Girls (2019), and she is among the people who spearheaded the #MosqueMeToo movement."
  ur: "مصری امریکی صحافی اور نسوانی مصنفہ، 1967 میں پورٹ سعید میں پیدا ہوئیں۔ انھوں نے قاہرہ اور یروشلم میں رائٹرز کی نمائندہ کے طور پر کام کیا اور دنیا بھر کے اخبارات میں لکھا، اور 2000 میں امریکہ منتقل ہوئیں۔ نومبر 2011 میں تحریر اسکوائر کے احتجاج کی کوریج کے دوران مصری فسادی پولیس نے انھیں مارا اور جنسی زیادتی کا نشانہ بنایا۔ ان کی کتابوں میں «حجاب اور پردۂ بکارت» (2015) اور «عورتوں اور لڑکیوں کے لیے سات ضروری گناہ» (2019) شامل ہیں، اور وہ #MosqueMeToo تحریک کی بانیوں میں سے ہیں۔"
