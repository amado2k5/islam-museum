summary:
  ar: "صحفية وكاتبة نسوية مصرية أمريكية، وُلدت سنة 1967 في بورسعيد. عملت مراسلة لرويترز في القاهرة والقدس وكتبت في صحف عالمية، وانتقلت إلى الولايات المتحدة سنة 2000. تعرّضت للضرب والاعتداء الجنسي من شرطة مكافحة الشغب المصرية أثناء تغطيتها احتجاجات ميدان التحرير في نوفمبر 2011. من كتبها «الحجاب وغشاء البكارة» (2015) و«الخطايا السبع الضرورية للنساء والفتيات» (2019)، وهي من رائدات حركة #MosqueMeToo."
  en: "Egyptian-American journalist and feminist writer, born in 1967 in Port Said. She worked as a Reuters correspondent in Cairo and Jerusalem and wrote for publications worldwide, moving to the United States in 2000. Egyptian riot police beat and sexually assaulted her while she covered the Tahrir Square protests in November 2011. Her books are Headscarves and Hymens (2015) and The Seven Necessary Sins for Women and Girls (2019), and she is among the people who spearheaded the #MosqueMeToo movement."
  ur: "مصری امریکی صحافی اور نسوانی مصنفہ، 1967 میں پورٹ سعید میں پیدا ہوئیں۔ انھوں نے قاہرہ اور یروشلم میں رائٹرز کی نمائندہ کے طور پر کام کیا اور دنیا بھر کے اخبارات میں لکھا، اور 2000 میں امریکہ منتقل ہوئیں۔ نومبر 2011 میں تحریر اسکوائر کے احتجاج کی کوریج کے دوران مصری فسادی پولیس نے انھیں مارا اور جنسی زیادتی کا نشانہ بنایا۔ ان کی کتابوں میں «حجاب اور پردۂ بکارت» (2015) اور «عورتوں اور لڑکیوں کے لیے سات ضروری گناہ» (2019) شامل ہیں، اور وہ #MosqueMeToo تحریک کی بانیوں میں سے ہیں۔"
  es: "Periodista y escritora feminista egipcio-estadounidense, nacida en 1967 en Port Said. Trabajó como corresponsal de Reuters en El Cairo y Jerusalén y colaboró con publicaciones de todo el mundo, trasladándose a Estados Unidos en el año 2000. La policía antidisturbios egipcia la golpeó y agredió sexualmente mientras cubría las protestas de la plaza Tahrir en noviembre de 2011. Es autora de los libros «Pañuelos y himen» (2015) y «Los siete pecados necesarios para las mujeres y las niñas» (2019), y se encuentra entre las impulsoras del movimiento #MeToo en la mezquita."
  fr: "Journaliste et écrivaine féministe égypto-américaine, née en 1967 à Port-Saïd, elle a travaillé comme correspondante pour Reuters au Caire et à Jérusalem et a collaboré à des publications du monde entier avant de s'installer aux États-Unis en 2000. En novembre 2011, alors qu'elle couvrait les manifestations de la place Tahrir, elle a été agressée sexuellement et battue par la police anti-émeute égyptienne. Elle est l'auteure de deux ouvrages: « Headscarves and Hymens » (2015) et « The Seven Necessary Sins for Women and Girls » (2019). Elle compte parmi les figures de proue du mouvement #MosqueMeToo."
  tr: "Mısır-Amerikalı gazeteci ve feminist yazar, 1967 yılında Port Said'de doğmuştur. Reuters için Kahire ve Kudüs'te muhabir olarak çalıştı, uluslararası gazeteler için yazdı ve 2000 yılında Amerika Birleşik Devletleri'ne taşındı. Kasım 2011'de Tahrir Meydanı protestolarını haber yaparken Mısır çevik kuvvet polisi tarafından dövüldü ve cinsel saldırıya uğradı. Kitapları arasında \"The Veil and the Hymen\" (2015) ve \"The Seven Essential Sins of Women and Girls\" (2019) yer almakta olup, #MosqueMeToo hareketinin öncülerindendir."
  id: "Seorang jurnalis Mesir-Amerika dan penulis feminis, lahir pada tahun 1967 di Port Said. Ia bekerja sebagai koresponden untuk Reuters di Kairo dan Yerusalem, menulis untuk surat kabar internasional, dan pindah ke Amerika Serikat pada tahun 2000. Ia dipukuli dan diserang secara seksual oleh polisi anti huru-hara Mesir saat meliput protes di Tahrir Square pada November 2011. Di antara bukunya adalah \"The Veil and the Hymen\" (2015) dan \"The Seven Essential Sins of Women and Girls\" (2019), dan ia adalah pelopor gerakan #MosqueMeToo."
