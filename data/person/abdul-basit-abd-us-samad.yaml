summary:
  ar: "قارئ قرآن مصري (1927–1988) لُقّب بـ«الحنجرة الذهبية» و«صوت مكة»، التحق بالإذاعة المصرية سنة 1951، وكان أول نقيب لقراء مصر سنة 1984، وجاب بلاد العالم بتلاواته المسجلة والمباشرة."
  en: "Egyptian Quran reciter (1927–1988) known as the 'Golden Throat' and the 'Voice of Mecca'. He joined Egyptian Radio in 1951, became the first president of Egypt's Syndicate of Quran Reciters in 1984, and carried his recitations, recorded and live, around the world."
