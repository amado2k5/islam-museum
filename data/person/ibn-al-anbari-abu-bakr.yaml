summary:
  ar: "أبو بكر محمد بن القاسم بن محمد بن بشار بن الحسن بن بيمان بن سماعة بن فروة بن قطن بن دعامة الأنباري النحوي؛ كان علامة وقته في الآداب وأكثر الناس حفظاً لها وكان صدوقاً ثقة ديناً؛ من تصانيفه في علوم القرآن وغريب الحديث والمشكل والوقف والابتداء والرد على من خالف مصحف العامة وكتاب الزاهر وخلق الإنسان وخلق الفرس والأمثال والمقصور والممدود والمؤنث والمذكر وغريب الحديث الذي قيل إنه خمسة وأربعون ألف ورقة وشرح الكافي نحو ألف ورقة والإيقاعات والأضداد والجاهليات ورسالة المشكل التي رد فيها على ابن قتيبة وأبي حاتم؛ قال أبو علي القالي: كان يحفظ ثلاثمائة ألف بيت شاهد في القرآن الكريم {cite:wafayat-ayan}."
  en: "Abu Bakr Ibn al-Anbari (271–328) — the Anbari grammarian called 'the allama of his age in adab'; author of al-Zahir, the great Gharib al-Hadith (said to be 45,000 folios), al-Idah wa-l-Ibtida', al-Addad and a refutation of Ibn Qutayba; al-Qali says he kept 300,000 verses of shawahid in memory {cite:wafayat-ayan}."
  es: "Abu Bakr Ibn al-Anbari (271-328): el gramático anbari llamado \"el allama de su época en adab\"; autor de al-Zahir, el gran Gharib al-Hadith (se dice que tiene 45.000 folios), al-Idah wa-l-Ibtida', al-Addad y una refutación de Ibn Qutayba; al-Qali dice que guardó 300.000 versos de shawahid en la memoria {cita:wafayat-ayan}."
  fr: "Abu Bakr Ibn al-Anbari (271-328) — le grammairien Anbari appelé « l'allama de son âge en adab »; auteur d'al-Zahir, du grand Gharib al-Hadith (estimé être de 45 000 feuillets), d'al-Idah wa-l-Ibtida', d'al-Addad et d'une réfutation d'Ibn Qutayba; al-Qali dit qu'il a gardé en mémoire 300 000 versets de shawahid {cite: wafayat-ayan}."
  ur: "ابوبکر ابن الانباری (271–328) - انباری گرامر نے 'اپنے دور کے علامہ کو ادب میں' کہا؛ الظاہر کے مصنف، عظیم غریب الحدیث ⁦(کہا جاتا ہے کہ 45,000 فولیو ہیں)⁩، الاداح والابتدا، الادد اور ابن قتیبہ کی تردید؛ القلی کا کہنا ہے کہ اس نے 300,000 آیات شہادت کو یاد میں رکھا۔"
  tr: "Ebu Bekir Muhammed ibn el-Kasım ibn Muhammed ibn Beşar ibn el-Hasan ibn Bayman ibn Sama'ah ibn Farwa ibn Qatn ibn Da'ma' al-Anbari, dilbilgici; döneminin edebiyatında en çok ezberlenen önemli bir figürdü, güvenilir ve dindardı. Eserleri arasında Kur'an illeri, nadir hadisler, zorluk, duraklama, başlangıç, halkın Muşafı, Kitab al-Zahir, Halife al-Khalef gibi eserlerinden farklı olanların çürütülmesi yer alır -Delir, Khalaq al-Faras, atasözleri, atasözleri, atasözleri, el-maqsur, el-mammud, erkek, nadir hadisler, kırk beş bin sayfa olduğu söyleniyor, el-Kafi üzerine tefsir, yaklaşık bin sayfa, ritimler, zıtlıklar, İslam öncesi çalışmalar ve İbn Qutaybe ile Ebu Hatim'i çürüttüğü miskkil risalesi. Ebu Ali el-Kali şöyle dedi: Kur'an'da kanıt olarak üç yüz bin ayet ezberledi {alıntı::] Wafayat-ayan}."
  id: "Abu Bakr Muhammad ibn al-Qasim ibn Muhammad ibn Bashar ibn al-Hasan ibn Bayman ibn Sama'ah ibn Farwah ibn Qatn ibn Da'ma' al-Anbari, seorang ahli tata bahasa; ia adalah tokoh terkemuka dalam sastra pada zamannya, yang paling dihafal, dan ia dapat dipercaya serta taat. Di antara karya-karyanya adalah ilmu Al-Qur'an, hadits langka, kesulitan, jeda, permulaan, dan penolakan terhadap mereka yang berbeda dari Mushaf, Kitab al-Zahir, Khalaf orang biasa al-Insan, Khalaq al-Faras, peribahasa, peribahasa, peribahasa, al-maqsur, al-mammud, maskulin, hadis langka, yang dikatakan memiliki empat puluh lima ribu halaman, komentar tentang al-Kafi, sekitar seribu halaman, ritme, lawan, studi pra-Islam, dan risalah muskkil, di mana ia membantah Ibn Qutaybah dan Abu Hatim. Abu Ali al-Qali berkata: Ia menghafal tiga ratus ribu ayat sebagai bukti dalam Al-Qur'an {sitasi:Wafayat-Ayan}."
