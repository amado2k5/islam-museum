summary:
  ar: "أبو بكر محمد بن القاسم بن محمد بن بشار بن الحسن بن بيمان بن سماعة بن فروة بن قطن بن دعامة الأنباري النحوي؛ كان علامة وقته في الآداب وأكثر الناس حفظاً لها وكان صدوقاً ثقة ديناً؛ من تصانيفه في علوم القرآن وغريب الحديث والمشكل والوقف والابتداء والرد على من خالف مصحف العامة وكتاب الزاهر وخلق الإنسان وخلق الفرس والأمثال والمقصور والممدود والمؤنث والمذكر وغريب الحديث الذي قيل إنه خمسة وأربعون ألف ورقة وشرح الكافي نحو ألف ورقة والإيقاعات والأضداد والجاهليات ورسالة المشكل التي رد فيها على ابن قتيبة وأبي حاتم؛ قال أبو علي القالي: كان يحفظ ثلاثمائة ألف بيت شاهد في القرآن الكريم {cite:wafayat-ayan}."
  en: "Abu Bakr Ibn al-Anbari (271–328) — the Anbari grammarian called 'the allama of his age in adab'; author of al-Zahir, the great Gharib al-Hadith (said to be 45,000 folios), al-Idah wa-l-Ibtida', al-Addad and a refutation of Ibn Qutayba; al-Qali says he kept 300,000 verses of shawahid in memory {cite:wafayat-ayan}."
