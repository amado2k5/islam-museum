  en: "Muhammad ibn Jabir al-Marwazi"
  ur: "محمد بن جابر مروزی"
roles: [scholar]
gender: male
summary:
  ar: "محمد بن جابر بن حماد، أبو عبد الله المروزي، حافظ فقيه، سمع هدبة بن خالد وعلي بن المديني وأحمد بن حنبل وأبا مصعب الزهري وإسحاق بن راهويه وأحمد بن صالح وغيرهم، وحدّث عنه البخاري في «تاريخه» وابن خزيمة وأبو العباس المحبوبي وغيرهم. قال الحاكم إنه أحد أئمة زمانه، وقال الذهبي جمع وصنف وبرع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13762}. وتاريخ وفاته في الكتاب (؟-279 ه)."
  en: "Muhammad ibn Jabir ibn Hammad, Abu Abd Allah al-Marwazi, a memorizer and jurist, who heard from Hudba ibn Khalid, Ali ibn al-Madini, Ahmad ibn Hanbal, Abu Mus'ab al-Zuhri, Ishaq ibn Rahwayh and Ahmad ibn Salih; al-Bukhari narrated from him in his Tarikh, and Ibn Khuzayma and Abu al-Abbas al-Mahbubi narrated from him. Al-Hakim called him one of the imams of his time; al-Dhahabi says he compiled, wrote and excelled {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13762}. The book gives his death as 279 AH."
  ur: "محمد بن جابر بن حماد، ابو عبداللہ مروزی، حافظ اور فقیہ، جنہوں نے ہدبہ بن خالد، علی بن مدینی، احمد بن حنبل، ابو مصعب زہری، اسحاق بن راہویہ اور احمد بن صالح سے سنا۔ بخاری نے اپنی تاریخ میں ان سے روایت کی، اور ابن خزیمہ اور ابو العباس محبوبی نے بھی ان سے حدیث لی۔ حاکم نے انہیں اپنے زمانے کے ائمہ میں شمار کیا، اور ذہبی کے مطابق انہوں نے جمع اور تصنیف کی اور کمال حاصل کیا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13762}۔ کتاب ان کی وفات 279 ہجری بتاتی ہے۔"
