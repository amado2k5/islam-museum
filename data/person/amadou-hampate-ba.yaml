    note: "Recorded on two independent attestations of Sufi discipleship. The English Wikipedia article records that he first attended the Qur'anic school run by Tierno Bokar, a dignitary of the Tijaniyyah brotherhood, that in 1933 he took six months' leave to visit Bokar, 'his spiritual leader', and that he wrote Bokar's life and teaching (Vie et enseignement de Tierno Bokar, 1957; in English, A Spirit of Tolerance). Independently of Wikipedia, World Wisdom — the publisher of that English translation — records that 'from the time of his youth, Mr. Bâ was a student and disciple of an extraordinary Malian Sufi master, Tierno Bokar'. The Arabic article likewise calls Bokar a master of Sufism in Mali and Bâ his pupil from youth. No source fetched names a legal school (madhhab) for him, so no sunni or compound value is recorded. The Tijaniyya has no group entity in the museum yet, so the affiliation is carried here and in the prose rather than as a member_of relation."
