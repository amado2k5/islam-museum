summary:
  ar: "كاتب وإثنوغرافي مالي من الفولاني، وُلد في باندياغارا سنة 1901 في ما كان يُعرف بالسودان الفرنسي، وتتلمذ في صباه على الشيخ الصوفي التيجاني تيرنو بوكار، وقضى حياته في جمع التراث الشفهي الإفريقي وتدوينه، وأسس معهد العلوم الإنسانية في باماكو ومثّل مالي في اليونسكو، وتوفي في أبيدجان سنة 1991."
  en: "Malian Fula writer and ethnographer, born at Bandiagara in 1901 in what was then French Sudan. As a boy he studied under the Tijani Sufi teacher Tierno Bokar; he spent his life collecting and writing down Africa's oral traditions, founded the Institute of Human Sciences in Bamako, represented Mali at UNESCO, and died at Abidjan in 1991."
  ur: "مالی کے فولانی مصنف اور ماہرِ بشریات، جو 1901 میں باندیاگارا میں پیدا ہوئے؛ بچپن میں تیجانی صوفی استاد تیرنو بوکار کے شاگرد رہے، عمر بھر افریقہ کی زبانی روایت کو جمع اور محفوظ کرنے میں گزاری، باماکو میں انسانی علوم کا ادارہ قائم کیا، یونیسکو میں مالی کی نمائندگی کی اور 1991 میں ابیجان میں وفات پائی۔"
