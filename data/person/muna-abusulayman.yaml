  ar: إعلامية وسيدة أعمال سعودية وُلدت سنة 1973 في فيلادلفيا. شاركت في تقديم برنامج «كلام نواعم» الشهير، وقادت مؤسسة الوليد للإنسانية ومبادرات تنموية، وتُعَدّ من روّاد الإعلام النسائي السعودي.
  en: Saudi media personality and businesswoman, born 1973 in Philadelphia. Co-host of the widely watched talk show Kalam Nawaem, former head of the Alwaleed Philanthropies foundation and a pioneer of Saudi
    women's presence on television.
