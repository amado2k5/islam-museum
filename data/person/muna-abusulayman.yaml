summary:
  ar: إعلامية وسيدة أعمال سعودية وُلدت سنة 1973 في فيلادلفيا. شاركت في تقديم برنامج «كلام نواعم» الشهير، وقادت مؤسسة الوليد للإنسانية ومبادرات تنموية، وتُعَدّ من روّاد الإعلام النسائي السعودي.
  en: Saudi media personality and businesswoman, born 1973 in Philadelphia. Co-host of the widely watched talk show Kalam Nawaem, former head of the Alwaleed Philanthropies foundation and a pioneer of Saudi
    women's presence on television.
  ur: سعودی میڈیا شخصیت اور کاروباری خاتون، 1973 میں فلاڈلفیا میں پیدا ہوئیں۔ مشہور ٹاک شو «کلام نواعم» کی شریک میزبان، الولید فیلنتھروپیز کی سابق سربراہ اور سعودی ٹیلی ویژن پر خواتین کی موجودگی کی پیشرو۔
  es: "Personalidad mediática y empresaria saudí, nacida en 1973 en Filadelfia. Copresentadora del popular programa de entrevistas Kalam Nawaem, exdirectora de la fundación Alwaleed Philanthropies y pionera de la presencia de las mujeres saudíes en la televisión."
  fr: "Personnalité médiatique et femme d'affaires saoudienne, née en 1973 à Philadelphie. Co-animatrice du talk-show très suivi Kalam Nawaem, ancienne directrice de la fondation Alwaleed Philanthropies et pionnière de la présence des femmes saoudiennes à la télévision."
  tr: "1973 yılında Philadelphia'da doğmuş bir Suudi medya profesyoneli ve iş kadını. Ünlü \"Kalam Nawaem\" programının sunuculuğuna katıldı, Alwaleed Hayırseverler Vakfı'nı ve kalkınma girişimlerini yönetti ve Suudi kadın medyasının öncülerinden biri olarak kabul ediliyor."
  id: "Seorang profesional media dan pengusaha Saudi yang lahir pada tahun 1973 di Philadelphia. Ia berpartisipasi dalam pembawa acara program terkenal \"Kalam Nawaem,\" memimpin Alwaleed Philanthropies Foundation dan inisiatif pembangunan, serta dianggap sebagai salah satu pelopor media perempuan Saudi."
