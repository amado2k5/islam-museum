label: { ar: "محمد بن أبي الأزهر", en: "Muhammad ibn Abi'l-Azhar", es: "Muhammad ibn Abi'l-Azhar", fr: "Muhammad ibn Abi'l-Azhar", ur: "محمد ابن ابی الازہر" }
summary:
  ar: "أديب حدث أن إبراهيم بن المدبر كان مع محله في العلم والأدب يسيء الرأي في أبي تمام ويحلف أنه لا يحسن شيئاً قط، فقرأ عليه أبياتاً لم ينسبها حتى سبه ولعنه، وحدث عن أبي عمرو بن الحسن الطوسي أن أباه أرسله إلى ابن الأعرابي يقرأ عليه أشعار هذيل فأنشده أرجوزة أبي تمام فقال اكتبها فلما قيل له إنها لأبي تمام قال خرق خرق {cite:muruj-al-dhahab p. 461-463}."
  en: "The littérateur who baited Ibn al-Mudabbir and Ibn al-A'rabi into praising then damning unattributed Abu Tammam verses {cite:muruj-al-dhahab p. 461-463}."
  es: "El literato que incitó a Ibn al-Mudabbir e Ibn al-A'rabi a alabar y luego condenar los versos no atribuidos de Abu Tammam {citar:muruj-al-dhahab p. 461-463}."
  fr: "Le littérateur qui a incité Ibn al-Mudabbir et Ibn al-A'rabi à louer puis à condamner les versets non attribués d'Abu Tammam {cite: muruj-al-dhahab p. 461-463}."
  ur: "وہ ادیب جس نے ابن المدبیر اور ابن العربی کی تعریف میں طعنہ دیا اور پھر ابو تمام کی غیر منسوب آیات پر لعنت بھیجی۔ 461-463}۔"
  tr: "Bir edebi figür, İbrahim bin el-Mudabber'in bilgi ve edebiyattaki yerine rağmen Ebu Temmam'ı eleştirdiğini ve onun hiçbir zaman iyi bir şey yapmadığına yemin ettiğini aktarır. Ona atfetmediği dizeleri okumuş, hatta küfür ve lanetler satırmıştır. Ebu Emr bin el-Hasan el-Tusi'den, babasının onu Hudhayl şiirlerini okuması için İbn al-A'rabi'ye gönderdiğini anlatmıştır; bu yüzden Ebu Temmam'ın şiirini okuyup 'Yaz onu.' demiştir. Şiirin Ebu Temem için olduğu söylendiğinde, 'Kır, kır' demiştir {atıf:Muruj-al-Dhahab s. 461-463}"
  id: "Seorang tokoh sastra melaporkan bahwa Ibrahim ibn al-Mudabber, meskipun memiliki posisi dalam ilmu dan sastra, sering mengkritik Abu Tammam dan bersumpah bahwa dia tidak pernah melakukan sesuatu yang baik. Dia membacakan ayat-ayat yang tidak dia kaitkan kepadanya, bahkan mengutuk dan mengutuknya. Dia menceritakan dari Abu Amr ibn al-Hasan al-Tusi bahwa ayahnya mengirimnya kepada Ibn al-A'rabi untuk membacakan puisi-puisi Hudhayl kepadanya, sehingga dia membacakan puisi Abu Tammam dan berkata, 'Tuliskan.' Ketika diberitahu itu untuk Abu Tammam, dia berkata, 'Pecahkan, pecahkan' {cite:muruj-al-dhahab hlm. 461-463}."
