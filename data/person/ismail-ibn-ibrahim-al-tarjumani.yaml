id: person/ismail-ibn-ibrahim-al-tarjumani
class: person
label:
  ar: "إسماعيل بن إبراهيم الترجماني"
  en: "Isma'il ibn Ibrahim al-Tarjumani"
  es: "Isma'il ibn Ibrahim al-Tarjumani"
  fr: "Isma'il ibn Ibrahim al-Tarjumani"
  ur: "اسماعیل بن ابراہیم الترجمانی"
roles: [scholar, muhaddith]
gender: male
summary:
  ar: "إسماعيل بن إبراهيم بن بسام، أبو إبراهيم الترجماني، وصفه الصفدي بأنه عالم فاضل شهد جنازته خلق كثير، وكتب الإمام أحمد عنه أحاديث، وأسند عن هشيم بن بشير وغيره، توفي سنة 236 هـ {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 9 p. 47}."
  en: "Isma'il ibn Ibrahim ibn Bassam, Abu Ibrahim al-Tarjumani, whom al-Safadi calls a learned and excellent scholar; a great crowd attended his funeral, the imam Ahmad wrote hadiths down from him, and he transmitted from Hushaym ibn Bashir; he died in 236 AH {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 9 p. 47}."
  es: "Isma'il ibn Ibrahim ibn Bassam, Abu Ibrahim al-Tarjumani, a quien al-Safadi llama un erudito erudito y excelente; una gran multitud asistió a su funeral, el imán Ahmad transcribió hadices de él, y él transmitió de Hushaym ibn Bashir; murió en el año 236 AH {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 9 p. 47}."
  fr: "Isma'il ibn Ibrahim ibn Bassam, Abu Ibrahim al-Tarjumani, que al-Safadi qualifie de savant érudit et excellent; une foule immense assista à ses funérailles, l'imam Ahmad consigna des hadiths de lui, et il les transmit de Hushaym ibn Bashir; il mourut en 236 AH {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 9 p. 47}."
  ur: "اسماعیل بن ابراہیم بن بسام، ابو ابراہیم الترجمانی، جنہیں الصفدی ایک عالم اور بہترین عالم کہتے ہیں۔ ان کے جنازے میں ایک بڑا ہجوم شریک ہوا، امام احمد نے ان سے احادیث لکھیں، اور انہوں نے ہشیم بن بشیر سے نقل کی؛ آپ کی وفات 236 ہجری میں ہوئی۔ 9ص۔ 47}۔"
  tr: "İsmail ibn İbrahim ibn Bassam, Ebu İbrahim el-Tarcumani, onu cenazesine birçok kişinin katıldığı erdemli bir âlim olarak tanımlamıştır. İmam Ahmed onun hakkında hadisler yazmış ve Hishim bin Beşir ile diğerlerinden zincirler aktarmıştır. 236 Hicri yılında vefat etti {atıf:wafi-bi-l-wafayat-safadi-dar-ihya-2000 cilt 9, s. 47}."
  id: "Ismail ibn Ibrahim ibn Bassam, Abu Ibrahim al-Tarjumani, menggambarkannya sebagai ulama yang berbudi luhur yang pemakamannya dihadiri banyak orang. Imam Ahmad menulis hadits tentang dirinya dan meneruskan rantai dari Hishim ibn Bashir dan lainnya. Ia meninggal pada tahun 236 H {cite:wafi-bi-l-wafayat-safadi-dar-ihya-2000 vol. 9, hlm. 47}."
