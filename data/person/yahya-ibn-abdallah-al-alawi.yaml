id: person/yahya-ibn-abdallah-al-alawi
class: person
label: { ar: "يحيى بن عبد الله بن حسن العلوي" }
summary:
  ar: "علوي حسني، افترى عليه عبد الله بن مصعب الزبيري عند الرشيد أنه دعاه إلى الخروج فباهله بحضرة الرشيد فمات الزبيري ليومه {cite:tarikh-khulafa-minhaj-1434 p. 460-461}. وسار إلى الديلم مستجيراً فباعه صاحب الديلم من عامل الرشيد بمائة ألف درهم فقتل، وروي أنه ألقي في بركة فيها سباع جوعت فأمسكت عن أكله فبني عليه ركن بالجص والحجر وهو حي {cite:muruj-al-dhahab p. 330}"
  en: "A Hasanid Alid slandered to al-Rashid by Abdallah ibn Mus'ab al-Zubayri, who died the day of their mutual imprecation {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  es: "Un Hasanid Alid calumniado contra al-Rashid por Abdallah ibn Mus'ab al-Zubayri, quien murió el día de su mutua imprecación {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  fr: "Un Hasanide Alid calomnié à al-Rashid par Abdallah ibn Mus'ab al-Zubayri, qui mourut le jour de leur imprécation mutuelle {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  ur: "عبداللہ بن مصعب الزبیری کی طرف سے ایک حسن الید نے الرشید پر بہتان لگایا، جو ان کی باہمی عداوت کے دن فوت ہوئے تھے۔ 460-461}۔"
  tr: "Alawi Hasani, Abdullah ibn Mus'ab al-Zubayri, onu dışarı çıkmaya davet ettiği için al-Rashid'e iftira attı, bu yüzden Rashid onu al-Rashid'in huzurunda karşıladı ve al-Zubayri o gün öldü {cite:History-Khulafa-minhaj-1434 s. 460-461}. Al-Daylam'a sığınmak için gitti, ancak al-Daylam'ın sahibi onu al-Rashid'in valisinden yüz bin dirhem karşılığında sattı ve öldürdü. Rivayete göre, aç bir gölete atıldı, ancak onlar onu yemediler, bu yüzden hayattayken üzerine sıva ve taştan bir köşe yapıldı {cite:muruj-al-dhahab s. 330}"
  id: "Alawi Hasani, Abdullah ibn Mus'ab al-Zubayri memfitnahnya kepada al-Rashid karena mengundangnya keluar, sehingga ia menyambutnya di hadapan al-Rashid, dan al-Zubayri meninggal pada hari itu {cite:History-Khulafa-minhaj-1434 hlm. 460-461}. Ia pergi ke al-Daylam untuk mencari perlindungan, tetapi pemilik al-Daylam menjualnya dari gubernur al-Rashid seharga seratus ribu dirham, sehingga membunuhnya. Diceritakan bahwa ia dilempar ke sebuah kolam di mana ternak kelaparan, tetapi mereka menahan diri untuk tidak memakannya, sehingga sebuah sudut dari plester dan batu dibangun di atasnya saat ia masih hidup {cite:muruj-al-dhahab hlm. 330}"
