label: { ar: "يحيى بن عبد الله بن حسن العلوي" }
summary:
  ar: "علوي حسني، افترى عليه عبد الله بن مصعب الزبيري عند الرشيد أنه دعاه إلى الخروج فباهله بحضرة الرشيد فمات الزبيري ليومه {cite:tarikh-khulafa-minhaj-1434 p. 460-461}. وسار إلى الديلم مستجيراً فباعه صاحب الديلم من عامل الرشيد بمائة ألف درهم فقتل، وروي أنه ألقي في بركة فيها سباع جوعت فأمسكت عن أكله فبني عليه ركن بالجص والحجر وهو حي {cite:muruj-al-dhahab p. 330}"
  en: "A Hasanid Alid slandered to al-Rashid by Abdallah ibn Mus'ab al-Zubayri, who died the day of their mutual imprecation {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
