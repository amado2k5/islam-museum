summary:
  ar: "أحمد الجامي، شهاب الدين أبو نصر، صوفي خراساني وشاعر فارسي من قرية نامق بطوس، ولد سنة 441هـ/1049م تقريبًا، وتوفي في خانقاهه بجام في محرم 536هـ/1141م، وله منظومات وكتب بالفارسية، ويلقب «زنده بيل» {cite:encyclopaedia-of-islam-2 vol. 1 p. 305}."
  en: "Ahmad-e Jami, Shihab al-Din Abu Nasr, a Khorasani Sufi and Persian writer, born in the village of Nama in Turshiz about 441/1049–50 and called Zhanda Pil. After a conversion in 463/1070–1 he lived in solitude, and later founded a convent and a mosque at Ma'addabad of Jam, where he died in Muharram 536/1141. His Persian works include Uns al-tainin and Sirat al-sairin {cite:encyclopaedia-of-islam-2 vol. 1 p. 305}."
