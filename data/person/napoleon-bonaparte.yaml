summary:
  ar: "نابليون بونابرت قائد فرنسي نزلت حملته العسكرية غرب الإسكندرية في ليلة 1-2 يوليو 1798 بهدف تهديد الموقف البريطاني في الهند باحتلال مصر. هزم الجيش المملوكي بقيادة مراد بيك في وقعة الأهرام يوم 21 يوليو، وأسس معه علماء الحملة المجمع العلمي المصري، وعاد إلى فرنسا في 23 أغسطس 1799 تاركاً القيادة لكليبر ثم لمنو {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
  en: "Napoleon Bonaparte was the French general whose expeditionary corps landed west of Alexandria on the night of 1-2 July 1798, aiming to threaten the British position in India by occupying Egypt. The Mamluk army under Murad Bey was defeated at the battle of the Pyramids on 21 July, the scholars of the expedition founded the Institut d'Egypte, and Bonaparte returned to France on 23 August 1799, leaving the command to Kleber and then Menou {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
  ur: "نپولین بوناپارٹ وہ فرانسیسی جرنیل تھے جن کی مہم جو فوج یکم و دو جولائی 1798ء کی رات اسکندریہ کے مغرب میں اتری، اور مقصد مصر پر قبضہ کر کے ہندوستان میں برطانوی پوزیشن کو خطرے میں ڈالنا تھا۔ 21 جولائی کو مراد بیگ کی مملوک فوج معرکۂ اہرام میں ہاری، مہم کے علما نے المجمع العلمی المصری قائم کیا، اور بوناپارٹ 23 اگست 1799ء کو فرانس لوٹ گئے اور کمان کلیبر پھر منو کو سونپ گئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
