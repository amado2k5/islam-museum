summary:
  ar: "نابليون بونابرت قائد فرنسي نزلت حملته العسكرية غرب الإسكندرية في ليلة 1-2 يوليو 1798 بهدف تهديد الموقف البريطاني في الهند باحتلال مصر. هزم الجيش المملوكي بقيادة مراد بيك في وقعة الأهرام يوم 21 يوليو، وأسس معه علماء الحملة المجمع العلمي المصري، وعاد إلى فرنسا في 23 أغسطس 1799 تاركاً القيادة لكليبر ثم لمنو {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
  en: "Napoleon Bonaparte was the French general whose expeditionary corps landed west of Alexandria on the night of 1-2 July 1798, aiming to threaten the British position in India by occupying Egypt. The Mamluk army under Murad Bey was defeated at the battle of the Pyramids on 21 July, the scholars of the expedition founded the Institut d'Egypte, and Bonaparte returned to France on 23 August 1799, leaving the command to Kleber and then Menou {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
  ur: "نپولین بوناپارٹ وہ فرانسیسی جرنیل تھے جن کی مہم جو فوج یکم و دو جولائی 1798ء کی رات اسکندریہ کے مغرب میں اتری، اور مقصد مصر پر قبضہ کر کے ہندوستان میں برطانوی پوزیشن کو خطرے میں ڈالنا تھا۔ 21 جولائی کو مراد بیگ کی مملوک فوج معرکۂ اہرام میں ہاری، مہم کے علما نے المجمع العلمی المصری قائم کیا، اور بوناپارٹ 23 اگست 1799ء کو فرانس لوٹ گئے اور کمان کلیبر پھر منو کو سونپ گئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
  es: "Napoleón Bonaparte fue el general francés cuyo cuerpo expedicionario desembarcó al oeste de Alejandría la noche del 1 al 2 de julio de 1798, con el objetivo de amenazar la posición británica en la India mediante la ocupación de Egipto. El ejército mameluco, bajo el mando de Murad Bey, fue derrotado en la batalla de las Pirámides el 21 de julio. Los eruditos de la expedición fundaron el Instituto de Egipto, y Bonaparte regresó a Francia el 23 de agosto de 1799, dejando el mando a Kleber y luego a Menou {cite:encyclopaedia-of-islam-2 vol. 7 p. 204}."
  fr: "Napoléon Bonaparte était le général français dont le corps expéditionnaire débarqua à l'ouest d'Alexandrie dans la nuit du 1er au 2 juillet 1798, dans le but de menacer la position britannique en Inde en occupant l'Égypte. L'armée mamelouke de Murad Bey fut vaincue à la bataille des Pyramides le 21 juillet, les érudits de l'expédition fondèrent l'Institut d'Égypte, et Bonaparte retourna en France le 23 août 1799, laissant le commandement à Kléber puis à Menou."
  tr: "Fransız komutan Napolyon Bonapart, 1-2 Temmuz 1798 gecesi İskenderiye'nin batısında askeri seferini başlattı; amacı Mısır'ı işgal ederek Hindistan'daki İngiliz konumunu tehdit etmekti. 21 Temmuz'da El-Ahram Muharebesi'nde Murad Bey liderliğindeki Memlük ordusunu yendi ve sefer bilginleri onunla birlikte Mısır Bilim Akademisi'ni kurdu. 23 Ağustos 1799'da Fransa'ya döndü, komutayı Kléber'e, ardından Manu'ya bıraktı {cite:Encyclopaedia-of-Islam-2 cilt 7, s. 204}."
  id: "Napoleon Bonaparte, seorang komandan Prancis, melancarkan kampanye militernya di barat Alexandria pada malam 1-2 Juli 1798, dengan tujuan mengancam posisi Inggris di India dengan menduduki Mesir. Ia mengalahkan tentara Mamluk yang dipimpin oleh Murad Bey dalam Pertempuran Al-Ahram pada 21 Juli, dan bersamanya para sarjana kampanye mendirikan Akademi Ilmiah Mesir. Ia kembali ke Prancis pada 23 Agustus 1799, meninggalkan komando kepada Kléber dan kemudian kepada Manu {cite:Encyclopaedia-of-Islam-2 vol. 7, hlm. 204}."
