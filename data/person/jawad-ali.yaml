summary:
  ar: "مؤرخ وأكاديمي عراقي ⁦(1907–1987)⁩ صاحب الموسوعة الكبرى «المفصّل في تاريخ العرب قبل الإسلام» في عشرة أجزاء. درّس في الجامعات العراقية عقودًا، وله مؤلفات في تاريخ الصلاة والمهدي والعرب الجاهليين جمعت بين النقد الأكاديمي وسعة المراجع العربية والأجنبية."
  en: "Iraqi historian and academic (1907–1987), author of the monumental ten-volume Al-Mufassal fi Tarikh al-Arab qabl al-Islam (The Detailed History of the Arabs before Islam). He taught in Iraqi universities for decades and wrote on the history of prayer, the Mahdi and pre-Islamic Arabia, combining academic criticism with a vast range of Arabic and foreign references."
  ur: "عراقی مورخ اور ماہرِ تعلیم ⁦(1907–1987)⁩ جو دس جلدی عظیم تصنیف «المفصل فی تاریخ العرب قبل الاسلام» کے مصنف ہیں۔ انہوں نے عشرہاں برس عراقی جامعات میں تدریس کی اور نماز کی تاریخ، مہدی اور جاہلی عرب پر ایسی کتابیں لکھیں جن میں علمی تنقید اور عربی و غیر عربی مراجع کی وسعت جمع ہوئی۔"
