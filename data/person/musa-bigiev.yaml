  note: "His birth date and place are stated by the English article itself to be disputed, and no reading is followed silently. The readings: the English article's lead gives 25 December 1873, while its text lists 1870, 1875 and 1873 as the opinions; the Urdu article's lead gives 24 September 1873 and its text 24 September 1874, at Rostov; Wikidata carries three values — 24 September 1874, the year 1875, and the year 1878 — with Kikino as birthplace; the Arabic article dates him 1295–1369 AH / 1878–1949 CE, born at Rostov-on-Don. The scholarly literature cited by the English article uses 1875–1949 in its very titles (Kanlidere's 1988 monograph 'Musa Carullah Bigi (1875–1949)'; Akhmetova's 2008 study 'Musa Jerullah Bigiev (1875–1949)'), and the harvest queue also gives 1875; the record therefore follows 1875, at year precision, status debated. The birthplace is likewise disputed — the village of Mishar or Novocherkassk (English article), Rostov (Urdu and Arabic articles), Kikino (Wikidata) — and the museum has no place entity for any of them, so no born_in edge is written. The Hijri year 1292 is the tabular conversion of 1875."
