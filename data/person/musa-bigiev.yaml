summary:
  ar: "عالم وفيلسوف وناشر تاتاري (توفي 1949)، من أبرز مفكري حركة الجديد وأكثرهم إثارة للجدل. تعلّم في مدارس قازان وبخارى والقاهرة، ودرّس في المدرسة الحسينية بأورنبورغ، واعتقلته السلطة السوفيتية سنة 1923، ثم فرّ من الاتحاد السوفيتي سنة 1930 فقضى منفاه متنقلًا وكاتبًا في أوروبا والشرق الأوسط وآسيا، وتوفي في القاهرة."
  en: "Tatar theologian, philosopher and publicist (died 1949), one of the leading and most controversial thinkers of the Jadid movement. Educated at madrasas in Kazan, Bukhara and Cairo, he taught at the Husayniya madrasa in Orenburg, was arrested by the Soviet authorities in 1923, and fled the USSR in 1930, spending his exile travelling and writing across Europe, the Middle East and Asia; he died at Cairo."
  ur: "تاتار عالمِ دین، فلسفی اور مصنف (وفات 1949)، تحریکِ جدید کے نمایاں اور سب سے متنازع مفکرین میں سے ایک۔ قازان، بخارا اور قاہرہ کے مدارس میں تعلیم پائی، اورنبرگ کی مدرسہ حسینیہ میں پڑھایا، 1923 میں سوویت حکومت نے گرفتار کیا، 1930 میں سوویت یونین سے فرار ہو کر جلاوطنی یورپ، مشرقِ وسطیٰ اور ایشیا میں سفر و تصنیف میں گزاری، اور قاہرہ میں وفات پائی۔"
