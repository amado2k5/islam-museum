summary:
  ar: "شاعر ينسب إليه ديوان الحماسة قصيدة «بني عمنا لا تذكروا الشعر بعدما»؛ وتنقل حاشية الطبعة عن البرقي أن هذا الشعر لسويد بن صميع الرندي الحارثي، فنسبته محل خلاف {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  en: "A poet to whom the Diwan al-Hamasa ascribes the poem \"Our cousins, do not mention poetry after\"; the edition's footnote reports from al-Barqi that these verses belong to Suwayd ibn Sumay' al-Rindi al-Harithi, so the attribution is disputed {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
