roles: [poet]
summary:
  ar: "شاعر ينسب إليه ديوان الحماسة قصيدة «بني عمنا لا تذكروا الشعر بعدما»؛ وتنقل حاشية الطبعة عن البرقي أن هذا الشعر لسويد بن صميع الرندي الحارثي، فنسبته محل خلاف {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  en: "A poet to whom the Diwan al-Hamasa ascribes the poem \"Our cousins, do not mention poetry after\"; the edition's footnote reports from al-Barqi that these verses belong to Suwayd ibn Sumay' al-Rindi al-Harithi, so the attribution is disputed {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  es: "Un poeta al que el Diwan al-Hamasa atribuye el poema \"Nuestros primos, no mencionen la poesía después\"; la nota a pie de página de la edición informa, según al-Barqi, que estos versos pertenecen a Suwayd ibn Sumay' al-Rindi al-Harithi, por lo que la atribución es discutida."
  fr: "Un poète auquel le Diwan al-Hamasa attribue le poème « Nos cousins, ne parlez plus de poésie »; la note de bas de page de l'édition rapporte d'al-Barqi que ces vers appartiennent à Suwayd ibn Sumay' al-Rindi al-Harithi, l'attribution est donc contestée {{cite:hamasa-abu-tammam-ed-1916 p.30}}."
  ur: "ایک شاعر جس کے لیے دیوان الحمسہ نے نظم منسوب کی ہے \"ہمارے کزن، شاعری کا تذکرہ بعد میں نہ کریں\"؛ ایڈیشن کا حاشیہ البرقی سے رپورٹ کرتا ہے کہ یہ آیات سوید بن سمیع الرندی الحارثی سے تعلق رکھتی ہیں، لہٰذا انتساب متنازعہ ہے {{حوالہ: حماسہ ابو تمم ایڈ-1916 صفحہ 30}}۔"
