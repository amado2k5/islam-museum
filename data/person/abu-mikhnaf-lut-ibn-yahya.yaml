label: { ar: "أبو مخنف لوط بن يحيى", en: "Abu Mikhnaf Lut ibn Yahya", fr: "Abu Mikhnaf Lut ibn Yahya", es: "Abu Mikhnaf Lut ibn Yahya", ur: "ابو مخنف لوط بن یحیی۔" }
summary:
  ar: "الأخباري الكوفي صاحب كتب المغازي والفتن، من الذين اعتمد عليهم المسعودي في تعديد قتلى صفين فروى عنه وعن الهيثم بن عدي والشرقي بن القطامي تقدير السبعين ألفاً من الفريقين {cite:muruj-al-dhahab p. 684}."
  en: "The Kufan akhbari of the maghazi and fitna books — one of Mas'udi's three authorities for the seventy-thousand Siffin toll {cite:muruj-al-dhahab p. 684}."
  fr: "L'akhbari koufien des livres de maghazi et de fitna — l'une des trois autorités d'al-Mas'udi pour le bilan de soixante-dix mille morts à Siffin {cite:muruj-al-dhahab p. 684}."
  es: "El Kufan akhbari de los libros maghazi y fitna, una de las tres autoridades de Mas'udi para el peaje de setenta mil Siffin {citar:muruj-al-dhahab p. 684}."
  ur: "مستضعفین اور فتنہ کتب کی کوفان اخباری - ستر ہزار صفین کے لیے مسعودی کے تین حکام میں سے ایک۔ 684}۔"
  tr: "Savaşlar ve musibetler üzerine kitaplar yazmış olan el-Akhbari el-Kufi, el-Mas'udi'nin Siffin'deki ölü sayısını belirlerken dayandığı kişilerden biriydi. El-Mas'udi, ondan, el-Haytham ibn Adi ve el-Şarki ibn el-Katami'den her iki taraftan yetmiş bin civarında ölü olduğunu rivayet etmiştir. {kaynak: Muruj-al-Dhahab s. 684}"
  id: "Al-Akhbari al-Kufi, penulis buku-buku tentang pertempuran dan cobaan, adalah salah satu orang yang diandalkan oleh al-Mas’udi dalam menghitung jumlah korban tewas di Siffin. Ia meriwayatkan darinya, dan dari al-Haytham ibn Adi dan al-Sharqi ibn al-Qatami, perkiraan tujuh puluh ribu dari kedua belah pihak {kutip:muruj-al-dhahab hlm. 684}."
