summary:
  ar: صحابي من بني عبد الدار من قريش، قيل اسمه عمرو وقيل عبيد ربه؛ روى عن النبي، وروى عنه زفر بن أوس بن الحدثان والأسود بن يزيد النخعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  en: A Companion of the Prophet from Quraysh, of Banu Abd al-Dar; his name is given as Amr or Ubayd Rabbih; he transmitted from the Prophet and was transmitted by Zufar ibn Aws and al-Aswad ibn Yazid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  ur: قریش کے بنو عبد الدار کے صحابی؛ نام عمرو یا عبید ربہ کہا گیا؛ نبی سے روایت کی اور ان سے زفر بن اوس اور الاسود بن یزید نے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
