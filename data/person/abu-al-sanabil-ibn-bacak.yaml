label:
  ar: أبو السنابل بن بعكك العبدري
  en: Abu al-Sanabil ibn Ba'kak al-Abdari (Companion)
  ur: "أبو السنابل بن بعكك العبدري"
  fr: "Abu al-Sanabil ibn Ba'kak al-Abdari (Compagnon)"
  es: "Abu al-Sanabil ibn Ba'kak al-Abdari (Companion)"
summary:
  ar: صحابي من بني عبد الدار من قريش، قيل اسمه عمرو وقيل عبيد ربه؛ روى عن النبي، وروى عنه زفر بن أوس بن الحدثان والأسود بن يزيد النخعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  en: A Companion of the Prophet from Quraysh, of Banu Abd al-Dar; his name is given as Amr or Ubayd Rabbih; he transmitted from the Prophet and was transmitted by Zufar ibn Aws and al-Aswad ibn Yazid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  ur: قریش کے بنو عبد الدار کے صحابی؛ نام عمرو یا عبید ربہ کہا گیا؛ نبی سے روایت کی اور ان سے زفر بن اوس اور الاسود بن یزید نے روایت کی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}
  fr: "Compagnon du Prophète issu de Quraysh, des Banu Abd al-Dar ; son nom est donné comme Amr ou Ubayd Rabbih ; il transmit du Prophète, et Zufar ibn Aws et al-Aswad ibn Yazid transmirent de lui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}"
  es: "Un compañero del Profeta de la tribu Quraysh, de Banu Abd al-Dar; su nombre aparece como Amr o Ubayd Rabbih; transmitió enseñanzas del Profeta y fueron transmitidas por Zufar ibn Aws y al-Aswad ibn Yazid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}"
  tr: "Kureyş kabilesinin Beni Abdülder boyundan, Peygamberimizin sahabelerinden biri olan ve adının Amr veya Ubeyd Rabbe olduğu söylenen kişi; Peygamberimizden hadisler rivayet etmiş, Zufar ibn Evs ibn el-Hadathan ve el-Esved ibn Yazid el-Nakha'i de ondan hadisler rivayet etmişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7834}"
  id: "Seorang sahabat Nabi dari klan Banu Abd al-Dar dari suku Quraisy, yang namanya konon adalah Amr atau Ubayd Rabbah; ia meriwayatkan hadits dari Nabi, dan Zufar ibn Aws ibn al-Hadathan dan al-Aswad ibn Yazid al-Nakha'i meriwayatkan hadits darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7834}"
