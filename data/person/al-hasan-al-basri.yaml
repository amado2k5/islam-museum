id: person/al-hasan-al-basri
education:
  did_you_know:
    ar: "الحسن البصري ابن يسار واسم أبيه قيروز، كان من سبي ميسان فصار للربيع بنت النضر عمة أنس فأعتقته، وصار من أعلام التابعين وعلمائهم."
    en: "Al-Hasan al-Basri, son of Yasar whose name was Fayruz, was taken among the captives of Maysan and came to al-Rabi' bint al-Nadr, Anas's aunt, who freed him — and he grew into one of the most eminent of the Successors."
    ur: "حسن بصری، یسار کے بیٹے جن کا نام فیروز تھا، میساں کے قیدیوں میں سے تھے اور انس کی خالہ ربیع نے آزاد کیا، اور وہ تابعین کے بزرگ علما میں شمار ہوئے۔"
    sources: [source/tabaqat-ibn-sad, source/encyclopaedia-of-islam-2]
class: person
tags: [madhahib-browser, mh-salaf, jinn-devils-browser, jd-devils]
label: { ar: "أبو الحسن البصري", en: "Abu al-Hasan al-Basri", es: "Abu al-Hasan al-Basri", fr: "Abu al-Hasan al-Basri", ur: "ابو الحسن البصری۔" }
summary:
  ar: "واعظ مشهور في البصرة من التابعين في العصر الأموي، تذكر دائرة المعارف الإسلامية أنه عاش بين 21هـ/642م و110هـ/728م، وأن شهرته قامت على صدق شخصيته وعلى خطبه وأقواله في الزهد والتحذير من الدنيا. وتذكر أنه انتقد حكام العراق دون خوف لكنه لم يرض بالخروج عليهم، وأنه اتُّهم بمذهب القدر، وأن أهل السنة والمعتزلة والصوفية عدّوه منهم. أبو الحسن البصري الحسن بن يسار وكان اسم أبيه قيروز؛ كان من سبي ميسان هو وأخوه سعيد فصار لامرأة من الأنصار الربيع بنت النضر عمة أنس بن مالك ويقال جميلة امرأة أنس من بني سلمة فاعتقتهما فقال فولاؤنا لها وكان مولده بالمدينة سنتين بقيتا من خلافة عمر وخرج منها بعد صفين بسنة ومات بالبصرة سنة عشر ومائة وهو ابن تسع وثمانين سنة. وعند المسعودي بعث إليه عمر بن هبيرة سنة ثلاث ومائة مع الشعبي وابن سيرين فقال ابن سيرين والشعبي قولاً فيه تقية وقال الحسن خف الله في يزيد ولا تخف يزيد في الله إن الله يمنعك من يزيد وإن يزيد لا يمنعك من الله وأوشك أن يبعث إليك ملكاً فيزيلك عن سريرك ويخرجك من سعة قصرك إلى ضيق قبرك فلا تتركن دين الله وعباده بسلطان الله فإنه لا طاعة لمخلوق في معصية الخالق، فأضعف ابن هبيرة جائزته فقال الشعبي سفسفنا فسفسكت لنا {cite:muruj-al-dhahab p. 190}. وتوفي سنة عشر ومائة وله تسع وثمانون سنة وقيل تسعون واسم أبيه يسار مولى لامرأة من الأنصار {cite:muruj-al-dhahab p. 192}، وعند ابن النديم ولد لسنتين بقيتا من خلافة عمر وتوفي وله تسع وثمانون سنة سنة عشر ومائة، وكان يكتب للربيع بن زياد بخراسان ولأنس بن مالك بسابور، وكان ممن بايع لابن الأشعث فلما هزم دخل على الحجاج فعاتبه وأمنه ثم توارى حتى مات، ومن كتبه كتاب التفسير للقرآن وكتاب إلى عبد الملك بن مروان في الرد على القدرية {cite:fihrist-ibn-al-nadim p. 558-559}"
  en: "A famous preacher of Basra among the Successors in the Umayyad period. The Encyclopaedia of Islam gives his years as 21/642 to 110/728 and says his fame rests on his sincere character and on sermons and sayings that warned against worldliness. It reports that he criticised the governors of Iraq without fear yet disapproved of rebelling against them, that he was accused of Qadari doctrine, and that Sunnis, Mu'tazilis and Sufis each claimed him as their own. Born at Medina two years before Umar's end per al-Mas'udi; he died at Basra in 110 aged eighty-nine."
  ur: "بصرہ کے مشہور واعظ جو اموی دور میں تابعین میں سے تھے۔ اسلامی دائرۃ المعارف ان کے سال 21ھ/642ء سے 110ھ/728ء بتاتی ہے اور کہتی ہے کہ ان کی شہرت ان کی دینی شخصیت کے اخلاص اور دنیا داری سے خبردار کرنے والے خطبوں اور اقوال پر قائم ہے۔ وہ بتاتی ہے کہ انھوں نے عراق کے گورنروں پر بے خوفی سے تنقید کی مگر ان کے خلاف بغاوت کو ناپسند کیا، ان پر قدری ہونے کا الزام لگا، اور اہل سنت، معتزلہ اور صوفیہ سب نے انھیں اپنا سمجھا۔"
  es: "Un famoso predicador de Basora entre los Sucesores del período Omeya. La Enciclopedia del Islam sitúa su vida entre el 21/642 y el 110/728 y afirma que su fama se basa en su carácter sincero y en sermones y dichos que advertían contra el mundanismo. Relata que criticó a los gobernadores de Irak sin temor, pero desaprobó la rebelión contra ellos; que fue acusado de doctrina qadarí; y que suníes, mutazilíes y sufíes lo consideraban uno de los suyos. Nació en Medina dos años antes del fin de Umar, según al-Mas'udi; murió en Basora en el año 110 a la edad de ochenta y nueve años."
  fr: "Prédicateur renommé de Bassora parmi les successeurs de la dynastie omeyyade, il vécut de 21/642 à 110/728 selon l'Encyclopédie de l'Islam. Sa renommée repose sur sa sincérité et sur des sermons et des paroles mettant en garde contre les vices du monde. Il aurait critiqué sans crainte les gouverneurs d'Irak tout en désapprouvant toute rébellion, aurait été accusé de suivre la doctrine qadari, et aurait été revendiqué comme l'un des leurs par les sunnites, les mu'tazilites et les soufis. Né à Médine deux ans avant la mort d'Omar, selon al-Mas'udi, il mourut à Bassora en 110, à l'âge de quatre-vingt-neuf ans."
  tr: "Emevi döneminde takipçilerinden Basra'da ünlü bir vaizdir. İslam Ansiklopedisi, onun 21 Hicri/642 ile 110 HIC/728 yılları arasında yaşadığını ve ününün kişiliğinin, vaazlarının ve münzeviyetle ilgili açıklamalarının ve dünyevi meselelere karşı uyarı vermesinin temelinde olduğunu kaydeder. Irak yöneticilerini korkusuzca eleştirdiği ancak onlara karşı isyanı kabul etmediği, kaderle suçlandığı ve Sünniler, Mu'tazililer ve Sufilerin onun düşmanları olduğu belirtilir. Ebu el-Hasan Babası Qayruz olan el-Basri el-Hasan bin Yasar; kardeşi Seyid ile birlikte Maysan'ın esiri idi. Anas ibn Malik'in teyzesi el-Nadr'ın kızı Ensar'ın evi oldu ve Jamila'nın Banu Salama'dan Anas'ın eşi olduğu söylenir. Onları serbest bıraktı ve 'Biz onun hizmetkarlarıyız' dedi. Emine, Ömer'in halifeliğinden iki yıl sonra Medine'de doğdu, Siffin'den bir yıl sonra oradan ayrıldı ve 100 Hicri yılında, seksen dokuz yaşında Basra'da öldü. El-Mes'udi'ye göre, Ömer bin Hubayre onu 103 Hicri yılında el-Şa'bi ve İbn Sirin ile birlikte göndermiştir. İbn Sirin ve el-Şa'bi tekiye hakkında bir açıklama yapmıştır. El-Hasan şöyle dedi: 'Yezid'den kork ve Allah'tan korkma. Gerçekten Allah seni Yezid'den uzak tutar, eğer Yezid seni Allah'tan alıkoymazsa, seni yatağından çıkaracak ve sarayının enginliğinden mezarının dar köşesine çıkaracak bir melek gönderecek. Bu yüzden Allah'ın dinini ve kullarını Allah'ın yetkisi altına bırakma, çünkü yaratılmış hiçbir varlığa itaat Yaratıcı'ya itaatsizlik yoktur.' İbn Hubayre otoritesini zayıflattı ve el-Şa'bi şöyle dedi: 'Biz dikkatsiz davrandık, bu yüzden bizim için sessiz kaldın.' {atı:Muruj-al-Dhahab, s. 190}. 110 Hicri yılında, seksen dokuz yaşında öldü, bazıları ise doksan yaşında olduğunu söyler. Babası Yasar'dı, Ensar'dan bir kadının özgür bırakılmış adamıydı {atıf: Muruj-al-Dhahab, s. 192}. İbn el-Nadim ile birlikte doğdu, Ömer halifeliğinden iki yıl sonra ve 100 Hicri yılında, seksen dokuz yaşında öldü. Horasan'da El-Rabi' bin Ziyad'a ve Sabur'da Anas ibn Malik'e yazdı. İbn el-Eşat'a bağlılık yemini edenler arasındaydı. Yenildiğinde el-Hacac'a gitti, onu azarladı, güvenini kazandı ve sonra ölene kadar saklandı. Kitapları arasında Kur'an üzerine tefsir kitabı ve Abdülmelik ibn Mervan'a Kadriyet'i çürüten bir mektup yer alır {atıf:fihrist-ibn-al-nadim s. 558-559}"
  id: "Seorang pengkhotbah terkenal di Basra dari para pengikut pada era Umayyah. Ensiklopedia Islam mencatat bahwa ia hidup antara tahun 21 H/642 M dan 110 H/728 M, dan ketenarannya didasarkan pada kesungguhan kepribadiannya, khotbahnya, serta pernyataannya tentang asketisme dan peringatan terhadap hal-hal duniawi. Disebutkan bahwa ia mengkritik para penguasa Irak tanpa rasa takut tetapi tidak menerima pemberontakan terhadap mereka, dan bahwa ia dituduh telah ditakdirkan, dan bahwa Sunni, Mu'tazilit, dan Sufi adalah musuhnya. Abu al-Hasan al-Basri al-Hasan ibn Yasar, yang ayahnya bernama Qayruz; ia adalah tawanan Maysan, bersama saudaranya Sa'id. Ia menjadi istri Ansar, putri al-Nadr, bibi Anas ibn Malik, dan dikatakan bahwa Jamila adalah istri Anas dari Banu Salama. Ia membebaskan mereka dan berkata, 'Kami adalah hambanya.' Ia lahir di Madinah dua tahun setelah kekhalifahan Umar, dan meninggalkannya setelah Siffin setahun lalu meninggal di Basra pada tahun 100 H, pada usia delapan puluh sembilan tahun. Menurut al-Mas'udi, Umar ibn Hubayrah mengirimnya pada tahun 103 H bersama al-Sha'bi dan Ibn Sirin. Ibn Sirin dan al-Sha'bi mengucapkan pernyataan tentang taqiyya. Al-Hasan berkata: 'Takutlah Allah mengenai Yazid dan janganlah takut pada Yazid demi Allah. Memang, Allah menghalangi kamu dari Yazid, dan jika Yazid tidak menghalangimu dari Allah, Dia akan mengirim malaikat untuk membawamu keluar dari ranjangmu dan membawamu keluar dari luasnya istana ke kubur sempitmu. Jadi janganlah meninggalkan agama Allah dan hamba-hamba-Nya di bawah otoritas Allah, karena tidak ada ketaatan kepada makhluk ciptaan yang tidak taat kepada Pencipta.' Ibn Hubayrah melemahkan otoritasnya, dan al-Sha'bi berkata: 'Kami telah ceroboh, sehingga engkau diam demi kami.' {cite:muruj-al-dhahab, hlm. 190}. Ia meninggal pada tahun 110 H pada usia delapan puluh sembilan tahun, dan beberapa mengatakan sembilan puluh. Nama ayahnya adalah Yasar, seorang mantan wanita dari Ansar {cite:Muruj-al-Dhahab, hlm. 192}. Ia lahir bersama Ibn al-Nadim selama dua tahun tersisa dari kekhalifahan Umar dan meninggal pada usia delapan puluh sembilan tahun di tahun 100 H. Ia menulis kepada Al-Rabi' ibn Ziyad di Khurasan dan kepada Anas ibn Malik di Sabur. Ia termasuk di antara mereka yang bersumpah setia kepada Ibn al-Ash'ath. Ketika ia kalah, ia pergi ke al-Hajjaj, menegurnya, mengamankan kepercayaannya, lalu bersembunyi hingga ia meninggal. Di antara bukunya adalah kitab tafsir Al-Qur'an dan surat kepada Abd al-Malik ibn Marwan yang membantah Qadriyyah {cite:fihrist-ibn-al-nadim hlm. 558-559}"
