id: person/al-hasan-al-basri
education:
  did_you_know:
    ar: "الحسن البصري ابن يسار واسم أبيه قيروز، كان من سبي ميسان فصار للربيع بنت النضر عمة أنس فأعتقته، وصار من أعلام التابعين وعلمائهم."
    en: "Al-Hasan al-Basri, son of Yasar whose name was Fayruz, was taken among the captives of Maysan and came to al-Rabi' bint al-Nadr, Anas's aunt, who freed him — and he grew into one of the most eminent of the Successors."
    ur: "حسن بصری، یسار کے بیٹے جن کا نام فیروز تھا، میساں کے قیدیوں میں سے تھے اور انس کی خالہ ربیع نے آزاد کیا، اور وہ تابعین کے بزرگ علما میں شمار ہوئے۔"
    sources: [source/tabaqat-ibn-sad, source/encyclopaedia-of-islam-2]
