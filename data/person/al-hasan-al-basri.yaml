summary:
  ar: "أبو الحسن البصري الحسن بن يسار وكان اسم أبيه قيروز؛ كان من سبي ميسان هو وأخوه سعيد فصار لامرأة من الأنصار الربيع بنت النضر عمة أنس بن مالك ويقال جميلة امرأة أنس من بني سلمة فاعتقتهما فقال فولاؤنا لها وكان مولده بالمدينة سنتين بقيتا من خلافة عمر وخرج منها بعد صفين بسنة ومات بالبصرة سنة عشر ومائة وهو ابن تسع وثمانين سنة."
  en: "Abu al-Hasan al-Basri, al-Hasan ibn Yasar — his father once Qayruz; of Maysan's captives with his brother Sa'id, falling to the Ansari al-Rabi' bint al-Nadr or Jamila Anas's wife who freed them — 'our wala' is hers'. Born at Medina two years before Umar's end, left it a year after Siffin, died at Basra in 110 aged eighty-nine."
