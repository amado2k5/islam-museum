label: { ar: "أبو الحسن البصري", en: "Abu al-Hasan al-Basri" }
summary:
  ar: "واعظ مشهور في البصرة من التابعين في العصر الأموي، تذكر دائرة المعارف الإسلامية أنه عاش بين 21هـ/642م و110هـ/728م، وأن شهرته قامت على صدق شخصيته وعلى خطبه وأقواله في الزهد والتحذير من الدنيا. وتذكر أنه انتقد حكام العراق دون خوف لكنه لم يرض بالخروج عليهم، وأنه اتُّهم بمذهب القدر، وأن أهل السنة والمعتزلة والصوفية عدّوه منهم. أبو الحسن البصري الحسن بن يسار وكان اسم أبيه قيروز؛ كان من سبي ميسان هو وأخوه سعيد فصار لامرأة من الأنصار الربيع بنت النضر عمة أنس بن مالك ويقال جميلة امرأة أنس من بني سلمة فاعتقتهما فقال فولاؤنا لها وكان مولده بالمدينة سنتين بقيتا من خلافة عمر وخرج منها بعد صفين بسنة ومات بالبصرة سنة عشر ومائة وهو ابن تسع وثمانين سنة. وعند المسعودي بعث إليه عمر بن هبيرة سنة ثلاث ومائة مع الشعبي وابن سيرين فقال ابن سيرين والشعبي قولاً فيه تقية وقال الحسن خف الله في يزيد ولا تخف يزيد في الله إن الله يمنعك من يزيد وإن يزيد لا يمنعك من الله وأوشك أن يبعث إليك ملكاً فيزيلك عن سريرك ويخرجك من سعة قصرك إلى ضيق قبرك فلا تتركن دين الله وعباده بسلطان الله فإنه لا طاعة لمخلوق في معصية الخالق، فأضعف ابن هبيرة جائزته فقال الشعبي سفسفنا فسفسكت لنا {cite:muruj-al-dhahab p. 190}. وتوفي سنة عشر ومائة وله تسع وثمانون سنة وقيل تسعون واسم أبيه يسار مولى لامرأة من الأنصار {cite:muruj-al-dhahab p. 192}، وعند ابن النديم ولد لسنتين بقيتا من خلافة عمر وتوفي وله تسع وثمانون سنة سنة عشر ومائة، وكان يكتب للربيع بن زياد بخراسان ولأنس بن مالك بسابور، وكان ممن بايع لابن الأشعث فلما هزم دخل على الحجاج فعاتبه وأمنه ثم توارى حتى مات، ومن كتبه كتاب التفسير للقرآن وكتاب إلى عبد الملك بن مروان في الرد على القدرية {cite:fihrist-ibn-al-nadim p. 558-559}"
  en: "A famous preacher of Basra among the Successors in the Umayyad period. The Encyclopaedia of Islam gives his years as 21/642 to 110/728 and says his fame rests on his sincere character and on sermons and sayings that warned against worldliness. It reports that he criticised the governors of Iraq without fear yet disapproved of rebelling against them, that he was accused of Qadari doctrine, and that Sunnis, Mu'tazilis and Sufis each claimed him as their own. Born at Medina two years before Umar's end per al-Mas'udi; he died at Basra in 110 aged eighty-nine."
  ur: "بصرہ کے مشہور واعظ جو اموی دور میں تابعین میں سے تھے۔ اسلامی دائرۃ المعارف ان کے سال 21ھ/642ء سے 110ھ/728ء بتاتی ہے اور کہتی ہے کہ ان کی شہرت ان کی دینی شخصیت کے اخلاص اور دنیا داری سے خبردار کرنے والے خطبوں اور اقوال پر قائم ہے۔ وہ بتاتی ہے کہ انھوں نے عراق کے گورنروں پر بے خوفی سے تنقید کی مگر ان کے خلاف بغاوت کو ناپسند کیا، ان پر قدری ہونے کا الزام لگا، اور اہل سنت، معتزلہ اور صوفیہ سب نے انھیں اپنا سمجھا۔"
