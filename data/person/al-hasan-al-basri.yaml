label: { ar: "أبو الحسن البصري", en: "Abu al-Hasan al-Basri" }
summary:
  ar: "أبو الحسن البصري الحسن بن يسار وكان اسم أبيه قيروز؛ كان من سبي ميسان هو وأخوه سعيد فصار لامرأة من الأنصار الربيع بنت النضر عمة أنس بن مالك ويقال جميلة امرأة أنس من بني سلمة فاعتقتهما فقال فولاؤنا لها وكان مولده بالمدينة سنتين بقيتا من خلافة عمر وخرج منها بعد صفين بسنة ومات بالبصرة سنة عشر ومائة وهو ابن تسع وثمانين سنة. وعند المسعودي بعث إليه عمر بن هبيرة سنة ثلاث ومائة مع الشعبي وابن سيرين فقال ابن سيرين والشعبي قولاً فيه تقية وقال الحسن خف الله في يزيد ولا تخف يزيد في الله إن الله يمنعك من يزيد وإن يزيد لا يمنعك من الله وأوشك أن يبعث إليك ملكاً فيزيلك عن سريرك ويخرجك من سعة قصرك إلى ضيق قبرك فلا تتركن دين الله وعباده بسلطان الله فإنه لا طاعة لمخلوق في معصية الخالق، فأضعف ابن هبيرة جائزته فقال الشعبي سفسفنا فسفسكت لنا {cite:muruj-al-dhahab p. 190}. وتوفي سنة عشر ومائة وله تسع وثمانون سنة وقيل تسعون واسم أبيه يسار مولى لامرأة من الأنصار {cite:muruj-al-dhahab p. 192}، وعند ابن النديم ولد لسنتين بقيتا من خلافة عمر وتوفي وله تسع وثمانون سنة سنة عشر ومائة، وكان يكتب للربيع بن زياد بخراسان ولأنس بن مالك بسابور، وكان ممن بايع لابن الأشعث فلما هزم دخل على الحجاج فعاتبه وأمنه ثم توارى حتى مات، ومن كتبه كتاب التفسير للقرآن وكتاب إلى عبد الملك بن مروان في الرد على القدرية {cite:fihrist-ibn-al-nadim p. 558-559}"
  en: "Abu al-Hasan al-Basri, al-Hasan ibn Yasar — his father once Qayruz; of Maysan's captives with his brother Sa'id, falling to the Ansari al-Rabi' bint al-Nadr or Jamila Anas's wife who freed them — 'our wala' is hers'. Born at Medina two years before Umar's end, left it a year after Siffin, died at Basra in 110 aged eighty-nine."
