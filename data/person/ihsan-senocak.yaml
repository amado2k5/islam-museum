summary:
  ar: "واعظ وباحث وكاتب تركي، وُلد في 5 يوليو 1974 في صامسون، ودرس في كلية الإلهيات بجامعة أوندوكوز مايس حيث نال الماجستير والدكتوراه في الفقه الإسلامي، وخدم في رئاسة الشؤون الدينية، وأسّس مركز إفام للدراسات العلمية والفكرية حيث يدرّس التفسير والحديث والفقه والعقيدة. بلغت قناته على يوتيوب 668,000 مشترك كما في 15 نوفمبر 2026 بحسب vidIQ، وهو عدد منصّة مؤرخ لا حقيقة متحقق منها متحفيًا."
  en: "Turkish preacher, researcher and writer, born on 5 July 1974 in Samsun. He studied at Ondokuz Mayıs University's theology faculty, where he took his master's and doctorate in Islamic law, served in the Presidency of Religious Affairs, and founded the İFAM research centre, where he teaches tafsir, hadith, fiqh and aqida. His YouTube channel counted 668,000 subscribers as of 15 November 2026 per vidIQ — a dated platform count, not a museum-verified fact."
  ur: "ترک واعظ، محقق اور مصنف، جو 5 جولائی 1974ء کو صامسون میں پیدا ہوئے، اوندوکوز مایس یونیورسٹی کے شعبۂ الہیات میں پڑھے جہاں اسلامی قانون میں ماسٹرز اور ڈاکٹریٹ کیا، صدارتِ مذہبی امور میں خدمات انجام دیں، اور ایفام تحقیقی مرکز قائم کیا جہاں وہ تفسیر، حدیث، فقہ اور عقیدہ پڑھاتے ہیں۔ vidIQ کے مطابق 15 نومبر 2026ء کو ان کے یوٹیوب چینل کے سبسکرائبر 668,000 تھے — یہ ایک مؤرخہ منصّہ عدد ہے، عجائب گھر کی تصدیق شدہ حقیقت نہیں۔"
  es: "Predicador, investigador y escritor turco, nacido el 5 de julio de 1974 en Samsun. Estudió en la facultad de teología de la Universidad Ondokuz Mayıs, donde obtuvo su maestría y doctorado en derecho islámico. Fue miembro de la Presidencia de Asuntos Religiosos y fundó el centro de investigación İFAM, donde imparte clases de tafsir, hadiz, fiqh y aqida. Su canal de YouTube contaba con 668 000 suscriptores al 15 de noviembre de 2026, según vidIQ (dato desactualizado de la plataforma, no verificado por ningún museo)."
  fr: "Prédicateur, chercheur et écrivain turc, né le 5 juillet 1974 à Samsun. Il a étudié à la faculté de théologie de l'université Ondokuz Mayıs, où il a obtenu une maîtrise et un doctorat en droit islamique. Il a également travaillé à la Direction des affaires religieuses et fondé le centre de recherche İFAM, où il enseigne le tafsir, le hadith, le fiqh et l'aqida. Sa chaîne YouTube comptait 668 000 abonnés au 15 novembre 2026 selon vidIQ – un chiffre ancien, non vérifié par un musée."
