  ur: "مدینہ کے حسینی علوی جن کی زبانی طور پر ابو طالب نسب مسعودی نے سنا اور اسے الزبیر بن بکر کی کتاب پر ترجیح دی۔ 62}۔"
  tr: "Peygamber El-Mes'udi şehrindeki Alawi Husayni, ondan Ebu Talib ailesinin soyağacı ve bu alandaki El-Zubeyr bin Bakkar'ın kitabına üstünlüğü üzerine bir kitap duymuştur {atıf:Muruj-al-Dhahab, s. 62}."
  id: "Alawi Husayni di kota Nabi Al-Mas'udi mendengar darinya sebuah buku tentang silsilah keluarga Abu Talib dan keunggulannya atas kitab Al-Zubayr ibn Bakkar dalam bidang ini {cite:muruj-al-dhahab, hlm. 62}."
