summary:
  ar: "طبيب ماليزي ورائد فضاء، وُلد في كوالالمبور سنة 1972 لأبوين ماليزيين من أصول مصرية بعيدة، عمل ضابطا طبيا في جراحة العظام، واختير من بين آلاف المتقدمين لبرنامج أنغكاساوان الماليزي، فطار في أكتوبر 2007 على متن سويوز إلى محطة الفضاء الدولية، حيث أجرى تجارب علمية وصام أواخر رمضان واحتفل بعيد الفطر في المدار، بعد أن أصدر مجلس الفتوى الوطني الماليزي أول دليل شامل لأداء العبادات في الفضاء."
  en: "Malaysian physician and astronaut, born in Kuala Lumpur in 1972 to Malay parents of distant Egyptian roots, who worked as an orthopaedic medical officer, was selected from thousands of applicants for Malaysia's Angkasawan programme, and flew in October 2007 aboard Soyuz to the International Space Station, where he ran scientific experiments and fasted the last days of Ramadan and celebrated Eid al-Fitr in orbit, after Malaysia's National Fatwa Council issued the first comprehensive guidebook for performing Islamic rites in space."
  ur: "ملائیشیائی معالج اور خلانورد، جو 1972 میں کوالالمپور میں مصری جڑوں والے ملائی والدین کے ہاں پیدا ہوئے، بطور آرتھوپیڈک میڈیکل آفیسر کام کیا، ملائیشیا کے انگکاساوان پروگرام کے لیے ہزاروں درخواست گزاروں میں سے منتخب ہوئے، اور اکتوبر 2007 میں سویوز کے ذریعے بین الاقوامی خلائی اسٹیشن گئے، جہاں انہوں نے سائنسی تجربات کیے اور رمضان کے آخری دنوں کے روزے رکھ کر مدار میں عید الفطر منائی، جبکہ ملائیشیا کی قومی فتویٰ کونسل نے خلا میں عبادت کے لیے پہلی جامع رہنما کتاب جاری کی تھی۔"
