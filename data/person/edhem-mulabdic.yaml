summary:
  ar: "كاتب ومربٍّ بوسني من ماغلاي، شارك في تأسيس مجلة «بهار» (1900) وجمعية «غيرت» (1903)، ودرّس في سراييفو وعمل نائباً عن ماغلاي حتى 1929، وصاحب رواية «زيلينو بوسينيي» (1898) التي تُعد أول رواية لبوسني مسلم."
  en: "Bosnian writer and educator from Maglaj who co-founded the journal Behar (1900) and the Gajret society (1903), taught in Sarajevo and sat as Maglaj's deputy until 1929, and wrote Zeleno busenje (1898), regarded as the first Bosnian Muslim novel."
  ur: "ماغلائی سے تعلق رکھنے والے بوسنیائی ادیب اور معلم، مجلہ «بہار» (1900ء) اور انجمن «غیرت» (1903ء) کے شریک بانی، جنھوں نے سرائیوو میں تدریس کی اور 1929ء تک ماغلائی کے نمائندے رہے، اور ناول «زیلینو بوسینیے» (1898ء) کے مصنف، جسے پہلا بوسنیائی مسلم ناول سمجھا جاتا ہے۔"
