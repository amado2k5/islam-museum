id: person/kathir-ibn-shihab
class: person
label: { ar: "كثير بن شهاب الحارثي", en: "Kathir ibn Shihab al-Harithi" }
summary:
  ar: "كثير بن شهاب بن الحصين بن ذي الغصة الحارثي مقاتل في جيش سعد؛ عند البلاذري حمل على الجالينوس بعد اجتياز الصراة فطعنه ويقال قتله وقال ابن الكلبي قتله زهرة بن حوية وكان عثمانياً يقع في علي بن أبي طالب ويثبط الناس عن الحسين ومات قبيل خروج المختار أو في أول أيامه وقال المختار في سجعه أما ورب السحاب شديد العقاب سريع الحساب منزل الكتاب لأنبشن قبر كثير بن شهاب المفتري الكذاب وكان معاوية ولاه الري ودستبا حيناً من قبل زياد والمغيرة عامليه ثم غضب عليه فحبسه بدمشق وضربه حتى شخص شريح بن هافيء المرادي إليه في أمره فتخلصه وكان يزيد بن معاوية حمد مشايعته واتباعه لهواه فكتب إلى عبيد الله بن زياد في توليته ماسبذان ومهرجانقذف وحلوان والماهين وأقطعه ضياعاً بالجبل فبنى قصره المعروف بقصر كثير وهو من عمل الدينور وكان زياد في سفر فانقطع سفشق قبائه فأخرج إبرة كانت مغروزة في قلنسوته وخيطاً كان معه فأصلح السفشق فقال له زياد أنت حازم وما مثلك يمطل فولاه بعض الجبل."
  en: "Fighter in Sa'd's army; in al-Baladhuri he charged the Jalinus after the crossing of al-Sirat and speared him — or killed him; Ibn al-Kalbi assigns the kill to Zuhra ibn Hawiyya."
