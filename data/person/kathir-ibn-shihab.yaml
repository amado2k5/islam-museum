id: person/kathir-ibn-shihab
class: person
label: { ar: "كثير بن شهاب الحارثي", en: "Kathir ibn Shihab al-Harithi", es: "Kathir ibn Shihab al-Harithi", fr: "Kathir ibn Shihab al-Harithi", ur: "کثیر بن شہاب الحارثی۔" }
summary:
  ar: "كثير بن شهاب بن الحصين بن ذي الغصة الحارثي مقاتل في جيش سعد؛ عند البلاذري حمل على الجالينوس بعد اجتياز الصراة فطعنه ويقال قتله وقال ابن الكلبي قتله زهرة بن حوية وكان عثمانياً يقع في علي بن أبي طالب ويثبط الناس عن الحسين ومات قبيل خروج المختار أو في أول أيامه وقال المختار في سجعه أما ورب السحاب شديد العقاب سريع الحساب منزل الكتاب لأنبشن قبر كثير بن شهاب المفتري الكذاب وكان معاوية ولاه الري ودستبا حيناً من قبل زياد والمغيرة عامليه ثم غضب عليه فحبسه بدمشق وضربه حتى شخص شريح بن هافيء المرادي إليه في أمره فتخلصه وكان يزيد بن معاوية حمد مشايعته واتباعه لهواه فكتب إلى عبيد الله بن زياد في توليته ماسبذان ومهرجانقذف وحلوان والماهين وأقطعه ضياعاً بالجبل فبنى قصره المعروف بقصر كثير وهو من عمل الدينور وكان زياد في سفر فانقطع سفشق قبائه فأخرج إبرة كانت مغروزة في قلنسوته وخيطاً كان معه فأصلح السفشق فقال له زياد أنت حازم وما مثلك يمطل فولاه بعض الجبل."
  en: "Fighter in Sa'd's army; in al-Baladhuri he charged the Jalinus after the crossing of al-Sirat and speared him — or killed him; Ibn al-Kalbi assigns the kill to Zuhra ibn Hawiyya."
  es: "Combatiente en el ejército de Sa'd; en al-Baladhuri cargó contra los Jalinus después de cruzar al-Sirat y lo lanceó, o lo mató; Ibn al-Kalbi atribuye la muerte a Zuhra ibn Hawiyya."
  fr: "Combattant dans l'armée de Sa'd; à al-Baladhuri, il chargea le Jalinus après la traversée d'al-Sirat et le transperça de sa lance — ou le tua; Ibn al-Kalbi attribue ce meurtre à Zuhra ibn Hawiyya."
  ur: "سعد کی فوج میں لڑاکا؛ البلادوری میں اس نے السیرات کو عبور کرنے کے بعد جالینوس پر الزام لگایا اور اسے نیزہ مارا — یا اسے قتل کر دیا۔ ابن کلبی نے قتل کی ذمہ داری زہرہ بن حویہ کو سونپی ہے۔"
  tr: "Kathir ibn Şihab ibn al-Husayn ibn Dhi al-Ghasa al-Harithi, Sa'd'ın ordusunda savaşçıydı; al-Baladhuri'ye göre, el-Sarah'ı geçtikten sonra Jalinus'a saldırdı ve onu bıçakladı, öldürüldüğü söylenir. İbn el-Kalbi, Zuhra ibn Huwayh'in, Ali ibn Ebi Talib ile müttefik olan Osmanlı olan ve insanları el-Hüseyin'den caydıran onu öldürdüğünü söyledi. El-Muhtar'ın ayrılışından önce ya da gençliğinde öldü. El-Muhtar kafiyelerinde şöyle der: 'Bulutların Efendisi adına, cezası sert, hesap vermesi hızlı, kitabın evi iftiracı ve yalancı Kathir ibn Şihab'ın mezarını kazacaktı ve Muaviye Rayi tarafından oraya atandı.' Zaman zaman Ziyad ve Al-Muwhira tarafından vali olarak tutuklandı, sonra ona kızdı, Şam'da hapsetti ve Shurayh ibn Hafi'al-Muradi onun işlerinde görevlendirilene kadar dövdü, böylece Şyurey bin Hafi'l-Muaviye onun işlerinden kurtuldu. Yezid bin Muaviye onun arkadaşlığını ve arzularını takip etmesini övdü. Sabdhan, Mahrjanqazf, Helwan ve Al-Mahin şehirlerindeki yönetimi hakkında Ubeyd Allah ibn Ziyad'a yazdı ve burayı dağlarda bir yerleşim olarak böldü. Dinur'un eserlerinden biri olan Qasr Kathir adlı sarayını inşa etti. Ziyad yolculuk ederken şapkasının fırını kırıldı. Şapkasına saplanmış bir iğne ve elindeki bir iplik çıkardı. El-Safshaqı tamir etti. Ziyad ona, 'Sen sağlamsın, senin gibi biri geciktiremez.' dedi. Dağın bir kısmını onun için aldı."
  id: "Kathir ibn Shihab ibn al-Husayn ibn Dhi al-Ghasa al-Harithi adalah pejuang dalam pasukan Sa'd; menurut al-Baladhuri, ia menyerang Jalinus setelah menyeberangi al-Sarah dan menikamnya, dan dikatakan ia tewas. Ibn al-Kalbi mengatakan Zuhra ibn Huwayh membunuhnya, yang merupakan seorang Ottoman yang bersekutu dengan Ali ibn Abi Talib dan membuat rakyat enggan meninggalkan al-Husayn. Ia meninggal sebelum al-Mukhtar pergi atau di masa mudanya. Al-Mukhtar berkata dalam rimanya: 'Demi Tuhan awan, yang keras dalam hukuman, cepat dalam perhitungan, rumah kitab itu harus menggali makam Kathir ibn Shihab, si pencenah nama baik dan pembohong, dan Muawiyah ditunjuk sebagai pengawasnya oleh Rayy.' Kadang-kadang, ia ditangkap oleh Ziyad dan Al-Mughira sebagai gubernurnya, lalu marah padanya, memenjarakannya di Damaskus, dan memukulinya sampai Shurayh ibn Hafi' al-Muradi diangkat menjadi pengurus dalam urusannya, dan ia dibebaskan dari itu. Yazid ibn Muawiyah memuji kebersamaannya dan mengikuti keinginannya. Ia menulis kepada Ubayd Allah ibn Ziyad mengenai masa jabatannya atas kota Sabdhan, Mahrjanqazf, Helwan, dan Al-Mahin, dan membaginya menjadi pemukiman di pegunungan. Ia membangun istananya, yang dikenal sebagai Qasr Kathir, yang merupakan salah satu karya Dinur. Saat Ziyad bepergian, tungku topinya rusak. Ia mengambil jarum yang tertanam di topinya dan benang yang ia miliki. Ia memperbaiki al-Safshaq. Ziyad berkata kepadanya, 'Kau teguh, dan tak ada yang seperti kau bisa menunda.' Ia mengambil sebagian gunung untuknya."
