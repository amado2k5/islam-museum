summary:
  ar: محمد الربيع الحسني الندوي ⁦(1929–2023)⁩ عالم هندي، رئيس ندوة العلماء بلكهنؤ والرئيس الرابع لمجلس قانون الأحوال الشخصية لمسلمي عموم الهند، ألّف نحو ثلاثين كتابًا بالعربية والأردية؛ توفي 13 أبريل 2023.
  en: Muhammad al-Rabee al-Hasani al-Nadvi ⁦(1929–2023)⁩ was an Indian Islamic scholar, rector of Darul Uloom Nadwatul Ulama in Lucknow and fourth president of the All India Muslim Personal Law Board, author
    of some thirty books in Arabic and Urdu; he died on 13 April 2023.
  ur: محمد ربع حسنی ندوی ⁦(1929–2023)⁩ بھارتی عالم، لکھنؤ کی دار العلوم ندوۃ العلماء کے مہتمم اور آل انڈیا مسلم پرسنل لا بورڈ کے چوتھے صدر تھے، جنھوں نے عربی و اردو میں تقریباً تیس کتابیں لکھیں؛ 13 اپریل
    2023 کو وفات پائی۔
  es: "Muhammad al-Rabee al-Hasani al-Nadvi (1929-2023) fue un erudito islámico indio, rector de Darul Uloom Nadwatul Ulama en Lucknow y cuarto presidente de la Junta de Derecho Personal Musulmán de la India, autor de unos treinta libros en árabe y urdu; falleció el 13 de abril de 2023."
