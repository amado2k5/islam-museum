summary:
  ar: "ملكة أحمدنگر زوجة حسين نظام شاه الأول ووصية الحكم بعده (1565–1569م)، تظهر في ست من صور «تعريف حسين شاهي»، وسجنها ابنها في حصن شيونير سنة 1569م {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}."
  en: "Queen of Ahmadnagar, wife of Husain Nizam Shah I and regent after him (1565–69), who appears in six illustrations of the Tarif-i Husain Shahi and was imprisoned by her son in Shivner fort in 1569 {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}."
  ur: "احمد نگر کی ملکہ، حسین نظام شاہ اول کی بیوی اور ان کے بعد نائب السلطنت (1565–69ء)، جو تعریفِ حسین شاہی کی چھ تصاویر میں ہیں، اور جنہیں ان کے بیٹے نے 1569ء میں شیونیر قلعے میں قید کیا {cite:zebrowski-deccani-painting-1983 p. 16} {cite:zebrowski-deccani-painting-1983 p. 17}۔"
