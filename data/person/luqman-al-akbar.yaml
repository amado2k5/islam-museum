summary:
  ar: "لقمان بن عاد بن عاد، بان سد سبأ المسناة الذي كان فرسخاً في فرسخ، وعمر من قومه عمر النسور كما ذكر المسعودي في كتابه أخبار الزمان عند طول الأعمار، وأكثرت العرب في صفة طول عمر النسر وضربت به الأمثال وبلبد وبصحة بدن الغراب {cite:muruj-al-dhahab p. 489, 492}."
  en: "Luqman son of 'Ad — builder of Saba's dam — who lived, in the saying, the vultures' span, the proverbial longevity the Arabs likened to the raven's health {cite:muruj-al-dhahab p. 489, 492}."
