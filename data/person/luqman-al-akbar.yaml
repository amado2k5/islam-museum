label: { ar: "لقمان الأكبر العادي", en: "Luqman al-Akbar", es: "Luqman al-Akbar", fr: "Luqman al-Akbar", ur: "لقمان الاکبر" }
summary:
  ar: "لقمان بن عاد بن عاد، بان سد سبأ المسناة الذي كان فرسخاً في فرسخ، وعمر من قومه عمر النسور كما ذكر المسعودي في كتابه أخبار الزمان عند طول الأعمار، وأكثرت العرب في صفة طول عمر النسر وضربت به الأمثال وبلبد وبصحة بدن الغراب {cite:muruj-al-dhahab p. 489, 492}."
  en: "Luqman son of 'Ad — builder of Saba's dam — who lived, in the saying, the vultures' span, the proverbial longevity the Arabs likened to the raven's health {cite:muruj-al-dhahab p. 489, 492}."
  es: "Luqman hijo de 'Ad — constructor de la presa de Saba — que vivió, según el dicho, la longevidad de los buitres, la longevidad proverbial que los árabes comparaban con la salud del cuervo {cite:muruj-al-dhahab p. 489, 492}."
  fr: "Luqman fils de 'Ad — constructeur du barrage de Saba — qui vécut, selon le dicton, la durée de vie des vautours, la longévité proverbiale que les Arabes comparaient à la santé du corbeau {cite:muruj-al-dhahab p. 489, 492}."
  ur: "لقمان ولد عاد - صبا کے ڈیم بنانے والا - جو کہتا تھا کہ گدھوں کی مدت میں رہتا تھا، عربوں نے کوے کی صحت سے تشبیہ دی تھی۔ 489، 492}۔"
  tr: "Luqman ibn 'Ad ibn 'Ad, eski Saba Barajı'nın, bir farsakh'tan bir farsakh uzaklıkta olduğunu ve halkından birinin kartallar çağında yaşadığını söylemiştir; bunu Al-Mas'udi'nin 'Akhbar al-Zaman' adlı kitabında belirttiği gibi, uzun ömür zamanında. Araplar sık sık kartalın uzun ömrünü ve ona atasözlerini, Balbad'ı ve karganın bedeninin sesini anlatırlar {cite:muruj-al-dhahab, s. 489, 492}."
  id: "Luqman ibn 'Ad ibn 'Ad berkata bahwa Bendungan Saba tua, yang merupakan farsakh jauh dari farsakh, dan salah satu bangsanya hidup pada zaman elang, seperti yang disebutkan Al-Mas'udi dalam bukunya 'Akhbar al-Zaman, pada masa umur panjang.' Orang Arab sering menggambarkan umur panjang elang dan memberinya perisal, Balbad, dan suara tubuh gagak {cite:muruj-al-dhahab, hlm. 489, 492}."
