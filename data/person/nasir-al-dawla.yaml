summary:
  ar: "ابن حمدان، لقبه الخليفة ناصر الدولة لما قتل ابن رائق غيلة بتكريت سنة ثلاثين وولي مكانه، وخرج بجيش كثير من الأعراب والأكراد إلى قتال توزون فانهزم من عكبرا هو والمتقي إلى الموصل ثم إلى نصيبين {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  en: "The Hamdanid titled Nasir al-Dawla by the caliph when Ibn Ra'iq was assassinated at Takrit in 330; he fought Tuzun with Arab and Kurdish hosts and was driven with al-Muttaqi from Ukbara to Mosul then Nisibis {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
