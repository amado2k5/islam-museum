id: person/nasir-al-dawla
class: person
label: { ar: "الحسن بن عبد الله بن حمدان ناصر الدولة" }
summary:
  ar: "ابن حمدان، لقبه الخليفة ناصر الدولة لما قتل ابن رائق غيلة بتكريت سنة ثلاثين وولي مكانه، وخرج بجيش كثير من الأعراب والأكراد إلى قتال توزون فانهزم من عكبرا هو والمتقي إلى الموصل ثم إلى نصيبين {cite:tarikh-khulafa-minhaj-1434 p. 609-610}. وعند المسعودي كاتبه المتقي وأخوه سيف الدولة أن ينجداه ويستنقذاه مما هو فيه من غلبة توزون ويفوض إليهما الملك {cite:muruj-al-dhahab p. 691-692} وعند ابن الجوزي جاء إلى بغداد سنة خمس وثلاثين يخاصم عن الخليفة المطيع فحاربه معز الدولة فهزمه في أول يوم من المحرم {cite:muntazam-ibn-al-jawzi p. 646}."
  en: "The Hamdanid titled Nasir al-Dawla by the caliph when Ibn Ra'iq was assassinated at Takrit in 330; he fought Tuzun with Arab and Kurdish hosts and was driven with al-Muttaqi from Ukbara to Mosul then Nisibis {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  es: "El hamdanid nombró califa a Nasir al-Dawla cuando Ibn Ra'iq fue asesinado en Takrit en 330; luchó contra Tuzun con huestes árabes y kurdas y fue expulsado con al-Muttaqi de Ukbara a Mosul y luego a Nisibis {cita:tarikh-khulafa-minhaj-1434 p. 609-610}."
  fr: "Le Hamdanide titra Nasir al-Dawla par le calife lors de l'assassinat d'Ibn Ra'iq à Takrit en 330; il combattit Tuzun avec des hôtes arabes et kurdes et fut chassé avec al-Muttaqi d'Ukbara à Mossoul puis Nisibis {cite:tarikh-khulafa-minhaj-1434 p. 609-610}."
  ur: "ہمدانیوں نے خلیفہ کی طرف سے ناصر الدولہ کا عنوان دیا جب ابن رایق کو تکریت میں 330 میں قتل کیا گیا تھا۔ اس نے عرب اور کرد میزبانوں کے ساتھ تزون کا مقابلہ کیا اور اسے المتقی کے ساتھ عقبرہ سے موصل تک لے جایا گیا پھر نسیبس {حوالہ: تاریخ الخلفاء منہاج 1434 ص۔ 609-610}۔"
  tr: "Halife Nasir al-Dawla tarafından, İbn Ra'iq'in 30 Hicri yılında Ghayla'yı öldürmesinden sonra lakap verilen İbn Hamdan onun yerine geçti. Tuzun'a karşı savaşmak için birçok bedevi ve Kürt'ten oluşan bir orduya liderlik etti, ancak kendisi ve el-Muttaqi, Akbara'dan Musul'a ve oradan Nisibiyyin'e yenildi {atıf: Tarikh-khulafa-minhaj-1434 s. 609-610}. Al-Mas'udi, ona al-Muttaqi ve kardeşi Seyf al-Dawla'ya Tuzun'daki egemenliğinden kurtarılması ve krallığı onlara devretmeleri için yazdı {atıf:muruj-al-dhahab s. 691-692}. İbn al-Jawzi'ye göre, 35 Hicri yılında Halife el-Muti' adına tartışmak için Bağdat'a gelmiş, ancak Mu'izz al-Dawla onunla savaşmış ve Muharrem'in ilk gününde onu yendi {atıf:Muntazam-ibn-al-jawzi s. 646}."
  id: "Ibn Hamdan, yang dijuluki oleh Khalifah Nasir al-Dawla setelah Ibn Ra'iq membunuh Ghayla di Tikrit pada tahun 30 H, menggantikannya. Ia memimpin pasukan yang terdiri dari banyak Badui dan Kurdi untuk melawan Tuzun, tetapi ia dan al-Muttaqi dikalahkan dari Akbara ke Mosul dan kemudian ke Nisibiyyin {cite:Tarikh-khulafa-minhaj-1434 hlm. 609-610}. Al-Mas'udi menulis kepadanya al-Muttaqi dan saudaranya Sayf al-Dawla untuk menyelamatkannya dari kekuasaannya di Tuzun dan mendelegasikan kerajaan kepada mereka {cite:muruj-al-dhahab hlm. 691-692}. Menurut Ibn al-Jawzi, ia datang ke Baghdad pada tahun 35 H untuk bersengketa atas nama Khalifah al-Muti', tetapi Mu'izz al-Dawla melawannya dan mengalahkannya pada hari pertama Muharram {cite:Muntazam-ibn-al-jawzi hlm. 646}."
