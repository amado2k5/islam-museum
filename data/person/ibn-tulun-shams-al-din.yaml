summary:
  ar: "شمس الدين ابن طولون الدمشقي الصالحي الحنفي الإمام العلامة المسند المؤرخ؛ ولد بصالحية دمشق بالسهم الأعلى قرب مدرسة الحاجبية سنة ثمانين وثمانمائة تقريباً، وتفقه بعمه الجمال ابن طولون وأخذ عن السيوطي إجازة مكاتبة، وكان ماهراً في النحو علامة في الفقه مشهوراً بالحديث، وولي تدريس الحنفية بمدرسة شيخ الإسلام أبي عمر وإمامة السليمية بالصالحية، وقصده الطلبة في النحو ورغب الناس في السماع منه، وكانت أوقاته معمورة بالتدريس والإفادة والتأليف، وكتب بخطه كثيراً من الكتب وعلّق ستين جزءاً سماها التعليقات كل جزء يشتمل على مؤلفات، أكثرها من جمعه ومنها كثير من تأليفات شيخه السيوطي، وكان واسع الباع في غالب العلوم حتى في التعبير والطب، وأخذ عنه جماعة من الأعيان برعوا في حياته كالشهاب الطيبي والعلاء بن عماد الدين والنجم البهنسي ومن آخرهم الشيخ إسماعيل النابلسي والزين بن سلطان والشهاب العيناوي والشهاب بن أبي الوفا والقاضي أكمل بن مفلح؛ توفي يوم الأحد حادي عشر جمادى الأولى ودُفن بتربتهم عند عمه القاضي جمال الدين بالسفح قبلي الكهف والخوارزمية ولم يعقب أحداً {cite:shadharat-dhahab p. 714-715}."
  en: "Ibn Tulun the historian of Damascus — b. about 880 in the upper Sahm of the Salihiyya, trained by his uncle Jamal al-Din and licensed by al-Suyuti in writing; teacher of Hanafis at the Shaykh al-Islam Abu 'Umar madrasa and imam of the Sulaymiyya, author of the sixty-part 'Ta'liqat' notebooks full of compilations and al-Suyuti's works; his pupils included al-Taybi, 'Ala' al-Din b. 'Imad, and the muftis al-Nabulsi, Ibn Sultan, al-'Aynawi and Ibn Abi al-Wafa; died Sunday 11 Jumada I [954] and left no offspring {cite:shadharat-dhahab p. 714-715}."
  es: "Ibn Tulun, el historiador de Damasco, nació alrededor del año 880 en el Sahm superior de la Salihiyya, fue instruido por su tío Jamal al-Din y recibió licencia de al-Suyuti para escribir; fue maestro de los Hanafi en la madrasa del Shaykh al-Islam Abu 'Umar e imán de la Sulaymiyya, autor de los cuadernos 'Ta'liqat' de sesenta partes, llenos de compilaciones y obras de al-Suyuti; entre sus alumnos se encontraban al-Taybi, 'Ala' al-Din ibn 'Imad y los muftíes al-Nabulsi, Ibn Sultan, al-'Aynawi e Ibn Abi al-Wafa; murió el domingo 11 de Jumada I [954] y no dejó descendencia {cite:shadharat-dhahab p. 714-715}."
  fr: "Ibn Tulun, historien de Damas — né vers 880 dans le Haut-Sahm de la Salihiyya, formé par son oncle Jamal al-Din et autorisé à écrire par al-Suyuti; professeur de Hanafites à la madrasa Shaykh al-Islam Abu 'Umar et imam de la Sulaymiyya, auteur des soixante volumes des cahiers « Ta'liqat », recueils d'œuvres d'al-Suyuti; parmi ses élèves figurent al-Taybi, 'Ala' al-Din b. 'Imad, et les muftis al-Nabulsi, Ibn Sultan, al-'Aynawi et Ibn Abi al-Wafa; mort le dimanche 11 Jumada I [954] sans descendance {cite:shadharat-dhahab p. 714-715}."
  ur: "ابن طولون دمشق کا مورخ۔ تقریباً 880 میں صالحیہ کے بالائی سہم میں، اس کے چچا جمال الدین نے تربیت حاصل کی اور تحریری طور پر السیوطی سے لائسنس یافتہ؛ شیخ الاسلام ابو عمر مدرسہ میں حنفیہ کے استاد اور سلیمیہ کے امام، تالیفات اور السیوطی کے کاموں سے بھری ساٹھ حصوں کی 'تعلیقات' نوٹ بک کے مصنف؛ ان کے شاگردوں میں الطیبی، علاء الدین بن۔ عماد، اور مفتی النبلسی، ابن سلطان، العینوی اور ابن ابی الوفا؛ اتوار 11 جمادی الثانی [954] وفات پائی اور کوئی اولاد نہیں چھوڑی۔ 714-715}۔"
  tr: "Şameddin İbn Tulun el-Dimashqi el-Salihi el-Hanafi, imam, seçkin alim, Musnad ve tarihçi; yaklaşık sekiz yüz seksen yıl içinde Şam'ın Salih şehrinde, El-Hacibiye Okulu'nun yakınında doğdu. Amcası el-Cemal bin Tulun'un yanında fıkıh okudu ve el-Suyuti'den mektupla eğitim aldı. Dilbilgisi konusunda yetenekli, seçkin bir fıkıh âlimi ve hadisleriyle tanındı. Şeyh-el-İslam Ebu Ömer okulunda ve el-Selahiye'deki el-Süleymiyye imatı okulunda Hanefi okulu öğretti. Dilbilgisi öğrencileri ona gelip insanları dinlemeye teşvik etti. Zamanı öğretim, fayda sağlama ve yazarlıkla doluydu. Kendi el yazısıyla birçok kitap yazdı ve altmış tane yorum yaptı Al-Ta'liqat (Yorumlar) adlı bir bölüm Her ciltte çoğunu derlediği eserler yer alır; bunların arasında öğretmeni Al-Suyuti'nin birçok eseri de vardır. İfade ve tıp dahil olmak üzere çoğu bilimde oldukça bilgiliydi. Yaşamı boyunca üstün başarı gösteren bir grup önemli şahsiyet, Al-Şihab Al-Taybi, Al-Alaa ibn Imad Al-Din, Al-Najm Al-Bahansi gibi öğrenciler tarafından eğitildi; sonuncusu ise Şeyh İsmail Al-Nabulsi, Al-Zain bin Sultan, Al-Şihab Al-Aynawi, Al-Shihab bin Abi Al-Wafa ve Hakim Akmal bin Muflih'dir. Cumadeldi-Avval'ın 11'i Pazar günü vefat etti ve amcası Yargıç Cemal Al-Din ile birlikte mağara ve Al-Khwarizmiyah'ın eteklerinde onların mezarlarına defnedildi; kimseyi geride bırakmadı."
  id: "Shams al-Din Ibn Tulun al-Dimashqi al-Salihi al-Hanafi, imam, ulama terkemuka, Musnad, dan sejarawan; ia lahir di Salihiyah, Damaskus, dekat Sekolah Al-Hajibiyya sekitar delapan ratus delapan puluh tahun. Ia belajar hukum di bawah pamannya al-Jamal ibn Tulun dan memperoleh surat izin korespondensi dari al-Suyuti. Ia mahir dalam tata bahasa, ulama yurisprudensi yang terkemuka, dan terkenal karena haditsnya. Ia mengajar sekolah Hanafi di sekolah Shaykh al-Islam Abu Umar dan imamat al-Sulaymiyyah di al-Salihiyah. Murid-murid tata bahasa datang kepadanya dan mendorong orang untuk mendengarkannya. Waktunya dipenuhi dengan pengajaran, manfaat, dan kepenulisan karya. Ia menulis banyak buku dengan tulisan tangannya sendiri dan mengomentari enam puluh Bagian yang disebut Al-Ta'liqat (Komentar) Setiap jilid memuat karya-karya, sebagian besar ia kompilasi, termasuk banyak karya gurunya Al-Suyuti. Ia menguasai sebagian besar ilmu pengetahuan, termasuk ekspresi dan kedokteran. Sekelompok tokoh terkenal yang berprestasi selama hidupnya belajar di bawah bimbingannya, seperti Al-Shihab Al-Taybi, Al-Alaa ibn Imad Al-Din, Al-Najm Al-Bahansi, dan yang terakhir adalah Sheikh Ismail Al-Nabulsi, Al-Zain bin Sultan, Al-Shihab Al-Aynawi, Al-Shihab bin Abi Al-Wafa, dan Hakim Akmal bin Muflih. Ia meninggal pada hari Minggu, tanggal 11 Jumada al-Awwal, dan dimakamkan di makam mereka bersama pamannya, Hakim Jamal Al-Din, di kaki bukit gua dan Al-Khwarizmiyah, dan ia tidak meninggalkan siapa pun."
