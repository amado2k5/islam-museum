summary:
  ar: "شمس الدين ابن طولون الدمشقي الصالحي الحنفي الإمام العلامة المسند المؤرخ؛ ولد بصالحية دمشق بالسهم الأعلى قرب مدرسة الحاجبية سنة ثمانين وثمانمائة تقريباً، وتفقه بعمه الجمال ابن طولون وأخذ عن السيوطي إجازة مكاتبة، وكان ماهراً في النحو علامة في الفقه مشهوراً بالحديث، وولي تدريس الحنفية بمدرسة شيخ الإسلام أبي عمر وإمامة السليمية بالصالحية، وقصده الطلبة في النحو ورغب الناس في السماع منه، وكانت أوقاته معمورة بالتدريس والإفادة والتأليف، وكتب بخطه كثيراً من الكتب وعلّق ستين جزءاً سماها التعليقات كل جزء يشتمل على مؤلفات، أكثرها من جمعه ومنها كثير من تأليفات شيخه السيوطي، وكان واسع الباع في غالب العلوم حتى في التعبير والطب، وأخذ عنه جماعة من الأعيان برعوا في حياته كالشهاب الطيبي والعلاء بن عماد الدين والنجم البهنسي ومن آخرهم الشيخ إسماعيل النابلسي والزين بن سلطان والشهاب العيناوي والشهاب بن أبي الوفا والقاضي أكمل بن مفلح؛ توفي يوم الأحد حادي عشر جمادى الأولى ودُفن بتربتهم عند عمه القاضي جمال الدين بالسفح قبلي الكهف والخوارزمية ولم يعقب أحداً {cite:shadharat-dhahab p. 714-715}."
  en: "Ibn Tulun the historian of Damascus — b. about 880 in the upper Sahm of the Salihiyya, trained by his uncle Jamal al-Din and licensed by al-Suyuti in writing; teacher of Hanafis at the Shaykh al-Islam Abu 'Umar madrasa and imam of the Sulaymiyya, author of the sixty-part 'Ta'liqat' notebooks full of compilations and al-Suyuti's works; his pupils included al-Taybi, 'Ala' al-Din b. 'Imad, and the muftis al-Nabulsi, Ibn Sultan, al-'Aynawi and Ibn Abi al-Wafa; died Sunday 11 Jumada I [954] and left no offspring {cite:shadharat-dhahab p. 714-715}."
