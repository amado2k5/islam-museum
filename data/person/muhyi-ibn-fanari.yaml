summary:
  ar: "المولى محيي الدين أحمد بن علاء الدين الفناري الحنفي؛ قرأ على علماء عصره ثم رحل إلى العجم وقرأ على علماء سمرقند وبخارى ثم عاد إلى الروم فأعطاه السلطان سليم مدرسة الوزير قاسم باشا، وكان محباً للصوفية سيما الوفائية مكباً على العلم اطلع على كتب كثيرة وحفظ أكثر لطائفها ونوادرها ويحفظ التواريخ وحكايات الصالحين؛ صنّف تهذيب الكافية في النحو وشرحه، وحاشية على شرح هداية الحكمة لمولانا زاده، وحواشٍ على شرح التجريد للسيد، وتفسيراً لسورة الضحى سماه تنوير الضحى؛ توفي سنة أربعين وتسعمائة {cite:shadharat-dhahab p. 590}."
  en: "The Fanari grandson — schooled in Samarkand and Bukhara, back to Rum where Selim gave him the vizier Qasim Pasha's madrasa; a lover of the Wafa'iyya Sufis, keeper of histories and saints' tales; author of Tahdhib al-Kafiya with sharh, a gloss on Mawlana-zada's Hidayat al-Hikma sharh, glosses on the Sharif's Tajrid, and Tanwir al-Duha; d. 940 {cite:shadharat-dhahab p. 590}."
