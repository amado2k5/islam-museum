summary:
  ar: "المولى محيي الدين أحمد بن علاء الدين الفناري الحنفي؛ قرأ على علماء عصره ثم رحل إلى العجم وقرأ على علماء سمرقند وبخارى ثم عاد إلى الروم فأعطاه السلطان سليم مدرسة الوزير قاسم باشا، وكان محباً للصوفية سيما الوفائية مكباً على العلم اطلع على كتب كثيرة وحفظ أكثر لطائفها ونوادرها ويحفظ التواريخ وحكايات الصالحين؛ صنّف تهذيب الكافية في النحو وشرحه، وحاشية على شرح هداية الحكمة لمولانا زاده، وحواشٍ على شرح التجريد للسيد، وتفسيراً لسورة الضحى سماه تنوير الضحى؛ توفي سنة أربعين وتسعمائة {cite:shadharat-dhahab p. 590}."
  en: "The Fanari grandson — schooled in Samarkand and Bukhara, back to Rum where Selim gave him the vizier Qasim Pasha's madrasa; a lover of the Wafa'iyya Sufis, keeper of histories and saints' tales; author of Tahdhib al-Kafiya with sharh, a gloss on Mawlana-zada's Hidayat al-Hikma sharh, glosses on the Sharif's Tajrid, and Tanwir al-Duha; d. 940 {cite:shadharat-dhahab p. 590}."
  es: "El nieto de Fanari, educado en Samarcanda y Bujará, regresó a Rum donde Selim le dio la madrasa del visir Qasim Pasha; amante de los sufíes Wafa'iyya, guardián de historias y relatos de santos; autor de Tahdhib al-Kafiya con sharh, una glosa sobre Hidayat al-Hikma sharh de Mawlana Zada, glosas sobre Tajrid de Sharif y Tanwir al-Duha; m. 940 {citado en shadharat-dhahab p. 590}."
  fr: "Le petit-fils de Fanari — formé à Samarcande et Boukhara, puis de retour à Rum où Selim lui confia la madrasa du vizir Qasim Pacha; amoureux des soufis Wafa'iyya, gardien des histoires et des récits de saints; auteur de Tahdhib al-Kafiya avec sharh, d'une glose sur Hidayat al-Hikma sharh de Mawlana Zada, de gloses sur le Tajrid du Sharif et de Tanwir al-Duha; mort en 940 {cité dans shadharat-dhahab p. 590}."
  ur: "فناری پوتا — سمرقند اور بخارا میں تعلیم حاصل کی، روم واپس جہاں سلیم نے اسے وزیر قاسم پاشا کا مدرسہ دیا۔ وفاعی صوفیوں کا عاشق، تاریخوں اور اولیاء کی کہانیوں کا محافظ؛ تہذیب الکافیہ مع شرح کے مصنف، مولانا زادہ کی ہدایت الحکمہ شرح پر ایک تصنیف، شریف کی تجرید پر چمک، اور تنویر الضحی؛ d 940 {حوالہ: شدارت ذہاب صفحہ 590}۔"
