id: person/yusuf-ibn-abi-al-saj
class: person
label: { ar: "يوسف بن أبي الساج" }
summary:
  ar: "قائد عباسي؛ سيره المقتدر من واسط إلى الكوفة آخر رمضان سنة 315هـ لملاقاة أبي طاهر القرمطي، فوصل بعد وصوله بيوم واحد وأرسل إليهم يدعوهم إلى الطاعة فقالوا لا طاعة لنا إلا لله، ودعاهم إلى الحرب يوم الأحد فقالوا الموعد بكرة غد، فلما رأى يوسف قلة القرامطة احتقرهم وقال إن هؤلاء الكلاب بعد ساعة في يدي وتقدم بأن يُكتب كتاب الفتح والبشارة بالظهر قبل اللقاء تهاوناً بهم، فاقتتلوا من محو النهار يوم السبت إلى الغروب ثم باشر أبو طاهر الحرب بنفسه فهزم أصحاب يوسف وأُسر يوسف وقت المغرب ووكّل أبو طاهر طبيباً يعالج جراحه {cite:kamil-ibn-al-athir p. 125-126}. وعند ابن الجوزي وفي سنة 271هـ وثب يوسف بن أبي الساج وكان والي مكة على غلام الطائي يقال له بدر خرج على الحجاج فقاتله خارب بن أبي الساج أصحاب بدر وأعانهم الحجاج حتى استنقذوا غلام الطائي وأسروا ابن أبي الساج ونقلوه وحمل إلى بغداد وكانت الحرب بينهم على أبواب المسجد الحرام {cite:muntazam-ibn-al-jawzi p. 102}"
  en: "Abbasid commander sent from Wasit against Abu Tahir the Qarmatian; reaching Kufa a day after him he scorned their fewness, had the victory despatch drafted before battle, and was defeated and captured at sunset on Saturday of Shawwal 315 {cite:kamil-ibn-al-athir p. 125-126}."
