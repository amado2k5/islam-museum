id: person/yusuf-ibn-abi-al-saj
class: person
label: { ar: "يوسف بن أبي الساج" }
summary:
  ar: "قائد عباسي؛ سيره المقتدر من واسط إلى الكوفة آخر رمضان سنة 315هـ لملاقاة أبي طاهر القرمطي، فوصل بعد وصوله بيوم واحد وأرسل إليهم يدعوهم إلى الطاعة فقالوا لا طاعة لنا إلا لله، ودعاهم إلى الحرب يوم الأحد فقالوا الموعد بكرة غد، فلما رأى يوسف قلة القرامطة احتقرهم وقال إن هؤلاء الكلاب بعد ساعة في يدي وتقدم بأن يُكتب كتاب الفتح والبشارة بالظهر قبل اللقاء تهاوناً بهم، فاقتتلوا من محو النهار يوم السبت إلى الغروب ثم باشر أبو طاهر الحرب بنفسه فهزم أصحاب يوسف وأُسر يوسف وقت المغرب ووكّل أبو طاهر طبيباً يعالج جراحه {cite:kamil-ibn-al-athir p. 125-126}. وعند ابن الجوزي وفي سنة 271هـ وثب يوسف بن أبي الساج وكان والي مكة على غلام الطائي يقال له بدر خرج على الحجاج فقاتله خارب بن أبي الساج أصحاب بدر وأعانهم الحجاج حتى استنقذوا غلام الطائي وأسروا ابن أبي الساج ونقلوه وحمل إلى بغداد وكانت الحرب بينهم على أبواب المسجد الحرام {cite:muntazam-ibn-al-jawzi p. 102}"
  en: "Abbasid commander sent from Wasit against Abu Tahir the Qarmatian; reaching Kufa a day after him he scorned their fewness, had the victory despatch drafted before battle, and was defeated and captured at sunset on Saturday of Shawwal 315 {cite:kamil-ibn-al-athir p. 125-126}."
  es: "Comandante abasí enviado desde Wasit contra Abu Tahir el Cármata; llegando a Kufa un día después que él, despreció su escaso número, hizo redactar el informe de victoria antes de la batalla, y fue derrotado y capturado al atardecer del sábado de Shawwal 315 {cite:kamil-ibn-al-athir p. 125-126}."
  fr: "Commandant abbasside envoyé de Wasit contre Abu Tahir le Qarmate; arrivant à Kufa un jour après lui, il méprisa leur faible nombre, fit rédiger le message de victoire avant la bataille, et fut vaincu et capturé au coucher du soleil le samedi de Shawwal 315 {cite:kamil-ibn-al-athir p. 125-126}."
  ur: "عباسی کمانڈر وصیت سے ابو طاہر قرمتی کے خلاف بھیجا؛ اس کے ایک دن بعد کوفہ پہنچ کر اس نے ان کی کمی کو ٹھکرایا، جنگ سے پہلے فتح کا مسودہ تیار کیا، اور شوال 315 کے ہفتہ کو غروب آفتاب کے وقت شکست کھا کر گرفتار کر لیا گیا۔ 125-126}۔"
  tr: "Bir Abbasi komutanı olan El-Muqtadir, 315 Hicri Ramazan sonunda Vesit'ten Kufe'ye yürüyerek Ebu Tahir el-Karmati ile buluştu. Gelişinden bir gün sonra geldi ve onları itaat etmeye çağırdı, ancak onlar, 'Allah'a itaatimiz yok' dediler. Pazar günü onları savaşa çağırdı, ancak onlar randevunun yarın olduğunu söylediler. Yusuf, birkaç Karmatlıyı görünce onları küçümsedi ve bu köpeklerin bir saat sonra elinde olduğunu, onlara karşı ihmalkarlıktan dolayı toplantıdan öğle önce Fetih ve Müjde'yi yazmayı teklif ettiğini söyledi. Cumartesi şafaktan gün batımına kadar savaştılar. Ebu Tahir bizzat savaştı, Yusuf'un yoldaşlarını yendi ve gün batımında Yusuf'u yakaladı. Ebu Tahir, yaralarını tedavi etmek için bir doktor atadı {atıf:kamil-ibn-al-athir s. 125-126}. 271 Hicri yılında, İbn el-Cevzi'de, Mekke valisi Yusuf bin Ebi el-Saj, Badr adında bir kölenin üzerinden atladı ve Badr el-Hacac'a saldırdı. Bedr'in yoldaşları Kharib ibn Abi al-Saj onunla savaştı ve el-Haccac onlara yardım etti; ta ki Gulam al-Saj'ı kurtarıp İbn Abi el-Saj'ı yakalayıp Bağdat'a götürene kadar. Aralarındaki savaş Müdem-Camii'nin kapılarında gerçekleşti {atıf:muntazam-ibn-al-jawzi, s. 102}"
  id: "Seorang komandan Abbasiyah; Al-Muqtadir berbaris dari Wasit ke Kufa pada akhir Ramadan tahun 315 H untuk bertemu Abu Tahir al-Qarmati. Ia tiba sehari setelah kedatangannya dan mengirim surat kepada mereka untuk memanggil mereka agar taat, tetapi mereka berkata, 'Kami tidak taat kecuali kepada Allah.' Ia memanggil mereka berperang pada hari Minggu, tetapi mereka mengatakan janji itu besok. Ketika Yusuf melihat beberapa orang Qarmatia, ia membenci mereka dan berkata bahwa anjing-anjing itu sudah di tangannya satu jam kemudian dan ia mengusulkan untuk menulis Kitab Penaklukan dan Kabar Baik pada siang hari sebelum pertemuan karena kelalaian terhadap mereka. Mereka bertempur dari fajar hari Sabtu hingga matahari terbenam. Abu Tahir sendiri kemudian bertempur dan mengalahkan teman-teman Yusuf serta menangkap Yusuf saat matahari terbenam. Abu Tahir menunjuk seorang dokter untuk merawat lukanya {cite:kamil-ibn-al-athir hlm. 125-126}. Di Ibn al-Jawzi, tahun 271 H, Yusuf ibn Abi al-Saj, yang merupakan gubernur Mekah, melompati seorang budak bernama Badr yang menyerang al-Hajjaj. Kharib ibn Abi al-Saj, para sahabat Badr, melawannya, dan al-Hajjaj membantu mereka hingga mereka menyelamatkan Ghulam al-, menangkap Ibn Abi al-Saj, memindahkannya, dan membawanya ke Baghdad. Pertempuran antara mereka terjadi di gerbang Masjid Suci {cite:muntazam-ibn-al-jawzi, hlm. 102}"
