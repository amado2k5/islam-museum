summary:
  ar: "سياسي باكستاني (1916–1995)، ابن أحمد يار خان دولتانة، وثاني رؤساء وزراء بنجاب الغربية (1951–1953)، استقال بعد أعمال شغب لاهور سنة 1953 حين فُرضت الأحكام العرفية، ثم كان وزيرًا للدفاع في حكومة تشوندريغار (1957)، وسفيرًا لباكستان لدى المملكة المتحدة (1972–1979)."
  en: "Pakistani politician (1916–1995), the son of Ahmad Yar Khan Daultana and the second chief minister of West Punjab (1951–1953), who resigned after the 1953 Lahore riots and the imposition of martial law, then minister of defence in the Chundrigar government (1957) and Pakistan's high commissioner to the United Kingdom (1972–1979)."
  ur: "پاکستانی سیاست دان (1916ء–1995ء)، احمد یار خان دولتانہ کے بیٹے اور مغربی پنجاب کے دوسرے وزیر اعلیٰ (1951ء–1953ء)، جو 1953 کے لاہور فسادات اور مارشل لا کے بعد مستعفی ہوئے، پھر چونڈریگر حکومت میں وزیر دفاع (1957ء) اور برطانیہ میں پاکستان کے ہائی کمشنر (1972ء–1979ء) رہے۔"
