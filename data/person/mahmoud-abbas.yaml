summary:
  ar: "محمود عباس (وُلد 15 نوفمبر 1935)، المعروف بكنيته أبو مازن، سياسي فلسطيني وُلد في صفد ولجأ مع أسرته إلى سوريا سنة 1948، ودرس القانون في دمشق وحصل على درجة علمية من موسكو. كان من مؤسسي حركة فتح ومهندسي التفاوض الفلسطيني، فوقع اتفاق أوسلو الأول سنة 1993 عن منظمة التحرير، وصار أول رئيس وزراء للسلطة الفلسطينية سنة 2003، ثم خلف ياسر عرفات رئيسًا للمنظمة سنة 2004 وانتُخب رئيسًا للسلطة سنة 2005، وما يزال في منصبه."
  en: "Mahmoud Abbas (born 15 November 1935), known by his kunya Abu Mazen, is a Palestinian politician born in Safed whose family fled to Syria in 1948; he studied law in Damascus and took a graduate degree in Moscow. A founding member of Fatah and the PLO's chief negotiator, he signed the Oslo I Accord for the PLO in 1993, became the Palestinian Authority's first prime minister in 2003, succeeded Yasser Arafat as PLO chairman in 2004, and was elected President of the Palestinian Authority in 2005, an office he still holds."
  ur: "محمود عباس (پیدائش 15 نومبر 1935ء)، کنیت ابو مازن، فلسطینی سیاست دان ہیں جو صفد میں پیدا ہوئے اور 1948ء میں خاندان کے ساتھ شام چلے گئے؛ دمشق سے قانون پڑھا اور ماسکو سے اعلیٰ ڈگری لی۔ فتح کے شریکِ بانی اور منظمة التحرير کے مذاکرات کار کی حیثیت سے انہوں نے 1993ء میں اوسلو اول معاہدے پر دستخط کیے، 2003ء میں فلسطینی اتھارٹی کے پہلے وزیرِ اعظم بنے، 2004ء میں یاسر عرفات کے جانشین کے طور پر تنظیم کے چیئرمین اور 2005ء میں صدر منتخب ہوئے۔"
