label: { ar: "الملك المغيث عمر", en: "al-Malik al-Mughith Umar" }
summary:
  ar: "الملك المغيث عمر بن الملك العادل سيف الدين أبي بكر بن أيوب؛ كان صغيراً مقيماً بالقلعة فلما وصل ابن عمه الملك المعظم توران شاه إلى المنصورة وسار من هنالك نزل إليه وسمي إليه الكرك والشوبك وتلك النواحي وهو الآن ملكها؛ ولم يزل مالكاً لها إلى سنة إحدى وستين وستمائة فنزل الملك الظاهر ركن الدين بيبرس بالغور وراسله وبذل له عن تسليم البلد بذولاً كثيرة وحلف له فنزل إليه إلى منزله بالطور من الغور فقبض عليه ساعة وصوله وجهزه إلى قلعة الجبل بمصر واعتقله بها {cite:wafayat-ayan}."
  en: "Al-Malik al-Mughith Umar b. al-Adil — last Ayyubid lord of Karak and Shawbak (to 661); lured down by Baybars' oaths and imprisoned at Qal'at al-Jabal in Cairo {cite:wafayat-ayan}. Ibn al-Imad records the charge: he had corresponded with Hulagu asking twenty thousand horse against Egypt, and when the letters were read to Cairo's scholars they ruled his life forfeit {cite:shadharat-dhahab p. 528}."
died: { edtf: "1263~", hijri: "0661~", calendar: julian, precision: year, status: debated, derived: true, note: "ابن خلكان: اعتقل بقلعة الجبل؛ ابن العماد: كان آخر العهد به وأفتى العلماء بعدم إبقائه — ترجيح القتل على الحبس {cite:wafayat-ayan} {cite:shadharat-dhahab p. 528}." }
