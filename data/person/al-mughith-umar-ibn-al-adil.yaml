label: { ar: "الملك المغيث عمر", en: "al-Malik al-Mughith Umar", fr: "al-Malik al-Mughith Umar", es: "al-Malik al-Mughith Umar", ur: "المالک المغیث عمر" }
summary:
  ar: "الملك المغيث عمر بن الملك العادل سيف الدين أبي بكر بن أيوب؛ كان صغيراً مقيماً بالقلعة فلما وصل ابن عمه الملك المعظم توران شاه إلى المنصورة وسار من هنالك نزل إليه وسمي إليه الكرك والشوبك وتلك النواحي وهو الآن ملكها؛ ولم يزل مالكاً لها إلى سنة إحدى وستين وستمائة فنزل الملك الظاهر ركن الدين بيبرس بالغور وراسله وبذل له عن تسليم البلد بذولاً كثيرة وحلف له فنزل إليه إلى منزله بالطور من الغور فقبض عليه ساعة وصوله وجهزه إلى قلعة الجبل بمصر واعتقله بها {cite:wafayat-ayan}."
  en: "Al-Malik al-Mughith Umar b. al-Adil — last Ayyubid lord of Karak and Shawbak (to 661); lured down by Baybars' oaths and imprisoned at Qal'at al-Jabal in Cairo {cite:wafayat-ayan}. Ibn al-Imad records the charge: he had corresponded with Hulagu asking twenty thousand horse against Egypt, and when the letters were read to Cairo's scholars they ruled his life forfeit {cite:shadharat-dhahab p. 528}."
  fr: "Al-Malik al-Mughith Umar b. al-Adil – dernier seigneur ayyoubide de Karak et Shawbak (à 661) ; attiré par les serments de Baybar et emprisonné à Qal'at al-Jabal au Caire {cite:wafayat-ayan}. Ibn al-Imad rapporte l'accusation : il avait correspondu avec Hulagu demandant vingt mille chevaux contre l'Égypte, et quand les lettres ont été lues aux savants du Caire, ils ont jugé sa vie confisquée {cite:shadharat-dhahab p. 528}."
  es: "Al-Malik al-Mughith Umar b. al-Adil — último señor ayubí de Karak y Shawbak (hasta 661); engañado por los juramentos de Baybars y encarcelado en Qal'at al-Jabal en El Cairo {cite:wafayat-ayan}. Ibn al-Imad registra la acusación: había intercambiado correspondencia con Hulagu solicitando veinte mil caballos contra Egipto, y cuando las cartas fueron leídas a los eruditos de El Cairo, dictaminaron que su vida sería condenada a muerte {cite:shadharat-dhahab p. 528}."
  ur: "الملک المغیث عمر بن العدل - کرک اور شوبک کے آخری ایوبی سردار ⁦(661 تک)⁩؛ Baybars کی قسموں کے لالچ میں آکر قاہرہ میں قلات الجبل میں قید کر دیا گیا۔ ابن عماد نے یہ الزام درج کیا ہے: اس نے حلاگو سے خط لکھ کر مصر کے خلاف بیس ہزار گھوڑے مانگے تھے اور جب قاہرہ کے علماء کو خط پڑھ کر سنائے گئے تو انہوں نے اس کی جان کو ضائع کرنے کا حکم دیا۔ 528}۔"
  tr: "Kral Al-Mu'hit Ömer bin el-Malik el-Adil Seyf-eddin Ebu Bekir bin Eyyub; kalede genç bir ikamet ediyordu. Kuzeni Kral el-Muazzam Turan Şah Mansura'ya geldiğinde oraya yerleşti ve onun adını taşıyan Karak, el-Şubak ve çevresindeki bölgeler olarak adlandırıldı; o da 661 Hicri yılına kadar kral olarak kaldı. Kral el-Zahir Rukn el-Din Baybars Ghor'a yerleşti ve onunla yazıştı, şehri birçok şekilde teslim edeceğine söz verdi. Ona yemin etti ve vadideki Tur'daki evinde onunla kaldı, varışında tutukladı, Mısır'daki dağ kalesine hazırladı ve orada tutukladı."
  id: "Raja Al-Mughith Umar ibn al-Malik al-Adil Sayf al-Din Abu Bakr ibn Ayyub; ia adalah seorang penduduk muda di benteng tersebut. Ketika sepupunya Raja al-Mu'azzam Turan Shah tiba di Mansoura dan berangkat dari sana, ia menetap di sana, dan kota itu dinamai menurut namanya Karak, al-Shoubak, dan daerah sekitarnya, dan ia tetap menjadi rajanya hingga tahun 661 H. Raja al-Zahir Rukn al-Din Baybars menetap di Ghor dan berkorespondensi dengannya, serta berjanji akan menyerahkan kota itu dalam berbagai bentuk. Ia bersumpah kepadanya dan tinggal bersamanya di rumahnya di Tur di lembah, menangkapnya saat kedatangan, mempersiapkannya untuk benteng gunung di Mesir, dan menangkapnya di sana {cite:wafayat-ayan}."
died: { edtf: "1263~", hijri: "0661~", calendar: julian, precision: year, status: debated, derived: true, note: "ابن خلكان: اعتقل بقلعة الجبل؛ ابن العماد: كان آخر العهد به وأفتى العلماء بعدم إبقائه — ترجيح القتل على الحبس {cite:wafayat-ayan} {cite:shadharat-dhahab p. 528}." }
