label: { ar: "موسى بن عبد الله", en: "Musa ibn 'Abd Allah", es: "Musa ibn 'Abd Allah", fr: "Musa ibn 'Abd Allah", ur: "موسیٰ بن عبد اللہ" }
summary:
  ar: "من نجاة وقعة فخ، حلف لعبد الله بن مصعب بيمين حول الله وقوته حين نمى عليه عند الرشيد فعجّل الله له العقوبة قبل ثلاثة أيام فأصابه الجذام واسودّ حتى صار كالفحم وانخسفت به حفرته مرتين، وروى الحديث عن جده علي أن من حلف بيمين نازع الله فيها حوله وقوته عجل الله له العقوبة قبل ثلاث {cite:muruj-al-dhahab p. 329-330}."
  en: "The Fakhkh survivor whose ordeal-oath against his traducer was answered within three days — leprosy, blackening, a grave that twice swallowed the corpse {cite:muruj-al-dhahab p. 329-330}."
  es: "El superviviente de Fakhkh cuyo juramento contra su calumniador fue respondido en tres días: lepra, ennegrecimiento, una tumba que se tragó el cadáver dos veces {cite:muruj-al-dhahab p. 329-330}."
  fr: "Le survivant de Fakhkh dont l'épreuve-serment contre son détracteur fut exaucée en trois jours — la lèpre, le noircissement, une tombe qui engloutit deux fois le cadavre {cite:muruj-al-dhahab p. 329-330}."
  ur: "فخخ زندہ بچ جانے والا جس کی اپنے تاجر کے خلاف آزمائش کی قسم کا جواب تین دن کے اندر اندر دیا گیا — جذام، کالا، ایک قبر جس نے لاش کو دو بار نگل لیا {حوالہ: مروج الذہب ص۔ 329-330}۔"
  tr: "Bir tuzak olayından sağ kurtulduktan sonra, Allah tarafından ve el-Reşid tarafından yemin edildiği güçle Abdullah ibn Musab'a yemin etti. Allah cezasını üç gün önce hızlandırdı ve cüzzam ve kararma hastalığına yakalandı, kömür gibi oldu ve çukuru iki kez yutuldu. Hadis, dedesinden rivayet edilmişti ki, Allah'ın gücü ve kudreti üzerine tartıştığına yemin eden kişi Allah'ın cezasını üç kişiden önce hızlandırır {atıf:Muruj-al-Dhahab s. 329-330}."
  id: "Setelah selamat dari insiden jebakan, ia bersumpah kepada Abdullah ibn Mus'ab dengan sumpah yang disumpah kepada Allah dan kekuatannya saat ia disumpah oleh al-Rashid. Allah mempercepat hukumannya tiga hari sebelumnya, dan ia menderita kusta dan kegelapan hingga menjadi seperti arang dan lubangnya ditelan dua kali. Hadits diceritakan oleh kakeknya bahwa siapa pun yang bersumpah yang diperdebatkan Allah tentang kekuatan dan kekuatannya, Allah mempercepat hukumannya di hadapan tiga {cite:muruj-al-dhahab hlm. 329-330}."
