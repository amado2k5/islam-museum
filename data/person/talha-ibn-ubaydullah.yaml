summary:
  en: "A Companion of Muhammad from the clan of Taym of Quraysh and a kinsman of Abu Bakr, counted among the first eight converts and the ten promised Paradise. The Encyclopaedia of Islam reports his distinction at Uhud, his later opposition to Uthman and his death at the Battle of the Camel on 8 December 656, and notes that the report naming Marwan ibn al-Hakam as his killer is disputed among modern scholars."
  ar: "أحد الثمانية الرعيل الأول؛ أسلم بدعوة أبي بكر الصديق في سنوات الدعوة السرية بمكة. وأمه الصعبة كانت تحت أبي سفيان صخر بن حرب على ما ذكر الزبير بن بكار في أنساب قريش، ورماه مروان بن الحكم في أكحله فقتله في قنطرة قرة ووقف عليه علي وقال والله لقد كنت كارهاً لهذا، وقتل وهو ابن أربع وستين سنة وقبره ومسجده بالبصرة مشهور {cite:muruj-al-dhahab p. 658-659}"
  ur: "طلحہ بن عبید اللہ قریش کی شاخ تیم سے محمد کے صحابی اور ابو بکر کے رشتہ دار تھے، جو پہلے آٹھ مسلمانوں اور جنت کی بشارت پانے والے دس افراد میں شمار ہوتے ہیں۔ دائرۃ المعارف اسلامیہ احد میں ان کی نمایاں شرکت، بعد میں عثمان کی مخالفت اور 8 دسمبر 656ء کو جنگِ جمل میں ان کی وفات بیان کرتا ہے، اور بتاتا ہے کہ مروان بن الحکم کو قاتل ٹھہرانے والی روایت جدید محققین کے درمیان متنازع ہے۔ {cite:sallabi-ali-vol2}"
