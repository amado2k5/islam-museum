summary:
  en: "A Companion of Muhammad from the clan of Taym of Quraysh and a kinsman of Abu Bakr, counted among the first eight converts and the ten promised Paradise. The Encyclopaedia of Islam reports his distinction at Uhud, his later opposition to Uthman and his death at the Battle of the Camel on 8 December 656, and notes that the report naming Marwan ibn al-Hakam as his killer is disputed among modern scholars."
  ar: "أحد الثمانية الرعيل الأول؛ أسلم بدعوة أبي بكر الصديق في سنوات الدعوة السرية بمكة. وأمه الصعبة كانت تحت أبي سفيان صخر بن حرب على ما ذكر الزبير بن بكار في أنساب قريش، ورماه مروان بن الحكم في أكحله فقتله في قنطرة قرة ووقف عليه علي وقال والله لقد كنت كارهاً لهذا، وقتل وهو ابن أربع وستين سنة وقبره ومسجده بالبصرة مشهور {cite:muruj-al-dhahab p. 658-659}"
  ur: "طلحہ بن عبید اللہ قریش کی شاخ تیم سے محمد کے صحابی اور ابو بکر کے رشتہ دار تھے، جو پہلے آٹھ مسلمانوں اور جنت کی بشارت پانے والے دس افراد میں شمار ہوتے ہیں۔ دائرۃ المعارف اسلامیہ احد میں ان کی نمایاں شرکت، بعد میں عثمان کی مخالفت اور 8 دسمبر 656ء کو جنگِ جمل میں ان کی وفات بیان کرتا ہے، اور بتاتا ہے کہ مروان بن الحکم کو قاتل ٹھہرانے والی روایت جدید محققین کے درمیان متنازع ہے۔ {cite:sallabi-ali-vol2}"
  es: "Un compañero de Mahoma del clan Taym de Quraysh y pariente de Abu Bakr, figura entre los primeros ocho conversos y los diez a quienes se les prometió el Paraíso. La Enciclopedia del Islam relata su distinción en Uhud, su posterior oposición a Uthman y su muerte en la Batalla del Camello el 8 de diciembre de 656, y señala que el relato que señala a Marwan ibn al-Hakam como su asesino es objeto de controversia entre los estudiosos modernos."
  fr: "Compagnon du Prophète Muhammad, issu du clan de Taym de Quraysh et parent d'Abou Bakr, il fut compté parmi les huit premiers convertis et les dix à qui le Paradis fut promis. L'Encyclopédie de l'Islam relate son exploit à la bataille d'Uhud, son opposition ultérieure à Uthman et sa mort lors de la bataille du Chameau le 8 décembre 656. Elle précise également que l'attribution de sa mort à Marwan ibn al-Hakam est contestée par les érudits modernes."
  tr: "İlk sekiz nesilden biri; Mekke'deki gizli görev yıllarında Ebu Bekir el-Siddik'in çağrısını benimsedi. Annesi El-Sa'be, Kureyş'in soy ağaçlarında el-Zubeyr ibn Bakkar'ın bahsettiği üzere, Ebu Sufyan Sakhr bin Harb'ın emrindeydi. Mervan ibn el-Hakam onu sokağına attı, Qantara'da öldürdü, Ali'nin yanında durdu ve 'Tanrı aşkına, bundan nefret ederdim.' dedi. Altmış dört yaşında öldürüldü ve Basra'daki mezarı ile camisi ünlüdür {cite:muruj-al-dhahab, s. 658-659}"
  id: "Salah satu dari delapan generasi pertama; ia menerima panggilan Abu Bakr al-Siddiq selama tahun-tahun misi rahasia di Mekah. Ibunya, Al-Sa'bah, berada di bawah Abu Sufyan Sakhr ibn Harb, seperti yang disebutkan oleh al-Zubayr ibn Bakkar dalam silsilah Quraisy. Marwan ibn al-Hakam melemparkannya ke gangnya, membunuhnya di Qantara, berdiri di samping Ali, dan berkata, 'Demi Tuhan, aku dulu membenci ini.' Ia dibunuh pada usia enam puluh empat tahun, dan makam serta masjidnya di Basra terkenal {cite:muruj-al-dhahab, hlm. 658-659}"
