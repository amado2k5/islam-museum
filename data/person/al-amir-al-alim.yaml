summary:
  ar: "أعجمي دخل مصر، لما رأى إحجام صلاح الدين وأمرائه عن قطع الخطبة العبيدية قال أنا أبتدىء بها فصعد المنبر قبل الخطيب أول جمعة من المحرم سنة سبع وستين ودعا للمستضيء فلم ينكر ذلك أحد {cite:tarikh-khulafa-minhaj-1434 p. 683}."
  en: "The Ajami who, seeing the amirs' hang-back, mounted the minbar before the khatib on the first Jumu'a of Muharram 567 and prayed for al-Mustadi' — and none objected {cite:tarikh-khulafa-minhaj-1434 p. 683}."
  fr: "L’Ajami qui, voyant l’hésitation des émirs, monta en chaire avant le prédicateur au premier vendredi de muharram 567 H et pria pour al-Mustadi’, sans que personne s’y oppose {cite:tarikh-khulafa-minhaj-1434 p. 683}."
  es: "El Ajami que, al ver la reticencia de los emires, subió al minbar frente al khatib en el primer Jumu'a de Muharram 567 y oró por al-Mustadi', y nadie objetó {cite:tarikh-khulafa-minhaj-1434 p. 683}."
  ur: "وہ عجمی جنہوں نے امیروں کا لٹکا ہوا دیکھ کر محرم 567 کی پہلی جمعۃ المبارک کو خطیب کے سامنے منبر پر چڑھ کر مستدی کے لیے دعا کی اور کسی نے اعتراض نہیں کیا۔ 683}۔"
