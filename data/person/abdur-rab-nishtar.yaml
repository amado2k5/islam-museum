summary:
  ar: "ناشط استقلال وسياسي باكستاني (1899–1958) من بيشاور؛ أول وزير اتصالات لباكستان (1947–1949) ثم ثاني حكام البنجاب الغربية (1949–1951)، وأحد المقربين من محمد علي جناح في الرابطة الإسلامية. ترأس الرابطة الإسلامية من 1956 حتى وفاته بنوبة قلبية في كراتشي سنة 1958 ودُفن في مزار قائد."
  en: "Pakistani independence activist and politician (1899–1958) of Peshawar; Pakistan's first minister of communications (1947–1949) and then second governor of West Punjab (1949–1951), and a confidant of Muhammad Ali Jinnah in the Muslim League. He led the Muslim League from 1956 until his death by heart attack at Karachi in 1958, and was buried at Mazar-e-Quaid."
  ur: "پاکستانی ناشطِ آزادی و سیاست دان (1899ء–1958ء) جن کا تعلق پشاور سے تھا؛ پاکستان کے پہلے وزیر مواصلات (1947ء–1949ء) اور پھر مغربی پنجاب کے دوسرے گورنر (1949ء–1951ء)، اور مسلم لیگ میں محمد علی جناح کے معتمد۔ 1956ء سے کراچی میں دل کے دورے سے اپنی وفات (1958ء) تک مسلم لیگ کے صدر رہے اور مزارِ قائد میں دفن ہوئے۔"
