died: { edtf: "0828", hijri: "0213", calendar: julian, precision: month, status: tradition, derived: true, note: "مات محاصراً سرقوسة في رجب سنة ثلاث عشرة ومائتين ودفن بمدينة بالرم من الجزيرة {cite:wafayat-ayan}." }
summary:
  ar: "أسد بن الفرات الفقيه المالكي؛ جاء من الغرب إلى مصر فتلقّى المذهب عن ابن القاسم وكتب إليه أسئلة أصلبها مسائلَ سأله عنها فأجابه فصارت كتاب «الأسدية»؛ ثم أرسله زيادة الله بن الأغلب في جيش إلى جزيرة صقلية فنزلوا على مدينة سرقوسة ولم يزالوا محاصرين لها إلى أن مات ابن الفرات في رجب سنة ثلاث عشرة ومائتين ودُفن بمدينة بالرم {cite:wafayat-ayan}."
  en: "Asad b. al-Furat (d. Rajab 213) — the Maliki faqih who carried Ibn al-Qasim's teaching west and whose questions became the Asadiyya; sent by Ziyadat Allah b. al-Aghlab as judge-commander of the Sicily expedition and died besieging Syracuse, buried at Palermo {cite:wafayat-ayan}."
  es: "Asad b. al-Furat (m. Rajab 213) — el faqih malikí que llevó la enseñanza de Ibn al-Qasim hacia Occidente y cuyas preguntas se convirtieron en la Asadiyya; enviado por Ziyadat Allah b. al-Aghlab como juez comandante de la expedición a Sicilia y murió asediando Siracusa, enterrado en Palermo {cite:wafayat-ayan}."
  fr: "Asad b. al-Furat (d. Rajab 213) — le faqih malikite qui a porté l'enseignement d'Ibn al-Qasim vers l'ouest et dont les questions sont devenues l'Asadiyya; envoyé par Ziyadat Allah b. al-Aghlab comme juge-commandant de l'expédition de Sicile et mort en assiégeant Syracuse, enterré à Palerme {cite:wafayat-ayan}."
  ur: "اسد ب۔ الفرات ⁦(متوفی رجب 213)⁩ - مالکی فقیہ جو ابن القاسم کی تعلیم کو مغرب میں لے گئے اور جن کے سوالات اسدیہ بن گئے۔ زیادت اللہ نے بھیجا الغلاب سسلی مہم کے جج کمانڈر کے طور پر اور سائراکیوز کا محاصرہ کرتے ہوئے انتقال کر گئے، اسے پالرمو میں دفن کیا گیا۔"
  tr: "Maliki hukukçusu Asad ibn al-Furat, batıdan Mısır'a geldi, İbn el-Kâsim'den doktrini aldı ve ona sorular yazdı; Esam da bunları sordu ve cevapladı; bu kitap 'Asadiyya' kitabı oldu; ardından Ziyadat Allah ibn al-Aghlab onu bir orduyla Sicilya adasına gönderdi, burada Siraküza şehrine yerleştiler ve İbn el-Furat 230 Hicri yılında Recep'te ölene kadar kuşatma altında kaldılar ve Bal-Rum şehrine gömüldü {atıf:wafayat-ayan}."
  id: "Asad ibn al-Furat, ahli hukum Maliki, datang dari barat ke Mesir, menerima doktrin dari Ibn al-Qasim, dan menulis pertanyaan-pertanyaan yang ditanyakan dan dijawab oleh Izin Al-Furat, yang kemudian menjadi buku 'Asadiyya'; kemudian Ziyadat Allah ibn al-Aghlab mengirimnya dengan pasukan ke pulau Sisilia, di mana mereka menetap di kota Syracuse dan tetap dikepung hingga Ibn al-Furat meninggal di Rajab pada tahun 230 H dan dimakamkan di kota Bal-Rum {cite:wafayat-ayan}."
