summary:
  ar: "أسد بن الفرات الفقيه المالكي؛ جاء من الغرب إلى مصر فتلقّى المذهب عن ابن القاسم وكتب إليه أسئلة أصلبها مسائلَ سأله عنها فأجابه فصارت كتاب «الأسدية»؛ ثم أرسله زيادة الله بن الأغلب في جيش إلى جزيرة صقلية فنزلوا على مدينة سرقوسة ولم يزالوا محاصرين لها إلى أن مات ابن الفرات في رجب سنة ثلاث عشرة ومائتين ودُفن بمدينة بالرم {cite:wafayat-ayan}."
  en: "Asad b. al-Furat (d. Rajab 213) — the Maliki faqih who carried Ibn al-Qasim's teaching west and whose questions became the Asadiyya; sent by Ziyadat Allah b. al-Aghlab as judge-commander of the Sicily expedition and died besieging Syracuse, buried at Palermo {cite:wafayat-ayan}."
