summary:
  ar: "ماكس هرتس بك، مهندس معماري مجري، عاش من 1856 إلى 1919 بحسب ويكي داتا، وعمل مع لجنة حفظ الآثار العربية بالقاهرة. ألّف دراسة عن جامع السلطان حسن سنة 1899 تعدها دائرة المعارف الإسلامية المرجع الرئيسي في عمارته، وأصدرت مصلحة الآثار خريطة آثار القاهرة المنسوبة إليه سنة 1914 {cite:encyclopaedia-of-islam-2 vol. 4 p. 452}."
  en: "Max Herz Bey, a Hungarian architect (1856-1919 per Wikidata) who worked with the Comité de Conservation des Monuments de l'Art Arabe in Cairo. His 1899 monograph on the Sultan Hasan mosque is treated by the Encyclopaedia of Islam as the main account of its architecture, and the monuments map of Cairo issued by the Department of Antiquities in 1914 is credited to him {cite:encyclopaedia-of-islam-2 vol. 4 p. 452}."
  ur: "میکس ہرٹس بے، ہنگری کے معمار، ویکی ڈیٹا کے مطابق 1856ء سے 1919ء تک، جنہوں نے قاہرہ میں عربی فنون کی یادگاروں کے تحفظ کی کمیٹی کے ساتھ کام کیا۔ سلطان حسن مسجد پر ان کی 1899ء کی تحقیق کو دائرۃ المعارف الاسلامیہ اس کی تعمیرات کا بنیادی بیان مانتا ہے، اور محکمہ آثار کا 1914ء کا قاہرہ کی یادگاروں کا نقشہ انہی سے منسوب ہے {cite:encyclopaedia-of-islam-2 vol. 4 p. 452}."
