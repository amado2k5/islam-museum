summary:
  ar: "أميرال ورجل دولة عثماني، قائد الأسطول العثماني ثم ناظر البحرية في عهد عبد الحميد الثاني. اشتهر بتقريره الصريح إلى السلطان عن الأسطول المتداعي الذي كُلف بقيادته إلى الدردنيل سنة 1897؛ وبعد ثورة 1908 عُزل وحُوكم وخُفّضت رتبته، وقضى سنواته الأخيرة في إسطنبول، ونُشرت مذكراته سنة 2013 مقرونة بنقد رؤوف أورباي له."
  en: "Ottoman admiral and naval minister under Abdul Hamid II. He is remembered for his blunt report to the Sultan on the decayed state of the fleet he was ordered to take to the Dardanelles in 1897; after the 1908 revolution he was dismissed, tried and downgraded, spent his last years in Istanbul, and his memoirs were republished in 2013 together with Rauf Orbay's criticisms of him."
  ur: "عثمانی امیر البحر اور عبد الحمید ثانی کے دور میں وزیرِ بحریہ۔ وہ 1897 میں دردنيل لے جائے جانے والے بیڑے کی خستہ حالی پر سلطان کو دی گئی اپنی صاف گو رپورٹ کے لیے مشہور ہیں؛ 1908 کے انقلاب کے بعد وہ معزول، مقدمے کے کٹہرے میں اور رتبہ گھٹا کر رکھے گئے، آخری برس اسطنبول میں گزارے، اور ان کی یادداشتیں 2013 میں رؤوف اوربے کے ان پر تنقید سمیت دوبارہ شائع ہوئیں۔"
