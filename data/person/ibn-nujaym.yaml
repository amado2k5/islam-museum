summary:
  ar: "الشيخ زين الدين بن إبراهيم المصري الحنفي، الإمام العالم العلامة البحر الفهامة وحيد دهره وفريد عصره، عمدة العلماء العاملين وقدوة الفضلاء الماهرين وختام المحققين والمفتين؛ أخذ عن العلامة قاسم بن قطلوبغا والبرهان الكركي والأمين بن عبد العال وغيرهم، وألف رسائل وحوادث ووقائع في فقه الحنفية من ابتداء أمره، وشرح الكنز وسماه بالبحر الرائق شرح كنز الدقائق وصل به إلى آخر كتاب الإجارة، وكتاب الأشباه والنظائر، وكتاب شرح المنار في الأصول، وكتاب لب الأصول مختصر تحرير الأصول لابن الهمام، وكتاب الفوائد الزينية في فقه الحنفية وصل فيها إلى ألف قاعدة وأكثر، وتعليق على الهداية وحاشية على جامع الفصولين وغير ذلك؛ توفي ضحى يوم الأربعاء من رجب سنة سبعين وتسعمائة {cite:shadharat-dhahab p. 358}."
  en: "Ibn Nujaym — 'the sea, the savant, unique of his age, seal of the verifiers and muftis'; pupil of Qasim b. Qutlubugha and al-Karaki; al-Bahr al-Ra'iq sharh of Kanz al-Daqa'iq, al-Ashbah wa'l-Naza'ir, Sharh al-Manar, Lubb al-Usul, the thousand-rule Fawa'id al-Zayniyya; died Wednesday of Rajab 970 {cite:shadharat-dhahab p. 358}."
  es: "Ibn Nujaym — 'el mar, el sabio, único en su época, sello de los verificadores y muftis'; alumno de Qasim b. Qutlubugha y al-Karaki; al-Bahr al-Ra'iq sharh de Kanz al-Daqa'iq, al-Ashbah wa'l-Naza'ir, Sharh al-Manar, Lubb al-Usul, los mil gobernantes Fawa'id al-Zayniyya; murió el miércoles de Rajab 970 {cita: shadharat-dhahab p. 358}."
  fr: "Ibn Nujaym — « la mer, le savant, unique de son époque, sceau des vérificateurs et des muftis »; élève de Qasim b. Qutlubugha et al-Karaki; al-Bahr al-Ra'iq sharh de Kanz al-Daqa'iq, al-Ashbah wa'l-Naza'ir, Sharh al-Manar, Lubb al-Usul, le Fawa'id al-Zayniyya aux mille règles; décédé mercredi de Rajab 970 {cite: shadharat-dhahab p. 358}."
  ur: "ابن نجیم - 'سمندر، عالم، اپنی عمر کا منفرد، تصدیق کرنے والوں اور مفتیوں کی مہر'؛ قاسم ب کا شاگرد قطلوبغہ اور الکراکی؛ البحر الرائق شرح کنز الدقائق، الاشبہ والنظیر، شرح المنار، لب الصل، ہزار اصول فوائد الزینیہ؛ بدھ 970 رجب کو وفات پائی۔ 358}۔"
  tr: "Şeyh Zain al-Din bin İbrahim el-Masri el-Hanafi, döneminin bilgin, eşsiz ve bilge, uygulayan alimlerin başı, erdemlilerin rol modeli ve araştırmacılar ile müftülerin mührü olan biri; alim Kasım bin Kutlubgha, el-Burhan el-Karaki, el-Emin bin Abdül-Al ve diğerlerinin yanında eğitim aldı. Hanefi fikıhında en başından itibaren risaleler, olaylar ve olaylar yazdı ve el-Kanz el-Reyiq'i açıkladı; bu adı el-Bahr el-Raiq İcara kitabı, el-Eşbah vel-Nazeir kitabı, Sharh al-Manar prensipler kitabı, İbn el-Humam'ın 'Ludb al-Usul' (ilkelerin kurtuluşuyla kısaltılmış) kitabı, binlerce ilke içeren Hanefi fıkhatı 'Al-Fawa'id al-Zainiya' kitabı, el-Hidayah üzerine bir şerh, Cami'l-Fusululin üzerine kenar tefsiri ve diğerlerine ulaştı; 978 Hicri yılında, Rajab Çarşamba sabahı vefat etti."
  id: "Sheikh Zain al-Din bin Ibrahim al-Masri al-Hanafi, imam ulama, bijaksana dan unik pada zamannya, pemimpin para ulama yang bertaat, panutan bagi para peluhur, serta lambang para peneliti dan mufti; ia belajar di bawah bimbingan ulama Qasim ibn Qutlubgha, al-Burhan al-Karaki, al-Amin ibn Abd al-Aal, dan lainnya. Ia menulis risalah, kejadian, dan peristiwa dalam yurisprudensi Hanafi sejak awal, dan menjelaskan al-Kanz al-Rayiq, yang ia sebut al-Bahr al-Raiq, yang mencapai akhir kitab Ijarah, kitab al-Ashbah wal-Naza'ir, buku Sharh al-Manar dalam prinsip, buku 'Ludb al-Usul' (diringkas oleh pembebasan prinsip-prinsip) oleh Ibn al-Humam, buku 'Al-Fawa'id al-Zainiya' dalam yurisprudensi Hanafi, yang memuat seribu prinsip lebih, komentar tentang al-Hidayah, komentar marginal tentang Jami' al-Fusululin, dan lainnya; ia meninggal pada pagi hari Rabu, Rajab pada tahun 978 H."
