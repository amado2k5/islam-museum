summary:
  ar: "الشيخ زين الدين بن إبراهيم المصري الحنفي، الإمام العالم العلامة البحر الفهامة وحيد دهره وفريد عصره، عمدة العلماء العاملين وقدوة الفضلاء الماهرين وختام المحققين والمفتين؛ أخذ عن العلامة قاسم بن قطلوبغا والبرهان الكركي والأمين بن عبد العال وغيرهم، وألف رسائل وحوادث ووقائع في فقه الحنفية من ابتداء أمره، وشرح الكنز وسماه بالبحر الرائق شرح كنز الدقائق وصل به إلى آخر كتاب الإجارة، وكتاب الأشباه والنظائر، وكتاب شرح المنار في الأصول، وكتاب لب الأصول مختصر تحرير الأصول لابن الهمام، وكتاب الفوائد الزينية في فقه الحنفية وصل فيها إلى ألف قاعدة وأكثر، وتعليق على الهداية وحاشية على جامع الفصولين وغير ذلك؛ توفي ضحى يوم الأربعاء من رجب سنة سبعين وتسعمائة {cite:shadharat-dhahab p. 358}."
  en: "Ibn Nujaym — 'the sea, the savant, unique of his age, seal of the verifiers and muftis'; pupil of Qasim b. Qutlubugha and al-Karaki; al-Bahr al-Ra'iq sharh of Kanz al-Daqa'iq, al-Ashbah wa'l-Naza'ir, Sharh al-Manar, Lubb al-Usul, the thousand-rule Fawa'id al-Zayniyya; died Wednesday of Rajab 970 {cite:shadharat-dhahab p. 358}."
