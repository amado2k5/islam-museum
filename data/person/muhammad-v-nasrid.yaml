label:
  ar: السلطان محمد الخامس النصري
  en: Sultan Muhammad V al-Nasri
  es: "Sultan Muhammad V al-Nasri"
  fr: "Sultan Muhammad V al-Nasri"
summary:
  ar: "أبو عبد اللّه محمد بن يوسف بن نصر، سلطان غرناطة؛ نُصب بعد مهلك أبيه أبي الحجاج فحجبه مولاه رضوان واستبد عليه حتى خلع، فلحق بفاس مملكة بني مرين وامتحن بين أيديهم، ثم أرتجع ملكه سنة 763هـ، ودانت له الأندلس حتى عرف بصاحب الحمراء وأعظم ملوك بني الأحمر عمراناً وملكاً."
  en: "Abu Abd Allah Muhammad ibn Yusuf ibn Nasr, sultan of Granada; installed after his father Abu al-Hajjaj's death, then held under ward by his mawla Ridwan who ruled over him until he was deposed — he fled to the Marinid court at Fez where he recited his famous plea-poem, and regained his kingdom in 763 AH, becoming master of the Alhambra and the greatest of the Banu al-Ahmar kings in building and dominion."
  es: "Abu Abd Allah Muhammad ibn Yusuf ibn Nasr, sultán de Granada, fue entronizado tras la muerte de su padre Abu al-Hajjaj y puesto bajo la tutela de su mawla Ridwan, quien gobernó sobre él hasta su deposición. Huyó a la corte mariní de Fez, donde recitó su famoso poema de súplica, y recuperó su reino en el año 763 de la Hégira, convirtiéndose en el señor de la Alhambra y en el más grande de los reyes Banu al-Ahmar en construcción y dominio."
  fr: "Abu Abd Allah Muhammad ibn Yusuf ibn Nasr, sultan de Grenade; installé après la mort de son père Abu al-Hajjaj, puis placé sous la tutelle de son mawla Ridwan qui régna sur lui jusqu'à sa destitution — il s'enfuit à la cour mérinide de Fès où il récita son célèbre poème de supplication, et recouvra son royaume en 763 AH, devenant maître de l'Alhambra et le plus grand des rois Banu al-Ahmar en matière de construction et de domination."
