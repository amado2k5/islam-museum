label:
  ar: السلطان محمد الخامس النصري
  en: Sultan Muhammad V al-Nasri
summary:
  ar: "أبو عبد اللّه محمد بن يوسف بن نصر، سلطان غرناطة؛ نُصب بعد مهلك أبيه أبي الحجاج فحجبه مولاه رضوان واستبد عليه حتى خلع، فلحق بفاس مملكة بني مرين وامتحن بين أيديهم، ثم أرتجع ملكه سنة 763هـ، ودانت له الأندلس حتى عرف بصاحب الحمراء وأعظم ملوك بني الأحمر عمراناً وملكاً."
  en: "Abu Abd Allah Muhammad ibn Yusuf ibn Nasr, sultan of Granada; installed after his father Abu al-Hajjaj's death, then held under ward by his mawla Ridwan who ruled over him until he was deposed — he fled to the Marinid court at Fez where he recited his famous plea-poem, and regained his kingdom in 763 AH, becoming master of the Alhambra and the greatest of the Banu al-Ahmar kings in building and dominion."
