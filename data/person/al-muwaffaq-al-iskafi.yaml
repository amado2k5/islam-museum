id: person/al-muwaffaq-al-iskafi
class: person
label: { ar: "أبو علي الحسن بن محمد الإسكافي الموفق", en: "Abu Ali al-Hasan ibn Muhammad al-Iskafi al-Muwaffaq", fr: "Abu Ali al-Hasan ibn Muhammad al-Iskafi al-Muwaffaq", es: "Abu Ali al-Hasan ibn Muhammad al-Iskafi al-Muwaffaq", ur: "ابو علی الحسن بن محمد الاسکافی الموفق" }
summary:
  ar: "الحسن بن محمد بن إسماعيل أبو علي الإسكافي ويلقب بالموفق، كان متقدماً عند بهاء الدولة بن ناصر فولاه بغداد فقبض على اليهود وأخذ منهم دنانير وهرب إلى البطيحة فأقام بها سنتين ثم خرج فوزر لبهاء الدولة، وكان شهماً في الحروب منصوراً فيها فأخذ بلاد فارس ممن استولى عليها وارتفع أمره حتى قال قائل لبهاء الدولة زينك الله يا مولانا في عين الموفق فألغ في عقوبته ثم قتله سنة أربع وتسعين وله تسع وأربعون سنة {cite:muntazam-ibn-al-jawzi j.7 p.228-229}."
  en: "Al-Hasan ibn Muhammad ibn Isma'il, Abu Ali al-Iskafi, known as al-Muwaffaq. He was highly regarded by Baha' al-Dawla ibn Nasir, who appointed him over Baghdad; he arrested the Jews and took dinars from them, then fled to al-Bataih, where he stayed two years, and then came out and served as vizier to Baha' al-Dawla. He was valiant in war and victorious in it; he took the lands of Persia from those who had seized them. His standing rose until someone said to Baha' al-Dawla, 'May God adorn you, my lord, in the eye of al-Muwaffaq'; he pressed on with punishing him, then killed him in 394, aged forty-nine {cite:muntazam-ibn-al-jawzi j.7 p.228-229}."
  fr: "Al-Hasan ibn Muhammad ibn Isma'il, Abu Ali al-Iskafi, connu sous le nom d'al-Muwaffaq. Il était hautement estimé par Baha' al-Dawla ibn Nasir, qui l'a nommé sur Bagdad ; il a arrêté les Juifs et leur a pris des dinars, puis s'est enfui à al-Bataih, où il est resté deux ans, puis il sortit et servit de vizir à Baha' al-Dawla. Il était vaillant dans la guerre et victorieux dans elle ; il a pris les terres de la Perse de ceux qui les avaient saisis. Sa position s'éleva jusqu'à ce que quelqu'un dise à Baha' al-Dawla : \"Que Dieu te pare, mon seigneur, aux yeux d'al-Muwaffaq\" ; il continua à le punir, puis le tua en 394, âgé de 49 ans {cite:muntazam-ibn-al-jawzi j.7 p.228-229}."
  es: "Al-Hasan ibn Muhammad ibn Isma'il, Abu Ali al-Iskafi, conocido como al-Muwaffaq. Era muy respetado por Baha' al-Dawla ibn Nasir, quien lo nombró visir de Bagdad. Arrestó a los judíos y les extorsionó con dinares, luego huyó a al-Bataih, donde permaneció dos años, y después regresó y sirvió como visir de Baha' al-Dawla. Fue valiente y victorioso en la guerra; recuperó las tierras de Persia de quienes las habían ocupado. Su prestigio aumentó hasta que alguien le dijo a Baha' al-Dawla: «Que Dios te bendiga, mi señor, ante los ojos de al-Muwaffaq». Este siguió adelante con su castigo y finalmente lo mató en el año 394, a la edad de cuarenta y nueve años {cite:muntazam-ibn-al-jawzi j.7 p.228-229}."
  ur: "الحسن بن محمد بن اسماعیل، ابو علی الاسکافی الموفق کے نام سے مشہور ہیں۔ بہاء الدولہ بن ناصر نے ان کی بہت عزت کی، جس نے اسے بغداد پر مقرر کیا۔ اس نے یہودیوں کو گرفتار کیا اور ان سے دینار لیے، پھر البطیح فرار ہو گئے، جہاں وہ دو سال رہے، پھر باہر آ کر بہاء الدولہ کے وزیر کے طور پر کام کیا۔ وہ جنگ میں بہادر تھا اور اس میں فاتح تھا۔ اس نے ان لوگوں سے فارس کی زمینیں چھین لیں جنہوں نے ان پر قبضہ کیا تھا۔ اس کا کھڑا ہونا بلند ہوا یہاں تک کہ کسی نے بہاء الدولہ سے کہا، 'خدا آپ کو الموفق کی نظر میں آراستہ کرے'۔ اس نے اسے سزا دینے پر زور دیا، پھر 394 میں، انتالیس سال کی عمر میں اسے قتل کر دیا۔"
  tr: "El-Hasan ibn Muhammed ibn İsmayıl Ebu Ali el-İskafi, lakaplı El-Muvaffi, Baha'd-Devle ibn Nasir'den öndeydi, onu Bağdat'a atadı, Yahudileri ele geçirdi, onlardan dinar aldı, iki yıl kaldığı El-Beytiha'ya kaçtı, ardından Favzir Baha'd-Devle'ye gitti. Savaşlarda kahramandı ve savaşlarda zafer kazandı. Ele geçirdiği kişilerden Pers'i ele geçirdi ve statüsü o kadar yükseldi ki, 'Allah seni al-Muwaffaq'ın gözünde korusun, efendimiz, bereketli etsin.' Cezası bozuldu, sonra doksan dört hicri'de öldürüldü ve kırk dokuz yaşındaydı. {Kaynak:Muntazam-ibn-al-jawzi J.7, s.228-229}."
  id: "Al-Hasan ibn Muhammad ibn Isma'il Abu Ali al-Iskafi, yang dijuluki Al-Muwaffiq, mendahului Baha' al-Dawla ibn Nasir, mengangkatnya ke Baghdad, menangkap orang Yahudi, mengambil dinar dari mereka, melarikan diri ke Al-Batiha, di mana ia tinggal selama dua tahun, kemudian Fawzir pergi ke Baha' al-Dawla. Ia adalah pahlawan dalam peperangan dan menang di dalamnya. Ia merebut Persia dari mereka yang telah ia rebut, dan statusnya naik hingga ia berkata, 'Semoga Allah memberkatimu, tuan kami, di mata al-Muwaffaq.' Hukumannya dibatalkan, lalu ia dibunuh pada tahun sembilan puluh empat H, dan usianya empat puluh sembilan tahun. {cite:Muntazam-ibn-al-jawzi J.7, hlm.228-229}."
