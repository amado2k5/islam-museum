id: person/al-muwaffaq-al-iskafi
class: person
label: { ar: "أبو علي الحسن بن محمد الإسكافي الموفق", en: "Abu Ali al-Hasan ibn Muhammad al-Iskafi al-Muwaffaq" }
summary:
  ar: "الحسن بن محمد بن إسماعيل أبو علي الإسكافي ويلقب بالموفق، كان متقدماً عند بهاء الدولة بن ناصر فولاه بغداد فقبض على اليهود وأخذ منهم دنانير وهرب إلى البطيحة فأقام بها سنتين ثم خرج فوزر لبهاء الدولة، وكان شهماً في الحروب منصوراً فيها فأخذ بلاد فارس ممن استولى عليها وارتفع أمره حتى قال قائل لبهاء الدولة زينك الله يا مولانا في عين الموفق فألغ في عقوبته ثم قتله سنة أربع وتسعين وله تسع وأربعون سنة {cite:muntazam-ibn-al-jawzi j.7 p.228-229}."
  en: "Al-Hasan ibn Muhammad ibn Isma'il, Abu Ali al-Iskafi, known as al-Muwaffaq. He was highly regarded by Baha' al-Dawla ibn Nasir, who appointed him over Baghdad; he arrested the Jews and took dinars from them, then fled to al-Bataih, where he stayed two years, and then came out and served as vizier to Baha' al-Dawla. He was valiant in war and victorious in it; he took the lands of Persia from those who had seized them. His standing rose until someone said to Baha' al-Dawla, 'May God adorn you, my lord, in the eye of al-Muwaffaq'; he pressed on with punishing him, then killed him in 394, aged forty-nine {cite:muntazam-ibn-al-jawzi j.7 p.228-229}."
