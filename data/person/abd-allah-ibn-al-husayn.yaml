  es: "Abd Allah ibn al-Husayn ibn Ali ibn Abi Talib, el infante de Karbala; Ibn Kathir lo enumera como el segundo de los hijos de Husayn que murieron con él en el año 61 AH; la tradición duodecimana lo llama Ali al-Asghar {cite:al-bidaya-wal-nihaya}."
