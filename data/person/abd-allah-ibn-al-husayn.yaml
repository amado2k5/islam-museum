  ar: "عبد الله بن الحسين بن علي بن أبي طالب، رضيع كربلاء؛ يعدّه ابن كثير ثاني أولاد الحسين الذين قتلوا معه سنة 61هـ، وتسميه الرواية الإثني عشرية عليا الأصغر {cite:al-bidaya-wal-nihaya}."
  en: "Abd Allah ibn al-Husayn ibn Ali ibn Abi Talib, the infant of Karbala; Ibn Kathir lists him as the second of Husayn's sons killed with him in 61 AH — the Twelver tradition names him Ali al-Asghar {cite:al-bidaya-wal-nihaya}."
