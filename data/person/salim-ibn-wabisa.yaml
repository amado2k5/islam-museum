  ar: "سالم بن وابصة بن معبد الأسدي الرقي، أمير من أهل الحديث، من التابعين في ما ذكر الكتاب، وكان شاعرا. ولي إمرة الرقة لمحمد بن مروان نحو ثلاثين عاما، ومات في آخر خلافة هشام. وتوفي نحو سنة 125هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3132}"
  en: "Salim ibn Wabisa ibn Mabad al-Asadi al-Raqqi, an emir and hadith scholar counted among the Successors by the book, who was also a poet. He governed Raqqa for Muhammad ibn Marwan for about thirty years and died at the end of Hisham's caliphate, around 125 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3132}"
