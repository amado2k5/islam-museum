summary:
  ar: "سالم بن وابصة بن معبد الأسدي الرقي، أمير من أهل الحديث، من التابعين في ما ذكر الكتاب، وكان شاعرا. ولي إمرة الرقة لمحمد بن مروان نحو ثلاثين عاما، ومات في آخر خلافة هشام. وتوفي نحو سنة 125هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3132}"
  en: "Salim ibn Wabisa ibn Mabad al-Asadi al-Raqqi, an emir and hadith scholar counted among the Successors by the book, who was also a poet. He governed Raqqa for Muhammad ibn Marwan for about thirty years and died at the end of Hisham's caliphate, around 125 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3132}"
  es: "Salim ibn Wabisa ibn Mabad al-Asadi al-Raqqi, emir y erudito de hadices, considerado uno de los Sucesores del Libro, fue también poeta. Gobernó Raqqa para Muhammad ibn Marwan durante unos treinta años y falleció al final del califato de Hisham, alrededor del año 125 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3132}"
  fr: "Salim ibn Wabisa ibn Mabad al-Asadi al-Raqqi, émir et spécialiste du hadith, considéré comme l'un des Successeurs selon le Livre, était également poète. Il gouverna Raqqa pour Muhammad ibn Marwan pendant une trentaine d'années et mourut à la fin du califat d'Hisham, vers 125 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3132}"
