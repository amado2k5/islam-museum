summary:
  ar: "أبو عبد الله محمد بن القاسم بن خلاد بن ياسر الهاشمي بالولاء الضرير، مولى أبي جعفر المنصور، المعروف بأبي العيناء؛ صاحب النوادر والشعر والأدب؛ أصله من الأهواز وملتف بالبصرة وبها طلب الحديث وكتب الأدب وسمع من أبي عبيدة والأصمعي ويزيد الأنصاري والعتبي وغيرهم؛ كان من أحفظ الناس وأفصحهم لساناً ومن ظرفاء وقته من اللِّسن وسرعة الجواب والذكاء ما لم يكن في أحد من نظرائه؛ له أخبار حسان وأشعار ملاح منثورة في كثير من الكتب الأدبية؛ قال له المتوكل وقد دخل عليه في قصره الجعفري سنة ست وأربعين ومائتين: ما تقول في دارنا هذه؟ فقال: إن الناس بنوا الدور في الدنيا وأنت بنيت الدنيا في دارك {cite:wafayat-ayan}."
  en: "Abu al-Ayna (190–283) — the blind wit of Baghdad, mawla of al-Mansur; heard hadith and adab from Abu Ubayda and al-Asma'i; unmatched for memory and instant repartee, his anecdotes fill the adab books; famous for his quip to al-Mutawakkil at the Ja'fari palace {cite:wafayat-ayan}."
