summary:
  ar: "سياسي ورجل أعمال صومالي (1939–2021)، رجل أعمال مقديشاوي وقيادي في المؤتمر الصومالي الموحد، أُعلن رئيسا للصومال في 26 يناير 1991 بعد الإطاحة بمحمد سياد بري، فصار رابع رؤساء الصومال (1991–2000) دون أن تتجاوز سلطته أجزاء من العاصمة، منافسا محمد فرح عيديد؛ ومات في نيروبي في 10 مارس 2021 بكوفيد-19."
  en: "Somali politician and businessman (1939–2021), a Mogadishu-based entrepreneur and United Somali Congress figure who was proclaimed president of Somalia on 26 January 1991 after the overthrow of Mohamed Siad Barre, becoming Somalia's fourth president (1991–2000) without his authority extending beyond parts of the capital, in rivalry with Mohamed Farrah Aidid; he died in Nairobi on 10 March 2021 after contracting COVID-19."
  ur: "صومالی سیاست دان اور تاجر (1939ء–2021ء)؛ مقديشو کے کاروباری اور متحدہ صومالی کانگریس کے رہنما؛ محمد سیاد باری کی معزولی کے بعد 26 جنوری 1991ء کو صومالیہ کے صدر قرار دیے گئے اور یوں صومالیہ کے چوتھے صدر بنے (1991ء–2000ء)، مگر ان کا اختیار دارالحکومت کے بعض حصوں سے آگے نہ بڑھ سکا اور وہ محمد فرح عیدید کے مدمقابل رہے؛ 10 مارچ 2021ء کو نیروبی میں کووڈ-19 سے وفات پائی۔"
