summary:
  ar: "مغنية وكاتبة أغانٍ أمريكية وُلدت في نيويورك وتقيم في نيو أورلينز؛ تدرّبت على الجاز والفولك وتأثرت بأصوات جذورها اليهودية الأشكنازية وبموسيقى الهيب هوب والكاريبي، وقدّمت عرضها المسرحي المنفرد «هوملس إن هوملاند» عن الهوية اليهودية والصراع الإسرائيلي الفلسطيني، وأصدرت ألبومها الأول «بريكينغ شادوز» (2019) ثم «غليتر آند بلود» (2023)، وغنّت في مركز كينيدي ومركز سكيربال ومواقع أخرى. هي شخص مختلف عن سارة عيدان، ملكة جمال العراق 2017."
  en: "American singer-songwriter born in New York and based in New Orleans. Jazz- and folk-trained and hip-hop educated, she is influenced by the sounds of her Ashkenazi Jewish roots and by Latinx and Caribbean music; she created the solo theatre show Homeless in Homeland, about Jewish identity and the Israeli-Palestinian conflict, released her debut album Breaking Shadows (2019) and Glitter & Blood (2023), and has performed at the Kennedy Center, the Skirball Cultural Center and other venues. She is a different person from Sarah Idan, Miss Universe Iraq 2017."
  ur: "امریکی گلوکارہ و نغمہ نگار، نیویارک میں پیدا ہوئیں اور نیو اورلینز میں مقیم ہیں؛ جاز اور فوک کی تربیت یافتہ اور ہپ ہاپ سے واقف، وہ اپنی اشکنازی یہودی جڑوں کی آوازوں اور لاطینی و کیریبین موسیقی سے متاثر ہیں؛ انھوں نے یک فردی تھیٹر شو «ہوم لیس ان ہوم لینڈ» پیش کیا جو یہودی شناخت اور اسرائیلی-فلسطینی تنازعے پر ہے، پہلا البم «بریکنگ شیڈوز» (2019) اور «گلٹر اینڈ بلڈ» (2023) جاری کیا، اور کینیڈی سینٹر و اسکر بال کلچرل سینٹر سمیت کئی مقامات پر پرفارم کیا۔ وہ عراق کی مس یونیورس 2017 سارہ عیدان سے الگ شخصیت ہیں۔"
  es: "Cantautora estadounidense nacida en Nueva York y residente en Nueva Orleans. Formada en jazz y folk, y con formación en hip-hop, se nutre de la música de sus raíces judías asquenazíes y de la música latina y caribeña. Creó el monólogo teatral «Homeless in Homeland», sobre la identidad judía y el conflicto israelí-palestino, lanzó sus álbumes debut «Breaking Shadows» (2019) y «Glitter & Blood» (2023), y se ha presentado en el Kennedy Center, el Skirball Cultural Center y otros escenarios. Es una persona distinta a Sarah Idan, Miss Universo Irak 2017."
  fr: "Auteure-compositrice-interprète américaine née à New York et installée à La Nouvelle-Orléans. Formée au jazz et au folk, et imprégnée de hip-hop, elle puise son inspiration dans les sonorités de ses racines juives ashkénazes et dans les musiques latines et caribéennes. Elle a créé le spectacle solo « Homeless in Homeland », qui explore l'identité juive et le conflit israélo-palestinien. Son premier album, « Breaking Shadows » (2019), est suivi de « Glitter & Blood » (2023). Elle s'est produite au Kennedy Center, au Skirball Cultural Center et dans d'autres salles prestigieuses. Elle est différente de Sarah Idan, Miss Univers Irak 2017."
  tr: "New York'ta doğmuş ve New Orleans'ta yaşayan Amerikalı bir şarkıcı ve söz yazarı; caz ve folk eğitimi almış, Aşkenaz Yahudi kökenlerinden ve hip hop ile Karayip müziğinin seslerinden etkilenmiştir. Yahudi kimliği ve İsrail-Filistin çatışması üzerine solo tiyatro gösterisi \"Homes in Homes\"u sunmuş, ilk albümü \"Breaking Shadows\"u (2019), ardından \"Glitter and Blood\"u (2023) çıkarmış ve Kennedy Center, Scarball Center ve diğer mekanlarda performans sergilemiştir. Sarah Aidan, Miss Iraq 2017'den farklı bir kişidir."
  id: "Seorang penyanyi dan penulis lagu Amerika yang lahir di New York dan tinggal di New Orleans; terlatih jazz dan folk serta dipengaruhi oleh akar Yahudi Ashkenazi serta suara hip hop dan musik Karibia. Dia membawakan pertunjukan teater solonya \"Homes in Homeland\" tentang identitas Yahudi dan konflik Israel-Palestina, merilis album pertamanya \"Breaking Shadows\" (2019), kemudian \"Glitter and Blood\" (2023), dan telah tampil di Kennedy Center, Scarball Center, dan tempat lainnya. Dia adalah orang yang berbeda dari Sarah Aidan, Miss Iraq 2017."
