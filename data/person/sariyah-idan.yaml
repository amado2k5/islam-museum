summary:
  ar: "مغنية وكاتبة أغانٍ أمريكية وُلدت في نيويورك وتقيم في نيو أورلينز؛ تدرّبت على الجاز والفولك وتأثرت بأصوات جذورها اليهودية الأشكنازية وبموسيقى الهيب هوب والكاريبي، وقدّمت عرضها المسرحي المنفرد «هوملس إن هوملاند» عن الهوية اليهودية والصراع الإسرائيلي الفلسطيني، وأصدرت ألبومها الأول «بريكينغ شادوز» (2019) ثم «غليتر آند بلود» (2023)، وغنّت في مركز كينيدي ومركز سكيربال ومواقع أخرى. هي شخص مختلف عن سارة عيدان، ملكة جمال العراق 2017."
  en: "American singer-songwriter born in New York and based in New Orleans. Jazz- and folk-trained and hip-hop educated, she is influenced by the sounds of her Ashkenazi Jewish roots and by Latinx and Caribbean music; she created the solo theatre show Homeless in Homeland, about Jewish identity and the Israeli-Palestinian conflict, released her debut album Breaking Shadows (2019) and Glitter & Blood (2023), and has performed at the Kennedy Center, the Skirball Cultural Center and other venues. She is a different person from Sarah Idan, Miss Universe Iraq 2017."
  ur: "امریکی گلوکارہ و نغمہ نگار، نیویارک میں پیدا ہوئیں اور نیو اورلینز میں مقیم ہیں؛ جاز اور فوک کی تربیت یافتہ اور ہپ ہاپ سے واقف، وہ اپنی اشکنازی یہودی جڑوں کی آوازوں اور لاطینی و کیریبین موسیقی سے متاثر ہیں؛ انھوں نے یک فردی تھیٹر شو «ہوم لیس ان ہوم لینڈ» پیش کیا جو یہودی شناخت اور اسرائیلی-فلسطینی تنازعے پر ہے، پہلا البم «بریکنگ شیڈوز» (2019) اور «گلٹر اینڈ بلڈ» (2023) جاری کیا، اور کینیڈی سینٹر و اسکر بال کلچرل سینٹر سمیت کئی مقامات پر پرفارم کیا۔ وہ عراق کی مس یونیورس 2017 سارہ عیدان سے الگ شخصیت ہیں۔"
