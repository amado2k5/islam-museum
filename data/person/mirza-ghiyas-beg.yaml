summary:
  ar: "وزير فارسي الأصل في بلاط المغول بالهند (نحو 1544–1622)، أصغر أبناء الخواجة محمد شريف، الوزير والشاعر في بلاط الصفويين. وُلد في طهران، وبعد وفاة أبيه سنة 1576 ساءت أحوال الأسرة فهاجر إلى الهند؛ سُلب في الطريق حتى لم يبقَ له سوى بغلين، وفي قندهار وُلدت ابنته مهر النساء (نور جهان لاحقًا) فآواهم التاجر مالك مسعود وأدخله لاحقًا في خدمة أكبر. عيّنه أكبر ديوانًا (أمين خزانة) لكابل ولقّبه «اعتماد الدولة» (عماد الدولة)، وفي عهد جهانغير الذي تزوّج ابنته نور جهان سنة 1611 صار وكيل المملكة (وزيرها الأعظم) من 1611 إلى 1621 وبلغ رتبة ستة آلاف. هو والد نور جهان وآصف خان وجدّ ممتاز محل لأمها. مات قرب كانغرا سنة 1622 ونُقل جسده إلى أغرا فدُفن حيث بنت ابنته ضريح اعتماد الدولة."
  en: "Persian emigré who became a Mughal grandee (c. 1544-1622), youngest son of Khwajeh Mohammad-Sharif, a poet-vizier of the Safavid court. Born at Tehran, he emigrated to India after his father's death in 1576 ruined the family; robbed on the road down to two mules, he was taken in at Kandahar - where his wife Asmat Begam gave birth to Mihr-un-Nissa, the future Nur Jahan - by the merchant Malik Masud, who later helped him into Akbar's service. Akbar made him diwan (treasurer) of Kabul and gave him the title I'timad-ud-Daulah, 'Pillar of the State'; under Jahangir, who married his daughter Nur Jahan in 1611, he was Vakil (grand vizier) of the empire from 1611 to 1621, rising to a rank of 6,000 with standard and drums. He was the father of Nur Jahan and Asaf Khan and the maternal grandfather of Mumtaz Mahal. He died near Kangra in 1622 and was buried at Agra, where Nur Jahan later built the Tomb of I'timad-ud-Daulah."
  ur: "مغل دربار کے فارسی النسل وزیر (تقریباً 1544ء–1622ء)، خواجہ محمد شریف کے سب سے چھوٹے صاحبزادے، جو صفوی دربار کے وزیر و شاعر تھے۔ تہران میں پیدا ہوئے؛ 1576ء میں والد کی وفات کے بعد خاندان کی حالت بگڑی تو ہندوستان ہجرت کی۔ راستے میں لوٹے گئے، قندھار میں بیٹی مہر النساء (بعد ازاں نور جہاں) پیدا ہوئی اور تاجر مالک مسعود نے پناہ دی اور بعد میں اکبر کی خدمت میں داخل کرایا۔ اکبر نے انھیں کابل کا دیوان بنایا اور «اعتماد الدولہ» کا لقب دیا؛ جہانگیر — جس نے 1611ء میں ان کی بیٹی نور جہاں سے شادی کی — کے عہد میں 1611ء سے 1621ء تک وکیلِ سلطنت (وزیر اعظم) رہے۔ یہ نور جہاں اور آصف خان کے والد اور ممتاز محل کے نانا تھے۔ 1622ء میں کانگڑہ کے قریب وفات پائی اور آگرہ میں دفن ہوئے، جہاں نور جہاں نے مقبرۂ اعتماد الدولہ بنوایا۔"

