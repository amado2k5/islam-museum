summary:
  ar: "معلّمة فلسطينية من مخيم الدهيشة قرب بيت لحم؛ طوّرت منهجًا تعليميًا قائمًا على اللعب تحت شعار «لا للعنف» لمساندة الأطفال المتضررين من الصدمات، ودونّته في كتاب «نلعب ونتعلم»، وفازت سنة 2016 بجائزة المعلم العالمية ⁦(Global Teacher Prize)⁩ وقيمتها مليون دولار."
  en: "Palestinian schoolteacher from the Dheisheh refugee camp near Bethlehem who developed a play-based method under the slogan 'No to Violence' to support children traumatised by conflict, set out in her book We Play and Learn; in 2016 she won the second annual Global Teacher Prize worth one million dollars."
  ur: "فلسطینی معلمہ، بیت لحم کے قریب دہیشہ مہاجر کیمپ سے؛ انہوں نے «نہ ظلم نہ تشدد» کے نعرے کے تحت کھیل پر مبنی تدریسی طریقہ ایجاد کیا جو تشدد سے متاثرہ بچوں کی مدد کرتا ہے، اسے کتاب «ہم کھیلتے اور سیکھتے ہیں» میں مدوّن کیا؛ 2016 میں دس لاکھ ڈالر کی عالمی معلم انعام ⁦(Global Teacher Prize)⁩ کی دوسری فاتح بنیں۔"
  es: "Maestra palestina del campo de refugiados de Dheisheh, cerca de Belén, desarrolló un método basado en el juego bajo el lema \"No a la violencia\" para apoyar a los niños traumatizados por el conflicto, tal como lo expone en su libro \"Jugamos y aprendemos\"; en 2016 ganó el segundo Premio Global al Maestro, dotado con un millón de dólares."
  fr: "Une institutrice palestinienne du camp de réfugiés de Dheisheh, près de Bethléem, qui a développé une méthode basée sur le jeu sous le slogan « Non à la violence » pour soutenir les enfants traumatisés par le conflit, présentée dans son livre We Play and Learn; en 2016, elle a remporté le deuxième prix annuel mondial des enseignants d'une valeur d'un million de dollars."
  tr: "Beytüllahim yakınlarındaki Dheisheh kampından bir Filistinli öğretmen, travma yaşayan çocukları desteklemek için \"Şiddete Hayır\" sloganıyla oyun temelli bir eğitim müfredatı geliştirdi; bu program \"Biz Oynuz ve Öğreniyoruz\" adlı kitapta belgelenmiş ve 2016'da bir milyon dolar değerinde Küresel Öğretmen Ödülü'nü kazanmıştır."
  id: "Seorang guru Palestina dari kamp Dheisheh dekat Bethlehem mengembangkan kurikulum pendidikan berbasis bermain dengan slogan \"Tidak terhadap Kekerasan\" untuk mendukung anak-anak yang terdampak trauma, yang didokumentasikan dalam buku \"We Play and Learn,\" dan memenangkan Global Teacher Prize pada tahun 2016, senilai satu juta dolar."
