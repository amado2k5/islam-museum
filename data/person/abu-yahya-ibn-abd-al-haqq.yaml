id: person/abu-yahya-ibn-abd-al-haqq
class: person
label:
  ar: أبو يحيى بن عبد الحق المريني
  en: Abu Yahya ibn Abd al-Haqq al-Marini
  fr: "Abu Yahya ibn Abd al-Haqq al-Marini"
  es: "Abu Yahya ibn Abd al-Haqq al-Marini"
  ur: "ابو یحییٰ بن عبد الحق المرینی۔"
summary:
  ar: "أبو يحيى بن عبد الحق المريني، مديل الأمر لبني مرين وفاتح الأمصار ومقيم الرسوم الملوكية؛ لما ولي أمرهم سنة اثنتين وأربعين وستمائة بعد مهلك أخيه محمد بوادي ياباش، كان من أول نظره لقومه أن قسم بلاد المغرب وقبائل جبايته بين عشائر بني مرين وأنزل كلاً منهم في ناحية تسوغها طعمة فاستركبوا الرجل أتباعهم وتوفرت عساكرهم، وقام بتدبير الملك ونظامه من الآلة والرسوم لمن بعده من أمرائهم."
  en: "Abu Yahya ibn Abd al-Haqq al-Marini, 'the state's architect' for Banu Marin, conqueror of the cities and founder of their royal usages; taking the command in 642 after his brother Muhammad's fall at Wadi Yabash, his first act of state was to divide Morocco's lands and tributary tribes among the Marinid clans, settling each in a tract they might live on — so they mounted their followers, gathered their retainers, and their armies multiplied — and he set up the machinery of kingship for the amirs after him."
  fr: "Abu Yahya ibn Abd al-Haqq al-Marini, « architecte de l'État » des Banu Marin, conquérant des villes et fondateur de leurs usages royaux ; prenant le commandement en 642 après la mort de son frère Muhammad à Wadi Yabash, il partagea d'abord les terres du Maroc et les tribus tributaires entre les clans mérinides, installant chacun sur un territoire assurant sa subsistance. Ils montèrent leurs partisans, réunirent leurs hommes et leurs armées se multiplièrent ; il établit les instruments de la royauté pour les émirs qui lui succéderaient."
  es: "Abu Yahya ibn Abd al-Haqq al-Marini, \"el arquitecto del estado\" de Banu Marin, conquistador de las ciudades y fundador de sus costumbres reales; tras tomar el mando en 642 después de la caída de su hermano Muhammad en Wadi Yabash, su primer acto de Estado fue dividir las tierras de Marruecos y las tribus tributarias entre los clanes mariníes, asentando a cada uno en un territorio donde pudieran vivir; así, reunieron a sus seguidores, congregaron a sus vasallos y sus ejércitos se multiplicaron; y él estableció la maquinaria de la realeza para los emires que le sucedieron."
  ur: "ابو یحییٰ بن عبد الحق المرینی، بنو مرین کے لیے 'ریاست کا معمار'، شہروں کا فاتح اور ان کے شاہی استعمال کا بانی؛ 642 میں اپنے بھائی محمد کے وادی یابش میں گرنے کے بعد، اس کی ریاست کا پہلا عمل یہ تھا کہ مراکش کی زمینوں اور معاون قبائل کو میرینیڈ قبیلوں کے درمیان تقسیم کیا جائے، اور ہر ایک کو ایک ایسے علاقے میں آباد کیا جائے جس پر وہ رہ سکتے ہیں - لہذا انہوں نے اپنے پیروکاروں کو سوار کیا، اپنے محافظوں کو جمع کیا، اور ان کی فوجوں میں اضافہ ہوا - اور اس کے بعد اس نے بادشاہی کی ایک مشین تیار کی۔"
  tr: "Beni Marin kabilesinin işlerini devralan Ebu Yahya bin Abdül Hak el-Marini, şehirleri fethetti ve kraliyet geleneklerini kurdu; kardeşi Muhammed'in Vadi Yabaş'ta ölümünden sonra 642 yılında onların işlerini devraldığında, halkı için ilk düşüncelerinden biri, Mağrip topraklarını ve vergi topladığı kabileleri Beni Marin kabileleri arasında paylaştırmak ve her birini yiyecek için helal bir bölgeye yerleştirmek oldu; böylece takipçileri ve orduları hazırlandı ve kendisinden sonra gelen prensler için krallığın yönetimini, teçhizatını ve geleneklerini üstlendi."
  id: "Abu Yahya bin Abdul Haq Al-Marini, orang yang mengurusi urusan Bani Marin, menaklukkan kota-kota, dan menetapkan adat istiadat kerajaan; ketika ia mengurusi urusan mereka pada tahun 642 setelah kematian saudaranya Muhammad di Wadi Yabash, salah satu pertimbangan pertamanya untuk rakyatnya adalah membagi tanah Maghreb dan suku-suku yang dipungut pajaknya di antara klan-klan Bani Marin dan menempatkan masing-masing dari mereka di wilayah yang diizinkan untuk makanan, sehingga mereka dapat membawa pengikut mereka dan pasukan mereka disediakan, dan ia bertanggung jawab mengelola kerajaan dan sistem perlengkapan serta adat istiadatnya untuk mereka yang datang setelahnya dari para pangeran mereka."
