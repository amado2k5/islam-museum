label:
  ar: أبو يحيى بن عبد الحق المريني
  en: Abu Yahya ibn Abd al-Haqq al-Marini
summary:
  ar: "أبو يحيى بن عبد الحق المريني، مديل الأمر لبني مرين وفاتح الأمصار ومقيم الرسوم الملوكية؛ لما ولي أمرهم سنة اثنتين وأربعين وستمائة بعد مهلك أخيه محمد بوادي ياباش، كان من أول نظره لقومه أن قسم بلاد المغرب وقبائل جبايته بين عشائر بني مرين وأنزل كلاً منهم في ناحية تسوغها طعمة فاستركبوا الرجل أتباعهم وتوفرت عساكرهم، وقام بتدبير الملك ونظامه من الآلة والرسوم لمن بعده من أمرائهم."
  en: "Abu Yahya ibn Abd al-Haqq al-Marini, 'the state's architect' for Banu Marin, conqueror of the cities and founder of their royal usages; taking the command in 642 after his brother Muhammad's fall at Wadi Yabash, his first act of state was to divide Morocco's lands and tributary tribes among the Marinid clans, settling each in a tract they might live on — so they mounted their followers, gathered their retainers, and their armies multiplied — and he set up the machinery of kingship for the amirs after him."
