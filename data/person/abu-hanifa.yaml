label: { ar: "أبو حنيفة النعمان بن ثابت", en: "Abu Hanifa al-Nu'man ibn Thabit" }
summary:
  ar: "النعمان بن ثابت الكوفي أبو حنيفة، إمام فقه العراق في القرن الثاني؛ عند البلاذري: هو وسفيان الثوري والأوزاعي ومالك وابن أبي ذئب وأبو يوسف على أن يؤخذ من التغلبي ضعف ما يؤخذ من المسلم في أرضه وماشيته وماله، وأهل العراق — وأصحاب أبي حنيفة منهم — يرون ضعف الصدقة من أرض الصبي والمعتوه ولا يأخذون من ماشيته شيئاً."
  en: "al-Nu'man ibn Thabit of Kufa, Abu Hanifa, the imam of Iraq's jurisprudence in the second century; in al-Baladhuri: he, with Sufyan al-Thawri, al-Awza'i, Malik, Ibn Abi Dhi'b and Abu Yusuf, holds that the Taghlibi pays double what the Muslim pays on land, livestock and wealth — the Iraqis, his companions among them, taking double sadaqa from the minor's and incompetent's land but nothing of their livestock."
