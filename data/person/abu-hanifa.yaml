id: person/abu-hanifa
class: person
label: { ar: "أبو حنيفة النعمان بن ثابت", en: "Abu Hanifa al-Nu'man ibn Thabit" }
summary:
  ar: "النعمان بن ثابت الكوفي أبو حنيفة، إمام فقه العراق في القرن الثاني؛ عند البلاذري: هو وسفيان الثوري والأوزاعي ومالك وابن أبي ذئب وأبو يوسف على أن يؤخذ من التغلبي ضعف ما يؤخذ من المسلم في أرضه وماشيته وماله، وأهل العراق — وأصحاب أبي حنيفة منهم — يرون ضعف الصدقة من أرض الصبي والمعتوه ولا يأخذون من ماشيته شيئاً.، وعند ابن النديم هو النعمان بن ثابت بن زوطى وكان خزازا بالكوفة وزوطى من موالي تيم الله بن ثعلبة وهو من أهل كابل وقيل مولى لبني ثعلبة وكان من التابعين لقي عدة من الصحابة وكان من الورعين الزاهدين، وتوفي سنة خمسين ومائة وله سبعون سنة ودفن في مقابر الخيزران بعسكر المهدي من الجانب الشرقي وصلى عليه الحسن بن عمارة، وله كتاب الفقه الأكبر وكتاب رسالته إلى البستي وكتاب العالم والمتعلم رواه عنه مقاتل وكتاب الرد على القدرية {cite:fihrist-ibn-al-nadim p. 284-285}"
  en: "al-Nu'man ibn Thabit of Kufa, Abu Hanifa, the imam of Iraq's jurisprudence in the second century; in al-Baladhuri: he, with Sufyan al-Thawri, al-Awza'i, Malik, Ibn Abi Dhi'b and Abu Yusuf, holds that the Taghlibi pays double what the Muslim pays on land, livestock and wealth — the Iraqis, his companions among them, taking double sadaqa from the minor's and incompetent's land but nothing of their livestock."
