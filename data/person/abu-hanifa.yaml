summary:
  ar: "النعمان بن ثابت الكوفي أبو حنيفة، فقيه ومتكلم وصاحب الاسم الذي سُمّي به المذهب الحنفي. توفي سنة 150هـ/767م وله سبعون سنة، فمولده نحو سنة 80هـ/699م. عاش في الكوفة صانعاً وتاجراً للخز، وتتلمذ على حماد بن أبي سليمان وصار بعده المرجع الأول في فقه الكوفة، ولم يكن قاضياً قط، وتوفي في السجن ببغداد. لم يؤلف في الفقه بنفسه، وتُعرف آراؤه من كتب تلاميذه كأبي يوسف والشيباني، ويرى كاتب مقالة دائرة المعارف الإسلامية أنه كان منظّراً منهجياً، وأنه كان من المرجئة في العقيدة. وكان بعد ذلك محل نقد من خصوم نسبوا إليه أقوالاً لم يقل بها في رأي المقالة."
  en: "al-Nu'man ibn Thabit of Kufa, Abu Hanifa, a jurist and theologian and the eponym of the Hanafi school. He died in 150 AH, 767 CE, aged 70, so was born about 80 AH, 699 CE. He lived in Kufa as a maker and merchant of khazz silk, studied under Hammad ibn Abi Sulayman, became the foremost authority on law in Kufa after him, was never a judge, and died in prison in Baghdad. He wrote no legal works himself; his views are known from his pupils' books such as those of Abu Yusuf and al-Shaybani. The Encyclopaedia of Islam article judges him a theoretical systematizer and a Murji'ite in creed, and says later opponents attributed to him opinions it holds he could not have held."
  ur: "نعمان بن ثابت کوفی، ابو حنیفہ، فقیہ اور متکلم، اور وہ شخصیت جن کے نام پر حنفی مذہب کا نام پڑا۔ ان کی وفات 150ھ/767ء میں ستر برس کی عمر میں ہوئی، اس لیے پیدائش تقریباً 80ھ/699ء ہے۔ وہ کوفہ میں خز کے کپڑے کا کام اور تجارت کرتے تھے، حماد بن ابی سلیمان کے شاگرد رہے اور ان کے بعد کوفہ کی فقہ میں سب سے بڑی سند بنے، کبھی قاضی نہیں بنے، اور بغداد میں قید میں فوت ہوئے۔ انہوں نے خود فقہ پر کتاب نہیں لکھی اور ان کی آراء ابو یوسف اور شیبانی جیسے شاگردوں کی کتابوں سے معلوم ہوتی ہیں۔ اسلامی دائرۃ المعارف کا مضمون نگار انہیں نظری منظم کار اور عقیدے میں مرجئی سمجھتا ہے، اور کہتا ہے کہ بعد کے مخالفین نے ان سے ایسی آراء منسوب کیں جو اس کے نزدیک ان کی نہیں ہو سکتیں۔"
