summary:
  ar: "النعمان بن ثابت الكوفي أبو حنيفة، فقيه ومتكلم وصاحب الاسم الذي سُمّي به المذهب الحنفي. توفي سنة 150هـ/767م وله سبعون سنة، فمولده نحو سنة 80هـ/699م. عاش في الكوفة صانعاً وتاجراً للخز، وتتلمذ على حماد بن أبي سليمان وصار بعده المرجع الأول في فقه الكوفة، ولم يكن قاضياً قط، وتوفي في السجن ببغداد. لم يؤلف في الفقه بنفسه، وتُعرف آراؤه من كتب تلاميذه كأبي يوسف والشيباني، ويرى كاتب مقالة دائرة المعارف الإسلامية أنه كان منظّراً منهجياً، وأنه كان من المرجئة في العقيدة. وكان بعد ذلك محل نقد من خصوم نسبوا إليه أقوالاً لم يقل بها في رأي المقالة."
  en: "al-Nu'man ibn Thabit of Kufa, Abu Hanifa, a jurist and theologian and the eponym of the Hanafi school. He died in 150 AH, 767 CE, aged 70, so was born about 80 AH, 699 CE. He lived in Kufa as a maker and merchant of khazz silk, studied under Hammad ibn Abi Sulayman, became the foremost authority on law in Kufa after him, was never a judge, and died in prison in Baghdad. He wrote no legal works himself; his views are known from his pupils' books such as those of Abu Yusuf and al-Shaybani. The Encyclopaedia of Islam article judges him a theoretical systematizer and a Murji'ite in creed, and says later opponents attributed to him opinions it holds he could not have held."
  ur: "نعمان بن ثابت کوفی، ابو حنیفہ، فقیہ اور متکلم، اور وہ شخصیت جن کے نام پر حنفی مذہب کا نام پڑا۔ ان کی وفات 150ھ/767ء میں ستر برس کی عمر میں ہوئی، اس لیے پیدائش تقریباً 80ھ/699ء ہے۔ وہ کوفہ میں خز کے کپڑے کا کام اور تجارت کرتے تھے، حماد بن ابی سلیمان کے شاگرد رہے اور ان کے بعد کوفہ کی فقہ میں سب سے بڑی سند بنے، کبھی قاضی نہیں بنے، اور بغداد میں قید میں فوت ہوئے۔ انہوں نے خود فقہ پر کتاب نہیں لکھی اور ان کی آراء ابو یوسف اور شیبانی جیسے شاگردوں کی کتابوں سے معلوم ہوتی ہیں۔ اسلامی دائرۃ المعارف کا مضمون نگار انہیں نظری منظم کار اور عقیدے میں مرجئی سمجھتا ہے، اور کہتا ہے کہ بعد کے مخالفین نے ان سے ایسی آراء منسوب کیں جو اس کے نزدیک ان کی نہیں ہو سکتیں۔"
  fr: "Al-Nu'man ibn Thabit de Koufa, Abu Hanifa, juriste et théologien, éponyme de l'école hanafite. Il mourut en 150 H, 767 ap. J.-C., à 70 ans, et naquit donc vers 80 H, 699 ap. J.-C. Il vécut à Koufa comme fabricant et marchand de soie khazz, étudia auprès de Hammad ibn Abi Sulayman, devint après lui la première autorité juridique de Koufa, ne fut jamais cadi, et mourut en prison à Bagdad. Il n'écrivit lui-même aucun ouvrage de droit ; ses opinions sont connues par les livres de ses élèves, comme ceux d'Abu Yusuf et d'al-Shaybani. L'article de l'Encyclopaedia of Islam le juge systématiseur théorique et murji'ite en matière de credo, et dit que des adversaires postérieurs lui attribuèrent des opinions qu'il ne pouvait, selon lui, avoir soutenues."
  es: "Al-Nu'man ibn Thabit de Kufa, Abu Hanifa, jurista y teólogo, fue el epónimo de la escuela Hanafi. Murió en el año 150 de la Hégira (767 d. C.), a los 70 años, por lo que nació alrededor del año 80 de la Hégira (699 d. C.). Vivió en Kufa como fabricante y comerciante de seda khazz, estudió con Hammad ibn Abi Sulayman, se convirtió en la máxima autoridad jurídica de Kufa tras él, nunca fue juez y murió en prisión en Bagdad. No escribió ninguna obra jurídica; sus ideas se conocen a través de los libros de sus discípulos, como los de Abu Yusuf y al-Shaybani. El artículo de la Enciclopedia del Islam lo considera un sistematizador teórico y un murjita en su credo, y afirma que sus oponentes posteriores le atribuyeron opiniones que, según la Enciclopedia, no podría haber sostenido."
  tr: "Nu'man ibn Sabit el-Kufi, diğer adıyla Ebu Hanife, bir hukukçu, ilahiyatçı ve Hanefi mezhebinin isim babasıdır. Hicri 80/699 civarında doğmuş olup, 70 yaşında, Hicri 150/767 yılında vefat etmiştir. Kufa'da ipekçi ve tüccar olarak çalışmıştır. Hammad ibn Ebu Süleyman'ın yanında eğitim görmüş ve daha sonra Kufa fıkıhının önde gelen otoritesi olmuştur. Hiçbir zaman hakimlik yapmamış ve Bağdat'ta hapishanede ölmüştür. Kendisi fıkıh üzerine herhangi bir kitap yazmamıştır; görüşleri, Ebu Yusuf ve el-Şeybani gibi öğrencilerinin eserlerinden bilinmektedir. İslam Ansiklopedisi makalesinin yazarı onu sistematik bir teorisyen ve inanç konularında Murci'i olarak değerlendirmektedir. Makaleye göre, daha sonra kendisine aslında söylemediği ifadeler atfedilerek rakipleri tarafından eleştirilmiştir."
  id: "Nu'man ibn Thabit al-Kufi, juga dikenal sebagai Abu Hanifa, adalah seorang ahli hukum, teolog, dan tokoh yang namanya digunakan sebagai nama mazhab Hanafi. Ia meninggal pada tahun 150 H/767 M pada usia tujuh puluh tahun, lahir sekitar tahun 80 H/699 M. Ia tinggal di Kufa, bekerja sebagai pengrajin sutra dan pedagang. Ia belajar di bawah bimbingan Hammad ibn Abi Sulayman dan kemudian menjadi otoritas terkemuka dalam bidang hukum di Kufa. Ia tidak pernah menjabat sebagai hakim dan meninggal di penjara di Baghdad. Ia sendiri tidak menulis buku apa pun tentang hukum; pandangannya dikenal dari karya-karya murid-muridnya, seperti Abu Yusuf dan al-Shaybani. Penulis artikel Ensiklopedia Islam menganggapnya sebagai seorang teoretikus sistematis dan seorang Murji'i dalam hal akidah. Ia kemudian dikritik oleh lawan-lawannya yang mengaitkan kepadanya pernyataan-pernyataan yang sebenarnya tidak ia ucapkan, menurut artikel tersebut."
