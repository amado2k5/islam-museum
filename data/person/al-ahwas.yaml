label: { ar: "الأحوص", en: "al-Ahwas", fr: "Al-Ahwas", es: "al-Ahwas", ur: "الاحواس" }
summary:
  ar: "عبد الله بن محمد الأحوص الشاعر، بعثت إليه حبابة جارية يزيد بن عبد الملك وإلى معبد المغني فقال إذا كنت لم تعشق ولم تدر ما الهوى فكن حجراً من يابس الثلد جلمدا، فما العيش إلا ما تلذ وتشتهي وإن لام فيه ذو الشنان وفند {cite:muruj-al-dhahab p. 185-186}."
  en: "The Medinese poet whose lines for Hababa — 'be a stone of the hard earth if you never loved; life is only what delights' — undid Yazid's reform {cite:muruj-al-dhahab p. 185-186}."
  fr: "Poète médinois dont les vers destinés à Hababa — « sois une pierre de la terre dure si tu n’as jamais aimé ; la vie n’est que ce qui réjouit » — firent échouer la réforme de Yazid {cite:muruj-al-dhahab p. 185-186}."
  es: "El poeta de Medina cuyos versos para Hababa —'sé una piedra de la tierra dura si nunca amaste; la vida es solo lo que deleita'— deshicieron la reforma de Yazid {cite:muruj-al-dhahab p. 185-186}."
  ur: "وہ مدینی شاعر جس کی سطریں حبابا کے لیے — 'سخت زمین کا پتھر بن جا اگر تم نے کبھی محبت نہیں کی۔ زندگی صرف وہی ہے جو خوشی دیتی ہے' - undid یزید کی اصلاح {حوالہ: مروج الذہب صفحہ. 185-186}۔"
  tr: "Şair Abdullah bin Muhammed el-Ahvas, Yezid bin Abdülmalik'in cariyesi Hababa ve şarkıcı Ma'bad tarafından şu sözlerle uğurlandı: \"Eğer sevmediyseniz ve sevginin ne olduğunu bilmiyorsanız, kuru ve sert bir kayadan taş gibi olun; çünkü hayat, nefret ve iftira dolu olanın eleştirdiği şey bile olsa, zevk aldığınız ve arzuladığınız şeylerden başka bir şey değildir.\" {kaynak: Muruj el-Dhahab s. 185-186}"
  id: "Abdullah bin Muhammad Al-Ahwas, sang penyair, diutus oleh Hababah, budak perempuan Yazid bin Abdul-Malik, dan Ma’bad, sang penyanyi, yang berkata: Jika kamu belum pernah mencintai dan tidak tahu apa itu cinta, maka jadilah batu dari batu karang yang kering dan keras, karena hidup hanyalah apa yang kamu nikmati dan inginkan, meskipun orang yang penuh kebencian dan fitnah mengkritiknya. {cite:muruj-al-dhahab p. 185-186}."
