summary:
  ar: "مولى المنصور؛ عند البلاذري أمره أن يبني له القصر المعروف بأبي الخصيب على أساس قديم ويقال إنه بناه لنفسه فكان المنصور يزوره فيه. ونسب إليه نهر أبي الخصيب بالبصرة"
  en: "al-Mansur's mawla; in al-Baladhuri ordered to build him the palace called Abu al-Khasib's on an old foundation — it is also said he built it for himself and al-Mansur would visit him there. Basra's Nahr Abi al-Khasib bears his name"
  fr: "Affranchi d'al-Mansur ; chez al-Baladhuri, il reçut l'ordre de lui bâtir sur une ancienne fondation le palais dit d'Abu al-Khasib — on dit aussi qu'il le bâtit pour lui-même et qu'al-Mansur venait l'y visiter. Le Nahr Abi al-Khasib de Bassora porte son nom"
  es: "El mawla de al-Mansur; en al-Baladhuri ordenó construirle el palacio llamado Abu al-Khasib sobre unos cimientos antiguos; también se dice que lo construyó para sí mismo y que al-Mansur lo visitaba allí. El Nahr Abi al-Khasib de Basora lleva su nombre."
  ur: "المنصور کا مولا؛ البلادھوری میں اسے ایک پرانی بنیاد پر ابو الخصیب نامی محل تعمیر کرنے کا حکم دیا - یہ بھی کہا جاتا ہے کہ اس نے اسے اپنے لیے بنایا تھا اور المنصور وہاں اس سے ملنے جاتا تھا۔ بصرہ کی نہر ابی الخصیب ان کا نام ہے۔"
