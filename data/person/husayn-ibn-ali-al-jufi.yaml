summary:
  ar: "الحسين بن علي بن الوليد الجعفي مولاهم الكوفي، مقرئ زاهد من رواة الحديث، وثقه ابن معين وقال ابن حنبل إنه لم ير أفضل منه، توفي سنة 203 هـ بحسب الصفدي."
  en: "Al-Husayn ibn Ali ibn al-Walid al-Ju'fi, a client of the Ju'fi tribe, a Kufan reciter and ascetic who transmitted hadith; Ibn Ma'in called him reliable and Ibn Hanbal said he had seen none better; died 203 AH according to al-Safadi."
  es: "Al-Husayn ibn Ali ibn al-Walid al-Ju'fi, un seguidor de la tribu Ju'fi, recitador de Kufa y asceta que transmitió hadices; Ibn Ma'in lo consideró fiable e Ibn Hanbal dijo que no había visto a nadie mejor; murió en el año 203 de la Hégira según al-Safadi."
  fr: "Al-Husayn ibn Ali ibn al-Walid al-Ju'fi, un client de la tribu Ju'fi, un récitateur et ascète de Kufa qui a transmis des hadiths; Ibn Ma'in l'a qualifié de fiable et Ibn Hanbal a dit qu'il n'en avait vu aucun de meilleur; est mort en 203 AH selon al-Safadi."
  ur: "الحسین بن علی ابن الولید الجوفی، جعفی قبیلہ کے ایک مؤکل، کوفان کے قاری اور حدیث کی ترسیل کرنے والے سنیاسی؛ ابن معین نے اسے معتبر کہا اور ابن حنبل نے کہا کہ اس سے بہتر کوئی نہیں دیکھا۔ سفادی کی وفات 203ھ مطابق ہوئی۔"
