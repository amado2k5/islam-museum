summary:
  ar: "بطاقة أولية لعلي خان المدني، أديب وشاعر حجازي فارسي القرن الثامن عشر صاحب سلافة العصر، توفي سنة ١٧٠٨م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ali Khan al-Madani, the eighteenth-century Hejazi-Persian writer author of Sulafat al-Asr, d. 1708; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Ali Khan al-Madani, escritor persa hiyazí del siglo XVIII, autor de Sulafat al-Asr, fallecido en 1708; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de candidature pour Ali Khan al-Madani, écrivain hedjazi-persan du XVIIIe siècle, auteur de Sulafat al-Asr, mort en 1708; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "علی خان المدنی کے لیے ڈرافٹ کارڈ، اٹھارویں صدی کے حجازی فارسی مصنف سلفیت العصر، ڈی۔ 1708; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1708 yılında ölen, dönemin Sulafası'nın yazarı, on sekizinci yüzyıl Fars Hicazi yazarı ve şairi Ali Han Al-Madani için ön kart; önemli kişilerin sözlüklerinde hatırlanır ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Ali Khan Al-Madani, seorang penulis dan penyair Hejazi Persia abad kedelapan belas, penulis Sulafa pada masa itu, yang meninggal pada tahun 1708 M; ia dikenang oleh kamus para tokoh terkenal, dan biografinya belum pernah diulas di halaman."
