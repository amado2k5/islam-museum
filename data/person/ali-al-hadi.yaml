label: { ar: "علي الهادي", en: "'Ali al-Hadi" }
summary:
  ar: "أبو الحسن علي بن محمد بن علي بن موسى بن جعفر، سعى به إلى المتوكل فقيل إن في منزله سلاحاً وكتباً فهجم عليه ليلاً فوجدوه في بيت وحده عليه مدرعة شعر وليس في البيت إلا رمل وحصى يترنم بآيات الوعد والوعيد فحمل إلى المتوكل، فلما رآه أعظمه وأجلسه إلى جنبه وناوله كأساً فقال ما خامر لحمي ودمي قط فأعفاه وسأله أن ينشده فأنشده باتوا على قلل الأجبال تحرسهم غلب الرجال فما أغنتهم القلل، وسأله ما يقول ولد أبيك في العباس بن عبد المطلب فقال وما يقول ولد أبي في رجل افترض الله طاعة بنيه على خلقه وافترض طاعته على بنيه فأمر له بمائة ألف درهم {cite:muruj-al-dhahab p. 480}.، وعند المسعودي توفي يوم الاثنين لأربع بقين من جمادى الآخرة سنة أربع وخمسين ومائتين وهو ابن أربعين سنة وصلى عليه أحمد بن المتوكل في شارع أبي أحمد ودفن بداره بسامرا، وأشخصه يحيى بن هرثمة من المدينة ففتش بيته فلم يجد فيه إلا مصحفاً ودعاء {cite:muruj-al-dhahab p. 549-550}"
  en: "The 'Alid raided at night on a slander and found alone in a hair-cloth house of sand and gravel chanting the verses of promise — then honoured by al-Mutawakkil after the 'Abbas riposte {cite:muruj-al-dhahab p. 480}."
