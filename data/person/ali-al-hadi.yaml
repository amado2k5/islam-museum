label: { ar: "علي الهادي", en: "'Ali al-Hadi", fr: "'Ali al-Hadi", es: "'Ali al-Hadi", ur: "علی الہادی" }
summary:
  ar: "أبو الحسن علي بن محمد بن علي بن موسى بن جعفر، سعى به إلى المتوكل فقيل إن في منزله سلاحاً وكتباً فهجم عليه ليلاً فوجدوه في بيت وحده عليه مدرعة شعر وليس في البيت إلا رمل وحصى يترنم بآيات الوعد والوعيد فحمل إلى المتوكل، فلما رآه أعظمه وأجلسه إلى جنبه وناوله كأساً فقال ما خامر لحمي ودمي قط فأعفاه وسأله أن ينشده فأنشده باتوا على قلل الأجبال تحرسهم غلب الرجال فما أغنتهم القلل، وسأله ما يقول ولد أبيك في العباس بن عبد المطلب فقال وما يقول ولد أبي في رجل افترض الله طاعة بنيه على خلقه وافترض طاعته على بنيه فأمر له بمائة ألف درهم {cite:muruj-al-dhahab p. 480}. وعند المسعودي توفي يوم الاثنين لأربع بقين من جمادى الآخرة سنة أربع وخمسين ومائتين وهو ابن أربعين سنة وصلى عليه أحمد بن المتوكل في شارع أبي أحمد ودفن بداره بسامرا، وأشخصه يحيى بن هرثمة من المدينة ففتش بيته فلم يجد فيه إلا مصحفاً ودعاء {cite:muruj-al-dhahab p. 549-550}"
  en: "The 'Alid raided at night on a slander and found alone in a hair-cloth house of sand and gravel chanting the verses of promise — then honoured by al-Mutawakkil after the 'Abbas riposte {cite:muruj-al-dhahab p. 480}."
  fr: "Le 'Alid a attaqué la nuit sur une calomnie et trouvé seul dans une maison de toile de cheveux de sable et de gravier chantant les versets de la promesse - puis honoré par al-Mutawakkil après la riposte 'Abbas {cite:muruj-al-dhahab p. 480}."
  es: "El 'Alid irrumpió de noche tras una calumnia y encontró solo en una casa de arena y grava hecha de tela de pelo, recitando los versos de la promesa; luego fue honrado por al-Mutawakkil después de la réplica de 'Abbas {cite:muruj-al-dhahab p. 480}."
  ur: "الید نے رات کو ایک تہمت پر چھاپہ مارا اور ریت اور بجری کے بالوں والے گھر میں تنہا پایا جو آیات وعدے کی تلاوت کرتا تھا - پھر عباس کے رد عمل کے بعد المتوکل کی طرف سے اعزاز دیا گیا {حوالہ: مروج الذہب صفحہ 480}۔"
  tr: "Ebu el-Hasan Ali ibn Muhammed ibn Ali ibn Musa ibn Ca'far onu el-Mutawakkil'e çağırdı. Evinde silahlar ve kitaplar olduğu söylenirdi. Gece ona saldırdı ve onu zırhlı saçlı bir bedenle, sadece kum ve çakıllarla vaat ve uyarı ayetleri okurken bir evde yalnız buldu. Onu al-Mutawakkil'e götürdü. Onu görünce yanına aldı, yanına oturttu ve ona bir kadeh verdi. Dedi ki, 'Benim Et ve kemik asla acı olmadı.' Onu affetti ve bunu okumasını istedi, o da şöyle dedi: 'Geceyi dağ zirvelerinde geçirdiler, insanlar tarafından korundular, ama azınlığı onlara fayda sağlamadı.' Babanızın oğlunun el-Abbas bin Abdül-Muttalib hakkında ne dediğini sordu. Dedi ki, 'Babamın oğlu, Tanrı'nın çocuklarına itaat etmeyi kendi yaratılışında zorunlu kıldığı ve çocuklarına itaat etmeyi zorunlu kıldığı bir adam hakkında ne diyor? Ona yüz bin dirhem emretti. {alıntı:) Muruj-al-Dhahab, s. 480}. al-Mas'udi'ye göre, 254 Hile yılında, Cumeda el-Ahhirah'dan dört gün önce, Pazartesi günü kırk yaşında öldü. Ahmed bin el-Mutavakkil, Abu Ahmed Caddesi'nde onun için dua etti ve Samarra'daki evine defnedildi. Yahya ibn Harthama onu Medine'den teşhis etti, evini aradı ve sadece bir Kur'an ve bir dua buldu {atıf:muruj-al-dhahab, s. 549-550}"
  id: "Abu al-Hasan Ali ibn Muhammad ibn Ali ibn Musa ibn Ja'far mencarinya ke al-Mutawakkil. Dikatakan bahwa ada senjata dan buku di rumahnya. Dia menyerangnya pada malam hari, dan menemukannya sendirian di sebuah rumah dengan tubuh berbaju zirah, hanya dengan pasir dan kerikil yang melantunkan ayat-ayat janji dan peringatan. Dia dibawa ke al-Mutawakkil. Ketika melihatnya, dia membawanya ke sisi, mendudukkannya di sampingnya, dan memberinya sebuah cangkir. Dia berkata, 'Dagingku dan darah tidak pernah pahit.' Dia memaafkannya dan memintanya mengucapkannya, maka dia mengucapkannya: 'Mereka bermalam di puncak gunung, dijaga oleh manusia, tetapi yang sedikit tidak menguntungkan mereka.' Dia bertanya apa yang dikatakan putra ayahmu tentang al-Abbas ibn Abd al-Muttalib. Dia berkata, 'Apa kata anak ayahku tentang seorang pria yang Tuhan buat ketaatan kepada anak-anak-Nya sebagai kewajiban pada ciptaan-Nya dan ketaatan kepada anak-anak-Nya?' Dia memerintahkan seratus ribu dirham. Muruj-al-Dhahab, hlm. 480}. Menurut al-Mas'udi, ia meninggal pada hari Senin, empat hari sebelum Jumada al-Akhirah pada tahun 254 H, pada usia empat puluh tahun. Ahmad ibn al-Mutawakkil berdoa untuknya di Jalan Abu Ahmad, dan ia dimakamkan di rumahnya di Samarra. Yahya ibn Harthama mengenalinya dari Madinah, menggeledah rumahnya, dan tidak menemukan apa pun selain sebuah Al-Qur'an dan doa {cite:muruj-al-dhahab, hlm. 549-550}"
