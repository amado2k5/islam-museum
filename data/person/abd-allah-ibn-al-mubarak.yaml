summary:
  ar: "أبو عبد الرحمن عبد الله بن المبارك المروزي، مولى بني حنظلة، تفقه بسفيان ومالك، ومات بهيت، وهي بلدة على الفرات قرب الأنبار، في سنة «نيف وثمانين ومائة» {cite:tabaqat-fuqaha-abbas-1981 p. 50}. وقال عبد الرحمن بن مهدي: «الأئمة أربعة: سفيان الثوري ومالك وحماد بن زيد وابن المبارك» {cite:tabaqat-fuqaha-abbas-1981 p. 50}."
  en: "Abu Abd al-Rahman Abd Allah ibn al-Mubarak al-Marwazi, a client of the Banu Hanzala. He studied jurisprudence under Sufyan and Malik, and died at Hit, a town on the Euphrates near al-Anbar, in the year that is 'a little over one hundred and eighty' {cite:tabaqat-fuqaha-abbas-1981 p. 50}. Abd al-Rahman ibn Mahdi said: 'The imams are four: Sufyan al-Thawri, Malik, Hammad ibn Zayd and Ibn al-Mubarak' {cite:tabaqat-fuqaha-abbas-1981 p. 50}."
