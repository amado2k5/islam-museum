summary:
  ar: "متسابق دراجات نارية تركي وبرلماني، وُلد في أقيازي بصقاريا سنة 1984. فاز بخمسة ألقاب في بطولة العالم للسوبرسبورت (2007 و2010 و2012 و2015 و2016) وهو رقم قياسي في فئته، واعتزل السباقات سنة 2018 وانتُخب عضوًا في البرلمان في العام نفسه."
  en: "Turkish motorcycle racer and parliamentarian, born in Akyazı, Sakarya, in 1984. He won a record five Supersport World Championship titles (2007, 2010, 2012, 2015, 2016), retired from racing in 2018 and was elected to parliament the same year."
