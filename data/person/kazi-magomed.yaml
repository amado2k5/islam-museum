summary:
  ar: "قاضي ماغومد (1833–1902)، ويُكتب أيضًا غازي محمد، الابن الثاني للإمام شامل، وسُمّي باسم أستاذ والده وسلفه الإمام الأول غازي محمد؛ كان نائبًا على قاراطا منذ 1850، ودافع عن فيدينو وغونيب سنة 1859، وتبع والده إلى منفاه في كالوغا، ثم دخل في خدمة الدولة العثمانية ومات في المدينة سنة 1902 برتبة مشير."
  en: "Kazi-Magomed (1833–1902), also written Gazi-Muhammad, was the second son of Imam Shamil, named for his father's teacher and predecessor, the first Imam Ghazi Muhammad. Naib of Karata from 1850, he defended Vedeno and Gunib in 1859, followed his father into exile at Kaluga, then entered Ottoman service and died at Medina in 1902 with the rank of mushir (marshal)."
  ur: "قاضی ماگومد (1833–1902)، جنہیں غازی محمد بھی لکھا جاتا ہے، امام شامل کے دوسرے بیٹے تھے، جن کا نام ان کے والد کے استاد و پیش رو، پہلے امام غازی محمد کے نام پر رکھا گیا تھا۔ وہ 1850 سے قراطا کے نائب رہے، 1859 میں ویدینو اور غونیب کا دفاع کیا، والد کے ساتھ کالوگا جلاوطن رہے، پھر عثمانی خدمت میں داخل ہوئے اور 1902 میں مدینہ میں مشیر (مارشل) کے عہدے پر وفات پائی۔"
