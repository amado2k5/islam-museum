  ar: "وكيل الأزهر الشريف، وهو مؤلف «نظرات في التجديد» (مجمع البحوث الإسلامية، 1439هـ/2018م). يقدم الكتاب نفسه بوصفه مقالات نشرها في الصحف، ويعرض رؤيته للتجديد في الفقه المعاصر. تاريخ توليه الوكالة وتواريخه الأخرى لم تُراجع على مصدر ثانٍ."
  en: "Deputy Grand Imam of al-Azhar and author of Glances at Renewal (Islamic Research Academy, 1439 AH / 2018 CE). The book presents itself as articles first published in newspapers and sets out his view of renewal in contemporary jurisprudence. His dates in office have not been checked against a second source."
