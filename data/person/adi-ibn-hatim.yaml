summary:
  ar: ابن حاتم الطائي الجواد المشهور؛ أسلم سنة 9هـ أو 10هـ وكان نصرانياً، وثبت على إسلامه في الردة وأحضر صدقة قومه إلى أبي بكر، وشهد فتح العراق وصفين مع علي، وسكن الكوفة ومات بعد الستين.
  en: The son of the famously generous Hatim al-Ta'i; he embraced Islam in 9 AH or 10 AH, having been a Christian, stood firm during the apostasy and brought his tribe's alms to Abu Bakr; he took part in the conquest of Iraq and was with Ali
    at Siffin, settled in Kufa and died after 60 AH.
