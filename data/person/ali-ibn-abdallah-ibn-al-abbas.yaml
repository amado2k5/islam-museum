summary:
  ar: "ابن عبد الله بن عباس بن عبد المطلب، جد بني العباس الملوك، منعته أخواله من كندة يوم الحرة من بيعة العبيد ليزيد في جيش مسرف ومنعه أناس من ربيعة فقال أبي العباس قرم بني لؤي وأخوالي الملوك بنو وليعة هم منعوا ذماري يوم جاءت كتائب مسرف {cite:muruj-al-dhahab p. 68}."
  en: "Ibn Abbas's son and ancestor of the Abbasid caliphs — saved from the slave-oath at the Harra by his Kindi uncles and Rabi'a men, his own verses commemorating it {cite:muruj-al-dhahab p. 68}."
  es: "Hijo de Ibn Abbas y antepasado de los califas abasíes, salvado del juramento de esclavitud en Harra por sus tíos Kindi y hombres Rabi'a, sus propios versos lo conmemoran {cite:muruj-al-dhahab p. 68}."
  fr: "Ibn Abbas, fils et ancêtre des califes abbassides, fut sauvé du serment d'esclave à Harra par ses oncles Kindi et les hommes Rabi'a, comme en témoignent ses propres vers {cite:muruj-al-dhahab p. 68}."
  ur: "ابن عباس کے بیٹے اور عباسی خلفاء کے آباؤ اجداد کو حرہ میں اس کے کندی چچا اور ربیعہ مردوں کی غلامی سے بچایا گیا، اس کی یاد میں اس کی اپنی آیات {حوالہ: مروج الذہب صفحہ 2000 68}۔"
