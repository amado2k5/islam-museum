label: { ar: "محمد بن تومرت المهدي" }
summary:
  ar: "إمام المصامدة وصاحب دولة الموحدين المشتهر بالمهدي، أصله من هرغة؛ نزل تلمسان وحج ودخل العراق ولقي جلة العلماء وفحول النظار وفيما زعموا لقي أبا حامد الغزالي فبشره بالدولة، ورجع فأظهر النكير على علماء المغرب في عدولهم عن التوقف في المتشابه وألف المرشدة في التوحيد وكان من رأيه القول بعصمة الإمام على رأي الإمامية، ودخل بجاية فأظهر النكير فأغرى به السلطان الخاصة فخرج خائفاً ولحق بملالة فآووه ثم لحق بمراكش فلقي علي بن يوسف في الجامع فوعظه وأغلظ له القول ونصح لأخته لما رآها كاشفة وجهها، ولما كملت بيعته لقبوه بالمهدي سنة خمس عشرة وخمسمائة وبنى رابطة للعبادة بايكيلين من بلاد هرغة واجتمعت إليه الطلبة والقبائل يعلمهم المرشدة والتوحيد باللسان البربري {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}. وفي شذرات الذهب هو المصمودي البربري المدعي أنه علوي حسني وأنه المهدي رحل إلى المشرق ولقي الغزالي وطائفة وحصل فنوناً من العلم والأصول والكلام وكان رجلاً ورعاً ناسكاً زاهداً متقشفاً شجاعاً جلداً عاقلاً عميق الفكر فصيحاً مهيباً لذعاً في الأمر بالمعروف والنهى عن المنكر والجهاد ولكن جره إقدامه على حب الرياسة والظهور ودعوى الكذب والزور من أنه حسني وهو هرغي بربري وأنه معصوم وهو بالإجماع مخصوم، فبدأ أولاً في الإنكار بمكة فآذوه فقدم مصر فأنكر فطردوه فأقام بالثغر مدة فنفوه وركب البحر فشرع ينكر على أهل المركب ويأمر وينهي ويلزمهم بالصلاة فنزل بالمهدية في غرفة فكان لا يرى منكراً إلا غيره بيده ولسانه فطلبه أميرها علي بن باديس وجلس له فلما أحسن سمته وسمع كلامه احترمه وسأله الدعاء فتحول إلى بجاية وأنكر بها فأخرجوه فلقي بقرية ملالة عبد المؤمن بن علي شاباً فربطه عليه وأفضى إليه بسره وصار معه نحو خمسة أنفس فدخل مراكش وأنكر كعادته فأشار مالك بن وهيب الفقيه على علي بن يوسف بن تاشفين بالقبض عليهم سداً للذريعة فعقد لهم مجلساً حافلاً فواجهه ابن تومرت بالحق المحض ولم يحابه وأخبره ببيع الخمر جهاراً ومشي الخنازير التي للفرنج بين أظهر المسلمين فذرفت عينا الملك وأطرق فهون الوزير أمرهم فصرفه الملك وطلب منه الدعاء ثم سار إلى أغمات وانقطع بحبل تينمل وتسارع إليه أهل الجبل يتبركون به {cite:shadharat-dhahab p. 550-551}."
  en: "Muhammad ibn Tumart of Hargha, the Mahdi of the Almohads; after travels to the Mashriq — where he was said to have met al-Ghazali — he returned denouncing the Maghrebi jurists, wrote the Murshida on tawhid, held the imamate infallible, was driven from Bougie, rebuked Ali b. Yusuf in Marrakesh and was proclaimed Mahdi in 515, teaching the creed in Berber from his Ikilliz ribat {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}."
