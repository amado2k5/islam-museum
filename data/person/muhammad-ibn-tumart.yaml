label: { ar: "محمد بن تومرت المهدي" }
summary:
  ar: "إمام المصامدة وصاحب دولة الموحدين المشتهر بالمهدي، أصله من هرغة؛ نزل تلمسان وحج ودخل العراق ولقي جلة العلماء وفحول النظار وفيما زعموا لقي أبا حامد الغزالي فبشره بالدولة، ورجع فأظهر النكير على علماء المغرب في عدولهم عن التوقف في المتشابه وألف المرشدة في التوحيد وكان من رأيه القول بعصمة الإمام على رأي الإمامية، ودخل بجاية فأظهر النكير فأغرى به السلطان الخاصة فخرج خائفاً ولحق بملالة فآووه ثم لحق بمراكش فلقي علي بن يوسف في الجامع فوعظه وأغلظ له القول ونصح لأخته لما رآها كاشفة وجهها، ولما كملت بيعته لقبوه بالمهدي سنة خمس عشرة وخمسمائة وبنى رابطة للعبادة بايكيلين من بلاد هرغة واجتمعت إليه الطلبة والقبائل يعلمهم المرشدة والتوحيد باللسان البربري {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}."
  en: "Muhammad ibn Tumart of Hargha, the Mahdi of the Almohads; after travels to the Mashriq — where he was said to have met al-Ghazali — he returned denouncing the Maghrebi jurists, wrote the Murshida on tawhid, held the imamate infallible, was driven from Bougie, rebuked Ali b. Yusuf in Marrakesh and was proclaimed Mahdi in 515, teaching the creed in Berber from his Ikilliz ribat {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}."
