  en: "Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib; out with Ibn al-Ash'ath, he fled to Herat, killed al-Ruqad al-Mutakki and levied kharaj — beaten by Yazid ibn al-Muhallab who forbade pursuit, he fled on to Sind."
