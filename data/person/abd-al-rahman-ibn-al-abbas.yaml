id: person/abd-al-rahman-ibn-al-abbas
class: person
label: { ar: "عبد الرحمن بن العباس الهاشمي", en: "Abd al-Rahman ibn al-Abbas al-Hashimi", fr: "Abd al-Rahman ibn al-Abbas al-Hashimi", es: "Abd al-Rahman ibn al-Abbas al-Hashimi", ur: "عبدالرحمٰن بن العباس الہاشمی" }
summary:
  ar: "عبد الرحمن بن العباس بن ربيعة بن الحارث بن عبد المطلب؛ خرج مع ابن الأشعث فصار في فله إلى هراة فقتل الرقاد المتكي وجبى الخراج فسار إليه يزيد بن المهلب فهزمه وأمر بالكف عن اتباعهم فلحق الهاشمي بالسند."
  en: "Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib; out with Ibn al-Ash'ath, he fled to Herat, killed al-Ruqad al-Mutakki and levied kharaj — beaten by Yazid ibn al-Muhallab who forbade pursuit, he fled on to Sind."
  fr: "Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib ; soulevé avec Ibn al-Ash'ath, il s'enfuit à Hérat, tua al-Ruqad al-Mutakki et leva le kharaj — battu par Yazid ibn al-Muhallab, qui interdit qu'on le poursuive, il s'enfuit ensuite au Sind."
  es: "Abd al-Rahman ibn al-Abbas ibn Rabi'a ibn al-Harith ibn Abd al-Muttalib; Con Ibn al-Ash'ath, huyó a Herat, mató a al-Ruqad al-Mutakki y se apoderó de kharaj; derrotado por Yazid ibn al-Muhallab, quien le prohibió perseguirlo, huyó a Sind."
  ur: "عبد الرحمن بن العباس ابن ربیعہ ابن الحارث ابن عبد المطلب، ابن اشعث کے ساتھ نکل کر، وہ ہرات کی طرف بھاگا، الرقد المتکی کو قتل کر دیا اور خرج لگایا - جس کا تعاقب کرنے سے منع کرنے والے یزید ابن المحلب نے مارا پیٹا، وہ سندھ کی طرف بھاگ گیا۔"
  tr: "Abdülrahman ibn el-Abbas ibn Rabi’ah ibn el-Harith ibn Abdülmuttalib, İbn el-Aş’ath ile birlikte Herat’a gitti ve orada el-Rakad el-Mutakki’yi öldürerek haraç topladı. Yazid ibn el-Muhallab ona gidip onu yendi ve onları takip etmeyi bırakmalarını emretti, böylece el-Haşimi Sindh’e katıldı."
  id: "Abd al-Rahman ibn al-Abbas ibn Rabi’ah ibn al-Harith ibn Abd al-Muttalib pergi bersama Ibn al-Ash’ath ke Herat, di mana ia membunuh al-Raqad al-Mutakki dan mengumpulkan upeti. Yazid ibn al-Muhallab mendatanginya dan mengalahkannya, lalu memerintahkan agar mereka berhenti mengejarnya, sehingga al-Hashimi bergabung dengan Sindh."
