id: person/hasan-al-utrush
class: person
label: { ar: "الحسن بن علي العلوي الأطروش" }
summary:
  ar: "العلوي الأطروش، أسلم الديلم على يده سنة اثنتين وكانوا مجوساً {cite:tarikh-khulafa-minhaj-1434 p. 588}. وعند المسعودي انهزم بين يدي ماكان بن كاكي الديلمي ولحقته خيول خراسان والجبل والديلم والأتراك فيهم أسفار بن شيرويه فانحاز إلى طاحونة قرب آمل قصبة طبرستان وقد تخلى عنه أنصاره فقتل هنالك {cite:muruj-al-dhahab p. 721}"
  en: "The Alid al-Utrush; the Daylamites accepted Islam at his hand in 302, having been Magians {cite:tarikh-khulafa-minhaj-1434 p. 588}."
  es: "El Alid al-Utrush; los daylamitas aceptaron el Islam de su mano en 302, habiendo sido magos {cite:tarikh-khulafa-minhaj-1434 p. 588}."
  fr: "Les Alid al-Utrush; les Daylamites acceptèrent l'Islam de sa main en 302, ayant été des Mages {cite:tarikh-khulafa-minhaj-1434 p. 588}."
  ur: "الید التروش؛ دیلامیوں نے مجوسی رہ کر 302 میں آپ کے ہاتھ پر اسلام قبول کیا 588}۔"
  tr: "Alevi Saldırısı, Daylamlılar ikinci yılda onun elinden İslam'a geçti ve onlar Magianlardı {cite:History-Khulafa-Minhaj-1434 s. 588}. al-Mas'udi'ye göre, Makan ibn Kaki al-Daylami tarafından yenildi ve ardından Horasan'ın süvarileri, dağlar, Daylamlar ve Türkler, aralarında Asfar ibn Shirawayh'in de bulunduğu kişiler geldi. Amal'daki bir değirmenle, Tabaristan'ın Kasbah'ıyla ittifak kurdu, ancak destekçileri onu terk etti ve orada öldürüldü {cite:Muruj-al-dhahab s. 721}"
  id: "Serangan Alawi, Daylamites berpindah agama ke Islam di tangannya pada tahun kedua dan mereka adalah Majus {cite:History-Khulafa-Minhaj-1434 hlm. 588}. Menurut al-Mas'udi, ia dikalahkan oleh Makan ibn Kaki al-Daylami, dan diikuti oleh kavaleri Khurasan, pegunungan, Daylam, dan Turki, termasuk Asfar ibn Shirawayh. Ia bersekutu dengan sebuah pabrik di dekat Amal, Kasbah Tabaristan, tetapi para pendukungnya meninggalkannya dan ia dibunuh di sana {cite:Muruj-al-dhahab hlm. 721}"
