summary:
  ar: "عمرو بن أبي سلمة، أبو حفص التنيسي الدمشقي، من موالي بني هاشم، روى عن الأوزاعي وغيره، وعنه ابنه سعيد وعبد الله الشافعي وأحمد بن صالح. قال الوليد بن بكر العمري: هو أحد أئمة الأخبار. وضعفه الساجي ويحيى بن معين، وذكره ابن حبان في الثقات. توفي سنة 214هـ على قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
  en: "Amr ibn Abi Salama, Abu Hafs al-Tinnisi al-Dimashqi, a mawla of the Banu Hashim, who narrated from al-Awza'i and others; his son Sa'id, Abd Allah al-Shafi'i and Ahmad ibn Salih narrated from him. Al-Walid ibn Bakr called him one of the leading transmitters, al-Saji and Ibn Ma'in weakened him, and Ibn Hibban counted him among the trustworthy. The page gives his death as 214 AH on one account. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
