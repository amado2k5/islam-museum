summary:
  ar: "عمرو بن أبي سلمة، أبو حفص التنيسي الدمشقي، من موالي بني هاشم، روى عن الأوزاعي وغيره، وعنه ابنه سعيد وعبد الله الشافعي وأحمد بن صالح. قال الوليد بن بكر العمري: هو أحد أئمة الأخبار. وضعفه الساجي ويحيى بن معين، وذكره ابن حبان في الثقات. توفي سنة 214هـ على قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
  en: "Amr ibn Abi Salama, Abu Hafs al-Tinnisi al-Dimashqi, a mawla of the Banu Hashim, who narrated from al-Awza'i and others; his son Sa'id, Abd Allah al-Shafi'i and Ahmad ibn Salih narrated from him. Al-Walid ibn Bakr called him one of the leading transmitters, al-Saji and Ibn Ma'in weakened him, and Ibn Hibban counted him among the trustworthy. The page gives his death as 214 AH on one account. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
  es: "Amr ibn Abi Salama, Abu Hafs al-Tinnisi al-Dimashqi, un mawla de los Banu Hashim, narró de al-Awza'i y otros; su hijo Sa'id, Abd Allah al-Shafi'i y Ahmad ibn Salih narraron de él. Al-Walid ibn Bakr lo llamó uno de los principales transmisores, al-Saji e Ibn Ma'in lo menospreciaron, e Ibn Hibban lo contó entre los dignos de confianza. La página indica que murió en el año 214 de la Hégira en una ocasión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
  fr: "Amr ibn Abi Salama, Abu Hafs al-Tinnisi al-Dimashqi, un mawla des Banu Hashim, qui rapporta d'al-Awza'i et d'autres; son fils Sa'id, Abd Allah al-Shafi'i et Ahmad ibn Salih rapportèrent également d'après lui. Al-Walid ibn Bakr le considérait comme l'un des principaux transmetteurs, al-Saji et Ibn Ma'in le critiquaient, et Ibn Hibban le comptait parmi les dignes de confiance. La page indique sa mort en 214 AH, selon une source. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3492}"
  ur: "عمرو بن ابی سلمہ، ابو حفص التنیسی الدمشقی، بنو ہاشم کے ایک مولا، جو اوزاعی وغیرہ سے روایت کرتے ہیں۔ ان سے ان کے بیٹے سعید، عبد اللہ الشافعی اور احمد بن صالح نے روایت کی ہے۔ الولید بن بکر نے اسے معروف نقل کرنے والوں میں سے ایک کہا، الساجی اور ابن معین نے اسے کمزور کیا، اور ابن حبان نے اسے ثقہ لوگوں میں شمار کیا۔ ایک صفحہ میں ان کی وفات 214ھ بتائی گئی ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3492}"
  tr: "Banu Haşim'in özgür bırakılanlarından biri olan Amr ibn Abi Salamah, Ebu Hafs el-Tunisi el-Dimaşki, el-Avzai ve diğerlerinden ve ondan oğlu Seyid, Abdullah el-Şafii ve Ahmed bin Salih'ten rivayet etmiştir. El-Velid bin Bekir el-'Umari şöyle demiştir: O, önde gelen rivayetçilerden biridir. El-Saci ve Yahya ibn Ma'in tarafından zayıflatılmıştır ve İbn Hibban onu güvenilir anlatıcılar arasında saymıştır. Bazı görüşlere göre 214 Hicri yılında ölmüştür. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.3492}"
  id: "Amr ibn Abi Salamah, Abu Hafs al-Tunisi al-Dimashqi, salah satu mantan Banu Hashim, menceritakan dari al-Awza'i dan lainnya, serta dari dia putranya Sa'id, Abdullah al-Shafi'i, dan Ahmad ibn Salih. Al-Walid ibn Bakr al-'Umari berkata: Dia adalah salah satu narator utama. Dia dilemahkan oleh al-Saji dan Yahya ibn Ma'in, dan Ibn Hibban menyebutnya di antara narator yang dapat dipercaya. Dia meninggal pada tahun 214 H menurut beberapa pendapat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3492}"
