  ar: "أبو علي الزجاجي"
  en: "Abu Ali al-Zujaji"
  ur: "ابو علی زجاجی"
roles: [scholar]
gender: male
summary:
  ar: "الحسن بن محمد بن العباس، القاضي الإمام الجليل أبو علي الزجاجي، من أجل تلامذة أبي العباس ابن القاص ومن مشايخ القاضي أبي الطيب الطبري. له كتاب زيادة الفتاح وعنه أخذ فقهاء آمل، وكتاب الدور علّقه عن ابن القاص. توفي في حدود الأربعمائة {cite:tabaqat-shafiiyya-subki j.3 p.146-147}."
  en: "Al-Hasan ibn Muhammad ibn al-'Abbas, qadi Abu 'Ali al-Zujaji (d. ca. 400) — among the most eminent pupils of Abu'l-'Abbas Ibn al-Qass and a teacher in the line of the qadi Abu'l-Tayyib al-Tabari; author of Ziyadat al-Fattah, from which the jurists of Amul took their fiqh, and of Kitab al-Dawr transmitted from Ibn al-Qass {cite:tabaqat-shafiiyya-subki j.3 p.146-147}."
  ur: "حسن بن محمد بن عباس، قاضی ابو علی زجاجی (مت ~400ھ) — ابن قاص کے جلیل تلامذہ اور قاضی ابو الطیب طبری کے استاذوں میں؛ زيادة الفتاح کے مصنف جس سے آمل کے فقہا نے فقہ لیا، اور کتاب الدور جو انہوں نے ابن قاص سے روایت کی {cite:tabaqat-shafiiyya-subki j.3 p.146-147}."
