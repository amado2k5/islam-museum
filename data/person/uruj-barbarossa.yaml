summary:
  ar: "ابن يعقوب بن يوسف من بقايا الفاتحين المسلمين الأتراك المستقرين في جزيرة مدللي، وأمه سيدة مسلمة أندلسية، واسمه مأخوذ من حادثة الإسراء والمعراج التي يُرجَّح أنه ولد ليلتها، والترك ينطقونه ⁦(أوروج)⁩ ثم عُرِّب إلى عروج. اتجه مع أخيه خير الدين إلى الجهاد البحري منذ الصغر في بحر الأرخبيل نحو سنة ١٥١٠م، ثم نقلا نشاطهما إلى شمال أفريقية وأقاما قاعدة في ميناء جيجل بعد دخولها وقتل حماتها الجنويين سنة ١٥١٤م لتحرير بجاية ومساعدة مسلمي الأندلس، وحكما الجزائر وبعض المناطق المجاورة. وقد بقيت رخامة منقوشة على باب حصن شرشال تنص: هذا برج شرشال أنشأه المجاهد محمود بن فارس التركي في خلافة الأمير الحاكم بأمر الله المجاهد في سبيل الله أوروج بن يعقوب بإذنه بتاريخ أربعة وعشرين بعد تسعمائة ⁦(١٥١٨م)⁩، ورخامة أخرى على باب مسجد الشواس بالعاصمة الجزائرية. قُتل في إحدى المعارك سنة ١٥١٨م فخلفه أخوه خير الدين {cite:dawlat-uthmaniyya-salabi p. 207-209}."
  en: "Oruç Reis (d. 1518) — elder Barbarossa brother, named for the night of the Mi'raj on which he was said to be born; with Khayr al-Din he took Jijel from its Genoese garrison (1514) and ruled Algiers until killed in battle. A marble inscription on Cherchell's fort still named him 'al-mujahid fi sabil Allah' (924/1518) {cite:dawlat-uthmaniyya-salabi p. 207-209}."
  es: "Oruç Reis (m. 1518) — hermano mayor de Barbarroja, llamado así por la noche del Mi'raj en la que se dice que nació; junto con Khayr al-Din tomó Jijel de su guarnición genovesa (1514) y gobernó Argel hasta que murió en batalla. Una inscripción de mármol en el fuerte de Cherchell todavía lo nombra 'al-mujahid fi sabil Allah' (924/1518) {cite:dawlat-uthmaniyya-salabi p. 207-209}."
  fr: "Oruç Reis (mort en 1518) — frère aîné de Barberousse, ainsi nommé d'après la nuit du Mi'raj où il serait né; avec Khayr al-Din, il prit Jijel à la garnison génoise (1514) et gouverna Alger jusqu'à sa mort au combat. Une inscription en marbre sur le fort de Cherchell le désigne encore comme « al-mujahid fi sabil Allah » (924/1518) {cite: dawlat-uthmaniyya-salabi p. 207-209}."
  ur: "Oruç Reis (d. 1518) — بڑے بارباروسا بھائی، جس کا نام معراج کی رات کے لیے رکھا گیا تھا جس پر وہ پیدا ہوا تھا۔ خیرالدین کے ساتھ اس نے جیجیل کو اس کی جینی گیریژن (1514) سے لے لیا اور جنگ میں مارے جانے تک الجزائر پر حکومت کی۔ چیرچل کے قلعے پر سنگ مرمر کے نوشتہ پر اب بھی اس کا نام 'المجاہد فی سبیل اللہ' (924/1518) ہے۔ 207-209}۔"
  tr: "İbn Ya'qub ibn Yusuf, Madlali adasında yerleşmiş Türk Müslüman fatihlerinin kalıntılarından biridir. Annesi Müslüman bir Endülüs kadınıydı ve adı, o gece doğduğuna inanılan İsra ve Mi'raj olaylarından alınmıştır. Türkler adını (Ürüj) olarak telaffuz eder, ardından Araplaştırılmış Uruc olarak adlandırılmıştır. O ve kardeşi Hayr'eddin, yaklaşık 1510 yılında küçük yaşlardan itibaren takımadalarda deniz savaşlarına girdiler, ardından faaliyetlerini Kuzey Afrika'ya taşıdılar ve 1514 yılında Cenovalı kayınvalidesini öldürerek Jijel limanında üs kurdular; böylece Bejaia'yı kurtardılar, Endülüs Müslümanlarına yardım ettiler ve Cezayir ile bazı komşu bölgeleri yönettiler. Cherchell kalesinin kapısında şu yazıt bulunmaktadır: Bu, mücahit Mahmud bin Faris el-Turki tarafından, Tanrı davasının mücahiti Uruj bin Yaqub'un 924 Hicri (1518) tarihli izniyle inşa edilen Cherchell kulesidir. 1518 yılında yapılan savaşlardan birinde öldü ve yerine kardeşi Khairdindin geçti {cite:dawlat-uthmaniyya-salabi s. 207-209}."
  id: "Ibn Ya'qub ibn Yusuf adalah salah satu sisa-sisa penakluk Muslim Turki yang menetap di pulau Madlali. Ibunya adalah seorang wanita Andalusia Muslim, dan namanya diambil dari peristiwa Isra dan Mi'raj, yang diyakini lahir malam itu. Orang Turki mengucapkannya sebagai (Ürüj), kemudian diarabadikan menjadi Uruj. Ia dan saudaranya Khayr al-Din terlibat dalam perang laut sejak kecil di Kepulauan sekitar tahun 1510 M, kemudian mereka memindahkan aktivitas mereka ke Afrika Utara dan mendirikan markas di pelabuhan Jijel setelah memasuki dan membunuh ibu mertua Genoa pada tahun 1514 M untuk membebaskan Bejaia, membantu Muslim Andalusia, dan memerintah Aljazair serta beberapa wilayah tetangga. Sebuah prasasti di pintu benteng Cherchell masih ada, yang menyatakan: Ini adalah menara Cherchell yang dibangun oleh mujahid Mahmoud ibn Faris al-Turki selama kekhalifahan Emir al-Hakim bi-Amr Allah, mujahid dalam perjuangan Tuhan, Uruj ibn Yaqub, dengan izinnya bertanggal 924 H (1518 M), dan marmer lain di pintu Masjid Chawas di ibu kota Aljazair. Ia tewas dalam salah satu pertempuran pada tahun 1518 M dan digantikan oleh saudaranya Khair al-Din {cite:dawlat-uthmaniyya-salabi hlm. 207-209}."
