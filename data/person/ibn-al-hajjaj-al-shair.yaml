label: { ar: "أبو عبد الله الحسين بن أحمد بن الحجاج الشاعر" }
summary:
  ar: "الحسين بن أحمد بن الحجاج أبو عبد الله الشاعر، كان من أولاد العمال والكتاب وكانت إليه حسبة بغداد في أيام عضد الدولة فاستخلف عليها ستة أنفس كلهم لا خير فيه، ثم تشاغل بالشعر وتفرد بالسخف الذي يدل على خساسة النفس فحصل الأموال به وصار ممن يتقي لسانه، وحمل إليه صاحب مصر عن مديح مدحه به ألف دينار مغربية، وقد أفرد أبو الحسن الرضي من شعره ما خلا عن السخف وهو شعر حسن. توفي ابن الحجاج بالنيل في جمادى الآخرة سنة إحدى وتسعين ورثاه الرضي {cite:muntazam-ibn-al-jawzi j.7 p.216-217}."
