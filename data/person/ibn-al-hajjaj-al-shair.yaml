id: person/ibn-al-hajjaj-al-shair
class: person
label: { ar: "أبو عبد الله الحسين بن أحمد بن الحجاج الشاعر" }
summary:
  ar: "الحسين بن أحمد بن الحجاج أبو عبد الله الشاعر، كان من أولاد العمال والكتاب وكانت إليه حسبة بغداد في أيام عضد الدولة فاستخلف عليها ستة أنفس كلهم لا خير فيه، ثم تشاغل بالشعر وتفرد بالسخف الذي يدل على خساسة النفس فحصل الأموال به وصار ممن يتقي لسانه، وحمل إليه صاحب مصر عن مديح مدحه به ألف دينار مغربية، وقد أفرد أبو الحسن الرضي من شعره ما خلا عن السخف وهو شعر حسن. توفي ابن الحجاج بالنيل في جمادى الآخرة سنة إحدى وتسعين ورثاه الرضي {cite:muntazam-ibn-al-jawzi j.7 p.216-217}."
  tr: "Şair El-Hüseyin bin Ahmed ibn el-Haccac Ebu Abdullah, işçi ve yazarların oğullarından biriydi. Bağdat valiliğini 'Adud al-Dawla döneminde yürüttü ve altı kişiyi halef olarak atadı, bunların hiçbiri ona faydasızdı. Sonra şiire daldı ve ruhun alçaklığını gösteren hafiflikleriyle benzersizdi, bu yüzden servet biriktirdi ve dilinden korkanlardan biri oldu. Mısır hükümdarı övgüsü için ona bin Fas dinarı ödedi. Ebu el-Hasan el-Radi, şiirlerine anlamsız olan, yani güzel şiirleri adadı. İbn el-Haccac, doksan birinci yılda Cumeda'l-Ahira'da Nil'de öldü ve el-Radi onu övdü {cite:Muntazam-ibn-al-Jawzi j.7 s.216-217}."
  id: "Al-Husayn ibn Ahmad ibn al-Hajjaj Abu Abdullah sang penyair adalah salah satu putra pekerja dan penulis. Ia menjabat sebagai gubernur Baghdad pada masa 'Adud al-Dawla, menunjuk enam orang sebagai penerusnya, yang semuanya tidak berguna baginya. Kemudian ia menjadi terobsesi dengan puisi dan unik dalam hal kebodohan yang menunjukkan rendahnya jiwa, sehingga ia mengumpulkan kekayaan dan menjadi salah satu yang takut pada lidahnya. Penguasa Mesir membayarnya seribu dinar Maroko sebagai bentuk pujiannya. Abu al-Hasan al-Radi mendedikasikan pada puisinya apa yang tidak masuk akal, yaitu puisi yang indah. Ibn al-Hajjaj meninggal di Sungai Nil di Jumada al-Akhirah pada tahun sembilan puluh satu, dan al-Radi memuji beliau {cite:muntazam-ibn-al-jawzi j.7 hlm.216-217}."
