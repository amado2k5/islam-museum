died: { edtf: "1257~", hijri: "0655", calendar: julian, precision: year, status: tradition, derived: true, note: "قُتلت وألقيت تحت قلعة مصر مسلوبة ثم دفنت بتربتها سنة خمس وخمسين وستمائة {cite:shadharat-dhahab p. 276}. (Not checked against the local scan in the showcase-prose pass: al-Maqrizi's Khitat gives her part in Aybak's death, not her own.)" }
summary:
  ar: "زوجة الملك الصالح أيوب وأم ولده خليل. كتمت موته سنة 647هـ حتى حضر توران شاه، ثم بويع لها بالسلطنة بعد قتل توران شاه، وخُطب لها وضُربت السكة باسمها، ثم تزوجها أيبك ونزلت له عن السلطنة، وقتلته في الحمام سنة 655هـ."
  en: "The wife of al-Malik al-Salih Ayyub and mother of Khalil. She concealed his death in 647 AH until Turanshah came; after Turanshah was killed she was raised to the sultanate, the sermon was given in her name and coins struck with it, and after she married Aybak and ceded the throne to him she killed him in the bath in 655 AH."
