id: person/shajar-al-durr
class: person
label: { ar: "شجر الدر سلطانة مصر" }
summary:
  ar: "جارية الملك الصالح أيوب أم خليل، أخفت موته سنة سبع وأربعين لما أخذت الفرنج دمياط حتى حضر ولده توران شاه فلما قتله غلمان أبيه أمروها عليهم وحلف لها الأتراك ولنائبها عز الدين أيبك فشرعت في الخلع للأمراء والأعطيات، ثم استقل أيبك بالسلطنة ولقب الملك المعز وخطب لهما وضربت السكة باسمهما، وفي سنة خمس وخمسين قتلته {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
  en: "Al-Malik al-Salih's slave-girl Umm Khalil; she hid his death through the Damietta crisis, and on Turanshah's murder was raised sultana — the Turks swearing to her — before Aybak took the throne beside then without her. In 655 she killed him {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
