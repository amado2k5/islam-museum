label: { ar: "شجر الدر سلطانة مصر" }
names:
  - { value: "شجر الدر أم خليل", kind: full }
died: { edtf: "1257~", hijri: "0655", calendar: julian, precision: year, status: tradition, derived: true, note: "قُتلت وألقيت تحت قلعة مصر مسلوبة ثم دفنت بتربتها سنة خمس وخمسين وستمائة {cite:shadharat-dhahab p. 276}. (Not checked against the local scan in the showcase-prose pass: al-Maqrizi's Khitat gives her part in Aybak's death, not her own.)" }
summary:
  ar: "زوجة الملك الصالح أيوب وأم ولده خليل. كتمت موته سنة 647هـ حتى حضر توران شاه، ثم بويع لها بالسلطنة بعد قتل توران شاه، وخُطب لها وضُربت السكة باسمها، ثم تزوجها أيبك ونزلت له عن السلطنة، وقتلته في الحمام سنة 655هـ."
  en: "The wife of al-Malik al-Salih Ayyub and mother of Khalil. She concealed his death in 647 AH until Turanshah came; after Turanshah was killed she was raised to the sultanate, the sermon was given in her name and coins struck with it, and after she married Aybak and ceded the throne to him she killed him in the bath in 655 AH."
  es: "La esposa de al-Malik al-Salih Ayyub y madre de Khalil. Ocultó su muerte en el año 647 de la Hégira hasta la llegada de Turanshah; tras la muerte de Turanshah, fue elevada al sultanato, se pronunció un sermón en su nombre y se acuñaron monedas con él, y después de casarse con Aybak y cederle el trono, lo asesinó en el baño en el año 655 de la Hégira."
  fr: "L'épouse d'al-Malik al-Salih Ayyub et la mère de Khalil. Elle dissimula sa mort en 647 AH jusqu'à l'arrivée de Turanshah; après la mort de ce dernier, elle fut élevée au rang de sultan, un sermon fut prononcé en son nom et des pièces de monnaie furent frappées à son effigie. Après avoir épousé Aybak et lui avoir cédé le trône, elle le fit assassiner dans son bain en 655 AH."
  ur: "ملک الصالح ایوب کی بیوی اور خلیل کی والدہ۔ اس نے 647 ہجری میں ان کی موت کو تورانشاہ آنے تک چھپایا۔ ترانشاہ کے قتل کے بعد اسے سلطنت میں اٹھایا گیا، اس کے نام پر خطبہ دیا گیا اور اس کے ساتھ سکے بھی مارے گئے، اور ایبک سے شادی کر کے اسے تخت سونپنے کے بعد اس نے اسے 655 ہجری میں حمام میں قتل کر دیا۔"
  tr: "O, Kral el-Salih Eyyub'un eşi ve oğlu Halil'in annesiydi. Oğlunun ölümü 647 Hicri yılında gizli tutuldu; ardından Turan Şah suikasta uğradıktan sonra ona sultanlık olarak bağlılık yemini etti. Ona evlenme teklif etti ve parayı onun adına bastı. Sonra Aybak onunla evlendi ve Eybak sultanlıktan ona geçti, 655 Hicri yılında hamamda onu öldürdü."
  id: "Dia adalah istri Raja al-Salih Ayyub dan ibu dari putranya, Khalil. Kematian Ayyub dirahasiakan pada tahun 647 H sampai Turan Shah hadir, kemudian dia bersumpah setia kepadanya sebagai kesultanan setelah pembunuhan Turan Shah. Dia melamarnya dan mencetak koin atas namanya. Kemudian Aybak menikahinya, dan dia turun dari kesultanan kepadanya, membunuhnya di pemandian pada 655 H."
