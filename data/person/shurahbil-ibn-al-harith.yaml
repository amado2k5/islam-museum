summary:
  ar: "شرحبيل بن الحارث بن عمرو الكندي، ملكه أبوه على بكر بن وائل وبني حنظلة وأسيد والرباب؛ لما هلك الحارث وتشتت أمر بنيه زحف شرحبيل بجموعه إلى ماء الكلاب بين البصرة والكوفة فاقتتل مع أخيه سلمة يوم الكلاب الأول، فطعنه أبو حنش التغلبي فألقاه عن فرسه وأخذ رأسه وبعث به إلى سلمة {cite:kamil-ibn-al-athir p. 410-411}."
  en: "Shurahbil ibn al-Harith al-Kindi, set by his father over Bakr ibn Wa'il and their allies; after al-Harith's death scattered the brothers' rule he marched on the water of al-Kullab against his brother Salama, and at the first day of al-Kullab Abu Hanash the Taghlibi speared him and carried his head to Salama {cite:kamil-ibn-al-athir p. 410-411}."
