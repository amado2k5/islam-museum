summary:
  ar: "داود البلخي، من متقدمي شيوخ المشرق، لم يجد له أبو نعيم ذكرًا إلا في حكاية يرويها إبراهيم بن أدهم عن رجل صحبه بين الكوفة ومكة وعلّمه اسم الله الأعظم."
  en: "Dawud al-Balkhi, one of the early shaykhs of the East; Abu Nu'aym found no mention of him except a story told by Ibrahim ibn Adham about a man who travelled with him between Kufa and Mecca and taught him God's greatest name."
  ur: "داود بلخی مشرق کے ابتدائی مشائخ میں سے ہیں۔ ابو نعیم کو ان کا ذکر صرف ایک حکایت میں ملا۔ یہ حکایت ابراہیم بن ادہم ایک ایسے شخص کے بارے میں سناتے ہیں جو کوفہ اور مکہ کے درمیان ان کا ساتھی بنا اور انہیں اسمِ اعظم سکھایا۔"
