id: person/muhammad-ibn-al-husayn-zaydan
class: person
label: { ar: "محمد بن الحسين زيدان", en: "Muhammad Ibn Al Husayn Zaydan" }
summary:
  ar: "محمد بن الحسين ويلقب بزيدان من ناحية الكرخ من كتاب أحمد بن عبد العزيز بن أبي دلف، وكان ممن واطأ عبد الله بن ميمون على أمره وكان متفلسفا حاذقا بعلم النجوم شعوبيا شديد الغيظ من دولة الإسلام وكان يدين بإثبات النفس والعقل والزمان والمكان والهيولى ويرى أن للكواكب تدبيرا وروحانية، وأخبرني عنه الثقة أنه كان يزعم أنه وجد في الحكم النجومي انتقال دولة الإسلام إلى دولة الفرس ودينهم الذي هو المجوسية في القران الثامن {cite:fihrist-ibn-al-nadim p. 267}."
  en: "Muhammad ibn al-Husayn Zaydan — the Shu'ubi astrologer who foretold the empire's return to Persia {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
