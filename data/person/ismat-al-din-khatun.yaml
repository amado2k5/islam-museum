summary:
  ar: "عصمة الدين خاتون بنت الأمير معين الدين أنر، زوجة نور الدين محمود الشهيد ثم السلطان صلاح الدين؛ واقفة المدرسة التي بدمشق للحنفية، وبنت خانقاه للصوفية على الشرف القبلي خارج باب النصر، وبنت تربة بقاسيون على نهر يزيد تجاه قبة جركس ودفنت بها — وهي اليوم داخل الجامع الجديد بالصالحية — وأوقفت على هذه الأماكن أوقافاً كثيرة؛ توفيت سنة إحدى وثمانين وخمسمائة {cite:shadharat-dhahab p. 752}."
  en: "Ismat al-Din Khatun, daughter of the amir Mu'in al-Din Anar, wife of Nur al-Din and then of Salah al-Din; endower of the Hanafi madrasa in Damascus, builder of a khanqah for the Sufis on the southern scarp outside Bab al-Nasr, and of a tomb at Qasyun on the Yazid stream facing Jirjis Dome where she was buried — now within al-Jami' al-Jadid in al-Salihiyya — with rich endowments on all; she died in 581 {cite:shadharat-dhahab p. 752}."
