summary:
  ar: "عصمة الدين خاتون بنت الأمير معين الدين أنر، زوجة نور الدين محمود الشهيد ثم السلطان صلاح الدين؛ واقفة المدرسة التي بدمشق للحنفية، وبنت خانقاه للصوفية على الشرف القبلي خارج باب النصر، وبنت تربة بقاسيون على نهر يزيد تجاه قبة جركس ودفنت بها — وهي اليوم داخل الجامع الجديد بالصالحية — وأوقفت على هذه الأماكن أوقافاً كثيرة؛ توفيت سنة إحدى وثمانين وخمسمائة {cite:shadharat-dhahab p. 752}."
  en: "Ismat al-Din Khatun, daughter of the amir Mu'in al-Din Anar, wife of Nur al-Din and then of Salah al-Din; endower of the Hanafi madrasa in Damascus, builder of a khanqah for the Sufis on the southern scarp outside Bab al-Nasr, and of a tomb at Qasyun on the Yazid stream facing Jirjis Dome where she was buried — now within al-Jami' al-Jadid in al-Salihiyya — with rich endowments on all; she died in 581 {cite:shadharat-dhahab p. 752}."
  es: "Ismat al-Din Khatun, hija del emir Mu'in al-Din Anar, esposa de Nur al-Din y luego de Salah al-Din; benefactora de la madrasa hanafí en Damasco, constructora de un khanqah para los sufíes en la escarpa sur, fuera de Bab al-Nasr, y de una tumba en Qasyun, en el arroyo Yazid, frente a la cúpula de Jirjis, donde fue enterrada —ahora dentro de al-Jami' al-Jadid en al-Salihiyya— con ricas donaciones en todas ellas; murió en 581 {cite:shadharat-dhahab p. 752}."
  fr: "Ismat al-Din Khatun, fille de l'émir Mu'in al-Din Anar, épouse de Nur al-Din puis de Salah al-Din; donatrice de la madrasa hanafite de Damas, bâtisseuse d'une khanqah pour les soufis sur l'escarpement sud à l'extérieur de Bab al-Nasr, et d'un tombeau à Qasyun sur le ruisseau Yazid face au Dôme de Jirjis où elle fut enterrée — maintenant dans al-Jami' al-Jadid à al-Salihiyya — avec de riches dotations sur tous; elle mourut en 581 {cite:shadharat-dhahab p. 752}."
  ur: "عصمت الدین خاتون، امیر معین الدین انار کی بیٹی، نورالدین اور پھر صلاح الدین کی بیوی؛ دمشق میں حنفی مدرسہ کی سرپرست، باب النصر کے باہر جنوبی حصے میں صوفیوں کے لیے خانقاہ بنانے والا، اور یزید ندی پر واقع قصیون کے مقام پر ایک مقبرہ جو جرجیس گنبد کے سامنے ہے جہاں اسے دفن کیا گیا تھا۔ ان کا انتقال 581ء میں ہوا۔ 752}۔"
  tr: "İsmet al-Din Hatun, şehit Nureddin Mahmud'un ve ardından Sultan Salahdin'in eşi Prens Mu'in el-Din Anr'ın kızı; Şam'da Hanefi okulunun kurucusuydu, Bab el-Nasr dışındaki Kıble el-Şerk'te bir Sufi hankahı inşa etti ve Girkas Kubbesi'ne bakan Yezid Nehri kıyısında Kasioun'da bir toprak inşa etti ve bugün el-Salihiye'deki yeni caminin içinde gömüldü ve bu yerler için birçok vakıf bağışladı; beş yüz seksen birinci yılda vefat etti {atıf:Shadharat-Dhahab, s. 752}."
  id: "Ismat al-Din Khatun, putri Pangeran Mu'in al-Din Anr, istri Nur al-Din Mahmoud sang martir dan kemudian Sultan Salah al-Din; ia adalah pendiri aliran Hanafi di Damaskus, membangun khanqah Sufi di Qibli al-Sharq di luar Bab al-Nasr, dan membangun tanah di Qasioun di Sungai Yazid yang menghadap Kubah Girkas dan dimakamkan di sana—sekarang di dalam masjid baru di al-Salihiyah—dan menyumbangkan banyak wakaf untuk tempat-tempat tersebut; ia meninggal pada tahun lima ratus delapan puluh satu {cite:shadharat-dhahab, hlm. 752}."
