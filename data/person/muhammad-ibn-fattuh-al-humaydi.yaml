summary:
  ar: "أبو عبد الله محمد بن أبي نصر فتوح بن عبد الله الأزدي الحميدي الأندلسي الميورقي، يُعرف بابن فتوح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} أخذ عن أبي عمر بن عبد البر، والقاضي أبي عبد الله القضاعي، والحافظ أبي بكر الخطيب، وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} قال إبراهيم السلماسي إنه كان ورعاً تقياً، إماماً في الحديث وعلله ورواته، متحققاً بعلم التحقيق والأصول على مذهب أصحاب الحديث، فصيح العبارة، متبحراً في الأدب والعربية والترسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} من مصنفاته «الذهب المسبوك في وعظ الملوك»، و«جمل تاريخ الإسلام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} والمصدر المذكور: سير أعلام النبلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} وفي رأس الترجمة تاريخ مكتوب بصيغة «قبل ٤٨٨» مع رقم آخر، ولم يتضح كله في المسح."
  en: "Abu Abd Allah Muhammad ibn Abi Nasr Fattuh ibn Abd Allah al-Azdi al-Humaydi al-Andalusi al-Mayurqi, known as Ibn Fattuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} He studied with Abu Umar ibn Abd al-Barr, the judge Abu Abd Allah al-Qada'i, the hafiz Abu Bakr al-Khatib, and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Ibrahim al-Salmasi said he was scrupulous and devout, an imam in hadith and its defects and transmitters, versed in the science of verification and the principles of the people of hadith, eloquent in speech and well read in literature, Arabic and correspondence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} His works include «al-Dhahab al-masbuk fi wa'z al-muluk» and «Jumal tarikh al-Islam». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} The source cited is Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} The heading's date, which begins with 'before 488', is only partly legible in the scan."
