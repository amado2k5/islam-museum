summary:
  ar: "أبو عبد الله محمد بن أبي نصر فتوح بن عبد الله الأزدي الحميدي الأندلسي الميورقي، يُعرف بابن فتوح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} أخذ عن أبي عمر بن عبد البر، والقاضي أبي عبد الله القضاعي، والحافظ أبي بكر الخطيب، وغيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} قال إبراهيم السلماسي إنه كان ورعاً تقياً، إماماً في الحديث وعلله ورواته، متحققاً بعلم التحقيق والأصول على مذهب أصحاب الحديث، فصيح العبارة، متبحراً في الأدب والعربية والترسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} من مصنفاته «الذهب المسبوك في وعظ الملوك»، و«جمل تاريخ الإسلام». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} والمصدر المذكور: سير أعلام النبلاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} وفي رأس الترجمة تاريخ مكتوب بصيغة «قبل ٤٨٨» مع رقم آخر، ولم يتضح كله في المسح."
  en: "Abu Abd Allah Muhammad ibn Abi Nasr Fattuh ibn Abd Allah al-Azdi al-Humaydi al-Andalusi al-Mayurqi, known as Ibn Fattuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} He studied with Abu Umar ibn Abd al-Barr, the judge Abu Abd Allah al-Qada'i, the hafiz Abu Bakr al-Khatib, and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Ibrahim al-Salmasi said he was scrupulous and devout, an imam in hadith and its defects and transmitters, versed in the science of verification and the principles of the people of hadith, eloquent in speech and well read in literature, Arabic and correspondence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} His works include «al-Dhahab al-masbuk fi wa'z al-muluk» and «Jumal tarikh al-Islam». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} The source cited is Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} The heading's date, which begins with 'before 488', is only partly legible in the scan."
  es: "Abu Abd Allah Muhammad ibn Abi Nasr Fattuh ibn Abd Allah al-Azdi al-Humaydi al-Andalusi al-Mayurqi, conocido como Ibn Fattuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Estudió con Abu Umar ibn Abd al-Barr, el juez Abu Abd Allah al-Qada'i, el hafiz Abu Bakr al-Khatib y otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Ibrahim al-Salmasi dijo que era escrupuloso y devoto, un imán en hadiz y sus defectos y transmisores, versado en la ciencia de la verificación y los principios de la gente del hadiz, elocuente en el discurso y bien leído en literatura, árabe y correspondencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Entre sus obras se incluyen «al-Dhahab al-masbuk fi wa'z al-muluk» y «Jumal tarikh al-Islam». {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} La fuente citada es Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} La fecha del título, que comienza con \"antes de 488\", sólo es parcialmente legible en el escaneo."
  fr: "Abu Abd Allah Muhammad ibn Abi Nasr Fattuh ibn Abd Allah al-Azdi al-Humaydi al-Andalusi al-Mayurqi, plus connu sous le nom d'Ibn Fattuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Il étudia auprès d'Abu Umar ibn Abd al-Barr, du juge Abu Abd Allah al-Qada'i, du hafiz Abu Bakr al-Khatib, et d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Ibrahim al-Salmasi le décrit comme scrupuleux et pieux, un imam en matière de hadith, de ses défauts et de transmission, versé dans la science de la vérification et les principes des gens du hadith, éloquent et cultivé en littérature, en arabe et en correspondance. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} Ses œuvres incluent « al-Dhahab al-masbuk fi wa'z al-muluk » et « Jumal tarikh al-Islam ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} La source citée est Siyar a'lam al-nubala'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17698} La date du titre, qui commence par « avant 488 », n'est que partiellement lisible dans le scan."
  ur: "ابو عبد اللہ محمد بن ابی نصر فتوح ابن عبد اللہ العزدی الحمیدی الاندلسی المیورقی، ابن الفتوح کے نام سے جانا جاتا ہے۔ انہوں نے ابو عمر بن عبد البر، قاضی ابو عبد اللہ القداعی، حافظ ابوبکر الخطیب اور دیگر سے تعلیم حاصل کی۔ ابراہیم السلمسی نے کہا کہ وہ متقی اور پرہیزگار تھے، حدیث اور اس کے نقائص اور نقل کرنے والے امام تھے، علم توثیق اور اہل حدیث کے اصولوں پر عبور رکھتے تھے، فصاحت و بلاغت اور عربی زبان میں فصاحت و بلاغت کے ماہر تھے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17698} ان کی تصانیف میں \"الذہب المسبوک فی واعظ الملوک\" اور \"جمال تاریخ الاسلام\" شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17698} سیار اعلام النبلاء کا حوالہ دیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17698} سرخی کی تاریخ، جو '488 سے پہلے' سے شروع ہوتی ہے، اسکین میں صرف جزوی طور پر قابل مطالعہ ہے۔"
  tr: "Ebu Abdullah Muhammed bin Ebi Nasr Futuh ibn Abdullah el-Azdi el-Humaydi el-Endülüs el-Mayurqi, İbn Futuh olarak bilinir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17698} Ebu Ömer bin Abdülbar, hakim Ebu Abdullah el-Kudai, hadis alimi Ebu Bekir el-Hatib ve diğerlerinin yanında eğitim aldı. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17698} İbrahim el-Selmasi, kendisinin dindar ve dindar bir adam olduğunu, hadislerde, nedenlerinde ve rivayetçilerinde imam, hadis sahabeleri mezhebine göre doğrulama ve ilkeler biliminde usta, ifade açısından yetkin, edebiyat, Arapça ve aktarımda yetkin olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17698} Eserleri arasında \"Kralların Uyarısında Dökülmüş Altın\" ve \"İslam Tarihinin Hükümleri\" yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17698} ve bahsedilen kaynak: Siyar A'lam al-Nubala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17698} Çevirinin başında \"488'den önce\" şeklinde bir tarih ve başka bir numara yazılmıştır, ancak ankette hepsi net değildi."
  id: "Abu Abdullah Muhammad ibn Abi Nasr Futuh ibn Abdullah al-Azdi al-Humaydi al-Andalusi al-Mayurqi, dikenal sebagai Ibn Futuh. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17698} Ia belajar di bawah bimbingan Abu Umar ibn Abd al-Barr, hakim Abu Abdullah al-Quda'i, ulama hadis Abu Bakr al-Khatib, dan lainnya. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.17698} Ibrahim al-Salmasi mengatakan bahwa ia adalah orang yang saleh dan taat, imam dalam hadis, penyebab dan naratornya, mahir dalam ilmu verifikasi dan prinsip menurut mazhab para sahabat hadits, fasih dalam ekspresi, dan mahir dalam sastra, bahasa Arab, dan transmisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17698} Di antara karya-karyanya adalah \"The Cast Gold in the Admonition of Kings,\" dan \"The Sentences of the History of Islam.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17698} dan sumber yang disebutkan: Siyar A'lam al-Nubala. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17698} Di awal terjemahan terdapat tanggal yang ditulis dalam bentuk \"sebelum 488\" dengan angka lain, tetapi tidak semuanya jelas dalam survei."
