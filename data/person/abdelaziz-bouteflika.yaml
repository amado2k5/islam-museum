summary:
  ar: "سياسي ودبلوماسي جزائري، وُلد في وجدة بالمغرب سنة 1937، قاتل في جيش التحرير الوطني شابًا، وكان وزير خارجية الجزائر (1963–1979) ورئيس الجمعية العامة للأمم المتحدة، ثم رئيس الجمهورية نحو عشرين عامًا (1999–2019) حتى أطاحت به احتجاجات الحراك، وتوفي سنة 2021."
  en: "Algerian politician and diplomat, born at Oujda in Morocco in 1937. He fought in the National Liberation Army as a young man, served as Algeria's foreign minister (1963-1979) and president of the UN General Assembly, and was then president of Algeria for almost twenty years (1999-2019) until the Hirak protests forced his resignation. He died in 2021."
  ur: "الجزائری سیاست دان اور سفارت کار، جو 1937 میں مراکش کے وجدة میں پیدا ہوئے۔ جوانی میں قومی آزادی فوج میں لڑے، الجزائر کے وزیرِ خارجہ (1963–1979) اور اقوام متحدہ کی جنرل اسمبلی کے صدر رہے، پھر تقریباً بیس برس (1999–2019) الجزائر کے صدر رہے یہاں تک کہ حراک احتجاج نے انھیں مستعفی ہونے پر مجبور کر دیا۔ 2021 میں وفات پائی۔"
