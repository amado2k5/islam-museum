summary:
  ar: "أبو محمد معروف الشيبي، الشيخ الكبير القدوة الشهير العارف بالله؛ قال في النور: ولد بشبام ليلة الجمعة حادي عشر شهر رمضان سنة ثلاث وتسعين وثمانمائة، وكان كبير الشأن ذا كرامات ظاهرة وآيات باهرة أفرد مناقبه بعض الفضلاء بالتصنيف، وكان ذا جاه عظيم وقبول عند الخاص والعام؛ وكان سبب خروجه من بلده الدوعان أنه وُشي به إلى السلطان بدر الكثيري بأشياء منها فرط اعتقاد الناس فيه وامتثالهم أوامره ونواهيه فأمر بنفيه من البلاد بعد الاستشهاد بأهابته، فقيل له هذا معبودكم يا أهل شبام وجعل في عنقه حبلاً وطيف به؛ ومن غريب الاتفاق أن السلطان أمر بعض أمرائه أن يتولى فعل ذلك وكان ذلك الأمير من معتقدي الشيخ فتوقف، فأرسل إليه الشيخ: افعل ما أُمرت به وأنا ضمينك على الله بالجنة؛ توفي ليلة السبت خامس عشر صفر بدوعان {cite:shadharat-dhahab p. 357}."
  en: "Ma'ruf al-Shibi — Shabwa's qutb b. Friday eve 11 Ramadan 893; when Sultan Badr al-Kathiri ordered him exiled and paraded with a rope on his neck, the amir detailed to do it was one of the shaykh's own devotees and hesitated — the shaykh sent to him: 'do what you were ordered; I stand surety for you to God for Paradise'; died Saturday eve 15 Safar [970] at Du'an {cite:shadharat-dhahab p. 357}."
