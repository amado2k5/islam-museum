summary:
  ar: "أبو محمد معروف الشيبي، الشيخ الكبير القدوة الشهير العارف بالله؛ قال في النور: ولد بشبام ليلة الجمعة حادي عشر شهر رمضان سنة ثلاث وتسعين وثمانمائة، وكان كبير الشأن ذا كرامات ظاهرة وآيات باهرة أفرد مناقبه بعض الفضلاء بالتصنيف، وكان ذا جاه عظيم وقبول عند الخاص والعام؛ وكان سبب خروجه من بلده الدوعان أنه وُشي به إلى السلطان بدر الكثيري بأشياء منها فرط اعتقاد الناس فيه وامتثالهم أوامره ونواهيه فأمر بنفيه من البلاد بعد الاستشهاد بأهابته، فقيل له هذا معبودكم يا أهل شبام وجعل في عنقه حبلاً وطيف به؛ ومن غريب الاتفاق أن السلطان أمر بعض أمرائه أن يتولى فعل ذلك وكان ذلك الأمير من معتقدي الشيخ فتوقف، فأرسل إليه الشيخ: افعل ما أُمرت به وأنا ضمينك على الله بالجنة؛ توفي ليلة السبت خامس عشر صفر بدوعان {cite:shadharat-dhahab p. 357}."
  en: "Ma'ruf al-Shibi — Shabwa's qutb b. Friday eve 11 Ramadan 893; when Sultan Badr al-Kathiri ordered him exiled and paraded with a rope on his neck, the amir detailed to do it was one of the shaykh's own devotees and hesitated — the shaykh sent to him: 'do what you were ordered; I stand surety for you to God for Paradise'; died Saturday eve 15 Safar [970] at Du'an {cite:shadharat-dhahab p. 357}."
  es: "Ma'ruf al-Shibi — Qutb de Shabwa, nacido el viernes 11 de Ramadán de 893; cuando el sultán Badr al-Kathiri ordenó su exilio y que fuera exhibido con una soga al cuello, el emir encargado de hacerlo era uno de los devotos del propio jeque y dudó; el jeque le envió: «Haz lo que se te ordenó; yo intercedo por ti ante Dios para que llegues al Paraíso»; murió el sábado 15 de Safar [970] en Du'an {cita: shadharat-dhahab p. 357}."
  fr: "Ma'ruf al-Shibi — Qutb de Shabwa né le vendredi soir 11 Ramadan 893; lorsque le sultan Badr al-Kathiri ordonna son exil et son défilé avec une corde autour du cou, l'émir chargé de l'exécution était l'un des dévots du cheikh et hésita — le cheikh lui envoya: « Fais ce qui t'a été ordonné; je me porte garant pour toi auprès de Dieu pour le Paradis »; mort le samedi soir 15 Safar [970] à Du'an {cite: shadharat-dhahab p. 357}."
  ur: "معروف الشبی - شبوا کا قطب بی۔ جمعہ کی شام 11 رمضان 893; جب سلطان بدر الکثیری نے اسے جلاوطنی کا حکم دیا اور اس کی گردن میں رسی ڈال کر پریڈ کروائی تو امیر شیخ کے اپنے عقیدت مندوں میں سے ایک تھا اور ہچکچاہٹ کا شکار ہوا - شیخ نے اسے بھیجا: 'جو تمہیں حکم دیا گیا ہے وہ کرو۔ میں جنت کے لیے اللہ کے ہاں تمہارے لیے ضامن ہوں۔ ہفتہ کی شام 15 صفر [970] میں دُعان میں وفات پائی۔ 357}۔"
  tr: "Tanrı'nın büyük, örnek, ünlü ve mistik Ebu Muhammed Ma'ruf al-Shaybi, Al-Noor'da şöyle demiştir: Ramazan ayının on birinci Cuma gecesi, sekiz yüz doksan üçüncü yılında, Şibab'da doğdu. Büyük yapılıydı ve belirgin mucizeler ile parlak işaretlere sahipti. Bazı erdemleri yazarlara atfedildi. Büyük bir statüye sahipti ve hem seçkinler hem de halk tarafından kabul gördü. Memleketi Al-Du'an'dan ayrılmasının sebebi, Sultan Badr al-Kathiri'ye halkın ona aşırı inancı ve onun emirlerine ve yasaklarına uyması gibi şeylerden haberdar edilmesiydi; bu yüzden hayranlığını gerekçe göstererek ülkeden sürgün edilmesini emretti. Ona, 'Bu sizin tanrınızdır, ey Şibam halkı,' denildi ve boynuna bir ip takıp boynuna doladı. Anlaşma için alışılmadık bir durum olan Sultan, bazı komutanlarına bunu üstlenmelerini emretti ve o prens Şeyh'in takipçilerinden biriydi, bu yüzden durdu. Şeyh ona şöyle dedi: Emredildiği gibi yap, sana Allah'la cenneti garanti ederim. Cumartesi gecesi, Safar'ın on beşinci günü, Du'an'da öldü {cite:shadharat-dhahab, s. 357}."
  id: "Abu Muhammad Ma'ruf al-Shaybi, tokoh agung, teladan, terkenal, dan mistikus Tuhan, berkata dalam Al-Noor: Ia lahir di Shibam pada malam Jumat, tanggal sebelas Ramadan, tahun delapan ratus sembilan puluh tiga. Ia memiliki status besar dan memiliki mukjizat serta tanda-tanda cemerlang yang nyata. Beberapa kebajikan beliau dikaitkan dengan para penulis. Ia memiliki status tinggi dan diterima baik oleh kalangan elit maupun masyarakat. Alasan kepergiannya dari kampung halamannya Al-Du'an adalah karena ia diberitahu tentang hal-hal kepada Sultan Badr al-Kathiri, termasuk kepercayaan berlebihan rakyat kepadanya dan kepatuhan mereka terhadap perintah dan larangannya, sehingga ia memerintahkan pengasingannya dari negara itu setelah mengungkapkan rasa kagumnya. Ia diberitahu, 'Ini adalah dewa kalian, wahai umat Shibam,' dan ia mengikatkan tali di lehernya dan membungkusnya di lehernya. Adalah hal yang tidak biasa dalam kesepakatan bahwa Sultan memerintahkan beberapa komandannya untuk mengambil alih ini, dan pangeran itu adalah salah satu pengikut Sheikh, sehingga ia berhenti. Sheikh mengirim kepadanya: Lakukan seperti yang diperintahkan, dan aku jamin Surga bersama Allah. Ia meninggal pada malam Sabtu, tanggal lima belas Safar, di Du'an {cite:shadharat-dhahab, hlm. 357}."
