summary:
  ar: "الأمير سليمان بن أورخان؛ ولي عهد أبيه وقائد العبور العثماني الأول إلى أوروبا. يذكر الصلابي أن أورخان وضع خطة لمحاصرة القسطنطينية من الغرب والشرق فأرسل ابنه سليمان لعبور مضيق الدردنيل ليلاً في أربعين فارساً فاستولى على زوارق الروم وفتحت لهم عدة مواقع في الجانب الغربي منها جليبولو، فصارت لهم قاعدة في البر الأوروبي يغيرون منها {cite:dawlat-uthmaniyya-salabi p. 52}. وتوفي قبل أبيه فخلفه في الإمارة أخوه مراد الأول {cite:dawlat-uthmaniyya-salabi p. 57-58}."
  en: "Prince Suleiman, son and heir of Orhan — in al-Sallabi's telling he led the first Ottoman crossing of the Dardanelles by night with forty horsemen, seized Roman boats and secured footholds on the western shore including Gallipoli, the opening base of Ottoman Europe {cite:dawlat-uthmaniyya-salabi p. 52}. He died before his father, and the succession passed to his brother Murad I {cite:dawlat-uthmaniyya-salabi p. 57-58}."
