summary:
  ar: "الأمير سليمان بن أورخان؛ ولي عهد أبيه وقائد العبور العثماني الأول إلى أوروبا. يذكر الصلابي أن أورخان وضع خطة لمحاصرة القسطنطينية من الغرب والشرق فأرسل ابنه سليمان لعبور مضيق الدردنيل ليلاً في أربعين فارساً فاستولى على زوارق الروم وفتحت لهم عدة مواقع في الجانب الغربي منها جليبولو، فصارت لهم قاعدة في البر الأوروبي يغيرون منها {cite:dawlat-uthmaniyya-salabi p. 52}. وتوفي قبل أبيه فخلفه في الإمارة أخوه مراد الأول {cite:dawlat-uthmaniyya-salabi p. 57-58}."
  en: "Prince Suleiman, son and heir of Orhan — in al-Sallabi's telling he led the first Ottoman crossing of the Dardanelles by night with forty horsemen, seized Roman boats and secured footholds on the western shore including Gallipoli, the opening base of Ottoman Europe {cite:dawlat-uthmaniyya-salabi p. 52}. He died before his father, and the succession passed to his brother Murad I {cite:dawlat-uthmaniyya-salabi p. 57-58}."
  es: "El príncipe Suleimán, hijo y heredero de Orhan, según el relato de al-Sallabi, dirigió la primera travesía nocturna otomana de los Dardanelos con cuarenta jinetes, capturó barcos romanos y estableció puntos de apoyo en la costa occidental, incluyendo Gallipoli, la base inicial de la Europa otomana {cite:dawlat-uthmaniyya-salabi p. 52}. Murió antes que su padre, y la sucesión pasó a su hermano Murad I {cite:dawlat-uthmaniyya-salabi pp. 57-58}."
  fr: "Le prince Soliman, fils et héritier d'Orhan, mena, selon le récit d'al-Sallabi, la première traversée ottomane des Dardanelles de nuit avec quarante cavaliers, s'empara de navires romains et établit des positions sur la rive occidentale, notamment à Gallipoli, première base de l'Europe ottomane {cite:dawlat-uthmaniyya-salabi p. 52}. Il mourut avant son père et la succession revint à son frère Murad Ier {cite:dawlat-uthmaniyya-salabi p. 57-58}."
  ur: "شہزادہ سلیمان، بیٹا اور اورحان کا وارث - السلبی کے کہنے میں کہ اس نے چالیس گھڑ سواروں کے ساتھ رات کو دارڈینیلس کی پہلی عثمانی کراسنگ کی قیادت کی، رومی کشتیوں پر قبضہ کیا اور گیلیپولی سمیت مغربی ساحل پر قدم جمائے، جو کہ عثمانی یورپ کا افتتاحی اڈہ تھا۔ 52}۔ ان کا انتقال اپنے والد سے پہلے ہوا اور جانشینی ان کے بھائی مراد اول کو منتقل ہوئی۔ 57-58}۔"
