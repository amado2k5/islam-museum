summary:
  ar: "سعد الله خان الشينيوتِي (ق. 1591 – نيسان 1656)، المعروف بلقب العلامي، عالم وموظف في سلطنة مغول الهند، والصدر الأعظم والوكيل المطلق لشاه جهان من 1645 حتى وفاته. وُلد في شينيوت لعائلة جات بنجابية من المزارعين، ودرس في لاهور وعلّم في مدرسة وزير خان، فصعد بجدارة لا بقرابة حتى بلغ أعلى منصب لغير ملكي في الإمبراطورية، وعدّه الرحالة الأوروبيون أكمل رجال دولة في آسيا."
  en: "Sa'adullah Khan Chinioti (c. 1591 - April 1656), known by the scholarly title Allami, was a scholar and official of the Mughal Empire, grand vizier and Vakil-i-Mutlaq of Shah Jahan from 1645 until his death. Born at Chiniot into a Punjabi Jat family of cultivators, he studied at Lahore and taught at the madrasa of Wazir Khan, rising by merit rather than connection to the highest office held by a non-royal in the empire; European travellers at the court counted him the most accomplished statesman in Asia."
  ur: "سعد اللہ خان چنیوٹی (تقریباً 1591ء – اپریل 1656ء)، جو علامی کے لقب سے معروف ہیں، مغلیہ سلطنت کے عالم اور عہدیدار تھے، اور 1645ء سے اپنی وفات تک شاہ جہاں کے وزیرِ اعظم اور وکیلِ مطلق رہے۔ وہ چنیوٹ میں ایک پنجابی جاٹ کاشتکار خاندان میں پیدا ہوئے، لاہور میں تعلیم پائی اور وزیر خان کے مدرسے میں پڑھایا، اور قرابت کے بجائے قابلیت سے ترقی کر کے سلطنت کے بلند ترین غیر شاہی عہدے تک پہنچے؛ دربار کے یورپی مسافروں نے انھیں ایشیا کا مکمل ترین مدبر شمار کیا۔"

