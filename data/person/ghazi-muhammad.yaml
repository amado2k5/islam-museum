summary:
  ar: "غازي محمد بن إسماعيل الغيمراوي (1795–1832)، المعروف في المصادر الروسية بقاضي مُلّا، عالم داغستاني وصوفي نقشبندي صار أول أئمة داغستان والشيشان (1829–1832)؛ قاد حملة لإحلال الشريعة محل القانون العرفي (العادات)، وأعلن الغزوات ضد التوسع الروسي سنة 1830، وقُتل عند اقتحام قريته غيمري في 17 (29) أكتوبر 1832."
  en: "Ghazi Muhammad ibn Ismail al-Gimrawi (1795–1832), called Kazi-Mulla in Russian sources, was a Dagestani scholar and Naqshbandi Sufi who became the first Imam of Dagestan and Chechnya (1829–1832). He campaigned to replace customary law (adat) with sharia, declared ghazavat against Russian expansion in 1830, and was killed at the storming of his native Gimry on 17 (29) October 1832."
  ur: "غازی محمد بن اسماعیل الغیمراوی (1795–1832)، جو روسی مآخذ میں قاضی مُلّا کے نام سے معروف ہیں، داغستانی عالم اور نقشبندی صوفی تھے جو داغستان و چیچنیا کے پہلے امام بنے (1829–1832)۔ انہوں نے عرفی قانون (عادت) کی جگہ شریعت کے نفاذ کی مہم چلائی، 1830 میں روسی توسیع کے خلاف غزوات کا اعلان کیا، اور 17 (29) اکتوبر 1832 کو اپنے آبائی گاؤں گمری پر حملے میں قتل کیے گئے۔"
