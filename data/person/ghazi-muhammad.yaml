faith:
  - value: sufi
    basis: documented
    note: "Two independent texts attest Ghazi Muhammad's Naqshbandi affiliation personally. The English article's text records that in 1825 he went to Gazi-Kumukh to visit the sheikhs of the Naqshbandi order, soon 'became a dedicated member', studied under the Naqshbandi sheikh Jamal al-Din al-Ghazi-Ghumuqi and completed his training under the latter's murshid Muhammad al-Yaraghi, who — according to some sources — granted him the title of sheikh and ijaza to initiate new members. The Russian article's text independently records that he entered the Naqshbandi tariqa under Jamal al-Din, who gave him permission to be counted a sheikh; the Arabic article's text adds that he and Shamil both affiliated to the Sufi orders and that al-Yaraghi was his murshid. Membership, discipleship and sheikh-permission attested in independent texts settle the segment as sufi, documented, and the member_of relation to group/naqshbandiyya is written. No madhhab segment is recorded: the 'Sunni Islam' of the English and Arabic infoboxes is one infobox family and Wikidata's religion value is Islam in general; the English text's remark that he favoured the legal norms of the Shafi'i school states the law he enforced as imam, and the Russian text lists Shafi'i law among the subjects of his education — neither is a second independent text naming his own madhhab."
    sources: [source/wikipedia-ghazi-muhammad-en, source/wikipedia-ghazi-muhammad-ru, source/wikipedia-ghazi-muhammad-ar, source/wikidata-ghazi-muhammad]
