summary:
  ar: "أبو منصور الظفر بن أبي الحسين أزدشير الأسدي الواعظ المروزي، الملقب قطب الدين المعروف بالأمير؛ كان من أهل مرو، وله اليد الطولى في الوعظ والتذكير وحسن العبارة، ومارس هذا الفن من صغره إلى كبره؛ وقدم بغداد فأقام بها قريب ثلاث سنين مواظباً للوعظ فلقي من الخلق قبولاً تاماً وحظي عند الإمام المقتفي لأمر الله، ثم خرج منها رسولاً إلى جهة السلطان سنجر بن ملكشاه فوصل إلى خراسان ثم عاد إلى بغداد وخرج منها إلى خوزستان في رسالة فمات بعسكر مكرم سلخ ربيع الآخر سنة أربع وأربعين وخمسمائة، وحمل تابوته إلى بغداد فدفن في الشونيزية في حظيرة الشيخ الجنيد بن محمد؛ وسمع الحديث بنيسابور وروى عنه الحافظ أبو سعد السمعاني الذي قال: كان صحيح السماع ولم يكن موثوقاً به في دينه {cite:wafayat-ayan}."
  en: "al-Zafar al-Asadi of Merv (491–544) — the preacher whom al-Muqtafi favoured in Baghdad, envoy to Sultan Sanjar; died in Khuzistan, buried beside al-Junayd's enclosure in the Shuniziyya {cite:wafayat-ayan}."
