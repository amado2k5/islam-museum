summary:
  ar: "أبو منصور الظفر بن أبي الحسين أزدشير الأسدي الواعظ المروزي، الملقب قطب الدين المعروف بالأمير؛ كان من أهل مرو، وله اليد الطولى في الوعظ والتذكير وحسن العبارة، ومارس هذا الفن من صغره إلى كبره؛ وقدم بغداد فأقام بها قريب ثلاث سنين مواظباً للوعظ فلقي من الخلق قبولاً تاماً وحظي عند الإمام المقتفي لأمر الله، ثم خرج منها رسولاً إلى جهة السلطان سنجر بن ملكشاه فوصل إلى خراسان ثم عاد إلى بغداد وخرج منها إلى خوزستان في رسالة فمات بعسكر مكرم سلخ ربيع الآخر سنة أربع وأربعين وخمسمائة، وحمل تابوته إلى بغداد فدفن في الشونيزية في حظيرة الشيخ الجنيد بن محمد؛ وسمع الحديث بنيسابور وروى عنه الحافظ أبو سعد السمعاني الذي قال: كان صحيح السماع ولم يكن موثوقاً به في دينه {cite:wafayat-ayan}."
  en: "al-Zafar al-Asadi of Merv (491–544) — the preacher whom al-Muqtafi favoured in Baghdad, envoy to Sultan Sanjar; died in Khuzistan, buried beside al-Junayd's enclosure in the Shuniziyya {cite:wafayat-ayan}."
  fr: "al-Zafar al-Asadi de Merv (491–544) – le prédicateur qu’al-Muqtafi favorisait à Bagdad, envoyé du sultan Sanjar  ; mort au Khuzistan, enterré près de l’enclos d’al-Junayd dans la Shuniziyya {cite:wafayat-ayan}."
  es: "al-Zafar al-Asadi de Merv (491–544) — el predicador a quien al-Muqtafi favoreció en Bagdad, enviado al sultán Sanjar; murió en Khuzistán, enterrado junto al recinto de al-Junayd en Shuniziyya {cite:wafayat-ayan}."
  ur: "الظفر الاسدی آف مرو (491-544) - وہ مبلغ جس کو المقتفی نے بغداد میں پسند کیا، سلطان سنجار کا ایلچی؛ ان کا انتقال خوزستان میں ہوا، اسے شونیزیہ میں الجنید کے احاطہ کے پاس دفن کیا گیا۔"
  tr: "Mervazi'den vaiz olan Ebu Mansur el-Zafar bin Ebuyul-Hüseyin Azdşir el-Esedi, Kutb-Din lakaplı ve Prens olarak bilinen, Marv'dandı, vaaz verme, hatırlatma ve hitabet konusunda büyük bir yeteneğe sahipti. Bu sanatı çocukluğundan yaşlılığına kadar uyguladı. Bağdat'a geldi ve orada neredeyse üç yıl boyunca adanmışlıkla vaaz verdi, halktan tam kabul gördü ve İmam el-Muktafi li-Amr Allah'ın lütfunu kazandı. Daha sonra oradan Sultan Sancar bin Malikşah'a elçi olarak ayrıldı, Horasan'a ulaştı, ardından Bağdat'a döndü ve oradan Huzistan'a geçti Bir mektupta, 544 Hicri yılında Makram ordusunda öldü ve tabutu Bağdat'a götürüldü; burada Şeyh Al-Junaid bin Muhammed'in çevresindeki Şuniziye'ye defnedildi. Nişapur'da hadis duydu ve hadis, ezberci Ebu Sa'd al-Sam'ani tarafından ondan rivayet edildi; şöyle dedi: Duymada doğruydu ama dininde güvenilmiyordu {atıf:wafayat-ayan}."
  id: "Abu Mansur al-Zafar ibn Abi al-Husayn Azdshir al-Asadi, pendakwah dari Marwazi, yang dijuluki Qutb al-Din dan dikenal sebagai Pangeran, berasal dari Marv, memiliki keterampilan besar dalam berkhotbah, mengingatkan, dan kefasihannya. Ia mempraktikkan seni ini sejak kecil hingga usia tua. Ia datang ke Baghdad dan tinggal di sana hampir tiga tahun dengan penuh pengabdian, menerima penerimaan penuh dari publik dan mendapatkan restu Imam al-Muqtafi li-Amr Allah. Ia kemudian pergi ke sana sebagai utusan kepada Sultan Sanjar ibn Malikshah, tiba di Khorasan, kemudian kembali ke Baghdad, dan dari sana berangkat ke Khuzestan Dalam sebuah surat, ia meninggal di pasukan Makram pada tahun 544 H, dan peti matinya dibawa ke Baghdad, di mana ia dimakamkan di Shuniziyah di kawasan Sheikh Al-Junaid bin Muhammad. Ia mendengar hadits di Nishapur, dan hadis itu diceritakan darinya oleh pengapal Abu Sa'd al-Sam'ani, yang berkata: Ia otentik dalam mendengar tetapi tidak dipercaya dalam agamanya {cite:wafayat-ayan}."
