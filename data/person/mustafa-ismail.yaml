summary:
  ar: "قارئ قرآن مصري (1905–1978) وُلد في قرية ميت غزال بالغربية، أتقن المقامات والقراءات، وكان أول قارئ يُسجَّل في الإذاعة المصرية، واختاره الملك فاروق قارئا للقصر الملكي، وقرأ في المسجد الأقصى، وسجّل المصحف كاملا مرتلا، وترك أكثر من 1300 تلاوة ما تزال تُبث."
  en: "Egyptian Qur'an reciter (1905–1978), born in the village of Mit Gazal in Gharbia. He mastered the maqamat and the recitation modes, was the first reciter recorded by Egyptian Radio without examination, was chosen by King Farouk as reciter of the royal palace, recited at Al-Aqsa Mosque, recorded the whole Qur'an in tartil, and left more than 1,300 recitations still broadcast."
  ur: "مصری قاریِ قرآن (1905ء–1978ء)، جو غربية کے گاؤں میت غزال میں پیدا ہوئے۔ انہوں نے مقامات اور قراءتوں میں مہارت حاصل کی، مصری ریڈیو میں ریکارڈ ہونے والے پہلے قاری بنے، شاہ فاروق نے انہیں شاہی محل کا قارئ مقرر کیا، مسجد اقصیٰ میں تلاوت کی، پورا قرآن مرتل ریکارڈ کیا اور 1300 سے زائد تلاوتیں چھوڑیں جو آج بھی نشر ہوتی ہیں۔"
