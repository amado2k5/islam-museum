summary:
  ar: "قارئ قرآن مصري (1905–1978) وُلد في قرية ميت غزال بالغربية، أتقن المقامات والقراءات، وكان أول قارئ يُسجَّل في الإذاعة المصرية، واختاره الملك فاروق قارئا للقصر الملكي، وقرأ في المسجد الأقصى، وسجّل المصحف كاملا مرتلا، وترك أكثر من 1300 تلاوة ما تزال تُبث."
  en: "Egyptian Qur'an reciter (1905–1978), born in the village of Mit Gazal in Gharbia. He mastered the maqamat and the recitation modes, was the first reciter recorded by Egyptian Radio without examination, was chosen by King Farouk as reciter of the royal palace, recited at Al-Aqsa Mosque, recorded the whole Qur'an in tartil, and left more than 1,300 recitations still broadcast."
  ur: "مصری قاریِ قرآن ⁦(1905ء–1978ء)⁩، جو غربية کے گاؤں میت غزال میں پیدا ہوئے۔ انہوں نے مقامات اور قراءتوں میں مہارت حاصل کی، مصری ریڈیو میں ریکارڈ ہونے والے پہلے قاری بنے، شاہ فاروق نے انہیں شاہی محل کا قارئ مقرر کیا، مسجد اقصیٰ میں تلاوت کی، پورا قرآن مرتل ریکارڈ کیا اور 1300 سے زائد تلاوتیں چھوڑیں جو آج بھی نشر ہوتی ہیں۔"
  es: "Recitador egipcio del Corán (1905-1978), nacido en la aldea de Mit Gazal, en Gharbia. Dominó los maqamat y los modos de recitación, fue el primer recitador grabado por la Radio Egipcia sin examen, fue elegido por el rey Farouk como recitador del palacio real, recitó en la Mezquita de Al-Aqsa, grabó el Corán completo en tartil y dejó más de 1300 recitaciones que aún se transmiten."
  fr: "Récitateur du Coran égyptien (1905-1978), né dans le village de Mit Gazal en Gharbia. Il maîtrisait les maqams et les modes de récitation, fut le premier récitateur enregistré par la radio égyptienne sans examen, fut choisi par le roi Farouk comme récitateur du palais royal, récita à la mosquée Al-Aqsa, enregistra l'intégralité du Coran en tartil et a laissé plus de 1 300 récitations encore diffusées aujourd'hui."
  tr: "Mısırlı bir Kur'an okuyucusu (1905–1978), Harbiye'deki Mit Gazal köyünde doğmuş, makamet ve ilaveleri ustalıkla öğrenmiştir. Mısır radyosunda kaydedilen ilk okuyan olmuş, Kral Faruk tarafından kraliyet sarayının okunacısı olarak seçilmiş, Mescid-i Aksa Camii'nde okunmuş, tüm Kur'an'ı okuyor ve hâlâ yayınlanan 1.300'den fazla okuma bırakmıştır."
  id: "Seorang pembaca Al-Qur'an Mesir (1905–1978), lahir di desa Mit Ghazal di Gharbia, ia menguasai maqamat dan pembacaan. Ia adalah pembaca pertama yang tercatat di radio Mesir, dipilih oleh Raja Farouk sebagai pembaca istana kerajaan, membacakan di Masjid Al-Aqsa, merekam seluruh Al-Quran yang dibacakan, dan meninggalkan lebih dari 1.300 bacaan yang masih disiarkan hingga kini."
