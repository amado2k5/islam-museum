label: { ar: "أبو الفتح عبد الباقي الحداد الحنبلي الفرضي" }
summary:
  ar: "عبد الباقي بن حمزة بن الحسين الحداد الحنبلي الفرضي أبو الفتح — ولد سنة خمس وعشرين وأربعمائة؛ شيخ صالح خير داني قرأ الفقه وكانت له يد في الفرائض والحساب، سمع أبا محمد الجوهري؛ وله كتاب الإيضاح في الفرائض صنفه على مذهب أحمد وحرر فيه نقل المذهب تحريراً جيداً وذكر في باب توريث ذوي الأرحام مسألة الثلاث عمات مفترقات المال بينهن على خمسة وقال وهذا هو المنصوص عن أحمد؛ توفي يوم السبت رابع عشر شعبان سنة ثلاث وتسعين وأربعمائة {cite:shadharat-dhahab p. 399-400}."
  en: "Abd al-Baqi b. Hamza al-Haddad the Hanbali faradi, born 425 — a pious master of fara'id and hisab; author of al-Idah on fara'id by Ahmad's madhhab in which he recorded the three-aunts case and Ahmad's explicit text; died Saturday 14 Sha'ban 493 {cite:shadharat-dhahab p. 399-400}."
