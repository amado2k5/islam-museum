class: person
label: { ar: "أبو الفتح عبد الباقي الحداد الحنبلي الفرضي", en: "Abu al-Fath Abd al-Baqi al-Haddad al-Hanbali al-Faradi", fr: "Abu al-Fath Abd al-Baqi al-Haddad al-Hanbali al-Faradi", es: "Abu al-Fath Abd al-Baqi al-Haddad al-Hanbali al-Faradi", ur: "ابو الفتح عبد الباقی الحداد الحنبلی الفرادی" }
summary:
  ar: "عبد الباقي بن حمزة بن الحسين الحداد الحنبلي الفرضي أبو الفتح — ولد سنة خمس وعشرين وأربعمائة؛ شيخ صالح خير داني قرأ الفقه وكانت له يد في الفرائض والحساب، سمع أبا محمد الجوهري؛ وله كتاب الإيضاح في الفرائض صنفه على مذهب أحمد وحرر فيه نقل المذهب تحريراً جيداً وذكر في باب توريث ذوي الأرحام مسألة الثلاث عمات مفترقات المال بينهن على خمسة وقال وهذا هو المنصوص عن أحمد؛ توفي يوم السبت رابع عشر شعبان سنة ثلاث وتسعين وأربعمائة {cite:shadharat-dhahab p. 399-400}."
  en: "Abd al-Baqi b. Hamza al-Haddad the Hanbali faradi, born 425 — a pious master of fara'id and hisab; author of al-Idah on fara'id by Ahmad's madhhab in which he recorded the three-aunts case and Ahmad's explicit text; died Saturday 14 Sha'ban 493 {cite:shadharat-dhahab p. 399-400}."
  fr: "Abd al-Baqi b. Hamza al-Haddad, faradi hanbalite, né en 425 — maître pieux des fara'id et du calcul ; auteur d'al-Idah sur les fara'id selon l'école d'Ahmad, où il consigna le cas des trois tantes et le texte explicite d'Ahmad ; mort le samedi 14 cha'ban 493 {cite:shadharat-dhahab p. 399-400}."
  es: "Abd al-Baqi b. Hamza al-Haddad, el faradi hanbalí, nacido en 425, fue un piadoso maestro de fara'id e hisab; autor de al-Idah sobre fara'id según la madhhab de Ahmad, en la que registró el caso de las tres tías y el texto explícito de Ahmad; murió el sábado 14 de Sha'ban de 493 {cite:shadharat-dhahab p. 399-400}."
  ur: "عبد الباقی ب۔ حمزہ الحداد حنبلی فریادی، پیدائش 425 - فرید اور حسب کا ایک متقی استاد؛ احمد کے مذہب کی طرف سے فرید پر الاداح کا مصنف جس میں اس نے تین پھوپھیوں کا مقدمہ اور احمد کا واضح متن درج کیا ہے۔ 14 شعبان 493 بروز ہفتہ وفات پائی۔ 399-400}۔"
  tr: "Abdülbaki ibn Hamza ibn el-Hüseyn el-Haddad el-Hanbeli el-Faradi Ebu el-Fath, Hicri 425 yılında doğmuş, dindar ve iyi bir şeyh olup, fıkıh eğitimi almış, miras hukuku ve aritmetik konularında bilgi sahibi olmuştur. Ebu Muhammed el-Cevhari'den rivayet etmiş ve Ahmed ekolüne göre derlediği \"İdeh-i Fâlü't-Fârid\" adlı kitabı elinde bulundurmaktadır. Bu kitabın nakledilen metnini de güzel bir şekilde derlemiştir. Akrabaların miras paylaşımı bölümünde, üç teyzenin parayı beşe bölüştürmesinden bahsetmiş ve \"Bu, Ahmed'in rivayetine göre böyledir\" demiştir. Hicri 493 yılında, Şaban ayının on dördüncü Cumartesi günü vefat etmiştir. {Kaynak: Şadharat-Dhaba, s. 399-400}"
  id: "Abd al-Baqi ibn Hamza ibn al-Husayn al-Haddad al-Hanbali al-Faradi Abu al-Fath — lahir pada tahun 425 H; seorang syekh yang saleh dan baik yang mempelajari fiqih dan ahli dalam hukum warisan dan aritmatika. Beliau mendapat bimbingan dari Abu Muhammad al-Jawhari; dan beliau memiliki kitab Al-Idah fi al-Fara’id, yang disusunnya menurut mazhab Ahmad, dan beliau menyunting riwayat mazhab tersebut dengan baik. Beliau menyebutkan dalam bab tentang warisan kerabat masalah tiga bibi dari pihak ayah yang membagi harta warisan di antara mereka menjadi lima, dan beliau berkata, “Inilah yang disebutkan berdasarkan riwayat Ahmad.” Beliau wafat pada hari Sabtu, tanggal empat belas Sya'ban, tahun 493 H {cite:shadharat-dhahab hlm. 399-400}."
