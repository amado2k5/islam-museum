summary:
  ar: "أبو محمد عبد الله بن يوسف بن عبد الله بن يوسف بن محمد بن حيويه الجويني، الفقيه الشافعي والد إمام الحرمين؛ كان إماماً في التفسير والفقه والأصول والعربية والأدب؛ قرأ الأدب على أبيه أبي يعقوب ثم اشتغل بالفقه بنيسابور على أبي الطيب سهل بن محمد الصعلوكي وبمرو على أبي بكر القفال المروزي حتى أتقن المذهب والخلاف؛ عاد إلى نيسابور سنة سبع وأربعمائة وتصدر للتدريس والفتوى فتخرج عليه خلق كثير منهم ولده إمام الحرمين؛ صنف التفسير الكبير والتبصرة والتذكرة ومختصر المختصر وموقف الإمام والمأموم {cite:wafayat-ayan}."
  en: "Abu Muhammad Abdallah b. Yusuf al-Juwayni — Shafi'i jurist of Nishapur and father of Imam al-Haramayn; trained under al-Su'luki and al-Qaffal al-Marwazi; author of al-Tafsir al-Kabir and works on fiqh; returned to teach in Nishapur in 407 {cite:wafayat-ayan}."
