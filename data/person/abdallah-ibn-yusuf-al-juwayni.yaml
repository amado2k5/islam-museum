died: { edtf: "1046", hijri: "0438", calendar: julian, precision: month, status: tradition, derived: true, note: "توفي في ذي القعدة سنة ثمان وثلاثين كذا قال السمعاني في الذيل، وقال في الأنساب سنة أربع وثلاثين وأربعمائة بنيسابور {cite:wafayat-ayan}." }
summary:
  ar: "أبو محمد عبد الله بن يوسف بن عبد الله بن يوسف بن محمد بن حيويه الجويني، الفقيه الشافعي والد إمام الحرمين؛ كان إماماً في التفسير والفقه والأصول والعربية والأدب؛ قرأ الأدب على أبيه أبي يعقوب ثم اشتغل بالفقه بنيسابور على أبي الطيب سهل بن محمد الصعلوكي وبمرو على أبي بكر القفال المروزي حتى أتقن المذهب والخلاف؛ عاد إلى نيسابور سنة سبع وأربعمائة وتصدر للتدريس والفتوى فتخرج عليه خلق كثير منهم ولده إمام الحرمين؛ صنف التفسير الكبير والتبصرة والتذكرة ومختصر المختصر وموقف الإمام والمأموم {cite:wafayat-ayan}."
  en: "Abu Muhammad Abdallah b. Yusuf al-Juwayni — Shafi'i jurist of Nishapur and father of Imam al-Haramayn; trained under al-Su'luki and al-Qaffal al-Marwazi; author of al-Tafsir al-Kabir and works on fiqh; returned to teach in Nishapur in 407 {cite:wafayat-ayan}."
  fr: "Abu Muhammad Abdallah b. Yusuf al-Juwayni — juriste chaféite de Nichapour et père de l'Imam al-Haramayn ; formé auprès d'al-Su'luki et d'al-Qaffal al-Marwazi ; auteur d'al-Tafsir al-Kabir et d'ouvrages de fiqh ; revint enseigner à Nichapour en 407 {cite:wafayat-ayan}."
  es: "Abu Muhammad Abdallah b. Yusuf al-Juwayni: jurista shafi'i de Nishapur y padre del Imam al-Haramayn; entrenado con al-Su'luki y al-Qaffal al-Marwazi; autor de al-Tafsir al-Kabir y obras sobre fiqh; Regresó a enseñar en Nishapur en 407 {cita:wafayat-ayan}."
  ur: "ابو محمد عبداللہ بی۔ یوسف الجوینی - نیشاپور کے شافعی فقیہ اور امام الحرمین کے والد؛ السلوکی اور القفل المروازی کے تحت تربیت یافتہ؛ التفسیر الکبیر کے مصنف اور فقہ پر کام؛ 407 میں نیشاپور میں پڑھانے کے لیے واپس آئے۔"
  tr: "Şafiî fıkıhçısı ve İmam Haramayn'ın babası Ebu Muhammed Abdullah bin Yusuf bin Abdullah bin Yusuf bin Muhammed bin Haywayh el-Cüveyni; tefsir, fıkıh, prensipler, Arapça ve edebiyat alanlarında imamlık yapmıştır; edebiyat eğitimini babası Ebu Yakub'dan, fıkıh eğitimini ise Nişapur'da Ebu el-Tayyib Sahl bin Muhammed el-Sa'luki'den ve Merv'de Ebu Bekr el-Kaffal el-Mervezi'den almıştır; mezhebi ve görüş ayrılıklarını iyice öğrenmiştir; 407 yılında Nişapur'a dönerek fetva vermeye ve öğretim yapmaya başlamış, oğlu İmam Haramayn da dahil olmak üzere birçok kişi ondan mezun olmuştur; Büyük Tefsir, İftira, Hatırlatma, Özet ve İmamın ve Muhtarın Konumu adlı eserlerin yazarıdır."
  id: "Abu Muhammad Abdullah bin Yusuf bin Abdullah bin Yusuf bin Muhammad bin Haywayh al-Juwayni, seorang ahli hukum Syafi'i dan ayah dari Imam al-Haramayn; beliau adalah seorang imam yang ahli dalam tafsir, fiqih, prinsip-prinsip, bahasa Arab, dan sastra; beliau belajar sastra dengan ayahnya, Abu Ya'qub, kemudian belajar fiqih di Nishapur dengan Abu al-Tayyib Sahl bin Muhammad al-Sa'luki dan di Marw dengan Abu Bakr al-Qaffal al-Marwazi hingga menguasai mazhab dan perbedaan pendapat; beliau kembali ke Nishapur pada tahun 407 dan mulai mengajar serta mengeluarkan fatwa, dan banyak orang yang lulus darinya, termasuk putranya, Imam al-Haramayn; beliau menulis kitab Tafsir Agung, Wawasan, Pengingat, Ringkasan, dan Kedudukan Imam dan Pengikut {cite:wafayat-ayan}."
