roles: [mystic, transmitter]
summary:
  ar: "حيان الأسود. روى عنه جعفر بن محمد خبر رجل مكث ثلاث عشرة سنة يصلي في كل يوم وليلة ألف ركعة حتى ضعفت رجلاه، وكان إذا فرغ جلس محتبيًا مستقبلًا القبلة، يقول: عجبت للخليقة كيف أرادت بك بدلًا، وكيف استنارت قلوبها بذكر سواك، وكيف أنست بسواك، ثم يسكت إلى المغرب."
  en: "Hayyan al-Aswad, who relates through Ja'far ibn Muhammad the account of a man who stayed thirteen years praying a thousand units of prayer every day and night, until his legs grew weak; when he finished he sat with his arms round his knees facing the qibla and said: I marvel at creation, how it sought a substitute for You; how its hearts were lit by remembering other than You; how it found comfort in other than You; then he kept silent until sunset."
  ur: "حیان اسود۔ جعفر بن محمد کے واسطے سے ان کی روایت ہے کہ ایک شخص تیرہ سال تک ہر دن رات میں ہزار رکعت نماز پڑھتا رہا، یہاں تک کہ اس کی ٹانگیں کمزور ہو گئیں؛ نماز سے فارغ ہو کر وہ قبلہ رو ہو کر گھٹنوں کو باندھ کر بیٹھتا اور کہتا: مجھے مخلوق پر تعجب ہے کہ اس نے تیرے بدلے کسی اور کو چاہا؛ مجھے تعجب ہے کہ اس کے دل تیرے سوا کے ذکر سے کیسے روشن ہوئے؛ اور مجھے تعجب ہے کہ وہ تیرے سوا کسی سے کیسے مانوس ہوئی۔ پھر مغرب تک خاموش رہتا۔"
