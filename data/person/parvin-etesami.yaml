summary:
  ar: "شاعرة إيرانية (1907–1941) اسمها الأصلي رخشنده اعتصامی؛ صاحبة ديوان يضم 209 قصيدة و5,606 بيتًا اشتهر بقصائد المناظرة والحكايات الرمزية في الأخلاق والعلم والعدالة الاجتماعية، وتُعدّ أشهر شاعرات إيران."
  en: "Iranian poet (1907-1941), born Rakhshandeh E'tesami; author of a Divan of 209 compositions and 5,606 distiches famed for its debate poems (monazara) and fables on ethics, knowledge and social justice, and counted Iran's most famous woman poet."
