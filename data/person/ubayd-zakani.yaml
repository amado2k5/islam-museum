  note: "The year 1370 is the conventional one: the English biography's lead gives d. 1370 and Iranica's entry is headed 'd. ca. 770/1370'. The underlying tradition is a range, preserved here in full: Iranica's text, following the Shahed-e Sadeq and Taqi Kashi's Kholasat al-ash'ar as used by Abbas Iqbal, gives his death in 771/1369-70 or 772/1370-71, and confirms he was still alive in 768/1366, when he copied an astronomical manuscript later inherited by his son; the Persian biography likewise reports the tazkira writers placing the death between 768 and 772 AH. No Hijri year is recorded: the Gregorian year 1370 straddles 771-772 AH and the sources' own pairings (770, 771, 772) are inconsistent. PLACE CONFLICT, so no died_in edge is written: the English biography and Wikidata say possibly Shiraz; the Persian biography reports that he died in Isfahan or Baghdad and that his burial place is unknown."
