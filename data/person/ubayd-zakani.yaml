summary:
  ar: "شاعر وكاتب فارسي من قزوين (ت نحو 1370)، يُعدّ من أعظم الساخرين في الأدب الفارسي؛ من أسرة زاكاني المنحدرة من بني خفاجة. قصد شيراز فاتصل ببلاط أبي إسحاق الإينجو، وكتب «أوشاق نامه» ومدائح له، وبعد مقتل أبي إسحاق سنة 1357 قصد البلاط الجلائري ثم عاد إلى شيراز. أشهر آثاره «موش و گربه» (الفأر والقط)، هجاء سياسي ينتقد نفاق رجال الدين، و«أخلاق الأشراف» و«صد پند». لا يُعرف له عام ولادة؛ تضعه إيرانica قبل 1319، وتختلف التذاكر في وفاته بين 768 و772هـ."
  en: "Persian poet and writer of Qazvin (d. c. 1370), regarded as one of the greatest satirists in Persian literature; of the Zakani family, descended from the Arab tribe of Banu Khafaja. He attached himself to the Injuid court of Abu Ishaq at Shiraz, then, after Abu Ishaq's fall in 1357, to the Jalayirid court, before returning to Shiraz. His most famous works are Mush-o Gorbeh ('Mouse and Cat'), a political satire attacking clerical hypocrisy, Akhlaq al-Ashraf and Sad Pand. No birth year is recorded for him — Iranica places his birth before 1319 — and the biographical tradition puts his death between 768 and 772 AH."
  ur: "قزوین کے فارسی شاعر و ادیب (وفات تقریباً 1370ء)، جنھیں فارسی ادب کے سب سے بڑے طنز نگاروں میں شمار کیا جاتا ہے؛ ان کا تعلق بنو خفاجہ سے منسوب زاکانی خاندان سے تھا۔ وہ شیراز میں ابو اسحاق اینجو کے دربار سے وابستہ ہوئے، اور 1357ء میں ابو اسحاق کے زوال کے بعد جلایری دربار گئے، پھر شیراز لوٹ آئے۔ ان کی مشہور ترین تصانیف «موش و گربہ» (چوہا اور بلی)، جو مذہبی منافقت پر سیاسی طنز ہے، «اخلاق الاشراف» اور «صد پند» ہیں۔ ان کا سالِ ولادت معلوم نہیں — ایرانیکا ان کی پیدائش کو 1319ء سے پہلے رکھتی ہے — اور تذکروں میں ان کی وفات 768 تا 772ھ کے درمیان بیان ہوئی ہے۔"

