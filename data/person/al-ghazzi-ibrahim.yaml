summary:
  ar: "أبو إسحاق الغزي إبراهيم بن عثمان شاعر العصر وحامل لواء القريض؛ شعره كثير سائر متنقل في بلاد الجبال وخراسان، دخل دمشق وسمع بها من الفقيه نصر المقدسي سنة إحدى وثمانين وأربعمائة ورحل إلى بغداد وأقام بالمدرسة النظامية سنين كثيرة ومدح غير واحد من المدرسين بها، ثم رحل إلى خراسان فامتدح بها جماعة من رؤسائها وانتشر شعره هناك، وله ديوان شعر اختاره بنفسه ذكر في خطبته أنه ألف بيت، وقال العماد الكاتب جاب البلاد وأكثر النقل والحلول وتغلغل في أقطار خراسان وكرمان ولقي الناس ومدح ناصر الدين مكرم بن العلاء وزير كرمان بقصيدته البائية؛ توفي بناحية بلخ سنة أربع وعشرين وخمسمائة وله ثلاث وثمانون سنة {cite:shadharat-dhahab p. 547-549}."
  en: "Abu Ishaq al-Ghazzi Ibrahim ibn Uthman — 'poet of the age and standard-bearer of verse', whose poetry travelled through the Jibal and Khurasan; he heard Nasr al-Maqdisi at Damascus in 481, resided for years at Baghdad's Nizamiyya praising its teachers, then moved on to Khurasan where his verse spread; he kept a self-selected diwan he said held a thousand verses, and al-Imad al-Katib notes his Ba'iyya praising Nasir al-Din Makram ibn al-Ala, vizier of Kirman; d. near Balkh in 524 at eighty-three {cite:shadharat-dhahab p. 547-549}."
  fr: "Abu Ishaq al-Ghazzi Ibrahim ibn Uthman, « poète de son époque et porte-étendard du vers », dont la poésie parcourut le Jibal et le Khorassan ; il entendit Nasr al-Maqdisi à Damas en 481 H, résida des années à la Nizamiyya de Bagdad en louant ses maîtres, puis gagna le Khorassan, où ses vers se répandirent ; il constitua lui-même un diwan qu’il disait contenir mille vers, et al-Imad al-Katib relève sa Ba’iyya louant Nasir al-Din Makram ibn al-Ala, vizir du Kirman ; mort près de Balkh en 524 H à quatre-vingt-trois ans {cite:shadharat-dhahab p. 547-549}."
  es: "Abu Ishaq al-Ghazzi Ibrahim ibn Uthman — 'poeta de la época y abanderado de la poesía', cuya poesía viajó por Jibal y Jorasán; escuchó a Nasr al-Maqdisi en Damasco en 481, residió durante años en la Nizamiyya de Bagdad elogiando a sus maestros, luego se trasladó a Jorasán donde se difundió su poesía; tenía un diwan de su elección que, según él, contenía mil versos, y al-Imad al-Katib menciona su Ba'iyya elogiando a Nasir al-Din Makram ibn al-Ala, visir de Kirman; murió cerca de Balkh en 524 a los ochenta y tres años {cite:shadharat-dhahab p. 547-549}."
  ur: "ابو اسحاق الغازی ابراہیم ابن عثمان - 'عمر کا شاعر اور آیت کا معیاری علمبردار'، جس کی شاعری جبل اور خراسان سے گزری؛ اس نے 481 میں نصر المقدسی کو دمشق میں سنا، بغداد کے نظامیہ میں برسوں تک اپنے اساتذہ کی تعریف کرتے رہے، پھر خراسان چلے گئے جہاں اس کی آیت پھیلی۔ اس نے ایک خود ساختہ دیوان رکھا جس کے بارے میں انہوں نے کہا کہ اس میں ایک ہزار آیات ہیں، اور العماد الکاتب نے اپنے بعیہ کو کرمان کے وزیر ناصرالدین مکرم ابن الاعلٰی کی تعریف کرتے ہوئے نوٹ کیا ہے۔ d بلخ کے قریب 524 میں تریاسی {حوالہ: شدارت ذہاب ص۔ 547-549}۔"
  tr: "Çağın şairi ve şiirin bayraktarı Ebu İshak el-Gazzi İbrahim ibn Osman; şiirleri bol, yaygın ve dağlık bölgeler ile Horasan topraklarına kadar ulaşmıştır. Hicri 481 yılında Şam'a girmiş ve orada hukukçu Nasr el-Makdisi'den ders almıştır. Bağdat'a gitmiş ve uzun yıllar Nizamiye Okulu'nda kalmış ve birçok öğretmenini övmüştür. Daha sonra Horasan'a gitmiş ve oradaki liderlerden bir grubu övmüş, şiirleri orada da yayılmıştır. Kendi seçtiği bir şiir koleksiyonu vardır ve girişinde bin dizeden bahsettiğini belirtmiştir. İmad el-Katib şöyle demiştir: Toprakları dolaşmış, geniş çapta seyahat etmiş, Horasan ve Kerman bölgelerine girmiş, insanlarla görüşmüş ve Kerman veziri Nasır el-Din Makram ibn el-Ala'yı ba’ harfiyle yazdığı şiiriyle övmüştür. Hicri 524 yılında, seksen üç yaşında, Belh bölgesinde vefat etti. {kaynak: Shadharat-dhahab s. 547-549}"
  id: "Abu Ishaq al-Ghazzi Ibrahim ibn Uthman, penyair zaman dan pembawa panji puisi; puisinya berlimpah, tersebar luas, dan berkelana ke seluruh negeri pegunungan dan Khorasan. Ia memasuki Damaskus dan mendengar dari ahli hukum Nasr al-Maqdisi pada tahun 481 H. Ia melakukan perjalanan ke Baghdad dan tinggal di Sekolah Nizamiyya selama bertahun-tahun dan memuji beberapa gurunya. Kemudian ia melakukan perjalanan ke Khorasan dan memuji sekelompok pemimpinnya, dan puisinya menyebar di sana. Ia memiliki kumpulan puisi yang dipilihnya sendiri, di mana ia menyebutkan dalam pengantarnya bahwa ia memiliki seribu bait. Al-Imad al-Katib berkata: Ia melakukan perjalanan ke berbagai negeri dan melakukan perjalanan secara luas, dan menembus wilayah Khorasan dan Kerman, dan bertemu orang-orang dan memuji Nasir al-Din Makram ibn al-Ala, menteri Kerman, dengan puisinya dalam huruf ba'. Beliau wafat di wilayah Balkh pada tahun 524 Hijriah pada usia delapan puluh tiga tahun. {cite:shadharat-dhahab hlm. 547-549}"
