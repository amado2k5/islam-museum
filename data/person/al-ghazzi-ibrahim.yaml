summary:
  ar: "أبو إسحاق الغزي إبراهيم بن عثمان شاعر العصر وحامل لواء القريض؛ شعره كثير سائر متنقل في بلاد الجبال وخراسان، دخل دمشق وسمع بها من الفقيه نصر المقدسي سنة إحدى وثمانين وأربعمائة ورحل إلى بغداد وأقام بالمدرسة النظامية سنين كثيرة ومدح غير واحد من المدرسين بها، ثم رحل إلى خراسان فامتدح بها جماعة من رؤسائها وانتشر شعره هناك، وله ديوان شعر اختاره بنفسه ذكر في خطبته أنه ألف بيت، وقال العماد الكاتب جاب البلاد وأكثر النقل والحلول وتغلغل في أقطار خراسان وكرمان ولقي الناس ومدح ناصر الدين مكرم بن العلاء وزير كرمان بقصيدته البائية؛ توفي بناحية بلخ سنة أربع وعشرين وخمسمائة وله ثلاث وثمانون سنة {cite:shadharat-dhahab p. 547-549}."
  en: "Abu Ishaq al-Ghazzi Ibrahim ibn Uthman — 'poet of the age and standard-bearer of verse', whose poetry travelled through the Jibal and Khurasan; he heard Nasr al-Maqdisi at Damascus in 481, resided for years at Baghdad's Nizamiyya praising its teachers, then moved on to Khurasan where his verse spread; he kept a self-selected diwan he said held a thousand verses, and al-Imad al-Katib notes his Ba'iyya praising Nasir al-Din Makram ibn al-Ala, vizier of Kirman; d. near Balkh in 524 at eighty-three {cite:shadharat-dhahab p. 547-549}."
