id: person/abu-al-qasim-al-hadid
class: person
label: { ar: "أبو القاسم الحديد", en: "Abu Al Qasim Al Hadid", fr: "Abu al-Qasim al-Hadid", es: "Abu Al Qasim Al Hadid", ur: "ابو القاسم الحدید" }
summary:
  ar: "أبو القاسم الحديد رآه ابن النديم وكان زاهدا ظاهر الخشوع غير مظهر لمذهبه وكان من أكابر الشراة وفقهائهم وله كتاب الجامع في الفقه وكتاب أحكام الله وكتاب الإمامة وكتاب الوعد والوعيد وكتاب التحريم والتحليل {cite:fihrist-ibn-al-nadim p. 330}."
  en: "Abu al-Qasim al-Hadid — the ascetic Khariji jurist who hid his madhhab {cite:fihrist-ibn-al-nadim}"
  fr: "Abu al-Qasim al-Hadid — le juriste kharijite ascète qui cachait sa doctrine {cite:fihrist-ibn-al-nadim}"
  es: "Abu al-Qasim al-Hadid - el jurista asceta Khariji que ocultó su madhab {cita:fihrist-ibn-al-nadim}"
  ur: "ابو القاسم الحدید - ایک متعصب خارجی فقیہ جس نے اپنے مذھب کو چھپا رکھا تھا۔"
  tr: "İbn el-Nadim, Ebu el-Kasım el-Hadid ile görüşmüştür. Kendisi, dışarıdan dindar görünen, zühd sahibi bir kişiydi ve doktrinini açıkça dile getirmezdi. Şurat'ın en önde gelen âlim ve hukukçularından biriydi. Fıkıh, Allah'ın hükümleri, İmamet, Vaat ve Tesadüf ile Yasak ve İzin üzerine kitapları vardı. {cite:fihrist-ibn-al-nadim s. 330}"
  id: "Abu al-Qasim al-Hadid pernah dilihat oleh Ibn al-Nadim. Beliau adalah seorang pertapa, tampak saleh secara lahiriah, dan tidak secara terbuka menyatakan doktrinnya. Beliau adalah salah satu ulama dan ahli hukum terkemuka di Shurat. Beliau memiliki sebuah buku tentang fiqih, sebuah buku tentang hukum Allah, sebuah buku tentang Imamah, sebuah buku tentang janji dan ancaman, dan sebuah buku tentang larangan dan izin. {cite:fihrist-ibn-al-nadim p. 330}."
