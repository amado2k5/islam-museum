summary:
  ar: "مؤرخ مغربي من سلا (1835–1897)، يُعد أكبر مؤرخي المغرب في القرن التاسع عشر؛ تولى مناصب مخزنية في الأحباس والمراسي، وألف «الاستقصا لأخبار دول المغرب الأقصى» في تاريخ المغرب والغرب الإسلامي، وله «تعظيم المنة بنصرة السنة» في نقد البدع والتصوف عصره."
  en: "Moroccan historian from Salé (1835–1897), considered the greatest Moroccan historian of the 19th century. He held Makhzen posts over endowments and ports, and wrote the Kitab al-Istiqsa, a multi-volume history of Morocco and the Islamic west, and Ta'zim al-minna bi-nusrat al-sunna, against the innovations and Sufism of his time."
  ur: "سلا کے مراکشی مؤرخ (1835–1897)، جنہیں انیسویں صدی کا مراکش کا سب سے بڑا مؤرخ سمجھا جاتا ہے؛ مخزن کے اوقاف و بندرگاہوں کے عہدوں پر فائز رہے، اور «الاستقصا لأخبار دول المغرب الأقصى» نامی کثیر الجلدی تاریخِ مراکش لکھی، نیز اپنے دور کی بدعات و تصوف کے رد میں «تعظيم المنة بنصرة السنة» تصنیف کی۔"
