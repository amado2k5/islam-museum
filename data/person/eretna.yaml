  en: Eretna
summary:
  ar: "ارتنا، أمير من أمراء المغل ومؤسس دولة بني ارتنا ببلاد الروم؛ ولي الشحنة على بلاد الروم في أواخر دولة بني هلاكو، فلما اضطرب أمرهم بعد مهلك أبي سعيد استقل بكرسي مملكته بقيصرية وسيواس وضم أعمالها من أقصر وملطية وسميساط وما استضافه من بلاد الأرمن، وورث عنه ولده علاء الدين أرتنا ثم أحفاده حتى انقرض ملكهم في دول التركمان."
  en: "Eretna, a Mongol commander and founder of the Eretnid state in Rum; holder of the shihna governorship of the Rum lands in the Ilkhanids' last days — when their order collapsed after Abu Sa'id's death he seized his kingdom's throne at Kayseri and Sivas, annexing Aqsaray, Malatya, Samsat and the Armenian lands, and his son Ala al-Din Eretna and grandsons held it until the Turkmen states ended their line."
