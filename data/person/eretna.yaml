summary:
  ar: "ارتنا، أمير من أمراء المغل ومؤسس دولة بني ارتنا ببلاد الروم؛ ولي الشحنة على بلاد الروم في أواخر دولة بني هلاكو، فلما اضطرب أمرهم بعد مهلك أبي سعيد استقل بكرسي مملكته بقيصرية وسيواس وضم أعمالها من أقصر وملطية وسميساط وما استضافه من بلاد الأرمن، وورث عنه ولده علاء الدين أرتنا ثم أحفاده حتى انقرض ملكهم في دول التركمان."
  en: "Eretna, a Mongol commander and founder of the Eretnid state in Rum; holder of the shihna governorship of the Rum lands in the Ilkhanids' last days — when their order collapsed after Abu Sa'id's death he seized his kingdom's throne at Kayseri and Sivas, annexing Aqsaray, Malatya, Samsat and the Armenian lands, and his son Ala al-Din Eretna and grandsons held it until the Turkmen states ended their line."
  es: "Eretna, comandante mongol y fundador del estado eretní en Rum, ostentó el cargo de gobernador de las tierras de Rum en los últimos días de los Iljánidas. Cuando su orden se derrumbó tras la muerte de Abu Sa'id, se apoderó del trono de su reino en Kayseri y Sivas, anexionándose Aqsaray, Malatya, Samsat y las tierras armenias, y su hijo Ala al-Din Eretna y sus nietos lo mantuvieron hasta que los estados turcomanos pusieron fin a su dinastía."
  fr: "Eretna, commandant mongol et fondateur de l'État éretnide de Roum, détenteur du gouvernement de la shihna sur les terres de Roum à la fin de l'empire ilkhanide – lorsque leur ordre s'effondra après la mort d'Abu Sa'id, il s'empara du trône de son royaume à Kayseri et Sivas, annexant Aqsaray, Malatya, Samsat et les terres arméniennes, et son fils Ala al-Din Eretna et ses petits-fils le conservèrent jusqu'à la fin de la lignée des États turkmènes."
