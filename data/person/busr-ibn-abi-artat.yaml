label: { ar: "بسر بن أبي أرطاة" }
summary:
  ar: "بعثه معاوية إلى البصرة في رجب سنة إحدى وأربعين بعد الصلح مع الحسن، وزياد متحصّن بفارس {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. بعثه معاوية سنة أربعين في ثلاثة آلاف إلى المدينة فتهدّد أهلها من المنبر حتى بايعوا، ثم مضى إلى مكة واليمن، فقتل بالمدينة وبين المسجدين خلقاً من خزاعة وغيرهم، وبالجرف من همدان، وبصنعاء من الأبناء، وقتل ابني عبيد الله بن العباس عبد الرحمن وقثم {cite:muruj-mari-2005 juz' 3 p. 25}. وذكر المسعودي أن عليّاً دعا عليه حتى ذهب عقله، وأنه مات في خلافة الوليد بن عبد الملك سنة ست وثمانين، وهو ما ورد في الكتاب بعبارة المؤلف {cite:muruj-mari-2005 juz' 3 p. 135-136}."
