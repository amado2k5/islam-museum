id: person/busr-ibn-abi-artat
class: person
label: { ar: "بسر بن أبي أرطاة" }
summary:
  ar: "بعثه معاوية إلى البصرة في رجب سنة إحدى وأربعين بعد الصلح مع الحسن، وزياد متحصّن بفارس {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. بعثه معاوية سنة أربعين في ثلاثة آلاف إلى المدينة فتهدّد أهلها من المنبر حتى بايعوا، ثم مضى إلى مكة واليمن، فقتل بالمدينة وبين المسجدين خلقاً من خزاعة وغيرهم، وبالجرف من همدان، وبصنعاء من الأبناء، وقتل ابني عبيد الله بن العباس عبد الرحمن وقثم {cite:muruj-mari-2005 juz' 3 p. 25}. وذكر المسعودي أن عليّاً دعا عليه حتى ذهب عقله، وأنه مات في خلافة الوليد بن عبد الملك سنة ست وثمانين، وهو ما ورد في الكتاب بعبارة المؤلف {cite:muruj-mari-2005 juz' 3 p. 135-136}."
  tr: "Muaviye, Hasan ile barış yaptıktan sonra kırk birinci yılda onu Rajab'da Basra'ya gönderdi ve Ziyad Pers'te tahkim edildi {cite:tabari-tarikh-abu-al-fadl j. 5 s.168}. Muaviye onu kırk yılda üç bin kişiyle birlikte Medine'ye gönderdi; burada halkı vaaz kürsüsünden tehdit edilip itaat edene kadar tehdit edildi. Sonra Mekke ve Yemen'e gitti; burada Medine'de ve iki cami arasında Huza'ah ve diğerleri tarafından, Hamdan'daki Al-Jurf'ta ve Sana'a'da 'Ubeyd Allah ibn al-Abbas Abd al-Rahman ve Qutham'ın oğulları tarafından öldürüldü {cite:muruj-mari-2005 juz' 3 s. 25}. Al-Mas'udi, Ali'nin kendisine karşı dua ettiğini, Ali'nin aklını kaybedip öldüğünü, 86 yılında, 86. yılda el-Velid bin Abdülmelik'in halifeliği sırasında {cite:muruj-mari-2005 juz' 3 s. 135-136} adlı kitapta belirtildiği gibi, bu dua edildiğini belirtmiştir."
  id: "Muawiyah mengirimnya ke Basra di Rajab pada tahun empat puluh satu setelah berdamai dengan Hasan, dan Ziyad diperkuat di Persia {kutip:Tabari-Tarikh-abu-al-Fadl J.5 hlm.168}. Muawiya mengirimnya pada tahun empat puluh bersama tiga ribu ke Madinah, di mana penduduknya diancam dari mimbar hingga mereka mengucapkan sumpah setia. Kemudian ia pergi ke Mekah dan Yaman, di mana ia dibunuh di Madinah dan antara dua masjid oleh orang-orang dari Khuza'ah dan lainnya, di Al-Jurf di Hamdan, dan di Sana'a oleh putra-putra 'Ubayd Allah ibn al-Abbas Abd al-Rahman dan Qutham {cite:muruj-mari-2005 juz' 3 hlm. 25}. Al-Mas'udi menyebutkan bahwa Ali berdoa melawannya hingga ia kehilangan akal dan meninggal selama kekhalifahan al-Walid ibn Abd al-Malik pada tahun delapan puluh enam, sebagaimana disebutkan dalam buku {cite:muruj-mari-2005 juz' 3 hlm. 135-136}."
