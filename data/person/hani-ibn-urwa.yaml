id: person/hani-ibn-urwa
class: person
label: { ar: "هانئ بن عروة المرادي" }
summary:
  ar: "من أهل الكوفة أجار مسلم بن عقيل في داره، فقتله مولى لعبيد الله بن زياد بالسيف في السوق {cite:tabari-tarikh-abu-al-fadl j.5 p.362} {cite:tabari-tarikh-abu-al-fadl j.5 p.379}. وآوى مسلم بن عقيل فسأله ابن زياد عنه فأنكره فأغلظ له القول فقال هانئ إن لزياد أبيك عندي بلاء حسناً وأنا أحب مكافأته به فهل لك في خير تشخص إلى أهل الشام، فضرب وجهه بقضيب حتى كسر أنفه ونثر لحم وجنته، وشهد شريح عند أصحابه أنه حي لم يقتل فانصرفوا {cite:muruj-al-dhahab p. 56}"
  tr: "Kufe halkından Müslüm bin Akil onu evinde kiralamış, ancak Übeydullah ibn Ziyad'ın özgür bir adamı tarafından pazarda kılıçla öldürülmüştür {alıntı:Tabari-Tarikh-Abu-al-Fadl J.5 s.362} {Kaynak:Tabari-Tarikh-Abu-al-Fadl J.5 s.379}. Müslüman ibn Aqil onu sığınağa aldı ve İbn Ziyad ona hakkında sordu, fakat Zyad inkar etti ve sert konuştu. Hani dedi ki, 'Baban Ziyad'ın benimle iyi bir işi var ve ona bunu ödüllendirmek istiyorum. El-Şam halkına gitmen senin için bir iyilik var mı? Yüzüne bir çubukla vurdu, burnu kırıldı ve yanaklarının eti dağıldı. Şurayh yoldaşlarına hayatta olduğunu ve öldürülmediğini söyledi, böylece onlar gitti. {cite:Muruj-al-Dhahab s. 56}"
  id: "Dari rakyat Kufa, Muslim ibn Aqil menyewakannya di rumahnya, tetapi ia dibunuh oleh seorang mantan Ubaydullah ibn Ziyad dengan pedang di pasar {cite:tabari-tarikh-abu-al-fadl j.5 hlm.362} {cite:tabari-tarikh-abu-al-fadl j.5 hlm.379}. Muslim ibn Aqil membawanya berlindung, dan Ibn Ziyad menanyakan tentangnya, tetapi ia menyangkal dan berbicara dengan kasar. Hani berkata, 'Ayahmu Ziyad memiliki perbuatan baik padaku, dan aku ingin memberinya ganjaran itu. Apakah ada kebaikan bagimu untuk pergi kepada orang-orang al-Sham? Ia memukul wajahnya dengan tongkat hingga hidungnya patah dan daging pipinya berantakan. Shurayh bersaksi kepada para sahabatnya bahwa ia masih hidup dan tidak dibunuh, maka mereka pergi. {cite:muruj-al-dhahab hlm. 56}"
