label: { ar: "هانئ بن عروة المرادي" }
summary:
  ar: "من أهل الكوفة أجار مسلم بن عقيل في داره، فقتله مولى لعبيد الله بن زياد بالسيف في السوق {cite:tabari-tarikh-abu-al-fadl j.5 p.362} {cite:tabari-tarikh-abu-al-fadl j.5 p.379}. وآوى مسلم بن عقيل فسأله ابن زياد عنه فأنكره فأغلظ له القول فقال هانئ إن لزياد أبيك عندي بلاء حسناً وأنا أحب مكافأته به فهل لك في خير تشخص إلى أهل الشام، فضرب وجهه بقضيب حتى كسر أنفه ونثر لحم وجنته، وشهد شريح عند أصحابه أنه حي لم يقتل فانصرفوا {cite:muruj-al-dhahab p. 56}"
