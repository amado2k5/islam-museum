summary:
  ar: "شيخ المشايخ برهان الدين ابن عون المعري الدمشقي الحنفي مفتيهم، ولد سنة ست وثلاثين وثمانمائة، واشتغل على الشمس السعدي والبكري وسمع على السخاوي، وكان ممن اقتبس من آداب شيخنا أحمد بن قدس سمته ووقاره وشيء من فضائله بشدة تأدبه به وكثرة مصاحبته له وملازمته إياه؛ توفي قبلي باب الفراديس إلى الجنوب سنة ست عشرة وتسعمائة {cite:shadharat-dhahab p. 467}."
  en: "Damascus's Hanafi mufti (b. 836) — pupil of al-Sa'di and al-Bakri, audited al-Sakhawi, and 'drew from the manners of our shaykh Ibn Qiddis his dignity and some of his virtues' through long companionship; buried before Bab al-Faradis, d. 916 {cite:shadharat-dhahab p. 467}."
