summary:
  ar: "شيخ المشايخ برهان الدين ابن عون المعري الدمشقي الحنفي مفتيهم، ولد سنة ست وثلاثين وثمانمائة، واشتغل على الشمس السعدي والبكري وسمع على السخاوي، وكان ممن اقتبس من آداب شيخنا أحمد بن قدس سمته ووقاره وشيء من فضائله بشدة تأدبه به وكثرة مصاحبته له وملازمته إياه؛ توفي قبلي باب الفراديس إلى الجنوب سنة ست عشرة وتسعمائة {cite:shadharat-dhahab p. 467}."
  en: "Damascus's Hanafi mufti (b. 836) — pupil of al-Sa'di and al-Bakri, audited al-Sakhawi, and 'drew from the manners of our shaykh Ibn Qiddis his dignity and some of his virtues' through long companionship; buried before Bab al-Faradis, d. 916 {cite:shadharat-dhahab p. 467}."
  es: "Muftí hanafi de Damasco (n. 836), discípulo de al-Sa'di y al-Bakri, auditó a al-Sakhawi y \"extrajo de los modales de nuestro shaykh Ibn Qiddis su dignidad y algunas de sus virtudes\" a través de una larga amistad; enterrado frente a Bab al-Faradis, m. 916 {cita: shadharat-dhahab p. 467}."
  fr: "Le mufti hanafite de Damas (né en 836) — élève d'al-Sa'di et d'al-Bakri, auditeur d'al-Sakhawi, et « a tiré des manières de notre cheikh Ibn Qiddis sa dignité et certaines de ses vertus » grâce à une longue camaraderie; enterré devant Bab al-Faradis, mort en 916 {cite: shadharat-dhahab p. 467}."
  ur: "دمشق کے حنفی مفتی ⁦(متوفی 836)⁩ - السعدی اور البکری کے شاگرد، الصخاوی کی تحقیق کی، اور طویل صحبت کے ذریعے 'ہمارے شیخ ابن قدیس کے آداب اور ان کے بعض فضائل سے اخذ کیا'؛ باب الفرادیس سے پہلے دفن کیا گیا۔ 916 {حوالہ: شدھارت ذہاب ص۔ 467}۔"
  tr: "Şeyhlerin şeyhi Burhan al-Din bin Awn al-Ma'arri al-Dimashqi al-Hanafi onların müftüsüydü. 836 Hicri yılında doğdu. Al-Shams al-Saadi ve al-Bakri ile birlikte eğitim aldı ve al-Sakhawi'den dinledi. Şeyh Ahmed bin Quds'un görgü kurallarından, onurundan ve bazı erdemlerinden büyük saygı duyup eşlik edenlerden biriydi; 1916 yılında güneyde Bab al-Faradis önünde vefat etti {cite:shadharat-dhahab, s. 467}."
  id: "Sheikh para Sheikh, Burhan al-Din ibn Awn al-Ma'arri al-Dimashqi al-Hanafi, adalah mufti mereka. Ia lahir pada tahun 836 H. Ia belajar di bawah bimbingan Al-Shams al-Saadi dan al-Bakri serta mendengar dari al-Sakhawi. Ia termasuk di antara mereka yang meminjam dari adat Sheikh Ahmad ibn Quds kita, martabatnya, dan beberapa kebajikan yang sangat ia hormati dan iringinya; ia meninggal di hadapan Bab al-Faradis di selatan pada tahun 1916 {cite:shadharat-dhahab, hlm. 467}."
