summary:
  ar: "السلطان سليمان الثاني؛ ولد عام ١٠٥٢هـ وتولى الحكم بعد أخيه محمد الرابع عام ١٠٩٩هـ. استمر التدهور في عهده فاغتصبت النمسا مواقع كثيرة ومنها بلغراد عام ١٠٩٩هـ، واحتلت البندقية سواحل دالماسيا وبعض أماكن اليونان، وقيّض الله للدولة الصدر الأعظم مصطفى بن محمد كوبريللي الذي سار على نهج أبيه، وسمح للنصارى في استانبول ببناء ما تهدم من كنائسهم وأحسن إليهم وعاقب بأشد العقاب كل من عرض لهم في إقامة شعائر دينهم، حتى ثار أهالي المورة على البنادقة الكاثوليك وطردوا جيشها ودخلوا في حماية الدولة العثمانية مختارين طائعين لعدم تعرضها لديانتهم {cite:dawlat-uthmaniyya-salabi p. 308-309}."
  en: "Sulayman II (r. 1099–1102/1687–1691) — reign of retreat: Belgrade lost to Austria, Dalmatia and Greece to Venice; his vizier Mustafa Köprülü's protection of Istanbul's Christians prompted the Morean Greeks to expel the Venetians and choose Ottoman rule {cite:dawlat-uthmaniyya-salabi p. 308-309}."
