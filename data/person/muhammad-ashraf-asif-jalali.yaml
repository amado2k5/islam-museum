summary:
  ar: "عالم دين وزعيم حركي باكستاني مقيم في لاهور؛ مؤسس تحريك صراط مستقيم ورئيس تحريك لبيك يا رسول الله وجناحها السياسي تحريك لبيك إسلام، وهي تنظيمات منفصلة عن تحريك لبيك باكستان التي أسسها خادم حسين رضوي."
  en: "Pakistani scholar and movement leader based in Lahore; founder of Tehreek-e-Sirat-e-Mustaqeem and chairman of Tehreek Labbaik Ya Rasool Allah and its political wing Tehreek Labbaik Islam — organisations distinct from Khadim Hussain Rizvi's Tehreek-e-Labbaik Pakistan."
  ur: "لاہور میں مقیم پاکستانی عالم دین اور تحریکی رہنما؛ تحریک صراط مستقیم کے بانی اور تحریک لبیک یا رسول اللہ اور اس کے سیاسی ونگ تحریک لبیک اسلام کے چیئرمین۔"
