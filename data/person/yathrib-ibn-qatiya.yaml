class: person
label: { ar: "يثرب بن قاتية", en: "Yathrib ibn Qatiya", es: "Yathrib ibn Qatiya", fr: "Yathrib ibn Qatiya", ur: "یثرب بن قتیہ" }
summary:
  ar: "يثرب بن قاتية بن مهليل بن أرم بن عبيل، نزل بالمدينة هو وولده ومن تبعه فسميت به يثرب، فهلكوا ببعض غوائل الدهر وآفاته وفي ذلك رثاهم شاعرهم {cite:muruj-al-dhahab p. 458}."
  en: "Yathrib ibn Qatiya ibn Mahlil — the eponym of Medina, who settled it with his sons and followers until some calamity destroyed them, mourned in their poets' verse {cite:muruj-al-dhahab p. 458}."
  es: "Yathrib ibn Qatiya ibn Mahlil — epónimo de Medina, quien se estableció allí con sus hijos y seguidores hasta que alguna calamidad los destruyó, lo lamentó en los versos de sus poetas {cite:muruj-al-dhahab p. 458}."
  fr: "Yathrib ibn Qatiya ibn Mahlil — l'éponyme de Médine, qui s'y installa avec ses fils et ses disciples jusqu'à ce qu'une calamité les détruise, le pleura dans les vers de leurs poètes {cite:muruj-al-dhahab p. 458}."
  ur: "یثرب بن قتیہ ابن محلل - مدینہ کا تخلص، جس نے اسے اپنے بیٹوں اور پیروکاروں کے ساتھ آباد کیا یہاں تک کہ کسی آفت نے انہیں تباہ کر دیا، اپنے شعروں کی آیت میں ماتم کیا۔ 458}۔"
  tr: "Yathrib ibn Qatiyyah ibn Muhallil ibn Aram ibn Abil, çocukları ve onu takip edenlerle birlikte Medine'ye yerleşti, bu yüzden buraya Yathrib adı verildi. Zamanın bazı felaketleri ve sıkıntıları nedeniyle hayatını kaybettiler ve şairleri onları yas tuttu {atıf:muruj-al-dhahab, s. 458}."
  id: "Yathrib ibn Qatiyyah ibn Muhallil ibn Aram ibn Abil menetap di Madinah bersama anak-anaknya dan mereka yang mengikutinya, sehingga tempat itu dinamai Yathrib. Mereka meninggal karena beberapa malapetaka dan penderitaan waktu, dan dalam hal itu penyair mereka berduka {cite:muruj-al-dhahab, hlm. 458}."
