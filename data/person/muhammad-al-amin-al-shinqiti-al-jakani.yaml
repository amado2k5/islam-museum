summary:
  ar: "مفسر وأصولي موريتاني (1325–1393هـ) من قبيلة الجكنيين، صاحب «أضواء البيان». ولد عند ماء «تنبه» من أعمال كيفا، ونشأ يتيمًا في بيت أخواله، وحفظ القرآن في العاشرة، ودرس الفقه المالكي والعربية والأصول، وتولى في بلاده التدريس والفتيا والقضاء؛ ثم خرج حاجًّا سنة 1367هـ واستقر بالمدينة، ودرّس التفسير في المسجد النبوي، ثم في معاهد الرياض وكلياتها، ثم في الجامعة الإسلامية بالمدينة منذ 1381هـ. توفي بمكة ضحى الخميس 17 ذي الحجة 1393هـ، ودفن بالمعلاة."
  en: "Mauritanian exegete and legal theorist (1325–1393 AH) of the Jakani tribe, author of Adwa' al-Bayan. Born at the water called Tanba in the district of Kiffa, he grew up an orphan in his maternal uncles' household, memorised the Qur'an at ten, studied Maliki law, Arabic and legal theory, and taught, gave fatwas and judged at home; he left for the hajj in 1367 AH and settled in Medina, teaching tafsir in the Prophet's Mosque, then in the institutes and colleges of Riyadh, then at the Islamic University of Medina from 1381 AH. He died in Mecca on the morning of Thursday 17 Dhu al-Hijja 1393 AH and was buried at al-Ma'la."
  ur: "موریتانیہ کے مفسر اور اصولی (1325–1393ھ)، قبیلۂ جکنیین سے، «اضواء البیان» کے مصنف۔ کیفا کے علاقے میں «تنبہ» نامی چشمے پر پیدا ہوئے، یتیمی میں اپنے ماموؤں کے گھر پلے، دس برس کی عمر میں قرآن حفظ کیا، مالکی فقہ، عربی اور اصول پڑھے، اور اپنے وطن میں تدریس، افتا اور قضا انجام دی؛ 1367ھ میں حج کو نکلے اور مدینہ میں بس گئے، مسجدِ نبوی میں تفسیر پڑھائی، پھر ریاض کے معاہد و کلیات میں، پھر 1381ھ سے مدینہ کی جامعہ اسلامیہ میں۔ جمعرات 17 ذی الحجہ 1393ھ کی چاشت کو مکہ میں وفات پائی اور معلاۃ میں دفن ہوئے۔"
born: { hijri: "1325", edtf: "1907/1908", calendar: gregorian, precision: year, status: historical, derived: true, note: "«وُلد الشيخ سنة 1325 عند ماء يسمى تنبه من أعمال كيفا من موريتانيا» {cite:athar-shinqiti-adwa-ataat-2019-v1 p.19}؛ ويقول المشرف «المولود سنة 1325 على الأرجح» {cite:athar-shinqiti-adwa-ataat-2019-v1 p.7}؛ التحويل مشتق.", sources: [source/athar-shinqiti-adwa-ataat-2019-v1] }
