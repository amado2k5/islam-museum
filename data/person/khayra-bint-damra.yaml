summary:
  ar: "خيرة بنت ضمرة القشيرية امرأة المهلب وأم أبي عيينة ابنه؛ كان لها خيركان ومهلبان الذي وهبه لها المهلب ويقال كان لها فنسب إلى المهلب."
  en: "Khayra bint Damra al-Qushayriyya, al-Muhallab's wife and Abu Uyayna's mother — hers were Khayrakān and Mahallabān, which al-Muhallab gave her, or which was hers and took his name."
  es: "Khayra bint Damra al-Qushayriyya, esposa de al-Muhallab y madre de Abu Uyayna, cuyos nombres eran Khayrakān y Mahallabān, que al-Muhallab le dio, o que eran suyos y tomaron su nombre."
  fr: "Khayra bint Damra al-Qushayriyya, l'épouse d'al-Muhallab et la mère d'Abu Uyayna — les siens étaient Khayrakān et Mahallabān, qu'al-Muhallab lui avait donnés, ou qui étaient les siens et avaient pris son nom."
  ur: "خیرہ بنت دمرہ القشیریہ، المحلب کی بیوی اور ابو عیینہ کی والدہ - ان کا نام خیرکان اور محلبان تھا، جو المحلب نے انہیں دیا تھا، یا جو ان کا تھا اور اس کا نام لیا تھا۔"
  tr: "Khaira bint Damrah al-Qushayriyyah, el-Muhallab'ın eşi ve oğlu Ebu Uyaynah'ın annesi; Khayrkan ve Muhallab tarafından kendisine verilen Muhallab vardı ve onun kendisine ait olduğu söylenir, bu yüzden Muhallab el-Muhallab'a atfedilmiştir."
  id: "Khaira bint Damrah al-Qushayriyyah, istri al-Muhallab dan ibu dari putranya Abu Uyaynah; ia memiliki Khayrkan dan Muhallab, yang diberikan kepadanya oleh al-Muhallab, dan dikatakan bahwa ia adalah miliknya, sehingga ia dikaitkan dengan al-Muhallab."
