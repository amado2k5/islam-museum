label: { ar: "محمود بن سبكتكين الغزنوي", en: "Mahmud of Ghazna" }
summary:
  ar: "يمين الدولة وأمين الملة أبو القاسم محمود بن سبكتكين سلطان غزنة؛ لقبه الخليفة القادر بالله بيمين الدولة وأمين الملة، وامتثل استتابة القادر للمبتدعة سنة ثمان وأربعمائة فاستن في أعماله بخراسان وغيرها في قتل المعتزلة والرافضة والإسماعيلية والقرامطة والجهمية والمشبهة وصلبهم وحرقهم وأمر بلعنهم على المنابر وطرد أهل البدع عن ديارهم {cite:muntazam-ibn-al-jawzi j.7 p.284}."
  en: "Yamin al-Dawla wa-Amin al-Milla — Sultan Mahmud ibn Sabuktigin of Ghazna, bearer of the caliph al-Qadir's honorifics, who emulated the 408 recantation decree in Khurasan with killing, crucifixion, burning and expulsion of the 'innovators' {cite:muntazam-ibn-al-jawzi j.7 p.284}."
