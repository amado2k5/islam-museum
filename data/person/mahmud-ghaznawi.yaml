class: person
label: { ar: "محمود بن سبكتكين الغزنوي", en: "Mahmud of Ghazna" , ur: "محمود غزنوی", es: "Mahmud of Ghazna", fr: "Mahmud of Ghazna"}
summary:
  ar: "يمين الدولة وأمين الملة أبو القاسم محمود بن سبكتكين سلطان غزنة؛ لقبه الخليفة القادر بالله بيمين الدولة وأمين الملة، وامتثل استتابة القادر للمبتدعة سنة ثمان وأربعمائة فاستن في أعماله بخراسان وغيرها في قتل المعتزلة والرافضة والإسماعيلية والقرامطة والجهمية والمشبهة وصلبهم وحرقهم وأمر بلعنهم على المنابر وطرد أهل البدع عن ديارهم {cite:muntazam-ibn-al-jawzi j.7 p.284}. وفي كتبه إلى الخليفة وصف فتح الري سنة ٤٢٠ وما أُحرق فيها من كتب المعتزلة والفلاسفة والرافضة تحت المصابين {cite:muntazam-ibn-al-jawzi j.8 p.380-383}، وكتابه في حملة الصومنات وأصنامها الموقوفة على عشرة آلاف قرية وألف برهمي {cite:muntazam-ibn-al-jawzi j.8 p.371-372}؛ ومات يوم الخميس لسبع بقين من ربيع الآخر سنة ٤٢١ وله ثلاث وستون سنة وملكه ثلاث وثلاثون سنة، ومن مشهد مرضه أنه أخرج جواهره فقيل إنها سبعون رطلًا فرماها ثم أمسكها؛ وخلفه ابنه مسعود {cite:muntazam-ibn-al-jawzi j.8 p.394-396}."
  en: "Yamin al-Dawla wa-Amin al-Milla — Sultan Mahmud ibn Sabuktigin of Ghazna, bearer of the caliph al-Qadir's honorifics, who emulated the 408 recantation decree in Khurasan with killing, crucifixion, burning and expulsion of the 'innovators' {cite:muntazam-ibn-al-jawzi j.7 p.284}."
  ur: "سبکتگین کے بیٹے اور غزنہ کے سلطان، جنہیں قادر باللہ نے یمین الدولہ اور امین الملہ کے القاب دیے؛ ان کا دور خراسان، رے اور ہندوستان کی مہمات سے وابستہ ہے۔ {cite:muntazam-ibn-al-jawzi}"
  es: "Yamin al-Dawla wa-Amin al-Milla - Sultán Mahmud ibn Sabuktigin de Ghazna, portador de los honoríficos del califa al-Qadir, quien emuló el decreto de retractación de 408 en Khurasan con el asesinato, la crucifixión, la quema y la expulsión de los 'innovadores' {cita:muntazam-ibn-al-jawzi j.7 p.284}."
  fr: "Yamin al-Dawla wa-Amin al-Milla — Sultan Mahmud ibn Sabuktigin de Ghazna, porteur des titres honorifiques du calife al-Qadir, qui a imité le décret de rétractation 408 du Khurasan avec le meurtre, la crucifixion, l'incendie et l'expulsion des « innovateurs » {cite: muntazam-ibn-al-jawzi j.7 p.284}."
  tr: "Yamin al-Dawla ve Amin al-Milla Gazni Sultanı Ebu el-Kasım Mahmud ibn Sabuktakin; Halife el-Kadir Billah ona Yamin al-Dawla ve Amin al-Milla unvanlarını verdi. 408 Hicri yılında el-Kadir'in yenilikçiler reformuna uydu ve Horasan ile başka yerlerdeki eserlerinde Mu'taziller, Rafidah, İsmaililer, Karmatlılar, Jahmiyye ve Mushbibiyya'yı öldürdü, çarmıha gerdi ve yaktı, vaaz kürsülerine lanet etti ve yenilikçileri evlerinden kovdu {atıf:Muntazam-ibn-al-Jawzi j.7 s.284}. Halifeye yazdığı mektuplarda, 420 Hicri yılında Rayı'nın fethini ve Mu'tazila, filozoflar ve Rafidah arasında mağdurlar altında nelerin yakıldığını, anlattı {atıf: Muntazam-ibn-al-jawzi J.8 s.380-383} ve Sawmanat seferi ile onların putları üzerine kitabı, on bin köy ve bin Brahmi bağışladı {atıf:Muntazam-ibn-al-jawzi j.8 s.371-372}; 421 yılında, Rabi'al-Thani'nin yedinci günü Perşembe günü, altmış üç yaşında öldü ve otuz üç yıl hüküm sürdü. Hastalığından, yetmiş pound olduğu söylenen mücevherlerini çıkardı ve sonra geri çekti; yerine oğlu Mas'ud geçti {atıf:Muntazam-ibn-al-jawzi J.8 s.394-396}."
  id: "Yamin al-Dawla dan Amin al-Milla Abu al-Qasim Mahmud ibn Sabuktakin, Sultan Ghazni; Khalifah al-Qadir Billah memberinya gelar Yamin al-Dawla dan Amin al-Milla. Ia mematuhi reformasi para inovator oleh al-Qadir pada tahun 408 H, dan dalam karya-karyanya di Khorasan dan tempat lain, ia membunuh Mu'tazilit, Rafidah, Ismaili, Qarmatian, Jahmiyya, dan Mushbibiyya, menyalib dan membakar mereka, memerintahkan kutukan mereka di mimbar, dan mengusir para inovator dari rumah mereka {cite:muntazam-ibn-al-jawzi j.7 hlm.284}. Dalam surat-suratnya kepada khalifah, ia menggambarkan penaklukan Rayy pada tahun 420 H dan apa yang dibakar di dalamnya di antara Mu'tazila, filsuf, dan Rafidah di bawah kaum yang menderita {cite:Muntazam-ibn-al-jawzi J.8 hlm.380-383}, serta bukunya tentang kampanye Sawmanat dan arca-arca mereka yang didanai untuk sepuluh ribu desa dan seribu Brahmi {cite:Muntazam-ibn-al-jawzi j.8 hlm.371-372}; ia meninggal pada hari Kamis, tanggal tujuh Rabi' al-Thani tahun 421, pada usia enam puluh tiga tahun dan memerintah selama tiga puluh tahun. Karena sakit, ia mengeluarkan permatanya, yang dikatakan seberat tujuh puluh pound, yang kemudian ia tarik kembali; ia digantikan oleh putranya Mas'ud {cite:Muntazam-ibn-al-jawzi J.8 hlm.394-396}."
