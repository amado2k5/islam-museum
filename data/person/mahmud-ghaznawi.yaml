label: { ar: "محمود بن سبكتكين الغزنوي", en: "Mahmud of Ghazna" , ur: "محمود غزنوی"}
summary:
  ar: "يمين الدولة وأمين الملة أبو القاسم محمود بن سبكتكين سلطان غزنة؛ لقبه الخليفة القادر بالله بيمين الدولة وأمين الملة، وامتثل استتابة القادر للمبتدعة سنة ثمان وأربعمائة فاستن في أعماله بخراسان وغيرها في قتل المعتزلة والرافضة والإسماعيلية والقرامطة والجهمية والمشبهة وصلبهم وحرقهم وأمر بلعنهم على المنابر وطرد أهل البدع عن ديارهم {cite:muntazam-ibn-al-jawzi j.7 p.284}. وفي كتبه إلى الخليفة وصف فتح الري سنة ٤٢٠ وما أُحرق فيها من كتب المعتزلة والفلاسفة والرافضة تحت المصابين {cite:muntazam-ibn-al-jawzi j.8 p.380-383}، وكتابه في حملة الصومنات وأصنامها الموقوفة على عشرة آلاف قرية وألف برهمي {cite:muntazam-ibn-al-jawzi j.8 p.371-372}؛ ومات يوم الخميس لسبع بقين من ربيع الآخر سنة ٤٢١ وله ثلاث وستون سنة وملكه ثلاث وثلاثون سنة، ومن مشهد مرضه أنه أخرج جواهره فقيل إنها سبعون رطلًا فرماها ثم أمسكها؛ وخلفه ابنه مسعود {cite:muntazam-ibn-al-jawzi j.8 p.394-396}."
  en: "Yamin al-Dawla wa-Amin al-Milla — Sultan Mahmud ibn Sabuktigin of Ghazna, bearer of the caliph al-Qadir's honorifics, who emulated the 408 recantation decree in Khurasan with killing, crucifixion, burning and expulsion of the 'innovators' {cite:muntazam-ibn-al-jawzi j.7 p.284}."
  ur: "سبکتگین کے بیٹے اور غزنہ کے سلطان، جنہیں قادر باللہ نے یمین الدولہ اور امین الملہ کے القاب دیے؛ ان کا دور خراسان، رے اور ہندوستان کی مہمات سے وابستہ ہے۔ {cite:muntazam-ibn-al-jawzi}"
