summary:
  ar: "مغنية وممثلة تركية للموسيقى الكلاسيكية التركية، وُلدت في إسطنبول سنة 1952 باسم بولنت إركوتش، وأجرت جراحة لتصحيح الجنس في لندن سنة 1981، ومُنعت من المسارح التركية طوال الثمانينيات، ثم عادت سنة 1988 لتصبح من أشهر مغنيات تركيا، لُقبت بـ«أبلة» ثم بـ«الديفا»، وأصدرت أكثر من ثلاثين ألبوما."
  en: "Turkish singer of Turkish classical music and actress, born in Istanbul in 1952 as Bülent Erkoç. She underwent gender reassignment surgery in London in 1981 and was banned from Turkish stages through the 1980s, returning in 1988 to become one of Turkey's most popular singers — known as 'Abla' (Big Sister) and later 'the Diva' — with more than thirty albums."
  ur: "ترکی کلاسیکی موسیقی کی گلوکارہ اور اداکارہ، جو 1952 میں استنبول میں بولنت ارکوچ کے نام سے پیدا ہوئیں۔ انہوں نے 1981 میں لندن میں جنس کی تبدیلی کی سرجری کرائی، اسی کی دہائی میں ترک سٹیج سے روکی گئیں، اور 1988 میں واپس آ کر ترکی کی مقبول ترین گلوکاراؤں میں شامل ہو گئیں؛ تیس سے زائد البمز جاری کیے۔"
