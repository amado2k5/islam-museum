summary:
  ar: "آخر سلاطين دارفور من الأسرة الكيراوية (توفي 1916): ولي العرش سنة 1891، وخضع للمهديين في الخرطوم ثم فرّ قبيل معركة أم درمان سنة 1898 فاستعاد سلطنته المستقلة، وحكم ثمانية عشر عاما إلى أن غزته بريطانيا بعد إعلانه التأييد للدولة العثمانية في الحرب العالمية الأولى فقُتل في المعركة في 6 نوفمبر 1916 ودُمجت دارفور في السودان الأنجلو-المصري."
  en: "The last sultan of Darfur of the Keira dynasty (died 1916): he took the throne in 1891, submitted for years to the Mahdist state at Omdurman, fled home just before the battle of Omdurman in 1898 and restored the independent sultanate, then ruled for eighteen years until, after his declaration for the Ottoman Empire in the First World War, a British invasion killed him in action on 6 November 1916 and Darfur was absorbed into Anglo-Egyptian Sudan."
  ur: "دارفور کے کیرا خاندان کے آخری سلطان (وفات 1916ء): 1891ء میں تخت پر بیٹھے، برسوں مہدی ریاست کو اومدورمان میں تابع رہے، پھر 1898ء میں ام درمان کی جنگ سے قدرے پہلے فرار ہو کر آزاد سلطنت بحال کی، اور اٹھارہ برس حکومت کی، حتیٰ کہ پہلی عالمی جنگ میں سلطنتِ عثمانیہ کی حمایت کے اعلان کے بعد برطانوی حملے میں 6 نومبر 1916ء کو شہید ہوئے اور دارفور اینگلو-مصری سوڈان میں ضم ہو گیا۔"

