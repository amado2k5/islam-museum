summary:
  ar: "جندب بن عوف بن الحرث بن مالك بن حطيط بن جشم الثقفي، رئيس بني مالك بطن ثقيف؛ اغتنم حرب بني نصر على الأحلاف لضغائن قديمة فحالف بني يربوع على الأحلاف، فكان يوم الطائف أول قتال بينهم فهزمته الأحلاف إلى وادي لحب ومقتلة الأبان {cite:kamil-ibn-al-athir p. 512-513}."
  en: "Jundub ibn Awf, chief of Thaqif's Banu Malik moiety: seizing on the Ahlaf's pasture war with Banu Nasr he allied Yarbu' against them, and lost the first clash — the day of Ta'if — driven into the Lahb valley and the slaughter of the al-Aban defile {cite:kamil-ibn-al-athir p. 512-513}."
  es: "Jundub ibn Awf, jefe de la facción Banu Malik de Thaqif: aprovechando la guerra de pastos de los Ahlaf con los Banu Nasr, se alió con los Yarbu' contra ellos y perdió el primer enfrentamiento —el día de Ta'if— siendo expulsado al valle de Lahb y sufriendo la masacre del desfiladero de al-Aban {cite:kamil-ibn-al-athir p. 512-513}."
  fr: "Jundub ibn Awf, chef de la moitié Banu Malik de Thaqif: profitant de la guerre de pâturage des Ahlaf contre les Banu Nasr, il s'allia à Yarbu' contre eux et perdit le premier affrontement — le jour de Ta'if — repoussé dans la vallée de Lahb et le massacre du défilé d'al-Aban {cite:kamil-ibn-al-athir p. 512-513}."
  ur: "جندب بن عوف، ثقیف کی بنو مالک جماعت کا سردار: بنو نصر کے ساتھ احلاف کی چراگاہوں پر قبضہ کرتے ہوئے اس نے ان کے خلاف یثرب کا اتحاد کیا، اور پہلی جھڑپ - طائف کے دن - وادی لھب میں چلی گئی اور آل ابان کے ناپاک قتل و غارت گری میں ہار گئے۔ 512-513}۔"
  tr: "Banu Malik'in Thaqif kabilesinden reisi Jundub ibn Awf ibn al-Harith ibn Malik ibn Jashm al-Thaqafi; eski kinleri nedeniyle Nasr savaşından faydalandı, bu yüzden Banu Yarbu' ittifaklarla ittifak kurdu. Taif Günü aralarındaki ilk savaştı, ancak müttefikler onu Wadi Lahab wa Muqtalat al-Aban'a yendi {cite:kamil-ibn-al-athir s. 512-513}."
  id: "Jundub ibn Awf ibn al-Harith ibn Malik ibn Hutait ibn Jashm al-Thaqafi, kepala Banu Malik dari suku Thaqif; ia memanfaatkan perang Nasr melawan Sekutu karena dendam lama, sehingga Banu Yarbu' bersekutu dengan aliansi. Hari Ta'if adalah pertempuran pertama antara mereka, tetapi Sekutu mengalahkannya dari Wadi Lahab wa Muqtalat al-Aban {cite:kamil-ibn-al-athir hlm. 512-513}."
