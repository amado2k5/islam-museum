summary:
  ar: "جندب بن عوف بن الحرث بن مالك بن حطيط بن جشم الثقفي، رئيس بني مالك بطن ثقيف؛ اغتنم حرب بني نصر على الأحلاف لضغائن قديمة فحالف بني يربوع على الأحلاف، فكان يوم الطائف أول قتال بينهم فهزمته الأحلاف إلى وادي لحب ومقتلة الأبان {cite:kamil-ibn-al-athir p. 512-513}."
  en: "Jundub ibn Awf, chief of Thaqif's Banu Malik moiety: seizing on the Ahlaf's pasture war with Banu Nasr he allied Yarbu' against them, and lost the first clash — the day of Ta'if — driven into the Lahb valley and the slaughter of the al-Aban defile {cite:kamil-ibn-al-athir p. 512-513}."
