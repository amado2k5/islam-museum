label: { ar: "الخرّيت بن راشد الناجي", en: "al-Khirit ibn Rashid al-Naji" }
summary:
  ar: "الخرّيت بن راشد الناجي من خوارج بني ناجية؛ فارق علياً بعد النهروان وقال لزياد بن خصفة: لم أرضَ صاحبكم إماماً ولا سيرتكم سيرة، فرأيت أن أعتزل وأكون مع من يدعو إلى الشورى؛ قاتل زياداً قتالاً شديداً ثم سار إلى الأهواز فاجتمعت عليه الناجية وعلوج أهلها أرادوا كسر الخراج، فندب علي إليه معقل بن قيس في ألفين {cite:kamil-ibn-al-athir p. 715-716}."
  en: "The Khariji of Banu Najiya who broke with Ali after Nahrawan — 'your man's imamate and conduct alike displease me' — fought Ziyad ibn Khasafa's night-battle, rallied the Najiya and Ahwaz tax-resisters, and met Ma'qil ibn Qays's expedition {cite:kamil-ibn-al-athir p. 715-716}."
