summary:
  ar: طبيب فلسطيني، وُلد في مخيم جباليا سنة 1973. تخصص في طب الأطفال والأطفال حديثي الولادة، فترأس قسم الأطفال في مستشفى كمال عدوان ببيت لاهيا ثم صار مديره في فبراير 2024. قاد المستشفى في حصاره حتى اعتقاله
    في 27 ديسمبر 2024، وما يزال محتجزًا دون تهمة وفق منظمات حقوقية تتابع حالته الصحية.
  en: Palestinian physician, born in the Jabalia refugee camp in 1973. A paediatrician and neonatologist, he headed the paediatric department of Kamal Adwan Hospital in Beit Lahia before becoming its director
    in February 2024. He led the hospital through its siege until his detention on 27 December 2024, and rights organisations report that he remains held without charge while his health deteriorates.
  ur: فلسطینی معالج، 1973 میں جبالیا پناہ گزین کیمپ میں پیدا ہوئے۔ اطفال اور نوزائیدہ بچوں کے ماہر کے طور پر انہوں نے بیت لاہیا کے کمال عدوان اسپتال کے شعبۂ اطفال کی قیادت کی، پھر فروری 2024 میں اس کے منتظم
    بنے۔ انہوں نے 27 دسمبر 2024 کو گرفتاری تک محاصرے میں اسپتال کی قیادت کی، اور حقوقی تنظیموں کے مطابق وہ بغیر کسی الزام کے قید ہیں جب کہ ان کی صحت بگڑ رہی ہے۔
