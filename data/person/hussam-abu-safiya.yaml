summary:
  ar: طبيب فلسطيني، وُلد في مخيم جباليا سنة 1973. تخصص في طب الأطفال والأطفال حديثي الولادة، فترأس قسم الأطفال في مستشفى كمال عدوان ببيت لاهيا ثم صار مديره في فبراير 2024. قاد المستشفى في حصاره حتى اعتقاله
    في 27 ديسمبر 2024، وما يزال محتجزًا دون تهمة وفق منظمات حقوقية تتابع حالته الصحية.
  en: Palestinian physician, born in the Jabalia refugee camp in 1973. A paediatrician and neonatologist, he headed the paediatric department of Kamal Adwan Hospital in Beit Lahia before becoming its director
    in February 2024. He led the hospital through its siege until his detention on 27 December 2024, and rights organisations report that he remains held without charge while his health deteriorates.
  ur: فلسطینی معالج، 1973 میں جبالیا پناہ گزین کیمپ میں پیدا ہوئے۔ اطفال اور نوزائیدہ بچوں کے ماہر کے طور پر انہوں نے بیت لاہیا کے کمال عدوان اسپتال کے شعبۂ اطفال کی قیادت کی، پھر فروری 2024 میں اس کے منتظم
    بنے۔ انہوں نے 27 دسمبر 2024 کو گرفتاری تک محاصرے میں اسپتال کی قیادت کی، اور حقوقی تنظیموں کے مطابق وہ بغیر کسی الزام کے قید ہیں جب کہ ان کی صحت بگڑ رہی ہے۔
  es: "Médico palestino, nacido en el campo de refugiados de Jabalia en 1973. Pediatra y neonatólogo, dirigió el departamento de pediatría del Hospital Kamal Adwan en Beit Lahia antes de convertirse en su director en febrero de 2024. Dirigió el hospital durante el asedio hasta su detención el 27 de diciembre de 2024, y organizaciones de derechos humanos informan que permanece detenido sin cargos mientras su salud se deteriora."
  fr: "Médecin palestinien, né en 1973 dans le camp de réfugiés de Jabalia. Pédiatre et néonatologue, il dirigeait le service de pédiatrie de l'hôpital Kamal Adwan de Beit Lahia avant d'en devenir le directeur en février 2024. Il a dirigé l'hôpital pendant le siège jusqu'à son arrestation le 27 décembre 2024, et les organisations de défense des droits humains signalent qu'il reste détenu sans inculpation tandis que sa santé se détériore."
  tr: "1973'te Jabalia kampında doğan Filistinli bir doktor. Pediatri ve yenidoğan hastalıkları alanında uzmanlaşmış, Beit Lahia'daki Kamal Adwan Hastanesi'nde pediatri bölümünün başında bulunmuş, ardından Şubat 2024'te müdür olmuştur. Hastaneyi kuşatma altındaki halde yönetti ve 27 Aralık 2024'te tutuklanana kadar hâlâ suçlama olmaksızın gözaltında kaldı; sağlık durumunu izleyen insan hakları örgütlerine göre."
  id: "Seorang dokter Palestina, lahir di kamp Jabalia pada tahun 1973. Ia mengkhususkan diri dalam pediatri dan neonatologi, memimpin departemen pediatri di Rumah Sakit Kamal Adwan di Beit Lahia, lalu menjadi direktur pada Februari 2024. Ia memimpin rumah sakit yang dikepung hingga penangkapannya pada 27 Desember 2024, dan masih ditahan tanpa dakwaan, menurut organisasi hak asasi manusia yang memantau kondisi kesehatannya."
