label: { ar: "عتاب بن غيلان الثقفي", en: "'Uttab ibn Ghaylan al-Thaqafi", es: "'Uttab ibn Ghaylan al-Thaqafi", fr: "'Uttab ibn Ghaylan al-Thaqafi", ur: "عتاب بن غیلان ثقفی" }
summary:
  ar: "صاحب المقولة المشهورة في الوليد بن عقبة لما صلى بهم الصبح أربعاً ثملاً وقال أتريدون أن أزيدكم فقال له ما تزيد لا زادك الله من الخير والله لا أعجب إلا ممن بعثك إلينا والياً وعلينا أميراً {cite:muruj-al-dhahab p. 630}."
  en: "The man of the famous retort — when al-Walid prayed four for dawn and asked 'shall I give you more?': 'You will not add, and God grant you no more of good; I wonder only at who sent you over us' {cite:muruj-al-dhahab p. 630}."
  es: "El hombre de la famosa réplica — cuando al-Walid rezó cuatro veces por el amanecer y preguntó \"¿Quieres que te dé más?\": \"No añadirás nada, y Dios no te concederá más bien; solo me pregunto quién te envió sobre nosotros\" {cita:muruj-al-dhahab p. 630}."
  fr: "L'homme à la célèbre réplique — quand al-Walid pria quatre fois pour l'aube et demanda « Dois-je vous en donner plus ? »: « Vous n'en ajouterez pas, et Dieu ne vous accordera pas plus de bien; je me demande seulement qui vous a envoyé sur nous » {cite: muruj-al-dhahab p. 630}."
  ur: "مشہور جوابی شخص - جب الولید نے فجر کی چار نمازیں ادا کیں اور پوچھا 'کیا میں تمہیں مزید دوں؟': 'تم اضافہ نہیں کرو گے، اور خدا تمہیں مزید بھلائی نہیں دے گا۔ میں صرف اس بات پر حیران ہوں کہ آپ کو ہم پر کس نے بھیجا ہے۔ 630}۔"
  tr: "Ünlü Al-Walid ibn Uqbah sözünde sabah dört kez onlarla namaz kılıp 'Sizi artırmamı ister misiniz?' dediğinde, 'Daha ne olur? Allah sizi iyilikten artırmasın.' diye cevap verdi. Allah aşkına, sizi vali ve üzerimizde komutan olarak gönderenlerden başka şaşırmıyorum.' {alıntı:Muruj-al-Dhahab, s. 630}."
  id: "Penulis pepatah terkenal tentang Al-Walid ibn Uqbah, ketika ia berdoa bersama mereka empat kali pagi dan berkata, 'Apakah kalian ingin aku menambah kebaikanmu?' Ia menjawab, 'Apa lagi? Semoga Allah tidak menambah kebaikanmu. Demi Tuhan, aku tidak heran kecuali oleh mereka yang mengirimmu kepada kami sebagai gubernur dan atas kami sebagai komandan.' {cite:muruj-al-dhahab, hlm. 630}."
