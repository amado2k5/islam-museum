summary:
  ar: "عازف سيتار هندي (1928–2004) من غرانة إمدادخاني (إيتاواه)، وُلد في غوريبور بالبنغال، ابن عنايت خان وحفيد إمداد خان؛ اشتهر بأسلوب «الغاياكي» الغنائي على السيتار، ووضع موسيقى فيلم «جلساغر» (1958) لساتياجيت راي، ورفض مرارا أرفع الأوسمة المدنية الهندية."
  en: "Indian sitar maestro (1928–2004) of the Imdadkhani (Etawah) gharana, born at Gouripur in Bengal, son and heir of Enayat Khan and grandson of Imdad Khan; famed for the gayaki ang, a singing style on the sitar, he composed for Satyajit Ray's Jalsaghar (1958) and repeatedly refused India's Padma honours."
  ur: "بھارتی ستار نواز (1928ء–2004ء) جن کا تعلق امداد خانی (اٹاوہ) گھرانے سے تھا؛ بنگال کے گوری پور میں پیدا ہوئے، عنایت خان کے بیٹے اور امداد خان کے پوتے؛ ستار پر گائیکی انگ کے لیے مشہور، ستیہ جیت رے کی فلم «جلسا گھر» (1958ء) کی موسیقی ترتیب دی اور بھارت کے بڑے شہری اعزازات قبول کرنے سے بار بار انکار کیا۔"
