label: { ar: "مكثر بن عيسى أمير مكة", en: "Mukaththir ibn Isa, amir of Mecca", es: "Mukaththir ibn Isa, amir of Mecca", fr: "Mukaththir ibn Isa, amir of Mecca", ur: "مکاتیر ابن عیسیٰ، امیر مکہ" }
summary:
  ar: "الأمير مكثر بن عيسى أمير مكة؛ بنى قلعة على جبل أبي قبيس فأمر الخليفة أمير الحاج طاشتكين بعزله وإقامة أخيه داود مقامه، فكان بمكة في ذي الحجة سنة إحدى وسبعين وخمسمائة حرب شديدة هجم فيها الحاج على المدينة، فهرب مكثر إلى قلعته فحُصر بها ثم فارقها وسار عن مكة وولي أخوه داود الإمارة {cite:kamil-ibn-al-athir p. 77-78}."
  en: "Amir of Mecca — deposed by the caliph's order for building a castle on Abu Qubays; besieged in it by the Hajj host in Dhu al-Hijja 571, he abandoned it and left Mecca to his brother Dawud {cite:kamil-ibn-al-athir p. 77-78}."
  es: "Emir de La Meca — depuesto por orden del califa para construir un castillo en Abu Qubays; asediado en él por la hueste del Hajj en Dhu al-Hijja 571, lo abandonó y dejó La Meca a su hermano Dawud {cite:kamil-ibn-al-athir p. 77-78}."
  fr: "L'émir de La Mecque — déposé sur ordre du calife pour avoir construit un château sur Abou Qubays; assiégé dans celui-ci par l'armée du Hajj en Dhu al-Hijja 571, il l'abandonna et laissa La Mecque à son frère Dawud {cite:kamil-ibn-al-athir p. 77-78}."
  ur: "مکہ کے امیر - ابو قبیس پر ایک قلعہ بنانے کے لیے خلیفہ کے حکم سے معزول؛ ذی الحجہ 571 میں میزبان حج نے اس کا محاصرہ کیا، اس نے اسے ترک کر دیا اور مکہ چھوڑ کر اپنے بھائی داؤد کے پاس چلا گیا۔ 77-78}۔"
