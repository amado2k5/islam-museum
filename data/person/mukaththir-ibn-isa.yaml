  ar: "الأمير مكثر بن عيسى أمير مكة؛ بنى قلعة على جبل أبي قبيس فأمر الخليفة أمير الحاج طاشتكين بعزله وإقامة أخيه داود مقامه، فكان بمكة في ذي الحجة سنة إحدى وسبعين وخمسمائة حرب شديدة هجم فيها الحاج على المدينة، فهرب مكثر إلى قلعته فحُصر بها ثم فارقها وسار عن مكة وولي أخوه داود الإمارة {cite:kamil-ibn-al-athir p. 77-78}."
