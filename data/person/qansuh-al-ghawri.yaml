id: person/qansuh-al-ghawri
class: person
label: { ar: "السلطان قانصوه الغوري", en: "Sultan Qansuh al-Ghawri" }
summary:
  ar: "قانصوه الغوري الجركسي الملك الأشرف آخر سلاطين دولة الجراكسة قوية الشأن؛ تولى السلطنة أولاً بعد خلع الملك الناصر بن قايتباي نحو أحد عشر يوماً سنة 902 فتحرك عليه العسكر فهرب إلى غزة وفُقد في وقعة خان يونس، ثم تولى ثانية يوم الاثنين عيد الفطر سنة ست وتسعمائة بعد مقتل العادل طومان باي {cite:shadharat-dhahab p. 439, 445}. وفي شذرات الذهب أنه كان شديد الطمع كثير الظلم والعسف مصادراً للناس في أخذ أموالهم وبطل الميراث في أيامه بحيث كان إذا مات أحد أخذ ماله جميعاً فجمع أموالاً عظيمة وافتتح اليمن واتخذ مماليك أظهروا الفساد وأضروا العباد ولا يُغضى عنهم ويُحكى أن بعض أعوانه اشترى متاعاً فلم يرض صاحبه بقيمته فقال له شرع الله فضربه بالدبوس فشج رأسه وقال هذا شرع الله فسقط مغشياً عليه وذهب بالمتاع ولم يقدر أحد يتكلم فرفع بعض الصالحين يديه ودعا على الجندي وعلى سلطانه بالزوال ثم قالت له نفسه كيف يزول ملك هذا السلطان العظيم الذي ملأت جنوده وسطوته الأرض فلم يمض إلا قليل ثم وقعت بينه وبين السلطان سليم ملك الروم بسبب إسماعيل شاه فالتقيا بمرج دابق شمالي حلب بمرحلة خامس عشر رجب سنة اثنتين وعشرين وتسع مئة فانهزم عسكره بمكيدة خاير بك وانفقد الغوري تحت سنابك الخيل في مرج دابق {cite:shadharat-dhahab p. 530-531}."
  en: "Last Circassian Mamluk sultan — Shadharat records his extortion and the abolished-inheritance policy, then Marj Dabiq on 15 Rajab 922 where Khayr Bak's defection broke his army and his body was lost beneath the horses' hooves {cite:shadharat-dhahab p. 530-531}."
