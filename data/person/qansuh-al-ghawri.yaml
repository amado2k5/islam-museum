id: person/qansuh-al-ghawri
class: person
label: { ar: "السلطان قانصوه الغوري", en: "Sultan Qansuh al-Ghawri", es: "Sultan Qansuh al-Ghawri", fr: "Sultan Qansuh al-Ghawri", ur: "سلطان قنسوح الغاوری" }
summary:
  ar: "قانصوه الغوري الجركسي الملك الأشرف آخر سلاطين دولة الجراكسة قوية الشأن؛ تولى السلطنة أولاً بعد خلع الملك الناصر بن قايتباي نحو أحد عشر يوماً سنة 902 فتحرك عليه العسكر فهرب إلى غزة وفُقد في وقعة خان يونس، ثم تولى ثانية يوم الاثنين عيد الفطر سنة ست وتسعمائة بعد مقتل العادل طومان باي {cite:shadharat-dhahab p. 439, 445}. وفي شذرات الذهب أنه كان شديد الطمع كثير الظلم والعسف مصادراً للناس في أخذ أموالهم وبطل الميراث في أيامه بحيث كان إذا مات أحد أخذ ماله جميعاً فجمع أموالاً عظيمة وافتتح اليمن واتخذ مماليك أظهروا الفساد وأضروا العباد ولا يُغضى عنهم ويُحكى أن بعض أعوانه اشترى متاعاً فلم يرض صاحبه بقيمته فقال له شرع الله فضربه بالدبوس فشج رأسه وقال هذا شرع الله فسقط مغشياً عليه وذهب بالمتاع ولم يقدر أحد يتكلم فرفع بعض الصالحين يديه ودعا على الجندي وعلى سلطانه بالزوال ثم قالت له نفسه كيف يزول ملك هذا السلطان العظيم الذي ملأت جنوده وسطوته الأرض فلم يمض إلا قليل ثم وقعت بينه وبين السلطان سليم ملك الروم بسبب إسماعيل شاه فالتقيا بمرج دابق شمالي حلب بمرحلة خامس عشر رجب سنة اثنتين وعشرين وتسع مئة فانهزم عسكره بمكيدة خاير بك وانفقد الغوري تحت سنابك الخيل في مرج دابق {cite:shadharat-dhahab p. 530-531}. ويذكر الصلابي أن الغوري وقف مع الأمراء العثمانيين الفارين من وجه سليم وفي مقدمتهم الأمير أحمد أخو السلطان، وأن المخابرات العثمانية عثرت على خطاب تحالف سري بين المماليك والفرس محفوظ بأرشيف طوب قابو، وأن العثمانيين أكرموا الغوري بعد مماته فأقاموا عليه صلاة الجنازة ودفنوه في مشارف حلب {cite:dawlat-uthmaniyya-salabi p. 184-187}."
  en: "Last Circassian Mamluk sultan — Shadharat records his extortion and the abolished-inheritance policy, then Marj Dabiq on 15 Rajab 922 where Khayr Bak's defection broke his army and his body was lost beneath the horses' hooves {cite:shadharat-dhahab p. 530-531}. Al-Salabi adds that he sheltered the fleeing Ottoman princes (foremost Selim's brother Ahmad), that Ottoman intelligence found his secret alliance letter to the Safavids in the Topkapı archive, and that the victors prayed over him and buried him at Aleppo's edge {cite:dawlat-uthmaniyya-salabi p. 184-187}."
  es: "Último sultán mameluco circasiano: Shadharat registra su extorsión y la política de sucesión abolida, luego Marj Dabiq el 15 Rajab 922, donde la deserción de Khayr Bak destrozó su ejército y su cuerpo se perdió bajo los cascos de los caballos {cite:shadharat-dhahab p. 530-531}. Al-Salabi añade que dio refugio a los príncipes otomanos que huían (principalmente al hermano de Selim, Ahmad), que la inteligencia otomana encontró su carta de alianza secreta a los safávidas en el archivo de Topkapı, y que los vencedores oraron por él y lo enterraron en las afueras de Alepo {cite:dawlat-uthmaniyya-salabi p. 184-187}."
  fr: "Le dernier sultan mamelouk circassien, Khayr Bak, est mentionné dans le Shadharat, qui relate ses extorsions et l'abolition de la politique successorale. Le Marj Dabiq relate ensuite le 15 Rajab 922, date à laquelle la défection de Khayr Bak anéantit son armée et son corps fut perdu sous les sabots des chevaux (cite: Shadharat-Dhahab, p. 530-531). Al-Salabi ajoute qu'il abrita les princes ottomans en fuite (notamment Ahmad, frère de Selim), que les services de renseignement ottomans découvrirent sa lettre d'alliance secrète avec les Safavides dans les archives de Topkapı, et que les vainqueurs prièrent pour lui et l'inhumèrent aux abords d'Alep (cite: Dawlat-Uthmaniyya-Salabi, p. 184-187)."
  ur: "آخری سرکاسی مملوک سلطان - شدھارت نے اپنی بھتہ خوری اور وراثت کی منسوخی کی پالیسی کو ریکارڈ کیا، پھر مرج دابق 15 رجب 922 کو جہاں خیر بک کے انحراف نے اس کی فوج کو توڑ دیا اور اس کی لاش گھوڑوں کے کھروں کے نیچے گم ہوگئی۔ 530-531}۔ السلبی نے مزید کہا کہ اس نے فرار ہونے والے عثمانی شہزادوں ⁦(سلیم کے بھائی احمد)⁩ کو پناہ دی، کہ عثمانی انٹیلی جنس نے صفویوں کے نام اس کا خفیہ اتحاد کا خط توپکاپی آرکائیو میں پایا، اور فاتحین نے اس پر دعا کی اور اسے حلب کے کنارے پر دفن کیا۔ 184-187}۔"
  tr: "Çerkes devletinin son güçlü sultanı Qansuh al-Ghuri al-Jurassi al-Malik al-Ashraf, 902 Hicri'de yaklaşık on bir gün boyunca Kral el-Nasir bin Qaitbay'ı tahttan indirdikten sonra sultanlığı ilk kez devraldı. Ordu ona karşı harekete geçti, Gazze'ye kaçtı ve Han Yunis Savaşı'nda ortadan kayboldu. Daha sonra, 906 Hicri yılının Pazartesi günü Eid al-Fitr günü, el-Adil Tuman Bey'in öldürülmesinden sonra tekrar sultanlığı devraldı {cite:shadharat-dhahab, s. 439, 445}. Şadharat al-Dhahab'da, son derece açgözlü, çok adaletsiz ve baskıcı olduğunu, insanların parasını el koyduğunu ve mirası geçersiz kıldığını, biri öldüğünde tüm servetini aldığını, büyük servet biriktirdiğini, Yemen'i fethettiğini ve yolsuzluğu ortaya çıkaran, halka zarar veren Memlükleri aldığını ve onları göz ardı etmediğini söyler. Bazı yardımcılarının mal aldığı ama sahiplerinin değerinden memnun olmadığı söylenir. Ona \"Allah'ın kanunu\" dedi ve iğneyle vurarak başını çatlattı. \"Bu Allah'ın kanunudur,\" dedi. Bayıldı, eşyalarını kaybetti ve kimse konuşamadı, bu yüzden bazı doğruları diriltti. Asker ve sultanının yok olması için dua etti. Sonra ona, askerleri ve gücüyle toprakları dolduran bu büyük sultanın krallığının nasıl yok olacağını sordu. Kısa süre sonra, kendisi ile Roma Kralı Sultan Selim arasında İsmail Şah yüzünden bir çatışma çıktı. 922 Hile yılının on beşinde, Halep'in kuzeyindeki Marj Dabiq'te karşılaştılar. Ordusu Hayr Beg'in planıyla yenildi ve Al-Ghuri at toynaklarının altında kayboldu (atıf:shadharat-dhahab s. 530-531}. Al-Sallabi, Al-Ghuri'nin Salim'den kaçan Osmanlı prensleriyle birlikte durduğunu, özellikle Sultan'ın kardeşi Prens Ahmed olduğunu ve Osmanlı istihbaratının Memlükler ile Persler arasında Tub Qabu arşivinde saklanan gizli bir ittifak mektubu bulduğunu belirtir. Osmanlılar, Al-Ghuri'nin ölümünden sonra cenaze namazını kılıp Halep'in dışında defnederek onurlandırdılar {cite:dawlat-uthmaniyya-salabi s. 184-187}."
  id: "Qansuh al-Ghuri al-Jurassi al-Malik al-Ashraf, sultan terakhir yang berkuasa dari negara Circassia, mengambil alih kesultanan terlebih dahulu setelah menggulingkan Raja al-Nasir ibn Qaitbay selama sekitar sebelas hari pada tahun 902 H. Pasukan bergerak melawannya, melarikan diri ke Gaza, dan menghilang dalam Pertempuran Khan Yunis. Ia kemudian kembali menjadi sultanat pada hari Senin, Idul Fitri tahun 906 H, setelah pembunuhan al-Adil Tuman Bey {cite:shadharat-dhahab, hlm. 439, 445}. Dalam Shadharat al-Dhahab, ia mengatakan bahwa ia sangat serakah, sangat tidak adil dan menindas, menyita uang rakyat dan membatalkan warisan di zamannya, sehingga ketika seseorang meninggal, ia mengambil semua hartanya, mengumpulkan kekayaan besar, menaklukkan Yaman, dan mengambil Mamluk yang mengungkap korupsi dan merugikan rakyat tanpa mengabaikan mereka. Dikatakan bahwa beberapa pembantunya membeli barang tetapi pemiliknya tidak puas dengan nilainya. Ia berkata kepadanya, \"Hukum Tuhan,\" dan ia memukulnya dengan jarum sehingga kepalanya retak. Ia berkata, \"Ini adalah hukum Tuhan.\" Ia pingsan, kehilangan barang-barangnya, dan tidak ada yang bisa berbicara, sehingga ia membangkitkan beberapa orang benar. Ia berdoa agar prajurit dan sultannya menghilang. Kemudian ia bertanya bagaimana kerajaan sultan agung ini, yang tentara dan kekuasaannya memenuhi negeri itu, akan lenyap. Tak lama kemudian, terjadi konflik antara ia dan Sultan Selim, Raja Romawi, mengenai Ismail Shah. Mereka bertemu di Marj Dabiq utara Aleppo pada tanggal lima belas Rajab tahun 922 H. Pasukannya dikalahkan oleh rencana Khayr Beg, dan Al-Ghuri menghilang di bawah kuku kuda di Marj Dabiq {cite:shadharat-dhahab hlm. 530-531}. Al-Sallabi menyebutkan bahwa Al-Ghuri berdiri bersama para pangeran Ottoman yang melarikan diri dari Salim, terutama Pangeran Ahmed, saudara Sultan, dan bahwa intelijen Ottoman menemukan surat aliansi rahasia antara Mamluk dan Persia yang disimpan di arsip Tub Qabu. Ottoman menghormati Al-Ghuri setelah kematiannya dengan melakukan doa pemakaman dan menguburkannya di pinggiran Aleppo {cite:dawlat-uthmaniyya-salabi hlm. 184-187}."
