id: person/ibn-babashad
class: person
label: { ar: "طاهر بن أحمد بن بابشاذ الجوهري النحوي" }
summary:
  ar: "أبو الحسن طاهر بن أحمد بن بابشاذ المصري الجوهري النحوي صاحب التصانيف؛ دخل بغداد تاجراً في الجوهر وأخذ عن علمائها وخدم بعمرو في ديوان الإنشاء وكان كتاب الإنشاء لا يتقدمون بكتبهم حتى تعرض عليه وله مرتب على ذلك، ثم تزهد ورغب عن الخدمة واستغنى بالله واره بيته فكان ملطوفاً به حتى مات؛ ومن تصانيفه المقدمة وشرحها وشرح الجمل وشرح كتاب الأصول لابن السراج ومسودات توفي قبل تمامها قريب من خمسة عشر مجلداً؛ قيل إنه مات متردياً من غرفة، وأصله من الديلم، وبابشاذ كلمة أعجمية معناها السرور والفرح {cite:shadharat-dhahab p. 341-342}."
  en: "Abu al-Hasan Tahir b. Ahmad b. Babashadh — the Egyptian jeweler-grammarian who entered Baghdad a gem merchant, served Amr's chancery where no letter went out unshown to him, then left service for ascetic retirement; author of the Muqaddima with its commentary, a sharh of the Jumal and of Ibn al-Sarraj's Kitab al-Usul — drafts nearing fifteen volumes unfinished; said to have died falling from his upper room, of Daylami origin {cite:shadharat-dhahab p. 341-342}."
  es: "Abu al-Hasan Tahir b. Ahmad b. Babashadh — el joyero y gramático egipcio que llegó a Bagdad como comerciante de gemas, sirvió en la cancillería de Amr, donde ninguna carta salía sin ser mostrada a él, y luego dejó el servicio para retirarse a la vida ascética; autor del Muqaddima con su comentario, un sharh del Jumal y del Kitab al-Usul de Ibn al-Sarraj — borradores de casi quince volúmenes inacabados; se dice que murió al caer de su habitación superior, de origen Daylami {cite:shadharat-dhahab p. 341-342}."
  fr: "Abu al-Hasan Tahir b. Ahmad b. Babashadh — le joaillier-grammairien égyptien qui entra à Bagdad comme marchand de pierres précieuses, travailla à la chancellerie d'Amr où aucune lettre ne sortait sans lui être montrée, puis quitta le service pour une retraite ascétique; auteur de la Muqaddima avec son commentaire, un sharh du Jumal et du Kitab al-Usul d'Ibn al-Sarraj — brouillons de près de quinze volumes inachevés; on dit qu'il mourut en tombant de sa chambre haute, d'origine Daylami {cite:shadharat-dhahab p. 341-342}."
  ur: "ابو الحسن طاہر ب۔ احمد بی۔ باباشاد - مصری جواہرات- گرامر جو بغداد میں ایک جواہرات کے سوداگر کے طور پر داخل ہوا، عمرو کے دفتر میں خدمت کی جہاں کوئی خط اس کے نام ظاہر نہیں کیا گیا، پھر سنیاسی ریٹائرمنٹ کے لیے خدمت چھوڑ دی۔ مقدّمہ کا مصنف اس کی تفسیر کے ساتھ، جمل کی ایک شرح اور ابن السراج کی کتاب الاصول - تقریباً پندرہ جلدوں کے مسودے نامکمل ہیں۔ کہا جاتا ہے کہ دیلامی نژاد، اپنے اوپر والے کمرے سے گر کر مر گیا تھا۔ 341-342}۔"
  tr: "Ebu el-Hasan Tahir bin Ahmed bin Babshadh al-Masri al-Jawhari, dilbilimci ve yazıların yazarı; Bağdat'a al-Jahar'da tüccar olarak girdi, alimlerinden eğitim aldı ve Amr'a Yazı Diwanı'nda hizmet etti. Yazı yazıcıları kitaplarını kendisine sunulana kadar ilerletmedi ve ona göre bir kitap düzenledi. Sonra zahi oldu, arzulandı ve kendini evine adamış olan ve ölümüne kadar ona bağlı kalan Allah'a adadı. Eserleri arasında giriş ve yorum, Şerh al-Cum, İbn el-Siraj'ın ilkeler kitabı üzerine yorum ve tamamlanmadan ölen yaklaşık on beş ciltlik el yazmaları bulunur; Daylam'dan gelen bir odadan çürümüş halde öldüğü söylenir. Babshadh, sevinç ve mutluluk anlamına gelen yabancı bir kelimedir {atı: shadharat-dhahab, s. 341-342}."
  id: "Abu al-Hasan Tahir ibn Ahmad ibn Babshadh al-Masri al-Jawhari, ahli tata bahasa dan penulis tulisan; ia masuk ke Baghdad sebagai pedagang di al-Jahar, belajar di bawah para cendekiawan, dan melayani Amr di Diwan Penulisan. Para ahli tulis menulis tidak melanjutkan buku-buku mereka sampai diberikan kepadanya, dan ia telah mengatur sebuah buku sesuai kehadiran. Kemudian ia menjadi pertapa dan menginginkan, dan mengabdikan diri kepada Tuhan, yang setia pada rumahnya dan setia kepadanya hingga ia meninggal. Di antara karya-karyanya adalah pengantar dan komentar, Sharh al-Jumal, komentar atas kitab prinsip karya Ibn al-Siraj, dan naskah-naskah yang mati sebelum selesai, hampir lima belas jilid; dikatakan bahwa ia meninggal dalam keadaan terurai dari sebuah ruangan, yang awalnya berasal dari Daylam. Babshadh adalah kata asing yang berarti sukacita dan kebahagiaan {cite:shadharat-dhahab, hlm. 341-342}."
