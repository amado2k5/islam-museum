label: { ar: "طاهر بن أحمد بن بابشاذ الجوهري النحوي" }
summary:
  ar: "أبو الحسن طاهر بن أحمد بن بابشاذ المصري الجوهري النحوي صاحب التصانيف؛ دخل بغداد تاجراً في الجوهر وأخذ عن علمائها وخدم بعمرو في ديوان الإنشاء وكان كتاب الإنشاء لا يتقدمون بكتبهم حتى تعرض عليه وله مرتب على ذلك، ثم تزهد ورغب عن الخدمة واستغنى بالله واره بيته فكان ملطوفاً به حتى مات؛ ومن تصانيفه المقدمة وشرحها وشرح الجمل وشرح كتاب الأصول لابن السراج ومسودات توفي قبل تمامها قريب من خمسة عشر مجلداً؛ قيل إنه مات متردياً من غرفة، وأصله من الديلم، وبابشاذ كلمة أعجمية معناها السرور والفرح {cite:shadharat-dhahab p. 341-342}."
  en: "Abu al-Hasan Tahir b. Ahmad b. Babashadh — the Egyptian jeweler-grammarian who entered Baghdad a gem merchant, served Amr's chancery where no letter went out unshown to him, then left service for ascetic retirement; author of the Muqaddima with its commentary, a sharh of the Jumal and of Ibn al-Sarraj's Kitab al-Usul — drafts nearing fifteen volumes unfinished; said to have died falling from his upper room, of Daylami origin {cite:shadharat-dhahab p. 341-342}."
