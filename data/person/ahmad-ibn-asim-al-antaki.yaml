summary:
  ar: "أحمد بن عاصم الأنطاكي، زاهد من أهل أنطاكية، كان يُعدّ من القاصمين للهوى، وأكثر أقواله في «حلية الأولياء» في المحاسبة والمعرفة والصدق والتوكل والصبر."
  en: "Ahmad ibn Asim al-Antaki, an ascetic of Antioch, counted among those who break desire; most of his sayings in Hilyat al-Awliya concern self-examination, knowledge of God, truthfulness, trust and patience."
  fr: "Ahmad ibn Asim al-Antaki, ascète d'Antioche compté parmi ceux qui brisent le désir ; la plupart de ses propos dans Hilyat al-Awliya traitent de l'examen de soi, de la connaissance de Dieu, de la véracité, de la confiance et de la patience."
  ur: "احمد بن عاصم انطاکی انطاکیہ کے زاہد تھے، جنہیں خواہش کو توڑنے والوں میں شمار کیا جاتا تھا۔ «حلیۃ الاولیاء» میں ان کے زیادہ تر اقوال محاسبہ، معرفت، صدق، توکل اور صبر پر ہیں۔"
  es: "Ahmad ibn Asim al-Antaki, un asceta de Antioquía, se cuenta entre aquellos que superan el deseo; la mayoría de sus dichos en Hilyat al-Awliya tratan sobre el autoexamen, el conocimiento de Dios, la veracidad, la confianza y la paciencia."
