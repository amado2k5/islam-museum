summary:
  ar: "أبو الحسن علي بن سهل الأصبهاني الصوفي، الحَبْر بالوصل المحفوظ في الفضل، جاهد نفسه حتى هذّبها، وكان يمتنع عن الطعام أيامًا ويبيت قائمًا. روى أبو نعيم عن أصحابه أنه قال قبل موته إن موته لن يكون بالعلل والأسقام، وأنه قال: لبيك، ثم وقع ميتًا."
  en: "Abu al-Hasan Ali ibn Sahl al-Isfahani al-Sufi, a scholar joined to God and preserved in virtue, who disciplined his own self until he refined it, went for days without food, and spent nights standing. Abu Nu'aym records that he foretold that his death would not come by sickness, and that he died at the moment he answered a call."
  ur: "ابو الحسن علی بن سہل اصفہانی صوفی، حق سے جڑے ہوئے عالم اور فضیلت میں محفوظ، جنہوں نے اپنے نفس کی ایسی تربیت کی کہ اسے سنوار دیا، کئی دن کھانے سے رکے رہتے اور راتیں کھڑے ہو کر گزارتے۔ ابو نعیم نے ان کے شاگردوں سے نقل کیا ہے کہ انہوں نے پیشین گوئی کی کہ ان کی موت بیماری سے نہیں ہوگی، اور وہ «لبیک» کہتے ہوئے گر کر فوت ہو گئے۔"
