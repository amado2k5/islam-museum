summary:
  ar: "بهمنيار بن المرزبان الأذربيجاني، أبو الحسن، حكيم من تلاميذ ابن سينا، كان مجوسيا وأسلم، له «ما بعد الطبيعة» و«مراتب الموجودات» و«التحصيل»، توفي سنة 458 هـ."
  en: "Bahmanyar ibn al-Marzuban al-Adharbayjani, Abu al-Hasan, a philosopher and pupil of Ibn Sina who was a Zoroastrian and became a Muslim; author of Ma ba'd al-Tabi'a, Maratib al-Mawjudat and al-Tahsil; died 458 AH (1066)."
  es: "Bahmanyar ibn al-Marzuban al-Adharbayjani, Abu al-Hasan, filósofo y alumno de Ibn Sina que era zoroástrico y se convirtió en musulmán; autor de Ma ba'd al-Tabi'a, Maratib al-Mawjudat y al-Tahsil; murió en el año 458 d. H. (1066)."
  fr: "Bahmanyar ibn al-Marzuban al-Adharbayjani, Abu al-Hasan, philosophe et élève d'Ibn Sina qui était zoroastrien et devint musulman; auteur de Ma ba'd al-Tabi'a, Maratib al-Mawjudat et al-Tahsil; décédé en 458 AH (1066)."
