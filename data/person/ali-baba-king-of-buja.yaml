id: person/ali-baba-king-of-buja
class: person
label: { ar: "علي بابا ملك البجة", fr: "Ali Baba, roi des Bedja" }
summary:
  ar: "عند البلاذري: ملك البجة زمن المتوكل قاتل محمد القمي على إبل محزمة فنفرت من أجراس الخيل فطلب الأمان وصالح سنة إحدى وأربعين ومائتين على الأتاوة والبقط وعدم منع المسلمين العمل في معدن الذهب وفي رواية المقريزي قدم سر من رأى فخلع عليه المتوكل الديباج وعاد مع القمي وهو على دينه ومعه صنم من حجارة كهيئة الصبي يسجد له."
  en: "In al-Baladhuri: the Buja's king in al-Mutawakkil's time who fought Muhammad al-Qummi on armored camels that bolted at the horses' bells; he asked safety and made peace in 241 on tribute, baqt, and not barring Muslims from the gold mine — in al-Maqrizi's version he came to Samarra, al-Mutawakkil robed him in brocade, and he returned with al-Qummi still on his religion, carrying a stone idol like a boy he prostrated to."
  fr: "Dans al-Baladhuri : le roi de Buja à l'époque d'al-Mutawakkil qui a combattu Muhammad al-Qummi sur des chameaux blindés qui ont boulonné aux cloches des chevaux ; il a demandé la sécurité et a fait la paix en 241 sur l'hommage, baqt, et ne pas interdire les musulmans de la mine d'or - dans la version d'al-Maqrizi il est venu à Samarra, al-Mutawakkil l'a vêtu de brocart, et il est revenu avec al-Qummi toujours sur sa religion, portant une idole de pierre comme un garçon qu'il proster."
  es: "En al-Baladhuri: el rey de Buja en tiempos de al-Mutawakkil que luchó contra Muhammad al-Qummi en camellos blindados que se desbocaban al oír las campanas de los caballos; pidió seguridad e hizo la paz en 241 a cambio de tributo, baqt y sin impedir que los musulmanes accedieran a la mina de oro; en la versión de al-Maqrizi, llegó a Samarra, al-Mutawakkil lo vistió con brocado y regresó con al-Qummi aún fiel a su religión, llevando un ídolo de piedra como un niño ante el que se postraba."
  ur: "البلادوری میں ہے: المتوکل کے زمانے میں بوجہ کا بادشاہ جس نے گھوڑوں کی گھنٹیوں پر بکتر بند اونٹوں پر محمد القومی کا مقابلہ کیا۔ اس نے سلامتی کا سوال کیا اور 241 میں خراج، بکت، اور مسلمانوں کو سونے کی کان سے نہ روکنے پر صلح کی - المقرزی کے نسخے میں وہ سامرہ آیا، المتوکل نے اسے بروکیڈ پہنا دیا، اور وہ اپنے مذہب پر قائم القمی کے ساتھ واپس لوٹا، پتھر کا بت اٹھائے ہوئے اس لڑکے کی طرح جس کو اس نے سجدہ کیا تھا۔"
