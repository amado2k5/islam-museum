label: { ar: "علي بابا ملك البجة" }
summary:
  ar: "عند البلاذري: ملك البجة زمن المتوكل قاتل محمد القمي على إبل محزمة فنفرت من أجراس الخيل فطلب الأمان وصالح سنة إحدى وأربعين ومائتين على الأتاوة والبقط وعدم منع المسلمين العمل في معدن الذهب وفي رواية المقريزي قدم سر من رأى فخلع عليه المتوكل الديباج وعاد مع القمي وهو على دينه ومعه صنم من حجارة كهيئة الصبي يسجد له."
  en: "In al-Baladhuri: the Buja's king in al-Mutawakkil's time who fought Muhammad al-Qummi on armored camels that bolted at the horses' bells; he asked safety and made peace in 241 on tribute, baqt, and not barring Muslims from the gold mine — in al-Maqrizi's version he came to Samarra, al-Mutawakkil robed him in brocade, and he returned with al-Qummi still on his religion, carrying a stone idol like a boy he prostrated to."
