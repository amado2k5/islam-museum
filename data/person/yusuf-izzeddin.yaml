  note: "The birth day is split three ways across the sources. The Turkish article and Wikidata give 10 October 1857 at Dolmabahçe Palace, Istanbul, and the record follows that reading. The English article's infobox and early-life text give 29 September 1857, citing Adra's genealogy of the imperial family, and its lead gives 11 October 1857. He was the eldest son of Sultan Abdulaziz, then still a prince, and Dürrinev Kadın; because princes were barred from having children before accession, his existence was concealed until his father's accession in 1861. The Hijri year 1274 is the derived conversion of 1857."
