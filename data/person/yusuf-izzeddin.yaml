summary:
  ar: "أمير عثماني، أكبر أبناء السلطان عبد العزيز، وولي عهد الدولة العثمانية من 1909 حتى وفاته. أُخفي في طفولته لأن الأمراء كانوا ممنوعين من الإنجاب قبل الجلوس على العرش، وبلغ رتبة مشير وصار وليًّا للعهد في عهد محمد الخامس، لكنه عاش سنواته الأخيرة في القلق والريبة، ومات منتحرًا في قصره بزنجرلي كويو سنة 1916."
  en: "Ottoman prince, eldest son of Sultan Abdulaziz, and crown prince of the Ottoman Empire from 1909 until his death. Concealed in childhood because princes were barred from fathering children before accession, he rose to field marshal and heir under Mehmed V, but lived his last years in anxiety and suspicion, and died by suicide at his Zincirlikuyu villa in 1916."
  ur: "عثمانی شہزادے، سلطان عبدالعزیز کے بڑے فرزند، اور 1909 سے وفات تک سلطنتِ عثمانیہ کے ولی عہد۔ بچپن میں چھپائے گئے کیونکہ شہزادوں کو تخت نشینی سے پہلے اولاد کی اجازت نہ تھی؛ محمد خامس کے عہد میں مشیر کے رتبے اور ولی عہدی تک پہنچے، مگر آخری برس اضطراب اور بدگمانی میں گزارے اور 1916 میں اپنی زنجرلی کویو حویلی میں خودکشی کر لی۔"
