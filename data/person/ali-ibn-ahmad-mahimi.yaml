summary:
  ar: "علي بن أحمد بن علي المهائمي الهندي، أبو الحسن، علاء الدين، المعروف بالمخدوم، من النوائت، باحث مفسر يقول بوحدة الوجود كما يذكر الزركلي، ولد ومات في مهائم من ساحل الكوكن بالدكن، وله «تبصير الرحمن» وشروح وأدلة التوحيد؛ ٧٧٦ إلى ٨٣٥هـ الموافقة ١٣٧٤ إلى ١٤٣٢م."
  en: "Ali ibn Ahmad ibn Ali al-Mahaimi al-Hindi, Abu al-Hasan, Ala al-Din, known as al-Makhdum, of the Nawa'it; a researcher and exegete who, al-Zirikli says, held the doctrine of the unity of being. Born and died at Mahaim on the Konkan coast of the Deccan; author of «Tabsir al-Rahman» and several commentaries. 776 to 835 AH, 1374 to 1432 CE."
