id: person/muhammad-ibn-abd-al-haqq-marinid
class: person
label:
  ar: محمد بن عبد الحق المريني
  en: Muhammad ibn Abd al-Haqq al-Marini
  es: "Muhammad ibn Abd al-Haqq al-Marini"
  fr: "Muhammad ibn Abd al-Haqq al-Marini"
  ur: "محمد بن عبد الحق المرینی"
summary:
  ar: "محمد بن عبد الحق المريني الملقب بأبي ضربة؛ قام بأمر بني مرين بعد أخيه عثمان فتقبل سننه في تدويخ بلاد المغرب وجباية المغارم والوضائع، وبارز قائداً من الروم فاختلفا ضربتين هلك العلج بإحداهما وجرح محمداً في وجهه بالأخرى فاندمل جرحه وصار أثراً في وجهه لُقب من أجله أبا ضربة، وبعث الرشيد الموحدي ابن وانودين إلى مكناسة فأجحف بأهلها، ثم لما بويع السعيد بن المأمون أغزى عسكر الموحدين مع قبائل العرب والمصامدة وجموع الروم يناهزون عشرين ألفاً سنة 642هـ فزحف إليهم بنو مرين بوادي ياباش وصبر الفريقان فهلك الأمير محمد في الجولة بيد زعيم من زعماء الروم، وانكشف بنو مرين ولاذوا بجبال غياثة."
  en: "Muhammad ibn Abd al-Haqq al-Marini, nicknamed Abu Darba ('father of the blow'); succeeding his brother Uthman he kept up the pressure on Morocco's towns, and in single combat with a Christian captain they exchanged two strokes — the Frank dying of one, Muhammad's face cut by the other, the scar earning him his laqab; when al-Sa'id ibn al-Ma'mun's Almohad host of Arabs, Masmuda and Christian troops near twenty thousand marched in 642, Banu Marin met them at Wadi Yabash where Muhammad fell in the melee to a Frankish champion and the tribe broke to the Ghiyatha mountains."
  es: "Muhammad ibn Abd al-Haqq al-Marini, apodado Abu Darba ('padre del golpe'); sucediendo a su hermano Uthman, mantuvo la presión sobre las ciudades de Marruecos, y en un combate singular con un capitán cristiano intercambiaron dos golpes: el franco murió de uno, el rostro de Muhammad fue cortado por el otro, la cicatriz le valió su laqab; cuando el ejército almohade de al-Sa'id ibn al-Ma'mun, compuesto por tropas árabes, masmudas y cristianas de casi veinte mil hombres, marchó en 642, Banu Marin los recibió en Wadi Yabash, donde Muhammad cayó en la refriega ante un campeón franco y la tribu se dispersó hacia las montañas Ghiyatha."
  fr: "Muhammad ibn Abd al-Haqq al-Marini, surnommé Abu Darba (« père du coup »), succéda à son frère Uthman et maintint la pression sur les villes du Maroc. Lors d'un combat singulier contre un capitaine chrétien, ils échangèrent deux coups: le Franc mourut de l'un, le visage de Muhammad fut entaillé par l'autre, la cicatrice lui valant son laqab. En 642, lorsque l'armée almohade d'al-Sa'id ibn al-Ma'mun, composée d'Arabes, de Masmoud et de troupes chrétiennes d'environ vingt mille hommes, marcha, les Banu Marin les rencontrèrent à Wadi Yabash où Muhammad tomba dans la mêlée face à un champion franc et la tribu se dispersa dans les montagnes de Ghiyatha."
  ur: "محمد بن عبد الحق المرینی، عرفی نام ابو دربہ ⁦('دھچکا کا باپ')⁩؛ اپنے بھائی عثمان کے بعد اس نے مراکش کے قصبوں پر دباؤ برقرار رکھا، اور ایک عیسائی کپتان کے ساتھ ایک ہی لڑائی میں انہوں نے دو ضربوں کا تبادلہ کیا - فرینک کی موت، ایک کی موت، محمد کا چہرہ دوسرے سے کٹ گیا، اس زخم سے اس کا لقب نکلا۔ 642 میں جب سعید بن الممون کے الموحد عربوں، مسمودہ اور عیسائیوں کے بیس ہزار کے قریب لشکر نے مارچ کیا تو بنو مارین نے ان سے وادی یباش میں ملاقات کی جہاں محمد ایک فرینکش چیمپئن سے ہنگامہ آرائی میں گرا اور قبیلہ غیاثہ پہاڑوں پر ٹوٹ پڑا۔"
