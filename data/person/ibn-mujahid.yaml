id: person/ibn-mujahid
class: person
label:
  ar: "ابن مجاهد وعند ابن الجوزي ولد في ربيع الآخر سنة خمس وأربعين ومائتين وكان شيخ القراء في وقته والمقدم منهم على أهل عصره، وكان ثعلب يقول ما بقي في عصرنا أحد أعلم بكتاب الله من أبي بكر بن مجاهد، ورُئي في المنام ليلة موته كأن قائلًا يقول: مات الليلة من قوّم وحي الله منذ خمسين سنة! فإذا ابن مجاهد قد مات، ورآه آخر في النوم كأنه يقرأ فقال له: يا سيدي أنت ميت وتقرأ؟ فقال: كنت أدعو في دبر كل صلاة وعند ختم القرآن أن يجعلني ممن يقرأ في قبره فأنا ممن يقرأ في قبره؛ توفي يوم الأربعاء وقت العصر وأُخرج يوم الخميس لعشر بقين من شعبان ودفن في مقبرة باب البستان {cite:muntazam-ibn-al-jawzi p. 283}."
  en: "Ibn Mujahid"
roles: [scholar]
gender: male
summary:
  ar: "بطاقة أولية لأبي بكر أحمد بن موسى بن مجاهد، قارئ بغداد الذي حصر القراءات السبع في «كتاب السبعة»، توفي سنة ٩٣٦م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Bakr Ahmad ibn Musa ibn Mujahid, the Baghdad reader who canonized the seven recitations in Kitab al-Sab'a, d. 936; the biographical entry is not yet checked on the page."
