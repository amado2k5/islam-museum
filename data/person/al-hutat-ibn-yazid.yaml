summary:
  ar: "من أشراف بني تميم الذين قدموا في وفدهم على النبي سنة 9هـ؛ سمّاه ابن إسحاق الحبحاب بن يزيد وصحّحه ابن هشام إلى الحتات، وهو الذي آخى النبي بينه وبين معاوية بن أبي سفيان، فمات عند معاوية في خلافته وأخذ معاوية ما ترك بهذه الأخوة، فعاتبه الفرزدق ببيتين."
  en: "A notable of Banu Tamim in the 9 AH delegation; Ibn Ishaq calls him al-Habhab ibn Yazid and Ibn Hisham corrects the name to al-Hutat, the man the Prophet paired in brotherhood with Mu'awiya ibn Abi Sufyan. He died with Mu'awiya during his caliphate, and Mu'awiya took his estate by that brotherhood, for which al-Farazdaq reproached him in two verses."
