summary:
  ar: "من أشراف بني تميم الذين قدموا في وفدهم على النبي سنة 9هـ؛ سمّاه ابن إسحاق الحبحاب بن يزيد وصحّحه ابن هشام إلى الحتات، وهو الذي آخى النبي بينه وبين معاوية بن أبي سفيان، فمات عند معاوية في خلافته وأخذ معاوية ما ترك بهذه الأخوة، فعاتبه الفرزدق ببيتين."
  en: "A notable of Banu Tamim in the 9 AH delegation; Ibn Ishaq calls him al-Habhab ibn Yazid and Ibn Hisham corrects the name to al-Hutat, the man the Prophet paired in brotherhood with Mu'awiya ibn Abi Sufyan. He died with Mu'awiya during his caliphate, and Mu'awiya took his estate by that brotherhood, for which al-Farazdaq reproached him in two verses."
  ur: "9 ہجری کے وفد میں بنو تمیم کا معزز شخص؛ ابن اسحاق اسے ہبحاب بن یزید کہتے ہیں اور ابن ہشام نام کو حطاط درست کرتے ہیں۔"
  es: "Un personaje notable de Banu Tamim en la delegación del año 9 de la Hégira; Ibn Ishaq lo llama al-Habhab ibn Yazid e Ibn Hisham corrige el nombre a al-Hutat, el hombre con quien el Profeta estableció una hermandad con Mu'awiya ibn Abi Sufyan. Murió con Mu'awiya durante su califato, y Mu'awiya heredó sus bienes mediante esa hermandad, por lo que al-Farazdaq lo reprendió en dos versículos."
  fr: "Un notable de la tribu des Banu Tamim, membre de la délégation de l'an 9 de l'Hégire; Ibn Ishaq le nomme al-Habhab ibn Yazid, tandis qu'Ibn Hisham corrige son nom en al-Hutat. Il s'agissait de l'homme que le Prophète avait associé en frère à Mu'awiya ibn Abi Sufyan. Il mourut avec Mu'awiya durant son califat, et ce dernier hérita de ses biens par l'intermédiaire de cette fraternité, ce qui valut à al-Farazdaq un reproche à ce dernier dans deux versets."
  tr: "9 Hicri yılında Peygamber'e heyetle gelen Banu Tamim soyluları arasında, İbn İshaq ona el-Habhab bin Yezid adını verdi ve İbn Hişam onu el-Hatt'a doğruladı. Peygamber'i Muaviye bin Ebi Sufyan ile birlikte ihanete uğratan, halifeliği sırasında Muaviye ile birlikte ölen oydu ve Muaviye geride bıraktıklarını bu kardeşlikler aracılığıyla aldı, bu yüzden El-Farazdaq ona iki ayetle kızgınlık yaptı."
  id: "Di antara para bangsawan Banu Tamim yang datang dalam delegasi mereka kepada Nabi pada tahun 9 H, Ibn Ishaq menamainya al-Habhab ibn Yazid, dan Ibn Hisham mengotentikasikannya kepada al-Hattat. Dialah yang mengkhianati Nabi dengan Muawiyah ibn Abi Sufyan, meninggal bersama Muawiyah selama kekhalifahannya, dan Muawiyah mengambil apa yang ditinggalkannya melalui persaudaraan ini, sehingga Al-Farazdaq menegurnya dengan dua ayat."
