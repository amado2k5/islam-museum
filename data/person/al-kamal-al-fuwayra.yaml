summary:
  ar: "مسند العراق، شيخ المستنصرية؛ قرأ القراءات على الفخر الموصلي وانتهى إليه علو الإسناد في القراءات والحديث، وتوفي في ذي الحجة وله ثمان وتسعون سنة وقد وقع في الهرم {cite:shadharat-dhahab p. 765-766}."
  en: "Musnid of Iraq and shaykh of the Mustansiriyya; he read the readings with al-Fakhr al-Mawsili, and the highest chains of transmission in the readings and in hadith ended with him. He died in Dhu al-Hijja aged ninety-eight, and had reached decrepit old age {cite:shadharat-dhahab p. 765-766}."
  es: "Musnid de Irak y shaykh de la escuela Mustansiriyya; leyó las lecturas con al-Fakhr al-Mawsili, y las cadenas de transmisión más elevadas en las lecturas y en los hadices terminaron con él. Murió en Dhu al-Hijja a los noventa y ocho años, y había alcanzado una edad muy avanzada {cita: shadharat-dhahab págs. 765-766}."
  fr: "Musnid d'Irak et cheikh de la Mustansiriyya, il récita les lectures avec al-Fakhr al-Mawsili, et les plus hautes chaînes de transmission des lectures et des hadiths s'achevèrent avec lui. Il mourut en Dhu al-Hijja à l'âge de quatre-vingt-dix-huit ans, après avoir atteint un âge avancé (voir: shadharat-dhahab, p. 765-766)."
  ur: "عراق کے مسند اور مستنصریہ کے شیخ؛ اس نے قراءت کو الفخر الموسیلی کے ساتھ پڑھا، اور قراءت اور حدیث میں سب سے زیادہ ترسیل کا سلسلہ اسی پر ختم ہوا۔ ان کا انتقال ذی الحجہ میں ستانوے سال کی عمر میں ہوا اور وہ خستہ حالی کو پہنچ چکے تھے۔ 765-766}۔"
  tr: "Musnad el-Irak, el-Mustansiriya şeyhi; Fakhr al-Mawsili altında okumaları okudu ve okumalar ile hadislerde en yüksek aktarım zincirine ulaştı. Doksan sekiz yaşında Zhu'd-Hicce'de öldü ve piramide düştü {atıf:shadharat-dhahab s. 765-766}."
  id: "Musnad al-Iraq, Syekh al-Mustansiriya; ia membacakan bacaan di bawah Fakhr al-Mawsili dan mencapai rantai transmisi tertinggi dalam bacaan dan hadits. Ia meninggal dalam Dhu al-Hijjah pada usia sembilan puluh delapan tahun dan jatuh ke dalam piramida {cite:shadharat-dhahab hlm. 765-766}."
