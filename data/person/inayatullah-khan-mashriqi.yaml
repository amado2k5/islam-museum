summary:
  ar: "رياضياتي ومنظّر سياسي هندي ثم باكستاني (1888–1963). درس في كرايستس كوليدج بكمبريدج وحقق مراكز متقدمة في امتحانات الرياضيات، وألّف «تذكرة» الذي رُشّح لجائزة نوبل، وأسّس نحو سنة 1930 حركة الخاكسار شبه العسكرية لنهضة المسلمين وعامة الناس، وسُجن مرارًا في عهد الاستعمار وبعده."
  en: "Indian, later Pakistani, mathematician and political theorist (1888–1963). He read mathematics at Christ's College, Cambridge, with distinction, wrote the Tazkirah — nominated for the Nobel Prize — and around 1930 founded the paramilitary Khaksar movement for the revival of Muslims and the uplift of the masses; he was imprisoned repeatedly under colonial rule and after it."
  ur: "ہندوستانی، بعد ازاں پاکستانی، ریاضی دان اور سیاسی مفکر (1888ء–1963ء)۔ انھوں نے کرئسٹس کالج، کیمبرج میں ریاضی پڑھی اور نمایاں کامیابی حاصل کی، «تذکرہ» لکھی جو نوبل انعام کے لیے نامزد ہوئی، اور 1930ء کے لگ بھگ خاکسار تحریک قائم کی؛ استعماری دور اور اس کے بعد بار بار قید ہوئے۔"
