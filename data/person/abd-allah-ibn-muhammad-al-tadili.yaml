summary:
  ar: "عبد الله بن محمد بن عيسى، أبو محمد التادلي، نسبة إلى تادلة من جبال البربر بالمغرب، من علماء المالكية، فقيه أديب مفت، روى عن القاضي عياض بالسماع، وولي قضاء فاس، وله رسائل. عاش بين 511 و597هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  en: "Abd Allah ibn Muhammad ibn Isa, Abu Muhammad al-Tadili, named after Tadla in the Berber mountains of Morocco, a Maliki scholar, a learned and literary fatwa-giver who heard from the judge Iyad, held the judgeship of Fez, and left letters. He lived from 511 to 597 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  fr: "Abd Allah ibn Muhammad ibn Isa, Abu Muhammad al-Tadili, nommé d'après Tadla dans les montagnes berbères du Maroc, savant malikite, mufti savant et lettré qui entendit le cadi Iyad, exerça la charge de juge de Fès et laissa des épîtres. Il vécut de 511 à 597 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  es: "Abd Allah ibn Muhammad ibn Isa, Abu Muhammad al-Tadili, llamado así por Tadla en las montañas bereberes de Marruecos, fue un erudito malikí, un erudito y autor de fatuas que escuchó al juez Iyad, ocupó el cargo de juez en Fez y dejó cartas. Vivió entre 511 y 597 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
  ur: "عبد اللہ بن محمد ابن عیسیٰ، ابو محمد التدیلی، جس کا نام مراکش کے بربر پہاڑوں میں تدلا کے نام پر رکھا گیا، ایک مالکی عالم، ایک علمی اور ادبی فتویٰ دینے والا جس نے قاضی عیاد سے سنا، فیز کی جج کی ذمہ داری سنبھالی، اور خطوط چھوڑے۔ وہ 511 سے 597 ہجری تک زندہ رہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص2056}"
  tr: "Abdullah ibn Muhammed ibn İsa, Fas'ın Berberi dağlarındaki Tadla'nın adını taşıyan Ebu Muhammed el-Tadili, Maliki mezhebine mensup bir alim, hukukçu, edebiyatçı ve müftüdür. Kadı İyad'dan hadis rivayet etmiş ve Fez'de kadı olarak görev yapmıştır. Birçok risale yazmıştır. Hicri 511 ile 597 yılları arasında yaşamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2056}"
  id: "Abdullah ibn Muhammad ibn Isa, Abu Muhammad al-Tadili, yang dinamai menurut nama Tadla di pegunungan Berber Maroko, adalah seorang ulama Maliki, ahli hukum, sastrawan, dan mufti. Ia meriwayatkan hadits dari Qadi Iyad secara lisan, dan ia menjabat sebagai hakim di Fez. Ia menulis beberapa risalah. Ia hidup antara tahun 511 dan 597 Hijriah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2056}"
