summary:
  ar: "بطاقة أولية لخواجة سعد الدين أفندي، شيخ الإسلام ومؤرخ العثمانيين صاحب «تاج التواريخ» الذي نشأ مربياً لمراد الثالث، توفي سنة ١٥٩٩م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Hoca Sadeddin Efendi, the Ottoman shaykh al-Islam and historian author of Taj al-Tawarikh who had been tutor to Murad III, d. 1599; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Hoca Sadeddin Efendi, el jeque otomano al-Islam e historiador autor de Taj al-Tawarikh, quien fue tutor de Murad III, fallecido en 1599; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de candidature pour Hoca Sadeddin Efendi, le cheikh ottoman al-Islam et historien auteur de Taj al-Tawarikh qui avait été le précepteur de Murad III, mort en 1599; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "عثمانی شیخ الاسلام اور تاج التواریخ کے مؤرخ مصنف ہوکا سعدالدین آفندی کے لیے ڈرافٹ کارڈ جو مراد III کے ٹیوٹر رہے تھے۔ 1599; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Osmanlı tarihçisi, 'Tac el-Tawarikh' kitabının yazarı ve Osmanlı tarihçisi Khwaja Saad al-Din Effendi'nin ön kartı 1599 yılında vefat etti; önemli şahsiyetlerin sözlüklerinde adı geçti ve biyografisi henüz sayfada incelenmedi."
  id: "Kartu pendahuluan Khwaja Saad al-Din Effendi, Sheikh al-Islam dan sejarawan Ottoman, penulis 'Taj al-Tawarikh,' yang dibesarkan sebagai guru untuk Murad III, meninggal pada tahun 1599 M; ia disebutkan dalam kamus tokoh-tokoh terkenal dan biografinya belum pernah ditinjau di halaman tersebut."
