summary:
  ar: "العلامة عبد الله بن أحمد الفاكهي المكي الشافعي النحوي؛ أمه أم ولد حبشية وولد سنة تسع وتسعين وثمانمائة، وكان من كبار العلماء مشاركاً في جميع العلوم، وله مصنفات مفيدة منها شرح الآجرومية وشرح على متممها للخطاب أجاد فيهما كل الإجادة، وشرح على قطر الندى لابن هشام في غاية الحسن صنفه عام ستة عشر وتسعمائة وعمره حينئذ ثمانية عشر سنة — ولما سار إلى مصر وجد جماعة يقرؤونه وقد أشكل عليهم محل منه فأجابهم عن الإشكال فلم يثقوا بالجواب لعدم علمهم بأنه مصنفه حتى أخبرهم أنه هو الشارح واستشهد على ذلك من كان هناك من المكيين — وشرح الملحة واستنبط حدوداً للنحو في نحو كراسة ثم شرحها أيضاً في أوارس ولم يُسبق إلى مثل ذلك؛ وبالجملة فإنه لم يكن له نظير في زمانه في علم النحو فإنه كان فيه آية من آيات الله {cite:shadharat-dhahab p. 366-367}."
  en: "Al-Fakihi of Mecca — son of an Abyssinian freedwoman, b. 899; he wrote his Qatr al-Nada sharh at eighteen and found it already being read in Cairo — answering the students' difficulty, they would not believe him until he proved the author was himself; he coined definitions of nahw in a booklet then commented them — 'unprecedented'; 'he had no peer in his time in grammar, he was a sign of God's signs' {cite:shadharat-dhahab p. 366-367}."
  fr: "Al-Fakihi de La Mecque — fils d'une affranchie abyssine, né en 899 ; il écrivit son commentaire du Qatr al-Nada à dix-huit ans et le trouva déjà lu au Caire — répondant à la difficulté des étudiants, ceux-ci ne le crurent pas jusqu'à ce qu'il prouve qu'il en était lui-même l'auteur ; il forgea des définitions de la grammaire dans un opuscule qu'il commenta ensuite — « sans précédent » ; « il n'avait pas d'égal en son temps en grammaire, il était un signe parmi les signes de Dieu » {cite:shadharat-dhahab p. 366-367}."
  es: "Al-Fakihi de La Meca — hijo de una mujer abisinia liberada, n. 899; escribió su Qatr al-Nada sharh a los dieciocho años y descubrió que ya se leía en El Cairo — respondiendo a la dificultad de los estudiantes, no le creyeron hasta que demostró que el autor era él mismo; acuñó definiciones de nahw en un folleto y luego las comentó — 'sin precedentes'; 'no tuvo rival en su tiempo en gramática, fue una señal de las señales de Dios' {cite:shadharat-dhahab p. 366-367}."
  ur: "مکہ کا الفکیحی - ایک حبشی آزاد عورت کا بیٹا، بی۔ 899; اس نے اٹھارہ سال کی عمر میں اپنی قطر الندا شرح لکھی اور اسے قاہرہ میں پڑھا ہوا پایا - طلباء کی مشکل کا جواب دیتے ہوئے، وہ اس وقت تک اس پر یقین نہیں کریں گے جب تک کہ وہ خود مصنف ثابت نہ کر دیں۔ اس نے ایک کتابچے میں نحو کی تعریفیں مرتب کیں پھر ان پر تبصرہ کیا - 'بے مثال'؛ گرائمر میں اس کا اپنے زمانے میں کوئی ہمسر نہیں تھا، وہ خدا کی نشانیوں کا نشان تھا۔ 366-367}۔"
  tr: "Alim Abdullah bin Ahmed el-Fakihi el-Mekki el-Şafii el-Nehvi; annesi Habeşli bir cariye idi ve 899 Hicri yılında doğdu. Tüm ilim dallarıyla ilgilenen büyük alimlerden biriydi ve aralarında el-Ajrumiyya tefsiri ve el-Hattab'ın ekine yaptığı tefsir de bulunan faydalı eserleri vardı; bu alanda tamamen üstün bir başarı gösterdi. Ayrıca İbn Hişam'ın Katr el-Nada tefsirini de yazdı ki bu da son derece iyiydi ve 916 Hicri yılında on sekiz yaşındayken yazdı. Mısır'a gittiğinde, bir grup insanın bu tefsiri okuduğunu ve bir bölümüyle ilgili bir sorun yaşadıklarını gördü. Bunun üzerine onlara sorunu açıkladı, ancak tefsirin yazarının kendisi olduğunu bilmedikleri için cevaba inanmadılar. Ta ki tefsircinin kendisi olduğunu ve Mekke halkından şahitlerinin buna tanıklık edeceğini söyleyene kadar. Ayrıca el-Mulha üzerine bir tefsir yazdı ve bir kitapçıkta dilbilgisinin sınırlarını ortaya koydu, sonra da Awars'ta bunun üzerine bir tefsir daha yazdı; ondan önce böyle bir şey yapan kimse yoktu. Kısacası, dilbilgisi ilminde kendi zamanında eşi benzeri yoktu, çünkü o bu alanda Allah'ın işaretlerinden biriydi. {kaynak: Şadharat-Dhaba s. 366-367}"
  id: "Ulama Abdullah bin Ahmad al-Fakihi al-Makki al-Shafi’i al-Nahwi; ibunya adalah seorang budak perempuan dari Abyssinia dan ia lahir pada tahun 899 H. Beliau adalah salah satu ulama besar, yang terlibat dalam semua ilmu pengetahuan, dan beliau memiliki karya-karya yang bermanfaat, termasuk tafsir atas kitab al-Ajrumiyya dan tafsir atas suplemennya karya al-Khattab, di mana beliau sangat unggul. Beliau juga menulis tafsir atas kitab Qatr al-Nada karya Ibn Hisham, yang sangat bagus, dan beliau menulisnya pada tahun 916 H ketika beliau berusia delapan belas tahun. Ketika beliau melakukan perjalanan ke Mesir, beliau menemukan sekelompok orang yang sedang membacanya, dan mereka memiliki masalah dengan sebagian isinya, sehingga beliau menjawab masalah tersebut, tetapi mereka tidak mempercayai jawabannya karena mereka tidak tahu bahwa beliau adalah penulisnya, sampai beliau memberi tahu mereka bahwa beliau adalah penafsirnya dan beliau memiliki saksi dari kalangan penduduk Mekah yang hadir untuk memberikan kesaksian tentang hal itu. Dia juga menulis komentar tentang al-Mulha dan menyimpulkan batasan tata bahasa dalam sebuah buku kecil, kemudian dia juga menulis komentar tentangnya di Awars, dan tidak ada seorang pun yang mendahuluinya dalam melakukan hal seperti itu. Singkatnya, dia tidak memiliki tandingan pada zamannya dalam ilmu tata bahasa, karena dia adalah tanda dari tanda-tanda Tuhan di bidang itu. {cite:shadharat-dhahab hlm. 366-367}."
