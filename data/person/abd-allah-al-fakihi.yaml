summary:
  ar: "العلامة عبد الله بن أحمد الفاكهي المكي الشافعي النحوي؛ أمه أم ولد حبشية وولد سنة تسع وتسعين وثمانمائة، وكان من كبار العلماء مشاركاً في جميع العلوم، وله مصنفات مفيدة منها شرح الآجرومية وشرح على متممها للخطاب أجاد فيهما كل الإجادة، وشرح على قطر الندى لابن هشام في غاية الحسن صنفه عام ستة عشر وتسعمائة وعمره حينئذ ثمانية عشر سنة — ولما سار إلى مصر وجد جماعة يقرؤونه وقد أشكل عليهم محل منه فأجابهم عن الإشكال فلم يثقوا بالجواب لعدم علمهم بأنه مصنفه حتى أخبرهم أنه هو الشارح واستشهد على ذلك من كان هناك من المكيين — وشرح الملحة واستنبط حدوداً للنحو في نحو كراسة ثم شرحها أيضاً في أوارس ولم يُسبق إلى مثل ذلك؛ وبالجملة فإنه لم يكن له نظير في زمانه في علم النحو فإنه كان فيه آية من آيات الله {cite:shadharat-dhahab p. 366-367}."
  en: "Al-Fakihi of Mecca — son of an Abyssinian freedwoman, b. 899; he wrote his Qatr al-Nada sharh at eighteen and found it already being read in Cairo — answering the students' difficulty, they would not believe him until he proved the author was himself; he coined definitions of nahw in a booklet then commented them — 'unprecedented'; 'he had no peer in his time in grammar, he was a sign of God's signs' {cite:shadharat-dhahab p. 366-367}."
