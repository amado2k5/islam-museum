summary:
  ar: "صحفي ومؤلف أمريكي من أصل هندي، وُلد في مومباي سنة 1964. كان مدير تحرير «فورين أفيرز» ومحرر «نيوزويك إنترناشيونال»، ويقدّم منذ 2008 برنامج «جي بي إس» على سي إن إن، ومن كتبه «مستقبل الحرية» (2003) و«العالم ما بعد الأمريكي» (2008) و«عصر الثورات» (2024)؛ ومنحته الهند وسام بادما بوشان سنة 2010."
  en: "Indian-American journalist and author, born in Mumbai in 1964. A former managing editor of Foreign Affairs and editor of Newsweek International, he has hosted CNN's Fareed Zakaria GPS since 2008 and wrote The Future of Freedom (2003), The Post-American World (2008) and Age of Revolutions (2024); India awarded him the Padma Bhushan in 2010."
  ur: "بھارتی نژاد امریکی صحافی اور مصنف، جو 1964 میں ممبئی میں پیدا ہوئے۔ فارن افیئرز کے منیجنگ ایڈیٹر اور نیوز ویک انٹرنیشنل کے مدیر رہے؛ 2008 سے سی این این پر «فرید زکریا جی پی ایس» پیش کر رہے ہیں؛ ان کی کتابوں میں «دی فیوچر آف فریڈم» (2003)، «دی پوسٹ امریکن ورلڈ» (2008) اور «ایج آف ریوولوشنز» (2024) شامل ہیں؛ بھارت نے 2010 میں انہیں پدما بھوشن دیا۔"

