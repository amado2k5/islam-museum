id: person/zawbaa-al-kahina
class: person
label: { ar: "زوبعة الكاهنة", en: "Zawba'a the seeress", es: "Zawba'a the seeress", fr: "Zawba'a the seeress", ur: "زَوَبَعَا سیریس" }
summary:
  ar: "من كهان العرب الذين عدّهم المسعودي فيمن كان به نقصان الأجسام وتشويه الخلق على طريقة الكهنة، مع شق وسطيح وسمّلقة وسديف بن هوماس وطريفة وعمران أخي مزيقياء وحارثة وجهينة وكاهنة باهلة {cite:muruj-al-dhahab p. 484}."
  en: "One of the Arab kahins marked, in al-Mas'udi's report, by bodily defect — listed with Shiqq, Satih, Sammalqa, Sadif, Tarifa, Muzayqiya's brother, Haritha, Juhayna and the Bahila seeress {cite:muruj-al-dhahab p. 484}."
  es: "Uno de los kahins árabes marcados, en el informe de al-Mas'udi, por un defecto corporal, incluido con Shiqq, Satih, Sammalqa, Sadif, Tarifa, el hermano de Muzayqiya, Haritha, Juhayna y la vidente Bahila {citar:muruj-al-dhahab p. 484}."
  fr: "L'un des kahins arabes marqués, dans le rapport d'al-Mas'udi, par un défaut corporel - répertoriés avec Shiqq, Satih, Sammalqa, Sadif, Tarifa, le frère de Muzayqiya, Haritha, Juhayna et la voyante Bahila {cite: muruj-al-dhahab p. 484}."
  ur: "المسعودی کی رپورٹ میں، جسمانی عیب کے لحاظ سے عرب کاہنوں میں سے ایک کو نشان زد کیا گیا ہے - جس کا ذکر شق، صحیح، صملقا، صدف، طریفہ، مزاقیہ کے بھائی، حارثہ، جہینہ اور بحیلہ سیریس کے ساتھ کیا گیا ہے۔ 484}۔"
  tr: "El-Mes'udi'nin rahiplik davranışlarında fiziksel eksiklikler ve bozulmalar yaşayanlar arasında saydığı Arap rahipler arasında, Shaq Satih, Samalqa, Saif ibn Homas, Tarifa ve İmran Akhi Muziqiya, Haritha, Juhayna, Bahila rahipleri (atıf:muruj-al-dhahab, s. 484} de vardı."
  id: "Di antara para imam Arab yang dihitung al-Mas'udi termasuk mereka yang mengalami kekurangan fisik dan distorsi dalam cara para imam, bersama dengan Shaq Satih, Samalqa, Saif ibn Homas, Tarifa, dan Imran Akhi Muziqiya, Haritha, Juhayna, dan para imam Bahila {cite:muruj-al-dhahab, hlm. 484}."
