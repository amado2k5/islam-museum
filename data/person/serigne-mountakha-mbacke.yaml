summary:
  ar: "عالم سنغالي معاصر، حفيد الشيخ أحمدو بمبا مؤسس المريدية وابن سيرين محمدو بصيرو مباكي، والخليفة العام الثامن والحالي للمريدية منذ يناير 2018. عُرف بتدخلاته العامة في الشأن السنغالي، منها دعوته عثمان سونكو سنة 2023 إلى إنهاء إضرابه عن الطعام ومنعه الحملات الانتخابية في طوبى."
  en: "Living Senegalese scholar, grandson of Sheikh Ahmadou Bamba, founder of the Mourides, and son of Serigne Mouhamadou Bassirou Mbacké; he is the eighth and current caliph-general of the Mourides, in office since January 2018. He is known for public interventions in Senegalese affairs, among them his 2023 appeal to Ousmane Sonko to end his hunger strike and his ban on election campaigning at Touba."
  ur: "سینیگال کے زندہ عالم، مریدیہ کے بانی شیخ احمد بمبا کے پوتے اور سیرین محمدو بصیرو مباکی کے فرزند؛ وہ جنوری 2018ء سے مریدیہ کے آٹھویں اور موجودہ خلیفہ عام ہیں۔ وہ سینیگال کے معاملات میں عوامی مداخلتوں کے لیے معروف ہیں، جن میں 2023ء میں عثمان سونکو سے بھوک ہڑتال ختم کرنے کی اپیل اور طوبیٰ میں انتخابی مہم پر پابندی شامل ہے۔"
