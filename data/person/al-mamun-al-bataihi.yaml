summary:
  ar: "أبو عبد الله البطائحي الملقب بالمأمون، وزير الخليفة الفاطمي الآمر؛ نشأ فقيراً فرفعه الأفضل من الفراشين إلى الوزارة، وهزم لواتة الغازية ديار مصر، وصلبه الآمر سنة 519هـ لما أعلم أنه أسلّ أخاه جعفراً ليقتله."
  en: "Abu Abd Allah al-Bata'ihi (al-Ma'mun), vizier of the Fatimid al-Amir; raised from poverty by al-Afdal to the vizierate, he defeated the invading Lawata, and al-Amir crucified him in 519 AH when told he had suborned the caliph's brother Ja'far to kill him."
  fr: "Abu Abd Allah al-Bata'ihi (al-Ma'mun), vizir du Fatimide al-Amir ; élevé de la pauvreté par al-Afdal au vizirat, il a vaincu l'envahisseur Lawata, et al-Amir l'a crucifié en 519 de l’hégire quand on lui a dit qu'il avait suborné le frère du calife Ja'far pour le tuer."
