summary:
  ar: "أبو عبد الله البطائحي الملقب بالمأمون، وزير الخليفة الفاطمي الآمر؛ نشأ فقيراً فرفعه الأفضل من الفراشين إلى الوزارة، وهزم لواتة الغازية ديار مصر، وصلبه الآمر سنة 519هـ لما أعلم أنه أسلّ أخاه جعفراً ليقتله."
  en: "Abu Abd Allah al-Bata'ihi (al-Ma'mun), vizier of the Fatimid al-Amir; raised from poverty by al-Afdal to the vizierate, he defeated the invading Lawata, and al-Amir crucified him in 519 AH when told he had suborned the caliph's brother Ja'far to kill him."
  fr: "Abu Abd Allah al-Bata'ihi (al-Ma'mun), vizir du Fatimide al-Amir ; élevé de la pauvreté par al-Afdal au vizirat, il a vaincu l'envahisseur Lawata, et al-Amir l'a crucifié en 519 de l’hégire quand on lui a dit qu'il avait suborné le frère du calife Ja'far pour le tuer."
  es: "Abu Abd Allah al-Bata'ihi (al-Ma'mun), visir del fatimí al-Amir; fue elevado de la pobreza al visir por al-Afdal, derrotó a los invasores Lawata, y al-Amir lo crucificó en el año 519 de la Hégira cuando le dijeron que había sobornado al hermano del califa, Ja'far, para que lo matara."
  ur: "ابو عبد اللہ البطیحی ⁦(المامون)⁩، فاطمی امیر کے وزیر؛ الافضل کی طرف سے غربت سے اٹھا کر وزیریٹ تک پہنچا، اس نے حملہ آور لواتا کو شکست دی، اور الامیر نے اسے 519 ہجری میں اس وقت مصلوب کر دیا جب بتایا کہ اس نے خلیفہ کے بھائی جعفر کو اس کے قتل کے لیے تابع کر دیا ہے۔"
  tr: "Fatımi halifesi el-Amir'in bakanı Ebu Abdullah el-Bata'ihi, lakaplı el-Ma'mun; fakir bir ailede büyüdü, ancak en iyi fardlar onu vezirliğe terfi ettirdi. Mısır'ın istilacı toprakları Luwta'yı yendi ve hükümdar, kardeşi Ca'far'dan kendisini öldürmesi için yalvardığını öğrendikten sonra 519 Hicri yılında onu çarmıha gerdi."
  id: "Abu Abdullah al-Bata'ihi, yang dijuluki al-Ma'mun, menteri khalifah Fatimiyah al-Amir; ia tumbuh dalam kemiskinan, tetapi para fard terbaik mempromosikannya menjadi wazir. Ia mengalahkan Luwta di tanah Mesir yang menyerbu, dan penguasa menyalibnya pada tahun 519 H setelah mengetahui bahwa ia telah memohon kepada saudaranya Ja'far untuk membunuhnya."
