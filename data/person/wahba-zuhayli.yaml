summary:
  ar: "فقيه سوري (1932–2015) وُلد في دير عطية، وتولى رئاسة قسم الفقه الإسلامي ومذاهبه في كلية الشريعة بجامعة دمشق. ألّف أكثر من مئة وستين كتابا، من أشهرها «الفقه الإسلامي وأدلته» و«التفسير المنير»، وكان من الموقّعين على رسالة عمان ووثيقة كلمة سواء."
  en: "Syrian Islamic jurist and professor (1932–2015), born at Deir Atiyah and long chairman of Islamic jurisprudence at Damascus University's College of Sharia. He wrote more than 160 works, among them the comparative compendium al-Fiqh al-Islami wa Adillatuhu and the Tafsir al-Munir, and was a signatory of the Amman Message and A Common Word."
  ur: "سوری فقیہ اور استاد (1932ء–2015ء)، دیر عطیہ میں پیدا ہوئے اور مدت تک جامعہ دمشق کے کلیہ شریعہ میں شعبہ فقہ اسلامی کے سربراہ رہے۔ ان کی تصانیف ایک سو ساٹھ سے زائد ہیں، جن میں «الفقہ الاسلامی و ادلتہ» اور «التفسیر المنیر» مشہور ہیں؛ وہ رسالہ عمان اور دستاویز «کلمہ سواء» کے دستخط کنندگان میں سے تھے۔"
