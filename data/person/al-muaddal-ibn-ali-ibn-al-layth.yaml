id: person/al-muaddal-ibn-ali-ibn-al-layth
class: person
label: { ar: "المعدل بن علي بن الليث الصفار", en: "al-Mu'addal ibn Ali ibn al-Layth al-Saffar", fr: "al-Mu'addal ibn Ali ibn al-Layth al-Saffar", es: "al-Mu'addal ibn Ali ibn al-Layth al-Saffar", ur: "المعدل بن علی ابن لیث الصفار" }
summary:
  ar: "آخر أمراء الصفاريين على سجستان؛ حاصره الجيش الساماني بقيادة الحسين بن علي المروروذي سنة 298هـ فصالحه واستأمن له وأخذه أسيراً معه إلى بخارى، وأمر الأمير أحمد بن إسماعيل بحمله وسبكري إلى بغداد فأُدخلاها مشهورين على فيلين {cite:kamil-ibn-al-athir p. 47}."
  en: "The last Saffarid amir of Sistan; besieged by the Samanid army in 298, he took safe-conduct and was carried captive to Bukhara, then paraded into Baghdad on an elephant {cite:kamil-ibn-al-athir p. 47}."
  fr: "Dernier émir saffaride du Sistan, assiégé par l'armée samanide en 298, il a pris un sauf-conduit et a été emmené captif à Boukhara, puis a défilé à Bagdad sur un éléphant {cite:kamil-ibn-al-athir p. 47}."
  es: "El último emir saffarí de Sistán; asediado por el ejército samaní en 298, obtuvo salvoconducto y fue llevado cautivo a Bujará, luego exhibido en Bagdad sobre un elefante {cite:kamil-ibn-al-athir p. 47}."
  ur: "سیستان کا آخری صفری امیر؛ سامانی فوج نے 298 میں محاصرہ کیا، اس نے محفوظ طریقے سے کام لیا اور اسے اسیر بنا کر بخارا لے جایا گیا، پھر ہاتھی پر سوار ہو کر بغداد روانہ ہوا۔ 47}۔"
  tr: "Sijistan'daki son Saffari prensleri, 298 Hicri'de el-Hüseyin bin Ali el-Marvudhi komutasındaki Samanî ordusu tarafından kuşatıldı; ordu onunla barıştı, güvenini kazandı ve onu esir olarak Buhara'ya götürdü. Prens Ahmed bin İsmail, onun nakliyesini ve banliyölerini Bağdat'a götürdü; burada iki ünlü fil ile birlikte şehre getirildiler {atıf:kamil-ibn-al-athir s. 47}."
  id: "Pangeran Saffarid terakhir di Sijistan dikepung oleh tentara Samanid yang dipimpin oleh al-Husayn ibn Ali al-Marwudhi pada tahun 298 H, yang berdamai dengannya, mengamankan kepercayaannya, dan membawanya menjadi tawanan ke Bukhara. Pangeran Ahmad ibn Ismail memerintahkan transportasi dan pinggiran kota ke Baghdad, di mana mereka dibawa ke kota bersama dua gajah terkenal {cite:kamil-ibn-al-athir hlm. 47}."
