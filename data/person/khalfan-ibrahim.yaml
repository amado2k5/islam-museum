summary:
  ar: "جناح قطري معتزل وُلد في الدوحة سنة 1988. نال جائزة أفضل لاعب في آسيا سنة 2006 فكان أول قطري يفوز بها، وقضى معظم مسيرته مع السد (2004–2017) الذي فاز معه بدوري أبطال آسيا 2011، ولُقب بمارادونا قطر."
  en: "Retired Qatari winger born in Doha in 1988. He won the 2006 Asian Player of the Year award, the first Qatari to do so, spent most of his career with Al Sadd (2004–2017), winning the 2011 AFC Champions League, and was dubbed the 'Maradona of Qatar'."
