id: person/al-mamun-ibn-dhi-al-nun
class: person
label: { ar: "المأمون القادر بن ذي النون" }
summary:
  ar: "يحيى بن إسماعيل القادر بالله بن المأمون بن ذي النون آخر ملوك بني ذي النون بطليطلة؛ حكى ابن بدرون أنه بنى بها قصراً تأنق في بنائه وصنع فيه بحيرة وبنى في وسطها قبة وسيق الماء إلى رأسها فكان ينزل من أعلى القبة حواليها محيطاً بها فكانت القبة في غلالة من ماء سكب لا يفتر وهو قاعد فيها لا يمسه الماء حتى سمع منشداً ينشد أتبني بناء الخالدين وإنما بقاؤك فيها لو علمت قليل فلم يلبث إلا يسيراً حتى قضى نحبه، ثم حاصر الأذفونش طليطلة فأخذها منه سنة ثمان وسبعين وأربعمائة بعد حصار طال حتى قيل سبع سنين، وخرج منها على أقبح صورة وأفظع سيرة وبيده إصطرلاب يأخذ به وقتاً يرحل فيه فتعجب منه المسلمون وضحك عليه الكافرون {cite:nafh-tib-maqqari p. 352-353, 447}."
  en: "Yahya al-Qadir ibn Dhi-l-Nun, last king of Toledo; famed for the palace whose dome sat in a veil of falling water — until a reciter's verse on the builders-for-eternity foretold his end — then expelled by Alfonso in 478 after a long siege, leaving in the ugliest guise, astrolabe in hand to time his departure, at which 'the Muslims marvelled and the unbelievers laughed' {cite:nafh-tib-maqqari p. 352-353, 447}."
