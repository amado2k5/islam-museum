summary:
  ar: "يحيى بن إسماعيل القادر بالله بن المأمون بن ذي النون آخر ملوك بني ذي النون بطليطلة؛ حكى ابن بدرون أنه بنى بها قصراً تأنق في بنائه وصنع فيه بحيرة وبنى في وسطها قبة وسيق الماء إلى رأسها فكان ينزل من أعلى القبة حواليها محيطاً بها فكانت القبة في غلالة من ماء سكب لا يفتر وهو قاعد فيها لا يمسه الماء حتى سمع منشداً ينشد أتبني بناء الخالدين وإنما بقاؤك فيها لو علمت قليل فلم يلبث إلا يسيراً حتى قضى نحبه، ثم حاصر الأذفونش طليطلة فأخذها منه سنة ثمان وسبعين وأربعمائة بعد حصار طال حتى قيل سبع سنين، وخرج منها على أقبح صورة وأفظع سيرة وبيده إصطرلاب يأخذ به وقتاً يرحل فيه فتعجب منه المسلمون وضحك عليه الكافرون {cite:nafh-tib-maqqari p. 352-353, 447}."
  en: "Yahya al-Qadir ibn Dhi-l-Nun, last king of Toledo; famed for the palace whose dome sat in a veil of falling water — until a reciter's verse on the builders-for-eternity foretold his end — then expelled by Alfonso in 478 after a long siege, leaving in the ugliest guise, astrolabe in hand to time his departure, at which 'the Muslims marvelled and the unbelievers laughed' {cite:nafh-tib-maqqari p. 352-353, 447}."
  fr: "Yahya al-Qadir ibn Dhi-l-Nun, dernier roi de Tolède ; célèbre pour le palais dont la coupole était assise dans un voile d'eau tombant - jusqu'à ce que le verset d'un récitateur sur les constructeurs-pour-éternité prédit sa fin - puis expulsé par Alphonse en 478 après un long siège, laissant sous la forme la plus laid, astrolabe en main pour chronométrer son départ {cite:nafh-tib-maqqari p. 352-353, 447}."
  es: "Yahya al-Qadir ibn Dhi-l-Nun, último rey de Toledo; famoso por el palacio cuya cúpula se encontraba en un velo de agua que caía —hasta que un verso recitado por un narrador sobre los constructores para la eternidad predijo su fin—, luego expulsado por Alfonso en 478 después de un largo asedio, saliendo con la apariencia más fea, astrolabio en mano para cronometrar su partida, ante lo cual \"los musulmanes se maravillaron y los incrédulos se rieron\" {cite:nafh-tib-maqqari p. 352-353, 447}."
  ur: "یحییٰ القادر بن ذی النون، ٹولیڈو کا آخری بادشاہ؛ اس محل کے لیے مشہور ہے جس کا گنبد گرتے ہوئے پانی کے پردے میں بیٹھا تھا - یہاں تک کہ تعمیر کرنے والوں کے بارے میں ایک تلاوت کرنے والے کی آیت نے اس کے انجام کی پیشین گوئی کی - پھر 478 میں الفانسو نے طویل محاصرے کے بعد نکال دیا، بدصورت بھیس میں، اسٹرولاب ہاتھ میں لے کر اس کی روانگی، جس پر مسلمان ہنس پڑے اور 'مسلمانوں نے قہقہے لگائے' {حوالہ: نفح تبع مقری ص۔ 352-353، 447}۔"
