summary:
  ar: "شيخ المشايخ برهان الدين إبراهيم ابن القلقشندي الشافعي؛ كان من الرحالة والحفاظ، وسمع على شيخ الإسلام ابن حجر وجلال الدين البلقيني والبدر الدميري والسخاوي، وكان آخر من روى عن تلك الطبقة؛ مات يوم الثلاثاء عاشر جمادى الآخرة سنة اثنتين وعشرين وتسعمائة عن إحدى وتسعين سنة {cite:shadharat-dhahab p. 473}."
  en: "The last transmitter of Ibn Hajar's generation — a travelling hafiz who heard al-Bulqini, al-Damiri and al-Sakhawi too; d. Tuesday 10 Jumada II 922, aged ninety-one {cite:shadharat-dhahab p. 473}."
