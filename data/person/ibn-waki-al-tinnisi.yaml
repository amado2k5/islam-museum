summary:
  ar: "أبو محمد الحسن بن علي بن أحمد بن محمد، المعروف بابن وكيع، أصله من بغداد ومولده بتنيس؛ ذكره أبو منصور الثعالبي في يتيمة الدهر وقال في حقه: شاعر بارع وعالم جامع قد برع على أهل زمانه لم يتقدمه أحد في أوانه، وله كتب بديعة وديوان شعر، وجمع كتاباً بين فيه سرقات أبي الطيب المتنبي {cite:wafayat-ayan}."
  en: "Ibn Waki' al-Tinnisi — born at Tinnis of Baghdadi stock; al-Tha'alibi called him the unsurpassed poet-scholar of his age; compiled a book on al-Mutanabbi's borrowings {cite:wafayat-ayan}."
  es: "Ibn Waki' al-Tinnisi — nació en Tinnis, de ascendencia bagdadí; al-Tha'alibi lo llamó el poeta-erudito insuperable de su época; compiló un libro sobre los préstamos de al-Mutanabbi {cite:wafayat-ayan}."
  fr: "Ibn Waki' al-Tinnisi — né à Tinnis de souche bagdadien; al-Tha'alibi l'a qualifié de poète-érudit inégalé de son époque; a compilé un livre sur les emprunts d'al-Mutanabbi {cite:wafayat-ayan}."
  ur: "ابن وکیع التنیسی - بغدادی اسٹاک کے طنیس میں پیدا ہوئے۔ الثعلبی نے انہیں اپنے زمانے کا بے مثال شاعر اسکالر کہا۔ المتنبی کے ادھار پر ایک کتاب تالیف کی۔"
