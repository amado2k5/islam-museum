summary:
  ar: "ثوري وسياسي من شعب المورو في سولو، وُلد في تابول سنة 1939. كان محاضرا في جامعة الفلبين، فأسّس الجبهة الوطنية لتحرير مورو وقادها منذ 1972، ووقّع اتفاق السلام سنة 1996 مع الحكومة الفلبينية، وحكم منطقة الحكم الذاتي في مينداناو المسلمة من 1996 إلى 2001؛ ثم جاءت سنوات التمرد الفاشل وأزمة زامبوانغا 2013 وإدانته بالفساد وتعيينه مبعوثا اقتصاديا خاصا للفلبين لدى منظمة التعاون الإسلامي."
  en: "Moro revolutionary and politician from Sulu, born at Tapul in 1939. A former University of the Philippines lecturer, he founded the Moro National Liberation Front and has led it since 1972, signed the 1996 peace agreement with the Philippine government, and governed the Autonomous Region in Muslim Mindanao from 1996 to 2001; his later years brought a failed rebellion, the 2013 Zamboanga crisis, a graft conviction, and appointment as the Philippines' special economic envoy on Islamic affairs to the Organisation of Islamic Cooperation."
  ur: "سولو سے تعلق رکھنے والے مورو انقلابی اور سیاست دان، 1939ء میں تاپول میں پیدا ہوئے۔ وہ یونیورسٹی آف دی فلپائنز کے سابق لیکچرار تھے؛ انھوں نے مورو نیشنل لبریشن فرنٹ کی بنیاد رکھی اور 1972ء سے اس کی قیادت کر رہے ہیں، 1996ء میں فلپائنی حکومت سے امن معاہدے پر دستخط کیے اور 1996ء سے 2001ء تک مسلم مندناؤ کے خود مختار علاقے کے گورنر رہے؛ بعد کے برسوں میں ناکام بغاوت، 2013ء کا زامبوانگا بحران، بدعنوانی میں سزا اور اسلامی تعاون تنظیم کے لیے فلپائنز کے خصوصی اقتصادی ایلچی کی تقرری آئی۔"
