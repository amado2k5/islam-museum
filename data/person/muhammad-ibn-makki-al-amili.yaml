summary:
  ar: "محمد بن مكي بن محمد بن حامد العاملي النبطي الجزيني، شمس الدين، الملقب بالشهيد الأول، فقيه إمامي من جبل عامل، رحل إلى العراق والحجاز ومصر ودمشق وفلسطين، وسجن في قلعة دمشق ثم ضربت عنقه، من سنة 734 إلى 786 هـ الموافقة 1333 إلى 1384 م."
  en: "Muhammad ibn Makki ibn Muhammad ibn Hamid al-Amili al-Nabati al-Jizzini, Shams al-Din, called al-Shahid al-Awwal, an Imami (Twelver Shi'i) jurist of Jabal Amil who travelled to Iraq, the Hijaz, Egypt, Damascus and Palestine, was imprisoned in the citadel of Damascus and then beheaded, 734 to 786 AH (1333 to 1384 CE)."
