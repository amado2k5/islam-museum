summary:
  ar: "محمد بن مكي بن محمد بن حامد العاملي النبطي الجزيني، شمس الدين، الملقب بالشهيد الأول، فقيه إمامي من جبل عامل، رحل إلى العراق والحجاز ومصر ودمشق وفلسطين، وسجن في قلعة دمشق ثم ضربت عنقه، من سنة 734 إلى 786 هـ الموافقة 1333 إلى 1384 م."
  en: "Muhammad ibn Makki ibn Muhammad ibn Hamid al-Amili al-Nabati al-Jizzini, Shams al-Din, called al-Shahid al-Awwal, an Imami (Twelver Shi'i) jurist of Jabal Amil who travelled to Iraq, the Hijaz, Egypt, Damascus and Palestine, was imprisoned in the citadel of Damascus and then beheaded, 734 to 786 AH (1333 to 1384 CE)."
  es: "Muhammad ibn Makki ibn Muhammad ibn Hamid al-Amili al-Nabati al-Jizzini, Shams al-Din, llamado al-Shahid al-Awwal, un jurista imamí (chií duodecimano) de Jabal Amil que viajó a Irak, el Hiyaz, Egipto, Damasco y Palestina, fue encarcelado en la ciudadela de Damasco y luego decapitado, entre 734 y 786 AH (1333 y 1384 d. C.)."
  fr: "Muhammad ibn Makki ibn Muhammad ibn Hamid al-Amili al-Nabati al-Jizzini, Shams al-Din, appelé al-Shahid al-Awwal, un juriste Imami (chiite duodécimain) de Jabal Amil qui voyagea en Irak, dans le Hedjaz, en Égypte, à Damas et en Palestine, fut emprisonné dans la citadelle de Damas puis décapité, de 734 à 786 AH (1333 à 1384 CE)."
  ur: "محمد بن مکی بن محمد بن حامد العملی النباطی الجزینی، شمس الدین، جسے الشہد الاول کہا جاتا ہے، جبل عامل کے ایک امامی ⁦(بارہ شیعہ)⁩ فقیہ ہیں جنہوں نے عراق، حجاز، مصر، دمشق اور فلسطین کا سفر کیا، پھر اسے دمشق میں قید کر دیا گیا اور پھر 3000ء میں قید کیا گیا۔ 786ھ ⁦(1333 تا 1384 عیسوی)⁩۔"
