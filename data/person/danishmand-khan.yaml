summary:
  ar: "دانشمند خان (توفي سنة 1670)، واسمه الأصلي شفيعا اليزدي، عالم وجندي فارسي من يزد عمل تاجرًا في أحمد نكر ثم دخل في خدمة شاه جهان العسكرية، فمنحه سنة 1654/55 لقب «دانشمند خان» — أي السيد العالم — تقديرًا لعلمه، وصار مير بخشي في الإدارة المركزية في عهد أورنك زيب. وتدين معرفتنا به لرسائل الرحالة الفرنسي فرانسوا برنييه التي أبرزت علمه واهتمامه الكبير بعلوم الغرب، وأيّد الرحالة الإيطالي نيقولو مانوتشي صورة برنييه عنه."
  en: "Danishmand Khan (d. 1670), born Shafi'a Yazdi, was a Persian scholar and soldier from Yazd who worked as a merchant at Ahmednagar before entering Shah Jahan's military service, where in 1654/55 the emperor gave him the title Danishmand Khan — 'the learned lord' — in recognition of his learning; he later held the office of Mir Bakhshi in the central administration under Aurangzeb. Knowledge of him is owed chiefly to the letters of the French traveller François Bernier, who stressed his scholarship and his great interest in Western science, a portrait the Italian traveller Niccolò Manucci confirmed."
  ur: "دانشمند خان (وفات 1670ء)، اصل نام شفیعا یزدی، یزد کے فارسی عالم اور سپاہی تھے؛ احمد نگر میں تجارت کے بعد شاہ جہاں کی فوجی خدمت میں داخل ہوئے، جس نے 1654ء/55ء میں ان کے علم کے اعتراف میں انھیں «دانشمند خان» کا لقب دیا؛ بعد ازاں اورنگ زیب کے عہد میں مرکزی انتظامیہ میں میر بخشی کے عہدے پر فائز ہوئے۔ ان کے احوال کی معرفت زیادہ تر فرانسیسی سیاح فرانسوا برنیے کے خطوط کی مرہونِ منت ہے، جنھوں نے ان کے علم اور مغربی علوم میں گہری دلچسپی کو نمایاں کیا، اور اطالوی سیاح نیکولو مانوچی نے برنیے کی اس تصویر کی تائید کی۔"

