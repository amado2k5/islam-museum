summary:
  ar: "أبو الوليد يونس بن عبد الله بن محمد بن مغيث المعروف بابن الصفار، قاضي الجماعة بقرطبة؛ تفقه على أبي بكر بن درب وولي القضاء مع الخطابة والوزارة ونال رياسة الدين والدنيا، وكان فقيهاً صالحاً عدلاً حجة علامة في اللغة والعربية والشعر فصيحاً مفوّهاً كثير المحاسن له مصنفات في الزهد وغيره؛ توفي في رجب وله إحدى وسبعون سنة {cite:shadharat-dhahab p. 244}."
  en: "Abu al-Walid Yunus b. Abdallah b. Mughith, 'Ibn al-Saffar' — qadi of Cordoba who joined the judgeship to the pulpit and the vizierate, master of fiqh, Arabic and poetry, with works on asceticism; died in Rajab 429 aged seventy-one {cite:shadharat-dhahab p. 244}."
