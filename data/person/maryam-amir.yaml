summary:
  ar: "معلمة ومحاضرة أمريكية وحافظة للقرآن، منشئة تطبيق «قارئة» المجاني الذي يجمع تلاوات قارئات القرآن من النساء حول العالم؛ تحمل ماجستيرا في التربية من جامعة كاليفورنيا في لوس أنجلوس وبكالوريوسا ثانيا في الدراسات الإسلامية من جامعة الأزهر، ودرست في مصر خمس عشرة سنة، وقدّمت سلسلة «أبطال القرآن» على قناة إسلام تشانل، وأجرت معها بي بي سي والإذاعة الوطنية العامة وسي بي إس مقابلات."
  en: "American educator, lecturer and hafiza, creator of Qariah, the free app gathering women Quran reciters from around the world. She holds a master's in Education from UCLA and a second bachelor's in Islamic Studies from Al-Azhar University, studied in Egypt over fifteen years, hosted Islam Channel's Quran Champions series, and has been interviewed by the BBC, NPR and CBS."
  ur: "امریکی معلمہ، مقررہ اور حافظہ قرآن، «قاریہ» ایپ کی خالق، جو دنیا بھر کی خواتین قاریات کی تلاوتیں جمع کرتی ہے؛ انہوں نے یو سی ایل اے سے تعلیم میں ماسٹرز اور جامعہ ازہر سے اسلامی مطالعات میں دوسری بیچلر ڈگری حاصل کی، مصر میں پندرہ سال تعلیم پائی، اسلام چینل کی سیریز «قرآن چیمپئنز» پیش کی، اور بی بی سی، این پی آر اور سی بی ایس نے ان سے انٹرویو کیے۔"
