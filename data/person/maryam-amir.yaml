summary:
  ar: "معلمة ومحاضرة أمريكية وحافظة للقرآن، منشئة تطبيق «قارئة» المجاني الذي يجمع تلاوات قارئات القرآن من النساء حول العالم؛ تحمل ماجستيرا في التربية من جامعة كاليفورنيا في لوس أنجلوس وبكالوريوسا ثانيا في الدراسات الإسلامية من جامعة الأزهر، ودرست في مصر خمس عشرة سنة، وقدّمت سلسلة «أبطال القرآن» على قناة إسلام تشانل، وأجرت معها بي بي سي والإذاعة الوطنية العامة وسي بي إس مقابلات."
  en: "American educator, lecturer and hafiza, creator of Qariah, the free app gathering women Quran reciters from around the world. She holds a master's in Education from UCLA and a second bachelor's in Islamic Studies from Al-Azhar University, studied in Egypt over fifteen years, hosted Islam Channel's Quran Champions series, and has been interviewed by the BBC, NPR and CBS."
  ur: "امریکی معلمہ، مقررہ اور حافظہ قرآن، «قاریہ» ایپ کی خالق، جو دنیا بھر کی خواتین قاریات کی تلاوتیں جمع کرتی ہے؛ انہوں نے یو سی ایل اے سے تعلیم میں ماسٹرز اور جامعہ ازہر سے اسلامی مطالعات میں دوسری بیچلر ڈگری حاصل کی، مصر میں پندرہ سال تعلیم پائی، اسلام چینل کی سیریز «قرآن چیمپئنز» پیش کی، اور بی بی سی، این پی آر اور سی بی ایس نے ان سے انٹرویو کیے۔"
  es: "Educadora, conferenciante y hafiza estadounidense, creadora de Qariah, la aplicación gratuita que reúne a mujeres recitadoras del Corán de todo el mundo. Posee una maestría en Educación por la UCLA y una segunda licenciatura en Estudios Islámicos por la Universidad de Al-Azhar. Estudió en Egipto durante más de quince años, presentó la serie «Quran Champions» de Islam Channel y ha sido entrevistada por la BBC, NPR y CBS."
  fr: "Éducatrice, conférencière et hafiza américaine, elle est la créatrice de Qariah, une application gratuite qui rassemble des récitantes du Coran du monde entier. Titulaire d'une maîtrise en éducation de l'UCLA et d'une licence en études islamiques de l'université Al-Azhar, elle a étudié en Égypte pendant plus de quinze ans, a animé l'émission « Quran Champions » sur Islam Channel et a été interviewée par la BBC, NPR et CBS."
  tr: "Amerikalı bir öğretmen, öğretim görevlisi ve Kur'an ezbercisi olan Sher, dünyanın dört bir yanındaki kadınlardan kadın Kur'an okunucularının okumalarını toplayan ücretsiz \"Qari'ah\" uygulamasının kurucusudur. Kaliforniya Üniversitesi, Los Angeles'tan eğitim alanında yüksek lisans ve Al-Azhar Üniversitesi'nden İslam çalışmaları alanında ikinci lisans derecesine sahiptir. Mısır'da on beş yıl eğitim gördü, Islam Channel'da \"Kur'an Kahramanları\" dizisini sundu ve BBC, National Public Radio ve CBS ile röportajlar yaptı."
  id: "Sebagai guru, dosen, dan penghafal Al-Qur'an asal Amerika, ia adalah pendiri aplikasi gratis \"Qari'ah,\" yang mengumpulkan pembacaan dari para pembaca Al-Qur'an perempuan dari berbagai wanita di seluruh dunia. Ia meraih gelar master pendidikan dari University of California, Los Angeles, dan gelar sarjana kedua dalam studi Islam dari Al-Azhar University. Ia belajar di Mesir selama lima belas tahun, membawakan serial \"Heroes of the Quran\" di Islam Channel, dan melakukan wawancara dengan BBC, National Public Radio, dan CBS."
