summary:
  ar: "كاتب نيسابوري من أواخر القرن الرابع الهجري؛ صنّف «مفاتيح العلوم» موسوعةً لمصطلحات الدواوين والعلوم، وفي باب الديوان وصفَ الصك وكيف تُجمع فيه أسماء المستحقين وأرزاقهم ويوقّع السلطان بإجازتها {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}."
  en: "A Nishapuri secretary of the late tenth century; his Mafatih al-Ulum, an encyclopedia of chancery and scholarly terms, describes in the diwan chapter the sakk that gathers stipendiaries' names and dues under the ruler's authorising signature {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}."
  ur: "نیشاپور کا دسویں صدی کا کاتب؛ مفاتیح العلوم میں دفتری و علمی اصطلاحات سمیٹی، دیوان کے باب میں صک کی وضاحت کی: مستحقین کے نام و وظیفے جمع، حکمران کے دستخط سے اجازت {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}۔"
  es: "Un secretario de Nishapur de finales del siglo X; su Mafatih al-Ulum, una enciclopedia de términos cancilleros y académicos, describe en el capítulo del diwan el sakk que reúne los nombres y las cuotas de los estipendiarios bajo la firma autorizada del gobernante {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}."
  fr: "Un secrétaire Nishapuri de la fin du Xe siècle; son Mafatih al-Ulum, une encyclopédie de termes de chancellerie et savants, décrit dans le chapitre du diwan le sakk qui rassemble les noms et les créances des stipinataires sous la signature autorisante du souverain {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}."
  tr: "Dördüncü yüzyıl sonlarından Nişapuri yazarı olan Sher, diwan ve bilimsel terimler ansiklopedisi olan \"Mafatih al-Ulum\"u yazdı. Diwan bölümünde, aleti ve hak sahiplerinin isimlerinin ve geçimlerinin nasıl toplandığını, sultanın yetkilendirmelerini imzaladığını anlattı {atıf:Khwarizmi-mafatih-ulum-1930 diwan bölümü}."
  id: "Seorang penulis Nishapuri dari akhir abad keempat AH, ia menulis \"Mafatih al-Ulum,\" sebuah ensiklopedia istilah diwan dan ilmiah. Dalam bab Diwan, ia menjelaskan instrumen tersebut dan bagaimana nama-nama individu yang berhak dan kebutuhan mereka dikumpulkan, dan sultan menandatangani otorisasi mereka {cite:khwarizmi-mafatih-ulum-1930 bab diwan}."
