summary:
  ar: "غياث بن غوث التغلبي النصراني، شاعر الدولة الأموية؛ كان عبد الملك بن مروان يجزل عطاءه ويفضله على غيره من الشعراء، وأكثر من مدح الخلفاء الأمويين والدعاية لهم نحو ربع قرن، وكان من كبار شعراء عصره مع الفرزدق وجرير {cite:salabi-umayyad-state-2020 pp.37-38}."
  en: "Ghiyath ibn Ghawth al-Taghlibi, the Christian poet of the Umayyad state; Abd al-Malik ibn Marwan lavished gifts on him and preferred him over other poets; for some quarter of a century he praised the Umayyad caliphs and wrote much propaganda on their behalf, and he was among the great poets of his age alongside al-Farazdaq and Jarir {cite:salabi-umayyad-state-2020 pp.37-38}."
