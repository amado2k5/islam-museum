roles: [poet]
summary:
  ar: "غياث بن غوث التغلبي النصراني، شاعر الدولة الأموية؛ كان عبد الملك بن مروان يجزل عطاءه ويفضله على غيره من الشعراء، وأكثر من مدح الخلفاء الأمويين والدعاية لهم نحو ربع قرن، وكان من كبار شعراء عصره مع الفرزدق وجرير {cite:salabi-umayyad-state-2020 pp.37-38}."
  en: "Ghiyath ibn Ghawth al-Taghlibi, the Christian poet of the Umayyad state; Abd al-Malik ibn Marwan lavished gifts on him and preferred him over other poets; for some quarter of a century he praised the Umayyad caliphs and wrote much propaganda on their behalf, and he was among the great poets of his age alongside al-Farazdaq and Jarir {cite:salabi-umayyad-state-2020 pp.37-38}."
  fr: "Ghiyath ibn Ghawth al-Taghlibi, poète chrétien de l’État omeyyade ; Abd al-Malik ibn Marwan le combla de dons et le préféra aux autres poètes. Pendant environ un quart de siècle, il célébra les califes omeyyades et écrivit abondamment en leur faveur ; il comptait parmi les grands poètes de son époque avec al-Farazdaq et Jarir {cite:salabi-umayyad-state-2020 pp.37-38}."
  es: "Ghiyath ibn Ghawth al-Taghlibi, el poeta cristiano del estado omeya; Abd al-Malik ibn Marwan lo colmó de regalos y lo prefirió a otros poetas; durante aproximadamente un cuarto de siglo alabó a los califas omeyas y escribió mucha propaganda en su favor, y estuvo entre los grandes poetas de su época junto con al-Farazdaq y Jarir {cite:salabi-umayyad-state-2020 pp.37-38}."
  ur: "غیاث ابن غوث الطغلبی، اموی ریاست کے عیسائی شاعر؛ عبد الملک بن مروان نے ان پر تحفے تحائف دیے اور انہیں دوسرے شعراء پر ترجیح دی۔ ایک چوتھائی صدی تک اس نے اموی خلفاء کی تعریف کی اور ان کی طرف سے بہت زیادہ پروپیگنڈہ لکھا، اور وہ الفرزدق اور جریر کے ساتھ اپنے زمانے کے عظیم شاعروں میں سے تھے۔"
  tr: "Emevi devletinin şairi Ghiyath ibn Ghawth al-Taghlibi al-Nasrani; Abd al-Malik ibn Marwan onu cömertçe ödüllendirmiş ve diğer şairlere tercih etmiş, yaklaşık çeyrek yüzyıl boyunca Emevi halifelerini övmüş ve onların yükselişini desteklemiştir. Al-Farazdaq ve Jarir ile birlikte zamanının büyük şairlerinden biriydi. {cite:salabi-umayyad-state-2020 pp.37-38}"
  id: "Ghiyath ibn Ghawth al-Taghlibi al-Nasrani, penyair negara Umayyah; Abd al-Malik ibn Marwan memberinya penghargaan yang besar dan lebih memilihnya daripada penyair lain, dan dia memuji para khalifah Umayyah dan mempromosikan mereka selama sekitar seperempat abad, dan dia adalah salah satu penyair besar pada zamannya bersama dengan al-Farazdaq dan Jarir {cite:salabi-umayyad-state-2020 pp.37-38}."
