summary:
  en: "The Najjari Ansari who took the Prophet's baggage into his house when the she-camel knelt among Banu al-Najjar — 'a man stays with his baggage' — becoming the Prophet's host in Medina until the mosque and rooms were built. In al-Suhayli's report preserved by al-Samhudi, the house Tubba' built for the Prophet at his Yathrib conversion passed through heirs until it reached Abu Ayyub, descendant of the scholar Tubba' had lodged — so the Prophet's lodging closed that chain — and it is said, though the report is strange, that Tubba's gold-sealed letter was with Abu Ayyub when the Prophet arrived and he handed it over {cite:samhudi-wafa-al-wafa p. 200-201}."
  ar: "أنصاري نجاري بادر إلى رحل النبي فأدخله بيته حين بركت الناقة في بني النجار، وكان النبي يقول «المرء مع رحله»؛ فنزل عنده حتى بُني المسجد وحجراته، وصار مضيفه في المدينة. وعند السمهودي عن السهيلي أن الدار التي بنى تبّع للنبي حين أسلم بيثرب تداولها الملاك حتى صارت لأبي أيوب من ولد العالم الذي بنى له تبّع — فكان نزول النبي عنده إتماماً لذلك الأثر — ويُقال إن كتاب تبّع مختوماً بالذهب كان عند أبي أيوب حين نزل عليه النبي فدفعه إليه، وهو غريب {cite:samhudi-wafa-al-wafa p. 200-201}. وعند المسعودي علا يوم النهروان عبد الله بن وهب الراسبي فضربه على كتفه فأبان يده وقال بؤ بها إلى النار يا مارق، وشركه صعصعة بن صوحان في قتله فاحتزا رأسه وأتيا به علياً فقطب وقال شاه هذا الوجه حتى خيل إلينا أنه يبكي ثم قال قد كان أخو راسب حافظاً لكتاب الله تاركاً لحدود الله {cite:muruj-al-dhahab p. 47-48}"
