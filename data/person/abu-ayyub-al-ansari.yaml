education:
  did_you_know:
    ar: "أبو أيوب الأنصاري نجاري بادر إلى استقبال النبي مهاجراً فنزل في بيته حتى بُني حجره، وبقي في البيت ليخدمه."
    en: "Abu Ayyub al-Ansari, of Banu Najjar, was first to host the Prophet on his arrival as an emigrant, keeping him in his house until the Prophet's own quarters were built."
    ur: "ابو ایوب انصاری، بنو نجار سے، مہاجر آنے پر نبی کی میزبانی کرنے والے پہلے شخص تھے اور ان کے اپنا حجرہ بننے تک انہیں اپنے گھر رکھا۔"
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari]
