summary:
  en: "The Najjari Ansari who took the Prophet's baggage into his house when the she-camel knelt among Banu al-Najjar — 'a man stays with his baggage' — becoming the Prophet's host in Medina until the mosque and rooms were built. In al-Suhayli's report preserved by al-Samhudi, the house Tubba' built for the Prophet at his Yathrib conversion passed through heirs until it reached Abu Ayyub, descendant of the scholar Tubba' had lodged — so the Prophet's lodging closed that chain — and it is said, though the report is strange, that Tubba's gold-sealed letter was with Abu Ayyub when the Prophet arrived and he handed it over {cite:samhudi-wafa-al-wafa p. 200-201}."
  ar: "أنصاري نجاري بادر إلى رحل النبي فأدخله بيته حين بركت الناقة في بني النجار، وكان النبي يقول «المرء مع رحله»؛ فنزل عنده حتى بُني المسجد وحجراته، وصار مضيفه في المدينة. وعند السمهودي عن السهيلي أن الدار التي بنى تبّع للنبي حين أسلم بيثرب تداولها الملاك حتى صارت لأبي أيوب من ولد العالم الذي بنى له تبّع — فكان نزول النبي عنده إتماماً لذلك الأثر — ويُقال إن كتاب تبّع مختوماً بالذهب كان عند أبي أيوب حين نزل عليه النبي فدفعه إليه، وهو غريب {cite:samhudi-wafa-al-wafa p. 200-201}. وعند المسعودي علا يوم النهروان عبد الله بن وهب الراسبي فضربه على كتفه فأبان يده وقال بؤ بها إلى النار يا مارق، وشركه صعصعة بن صوحان في قتله فاحتزا رأسه وأتيا به علياً فقطب وقال شاه هذا الوجه حتى خيل إلينا أنه يبكي ثم قال قد كان أخو راسب حافظاً لكتاب الله تاركاً لحدود الله {cite:muruj-al-dhahab p. 47-48}"
  ur: "بنو نجار کے انصاری صحابی؛ ہجرت کے بعد نبی کا سامان اپنے گھر لے گئے اور مسجد اور حجروں کی تعمیر تک مدینہ میں ان کے میزبان رہے۔ {cite:mubarakpuri-raheeq}"
  fr: "L'Ansari des Banu al-Najjar qui fit entrer chez lui les bagages du Prophète lorsque la chamelle s'agenouilla parmi les Banu al-Najjar — « l'homme est avec ses bagages » —, devenant l'hôte du Prophète à Médine jusqu'à la construction de la mosquée et des chambres. Selon le récit d'al-Suhayli conservé par al-Samhudi, la maison que Tubba' bâtit pour le Prophète lors de sa conversion à Yathrib passa d'héritier en héritier jusqu'à Abu Ayyub, descendant du savant que Tubba' avait logé — si bien que l'hébergement du Prophète referma cette chaîne —, et l'on dit, bien que le récit soit étrange, que la lettre de Tubba' scellée d'or était chez Abu Ayyub à l'arrivée du Prophète et qu'il la lui remit {cite:samhudi-wafa-al-wafa p. 200-201}."
  es: "El Ansari Najjari que llevó el equipaje del Profeta a su casa cuando la camella se arrodilló entre los Banu al-Najjar —'un hombre se queda con su equipaje'— se convirtió en el anfitrión del Profeta en Medina hasta que se construyeron la mezquita y las habitaciones. En el relato de al-Suhayli conservado por al-Samhudi, la casa que Tubba' construyó para el Profeta en su conversión de Yathrib pasó por herederos hasta llegar a Abu Ayyub, descendiente del erudito en quien Tubba' se había hospedado —de modo que el alojamiento del Profeta cerró esa cadena— y se dice, aunque el relato es extraño, que la carta sellada con oro de Tubba estaba con Abu Ayyub cuando llegó el Profeta y se la entregó {cite:samhudi-wafa-al-wafa p. 200-201}."
