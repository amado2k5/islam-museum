summary:
  ar: "مقاتل مواي تاي وكيك بوكسر تايلاندي وُلد باسم سوباتشاي موينسانغ في فتهالونغ سنة 1990. تدرّب في بداياته عند بواكاو بانشاميك، وفاز ببطولة كونلون فايت سنة 2016، ثم أحرز بطولة ون للكيك بوكسينغ لوزن الريشة سنة 2021 حين أطاح بجورجيو بتروسيان، وعاد إلى اللقب سنة 2024، وحقق 117 انتصاراً."
  en: "Thai Muay Thai fighter and kickboxer, born Suppachai Muensang in Phatthalung in 1990. Trained early on under Buakaw Banchamek, he won the Kunlun Fight tournament in 2016, took the ONE Featherweight Kickboxing World Championship in 2021 by knocking out Giorgio Petrosyan, returned to the title in 2024, and compiled 117 wins."
  ur: "تھائی موئے تھائی فائٹر اور کک باکسر، 1990 میں فتھالونگ میں سوباتشائی موینسانگ کے نام سے پیدا ہوئے۔ ابتدا میں بواکاو بانچامیک کے زیر تربیت رہے، 2016 میں کونلون فائٹ ٹورنامنٹ جیتا، 2021 میں جورجیو پیٹروسیان کو ناک آؤٹ کر کے ون فیدر ویٹ کک باکسنگ ورلڈ چیمپئن شپ جیتی، 2024 میں دوبارہ یہ اعزاز حاصل کیا، اور 117 فتوحات اپنے نام کیں۔"
