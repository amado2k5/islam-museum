summary:
  ar: "المؤرخ الأندلسي المقيم بالمشرق أحمد بن محمد المقري الطنجي ⁦(ت 1041هـ/1632م)⁩، صاحب «نفح الطيب من غصن الأندلس الرطيب»؛ مسح نسخته على رف الحصاد."
  en: "The Andalusi historian resident in the East Ahmad ibn Muhammad al-Maqqari (d. 1041 AH/1632), author of Nafh al-Tib min Ghusn al-Andalus al-Ratib; his work is scanned on the harvest shelf."
  fr: "Historien d'al-Andalus établi en Orient, Ahmad ibn Muhammad al-Maqqari (mort en 1041 H/1632 ap. J.-C.), auteur de Nafh al-Tib min Ghusn al-Andalus al-Ratib ; son œuvre est numérisée sur l'étagère de collecte."
  es: "El historiador andalusí residente en el este, Ahmad ibn Muhammad al-Maqqari (m. 1041 AH/1632), autor de Nafh al-Tib min Ghusn al-Andalus al-Ratib; su obra está escaneada en el estante de la cosecha."
  ur: "مشرق میں رہنے والا اندلس کا مؤرخ احمد بن محمد المقاری ⁦(متوفی 1041ھ/1632)⁩، مصنف نفح الطب من غسن الاندلس الرطب؛ اس کا کام کٹائی کے شیلف پر اسکین کیا جاتا ہے۔"
  tr: "Doğu'da ikamet eden Endülüs tarihçisi Ahmed ibn Muhammed el-Makkari el-Tanji (ö. 1041 Hicri/1632 Miladi), \"Nafh al-Tayyib min Ghusn al-Andalus al-Ratib\" adlı eserin yazarıdır; hasat rafındaki kopyasını taradı."
  id: "Sejarawan Andalusia yang tinggal di Timur, Ahmad ibn Muhammad al-Maqqari al-Tanji (wafat 1041 H/1632 M), penulis “Nafh al-Tayyib min Ghusn al-Andalus al-Ratib”; ia memindai salinannya di rak hasil panen."
