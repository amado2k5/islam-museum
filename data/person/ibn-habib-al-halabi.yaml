summary:
  ar: "مؤرخ شافعي وكاتب مترسل، صاحب «درة الأسلاك في دولة الأتراك». ولد بدمشق في شعبان ٧١٠هـ ونُصب أبوه محتسباً بحلب فانتقل معه ونشأ فيها ونُسب إليها؛ سمع من إبراهيم بن مسلم ومن والده عمر ومن الفخر الدين بن خطيب برين، وسمع بالحلة ومصر والإسكندرية، ورحل إلى مصر والحجاز ثم استقر بحلب. باشر نيابة القضاء ونيابة كتابة السر، وكان يوقّع عن القضاة وانقطع في آخر عمره بعزله؛ وكان إمام عصره في صناعتي الإنشاء والشروط. صنف «درة الأسلاك في دولة الأتراك» ⁦(تاريخ دولة الترك)⁩ من ٦٤٨هـ إلى نحو ٧٧٧هـ، و«تذكرة النبيه في أيام المنصور وبنيه» و«النجم الثاقب» و«نسيم الصبا» و«كشف المروط» وغيرها؛ ومن تلاميذه ابن قاضي شهبة وسبط ابن الجمعة وعلاء الدين ابن خطيب الناصرية. توفي بربيع الآخر ٧٧٩هـ/١٣٧٧م بحلب عن نحو سبعين سنة، وذيّل على تاريخه ولده طاهر بن حبيب {cite:durar-kamina-jil-1993 2/29-30} {cite:nujum-zahira 11/189-190} {cite:al-aalam 2/218-219}."
  en: "A Shafi'i historian and chancery stylist, author of Durrat al-Aslak fi Dawlat al-Atrak. Born at Damascus in Sha'ban 710, he moved to Aleppo when his father was appointed its muhtasib, grew up there and took his nisba from it; he heard scholars at Aleppo, al-Hilla, Egypt and Alexandria, travelled to Egypt and the Hijaz, then settled at Aleppo. He served as deputy qadi and deputy secretary of the chancery, countersigned for the qadis, and in old age was dismissed; he was the master of his age in the arts of official letter-writing (insha') and notarial formulation (shurut). His works include the Durrat al-Aslak, a history of the 'Turks' (the Mamluk state) from 648 to about 777, Tadhkirat al-Nabih on al-Mansur Baybars and his sons, al-Najm al-Thaqib on the Prophet's biography, Nasim al-Saba and Kashf al-Marrut on Shafi'i fiqh; his pupils included Ibn Qadi Shuhba, Sibt Ibn al-Jum'a and 'Ala' al-Din Ibn Khatib al-Nasiriyya. He died at Aleppo in Rabi' II 779/1377 aged about seventy, and his son Tahir ibn Habib continued the history {cite:durar-kamina-jil-1993 2/29-30} {cite:nujum-zahira 11/189-190} {cite:al-aalam 2/218-219}."
  ur: "شافعی مؤرخ اور انشاء پرداز، صاحب «درۃ الاسلاک فی دولۃ الاتراک»۔ شعبان 710ھ میں دمشق میں پیدا ہوا؛ باپ حلب کا محتسب مقرر ہوا تو ساتھ گیا، وہیں پلا بڑھا اور اسی سے نسبت پائی۔ حلب، حلہ، مصر اور اسکندریہ کے علماء سے سمعات کیے، مصر اور حجاز کا سفر کیا، پھر حلب ہی میں رہا۔ نیابۃ القضاء اور نیابۃ کتابۃ السر کے منصب سنبھالے، قضاۃ کی جانب سے توقیع کرتا تھا اور آخری عمر میں عزل ہوا؛ انشاء اور شروط کی صنعتوں میں اپنے عصر کا امام تھا۔ تصانیف میں «درۃ الاسلاک» ⁦(648ھ سے تقریباً 777ھ تک دولۃ الاتراک کی تاریخ)⁩، «تذکرہ النبیہ فی ایام المنصور و بنیہ»، «النجم الثاقب»، «نسیم الصبا» اور «کشف المروط» شامل ہیں؛ تلامذہ میں ابن قاضی شہبہ، سبط ابن الجمعہ اور علاء الدین ابن خطیب ناصریہ ہیں۔ ربیع الآخر 779ھ/1377ء میں حلب میں وفات پائی، عمر قریباً ستر سال؛ اس کی تاریخ پر بیٹے طاہر بن حبیب نے ذیل لکھی {cite:durar-kamina-jil-1993 2/29-30} {cite:nujum-zahira 11/189-190} {cite:al-aalam 2/218-219}."
