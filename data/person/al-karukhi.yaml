summary:
  ar: "أبو الفتح الكروخي عبد الملك بن عبد الله الهروي نسبة إلى كروخ بلد بتواحي هراة؛ الرجل الصالح راوي جامع الترمذي، كان ورعاً ثقة كتب بالجامع نسخة ووقفها وكان يعيش من النسخ وحدث ببغداد ومكة؛ عاش ستاً وثمانين سنة وتوفي في ذي الحجة سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 628}."
  en: "Abu al-Fath al-Karukhi Abd al-Malik ibn Abdallah of Herat — nisba to Karukh in Herat's environs; the righteous man who transmitted Tirmidhi's Jami', a devout trustworthy copyist who wrote out a copy of the Jami' and endowed it, living by copying; he taught hadith at Baghdad and Mecca, lived eighty-six years, and died in Dhu al-Hijja 548 {cite:shadharat-dhahab p. 628}."
