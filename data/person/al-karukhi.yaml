summary:
  ar: "أبو الفتح الكروخي عبد الملك بن عبد الله الهروي نسبة إلى كروخ بلد بتواحي هراة؛ الرجل الصالح راوي جامع الترمذي، كان ورعاً ثقة كتب بالجامع نسخة ووقفها وكان يعيش من النسخ وحدث ببغداد ومكة؛ عاش ستاً وثمانين سنة وتوفي في ذي الحجة سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 628}."
  en: "Abu al-Fath al-Karukhi Abd al-Malik ibn Abdallah of Herat — nisba to Karukh in Herat's environs; the righteous man who transmitted Tirmidhi's Jami', a devout trustworthy copyist who wrote out a copy of the Jami' and endowed it, living by copying; he taught hadith at Baghdad and Mecca, lived eighty-six years, and died in Dhu al-Hijja 548 {cite:shadharat-dhahab p. 628}."
  es: "Abu al-Fath al-Karukhi Abd al-Malik ibn Abdallah de Herat — nisba a Karukh en los alrededores de Herat; el hombre justo que transmitió el Jami' de Tirmidhi, un copista devoto y confiable que escribió una copia del Jami' y la dotó, viviendo de la copia; enseñó hadices en Bagdad y La Meca, vivió ochenta y seis años y murió en Dhu al-Hijja 548 {cite:shadharat-dhahab p. 628}."
  fr: "Abu al-Fath al-Karukhi Abd al-Malik ibn Abdallah de Hérat — nisba à Karukh dans les environs de Hérat; l'homme vertueux qui a transmis le Jami' de Tirmidhi, un copiste dévoué et digne de confiance qui a rédigé une copie du Jami' et l'a dotée, vivant de la copie; il a enseigné le hadith à Bagdad et à La Mecque, a vécu quatre-vingt-six ans et est mort en Dhu al-Hijja 548 {cite:shadharat-dhahab p. 628}."
  ur: "ابو الفتح الکروخی عبد الملک ابن عبد اللہ ہرات - ہرات کے ماحول میں قرخ سے نسبہ؛ وہ صالح آدمی جس نے ترمذی کی جامع کو منتقل کیا، ایک متقی ثقہ نقل نگار جس نے جامع کی ایک نقل لکھی اور اسے عطا کیا، نقل کرکے زندگی گزاری۔ آپ نے بغداد اور مکہ میں حدیث کی تعلیم دی، چھیاسی سال زندہ رہے اور ذی الحجہ 548 میں وفات پائی۔ 628}۔"
