summary:
  ar: رجل ذكره الراوي في خبر وثوب جمع من أهل صنعاء، كسروا الحبس بصنعاء وأخرجوا علي بن سليمان نائب الهادي سنة 288هـ.
  en: A man named by the narrator as the figure behind a crowd in Sana'a who broke the prison and drove out al-Hadi's deputy Ali ibn Sulayman in 288 AH.
  ur: ایک شخص جسے راوی نے صنعاء کے ایک جمگھٹے کے پیچھے کھڑا شخص بتایا جس نے 288ھ میں قید خانہ توڑا اور ہادی کے نائب علی بن سلیمان کو نکال دیا۔
  es: "Un hombre, mencionado por el narrador, fue la figura que, tras una multitud en Sana'a, irrumpió en la prisión y expulsó al lugarteniente de al-Hadi, Ali ibn Sulayman, en el año 288 de la Hégira."
  fr: "Un homme désigné par le narrateur comme étant la figure à l'origine d'une foule à Sanaa qui a pris d'assaut la prison et chassé le lieutenant d'al-Hadi, Ali ibn Sulayman, en 288 AH."
