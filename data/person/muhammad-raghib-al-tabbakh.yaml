summary:
  ar: "محمد راغب بن محمود بن هاشم الطباخ الحلبي، مؤرخ حلب ومن كبار فضلائها، ولد وتوفي فيها ١٢٩٣ إلى ١٣٧٠هـ الموافقة ١٨٧٧ إلى ١٩٥١م، أنشأ المطبعة العلمية سنة ١٣٤١هـ وكان من أعضاء المجمع العلمي العربي ومدير الكلية الشرعية بحلب، وأشهر كتبه إعلام النبلاء بتاريخ حلب الشهباء في سبعة مجلدات."
  en: "Muhammad Raghib ibn Mahmud ibn Hashim al-Tabbakh al-Halabi, historian of Aleppo and one of its eminent scholars, born and died there, 1293 to 1370 AH, 1877 to 1951 CE; he founded the Scientific Press in 1341 AH, was a member of the Arab Academy and head of the Shari'a College in Aleppo, and his best-known book is I'lam al-Nubala' bi-Tarikh Halab al-Shahba' in seven volumes."
  es: "Muhammad Raghib ibn Mahmud ibn Hashim al-Tabbakh al-Halabi, historiador de Alepo y uno de sus eruditos más eminentes, nació y murió allí, entre 1293 y 1370 AH (1877 y 1951 d. C.); fundó la Editorial Científica en 1341 AH, fue miembro de la Academia Árabe y director del Colegio de la Sharia en Alepo, y su libro más conocido es I'lam al-Nubala' bi-Tarikh Halab al-Shahba' en siete volúmenes."
  fr: "Muhammad Raghib ibn Mahmud ibn Hashim al-Tabbakh al-Halabi, historien d'Alep et l'un de ses éminents érudits, y est né et y est mort, de 1293 à 1370 AH, de 1877 à 1951 CE; il a fondé la Presse Scientifique en 1341 AH, était membre de l'Académie Arabe et directeur du Collège de la Charia à Alep, et son livre le plus connu est I'lam al-Nubala' bi-Tarikh Halab al-Shahba' en sept volumes."
  ur: "محمد راغب بن محمود بن ہاشم الطبخ الحلبی، حلب کے مورخ اور اس کے نامور علماء میں سے ایک، وہاں پیدا ہوئے اور وفات پائی، 1293 تا 1370 ہجری، 1877 تا 1951 عیسوی؛ انہوں نے 1341 ہجری میں سائنٹیفک پریس کی بنیاد رکھی، وہ عرب اکیڈمی کے رکن اور حلب میں شریعہ کالج کے سربراہ تھے، اور ان کی سب سے مشہور کتاب I'lam Al-Nabala' Bi-Tarikh Halab Al-Sahba' سات جلدوں میں ہے۔"
