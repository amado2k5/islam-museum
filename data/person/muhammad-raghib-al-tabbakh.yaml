summary:
  ar: "محمد راغب بن محمود بن هاشم الطباخ الحلبي، مؤرخ حلب ومن كبار فضلائها، ولد وتوفي فيها ١٢٩٣ إلى ١٣٧٠هـ الموافقة ١٨٧٧ إلى ١٩٥١م، أنشأ المطبعة العلمية سنة ١٣٤١هـ وكان من أعضاء المجمع العلمي العربي ومدير الكلية الشرعية بحلب، وأشهر كتبه إعلام النبلاء بتاريخ حلب الشهباء في سبعة مجلدات."
  en: "Muhammad Raghib ibn Mahmud ibn Hashim al-Tabbakh al-Halabi, historian of Aleppo and one of its eminent scholars, born and died there, 1293 to 1370 AH, 1877 to 1951 CE; he founded the Scientific Press in 1341 AH, was a member of the Arab Academy and head of the Shari'a College in Aleppo, and his best-known book is I'lam al-Nubala' bi-Tarikh Halab al-Shahba' in seven volumes."
