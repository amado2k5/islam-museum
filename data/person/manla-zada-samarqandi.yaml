summary:
  ar: "شهاب الدين أحمد بن عثمان الشهير بمنلا زاده السمرقندي الخطالي — نسبة إلى الخطاب جدّه — الشافعي؛ كان إماماً علامة فقيهاً مقرئاً عالي السند في القراءات، بينه وبين الشاطبي أربعة رجال، ودخل بلاد العرب وحلب ودمشق وأخذ عنه أهلها، وله مؤلفات عديدة منها كتاب جمع فيه من الهداية والمحرر وشرح هداية الحكمة؛ قال النجم الغزي في الكواكب السائرة أخذ عنه شيخ الإسلام الجد وقرأ عليه المتوسط وشرح الشمسية وغيرهما، وأخذ عنه السيوفي مفتي حلب تفسير البيضاوي وأثنى عليه، وكان يخبر عنه أنه كان يقول «عجبت لمن يحفظ شيئاً كيف ينساه»؛ توفي في حدود سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 419}."
  en: "A Samarqandi Shafi'i imam and muqri' of high isnad — four men between him and al-Shatibi; travelled Arabia, Aleppo and Damascus whose scholars took from him; among his works a compendium of the Hidaya and the Muharrar and a commentary on Hidayat al-Hikma; al-Ghazzi lists the Shaykh al-Islam 'the grandfather' and Aleppo's mufti al-Suyufi among his pupils; he marvelled 'how can one who memorizes something forget it?'; d. ~901 {cite:shadharat-dhahab p. 419}."
  es: "Un imán shafi'í samaritano y muqri' de alta cadena de transmisión (isnad), cuatro hombres entre él y al-Shatibi; viajó por Arabia, Alepo y Damasco, cuyos eruditos aprendieron de él; entre sus obras se encuentra un compendio de la Hidaya y el Muharrar y un comentario sobre Hidayat al-Hikma; al-Ghazzi menciona al Shaykh al-Islam 'el abuelo' y al muftí de Alepo al-Suyufi entre sus discípulos; se maravillaba de '¿cómo puede olvidar algo quien lo memoriza?'; murió alrededor del año 901 {cita: shadharat-dhahab p. 419}."
  fr: "Un imam chaféite de Samarcande et muqri' de haut isnad — quatre hommes le séparaient d'al-Shatibi; il voyagea en Arabie, à Alep et à Damas, où des savants s'inspirèrent de lui; parmi ses œuvres figurent un recueil de la Hidaya et du Muharrar ainsi qu'un commentaire de la Hidayat al-Hikma; al-Ghazzi cite le cheikh al-Islam « le grand-père » et le mufti d'Alep al-Suyufi parmi ses élèves; il s'étonnait: « Comment celui qui mémorise quelque chose peut-il l'oublier ? »; mort vers 901 {cite: shadharat-dhahab p. 419}."
  ur: "ایک سمرقندی شافعی امام اور مقری اعلیٰ سند کے - چار آدمی اس کے اور الشاطبی کے درمیان؛ عرب، حلب اور دمشق کا سفر کیا جن کے علماء نے ان سے تعلیم حاصل کی۔ ان کی تصانیف میں ہدایہ اور محرر کا مجموعہ اور ہدایت الحکمہ کی تفسیر۔ الغازی نے اپنے شاگردوں میں شیخ الاسلام 'دادا' اور حلب کے مفتی السیوفی کی فہرست دی ہے۔ اس نے حیرت سے کہا 'جو شخص کسی چیز کو یاد رکھتا ہے وہ اسے کیسے بھول سکتا ہے؟'; d ~901 {حوالہ: شدھارت ذہاب صفحہ۔ 419}۔"
  tr: "Şihabeddin Ahmed bin Osman (Manla Zada al-Samarqandi al-Khattali—büyükbabası el-Şafi'i'nin adını taşıyan Şihabdin Ahmed bin Osman bir imam, alim, hukukçu ve okumalarda son derece güvenilir bir şivitçiydi. Kendisi ile el-Şatibi arasında dört adam vardı. Arap topraklarına, Halep'e ve halkının eğitim gördüğü Şam'a girdi. El-Hidayah ve El-Muharrar'dan derlenen bir kitap ve Hidaye üzerine bir tefsir dahil olmak üzere birçok eser yazdı Dayat al-Hikmah. Al-Najm al-Ghazi Al-Kawakib al-Sa'ira'da şöyle der: Şeyh al-Islam al-Jadd onun yanında eğitim aldı, al-Musayyid, Sharh al-Shamshi ve diğerlerini inceledi. Halep Müftüsü Al-Sufi, Tafsir al-Baydawi'yi inceledi ve onu övdü. Şöyle derdi ki, 'Bir şeyi ezberleyen kişiye hayret ediyorum, nasıl unutabildiğine.' Yaklaşık 911 Hicri yılında öldü. {alıntı:) Shadharat-Dhahab, s. 419}."
  id: "Shihab al-Din Ahmad ibn Uthman, dikenal sebagai Manla Zada al-Samarqandi al-Khattali—dinamai menurut kakeknya—al-Shafi'i; ia adalah seorang imam, ulama, ahli hukum, dan pembaca yang sangat dapat diandalkan dalam pembacaan. Ia memiliki empat orang di antara dirinya dan al-Shatibi. Ia memasuki tanah Arab, Aleppo, dan Damaskus, di mana kaumnya belajar di sana. Ia menulis banyak karya, termasuk sebuah buku yang mengumpulkan Al-Hidayah dan Al-Muharrar, serta komentar tentang Hidayah ayat al-Hikmah. Al-Najm al-Ghazi berkata dalam Al-Kawakib al-Sa'ira: Shaykh al-Islam al-Jadd belajar di bawah bimbingannya, mempelajari al-Musayyid, Sharh al-Shamshi, dan lainnya. Al-Sufi, Mufti Aleppo, mempelajari Tafsir al-Baydawi dan memujinya. Dia biasa berkata, 'Aku takjub pada orang yang menghafal sesuatu, bagaimana dia bisa melupakannya.' Dia meninggal sekitar tahun 911 H. {cite:Shadharat-Dhahab, hlm. 419}."
