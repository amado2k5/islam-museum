summary:
  ar: "شهاب الدين أحمد بن عثمان الشهير بمنلا زاده السمرقندي الخطالي — نسبة إلى الخطاب جدّه — الشافعي؛ كان إماماً علامة فقيهاً مقرئاً عالي السند في القراءات، بينه وبين الشاطبي أربعة رجال، ودخل بلاد العرب وحلب ودمشق وأخذ عنه أهلها، وله مؤلفات عديدة منها كتاب جمع فيه من الهداية والمحرر وشرح هداية الحكمة؛ قال النجم الغزي في الكواكب السائرة أخذ عنه شيخ الإسلام الجد وقرأ عليه المتوسط وشرح الشمسية وغيرهما، وأخذ عنه السيوفي مفتي حلب تفسير البيضاوي وأثنى عليه، وكان يخبر عنه أنه كان يقول «عجبت لمن يحفظ شيئاً كيف ينساه»؛ توفي في حدود سنة إحدى وتسعمائة {cite:shadharat-dhahab p. 419}."
  en: "A Samarqandi Shafi'i imam and muqri' of high isnad — four men between him and al-Shatibi; travelled Arabia, Aleppo and Damascus whose scholars took from him; among his works a compendium of the Hidaya and the Muharrar and a commentary on Hidayat al-Hikma; al-Ghazzi lists the Shaykh al-Islam 'the grandfather' and Aleppo's mufti al-Suyufi among his pupils; he marvelled 'how can one who memorizes something forget it?'; d. ~901 {cite:shadharat-dhahab p. 419}."
