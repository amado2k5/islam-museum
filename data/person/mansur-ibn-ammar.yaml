id: person/mansur-ibn-ammar
class: person
label: { ar: "منصور بن عمار", en: "Mansur Ibn Ammar" }
summary:
  ar: "منصور بن عمار ويكنى أبا السري وكان زاهدا مصنفا وما أخذ عن متصوف وأما جمله مجالس لم يسم ذلك كتبا فمن ذلك مجلس في الجنين ومجلس الديباج ومجلس صفة لابل ومجلس السبيل ومجلس في ذكر الموت ومجلس في حسن الظن بالله ومجلس في العينة والدين ومجلس في البلى ومجلس السحاب على أهل النار ومجلس في انظرونا ومجلس العرض على الله ومجلس نقتبس من نوركم في النار ومجلس التقفورية في الغزو ومجلس المسجى في ذكر الموت {cite:fihrist-ibn-al-nadim p. 261-262}."
  en: "Mansur ibn Ammar — whose majlis sermons Ibn al-Nadim lists {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
