id: person/mansur-ibn-ammar
class: person
label: { ar: "منصور بن عمار", en: "Mansur Ibn Ammar", es: "Mansur Ibn Ammar", fr: "Mansur Ibn Ammar", ur: "منصور ابن عمار" }
summary:
  ar: "منصور بن عمار ويكنى أبا السري وكان زاهدا مصنفا وما أخذ عن متصوف وأما جمله مجالس لم يسم ذلك كتبا فمن ذلك مجلس في الجنين ومجلس الديباج ومجلس صفة لابل ومجلس السبيل ومجلس في ذكر الموت ومجلس في حسن الظن بالله ومجلس في العينة والدين ومجلس في البلى ومجلس السحاب على أهل النار ومجلس في انظرونا ومجلس العرض على الله ومجلس نقتبس من نوركم في النار ومجلس التقفورية في الغزو ومجلس المسجى في ذكر الموت {cite:fihrist-ibn-al-nadim p. 261-262}."
  en: "Mansur ibn Ammar — whose majlis sermons Ibn al-Nadim lists {cite:fihrist-ibn-al-nadim}"
  es: "Mansur ibn Ammar — cuyos sermones de majlis enumera Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
  fr: "Mansur ibn Ammar — dont les sermons de majlis sont répertoriés par Ibn al-Nadim {cite:fihrist-ibn-al-nadim}"
  ur: "منصور ابن عمار - جن کے مجلسی خطبات ابن الندیم نے درج کیے ہیں"
  tr: "Mansur bin Ammar, Ebu el-Sari olarak bilinir, bir münzevi ve yazardı ve hiçbir Sufi âliminden alıntı yapmamıştır. Kitap olarak adlandırılmayan toplantı koleksiyonları arasında 'Majlis fi al-Jinin', 'Majlis al-Dibaj', Majlis Sifa Labal, Majlis al-Sabeel, Majlis ölümden bahsederken, Majlis Allah'a iyi niyet üzerine Majlis, 'Spekülasyon ve din' üzerine Majlis, Majlis 'Cehennem Halkı Üzerine Majlis', 'Anzaruna' Majlis, 'Al-Ard 'Ala Allah', Majlis Naktass min Nurakum fi Naur fi al-Nar, Majlis al-Taqifuri Savaş üzerine ve Majlis al-Masaj fi zikr al-Mawat {alıntı::Fihrist-ibn-al-Nadim s. 261-262}."
  id: "Mansur ibn Ammar, yang dikenal sebagai Abu al-Sari, adalah seorang pertapa dan penulis yang tidak mengambil dari ulama Sufi manapun. Adapun kumpulan kumpulannya yang tidak disebut buku, ini termasuk 'Majlis fi al-Jinin', 'Majlis al-Dibaj', Majlis Sifa Labal, Majlis al-Sabeel, Majlis tentang menyebutkan kematian, Majlis tentang iman baik kepada Allah, Majlis tentang 'Spekulasi dan agama', Majlis tentang pakaian, Majlis tentang 'Al-Sahab tentang Rakyat Neraka', Majlis tentang 'Anzaruna', Majlis 'Al-Ard 'Ala Allah', Majlis Naqtass min Nurakum fi Naur fi al-Nar, Majlis al-Taqifuri tentang Pertempuran, dan Majlis al-Masaj fi dzikir al-Mawat {cite:fihrist-ibn-al-nadim hlm. 261-262}."
