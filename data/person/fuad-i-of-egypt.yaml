summary:
  ar: "سلطان مصر من 1917 إلى 1922 ثم أول ملوكها من 1922 إلى 1936، وهو الابن الأصغر للخديوي إسماعيل وخلف أخاه السلطان حسين كامل. لعب دورًا رئيسًا في تأسيس الجامعة المصرية وكان أول رئيس لها (1908–1913)، وفي عهده جاء تصريح الاستقلال 1922 ودستور 1923، وأنشأ الأرشيف الملكي."
  en: "Sultan of Egypt from 1917 to 1922 and then its first king, from 1922 to 1936; the youngest son of Khedive Isma'il, he succeeded his brother Sultan Hussein Kamel. He played a major part in founding the Egyptian University and was its first rector (1908–1913); his reign brought the 1922 declaration of independence and the 1923 constitution, and he created the Royal Archives."
  ur: "مصر کے سلطان 1917 سے 1922 تک اور پھر اس کے پہلے بادشاہ 1922 سے 1936 تک؛ خدیو اسماعیل کے سب سے چھوٹے بیٹے، وہ اپنے بھائی سلطان حسین کامل کے جانشین ہوئے۔ انہوں نے مصری یونیورسٹی کی بنیاد میں اہم کردار ادا کیا اور اس کے پہلے ریکٹر رہے (1908–1913)؛ ان کے عہد میں 1922 کا اعلانِ آزادی اور 1923 کا آئین آیا، اور انہوں نے شاہی آرکائیو قائم کیا۔"
