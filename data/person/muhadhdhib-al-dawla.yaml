id: person/muhadhdhib-al-dawla
class: person
label: { ar: "مهذب الدولة أبو الحسن علي بن نصر صاحب البطائح" }
summary:
  ar: "علي بن نصر أبو الحسن الملقب مهذب الدولة، صاحب البطائح، كان ذا كرم ووفاء، يلجأ إليه الناس في الشدائد. أكبر فخره نزول القادر بالله عليه وإقامته في جواره نحو سنتين في خفائه حتى جاءته الخلافة، فتوجت الأيام مفرق فخاره بمقام القادر عنده. كان يرتفع له من إقطاعه آلاف الأكرار من الحنطة والشعير والأرز، وتزوج بنت الملك بهاء الدولة وأعانه في نوائبه وأقرضه الأموال، وهو الذي بنى جامع القطيعة ببغداد وسقايات واسط. توفي سنة تسع وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.149,290-291}."
  tr: "Ali bin Nasr Ebu el-Hasan, lakaplı adı Muhadhdhab al-Dawla ve el-Beytah'ın sahibiydi; cömert ve sadıktı; insanlar zor zamanlarda ona başvurdu. En büyük gururu, el-Kadir Billah'ın ona gelip yaklaşık iki yıl gizlice yanında kalmasıydı; ta ki halifelik gelene kadar ve zamanla el-Kadir statüsündeki gururunun sonunu taçlandırdı. Mülklerinden binlerce dönüm buğday, arpa ve pirinç kazandı. Kralın kızı Baha'el-Devle ile evlendi, sıkıntılarında ona yardım etti ve ona para verdi. Bağdat'taki El-Kâti'ye Camii'ni ve Wasit'in su taşıyıcılarını inşa eden kişi oydu. Dört yüz dokuz yaşında öldü {cite:muntazam-ibn-al-jawzi J.7 s.149,290-291}."
  id: "Ali ibn Nasr Abu al-Hasan, dijuluki Muhadhdhab al-Dawla dan pemilik al-Bata'ih, adalah orang yang murah hati dan setia, yang sering menjadi tempat orang-orang bersandar di masa kesulitan. Kebanggaan terbesarnya adalah bahwa al-Qadir Billah datang kepadanya dan tinggal di dekatnya selama sekitar dua tahun secara rahasia hingga kekhalifahan datang, dan waktu mengakhiri kesombongannya atas status al-Qadir bersamanya. Dia memperoleh ribuan hektar gandum, jelai, dan beras dari tanahnya. Dia menikahi putri raja, Baha' al-Dawla, membantunya dalam kesulitannya, dan meminjamkan uang. Dialah yang membangun Masjid Al-Qati'ah di Baghdad dan para pembawa air di Wasit. Dia meninggal pada tahun empat ratus sembilan {cite:muntazam-ibn-al-jawzi J.7 hlm.149,290-291}."
