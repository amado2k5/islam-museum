label: { ar: "مهذب الدولة أبو الحسن علي بن نصر صاحب البطائح" }
summary:
  ar: "علي بن نصر أبو الحسن الملقب مهذب الدولة، صاحب البطائح، كان ذا كرم ووفاء، يلجأ إليه الناس في الشدائد. أكبر فخره نزول القادر بالله عليه وإقامته في جواره نحو سنتين في خفائه حتى جاءته الخلافة، فتوجت الأيام مفرق فخاره بمقام القادر عنده. كان يرتفع له من إقطاعه آلاف الأكرار من الحنطة والشعير والأرز، وتزوج بنت الملك بهاء الدولة وأعانه في نوائبه وأقرضه الأموال، وهو الذي بنى جامع القطيعة ببغداد وسقايات واسط. توفي سنة تسع وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.149,290-291}."
