summary:
  ar: "أبو قلابة عبد الله بن زيد بن عمرو الجرمي الأزدي، مات بالشام سنة ست أو سبع ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 47}. قال مسلم بن يسار: لو كان أبو قلابة من العجم كان موبذ الموبذان، وروي أنه حضر عند عمر بن عبد العزيز فسألهم عن القسامة {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  en: "Abu Qilaba Abd Allah ibn Zayd ibn Amr al-Jarmi al-Azdi died in Syria in 106 or 107 AH {cite:tabaqat-fuqaha-abbas-1981 p. 47}. Muslim ibn Yasar said: 'Had Abu Qilaba been a Persian, he would have been the mobadh of the mobadhs, the chief of the Zoroastrian priests.' It is related that he attended the court of Umar ibn Abd al-Aziz, where they were questioned about the qasama (the oath procedure in cases of homicide) {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
