summary:
  ar: "أبو قلابة عبد الله بن زيد بن عمرو الجرمي الأزدي، مات بالشام سنة ست أو سبع ومائة {cite:tabaqat-fuqaha-abbas-1981 p. 47}. قال مسلم بن يسار: لو كان أبو قلابة من العجم كان موبذ الموبذان، وروي أنه حضر عند عمر بن عبد العزيز فسألهم عن القسامة {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  en: "Abu Qilaba Abd Allah ibn Zayd ibn Amr al-Jarmi al-Azdi died in Syria in 106 or 107 AH {cite:tabaqat-fuqaha-abbas-1981 p. 47}. Muslim ibn Yasar said: 'Had Abu Qilaba been a Persian, he would have been the mobadh of the mobadhs, the chief of the Zoroastrian priests.' It is related that he attended the court of Umar ibn Abd al-Aziz, where they were questioned about the qasama (the oath procedure in cases of homicide) {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  fr: "Abu Qilaba Abd Allah ibn Zayd ibn Amr al-Jarmi al-Azdi mourut en Syrie en 106 ou 107 H {cite:tabaqat-fuqaha-abbas-1981 p. 47}. Muslim ibn Yasar dit : « Si Abu Qilaba avait été persan, il aurait été le mobadh des mobadhs, le chef des prêtres zoroastriens. » On rapporte qu'il assista à la cour d'Umar ibn Abd al-Aziz, où on les interrogea sur la qasama (la procédure des serments en cas d'homicide) {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  es: "Abu Qilaba Abd Allah ibn Zayd ibn Amr al-Jarmi al-Azdi murió en Siria en el año 106 o 107 de la Hégira {cite:tabaqat-fuqaha-abbas-1981 p. 47}. Muslim ibn Yasar dijo: «Si Abu Qilaba hubiera sido persa, habría sido el mobadh de los mobadhs, el jefe de los sacerdotes zoroastrianos». Se cuenta que asistió a la corte de Umar ibn Abd al-Aziz, donde fueron interrogados sobre el qasama (el procedimiento del juramento en casos de homicidio) {cite:tabaqat-fuqaha-abbas-1981 p. 47}."
  ur: "ابو قلابہ عبد اللہ بن زید بن عمرو الجرمی الازدی کی وفات شام میں 106 یا 107 ہجری میں ہوئی۔ 47}۔ مسلم بن یسار نے کہا: 'اگر ابو قلابہ فارسی ہوتا تو وہ موبھا کا موبھا ہوتا، زرتشتی پادریوں کا سردار ہوتا۔' روایت ہے کہ وہ عمر بن عبد العزیز کے دربار میں حاضر ہوئے، جہاں ان سے قصامہ ⁦(قتل کے مقدمات میں حلف کے طریقہ کار)⁩ کے بارے میں سوال کیا گیا۔ 47}۔"
  tr: "Ebu Kulabe Abdullah ibn Zeyd ibn Amr el-Cermi el-Azdi, Hicri 106 veya 107 yılında Suriye'de vefat etmiştir. Müslim ibn Yasar şöyle demiştir: Eğer Ebu Kulabe Arap olmasaydı, reislerin reisinin reisi olurdu. Rivayet edildiğine göre, Ömer ibn Abdülaziz ile birlikteyken onlara arınma yemini hakkında sorular sormuştur."
  id: "Abu Qulaba Abdullah ibn Zayd ibn Amr al-Jarmi al-Azdi meninggal di Suriah pada tahun 106 atau 107 Hijriah. Muslim ibn Yasar berkata: Seandainya Abu Qulaba bukan orang Arab, ia akan menjadi pemimpin tertinggi. Diriwayatkan bahwa ia hadir bersama Umar ibn Abd al-Aziz dan ia bertanya kepada mereka tentang sumpah penyucian."
