summary:
  ar: "أبو الحارث عيسى بن وردان المدني الحذاء، راوي قراءة أبي جعفر يزيد بن القعقاع؛ توفي نحو سنة 160هـ، وقال ابن الجزري إنه مقرئ رأس في القراءة ضابط محقق من قدماء أصحاب نافع {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  en: "Abu al-Harith 'Isa ibn Wardan al-Madani al-Hadhdha', transmitter of the reading of Abu Ja'far Yazid ibn al-Qa'qa'; he died about 160 AH. Ibn al-Jazari calls him a reader of the first rank, exact and a verifier, one of the early companions of Nafi' {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  ur: "ابو الحارث عیسیٰ بن وردان مدنی حذاء، ابو جعفر یزید بن القعقاع کی قراءت کے راوی؛ تقریباً 160ھ میں فوت ہوئے۔ ابن الجزری انہیں اعلیٰ درجے کا قاری، ضابط، محقق اور نافع کے قدیم ساتھیوں میں سے بتاتے ہیں {cite:nashr-dahman-damascus-1345-v1 p. 189}."
  es: "Abu al-Harith 'Isa ibn Wardan al-Madani al-Hadhdha', transmisor de la lectura de Abu Ja'far Yazid ibn al-Qa'qa'; murió alrededor del año 160 AH. Ibn al-Jazari lo llama lector de primer rango, exacto y verificador, uno de los primeros compañeros de Nafi' {cite:nashr-dahman-damascus-1345-v1 p. 189}."
