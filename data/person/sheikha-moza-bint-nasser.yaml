summary:
  ar: شيخة قطرية وُلدت سنة 1959. رئيسة مجلس إدارة مؤسسة قطر للتربية والعلوم وتنمية المجتمع، ومؤسِّسة المدينة التعليمية التي تضم فروعًا لجامعات عالمية، وقائدة مبادرات دولية للتعليم منها «علّم طفلًا».
  en: Qatari sheikha, born 1959. Chairperson of the Qatar Foundation for Education, Science and Community Development, founder of Education City hosting international university branch campuses, and leader
    of global education initiatives including Educate A Child.
  ur: قطر کی شیخہ، 1959 میں پیدا ہوئیں۔ قطر فاؤنڈیشن برائے تعلیم، سائنس اور سماجی ترقی کی چیئرپرسن، ایجوکیشن سٹی کی بانی جس میں عالمی جامعات کے شاخ کیمپس ہیں، اور ایجوکیٹ اے چائلڈ سمیت عالمی تعلیمی مہمات
    کی قائد۔
  es: "Jequesa catarí, nacida en 1959. Presidenta de la Fundación Qatar para la Educación, la Ciencia y el Desarrollo Comunitario, fundadora de Education City, que alberga campus universitarios internacionales, y líder de iniciativas educativas globales, entre ellas Educate A Child."
  fr: "Cheikha qatarie, née en 1959. Présidente de la Fondation du Qatar pour l'éducation, les sciences et le développement communautaire, fondatrice d'Education City qui accueille des campus universitaires internationaux et dirigeante d'initiatives mondiales en matière d'éducation, notamment Educate A Child."
