summary:
  ar: "ماوند خليفة رتبيل؛ طلب الأمان من معن بن زائدة على أن يحمله إلى أمير المؤمنين فآمنه وبعث به إلى بغداد مع خمسة آلاف من مقاتلتهم فأكرمه المنصور وفرض له وقوده."
  en: "Mawand, Rutbil's deputy; granted aman by Ma'n to be borne to the Commander of the Faithful — sent to Baghdad with five thousand of their fighters, honored by al-Mansur, stipended and given command."
  es: "Mawand, lugarteniente de Rutbil, recibió un aman de Ma'n para ser llevado al Comandante de los Creyentes; fue enviado a Bagdad con cinco mil de sus combatientes, honrado por al-Mansur, estipendiado y se le otorgó el mando."
  fr: "Mawand, adjoint de Rutbil; reçut un aman de Ma'n destiné à être porté au Commandeur des Croyants — envoyé à Bagdad avec cinq mille de leurs combattants, honoré par al-Mansur, rémunéré et chargé du commandement."
  ur: "میوند، رتبل کے نائب؛ مان کی طرف سے امان دی گئی کہ وہ وفاداروں کے کمانڈر کے لیے اٹھائے جائیں - اپنے پانچ ہزار جنگجوؤں کے ساتھ بغداد بھیجے گئے، المنصور کی طرف سے اعزازی، وظیفہ اور کمانڈ دیا گیا۔"
