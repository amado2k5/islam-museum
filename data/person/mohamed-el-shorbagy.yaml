summary:
  ar: "لاعب اسكواش محترف مصري المولد، وُلد في الإسكندرية سنة 1991. تصدّر التصنيف العالمي لفترات طويلة بين 2014 و2021 ونال لقب بطل العالم 2017، ومثّل مصر حتى يونيو 2022 حين انتقل إلى تمثيل إنجلترا."
  en: "Egyptian-born professional squash player, born in Alexandria in 1991. World No. 1 for long stretches between 2014 and 2021 and world champion in 2017, he represented Egypt until June 2022, when he switched to represent England."
  ur: "مصری نژاد پیشہ ور اسکواش کھلاڑی، 1991 میں اسکندریہ میں پیدا ہوئے۔ 2014 سے 2021 کے درمیان طویل عرصے تک عالمی نمبر 1 رہے اور 2017 میں عالمی چیمپئن بنے؛ جون 2022 تک مصر کی نمائندگی کی، پھر انگلینڈ کی نمائندگی اختیار کر لی۔"
  es: "Jugador profesional de squash nacido en Egipto, en Alejandría, en 1991. Fue número uno del mundo durante largos periodos entre 2014 y 2021 y campeón del mundo en 2017. Representó a Egipto hasta junio de 2022, cuando pasó a representar a Inglaterra."
  fr: "Joueur de squash professionnel d'origine égyptienne, né à Alexandrie en 1991. Numéro 1 mondial pendant de longues périodes entre 2014 et 2021 et champion du monde en 2017, il a représenté l'Égypte jusqu'en juin 2022, date à laquelle il a choisi de représenter l'Angleterre."
  tr: "Mısır doğumlu profesyonel bir squash oyuncusu, 1991 yılında İskenderiye'de doğdu. 2014 ile 2021 arasında uzun süreler dünya sıralamasında zirvede yer aldı, 2017 Dünya Şampiyonası'nı kazandı ve Haziran 2022'ye kadar Mısır'ı temsil etti, ardından İngiltere'yi temsil etmek üzere transfer oldu."
  id: "Seorang pemain squash profesional kelahiran Mesir, lahir di Alexandria pada tahun 1991. Ia menduduki puncak klasemen dunia selama periode panjang antara 2014 dan 2021, memenangkan Kejuaraan Dunia 2017, dan mewakili Mesir hingga Juni 2022, ketika ia pindah untuk mewakili Inggris."
