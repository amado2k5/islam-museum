id: person/ali-ibn-mahdi-al-himyari
class: person
label:
  ar: علي بن مهدي الحميري
  en: Ali ibn Mahdi al-Himyari
  es: "Ali ibn Mahdi al-Himyari"
  fr: "Ali ibn Mahdi al-Himyari"
  ur: "علی ابن مہدی الحمیری"
summary:
  ar: "علي بن مهدي الحميري من أهل العثر من سواحل زبيد؛ نشأ على صلاح أبيه فاعتزل ونسك، وحج ولقي علماء العراق وأخذ الوعظ من وعاظهم، وكان حافظاً فصيحاً يخبر بحوادث أحواله فيصدق فمال إليه الناس، وكان يقول في وعظه دنا الوقت يشير إلى وقت ظهوره، فلما ماتت أم فاتك صاحبة زبيد سنة خمس وأربعين وخمسمائة جاءه أهل الجبال وحالفوه فظهر أمره وملك تهامة وجبالها، وقهر بني نجاح بزبيد فملكها سنة أربع وخمسين وخمسمائة وانقرض أمر آل نجاح والملك لله، وذهب ملك بني سليمان من جميع التهائم والجبال واليمن على يد بني مهدي."
  en: "Ali ibn Mahdi al-Himyari of al-Uthr on Zabid's coasts; raised in his father's piety, withdrawn in worship, he made the hajj, sat with Iraq's scholars and took preaching from their preachers — a memorizing, eloquent man whose foretellings of his own affairs came true, so the people inclined to him, his sermon-cry 'the time is near' pointing to his own rising; when Umm Fatik of Zabid died in 545 the mountain folk swore to him, his cause flared, he crushed the Najahids and took Zabid in 554 ending their house — and all Tihama, the mountains and Yemen passed from the Sulaymanids' hands into Banu Mahdi's."
  es: "Ali ibn Mahdi al-Himyari de al-Uthr, en las costas de Zabid; criado en la piedad de su padre, retraído en la adoración, realizó el Hajj, se sentó con los eruditos de Irak y escuchó sermones de sus predicadores; un hombre elocuente y con gran memoria cuyas predicciones sobre sus propios asuntos se cumplieron, por lo que el pueblo se inclinó hacia él, y su grito de sermón \"el tiempo está cerca\" apuntaba a su propio ascenso; cuando Umm Fatik de Zabid murió en 545, la gente de las montañas le juró lealtad, su causa se encendió, aplastó a los Najahids y tomó Zabid en 554, acabando con su dinastía, y toda Tihama, las montañas y Yemen pasaron de las manos de los Sulaymaníes a las de Banu Mahdi."
  fr: "Ali ibn Mahdi al-Himyari d'al-Uthr, sur les côtes de Zabid, élevé dans la piété de son père et retiré dans le culte, accomplit le hajj, s'assit avec les savants d'Irak et reçut les sermons de leurs prédicateurs. Homme à la mémoire prodigieuse et à l'éloquence remarquable, ses prédictions concernant son propre destin se réalisèrent, si bien que le peuple se rallia à lui. Son cri de ralliement, « le temps est proche », annonçait son ascension. À la mort d'Umm Fatik de Zabid en 545, les montagnards lui prêtèrent allégeance, sa cause prit de l'ampleur, il écrasa les Najahides et s'empara de Zabid en 554, mettant ainsi fin à leur dynastie. Dès lors, toute la Tihama, les montagnes et le Yémen passèrent des mains des Sulaymanides à celles des Banu Mahdi."
  ur: "زبید کے ساحلوں پر العطر کا علی بن مہدی الحمیری؛ اپنے والد کی تقویٰ میں پرورش پائی، عبادت میں پیچھے ہٹے، حج کیا، عراق کے علماء کے ساتھ بیٹھا اور ان کے مبلغین سے وعظ لیا - ایک حافظ، فصیح آدمی جس کی اپنی پیشین گوئیاں سچ ثابت ہوئیں، تو لوگ اس کی طرف مائل ہوئے، اس کا خطبہ 'وقت قریب ہے' اس کے اپنے عروج کی طرف اشارہ کرتا تھا۔ 545 میں جب زبید کی ام فاتک کی وفات ہوئی تو پہاڑی لوگوں نے اس سے قسم کھائی، اس کی وجہ بھڑک اٹھی، اس نے نجادوں کو کچل دیا اور 554 میں زبید کو لے کر ان کا گھر ختم کر دیا - اور تمام تہامہ، پہاڑ اور یمن سلیمانیوں کے ہاتھ سے بنو مہدی کے ہاتھ میں چلے گئے۔"
