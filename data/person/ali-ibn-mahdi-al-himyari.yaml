id: person/ali-ibn-mahdi-al-himyari
class: person
label:
  ar: علي بن مهدي الحميري
  en: Ali ibn Mahdi al-Himyari
summary:
  ar: "علي بن مهدي الحميري من أهل العثر من سواحل زبيد؛ نشأ على صلاح أبيه فاعتزل ونسك، وحج ولقي علماء العراق وأخذ الوعظ من وعاظهم، وكان حافظاً فصيحاً يخبر بحوادث أحواله فيصدق فمال إليه الناس، وكان يقول في وعظه دنا الوقت يشير إلى وقت ظهوره، فلما ماتت أم فاتك صاحبة زبيد سنة خمس وأربعين وخمسمائة جاءه أهل الجبال وحالفوه فظهر أمره وملك تهامة وجبالها، وقهر بني نجاح بزبيد فملكها سنة أربع وخمسين وخمسمائة وانقرض أمر آل نجاح والملك لله، وذهب ملك بني سليمان من جميع التهائم والجبال واليمن على يد بني مهدي."
  en: "Ali ibn Mahdi al-Himyari of al-Uthr on Zabid's coasts; raised in his father's piety, withdrawn in worship, he made the hajj, sat with Iraq's scholars and took preaching from their preachers — a memorizing, eloquent man whose foretellings of his own affairs came true, so the people inclined to him, his sermon-cry 'the time is near' pointing to his own rising; when Umm Fatik of Zabid died in 545 the mountain folk swore to him, his cause flared, he crushed the Najahids and took Zabid in 554 ending their house — and all Tihama, the mountains and Yemen passed from the Sulaymanids' hands into Banu Mahdi's."
