summary:
  ar: "أبو يوسف يعقوب بن صابر المنجنيقي نجم الدين، الحراني الأصل البغدادي المولد والدار، الشاعر المشهور وسيد صنعة المنجنيق؛ كان في ابتداء أمره جندياً مقدماً على المنجنيقيين بمدينة السلام، ومغرياً بآداب السيف والقلم وصناعة السلاح والرياضة حتى اشتهر بذلك ولم يلحقه أحد من أبناء زمانه في درايته وفهمه، وصنف كتاباً سماه «عمدة السالك في سياسة الممالك» لم يتممه يتضمن أحوال الحروب وتعبيتها وفتح الثغور وبناء المعاقل وأحوال الفروسية والهندسة والمصابرة على القلاع والحصار والرياضة الميدانية والحيل الحربية وفنون العلاج بالسلاح وعمل أدوات الحرب وأصناف الحيل {cite:wafayat-ayan p. 35-36}. وكان شيخاً هشاً لطيفاً فكهاً شريف النفس، شاعراً مكثراً مجيداً ذا معانٍ مبتكرة يقصد الشعر ويعمل المقاطيع، وجمع من شعره كتاباً مختصراً سماه «مغاني المعاني»، ومدح الخلفاء وكانت له منزلة لطيفة عند الإمام الناصر لدين الله خليفة العصر؛ وقال ابن خلكان إن أخباره كانت في حياته متواصلة إلينا وأشعاره تنقلها الرواة حتى كأنه عاشره مع كثرة اطلاعه على أخباره {cite:wafayat-ayan p. 37, 39}."
  en: "Ya'qub ibn Sabir al-Munajjiniqi 'Najm al-Din' — Baghdadi master of the mangonel corps turned poet, author of the unfinished military treatise Umdat al-Salik on siegecraft, fortification and stratagems, and of the verse anthology Maghani al-Ma'ani; favoured by the caliph al-Nasir and followed by Ibn Khallikan's generation 'as though I had lived with him' {cite:wafayat-ayan p. 35-44}."
