summary:
  ar: "أبو يوسف يعقوب بن صابر المنجنيقي نجم الدين، الحراني الأصل البغدادي المولد والدار، الشاعر المشهور وسيد صنعة المنجنيق؛ كان في ابتداء أمره جندياً مقدماً على المنجنيقيين بمدينة السلام، ومغرياً بآداب السيف والقلم وصناعة السلاح والرياضة حتى اشتهر بذلك ولم يلحقه أحد من أبناء زمانه في درايته وفهمه، وصنف كتاباً سماه «عمدة السالك في سياسة الممالك» لم يتممه يتضمن أحوال الحروب وتعبيتها وفتح الثغور وبناء المعاقل وأحوال الفروسية والهندسة والمصابرة على القلاع والحصار والرياضة الميدانية والحيل الحربية وفنون العلاج بالسلاح وعمل أدوات الحرب وأصناف الحيل {cite:wafayat-ayan p. 35-36}. وكان شيخاً هشاً لطيفاً فكهاً شريف النفس، شاعراً مكثراً مجيداً ذا معانٍ مبتكرة يقصد الشعر ويعمل المقاطيع، وجمع من شعره كتاباً مختصراً سماه «مغاني المعاني»، ومدح الخلفاء وكانت له منزلة لطيفة عند الإمام الناصر لدين الله خليفة العصر؛ وقال ابن خلكان إن أخباره كانت في حياته متواصلة إلينا وأشعاره تنقلها الرواة حتى كأنه عاشره مع كثرة اطلاعه على أخباره {cite:wafayat-ayan p. 37, 39}."
  en: "Ya'qub ibn Sabir al-Munajjiniqi 'Najm al-Din' — Baghdadi master of the mangonel corps turned poet, author of the unfinished military treatise Umdat al-Salik on siegecraft, fortification and stratagems, and of the verse anthology Maghani al-Ma'ani; favoured by the caliph al-Nasir and followed by Ibn Khallikan's generation 'as though I had lived with him' {cite:wafayat-ayan p. 35-44}."
  es: "Ya'qub ibn Sabir al-Munajjiniqi 'Najm al-Din' — maestro bagdadí del cuerpo de mangoneles convertido en poeta, autor del tratado militar inacabado Umdat al-Salik sobre técnicas de asedio, fortificación y estratagemas, y de la antología de versos Maghani al-Ma'ani; favorecido por el califa al-Nasir y seguido por la generación de Ibn Khallikan 'como si hubiera vivido con él' {cite:wafayat-ayan p. 35-44}."
  fr: "Ya'qub ibn Sabir al-Munajjiniqi 'Najm al-Din' — maître bagdadien du corps des mangonneaux devenu poète, auteur du traité militaire inachevé Umdat al-Salik sur l'art du siège, la fortification et les stratagèmes, et de l'anthologie de vers Maghani al-Ma'ani; favorisé par le calife al-Nasir et suivi par la génération d'Ibn Khallikan « comme si j'avais vécu avec lui » {cite: wafayat-ayan p. 35-44}."
  ur: "یعقوب بن صابر المنجینقی 'نجم الدین' - منگونیل کور کے بغدادی ماسٹر شاعر بنے، محاصرہ، قلعہ بندی اور حکمت عملی پر نامکمل فوجی مقالے امدات السالک کے مصنف اور آیت انتھولوجی مغانی المعانی کے مصنف؛ خلیفہ الناصر کی طرف سے پسند کیا گیا اور اس کے بعد ابن خلیقان کی نسل 'گویا میں اس کے ساتھ رہا ہوں'۔ 35-44}۔"
  tr: "Bağdat'ın Al-Harrani doğumlu Abu Yusuf Yaqub ibn Sabir al-Manjiqi Najm al-Din, ünlü bir şair ve mancınık ustasıydı. Kariyerinin başında, barış şehrinde mancınıkların önünde bir askerdi ve kılıç, kalem, silah yapımı ve sporun görgü kurallarına hayrandı; ta ki bu konuda kendi döneminde bilgi ve anlayış açısından eşi benzeri olmayan bir üne kavuşana kadar. 'Krallık Siyasetinde Gezginin Lideri' adlı bir kitap yazdı; bu kitabı tamamlamadı; kitapta savaş koşulları ve seferberliği, sınırların açılması, kale inşası, şövalyelik koşulları, mühendislik, kalelerde ve kuşatmalarda dayanıklılık, saha sporları, askeri taktikler, silah terapisi, savaş aletleri yapımı ve çeşitli hileler yer alıyordu {cite:wafayat-ayan, s. 35-36}. Kırılgan, nazik bir şeyh ve asil bir ruhtu; yenilikçi anlamlara sahip, şiir yazmayı hedefleyen ve alıntılar yapan üretken ve üretken bir şairdi. Şiirlerinden 'Anlamların Şarkıları' adlı kısa bir kitap derledi; bu kitap halifeleri övdü ve dönemin halifesi İmam Nasir li-Din Allah ile seçkin bir statüye sahipti. İbn Hallikan, yaşamı boyunca anlattıklarının bize sürekli olduğunu ve şiirlerinin anlatıcılar tarafından aktarıldığını, geniş bilgisine rağmen sanki onunla yaşıyormuş gibi olduğunu söylemiştir {atıf:wafayat-ayan s. 37, 39}."
  id: "Abu Yusuf Yaqub ibn Sabir al-Manjiqi Najm al-Din, yang berasal dari Al-Harrani di Baghdad, adalah seorang penyair terkenal dan ahli kerajinan katapel. Pada awal kariernya, ia adalah seorang prajurit yang mendahului ketapel di kota perdamaian, dan ia terpesona oleh etiket pedang, pena, pembuatan senjata, dan olahraga, hingga akhirnya ia menjadi terkenal karenanya, yang belum pernah ditandingi oleh siapa pun di zamannya dalam pengetahuan dan pemahamannya. Ia menulis sebuah buku yang ia berjudul 'The Leader of the Traveler in the Politics of Kingdoms,' yang tidak ia selesaikan, yang mencakup kondisi perang dan mobilisasinya, pembukaan perbatasan, pembangunan benteng, kondisi kesatria, teknik, ketahanan di benteng dan pengepungan, olahraga lapangan, taktik militer, terapi senjata, pembuatan alat perang, dan berbagai jenis trik {cite:wafayat-ayan, hlm. 35-36}. Ia adalah seorang sheikh yang rapuh dan lembut, serta jiwa yang mulia, penyair yang produktif dan produktif dengan makna inovatif, yang berusaha menulis puisi dan membuat kutipan. Ia menyusun dari puisinya sebuah buku singkat berjudul 'Lagu Makna,' yang memuji para khalifah, dan memegang status terhormat bersama Imam al-Nasir li-Din Allah, khalifah pada masa itu. Ibn Khallikan mengatakan bahwa kisah-kisahnya selama hidupnya terus berlanjut kepada kita, dan puisinya disampaikan oleh para narator sedemikian rupa seolah-olah ia hidup bersamanya meskipun memiliki pengetahuan luas {cite:wafayat-ayan hlm. 37, 39}."
