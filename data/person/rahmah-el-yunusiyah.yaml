summary:
  ar: "مربّية إندونيسية من بادانغ بانجانغ (1900–1969): أسّست سنة 1923 مدرسة دينية بوتري، أول مدرسة إسلامية للبنات ذات منهاج حديث في إندونيسيا، ووسّعتها إلى روضة ومدرسة للمعلمات وجامعة للنساء، ودخلت مجلس الشعب الاستشاري عن حزب ماشومي، وتُعدّ رائدة تعليم المرأة المسلمة."
  en: "Indonesian educator from Padang Panjang (1900–1969): in 1923 she founded Diniyah Putri, Indonesia's first Islamic girls' school with a modern curriculum, and expanded it into a kindergarten, a teacher-training school and a women's college; she sat in the People's Consultative Assembly for the Masyumi Party and is counted a pioneer of Muslim women's education."
  ur: "پاڈانگ پانجانگ سے تعلق رکھنے والی انڈونیشی معلمہ (1900ء–1969ء): 1923ء میں انہوں نے دینیہ پوتری کی بنیاد رکھی، جو جدید نصاب رکھنے والا انڈونیشیا کا پہلا اسلامی لڑکیوں کا مدرسہ تھا، اور اسے کنڈرگارٹن، اساتذہ کی تربیتی درسگاہ اور خواتین کے کالج تک وسعت دی؛ وہ ماشومی پارٹی کی طرف سے مجلس شوری عوامی کی رکن رہیں اور مسلم خواتین کی تعلیم کی بانیوں میں شمار ہوتی ہیں۔"
