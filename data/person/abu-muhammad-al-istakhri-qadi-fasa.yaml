summary:
  ar: "القاضي أبو محمد الاصطخري، تفقه على القاضي أبي حامد المروروذي، وكان قاضي فسا وفقيه فارس، وشرح «المستعمل» لمنصور وكان فقيهاً مجوداً {cite:tabaqat-fuqaha-abbas-1981 p. 62}. ليس هو أبا سعيد الإصطخري (person/al-istakhri-abu-said-al-hasan)، والاسم الكامل غير مذكور في النص."
  en: "Al-Qadi Abu Muhammad al-Istakhri studied fiqh under al-Qadi Abu Hamid al-Marwarudhi; he was judge of Fasa and jurist of Fars, who commented on Mansur's al-Mustamal, and an accomplished jurist {cite:tabaqat-fuqaha-abbas-1981 p. 62}. He is not Abu Sa'id al-Istakhri (person/al-istakhri-abu-said-al-hasan), and his full name is not given in the text."
