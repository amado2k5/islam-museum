summary:
  ar: "القاضي أبو محمد الاصطخري، تفقه على القاضي أبي حامد المروروذي، وكان قاضي فسا وفقيه فارس، وشرح «المستعمل» لمنصور وكان فقيهاً مجوداً {cite:tabaqat-fuqaha-abbas-1981 p. 62}. ليس هو أبا سعيد الإصطخري (person/al-istakhri-abu-said-al-hasan)، والاسم الكامل غير مذكور في النص."
  en: "Al-Qadi Abu Muhammad al-Istakhri studied fiqh under al-Qadi Abu Hamid al-Marwarudhi; he was judge of Fasa and jurist of Fars, who commented on Mansur's al-Mustamal, and an accomplished jurist {cite:tabaqat-fuqaha-abbas-1981 p. 62}. He is not Abu Sa'id al-Istakhri (person/al-istakhri-abu-said-al-hasan), and his full name is not given in the text."
  fr: "Le cadi Abu Muhammad al-Istakhri étudia le fiqh auprès du cadi Abu Hamid al-Marwarudhi ; il fut cadi de Fasa et juriste du Fars, commenta al-Musta'mal de Mansur, et fut un juriste accompli {cite:tabaqat-fuqaha-abbas-1981 p. 62}. Il n'est pas Abu Sa'id al-Istakhri (person/al-istakhri-abu-said-al-hasan), et son nom complet n'est pas donné dans le texte."
  es: "Al-Qadi Abu Muhammad al-Istakhri estudió fiqh con al-Qadi Abu Hamid al-Marwarudhi; fue juez de Fasa y jurista de Fars, quien comentó sobre al-Mustamal de Mansur, y un jurista consumado {cita:tabaqat-fuqaha-abbas-1981 p. 62}. Él no es Abu Sa'id al-Istakhri (persona/al-istakhri-abu-said-al-hasan), y su nombre completo no aparece en el texto."
  ur: "القادی ابو محمد الاستخری نے القادی ابو حامد المرودی کے تحت فقہ کی تعلیم حاصل کی۔ وہ فاسہ کے جج اور فارس کے فقیہ تھے، جنہوں نے منصور کے المستمل پر تبصرہ کیا، اور ایک ماہر فقیہ {حوالہ:طبقات-فقہا-عباس-1981 ص۔ 62}۔ وہ ابو سعید الاستخری ⁦(شخص/الاستخری ابو سعید الحسن)⁩ نہیں ہیں، اور متن میں ان کا پورا نام نہیں دیا گیا ہے۔"
