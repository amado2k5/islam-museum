summary:
  ar: "الفضل بن صالح بن علي الهاشمي العباسي، أبو العباس، أمير عباسي أقام الحج سنة 138 هـ وولي مصر للمهدي وأقره الهادي وكانت ولايته أقل من سنة، ثم ولي دمشق، شجاع شاعر أديب، ⁦(122 - 172 هـ)⁩."
  en: "Al-Fadl ibn Salih ibn Ali al-Hashimi al-Abbasi, Abu al-Abbas, an Abbasid amir who led the pilgrimage in 138 AH, governed Egypt for under a year and later Damascus; brave, an eloquent poet and man of letters (122-172 AH)."
  fr: "Al-Fadl ibn Salih ibn Ali al-Hashimi al-Abbasi, Abu al-Abbas, émir abbasside qui dirigea le pèlerinage en 138 H, gouverna l’Égypte moins d’un an puis Damas ; courageux, poète éloquent et homme de lettres (122–172 H)."
  es: "Al-Fadl ibn Salih ibn Ali al-Hashimi al-Abbasi, Abu al-Abbas, un emir abasí que dirigió la peregrinación en el año 138 de la Hégira, gobernó Egipto durante menos de un año y posteriormente Damasco; valiente, poeta elocuente y hombre de letras (122-172 de la Hégira)."
  ur: "الفضل بن صالح بن علی الہاشمی العباسی، ابو العباس، ایک عباسی امیر جس نے 138 ہجری میں حج کی قیادت کی، مصر پر ایک سال سے کم اور بعد میں دمشق پر حکومت کی۔ بہادر، ایک فصیح شاعر اور خطوط کا آدمی ⁦(122-172ھ)⁩۔"
  tr: "El-Fadl ibn Salih ibn Ali el-Haşimi el-Abbasi, Ebu el-Abbas, Hicri 138 yılında Hac ibadetini yerine getiren ve El-Mehdi adına Mısır valiliğine atanan ve El-Hadi tarafından da onaylanan bir Abbasi prensidir. Görev süresi bir yıldan az sürdükten sonra Şam valiliğine atandı. Cesur bir şair ve edebiyatçıydı (Hicri 122-172)."
  id: "Al-Fadl ibn Salih ibn Ali al-Hashimi al-Abbasi, Abu al-Abbas, seorang pangeran Abbasiyah yang menunaikan ibadah haji pada tahun 138 H dan diangkat menjadi gubernur Mesir untuk al-Mahdi dan dikonfirmasi oleh al-Hadi. Masa jabatannya berlangsung kurang dari setahun, kemudian ia diangkat menjadi gubernur Damaskus. Ia adalah seorang penyair dan sastrawan yang pemberani (122-172 H)."
