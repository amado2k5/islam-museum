roles: [scholar]
gender: male
summary:
  ar: "أحمد بن الحسين، أبو القاسم ابن قسي، أول ثائر في الأندلس عند اختلال دولة الملثمين، رومي الأصل من بادية شلب، ادعى الهداية وتسمى بالإمام، ثم هاجر إلى الموحدين وعاد إلى الخلاف فقتله أهل شلب؛ توفي سنة ٥٤٦هـ الموافقة ١١٥١م."
  en: "Ahmad ibn al-Husayn, Abu al-Qasim ibn Qasi, the first rebel in al-Andalus when the state of the Almoravids was faltering, of Roman origin from the countryside of Silves, who claimed guidance and took the title of imam, later migrated to the Almohads and returned to dissent, and was killed by the people of Silves; died 546 AH, equal to 1151 CE."
  es: "Ahmad ibn al-Husayn, Abu al-Qasim ibn Qasi, el primer rebelde en al-Ándalus cuando el estado de los almorávides flaqueaba, de origen romano de la región rural de Silves, que reclamó guía y tomó el título de imán, posteriormente emigró a los almohades y volvió a disentir, y fue asesinado por la gente de Silves; murió en el año 546 de la Hégira, equivalente al año 1151 d. C."
  fr: "Ahmad ibn al-Husayn, Abu al-Qasim ibn Qasi, le premier rebelle en al-Andalus alors que l'État des Almoravides vacillait, d'origine romaine de la campagne de Silves, qui prétendait être guidé et prit le titre d'imam, migra plus tard vers les Almohades et retourna à la dissidence, et fut tué par les habitants de Silves; mort en 546 AH, soit 1151 CE."
  ur: "احمد بن الحسین، ابو القاسم بن قاسی، اندلس کا پہلا باغی جب الموراویڈز کی حالت زوال پذیر تھی، رومی نژاد سلویس کے دیہی علاقوں سے، جس نے رہنمائی کا دعویٰ کیا اور امام کا لقب اختیار کیا، بعد میں المواحد کی طرف ہجرت کی اور اختلاف کی طرف واپس آئے، اور سلویس کے لوگوں کے ہاتھوں مارے گئے۔ وفات 546ھ بمطابق 1151ء۔"
  tr: "Ahmed ibn el-Hüseyin, diğer adıyla Ebu el-Kasım ibn Kasi, Moravidlerin devleti karışıklık içindeyken Endülüs'te ilk isyancı olan, Silves çölünden Romalı kökenli bir kişiydi. Hidayete erdiğini iddia ederek kendisini İmam ilan etti, sonra Muhadlara göç etti ve halifeliğe geri döndü. Bunun üzerine Silves halkı onu öldürdü; Hicri 546 yılında (Miladi 1151) vefat etti."
  id: "Ahmad ibn al-Husayn, Abu al-Qasim ibn Qasi, pemberontak pertama di Andalusia ketika negara Almoravid berada dalam kekacauan, berasal dari Romawi dari gurun Silves, mengklaim sebagai penuntun dan menyebut dirinya Imam, kemudian ia berhijrah ke Almohad dan kembali ke kekhalifahan, sehingga penduduk Silves membunuhnya; ia meninggal pada tahun 546 H yang setara dengan 1151 M."
