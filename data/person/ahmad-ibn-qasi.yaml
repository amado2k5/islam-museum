summary:
  ar: "أحمد بن الحسين، أبو القاسم ابن قسي، أول ثائر في الأندلس عند اختلال دولة الملثمين، رومي الأصل من بادية شلب، ادعى الهداية وتسمى بالإمام، ثم هاجر إلى الموحدين وعاد إلى الخلاف فقتله أهل شلب؛ توفي سنة ٥٤٦هـ الموافقة ١١٥١م."
  en: "Ahmad ibn al-Husayn, Abu al-Qasim ibn Qasi, the first rebel in al-Andalus when the state of the Almoravids was faltering, of Roman origin from the countryside of Silves, who claimed guidance and took the title of imam, later migrated to the Almohads and returned to dissent, and was killed by the people of Silves; died 546 AH, equal to 1151 CE."
