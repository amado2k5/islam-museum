summary:
  ar: "أحمد مدحت، كاتب عثماني وصحفي، ولد في إسطنبول سنة 1260هـ/1844م، وعمل في ولاية الطونة في روسجوق ثم في بغداد، وسُجن ونُفي إلى رودس سنة 1289هـ/1872م، وتولى تحرير «ترجمان الحقيقة» سنة 1295هـ/1878م، وألّف نحو مئة وخمسين كتابًا في الرواية والمعرفة المبسطة، وتوفي سنة 1331هـ/1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
  en: "Ahmed Midhat, Ottoman writer and journalist, born in Istanbul in 1260/1844. He served under Midhat Pasha in the provinces of the Tuna and Baghdad, was exiled to Rhodes in 1872, and edited the periodical Terdjuman-i Hakikat from 1878. He wrote some 150 books of fiction and popularised knowledge, and died in 1331/1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
