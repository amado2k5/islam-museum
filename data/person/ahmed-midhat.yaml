summary:
  ar: "أحمد مدحت، كاتب عثماني وصحفي، ولد في إسطنبول سنة 1260هـ/1844م، وعمل في ولاية الطونة في روسجوق ثم في بغداد، وسُجن ونُفي إلى رودس سنة 1289هـ/1872م، وتولى تحرير «ترجمان الحقيقة» سنة 1295هـ/1878م، وألّف نحو مئة وخمسين كتابًا في الرواية والمعرفة المبسطة، وتوفي سنة 1331هـ/1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
  en: "Ahmed Midhat, Ottoman writer and journalist, born in Istanbul in 1260/1844. He served under Midhat Pasha in the provinces of the Tuna and Baghdad, was exiled to Rhodes in 1872, and edited the periodical Terdjuman-i Hakikat from 1878. He wrote some 150 books of fiction and popularised knowledge, and died in 1331/1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
  es: "Ahmed Midhat, escritor y periodista otomano, nació en Estambul en 1260/1844. Sirvió bajo las órdenes de Midhat Pasha en las provincias de Tuna y Bagdad, fue exiliado a Rodas en 1872 y dirigió la revista Terdjuman-i Hakikat desde 1878. Escribió unos 150 libros de ficción y divulgación, y falleció en 1331/1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
  fr: "Ahmed Midhat, écrivain et journaliste ottoman, né à Istanbul en 1260/1844. Il a servi sous Midhat Pacha dans les provinces de Tuna et de Bagdad, a été exilé à Rhodes en 1872 et a édité le périodique Terdjuman-i Hakikat à partir de 1878. Il a écrit quelque 150 livres de fiction et de vulgarisation scientifique, et est mort en 1331/1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
  ur: "احمد مدحت، عثمانی مصنف اور صحافی، استنبول میں 1260/1844 میں پیدا ہوئے۔ اس نے ٹونا اور بغداد کے صوبوں میں مدحت پاشا کے ماتحت خدمات انجام دیں، 1872 میں رہوڈز میں جلاوطنی اختیار کی گئی، اور 1878 سے رسالہ تردجمان-حکیکت کی تدوین کی۔ 1 ص۔ 311}۔"
  tr: "Osmanlı yazar ve gazeteci Ahmed Midhat, Hicri 1260/Miladi 1844 yılında İstanbul'da doğdu. Russuk'taki Tuna vilayetinde ve daha sonra Bağdat'ta çalıştı. Hicri 1289/Miladi 1872 yılında hapsedildi ve Rodos'a sürgün edildi. Hicri 1295/Miladi 1878 yılında \"Tarjuman el-Hakika\"nın editörlüğünü üstlendi. Anlatı ve basitleştirilmiş bilgi üzerine yaklaşık yüz elli kitap yazdı. Hicri 1331/Miladi 1912 yılında vefat etti. {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}"
  id: "Ahmed Midhat, seorang penulis dan jurnalis Utsmaniyah, lahir di Istanbul pada tahun 1260 H/1844 M. Ia bekerja di provinsi Tuna di Russuq dan kemudian di Baghdad. Ia dipenjara dan diasingkan ke Rhodes pada tahun 1289 H/1872 M. Ia mengambil alih penyuntingan “Tarjuman al-Haqiqa” pada tahun 1295 H/1878 M. Ia menulis sekitar seratus lima puluh buku tentang narasi dan pengetahuan yang disederhanakan. Ia meninggal pada tahun 1331 H/1912 M. {cite:encyclopaedia-of-islam-2 vol. 1 p. 311}."
