  ar: "ولاه المهتدي خراج فلسطين، وكانت له سبعة ندماء لا يأنس بغيرهم كل رجل منهم منفرد بنوع من العلم، وله الخبر المشهور مع ابن دراج الطفيلي الذي دخل مجلسه في زي ندمائه فتعقبه بالشطرنج والنرد والعود والطنبور حتى رمى حاجبه بخمسين بندقة رصاص من قوس بندق {cite:muruj-al-dhahab p. 561-563}."
