summary:
  ar: "صاحب قلعة ألموت وزعيم الإسماعيلية الباطنية، وصفه ابن العماد بقوله وكان داهية ماكراً زنديقاً من شياطين الأنس، توفي سنة ثمان عشرة وخمس مئة وكان ولده أبو الفتح نصر الله {cite:shadharat-dhahab p. 538}."
  en: "Lord of Alamut and leader of the Isma'ili Batiniyya — Ibn al-'Imad calls him 'a scheming arch-trickster among the devils of mankind'; he died in 518 {cite:shadharat-dhahab p. 538}."
  es: "Señor de Alamut y líder de la Batiniyya Isma'ili: Ibn al-'Imad lo llama \"un astuto embaucador entre los demonios de la humanidad\"; murió en 518 {cita: shadharat-dhahab p. 538}."
  fr: "Seigneur d'Alamut et chef des Batiniyya ismaéliens — Ibn al-'Imad le qualifie de « grand fourbe intrigant parmi les démons de l'humanité »; il mourut en 518 {cite: shadharat-dhahab p. 538}."
  ur: "الموت کا رب اور اسماعیلی بطنیہ کا رہنما - ابن العماد اسے 'انسانوں کے شیاطین میں سے ایک چال باز' کہتا ہے۔ ان کی وفات 518ء میں ہوئی۔ 538}۔"
  tr: "Alamut Kalesi'nin sahibi ve Batini İsmaili lideri İsmaililer, İbn al-Imad tarafından şöyle tanımlanmıştır: O, kurnaz ve kurnaz bir sapkındı, insanların şeytanlarından biriydi. Beş yüz on sekiz yaşında öldü. Oğlu Ebu el-Feth Nasrallah'tı {kaynak: shadharat-dhahab, s. 538}."
  id: "Pemilik Benteng Alamut dan pemimpin Batini Ismaili Ismaili digambarkan oleh Ibn al-Imad berkata: Dia adalah seorang bidat yang licik dan licik, salah satu iblis manusia. Dia meninggal pada tahun lima ratus delapan belas. Putranya adalah Abu al-Fath Nasrallah {cite:shadharat-dhahab, hlm. 538}."
