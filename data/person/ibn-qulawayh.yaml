summary:
  ar: "بطاقة أولية لجعفر بن محمد ابن قولويه القمي، فقيه ومؤرخ قم القرن العاشر صاحب «كامل الزيارات»، توفي سنة ٩٧٨م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ja'far ibn Muhammad Ibn Qulawayh al-Qummi, the tenth-century jurist and historian of Qum author of Kamil al-Ziyarat, d. 978; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar de Ja'far ibn Muhammad Ibn Qulawayh al-Qummi, jurista e historiador de Qom del siglo X, autor de Kamil al-Ziyarat, fallecido en 978; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Ja'far ibn Muhammad Ibn Qulawayh al-Qummi, juriste et historien de Qom du Xe siècle, auteur de Kamil al-Ziyarat, mort en 978; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "کامل الزیارات کے مصنف، قم کے دسویں صدی کے فقیہ اور مؤرخ جعفر بن محمد ابن قولویہ القمی کے لیے مسودہ کارڈ۔ 978; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Onuncu yüzyılda Kum'un hukukçusu ve tarihçisi, 'Kamil al-Ziyarat' kitabının yazarı ve 978 yılında ölen Ja'far ibn Muhammed bin Qulawayh al-Qummi'nin ön kartı; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan oleh Ja'far ibn Muhammad ibn Qulawayh al-Qummi, seorang ahli hukum dan sejarawan Qom pada abad kesepuluh, penulis 'Kamil al-Ziyarat', yang meninggal pada tahun 978 M; buku biografi menyebutkannya, dan biografinya belum diulas di halaman."
