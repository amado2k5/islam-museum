summary:
  ar: "قارئ قرآن مصري شاب نشأ في الرياض، بدأ حفظ القرآن في الخامسة وأتمه في الثانية عشرة، وانتشرت تلاواته عبر يوتيوب ومنصات التواصل حتى صار من أشهر الأصوات القرآنية الشابة في العالم العربي، وأصدر كتاب «إن ربي لطيف» سنة 2022."
  en: "Young Egyptian Qur'an reciter raised in Riyadh. He began memorising the Qur'an at five and completed it at twelve; his recitations spread through YouTube and social media until he became one of the best-known young Qur'anic voices in the Arab world, and he published the book Inna Rabbi Latif in 2022."
  ur: "نوجوان مصری قاریِ قرآن جو ریاض میں پلے بڑھے۔ انہوں نے پانچ برس کی عمر میں حفظ شروع کیا اور بارہ برس میں مکمل کیا؛ ان کی تلاوتیں یوٹیوب اور سوشل میڈیا سے پھیل کر عرب دنیا کی معروف نوجوان قرآنی آوازوں میں شامل ہو گئیں، اور 2022 میں ان کی کتاب «إن ربي لطيف» شائع ہوئی۔"
  fr: "Jeune récitateur égyptien du Coran élevé à Riyad. Il commença à apprendre le Coran par cœur à cinq ans et l'acheva à douze ; ses récitations se répandirent sur YouTube et les réseaux sociaux jusqu'à faire de lui l'une des jeunes voix coraniques les plus connues du monde arabe, et il publia le livre Inna Rabbi Latif en 2022."
  es: "Joven recitador egipcio del Corán, criado en Riad. Comenzó a memorizar el Corán a los cinco años y lo completó a los doce; sus recitaciones se difundieron a través de YouTube y las redes sociales hasta convertirse en una de las voces jóvenes del Corán más conocidas del mundo árabe, y publicó el libro Inna Rabbi Latif en 2022."
  tr: "Riyad'da büyüyen genç bir Mısırlı Kur'an okuyucusu olan bu kişi, beş yaşında Kur'an ezberlemeye başladı ve on iki yaşında tamamladı. Kur'an okumaları YouTube ve sosyal medya platformları aracılığıyla yayıldı ve Arap dünyasının en ünlü genç Kur'an okuyucularından biri haline geldi. 2022 yılında ise \"Şüphesiz Rabbim Çok Merhametlidir\" adlı kitabını yayınladı."
  id: "Seorang qari Al-Quran muda asal Mesir yang dibesarkan di Riyadh, ia mulai menghafal Al-Quran pada usia lima tahun dan menyelesaikannya pada usia dua belas tahun. Bacaannya menyebar melalui YouTube dan platform media sosial hingga ia menjadi salah satu suara Al-Quran muda paling terkenal di dunia Arab, dan ia menerbitkan buku \"Sesungguhnya Tuhanku Maha Baik\" pada tahun 2022."
