summary:
  ar: "فيض الله المعروف بفيضي بن مبارك الأكبر آبادي، مفسر عارف بالأدبين العربي والفارسي من أهل الهند، ولد وتوفي بأكبر آباد، اتصل بالسلطان أكبر ولقب بملك الشعراء، وله «سواطع الإلهام» تفسير بالحروف غير المنقطعة وديوان فارسي وترجمة «ليلاوتي» عن السنسكريتية، 954 إلى 1004 هـ الموافقة 1547 إلى 1595 م {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 168}."
  en: "Fayd Allah, known as Faizi, son of Mubarak, of Akbarabad, an exegete versed in Arabic and Persian letters, born and died at Akbarabad (Agra), 954 to 1004 AH (1547 to 1595 CE); he attached himself to Sultan Akbar and was called king of poets, and his works include Sawati' al-Ilham, a commentary in undotted letters, a Persian diwan and a translation of Lilavati from Sanskrit {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 168}."
  es: "Fayd Allah, conocido como Faizi, hijo de Mubarak, de Akbarabad, un exegeta versado en letras árabes y persas, nació y murió en Akbarabad (Agra), 954 a 1004 AH (1547 a 1595 d. C.); se unió al sultán Akbar y fue llamado rey de los poetas, y sus obras incluyen Sawati' al-Ilham, un comentario en letras sin puntos, un diwan persa y una traducción de Lilavati del sánscrito {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 168}."
  fr: "Fayd Allah, connu sous le nom de Faizi, fils de Mubarak, d'Akbarabad, exégète versé dans les lettres arabes et persanes, né et mort à Akbarabad (Agra), de 954 à 1004 AH (1547 à 1595 CE); il s'est attaché au sultan Akbar et a été appelé roi des poètes, et ses œuvres comprennent Sawati' al-Ilham, un commentaire en lettres non pointées, un diwan persan et une traduction de Lilavati du sanskrit {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 168}."
