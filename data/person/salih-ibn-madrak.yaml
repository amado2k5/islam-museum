id: person/salih-ibn-madrak
class: person
label: { ar: "صالح بن مدرك" }
summary:
  ar: "أمير طيء، وثب هو وقومه سنة تسع فانتهبوا الركب العراقي فذهب للحجاج فيه ما قيمته ألف ألف مثقال {cite:tarikh-khulafa-minhaj-1434 p. 576}. وعند المسعودي وقع في نبهان وسنبس وغيرهم من طيء بحاج سنة خمس وثمانين ومائتين بقاع الأجفر فتشوش الحاج ومات خلائق عطشاً وقتلاً وأخذ نحو ألفي ألف دينار {cite:muruj-al-dhahab p. 622}"
  en: "Tayyi''s amir; he and his tribe fell on the Iraqi caravan in 289 and took loot worth a million mithqals from the pilgrims {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  es: "El emir de Tayyi; él y su tribu atacaron la caravana iraquí en 289 y tomaron un botín por valor de un millón de mithqals de los peregrinos {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  fr: "L'émir de Tayyi; lui et sa tribu sont tombés sur la caravane irakienne en 289 et ont pris un butin d'une valeur d'un million de mithqals aux pèlerins {cite:tarikh-khulafa-minhaj-1434 p. 576}."
  ur: "طائی کا امیر؛ وہ اور اس کے قبیلے نے 289 میں عراقی قافلے پر حملہ کیا اور حاجیوں سے ایک ملین مثقال کا مال لوٹ لیا۔ 576}۔"
  tr: "Tayy Emiri ve kendisi ile halkı 9 Hicri yılında atlayarak Irak kervanlarını yağmaladılar ve hacılara bin mitkal değerinde bir miktar verildi {atıf:Tarikh-Khulafa-Minhaj-1434 s. 576}. El-Mes'udi'ye göre, 285 Hicri yılında El-Ecfar köyünde Tayy'den Nabhan, Sanbas ve diğerlerine düştü, bu da hacının kafasını karıştırdı, insanlar susuzluktan ve ölümden öldü ve yaklaşık iki bin dinar aldı {atıf:Muruj-al-Dhahab, s. 622}"
  id: "Emir Tayy, dan dia serta rakyatnya melompat pada tahun 9 H, menjarah kafilah Irak, dan para peziarah menerima sejumlah uang senilai seribu mithqal {cite:Tarikh-Khulafa-Minhaj-1434 hlm. 576}. Menurut al-Mas'udi, dia jatuh ke Nabhan, Sanbas, dan lainnya dari Tayy pada tahun 285 H di desa Al-Ajfar, menyebabkan peziarah menjadi bingung, dan orang-orang meninggal karena haus dan kematian, dan dia mengambil sekitar dua ribu dinar {cite:Muruj-al-Dhahab, hlm. 622}"
