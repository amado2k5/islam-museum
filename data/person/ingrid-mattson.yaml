summary:
  ar: "باحثة كندية في الدراسات الإسلامية وناشطة في الحوار بين الأديان، وُلدت سنة 1963 واعتنقت الإسلام سنة 1987 أثناء دراستها. نالت الدكتوراه من جامعة شيكاغو سنة 1999، ودرّست في معهد هارتفورد حيث أسست أول برنامج معتمد لتأهيل الأئمة والمرشدين المسلمين في أمريكا، وترأست الجمعية الإسلامية لأمريكا الشمالية (2006–2010) فكانت أول امرأة وأول معتنقة للإسلام تتولى رئاستها، وتشغل كرسي لندن ووندسور للدراسات الإسلامية في كلية هورون بجامعة وسترن أونتاريو."
  en: "Canadian scholar of Islamic studies and interfaith activist, born in 1963, who converted to Islam in 1987 during her studies. She took her doctorate at the University of Chicago in 1999, taught at Hartford Seminary, where she founded the first accredited graduate programme for Muslim chaplains in the United States, and presided over the Islamic Society of North America (2006–2010) as its first woman president and first convert to hold the post. She holds the London and Windsor Community Chair in Islamic Studies at Huron University College, University of Western Ontario."
  ur: "کینیڈا کی ماہرِ اسلامیات اور بین المذاہب مکالمے کی کارکن، 1963 میں پیدا ہوئیں اور 1987 میں دورانِ تعلیم اسلام قبول کیا۔ انھوں نے 1999 میں یونیورسٹی آف شکاگو سے ڈاکٹریٹ کی، ہارٹفورڈ سیمینری میں تدریس کی جہاں امریکہ میں مسلم چیپلنز کا پہلا باقاعدہ پروگرام قائم کیا، اور اسلامک سوسائٹی آف نارتھ امریکا کی صدر رہیں (2006ء–2010ء) — اس عہدے پر فائز ہونے والی پہلی خاتون اور پہلی نو مسلم۔ وہ ہورون یونیورسٹی کالج میں لندن و ونڈسر کمیونٹی چیئر برائے اسلامی مطالعات پر فائز ہیں۔"
