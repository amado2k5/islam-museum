summary:
  ar: "شاعر الأندلس المشهور؛ اجتمع به أبو العرب التجيبي وسأله عن حاله وقد بلغ في عمره إحدى وثمانين سنة فأنشد لنفسه أي عيش أو غذاء أو سينه لابن إحدى وثمانين سنه، ومن وصفه للأندلس إن للجنة بالأندلس مجتلى عين وريا نفس فسنا صبحتها من شنب {cite:nafh-tib-maqqari p. 24, 333}."
  en: "Al-Andalus's celebrated nature poet who, asked by Abu'l-Arab how he fared at eighty-one, answered in his famous self-elegy; his 'a paradise in al-Andalus' verses stand among the land's great praises {cite:nafh-tib-maqqari p. 24, 333}."
  es: "El célebre poeta de la naturaleza de Al-Ándalus, quien, al ser preguntado por Abu'l-Arab sobre su estado a los ochenta y un años, respondió en su famosa autoelegía; sus versos \"un paraíso en Al-Ándalus\" se encuentran entre los grandes elogios de la tierra {cite:nafh-tib-maqqari p. 24, 333}."
  fr: "Le célèbre poète de la nature d'Al-Andalus qui, interrogé par Abu'l-Arab sur son état à quatre-vingt-un ans, répondit dans sa célèbre auto-élégie; ses vers « un paradis en al-Andalus » figurent parmi les plus grands éloges du pays {cite: nafh-tib-maqqari p. 24, 333}."
