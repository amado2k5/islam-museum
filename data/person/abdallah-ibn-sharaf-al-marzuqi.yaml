summary:
  ar: "عبد الله بن شرف بن نجدة المرزوقي، فقيه شافعي، كان يحضر دروس تقي الدين بن رزين، وله شعر كثير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} كان معيدًا بالمشهد الحسيني بالقاهرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} من تصانيفه «شرح التنبيه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} توفي قبل سنة 700 هـ أو بعدها بقليل، بحسب ما ذكره النص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
  en: "Abd Allah ibn Sharaf ibn Najda al-Marzuqi, a Shafi'i jurist who attended the lectures of Taqi al-Din ibn Razin, and who wrote much poetry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} He was a repeater at the Husayni shrine in Cairo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} His work includes a commentary on al-Tanbih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966} He died before 700 AH or shortly after, according to the scan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14966}"
