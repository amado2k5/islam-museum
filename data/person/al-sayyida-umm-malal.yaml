gender: female
roles: [emir]
summary:
  ar: "أميرة زيرية من إفريقية، ابنة المنصور بن بلكين وأخت باديس، شاركت أخاها في تدبير الملك، ثم صارت وصية على ابن أخيها المعز بن باديس حين بويع صغيراً سنة 406هـ، وتوفيت في رجب 414هـ؛ يترجم لها كحالة عن «شهيرات التونسيات»."
  en: "A Zirid princess of Ifriqiya, daughter of al-Mansur ibn Buluggin and sister of Badis, who shared in her brother's government and became regent for her nephew al-Mu'izz ibn Badis when he was proclaimed as a child in 406 AH; she died in Rajab 414 AH. Kahhala's entry follows Shahirat al-Tunisiyyat."
  ur: "افریقیہ کی ایک زیری شہزادی، المنصور بن بلکین کی بیٹی اور بادیس کی بہن، جو اپنے بھائی کے ساتھ حکومت کے انتظام میں شریک رہیں اور 406ھ میں اپنے کم سن بھتیجے المعز بن بادیس کی بیعت پر ان کی سرپرست بنیں؛ رجب 414ھ میں فوت ہوئیں۔ کحالہ «شہیرات التونسیات» سے نقل کرتے ہیں۔"
