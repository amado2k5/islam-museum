label: { ar: "السيدة بنت المنصور الصنهاجية ⁦(أم ملال)⁩", en: "al-Sayyida bint al-Mansur al-Sanhajiyya (Umm Malal)", fr: "al-Sayyida bint al-Mansur al-Sanhajiyya (Umm Malal)", ur: "السیدہ بنت المنصور الصنہاجیہ ⁦(ام ملال)⁩", es: "al-Sayyida bint al-Mansur al-Sanhajiyya (Umm Malal)" }
gender: female
roles: [emir]
summary:
  ar: "أميرة زيرية من إفريقية، ابنة المنصور بن بلكين وأخت باديس، شاركت أخاها في تدبير الملك، ثم صارت وصية على ابن أخيها المعز بن باديس حين بويع صغيراً سنة 406هـ، وتوفيت في رجب 414هـ؛ يترجم لها كحالة عن «شهيرات التونسيات»."
  en: "A Zirid princess of Ifriqiya, daughter of al-Mansur ibn Buluggin and sister of Badis, who shared in her brother's government and became regent for her nephew al-Mu'izz ibn Badis when he was proclaimed as a child in 406 AH; she died in Rajab 414 AH. Kahhala's entry follows Shahirat al-Tunisiyyat."
  fr: "Une princesse ziride d'Ifriqiya, fille d'al-Mansur ibn Buluggin et sœur de Badis, qui partagea le gouvernement de son frère et devint régente pour son neveu al-Mu'izz ibn Badis lorsqu'il fut proclamé enfant en 406 de l’hégire ; Elle est morte à Rajab 414 de l’hégire. L'entrée de Kahhala suit Shahirat al-Tunisiyyat."
  ur: "افریقیہ کی ایک زیری شہزادی، المنصور بن بلکین کی بیٹی اور بادیس کی بہن، جو اپنے بھائی کے ساتھ حکومت کے انتظام میں شریک رہیں اور 406ھ میں اپنے کم سن بھتیجے المعز بن بادیس کی بیعت پر ان کی سرپرست بنیں؛ رجب 414ھ میں فوت ہوئیں۔ کحالہ «شہیرات التونسیات» سے نقل کرتے ہیں۔"
  es: "Princesa zirí de Ifriqiya, hija de al-Mansur ibn Buluggin y hermana de Badis, que participó en el gobierno de su hermano y se convirtió en regente de su sobrino al-Mu'izz ibn Badis cuando este fue proclamado niño en el año 406 de la Hégira; murió en Rajab del año 414 de la Hégira. La entrada de Kahhala sigue a la de Shahirat al-Tunisiyyat."
