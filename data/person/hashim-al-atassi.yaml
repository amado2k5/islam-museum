summary:
  ar: "سياسي ورجل دولة سوري (1875–1960) من حمص، لُقّب «أبو الجمهورية»؛ رأس الجمهورية السورية ثلاث مرات (1936–1939، 1949–1951، 1954–1955)، وشكّل الحكومة مرتين، ورأس المؤتمر السوري العام والجمعية التأسيسية، وكان من أبرز وجوه الكتلة الوطنية المطالبة بالاستقلال عن الانتداب الفرنسي."
  en: "Syrian politician and statesman from Homs (1875–1960), nicknamed Abu al-Jumhuriyya (Father of the Republic); he served as President of Syria three times (1936–1939, 1949–1951, 1954–1955), formed the government twice, and presided over the Syrian National Congress and the Constituent Assembly as a leading figure of the National Bloc's independence struggle against the French Mandate."
  ur: "حمص سے تعلق رکھنے والے سوری سیاست دان اور مردِ مملکت (1875–1960)، «ابو الجمهوریہ» کہلائے؛ وہ تین مرتبہ شام کے صدر رہے (1936–1939، 1949–1951، 1954–1955)، دو مرتبہ حکومت بنائی، اور سوری قومی کانگریس و آئین ساز اسمبلی کی صدارت کی؛ وہ فرانسیسی انتداب کے خلاف جدوجہدِ آزادی میں قومی بلاک کی نمایاں شخصیت تھے۔"
