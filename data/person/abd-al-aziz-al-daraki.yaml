  ar: "أبو القاسم عبد العزيز بن عبد الله الداركي، كان فقيهاً حصلاً، تفقه على أبي إسحاق المروزي {cite:tabaqat-fuqaha-abbas-1981 p. 61}. مات سنة خمس وسبعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}. وذكره ابن كج في ترجمته بأنه حضر مجلس الداركي {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
