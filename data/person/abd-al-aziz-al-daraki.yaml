summary:
  ar: "أبو القاسم عبد العزيز بن عبد الله الداركي، كان فقيهاً حصلاً، تفقه على أبي إسحاق المروزي {cite:tabaqat-fuqaha-abbas-1981 p. 61}. مات سنة خمس وسبعين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 61}. وذكره ابن كج في ترجمته بأنه حضر مجلس الداركي {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  en: "Abu al-Qasim Abd al-Aziz ibn Abd Allah al-Daraki, a jurist of solid learning, who studied fiqh under Abu Ishaq al-Marwazi {cite:tabaqat-fuqaha-abbas-1981 p. 61}. He died in 375 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Ibn Kajj mentions him in his biography as having attended the sessions of al-Daraki {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  fr: "Abu al-Qasim Abd al-Aziz ibn Abd Allah al-Daraki, juriste au savoir solide, qui étudia le fiqh auprès d'Abu Ishaq al-Marwazi {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Il mourut en 375 {cite:tabaqat-fuqaha-abbas-1981 p. 61}. Ibn Kajj le mentionne dans sa biographie comme ayant fréquenté les séances d'al-Daraki {cite:tabaqat-fuqaha-abbas-1981 p. 61}."
  es: "Abu al-Qasim Abd al-Aziz ibn Abd Allah al-Daraki, un jurista de sólidos conocimientos, que estudió fiqh con Abu Ishaq al-Marwazi {cita:tabaqat-fuqaha-abbas-1981 p. 61}. Murió en 375 {cita:tabaqat-fuqaha-abbas-1981 p. 61}. Ibn Kajj lo menciona en su biografía por haber asistido a las sesiones de al-Daraki {cita:tabaqat-fuqaha-abbas-1981 p. 61}."
  ur: "ابو القاسم عبد العزیز ابن عبد اللہ الدارکی، ایک ٹھوس علمی فقیہ، جس نے ابو اسحاق المروازی کے ماتحت فقہ کی تعلیم حاصل کی۔ 61}۔ آپ کی وفات 375ھ میں ہوئی۔ 61}۔ ابن کج نے اپنی سوانح عمری میں ان کا ذکر الدارکی کی نشستوں میں شرکت کے طور پر کیا ہے۔ 61}۔"
