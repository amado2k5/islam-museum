id: person/sufyan-al-thawri
class: person
tags: [madhahib-browser, mh-salaf]
label: { ar: "سفيان الثوري" }
summary:
  ar: "إمام أهل الكوفة في الحديث، صنف في عصر التدوين الأول، وقال الخلفاء خمسة أبو بكر وعمر وعثمان وعلي وعمر بن عبد العزيز، وأمر المنصور نائب مكة بحبسه مع عباد بن كثير سنة ثمان وخمسين ومئة وتخوف الناس أن يقتلهما إذا ورد الحج فمات المنصور قبل ذلك {cite:tarikh-khulafa-minhaj-1434 p. 374,426}. وعند المسعودي دخل على المهدي فسلم تسليم العامة ولم يسلم بالخلافة فقال له المهدي أفما تخشى أن نحكم فيك بهوانا فقال إن تحكم فيّ يحكم فيك ملك قادر يفرق بين الحق والباطل، فكتب له عهده على قضاء الكوفة فأخذه وخرج فرمى به في دجلة وهرب فلم يوجد، ومات بالبصرة سنة إحدى وستين ومائة وهو ابن ثلاث وستين سنة {cite:muruj-al-dhahab p. 312-313}، وعند ابن النديم سفيان بن سعيد بن مسروق الثوري من ولد ثور بن عبد مناة بن أدد بن طابخة وكان يقال إن في بني ثور ثلاثين رجلا ليس منهم رجل دون الربيع بن خثيم وهم بالكوفة وليس بالبصرة منهم أحد، ومات سفيان الثوري بالبصرة مسترا من السلطان ودفن عشاء وذلك في سنة إحدى وستين ومائة وهو ابن أربع وستين سنة وولد سنة سبع وتسعين، وأوصى إلى عمار بن سيف في كتبه فمحاها وأحرقها ولم يعقب سفيان فجعل كل شيء له لأخته وولدها ولم يورث المبارك بن سعيد شيئا، وله كتاب الجامع الكبير وكتاب الجامع الصغير وكتاب الفرائض {cite:fihrist-ibn-al-nadim p. 314-315}. وتقدمه دائرة المعارف الإسلامية فقيها ومحدثا ومفسرا من الجيل الأول من المؤلفين، ومؤسس المدرسة الثورية في الفقه، وقد رحل بين الكوفة والبصرة وصنعاء والحجاز والشام، وفر من تعقب الخلفاء، وتوفي في البصرة في شعبان سنة 161هـ"
  en: "Imam of Kufa in hadith, who compiled in the first age of codification and counted the caliphs as five — Abu Bakr, Umar, Uthman, Ali and Umar ibn Abd al-Aziz. In year 158 al-Mansur ordered his Meccan deputy to imprison him with Abbad ibn Kathir, and men feared he would kill them at hajj, but al-Mansur died first {cite:tarikh-khulafa-minhaj-1434 p. 374,426}. The Encyclopaedia of Islam presents him as a jurist, hadith transmitter and Qur'an commentator of the first literary generation and founder of the Thawriyya law school, who travelled between Kufa, Basra, Sanaa, the Hijaz and Syria, fled the caliphs' pursuit, and died in Basra in Shaban 161."
  ur: "کوفہ کے امامِ حدیث، جنہوں نے تدوین کے پہلے دور میں تصنیف کی۔ اسلامی دائرۃ المعارف انہیں پہلی ادبی نسل کا فقیہ، محدث اور مفسرِ قرآن اور فقہ کے ثوریہ مکتب کا بانی بتاتی ہے، جنہوں نے کوفہ، بصرہ، صنعاء، حجاز اور شام کے درمیان سفر کیا، خلفا کے تعاقب سے فرار اختیار کیا، اور شعبان 161ھ میں بصرہ میں وفات پائی۔"
  es: "Imán de Kufa en hadices, quien compiló en la primera era de codificación y contó a los califas como cinco: Abu Bakr, Umar, Uthman, Ali y Umar ibn Abd al-Aziz. En el año 158, al-Mansur ordenó a su lugarteniente de La Meca que lo encarcelara con Abbad ibn Kathir, y los hombres temieron que los matara durante el Hajj, pero al-Mansur murió primero {cite:tarikh-khulafa-minhaj-1434 p. 374,426}. La Enciclopedia del Islam lo presenta como un jurista, transmisor de hadices y comentarista del Corán de la primera generación literaria y fundador de la escuela jurídica Thawriyya, quien viajó entre Kufa, Basora, Sanaa, el Hiyaz y Siria, huyó de la persecución de los califas y murió en Basora en Shaban 161."
  fr: "L'imam de Koufa, spécialiste des hadiths, compila les sources au début de la codification et dénombra cinq califes: Abou Bakr, Omar, Othman, Ali et Omar ibn Abd al-Aziz. En 158, al-Mansur ordonna à son adjoint mecquois de l'emprisonner avec Abbad ibn Kathir. Craignant qu'il ne les tue lors du hajj, al-Mansur mourut le premier (voir: Tarikh-Khulafa-Minhaj-1434, p. 374, 426). L'Encyclopédie de l'Islam le présente comme un juriste, transmetteur de hadiths et commentateur du Coran de la première génération littéraire, fondateur de l'école juridique Thawriyya. Il voyagea entre Koufa, Bassora, Sanaa, le Hedjaz et la Syrie, échappa à la traque des califes et mourut à Bassora en Sha'ban 161."
  tr: "Kufe halkının imamı, belgelerin erken döneminde yazılmış olan hadislerdir. Beş halife Ebu Bekir, Ömer, Osman, Ali ve Ömer bin Abdülaziz'di. Mekke'nin vekili El-Mansur, 158 Hicri yılında Abbad bin Kathir ile birlikte hapsedilmesini emretti; insanlar Hac gelirse onları öldüreceğinden korktu, bu yüzden El-Mansur ondan önce öldü {atıf:Tarikh-khulafa-minhaj-1434, s. 374, 426}. El-Mes'udi el-Mehdi'ye girdi ve halka teslim oldu, fakat halifeliği kabul etmedi. Mehdi ona, 'Seni aşağılayarak yöneteceğimizden korkmuyor musun?' dedi. O da dedi ki, 'Beni yargılarsan, doğruyu yanlıştan ayırt edebilen güçlü bir kral seni yargılar.' Onunla Kufe'nin yargıcı olarak bir antlaşma yazdı, böylece onu aldı ve ayrıldı, fakat Dicle'ye atıldı ve kaçtı, fakat bulunamadı. 161 Hicri yılında Basra'da altmış üç yaşında öldü. {alıntı: Muruj-al-Dhahab s. 312-313} ve Ibn al-Nadim Sufyan ibn Sa'id ibn Masruq al-Thawri'ye göre, Thawr ibn Abd Manat ibn Adad ibn Tabikha'nın soyundan gelmektedir. Banu Thawr arasında otuz adam olduğu, hiçbiri al-Rabi' ibn Khuthaym'dan aşağı olmayan ve Kufe'deydiler fakat hiçbiri Basra'da değildi. Sufyan al-Thawri Basra'da sultandan saklanırken öldü ve 161 Hicri yılında, altmış dört yaşında, 197 doğumlu akşam namazında defnedildi. Kitaplarında Ammar ibn Saif'e öğüt verdi Onu sildi ve yaktı, Sufyan'ı takip etmedi, bu yüzden her şeyi kız kardeşine ve oğluna bıraktı, Al-Mubarak bin Sa'id ise hiçbir şey miras bırakmadı. Ayrıca Al-Jami' Al-Kabir, Al-Jami' Al-Saghir ve Miras Kitabı (cite:fihrist-ibn-al-nadim s. 314-315} adlı kitapları da yazdı. İslam Ansiklopedisi tarafından ilk kuşak yazarlardan bir hukukçu, hadis âlimi ve yorumcu, ayrıca devrimci hukuk okulunun kurucusu olarak sunulmaktadır. Kufa, Basra, Sana'a, Hicaz ve Levant arasında seyahat etti, halifelerin peşinden kaçtı ve 161 Hicri Şaban ayında Basra'da öldü"
  id: "Imam umat Kufa dalam hadis, ditulis pada era awal dokumentasi. Lima khalifah tersebut adalah Abu Bakr, Umar, Uthman, Ali, dan Umar ibn Abd al-Aziz. Al-Mansur, wakil Mekah, memerintahkan penahanannya bersama Abbad ibn Kathir pada tahun 158 H, dan orang-orang takut ia akan membunuh mereka jika Haji datang, sehingga Al-Mansur meninggal sebelum itu {cite:Tarikh-khulafa-minhaj-1434, hlm. 374, 426}. Al-Mas'udi menyerang al-Mahdi dan menyerah kepada rakyat, tetapi ia tidak menerima kekhalifahan. Mahdi berkata kepadanya, 'Apakah engkau takut kami akan memerintah dengan penghinaan?' Ia berkata, 'Jika engkau menghakimi saya, raja yang berkuasa akan menghakimi Anda yang bisa membedakan benar dan salah.' Ia menulis perjanjian dengan Al-Mas'udi sebagai hakim Kufa, maka ia membawanya dan pergi, tetapi ia dilempar ke Sungai Tigris dan melarikan diri, namun tidak ditemukan. Ia meninggal di Basra pada tahun 161 H pada usia enam puluh tiga tahun. {cite: Muruj-al-Dhahab hlm. 312-313}, dan menurut Ibn al-Nadim Sufyan ibn Sa'id ibn Masruq al-Thawri, keturunan Thawr ibn Abd Manat ibn Adad ibn Tabikha. Dikatakan bahwa di antara Banu Thawr terdapat tiga puluh pria, tidak ada yang kurang dari al-Rabi' ibn Khuthaym, dan mereka berada di Kufa tetapi tidak ada yang berada di Basra. Sufyan al-Thawri meninggal di Basra saat bersembunyi dari sultan dan dimakamkan dalam shalat malam tahun 161 H pada usia enam puluh empat tahun, lahir pada tahun 197. Ia menasihati Ammar ibn Saif dalam bukunya Ia menghapus dan membakarnya, dan tidak mengikuti Sufyan, sehingga ia mewariskan segalanya kepada saudara perempuannya dan putranya, dan Al-Mubarak bin Sa'id tidak mewarisi apa pun. Ia juga menulis buku Al-Jami' Al-Kabir, Al-Jami' Al-Saghir, dan Kitab Warisan {cite:fihrist-ibn-al-nadim hlm. 314-315}. Ia digambarkan oleh Ensiklopedia Islam sebagai seorang ahli hukum, ulama hadis, dan komentator dari generasi pertama penulis, serta pendiri sekolah revolusioner dalam bidang hukum. Ia melakukan perjalanan antara Kufa, Basra, Sana'a, Hejaz, dan Levant, melarikan diri dari pengejaran para khalifah, dan meninggal di Basra pada Sha'ban tahun 161 H"
