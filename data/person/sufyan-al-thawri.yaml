label: { ar: "سفيان الثوري" }
summary:
  ar: "إمام أهل الكوفة في الحديث، صنف في عصر التدوين الأول، وقال الخلفاء خمسة أبو بكر وعمر وعثمان وعلي وعمر بن عبد العزيز، وأمر المنصور نائب مكة بحبسه مع عباد بن كثير سنة ثمان وخمسين ومئة وتخوف الناس أن يقتلهما إذا ورد الحج فمات المنصور قبل ذلك {cite:tarikh-khulafa-minhaj-1434 p. 374,426}.، وعند المسعودي دخل على المهدي فسلم تسليم العامة ولم يسلم بالخلافة فقال له المهدي أفما تخشى أن نحكم فيك بهوانا فقال إن تحكم فيّ يحكم فيك ملك قادر يفرق بين الحق والباطل، فكتب له عهده على قضاء الكوفة فأخذه وخرج فرمى به في دجلة وهرب فلم يوجد، ومات بالبصرة سنة إحدى وستين ومائة وهو ابن ثلاث وستين سنة {cite:muruj-al-dhahab p. 312-313}، وعند ابن النديم سفيان بن سعيد بن مسروق الثوري من ولد ثور بن عبد مناة بن أدد بن طابخة وكان يقال إن في بني ثور ثلاثين رجلا ليس منهم رجل دون الربيع بن خثيم وهم بالكوفة وليس بالبصرة منهم أحد، ومات سفيان الثوري بالبصرة مسترا من السلطان ودفن عشاء وذلك في سنة إحدى وستين ومائة وهو ابن أربع وستين سنة وولد سنة سبع وتسعين، وأوصى إلى عمار بن سيف في كتبه فمحاها وأحرقها ولم يعقب سفيان فجعل كل شيء له لأخته وولدها ولم يورث المبارك بن سعيد شيئا، وله كتاب الجامع الكبير وكتاب الجامع الصغير وكتاب الفرائض {cite:fihrist-ibn-al-nadim p. 314-315}"
  en: "Imam of Kufa in hadith, who compiled in the first age of codification and counted the caliphs as five — Abu Bakr, Umar, Uthman, Ali and Umar ibn Abd al-Aziz. In year 158 al-Mansur ordered his Meccan deputy to imprison him with Abbad ibn Kathir, and men feared he would kill them at hajj, but al-Mansur died first {cite:tarikh-khulafa-minhaj-1434 p. 374,426}."
