summary:
  ar: "إبراهيم شناسي (وُلد في إسطنبول في 5 أغسطس 1826 – توفي فيها في 13 سبتمبر 1871)، أديب وصحفي ومترجم عثماني رائد، صاحب أول مسرحية عثمانية حديثة «زواج شاعر» (1859)، ومؤسس صحيفتي «ترجمان أحوال» و«تصوير أفكار»، وداعية تبسيط اللغة التركية والكتابة للجمهور الواسع، ومن قادة جمعية العثمانيين الجدد."
  en: "İbrahim Şinasi (born in Istanbul on 5 August 1826 – died there on 13 September 1871) was a pioneering Ottoman writer, journalist, translator and playwright: author of The Wedding of a Poet (1859), the first widely recognised Ottoman play in the modern European manner, founder of the newspapers Tercüman-ı Ahvâl and Tasvîr-i Efkâr, advocate of a simplified Turkish written for the general public, and a leader of the Young Ottomans."
  ur: "ابراہیم شناسی (پیدائش: استنبول، 5 اگست 1826ء – وفات: استنبول، 13 ستمبر 1871ء)، عثمانی ادیب، صحافی، مترجم اور ڈراما نویس؛ پہلے جدید عثمانی ڈرامے «شاعر کی شادی» (1859ء) کے مصنف اور «ترجمانِ احوال» و «تصویرِ افکار» کے بانی، سادہ ترکی زبان اور عوامی ادب کے داعی۔"
