summary:
  ar: "أبو البشر. عند البخاري أن الله خلقه وطوله ستون ذراعاً وأمره أن يسلم على الملائكة فكانت تحيته وتحية ذريته {cite:sahih-al-bukhari 3326}. وفي حديث الإسراء رآه النبي في السماء الدنيا فقال له مرحباً بك من ابن ونبي {cite:sahih-al-bukhari 3207}. وتعرض دائرة المعارف الإسلامية القصة القرآنية لتعليمه الأسماء وسجود الملائكة له وإقامته في الجنة وهبوطه، ثم الروايات الإسلامية اللاحقة عن خلقه وأولاده ووفاته، وتقارنها علمياً بالتقاليد اليهودية والمسيحية."
  en: "The father of mankind. In Bukhari, God created him sixty cubits tall and sent him to greet the angels, whose answer became his descendants' greeting {cite:sahih-al-bukhari 3326}; in the Isra account the Prophet met him in the lowest heaven {cite:sahih-al-bukhari 3207}. The Encyclopaedia of Islam sets out the Qur'anic story of his learning the names, the angels' prostration, his stay in the garden and his descent, then the later Muslim narrations about his making, children and death, and compares them academically with Jewish and Christian traditions."
  ur: "نوعِ انسانی کے باپ۔ بخاری میں ہے کہ اللہ نے انھیں ساٹھ ہاتھ قد پر پیدا کیا اور فرشتوں کو سلام کرنے کا حکم دیا، وہی ان کی اولاد کا سلام بنا {cite:sahih-al-bukhari 3326}؛ معراج کے بیان میں نبی نے انھیں آسمانِ دنیا میں دیکھا {cite:sahih-al-bukhari 3207}۔ دائرۃ المعارف الاسلامیہ ناموں کی تعلیم، فرشتوں کے سجدے، جنت میں قیام اور زمین پر اترنے کا قرآنی بیان، پھر ان کی تخلیق، اولاد اور وفات کی بعد کی اسلامی روایات پیش کرتی ہے اور یہودی و مسیحی روایات سے علمی موازنہ کرتی ہے۔"
