summary:
  ar: "الجبائي الإمام السني أبو محمد عبد الله بن أبي الحسن الجبائي الحنبلي؛ من قرية يقال لها الجبة من ناحية بُصرى من أعمال طرابلس، وكانوا قوماً نصارى وأبوه من علمائهم، فسبي صغيراً وأُسلم فحفظ القرآن في حلقة الحنابلة بجامع دمشق فقام قوم إلى الشيخ زين الدين علي بن إبراهيم بن نجا وهو على المنبر فقالوا هذا الصبي حفظ القرآن وهو على خير زيد أن نشتريه ونعتقه فاشترى وأُعتق، فسافر إلى همدان ولقي الحافظ أبا العلاء الهمداني فأقام عنده وصار يقريء الناس ويأخذ عليهم، ثم رحل إلى بغداد سنة أربعين وخمسمائة وسمع حديثها وصحب الشيخ عبد القادر الجيلي مدة مائلاً إلى الزهد، وكتب إليه يوماً وقد اشتاق الانقطاع عن الخلق فقال له عبد القادر: إذا أردت الانقطاع فلا تنقطع حتى تتفقه وتجالس الشيوخ وتتأدب بهم، وينبغي لصاحب الزاوية أن يكون كالشمعة يستضاء بنورها — وأجابه عن سؤال خطر له في مجلس عن الخلاص من العجب: إذا رأيت الأشياء من الله تعالى سلمت من العجب — وكانت حرمته كبيرة ببغداد وبأصبهان حتى إذا مشى في السوق قام له أهل السوق؛ توفي ثالث جمادى الآخرة سنة خمس وستمائة بأصبهان {cite:shadharat-dhahab p. 23-24}."
  en: "Al-Juba'i, the Sunni imam Abu Muhammad Abdallah b. Abi al-Hasan — from al-Jubba near Busra in the Tripoli district, a Christian family, his father one of their scholars; captured young and Islamized, he memorized the Qur'an in the Hanbali circle at Damascus's mosque, where men climbed to Shaykh Zayn al-Din's pulpit proposing 'this boy has memorized the Qur'an and is on goodness — shall we buy and free him?', and they did. He went to Hamadan to the hafiz Abu al-Ala, then to Baghdad in 540, and kept company with Abd al-Qadir al-Jilani — who answered his longing for seclusion: 'do not seclude until you have learned fiqh and kept the shaykhs' company; a zawiya-owner should be like a candle whose light is taken from it', and, asked mid-session how one escapes vanity: 'when you see things as from God.' His honour in Baghdad and Isfahan was such that market-folk rose when he passed; he died 3 Jumada II 605 at Isfahan {cite:shadharat-dhahab p. 23-24}."
