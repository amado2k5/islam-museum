summary:
  ar: "الجبائي الإمام السني أبو محمد عبد الله بن أبي الحسن الجبائي الحنبلي؛ من قرية يقال لها الجبة من ناحية بُصرى من أعمال طرابلس، وكانوا قوماً نصارى وأبوه من علمائهم، فسبي صغيراً وأُسلم فحفظ القرآن في حلقة الحنابلة بجامع دمشق فقام قوم إلى الشيخ زين الدين علي بن إبراهيم بن نجا وهو على المنبر فقالوا هذا الصبي حفظ القرآن وهو على خير زيد أن نشتريه ونعتقه فاشترى وأُعتق، فسافر إلى همدان ولقي الحافظ أبا العلاء الهمداني فأقام عنده وصار يقريء الناس ويأخذ عليهم، ثم رحل إلى بغداد سنة أربعين وخمسمائة وسمع حديثها وصحب الشيخ عبد القادر الجيلي مدة مائلاً إلى الزهد، وكتب إليه يوماً وقد اشتاق الانقطاع عن الخلق فقال له عبد القادر: إذا أردت الانقطاع فلا تنقطع حتى تتفقه وتجالس الشيوخ وتتأدب بهم، وينبغي لصاحب الزاوية أن يكون كالشمعة يستضاء بنورها — وأجابه عن سؤال خطر له في مجلس عن الخلاص من العجب: إذا رأيت الأشياء من الله تعالى سلمت من العجب — وكانت حرمته كبيرة ببغداد وبأصبهان حتى إذا مشى في السوق قام له أهل السوق؛ توفي ثالث جمادى الآخرة سنة خمس وستمائة بأصبهان {cite:shadharat-dhahab p. 23-24}."
  en: "Al-Juba'i, the Sunni imam Abu Muhammad Abdallah b. Abi al-Hasan — from al-Jubba near Busra in the Tripoli district, a Christian family, his father one of their scholars; captured young and Islamized, he memorized the Qur'an in the Hanbali circle at Damascus's mosque, where men climbed to Shaykh Zayn al-Din's pulpit proposing 'this boy has memorized the Qur'an and is on goodness — shall we buy and free him?', and they did. He went to Hamadan to the hafiz Abu al-Ala, then to Baghdad in 540, and kept company with Abd al-Qadir al-Jilani — who answered his longing for seclusion: 'do not seclude until you have learned fiqh and kept the shaykhs' company; a zawiya-owner should be like a candle whose light is taken from it', and, asked mid-session how one escapes vanity: 'when you see things as from God.' His honour in Baghdad and Isfahan was such that market-folk rose when he passed; he died 3 Jumada II 605 at Isfahan {cite:shadharat-dhahab p. 23-24}."
  es: "Al-Juba'i, el imán sunita Abu Muhammad Abdallah b. Abi al-Hasan — de al-Jubba cerca de Busra en el distrito de Trípoli, una familia cristiana, su padre uno de sus eruditos; capturado joven e islamizado, memorizó el Corán en el círculo hanbalí en la mezquita de Damasco, donde los hombres subieron al púlpito del jeque Zayn al-Din proponiendo 'este muchacho ha memorizado el Corán y es bueno, ¿lo compraremos y lo liberaremos?', y así lo hicieron. Fue a Hamadán con el hafiz Abu al-Ala, luego a Bagdad en 540, y se mantuvo en compañía de Abd al-Qadir al-Jilani, quien respondió a su anhelo de reclusión: 'no te aísles hasta que hayas aprendido fiqh y te hayas mantenido en compañía de los jeques; «El dueño de una zawiya debe ser como una vela cuya luz se apaga», y, al preguntársele a mitad de la sesión cómo se escapa de la vanidad, respondió: «cuando ves las cosas como si vinieran de Dios». Su honor en Bagdad e Isfahán era tal que la gente del mercado se ponía de pie cuando él pasaba; murió el 3 de Jumada II de 605 en Isfahán {cita: shadharat-dhahab págs. 23-24}."
  fr: "Al-Juba'i, l'imam sunnite Abu Muhammad Abdallah b. Abi al-Hasan — originaire d'al-Juba, près de Busra, dans le district de Tripoli, issu d'une famille chrétienne, son père était l'un de leurs érudits; capturé jeune et converti à l'islam, il mémorisa le Coran au sein du cercle hanbalite de la mosquée de Damas, où des hommes montèrent à la chaire du cheikh Zayn al-Din en proposant: « Ce garçon a mémorisé le Coran et est pieux — devons-nous l'acheter et le libérer ? », ce qu'ils firent. Il se rendit à Hamadan auprès du hafiz Abu al-Ala, puis à Bagdad en 540, où il fréquenta Abd al-Qadir al-Jilani — qui répondit à son désir de solitude: « Ne te retire pas avant d'avoir étudié le fiqh et fréquenté les cheikhs; « Un propriétaire de zawiya doit être comme une bougie dont on prend la lumière », et, interrogé en plein milieu d'une session sur la façon d'échapper à la vanité: « quand on voit les choses comme venant de Dieu ». Son honneur à Bagdad et à Ispahan était tel que les gens du marché se levèrent à sa mort; il mourut le 3 Jumada II 605 à Ispahan {cite: shadharat-dhahab p. 23-24}."
  ur: "الجوبی، سنی امام ابو محمد عبداللہ بن. ابی الحسن — طرابلس ضلع میں بصرہ کے قریب الجوبہ سے، ایک عیسائی خاندان، اس کے والد ان کے علماء میں سے ایک؛ نوجوان پکڑا گیا اور اسلام قبول کیا، اس نے دمشق کی مسجد میں حنبلی حلقہ میں قرآن حفظ کیا، جہاں لوگ شیخ زین الدین کے منبر پر چڑھ کر یہ تجویز پیش کرتے تھے کہ 'اس لڑکے نے قرآن حفظ کر لیا ہے اور نیکی پر ہے - کیا ہم اسے خرید کر آزاد کر دیں؟'، اور انہوں نے ایسا کیا۔ وہ 540 میں حافظ ابو العلا کے پاس حمدان گئے، پھر بغداد گئے، اور عبد القادر الجیلانی کے ساتھ صحبت اختیار کی - جس نے ان کی خلوت کی خواہش کا جواب دیا: 'جب تک آپ فقہ سیکھ نہ لیں اور شیخوں کی صحبت برقرار نہ رکھیں۔ زاویہ کے مالک کو ایک شمع کی مانند ہونا چاہیے جس کی روشنی اس سے لی جاتی ہے'، اور، وسط سیشن میں پوچھا گیا کہ انسان باطل سے کیسے بچ سکتا ہے: 'جب آپ چیزوں کو خدا کی طرف سے دیکھتے ہیں۔' بغداد اور اصفہان میں اس کی عزت ایسی تھی کہ گزرتے ہی بازاری لوگ بڑھ گئے۔ آپ کی وفات 3 جمادی الثانی 605 کو اصفہان میں ہوئی۔ 23-24}۔"
  tr: "Al-Jubbai, Sünni İmam Ebu Muhammed Abdullah bin Ebu Muhammed Abdullah bin Ebi el-Hasan el-Hasan el-Cubebey el-Hanbali, Trablus yakınlarındaki Bosra bölgesinde Al-Jubbah adlı bir köyden. Onlar Hristiyandı ve babası onların alimleri arasındaydı. Genç yaşta yakalandı ve İslam'ı benimsedi, Şam Camii'ndeki Hanbali çemberinde Kur'an'ı ezberledi. Bir grup, Şeyh Zain al-Din Ali bin İbrahim ibn Naja kürsüsündeyken yanına yaklaştı ve 'Bu çocuk iyi durumdayken Kur'an'ı ezberledi, böylece onu satın alıp özgür bırakabiliriz.' dedi. Onu satın aldı ve serbest bıraktı. Hamdan'a gitti ve ezberci Ebu al-Alaa el-Hamdani ile tanıştı. Onunla kaldı ve insanlara okumaya başladı, onlardan ders aldı. Sonra 540 Hicri yılında Bağdat'a gitti, konuşmasını dinledi, bir süre Şeyh Abdul Kadir Al-Jili'ye eşlik etti, asketizm eğilimindeydi. Bir gün, ona yaratılıştan bir mola arzusuyla yazdı. Abdul Kadir ona şöyle dedi: Eğer kesilmek istiyorsan, anlaşmaya varana kadar sözünü kesme, şeyhlerle otur ve onlara nazik ol. Zavi'nin sahibi, ışığında aydınlanan bir mum gibi olmalı—ve kurtuluşla ilgili bir toplantıda sorduğu şaşırtıcı bir soruya cevap verdi: Allah'tan bir şeyler gördüğünüzde, şaşkınlıktan korunursunuz — O'nun kutsallığı Bağdat ve İsfahan'da büyüktü, ta ki pazara girdiğinde pazar halkı onun için ayağa kalkana kadar; Cumade'l-Ahira'nın üçüncü gününde, altı yüz elli yılda, İsfahan'da öldü {atıf: shadharat-dhahab s. 23-24}."
  id: "Al-Jubbai, Imam Sunni Abu Muhammad Abdullah bin Abi al-Hasan al-Jubbai al-Hanbali, dari sebuah desa bernama Al-Jubbah di daerah Bosra dekat Tripoli. Mereka adalah Kristen, dan ayahnya termasuk di antara ulama mereka. Ia ditangkap muda dan memeluk Islam, menghafal Al-Quran dalam lingkaran Hanbali di Masjid Damaskus. Sekelompok orang mendekati Sheikh Zain al-Din Ali ibn Ibrahim ibn Naja saat ia berada di mimbar dan berkata, 'Anak ini telah menghafal Al-Qur'an saat kondisinya baik, jadi kita bisa membeli dan membebaskannya.' Ia membeli dan membebaskannya. Ia pergi ke Hamdan dan bertemu dengan penghafal Abu al-Alaa al-Hamdani. Dia tinggal bersamanya dan mulai membacakan kepada orang-orang serta belajar dari mereka. Kemudian dia pergi ke Baghdad pada tahun 540 H, mendengarkan pidatonya, menemani Sheikh Abdul Qadir Al-Jili untuk sementara waktu, condong ke arah pertapaan. Suatu hari, dia menulis surat kepadanya dengan merindukan jeda dari penciptaan. Abdul Qadir berkata kepadanya: Jika kamu ingin diputus, jangan menyela sampai mencapai kesepakatan, duduklah bersama para sheikh, dan bersikaplah sopan kepada mereka. Pemilik zawiya harus seperti lilin yang diterangi oleh cahayanya—dan dia menjawabnya dengan pertanyaan mengejutkan yang dia miliki dalam sebuah pertemuan tentang keselamatan: Ketika kamu melihat sesuatu dari Allah Yang Maha Kuasa, kamu terlindungi dari rasa heran — Kesucian-Nya besar di Baghdad dan Isfahan sampai ketika dia berjalan di pasar, orang-orang pasar membelanya; dia meninggal pada tanggal tiga Jumada al-Akhirah tahun enam ratus lima puluh di Isfahan {cite:shadharat-dhahab hlm. 23-24}."
