summary:
  ar: "جريجوريوس، بطريرك القسطنطينية إبان تمرد المورة. يذكر الصلابي أنه كان عضواً في جمعية إقامة اليونان الكبرى ⁦(الفكرة العظمى)⁩، وأنه اضطر لإصدار مرسوم ⁦(بيان الحرمان)⁩ ضد المتمردين لما استنكرت روسيا عصيان الأرثوذكس، لكن المخابرات العثمانية داهمت البطريركية فوقعت في يد الحكومة وثائق تشمل خطابات القساوسة قادة العصيان في المورة ومراسلات مع سفارتي إنجلترا وفرنسا وأخبار الأسلحة من مركز الجمعية السرية في أوديسا وإيصالات المساعدات المالية، ولم ينكر البطريرك شيئاً بل قال إنه هو الذي قام بكل شيء، فأصدر السلطان محمود الثاني فرماناً بعزله ثم إعدامه، ونُفذ الحكم يوم عيد الفصح، وانتُخب أويانيوس خلفاً له {cite:dawlat-uthmaniyya-salabi p. 364-365}."
  en: "Patriarch Gregory V of Constantinople — executed on Easter day 1821 after an Ottoman raid on the patriarchate seized documents tying him to the Greek revolt's secret society; he admitted everything, per the source {cite:dawlat-uthmaniyya-salabi p. 364-365}."
  es: "El patriarca Gregorio V de Constantinopla fue ejecutado el día de Pascua de 1821 después de que una incursión otomana en el patriarcado confiscara documentos que lo vinculaban con la sociedad secreta de la revuelta griega; según la fuente {cite:dawlat-uthmaniyya-salabi p. 364-365}, él lo admitió todo."
  fr: "Le patriarche Grégoire V de Constantinople — exécuté le jour de Pâques 1821 après qu'un raid ottoman sur le patriarcat ait saisi des documents le liant à la société secrète de la révolte grecque; il a tout admis, selon la source {cite:dawlat-uthmaniyya-salabi p. 364-365}."
  ur: "قسطنطنیہ کے پیٹریارک گریگوری پنجم - کو ایسٹر کے دن 1821 کو پھانسی دی گئی جب پیٹریاارکیٹ پر عثمانی چھاپے نے یونانی بغاوت کی خفیہ سوسائٹی سے منسلک دستاویزات ضبط کر لیں۔ اس نے سب کچھ تسلیم کیا، ماخذ کے مطابق {حوالہ: دولت عثمانیہ صلابی ص۔ 364-365}۔"
  tr: "Morea İsyanı sırasında Konstantinopolis Patriği Gregory. El-Sebabi, Yunanistan'ın Büyük Kuruluşu (Büyük Fikir) üyesi olduğunu ve Rusya Ortodoks isyanını kınadığında isyancılara karşı bir ferman (aforoz bildirisi) çıkarmak zorunda kaldığını belirtir. Ancak Osmanlı istihbaratı Patrikhaneye baskın düzenledi ve hükümet tarafından Morea'daki isyanı yöneten rahiplerin mektupları, İngiltere ve Fransa elçilikleriyle yazışmalar, Odessa'daki gizli topluluk merkezinden silah haberleri ve mali yardım makbuzları dahil olmak üzere belgeler ele geçirildi. Patrik hiçbir şeyi reddetmedi ama her şeyi kendisinin yaptığını söyledi. Sultan II. Mahmud onu tahttan indiren ve idam eden bir ferman çıkardı. Ceza Paskalya'da infaz edildi ve Ioannius onun halefi olarak seçildi {cite:dawlat-uthmaniyya-salabi, s. 364-365}."
  id: "Gregorius, Patriark Konstantinopel selama Pemberontakan Morea. Al-Salabi menyebutkan bahwa ia adalah anggota Grand Establishment of Greece (Gagasan Agung), dan bahwa ia dipaksa mengeluarkan dekrit (pernyataan ekskomunikasi) terhadap para pemberontak ketika Rusia mengutuk pemberontakan Ortodoks. Namun, intelijen Ottoman menyerbu Patriarkat, dan dokumen disita oleh pemerintah termasuk surat dari para imam yang memimpin pemberontakan di Morea, korespondensi dengan kedutaan Inggris dan Prancis, berita tentang senjata dari pusat masyarakat rahasia di Odessa, dan penerimaan bantuan keuangan. Patriark tidak menyangkal apa pun tetapi mengatakan bahwa dialah yang melakukan segalanya. Sultan Mahmud II mengeluarkan dekret yang menggulingkannya dan kemudian mengeksekusinya. Hukuman itu dilaksanakan pada Paskah, dan Ioannius terpilih sebagai penggantinya {cite:dawlat-uthmaniyya-salabi, hlm. 364-365}."
