summary:
  ar: "جريجوريوس، بطريرك القسطنطينية إبان تمرد المورة. يذكر الصلابي أنه كان عضواً في جمعية إقامة اليونان الكبرى (الفكرة العظمى)، وأنه اضطر لإصدار مرسوم (بيان الحرمان) ضد المتمردين لما استنكرت روسيا عصيان الأرثوذكس، لكن المخابرات العثمانية داهمت البطريركية فوقعت في يد الحكومة وثائق تشمل خطابات القساوسة قادة العصيان في المورة ومراسلات مع سفارتي إنجلترا وفرنسا وأخبار الأسلحة من مركز الجمعية السرية في أوديسا وإيصالات المساعدات المالية، ولم ينكر البطريرك شيئاً بل قال إنه هو الذي قام بكل شيء، فأصدر السلطان محمود الثاني فرماناً بعزله ثم إعدامه، ونُفذ الحكم يوم عيد الفصح، وانتُخب أويانيوس خلفاً له {cite:dawlat-uthmaniyya-salabi p. 364-365}."
  en: "Patriarch Gregory V of Constantinople — executed on Easter day 1821 after an Ottoman raid on the patriarchate seized documents tying him to the Greek revolt's secret society; he admitted everything, per the source {cite:dawlat-uthmaniyya-salabi p. 364-365}."
