summary:
  ar: "السير مجدي حبيب يعقوب ⁦(وُلد في 16 تشرين الثاني 1935 في بلبيس بمصر)⁩ جرّاح قلب مصري بريطاني وأستاذ جراحة القلب والصدر في إمبريال كوليدج لندن؛ أسس برنامج زراعة القلب في مستشفى هيرفيلد سنة 1980 وأجرى أول عملية زراعة قلب ورئة مجتمعة في بريطانيا سنة 1983، وأسس مؤسسة «سلسلة الأمل» الخيرية ومركز أسوان للقلب، ونال لقب فارس سنة 1992 ووسام الاستحقاق سنة 2014."
  en: "Sir Magdi Habib Yacoub (born 16 November 1935 in Bilbeis, Egypt) is an Egyptian-British heart surgeon and professor of cardiothoracic surgery at Imperial College London; he established the heart transplantation programme at Harefield Hospital in 1980 and performed the UK's first combined heart and lung transplant in 1983, founded the Chain of Hope charity and the Aswan Heart Centre, and was knighted in 1992 and appointed to the Order of Merit in 2014."
  ur: "سر مجدی حبیب یعقوب ⁦(پیدائش 16 نومبر 1935، بلبیس، مصر)⁩ مصری نژاد برطانوی ماہر جراحت قلب اور امپیریل کالج لندن میں کارڈیو تھوراسک سرجری کے پروفیسر ہیں؛ انھوں نے 1980 میں ہیئرفیلڈ اسپتال میں دل کی پیوندکاری کا پروگرام قائم کیا اور 1983 میں برطانیہ کی پہلی مشترکہ دل و پھیپھڑے کی پیوندکاری کی، «چین آف ہوپ» فلاحی ادارہ اور اسوان ہارٹ سینٹر قائم کیے، 1992 میں نائٹ کا خطاب اور 2014 میں آرڈر آف میرٹ پایا۔"
  es: "Sir Magdi Habib Yacoub (nacido el 16 de noviembre de 1935 en Bilbeis, Egipto) es un cirujano cardíaco egipcio-británico y profesor de cirugía cardiotorácica en el Imperial College de Londres; estableció el programa de trasplante de corazón en el Hospital Harefield en 1980 y realizó el primer trasplante combinado de corazón y pulmón del Reino Unido en 1983, fundó la organización benéfica Chain of Hope y el Aswan Heart Centre, y fue nombrado caballero en 1992 y condecorado con la Orden del Mérito en 2014."
  fr: "Sir Magdi Habib Yacoub (né le 16 novembre 1935 à Bilbeis, en Égypte) est un chirurgien cardiaque égypto-britannique et professeur de chirurgie cardiothoracique à l'Imperial College de Londres; il a créé le programme de transplantation cardiaque à l'hôpital Harefield en 1980 et a réalisé la première transplantation combinée cœur-poumons du Royaume-Uni en 1983, a fondé l'association caritative Chain of Hope et le centre cardiaque d'Assouan, et a été fait chevalier en 1992 et nommé à l'Ordre du Mérite en 2014."
  tr: "Sir Magdy Habib Yacoub (16 Kasım 1935, Belbeis, Mısır doğumlu), Mısır-Britanyalı bir kalp cerrahı ve Imperial College London'da kardiyotorasik cerrahi profesörüdür. 1980 yılında Herefield Hastanesi'nde kalp nakli programını kurdu ve 1983'te İngiltere'de ilk kombine kalp-akciğer naklini gerçekleştirdi. 'Hope Chain' yardım vakfını ve Aswan Kalp Merkezi'ni kurdu, 1992'de şövalye unvanı aldı ve 2014'te Liyakat Nişanı ile ödüllendirildi."
  id: "Sir Magdy Habib Yacoub (lahir 16 November 1935, di Belbeis, Mesir) adalah seorang ahli bedah jantung Mesir-Inggris dan profesor bedah kardiotoraks di Imperial College London. Ia mendirikan program transplantasi jantung di Herefield Hospital pada tahun 1980 dan melakukan transplantasi gabungan jantung-paru pertama di Inggris pada tahun 1983. Ia mendirikan yayasan amal 'Hope Chain' dan Aswan Heart Center, dianugerahi gelar kebangsawanan pada tahun 1992 dan dianugerahi Order of Merit pada tahun 2014."
