summary:
  ar: "السير مجدي حبيب يعقوب ⁦(وُلد في 16 تشرين الثاني 1935 في بلبيس بمصر)⁩ جرّاح قلب مصري بريطاني وأستاذ جراحة القلب والصدر في إمبريال كوليدج لندن؛ أسس برنامج زراعة القلب في مستشفى هيرفيلد سنة 1980 وأجرى أول عملية زراعة قلب ورئة مجتمعة في بريطانيا سنة 1983، وأسس مؤسسة «سلسلة الأمل» الخيرية ومركز أسوان للقلب، ونال لقب فارس سنة 1992 ووسام الاستحقاق سنة 2014."
  en: "Sir Magdi Habib Yacoub (born 16 November 1935 in Bilbeis, Egypt) is an Egyptian-British heart surgeon and professor of cardiothoracic surgery at Imperial College London; he established the heart transplantation programme at Harefield Hospital in 1980 and performed the UK's first combined heart and lung transplant in 1983, founded the Chain of Hope charity and the Aswan Heart Centre, and was knighted in 1992 and appointed to the Order of Merit in 2014."
  ur: "سر مجدی حبیب یعقوب (پیدائش 16 نومبر 1935، بلبیس، مصر) مصری نژاد برطانوی ماہر جراحت قلب اور امپیریل کالج لندن میں کارڈیو تھوراسک سرجری کے پروفیسر ہیں؛ انھوں نے 1980 میں ہیئرفیلڈ اسپتال میں دل کی پیوندکاری کا پروگرام قائم کیا اور 1983 میں برطانیہ کی پہلی مشترکہ دل و پھیپھڑے کی پیوندکاری کی، «چین آف ہوپ» فلاحی ادارہ اور اسوان ہارٹ سینٹر قائم کیے، 1992 میں نائٹ کا خطاب اور 2014 میں آرڈر آف میرٹ پایا۔"
