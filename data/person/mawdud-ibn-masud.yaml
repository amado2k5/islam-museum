label:
  ar: "مودود بن مسعود بن محمود بن سبكتكين"
  en: "Mawdud ibn Mas'ud al-Ghaznawi"
summary:
  ar: "سلطان غزنة بعد عمه محمد بن محمود؛ لما مات أبوه مسعود بن محمود سنة ثلاث وثلاثين وأربعمائة قام عمه محمد مقامه، فخرج مودود بن مسعود على عمه فقبض عليه وعاد إلى غزنة واستتب له الأمر {cite:muntazam-ibn-al-jawzi j.8 p.113}. توفي سنة اثنتين وأربعين وأربعمائة فقام مقامه عمه عبد الرشيد بن محمود {cite:muntazam-ibn-al-jawzi j.8 p.148}."
  en: "Sultan of Ghazna after his uncle Muhammad ibn Mahmud: when his father Mas'ud died in 433 and Muhammad was acclaimed, Mawdud marched on his uncle, seized him and made Ghazna his own. He died in 442 and was succeeded by his uncle Abd al-Rashid ibn Mahmud {cite:muntazam-ibn-al-jawzi j.8 p.113,148}."
