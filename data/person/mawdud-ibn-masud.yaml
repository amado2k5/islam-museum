issue:
  ar: 'وفي الشذرات: كانت دولته عشر سنين ومات في رجب سنة إحدى وأربعين وأربعمائة وله
    تسع وعشرون سنة وأقاموا بعده ولده وهو صبي صغير ثم خلعوه — وفي المنتظم توفي سنة
    اثنتين وأربعين وخلفه عمه عبد الرشيد؛ والأول أضبط في الشهر {cite:shadharat-dhahab
    p. 275} {cite:muntazam-ibn-al-jawzi j.8 p.148}.'
