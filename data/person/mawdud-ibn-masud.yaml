id: person/mawdud-ibn-masud
class: person
label:
  ar: مودود بن مسعود بن محمود بن سبكتكين
  en: Mawdud ibn Mas'ud al-Ghaznawi
  es: "Mawdud ibn Mas'ud al-Ghaznawi"
  fr: "Mawdud ibn Mas'ud al-Ghaznawi"
  ur: "مودود بن مسعود غزنوی"
summary:
  ar: سلطان غزنة بعد عمه محمد بن محمود؛ لما مات أبوه مسعود بن محمود سنة ثلاث وثلاثين
    وأربعمائة قام عمه محمد مقامه، فخرج مودود بن مسعود على عمه فقبض عليه وعاد إلى غزنة
    واستتب له الأمر {cite:muntazam-ibn-al-jawzi j.8 p.113}. توفي سنة اثنتين وأربعين
    وأربعمائة فقام مقامه عمه عبد الرشيد بن محمود {cite:muntazam-ibn-al-jawzi j.8 p.148}.
  en: 'Sultan of Ghazna after his uncle Muhammad ibn Mahmud: when his father Mas''ud
    died in 433 and Muhammad was acclaimed, Mawdud marched on his uncle, seized him
    and made Ghazna his own. He died in 442 and was succeeded by his uncle Abd al-Rashid
    ibn Mahmud {cite:muntazam-ibn-al-jawzi j.8 p.113,148}.'
  es: "Sultán de Ghazna tras su tío Muhammad ibn Mahmud: cuando su padre Mas'ud murió en 433 y Muhammad fue aclamado, Mawdud marchó contra su tío, lo apresó y se apoderó de Ghazna. Murió en 442 y fue sucedido por su tío Abd al-Rashid ibn Mahmud {cite:muntazam-ibn-al-jawzi j.8 p.113,148}."
  fr: "Sultan de Ghazni après son oncle Muhammad ibn Mahmud: à la mort de son père Mas'ud en 433 et suite à l'accession au trône de Muhammad, Mawdud marcha sur son oncle, le captura et s'empara de Ghazni. Il mourut en 442 et son oncle Abd al-Rashid ibn Mahmud lui succéda (voir: Muntazam ibn al-Jawzi, vol. 8, p. 113, 148)."
  ur: "اپنے چچا محمد بن محمود کے بعد غزنہ کا سلطان: جب اس کے والد مسعود کا 433 میں انتقال ہوا اور محمد کی تعریف کی گئی تو مودود نے اپنے چچا پر چڑھائی کی، اسے پکڑ لیا اور غزہ کو اپنا بنا لیا۔ اس کا انتقال 442 میں ہوا اور اس کے چچا عبد الرشید ابن محمود نے اس کا جانشین بنایا۔"
  tr: "Amcası Muhammed ibn Mahmud'un ardından Gazni Sultanı; babası Mes'ud ibn Mahmud dört yüz otuz üç yaşında öldüğünde, amcası Muhammed onun yerine geçti. Mevdud bin Mes'ud amcasına karşı isyan etti, onu tutukladı, Gazna'ya döndü ve durumu geri getirdi {atıf:Muntazam-ibn-al-jawzi J.8 s.113}. Dört yüz kırk iki yaşında öldü ve amcası Abd al-Rashid ibn Mahmoud onun yerine geçti {atıf:Muntazam-ibn-al-jawzi J.8 s.148}."
  id: "Sultan Ghazni setelah pamannya Muhammad ibn Mahmoud; ketika ayahnya Mas'ud ibn Mahmoud meninggal pada tahun empat ratus tiga puluh tiga, pamannya Muhammad menggantikannya. Mawdud ibn Mas'ud memberontak melawan pamannya, menangkapnya, kembali ke Ghazna, dan memulihkan keadaan {cite:Muntazam-ibn-al-jawzi J.8 hlm.113}. Ia meninggal pada tahun empat ratus empat puluh dua, dan pamannya Abd al-Rashid ibn Mahmoud menggantikannya {cite:Muntazam-ibn-al-jawzi J.8 hlm.148}."
