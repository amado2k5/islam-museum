summary:
  ar: "صوفي قادري من بدخشان (ت. 1661)، تلميذ ميان مير اللاهوري وخليفته، عاش أغلب حياته بعد تمام تربيته في كشمير منعزلًا في خلوة ضيقة، وانتفع به رغم عزلته اثنان من بيت تيمور: الأمير دارا شكوه وأخته جهان آرا، اللذان تركا وصفًا لعلاقتهما به. عُرف بإعلانه وحدة الوجود بعبارات حلّاجية أثارت خصومة بعض الظاهريين فكاد يُقتل لولا شفاعة تلميذيه الملكيين، وترك شعرًا فارسيًا وشرحًا على سور من القرآن ورسالة في وحدة الوجود كتبها لتلميذيه."
  en: "A Qadiri Sufi of Badakhshan (d. 1661), disciple and successor of Mian Mir of Lahore, who after his training was complete lived most of his remaining life in Kashmir enclosed in a narrow cell — yet two members of the Mughal house, the prince Dara Shikoh and his sister Jahanara, sought him out as disciples and left accounts of their relations with him. His proclamation of wahdat al-wujud in Hallajian terms drew the hostility of exoteric critics and near-persecution, from which his royal disciples' intercession saved him; he left Persian poetry, a commentary on several suras of the Qur'an, and a treatise on the oneness of being written for his two royal adepts."
  ur: "بدخشان کے ایک قادری صوفی (وفات 1661ء)، میاں میر لاہوری کے شاگرد و خلیفہ؛ تربیت مکمل ہونے کے بعد باقی زندگی کا بیشتر حصہ کشمیر میں ایک تنگ حجرے میں گوشہ نشینی میں گزارا، لیکن مغل خاندان کے دو افراد — شہزادہ دارا شکوہ اور ان کی بہن جہاں آرا — ان کے مرید ہوئے اور ان سے اپنے تعلق کے احوال لکھ چھوڑے۔ انھوں نے وحدت الوجود کا حلاجی انداز میں اعلان کیا جس سے بعض ظاہر پرستوں کی دشمنی بھڑکی اور شاہی مریدوں کی سفارش ہی نے انھیں بچایا؛ ان سے فارسی شاعری، چند سورتوں کی تفسیر اور اپنے دو شاہی مریدوں کے لیے وحدت الوجود پر ایک رسالہ یادگار ہے۔"

