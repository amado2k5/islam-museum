summary:
  ar: "صوفي قادري من بدخشان ⁦(ت. 1661)⁩، تلميذ ميان مير اللاهوري وخليفته، عاش أغلب حياته بعد تمام تربيته في كشمير منعزلًا في خلوة ضيقة، وانتفع به رغم عزلته اثنان من بيت تيمور: الأمير دارا شكوه وأخته جهان آرا، اللذان تركا وصفًا لعلاقتهما به. عُرف بإعلانه وحدة الوجود بعبارات حلّاجية أثارت خصومة بعض الظاهريين فكاد يُقتل لولا شفاعة تلميذيه الملكيين، وترك شعرًا فارسيًا وشرحًا على سور من القرآن ورسالة في وحدة الوجود كتبها لتلميذيه."
  en: "A Qadiri Sufi of Badakhshan (d. 1661), disciple and successor of Mian Mir of Lahore, who after his training was complete lived most of his remaining life in Kashmir enclosed in a narrow cell — yet two members of the Mughal house, the prince Dara Shikoh and his sister Jahanara, sought him out as disciples and left accounts of their relations with him. His proclamation of wahdat al-wujud in Hallajian terms drew the hostility of exoteric critics and near-persecution, from which his royal disciples' intercession saved him; he left Persian poetry, a commentary on several suras of the Qur'an, and a treatise on the oneness of being written for his two royal adepts."
  ur: "بدخشان کے ایک قادری صوفی ⁦(وفات 1661ء)⁩، میاں میر لاہوری کے شاگرد و خلیفہ؛ تربیت مکمل ہونے کے بعد باقی زندگی کا بیشتر حصہ کشمیر میں ایک تنگ حجرے میں گوشہ نشینی میں گزارا، لیکن مغل خاندان کے دو افراد — شہزادہ دارا شکوہ اور ان کی بہن جہاں آرا — ان کے مرید ہوئے اور ان سے اپنے تعلق کے احوال لکھ چھوڑے۔ انھوں نے وحدت الوجود کا حلاجی انداز میں اعلان کیا جس سے بعض ظاہر پرستوں کی دشمنی بھڑکی اور شاہی مریدوں کی سفارش ہی نے انھیں بچایا؛ ان سے فارسی شاعری، چند سورتوں کی تفسیر اور اپنے دو شاہی مریدوں کے لیے وحدت الوجود پر ایک رسالہ یادگار ہے۔"
  es: "Un sufí qadiri de Badakhshan (fallecido en 1661), discípulo y sucesor de Mian Mir de Lahore, tras completar su formación, vivió la mayor parte del resto de su vida en Cachemira, recluido en una estrecha celda. Sin embargo, dos miembros de la casa mogol, el príncipe Dara Shikoh y su hermana Jahanara, lo buscaron como discípulos y dejaron constancia de su relación con él. Su proclamación de wahdat al-wujud en términos hallajianos le granjeó la hostilidad de los críticos exotéricos y casi la persecución, de la que la intercesión de sus discípulos reales lo salvó. Dejó poesía persa, un comentario sobre varias suras del Corán y un tratado sobre la unidad del ser, escrito para sus dos adeptos reales."
  fr: "Un soufi qadiri du Badakhshan (mort en 1661), disciple et successeur de Mian Mir de Lahore, vécut la majeure partie de sa vie au Cachemire, reclus dans une cellule étroite, après avoir achevé sa formation. Pourtant, deux membres de la maison moghole, le prince Dara Shikoh et sa sœur Jahanara, le recherchèrent comme disciples et laissèrent des récits de leurs relations avec lui. Sa proclamation du wujud (l'unité de l'être) en termes hallajiens lui valut l'hostilité des critiques exotériques et faillit le persécuter, ce dont l'intercession de ses disciples royaux le sauva. Il laissa de la poésie persane, un commentaire sur plusieurs sourates du Coran et un traité sur l'unité de l'être, écrit à l'intention de ses deux disciples royaux."
  tr: "Badahşanlı Sufi Kadri (ö. 1661), Mian Mir Lahuri'nin öğrencisi ve halefiydi, hayatının çoğunu Keşmir'de dar bir inzivada geçirdi ve izole olmasına rağmen, Timur'un ailesinden iki kişi ondan faydalandı: Prens Dara Şikuh ve kız kardeşi Jahanara; onlar onunla olan ilişkilerini anlattılar. Halajcı ifadelerle varoluşun birliğini ilan etmesiyle tanınıyordu; bu ifadeler bazı Zahirilerin rekabetini tetikledi ve kraliyet yanlısı öğrencilerinin aracılığı olmasaydı neredeyse onu öldürecekti. Fars şiiri, Kur'an bölümlerine yapılan yorumlar ve öğrencileri için yazdığı varoluşun birliği üzerine bir risale bıraktı."
  id: "Sufi Qadri dari Badakhshan (wafat 1661), seorang murid dan penerus Mian Mir Lahuri, menghabiskan sebagian besar hidupnya di Kashmir dalam pengasingan sempit, dan meskipun terisolasi, dua anggota keluarga Timur mendapat manfaat darinya: Pangeran Dara Shikuh dan saudara perempuannya Jahanara, yang meninggalkan deskripsi hubungan mereka dengannya. Ia dikenal karena menyatakan kesatuan eksistensi dalam frasa Hallajian yang memicu persaingan beberapa Zahiri, hampir membunuhnya jika bukan karena perantaraan murid-murid royalisnya. Ia meninggalkan puisi Persia, komentar atas bab-bab Al-Qur'an, dan risalah tentang kesatuan keberadaan yang ia tulis untuk murid-muridnya."

