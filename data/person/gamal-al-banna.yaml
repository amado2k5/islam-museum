  ar: "جمال البنا ⁦(1920–2013)⁩ مفكر إسلامي إصلاحي وكاتب عمالي مصري، الأخ الأصغر لحسن البنا مؤسس الإخوان المسلمين، لكنه سار طريقاً مخالفاً: فقه يساري ليبرالي ودعوة لفصل الدين عن الدولة. من كتبه «نحو فقه جديد» و«حرية الفكر والاعتقاد في الإسلام»."
  en: "Gamal al-Banna (1920–2013) was an Egyptian reformist Islamic thinker and labour writer, the younger brother of Muslim Brotherhood founder Hassan al-Banna — but he took the opposite path: a liberal-left jurisprudence and calls to separate religion from state. His books include Nahwa Fiqh Jadid (Towards a New Fiqh) and Freedom of Thought and Belief in Islam."
  ur: "جمال البنا ⁦(1920–2013)⁩ مصری اصلاحی اسلامی مفکر اور مزدور مصنف تھے، اخوان المسلمین کے بانی حسن البنا کے چھوٹے بھائی — مگر ان کا راستہ الگ تھا: لبرل-بائیں بازو کا فقہ اور دین و ریاست کی علیحدگی کی دعوت۔ کتب میں «نحو فقه جديد» اور «حرية الفكر والاعتقاد في الإسلام» شامل ہیں۔"
