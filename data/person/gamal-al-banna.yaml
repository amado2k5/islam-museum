summary:
  ar: "جمال البنا ⁦(1920–2013)⁩ مفكر إسلامي إصلاحي وكاتب عمالي مصري، الأخ الأصغر لحسن البنا مؤسس الإخوان المسلمين، لكنه سار طريقاً مخالفاً: فقه يساري ليبرالي ودعوة لفصل الدين عن الدولة. من كتبه «نحو فقه جديد» و«حرية الفكر والاعتقاد في الإسلام»."
  en: "Gamal al-Banna (1920–2013) was an Egyptian reformist Islamic thinker and labour writer, the younger brother of Muslim Brotherhood founder Hassan al-Banna — but he took the opposite path: a liberal-left jurisprudence and calls to separate religion from state. His books include Nahwa Fiqh Jadid (Towards a New Fiqh) and Freedom of Thought and Belief in Islam."
  ur: "جمال البنا ⁦(1920–2013)⁩ مصری اصلاحی اسلامی مفکر اور مزدور مصنف تھے، اخوان المسلمین کے بانی حسن البنا کے چھوٹے بھائی — مگر ان کا راستہ الگ تھا: لبرل-بائیں بازو کا فقہ اور دین و ریاست کی علیحدگی کی دعوت۔ کتب میں «نحو فقه جديد» اور «حرية الفكر والاعتقاد في الإسلام» شامل ہیں۔"
  es: "Gamal al-Banna (1920-2013) fue un pensador islámico reformista y escritor obrero egipcio, hermano menor del fundador de los Hermanos Musulmanes, Hassan al-Banna, pero siguió un camino opuesto: una jurisprudencia liberal de izquierda y la defensa de la separación entre religión y Estado. Entre sus libros destacan Nahwa Fiqh Jadid (Hacia un nuevo fiqh) y Libertad de pensamiento y creencia en el islam."
  fr: "Gamal al-Banna (1920-2013) était un penseur islamique réformateur et un écrivain égyptien engagé dans la lutte contre le racisme. Frère cadet du fondateur des Frères musulmans, Hassan al-Banna, il a cependant suivi une voie opposée: une jurisprudence libérale de gauche et un plaidoyer pour la séparation de l’Église et de l’État. Parmi ses ouvrages figurent Nahwa Fiqh Jadid (Vers une nouvelle jurisprudence islamique) et Liberté de pensée et de croyance en islam."
