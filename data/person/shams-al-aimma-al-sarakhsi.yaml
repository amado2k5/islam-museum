summary:
  ar: محمد بن أحمد بن سهل، أبو بكر، شمس الأئمة السرخسي، قاضٍ من كبار الحنفية ومجتهد،
    صاحب «المبسوط» أملاه وهو سجين بالجب في أوزجند؛ توفي سنة 483 هـ، الموافقة 1090
    م {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 315}.
  en: Muhammad ibn Ahmad ibn Sahl, Abu Bakr, Shams al-A'imma al-Sarakhsi, a judge,
    one of the great Hanafis and a mujtahid, who dictated al-Mabsut while imprisoned
    in the well at Uzjand; died 483 AH, 1090 CE as printed {cite:alam-zirikli-dar-al-ilm-2002
    vol. 5 p. 315}.
  es: "Muhammad ibn Ahmad ibn Sahl, Abu Bakr, Shams al-A'imma al-Sarakhsi, juez, uno de los grandes hanafíes y un muytahid, que dictó al-Mabsut mientras estaba encarcelado en el pozo de Uzjand; murió en el año 483 de la Hégira, 1090 d. C. según la versión impresa {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 315}."
  fr: "Muhammad ibn Ahmad ibn Sahl, Abu Bakr, Shams al-A'imma al-Sarakhsi, juge, l'un des grands Hanafites et mujtahid, qui dicta al-Mabsut alors qu'il était emprisonné dans le puits d'Uzjand; mort en 483 AH, 1090 CE tel qu'imprimé {cite:alam-zirikli-dar-al-ilm-2002 vol. 5 p. 315}."
  ur: "محمد بن احمد بن سہل، ابوبکر، شمس الائمہ السرخسی، ایک قاضی، بڑے حنفیوں میں سے ایک اور مجتہد، جس نے ازجند کے کنویں میں قید ہونے کے دوران المبسط کا حکم دیا؛ متوفی 483 ہجری، 1090 عیسوی جیسا کہ مطبوعہ {حوالہ:عالم-زرقلی-در-العلم-2002 جلد۔ 5ص 315}۔"
  tr: "Muhammed ibn Ahmed ibn Sahl, Ebu Bekir, Şems el-İimmah el-Sarakhsi, önde gelen bir Hanefi yargıç ve hukukçu, Uzjent'te hapisteyken dikte edilen 'El-Mebsut'un yazarı; 483 Hicri'de, yani 1090 M.S. ile aynı zamanda öldü {cite:alam-zirikli-dar-al-ilm-2002 cilt 5, s. 315}."
  id: "Muhammad ibn Ahmad ibn Sahl, Abu Bakr, Shams al-A'immah al-Sarakhsi, seorang hakim dan ahli hukum Hanafi terkemuka, penulis 'Al-Mabsut' yang didikte saat dipenjara di jub di Uzjent; meninggal pada tahun 483 H, sesuai dengan tahun 1090 M {cite:alam-zirikli-dar-al-ilm-2002 vol. 5, hlm. 315}."
