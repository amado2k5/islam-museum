summary:
  en: "A shrewd chieftain of Banu Ashja' of Ghatafan who converted to Islam secretly during the siege of the Trench; instructed by the Prophet that 'war is deceit', he successfully sowed mutual distrust between the confederate leaders (Quraysh and Ghatafan) and Banu Qurayza, precipitating the collapse of the siege."
  ar: "سيد بني أشجع من غطفان؛ أسلم سراً في ذروة غزوة الخندق وقدم على النبي، فقال له: «إنما أنت فينا رجل واحد، فخذل عنا إن استطعت فإن الحرب خدعة»، فبث الشك والفرقة بدهائه بين قريش وغطفان من جهة وبني قريظة من جهة أخرى، فكان سبباً رئيساً في انهيار الحلف وتفرقه."
