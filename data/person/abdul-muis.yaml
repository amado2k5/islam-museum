summary:
  ar: "كاتب وصحفي وقومي إندونيسي (1883 أو 1886–1959)، من نشطاء شريكة الإسلام وعضو المجلس الشعبي، وصاحب رواية «صلاح أسوهان» (1928) من أشهر روايات الأدب الإندونيسي الحديث، وأول من سُمّي بطلًا قوميًّا لإندونيسيا. قضى أعوامه الأخيرة في باندونغ مدافعًا عن تطوير جاوة الغربية."
  en: "Indonesian writer, journalist and nationalist (1883 or 1886–1959), a Sarekat Islam activist and Volksraad member, author of Salah Asuhan (1928), among the most famous novels of modern Indonesian literature, and the first person named a National Hero of Indonesia. He spent his last years in Bandung working for the development of West Java."
  ur: "انڈونیشی مصنف، صحافی اور قوم پرست (1883ء یا 1886ء–1959ء)، شریکۃ اسلام کے کارکن اور فولکسراد کے رکن، ناول «صلاح اسوہان» (1928ء) کے مصنف جو جدید انڈونیشی ادب کے مشہور ترین ناولوں میں ہے، اور انڈونیشیا کے قومی ہیرو کہلانے والے پہلے شخص۔ آخری برس بانڈونگ میں مغربی جاوا کی ترقی کی کوشش میں گزارے۔"
