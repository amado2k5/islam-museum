summary:
  ar: "أبو يوسف يعقوب بن إسحاق بن السكيت النحوي اللغوي، صاحب كتاب إصلاح المنطق، خوزي من قرى دورق من كور الأهواز؛ كان من أهل الفضل والدين وموثوقاً بروايته، وكان يؤدّب بني جعفر المتوكل. وُلد أبوه إسحاق في بيت فقير فكان يعلّم صبيان العامة بدرب القنطرة بمدينة السلام، حتى احتاج يعقوب إلى الكسب فتعلم النحو، وحكى عن أبيه أنه حج وسأل الله أن يعلّم ابنه النحو. سمع من أبي عمرو الشيباني، وروى عنه أبو عكرمة الضبي وأبو سعيد السكري وميمون بن هارون الكاتب وعبد الله بن محمد بن رستم وأحمد بن فرج المقرئ {cite:tarikh-baghdad-khatib j.11 p.274}."
  en: "Abu Yusuf al-Sikut — the Khuzi grammarian of Islah al-Mantiq who tutored the sons of al-Mutawakkil; his father Ishaq had prayed on Hajj that his son be taught grammar {cite:tarikh-baghdad-khatib j.11 p.274}."
  es: "Abu Yusuf al-Sikut, el gramático Khuzi de Islah al-Mantiq que fue tutor de los hijos de al-Mutawakkil; su padre Ishaq había orado durante el Hajj para que a su hijo se le enseñara gramática {cita:tarikh-baghdad-khatib j.11 p.274}."
  fr: "Abu Yusuf al-Sikut — le grammairien Khuzi d'Islah al-Mantiq qui a encadré les fils d'al-Mutawakkil; son père Ishaq avait prié lors du Hajj pour que son fils apprenne la grammaire {cite: tarikh-baghdad-khatib j.11 p.274}."
  ur: "ابو یوسف السقوت - اصلاح المنطق کے خوزی گرامر جس نے متوکل کے بیٹوں کو پڑھایا؛ ان کے والد اسحاق نے حج کے موقع پر دعا کی تھی کہ ان کے بیٹے کو گرامر کی تعلیم دی جائے۔"
  tr: "Abu Yusuf Ya'qub bin İshaq ibn al-Sikkit, dilbilimci ve dilbilimciydi; Ahvaz'daki köylerdeki Duraq köylerinden Islah al-Mantiq adlı kitabın yazarı; erdemli ve dindar bir adamdı, rivayetlerine güvenirdi ve Banu Ja'far al-Mutawakkil'i disipline etti. Babası İshaq yoksul bir ailede doğmuş ve Darb al-Qantara'da sıradan halkın çocuklarını eğitmiştir. Yasub para kazanıp dilbilgisi öğrenene kadar barış şehri oldu. Babası aracılığıyla hac yaptığını ve oğluna dilbilgisi öğretmesini Allah'tan dilediğini anlattı. Ebu Amr el-Şeybani'den duydu ve ondan Ebu İkrime el-Dabi, Ebu Seyid el-Sukkari, Maymun ibn Harun el-Katib, Abdullah ibn Muhammed ibn Rustam ve Ahmed ibn Faraj al-Muqri tarafından rivayet edildi {atı:Tarikh-baghdad-khatib J. 11 s.274}."
  id: "Abu Yusuf Ya'qub ibn Ishaq ibn al-Sikkit adalah seorang ahli tata bahasa dan ahli bahasa, penulis buku Islah al-Mantiq, Khuzi dari desa-desa Duraq di desa Ahvaz; ia adalah seorang yang berbudi dan beragama, dipercaya dalam riwayatnya, dan ia mendisiplinkan Banu Ja'far al-Mutawakkil. Ayahnya, Ishaq, lahir dari keluarga miskin dan mengajar anak-anak rakyat biasa di Darb al-Qantara di kota damai, hingga Ya'qub membutuhkan penghasilan dan mempelajari tata bahasa. Ia menceritakan dari ayahnya bahwa ia melakukan Haji dan meminta Tuhan mengajarkan tata bahasa kepada putranya. Ia mendengar dari Abu Amr al-Shaybani, dan menceritakan dari beliau oleh Abu Ikrimah al-Dhabi, Abu Sa'id al-Sukkari, Maymun ibn Harun al-Katib, Abdullah ibn Muhammad ibn Rustam, dan Ahmad ibn Faraj al-Muqri {cite:Tarikh-baghdad-khatib J.11 hlm.274}."
