summary:
  ar: "أبو يوسف يعقوب بن إسحاق بن السكيت النحوي اللغوي، صاحب كتاب إصلاح المنطق، خوزي من قرى دورق من كور الأهواز؛ كان من أهل الفضل والدين وموثوقاً بروايته، وكان يؤدّب بني جعفر المتوكل. وُلد أبوه إسحاق في بيت فقير فكان يعلّم صبيان العامة بدرب القنطرة بمدينة السلام، حتى احتاج يعقوب إلى الكسب فتعلم النحو، وحكى عن أبيه أنه حج وسأل الله أن يعلّم ابنه النحو. سمع من أبي عمرو الشيباني، وروى عنه أبو عكرمة الضبي وأبو سعيد السكري وميمون بن هارون الكاتب وعبد الله بن محمد بن رستم وأحمد بن فرج المقرئ {cite:tarikh-baghdad-khatib j.11 p.274}."
  en: "Abu Yusuf al-Sikut — the Khuzi grammarian of Islah al-Mantiq who tutored the sons of al-Mutawakkil; his father Ishaq had prayed on Hajj that his son be taught grammar {cite:tarikh-baghdad-khatib j.11 p.274}."
