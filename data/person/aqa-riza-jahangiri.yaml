summary:
  ar: "مصور إيراني الأصل من مشهد على الأرجح، دخل خدمة الأمير سليم ⁦(جهانگير)⁩ بحلول 997هـ/1588–1589م، وكان أبرز مصوري بلاطه في إله آباد، وأبًا لأبي الحسن وعابد {cite:beach-grand-mogul-1978 p. 20} {cite:beach-grand-mogul-1978 p. 91}."
  en: "Iranian-born painter, probably of Mashhad, in the service of Prince Salim (Jahangir) by 997 AH/1588–89, the leading artist of his Allahabad court and father of Abu'l Hasan and Abid {cite:beach-grand-mogul-1978 p. 20} {cite:beach-grand-mogul-1978 p. 91}."
  ur: "ایرانی نژاد مصور، غالباً مشہد کے، جو 997ھ/1588–89ء تک شہزادہ سلیم ⁦(جہانگیر)⁩ کی خدمت میں آ چکے تھے؛ الہ آباد میں ان کے دربار کے سب سے بڑے فنکار اور ابو الحسن و عابد کے والد {cite:beach-grand-mogul-1978 p. 20} {cite:beach-grand-mogul-1978 p. 91}۔"
  es: "Pintor nacido en Irán, probablemente de Mashhad, al servicio del príncipe Salim (Jahangir) hacia el año 997 AH/1588–89, el artista principal de su corte de Allahabad y padre de Abu'l Hasan y Abid {cite:beach-grand-mogul-1978 p. 20} {cite:beach-grand-mogul-1978 p. 91}."
  fr: "Peintre d'origine iranienne, probablement de Mashhad, au service du prince Salim (Jahangir) en 997 AH/1588-89, artiste principal de sa cour d'Allahabad et père d'Abu'l Hasan et d'Abid {cite:beach-grand-mogul-1978 p. 20} {cite:beach-grand-mogul-1978 p. 91}."
  tr: "Meşhed'den İran kökenli bir ressam olan Ebu Ebu Hasan'ın babası ve ibadet edeni {cite:beach-grand-mogul-1978 s. 20} {cite:beach-grand-mogul-1978 s. 20} {cite:beach-grand-mogul-1978 s. 91} {cite:beach-grand-mogul-1978 s. 91}"
  id: "Seorang pelukis asal Iran dari Mashhad, kemungkinan besar ia mulai melayani Pangeran Selim (Jahangir) pada tahun 997 H / 1588–1589 M, merupakan pelukis paling menonjol di istananya di Allahabad, serta ayah dari Abu al-Hasan dan seorang pemuja {cite:beach-grand-mogul-1978 hlm. 20} {cite:beach-grand-mogul-1978 hlm. 91}."
