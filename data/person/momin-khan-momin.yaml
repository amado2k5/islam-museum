summary:
  ar: "شاعر أردي وحكيم (طبيب يوناني) من أواخر عصر المغول في دلهي (1800–1852). وُلد في دلهي لأسرة من أصل كشميري احترفت الطب، فتدرّب حكيمًا ثم غلب عليه الشعر. كان معاصرًا لغالب وذوق وأقلّ منهما شهرة، وخلّف ديوانًا وست مثنويات، ويُروى أن غالبًا عرض ديوانه كله مقابل بيت واحد من أبياته."
  en: "Urdu poet and hakim (Unani physician) of late Mughal Delhi (1800–1852). Born in Delhi to a family of Kashmiri origin that practised medicine, he trained as a hakim before poetry took over his life. A less famous contemporary of Ghalib and Zauq, he left a divan and six masnavis; legend has Ghalib offering his whole divan in exchange for a single verse of Momin's."
  ur: "متاخر مغل دہلی کے اردو شاعر اور حکیم (1800ء–1852ء)۔ دہلی میں کشمیری اصل کے ایک طبیب خاندان میں پیدا ہوئے، حکیمی کی تربیت پائی مگر شاعری غالب آ گئی۔ غالب اور ذوق کے کم مشہور ہم عصر تھے؛ ایک دیوان اور چھ مثنویاں چھوڑے، اور روایت ہے کہ غالب نے ان کے ایک شعر کے بدلے اپنا پورا دیوان پیش کیا تھا۔"
