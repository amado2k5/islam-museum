summary:
  ar: "لاعب كرة سلة أمريكي سابق ومسؤول رياضي، وُلد في ماريتا بولاية جورجيا سنة 1976، ولعب اثني عشر موسمًا في الدوري الأمريكي للمحترفين ونال ذهبية أولمبياد سيدني 2000 مع المنتخب الأمريكي، ثم تولّى مناصب إدارية في نادي سكرامنتو كينغز وأصبح رئيسًا لدوري «جي ليغ» سنة 2018."
  en: "American former basketball player and executive, born in Marietta, Georgia in 1976. He played twelve seasons in the NBA, won the Sydney 2000 Olympic gold medal with the United States team, later held front-office posts with the Sacramento Kings, and became president of the NBA G League in 2018."
  ur: "سابق امریکی باسکٹ بال کھلاڑی اور انتظامی افسر، جو 1976 میں میریٹا، جارجیا میں پیدا ہوئے۔ انہوں نے این بی اے میں بارہ سیزن کھیلے، امریکی ٹیم کے ساتھ سڈنی 2000 اولمپک طلائی تمغا جیتا، بعد میں سیکرامینٹو کنگز میں انتظامی عہدے سنبھالے، اور 2018 میں این بی اے جی لیگ کے صدر بنے۔"
  es: "Exjugador de baloncesto y ejecutivo estadounidense, nacido en Marietta, Georgia, en 1976. Jugó doce temporadas en la NBA, ganó la medalla de oro olímpica en Sídney 2000 con la selección de Estados Unidos, posteriormente ocupó cargos directivos en los Sacramento Kings y se convirtió en presidente de la NBA G League en 2018."
  fr: "Ancien joueur et dirigeant de basketball américain, né à Marietta, en Géorgie, en 1976. Il a joué douze saisons en NBA, a remporté la médaille d'or aux Jeux olympiques de Sydney en 2000 avec l'équipe des États-Unis, a ensuite occupé des postes de direction chez les Sacramento Kings et est devenu président de la NBA G League en 2018."
  tr: "1976'da Marietta, Georgia'da doğan eski bir Amerikalı basketbolcu ve spor yetkilisi olan Sher, NBA'de on iki sezon oynadı ve 2000 Sydney Olimpiyatları'nda ABD milli takımıyla altın madalya kazandı. Daha sonra Sacramento Kings'te idari pozisyonlarda bulundu ve 2018'de G League başkanı oldu."
  id: "Mantan pemain bola basket dan pejabat olahraga Amerika, lahir di Marietta, Georgia, pada tahun 1976, ia bermain selama dua belas musim di NBA dan meraih emas di Olimpiade Sydney 2000 bersama tim nasional AS. Ia kemudian memegang posisi administratif di Sacramento Kings dan menjadi presiden G League pada tahun 2018."
