summary:
  ar: "لاعب كرة سلة أمريكي سابق ومسؤول رياضي، وُلد في ماريتا بولاية جورجيا سنة 1976، ولعب اثني عشر موسمًا في الدوري الأمريكي للمحترفين ونال ذهبية أولمبياد سيدني 2000 مع المنتخب الأمريكي، ثم تولّى مناصب إدارية في نادي سكرامنتو كينغز وأصبح رئيسًا لدوري «جي ليغ» سنة 2018."
  en: "American former basketball player and executive, born in Marietta, Georgia in 1976. He played twelve seasons in the NBA, won the Sydney 2000 Olympic gold medal with the United States team, later held front-office posts with the Sacramento Kings, and became president of the NBA G League in 2018."
  ur: "سابق امریکی باسکٹ بال کھلاڑی اور انتظامی افسر، جو 1976 میں میریٹا، جارجیا میں پیدا ہوئے۔ انہوں نے این بی اے میں بارہ سیزن کھیلے، امریکی ٹیم کے ساتھ سڈنی 2000 اولمپک طلائی تمغا جیتا، بعد میں سیکرامینٹو کنگز میں انتظامی عہدے سنبھالے، اور 2018 میں این بی اے جی لیگ کے صدر بنے۔"
