summary:
  ar: "سليمان بن يقظان الكلبي المعروف بالأعرابي، والي برشلونة وجيرندة يمني الانتماء؛ تآمر سنة ١٥٧هـ مع حسين بن يحيى الأنصاري والي سرقسطة وعبد الرحمن بن حبيب الفهري الملقب بالصقلبي والي بلاد المغرب على قتال عبد الرحمن الداخل وخلعه، ونال الجميع تشجيع الخليفة المهدي؛ وشعر بعجزه فاتصل بشارلمان الكارولنجي في بادربودن سنة ١٦٠هـ واتفق معه على أن يهاجم الولايات الشمالية للأندلس وتعهد بتسليمه المدن التي يحكمها، فكان ذلك من أوائل الاتصالات المسجلة بين الإسلام والدولة الكارولنجية {cite:tarikh-dawla-abbasiyya-taqqush p. 80-81}."
  en: "Sulayman ibn Yaqzan 'al-A'rabi' al-Kalbi — governor of Barcelona and Girona who met Charlemagne at Paderborn in 160 AH and promised him the northern cities, with al-Mahdi's blessing behind him {cite:tarikh-dawla-abbasiyya-taqqush p. 80-81}."
