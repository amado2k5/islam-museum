summary:
  en: "Chief court architect of the Ottoman empire from 945/1538 until his death in 996/1588. Taken in the devshirme levy and trained on campaign, he is credited in three sixteenth-century lists with some 477 buildings; his three great complexes are the Shehzade and the Suleymaniye in Istanbul and the Selimiye in Edirne."
  ar: "كبير معماري البلاط العثماني من سنة 945هـ/1538م إلى وفاته سنة 996هـ/1588م. أُخذ في الدوشرمة وتمرّس في الحملات العسكرية، وتنسب إليه ثلاث قوائم من القرن السادس عشر نحو 477 بناء؛ ومجمعاته الثلاثة الكبرى شهزاده والسليمانية في إسطنبول والسليمية في أدرنة."
  ur: "945ھ/1538ء سے 996ھ/1588ء میں وفات تک عثمانی دربار کے معمار اعلیٰ۔ دیوشرمہ کے تحت لیے گئے اور فوجی مہموں میں تربیت پائی؛ سولہویں صدی کی تین فہرستیں تقریباً 477 عمارتیں ان سے منسوب کرتی ہیں۔ ان کے تین بڑے مجموعے استنبول کے شہزادہ اور سلیمانیہ اور ادرنہ کا سلیمیہ ہیں۔"
