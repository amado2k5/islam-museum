summary:
  en: "Chief court architect of the Ottoman empire from 945/1538 until his death in 996/1588. Taken in the devshirme levy and trained on campaign, he is credited in three sixteenth-century lists with some 477 buildings; his three great complexes are the Shehzade and the Suleymaniye in Istanbul and the Selimiye in Edirne."
  ar: "كبير معماري البلاط العثماني من سنة 945هـ/1538م إلى وفاته سنة 996هـ/1588م. أُخذ في الدوشرمة وتمرّس في الحملات العسكرية، وتنسب إليه ثلاث قوائم من القرن السادس عشر نحو 477 بناء؛ ومجمعاته الثلاثة الكبرى شهزاده والسليمانية في إسطنبول والسليمية في أدرنة."
  ur: "945ھ/1538ء سے 996ھ/1588ء میں وفات تک عثمانی دربار کے معمار اعلیٰ۔ دیوشرمہ کے تحت لیے گئے اور فوجی مہموں میں تربیت پائی؛ سولہویں صدی کی تین فہرستیں تقریباً 477 عمارتیں ان سے منسوب کرتی ہیں۔ ان کے تین بڑے مجموعے استنبول کے شہزادہ اور سلیمانیہ اور ادرنہ کا سلیمیہ ہیں۔"
  es: "Arquitecto jefe de la corte del Imperio Otomano desde 945/1538 hasta su muerte en 996/1588. Reclutado en el ejército devshirme y entrenado en campaña, se le atribuyen unos 477 edificios en tres listas del siglo XVI; sus tres grandes complejos son el Shehzade y el Suleymaniye en Estambul y el Selimiye en Edirne."
  fr: "Architecte en chef de la cour de l'empire ottoman de 945/1538 jusqu'à sa mort en 996/1588. Recruté dans la levée du devchirmé et formé sur la campagne, il est crédité dans trois listes du XVIe siècle d'environ 477 bâtiments; ses trois grands complexes sont le Shehzade et le Suleymaniye à Istanbul et le Selimiye à Edirne."
  tr: "945 Hicri / 1538 yılından 996 Hicri / 1588 yılında ölümüne kadar Osmanlı sarayının baş mimarıydı. Doşerma'da eğitim gördü ve askeri seferlerde eğitim aldı. Yaklaşık 477 bina 16. yüzyıla ait üç liste ona atfedilmektedir; üç büyük kompleksi: İstanbul'daki Şahzade, Süleymaniye ve Edirne'deki Selimiye."
  id: "Ia adalah arsitek utama istana Ottoman dari tahun 945 H / 1538 M hingga kematiannya pada 996 H / 1588 M. Ia belajar di Doşerma dan berlatih dalam kampanye militer. Tiga daftar sekitar 477 bangunan dari abad keenam belas dikaitkan dengannya; tiga kompleks utamanya: Şahzade, Suleymaniye di Istanbul, dan Selimiye di Edirne."
