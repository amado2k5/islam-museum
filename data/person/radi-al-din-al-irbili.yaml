class: person
label: { ar: "رضي الدين الإربلي" }
died: { edtf: "1276~", hijri: "0676", calendar: julian, precision: year, status: debated, derived: true, note: "توفي بالموصل يوم الاثنين سادس المحرم؛ قيل سنة خمس وسبعين وقال ولده كمال الدين سنة ست وسبعين وستمائة، وكان عمره ستة وثمانين سنة {cite:wafayat-ayan}." }
summary:
  ar: "أبو الفضل يونس بن محمد بن منعة الملقب رضي الدين الإربلي، والد الشيخين عماد الدين وكمال الدين؛ تفقه بأربل على تاج الإسلام ابن خميس ثم تحدر إلى بغداد فتفقه على الشيخ أبي منصور سعيد، ولقى بالموصل قبولاً تاماً عند الأمير زين الدين علي بن بكتكين ففوّض إليه تدريس مسجده وجعل نظره إليه، فكان يدرس ويفتي ويناظر وتقصده الطلبة إلى أن توفي {cite:wafayat-ayan}."
  tr: "Ebu el-Fadl Yunus ibn Muhammed bin Man'a'ah, Radieddin el-İrbali olarak bilinir, iki şeyh İmaddin ve Kamal al-Din'in babasıdır; Erbil'de Tac al-İslam İbn Hamis'in yanında fıkıh eğitimi aldı, ardından Şeyh Ebu Mansur Sa'id'in yanında fıkıh okumak üzere Bağdat'a taşındı. Musul'da Prens Zeynetin Ali ibn Baktakin tarafından tam olarak kabul edildi; kendisine caminin öğretimi emanet edildi ve yetkisini ona verdi. Öğretti, fetva verdi, münazaralara katıldı ve ölümüne kadar öğrenciler tarafından ziyaret edildi {atıf:wafayat-ayan}."
  id: "Abu al-Fadl Yunus ibn Muhammad ibn Man'a'ah, yang dikenal sebagai Radi al-Din al-Irbali, ayah dari dua sheikh Imad al-Din dan Kamal al-Din, belajar hukum di Erbil di bawah Taj al-Islam Ibn Khamis, kemudian pindah ke Baghdad untuk belajar hukum di bawah Sheikh Abu Mansur Sa'id. Ia sepenuhnya diterima di Mosul oleh Pangeran Zayn al-Din Ali ibn Baktakin, yang mempercayakannya untuk mengajar masjid dan menempatkan otoritasnya kepadanya. Ia mengajar, mengeluarkan fatwa, berdebat, dan dikunjungi oleh para pelajar hingga wafatnya {cite:wafayat-ayan}."
