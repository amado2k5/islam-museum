class: person
label: { ar: "قطن بن قبيصة الهلالي", en: "Qatn ibn Qabisa al-Hilali", es: "Qatn ibn Qabisa al-Hilali", fr: "Qatn ibn Qabisa al-Hilali", ur: "قطن ابن قبیصہ ہلالی" }
summary:
  ar: "قطن بن قبيصة بن مخارق الهلالي؛ ولاه الحجاج فارس وكرمان وهو الذي انتهى إلى نهر فلم يقدر أصحابه على إجازته فقال من جاز فله ألف درهم فجازوه فوفى لهم فكان أول يوم سميت الجائزة فيه وكان أبوه قبيصة من أصحاب رسول الله."
  en: "Qatn ibn Qabisa ibn Mukhariq al-Hilali; al-Hajjaj's governor of Fars and Kirman — at the uncrossable river he offered a thousand dirhams to whoever crossed, paid up, and so the ja'iza was first named; his father Qabisa was a Companion."
  es: "Qatn ibn Qabisa ibn Mukhariq al-Hilali, gobernador de Fars y Kirman por al-Hajjaj, ofreció mil dirhams a quien cruzara el río infranqueable a quien pagara, y así fue como se llamó por primera vez a la ja'iza; su padre, Qabisa, era un Compañero."
  fr: "Qatn ibn Qabisa ibn Mukhariq al-Hilali; gouverneur d'al-Hajjaj de Fars et de Kirman — au fleuve infranchissable, il offrit mille dirhams à quiconque le traversait, paya, et c'est ainsi que la ja'iza fut nommée pour la première fois; son père Qabisa était un Compagnon."
  ur: "قطن ابن قبیصہ ابن مخارق ہلالی۔ الحجاج کے گورنر فارس اور کرمان - ناقابل عبور دریا پر اس نے پار کرنے والے کو ایک ہزار درہم کی پیشکش کی، اس نے ادائیگی کی، اور اس طرح سب سے پہلے جائیزہ کا نام دیا گیا۔ ان کے والد قباصہ صحابی تھے۔"
  tr: "Qatn ibn Kubeysa ibn Mukhariq el-Hilali; el-Hacāc onu Fars ve Kirmanlı olarak atadı. Nehr'e ulaşan oydu, fakat sahabeleri ona izin veremedi. Dedi ki, 'Kimin izin verilse, bin dirhem vardır.' Onun bedelini ödedi ve o da ödedi. Ödülün ilk kez verildiği gündü ve babası Kubeysah, Allah'ın Elçisi'nin sahabelerinden biriydi."
  id: "Qatn ibn Qubaysa ibn Mukhariq al-Hilali; al-Hajjaj menunjuknya sebagai orang Persia dan Kerman. Dialah yang tiba di Nahr, tetapi para sahabatnya tidak dapat memberinya izin. Dia berkata, 'Siapa pun yang diizinkan mendapat seribu dirham.' Dia membayar untuknya, dan dia membayarnya. Hari itu adalah hari pertama hadiah itu diberikan, dan ayahnya Qubaysah adalah salah satu sahabat Rasul Allah."
