  ar: "قطن بن قبيصة بن مخارق الهلالي؛ ولاه الحجاج فارس وكرمان وهو الذي انتهى إلى نهر فلم يقدر أصحابه على إجازته فقال من جاز فله ألف درهم فجازوه فوفى لهم فكان أول يوم سميت الجائزة فيه وكان أبوه قبيصة من أصحاب رسول الله."
  en: "Qatn ibn Qabisa ibn Mukhariq al-Hilali; al-Hajjaj's governor of Fars and Kirman — at the uncrossable river he offered a thousand dirhams to whoever crossed, paid up, and so the ja'iza was first named; his father Qabisa was a Companion."
