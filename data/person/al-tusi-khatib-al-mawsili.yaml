summary:
  ar: "مجد الدين أبو الفضل عبد الله بن أحمد بن محمد بن عبد القاهر الطوسي، الخطيب بالموصل؛ كان مشهوراً بالرواية حتى يقصد إليه من الآفاق، وسمع عليه أبو المحاسن ابن شداد الجامع لأبي عيسى الترمذي وكثيراً من مسموعاته {cite:wafayat-ayan}."
  en: "Majd al-Din Abu al-Fadl Abd Allah ibn Ahmad ibn Muhammad ibn Abd al-Qahir al-Tusi, khatib of Mosul; he was so well known for transmission that people came to him from far away. Abu al-Mahasin Ibn Shaddad heard from him al-Jami' of Abu Isa al-Tirmidhi and much else he had heard {cite:wafayat-ayan}."
  fr: "Majd al-Din Abu al-Fadl Abd Allah ibn Ahmad ibn Muhammad ibn Abd al-Qahir al-Tusi, khatib de Mossoul ; Il était si connu pour la transmission que les gens venaient à lui de loin. Abu al-Mahasin Ibn Shaddad a entendu de lui al-Jami' d'Abu Isa al-Tirmidhi et beaucoup d'autres choses qu'il avait entendues {cite:wafayat-ayan}."
  es: "Majd al-Din Abu al-Fadl Abd Allah ibn Ahmad ibn Muhammad ibn Abd al-Qahir al-Tusi, khatib de Mosul; era tan conocido por su transmisión que la gente acudía a él desde muy lejos. Abu al-Mahasin Ibn Shaddad escuchó de él al-Jami' de Abu Isa al-Tirmidhi y mucho más que había escuchado {cite:wafayat-ayan}."
  ur: "مجد الدین ابو الفضل عبد اللہ بن احمد بن محمد بن عبد القاہر الطوسی، خطیب موصل؛ وہ نشریات کے لیے اس قدر مشہور تھے کہ لوگ دور دور سے ان کے پاس آتے تھے۔ ابو المحسین ابن شداد نے ان سے ابو عیسیٰ ترمذی کی الجامع سنی ہے اور اس کے علاوہ بھی بہت کچھ سنا ہے۔"
  tr: "Musul'daki vaiiz Majd al-Din Ebu el-Fadl Abdullah ibn Ahmed ibn Muhammed ibn Abd al-Qahir al-Tusi; dünyanın dört bir yanından insanlar ona atıfta bulunacak kadar rivayetleriyle ünlüydü. Ebu isa el-Tirmidi'nin derleyicisi Ebu el-Mahasin İbn Shaddad ve birçok hadisi {atıf:wafayat-ayan} duyulmuştur."
  id: "Majd al-Din Abu al-Fadl Abdullah ibn Ahmad ibn Muhammad ibn Abd al-Qahir al-Tusi, pendakwah di Mosul; ia terkenal karena narasi hingga orang-orang dari seluruh dunia menyebutnya. Abu al-Mahasin Ibn Shaddad, penyusun Abu Isa al-Tirmidhi, dan banyak haditsnya {cite:wafayat-ayan} juga didengar."
