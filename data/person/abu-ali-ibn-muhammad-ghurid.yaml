summary:
  ar: "بطاقة أولية لأبي علي بن محمد الغوري، سلطان غور في أوائل القرن الحادي عشر وأول الغوريين نفوذاً بعد إطاحتهم بالفاريغونيين؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Ali ibn Muhammad, the Ghurid sultan of the early eleventh century and the family's first ruler of consequence after toppling the Farighunids; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Abu Ali ibn Muhammad, el sultán gúrida de principios del siglo XI y el primer gobernante importante de la familia tras derrocar a los farighúnidas; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature d'Abu Ali ibn Muhammad, sultan ghuride du début du XIe siècle et premier dirigeant important de la famille après avoir renversé les Farighunides; l'entrée du manuel dynastique n'est pas encore cochée sur la page."
  ur: "ابو علی ابن محمد کے لیے ڈرافٹ کارڈ، گیارہویں صدی کے اوائل کے غوری سلطان اور فاریگنیڈز کو گرانے کے بعد خاندان کے پہلے حکمران؛ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "11. yüzyılın başlarında Gur Sultanı olan ve Varganileri devirdikten sonra nüfuz kazanan ilk Gurlulardan biri olan Ebu Ali ibn Muhammed el-Gavri'nin ön profili; İslam devletleri sözlüklerinde adı geçmektedir ve bu sayfadaki biyografisi henüz incelenmemiştir."
  id: "Profil awal Abu Ali ibn Muhammad al-Ghawri, Sultan Ghur pada awal abad ke-11 dan orang pertama dari dinasti Ghurid yang memperoleh pengaruh setelah mereka menggulingkan dinasti Varghani; ia disebutkan dalam kamus negara-negara Islam, dan biografinya di halaman ini belum ditinjau."
