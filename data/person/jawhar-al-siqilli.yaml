id: person/jawhar-al-siqilli
class: person
label: { ar: "جوهر القائد مولى المعز" }
died: { edtf: "0991~", hijri: "0381", calendar: julian, precision: year, status: tradition, derived: true, note: "وفاة القائد أبي الحسن الرومي مولى المعز لدين الله سنة إحدى وثمانين وثلاثمائة {cite:shadharat-dhahab p. 98}." }
summary:
  ar: "مولى المعز لدين الله، أرسله في مئة ألف فارس فملك مصر سنة ثمان وخمسين ونزل موضع مدينة القاهرة اليوم واختطها وبنى دار الإمارة للمعز وهي المعروفة بالقصرين وقطع خطبة بني العباس ولبس السواد وألبس الخطباء البياض وأمر بصيغة الخطبة الجديدة بأسماء الأئمة آباء المعز {cite:tarikh-khulafa-minhaj-1434 p. 620-621}. وعند ابن الأثير سيره المعز لدين الله سنة 358هـ في جيش كثيف إلى الديار المصرية فاستولى عليها وكان مولى والد المعز المنصور وهو رومي {cite:kamil-ibn-al-athir p. 444}"
  en: "Al-Mu'izz's mawla; with a hundred thousand horse he took Egypt in 358, laid out Cairo on its present site, built the dar al-imara called the Two Palaces, cut the Abbasid khutba and ordered the new formula naming the imams, al-Mu'izz's forefathers {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
  es: "La mawla de Al-Mu'izz; con cien mil caballos tomó Egipto en 358, trazó El Cairo en su sitio actual, construyó el dar al-imara llamado los Dos Palacios, cortó la jutba abasí y ordenó la nueva fórmula que nombraba a los imanes, antepasados de Al-Mu'izz {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
  fr: "Le mawla d'Al-Mu'izz; avec cent mille cavaliers, il prit l'Égypte en 358, aménagea le Caire à son emplacement actuel, construisit le dar al-imara appelé les Deux Palais, supprima le khutba abbasside et ordonna la nouvelle formule nommant les imams, les ancêtres d'al-Mu'izz {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
  ur: "المعز کے مولا; اس نے 358 میں ایک لاکھ گھوڑے کے ساتھ مصر لیا، قاہرہ کو اس کی موجودہ جگہ پر بچھایا، دار الامارہ جسے دو محل کہا جاتا ہے، تعمیر کیا، عباسی خطبہ کو کاٹ کر نئے فارمولے کا حکم دیا جو ائمہ، المعز کے آباء و اجداد کے ناموں کا حوالہ دیتے ہیں۔ 620-621}۔"
  tr: "Al-Mu'izz li-Din Allah'ın özgür adamı, ona yüz bin süvarıyla gönderdi, böylece elli sekizinci yılda Mısır kralı oldu. Bugünkü Kahire şehrinin yerine yerleşti, haritasını çizdi, el-Mu'izz için valilik evi olan Kasserine inşa etti, Abbasiler vaazını kesti, siyah giydi ve vaizler beyaz giyindi. Yeni vaaz formatına el-Mu'izz'in ataları olan imamların isimlerinin verilmesini emretti {alıntı::Tarih-Khulafa-minhaj-1434, s. 620-621}. İbn al-Athir'e göre, al-Mu'izz li-Din Allah 358 Hicri'nde büyük bir orduyla Mısır topraklarına yürüdü ve onları ele geçirdi. O, el-Mu'izz el-Mansur'un babasının özgür bıraktığı bir adamdı, bir Romalıydı {atıf:kamil-ibn-al-athir, s. 444}"
  id: "Mantan al-Mu'izz li-Din Allah mengirimnya dengan seratus ribu penunggang kuda, sehingga ia menjadi raja Mesir pada tahun lima puluh delapan. Ia menetap di tempat kota Kairo saat ini, memetakannya, membangun rumah gubernur untuk al-Mu'izz yang dikenal sebagai Kasserine, memotong khotbah Abbasiyah, mengenakan pakaian hitam, dan para pengkhotbah berpakaian putih. Ia memerintahkan format khotbah baru untuk diberi nama-nama imam, para bapa al-Mu'izz {cite:History-Khulafa-minhaj-1434, hlm. 620-621}. Menurut Ibn al-Athir, al-Mu'izz li-Din Allah berbaris pada tahun 358 H dengan pasukan besar ke tanah Mesir dan merebutnya. Ia adalah mantan izin al-Mu'izz al-Mansur, ayah dari Romawi {cite:kamil-ibn-al-athir, hlm. 444}"
