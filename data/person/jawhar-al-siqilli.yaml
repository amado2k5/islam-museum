label: { ar: "جوهر القائد مولى المعز" }
summary:
  ar: "مولى المعز لدين الله، أرسله في مئة ألف فارس فملك مصر سنة ثمان وخمسين ونزل موضع مدينة القاهرة اليوم واختطها وبنى دار الإمارة للمعز وهي المعروفة بالقصرين وقطع خطبة بني العباس ولبس السواد وألبس الخطباء البياض وأمر بصيغة الخطبة الجديدة بأسماء الأئمة آباء المعز {cite:tarikh-khulafa-minhaj-1434 p. 620-621}. وعند ابن الأثير سيره المعز لدين الله سنة 358هـ في جيش كثيف إلى الديار المصرية فاستولى عليها وكان مولى والد المعز المنصور وهو رومي {cite:kamil-ibn-al-athir p. 444}"
  en: "Al-Mu'izz's mawla; with a hundred thousand horse he took Egypt in 358, laid out Cairo on its present site, built the dar al-imara called the Two Palaces, cut the Abbasid khutba and ordered the new formula naming the imams, al-Mu'izz's forefathers {cite:tarikh-khulafa-minhaj-1434 p. 620-621}."
