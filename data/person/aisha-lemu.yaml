summary:
  ar: "كاتبة ومربية بريطانية، وُلدت في بول بدورست سنة 1940 باسم بريدجيت هوني، واعتنقت الإسلام سنة 1961 أثناء دراستها في كلية الدراسات الشرقية والأفريقية بلندن، وتزوجت العالم النيجيري أحمد ليمو سنة 1968 وانتقلت إلى نيجيريا، فدرّست في كانو وصكتو ومينا، وأسست مع زوجها صندوق التعليم الإسلامي، وأسست سنة 1985 اتحاد جمعيات المرأة المسلمة في نيجيريا وكانت أول أميرة وطنية له. لها كتب مدرسية ومؤلفات كثيرة في التربية الإسلامية والمرأة في الإسلام. توفيت في مينا في 5 يناير 2019."
  en: "British author and religious educator, born at Poole, Dorset, in 1940 as Bridget Honey. She converted to Islam in 1961 while studying at SOAS in London, married the Nigerian scholar Ahmed Lemu in 1968 and moved to Nigeria, where she taught at Kano, Sokoto and Minna, co-founded the Islamic Educational Trust with her husband, and in 1985 founded the Federation of Muslim Women's Associations of Nigeria, serving as its first national Amirah. She wrote textbooks and many works on Islamic education and women in Islam. She died at Minna on 5 January 2019."
  ur: "برطانوی مصنفہ اور دینی معلمہ، 1940ء میں ڈورسٹ کے شہر پول میں برجٹ ہنی کے نام سے پیدا ہوئیں۔ انھوں نے 1961ء میں لندن کے اسکول آف اورینٹل اینڈ افریقن اسٹڈیز میں تعلیم کے دوران اسلام قبول کیا، 1968ء میں نائیجیریا کے عالم احمد لیمو سے شادی کی اور نائیجیریا منتقل ہو گئیں، جہاں انھوں نے کانو، سکوٹو اور منا میں تدریس کی، اپنے شوہر کے ساتھ اسلامک ایجوکیشن ٹرسٹ کی بنیاد رکھی، اور 1985ء میں فیڈریشن آف مسلم ویمن ایسوسی ایشن آف نائجیریا قائم کی اور اس کی پہلی قومی امیرہ رہیں۔ انھوں نے درسی کتب اور اسلامی تعلیم اور اسلام میں خواتین پر بہت سی کتابیں لکھیں۔ ان کا انتقال 5 جنوری 2019ء کو منا میں ہوا۔"
