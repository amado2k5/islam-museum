label: { ar: "أبو حيان التوحيدي", en: "Abu Hayyan al-Tawhidi" }
summary:
  ar: "أبو حيان علي بن محمد التوحيدي البغدادي؛ فاضل مصنف له من الكتب المشهورة «الإمتاع والمؤانسة» في مجلدين و«البصائر والذخائر» و«الصديق والصداقة» و«المقابسات» و«مثالب الوزيرين» الذي خصّه بمعايب أبي الفضل ابن العميد والصاحب ابن عباد وتحامل عليهما وبالغ في التعصب عليهما — وهذا الكتاب من الكتب الحدودة فما ملكه أحد إلا تعكست أحواله {cite:wafayat-ayan}. ويقال إن أباه كان يبيع التوحيد — نوعاً من التمر — ببغداد؛ المتوفى سنة ٣٨٠هـ {cite:kashf-zunun-furqan p. 625}."
  en: "Abu Hayyan al-Tawhidi of Baghdad (d. 380) — philosopher-adib; author of al-Imta' wa-l-Mu'anasa, al-Basa'ir wa-l-Dhakha'ir, al-Sadiq wa-l-Sadaqa, al-Muqabasat, and the ill-omened Mathalib al-Wazirayn against Ibn al-Amid and al-Sahib Ibn Abbad; Ibn Khallikan has him still alive in 400 on his own statement in al-Sadiq wa-l-Sadaqa {cite:kashf-zunun-furqan p. 625} {cite:wafayat-ayan}."
