names:
  - { kind: full, lang: ar, value: "الربيع بن سليمان بن داود الجيزي، أبو محمد الأزدي مولاهم المصري الأعرج" }
gender: male
roles: [jurist, hadith-scholar]
traditions: [sunni]
summary:
  ar: "مصري من أصحاب الشافعي، رجل فقيه صالح؛ روى عن الشافعي وعبد الله بن وهب وإسحاق بن وهب وعبد الله بن يوسف، وروى عنه أبو داود والنسائي وأبو بكر بن أبي داود وأبو جعفر الطحاوي. وهو الذي روى عن الشافعي أن قراءة القرآن بالألحان مكروهة. توفي في ذي الحجة سنة ست وخمسين ومائتين، وقيل سنة سبع وخمسين {cite:tabaqat-shafiiyya-subki j.1 p.259}."
  en: "An Egyptian companion of al-Shafi'i — 'a jurist and a righteous man' — transmitting from al-Shafi'i, 'Abdallah b. Wahb, Ishaq b. Wahb and 'Abdallah b. Yusuf; Abu Dawud, al-Nasa'i, Ibn Abi Dawud and al-Tahawi transmitted from him. It is he who reports from al-Shafi'i that reciting the Qur'an with melodies is disapproved. He died in Dhu'l-Hijja 256, or 257 {cite:tabaqat-shafiiyya-subki j.1 p.259}."
  fr: "Un compagnon égyptien d'al-Shafi'i - 'un juriste et un homme juste' - transmettant d'al-Shafi', 'Abdallah b. Wahb, Ishaq b. Wahb et 'Abdallah b. Yusuf ; Abu Dawud, al-Nasa'i, Ibn Abi Dawud et al-Tahawi transmis de lui. C'est lui qui rapporte d'al-Shafi'i que réciter le Coran avec des mélodies est désapprouvé. Il est mort à Dhu'l-Hijja 256, ou 257 {cite:tabaqat-shafiiyya-subki j.1 p.259}."
  es: "Un compañero egipcio de al-Shafi'i —«jurista y hombre justo»— transmitió de él a Abdallah b. Wahb, Ishaq b. Wahb y Abdallah b. Yusuf; Abu Dawud, al-Nasa'i, Ibn Abi Dawud y al-Tahawi transmitieron de él. Fue él quien informó de al-Shafi'i que recitar el Corán con melodías está desaprobado. Murió en Dhu'l-Hijja 256 o 257 {cite:tabaqat-shafiiyya-subki j.1 p.259}."
  ur: "الشافعی کے ایک مصری ساتھی - 'ایک فقیہ اور ایک صالح آدمی' - الشافعی سے نقل کرتے ہیں، 'عبداللہ بن۔ وہب، اسحاق بی۔ وہب اور عبداللہ بی۔ یوسف؛ ابوداؤد، نسائی، ابن ابی داؤد اور الطحاوی نے ان سے روایت کی ہے۔ یہی وہ ہے جو شافعی سے روایت کرتا ہے کہ قرآن کو دھنوں کے ساتھ پڑھنا مکروہ ہے۔ آپ کی وفات ذوالحجہ 256، یا 257 میں ہوئی۔"
  tr: "El-Şafii'nin Mısırlı bir sahabi, doğru bir hukukçu; el-Şafii, Abdullah ibn Vahb, İshaq ibn Vahb ve Abdullah ibn Yusuf'tan rivayet etmiştir. Ebu Davud, el-Nasa'i, Ebu Bekir bin Ebi Davud ve Ebu Ca'fer el-Tahawi ondan rivayet etmiştir. El-Şafii'den, Kur'an'ı ezgilerle okumanın hoş karşılanmadığını anlatmıştır. 256 Hicri yılında Zhu'ul-Hicce'de öldü ve bazıları elli yedinci yılda öldüğünü söyler {atı:tabakat-shafiiyya-subki j.1 s.259}."
  id: "Seorang sahabat Mesir al-Shafi'i, seorang ahli hukum yang benar; ia menceritakan dari al-Shafi'i, Abdullah ibn Wahb, Ishaq ibn Wahb, dan Abdullah ibn Yusuf. Abu Dawood, al-Nasa'i, Abu Bakr ibn Abi Dawood, dan Abu Ja'far al-Tahawi menceritakan darinya. Ia menceritakan dari al-Shafi'i bahwa membaca Al-Qur'an dengan melodi tidak disukai. Ia meninggal dalam Dhu al-Hijjah pada tahun 256 H, dan beberapa mengatakan pada tahun lima puluh tujuh {cite:tabaqat-shafiiyya-subki j.1 hlm.259}."
