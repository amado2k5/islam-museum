summary:
  ar: "مصري من أصحاب الشافعي، رجل فقيه صالح؛ روى عن الشافعي وعبد الله بن وهب وإسحاق بن وهب وعبد الله بن يوسف، وروى عنه أبو داود والنسائي وأبو بكر بن أبي داود وأبو جعفر الطحاوي. وهو الذي روى عن الشافعي أن قراءة القرآن بالألحان مكروهة. توفي في ذي الحجة سنة ست وخمسين ومائتين، وقيل سنة سبع وخمسين {cite:tabaqat-shafiiyya-subki j.1 p.259}."
  en: "An Egyptian companion of al-Shafi'i — 'a jurist and a righteous man' — transmitting from al-Shafi'i, 'Abdallah b. Wahb, Ishaq b. Wahb and 'Abdallah b. Yusuf; Abu Dawud, al-Nasa'i, Ibn Abi Dawud and al-Tahawi transmitted from him. It is he who reports from al-Shafi'i that reciting the Qur'an with melodies is disapproved. He died in Dhu'l-Hijja 256, or 257 {cite:tabaqat-shafiiyya-subki j.1 p.259}."
