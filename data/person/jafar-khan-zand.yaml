summary:
  ar: "بطاقة أولية لجعفر خان زند، خام بني زند الخامس بإيران الذي نازعه آقا محمد خان القاجاري، توفي سنة ١٧٨٩م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Ja'far Khan Zand, fifth Zand khan of Persia contested by Agha Muhammad Khan Qajar, d. 1789; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de borrador para Ja'far Khan Zand, quinto kan Zand de Persia disputado por Agha Muhammad Khan Qajar, fallecido en 1789; la entrada del manual dinástico aún no se ha comprobado en la página."
  fr: "Fiche de candidature de Ja'far Khan Zand, cinquième khan Zand de Perse contesté par Agha Muhammad Khan Qajar, mort en 1789; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "جعفر خان زند کے لیے ڈرافٹ کارڈ، فارس کے پانچویں زند خان کا مقابلہ آغا محمد خان قاجار نے کیا، ڈی۔ 1789; خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "İran'daki beşinci Bani Zand ham petrolü olan Cafer Han Zand'ın ön kartı, Ağa Muhammed Han Kacar tarafından tartışmalı olarak 1789 yılında öldü; İslam Devletleri Sözlükleri'nde adı geçti ve çevirisi henüz sayfada incelenmedi."
  id: "Kartu awal Ja'far Khan Zand, minyak mentah Bani Zand kelima di Iran, yang diperdebatkan oleh Agha Mohammad Khan Qajar, meninggal pada tahun 1789 M; ia disebutkan dalam Kamus Negara-negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
