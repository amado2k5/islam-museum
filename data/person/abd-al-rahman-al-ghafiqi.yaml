label: { ar: "عبد الرحمن بن عبد الله الغافقي", en: "Abd al-Rahman ibn Abd Allah al-Ghafiqi", fr: "Abd al-Rahman ibn Abd Allah al-Ghafiqi", es: "Abd al-Rahman ibn Abd Allah al-Ghafiqi", ur: "عبدالرحمن بن عبد اللہ الغفیقی" }
gender: male
summary:
  ar: "أمير الأندلس من قبل عبيد الله بن الحبحاب صاحب إفريقية؛ دخلها سنة ثلاث عشرة ومائة وغزا الإفرنجة وكانت له فيهم وقائع، وأصيب عسكره في رمضان سنة أربع عشرة ومائة في موضع يعرف ببلاط الشهداء وبه عرفت الغزوة، وكانت ولايته سنة وثمانية أشهر {cite:nafh-tib-maqqari p. 272}. ويذكر الكتاب أنه ارتد بالجند بعد الانكسار في معركة طولوشة إلى الأندلس، فولاه أهلها أمرهم حتى قدوم الوالي الجديد، فأخمد بعض حركات الخروج في الولايات الجبلية الشمالية. {cite:salabi-umayyad-state-2020 p.431} ويذكر الكتاب أنه تولى قيادة الجيش بعد استشهاد السمح بن مالك في معركة طولوشة، وانسحب بالجيش إلى أربونة، واستمر أميراً على الأندلس بتقديم أهلها له حتى قدوم الوالي الجديد. {cite:salabi-umayyad-state-2020 p.300}"
  en: "Governor of al-Andalus under Ubayd Allah b. al-Habhab of Ifriqiya; he entered in 113, campaigned deep into Frankish lands, and his army was destroyed with him at Balat al-Shuhada in Ramadan 114 {cite:nafh-tib-maqqari p. 272}."
  fr: "Gouverneur d'al-Andalus sous Ubayd Allah b. al-Habhab d'Ifriqiya ; il y entra en 113, mena campagne loin en terre franque, et son armée fut anéantie avec lui à Balat al-Shuhada en ramadan 114 {cite:nafh-tib-maqqari p. 272}."
  es: "Gobernador de al-Andalus bajo Ubayd Allah b. al-Habhab de Ifriqiya; entró en 113, hizo campaña profundamente en tierras francas y su ejército fue destruido con él en Balat al-Shuhada en Ramadán de 114 {cite:nafh-tib-maqqari p. 272}."
  ur: "عبید اللہ کے ماتحت الاندلس کے گورنر۔ افریقیہ کا الحباب؛ وہ 113 میں داخل ہوا، فرینک کی سرزمین میں گہرائی سے مہم چلاتا تھا، اور اس کی فوج اس کے ساتھ رمضان 114 میں بلات الشہداء میں تباہ ہو گئی تھی۔ 272}۔"
  tr: "İfrikiye hükümdarı Ubeydullah ibn el-Habhab tarafından atanan Endülüs Emiri, Hicri 113 yılında Endülüs'e girdi ve Franklara karşı savaş açarak onlarla çeşitli muharebelere girdi. Ordusu, Hicri 114 yılının Ramazan ayında, Balat el-Şuhada (Şehitler Muharebesi) olarak bilinen yerde bir yenilgiye uğradı ve bu savaş daha sonra bu şekilde anılmaya başlandı. Valiliği bir yıl sekiz ay sürdü. {kaynak:nafh-tib-maqqari s. 272}. Kitapta, Toulouse Muharebesi'ndeki yenilgiden sonra ordusuyla birlikte Endülüs'e döndüğü ve halkın yeni vali gelene kadar işlerini ona emanet ettiği belirtiliyor. Daha sonra kuzeydeki dağlık bölgelerdeki bazı isyanları bastırdı. {kaynak:salabi-umayyad-state-2020 s.431}. Kitap ayrıca, Toulouse Muharebesi'nde el-Samh ibn Malik'in şehit edilmesinin ardından ordunun komutasını devraldığını, orduyla birlikte Narbonne'a çekildiğini ve yeni vali gelene kadar halkının desteğiyle Endülüs Emiri olarak görevine devam ettiğini belirtmektedir. {cite:salabi-umayyad-state-2020 s.300}"
  id: "Emir al-Andalus, yang diangkat oleh Ubayd Allah ibn al-Habhab, penguasa Ifriqiya, memasuki wilayah tersebut pada tahun 113 H dan melancarkan perang melawan kaum Frank, terlibat dalam beberapa pertempuran. Pasukannya mengalami kekalahan pada bulan Ramadan tahun 114 H di tempat yang dikenal sebagai Balat al-Shuhada (Pertempuran Para Syuhada), setelah itu pertempuran tersebut menjadi terkenal. Masa jabatannya sebagai gubernur berlangsung selama satu tahun delapan bulan. {cite:nafh-tib-maqqari hlm. 272}. Kitab tersebut menyebutkan bahwa setelah kekalahan dalam Pertempuran Toulouse, ia kembali dengan pasukannya ke al-Andalus, di mana rakyat mempercayakan urusan mereka kepadanya hingga kedatangan gubernur baru. Kemudian ia menumpas beberapa pemberontakan di wilayah pegunungan utara. {cite:salabi-umayyad-state-2020 hlm. 431}. Buku itu juga menyatakan bahwa ia mengambil alih komando pasukan setelah kemartiran al-Samh ibn Malik dalam Pertempuran Toulouse, mundur bersama pasukan ke Narbonne, dan melanjutkan sebagai Emir al-Andalus dengan dukungan rakyatnya hingga kedatangan gubernur baru. {cite:salabi-umayyad-state-2020 p.300}"
