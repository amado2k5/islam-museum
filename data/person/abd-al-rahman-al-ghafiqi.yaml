id: person/abd-al-rahman-al-ghafiqi
class: person
label: { ar: "عبد الرحمن بن عبد الله الغافقي" }
gender: male
summary:
  ar: "أمير الأندلس من قبل عبيد الله بن الحبحاب صاحب إفريقية؛ دخلها سنة ثلاث عشرة ومائة وغزا الإفرنجة وكانت له فيهم وقائع، وأصيب عسكره في رمضان سنة أربع عشرة ومائة في موضع يعرف ببلاط الشهداء وبه عرفت الغزوة، وكانت ولايته سنة وثمانية أشهر {cite:nafh-tib-maqqari p. 272}. ويذكر الكتاب أنه ارتد بالجند بعد الانكسار في معركة طولوشة إلى الأندلس، فولاه أهلها أمرهم حتى قدوم الوالي الجديد، فأخمد بعض حركات الخروج في الولايات الجبلية الشمالية. {cite:salabi-umayyad-state-2020 p.431} ويذكر الكتاب أنه تولى قيادة الجيش بعد استشهاد السمح بن مالك في معركة طولوشة، وانسحب بالجيش إلى أربونة، واستمر أميراً على الأندلس بتقديم أهلها له حتى قدوم الوالي الجديد. {cite:salabi-umayyad-state-2020 p.300}"
  en: "Governor of al-Andalus under Ubayd Allah b. al-Habhab of Ifriqiya; he entered in 113, campaigned deep into Frankish lands, and his army was destroyed with him at Balat al-Shuhada in Ramadan 114 {cite:nafh-tib-maqqari p. 272}."
