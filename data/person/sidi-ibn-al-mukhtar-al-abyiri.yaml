summary:
  ar: "عالم موريتاني من أسرة علمية، ولد في نواحي بتلميت، وقرأ القرآن والنحو والبلاغة والمنطق والعقائد، ثم رحل في طلب العلم."
  en: "A Mauritanian scholar from a learned family, born near Btalmit. He studied the Qur'an, grammar, rhetoric, logic and creed, then travelled widely in pursuit of learning."
  es: "Un erudito mauritano de una familia culta, nacido cerca de Btalmit. Estudió el Corán, gramática, retórica, lógica y teología, y luego viajó extensamente en busca de conocimiento."
  fr: "Érudit mauritanien issu d'une famille de lettrés, né près de Btalmit, il étudia le Coran, la grammaire, la rhétorique, la logique et la religion, puis voyagea beaucoup pour approfondir ses connaissances."
  ur: "موریطانیہ کا ایک عالم جو کہ بتلمیٹ کے قریب پیدا ہوا تھا۔ اس نے قرآن، گرامر، بیان بازی، منطق اور مسلک کا مطالعہ کیا، پھر سیکھنے کی جستجو میں وسیع پیمانے پر سفر کیا۔"
  tr: "Betelmit bölgesinde doğmuş, bilgin bir aileden gelen Moritanyalı bir âlim olan Sher, Kur'an, dilbilgisi, retorik, mantık ve inanç üzerine çalıştı, ardından bilgi peşinde seyahat etti."
  id: "Seorang ulama Mauritania dari keluarga cendekiawan, lahir di wilayah Betelmit, ia mempelajari Al-Qur'an, tata bahasa, retorika, logika, dan kepercayaan, lalu melakukan perjalanan untuk mencari ilmu."
