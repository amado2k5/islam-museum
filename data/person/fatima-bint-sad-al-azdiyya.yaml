id: person/fatima-bint-sad-al-azdiyya
class: person
label: { ar: "فاطمة بنت سعد الأزدية" }
summary:
  ar: "أم قصي بن كلاب؛ فاطمة بنت سعد بن سيل من الحذرة من أزد شنوءة، وأمها حُبيّ بنت حُليل بن حُبشية الخزاعية، فهي من اليمانيات في جدات النبي؛ روي عنه أنه قال «أنا ابن الفواطم والعواتك»، وهي واحدة من الفواطم {cite:ansab-al-ashraf p. 533}."
  en: "Mother of Qusayy ibn Kilab: Fatima bint Sa'd b. Sayl of the Azd Shanu'a, her mother a Khuza'i — one of the Yamani Fawatim in the Prophet's reported words 'I am the son of the Fatimas and the Atikas' {cite:ansab-al-ashraf p. 533}."
  es: "Madre de Qusayy ibn Kilab: Fatima bint Sa'd b. Sayl de Azd Shanu'a, su madre una Khuza'i, una de las Yamani Fawatim en las palabras atribuidas al Profeta: 'Soy hijo de las Fátimas y las Atikas' {cite:ansab-al-ashraf p. 533}."
  fr: "Mère de Qusayy ibn Kilab: Fatima bint Sa'd b. Sayl de l'Azd Shanu'a, sa mère une Khuza'i — l'une des Yamani Fawatim dans les paroles rapportées du Prophète 'Je suis le fils des Fatimas et des Atikas' {cite: ansab-al-ashraf p. 533}."
  ur: "قصی بن کلاب کی والدہ: فاطمہ بنت سعد ازد شنوہ کی سائل، اس کی والدہ خزائی - ایک یمانی فواتیم میں سے ایک پیغمبر کے بیان کردہ الفاظ میں 'میں فاطمہ اور عتیق کا بیٹا ہوں'۔ 533}۔"
  tr: "Um Qusay ibn Kilab, Fatimah bint Sa'd ibn Sail, Azd Shanwah'tan Al-Hadhara'dan, annesi Hubi bint Hulayl ibn Habshiyyah al-Khuza'iyyah'dı; Peygamber'in büyükanneleri arasında Yemenli kadınlar arasında yer alan Hubi bint Hulayl ibn Habshiyyah al-Khuza'iyyah'dı; ondan rivayet edilir ki, \"Ben el-Fatim ve el-Awatak'ın oğluyum\" demiştir ve kendisi Fatimlerden biridir {atıf:ansab-al-ashraf, s. 533}."
  id: "um Qusay ibn Kilab, Fatimah bint Sa'd ibn Sail, dari Al-Hadhara dari Azd Shanwah, dan ibunya adalah Hubi bint Hulayl ibn Habshiyyah al-Khuza'iyyah, yang termasuk di antara wanita Yaman di antara nenek Nabi; diceritakan darinya bahwa ia berkata, \"Aku adalah putra al-Fatim dan al-Awatak,\" dan dia adalah salah satu Fatim {cite:ansab-al-ashraf, hlm. 533}."
