label: { ar: "أبو بكر الخباز الإصبهاني" }
summary:
  ar: "رجل كان يقول إذا جرى ذكر السعيد نصر بن أحمد ما لي منك يوم طويل البلاء والعناء فكان الناس يضحكون منه؛ وكان سبب خلاص أولاد أحمد بن إسماعيل الساماني من القهندز ببخارا لأن وظيفتهم كانت تُحمل إليهم من عنده فسعى لهم مع جماعة من أهل العسكر وأظهر للبواب زهداً وديناً وأعطاه خمسة دنانير ليفتح له الباب فأخرجهم سنة 318هـ {cite:kamil-ibn-al-athir p. 155}."
  en: "An Isfahani baker whose refrain 'what a day of toil I have from you' whenever Nasr was named made people laugh; he freed the imprisoned sons of Ahmad ibn Isma'il from Bukhara's citadel in 318, bribing the gatekeeper with five dinars {cite:kamil-ibn-al-athir p. 155}."
