class: person
label: { ar: "أبو بكر الخباز الإصبهاني", en: "Abu Bakr al-Khabbaz al-Isbahani", fr: "Abu Bakr al-Khabbaz al-Isbahani", es: "Abu Bakr al-Khabbaz al-Isbahani", ur: "ابوبکر الخباب الصبحانی" }
summary:
  ar: "رجل كان يقول إذا جرى ذكر السعيد نصر بن أحمد ما لي منك يوم طويل البلاء والعناء فكان الناس يضحكون منه؛ وكان سبب خلاص أولاد أحمد بن إسماعيل الساماني من القهندز ببخارا لأن وظيفتهم كانت تُحمل إليهم من عنده فسعى لهم مع جماعة من أهل العسكر وأظهر للبواب زهداً وديناً وأعطاه خمسة دنانير ليفتح له الباب فأخرجهم سنة 318هـ {cite:kamil-ibn-al-athir p. 155}."
  en: "An Isfahani baker whose refrain 'what a day of toil I have from you' whenever Nasr was named made people laugh; he freed the imprisoned sons of Ahmad ibn Isma'il from Bukhara's citadel in 318, bribing the gatekeeper with five dinars {cite:kamil-ibn-al-athir p. 155}."
  fr: "Un boulanger d'Ispahan dont le refrain « quelle journée de peine j'ai à cause de toi », chaque fois que Nasr était nommé, faisait rire les gens ; il libéra de la citadelle de Boukhara les fils emprisonnés d'Ahmad ibn Isma'il en 318, en soudoyant le portier avec cinq dinars {cite:kamil-ibn-al-athir p. 155}."
  es: "Un panadero de Isfahán cuyo estribillo \"¡Qué día de trabajo me espera por tu culpa!\" cada vez que se mencionaba a Nasr hacía reír a la gente; liberó a los hijos encarcelados de Ahmad ibn Isma'il de la ciudadela de Bujará en el año 318, sobornando al portero con cinco dinares {cite:kamil-ibn-al-athir p. 155}."
  ur: "ایک اصفہانی نانبائی جس نے جب بھی نصر کا نام لیا تو لوگوں کو ہنسنے پر مجبور کر دیا، 'میرے پاس تم سے کتنی مشقت کا دن ہے'۔ اس نے احمد بن اسماعیل کے قید شدہ بیٹوں کو بخارا کے قلعہ سے 318 میں دربان کو پانچ دینار رشوت دے کر آزاد کرایا۔ 155}۔"
  tr: "Bir adam, Said Nasr bin Ahmed'in adı geçtiğinde, \"Senden dolayı uzun bir sıkıntı ve zorluk günüm olmayacak\" derdi ve insanlar ona gülerdi. Buhara'daki Kaçandaz'dan Ahmed bin İsmail el-Samani'nin oğullarının kurtuluşunun sebebi oydu, çünkü maaşları ona getiriliyordu. Bu yüzden ordudan bir grup insanla birlikte onlar için çalıştı ve kapıcıya zühd ve takva gösterdi ve kapıyı açması için ona beş dinar verdi, böylece onları Hicri 318 yılında dışarı çıkardı. {Kaynak: Kamil ibn el-Atir s. 155}"
  id: "Dahulu kala, ketika nama Saeed Nasr bin Ahmed disebut-sebut, seorang pria berkata, “Aku tidak pernah mengalami penderitaan dan kesulitan yang panjang karenamu,” dan orang-orang akan menertawakannya. Dialah penyebab keselamatan putra-putra Ahmed bin Ismail al-Samani dari Qahandaz di Bukhara, karena gaji mereka dibawa kepadanya. Maka ia bekerja untuk mereka bersama sekelompok orang dari tentara dan menunjukkan kepada penjaga pintu kesalehan dan ketakwaan serta memberinya lima dinar untuk membukakan pintu bagi mereka, sehingga ia membiarkan mereka keluar pada tahun 318 H {kutipan:kamil-ibn-al-athir hlm. 155}."
