summary:
  ar: "رجل كان يقول إذا جرى ذكر السعيد نصر بن أحمد ما لي منك يوم طويل البلاء والعناء فكان الناس يضحكون منه؛ وكان سبب خلاص أولاد أحمد بن إسماعيل الساماني من القهندز ببخارا لأن وظيفتهم كانت تُحمل إليهم من عنده فسعى لهم مع جماعة من أهل العسكر وأظهر للبواب زهداً وديناً وأعطاه خمسة دنانير ليفتح له الباب فأخرجهم سنة 318هـ {cite:kamil-ibn-al-athir p. 155}."
  en: "An Isfahani baker whose refrain 'what a day of toil I have from you' whenever Nasr was named made people laugh; he freed the imprisoned sons of Ahmad ibn Isma'il from Bukhara's citadel in 318, bribing the gatekeeper with five dinars {cite:kamil-ibn-al-athir p. 155}."
  fr: "Un boulanger d'Ispahan dont le refrain « quelle journée de peine j'ai à cause de toi », chaque fois que Nasr était nommé, faisait rire les gens ; il libéra de la citadelle de Boukhara les fils emprisonnés d'Ahmad ibn Isma'il en 318, en soudoyant le portier avec cinq dinars {cite:kamil-ibn-al-athir p. 155}."
  es: "Un panadero de Isfahán cuyo estribillo \"¡Qué día de trabajo me espera por tu culpa!\" cada vez que se mencionaba a Nasr hacía reír a la gente; liberó a los hijos encarcelados de Ahmad ibn Isma'il de la ciudadela de Bujará en el año 318, sobornando al portero con cinco dinares {cite:kamil-ibn-al-athir p. 155}."
