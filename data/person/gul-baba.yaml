  ar: "بطاقة أولية لغول بابا، الدرويش البكتاشي العثماني الذي ارتبطت تربته ببودا وأنشئت عليها في القرن السادس عشر، توفي سنة ١٥٤١م؛ تذكره معاجم الأعلام ولم تُراجع ترجمته على الصفحة بعد."
