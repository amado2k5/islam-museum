  ur: "عثمانی بکتاشی درویش شاعر گل بابا کے لیے ڈرافٹ کارڈ جس کا بوڈاپیسٹ ٹربا سولہویں صدی میں اٹھایا گیا تھا، ڈی۔ 1541; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
