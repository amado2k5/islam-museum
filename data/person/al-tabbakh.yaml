summary:
  ar: "شمس الدين الطباخ الشريف الحسني المولود والمقيم بمكة الشافعي الإمام الفقيه المقرئ؛ ولد بمكة في رجب سنة إحدى وثمانين وسبعمائة وقرأ القرآن بها على شرف الدين أبي القاسم بن الحسين القرشي الشافعي وأبو الخير علي بن محمد الحسني وكمال الدين يوسف بن أحمد العبسي وأحمد بن الهمذاني وأخذ الحديث عن الجلال البلقيني والكمال الفيومي وطائفة كثيرة وأجاز له السيد ناصر المستحسن الصفاقسي والمجد ابن الجزري والحافظ حمزة المقدسي وغيرهم، وتفقه على الشيخ جمال الدين بن أبي المجد وكمال الدين بن المقفف وقرأ على أبيه وقرأ على ولده كمال الدين، ودرس في منصب شيخه وولد بالمدينة المنورة وتصدى للإقراء ولازم مجلس الإفتاء وشارك في التاريخ وعلم الظرف والمذهب وقرأ القراءات في الأخروين لعدة مرات وتفرد في وقته بمكة وجلس في مجلس الحكم مع القاضي شيخ الإسلام زكريا والحافظ مجد الدين بن ظهيرة والشمس السبقاني والبرهان البغوري وغيرهم وجلس في مجلس قاضي القضاة وولده ومحتسب مكة بعده نحو ثلاثين سنة مفتياً ومدرساً لا يجلس أحداً محله، وكان من السادات يتلقاهم بالتفضيل وكل مذهب لهم ربحاً، وأوحد بالصلات على النبي ثلاثين سنة ونحواً من مائة مرة كل يوم وكان شيخ الجد القاضي جلال الدين ابن المناذي أول من أقرأه الشيخ نور الدين محمد بن علي المري وأول من تصوف به الشيخ أبو طاهر المحاوي القرشي الشافعي، توفي في يوم أربعاء خامس عشر ليلة خلت من جمادى الأولى سنة ثلاث وستين وثمانمائة {cite:shadharat-dhahab p. 302-303}."
  en: "Al-Tabbakh (b. Mecca Rajab 781) — the sharif-muqri' who taught at both Harams, sat nearly thirty years on Mecca's ifta' council beside Zakariyya, Ibn al-Zahira and the al-Baghuri, and kept up ~100 daily salawat on the Prophet for thirty years; al-Manawi's grandfather's own Sufi shaykh; died Wed 15 Jumada I 863 {cite:shadharat-dhahab p. 302-303}."
  fr: "Al-Tabbakh (né Mecca Rajab 781) – le sharif-muqri’ qui enseignait aux deux Harams, siégea près de trente ans au conseil de l’ifta’ de La Mecque aux côtés de Zakariyya, Ibn al-Zahira et al-Baghuri, et garda 100 salawat par jour sur le Prophète pendant trente ans  ; Le grand-père d'al-Manawi, le shaykh soufi ; décédé le mer 15 Jumada I 863 {cite:shadharat-dhahab p. 302-303}."
  es: "Al-Tabbakh (n. La Meca Rajab 781) — el sharif-muqri' que enseñó en ambos Harams, se sentó durante casi treinta años en el consejo de ifta' de La Meca junto a Zakariyya, Ibn al-Zahira y al-Baghuri, y mantuvo ~100 salawat diarias al Profeta durante treinta años; el propio shaykh sufí del abuelo de al-Manawi; murió el miércoles 15 de Jumada I 863 {cita:shadharat-dhahab p. 302-303}."
  ur: "التبخ ⁦(پیدائش مکہ رجب 781)⁩ - شریف مقری جس نے دونوں حرموں میں درس دیا، تقریباً تیس سال مکہ کی افطاری کونسل میں زکریا، ابن الزہرہ اور البغوری کے ساتھ بیٹھا، اور نبی پر روزانہ 100 سال تک صلوات ادا کرتا رہا۔ المناوی کے دادا کے اپنے صوفی شیخ؛ بدھ متوفی 15 جمادی الثانی 863۔ 302-303}۔"
  tr: "Mekke'de doğup yaşayan Şemseddin el-Tabbakh el-Şerif el-Hasani, imam, hukukçu ve şifaetçi olan el-Şafii, yedi yüz seksen birinci yılında Mekke'de Recep'te doğdu. Orada Kur'an'ı al-Din Ebu el-Kasim bin Hüseyin el-Kuraşi el-Şafii, Ebu el-Hayr Ali bin Muhammed el-Hasani, Kamal onuruyla inceledi el-Din Yusuf bin Ahmed el-Absi ve Ahmed ibn al-Hamadhani. Hadisleri el-Celal el-Balkini, el-Kemal el-Feyyumi ve daha birçoklarından aldı. Seyyid Nasser el-Mustahsan el-Sfaxi, el-Majd İbn el-Cezari, hafız Hamza el-Makdisi ve diğerleri tarafından yetki verildi. Fıkıh eğitimini Şeyh Cemaleddin ibn'in yanında aldı Ebu el-Majd ve Kamal el-Din bin el-Muqaffaf, babası ve oğlu Kamal al-Din'in yanında eğitim gördü, şeyhlik görevinde eğitim gördü, Medine'de doğdu, şiir okumaya başladı, fetva meclisine katıldı, tarih, churnografi bilimi ve düşünce okuluna katıldı ve Akharwayn'de okumaları birkaç kez okudu. Görev süresi boyunca Mekke'de yalnızdı ve Hakim Şeyh al-İslam Zekariya, hafıza yazarı Majd al-Din ibn Zuhaira, al-Shams al-Sabqani, al-Burhan al-Baghuri ve diğerleriyle birlikte yönetim kurulunda oturdu. Ayrıca yaklaşık otuz yıl boyunca Başyargıç, oğlu ve Mekke muhtaşı konseyinde müftü ve öğretmen olarak görev yaptı. Yerine kimse oturmazdı. Seyyidler arasındaydı ve her mezhebin kendi çıkarı vardı. O, Peygamber'e otuz yıl boyunca, günde yaklaşık yüz kez bereket göndermekte tek tanrılıydı. Dedenin öğretmeni, Hakim Celaleddin İbn el-Manadhi, Şeyh Nur al-Din Muhammed bin Ali el-Marri tarafından ilk kez okunan kişiydi ve ilk yorumlanan kişi Şeyh Ebu Tahir el-Mahavi el-Kurashi el-Şafi'i idi. Cumed-evvel'den önceki on beşinci gece, 863 Hicri yılında, Çarşamba günü vefat etti {atıf:shadharat-dhahab, s. 302-303}."
  id: "Shams al-Din al-Tabbakh al-Sharif al-Hasani, lahir dan tinggal di Mekah, al-Shafi'i, imam, ahli hukum, dan pembaca; lahir di Mekah di Rajab pada tahun tujuh ratus delapan puluh satu. Ia mempelajari Al-Qur'an di sana di bawah kehormatan al-Din Abu al-Qasim ibn al-Husayn al-Qurashi al-Shafi'i, Abu al-Khayr Ali ibn Muhammad al-Hasani, Kamal al-Din Yusuf ibn Ahmad al-Absi, dan Ahmad ibn al-Hamadhani. Ia mempelajari hadis di bawah bimbingan al-Jalal al-Balqini, al-Kamal al-Fayyumi, dan banyak lainnya. Sayyid Nasser al-Mustahsan al-Sfaxi, al-Majd Ibn al-Jazari, hafiz Hamza al-Maqdisi, dan lainnya mengizinkannya. Ia mempelajari hukum di bawah bimbingan Sheikh Jamal al-Din ibn Abu al-Majd dan Kamal al-Din ibn al-Muqaffaf, belajar di bawah bimbingan ayah dan putranya Kamal al-Din, belajar sebagai sheikh-nya, lahir di Madinah, mengikuti pembacaan, menghadiri dewan fatwa, berpartisipasi dalam sejarah, ilmu churnografi dan aliran pemikiran, serta beberapa kali membaca Akharwayn. Ia sendirian di Mekah selama masa jabatannya dan duduk di dewan penguasa bersama Hakim Sheikh al-Islam Zakariya, penghafal Majd al-Din ibn Zuhaira, al-Shams al-Sabqani, al-Burhan al-Baghuri, dan lainnya. Ia juga duduk dalam dewan Ketua Hakim, putranya, dan muhtashib Mekah selama sekitar tiga puluh tahun sebagai mufti dan guru. Tidak ada yang mau menggantikannya. Ia termasuk di antara para Sayyid yang menerima mereka dengan lebih utama, dan setiap sekte memiliki manfaat tersendiri. Ia monoteistik dalam mengirimkan berkah kepada Nabi selama tiga puluh tahun, sekitar seratus kali sehari. Guru kakeknya, Hakim Jalal al-Din Ibn al-Manadhi, adalah yang pertama dibacakan oleh Sheikh Nur al-Din Muhammad ibn Ali al-Marri, dan yang pertama ditafsirkan oleh itu adalah Sheikh Abu Tahir al-Mahawi al-Qurashi al-Shafi'i. Ia wafat pada hari Rabu, malam kelima belas sebelum Jumada al-Awwal, tahun 863 H {cite:shadharat-dhahab, hlm. 302-303}."
