summary:
  ar: "شمس الدين الطباخ الشريف الحسني المولود والمقيم بمكة الشافعي الإمام الفقيه المقرئ؛ ولد بمكة في رجب سنة إحدى وثمانين وسبعمائة وقرأ القرآن بها على شرف الدين أبي القاسم بن الحسين القرشي الشافعي وأبو الخير علي بن محمد الحسني وكمال الدين يوسف بن أحمد العبسي وأحمد بن الهمذاني وأخذ الحديث عن الجلال البلقيني والكمال الفيومي وطائفة كثيرة وأجاز له السيد ناصر المستحسن الصفاقسي والمجد ابن الجزري والحافظ حمزة المقدسي وغيرهم، وتفقه على الشيخ جمال الدين بن أبي المجد وكمال الدين بن المقفف وقرأ على أبيه وقرأ على ولده كمال الدين، ودرس في منصب شيخه وولد بالمدينة المنورة وتصدى للإقراء ولازم مجلس الإفتاء وشارك في التاريخ وعلم الظرف والمذهب وقرأ القراءات في الأخروين لعدة مرات وتفرد في وقته بمكة وجلس في مجلس الحكم مع القاضي شيخ الإسلام زكريا والحافظ مجد الدين بن ظهيرة والشمس السبقاني والبرهان البغوري وغيرهم وجلس في مجلس قاضي القضاة وولده ومحتسب مكة بعده نحو ثلاثين سنة مفتياً ومدرساً لا يجلس أحداً محله، وكان من السادات يتلقاهم بالتفضيل وكل مذهب لهم ربحاً، وأوحد بالصلات على النبي ثلاثين سنة ونحواً من مائة مرة كل يوم وكان شيخ الجد القاضي جلال الدين ابن المناذي أول من أقرأه الشيخ نور الدين محمد بن علي المري وأول من تصوف به الشيخ أبو طاهر المحاوي القرشي الشافعي، توفي في يوم أربعاء خامس عشر ليلة خلت من جمادى الأولى سنة ثلاث وستين وثمانمائة {cite:shadharat-dhahab p. 302-303}."
  en: "Al-Tabbakh (b. Mecca Rajab 781) — the sharif-muqri' who taught at both Harams, sat nearly thirty years on Mecca's ifta' council beside Zakariyya, Ibn al-Zahira and the al-Baghuri, and kept up ~100 daily salawat on the Prophet for thirty years; al-Manawi's grandfather's own Sufi shaykh; died Wed 15 Jumada I 863 {cite:shadharat-dhahab p. 302-303}."
