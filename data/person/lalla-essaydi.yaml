summary:
  ar: "مصوّرة مغربية، وُلدت باسم للا آسية السعيدي في مراكش سنة 1956. عاشت في المغرب والسعودية وفرنسا ثم أمريكا، ودرست في المدرسة العليا للفنون الجميلة بباريس ونالت الماجستير في التصوير والرسم من بوسطن سنة 2003. تشتهر بصور مُعدّة بعناية لنساء عربيات تكسو أجسادهن وفضاءاتهن خطوطٌ عربية مرسومة بالحناء — الفنّ الذي كان حكرًا على الرجال — في سلاسل مثل «أراضٍ متقاربة» و«نساء المغرب»، فتعيد بها قراءة الصورة الاستشراقية للمرأة العربية وتردّ النظر إلى صاحبته."
  en: "Moroccan photographer, born as Lalla Assia Essaydi in Marrakesh in 1956. She has lived in Morocco, Saudi Arabia, France and the United States, studied at the Ecole nationale superieure des Beaux-Arts in Paris, and took her MFA in painting and photography in Boston in 2003. She is known for carefully staged photographs of Arab women whose bodies and surroundings are covered in Arabic calligraphy applied in henna — an art traditionally reserved to men — in series such as Converging Territories and Les Femmes du Maroc, re-reading the Orientalist image of the Arab woman and returning the gaze to its subject."
  ur: "مراکشی مصوّرہ، 1956 میں مراکش میں للہ آسیہ السعیدی کے نام سے پیدا ہوئیں۔ وہ مراکش، سعودی عرب، فرانس اور امریکہ میں رہیں، پیرس کے ایکول ناسیونال میں تعلیم حاصل کی اور 2003 میں بوسٹن سے مصوری و فوٹوگرافی میں ایم ایف اے کیا۔ وہ عرب خواتین کی احتیاط سے سجائی گئی تصاویر کے لیے مشہور ہیں جن کے جسم اور ماحول مہندی سے لکھی عربی خطاطی سے ڈھکے ہوتے ہیں — وہ فن جو روایتی طور پر مردوں کے لیے مخصوص تھا — «کنورجنگ ٹیریٹریز» اور «مراکش کی خواتین» جیسی سیریز میں، جن میں وہ عرب عورت کی مستشرقانہ تصویر کو نئے سرے سے پڑھتی ہیں۔"
