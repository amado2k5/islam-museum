  ar: "وهبة الزحيلي ⁦(1932–2015)⁩ فقيه شافعي سوري وأستاذ الفقه الإسلامي بجامعة دمشق، صاحب «الفقه الإسلامي وأدلته»، أوسع موسوعة معاصرة في الفقه المقارن، وصاحب تفسير «المنير» وكتب في أصول الفقه."
  en: "Wahbah al-Zuhayli (1932–2015) was a Syrian Shafi'i jurist and professor of Islamic jurisprudence at the University of Damascus, author of Al-Fiqh al-Islami wa Adillatuhu, the most comprehensive modern encyclopedia of comparative Islamic law, and of the tafsir Al-Munir and works on legal theory."
