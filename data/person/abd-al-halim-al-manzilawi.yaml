summary:
  ar: "الشيخ عبد الحليم المنزيلاوي؛ كان يضرب المريدين بشدة حتى يقع بعضهم في الموت فيجدد له الحياة فيقبل التوبة، وكان سخياً لا يعدم أحد فضله وتوفي بعد وفاة السلطان قايتباي بقليل {cite:shadharat-dhahab p. 592}."
  en: "The murid-tester shaykh — he struck disciples so severely some fell near death, then 'renewed their life' as they accepted repentance; open-handed to all; died shortly after Sultan Qaytbay {cite:shadharat-dhahab p. 592}."
  fr: "Le cheikh qui éprouvait les murids — il frappait les disciples si durement que certains tombaient presque morts, puis « renouvelait leur vie » en acceptant leur repentir ; généreux envers tous ; mort peu après le sultan Qaytbay {cite:shadharat-dhahab p. 592}."
  es: "El shaykh probador de murid —golpeaba a los discípulos con tanta severidad que algunos caían al borde de la muerte, y luego 'renovaban su vida' al aceptar el arrepentimiento; generoso con todos; murió poco después del sultán Qaytbay {cite:shadharat-dhahab p. 592}."
  ur: "مرید-آزمائشی شیخ - اس نے شاگردوں کو اس قدر شدید مارا کہ کچھ موت کے قریب گر گئے، پھر 'اپنی زندگی کی تجدید' کے طور پر انہوں نے توبہ قبول کی۔ سب کے لیے کھلے ہاتھ؛ سلطان قیتبے کے کچھ ہی عرصے بعد وفات پائی۔ 592}۔"
