label: { ar: "خزيمة بن خازم", en: "Khuzayma ibn Khazim", es: "Khuzayma ibn Khazim", fr: "Khuzayma ibn Khazim", ur: "خزیمہ بن خزیم" }
summary:
  ar: "خزيمة بن خازم؛ من ولاة أرمينية للعباسيين بعد روح بن حاتم المهلابي وقبل يزيد بن مزيد الشيباني، وكان أشدهم ولاية وهو الذي سنّ المساحة بدبيل والنشوى ولم يكن قبل ذلك."
  en: "Khuzayma ibn Khazim; an Abbasid governor of Armenia after Rawh ibn Hatim al-Muhallabi and before Yazid ibn Mazyad al-Shaybani — the sternest of them in office, and the one who instituted the land-survey at Dabil and Nashwa, which had not existed before."
  es: "Khuzayma ibn Khazim, gobernador abasí de Armenia después de Rawh ibn Hatim al-Muhallabi y antes de Yazid ibn Mazyad al-Shaybani, fue el más severo de ellos en el cargo y quien instituyó el catastro en Dabil y Nashwa, que no existía anteriormente."
  fr: "Khuzayma ibn Khazim; gouverneur abbasside d'Arménie après Rawh ibn Hatim al-Muhallabi et avant Yazid ibn Mazyad al-Shaybani — le plus sévère d'entre eux en fonction, et celui qui a institué le cadastre à Dabil et Nashwa, qui n'existait pas auparavant."
  ur: "خزیمہ بن خزیم؛ راح ابن حاتم المحلبی کے بعد اور یزید بن مازیاد الشیبانی کے بعد آرمینیا کا ایک عباسی گورنر - ان میں سے سب سے سخت عہدہ دار، اور وہ جس نے دبیل اور ناشوا میں زمینی سروے کا آغاز کیا، جو پہلے موجود نہیں تھا۔"
  tr: "Khuzaymah ibn Khazim, Ruh ibn Hatim el-Muhallabi'den ve Yezid ibn Mazid el-Şeybani'den önce Abbasilerin Ermeni valilerinden biriydi. En güçlü valiydi ve daha önce değil, Dabil ve Nashwa bölgesini kurdu."
  id: "Khuzaymah ibn Khazim adalah salah satu gubernur Armenia Abbasiyah setelah Ruh ibn Hatim al-Muhallabi dan sebelum Yazid ibn Mazid al-Shaybani. Ia adalah gubernur terkuat dan mendirikan wilayah Dabil dan Nashwa, bukan sebelumnya."
