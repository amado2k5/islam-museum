died: { edtf: "1110", hijri: "0504", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي بكرمان سنة أربع وخمسمائة على قول العماد {cite:wafayat-ayan}." }
summary:
  ar: "الشريف أبو يعلى محمد بن محمد بن صالح بن حمزة بن عيسى بن محمد بن عبد الله بن داود بن عيسى بن موسى بن محمد بن علي بن عبد الله بن العباس الهاشمي العباسي، المعروف بابن الحبارية، الملقب نظام الدين البغدادي؛ الشاعر المشهور، كان شاعراً مجيداً حسن المقاصد لكنه كان خميث اللسان كثير الهجاء والوقوع في الناس لا يكاد يسلم من لسانه أحد؛ قال العماد الكاتب في الخريدة: من شعراء نظام الملك، غلب على شعره الهجاء والهزل والسخف، وسبك في قالب ابن حجاج وسلك أسلوبه وفاقه في الخلاعة، والنظيف من شعره في غاية الحسن؛ كان ملازماً لخدمة نظام الملك وزير ألب أرسلان وملكشاه وله عليه الإنعام التام والإدرار المستمر؛ صاحب القصيدة الساسانية في مدح بغداد {cite:wafayat-ayan}."
  en: "Nizam al-Din Ibn al-Habbariyya (d. 504) — the Abbasid sharif poet of Baghdad; pensioned by Nizam al-Mulk yet infamous for the sharpest satirical tongue of his age ('no one was safe from it'); author of the celebrated Sasaniyya on Baghdad {cite:wafayat-ayan}."
  es: "Nizam al-Din Ibn al-Habbariyya (m. 504), el poeta abasí sharif de Bagdad; pensionado por Nizam al-Mulk pero famoso por la lengua satírica más mordaz de su época (\"nadie estaba a salvo de ella\"); autor del célebre Sasaniyya en Bagdad {cita:wafayat-ayan}."
  fr: "Nizam al-Din Ibn al-Habbariyya (mort en 504) — le poète chérif abbasside de Bagdad; retraité de Nizam al-Mulk mais tristement célèbre pour le langage satirique le plus acéré de son époque (« personne n'en était à l'abri »); auteur du célèbre Sasaniyya sur Bagdad {cite: wafayat-ayan}."
  ur: "نظام الدین ابن الحبریہ ⁦(متوفی 504)⁩ - بغداد کے عباسی شریف شاعر؛ نظام الملک کی طرف سے پنشن یافتہ لیکن اپنی عمر کی تیز ترین طنزیہ زبان کے لیے بدنام ⁦('اس سے کوئی بھی محفوظ نہیں تھا')⁩؛ بغداد میں مشہور ساسانیہ کے مصنف۔"
  tr: "Asil Ebu Ya'la Muhammed ibn Muhammed ibn Salih ibn Hamza ibn İsa ibn Muhammed ibn Abdullah ibn Davud ibn İsa ibn Muhammed ibn Ali ibn Abdullah ibn Abdullah ibn el-Abbas el-Haşimi el-Abbasi, İbn el-Habariyya olarak bilinir, lakabı Nizam al-Din el-Bağdadi; ünlü şair, iyi niyetli bir şairdi, ancak hicivde ustaydı ve sık sık insanlara hakaret ederdi, neredeyse kimse kaçamazdı dilini bozdu. El-İmad el-Katib el-Hurida'da şöyle demiştir: Nizam al-Mulk'un şairleri arasındaydı; şiirleri hiciv, mizah ve saçmalıkla doluydu ve şiirlerini İbn Haccac tarzında yazmış, üslubu en yüksek güzellikle incelenmişti. Alp Arslan ve Malikşah'ın bakanı Nizam al-Mulk'un sürekli yoldaşıydı ve Bağdat'ı öven Sasani şiirinin yazarıydı {alıntı:] Wafayat-ayan}."
  id: "Abu Ya'la yang mulia Muhammad ibn Muhammad ibn Salih ibn Hamza ibn Isa ibn Muhammad ibn Abdullah ibn Dawud ibn Isa ibn Musa ibn Muhammad ibn Ali ibn Abdullah ibn al-Abbas al-Hashimi al-Abbasi, dikenal sebagai Ibn al-Habariyya, dijuluki Nizam al-Din al-Baghdadi; penyair terkenal ini adalah penyair terampil dengan niat baik, tetapi ia fasih dalam satir dan sering menghina orang, hampir tidak siapa pun yang bisa lolos dari lidahnya. Al-Imad al-Katib berkata dalam al-Khurida: Ia termasuk di antara penyair Nizam al-Mulk, yang puisinya didominasi oleh satir, humor, dan keabsurdan, dan ia menggayanya dengan gaya Ibn Hajjaj, dan gayanya sangat halus dan indah. Ia adalah teman setia Nizam al-Mulk, menteri Alp Arslan dan Malikshah, serta penulis puisi Sasanian yang memuji Baghdad {cite:Wafayat-Ayan}."
