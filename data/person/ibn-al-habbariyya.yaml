summary:
  ar: "الشريف أبو يعلى محمد بن محمد بن صالح بن حمزة بن عيسى بن محمد بن عبد الله بن داود بن عيسى بن موسى بن محمد بن علي بن عبد الله بن العباس الهاشمي العباسي، المعروف بابن الحبارية، الملقب نظام الدين البغدادي؛ الشاعر المشهور، كان شاعراً مجيداً حسن المقاصد لكنه كان خميث اللسان كثير الهجاء والوقوع في الناس لا يكاد يسلم من لسانه أحد؛ قال العماد الكاتب في الخريدة: من شعراء نظام الملك، غلب على شعره الهجاء والهزل والسخف، وسبك في قالب ابن حجاج وسلك أسلوبه وفاقه في الخلاعة، والنظيف من شعره في غاية الحسن؛ كان ملازماً لخدمة نظام الملك وزير ألب أرسلان وملكشاه وله عليه الإنعام التام والإدرار المستمر؛ صاحب القصيدة الساسانية في مدح بغداد {cite:wafayat-ayan}."
  en: "Nizam al-Din Ibn al-Habbariyya (d. 504) — the Abbasid sharif poet of Baghdad; pensioned by Nizam al-Mulk yet infamous for the sharpest satirical tongue of his age ('no one was safe from it'); author of the celebrated Sasaniyya on Baghdad {cite:wafayat-ayan}."
