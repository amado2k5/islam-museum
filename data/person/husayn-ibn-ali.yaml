summary:
  en: "Younger grandson of the Prophet through Fatima and Ali, born at Medina in 4 AH (January 626 CE). He refused the pledge to Yazid I after Mu'awiya's death, set out from Mecca for Kufa on 8 Dhu al-Hijja 60 AH and was killed at Karbala on 10 Muharram 61 AH (October 680 CE). The Encyclopaedia of Islam reports his wide esteem among Muslims, the Shi'i view of him as third imam, and the differing judgements of Western scholars."
  ar: "حفيد النبي الأصغر من فاطمة وعلي، وُلد بالمدينة سنة 4هـ، يناير 626م. أبى بيعة يزيد الأول بعد وفاة معاوية، وخرج من مكة إلى الكوفة في 8 ذي الحجة سنة 60هـ، وقُتل بكربلاء في 10 محرم سنة 61هـ، أكتوبر 680م. وتنقل دائرة المعارف الإسلامية تقدير المسلمين له عامة، ونظرة الشيعة إليه إمامًا ثالثًا، واختلاف أحكام الباحثين الغربيين. وعند المسعودي كان من نصحه ابن عباس أن يشخص إلى اليمن ولا يخرج نساءه وولده معه فقال لأن أقتل بمكان كذا أحب إلي من أن أستحل بمكة، وأخبره الحر بن يزيد بقتل مسلم وهو بالقادسية {cite:muruj-al-dhahab p. 54,59}، وفي مسلم أدخله النبي تحت المرط المرحل مع أخيه وأبويه وتلا آية التطهير {cite:sahih-muslim 2424}"
  ur: "فاطمہ اور علی کے ذریعے نبی کے چھوٹے نواسے، مدینہ میں 4ھ، جنوری 626ء میں پیدا ہوئے۔ معاویہ کی وفات کے بعد انہوں نے یزید اول کی بیعت سے انکار کیا، 8 ذی الحجہ 60ھ کو مکہ سے کوفہ کے لیے نکلے اور 10 محرم 61ھ، اکتوبر 680ء کو کربلا میں مارے گئے۔ اسلامی دائرۃ المعارف مسلمانوں میں ان کے عمومی احترام، شیعہ کے ہاں تیسرے امام کی حیثیت، اور مغربی محققین کے مختلف احکام کا ذکر کرتا ہے۔"
  es: "Nieto menor del Profeta, hijo de Fátima y Alí, nació en Medina en el año 4 de la Hégira (enero de 626 d. C.). Tras la muerte de Muawiya, rechazó el juramento de lealtad a Yazid I, partió de La Meca hacia Kufa el 8 de Dhu al-Hijjah del año 60 de la Hégira y murió en Karbala el 10 de Muharram del año 61 de la Hégira (octubre de 680 d. C.). La Enciclopedia del Islam destaca su gran estima entre los musulmanes, la visión chiíta que lo considera el tercer imán y las diferentes opiniones de los eruditos occidentales."
  fr: "Petit-fils cadet du Prophète par Fatima et Ali, né à Médine en 4 AH (janvier 626 ap. J.-C.). Il refusa le serment d'allégeance à Yazid Ier après la mort de Mu'awiya, quitta La Mecque pour Koufa le 8 Dhu al-Hijja 60 AH et fut tué à Karbala le 10 Muharram 61 AH (octobre 680 ap. J.-C.). L'Encyclopédie de l'Islam rapporte la grande estime dont il jouissait parmi les musulmans, la position chiite qui le considère comme le troisième imam, ainsi que les divergences d'opinions des érudits occidentaux."
  tr: "Fatıma ve Ali'den genç Peygamber'in torunu olan Sher, M.S. 4 Hicri Ocak 626'da Medine'de doğdu. Muaviye'nin ölümünden sonra Yezidi I'e bağlılık yemini etmeyi reddetti, 8 Zfu Hicce 60 Hicce'de Mekke'den Kufa'ya gitti ve 10 Muharrem 61 H, Ekim 680'de Kerbela'da öldürüldü. İslami Ansiklopedi, Müslümanların genel takdirini, Şiilerin onu üçüncü İmam olarak görme görüşünü ve Batılı araştırmacıların farklı kararlarını kaydeder. El-Mes'e göre, İbn Abbas ona Yemen'e gitmesini ve kadınlarını, çocuklarını yanında götürmemesini tavsiye etmiştir. Şöyle demiştir: 'Böyle bir yerde öldürülmem, Mekke'de yasal kılınmaktan daha bekleme olur.' El-Hurr bin Yezid, Müslim'in el-Kadisiye'deyken öldürüldüğünü anlatmıştır {atı:muruj-al-dhahab s. 54,59}. Müslüman dilinde, Peygamber onu kardeşi ve ebeveynleriyle birlikte sürgün edilmiş mertabın altına koymuş ve arınma ayetini okudu {atı:sahih-müslim 2424}"
  id: "Cucu dari Nabi muda dari Fatimah dan Ali, ia lahir di Madinah pada tahun 4 H, Januari 626 M. Ia menolak sumpah setia kepada Yazid I setelah kematian Muawiya, meninggalkan Mekah menuju Kufa pada 8 Dhu al-Hijjah 60 H, dan dibunuh di Karbala pada 10 Muharram 61 H, Oktober 680 M. Ensiklopedia Islam mencatat apresiasi umum terhadap umat Islam, pandangan Syiah terhadapnya sebagai Imam ketiga, dan perbedaan keputusan para peneliti Barat. Menurut al-Mas'ud, Ibn Abbas menasihatinya untuk pergi ke Yaman dan tidak membawa wanita serta anak-anaknya bersamanya. Ia berkata, 'Lebih tertunda bagi saya untuk dibunuh di tempat seperti itu daripada disahkan di Mekah.' Al-Hurr ibn Yazid memberitahunya tentang pembunuhan Muslim saat ia berada di al-Qadisiyyah {cite:muruj-al-dhahab hlm. 54,59}. Dalam Muslim, Nabi menempatkannya di bawah martab yang diasingkan bersama saudara dan orang tuanya dan membaca ayat penyucian {cite:sahih-muslim 2424}"
