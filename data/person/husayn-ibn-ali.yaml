  did_you_know:
    ar: "الحسين بن علي حفيد النبي الأصغر من ابنته فاطمة، ورفض بيعة يزيد الأول قبل أن يلقى حتفه بكربلاء سنة ٦٨٠م."
    en: "Al-Husayn ibn Ali, the Prophet's younger grandson through his daughter Fatima, declined allegiance to Yazid I before meeting his death at Karbala in 680 CE."
    ur: "حسین بن علی نبی کی بیٹی فاطمہ سے چھوٹے نواسے تھے؛ انہوں نے یزید اول کی بیعت سے انکار کیا اور 680ء میں کربلا میں جاں بحق ہوئے۔"
