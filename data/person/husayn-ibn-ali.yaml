issue: { ar: "كيف يُفهم خروج الحسين بن علي ومقتله بكربلاء؟", en: "How is Husayn ibn Ali's rising and his killing at Karbala understood?" }
perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni tradition venerates Husayn as the Prophet's beloved grandson and remembers Karbala as a tragedy and an injustice done to the Prophet's family.", ar: "تُجِلّ السنة الحسين سبط النبي، وتذكر كربلاء مأساة وظلمًا وقع على أهل البيت." }
    sources: [source/ibn-sad-tabaqat-bewley]
  - tradition: sunni
    id: sunni-suwaidan
    holders: [person/tariq-al-suwaidan]
    summary:
      ar: "أهل السنة: في قراءة طارق السويدان في برنامجه «علمني التاريخ» كانت خلافة معاوية شرعية ببيعة عامة بايع فيها الحسن والحسين فلا يُطعن فيها {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep18 00:13:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep18 00:13:30}، أما يزيد ففُرض مرشحًا واحدًا بإلغاء الشورى، فقام الحسين مرشحًا منافسًا لا خارجًا على إمام، لأن بيعة يزيد في رأيه لم تنعقد على من لم يبايعه {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep19 00:14:30} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep19 00:15:00}. ويرى أن ابن عباس وناصحيه عدّوا خروجه غير حكيم سياسيًا لا غير شرعي {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep20 00:13:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep20 00:13:30}."
      en: "Ahl al-Sunna: in Tareq al-Suwaidan's reading in his programme \"History Taught Me\", Mu'awiya's caliphate was legitimate by a general pledge in which al-Hasan and al-Husayn took part and is not to be impugned {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep18 00:13:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep18 00:13:30}, whereas Yazid was imposed as a single candidate by abolishing consultation, so al-Husayn rose as a rival candidate rather than a rebel against an imam, since in his view the pledge for Yazid was never concluded over those who did not give it {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep19 00:14:30} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep19 00:15:00}. He holds that Ibn Abbas and the other advisers judged the rising politically unwise, not illegitimate {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep20 00:13:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep20 00:13:30}."
      ur: "أهل السنة: طارق السویدان کی اپنے پروگرام «علمني التاريخ» میں تعبیر کے مطابق معاویہ کی خلافت ایک عام بیعت سے جائز تھی جس میں حسن اور حسین شریک تھے، اس لیے اس پر طعن نہیں کیا جاتا {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep18 00:13:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep18 00:13:30}؛ جبکہ یزید کو شوریٰ ختم کر کے واحد امیدوار کے طور پر مسلط کیا گیا، چنانچہ حسین امام کے خلاف خروج کرنے والے نہیں بلکہ مدمقابل امیدوار کے طور پر اٹھے، کیونکہ ان کی رائے میں یزید کی بیعت ان لوگوں پر منعقد ہی نہیں ہوئی جنہوں نے بیعت نہیں کی {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep19 00:14:30} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep19 00:15:00}۔ ان کے نزدیک ابن عباس اور دوسرے ناصحین نے اس اقدام کو ناجائز نہیں بلکہ سیاسی طور پر غیر دانشمندانہ سمجھا {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep20 00:13:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep20 00:13:30}۔"
    sources: [source/assabile-tareq-al-suwaidan]
