summary:
  ar: "هاروت أحد المَلَكين اللذين ذُكرا في قصة السحر ببابل في سورة البقرة: «واتبعوا ما تتلو الشياطين على ملك سليمان... وماروت وهاروت». اختلف المفسرون في صفتهما؛ فذهب جمع إلى أنهما ملكان أُرسلا ليبتليا الناس، وذهب آخرون إلى أنهما من الجن أو البشر، وروي أن الله عاقبهما بعد تعليم السحر {cite:tanzil-quran} {cite:tafsir-ibn-kathir}."
  en: "Harut is one of the two beings named in the Babylon magic narrative of surah al-Baqarah: 'they followed what the devils recited about the kingdom of Solomon... and Marut and Harut'. The exegetes differed over their nature; many held them to be two angels sent to test people, others said jinn or humans, and tradition adds that God punished them after they taught sorcery {cite:tanzil-quran} {cite:tafsir-ibn-kathir}."
  ur: "ہاروت ان دو ہستیوں میں سے ایک ہیں جن کا ذکر سورۃ البقرہ کی جادو کی کہانی میں آیا ہے: «اور انہوں نے تو تابع ہوئے جو شیطان سلیمان کی بادشاہت کے بارے میں پڑھتے تھے... اور ماروت اور ہاروت»۔ مفسروں میں ان کی فطرت پر اختلاف ہے؛ بہت سے انہیں دو فرشتے مانتے ہیں جو لوگوں کی آزمائش کے لیے بھیجے گئے، دوسروں نے انہیں جن یا انسان کہا، اور روایت میں ہے کہ سحر سکھانے کے بعد اللہ نے ان پر سزا دی {cite:tanzil-quran} {cite:tafsir-ibn-kathir}۔"
  es: "Harut es uno de los dos seres mencionados en la narración mágica babilónica de la sura al-Baqarah: «siguieron lo que los demonios recitaron sobre el reino de Salomón... y Marut y Harut». Los exégetas discreparon sobre su naturaleza; muchos los consideraron dos ángeles enviados para poner a prueba a la gente, otros dijeron que eran genios o humanos, y la tradición añade que Dios los castigó después de que enseñaran hechicería {cite:tanzil-quran} {cite:tafsir-ibn-kathir}."
  fr: "Harut est l'un des deux êtres mentionnés dans le récit magique babylonien de la sourate al-Baqarah: « Ils suivirent ce que les démons récitaient au sujet du royaume de Salomon… et Marut et Harut. » Les exégètes divergent quant à leur nature; beaucoup les considèrent comme deux anges envoyés pour éprouver les hommes, d'autres comme des djinns ou des humains, et la tradition ajoute que Dieu les punit après qu'ils eurent enseigné la sorcellerie."
