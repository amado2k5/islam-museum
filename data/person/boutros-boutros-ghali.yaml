summary:
  ar: "بطرس بطرس غالي (14 نوفمبر 1922 – 16 فبراير 2016)، دبلوماسي وأكاديمي مصري وُلد في القاهرة لأسرة قبطية، درّس القانون الدولي في جامعة القاهرة ثلاثين عامًا، وتولى وزارة الخارجية بالوكالة في مفاوضات كامب ديفيد، ثم كان الأمين العام السادس للأمم المتحدة (1992–1996) صاحب «خطة للسلام»، فاعترضت الولايات المتحدة على ولايته الثانية، ثم قاد منظمة الفرنكوفونية (1997–2002)."
  en: "Boutros Boutros-Ghali (14 November 1922 – 16 February 2016) was an Egyptian diplomat and academic born in Cairo to a Coptic family. He taught international law at Cairo University for thirty years, served as acting foreign minister around the Camp David negotiations, and became the sixth Secretary-General of the United Nations (1992–1996), author of An Agenda for Peace; the United States vetoed his second term. He then led the Organisation internationale de la Francophonie (1997–2002)."
  ur: "بطرس بطرس غالی (14 نومبر 1922ء – 16 فروری 2016ء) مصری سفارت کار اور ماہرِ تعلیم تھے جو قاہرہ میں ایک قبطی خاندان میں پیدا ہوئے۔ انہوں نے تیس سال جامعہ قاہرہ میں بین الاقوامی قانون پڑھایا، کیمپ ڈیوڈ مذاکرات کے زمانے میں قائم مقام وزیرِ خارجہ رہے، پھر اقوام متحدہ کے چھٹے سیکرٹری جنرل (1992ء–1996ء) بنے اور ”امن کا ایجنڈا“ پیش کیا؛ امریکا نے ان کی دوسری مدت پر ویٹو کیا۔ بعد ازاں انہوں نے فرانکوفونی کی تنظیم کی قیادت کی (1997ء–2002ء)۔"
