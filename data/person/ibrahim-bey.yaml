summary:
  ar: "إبراهيم بيك الكبير، مملوك محمد بيك أبي الذهب، رُقّي إلى الإمارة سنة 1182هـ/1768-9م، وبعد وفاة أبي الذهب سنة 1189هـ/1775م تولى هو ومراد بيك الصدارة في مصر وصار شيخ البلد. تقاسما الحكم في ثنائية قلقة تخللتها خلافات ونفي وعودة، حتى هزم الفرنسيون مراداً في إمبابة فخرج إبراهيم إلى الشام في 21 يوليو 1798، ولم يستعد نفوذه في مصر {cite:encyclopaedia-of-islam-2 vol. 3 p. 1024}."
  en: "Ibrahim Bey al-Kabir, a mamluk of Muhammad Bey Abu'l-Dhahab, was raised to the beylicate in 1182/1768-9, and after Abu'l-Dhahab's death in 1189/1775 he and Murad Bey held the leading place in Egypt, Ibrahim becoming shaykh al-balad. They ruled in an uneasy duumvirate marked by quarrels, exile and return, until the French defeated Murad at Imbaba and Ibrahim left for Syria on 21 July 1798, never regaining his ascendancy in Egypt {cite:encyclopaedia-of-islam-2 vol. 3 p. 1024}."
  ur: "ابراہیم بیگ الکبیر محمد بیگ ابوالذہب کے مملوک تھے، 1182ھ/1768-9ء میں امارت پر پہنچے، اور ابوالذہب کی 1189ھ/1775ء میں وفات کے بعد وہ اور مراد بیگ مصر میں سرکردہ رہے اور ابراہیم شیخ البلد بنے۔ دونوں نے بے چین دو رکنی حکومت چلائی جس میں جھگڑے، جلاوطنی اور واپسی آتی رہی، یہاں تک کہ فرانسیسیوں نے امبابہ میں مراد کو شکست دی اور ابراہیم 21 جولائی 1798ء کو شام چلے گئے اور مصر میں پھر اقتدار نہ پا سکے {cite:encyclopaedia-of-islam-2 vol. 3 p. 1024}."
