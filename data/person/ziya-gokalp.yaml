summary:
  ar: "عالم اجتماع وكاتب وشاعر وسياسي تركي (1876–1924)، المنظّر الأبرز للطورانية والقومية التركية وصاحب «مبادئ الطورانية» (1923) وصيغة «التتريك والأسلمة والمعاصرة»، عضو جمعية الاتحاد والترقي وأول أستاذ لعلم الاجتماع في جامعة إسطنبول، أثّر فكره عميقًا في كمال أتاتورك وإصلاحاته، ومات نائبًا في المجلس الوطني الكبير."
  en: "Turkish sociologist, writer, poet and politician (1876–1924), the leading theorist of Turkism and Turkish nationalism, author of The Principles of Turkism (1923) and of the formula 'Turkification, Islamization, modernization'. A Committee of Union and Progress member and Istanbul University's first professor of sociology, his thought deeply influenced Mustafa Kemal Atatürk and his reforms; he died a deputy of the Grand National Assembly."
  ur: "ترک ماہر عمرانیات، ادیب، شاعر اور سیاست دان (1876–1924)، ترکیت اور ترک قومیت کے سب سے بڑے نظریہ ساز، «ترکیت کے اصول» (1923) کے مصنف اور 'ترکی سازی، اسلامیت اور جدیدیت' کے فارمولے کے خالق؛ جمعیت اتحاد و ترقی کے رکن اور استنبول یونیورسٹی کے پہلے پروفیسر برائے عمرانیات؛ ان کی فکر نے مصطفی کمال اتاترک اور ان کی اصلاحات پر گہرا اثر ڈالا۔"
