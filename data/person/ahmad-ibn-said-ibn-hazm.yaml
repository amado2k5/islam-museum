summary:
  ar: "الوزير أبو عمرو والد العلامة أبي محمد ابن حزم، كان كاتباً مفتياً لغوياً متبحراً في علم اللسان، توفي سنة ثلاث وتسعين وثلاث مئة {cite:shadharat-dhahab p. 171}."
  en: "The vizier Abu 'Amr Ahmad b. Sa'id b. Hazm, father of the polymath Ibn Hazm — a secretary, mufti and philologist 'deep-sailing in the science of the tongue'; he died in 393 {cite:shadharat-dhahab p. 171}."
  es: "El visir Abu 'Amr Ahmad b. Sa'id b. Hazm, padre del polímata Ibn Hazm, secretario, muftí y filólogo 'profundamente versado en la ciencia de la lengua'; murió en 393 {cite:shadharat-dhahab p. 171}."
  fr: "Le vizir Abu 'Amr Ahmad b. Sa'id b. Hazm, père du polymathe Ibn Hazm — secrétaire, mufti et philologue « naviguant profondément dans la science de la langue »; il mourut en 393 {cite: shadharat-dhahab p. 171}."
  ur: "وزیر ابو عمرو احمد بن۔ سعید بی۔ حزم، پولی میتھ ابن حزم کے والد - ایک سکریٹری، مفتی اور ماہر فلکیات 'زبان کی سائنس میں گہری کشتی'؛ ان کی وفات 393ھ میں ہوئی۔ 171}۔"
  tr: "Alim Ebu Muhammed İbn Hazm'ın babası olan Bakan Ebu Amr, yazar, müftü, dilbilimci ve dil ilmi uzmanıydı. Hicri 393 yılında vefat etti. {Kaynak: Şadharat-dahab s. 171}"
  id: "Menteri Abu Amr, ayah dari ulama Abu Muhammad Ibn Hazm, adalah seorang penulis, mufti, ahli bahasa, dan pakar ilmu bahasa. Beliau wafat pada tahun 393 H {cite:shadharat-dhahab p. 171}."
