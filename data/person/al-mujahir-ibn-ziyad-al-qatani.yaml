id: person/al-mujahir-ibn-ziyad-al-qatani
class: person
label:
  ar: المجاهر بن زياد القطني
  en: Al-Mujahir ibn Ziyad of Banu Qatan
  fr: "Al-Mujahir ibn Ziyad of Banu Qatan"
  ur: مجاہر بن زیاد قطنی
  es: "Al-Mujahir ibn Ziyad of Banu Qatan"
summary:
  ar: رجل من بني قطن أرسل مع نفر من بني عبد المدان إلى أبي محمد ليلقاهم بهمدان وثقيف والأحلاف فتحالفوا على النصرة.
  en: A man of Banu Qatan who sent, with some of Banu Abd al-Madan, to Abu Muhammad to meet them with Hamdan, Thaqif and al-Ahlaf, and they pledged mutual support.
  fr: "Un homme de Banu Qatan qui a envoyé, avec certains de Banu Abd al-Madan, à Abu Muhammad pour les rencontrer avec Hamdan, Thaqif et al-Ahlaf, et ils ont promis un soutien mutuel."
  ur: بنو قطن کا ایک شخص جس نے بنو عبد المدان کے کچھ لوگوں کے ساتھ ابو محمد کو پیغام بھیجا کہ ہمدان، ثقیف اور احلاف کے ساتھ ان سے ملیں، اور انہوں نے نصرت کا عہد کیا۔
  es: "Un hombre de Banu Qatan envió, junto con algunos de Banu Abd al-Madan, a Abu Muhammad para reunirse con ellos junto con Hamdan, Thaqif y al-Ahlaf, y se comprometieron a brindarse apoyo mutuo."
  tr: "Banu Qatn'dan bir adam, Banu Abd al-Madan'dan bir grupla birlikte Hamdan, Thaqif ve ittifaklarda buluşmak üzere Abu Muhammed'e gönderildi ve onlar da desteklemek için ittifak kurdular."
  id: "Seorang pria dari Banu Qatn dikirim bersama kelompok dari Banu Abd al-Madan ke Abu Muhammad untuk bertemu mereka di Hamdan, Thaqif, dan aliansi, dan mereka bersekutu untuk mendukungnya."
