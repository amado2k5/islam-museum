summary:
  ar: رجل من بني قطن أرسل مع نفر من بني عبد المدان إلى أبي محمد ليلقاهم بهمدان وثقيف والأحلاف فتحالفوا على النصرة.
  en: A man of Banu Qatan who sent, with some of Banu Abd al-Madan, to Abu Muhammad to meet them with Hamdan, Thaqif and al-Ahlaf, and they pledged mutual support.
  ur: بنو قطن کا ایک شخص جس نے بنو عبد المدان کے کچھ لوگوں کے ساتھ ابو محمد کو پیغام بھیجا کہ ہمدان، ثقیف اور احلاف کے ساتھ ان سے ملیں، اور انہوں نے نصرت کا عہد کیا۔
