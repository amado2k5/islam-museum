  ar: "\u0642\u0627\u0631\u0626 \u0642\u0631\u0622\u0646 \u0645\u0635\u0631\u064a (1934\u20132020) \u0628\u062f\u0623 \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0641\u064a \u0627\u0644\u0633\u0647\u0631\u0627\u062a \u0641\u064a \u0627\u0644\u062b\u0627\u0646\u064a\u0629 \u0639\u0634\u0631\u0629\u060c \u0648\u0642\u0631\u0623 \u0641\u064a \u0627\u0644\u0623\u0632\u0647\u0631 \u0648\u0641\u064a \u0627\u062d\u062a\u0641\u0627\u0644\u0627\u062a \u0627\u0644\u062f\u0648\u0644\u0629\u060c \u0648\u062d\u0643\u0651\u0645 \u0641\u064a \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0627\u062a \u0627\u0644\u062f\u0648\u0644\u064a\u0629\u060c \u0648\u0643\u0627\u0646 \u0646\u0642\u064a\u0628 \u0642\u0631\u0627\u0621 \u0645\u0635\u0631 \u0645\u0646 2011 \u062d\u062a\u0649 \u0648\u0641\u0627\u062a\u0647 \u0641\u064a 12 \u0631\u0645\u0636\u0627\u0646 1441\u0647\u0640."
  en: "Egyptian Qur'an reciter (1934\u20132020) who began reciting at evening gatherings at twelve, recited at al-Azhar and at state ceremonies, judged international competitions and headed the Egyptian Syndicate of Quran Reciters from 2011 until his death on 12 Ramadan 1441."
  ur: "\u0645\u0635\u0631\u06cc \u0642\u0627\u0631\u06cc\u0650 \u0642\u0631\u0622\u0646 \u2066(1934\u0621\u20132020\u0621)\u2069\u060c \u062c\u0646\u06be\u0648\u06ba \u0646\u06d2 \u0628\u0627\u0631\u06c1 \u0628\u0631\u0633 \u06a9\u06cc \u0639\u0645\u0631 \u0645\u06cc\u06ba \u0645\u062d\u0641\u0644\u0648\u06ba \u0645\u06cc\u06ba \u062a\u0644\u0627\u0648\u062a \u0634\u0631\u0648\u0639 \u06a9\u06cc\u060c \u0627\u0644\u0627\u0632\u06c1\u0631 \u0627\u0648\u0631 \u0633\u0631\u06a9\u0627\u0631\u06cc \u062a\u0642\u0631\u06cc\u0628\u0627\u062a \u0645\u06cc\u06ba \u067e\u0691\u06be\u0627\u060c \u0628\u06cc\u0646 \u0627\u0644\u0627\u0642\u0648\u0627\u0645\u06cc \u0645\u0642\u0627\u0628\u0644\u0648\u06ba \u06a9\u06d2 \u0645\u0646\u0635\u0641 \u0631\u06c1\u06d2 \u0627\u0648\u0631 2011\u0621 \u0633\u06d2 12 \u0631\u0645\u0636\u0627\u0646 1441\u06be \u06a9\u0648 \u0627\u067e\u0646\u06cc \u0648\u0641\u0627\u062a \u062a\u06a9 \u0645\u0635\u0631 \u06a9\u06cc \u0646\u0642\u0627\u0628\u062a\u0650 \u0642\u0631\u0627\u0621 \u06a9\u06d2 \u0633\u0631\u0628\u0631\u0627\u06c1 \u0631\u06c1\u06d2\u06d4"
