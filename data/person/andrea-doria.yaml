  ar: "زعيم الأسطول النصراني في البحر المتوسط في عهد شارل الخامس، في وصف الصلابي. أشاع بين الأسرى المسيحيين في الجزائر عزم الحكومة الإسبانية على الهجوم عليها وتخليصهم، ليشغل خير الدين بربروسة عن سفره إلى السلطان سليمان القانوني سنة ٩٤٠هـ/١٥٣٣م، وفرّ عند سماعه بمقدم خير الدين إلى بيروازن {cite:dawlat-uthmaniyya-salabi p. 216-217}."
