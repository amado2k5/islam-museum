summary:
  ar: "زعيم الأسطول النصراني في البحر المتوسط في عهد شارل الخامس، في وصف الصلابي. أشاع بين الأسرى المسيحيين في الجزائر عزم الحكومة الإسبانية على الهجوم عليها وتخليصهم، ليشغل خير الدين بربروسة عن سفره إلى السلطان سليمان القانوني سنة ٩٤٠هـ/١٥٣٣م، وفرّ عند سماعه بمقدم خير الدين إلى بيروازن {cite:dawlat-uthmaniyya-salabi p. 216-217}."
  en: "Andrea Doria — in al-Salabi's words, leader of the Christian fleet in the Mediterranean under Charles V; he spread word among the Spanish captives in Algiers of an imminent Spanish attack to keep Khayr al-Din from sailing to Sultan Süleyman in 940/1533, and withdrew when Khayr al-Din reached Preveza {cite:dawlat-uthmaniyya-salabi p. 216-217}."
  es: "Andrea Doria — en palabras de al-Salabi, líder de la flota cristiana en el Mediterráneo bajo el mando de Carlos V; difundió entre los cautivos españoles en Argel la noticia de un inminente ataque español para impedir que Khayr al-Din navegara hacia el sultán Süleyman en 940/1533, y se retiró cuando Khayr al-Din llegó a Preveza {cite:dawlat-uthmaniyya-salabi p. 216-217}."
  fr: "Andrea Doria — selon les mots d'al-Salabi, chef de la flotte chrétienne en Méditerranée sous Charles Quint; il répandit la nouvelle parmi les captifs espagnols à Alger d'une attaque espagnole imminente pour empêcher Khayr al-Din de naviguer vers le sultan Soliman en 940/1533, et se retira lorsque Khayr al-Din atteignit Preveza {cite:dawlat-uthmaniyya-salabi p. 216-217}."
  ur: "اینڈریا ڈوریا — السلابی کے الفاظ میں، چارلس پنجم کے تحت بحیرہ روم میں عیسائی بحری بیڑے کے رہنما؛ اس نے 940/1533 میں خیرالدین کو سلطان سلیمان کے پاس جانے سے روکنے کے لیے الجزائر میں ہسپانوی قیدیوں کے درمیان ہسپانوی حملے کی خبر پھیلائی، اور جب خیرالدین پریویزا پر پہنچا تو واپس چلا گیا۔ 216-217}۔"
  tr: "Al-Salabi tarafından tanımlanan, V. Charles döneminde Akdeniz'deki Hristiyan filosunun lideri. Cezayir'deki Hristiyan esirler arasında İspanyol hükümetinin onları saldırıp serbest bırakma niyetini yaydı; bu da Khair ad-Din Barbarossa'nın 940 Hicri Yılı/1533 yılında Sultan Süleyman'a gitmesini ve Hayrdin'in Beruazen'e gelişini duyunca dikkatini dağıttı {cite:dawlat-uthmaniyya-salabi s. 216-217}."
  id: "Pemimpin armada Kristen di Mediterania pada masa pemerintahan Charles V, digambarkan oleh Al-Salabi. Ia menyebarkan di antara tawanan Kristen di Aljazair niat pemerintah Spanyol untuk menyerang dan membebaskan mereka, yang mengalihkan perhatian Khair ad-Din Barbarossa dari perjalanan ke Sultan Suleiman yang Agung pada tahun 940 H/1533 M, dan setelah mendengar kedatangan Khair al-Din ke Beruazen {cite:dawlat-uthmaniyya-salabi hlm. 216-217}."
