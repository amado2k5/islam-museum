summary:
  ar: "أبو الفضائل سعد بن أبي المعالي شريف بن سيف الدولة الحمداني؛ تولى بعد أبيه؛ ولم يقف ابن خلكان على تاريخ وفاته؛ وبموته انقرض ملك بني سيف الدولة {cite:wafayat-ayan}."
  en: "Abu al-Fada'il Sa'd b. Sharif — last of Sayf al-Dawla's line at Aleppo; Ibn Khallikan found no death date for him, noting only 'with his death the rule of the Banu Sayf al-Dawla ended' {cite:wafayat-ayan}."
  fr: "Abu al-Fada'il Sa'd b. Sharif — dernier de la lignée de Sayf al-Dawla à Alep ; Ibn Khallikan ne trouva pour lui aucune date de mort, notant seulement « avec sa mort prit fin le pouvoir des Banu Sayf al-Dawla » {cite:wafayat-ayan}."
  es: "Abu al-Fada'il Sa'd b. Sharif — último de la línea de Sayf al-Dawla en Alepo; Ibn Khallikan no encontró fecha de muerte para él, señalando solo que \"con su muerte terminó el gobierno de los Banu Sayf al-Dawla\" {cite:wafayat-ayan}."
  ur: "ابو الفضل سعد بن شریف - حلب میں سیف الدولہ کی لائن کا آخری؛ ابن خلیقان نے ان کے لیے کوئی تاریخ وفات نہیں پائی، صرف یہ کہتے ہوئے کہ 'ان کی موت کے ساتھ ہی بنو سیف الدولہ کی حکومت ختم ہوگئی'۔"
  tr: "Ebu el-Fedâil Sa'd ibn Ebu el-Ma'ali Şerif ibn Sayf el-Davla el-Hamdani; babasının ardından yönetimi devraldı; İbn Hallikan onun ölüm tarihini bulamadı; ve onun ölümüyle Beni Sayf el-Davla'nın yönetimi sona erdi {kaynak: vefayat-ayan}."
  id: "Abu al-Fada’il Sa’d ibn Abi al-Ma’ali Sharif ibn Sayf al-Dawla al-Hamdani; ia mengambil alih setelah ayahnya; Ibn Khallikan tidak menemukan tanggal kematiannya; dan dengan kematiannya kekuasaan Banu Sayf al-Dawla berakhir {cite:wafayat-ayan}."
