summary:
  ar: "سليمان بن محمد بن عمر البجيرمي، فقيه شافعي من بُجيرم، قرية بغربية مصر، قدم القاهرة صغيراً وتعلم بالأزهر ودرّس، وكف بصره. له «التجريد» وهو شرح على «المنهج»، و«تحفة الحبيب» وهو حاشية على شرح الخطيب المسمى «الإقناع في حل ألفاظ أبي شجاع». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1615}"
  en: "Sulayman ibn Muhammad ibn Umar al-Bujayrimi, a Shafi'i jurist from Bujayram, a village in Gharbiyya in Egypt. He came to Cairo as a child, studied and taught at al-Azhar, and lost his sight. His works include al-Tajrid, a commentary on al-Minhaj, and Tuhfat al-habib, a gloss on al-Khatib's commentary Iqna' fi hall alfaz Abi Shuja'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1615}"
