summary:
  ar: "سلطان بروناي منذ سنة 1967 ورئيس وزرائها منذ الاستقلال سنة 1984. وُلد في مدينة بروناي سنة 1946 أكبر أبناء عمر علي سيف الدين الثالث، ونودي به سلطانا في الحادية والعشرين عقب تنحّي أبيه وتُوّج سنة 1968، وقاد بروناي إلى الاستقلال التام عن بريطانيا سنة 1984 تحت فلسفة «الملايو والإسلام والملكية»، وهو أطول ملوك العالم الحاليين حكما."
  en: "Sultan of Brunei since 1967 and its prime minister since independence in 1984. Born in Brunei Town in 1946, the eldest son of Omar Ali Saifuddien III, he was proclaimed sultan at twenty-one on his father's abdication and crowned in 1968, led Brunei to full independence from Britain on 1 January 1984 under the Melayu Islam Beraja philosophy, and is the world's longest-reigning current monarch."
  ur: "1967ء سے برونائی کے سلطان اور 1984ء میں آزادی کے بعد سے اس کے وزیرِ اعظم۔ 1946ء میں برونائی ٹاؤن میں عمر علی سیف الدین سوم کے بڑے بیٹے پیدا ہوئے، والد کی دستبرداری پر اکیس برس کی عمر میں سلطان قرار پائے اور 1968ء میں تاج پوشی ہوئی، یکم جنوری 1984ء کو برطانیہ سے مکمل آزادی کی قیادت کی اور وہ دنیا کے سب سے طویل عرصے تک حکمرانی کرنے والے موجودہ بادشاہ ہیں۔"
  es: "Sultán de Brunéi desde 1967 y primer ministro desde la independencia en 1984. Nacido en Brunéi Town en 1946, hijo mayor de Omar Ali Saifuddien III, fue proclamado sultán a los veintiún años tras la abdicación de su padre y coronado en 1968. Lideró a Brunéi hacia la plena independencia de Gran Bretaña el 1 de enero de 1984 bajo la filosofía Melayu Islam Beraja, y es el monarca reinante más largo del mundo."
  fr: "Sultan de Brunei depuis 1967 et son Premier ministre depuis l'indépendance en 1984. Né à Brunei Town en 1946, fils aîné d'Omar Ali Saifuddien III, il fut proclamé sultan à vingt et un ans lors de l'abdication de son père et couronné en 1968. Il mena Brunei à la pleine indépendance de la Grande-Bretagne le 1er janvier 1984 sous la philosophie Melayu Islam Beraja et est le monarque actuel au règne le plus long du monde."
  tr: "1967'den beri Brunei Sultanı ve 1984'teki bağımsızlığından beri Başbakanıdır. 1946'da Brunei'de doğdu, Umar Ali Saifuddin III'ün en büyük oğluydu ve babasının tahttan çekilmesinden sonraki yirmi birinci yılda Sultan olarak taç giydi. 1968'de taç giydi. Brunei'yi 1984'te 'Malay, İslam ve Monarşi' felsefesiyle Britanya'dan tam bağımsızlığa götürdü ve böylece dünyanın en uzun süre hüküm süren hükümdarı oldu."
  id: "Sultan Brunei sejak 1967 dan Perdana Menteri sejak kemerdekaan pada 1984. Ia lahir di Brunei pada 1946, putra sulung Umar Ali Saifuddin III, dan dinobatkan sebagai Sultan pada tahun kedua puluh satu setelah ayahnya turun tahta. Ia dinobatkan pada 1968. Ia memimpin Brunei menuju kemerdekaan penuh dari Inggris pada 1984 dengan filosofi 'Melayu, Islam, dan Monarki,' menjadikannya raja dengan masa pemerintahan terlama di dunia."
