summary:
  ar: "سلطان بروناي منذ سنة 1967 ورئيس وزرائها منذ الاستقلال سنة 1984. وُلد في مدينة بروناي سنة 1946 أكبر أبناء عمر علي سيف الدين الثالث، ونودي به سلطانا في الحادية والعشرين عقب تنحّي أبيه وتُوّج سنة 1968، وقاد بروناي إلى الاستقلال التام عن بريطانيا سنة 1984 تحت فلسفة «الملايو والإسلام والملكية»، وهو أطول ملوك العالم الحاليين حكما."
  en: "Sultan of Brunei since 1967 and its prime minister since independence in 1984. Born in Brunei Town in 1946, the eldest son of Omar Ali Saifuddien III, he was proclaimed sultan at twenty-one on his father's abdication and crowned in 1968, led Brunei to full independence from Britain on 1 January 1984 under the Melayu Islam Beraja philosophy, and is the world's longest-reigning current monarch."
  ur: "1967ء سے برونائی کے سلطان اور 1984ء میں آزادی کے بعد سے اس کے وزیرِ اعظم۔ 1946ء میں برونائی ٹاؤن میں عمر علی سیف الدین سوم کے بڑے بیٹے پیدا ہوئے، والد کی دستبرداری پر اکیس برس کی عمر میں سلطان قرار پائے اور 1968ء میں تاج پوشی ہوئی، یکم جنوری 1984ء کو برطانیہ سے مکمل آزادی کی قیادت کی اور وہ دنیا کے سب سے طویل عرصے تک حکمرانی کرنے والے موجودہ بادشاہ ہیں۔"
