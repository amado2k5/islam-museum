summary:
  ar: "رجل دين شيعي وسياسي دستوري من تبريز (1880–1920)، تأهل للاجتهاد وأمّ المصلين في مسجد المدينة الجامع، وجلس في المجلس الثاني، وأحيا حزب أذربيجان الديمقراطي، ورأس سنة 1920 حكومة «آزاديستان» قصيرة العمر احتجاجًا على الاتفاقية الإنجليزية الفارسية حتى قُتل عند سقوطها."
  en: "Shia cleric and constitutionalist politician of Tabriz (1880–1920) who qualified for ijtihad, led prayers at the city's Jameh mosque, sat in the Second Majles, revived the Democrat Party of Azerbaijan, and in 1920 headed the short-lived Azadistan government in protest against the Anglo-Persian Agreement, until he was killed as it fell."
  ur: "تبریز کے شیعہ عالم اور آئینی سیاست دان (1880–1920)؛ اجتہاد کی اہلیت حاصل کی، شہر کی جامع مسجد میں امامت کی، دوسری مجلس میں بیٹھے، آذربائیجان کی ڈیموکریٹ پارٹی کو زندہ کیا، اور 1920 میں اینگلو-فارسی معاہدے کے خلاف احتجاجاً «آزادیستان» کی قلیل مدتی حکومت کی سربراہی کی، یہاں تک کہ اس کے سقوط پر قتل ہوئے۔"
