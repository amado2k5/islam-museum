    note: "Recorded under the SHIA-MAPPING RULE, with the mapping stated. (1) The English Wikipedia lead attests it for him personally: he 'was an Iranian Shia cleric, political leader, and representative to the parliament'. (2) The Encyclopaedia Iranica (Bonakdarian) frames his formation wholly inside Twelver Shi'ism: he completed his religious studies 'at the seminary (see EDUCATION v. THE MADRASA IN SHIʿITE PERSIA)' under Mirza Abu'l-Hasan Angaji, 'qualified for ejtehad' under Sayyed Hosayn Khamena'i, prayer leader of Tabriz's Jameh mosque, himself led that mosque's noon prayers for nearly three years, and is counted among the city's clerics in the entry's contrast that 'many Shiʿi clerics in the city denounced the insurgency' while Khiabani supported it. The Persian article corroborates the curriculum — jurisprudence and its principles 'to near the level of ijtihad' — and his office as cleric of the Jameh mosque. MAPPING: 'Shia' is attested for him personally by the English article and by the Iranica entry's framing; the branch context is Twelver throughout — the Usuli seminary system in which ijtihad is the qualifying degree, and the Jameh-mosque imamate — so the value is recorded shia-twelver. Wikidata's single structured value (Shia Islam) is consistent and is not counted as a further attestation."
    sources: [source/wikipedia-mohammad-khiabani-en, source/iranica-khiabani, source/wikipedia-mohammad-khiabani-fa]
