summary:
  ar: جراح أعصاب باكستاني-أمريكي ⁦(1930–2008)⁩ ومخترع خزان أُميّة الذي يحمل اسمه.
    نال الطب من كلية الملك إدوارد الطبية 1953 ودرس في أكسفورد ⁦(بيليول)⁩ بمنحة رودس
    1956، وتدرّب في جراحة الأعصاب تحت جوزف بني باكر، وهاجر إلى الولايات المتحدة 1961
    وترأس جراحة الأعصاب في المعاهد الوطنية للصحة حتى 1980. اخترع عام 1963 أول خزان
    تحت الجلد يتيح حقن الأدوية في السائل الدماغي الشوكي بلا بزلات قطنية متكررة، وأرسى
    نظريته المركزية لإصابات الدماغ الرضية وأول مقياس غيبوبة، ودفع إلى إنشاء مركز CDC
    الوطني للوقاية من الإصابات، ونال ستارۀ امتياز من رئيس باكستان 1982 {cite:wikipedia-ayub-khan-ommaya-en}.
  en: Pakistani-American neurosurgeon ⁦(1930–2008)⁩ and inventor of the Ommaya reservoir
    that carries his name. He took his medical degree from King Edward Medical College
    in 1953, studied at Oxford ⁦(Balliol)⁩ as a 1956 Rhodes Scholar and trained in
    neurosurgery under Joseph Pennybacker; emigrating to the United States in 1961,
    he became Chief of Neurosurgery at the National Institutes of Health until 1980.
    In 1963 he invented the first subcutaneous reservoir allowing repeated intrathecal
    drug delivery without repeated lumbar punctures; he also founded the centripetal
    theory of traumatic brain injury and the first coma score, helped drive the creation
    of the CDC National Center for Injury Prevention and Control, and received Pakistan's
    Sitara-i-Imtiaz in 1982 {cite:wikipedia-ayub-khan-ommaya-en}.
  ur: پاکستانی نژاد امریکی نیورو سرجن ⁦(1930–2008)⁩ اور اپنے نام سے موسوم امایا ریزروائر
    کے موجد۔ کنگ ایڈورڈ میڈیکل کالج سے 1953 میں ایم بی بی ایس، روڈز سکالر کے طور پر
    آکسفورڈ ⁦(بیلیول)⁩ میں 1956 تک تعلیم، اور جوزف پینی بیکر کے تحت نیورو سرجری کی
    تربیت؛ 1961 میں امریکہ آئے اور 1980 تک قومی صحت اداروں میں نیورو سرجری کے سربراہ
    رہے۔ 1963 میں انہوں نے پہلا جلد کے نیچے کا ریزروائر ایجاد کیا جس سے ریڑھ کے سوراخوں
    کے بغیر بار بار اندرونی دوا دی جا سکے؛ دماغی چوٹ کا مرکزی نظریہ اور پہلا کوما
    اسکور بھی انھی کا ہے، CDC کے قومی زخم روک تھام مرکز کے قیام میں حصہ لیا، اور 1982
    میں پاکستان کا ستارۂ امتیاز پایا {cite:wikipedia-ayub-khan-ommaya-en}۔
  es: "Neurocirujano pakistaní-estadounidense (1930-2008) e inventor del reservorio Ommaya que lleva su nombre. Se licenció en medicina en el King Edward Medical College en 1953, estudió en Oxford (Balliol) como becario Rhodes en 1956 y se formó en neurocirugía con Joseph Pennybacker. Tras emigrar a Estados Unidos en 1961, fue jefe de neurocirugía en los Institutos Nacionales de la Salud hasta 1980. En 1963 inventó el primer reservorio subcutáneo que permitía la administración intratecal repetida de fármacos sin necesidad de punciones lumbares repetidas; también fundó la teoría centrípeta de la lesión cerebral traumática y la primera escala de coma, impulsó la creación del Centro Nacional para la Prevención y el Control de Lesiones de los CDC y recibió la condecoración Sitara-i-Imtiaz de Pakistán en 1982 {cite:wikipedia-ayub-khan-ommaya-en}."
  fr: "Neurochirurgien pakistano-américain (1930-2008) et inventeur du réservoir Ommaya qui porte son nom. Diplômé de médecine du King Edward Medical College en 1953, il étudia à Oxford (Balliol) en tant que boursier Rhodes en 1956 et se spécialisa en neurochirurgie auprès de Joseph Pennybacker. Émigré aux États-Unis en 1961, il devint chef du service de neurochirurgie des National Institutes of Health (NIH) jusqu'en 1980. En 1963, il inventa le premier réservoir sous-cutané permettant l'administration intrathécale répétée de médicaments sans ponctions lombaires répétées. Il est également à l'origine de la théorie centripète des traumatismes crâniens et du premier score de coma, contribua à la création du Centre national de prévention et de contrôle des traumatismes (NCIP) des CDC et reçut la Sitara-i-Imtiaz du Pakistan en 1982."
  tr: "Pakistan asıllı Amerikalı beyin cerrahı (1930–2008) ve adını taşıyan okuryazarlık tankının mucidi. 1953'te King Edward Tıp Fakültesi'nden tıp diplomasını aldı, 1956'da Oxford (Bellewell)'de Rhodes Bursu ile eğitim aldı, Joseph Beni Baker'ın yanında beyin cerrahisi eğitimi aldı, 1961'de Amerika Birleşik Devletleri'ne göç etti ve 1980'e kadar Ulusal Sağlık Enstitüleri'nde beyin cerrahisi bölümünün başkanlığını yaptı. 1963'te, tekrarlanan lomber ponksiyon olmadan beyin-omurilik sıvısına ilaç enjeksiyonu yapmayı sağlayan ilk deri altı rezervuarı icat etti, travmatik beyin yaralanmaları üzerine merkezi teorisini ve ilk koma ölçeğini oluşturdu, Ulusal CDC Yaralanma Önleme Merkezi'nin kurulmasını teşvik etti ve 1982'de Pakistan Cumhurbaşkanı'ndan Seçkin Madalya aldı {cite:wikipedia-ayub-khan-ommaya-en}."
  id: "Ahli bedah saraf Pakistan-Amerika (1930–2008) dan penemu tangki buta huruf yang dinamai atas namanya. Ia meraih gelar kedokteran dari King Edward Medical College pada tahun 1953, belajar di Oxford (Bellewell) dengan Beasiswa Rhodes pada tahun 1956, dilatih bedah saraf di bawah Joseph Beni Baker, bermigrasi ke Amerika Serikat pada tahun 1961, dan memimpin bedah saraf di National Institutes of Health hingga tahun 1980. Pada tahun 1963, ia menciptakan reservoir subkutan pertama yang memungkinkan injeksi obat ke cairan serebrospinal tanpa tusukan lumbal berulang, menetapkan teori utama cedera otak traumatis dan skala koma pertama, mempromosikan pendirian National CDC Center for Injury Prevention, dan menerima Medali Terhormat dari Presiden Pakistan pada tahun 1982 {cite:wikipedia-ayub-khan-ommaya-en}."
kids:
  ar: طبيب باكستاني اسمه أيوب خان أُميّة صنع عام 1963 خزانة صغيرة تُزرع تحت جلد الرأس،
    فيوصل الطبيب منها الدواء إلى الدماغ مباشرة دون إبر مؤلمة متكررة في الظهر — ومازال
    مرضى السرطان يُعالجون بها حتى اليوم.
  en: A Pakistani doctor named Ayub Khan Ommaya made, in 1963, a small reservoir planted
    under the scalp, so doctors can send medicine straight to the brain without painful
    repeated needles in the back — and cancer patients are still treated with it today.
  ur: ایوب خان امایا نامی پاکستانی ڈاکٹر نے 1963 میں سر کی کھال کے نیچے لگنے والا
    ایک چھوٹا ذخیرہ بنایا، جس سے ڈاکٹر کمر میں بار بار سوئیاں لگائے بغیر دوا سیدھا
    دماغ تک پہنچا سکتے ہیں — اور سرطان کے مریض آج بھی اسی سے علاج پاتے ہیں۔
