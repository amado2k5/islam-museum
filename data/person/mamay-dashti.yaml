  ar: ماماي صاحب الدست
  en: Mamay, master of the Dasht
summary:
  ar: "ماماي، أمير تتري تغلب على الدست القفجاق من ضواحيها وملك أعمال حاجي شركس في منج طرخان واستنزع جميع ما كان بأيدي المتغلبين ومحا أثرهم، ثم هلك فاستوسق الملك بصراي وأعمالها لطغطمش بن بردبيك."
  en: "Mamay, the Tatar amir who subdued the Qipchaq Dasht from its outskirts, held the districts of Haji Cherkes in Manj Tarkhan, stripped all the usurpers and effaced them — and on his death the throne of Saray and its domains settled for Toqtamish ibn Burdbik."
