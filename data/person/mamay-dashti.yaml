id: person/mamay-dashti
class: person
label:
  ar: ماماي صاحب الدست
  en: Mamay, master of the Dasht
  es: "Mamay, master of the Dasht"
  fr: "Mamay, master of the Dasht"
  ur: "مامے، دشت کا ماسٹر"
summary:
  ar: "ماماي، أمير تتري تغلب على الدست القفجاق من ضواحيها وملك أعمال حاجي شركس في منج طرخان واستنزع جميع ما كان بأيدي المتغلبين ومحا أثرهم، ثم هلك فاستوسق الملك بصراي وأعمالها لطغطمش بن بردبيك."
  en: "Mamay, the Tatar amir who subdued the Qipchaq Dasht from its outskirts, held the districts of Haji Cherkes in Manj Tarkhan, stripped all the usurpers and effaced them — and on his death the throne of Saray and its domains settled for Toqtamish ibn Burdbik."
  es: "Mamay, el emir tártaro que sometió a los Qipchaq Dasht desde sus alrededores, controló los distritos de Haji Cherkes en Manj Tarkhan, despojó a todos los usurpadores y los eliminó; y a su muerte, el trono de Saray y sus dominios pasaron a manos de Toqtamish ibn Burdbik."
  fr: "Mamay, l'émir tatar qui soumit les Qipchaq Dasht depuis leurs confins, contrôla les districts de Haji Cherkes à Manj Tarkhan, dépouilla tous les usurpateurs et les effaça — et à sa mort, le trône de Saray et ses domaines revinrent à Toqtamish ibn Burdbik."
  ur: "مامے، تاتاری امیر جس نے قیپچاق دشت کو اس کے مضافات سے زیر کیا، منج ترخان میں حاجی چرکیس کے اضلاع پر قبضہ کیا، تمام غاصبوں کو چھین لیا اور ان کو مٹا دیا - اور اس کی موت پر سرائے کا تخت اور اس کی سلطنتیں توقتمش ابن بردبیک کے لیے آباد ہوگئیں۔"
  tr: "Tatri prensi Mamai, Kipçak Tozu'nu çevresinden yenerek Manj Tarhan'daki Hacı Çerkeslerin işlerini yönetti, fatihlerin elindeki her şeyi çıkardı ve izlerini sildi. Sonra öldü ve Bosrai ile topraklarının kralı Tughtamish ibn Bardbek tarafından tahttan indirildi."
  id: "Mamai, seorang pangeran Tatri, mengalahkan Debu Kipchak dari pinggirannya dan memerintah urusan Haji Circassian di Manj Tarkhan, mengambil semua yang ada di tangan para penakluk dan menghapus jejak mereka. Kemudian ia binasa, dan raja Bosrai beserta wilayahnya digulingkan oleh Tughtamish ibn Bardbek."
