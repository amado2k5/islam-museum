summary:
  ar: "أبو علي بن بهاء الدولة الديلمي، خُطب له بعد أخيه سلطان الدولة سنة ٤١٢. استقبله الخليفة القادر سنة ٤١٤ استقبالًا قيل إنه لم يُفعل بملك قبله، ووقعت بينهما سنة ٤١٥ شدة أيمان مع كبار الدولة، وتزوج ابنة ملك الكاكوية بصداق خمسين ألف دينار. مات في ثمان بقين من ربيع الأول سنة ٤١٦ وله ثلاث وعشرون سنة وثلاثة أشهر وأربعة عشر يومًا، وملكه خمس سنين وشهر وخمسة وعشرون يومًا {cite:muntazam-ibn-al-jawzi j.8 p.363-366}."
