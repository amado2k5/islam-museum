label: { ar: "مشرف الدولة أبو علي بن بهاء الدولة", en: "Musharrif al-Dawla", es: "Musharrif al-Dawla", fr: "Musharrif al-Dawla", ur: "مشرف الدولہ" }
summary:
  ar: "أبو علي بن بهاء الدولة الديلمي، خُطب له بعد أخيه سلطان الدولة سنة ٤١٢. استقبله الخليفة القادر سنة ٤١٤ استقبالًا قيل إنه لم يُفعل بملك قبله، ووقعت بينهما سنة ٤١٥ شدة أيمان مع كبار الدولة، وتزوج ابنة ملك الكاكوية بصداق خمسين ألف دينار. مات في ثمان بقين من ربيع الأول سنة ٤١٦ وله ثلاث وعشرون سنة وثلاثة أشهر وأربعة عشر يومًا، وملكه خمس سنين وشهر وخمسة وعشرون يومًا {cite:muntazam-ibn-al-jawzi j.8 p.363-366}."
  tr: "Ebu Ali bin Baha al-Dawla el-Daylami, 412'de kardeşi Sultan al-Dawla'dan sonra ona evlenme teklif edildi. Halife el-Kadir onu 414 Hicri'de kabul etti, ancak onun öncesinde hiç hüküm sürmediği söylenir. 415'te devlet başkanlarıyla yemin ettiler ve el-Kakuya kralının kızını elli bin dinar çeyizle evlendirdi. 416 yılında, Rabi'al-Awwal'ın sekizinci yılında, yirmi üç yıl, üç ay ve on dört gün yaşında öldü ve hükümdarlığı beş yıl, bir ay yirmi beş gün sürdü {atıf:muntazam-ibn-al-jawzi J.8 s.363-366}."
  id: "Abu Ali ibn Baha al-Dawla al-Daylami diajukan kepadanya setelah saudaranya Sultan al-Dawla pada tahun 412. Khalifah al-Qadir menyambutnya pada tahun 414 H, tetapi dikatakan bahwa dia belum pernah memerintah sebelumnya. Pada tahun 415, mereka bersumpah dengan para kepala negara, dan dia menikahi putri raja al-Kakuya dengan mas kawin lima puluh ribu dinar. Dia meninggal pada tanggal kedelapan Rabi' al-Awwal tahun 416 pada usia dua puluh tiga tahun, tiga bulan, dan empat belas hari, dan masa pemerintahannya selama lima tahun, satu bulan, dan dua puluh lima hari {cite:muntazam-ibn-al-jawzi J.8 hlm.363-366}."
