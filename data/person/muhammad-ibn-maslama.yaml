summary:
  ar: صحابي من الأوس، أسلم قديماً على يدي مصعب بن عمير وآخى النبي بينه وبين أبي عبيدة؛ شهد المشاهد إلا تبوك، وكان ممن ذهب إلى قتل كعب بن الأشرف، وعُرف بأنه اعتزل الفتنة ولم يشهد الجمل ولا صفين. وبعثه عمر إلى الكوفة سنة إحدى وعشرين حين شكا أهلها سعداً فحرق عليه باب قصر الكوفة وعرضه في مساجدها يسأل عنه فعزله عمر {cite:muruj-al-dhahab p. 629}
  en: A Companion of the Aws who embraced Islam early at the hands of Mus'ab ibn Umayr and was paired by the Prophet with Abu Ubayda; he was in the campaigns except Tabuk, was among those who went to kill Ka'b ibn al-Ashraf, and is remembered
    for withdrawing from the civil strife, joining neither the Camel nor Siffin.
  ur: "اوس کے صحابی، جنہوں نے مصعب بن عمیر کی دعوت پر اسلام قبول کیا؛ مہمات میں شریک رہے اور بعد کے داخلی تصادم میں جمل اور صفین دونوں سے الگ رہے۔ {cite:ibn-hajar-isaba}"
