summary:
  ar: "الوليد بن أبي بكر بن مخلد بن أبي زياد، أبو العباس العمري، وعند البعض الغمري، من أهل الأندلس، من علماء المالكية، إمام راوية حافظ، كان ثقة أميناً كثير السماع والكتابة. سافر إلى الشام والعراق وخراسان وما وراء النهر، وعاد إلى بغداد، ولقي في رحلته ألف شيخ بين محدث وفقيه. من تصانيفه «الوجازة في صحة القول بالإجازة» و«تاريخ بغداد». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1647}"
  en: "Al-Walid ibn Abi Bakr ibn Mukhallad ibn Abi Ziyad, Abu al-Abbas al-Umari, also named al-Ghamri by some, from al-Andalus. A Maliki scholar, a reliable and retentive transmitter of hadith, who gathered and wrote much in his own land and abroad. He travelled to Syria, Iraq, Khurasan and Transoxiana, returned to Baghdad, and is said to have met a thousand teachers among hadith scholars and jurists. His works include al-Wijaza fi sihhat al-qawl bi-al-ijaza, on the validity of transmission by licence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1647}"
