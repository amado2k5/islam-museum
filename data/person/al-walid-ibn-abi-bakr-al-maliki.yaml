summary:
  ar: "الوليد بن أبي بكر بن مخلد بن أبي زياد، أبو العباس العمري، وعند البعض الغمري، من أهل الأندلس، من علماء المالكية، إمام راوية حافظ، كان ثقة أميناً كثير السماع والكتابة. سافر إلى الشام والعراق وخراسان وما وراء النهر، وعاد إلى بغداد، ولقي في رحلته ألف شيخ بين محدث وفقيه. من تصانيفه «الوجازة في صحة القول بالإجازة» و«تاريخ بغداد». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1647}"
  en: "Al-Walid ibn Abi Bakr ibn Mukhallad ibn Abi Ziyad, Abu al-Abbas al-Umari, also named al-Ghamri by some, from al-Andalus. A Maliki scholar, a reliable and retentive transmitter of hadith, who gathered and wrote much in his own land and abroad. He travelled to Syria, Iraq, Khurasan and Transoxiana, returned to Baghdad, and is said to have met a thousand teachers among hadith scholars and jurists. His works include al-Wijaza fi sihhat al-qawl bi-al-ijaza, on the validity of transmission by licence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1647}"
  fr: "Al-Walid ibn Abi Bakr ibn Mukhallad ibn Abi Ziyad, Abu al-Abbas al-Umari, également nommé al-Ghamri par certains, d'al-Andalus. Un érudit malikite, un transmetteur fiable et rétentif de hadiths, qui a rassemblé et écrit beaucoup dans son propre pays et à l'étranger. Il s’est rendu en Syrie, en Irak, au Khorassan et en Transoxiane, est retourné à Bagdad et aurait rencontré un millier d’enseignants parmi les savants et les juristes du hadith. Ses œuvres incluent al-Wijaza fi sihhat al-qawl bi-al-ijaza, sur la validité de la transmission par licence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1647}"
  es: "Al-Walid ibn Abi Bakr ibn Mukhallad ibn Abi Ziyad, Abu al-Abbas al-Umari, también llamado al-Ghamri por algunos, de al-Ándalus. Un erudito malikí, transmisor fiable y receptivo de hadices, que recopiló y escribió mucho en su tierra natal y en el extranjero. Viajó a Siria, Irak, Jorasán y Transoxiana, regresó a Bagdad y se dice que conoció a mil maestros entre los eruditos y juristas del hadiz. Entre sus obras se encuentra al-Wijaza fi sihhat al-qawl bi-al-ijaza, sobre la validez de la transmisión por licencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1647}"
