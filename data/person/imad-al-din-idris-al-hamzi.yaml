id: person/imad-al-din-idris-al-hamzi
class: person
label:
  ar: "عماد الدين إدريس بن علي الحمزي"
  en: "Imad al-Din Idris al-Hamzi"
  es: "Imad al-Din Idris al-Hamzi"
  fr: "Imad al-Din Idris al-Hamzi"
  ur: "عماد الدین ادریس الحمزی"
roles: [amir, historian]
gender: male
summary:
  ar: "إدريس بن علي بن عبد الله بن الحسن ابن حمزة، أبو موسى، عماد الدين، من أشراف اليمن وأمرائها ومن أهل صنعاء، فارس أديب عالم بالتاريخ، ولي إمارة القحمة سنة 699 هـ، واختصر تاريخ ابن الأثير وأضاف إليه أخبار العراق ومصر والشام واليمن، ورشح لإمامة الزيدية، توفي سنة 714 هـ."
  en: "Idris ibn Ali ibn Abdallah ibn al-Hasan ibn Hamza, Abu Musa, Imad al-Din, one of the sharifs and amirs of Yemen, from Sanaa; a horseman and man of letters learned in history; governor of the emirate of al-Qahma in 699 AH; abridged Ibn al-Athir's history and added the reports of Iraq, Egypt, Syria and Yemen; put forward for the Zaydi imamate; died 714 AH (1314)."
  es: "Idris ibn Ali ibn Abdallah ibn al-Hasan ibn Hamza, Abu Musa, Imad al-Din, uno de los sharifs y emires de Yemen, de Sanaa; jinete y hombre de letras versado en historia; gobernador del emirato de al-Qahma en 699 AH; abrevió la historia de Ibn al-Athir y añadió los informes de Irak, Egipto, Siria y Yemen; propuesto para el imamato zaidí; murió en 714 AH (1314)."
  fr: "Idris ibn Ali ibn Abdallah ibn al-Hasan ibn Hamza, Abu Musa, Imad al-Din, l'un des chérifs et émirs du Yémen, de Sanaa; cavalier et homme de lettres versé dans l'histoire; gouverneur de l'émirat d'al-Qahma en 699 AH; abrégé l'histoire d'Ibn al-Athir et ajouté les rapports d'Irak, d'Égypte, de Syrie et du Yémen; proposé pour l'imamat zaydite; mort en 714 AH (1314)."
  ur: "ادریس بن علی ابن عبداللہ ابن الحسن بن حمزہ، ابو موسیٰ، عماد الدین، یمن کے شریفوں اور امیروں میں سے ایک، صنعا سے؛ ایک گھڑ سوار اور تاریخ میں سیکھا خطوط کا آدمی 699 ہجری میں امارت القہمہ کا گورنر؛ ابن الاثیر کی تاریخ کا خلاصہ کیا اور عراق، مصر، شام اور یمن کی رپورٹیں شامل کیں۔ زیدی امامت کے لیے پیش کرنا؛ وفات 714ھ (1314)۔"
  tr: "İdris ibn Ali ibn Abdullah ibn al-Hasan ibn Hamza, Ebu Musa, İmam el-Din, Yemen'in ve Sana'a halkının soylularından ve prenslerinden biriydi. Bir şövalye ve tarih bilginiydi, 699 Hicri yılında el-Kahme valisi olarak atandı. İbn el-Azir'in tarihini özetleyerek Irak, Mısır, Şam ve Yemen hakkında haberler ekledi. Zeydi İmamı olarak aday gösterildi. 714 Hicri'de öldü."
  id: "Idris ibn Ali ibn Abdullah ibn al-Hasan ibn Hamza, Abu Musa, Imad al-Din, adalah salah satu bangsawan dan pangeran Yaman serta dari masyarakat Sana'a. Ia adalah seorang ksatria dan cendekiawan sejarah, diangkat sebagai gubernur al-Qahmah pada tahun 699 H. Ia merangkum sejarah Ibn al-Athir, menambahkan berita tentang Irak, Mesir, Levant, dan Yaman. Ia dinominasikan sebagai Imamat Zaydi. Ia wafat pada tahun 714 H."
