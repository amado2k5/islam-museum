summary:
  ar: "صحابي، هو في رواية مسلم الثانية عن جابر بن عبد الله السائلُ الذي قال: «يا رسول الله أرأيت إذا صليت المكتوبة وحرمت الحرام وأحللت الحلال ولم أزد على ذلك شيئاً أأدخل الجنة؟» فأجابه النبي بنعم، وهو الحديث الثاني والعشرون من الأربعين النووية."
  en: "A Companion who, in Muslim's second route from Jabir ibn Abdullah, is the named questioner — 'O Messenger of God, if I pray the prescribed prayer, treat the unlawful as unlawful and the lawful as lawful, and add nothing to that, shall I enter Paradise?' — answered 'yes'; the twenty-second hadith of al-Nawawi's Forty."
