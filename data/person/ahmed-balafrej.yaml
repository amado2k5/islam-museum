summary:
  ar: "سياسي ودبلوماسي مغربي (1908–1990)، وُلد بالرباط في أسرة من أصل أندلسي، وكان من مؤسسي الحركة الوطنية: شارك في كتلة العمل الوطني سنة 1934 وفي تأسيس حزب الاستقلال الذي كان أمينه العام (1944–1960)، ونُفي إلى كورسيكا سنة 1944 ودافع عن قضية استقلال المغرب أمام الجمعية العامة للأمم المتحدة سنة 1953. بعد الاستقلال تولى وزارة الخارجية (1956–1958)، ثم رئاسة الحكومة مع وزارة الخارجية (مايو–ديسمبر 1958)، ثم كان الممثل الشخصي للحسن الثاني ووزير الخارجية (1963)."
  en: "Moroccan politician and diplomat (1908–1990), born at Rabat to a family of Andalusian origin. A founder of the national movement, he took part in the Moroccan Action Committee of 1934 and in founding the Istiqlal Party, whose secretary-general he was (1944–1960); exiled to Corsica in 1944, he pleaded Morocco's independence before the United Nations General Assembly in 1953. After independence he was foreign minister (1956–1958), then prime minister while keeping the foreign ministry (May–December 1958), and in 1963 personal representative of Hassan II and foreign minister again."
  ur: "مغربی سیاست دان اور سفارت کار (1908–1990)، الرباط میں اندلسی الاصل خاندان میں پیدا ہوئے۔ قومی تحریک کے بانیوں میں سے تھے: 1934ء میں کتلہ عملِ وطنی اور حزبِ استقلال کے قیام میں شریک ہوئے جس کے وہ 1944ء سے 1960ء تک سیکرٹری جنرل رہے؛ 1944ء میں کورسیکا جلاوطن ہوئے اور 1953ء میں اقوامِ متحدہ کی جنرل اسمبلی میں مغرب کی آزادی کا مقدمہ پیش کیا۔ آزادی کے بعد وزیرِ خارجہ (1956–1958ء)، پھر وزیرِ اعظم و وزیرِ خارجہ (مئی تا دسمبر 1958ء)، اور 1963ء میں حسن ثانی کے ذاتی نمائندے اور دوبارہ وزیرِ خارجہ رہے۔"
