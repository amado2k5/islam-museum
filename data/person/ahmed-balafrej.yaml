summary:
  ar: "سياسي ودبلوماسي مغربي (1908–1990)، وُلد بالرباط في أسرة من أصل أندلسي، وكان من مؤسسي الحركة الوطنية: شارك في كتلة العمل الوطني سنة 1934 وفي تأسيس حزب الاستقلال الذي كان أمينه العام (1944–1960)، ونُفي إلى كورسيكا سنة 1944 ودافع عن قضية استقلال المغرب أمام الجمعية العامة للأمم المتحدة سنة 1953. بعد الاستقلال تولى وزارة الخارجية (1956–1958)، ثم رئاسة الحكومة مع وزارة الخارجية ⁦(مايو–ديسمبر 1958)⁩، ثم كان الممثل الشخصي للحسن الثاني ووزير الخارجية (1963)."
  en: "Moroccan politician and diplomat (1908–1990), born at Rabat to a family of Andalusian origin. A founder of the national movement, he took part in the Moroccan Action Committee of 1934 and in founding the Istiqlal Party, whose secretary-general he was (1944–1960); exiled to Corsica in 1944, he pleaded Morocco's independence before the United Nations General Assembly in 1953. After independence he was foreign minister (1956–1958), then prime minister while keeping the foreign ministry (May–December 1958), and in 1963 personal representative of Hassan II and foreign minister again."
  ur: "مغربی سیاست دان اور سفارت کار (1908–1990)، الرباط میں اندلسی الاصل خاندان میں پیدا ہوئے۔ قومی تحریک کے بانیوں میں سے تھے: 1934ء میں کتلہ عملِ وطنی اور حزبِ استقلال کے قیام میں شریک ہوئے جس کے وہ 1944ء سے 1960ء تک سیکرٹری جنرل رہے؛ 1944ء میں کورسیکا جلاوطن ہوئے اور 1953ء میں اقوامِ متحدہ کی جنرل اسمبلی میں مغرب کی آزادی کا مقدمہ پیش کیا۔ آزادی کے بعد وزیرِ خارجہ ⁦(1956–1958ء)⁩، پھر وزیرِ اعظم و وزیرِ خارجہ ⁦(مئی تا دسمبر 1958ء)⁩، اور 1963ء میں حسن ثانی کے ذاتی نمائندے اور دوبارہ وزیرِ خارجہ رہے۔"
  es: "Político y diplomático marroquí (1908-1990), nacido en Rabat en el seno de una familia de origen andaluz. Fundador del movimiento nacional, participó en el Comité de Acción Marroquí de 1934 y en la fundación del Partido Istiqlal, del que fue secretario general (1944-1960). Exiliado a Córcega en 1944, abogó por la independencia de Marruecos ante la Asamblea General de las Naciones Unidas en 1953. Tras la independencia, fue ministro de Asuntos Exteriores (1956-1958), luego primer ministro, manteniendo la cartera de Asuntos Exteriores (mayo-diciembre de 1958), y en 1963 fue nuevamente representante personal de Hassan II y ministro de Asuntos Exteriores."
  fr: "Homme politique et diplomate marocain (1908-1990), né à Rabat dans une famille d'origine andalouse. Fondateur du mouvement national, il participa au Comité d'action marocain de 1934 et à la fondation du parti Istiqlal, dont il fut secrétaire général (1944-1960). Exilé en Corse en 1944, il plaida pour l'indépendance du Maroc devant l'Assemblée générale des Nations Unies en 1953. Après l'indépendance, il fut ministre des Affaires étrangères (1956-1958), puis Premier ministre tout en conservant ce ministère (mai-décembre 1958), et enfin, en 1963, représentant personnel d'Hassan II et de nouveau ministre des Affaires étrangères."
  tr: "Endülüs kökenli bir ailenin çocuğu olarak Rabat'ta doğan Faslı bir siyasetçi ve diplomat (1908–1990), ulusal hareketin kurucularından biriydi: 1934'te Ulusal Eylem Bloğu'na katıldı ve İstiklal Partisi'nin kuruluşunda yer aldı, 1944–1960 yılları arasında Genel Sekreterliğini yaptı. 1944'te Korsika'ya sürgün edildi ve 1953'te Birleşmiş Milletler Genel Kurulu önünde Fas bağımsızlığı davasını savundu. Bağımsızlığın ardından Dışişleri Bakanlığı'nı (1956–1958), ardından Dışişleri Bakanlığı ile birlikte Başbakanlığı (Mayıs–Aralık 1958) üstlendi, daha sonra II. Hasan'ın kişisel temsilcisi ve Dışişleri Bakanı oldu (1963)."
  id: "Seorang politikus dan diplomat Maroko (1908–1990), lahir di Rabat dari keluarga keturunan Andalusia, ia adalah salah satu pendiri gerakan nasional: ia berpartisipasi dalam Blok Aksi Nasional pada tahun 1934 dan dalam pendirian Partai Istiqlal, di mana ia menjabat sebagai Sekretaris Jenderal (1944–1960). Ia diasingkan ke Korsika pada tahun 1944 dan membela perjuangan kemerdekaan Maroko di hadapan Majelis Umum Perserikatan Bangsa-Bangsa pada tahun 1953. Setelah kemerdekaan, ia menjabat sebagai Menteri Luar Negeri (1956–1958), kemudian Perdana Menteri dengan Kementerian Luar Negeri (Mei–Desember 1958), lalu ia menjadi perwakilan pribadi Hassan II dan Menteri Luar Negeri (1963)."
