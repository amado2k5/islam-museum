summary:
  ar: "محمد بن عمر بن محمد، أبو عبد الله، محب الدين ابن رشيد الفهري السبتي، رحالة عالم بالأدب عارف بالتفسير والتاريخ، ولد بسبتة وولي الخطابة بجامع غرناطة الأعظم ومات بفاس، ورحل إلى مصر والشام والحرمين سنة 683 هـ وصنف رحلته «ملء العيبة»، 657 إلى 721 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 314}."
  en: "Muhammad ibn Umar ibn Muhammad, Abu Abd Allah, Muhibb al-Din Ibn Rushayd al-Fihri al-Sabti, a traveller and scholar of literature, exegesis and history; born in Ceuta, preacher at the great mosque of Granada, he died in Fez, and wrote the account of his journey of 683 AH to Egypt, the Levant and the two sanctuaries, Mil' al-Aybah, 657 to 721 AH (1259 to 1321 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 314}."
  es: "Muhammad ibn Umar ibn Muhammad, Abu Abd Allah, Muhibb al-Din Ibn Rushayd al-Fihri al-Sabti, viajero y erudito de literatura, exégesis e historia; nacido en Ceuta, predicador en la gran mezquita de Granada, murió en Fez y escribió el relato de su viaje del año 683 AH a Egipto, el Levante y los dos santuarios, Mil' al-Aybah, 657 a 721 AH (1259 a 1321 d. C.) {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 314}."
  fr: "Muhammad ibn Umar ibn Muhammad, Abu Abd Allah, Muhibb al-Din Ibn Rushayd al-Fihri al-Sabti, voyageur et érudit en littérature, exégèse et histoire; né à Ceuta, prédicateur à la grande mosquée de Grenade, il mourut à Fès et écrivit le récit de son voyage de 683 AH en Égypte, au Levant et aux deux sanctuaires, Mil' al-Aybah, de 657 à 721 AH (1259 à 1321 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 314}."
  ur: "محمد بن عمر بن محمد، ابو عبد اللہ، محب الدین ابن رشید الفہری السبطی، ایک مسافر اور ادب، تفسیر اور تاریخ کے عالم؛ سیوٹا میں پیدا ہوئے، غرناطہ کی عظیم مسجد میں مبلغ، اس کی وفات فیز میں ہوئی، اور اس نے 683 ہجری کے مصر، لیونٹ اور دو مقدس مقامات، میل العیبہ، 657 تا 721 ہجری ⁦(1259 تا 1321 عیسوی)⁩ کے سفر کا احوال لکھا۔ 6ص۔ 314}۔"
