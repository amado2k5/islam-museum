  fr: "Fiche de conscription de Siraj ud-Daulah, le dernier Nawab indépendant du Bengale vaincu à Plassey, nommé d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "پلاسی میں شکست کھانے والے بنگال کے آخری آزاد نواب سراج الدولہ کے لیے ڈرافٹ کارڈ، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا ہے۔ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
