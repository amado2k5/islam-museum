  ar: "بطاقة أولية لسراج الدولة، آخر نواب البنغال المستقلين الذي هُزم في بلاسي، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
