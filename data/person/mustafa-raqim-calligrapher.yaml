summary:
  ar: "خطاط عثماني (1757–1826) اشتهر بالأقلام الجليلة وطبّق أصول حافظ عثمان في الثلث على الثلث الجلي، فصمّم لوحات (levha) متوازنة ونقوشًا أثرية {cite:blair-islamic-calligraphy-2006 p. 541}."
  en: "Ottoman calligrapher (1757–1826), renowned for large scripts, who applied Hafiz Osman's principles for thuluth to thuluth jali and designed balanced panels (levha) and monumental inscriptions {cite:blair-islamic-calligraphy-2006 p. 541}."
  ur: "عثمانی خطاط (1757–1826) جو جلی قلموں میں مشہور تھے اور جنہوں نے ثلث کے لیے حافظ عثمان کے اصولوں کو ثلث جلی پر لاگو کیا، متوازن الواح (levha) اور یادگار کتبے بنائے {cite:blair-islamic-calligraphy-2006 p. 541}۔"
