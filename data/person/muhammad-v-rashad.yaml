summary:
  ar: "السلطان محمد رشاد (محمد الخامس)، تولى السلطنة والخلافة بعد خلع أخيه السلطان عبد الحميد الثاني، لكنه في الحقيقة لم يملك أي سلطة فعلية إذ صارت السلطة بيد جمعية الاتحاد والترقي، فغدت الحكومة العثمانية تركية في مضمونها قومية في عصبيتها بعد أن كانت عثمانية المضمون إسلامية الرابطة، واتبعت الجمعية سياسة التتريك متأثرة بالأفكار القومية الطورانية فجعلت التركية اللغة الرسمية الوحيدة، فتأججت في المقابل حركة الدعوة إلى القومية العربية {cite:dawlat-uthmaniyya-salabi p. 465}."
  en: "Mehmed V Reshad — sultan and caliph after Abdülhamid's deposition but a figurehead as real power passed to the Committee of Union and Progress, whose Turkification policies kindled the countervailing Arab nationalist movement {cite:dawlat-uthmaniyya-salabi p. 465}."
