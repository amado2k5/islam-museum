summary:
  ar: السلطان محمد رشاد ⁦(محمد الخامس)⁩، تولى السلطنة والخلافة بعد خلع أخيه السلطان عبد الحميد الثاني، لكنه في الحقيقة لم
    يملك أي سلطة فعلية إذ صارت السلطة بيد جمعية الاتحاد والترقي، فغدت الحكومة العثمانية تركية في مضمونها قومية في عصبيتها
    بعد أن كانت عثمانية المضمون إسلامية الرابطة، واتبعت الجمعية سياسة التتريك متأثرة بالأفكار القومية الطورانية فجعلت التركية
    اللغة الرسمية الوحيدة، فتأججت في المقابل حركة الدعوة إلى القومية العربية {cite:dawlat-uthmaniyya-salabi p. 465}.
  en: Mehmed V Reshad — sultan and caliph after Abdülhamid's deposition but a figurehead as real power passed to the Committee
    of Union and Progress, whose Turkification policies kindled the countervailing Arab nationalist movement {cite:dawlat-uthmaniyya-salabi
    p. 465}.
  es: "Mehmed V Reshad — sultán y califa después de la deposición de Abdülhamid pero una figura decorativa ya que el poder real pasó al Comité de Unión y Progreso, cuyas políticas de turquización encendieron el movimiento nacionalista árabe contrapuesto {cite:dawlat-uthmaniyya-salabi p. 465}."
  fr: "Mehmed V Reshad — sultan et calife après la déposition d'Abdülhamid, mais une figure de proue car le véritable pouvoir est passé au Comité Union et Progrès, dont les politiques de turquification ont attisé le mouvement nationaliste arabe d'opposition {cite:dawlat-uthmaniyya-salabi p. 465}."
  ur: "محمد وی رشاد - عبد الحمید کی معزولی کے بعد سلطان اور خلیفہ لیکن حقیقی طاقت کے طور پر ایک شخصیت کمیٹی آف یونین اینڈ پروگریس کو منتقل ہوئی، جس کی ترک کرنے کی پالیسیوں نے مخالف عرب قوم پرست تحریک کو بھڑکایا۔ 465}۔"
  tr: "Sultan Mehmed Rashid (Mehmed V), kardeşi Sultan II. Abdülhamid'i tahttan indirdikten sonra sultanlığı ve halifeliği devraldı, ancak gerçekte gerçek bir otoritesi yoktu çünkü güç Birlik ve İlerleme Derneği'nin elindeydi. Böylece Osmanlı hükümeti, özünde aşiret bağlılığı bakımından Türk milliyetçisi oldu; oysa daha önce özünde Osmanlı, Birlik'te ise İslami idi. Dernek, Turan milliyetçi fikirlerinden etkilenerek Türkçeyi tek resmi dil haline getirerek Türkçeyi tek resmi dil haline getirdi ve bu da Arap milliyetçiliği çağrısı hareketini ateşledi {cite:dawlat-uthmaniyya-salabi, s. 465}."
  id: "Sultan Mehmed Rashid (Mehmed V) mengambil alih kesultanan dan kekhalifahan setelah menggulingkan saudaranya Sultan Abdul Hamid II, namun kenyataannya ia tidak memegang otoritas nyata, karena kekuasaan berada di tangan Union and Progress Association. Dengan demikian, pemerintah Ottoman pada dasarnya menjadi nasionalis Turki dalam afiliasi sukunya, sedangkan sebelumnya pada dasarnya adalah Ottoman dan Islam dalam Liga. Asosiasi ini mengadopsi kebijakan Turkifikasi, dipengaruhi oleh gagasan nasionalis Turan, menjadikan bahasa Turki sebagai satu-satunya bahasa resmi, yang pada gilirannya memicu gerakan yang menyerukan nasionalisme Arab {cite:dawlat-uthmaniyya-salabi, hlm. 465}."
