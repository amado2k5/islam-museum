id: person/dhu-al-nun-al-misri
class: person
label: { ar: "ذو النون المصري" }
summary:
  ar: "أول من تكلم بمصر في ترتيب الأحوال ومقامات أهل الولاية، فأنكر عليه عبد الله بن عبد الحكم رئيس مصر وأحدث علماً لم يتكلم فيه السلف ورماه بالزندقة فأحضر إلى المتوكل فلما سمع كلامه ولع به وأحبه وأكرمه حتى كان يقول إذا ذكر الصالحون فحيهلا بذي النون {cite:tarikh-khulafa-minhaj-1434 p. 543}. وعند ابن النديم هو أبو الفيض ذو النون بن إبراهيم وكان متصوفا وله أثر في الصنعة وكتب مصنفة فمن كتبه كتاب الركن الأكبر وكتاب الثقة في الصنعة {cite:fihrist-ibn-al-nadim p. 503-504}"
  en: "The first in Egypt to discourse on the ordering of states and the stations of God's friends; Abd Allah ibn Abd al-Hakim, Egypt's Maliki chief, charged him with an unheard-of science and zandaqa — brought on the barid to al-Mutawakkil he won him over: 'when the righteous are mentioned, how is Dhu'l-Nun!' {cite:tarikh-khulafa-minhaj-1434 p. 543}."
  es: "El primero en Egipto en disertar sobre el ordenamiento de los estados y las posiciones de los amigos de Dios; Abd Allah ibn Abd al-Hakim, jefe malikí de Egipto, le encomendó una ciencia y zandaqa inauditas; llevó al barid a al-Mutawakkil y lo convenció: 'cuando se menciona a los justos, ¡cómo es Dhu'l-Nun!' {cite:tarikh-khulafa-minhaj-1434 p. 543}."
  fr: "Le premier en Égypte à parler de l'ordonnancement des États et des stations des amis de Dieu; Abd Allah ibn Abd al-Hakim, chef malikite d'Égypte, l'accusa d'une science et d'une zandaqa inouïes — il apporta sur le barid à al-Mutawakkil, il le convainquit: « quand les justes sont mentionnés, comment est Dhu'l-Nun ! » {cite: tarikh-khulafa-minhaj-1434 p. 543}."
  ur: "مصر میں سب سے پہلے جس نے ریاستوں اور خدا کے دوستوں کے مقامات کی ترتیب پر گفتگو کی۔ عبد اللہ بن عبد الحکیم، مصر کے مالکی سردار نے اس پر ایک غیر سنی علم اور زندقہ کا الزام لگایا - المتوکل کو بارد پر لایا اور اس نے اسے جیت لیا: 'جب صالحین کا ذکر ہوتا ہے تو ذوالنون کیسا ہوتا ہے!' {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 543}۔"
  tr: "Mısır'da eyalet halkının koşullarının ve rütbelerinin düzenlenmesi hakkında ilk konuşan oydu. Mısır hükümdarı Abdullah ibn Abdülhakam onu eleştirdi ve seleflerinin bahsetmediği bir bilimi getirerek sapkınlıkla suçladı. El-Mutawakkil'e getirildi ve sözlerini duyduğunda onlara bağlandı, onu sevdi ve onurlandırdı; öyle ki şöyle derdi: Doğrular anıldığında, Dhu al-Nunu'yu selamlarlar. {atıf: Tarih-Khulafa-minhaj-1434, s. 543}. İbn al-Nadim'e göre, o, zanaatkârlıkta miras bırakmış bir Sufi olan ve eserler yazmış Ebu al-Fayd Dhu al-Nun ibn İbrahim'dir. Eserleri arasında Kitab al-Rukn al-Akbar ve Kitab al-Thiqa fi al-San'ah bulunmaktadır {atıf:fihrist-ibn-al-nadim s. 503-504}"
  id: "Ia adalah orang pertama yang berbicara di Mesir mengenai pengaturan kondisi dan pangkat rakyat provinsi tersebut. Abdullah ibn Abd al-Hakam, penguasa Mesir, mengkritiknya dan memperkenalkan ilmu yang tidak dibicarakan oleh para pendahulu, menuduhnya melakukan ajaran sesat. Ia dibawa ke Al-Mutawakkil, dan ketika mendengar kata-katanya, ia menjadi menyayangi, mencintainya, dan menghormatinya, hingga ia biasa berkata: Ketika orang benar disebutkan, mereka menyapa Dhu al-Nun {cite:Sejarah-Khulafa-minhaj-1434, hlm. 543}. Menurut Ibn al-Nadim, ia adalah Abu al-Fayd Dhu al-Nun ibn Ibrahim, yang merupakan seorang Sufi dengan warisan dalam kerajinan tangan dan karya-karya. Di antara karyanya adalah Kitab al-Rukn al-Akbar dan Kitab al-Thiqa fi al-San'ah {cite:fihrist-ibn-al-nadim hlm. 503-504}"
