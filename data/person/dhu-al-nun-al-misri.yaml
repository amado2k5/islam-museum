id: person/dhu-al-nun-al-misri
class: person
label: { ar: "ذو النون المصري" }
summary:
  ar: "أول من تكلم بمصر في ترتيب الأحوال ومقامات أهل الولاية، فأنكر عليه عبد الله بن عبد الحكم رئيس مصر وأحدث علماً لم يتكلم فيه السلف ورماه بالزندقة فأحضر إلى المتوكل فلما سمع كلامه ولع به وأحبه وأكرمه حتى كان يقول إذا ذكر الصالحون فحيهلا بذي النون {cite:tarikh-khulafa-minhaj-1434 p. 543}. وعند ابن النديم هو أبو الفيض ذو النون بن إبراهيم وكان متصوفا وله أثر في الصنعة وكتب مصنفة فمن كتبه كتاب الركن الأكبر وكتاب الثقة في الصنعة {cite:fihrist-ibn-al-nadim p. 503-504}"
  en: "The first in Egypt to discourse on the ordering of states and the stations of God's friends; Abd Allah ibn Abd al-Hakim, Egypt's Maliki chief, charged him with an unheard-of science and zandaqa — brought on the barid to al-Mutawakkil he won him over: 'when the righteous are mentioned, how is Dhu'l-Nun!' {cite:tarikh-khulafa-minhaj-1434 p. 543}."
