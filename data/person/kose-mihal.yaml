summary:
  ar: "بطاقة أولية لكوسه ميخال، الحاكم البيزنطي لخيرمنكيا الذي دخل الإسلام وصار من صحابة عثمان غازي في غزواته الأولى، توفي سنة ١٣٤٠م تقريباً؛ تذكره كتب التاريخ العثماني ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Kose Mihal, the Byzantine governor of Chirmenkia who embraced Islam and became a companion of Osman Gazi in the early campaigns, d. about 1340; the source entry is not yet checked on the page."
  es: "Ficha de reclutamiento para Kose Mihal, el gobernador bizantino de Chirmenkia que abrazó el Islam y se convirtió en compañero de Osman Gazi en las primeras campañas, fallecido alrededor de 1340; la entrada de la fuente aún no ha sido verificada en la página."
  fr: "Fiche de convocation de Kose Mihal, gouverneur byzantin de Chirmenkia qui embrassa l'islam et devint un compagnon d'Osman Gazi lors des premières campagnes, mort vers 1340; la source n'est pas encore vérifiée sur la page."
  ur: "چیرمینکیا کے بازنطینی گورنر کوس میہل کے لیے ڈرافٹ کارڈ جس نے اسلام قبول کیا اور ابتدائی مہمات میں عثمان غازی کے ساتھی بنے۔ تقریباً 1340; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Kırmanki'nin Bizans valisi Kosa Mihal'in ilk kartı, İslam'a geçen ve Osman Gazi'nin ilk baskınlarında yoldaşlarından biri olmuş, yaklaşık 1340 yılında ölmüştür; Osmanlı tarih kitaplarında ondan bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Kosa Mikhal, gubernur Bizantium Khirmankia, yang memeluk Islam dan menjadi salah satu teman Osman Ghazi selama serangan pertamanya, meninggal sekitar tahun 1340 M; Buku sejarah Ottoman menyebutkannya dan biografinya belum pernah diulas di halaman."
