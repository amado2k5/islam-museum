summary:
  ar: أبو جعفر الفيض بن أبي صالح شيرويه الفارسي، وزير الخليفة العباسي المهدي في أواخر دولته؛ أسلم وكان نصرانياً، واشتهر بكرمه، ثم تولى ديوان الجيش بعد وفاة المهدي إلى أن توفي سنة ١٧٣هـ كما في سير أعلام النبلاء.
  en: Abu Ja'far al-Fayd ibn Abi Salih Shirawayh al-Farisi, vizier of the Abbasid caliph al-Mahdi in the last years of his reign; a convert from Christianity, famed for his generosity, he held the army bureau after al-Mahdi's death until he died in 173 AH, according to al-Dhahabi's Siyar A'lam al-Nubala'.
