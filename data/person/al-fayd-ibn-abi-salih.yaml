summary:
  ar: أبو جعفر الفيض بن أبي صالح شيرويه الفارسي، وزير الخليفة العباسي المهدي في أواخر دولته؛ أسلم وكان نصرانياً، واشتهر بكرمه، ثم تولى ديوان الجيش بعد وفاة المهدي إلى أن توفي سنة ١٧٣هـ كما في سير أعلام النبلاء.
  en: Abu Ja'far al-Fayd ibn Abi Salih Shirawayh al-Farisi, vizier of the Abbasid caliph al-Mahdi in the last years of his reign; a convert from Christianity, famed for his generosity, he held the army bureau after al-Mahdi's death until he died in 173 AH, according to al-Dhahabi's Siyar A'lam al-Nubala'.
  fr: "Abu Ja’far al-Fayd ibn Abi Salih Shirawayh al-Farisi, vizir du calife abbasside al-Mahdi dans les dernières années de son règne ; converti du christianisme, célèbre pour sa générosité, il dirigea le bureau de l’armée après la mort d’al-Mahdi jusqu’à sa propre mort en 173 H, selon les Siyar A’lam al-Nubala’ d’al-Dhahabi."
  es: "Abu Ja'far al-Fayd ibn Abi Salih Shirawayh al-Farisi, visir del califa abasí al-Mahdi en los últimos años de su reinado; un converso del cristianismo, famoso por su generosidad, ocupó el cargo de jefe del ejército tras la muerte de al-Mahdi hasta su fallecimiento en el año 173 de la Hégira, según el Siyar A'lam al-Nubala' de al-Dhahabi."
  ur: "ابو جعفر الفائد ابن ابی صالح شیراویح الفاریسی، اپنے دور حکومت کے آخری سالوں میں عباسی خلیفہ المہدی کا وزیر؛ الذہبی کے سیار عالم النبلاء کے مطابق، عیسائیت سے تبدیل ہونے والا، اپنی سخاوت کے لیے مشہور، اس نے المہدی کی موت کے بعد 173 ہجری میں آرمی بیورو کا عہدہ سنبھالا۔"
  tr: "Abbasî Halifesi el-Mehdi'nin saltanatının son dönemlerinde veziri olan Ebu Cafer el-Feyd ibn Ebi Salih Şiraveyh el-Farisi; Hristiyanlıktan İslamiyet'e geçmiş ve cömertliğiyle tanınmıştır. Siyar A'lam el-Nubala'da belirtildiği üzere, el-Mehdi'nin ölümünden sonra ordunun başına geçmiş ve 173 Hicri yılında vefat edene kadar bu görevi sürdürmüştür."
  id: "Abu Ja`far al-Fayd ibn Abi Salih Shirawayh al-Farisi, menteri Khalifah Abbasiyah al-Mahdi pada bagian akhir pemerintahannya; ia masuk Islam dari agama Kristen dan dikenal karena kedermawanannya. Kemudian ia mengambil alih jabatan militer setelah kematian al-Mahdi hingga ia meninggal pada tahun 173 H, sebagaimana disebutkan dalam Siyar A`lam al-Nubala`."
