id: person/al-husayn-ibn-hamdan
class: person
label: { ar: "الحسين بن حمدان", en: "al-Husayn ibn Hamdan" }
summary:
  ar: "ابن حمدان بن حمدون، استأمن إلى المعتضد هو ومن كان معه من أصحابه لما نزل أبوه في قلعة الصوارة، وكان من أمره في طلب هارون الشاري وأخذه إياه ما ذكره المسعودي {cite:muruj-al-dhahab p. 609-610}. وعند المسعودي وثب هو ووصيف بن سوارتكين على وزير المقتدر العباس بن الحسن فقتلاه سنة ست وتسعين ومائتين {cite:muruj-al-dhahab p. 649}، ومن كتب الحلاج كتاب السياسة إلى الحسين بن حمدان {cite:fihrist-ibn-al-nadim p. 272}، وعند ابن الأثير كان من رؤوس خلع المقتدر سنة 296هـ وتولى قتل الوزير العباس بن الحسن، وركض إلى الشاطبة ليقتل المقتدر فلم يصادفه، فلما جنّه الليل سار عن بغداد بأهله وماله إلى الموصل، وقيل في سبب هربه إنه رأى ما أراد لا يجري فتواطأ مع المقتدر {cite:kamil-ibn-al-athir p. 11-13}"
  en: "Hamdan b. Hamdun's son, who took al-Mu'tadid's aman and later hunted down the Kharijite Harun al-Shari {cite:muruj-al-dhahab p. 609-610}."
