class: person
label: { ar: "الحسين بن حمدان", en: "al-Husayn ibn Hamdan", es: "al-Husayn ibn Hamdan", fr: "al-Husayn ibn Hamdan", ur: "الحسین بن حمدان" }
summary:
  ar: "ابن حمدان بن حمدون، استأمن إلى المعتضد هو ومن كان معه من أصحابه لما نزل أبوه في قلعة الصوارة، وكان من أمره في طلب هارون الشاري وأخذه إياه ما ذكره المسعودي {cite:muruj-al-dhahab p. 609-610}. وعند المسعودي وثب هو ووصيف بن سوارتكين على وزير المقتدر العباس بن الحسن فقتلاه سنة ست وتسعين ومائتين {cite:muruj-al-dhahab p. 649}، ومن كتب الحلاج كتاب السياسة إلى الحسين بن حمدان {cite:fihrist-ibn-al-nadim p. 272}، وعند ابن الأثير كان من رؤوس خلع المقتدر سنة 296هـ وتولى قتل الوزير العباس بن الحسن، وركض إلى الشاطبة ليقتل المقتدر فلم يصادفه، فلما جنّه الليل سار عن بغداد بأهله وماله إلى الموصل، وقيل في سبب هربه إنه رأى ما أراد لا يجري فتواطأ مع المقتدر {cite:kamil-ibn-al-athir p. 11-13} وعند ابن الجوزي كان التدبير في فتنة عبد الله بن المعتز سنة ست وتسعين من ابن داود بن الجراح مع الحسين بن حمدان على إزالة المقتدر ونصب ابن المعتز، فأوقع بالوزير أبي أحمد العباس وهو على دابته يوم السبت لعشر بقين من ربيع الأول، وفي سنة إحدى وثلاثمائة غزا الصائفة ففتح حصونًا كثيرة وقتل من الروم خلقًا كثيرًا {cite:muntazam-ibn-al-jawzi p. 373, 408}."
  en: "Hamdan b. Hamdun's son, who took al-Mu'tadid's aman and later hunted down the Kharijite Harun al-Shari {cite:muruj-al-dhahab p. 609-610}. Ibn al-Jawzi details the capture: al-Mu'tadid sent him against Harun al-Shari in 283, and he stipulated three requests — his father's release first — bringing Harun back so the caliph robed him and loosed his father's chains {cite:muntazam-ibn-al-jawzi p. 162}."
  es: "Hamdan b. Hijo de Hamdun, quien tomó el aman de al-Mu'tadid y luego persiguió al jariyí Harun al-Shari {cite:muruj-al-dhahab p. 609-610}. Ibn al-Jawzi detalla la captura: al-Mu'tadid lo envió contra Harun al-Shari en 283, y estipuló tres peticiones: primero la liberación de su padre, luego traer de vuelta a Harun para que el califa lo vistiera y soltara las cadenas de su padre {cite:muntazam-ibn-al-jawzi p. 162}."
  fr: "Hamdan b. Hamdun, fils de ce dernier, s'empara de l'aman d'al-Mu'tadid et traqua par la suite le Kharijite Harun al-Shari (voir: Muruj-al-Dhahab, p. 609-610). Ibn al-Jawzi relate la capture: al-Mu'tadid l'envoya contre Harun al-Shari en 283, et il formula trois demandes: la libération de son père en premier, puis le retour de Harun afin que le calife le revête et brise les chaînes de son père (voir: Muntazam-ibn-al-Jawzi, p. 162)."
  ur: "حمدان بی۔ حمدون کا بیٹا جس نے المتدید کا امان لیا اور بعد میں خارجی ہارون الشری کا شکار کیا 609-610}۔ ابن الجوزی نے گرفتاری کی تفصیل بیان کی ہے: المتعدید نے اسے 283 میں ہارون الشری کے خلاف بھیجا، اور اس نے تین درخواستیں پیش کیں - پہلے اس کے والد کی رہائی - ہارون کو واپس لایا تو خلیفہ نے اسے لوٹ لیا اور اس کے والد کی زنجیریں کھول دیں۔ 162}۔"
  tr: "İbn Hamdan ibn Hamdun, babası El-Savare kalesine yerleştiğinde El-Mu'tadid'i kendisi ve yoldaşlarına emanet etmiştir. Emirlerinden biri, Al-Mas'udi'nin belirttiği gibi alıcı Harun'u bulup onu da yanında götürmekti. el-Mes'udi'ye göre, o ve Veseyf bin Svartkin, 296 Hicri yılında el-Muqtadir'in bakanı el-Abbas bin el-Hasan'a atlayıp onu öldürmüştür {atıf:muruj-al-dhahab s. 649}. El-Hallag'ın kitapları arasında 'Hüseyin ibn Hamdan'a Siyaset Kitabı' {atıf:fihrist-ibn-al-nadim s. 272} bulunmaktadır. İbn el-Athir'e göre, 296 Hicri yılında el-Muqtadir'in tahttan indirilmesinin liderlerinden biriydi ve vezir el-Abbas bin el-Hasan'ı öldürmeyi üstlendi. El-Şetibe'ye koştu ve el-Muktadir'i öldürdü fakat onunla karşılaşmadı. Gece çöktüğünde, ailesi ve mal-varlığıyla birlikte Bağdat'tan Musul'a yürüdü. Kaçma sebebinin şöyle olduğu söylenir İstediğinin başarılı olmayacağını anladı ve el-Muqtadir ile iş birliği yaptı {atıf:kamil-ibn-a-athir s. 11-13} İbn el-Cevzi'ye göre, doksan altıncı yılda Abdullah ibn el-Mu'tazz'ın isyanının planı, İbn Davud ibn el-Cerrah'tan ile Hüseyin ibn Hamdan tarafından el-Muqtadir'i görevden almak ve İbn al-Mu'tazz'ı atanmaktı. Vezir Ebu Ahmed el-Abbas'ı, Rabi'l-Avval'den on gün önce cumartesi günü atına atladı. Üç yüz bir yılda yazı yağmaladı, birçok kale ele geçirdi ve birçok Romalı insanı öldürdü {atıf:Muntazam-ibn-al-jawzi s. 373, 408}."
  id: "Ibn Hamdan ibn Hamdun mempercayakan Al-Mu'tadid bersama para sahabatnya ketika ayahnya menetap di benteng Al-Sawarah. Salah satu perintahnya adalah mencari Harun sebagai pembeli dan membawanya bersamanya, seperti yang disebutkan oleh Al-Mas'udi {cite:muruj-al-dhahab, hlm. 609-610}. Menurut al-Mas'udi, ia dan Waseef ibn Swartkin melompat ke menteri al-Muqtadir, al-Abbas ibn al-Hasan dan membunuhnya pada tahun 296 H {cite:muruj-al-dhahab hlm. 649}. Di antara buku-buku al-Hallaj adalah 'The Book of Politics to al-Husayn ibn Hamdan' {cite:fihrist-ibn-al-nadim hlm. 272}. Menurut Ibn al-Athir, ia adalah salah satu pemimpin pencopotan al-Muqdatir pada tahun 296 H dan bertanggung jawab membunuh wazir al-Abbas ibn al-Hasan. Ia berlari ke al-Shatiba untuk membunuh al-Muqtadir tetapi tidak bertemu dengannya. Ketika malam tiba, ia berangkat dari Baghdad bersama keluarganya dan kekayaannya ke Mosul. Konon alasan pelariannya adalah Ia melihat bahwa apa yang ia inginkan tidak akan berhasil, sehingga ia bersekongkol dengan al-Muqtadir {cite:kamil-ibn-al-athir hlm. 11-13} Menurut Ibn al-Jawzi, rencana pemberontakan Abdullah ibn al-Mu'tazz pada tahun sembilan puluh enam berasal dari Ibn Dawud ibn al-Jarrah bersama Husayn ibn Hamdan untuk menyingkirkan al-Muqtadir dan mengangkat Ibn al-Mu'tazz. Ia mengangkat wazir Abu Ahmad al-Abbas di atas tunggangannya pada hari Sabtu sepuluh hari sebelum Rabi' al-Awwal. Pada tahun tiga ratus satu ia menyerang musim panas, merebut banyak benteng, dan membunuh banyak orang Romawi {cite:Muntazam-ibn-al-jawzi hlm. 373, 408}."
