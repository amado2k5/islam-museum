summary:
  ar: "محمد بن عبد الله بن أبي بكر القضاعي ابن الأبار، كاتب بلنسية وأديبها؛ كاتب سلطان إفريقية مستغيثاً حين حوصرت بلنسية بقصيدة هزت منه عطف ارتياح فأمر شعراء حضرته بمجاوبتها فجاوبها غير واحد وشحن الأساطيل بالمدد، ولما تغلب العدو على بلنسية سنة 636هـ رجع بأهله إلى تونس {cite:nafh-tib-maqqari p. 464}."
  en: "Ibn al-Abbar al-Quda'i, Valencia's secretary and literary historian; his plea-poem to the Hafsid sultan during the 636 siege was answered in kind by the court poets before the city fell, after which he returned to Tunis {cite:nafh-tib-maqqari p. 464}."
