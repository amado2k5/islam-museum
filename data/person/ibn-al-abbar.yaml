born: { edtf: "1199-02~", hijri: "0595-04", calendar: julian, precision: month, status: tradition, derived: true, note: "ولد في ربيع الآخر سنة 595هـ/فبراير 1199م ببلنسية {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}؛ وعن ثلاث وستين سنة عند قتله {cite:shadharat-dhahab p. 303}؛ التحويل مشتق.", sources: [source/encyclopaedia-of-islam-2, source/shadharat-dhahab] }
died: { edtf: "1260-01-06", hijri: "0658-01-20", calendar: julian, precision: day, status: tradition, derived: true, note: "قتله صاحب تونس ظلماً في العشرين من المحرم سنة ثمان وخمسين وستمائة وله ثلاث وستون سنة {cite:shadharat-dhahab p. 303}؛ وطُعن بالرماح صبيحة ٢٠ المحرم ٦٥٨/٦ يناير 1260 وأُحرقت جثته وكتبه من الغد {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}؛ التحويل مشتق.", sources: [source/encyclopaedia-of-islam-2, source/shadharat-dhahab] }
summary:
  ar: "أبو عبد الله محمد بن عبد الله بن أبي بكر بن عبد الله بن عبد الرحمن بن أحمد القضاعي، ابن الأبار البلنسي (595–658هـ/1199–1260م): المحدث الأديب المؤرخ الشاعر، صاحب «التكملة» و«الحلة السيرة» ونحو خمسة عشر تصنيفًا في نحو خمسة وأربعين مجلدًا؛ كاتب ولاة بلنسية المؤمنيين، ثم رئيس ديوان الإنشاء الحفصي بتونس، فقتله المستنصر ظلمًا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705} {cite:shadharat-dhahab p. 303}."
  en: "Abu Abd Allah Muhammad ibn Abd Allah ibn Abi Bakr al-Quda'i, Ibn al-Abbar of Valencia (595–658/1199–1260): traditionist, littérateur, historian and poet, author of the Takmila, al-Hulla al-siyara and some fifteen works in about forty-five volumes; secretary to the Mu'minid governors of Valencia, then head of the Hafsid chancellery at Tunis, where al-Mustansir had him killed unjustly {cite:encyclopaedia-of-islam-2 vol. 3 p. 705} {cite:shadharat-dhahab p. 303}."
  ur: "ابو عبد اللہ محمد بن عبد اللہ بن ابی بکر قضاعی، ابن ابار بلنسی (595–658ھ/1199–1260ء): محدث، ادیب، مؤرخ اور شاعر؛ «التکملة» اور «الحلة السیرا» سمیت نحو پندرہ تصانیف کے مصنف جو پینتالیس جلدوں میں ہیں؛ بلنسیہ کے مؤمنی حکمرانوں کے کاتب، پھر تونس میں حفصی دیوان انشا کے سربراہ، جہاں مستنصر نے انہیں ظلماً قتل کرایا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705} {cite:shadharat-dhahab p. 303}."
