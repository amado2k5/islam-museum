  ur: "مؤرخ اور لغت نویس خضر الدین الزرکلی آف حلب ⁦(متوفی 1396ھ/1969)⁩، سوانحی لغت الاعلام کے مصنف؛ 1927 کے ایڈیشن کی جلد 2 کو فصل کے شیلف پر سکین کیا گیا ہے۔"
