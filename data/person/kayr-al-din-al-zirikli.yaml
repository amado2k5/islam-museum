  id: "Sejarawan dan ahli bahasa Khair al-Din ibn Mahmoud al-Zarkali al-Halabi (wafat 1396 H / 1969 M), penulis kamus 'Al-A'lam'; ia meninjau bagian kedua edisi 1927 di rak panen."
