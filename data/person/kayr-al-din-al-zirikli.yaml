  ar: "المؤرخ واللغوي خير الدين بن محمود الزركلي الحلبي ⁦(ت 1396هـ/1969م)⁩، صاحب قاموس «الأعلام»؛ مسح الجزء الثاني من طبعة 1927م على رف الحصاد."
  en: "The historian and lexicographer Khayr al-Din al-Zirikli of Aleppo (d. 1396 AH/1969), author of the biographical dictionary al-A'lam; volume 2 of the 1927 edition is scanned on the harvest shelf."
