summary:
  ar: "عالم ومربٍّ إسلامي مقيم في تكساس؛ رئيس معهد المغرب ومدير قسم العقيدة والأخلاق فيه، وإمام مركز كلير ليك الإسلامي، ومدير مؤتمر تكساس للدعوة، وعضو لجنة الفتوى والبحوث في جمعية فقهاء أمريكا المسلمين وعضو اتحاد أئمة أمريكا الشمالية. حاصل على الدكتوراه في العقيدة."
  en: "Islamic scholar and educator based in Texas: president of AlMaghrib Institute and head of its Islamic theology and ethics department, imam of Clear Lake Islamic Center, director of the Texas Dawah Convention, and a member of the Assembly of Muslim Jurists of America's Fatwa and Research Committee and of the North American Imam Federation. He holds a doctorate in theology."
  ur: "ٹیکساس میں مقیم اسلامی عالم اور معلم؛ المغرب انسٹیٹیوٹ کے صدر اور اس کے شعبہ اسلامی الٰہیات و اخلاقیات کے سربراہ، کلیئر لیک اسلامک سینٹر کے امام، ٹیکساس دعوہ کنونشن کے ڈائریکٹر، اور اسمبلی آف مسلم جیورسٹس آف امریکہ کی فتویٰ و تحقیقی کمیٹی اور نارتھ امریکن امام فیڈریشن کے رکن۔ انہوں نے الٰہیات میں ڈاکٹریٹ کی ڈگری حاصل کی ہے۔"
