id: person/muhammad-ibn-qasim-al-qassar-al-fasi
class: person
gender: male
label:
  ar: محمد بن قاسم القصار الفاسي
  en: Muhammad ibn Qasim al-Qassar al-Fasi (Maliki jurist of Fez)
summary:
  ar: فقيه مالكي ومحدث من فاس، شهير بالقصار، وصفه صاحب شجرة النور الزكية بأنه شيخ الفتيا بفاس وخاتمة أعلامها؛ أخذ عن عبد الوهاب الزقاق وأبي القاسم الراشدي وابن جلال، وعنه الدلائي والمقري؛ من تصانيفه فهرسة في الفقه والحديث ومصنف في مناقب إدريس بن عبد الله الكامل الأكبر وولده إدريس الأزهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7843}
  en: A Maliki jurist and traditionist of Fez, known as al-Qassar; the Shajara al-Nur al-Zakiya calls him the mufti of Fez and the last of its scholars; studied with Abd al-Wahhab al-Zaqqaq, Abu al-Qasim al-Rashidi and Ibn Jalal, and taught al-Dala'i and al-Maqqari; works include a fihrist of his riwayat and a book on the virtues of Idris ibn Abd Allah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7843}
  ur: فاس کے مالکی فقیہ اور محدث، القصار کے نام سے مشہور؛ شجرۃ النور الزکیہ کے مطابق فاس کے مفتی اور اس کے علماء کی آخری کڑی؛ عبد الوہاب الزقاق اور ابن جلال سے پڑھا؛ تصانیف میں فقہ و حدیث کی فہرست اور ادریس بن عبد اللہ کے فضائل پر کتاب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7843}
