summary:
  ar: "مجد الدين طاهر بن نصر الله بن جهيل الكلاثي الحلي الشافعي الفرضي، مدرس مدرسة صلاح الدين بالقدس؛ سمع الحديث من جماعة وحدث، وصنف للسلطان نور الدين الشهيد كتاباً في فضل الجهاد، وهو والد بني جهيل الفقهاء الدمشقيين، وأحد من قام على السهروردي الفيلسوف وأفتى بقتله؛ مات بالقدس عن أربع وستين سنة سنة ست وتسعين وخمسمائة {cite:shadharat-dhahab p. 804}."
  en: "Majd al-Din Tahir b. Nasrallah b. Juhayl al-Kulathi of Hilla, Shafi'i and faridi, teacher at Salah al-Din's madrasa in Jerusalem; he transmitted hadith and wrote for Nur al-Din a book on the merit of jihad — father of the Banu Juhayl, Damascus's jurists — and was one of those who stood against the philosopher Suhrawardi and licensed his killing; he died at Jerusalem aged sixty-four in 596 {cite:shadharat-dhahab p. 804}."
