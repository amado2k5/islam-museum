summary:
  ar: "مجد الدين طاهر بن نصر الله بن جهيل الكلاثي الحلي الشافعي الفرضي، مدرس مدرسة صلاح الدين بالقدس؛ سمع الحديث من جماعة وحدث، وصنف للسلطان نور الدين الشهيد كتاباً في فضل الجهاد، وهو والد بني جهيل الفقهاء الدمشقيين، وأحد من قام على السهروردي الفيلسوف وأفتى بقتله؛ مات بالقدس عن أربع وستين سنة سنة ست وتسعين وخمسمائة {cite:shadharat-dhahab p. 804}."
  en: "Majd al-Din Tahir b. Nasrallah b. Juhayl al-Kulathi of Hilla, Shafi'i and faridi, teacher at Salah al-Din's madrasa in Jerusalem; he transmitted hadith and wrote for Nur al-Din a book on the merit of jihad — father of the Banu Juhayl, Damascus's jurists — and was one of those who stood against the philosopher Suhrawardi and licensed his killing; he died at Jerusalem aged sixty-four in 596 {cite:shadharat-dhahab p. 804}."
  es: "Majd al-Din Tahir b. Nasrallah b. Juhayl al-Kulathi de Hilla, shafi'i y faridi, maestro en la madrasa de Salah al-Din en Jerusalén; transmitió hadices y escribió para Nur al-Din un libro sobre el mérito de la yihad —padre de los Banu Juhayl, juristas de Damasco— y fue uno de los que se opusieron al filósofo Suhrawardi y autorizaron su asesinato; murió en Jerusalén a los sesenta y cuatro años en 596 {cite:shadharat-dhahab p. 804}."
  fr: "Majd al-Din Tahir b. Nasrallah b. Juhayl al-Kulathi de Hilla, Shafi'i et faridi, enseignant à la madrasa de Salah al-Din à Jérusalem; il a transmis des hadiths et a écrit pour Nur al-Din un livre sur le mérite du jihad — père des Banu Juhayl, les juristes de Damas — et fut l'un de ceux qui s'opposèrent au philosophe Suhrawardi et autorisèrent son assassinat; il mourut à Jérusalem à l'âge de soixante-quatre ans en 596 {cite:shadharat-dhahab p. 804}."
  ur: "مجد الدین طاہر ب۔ نصراللہ بی۔ ہللا کے جوہیل الکلطی، شافعی اور فریدی، یروشلم میں صلاح الدین کے مدرسے میں استاد؛ اس نے حدیثیں منتقل کیں اور نورالدین کے لیے جہاد کی فضیلت پر ایک کتاب لکھی - بنو جہیل کے والد، دمشق کے فقہاء - اور وہ ان لوگوں میں سے تھے جو فلسفی سہروردی کے خلاف کھڑے تھے اور اس کے قتل کا لائسنس دیا تھا۔ ان کا انتقال 596 میں چونسٹھ سال کی عمر میں یروشلم میں ہوا۔ 804}۔"
  tr: "Majd el-Din Tahir bin Nasrallah ibn Juhayl al-Hilli al-Shafi'i al-Fardi, Kudüs'teki Salaheddin Okulu'nda öğretmendi; bir gruptan hadis ve hadis duydu. Sultan Nureddin el-Şahid için cihad erdemi üzerine bir kitap yazdı. Şamlı hukukçular Banu Cuhayl'ın babasıydı ve filozof Suhrawardi'ye karşı çıkan, onun idam edilmesi için fetva düzenleyenlerden biriydi. 596 Hicri yılında altmış dört yaşında Kudüs'te öldü {atıf: şadharat-dhahab, s. 804}."
  id: "Majd al-Din Tahir ibn Nasrallah ibn Juhayl al-Kalathi al-Hilli al-Shafi'i al-Fardi, seorang guru di Sekolah Salah al-Din di Yerusalem; ia mendengar hadits dari sekelompok orang dan hadits. Ia menulis sebuah buku tentang kebajikan jihad untuk Sultan Nur al-Din al-Shahid. Ia adalah ayah dari Banu Juhayl, para ahli hukum Damaskus, dan salah satu yang menentang Suhrawardi, sang filsuf, serta mengeluarkan fatwa untuk eksekusinya. Ia meninggal di Yerusalem pada usia enam puluh empat tahun di tahun 596 H {cite:shadharat-dhahab, hlm. 804}."
