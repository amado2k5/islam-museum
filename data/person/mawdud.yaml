id: person/mawdud
class: person
label: { ar: "مودود صاحب الموصل" }
summary:
  ar: "صاحب الموصل، جاء بعسكر سنة سبع وخمس مئة ليقاتل ملك الفرنج الذي بالقدس فوقع بينهم معركة هائلة ثم رجع إلى دمشق فصلى الجمعة في الجامع وإذا بباطني وثب عليه فجرحه فمات من يومه {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  en: "Lord of Mosul; in 507 he brought an army against the Frankish king of Jerusalem, then was stabbed by a Batini at Jumu'a in Damascus's mosque and died that day {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  es: "Señor de Mosul; en 507 llevó un ejército contra el rey franco de Jerusalén, luego fue apuñalado por un Batini en la oración del viernes en la mezquita de Damasco y murió ese mismo día {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  fr: "Seigneur de Mossoul; en 507, il amena une armée contre le roi franc de Jérusalem, puis fut poignardé par un Batini à Jumu'a dans la mosquée de Damas et mourut ce jour-là {cite:tarikh-khulafa-minhaj-1434 p. 661}."
  ur: "موصل کا رب؛ 507 میں وہ یروشلم کے فرانکی بادشاہ کے خلاف لشکر لے کر آیا، پھر دمشق کی مسجد میں جمعہ کے مقام پر ایک بطینی نے چھرا گھونپ دیا اور اسی دن اس کی موت ہو گئی۔ 661}۔"
  tr: "Musul hükümdarı, 507 Hicri yılında bir orduyla Kudüs'te Frank kralıyla savaşmak üzere geldi ve aralarında şiddetli bir çatışma çıktı. Sonra Şam'a döndü ve camide cuma namazı etti. Batini'nin üzerine atlayıp onu yaraladığını gördü ve o günden itibaren öldü {atıf:Tarikh-khulafa-minhaj-1434, s. 661}."
  id: "Penguasa Mosul datang dengan pasukan pada tahun 507 H untuk melawan raja Franka di Yerusalem, dan pertempuran sengit pecah di antara mereka. Ia kemudian kembali ke Damaskus dan berdoa Jumat di masjid. Ia menemukan Batini melompat ke atasnya, melukainya, dan ia meninggal sejak hari itu {cite:Tarikh-khulafa-minhaj-1434, hlm. 661}."
