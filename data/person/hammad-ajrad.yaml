summary:
  ar: "حماد عجرد، شاعر مولد من موالي الفرس كان كاتباً ليحيى بن محمد بن سول بالموصل؛ اشتهِر بالزندقة حتى قال أبو نواس: «كنت أتوهم حماد عجرد إنما يرمى بالزندقة لمجونه في شعره حتى حبست في حبس الزنادقة، فإذا حماد عجرد إمام من أئمتهم، وإذا له شعر مزاوج بيتين بيتين يقرءون به في صلاتهم»؛ وذكره المسعودي بين من ترجم كتب ماني وديصان من الفارسية والفهلوية إلى العربية، وكان ممن جمعه المنصور بمحمد بن أبي العباس من الزنادقة والمجان بالبصرة ليُبغضه إلى الناس {cite:duha-islam p. 138-139, 149}."
  en: "Hammad Ajrad — Persian-mawla poet and secretary in Mosul, famed (and, per Abu Nuwas's prison testimony, genuinely a leader) among the accused zindiqs of al-Mahdi's reign {cite:duha-islam p. 138-139, 149}."
  es: "Hammad Ajrad — Poeta persa-mawla y secretario en Mosul, famoso (y, según el testimonio de Abu Nuwas en prisión, un verdadero líder) entre los zindiqs acusados del reinado de al-Mahdi {cite:duha-islam p. 138-139, 149}."
  fr: "Hammad Ajrad — poète et secrétaire persan-mawla à Mossoul, célèbre (et, selon le témoignage d'Abu Nuwas en prison, véritablement un chef) parmi les zindiqs accusés du règne d'al-Mahdi {cite:duha-islam p. 138-139, 149}."
  ur: "حماد اجراد - فارسی-مولا شاعر اور موصل میں سکریٹری، المہدی کے دور حکومت کے ملزم زندیقوں میں مشہور ⁦(اور، ابو نواس کی جیل کی گواہی کے مطابق، حقیقی طور پر ایک رہنما)⁩۔ 138-139، 149}۔"
  tr: "Pers özgür kalınmışları arasında doğmuş bir şair olan Hammad Ajrad, Musul'da Yahya ibn Muhammed ibn Sul için yazardı; sapkınlığıyla ünlendi ve Ebu Nuwas şöyle dedi: \"Hammad Ajrad'ın, şiirlerindeki ahlaksızlık nedeniyle sapkınlıkla suçlandığını hayal ederdim, ta ki sapkınlar tarafından hapsedilene kadar. O zaman Hammad Ajjard onların imamlarından biriydi ve dualarında iki dizeyle karıştırılmış şiirleri vardı.\" El-Mes'udi, Mani ve Disan'ın kitaplarını Farsça ve Pehlaviyye'den Arapçaya çevirenler arasında onu anmıştır. O, Muhammed bin Ebi el-Abbas ile birlikte Muhammed ibn Ebi el-Abbas ile birlikte sapkınlar ve suçlular arasında toplananlar arasındaydı {atı:Duha-İslam, s. 138-139, 149}."
  id: "Hammad Ajrad, seorang penyair yang lahir di antara para mantan Persia, adalah penulis untuk Yahya ibn Muhammad ibn Sul di Mosul; ia menjadi terkenal karena bid'ah hingga Abu Nuwas berkata: \"Saya biasa membayangkan Hammad Ajrad dituduh bid'ah karena ketidakmoralannya dalam puisinya sampai ia dipenjara oleh kaum bidah. Kemudian Hammad Ajjard adalah salah satu imam mereka, dan ia memiliki puisi yang dicampur dengan dua ayat yang mereka bacakan dalam doa mereka.\" Al-Mas'udi menyebutnya sebagai salah satu dari mereka yang menerjemahkan kitab Mani dan Disan, dari bahasa Persia dan Pahlaviyya, ke dalam bahasa Arab. Ia termasuk di antara mereka yang mengumpulkan al-Mansur bersama Muhammad ibn Abi al-Abbas di antara para bidat dan penjahat di Basra untuk membencinya di antara rakyat {cite:Duha-Islam, hlm. 138-139, 149}."
