summary:
  ar: "حماد عجرد، شاعر مولد من موالي الفرس كان كاتباً ليحيى بن محمد بن سول بالموصل؛ اشتهِر بالزندقة حتى قال أبو نواس: «كنت أتوهم حماد عجرد إنما يرمى بالزندقة لمجونه في شعره حتى حبست في حبس الزنادقة، فإذا حماد عجرد إمام من أئمتهم، وإذا له شعر مزاوج بيتين بيتين يقرءون به في صلاتهم»؛ وذكره المسعودي بين من ترجم كتب ماني وديصان من الفارسية والفهلوية إلى العربية، وكان ممن جمعه المنصور بمحمد بن أبي العباس من الزنادقة والمجان بالبصرة ليُبغضه إلى الناس {cite:duha-islam p. 138-139, 149}."
  en: "Hammad Ajrad — Persian-mawla poet and secretary in Mosul, famed (and, per Abu Nuwas's prison testimony, genuinely a leader) among the accused zindiqs of al-Mahdi's reign {cite:duha-islam p. 138-139, 149}."
