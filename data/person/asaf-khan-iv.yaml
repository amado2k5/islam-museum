summary:
  ar: "أبو الحسن آصف خان ⁦(نحو 1569–1641)⁩، نبيل مغولي من أصل فارسي، ابن ميرزا غياث بيك والأخ الأكبر لنور جهان ووالد أرجمند بانو بيكم ⁦(ممتاز محل)⁩؛ كان وكيل جهانكير ثم الوزير الأعظم في عهد شاه جهان، وبنى لنفسه ضريحًا في شاهدرا باغ بلاهور."
  en: "Abu'l-Hasan Asaf Khan (c. 1569–1641), a Mughal noble of Persian origin, son of Mirza Ghiyas Beg, elder brother of Nur Jahan and father of Arjumand Banu Begum (Mumtaz Mahal); he served as Jahangir's vakil and as grand vizier under Shah Jahan, and built his tomb at Shahdara Bagh in Lahore."
  ur: "ابوالحسن آصف خان ⁦(تقریباً 1569ء–1641ء)⁩، فارسی نژاد مغل امیر، مرزا غیاث بیگ کے بیٹے، نور جہاں کے بڑے بھائی اور ارجمند بانو بیگم ⁦(ممتاز محل)⁩ کے والد؛ جہانگیر کے وکیل اور شاہ جہاں کے وزیرِ اعظم رہے، لاہور کے شاہدرہ باغ میں ان کا مقبرہ ہے۔"
  es: "Abu'l-Hasan Asaf Khan (c. 1569–1641), un noble mogol de origen persa, hijo de Mirza Ghiyas Beg, hermano mayor de Nur Jahan y padre de Arjumand Banu Begum (Mumtaz Mahal); sirvió como vakil de Jahangir y como gran visir bajo Shah Jahan, y construyó su tumba en Shahdara Bagh en Lahore."
  fr: "Abu'l-Hasan Asaf Khan (vers 1569-1641), un noble moghol d'origine perse, fils de Mirza Ghiyas Beg, frère aîné de Nur Jahan et père d'Arjumand Banu Begum (Mumtaz Mahal); il a servi comme vakil de Jahangir et comme grand vizir sous Shah Jahan, et a construit son tombeau à Shahdara Bagh à Lahore."
  tr: "Ebu el-Hasan Asaf Han (yaklaşık 1569–1641), Pers kökenli bir Moğol soylusuydu, Mirza Ghiyath Beg'in oğlu, Nur Jahan'ın ağabeyi ve Arjumand Banu Bek'in (Mumtaz Mahal) babası; Şah Cahan döneminde önce Jahangir'in ajanı ve ardından sadrazam olarak görev yaptı; kendisi için Lahor'daki Shahdra Bagh'da bir türbe inşa etti."
  id: "Abu al-Hasan Asaf Khan (sekitar 1569–1641), seorang bangsawan Mongol keturunan Persia, putra Mirza Ghiyath Beg, kakak Nur Jahan, dan ayah Arjumand Banu Bek (Mumtaz Mahal); ia adalah agen Jahangir dan kemudian wazir agung selama masa pemerintahan Shah Jahan, dan membangun mausoleum untuk dirinya sendiri di Shahdra Bagh, Lahore."
