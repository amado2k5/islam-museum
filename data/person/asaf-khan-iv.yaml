summary:
  ar: "أبو الحسن آصف خان (نحو 1569–1641)، نبيل مغولي من أصل فارسي، ابن ميرزا غياث بيك والأخ الأكبر لنور جهان ووالد أرجمند بانو بيكم (ممتاز محل)؛ كان وكيل جهانكير ثم الوزير الأعظم في عهد شاه جهان، وبنى لنفسه ضريحًا في شاهدرا باغ بلاهور."
  en: "Abu'l-Hasan Asaf Khan (c. 1569–1641), a Mughal noble of Persian origin, son of Mirza Ghiyas Beg, elder brother of Nur Jahan and father of Arjumand Banu Begum (Mumtaz Mahal); he served as Jahangir's vakil and as grand vizier under Shah Jahan, and built his tomb at Shahdara Bagh in Lahore."
  ur: "ابوالحسن آصف خان (تقریباً 1569ء–1641ء)، فارسی نژاد مغل امیر، مرزا غیاث بیگ کے بیٹے، نور جہاں کے بڑے بھائی اور ارجمند بانو بیگم (ممتاز محل) کے والد؛ جہانگیر کے وکیل اور شاہ جہاں کے وزیرِ اعظم رہے، لاہور کے شاہدرہ باغ میں ان کا مقبرہ ہے۔"
