summary:
  ar: "الملك المنصور أبو الأشبال ضرغام بن سوار اللخمي؛ خرج على شاور الوزير في أيام العاضد وجمع جموعاً كبيرة ونازعه الوزارة فهزم شاوراً إلى الشام؛ ثم لما وصل شاور من الشام بالعساكر خرج ضرغام من القاهرة فقُتل عند مشهد السيدة نفيسة وجزّوا رأسه وطافوا به على رمح وبقيت جثته ثلاثة أيام ثم دُفن عند بركة الفيل وعُمر عليه قبة {cite:wafayat-ayan}."
  en: "Dirgham b. Sawar al-Lakhmi (d. 559) — al-Adid's vizier who broke Shawar and drove him to Syria; killed when Shawar returned with troops, his head paraded on a lance, and buried at Birkat al-Fil {cite:wafayat-ayan}."
  es: "Dirgham b. Sawar al-Lakhmi (m. 559) — visir de al-Adid que derrotó a Shawar y lo obligó a huir a Siria; fue asesinado cuando Shawar regresó con tropas, su cabeza fue exhibida en una lanza y enterrada en Birkat al-Fil {cite:wafayat-ayan}."
  fr: "Dirgham b. Sawar al-Lakhmi (d. 559) — vizir d'al-Adid qui a brisé Shawar et l'a poussé en Syrie; tué lorsque Shawar est revenu avec des troupes, sa tête a été exhibée sur une lance et enterrée à Birkat al-Fil {cite:wafayat-ayan}."
  ur: "درگام ب۔ سوار الخمی ⁦(متوفی 559)⁩ — العدید کا وزیر جس نے شوار کو توڑا اور اسے شام لے جایا۔ جب شاور فوجوں کے ساتھ واپس آیا تو اس کا سر جھکایا گیا، اور برکات الفل میں دفن کیا گیا۔"
  tr: "Al-Mansur Al-Malik Abu al-Ashbal Durgham ibn Suwar al-Lakhmi, el-Adid döneminde Şavar el-Vezir'e karşı çıktı, büyük kalabalıklar topladı, vezirlik için mücadele etti ve Şawra'yı Levant'a yendi. Sonra, Shawwar askerlerle birlikte Levant'tan geldiğinde, Durgham Kahire'den ayrıldı ve Lady Nafisa'nın türbesinde öldürüldü. Başı kesildi ve mızrakla gösterildi. Cesedi üç gün boyunca kaldı, ardından Fil Havuzu'na gömüldü ve üzerine bir kubbe inşa edildi {cite:wafayat-ayan}."
  id: "Al-Mansur Al-Malik Abu al-Ashbal Durgham ibn Suwar al-Lakhmi berangkat melawan Shawar al-Wazir pada masa al-Adid, mengumpulkan kerumunan besar, memperebutkan tahta wazir, dan mengalahkan Shawra ke Levant. Kemudian, ketika Shawwar tiba dari Levant bersama pasukan, Durgham meninggalkan Kairo dan dibunuh di makam Lady Nafisa. Kepalanya dipenggal, dan dia diarak dengan tombak. Jenayatnya tetap di sana selama tiga hari, lalu dimakamkan di Kolam Gajah dan sebuah kubah dibangun di atasnya {cite:wafayat-ayan}."
