label: { ar: "أبو بكر القفال المروزي الصغير", en: "Abu Bakr al-Qaffal al-Marwazi al-Saghir", fr: "Abu Bakr al-Qaffal al-Marwazi al-Saghir", es: "Abu Bakr al-Qaffal al-Marwazi al-Saghir", ur: "ابوبکر القفل المروازی الصغیر" }
summary:
  ar: "أبو بكر عبد الله بن أحمد المروزي القفال الصغير، شيخ الشافعية بخراسان وسيّد أعيان الخراسانيين، وأما القفال الكبير فهو الشاشي شيخ طريقة العراقيين، لكن المروزي أكثر ذكراً في كتب الفقه؛ سُمي بالقفال لأنه كان يعمل الأقفال في ابتداء أمره وبرع في صناعتها حتى صنع قفلاً بآلاته ومفتاحه وزن أربع حبات، فلما كان ابن ثلاثين سنة أحسّ من نفسه ذكاءً فأقبل على العلم {cite:shadharat-dhahab p. 208}."
  en: "Abu Bakr Abdallah b. Ahmad al-Marwazi, 'al-Qaffal al-Saghir' — head of Khurasan's Shafi'is, called 'the Locksmith' because he had practised the craft in his youth and once made a lock and key weighing four grains; feeling his own intelligence at thirty he turned to scholarship. The more-cited Qaffal of the fiqh books, he died in 417 {cite:shadharat-dhahab p. 208}."
  fr: "Abu Bakr Abdallah b. Ahmad al-Marwazi, 'al-Qaffal al-Saghir' - chef du Shafi'is du Khurasan, appelé 'le Serrurier' parce qu'il avait pratiqué l'artisanat dans sa jeunesse et avait une fois fait une serrure et une clé pesant quatre grains ; Ayant senti sa propre intelligence à trente ans, il se tourna vers l’érudition. Le Qaffal plus cité des livres de fiqh, il est mort en 417 {cite:shadharat-dhahab p. 208}."
  es: "Abu Bakr Abdallah b. Ahmad al-Marwazi, 'al-Qaffal al-Saghir', líder de los shafi'ís de Jorasán, era conocido como 'el cerrajero' porque había practicado el oficio en su juventud y una vez fabricó una cerradura y una llave que pesaban cuatro granos; a los treinta años, sintiéndose inteligente, se dedicó al estudio. Considerado el Qaffal más citado en los libros de fiqh, murió en el año 417 {cita: shadharat-dhahab, pág. 208}."
  ur: "ابوبکر عبداللہ بن احمد المروازی، 'القفل الصغیر' - خراسان کے شافعیوں کا سربراہ، 'تالہ بنانے والا' کہلاتا ہے کیونکہ اس نے اپنی جوانی میں اس ہنر کی مشق کی تھی اور ایک بار چار دانے وزنی تالا اور چابی بنائی تھی۔ تیس سال کی عمر میں اپنی ذہانت کو محسوس کرتے ہوئے اسکالرشپ کا رخ کیا۔ فقہ کی کتابوں میں قفال کا زیادہ حوالہ دیا گیا، ان کی وفات 417 میں ہوئی۔ 208}۔"
  tr: "Ebu Bekir Abdullah ibn Ahmed el-Mervazi el-Qaffal el-Saghir, Horasan'daki Şafii şeyhi ve önde gelen Horasani alimlerinin ustası. Büyük el-Kaffal ise Irak tarikatının şeyhi olan Şaşi'dir. Ancak el-Mervazi daha sık fıkıh kitaplarında anılır; kariyerinin başında kilit yapardı ve aletleriyle kilit ve dört boncuklu anahtarla ustalaşarak ustalaşırdı. Otuz yaşındayken kendini zeki hissetti ve bilgiye kendini adadı. {atıf:Shadharat-Dhahab, s. 208}."
  id: "Abu Bakr Abdullah ibn Ahmad al-Marwazi al-Qaffal al-Saghir, sheikh Shafi'i di Khurasan dan guru para ulama Khorasani terkemuka. Adapun al-Qaffal yang agung, ia adalah Shashi, sheikh dari ordo Irak. Namun, al-Marwazi lebih sering disebutkan dalam buku hukum; ia disebut 'al-Qaffal' karena ia biasa membuat kunci di awal kariernya dan unggul dalam keahliannya, membuat kunci dengan alat dan kunci seberat empat manik. Ketika berusia tiga puluh tahun, ia merasa cerdas dan mendedikasikan diri pada pengetahuan. {cite:Shadharat-Dhahab, hlm. 208}."
