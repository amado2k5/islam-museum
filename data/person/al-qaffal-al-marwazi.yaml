label: { ar: "أبو بكر القفال المروزي الصغير" }
summary:
  ar: "أبو بكر عبد الله بن أحمد المروزي القفال الصغير، شيخ الشافعية بخراسان وسيّد أعيان الخراسانيين، وأما القفال الكبير فهو الشاشي شيخ طريقة العراقيين، لكن المروزي أكثر ذكراً في كتب الفقه؛ سُمي بالقفال لأنه كان يعمل الأقفال في ابتداء أمره وبرع في صناعتها حتى صنع قفلاً بآلاته ومفتاحه وزن أربع حبات، فلما كان ابن ثلاثين سنة أحسّ من نفسه ذكاءً فأقبل على العلم {cite:shadharat-dhahab p. 208}."
  en: "Abu Bakr Abdallah b. Ahmad al-Marwazi, 'al-Qaffal al-Saghir' — head of Khurasan's Shafi'is, called 'the Locksmith' because he had practised the craft in his youth and once made a lock and key weighing four grains; feeling his own intelligence at thirty he turned to scholarship. The more-cited Qaffal of the fiqh books, he died in 417 {cite:shadharat-dhahab p. 208}."
