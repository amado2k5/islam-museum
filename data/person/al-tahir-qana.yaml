summary:
  ar: "الطاهر قانة، باحث جزائري في الاقتصاد الإسلامي، أعدّ مذكرة الماجستير «الدور التوزيعي للملكية في الاقتصاد الإسلامي: دراسة مقارنة» بقسم الشريعة في جامعة الحاج لخضر باتنة بإشراف الدكتور جمال لعمارة، ونوقشت في 27 فبراير 2008م. {cite:dawr-tawzii-milkiyya-qana-2007 p.1} {cite:dawr-tawzii-milkiyya-qana-2007 p.220}"
  en: "al-Tahir Qana, an Algerian researcher in Islamic economics, wrote the MA dissertation al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami in the Department of Shari'a at the University of El Hadj Lakhdar, Batna, under Dr Jamal Laamara; it was defended on 27 February 2008."
  ur: "الطاہر قانہ، اسلامی معاشیات کے الجزائری محقق، جنہوں نے جامعہ الحاج لخضر باتنہ کے شعبۂ شریعت میں ڈاکٹر جمال لعمارہ کی نگرانی میں ایم اے کا مقالہ «الدور التوزیعی للملکیہ فی الاقتصاد الاسلامی» لکھا، جس کا دفاع 27 فروری 2008ء کو ہوا۔"
