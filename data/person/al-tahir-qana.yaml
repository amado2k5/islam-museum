summary:
  ar: "الطاهر قانة، باحث جزائري في الاقتصاد الإسلامي، أعدّ مذكرة الماجستير «الدور التوزيعي للملكية في الاقتصاد الإسلامي: دراسة مقارنة» بقسم الشريعة في جامعة الحاج لخضر باتنة بإشراف الدكتور جمال لعمارة، ونوقشت في 27 فبراير 2008م. {cite:dawr-tawzii-milkiyya-qana-2007 p.1} {cite:dawr-tawzii-milkiyya-qana-2007 p.220}"
  en: "al-Tahir Qana, an Algerian researcher in Islamic economics, wrote the MA dissertation al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami in the Department of Shari'a at the University of El Hadj Lakhdar, Batna, under Dr Jamal Laamara; it was defended on 27 February 2008."
  fr: "al-Tahir Qana, chercheur algérien en économie islamique, a écrit la thèse de maîtrise al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami dans le département de la charia à l'Université d'El Hadj Lakhdar, Batna, sous la direction du Dr Jamal Laamara ; Il a été défendu le 27 février 2008."
  ur: "الطاہر قانہ، اسلامی معاشیات کے الجزائری محقق، جنہوں نے جامعہ الحاج لخضر باتنہ کے شعبۂ شریعت میں ڈاکٹر جمال لعمارہ کی نگرانی میں ایم اے کا مقالہ «الدور التوزیعی للملکیہ فی الاقتصاد الاسلامی» لکھا، جس کا دفاع 27 فروری 2008ء کو ہوا۔"
  es: "al-Tahir Qana, un investigador argelino en economía islámica, escribió la tesis de maestría al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami en el Departamento de Shari'a de la Universidad de El Hadj Lakhdar, Batna, bajo la dirección del Dr. Jamal Laamara; fue defendido el 27 de febrero"
  tr: "İslami ekonomi alanında Cezayirli araştırmacı Tahar Qana, Batna Hacı Lakhdar Üniversitesi Şeriat Bölümü'nde Dr. Jamal Lamara danışmanlığında \"İslami Ekonomide Mülkiyetin Dağıtıcı Rolü: Karşılaştırmalı Bir Çalışma\" başlıklı yüksek lisans tezini hazırladı. {cite:dawr-tawzii-milkiyya-qana-2007 s.1} {cite:dawr-tawzii-milkiyya-qana-2007 s.220}"
  id: "Tahar Qana, seorang peneliti ekonomi Islam asal Aljazair, menyiapkan tesis master \"Peran Distributif Kepemilikan dalam Ekonomi Islam: Studi Komparatif\" di Departemen Syariah Universitas Haj Lakhdar Batna di bawah bimbingan Dr. Jamal Lamara, yang dibahas pada 27 Februari 2008. {cite:dawr-tawzii-milkiyya-qana-2007 hlm.1} {cite:dawr-tawzii-milkiyya-qana-2007 hlm.220}"
