summary:
  en: "Wife of Ibrahim and mother of Ismail; tradition tells she was settled by Ibrahim with her infant son in the empty valley of Mecca, where the spring of Zamzam broke forth for them, and Jurhum settled nearby with her permission."
  ar: "زوج إبراهيم وأم إسماعيل؛ أسكنها إبراهيم مع رضيعها بوادٍ غير ذي زرع عند موضع البيت، فتفجرت لها بئر زمزم، وأذنت لجرهم بالنزول بمكة. وحقّق المنصور فوري أنها كانت حرة ابنة فرعون لا أمة مملوكة كما هو المعروف."
