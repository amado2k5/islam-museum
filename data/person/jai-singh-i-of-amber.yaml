summary:
  ar: "راجا جاي سينغ الأول أمير من عشيرة كاتشواها الراجبوتية، صاحب الموقع الذي بدأ عليه بناء تاج محل في أغرة سنة 1041هـ/1632م بعد التفاوض على نقل ملكيته {cite:encyclopaedia-of-islam-2 vol. 10 p. 69}. ويذكر مقال جايبور أنه حظي بمنصب ستة آلاف وبلقب ميرزا راجا من أورنكزيب، وتذكر مقالة المراثا حملته على شيفاجي سنة 1075هـ/1665م {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  en: "Raja Jai Singh I of Amber, of the Kachhwaha clan of Rajputs, owned the site on which the Taj Mahal was begun at Agra in 1041/1632, after its transfer was negotiated. The Djaypur article says he held a mansab of 6,000 and the title Mirza Raja from Awrangzib, and the Maratha article mentions his campaign against Shivaji in 1075/1665 {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  ur: "راجہ جے سنگھ اول آمبر، راجپوتوں کے کچھواہا قبیلے سے، اس جگہ کے مالک تھے جس پر 1041ھ/1632ء میں آگرہ میں تاج محل کی تعمیر شروع ہوئی، جب اس کی منتقلی پر بات چیت ہوئی۔ جے پور کا مقالہ بتاتا ہے کہ انہیں چھ ہزار کا منصب اور اورنگزیب سے مرزا راجہ کا لقب ملا، اور مراٹھا کا مقالہ 1075ھ/1665ء میں شیواجی کے خلاف ان کی مہم کا ذکر کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
