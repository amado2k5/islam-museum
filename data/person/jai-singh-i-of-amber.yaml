summary:
  ar: "راجا جاي سينغ الأول أمير من عشيرة كاتشواها الراجبوتية، صاحب الموقع الذي بدأ عليه بناء تاج محل في أغرة سنة 1041هـ/1632م بعد التفاوض على نقل ملكيته {cite:encyclopaedia-of-islam-2 vol. 10 p. 69}. ويذكر مقال جايبور أنه حظي بمنصب ستة آلاف وبلقب ميرزا راجا من أورنكزيب، وتذكر مقالة المراثا حملته على شيفاجي سنة 1075هـ/1665م {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  en: "Raja Jai Singh I of Amber, of the Kachhwaha clan of Rajputs, owned the site on which the Taj Mahal was begun at Agra in 1041/1632, after its transfer was negotiated. The Djaypur article says he held a mansab of 6,000 and the title Mirza Raja from Awrangzib, and the Maratha article mentions his campaign against Shivaji in 1075/1665 {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  ur: "راجہ جے سنگھ اول آمبر، راجپوتوں کے کچھواہا قبیلے سے، اس جگہ کے مالک تھے جس پر 1041ھ/1632ء میں آگرہ میں تاج محل کی تعمیر شروع ہوئی، جب اس کی منتقلی پر بات چیت ہوئی۔ جے پور کا مقالہ بتاتا ہے کہ انہیں چھ ہزار کا منصب اور اورنگزیب سے مرزا راجہ کا لقب ملا، اور مراٹھا کا مقالہ 1075ھ/1665ء میں شیواجی کے خلاف ان کی مہم کا ذکر کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  es: "Raja Jai Singh I de Amber, del clan Kachhwaha de los Rajputs, era propietario del terreno donde se inició la construcción del Taj Mahal en Agra en 1041/1632, tras negociarse su transferencia. El artículo de Djaypur afirma que poseía un mansab de 6.000 y el título de Mirza Raja de Awrangzib, y el artículo de Maratha menciona su campaña contra Shivaji en 1075/1665 {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  fr: "Raja Jai Singh Ier d'Amber, du clan Kachhwaha des Rajputs, possédait le terrain sur lequel le Taj Mahal fut commencé à Agra en 1041/1632, après que son transfert ait été négocié. L'article de Djaypur indique qu'il détenait un mansab de 6 000 et le titre de Mirza Raja d'Awrangzib, et l'article Maratha mentionne sa campagne contre Shivaji en 1075/1665 {cite:encyclopaedia-of-islam-2 vol. 10 p. 69} {cite:encyclopaedia-of-islam-2 vol. 2 p. 531} {cite:encyclopaedia-of-islam-2 vol. 6 p. 559}."
  tr: "Raja Jai Singh I, Kachwaha Rajput klanından bir prenstir ve 1041 Hicri/1632 AD'de Agra'da Tac Mahal'in inşaatının başladığı yerin sahibiydi; mülkiyet devri müzakerelerinden sonra yapılmıştır {cite:Encyclopaedia-of-Islam-2 cilt 10 s. 69}. Jaipur makalesinde altı bin kişilik bir mekam ve Aurangzeb'in Mirza Raja'sı unvanı verildiği belirtilirken, Maratha makalesi 1075 Hicri/1665 MS'de Shivaji'ye karşı yaptığı seferden bahseder {cite:Encyclopaedia-of-Islam-2 cilt 2 s. 531} {cite:Encyclopaedia-of-Islam-2 cilt 6 s. 559}."
  id: "Raja Jai Singh I adalah seorang pangeran dari klan Rajput Kachwaha, pemilik lokasi di mana pembangunan Taj Mahal di Agra dimulai pada tahun 1041 H/1632 M setelah bernegosiasi pengalihan kepemilikan {cite:Encyclopaedia-of-Islam-2 vol. 10 hlm. 69}. Artikel Jaipur menyebutkan bahwa ia menerima jabatan enam ribu dan gelar Mirza Raja dari Aurangzeb, dan artikel Maratha menyebutkan kampanyenya melawan Shivaji pada tahun 1075 H/1665 M {cite:Encyclopaedia-of-Islam-2 vol. 2 hlm. 531} {cite:Encyclopaedia-of-Islam-2 vol. 6 hlm. 559}."
