summary:
  ar: "بطاقة أولية لحميدة بانو بيكم، زوج همايون وأم أكبر الملقبة مريم مكاني، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمتها في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Hamida Banu Begum, wife of Humayun and mother of Akbar, titled Maryam Makani, named from an open reference description (Wikidata); her entry in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page, so no dates are given."
  es: "Ficha preliminar de Hamida Banu Begum, esposa de Humayun y madre de Akbar, titulada Maryam Makani, nombre extraído de una descripción de referencia abierta (Wikidata); su entrada en el Tarikh al-Islam de Hasan Ibrahim aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de convocation pour Hamida Banu Begum, épouse d'Humayun et mère d'Akbar, intitulée Maryam Makani, nommée d'après une description de référence ouverte (Wikidata); son entrée dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "ہمایوں کی اہلیہ اور اکبر کی والدہ حمیدہ بانو بیگم کے لیے ڈرافٹ کارڈ، مریم مکانی کے عنوان سے، کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے نامزد کیا گیا؛ حسن ابراہیم کی تاریخ الاسلام میں ان کا داخلہ ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "Humayun'un eşi ve Akbar'ın annesi Maryam Makani lakaplı Hamida Banu Beykam'ın ön kartı açık bir referans açıklamasında (Wikidata) bahsedilmiştir. Hassan İbrahim'in İslam Tarihi kitabındaki çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal untuk Hamida Banu Beykam, suami Humayun dan ibu Akbar yang dijuluki Maryam Makani, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya dalam History of Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut, sehingga tanggalnya tidak disebutkan di sini."
