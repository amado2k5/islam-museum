summary:
  ar: حليف الأنصار من بلي من قضاعة (وزعم الواقدي أنه أنصاري فردّه ابن سعد)؛ شهد عمرة الحديبية ونزلت فيه قصة الفدية لما مرّ به النبي وهو محرم والقمل يتساقط على وجهه فأمره بحلق رأسه وإطعام فرق بين ستة مساكين؛ سكن الكوفة ومات بالمدينة في سنة إحدى
    أو اثنتين أو ثلاث وخمسين.
  en: An ally of the Ansar from Bali of Quda'a (al-Waqidi claimed he was an Ansari and Ibn Sa'd rejected it); he was on the umra of al-Hudaybiyya, and the ruling on redemption was revealed over him when the Prophet passed him in ihram with lice
    falling on his face and told him to shave his head and feed six poor people; he settled in Kufa and died in Medina in 51, 52 or 53 AH by different accounts.
