summary:
  ar: "أريوس بن اصطفانوس بن بطلينس الرومي يلقب برشيد قومه وكان من علماء الروم بالعزائم، وله كتاب يذكر فيه أولاد إبليس وتفرقهم في البلاد وما يختص به كل جنس منهم في العالم والأرواح والاستهلاكات والأفعال وأنساب الجن {cite:fihrist-ibn-al-nadim p. 431}."
  en: "Arius the Roman — the Byzantine scholar of exorcism {cite:fihrist-ibn-al-nadim}"
  es: "Arrio el Romano — el erudito bizantino del exorcismo {cite:fihrist-ibn-al-nadim}"
  fr: "Arius le Romain — le savant byzantin de l'exorcisme {cite:fihrist-ibn-al-nadim}"
  ur: "Arius the Roman - exorcism کا بازنطینی عالم"
  tr: "Butlinus al-Rumi'nin oğlu Stephenus'un oğlu Arius, halkının Raşidi unvanını almış ve kararlılık konusunda Roma alimlerinden biriydi. Bir kitapta İblis çocuklarını, topraklara yayılmalarını, dünyadaki her birinin özgün özelliklerini, cinlerin ruhlarını, tüketimlerini, eylemlerini ve soy kütüklerini (atıf:Fihrist-ibn-al-Nadim s. 431} belirtmiştir."
  id: "Arius putra Stephenus putra Butlinus al-Rumi dijuluki Rashid kaumnya dan merupakan salah satu sarjana Romawi yang bertekad. Ia menulis sebuah buku yang menyebutkan anak-anak Iblis, penyebaran mereka di negeri-negeri, karakteristik khusus masing-masing dari mereka di dunia, jiwa, konsumsi, tindakan, dan silsilah jin {cite:fihrist-ibn-al-nadim hlm. 431}."
