summary:
  ar: "أحمد بن سعيد آل مكتوم (وُلد في 1 ديسمبر 1958) رجل أعمال ومسؤول إماراتي من أسرة دبي الحاكمة، وهو رئيس مجموعة الإمارات ورئيس مجلس إدارتها التنفيذي منذ إطلاق الشركة سنة 1985، ورئيس هيئة دبي للطيران المدني. وهو الابن الأصغر لحاكم دبي السابق سعيد بن مكتوم آل مكتوم، وعم حاكم دبي الحالي محمد بن راشد آل مكتوم، ويُلقّب بالرجل الذي وضع دبي على خريطة الطيران العالمية."
  en: "Ahmed bin Saeed Al Maktoum (born 1 December 1958) is an Emirati businessman and official of Dubai's ruling family, chairman and CEO of the Emirates Group since the airline's launch in 1985 and president of the Dubai Civil Aviation Authority. He is the youngest son of Dubai's former ruler Saeed bin Maktoum Al Maktoum and an uncle of Dubai's current ruler, Mohammed bin Rashid Al Maktoum, and has been called the man who put Dubai on the global aviation map."
  ur: "احمد بن سعید آل مکتوم (پیدائش 1 دسمبر 1958) دبئی کے حکمران خاندان سے تعلق رکھنے والے اماراتی کاروباری اور عہدیدار ہیں، 1985 میں ایئرلائن کے آغاز سے امارات گروپ کے چیئرمین و سی ای او اور دبئی سول ایوی ایشن اتھارٹی کے صدر۔ وہ دبئی کے سابق حاکم سعید بن مکتوم آل مکتوم کے سب سے چھوٹے صاحبزادے اور دبئی کے موجودہ حاکم محمد بن راشد آل مکتوم کے چچا ہیں، اور انھیں وہ شخص کہا گیا ہے جس نے دبئی کو عالمی ہوابازی کے نقشے پر رکھا۔"
