summary:
  ar: "أحمد بن سعيد آل مكتوم ⁦(وُلد في 1 ديسمبر 1958)⁩ رجل أعمال ومسؤول إماراتي من أسرة دبي الحاكمة، وهو رئيس مجموعة الإمارات ورئيس مجلس إدارتها التنفيذي منذ إطلاق الشركة سنة 1985، ورئيس هيئة دبي للطيران المدني. وهو الابن الأصغر لحاكم دبي السابق سعيد بن مكتوم آل مكتوم، وعم حاكم دبي الحالي محمد بن راشد آل مكتوم، ويُلقّب بالرجل الذي وضع دبي على خريطة الطيران العالمية."
  en: "Ahmed bin Saeed Al Maktoum (born 1 December 1958) is an Emirati businessman and official of Dubai's ruling family, chairman and CEO of the Emirates Group since the airline's launch in 1985 and president of the Dubai Civil Aviation Authority. He is the youngest son of Dubai's former ruler Saeed bin Maktoum Al Maktoum and an uncle of Dubai's current ruler, Mohammed bin Rashid Al Maktoum, and has been called the man who put Dubai on the global aviation map."
  ur: "احمد بن سعید آل مکتوم ⁦(پیدائش 1 دسمبر 1958)⁩ دبئی کے حکمران خاندان سے تعلق رکھنے والے اماراتی کاروباری اور عہدیدار ہیں، 1985 میں ایئرلائن کے آغاز سے امارات گروپ کے چیئرمین و سی ای او اور دبئی سول ایوی ایشن اتھارٹی کے صدر۔ وہ دبئی کے سابق حاکم سعید بن مکتوم آل مکتوم کے سب سے چھوٹے صاحبزادے اور دبئی کے موجودہ حاکم محمد بن راشد آل مکتوم کے چچا ہیں، اور انھیں وہ شخص کہا گیا ہے جس نے دبئی کو عالمی ہوابازی کے نقشے پر رکھا۔"
  es: "Ahmed bin Saeed Al Maktoum (nacido el 1 de diciembre de 1958) es un empresario emiratí y miembro de la familia gobernante de Dubái. Es presidente y director ejecutivo del Grupo Emirates desde el lanzamiento de la aerolínea en 1985 y presidente de la Autoridad de Aviación Civil de Dubái. Es el hijo menor del exgobernante de Dubái, Saeed bin Maktoum Al Maktoum, y tío del actual gobernante, Mohammed bin Rashid Al Maktoum. Se le considera el artífice de la posición de Dubái en el mapa de la aviación mundial."
  fr: "Ahmed bin Saeed Al Maktoum (né le 1er décembre 1958) est un homme d'affaires émirati et membre de la famille régnante de Dubaï. Il est président-directeur général du groupe Emirates depuis la création de la compagnie aérienne en 1985 et président de l'Autorité de l'aviation civile de Dubaï. Fils cadet de l'ancien émir de Dubaï, Saeed bin Maktoum Al Maktoum, et oncle de l'actuel émir, Mohammed bin Rashid Al Maktoum, il est considéré comme celui qui a fait de Dubaï une destination incontournable de l'aviation mondiale."
  tr: "Ahmed bin Said El Maktum (1 Aralık 1958 doğumlu), Dubai'nin yönetici ailesinden bir Emirlik iş adamı ve yetkilisidir. Emirates Grubu'nun Yönetim Kurulu Başkanı ve 1985'teki kuruluşundan bu yana İcra Kurulu Başkanı ve Dubai Sivil Havacılık Otoritesi Başkanıdır. Eski Dubai Hükümdarı Said bin Maktum El Maktum'un en küçük oğlu ve mevcut Dubai Hükümdarı Muhammed bin Raşid El Maktum'un amcasıdır. Sıklıkla Dubai'yi küresel havacılık haritasına yerleştiren adam olarak tanımlanır."
  id: "Ahmed bin Saeed Al Maktoum (lahir 1 Desember 1958) adalah seorang pengusaha dan pejabat Emirat dari keluarga penguasa Dubai. Ia adalah Ketua Emirates Group dan Ketua Eksekutifnya sejak perusahaan tersebut didirikan pada tahun 1985, serta Ketua Otoritas Penerbangan Sipil Dubai. Ia adalah putra bungsu dari mantan Penguasa Dubai, Saeed bin Maktoum Al Maktoum, dan paman dari Penguasa Dubai saat ini, Mohammed bin Rashid Al Maktoum. Ia sering digambarkan sebagai orang yang menempatkan Dubai di peta penerbangan global."
