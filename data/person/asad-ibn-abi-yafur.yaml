  ar: "أسعد بن أبي يعفر"
  en: "As'ad ibn Abi Ya'fur"
  ur: "اسعد بن ابی یعفر"
summary:
  ar: "رجل من آل يعفر كان في حبس شبام فدعاه الهادي مع غيره عند خروجه منها سنة 288هـ، فذكّرهم بما كان وقال إنه وهب لهم نفوسهم ومنّ عليهم وأطلقهم."
  en: "A man of Al Ya'fur who was in the prison of Shibam and whom al-Hadi called with others when leaving it in 288 AH, telling them he had given them their lives, showing them grace and freeing them."
  ur: "آل یعفر کا ایک شخص جو شبام کے قید خانے میں تھا اور جسے ہادی نے سنہ 288ھ میں وہاں سے نکلتے وقت دوسروں کے ساتھ بلایا، کہا کہ انہوں نے ان کی جانیں بخش دیں، ان پر احسان کیا اور انہیں رہا کر دیا۔"
