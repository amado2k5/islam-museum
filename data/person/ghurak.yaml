summary:
  ar: "غورك ملك السغد؛ استمد ملك الشاش من الطاربند على قتيبة فأوقع بهم وكسرهم فصالحه على ألفين ومائتي ألف درهم في كل عام وعلى أن يصلي في المدينة واتخذ له طعاماً فأكل قتيبة وصلى واتخذ مسجداً."
  en: "Ghurak, king of Sughd; he summoned the Shash king's aid and was broken, then truced at two hundred and two thousand yearly, prepared the food Qutayba ate, and let him pray and build a mosque in the city."
  es: "Ghurak, rey de Sughd, pidió ayuda al rey Shash y fue derrotado, luego pagó una tregua de doscientos dos mil al año, preparó la comida que comía Qutayba y le permitió rezar y construir una mezquita en la ciudad."
  fr: "Ghurak, roi de Sughd, appela à l'aide le roi de Shash, mais fut vaincu. Une trêve fut conclue à deux cent deux mille par an, il prépara la nourriture que Qutayba mangea et le laissa prier et construire une mosquée dans la ville."
  ur: "غرق، سغد کا بادشاہ؛ اس نے شاش بادشاہ کی مدد طلب کی اور ٹوٹ گیا، پھر دو لاکھ دو ہزار سال پر جنگ بندی کی، قتیبہ نے کھانا تیار کیا اور اسے شہر میں ایک مسجد بنانے کی اجازت دی۔"
  tr: "Sogdiya kralı Gorak; Kuş'un krallığını Tarband'dan aldı, Qutaybah onları yendi ve yıktı, bu yüzden onunla yılda iki bin iki yüz bin dirhem için barıştı ve Medine'de namaz kılıp ona yiyecek getireceğini söyledi. Qutaybah yedi, namaz kaldı, bir cami aldı."
  id: "Gorak, raja Sogdia; ia mengambil tahta Shash dari Tarband melawan Qutaybah, yang mengalahkan dan memecahkan mereka, sehingga ia berdamai dengannya dengan bayaran dua ribu dua ratus ribu dirham setiap tahun, dan ia akan berdoa di Madinah dan mendapatkan makanan untuknya. Qutaybah makan dan berdoa, lalu mengambil sebuah masjid."
