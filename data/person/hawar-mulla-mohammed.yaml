summary:
  ar: "لاعب كرة قدم عراقي كردي معتزل، جناح وُلد في الموصل سنة 1981. خاض 113 مباراة دولية مع العراق بين 2001 و2012 مسجلاً 20 هدفاً، وكان في الفريق الفائز بكأس آسيا 2007. تنقّلت مسيرته بين أندية العراق ولبنان وقبرص والإمارات وقطر وإيران قبل اعتزاله سنة 2015."
  en: "Kurdish Iraqi former professional footballer, a winger born in Mosul in 1981. He won 113 caps for Iraq between 2001 and 2012, scoring 20 goals, and was part of the team that won the 2007 AFC Asian Cup. His club career took him from Al-Quwa Al-Jawiya to clubs in Lebanon, Cyprus, the Emirates, Qatar and Iran before he retired in 2015."
  ur: "کرد عراقی سابق پیشہ ور فٹبالر، ونگر، 1981 میں موصل میں پیدا ہوئے۔ انہوں نے 2001 سے 2012 کے درمیان عراق کے لیے 113 بین الاقوامی میچ کھیلے، 20 گول کیے، اور 2007 کے اے ایف سی ایشیائی کپ کی فاتح ٹیم کا حصہ تھے۔ ان کا کلب کیریئر عراق، لبنان، قبرص، امارات، قطر اور ایران کے کلبوں پر محیط رہا اور وہ 2015 میں ریٹائر ہوئے۔"
