summary:
  ar: "محمد أنوشا خان (نحو 1643–1686)، خان خوارزم (خيوة) من 1663 إلى 1686، الابن الوحيد لأبي الغازي بهادر وخليفته. شارك أباه حملاته منذ صباه، ثم أغار مرارًا على خانية بخارى حتى أخذ سمرقند مؤقتًا سنة 1685، بل دخل بخارى مرة وقرأ الخطبة باسمه. بنى في خيوة مدرسة وحمّامًا وحفر قناتين كبيرتين، وراسل روسيا، ثم خلعته مؤامرة من رجال البلاط وسملت عينيه فمات بعدها."
  en: "Muhammad Anusha Khan (c. 1643-1686) was khan of Khwarazm (Khiva) from 1663 to 1686, the only son of Abu al-Ghazi Bahadur and his successor. He campaigned at his father's side from adolescence, then raided the Bukhara Khanate repeatedly, briefly took Samarkand in 1685 and once entered Bukhara itself, where the khutba was read in his name. At Khiva he built a madrasa and a bath and dug two great canals, and corresponded with Russia, before a court conspiracy deposed and blinded him and he died."
  ur: "محمد انوشہ خان (تقریباً 1643ء–1686ء) 1663ء سے 1686ء تک خوارزم (خیوہ) کے خان، ابو الغازی بہادر کے اکلوتے بیٹے اور جانشین تھے۔ نوجوانی سے والد کی مہمات میں شریک رہے، پھر بخارا خانیٹ پر بار بار حملے کیے، 1685ء میں سمرقند عارضی طور پر لیا اور ایک بار بخارا میں داخل ہو کر اپنے نام کا خطبہ پڑھوایا۔ خیوہ میں انھوں نے مدرسہ اور حمام بنوایا اور دو بڑی نہریں کھدوائیں، روس سے خط کتابت رکھی، پھر درباری سازش نے انھیں معزول کر کے نابینا کر دیا اور اس کے بعد ان کی وفات ہوئی۔"

