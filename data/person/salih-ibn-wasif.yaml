id: person/salih-ibn-wasif
class: person
label: { ar: "صالح بن وصيف" }
summary:
  ar: "استتر في سنة ست وخمسين ومائتين، وذكر الطبري من تُتبع من قواده وكتابه بعده {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. وعند المسعودي أعمل المهتدي وموسى بن بغا الحيلة في قتله فلما علم بهجومهم قاتل ومانع عن نفسه فقتل واحتز رأسه وأتي به إلى موسى، وقيل أحمي له حمام فأدخل إليه فمات فيه على حسب ما فعل بالمعتز {cite:muruj-al-dhahab p. 559}"
  tr: "256 Hicri yılında saklandı ve el-Taberi, komutanlarını takip edenleri ve kendisinden sonra yazdığı mektupları (atıf:Tabari-Tarikh-abu-al-Fadl J.9 s.440} olarak anmıştır. al-Mas'udi'ye göre, al-Muhtadi ve Musa ibn Bugha onu öldürmek için bir plan yapmışlardır. Saldırılarını öğrenince öldürdü ve kendini engelledi, böylece öldürüldü, başı kesildi ve Musa'ya getirildi. Söylenene göre, onun için banyo yapıldı, bu yüzden yerine getirildi ve orada öldü, el-Mu'tazz'a olanlara göre {atıf:Muruj-al-Dhahab, s. 559}"
  id: "Ia bersembunyi pada tahun 256 H, dan al-Tabari menyebutkan mereka yang mengikuti para komandannya serta surat-suratnya setelahnya {cite:Tabari-Tarikh-abu-al-Fadl J.9 hlm.440}. Menurut al-Mas'udi, al-Muhtadi dan Musa ibn Bugha merancang rencana untuk membunuhnya. Ketika ia mengetahui serangan mereka, ia membunuh dan mencegah dirinya sendiri, sehingga ia dibunuh, kepalanya dipenggal, dan dibawa kepada Musa. Konon sebuah tempat mandi disiapkan untuknya, sehingga ia dibawa ke tempatnya dan meninggal di sana, sesuai dengan apa yang terjadi pada al-Mu'tazz {cite:muruj-al-dhahab, hlm. 559}"
