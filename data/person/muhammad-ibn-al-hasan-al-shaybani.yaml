summary:
  ar: "القاضي أبو عبد الله صاحب أبي حنيفة، مات سنة تسع وثمانين ومائة بالري وهو مع الرشيد ودفن بها، وتطير الرشيد من وفاته لرؤيا كان رآها {cite:muruj-al-dhahab p. 331}. وعند المسعودي استعار منه الشافعي شيئاً من كتبه فلم يبعث بها فكتب إليه الشافعي أبياته التي أولها يا قل لمن لم تزعني من رآه مثله فبعث إليه بأكثر كتبه التي سأل عنها {cite:muruj-al-dhahab p. 580}، وعند ابن النديم وهو مولى لبني شيبان وولد بواسط ونشأ بالكوفة فطلب الحديث وسمع من مسعر بن كدام ومالك بن مغول وعمر بن ذر والأوزاعي والثوري وجالس أبا حنيفة وأخذ عنه فغلب عليه الرأي وقدم بغداد فنزلها وسمع منه الحديث وأخذ عنه الرأي وخرج إلى الرقة فولاه الرشيد القضاء بها ثم عزله ولما خرج الرشيد إلى خراسان صحبه فمات بالري سنة تسع وثمانين ومائة في السنة التي توفي فيها الكسائي وله ثمان وخمسون سنة، وكان ينزل بباب الشام في درب أبي حنيفة وكان يجلس في وسطه ويقرأ عليه كتبه وكان يجاوره في الدرب اليوندي الذي عمل كتاب الدولة وكان يجتمع إليه الراوندية أبناء الدولة وكان يتعمد يوم مجلس محمد أن يجيء فيجلس في المسجد ويقرأه عليهم فإذا قرأ رجل من أصحاب محمد شيئا من كتبه صاحوا به وسكتوه فترك محمد الجلوس في ذلك المسجد وصار إلى المسجد المعلق الذي بباب درب أسد مما يلي ساباط رومي فكانت الكتب تقرأ عليه هناك {cite:fihrist-ibn-al-nadim p. 287-288}"
  en: "Abu Hanifa's great disciple and qadi — dead at Rayy in 189 travelling with al-Rashid {cite:muruj-al-dhahab p. 331}."
  es: "Gran discípulo y cadí de Abu Hanifa, muerto en Rayy en 189 mientras viajaba con al-Rashid {cita:muruj-al-dhahab p. 331}."
  fr: "Le grand disciple et cadi d'Abu Hanifa — mort à Rayy en 189 voyageant avec al-Rashid {cite: muruj-al-dhahab p. 331}."
  ur: "ابوحنیفہ کے عظیم شاگرد اور قاضی - الرشید کے ساتھ سفر کرتے ہوئے 189 میں رے کے مقام پر فوت ہوئے۔ 331}۔"
  tr: "Ebu Hanifa'nın yoldaşı hakim Ebu Abdullah, 189 Hicri yılında Rayy'de el-Reşid ile birlikteyken vefat etti ve orada defnedildi. El-Reşid, ölümünden gördüğü bir vizyonla sürüklendi {atıf:Muruj-al-Dhahab, s. 331}. al-Mas'udi'ye göre, al-Shafi'i ondan bazı kitaplarını ödünç aldı ama göndermedi. Al-Shafi'i ona şiirlerini yazdı, başı şöyleydi: 'Beni bulamadıklara, onu kendisi gibi gören herkes olsun.' Sorduğu kitapların çoğunu ona gönderdi {atıf:muruj-al-dhahab s. 580}. Ve Banu Şeyban'ın özgür bir adamı olan İbn al-Nadim ile birlikte Wasit'te doğdu ve Kufe'de büyüdü. Hadis aradı ve Mas'ar ibn Kudam, Malik ibn Mughul, Umar ibn Dharr, al-Awza'i ve al-Thawri'den duydu. Ebu Hanifa ile oturdu ve ondan öğrendi, fakat görüş ona ağır geldi. Bağdat'a geldi, orada kaldı ve dinledi. Ondan rivayet eder ve görüşlerini alırdı. Rakka'ya gitti, orada el-Reşid onu yargıç olarak atadı, sonra görevden aldı. El-Reşid Horasan'a gittiğinde ona eşlik etti ve 189 H yılında, el-Kisai elli sekiz yaşında öldüğü yıl, Rayy'de öldü. Ebu Hanifa'nın yolunda Bab al-Şam'da kalırdı, ortasında oturur ve ona kitaplarını okurdu. Yundi al-Darb al-Yawdi'de yanında devlet katibi olarak çalışırdı. Reravendiler ve devletin oğulları onunla toplanırdı. Muhammed'in meclis günü gelir ve otururdu Camiyi ve o da onlara okurdu. Muhammed'in sahabelerinden biri kitaplarından bir şey okuduğunda, ona bağırır ve sustururlardı. Muhammed o camide oturmayı bıraktı ve Roma sabbatına yakın Darb Asad kapısındaki askıya alınan camiye gitti, burada ona kitaplar okundu {cite:fihrist-ibn-al-nadim s. 287-288}"
  id: "Hakim Abu Abdullah, sahabat Abu Hanifa, meninggal pada tahun 189 AH di Rayy saat bersama al-Rashid dan dimakamkan di sana. Al-Rashid terbawa dari kematiannya oleh sebuah penglihatan yang ia lihat {cite:muruj-al-dhahab, hlm. 331}. Menurut al-Mas'udi, al-Shafi'i meminjam beberapa bukunya darinya, tetapi ia tidak mengirimkannya. Al-Shafi'i menulis ayat-ayatnya, di awalnya adalah: 'Katakanlah, kepada mereka yang belum kau temukan aku, siapa pun yang melihatnya seperti dirinya.' Ia mengirimkan sebagian besar bukunya yang telah ia tanyakan {cite:muruj-al-dhahab hlm. 580}. Dan bersama Ibn al-Nadim, yang merupakan mantan Banu Shayban, ia lahir di Wasit dan dibesarkan di Kufa. Ia mencari hadis dan mendengar dari Mas'ar ibn Kudam, Malik ibn Mughul, Umar ibn Dharr, al-Awza'i, dan al-Thawri. Ia duduk bersama Abu Hanifa dan belajar darinya, tetapi pendapat menang atas dirinya. Ia datang ke Baghdad, tinggal di sana, dan mendengarkan. Ia menceritakan dari Pak Sham dan mengambil pendapat darinya. Ia pergi ke Raqqa, di mana al-Rashid mengangkatnya sebagai hakim di sana, lalu memecatnya. Ketika al-Rashid pergi ke Khurasan, ia menemaninya dan meninggal di Rayy pada tahun 189 H, tahun al-Kisai wafat pada usia lima puluh delapan tahun. Ia biasa tinggal di Bab al-Sham di jalan Abu Hanifa, duduk di tengahnya dan membacakan bukunya kepadanya. Ia berada di sebelahnya di Yundi al-Darb al-Yawdi, di mana ia bekerja sebagai juru tulis negara. Para Rarawani dan putra-putra negara berkumpul bersamanya. Pada hari sidang Muhammad, ia datang dan duduk di Masjid itu dan dia membacakannya kepada mereka. Ketika seorang pria dari sahabat Muhammad membaca sesuatu dari bukunya, mereka akan berteriak kepadanya dan membungkamnya. Muhammad berhenti duduk di masjid itu dan pergi ke masjid gantung di gerbang Darb Asad dekat Sabbat Romawi, di mana buku-buku dibacakan kepadanya {sitasi:fihrist-ibn-al-nadim hlm. 287-288}"
