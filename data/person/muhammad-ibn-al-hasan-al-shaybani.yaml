label: { ar: "محمد بن الحسن الشيباني", en: "Muhammad ibn al-Hasan al-Shaybani" }
summary:
  ar: "القاضي أبو عبد الله صاحب أبي حنيفة، مات سنة تسع وثمانين ومائة بالري وهو مع الرشيد ودفن بها، وتطير الرشيد من وفاته لرؤيا كان رآها {cite:muruj-al-dhahab p. 331}.، وعند المسعودي استعار منه الشافعي شيئاً من كتبه فلم يبعث بها فكتب إليه الشافعي أبياته التي أولها يا قل لمن لم تزعني من رآه مثله فبعث إليه بأكثر كتبه التي سأل عنها {cite:muruj-al-dhahab p. 580}، وعند ابن النديم وهو مولى لبني شيبان وولد بواسط ونشأ بالكوفة فطلب الحديث وسمع من مسعر بن كدام ومالك بن مغول وعمر بن ذر والأوزاعي والثوري وجالس أبا حنيفة وأخذ عنه فغلب عليه الرأي وقدم بغداد فنزلها وسمع منه الحديث وأخذ عنه الرأي وخرج إلى الرقة فولاه الرشيد القضاء بها ثم عزله ولما خرج الرشيد إلى خراسان صحبه فمات بالري سنة تسع وثمانين ومائة في السنة التي توفي فيها الكسائي وله ثمان وخمسون سنة، وكان ينزل بباب الشام في درب أبي حنيفة وكان يجلس في وسطه ويقرأ عليه كتبه وكان يجاوره في الدرب اليوندي الذي عمل كتاب الدولة وكان يجتمع إليه الراوندية أبناء الدولة وكان يتعمد يوم مجلس محمد أن يجيء فيجلس في المسجد ويقرأه عليهم فإذا قرأ رجل من أصحاب محمد شيئا من كتبه صاحوا به وسكتوه فترك محمد الجلوس في ذلك المسجد وصار إلى المسجد المعلق الذي بباب درب أسد مما يلي ساباط رومي فكانت الكتب تقرأ عليه هناك {cite:fihrist-ibn-al-nadim p. 287-288}"
  en: "Abu Hanifa's great disciple and qadi — dead at Rayy in 189 travelling with al-Rashid {cite:muruj-al-dhahab p. 331}."
