summary:
  ar: "ركن الدين أبو حامد محمد بن محمد السمرقندي الآمدي، فقيه حنفي مشهور بالجدل، توفي ببخارى في 9 جمادى الآخرة 615هـ/3 سبتمبر 1218م، ومن كتبه «الإرشاد» و«الطريقة العامدية في الخلاف والجدل»، ونُسب إليه نقل كتاب هندي في اليوغا باسم «أمْلَكُندا» إلى العربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 456-457}."
  en: "Rukn al-Din Abu Hamid Muhammad b. Muhammad al-Samarkandi al-Amidi, a Hanafi lawyer famous for dialectics, died at Bukhara on 9 Jumada II 615/3 September 1218. His works include al-Irshad and al-Tariqa al-'Amidiyya fi l-khilaf wa l-jadal, and his name is linked with an Arabic version of an Indian work on yoga {cite:encyclopaedia-of-islam-2 vol. 1 p. 456-457}."
