summary:
  ar: "ركن الدين أبو حامد محمد بن محمد السمرقندي الآمدي، فقيه حنفي مشهور بالجدل، توفي ببخارى في 9 جمادى الآخرة 615هـ/3 سبتمبر 1218م، ومن كتبه «الإرشاد» و«الطريقة العامدية في الخلاف والجدل»، ونُسب إليه نقل كتاب هندي في اليوغا باسم «أمْلَكُندا» إلى العربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 456-457}."
  en: "Rukn al-Din Abu Hamid Muhammad b. Muhammad al-Samarkandi al-Amidi, a Hanafi lawyer famous for dialectics, died at Bukhara on 9 Jumada II 615/3 September 1218. His works include al-Irshad and al-Tariqa al-'Amidiyya fi l-khilaf wa l-jadal, and his name is linked with an Arabic version of an Indian work on yoga {cite:encyclopaedia-of-islam-2 vol. 1 p. 456-457}."
  es: "Rukn al-Din Abu Hamid Muhammad b. Muhammad al-Samarkandi al-Amidi, un abogado hanafi famoso por su dialéctica, murió en Bujará el 9 de Jumada II de 615/3 de septiembre de 1218. Entre sus obras se incluyen al-Irshad y al-Tariqa al-'Amidiyya fi l-khilaf wa l-jadal, y su nombre está vinculado a una versión árabe de una obra india sobre yoga {cite:encyclopaedia-of-islam-2 vol. 1 p. 456-457}."
  fr: "Rukn al-Din Abu Hamid Muhammad b. Muhammad al-Samarkandi al-Amidi, juriste hanafite réputé pour ses travaux en dialectique, est décédé à Boukhara le 9 Jumada II 615/3 septembre 1218. Parmi ses œuvres figurent al-Irshad et al-Tariqa al-'Amidiyya fi l-khilaf wa l-jadal, et son nom est associé à une version arabe d'un ouvrage indien sur le yoga {cite:encyclopaedia-of-islam-2 vol. 1 p. 456-457}."
  ur: "رکن الدین ابو حامد محمد بن۔ جدلیات کے لیے مشہور حنفی وکیل محمد ال سمرقندی العمدی 9 جمادی الثانی 615/3 ستمبر 1218 کو بخارا میں وفات پا گئے۔ ان کی تصانیف میں الارشاد اور الطریقۃ العمدیہ فی الخلافۃ و الجدال شامل ہیں، اور ان کے عربی نسخے کا نام ہندوستانی تصنیف کے ساتھ منسلک ہے۔ {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1ص 456-457}۔"
  tr: "Rukn al-Din Abu Hamid Muhammad ibn Muhammad al-Samarqandi al-Amidi, diyalektiğiyle tanınan ünlü bir Hanefi hukukçusuydu. 9 Jumada al-Akhirah 615 Hicri / 3 Eylül 1218 CE'de Buhara'da vefat etti. Kitapları arasında 'Al-Irshad' ve 'The Methodical Method in Dispute and Dispute' yer alır ve Hint yoga kitabı 'Amlakanda'yı Arapçaya aktardığı kabul edilir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 456-457}."
  id: "Rukn al-Din Abu Hamid Muhammad ibn Muhammad al-Samarqandi al-Amidi adalah seorang ahli hukum Hanafi terkenal yang dikenal dengan dialektikanya. Ia meninggal di Bukhara pada 9 Jumada al-Akhirah 615 H / 3 September 1218 M. Di antara bukunya adalah 'Al-Irshad' dan 'The Methodical Method in Dispute and Dispute,' dan ia dikenal telah meneruskan sebuah buku yoga India berjudul 'Amlakanda' ke dalam bahasa Arab {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 456-457}."
