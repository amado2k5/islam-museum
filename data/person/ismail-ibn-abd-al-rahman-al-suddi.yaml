summary:
  ar: "إسماعيل بن عبد الرحمن بن أبي كريمة، أبو محمد، السدي، نسبة إلى سدة مسجد الكوفة، كان يبيع بها المقانع، تابعي صدوق يَهِم، ورُمي بالتشيع، عارف بالوقائع وأيام الناس. روى عن أنس وابن عباس، ورأى ابن عمر، ومن مصنفاته «تفسير القرآن». توفي سنة 127هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  en: "Ismail ibn Abd al-Rahman ibn Abi Karima, Abu Muhammad, al-Suddi, named after the portico of the Kufa mosque, where he sold veils. A Successor, truthful but prone to error, and accused of Shi'ism; he knew the events and days of the people. He transmitted from Anas and Ibn Abbas, saw Ibn Umar, and wrote a commentary on the Qur'an. He died in 127 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
