summary:
  ar: "إسماعيل بن عبد الرحمن بن أبي كريمة، أبو محمد، السدي، نسبة إلى سدة مسجد الكوفة، كان يبيع بها المقانع، تابعي صدوق يَهِم، ورُمي بالتشيع، عارف بالوقائع وأيام الناس. روى عن أنس وابن عباس، ورأى ابن عمر، ومن مصنفاته «تفسير القرآن». توفي سنة 127هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  en: "Ismail ibn Abd al-Rahman ibn Abi Karima, Abu Muhammad, al-Suddi, named after the portico of the Kufa mosque, where he sold veils. A Successor, truthful but prone to error, and accused of Shi'ism; he knew the events and days of the people. He transmitted from Anas and Ibn Abbas, saw Ibn Umar, and wrote a commentary on the Qur'an. He died in 127 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  es: "Ismail ibn Abd al-Rahman ibn Abi Karima, Abu Muhammad, al-Suddi, llamado así por el pórtico de la mezquita de Kufa, donde vendía velos. Un Sucesor, veraz pero propenso al error, y acusado de chiismo; conocía los acontecimientos y la época del pueblo. Transmitió de Anas e Ibn Abbas, conoció a Ibn Umar y escribió un comentario sobre el Corán. Murió en el año 127 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  fr: "Ismail ibn Abd al-Rahman ibn Abi Karima, dit Abu Muhammad ou al-Suddi, tire son nom du portique de la mosquée de Koufa où il vendait des voiles. Successeur, réputé pour sa sincérité mais parfois sujet à l'erreur, et accusé de chiisme, il connaissait bien l'histoire et la vie des gens. Il transmit les enseignements d'Anas et d'Ibn Abbas, rencontra Ibn Umar et rédigea un commentaire du Coran. Il mourut en 127 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2062}"
  ur: "اسماعیل بن عبدالرحمٰن ابن ابی کریمہ، ابو محمد، السدی، کوفہ کی مسجد کے پورٹیکو کے نام پر رکھا گیا، جہاں وہ پردے بیچتا تھا۔ ایک جانشین، سچا لیکن غلطی کا شکار، اور شیعہ مذہب کا الزام؛ وہ لوگوں کے واقعات اور دنوں کو جانتا تھا۔ انہوں نے انس اور ابن عباس سے نقل کیا، ابن عمر کو دیکھا، اور قرآن کی تفسیر لکھی۔ ان کی وفات 127ھ میں ہوئی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص2062}"
