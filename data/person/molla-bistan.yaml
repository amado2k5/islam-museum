summary:
  ar: "الملا بستان؛ قال في الكواكب: وهو ممن شرف بالقضاء كلا العسكرين الروملي والأناضولي، وكان قاضي العسكر إذا توفي نُقل إلى مكانه من جمع الرويسين وأقسم بها الملوك، وقد شملت قضاء العسكرين وهما أربعة قضاة في نحو أحد عشر شهراً، وخالف هناك في مسألة الصفة والتأمات في الجهرية ووليها، ثم انتقل في العشر الأواخر من شهر رمضان ودُفن بأدرنة {cite:shadharat-dhahab p. 386}."
  en: "Molla Bistan — one of the few to hold the qadi-'askar office of both Rumeli and Anatolia (~11 months, the two posts then four qadis); teacher of Sa'd al-Din; died in Ramadan's last ten days 977, buried at Edirne {cite:shadharat-dhahab p. 386}."
