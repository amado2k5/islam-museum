summary:
  ar: "باكوبوونو الأول (1648 – 22 شباط 1719)، وُلد باسم رادن ماس داراجات وعُرف قبل ملكه بالأمير بوغير، سوسوهونان ماتارام — نُودي به في 6 تموز 1704 وصارت كارتاسورا بيده من 17 أيلول 1705 حتى وفاته. وهو ابن أصغر لأمانغكورات الأول، دافع عن بليريد سنة 1677، وحارب أخاه غير الشقيق أمانغكورات الثاني حتى استسلامه سنة 1681، وبعد جيل أزاح ابن أخيه أمانغكورات الثالث بدعم هولندي فأسّس سلالة باكوبوونو التي ينحدر منها حكّام سوراكارتا."
  en: "Pakubuwono I (1648 – 22 February 1719), born Raden Mas Darajat and known before his reign as Prince Puger, was susuhunan of Mataram — proclaimed on 6 July 1704 and master of Kartasura from 17 September 1705 until his death. A younger son of Amangkurat I, he defended Plered in 1677, fought his half-brother Amangkurat II until his own surrender in 1681, and a generation later displaced his nephew Amangkurat III with Dutch support, founding the Pakubuwono line from which the rulers of Surakarta descend."
  ur: "پاکوبوونو اول (1648ء – 22 فروری 1719ء)، پیدائشی نام رادن ماس داراجات اور تخت سے پہلے شہزادہ پوگیر کے نام سے معروف، ماتارام کے سوسوہونان تھے — 6 جولائی 1704ء کو اعلان ہوا اور 17 ستمبر 1705ء سے وفات تک کارتاسورا ان کے قبضے میں رہا۔ امانگکورات اول کے چھوٹے بیٹے تھے؛ 1677ء میں پلیرید کا دفاع کیا، اپنے سوتیلے بھائی امانگکورات دوم سے لڑے یہاں تک کہ 1681ء میں خود ہتھیار ڈالے، اور ایک نسل بعد ولندیزی مدد سے اپنے بھتیجے امانگکورات سوم کو ہٹا کر پاکوبوونو سلسلہ قائم کیا جس سے سوراکارتا کے حکمران اترتے ہیں۔"

