summary:
  ar: "باكوبوونو الأول ⁦(1648 – 22 شباط 1719)⁩، وُلد باسم رادن ماس داراجات وعُرف قبل ملكه بالأمير بوغير، سوسوهونان ماتارام — نُودي به في 6 تموز 1704 وصارت كارتاسورا بيده من 17 أيلول 1705 حتى وفاته. وهو ابن أصغر لأمانغكورات الأول، دافع عن بليريد سنة 1677، وحارب أخاه غير الشقيق أمانغكورات الثاني حتى استسلامه سنة 1681، وبعد جيل أزاح ابن أخيه أمانغكورات الثالث بدعم هولندي فأسّس سلالة باكوبوونو التي ينحدر منها حكّام سوراكارتا."
  en: "Pakubuwono I (1648 – 22 February 1719), born Raden Mas Darajat and known before his reign as Prince Puger, was susuhunan of Mataram — proclaimed on 6 July 1704 and master of Kartasura from 17 September 1705 until his death. A younger son of Amangkurat I, he defended Plered in 1677, fought his half-brother Amangkurat II until his own surrender in 1681, and a generation later displaced his nephew Amangkurat III with Dutch support, founding the Pakubuwono line from which the rulers of Surakarta descend."
  ur: "پاکوبوونو اول ⁦(1648ء – 22 فروری 1719ء)⁩، پیدائشی نام رادن ماس داراجات اور تخت سے پہلے شہزادہ پوگیر کے نام سے معروف، ماتارام کے سوسوہونان تھے — 6 جولائی 1704ء کو اعلان ہوا اور 17 ستمبر 1705ء سے وفات تک کارتاسورا ان کے قبضے میں رہا۔ امانگکورات اول کے چھوٹے بیٹے تھے؛ 1677ء میں پلیرید کا دفاع کیا، اپنے سوتیلے بھائی امانگکورات دوم سے لڑے یہاں تک کہ 1681ء میں خود ہتھیار ڈالے، اور ایک نسل بعد ولندیزی مدد سے اپنے بھتیجے امانگکورات سوم کو ہٹا کر پاکوبوونو سلسلہ قائم کیا جس سے سوراکارتا کے حکمران اترتے ہیں۔"
  es: "Pakubuwono I (1648 – 22 de febrero de 1719), nacido Raden Mas Darajat y conocido antes de su reinado como el príncipe Puger, fue susuhunan de Mataram —proclamado el 6 de julio de 1704— y señor de Kartasura desde el 17 de septiembre de 1705 hasta su muerte. Hijo menor de Amangkurat I, defendió Plered en 1677, luchó contra su medio hermano Amangkurat II hasta su propia rendición en 1681, y una generación después derrocó a su sobrino Amangkurat III con el apoyo holandés, fundando la línea Pakubuwono de la que descienden los gobernantes de Surakarta."
  fr: "Pakubuwono Ier (1648 – 22 février 1719), né Raden Mas Darajat et connu avant son règne sous le nom de prince Puger, fut susuhunan de Mataram – proclamé le 6 juillet 1704 – et maître de Kartasura du 17 septembre 1705 jusqu'à sa mort. Fils cadet d'Amangkurat Ier, il défendit Plered en 1677, combattit son demi-frère Amangkurat II jusqu'à sa reddition en 1681, et, une génération plus tard, renversa son neveu Amangkurat III avec le soutien des Néerlandais, fondant ainsi la lignée des Pakubuwono dont descendent les souverains de Surakarta."
  tr: "Bakubuno I (1648 – 22 Şubat 1719), Raden Mas Darajat olarak doğdu ve saltanatı öncesinde Prens Bogier, Susuhonan Mataram olarak biliniyordu — 6 Temmuz 1704'te rahip olarak atandı ve 17 Eylül 1705'ten ölümüne kadar onun elinde Kartasura oldu. Amangakurat I'in küçük oğluydu, 1677'de Beliride'yi savundu ve üvey kardeşi Amangkurat II'ye karşı 1681'de teslim olana kadar savaştı. Bir nesil sonra, yeğeni Amangkurat III Hollanda'nın desteğiyle tahttan indirildi ve Surakarta hükümdarlarının soyundan gelen Bakubuno hanedanı kuruldu."
  id: "Bakubuno I (1648 – 22 Februari 1719), lahir sebagai Raden Mas Darajat dan dikenal sebelum pemerintahannya sebagai Pangeran Bogier, Susuhonan Mataram — ia ditahbiskan pada 6 Juli 1704, dan menjadi Kartasura di tangannya dari 17 September 1705 hingga kematiannya. Ia adalah putra bungsu Amangakurat I, membela Beliride pada tahun 1677, dan bertempur melawan saudara tirinya Amangkurat II hingga menyerah pada tahun 1681. Satu generasi kemudian, keponakannya Amangkurat III digulingkan dengan dukungan Belanda, mendirikan dinasti Bakubuno, dari mana para penguasa Surakarta berasal."

