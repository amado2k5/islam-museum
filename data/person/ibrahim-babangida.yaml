summary:
  ar: "جنرال وسياسي نيجيري (وُلد 1941) من مينا، حكم نيجيريا رئيسا عسكريا من انقلاب 27 أغسطس 1985 الذي أطاح ببخاري حتى تنحّيه في أغسطس 1993؛ في عهده انضمت نيجيريا إلى منظمة التعاون الإسلامي سنة 1986، وألغى انتخابات 12 يونيو 1993 التي فاز فيها ظاهريا ماشود أبيولا، فأثار أزمة الجمهورية الثالثة. تلقى في صباه تعليما إسلاميا قبل المدرسة الابتدائية."
  en: "Nigerian general and politician (born 1941) from Minna who ruled Nigeria as military president from the coup of 27 August 1985 that overthrew Buhari until he stepped aside in August 1993. Under him Nigeria joined the Organisation of Islamic Cooperation in 1986, and he annulled the 12 June 1993 election apparently won by Moshood Abiola, precipitating the Third Republic crisis. As a boy he received early Islamic education before primary school."
  ur: "نائجریائی جرنیل و سیاست دان (پیدائش 1941ء)، منا سے تعلق؛ 27 اگست 1985 کی بغاوت میں بوحاری کو ہٹا کر فوجی صدر بنے اور اگست 1993 میں عہدہ چھوڑنے تک حکمران رہے؛ ان کے دور میں نائجریا 1986 میں اسلامی تعاون تنظیم کا رکن بنا، اور انھوں نے 12 جون 1993 کے انتخابات منسوخ کیے جن میں مشود ابیولا بظاہر کامیاب ہوئے تھے۔ بچپن میں پرائمری اسکول سے قبل اسلامی تعلیم حاصل کی۔"
