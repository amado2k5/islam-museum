summary:
  ar: "سياسي إسكتلندي من حزب العمال، وُلد في غلاسكو سنة 1983 لأبوين باكستانيين مسلمين. درس طب الأسنان في جامعة غلاسكو وعمل طبيب أسنان في بيزلي، وانتُخب سنة 2010 نائبا عن غلاسكو الوسطى خلفا لوالده محمد سرور، أول نائب مسلم في بريطانيا، ثم عضوا في البرلمان الإسكتلندي منذ 2016، وزعيما لحزب العمال الإسكتلندي (2021-2026) فكان أول مسلم وأول شخص من أصل آسيوي يزعم حزبا سياسيا كبيرا في بريطانيا، ثم وزير دولة للتجارة منذ يوليو 2026 ونال لقب بارون سرور."
  en: "Scottish Labour politician, born in Glasgow in 1983 to Pakistani Muslim parents. He studied dentistry at the University of Glasgow and worked as a dentist in Paisley, was elected MP for Glasgow Central in 2010 succeeding his father Mohammad Sarwar, Britain's first Muslim MP, has been a Member of the Scottish Parliament since 2016, led the Scottish Labour Party from 2021 to 2026 as the first Muslim and the first person of Asian descent to lead a major UK political party, and has been Minister of State for Trade since July 2026, created Baron Sarwar."
  ur: "اسکاٹش لیبر سیاست دان، جو 1983 میں گلاسگو میں پاکستانی مسلم والدین کے ہاں پیدا ہوئے۔ انھوں نے یونیورسٹی آف گلاسگو سے دندان سازی پڑھی اور پیزلی میں دندان ساز رہے، 2010 میں اپنے والد محمد سرور — برطانیہ کے پہلے مسلم رکنِ پارلیمان — کے جانشین کے طور پر گلاسگو سینٹرل سے رکنِ پارلیمان منتخب ہوئے، 2016 سے اسکاٹش پارلیمان کے رکن ہیں، 2021ء سے 2026ء تک اسکاٹش لیبر پارٹی کے قائد رہے — کسی بڑی برطانوی سیاسی جماعت کی قیادت کرنے والے پہلے مسلمان اور پہلے ایشیائی نژاد شخص — اور جولائی 2026 سے وزیرِ مملکت برائے تجارت ہیں اور بیرن سرور بنائے گئے۔"
