label: { ar: "جديع الكرماني" }
gender: male
roles: [military]
summary:
  ar: "جديع الكرماني، زعيم قوة اليمنية وربيعة في خراسان إبان الثورة العباسية؛ كانت الساحة الخراسانية أربع قوى متنافسة — الدولة الأموية بزعامة نصر بن سيار، واليمنية وربيعة بزعامة جديع، والخوارج الحرورية بزعامة شيبان الحروري، والثورة العباسية بقيادة أبي مسلم — فتعاون أبو مسلم مع جديع ثم مع ابنه علي بعده، ومع شيبان الحروري للإطاحة بالأمويين، ثم زرع الشقاق بين الوالي الأموي وزعماء القبائل وتخلص أخيراً من شيبان ومن ابني جديع علي وعثمان {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  en: "Juday' al-Kirmani — leader of the Yamani-Rabi'a bloc in revolutionary Khurasan, ally then victim of Abu Muslim's divide-and-rule {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  es: "Juday' al-Kirmani, líder del bloque Yamani-Rabi'a en el revolucionario Khurasan, aliado y luego víctima del programa divide y vencerás de Abu Muslim {citar:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  fr: "Juday' al-Kirmani — chef du bloc Yamani-Rabi'a dans le Khurasan révolutionnaire, allié puis victime du diviser pour régner d'Abu Muslim {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  ur: "جودائے الکرمانی - انقلابی خراسان میں یمنی-ربیعہ بلاک کا رہنما، اس کے بعد ابو مسلم کی تقسیم اور حکمرانی کا شکار ہوا۔ 24-25}۔"
  tr: "Abbasi devrimi sırasında Horasan'daki Yemenli ve Rabi'ah güçlerinin lideri Cadi' el-Kirmani; Horasani arenası dört rakip güçten oluşuyordu — Nasr bin Sayyar liderliğindeki Emevi devleti, Jadi' liderliğindeki Yemenli ve Rabi'ah, Şeyban el-Haruri liderliğindeki Haruri Harici ve Ebu Müslüm liderliğindeki Abbasi isyanı — Ebu Müslim, önce oğlu Ali ve Şeyban el-Haruri ile işbirliği yaparak Emevileri devirmek, ardından Emevi valisi ile aşiret liderleri arasında anlaşmazlık tohumu yaratmak ve sonunda Şeyban ile Cadi' Ali ile Osman oğullarını ortadan kaldırmak için işbirliği yaptı {cite:Tarikh-dawla-abbasiyya-taqquş s. 24-25}."
  id: "Jadi' al-Kirmani, pemimpin pasukan Yaman dan Rabi'ah di Khurasan selama revolusi Abbasiyah; arena Khorasani terdiri dari empat kekuatan saingan — negara Umayyah yang dipimpin oleh Nasr ibn Sayyar, negara Yaman dan Rabi'ah di bawah Jadi', Kharijit Haruri yang dipimpin oleh Shayban al-Haruri, dan pemberontakan Abbasiyah yang dipimpin oleh Abu Muslim — Abu Muslim bekerja sama dengan Juday, kemudian dengan putranya Ali setelahnya, dan dengan Shayban al-Haruri untuk menggulingkan Umayyah, kemudian menebar perselisihan antara gubernur Umayyah dan para pemimpin suku, dan akhirnya menyingkirkan Shayban dan putra-putra Jadi' Ali dan Uthman {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 24-25}."
