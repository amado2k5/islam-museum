summary:
  ar: "جديع الكرماني، زعيم قوة اليمنية وربيعة في خراسان إبان الثورة العباسية؛ كانت الساحة الخراسانية أربع قوى متنافسة — الدولة الأموية بزعامة نصر بن سيار، واليمنية وربيعة بزعامة جديع، والخوارج الحرورية بزعامة شيبان الحروري، والثورة العباسية بقيادة أبي مسلم — فتعاون أبو مسلم مع جديع ثم مع ابنه علي بعده، ومع شيبان الحروري للإطاحة بالأمويين، ثم زرع الشقاق بين الوالي الأموي وزعماء القبائل وتخلص أخيراً من شيبان ومن ابني جديع علي وعثمان {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
  en: "Juday' al-Kirmani — leader of the Yamani-Rabi'a bloc in revolutionary Khurasan, ally then victim of Abu Muslim's divide-and-rule {cite:tarikh-dawla-abbasiyya-taqqush p. 24-25}."
