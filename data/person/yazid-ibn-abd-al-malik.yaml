id: person/yazid-ibn-abd-al-malik
class: person
label: { ar: "يزيد بن عبد الملك" }
summary:
  ar: "الخليفة الأموي التاسع، أبو خالد، ولد سنة إحدى وسبعين وولي الخلافة بعد عمر بن عبد العزيز بعهد من أخيه سليمان، فلما ولي قال سيروا بسيرة عمر بن عبد العزيز فأتي بأربعين شيخاً فشهدوا ما على الخلفاء حساب ولا عذاب، وقال ابن الماجشون أقام أربعين يوماً يسير بسيرة عمر ثم عدل، وفي سنة اثنتين خرج عليه يزيد بن المهلب فهزمه مسلمة بن عبد الملك بالعقر، مات أواخر شعبان سنة خمس ومئة {cite:tarikh-khulafa-minhaj-1434 p. 399-400}.، وعند المسعودي ملك يوم توفي عمر لخمس بقين من رجب سنة إحدى ومائة ويكنى أبا خالد وأمه عاتكة بنت يزيد بن معاوية وتوفي بأربد من أرض البلقاء لخمس بقين من شعبان سنة خمس ومائة وهو ابن سبع وثلاثين سنة فكانت ولايته أربع سنين وشهراً ويومين، وغلبت عليه جارية يقال لها سلامة القس اشتراها من سهيل بن عبد الرحمن بن عوف بثلاثة آلاف دينار ثم غلبت عليه حبابة بعد عذل أخيه مسلمة له {cite:muruj-al-dhahab p. 185}"
  en: "The ninth Umayyad caliph, Abu Khalid, born in year 71; he took the caliphate after Umar ibn Abd al-Aziz by his brother Sulayman's designation. On accession he declared 'follow the sira of Umar ibn Abd al-Aziz' — forty elders testified there is no reckoning or torment upon caliphs — yet per Ibn al-Majishun he kept Umar's ways forty days then turned aside. In year two Yazid ibn al-Muhallab rose and was routed by Maslama ibn Abd al-Malik at al-Aqr. He died in late Sha'ban 105 {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
