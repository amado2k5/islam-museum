id: person/yazid-ibn-abd-al-malik
education:
  did_you_know:
    ar: "يزيد بن عبد الملك تاسع الخلفاء الأمويين، ولي الخلافة بعهد أخيه سليمان بعد عمر بن عبد العزيز سنة ١٠١هـ."
    en: "Yazid ibn Abd al-Malik, the ninth Umayyad caliph, succeeded in 101 AH by his brother Sulayman's appointment after Umar ibn Abd al-Aziz."
    ur: "یزید بن عبدالملک، نویں اموی خلیفہ، 101ھ میں اپنے بھائی سلیمان کے عہد سے عمر بن عبدالعزیز کے بعد خلافت پر بیٹھا۔"
    sources: [source/umayyad-birth-to-fall-2006, source/tarikh-khulafa-minhaj-1434]
class: person
label: { ar: "يزيد بن عبد الملك" }
summary:
  ar: "الخليفة الأموي التاسع، أبو خالد، ولد سنة إحدى وسبعين وولي الخلافة بعد عمر بن عبد العزيز بعهد من أخيه سليمان، فلما ولي قال سيروا بسيرة عمر بن عبد العزيز فأتي بأربعين شيخاً فشهدوا ما على الخلفاء حساب ولا عذاب، وقال ابن الماجشون أقام أربعين يوماً يسير بسيرة عمر ثم عدل، وفي سنة اثنتين خرج عليه يزيد بن المهلب فهزمه مسلمة بن عبد الملك بالعقر، مات أواخر شعبان سنة خمس ومئة {cite:tarikh-khulafa-minhaj-1434 p. 399-400}. وعند المسعودي ملك يوم توفي عمر لخمس بقين من رجب سنة إحدى ومائة ويكنى أبا خالد وأمه عاتكة بنت يزيد بن معاوية وتوفي بأربد من أرض البلقاء لخمس بقين من شعبان سنة خمس ومائة وهو ابن سبع وثلاثين سنة فكانت ولايته أربع سنين وشهراً ويومين، وغلبت عليه جارية يقال لها سلامة القس اشتراها من سهيل بن عبد الرحمن بن عوف بثلاثة آلاف دينار ثم غلبت عليه حبابة بعد عذل أخيه مسلمة له {cite:muruj-al-dhahab p. 185}، وعند المسعودي أمر رجلاً أن يأتيه بجاريته تغنيه ثلاثة أصوات فغناها الفتى ثم شرب رطل خمر وصعد قبة فرمى بنفسه على دماغه فمات، فلما حملوها إلى أهله جذبت نفسها وأنشأت من مات عشقاً فليمت هكذا لا خير في عشق بلا موت ورمت بنفسها فماتت، وقيل إنه كان سليمان بن عبد الملك {cite:muruj-al-dhahab p. 487-488} ويذكر الكتاب أن سليمان جعله ولياً للعهد من بعد عمر بن عبد العزيز. {cite:salabi-umayyad-state-2020 p.184} ويذكر الكتاب أنه ولد بدمشق سنة 72هـ على الأرجح، وأنه تربى على علماء كالضحاك بن مزاحم وعامر بن شراحيل وإسماعيل بن أبي المهاجر والزهري، وأنه بويع بعد عمر بن عبد العزيز في رجب سنة 101هـ بعهد من سليمان. ويذكر أنه سار في أول حكمه بسيرة عمر، ثم لم يستطع المواصلة، وأنه عزل عبد الرحمن بن الضحاك عن إمرة الحرمين سنة 104هـ لأنه خطب فاطمة بنت الحسين فامتنعت وشكت إليه، وأن العلماء تراجعوا عن مشاركتهم في عهده. ويذكر الكتاب أن هشاماً أخاه كتب إليه يستبطئ وفاته، فرد عليه يزيد بأبيات فارتحل هشام إليه وبقي في جواره حتى مات يزيد. {cite:salabi-umayyad-state-2020 p.425-429} ويذكر الكتاب أنه أبقى على الوالي في كل إقليم يعمل بسلطة الخليفة، فأعاد ضم الولايات لبعض القادة، فجمع العراقين لمسلمة بن عبد الملك، ثم لعمر بن هبيرة، وجمع المدينة ومكة والطائف لعبد الواحد النضري، وأعاد الأندلس تابعة لإفريقية، وأعاد أسامة بن زيد على خراج مصر. وكان يزيد يعاقب من أهل المالية بالتشديد، ومنع بيع الأراضي الخراجية كما فعل عمر. ويذكر الكتاب أن سياسة يزيد عادت إلى نهج من سبقه من بني أمية، وأنه أخمد الحركات الداخلية وصد القوى الخارجية. {cite:salabi-umayyad-state-2020 p.433-436} ويذكر الكتاب أن يزيد استخدم العطاء لأهداف سياسية، وأعاد الجزية على من أسلم فنقض أهل ما وراء النهر عهدهم، وعاد يزيد إلى غزو البحر وصقلية وسردينيا، وفي سنة 101هـ عهد بقيادة الغزو في الأندلس إلى السمح بن مالك. {cite:salabi-umayyad-state-2020 p.437-446}"
  en: "The ninth Umayyad caliph, Abu Khalid, born in year 71; he took the caliphate after Umar ibn Abd al-Aziz by his brother Sulayman's designation. On accession he declared 'follow the sira of Umar ibn Abd al-Aziz' — forty elders testified there is no reckoning or torment upon caliphs — yet per Ibn al-Majishun he kept Umar's ways forty days then turned aside. In year two Yazid ibn al-Muhallab rose and was routed by Maslama ibn Abd al-Malik at al-Aqr. He died in late Sha'ban 105 {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  es: "El noveno califa omeya, Abu Khalid, nació en el año 71; tomó el califato después de Umar ibn Abd al-Aziz por designación de su hermano Sulayman. Al ascender al trono, declaró: «Seguid la sira de Umar ibn Abd al-Aziz» —cuarenta ancianos testificaron que no hay castigo ni castigo para los califas—, sin embargo, según Ibn al-Majishun, siguió las costumbres de Umar durante cuarenta días y luego se apartó. En el año dos, Yazid ibn al-Muhallab se alzó y fue derrotado por Maslama ibn Abd al-Malik en al-Aqr. Murió a finales de Sha'ban 105 {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  fr: "Le neuvième calife omeyyade, Abou Khalid, né en l'an 71, accéda au califat après Omar ibn Abd al-Aziz, désigné par son frère Sulayman. À son accession au califat, il déclara: « Suivez la voie d'Omar ibn Abd al-Aziz » – quarante anciens attestèrent qu'aucun jugement ni châtiment ne s'abat sur les califes – mais, selon Ibn al-Majishun, il suivit les préceptes d'Omar pendant quarante jours avant de s'en détourner. La deuxième année, Yazid ibn al-Muhallab se souleva et fut défait par Maslama ibn Abd al-Malik à al-Aqr. Il mourut à la fin du mois de Sha'ban 105 (voir: Tarikh-Khulafa-Minhaj-1434, p. 399-400)."
  ur: "نویں اموی خلیفہ ابو خالد، سنہ 71 میں پیدا ہوئے۔ اس نے عمر بن عبدالعزیز کے بعد اپنے بھائی سلیمان کے عہدہ سے خلافت سنبھالی۔ الحاق پر اس نے عمر بن عبدالعزیز کی سیرت کی پیروی کا اعلان کیا - چالیس بزرگوں نے گواہی دی کہ خلفاء پر کوئی حساب یا عذاب نہیں ہے - پھر بھی ابن المجشن کے مطابق اس نے عمر کے طریقے کو چالیس دن تک برقرار رکھا پھر پیچھے ہٹ گیا۔ سال دو میں یزید ابن المحلب اٹھ کھڑا ہوا اور اسے مسلمہ بن عبد الملک نے العقر میں شکست دی۔ آپ کی وفات شعبان کے اواخر 105 میں ہوئی۔ 399-400}۔"
  tr: "Dokuzuncu Emevi Halifesi Ebu Halid, 71 Hicri yılında doğdu ve kardeşi Süleyman'ın hükümdarlığı sırasında Ömer bin Abdülaziz'den sonra halifeliği üstlendi. Vali olduğunda, 'Ömer bin Abdülaziz'in örneğini takip edin.' dedi. Halifelerin hesap ve cezasına tanıklık etmek üzere kırk şeyh getirildi. İbn al-Mecsun, Ömer'in davranışından sonra kırk gün kaldığını ve sonra uyum sağladığını söyledi. İkinci yıl, Yezid ibn el-Muhallab ona karşı isyan etti, ancak Müslimah bin Abdülmelik onu 'al-'Aqr ile yendi. Şa'ban'ın sonunda, 105 Hicr yılında öldü {atıf:Tarikh-khulafa-minhaj-1434, s. 399-400}. El-Mes'udi, beş yıl önce Ömer öldüğü gün, yüz bir yılın Recep'inde hüküm sürdü. Lakabı Ebu Haliddi, annesi ise Atikah bint Yezid ibn Muaviyah'dı. Yüz otuz yedi yılında, Şaban ayının beşinci gününde Balka topraklarında İrbid'de öldü, bu yüzden hükümdarlığı dört yıl, iki ay ve iki gün sürdü. Suhail ibn Abd al-Rahman ibn Awf'tan üç bin dinara satın aldığı Selame el-Qass adında bir köle kız tarafından ezildi. Sonra Hababa, kardeşi onu küçük düşürdükten sonra, kendisine Müslüman olan biri olarak galip geldi. {alıntı: Muruj-al-Dhahab s. 185} ve el-Mes'udi'ye göre, bir adama hizmetçisini üç ses söyleyerek getirmesini emretti, çocuk da şarkı söyledi. Sonra bir kilo şarap içti, bir kubbeye tırmandı, başına atladı ve öldü. Onu ailesine getirdiklerinde, Süleyman kendini çekti ve aşktan ölen birini büyüttü, böylece öldü. Aşkta ölüm olmadan iyilik yoktur, o da kendini attı ve öldü. Süleyman bin Abdülmelik olduğu söylenir {atıf:muruj-al-dhahab s. 487-488}. Kitapta Süleyman'ın onu Ömer bin Abdülaziz'den sonra veliaht prens olarak atadığı belirtilir. {kaynak:salabi-umayyad-state-2020 s.. 184} Kitap, muhtemelen 72 H yılında Şam'da doğduğunu ve Al-Dahhak ibn Muzahim, Emir ibn Sharahil, İsmail ibn Ebi Al-Muhacir ve Al-Zuhri gibi alimler tarafından yetiştirildiğini ve Süleyman döneminde Cumer ibn Abdülaziz'in Rajab 101 H'de ona bağlılık yemini ettiğini belirtir. Saltanatının başında Ömer'in hükümdarlığını takip ettiği belirtilir yol devam edememiş ve Abdurrahman ibn Al-Dahhak'ın 104 Hicri yılında Fatimah bint al-Hüseyin'e evlenme teklif ettiği için iki Mescid'in liderliğinden alındığı, ancak Fatimah reddedip şikayet ettiğini ve alimlerin saltanatındaki katılımlarından çekildiğini belirtmiştir. Kitapta, kardeşi Hişam'ın ölümünü ertelemek için ona yazdığı ve Yezid'in dizelerle karşılık verdiği, böylece Hişam ona gidip Yezid'in ölümüne kadar yanında kaldığı belirtilir. {cite:Salabi-umayyad-state-2020 s.425-429} Kitapta, halifenin yetkisi altında çalışan her bölgede valiyi tuttuğu, böylece bazı komutanlar için vilayetleri birleştirdiği, Iraklıları Maslama ibn Abdülmelik, ardından Ömer bin Hubayra komutasında birleştirdiği, Medine, Mekke ve Taif'i Abdülvahid el-Nadari komutasında birleştirdiği, el-Endülüs'ü İfrikiye'ye bağlı olarak geri getirdiği ve Usama bin Zayd'i Mısır'ın vergi geliri olarak geri getirdiği belirtilir. Yazid, maliye otoriteleri tarafından sıkı önlemler ve vergi arazilerinin satışının yasaklanmasıyla cezalandırıldı; tıpkı Ömer gibi. Kitap, Yezid'in politikasının selefi Emevi yaklaşımına geri döndüğünü, iç hareketleri bastırdığını ve dış güçleri püskürttüğünü belirtir. {cite:salabi-umayyad-state-2020 s.433-436} Kitap, Yazid'in bağışı siyasi amaçlarla kullandığını, İslam'a geçenlere cizyeyi geri verdiğini, böylece Transoksiya halkının sözünü bozduğunu ve Yezid'in Sicilya ile Sardinya'ya karşı deniz seferlerine devam ettiğini belirtir. 101 Hicri yılında, Endülüs'teki fetihlerin liderliğini El-Samh bin Malik'e emanet etti. {cite:Salabi-Umayyad-state-2020 s.437-446}"
  id: "Khalifah Umayyah kesembilan, Abu Khalid, lahir pada tahun ketujuh puluh satu H dan mengambil alih kekhalifahan setelah Umar ibn Abd al-Aziz selama masa pemerintahan saudaranya Sulayman. Ketika ia menjadi gubernur, ia berkata, 'Ikuti contoh Umar ibn Abd al-Aziz.' Empat puluh sheikh dibawa untuk menjadi saksi atas perhitungan dan hukuman para khalifah. Ibn al-Majshun mengatakan ia tinggal selama empat puluh hari setelah perilaku Umar dan kemudian menyesuaikan diri. Pada tahun kedua, Yazid ibn al-Muhallab memberontak melawannya, tetapi Muslimah ibn Abd al-Malik mengalahkannya dengan 'al-'Aqr. Ia meninggal pada akhir Sha'ban tahun 105 H {cite:Tarikh-khulafa-minhaj-1434, hlm. 399-400}. Al-Mas'udi memerintah pada hari Umar wafat lima tahun lalu di Rajab pada tahun seratus satu. Ia dijuluki Abu Khalid, dan ibunya adalah Atikah bint Yazid ibn Muawiyah. Ia meninggal di Irbid di tanah Balqa pada tanggal lima Sha'ban pada tahun seratus tiga puluh tujuh tahun, sehingga pemerintahannya berlangsung selama empat tahun, dua bulan, dan dua hari. Ia dikalahkan oleh seorang gadis budak bernama Salama al-Qass, yang dibelinya dari Suhail ibn Abd al-Rahman ibn Awf seharga tiga ribu dinar. Kemudian Hababa menang setelah saudaranya mempermalukannya, seorang Muslim baginya. {kutip: Muruj-al-Dhahab hlm. 185} dan menurut al-Mas'udi ia memerintahkan seorang pria untuk membawa pelayannya kepadanya sambil menyanyikan tiga suara, yang dinyanyikan oleh anak itu. Kemudian ia minum satu pon anggur dan memanjat kubah, melompat ke kepalanya, lalu meninggal. Ketika mereka membawanya ke keluarganya, ia menarik dirinya dan membangkitkan seseorang yang meninggal karena cinta, maka ia meninggal. Tidak ada gunanya cinta tanpa kematian, dan ia meninggal dunia. Dikatakan bahwa ia adalah Sulayman ibn Abd al-Malik {cite:muruj-al-dhahab hlm. 487-488}. Kitab tersebut menyebutkan bahwa Sulayman mengangkatnya sebagai putra mahkota setelah Umar ibn Abd al-Aziz. {cite:salabi-umayyad-state-2020 hlm. 184} Buku tersebut menyebutkan bahwa ia kemungkinan besar lahir di Damaskus pada tahun 72 H, dan bahwa ia dibesarkan oleh ulama seperti Al-Dahhak ibn Muzahim, Amir ibn Sharahil, Ismail ibn Abi Al-Muhajir, dan Al-Zuhri, serta bahwa ia telah bersumpah setia setelah Umar ibn Abd al-Aziz pada Rajab 101 H selama masa pemerintahan Salomo. Disebutkan bahwa pada awal pemerintahannya, ia mengikuti Umaran namun tidak dapat dilanjutkan, dan Abd al-Rahman ibn Al-Dahhak diberhentikan dari kepemimpinan Dua Masjid Suci pada tahun 104 H karena ia melamar Fatimah bint al-Husayn, yang menolak dan mengeluh kepadanya, serta para ulama menarik diri dari partisipasi mereka dalam pemerintahannya. Buku tersebut menyebutkan bahwa Hisham, saudaranya, menulis surat kepadanya untuk menunda kematiannya, dan Yazid membalas dengan ayat-ayat, sehingga Hisham datang kepadanya dan tinggal bersamanya hingga Yazid wafat. {cite:Salabi-Umayyad-state-2020 hlm.425-429} Buku tersebut menyebutkan bahwa ia mempertahankan gubernur di setiap wilayah yang bekerja di bawah otoritas khalifah, sehingga ia menyatukan kembali provinsi-provinsi untuk beberapa komandan, menyatukan kembali orang Irak di bawah Maslama ibn Abd al-Malik, kemudian Umar ibn Hubayra, menggabungkan Madinah, Mekah, dan Taif di bawah Abd al-Wahid al-Nadari, mengembalikan al-Andalus sebagai bawahan Ifriqiya, dan mengembalikan Usama ibn Zayd sebagai pendapatan pajak Mesir. Yazid dihukum oleh otoritas keuangan dengan tindakan ketat dan larangan penjualan tanah pajak seperti yang dilakukan Umar. Buku tersebut menyebutkan bahwa kebijakan Yazid kembali ke pendekatan pendahulunya dari Umayyah, menekan gerakan internal dan mengusir kekuatan eksternal. {cite:salabi-umayyad-state-2020 hlm.433-436} Buku tersebut menyebutkan bahwa Yazid menggunakan sumbangan tersebut untuk tujuan politik, mengembalikan jizya kepada mereka yang memeluk Islam, sehingga rakyat Transoxiana mengingkari janji mereka, dan Yazid melanjutkan kampanye lautnya melawan Sisilia dan Sardinia. Pada tahun 101 H, ia mempercayakan kepemimpinan penaklukan di al-Andalus kepada Al-Samh ibn Malik. {cite:salabi-umayyad-state-2020 hlm.437-446}"
