label: { ar: "يزيد بن عبد الملك" }
summary:
  ar: "الخليفة الأموي التاسع، أبو خالد، ولد سنة إحدى وسبعين وولي الخلافة بعد عمر بن عبد العزيز بعهد من أخيه سليمان، فلما ولي قال سيروا بسيرة عمر بن عبد العزيز فأتي بأربعين شيخاً فشهدوا ما على الخلفاء حساب ولا عذاب، وقال ابن الماجشون أقام أربعين يوماً يسير بسيرة عمر ثم عدل، وفي سنة اثنتين خرج عليه يزيد بن المهلب فهزمه مسلمة بن عبد الملك بالعقر، مات أواخر شعبان سنة خمس ومئة {cite:tarikh-khulafa-minhaj-1434 p. 399-400}. وعند المسعودي ملك يوم توفي عمر لخمس بقين من رجب سنة إحدى ومائة ويكنى أبا خالد وأمه عاتكة بنت يزيد بن معاوية وتوفي بأربد من أرض البلقاء لخمس بقين من شعبان سنة خمس ومائة وهو ابن سبع وثلاثين سنة فكانت ولايته أربع سنين وشهراً ويومين، وغلبت عليه جارية يقال لها سلامة القس اشتراها من سهيل بن عبد الرحمن بن عوف بثلاثة آلاف دينار ثم غلبت عليه حبابة بعد عذل أخيه مسلمة له {cite:muruj-al-dhahab p. 185}، وعند المسعودي أمر رجلاً أن يأتيه بجاريته تغنيه ثلاثة أصوات فغناها الفتى ثم شرب رطل خمر وصعد قبة فرمى بنفسه على دماغه فمات، فلما حملوها إلى أهله جذبت نفسها وأنشأت من مات عشقاً فليمت هكذا لا خير في عشق بلا موت ورمت بنفسها فماتت، وقيل إنه كان سليمان بن عبد الملك {cite:muruj-al-dhahab p. 487-488} ويذكر الكتاب أن سليمان جعله ولياً للعهد من بعد عمر بن عبد العزيز. {cite:salabi-umayyad-state-2020 p.184} ويذكر الكتاب أنه ولد بدمشق سنة 72هـ على الأرجح، وأنه تربى على علماء كالضحاك بن مزاحم وعامر بن شراحيل وإسماعيل بن أبي المهاجر والزهري، وأنه بويع بعد عمر بن عبد العزيز في رجب سنة 101هـ بعهد من سليمان. ويذكر أنه سار في أول حكمه بسيرة عمر، ثم لم يستطع المواصلة، وأنه عزل عبد الرحمن بن الضحاك عن إمرة الحرمين سنة 104هـ لأنه خطب فاطمة بنت الحسين فامتنعت وشكت إليه، وأن العلماء تراجعوا عن مشاركتهم في عهده. ويذكر الكتاب أن هشاماً أخاه كتب إليه يستبطئ وفاته، فرد عليه يزيد بأبيات فارتحل هشام إليه وبقي في جواره حتى مات يزيد. {cite:salabi-umayyad-state-2020 p.425-429} ويذكر الكتاب أنه أبقى على الوالي في كل إقليم يعمل بسلطة الخليفة، فأعاد ضم الولايات لبعض القادة، فجمع العراقين لمسلمة بن عبد الملك، ثم لعمر بن هبيرة، وجمع المدينة ومكة والطائف لعبد الواحد النضري، وأعاد الأندلس تابعة لإفريقية، وأعاد أسامة بن زيد على خراج مصر. وكان يزيد يعاقب من أهل المالية بالتشديد، ومنع بيع الأراضي الخراجية كما فعل عمر. ويذكر الكتاب أن سياسة يزيد عادت إلى نهج من سبقه من بني أمية، وأنه أخمد الحركات الداخلية وصد القوى الخارجية. {cite:salabi-umayyad-state-2020 p.433-436} ويذكر الكتاب أن يزيد استخدم العطاء لأهداف سياسية، وأعاد الجزية على من أسلم فنقض أهل ما وراء النهر عهدهم، وعاد يزيد إلى غزو البحر وصقلية وسردينيا، وفي سنة 101هـ عهد بقيادة الغزو في الأندلس إلى السمح بن مالك. {cite:salabi-umayyad-state-2020 p.437-446}"
  en: "The ninth Umayyad caliph, Abu Khalid, born in year 71; he took the caliphate after Umar ibn Abd al-Aziz by his brother Sulayman's designation. On accession he declared 'follow the sira of Umar ibn Abd al-Aziz' — forty elders testified there is no reckoning or torment upon caliphs — yet per Ibn al-Majishun he kept Umar's ways forty days then turned aside. In year two Yazid ibn al-Muhallab rose and was routed by Maslama ibn Abd al-Malik at al-Aqr. He died in late Sha'ban 105 {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
