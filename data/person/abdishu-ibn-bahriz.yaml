id: person/abdishu-ibn-bahriz
class: person
label: { ar: "عبد يشوع بن بهرير", en: "Abdishu b. Bahriz" }
summary:
  ar: "حبيب بن بهرير واسمه عبد يشوع، كان أولاً مطران حران ثم صار مطران الموصل وحزة، من حكام النصارى في الشريعة والفتاوى له رسائل وكتب منها كتاب المرقس اليعقوبي في جواب كتابين وردا منه عليه في الإيمان فيهما إبطال وحدانية القنوم التي يقول بها اليعقوبية والملكية، وكان حكمة قريباً من حكمة الإسلام ونقل من كتب المنطق والفلسفة شيئاً كثيراً {cite:fihrist-ibn-al-nadim p. 57-58}."
  en: "Metropolitan of Harran then Mosul; translated much logic and philosophy {cite:fihrist-ibn-al-nadim p. 57-58}."
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
