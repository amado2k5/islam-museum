id: person/abdishu-ibn-bahriz
class: person
label: { ar: "عبد يشوع بن بهرير", en: "Abdishu b. Bahriz", fr: "Abdishu b. Bahriz", es: "Abdishu b. Bahriz", ur: "عبدیشو بی۔ بہریز" }
summary:
  ar: "حبيب بن بهرير واسمه عبد يشوع، كان أولاً مطران حران ثم صار مطران الموصل وحزة، من حكام النصارى في الشريعة والفتاوى له رسائل وكتب منها كتاب المرقس اليعقوبي في جواب كتابين وردا منه عليه في الإيمان فيهما إبطال وحدانية القنوم التي يقول بها اليعقوبية والملكية، وكان حكمة قريباً من حكمة الإسلام ونقل من كتب المنطق والفلسفة شيئاً كثيراً {cite:fihrist-ibn-al-nadim p. 57-58}."
  en: "Metropolitan of Harran then Mosul; translated much logic and philosophy {cite:fihrist-ibn-al-nadim p. 57-58}."
  fr: "Métropolite de Harran puis de Mossoul ; il traduisit de nombreux ouvrages de logique et de philosophie {cite:fihrist-ibn-al-nadim p. 57-58}."
  es: "Metropolitano de Harran y luego de Mosul; tradujo mucha lógica y filosofía {cita:fihrist-ibn-al-nadim págs. 57-58}."
  ur: "حران کا میٹروپولیٹن پھر موصل؛ بہت زیادہ منطق اور فلسفہ کا ترجمہ کیا {حوالہ: فہرست ابن الندیم ص۔ 57-58}۔"
  tr: "Adı Abdişo olan Habib ibn Bahrir, önce Harran Piskoposu, sonra Musul ve Hazzeh Piskoposu oldu. Şeriat ve fetvalarda Hristiyan yöneticilerden biriydi. Mektupları ve kitapları vardı; bunlar arasında Yakubi Markos'un iki kitabına cevaben yazdığı ve ona iman üzerine verdiği cevap da bulunuyordu. Bu cevapta, Yakubiler ve Melkitlerin söylediği tek bir kişi olduğu iddiasını reddetti. Bilgeliği İslam bilgeliğine yakındı ve mantık ve felsefe kitaplarından çokça alıntı yaptı. {cite:fihrist-ibn-al-nadim s. 57-58}"
  id: "Habib ibn Bahrir, yang bernama Abdisho, awalnya adalah Uskup Harran, kemudian menjadi Uskup Mosul dan Hazzeh. Ia adalah salah satu penguasa Kristen yang ahli dalam syariat dan fatwa. Ia memiliki surat-surat dan buku-buku, termasuk buku Markus Yakobit sebagai tanggapan terhadap dua buku dan balasannya tentang iman, di mana ia membantah keesaan Pribadi yang dikatakan oleh kaum Yakobit dan Melkit. Kebijaksanaannya dekat dengan kebijaksanaan Islam, dan ia banyak mengutip dari buku-buku logika dan filsafat. {cite:fihrist-ibn-al-nadim p. 57-58}."
