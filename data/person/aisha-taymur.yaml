summary:
  ar: "شاعرة وكاتبة مصرية (1840–1902) نظمت الشعر بالعربية والتركية والفارسية، وتُعد من رائدات الكتابة النسائية العربية الحديثة؛ تعلّمت في بيتها بتشجيع أبيها رغم معارضة أمها، ورثت ابنتها توحيدة بقصائد عُدت من أرقى المراثي الحديثة، وكتبت في حقوق المرأة من داخل التراث الإسلامي، وعارضت في مقالاتها دعوة قاسم أمين إلى السفور."
  en: "Egyptian poet and writer (1840–1902) who composed in Arabic, Turkish and Persian and is counted among the pioneers of modern Arabic women's writing. Educated at home at her father's insistence against her mother's wish, she mourned her daughter Tawhida in elegies ranked among the finest of the modern age, argued for women's rights from within the Islamic tradition, and opposed Qasim Amin's call for unveiling in her published articles."
  ur: "مصری شاعرہ اور مصنفہ (1840–1902) جنہوں نے عربی، ترکی اور فارسی میں شاعری کی اور جدید عربی خواتین کی تحریر کی بانیوں میں شمار ہوتی ہیں؛ والد کی ترغیب پر گھر میں تعلیم پائی، بیٹی توحیدہ کے مرثیے لکھے، اسلامی روایت کے اندر سے خواتین کے حقوق کی بات کی، اور قاسم امین کی دعوتِ سفور کی مخالفت میں مضامین لکھے۔"
