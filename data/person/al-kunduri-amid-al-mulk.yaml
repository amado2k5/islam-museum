summary:
  ar: "أول وزير لدولة السلاجقة؛ كان شديد التعصب على الشافعية كثير الوقيعة في الشافعي حتى خطب السلطان ألب أرسلان في لعن الرافضة على منابر خراسان فأذن له فأمر بلعنهم وأضاف إليهم الأشعرية ففارق أئمة خراسان منهم القشيري وإمام الحرمين، ولما قام بالمملكة ألب أرسلان أقره على حاله ثم سيره إلى خوارزم شاه ليخطب له ابنته فأرجف أعداؤه أنه خطبها لنفسه فعمد إلى لحيته فحلقها وإلى مذاكيره فحجبها فكان ذلك سبب سلامته، وقيل إن السلطان خصاه، ثم عزله ونقله إلى مرو الروذ وحبسه فلما أحس بالقتل دخل الحجرة وأخرج كفنه وودع عياله واغتسل {cite:shadharat-dhahab p. 310-311}. وعند ابن الجوزي قبض عليه ألب أرسلان في عشية يوم السبت السابع من المحرم سنة ٤٥٦ وأُخذ ما له ثم أُنفذ إلى مرو الروذ فاعتُقل بها، وخُلع في ذلك اليوم على نظام الملك {cite:muntazam-ibn-al-jawzi j.8 p.574-576}."
  en: "The Seljuks' first vizier — whose zeal against the Shafi'is won a licence to curse Rafida and Ash'aris alike from Khurasan's minbars, exiling Imam al-Haramayn and al-Qushayri; sent to ask Khwarazmshah's daughter for his master, rumour twisted it to a suit for himself, and he shaved his beard to survive — then was deposed, imprisoned at Marw al-Rudh, and took out his shroud to bid his family farewell {cite:shadharat-dhahab p. 310-311}."
died: { edtf: "1064~", hijri: "0456", calendar: julian, precision: year, status: tradition, derived: true, note: "قتله ألب أرسلان بمرو الروذ في آخر سنة ست وخمسين وأربعمائة وحُمل رأسه إلى نيسابور {cite:shadharat-dhahab p. 309}." }
