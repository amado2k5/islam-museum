summary:
  ar: "أول وزير لدولة السلاجقة؛ كان شديد التعصب على الشافعية كثير الوقيعة في الشافعي حتى خطب السلطان ألب أرسلان في لعن الرافضة على منابر خراسان فأذن له فأمر بلعنهم وأضاف إليهم الأشعرية ففارق أئمة خراسان منهم القشيري وإمام الحرمين، ولما قام بالمملكة ألب أرسلان أقره على حاله ثم سيره إلى خوارزم شاه ليخطب له ابنته فأرجف أعداؤه أنه خطبها لنفسه فعمد إلى لحيته فحلقها وإلى مذاكيره فحجبها فكان ذلك سبب سلامته، وقيل إن السلطان خصاه، ثم عزله ونقله إلى مرو الروذ وحبسه فلما أحس بالقتل دخل الحجرة وأخرج كفنه وودع عياله واغتسل {cite:shadharat-dhahab p. 310-311}. وعند ابن الجوزي قبض عليه ألب أرسلان في عشية يوم السبت السابع من المحرم سنة ٤٥٦ وأُخذ ما له ثم أُنفذ إلى مرو الروذ فاعتُقل بها، وخُلع في ذلك اليوم على نظام الملك {cite:muntazam-ibn-al-jawzi j.8 p.574-576}."
  en: "The Seljuks' first vizier — whose zeal against the Shafi'is won a licence to curse Rafida and Ash'aris alike from Khurasan's minbars, exiling Imam al-Haramayn and al-Qushayri; sent to ask Khwarazmshah's daughter for his master, rumour twisted it to a suit for himself, and he shaved his beard to survive — then was deposed, imprisoned at Marw al-Rudh, and took out his shroud to bid his family farewell {cite:shadharat-dhahab p. 310-311}."
  ur: "سلجوقیوں کے اولین وزیر؛ ماخذ خراسان میں اشعریوں کے خلاف مہم، ان کے عہد کی سیاسی سرگرمیوں اور آخرکار معزولی اور قید کا ذکر کرتے ہیں۔ {cite:shadharat-dhahab}"
  es: "El primer visir de los selyúcidas —cuyo celo contra los shafi'ís obtuvo una licencia para maldecir tanto a los rafida como a los ash'aris desde los minbares de Jorasán, exiliando al imán al-Haramayn y al-Qushayri; enviado a pedirle a la hija del sha de Corasmia que le entregara a su amo, el rumor lo transformó en una demanda para sí mismo, y se afeitó la barba para sobrevivir— luego fue depuesto, encarcelado en Marw al-Rudh, y sacó su mortaja para despedirse de su familia {cite:shadharat-dhahab p. 310-311}."
  fr: "Le premier vizir des Seldjoukides — dont le zèle contre les Chafi'ites lui valut l'autorisation de maudire Rafida et Ash'arites depuis les minbars du Khorasan, exilant l'imam al-Haramayn et al-Qushayri; envoyé demander à la fille de Khwarezmshah son maître, la rumeur transforma cela en une action en justice pour lui-même, et il se rasa la barbe pour survivre — fut ensuite déposé, emprisonné à Marw al-Rudh, et sortit son linceul pour faire ses adieux à sa famille {cite:shadharat-dhahab p. 310-311}."
  tr: "Selçuklu devletinin ilk bakanı, Şafiilere karşı derin fanatikti ve sık sık onlara karşı anlaşmazlık çıkardı; öyle ki Sultan Alp Arslan, Horasan kürsülerinde Rafideyi lanetleyen bir vaaz verdi. İzin verdi, lanetlerini emretti ve Aş'arileri ekledi. Horasan imamları, aralarında El-Kuşayri ve İki Müdaremin İmamı ile yollarını ayırdı. Krallığı devraldığında, Alp Arslan acac Statüsünü öğrendi ve ardından kızına evlenme teklif etmesi için Khwarazm Şah'a gönderdi. Düşmanları, kendisi için evlenme teklif ettiğini düşünerek titredi, bu yüzden sakalını tıraş edip hatırlaması için sakladı; bu da güvenliğinin sebebiydi. Sultan'ın onu hadım edip sonra görevden aldığı, Merv-Rüdh'e naklettiği ve hapsettiği söylenir. Öldüğünü hissettiğinde odaya girdi, kefenini çıkardı, ailesine veda etti ve yıkandı {cite::) Shadharat-Dhahab s. 310-311}. İbn el-Cewzi'de, Alp Arslan onu Muharrem ayının yedinci Cumartesi akşamı, 456 H.'de yakaladı, eşyalarını aldı, ardından Marw al-Rudh'a götürüldü, burada tutuklandı ve o gün hükümdarlıktan indirildi {citasyon:Muntazam-ibn-al-Jawzi J.8 s.574-576}."
  id: "Menteri pertama negara Seljuk sangat fanatik terhadap para Shafi'i dan sering menimbulkan perselisihan terhadap mereka, sampai-sampai Sultan Alp Arslan memberikan khotbah mengutuk Rafidah di mimbar Khorasan. Ia memberikan izin dan memerintahkan kutukan mereka serta menambahkan Ash'ari. Ia berpisah dengan para Imam Khorasan, termasuk Al-Qushayri dan Imam Dua Masjid Suci. Ketika ia mengambil alih kerajaan, Alp Arslan mengakui statusnya dan kemudian mengirimnya ke Khwarazm Shah untuk melamar putrinya. Musuh-musuhnya gemetar karena ia melamarnya untuk dirinya sendiri, sehingga ia mencukur janggutnya dan menyimpannya untuk kenang-kenangan, yang menjadi alasan keselamatannya. Konon Sultan mengebirinya, kemudian memecatnya, memindahkannya ke Marw al-Rudh, dan memenjarakannya. Ketika ia merasa terbunuh, ia masuk ke ruangan, mengeluarkan kain kafan, mengucapkan selamat tinggal kepada keluarganya, dan mandi {cite:Shadharat-Dhahab hlm. 310-311}. Di Ibn al-Jawzi, Alp Arslan menangkapnya pada malam Sabtu, tanggal tujuh Muharram, 456 H, mengambil barang-barangnya, kemudian dibawa ke Marw al-Rudh, di mana ia ditangkap, dan pada hari itu ia digulingkan sebagai penguasa {cite:Muntazam-ibn-al-Jawzi J.8 hlm.574-576}."
