summary:
  ar: "أبو يعقوب خليفة الإمام المقيم وكان بالري، وكان بنو حماد أصحاب الدعوة بالجزيرة وما والاها من قبله، وتنكر على ابن نفيس لأمر بلغه عنه فأنفذ قوما من الأعاجم فقتلوه بالغيلة في كاره {cite:fihrist-ibn-al-nadim p. 268-269}."
  en: "Abu Ya'qub al-Sijistani — the residing khalifa at Rayy over the Jazira da'is {cite:fihrist-ibn-al-nadim}"
  fr: "Abu Ya'qub al-Sijistani, khalifa résidant à Rayy à la tête des dais de la Jazira {cite:fihrist-ibn-al-nadim}"
  es: "Abu Ya'qub al-Sijistani - el califa residente en Rayy sobre Jazira da'is {cita:fihrist-ibn-al-nadim}"
  ur: "ابو یعقوب السجستانی - جزیرہ داعی پر ری میں مقیم خلیفہ {حوالہ: فہرست ابن الندیم"
  tr: "Ebu Yakub, İmam el-Mukim'in halefiydi ve Rayy'daydı. Beni Hammad, Cezire'de ve çevresindeki bölgelerde yaşayan, onun adına tebliğde bulunan bir topluluktu. İbn Nafis hakkında kendisine ulaşan bir şey yüzünden ona karşı döndü ve onu Karah'ta hainlikle öldüren bir grup Arap olmayan kişiyi gönderdi. {Kaynak: Fihrist-ibn-al-nadim s. 268-269}"
  id: "Abu Yaqub adalah penerus Imam al-Muqeem dan beliau berada di Rayy. Bani Hammad adalah orang-orang yang menyeru di al-Jazira dan daerah sekitarnya darinya. Beliau berbalik melawan Ibnu Nafis karena sesuatu yang sampai kepadanya, sehingga beliau mengirim sekelompok orang non-Arab yang membunuhnya dengan tipu daya di Karah. {cite:fihrist-ibn-al-nadim p. 268-269}."
