summary:
  ar: "محمود بن أحمد بن عبد العزيز بن عمر بن مازة المرغيناني البخاري، برهان الدين، فقيه حنفي من أكابر أئمة المذهب؛ عده ابن كمال باشا من المجتهدين في المسائل، وهو من بيت علم عظيم في بلاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} ولد بمرغينان وتوفي ببخاري (كذا في النص)، وأخذ عن أبيه الصدر السعيد وعن عمه الصدر الشهيد عمر، وهو والد صدر الإسلام طاهر بن محمود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} من تصانيفه «المحيط البرهاني في الفقه النعماني»، و«الذخيرة»، و«التجريد»، و«تتمة الفتاوى»، و«شرح أدب القضاء» للخصاف، و«شرح الجامع الصغير»، و«الطريقة البرهانية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} أوردته الموسوعة بتاريخي ولادة 551هـ ووفاة 616هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  en: "Mahmud ibn Ahmad ibn Abd al-Aziz ibn Umar ibn Maza al-Marghinani al-Bukhari, Burhan al-Din — a Hanafi jurist among the chief imams of the madhhab, counted by Ibn Kamal Pasha among the mujtahids in the questions, from a great house of learning in his country. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} He was born in Marghinan and died in Bukhara (the scan reads 'bi-Bukhari'), studied under his father al-Sadr al-Sa'id and his uncle al-Sadr al-Shahid Umar, and was the father of Sadr al-Islam Tahir ibn Mahmud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} His works include al-Muhit al-Burhani fi al-Fiqh al-Nu'mani, al-Dhakhira, al-Tajrid, Tatimmat al-Fatawa, a commentary on al-Khassaf's Adab al-Qada, a commentary on al-Jami' al-Saghir, and al-Tariqa al-Burhaniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} The encyclopedia dates him 551–616 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  ur: "محمود بن احمد بن عبد العزیز بن عمر بن مازہ المرغینانی البخاری، برہان الدین — حنفی فقیہ جو مذہب کے بڑے ائمہ میں شمار ہوتے تھے؛ ابن کمال پاشا نے انہیں مسائل میں مجتہدوں میں شمار کیا، اور وہ اپنے ملک کے ایک بڑے علمی گھرانے سے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} وہ مرغینان میں پیدا ہوئے اور (متن کے مطابق) بخاری میں وفات پائی؛ انھوں نے اپنے والد الصدر السعید اور چچا الصدر الشہید عمر سے علم حاصل کیا، اور وہ صدر الاسلام طاہر بن محمود کے والد تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} ان کی تصانیف میں «المحیط البرھانی فی الفقہ النعمانی»، «الذخیرہ»، «التجرید»، «تتمۃ الفتاوی»، خصاف کی «ادب القضاء» کی شرح، «الجامع الصغیر» کی شرح اور «الطریقہ البرھانیہ» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} موسوعہ نے ان کی ولادت 551ھ اور وفات 616ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
