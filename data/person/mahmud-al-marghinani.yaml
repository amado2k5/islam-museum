summary:
  ar: "محمود بن أحمد بن عبد العزيز بن عمر بن مازة المرغيناني البخاري، برهان الدين، فقيه حنفي من أكابر أئمة المذهب؛ عده ابن كمال باشا من المجتهدين في المسائل، وهو من بيت علم عظيم في بلاده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} ولد بمرغينان وتوفي ببخاري ⁦(كذا في النص)⁩، وأخذ عن أبيه الصدر السعيد وعن عمه الصدر الشهيد عمر، وهو والد صدر الإسلام طاهر بن محمود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} من تصانيفه «المحيط البرهاني في الفقه النعماني»، و«الذخيرة»، و«التجريد»، و«تتمة الفتاوى»، و«شرح أدب القضاء» للخصاف، و«شرح الجامع الصغير»، و«الطريقة البرهانية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} أوردته الموسوعة بتاريخي ولادة 551هـ ووفاة 616هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  en: "Mahmud ibn Ahmad ibn Abd al-Aziz ibn Umar ibn Maza al-Marghinani al-Bukhari, Burhan al-Din — a Hanafi jurist among the chief imams of the madhhab, counted by Ibn Kamal Pasha among the mujtahids in the questions, from a great house of learning in his country. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} He was born in Marghinan and died in Bukhara (the scan reads 'bi-Bukhari'), studied under his father al-Sadr al-Sa'id and his uncle al-Sadr al-Shahid Umar, and was the father of Sadr al-Islam Tahir ibn Mahmud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} His works include al-Muhit al-Burhani fi al-Fiqh al-Nu'mani, al-Dhakhira, al-Tajrid, Tatimmat al-Fatawa, a commentary on al-Khassaf's Adab al-Qada, a commentary on al-Jami' al-Saghir, and al-Tariqa al-Burhaniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} The encyclopedia dates him 551–616 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  ur: "محمود بن احمد بن عبد العزیز بن عمر بن مازہ المرغینانی البخاری، برہان الدین — حنفی فقیہ جو مذہب کے بڑے ائمہ میں شمار ہوتے تھے؛ ابن کمال پاشا نے انہیں مسائل میں مجتہدوں میں شمار کیا، اور وہ اپنے ملک کے ایک بڑے علمی گھرانے سے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} وہ مرغینان میں پیدا ہوئے اور ⁦(متن کے مطابق)⁩ بخاری میں وفات پائی؛ انھوں نے اپنے والد الصدر السعید اور چچا الصدر الشہید عمر سے علم حاصل کیا، اور وہ صدر الاسلام طاہر بن محمود کے والد تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} ان کی تصانیف میں «المحیط البرھانی فی الفقہ النعمانی»، «الذخیرہ»، «التجرید»، «تتمۃ الفتاوی»، خصاف کی «ادب القضاء» کی شرح، «الجامع الصغیر» کی شرح اور «الطریقہ البرھانیہ» شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} موسوعہ نے ان کی ولادت 551ھ اور وفات 616ھ دی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  es: "Mahmud ibn Ahmad ibn Abd al-Aziz ibn Umar ibn Maza al-Marghinani al-Bukhari, Burhan al-Din — un jurista hanafí entre los imanes principales de la madhhab, contado por Ibn Kamal Pasha entre los mujtahids en las cuestiones, de una gran casa de saber en su país. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} Nació en Marghinan y murió en Bukhara (el escaneo dice 'bi-Bukhari'), estudió con su padre al-Sadr al-Sa'id y su tío al-Sadr al-Shahid Umar, y fue el padre de Sadr al-Islam Tahir ibn Mahmud. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} Sus obras incluyen al-Muhit al-Burhani fi al-Fiqh al-Nu'mani, al-Dhakhira, al-Tajrid, Tatimmat al-Fatawa, un comentario sobre Adab al-Qada de al-Khassaf, un comentario sobre al-Jami' al-Saghir y al-Tariqa al-Burhaniyya. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} La enciclopedia lo fecha entre 551 y 616 d.H. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  fr: "Mahmud ibn Ahmad ibn Abd al-Aziz ibn Umar ibn Maza al-Marghinani al-Bukhari, Burhan al-Din — juriste hanafite, l'un des plus grands imams de l'école hanafite, compté par Ibn Kamal Pacha parmi les mujtahids (experts en questions disciplinaires), issu d'une grande maison d'études de son pays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} Né à Marghinan et décédé à Boukhara (le scan indique « bi-Bukhari »), il étudia auprès de son père al-Sadr al-Sa'id et de son oncle al-Sadr al-Shahid Umar, et fut le père de Sadr al-Islam Tahir ibn Mahmud. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} Ses œuvres incluent al-Muhit al-Burhani fi al-Fiqh al-Nu'mani, al-Dhakhira, al-Tajrid, Tatimmat al-Fatawa, un commentaire sur Adab al-Qada d'al-Khassaf, un commentaire sur al-Jami' al-Saghir et al-Tariqa al-Burhaniyya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250} L'encyclopédie le date de 551 à 616 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16250}"
  tr: "Mahmud ibn Ahmed ibn Abd al-Aziz ibn Umar ibn Mazzah al-Marghinani al-Bukhari, Burhan al-Din, bir Hanefi hukukçusu ve medhhabın önde gelen imamlarından biriydi; İbn Kamal Paşa onu meselelerde müctehidlerden biri olarak görür ve ülkesinde büyük bir alim aileye mensuptur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16250} Marghinan'da doğdu ve Buhari'de öldü (metinde belirtildiği gibi). Babası el-Sadr el-Said ve amcası el-Sadr el-Şahid Ömer'in yanında eğitim aldı. Erken dönem İslam âlimi Tahir bin Mahmud'un babasıydı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16250} Eserleri arasında \"Al-Muheet al-Burhani fi al-Fiqh al-Nu'mani,\" \"Al-Dhakhira,\" \"Al-Tajrid,\" \"Fetvaların Eki\", Al-Khassaf'ın \"Sharh Adab al-Qada\", \"Sharh al-Jami' al-Saghir\" ve \"Burhani Tarikatı\" bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16250} Ansiklopedide doğum tarihleri 551 Hicri, ölüm tarihleri ise 616 Hicri olarak listelenmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16250}"
  id: "Mahmoud ibn Ahmad ibn Abd al-Aziz ibn Umar ibn Mazzah al-Marghinani al-Bukhari, Burhan al-Din, adalah seorang ahli hukum Hanafi dan salah satu imam terkemuka mazhab; Ibn Kamal Pasha menganggapnya sebagai salah satu mujtahid dalam masalah dan berasal dari keluarga ulama besar di tanahnya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16250} Ia lahir di Marghinan dan meninggal di Bukhari (seperti yang tercantum dalam teks). Ia belajar di bawah bimbingan ayahnya al-Sadr al-Sa'id dan pamannya al-Sadr al-Shahid Umar. Ia adalah ayah dari ulama Islam awal Tahir ibn Mahmoud. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16250} Di antara karya-karyanya adalah \"Al-Muheet al-Burhani fi al-Fiqh al-Nu'mani,\" \"Al-Dhakhira,\" \"Al-Tajrid,\" \"Suplemen Fatwa,\" \"Sharh Adab al-Qada\" oleh Al-Khassaf, \"Sharh al-Jami' al-Saghir,\" dan \"The Burhani Order.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16250} Ensiklopedia mencantumkan tanggal lahirnya sebagai 551 AH dan kematian pada 616 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16250}"
