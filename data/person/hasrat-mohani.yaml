summary:
  ar: "شاعر أردي ومناضل استقلال هندي (1875–1951)، اسمه سيد فضل الحسن وتخلّصه «حسرت». كان أول من طالب بالاستقلال التام للهند في مؤتمر أحمد آباد 1921، وصاحب شعار «انقلاب زنده باد»، وترأس الرابطة الإسلامية 1919، وشارك في تأسيس الحزب الشيوعي الهندي، وبقي في الهند بعد التقسيم وعضوًا في الجمعية التأسيسية."
  en: "Urdu poet and Indian independence activist (1875–1951), born Syed Fazl-ul-Hasan, with the pen name Hasrat. He was the first to demand complete independence for India, at the Ahmedabad Congress of 1921, coined the slogan 'Inquilab Zindabad', presided over the Muslim League in 1919, helped found the Communist Party of India, and after Partition remained in India as a member of its Constituent Assembly."
  ur: "اردو شاعر اور ہندوستانی مجاہد آزادی (1875ء–1951ء)، اصل نام سید فضل الحسن اور تخلص ’حسرت‘۔ وہ پہلے شخص تھے جنھوں نے 1921ء کے احمد آباد کانگریس اجلاس میں ہندوستان کی مکمل آزادی کا مطالبہ کیا، ’انقلاب زندہ باد‘ کا نعرہ انھی کی تخلیق ہے، 1919ء میں مسلم لیگ کے صدر رہے، کمیونسٹ پارٹی آف انڈیا کے بانیوں میں شامل ہوئے، اور تقسیم کے بعد ہندوستان ہی میں رہے اور دستور ساز اسمبلی کے رکن بنے۔"
