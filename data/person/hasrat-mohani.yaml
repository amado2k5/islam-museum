summary:
  ar: "شاعر أردي ومناضل استقلال هندي (1875–1951)، اسمه سيد فضل الحسن وتخلّصه «حسرت». كان أول من طالب بالاستقلال التام للهند في مؤتمر أحمد آباد 1921، وصاحب شعار «انقلاب زنده باد»، وترأس الرابطة الإسلامية 1919، وشارك في تأسيس الحزب الشيوعي الهندي، وبقي في الهند بعد التقسيم وعضوًا في الجمعية التأسيسية."
  en: "Urdu poet and Indian independence activist (1875–1951), born Syed Fazl-ul-Hasan, with the pen name Hasrat. He was the first to demand complete independence for India, at the Ahmedabad Congress of 1921, coined the slogan 'Inquilab Zindabad', presided over the Muslim League in 1919, helped found the Communist Party of India, and after Partition remained in India as a member of its Constituent Assembly."
  ur: "اردو شاعر اور ہندوستانی مجاہد آزادی ⁦(1875ء–1951ء)⁩، اصل نام سید فضل الحسن اور تخلص ’حسرت‘۔ وہ پہلے شخص تھے جنھوں نے 1921ء کے احمد آباد کانگریس اجلاس میں ہندوستان کی مکمل آزادی کا مطالبہ کیا، ’انقلاب زندہ باد‘ کا نعرہ انھی کی تخلیق ہے، 1919ء میں مسلم لیگ کے صدر رہے، کمیونسٹ پارٹی آف انڈیا کے بانیوں میں شامل ہوئے، اور تقسیم کے بعد ہندوستان ہی میں رہے اور دستور ساز اسمبلی کے رکن بنے۔"
  es: "Poeta urdu y activista por la independencia de la India (1875-1951), nacido Syed Fazl-ul-Hasan, con el seudónimo de Hasrat. Fue el primero en exigir la independencia total de la India en el Congreso de Ahmedabad de 1921, acuñó el lema «Inquilab Zindabad» (¡Viva la revolución!), presidió la Liga Musulmana en 1919, ayudó a fundar el Partido Comunista de la India y, tras la Partición, permaneció en la India como miembro de su Asamblea Constituyente."
  fr: "Poète ourdou et militant pour l'indépendance de l'Inde (1875-1951), né Syed Fazl-ul-Hasan, connu sous le pseudonyme de Hasrat. Il fut le premier à réclamer l'indépendance complète de l'Inde lors du congrès d'Ahmedabad en 1921, forgea le slogan « Inquilab Zindabad », présida la Ligue musulmane en 1919, contribua à la fondation du Parti communiste d'Inde et, après la partition, demeura en Inde en tant que membre de son Assemblée constituante."
  tr: "Urduca şair ve Hindistan bağımsızlık savaşçısı (1875–1951), 'Hasrat' lakaplı Syed Fazl Al-Hasan'dı. 1921'de Ahmedabad Konferansı'nda Hindistan için tam bağımsızlık talebinde bulunan ilk kişi oldu, 'Yaşasın Çavuş' sloganını ortaya attı, 1919'da Müslüman Birliği'ne başkanlık etti, Hindistan Komünist Partisi'nin kuruluşuna katıldı, bölünmeden sonra Hindistan'da kaldı ve Kurucu Meclis üyesiydi."
  id: "Seorang penyair Urdu dan pejuang kemerdekaan India (1875–1951), bernama Syed Fazl Al-Hasan, dijuluki 'Hasrat'. Ia adalah orang pertama yang menuntut kemerdekaan penuh India pada Konferensi Ahmedabad tahun 1921, menciptakan slogan 'Hidup Sang Pendakian, memimpin Liga Muslim pada tahun 1919, berpartisipasi dalam pendirian Partai Komunis India, tetap berada di India setelah pemisahan, dan menjadi anggota Majelis Konstituante."
