summary:
  ar: "سياسي عثماني، أحد «الباشوات الثلاثة» في جمعية الاتحاد والترقي وناظر الداخلية ثم الصدر الأعظم من 1917 إلى 1918. أصدر أوامر اعتقال القادة الأرمن في أبريل 1915 وقانون التهجير، وفرّ إلى برلين بعد الهزيمة فحُكم عليه غيابيًا بالإعدام واغتيل سنة 1921، وأُعيد دفن رفاته في إسطنبول سنة 1943."
  en: "Ottoman politician, one of the 'Three Pashas' of the Committee of Union and Progress, minister of the interior and then grand vizier from 1917 to 1918. He issued the orders for the April 1915 arrests of Armenian leaders and the deportation law, fled to Berlin after the defeat, was sentenced to death in absentia and was assassinated in 1921; his remains were reburied at Istanbul in 1943."
  ur: "عثمانی سیاست دان، جمعیتِ اتحاد و ترقی کے «تین پاشاؤں» میں سے ایک، وزیرِ داخلہ اور پھر 1917 سے 1918 تک صدرِ اعظم۔ انہوں نے اپریل 1915 میں آرمینی رہنماؤں کی گرفتاری کے احکامات اور جلاوطنی کا قانون جاری کیا، شکست کے بعد برلن فرار ہوئے، غیر حاضری میں سزائے موت پائی اور 1921 میں قتل ہوئے؛ ان کی باقیات 1943 میں اسطنبول میں دوبارہ دفن ہوئیں۔"
