  note: "Both articles and Wikidata give 15 March 1921: he was shot dead outside his flat in Hardenbergstraße, Berlin, by Soghomon Tehlirian, under Operation Nemesis. He was first buried at the Alter St.-Matthäus-Kirchhof in Berlin; in 1943 his remains were brought to Turkey and reburied at the Monument of Liberty (Abide-i Hürriyet) cemetery in Istanbul with a state funeral, on 25 February 1943. No museum place entity exists for Berlin, so no died_in edge is written. The Hijri year 1339 is the derived conversion of March 1921."
