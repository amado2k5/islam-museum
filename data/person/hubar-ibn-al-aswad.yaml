summary:
  ar: قرشي من بني أسد؛ ينسب إليه ابن إسحاق أنه نخس زينب بنت النبي لما أرسلها زوجها أبو العاص إلى المدينة فأسقطت، ويرد في رواية أن النبي أمر بتحريقه إن ظُفر به ثم نهى عن التعذيب بالنار؛ أسلم بالجعرانة بعد حنين، وقال له النبي لما سُبّ «سُبّ من
    سبّك».
  en: A Qurashi of Banu Asad; Ibn Ishaq attributes to him the jostling of the Prophet's daughter Zaynab when her husband Abu al-As sent her to Medina, so that she miscarried, and a report says the Prophet ordered him burned if found and then
    forbade punishing by fire; he embraced Islam at al-Ji'rana after Hunayn, and when people cursed him the Prophet told him to curse back whoever cursed him.
