id: person/ziri-ibn-atiyya
class: person
label:
  ar: زيري بن عطية المغراوي
  en: Ziri ibn Atiyya al-Maghrawi
summary:
  ar: "زيري بن عطية بن عبد الرحمن بن خزر المغراوي، مؤسس ملك فاس لبني زيري؛ كان أمير آل خزر في وقته ووارث ملكهم البدوي وهو الذي مهّد الدولة بفاس والمغرب الأقصى على طاعة المنصور بن أبي عامر، ولقيه عبد الملك المظفر بوادي منى من أحواز طنجة في شوال 388هـ فطُعن زيري ثلاثاً في نحره وانهزم أصحابه وامتنعت عليه فاس فالتجأ إلى الصحراء وأسلم جميع أعماله، ثم عاد ففتح تاهرت وتلمسان وشلف وتنس والمسيلة وأقام الدعوة فيها للمؤيد هشام وللمنصور حاجبه، وحاصر أشير قاعدة ملك صنهاجة فأعتلّ وأفرج عنها وهلك في منصرفه سنة 391هـ، وخلفه ابنه المعز."
  en: "Ziri ibn Atiyya ibn Abd al-Rahman ibn Khazir al-Maghrawi, founder of the Zirid (Maghrawa) kingship of Fez; chief of the house of Khazir who laid the state's foundation at Fez and the Far Maghreb in obedience to al-Mansur Ibn Abi Amir — Abd al-Malik al-Muzaffar met him at Wadi Mina by Tangier in Shawwal 388, where three spear-wounds in the neck unhorsed him, Fez shut its gates and he fled to the Sahara stripped of his realm; he returned to take Tahert, Tlemcen, Shelif, Tenis and Msila for the Amirid da'wa, besieged the Sanhaja seat of Achir, fell ill, raised the siege and died on the march home in 391, leaving the kingship to his son al-Mu'izz."
