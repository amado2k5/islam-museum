summary:
  ar: "أبو عامر عبد الله بن أحمد بن إبراهيم المريني، الملقب بالمستنصر بالله، من ملوك بني مرين؛ بويع في أوائل سنة 799 هـ ومدة دولته سنة وخمسة أشهر، وتوفي سنة 800 هـ الموافقة 1398 م."
  en: "Abu Amir Abdallah ibn Ahmad ibn Ibrahim al-Marini, styled al-Mustansir bi-llah, a Marinid king; given allegiance in early 799 AH, reigned a year and five months, died 800 AH (1398)."
  fr: "Abu Amir Abdallah ibn Ahmad ibn Ibrahim al-Marini, dit al-Mustansir bi-llah, roi mérinide ; il reçut l'allégeance au début de 799 H, régna un an et cinq mois et mourut en 800 H (1398)."
  es: "Abu Amir Abdallah ibn Ahmad ibn Ibrahim al-Marini, llamado al-Mustansir bi-llah, un rey mariní; recibió lealtad a principios del 799 AH, reinó un año y cinco meses, murió en el 800 AH (1398)."
  ur: "ابو امیر عبداللہ بن احمد بن ابراہیم المرینی، المستنصر باللہ، ایک مرینی بادشاہ؛ 799ھ کے اوائل میں بیعت کی، ایک سال پانچ ماہ حکومت کی، 800ھ (1398) میں وفات پائی۔"
  tr: "Ebu Emir Abdullah bin Ahmed bin İbrahim el-Marini, lakabı El-Mustansir Billa olan, Beni Marin kabilesinin krallarından biriydi. Hicri 799 yılının başlarında biat etti ve saltanatı bir yıl beş ay sürdü. Hicri 800 yılında, yani milattan sonra 1398 yılında vefat etti."
  id: "Abu Amir Abdullah bin Ahmed bin Ibrahim Al-Marini, yang dijuluki Al-Mustansir Billah, adalah salah satu raja dari Bani Marin. Ia menerima sumpah setia pada awal tahun 799 H, dan masa pemerintahannya berlangsung selama satu tahun lima bulan. Ia wafat pada tahun 800 H, yang bertepatan dengan tahun 1398 M."
