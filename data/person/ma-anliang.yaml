    note: "A personal order-membership reading exists in exactly one text family. The English article, citing Dillon (1999, p. 140), states that the Hezhou leaders who defected in 1872 — Ma Anliang expressly named among them, with his father Ma Zhan'ao — 'belonged to the Huasi menhuan, of the Khafiya Naqshbandi Sufi order'; the Arabic article is a translation of the English, one family with it, and its infobox's 'Sufi Muslim' derives from that same text. The Chinese article, an independent tradition, does not state his membership: it records that in 1911 he used the menhuan network to levy menhuan troops — an organisational use of his family's order, not a statement that he belonged to it — and his tomb at Dahejia is a gongbei, a Sufi tomb shrine, which is veneration, not attestation. His father's documented Huasi membership does not transfer to him, and his campaigns against other Muslim movements (the Yihewani in 1905, the Xidaotang in 1914) are politics, not a school. One text family short of the two-source bar: unknown, flagged."
