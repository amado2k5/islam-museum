summary:
  ar: "جنرال مسلم صيني (1855–1918)، الابن الأكبر لما جان آو، واسمه الأصلي ما سبعة وخمسة. ذهب صبيًا إلى معسكر تسوو تسونغتانغ للتفاوض على انشقاق والده إلى التشينغ سنة 1872، ثم خدم التشينغ والجمهورية، وصار من 1912 حتى وفاته في هتشو في 24 تشرين الثاني 1918 القائد الفعلي الأعلى لمسلمي شمال غرب الصين."
  en: "A Chinese Muslim general (1855–1918), the eldest son of Ma Zhan'ao, born with the name Ma Qiwu. As a youth he went to Zuo Zongtang's camp to negotiate his father's defection to the Qing in 1872, then served the Qing and the Republic, and from 1912 until his death at Hezhou on 24 November 1918 he was the de facto senior leader of the Muslims of northwest China."
  ur: "ایک چینی مسلمان جنرل (1855ء–1918ء)، ما جان آو کے بڑے بیٹے، اصل نام ما چی وو تھا۔ نوجوانی میں وہ 1872ء میں اپنے والد کی چنگ سے وفاداری کے مذاکرات کے لیے زوو زونگ تانگ کے کیمپ گئے، پھر چنگ اور جمہوریہ کی خدمت کی، اور 1912ء سے 24 نومبر 1918ء کو ہیچو میں وفات تک شمال مغربی چین کے مسلمانوں کے درحقیقت سب سے بڑے قائد رہے۔"
