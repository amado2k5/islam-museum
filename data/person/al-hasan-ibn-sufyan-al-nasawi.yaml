summary:
  ar: "أبو العباس الشيباني النسوي، محدث خراسان في عصره، رحّل البلدان وسمع الكثير فسمع بخراسان حبان بن موسى وإسحاق بن إبراهيم وقتيبة وعلي بن حجر وآخرين، وسمع ببغداد أحمد بن حنبل ويحيى بن معين وأبا خيثمة وآخرين، وسمع بالبصرة أبا كامل وهدبة وشيبان بن فروخ وآخرين، وبالكوفة من أبي بكر بن أبي شيبة وآخرين، وبالحجاز إبراهيم بن المنذر الحزامي، وبمصر هارون بن سعيد الأيلي وأبا طاهر وحرملة وآخرين، وبالشام صفوان بن صالح وهشام بن خالد والمسيب بن واضح وهشام بن عمار وآخرين، وصنّف المسند الكبير والجامع والمعجم وروى مصنفات ابن المبارك وتفقه على أبي ثور وكان يفتي على مذهبه، وإليه كانت الرحلة بخراسان {cite:muntazam-ibn-al-jawzi p. 215}."
  en: "Abu'l-'Abbas al-Shaybani of Nasaf, Khurasan's traditionist of his age: he heard Ibn Hanbal, Ibn Ma'in and Abu Khaythama at Baghdad, Ibn Abi Shayba at Kufa, Ibn al-Mundhir in the Hijaz, scholars of Basra, Egypt and Syria; he authored the great Musnad, the Jami' and the Mu'jam, transmitted Ibn al-Mubarak's works, gave fatwa on Abu Thawr's madhhab, and to him Khurasan's travelers journeyed {cite:muntazam-ibn-al-jawzi p. 215}."
  es: "Abu'l-'Abbas al-Shaybani de Nasaf, el tradicionalista de Khurasan de su época: escuchó a Ibn Hanbal, Ibn Ma'in y Abu Khaythama en Bagdad, a Ibn Abi Shayba en Kufa, a Ibn al-Mundhir en el Hiyaz, eruditos de Basora, Egipto y Siria; fue autor del gran Musnad, Jami' y Mu'jam, transmitió las obras de Ibn al-Mubarak, pronunció fatwa sobre el madhab de Abu Thawr y hasta él viajaron los viajeros de Khurasan {citar:muntazam-ibn-al-jawzi p. 215}."
  fr: "Abu'l-'Abbas al-Shaybani de Nasaf, le traditionaliste du Khurasan de son époque: il a entendu Ibn Hanbal, Ibn Ma'in et Abu Khaythama à Bagdad, Ibn Abi Shayba à Kufa, Ibn al-Mundhir dans le Hijaz, des savants de Bassora, d'Égypte et de Syrie; il est l'auteur du grand Musnad, du Jami' et du Mu'jam, a transmis les œuvres d'Ibn al-Mubarak, a donné des fatwa sur le madhhab d'Abu Thawr, et c'est vers lui que les voyageurs du Khurasan ont voyagé {cite: muntazam-ibn-al-jawzi p. 215}."
  ur: "ابو العباس الشیبانی ناصف، خراسان کے اپنے زمانے کے روایت پرست: اس نے بغداد میں ابن حنبل، ابن معین اور ابو خیثمہ، کوفہ میں ابن ابی شیبہ، حجاز میں ابن المنذر، بصرہ، مصر اور شام کے علماء؛ اس نے عظیم مسند، جامع اور معجم کی تصنیف کی، ابن المبارک کی تصانیف نقل کیں، ابو ثور کے مذھب پر فتویٰ دیا، اور خراسان کے مسافروں نے ان کی طرف سفر کیا۔ 215}۔"
