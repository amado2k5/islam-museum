summary:
  ar: "أبو العباس الشيباني النسوي، محدث خراسان في عصره، رحّل البلدان وسمع الكثير فسمع بخراسان حبان بن موسى وإسحاق بن إبراهيم وقتيبة وعلي بن حجر وآخرين، وسمع ببغداد أحمد بن حنبل ويحيى بن معين وأبا خيثمة وآخرين، وسمع بالبصرة أبا كامل وهدبة وشيبان بن فروخ وآخرين، وبالكوفة من أبي بكر بن أبي شيبة وآخرين، وبالحجاز إبراهيم بن المنذر الحزامي، وبمصر هارون بن سعيد الأيلي وأبا طاهر وحرملة وآخرين، وبالشام صفوان بن صالح وهشام بن خالد والمسيب بن واضح وهشام بن عمار وآخرين، وصنّف المسند الكبير والجامع والمعجم وروى مصنفات ابن المبارك وتفقه على أبي ثور وكان يفتي على مذهبه، وإليه كانت الرحلة بخراسان {cite:muntazam-ibn-al-jawzi p. 215}."
  en: "Abu'l-'Abbas al-Shaybani of Nasaf, Khurasan's traditionist of his age: he heard Ibn Hanbal, Ibn Ma'in and Abu Khaythama at Baghdad, Ibn Abi Shayba at Kufa, Ibn al-Mundhir in the Hijaz, scholars of Basra, Egypt and Syria; he authored the great Musnad, the Jami' and the Mu'jam, transmitted Ibn al-Mubarak's works, gave fatwa on Abu Thawr's madhhab, and to him Khurasan's travelers journeyed {cite:muntazam-ibn-al-jawzi p. 215}."
