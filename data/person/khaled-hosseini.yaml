summary:
  ar: "خالد حسيني ⁦(وُلد في ٤ آذار ١٩٦٥ في كابل)⁩ روائي أفغاني أمريكي وطبيب سابق، مؤلف «عدّاء الطائرة الورقية» ⁦(٢٠٠٣)⁩ و«ألف شمس مشرقة» ⁦(٢٠٠٧)⁩ و«وردّدت الجبال الصدى» ⁦(٢٠١٣)⁩؛ لجأت أسرته إلى الولايات المتحدة سنة ١٩٨٠، ومارس الطب في كاليفورنيا عقدًا قبل أن يتفرغ للكتابة، وهو مبعوث حسن نوايا للمفوضية السامية لشؤون اللاجئين وصاحب مؤسسة لدعم اللاجئين الأفغان."
  en: "Khaled Hosseini (born 4 March 1965 in Kabul) is an Afghan-American novelist and former physician, author of The Kite Runner (2003), A Thousand Splendid Suns (2007) and And the Mountains Echoed (2013); his family took asylum in the United States in 1980, he practised medicine in California for a decade before writing full-time, and he is a UNHCR goodwill envoy and founder of a foundation supporting Afghan refugees."
  ur: "خالد حسینی ⁦(پیدائش 4 مارچ 1965، کابل)⁩ افغان نژاد امریکی ناول نگار و سابق طبیب ہیں، «دی کائٹ رنر» (2003)، «اے تھاؤزنڈ سپلینڈڈ سنز» (2007) اور «اینڈ دی ماؤنٹینز ایکوڈ» (2013) کے مصنف؛ ان کا خاندان 1980 میں امریکہ میں پناہ گزین ہوا، وہ دس برس طب سے وابستہ رہے، اور وہ یو این ایچ سی آر کے خیرسگالی سفیر ہیں۔"
