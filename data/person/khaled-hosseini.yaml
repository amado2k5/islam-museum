summary:
  ar: "خالد حسيني ⁦(وُلد في ٤ آذار ١٩٦٥ في كابل)⁩ روائي أفغاني أمريكي وطبيب سابق، مؤلف «عدّاء الطائرة الورقية» ⁦(٢٠٠٣)⁩ و«ألف شمس مشرقة» ⁦(٢٠٠٧)⁩ و«وردّدت الجبال الصدى» ⁦(٢٠١٣)⁩؛ لجأت أسرته إلى الولايات المتحدة سنة ١٩٨٠، ومارس الطب في كاليفورنيا عقدًا قبل أن يتفرغ للكتابة، وهو مبعوث حسن نوايا للمفوضية السامية لشؤون اللاجئين وصاحب مؤسسة لدعم اللاجئين الأفغان."
  en: "Khaled Hosseini (born 4 March 1965 in Kabul) is an Afghan-American novelist and former physician, author of The Kite Runner (2003), A Thousand Splendid Suns (2007) and And the Mountains Echoed (2013); his family took asylum in the United States in 1980, he practised medicine in California for a decade before writing full-time, and he is a UNHCR goodwill envoy and founder of a foundation supporting Afghan refugees."
  ur: "خالد حسینی ⁦(پیدائش 4 مارچ 1965، کابل)⁩ افغان نژاد امریکی ناول نگار و سابق طبیب ہیں، «دی کائٹ رنر» (2003)، «اے تھاؤزنڈ سپلینڈڈ سنز» (2007) اور «اینڈ دی ماؤنٹینز ایکوڈ» (2013) کے مصنف؛ ان کا خاندان 1980 میں امریکہ میں پناہ گزین ہوا، وہ دس برس طب سے وابستہ رہے، اور وہ یو این ایچ سی آر کے خیرسگالی سفیر ہیں۔"
  es: "Khaled Hosseini (nacido el 4 de marzo de 1965 en Kabul) es un novelista afgano-estadounidense y ex médico, autor de *Cometas en el cielo* (2003), *Mil soles espléndidos* (2007) y *Y las montañas resonaron* (2013); su familia solicitó asilo en Estados Unidos en 1980, ejerció la medicina en California durante una década antes de dedicarse a escribir a tiempo completo, y es enviado de buena voluntad del ACNUR y fundador de una fundación que apoya a los refugiados afganos."
  fr: "Khaled Hosseini (né le 4 mars 1965 à Kaboul) est un romancier afghano-américain et ancien médecin, auteur de Les Cerfs-volants de Kaboul (2003), Mille soleils splendides (2007) et Et les montagnes ont répondu (2013); sa famille a obtenu l'asile aux États-Unis en 1980, il a exercé la médecine en Californie pendant une décennie avant de se consacrer à l'écriture à plein temps, et il est envoyé de bonne volonté du HCR et fondateur d'une fondation soutenant les réfugiés afghans."
  tr: "Khalid Hosseini (4 Mart 1965, Kabil doğumlu), Afgan-Amerikalı romancı ve eski doktordur. \"Kite Runner\" (2003), \"A Thousand Bright Suns\" (2007) ve \"The Mountains Echoed\" (2013) kitaplarının yazarıdır; ailesi 1980'de Amerika Birleşik Devletleri'ne taşındı ve yazmaya kendini adamadan önce on yıl boyunca Kaliforniya'da tıp pratiği yaptı. Birleşmiş Milletler Mülteciler Yüksek Komiserliği için iyi niyet elçisi ve Afgan mültecileri destekleyen bir kuruluşun sahibidir."
  id: "Khalid Hosseini (lahir 4 Maret 1965 di Kabul) adalah seorang novelis dan mantan dokter asal Afghanistan-Amerika, penulis \"Kite Runner\" (2003), \"A Thousand Bright Suns\" (2007), dan \"The Mountains Echoed\" (2013); keluarganya pindah ke Amerika Serikat pada tahun 1980, dan ia berpraktik sebagai dokter di California selama satu dekade sebelum mendedikasikan diri untuk menulis. Ia adalah utusan niat baik untuk Komisaris Tinggi PBB untuk Pengungsi dan pemilik sebuah organisasi yang mendukung pengungsi Afghanistan."
