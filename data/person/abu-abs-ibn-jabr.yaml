summary:
  ar: أنصاري أوسي من بني حارثة، قيل كان اسمه في الجاهلية عبد العزى وقيل معبد فسماه النبي عبد الرحمن؛ ذكره موسى بن عقبة فيمن شهد بدراً، وعدّه ابن الكلبي فيمن قتل كعب بن الأشرف، ومات سنة أربع وثلاثين وصلى عليه عثمان.
  en: An Ansari of the Aws, from the Banu Haritha; his pre-Islamic name is reported as Abd al-Uzza or Ma'bad and the Prophet is said to have named him Abd al-Rahman. Musa ibn Uqba lists him among the Badr fighters, Ibn al-Kalbi counts him among
    the killers of Ka'b ibn al-Ashraf, and he died in 34 AH with Uthman leading the funeral prayer.
  ur: "اوس کے انصاری، بنو حارثہ سے؛ جاہلیت کا نام عبد العزیٰ یا معبد بتایا جاتا ہے اور نبی نے انہیں عبد الرحمٰن کہا۔"
  fr: "Ansarite des Aws, des Banu Haritha ; son nom d'avant l'islam est rapporté comme Abd al-Uzza ou Ma'bad, et le Prophète l'aurait nommé Abd al-Rahman. Musa ibn Uqba le compte parmi les combattants de Badr, Ibn al-Kalbi parmi ceux qui tuèrent Ka'b ibn al-Ashraf, et il mourut en 34 H, Uthman dirigeant la prière funéraire."
  es: "Un Ansari de los Aws, de los Banu Haritha; su nombre preislámico es Abd al-Uzza o Ma'bad, y se dice que el Profeta lo llamó Abd al-Rahman. Musa ibn Uqba lo incluye entre los combatientes de Badr, Ibn al-Kalbi lo cuenta entre los asesinos de Ka'b ibn al-Ashraf, y murió en el año 34 de la Hégira, con Uthman dirigiendo la oración fúnebre."
