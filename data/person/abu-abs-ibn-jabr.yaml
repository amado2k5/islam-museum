summary:
  ar: أنصاري أوسي من بني حارثة، قيل كان اسمه في الجاهلية عبد العزى وقيل معبد فسماه النبي عبد الرحمن؛ ذكره موسى بن عقبة فيمن شهد بدراً، وعدّه ابن الكلبي فيمن قتل كعب بن الأشرف، ومات سنة أربع وثلاثين وصلى عليه عثمان.
  en: An Ansari of the Aws, from the Banu Haritha; his pre-Islamic name is reported as Abd al-Uzza or Ma'bad and the Prophet is said to have named him Abd al-Rahman. Musa ibn Uqba lists him among the Badr fighters, Ibn al-Kalbi counts him among
    the killers of Ka'b ibn al-Ashraf, and he died in 34 AH with Uthman leading the funeral prayer.
