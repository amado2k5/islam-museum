label:
  ar: "محمد بن علي الصوري المحدث"
  en: "Muhammad ibn Ali al-Suri the muhaddith"
  es: "Muhammad ibn Ali al-Suri the muhaddith"
  fr: "Muhammad ibn Ali al-Suri the muhaddith"
  ur: "محدث محمد بن علی السوری"
summary:
  ar: "أبو عبد الله محمد بن علي بن عبد الله الصوري؛ سمع بصيدا من أبي الحسين بن جميع وهو أسند شيوخه، ثم صحب عبد الغني الحافظ فكتب عنه وعن غيره من المصريين، وطلب الحديث بنفسه في الكبر، وقدم بغداد سنة ثمان عشرة وأربعمائة فسمع من ابن مخلد ومن بعده، وكان من أحرص الناس على الحديث وأكثرهم كتابة له، يكتب في الوجه الواحد ثمانين سطرًا ويكرر قراءة الحديث على شيخه. ومضى إلى الكوفة فسمع بها من أربعمائة شيخ وكان يظهر السنة ويترحم على أبي بكر وعمر فثار أهل الكوفة ليقتلوه فالتجأ إلى أبي طالب بن عمر العلوي فأجاره — وكان أبو طالب يسبّ الصحابة — وقال له «قد عشت أربعين سنة أسبّ الصحابة وأشتهي أن أعيش مثلها حتى أذكرهم بخير». قال ابن الطيوري: أكثر كتب الخطيب سوى تاريخ بغداد مستفادة من كتب الصوري. وقسم أمواله في نيف وثلاثين شيئًا وكانت لداخته بصور وخلف عندها اثني عشر عدلًا من الكتب. وكان يصوم الدهر فلا يفطر إلا العيدين والتشريق، وذهبت إحدى عينيه. توفي بالمارستان يوم الأربعاء سلخ جمادى الآخرة سنة إحدى وأربعين وأربعمائة وقد نيف على الستين، وكان سبب موته أن الطبيب الذي فصده كان قد أُعطي مبضعًا مسمومًا ليفصد به غيره فغلط وفصده به؛ ودُفن في مقبرة جامع المدينة {cite:muntazam-ibn-al-jawzi j.8 p.485-487}."
  en: "The muhaddith al-Suri — a latecomer to hadith who became its most zealous collector (eighty lines to a page-side, re-reading to his shaykh), hearing four hundred shaykhs at Kufa where displaying Sunnism nearly cost him his life until the Companions-cursing Alid Abu Talib ibn Umar sheltered him; Ibn al-Tayyuri reports that al-Khatib's books besides Tarikh Baghdad mostly derive from al-Suri's library. He fasted perpetually and left twelve 'adl of books to his niece at Sur. He died at the bimaristan at the end of Jumada II 441 — a physician meant to bleed another man with a poisoned lancet bled him by mistake; past sixty, buried in the Jami' al-Madina cemetery {cite:muntazam-ibn-al-jawzi j.8 p.485-487}."
  es: "El muhaddith al-Suri —un recién llegado al hadiz que se convirtió en su coleccionista más celoso (ochenta líneas por página, releyéndolas a su shaykh), escuchó a cuatrocientos shaykhs en Kufa donde mostrar sunismo casi le costó la vida hasta que Alid Abu Talib ibn Umar, quien maldijo a los Compañeros, lo protegió; Ibn al-Tayyuri informa que los libros de al-Khatib, además del Tarikh Baghdad, provienen en su mayoría de la biblioteca de al-Suri. Ayunaba perpetuamente y dejó doce 'adl de libros a su sobrina en Sur. Murió en el bimaristan al final de Jumada II 441 —un médico que debía sangrar a otro hombre con una lanceta envenenada lo sangró por error; pasados los sesenta, fue enterrado en el cementerio Jami' al-Madina {cite:muntazam-ibn-al-jawzi j.8 p.485-487}."
  fr: "Le muhaddith al-Suri, arrivé tardivement dans le domaine du hadith, devint son collecteur le plus zélé (quatre-vingts lignes par page, qu'il relisait à son cheikh), et écouta quatre cents cheikhs à Koufa. Son sunnisme exacerbé faillit lui coûter la vie, jusqu'à ce qu'Alid Abu Talib ibn Umar, qui maudissait les Compagnons, le protège. Ibn al-Tayyuri rapporte que les ouvrages d'al-Khatib, outre le Tarikh Baghdad, proviennent pour la plupart de la bibliothèque d'al-Suri. Il jeûnait sans cesse et laissa douze 'adl de livres à sa nièce à Sur. Il mourut au bimaristan à la fin du mois de Jumada II 441 – un médecin, qui devait saigner un autre homme avec une lancette empoisonnée, le saigna par erreur. Il avait plus de soixante ans et fut enterré au cimetière Jami' al-Madina (cit.: muntazam-ibn-al-jawzi j.8 p.485-487)."
  ur: "محدث السوری - حدیث کا دیر سے آنے والا جو اس کا سب سے زیادہ پرجوش جمع کرنے والا بن گیا ⁦(صفحہ کی طرف اسّی سطریں، اپنے شیخ کو دوبارہ پڑھنا)⁩، کوفہ میں چار سو شیوخ کو سن کر جہاں سنّت کا مظاہرہ کرتے ہوئے اس کی جان لگ گئی یہاں تک کہ صحابہ پر لعنت کرنے والے علید ابو طالب ابن عمر نے اسے پناہ دی۔ ابن تیوری نے رپورٹ کیا ہے کہ تاریخ بغداد کے علاوہ الخطیب کی کتابیں زیادہ تر السوری کے کتب خانے سے ماخوذ ہیں۔ اس نے ہمیشہ روزہ رکھا اور سور میں اپنی بھانجی کے لیے بارہ عدل کتابیں چھوڑ دیں۔ اس کی موت جمادی الثانی 441 کے آخر میں بمرستان میں ہوئی - ایک طبیب کا مقصد دوسرے آدمی کو زہر آلود لینسیٹ سے خون بہانا تھا۔ ساٹھ کے قریب، جامع المدینہ قبرستان میں مدفون {حوالہ:منتظم ابن الجوزی ج8 ص 485-487}۔"
  tr: "Ebu Abdullah Muhammed bin Ali bin Abdullah el-Suri, Sidon'da en güvenilir öğretmeni olan Ebu el-Hüseyin bin Cami'den dinledi. Sonra Abdülgani el-Hafız ile birlikte ona ve diğer Mısırlılara yazdı, yaşlılıkta kendisi de hadis aradı. Dört yüz on sekiz hicri yılında Bağdat'a geldi ve İbn Mehlad'dan ve sonrakilerden haber aldı. En hevesli ve en sık hadis yazarlarından biriydi; sayfada seksen satır yazdı ve öğretmenine hadisi tekrarladı. Kufe'ye gitti ve dört yüz şeytten haber aldı Sünnilere görünen ve Ebu Bekir ile Ömer'e merhamet dileyen ikhs. Kufe halkı onu öldürmek için ayağa kalktı, bu yüzden Ebu Talib bin Ömer el-Alavi'ye sığındı ve ona sığındı—Ebu Talib Sahabelere hakaret etti—ve dedi ki, 'Kırk yıl boyunca Sahabeleri lanetledim, ve onları iyi hatırlayabilmek için onun gibi yaşamayı arzuluyorum.' İbn el-Teyuri şöyle dedi: El-Hatib'in kitaplarının çoğu, Bağdat Tarihi hariç, el-Suri'nin kitaplarından türetilmiştir. Servetini otuzdan fazla şeye böldü ve ailesi Sur'daydı, geride on iki kitap bıraktı. Bir ömür boyunca oruç tuttu, sadece iki bayram ve Taşreek'te oruç tuttu ve bir gözü kayboldu. Çarşamba günü, 441 Hicri yılında Cumedül-Akhirah'ın soyulmasıyla Al-Maristan'da altmış yaşından fazla yaşta öldü. Ölümünün nedeni, onu atan doktora başkalarını öldürmesi için zehirli bir neşter verilmesiydi; bu yüzden hata yapıp onu onunla birlikte attı. Medine caminin mezarlığına defnedildi {atıf:Muntazam-ibn-al-jawzi J.8 s.485-487}."
  id: "Abu Abdullah Muhammad ibn Ali ibn Abdullah al-Suri mendengar di Sidon dari Abu al-Husayn ibn Jami', yang merupakan guru paling dapat dipercaya. Kemudian ia menemani Abd al-Ghani al-Hafiz dan menulis tentang dirinya dan orang Mesir lainnya, mencari hadis sendiri di usia tua. Ia tiba di Baghdad pada tahun empat ratus delapan belas H dan mendengar dari Ibn Makhlad dan orang-orang setelahnya. Ia termasuk penulis hadis yang paling tajam dan paling sering, menulis delapan puluh baris per halaman dan mengulangi hadis kepada gurunya. Ia pergi ke Kufa dan mendengar dari empat orang seratus sheikh, yang muncul kepada kaum Sunni dan berdoa belas kasihan kepada Abu Bakr dan Umar. Orang-orang Kufa bangkit untuk membunuhnya, sehingga ia berbalik kepada Abu Talib ibn Umar al-Alawi dan mencari perlindungan bersamanya—Abu Talib menghina para sahabat—dan berkata, 'Aku telah hidup selama empat puluh tahun mengutuk para sahabat, dan aku rindu hidup seperti dia agar aku dapat mengingat mereka dengan baik.' Ibn al-Tayuri berkata: Sebagian besar buku al-Khatib, kecuali Sejarah Baghdad, berasal dari kitab-kitab al-Suri. Ia membagi hartanya menjadi lebih dari tiga puluh hal, dan keluarganya berada di Tyre, meninggalkan dua belas eksemplar buku. Ia berpuasa seumur hidup, hanya berbuka puasa pada dua Idul Fitri dan Tashreeq, dan salah satu matanya hilang. Ia meninggal di Al-Maristan pada hari Rabu, akibat pengelupasan Jumada al-Akhirah pada tahun 441 H, lebih dari enam puluh tahun. Penyebab kematiannya adalah dokter yang membuangnya diberi pisau bedah beracun untuk membunuh orang lain, sehingga ia melakukan kesalahan dan membuangnya bersamaan dengan itu. Ia dimakamkan di pemakaman masjid Madinah {cite:Muntazam-ibn-al-jawzi J.8 hlm.485-487}."
