label:
  ar: "محمد بن علي الصوري المحدث"
  en: "Muhammad ibn Ali al-Suri the muhaddith"
summary:
  ar: "أبو عبد الله محمد بن علي بن عبد الله الصوري؛ سمع بصيدا من أبي الحسين بن جميع وهو أسند شيوخه، ثم صحب عبد الغني الحافظ فكتب عنه وعن غيره من المصريين، وطلب الحديث بنفسه في الكبر، وقدم بغداد سنة ثمان عشرة وأربعمائة فسمع من ابن مخلد ومن بعده، وكان من أحرص الناس على الحديث وأكثرهم كتابة له، يكتب في الوجه الواحد ثمانين سطرًا ويكرر قراءة الحديث على شيخه. ومضى إلى الكوفة فسمع بها من أربعمائة شيخ وكان يظهر السنة ويترحم على أبي بكر وعمر فثار أهل الكوفة ليقتلوه فالتجأ إلى أبي طالب بن عمر العلوي فأجاره — وكان أبو طالب يسبّ الصحابة — وقال له «قد عشت أربعين سنة أسبّ الصحابة وأشتهي أن أعيش مثلها حتى أذكرهم بخير». قال ابن الطيوري: أكثر كتب الخطيب سوى تاريخ بغداد مستفادة من كتب الصوري. وقسم أمواله في نيف وثلاثين شيئًا وكانت لداخته بصور وخلف عندها اثني عشر عدلًا من الكتب. وكان يصوم الدهر فلا يفطر إلا العيدين والتشريق، وذهبت إحدى عينيه. توفي بالمارستان يوم الأربعاء سلخ جمادى الآخرة سنة إحدى وأربعين وأربعمائة وقد نيف على الستين، وكان سبب موته أن الطبيب الذي فصده كان قد أُعطي مبضعًا مسمومًا ليفصد به غيره فغلط وفصده به؛ ودُفن في مقبرة جامع المدينة {cite:muntazam-ibn-al-jawzi j.8 p.485-487}."
  en: "The muhaddith al-Suri — a latecomer to hadith who became its most zealous collector (eighty lines to a page-side, re-reading to his shaykh), hearing four hundred shaykhs at Kufa where displaying Sunnism nearly cost him his life until the Companions-cursing Alid Abu Talib ibn Umar sheltered him; Ibn al-Tayyuri reports that al-Khatib's books besides Tarikh Baghdad mostly derive from al-Suri's library. He fasted perpetually and left twelve 'adl of books to his niece at Sur. He died at the bimaristan at the end of Jumada II 441 — a physician meant to bleed another man with a poisoned lancet bled him by mistake; past sixty, buried in the Jami' al-Madina cemetery {cite:muntazam-ibn-al-jawzi j.8 p.485-487}."
