  ar: "قرشي عمري مدني من ذرية عمر بن الخطاب؛ سكن بغداد وحدث بها عن إبراهيم بن سعد الزهري وأبي أويس عبد الله بن عبد الله ومحمد بن عون مولى أم حكيم، وروى عنه محمد بن إسحاق الصاغاني وأبو زرعة الرازي وموسى بن إسحاق الأنصاري وإسماعيل بن الفضل الملخي وموسى بن هارون الحافظ، وذكره البخاري، وقال الدارقطني: ليس به بأس {cite:tarikh-baghdad-khatib j.9 p.447-448}."
  en: "A Qurashi 'Umari of Medina, descended from 'Umar b. al-Khattab; he settled in Baghdad and transmitted there from Ibrahim b. Sa'd al-Zuhri, Abu Uways 'Abdallah b. 'Abdallah and Muhammad b. 'Awn; his students included Muhammad b. Ishaq al-Saghani, Abu Zur'a al-Razi and Musa b. Harun the hafiz; al-Bukhari noted him and al-Daraqutni found no fault in him {cite:tarikh-baghdad-khatib j.9 p.447-448}."
