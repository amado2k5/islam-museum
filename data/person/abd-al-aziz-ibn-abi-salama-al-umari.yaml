summary:
  ar: "قرشي عمري مدني من ذرية عمر بن الخطاب؛ سكن بغداد وحدث بها عن إبراهيم بن سعد الزهري وأبي أويس عبد الله بن عبد الله ومحمد بن عون مولى أم حكيم، وروى عنه محمد بن إسحاق الصاغاني وأبو زرعة الرازي وموسى بن إسحاق الأنصاري وإسماعيل بن الفضل الملخي وموسى بن هارون الحافظ، وذكره البخاري، وقال الدارقطني: ليس به بأس {cite:tarikh-baghdad-khatib j.9 p.447-448}."
  en: "A Qurashi 'Umari of Medina, descended from 'Umar b. al-Khattab; he settled in Baghdad and transmitted there from Ibrahim b. Sa'd al-Zuhri, Abu Uways 'Abdallah b. 'Abdallah and Muhammad b. 'Awn; his students included Muhammad b. Ishaq al-Saghani, Abu Zur'a al-Razi and Musa b. Harun the hafiz; al-Bukhari noted him and al-Daraqutni found no fault in him {cite:tarikh-baghdad-khatib j.9 p.447-448}."
  fr: "Un Qurashite 'Umari de Médine, descendant de 'Umar b. al-Khattab ; il s'établit à Bagdad et y transmit d'Ibrahim b. Sa'd al-Zuhri, d'Abu Uways 'Abdallah b. 'Abdallah et de Muhammad b. 'Awn ; ses élèves comptaient Muhammad b. Ishaq al-Saghani, Abu Zur'a al-Razi et Musa b. Harun le hafiz ; al-Bukhari le mentionna et al-Daraqutni ne lui trouva pas de défaut {cite:tarikh-baghdad-khatib j.9 p.447-448}."
  es: "Un Qurashi 'Umari de Medina, descendiente de 'Umar b. al-Khattab; se instaló en Bagdad y transmitió allí desde Ibrahim b. Sa'd al-Zuhri, Abu Uways 'Abdallah b. 'Abdallah y Mahoma b. 'Arista; sus alumnos incluyeron a Muhammad b. Ishaq al-Saghani, Abu Zur'a al-Razi y Musa b. Harun el hafiz; al-Bukhari lo notó y al-Daraqutni no encontró ningún defecto en él {citar:tarikh-baghdad-khatib j.9 p.447-448}."
  ur: "مدینہ کا ایک قریشی عمری، جو عمر بن خطاب سے تھا۔ الخطاب؛ وہ بغداد میں مقیم ہوئے اور ابراہیم بن سے وہاں منتقل ہوئے۔ سعد الزہری، ابو اویس عبداللہ بن عبداللہ اور محمد بن 'عون؛ ان کے شاگردوں میں محمد ب۔ اسحاق الصغانی، ابو زرعہ الرازی اور موسیٰ بن. ہارون حافظ؛ البخاری نے اسے نوٹ کیا اور دارقطنی نے اس میں کوئی عیب نہیں پایا۔"
  tr: "Ömer ibn el-Hattab'ın soyundan bir Medineli olan Kureyşi; Bağdat'ta yaşadı ve orada İbrahim ibn Saad el-Zuhri, Ebu Uways Abdullah ibn Abdullah ve Ümmü Hakim'in azatlı kölesi Muhammed ibn Avn'dan hadis rivayet etti. Muhammed ibn İshak es-Sagani, Ebu Zur'ah er-Razi, Musa ibn İshak el-Ensari, İsmail ibn el-Fadl el-Melakhi ve Musa ibn Harun el-Hafız ondan rivayet etmiştir. Buhari ondan söz etti ve Darakutni şöyle dedi: Bunda bir sakınca yok. {cite:tarikh-baghdad-khatib j.9 s.447-448}."
  id: "Qurashi, seorang Medina dari keturunan Umar ibn al-Khattab; dia tinggal di Bagdad dan meriwayatkan hadis di sana atas wewenang Ibrahim ibn Saad al-Zuhri, Abu Uways Abdullah ibn Abdullah, dan Muhammad ibn Awn, budak Ummu Hakim yang dibebaskan. Muhammad ibn Ishaq al-Saghani, Abu Zur'ah al-Razi, Musa ibn Ishaq al-Ansari, Ismail ibn al-Fadl al-Malakhi, dan Musa ibn Harun al-Hafiz meriwayatkan darinya. Al-Bukhari menyebutkannya, dan al-Daraqutni berkata: Tidak ada yang salah dengannya. {mengutip:tarikh-baghdad-khatib j.9 hal.447-448}."
