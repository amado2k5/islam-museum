summary:
  ar: "محمد بن محمود بن حسين، أبو الفتح مجد الدين، الأسروشني نسبة إلى أسروشنة في شرق سمرقند، فقيه حنفي أخذ عن أبيه وعن صاحب الهداية وعن السيد ناصر الدين السمرقندي وظهير الدين محمد بن أحمد البخاري وغيرهم. من تصانيفه «الفصول» في المعاملات، و«جامع أحكام الصغار» في الفروع، و«الفتاوى»، و«قرة العينين في إصلاح الدارين». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8196}"
  en: "Muhammad ibn Mahmud ibn Husayn, Abu al-Fath Majd al-Din al-Asrushani, from Asrushana east of Samarqand, a Hanafi jurist. He studied with his father, with the author of al-Hidaya, with Nasir al-Din al-Samarqandi and Zahir al-Din al-Bukhari. His works include al-Fusul on transactions, Jami' ahkam al-sighar, al-Fatawa and Qurrat al-'aynayn. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8196}"
