summary:
  en: "The Khuza'i man who escaped the al-Watir night attack when his companion Munabbih fell; the long apology poem to Budayl ibn Umm Asram is his — though Ibn Hisham notes it is also ascribed to Hubayb ibn Abdullah al-A'lam al-Hudhali."
  ar: "الخزاعي الذي أفلت من تبيية الوتير حين أصيب رفيقه منبه؛ وتروى له قصيدة الاعتذار الطويلة إلى بديل بن أم أصرم — ويقول ابن هشام إنها تروى أيضًا لحبيب بن عبد الله الأعلم الهذلي."
  es: "El hombre de Khuza'i que escapó del ataque nocturno de al-Watir cuando su compañero Munabbih cayó; el largo poema de disculpa a Budayl ibn Umm Asram es suyo, aunque Ibn Hisham señala que también se le atribuye a Hubayb ibn Abdullah al-A'lam al-Hudhali."
  fr: "L'homme de Khuza'i qui a échappé à l'attaque nocturne d'al-Watir lorsque son compagnon Munabbih est tombé; le long poème d'excuses à Budayl ibn Umm Asram est de lui — bien qu'Ibn Hisham note qu'il est également attribué à Hubayb ibn Abdullah al-A'lam al-Hudhali."
