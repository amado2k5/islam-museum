summary:
  ar: "أحد الرجلين اللذين اجتمعا على قتل عمار بن ياسر بصفين مع ابن جون السكسكي، واختلفا في سلبه فاحتكما إلى عبد الله بن عمرو بن العاص فقال لهما اخرجا عني فإني سمعت رسول الله يقول ما لهم ولعمار يدعوهم إلى الجنة ويدعونه إلى النار {cite:muruj-al-dhahab p. 673}."
  en: "One of 'Ammar ibn Yasir's two killers at Siffin (with Ibn Jawn al-Saksaki); they quarrelled over his spoils before 'Abd Allah ibn 'Amr, who drove them off with the Prophet's saying 'he calls you to Paradise and you call him to the Fire' {cite:muruj-al-dhahab p. 673}."
