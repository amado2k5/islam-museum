label: { ar: "أبو العادية العاملي", en: "Abu'l-'Adiyya al-'Amili", fr: "Abu'l-'Adiyya al-'Amili", es: "Abu'l-'Adiyya al-'Amili", ur: "ابوالعدیہ العملی" }
summary:
  ar: "أحد الرجلين اللذين اجتمعا على قتل عمار بن ياسر بصفين مع ابن جون السكسكي، واختلفا في سلبه فاحتكما إلى عبد الله بن عمرو بن العاص فقال لهما اخرجا عني فإني سمعت رسول الله يقول ما لهم ولعمار يدعوهم إلى الجنة ويدعونه إلى النار {cite:muruj-al-dhahab p. 673}."
  en: "One of 'Ammar ibn Yasir's two killers at Siffin (with Ibn Jawn al-Saksaki); they quarrelled over his spoils before 'Abd Allah ibn 'Amr, who drove them off with the Prophet's saying 'he calls you to Paradise and you call him to the Fire' {cite:muruj-al-dhahab p. 673}."
  fr: "L'un des deux meurtriers d''Ammar ibn Yasir à Siffin (avec Ibn Jawn al-Saksaki) ; ils se disputèrent sa dépouille devant 'Abd Allah ibn 'Amr, qui les renvoya avec la parole du Prophète « il vous appelle au Paradis et vous l'appelez au Feu » {cite:muruj-al-dhahab p. 673}."
  es: "Uno de los dos asesinos de 'Ammar ibn Yasir en Siffin (junto con Ibn Jawn al-Saksaki); se pelearon por su botín ante 'Abd Allah ibn 'Amr, quien los ahuyentó con las palabras del Profeta: \"Él te llama al Paraíso y tú lo llamas al Fuego\" {cita:muruj-al-dhahab p. 673}."
  ur: "صفین میں عمار بن یاسر کے دو قاتلوں میں سے ایک ⁦(ابن جون السکسکی کے ساتھ)⁩؛ ان کا عبداللہ بن عمرو کے سامنے اس کے مال غنیمت پر جھگڑا ہوا، جس نے انہیں رسول اللہ کے یہ کہنے پر بھگا دیا کہ وہ آپ کو جنت کی طرف بلاتے ہیں اور آپ اسے آگ کی طرف بلاتے ہیں۔ 673}۔"
  tr: "İbn Cun el-Saksaki ile birlikte Siffin'de Ammar bin Yasir'i öldürmek için komplo kuran iki adamdan biri, ganimetler konusunda anlaşmazlığa düştüler ve davayı Abdullah bin Amr bin el-Aas'a götürdüler. Abdullah bin Amr bin el-Aas onlara, \"Gözümün önünden çekilin, çünkü Allah'ın Resulü'nün şöyle dediğini işittim: 'Onlara ve Ammar'a ne oluyor? O onları cennete çağırıyor, onlar ise onu cehenneme çağırıyor.'\" dedi. {cite:muruj-al-dhahab s. 673}"
  id: "Salah satu dari dua orang yang bersekongkol untuk membunuh Ammar bin Yasir di Siffin bersama Ibn Jun Al-Saksaki, dan mereka berselisih tentang harta rampasannya, sehingga mereka mengajukan perkara mereka kepada Abdullah bin Amr bin Al-Aas, yang berkata kepada mereka, “Pergilah dari hadapanku, karena aku mendengar Rasulullah SAW bersabda, ‘Apa yang salah dengan mereka dan Ammar? Dia menyeru mereka ke Surga dan mereka menyeru dia ke Neraka.’” {kutipan:muruj-al-dhahab hlm. 673}"
