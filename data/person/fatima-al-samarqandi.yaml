summary:
  ar: "فاطمة بنت محمد بن أحمد بن أبي أحمد السمرقندي، فقيهة حنفية، ابنة علاء الدين السمرقندي صاحب «تحفة الفقهاء» وزوجة الكاساني صاحب «البدائع». تفقّهت على أبيها وحفظت التحفة، وكانت تفتي، فكانت الفتوى تخرج بخطها وخط أبيها ثم بخط الثلاثة بعد زواجها، وأقامت بحلب حتى ماتت ودُفن زوجها عندها. {cite:badai-sanai-ilmiyya-v1 p.74} {cite:badai-sanai-ilmiyya-v1 p.75} {cite:badai-sanai-ilmiyya-v1 p.76}"
  en: "Fatima bint Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, a Hanafi jurist, daughter of Ala' al-Din al-Samarqandi, author of Tuhfat al-Fuqaha', and wife of al-Kasani, author of al-Bada'i'. She studied law with her father and memorised al-Tuhfa, and gave fatwas: fatwas went out in her hand and her father's, and after her marriage in the hand of all three. She lived in Aleppo until her death, and her husband was buried beside her."
  ur: "فاطمہ بنت محمد بن احمد بن ابی احمد سمرقندی، حنفی فقیہ، «تحفۃ الفقہاء» کے مصنف علاء الدین سمرقندی کی بیٹی اور «البدائع» کے مصنف کاسانی کی بیوی۔ انہوں نے اپنے والد سے فقہ پڑھی اور التحفہ حفظ کی، اور فتویٰ دیتی تھیں: فتاویٰ ان کے اور ان کے والد کے خط سے، اور شادی کے بعد تینوں کے خط سے جاری ہوتے تھے۔ وہ وفات تک حلب میں رہیں، اور ان کے شوہر ان کے پاس دفن ہوئے۔"
