summary:
  ar: "فاطمة بنت محمد بن أحمد بن أبي أحمد السمرقندي، فقيهة حنفية، ابنة علاء الدين السمرقندي صاحب «تحفة الفقهاء» وزوجة الكاساني صاحب «البدائع». تفقّهت على أبيها وحفظت التحفة، وكانت تفتي، فكانت الفتوى تخرج بخطها وخط أبيها ثم بخط الثلاثة بعد زواجها، وأقامت بحلب حتى ماتت ودُفن زوجها عندها. {cite:badai-sanai-ilmiyya-v1 p.74} {cite:badai-sanai-ilmiyya-v1 p.75} {cite:badai-sanai-ilmiyya-v1 p.76}"
  en: "Fatima bint Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, a Hanafi jurist, daughter of Ala' al-Din al-Samarqandi, author of Tuhfat al-Fuqaha', and wife of al-Kasani, author of al-Bada'i'. She studied law with her father and memorised al-Tuhfa, and gave fatwas: fatwas went out in her hand and her father's, and after her marriage in the hand of all three. She lived in Aleppo until her death, and her husband was buried beside her."
  ur: "فاطمہ بنت محمد بن احمد بن ابی احمد سمرقندی، حنفی فقیہ، «تحفۃ الفقہاء» کے مصنف علاء الدین سمرقندی کی بیٹی اور «البدائع» کے مصنف کاسانی کی بیوی۔ انہوں نے اپنے والد سے فقہ پڑھی اور التحفہ حفظ کی، اور فتویٰ دیتی تھیں: فتاویٰ ان کے اور ان کے والد کے خط سے، اور شادی کے بعد تینوں کے خط سے جاری ہوتے تھے۔ وہ وفات تک حلب میں رہیں، اور ان کے شوہر ان کے پاس دفن ہوئے۔"
  es: "Fatima bint Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, jurista hanafí, hija de Ala' al-Din al-Samarqandi, autor de Tuhfat al-Fuqaha', y esposa de al-Kasani, autor de al-Bada'i'. Estudió derecho con su padre y memorizó al-Tuhfa, y emitió fatuas: estas se emitieron con su firma y la de su padre, y después de su matrimonio, con la de los tres. Vivió en Alepo hasta su muerte, y su esposo fue enterrado junto a ella."
  fr: "Fatima bint Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, juriste hanafite, fille d'Ala' al-Din al-Samarqandi, auteur de Tuhfat al-Fuqaha', et épouse d'al-Kasani, auteur d'al-Bada'i', étudia le droit auprès de son père, mémorisa al-Tuhfa et émit des fatwas. Celles-ci furent émises par elle et son père, puis, après son mariage, par les trois. Elle vécut à Alep jusqu'à sa mort, et son époux fut enterré à ses côtés."
  tr: "Fatimah bint Muhammed bin Ahmed ibn Abi Ahmed el-Samarqandi, Hanefi bir hukukçu, 'Tuhfat al-Fuqaha'nın yazarı Ala'al-Din el-Samarqandi'nin kızı ve 'Al-Bada'i'nin yazarı el-Kasani'nin eşi. Babası yanında fıkıh okudu, tuhfeyi ezberledi ve evlendikten sonra kendi ve babasının el yazısıyla fetva yayımladı, ardından 'al-Thala' el yazısıyla fetvalar yayımladı. Halep'te yaşadı, ölümüne kadar ve kocası orada defnedildi. {cite:badai-sanai-ilmiyya-v1 s.74} {cite:badai-sanai-ilmiyya-v1 s.75} {cite:badai-sanai-ilmiyya-v1 s.76}"
  id: "Fatimah bint Muhammad ibn Ahmad ibn Abi Ahmad al-Samarqandi, seorang ahli hukum Hanafi, putri Ala' al-Din al-Samarqandi, penulis 'Tuhfat al-Fuqaha' dan istri al-Kasani, penulis 'Al-Bada'i'i'. Ia belajar hukum di bawah ayahnya, menghafal tuhfa, dan biasa mengeluarkan fatwa, mengeluarkan fatwa dengan tulisan tangannya sendiri dan ayahnya, lalu dengan tulisan tangan 'al-Thala' setelah menikah. Ia tinggal di Aleppo hingga meninggal dan suaminya dimakamkan di sana. {cite:badai-sanai-ilmiyya-v1 hlm.74} {cite:badai-sanai-ilmiyya-v1 hlm.75} {cite:badai-sanai-ilmiyya-v1 hlm.76}"
