summary:
  ar: "الحسين بن طلال (14 نوفمبر 1935 – 7 فبراير 1999) ثالث ملوك المملكة الأردنية الهاشمية، حكم من 1952 حتى وفاته. وُلد في عمّان أكبر أبناء ولي العهد طلال، واعتلى العرش في السابعة عشرة بعد عزل والده لمرضه، فحكم بمجلس وصاية حتى بلوغه. خاض الأردن في عهده حروبًا مع إسرائيل وفقد الضفة الغربية سنة 1967، وطرد المسلحين الفلسطينيين في أيلول 1970، وفكّ الارتباط القانوني والإداري مع الضفة سنة 1988، وأعاد الانتخابات سنة 1989، وعُرف بوساطاته في المنطقة حتى غدت جنازته من أكبر تجمعات قادة العالم في عصره."
  en: "Hussein bin Talal (14 November 1935 – 7 February 1999) was the third King of Jordan, reigning from 1952 until his death. Born in Amman, the eldest son of Crown Prince Talal, he was enthroned at seventeen after his father's deposition for illness, ruling under a regency until his majority. Under him Jordan fought wars with Israel and lost the West Bank in 1967, expelled Palestinian fighters in Black September 1970, renounced its claim to the West Bank in 1988 and restored elections in 1989; his mediation in the region made his funeral one of the largest gatherings of world leaders of its era."
  ur: "حسین بن طلال (14 نومبر 1935ء – 7 فروری 1999ء) اردن کے تیسرے بادشاہ تھے اور 1952ء سے وفات تک حکمران رہے۔ عمان میں ولی عہد طلال کے بڑے بیٹے کے طور پر پیدا ہوئے اور والد کی بیماری کی بنا پر معزولی کے بعد سترہ برس کی عمر میں تخت نشین ہوئے۔ ان کے دور میں اردن نے اسرائیل سے جنگیں لڑیں، 1967ء میں مغربی کنارہ کھویا، 1970ء میں فلسطینی مسلح تنظیموں کو نکالا، 1988ء میں مغربی کنارے سے دستبرداری کی اور 1989ء میں انتخابات بحال ہوئے۔"
