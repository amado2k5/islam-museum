label:
  ar: أزبك بن طغرلجاي ملك الدست
  en: Uzbek Khan ibn Tughriljay
  es: "Uzbek Khan ibn Tughriljay"
  fr: "Uzbek Khan ibn Tughriljay"
  ur: "ازبک خان ابن تغرلجے"
summary:
  ar: "أزبك بن طغرلجاي بن منكوتمر، ملك الدست بالشمال بعد طغطاي سنة 712هـ؛ بايعه نائب طغطاي قطلتمر بإشارة الخاتون وعاهده على الإسلام فأسلم واتخذ مسجداً للصلاة وأنكر عليه بعض أمرائه فقتله، وكانت المواصلة بينه وبين ملوك مصر فزوج أخته للسلطان الناصر محمد بن قلاوون فبنى بها، وحدثت بينه وبين أبي سعيد بني هلاكو فتنة فبعث عساكره إلى أذربيجان وموقان يدعي أن توريز ومراغة لبني دوشي، ولم تزل الحرب متصلة بينه وبين أبي سعيد إلى أن هلك فولي ابنه جاني بك."
  en: "Uzbek ibn Tughriljay ibn Mengu-Timur, king of the northern Dasht after Tughtay in 712 AH; Tughtay's lieutenant Qutlutmur pledged him at the Khatun's direction on condition of Islam — he converted, built a mosque for prayer and killed the amir who objected — kept up exchanges with Egypt's kings marrying his sister to al-Nasir Muhammad ibn Qalawun, and feuded with Abu Sa'id of the Hulaguids sending armies to Azerbaijan and Mughan claiming Tabriz and Maragha for the Jochids, war unbroken until his death when his son Janibeg succeeded."
  es: "Uzbek ibn Tughriljay ibn Mengu-Timur, rey del Dasht del norte tras Tughtay en el año 712 de la Hégira; el lugarteniente de Tughtay, Qutlutmur, lo juró bajo la condición del Khatun de convertirse al Islam (se convirtió, construyó una mezquita para la oración y mató al emir que se opuso), mantuvo intercambios con los reyes de Egipto, casando a su hermana con al-Nasir Muhammad ibn Qalawun, y se enfrentó a Abu Sa'id de los Hulaguidas, enviando ejércitos a Azerbaiyán y Mughan, reclamando Tabriz y Maragha para los Jochidas; la guerra no cesó hasta su muerte, cuando le sucedió su hijo Janibeg."
  fr: "Uzbek ibn Tughriljay ibn Mengu-Timur, roi du Dasht septentrional après Tughtay en 712 AH; le lieutenant de Tughtay, Qutlutmur, le soumit à l'autorité du Khatun à condition qu'il se convertisse à l'islam — il se convertit, construisit une mosquée pour la prière et tua l'émir qui s'y opposait —, maintint des échanges avec les rois d'Égypte, mariant sa sœur à al-Nasir Muhammad ibn Qalawun, et se querella avec Abu Sa'id des Hulaguids, envoyant des armées en Azerbaïdjan et à Mughan, revendiquant Tabriz et Maragha pour les Jochids, la guerre ne fut interrompue que jusqu'à sa mort, à laquelle son fils Janibeg lui succéda."
  ur: "ازبک ابن تغرلجے ابن مینگو تیمور، 712 ہجری میں تغتائی کے بعد شمالی دشت کا بادشاہ؛ تغطائی کے لیفٹیننٹ قلتمور نے خاتون کی ہدایت پر اسلام کی شرط پر اس سے عہد کیا - اس نے مذہب تبدیل کیا، نماز کے لیے ایک مسجد تعمیر کی اور اعتراض کرنے والے امیر کو قتل کر دیا - مصر کے بادشاہوں کے ساتھ اس کی بہن کی شادی الناصر محمد بن قلاون سے کر دی، اور حلاگوئیس کے ابو سعید کے ساتھ جھگڑا کیا اور عزبرین طبقے کو عزبرین بھیج دیا۔ اور جوچڈز کے لیے ماراگہ، اس کی موت تک جنگ نہ ٹوٹی جب اس کا بیٹا جنیبیگ کامیاب ہوا۔"
  tr: "712 Hicri Yıl'da Tuğtay'dan sonra kuzeyde El-Dast kralı Azbek bin Tuğrilcay bin Mankutamir; Tuğtay'ın yardımcısı Kutlatmar, Hatun'un işaretiyle ona bağlılık yemini etti, İslam'a bağlılık yemini etti, İslam'a geçti ve bir camiyi namaz kılmak için aldı. Bazı prensleri ona karşı çıktı ve onu öldürdü. Mısır krallarıyla arasındaki çatışma devam etti, bu yüzden kız kardeşini Sultan el-Nasir Muhammed bin Kalavun ile evlendirdi ve orada bir bina inşa etti. Kendisi ile Ebu Seyd Banu Hulagu arasında bir çatışma çıktı, bu yüzden askerlerini Azerbaycan'a gönderdi ve Muqan, Turiz ve Maragha'nın Banu Dushi'ye ait olduğunu iddia etti. Onunla Ebu Said arasındaki savaş, oğlu Jani Bek ölene kadar devam etti."
  id: "Azbek ibn Tughriljay ibn Mankutamir, raja Al-Dast, di utara setelah Tughtai pada 712 H; wakil Tughtai, Qutlatmar, bersumpah setia kepadanya atas sinyal Khatun, bersumpah setia kepada Islam, memeluk Islam, dan mengambil masjid untuk shalat. Beberapa pangerannya menentang dan membunuhnya. Konflik antara dia dan raja-raja Mesir berlanjut, sehingga dia menikahkan saudara perempuannya dengan Sultan al-Nasir Muhammad ibn Qalawun, yang membangun sebuah bangunan di sana. Terjadi konflik antara dia dan Abu Sa'id Banu Hulagu, sehingga dia mengirim pasukannya ke Azerbaijan, dan Muqan mengklaim bahwa Turiz dan Maragha milik Banu Dushi. Perang antara dia dan Abu Sa'id berlanjut hingga putranya Jani Bek meninggal."
