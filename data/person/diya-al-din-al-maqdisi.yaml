summary:
  ar: "ضياء الدين أبو عبد الله محمد بن عبد الواحد بن أحمد بن عبد الرحمن السعدي المقدسي الصالحي ⁦(569–643هـ)⁩، الحافظ الكبير محدث عصره. سمع بدمشق ومصر وبغداد وأصبهان وهمذان ونيسابور وهراة ومرو، وكتب الكثير، وبنى بسفح قاسيون مدرسة للمحدثين والغرباء ووقف عليها كتبه. يصفه ابن رجب ناقلاً عن ابن النجار وعمر بن الحاجب والمزي والذهبي بالحفظ والإتقان والورع، ويسرد تصانيفه ومنها «الأحاديث المختارة» و«فضائل الأعمال» و«فضائل الشام» وسير أكابر المقادسة {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 236-240}. الإمام العالم الحافظ الحجة محدث الشام شيخ السنة؛ قال ابن رجب يقال إنه كتب عن أزيد من خمسمائة شيخ، وقال ابن النجار كتبت عنه ببغداد ونيسابور ودمشق وهو حافظ؛ وكان المرجوع إليه في الجرح والتعديل؛ صنف وصحح وليّن وجرّح وعدّل؛ ومن مصنفاته الأحاديث المختارة خرّجها من مسموعاته كتب منها تسعين جزءاً {cite:shadharat-dhahab p. 231-233}."
  en: "Diya' al-Din Abu Abd Allah Muhammad ibn Abd al-Wahid ibn Ahmad ibn Abd al-Rahman al-Sa'di al-Maqdisi al-Salihi (569–643 AH), the great hafiz and leading hadith scholar of his age. He heard hadith in Damascus, Egypt, Baghdad, Isfahan, Hamadan, Nishapur, Herat and Marw, copied a great deal, and built a school for hadith scholars and visiting strangers on the slope of Qasyun, endowing it with his books. Ibn Rajab, quoting Ibn al-Najjar, Umar ibn al-Hajib, al-Mizzi and al-Dhahabi, praises his memory, precision and scrupulousness and lists his works, among them al-Ahadith al-Mukhtara, Fada'il al-A'mal, Fada'il al-Sham and lives of the great Maqdisis. Muhaddith al-Sham, shaykh al-sunna — Ibn Rajab: he wrote from more than five hundred shaykhs; the authority on jarh wa-ta'dil of his age; author of al-Ahadith al-Mukhtara, ninety booklets selected from his own audition records {cite:shadharat-dhahab p. 231-233}."
