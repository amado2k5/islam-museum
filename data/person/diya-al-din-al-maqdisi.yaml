summary:
  ar: "الإمام العالم الحافظ الحجة محدث الشام شيخ السنة؛ قال ابن رجب يقال إنه كتب عن أزيد من خمسمائة شيخ، وقال ابن النجار كتبت عنه ببغداد ونيسابور ودمشق وهو حافظ؛ وكان المرجوع إليه في الجرح والتعديل؛ صنف وصحح وليّن وجرّح وعدّل؛ ومن مصنفاته الأحاديث المختارة خرّجها من مسموعاته كتب منها تسعين جزءاً {cite:shadharat-dhahab p. 231-233}."
  en: "Muhaddith al-Sham, shaykh al-sunna (b. 569, d. 643) — Ibn Rajab: he wrote from more than five hundred shaykhs; the authority on jarh wa-ta'dil of his age; author of al-Ahadith al-Mukhtara, ninety booklets selected from his own audition records {cite:shadharat-dhahab p. 231-233}."
