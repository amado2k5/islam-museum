summary:
  ar: "ضياء الدين أبو عبد الله محمد بن عبد الواحد بن أحمد بن عبد الرحمن السعدي المقدسي الصالحي ⁦(569–643هـ)⁩، الحافظ الكبير محدث عصره. سمع بدمشق ومصر وبغداد وأصبهان وهمذان ونيسابور وهراة ومرو، وكتب الكثير، وبنى بسفح قاسيون مدرسة للمحدثين والغرباء ووقف عليها كتبه. يصفه ابن رجب ناقلاً عن ابن النجار وعمر بن الحاجب والمزي والذهبي بالحفظ والإتقان والورع، ويسرد تصانيفه ومنها «الأحاديث المختارة» و«فضائل الأعمال» و«فضائل الشام» وسير أكابر المقادسة {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 236-240}. الإمام العالم الحافظ الحجة محدث الشام شيخ السنة؛ قال ابن رجب يقال إنه كتب عن أزيد من خمسمائة شيخ، وقال ابن النجار كتبت عنه ببغداد ونيسابور ودمشق وهو حافظ؛ وكان المرجوع إليه في الجرح والتعديل؛ صنف وصحح وليّن وجرّح وعدّل؛ ومن مصنفاته الأحاديث المختارة خرّجها من مسموعاته كتب منها تسعين جزءاً {cite:shadharat-dhahab p. 231-233}."
  en: "Diya' al-Din Abu Abd Allah Muhammad ibn Abd al-Wahid ibn Ahmad ibn Abd al-Rahman al-Sa'di al-Maqdisi al-Salihi (569–643 AH), the great hafiz and leading hadith scholar of his age. He heard hadith in Damascus, Egypt, Baghdad, Isfahan, Hamadan, Nishapur, Herat and Marw, copied a great deal, and built a school for hadith scholars and visiting strangers on the slope of Qasyun, endowing it with his books. Ibn Rajab, quoting Ibn al-Najjar, Umar ibn al-Hajib, al-Mizzi and al-Dhahabi, praises his memory, precision and scrupulousness and lists his works, among them al-Ahadith al-Mukhtara, Fada'il al-A'mal, Fada'il al-Sham and lives of the great Maqdisis. Muhaddith al-Sham, shaykh al-sunna — Ibn Rajab: he wrote from more than five hundred shaykhs; the authority on jarh wa-ta'dil of his age; author of al-Ahadith al-Mukhtara, ninety booklets selected from his own audition records {cite:shadharat-dhahab p. 231-233}."
  es: "Diya' al-Din Abu Abd Allah Muhammad ibn Abd al-Wahid ibn Ahmad ibn Abd al-Rahman al-Sa'di al-Maqdisi al-Salihi (569–643 AH), el gran hafiz y principal erudito de hadices de su época. Escuchó hadices en Damasco, Egipto, Bagdad, Isfahán, Hamadán, Nishapur, Herat y Marw, copió gran cantidad de ellos y construyó una escuela para eruditos de hadices y visitantes en la ladera de Qasyun, dotándola de sus libros. Ibn Rajab, citando a Ibn al-Najjar, Umar ibn al-Hajib, al-Mizzi y al-Dhahabi, elogia su memoria, precisión y escrupulosidad, y enumera sus obras, entre ellas al-Ahadith al-Mukhtara, Fada'il al-A'mal, Fada'il al-Sham y las vidas de los grandes Maqdisis. Muhaddith al-Sham, shaykh al-sunna — Ibn Rajab: escribió de más de quinientos shaykhs; la autoridad en jarh wa-ta'dil de su época; autor de al-Ahadith al-Mukhtara, noventa folletos seleccionados de sus propios registros de audición {cite:shadharat-dhahab p. 231-233}."
  fr: "Diya' al-Din Abu Abd Allah Muhammad ibn Abd al-Wahid ibn Ahmad ibn Abd al-Rahman al-Sa'di al-Maqdisi al-Salihi (569-643 AH), grand hafiz et éminent spécialiste du hadith de son époque. Il recueillit des hadiths à Damas, en Égypte, à Bagdad, Ispahan, Hamadan, Nishapur, Hérat et Marw, en copia un grand nombre, et fonda une école pour les spécialistes du hadith et les étrangers de passage sur les pentes du mont Qasyun, qu'il dota de ses ouvrages. Ibn Rajab, citant Ibn al-Najjar, Umar ibn al-Hajib, al-Mizzi et al-Dhahabi, loue sa mémoire, sa précision et sa rigueur, et énumère ses œuvres, parmi lesquelles al-Ahadith al-Mukhtara, Fada'il al-A'mal, Fada'il al-Sham et les vies des grands Maqdisis. Muhaddith al-Sham, shaykh al-sunna — Ibn Rajab: il a écrit à partir de plus de cinq cents shaykhs; l'autorité sur le jarh wa-ta'dil de son époque; auteur d'al-Ahadith al-Mukhtara, quatre-vingt-dix livrets sélectionnés à partir de ses propres enregistrements d'audition {cite: shadharat-dhahab p. 231-233}."
  ur: "دیا الدین ابو عبد اللہ محمد بن عبد الواحد بن احمد بن عبدالرحمن السعدی المقدسی الصالحی ⁦(569-643 ہجری)⁩، اپنے دور کے عظیم حافظ اور معروف حدیث کے اسکالر تھے۔ اس نے دمشق، مصر، بغداد، اصفہان، ہمدان، نیشاپور، ہرات اور مرو میں حدیثیں سنی، کافی نقل کی، اور قصیون کی ڈھلوان پر محدثین اور اجنبیوں کی عیادت کے لیے ایک مکتب بنایا اور اسے اپنی کتابوں سے نوازا۔ ابن رجب نے ابن النجار، عمر بن الحجیب، المیزی اور الذہبی کا حوالہ دیتے ہوئے ان کی یادداشت، درستگی اور احتیاط کی تعریف کی ہے اور ان کے کاموں کی فہرست دی ہے، ان میں سے الاحادیث المختارہ، فدائل العمل، فضائل الصقیل اور زندہ المصقیل ہیں۔ محدث الشام، شیخ السنۃ ابن رجب: اس نے پانچ سو سے زیادہ شیخوں سے لکھا ہے۔ اپنی عمر کے جرح و تعدیل پر اختیار؛ الاحادیث المختارہ کے مصنف، ان کے اپنے آڈیشن ریکارڈز سے منتخب نوے کتابچے 231-233}۔"
  tr: "Diya'al-Din Ebu Abdullah Muhammed bin Abd al-Wahid ibn Ahmed ibn Abd al-Sa'di al-Maqdisi al-Salihi (569–643 H) döneminin büyük hadis âlimidir. Şam, Mısır, Bağdat, İsfahan, Hamazan, Nişapur, Herat ve Merw'den dinlenmiş, birçok kitap yazmış ve Kasiyoun'un eteğinde hadis alimleri ve yabancılar için bir okul kurmuş, kitaplarını burada onaylamıştır. İbn Recep, onu ezberlenebilir, kesin ve dindar olarak tanımlar ve eserlerini 'Seçilmiş Hadisler' dahil eder: 'Fada'il al-A'mal', 'Fada'il al-Sham,' ve Siyar al-Akabir al-Maqadisa {cite:dhayl-tabaqat-hanabila-faqi-v2, s. 236-240}. Alim, ezberci, hadis âlimi ve Şeyh Şeyh Şeyh Şeyh Şeyh sünnet âlim, alim, hadis âlimi ve Şeyh al-Şeyh İbn Receb, beş yüzü aşkın şeyhten yazdığını söylemiştir. İbn al-Neccar şöyle dedi: Onun hakkında Bağdat, Nişapur ve Şam'da yazdım, o bir ezberciydi; eleştiri ve doğrulamada anıldı; yazar, doğruladı, eleştirdi ve düzenledi. Eserleri arasında, orijinal kaynaklarından çıkardığı ve bunlardan doksan cilt yazdığı seçilmiş hadisler bulunur {atıf:şadharat-dhahab, s. 231-233}."
  id: "Diya' al-Din Abu Abdullah Muhammad ibn Abd al-Wahid ibn Ahmad ibn Abd al-Rahman al-Sa'di al-Maqdisi al-Salihi (569–643 H), ulama hadis besar pada zamannya. Ia mendengar dari Damaskus, Mesir, Baghdad, Isfahan, Hamadhan, Nishapur, Herat, dan Marw, menulis banyak buku, dan membangun sekolah untuk ulama hadis dan orang asing di kaki Qasioun, di mana ia mendukung buku-bukunya. Ibn Rajab menggambarkannya, mengutip Ibn al-Najjar, Umar ibn al-Hajib, al-Mizzi, dan al-Dhahabi sebagai mudah dihafal, tepat, dan saleh, serta mencantumkan karya-karyanya termasuk 'Hadits Terpilih,' 'Fada'il al-A'mal,' 'Fada'il al-Sham,' dan Siyar al-Akabir al-Maqadisa {cite:Dhayl-Tabaqat-hanabila-faqi-v2, hlm. 236-240}. Ulama, penghafal, ulama hadis, dan ulama Shaykh Shaykh Shaykh al-Sunnah, ulama, ulama hadis, dan Shaykh al-Shaykh Ibn Rajab mengatakan bahwa dikatakan ia menulis dari lebih dari lima ratus sheikh. Ibn al-Najjar berkata: Saya menulis tentang beliau di Baghdad, Nishapur, dan Damaskus, dan beliau adalah seorang penghafal; beliau disebutkan dalam kritik dan otentikasi; beliau menulis, mengautentikasi, mengkritik, dan mengedit. Di antara karya-karyanya terdapat hadits terpilih, yang ia ekstrak dari sumber aslinya, dari mana ia menulis sembilan puluh jilid {cite:shadharat-dhahab, hlm. 231-233}."
