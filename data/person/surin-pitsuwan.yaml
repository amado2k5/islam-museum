summary:
  ar: "دبلوماسي وسياسي تايلندي من أصل ملايوي، وُلد في ناخون سي تامارات سنة 1949 وتوفي في بانكوك سنة 2017. عالم سياسة تدرّب في هارفارد، تولى وزارة الخارجية التايلندية من 1997 إلى 2001، ثم صار الأمين العام الثاني عشر لرابطة دول جنوب شرق آسيا (آسيان) من 2008 إلى 2012، وهو أول من تولى هذا المنصب بخبرة سياسية معتبرة."
  en: "Thai diplomat and politician of Malay descent, born at Nakhon Si Thammarat in 1949 and died at Bangkok in 2017. A Harvard-trained political scientist, he was Thailand's foreign minister from 1997 to 2001 and then the twelfth secretary-general of ASEAN from 2008 to 2012, the first holder of that office with significant political experience."
  ur: "ملائی نژاد تھائی سفارت کار اور سیاست دان، 1949ء میں ناخون سی تھامارات میں پیدا ہوئے اور 2017ء میں بینکاک میں وفات پائی۔ ہارورڈ سے تربیت یافتہ سیاسیات دان تھے؛ 1997ء سے 2001ء تک تھائی لینڈ کے وزیرِ خارجہ رہے، پھر 2008ء سے 2012ء تک آسیان کے بارہویں سیکرٹری جنرل رہے — اس منصب پر نمایاں سیاسی تجربہ رکھنے والے پہلے شخص۔"
