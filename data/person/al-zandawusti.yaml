summary:
  ar: "الزندويستي البخاري المبتغي الزاهد، فقيه حنفي، توفي في حدود سنة 400 هـ بحسب ما ذكره الكتاب. أخذ عن أبي حفص السفكردي ومحمد بن إبراهيم الميداني وعبد الله بن الفضل الخيزاخزي، ومن تصانيفه شرح الجامع الكبير للشيباني في الفروع، و«روضة العلماء»، و«المبكيات»، و«نظم الفقه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  en: "Al-Zandawusti, a Bukharan Hanafi jurist and ascetic, who died around 400 AH by the book's estimate. He studied under Abu Hafs al-Sufkurdi, Muhammad ibn Ibrahim al-Maydani and Abd Allah ibn al-Fadl al-Khaizakhzi. His works include a commentary on al-Shaybani's al-Jami' al-kabir on the branches of law, Rawdat al-'ulama', al-Mubkiyat, Mutahayyir al-alfaz and Nazm al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
