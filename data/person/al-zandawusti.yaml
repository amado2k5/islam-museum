summary:
  ar: "الزندويستي البخاري المبتغي الزاهد، فقيه حنفي، توفي في حدود سنة 400 هـ بحسب ما ذكره الكتاب. أخذ عن أبي حفص السفكردي ومحمد بن إبراهيم الميداني وعبد الله بن الفضل الخيزاخزي، ومن تصانيفه شرح الجامع الكبير للشيباني في الفروع، و«روضة العلماء»، و«المبكيات»، و«نظم الفقه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  en: "Al-Zandawusti, a Bukharan Hanafi jurist and ascetic, who died around 400 AH by the book's estimate. He studied under Abu Hafs al-Sufkurdi, Muhammad ibn Ibrahim al-Maydani and Abd Allah ibn al-Fadl al-Khaizakhzi. His works include a commentary on al-Shaybani's al-Jami' al-kabir on the branches of law, Rawdat al-'ulama', al-Mubkiyat, Mutahayyir al-alfaz and Nazm al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  fr: "Al-Zandawusti, un juriste et ascète hanafite Boukharan, qui est mort vers 400 de l’hégire selon l'estimation du livre. Il a étudié sous Abu Hafs al-Sufkurdi, Muhammad ibn Ibrahim al-Maydani et Abd Allah ibn al-Fadl al-Khaizakhzi. Ses œuvres comprennent un commentaire sur al-Jami' al-kabir d'al-Shaybani sur les branches du droit, Rawdat al-'ulama', al-Mubkiyat, Mutahayir al-alfaz et Nazm al-fiqh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
  es: "Al-Zandawusti, un jurista y asceta hanafí de Bujará, que murió alrededor del año 400 d. H. según la estimación del libro. Estudió con Abu Hafs al-Sufkurdi, Muhammad ibn Ibrahim al-Maydani y Abd Allah ibn al-Fadl al-Khaizakhzi. Sus obras incluyen un comentario sobre al-Jami' al-kabir de al-Shaybani sobre las ramas del derecho, Rawdat al-'ulama', al-Mubkiyat, Mutahayyir al-alfaz y Nazm al-fiqh. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15407}"
