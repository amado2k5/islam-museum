summary:
  ar: "داعية القرامطة في نجران في رواية الكتاب، من حاشد ومن موالي بني أمية، نزل قرية رِجلاء من نجران، ولم يُعثر عليه حين أُحيط بمنزله سنة 294هـ."
  en: "In the book's account, the Qarmatian missionary in Najran: a man of Hashid and a client of Banu Umayya, who lodged at the village of Rijla in Najran. He was not found at home when his house was surrounded in 294 AH."
  ur: "کتاب کے بیان کے مطابق نجران میں قرامطہ کا داعی؛ حاشد سے اور بنی امیہ کا موالی، جو نجران کے گاؤں رجلاء میں ٹھہرا۔ 294ھ میں اس کا گھر گھیرا گیا تو وہ وہاں نہیں ملا۔"
  es: "Según el relato del libro, el misionero cármata en Najrán era un hombre de la casta Hashid y cliente de los Banu Umayya, que se hospedaba en la aldea de Rijla, en Najrán. No se le encontró en su casa cuando esta fue rodeada en el año 294 de la Hégira."
  fr: "D'après le récit du livre, le missionnaire qarmate de Najran, un homme de la tribu des Hashid et client des Banu Umayya, logeait au village de Rijla, près de Najran. On ne le trouva pas chez lui lorsque sa maison fut encerclée en 294 AH."
