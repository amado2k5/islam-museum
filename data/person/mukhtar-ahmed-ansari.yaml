summary:
  ar: "طبيب وقائد وطني هندي (1880–1936)، تخرج في مدراس ودرّس الجراحة في لندن وإدنبرة ومارسها رائدًا في جراحة المسالك. ترأس المؤتمر الوطني الهندي (1927) والرابطة الإسلامية، وقاد البعثة الطبية الهندية في حروب البلقان، وكان من مؤسسي الجامعة الملية الإسلامية ومستشارها (1928–1936) بعد حكيم أجمل خان."
  en: "Indian physician and nationalist leader (1880–1936), trained at Madras and in London and Edinburgh, where he was a pioneer of urological surgery. He presided over the Indian National Congress (1927) and the Muslim League, led the Indian medical mission to the Balkan Wars, and was a founder of Jamia Millia Islamia and its chancellor (1928–1936) after Hakim Ajmal Khan."
  ur: "ہندوستانی طبیب اور قوم پرست رہنما (1880ء–1936ء)، مدراس، لندن اور ایڈنبرا سے تعلیم یافتہ، یورولوجی کے ابتدائی ماہر جراح۔ انھوں نے انڈین نیشنل کانگریس (1927ء) اور مسلم لیگ کی صدارت کی، بلقان جنگوں میں ہندوستانی طبی مشن کی قیادت کی، اور جامعہ ملیہ اسلامیہ کے بانی اور حکیم اجمل خان کے بعد اس کے شیخ الجامعہ (1928ء–1936ء) رہے۔"
