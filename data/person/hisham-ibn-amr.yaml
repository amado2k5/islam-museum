summary:
  en: "A prominent Qurayshi notable of Banu Amir ibn Lu'ayy who secretly supplied food to Banu Hashim during the boycott and initiated the effort of the five notables to tear up the unjust charter."
  ar: "وجيه قرشي من بني عامر بن لؤي، كان يصل بني هاشم في الشِعب بالطعام سراً بالليل، وهو الذي سعى في نقض صحيفة المقاطعة فجمع زهيراً والمطعم وأبا البختري وزمعة حتى نُقضت."
  es: "Un destacado notable de la tribu Qurayshi, perteneciente a Banu Amir ibn Lu'ayy, que suministró alimentos en secreto a Banu Hashim durante el boicot e impulsó el esfuerzo de los cinco notables para romper la carta injusta."
  fr: "Un notable qurayshi éminent de Banu Amir ibn Lu'ayy qui a secrètement fourni de la nourriture à Banu Hashim pendant le boycott et a initié l'effort des cinq notables pour déchirer la charte injuste."
  ur: "بنو عامر بن لوئی کا ایک ممتاز قریشی قابل ذکر جس نے بائیکاٹ کے دوران خفیہ طور پر بنو ہاشم کو کھانا فراہم کیا اور پانچوں معززین کی طرف سے غیر منصفانہ چارٹر کو پھاڑنے کی کوشش شروع کی۔"
  tr: "Banu Emiri bin Luayy'den önde gelen bir Kuraşi, geceleri Şaab'ta Banu Haşim'e gizlice yiyecek teslim etti. Muqatta gazetesini devirmeye çalışan oydu; Zuhayra, Al-Mat'im, Abu Al-Bakhtari ve Zama'a'yı topladı ve gazete bozuldu."
  id: "Seorang Qurashi terkemuka dari Banu Amir ibn Lu'ayy, yang diam-diam mengantarkan makanan kepada Banu Hashim di Sha'ab pada malam hari. Dialah yang berusaha membatalkan surat kabar Muqatta, mengumpulkan Zuhayra, Al-Mat'im, Abu Al-Bakhtari, dan Zama'a hingga surat kabar itu dibatalkan."
