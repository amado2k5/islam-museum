label: { ar: "حمزة الزيات", en: "Hamza al-Zayyat", es: "Hamza al-Zayyat", fr: "Hamza al-Zayyat", ur: "حمزہ الزیات" }
summary:
  ar: "حمزة بن حبيب الزيات أحد السبعة يكنى أبا عمارة مولى آل عكرمة بن ربيع التيمي، كان يجلب الزيت من الكوفة إلى حلوان ويحمل من حلوان الجبن والجوز إلى الكوفة، في الطبقة الرابعة من الكوفيين وكان فقيهاً، توفي سنة ست وخمسين ومائة في خلافة أبي جعفر، وله كتاب قراءة حمزة وكتاب الفرائض، وروى عنه خالد بن يزيد والكسائي والحسن بن عطية وعبيد الله بن موسى العبسي {cite:fihrist-ibn-al-nadim p. 76}."
  en: "Kufan reader and jurist (d. 156) who traded oil and cheese between Kufa and Hulwan {cite:fihrist-ibn-al-nadim p. 76}."
  es: "Lector y jurista de Kufa (m. 156) que comerciaba con aceite y queso entre Kufa y Hulwan {cita:fihrist-ibn-al-nadim p. 76}."
  fr: "Lecteur et juriste de Kufa (mort en 156) qui faisait le commerce de l'huile et du fromage entre Kufa et Hulwan {cite:fihrist-ibn-al-nadim p. 76}."
  ur: "کوفان کا قاری اور فقیہ ⁦(متوفی 156)⁩ جو کوفہ اور حلوان کے درمیان تیل اور پنیر کا کاروبار کرتا تھا 76}۔"
  tr: "Yedi kişiden biri olan Hamza ibn Habib al-Zayyat, İkrime bin Rabi' al-Taymi ailesinin özgür kasabası Ebu Amara olarak bilinirdi. Kufa'dan Helwan'a yağ getirir, Helwan'dan Kufa'ya peynir ve ceviz taşırdı. Kufailerin dördüncü sınıfındaydı ve bir hukukçuydu. Ebu Ca'far'ın halifeliği sırasında yüz elli altıncı yılda öldü. Hamza'nın sivaet kitabını ve miras kitabını yazdı. Halid bin Yezid, el-Kisai, el-Hasan ibn Atiyah ve Ubeyd Allah ibn Musa el-Absi ondan rivayet etmişlerdir {atıf:fihrist-ibn-al-nadim s. 76}."
  id: "Hamza ibn Habib al-Zayyat, salah satu dari tujuh orang, dikenal sebagai Abu Amara, mantan keluarga Ikrimah ibn Rabi' al-Taymi. Ia biasa membawa minyak dari Kufa ke Helwan dan mengangkut keju serta kenari dari Helwan ke Kufa. Ia termasuk kelas keempat Kufais dan merupakan seorang ahli hukum. Ia meninggal pada tahun seratus lima puluh enam selama masa khalifah Abu Ja'far. Ia menulis kitab pembacaan Hamza dan kitab warisan. Khalid ibn Yazid, Al-Kisai, Al-Hasan ibn Atiyah, dan Ubayd Allah ibn Musa al-Absi menceritakan darinya {cite:fihrist-ibn-al-nadim hlm. 76}."
