id: person/hamza-al-zayyat
class: person
label: { ar: "حمزة الزيات", en: "Hamza al-Zayyat" }
summary:
  ar: "حمزة بن حبيب الزيات أحد السبعة يكنى أبا عمارة مولى آل عكرمة بن ربيع التيمي، كان يجلب الزيت من الكوفة إلى حلوان ويحمل من حلوان الجبن والجوز إلى الكوفة، في الطبقة الرابعة من الكوفيين وكان فقيهاً، توفي سنة ست وخمسين ومائة في خلافة أبي جعفر، وله كتاب قراءة حمزة وكتاب الفرائض، وروى عنه خالد بن يزيد والكسائي والحسن بن عطية وعبيد الله بن موسى العبسي {cite:fihrist-ibn-al-nadim p. 76}."
  en: "Kufan reader and jurist (d. 156) who traded oil and cheese between Kufa and Hulwan {cite:fihrist-ibn-al-nadim p. 76}."
