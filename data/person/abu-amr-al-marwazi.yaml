  ar: "أبو عمرو المروزي الحكيم، المفوض أمره إلى السميع العليم. قال: من صفات الأولياء ثلاث: الرجوع إلى الله في كل شيء، والفقر إلى الله في كل شيء، والثقة بالله في كل شيء."
  en: "Abu Amr al-Marwazi, the wise, who committed his affair to the All-Hearing, All-Knowing; he said: the friends of God have three attributes: returning to God in all things, poverty before God in all things, and trust in God in all things."
  ur: "ابو عمرو مروزی حکیم تھے، جنہوں نے اپنا معاملہ سننے اور جاننے والے کے سپرد کر دیا تھا۔ انہوں نے کہا: اولیاء کی تین صفات ہیں: ہر چیز میں اللہ کی طرف رجوع، ہر چیز میں اللہ کے آگے محتاجی، اور ہر چیز میں اللہ پر بھروسہ۔"
