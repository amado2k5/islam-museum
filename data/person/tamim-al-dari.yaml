summary:
  ar: "صحابي يروي عنه حديث «الدين النصيحة» وهو الحديث السابع من الأربعين النووية، أخرجه مسلم في صحيحه من طريق سهيل بن أبي صالح عن عطاء بن يزيد الليثي عنه، وقال البخاري إن مدار الحديث كله عليه {cite:sahih-muslim 55}. وروى المسعودي خبره في السفينة التي أضل بها البحر إلى الجزيرة فلقوا الجساسة وصاحب القصر المسلسل بالحديد الذي قال إنه الدجال وأخبرهم بجمل من الملاحم {cite:muruj-al-dhahab p. 530-531}"
  en: "A companion who transmits the hadith 'the religion is sincerity', the seventh hadith of al-Nawawi's Forty, included by Muslim in his Sahih through Suhayl ibn Abi Salih from Ata ibn Yazid al-Laythi from him; al-Bukhari held that the whole hadith rests upon him."
