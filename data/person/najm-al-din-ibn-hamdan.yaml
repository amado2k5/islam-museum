summary:
  ar: "أحمد بن حمدان بن شبيب النميري الحراني، أبو عبد الله، فقيه حنبلي أديب، ولد ونشأ بحران ورحل إلى حلب ودمشق وولي نيابة القضاء في القاهرة وتوفي بها، صاحب «الرعاية الكبرى» و«الرعاية الصغرى» و«صفة المفتي والمستفتي»، 603 إلى 695 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 119}."
  en: "Ahmad ibn Hamdan ibn Shabib al-Numayri al-Harrani, Abu Abd Allah, a Hanbali jurist and man of letters, born and raised in Harran, who travelled to Aleppo and Damascus, served as deputy judge in Cairo and died there; author of al-Ri'aya al-Kubra, al-Ri'aya al-Sughra and Sifat al-Mufti wa-l-Mustafti, 603 to 695 AH (1206 to 1295 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 1 p. 119}."
