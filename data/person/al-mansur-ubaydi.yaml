id: person/al-mansur-ubaydi
class: person
label:
  ar: المنصور بالله إسماعيل بن القائم
  en: al-Mansur bi-Allah Isma'il ibn al-Qa'im
  fr: "al-Mansur bi-Allah Isma'il ibn al-Qa'im"
  es: "al-Mansur bi-Allah Isma'il ibn al-Qa'im"
  ur: "المنصور باللہ اسماعیل بن القیم"
summary:
  ar: ثالث ملوك الدولة العبيدية، إسماعيل بن القائم، قام بعد أبيه ومصر المنصورية ومات بها، وكان أحسن السيرة بعد جده المهدي
    وأبطل المظالم فأحبه الناس، وقام بعده ابنه معد الملقب بالمعز لدين الله {cite:tarikh-khulafa-minhaj-1434 p. 615,617}، وعند
    ابن الأثير توفي سلخ شوال سنة إحدى وأربعين وثلاثمائة وكانت خلافته سبع سنين وستة عشر يوماً وعمره تسع وثلاثون سنة وكان خطيباً
    بليغاً يخترع الخطبة لوقتها، وكان سبب وفاته أنه أصابه في غزوة مطيرة برد شديد وثلج فحمل إلى المنصورية فأراد دخول الحمّام
    فنهّاه طبيبه أسحق بن سليمان فلم يقبل فذهبت الحرارة الغريزية ولازمه السهر، فعالجه شاب ناشئ اسمه إبراهيم بأشياء منوّمة في
    قنينة فشمّها فنام فلما جاء أسحق وعرف قال إن كان صُنع له شيء ينام منه فقد مات فوجدوه ميتاً، وولي بعده ابنه معد المعز لدين
    الله وعمره أربع وعشرون سنة {cite:kamil-ibn-al-athir p. 372-373}.
  en: Isma'il ibn al-Qa'im, third Ubaydid ruler; he founded al-Mansuriyya and died there, the best-conducted of the line after
    his grandfather al-Mahdi, abolishing the exactions — and his son Ma'add succeeded as al-Mu'izz li-Din Allah {cite:tarikh-khulafa-minhaj-1434
    p. 615,617}.
  fr: "Ismaïl ibn al-Qa'im, troisième souverain ubaydid ; il a fondé al-Mansuriyya et y est mort, le mieux conduit de la ligne après son grand-père al-Mahdi, abolissant les exactions - et son fils Ma'add a réussi comme al-Mu'izz li-Din Allah {cite:tarikh-khulafa-minhaj-1434 p. 615,617}."
  es: "Isma'il ibn al-Qa'im, tercer gobernante Ubaydid; fundó al-Mansuriyya y murió allí, el mejor conducido de la línea después de su abuelo al-Mahdi, aboliendo las exacciones, y su hijo Ma'add le sucedió como al-Mu'izz li-Din Allah {cite:tarikh-khulafa-minhaj-1434 p. 615,617}."
  ur: "اسماعیل بن القیم، تیسرا عبید حکمران؛ اس نے المنصوریہ کی بنیاد رکھی اور وہیں وفات پائی، جو اپنے دادا المہدی کے بعد سب سے بہتر طرز عمل کا حامل تھا، اور اس کا بیٹا معد المعز ل الدین اللہ کے طور پر کامیاب ہوا {حوالہ: تاریخ خلفاء منہاج-1434 ص۔ 615,617}۔"
  tr: "Ubeydid hanedanının üçüncü kralı İsmail bin el-Kaim, babasından sonra yükseldi ve Mansurid Mısırı'nda öldü. Dedesi el-Mehdi'den sonra en tanınmış figürdü ve haksızlıkları ortadan kaldıran kişiydi, bu yüzden halk onu sevdi. Yerine oğlu Ma'ad, lakabı El-Mu'izz li-Din Allah (atıf:Tarikh-khulafa-minhaj-1434, s. 615,617} geçti. İbn el-Athir'e göre, 341 Hicri yılında, otuz dokuz yaşında yedi yıl on altı günlük bir halifelikle öldü. O dönem için vaazlar uyduran etkileyici bir hatipti. Ölümünün nedeni, yağmurlu bir savaşta şiddetli soğuk ve kar görmesiydi Al-Mansuriya'ya götürüldü ve hamama girmek istedi, ancak doktoru İshaq bin Süleyman reddetti, fakat o reddetti. İçgüdüsel sıcaklık azaldı ve geç saatlere kadar uyanık kaldı. İbrahim adında genç bir adam ona bir şişede uyku maddesi verdi, kokladı ve uyuyakaldı. İshaq geldiğinde, eğer onu uyutmuşsa ölmüştü diye anladı, fakat onu ölü buldular. Ondan sonra, yirmi dört yaşındaki oğlu Ma'id al-Mu'izz li-Din Allah görevi devraldı {atı:kamil-ibn-al-athir, s. 372-373}."
  id: "Raja ketiga dinasti Ubaydid, Ismail ibn al-Qa'im, bangkit setelah ayahnya dan meninggal di Mesir Mansurid. Ia adalah tokoh paling terkenal setelah kakeknya al-Mahdi dan yang meniadakan ketidakadilan, sehingga orang-orang mencintainya. Ia digantikan oleh putranya Ma'ad, yang dijuluki Al-Mu'izz li-Din Allah {cite:Tarikh-khulafa-minhaj-1434, hlm. 615,617}. Menurut Ibn al-Athir, ia meninggal pada tahun 341 H, dengan masa khalifah tujuh tahun enam belas hari pada usia tiga puluh sembilan tahun. Ia adalah orator yang fasih yang menciptakan khotbah untuk masa itu. Penyebab kematiannya adalah karena ia mengalami dingin dan salju parah selama pertempuran hujan Ia dibawa ke Al-Mansuriya dan ingin masuk ke rumah pemandian, tetapi dokternya, Ishaq ibn Sulayman, menolak, namun ia menolak. Panas naluriah mereda, dan ia begadang larut. Seorang pemuda bernama Ibrahim merawatnya dengan zat tidur dalam botol, mencium baunya, dan ia tertidur. Ketika Ishaq datang dan menyadari bahwa jika ia telah membuatnya tidur, ia telah mati, tetapi mereka menemukannya sudah mati. Setelah itu, putranya Ma'id al-Mu'izz li-Din Allah, berusia dua puluh empat tahun, mengambil alih {cite:kamil-ibn-al-athir, hlm. 372-373}."
