id: person/al-mansur-ubaydi
class: person
label: { ar: "المنصور بالله إسماعيل بن القائم" }
summary:
  ar: "ثالث ملوك الدولة العبيدية، إسماعيل بن القائم، قام بعد أبيه ومصر المنصورية ومات بها، وكان أحسن السيرة بعد جده المهدي وأبطل المظالم فأحبه الناس، وقام بعده ابنه معد الملقب بالمعز لدين الله {cite:tarikh-khulafa-minhaj-1434 p. 615,617}، وعند ابن الأثير توفي سلخ شوال سنة إحدى وأربعين وثلاثمائة وكانت خلافته سبع سنين وستة عشر يوماً وعمره تسع وثلاثون سنة وكان خطيباً بليغاً يخترع الخطبة لوقتها، وكان سبب وفاته أنه أصابه في غزوة مطيرة برد شديد وثلج فحمل إلى المنصورية فأراد دخول الحمّام فنهّاه طبيبه أسحق بن سليمان فلم يقبل فذهبت الحرارة الغريزية ولازمه السهر، فعالجه شاب ناشئ اسمه إبراهيم بأشياء منوّمة في قنينة فشمّها فنام فلما جاء أسحق وعرف قال إن كان صُنع له شيء ينام منه فقد مات فوجدوه ميتاً، وولي بعده ابنه معد المعز لدين الله وعمره أربع وعشرون سنة {cite:kamil-ibn-al-athir p. 372-373}."
  en: "Isma'il ibn al-Qa'im, third Ubaydid ruler; he founded al-Mansuriyya and died there, the best-conducted of the line after his grandfather al-Mahdi, abolishing the exactions — and his son Ma'add succeeded as al-Mu'izz li-Din Allah {cite:tarikh-khulafa-minhaj-1434 p. 615,617}."
