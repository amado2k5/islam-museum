summary:
  ar: "ثالث ملوك الدولة العبيدية، إسماعيل بن القائم، قام بعد أبيه ومصر المنصورية ومات بها، وكان أحسن السيرة بعد جده المهدي وأبطل المظالم فأحبه الناس، وقام بعده ابنه معد الملقب بالمعز لدين الله {cite:tarikh-khulafa-minhaj-1434 p. 615,617}."
  en: "Isma'il ibn al-Qa'im, third Ubaydid ruler; he founded al-Mansuriyya and died there, the best-conducted of the line after his grandfather al-Mahdi, abolishing the exactions — and his son Ma'add succeeded as al-Mu'izz li-Din Allah {cite:tarikh-khulafa-minhaj-1434 p. 615,617}."
