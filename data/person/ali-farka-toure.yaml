summary:
  ar: "مغنٍّ وعازف غيتار مالي، وُلد سنة 1939 في قرية كاناو بمنطقة تمبكتو وتوفي في باماكو سنة 2006. مزج الموسيقى المالية التقليدية بالبلوز حتى لُقّب بـ«جون لي هوكر الأفريقي»، وسجّل مع راي كودر وتاج محل وتوماني دياباتي، وفاز بثلاث جوائز غرامي إحداها بعد وفاته، وصار عمدة لبلدته نيافونكي سنة 2004."
  en: "Malian singer and guitarist, born in 1939 in the village of Kanau in the Timbuktu region and died at Bamako in 2006. He fused traditional Malian music with the blues — he was called 'the African John Lee Hooker' — recorded with Ry Cooder, Taj Mahal and Toumani Diabaté, won three Grammy Awards, one of them posthumously, and became mayor of his home town of Niafunké in 2004."
  ur: "مالی کے گلوکار اور گٹار نواز، جو 1939 میں ٹمبکٹو کے علاقے کے گاؤں کاناؤ میں پیدا ہوئے اور 2006 میں بماکو میں وفات پائی۔ انہوں نے روایتی مالی موسیقی کو بلوز کے ساتھ جوڑا، رائی کوڈر، تاج محل اور تومانی دیاباتے کے ساتھ ریکارڈنگ کی، تین گریمی ایوارڈز جیتے جن میں سے ایک ان کی وفات کے بعد ملا، اور 2004 میں اپنے قصبے نیافنکے کے میئر بنے۔"
