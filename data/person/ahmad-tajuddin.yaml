summary:
  ar: "السلطان السابع والعشرون لبروناي (1924–1950)، أكبر أبناء محمد جمال العالم الثاني الباقين. اعتلى العرش في الحادية عشرة من عمره تحت مجلس وصاية، ونُصّب سنة 1931 وتُوّج سنة 1940، واكتُشف النفط في سيريا سنة 1929 في مطلع عهده. طالب بمزيد من الاستقلال المالي والسياسي عن بريطانيا، وبقي سلطانًا طوال الاحتلال الياباني (1941–1945) وإن اقتصرت سلطته على العادات والشؤون الإسلامية، وتوفي في سنغافورة في حزيران 1950 وخلفه شقيقه الأصغر عمر علي سيف الدين الثالث."
  en: "The 27th Sultan of Brunei (1924–1950), eldest surviving son of Muhammad Jamalul Alam II. He came to the throne aged eleven under a regency council, was installed in 1931 and crowned in 1940; oil was found at Seria in 1929, early in his reign. He pressed for greater financial and political autonomy from Britain, remained sultan through the Japanese occupation (1941–1945) with his authority limited to custom and Islamic affairs, and died in Singapore in June 1950, succeeded by his younger brother Omar Ali Saifuddien III."
  ur: "برونائی کے ستائیسویں سلطان (1924ء–1950ء)، محمد جمال عالم دوم کے سب سے بڑے زندہ بیٹے۔ گیارہ برس کی عمر میں مجلسِ وصایت کے تحت تخت نشین ہوئے، 1931ء میں تنصیب اور 1940ء میں تاج پوشی ہوئی؛ ان کے عہد کے آغاز میں 1929ء میں سیریا میں تیل دریافت ہوا۔ انہوں نے برطانیہ سے زیادہ مالی و سیاسی خودمختاری کا مطالبہ کیا، جاپانی قبضے (1941ء–1945ء) کے دوران سلطان رہے اگرچہ ان کا اختیار رسم و رواج اور اسلامی امور تک محدود تھا، جون 1950ء میں سنگاپور میں وفات پائی اور ان کے چھوٹے بھائی عمر علی سیف الدین سوم جانشین ہوئے۔"
