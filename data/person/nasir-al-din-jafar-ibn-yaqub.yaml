summary:
  ar: "أبو محمد جعفر بن يعقوب الهمداني الملقب بنصير الدين؛ كان نائب عماد الدين زنكي صاحب الجزيرة والموصل والشام، استنابه عنه بالموصل فأحكم عمارة سورها وحفر خنادقها، وفي ولايته قصد الإمام المسترشد حصار الموصل فضايقها مدة ثم رجع الخليفة عنها لم يظل منتقماً، وذلك في شهر رمضان سنة سبع وعشرين وخمسمائة {cite:wafayat-ayan}."
  en: "Nasir al-Din Ja'far b. Ya'qub al-Hamadani — Imad al-Din Zangi's deputy at Mosul; he strengthened its walls and ditches so well that Caliph al-Mustarshid's siege of Ramadan 527 failed {cite:wafayat-ayan}."
  es: "Nasir al-Din Ja'far b. Ya'qub al-Hamadani — lugarteniente de Imad al-Din Zangi en Mosul; reforzó sus murallas y fosos tan bien que el asedio del califa al-Mustarshid en Ramadán 527 fracasó {cite:wafayat-ayan}."
  fr: "Nasir al-Din Ja'far b. Ya'qub al-Hamadani — adjoint d'Imad al-Din Zangi à Mossoul; il a si bien renforcé ses murs et ses fossés que le siège du calife al-Mustarshid en Ramadan 527 a échoué {cite:wafayat-ayan}."
