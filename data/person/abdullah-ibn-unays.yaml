summary:
  ar: جهني حليف بني سلمة من الأنصار، شهد العقبة وما بعدها وكان ممن كسر أصنام بني سلمة؛ بعثه النبي إلى خالد بن نبيح العنزي وحده فقتله؛ رحل إليه جابر مسيرة شهر في حديث، ودخل مصر وخرج إلى أفريقية، ومات بالشام سنة 54هـ على المعروف.
  en: A Juhani and ally of Banu Salima among the Ansar; he was at al-Aqaba and later campaigns and was one of those who broke the idols of Banu Salima; the Prophet sent him alone to Khalid ibn Nubayh al-Anzi, whom he killed; Jabir travelled a
    month to him for a hadith; he entered Egypt and went out to Ifriqiya, and died in Syria in 54 AH as is known.
  ur: "جہنی اور بنو سلیمہ کے حلیف انصار میں سے؛ عقبہ اور بعد کی مہمات میں شریک، اور بنو سلیمہ کے بت توڑنے والوں میں سے۔"
  fr: "Un Juhani allié des Banu Salima parmi les Ansar ; il assista à al-Aqaba et aux campagnes suivantes et fut de ceux qui brisèrent les idoles des Banu Salima ; le Prophète l'envoya seul auprès de Khalid ibn Nubayh al-Anzi, qu'il tua ; Jabir voyagea un mois pour recueillir de lui un hadith ; il entra en Égypte et partit pour l'Ifriqiya, et mourut en Syrie en 54 H, selon ce qui est connu."
  es: "Juhani y aliado de Banu Salima entre los Ansar; estuvo en al-Aqaba y en campañas posteriores y fue uno de los que destruyeron los ídolos de Banu Salima; el Profeta lo envió solo a Khalid ibn Nubayh al-Anzi, a quien mató; Jabir viajó un mes para verlo en busca de un hadiz; entró en Egipto y salió a Ifriqiya, y murió en Siria en el año 54 AH, como se sabe."
  tr: "Cûhani, Ensar'dan Beni Salama'nın müttefikiydi. Akabe'yi ve sonrasında yaşananları gördü. Beni Salama'nın putlarını kıranlardan biriydi. Peygamber onu Halid bin Nebih el-Enzi'ye yalnız gönderdi ve o da Halid'i öldürdü. Bir hadise göre, Cabir bir aylık bir yolculukla ona gitti. Mısır'a girdi ve Afrika'ya çıktı ve bilindiği kadarıyla Hicri 54 yılında Levant'ta öldü."
  id: "Juhani adalah sekutu Bani Salama dari kaum Ansar. Ia menyaksikan peristiwa Aqaba dan peristiwa-peristiwa setelahnya. Ia adalah salah satu orang yang menghancurkan berhala-berhala Bani Salama. Nabi mengirimnya kepada Khalid bin Nabih al-Anzi seorang diri, dan ia membunuhnya. Jabir melakukan perjalanan kepadanya selama sebulan, menurut sebuah hadits. Ia memasuki Mesir dan pergi ke Afrika, dan meninggal di Levant pada tahun 54 Hijriah, menurut apa yang diketahui."
