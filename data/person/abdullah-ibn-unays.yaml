summary:
  ar: جهني حليف بني سلمة من الأنصار، شهد العقبة وما بعدها وكان ممن كسر أصنام بني سلمة؛ بعثه النبي إلى خالد بن نبيح العنزي وحده فقتله؛ رحل إليه جابر مسيرة شهر في حديث، ودخل مصر وخرج إلى أفريقية، ومات بالشام سنة 54هـ على المعروف.
  en: A Juhani and ally of Banu Salima among the Ansar; he was at al-Aqaba and later campaigns and was one of those who broke the idols of Banu Salima; the Prophet sent him alone to Khalid ibn Nubayh al-Anzi, whom he killed; Jabir travelled a
    month to him for a hadith; he entered Egypt and went out to Ifriqiya, and died in Syria in 54 AH as is known.
