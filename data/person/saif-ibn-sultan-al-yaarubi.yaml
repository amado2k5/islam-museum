  en: "Saif ibn Sultan al-Ya'rubi"
  es: "Saif ibn Sultan al-Ya'rubi"
  fr: "Saif ibn Sultan al-Ya'rubi"
  ur: "سیف بن سلطان ال یاروبی"
roles: [imam, ruler]
gender: male
summary:
  ar: "سيف بن سلطان بن سيف بن مالك اليعربي، من أئمة الإباضية في عُمان ورابع اليعربيين، بويع سنة 1104 هـ بعد حصار أخيه بلعرب في يبرين، وأنقذ منبسة من البرتغاليين سنة 1110 هـ، وتوفي بالرستاق سنة 1123 هـ الموافقة 1711 م."
  en: "Saif ibn Sultan ibn Saif ibn Malik al-Ya'rubi, an Ibadi imam of Oman and the fourth Ya'rubid, who received the oath of allegiance in 1104 AH after besieging his brother Bil'arab at Yabrin, rescued Mombasa from the Portuguese in 1110 AH (1698) and died at al-Rustaq in 1123 AH (1711)."
  es: "Saif ibn Sultan ibn Saif ibn Malik al-Ya'rubi, un imán ibadí de Omán y el cuarto Ya'rubid, que recibió el juramento de lealtad en 1104 AH después de sitiar a su hermano Bil'arab en Yabrin, rescató a Mombasa de los portugueses en 1110 AH (1698) y murió en al-Rustaq en 1123 AH (1711)."
  fr: "Saif ibn Sultan ibn Saif ibn Malik al-Ya'rubi, un imam ibadite d'Oman et le quatrième Ya'rubid, qui reçut le serment d'allégeance en 1104 AH après avoir assiégé son frère Bil'arab à Yabrin, sauva Mombasa des Portugais en 1110 AH (1698) et mourut à al-Rustaq en 1123 AH (1711)."
  ur: "سیف بن سلطان بن سیف بن مالک ال یاروبی، عمان کا ایک عبادی امام اور چوتھا یاروبید، جس نے 1104 ہجری میں یبرین میں اپنے بھائی بلعرب کا محاصرہ کرنے کے بعد بیعت کی، ممباسہ کو پرتگالیوں سے چھڑایا اور 1169 ہجری میں وفات پائی۔ 1123ھ (1711)۔"
