summary:
  ar: "شمس الدين إلتتمش (1192 – 30 أبريل 1236)، ثالث سلاطين دهلي المماليك وحاكمها الحقيقي المؤسس. تركي إلبري اشتراه قطب الدين أيبك ثم أعتقه وزوّجه ابنته، فخلع آرام شاه سنة 1211 وثبّت السلطنة من لاهور وبنغال إلى مالوا، ونال سنة 1229 تقليد الخليفة العباسي المستنصر وخلعته، فكان أول سلطان لدهلي يعترف به الخليفة. أسس مجلس الأربعين من أمراء المماليك، وسكّ التانكا الفضية، وأتم مسجد قطب في دهلي ومنارتها، وعيّن ابنته رضية وليّة لعهده قبل وفاته في دهلي سنة 1236."
  en: "Shams ud-Din Iltutmish (1192 - 30 April 1236) was the third sultan of the Mamluk Sultanate of Delhi and its effective founder. An Ilbari Turk bought by Qutb ud-Din Aibak, freed and married to Aibak's daughter, he dethroned Aram Shah in 1211, consolidated the sultanate from Lahore and Bengal to Malwa, and in 1229 received investiture and robes of honour from the Abbasid caliph al-Mustansir — the first Delhi sultan recognised by the caliph. He founded the council of the Forty slave-officers, issued the silver tanka, completed Delhi's Qutb mosque and its minaret, and designated his daughter Razia as his heir before dying at Delhi in 1236."
  ur: "شمس الدین التتمش (1192ء – 30 اپریل 1236ء) دہلی کی مملوک سلطنت کے تیسرے سلطان اور اس کے حقیقی بانی تھے۔ ایک ایلبری ترک تھے جنہیں قطب الدین ایبک نے خریدا، پھر آزاد کر کے اپنی بیٹی سے بیاہ دیا؛ انھوں نے 1211ء میں آرام شاہ کو معزول کیا، لاہور اور بنگال سے مالوہ تک سلطنت کو مستحکم کیا، اور 1229ء میں عباسی خلیفہ المستنصر سے خلعت و سندِ حکومت پائی — وہ پہلے سلطانِ دہلی تھے جنہیں خلیفہ نے تسلیم کیا۔ انھوں نے چہلگانی (چالیس غلام امیروں) کی مجلس بنائی، چاندی کا ٹنکا جاری کیا، دہلی کی قطب مسجد و منار مکمل کیا، اور وفات سے پہلے اپنی بیٹی رضیہ کو ولی عہد نامزد کیا؛ 1236ء میں دہلی میں وفات پائی۔"

