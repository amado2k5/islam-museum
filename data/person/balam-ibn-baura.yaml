summary:
  ar: "بلعام عالم من علماء بني إسرائيل كما يذكره الشيخ عمر عبد الكافي {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:07:30}. يقول الشيخ إنه قطع رحلة طويلة في العلم والهداية، فلما انحرف كان انحرافه طويلا كذلك {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:08:00}."
  en: "Bal'am was one of the scholars of Bani Israel, as Sheikh Omar Abdelkafy mentions him {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:07:30}. The Sheikh says that he travelled a long road in knowledge and guidance, so that when he deviated his deviation was equally long {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:08:00}."
  ur: "شیخ عمر عبد الکافی کے ذکر کے مطابق بلعم بنی اسرائیل کے علماء میں سے ایک تھا {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:07:30}۔ شیخ کہتے ہیں کہ اس نے علم اور ہدایت میں طویل سفر طے کیا تھا، اس لیے جب وہ بھٹکا تو اس کا بھٹکنا بھی طویل تھا {cite:assabile-omar-abdelkafy tafsir-al-quran-al-qareem/ep03 00:08:00}۔"
