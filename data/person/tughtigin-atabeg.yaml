summary:
  ar: "الأتابك ظهير الدين طغتكين؛ كان من أمراء تتش السلجوقي بدمشق فزوجه بأم ولده دقاق ثم صار أتابك دقاق ثم ملك دمشق، وكان سيّداً شجاعاً عاقلاً مدبّراً سائساً له مواقف مشهورة مع الفرنج؛ توفي في صفر سنة اثنتين وعشرين وخمسمائة ودفن بتربته قبل المصلى، وملك بعده ابنه تاج الملوك بوري {cite:shadharat-dhahab p. 545-546}."
  en: "The atabeg Zahir al-Din Tughtigin — once an amir of the Saljuq Tutush at Damascus, married to Duqaq's mother, then Duqaq's atabeg, then lord of Damascus in his own right; a brave, prudent master of policy with famous stands against the Franks; d. Safar 522, buried in his turbah before the musalla, succeeded by his son Taj al-Muluk Buri {cite:shadharat-dhahab p. 545-546}."
