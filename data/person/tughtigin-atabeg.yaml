summary:
  ar: "الأتابك ظهير الدين طغتكين؛ كان من أمراء تتش السلجوقي بدمشق فزوجه بأم ولده دقاق ثم صار أتابك دقاق ثم ملك دمشق، وكان سيّداً شجاعاً عاقلاً مدبّراً سائساً له مواقف مشهورة مع الفرنج؛ توفي في صفر سنة اثنتين وعشرين وخمسمائة ودفن بتربته قبل المصلى، وملك بعده ابنه تاج الملوك بوري {cite:shadharat-dhahab p. 545-546}."
  en: "The atabeg Zahir al-Din Tughtigin — once an amir of the Saljuq Tutush at Damascus, married to Duqaq's mother, then Duqaq's atabeg, then lord of Damascus in his own right; a brave, prudent master of policy with famous stands against the Franks; d. Safar 522, buried in his turbah before the musalla, succeeded by his son Taj al-Muluk Buri {cite:shadharat-dhahab p. 545-546}."
  es: "El atabeg Zahir al-Din Tughtigin —en su día emir de los Tutush selyúcidas en Damasco, casado con la madre de Duqaq, luego atabeg de Duqaq, y después señor de Damasco por derecho propio; un valiente y prudente maestro de la política con famosas posturas contra los francos; murió en Safar 522, enterrado en su turbah frente a la musalla, sucedido por su hijo Taj al-Muluk Buri {cite:shadharat-dhahab p. 545-546}."
  fr: "L'atabeg Zahir al-Din Tughtigin — ancien émir des Saldjoukides de Damas, marié à la mère de Duqaq, puis atabeg de Duqaq, puis seigneur de Damas de plein droit; un homme politique courageux et prudent, célèbre pour ses prises de position contre les Francs; mort en Safar 522, enterré dans sa turbah devant la musalla, remplacé par son fils Taj al-Muluk Buri {cite: shadharat-dhahab p. 545-546}."
  ur: "اطبیگ ظہیر الدین تغتگین - ایک بار دمشق میں سلجوق توتش کا امیر، دقاق کی والدہ سے شادی کی، پھر دقاق کی عتبیگ، پھر اپنے طور پر دمشق کے آقا؛ فرینکس کے خلاف مشہور موقف کے ساتھ پالیسی کا ایک بہادر، سمجھدار ماسٹر؛ d صفر 522، مصلے سے پہلے اس کی تربت میں دفن کیا گیا، اس کے بعد اس کا بیٹا تاج الملوک بری ⁦(حوالہ: شدارت ذہاب ص)⁩ 545-546}۔"
