summary:
  ar: "شاهقلي خان زنگنه (توفي 1716)، نبيل كردي كان الصدر الأعظم للشاه الصفوي سلطان حسين من 1707 إلى وفاته. هو الابن الثالث للوزير شيخ علي خان زنگنه، بدأ واليًا على كرمانشاه في ثمانينيات القرن السابع عشر ثم صار قورجي باشي (قائد الحرس الملكي) سنة 1691 بعد إعدام سارو خان سهندلو الذي احتجّ شاهقلي على قتلِه أفرادًا من إيل زنگنه، وبلغ الصدارة العظمى سنة 1707 فخلفه عند وفاته صهرُه فتح علي خان داغستاني."
  en: "Shahqoli Khan Zanganeh (died 1716) was a Kurdish nobleman who served as grand vizier to the Safavid shah Soltan Hoseyn from 1707 until his death. The third son of the vizier Shaykh Ali Khan Zanganeh, he began as governor of Kermanshah in the 1680s, became qurchi-bashi (head of the royal bodyguard) in 1691 after the execution of Saru Khan Sahandlu — against whose killing of Zanganeh tribesmen he had protested — and reached the grand vizierate in 1707; on his death he was succeeded by his son-in-law Fath-Ali Khan Daghestani."
  ur: "شاہ قلی خان زنگنہ (وفات 1716ء) ایک کرد رئیس تھے جو 1707ء سے وفات تک صفوی شاہ سلطان حسین کے وزیرِ اعظم رہے۔ وزیر شیخ علی خان زنگنہ کے تیسرے بیٹے تھے؛ 1680ء کی دہائی میں کرمانشاہ کے حاکم بنے، 1691ء میں سارو خان سہندلو کی پھانسی کے بعد — جس کے ہاتھوں زنگنہ قبیلے کے افراد کے قتل پر انھوں نے احتجاج کیا تھا — قرچی باشی (شاہی محافظ دستے کے سربراہ) ہوئے، اور 1707ء میں وزارتِ عظمیٰ تک پہنچے؛ وفات پر ان کے داماد فتح علی خان داغستانی جانشین ہوئے۔"

