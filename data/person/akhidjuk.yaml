summary:
  ar: "أخي جوك، أمير مجهول الاسم في تبريز في القرن الثامن الهجري/الرابع عشر الميلادي، كان من أتباع الملك الأشرف الجوبانيّ، وتولى تبريز وأذربيجان بعد أن ترك بردي بك المدينة سنة 758هـ/1357م، ثم أعدمه أويس الجلائري سنة 760هـ/1359م {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
  en: "Akhidjuk, 'little akhi', an amir of unknown name at Tabriz in the 8th/14th century, a follower of the Chobanid Malik Ashraf. He took Tabriz and Azerbaijan in 758/1357 when Berdi Beg left the city, and was executed by the Jalayirid Uways when Uways captured Tabriz in 760/1359 {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
