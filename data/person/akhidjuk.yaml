summary:
  ar: "أخي جوك، أمير مجهول الاسم في تبريز في القرن الثامن الهجري/الرابع عشر الميلادي، كان من أتباع الملك الأشرف الجوبانيّ، وتولى تبريز وأذربيجان بعد أن ترك بردي بك المدينة سنة 758هـ/1357م، ثم أعدمه أويس الجلائري سنة 760هـ/1359م {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
  en: "Akhidjuk, 'little akhi', an amir of unknown name at Tabriz in the 8th/14th century, a follower of the Chobanid Malik Ashraf. He took Tabriz and Azerbaijan in 758/1357 when Berdi Beg left the city, and was executed by the Jalayirid Uways when Uways captured Tabriz in 760/1359 {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
  fr: "Akhidjuk, « petit akhi », émir au nom inconnu à Tabriz au VIIIe siècle H/XIVe siècle, partisan du Tchoupanide Malik Ashraf. Il prit Tabriz et l’ensemble de l’Azerbaïdjan en 758 H/1357 lorsque Berdi Beg quitta la ville, et fut exécuté par le Jalayiride Uways quand celui-ci s’empara de Tabriz en 760 H/1359 {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
  es: "Akhidjuk, 'pequeño akhi', un emir de nombre desconocido en Tabriz en el siglo VIII/XIV, seguidor del chobaní Malik Ashraf. Tomó Tabriz y Azerbaiyán en 758/1357 cuando Berdi Beg abandonó la ciudad, y fue ejecutado por el jalayírida Uways cuando este capturó Tabriz en 760/1359 {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
