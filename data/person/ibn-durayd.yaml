label: { ar: "ابن دريد أبو بكر", en: "Ibn Durayd" }
summary:
  ar: "أبو بكر محمد بن الحسن بن دريد، توفي ببغداد في خلافة القاهر سنة إحدى وعشرين وثلاثمائة؛ عند المسعودي برع في زمنه في الشعر وانتهى في اللغة وقام مقام الخليل بن أحمد فيها وأورد أشياء في اللغة لم توجد في كتب المتقدمين، ومن جيد شعره المقصورة التي مدح بها الشاه بن ميكال وعارضه فيها جماعة من الشعراء {cite:muruj-al-dhahab p. 673-674}.، وأفرد لجمع ألفاظ النبي وموجز أقواله كتاباً ترجمه بكتاب المجتبى {cite:muruj-al-dhahab p. 594}، وولد بالبصرة في سكة صالح سنة ثلاث وعشرين ومائتين وقال ابن النديم إن كتبه صارت بعد موته إلى فارس {cite:fihrist-ibn-al-nadim p. 178}"
  en: "Abu Bakr Muhammad ibn al-Hasan ibn Durayd — poet and philologist who died at Baghdad in 321 in al-Qahir's reign; al-Mas'udi ranks him successor to al-Khalil in language and cites his muqassura in praise of al-Shah ibn Mikal {cite:muruj-al-dhahab p. 673-674}."
