label: { ar: "ابن دريد أبو بكر", en: "Ibn Durayd", es: "Ibn Durayd", fr: "Ibn Durayd", ur: "ابن دورید" }
summary:
  ar: "أبو بكر محمد بن الحسن بن دريد، توفي ببغداد في خلافة القاهر سنة إحدى وعشرين وثلاثمائة؛ عند المسعودي برع في زمنه في الشعر وانتهى في اللغة وقام مقام الخليل بن أحمد فيها وأورد أشياء في اللغة لم توجد في كتب المتقدمين، ومن جيد شعره المقصورة التي مدح بها الشاه بن ميكال وعارضه فيها جماعة من الشعراء {cite:muruj-al-dhahab p. 673-674}. وأفرد لجمع ألفاظ النبي وموجز أقواله كتاباً ترجمه بكتاب المجتبى {cite:muruj-al-dhahab p. 594}، وولد بالبصرة في سكة صالح سنة ثلاث وعشرين ومائتين وقال ابن النديم إن كتبه صارت بعد موته إلى فارس {cite:fihrist-ibn-al-nadim p. 178} وعند ابن الجوزي كان يقال: أبو بكر بن دريد أعلم الشعراء وأشعر العلماء، وقال الدارقطني لما سئل عنه قد تكلموا فيه، وذكر ابن شاهين أنهم كانوا يدخلون عليه فيستحون مما يرون منه من المغاقة والشراب وقد جاز التسعين، وأبو منصور الأزهري دخل عليه فرآه سكران فلم يعد إليه؛ توفي يوم الأربعاء لثنتي عشرة ليلة بقيت من شعبان فحُملت جنازته فإذا جنازة أبي هاشم الجبائي فقيل إن علم اللغة والكلام مات بموت ابن دريد والجبائي ودُفنا جميعًا في مقابر الخيزران، وذكروا دفن سيبويه والكسائي في يوم واحد وبكوا على الكلام والعربية طويلًا {cite:muntazam-ibn-al-jawzi p. 262}."
  en: "Abu Bakr Muhammad ibn al-Hasan ibn Durayd — poet and philologist who died at Baghdad in 321 in al-Qahir's reign; al-Mas'udi ranks him successor to al-Khalil in language and cites his muqassura in praise of al-Shah ibn Mikal {cite:muruj-al-dhahab p. 673-674}."
  es: "Abu Bakr Muhammad ibn al-Hasan ibn Durayd — poeta y filólogo que murió en Bagdad en 321 durante el reinado de al-Qahir; al-Mas'udi lo sitúa como sucesor de al-Khalil en el lenguaje y cita su muqassura en alabanza de al-Shah ibn Mikal {cite:muruj-al-dhahab p. 673-674}."
  fr: "Abu Bakr Muhammad ibn al-Hasan ibn Durayd — poète et philologue décédé à Bagdad en 321 sous le règne d'al-Qahir; al-Mas'udi le classe comme successeur d'al-Khalil en matière de langue et cite sa muqassura à la gloire d'al-Shah ibn Mikal {cite:muruj-al-dhahab p. 673-674}."
  ur: "ابوبکر محمد بن الحسن ابن دورید - شاعر اور ماہر فلسفہ جو 321 میں القاہیر کے دور میں بغداد میں فوت ہوئے؛ المسعودی نے اسے زبان میں الخلیل کا جانشین قرار دیا ہے اور شاہ ابن میکال کی تعریف میں اس کے مقصورہ کا حوالہ دیا ہے۔ 673-674}۔"
  tr: "Ebu Bekir Muhammed bin el-Hasan ibn Duraid, 321 Hicri yılında el-Kahir halifeliği sırasında Bağdat'ta öldü; el-Mes'udi döneminde şiirde ve dilde üstün başarı gösterdi, orada el-Halil bin Ahmed'in huzurunda durdu. Erken alimlerin kitaplarında bulunmayan dilbilimsel çalışmaları da dahil etti. En iyi şiirlerinden biri, Şah ibn Mikal'i övdüğü ve bir grup şair tarafından karşı çıktığı maksuradır {atıf:Muruj-al-Dhahab, s. 673-674}. Peygamber'in sözlerini toplamak ve sözlerini özetlemek için bir kitap adadı; bunu al-Mujtaba kitabı olarak çevirdi {cite:muruj-al-dhahab, s. 594}. 223 Hile yılında Basra'da doğdu. İbn el-Nadim, kitaplarının ölümünden sonra Farsça olduğunu söylemiştir {cite:fihrist-ibn-al-nadim s. 178}. İbn al-Jawzi'ye göre, şöyle denmiştir: Ebu Bekir bin Duraid, şairler ve şiir alimleri arasında en bilgili kişiydi. El-Daraqutni, kendisi hakkında sorulduğunda onun hakkında konuştuklarını söyledi. İbn Şahin, onların kendisine girip içme ve içme konusunda gördüklerinden utandıklarını ve bunun izin verildiğini belirtmiştir Ebu Mansur el-Ezhari içeri girdi ve onu sarhoş gördü, bu yüzden geri dönmedi; Şaban'dan on iki gece sonra Çarşamba günü öldü, bu yüzden cenazesini ben taşıdım. Ebu Haşim el-Cuba'i'nin cenazesinin yapıldığı ortaya çıktı. Dilbilim ve teolojinin, İbn Düraid ve el-Cübai'nin ölümüyle birlikte öldüğü ve hepsinin bambu mezarlıklara gömüldüğü söylenirdi. Sibawayh ve el-Kisai'nin bir günde defnedilmesinden bahsettiler ve uzun süre konuşma ve Arapça üzerinde ağladılar {atıf:Muntazam-ibn-al-jawzi, s. 262}."
  id: "Abu Bakr Muhammad ibn al-Hasan ibn Duraid wafat di Baghdad selama masa kekhalifahan al-Qahir pada tahun 321 H; di bawah al-Mas'udi, ia unggul dalam puisi pada masanya dan berbahasa, berdiri di hadapan al-Khalil ibn Ahmad di sana. Ia memasukkan karya linguistik yang tidak ditemukan dalam buku-buku para ulama awal. Di antara puisi terbaiknya adalah maqsurah, yang dipuji Shah ibn Mikal dan ditentang oleh sekelompok penyair {cite:muruj-al-dhahab, hlm. 673-674}. Ia mendedikasikan sebuah buku untuk mengumpulkan kata-kata Nabi dan merangkum ucapannya, yang kemudian diterjemahkannya sebagai kitab al-Mujtaba {cite:muruj-al-dhahab, hlm. 594}. Ia lahir di Basra pada tahun 223 H. Ibn al-Nadim mengatakan bahwa buku-bukunya menjadi berbahasa Persia setelah kematiannya {cite:fihrist-ibn-al-nadim hlm. 178}. Menurut Ibn al-Jawzi, dikatakan bahwa Abu Bakr ibn Duraid adalah penyair dan ulama puisi yang paling berpengetahuan. Al-Daraqutni mengatakan ketika ditanya tentang dirinya, mereka berbicara tentang dirinya. Ibn Shaheen menyebutkan bahwa mereka biasa mendekatinya dan merasa malu atas apa yang mereka persepsikan tentang dirinya dalam hal minum dan minum, dan hal itu diperbolehkan Abu Mansur al-Azhari masuk dan melihatnya mabuk, sehingga ia tidak kembali; ia meninggal pada hari Rabu dua belas malam setelah Sha'ban, jadi saya yang mengurus pemakamannya. Diketahui bahwa pemakaman Abu Hashim al-Juba'i diadakan. Dikatakan bahwa linguistik dan teologi meninggal bersama kematian Ibn Duraid dan al-Juba'i, dan mereka semua dimakamkan di pemakaman bambu. Mereka menyebutkan pemakaman Sibawayh dan al-Kisai dalam satu hari dan menangis lama atas ucapan dan bahasa Arab {cite:Muntazam-ibn-al-jawzi, hlm. 262}."
