id: person/nazuk
class: person
label: { ar: "نازوك صاحب الشرطة" }
summary:
  ar: "صاحب شرطة بغداد أيام المقتدر؛ أمره بإحضار المحسن بن ابن الفرات من مخبئه فأخذه، وأشار عليه مع مؤنس وهارون بن غريب بقتل ابن الفرات وولده فقُتلا سنة 312هـ {cite:kamil-ibn-al-athir p. 113}. وعند ابن الأثير تولى مع الشرطة حجابة الخليفة في خلافة القاهر فأمر الرجالة المصافية بقلع خيامهم من دار الخليفة فعظم ذلك عليهم وكانوا سبب رد المقتدر سنة 317هـ {cite:kamil-ibn-al-athir p. 150}"
  en: "Chief of police of Baghdad under al-Muqtadir; he fetched the hidden al-Muhsin ibn al-Furat and joined Mu'nis and Harun ibn Gharib in urging the father and son's killing in 312 {cite:kamil-ibn-al-athir p. 113}."
  es: "Jefe de policía de Bagdad bajo el mando de al-Muqtadir; rescató al escondido al-Muhsin ibn al-Furat y se unió a Mu'nis y Harun ibn Gharib para instigar el asesinato del padre y el hijo en 312 {cite:kamil-ibn-al-athir p. 113}."
  fr: "Chef de la police de Bagdad sous al-Muqtadir; il a récupéré le caché al-Muhsin ibn al-Furat et s'est joint à Mu'nis et Harun ibn Gharib pour inciter au meurtre du père et du fils en 312 {cite:kamil-ibn-al-athir p. 113}."
  ur: "بغداد کے پولیس چیف المقتدیر کے ماتحت؛ اس نے چھپے ہوئے المحسن ابن الفرات کو لایا اور 312 میں باپ اور بیٹے کے قتل کی ترغیب دینے میں معنیس اور ہارون بن غریب کے ساتھ شامل ہو گیا۔ 113}۔"
  tr: "El-Muqtadir'in zamanında Bağdat polis başı, ona el-Muhsin ibn İbn el-Furat'ı saklandığı yerden getirmesini emretti, bu yüzden onu aldı ve Mu'annis ile Harun ibn Garib ile birlikte İbn el-Furat ve oğlunu öldürmesini emretti; böylece 312 Hicri yılında öldürüldüler {atıf:kamil-ibn-al-athir s. 113}. İbn el-Athir ile birlikte polisle birlikte halifenin avukatı oldu ve temizleyicilere halifenin konutundan çadırlarını kaldırmalarını emretti; bu durum onları derinden etkiledi ve 317 Hicri'de el-Muqtadir'in püskürtülmesine neden oldu {cite:kamil-ibn-al-athir s. 150}"
  id: "Kepala polisi Baghdad pada masa al-Muqtardir memerintahkannya untuk membawa al-Muhsin ibn Ibn al-Furat dari tempat persembunyiannya, sehingga ia membawanya, dan bersama Mu'annis dan Harun ibn Gharib, memerintahkannya untuk membunuh Ibn al-Furat dan putranya, sehingga mereka dibunuh pada tahun 312 H {cite:kamil-ibn-al-athir hlm. 113}. Bersama Ibn al-Athir, ia mengambil alih sebagai pengacara khalifah di kepolisian, memerintahkan para pemurni untuk memindahkan tenda mereka dari kediaman khalifah, yang sangat mempengaruhi mereka dan menjadi alasan penolakan al-Muqtatir pada tahun 317 H {cite:kamil-ibn-al-athir hlm. 150}"
