summary:
  ar: "صاحب شرطة بغداد أيام المقتدر؛ أمره بإحضار المحسن بن ابن الفرات من مخبئه فأخذه، وأشار عليه مع مؤنس وهارون بن غريب بقتل ابن الفرات وولده فقُتلا سنة 312هـ {cite:kamil-ibn-al-athir p. 113}.، وعند ابن الأثير تولى مع الشرطة حجابة الخليفة في خلافة القاهر فأمر الرجالة المصافية بقلع خيامهم من دار الخليفة فعظم ذلك عليهم وكانوا سبب رد المقتدر سنة 317هـ {cite:kamil-ibn-al-athir p. 150}"
  en: "Chief of police of Baghdad under al-Muqtadir; he fetched the hidden al-Muhsin ibn al-Furat and joined Mu'nis and Harun ibn Gharib in urging the father and son's killing in 312 {cite:kamil-ibn-al-athir p. 113}."
