summary:
  ar: "مؤلفة بريطانية مسلمة ومؤسِّسة جمعية خيرية. اعتنقت الإسلام سنة 1999، وأسست جمعية «سولاس يو كي» سنة 2010 لدعم النساء المعتنقات للإسلام ممن يواجهن صعوبات، وأطلقت سنة 2019 برنامج «Honest Tea Talk» على يوتيوب وتشارك في تقديمه. نشرت لها دار بنغوين «Ramadan Reflections» (2023) فصار من أكثر كتب قائمة صنداي تايمز مبيعا، ثم «The Power of Du'a» و«Living with the Qur'an» (2025)."
  en: "British Muslim author and charity founder. She converted to Islam in 1999 and in 2010 founded Solace UK, a registered charity supporting women converts to Islam who find themselves in difficulty. In 2019 she launched the YouTube talk show Honest Tea Talk, which she co-hosts. Penguin published her Ramadan Reflections in 2023, a Sunday Times bestseller, followed by The Power of Du'a and Living with the Qur'an (2025)."
  ur: "برطانوی مسلمان مصنفہ اور خیراتی ادارے کی بانی۔ انہوں نے 1999 میں اسلام قبول کیا اور 2010 میں «سولاس یو کے» قائم کی، جو مشکلات کا شکار نو مسلم خواتین کی مدد کرتی ہے۔ 2019 میں انہوں نے یوٹیوب پروگرام «Honest Tea Talk» شروع کیا، جس کی وہ شریک میزبان ہیں۔ پینگوئن نے ان کی کتاب Ramadan Reflections 2023 میں شائع کی، جو سنڈے ٹائمز کی سب سے زیادہ فروخت ہونے والی کتابوں میں شامل ہوئی؛ اس کے بعد The Power of Du'a اور Living with the Qur'an (2025) شائع ہوئیں۔"
