  es: "Uno de los dos Hakamis que escribieron a al-Hadi pidiéndole que fuera a su país y ofreciéndole entregar lo que tenían en su poder."
  fr: "L'un des deux Hakamis qui ont écrit à al-Hadi pour lui demander de venir dans leur pays et lui proposer de leur remettre ce qu'ils détenaient."
  tr: "El-Hadi'ye yazan ve ülkelerine yürüyüp sahip olduklarını teslim etmesini isteyen Hakimlerden biri."
  id: "Salah satu Hakim yang menulis surat kepada Al-Hadi memintanya untuk berbaris ke negara mereka dan menyerahkan apa yang mereka miliki."
