summary:
  ar: "إمام وواعظ كندي، وُلد في المدينة المنورة لأبوين من أصول هندو-كاريبية ونشأ في تورنتو. درس نحو عقد في جامعة المدينة المنورة، ويعمل عالمًا مقيمًا في المعهد الإسلامي في تورنتو وإمامًا في مركز السكينة المجتمعي، ويقدّم سلسلة الأسئلة والأجوبة «اسأل مصلح» على الإنترنت، واختير سنة 2016 مرسّخًا مسلمًا لدى شرطة تورنتو."
  en: "A Canadian imam and preacher, born in Madinah to Indo-Caribbean parents and raised in Toronto. He studied for about a decade at the Islamic University of Madinah, serves as Resident Scholar at the Islamic Institute of Toronto and as an imam at the Sakinah Community Center, hosts the online question-and-answer series 'Ask Musleh', and was selected in 2016 as a Muslim chaplain with the Toronto Police Service."
  ur: "کینیڈین امام اور واعظ؛ مدینہ منورہ میں ہند-کیریبین والدین کے ہاں پیدا ہوئے اور ٹورنٹو میں پرورش پائی۔ انہوں نے اسلامی یونیورسٹی مدینہ میں تقریباً ایک دہائی تعلیم حاصل کی، اسلامی انسٹیٹیوٹ آف ٹورنٹو میں ریزیڈنٹ اسکالر اور سکینہ کمیونٹی سینٹر میں امام ہیں، آن لائن سلسلہ «اسأل مصلح» پیش کرتے ہیں، اور 2016 میں ٹورنٹو پولیس سروس کے مسلم چیپلن منتخب ہوئے۔"
