summary:
  ar: "مريم ميرزاخاني (12 أيار 1977 – 14 تموز 2017) رياضياتية إيرانية، أول امرأة وأول إيرانية تنال ميدالية فيلدز (2014) عن عملها على ديناميك وهندسة سطوح ريمان. نالت ذهبيتي أولمبياد الرياضيات الدولي، ودكتوراه هارفارد 2004، وكانت أستاذة في جامعة ستانفورد، وتوفيت بسرطان الثدي عن أربعين عامًا."
  en: "Maryam Mirzakhani (12 May 1977 – 14 July 2017) was an Iranian mathematician, the first woman and first Iranian to win the Fields Medal (2014), for her work on the dynamics and geometry of Riemann surfaces. She won two International Mathematical Olympiad gold medals, took her doctorate at Harvard in 2004, was a professor at Stanford University, and died of breast cancer aged forty."
