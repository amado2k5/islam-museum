summary:
  ar: "قارئ قرآن كويتي وإمام المسجد الكبير بالكويت وخطيب ومنشد، وُلد سنة 1976، درس القراءات العشر والتفسير في الجامعة الإسلامية بالمدينة المنورة، وانتشرت تسجيلاته القرآنية والإنشادية في العالم عبر القنوات والمنصات الرقمية."
  en: "Kuwaiti Quran reciter, imam of the Grand Mosque of Kuwait, preacher and nasheed artist, born in 1976. He studied the ten qira'at and tafsir at the Islamic University of Madinah, and his Quran recordings and nasheeds have spread worldwide through broadcast channels and digital platforms."
