roles: [jurist, scholar]
gender: male
summary:
  ar: "أبو علي الحسين بن محمد بن أحمد المرورودي، الفقيه الشافعي المعروف بالقاضي، صاحب التعليقة في الفقه، إمام كبير صاحب وجوه غريبة في المذهب، أخذ عن القفال المروزي وأخذ عنه البغوي، توفي بمروروذ سنة 462 هـ."
  en: "Abu Ali al-Husayn ibn Muhammad ibn Ahmad al-Marwarrudhi, the Shafi'i jurist known as al-Qadi and author of the Ta'liqa, a great imam with unusual views in the school; pupil of al-Qaffal al-Marwazi and teacher of al-Baghawi; died at Marw al-Rudh in 462 AH (1069 CE)."
  es: "Abu Ali al-Husayn ibn Muhammad ibn Ahmad al-Marwarrudhi, el jurista shafi'í conocido como al-Qadi y autor de la Ta'liqa, un gran imán con puntos de vista inusuales en la escuela; discípulo de al-Qaffal al-Marwazi y maestro de al-Baghawi; murió en Marw al-Rudh en el año 462 de la Hégira (1069 d. C.)."
  fr: "Abu Ali al-Husayn ibn Muhammad ibn Ahmad al-Marwarrudhi, le juriste Shafi'i connu sous le nom d'al-Qadi et auteur de la Ta'liqa, un grand imam aux vues inhabituelles dans l'école; élève d'al-Qaffal al-Marwazi et maître d'al-Baghawi; mort à Marw al-Rudh en 462 AH (1069 CE)."
  ur: "ابو علی الحسین بن محمد بن احمد المرورضی، شافعی فقیہ جو القادی کے نام سے جانے جاتے ہیں اور تقلیقہ کے مصنف، مکتب میں غیر معمولی خیالات کے حامل ایک عظیم امام؛ القفل المروازی کے شاگرد اور البغوی کے استاد؛ 462 ہجری ⁦(1069 عیسوی)⁩ میں مرو الرض میں وفات پائی۔"
  tr: "Ebu Ali el-Hüseyin ibn Muhammed ibn Ahmed el-Marwurdi, el-Kadi olarak bilinen Şafii fihikhi, fıkhâh tefsiri yazarı, okulda tuhaf figürleri olan büyük bir imam, el-Qaffal el-Mervazı ve el-Bağhavi'nin yanında eğitim almış, 462 Hicri yılında Mururudh'da vefat etti."
  id: "Abu Ali al-Husayn ibn Muhammad ibn Ahmad al-Marwurdi, ahli hukum Shafi'i yang dikenal sebagai al-Qadi, penulis komentar tentang fiqh, seorang imam besar dengan tokoh-tokoh aneh di sekolah tersebut, belajar di bawah bimbingan al-Qaffal al-Marwazi dan al-Baghawi, meninggal di Mururudh pada tahun 462 H."
