summary:
  ar: "قارئ قرآن عُماني وُلد في ولاية لوى سنة 1995. حفظ القرآن صغيرًا، وتخرج في العلوم الاقتصادية والسياسية بجامعة السلطان قابوس، وانتشرت تلاوته منذ سنة 2013 في الخليج والعالم، وأمَّ المصلين في التراويح في دول عدة، وحصل سنة 2025 على إجازة بختم القرآن بالقراءات من مجمع القرآن الكريم بالشارقة."
  en: "Omani Qur'an reciter born in Liwa in 1995. He memorised the Qur'an as a child, graduated in economics and political science from Sultan Qaboos University, and became known across the Gulf and beyond from 2013 for his recitations; he has led taraweeh prayers in several countries, and in 2025 received an ijaza for completing the Qur'an in the various readings from the Sharjah Holy Qur'an Academy."
  ur: "عمانی قاریِ قرآن، جو 1995ء میں ولایتِ لویٰ میں پیدا ہوئے۔ انھوں نے بچپن میں قرآن حفظ کیا، جامعہ سلطان قابوس سے اقتصادیات اور سیاسیات میں تعلیم حاصل کی، اور 2013ء سے ان کی تلاوت خلیج اور دنیا بھر میں مشہور ہوئی؛ انھوں نے کئی ممالک میں تراویح کی امامت کی، اور 2025ء میں شارجہ کے مجمع القرآن الکریم سے قراءات میں ختمِ قرآن کی اجازہ حاصل کی۔"
