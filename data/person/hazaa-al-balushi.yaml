summary:
  ar: "قارئ قرآن عُماني وُلد في ولاية لوى سنة 1995. حفظ القرآن صغيرًا، وتخرج في العلوم الاقتصادية والسياسية بجامعة السلطان قابوس، وانتشرت تلاوته منذ سنة 2013 في الخليج والعالم، وأمَّ المصلين في التراويح في دول عدة، وحصل سنة 2025 على إجازة بختم القرآن بالقراءات من مجمع القرآن الكريم بالشارقة."
  en: "Omani Qur'an reciter born in Liwa in 1995. He memorised the Qur'an as a child, graduated in economics and political science from Sultan Qaboos University, and became known across the Gulf and beyond from 2013 for his recitations; he has led taraweeh prayers in several countries, and in 2025 received an ijaza for completing the Qur'an in the various readings from the Sharjah Holy Qur'an Academy."
  ur: "عمانی قاریِ قرآن، جو 1995ء میں ولایتِ لویٰ میں پیدا ہوئے۔ انھوں نے بچپن میں قرآن حفظ کیا، جامعہ سلطان قابوس سے اقتصادیات اور سیاسیات میں تعلیم حاصل کی، اور 2013ء سے ان کی تلاوت خلیج اور دنیا بھر میں مشہور ہوئی؛ انھوں نے کئی ممالک میں تراویح کی امامت کی، اور 2025ء میں شارجہ کے مجمع القرآن الکریم سے قراءات میں ختمِ قرآن کی اجازہ حاصل کی۔"
  es: "Recitador omaní del Corán, nacido en Liwa en 1995. Memorizó el Corán de niño, se graduó en economía y ciencias políticas por la Universidad Sultan Qaboos y se dio a conocer en todo el Golfo y más allá desde 2013 por sus recitaciones; ha dirigido las oraciones de taraweeh en varios países y en 2025 recibió una ijaza por completar el Corán en las diversas lecturas de la Academia del Sagrado Corán de Sharjah."
  fr: "Récitation du Coran omanaise, née à Liwa en 1995. Il a mémorisé le Coran dès son enfance, est diplômé en économie et sciences politiques de l'Université Sultan Qaboos et s'est fait connaître dans le Golfe et au-delà à partir de 2013 pour ses récitations; il a dirigé les prières de taraweeh dans plusieurs pays et a reçu en 2025 une ijaza pour avoir terminé la récitation du Coran dans ses différentes lectures de l'Académie du Saint Coran de Sharjah."
  tr: "1995 yılında Wilayat Liwa'da doğan Ummanlı bir Kur'an okuyucusu. Genç yaşta Kur'an'ı ezberledi ve Sultan Qaboos Üniversitesi'nden ekonomi ve siyaset bilimleri bölümünden mezun oldu. 2013'ten beri Körfez ve dünya çapında yaygınlaştı, birçok ülkede teravih namazlarına öncülük etti ve 2025'te Sharjah'taki Kur'an Kompleksi'nden Kur'an'ı okuma ile tamamlama lisansı aldı."
  id: "Seorang pembaca Al-Qur'an Oman, lahir di Wilayat Liwa pada tahun 1995. Ia menghafal Al-Qur'an sejak usia muda dan lulus dalam ilmu ekonomi dan politik dari Universitas Sultan Qaboos. Pembacaannya telah menyebar sejak 2013 di Teluk dan seluruh dunia, memimpin shalat Taraweeh di beberapa negara, dan pada tahun 2025 ia memperoleh izin untuk menyelesaikan Al-Quran dengan pembacaan Al-Qur'an dari Kompleks Al-Quran di Sharjah."
