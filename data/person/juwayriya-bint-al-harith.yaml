    ar: "جويرية بنت الحارث أم المؤمنين ابنة سيد بني المصطلح، تزوجها النبي فأطلق المسلمون ما في أيديهم من سبي قومها تكريماً له."
    en: "Juwayriya bint al-Harith, a Mother of the Believers and daughter of Banu'l-Mustaliq's chief; her marriage led the Muslims to free their captives of her tribe in honor."
