summary:
  ar: أم المؤمنين، ابنة سيد بني المصطلق؛ وقعت في السبي يوم المريسيع فكاتبت على نفسها، فأدى النبي كتابتها وتزوجها، فأطلق الناس ما في أيديهم من بني المصطلق، فأعتق الله بها مئة أهل بيت.
  en: "A Mother of the Believers, daughter of the chief of Banu al-Mustaliq; she fell among the captives at al-Muraysi' and arranged her own manumission, the Prophet paid it and married her, and people released the Mustaliq captives they held, so that a hundred households were freed through her."
  ur: "ام المؤمنین، بنو مصطلق کے سردار کی بیٹی؛ مریسیع میں قیدیوں میں آئیں اور اپنی آزادی کا بندوبست کیا۔"
  es: "Una Madre de los Creyentes, hija del jefe de Banu al-Mustaliq; cayó entre los cautivos en al-Muraysi' y gestionó su propia manumisión, el Profeta la pagó y se casó con ella, y la gente liberó a los cautivos Mustaliq que tenían, de modo que cien familias fueron liberadas gracias a ella."
  fr: "Une Mère des Croyants, fille du chef des Banu al-Mustaliq; elle tomba parmi les captifs à al-Muraysi' et organisa sa propre affranchissement, le Prophète le paya et l'épousa, et les gens libérèrent les captifs Mustaliq qu'ils détenaient, de sorte qu'une centaine de familles furent libérées grâce à elle."
  tr: "Banu el-Mustaliq'in efendisinin kızı ümmü mu'minin, el-Muraisi'ah gününde esaret edildi ve kendisi hakkında bir ferman yazdı. Peygamber onun yazdığı şeyi yerine getirdi ve onunla evlendi, halk Banu el-Mustaliq'ın ne varsa serbest bıraktı ve Allah onun aracılığıyla hane halkından yüz kişiyi özgür bıraktı."
  id: "um al-Mu'minin, putri penguasa Banu al-Mustaliq, jatuh ke dalam tawanan pada hari al-Muraisi'ah dan menulis titah terhadap dirinya sendiri. Nabi memenuhi perkataannya dan menikahinya, dan rakyat melepaskan apa pun yang dimiliki Banu al-Mustaliq, dan Allah membebaskan seratus anggota keluarga melalui dirinya."
