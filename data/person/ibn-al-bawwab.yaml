summary:
  ar: "أبو الحسن علي بن هلال المعروف بابن البواب الكاتب المشهور؛ لم يوجد في المتقدمين ولا المتأخرين من خطّ مثله ولا قاربه؛ كان أبو علي ابن مقلة أول من نقل هذه الطريقة من خط الكوفيين وله فضيلة السبق، لكن ابن البواب هذّب طريقته ونقّحها وكساها طلاوة وبهجة؛ ويقال له ابن الستري لأن أباه كان بوّاباً والبواب ملازم ستر الباب؛ وكان شيخه في الكتابة ابن أسد الكاتب أبو عبد الله محمد بن أسد القارئ الكاتب البزاز البغدادي {cite:wafayat-ayan}. ويذكر ابن الجوزي في وفيات سنة ٤١٣ أنه مات وله نحو ثمانين سنة — وهو أسبق مما ورد في وفيات الأعيان — {cite:muntazam-ibn-al-jawzi j.8 p.352}."
  en: "Ibn al-Bawwab, Abu al-Hasan Ali b. Hilal (d. 423) — the calligrapher without peer before or since: he refined Ibn Muqla's script into the graceful hand that set the standard; his teacher was the katib Ibn Asad {cite:wafayat-ayan}."
  es: "Ibn al-Bawwab, Abu al-Hasan Ali b. Hilal (m. 423) — el calígrafo sin igual antes ni después: refinó la escritura de Ibn Muqla hasta convertirla en la elegante caligrafía que estableció el estándar; su maestro fue el katib Ibn Asad {cite:wafayat-ayan}."
  fr: "Ibn al-Bawwab, Abu al-Hasan Ali b. Hilal (d. 423) — le calligraphe sans égal avant ou après lui: il a raffiné l'écriture d'Ibn Muqla en une écriture gracieuse qui a établi la norme; son maître était le katib Ibn Asad {cite:wafayat-ayan}."
  ur: "ابن البوّاب، ابو الحسن علی ب. ہلال ⁦(متوفی 423)⁩ - اس سے پہلے یا بعد کے ہم مرتبہ کے بغیر خطاط: اس نے ابن مقلہ کے اسکرپٹ کو خوبصورت ہاتھ میں بہتر کیا جس نے معیار قائم کیا۔ ان کے استاد کاتب ابن اسد تھے۔"
  tr: "Ebu el-Hasan Ali ibn Hilal, ünlü yazıcı İbn al-Bawwab olarak bilinir, yazısının erken veya sonraki nesilleri arasında ya da rakibinde bulunmamıştır. Ebu Ali ibn Maqla, bu yöntemi Kufiyyin yazısından ilk aktaran kişidir ve öncül olma ayrıcalığına sahiptir, ancak İbn el-Bevveb yöntemini geliştirmiş, inceltmiş ve coşkuyla klonlamıştır. Babası kapıcıydı ve kapıcı kapı kapağının görevlisiydi. Yazı öğretmeni İbn Asad, yazıcı Ebu Abdullah Muhammed bin Asad, şiife ve yazıcı el-Bazzaz el-Bağdadi {alıntı:) idi. Wafayat-ayan}. İbn al-Jawzi, 413 yıllık ölümde yaklaşık seksen yaşında öldüğünü belirtir — bu, önemli ölümlerde bahsedilenden daha erken — {atıf:muntazam-ibn-al-jawzi J.8 s.352}."
  id: "Abu al-Hasan Ali ibn Hilal, yang dikenal sebagai Ibn al-Bawwab, juru tulis terkenal, tidak ditemukan di antara generasi awal atau kemudian aksara atau pesaingnya. Abu Ali ibn Maqla adalah yang pertama meneruskan metode ini dari aksara Kufiyyin dan memiliki keistimewaan sebagai yang didahului, tetapi Ibn al-Bawwab menyempurnakan metodenya, menyempurnakannya, dan mengkloningnya dengan penuh kegembiraan dan sukacita. Ia disebut Ibn al-Sutri karena ayahnya adalah penjaga pintu dan penjaga pintu adalah penjaga penutup pintu. Guru tulisannya adalah Ibn Asad, juru tulis Abu Abdullah Muhammad ibn Asad, pembaca dan juru tulis, al-Bazzaz al-Baghdadi {cite:Wafayat-Ayan}. Ibn al-Jawzi menyebutkan dalam kematian 413 tahun bahwa ia meninggal sekitar usia delapan puluh tahun — yang lebih awal daripada yang disebutkan dalam kematian terkenal — {cite:muntazam-ibn-al-jawzi J.8 hlm.352}."
