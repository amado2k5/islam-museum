summary:
  ar: "أبو الحسن علي بن هلال المعروف بابن البواب الكاتب المشهور؛ لم يوجد في المتقدمين ولا المتأخرين من خطّ مثله ولا قاربه؛ كان أبو علي ابن مقلة أول من نقل هذه الطريقة من خط الكوفيين وله فضيلة السبق، لكن ابن البواب هذّب طريقته ونقّحها وكساها طلاوة وبهجة؛ ويقال له ابن الستري لأن أباه كان بوّاباً والبواب ملازم ستر الباب؛ وكان شيخه في الكتابة ابن أسد الكاتب أبو عبد الله محمد بن أسد القارئ الكاتب البزاز البغدادي {cite:wafayat-ayan}."
  en: "Ibn al-Bawwab, Abu al-Hasan Ali b. Hilal (d. 423) — the calligrapher without peer before or since: he refined Ibn Muqla's script into the graceful hand that set the standard; his teacher was the katib Ibn Asad {cite:wafayat-ayan}."
