summary:
  ar: "أول من أسلم من بني خطمة ويُدعى القارئ؛ سمع النبي يقول: ألا آخذ لي من ابنة مروان؟ فسرى على عصماء بنت مروان في بيتها ليلاً فقتلها، فقال له النبي: نصرت الله ورسوله يا عمير؛ ثم تحدّى قومه بني خطمة أن يكيدوه، فكان ذلك اليوم أول ما عزّ الإسلام فيهم."
  en: "The first of Banu Khatma to accept Islam, called 'the Reciter'; he heard the Prophet say 'is there no one to deal with the daughter of Marwan for me?', went to Asma' bint Marwan's house that night and killed her, and the Prophet told him 'you have helped God and His Messenger, Umayr'; he then defied his people, Banu Khatma, to take revenge, and that day Islam first became strong among them."
