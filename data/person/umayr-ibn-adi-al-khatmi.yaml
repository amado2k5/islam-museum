summary:
  ar: "أول من أسلم من بني خطمة ويُدعى القارئ؛ سمع النبي يقول: ألا آخذ لي من ابنة مروان؟ فسرى على عصماء بنت مروان في بيتها ليلاً فقتلها، فقال له النبي: نصرت الله ورسوله يا عمير؛ ثم تحدّى قومه بني خطمة أن يكيدوه، فكان ذلك اليوم أول ما عزّ الإسلام فيهم."
  en: "The first of Banu Khatma to accept Islam, called 'the Reciter'; he heard the Prophet say 'is there no one to deal with the daughter of Marwan for me?', went to Asma' bint Marwan's house that night and killed her, and the Prophet told him 'you have helped God and His Messenger, Umayr'; he then defied his people, Banu Khatma, to take revenge, and that day Islam first became strong among them."
  ur: "بنو خطمہ کا پہلا مسلمان، «قاری» کہلاتا؛ اس نے نبی کو کہتے سنا «کوئی نہیں ہے جو بنو نضیر کی بیٹیوں سے نمٹے»۔"
  es: "El primero de los Banu Khatma en aceptar el Islam, llamado 'el Recitador', escuchó al Profeta decir '¿no hay nadie que se encargue de la hija de Marwan por mí?', fue a la casa de Asma' bint Marwan esa noche y la mató, y el Profeta le dijo 'has ayudado a Dios y a Su Mensajero, Umayr'; entonces desafió a su pueblo, los Banu Khatma, a vengarse, y ese día el Islam se fortaleció por primera vez entre ellos."
  fr: "Le premier des Banu Khatma à se convertir à l'islam, surnommé « le Récitateur », entendit le Prophète dire: « N'y a-t-il personne pour s'occuper de la fille de Marwan ? », se rendit cette nuit-là chez Asma' bint Marwan et la tua. Le Prophète lui dit alors: « Tu as aidé Dieu et Son Messager, Umayr. » Il défia ensuite son peuple, les Banu Khatma, pour se venger, et ce jour-là, l'islam commença à se répandre parmi eux."
  tr: "Banu Hatmah'tan İslam'ı ilk benimseyen ve Kari olarak adlandırılan kişi, Peygamber'in şöyle dediğini duydu: Mervan'ın kızından kendim almamalı mıyım? Gece Mervan'ın kızı Asma'nın evine gitti ve onu öldürdü. Peygamber ona dedi ki: Allah'ı ve Onun Elçisi'ni destekledin, ey Ümmer; sonra onun karmı Banu Hatmah, ona karşı komplo kurması için onu meydan okudu ve o gün İslam ilk kez aralarında güçlendi."
  id: "Orang pertama yang memeluk Islam dari Banu Khatmah, yang disebut Qari, mendengar Nabi berkata: Bukankah aku harus mengambil untuk diriku sendiri dari putri Marwan? Dia pergi kepada Asma, putri Marwan, di rumahnya pada malam hari dan membunuhnya. Nabi berkata kepadanya: Engkau telah mendukung Allah dan Rasul-Nya, wahai Umair; kemudian umat-Nya, Banu Khatmah, menantangnya untuk bersekongkol melawannya, dan hari itu adalah pertama kalinya Islam menjadi kuat di antara mereka."
