summary:
  ar: "صحفي ومذيع أعمال كندي أمريكي، وُلد في نيروبي سنة 1969 ونشأ في تورونتو. كان كبير مراسلي الأعمال في سي إن إن إبان الأزمة المالية سنة 2008، ثم قدّم برنامجًا على الجزيرة أمريكا، ومنذ 2016 يقدّم برامج على إم إس إن بي سي (إم إس ناو حاليًا)، ونشر مذكراته «أعمال شجاعة صغيرة» سنة 2024."
  en: "Canadian-American business journalist and anchor, born in Nairobi in 1969 and raised in Toronto. CNN's chief business correspondent through the 2008 financial crisis, he later hosted Ali Velshi on Target at Al Jazeera America and, from 2016, programmes on MSNBC (now MS NOW), and published the memoir Small Acts of Courage in 2024."
  ur: "کینیڈین نژاد امریکی کاروباری صحافی اور اینکر، جو 1969 میں نیروبی میں پیدا ہوئے اور ٹورنٹو میں پلے بڑھے۔ 2008 کے مالی بحران کے دوران سی این این کے چیف بزنس نمائندے رہے، بعد میں الجزیرہ امریکا پر پروگرام پیش کیا اور 2016 سے ایم ایس این بی سی (اب ایم ایس ناو) سے وابستہ ہیں؛ 2024 میں ان کی یادداشتیں «سمال ایکٹس آف کریج» شائع ہوئیں۔"

