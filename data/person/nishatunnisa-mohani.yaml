summary:
  ar: "صحفية ومناضلة استقلال هندية (1884–1937)، زوجة حسرت موهاني. تعلمت في البيت وأتقنت الأردية والعربية والفارسية والإنجليزية، وعملت في حركتي عدم التعاون والخلافة، وافتتحت أول متجر خادي باسم «متجر عليكرة خلافت» ودعمت منه مجلة غاندي «الهند الشابة»، وواصلت إصدار صحيفة زوجها «أردو معلى» في غيابه، وانتقدت غاندي لعدم تبنّيه قرار الاستقلال التام الذي اقترحه زوجها."
  en: "Indian journalist and independence activist (1884–1937), wife of Hasrat Mohani. Educated at home, she was proficient in Urdu, Arabic, Persian and English, worked in the non-cooperation and Khilafat movements, opened the first khadi shop, the Aligarh Khilafat Store, whose income supported Gandhi's Young India, kept her husband's newspaper Urdu-e-Mualla publishing, and criticised Gandhi for not backing her husband's complete-independence resolution."
  ur: "ہندوستانی صحافی اور مجاہد آزادی (1884ء–1937ء)، حسرت موہانی کی اہلیہ۔ گھر پر تعلیم پائیں اور اردو، عربی، فارسی اور انگریزی میں مہارت رکھتی تھیں؛ عدم تعاون اور خلافت تحریکوں میں کام کیا، کھادی کی پہلی دکان ’علی گڑھ خلافت اسٹور‘ کھولی جس کی آمدنی سے گاندھی کے رسالے ’ینگ انڈیا‘ کی مدد کی، اپنے شوہر کے اخبار ’اردوئے معلى‘ کی اشاعت جاری رکھی، اور گاندھی کو اپنے شوہر کی مکمل آزادی کی قرارداد کی حمایت نہ کرنے پر تنقید کا نشانہ بنایا۔"
