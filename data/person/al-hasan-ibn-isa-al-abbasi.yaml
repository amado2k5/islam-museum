class: person
label: { ar: "الحسن بن عيسى بن المقتدر بالله العباسي", en: "al-Hasan ibn Isa al-Abbasi", es: "al-Hasan ibn Isa al-Abbasi", fr: "al-Hasan ibn Isa al-Abbasi", ur: "الحسن بن عیسیٰ عباسی" }
summary:
  ar: "الحسن بن عيسى بن المقتدر بالله بن جعفر المعتضد، الأمير أبو محمد العباسي؛ روى عن مؤدبه أحمد اليشكري وكان رئيساً ديّناً حافظاً لأخبار الخلفاء؛ توفي في شعبان سنة أربعين وأربعمائة وله نيف وتسعون سنة {cite:shadharat-dhahab p. 264}."
  en: "Al-Hasan b. Isa b. al-Muqtadir — the Abbasid prince Abu Muhammad, a dignified pious man who kept the lore of the caliphs; died in Sha'ban 440 past ninety years of age {cite:shadharat-dhahab p. 264}."
  es: "Al-Hasan b. Isa b. al-Muqtadir — el príncipe abasí Abu Muhammad, un hombre digno y piadoso que conservó la tradición de los califas; murió en Sha'ban 440, con más de noventa años de edad {cite:shadharat-dhahab p. 264}."
  fr: "Al-Hasan b. Isa b. al-Muqtadir — le prince abbasside Abu Muhammad, un homme pieux et digne qui a conservé la tradition des califes; est mort en Sha'ban 440 à plus de quatre-vingt-dix ans {cite:shadharat-dhahab p. 264}."
  ur: "الحسن بی۔ ایک ب. المقتدیر - عباسی شہزادہ ابو محمد، ایک باوقار متقی آدمی جس نے خلفاء کے علم کو برقرار رکھا؛ شعبان 440 میں نوے سال کی عمر میں وفات پائی۔ 264}۔"
  tr: "El-Hasan ibn İsa ibn el-Muqtadir Billah ibn Ca'far al-Mu'tadid, prens Ebu Muhammed el-Abbasi; akıl hocası Ahmed el-Yaşkuri'den rivayet etmiş, dini bir lider ve halifelerin raporlarını ezberleyen; Şaban'da doksan üzerinde doksan yaşından büyük bir yaşta ölmüştür {atıf:Şadharat-Dhahab, s. 264}."
  id: "Al-Hasan ibn Isa ibn al-Muqtadir Billah ibn Ja'far al-Mu'tadid, pangeran Abu Muhammad al-Abbasi; diceritakan dari gurunya Ahmad al-Yashkuri dan merupakan pemimpin agama serta pengapal laporan para khalifah; ia meninggal di Sha'ban pada tahun empat ratus empat puluh pada usia lebih dari sembilan puluh {cite:shadharat-dhahab, hlm. 264}."
