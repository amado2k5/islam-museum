summary:
  ar: "شمس الدين أحمد بن سليمان الشهير بابن كمال باشا، العلامة الأوحد المحقق الفهامة؛ كان جده من أمراء الدولة العثمانية واشتغل هو بالعلم وهو شاب ثم أُلحق بالعسكر، وحكى عن نفسه أنه كان مع السلطان بايزيد في سفر فرأى المولى لطفي رثّ الهيئة يتصدر على أمير عظيم فقيل له: العلماء معظمون لعلمهم فتعلق قلبه بالعلم. ثم ترقى في المناصب حتى صار مفتياً بالقسطنطينية بعد وفاة المولى علي الجمالي وبقي على منصب الإفتاء إلى وفاته. كان يشتغل ليلاً ونهاراً ولا يفتر قلمه، وعدد رسائله قريب من مائة رسالة في المباحث المهمة الغامضة؛ وله تفسير لطيف قريب من التمام اختطفته المنية، وحواشٍ على الكشاف، وشرح بعض الهداية، ومتن في الفقه، وكتاب تجريد التجريد في علم الكلام وشرحه، وحواشٍ على شرح المفتاح والتلويح وعلى تهافت خواجه زاده. توفي سنة أربعين وتسعمائة {cite:shadharat-dhahab p. 589-590}."
  en: "Ibn Kamal Pasha — 'the unique, verifying polymath'; his grandfather an Ottoman amir, he began in the army until the sight of the shabby Molla Lutfi outranking a great amir ('the learned are honoured for their learning') turned him to scholarship; mufti of Constantinople after 'Ali al-Jamali until his death. Near a hundred rasail on knotty questions, a nearly finished tafsir, glosses on the Kashshaf, Hidaya, Miftah, Talwih and Khwaja-zada's Tahafut; d. 940 {cite:shadharat-dhahab p. 589-590}."
died: { edtf: "1533/1534", hijri: "0940", calendar: julian, precision: year, status: tradition, derived: true, note: "940؛ التحويل مشتق {cite:shadharat-dhahab p. 590}", sources: [source/shadharat-dhahab] }
