summary:
  ar: "شمس الدين أحمد بن سليمان الشهير بابن كمال باشا، العلامة الأوحد المحقق الفهامة؛ كان جده من أمراء الدولة العثمانية واشتغل هو بالعلم وهو شاب ثم أُلحق بالعسكر، وحكى عن نفسه أنه كان مع السلطان بايزيد في سفر فرأى المولى لطفي رثّ الهيئة يتصدر على أمير عظيم فقيل له: العلماء معظمون لعلمهم فتعلق قلبه بالعلم. ثم ترقى في المناصب حتى صار مفتياً بالقسطنطينية بعد وفاة المولى علي الجمالي وبقي على منصب الإفتاء إلى وفاته. كان يشتغل ليلاً ونهاراً ولا يفتر قلمه، وعدد رسائله قريب من مائة رسالة في المباحث المهمة الغامضة؛ وله تفسير لطيف قريب من التمام اختطفته المنية، وحواشٍ على الكشاف، وشرح بعض الهداية، ومتن في الفقه، وكتاب تجريد التجريد في علم الكلام وشرحه، وحواشٍ على شرح المفتاح والتلويح وعلى تهافت خواجه زاده. توفي سنة أربعين وتسعمائة {cite:shadharat-dhahab p. 589-590}."
  en: "Ibn Kamal Pasha — 'the unique, verifying polymath'; his grandfather an Ottoman amir, he began in the army until the sight of the shabby Molla Lutfi outranking a great amir ('the learned are honoured for their learning') turned him to scholarship; mufti of Constantinople after 'Ali al-Jamali until his death. Near a hundred rasail on knotty questions, a nearly finished tafsir, glosses on the Kashshaf, Hidaya, Miftah, Talwih and Khwaja-zada's Tahafut; d. 940 {cite:shadharat-dhahab p. 589-590}."
  es: "Ibn Kamal Pasha — «el polímata único y veraz»; su abuelo fue un emir otomano. Comenzó en el ejército hasta que la visión del humilde Molla Lutfi, que superaba en rango a un gran emir («los sabios son honrados por su saber»), lo impulsó a dedicarse a la erudición; fue muftí de Constantinopla después de Ali al-Jamali hasta su muerte. Escribió cerca de cien rasail sobre cuestiones complejas, un tafsir casi terminado, glosas sobre el Kashshaf, Hidaya, Miftah, Talwih y el Tahafut de Khwaja-zada; falleció en 940 {cita: shadharat-dhahab págs. 589-590}."
  fr: "Ibn Kamal Pacha, « l'érudit aux multiples talents », fils d'un émir ottoman, commença sa carrière dans l'armée. La vue du modeste Molla Lutfi surpassant un grand émir (« les savants sont honorés pour leur savoir ») le tourmenta et l'orienta vers les études. Il fut mufti de Constantinople après Ali al-Jamali, et ce jusqu'à sa mort. Il publia près d'une centaine de rasail sur des questions complexes, un tafsir presque achevé, ainsi que des gloses sur le Kashshaf, le Hidaya, le Miftah, le Talwih et le Tahafut de Khwaja-zada. Il mourut en 940 (cf. shadharat-dhahab, p. 589-590)."
  ur: "ابن کمال پاشا - 'منفرد، تصدیق کرنے والا پولی میتھ'؛ اس کے دادا ایک عثمانی امیر تھے، اس نے فوج میں اس وقت تک کام شروع کیا جب تک کہ ایک بڑے امیر کو پیچھے چھوڑتے ہوئے مولا لطفی کی نظر نے اسے اسکالرشپ کی طرف متوجہ کیا۔ قسطنطنیہ کے مفتی علی الجمالی کے بعد وفات تک۔ گہرے سوالات پر ایک سو کے قریب رسائل، تقریباً ختم ہونے والی تفسیر، کشف، ہدایہ، مفتاح، تلویح اور خواجہ زادہ کی طہافات پر چمکی۔ d 940 {حوالہ: شدارت ذہاب صفحہ 589-590}۔"
  tr: "Şemseddin Ahmed bin Süleyman, İbn Kamal Paşa olarak bilinir, tek alim ve seçkin alim, Osmanlı İmparatorluğu'nun prenslerinden biriydi. Gençliğinde bilgi peşinde koştu ve ardından orduya katıldı. Sultan Bayezid ile seyahat ederken, zor durumda olan Moulay Lutfi'yi büyük bir prensi yönetirken gördüğünü anlattı. Kendisine şöyle denildi: Alimler bilgileri nedeniyle onurlandırılır ve kalbi bilgiye bağlıydı. Daha sonra görevlerde yükselerek Moulay Ali el-Cemali'nin ölümünden sonra İstanbul'da müftü oldu ve ölümüne kadar fetva görevinde kaldı. Gece gündüz çalıştı, kalemini hiç bırakmadı. Mektubu, önemli ve belirsiz konularda neredeyse yüz tane yazdı; ölümüyle kaçırılmış tamamlanmaya yakın ince bir tefsir, Kaşşaf üzerine notlar, bazı rehberliklere yorumlar, fıkıh metni, Tajrid al-Tajrid fi 'Ilm al-Kalam kitabı ve açıklaması ile Khwaja Zadeh'in anahtar ve ipucunun açıklaması üzerine notlar yazdı. 940 yılında öldü {atıf:shadharat-dhahab s. 589-590}."
  id: "Shams al-Din Ahmad ibn Suleiman, yang dikenal sebagai Ibn Kamal Pasha, satu-satunya ulama dan cendekiawan terkemuka, adalah salah satu pangeran Kekaisaran Ottoman. Ia mengejar ilmu pengetahuan sejak muda lalu bergabung dengan tentara. Ia menceritakan bahwa ia sedang bepergian bersama Sultan Bayezid ketika melihat Moulay Lutfi, yang berada dalam posisi sulit, memimpin seorang pangeran besar. Ia diberitahu: Para ulama dihormati karena pengetahuan mereka, dan hatinya sangat bergantung pada pengetahuan. Ia kemudian naik jabatan hingga menjadi mufti di Konstantinopel setelah kematian Moulay Ali al-Jamali, dan tetap menjabat fatwa hingga kematiannya. Ia bekerja siang dan malam, tanpa pernah berhenti menulis tulisannya. Surat-suratnya hampir seratus tentang topik penting dan samar; ia menulis tafsiran halus yang hampir selesai namun akhirnya dirampas oleh kematian, catatan tentang Kashshaf, komentar atas beberapa petunjuk, teks tentang fiqh, buku Tajrid al-Tajrid fi 'Ilm al-Kalam dan penjelasannya, serta catatan tentang penjelasan kunci dan petunjuk Khwaja Zadeh. Ia meninggal pada tahun 940 {cite:shadharat-dhahab hlm. 589-590}."
