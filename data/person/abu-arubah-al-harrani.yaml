label:
  ar: "أبو عروبة الحراني"
  en: "Abu Aruba al-Harrani"
  ur: "ابو عروبہ الحرانی"
  fr: "Abu Aruba al-Harrani"
  es: "Abu Aruba al-Harrani"
summary:
  ar: "الحسين بن أبي معشر محمد بن مودود السلمي الحراني، المعروف بأبي عروبة، محدّث من حرّان، وُلد نحو سنة 222هـ/837م، ومن مؤلفاته الطبقات وتاريخ حرّان وكتاب الأوائل. {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  en: "Abu Aruba al-Harrani, al-Husayn b. Abi Ma'shar Muhammad b. Mawdud al-Sulami, a hadith scholar of Harran, born about 222/837. His known works include the Tabaqat, a history of Harran and a Kitab al-Awa'il. {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  ur: "ابو عروبہ الحرانی، الحسین بن ابی معشر محمد بن مودود السلمی، حران کے محدث، جو تقریباً 222ھ/837ء میں پیدا ہوئے۔ ان کی معروف کتابوں میں الطبقات، تاریخ حران اور کتاب الاوائل شامل ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  fr: "Abu Aruba al-Harrani, al-Husayn b. Abi Ma'shar Muhammad b. Mawdud al-Sulami, traditionniste de Harran, né vers 222/837. Ses œuvres connues comprennent les Tabaqat, une histoire de Harran et un Kitab al-Awa'il. {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  es: "Abu Aruba al-Harrani, al-Husayn b. Abi Ma'shar Muhammad b. Mawdud al-Sulami, un erudito en hadices de Harran, nacido alrededor de 222/837. Sus obras conocidas incluyen el Tabaqat, una historia de Harran y un Kitab al-Awa'il. {citar:enciclopedia-del-islam-2 vol. 1 pág. 125}"
  tr: "El-Hüseyin ibn Ebu Ma'şer Muhammed ibn Mevdud el-Süleymi el-Harrani, Ebu Aruba olarak da bilinen, Harranlı bir hadis âlimiydi. Hicri 222/Miladi 837 civarında doğdu. Eserleri arasında *el-Tabakat* (Sınıflar), *Harran Tarihi* ve *Kitab el-Evvel* (İlkler Kitabı) bulunmaktadır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  id: "Al-Husayn ibn Abi Ma'shar Muhammad ibn Mawdud al-Sulami al-Harrani, yang dikenal sebagai Abu 'Aruba, adalah seorang ulama hadits dari Harran. Beliau lahir sekitar tahun 222 H/837 M. Di antara karya-karyanya adalah *al-Tabaqat* (Kelas-Kelas), *Tarikh Harran* (Sejarah Harran), dan *Kitab al-Awa'il* (Kitab tentang Peristiwa-Peristiwa Pertama). {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
