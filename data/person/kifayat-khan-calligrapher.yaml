summary:
  ar: "خطاط مغولي جعل الشكسته شائعًا في الهند، اسمه محمد جعفر خان بن محمد مقيم خان، خدم خمسًا وثلاثين سنة في ديوان الرواتب ثم صار محاسبًا في عهد أورنگزيب، وابتكر «روش كفايت خان» {cite:salim-tarikh-khatt-o-khattatin-2001 p. 152}."
  en: "Mughal calligrapher who made shikasta popular in India; his name was Muhammad Ja'far Khan ibn Muhammad Muqim Khan, he served thirty-five years in the salary office and became an accountant under Aurangzeb, and devised the 'Kifayat Khan manner' {cite:salim-tarikh-khatt-o-khattatin-2001 p. 152}."
  ur: "مغل خطاط جنہوں نے ہندوستان میں شکستہ کو مقبولِ عام بنایا؛ اصل نام محمد جعفر خان بن محمد مقیم خان، پینتیس سال تنخواہ کے شعبے میں ملازم رہے اور عہدِ عالمگیری میں محاسب مقرر ہوئے، اور «روشِ کفایت خان» ایجاد کی {cite:salim-tarikh-khatt-o-khattatin-2001 p. 152}۔"
