summary:
  ar: "سياسي إندونيسي وجنرال متقاعد، وُلد في باسيتان بجاوة الشرقية سنة 1949. خدم في الجيش نحو ثلاثة عقود، وتولّى مناصب وزارية تنسيقية في عهدي الرئيسين عبد الرحمن وحيد وميغاواتي سوكارنوبوتري، وأسّس الحزب الديمقراطي، وفاز بأول انتخاب رئاسي مباشر في إندونيسيا سنة 2004، فكان رئيس البلاد السادس لولايتين حتى 2014."
  en: "Indonesian politician and retired general, born in Pacitan, East Java, in 1949. He served in the army for some three decades, held coordinating-minister posts under Presidents Abdurrahman Wahid and Megawati Sukarnoputri, founded the Democratic Party, and won Indonesia's first direct presidential election in 2004, serving two terms as the country's sixth president until 2014."
  ur: "انڈونیشی سیاست دان اور ریٹائرڈ جنرل، جو 1949ء میں مشرقی جاوا کے پاچیتان میں پیدا ہوئے۔ تقریباً تین دہائیوں فوج میں خدمت کی، صدر عبد الرحمن وحید اور میگاوتی سوکارنوپوتری کے ادوار میں رابطہ وزیر رہے، ڈیموکریٹک پارٹی قائم کی، اور 2004ء میں انڈونیشیا کا پہلا براہِ راست صدارتی انتخاب جیت کر 2014ء تک دو مدتوں کے لیے ملک کے چھٹے صدر رہے۔"
