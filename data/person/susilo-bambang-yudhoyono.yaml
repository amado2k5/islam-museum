summary:
  ar: "سياسي إندونيسي وجنرال متقاعد، وُلد في باسيتان بجاوة الشرقية سنة 1949. خدم في الجيش نحو ثلاثة عقود، وتولّى مناصب وزارية تنسيقية في عهدي الرئيسين عبد الرحمن وحيد وميغاواتي سوكارنوبوتري، وأسّس الحزب الديمقراطي، وفاز بأول انتخاب رئاسي مباشر في إندونيسيا سنة 2004، فكان رئيس البلاد السادس لولايتين حتى 2014."
  en: "Indonesian politician and retired general, born in Pacitan, East Java, in 1949. He served in the army for some three decades, held coordinating-minister posts under Presidents Abdurrahman Wahid and Megawati Sukarnoputri, founded the Democratic Party, and won Indonesia's first direct presidential election in 2004, serving two terms as the country's sixth president until 2014."
  ur: "انڈونیشی سیاست دان اور ریٹائرڈ جنرل، جو 1949ء میں مشرقی جاوا کے پاچیتان میں پیدا ہوئے۔ تقریباً تین دہائیوں فوج میں خدمت کی، صدر عبد الرحمن وحید اور میگاوتی سوکارنوپوتری کے ادوار میں رابطہ وزیر رہے، ڈیموکریٹک پارٹی قائم کی، اور 2004ء میں انڈونیشیا کا پہلا براہِ راست صدارتی انتخاب جیت کر 2014ء تک دو مدتوں کے لیے ملک کے چھٹے صدر رہے۔"
  es: "Político indonesio y general retirado, nacido en Pacitan, Java Oriental, en 1949. Sirvió en el ejército durante unas tres décadas, ocupó cargos de ministro coordinador bajo los presidentes Abdurrahman Wahid y Megawati Sukarnoputri, fundó el Partido Demócrata y ganó las primeras elecciones presidenciales directas de Indonesia en 2004, desempeñando dos mandatos como sexto presidente del país hasta 2014."
  fr: "Homme politique indonésien et général à la retraite, né à Pacitan, dans l'est de Java, en 1949. Il a servi dans l'armée pendant une trentaine d'années, a occupé des postes de ministre coordinateur sous les présidents Abdurrahman Wahid et Megawati Sukarnoputri, a fondé le Parti démocrate et a remporté la première élection présidentielle directe d'Indonésie en 2004, effectuant deux mandats en tant que sixième président du pays jusqu'en 2014."
  tr: "Endonezyalı bir politikacı ve emekli general olan Skarnoputri, 1949'da Doğu Java'nın Basitan kentinde doğdu. Yaklaşık otuz yıl boyunca orduda görev yaptı, Cumhurbaşkanları Abdurrahman Wahid ve Megawati Sukarnoputri'nin cumhurbaşkanlığı döneminde koordinasyon bakanlığı görevlerinde bulundu, Demokrat Parti'yi kurdu ve 2004'te Endonezya'nın ilk doğrudan cumhurbaşkanlığı seçimini kazanarak 2014'e kadar iki dönem ülkenin altıncı cumhurbaşkanı olarak görev yaptı."
  id: "Seorang politikus Indonesia dan jenderal pensiunan, ia lahir di Basitan, Jawa Timur pada tahun 1949. Ia bertugas di militer selama sekitar tiga dekade, memegang posisi menteri koordinasi selama masa kepresidenan Presiden Abdurrahman Wahid dan Megawati Sukarnoputri, mendirikan Partai Demokrat, dan memenangkan pemilihan presiden langsung pertama Indonesia pada tahun 2004, menjabat sebagai presiden keenam negara itu selama dua periode hingga 2014."
