summary:
  ar: "داعية وعالم حديث إندونيسي وُلد في آساهان بشمال سومطرة سنة 1977، تعلّم في الأزهر ودار الحديث الحسنية بالرباط ونال الدكتوراه من جامعة أم درمان الإسلامية، ودرّس علم الحديث في جامعة سلطان شريف قاسم الإسلامية برياو (2009–2019)، واشتهر بخطابه الدعوي المرح عبر يوتيوب حتى صار من أكثر دعاة إندونيسيا متابعة، وألّف كتباً في الأسئلة الفقهية الشائعة وترجم كتباً عربية."
  en: "Indonesian preacher and hadith scholar born in Asahan, North Sumatra, in 1977. He studied at Al-Azhar and at Dar al-Hadith al-Hasaniyyah in Rabat, took his doctorate at Omdurman Islamic University, taught hadith studies at UIN Sultan Syarif Kasim in Riau (2009–2019), and rose to fame through humorous sermons on YouTube, becoming one of Indonesia's most-followed preachers. He has written popular question-and-answer books and translated Arabic works."
  fr: "Prédicateur et savant du hadith indonésien né à Asahan, au Sumatra du Nord, en 1977. Il étudia à al-Azhar et à Dar al-Hadith al-Hasaniyyah à Rabat, obtint son doctorat à l'université islamique d'Omdurman, enseigna les études du hadith à l'UIN Sultan Syarif Kasim de Riau (2009–2019), et devint célèbre grâce à des sermons pleins d'humour sur YouTube, devenant l'un des prédicateurs les plus suivis d'Indonésie. Il a écrit des livres populaires de questions-réponses et traduit des ouvrages arabes."
  ur: "انڈونیشی مبلغ و عالمِ حدیث، جو 1977ء میں شمالی سماٹرا کے آساہان میں پیدا ہوئے۔ الازہر اور رباط کے دار الحدیث الحسنیہ میں تعلیم پائی، ام درمان اسلامی یونیورسٹی سے ڈاکٹریٹ کیا، ریاو کی سلطان شریف قاسم اسلامی یونیورسٹی میں علومِ حدیث پڑھائے ⁦(2009ء–2019ء)⁩، اور یوٹیوب پر اپنے مزاحیہ اندازِ خطابت سے انڈونیشیا کے سب سے زیادہ سنے جانے والے داعیوں میں شامل ہو گئے۔"
  es: "Predicador y erudito en hadices indonesio, nacido en Asahan, Sumatra Septentrional, en 1977. Estudió en Al-Azhar y en Dar al-Hadith al-Hasaniyyah en Rabat, se doctoró en la Universidad Islámica de Omdurman, impartió clases de estudios de hadices en la UIN Sultan Syarif Kasim en Riau (2009-2019) y alcanzó la fama gracias a sus sermones humorísticos en YouTube, convirtiéndose en uno de los predicadores más populares de Indonesia. Ha escrito libros de preguntas y respuestas de gran difusión y ha traducido obras árabes."
  tr: "1977 yılında Kuzey Sumatra'nın Asahan şehrinde doğan Endonezyalı bir vaiz ve hadis âlimi olan bu kişi, El-Azhar ve Rabat'taki Dar Al-Hadith Al-Hassania'da eğitim gördü ve Omdurman İslam Üniversitesi'nden doktora derecesi aldı. Riau'daki Sultan Syarif Kassim İslam Üniversitesi'nde hadis ilmi dersleri verdi (2009-2019). YouTube üzerinden yaptığı neşeli vaazlarıyla ünlendi ve Endonezya'da en çok takip edilen vaizlerden biri oldu. Yaygın fıkıh soruları üzerine kitaplar yazdı ve Arapça kitapları tercüme etti."
  id: "Seorang pendakwah dan ahli hadits Indonesia, lahir di Asahan, Sumatera Utara pada tahun 1977, ia belajar di Al-Azhar dan Dar Al-Hadith Al-Hassania di Rabat dan memperoleh gelar doktor dari Universitas Islam Omdurman. Ia mengajar ilmu hadits di Universitas Islam Sultan Syarif Kassim di Riau (2009–2019). Ia menjadi terkenal karena ceramah-ceramah dakwahnya yang ceria melalui YouTube hingga menjadi salah satu pendakwah yang paling banyak diikuti di Indonesia. Ia menulis buku-buku tentang masalah-masalah fiqih umum dan menerjemahkan buku-buku berbahasa Arab."
