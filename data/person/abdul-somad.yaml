summary:
  ar: "داعية وعالم حديث إندونيسي وُلد في آساهان بشمال سومطرة سنة 1977، تعلّم في الأزهر ودار الحديث الحسنية بالرباط ونال الدكتوراه من جامعة أم درمان الإسلامية، ودرّس علم الحديث في جامعة سلطان شريف قاسم الإسلامية برياو (2009–2019)، واشتهر بخطابه الدعوي المرح عبر يوتيوب حتى صار من أكثر دعاة إندونيسيا متابعة، وألّف كتباً في الأسئلة الفقهية الشائعة وترجم كتباً عربية."
  en: "Indonesian preacher and hadith scholar born in Asahan, North Sumatra, in 1977. He studied at Al-Azhar and at Dar al-Hadith al-Hasaniyyah in Rabat, took his doctorate at Omdurman Islamic University, taught hadith studies at UIN Sultan Syarif Kasim in Riau (2009–2019), and rose to fame through humorous sermons on YouTube, becoming one of Indonesia's most-followed preachers. He has written popular question-and-answer books and translated Arabic works."
  ur: "انڈونیشی مبلغ و عالمِ حدیث، جو 1977ء میں شمالی سماٹرا کے آساہان میں پیدا ہوئے۔ الازہر اور رباط کے دار الحدیث الحسنیہ میں تعلیم پائی، ام درمان اسلامی یونیورسٹی سے ڈاکٹریٹ کیا، ریاو کی سلطان شریف قاسم اسلامی یونیورسٹی میں علومِ حدیث پڑھائے ⁦(2009ء–2019ء)⁩، اور یوٹیوب پر اپنے مزاحیہ اندازِ خطابت سے انڈونیشیا کے سب سے زیادہ سنے جانے والے داعیوں میں شامل ہو گئے۔"
