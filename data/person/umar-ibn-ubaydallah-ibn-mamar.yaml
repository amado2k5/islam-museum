summary:
  ar: "عمر بن عبيد الله بن معمر التيمي؛ كان مع عبد الرحمن بن سمرة من أشراف سجستان في فتح كابل ووجهه مع المهلب بن أبي صفرة بشارة الفتح."
  en: "Umar ibn Ubaydallah ibn Ma'mar al-Taymi; of the ashraf with Ibn Samura at Kabul's conquest — sent with al-Muhallab ibn Abi Sufra bearing the victory dispatch."
  es: "Umar ibn Ubaydallah ibn Ma'mar al-Taymi; de los ashraf con Ibn Samura en la conquista de Kabul — enviado con al-Muhallab ibn Abi Sufra portando el despacho de la victoria."
  fr: "Umar ibn Ubaydallah ibn Ma'mar al-Taymi; de l'ashraf avec Ibn Samura lors de la conquête de Kaboul — envoyé avec al-Muhallab ibn Abi Sufra portant le message de la victoire."
  ur: "عمر بن عبیداللہ ابن معمر تیمی؛ کابل کی فتح پر ابن سمرہ کے ساتھ اشرف کا - المحلب ابن ابی صفرا کے ساتھ فتح کی روانگی کے ساتھ بھیجا گیا۔"
  tr: "Ömer bin Ubeyd Allah ibn Mu'ammar al-Taymi; Sijistan'ın soylularından Abd al-Rahman ibn Samura ile birlikte Kabil'in fethinde bulundu ve fetihin müjdesi olarak el-Muhallab bin Ebi Safra ile ittifak kurdu."
  id: "Umar ibn Ubayd Allah ibn Mu'ammar al-Taymi; ia bersama Abd al-Rahman ibn Samura, salah satu bangsawan Sijistan, dalam penaklukan Kabul, dan ia bersekutu dengan al-Muhallab ibn Abi Safra sebagai kabar gembira penaklukan."
