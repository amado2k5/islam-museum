summary:
  ar: "طبيب وكاتب عثماني (1860–1931، والتاريخان محل خلاف)، تذكره المقالتان في عداد مؤسسي جمعية الاتحاد والترقي. نُفي في عهد عبد الحميد الثاني ففرّ إلى باريس ثم استقر في القاهرة، حيث مارس الطب — وبحسب طبعة مذكراته صار طبيبًا للملك فاروق — وكتب مذكرات رحلاته في الأناضول وسوريا وأوروبا."
  en: "Ottoman physician and writer (1860–1931, both dates debated) whom the articles name among the founders of the Committee of Union and Progress. Exiled under Abdülhamid II, he fled to Paris and then settled in Cairo, where he practised medicine — by the memoir edition's account as a physician to King Farouk — and wrote travel memoirs of Anatolia, Syria and Europe."
  ur: "عثمانی طبیب اور مصنف (1860–1931، دونوں تواریخ متنازع) جنھیں مضامین جمعیت اتحاد و ترقی کے بانیوں میں شمار کرتے ہیں۔ عبد الحمید ثانی کے دور میں جلاوطن ہوئے، پیرس بھاگے اور پھر قاہرہ میں سکونت اختیار کی، جہاں طب کی مشق کی — یادداشتوں کی طباعت کے مطابق وہ شاہ فاروق کے طبیب رہے — اور اناطولیہ، شام اور یورپ کے سفرنامے لکھے۔"
