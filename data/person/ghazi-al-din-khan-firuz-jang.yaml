  ur: "غازی الدین خان فیروز جنگ اول، جو اٹھارویں صدی کے مغل رئیس اور حیدرآباد کے بانی نظام الملک کے والد تھے، کے لیے ڈرافٹ کارڈ۔ 1710; صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "18. yüzyıl Moğol prensi ve Haydarabad'ın kurucusu Nizam al-Mulk'un babası Ghaziuddin Khan Firuz Jung I'in ön kartı 1710 yılında öldü; tarih kitaplarında hatırlanıyor, ancak biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan Ghaziuddin Khan Firuz Jung I, seorang pangeran Mongol abad ke-18 dan ayah Nizam al-Mulk, pendiri Hyderabad, meninggal pada tahun 1710 M; ia dikenang dalam buku sejarah, tetapi biografinya belum pernah diulas di halaman."
