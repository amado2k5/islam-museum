label: { ar: "ابن جبير محمد بن أحمد الكناني", en: "Ibn Jubayr, Muhammad ibn Ahmad al-Kinani", es: "Ibn Jubayr, Muhammad ibn Ahmad al-Kinani", fr: "Ibn Jubayr, Muhammad ibn Ahmad al-Kinani", ur: "ابن جبیر، محمد بن احمد الکنانی" }
gender: male
roles: [traveler, writer]
summary:
  ar: "رحالة أندلسي من بلنسية وغرناطة، حج سنة 579هـ وكتب رحلته المعروفة بوصف الطريق والمدن. وعاد إلى الأندلس بعد رحلته الأولى التي حل فيها دمشق والموصل وبغداد وركب من عكا مع الإفرنج فعطب في خليج صقلية الضيق وقاسى شدائد حتى وصل الأندلس سنة 581هـ، ثم أعاد المسير إلى المشرق إلى أن توفي بالإسكندرية يوم الأربعاء السابع والعشرين من شعبان سنة 614هـ والدعاء عند قبره مستجاب قاله ابن الرقيق، وحدث بكتاب الشفاء عن محمد بن عيسى التميمي عن القاضي عياض، وولي بعد ذلك قضاء سبتة {cite:nafh-tib-maqqari p. 491}."
  en: "An Andalusian traveller from Valencia and Granada who made the Hajj and wrote the travelogue known by his name."
  es: "Un viajero andaluz de Valencia y Granada que realizó la peregrinación a La Meca (Hajj) y escribió el libro de viajes que lleva su nombre."
  fr: "Un voyageur andalou originaire de Valence et de Grenade qui a effectué le Hajj et a écrit le récit de voyage qui porte son nom."
  ur: "والنسیا اور غرناطہ کا ایک اندلس کا مسافر جس نے حج کیا اور اپنے نام سے مشہور سفرنامہ لکھا۔"
  tr: "Valensiya ve Granada'dan gelen bir Endülüslü gezgin olan Endülüs, 579 Hicri'de Hac yaptı ve ünlü yolculuğunu rota ve şehirleri anlattı. İlk yolculuğundan sonra Endülüs'e döndü; bu sefer Şam, Musul ve Bağdat'ı da kapsıyordu; Franklarla birlikte Akka'dan yola çıktı; burada dar Sicilya Körfezi'nde mahsur kaldı ve zorluklara katlandı; ta ki 581 Hicri'de Endülüs'e ulaşana kadar. Daha sonra doğuya doğru yolculuğuna devam etti ve 614 H yılının Şaban ayının yirmi yedinci Çarşamba günü İskenderiye'de öldü. Mezarındaki duaların kabul olduğunu İbn el-Rakiq söyledi. Muhammed bin İsa el-Tamimi'den Şifa kitabını Kadi İyad'dan anlattı ve ardından Ceuta'nın yargıcı olarak atandı {atıf:nafh-tib-maqqari, s. 491}."
  id: "Seorang pengembara Andalusia dari Valencia dan Granada, ia melaksanakan Haji pada tahun 579 H dan menulis perjalanan terkenalnya yang menggambarkan rute dan kota-kota. Ia kembali ke al-Andalus setelah perjalanan pertamanya, yang mencakup Damaskus, Mosul, dan Baghdad, dan ia berlayar dari Acre bersama orang Franka, di mana ia terdampar di Teluk Sisilia yang sempit dan mengalami kesulitan hingga tiba di al-Andalus pada tahun 581 H. Ia kemudian melanjutkan perjalanannya ke timur hingga meninggal di Alexandria pada hari Rabu, tanggal dua puluh tujuh Sha'ban, 614 H. Doa di makamnya dijawab, kata Ibn al-Raqiq. Ia menceritakan kitab al-Shifa dari Muhammad ibn Isa al-Tamimi dari Qadi Iyad, dan kemudian diangkat menjadi hakim Ceuta {cite:nafh-tib-maqqari, hlm. 491}."
