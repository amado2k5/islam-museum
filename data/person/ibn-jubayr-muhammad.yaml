label: { ar: "ابن جبير محمد بن أحمد الكناني", en: "Ibn Jubayr, Muhammad ibn Ahmad al-Kinani" }
gender: male
roles: [traveler, writer]
summary:
  ar: "رحالة أندلسي من بلنسية وغرناطة، حج سنة 579هـ وكتب رحلته المعروفة بوصف الطريق والمدن. وعاد إلى الأندلس بعد رحلته الأولى التي حل فيها دمشق والموصل وبغداد وركب من عكا مع الإفرنج فعطب في خليج صقلية الضيق وقاسى شدائد حتى وصل الأندلس سنة 581هـ، ثم أعاد المسير إلى المشرق إلى أن توفي بالإسكندرية يوم الأربعاء السابع والعشرين من شعبان سنة 614هـ والدعاء عند قبره مستجاب قاله ابن الرقيق، وحدث بكتاب الشفاء عن محمد بن عيسى التميمي عن القاضي عياض، وولي بعد ذلك قضاء سبتة {cite:nafh-tib-maqqari p. 491}."
  en: "An Andalusian traveller from Valencia and Granada who made the Hajj and wrote the travelogue known by his name."
