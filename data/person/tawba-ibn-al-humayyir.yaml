class: person
label: { ar: "توبة بن الحمير", en: "Tawba ibn al-Humayyir", es: "Tawba ibn al-Humayyir", fr: "Tawba ibn al-Humayyir", ur: "توبہ ابن الحمیر" }
summary:
  ar: "حبيب ليلى الأخيلية، في قبره قال لها الحجاج ما وفيت له ولو كان هو بمكانك ما عدل عنك، وفيه قالت ليلى سمعته يقول ولو أن ليلى الأخيلية سلمت علي وفوقي جندل وصفائح لسلمت تسليم البشاشة، وروى حماد الراوية أنها نزلت إلى قبره فانفرج عن طائر كالحمامة البيضاء فضربت صدرها فوقعت ميتة ودفنت إلى جانبه {cite:muruj-al-dhahab p. 131-132}."
  en: "Layla al-Akhiliyya's beloved — the poet whose grave she was sworn to greet; in Hammad al-Rawiya's telling a white dove sprang from the grave and she fell dead beside him {cite:muruj-al-dhahab p. 131-132}."
  es: "El amado de Layla al-Akhiliyya, el poeta cuya tumba juró saludar; según cuenta Hammad al-Rawiya, una paloma blanca salió de la tumba y ella cayó muerta a su lado {cite:muruj-al-dhahab p. 131-132}."
  fr: "L'aimé de Layla al-Akhiliyya — le poète dont elle avait juré de saluer la tombe; selon le récit de Hammad al-Rawiya, une colombe blanche jaillit de la tombe et elle tomba morte à côté de lui {cite:muruj-al-dhahab p. 131-132}."
  ur: "لیلۃ الاخیلیہ کی محبوبہ — وہ شاعر جس کی قبر کو سلام کرنے کی قسم کھائی گئی تھی۔ حماد الرویہ کے بیان میں ایک سفید فاختہ قبر سے نکلی اور وہ اس کے پاس مر گئی 131-132}۔"
  tr: "Leyla el-Ahahah'ın sevgilisi mezarında ona şöyle dedi: El-Haccac ona, 'Senin yerinde olsaydı, senden yüz çevirmezdi.' dedi. Leyla, 'Leyla'nın bana üzerimde sandalet ve çarşafla selam verseydi, sevinçle karşılanacağını söylediğini duydum.' Anlatıcı Hammad, onun mezarına indiğini ve beyaz bir güvercin gibi bir kuş tarafından serbest bırakıldığını, göğsüne çarpıp öldüğünü ve yanına gömüldüğünü anlattı {cite:muruj-al-dhahab, s. 131-132}."
  id: "Kekasih Layla al-Akhahab, di makamnya, berkata kepadanya: Al-Hajjaj berkata kepadanya, 'Jika dia berada di posisimu, dia tidak akan berpaling darimu.' Dalam surat itu, Layla berkata, 'Aku mendengar dia berkata bahwa jika Layla al-Akhiliya menyambutku dengan sandal dan seprai di atasku, dia akan menyambutku dengan sukacita.' Hammad, sang narator, menceritakan bahwa dia turun ke makamnya dan dibebaskan oleh seekor burung seperti merpati putih, yang memukul dadanya, jatuh mati, dan dikuburkan di sampingnya {cite:muruj-al-dhahab, hlm. 131-132}."
