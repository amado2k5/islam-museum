summary:
  ar: "عالم عثماني وصحفي وموظف رسمي (1856-1919م)؛ صار بعد ثورة 1908 عضوًا في لجنة الإصلاح المالي، وتولى وزارة المالية أسبوعًا واحدًا. نشر مقالات كثيرة في الدوريات تحت اسمي «مفخري» و«عطا»، وترجم تاريخ الدولة العثمانية لهامر إلى التركية، واعتمد في ترجمته على ترجمة هلّرت الفرنسية، وبدأ ظهورها في إستانبول سنة 1329هـ (1911م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 779}."
  en: "Ottoman scholar, journalist and public official (1856-1919). After the revolution of 1908 he joined the Financial Reform Committee and was for one week Minister of Finance. He published many articles under the names Mefkhari and 'Ata', and began to issue in Istanbul in 1329 AH (1911) his Turkish translation of Hammer's History of the Ottoman Empire, based on J. J. Hellert's French version {cite:encyclopaedia-of-islam-2 vol. 1 p. 779}."
