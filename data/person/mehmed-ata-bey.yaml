summary:
  ar: "عالم عثماني وصحفي وموظف رسمي ⁦(1856-1919م)⁩؛ صار بعد ثورة 1908 عضوًا في لجنة الإصلاح المالي، وتولى وزارة المالية أسبوعًا واحدًا. نشر مقالات كثيرة في الدوريات تحت اسمي «مفخري» و«عطا»، وترجم تاريخ الدولة العثمانية لهامر إلى التركية، واعتمد في ترجمته على ترجمة هلّرت الفرنسية، وبدأ ظهورها في إستانبول سنة 1329هـ ⁦(1911م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 779}."
  en: "Ottoman scholar, journalist and public official (1856-1919). After the revolution of 1908 he joined the Financial Reform Committee and was for one week Minister of Finance. He published many articles under the names Mefkhari and 'Ata', and began to issue in Istanbul in 1329 AH (1911) his Turkish translation of Hammer's History of the Ottoman Empire, based on J. J. Hellert's French version {cite:encyclopaedia-of-islam-2 vol. 1 p. 779}."
  es: "Erudito, periodista y funcionario público otomano (1856-1919). Tras la revolución de 1908, se unió al Comité de Reforma Financiera y fue Ministro de Finanzas durante una semana. Publicó numerosos artículos bajo los seudónimos de Mefkhari y «Ata», y en 1329 AH (1911) comenzó a publicar en Estambul su traducción al turco de la Historia del Imperio Otomano de Hammer, basada en la versión francesa de J.J. Hellert {cite:encyclopaedia-of-islam-2 vol. 1 p. 779}."
  fr: "Érudit, journaliste et fonctionnaire ottoman (1856-1919). Après la révolution de 1908, il intégra le Comité de réforme financière et fut ministre des Finances pendant une semaine. Il publia de nombreux articles sous les pseudonymes de Mefkhari et d'« Ata », et commença à publier à Istanbul en 1329 AH (1911) sa traduction turque de l'Histoire de l'Empire ottoman de Hammer, d'après la version française de J.J. Hellert (encyclopédie de l'islam, vol. 2, p. 779)."
  ur: "عثمانی عالم، صحافی اور سرکاری اہلکار (1856-1919)۔ 1908 کے انقلاب کے بعد وہ فنانشل ریفارم کمیٹی میں شامل ہوئے اور ایک ہفتہ تک وزیر خزانہ رہے۔ انہوں نے مفخاری اور عطا کے ناموں سے بہت سے مضامین شائع کیے، اور 1329 ہجری (1911) میں استنبول سے اس کا ترک ترجمہ ہیمر کی ہسٹری آف دی عثمانی سلطنت، جے جے ہیلرٹ کے فرانسیسی ورژن پر مبنی شائع کرنا شروع کیا۔ 1 ص۔ 779}۔"
  tr: "Osmanlı bilgini, gazeteci ve yetkili (1856-1919); 1908 devriminden sonra Mali Reform Komitesi üyesi oldu ve bir hafta Maliye Bakanı olarak görev yaptı. 'Mafkhri' ve 'Ata' adıyla dergilerde birçok makale yayımladı ve Hamer'in Osmanlı İmparatorluğu tarihini Türkçeye çevirdi; Hellert'in Fransızca çevirisine dayanarak, bu çeviri İstanbul'da 1329 Hicri (1911 M.S.) yayımlanmaya başladı. {atıf:İslam Ansiklopedisi-2 cilt 1, s. 779}."
  id: "Seorang cendekiawan, jurnalis, dan pejabat Ottoman (1856-1919 M); setelah revolusi 1908, ia menjadi anggota Komite Reformasi Keuangan dan menjabat sebagai Menteri Keuangan selama satu minggu. Ia menerbitkan banyak artikel di majalah dengan nama 'Mafkhri' dan 'Ata', serta menerjemahkan sejarah Kekaisaran Ottoman karya Hamer ke dalam bahasa Turki, dengan mengandalkan terjemahan Prancis dari Hellert, yang mulai muncul di Istanbul pada tahun 1329 H (1911 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 779}."
