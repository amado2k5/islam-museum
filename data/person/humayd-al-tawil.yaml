summary:
  ar: "حميد بن تيرويه الطويل، ذكره الشيرازي بعد داود بن أبي هند في فقهاء البصرة {cite:tabaqat-fuqaha-abbas-1981 p. 48}. وتذكر حاشية المحقق أن اسمه عند ابن سعد والقتيبي «طرخان» {cite:tabaqat-fuqaha-abbas-1981 p. 48}. لم يذكر الشيرازي تاريخ وفاته."
  tr: "Hümayd bin Tiruvey el-Tawil, el-Şirazi tarafından Davud ibn Ebi Hind'den sonra Basra hukukçularında anılır {atıf:tabaqat-fuqaha-abbas-1981 s. 48}. Editörün dipnotunda, İbn Sad ve el-Kutuybi arasında adının 'Tarkhan' olduğu belirtilir {atıf:tabaqat-fuqaha-abbas-1981, s. 48}. El-Şirazi ölüm tarihinden bahsetmemiştir."
  id: "Humayd ibn Tiruwayh al-Tawil, disebutkan oleh al-Shirazi setelah Dawud ibn Abi Hind dalam para ahli hukum Basra {cite:tabaqat-fuqaha-abbas-1981 hlm. 48}. Catatan kaki editor menyebutkan bahwa namanya di antara Ibn Sa'd dan al-Qutaybi adalah 'Tarkhan' {cite:tabaqat-fuqaha-abbas-1981, hlm. 48}. Al-Shirazi tidak menyebutkan tanggal kematiannya."
