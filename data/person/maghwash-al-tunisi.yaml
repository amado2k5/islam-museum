summary:
  ar: "شمس الدين محمد التونسي المالكي الملقب بمغوش، الإمام المحقق المدقق العلامة؛ اشتغل على علماء المغرب وسمع الصحيحين والموطأ والترمذي والشفاء، وولي قضاء عسكر تونس ثم قدم من طريق البحر إلى القسطنطينية في دولة السلطان سليمان فعظّمه وأكرم مثواه ورتّب له علوقة حسنة وشاع فضله بين أكابرها وأخذ عنه جماعة من أعيانها حتى قاضيا العسكر إذ ذاك، وأملى بها إمالي على شرح الشاطبية للجعبري؛ ثم استأذن في الرحلة إلى مصر معتذراً بعدم صبره على شتاء الروم فدخل حلب فانتدب للقراءة عليه جماعة منهم ابن الحنبلي، ثم دخل طرابلس ثم دمشق وانتفع به أهلها وشهدوا له بالعلم خصوصاً في التفسير والعربية والمنطق والكلام والعروض والقراءات والمعاني والبيان، وقرأ عليه العلاء بن عماد الدين في أوائل تفسير البيضاوي والقاضي معروف رسالة الوجود للسيد الشريف، وقرأ عليه الشهاب الطيبي في القراءات وأجازه إجازة حافلة. وكان دأبه الاستلقاء على القفا لحالة التدريس، وكان يطالع من حفظه كلما أراد من العلوم ولم يكن عنده كتاب ولا ورقة أصلاً، وكان يحفظ شرح التلخيص مع حواشيه وشرح الطوالع وشرح المواقف وشرح المطالع؛ وقال في الشقائق بالجملة فإنه كان من أعاجيب الدنيا. توفي في العشر الأواخر من شعبان بالقاهرة ودُفن بجوار الإمام الشافعي وكتب على قبره: يا من به في الأرض أنمار كل مغرس — ألا يا مالك القلنسوة — لئن أوحشت تونس بعد فقد أنت بمصر ملك الحسن تونس {cite:shadharat-dhahab p. 686-687}."
  en: "Maghwash — qadi 'askar of Tunis, honoured by Sulayman at Constantinople where even the qadi 'askars studied under him and he dictated sessions on al-Ja'bari's Shatibiyya sharh; departing for Egypt he taught at Aleppo (Ibn al-Hanbali among his pupils) and Damascus (al-Taybi licensed by him in qira'at) — 'from the marvels of the world': he read everything from memory and owned no book nor paper; died late Sha'ban [947] in Cairo, buried beside Imam al-Shafi'i {cite:shadharat-dhahab p. 686-687}."
  es: "Maghwash — cadí askar de Túnez, honrado por Sulayman en Constantinopla, donde incluso los cadíes askars estudiaron con él y dictó sesiones sobre el Shatibiyya sharh de al-Ja'bari; partió hacia Egipto y enseñó en Alepo (Ibn al-Hanbali entre sus alumnos) y Damasco (al-Taybi fue autorizado por él en qira'at) — 'de las maravillas del mundo': leía todo de memoria y no poseía ni libro ni papel; murió a finales de Sha'ban [947] en El Cairo, enterrado junto al Imam al-Shafi'i {cite:shadharat-dhahab p. 686-687}."
  fr: "Maghwash — cadi 'askar de Tunis, honoré par Sulayman à Constantinople où même les cadi 'askars étudiaient sous sa direction et où il dictait des séances sur le Shatibiyya sharh d'al-Ja'bari; partant pour l'Égypte, il enseigna à Alep (Ibn al-Hanbali parmi ses élèves) et à Damas (al-Taybi fut autorisé par lui à pratiquer la qira'at) — « des merveilles du monde »: il lisait tout de mémoire et ne possédait ni livre ni papier; mourut à la fin du mois de Sha'ban [947] au Caire, enterré aux côtés de l'imam al-Shafi'i {cite: shadharat-dhahab p. 686-687}."
  ur: "مگواش - تیونس کا قاضی 'عسکر'، جسے سلیمان نے قسطنطنیہ میں اعزاز سے نوازا تھا، یہاں تک کہ قاضی 'عسکر' نے بھی اس کے ماتحت تعلیم حاصل کی تھی اور اس نے الجباری کی شاطبیہ شارح پر سیشن کا حکم دیا تھا۔ مصر کے لیے روانہ ہوتے ہوئے اس نے حلب ⁦(اپنے شاگردوں میں ابن الحنبلی)⁩ اور دمشق ⁦(الطیبی جسے اس نے قیراط میں لائسنس دیا ہے)⁩ میں پڑھایا - 'دنیا کے عجائبات سے': اس نے ہر چیز کو یادداشت سے پڑھا اور اس کے پاس نہ کتاب تھی نہ کاغذ۔ مرحوم شعبان [947] قاہرہ میں وفات پائی، امام شافعی کے پاس مدفون ہیں 686-687}۔"
  tr: "Şemseddin Muhammed el-Tunisi el-Maliki, lakaplı adı Maghush, seçkin ve doğrulanabilir imam, Magrip âlimlerinin yanında eğitim aldı, iki Sahih al-Muwatta, al-Tirmidhi ve al-Şifa'yı dinledi. Tunus'ta askeri yargıç olarak görev yaptı, ardından Sultan Süleyman döneminde deniz yoluyla Konstantinopolis'e gitti, onu onurlandırdı ve iyi bir ilişki kurdu. Onun erdemi devlet adamları arasında yayıldı ve birçok seçkin kişi ondan aldı, ta ki o dönemde askeri yargıç olana kadar. El-Şeybiye üzerine al-Ca'bari'nin tefsiri üzerine Al-Amali'nin diktesini dikte etti; ardından Mısır'a yolculuk sırasında Roma kışına karşı sabırsızlığı için özür diledi Halep'e girdi ve İbn el-Hanbali'nin de dahil olduğu bir grupla çalışmak üzere görevlendirildi. Daha sonra Trablus'a ve ardından Şam'a girdi; burada halkı özellikle tefsir, Arapça, mantık, teoloji, prosodi, okumalar, anlamlar ve hitabet konularında bilgisine tanıklık etti. Ayrıca onunla Al-Alaa ibn Imad al-Din ile Al-Baydavi'nin erken Tafsir'inde ve Seyyid al-Sharif'in Kadi Ma'ruf Risalat al-Wujud'unu da inceledi. Al-Shihab al-Taybi de onunla birlikte okumalarda çalıştı ve ona kapsamlı bir ijaze verdi. Öğretirken sırt üstü yaslanır, ezberlemesinden istediği bilgileri gözden geçirirdi, elinde hiç kitap ya da kağıt yoktu. El-Talkhis üzerine yapılan yorumu kenar notlarıyla, sonuçlara ilişkin yorumları, durumların açıklamasını ve okumaların açıklamasını ezberlerdi; genel olarak Şakaiq'te derdi çünkü o dünyanın harikalarından biriydi. Şaban'ın son on gününde Kahire'de öldü ve İmam Şafii'nin yanına defnedildi. Mezarında şöyle yazıyordu: Ey yeryüzündeki her bitkinin kıymıklarına sahip olan siz—ey şapka sahibi—eğer Tunus'ta yalnız bırakılırsanız, Mısır'dasınız, Hasan Tunus'un kralısınız {atıf:shadharat-dhahab, s. 686-687}."
  id: "Shams al-Din Muhammad al-Tunisi al-Maliki, yang dijuluki Maghush, imam terkemuka dan dapat diverifikasi, belajar di bawah para ulama Maghreb, mendengar dua Sahih al-Muwatta, al-Tirmidhi, dan al-Shifa. Ia menjabat sebagai hakim militer di Tunis, lalu melakukan perjalanan laut ke Konstantinopel selama masa pemerintahan Sultan Suleiman, menghormatinya, dan mengatur hubungan baik untuknya. Kebajikan beliau menyebar di antara para pejabat tersebut, dan banyak tokoh penting mengambil darinya hingga ia menjadi hakim militer pada waktu itu. Ia mendiktekan dikte Al-Amali atas komentar al-Shatibiyyah oleh al-Ja'bari; kemudian ia meminta izin selama perjalanan ke Mesir, meminta maaf atas ketidaksabarannya menghadapi musim dingin Romawi Ia masuk ke Aleppo dan ditugaskan untuk belajar bersama kelompok yang termasuk Ibn al-Hanbali. Kemudian ia masuk ke Tripoli dan kemudian ke Damaskus, di mana penduduknya mendapat manfaat dan membuktikan pengetahuannya, terutama dalam tafsir, bahasa Arab, logika, teologi, prosodi, bacaan, makna, dan retorika. Ia juga mempelajari Al-Alaa ibn Imad al-Din bersama Ibn dalam Tafsir awal Al-Baydawi dan Qadi Ma'ruf Risalat al-Wujud oleh Sayyid al-Sharif. Al-Shihab al-Taybi juga belajar bersamanya dalam pembacaan bacaan, memberinya ijazah yang komprehensif. Dia biasa bersandar telentang untuk mengajar, dan meninjau pengetahuan apa pun yang dia inginkan dari hafalan, dan dia sama sekali tidak memiliki buku atau makalah. Dia menghafal komentar tentang Al-Talkhis dengan catatan pinggir, komentar hasil, penjelasan situasi, dan penjelasan bacaan; dia berkata dalam Al-Shaqa'iq secara umum, karena dia adalah salah satu keajaiban dunia. Dia meninggal dalam sepuluh hari terakhir Sha'ban di Kairo dan dimakamkan di samping Imam Al-Shafi'i. Di makamnya tertulis: Wahai kamu yang memiliki serpihan setiap tanaman di bumi—wahai pemilik topi—jika kamu ditinggalkan sendirian di Tunisia, kamu berada di Mesir, raja Hassan Tunis {cite:shadharat-dhahab, hlm. 686-687}."
