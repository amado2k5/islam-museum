summary:
  ar: "شمس الدين محمد التونسي المالكي الملقب بمغوش، الإمام المحقق المدقق العلامة؛ اشتغل على علماء المغرب وسمع الصحيحين والموطأ والترمذي والشفاء، وولي قضاء عسكر تونس ثم قدم من طريق البحر إلى القسطنطينية في دولة السلطان سليمان فعظّمه وأكرم مثواه ورتّب له علوقة حسنة وشاع فضله بين أكابرها وأخذ عنه جماعة من أعيانها حتى قاضيا العسكر إذ ذاك، وأملى بها إمالي على شرح الشاطبية للجعبري؛ ثم استأذن في الرحلة إلى مصر معتذراً بعدم صبره على شتاء الروم فدخل حلب فانتدب للقراءة عليه جماعة منهم ابن الحنبلي، ثم دخل طرابلس ثم دمشق وانتفع به أهلها وشهدوا له بالعلم خصوصاً في التفسير والعربية والمنطق والكلام والعروض والقراءات والمعاني والبيان، وقرأ عليه العلاء بن عماد الدين في أوائل تفسير البيضاوي والقاضي معروف رسالة الوجود للسيد الشريف، وقرأ عليه الشهاب الطيبي في القراءات وأجازه إجازة حافلة. وكان دأبه الاستلقاء على القفا لحالة التدريس، وكان يطالع من حفظه كلما أراد من العلوم ولم يكن عنده كتاب ولا ورقة أصلاً، وكان يحفظ شرح التلخيص مع حواشيه وشرح الطوالع وشرح المواقف وشرح المطالع؛ وقال في الشقائق بالجملة فإنه كان من أعاجيب الدنيا. توفي في العشر الأواخر من شعبان بالقاهرة ودُفن بجوار الإمام الشافعي وكتب على قبره: يا من به في الأرض أنمار كل مغرس — ألا يا مالك القلنسوة — لئن أوحشت تونس بعد فقد أنت بمصر ملك الحسن تونس {cite:shadharat-dhahab p. 686-687}."
  en: "Maghwash — qadi 'askar of Tunis, honoured by Sulayman at Constantinople where even the qadi 'askars studied under him and he dictated sessions on al-Ja'bari's Shatibiyya sharh; departing for Egypt he taught at Aleppo (Ibn al-Hanbali among his pupils) and Damascus (al-Taybi licensed by him in qira'at) — 'from the marvels of the world': he read everything from memory and owned no book nor paper; died late Sha'ban [947] in Cairo, buried beside Imam al-Shafi'i {cite:shadharat-dhahab p. 686-687}."
