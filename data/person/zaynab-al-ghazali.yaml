summary:
  ar: "زينب الغزالي ⁦(1917–2005)⁩ داعية وكاتبة مصرية، رائدة الحركة النسائية الإسلامية، أسست جمعية السيدات المسلمات ⁦(1936)⁩ وارتبطت بالإخوان المسلمين في الستينيات، وسجنت ست سنوات في عهد عبد الناصر. من كتبها «أيام من حياتي»."
  en: "Zaynab al-Ghazali (1917–2005) was an Egyptian preacher and writer, pioneer of the Islamist women's movement, founder of the Muslim Women's Association (1936), who associated with the Muslim Brotherhood in the 1960s and was imprisoned six years under Nasser. Her memoir is Ayyam min Hayati (Days of My Life)."
  ur: "زینب غزالی ⁦(1917–2005)⁩ مصری داعیہ اور مصنفہ تھیں، اسلامی خواتین تحریک کی پیش رو، 1936 میں جمعیۃ السیدات المسلمات کی بانی، 1960ء کی دہائی میں اخوان المسلمین سے وابستہ ہوئیں اور ناصر کے عہد میں چھ برس قید کاٹیں۔ ان کی یادداشت «أيام من حياتي» ہے۔"
  es: "Zaynab al-Ghazali (1917-2005) fue una predicadora y escritora egipcia, pionera del movimiento feminista islamista, fundadora de la Asociación de Mujeres Musulmanas (1936), que se asoció con los Hermanos Musulmanes en la década de 1960 y fue encarcelada durante seis años bajo el régimen de Nasser. Sus memorias se titulan Ayyam min Hayati (Días de mi vida)."
  fr: "Zaynab al-Ghazali (1917-2005) était une prédicatrice et écrivaine égyptienne, pionnière du mouvement féministe islamiste et fondatrice de l'Association des femmes musulmanes (1936). Elle s'est rapprochée des Frères musulmans dans les années 1960 et a été emprisonnée six ans sous le régime de Nasser. Ses mémoires s'intitulent Ayyam min Hayati (Les jours de ma vie)."
  tr: "Zeynep El-Gazeli (1917–2005), Mısırlı bir vaiz ve yazar, İslami kadın hareketinin öncülerindendi, 1936'da Müslüman Kadınlar Derneği'nin kurucusu, 1960'larda Müslüman Kardeşler'e bağlı ve Abdül Nasır döneminde altı yıl hapis yattı. Kitapları arasında \"Hayatımdan Günler\" yer alır."
  id: "Zainab Al-Ghazali (1917–2005) adalah seorang pengkhotbah dan penulis Mesir, pelopor gerakan perempuan Islam, pendiri Asosiasi Perempuan Muslim (1936), berafiliasi dengan Ikhwanul Muslimin pada tahun 1960-an, dan dipenjara selama enam tahun pada masa Abdel Nasser. Di antara bukunya adalah \"Hari-hari dari Hidupku.\""
