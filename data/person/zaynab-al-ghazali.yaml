  ar: "زينب الغزالي ⁦(1917–2005)⁩ داعية وكاتبة مصرية، رائدة الحركة النسائية الإسلامية، أسست جمعية السيدات المسلمات ⁦(1936)⁩ وارتبطت بالإخوان المسلمين في الستينيات، وسجنت ست سنوات في عهد عبد الناصر. من كتبها «أيام من حياتي»."
