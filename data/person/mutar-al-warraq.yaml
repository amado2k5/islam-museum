summary:
  ar: "مطر الوراق بن طهمان، أبو رجاء الخراساني، نزيل البصرة، كان من العلماء العاملين، وكان يكتب المصاحف ويتقن ذلك. روى عن أنس بن مالك والحسن وابن بريدة وشهر بن حوشب وبكر بن عبد الله وغيرهم، وروى عنه شعبة والحسين بن واقد وإبراهيم بن طهمان وحماد بن سلمة وحماد بن زيد وغيرهم. قال العجلي بصري صدوق، وقال ابن سعد كان فيه ضعف في الحديث {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13762-13763}. وتاريخ وفاته في الكتاب (؟-129 ه)."
  en: "Mutar ibn Tahman, Abu Raja al-Khurasani, who settled in Basra; a learned worker who wrote out Qur'an copies and was skilled at it. He narrated from Anas ibn Malik, al-Hasan, Ibn Buraydah, Shahr ibn Hawshab and Bakr ibn Abd Allah; Shu'ba, al-Husayn ibn Waqid, Ibrahim ibn Tahman, Hammad ibn Salama and Hammad ibn Zayd narrated from him. Al-Ijli calls him a truthful Basran, and Ibn Sa'd says there was weakness in his hadith {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13762-13763}. The book gives his death as 129 AH."
  ur: "مطر بن طہمان، ابو رجاء خراسانی، بصرہ میں مقیم، عالم اور محنتی شخص جو قرآن کے نسخے لکھتے اور اس میں مہارت رکھتے تھے۔ انہوں نے انس بن مالک، حسن، ابن بریدہ، شہر بن حوشب اور بکر بن عبداللہ سے روایت کی، اور ان سے شعبہ، حسین بن واقد، ابراہیم بن طہمان، حماد بن سلمہ اور حماد بن زید نے روایت کی۔ عجلی نے بصری صدوق کہا، اور ابن سعد کے مطابق ان کی حدیث میں کچھ ضعف تھا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13762-13763}۔ کتاب ان کی وفات 129 ہجری بتاتی ہے۔"
