summary:
  ar: "أبو مروان عبد الملك بن زهر (1094–1162م)، المعروف عند اللاتين باسم أفنزور (Avenzoar)، طبيب وشاعر إشبيلي من أسرة بني زهر التي أنجبت ستة أجيال من الأطباء. تعلّم الطب على أبيه أبي العلاء، وخدم المرابطين ثم سُجن في مراكش سنة 1140م، وبعد قيام الموحدين عاد إلى إشبيلية وتفرغ للطب. كتابه «التيسير في المداواة والتدبير» من أشهر كتب الطب العملي في العصور الوسطى، واشتهر بمنهجه التجريبي وإجرائه شقّ القصبة الهوائية على ماعز قبل تجربته على البشر."
  en: "Abu Marwan Abd al-Malik ibn Zuhr (1094–1162), known in Latin as Avenzoar, a Sevillian physician and poet of the Banu Zuhr, a family that produced six generations of physicians. He learnt medicine from his father Abu al-Ala, served the Almoravids and was jailed at Marrakesh in 1140; after the Almohad conquest he returned to Seville and devoted himself to practice. His Kitab al-Taysir ('Book of Simplification Concerning Therapeutics and Diet') became one of the most influential practical medical works of the Middle Ages; he is remembered for his rational, empirical method and for testing the tracheotomy on a goat before applying it to humans."
  ur: "ابو مروان عبد الملک بن زہر (1094ء–1162ء)، جو لاطینی میں Avenzoar کے نام سے مشہور ہیں، سیویل کے طبیب اور شاعر تھے، بنو زہر خاندان سے جس نے اطباء کی چھ نسلیں پیدا کیں۔ انھوں نے طب اپنے والد ابو العلاء سے سیکھی، مرابطین کی خدمت کی اور 1140ء میں مراکش میں قید رہے؛ موحدین کے برسرِ اقتدار آنے کے بعد سیویل لوٹ کر طب کو وقف ہو گئے۔ ان کی «التيسير في المداواة والتدبير» قرونِ وسطیٰ کی عملی طب کی مشہور ترین کتابوں میں سے ہے، اور وہ اپنے تجرباتی طریقے اور انسانوں سے پہلے بکری پر قصبة الریہ کے شگاف کی آزمائش کے لیے یاد کیے جاتے ہیں۔"
