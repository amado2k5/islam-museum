summary:
  ar: "قوّال باكستاني ⁦(وُلد 1952 في حيدر آباد)⁩ من غرانة قوال بچوں کا دہلی، يقود مع أخيه أبي محمد فرقة القوالي التي تُعدّ أشهر فرق باكستان اليوم، ويؤدي أيضًا الدروبد والخيال والثمري، وغنّى في كوك ستوديو «كنگنا» (2011) وأعمالًا أخرى، ونال وسام حسن الأداء في 2006."
  en: "Pakistani qawwal (born 1952 in Hyderabad) of the Qawwal Bachon ka Gharana of Delhi, who leads with his brother Abu Muhammad what is considered Pakistan's best-known qawwali party today; he also sings dhrupad, khayal and thumri, performed 'Kangna' (2011) and other pieces for Coke Studio, and received the Pride of Performance in 2006."
  ur: "پاکستانی قوال ⁦(پیدائش 1952ء، حیدرآباد)⁩ قوال بچوں کے دہلی گھرانے سے، جو اپنے بھائی ابو محمد کے ساتھ اس قوال پارٹی کی قیادت کرتے ہیں جو آج پاکستان کی معروف ترین سمجھی جاتی ہے؛ وہ دھرپد، خیال اور ٹھمری بھی گاتے ہیں، کوک اسٹوڈیو کے لیے «کنگنا» ⁦(2011ء)⁩ اور دوسرے کام پیش کیے، اور 2006ء میں تمغۂ حسنِ کارکردگی پایا۔"
