summary:
  ar: "\u0642\u0648\u0651\u0627\u0644 \u0628\u0627\u0643\u0633\u062a\u0627\u0646\u064a \u2066(\u0648\u064f\u0644\u062f 1952 \u0641\u064a \u062d\u064a\u062f\u0631 \u0622\u0628\u0627\u062f)\u2069 \u0645\u0646 \u063a\u0631\u0627\u0646\u0629 \u0642\u0648\u0627\u0644 \u0628\u0686\u0648\u06ba \u06a9\u0627 \u062f\u06c1\u0644\u06cc\u060c \u064a\u0642\u0648\u062f \u0645\u0639 \u0623\u062e\u064a\u0647 \u0623\u0628\u064a \u0645\u062d\u0645\u062f \u0641\u0631\u0642\u0629 \u0627\u0644\u0642\u0648\u0627\u0644\u064a \u0627\u0644\u062a\u064a \u062a\u064f\u0639\u062f\u0651 \u0623\u0634\u0647\u0631 \u0641\u0631\u0642 \u0628\u0627\u0643\u0633\u062a\u0627\u0646 \u0627\u0644\u064a\u0648\u0645\u060c \u0648\u064a\u0624\u062f\u064a \u0623\u064a\u0636\u064b\u0627 \u0627\u0644\u062f\u0631\u0648\u0628\u062f \u0648\u0627\u0644\u062e\u064a\u0627\u0644 \u0648\u0627\u0644\u062b\u0645\u0631\u064a\u060c \u0648\u063a\u0646\u0651\u0649 \u0641\u064a \u0643\u0648\u0643 \u0633\u062a\u0648\u062f\u064a\u0648 \u00ab\u0643\u0646\u06af\u0646\u0627\u00bb (2011) \u0648\u0623\u0639\u0645\u0627\u0644\u064b\u0627 \u0623\u062e\u0631\u0649\u060c \u0648\u0646\u0627\u0644 \u0648\u0633\u0627\u0645 \u062d\u0633\u0646 \u0627\u0644\u0623\u062f\u0627\u0621 \u0641\u064a 2006."
  en: "Pakistani qawwal (born 1952 in Hyderabad) of the Qawwal Bachon ka Gharana of Delhi, who leads with his brother Abu Muhammad what is considered Pakistan's best-known qawwali party today; he also sings dhrupad, khayal and thumri, performed 'Kangna' (2011) and other pieces for Coke Studio, and received the Pride of Performance in 2006."
