summary:
  ar: "كمال الدين أبو المناقب الخضيري الأسيوطي الشافعي ولد في أوائل القرن بأسيوط واشتغل بها ثم قدم القاهرة بعد سنة عشرين وثمان مئة فلازم شيوخ العصر إلى أن برع في الفقه والأصلين والقراءات والحساب والنحو والتصريف والمعاني والبيان والمنطق ولازم التدريس والإفتاء وكان له في الإنشاء اليد الطولى وكتب الخط المنسوب وصنف حاشية على شرح الألفية لابن المصنف حافلة في مجلدين وكتاباً في القراءات وحاشية على العضد وتعليقاً على الإرشاد لابن المقريء وكتاباً في صنعة التوقيع وقد عينه الظاهر جقمق مرة لقضاء القضاة بالديار المصرية فامتنع وأنشد بعض أصحابه وألذ من نيل الوزارة أن ترى يوماً يريك مصارع الوزرا ومن أجلاء تلامذته الشيخ فخر الدين المقدسي وقاضي مكة برهان الدين بن ظهيرة وقاضيها نور الدين بن أبي اليمن مات ليلة الاثنين وقت أذان العشاء خامس صفر سنة خمس وخمسين وثمان مئة ودفن بالقرافة {cite:shadharat-dhahab p. 284-285}."
  en: "Kamal al-Din al-Khudhayri of Asyut — master of fiqh, usul, qira'at, reckoning, grammar, rhetoric and logic, whose pen ruled the chancery style; when al-Zahir Jaqmaq named him chief qadi of Egypt he declined, quoting: 'sweeter than gaining the vizierate is the day that shows you the viziers' corpses' — dying Safar 855 {cite:shadharat-dhahab p. 284-285}."
  es: "Kamal al-Din al-Khudhayri de Asyut — maestro de fiqh, usul, qira'at, cálculo, gramática, retórica y lógica, cuya pluma dominó el estilo de la cancillería; cuando al-Zahir Jaqmaq lo nombró cadí principal de Egipto, declinó, citando: 'más dulce que obtener el visirato es el día que te muestra los cadáveres de los visires' — murió en Safar 855 {cita: shadharat-dhahab págs. 284-285}."
  fr: "Kamal al-Din al-Khudhayri d'Assiout — maître du fiqh, de l'usul, du qira'at, du calcul, de la grammaire, de la rhétorique et de la logique, dont la plume a régné sur le style de la chancellerie; lorsqu'al-Zahir Jaqmaq le nomma cadi en chef d'Égypte, il refusa, citant: « Plus doux que d'obtenir le vizirat est le jour qui vous montre les cadavres des vizirs » — mourant le Safar 855 {cite: shadharat-dhahab p. 284-285}."
  ur: "اسیوط کے کمال الدین الخضیری - فقہ، اصول، قراءت، حساب، گرائمر، بیان بازی اور منطق کے ماہر، جن کے قلم نے چانسری کے انداز پر حکمرانی کی۔ جب الظاہر جقمق نے انہیں مصر کا چیف قاضی نامزد کیا تو اس نے انکار کرتے ہوئے کہا: 'وزیریت حاصل کرنے سے زیادہ پیارا وہ دن ہے جو آپ کو وزیروں کی لاشیں دکھاتا ہے' - وفات صفر ص 855 284-285}۔"
  tr: "Kamal al-Din Ebu el-Manaqib el-Khudairi el-Asyuti el-Şafii, yüzyılın başlarında Assiut'ta doğdu ve orada çalıştı, ardından sekiz yüz yirmi yıl Hicri yılından sonra Kahire'ye geldi; burada dönemin şeyhlerini takip ederek fıkıh, okumalar, aritmetik, dilbilgisi, morfoloji, anlamlar, retorik ve mantıkta üstün oldu. Öğretim ve fetva yayımlama ile ilgilendi, yazımda uzun bir görevi vardı, atfedilen yazıyı yazdı ve İbn el-Musannaf'ın El-Alfiyeye açıklamasına iki ciltlik kenar tefsiri, okumalar üzerine bir kitap, 'Destek' üzerine bir kenar tefhi ve İbn el-Mukri'nin rehberliği üzerine bir yorum ve işaret sanatı üzerine bir kitap kaleme aldı. El-Zahir Ceqmaq onu bir keresinde Mısır'da yargıç olarak atamıştı, ancak o reddetti ve bazı arkadaşları şöyle dedi: \"Hizmetkârı almaktan daha güzel olan şey, bir gün seni bir din adamları güreşçisi olarak görmektir. En seçkin öğrencileri arasında Mekke yargıcı Şeyh Fakhr al-Din el-Makdisi Burhan al-Din ibn Zuhayra ve onun hakimi Nur al-Din ibn Ebi el-Yaman vardı. O, Pazartesi gecesi, Sefer'in beşinci günü olan Ezan zamanında, 855 Hile yılında öldü ve el-Karafe'ye defnedildi.\""
  id: "Kamal al-Din Abu al-Manaqib al-Khudairi al-Asyuti al-Shafi'i lahir pada awal abad di Assiut dan bekerja di sana, kemudian datang ke Kairo setelah tahun delapan ratus dua puluh tahun H, di mana ia mengikuti para sheikh pada masa itu hingga unggul dalam bidang hukum, dua prinsip, yaitu pembacaan, aritmatika, tata bahasa, morfologi, makna, retorika, dan logika. Ia terlibat dalam pengajaran dan penerbitan fatwa, serta memiliki pengalaman luas dalam menyusun, menulis naskah yang dikaitkan, dan menulis komentar marginal atas penjelasan Al-Alfiyya oleh Ibn al-Musannaf dalam dua jilid, sebuah buku tentang pembacaan, komentar marginal tentang 'Support' dan komentar atas bimbingan Ibn al-Muqri, serta buku tentang seni menandatangani. Al-Zahir Jaqmaq pernah mengangkatnya sebagai hakim di Mesir, tetapi ia menolak, dan beberapa sahabatnya mengucapkan: \"Yang lebih menyenangkan daripada mendapatkan jabatan adalah melihat Anda suatu hari sebagai pejuang antara para menteri. Di antara murid-muridnya yang paling terhormat adalah Sheikh Fakhr al-Din al-Maqdisi, hakim Mekah, Burhan al-Din ibn Zuhayra, dan hakimnya Nur al-Din ibn Abi al-Yaman. Ia meninggal pada malam Senin, saat panggilan doa Isha, tanggal lima Safar, tahun 855 H, dan dimakamkan di al-Qarafah.\""
