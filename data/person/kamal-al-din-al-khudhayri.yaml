names:
  - { kind: full, lang: ar, value: "كمال الدين أبو المناقب أبو بكر بن ناصر الدين محمد بن صباح الدين أبي بكر الهمامي الخضيري الأسيوطي" }
summary:
  ar: "كمال الدين أبو المناقب الخضيري الأسيوطي الشافعي ولد في أوائل القرن بأسيوط واشتغل بها ثم قدم القاهرة بعد سنة عشرين وثمان مئة فلازم شيوخ العصر إلى أن برع في الفقه والأصلين والقراءات والحساب والنحو والتصريف والمعاني والبيان والمنطق ولازم التدريس والإفتاء وكان له في الإنشاء اليد الطولى وكتب الخط المنسوب وصنف حاشية على شرح الألفية لابن المصنف حافلة في مجلدين وكتاباً في القراءات وحاشية على العضد وتعليقاً على الإرشاد لابن المقريء وكتاباً في صنعة التوقيع وقد عينه الظاهر جقمق مرة لقضاء القضاة بالديار المصرية فامتنع وأنشد بعض أصحابه وألذ من نيل الوزارة أن ترى يوماً يريك مصارع الوزرا ومن أجلاء تلامذته الشيخ فخر الدين المقدسي وقاضي مكة برهان الدين بن ظهيرة وقاضيها نور الدين بن أبي اليمن مات ليلة الاثنين وقت أذان العشاء خامس صفر سنة خمس وخمسين وثمان مئة ودفن بالقرافة {cite:shadharat-dhahab p. 284-285}."
  en: "Kamal al-Din al-Khudhayri of Asyut — master of fiqh, usul, qira'at, reckoning, grammar, rhetoric and logic, whose pen ruled the chancery style; when al-Zahir Jaqmaq named him chief qadi of Egypt he declined, quoting: 'sweeter than gaining the vizierate is the day that shows you the viziers' corpses' — dying Safar 855 {cite:shadharat-dhahab p. 284-285}."
  es: "Kamal al-Din al-Khudhayri de Asyut — maestro de fiqh, usul, qira'at, cálculo, gramática, retórica y lógica, cuya pluma dominó el estilo de la cancillería; cuando al-Zahir Jaqmaq lo nombró cadí principal de Egipto, declinó, citando: 'más dulce que obtener el visirato es el día que te muestra los cadáveres de los visires' — murió en Safar 855 {cita: shadharat-dhahab págs. 284-285}."
  fr: "Kamal al-Din al-Khudhayri d'Assiout — maître du fiqh, de l'usul, du qira'at, du calcul, de la grammaire, de la rhétorique et de la logique, dont la plume a régné sur le style de la chancellerie; lorsqu'al-Zahir Jaqmaq le nomma cadi en chef d'Égypte, il refusa, citant: « Plus doux que d'obtenir le vizirat est le jour qui vous montre les cadavres des vizirs » — mourant le Safar 855 {cite: shadharat-dhahab p. 284-285}."
  ur: "اسیوط کے کمال الدین الخضیری - فقہ، اصول، قراءت، حساب، گرائمر، بیان بازی اور منطق کے ماہر، جن کے قلم نے چانسری کے انداز پر حکمرانی کی۔ جب الظاہر جقمق نے انہیں مصر کا چیف قاضی نامزد کیا تو اس نے انکار کرتے ہوئے کہا: 'وزیریت حاصل کرنے سے زیادہ پیارا وہ دن ہے جو آپ کو وزیروں کی لاشیں دکھاتا ہے' - وفات صفر ص 855 284-285}۔"
