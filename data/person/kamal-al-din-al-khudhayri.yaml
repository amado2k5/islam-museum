summary:
  ar: "كمال الدين أبو المناقب الخضيري الأسيوطي الشافعي ولد في أوائل القرن بأسيوط واشتغل بها ثم قدم القاهرة بعد سنة عشرين وثمان مئة فلازم شيوخ العصر إلى أن برع في الفقه والأصلين والقراءات والحساب والنحو والتصريف والمعاني والبيان والمنطق ولازم التدريس والإفتاء وكان له في الإنشاء اليد الطولى وكتب الخط المنسوب وصنف حاشية على شرح الألفية لابن المصنف حافلة في مجلدين وكتاباً في القراءات وحاشية على العضد وتعليقاً على الإرشاد لابن المقريء وكتاباً في صنعة التوقيع وقد عينه الظاهر جقمق مرة لقضاء القضاة بالديار المصرية فامتنع وأنشد بعض أصحابه وألذ من نيل الوزارة أن ترى يوماً يريك مصارع الوزرا ومن أجلاء تلامذته الشيخ فخر الدين المقدسي وقاضي مكة برهان الدين بن ظهيرة وقاضيها نور الدين بن أبي اليمن مات ليلة الاثنين وقت أذان العشاء خامس صفر سنة خمس وخمسين وثمان مئة ودفن بالقرافة {cite:shadharat-dhahab p. 284-285}."
  en: "Kamal al-Din al-Khudhayri of Asyut — master of fiqh, usul, qira'at, reckoning, grammar, rhetoric and logic, whose pen ruled the chancery style; when al-Zahir Jaqmaq named him chief qadi of Egypt he declined, quoting: 'sweeter than gaining the vizierate is the day that shows you the viziers' corpses' — dying Safar 855 {cite:shadharat-dhahab p. 284-285}."
