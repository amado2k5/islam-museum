label:
  ar: علي بن محمد بن عبيد الله العباسي العلوي
  en: Ali ibn Muhammad ibn Ubaydallah al-Abbasi al-Alawi
  ur: علی بن محمد بن عبید اللہ عباسی علوی
summary:
  ar: صاحب «سيرة الهادي إلى الحق» وراويتها في نظر المحقق، هاجر إلى الهادي في ذي الحجة سنة 285هـ وهو غلام، وصحبه في اليمن، وحُمل حياً من معركة نجران إلى خيوان فتوفي فيها.
  en: Author and narrator of Sirat al-Hadi ila al-Haqq in the editor's judgement; he joined al-Hadi in Yemen in Dhu al-Hijja 285 AH as a boy, and was carried alive from the fighting at Najran to Khiwan, where he died.
  ur: مرتب کی رائے میں «سیرت الہادی الی الحق» کا مصنف اور راوی؛ ذو الحجہ 285ھ میں لڑکپن میں یمن میں ہادی سے آ ملا، اور نجران کی لڑائی سے زندہ خیوان لے جایا گیا جہاں اس کی وفات ہوئی۔
