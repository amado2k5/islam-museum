summary:
  ar: "رجل دولة وعالم إيراني (1878–1970) من تبريز: ابن سيّد تدرّب ملّا ثم صار نائبًا دستوريًا بارزًا ومؤسس حزب إيران الديمقراطي ومحرر «كاوه» في منفى برلين، ثم وزير مالية وسفيرًا ورئيس مجلس الشيوخ؛ ولا تزال دراساته في تقاويم إيران القديمة مرجعًا."
  en: "Iranian statesman and scholar (1878–1970) from Tabriz: a sayyed's son trained as a mullah who became a leading constitutionalist deputy, founder of the Democratic Party of Iran, editor of Kaveh in Berlin exile, and later finance minister, ambassador and president of the Senate; his studies of the old Iranian calendars remain reference works."
  ur: "تبریز کے ایرانی سیاست دان اور عالم (1878–1970): ایک سید زادے جنہوں نے ملا کی تربیت پائی، پھر نمایاں آئینی نائب، ایران کی ڈیموکریٹک پارٹی کے بانی، برلن جلاوطنی میں «کاوہ» کے مدیر، اور بعد میں وزیرِ خزانہ، سفیر اور سینیٹ کے صدر بنے؛ قدیم ایرانی تقاویم پر ان کی تحقیقات آج بھی مرجع ہیں۔"
