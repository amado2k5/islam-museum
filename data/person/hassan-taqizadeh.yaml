  note: "Died at Tehran on 28 January 1970 — the Encyclopaedia Iranica dates it 8 Bahman 1348 in the Persian solar calendar, and the English and Persian articles and Wikidata agree on the Gregorian day — and was buried, after a funeral from the Sepahsalar mosque, in the Zahir al-Dawla cemetery. The lunar Hijri year 1389 is the derived conversion. There is no museum place entity for Tehran or for the cemetery, so no died_in or buried_in edge is written."
