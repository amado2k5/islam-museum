  note: "Born at Tabriz on 30 Ramadan 1295, which the Encyclopaedia Iranica converts to 27 September 1878; the English article and Wikidata give the same day. His father was Sayyed Taqi Ordubadi, a Hosayni sayyed and noted cleric of Tabriz who had studied at Najaf under Shaikh Mortaza Ansari. The Hijri date is the Iranica entry's own."
