  ar: "محمد عابد الجابري ⁦(1935–2010)⁩ فيلسوف مغربي، أستاذ الفلسفة بجامعة محمد الخامس بالرباط، صاحب مشروع «نقد العقل العربي» الرباعي. من كتبه «تكوين العقل العربي» و«بنية العقل العربي» و«العقل السياسي العربي» و«العقل الأخلاقي العربي»."
  en: "Mohamed Abed al-Jabri (1935–2010) was a Moroccan philosopher, professor at Mohammed V University in Rabat, author of the four-volume 'Critique of Arab Reason' project. His books include Takwin al-'Aql al-'Arabi, Bunyat al-'Aql al-'Arabi, Al-'Aql al-Siyasi al-'Arabi and Al-'Aql al-Akhlaqi al-'Arabi."
