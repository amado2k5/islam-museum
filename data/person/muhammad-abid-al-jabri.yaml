summary:
  ar: "محمد عابد الجابري ⁦(1935–2010)⁩ فيلسوف مغربي، أستاذ الفلسفة بجامعة محمد الخامس بالرباط، صاحب مشروع «نقد العقل العربي» الرباعي. من كتبه «تكوين العقل العربي» و«بنية العقل العربي» و«العقل السياسي العربي» و«العقل الأخلاقي العربي»."
  en: "Mohamed Abed al-Jabri (1935–2010) was a Moroccan philosopher, professor at Mohammed V University in Rabat, author of the four-volume 'Critique of Arab Reason' project. His books include Takwin al-'Aql al-'Arabi, Bunyat al-'Aql al-'Arabi, Al-'Aql al-Siyasi al-'Arabi and Al-'Aql al-Akhlaqi al-'Arabi."
  ur: "محمد عابد جبری ⁦(1935–2010)⁩ مراکشی فلسفی تھے، رباط کی جامعہ محمد الخامس کے پروفیسر، چار جلدوں پر مشتمل «نقد العقل العربي» منصوبے کے بانی۔ کتب میں «تکوين العقل العربي»، «بنية العقل العربي»، «العقل السياسي العربي» اور «العقل الأخلاقي العربي» شامل ہیں۔"
  es: "Mohamed Abed al-Jabri (1935-2010) fue un filósofo marroquí, profesor de la Universidad Mohammed V de Rabat y autor del proyecto de cuatro volúmenes 'Crítica de la razón árabe'. Sus libros incluyen Takwin al-'Aql al-'Arabi, Bunyat al-'Aql al-'Arabi, Al-'Aql al-Siyasi al-'Arabi y Al-'Aql al-Akhlaqi al-'Arabi."
  fr: "Mohamed Abed al-Jabri (1935-2010) était un philosophe marocain, professeur à l'Université Mohammed V de Rabat, auteur du projet en quatre volumes « Critique de la raison arabe ». Ses livres incluent Takwin al-'Aql al-'Arabi, Bunyat al-'Aql al-'Arabi, Al-'Aql al-Siyasi al-'Arabi et Al-'Aql al-Akhlaqi al-'Arabi."
