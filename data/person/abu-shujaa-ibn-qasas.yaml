label: { ar: "أبو شجاع الراهب", en: "Abu Shuja' the Monk" }
summary:
  ar: "أبو شجاع بن قساس، الراهب الذي ظهرت في مدة القبض على الآمر المصادرات على يده؛ كان في ابتداء حاله يخدم ولي الدولة أبا البركات بن يحيى بن أبي الليث، ثم اتصل بالآمر وبذل له في مصادرة قوم من النصارى مائة ألف دينار فأطلق يده فيهم، وتسلسل الحال إلى أن عم البلاد جميع رؤساء مصر وقضاتها وكتابها؛ صار يركب بسروج مُحلاة بالذهب والفضة ويجلس في دهليز قاعة لباس الخطباء بالجامع العتيق بمصر يستدعي الناس للمصادرة؛ إلى أن قتله المقداد والي مصر وصُلب عند الجسر {cite:wafayat-ayan}."
  en: "Abu Shuja' b. Qasas — the monk who ran the Fatimid caliph al-Amir's confiscation regime in Egypt until al-Miqdad, governor of Misr, killed him and crucified the body by the bridge {cite:wafayat-ayan}."
