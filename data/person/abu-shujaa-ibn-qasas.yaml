id: person/abu-shujaa-ibn-qasas
class: person
label: { ar: "أبو شجاع الراهب", en: "Abu Shuja' the Monk", fr: "Abu Shuja' le Moine", es: "Abu Shuja' the Monk", ur: "ابو شجاع راہب" }
summary:
  ar: "أبو شجاع بن قساس، الراهب الذي ظهرت في مدة القبض على الآمر المصادرات على يده؛ كان في ابتداء حاله يخدم ولي الدولة أبا البركات بن يحيى بن أبي الليث، ثم اتصل بالآمر وبذل له في مصادرة قوم من النصارى مائة ألف دينار فأطلق يده فيهم، وتسلسل الحال إلى أن عم البلاد جميع رؤساء مصر وقضاتها وكتابها؛ صار يركب بسروج مُحلاة بالذهب والفضة ويجلس في دهليز قاعة لباس الخطباء بالجامع العتيق بمصر يستدعي الناس للمصادرة؛ إلى أن قتله المقداد والي مصر وصُلب عند الجسر {cite:wafayat-ayan}."
  en: "Abu Shuja' b. Qasas — the monk who ran the Fatimid caliph al-Amir's confiscation regime in Egypt until al-Miqdad, governor of Misr, killed him and crucified the body by the bridge {cite:wafayat-ayan}."
  fr: "Abu Shuja' b. Qasas, le moine qui dirigea le régime de confiscations du calife fatimide al-Amir en Égypte jusqu'à ce qu'al-Miqdad, gouverneur de Misr, le tue et crucifie son corps près du pont {cite:wafayat-ayan}."
  es: "Abu Shuja' b. Qasas — el monje que dirigió el régimen de confiscación del califa fatimí al-Amir en Egipto hasta que al-Miqdad, gobernador de Misr, lo mató y crucificó el cuerpo junto al puente {cite:wafayat-ayan}."
  ur: "ابو شجاع بن قصاص - وہ راہب جس نے مصر میں فاطمی خلیفہ الامیر کی ضبطی حکومت کو چلایا یہاں تک کہ مصر کے گورنر المقداد نے اسے قتل کر دیا اور لاش کو پل کے کنارے سولی پر چڑھا دیا۔"
  tr: "Komutanın tutuklanması sırasında onun eliyle el koyma işlemlerini gerçekleştiren keşiş Ebu Şuca' ibn Kasas, hayatının başlarında devlet valisi Ebu el-Barakat ibn Yahya ibn Abi el-Layth'ın hizmetindeydi. Daha sonra komutanla bağlantı kurdu ve bir grup Hristiyan'a el koyması için ona yüz bin dinar teklif etti, böylece komutan ona onlara karşı tam yetki verdi. Durum, Mısır'ın tüm liderleri, kadıları ve katipleri de dahil olmak üzere ülke geneline yayıldı. Altın ve gümüşle süslenmiş eyerlerle at sürer, Mısır'daki eski caminin vaizlerin giyinme salonunun girişinde oturur ve el koyma işlemleri için insanları çağırırdı. Ta ki Mısır valisi Mikdad onu öldürüp köprüde çarmıha gerene kadar."
  id: "Abu Shuja’ ibn Qassas, seorang biarawan yang, selama masa penangkapan komandan, melakukan penyitaan atas perintahnya, pada awal hidupnya mengabdi kepada gubernur negara bagian, Abu al-Barakat ibn Yahya ibn Abi al-Layth. Kemudian ia menjalin hubungan dengan komandan dan menawarkannya seratus ribu dinar untuk menyita sekelompok orang Kristen, sehingga komandan memberinya kebebasan penuh atas mereka. Situasi tersebut berkembang hingga menyebar ke seluruh negeri, termasuk semua pemimpin Mesir, hakim, dan ahli Tauratnya. Ia akan menunggang kuda dengan pelana yang dihiasi emas dan perak dan duduk di serambi ruang ganti para pengkhotbah di masjid tua di Mesir, memanggil orang-orang untuk disita, hingga al-Miqdad, gubernur Mesir, membunuhnya dan menyalibnya di jembatan."
