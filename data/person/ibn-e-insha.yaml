summary:
  ar: "شاعر وكاتب أردي باكستاني (1927–1978)، اسمه الحقيقي شير محمد خان، عُرف بقلمه «ابن انشا». اشتهر بغزله وشعر الفكاهة وأدب الرحلات وأعمدته الصحفية، ووصل شعره إلى جمهور واسع عبر الإذاعة والغناء."
  en: "Pakistani Urdu poet and writer (1927–1978), born Sher Muhammad Khan and known by his pen name Ibn-e-Insha. He was celebrated for his ghazals, humour poetry, travelogues and newspaper columns, and his verse reached a wide audience through radio and song."
  ur: "پاکستانی اردو شاعر اور اديب (1927–1978)، اصل نام شیر محمد خان، قلمی نام «ابن انشا» سے معروف ہوئے۔ وہ اپنی غزلوں، مزاحیہ شاعری، سفرناموں اور اخباری کالموں کے لیے مشہور ہوئے، اور ان کا کلام ریڈیو اور گائیکی کے ذریعے وسیع سامعین تک پہنچا۔"
