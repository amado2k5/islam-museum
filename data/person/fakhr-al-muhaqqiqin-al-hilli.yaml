summary:
  ar: "بطاقة أولية لفخر المحققين الحلي، ابن العلامة الحلي وفقيه الإمامية ومؤلف «إيضاح الفوائد»، توفي سنة ١٣٦٩م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Fakhr al-Muhaqqiqin al-Hilli, son of al-Allama al-Hilli, the Imami jurist and author of Idah al-Fawa'id, d. 1369; the biographical entry is not yet checked on the page."
  es: "Ficha preliminar para Fakhr al-Muhaqqiqin al-Hilli, hijo de al-Allama al-Hilli, jurista imamí y autor de Idah al-Fawa'id, fallecido en 1369; la entrada biográfica aún no ha sido verificada en la página."
  fr: "Fiche de projet pour Fakhr al-Muhaqqiqin al-Hilli, fils d'al-Allama al-Hilli, le juriste imamite et auteur de l'Idah al-Fawa'id, mort en 1369; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "فخر المحققین الہلی کے لیے کارڈ کا مسودہ، علامہ الہلی کے بیٹے، امامی فقیہ اور ایدہ الفوائد کے مصنف، د. 1369; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1369 yılında ölen alim al-Hilli'nin oğlu, İmam hukukçu ve 'Idah al-Fawa'id' kitabının yazarı Fakhr al-Muhaqkyn al-Hilli için ön kart; biyografik kitaplarda adı geçti ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Fakhr al-Muhaqqiyin al-Hilli, putra ulama al-Hilli, seorang ahli hukum Imami dan penulis 'Idah al-Fawa'id', yang meninggal pada tahun 1369 M; buku biografi menyebutkannya, dan biografinya belum pernah diulas di halaman tersebut."
