id: person/abu-zakariya-al-tikriti
class: person
label:
  ar: "أبو زكريا التكريتي"
  en: "Abu Zakariya al-Tikriti"
  fr: "Abu Zakariya al-Tikriti"
  es: "Abu Zakariya al-Tikriti"
  ur: "ابو زکریا التکریتی"
roles: [scholar, jurist, qadi, poet]
gender: male
summary:
  ar: "يحيى بن القاسم بن مفرج بن درع، أبو زكريا الثعلبي التكريتي، فاضل أديب من فقهاء الشافعية، ولد بتكريت وولي قضاءها، وانتقل إلى بغداد سنة 607 هـ فولي تدريس النظامية، وتوفي ببغداد سنة 616 هـ."
  en: "Yahya ibn al-Qasim ibn Mufarrij ibn Dar', Abu Zakariya al-Tha'labi al-Tikriti, a learned man and littérateur among the Shafi'i jurists; born in Tikrit and its qadi, he moved to Baghdad in 607 AH to teach at the Nizamiyya and died there in 616 AH (1219)."
  fr: "Yahya ibn al-Qasim ibn Mufarrij ibn Dar', Abu Zakariya al-Tha'labi al-Tikriti, savant et lettré parmi les juristes chaféites ; né à Tikrit et cadi de cette ville, il gagna Bagdad en 607 H pour enseigner à la Nizamiyya et y mourut en 616 H (1219)."
  es: "Yahya ibn al-Qasim ibn Mufarrij ibn Dar', Abu Zakariya al-Tha'labi al-Tikriti, un hombre erudito y literato entre los juristas Shafi'i; Nacido en Tikrit y su cadí, se trasladó a Bagdad en el año 607 d. H. para enseñar en Nizamiyya y murió allí en el año 616 d. H. (1219)."
  ur: "یحییٰ بن القاسم ابن مفرج ابن دار، ابو زکریا الثعلبی التکریتی، شافعی فقہاء میں ایک عالم اور ادبی شخصیت؛ تکریت اور اس کے قاضی میں پیدا ہوئے، وہ نظامیہ میں درس دینے کے لیے 607 ہجری میں بغداد چلے گئے اور وہیں 616 ہجری (1219) میں وفات پائی۔"
  tr: "Yahya bin Al-Qasim bin Mufarrij bin Dar’, Ebu Zekeriya Al-Tha’labi Al-Tikriti, Şafiî fıkıh ekolünden, ilim sahibi ve hitabeti güçlü bir kişiydi. Tikrit'te doğdu ve orada kadı olarak görev yaptı. Hicri 607 yılında Bağdat'a taşındı ve Nizamiyye Medresesi'nde öğretim görevlisi olarak atandı. Hicri 616 yılında Bağdat'ta vefat etti."
  id: "Yahya bin Al-Qasim bin Mufarrij bin Dar’, Abu Zakariya Al-Tha’labi Al-Tikriti, seorang cendekiawan dan ahli bahasa dari mazhab fiqih Syafi’i. Beliau lahir di Tikrit dan menjabat sebagai hakim di sana. Beliau pindah ke Baghdad pada tahun 607 H dan diangkat mengajar di Madrasah Nizamiyya. Beliau wafat di Baghdad pada tahun 616 H."
