summary:
  ar: "جمال الدين السنباطي الشافعي الواعظ؛ لازم مجلس الشيخ سراج الدين البلقيني يقرأ عليه من كلامه وكلام غيره، وكان يتكلم على الناس بالجامع الأزهر من نحو سبعين سنة ومع ذلك يشتغل بالعلم ويستحضر في الفقه، وقد ناب في الحكم عن القاضي جلال الدين وغيره، وتوفي في رمضان سنة ست وأربعين وثمانمائة بعد مرض طويل قاله ابن حجر {cite:shadharat-dhahab p. 258}."
  en: "Al-Sanbati — the Azhar's preaching voice for some seventy years; al-Bulqini's constant companion, deputy judge, still 'busy with learning and preserving fiqh' into old age; died Ramadan 846 after a long illness {cite:shadharat-dhahab p. 258}."
  fr: "Al-Sanbati - la voix de prédication de l'Azhar pendant environ soixante-dix ans ; compagnon constant d'al-Bulqini, juge adjoint, toujours « occupé par l'apprentissage et la préservation du fiqh » dans la vieillesse ; est mort Ramadan 846 après une longue maladie {cite:shadharat-dhahab p. 258}."
  es: "Al-Sanbati, la voz predicadora de Azhar durante unos setenta años; compañero constante de al-Bulqini, juez adjunto, aún 'ocupado con el aprendizaje y la preservación del fiqh' en la vejez; murió en Ramadán de 846 después de una larga enfermedad {cita: shadharat-dhahab p. 258}."
  ur: "السنبتی - تقریباً ستر سالوں سے اظہر کی تبلیغی آواز؛ البلقینی کا مستقل ساتھی، نائب جج، بڑھاپے میں بھی 'فقہ سیکھنے اور محفوظ کرنے میں مصروف'؛ طویل علالت کے بعد رمضان المبارک 846 میں وفات پائی۔ 258}۔"
  tr: "Vaiz Cemaleddin el-Sünbati el-Şafii, Şeyh Sirajeddin el-Balkini'nin toplantılarına katılarak onun ve başkalarının konuşmasından okudu. Yaklaşık yetmiş yıl boyunca El-Ezher Camii'nde insanlara konuştu, ancak bilgiye yöneldi ve fıkhiha dalmıştı. Yargıç Celaleddin ve diğerleri için yargı yardımcısı olarak görev yaptı ve uzun bir hastalıktan sonra 846 Hicri Ramazan'da vefat etti; bu durum İbn Hajar'ın belirttiği gibi {alıntı:şadharat-dhahab, s. 258}."
  id: "Jamal al-Din al-Sunbati al-Shafi'i, sang pencemah, menghadiri pertemuan Sheikh Siraj al-Din al-Balqini, membacakan pidatonya dan yang lain. Ia biasa berbicara kepada orang-orang di Masjid Al-Azhar selama sekitar tujuh puluh tahun, namun ia tetap mendalami ilmu dan tenggelam dalam bidang hukum. Ia bertugas sebagai wakil hakim untuk Hakim Jalal al-Din dan lainnya, dan meninggal pada Ramadan tahun 846 H setelah sakit panjang, seperti yang dinyatakan oleh Ibn Hajar {cite:shadharat-dhahab, hlm. 258}."
