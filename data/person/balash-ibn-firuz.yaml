  id: "Seorang raja Persia Sasanian, disebut oleh al-Tabari dengan judul 'Sebutan Raja Balash ibn Fairuz' {cite:tabari-tarikh-abu-al-fadl J.2 hlm.90}. Di tempat ini, apa yang dikatakan tentang tahun-tahun pemerintahannya dan kisah-kisahnya diceritakan."
