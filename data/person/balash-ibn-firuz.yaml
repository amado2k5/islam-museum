  ar: "ملك من ملوك الفرس الساسانيين، ذكره الطبري تحت عنوان «ذكر ملك بلاش بن فيروز» {cite:tabari-tarikh-abu-al-fadl j.2 p.90}. يُروى في هذا الموضع ما قيل في سني ملكه وأخباره."
