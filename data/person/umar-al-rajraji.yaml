label:
  ar: "الرجراجي (عمر بن محمد)"
  en: "Al-Rajraji (Umar ibn Muhammad)"
summary:
  ar: "عمر بن محمد، أبو علي وأبو حفص، الرجراجي الفاسي، فقيه مالكي وصفه ابن غازي بالشيخ الصالح المتفق على علمه وصلاحه، وقال السخاوي إنه إمام جامع الأندلس في فاس، وكان الغالب عليه الزهد والورع مع تقدمه في الفقه. أخذ عن جماعة من مشيخة فاس، منهم أبو عمران العبدوسي والقباب والوانغيلي الضرير، وعنه جلة منهم ابن الخطيب القسنطيني وابن علال المصمودي. توفي سنة 810 هـ على ما يذكر العنوان بعلامة الاستفهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15817}"
  en: "Umar ibn Muhammad, Abu Ali and Abu Hafs, al-Rajraji al-Fasi, a Maliki jurist. Ibn Ghazi called him a righteous shaykh whose learning and piety were agreed; al-Sakhawi called him the imam of the Andalusian mosque in Fes, mostly known for asceticism and scrupulousness, and foremost in fiqh. He studied with several Fes teachers, including Abu Imran al-Abdusi, al-Qabbab and the blind al-Wanghili, the mufti of Fes, and was studied with by Ibn al-Khatib al-Qasantini and Ibn Allal al-Masmudi. The header gives 810 AH with a question mark. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15817}"
