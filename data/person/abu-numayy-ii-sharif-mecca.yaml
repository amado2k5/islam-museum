summary:
  ar: "الأمير أبو نمي محمد بن بركات الحسني أمير مكة؛ قال في النور السافر: استمر أميراً بمكة سنين كثيرة؛ ولد سنة عشر وتسعمائة، وشركة لأبيه قبل موته ثم استقل بعده، وعُزل بعد عام من سلطنة سليم وشاركه ابن عمه إدريس ثم عاد إلى أمرته على مكة إلى أن توفي يوم عاشوراء [م سنة 990 على ظاهر الكتاب، وتاريخياً 992]؛ قال النور: ما رأيت بمكة أميراً أفصح منه ولا أمهر ولا أفضل فصاحة ولا أحسن نظماً ولا أبقى نثراً ولا أعطف ألباً ولا أدنى صيتاً، فامتاز بمحاسن كثيرة؛ وأنشد ناظر الحرمين ابن المولوي وصفاً منه {cite:shadharat-dhahab p. 424-425}."
  en: "Abu Numayy II Muhammad b. Barakat — sharif of Mecca, partner to his father then sole amir; briefly deposed after Selim's accession and shared with his cousin Idris before returning; al-Nur al-Safir praises him as Mecca's most eloquent and ablest amir; died 'Ashura (the book places it under 990; historically 992) {cite:shadharat-dhahab p. 424-425}."
  fr: "Abu Numayy II Muhammad b. Barakat — sharif de La Mecque, associé à son père puis seul émir ; brièvement destitué après l'avènement de Selim, il partagea le pouvoir avec son cousin Idris avant de revenir ; al-Nur al-Safir le loue comme l'émir le plus éloquent et le plus habile de La Mecque ; il mourut le jour d'Ashura (le livre le place sous 990 ; historiquement 992) {cite:shadharat-dhahab p. 424-425}."
  es: "Abu Numayy II Muhammad b. Barakat — sharif de La Meca, socio de su padre y luego único emir; depuesto brevemente tras la ascensión de Selim y compartido con su primo Idris antes de regresar; al-Nur al-Safir lo elogia como el emir más elocuente y capaz de La Meca; murió en Ashura (el libro lo sitúa en el año 990; históricamente en el 992) {cita: shadharat-dhahab págs. 424-425}."
  ur: "ابو نمعی ثانی محمد بن برکات - مکہ کے شریف، اپنے والد کے ساتھی پھر واحد امیر؛ سلیم کے الحاق کے بعد مختصر طور پر معزول کیا گیا اور واپس آنے سے پہلے اپنے کزن ادریس کے ساتھ اشتراک کیا۔ النور السفیر نے ان کی تعریف مکہ کے سب سے زیادہ فصیح اور قابل امیر کے طور پر کی ہے۔ وفات عاشورہ ⁦(کتاب اسے 990 کے تحت بتاتی ہے؛ تاریخی طور پر 992)⁩ 424-425}۔"
  tr: "Mekke Emiri Prens Ebu Nami Muhammed ibn Barakat el-Hasani; El-Nur el-Safir'de şöyle demiştir: \"Uzun yıllar Mekke Emiri olarak görev yaptı; 910 yılında doğdu ve ölümünden önce babasıyla ortak oldu, sonra ondan sonra bağımsız oldu ve Selim Sultanlığı'ndan bir yıl sonra görevden alındı ve kuzeni İdris onunla ortak oldu, sonra Aşura günü (kitabın zahiri anlamına göre 990, tarihsel olarak 992) vefat edene kadar Mekke üzerindeki emirliğine geri döndü.\" El-Nur şöyle demiştir: \"Mekke'de ondan daha güzel konuşan, daha yetenekli, daha iyi belagatli, daha iyi şiir yazan, daha kalıcı nesir yazan, daha merhametli, daha az ünlü bir emir görmedim; yani birçok erdemiyle öne çıkıyordu.\" İki kutsal mescidin gözetmeni İbn el-Mevlevi de onun hakkında bir betimleme aktarmıştır. {Kaynak: Şadharat-Dhaba s. 424-425}."
  id: "Pangeran Abu Nami Muhammad ibn Barakat al-Hasani, Emir Mekah; beliau berkata dalam Al-Nur al-Safir: Beliau terus menjadi Emir Mekah selama bertahun-tahun; beliau lahir pada tahun 9010, dan beliau berbagi kekuasaan dengan ayahnya sebelum kematiannya, kemudian beliau menjadi independen setelahnya, dan beliau diberhentikan setahun setelahnya, Kesultanan Selim dan sepupunya Idris berbagi kekuasaan dengannya, kemudian beliau kembali ke emiratnya di Mekah hingga beliau wafat pada hari Asyura [tahun 990 menurut makna yang tampak dalam kitab tersebut, dan secara historis 992]; Al-Nur berkata: Saya tidak melihat di Mekah seorang Emir yang lebih fasih darinya, atau lebih terampil, atau lebih baik dalam berpidato, atau lebih baik dalam puisi, atau lebih abadi dalam prosa, atau lebih penyayang, atau kurang terkenal, sehingga beliau dibedakan oleh banyak kebajikan; dan pengawas dua masjid suci, Ibn al-Mawlawi, membacakan deskripsi tentangnya {kutip:shadharat-dhahab hlm. 424-425}."
