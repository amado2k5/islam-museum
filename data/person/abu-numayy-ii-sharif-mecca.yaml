summary:
  ar: "الأمير أبو نمي محمد بن بركات الحسني أمير مكة؛ قال في النور السافر: استمر أميراً بمكة سنين كثيرة؛ ولد سنة عشر وتسعمائة، وشركة لأبيه قبل موته ثم استقل بعده، وعُزل بعد عام من سلطنة سليم وشاركه ابن عمه إدريس ثم عاد إلى أمرته على مكة إلى أن توفي يوم عاشوراء [م سنة 990 على ظاهر الكتاب، وتاريخياً 992]؛ قال النور: ما رأيت بمكة أميراً أفصح منه ولا أمهر ولا أفضل فصاحة ولا أحسن نظماً ولا أبقى نثراً ولا أعطف ألباً ولا أدنى صيتاً، فامتاز بمحاسن كثيرة؛ وأنشد ناظر الحرمين ابن المولوي وصفاً منه {cite:shadharat-dhahab p. 424-425}."
  en: "Abu Numayy II Muhammad b. Barakat — sharif of Mecca, partner to his father then sole amir; briefly deposed after Selim's accession and shared with his cousin Idris before returning; al-Nur al-Safir praises him as Mecca's most eloquent and ablest amir; died 'Ashura (the book places it under 990; historically 992) {cite:shadharat-dhahab p. 424-425}."
