summary:
  ar: "الحافظ أبو محمد يحيى بن محمد بن صاعد الهاشمي البغدادي، راوي كتاب الزهد لابن المبارك عن الحسين المروزي، وصاحب «زيادات» فيه؛ وثّقه الدارقطني، ووُلد سنة 228 ومات في ذي القعدة سنة 318 كما يلخص الذهبي {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 100}."
  en: "The hadith master Abu Muhammad Yahya ibn Muhammad ibn Sa'id al-Hashimi al-Baghdadi, who transmitted Ibn al-Mubarak's Kitab al-Zuhd from al-Husayn al-Marwazi and added reports of his own to it; al-Daraqutni called him trustworthy; born 228, died in Dhu al-Qa'da 318, as summarised from al-Dhahabi {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 100}."
  ur: "حافظ ابو محمد یحییٰ بن محمد بن صاعد ہاشمی بغدادی، حسین مروزی سے ابن المبارک کی کتاب الزہد کے راوی اور اس میں «زیادات» کے صاحب؛ دارقطنی نے انہیں ثقہ کہا؛ ولادت 228، وفات ذی القعدہ 318، ذہبی کے خلاصے کے مطابق {cite:zuhd-ibn-mubarak-farid-1995-v1 p. 100}۔"
