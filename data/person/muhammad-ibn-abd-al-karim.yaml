summary:
  ar: "محمد بن عبد الكريم قائد الجيش بالمهدية في دولة الموحدين، شجاع مشهور عظمت نكايته في العرب حتى لم يبق منهم إلا من يخافه؛ تنازع مع الوزير أبي سعيد بن عمر اينتي في عيال بني عوف وأموالهم فقبض على والي المهدية وتغلب عليها وأطلقه على اثني عشر ألف دينار وحالف ابن غانية، فلما ولي محمد الناصر بن يعقوب وسيّر العساكر براً وبحراً قال: أنا على طاعة أمير المؤمنين محمد ولا أسلمها إلى أبي سعيد وإنما أسلمها إلى من يرسله أمير المؤمنين، فعاد إلى الطاعة {cite:kamil-ibn-al-athir p. 259-260}."
  en: "The Almohad army-commander at Mahdiyya — feared by every Arab of Ifriqiya — who rebelled over the Banu Awf captives, held the city against the vizier, allied with Ibn Ghaniya, then chose loyalty to the new caliph al-Nasir: 'I hand it only to whom the Commander of the Faithful sends' {cite:kamil-ibn-al-athir p. 259-260}."
