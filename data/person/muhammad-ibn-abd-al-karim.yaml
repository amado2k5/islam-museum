id: person/muhammad-ibn-abd-al-karim
class: person
label: { ar: "محمد بن عبد الكريم", en: "Muhammad ibn Abd al-Karim", es: "Muhammad ibn Abd al-Karim", fr: "Muhammad ibn Abd al-Karim", ur: "محمد بن عبد الکریم" }
summary:
  ar: "محمد بن عبد الكريم قائد الجيش بالمهدية في دولة الموحدين، شجاع مشهور عظمت نكايته في العرب حتى لم يبق منهم إلا من يخافه؛ تنازع مع الوزير أبي سعيد بن عمر اينتي في عيال بني عوف وأموالهم فقبض على والي المهدية وتغلب عليها وأطلقه على اثني عشر ألف دينار وحالف ابن غانية، فلما ولي محمد الناصر بن يعقوب وسيّر العساكر براً وبحراً قال: أنا على طاعة أمير المؤمنين محمد ولا أسلمها إلى أبي سعيد وإنما أسلمها إلى من يرسله أمير المؤمنين، فعاد إلى الطاعة {cite:kamil-ibn-al-athir p. 259-260}."
  en: "The Almohad army-commander at Mahdiyya — feared by every Arab of Ifriqiya — who rebelled over the Banu Awf captives, held the city against the vizier, allied with Ibn Ghaniya, then chose loyalty to the new caliph al-Nasir: 'I hand it only to whom the Commander of the Faithful sends' {cite:kamil-ibn-al-athir p. 259-260}."
  es: "El comandante del ejército almohade en Mahdiyya —temido por todos los árabes de Ifriqiya— que se rebeló por los cautivos de Banu Awf, mantuvo la ciudad contra el visir, se alió con Ibn Ghaniya y luego eligió la lealtad al nuevo califa al-Nasir: «Solo se la entrego a quien el Comandante de los Creyentes me envía» {cita:kamil-ibn-al-athir págs. 259-260}."
  fr: "Le commandant de l'armée almohade à Mahdiyya — craint par tous les Arabes d'Ifriqiya — qui se rebella à propos des captifs des Banu Awf, tint la ville contre le vizir, s'allia avec Ibn Ghaniya, puis choisit la loyauté envers le nouveau calife al-Nasir: « Je ne la remets qu'à celui que le Commandeur des Croyants envoie » {cite: kamil-ibn-al-athir p. 259-260}."
  ur: "مہدیہ میں الموحد آرمی کمانڈر - جس سے عفریقیہ کا ہر عرب خوفزدہ تھا - جس نے بنو عوف کے قیدیوں سے بغاوت کی، شہر کو وزیر کے خلاف تھام لیا، ابن ثنیہ کے ساتھ اتحاد کیا، پھر نئے خلیفہ الناصر کے ساتھ وفاداری کا انتخاب کیا: 'میں اسے صرف اسی کے حوالے کرتا ہوں جس کے پاس امیر المومنین علی الصبح'۔ 259-260}۔"
  tr: "Muhammed bin Abdülkerim, Almohad devletindeki Mahdist ordusunun komutanı, cesur ve ünlüydü; Araplara karşı öfkesi o kadar büyüktü ki sadece ondan korkanlar kalmıştı. Vezir Ebu Said bin Ömer ile Banu Avf'ın aileleri ve serveti konusunda tartıştı, bu yüzden Mehdisye valisini yakaladı, onu yendi, onu on iki bin dinara serbest bıraktı ve İbn Ghaniye ile ittifak kurdu. Muhammed el-Nasir bin Ya'qub'u atadığında ve birlikleri kara ve deniz yoluyla yönettiğinde, şöyle dedi: Ben Sadık Muhammed'in Komutanı'na itaat ederim ve bunu Ebu Seyid'e değil, Müminler Komutanı'nın gönderdiği kişiye teslim edeceğim. Sonra itaata geri döndü {atıf:kamil-ibn-al-athir s. 259-260}."
  id: "Muhammad ibn Abd al-Karim, komandan tentara Mahdis di negara Almohad, adalah pria pemberani dan terkenal yang kebenciannya terhadap orang Arab begitu besar sehingga hanya mereka yang takut padanya yang tersisa. Ia berselisih dengan wazir Abu Sa'id ibn Umar mengenai keluarga dan kekayaan Banu Awf, sehingga ia menangkap gubernur Mahdisya, mengalahkannya, membebaskannya dengan dua belas ribu dinar, dan bersekutu dengan Ibn Ghaniyah. Ketika Muhammad mengangkat al-Nasir ibn Ya'qub dan memimpin pasukan melalui darat dan laut, ia berkata: Aku taat kepada Panglima Muhammad yang Beriman dan tidak akan menyerahkannya kepada Abu Sa'id, melainkan kepada siapa pun yang dikirim oleh Panglima Orang Berimim. Ia kemudian kembali taat {cite:kamil-ibn-al-athir hlm. 259-260}."
