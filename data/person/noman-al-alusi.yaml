gender: male
summary:
  ar: "نعمان بن محمود بن عبد الله، أبو البركات خير الدين الآلوسي، واعظ فقيه باحث من الأسرة الآلوسية في العراق، ولد ببغداد وولي القضاء في بلاد منها الحلة، وزار مصر والآستانة، ولقب رئيس المدرسين، وتوفي ببغداد، صاحب «جلاء العينين في محاكمة الأحمدين»، 1252 إلى 1317 هـ {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 42}."
  en: "Nu'man ibn Mahmud ibn Abd Allah, Abu al-Barakat Khayr al-Din al-Alusi, a preacher, jurist and researcher of the Alusi family of Iraq, born in Baghdad, a judge in several lands including al-Hilla, who visited Egypt and Istanbul, bore the title head of the teachers and died in Baghdad; author of Jala' al-Aynayn fi Muhakamat al-Ahmadayn, 1252 to 1317 AH (1836 to 1899 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 42}."
  es: "Nu'man ibn Mahmud ibn Abd Allah, Abu al-Barakat Khayr al-Din al-Alusi, predicador, jurista e investigador de la familia Alusi de Irak, nacido en Bagdad, juez en varias tierras, incluyendo al-Hilla, que visitó Egipto y Estambul, ostentó el título de jefe de los maestros y murió en Bagdad; autor de Jala' al-Aynayn fi Muhakamat al-Ahmadayn, 1252 a 1317 AH (1836 a 1899 CE) {cite:alam-zirikli-dar-al-ilm-2002 vol. 8 p. 42}."
