label: { ar: "منصور بن جاونة بن الحارث العامري", en: "Mansur ibn Jamwana al-Amiri", es: "Mansur ibn Jamwana al-Amiri", fr: "Mansur ibn Jamwana al-Amiri", ur: "منصور بن جموانہ الامیری" }
summary:
  ar: "منصور بن جاونة بن الحارث العامري من قيس وإليه نُسب حصن منصور؛ عند البلاذري: تولى بناء الحصن ومرمّته وكان مقيماً به أيام مروان بجند كثيف من أهل الشام والجزيرة ليردّ العدو، ثم كان على أهل الرها حين امتنعوا في أول الدولة العباسية فحصرهم المنصور فهرب وأُمِن فظهر، وولّاه عبد الله بن علي شرطته يوم خلعه، فلما هرب عبد الله إلى البصرة استخفى فدُلّ عليه سنة 141 فقتله المنصور بالرقة — وقيل وجدت له كتب إلى الروم بغش الإسلام فضرب عنقه بالرقة."
  en: "Mansur ibn Jamwana ibn al-Harith al-Amiri of Qays, namesake of Hisn Mansur; in al-Baladhuri: he undertook the fortress's building and upkeep, stationed there in Marwan's days with a dense Syrian and Jaziran host to repel the enemy, then was set over al-Ruha's people when they withheld early in the Abbasid state — al-Mansur besieged them, he fled, was amaned and appeared; Abdallah ibn Ali made him chief of his police at his deposition, and when Abdallah fled to Basra he hid, was betrayed in year 141 and killed by al-Mansur at al-Raqqa — or, it is said, letters of his to the Romans betraying Islam were found, and his neck was struck at al-Raqqa."
  es: "Mansur ibn Jamwana ibn al-Harith al-Amiri de Qays, homónimo de Hisn Mansur; en al-Baladhuri: emprendió la construcción y el mantenimiento de la fortaleza, estacionado allí en los días de Marwan con un denso ejército sirio y jazirano para repeler al enemigo, luego fue puesto al mando del pueblo de al-Ruha cuando resistieron al principio del estado abasí; al-Mansur los asedió, huyó, fue amaned y apareció; Abdallah ibn Ali lo nombró jefe de su policía en su deposición, y cuando Abdallah huyó a Basora, se escondió, fue traicionado en el año 141 y asesinado por al-Mansur en al-Raqqa; o, según se dice, se encontraron cartas suyas a los romanos traicionando al Islam, y le cortaron el cuello en al-Raqqa."
  fr: "Mansur ibn Jamwana ibn al-Harith al-Amiri de Qays, homonyme de Hisn Mansur; selon al-Baladhuri: il entreprit la construction et l'entretien de la forteresse, y stationna à l'époque de Marwan avec une importante armée syrienne et jazirane pour repousser l'ennemi, puis fut placé à la tête du peuple d'al-Ruha lorsque celui-ci résista au début de l'État abbasside — al-Mansur les assiégea, il s'enfuit, fut amaned et réapparut; Abdallah ibn Ali le nomma chef de sa police lors de sa destitution, et lorsqu'Abdallah s'enfuit à Bassora, il se cacha, fut trahi en l'an 141 et tué par al-Mansur à al-Raqqa — ou, dit-on, des lettres de lui aux Romains trahissant l'islam furent trouvées, et son cou fut frappé à al-Raqqa."
  ur: "منصور بن جموانہ بن الحارث العمیری آف قیس، حسن منصور کا نام؛ البلادوری میں ہے: اس نے قلعہ کی تعمیر اور دیکھ بھال کا کام کیا، مروان کے دنوں میں ایک گھنے شامی اور جزیران کے لشکر کے ساتھ دشمن کو پسپا کرنے کے لیے وہاں تعینات کیا گیا، پھر الروح کے لوگوں پر مقرر کیا گیا جب وہ عباسی ریاست کے اوائل میں روکے ہوئے تھے - المنصور نے ان کا محاصرہ کیا، وہ بھاگ گیا، امن اور ظاہر ہوا؛ عبداللہ ابن علی نے اپنی معزولی پر اسے اپنی پولیس کا سربراہ بنایا، اور جب عبداللہ بھاگ کر بصرہ چلا گیا تو وہ چھپ گیا، 141 میں اسے دھوکہ دیا گیا اور المنصور نے الرقہ میں قتل کر دیا - یا کہا جاتا ہے کہ رومیوں کے نام اس کے اسلام سے غداری کرنے والے خطوط مل گئے، اور الرقہ میں اس کی گردن ماری گئی۔"
  tr: "Mansur bin Jawana ibn al-Harith al-Amiri Kays'tan, Mansur'un kalesi ona atfedilir; el-Baladhuri'ye göre: kalenin inşasından ve inşasından sorumluydu ve Marwan'ın döneminde Levant ve Cazira halkından büyük bir orduyla düşmanı püskürtmek için orada konuşlandırıldı. Abbasi devletinin başında reddedilince Edessa halkının başına geçti, bu yüzden el-Mansur onları kuşattı, kaçtı, güvence aldı ve orada göründü. Abdullah ibn Ali, tahttan indirildiği gün onu polis olarak atadı. Abdullah Basra'ya kaçtığında saklandı ve 141 Hicri'de hedef alındı, bu yüzden el-Mansur onu Rakka'da öldürdü—ve Romalılara İslam'ı kandırmakla suçlayan mektuplar bulduğu söylenir, bu yüzden Rakka'da başı kesildi."
  id: "Mansur ibn Jawana ibn al-Harith al-Amiri dari Qays, yang menjadi milik benteng Mansur; menurut al-Baladhuri: ia bertanggung jawab membangun dan membangun benteng, dan selama masa Marwan ia ditempatkan di sana dengan pasukan besar dari rakyat Levant dan Jazira untuk mengusir musuh. Ia kemudian mengambil alih pemerintahan rakyat Edessa ketika mereka menolak pada awal negara Abbasiyah, sehingga al-Mansur mengepung mereka, lalu ia melarikan diri, mengamankan, dan muncul di sana. Abdullah ibn Ali menunjuknya sebagai polisi pada hari pencopotannya. Ketika Abdullah melarikan diri ke Basra, ia bersembunyi dan menjadi sasaran pada tahun 141 H, sehingga al-Mansur membunuhnya di Raqqa—dan dikatakan ia menemukan surat kepada Romawi yang menuduhnya menipu Islam, sehingga ia dipenggal di Raqqa."
