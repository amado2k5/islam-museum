id: person/mansur-ibn-jamwana
class: person
label: { ar: "منصور بن جاونة بن الحارث العامري", en: "Mansur ibn Jamwana al-Amiri" }
summary:
  ar: "منصور بن جاونة بن الحارث العامري من قيس وإليه نُسب حصن منصور؛ عند البلاذري: تولى بناء الحصن ومرمّته وكان مقيماً به أيام مروان بجند كثيف من أهل الشام والجزيرة ليردّ العدو، ثم كان على أهل الرها حين امتنعوا في أول الدولة العباسية فحصرهم المنصور فهرب وأُمِن فظهر، وولّاه عبد الله بن علي شرطته يوم خلعه، فلما هرب عبد الله إلى البصرة استخفى فدُلّ عليه سنة 141 فقتله المنصور بالرقة — وقيل وجدت له كتب إلى الروم بغش الإسلام فضرب عنقه بالرقة."
  en: "Mansur ibn Jamwana ibn al-Harith al-Amiri of Qays, namesake of Hisn Mansur; in al-Baladhuri: he undertook the fortress's building and upkeep, stationed there in Marwan's days with a dense Syrian and Jaziran host to repel the enemy, then was set over al-Ruha's people when they withheld early in the Abbasid state — al-Mansur besieged them, he fled, was amaned and appeared; Abdallah ibn Ali made him chief of his police at his deposition, and when Abdallah fled to Basra he hid, was betrayed in year 141 and killed by al-Mansur at al-Raqqa — or, it is said, letters of his to the Romans betraying Islam were found, and his neck was struck at al-Raqqa."
