summary:
  ar: "الإمام السهيلي المالكي النحوي الحافظ صاحب الروض الأنف في شرح سيرة ابن هشام والإعلام بما أبهم القرآن من الأسماء والأعلام وكتاب نتائج النظر ومسألة رؤية الله في المنام ومسألة السر في عود الدجال ومسائل كثيرة، وله أبيات الفرج المشهورة قال ابن دحية أنشدنيها وقال ما يسأل الله بها أحد حاجة إلا أعطاه إياها، وكان مالكياً ضريراً أخذ القراءات عن جماعة وروى عن ابن العربي والكبار وبرع في العربية واللغات والأخبار والأثر وتصدر للإفادة وكان مشهوراً بالصلاح والورع والعفاف والقناعة بالكفاف، توفي سنة إحدى وثمانين وخمس مئة {cite:shadharat-dhahab p. 751-752}."
  en: "Al-Suhayli of Malaga, blind Maliki master — author of al-Rawd al-Unuf on Ibn Hisham's Sira and of the famous 'verses of relief' which Ibn Dihya recited and said none who asked God by them was refused {cite:shadharat-dhahab p. 751-752}."
