summary:
  ar: "الإمام السهيلي المالكي النحوي الحافظ صاحب الروض الأنف في شرح سيرة ابن هشام والإعلام بما أبهم القرآن من الأسماء والأعلام وكتاب نتائج النظر ومسألة رؤية الله في المنام ومسألة السر في عود الدجال ومسائل كثيرة، وله أبيات الفرج المشهورة قال ابن دحية أنشدنيها وقال ما يسأل الله بها أحد حاجة إلا أعطاه إياها، وكان مالكياً ضريراً أخذ القراءات عن جماعة وروى عن ابن العربي والكبار وبرع في العربية واللغات والأخبار والأثر وتصدر للإفادة وكان مشهوراً بالصلاح والورع والعفاف والقناعة بالكفاف، توفي سنة إحدى وثمانين وخمس مئة {cite:shadharat-dhahab p. 751-752}."
  en: "Al-Suhayli of Malaga, blind Maliki master — author of al-Rawd al-Unuf on Ibn Hisham's Sira and of the famous 'verses of relief' which Ibn Dihya recited and said none who asked God by them was refused {cite:shadharat-dhahab p. 751-752}."
  fr: "Al-Suhayli de Malaga, maître malikite aveugle – auteur d’al-Rawd al-Unuf sur la Sira d’Ibn Hisham et des célèbres « versets de soulagement » qu’Ibn Dihya récitait et a dit que personne qui demandait à Dieu par eux n’était refusé {cite:shadharat-dhahab p. 751-752}."
  es: "Al-Suhayli de Málaga, maestro malikí ciego, autor de al-Rawd al-Unuf sobre la Sira de Ibn Hisham y de los famosos \"versos de alivio\" que Ibn Dihya recitó y dijo que a nadie que le pidiera a Dios por medio de ellos se le negara {cita: shadharat-dhahab págs. 751-752}."
  ur: "ملاگا کے السحیلی، نابینا مالکی ماسٹر - ابن ہشام کی سیرت پر الرؤد الانوف کے مصنف اور مشہور 'آیات راحت' کے مصنف جو ابن دحیہ نے تلاوت کی اور کہا کہ ان کے ذریعہ خدا سے مانگنے والے کسی نے بھی انکار نہیں کیا {حوالہ: شرح ذہاب صفحہ 751-752}۔"
  tr: "İmam el-Suhaili el-Maliki, El-Rõvd el-Anf'ın dilbilgicisi ve ezberleyicisi, İbn Hişam'ın biyografisini, Kur'an'ın isimlerini, bilinen kişilerini, vizyon sonuçlarını kitabın, rüyalarda Allah'ı görme meselesini, Deccal'in sırrını ve daha birçok konuda gizlediğini açıklamakta yardımcı olmuştur. El-Faraj'ın ünlü ayetlerini yazmıştır: 'Bana oku' ve şöyle demiştir: Hiç kimse Allah'tan sadece O'nun kendisine vermesini istemez. Kör bir Malikiydi, bir gruptan okumalar almış, İbn Arabi ve el-Kâbar'dan rivayet etmiş, Arapça, diller, haber ve geleneklerde üstün başarı göstermiş ve bilgi sağlamada öncüydü. Doğruluğu, dindarlığı, iffetliliği ve yeterlilikten memnunluğuyla ünlüydü. 581 Hicri yılında öldü {alıntı: Shadharat-Dhahab, s. 751-752}."
  id: "Imam al-Suhaili al-Maliki, ahli tata bahasa dan penghafal Al-Rawd al-Anf dalam penjelasan biografi Ibn Hisham, serta pengetahuan tentang apa yang disembunyikan Al-Qur'an dalam nama-namanya, tokoh-tokoh yang dikenal, kitab hasil penglihatan, masalah melihat Tuhan dalam mimpi, masalah rahasia dalam tongkat Antikristus, dan banyak isu lainnya. Ia menulis ayat-ayat terkenal Al-Faraj, mengatakan: 'Bacakan kepada saya' dan berkata: Tidak ada yang meminta apa pun kepada Tuhan kecuali Dia memberikannya. Dia adalah seorang Maliki buta, menerima bacaan dari kelompok, dinarasikan dari Ibn al-Arabi dan al-Kabar, unggul dalam bahasa Arab, bahasa, laporan, dan tradisi, serta pelopor dalam memberikan informasi. Dia terkenal karena kebenaran, kesalehan, kesucian, dan kepuasan dengan cukup. Dia wafat pada tahun 581 H {cite:shadharat-dhahab, hlm. 751-752}."
