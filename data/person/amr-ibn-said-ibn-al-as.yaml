summary:
  ar: "صحابي من بني عبد شمس، هاجر إلى الحبشة مع امرأته فاطمة بنت صفوان وقدم في السفينتين، وقُتل بأجنادين في خلافة أبي بكر. وعند المسعودي دعا الناس إلى بيعته بدمشق وعبد الملك غائب بقرقيسيا فكر راجعاً فصالحه على العهد ثم أغلق عليه الحاجب الباب دون أصحابه وأمر أبا الزعيزعة فقتله وألقى رأسه إلى الناس فتفرقوا {cite:muruj-al-dhahab p. 95-97}"
  en: A Companion of Banu Abd Shams; he emigrated to Abyssinia with his wife Fatima bint Safwan, arrived in the two ships, and was killed at Ajnadayn in Abu Bakr's caliphate.
