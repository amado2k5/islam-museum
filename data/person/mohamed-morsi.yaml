summary:
  ar: "محمد مرسي (1951–2019)، مهندس وأستاذ جامعي وسياسي مصري من جماعة الإخوان المسلمين، ترأس حزب الحرية والعدالة ثم فاز بانتخابات الرئاسة سنة 2012 فكان أول رئيس مدني منتخب لمصر، وحكم سنة واحدة حتى عزله الجيش في يوليو 2013، فحُوكم وسُجن وتوفي أثناء جلسة محاكمة في القاهرة في 17 يونيو 2019."
  en: "Mohamed Morsi (1951–2019) was an Egyptian engineer, university professor and Muslim Brotherhood politician who chaired the Freedom and Justice Party and won the 2012 presidential election, becoming Egypt's first democratically elected civilian president. He ruled for one year until the military removed him in July 2013; he was tried and imprisoned, and died during a court session in Cairo on 17 June 2019."
  ur: "محمد مرسی (1951ء–2019ء) مصری انجینئر، استادِ جامعہ اور اخوان المسلمین کے سیاست دان تھے۔ وہ فریڈم اینڈ جسٹس پارٹی کے صدر بنے اور 2012ء کے صدارتی انتخاب میں کامیاب ہو کر مصر کے پہلے جمہوری طور پر منتخب سویلین صدر بنے۔ ایک سال حکومت کے بعد جولائی 2013ء میں فوج نے انہیں معزول کر دیا؛ ان پر مقدمات چلے، وہ قید رہے اور 17 جون 2019ء کو قاہرہ میں عدالتی سماعت کے دوران وفات پا گئے۔"
