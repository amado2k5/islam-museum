summary:
  ar: "محمد مرسي (1951–2019)، مهندس وأستاذ جامعي وسياسي مصري من جماعة الإخوان المسلمين، ترأس حزب الحرية والعدالة ثم فاز بانتخابات الرئاسة سنة 2012 فكان أول رئيس مدني منتخب لمصر، وحكم سنة واحدة حتى عزله الجيش في يوليو 2013، فحُوكم وسُجن وتوفي أثناء جلسة محاكمة في القاهرة في 17 يونيو 2019."
  en: "Mohamed Morsi (1951–2019) was an Egyptian engineer, university professor and Muslim Brotherhood politician who chaired the Freedom and Justice Party and won the 2012 presidential election, becoming Egypt's first democratically elected civilian president. He ruled for one year until the military removed him in July 2013; he was tried and imprisoned, and died during a court session in Cairo on 17 June 2019."
  ur: "محمد مرسی ⁦(1951ء–2019ء)⁩ مصری انجینئر، استادِ جامعہ اور اخوان المسلمین کے سیاست دان تھے۔ وہ فریڈم اینڈ جسٹس پارٹی کے صدر بنے اور 2012ء کے صدارتی انتخاب میں کامیاب ہو کر مصر کے پہلے جمہوری طور پر منتخب سویلین صدر بنے۔ ایک سال حکومت کے بعد جولائی 2013ء میں فوج نے انہیں معزول کر دیا؛ ان پر مقدمات چلے، وہ قید رہے اور 17 جون 2019ء کو قاہرہ میں عدالتی سماعت کے دوران وفات پا گئے۔"
  es: "Mohamed Morsi (1951-2019) fue un ingeniero egipcio, profesor universitario y político de los Hermanos Musulmanes que presidió el Partido Libertad y Justicia y ganó las elecciones presidenciales de 2012, convirtiéndose en el primer presidente civil elegido democráticamente de Egipto. Gobernó durante un año hasta que los militares lo depusieron en julio de 2013; fue juzgado y encarcelado, y murió durante una sesión judicial en El Cairo el 17 de junio de 2019."
  fr: "Mohamed Morsi (1951-2019) était un ingénieur, professeur d'université et homme politique égyptien issu des Frères musulmans. Président du Parti Liberté et Justice, il remporta l'élection présidentielle de 2012, devenant ainsi le premier président civil démocratiquement élu d'Égypte. Il gouverna pendant un an, jusqu'à son renversement par l'armée en juillet 2013. Jugé et emprisonné, il décéda le 17 juin 2019 lors d'une audience au Caire."
  tr: "Mohamed Morsi (1951–2019), Mısırlı bir mühendis, üniversite profesörü ve Müslüman Kardeşler'den siyasetçiydi. Özgürlük ve Adalet Partisi'ni yönetti ve ardından 2012 cumhurbaşkanlığı seçimlerini kazanarak Mısır'ın ilk seçilmiş sivil cumhurbaşkanı oldu. Bir yıl hüküm sürdü ve Temmuz 2013'te ordu tarafından görevden alındı. Yargılandı, hapsedildi ve 17 Haziran 2019'da Kahire'de bir duruşma sırasında hayatını kaybetti."
  id: "Mohamed Morsi (1951–2019) adalah seorang insinyur, profesor universitas, dan politisi Mesir dari Ikhwanul Muslimin. Ia memimpin Partai Kebebasan dan Keadilan dan kemudian memenangkan pemilihan presiden pada tahun 2012, menjadi presiden sipil terpilih pertama Mesir. Ia memerintah selama satu tahun hingga diberhentikan oleh militer pada Juli 2013. Ia diadili, dipenjara, dan meninggal dalam sidang persidangan di Kairo pada 17 Juni 2019."
