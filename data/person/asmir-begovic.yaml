summary:
  ar: "حارس مرمى بوسني، وُلد في تريبينيي سنة 1987 وهربت أسرته من حرب البوسنة إلى ألمانيا ثم كندا. بدأ مع بورتسموث وفرض نفسه مع ستوك سيتي — حيث سجل سنة 2013 هدفًا من منطقته دخل موسوعة غينيس كأطول هدف في كرة القدم — ثم لعب لتشيلسي وبورنموث وإيفرتون وكوينز بارك رينجرز وليستر سيتي. مثّل كندا في منتخبات الشباب ثم اختار البوسنة والهرسك، وساعدها على التأهل لكأس العالم 2014، أول بطولة كبرى في تاريخها."
  en: "Bosnian professional footballer (goalkeeper), born in Trebinje in 1987, whose family fled the Bosnian War to Germany and then Canada. He began at Portsmouth and established himself at Stoke City — where in November 2013 he scored from his own penalty area, a Guinness world record for the longest goal in football — then played for Chelsea, Bournemouth, Everton, Queens Park Rangers and Leicester City. He represented Canada at youth level before switching to Bosnia and Herzegovina, whom he helped qualify for the 2014 FIFA World Cup, their first major tournament."
  ur: "بوسنیائی پیشہ ور فٹبالر (گول کیپر)، 1987 میں تریبینیے میں پیدا ہوئے؛ ان کا خاندان بوسنیائی جنگ سے فرار ہو کر جرمنی اور پھر کینیڈا گیا۔ انہوں نے پورٹسماؤتھ سے آغاز کیا اور اسٹوک سٹی میں خود کو منوایا — جہاں نومبر 2013 میں انہوں نے اپنے ہی علاقے سے گول کیا جو فٹبال کا طویل ترین گول قرار پا کر گنیز ریکارڈ بنا — پھر چیلسی، بورن ماؤتھ، ایورٹن، کوئینز پارک رینجرز اور لیسٹر سٹی کے لیے کھیلے۔ نوجوانوں کی سطح پر کینیڈا کی نمائندگی کے بعد بوسنیا و ہرزیگووینا کو منتخب کیا اور اسے 2014 فیفا ورلڈ کپ کے لیے کوالیفائی کرنے میں مدد دی، جو اس کی پہلی بڑی ٹورنامنٹ تھی۔"
