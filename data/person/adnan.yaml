summary:
  en: "The ancestor at whom the Prophet’s lineage is said to stop: twenty-first in the chain of the prophetic genealogy in Raheeq’s reckoning, descendant of Qaydar ibn Ismail; when the Prophet reached Adnan in tracing his lineage he would stop and say the genealogists lie."
  ar: "الجدّ الذي يقف عنده النسب النبوي: الحادي والعشرون في سلسلة نسب النبي عند المباركفوري، من ولد قيدار بن إسماعيل؛ وورد أن النبي كان إذا انتسب فبلغ عدنان أمسك وقال «كذب النسّابون»."
