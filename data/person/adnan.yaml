summary:
  en: "The ancestor at whom the Prophet’s lineage is said to stop: twenty-first in the chain of the prophetic genealogy in Raheeq’s reckoning, descendant of Qaydar ibn Ismail; when the Prophet reached Adnan in tracing his lineage he would stop and say the genealogists lie."
  fr: "Ancêtre auquel la lignée du Prophète est dite s'arrêter : vingt et unième dans la chaîne généalogique prophétique selon le calcul du Raheeq, descendant de Qaydar ibn Ismail. Lorsque le Prophète atteignait Adnan en retraçant sa lignée, il s'arrêtait et disait que les généalogistes mentaient."
  ar: "الجدّ الذي يقف عنده النسب النبوي: الحادي والعشرون في سلسلة نسب النبي عند المباركفوري، من ولد قيدار بن إسماعيل؛ وورد أن النبي كان إذا انتسب فبلغ عدنان أمسك وقال «كذب النسّابون»."
  es: "El antepasado en quien se dice que termina el linaje del Profeta: vigésimo primero en la cadena de la genealogía profética según el cálculo de Raheeq, descendiente de Qaydar ibn Ismail; cuando el Profeta llegaba a Adnan al rastrear su linaje, se detenía y decía que los genealogistas mentían."
  ur: "وہ اجداد جس کے بارے میں نبی کا سلسلہ منقطع کہا جاتا ہے: رحیق کے حساب سے سلسلہ نبوت کے سلسلہ میں اکیسواں، قدیر ابن اسماعیل کی اولاد؛ جب نبی اپنے نسب کا پتہ لگاتے ہوئے عدنان کے پاس پہنچے تو وہ رک جاتے اور کہتے کہ نسب والے جھوٹ بولتے ہیں۔"
  tr: "Peygamberin soyunun sonlandığı dede: Mübarekfuri'ye göre, Kaydar ibn İsmail'in soyundan gelen Peygamberin soyunun yirmi birincisidir; ve rivayet edildiğine göre, Peygamber soy ağacını takip edip Adnan'a ulaştığında durur ve \"Soybilimciler yalan söylemişler\" derdi."
  id: "Kakek yang menjadi titik akhir garis keturunan Nabi: yang ke-21 dalam garis keturunan Nabi menurut Al-Mubarakfuri, dari keturunan Qaydar ibn Ismail; dan diriwayatkan bahwa ketika Nabi menelusuri garis keturunannya dan sampai pada Adnan, beliau akan berhenti dan berkata, “Para ahli silsilah telah berbohong.”"
