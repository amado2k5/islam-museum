label: { ar: "أمية بن أبي الصلت", en: "Umayya ibn Abi al-Salt" }
summary:
  ar: "أمية بن أبي الصلت الثقفي الشاعر، وقد ذكر غمدان جده أمية واسمه ربيعة وقيل هو أبو الصلت نفسه في مدحه سيف بن ذي يزن وقيل الممدوح معد يكرب بن سيف بقوله اشرب هنيئاً عليك التاج مرتفقاً برأس غمدان داراً منك محلالاً، وكان أبو أمية جاهلياً وهو القائل في أصحاب الفيل إن آيات ربنا بينات ما يماري بهن إلا كفور معقور غلب الفيل بالمغمس حتى ظل يحبو كأنه معقور {cite:muruj-al-dhahab p. 540}."
  en: "The Thaqafi poet — his grandfather (some say himself) having praised Sayf ibn Dhi Yazan beneath Ghumdan's crown — and Abu Umayya's famous lines on the Elephant's crippling at al-Mughammas {cite:muruj-al-dhahab p. 540}."
