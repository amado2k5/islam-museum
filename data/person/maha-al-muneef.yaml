summary:
  ar: "طبيبة سعودية في طب الأطفال والأمراض المعدية، وُلدت سنة 1960. أسست البرنامج الوطني لسلامة الأسرة في السعودية، ودافعت عن تشريعات مكافحة العنف الأسري وإساءة معاملة الأطفال، ومن مبادراتها شبكة حماية الطفل العربية."
  en: "Saudi pediatrician and infectious-disease specialist, born in 1960. She founded Saudi Arabia’s National Family Safety Program, championed legislation against domestic violence and child abuse, and helped build regional child-protection networks."
  ur: "سعودی ماہرِ اطفال اور متعدی امراض کی ماہر، 1960 میں پیدا ہوئیں۔ انہوں نے سعودی عرب کا قومی خاندانی تحفظ پروگرام قائم کیا، گھریلو تشدد اور بچوں سے بدسلوکی کے خلاف قانون سازی کی وکالت کی اور علاقائی تحفظِ طفل جالیکے بنانے میں حصہ لیا۔"
  es: "Pediatra saudí y especialista en enfermedades infecciosas, nacida en 1960. Fundó el Programa Nacional de Seguridad Familiar de Arabia Saudí, impulsó la legislación contra la violencia doméstica y el maltrato infantil, y ayudó a crear redes regionales de protección infantil."
  fr: "Pédiatre et spécialiste des maladies infectieuses saoudienne, née en 1960. Elle a fondé le Programme national de sécurité familiale d'Arabie saoudite, a défendu une législation contre la violence domestique et la maltraitance des enfants et a contribué à la mise en place de réseaux régionaux de protection de l'enfance."
  tr: "1960 doğumlu Suudi çocuk doktoru ve enfeksiyon hastalıkları uzmanı. Suudi Arabistan'da Ulusal Aile Güvenliği Programı'nı kurdu ve aile içi şiddet ve çocuk istismarıyla mücadele için yasalar için savunuculuk yaptı. Girişimleri arasında Arap Çocuk Koruma Ağı da bulunmaktadır."
  id: "Seorang dokter anak Saudi dan spesialis penyakit menular, lahir pada tahun 1960. Ia mendirikan Program Keselamatan Keluarga Nasional di Arab Saudi dan mengadvokasi legislasi untuk memerangi kekerasan dalam rumah tangga dan kekerasan anak. Salah satu inisiatifnya adalah Jaringan Perlindungan Anak Arab."
