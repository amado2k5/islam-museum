id: person/ibn-mandah-al-isfahani
class: person
label: { ar: "أبو عبد الله محمد بن إسحاق بن منده الحافظ الأصبهاني" }
summary:
  ar: "محمد بن إسحاق بن محمد بن يحيى بن منده أبو عبد الله الحافظ الأصبهاني، من بيت الحديث والحفظ، سمع من أصحاب أبي مسعود ويونس بن حبيب وأبي العباس المحبوبي، وسافر البلاد وكتب الكثير وصنف التاريخ والشيوخ. قال أبو العباس جعفر بن محمد بن المعتز الحافظ ما رأيت أحفظ من أبي عبد الله بن منده وسألته يوماً كم يكون سماع الشيخ فقال يكون خمسة آلاف. توفي بأصبهان في صفر سنة ست وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.233}."
  tr: "Muhammed ibn İshaq ibn Muhammed ibn Yahya ibn Mandah Ebu Abdullah el-Hafız el-İsfahani, hadis ve ezber evinden, Ebu Mes'ud'un sahabeleri, Yunus ibn Habib ve Ebu el-Abbas el-Mahbubi'den duydu. Ülkeye seyahat etti, çokça yazdı ve tarih ile alimler kaleme aldı. Ezberci Ebu el-Abbas Ca'fer ibn Muhammed ibn el-Mu'taz şöyle dedi: Ebu Abdullah ibn Mandah'tan daha ezberlenmiş birini görmedim. Bir gün ona şeyhin işitme süresinin ne kadar olacağını sordum, beş bin olacağını söyledi. Doksan altıncı yılda İsfahan'da Safar'da öldü {atıf: muntazam-ibn-al-jawzi J.7 s.233}."
  id: "Muhammad ibn Ishaq ibn Muhammad ibn Yahya ibn Mandah Abu Abdullah al-Hafiz al-Isfahani, dari rumah hadis dan hafalan, mendengar dari sahabat Abu Mas'ud, Yunus ibn Habib, dan Abu al-Abbas al-Mahbubi. Ia melakukan perjalanan ke tanah itu, menulis secara luas, dan menulis sejarah serta ulama. Abu al-Abbas Ja'far ibn Muhammad ibn al-Mu'tazz, sang penghafal, berkata: Saya belum pernah melihat siapa pun yang lebih hafal daripada Abu Abdullah ibn Mandah. Suatu hari saya bertanya kepadanya berapa banyak pendengaran sang sheikh, dan ia menjawab akan menjadi lima ribu. Ia meninggal di Isfahan, Safar pada tahun sembilan puluh enam {cite:muntazam-ibn-al-jawzi J.7 hlm.233}."
