summary:
  ar: "محمد بن إسحاق بن محمد بن يحيى بن منده أبو عبد الله الحافظ الأصبهاني، من بيت الحديث والحفظ، سمع من أصحاب أبي مسعود ويونس بن حبيب وأبي العباس المحبوبي، وسافر البلاد وكتب الكثير وصنف التاريخ والشيوخ. قال أبو العباس جعفر بن محمد بن المعتز الحافظ ما رأيت أحفظ من أبي عبد الله بن منده وسألته يوماً كم يكون سماع الشيخ فقال يكون خمسة آلاف. توفي بأصبهان في صفر سنة ست وتسعين {cite:muntazam-ibn-al-jawzi j.7 p.233}."
