summary:
  ar: "عالم وإمام كندي مصري، مترجم القرآن في سلسلة «القرآن الواضح» (2015). حفظ القرآن صغيرًا ونال إجازة رسمية في تلاوته برواية حفص، وحصل على الدكتوراه والماجستير والليسانس في الدراسات الإسلامية بالإنجليزية من كلية اللغات والترجمة بجامعة الأزهر، وحاضر في الأزهر منذ 2003 وفي جامعة كليمسون، وعمل مرشدًا دينيًا في جامعة بروك (2014–2016) وإمامًا في أمريكا الشمالية منذ 2007."
  en: "Canadian–Egyptian scholar and imam, translator of The Clear Quran series (2015). He memorised the Qur'an at a young age and holds a professional ijazah in the Hafs recitation; he took his PhD, MA and BA in Islamic Studies in English from Al-Azhar University's Faculty of Languages & Translation, lectured at Al-Azhar from 2003 and on Islam at Clemson University, served as Muslim chaplain at Brock University (2014–2016) and has been an imam in North America since 2007."
  ur: "کینیڈی مصری عالم و امام، «دی کلیئر قرآن» سلسلے (2015ء) کے مترجم۔ انہوں نے بچپن میں قرآن حفظ کیا اور روایتِ حفص میں باقاعدہ اجازہ حاصل کیا؛ الازہر یونیورسٹی کی فیکلٹی آف لینگویجز اینڈ ٹرانسلیشن سے انگریزی میں اسلامیات میں بی اے، ایم اے اور پی ایچ ڈی کی، 2003ء سے الازہر میں اور کلیمسن یونیورسٹی میں درس دیا، بروک یونیورسٹی میں مسلم چیپلین رہے (2014–2016ء) اور 2007ء سے شمالی امریکہ میں امام ہیں۔"
