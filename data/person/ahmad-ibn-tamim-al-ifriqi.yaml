summary:
  ar: "العنبري الإفريقي، يروي عن أنس بن عياض؛ توفي بعقصة سنة تسع وخمسين ومائتين، قال أبو سعيد بن يونس: يقال إن هذه المدينة لا تمطر أصلًا وإنما تجيئها الميرة من غيرها وفي أهلها جفاء عظيم {cite:muntazam-ibn-al-jawzi p. 106}."
  en: "An Ifriqi traditionist transmitting from Anas ibn 'Iyad; he died at 'Aqsa — Ibn Yunus notes its people say rain never falls there, that supplies come from abroad and its folk are hard — in 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  es: "Un tradicionalista ifriqi que transmite de Anas ibn 'Iyad; murió en 'Aqsa — Ibn Yunus señala que allí la gente dice que nunca llueve, que los suministros vienen del extranjero y que su gente es dura — en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  fr: "Un traditionniste ifriqi transmettant d'Anas ibn 'Iyad; il est mort à 'Aqsa — Ibn Yunus note que ses habitants disent qu'il ne pleut jamais là-bas, que les approvisionnements viennent de l'étranger et que ses habitants sont durs — en 259 {cite:muntazam-ibn-al-jawzi p. 106}."
  ur: "انس بن عیاض سے نقل کرنے والا ایک افریقی روایت کرنے والا؛ اس کی موت اقصیٰ میں ہوئی - ابن یونس نے نوٹ کیا کہ اس کے لوگ کہتے ہیں کہ وہاں بارش کبھی نہیں ہوتی، یہ سامان بیرون ملک سے آتا ہے اور اس کے لوگ مشکل ہیں - 259 میں 106}۔"
  tr: "Enberi el-Afriki, Enes ibn Ayadh'dan rivayet ederek; kendisi 259 yılında Aksa'da vefat etmiştir. Ebu Said ibn Yunus şöyle demiştir: Bu şehre hiç yağmur yağmadığı, erzakların başka yerlerden getirildiği ve halkının çok sert olduğu söylenir. {Kaynak: Muntazam ibn el-Cevzi, s. 106}"
  id: "Al-Anbari al-Afriqi, meriwayatkan dari Anas ibn Ayadh; beliau wafat di Aqsa pada tahun 259. Abu Saeed ibn Yunus berkata: Dikatakan bahwa kota ini sama sekali tidak mendapat hujan, melainkan rezeki datang dari tempat lain, dan penduduknya sangat kasar. {kutip:muntazam-ibn-al-jawzi hlm. 106}."
