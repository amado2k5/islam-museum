summary:
  ar: "محدث سوري معاصر، وُلد سنة 1940 بحلب، مقيم في المدينة المنورة. يربط علم الحديث بالفقه الحنفي والمقارن، ومن كتبه «أثر الحديث في اختلاف الأئمة الفقهاء» و«أدب الاختلاف في قضايا العلم والدين»، وله تحقيقات منها «مصنف ابن أبي شيبة»."
  en: "Contemporary Syrian hadith scholar, born in Aleppo in 1940 and residing in Madinah. He links hadith science with Hanafi and comparative fiqh, authoring Athar al-Hadith fi Ikhtilaf al-A’imma and Adab al-Ikhtilaf, with editions including Musannaf Ibn Abi Shayba."
  ur: "عصری شامی محدث، 1940 میں حلب میں پیدا ہوئے اور مدینہ منورہ میں مقیم۔ وہ علمِ حدیث کو حنفی و تقابلِ فقہ سے جوڑتے ہیں؛ کتب میں «اثر الحديث في اختلاف الأئمة الفقهاء» اور «أدب الاختلاف» شامل ہیں، نیز «مصنف ابن أبي شيبہ» کی تحقیق کی۔"
  es: "Erudito sirio contemporáneo especializado en hadices, nacido en Alepo en 1940 y residente en Medina. Vincula la ciencia del hadiz con la escuela hanafi y el fiqh comparativo, y es autor de Athar al-Hadith fi Ikhtilaf al-A'imma y Adab al-Ikhtilaf, con ediciones que incluyen Musannaf Ibn Abi Shayba."
  fr: "Érudit syrien contemporain du hadith, né à Alep en 1940 et résidant à Médine, il établit un lien entre la science du hadith, l'école hanafite et le fiqh comparé. Il est l'auteur d'Athar al-Hadith fi Ikhtilaf al-A'imma et d'Adab al-Ikhtilaf, dont certaines éditions incluent Musannaf Ibn Abi Shayba."
