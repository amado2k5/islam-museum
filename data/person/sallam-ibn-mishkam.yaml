summary:
  ar: "سلام بن مشكم في السيرة من أحبار يهود بني النضير وأغنيائهم: كان ممن يجالس النبي ويسأله، وخيف عليه ليلاً من بعض قومه فقُتل؛ يذكر في أخبار بني النضير وفي قصة عبد الله بن سلام الذي أسلم وكان من حزبه {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "Sallam ibn Mishkam in the Sira is one of the rabbis and wealthy men of Banu al-Nadir: he used to sit with the Prophet and question him; his own people killed him by night over it. He is remembered in the accounts of Banu al-Nadir and in the story of 'Abdallah ibn Salam, who was of his circle and became Muslim {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "سلام بن مشکم سیرت میں بنو نضیر کے یہودی علماء اور مالداروں میں سے ہے: وہ نبی کے پاس بیٹھتا اور سوال کرتا تھا؛ اسی پر اس کے اپنے قوم نے رات میں اسے قتل کر دیا؛ وہ بنو نضیر کے واقعات اور عبداللہ بن سلام — جو اسی حلقے کا تھا اور مسلمان ہوا — کے قصے میں ذکر ہوتا ہے۔"
  es: "Sallam ibn Mishkam, mencionado en la Sira, es uno de los rabinos y hombres ricos de Banu al-Nadir: solía sentarse con el Profeta y cuestionarlo; su propia gente lo asesinó por ello durante la noche. Se le recuerda en los relatos de Banu al-Nadir y en la historia de Abdallah ibn Salam, quien pertenecía a su círculo y se convirtió al Islam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  fr: "Sallam ibn Mishkam, mentionné dans la Sira, était un rabbin et un homme riche de la tribu des Banu al-Nadir. Il avait coutume de s'asseoir avec le Prophète et de l'interroger; ses propres hommes l'assassinèrent de nuit pour cela. Son nom est relaté dans les récits des Banu al-Nadir et dans l'histoire d'Abdallah ibn Salam, membre de son entourage et converti à l'islam."
  tr: "Biyografide Salam ibn Muşkam, Banu Nadir'in hahamlarından ve zengin Yahudilerinden biriydi: Peygamber'in yanında oturup ona soranlar arasındaydı ve geceleri bazı halkı onun için korkup öldürüldü; bu, Banu Nadir'in anlatımlarında ve İslam'ı benimseyip onun tarafında olan Abdullah ibn Selam'ın hikayesinde (atı:ibn-hisham-sira} {cite:mubarakpuri-raheeq} (cite:mubarakpuri-raheeq} olarak anılmaktadır."
  id: "Salam ibn Mushkam, dalam biografi, adalah salah satu rabi dan Yahudi kaya Banu Nadir: Ia termasuk di antara mereka yang duduk bersama Nabi dan bertanya kepadanya, dan pada malam hari beberapa bangsanya takut kepadanya dan dibunuh; hal ini disebutkan dalam kisah Banu Nadir dan dalam kisah Abdullah ibn Salam yang memeluk Islam dan menjadi bagian dari rombongannya {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
