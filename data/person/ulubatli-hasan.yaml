summary:
  ar: "أولوباطلي حسن ⁦(توفي 29 مايو 1453)⁩، حامل راية السلطان محمد الثاني الذي رفع أول علم عثماني على أسوار القسطنطينية يوم الفتح فقُتل هناك. ظلّت واقعيته موضع جدل طويل — إذ رأى بعض المؤرخين أن قصته إضافة متأخرة إلى سيرة سفرانتزيس — حتى نشر المؤرخ حاقان يلماز وثائق جديدة: وقفية مؤرخة 828هـ/1425 تصفه بأنه «ديكُ علم الإسلام»، وقبره المكتشف بإسطنبول، ومنمنمة معاصرة (1460). وخلصت أبحاثه إلى أنه لم يكن فتى في الخامسة والعشرين كما تصوّره الرواية الشعبية، بل سكبانباشي مجرَّب مولود نحو 1390."
  en: "Ulubatlı Hasan (died 29 May 1453), Sultan Mehmed II's standard-bearer, who raised the first Ottoman banner on the walls of Constantinople on the day of the conquest and was killed there. His very existence was long debated — some historians held his story a later expansion of Sphrantzes' chronicle — until the historian Hakan Yılmaz published new documents: a waqf deed of 828/1425 styling him 'planter of the banner of Islam', his discovered grave in Istanbul, and a contemporary miniature of 1460. Yılmaz's research concludes he was no twenty-five-year-old youth, as the popular account imagines, but an experienced sekbanbaşı born about 1390."
  ur: "اولوباطلی حسن ⁦(وفات 29 مئی 1453ء)⁩، سلطان محمد ثانی کے علم بردار، جنھوں نے فتح کے روز قسطنطنیہ کی فصیلوں پر پہلا عثمانی پرچم لہرایا اور وہیں شہید ہوئے۔ ان کے وجود پر طویل عرصہ بحث رہی — بعض مؤرخین ان کی داستان کو سفرانتزس کی تاریخ میں بعد کا اضافہ سمجھتے تھے — حتیٰ کہ مؤرخ حاقان یلماز نے نئی دستاویزات شائع کیں: 828ھ/1425ء کا ایک وقف نامہ جو انھیں «اسلام کے علم کا نصب کرنے والا» کہتا ہے، استنبول میں دریافت شدہ ان کی قبر، اور 1460ء کی ایک معاصر منمنمہ۔ یلماز کی تحقیق کے مطابق وہ عوامی روایت کے پچیس سالہ نوجوان نہیں بلکہ تقریباً 1390ء میں پیدا ہونے والے تجربہ کار سکبان باشی تھے۔"
  es: "Ulubatlı Hasan (fallecido el 29 de mayo de 1453), portaestandarte del sultán Mehmed II, izó el primer estandarte otomano en las murallas de Constantinopla el día de la conquista y murió allí. Su existencia fue objeto de debate durante mucho tiempo —algunos historiadores consideraban su relato una ampliación posterior de la crónica de Sphrantzes— hasta que el historiador Hakan Yılmaz publicó nuevos documentos: un acta de waqf de 828/1425 que lo designaba como «plantador del estandarte del Islam», su tumba descubierta en Estambul y una miniatura contemporánea de 1460. La investigación de Yılmaz concluye que no se trataba de un joven de veinticinco años, como se cree popularmente, sino de un experimentado sekbanbaşı nacido alrededor de 1390."
  fr: "Ulubatlı Hasan (mort le 29 mai 1453), porte-étendard du sultan Mehmed II, hissa le premier étendard ottoman sur les remparts de Constantinople le jour de la conquête et y trouva la mort. Son existence même fut longtemps sujette à controverse – certains historiens y voyant un ajout ultérieur à la chronique de Sphrantzes – jusqu'à la publication par l'historien Hakan Yılmaz de nouveaux documents: un acte de waqf de 828/1425 le désignant comme « planteur de l'étendard de l'Islam », sa tombe découverte à Istanbul et une miniature contemporaine de 1460. Les recherches de Yılmaz concluent qu'il n'était pas un jeune homme de vingt-cinq ans, comme le suggère la version populaire, mais un sekbanbaşı expérimenté, né vers 1390."
  tr: "Sultan II. Mehmed'in bayraktaşıyıcısı Ulubatli Hasan (29 Mayıs 1453'te öldü), fetih günü İstanbul surlarına ilk Osmanlı bayrağını dikti ve orada öldürüldü. Gerçekliği uzun tartışmalara konu oldu—bazı tarihçiler onun hikayesini Sfarantzis'in biyografisine geç eklenen bir unsur olarak gördü—ta ki tarihçi Hakan Yılmaz yeni belgeler yayımlayana kadar: 828 Hicri/1425 tarihli bir vakıf (vakıf), onu 'İslami bilginin horozu' olarak tanımlayan bir vakıf, İstanbul'da keşfettiği türbe ve çağdaş bir minyatür (1460). Araştırmaları, onun popüler efsanede tasvir edilen yirmi beş yaşında bir çocuk değil, yaklaşık 1390 doğumlu deneyimli bir Skpanbaşi olduğunu ortaya koydu."
  id: "Ulubatli Hasan (meninggal 29 Mei 1453), pembawa panji Sultan Mehmed II, yang mengibarkan bendera Ottoman pertama di tembok Konstantinopel pada hari penaklukan dan dibunuh di sana. Keasliannya tetap menjadi bahan perdebatan panjang—beberapa sejarawan melihat kisahnya sebagai tambahan akhir dalam biografi Sfarantzis—hingga sejarawan Hakan Yılmaz menerbitkan dokumen baru: sebuah wakaf (wakaf) bertanggal 828 H/1425 yang menggambarkannya sebagai 'ayam jantan pengetahuan Islam,' makam yang ditemukan di Istanbul, dan miniatur kontemporer (1460). Penelitiannya menyimpulkan bahwa ia bukan anak laki-laki berusia dua puluh lima tahun seperti yang digambarkan dalam legenda populer, melainkan seorang Skpanbashi berpengalaman, lahir sekitar tahun 1390."

