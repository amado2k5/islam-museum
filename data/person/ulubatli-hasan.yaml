born:
  edtf: "1428~"
  calendar: gregorian
  precision: year
  status: debated
  derived: false
  note: "The traditional account makes him twenty-five years old at the conquest, hence born about 1428 — the value in the English article, in Wikidata and in the founder's queue. The archival research of Hakan Yılmaz, on which both articles otherwise rest, displaces that image as a popular fiction: on his findings Hasan was the son of an Abdullah, born about 1390, an official palace standard-bearer since the reigns of Çelebi Mehmed and Murad II, and holder of a waqf deed drawn up for him by Molla Fenari in 828/1425 styling him 'planter of the banner of Islam'. The two datings cannot both stand; the traditional one is followed, with status debated, and Yılmaz's is preserved here. No Hijri year is recorded: about 1428 spans 831-832 AH and about 1390 spans 792-793 AH, and no source pairs a single year. He was born at Ulubat near Karacabey in Bursa province; Ulubat has no place entity in the museum, so no born_in edge is written."
  sources: [source/wikipedia-ulubatli-hasan-en, source/wikipedia-ulubatli-hasan-tr, source/wikidata-ulubatli-hasan]

died:
  edtf: "1453-05-29"
  calendar: gregorian
  precision: day
  status: debated
  derived: false
  note: "The tradition carried by the Chronicon Maius ascribed to George Sphrantzes has him climb the Topkapı (St Romanos) tower on the morning of 29 May 1453, plant the banner, and die defending it until his surviving companions reached him. The date itself is shared by all accounts, but the man's historicity was long debated: some Greek and Romanian historians argued that the Chronicon Maius was expanded by Makarios Melissenos and that Hasan is absent from Sphrantzes' original short chronicle. Yılmaz answers from the long chronicle's own colophon — Sphrantzes' statement that he expanded it with his own hand on 29 March 1478 — and adds the documentary evidence: the 1425 waqf deed, the grave discovered in the Fatih district, and a miniature of 1460, drawn from the accounts of two men who took part in the conquest, showing an elderly bearded sekbanbaşı climbing the Romanos tower. The Turkish article concludes that on this new evidence he was a real person. The death carries debated status because the man himself was doubted, and both sides of the debate are preserved here."
  sources: [source/wikipedia-ulubatli-hasan-en, source/wikipedia-ulubatli-hasan-tr, source/wikidata-ulubatli-hasan]

