summary:
  ar: "أولوباطلي حسن (توفي 29 مايو 1453)، حامل راية السلطان محمد الثاني الذي رفع أول علم عثماني على أسوار القسطنطينية يوم الفتح فقُتل هناك. ظلّت واقعيته موضع جدل طويل — إذ رأى بعض المؤرخين أن قصته إضافة متأخرة إلى سيرة سفرانتزيس — حتى نشر المؤرخ حاقان يلماز وثائق جديدة: وقفية مؤرخة 828هـ/1425 تصفه بأنه «ديكُ علم الإسلام»، وقبره المكتشف بإسطنبول، ومنمنمة معاصرة (1460). وخلصت أبحاثه إلى أنه لم يكن فتى في الخامسة والعشرين كما تصوّره الرواية الشعبية، بل سكبانباشي مجرَّب مولود نحو 1390."
  en: "Ulubatlı Hasan (died 29 May 1453), Sultan Mehmed II's standard-bearer, who raised the first Ottoman banner on the walls of Constantinople on the day of the conquest and was killed there. His very existence was long debated — some historians held his story a later expansion of Sphrantzes' chronicle — until the historian Hakan Yılmaz published new documents: a waqf deed of 828/1425 styling him 'planter of the banner of Islam', his discovered grave in Istanbul, and a contemporary miniature of 1460. Yılmaz's research concludes he was no twenty-five-year-old youth, as the popular account imagines, but an experienced sekbanbaşı born about 1390."
  ur: "اولوباطلی حسن (وفات 29 مئی 1453ء)، سلطان محمد ثانی کے علم بردار، جنھوں نے فتح کے روز قسطنطنیہ کی فصیلوں پر پہلا عثمانی پرچم لہرایا اور وہیں شہید ہوئے۔ ان کے وجود پر طویل عرصہ بحث رہی — بعض مؤرخین ان کی داستان کو سفرانتزس کی تاریخ میں بعد کا اضافہ سمجھتے تھے — حتیٰ کہ مؤرخ حاقان یلماز نے نئی دستاویزات شائع کیں: 828ھ/1425ء کا ایک وقف نامہ جو انھیں «اسلام کے علم کا نصب کرنے والا» کہتا ہے، استنبول میں دریافت شدہ ان کی قبر، اور 1460ء کی ایک معاصر منمنمہ۔ یلماز کی تحقیق کے مطابق وہ عوامی روایت کے پچیس سالہ نوجوان نہیں بلکہ تقریباً 1390ء میں پیدا ہونے والے تجربہ کار سکبان باشی تھے۔"

