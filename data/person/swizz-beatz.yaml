summary:
  ar: "منتج تسجيلات ومغنّي راب أمريكي، اسمه الأصلي قاسم داود دين، وُلد في حيّ برونكس بنيويورك في 13 سبتمبر 1978. برز عبر شركة عائلته «راف رايدرز» وإنتاجه لفنّانها دي إم إكس، وأسس سنة 2001 شركة «فول سيرفيس»، وأنتج أعمالًا لبيونسيه وكانييه ويست وغيرهما، وفاز بجائزة غرامي، وشارك سنة 2020 في تأسيس سلسلة «فيرزوز» مع تيمبالاند."
  en: "American record producer and rapper, born Kasseem Daoud Dean in the Bronx, New York City, on 13 September 1978. He rose through his family's Ruff Ryders label and his production for its artist DMX, founded Full Surface Records in 2001, produced hits for Beyoncé, Kanye West and many others, won a Grammy Award, and co-created the Verzuz webcast series with Timbaland in 2020."
  ur: "امریکی ریکارڈ پروڈیوسر و ریپر، اصل نام قاسم داؤد ڈین، جو 13 ستمبر 1978 کو نیویارک کے برونکس میں پیدا ہوئے۔ وہ اپنے خاندان کے لیبل «رف رائیڈرز» اور اس کے فنکار ڈی ایم ایکس کے لیے اپنی پروڈکشن سے ابھرے، 2001 میں «فل سرفیس» لیبل قائم کیا، بیونسے اور کانیے ویسٹ سمیت کئی فنکاروں کے مقبول گیت پروڈیوس کیے، گریمی ایوارڈ جیتا، اور 2020 میں ٹمبالینڈ کے ساتھ «ورزوز» سلسلے کی مشترکہ بنیاد رکھی۔"
