summary:
  ar: "مؤرخ إسرائيلي (وُلد في حيفا سنة 1954)، من أبرز «المؤرخين الجدد». أستاذ في جامعة إكستر حيث يدير المركز الأوروبي للدراسات الفلسطينية؛ ويذهب كتابه «التطهير العرقي في فلسطين» (2006) إلى أن خروج الفلسطينيين سنة 1948 كان طرداً مخططاً له."
  en: "Israeli historian (born 1954 in Haifa), a leading figure among the New Historians. He is professor at the University of Exeter, where he directs the European Centre for Palestine Studies; his The Ethnic Cleansing of Palestine (2006) argues that the 1948 Palestinian exodus was a planned expulsion."
  ur: "اسرائیلی مؤرخ (پیدائش 1954ء، حیفا)، «نئے مؤرخین» کی سرکردہ شخصیت۔ یونیورسٹی آف ایکسٹر میں پروفیسر اور یورپی مرکزِ مطالعۂ فلسطین کے سربراہ؛ ان کی کتاب «فلسطین کی نسلی تطہیر» (2006ء) کے مطابق 1948ء میں فلسطینیوں کا انخلا ایک منصوبہ بند بے دخلی تھی۔"
