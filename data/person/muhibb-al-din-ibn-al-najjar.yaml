summary:
  ar: "محمد بن محمود بن الحسن بن هبة الله بن محاسن، أبو عبد الله، محب الدين ابن النجار، مؤرخ حافظ للحديث من أهل بغداد، رحل سبعا وعشرين سنة، وله ذيل تاريخ بغداد والدرة الثمينة في أخبار المدينة؛ توفي سنة 643 هـ."
  en: "Muhammad ibn Mahmud ibn al-Hasan ibn Hibat Allah ibn Mahasin, Abu Abd Allah, Muhibb al-Din Ibn al-Najjar, a hafiz of hadith and historian of Baghdad who travelled for twenty-seven years; author of the continuation of the History of Baghdad and al-Durra al-thamina fi akhbar al-Madina; died 643 AH (1245)."
