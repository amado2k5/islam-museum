summary:
  ar: "محمد بن محمود بن الحسن بن هبة الله بن محاسن، أبو عبد الله، محب الدين ابن النجار، مؤرخ حافظ للحديث من أهل بغداد، رحل سبعا وعشرين سنة، وله ذيل تاريخ بغداد والدرة الثمينة في أخبار المدينة؛ توفي سنة 643 هـ."
  en: "Muhammad ibn Mahmud ibn al-Hasan ibn Hibat Allah ibn Mahasin, Abu Abd Allah, Muhibb al-Din Ibn al-Najjar, a hafiz of hadith and historian of Baghdad who travelled for twenty-seven years; author of the continuation of the History of Baghdad and al-Durra al-thamina fi akhbar al-Madina; died 643 AH (1245)."
  es: "Muhammad ibn Mahmud ibn al-Hasan ibn Hibat Allah ibn Mahasin, Abu Abd Allah, Muhibb al-Din Ibn al-Najjar, un hafiz de hadices e historiador de Bagdad que viajó durante veintisiete años; autor de la continuación de la Historia de Bagdad y al-Durra al-thamina fi akhbar al-Madina; murió en 643 d. H. (1245)."
  fr: "Muhammad ibn Mahmud ibn al-Hasan ibn Hibat Allah ibn Mahasin, Abu Abd Allah, Muhibb al-Din Ibn al-Najjar, hafiz de hadith et historien de Bagdad qui a voyagé pendant vingt-sept ans; auteur de la suite de l'Histoire de Bagdad et d'al-Durra al-thamina fi akhbar al-Madina; décédé en 643 AH (1245)."
  ur: "محمد بن محمود بن الحسن بن ہیبت اللہ ابن محسن، ابو عبد اللہ، محب الدین ابن النجار، حدیث کے حافظ اور بغداد کے مورخ جنہوں نے ستائیس سال کا سفر کیا۔ تاریخ بغداد اور الدرۃ الثمینہ فی اخبار المدینہ کے تسلسل کے مصنف؛ وفات 643ھ (1245)۔"
