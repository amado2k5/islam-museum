summary:
  ar: "مهاجم كرة قدم جزائري (وُلد سنة 1988 في مدينة الجزائر)، وهو الهداف التاريخي لمنتخب الجزائر بأهدافه الستة والأربعين في أكثر من مئة مباراة دولية. لعب لسبورتينغ لشبونة وليستر سيتي وأندية أخرى في أوروبا، وفاز مع الجزائر بكأس الأمم الأفريقية 2019."
  en: "Algerian football striker (born 1988 in Algiers), Algeria's all-time top scorer with 46 goals in over a hundred internationals. He played for Sporting CP, Leicester City and other European clubs and won the 2019 Africa Cup of Nations with Algeria."
