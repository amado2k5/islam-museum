summary:
  ar: "حاجب المنصور، روى عن نفسه أن الربيع أتاه بالخريطة بخروج محمد بن عبد الله والمنصور نائم بدير على شاطئ دجلة في الموضع الذي يسمى اليوم الخلد بمدينة السلام، فسمع المنصور كلامه فنهض يفتح الباب بيده وقرأ الكتب ثم أمر بإسراج الخيل والتقدم {cite:muruj-al-dhahab p. 286}."
  en: "Al-Mansur's doorman and the eyewitness of the midnight kharita — the caliph himself rose to open the door {cite:muruj-al-dhahab p. 286}."
  es: "El portero de Al-Mansur y testigo presencial de la kharita de medianoche: el propio califa se levantó para abrir la puerta {cite:muruj-al-dhahab p. 286}."
  fr: "Le portier d'Al-Mansur et le témoin oculaire de la kharita de minuit — le calife lui-même se leva pour ouvrir la porte {cite:muruj-al-dhahab p. 286}."
  ur: "المنصور کا دربان اور آدھی رات کی خریت کا چشم دید گواہ - خلیفہ خود دروازہ کھولنے کے لیے کھڑا ہوا 286}۔"
  tr: "Hacib-Mansur, baharın kendisine Muhammed bin Abdullah'ın haritasıyla geldiğini, el-Mansur'un ise bugün Barış Şehri'nde El-Halid olarak bilinen yerde Dicle kıyısındaki bir manastırda uyurken getirdiğini anlattı. El-Mansur sözlerini duydu, kalktı, kapıyı eliyle açtı, kitapları okudu ve sonra atların eyerlenip ilerlemesini emretti {atıf:Muruj-al-Dhahab, s. 286}."
  id: "Hajib al-Mansur menceritakan bahwa musim semi datang kepadanya dengan peta Muhammad ibn Abdullah saat al-Mansur tidur di sebuah biara di tepi Sungai Tigris di tempat yang sekarang disebut Al-Khalid di Kota Damai. Al-Mansur mendengar kata-katanya, berdiri, membuka pintu dengan tangannya, membaca buku-buku, lalu memerintahkan kuda-kuda ditunggangi dan maju {cite:muruj-al-dhahab, hlm. 286}."
