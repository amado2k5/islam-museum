summary:
  ar: "أبو الوليد العباس بن المؤمل الصوفي، امتُحن فصبر في محنته فوُفّي، راحته في البكاء والأحزان، ومفزعه إلى المقابر. روى عن زيد الخبري أنه حُبس زمنًا طويلًا بعد أن أمر هارون بالمعروف، ثم رأى في منامه من يقول له إن للمحزونين فرحة يوم القيامة تستوعب أول حزنهم."
  en: "Abu al-Walid al-Abbas ibn al-Mu'ammal al-Sufi, who endured his trial and was given his due; his rest was in weeping and sorrow and his refuge in the graves. He relates, as Zayd al-Khabari reports, that he was imprisoned for a long time after he enjoined good upon Harun; in a dream he was told that the grieving will have a joy on the Day of Resurrection that fills the first of their grief; he was released after that, and said that grief is for the good of the hereafter, not the world."
  ur: "ابو الولید عباس بن مؤمل صوفی آزمائش میں ثابت قدم رہے اور اپنا حق پورا ادا کیا۔ ان کا آرام رونے اور غم میں تھا اور ان کی پناہ قبریں تھیں۔ زید خبری کی روایت کے مطابق ہارون کو نیکی کا حکم دینے کے بعد وہ زمانہ دراز تک قید رہے؛ خواب میں ایک آنے والے نے کہا کہ غم زدوں کے لیے قیامت کے دن ایک خوشی ہوگی جو ان کے پہلے غم کو سمیٹ لے گی۔ اس کے بعد وہ رہا ہوئے اور کہا کہ غم آخرت کی بھلائی کے لیے ہے، دنیا کے لیے نہیں۔"
