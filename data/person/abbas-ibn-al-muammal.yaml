summary:
  ar: "أبو الوليد العباس بن المؤمل الصوفي، امتُحن فصبر في محنته فوُفّي، راحته في البكاء والأحزان، ومفزعه إلى المقابر. روى عن زيد الخبري أنه حُبس زمنًا طويلًا بعد أن أمر هارون بالمعروف، ثم رأى في منامه من يقول له إن للمحزونين فرحة يوم القيامة تستوعب أول حزنهم."
  en: "Abu al-Walid al-Abbas ibn al-Mu'ammal al-Sufi, who endured his trial and was given his due; his rest was in weeping and sorrow and his refuge in the graves. He relates, as Zayd al-Khabari reports, that he was imprisoned for a long time after he enjoined good upon Harun; in a dream he was told that the grieving will have a joy on the Day of Resurrection that fills the first of their grief; he was released after that, and said that grief is for the good of the hereafter, not the world."
  fr: "Abu al-Walid al-Abbas ibn al-Mu'ammal al-Sufi, qui endura son épreuve et reçut son dû ; son repos était dans les larmes et l'affliction, et son refuge dans les tombes. Il rapporte, selon Zayd al-Khabari, qu'il fut longtemps emprisonné après avoir exhorté Harun au bien ; en rêve, on lui dit que les affligés auront au Jour de la Résurrection une joie qui comblera la première de leurs peines ; il fut libéré ensuite, et dit que l'affliction est pour le bien de l'au-delà, non pour ce monde."
  ur: "ابو الولید عباس بن مؤمل صوفی آزمائش میں ثابت قدم رہے اور اپنا حق پورا ادا کیا۔ ان کا آرام رونے اور غم میں تھا اور ان کی پناہ قبریں تھیں۔ زید خبری کی روایت کے مطابق ہارون کو نیکی کا حکم دینے کے بعد وہ زمانہ دراز تک قید رہے؛ خواب میں ایک آنے والے نے کہا کہ غم زدوں کے لیے قیامت کے دن ایک خوشی ہوگی جو ان کے پہلے غم کو سمیٹ لے گی۔ اس کے بعد وہ رہا ہوئے اور کہا کہ غم آخرت کی بھلائی کے لیے ہے، دنیا کے لیے نہیں۔"
  es: "Abu al-Walid al-Abbas ibn al-Mu'ammal al-Sufi, quien soportó su prueba y recibió lo que le correspondía, encontró descanso en el llanto y el dolor, y refugio en las tumbas. Relata, según informa Zayd al-Khabari, que fue encarcelado durante mucho tiempo después de haber encomendado el bien a Harún; en un sueño se le reveló que los afligidos experimentarían una alegría en el Día de la Resurrección que aliviaría el dolor inicial; fue liberado después de eso y afirmó que el dolor es para el bien del más allá, no para el de este mundo."
  tr: "Ebu el-Velid el-Abbas ibn el-Mu'ammal el-Sufi, sınandı ve çektiği sıkıntılara sabırla katlandı; tesellisi ağlamak ve kederdeydi, sığınağı ise mezarlıklar oldu. Zeyd el-Habiri'den rivayet edildiğine göre, Harun el-Raşid'in doğru olanı emretmesinden sonra uzun süre hapsedildi; sonra rüyasında birinin ona, kederlilerin kıyamet gününde ilk kederlerini örtecek bir sevinç yaşayacaklarını söylediğini gördü."
  id: "Abu al-Walid al-Abbas ibn al-Mu'ammal al-Sufi diuji dan menanggung cobaan itu dengan sabar, dan penghiburannya terletak pada tangisan dan kesedihan, dan tempat berlindungnya adalah kuburan. Diriwayatkan dari Zayd al-Khabiri bahwa ia dipenjara untuk waktu yang lama setelah Harun al-Rashid memerintahkan apa yang benar, kemudian ia melihat dalam mimpinya seseorang memberitahunya bahwa orang-orang yang berduka akan mendapatkan kegembiraan pada Hari Kiamat yang akan meliputi kesedihan awal mereka."
