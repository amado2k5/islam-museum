summary:
  ar: "صالح بن سالم الخولاني، مولى لهم، أبو محمد، من علماء المالكية، كان حافظاً للفقه، تفقه بالشافعي ثم مال إلى مذهب المالكية، وروى عن ابن وهب والشافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  en: "Salih ibn Salim al-Khawlani, a freedman of his tribe, known as Abu Muhammad, a Maliki scholar who knew the fiqh by heart. He studied under al-Shafi'i and then turned to the Maliki school, and he transmitted from Ibn Wahb and al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  es: "Salih ibn Salim al-Khawlani, un liberto de su tribu, conocido como Abu Muhammad, fue un erudito malikí que dominaba el fiqh a la perfección. Estudió con al-Shafi'i y luego se unió a la escuela malikí, transmitiendo enseñanzas de Ibn Wahb y al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  fr: "Salih ibn Salim al-Khawlani, affranchi de sa tribu, connu sous le nom d'Abu Muhammad, était un érudit malikite qui connaissait le fiqh par cœur. Il étudia auprès d'al-Shafi'i, puis se tourna vers l'école malikite, et transmit l'enseignement d'Ibn Wahb et d'al-Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1630}"
  ur: "صالح بن سالم الخولانی، اپنے قبیلے کا ایک آزاد، ابو محمد کے نام سے جانا جاتا ہے، ایک مالکی عالم جو دل سے فقہ جانتا تھا۔ اس نے الشافعی کے تحت تعلیم حاصل کی اور پھر مالکی مکتب کا رخ کیا، اور اس نے ابن وہب اور الشافعی سے نقل کی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1630}"
