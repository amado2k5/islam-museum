label: { ar: "الحوفزان بن شريك", en: "al-Hawfazan ibn Shurayk", es: "al-Hawfazan ibn Shurayk", fr: "al-Hawfazan ibn Shurayk", ur: "الحافظان ابن شریق" }
summary:
  ar: "الحوفزان بن شريك الشيباني، الموصوف بالكرم والشجاعة، أخو جدّ مطر بن شريك؛ وإنما قيل له الحوفزان لأن قيس بن عاصم المنقري حفزه بالرمح حين خاف أن يفوته، ومعنى حفزه أي دفعه من خلفه، وقيل إن الذي حفزه بسطام بن قيس الشيباني {cite:wafayat-ayan}."
  en: "al-Hawfazan b. Shurayk al-Shaybani — the famed generous-and-brave tribesman; nicknamed for being goaded forward by a spear's butt, by Qays b. Asim or Bustam b. Qays {cite:wafayat-ayan}."
  es: "al-Hawfazan b. Shurayk al-Shaybani — el famoso miembro de la tribu, generoso y valiente; apodado así por ser incitado a avanzar por la culata de una lanza, por Qays b. Asim o Bustam b. Qays {cite:wafayat-ayan}."
  fr: "al-Hawfazan b. Shurayk al-Shaybani — le célèbre homme de tribu généreux et courageux; surnommé pour avoir été poussé en avant par le pommeau d'une lance, par Qays b. Asim ou Bustam b. Qays {cite:wafayat-ayan}."
  ur: "الحافظان ب. شوریق الشیبانی - مشہور سخی اور بہادر قبائلی؛ قیس بی کے ذریعہ نیزے کے بٹ سے آگے بڑھنے کے لئے عرفی نام۔ عاصم یا بستم بی۔ قیس {حوالہ: وفایت-عیان}۔"
  tr: "Cömert ve cesur olarak tanımlanan El-Havzan bin Şerik el-Şeybani, Matar bin Şerik'in dedesinin kardeşiydi; Kays bin Asim el-Mankari'nin onu kaçırmasından korktuğu için el-Havzan olarak adlandırılmıştır. 'Mızrak sapladı' anlamı, onu arkadan ittiği anlamına gelir. Ayrıca onu motive edenin Bastam ibn Qays al-Shaybani olduğu da söylenir."
  id: "Al-Hawfzan ibn Sharik al-Shaybani, yang digambarkan sebagai dermawan dan pemberani, adalah saudara dari kakek Matar ibn Sharik; ia disebut al-Hawfzan karena Qays ibn Asim al-Manqari menusuknya saat takut ia akan meleset. Arti 'ia menusuk tombak' berarti ia mendorongnya dari belakang. Dikatakan juga bahwa orang yang memotivasinya adalah Bastam ibn Qays al-Shaybani {cite:wafayat-ayan}."
