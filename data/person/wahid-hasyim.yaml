summary:
  ar: "عالم وسياسي إندونيسي (1914–1953)، أكبر أبناء هاشم أشعري مؤسس نهضة العلماء، تعلّم في مدارس جاوة الشرعية وحجّ سنة 1932، وصار أول وزير للشؤون الدينية في إندونيسيا سنة 1945 ثم من 1949 إلى 1952، وقاد نهضة العلماء في سنواته الأخيرة، وتوفي في حادث سير سنة 1953؛ وهو والد الرئيس الإندونيسي الرابع عبد الرحمن وحيد."
  en: "Indonesian ulama and politician (1914–1953), the eldest son of Hasyim Asy'ari, founder of Nahdlatul Ulama. Educated in East Java's pesantrens and on a Hajj study stay in Mecca in 1932–33, he became Indonesia's first Minister of Religious Affairs in 1945 and again from 1949 to 1952, led Nahdlatul Ulama in his final years, and died in a road accident in 1953; he was the father of Indonesia's fourth president, Abdurrahman Wahid."
  ur: "انڈونیشی عالم و سیاست دان (1914ء–1953ء)، نهضۃ العلماء کے بانی ہاشم اشعری کے بڑے بیٹے؛ مشرقی جاوا کے مدارس میں تعلیم پائی اور 1932ء میں حج و مطالعے کے لیے مکہ گئے، 1945ء میں انڈونیشیا کے پہلے وزیر مذہبی امور بنے اور 1949ء سے 1952ء تک دوبارہ اس عہدے پر رہے، آخری برسوں میں نهضۃ العلماء کی قیادت کی، اور 1953ء میں ایک سڑک حادثے میں وفات پائی؛ وہ انڈونیشیا کے چوتھے صدر عبد الرحمن وحید کے والد تھے۔"
