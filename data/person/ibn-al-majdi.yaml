summary:
  ar: "شهاب الدين ابن المجدي القرضي الشافعي العلامة؛ ولد بالقاهرة سنة سبع وستين وسبعمائة ونشأ بها ولازم علماء عصره وجد في الطلب إلى أن برع في الفقه والفرائض والحساب والعربية وشارك في علوم كثيرة غيرها كالهندسة والميقات وفاق فيها أهل عصره وانفرد بها وما زال مستمراً على الاشتغال والأشغال وصنف تصانيف كثيرة مشهورة منها شرح العبقرية في الفرائض، إلى أن توفي ليلة السبت حادي عشر ذي القعدة سنة خمسين وثمانمائة {cite:shadharat-dhahab p. 268}."
  en: "Ibn al-Majdi (b. Cairo 767) — jurist, calculator and astronomer who 'surpassed and uniquely held his age' in geometry and the science of timekeeping alongside fiqh, inheritance-arithmetic and Arabic; author of the famed Sharh al-Abqariyya on fara'id among many works; died Friday night 21 Dhu al-Qa'da 850 {cite:shadharat-dhahab p. 268}."
