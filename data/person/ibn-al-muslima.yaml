id: person/ibn-al-muslima
class: person
label: { ar: "أبو القاسم علي بن المسلمة" , ur: "ابن المسلمہ", en: "Ibn al-Muslima", es: "Ibn al-Muslima", fr: "Ibn al-Muslima"}
summary:
  ar: "عميد العراق ورئيس الرؤساء في خلافة القائم بأمر الله، كان صاحب التدبير الأول في بغداد قبيل دخول البساسيري سنة 450هـ. لما أطبق البساسيري على المدينة استأذنه الخليفة في الوساطة عند قريش بن بدران العقيلي، فلما ظفر به البساسيري استقبله بقوله «مرحباً بمدفن الدول ومهلك الأمم»، وأنكر عليه أنه لم يستبق من الحرم والأطفال والأجناد إلا أن يأخذ الأموال ويشرد الأهل، ثم حل ركابية برذونه ليسقط فتتمكن العامة منه، ووقف البساسيري يذب عنه حتى أركبه ثم قيده وسيّره في المطارد البيض {cite:muntazam-ibn-al-jawzi j.8 p.112-113}. وفي خامس عشر ذي الحجة سنة 450هـ أخرجه من محبسه في جبة صوف وطنطور لبد ومخنقة جلود في رقبته، وطيف به على جمل في محال الجانب الغربي وهو يقرأ «قل اللهم مالك الملك»، ثم نصبت له خشبة بباب خراسان وغُطّي بجلد ثور سُلخ في الحال وجعلت قرونه على رأسه واستُقي في الخشبة حياً، وكان البساسيري قد أمر بإطعامه رغيفين كل يوم ليبقى أياماً، فقال لهم «قولوا للأعمى قد بلغك الله أغراضك مني فاصطنعني لتنظر خدمتي» فسبّوه واستقوه ولبث إلى آخر النهار يضطرب ثم مات، وقال عند موته «الحمد لله الذي أحياني سعيداً وأماتني شهيداً». وكان قد بقي في الوزارة اثنتين وعشرين سنة وأشهراً وصُلب في المكان الذي صُلب فيه الحلاج {cite:muntazam-ibn-al-jawzi j.8 p.115-117}."
  ur: "عباسی خلیفہ القائم کا وزیر اور بساسیری کے داخلے سے پہلے بغداد کا اہم منتظم؛ شہر پر قبضے کے بعد قتل ہوا۔ {cite:muntazam-ibn-al-jawzi}"
  en: "Vizier of the Abbasid caliph al-Qa'im and a leading administrator in Baghdad before al-Basasiri's entry; he was killed after the city fell. {cite:muntazam-ibn-al-jawzi}"
  es: "Visir del califa abasí al-Qa'im y destacado administrador en Bagdad antes de la llegada de al-Basasiri; fue asesinado tras la caída de la ciudad. {cita: Muntazam ibn al-Jawzi}"
  fr: "Vizir du calife abbasside al-Qa'im et administrateur important de Bagdad avant l'arrivée d'al-Basasiri, il fut tué après la chute de la ville. {cite: Muntazam ibn al-Jawzi}"
  tr: "Irak valisi ve el-Kaim bi-Amr Allah'ın halifeliği sırasında şeflerin başı olan E-Basasiri, el-Basasiri'nin 450 Hicri yılında Bağdat'a girmesinden kısa bir süre önce ilk yöneticiydi. El-Basasiri Medine'nin kontrolünü ele geçirdiğinde, halife ondan Qurayş bin Bedran el-Uqaili ile arabuluculuk yapmasına izin istedi. El-Basasiri onu kazandığında, 'Milletlerin mezarlığına ve ulusların yok edilmesine hoş geldin' diyerek karşıladı ve kutsal alandan, çocuklardan ya da askerlerden para almadığını, sadece para almak ve halkı yerinden etmek için aldığını reddetti. Sonra tüfeğiyle düştü ki halk onu alabilsin. El-Basasiri onu savunmak için durdu, sonra onu bağladı ve beyazların peşinden yürüdü {atıf:Muntazam-ibn-al-Jawzi J.8 s.112-113}. 450 Hile yılının on beşinde Zhu Hicce ayının on beşinde, yün bir kumaş cübbe ve boynunda deriler olan giysili bir boyun içinde hapishanesinden çıkarıldı. Batı tarafında bir deve üzerinde 'Qul Allahumma Malik al-Mulk' okunurken geçit töreni yapıldı. Sonra Horasan kapısında ona bir tahta tahta kuruldu, hemen derisi yüzülen öküz derisiyle örtüldü, başına boynuzları takıldı ve tahta tahtada canlı beslendi. El-Basasiri ona günlerce kalması için her gün iki somun yedirilmesini emretmişti. Onlara dedi ki, 'Kör adama söyle, ihtiyaçlarınız size benden ulaştı, bu yüzden hizmetimi gösterin.' Onu aşağıladılar, gücünü istediler ve günün sonuna kadar huzursuz kaldılar, sonra öldüler. Ölümünde, 'Beni mutlu bir şekilde hayata döndüren ve şehit olarak öldüren Allah'a şükürler olsun' dedi. Yirmi iki yıl ve ay boyunca hizmette kaldı ve el-Hallaj'ın çarmıha gerildiği yerde çarmıha gerildi {atıf:muntazam-ibn-al-jawzi j.8 s.115-117}."
  id: "Gubernur Irak dan kepala kepala pada masa kekhalifahan al-Qa'im bi-Amr Allah, ia adalah administrator pertama di Baghdad tak lama sebelum al-Basasiri masuk pada tahun 450 H. Ketika al-Basasiri mengambil alih Madinah, khalifah meminta izin untuk menjadi mediator dengan Quraysh ibn Badran al-'Uqaili. Ketika al-Basasiri memenangkannya, ia menyambutnya dengan kata-kata, 'Selamat datang di pemakaman bangsa-bangsa dan kehancuran bangsa,' dan menyangkal bahwa ia tidak mengambil uang dari tempat suci, anak-anak, atau tentara kecuali untuk mengambil uang dan mengusir rakyat. Kemudian ia menunggang senapannya hingga jatuh agar rakyat biasa bisa mengambilnya. Al-Basasiri berdiri membelanya sampai ia memanjatnya, lalu mengikatnya dan masuk mengejar orang kulit putih {cite:muntazam-ibn-al-jawzi J.8 hlm.112-113}. Pada tanggal lima belas Dhu al-Hijjah tahun 450 H, ia dikeluarkan dari penjara dengan mengenakan jubah wol dari kain dan leher berpakaian dengan kulit di lehernya. Ia diarak di atas unta di sisi barat sambil melafalkan 'Qul Allahumma Malik al-Mulk.' Kemudian sebuah papan kayu didirikan untuknya di gerbang Khorasan, dan ia ditutupi kulit sapi yang segera dikuliti, tanduknya diletakkan di kepalanya, dan ia diberi makan hidup-hidup di papan kayu. Al-Basasiri memerintahkan agar ia diberi makan dua roti setiap hari agar bisa bertahan berhari-hari. Ia berkata kepada mereka, 'Katakan pada orang buta itu, kebutuhanmu datang dariku, maka buatlah aku melihat pelayananku.' Mereka menghina dia, mencari kekuatannya, dan tetap gelisah hingga akhir hari, lalu meninggal. Saat ia meninggal, ia berkata, 'Puji Allah yang membangkitkanku dengan bahagia dan membuatku mati sebagai syahid.' Ia tetap bertugas selama dua puluh dua tahun dan bulan dan disalibkan di tempat al-Hallaj disalibkan {cite:muntazam-ibn-al-jawzi j.8 hlm.115-117}."
