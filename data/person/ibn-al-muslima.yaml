id: person/ibn-al-muslima
class: person
label: { ar: "أبو القاسم علي بن المسلمة" }
summary:
  ar: "عميد العراق ورئيس الرؤساء في خلافة القائم بأمر الله، كان صاحب التدبير الأول في بغداد قبيل دخول البساسيري سنة 450هـ. لما أطبق البساسيري على المدينة استأذنه الخليفة في الوساطة عند قريش بن بدران العقيلي، فلما ظفر به البساسيري استقبله بقوله «مرحباً بمدفن الدول ومهلك الأمم»، وأنكر عليه أنه لم يستبق من الحرم والأطفال والأجناد إلا أن يأخذ الأموال ويشرد الأهل، ثم حل ركابية برذونه ليسقط فتتمكن العامة منه، ووقف البساسيري يذب عنه حتى أركبه ثم قيده وسيّره في المطارد البيض {cite:muntazam-ibn-al-jawzi j.8 p.112-113}. وفي خامس عشر ذي الحجة سنة 450هـ أخرجه من محبسه في جبة صوف وطنطور لبد ومخنقة جلود في رقبته، وطيف به على جمل في محال الجانب الغربي وهو يقرأ «قل اللهم مالك الملك»، ثم نصبت له خشبة بباب خراسان وغُطّي بجلد ثور سُلخ في الحال وجعلت قرونه على رأسه واستُقي في الخشبة حياً، وكان البساسيري قد أمر بإطعامه رغيفين كل يوم ليبقى أياماً، فقال لهم «قولوا للأعمى قد بلغك الله أغراضك مني فاصطنعني لتنظر خدمتي» فسبّوه واستقوه ولبث إلى آخر النهار يضطرب ثم مات، وقال عند موته «الحمد لله الذي أحياني سعيداً وأماتني شهيداً». وكان قد بقي في الوزارة اثنتين وعشرين سنة وأشهراً وصُلب في المكان الذي صُلب فيه الحلاج {cite:muntazam-ibn-al-jawzi j.8 p.115-117}."
