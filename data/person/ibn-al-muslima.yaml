label: { ar: "أبو القاسم علي بن المسلمة" }
summary:
  ar: "عميد العراق ورئيس الرؤساء في خلافة القائم بأمر الله، كان صاحب التدبير الأول في بغداد قبيل دخول البساسيري سنة 450هـ. لما أطبق البساسيري على المدينة استأذنه الخليفة في الوساطة عند قريش بن بدران العقيلي، فلما ظفر به البساسيري استقبله بقوله «مرحباً بمدفن الدول ومهلك الأمم»، وأنكر عليه أنه لم يستبق من الحرم والأطفال والأجناد إلا أن يأخذ الأموال ويشرد الأهل، ثم حل ركابية برذونه ليسقط فتتمكن العامة منه، ووقف البساسيري يذب عنه حتى أركبه ثم قيده وسيّره في المطارد البيض {cite:muntazam-ibn-al-jawzi j.8 p.112-113}."
