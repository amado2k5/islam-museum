summary:
  ar: "عازف كورا وملحّن مالي (10 أغسطس 1965 – 19 يوليو 2024)، من سلالة طويلة من عازفي الكورا في أسرة غريو؛ تروي تقاليد الأسرة الشفوية أن سبعين جيلًا سبقوه. نال ألبومه «في قلب القمر» (2005) مع علي فاركا توري جائزة غرامي، وتعاون عبر الثقافات مع الفلامنكو والبلوز والجاز، وعُدّ من أبرز من عرّف العالم بآلة الكورا."
  en: "Malian kora player and composer (10 August 1965 – 19 July 2024), from a long patrilineal line of kora players in a griot family whose oral tradition counts seventy generations before him. His album In the Heart of the Moon (2005) with Ali Farka Touré won a Grammy Award; he collaborated across flamenco, blues and jazz, and is among the players who introduced the kora to the world."
  ur: "مالی کے کورا نواز و موسیقی ساز (10 اگست 1965 – 19 جولائی 2024)، جو گریو خاندان میں کورا نوازوں کی طویل پدری نسل سے تھے؛ خاندان کی زبانی روایت ان سے پہلے ستر نسلیں گنتی ہے۔ علی فارکا تورے کے ساتھ ان کے البم «ان دی ہارٹ آف دی مون» (2005) نے گریمی ایوارڈ جیتا، اور انہوں نے فلیمینکو، بلوز و جاز کے ساتھ بین الثقافتی اشتراک کیے۔"
