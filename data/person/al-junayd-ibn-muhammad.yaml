id: person/al-junayd-ibn-muhammad
class: person
label: { ar: "الجنيد بن محمد", en: "Al Junayd Ibn Muhammad", es: "Al Junayd Ibn Muhammad", fr: "Al Junayd Ibn Muhammad", ur: "الجنید ابن محمد" }
summary:
  ar: "أبو القاسم الجنيد بن محمد رأس المتصوفة، قرأ ابن النديم بخط أبي محمد جعفر الخلدي وكان رئيسا من رؤساء المتصوفة وورعا زاهدا وسمعه يقول أخذت عن أبي القاسم الجنيد بن محمد وقال لي أخذت عن أبي الحسن السري بن المغلس السقطي وقال أخذ السري عن معروف الكرخي وأخذ معروف الكرخي عن فرقد السنجي وأخذ فرقد عن الحسن البصري وأخذ الحسن عن أنس بن مالك ولقي الحسن سبعين من البدريين {cite:fihrist-ibn-al-nadim p. 260}. وعند ابن الأثير توفي سنة 298هـ وكان أمام الدنيا في زمانه وأخذ الفقه عن أبي ثور صاحب الشافعي والتصوف عن سري السقطي {cite:kamil-ibn-al-athir p. 48}"
  en: "Al-Junayd ibn Muhammad — head of the Sufis, in the silsila Khuldi read in his own hand {cite:fihrist-ibn-al-nadim}"
  es: "Al-Junayd ibn Muhammad — jefe de los sufíes, en la silsila Khuldi leído de su puño y letra {cite:fihrist-ibn-al-nadim}"
  fr: "Al-Junayd ibn Muhammad — chef des soufis, dans la silsila Khuldi lu de sa propre main {cite:fihrist-ibn-al-nadim}"
  ur: "الجنید ابن محمد - صوفیوں کے سربراہ، سلسلۂ خلدی میں اپنے ہاتھ سے پڑھتے ہیں {حوالہ: فہرست ابن الندیم}"
  tr: "Ebu el-Kasım el-Cuneyd bin Muhammed, Sufilerin başıydı. İbn el-Nadim, Ebu Muhammed Ca'far el-Haldi'nin el yazısıyla okudu. O, Sufilerin liderleri arasında lider, dindar ve münvetti biriydi. Onun şöyle dediğini duydu: Ebu el-Kasım el-Cuneyd bin Muhammed'den aldım ve bana, 'Ebu el-Hasan el-Sari bin el-Muğis el-Sekati'den aldım.' dedi. El-Sari'nin bunu Ma'ruf al-Karkhi'den aldığını, Ma'ruf al-Karkhi'yi Farqad al-Sanji'den, el-Hasan'ı el-Hasan el-Basri'den, el-Hasan'ı ise Anas ibn Malik'ten aldığını söyledi. El-Hasan, yetmiş Badri el-Bedri ile görüştü {alıntı::] Fihrist-ibn-al-Nadim s. 260}. 298 Hicri yılında, zamanının önde gelen figürlerinden İbn el-Athir ile birlikte vefat etti. Fıkıhı el-Şafi'i'nin yazarı Ebu Tavr'dan, tasavvufu ise Sarri el-Saqati'den aldı {atıf:kamil-ibn el-Athir s. 48}"
  id: "Abu al-Qasim al-Junayd ibn Muhammad adalah kepala para Sufi. Ibn al-Nadim membaca dengan tulisan tangan Abu Muhammad Ja'far al-Khaldi. Dia adalah pemimpin di antara para pemimpin Sufi, seorang pertapa yang saleh. Dia mendengar dia berkata: Aku mengambil dari Abu al-Qasim al-Junayd ibn Muhammad, dan dia berkata kepadaku, 'Aku mengambil dari Abu al-Hasan al-Sari ibn al-Mughlis al-Saqati.' Dia berkata al-Sari mengambilnya dari Ma'ruf al-Karkhi, dan dia mengambil Ma'ruf al-Karkhi dari Farqad al-Sanji, dan dia mengambil al-Hasan dari al-Hasan al-Basri, dan al-Hasan dari Anas ibn Malik. Al-Hasan bertemu tujuh puluh Badri al-Badri {cite:Fihrist-ibn-al-Nadim hlm. 260}. Ia meninggal pada tahun 298 AH bersama Ibn al-Athir, yang merupakan tokoh terkemuka pada masanya. Ia mempelajari fiqhologi dari Abu Thawr, penulis al-Shafi'i, dan Sufisme dari Sarri al-Saqati {cite:kamil-ibn-al-athir hlm. 48}"
