id: person/al-junayd-ibn-muhammad
class: person
label: { ar: "الجنيد بن محمد", en: "Al Junayd Ibn Muhammad" }
summary:
  ar: "أبو القاسم الجنيد بن محمد رأس المتصوفة، قرأ ابن النديم بخط أبي محمد جعفر الخلدي وكان رئيسا من رؤساء المتصوفة وورعا زاهدا وسمعه يقول أخذت عن أبي القاسم الجنيد بن محمد وقال لي أخذت عن أبي الحسن السري بن المغلس السقطي وقال أخذ السري عن معروف الكرخي وأخذ معروف الكرخي عن فرقد السنجي وأخذ فرقد عن الحسن البصري وأخذ الحسن عن أنس بن مالك ولقي الحسن سبعين من البدريين {cite:fihrist-ibn-al-nadim p. 260}. وعند ابن الأثير توفي سنة 298هـ وكان أمام الدنيا في زمانه وأخذ الفقه عن أبي ثور صاحب الشافعي والتصوف عن سري السقطي {cite:kamil-ibn-al-athir p. 48}"
  en: "Al-Junayd ibn Muhammad — head of the Sufis, in the silsila Khuldi read in his own hand {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/kamil-ibn-al-athir, source/fihrist-ibn-al-nadim]
