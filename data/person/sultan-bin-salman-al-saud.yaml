summary:
  ar: "أمير سعودي وطيار سابق في القوات الجوية الملكية السعودية، وُلد في الرياض سنة 1956 وهو الابن الثاني للملك سلمان، طار سنة 1985 على متن مكوك الفضاء ديسكفري اختصاصي حمولة فصار أول فرد من أسرة ملكية وأول عربي وأول مسلم يطير إلى الفضاء وأصغر من طار على مكوك فضائي، ثم قاد هيئة السياحة والتراث الوطني منذ تأسيسها، ورأس مجلس إدارة الهيئة السعودية للفضاء (2018–2021)، وهو مستشار خاص للملك ورئيس مجلس أمناء مؤسسة الملك سلمان منذ 2021."
  en: "Saudi prince and former Royal Saudi Air Force pilot, born in Riyadh in 1956 as the second son of King Salman, who flew in 1985 aboard the Space Shuttle Discovery as a payload specialist — the first member of a royal family, the first Arab and the first Muslim to fly in space, and the youngest person to fly on a space shuttle — then led the Saudi tourism and heritage commission from its inception, chaired the Saudi Space Commission (2018–2021), and has been a special advisor to the King and chairman of the King Salman Foundation's board of trustees since 2021."
  ur: "سعودی شہزادے اور شاہی سعودی فضائیہ کے سابق پائلٹ، جو 1956 میں ریاض میں پیدا ہوئے اور شاہ سلمان کے دوسرے صاحبزادے ہیں، 1985 میں خلائی شٹل ڈسکوری میں پے لوڈ اسپیشلسٹ کی حیثیت سے پرواز کر کے خلا میں جانے والے پہلے شاہی خاندان کے فرد، پہلے عرب اور پہلے مسلمان بنے، پھر سیاحت و قومی ورثہ کمیشن کی قیادت کی، سعودی خلائی کمیشن کے چیئرمین رہے (2018–2021)، اور 2021 سے شاہ کے خصوصی مشیر اور شاہ سلمان فاؤنڈیشن کے بورڈ آف ٹرسٹیز کے چیئرمین ہیں۔"
