summary:
  ar: "باحثة أمريكية في الدراسات الإسلامية، وُلدت سنة 1958. نالت الدكتوراه من جامعة جونز هوبكنز سنة 1993، ودرّست في هارفارد ونوتردام، وتشغل أستاذية لغات وثقافات الشرق الأوسط في جامعة إنديانا بلومنغتون. من كتبها «المسلمون الأوائل: التاريخ والذاكرة» و«السعي في سبيل الله» الذي نال جائزة الكتاب العالمية الإيرانية سنة 2015، و«الجهاد: ما يحتاج الجميع إلى معرفته» (2022)."
  en: "American scholar of Islamic studies, born in 1958. She took her PhD at Johns Hopkins University in 1993, taught at Harvard and Notre Dame, and is professor of Middle Eastern languages and cultures at Indiana University Bloomington. Her books include The First Muslims: History and Memory, Striving in the Path of God — which received Iran's World Book Prize in 2015 — and Jihad: What Everyone Needs to Know (2022)."
  ur: "امریکی ماہرِ اسلامیات، 1958 میں پیدا ہوئیں۔ انھوں نے 1993 میں جانز ہاپکنز یونیورسٹی سے پی ایچ ڈی کی، ہارورڈ اور نوٹرے ڈیم میں پڑھایا، اور انڈیانا یونیورسٹی بلومنگٹن میں مشرقِ وسطیٰ کی زبانوں و ثقافتوں کی پروفیسر ہیں۔ ان کی کتابوں میں «دی فرسٹ مسلمز»، «اسٹرائیونگ ان دی پاتھ آف گاڈ» — جسے 2015 میں ایران کا عالمی کتاب انعام ملا — اور «جہاد: واٹ ایوری ون نیڈز ٹو نو» (2022) شامل ہیں۔"
