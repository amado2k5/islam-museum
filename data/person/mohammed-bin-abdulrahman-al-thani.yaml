summary:
  ar: "محمد بن عبد الرحمن بن جاسم آل ثاني ⁦(وُلد في 1 تشرين الثاني 1980 في الدوحة)⁩ دبلوماسي واقتصادي وسياسي قطري، رئيس وزراء قطر منذ آذار 2023 ووزير خارجيتها منذ 2016. من أسرة آل ثاني الحاكمة؛ ترأس صندوق قطر للتنمية (2014–2024) وجهاز قطر للاستثمار (2018–2023) وكان نائبًا لرئيس الوزراء (2017–2023)."
  en: "Mohammed bin Abdulrahman bin Jassim Al Thani (born 1 November 1980 in Doha) is a Qatari diplomat, economist and politician who has been Prime Minister of Qatar since March 2023 and Minister of Foreign Affairs since 2016. A member of the House of Thani, he chaired the Qatar Fund for Development (2014–2024) and the Qatar Investment Authority (2018–2023) and was deputy prime minister (2017–2023)."
  ur: "محمد بن عبدالرحمن بن جاسم آل ثانی ⁦(پیدائش 1 نومبر 1980، دوحہ)⁩ قطری سفارت کار، ماہر معیشت اور سیاست دان ہیں؛ مارچ 2023 سے قطر کے وزیر اعظم اور 2016 سے وزیر خارجہ ہیں۔ وہ آل ثانی خاندان کے رکن ہیں، قطر فنڈ فار ڈیولپمنٹ (2014–2024) اور قطر انویسٹمنٹ اتھارٹی (2018–2023) کے چیئرمین رہے۔"
