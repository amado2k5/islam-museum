summary:
  ar: "محمد بن موسى بن حفص بن عمر بن العلاء؛ افتتح مع مازيار بن قارن جبال شروين من طبرستان وهي أمنع جبالها وأصعبها وأكثرها أشباً وغياضاً في خلافة المأمون."
  en: "Muhammad ibn Musa ibn Hafs ibn Umar ibn al-Ala'; with Mazyar ibn Qarin he conquered the Shirwin mountains — Tabaristan's most impregnable, thickest in jungle and thicket — under al-Ma'mun."
  es: "Muhammad ibn Musa ibn Hafs ibn Umar ibn al-Ala'; junto con Mazyar ibn Qarin, conquistó las montañas Shirwin —las más inexpugnables de Tabaristán, las más densas en selva y matorrales— bajo el mando de al-Ma'mun."
  fr: "Muhammad ibn Musa ibn Hafs ibn Umar ibn al-Ala'; avec Mazyar ibn Qarin, il conquit les montagnes de Shirwin — les plus imprenables du Tabaristan, les plus denses en jungle et en fourrés — sous al-Ma'mun."
  ur: "محمد بن موسیٰ بن حفص ابن عمر بن العلاء؛ مزیار بن قرین کے ساتھ اس نے شیروین پہاڑوں کو فتح کیا - طبرستان کا سب سے ناقابل تسخیر، جنگل اور جھاڑیوں میں سب سے گھنا - المامون کے تحت۔"
