summary:
  ar: "بطاقة أولية لوكيع بن الجراح بن مليح الرواسي الكوفي، حافظ الحديث ومحدث الكوفة في القرن الثامن، توفي سنة ٨١٢م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Waki' ibn al-Jarrah ibn Malih al-Ru'asi al-Kufi, the Kufan hadith master of the eighth century, d. 812; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Waki' ibn al-Jarrah ibn Malih al-Ru'asi al-Kufi, el maestro de hadices de Kufa del siglo VIII, fallecido en 812; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Waki' ibn al-Jarrah ibn Malih al-Ru'asi al-Kufi, le maître du hadith de Kufan du VIIIe siècle, mort en 812; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "وکیع ابن الجراح ابن ملیح الرواسی الکوفی کے لیے مسودہ کارڈ، آٹھویں صدی کے کوفان حدیث کے ماہر، د. 812; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Sekizinci yüzyılda Kufe'nin hadis bilgini ve hadis alimi olan Waki' ibn al-Jarrah ibn Malih al-Rawasi al-Kufi'nin ön kartı 812 yılında vefat etti; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Waki' ibn al-Jarrah ibn Malih al-Rawasi al-Kufi, penghafal hadis dan ulama hadis Kufa pada abad kedelapan, meninggal pada tahun 812 M; buku biografi menyebutkannya, dan biografinya belum ditinjau di halaman tersebut."
