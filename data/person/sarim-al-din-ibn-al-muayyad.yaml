summary:
  ar: "صارم الدين إبراهيم بن المؤيد شيخ المحمودي؛ ولد بالبلاد الشامية في أوائل القرن تقريباً وأمه أم ولد جاركسية تسمى توروز، وكان ملكاً شجاعاً شاباً حسناً مقداماً كريماً ساكناً وعنده أدب وحشمة ملوكية وكان يميل إلى الخير والعدل والعفة عن أموال الرعية إلا أنه كان مسرفاً على نفسه، توفي سنة ثلاث وعشرين وثمانمائة {cite:shadharat-dhahab p. 168}."
  en: "Sarim al-Din Ibrahim, al-Mu'ayyad Shaykh's son by the Circassian Turuz — 'brave, comely, munificent, with royal gravity,' raised briefly to the sultanate; died 823 {cite:shadharat-dhahab p. 168}."
  es: "Sarim al-Din Ibrahim, hijo de al-Mu'ayyad Shaykh y de la circasiana Turuz — 'valiente, apuesto, generoso, con gravedad real', elevado brevemente al sultanato; murió en 823 {cite:shadharat-dhahab p. 168}."
  fr: "Sarim al-Din Ibrahim, fils du cheikh al-Mu'ayyad et de la Circassienne Turuz — « brave, beau, munificent, avec une gravité royale », brièvement élevé au sultanat; mort en 823 {cite: shadharat-dhahab p. 168}."
  ur: "صارم الدین ابراہیم، المعیاد شیخ کا بیٹا سرکاسی ٹوروز - 'بہادر، خوبصورت، مہربان، شاہی کشش ثقل کے ساتھ،' مختصر طور پر سلطنت کے سامنے اٹھایا؛ وفات 823۔ 168}۔"
  tr: "Sarim al-Din İbrahim ibn al-Mu'eyyad Şeyh al-Mahmoudi; yüzyılın başlarında Levant'ta doğdu, annesi Turuz adında Jarkissiya'da doğdu. Cesur, iyi, genç, iyi, cömert ve sakin bir kraldı; kraliyet adabı ve alçakgönüllülüğüne sahipti. Tebaasının servetine karşı iyilik, adalet ve iffete eğilimliydi, ancak kendine karşı gösterişliydi. 823 Hicri yılında öldü {cite:shadharat-dhahab, s. 168}."
  id: "Sarim al-Din Ibrahim ibn al-Mu'ayyad Sheikh al-Mahmoudi; lahir di Levant sekitar awal abad dari seorang ibu yang lahir di Jarkissiya bernama Turuz. Ia adalah raja yang pemberani, baik, muda, baik, dermawan, dan tenang, memiliki sopan santun dan kerendahan hati kerajaan. Ia cenderung pada kebaikan, keadilan, dan kesucian daripada kekayaan rakyatnya, tetapi ia boros pada dirinya sendiri. Ia meninggal pada tahun 823 H {cite:shadharat-dhahab, hlm. 168}."
