summary:
  ar: "عز الدين أبو حفص عمر بن أحمد بن أحمد بن مهدي المدلجي النشائي المصري، فقيه شافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} قال الإسنوي: كان إماماً بارعاً في الفقه والنحو والعلوم الحسابية، أصولياً محققاً ديناً زاهداً، سمع من جماعة، ودرّس بالفاضلية والهكارية، وانتفع به خلق كثيرون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} وله على «الوسيط» إشكالات حسنة مفيدة في مجلدين إلا أنها لم تكمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} وابنه أحمد كمال الدين أبو العباس النشائي، المولود في ذي القعدة سنة ٦٩١ه، من كبار العلماء الشافعية، صنف تصانيف مفيدة جامعة محررة منها المنتقى وجامع المختصرات ونكت التنبيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} والمصادر المذكورة: طبقات الشافعية الكبرى للسبكي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} وفي رأس الترجمة تاريخان مطبوعان على نحو «٧١٦-٢ه» ولم تتضح الأرقام تماماً في المسح فلا يُثبت تاريخ هنا."
  en: "Izz al-Din Abu Hafs Umar ibn Ahmad ibn Ahmad ibn Mahdi al-Mudliji al-Nasha'i al-Misri, a Shafi'i jurist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} Al-Isnawi described him as an accomplished imam in fiqh, grammar and the mathematical sciences, a verifying scholar of usul, pious and ascetic; he heard from a number of teachers, taught at al-Fadiliyya and al-Hakkariyya, and many benefited from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} He wrote fine, useful critical notes on al-Wasit in two volumes, left incomplete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} His son Ahmad Kamal al-Din Abu al-Abbas al-Nasha'i, born in Dhu al-Qa'da 691 AH, was likewise among the great Shafi'i scholars and wrote useful, comprehensive, polished works including al-Muntaqa, Jami' al-mukhtasarat and Nukat al-tanbih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} The cited source is al-Subki's Tabaqat al-shafi'iyya al-kubra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} The heading prints two figures in the form \"716-2 AH\"; the digits are not fully clear in the scan so no date is stated here."
  es: "Izz al-Din Abu Hafs Umar ibn Ahmad ibn Ahmad ibn Mahdi al-Mudliji al-Nasha'i al-Misri, un jurista shafi'í. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} Al-Isnawi lo describió como un imán consumado en fiqh, gramática y ciencias matemáticas, un erudito verificador de usul, piadoso y ascético; escuchó a varios maestros, enseñó en al-Fadiliyya y al-Hakkariyya, y muchos se beneficiaron de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} Escribió notas críticas excelentes y útiles sobre al-Wasit en dos volúmenes, que quedaron incompletos. Su hijo Ahmad Kamal al-Din Abu al-Abbas al-Nasha'i, nacido en Dhu al-Qa'da 691 AH, fue igualmente uno de los grandes eruditos shafi'íes y escribió obras útiles, completas y pulidas, incluyendo al-Muntaqa, Jami' al-mukhtasarat y Nukat al-tanbih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} La fuente citada es Tabaqat al-Shafi'iyya al-Kubra de al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} El encabezado imprime dos cifras en la forma \"716-2 AH\"; los dígitos no son completamente claros en el escaneo, por lo que no se indica ninguna fecha aquí."
  fr: "Izz al-Din Abu Hafs Umar ibn Ahmad ibn Ahmad ibn Mahdi al-Mudliji al-Nasha'i al-Misri, juriste chaféite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} Al-Isnawi le décrit comme un imam accompli en fiqh, en grammaire et en mathématiques, un érudit rigoureux en usul, pieux et ascétique; il reçut l'enseignement de nombreux maîtres, enseigna à al-Fadiliyya et al-Hakkariyya, et beaucoup bénéficièrent de son savoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} Il rédigea d'excellentes et précieuses notes critiques sur al-Wasit en deux volumes, restées inachevées. Son fils, Ahmad Kamal al-Din Abu al-Abbas al-Nasha'i, né en Dhu al-Qa'da 691 AH, fut également un grand savant shafi'ite et auteur d'ouvrages utiles, complets et d'une grande qualité, notamment al-Muntaqa, Jami' al-mukhtasarat et Nukat al-tanbih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} La source citée est Tabaqat al-Shafi'iyya al-Kubra d'al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} L'en-tête mentionne deux chiffres sous la forme « 716-2 AH »; les chiffres étant illisibles sur le document numérisé, aucune date n'est indiquée ici."
  ur: "عزالدین ابو حفص عمر بن احمد بن احمد بن مہدی المدلجی النشاعی المصری، شافعی فقیہ۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 18078} الاسناوی نے انہیں فقہ، گرامر اور ریاضی کے علوم میں ایک ماہر امام کے طور پر بیان کیا ہے، ایک اصولی، متقی اور پرہیزگار کا تصدیق کرنے والا عالم؛ اس نے متعدد اساتذہ سے سنا، الفدلیہ اور الحکریہ میں پڑھایا، اور بہت سے لوگوں نے ان سے استفادہ کیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18078} اس نے الواسط پر دو جلدوں میں عمدہ اور مفید تنقیدی نوٹ لکھے جو کہ نامکمل رہ گئے۔ اس کا بیٹا احمد کمال الدین ابو العباس النشاعی، جو ذوالقعدہ 691 ہجری میں پیدا ہوا، اسی طرح عظیم شافعی علماء میں سے تھا اور اس نے المنتقہ، جامع المختصرات اور نکتہ التنبیح سمیت مفید، جامع، چمکدار تصانیف لکھیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18078} حوالہ دیا گیا ماخذ السبکی کی طبقات الشافعیہ الکبری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18078} سرخی \"716-2 ہجری\" کی شکل میں دو اعداد چھاپتی ہے۔ سکین میں ہندسے مکمل طور پر واضح نہیں ہیں لہذا یہاں کوئی تاریخ نہیں بتائی گئی ہے۔"
