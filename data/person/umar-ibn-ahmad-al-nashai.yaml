summary:
  ar: "عز الدين أبو حفص عمر بن أحمد بن أحمد بن مهدي المدلجي النشائي المصري، فقيه شافعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} قال الإسنوي: كان إماماً بارعاً في الفقه والنحو والعلوم الحسابية، أصولياً محققاً ديناً زاهداً، سمع من جماعة، ودرّس بالفاضلية والهكارية، وانتفع به خلق كثيرون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} وله على «الوسيط» إشكالات حسنة مفيدة في مجلدين إلا أنها لم تكمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} وابنه أحمد كمال الدين أبو العباس النشائي، المولود في ذي القعدة سنة ٦٩١ه، من كبار العلماء الشافعية، صنف تصانيف مفيدة جامعة محررة منها المنتقى وجامع المختصرات ونكت التنبيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} والمصادر المذكورة: طبقات الشافعية الكبرى للسبكي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} وفي رأس الترجمة تاريخان مطبوعان على نحو «٧١٦-٢ه» ولم تتضح الأرقام تماماً في المسح فلا يُثبت تاريخ هنا."
  en: "Izz al-Din Abu Hafs Umar ibn Ahmad ibn Ahmad ibn Mahdi al-Mudliji al-Nasha'i al-Misri, a Shafi'i jurist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} Al-Isnawi described him as an accomplished imam in fiqh, grammar and the mathematical sciences, a verifying scholar of usul, pious and ascetic; he heard from a number of teachers, taught at al-Fadiliyya and al-Hakkariyya, and many benefited from him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} He wrote fine, useful critical notes on al-Wasit in two volumes, left incomplete. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} His son Ahmad Kamal al-Din Abu al-Abbas al-Nasha'i, born in Dhu al-Qa'da 691 AH, was likewise among the great Shafi'i scholars and wrote useful, comprehensive, polished works including al-Muntaqa, Jami' al-mukhtasarat and Nukat al-tanbih. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} The cited source is al-Subki's Tabaqat al-shafi'iyya al-kubra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18078} The heading prints two figures in the form \"716-2 AH\"; the digits are not fully clear in the scan so no date is stated here."
