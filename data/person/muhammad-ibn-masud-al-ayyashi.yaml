summary:
  ar: "محمد بن مسعود بن محمد العياشي، كاتب شيعي من سمرقند من القرن الثالث الهجري، يُنسب إليه أكثر من 200 كتاب، وكان أستاذاً لمحمد بن عمر الكشي {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  en: "Muhammad b. Mas'ud al-'Ayyashi, a Shi'i writer from Samarkand in the third/ninth century, credited with more than 200 books; teacher of Muhammad b. 'Umar al-Kashshi {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  es: "Muhammad b. Mas'ud al-'Ayyashi, escritor chiíta de Samarcanda del siglo III/IX, autor de más de 200 libros; maestro de Muhammad b. 'Umar al-Kashshi {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  fr: "Muhammad b. Mas'ud al-'Ayyashi, un écrivain chiite de Samarcande du IIIe/IXe siècle, à qui l'on attribue plus de 200 livres; maître de Muhammad b. 'Umar al-Kashshi {cite:encyclopaedia-of-islam-2 vol. 1 p. 843}."
  ur: "محمد بی تیسری/نویں صدی میں سمرقند سے تعلق رکھنے والے ایک شیعہ مصنف مسعود العیاشی، جن کے پاس 200 سے زیادہ کتابیں ہیں۔ محمد کے استاد عمر الکاشی {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 843}۔"
