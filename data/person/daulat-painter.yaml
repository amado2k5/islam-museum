summary:
  ar: "مصور مغولي «خانه زاد» ولد في الخدمة الإمبراطورية، أقدم أعماله في «بابرنامه» دلهي نحو 1597م، ورسم في حواشي مرقع گلشن نحو 1605–1609م صور زملائه المصورين ونفسه {cite:beach-grand-mogul-1978 p. 112}."
  en: "Mughal painter, a khanazad born into imperial service, whose earliest work is in the Delhi Babur-nama of about 1597 and who painted portraits of his fellow artists and himself in the Gulshan Album margins about 1605–9 {cite:beach-grand-mogul-1978 p. 112}."
  ur: "مغل مصور، «خانہ زاد» یعنی شاہی خدمت میں پیدا ہونے والے، جن کا ابتدائی کام تقریباً 1597ء کے دہلی بابرنامہ میں ہے، اور جنہوں نے تقریباً 1605–09ء میں مرقعِ گلشن کے حاشیوں میں ساتھی فنکاروں اور خود کی شبیہیں بنائیں {cite:beach-grand-mogul-1978 p. 112}۔"
