class: person
label: { ar: "دولت ⁦(مصور مغولي)⁩", en: "Daulat (Mughal painter)", ur: "دولت ⁦(مغل مصور)⁩", es: "Daulat (Mughal painter)", fr: "Daulat (Mughal painter)" }
summary:
  ar: "مصور مغولي «خانه زاد» ولد في الخدمة الإمبراطورية، أقدم أعماله في «بابرنامه» دلهي نحو 1597م، ورسم في حواشي مرقع گلشن نحو 1605–1609م صور زملائه المصورين ونفسه {cite:beach-grand-mogul-1978 p. 112}."
  en: "Mughal painter, a khanazad born into imperial service, whose earliest work is in the Delhi Babur-nama of about 1597 and who painted portraits of his fellow artists and himself in the Gulshan Album margins about 1605–9 {cite:beach-grand-mogul-1978 p. 112}."
  ur: "مغل مصور، «خانہ زاد» یعنی شاہی خدمت میں پیدا ہونے والے، جن کا ابتدائی کام تقریباً 1597ء کے دہلی بابرنامہ میں ہے، اور جنہوں نے تقریباً 1605–09ء میں مرقعِ گلشن کے حاشیوں میں ساتھی فنکاروں اور خود کی شبیہیں بنائیں {cite:beach-grand-mogul-1978 p. 112}۔"
  es: "Pintor mogol, un khanazad nacido al servicio imperial, cuya obra más antigua se encuentra en el Babur-nama de Delhi de alrededor de 1597 y que pintó retratos de sus compañeros artistas y de sí mismo en los márgenes del Álbum Gulshan alrededor de 1605-9 {cite:beach-grand-mogul-1978 p. 112}."
  fr: "Peintre moghol, un khanazad né au service impérial, dont la première œuvre se trouve dans le Delhi Babur-nama d'environ 1597 et qui a peint des portraits de ses collègues artistes et de lui-même dans les marges de l'album Gulshan vers 1605-1609 {cite:beach-grand-mogul-1978 p. 112}."
  tr: "İmparatorluk hizmetinde doğan Babür ressamı Khanzad, en erken eserlerini yaklaşık 1597 yılında Delhi'deki Babarnama'da yazmış ve 1605–1609 yılları arasında Gulshan yamacılığının kenarlarında meslektaşlarını ve kendisini tasvir eden resimler yapmıştır {cite:beach-grand-mogul-1978 s. 112}."
  id: "Pelukis Mughal Khanzad, lahir dalam pelayanan kekaisaran, menulis karya pertamanya di Babarnama di Delhi sekitar tahun 1597 M, dan melukis di pinggiran tambal sulam Gulshan sekitar tahun 1605–1609 M yang menggambarkan sesama pelukis dan dirinya sendiri {cite:beach-grand-mogul-1978 hlm. 112}."
