summary:
  ar: صانعة محتوى وممثلة وكاتبة إندونيسية وُلدت سنة 1995 في باتانغ؛ ثاني أكبر قناة نسائية على يوتيوب في جنوب شرق آسيا، ومثلت في أفلام وكتبت كتبًا لليافعين، ولديها عشرات الملايين من المتابعين.
  en: Indonesian creator, actress and author born in Batang in 1995; among the biggest female YouTubers in Southeast Asia, she has acted in films, written young-adult books, and commands tens of millions
    of followers.
  ur: انڈونیشی کریٹر، اداکارہ اور مصنفہ جو 1995 میں باتانگ میں پیدا ہوئی؛ جنوب مشرقی ایشیا کی سب سے بڑی خاتون یوٹیوبرز میں، فلموں میں اداکاری کی، نوجوانوں کی کتابیں لکھیں اور کروڑوں فالوورز رکھتی ہے۔
  es: "Creadora, actriz y autora indonesia nacida en Batang en 1995; una de las youtubers femeninas más importantes del sudeste asiático, ha actuado en películas, escrito libros para jóvenes adultos y cuenta con decenas de millones de seguidores."
  fr: "Créatrice, actrice et auteure indonésienne née à Batang en 1995; parmi les plus grandes YouTubeuses d'Asie du Sud-Est, elle a joué dans des films, écrit des livres pour jeunes adultes et compte des dizaines de millions d'abonnés."
  tr: "1995 yılında Batang'da doğmuş Endonezyalı bir içerik üreticisi, oyuncu ve yazar; Güneydoğu Asya'nın ikinci en büyük kadın YouTube kanalıdır. Genç yetişkinler için filmlerde rol aldı ve kitaplar yazdı, on milyonlarca takipçisi var."
  id: "Seorang kreator konten, aktris, dan penulis Indonesia yang lahir pada tahun 1995 di Batang; saluran YouTube perempuan terbesar kedua di Asia Tenggara. Dia telah berakting dalam film dan menulis buku untuk remaja, serta memiliki puluhan juta pengikut."
