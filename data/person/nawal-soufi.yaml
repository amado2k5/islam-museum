summary:
  ar: "ناشطة إنسانية مغربية إيطالية وُلدت سنة 1988 في المغرب ونشأت في كاتانيا بصقلية. اشتهرت سنة 2013 بلقب «ملاك اللاجئين» بعد إنقاذها قاربًا يحمل مئات اللاجئين السوريين في المتوسط عبر تنسيق نداءات الاستغاثة مع خفر السواحل، وحازت جائزة المواطنة الأوروبية سنة 2016 وجائزة «صنّاع الأمل» العربية سنة 2017."
  en: "Moroccan-Italian humanitarian activist, born 1988 in Morocco and raised in Catania, Sicily. Known since 2013 as the 'Angel of the Refugees' after relaying distress calls from a boat carrying hundreds of Syrian refugees to the coastguard, she won the European Citizens' Prize in 2016 and the UAE Arab Hope Maker award in 2017."
  ur: "مغربی-اطالوی انسانی کارکن، 1988 میں مراکش میں پیدا ہوئیں اور سسلی کے شہر کاتانیا میں پلی بڑھیں۔ 2013 سے «لاجئین کی فرشتہ» کے نام سے معروف ہوئیں جب انہوں نے بحیرۂ روم میں سینکڑوں سوری مہاجرین کی کشتی کی استغاثہ کو ساحلی محافظوں تک پہنچا کر جان بچائی؛ 2016 میں یورپی شہریت کا ایوارڈ اور 2017 میں عرب «صنّاع الامل» کا انعام پایا۔"
  es: "Activista humanitaria marroquí-italiana, nacida en 1988 en Marruecos y criada en Catania, Sicilia. Conocida desde 2013 como el \"Ángel de los Refugiados\" tras transmitir a la guardia costera las llamadas de auxilio de una embarcación que transportaba a cientos de refugiados sirios, ganó el Premio Ciudadano Europeo en 2016 y el premio Creadora de Esperanza Árabe de los Emiratos Árabes Unidos en 2017."
