summary:
  ar: "موسيقي وملحن ومعلم أفغاني من حي خرابات بكابل (1876-1967)، من أسرة موسيقيين قدمت من البنجاب في عهد شير علي خان. تعلم السارنغي والراغا، وأسس مدرسة موسيقية في خرابات غدت مع مدرسة أستاذ قاسم جو أهم مدرستي كابل، ووضع منهج تعليم الموسيقى في المدارس ودرّس فيها، وانضمت فرقته إلى أوركسترا إذاعة أفغانستان. كان في زمانه أكبر عازفي الهارمونية والبيانو، وخرّج أجيالا من موسيقيي كابل، وواصل ابنه محمد حسين سرآهنگ عمله."
  en: "Afghan musician, composer and teacher of Kharabat, Kabul (1876–1967), from a family of musicians that had come from the Punjab in Sher Ali Khan's time. Trained in sarangi and raga, he founded a music school in Kharabat that, with Ustad Qasem Jo's, became one of Kabul's two leading schools; he devised the curriculum for music in the state schools and taught in them, and his ensemble was absorbed into the orchestra of Radio Afghanistan. He was the leading harmonium and piano player of his day, trained generations of Kabul musicians, and his son Mohammad Hossein Sarahang continued his work."
  ur: "کابل کے محلے خرابات کے افغان موسیقار، نغمہ نگار اور استاد (1876ء–1967ء)، موسیقاروں کے ایک خاندان سے جو شیر علی خان کے زمانے میں پنجاب سے آیا تھا۔ سارنگی اور راگ کی تربیت حاصل کی، خرابات میں موسیقی کا مدرسہ قائم کیا جو استاد قاسم جو کے مدرسے کے ساتھ کابل کے دو بڑے مدرسوں میں شمار ہوا، سرکاری اسکولوں کے لیے موسیقی کا نصاب بنایا اور ان میں پڑھایا، اور ان کا دستہ ریڈیو افغانستان کے آرکسٹرا میں شامل ہوا۔ وہ اپنے زمانے کے سب سے بڑے ہارمونیم اور پیانو نواز تھے، کابل کے موسیقاروں کی نسلیں تیار کیں، اور ان کے بیٹے محمد حسین سرآہنگ نے ان کا کام جاری رکھا۔"
