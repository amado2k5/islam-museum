summary:
  ar: "تابعي من عبد القيس، روى عن علي وأبي موسى الأشعري وأبي ذر وأبي هريرة وابن عباس وابن عمر وعمران بن حصين وسمرة بن جندب وغيرهم، وروى عنه سليمان التيمي وعبد العزيز بن صهيب ويحيى بن أبي كثير وغيرهم، ووثقه ابن معين وابن سعد، وذكره ابن حبان في الثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5144}"
  en: "A Successor from the Abd al-Qays tribe. He narrated from Ali, Abu Musa al-Ash'ari, Abu Dharr, Abu Hurayra, Ibn Abbas, Ibn Umar, Imran ibn Husayn and Samura ibn Jundab among others, and from him narrated Sulayman al-Taymi, Abd al-Aziz ibn Suhayb and Yahya ibn Abi Kathir among others. Ibn Ma'in and Ibn Sa'd called him trustworthy, and Ibn Hibban counted him among the trustworthy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5143} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5144}"
