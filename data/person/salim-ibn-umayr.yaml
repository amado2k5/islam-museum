summary:
  ar: أول البكائين السبعة، من بني عمرو بن عوف بحسب سياق ابن إسحاق؛ ذكره ابن إسحاق فيمن استحملوا النبي في غزوة تبوك فلم يجد
    ما يحملهم عليه.
  en: The first of the seven Weepers, of Banu Amr ibn Awf in Ibn Ishaq's context; Ibn Ishaq lists him among those who begged
    the Prophet for mounts on the Tabuk campaign when he found nothing to carry them on.
  ur: "بنو عمرو بن عوف سے سات روینے والوں میں پہلے؛ ابن اسحاق انہیں تبوک میں نبی سے سواری مانگنے والوں میں گناتے ہیں۔"
  es: "El primero de los siete Llorones, de Banu Amr ibn Awf en el contexto de Ibn Ishaq; Ibn Ishaq lo incluye entre los que rogaron al Profeta por monturas en la campaña de Tabuk cuando no encontró nada para transportarlos."
  fr: "Le premier des sept pleureurs, de Banu Amr ibn Awf dans le contexte d'Ibn Ishaq; Ibn Ishaq le cite parmi ceux qui ont supplié le Prophète de leur fournir des montures lors de la campagne de Tabuk lorsqu'il n'a rien trouvé pour les transporter."
  tr: "Yedi yas tutanların ilki, İbn İshaq'ın bağlamına göre Banu Amr bin Awf'tandı; İbn İshaq, Tabuk Savaşı'nda Peygamber'i destekleyenler arasında onu da anmış, ancak onları buna zorlamak için bir sebep bulmamıştır."
  id: "Yang pertama dari tujuh pelayat berasal dari Banu Amr ibn Awf menurut konteks Ibn Ishaq; Ibn Ishaq menyebutnya sebagai salah satu yang mendukung Nabi dalam Pertempuran Tabuk, tetapi ia tidak menemukan alasan untuk memaksa mereka melakukannya."
