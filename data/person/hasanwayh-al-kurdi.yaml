id: person/hasanwayh-al-kurdi
class: person
label: { ar: "حسنويه الكردي" }
summary:
  ar: "حسنويه بن الحسين الكردي البرزيكاني، أمير على جيش من البرزيكان يسمون البرزينية، غلب وأخواه ونداد وغانم ابنا أحمد على أشراف نواحي الدينور وهذان ونهاوند والصيمرة وبعض أطراف أذربيجان إلى حد شهرزور نحو خمسين سنة، وكان مجدوداً حسن السياسة والسيرة ضابطاً لأمره يمنع أصحابه من التلصص وبنى قلعة سرماج بالصخور المهندمة وبنى بالدينور جامعاً على جبل وكان كثير الصدقة بالحرمين حتى مات سنة 369هـ بسرماج وافترق أولاده من بعده فاصطنع عضد الدولة من بينهم أبا النجم بدراً {cite:kamil-ibn-al-athir p. 517-518}."
  en: "Hasanwayh the Barzikani Kurd, lord of Dinawar and its marches for some fifty years; a disciplined, charitable prince who built the fortress of Sarmadaj and Dinawar's mosque; his sons scattered on his death in 369 till Adud al-Dawla raised Badr among them {cite:kamil-ibn-al-athir p. 517-518}."
  es: "Hasanwayh, el kurdo barzikani, señor de Dinawar y sus fronteras durante unos cincuenta años; un príncipe disciplinado y caritativo que construyó la fortaleza de Sarmadaj y la mezquita de Dinawar; sus hijos se dispersaron tras su muerte en 369 hasta que Adud al-Dawla erigió Badr entre ellos {cite:kamil-ibn-al-athir p. 517-518}."
  fr: "Hasanwayh le Kurde Barzikani, seigneur de Dinawar et de ses marches pendant une cinquantaine d'années; un prince discipliné et charitable qui construisit la forteresse de Sarmadaj et la mosquée de Dinawar; ses fils se dispersèrent à sa mort en 369 jusqu'à ce qu'Adud al-Dawla élève Badr parmi eux {cite:kamil-ibn-al-athir p. 517-518}."
  ur: "حسن وے برزیکانی کرد، دیناور کا آقا اور اس کے کچھ پچاس سال سے مارچ۔ ایک نظم و ضبط والا، خیراتی شہزادہ جس نے سرمدج اور دیناور کی مسجد کا قلعہ بنایا۔ اس کے بیٹے 369 میں اس کی موت کے بعد بکھر گئے یہاں تک کہ عود الدولہ نے بدر کو ان کے درمیان کھڑا کیا۔ 517-518}۔"
  tr: "Hasanawayh ibn al-Husayn al-Kurdi al-Barzikani, Barziniyya adlı bir Pers ordusunun komutanıydı. O ve kardeşleri Wandad ile Ghanem, Ahmed'in oğulları, yaklaşık elli yıl boyunca Dinur, Hadhaneh, Nahavand, al-Saymara ve Azerbaycan'ın bazı çevre bölgelerinde Şehrazur'a kadar olan soyluları domine ettiler. İyi siyaset ve davranış sahibi biriydi, disiplininde bir disiplin vardı ve yoldaşlarının onu gözetlemesini engelliyordu. Sarmaj kalesini cilalı taşlarla inşa etti ve Dinur'da bir dağda bir cami yaptı. 369 Hicri yılında Sarmaj'da ölene kadar İki Kutsal Camii'de çok hayırseverdi. Çocukları ondan sonra ayrıldı ve devletin desteğini sağladı; aralarında Abu al-Najm Badr da vardı {cite:kamil-ibn-al-athir s. 517-518}."
  id: "Hasanawayh ibn al-Husayn al-Kurdi al-Barzikani adalah seorang komandan pasukan bangsa Persia yang disebut Barziniyya. Ia bersama saudara-saudaranya, Wandad, dan Ghanem, putra Ahmad, menguasai bangsawan di wilayah Dinur, Hadhaneh, Nahavand, al-Saymara, dan beberapa pinggiran Azerbaijan hingga Shahrazur selama sekitar lima puluh tahun. Ia adalah pria yang berperilaku baik dan berdisiplin, disiplin dalam disiplinnya, mencegah teman-temannya memata-matai dirinya. Ia membangun benteng Sarmaj dengan batu-batu yang dipoles dan membangun masjid di sebuah gunung di Dinur. Ia sangat dermawan di Dua Masjid Suci hingga wafat pada tahun 369 H di Sarmaj. Anak-anaknya berpisah setelahnya, dan ia membangun dukungan negara, di antaranya Abu al-Najm Badr {cite:kamil-ibn-al-athir hlm. 517-518}."
