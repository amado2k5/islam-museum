label: { ar: "حسنويه الكردي" }
summary:
  ar: "حسنويه بن الحسين الكردي البرزيكاني، أمير على جيش من البرزيكان يسمون البرزينية، غلب وأخواه ونداد وغانم ابنا أحمد على أشراف نواحي الدينور وهذان ونهاوند والصيمرة وبعض أطراف أذربيجان إلى حد شهرزور نحو خمسين سنة، وكان مجدوداً حسن السياسة والسيرة ضابطاً لأمره يمنع أصحابه من التلصص وبنى قلعة سرماج بالصخور المهندمة وبنى بالدينور جامعاً على جبل وكان كثير الصدقة بالحرمين حتى مات سنة 369هـ بسرماج وافترق أولاده من بعده فاصطنع عضد الدولة من بينهم أبا النجم بدراً {cite:kamil-ibn-al-athir p. 517-518}."
  en: "Hasanwayh the Barzikani Kurd, lord of Dinawar and its marches for some fifty years; a disciplined, charitable prince who built the fortress of Sarmadaj and Dinawar's mosque; his sons scattered on his death in 369 till Adud al-Dawla raised Badr among them {cite:kamil-ibn-al-athir p. 517-518}."
