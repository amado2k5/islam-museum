summary:
  ar: "أباظة حسن باشا، من أسرة أباظة، أُسند إليه قيادة التركمان في آسيا الصغرى، ثم تمرّد وتولّى ولاية ديار بكر، وقُتل غدرًا في حلب بعد هزيمته مرتضى باشا قرب إيلغين سنة 1069هـ/1658م. {cite:encyclopaedia-of-islam-2 vol. 1 p. 23}"
  en: "Abaza Hasan Pasha, of the Abaza family, given command of the Turkomans of Asia Minor, who rebelled, governed Diyarbakir, defeated Murtada Pasha near Ilghin in 1069/1658, and was treacherously assassinated at Aleppo. {cite:encyclopaedia-of-islam-2 vol. 1 p. 23}"
  ur: "اباظہ حسن پاشا، اباظہ خاندان کے رکن، جنہیں آسیائے کوچک کے ترکمانوں کی سرداری ملی، پھر بغاوت کی، دیار بکر کے گورنر رہے، 1069ھ/1658ء میں ایلغین کے قریب مرتضیٰ پاشا کو شکست دی، اور حلب میں دھوکے سے قتل کیے گئے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 23}"
