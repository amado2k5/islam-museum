summary:
  ar: "مصطفى بن كمال الدين بن علي البكري الصديقي، أبو المواهب: متصوف من العلماء، خلوتي الطريقة حنفي المذهب، كثير التصانيف والرحلات والنظم، ولد في دمشق ومات بمصر، 1099 إلى 1162هـ؛ من كتبه «بلغة المريد» و«فوائد الفرائد»."
  en: "Mustafa ibn Kamal al-Din ibn Ali al-Bakri al-Siddiqi, Abu al-Mawahib: a Sufi among the scholars, Khalwati in his way and Hanafi in his school, prolific in writings, journeys and verse; born in Damascus, died in Egypt, 1099 to 1162 AH; author of «Balghat al-murid» and «Fawa'id al-fara'id»."
  es: "Mustafa ibn Kamal al-Din ibn Ali al-Bakri al-Siddiqi, Abu al-Mawahib: un sufí entre los eruditos, de tradición Khalwati y escuela Hanafi, prolífico en escritos, viajes y poesía; nació en Damasco y murió en Egipto, entre 1099 y 1162 AH; autor de «Balghat al-murid» y «Fawa'id al-fara'id»."
  fr: "Mustafa ibn Kamal al-Din ibn Ali al-Bakri al-Siddiqi, Abu al-Mawahib: soufi parmi les savants, khalwati dans sa voie et hanafite dans son école, prolifique en écrits, voyages et vers; né à Damas, mort en Égypte, 1099 à 1162 AH; auteur de « Balghat al-murid » et « Fawa'id al-fara'id »."
  ur: "مصطفیٰ بن کمال الدین ابن علی البکری الصدیقی، ابو المواحب: علماء میں ایک صوفی، اپنی راہ میں خلوطی اور اپنے مکتب میں حنفی، تصانیف، سفر اور آیت میں نمایاں؛ دمشق میں پیدا ہوئے، مصر میں وفات 1099 تا 1162 ہجری۔ \"بلغت المرید\" اور \"فوائد الفرائد\" کے مصنف۔"
  tr: "Mustafa ibn Kamal al-Din ibn Ali al-Bakri al-Siddiqi, Ebu el-Mevhib: Hanefi ekoline kapılmış, yazılar, seyahatler ve şiirlerde üretken bir Sufi alimi. Şam'da doğdu ve 1099-1162 Hicri yılları arasında Mısır'da öldü; kitapları arasında 'Balghat al-Murid al-Murid ve Fawa'id al-Fara'id' yer alır."
  id: "Mustafa ibn Kamal al-Din ibn Ali al-Bakri al-Siddiqi, Abu al-Mawahib: seorang ulama Sufi, tertutup dalam aliran pemikiran Hanafi, produktif dalam tulisan, perjalanan, dan puisi. Ia lahir di Damaskus dan meninggal di Mesir, 1099 hingga 1162 H; di antara bukunya adalah 'Balghat al-Murid al-Murid dan Fawa'id al-Fara'id'."
