summary:
  ar: "من أمراء المسلمين الشاميين وأبطالهم، كان في جيش مسلمة بن عبد الملك ومقره بأنطاكية، وعقد له مسلمة على عشرة آلاف جعلهم طلائع للجيش، وقُتل سنة 112هـ وقيل 113هـ {cite:salabi-umayyad-state-2020 p.56}. ويذكر الكتاب أن كثيراً من الأخبار المنسوبة إليه مبالغ فيها، وأن بعضها موضوع {cite:salabi-umayyad-state-2020 p.56}."
  en: "One of the Syrian Muslim commanders and champions; he served in the army of Maslama ibn Abd al-Malik, based at Antioch, and Maslama appointed him over ten thousand men whom he made the vanguard of the army. He was killed in 112 AH, or, it is said, 113 {cite:salabi-umayyad-state-2020 p.56}. The book notes that many of the reports attributed to him are exaggerated, and that some of them are fabricated {cite:salabi-umayyad-state-2020 p.56}."
