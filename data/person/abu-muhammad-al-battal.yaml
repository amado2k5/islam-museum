summary:
  ar: "من أمراء المسلمين الشاميين وأبطالهم، كان في جيش مسلمة بن عبد الملك ومقره بأنطاكية، وعقد له مسلمة على عشرة آلاف جعلهم طلائع للجيش، وقُتل سنة 112هـ وقيل 113هـ {cite:salabi-umayyad-state-2020 p.56}. ويذكر الكتاب أن كثيراً من الأخبار المنسوبة إليه مبالغ فيها، وأن بعضها موضوع {cite:salabi-umayyad-state-2020 p.56}."
  en: "One of the Syrian Muslim commanders and champions; he served in the army of Maslama ibn Abd al-Malik, based at Antioch, and Maslama appointed him over ten thousand men whom he made the vanguard of the army. He was killed in 112 AH, or, it is said, 113 {cite:salabi-umayyad-state-2020 p.56}. The book notes that many of the reports attributed to him are exaggerated, and that some of them are fabricated {cite:salabi-umayyad-state-2020 p.56}."
  fr: "L'un des commandants et champions musulmans de Syrie ; il servit dans l'armée de Maslama ibn Abd al-Malik, basée à Antioche, et Maslama le plaça à la tête de dix mille hommes dont il fit l'avant-garde de l'armée. Il fut tué en 112 H, ou, dit-on, en 113 {cite:salabi-umayyad-state-2020 p.56}. Le livre note que beaucoup des récits qui lui sont attribués sont exagérés, et que certains sont inventés {cite:salabi-umayyad-state-2020 p.56}."
  es: "Fue uno de los comandantes y campeones musulmanes sirios; sirvió en el ejército de Maslama ibn Abd al-Malik, con base en Antioquía, y Maslama le asignó el mando de más de diez mil hombres, a quienes convirtió en la vanguardia del ejército. Murió en el año 112 de la Hégira, o, según se dice, en el 113 {cite:salabi-umayyad-state-2020 p.56}. El libro señala que muchos de los relatos que se le atribuyen son exagerados, y que algunos son inventados {cite:salabi-umayyad-state-2020 p.56}."
  ur: "شام کے مسلمان کمانڈروں اور چیمپئنز میں سے ایک؛ اس نے انطاکیہ میں مقیم مسلمہ بن عبد الملک کی فوج میں خدمات انجام دیں، اور مسلمہ نے اسے دس ہزار سے زائد آدمی مقرر کیے جنہیں اس نے فوج کا سب سے آگے بنایا۔ آپ کو 112 ہجری میں قتل کیا گیا، یا کہا جاتا ہے، 113 {حوالہ: سلبی امیہ-ریاست-2020 صفحہ 56}۔ کتاب نوٹ کرتی ہے کہ ان کی طرف منسوب کئی رپورٹیں مبالغہ آرائی پر مبنی ہیں، اور ان میں سے کچھ من گھڑت ہیں {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 56}۔"
