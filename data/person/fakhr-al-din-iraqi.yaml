summary:
  ar: "فخر الدين العراقي (1213–1289) شاعر صوفي وفيلسوف من كميجان قرب همدان، مريد بهاء الدين زكريا السهروردي في ملتان وخليفته زمنًا وجيزة، ثم تلميذ صدر الدين القونوي في قونية حيث ألّف «اللمعات»، وتوفي بدمشق."
  en: "Fakhr al-Din Iraqi (1213 - 1289) was a Sufi poet and philosopher from Komjan near Hamadan, a disciple of the Suhrawardi master Baha al-Din Zakariya in Multan and briefly his successor, then a student of Sadr al-Din al-Qunawi in Konya, where he wrote the Lama'at; he died in Damascus."
  ur: "فخرالدین عراقی ⁦(1213ء – 1289ء)⁩ ہمدان کے قریب کمیجان سے تعلق رکھنے والے صوفی شاعر اور فلسفی تھے، ملتان میں بہاء الدین زکریا سہروردی کے مرید اور مختصر عرصے ان کے جانشین، پھر قونیہ میں صدر الدین قونوی کے شاگرد، جہاں انہوں نے «لمعات» لکھی؛ وفات دمشق میں ہوئی۔"
