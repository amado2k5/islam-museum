summary:
  ar: "أشعب بن جبير، من أشهر ظرفاء المدينة في أخبار المجون والنوادر، وكان حسن الصوت يغني فيجيد. يذكر النويري أن أمه كانت مولاة أسماء بنت أبي بكر، وأن أباه كان من موالي عثمان بن عفان، وأنه نشأ في دور آل أبي طالب وتولت تربيته عائشة بنت عثمان، وأنه عُمّر حتى هلك في أيام المهدي. ويذكر أنه كان أطيب أهل زمانه عشرة وأكثرهم نادرة {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}."
  en: "Ash'ab ibn Jubayr, among the best-known Medinese jesters in the anecdotes of wit, who sang well. Al-Nuwayri says his mother was a freedwoman of Asma bint Abi Bakr and his father a client of Uthman ibn Affan; that he was raised in the households of the Abu Talib family under Aisha bint Uthman; and that he lived until the reign of al-Mahdi {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}."
  ur: "اشعب بن جبیر مدینہ کے مشہور ظرفاء میں سے تھے جن کے لطائف اور نوادر مشہور ہیں، اور اچھا گاتے تھے۔ نویری بیان کرتے ہیں کہ ان کی والدہ اسماء بنت ابی بکر کی آزاد کردہ تھیں، اور ان کے والد عثمان بن عفان کے موالی میں سے تھے، اور وہ آل ابی طالب کے گھروں میں پلے بڑھے، اور عمر خلیفہ مہدی کے زمانے تک رہی {cite:nihayat-al-arab-nuwayri-vol4-scan p. 27-29}۔"
