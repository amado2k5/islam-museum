summary:
  ar: "سياسي كندي شغل منصب عمدة كالغاري ثلاث دورات (2010–2021) فكان أول مسلم يرأس بلدية مدينة كندية كبرى، وفاز بجائزة عمدة العالم سنة 2014، ثم صار زعيم الحزب الديمقراطي الجديد في ألبرتا سنة 2024 وزعيم المعارضة فيها سنة 2025."
  en: "Canadian politician who served three terms as mayor of Calgary (2010–2021), the first Muslim to lead a major Canadian city, won the World Mayor Prize in 2014, and became leader of the Alberta NDP in 2024 and Leader of the Opposition in Alberta in 2025."
  ur: "کینیڈین سیاست دان جو تین مرتبہ کیلگری کے میئر رہے (2010–2021)، کسی بڑے کینیڈین شہر کی قیادت کرنے والے پہلے مسلمان بنے، 2014 میں ورلڈ میئر پرائز جیتا، اور 2024 میں البرٹا این ڈی پی کے رہنما اور 2025 میں البرٹا میں قائد حزب اختلاف بنے۔"
