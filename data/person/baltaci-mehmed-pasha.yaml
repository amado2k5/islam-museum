summary:
  ar: "بلطه جي محمد باشا، الصدر الأعظم في عهد السلطان أحمد الثالث وقائد الجيش في حملة بروث؛ يذكر الصلابي أن الخيانة تحت فتنة المال والنساء دفعته إلى رفع الحصار عن قيصر روسيا بطرس وخليلته ومعهما مئتا ألف كادوا يقعون في الأسر، وخيانة الدولة بمعاهدة فلكزن في جمادى الآخرة ١١٢٣هـ التي أخلت آزاق للروس وتعهدت بعدم التدخل في شئون القوزاق، فعزله السلطان أحمد الثالث {cite:dawlat-uthmaniyya-salabi p. 310}."
  en: "Baltacı Mehmed Pasha — Ahmed III's grand vizier who lifted the Pruth encirclement of Tsar Peter and signed the 1711 treaty yielding Azov; the source frames it as betrayal and the sultan deposed him {cite:dawlat-uthmaniyya-salabi p. 310}."
  es: "Baltacı Mehmed Pasha — gran visir de Ahmed III que levantó el cerco del Prut al zar Pedro y firmó el tratado de 1711 que cedió Azov; la fuente lo presenta como una traición y el sultán lo depuso {cite:dawlat-uthmaniyya-salabi p. 310}."
  fr: "Baltacı Mehmed Pacha — grand vizir d'Ahmed III qui leva l'encerclement du Pruth du tsar Pierre et signa le traité de 1711 cédant Azov; la source le présente comme une trahison et le sultan le déposa {cite:dawlat-uthmaniyya-salabi p. 310}."
  ur: "Baltacı محمود پاشا — احمد III کا عظیم وزیر جس نے زار پیٹر کے پرتھ کا گھیراؤ اٹھایا اور 1711 کے معاہدے پر دستخط کیے جس سے ازوف حاصل ہوا۔ ماخذ نے اسے خیانت قرار دیا اور سلطان نے اسے معزول کر دیا۔ 310}۔"
  tr: "Baltahji Muhammed Paşa, Sultan III. Ahmed döneminde Sadrazam ve Bruth seferinde ordu komutanı; El-Salabi, zenginlik ve kadın cazibesi altında yaptığı ihanetin Rusya Çarı Peter ve eşine yönelik kuşatmayı kaldırdığını, neredeyse yakalanan iki yüz bin kişiyle birlikte ve 1123 Hicri Jumada el-Akhira'daki Vilcațen Antlaşması ile devleti ihanet ettiğini belirtir; bu antlaşma Azak'ı Ruslardan kovdu ve Kazak işlerine karışmamayı taahhüt etti. Sultan III. Ahmed onu görevden aldı {cite:dawlat-uthmaniyya-salabi s. 310}."
  id: "Baltahji Muhammad Pasha, Grand Vizier pada masa pemerintahan Sultan Ahmed III dan komandan tentara dalam kampanye Bruth; Al-Salabi menyebutkan bahwa pengkhianatan di bawah godaan kekayaan dan wanita membuatnya mengangkat pengepungan terhadap Tsar Peter dari Rusia dan pasangannya, bersama dua ratus ribu yang hampir tertangkap, serta mengkhianati negara melalui Perjanjian Vilcațen di Jumada al-Akhira 1123 H, yang mengusir Azak dari Rusia dan berjanji tidak akan ikut campur dalam urusan Cossack. Sultan Ahmed III menggulingkannya {cite:dawlat-uthmaniyya-salabi hlm. 310}."
