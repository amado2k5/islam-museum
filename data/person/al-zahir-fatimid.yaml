id: person/al-zahir-fatimid
class: person
label: { ar: "الظاهر لإعزاز دين الله علي بن الحاكم", en: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim" }
summary:
  ar: "سابع ملوك الدولة العبيدية، علي بن الحاكم، قام بعد أبيه لما قتل بحلوان سنة إحدى عشرة وأربع مئة ولقب بالظاهر لإعزاز دين الله وتضعضعت دولتهم في أيامه فخرجت عنهم حلب وأكثر الشام، ومات سنة ثمان وعشرين وأقيم ابنه المستنصر معد وهو ابن سبع سنين {cite:tarikh-khulafa-minhaj-1434 p. 639,644}. ويروي ابن الجوزي أن ست الملك بعد أن دفنت أباه المقتول على المقطم وسترت الأمر ثلاثة أيام أخرجته إلى الناس فبُويع له وألبسته تاج المعز ونصبته ولي العهد سنة ٤١١ {cite:muntazam-ibn-al-jawzi j.7 p.303-304}. وفي المنتظم أنه توفي يوم الأحد النصف من شعبان سنة سبع وعشرين وأربعمائة وكان عمره ثلاثين سنة إلا أشهرًا فكانت ولايته ست عشرة سنة وتسعة أشهر، وولي بعده ولده ولُقّب المستنصر بالله {cite:muntazam-ibn-al-jawzi j.8 p.432}."
  en: "Ali ibn al-Hakim, seventh Ubaydid caliph as al-Zahir li-I'zaz Din Allah; his rule weakened — Aleppo and most of Syria lost — and he died in 428, succeeded by his seven-year-old son al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
