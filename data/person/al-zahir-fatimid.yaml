id: person/al-zahir-fatimid
class: person
label: { ar: "الظاهر لإعزاز دين الله علي بن الحاكم", en: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim", fr: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim", es: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim", ur: "الظاہر لعزاز دین اللہ علی ابن الحکیم" }
summary:
  ar: "سابع ملوك الدولة العبيدية، علي بن الحاكم، قام بعد أبيه لما قتل بحلوان سنة إحدى عشرة وأربع مئة ولقب بالظاهر لإعزاز دين الله وتضعضعت دولتهم في أيامه فخرجت عنهم حلب وأكثر الشام، ومات سنة ثمان وعشرين وأقيم ابنه المستنصر معد وهو ابن سبع سنين {cite:tarikh-khulafa-minhaj-1434 p. 639,644}. ويروي ابن الجوزي أن ست الملك بعد أن دفنت أباه المقتول على المقطم وسترت الأمر ثلاثة أيام أخرجته إلى الناس فبُويع له وألبسته تاج المعز ونصبته ولي العهد سنة ٤١١ {cite:muntazam-ibn-al-jawzi j.7 p.303-304}. وفي المنتظم أنه توفي يوم الأحد النصف من شعبان سنة سبع وعشرين وأربعمائة وكان عمره ثلاثين سنة إلا أشهرًا فكانت ولايته ست عشرة سنة وتسعة أشهر، وولي بعده ولده ولُقّب المستنصر بالله {cite:muntazam-ibn-al-jawzi j.8 p.432}."
  en: "Ali ibn al-Hakim, seventh Ubaydid caliph as al-Zahir li-I'zaz Din Allah; his rule weakened — Aleppo and most of Syria lost — and he died in 428, succeeded by his seven-year-old son al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  fr: "Ali ibn al-Hakim, septième calife ubaydid comme al-Zahir li-I'zaz Din Allah ; son règne affaibli - Alep et la plupart de la Syrie perdue - et il est mort en 428, remplacé par son fils de sept ans al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  es: "Ali ibn al-Hakim, séptimo califa ubaydí como al-Zahir li-I'zaz Din Allah; su gobierno se debilitó —Alepo y la mayor parte de Siria se perdieron— y murió en 428, siendo sucedido por su hijo de siete años al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  ur: "علی ابن الحکیم، ساتویں عبیدیت خلیفہ الظاہر لعزاز دین اللہ؛ اس کی حکمرانی کمزور پڑ گئی - حلب اور شام کا بیشتر حصہ ہار گیا - اور اس کا انتقال 428 میں ہوا، اس کے بعد اس کا سات سالہ بیٹا المستنصر تخت نشین ہوا۔ 639,644}۔"
