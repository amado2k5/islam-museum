label: { ar: "الظاهر لإعزاز دين الله علي بن الحاكم" }
summary:
  ar: "سابع ملوك الدولة العبيدية، علي بن الحاكم، قام بعد أبيه لما قتل بحلوان سنة إحدى عشرة وأربع مئة ولقب بالظاهر لإعزاز دين الله وتضعضعت دولتهم في أيامه فخرجت عنهم حلب وأكثر الشام، ومات سنة ثمان وعشرين وأقيم ابنه المستنصر معد وهو ابن سبع سنين {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  en: "Ali ibn al-Hakim, seventh Ubaydid caliph as al-Zahir li-I'zaz Din Allah; his rule weakened — Aleppo and most of Syria lost — and he died in 428, succeeded by his seven-year-old son al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
