id: person/al-zahir-fatimid
class: person
label: { ar: "الظاهر لإعزاز دين الله علي بن الحاكم", en: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim", fr: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim", es: "al-Zahir li-I'zaz Din Allah Ali ibn al-Hakim", ur: "الظاہر لعزاز دین اللہ علی ابن الحکیم" }
summary:
  ar: "سابع ملوك الدولة العبيدية، علي بن الحاكم، قام بعد أبيه لما قتل بحلوان سنة إحدى عشرة وأربع مئة ولقب بالظاهر لإعزاز دين الله وتضعضعت دولتهم في أيامه فخرجت عنهم حلب وأكثر الشام، ومات سنة ثمان وعشرين وأقيم ابنه المستنصر معد وهو ابن سبع سنين {cite:tarikh-khulafa-minhaj-1434 p. 639,644}. ويروي ابن الجوزي أن ست الملك بعد أن دفنت أباه المقتول على المقطم وسترت الأمر ثلاثة أيام أخرجته إلى الناس فبُويع له وألبسته تاج المعز ونصبته ولي العهد سنة ٤١١ {cite:muntazam-ibn-al-jawzi j.7 p.303-304}. وفي المنتظم أنه توفي يوم الأحد النصف من شعبان سنة سبع وعشرين وأربعمائة وكان عمره ثلاثين سنة إلا أشهرًا فكانت ولايته ست عشرة سنة وتسعة أشهر، وولي بعده ولده ولُقّب المستنصر بالله {cite:muntazam-ibn-al-jawzi j.8 p.432}."
  en: "Ali ibn al-Hakim, seventh Ubaydid caliph as al-Zahir li-I'zaz Din Allah; his rule weakened — Aleppo and most of Syria lost — and he died in 428, succeeded by his seven-year-old son al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  fr: "Ali ibn al-Hakim, septième calife ubaydid comme al-Zahir li-I'zaz Din Allah ; son règne affaibli - Alep et la plupart de la Syrie perdue - et il est mort en 428, remplacé par son fils de sept ans al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  es: "Ali ibn al-Hakim, séptimo califa ubaydí como al-Zahir li-I'zaz Din Allah; su gobierno se debilitó —Alepo y la mayor parte de Siria se perdieron— y murió en 428, siendo sucedido por su hijo de siete años al-Mustansir {cite:tarikh-khulafa-minhaj-1434 p. 639,644}."
  ur: "علی ابن الحکیم، ساتویں عبیدیت خلیفہ الظاہر لعزاز دین اللہ؛ اس کی حکمرانی کمزور پڑ گئی - حلب اور شام کا بیشتر حصہ ہار گیا - اور اس کا انتقال 428 میں ہوا، اس کے بعد اس کا سات سالہ بیٹا المستنصر تخت نشین ہوا۔ 639,644}۔"
  tr: "Ubeyid hanedanının yedinci kralı Ali ibn al-Hakim, 411 Hicri yılında Helwan'da öldürüldüğünde babasının yerine geçti ve Allah'ın dinini onurlandırmak için el-Zahir lakabını aldı. Onun döneminde devletleri zayıfladı, Halep ve Levant'ın çoğu kaldı. 28 Hicri'de öldü ve oğlu el-Mustansir Ma'ad yedi yaşında büyütüldü {atıf:Tarikh-khulafa-minhaj-1434, s. 639,644}. İbn al-Jawzi, kralın karısının öldürülen babasını Mokattam'da gömdüğünü ve konuyu üç gün boyunca takip ettikten sonra, onu halka çıkardığını, ona bağlılık yemini ettiğini, el-Mu'izz'i taçlandırdığını ve 411'de veliaht prens olarak atadığını anlatır {cite:Muntazam-ibn-al-jawzi J.7, s.303-304}. Düzenli metinde, 427 Hicri yılında, Şaban ayının ortasında Pazar günü, otuz yaşında ve sadece birkaç aylıkken, hüküm sürmesi nedeniyle on altı yıl dokuz ay sürdü. Ondan sonra oğlu tahta geçti ve Al-Mustansir Billah unvanını aldı {atıf:Muntazam-ibn-al-jawzi J.8 s.432}."
  id: "Raja ketujuh dinasti Ubayid, Ali ibn al-Hakim, menggantikan ayahnya ketika ia dibunuh di Helwan pada tahun 411 H, dan dijuluki al-Zahir untuk menghormati agama Tuhan. Negara mereka melemah selama masa pemerintahannya, meninggalkan Aleppo dan sebagian besar Levant. Ia meninggal pada tahun 28 H, dan putranya al-Mustansir Ma'ad dibesarkan pada usia tujuh tahun {cite:Tarikh-khulafa-minhaj-1434, hlm. 639,644}. Ibn al-Jawzi menceritakan bahwa setelah istri raja menguburkan ayahnya yang tewas di Mokattam dan membahas masalah itu selama tiga hari, ia membawanya ke rakyat, bersumpah setia kepadanya, menobatkan al-Mu'izz, dan mengangkatnya sebagai putra mahkota pada tahun 411 {cite:Muntazam-ibn-al-jawzi J.7, hlm.303-304}. Dalam teks reguler, ia meninggal pada hari Minggu, pertengahan Sha'ban, tahun 427 H, pada usia tiga puluh tahun dan hanya beberapa bulan, sehingga masa pemerintahannya adalah enam belas tahun sembilan bulan. Setelah itu, putranya mengambil alih dan mengambil gelar Al-Mustansir Billah {cite:Muntazam-ibn-al-jawzi J.8 hlm.432}."
