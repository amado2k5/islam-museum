summary:
  ar: "عند البلاذري: محمد بن سيرين ابن سيرين الذي سبي في كنيسة عين التمر مع إخوته يحيى وأنس ومعبد — وهو أكبر أخوته — وهم موالي أنس بن مالك الأنصاري.، وعند المسعودي مات بعد الحسن البصري بمائة ليلة في سنة عشر ومائة وهو ابن إحدى وثمانين سنة، وسيرين مولى أنس بن مالك وأولاده خمسة إخوة محمد وسعيد ويحيى وخالد وأنس كلهم رووا السنن {cite:muruj-al-dhahab p. 192}"
  en: "In al-Baladhuri: Muhammad ibn Sirin, son of the Sirin taken captive in Ayn al-Tamr's church with his brothers Yahya, Anas and Ma'bad — Ma'bad the eldest — mawali of Anas ibn Malik al-Ansari."
