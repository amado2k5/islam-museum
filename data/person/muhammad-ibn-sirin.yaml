id: person/muhammad-ibn-sirin
class: person
tags: [madhahib-browser, mh-salaf, jinn-devils-browser, jd-dreams]
label: { ar: "محمد بن سيرين" }
summary:
  ar: "عند البلاذري: محمد بن سيرين ابن سيرين الذي سبي في كنيسة عين التمر مع إخوته يحيى وأنس ومعبد — وهو أكبر أخوته — وهم موالي أنس بن مالك الأنصاري. وعند المسعودي مات بعد الحسن البصري بمائة ليلة في سنة عشر ومائة وهو ابن إحدى وثمانين سنة، وسيرين مولى أنس بن مالك وأولاده خمسة إخوة محمد وسعيد ويحيى وخالد وأنس كلهم رووا السنن {cite:muruj-al-dhahab p. 192} ويذكر الكتاب أن الحسن البصري كان يقدمه على غيره، وأن عمرو بن دينار قال إنه ما رأى مثل طاوس، فرد عليه أيوب السختياني بأن ابن سيرين لو رآه لم يقل ذلك. {cite:salabi-umayyad-state-2020 p.282-283}"
  en: "In al-Baladhuri: Muhammad ibn Sirin, son of the Sirin taken captive in Ayn al-Tamr's church with his brothers Yahya, Anas and Ma'bad — Ma'bad the eldest — mawali of Anas ibn Malik al-Ansari."
  es: "En al-Baladhuri: Muhammad ibn Sirin, hijo del Sirin hecho cautivo en la iglesia de Ayn al-Tamr con sus hermanos Yahya, Anas y Ma'bad - Ma'bad el mayor - mawali de Anas ibn Malik al-Ansari."
  fr: "Dans al-Baladhuri: Muhammad ibn Sirin, fils du Sirin fait prisonnier dans l'église d'Ayn al-Tamr avec ses frères Yahya, Anas et Ma'bad — Ma'bad l'aîné — mawali d'Anas ibn Malik al-Ansari."
  ur: "البلادوری میں ہے: محمد بن سیرین، سیرین کا بیٹا اپنے بھائیوں یحییٰ، انس اور معبد کے ساتھ عین التمر کے چرچ میں اسیر ہو گیا - معبد سب سے بڑا - انس بن مالک الانصاری کے موالی۔"
  tr: "el-Baladhuri'ye göre: Muhammed bin Sirin ibn Sirin, Anas ibn Malik el-Ensari'nin özgür bırakılmış kardeşleri Yahya, Anas ve en büyük kardeşi Ma'bad ile birlikte Ayn al-Tamr kilisesinde esir alınmıştır. El-Mes'udi'ye göre, el-Hasan el-Basri'den yüz gece sonra, 100 H yılında, seksen bir yaşında ölmüştür. Sirin, Anas ibn Malik'in özgür adamıydı ve oğulları beş kardeşti—Muhammed, Seyid, Yahya, Halid ve Anas—hepsi Sünnet'i anlatıyordu {alıntı:] Muruj-al-Dhahab, s. 192}. Kitapta, el-Hasan el-Basri'nin kendisine diğerlerinden öncelik verdiği ve Amr bin Dinar'ın hiç tavus kuşu görmediğini söylediği belirtilir. Eyyüb-el-Sakhtiyani, İbn Sirin onu görseydi böyle bir şey söylemeyeceğini belirtmiştir. {alıntı:Selabi-Umayyad-devlet-2020 s.282-283}"
  id: "Menurut al-Baladhuri: Muhammad ibn Sirin ibn Sirin, yang ditawan di gereja Ain al-Tamr bersama saudara-saudaranya Yahya, Anas, dan Ma'bad—kakak sulungnya—yang merupakan mantan Anas ibn Malik al-Ansari. Menurut al-Mas'udi, ia meninggal seratus malam setelah al-Hasan al-Basri pada tahun 100 H pada usia delapan puluh satu tahun. Sirin adalah mantan Anas ibn Malik, dan putranya adalah lima saudara—Muhammad, Sa'id, Yahya, Khalid, dan Anas—semuanya menceritakan Sunan {sitasi:Muruj-al-Dhahab, hlm. 192}. Buku tersebut menyebutkan bahwa al-Hasan al-Basri dulu memberinya prioritas atas yang lain, dan Amr ibn Dinar mengatakan ia belum pernah melihat merak. Ayyub al-Sakhtiyani menjawab bahwa jika Ibn Sirin melihatnya, ia tidak akan mengatakan hal itu. {sitasi:Salabi-Umayyad-State-2020 hlm.282-283}"
