summary:
  ar: "محمد الصغير الإفراني (1669/1670–نحو 1743)، أبو عبد الله محمد بن محمد الإفراني السوسي المراكشي الملقب بالصغير، مؤرخ وكاتب سير مغربي {cite:wikipedia-muhammad-al-ifrani-en}. وُلد بمراكش في أسرة من قبيلة إفران الشلحية بحوض درعة، ودرس بها ثم بجامع القرويين بفاس، وعاد إلى مراكش مدرّساً وإماماً وخطيباً بالمسجد اليوسفي {cite:wikipedia-muhammad-al-ifrani-ar}. كتابه «نزهة الحادي» هو التاريخ المعتمد لسلاطين السعديين، سلالة أحمد المنصور، وكتابه «صفوة من انتشر» تراجم لصلحاء المغرب في القرن الحادي عشر الهجري، وله مصنف في مولاي إسماعيل وتاريخ عام للمغرب {cite:wikipedia-muhammad-al-ifrani-en}. اختُلف في سنة وفاته بمراكش بين 1742/1743 و1747 {cite:wikipedia-muhammad-al-ifrani-pt}."
  en: "Muhammad al-Ifrani (1669/1670–c. 1743), in full Abu Abdallah Muhammad ibn Muhammad al-Ifrani al-Susi al-Marrakushi and called al-Saghir, was a Moroccan historian and biographer {cite:wikipedia-muhammad-al-ifrani-en}. Born at Marrakesh into the Ifran, a Shilha tribe of the Draa basin, he studied there and then at al-Qarawiyyin in Fes, returned to teach at Marrakesh, and served as imam and khatib of its Yusufi mosque {cite:wikipedia-muhammad-al-ifrani-ar}. His Nuzhat al-Hadi is the standard chronicle of the Saadian sultans, the dynasty of Ahmad al-Mansur; his Safwat man Intashar biographies the saints of seventeenth-century Morocco; he also wrote a monograph on Moulay Ismail and a general history of Morocco {cite:wikipedia-muhammad-al-ifrani-en}. The year of his death at Marrakesh is disputed, with readings from 1742/1743 to 1747 {cite:wikipedia-muhammad-al-ifrani-pt}."
  ur: "محمد الصغیر الافرانی (1669/1670ء–تقریباً 1743ء)، پورا نام ابو عبد اللہ محمد بن محمد الافرانی السوسی المراکشی، لقب «الصغیر»، مراکشی مؤرخ اور سیرت نگار تھے {cite:wikipedia-muhammad-al-ifrani-en}۔ مراکش میں درعہ کے طاس کی شلحہ قبیلہ افران کے گھرانے میں پیدا ہوئے، وہیں اور پھر فاس کی قرویین میں تعلیم پائی، واپس آ کر مراکش میں درس دیا اور یوسفی مسجد کے امام و خطیب رہے {cite:wikipedia-muhammad-al-ifrani-ar}۔ ان کی «نزہۃ الحادی» سعدی سلاطین — احمد المنصور کے خاندان — کی معیاری تاریخ ہے اور «صفوۃ من انتشر» سترھویں صدی کے مراکشی اولیا کی سیرتیں؛ مولای اسماعیل پر بھی لکھا اور مراکش کی عمومی تاریخ بھی {cite:wikipedia-muhammad-al-ifrani-en}۔ مراکش میں ان کی وفات کا سال متنازع ہے، 1742/1743ء سے 1747ء تک روایات ہیں {cite:wikipedia-muhammad-al-ifrani-pt}۔"

