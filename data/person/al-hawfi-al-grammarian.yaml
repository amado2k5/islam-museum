summary:
  ar: "أبو الحسن علي بن إبراهيم بن سعيد الحوفي، صاحب إعراب القرآن في عشر مجلدات؛ كان إماماً في العربية والنحو والأدب وله تصانيف كثيرة، وهو تلميذ الأدفوي انتفع به أهل مصر وتخرّجوا به في النحو {cite:shadharat-dhahab p. 247}."
  en: "Abu al-Hasan Ali b. Ibrahim al-Hawfi of Egypt — author of a ten-volume I'rab al-Qur'an, imam in Arabic, grammar and letters; al-Adfawi's pupil, through whom the Egyptians trained in grammar. Died in 430 {cite:shadharat-dhahab p. 247}."
  es: "Abu al-Hasan Ali b. Ibrahim al-Hawfi de Egipto — autor de un I'rab al-Qur'an de diez volúmenes, imán de árabe, gramática y letras; discípulo de al-Adfawi, a través del cual los egipcios se formaron en gramática. Murió en 430 {cite:shadharat-dhahab p. 247}."
  fr: "Abou al-Hasan Ali b. Ibrahim al-Hawfi d'Égypte — auteur d'un I'rab al-Qur'an en dix volumes, imam en arabe, grammaire et lettres; disciple d'al-Adfawi, par qui les Égyptiens furent formés à la grammaire. Décédé en 430 av. J.-C. (cf. shadharat-dhahab, p. 247)."
  ur: "ابو الحسن علی بی۔ مصر کے ابراہیم الحوفی - دس جلدوں پر مشتمل اَرب القرآن کے مصنف، عربی، گرامر اور حروف میں امام؛ العدفوی کا شاگرد، جس کے ذریعے مصریوں نے گرامر کی تربیت حاصل کی۔ 430ء میں وفات پائی۔ 247}۔"
