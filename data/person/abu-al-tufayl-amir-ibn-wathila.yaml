id: person/abu-al-tufayl-amir-ibn-wathila
class: person
label: { ar: "أبو الطفيل", en: "Abu al-Tufayl Amir ibn Wathila" }
summary:
  ar: "عامر بن واثلة بن عبد الله بن عمرو، أبو الطفيل الليثي الكناني القرشي، صحابي مشهور بكنيته، روى عن النبي وعن أبي بكر وعمر وعلي وغيرهم، وشهد مع علي مشاهده كلها. ويذكر الكتاب أنه مات سنة مائة، وأنه آخر من مات من الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7149}"
  en: "Amir ibn Wathila ibn Abd Allah ibn Amr, Abu al-Tufayl al-Laythi, a Companion known by his kunya. He related from the Prophet and from Abu Bakr, Umar, Ali and others, and he attended all of Ali's campaigns. The book gives his death as 100 AH and calls him the last Companion to die. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7149}"
died: { edtf: "0718/0729", hijri: "0100", calendar: julian, precision: year, status: debated, derived: true, note: "مات سنة مئة عند مسلم وفي رواية الحاكم عن خليفة بن خياط؛ وقال خليفة في غيرها إنه تأخر بعد المئة؛ وقال مصعب الزبيري سنة 102؛ وجزم ابن حبان وابن قانع وأبو زكريا ابن منده بسنة 107؛ وروى وهب بن جرير عن أبيه أنه رأى جنازته بمكة سنة 110، وصححه الذهبي؛ والتحويل مشتق ويغطي السنوات 100–110 {cite:tadrib-rawi-awwama-v5 p. 224-225}", sources: [source/tadrib-rawi-awwama-v5] }
