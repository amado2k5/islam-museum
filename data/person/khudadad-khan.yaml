provenance:
  layer: own-research
  source: >-
    Built for the century-additions queue §B line 1566, whose dates
    (1835–1907) are corrected on the sources in both years: the
    English Wikipedia article 'Khudadad Khan (ruler)' (revision
    1379890714 of 12 October 2026), the Urdu article (revision
    10439052 of 15 May 2026) and Wikidata item Q133863656 (item
    revision 2491463101 of 14 May 2026) give his birth as about
    1841, and the Memoranda on the Indian States 1921 (Government of
    India, Calcutta 1922; full text read via the Internet Archive on
    31 October 2026) gives his death on 20 May 1909, a date the
    Wikipedia articles leave unknown. Existence checks before
    building: name greps for Khudadad across data/person on
    origin/main returned no record of this man (the First World War
    Victoria Cross recipient of the same name is a different man and
    has no record either), and the QID Q133863656 grep returned no
    hit. The one relation written is the parent pair with his son
    Azam Jan, attested by Azam Jan's own article ('born about 1870
    to Khudadad Khan'; infobox father field) and by his own
    article's issue list, and written here only, in the parent's
    record. No filiation is written for Khudadad himself: his
    article's infobox names Nasir Khan II as his father while its
    text and Encyclopaedia Iranica make Nasir his stepbrother and
    predecessor and Mehrab Khan II his father — a conflict, preserved
    here and not resolved into an edge. His son Mahmud Khan II has
    no person record. The khanate succession is an office, not a
    relation. No place edges are written: Kalat has no place entity.
