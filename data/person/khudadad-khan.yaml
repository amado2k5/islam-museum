summary:
  ar: "خان قلات (نحو 1841 – 20 مايو 1909): صعد العرش في السادسة عشرة سنة 1857 بعد أخيه غير الشقيق ناصر خان الثاني، وحكم — مع انقطاع سنة واحدة — حتى أجبره البريطانيون على التنازل سنة 1893، وفي عهده قامت معاهدة ماستونغ 1876 التي بُني عليها نظام ساندمان للإدارة غير المباشرة في بلوشستان، وعاش في قلات حتى وفاته سنة 1909."
  en: "Khan of Kalat (about 1841 – 20 May 1909): he came to the throne at sixteen in 1857 after his stepbrother Nasir Khan II and ruled — with one year's interruption — until the British forced his abdication in 1893; his reign saw the Mastung treaty of 1876, on which the Sandeman system of indirect rule over Balochistan was built, and he lived on at Kalat until his death in 1909."
  ur: "خانِ قلات (تقریباً 1841ء – 20 مئی 1909ء): 1857ء میں سولہ برس کی عمر میں اپنے سوتیلے بھائی ناصر خان دوم کے بعد تخت نشین ہوئے، اور ایک برس کے وقفے کے سوا 1893ء تک حکمران رہے جب انگریزوں نے انھیں دستبرداری پر مجبور کیا؛ انہی کے عہد میں 1876ء کا معاہدۂ مستونگ ہوا جس پر بلوچستان میں سینڈیمن نظامِ بالواسطہ حکومت قائم ہوا، اور وہ 1909ء میں وفات تک قلات ہی میں رہے۔"
