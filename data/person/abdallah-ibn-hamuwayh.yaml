summary:
  ar: "شيخ الشيوخ أبو القاسم عبد الله بن حمويه الجويني جد بني حمويه؛ رجل الصلاح والهدي، ثني عليه قداسة وسكينة وتديناً، كان عالماً بمعارف التصوف وأموره وأقوال القوم وشرائعهم من قبل ومن بعد، وكان ساعياً في الخير مطبخه عامراً بإطعام الفقراء والصوفية؛ مولده سنة تسع وأربعين وأربعمائة بجوين، وسمع من أبي سعيد الصفار وأبي محمد الجرجاني وعبد الغافر الفارسي وكان آخر من روى عنهم، وقال بن الزركوني بلغنا من رغبته في الدين أنه لما مرض خرج إلى خارج جامع البلد فقعد هناك فقال ما قيل لي بأن الجامع مسجد فليس لي بأن أتفل فيه؛ توفي في رمضان سنة ثلاثين وخمسمائة {cite:shadharat-dhahab p. 580-581}."
  en: "Shaykh of the shaykhs Abu al-Qasim Abdallah ibn Hamuwayh of Juwayn, forefather of the Banu Hamuwayh; a man of piety and guidance, versed in the lore of Sufism — the community's sayings and laws, early and late — ever labouring in charity, his kitchen busy feeding the poor and the Sufis; b. 449 at Juwayn, he heard from Abu Sa'id al-Saffar, Abu Muhammad al-Jurjani and Abd al-Ghafir al-Farisi and was the last to transmit from them; so scrupulous that when ill he sat outside the mosque lest he spit within it; d. Ramadan 530 {cite:shadharat-dhahab p. 580-581}."
