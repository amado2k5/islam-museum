summary:
  ar: "لاعب كرة قدم مصري، وُلد في نجريج بمحافظة الغربية سنة 1992، بدأ مع المقاولون العرب ثم تألق مع ليفربول (2017–2026) فحقق دوري أبطال أوروبا والدوري الإنجليزي وأرقاما قياسية في التهديف، وقاد منتخب مصر قائدا له في كأس العالم 2026، ويلعب منذ 2026 لطرابزون سبور التركي. هذا السجل للاعب كرة القدم، وليس للعالِم التونسي محمد صلاح بن مراد صاحب السجل المنفصل في المتحف."
  en: "Egyptian professional footballer, born in Nagrig, Gharbia, in 1992, who began at Al-Mokawloon, starred for Liverpool (2017–2026) winning the Champions League and Premier League titles and setting scoring records, captained Egypt at the 2026 World Cup, and plays for Trabzonspor in Türkiye since 2026. This record is the footballer, not the Tunisian scholar Mohamed Salah Ben Mrad, who has his own record in the museum."
  ur: "مصری پیشہ ور فٹ بالر، جو 1992 میں الغربية کے گاؤں نجریج میں پیدا ہوئے، جنہوں نے المقاولون العرب سے آغاز کیا، لیورپول (2017–2026) میں چیمپئنز لیگ اور پریمیئر لیگ جیتے اور گول اسکورنگ کے ریکارڈ بنائے، 2026 کے ورلڈ کپ میں مصر کی قیادت کی، اور 2026 سے ترکی کے ٹرابزون سپور میں کھیل رہے ہیں۔ یہ ریکارڈ فٹ بالر کا ہے۔"
  es: "Futbolista profesional egipcio, nacido en Nagrig, Gharbia, en 1992, que comenzó su carrera en el Al-Mokawloon, brilló en el Liverpool (2017-2026) ganando la Liga de Campeones y la Premier League, estableciendo récords de goles, fue capitán de Egipto en la Copa Mundial de 2026 y juega en el Trabzonspor de Turquía desde 2026. Este récord pertenece al futbolista, no al académico tunecino Mohamed Salah Ben Mrad, quien tiene su propio récord en el museo."
  fr: "Footballeur professionnel égyptien, né à Nagrig, dans la province de Gharbia, en 1992, ayant débuté à Al-Mokawloon, il a brillé à Liverpool (2017-2026), remportant la Ligue des champions et la Premier League et établissant des records de buts. Il a été capitaine de l'Égypte lors de la Coupe du monde 2026 et joue pour Trabzonspor en Turquie depuis 2026. Ce record concerne le footballeur, et non le chercheur tunisien Mohamed Salah Ben Mrad, qui possède son propre record au musée."
  tr: "1992 yılında Garbia Valiliği, Nagrig'de doğan Mısırlı futbolcu. Başlangıçta Arab Contractors'ta başladı, ardından Liverpool'da (2017–2026) parladı ve UEFA Şampiyonlar Ligi ile İngiltere Premier Ligi gol rekorları kırdı. 2026 Dünya Kupası'nda Mısır milli takımının kaptanlığını yaptı ve 2026'dan beri Türkiye'de Trabzonspor formasıyla oynuyor. Bu rekor futbolcuya ait, ancak müzede ayrı bir rekoru elinde bulunduran Tunuslu bilim insanı Mohamed Salah Ben Murad'a ait değil."
  id: "Seorang pemain sepak bola Mesir, lahir di Nagrig, Gubernur Gharbia, pada tahun 1992. Ia memulai karier di Arab Contractors dan kemudian bersinar bersama Liverpool (2017–2026), meraih rekor pencetak gol UEFA Champions League dan English Premier League. Ia menjadi kapten tim nasional Mesir sebagai kapten di Piala Dunia 2026 dan telah bermain sejak 2026 untuk Trabzonspor di Turki. Rekor ini milik sang pesepak bola, tetapi bukan milik ilmuwan Tunisia Mohamed Salah Ben Murad, yang memegang rekor terpisah di museum tersebut."
