summary:
  ar: "لاعب كرة قدم مصري، وُلد في نجريج بمحافظة الغربية سنة 1992، بدأ مع المقاولون العرب ثم تألق مع ليفربول (2017–2026) فحقق دوري أبطال أوروبا والدوري الإنجليزي وأرقاما قياسية في التهديف، وقاد منتخب مصر قائدا له في كأس العالم 2026، ويلعب منذ 2026 لطرابزون سبور التركي. هذا السجل للاعب كرة القدم، وليس للعالِم التونسي محمد صلاح بن مراد صاحب السجل المنفصل في المتحف."
  en: "Egyptian professional footballer, born in Nagrig, Gharbia, in 1992, who began at Al-Mokawloon, starred for Liverpool (2017–2026) winning the Champions League and Premier League titles and setting scoring records, captained Egypt at the 2026 World Cup, and plays for Trabzonspor in Türkiye since 2026. This record is the footballer, not the Tunisian scholar Mohamed Salah Ben Mrad, who has his own record in the museum."
  ur: "مصری پیشہ ور فٹ بالر، جو 1992 میں الغربية کے گاؤں نجریج میں پیدا ہوئے، جنہوں نے المقاولون العرب سے آغاز کیا، لیورپول (2017–2026) میں چیمپئنز لیگ اور پریمیئر لیگ جیتے اور گول اسکورنگ کے ریکارڈ بنائے، 2026 کے ورلڈ کپ میں مصر کی قیادت کی، اور 2026 سے ترکی کے ٹرابزون سپور میں کھیل رہے ہیں۔ یہ ریکارڈ فٹ بالر کا ہے۔"
