id: person/abd-al-qadir-al-rahawi
class: person
label: { ar: "عبد القادر الرهاوي", en: "Abd al-Qadir al-Rahawi", fr: "Abd al-Qadir al-Rahawi", es: "Abd al-Qadir al-Rahawi" }
summary:
  ar: "الحافظ أبو محمد عبد القادر الرهاوي الحنبلي محدث الجزيرة؛ كان مملوكاً لبعض أهل الموصل فأعتقه وحبب إليه فن الحديث فسمع الكثير؛ ولد في جمادى الآخرة سنة ست وثلاثين وخمسمائة بالرها ثم أصابه سبي لما فتح زنكي الرها سنة تسع وثلاثين فاشتراه بنو فهم الحرانيون وأعتقوه؛ سمع بأصبهان وبهمدان وبهراة وبمرو ونيسابور وسجستان وبغداد ودمشق ومصر، وصنف وجمع وله «الأربعون المتباينة الأسانيد والبلاد» وهو أمر ما سبقه إليه أحد ولا يُرجى بعده محدث لخراب البلاد؛ قال أبو شامة كان صالحاً مهيباً زاهداً خشن العيش ورعاً ناسكاً، وقال ابن خليل كان حافظاً ثبتاً كثير التصنيف ختم به الحديث؛ توفي يوم السبت ثاني جمادى الأولى سنة اثنتي عشرة وستمائة بحران {cite:shadharat-dhahab p. 50-51}."
  en: "The hafiz Abu Muhammad Abd al-Qadir al-Rahawi al-Hanbali, traditionist of al-Jazira. He had been a slave of some people of Mosul, who freed him, and he came to love the discipline of hadith and heard a great deal. He was born in Jumada al-Akhira 536 in al-Ruha; he was then taken captive when Zengi conquered al-Ruha in 539, and the Harrani Banu Fahm bought him and set him free. He heard hadith in Isfahan, Hamadhan, Herat, Merv, Nishapur, Sijistan, Baghdad, Damascus and Egypt. He wrote and compiled, and his works include al-Arba'un al-mutabayina al-asanid wa-l-bilad, a feat that no one had achieved before him and that no traditionist can be expected to match after him, given the ruin of the lands. Abu Shama said he was a righteous man, awe-inspiring, ascetic, austere in his living, scrupulous and devout; Ibn Khalil said he was a retentive, firm hafiz, prolific in writing, with whom the transmission of hadith was closed. He died on Saturday, 2 Jumada al-Ula 612, at Harran {cite:shadharat-dhahab p. 50-51}."
  fr: "Le hafiz Abu Muhammad Abd al-Qadir al-Rahawi al-Hanbali, traditionniste de la Jazira. Il avait été l'esclave de gens de Mossoul, qui l'affranchirent, et il prit goût à la discipline du hadith et en entendit beaucoup. Il naquit en jumada al-akhira 536 à al-Ruha ; il fut fait captif lorsque Zengi conquit al-Ruha en 539, et les Banu Fahm de Harran l'achetèrent et l'affranchirent. Il entendit le hadith à Ispahan, Hamadhan, Hérat, Merv, Nishapur, au Sijistan, à Bagdad, à Damas et en Égypte. Il écrivit et compila, et ses œuvres comprennent al-Arba'un al-mutabayina al-asanid wa-l-bilad, un exploit que personne n'avait accompli avant lui et qu'aucun traditionniste ne peut espérer égaler après lui, vu la ruine des pays. Abu Shama dit qu'il était un homme vertueux, imposant, ascète, austère dans sa vie, scrupuleux et dévot ; Ibn Khalil dit qu'il était un hafiz à la mémoire sûre et ferme, auteur prolifique, avec qui se clôt la transmission du hadith. Il mourut le samedi 2 jumada al-ula 612, à Harran {cite:shadharat-dhahab p. 50-51}."
  es: "El hafiz Abu Muhammad Abd al-Qadir al-Rahawi al-Hanbali, tradicionalista de al-Jazira. Había sido esclavo de algunos habitantes de Mosul, quienes lo liberaron, y llegó a amar la disciplina del hadiz y a escuchar una gran cantidad de él. Nació en Jumada al-Akhira 536 en al-Ruha; fue hecho prisionero cuando Zengi conquistó al-Ruha en 539, y los Harrani Banu Fahm lo compraron y lo liberaron. Escuchaba hadices en Isfahán, Hamadán, Herat, Merv, Nishapur, Sijistan, Bagdad, Damasco y Egipto. Escribió y compiló, y entre sus obras se encuentra al-Arba'un al-mutabayina al-asanid wa-l-bilad, una hazaña que nadie había logrado antes y que ningún tradicionalista puede igualar después de él, dada la ruina de las tierras. Abu Shama dijo que era un hombre justo, imponente, asceta, austero en su vida, escrupuloso y devoto; Ibn Khalil dijo que era un hafiz (memorialista) metódico y firme, prolífico en la escritura, con quien se cerró la transmisión de hadices. Murió el sábado 2 de Jumada al-Ula de 612 en Harran {cita: shadharat-dhahab, págs. 50-51}."
