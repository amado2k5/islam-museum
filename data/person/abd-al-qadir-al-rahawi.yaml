id: person/abd-al-qadir-al-rahawi
class: person
label: { ar: "عبد القادر الرهاوي", en: "Abd al-Qadir al-Rahawi" }
summary:
  ar: "الحافظ أبو محمد عبد القادر الرهاوي الحنبلي محدث الجزيرة؛ كان مملوكاً لبعض أهل الموصل فأعتقه وحبب إليه فن الحديث فسمع الكثير؛ ولد في جمادى الآخرة سنة ست وثلاثين وخمسمائة بالرها ثم أصابه سبي لما فتح زنكي الرها سنة تسع وثلاثين فاشتراه بنو فهم الحرانيون وأعتقوه؛ سمع بأصبهان وبهمدان وبهراة وبمرو ونيسابور وسجستان وبغداد ودمشق ومصر، وصنف وجمع وله «الأربعون المتباينة الأسانيد والبلاد» وهو أمر ما سبقه إليه أحد ولا يُرجى بعده محدث لخراب البلاد؛ قال أبو شامة كان صالحاً مهيباً زاهداً خشن العيش ورعاً ناسكاً، وقال ابن خليل كان حافظاً ثبتاً كثير التصنيف ختم به الحديث؛ توفي يوم السبت ثاني جمادى الأولى سنة اثنتي عشرة وستمائة بحران {cite:shadharat-dhahab p. 50-51}."
  en: "The hafiz Abu Muhammad Abd al-Qadir al-Rahawi al-Hanbali, traditionist of al-Jazira. He had been a slave of some people of Mosul, who freed him, and he came to love the discipline of hadith and heard a great deal. He was born in Jumada al-Akhira 536 in al-Ruha; he was then taken captive when Zengi conquered al-Ruha in 539, and the Harrani Banu Fahm bought him and set him free. He heard hadith in Isfahan, Hamadhan, Herat, Merv, Nishapur, Sijistan, Baghdad, Damascus and Egypt. He wrote and compiled, and his works include al-Arba'un al-mutabayina al-asanid wa-l-bilad, a feat that no one had achieved before him and that no traditionist can be expected to match after him, given the ruin of the lands. Abu Shama said he was a righteous man, awe-inspiring, ascetic, austere in his living, scrupulous and devout; Ibn Khalil said he was a retentive, firm hafiz, prolific in writing, with whom the transmission of hadith was closed. He died on Saturday, 2 Jumada al-Ula 612, at Harran {cite:shadharat-dhahab p. 50-51}."
