summary:
  ar: "كاتب ساع للمتوكل على الفتح بن خاقان فنفاه، وكان يتنصب ويظهر الانحراف عن علي بن أبي طالب، وقيل إنه من أبناء المجوس، هجاه الشعراء منهم أبو علي البصير وله معه ومع أبي العيناء معاتبات ومكاتبات {cite:muruj-al-dhahab p. 528-529}."
  en: "The katib whose tale-bearing broke al-Fath ibn Khaqan — lampooned as 'the zindiq who reviles the Prophet's brother' {cite:muruj-al-dhahab p. 528-529}."
  es: "El katib cuya calumnia destrozó a al-Fath ibn Khaqan — ridiculizado como 'el zindiq que insulta al hermano del Profeta' {cite:muruj-al-dhahab p. 528-529}."
  fr: "Le katib dont le récit a brisé al-Fath ibn Khaqan — raillé comme « le zindiq qui injurie le frère du Prophète » {cite: muruj-al-dhahab p. 528-529}."
  ur: "وہ کاتب جس کی کہانی نے الفتح ابن خاقان کو توڑ دیا تھا - اسے 'زندیق جو نبی کے بھائی کو گالی دیتا ہے' کے طور پر چراغ پاتا ہے {حوالہ: مروج الذہب صفحہ 528-529}۔"
  tr: "Al-Mutawakkil Ali ibn Khaqan'a sadık bir yazardı ama onu reddetti. Ali ibn Ebi Talib'den sapmış gibi görünürdü. Bilinclerin oğullarından olduğu söylenir. Şairler Abu Ali el-Basir de dahil olmak üzere onu hicvetti ve onunla Abu al-'Ina ile sitem ve yazışmalar yaşadı {atıf:muruj-al-dhahab, s. 528-529}."
  id: "Ia adalah penulis setia kepada Al-Mutawakkil Ali ibn Khaqan namun menolaknya. Ia sering tampak menyimpang dari Ali ibn Abi Talib. Dikatakan ia berasal dari anak-anak para Majus. Para penyair termasuk Abu Ali al-Basir menyindir dirinya, dan ia sering mendapat kritik dan korespondensi dengannya serta Abu al-'Ina {cite:muruj-al-dhahab, hlm. 528-529}."
