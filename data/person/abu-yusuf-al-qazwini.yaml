summary:
  ar: "أبو يوسف القزويني عبد السلام بن محمد بن يوسف بن بندار — شيخ المعتزلة وصاحب التفسير الكبير الذي يزيد على ثلاثمائة مجلد؛ درس الكلام على القاضي عبد الجبار وبائرى وسمع منه ومن أبي عمر بن مهدي الفارسي وتنقل في البلاد ودخل مصر، وكان صاحب كتب كثيرة وذكاء مفرطاً وتبحراً في المعارف إلا أنه كان داعية إلى الاعتزال؛ مات في ذي القعدة سنة ثمان وثمانين وأربعمائة وله خمس وستون سنة وأشهر {cite:shadharat-dhahab p. 385}."
  en: "Abu Yusuf al-Qazwini Abd al-Salam b. Muhammad — shaykh of the Mu'tazila and author of a tafsir exceeding three hundred volumes; studied kalam under Qadi Abd al-Jabbar, travelled widely and entered Egypt; died Dhu al-Qa'da 488 aged sixty-five {cite:shadharat-dhahab p. 385}."
