label: { ar: "أبو يوسف القزويني شيخ المعتزلة", en: "Abu Yusuf al-Qazwini, shaykh of the Mu'tazila", fr: "Abu Yusuf al-Qazwini, cheikh des mu'tazilites", es: "Abu Yusuf al-Qazwini, shaykh of the Mu'tazila", ur: "معتزلہ کے شیخ ابو یوسف القزوینی" }
summary:
  ar: "أبو يوسف القزويني عبد السلام بن محمد بن يوسف بن بندار — شيخ المعتزلة وصاحب التفسير الكبير الذي يزيد على ثلاثمائة مجلد؛ درس الكلام على القاضي عبد الجبار وبائرى وسمع منه ومن أبي عمر بن مهدي الفارسي وتنقل في البلاد ودخل مصر، وكان صاحب كتب كثيرة وذكاء مفرطاً وتبحراً في المعارف إلا أنه كان داعية إلى الاعتزال؛ مات في ذي القعدة سنة ثمان وثمانين وأربعمائة وله خمس وستون سنة وأشهر {cite:shadharat-dhahab p. 385}."
  en: "Abu Yusuf al-Qazwini Abd al-Salam b. Muhammad — shaykh of the Mu'tazila and author of a tafsir exceeding three hundred volumes; studied kalam under Qadi Abd al-Jabbar, travelled widely and entered Egypt; died Dhu al-Qa'da 488 aged sixty-five {cite:shadharat-dhahab p. 385}."
  fr: "Abu Yusuf al-Qazwini Abd al-Salam b. Muhammad, cheikh des mu'tazilites et auteur d'un tafsir dépassant trois cents volumes ; il étudia le kalam auprès du cadi Abd al-Jabbar, voyagea beaucoup et entra en Égypte ; mort en dhu al-qa'da 488 à soixante-cinq ans {cite:shadharat-dhahab p. 385}."
  es: "Abu Yusuf al-Qazwini Abd al-Salam b. Muhammad — shaykh de los Mu'tazila y autor de un tafsir de más de trescientos volúmenes; estudió kalam con Qadi Abd al-Jabbar, viajó extensamente y entró en Egipto; murió en Dhu al-Qa'da 488 a la edad de sesenta y cinco años {cite:shadharat-dhahab p. 385}."
  ur: "ابو یوسف القزوینی عبد السلام بن۔ محمد - معتزلہ کے شیخ اور تین سو جلدوں سے زیادہ کی تفسیر کے مصنف؛ قادی عبد الجبار کے زیر سایہ شاعری کا مطالعہ کیا، وسیع سفر کیا اور مصر میں داخل ہوئے۔ وفات ذوالقعدہ 488 عمر پینسٹھ 385}۔"
