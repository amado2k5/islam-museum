summary:
  ar: "محمد بن داود النسيمي المنزلاوي الشيخ الصالح، أحد المتمسكين بالسنة في أقوالهم وأفعالهم؛ ألّف رسالة سماها «طريقة الفقر المحمدي» ضبط فيها أقوال النبي وأفعاله وأحواله التي ظهرت لأمته، وكان يقول «ليس لنا شيخ إلا رسول الله»، وكان يُقري الضيوف ويخدم الفقراء والمنقطعين عنده وينظف ما تحتهم ولا يتخصص عنهم بشيء، ويُحكى أن الضيف كان ربما طرقه ليلاً ولم يكن عنده ما يقريه فيرفع القدر على النار ويضع فيه الماء ويوقد عليه فتارة يرونه أرزاً ولبناً وتارة أرزاً وحلواء وتارة لحماً ومرقاً وربما وجدوا فيه لحم الدجاج؛ توفي ببلدة النسيمية ودفن بجوار زاويته وقبره بها ظاهر يزار {cite:shadharat-dhahab p. 426-427}."
  en: "A saint of al-Manzilawa who held his community to the Prophet's words and deeds alone — 'we have no shaykh but the Messenger of God' — in his treatise Tariqat al-Faqr al-Muhammadi; he lodged and served the poor, and the tale is told of a night-guest for whom he had nothing, who watched the empty pot fill now with rice and milk, now rice and sweet, now meat and broth; buried beside his zawiya at al-Nassimiyya, his grave still visited {cite:shadharat-dhahab p. 426-427}."
