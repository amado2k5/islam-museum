summary:
  ar: "محمد بن داود النسيمي المنزلاوي الشيخ الصالح، أحد المتمسكين بالسنة في أقوالهم وأفعالهم؛ ألّف رسالة سماها «طريقة الفقر المحمدي» ضبط فيها أقوال النبي وأفعاله وأحواله التي ظهرت لأمته، وكان يقول «ليس لنا شيخ إلا رسول الله»، وكان يُقري الضيوف ويخدم الفقراء والمنقطعين عنده وينظف ما تحتهم ولا يتخصص عنهم بشيء، ويُحكى أن الضيف كان ربما طرقه ليلاً ولم يكن عنده ما يقريه فيرفع القدر على النار ويضع فيه الماء ويوقد عليه فتارة يرونه أرزاً ولبناً وتارة أرزاً وحلواء وتارة لحماً ومرقاً وربما وجدوا فيه لحم الدجاج؛ توفي ببلدة النسيمية ودفن بجوار زاويته وقبره بها ظاهر يزار {cite:shadharat-dhahab p. 426-427}."
  en: "A saint of al-Manzilawa who held his community to the Prophet's words and deeds alone — 'we have no shaykh but the Messenger of God' — in his treatise Tariqat al-Faqr al-Muhammadi; he lodged and served the poor, and the tale is told of a night-guest for whom he had nothing, who watched the empty pot fill now with rice and milk, now rice and sweet, now meat and broth; buried beside his zawiya at al-Nassimiyya, his grave still visited {cite:shadharat-dhahab p. 426-427}."
  fr: "Un saint d'al-Manzilawa qui a tenu sa communauté aux paroles et aux actes du Prophète seul - « nous n'avons pas de Cheikh, mais le Messager de Dieu » - dans son traité Tariqat al-Faqr al-Muhammadi ; Il logea et servit les pauvres, et l'histoire est racontée d'un invité de nuit pour qui il n'avait rien, qui regardait le pot vide remplir maintenant de riz et de lait, maintenant de riz et de sucre, maintenant de viande et de bouillon ; enterré à côté de sa zawiya à al-Nassimiyya, sa tombe visitait encore {cite:shadharat-dhahab p. 426-427}."
  es: "Un santo de al-Manzilawa que mantuvo a su comunidad únicamente en las palabras y los hechos del Profeta —'no tenemos más shaykh que el Mensajero de Dios'— en su tratado Tariqat al-Faqr al-Muhammadi; hospedó y sirvió a los pobres, y se cuenta la historia de un huésped nocturno para quien no tenía nada, que vio cómo la olla vacía se llenaba ahora con arroz y leche, ahora con arroz y dulces, ahora con carne y caldo; enterrado junto a su zawiya en al-Nassimiyya, su tumba aún es visitada {cite:shadharat-dhahab p. 426-427}."
  ur: "المنزلوا کا ایک ولی جس نے اپنی برادری کو صرف نبی کے قول و فعل پر رکھا - 'ہمارا کوئی شیخ نہیں مگر رسول اللہ' - اپنی کتاب طریقت الفقر المحمدی میں؛ اس نے قیام کیا اور غریبوں کی خدمت کی، اور کہانی ایک رات کے مہمان کی ہے جس کے لیے اس کے پاس کچھ نہیں تھا، جس نے خالی برتن کو چاول اور دودھ سے بھرتے دیکھا، اب چاول اور میٹھا، اب گوشت اور شوربہ؛ النسیمیہ میں اپنے زاویہ کے پاس دفن ہونے کے بعد بھی ان کی قبر کی زیارت ہوتی ہے۔ 426-427}۔"
