summary:
  ar: "تاجر ومحسن بارسي من كراتشي (1842–1914)، نشأ فقيرًا فصار أكبر مالك للأراضي في المدينة بثروة جمعها من مقاولات الجيش البريطاني واستثمارات الأراضي والمصانع، وأنفق بسخاء على المستشفيات والمدارس لجميع الطوائف، فكان أول من نال وسام رفيق إمبراطورية الهند في كراتشي."
  en: "Karachi Parsi merchant and philanthropist (1842–1914) who rose from poverty to become the city's largest landowner, on a fortune made in British Army contracting and in land and factories, and who gave lavishly to hospitals and schools for all communities; he was the first person in Karachi appointed a Companion of the Order of the Indian Empire."
  ur: "کراچی کے پارسی تاجر اور فلاح کار (1842–1914)، جو غربت سے اٹھ کر شہر کے سب سے بڑے زمیندار بنے؛ ان کی دولت برطانوی فوج کی ٹھیکیداری اور زمین و کارخانوں میں سرمایہ کاری سے بنی، اور انھوں نے تمام برادریوں کے لیے اسپتالوں اور اسکولوں پر دل کھول کر خرچ کیا؛ وہ کراچی کے پہلے شخص تھے جنھیں کمپینین آف دی آرڈر آف دی انڈین ایمپائر بنایا گیا۔"
