label:
  ar: عبد الله بن الحسين الفطيمي
  en: Abdullah ibn al-Husayn al-Futayimi
  ur: عبد اللہ بن الحسین الفطیمی
summary:
  ar: أحد الفرسان السبعة الذين كانوا مع الهادي في المحجة عند أثافت يوم 14 شوال 285هـ بحسب الكتاب، بنسبة «الفطيمي» كما طبعت، ولا يُظن به أخو الهادي عبد الله بن الحسين.
  en: One of the seven horsemen with al-Hadi in the main track at Athafit on 14 Shawwal 285 AH, by the book's account, with the nisba "al-Futayimi" as printed; not to be taken for al-Hadi's brother Abdullah ibn al-Husayn.
  ur: وہ سات سواروں میں سے ایک جو کتاب کے مطابق 14 شوال 285ھ کو اثافت میں بڑی راہ میں ہادی کے ساتھ تھے، نسبت «الفطیمی» جیسی چھپی ہے؛ انہیں ہادی کے بھائی عبد اللہ بن الحسین سمجھنا درست نہیں۔
