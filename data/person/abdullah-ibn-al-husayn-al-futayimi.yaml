id: person/abdullah-ibn-al-husayn-al-futayimi
class: person
label:
  ar: عبد الله بن الحسين الفطيمي
  en: Abdullah ibn al-Husayn al-Futayimi
  ur: عبد اللہ بن الحسین الفطیمی
  fr: "Abdullah ibn al-Husayn al-Futayimi"
  es: "Abdullah ibn al-Husayn al-Futayimi"
summary:
  ar: أحد الفرسان السبعة الذين كانوا مع الهادي في المحجة عند أثافت يوم 14 شوال 285هـ بحسب الكتاب، بنسبة «الفطيمي» كما طبعت، ولا يُظن به أخو الهادي عبد الله بن الحسين.
  en: One of the seven horsemen with al-Hadi in the main track at Athafit on 14 Shawwal 285 AH, by the book's account, with the nisba "al-Futayimi" as printed; not to be taken for al-Hadi's brother Abdullah ibn al-Husayn.
  ur: وہ سات سواروں میں سے ایک جو کتاب کے مطابق 14 شوال 285ھ کو اثافت میں بڑی راہ میں ہادی کے ساتھ تھے، نسبت «الفطیمی» جیسی چھپی ہے؛ انہیں ہادی کے بھائی عبد اللہ بن الحسین سمجھنا درست نہیں۔
  fr: "L'un des sept cavaliers aux côtés d'al-Hadi sur la voie principale à Athafit le 14 shawwal 285 H, selon le récit du livre, avec la nisba « al-Futayimi » telle qu'imprimée ; à ne pas confondre avec le frère d'al-Hadi, Abdullah ibn al-Husayn."
  es: "Uno de los siete jinetes que acompañaban a al-Hadi en la pista principal de Athafit el 14 de Shawwal del año 285 de la Hégira, según el relato del libro, con la nisba \"al-Futayimi\" tal como aparece impresa; no debe confundirse con el hermano de al-Hadi, Abdullah ibn al-Husayn."
  tr: "Kitaba göre, Hicri 285 yılının Şevval ayının 14'ünde Athafat yolunda Al-Hadi ile birlikte olan yedi atlıdan biri olan ve basıldığı şekliyle \"Al-Fatimi\" soyundan gelen Abdullah bin Al-Hussein'in Al-Hadi'nin kardeşi olduğu düşünülmemektedir."
  id: "Salah satu dari tujuh penunggang kuda yang bersama Al-Hadi di jalan menuju Athafat pada tanggal 14 Syawal 285 H, menurut kitab tersebut, dengan garis keturunan “Al-Fatimi” sebagaimana yang tertulis, dan tidak dianggap bahwa dia adalah saudara Al-Hadi, Abdullah bin Al-Hussein."
