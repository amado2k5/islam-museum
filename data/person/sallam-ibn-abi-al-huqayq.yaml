summary:
  en: "A wealthy Jewish merchant of Banu al-Nadir settled in Khaybar; one of the primary instigators and financiers who traveled to Mecca and Ghatafan to forge the confederate alliance (al-Ahzab) against Medina; assassinated in his fortified residence by a Muslim covert squad led by Abdullah ibn Atik."
  ar: "تاجر أهل الحجاز ووجيه بني النضير المستقر بخيبر؛ كان رأس المحرضين والممولين الذين خرجوا إلى قريش وغطفان فجمعوا الأحزاب على غزو المدينة؛ قتله خمسة من أبطال الخزرج بقيادة عبد الله بن عتيك في مخدعه بحصن خيبر."
  es: "Un acaudalado comerciante judío de Banu al-Nadir se estableció en Khaybar; fue uno de los principales instigadores y financiadores que viajaron a La Meca y Ghatafan para forjar la alianza confederada (al-Ahzab) contra Medina; fue asesinado en su residencia fortificada por un escuadrón secreto musulmán liderado por Abdullah ibn Atik."
  fr: "Un riche marchand juif de Banu al-Nadir s'était installé à Khaybar; l'un des principaux instigateurs et financiers qui se rendirent à La Mecque et à Ghatafan pour forger l'alliance confédérée (al-Ahzab) contre Médine; assassiné dans sa résidence fortifiée par une escouade secrète musulmane dirigée par Abdullah ibn Atik."
