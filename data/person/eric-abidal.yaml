summary:
  ar: "لاعب كرة قدم فرنسي معتزل، وُلد في سان جوني لافال بفرنسا سنة 1979. ظهير أيسر وقلب دفاع لعب أساسًا لليون وبرشلونة، وفاز مع الناديين بـ19 لقبًا منها دوري أبطال أوروبا مرتين مع برشلونة، وخاض 67 مباراة مع منتخب فرنسا. وطبع أواخر مسيرته ورم في الكبد وزراعة كبد. نشأ في عائلة كاثوليكية واعتنق الإسلام في عشرينياته."
  en: "French retired footballer, born in Saint-Genis-Laval, France in 1979. A left-back and centre-back who played mainly for Lyon and Barcelona, winning 19 trophies with the two clubs, including two Champions Leagues with Barcelona, and winning 67 caps for France. His later career was marked by a liver tumour and a transplant. Raised in a Catholic family, he converted to Islam in his twenties."
  ur: "فرانسیسی ریٹائرڈ فٹبالر، 1979 میں فرانس کے سینٹ جینس لاوال میں پیدا ہوئے۔ لیفٹ بیک اور سینٹر بیک جنہوں نے زیادہ تر لیون اور بارسلونا کے لیے کھیلا، دونوں کلبوں کے ساتھ 19 ٹرافیاں جیتیں جن میں بارسلونا کے ساتھ دو چیمپئنز لیگ شامل ہیں، اور فرانس کے لیے 67 میچ کھیلے۔ ان کے بعد کے کیریئر پر جگر کے رسولی اور پیوندکاری کا سایہ رہا۔ کیتھولک خاندان میں پرورش پائی اور بیس کی دہائی میں اسلام قبول کیا۔"
