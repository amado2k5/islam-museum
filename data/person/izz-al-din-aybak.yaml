summary:
  ar: "نائب شجر الدر ثم سلطان مصر، استقل بالسلطنة في ربيع الآخر سنة ثمان وأربعين ولقب الملك المعز وحلف العسكر للملك الأشرف وله ثمان سنين وبقي أتابكه ثم أبطل اسمه سنة اثنتين وخمسين واستقل، وقتلته زوجته شجر الدر سنة خمس وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 709-710}. وفي شذرات الذهب: شاع الخبر أنه يتزوج بابنة صاحب الموصل فعظم ذلك على شجر الدر وعزمت على الفتك به، فركب للعب الكرة ودخل الحمام يغتسل فلما صار عرياناً رمته الخدام إلى الأرض وخنقوه ليلاً، وكان عفيفاً طاهر الذيل لا يمنع أحداً حاجة ولا يشرب مسكراً كثير المداراة للأمراء، وبنى المدرسة المعزية على النيل {cite:shadharat-dhahab p. 275-276}."
  en: "Shajar al-Durr's deputy then Egypt's sultan as al-Mu'izz from 648 — first behind the boy al-Ashraf, alone from 652; his wife killed him in 655 {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
  es: "El lugarteniente de Shajar al-Durr, luego sultán de Egipto como al-Mu'izz desde 648, primero detrás del niño al-Ashraf, solo desde 652; su esposa lo mató en 655 {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
  fr: "Le vice-président de Shajar al-Durr, puis sultan d'Égypte sous le nom d'al-Mu'izz à partir de 648 — d'abord derrière le jeune al-Ashraf, seul à partir de 652; sa femme le tua en 655 {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
  ur: "شجر الدر کا نائب پھر مصر کا سلطان المعز 648 سے - پہلے لڑکا الاشرف کے پیچھے، 652 سے تنہا؛ اس کی بیوی نے اسے 655 میں قتل کر دیا۔ 709-710}۔"
  tr: "O dönemde Mısır Sultanı olan Şacar al-Durr'un vekiliydi; Shajar 48 yılında Rabi'al-Thani'de bağımsızlığını kazandı, Kral al-Mu'izz unvanı verildi ve sekiz yıl boyunca Kral el-Eşref ile askeri ittifak yemini etti. Atabeg olarak kaldı, ardından 1952'de adı kaldırıldı ve bağımsız oldu. Eşi Şacar el-Dürr onu 1955'te öldürdü {alıntı: Tarih-Khulafa-minhaj-1434, s. 709-710}. Shadharat al-Dhahab'da: Musul hükümdarının kızıyla evlendiği yayıldı, bu durum Shajar al-Durr'u çok etkiledi ve onu öldürmeye kararlıydı. Top oynamak için at sürdü ve yıkanmak için hamama girdi. Çıplak olduğunda, hizmetçiler onu yere attı ve gece boğdular. Temiz ve saf kuyrukluydu, kimsenin ihtiyaçlarını engellemiyordu ve prenslere karşı çok hoşgörülü bir şekilde alkol içerdi. Nil üzerinde Mu'ziziyah okulunu inşa etti {cite:shadharat-dhahab, s. 275-276}."
  id: "Ia adalah wakil Shajar al-Durr, yang saat itu menjadi Sultan Mesir, yang merdeka di Rabi' al-Thani pada tahun 48, diberi gelar Raja al-Mu'izz, dan bersumpah aliansi militer kepada Raja al-Ashraf selama delapan tahun. Ia tetap menjadi Atabeg, kemudian namanya dihapuskan pada tahun 1952 dan ia menjadi merdeka. Istrinya Shajar al-Durr membunuhnya pada tahun 1955 {cite:Sejarah-Khulafa-minhaj-1434, hlm. 709-710}. Dalam Shadharat al-Dhahab: Tersebar bahwa ia menikahi putri penguasa Mosul, yang sangat memengaruhi Shajar al-Durr, yang bertekad membunuhnya. Ia menunggang kuda untuk bermain bola dan masuk ke pemandian untuk mandi. Ketika ia telanjang, para pelayan melemparkannya ke tanah dan mencekiknya pada malam hari. Ia suci dan berekor murni, tidak menghalangi kebutuhan siapa pun, dan minum alkohol dengan sangat toleran kepada para pangeran. Ia membangun sekolah Mu'ziziyah di Sungai Nil {cite:shadharat-dhahab, hlm. 275-276}."
