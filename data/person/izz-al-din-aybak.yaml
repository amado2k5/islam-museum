summary:
  ar: "نائب شجر الدر ثم سلطان مصر، استقل بالسلطنة في ربيع الآخر سنة ثمان وأربعين ولقب الملك المعز وحلف العسكر للملك الأشرف وله ثمان سنين وبقي أتابكه ثم أبطل اسمه سنة اثنتين وخمسين واستقل، وقتلته زوجته شجر الدر سنة خمس وخمسين {cite:tarikh-khulafa-minhaj-1434 p. 709-710}. وفي شذرات الذهب: شاع الخبر أنه يتزوج بابنة صاحب الموصل فعظم ذلك على شجر الدر وعزمت على الفتك به، فركب للعب الكرة ودخل الحمام يغتسل فلما صار عرياناً رمته الخدام إلى الأرض وخنقوه ليلاً، وكان عفيفاً طاهر الذيل لا يمنع أحداً حاجة ولا يشرب مسكراً كثير المداراة للأمراء، وبنى المدرسة المعزية على النيل {cite:shadharat-dhahab p. 275-276}."
  en: "Shajar al-Durr's deputy then Egypt's sultan as al-Mu'izz from 648 — first behind the boy al-Ashraf, alone from 652; his wife killed him in 655 {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
