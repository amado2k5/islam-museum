summary:
  ar: "إبراهيم قالن ⁦(وُلد في 15 أيلول 1971 في إسطنبول)⁩ أكاديمي تركي متخصص في الفلسفة الإسلامية ورئيس جهاز الاستخبارات الوطنية منذ حزيران 2023. تتلمذ على سيد حسين نصر وكتب دراسة مرجعية في نظرية المعرفة عند ملا صدرا، وأسس مؤسسة سيتا، وكان المتحدث باسم الرئيس أردوغان ومستشاره الأول من 2014 إلى 2023؛ وهو أيضًا عازف باغلاما وملحن."
  en: "İbrahim Kalın (born 15 September 1971 in Istanbul) is a Turkish academic of Islamic philosophy and intelligence chief, director of the National Intelligence Organization since June 2023. A student of Seyyed Hossein Nasr, he wrote the standard study of Mulla Sadra's epistemology, founded the SETA think tank, and served as President Erdoğan's spokesperson and senior adviser from 2014 to 2023; he is also a bağlama player and composer."
  ur: "ابراہیم قالن ⁦(پیدائش 15 ستمبر 1971، استنبول)⁩ ترک ماہر اسلامی فلسفہ اور انٹیلیجنس سربراہ ہیں، جون 2023 سے قومی انٹیلیجنس تنظیم کے ڈائریکٹر۔ وہ سید حسین نصر کے شاگرد ہیں، ملا صدرا پر ان کی کتاب مرجع ہے، انھوں نے سیٹا تھنک ٹینک قائم کیا اور 2014 سے 2023 تک صدر ایردوان کے ترجمان و مشیر رہے۔"
  es: "İbrahim Kalın (nacido el 15 de septiembre de 1971 en Estambul) es un académico turco de filosofía islámica y jefe de inteligencia, director de la Organización Nacional de Inteligencia desde junio de 2023. Discípulo de Seyyed Hossein Nasr, escribió el estudio de referencia sobre la epistemología de Mulla Sadra, fundó el grupo de expertos SETA y fue portavoz y asesor principal del presidente Erdoğan entre 2014 y 2023; además, toca el bağlama y compone."
  fr: "İbrahim Kalın (né le 15 septembre 1971 à Istanbul) est un universitaire turc spécialiste de philosophie islamique et chef du renseignement, directeur de l'Organisation nationale du renseignement depuis juin 2023. Élève de Seyyed Hossein Nasr, il a écrit l'étude de référence sur l'épistémologie de Mulla Sadra, a fondé le think tank SETA et a été le porte-parole et le conseiller principal du président Erdoğan de 2014 à 2023; il est également joueur de bağlama et compositeur."
  tr: "İbrahim Kalin (15 Eylül 1971, İstanbul doğumlu), İslam felsefesi alanında uzmanlaşmış ve Haziran 2023'ten beri Ulusal İstihbarat Servisi'nin başkanı olan Türk akademisyesidir. Seyyid Hüseyin Nasr'ın öğrencisi olmuş ve Molla Sadra'nın yanında bilgi teorisi üzerine bir başvuru çalışması yazmış, SITA Vakfı'nı kurdu ve 2014-2023 yılları arasında Cumhurbaşkanı Erdoğan'ın sözcüsü ve baş danışmanı olarak görev yapmıştır; aynı zamanda bir pālama çalıcı ve bestecidir."
  id: "İbrahim Kalin (lahir 15 September 1971 di Istanbul) adalah seorang akademisi Turki yang mengkhususkan diri dalam filsafat Islam dan kepala Dinas Intelijen Nasional sejak Juni 2023. Ia belajar di bawah bimbingan Seyyed Huseyin Nasr dan menulis studi referensi tentang teori pengetahuan di bawah bimbingan Mulla Sadra, mendirikan Yayasan SITA, dan menjadi juru bicara serta penasihat utama Presiden Erdoğan dari tahun 2014 hingga 2023; ia juga seorang pemain pālama dan komposer."
