summary:
  ar: "إبراهيم قالن ⁦(وُلد في 15 أيلول 1971 في إسطنبول)⁩ أكاديمي تركي متخصص في الفلسفة الإسلامية ورئيس جهاز الاستخبارات الوطنية منذ حزيران 2023. تتلمذ على سيد حسين نصر وكتب دراسة مرجعية في نظرية المعرفة عند ملا صدرا، وأسس مؤسسة سيتا، وكان المتحدث باسم الرئيس أردوغان ومستشاره الأول من 2014 إلى 2023؛ وهو أيضًا عازف باغلاما وملحن."
  en: "İbrahim Kalın (born 15 September 1971 in Istanbul) is a Turkish academic of Islamic philosophy and intelligence chief, director of the National Intelligence Organization since June 2023. A student of Seyyed Hossein Nasr, he wrote the standard study of Mulla Sadra's epistemology, founded the SETA think tank, and served as President Erdoğan's spokesperson and senior adviser from 2014 to 2023; he is also a bağlama player and composer."
  ur: "ابراہیم قالن (پیدائش 15 ستمبر 1971، استنبول) ترک ماہر اسلامی فلسفہ اور انٹیلیجنس سربراہ ہیں، جون 2023 سے قومی انٹیلیجنس تنظیم کے ڈائریکٹر۔ وہ سید حسین نصر کے شاگرد ہیں، ملا صدرا پر ان کی کتاب مرجع ہے، انھوں نے سیٹا تھنک ٹینک قائم کیا اور 2014 سے 2023 تک صدر ایردوان کے ترجمان و مشیر رہے۔"
