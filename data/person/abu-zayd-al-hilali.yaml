gender: male
summary:
  ar: "البطل الأسطوري في سير بني هلال، ابن رزق حاكم بلاد السرو، يُروى أنه قُتل غدرًا في المغرب على يد دياب ثم أُخذ له بالثأر؛ ولم يُعثر على دليل وثائقي على أنه شخصية تاريخية."
  en: "The legendary hero of the Banu Hilal romances, son of Rizq, ruler of the Bilad al-Sarw. In the romances he is killed treacherously in the Maghrib by Diyab and avenged; no documentary evidence shows he was a historical figure {cite:encyclopaedia-of-islam-2 vol. 1 p. 186}."
  fr: "Héros légendaire des récits des Banu Hilal, fils de Rizq, souverain du Bilad al-Sarw. Dans les récits, Diyab le tue par traîtrise au Maghreb, puis il est vengé ; aucun document n'établit qu'il ait été un personnage historique {cite:encyclopaedia-of-islam-2 vol. 1 p. 186}."
  es: "El legendario héroe de los romances de Banu Hilal, hijo de Rizq, gobernante de Bilad al-Sarw. En los romances, Diyab lo asesina a traición en el Magreb y su muerte es vengada; no existe evidencia documental que demuestre que fuera una figura histórica {cite:encyclopaedia-of-islam-2 vol. 1 p. 186}."
