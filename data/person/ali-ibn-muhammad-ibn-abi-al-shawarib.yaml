summary:
  ar: "قاضٍ من آل أبي الشوارب، كتب مع أبي خازم القاضي سنة ثلاث وثمانين ومائتين بردّ الفاضل من سهام المواريث إلى ذوي الأرحام مستندين إلى اتفاق عمر وعلي وابن مسعود، فأمر المعتضد بالعمل بقولهما، ثم خُلع عليه لقضاء مدينة المنصور وقطربل مضافًا إلى حكمه بسر من رأى وتكريت وطريق الموصل {cite:muntazam-ibn-al-jawzi p. 162-163}."
  en: "A judge of the Banu Abi'l-Shawarib; in 283 he and Abu Khazim wrote that the residue of inheritance shares returns to blood kin, which al-Mu'tadid enacted, and he was then invested with the judgeship of Madinat al-Mansur, Qatrabbul, Samarra, Takrit and the Mosul road {cite:muntazam-ibn-al-jawzi p. 162-163}."
