id: person/ali-ibn-muhammad-ibn-abi-al-shawarib
class: person
label: { ar: "علي بن محمد بن أبي الشوارب", en: "Ali ibn Muhammad ibn Abi'l-Shawarib", es: "Ali ibn Muhammad ibn Abi'l-Shawarib", fr: "Ali ibn Muhammad ibn Abi'l-Shawarib", ur: "علی بن محمد ابن ابی الشواریب" }
roles: [jurist, scholar]
gender: male
summary:
  ar: "قاضٍ من آل أبي الشوارب، كتب مع أبي خازم القاضي سنة ثلاث وثمانين ومائتين بردّ الفاضل من سهام المواريث إلى ذوي الأرحام مستندين إلى اتفاق عمر وعلي وابن مسعود، فأمر المعتضد بالعمل بقولهما، ثم خُلع عليه لقضاء مدينة المنصور وقطربل مضافًا إلى حكمه بسر من رأى وتكريت وطريق الموصل {cite:muntazam-ibn-al-jawzi p. 162-163}."
  en: "A judge of the Banu Abi'l-Shawarib; in 283 he and Abu Khazim wrote that the residue of inheritance shares returns to blood kin, which al-Mu'tadid enacted, and he was then invested with the judgeship of Madinat al-Mansur, Qatrabbul, Samarra, Takrit and the Mosul road {cite:muntazam-ibn-al-jawzi p. 162-163}."
  es: "Un juez de los Banu Abi'l-Shawarib; en 283 él y Abu Khazim escribieron que el remanente de las participaciones de la herencia regresa a los parientes consanguíneos, lo cual al-Mu'tadid promulgó, y luego fue investido con el cargo de juez de Madinat al-Mansur, Qatrabbul, Samarra, Takrit y el camino de Mosul {cite:muntazam-ibn-al-jawzi p. 162-163}."
  fr: "Juge des Banu Abi'l-Shawarib; en 283, lui et Abu Khazim écrivirent que le reste des parts d'héritage revient aux parents du sang, ce qu'al-Mu'tadid promulgua, et il fut alors investi de la charge de juge de Madinat al-Mansur, Qatrabbul, Samarra, Takrit et de la route de Mossoul {cite:muntazam-ibn-al-jawzi p. 162-163}."
  ur: "بنو ابی الشعارب کے قاضی؛ 283 میں اس نے اور ابو خزیم نے لکھا ہے کہ وراثت کے حصص کی باقیات خونی رشتہ داروں کو واپس آتی ہیں، جسے المتدید نے نافذ کیا، اور اس کے بعد اسے مدینۃ المنصور، قطربل، سامراء، تکریت اور موصل روڈ کے قاضیوں کے ساتھ لگا دیا گیا۔ 162-163}۔"
  tr: "Ebu el-Şawarib ailesinden bir yargıç olarak, 283 Hicri yılında hakim Ebu Hazim ile birlikte yazdı; erdemli miras paylarını akrabaların akrabalarına geri verdi; bu, Umer, Ali ve İbn Mes'ud'un anlaşmasına dayandı. El-Mu'tadid onlara sözlerine göre hareket etmelerini emretti, ardından Mansur ve Qutarbal şehirlerini yargılamak üzere görevden alındı; bu da hükümüne görenlerin gizliliği, Tikrit ve Musul yolu üzerinde bir hüküm ekledi {atıf:Muntazam-ibn-al-jawzi, s. 162-163}."
  id: "Sebagai hakim dari keluarga Abu al-Shawarib, ia menulis bersama Abu Khazim sebagai hakim pada tahun 283 H, mengembalikan bagian warisan yang mulia kepada kerabat kerabat, dengan mengandalkan persetujuan Umar, Ali, dan Ibn Mas'ud. Al-Mu'tadid memerintahkan mereka untuk bertindak sesuai kata-kata mereka, kemudian ia dicopot untuk mengadili kota Mansur dan Qutarbal, menambah keputusannya secara rahasia bagi mereka yang melihatnya, Tikrit, dan jalan Mosul {cite:Muntazam-ibn-al-jawzi, hlm. 162-163}."
