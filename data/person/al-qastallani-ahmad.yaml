summary:
  ar: "أبو العباس أحمد بن علي القسطلاني، الفقيه المالكي الزاهد القدوة، تلميذ الشيخ أبي عبد الله القرشي؛ سمع من عبد الله بن بري ودرّس بمصر وأفتى ثم جاور بمكة مدة وتزوج بعد موت شيخه زوجته الصالحة الجليلة أم ولده قطب الدين؛ حكى أن أهل المدينة أجدبوا فاستسقى أهل المدينة يومهم فلم يُسقوا ثم عمل طعاماً للضعفاء واستسقى مع المجاورين فسُقوا؛ وله مؤلف جمع فيه كلام شيخه القرشي وكراماته {cite:shadharat-dhahab p. 187}، وهو الجزء الكبير الذي وقف عليه ابن خلكان ونقل منه {cite:wafayat-ayan}."
  en: "The Maliki ascetic of Mecca (d. Jumada II 636) — the mujawir whose rain prayer with the weak was answered when the Medinans' own day was not; compiled his shaykh al-Qurashi's sayings and karamat; grave visited in the Shi'b al-Aysar {cite:shadharat-dhahab p. 187}; Ibn Khallikan read and quoted that large volume {cite:wafayat-ayan}."
