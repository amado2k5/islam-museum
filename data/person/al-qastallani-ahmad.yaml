summary:
  ar: "أبو العباس أحمد بن علي القسطلاني، الفقيه المالكي الزاهد القدوة، تلميذ الشيخ أبي عبد الله القرشي؛ سمع من عبد الله بن بري ودرّس بمصر وأفتى ثم جاور بمكة مدة وتزوج بعد موت شيخه زوجته الصالحة الجليلة أم ولده قطب الدين؛ حكى أن أهل المدينة أجدبوا فاستسقى أهل المدينة يومهم فلم يُسقوا ثم عمل طعاماً للضعفاء واستسقى مع المجاورين فسُقوا؛ وله مؤلف جمع فيه كلام شيخه القرشي وكراماته {cite:shadharat-dhahab p. 187}، وهو الجزء الكبير الذي وقف عليه ابن خلكان ونقل منه {cite:wafayat-ayan}."
  en: "The Maliki ascetic of Mecca (d. Jumada II 636) — the mujawir whose rain prayer with the weak was answered when the Medinans' own day was not; compiled his shaykh al-Qurashi's sayings and karamat; grave visited in the Shi'b al-Aysar {cite:shadharat-dhahab p. 187}; Ibn Khallikan read and quoted that large volume {cite:wafayat-ayan}."
  fr: "L'ascète Maliki de La Mecque (d. Jumada II 636) - le mujawir dont la prière de pluie avec les faibles a été répondu quand le jour des Médinans n'était pas ; compilé ses paroles et karamat de shaykh al-Qurashi ; tombe visitée dans le Shi'b al-Aysar {cite:shadharat-dhahab p. 187}Ibn Khallikan a lu et cité ce grand volume {cite:wafayat-ayan}."
  es: "El asceta malikí de La Meca (m. Jumada II 636) — el mujawir cuya oración por la lluvia con los débiles fue respondida cuando el propio día de los medinenses no lo fue; recopiló los dichos y karamat de su shaykh al-Qurashi; tumba visitada en el Shi'b al-Aysar {cite:shadharat-dhahab p. 187}; Ibn Khallikan leyó y citó ese gran volumen {cite:wafayat-ayan}."
  ur: "مکہ کے مالکی بزرگ ⁦(متوفی جمادی الثانی 636)⁩ - وہ مجاور جس کی بارش کی دعا کمزوروں کے ساتھ اس وقت قبول ہوئی جب مدینہ والوں کا اپنا دن نہیں تھا۔ اپنے شیخ القرشی کے اقوال اور کرامت کو مرتب کیا۔ شعب الایسر میں قبر کی زیارت کی گئی 187}؛ ابن خلیقان نے اس بڑی جلد کو پڑھا اور نقل کیا ہے۔"
  tr: "Malikli hukukçu, münzevi ve örnek alim Ebu el-Abbas Ahmed ibn Ali el-Qastalani, Şeyh Ebu Abdullah el-Kuraşi'nin öğrencisi; Abdullah ibn Bari'den haber aldı, Mısır'da eğitim gördü, fetvalar verdi, bir süre Mekke yakınlarında yaşadı ve şeyhinin ölümünden sonra oğlu Kutsubdin'in annesi olan doğru eşiyle evlendi. Medine halkının bard olduğunu, bu yüzden Medine halkının gündüzlerinde yağmur aradığını ama su sağlamadığını, ardından zayıflar için yiyecek hazırladığını ve komşularla birlikte yağmur istediğini, böylece içtiğini anlattı. Ayrıca öğretmeni el-Kuraşi'nin sözlerini ve mucizelerini topladığı bir eser yazdı {atıf:shadharat-dhahab s. 187}, İbn Hallikan'ın büyük ölçüde çalıştığı ve alıntıladığı {atı:wafayat-ayan}."
  id: "Abu al-Abbas Ahmad ibn Ali al-Qastalani, seorang ahli hukum Maliki, pertapa, dan ulama teladan, murid Sheikh Abu Abdullah al-Qurashi; ia mendengar dari Abdullah ibn Bari, belajar di Mesir, mengeluarkan fatwa, lalu tinggal di dekat Mekah untuk sementara waktu, dan setelah kematian sheikh-nya, menikahi istri yang benar, ibu dari putranya Qutb al-Din. Ia menceritakan bahwa masyarakat Madinah adalah bard, sehingga masyarakat Madinah mencari hujan di siang hari mereka tetapi tidak menyediakan air, lalu ia menyiapkan makanan bagi yang lemah dan mencari hujan bersama tetangga, sehingga mereka minum. Ia juga menulis sebuah karya di mana ia mengumpulkan kata-kata dan mukjizat gurunya al-Qurashi {cite:shadharat-dhahab hlm. 187}, yang merupakan bagian utama yang dipelajari dan dikutip Ibn Khallikan {cite:wafayat-ayan}."
