summary:
  ar: "مير سيد جلال الدين حسين النقوي البخاري (707–785 هـ / 1308–1384م)، المعروف بمخدوم جهانيان جهانكشت، شيخ سهروردي من أوج في البنجاب، حفيد جلال الدين سرخ بوش البخاري وخليفته في رئاسة خط أوج من الطريقة. لُقّب بجهانكشت (الجوّال في العالم) لكثرة أسفاره، وقيل إنه حج ستًا وثلاثين مرة، وعيّنه محمد بن تغلق شيخ الإسلام وولّاه أربعين خانقاه في سيوستان، وكان له أثر في سياسات فيروز شاه تغلق الدينية."
  en: "Mir Sayyid Jalaluddin Husayn al-Naqvi al-Bukhari (707–785 AH / 1308–1384 CE), known as Makhdum-i Jahaniyan Jahangasht, a Suhrawardi shaykh of Uch in the Punjab, grandson of Jalaluddin Surkh-Posh Bukhari and his successor at the head of the order's Uch line. His laqab Jahangasht ('world-traveller') came from his ceaseless journeys — he is said to have performed the Hajj thirty-six times; Muhammad ibn Tughluq appointed him Shaykh al-Islam with forty khanqahs in Siwastan, and he influenced the religious policies of Firuz Shah Tughluq."
  ur: "میر سید جلال الدین حسین نقوی بخاری (707ھ–785ھ / 1308ء–1384ء)، جو مخدوم جہانیاں جہانگشت کے نام سے مشہور ہیں، پنجاب کے شہر اوچ کے سہروردی شیخ تھے، جلال الدین سرخ پوش بخاری کے پوتے اور اوچ کے سلسلے میں ان کے جانشین۔ جہاں گشت (دنیا کا مسافر) کا لقب انھیں کثرتِ سفر سے ملا؛ کہا جاتا ہے کہ انھوں نے چھتیس حج کیے۔ محمد بن تغلق نے انھیں شیخ الاسلام مقرر کر کے سیوستان کی چالیس خانقاہیں ان کے سپرد کیں، اور فیروز شاہ تغلق کی دینی پالیسیوں پر ان کا اثر رہا۔"
