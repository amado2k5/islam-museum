summary:
  ar: "داعية باكستاني، وُلد في 1 أكتوبر 1953 في طولمبه قرب ميان تشنو بالبنجاب. تتلمذ في جامعة العلوم الإسلامية في رايويند بعد ترك دراسة الطب، والتحق بجماعة التبليغ فصار من أشهر وعاظها في العالم؛ يلقى دروسه حضور واسع على يوتيوب، وأسس مؤسسة مولانا طارق جميل للأعمال الخيرية والتعليمية."
  en: "Pakistani preacher, born on 1 October 1953 in Tulamba near Mian Channu, Punjab. He left medical studies for the Jamia Arabia in Raiwind and joined the Tablighi Jamaat, becoming one of its best-known preachers worldwide; his lectures draw vast audiences on YouTube, and he founded the Maulana Tariq Jamil Foundation for welfare and education."
  ur: "پاکستانی مبلغ، 1 اکتوبر 1953 کو پنجاب کے میاں چنوں کے قریب تولمبہ میں پیدا ہوئے۔ انھوں نے طب کی تعلیم چھوڑ کر رائیونڈ کے جامعہ عربیہ میں دینی درس پڑھا اور تبلیغی جماعت سے وابستہ ہو کر اس کے مشہور ترین مبلغین میں شمار ہوئے؛ ان کے بیانات کو یوٹیوب پر بہت بڑا حجوم دیکھتا ہے اور انھوں نے مولانا طارق جمیل فاؤنڈیشن قائم کی۔"
