summary:
  ar: "الشيخ أحمد هيبة الله بن ماء العينين (1877–1919)، فقيه وشاعر صحراوي، الحادي عشر من أبناء الشيخ ماء العينين وخليفته في القيادة الروحية والجهاد. بعد وفاة أبيه سنة 1910 وفرض فرنسا معاهدة فاس سنة 1912، بايعته قبائل سوس والصحراء أميرًا للجهاد فدخل مراكش وأعلن نفسه سلطانًا — ومن هنا لقبه «السلطان الأزرق» — ثم هزمته القوات الفرنسية في سيدي بوعثمان (6 سبتمبر 1912)، فلاذ بكردوس في الأطلس الصغير وواصل المقاومة حتى وفاته سنة 1919، فخلفه أخوه مربيه ربه. خلّف ديوان شعر ومؤلفات فقهية وصوفية."
  en: "Shaykh Ahmad Haybat Allah ibn Ma al-'Aynayn (1877–1919), Saharan jurist and poet, eleventh son of Shaykh Ma al-'Aynayn and his successor in the spiritual leadership and the jihad. After his father's death in 1910 and France's imposition of the Treaty of Fez in 1912, the tribes of the Souss and the Sahara gave him allegiance as amir of the jihad; he entered Marrakech and proclaimed himself sultan — hence his name 'the Blue Sultan' — before French forces defeated him at Sidi Bou Othman on 6 September 1912. He held out at Kerdous in the Anti-Atlas until his death in 1919, when his brother Merebbi Rebbu succeeded him. He left a diwan and works of fiqh and Sufism."
  ur: "شیخ احمد ہیبۃ اللہ بن ماء العینین (1877–1919)، صحرائی فقیہ اور شاعر، شیخ ماء العینین کے گیارہویں بیٹے اور روحانی قیادت و جہاد میں ان کے جانشین۔ 1910ء میں والد کی وفات اور 1912ء میں فرانس کے معاہدۂ فاس کے بعد سوس اور صحارا کے قبائل نے انھیں امیرِ جہاد کی بیعت دی؛ وہ مراكش میں داخل ہوئے اور خود کو سلطان اعلان کیا — یہیں سے ان کا لقب «نیلا سلطان» پڑا — پھر 6 ستمبر 1912ء کو سیدی بو عثمان میں فرانسیسی فوج سے شکست کھائی۔ وہ کاردوس (صغیر اطلس) میں 1919ء میں وفات تک مزاحمت کرتے رہے، اور ان کے بھائی مربيہ ربہ ان کے جانشین ہوئے۔ انھوں نے ایک دیوان اور فقہ و تصوف کی کتابیں چھوڑیں۔"
