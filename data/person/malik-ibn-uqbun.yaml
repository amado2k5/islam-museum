id: person/malik-ibn-uqbun
class: person
label: { ar: "مالك بن عقبون", en: "Malik ibn Uqbun" }
summary:
  ar: "من الصابئة الحرانيين، فسر كتابة مدقة باب مجمعهم بمدينة جران بالسريانية وهي قول لأفلاطون من عرف ذاته تأله، وخاطبه المسعودي ببعض ما بلغه عن أحوالهم فاعترف ببعضه وأنكر بعضاً من ذكر القرابين {cite:muruj-al-dhahab p. 542-543}. ورأى المسعودي على باب مجمع الصابئة بمدينة جرجان مكتوباً على مدقة الباب بالسريانية قولاً لأفلاطون فسره مالك بن عقبون وغيره وهو من عرف ذاته تأله، وقد قال أفلاطون الإنسان نبات سماوي شبيه شجرة منكوسة أصلها إلى السماء وفروعها في الأرض {cite:muruj-al-dhahab p. 546}"
  en: "A Sabian of Harran who rendered the Syriac inscription on their assembly-house at Jiran — Plato's 'know thyself and become divine' — and to whom al-Mas'udi put questions on their practices {cite:muruj-al-dhahab p. 542-543}."
