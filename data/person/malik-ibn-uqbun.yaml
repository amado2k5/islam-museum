label: { ar: "مالك بن عقبون", en: "Malik ibn Uqbun", es: "Malik ibn Uqbun", fr: "Malik ibn Uqbun", ur: "مالک بن عقبون" }
summary:
  ar: "من الصابئة الحرانيين، فسر كتابة مدقة باب مجمعهم بمدينة جران بالسريانية وهي قول لأفلاطون من عرف ذاته تأله، وخاطبه المسعودي ببعض ما بلغه عن أحوالهم فاعترف ببعضه وأنكر بعضاً من ذكر القرابين {cite:muruj-al-dhahab p. 542-543}. ورأى المسعودي على باب مجمع الصابئة بمدينة جرجان مكتوباً على مدقة الباب بالسريانية قولاً لأفلاطون فسره مالك بن عقبون وغيره وهو من عرف ذاته تأله، وقد قال أفلاطون الإنسان نبات سماوي شبيه شجرة منكوسة أصلها إلى السماء وفروعها في الأرض {cite:muruj-al-dhahab p. 546}"
  en: "A Sabian of Harran who rendered the Syriac inscription on their assembly-house at Jiran — Plato's 'know thyself and become divine' — and to whom al-Mas'udi put questions on their practices {cite:muruj-al-dhahab p. 542-543}."
  es: "Un sabeo de Harran que transcribió la inscripción siríaca en su casa de asambleas en Jiran —el \"conócete a ti mismo y conviértete en divino\" de Platón— y a quien al-Mas'udi le planteó preguntas sobre sus prácticas {cite:muruj-al-dhahab p. 542-543}."
  fr: "Un Sabien de Harran qui a traduit l'inscription syriaque sur leur maison d'assemblée à Jiran — le « connais-toi toi-même et deviens divin » de Platon — et à qui al-Mas'udi a posé des questions sur leurs pratiques {cite:muruj-al-dhahab p. 542-543}."
  ur: "حران کا ایک صابی جس نے جیران میں اپنے اسمبلی ہاؤس پر سریانی کندہ لکھا تھا - افلاطون کا 'خود کو جانو اور الہی بن جاؤ' - اور جن سے المسعودی نے ان کے طرز عمل پر سوالات کیے {حوالہ: مروج الذہب ص۔ 542-543}۔"
  tr: "Harrani Sabianlardan biriydi. Gran şehrindeki komplekslerinin kapısındaki yazıtı Süryanice olarak yorumladı; bu, kendini tanrı olarak tanıyan Platon'un bir sözüdür. Al-Mas'udi, onların durumu hakkında öğrendiklerinden bazılarını ona hitap etti, bazılarını kabul etti ve bazı sunulardan bahsedilmeyince {cite:muruj-al-dhahab s. 542-543} Al-Mas'udi, Gorgan şehrindeki Sabian kompleksinin kapısında, Platon'un Malik ibn Uqboun ve kendisini tanrı olarak tanıyan diğerleri tarafından yorumlanan bir sözü Süryanice olarak gördü. Platon, insanın, kökeni gökyüzüne ulaşan, dalları yere ulaşan, ters ağaca benzeyen göksel bir bitki olduğunu söylemiştir {cite:muruj-al-dhahab s. 546}"
  id: "Ia adalah salah satu dari Harrani Sabian. Ia menafsirkan prasasti di pintu kompleks mereka di kota Gran dalam bahasa Siria, yang merupakan pepatah Plato, yang mengenal dirinya sebagai dewa. Al-Mas'udi menyapanya dengan beberapa hal yang telah ia pelajari tentang kondisi mereka, mengakui sebagian dan menolak beberapa penyebutan tentang persembahan {cite:muruj-al-dhahab hlm. 542-543}. Al-Mas'udi melihat di pintu kompleks Sabian di kota Gorgan tertulis di tiang pintu dalam bahasa Siria sebuah pepatah Plato yang diinterpretasikan oleh Malik ibn Uqboun dan lainnya, yang mengenal dirinya sebagai dewa. Plato mengatakan manusia adalah tumbuhan langit yang menyerupai pohon terbalik yang asalnya mencapai langit dan cabangnya mencapai bumi {cite:muruj-al-dhahab hlm. 546}"
