summary:
  ar: "أحمد بن عمرو بن مهير الشيباني، أبو بكر الخصاف، أحد الفقهاء على مذاهب أهل العراق، فارض حاسب زاهد، صنف للمهتدي كتابا في الخراج، من مصنفاته أدب القاضي وأحكام الوقوف، توفي سنة 261 هـ."
  en: "Ahmad ibn Amr ibn Muhayr al-Shaybani, Abu Bakr al-Khassaf, a jurist of the Iraqi schools, expert in inheritance and reckoning and an ascetic; wrote a book on the land tax for the caliph al-Muhtadi; author of Adab al-Qadi and Ahkam al-Wuquf; died 261 AH (about 874)."
  es: "Ahmad ibn Amr ibn Muhayr al-Shaybani, Abu Bakr al-Khassaf, jurista de las escuelas iraquíes, experto en herencias y contabilidad, y asceta; escribió un libro sobre el impuesto sobre la tierra para el califa al-Muhtadi; autor de Adab al-Qadi y Ahkam al-Wuquf; murió en el año 261 de la Hégira (alrededor del 874 d. C.)."
  fr: "Ahmad ibn Amr ibn Muhayr al-Shaybani, Abu Bakr al-Khassaf, juriste des écoles irakiennes, expert en héritage et en calcul et ascète; a écrit un livre sur l'impôt foncier pour le calife al-Muhtadi; auteur d'Adab al-Qadi et d'Ahkam al-Wuquf; mort en 261 AH (environ 874)."
