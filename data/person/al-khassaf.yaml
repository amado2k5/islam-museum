  ar: "أحمد بن عمرو بن مهير الشيباني، أبو بكر الخصاف، أحد الفقهاء على مذاهب أهل العراق، فارض حاسب زاهد، صنف للمهتدي كتابا في الخراج، من مصنفاته أدب القاضي وأحكام الوقوف، توفي سنة 261 هـ."
  en: "Ahmad ibn Amr ibn Muhayr al-Shaybani, Abu Bakr al-Khassaf, a jurist of the Iraqi schools, expert in inheritance and reckoning and an ascetic; wrote a book on the land tax for the caliph al-Muhtadi; author of Adab al-Qadi and Ahkam al-Wuquf; died 261 AH (about 874)."
