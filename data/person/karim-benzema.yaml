summary:
  ar: "لاعب كرة قدم فرنسي محترف، وُلد في ليون سنة 1987؛ مهاجم برز في ليون ثم قضى أربعة عشر موسمًا في ريال مدريد فاز فيها بخمسة ألقاب لدوري أبطال أوروبا وصار ثاني هدّافي النادي تاريخيًا، وفاز بالكرة الذهبية سنة 2022، وانضم إلى الاتحاد السعودي سنة 2023؛ ومع فرنسا خاض 97 مباراة دولية، وغاب عن المنتخب أكثر من خمس سنوات بعد 2015 على خلفية قضية ابتزاز، وعاد للمشاركة في يورو 2020 وكأس العالم 2022."
  en: "French professional footballer, born in Lyon in 1987. A striker who broke through at Lyon, then spent fourteen seasons at Real Madrid, winning five UEFA Champions League titles and becoming the club's second-highest goalscorer, won the 2022 Ballon d'Or, and joined Saudi club Al-Ittihad in 2023; for France he earned 97 caps, was absent from the national team for over five years after 2015 in connection with a blackmail case, and returned for Euro 2020 and the 2022 World Cup."
  ur: "فرانسیسی پیشہ ور فٹبالر، 1987 میں لیون میں پیدا ہوئے؛ اسٹرائیکر جو لیون میں ابھرے، پھر ریال میڈرڈ میں چودہ سیزن گزارے جن میں پانچ یوئیفا چیمپئنز لیگ خطابات جیتے اور کلب کے دوسرے سب سے بڑے گول اسکورر بنے، 2022 کا بالن ڈی اور جیتا، اور 2023 میں سعودی کلب الاتحاد میں شامل ہوئے؛ فرانس کے لیے 97 کیپس حاصل کیں، 2015 کے بعد بلیک میل قضیے کے سلسلے میں پانچ سال سے زائد قومی ٹیم سے باہر رہے، اور یورو 2020 اور 2022 ورلڈ کپ کے لیے واپس آئے۔"
