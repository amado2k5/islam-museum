label: { ar: "طغرل بك محمد بن ميكائيل السلجوقي" }
summary:
  ar: "سلطان لغز السلجوقي، محمد بن ميكال، كاتبه القائم يستنهضه في القدوم لما عزم البساسيري على القبض عليه فقدم سنة سبع وأربعين فاشتغل بأخيه ينال الذي أطمعه البساسيري بمنصبه فظفر به وقتله ورد الخليفة إلى داره مكرماً وهزم البساسيري فقتل، وهو أول سلطان ملك بغداد من السلاجقة، زوجه القائم بنته سنة أربع وخمسين فقدم في سنة خمس فدخل بها وأعاد المواريث والمكوس وضمن بغداد بمئة وخمسين ألف دينار ثم رجع إلى الري فمات بها في رمضان وأقيم بعده ابن أخيه ألب أرسلان {cite:tarikh-khulafa-minhaj-1434 p. 642-645}."
  en: "The Seljuk sultan Muhammad ibn Mika'il, summoned secretly by al-Qa'im against al-Basasiri; he came in 447, killed his bought brother Inal, restored the caliph in honour and destroyed al-Basasiri — the first Seljuk lord of Baghdad. Al-Qa'im gave him his daughter in 454; he came in 455, restored the inheritances and makus, farmed Baghdad at 150,000 dinars, and died at Rayy in Ramadan — succeeded by his nephew Alp Arslan {cite:tarikh-khulafa-minhaj-1434 p. 642-645}."
