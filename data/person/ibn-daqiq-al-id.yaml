id: person/ibn-daqiq-al-id
class: person
label: { ar: "ابن دقيق العيد" }
summary:
  ar: "الشيخ تقي الدين محمد بن علي المعروف بابن دقيق العيد الشافعي المتوفى سنة ٧٠٢هـ؛ جمع في الإلمام متون الأحاديث المتعلقة بالأحكام مجردة عن الأسانيد ثم شرحه وبرع فيه وسماه الإمام، قيل إنه لم يؤلف في هذا النوع أعظم منه لكنه لم يكمله، وذكر البقاعي أنه أكمله ثم لم يوجد بعد موته منه إلا القليل فيقال إن بعض الحسدة أعدمه {cite:kashf-zunun-furqan p. 585}، وتذكر «سير أعلام النبلاء» في ترجمته (الجزء ١٧، ص ١٢٥) أنه الإمام العلامة شيخ الإسلام تقي الدين محمد بن علي بن وهب القشيري قاضي القضاة المالكي والشافعي، وأنه ولد في شعبان سنة خمس وعشرين وستمائة بناحية ينبع وسمع من ابن المقير وابن الجميزي والسبط وخلق {cite:siyar-alam-nubala 17/125}."
  en: "Taqi al-Din Muhammad ibn Ali Ibn Daqiq al-Id, d. AH 702 — his Ilmam collected the legal hadiths' texts, and his own sharh 'al-Imam' was called the greatest of its kind, yet only a little survived his death {cite:kashf-zunun-furqan p. 585}. Al-Dhahabi's Siyar entry (juz 17, p. 125) has him born in Sha'ban 625 AH in the Yanbu' district, a Maliki and Shafi'i judge of judges who heard from Ibn al-Muqayyar, Ibn al-Jummayzi, al-Sibt and others {cite:siyar-alam-nubala 17/125}."
