  en: "Taqi al-Din Muhammad ibn Ali Ibn Daqiq al-Id, d. AH 702 — his Ilmam collected the legal hadiths' texts, and his own sharh 'al-Imam' was called the greatest of its kind, yet only a little survived his death {cite:kashf-zunun-furqan p. 585}. Al-Dhahabi's Siyar entry (juz 17, p. 125) has him born in Sha'ban 625 AH in the Yanbu' district, a Maliki and Shafi'i judge of judges who heard from Ibn al-Muqayyar, Ibn al-Jummayzi, al-Sibt and others {cite:siyar-alam-nubala 17/125}. Al-Dhahabi's Tadhkirat al-Huffaz entry (part 4, p. 1481) styles him 'imam, jurist, mujtahid, traditionist, hafiz, scholar', has him born in Sha'ban 625 AH near Yanbu' in the Hijaz, and lists his Sharh al-Mudda, al-I'lam and the unfinished Kitab al-Imam fi al-Ahkam, said it would have run to fifteen volumes {cite:tabaqat-huffaz 4/1481}."
