label: { ar: "ابن دقيق العيد" }
summary:
  ar: "الشيخ تقي الدين محمد بن علي المعروف بابن دقيق العيد الشافعي المتوفى سنة ٧٠٢هـ؛ جمع في الإلمام متون الأحاديث المتعلقة بالأحكام مجردة عن الأسانيد ثم شرحه وبرع فيه وسماه الإمام، قيل إنه لم يؤلف في هذا النوع أعظم منه لكنه لم يكمله، وذكر البقاعي أنه أكمله ثم لم يوجد بعد موته منه إلا القليل فيقال إن بعض الحسدة أعدمه {cite:kashf-zunun-furqan p. 585}."
  en: "Taqi al-Din Muhammad ibn Ali Ibn Daqiq al-Id, d. AH 702 — his Ilmam collected the legal hadiths' texts, and his own sharh 'al-Imam' was called the greatest of its kind, yet only a little survived his death {cite:kashf-zunun-furqan p. 585}."
