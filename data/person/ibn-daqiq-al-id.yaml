  en: "Taqi al-Din Muhammad ibn Ali Ibn Daqiq al-Id, d. AH 702 — his Ilmam collected the legal hadiths' texts, and his own sharh 'al-Imam' was called the greatest of its kind, yet only a little survived his death {cite:kashf-zunun-furqan p. 585}. Al-Dhahabi's Siyar entry (juz 17, p. 125) has him born in Sha'ban 625 AH in the Yanbu' district, a Maliki and Shafi'i judge of judges who heard from Ibn al-Muqayyar, Ibn al-Jummayzi, al-Sibt and others {cite:siyar-alam-nubala 17/125}. Al-Dhahabi's Tadhkirat al-Huffaz entry (part 4, p. 1481) styles him 'imam, jurist, mujtahid, traditionist, hafiz, scholar', has him born in Sha'ban 625 AH near Yanbu' in the Hijaz, and lists his Sharh al-Mudda, al-I'lam and the unfinished Kitab al-Imam fi al-Ahkam, said it would have run to fifteen volumes {cite:tabaqat-huffaz 4/1481}."
  es: "Taqi al-Din Muhammad ibn Ali Ibn Daqiq al-Id, m. AH 702 — su Ilmam recopiló los textos de los hadices legales, y su propio sharh 'al-Imam' fue llamado el más grande de su tipo, sin embargo, solo una pequeña parte sobrevivió a su muerte {cite:kashf-zunun-furqan p. 585}. La entrada de Al-Dhahabi en Siyar (juz 17, p. 125) dice que nació en Sha'ban 625 AH en el distrito de Yanbu', un juez de jueces malikí y shafi'í que escuchó a Ibn al-Muqayyar, Ibn al-Jummayzi, al-Sibt y otros {cite:siyar-alam-nubala 17/125}. La entrada de Al-Dhahabi en Tadhkirat al-Huffaz (parte 4, pág. 1481) lo describe como 'imán, jurista, mujtahid, tradicionalista, hafiz, erudito', indica que nació en Sha'ban 625 AH cerca de Yanbu' en el Hiyaz, y enumera su Sharh al-Mudda, al-I'lam y el inacabado Kitab al-Imam fi al-Ahkam, que habría constado de quince volúmenes {cite:tabaqat-huffaz 4/1481}."
  fr: "Taqi al-Din Muhammad ibn Ali Ibn Daqiq al-Id, décédé en 702 AH, a réalisé un ouvrage de vulgarisation scientifique (Ilmam) regroupant les textes juridiques des hadiths. Son propre savant (sharh 'al-Imam') était considéré comme le plus grand du genre, mais peu de ses écrits lui ont survécu (voir: kashf-zunun-furqan, p. 585). Selon la notice biographique d'al-Dhahabi (juz 17, p. 125), il serait né en Sha'ban 625 AH dans le district de Yanbu'. Il était un juge malikite et chaféite, érudit ayant étudié auprès d'Ibn al-Muqayyar, Ibn al-Jummayzi, al-Sibt et d'autres (voir: siyar-alam-nubala 17/125). L'entrée Tadhkirat al-Huffaz d'Al-Dhahabi (partie 4, p. 1481) le qualifie d'« imam, juriste, mujtahid, traditionniste, hafiz, érudit », indique sa naissance en Sha'ban 625 AH près de Yanbu' dans le Hedjaz, et mentionne son Sharh al-Mudda, al-I'lam et le Kitab al-Imam fi al-Ahkam inachevé, qui aurait dû compter quinze volumes {cite:tabaqat-huffaz 4/1481}."
  ur: "تقی الدین محمد ابن علی ابن دقیق العدد، د. 702ھ - ان کے امام نے قانونی احادیث کے نصوص کو جمع کیا، اور ان کے اپنے شارح 'امام' کو اپنی نوعیت کا سب سے بڑا کہا جاتا ہے، لیکن ان کی موت سے تھوڑا ہی بچ سکا۔ 585}۔ الذہبی کی سیار اندراج ⁦(جوز 17، صفحہ 125)⁩ کے مطابق وہ شعبان 625 ہجری میں ینبوع ضلع میں پیدا ہوئے، ایک مالکی اور شافعی جج ہیں جنہوں نے ابن المقیار، ابن الجمیزی، السبط الصیام الصغیر سے سنا۔ 17/125}۔ الذہبی کے تذکرہ الحفاظ اندراج ⁦(حصہ 4، صفحہ 1481)⁩ میں انہیں 'امام، فقیہ، مجتہد، روایت دان، حافظ، عالم' کہا گیا ہے، ان کی پیدائش شعبان 625 ہجری میں حجاز میں ینبع کے قریب ہوئی ہے، اور ان کی شرح المدتۃ اور الطبعۃ العلماء کی فہرست دی گئی ہے۔ الاحکام نے کہا کہ اس کی پندرہ جلدیں ہوں گی۔"
