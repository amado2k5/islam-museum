summary:
  ar: "شرحبيل بن عبد الله بن المطاع الكندي، حليف بني زهرة، أبو عبد الله، نُسب إلى أمه حسنة؛ من مهاجرة الحبشة ووجوه قريش، وكان أميراً على ربع من أرباع الشام لعمر، وتوفي في طاعون عمواس سنة 18هـ ابن سبع وستين سنة {cite:istiab-alam-2002 p. 330}؛ ويذكره ابن إسحاق أخاً لجابر وجنادة ابني سفيان لأمهما {cite:ibn-hisham-saqqa 4/8}."
  en: "Shurahbil ibn 'Abd Allah ibn al-Muta' of Kinda, ally of Banu Zuhra, Abu 'Abd Allah, named after his mother Hasana; an emigrant to Abyssinia counted among the leading men of Quraysh, governor of one of the four districts of Syria for 'Umar, who died in the plague of 'Amwas in 18 AH aged sixty-seven {cite:istiab-alam-2002 p. 330}; Ibn Ishaq names him as half-brother through their mother of Jabir and Junada, sons of Sufyan {cite:ibn-hisham-saqqa 4/8}."
  ur: "شرحبیل بن عبد اللہ بن المطاع کندی، بنو زہرہ کے حلیف، ابو عبد اللہ، اپنی والدہ حسنہ کی طرف منسوب؛ حبشہ کے مہاجرین اور قریش کے سرکردہ لوگوں میں سے، عمر کی طرف سے شام کے چار حصوں میں سے ایک کے امیر، اور 18ھ میں طاعونِ عمواس میں سڑسٹھ برس کی عمر میں فوت ہوئے {cite:istiab-alam-2002 p. 330}؛ ابن اسحاق انہیں سفیان کے بیٹوں جابر اور جنادہ کا ماں کی طرف سے بھائی بتاتے ہیں {cite:ibn-hisham-saqqa 4/8}۔"
died: { edtf: "0639", hijri: "0018", calendar: julian, precision: year, status: tradition, derived: true, note: "توفي في طاعون عمواس سنة 18هـ وهو ابن سبع وستين سنة {cite:istiab-alam-2002 p. 330}؛ السنة الميلادية مشتقة.", sources: [source/istiab-alam-2002] }
