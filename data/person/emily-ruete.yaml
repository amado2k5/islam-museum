summary:
  ar: "سلمة بنت سعيد سلطان (30 أغسطس 1844 في زنجبار – 29 فبراير 1924 في يينا)، المعروفة بعد زواجها باسم إميلي رويته، أميرة زنجبار وعُمان وأصغر أبناء سلطان عُمان سعيد بن سلطان الستة والثلاثين. علّمت نفسها الكتابة سرا في صباها، وشاركت فتاةً في نزاع أخويها ماجد وبرغش على الحكم، ثم عُرفت بحبها للتاجر الألماني رودولف هاينريش رويته ففرّت سنة 1866 على سفينة بريطانية إلى عدن، حيث تعمّدت باسم إميلي وتزوجته سنة 1867. عاشت أرملة فقيرة في ألمانيا بعد وفاة زوجها سنة 1870، وكتبت «مذكرات أميرة عربية» (1886) فكانت أول سيرة ذاتية منشورة لامرأة عربية، وزارَت زنجبار مرتين (1885 و1888)، وعاشت سنوات في يافا وبيروت، وتوفيت في يينا."
  en: "Salme bint Said Sultan (30 August 1844 at Zanzibar – 29 February 1924 at Jena), known after her marriage as Emily Ruete, Princess of Zanzibar and Oman and the youngest of the 36 children of Said bin Sultan, Sultan of Oman. She secretly taught herself to write as a girl, took part as a teenager in her brothers Majid's and Barghash's struggle for the throne, then fell in love with the German merchant Rudolph Heinrich Ruete, fled in 1866 on a British ship to Aden, where she was baptized Emily and married him in 1867. Widowed and poor in Germany after her husband's death in 1870, she wrote her Memoirs of an Arabian Princess (1886), the first published autobiography of an Arab woman, revisited Zanzibar twice (1885 and 1888), lived for years in Jaffa and Beirut, and died at Jena."
  ur: "سلمہ بنت سعید سلطان (30 اگست 1844ء زنجبار – 29 فروری 1924ء یینا)، جو شادی کے بعد ایملی روئٹے کے نام سے معروف ہوئیں، زنجبار و عمان کی شہزادی اور عمان کے سلطان سعید بن سلطان کے چھتیس بچوں میں سب سے چھوٹی تھیں۔ انہوں نے بچپن میں چھپ کر لکھنا سیکھا، بھائیوں ماجد و برغش کی کشمکش میں حصہ لیا، پھر جرمن تاجر روڈولف ہائنرش روئٹے سے محبت کے سبب 1866ء میں برطانوی جہاز سے عدن فرار ہوئیں، جہاں بپتسمہ لے کر ایملی نام پایا اور 1867ء میں ان سے شادی کی۔ 1870ء میں شوہر کی وفات کے بعد جرمنی میں تنگ دستی میں زندگی گزاری، «ایک عرب شہزادی کی یادداشتیں» (1886ء) لکھیں جو کسی عرب خاتون کی پہلی شائع شدہ آپ بیتی ہے، دو بار زنجبار گئیں، برسوں یافا و بیروت میں رہیں اور یینا میں وفات پائی۔"
