summary:
  ar: "مير قاسم (توفي 8 مايو 1777)، نواب البنغال من 1760 إلى 1763، نصّبته شركة الهند الشرقية خلفاً لحميه مير جعفر، فنقل العاصمة من مرشد آباد إلى مونغير وأصلح المالية والجيش وألغى الرسوم الداخلية، ثم حارب الشركة فهُزم عند بوكسار سنة 1764 في حلف مع شجاع الدولة وشاه عالم الثاني، ومات في عزلة وفقر عند كوتوال قرب دلهي. لا تُعرف سنة ولادته في أي مصدر."
  en: "Mir Qasim (died 8 May 1777) was Nawab of Bengal from 1760 to 1763, installed by the East India Company in place of his father-in-law Mir Jafar. He moved his capital from Murshidabad to Monghyr, rebuilt the revenue and the army, and abolished internal duties; then he fought the Company and was defeated at Buxar in 1764 in alliance with Shuja-ud-Daula and Shah Alam II, and died in obscurity and poverty at Kotwal, near Delhi. No source consulted gives any birth year for him."
  ur: "میر قاسم (وفات 8 مئی 1777ء) 1760ء سے 1763ء تک نواب بنگال رہے؛ ایسٹ انڈیا کمپنی نے انھیں ان کے سسر میر جعفر کی جگہ تخت پر بٹھایا۔ آپ نے دارالحکومت مرشد آباد سے مونگیر منتقل کیا، مالیات اور فوج کی اصلاح کی اور داخلی محصول ختم کر دیے، پھر کمپنی سے جنگ کی اور 1764ء میں بکسر کے مقام پر شجاع الدولہ اور شاہ عالم ثانی کے ساتھ مل کر شکست کھائی، اور دہلی کے قریب کوتوال میں گمنامی اور فقر میں وفات پائی۔ کسی ماخذ میں آپ کی سالِ ولادت مذکور نہیں۔"

