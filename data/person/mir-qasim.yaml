summary:
  ar: "مير قاسم ⁦(توفي 8 مايو 1777)⁩، نواب البنغال من 1760 إلى 1763، نصّبته شركة الهند الشرقية خلفاً لحميه مير جعفر، فنقل العاصمة من مرشد آباد إلى مونغير وأصلح المالية والجيش وألغى الرسوم الداخلية، ثم حارب الشركة فهُزم عند بوكسار سنة 1764 في حلف مع شجاع الدولة وشاه عالم الثاني، ومات في عزلة وفقر عند كوتوال قرب دلهي. لا تُعرف سنة ولادته في أي مصدر."
  en: "Mir Qasim (died 8 May 1777) was Nawab of Bengal from 1760 to 1763, installed by the East India Company in place of his father-in-law Mir Jafar. He moved his capital from Murshidabad to Monghyr, rebuilt the revenue and the army, and abolished internal duties; then he fought the Company and was defeated at Buxar in 1764 in alliance with Shuja-ud-Daula and Shah Alam II, and died in obscurity and poverty at Kotwal, near Delhi. No source consulted gives any birth year for him."
  ur: "میر قاسم ⁦(وفات 8 مئی 1777ء)⁩ 1760ء سے 1763ء تک نواب بنگال رہے؛ ایسٹ انڈیا کمپنی نے انھیں ان کے سسر میر جعفر کی جگہ تخت پر بٹھایا۔ آپ نے دارالحکومت مرشد آباد سے مونگیر منتقل کیا، مالیات اور فوج کی اصلاح کی اور داخلی محصول ختم کر دیے، پھر کمپنی سے جنگ کی اور 1764ء میں بکسر کے مقام پر شجاع الدولہ اور شاہ عالم ثانی کے ساتھ مل کر شکست کھائی، اور دہلی کے قریب کوتوال میں گمنامی اور فقر میں وفات پائی۔ کسی ماخذ میں آپ کی سالِ ولادت مذکور نہیں۔"
  es: "Mir Qasim (fallecido el 8 de mayo de 1777) fue Nawab de Bengala entre 1760 y 1763, nombrado por la Compañía Británica de las Indias Orientales en sustitución de su suegro, Mir Jafar. Trasladó su capital de Murshidabad a Monghyr, reconstituyó la hacienda pública y el ejército, y abolió los aranceles internos. Posteriormente, luchó contra la Compañía y fue derrotado en Buxar en 1764, aliado con Shuja-ud-Daula y Shah Alam II. Murió en la oscuridad y la pobreza en Kotwal, cerca de Delhi. Ninguna fuente consultada indica su año de nacimiento."
  fr: "Mir Qasim (décédé le 8 mai 1777) fut nawab du Bengale de 1760 à 1763, nommé par la Compagnie des Indes orientales en remplacement de son beau-père, Mir Jafar. Il transféra sa capitale de Murshidabad à Monghyr, reconstitua les finances et l'armée, et abolit les taxes intérieures. Il lutta ensuite contre la Compagnie et fut vaincu à Buxar en 1764, allié à Shuja-ud-Daula et Shah Alam II. Il mourut dans l'obscurité et la pauvreté à Kotwal, près de Delhi. Aucune source consultée ne précise son année de naissance."
  tr: "Mir Kasım (8 Mayıs 1777'de öldü), 1760'tan 1763'e kadar Bengal Nawab'ı olarak görev yaptı ve Doğu Hindistan Şirketi tarafından kayınpederi Mir Jafar'ın yerine atandı. Başkenti Murshidabad'dan Munger'e taşıdı, mali işleri ve orduyu reforme etti, iç görevleri kaldırdı, ardından şirketle savaştı, 1764'te Buxar'da Shuja Daula ve Shah Alam II ile ittifakla yenilgiye uğradı ve Delhi yakınlarındaki Kotwal yakınlarında yalnızlık ve yoksulluk içinde öldü. Doğum yılı hiçbir kaynakta bilinmemektedir."
  id: "Mir Qasim (meninggal 8 Mei 1777), Nawab Bengal dari tahun 1760 hingga 1763, diangkat oleh Perusahaan Hindia Timur sebagai penerus ayah mertuanya Mir Jafar. Ia memindahkan ibu kota dari Murshidabad ke Munger, mereformasi keuangan dan militer, menghapus bea dalam negeri, lalu bertempur melawan perusahaan, dikalahkan di Buxar pada tahun 1764 dalam aliansi dengan Shuja Daula dan Shah Alam II, dan meninggal dalam isolasi dan kemiskinan di dekat Kotwal dekat Delhi. Tahun kelahirannya tidak diketahui dalam sumber manapun."

