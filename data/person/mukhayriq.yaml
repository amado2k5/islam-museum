summary:
  ar: عالم يهودي قيل إنه من بني النضير وقيل من بني قينقاع، أسلم في رواية الواقدي واستُشهد بأحد؛ أوصى بأمواله، وهي سبع حوائط بالمدينة، للنبي فجعلها صدقة؛ وروى عمر بن شبة عن ابن شهاب أنه قال للنبي في شأنه «مخيريق سابق يهود».
  en: A Jewish scholar said to be from Banu al-Nadir, or Banu Qaynuqa according to others; in al-Waqidi's account he embraced Islam and was killed at Uhud; he left his wealth, seven orchards in Medina, to the Prophet, who made them a charitable
    endowment; Umar ibn Shabba reports from Ibn Shihab that the Prophet called him the foremost of the Jews.
  ur: "یہودی عالم، بنو نضیر سے کہا جاتا ہے یا دوسروں کے مطابق بنو قینقاع سے؛ واقدی کے بیان میں مسلمان ہوا اور احد میں مارا گیا۔"
