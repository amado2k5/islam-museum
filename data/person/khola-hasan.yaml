summary:
  ar: "كاتبة ومذيعة بريطانية ومديرة مكتب المجلس الشرعي الإسلامي في لندن ومستشارة فيه. وُلدت في السعودية ودرست المرحلة الابتدائية في كينيا وقضت معظم حياتها في لندن، وألّفت في السابعة عشرة كتاب «مآذن إسبانيا المتهاوية»، وشاركت في مناظرات ومحافل إعلامية منها مناظرة راديو بي بي سي 4 سنة 2005 ومناظرات الدوحة."
  en: "British writer and broadcaster, and Office Director and Counsellor at the Islamic Shariah Council in London. Born in Saudi Arabia and primary-schooled in Kenya, she has spent most of her life in London; at seventeen she authored The Crumbling Minarets of Spain, and she has taken part in broadcast debates including the BBC Radio 4 'Women in Islam' debate of 2005 and the Doha Debates."
  ur: "برطانوی مصنفہ و نشریاتی شخصیت، اور لندن میں اسلامی شریعہ کونسل کی دفتر ڈائریکٹر و مشیر۔ سعودی عرب میں پیدا ہوئیں، ابتدائی تعلیم کینیا میں حاصل کی اور بیشتر زندگی لندن میں گزاری؛ سترہ برس کی عمر میں کتاب «The Crumbling Minarets of Spain» لکھی، اور 2005 کی بی بی سی ریڈیو 4 مناظرے اور دوحہ ڈیبیٹس سمیت نشریاتی مباحثوں میں حصہ لیا۔"
