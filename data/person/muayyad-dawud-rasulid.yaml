id: person/muayyad-dawud-rasulid
class: person
label:
  ar: الملك المؤيد داود بن يوسف
  en: al-Malik al-Mu'ayyad Dawud ibn Yusuf
summary:
  ar: "الملك المؤيد داود بن المظفر يوسف، خامس ملوك بني رسول باليمن؛ أخرج من معتقله وولوّه بعد مقتل أخيه الأشرف سنة 696هـ، وافتتح أمره بقتل الجارية التي سمت أخاه، وواصل ملوك الترك بهداياه حتى انتهت هديته سنة 711هـ إلى مائتي قِرْب بعير بالثياب والتحف وطرف اليمن ومائتين من الجمال والخيل، وجمع الكتب من سائر الأمصار فاشتملت خزانته على مائة ألف مجلد، وكان يتفقد العلماء بصلاته ويبعث لابن دقيق العيد فقيه الشافعية بمصر جوائزه، وتوفي سنة 721هـ."
  en: "Al-Malik al-Mu'ayyad Dawud ibn al-Muzaffar Yusuf, fifth Rasulid king of Yemen; freed from confinement and enthroned after his brother al-Ashraf's killing in 696 AH, he opened his reign by executing the poisoner slave-girl, kept Egypt's Turkish kings supplied with gifts until his 711 offering reached two hundred camel-loads of textiles, rarities and mounts, gathered books from every land until his treasury held a hundred thousand volumes, tended the scholars with his stipends sending gifts to the Shafi'i faqih Ibn Daqiq al-Id in Egypt, and died in 721."
