id: person/muayyad-dawud-rasulid
class: person
label:
  ar: الملك المؤيد داود بن يوسف
  en: al-Malik al-Mu'ayyad Dawud ibn Yusuf
  es: "al-Malik al-Mu'ayyad Dawud ibn Yusuf"
  fr: "al-Malik al-Mu'ayyad Dawud ibn Yusuf"
  ur: "المالک المعیاد داؤد ابن یوسف"
summary:
  ar: "الملك المؤيد داود بن المظفر يوسف، خامس ملوك بني رسول باليمن؛ أخرج من معتقله وولوّه بعد مقتل أخيه الأشرف سنة 696هـ، وافتتح أمره بقتل الجارية التي سمت أخاه، وواصل ملوك الترك بهداياه حتى انتهت هديته سنة 711هـ إلى مائتي قِرْب بعير بالثياب والتحف وطرف اليمن ومائتين من الجمال والخيل، وجمع الكتب من سائر الأمصار فاشتملت خزانته على مائة ألف مجلد، وكان يتفقد العلماء بصلاته ويبعث لابن دقيق العيد فقيه الشافعية بمصر جوائزه، وتوفي سنة 721هـ."
  en: "Al-Malik al-Mu'ayyad Dawud ibn al-Muzaffar Yusuf, fifth Rasulid king of Yemen; freed from confinement and enthroned after his brother al-Ashraf's killing in 696 AH, he opened his reign by executing the poisoner slave-girl, kept Egypt's Turkish kings supplied with gifts until his 711 offering reached two hundred camel-loads of textiles, rarities and mounts, gathered books from every land until his treasury held a hundred thousand volumes, tended the scholars with his stipends sending gifts to the Shafi'i faqih Ibn Daqiq al-Id in Egypt, and died in 721."
  es: "Al-Malik al-Mu'ayyad Dawud ibn al-Muzaffar Yusuf, quinto rey rasulí de Yemen, fue liberado de su confinamiento y entronizado tras el asesinato de su hermano al-Ashraf en el año 696 de la Hégira. Inició su reinado ejecutando a la esclava envenenadora, abasteció de regalos a los reyes turcos de Egipto hasta que su ofrenda en el año 711 alcanzó las doscientas cargas de camello de textiles, rarezas y monturas, reunió libros de todas partes hasta que su tesoro contuvo cien mil volúmenes, apoyó a los eruditos con sus estipendios enviando regalos al faqih shafi'í Ibn Daqiq al-Id en Egipto, y murió en el año 721."
  fr: "Al-Malik al-Mu'ayyad Dawud ibn al-Muzaffar Yusuf, cinquième roi rasulide du Yémen; libéré de captivité et intronisé après le meurtre de son frère al-Ashraf en 696 AH, il commença son règne en exécutant l'esclave empoisonneuse, approvisionna les rois turcs d'Égypte en cadeaux jusqu'à ce que son offrande de 711 atteigne deux cents chargements de chameaux de textiles, de raretés et de montures, rassembla des livres de tous les pays jusqu'à ce que son trésor contienne cent mille volumes, soutint les savants avec ses allocations en envoyant des cadeaux au faqih chaféite Ibn Daqiq al-Id en Égypte, et mourut en 721."
  ur: "المالک المعیاد داؤد ابن المظفر یوسف، یمن کا پانچواں رسول بادشاہ؛ قید سے آزاد ہوا اور 696 ہجری میں اپنے بھائی اشرف کے قتل کے بعد تخت نشین ہوا، اس نے زہر دینے والی لونڈی کو پھانسی دے کر اپنی حکومت کا آغاز کیا، مصر کے ترک بادشاہوں کو تحائف فراہم کیے یہاں تک کہ اس کی 711 کی پیشکش دو سو اونٹوں پر مشتمل ٹیکسٹائل تک پہنچ گئی، اس کے پاس ہر سو کتابیں، نایاب کتابیں اور زمینیں موجود تھیں۔ ہزار جلدوں میں، مصر میں شافعی فقیہ ابن دقیق العد کو تحائف بھیجنے کے لیے اپنے وظیفے سے علماء کی خدمت کی، اور 721 میں وفات پائی۔"
  tr: "Yemen'deki Banu Rasul'un beşinci kralı Kral El-Mueyyad Davud bin El-Muzaffar Yusuf, 696 Hicri'nde kardeşi El-Eşref'in öldürülmesinden sonra hapisten serbest bırakıldı ve atandı. Kardeşinin adını taşıyan köle kızı öldürme emrini başlattı. Türk krallarıyla hediyelerle birlikte 711 Hicri'de iki yüz deve, kıyafet ve süs eşyaları, Yemen'in kenarı ve iki yüz deve ile atla sona erene kadar devam etti. Her bölgeden kitaplar topladı ve hazinesinde yüz bin cilt vardı. Dualarıyla alimleri denetler ve Mısır'daki Şafii fili İbn Daqiq al-'Id'e ödüller gönderirdi. 721 Hicri'de öldü."
  id: "Raja Al-Mu'ayyad Dawud ibn Al-Muzaffar Yusuf, raja kelima Banu Rasul di Yaman, dibebaskan dari penjaranya dan diangkat setelah kematian saudaranya Al-Ashraf pada tahun 696 H. Ia memulai perintah untuk membunuh budak perempuan yang dinamai menurut saudaranya. Ia melanjutkan bersama raja-raja Turkik dengan hadiah hingga hadiah berakhir pada tahun 711 H dengan dua ratus unta berisi pakaian dan pernak-pernik, di pinggiran Yaman, serta dua ratus unta dan kuda. Ia mengumpulkan buku-buku dari semua wilayah, dan harta karunnya mencakup seratus ribu buku. Ia biasa memeriksa para ulama melalui doanya dan mengirimkan hadiah kepada Ibn Daqiq al-'Id, ahli hukum Syafi'i di Mesir. Ia meninggal pada tahun 721 H."
