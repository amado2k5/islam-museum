label:
  ar: محمد بن أحمد بن أبي عباد التميمي
  en: Muhammad ibn Ahmad ibn Abi Abbad al-Tamimi
  ur: محمد بن احمد بن ابی عباد تمیمی
summary:
  ar: من أخص الناس بالهادي وبأبي العتاهية، استخلفه الهادي على شبام حين صعد جبل بيت ذخار فدخل المخالفون شبام وقتلوه في جمادى الآخرة سنة 288هـ.
  en: One of the men closest to al-Hadi and to Abu al-Atahiya, he was left by al-Hadi as deputy at Shibam when he climbed Jabal Bayt Dhukhar; the opponents entered Shibam and killed him in Jumada II 288 AH.
  ur: ہادی اور ابو العتاہیہ کے قریب ترین لوگوں میں سے، جنہیں ہادی نے جبل بیت ذخار پر چڑھتے وقت شبام پر نائب بنایا؛ مخالفین شبام میں داخل ہوئے اور جمادی الآخرہ 288ھ میں انہیں قتل کر دیا۔
