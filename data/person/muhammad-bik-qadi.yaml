summary:
  ar: "المولى محيي الدين محمد بن عبد الله الحنفي الشهير بمحمد بيك؛ كان من مماليك السلطان أبي يزيد فرغب في العلم وترك طريق الإمارة وقرأ على جماعة منهم المولى مظفر الدين العجمي والمولى محيي الدين الفناري ثم خدم ابن كمال باشا وصار معيداً لدرسه، ثم تنقل في المدارس ثم اختلّ دماغه ثم بريء فسافر إلى مصر في البحر فأسرته النصارى فاشتراه بعض أصدقائه منهم، ثم عاد إلى قسطنطينية فأعطاه السلطان سليمان سلطانية بروسا ثم مدرسة أبي يزيد خان بأدرنة ثم قضاء دمشق فدخلها حادي عشر صفر سنة ست وأربعين وعُزل عنها في صفر سنة تسع وأربعين فعاد إلى الروم واختل مزاجه غاية الاختلال وأُعطي في أثناء المرض قضاء مصر فسافر إليها في أيام الشتاء فأدركته المنية في الطريق؛ وكان محباً للعلم وأهله وللصوفية وله مهارة في العلوم العقلية ومعرفة بالعلوم الرياضية وله تعليقات على بعض الكتب، وتوفي في بلدة كوتاهية {cite:shadharat-dhahab p. 700-701}."
  en: "Bayezid's mamluk who left the amirate for scholarship — served Ibn Kamal Pasha as his repetitor; after a bout of madness he sailed for Egypt, was captured by Christians at sea and ransomed by friends; Sulayman gave him Bursa's Sultaniyya, Edirne's Bayezid Khan madrasa, then Damascus's qadiship (946–949); appointed qadi of Egypt while ill, death caught him on the winter road at Kutahya {cite:shadharat-dhahab p. 700-701}."
