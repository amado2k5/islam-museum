summary:
  ar: "المولى محيي الدين محمد بن عبد الله الحنفي الشهير بمحمد بيك؛ كان من مماليك السلطان أبي يزيد فرغب في العلم وترك طريق الإمارة وقرأ على جماعة منهم المولى مظفر الدين العجمي والمولى محيي الدين الفناري ثم خدم ابن كمال باشا وصار معيداً لدرسه، ثم تنقل في المدارس ثم اختلّ دماغه ثم بريء فسافر إلى مصر في البحر فأسرته النصارى فاشتراه بعض أصدقائه منهم، ثم عاد إلى قسطنطينية فأعطاه السلطان سليمان سلطانية بروسا ثم مدرسة أبي يزيد خان بأدرنة ثم قضاء دمشق فدخلها حادي عشر صفر سنة ست وأربعين وعُزل عنها في صفر سنة تسع وأربعين فعاد إلى الروم واختل مزاجه غاية الاختلال وأُعطي في أثناء المرض قضاء مصر فسافر إليها في أيام الشتاء فأدركته المنية في الطريق؛ وكان محباً للعلم وأهله وللصوفية وله مهارة في العلوم العقلية ومعرفة بالعلوم الرياضية وله تعليقات على بعض الكتب، وتوفي في بلدة كوتاهية {cite:shadharat-dhahab p. 700-701}."
  en: "Bayezid's mamluk who left the amirate for scholarship — served Ibn Kamal Pasha as his repetitor; after a bout of madness he sailed for Egypt, was captured by Christians at sea and ransomed by friends; Sulayman gave him Bursa's Sultaniyya, Edirne's Bayezid Khan madrasa, then Damascus's qadiship (946–949); appointed qadi of Egypt while ill, death caught him on the winter road at Kutahya {cite:shadharat-dhahab p. 700-701}."
  es: "Mameluco de Bayezid que dejó el emirato para estudiar —sirvió a Ibn Kamal Pasha como su repetidor—; después de un ataque de locura, zarpó hacia Egipto, fue capturado por cristianos en el mar y rescatado por amigos; Sulayman le dio la Sultaniyya de Bursa, la madrasa Bayezid Khan de Edirne, y luego el cadí de Damasco (946-949); fue nombrado cadí de Egipto estando enfermo, pero la muerte lo sorprendió en el camino invernal en Kutahya {cite:shadharat-dhahab p. 700-701}."
  fr: "Le mamelouk de Bayezid qui quitta l'émirat pour étudier — servit Ibn Kamal Pacha comme son répétiteur; après une crise de folie, il fit voile pour l'Égypte, fut capturé par des chrétiens en mer et racheté par des amis; Sulayman lui donna la Sultaniyya de Bursa, la madrasa Bayezid Khan d'Edirne, puis le cadi de Damas (946-949); nommé cadi d'Égypte alors qu'il était malade, la mort le surprit sur la route d'hiver à Kutahya {cite:shadharat-dhahab p. 700-701}."
  ur: "بایزید کے مملوک جنہوں نے وظیفہ کے لیے امارت چھوڑی تھی - ابن کمال پاشا کو اس کے دہرانے والے کے طور پر خدمت کی تھی۔ پاگل پن کے بعد وہ مصر کی طرف روانہ ہوا، سمندر میں عیسائیوں نے اسے پکڑ لیا اور دوستوں کے ذریعے تاوان لیا گیا۔ سلیمان نے اسے برسا کی سلطانیہ، ادرنے کا بایزید خان مدرسہ، پھر دمشق کی قادیانیت (946-949) دی۔ بیمار رہتے ہوئے مصر کا قاضی مقرر ہوا، سردیوں کے راستے کوتاہیہ میں موت نے اسے پکڑ لیا۔ 700-701}۔"
  tr: "Mevle Muhyeddin Muhammed bin Abdullah el-Hanafi, nam-ı diğer Muhammed Bey, Sultan Ebu Yezid'in memlüklerinden biriydi. Bilgiye hevesliydi, emirlik yolunu terk etti ve Mevla Muzaffareddin el-Acemi ile Mevla Muhyeddin el-Fanari gibi bir gruptan eğitim aldı. Daha sonra İbn Kemal Paşa'ya hizmet etti ve öğretmen asistanı oldu. Daha sonra okullar arasında geçiş yaptı, aklı bozuldu ve masumdu. Deniz yoluyla Mısır'a gitti, burada Hristiyanlar onu yakaladı ve bazı arkadaşları onu onlardan satın aldı. Daha sonra Konstantinopolis'e döndü; burada Sultan Süleyman ona Prusya Sultanlığı'nı, ardından Ebu okulunu verdi Yazid Han, o zamanlar Şam'ın sınırı olan Edirne'deydi ve 46 Hicri yılının 11'inde Sefer'e girdi. 49 Hicri yılında Safar'da görevden alındı, ardından Romalılara döndü ve burada öfkesi çok bozuldu. Hastalığı sırasında Mısır valiliği verildi, kış günlerinde oraya seyahat etti, ancak yolda ölüm onu yakaladı. Bilgiyi, halkını ve tasavvufu severdi. Akılcı bilimlerde yetenekliydi ve matematiksel bilimlerde bilgiliydi. Bazı kitaplar üzerine yorumlar yazdı. Kutahya kasabasında öldü {kaynak:shadharat-dhahab, s. 700-701}."
  id: "Mawla Muhyiddin Muhammad ibn Abdullah al-Hanafi, yang dikenal sebagai Muhammad Bey, adalah salah satu mamluk Sultan Abu Yazid. Ia sangat ingin ilmu, meninggalkan jalan emirat, dan belajar di bawah kelompok yang termasuk Mawla Muzaffar al-Din al-Ajami dan Mawla Muhyiddin al-Fanari. Ia kemudian melayani Ibn Kamal Pasha dan menjadi asisten pengajar. Ia kemudian berpindah sekolah, kemudian pikirannya mulai tidak sehat, dan ia menjadi tidak bersalah. Ia melakukan perjalanan ke Mesir melalui laut, di mana orang Kristen menangkapnya, dan beberapa temannya membelinya dari mereka. Ia kemudian kembali ke Konstantinopel, di mana Sultan Suleiman memberinya Kesultanan Prusia, yang saat itu sekolah Abu Yazid Khan berada di Edirne, saat itu distrik Damaskus, di mana ia masuk pada tanggal 11 Safar tahun 46 H. Ia dipecat di Safar pada tahun 49 H, kemudian kembali ke Romawi, di mana sifatnya menjadi sangat terganggu. Selama sakitnya, ia diberi jabatan gubernur Mesir, melakukan perjalanan ke sana pada hari-hari musim dingin, tetapi kematian menimpanya dalam perjalanan. Ia mencintai pengetahuan, penduduknya, dan Sufisme. Ia mahir dalam ilmu rasional dan pengetahuan matematika. Ia menulis komentar pada beberapa buku. Ia meninggal di kota Kutahya {cite:shadharat-dhahab, hlm. 700-701}."
