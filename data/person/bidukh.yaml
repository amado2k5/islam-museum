class: person
label: { ar: "بيدوخ", en: "Bidukh", es: "Bidukh", fr: "Bidukh", ur: "بدوخ" }
summary:
  ar: "بيدوخ عند من يخبر عن طريقة السحرة المذمومة ابنة إبليس وقيل هي ابنة ابن إبليس وإن لها عرشا على الماء وأن المريد لهذا الأمر متى فعل لها ما تريد وصل إليها وأخدمته من يريد وقضت حوائجه ولم تحتجب عنها، والذي يفعل لها القرابين من حيوان ناطق وغير ناطق ويدع المفترضات ويستعمل كل ما يقبح في العقل استعماله، وقيل أيضا إن بيدوخ هو إبليس نفسه، وقال رجل من السحرة لابن النديم إنه رآها في النوم جالسة على هيئتها في اليقظة وحولها قوم يشبهون النبط سوادية حفاة مشققي الأعقاب {cite:fihrist-ibn-al-nadim p. 432}."
  en: "Bidukh — Iblis's daughter enthroned on the water, to whom sorcerers offered sacrifice {cite:fihrist-ibn-al-nadim}"
  es: "Bidukh — Hija de Iblis entronizada sobre el agua, a quien los hechiceros ofrecían sacrificios {cite:fihrist-ibn-al-nadim}"
  fr: "Bidukh — la fille d'Iblis intronisée sur l'eau, à qui les sorciers offraient des sacrifices {cite:fihrist-ibn-al-nadim}"
  ur: "بدوخ - ابلیس کی بیٹی پانی پر تخت نشین تھی، جس کے لیے جادوگروں نے قربانی پیش کی تھی۔"
  tr: "Birisi suçlu büyücülerin yöntemini anlattığında başı döner, İblis'in kızı. Söylenir ki, o İblis'in oğlunun kızıdır ve su üzerinde tahtı vardır. Birisi istediğini yapmak istediğinde, ona ulaşır, istediğine hizmet eder, ihtiyaçlarını ondan saklamadan karşılar. Onun için kurban sunan, konuşan ya da konuşmayan kişi, varsayımları terk eder ve yasak kabul edilen her şeyi kullanır. Ayrıca kendisinin beydukh olduğu da söylenir (İblis). Bir büyücü İbn el-Nadim'e, onu uyanık halde, Nabati benzeri insanlarla çevrili, çıplak ayaklı, topuklu topuklu otururken gördüğünü söylemiştir {atıf:fihrist-ibn-al-nadim s. 432}."
  id: "Dia pusing ketika seseorang menceritakan tentang metode penyihir yang salah, putri Iblis. Dikatakan bahwa dia adalah putri putra Iblis dan memiliki takhta di atas air. Setiap kali seseorang ingin melakukan apa pun yang dia inginkan, dia akan mendekatinya, melayani siapa pun yang dia mau, memenuhi kebutuhannya tanpa bersembunyi darinya. Siapa pun yang melakukan pengorbanan untuknya, baik yang berbicara maupun tidak, meninggalkan asumsi, dan menggunakan segala sesuatu yang dianggap tidak boleh digunakan. Dikatakan juga bahwa dia adalah beydukh sendiri (Iblis). Seorang penyihir memberitahu Ibn al-Nadim bahwa dia melihatnya duduk dalam tidurnya, dalam keadaan terjaga, dikelilingi oleh orang-orang yang menyerupai Nabataean, bertelanjang kaki, dengan tumit terbelah {cite:fihrist-ibn-al-nadim hlm. 432}."
