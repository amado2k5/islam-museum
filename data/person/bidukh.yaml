label: { ar: "بيدوخ", en: "Bidukh" }
summary:
  ar: "بيدوخ عند من يخبر عن طريقة السحرة المذمومة ابنة إبليس وقيل هي ابنة ابن إبليس وإن لها عرشا على الماء وأن المريد لهذا الأمر متى فعل لها ما تريد وصل إليها وأخدمته من يريد وقضت حوائجه ولم تحتجب عنها، والذي يفعل لها القرابين من حيوان ناطق وغير ناطق ويدع المفترضات ويستعمل كل ما يقبح في العقل استعماله، وقيل أيضا إن بيدوخ هو إبليس نفسه، وقال رجل من السحرة لابن النديم إنه رآها في النوم جالسة على هيئتها في اليقظة وحولها قوم يشبهون النبط سوادية حفاة مشققي الأعقاب {cite:fihrist-ibn-al-nadim p. 432}."
  en: "Bidukh — Iblis's daughter enthroned on the water, to whom sorcerers offered sacrifice {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
