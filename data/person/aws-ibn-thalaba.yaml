summary:
  ar: "أوس بن ثعلبة بن رقي أحد بني تيم الله بن ثعلبة بن عكابة من وجوه من كان بخراسان وقد تقلد بها أموراً جسيمة نسب إليه قصر أوس بالبصرة وهو الذي مر بتدمر فقال في صنميها: فتاتي أهل تدمر حين أني أكمنا تسأما طول القيام."
  en: "Aws ibn Tha'laba ibn Ruqi of Taym Allah, a Khurasan notable who bore great charges there — Qasr Aws at Basra bears his name — and passing Palmyra he mocked its two idols 'you two maidens of Tadmur's folk, how long you have wearied standing'."
