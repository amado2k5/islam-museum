id: person/aws-ibn-thalaba
class: person
label: { ar: "أوس بن ثعلبة", en: "Aws ibn Tha'laba", es: "Aws ibn Tha'laba", fr: "Aws ibn Tha'laba", ur: "اوس بن ثعلبہ" }
summary:
  ar: "أوس بن ثعلبة بن رقي أحد بني تيم الله بن ثعلبة بن عكابة من وجوه من كان بخراسان وقد تقلد بها أموراً جسيمة نسب إليه قصر أوس بالبصرة وهو الذي مر بتدمر فقال في صنميها: فتاتي أهل تدمر حين أني أكمنا تسأما طول القيام وكان على جيش ابن عامر إلى هراة واجتمعت ربيعة إليه بها فسار إليه عبد الله بن خازم ودس إليه من سمه فمرض ثم جرح في الوقعة فمات منها بعد أيام."
  en: "Aws ibn Tha'laba ibn Ruqi of Taym Allah, a Khurasan notable who bore great charges there — Qasr Aws at Basra bears his name — and passing Palmyra he mocked its two idols 'you two maidens of Tadmur's folk, how long you have wearied standing'. He led Ibn Amir's army to Herat; Rabi'a rallied to him there, Ibn Khazim marched on him and had him poisoned — ailing, he took a wound in the battle and died of it days later."
  es: "Aws ibn Tha'laba ibn Ruqi de Taym Allah, un notable de Jorasán que tuvo grandes responsabilidades allí —Qasr Aws en Basora lleva su nombre—, al pasar por Palmira se burló de sus dos ídolos: «Vosotras dos doncellas del pueblo de Tadmur, ¡cuánto tiempo habéis permanecido de pie!». Dirigió al ejército de Ibn Amir hacia Herat; Rabi'a se unió a él allí, Ibn Khazim marchó contra él y lo envenenó; enfermo, resultó herido en la batalla y murió a causa de la herida días después."
  fr: "Aws ibn Tha'laba ibn Ruqi de Taym Allah, notable du Khorasan qui y mena de lourdes charges – le Qasr Aws de Bassora porte son nom –, passant par Palmyre, il se moqua de ses deux idoles: « Vous deux jeunes filles du peuple de Tadmur, depuis combien de temps êtes-vous lassées de rester debout ? » Il mena l'armée d'Ibn Amir à Hérat; Rabi'a s'y rallia, Ibn Khazim marcha sur lui et le fit empoisonner. Déjà malade, il fut blessé au combat et mourut des suites de ses blessures quelques jours plus tard."
  ur: "تیم اللہ کے اوس بن ثعلبہ بن رقی، خراسان کے ایک قابل ذکر ہیں جنہوں نے وہاں بہت بڑے الزامات لگائے - بصرہ میں قصر اوس اس کا نام ہے - اور پالمیرا سے گزرتے ہوئے اس نے اس کے دو بتوں کا مذاق اڑایا 'تم تدمر کی دو لونڈیاں، تم کتنی دیر تک کھڑے ہو کر تھک گئے ہو'۔ وہ ابن عامر کی فوج کو ہرات کی طرف لے گیا۔ ربیعہ وہاں اس کے پاس آیا، ابن خزیم نے اس پر چڑھائی کی اور اسے زہر دیا - بیمار تھا، اس نے جنگ میں ایک زخم لیا اور کچھ دن بعد اس کی موت ہوگئی۔"
