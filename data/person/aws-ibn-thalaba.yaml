label: { ar: "أوس بن ثعلبة", en: "Aws ibn Tha'laba" }
summary:
  ar: "أوس بن ثعلبة بن رقي أحد بني تيم الله بن ثعلبة بن عكابة من وجوه من كان بخراسان وقد تقلد بها أموراً جسيمة نسب إليه قصر أوس بالبصرة وهو الذي مر بتدمر فقال في صنميها: فتاتي أهل تدمر حين أني أكمنا تسأما طول القيام وكان على جيش ابن عامر إلى هراة واجتمعت ربيعة إليه بها فسار إليه عبد الله بن خازم ودس إليه من سمه فمرض ثم جرح في الوقعة فمات منها بعد أيام."
  en: "Aws ibn Tha'laba ibn Ruqi of Taym Allah, a Khurasan notable who bore great charges there — Qasr Aws at Basra bears his name — and passing Palmyra he mocked its two idols 'you two maidens of Tadmur's folk, how long you have wearied standing'. He led Ibn Amir's army to Herat; Rabi'a rallied to him there, Ibn Khazim marched on him and had him poisoned — ailing, he took a wound in the battle and died of it days later."
