summary:
  ar: "أحد أبناء الخليفة هشام بن عبد الملك الذين تولّوا الغزو وإمرة الحج؛ يذكر الكتاب أنه أمّر الناس في الحج سنة ثلاث وعشرين ومئة، وكان الزهري يرافق أبناء هشام في الحج ويرشدهم {cite:salabi-umayyad-state-2020 p.470}."
  tr: "Halife Hisham bin Abd al-Malik'in oğullarından biri olan ve seferi ve Hac komutasını üstlenmiştir; kitapta, 123 Hicri yılında halka hac yapmalarını emrettiği belirtilir ve el-Zuhri Hisham'ın oğullarına hac sırasında eşlik edip onları yönlendirmiştir {cite:selabi-umayyad-state-2020 s.470}."
  id: "Salah satu putra Khalifah Hisham ibn Abd al-Malik yang memimpin kampanye dan memimpin Haji; buku tersebut menyebutkan bahwa ia memerintahkan rakyat untuk melaksanakan Haji pada tahun 123 H, dan al-Zuhri menemani putra-putra Hisham dalam Haji dan membimbing mereka {cite:salabi-umayyad-state-2020 hlm.470}."
