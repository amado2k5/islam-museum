summary:
  ar: "باشا مراكش (1879 – 23 يناير 1956)، آخر كبار قادة الأطلس وأشهرهم؛ خلف أخاه المدني على رأس أسرة الكلاوي سنة 1918، وحكم الجنوب المغربي حليفًا للحماية الفرنسية، وتآمر على عزل السلطان محمد الخامس سنة 1953، ثم قبل عودته واستقلال المغرب في أكتوبر 1955 قبل وفاته بأسابيع."
  en: "Pasha of Marrakesh (1879 – 23 January 1956), the last and most famous of the great caids of the Atlas. He succeeded his brother Madani as head of the Glaoui family in 1918, ruled southern Morocco as an ally of the French protectorate, conspired in the deposition of Sultan Mohammed V in 1953, then accepted his restoration and Moroccan independence in October 1955, weeks before his death."
  ur: "مراکش کے پاشا (1879 – 23 جنوری 1956)، اطلس کے عظیم قائدوں میں آخری اور مشہور ترین؛ 1918 میں اپنے بھائی مدنی کے جانشین بن کر الکلاوی خاندان کے سربراہ ہوئے، فرانسیسی زیرِ حمایت نظام کے حلیف کے طور پر جنوبی مراکش پر حکمرانی کی، 1953 میں سلطان محمد پنجم کی معزولی کی سازش میں شریک رہے، پھر اکتوبر 1955 میں ان کی بحالی اور مراکش کی آزادی قبول کی۔"
