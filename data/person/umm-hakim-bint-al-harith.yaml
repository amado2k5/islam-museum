summary:
  ar: زوج عكرمة بن أبي جهل؛ حضرت أحداً وهي كافرة ثم أسلمت يوم الفتح واستأمنت لزوجها، ثم تزوجها خالد بن سعيد بعد استشهاد عكرمة، وقاتلت يوم مرج الصفر فقتلت سبعة من الروم بعمود الفسطاط.
  en: The wife of Ikrima ibn Abi Jahl; she was at Uhud as a non-Muslim, embraced Islam on the day of the conquest and obtained safety for her husband; she then married Khalid ibn Sa'id after Ikrima's martyrdom, and fought at Marj al-Saffar, killing
    seven Byzantines with a tent pole.
