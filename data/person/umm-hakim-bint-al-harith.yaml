summary:
  ar: "مخزومية؛ كانت امرأة عكرمة بن أبي جهل فأعرس بها خالد بن سعيد بن العاص في الليلة التي كانت وقعة مرج الصفر في صبيحتها، فلما بلغها مصابه انتزعت عمود الفسطاط فقاتلت به فيقال إنها قتلت يومئذ سبعة نفر وإن بها لرذع الخلوق."
  en: "A Makhzumi woman; she had been the wife of Ikrama ibn Abi Jahl, and Khalid ibn Sa'id ibn al-As celebrated his wedding with her on the night before the battle of Marj al-Suffar — when she heard of his fall she tore out the tent-pole and fought with it, said to have killed seven men that day with ragged clothes on her."
