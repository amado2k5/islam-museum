summary:
  ar: "أبو عبد الله الزبير بن أحمد بن سليمان البصري، من ولد الزبير بن العوام، مات قبل سنة عشرين وثلاثمائة {cite:tabaqat-fuqaha-abbas-1981 p. 57}. وله مصنفات منها «الكافي» و«ستر العورة» و«الهدية» {cite:tabaqat-fuqaha-abbas-1981 p. 57}."
  fr: "Abou Abd Allah al-Zubayr ibn Ahmad ibn Sulayman al-Basri, descendant d’al-Zubayr ibn al-Awwam, mourut avant 320 de l’hégire {cite:tabaqat-fuqaha-abbas-1981 p. 57}. Il écrivit notamment al-Kafi et Satr al-awra {cite:tabaqat-fuqaha-abbas-1981 p. 57}."
  tr: "Ebu Abdullah el-Zubeyr ibn Ahmed ibn Süleyman el-Basri, el-Zubeyr bin el-Avvam'ın soyundan olup, 320 Hicri yılından önce vefat etti {atıf:tabaqat-fuqaha-abbas-1981, s. 57}. \"El-Kafi\", \"Sitr el-Urah\" ve \"El-Hadiyah\" gibi eserler kaleme aldı {cite:tabaqat-fuqaha-abbas-1981, s. 57}."
  id: "Abu Abdullah al-Zubayr ibn Ahmad ibn Sulayman al-Basri, keturunan al-Zubayr ibn al-Awwam, meninggal sebelum tahun 320 H {cite:tabaqat-fuqaha-abbas-1981, hlm. 57}. Ia menulis karya-karya seperti \"Al-Kafi,\" \"Sitr al-'Urah,\" dan \"Al-Hadiyah\" {cite:tabaqat-fuqaha-abbas-1981, hlm. 57}."
