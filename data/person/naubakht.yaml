summary:
  ar: "بطاقة أولية لنوبخت، المنجم الفارسي الذي اختار طالع بغداد للمنصور في القرن الثامن، توفي سنة ٧٧٧م؛ تذكره كتب التراجم ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Naubakht, the Persian astrologer who cast the horoscope for Baghdad's founding under al-Mansur, d. 777; the biographical entry is not yet checked on the page."
  es: "Ficha de borrador para Naubakht, el astrólogo persa que elaboró el horóscopo para la fundación de Bagdad bajo al-Mansur, fallecido en 777; la entrada biográfica aún no ha sido revisada en la página."
  fr: "Fiche de projet pour Naubakht, l'astrologue perse qui a dressé l'horoscope de la fondation de Bagdad sous al-Mansur, mort en 777; la notice biographique n'est pas encore vérifiée sur la page."
  ur: "نوبخت کے لیے ڈرافٹ کارڈ، فارسی نجومی جس نے المنصور کے تحت بغداد کے قیام کے لیے زائچہ ڈالا۔ 777; سوانح عمری کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Sekizinci yüzyılda el-Mansur için Bağdat burçunu seçen Pers astrolog Neubecht'in ön kartı 777 yılında öldü; biyografik kitaplarda kendisinden bahsedilir ve biyografisi henüz sayfada incelenmemiştir."
  id: "Kartu awal Neubecht, astrolog Persia yang memilih horoskop Baghdad untuk al-Mansur pada abad kedelapan, meninggal pada tahun 777 M; buku biografi menyebutkannya dan biografinya belum diulas di halaman tersebut."
