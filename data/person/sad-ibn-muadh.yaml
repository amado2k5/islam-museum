summary:
  en: "Chief of the Aws and standard-bearer of the Ansar at Badr, where he pledged the Ansar's full support in the war council and proposed building the command shelter; later gave the ruling on Banu Qurayza and died of a wound received then."
  ar: "سيد الأوس وحامل راية الأنصار يوم بدر؛ أجاب عن الأنصار في المجلس الاستشاري ببيعة القتال خارج ديارهم، واقترح بناء العريش مقراً للقيادة؛ حكم بعدئذ في بني قريظة ومات من جرح أصابه فيها. وكان قد نجا يوم بعاث قبل الإسلام حين خرج فأجاره عمرو بن الجموح الحرامي {cite:samhudi-wafa-al-wafa p. 228}. وفي الصحيح أن النبي قال عند موته «اهتز عرش الرحمن لموت سعد بن معاذ» {cite:sahih-al-bukhari 3803}، ولما نزلت بنو قريظة على حكمه قال «قوموا إلى سيدكم» فحكم بقتل مقاتلتهم وسبي ذراريهم فقال «حكمت بحكم الله» {cite:sahih-al-bukhari 3804}، وللحديث رواية في مسلم عن جابر وجنازة سعد بين أيديهم {cite:sahih-muslim 2466}."
