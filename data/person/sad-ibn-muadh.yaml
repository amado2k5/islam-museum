    ar: "سعد بن معاذ سيد الأوس وحامل راية الأنصار يوم بدر، وأجاب في مشورة الخروج إليها ببيعة القتال خارج الديار."
    en: "Sa'd ibn Mu'adh, chief of the Aws and the Ansar's standard-bearer at Badr, pledged on their behalf to fight beyond their homes in the pre-battle council."
