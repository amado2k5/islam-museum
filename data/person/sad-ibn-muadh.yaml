summary:
  en: "Chief of the Aws and standard-bearer of the Ansar at Badr, where he pledged the Ansar's full support in the war council and proposed building the command shelter; later gave the ruling on Banu Qurayza and died of a wound received then."
  ar: "سيد الأوس وحامل راية الأنصار يوم بدر؛ أجاب عن الأنصار في المجلس الاستشاري ببيعة القتال خارج ديارهم، واقترح بناء العريش مقراً للقيادة؛ حكم بعدئذ في بني قريظة ومات من جرح أصابه فيها. وكان قد نجا يوم بعاث قبل الإسلام حين خرج فأجاره عمرو بن الجموح الحرامي {cite:samhudi-wafa-al-wafa p. 228}. وفي الصحيح أن النبي قال عند موته «اهتز عرش الرحمن لموت سعد بن معاذ» {cite:sahih-al-bukhari 3803}، ولما نزلت بنو قريظة على حكمه قال «قوموا إلى سيدكم» فحكم بقتل مقاتلتهم وسبي ذراريهم فقال «حكمت بحكم الله» {cite:sahih-al-bukhari 3804}، وللحديث رواية في مسلم عن جابر وجنازة سعد بين أيديهم {cite:sahih-muslim 2466}."
  ur: "اوس کے سردار اور بدر میں انصار کے علم بردار؛ بنو قریظہ کے بارے میں فیصلہ دیا اور اس دور میں لگنے والے زخم سے وفات پائی۔ {cite:mubarakpuri-raheeq}"
  es: "Jefe de los Aws y portaestandarte de los Ansar en Badr, donde prometió el pleno apoyo de los Ansar en el consejo de guerra y propuso la construcción del refugio de mando; posteriormente dictó sentencia sobre Banu Qurayza y murió a causa de una herida recibida entonces."
  fr: "Chef des Aws et porte-étendard des Ansar à Badr, où il promit le soutien total des Ansar au conseil de guerre et proposa la construction de l'abri de commandement; rendit plus tard la décision sur Banu Qurayza et mourut d'une blessure reçue à cette occasion."
  tr: "Ebs Günü'nde Ensar'ın ustası ve bayrak taşıyıcısı olarak; danışma kurulunda Ensar'a evlerinin dışında savaşmaya bağlılık yemini etti ve karargah olarak El-Ariş'in inşa edilmesini önerdi; daha sonra Banu Qurayza'da hüküm sürdü ve orada aldığı yaradan dolayı hayatını kaybetti. İslam'dan önce Baas gününden sağ çıkmıştı ve hırsız Amr bin el-Camah tarafından kurtarıldı {atıf:samhudi-vafa-el-vafa, s. 228}. Gerçek rivayette, Peygamber ölümünde şöyle demiştir: \"En Merhametli'nin tahtı, Sa'd ibn Mu'adh'ın ölümüyle sarsıldı\" {atıf:sahih-al-bukhari 3803} ve Banu Kurayza yargısına indiğinde, \"Efendine kalk,\" dedi, bu yüzden savaşçılarının öldürülmesini ve çocuklarının esir alınmasını emretti: \"Allah'ın hükmiyle hükmettim\" {cite:sahih-al-bukhari 3804}. Cabir'den Müslüman dilinde bir rivayet vardır ve Sa'd'ın cenazesi onların önünde yapılmıştır {cite:sahih-muslim 2466}."
  id: "Tuan Aws dan pembawa panji Ansar pada Hari Badr; ia menanggapi Ansar dalam dewan penasihat dengan bersumpah setia untuk bertempur di luar rumah mereka dan mengusulkan membangun Al-Arish sebagai markas; ia kemudian memerintah di Banu Qurayza dan meninggal karena luka yang dideritanya di sana. Ia selamat dari masa Ba'ath sebelum Islam ketika ia diselamatkan oleh Amr ibn al-Jamuh si pencuri {cite:samhudi-wafa-al-wafa, hlm. 228}. Dalam riwayat yang otentik, Nabi berkata saat wafat: \"Takhta Yang Maha Penyayang terguncang oleh kematian Sa'd ibn Mu'adh\" {cite:sahih-al-bukhari 3803}, dan ketika Banu Qurayza turun untuk menghakimi, ia berkata, \"Bangkitlah kepada tuanmu,\" maka ia memerintahkan agar para pejuang mereka dibunuh dan keturunan mereka ditawan, sambil berkata: \"Aku telah memerintah menurut hukuman Allah\" {cite:sahih-al-bukhari 3804}. Ada sebuah riwayat dalam bahasa Muslim dari pemakaman Jabir dan Sa'd yang diadakan di hadapan mereka {cite:sahih-muslim 2466}."
