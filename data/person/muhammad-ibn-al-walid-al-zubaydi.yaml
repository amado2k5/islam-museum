summary:
  ar: "من فقهاء الشام، أبو الهذيل محمد بن الوليد الزبيدي؛ قال محمد بن سالم إنه قرأ القرآن على ابن شهاب بالرصافة، فقال له ابن شهاب إن هذا قد احتوى على ما بين جنبي من العلم {cite:tabaqat-fuqaha-abbas-1981 p. 41}."
  tr: "Levant'ın hukukçuları arasında Ebu el-Hudhayl Muhammed bin el-Velid el-Zubeydi; Muhammed ibn Salim, el-Rusefa evinde İbn Şihab'a Kur'an okuduğunu söyledi ve İbn Şihab da bu Kur'an'ın benim taraflarım arasında olan bilgileri içerdiğini söyledi {atıf:tabaqat-fuqaha-abbas-1981, s. 41}."
  id: "Di antara para ahli hukum Levant, Abu al-Hudhayl Muhammad ibn al-Walid al-Zubaidi; Muhammad ibn Salim mengatakan ia membacakan Al-Qur'an kepada Ibn Shihab di al-Rusafa, dan Ibn Shihab mengatakan bahwa Al-Qur'an ini berisi apa yang saya ketahui {cite:tabaqat-fuqaha-abbas-1981, hlm. 41}."
