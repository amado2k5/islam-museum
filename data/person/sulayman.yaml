gender: male
summary:
  ar: "سليمان بن داود. عند البخاري قال «لأطوفن الليلة على مائة امرأة تلد كل امرأة غلاماً يقاتل في سبيل الله» فقال له الملك قل إن شاء الله فلم يقل، وقال النبي «لو قال إن شاء الله لم يخلف وكان أرجى لحاجته» {cite:sahih-al-bukhari 5242}."
  en: "Son of Dawud who swore to father a hundred fighting sons and forgot 'God willing' — a lesson the Prophet repeated {cite:sahih-al-bukhari 5242}."
  es: "Hijo de Dawud que juró engendrar cien hijos guerreros y olvidó 'si Dios quiere', una lección que el Profeta repitió {cite:sahih-al-bukhari 5242}."
  fr: "Fils de Dawud qui jura d'engendrer cent fils guerriers et oublia « si Dieu le veut » — une leçon que le Prophète répéta {cite:sahih-al-bukhari 5242}."
  ur: "داؤد کا بیٹا جس نے باپ سے سو لڑنے والے بیٹوں کی قسم کھائی اور 'انشاء اللہ' کو بھول گیا - ایک سبق نبی نے دہرایا {حوالہ: صحیح البخاری 5242}۔"
  tr: "Süleyman bin Davud. El-Buhari'ye göre, şöyle dedi: \"Bu gece yüz kadını çevreleyeceğim, her biri Allah uğruna savaşan bir erkek çocuk doğuracak.\" Kral ona, 'İnşallah söyle,' dedi ama o söylemedi. Peygamber dedi ki, 'Eğer Allah izin verseydi, emirlerini bozmazdı ve ihtiyacı için daha umut verici olurdu.' {alıntı:sahih-al-bukhari 5242}."
  id: "Sulayman ibn Dawud. Menurut al-Bukhari, ia berkata: \"Malam ini aku akan mengelilingi seratus wanita, masing-masing melahirkan seorang anak laki-laki yang berjuang demi Allah.\" Raja berkata kepadanya, 'Katakanlah, insya Allah,' tetapi ia tidak berkata. Nabi berkata, 'Jika ia berkata, 'Jika Allah berkehendak, ia tidak akan melanggar perintahnya, dan itu akan lebih berharap untuk kebutuhannya.' {cite:sahih-al-bukhari 5242}."
