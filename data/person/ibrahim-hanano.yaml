summary:
  ar: "قائد وطني سوري من أصل كردي (1869–1935)، موظف بلدي عثماني سابق قاد ثورة الشمال ضد الانتداب الفرنسي في أوائل عشرينيات القرن العشرين، وكان من مؤسسي الكتلة الوطنية وعضوا في الجمعية التأسيسية التي وضعت دستور 1930."
  en: "Syrian national leader of Kurdish origin (1869–1935), a former Ottoman municipal official who led the revolt of the north against the French Mandate in the early 1920s; a founding figure of the National Bloc and a member of the 1928 constituent assembly that drafted Syria's first republican constitution."
  ur: "کرد نژاد شامی قومی رہنما (1869–1935)، سابق عثمانی بلدیاتی اہلکار جنہوں نے 1920 کی دہائی کے اوائل میں فرانسیسی مینڈیٹ کے خلاف شمالی بغاوت کی قیادت کی؛ الکتلة الوطنیہ کے بانیوں میں سے اور 1928 کی مجلسِ تأسیسی کے رکن جنہوں نے شام کا پہلا جمہوری آئین تیار کیا۔"
  es: "Líder nacional sirio de origen kurdo (1869-1935), antiguo funcionario municipal otomano que lideró la revuelta del norte contra el Mandato francés a principios de la década de 1920; figura fundadora del Bloque Nacional y miembro de la asamblea constituyente de 1928 que redactó la primera constitución republicana de Siria."
  fr: "Leader national syrien d'origine kurde (1869-1935), ancien fonctionnaire municipal ottoman qui a mené la révolte du nord contre le mandat français au début des années 1920; figure fondatrice du Bloc national et membre de l'assemblée constituante de 1928 qui a rédigé la première constitution républicaine de la Syrie."
  tr: "Kürt kökenli Suriye ulusal lideri (1869–1935), 1920'lerin başında Fransız mandasına karşı kuzey devrimine öncülük eden eski bir Osmanlı belediye yetkilisi, Ulusal Blok'un kurucularından biri ve 1930 anayasasını hazırlayan Kurucu Meclis üyesiydi."
  id: "Seorang pemimpin nasional Suriah keturunan Kurdi (1869–1935), mantan pejabat kota Ottoman yang memimpin revolusi utara melawan mandat Prancis pada awal 1920-an, adalah salah satu pendiri Blok Nasional, dan anggota Majelis Konstituante yang merancang konstitusi tahun 1930."
