summary:
  ar: "قائد وطني سوري من أصل كردي (1869–1935)، موظف بلدي عثماني سابق قاد ثورة الشمال ضد الانتداب الفرنسي في أوائل عشرينيات القرن العشرين، وكان من مؤسسي الكتلة الوطنية وعضوا في الجمعية التأسيسية التي وضعت دستور 1930."
  en: "Syrian national leader of Kurdish origin (1869–1935), a former Ottoman municipal official who led the revolt of the north against the French Mandate in the early 1920s; a founding figure of the National Bloc and a member of the 1928 constituent assembly that drafted Syria's first republican constitution."
