summary:
  ar: "أجناديوس، البطريرك الذي نصبه نصارى القسطنطينية بعد الفتح على رواية الصلابي؛ يذكر الكتاب أن محمد الفاتح اجتمع بالأساقفة وطمأنهم إلى المحافظة على عقائدهم وبيوت عبادتهم وأمرهم بتنصيب بطريرك جديد فانتخبوا أجناديوس، فتوجه في موكب من الأساقفة إلى مقر السلطان فاستقبله بحفاوة وتناول معه الطعام وتحدثا في موضوعات دينية وسياسية، وخرج البطريرك وقد تغيرت فكرته عن السلاطين العثمانيين والمسلمين — على ما يصوره الكتاب {cite:dawlat-uthmaniyya-salabi p. 111-112}."
  en: "Gennadios, the patriarch the Christians of Constantinople elected after the conquest in al-Salabi's telling: Mehmed II met the bishops, assured them their creeds and houses of worship would be preserved, and ordered a new patriarch installed. They chose Gennadios, who came in a procession of bishops to the sultan's seat, was received with great honour, dined with him and talked of religious and political matters — and left, in the book's portrait, with his view of the Ottoman sultans and of Muslims altogether changed {cite:dawlat-uthmaniyya-salabi p. 111-112}."
