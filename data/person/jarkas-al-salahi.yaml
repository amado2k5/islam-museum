summary:
  ar: "جاركس — ويقال جركس — الأمير الكبير فخر الدين الصلاحي؛ أعطاه العادل بانياس والشقيف فأقام هناك مدة، وكان أحد أمراء صلاح الدين شهد الغزوات كلها، وكان كريماً نبيل القدر عالي الهمة، بنى بالقاهرة القيسارية الكبرى حتى تقول البلاد ما نرى شيئاً من البلاد مثلها في حسنها وعظمها وإحكام بنائها، وبنى بأعلاها مسجداً كبيراً وربعاً معلقاً — وجاركس بكسر الجيم معناه بالعربية أربعة أنفس؛ توفي في رجب سنة ثمان وستمائة بدمشق ودفن بقاسيون في تربته التي وقف عليها قرية بوادي بردا تسمى الكفر وعشرين قيراطاً من جميع قرية بيت سواسوى وأحكار بيوت بالصالحية وعلى قبره قبة عظيمة على جادة الطريق {cite:shadharat-dhahab p. 40}."
  en: "Jarkas — also read Jarkas — the great amir Fakhr al-Din al-Salahi; al-Adil gave him Banyas and the Shaqif and he dwelt there a while; one of Salah al-Din's amirs who witnessed every campaign, generous, noble and high-minded — he built Cairo's great Qaysariyya, of which folk said 'we see nothing in the lands its like in beauty, size and craft', raising atop it a great mosque and a suspended quarter; jarkas in Arabic means 'four persons'. He died in Rajab 608 at Damascus, buried at Qasyun in the turba he had endowed with the village of al-Kufr in Wadi Barada, twenty qirats of Bayt Sawaswi, house-plots at Salihiyya, and a great dome over his grave on the highway {cite:shadharat-dhahab p. 40}."
  es: "Jarkas — también leído Jarkas — el gran emir Fakhr al-Din al-Salahi; al-Adil le dio Banyas y el Shaqif y él habitó allí un tiempo; uno de los emires de Salah al-Din que presenció cada campaña, generoso, noble y de mente elevada — construyó la gran Qaysariyya de El Cairo, de la cual la gente decía 'no vemos nada igual en tierras en belleza, tamaño y artesanía', levantando sobre ella una gran mezquita y un barrio suspendido; jarkas en árabe significa 'cuatro personas'. Murió en Rajab 608 en Damasco, enterrado en Qasyun en el turba que había dotado con la aldea de al-Kufr en Wadi Barada, veinte qirats de Bayt Sawaswi, parcelas para casas en Salihiyya y una gran cúpula sobre su tumba en la carretera {cite:shadharat-dhahab p. 40}."
  fr: "Jarkas — également orthographié Jarkas — le grand émir Fakhr al-Din al-Salahi; al-Adil lui offrit Banyas et le Shaqif, où il résida quelque temps; l'un des émirs de Saladin, témoin de toutes les campagnes, généreux, noble et magnanime, il fit construire la grande Qaysariyya du Caire, dont on disait: « On ne voit rien de comparable dans le monde en termes de beauté, de taille et de savoir-faire », et y fit ériger une grande mosquée et un quartier suspendu; jarkas signifie « quatre personnes » en arabe. Il mourut en Rajab 608 à Damas et fut enterré à Qasyun, dans la turba qu'il avait dotée du village d'al-Kufr dans le Wadi Barada, de vingt qirats à Bayt Sawaswi, de parcelles de terrain à Salihiyya et d'un grand dôme recouvrant sa tombe sur la route principale (cite: shadharat-dhahab, p. 40)."
  ur: "جارکاس — جارکاس بھی پڑھیں — عظیم امیر فخر الدین الصلاحی؛ عادل نے اسے بنیاس اور شقیف دیا اور وہ وہاں کچھ عرصہ مقیم رہا۔ صلاح الدین کے امیروں میں سے ایک جس نے ہر مہم کا مشاہدہ کیا، فیاض، عظیم اور اعلیٰ دماغ - اس نے قاہرہ کی عظیم قیصریہ تعمیر کی، جس کے بارے میں لوگوں کا کہنا تھا کہ 'ہمیں اس سرزمین میں خوبصورتی، جسامت اور ہنر جیسی کوئی چیز نظر نہیں آتی'، اس کے اوپر ایک عظیم مسجد اور ایک معلق کوارٹر بنایا گیا؛ عربی میں جارک کا مطلب 'چار افراد' ہے۔ آپ کا انتقال رجب 608 میں دمشق میں ہوا، قصیون میں اس تربہ میں دفن کیا گیا جو اس نے وادی بردہ میں الکفر نامی گاؤں کے ساتھ عطا کیا تھا، بیس قیراط بیت سواسوی، صالحیہ میں مکانات اور شاہراہ پر ان کی قبر پر ایک عظیم گنبد تھا۔ 40}۔"
