names:
  - { value: "فخر الدين جاركس — ويقال جركس — الأمير الكبير الصلاحي", kind: full }
summary:
  ar: "جاركس — ويقال جركس — الأمير الكبير فخر الدين الصلاحي؛ أعطاه العادل بانياس والشقيف فأقام هناك مدة، وكان أحد أمراء صلاح الدين شهد الغزوات كلها، وكان كريماً نبيل القدر عالي الهمة، بنى بالقاهرة القيسارية الكبرى حتى تقول البلاد ما نرى شيئاً من البلاد مثلها في حسنها وعظمها وإحكام بنائها، وبنى بأعلاها مسجداً كبيراً وربعاً معلقاً — وجاركس بكسر الجيم معناه بالعربية أربعة أنفس؛ توفي في رجب سنة ثمان وستمائة بدمشق ودفن بقاسيون في تربته التي وقف عليها قرية بوادي بردا تسمى الكفر وعشرين قيراطاً من جميع قرية بيت سواسوى وأحكار بيوت بالصالحية وعلى قبره قبة عظيمة على جادة الطريق {cite:shadharat-dhahab p. 40}."
  en: "Jarkas — also read Jarkas — the great amir Fakhr al-Din al-Salahi; al-Adil gave him Banyas and the Shaqif and he dwelt there a while; one of Salah al-Din's amirs who witnessed every campaign, generous, noble and high-minded — he built Cairo's great Qaysariyya, of which folk said 'we see nothing in the lands its like in beauty, size and craft', raising atop it a great mosque and a suspended quarter; jarkas in Arabic means 'four persons'. He died in Rajab 608 at Damascus, buried at Qasyun in the turba he had endowed with the village of al-Kufr in Wadi Barada, twenty qirats of Bayt Sawaswi, house-plots at Salihiyya, and a great dome over his grave on the highway {cite:shadharat-dhahab p. 40}."
