summary:
  ar: "إمام أمريكي من أصل أفريقي، وُلد باسم جيفري كيرس في بروكلين بنيويورك في 11 مارس 1950. انضم إلى حركة أمة الإسلام سنة 1969 ثم صار مسلما سنيا بعد سنة 1975، ودرس في جامعة أم القرى بمكة سنة 1978، وأسس مسجد التقوى في بروكلين سنة 1981 وما زال إمامه. كان سنة 1991 أول مسلم يلقي صلاة الافتتاح في مجلس النواب الأمريكي؛ وهو نائب رئيس سابق للجمعية الإسلامية لأمريكا الشمالية وقائد تحالف مسلمي أمريكا الشمالية (MANA)."
  en: "African-American imam, born Jeffrey Kearse in Brooklyn, New York, on 11 March 1950. He joined the Nation of Islam in 1969 and became a Sunni Muslim after 1975, studied at Umm al-Qura University in Mecca in 1978, and founded Masjid At-Taqwa in Brooklyn in 1981, whose imam he remains. In 1991 he became the first Muslim to deliver an opening prayer in the United States House of Representatives; he is a former vice-president of the Islamic Society of North America and the leader of the Muslim Alliance in North America (MANA)."
  ur: "افریقی نژاد امریکی امام، 11 مارچ 1950 کو بروکلین، نیویارک میں جیفری کیئرس کے نام سے پیدا ہوئے۔ وہ 1969 میں نیشن آف اسلام میں شامل ہوئے اور 1975 کے بعد سنی مسلمان بن گئے، 1978 میں مکہ کی ام القریٰ یونیورسٹی میں تعلیم حاصل کی، اور 1981 میں بروکلین میں مسجد التقویٰ قائم کی جس کے وہ اب بھی امام ہیں۔ 1991 میں وہ امریکی ایوانِ نمائندگان میں افتتاحی دعا پڑھنے والے پہلے مسلمان بنے؛ وہ اسلامک سوسائٹی آف نارتھ امریکہ کے سابق نائب صدر اور مسلم الائنس ان نارتھ امریکہ (MANA) کے قائد ہیں۔"
