summary:
  ar: "إمام أمريكي من أصل أفريقي، وُلد باسم جيفري كيرس في بروكلين بنيويورك في 11 مارس 1950. انضم إلى حركة أمة الإسلام سنة 1969 ثم صار مسلما سنيا بعد سنة 1975، ودرس في جامعة أم القرى بمكة سنة 1978، وأسس مسجد التقوى في بروكلين سنة 1981 وما زال إمامه. كان سنة 1991 أول مسلم يلقي صلاة الافتتاح في مجلس النواب الأمريكي؛ وهو نائب رئيس سابق للجمعية الإسلامية لأمريكا الشمالية وقائد تحالف مسلمي أمريكا الشمالية (MANA)."
  en: "African-American imam, born Jeffrey Kearse in Brooklyn, New York, on 11 March 1950. He joined the Nation of Islam in 1969 and became a Sunni Muslim after 1975, studied at Umm al-Qura University in Mecca in 1978, and founded Masjid At-Taqwa in Brooklyn in 1981, whose imam he remains. In 1991 he became the first Muslim to deliver an opening prayer in the United States House of Representatives; he is a former vice-president of the Islamic Society of North America and the leader of the Muslim Alliance in North America (MANA)."
  ur: "افریقی نژاد امریکی امام، 11 مارچ 1950 کو بروکلین، نیویارک میں جیفری کیئرس کے نام سے پیدا ہوئے۔ وہ 1969 میں نیشن آف اسلام میں شامل ہوئے اور 1975 کے بعد سنی مسلمان بن گئے، 1978 میں مکہ کی ام القریٰ یونیورسٹی میں تعلیم حاصل کی، اور 1981 میں بروکلین میں مسجد التقویٰ قائم کی جس کے وہ اب بھی امام ہیں۔ 1991 میں وہ امریکی ایوانِ نمائندگان میں افتتاحی دعا پڑھنے والے پہلے مسلمان بنے؛ وہ اسلامک سوسائٹی آف نارتھ امریکہ کے سابق نائب صدر اور مسلم الائنس ان نارتھ امریکہ (MANA) کے قائد ہیں۔"
  es: "Imán afroamericano, nacido Jeffrey Kearse en Brooklyn, Nueva York, el 11 de marzo de 1950. Se unió a la Nación del Islam en 1969 y se convirtió al islam sunita después de 1975. Estudió en la Universidad Umm al-Qura en La Meca en 1978 y fundó la Mezquita At-Taqwa en Brooklyn en 1981, de la cual sigue siendo imán. En 1991 se convirtió en el primer musulmán en pronunciar la oración de apertura en la Cámara de Representantes de los Estados Unidos; es exvicepresidente de la Sociedad Islámica de América del Norte y líder de la Alianza Musulmana en América del Norte (MANA)."
  fr: "Imam afro-américain, né Jeffrey Kearse à Brooklyn (New York) le 11 mars 1950, il a rejoint la Nation of Islam en 1969 et s'est converti à l'islam sunnite après 1975. Il a étudié à l'université Umm al-Qura de La Mecque en 1978 et a fondé la mosquée Masjid At-Taqwa à Brooklyn en 1981, dont il est toujours l'imam. En 1991, il est devenu le premier musulman à prononcer la prière d'ouverture à la Chambre des représentants des États-Unis. Il est un ancien vice-président de la Société islamique d'Amérique du Nord et le dirigeant de l'Alliance musulmane d'Amérique du Nord (MANA)."
  tr: "Afrikalı Amerikalı bir imam, 11 Mart 1950'de New York, Brooklyn'de Jeffrey Kearse adıyla doğdu. 1969'da İslam Milleti hareketine katıldı, 1975'ten sonra Sünni Müslüman oldu, 1978'de Mekke'deki Um Al-Qura Üniversitesi'nde eğitim gördü, 1981'de Brooklyn'de El-Taqva Camii'ni kurdu ve hâlâ onun imamı olarak görev yapıyor. 1991'de ABD Temsilciler Meclisi'nde açılış namazını yöneten ilk Müslüman oldu; Kuzey Amerika İslam Derneği'nin eski başkan yardımcısı ve Kuzey Amerika Müslüman İttifakı'nın (MANA) lideridir."
  id: "Seorang imam Afrika-Amerika, lahir dengan nama Jeffrey Kearse di Brooklyn, New York, pada 11 Maret 1950. Ia bergabung dengan gerakan Nation of Islam pada tahun 1969, kemudian menjadi Muslim Sunni setelah tahun 1975, belajar di um Al-Qura University di Mekah pada tahun 1978, mendirikan Masjid Al-Taqwa di Brooklyn pada tahun 1981, dan tetap menjadi imamnya. Pada tahun 1991, ia menjadi Muslim pertama yang memimpin shalat pembukaan di Dewan Perwakilan AS; ia adalah mantan wakil presiden Islamic Association of North America dan pemimpin North American Muslim Alliance (MANA)."
