  ar: "الفضل بن يحيى بن خالد بن برمك، أخو الخليفة هارون بالرضاعة؛ عهد إليه الرشيد بالإشراف على تربية ابنه الأمين، وولاه مناصب إدارية وقيادية خاصة في المشرق حيث حقق نهضة اقتصادية وعمرانية ووطد الأمن، وأدار مع أبيه يحيى وأخيه جعفر دولة الخلافة العباسية سبعة عشر عاماً (١٧٠-١٨٧هـ) في عصر البرامكة الذهبي؛ وفي النكبة سُجن مع أبيه وإخوته وصودرت ممتلكاتهم وتوفي سنة ١٩٣هـ {cite:tarikh-dawla-abbasiyya-taqqush p. 98, 100}."
  en: "al-Fadl ibn Yahya al-Barmaki — al-Rashid's foster-brother and al-Amin's tutor, governor of the East, confined in the nakba of 187 and dead in prison by 193 {cite:tarikh-dawla-abbasiyya-taqqush p. 98, 100}."
