summary:
  ar: "سعيد بن سلطان البوسعيدي (1791-1856)، خامس حكام أسرة آل بوسعيد وسلطان مسقط وعُمان وزنجبار. خلف والده سنة 1804 مع أخيه سالم، وصار الحاكم الفعلي منفردا بعد مقتل ابن عمه بدر بن سيف سنة 1806. بنى أسطولا وقوة تجارية بحرية، وبسط سلطانه على ساحل شرق أفريقيا، ونقل عاصمته من مسقط إلى زنجبار في ثلاثينيات القرن التاسع عشر، فصارت زنجبار في عهده المركز التجاري الأول في غرب المحيط الهندي وميناء القرنفل والعاج والرقيق، وعقد معاهدات مع بريطانيا وفرنسا والولايات المتحدة. توفي في البحر قرب سيشل، وقُسمت ممتلكاته بوصيته بين ابنيه ماجد وثويني فانفصلت زنجبار عن عُمان."
  en: "Said bin Sultan al-Busaidi (1791–1856), fifth ruler of the Al Bu Said dynasty and Sultan of Muscat, Oman and Zanzibar. He succeeded his father in 1804 jointly with his brother Salim and became effective sole ruler after the killing of his cousin Badr bin Saif in 1806. He built a fleet and a maritime commercial power, extended his rule over the East African coast, and moved his capital from Muscat to Zanzibar in the 1830s, making Zanzibar under him the leading commercial centre of the western Indian Ocean for cloves, ivory and slaves, and concluded treaties with Britain, France and the United States. He died at sea near the Seychelles, and his will divided his dominions between his sons Majid and Thuwaini, separating Zanzibar from Oman."
  ur: "سعید بن سلطان البوسعیدی ⁦(1791ء–1856ء)⁩، آل بوسعید خاندان کے پانچویں حکمران اور مسقط، عمان اور زنجبار کے سلطان۔ 1804ء میں اپنے والد کے بعد بھائی سالم کے ساتھ جانشین بنے اور 1806ء میں چچا زاد بدر بن سیف کے قتل کے بعد عملاً تنہا حکمران بن گئے۔ انہوں نے بحری بیڑا اور تجارتی طاقت بنائی، مشرقی افریقا کے ساحل پر اپنا اقتدار پھیلایا اور 1830ء کی دہائی میں دارالحکومت مسقط سے زنجبار منتقل کر دیا، جس سے زنجبار لونگ، ہاتھی دانت اور غلاموں کی تجارت کا بڑا مرکز بن گیا، اور برطانیہ، فرانس اور امریکا سے معاہدے کیے۔ سیشلز کے قریب سمندر میں وفات پائی اور ان کی وصیت سے ان کے بیٹوں ماجد اور ثوینی کے درمیان مملکت تقسیم ہو گئی۔"
  es: "Said bin Sultan al-Busaidi (1791-1856), quinto gobernante de la dinastía Al Bu Said y sultán de Mascate, Omán y Zanzíbar. Sucedió a su padre en 1804 junto con su hermano Salim y se convirtió en gobernante único de facto tras el asesinato de su primo Badr bin Saif en 1806. Construyó una flota y desarrolló un poderoso comercio marítimo, extendió su dominio sobre la costa de África Oriental y trasladó su capital de Mascate a Zanzíbar en la década de 1830, convirtiendo a Zanzíbar, bajo su mandato, en el principal centro comercial del océano Índico occidental para el clavo, el marfil y los esclavos, y concluyó tratados con Gran Bretaña, Francia y Estados Unidos. Murió en el mar cerca de las Seychelles, y su testamento dividió sus dominios entre sus hijos Majid y Thuwaini, separando Zanzíbar de Omán."
  fr: "Saïd bin Sultan al-Busaidi (1791-1856), cinquième souverain de la dynastie Al Bu Saïd et sultan de Mascate, d'Oman et de Zanzibar, succéda à son père en 1804 conjointement avec son frère Salim. Après l'assassinat de son cousin Badr bin Saif en 1806, il devint le seul maître de facto du pays. Il constitua une flotte et une puissance commerciale maritime, étendit son emprise sur la côte est-africaine et transféra sa capitale de Mascate à Zanzibar dans les années 1830. Sous son règne, Zanzibar devint le principal centre commercial de l'océan Indien occidental pour le clou de girofle, l'ivoire et les esclaves. Il conclut également des traités avec la Grande-Bretagne, la France et les États-Unis. Il mourut en mer près des Seychelles et, dans son testament, ses possessions furent partagées entre ses fils Majid et Thuwaini, Zanzibar étant séparée d'Oman."
  tr: "Said bin Sultan Al Busaidi (1791-1856), Al Busaidi ailesinin beşinci hükümdarı ve Maskat, Umman ve Zanzibar Sultanı. 1804'te babasının yerine kardeşi Salem ile birlikte geçti ve 1806'da kuzeni Badr bin Saif'in öldürülmesinden sonra tek hükümdar oldu. Bir filo ve deniz ticaret gücü kurdu, otoritesini Doğu Afrika kıyıları boyunca genişletti ve başkentini 1830'larda Muskat'tan Zanzibar'a taşıdı. Saltanatı sırasında Zanzibar, batı Hint Okyanusu'nun önde gelen ticaret merkezi oldu; karanfil, fildişi ve kölelerin limanı oldu ve Britanya, Fransa ve Amerika Birleşik Devletleri ile antlaşmalar imzaladı. Seyşeller yakınlarında denizde öldü ve mülkü vasiyetiyle iki oğlu Majid ve Thuwaini arasında bölündü; bu da Zanzibar'ın Umman'dan ayrılmasına yol açtı."
  id: "Said bin Sultan Al Busaidi (1791-1856), penguasa kelima keluarga Al Busaidi dan Sultan Muscat, Oman, dan Zanzibar. Ia menggantikan ayahnya pada tahun 1804 bersama saudaranya Salem dan menjadi satu-satunya penguasa setelah kematian sepupunya Badr bin Saif pada tahun 1806. Ia membangun armada dan kekuatan perdagangan angkatan laut, memperluas otoritasnya di sepanjang pantai Afrika Timur, dan memindahkan ibu kotanya dari Muscat ke Zanzibar pada tahun 1830-an. Selama masa pemerintahannya, Zanzibar menjadi pusat perdagangan utama di Samudra Hindia barat, pelabuhan anyelir, gading, dan budak, dan ia menandatangani perjanjian dengan Inggris, Prancis, dan Amerika Serikat. Ia meninggal di laut dekat Seychelles, dan hartanya dibagi melalui wasiatnya antara dua putranya, Majid dan Thuwaini, sehingga Zanzibar memisahkan diri dari Oman."
