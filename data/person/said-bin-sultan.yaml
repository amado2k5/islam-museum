summary:
  ar: "سعيد بن سلطان البوسعيدي (1791-1856)، خامس حكام أسرة آل بوسعيد وسلطان مسقط وعُمان وزنجبار. خلف والده سنة 1804 مع أخيه سالم، وصار الحاكم الفعلي منفردا بعد مقتل ابن عمه بدر بن سيف سنة 1806. بنى أسطولا وقوة تجارية بحرية، وبسط سلطانه على ساحل شرق أفريقيا، ونقل عاصمته من مسقط إلى زنجبار في ثلاثينيات القرن التاسع عشر، فصارت زنجبار في عهده المركز التجاري الأول في غرب المحيط الهندي وميناء القرنفل والعاج والرقيق، وعقد معاهدات مع بريطانيا وفرنسا والولايات المتحدة. توفي في البحر قرب سيشل، وقُسمت ممتلكاته بوصيته بين ابنيه ماجد وثويني فانفصلت زنجبار عن عُمان."
  en: "Said bin Sultan al-Busaidi (1791–1856), fifth ruler of the Al Bu Said dynasty and Sultan of Muscat, Oman and Zanzibar. He succeeded his father in 1804 jointly with his brother Salim and became effective sole ruler after the killing of his cousin Badr bin Saif in 1806. He built a fleet and a maritime commercial power, extended his rule over the East African coast, and moved his capital from Muscat to Zanzibar in the 1830s, making Zanzibar under him the leading commercial centre of the western Indian Ocean for cloves, ivory and slaves, and concluded treaties with Britain, France and the United States. He died at sea near the Seychelles, and his will divided his dominions between his sons Majid and Thuwaini, separating Zanzibar from Oman."
  ur: "سعید بن سلطان البوسعیدی (1791ء–1856ء)، آل بوسعید خاندان کے پانچویں حکمران اور مسقط، عمان اور زنجبار کے سلطان۔ 1804ء میں اپنے والد کے بعد بھائی سالم کے ساتھ جانشین بنے اور 1806ء میں چچا زاد بدر بن سیف کے قتل کے بعد عملاً تنہا حکمران بن گئے۔ انہوں نے بحری بیڑا اور تجارتی طاقت بنائی، مشرقی افریقا کے ساحل پر اپنا اقتدار پھیلایا اور 1830ء کی دہائی میں دارالحکومت مسقط سے زنجبار منتقل کر دیا، جس سے زنجبار لونگ، ہاتھی دانت اور غلاموں کی تجارت کا بڑا مرکز بن گیا، اور برطانیہ، فرانس اور امریکا سے معاہدے کیے۔ سیشلز کے قریب سمندر میں وفات پائی اور ان کی وصیت سے ان کے بیٹوں ماجد اور ثوینی کے درمیان مملکت تقسیم ہو گئی۔"
