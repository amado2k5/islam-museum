summary:
  ar: "خالد بن علي بن عبد الله الحميدان ⁦(وُلد في حائل عام 1374هـ)⁩ ضابط استخبارات سعودي يرأس الاستخبارات العامة بمرتبة وزير منذ كانون الثاني 2015، وهو عضو في مجلس الشؤون السياسية والأمنية. درس العدالة الجنائية في جامعة ساغينو فالي ستيت، وتدرج في العمل الأمني حتى صار نائبًا لمدير عام المباحث العامة سنة 2011."
  en: "Khalid bin Ali Al Humaidan (born 1955 in Ha'il) is a Saudi intelligence officer who has directed the General Intelligence Directorate since January 2015, holding ministerial rank and a seat on the Council of Political and Security Affairs. A criminal-justice graduate of Saginaw Valley State University, he rose through the security services to become deputy head of the General Investigations Directorate in 2011."
  ur: "خالد بن علی الحمیدان (پیدائش 1955، حائل) سعودی انٹیلیجنس افسر ہیں جو جنوری 2015 سے جنرل انٹیلیجنس ڈائریکٹوریٹ کے سربراہ ہیں؛ انھوں نے ساگینا ویلی اسٹیٹ یونیورسٹی سے کریمنل جسٹس کی تعليم حاصل کی اور 2011 میں جنرل انویسٹیگیشنز ڈائریکٹوریٹ کے نائب سربراہ بنے۔"
