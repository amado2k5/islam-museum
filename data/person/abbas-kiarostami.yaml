summary:
  ar: "مخرج وكاتب سيناريو وشاعر ومصوّر إيراني، وُلد في طهران سنة 1940 وتوفي في باريس سنة 2016؛ أسّس قسم السينما في معهد كانون وصنع «أين بيت الصديق؟» (1987) وثلاثية كوكر و«كلوز أب» (1990) و«طعم الكرز» (1997) الفائز بالسعفة الذهبية في كان و«ستحملنا الريح» (1999)، ثم صوّر أول أفلامه خارج إيران بـ«نسخة مصدّقة» (2010) في إيطاليا و«كمن يعشق» (2012) في اليابان، ويُعدّ من أعظم مخرجي إيران وأكثرهم تأثيرًا."
  en: "Iranian film director, screenwriter, poet and photographer, born in Tehran in 1940 and died in Paris in 2016. He founded the film department at the Kanoon institute and made Where Is the Friend's Home? (1987), the Koker trilogy, Close-Up (1990), Taste of Cherry (1997), which won the Palme d'Or at Cannes, and The Wind Will Carry Us (1999), then filmed outside Iran for the first time with Certified Copy (2010) in Italy and Like Someone in Love (2012) in Japan; he is widely regarded as one of Iran's greatest and most influential filmmakers."
  ur: "ایرانی فلم ہدایت کار، منظر نویس، شاعر و فوٹوگرافر، 1940 میں تہران میں پیدا ہوئے اور 2016 میں پیرس میں وفات پائی؛ انھوں نے کانون ادارے میں فلم شعبہ قائم کیا اور «دوست کا گھر کہاں ہے؟» (1987)، کوکر سہ فلم، «کلوز اپ» (1990)، «چیری کا ذائقہ» (1997) — کان میں پام ڈی اور جیتنے والی — اور «ہوا ہمیں اڑا لے جائے گی» (1999) بنائیں، پھر ایران سے باہر پہلی بار اٹلی میں «سرٹیفائیڈ کاپی» (2010) اور جاپان میں «لائک سم ون ان لو» (2012) فلمائیں؛ انھیں ایران کے عظیم ترین اور بااثر ترین فلم سازوں میں شمار کیا جاتا ہے۔"
