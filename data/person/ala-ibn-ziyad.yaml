id: person/ala-ibn-ziyad
class: person
label: { ar: "العلاء بن زياد", en: "Ala ibn Ziyad" }
summary:
  ar: "العلاء بن زياد بن مطر بن شريح، أبو نصر العدوي البصري، من الطبقة الثانية من التابعين من أهل البصرة. روى عن أبيه وعمران بن حصين وأبي هريرة ومطرّف بن الشخّير وغيرهم، وروى عنه الحسن البصري وجرير بن حازم وهشام بن حسان وغيرهم. قال قتادة إنه بكى حتى غشي بصره، وذكره ابن حبان في الثقات، وقال ابن سعد إنه ثقة وله أحاديث. ويذكر الكتاب وفاته سنة 78 هـ وقيل 94 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
  en: "Ala ibn Ziyad ibn Mutar ibn Shurayh, Abu Nasr al-Adawi of Basra, a Successor of the second generation. He related from his father, Imran ibn Husayn, Abu Hurayra and Mutarrif ibn al-Shikhkhir, among others, and al-Hasan al-Basri, Jarir ibn Hazim and Hisham ibn Hassan related from him. Qatada said that he wept until he lost his sight, Ibn Hibban listed him among the trustworthy, and Ibn Sa'd called him trustworthy. The book gives his death as 78 AH, or 94 AH according to another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
