id: person/ala-ibn-ziyad
class: person
label: { ar: "العلاء بن زياد", en: "Ala ibn Ziyad", fr: "Ala ibn Ziyad", es: "Ala ibn Ziyad", ur: "علاء ابن زیاد" }
summary:
  ar: "العلاء بن زياد بن مطر بن شريح، أبو نصر العدوي البصري، من الطبقة الثانية من التابعين من أهل البصرة. روى عن أبيه وعمران بن حصين وأبي هريرة ومطرّف بن الشخّير وغيرهم، وروى عنه الحسن البصري وجرير بن حازم وهشام بن حسان وغيرهم. قال قتادة إنه بكى حتى غشي بصره، وذكره ابن حبان في الثقات، وقال ابن سعد إنه ثقة وله أحاديث. ويذكر الكتاب وفاته سنة 78 هـ وقيل 94 هـ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
  en: "Ala ibn Ziyad ibn Mutar ibn Shurayh, Abu Nasr al-Adawi of Basra, a Successor of the second generation. He related from his father, Imran ibn Husayn, Abu Hurayra and Mutarrif ibn al-Shikhkhir, among others, and al-Hasan al-Basri, Jarir ibn Hazim and Hisham ibn Hassan related from him. Qatada said that he wept until he lost his sight, Ibn Hibban listed him among the trustworthy, and Ibn Sa'd called him trustworthy. The book gives his death as 78 AH, or 94 AH according to another report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
  fr: "Ala ibn Ziyad ibn Mutar ibn Shurayh, Abu Nasr al-Adawi de Bassora, successeur de la deuxième génération. Il a raconté de son père, Imran ibn Husayn, Abu Hurayra et Mutarrif ibn al-Shikhkhhir, entre autres, et al-Hasan al-Basri, Jarir ibn Hazim et Hisham ibn Hassan ont raconté de lui. Qatada a dit qu'il pleurait jusqu'à ce qu'il perde la vue, Ibn Hibban l'a classé parmi les dignes de confiance, et Ibn Sa'd l'a appelé digne de confiance. Le livre donne sa mort comme 78 de l’hégire, ou 94 de l’hégire selon un autre rapport. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
  es: "Ala ibn Ziyad ibn Mutar ibn Shurayh, Abu Nasr al-Adawi de Basora, un sucesor de la segunda generación. Relató de su padre, Imran ibn Husayn, Abu Hurayra y Mutarrif ibn al-Shikhkhir, entre otros, y al-Hasan al-Basri, Jarir ibn Hazim e Hisham ibn Hassan relataron de él. Qatada dijo que lloró hasta perder la vista, Ibn Hibban lo incluyó entre los dignos de confianza, e Ibn Sa'd lo llamó digno de confianza. El libro indica que murió en el año 78 de la Hégira, o en el 94 de la Hégira según otro relato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
  ur: "علاء بن زیاد ابن مطر بن شریح، ابو نصر العدوی بصرہ، دوسری نسل کے جانشین۔ انہوں نے اپنے والد عمران بن حصین، ابو ہریرہ اور مطرف بن الشخیر وغیرہ سے اور حسن بصری، جریر بن حازم اور ہشام بن حسن نے ان سے روایت کی ہے۔ قتادہ نے کہا کہ وہ روئے یہاں تک کہ اس کی بینائی چلی گئی، ابن حبان نے اسے ثقہ قرار دیا اور ابن سعد نے اسے ثقہ کہا۔ کتاب میں ان کی وفات 78 ہجری یا دوسری روایت کے مطابق 94 ہجری بتائی گئی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6807}"
  tr: "Al-'Alaa ibn Ziyad ibn Matar ibn Şuray, Ebu Nasr al-Adawi al-Basri, Basra'dan gelen Tabi'un'un ikinci kuşağından. Babası İmran bin Hüseyin, Ebu Hureyre, Mutraf ibn el-Şahir ve diğerlerinden rivayet etti; ayrıca el-Hasan el-Basri, Cerir ibn Hazim, Hişam ibn Hassan ve diğerleri tarafından da rivayet edilmiştir. Katadah onun gözünün bayılana kadar ağladığını, İbn Hibben'in onu güvenilir kişiler arasında saydığını, İbn Sad'ın ise güvenilir olduğunu ve hadisleri olduğunu söylediğini söyledi. Kitapta 78 Hicri yılında ve bazıları 94 hicri yıllarında öldüğünü belirtir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6808}"
  id: "Al-'Alaa ibn Ziyad ibn Matar ibn Shurayh, Abu Nasr al-Adawi al-Basri, dari generasi kedua Tabi'un dari Basra. Ia menceritakan dari ayahnya, Imran ibn Husayn, Abu Huraira, Mutraf ibn al-Shakhir, dan lainnya, serta diceritakan darinya oleh al-Hasan al-Basri, Jarir ibn Hazim, Hisham ibn Hassan, dan lainnya. Qatadah mengatakan ia menangis hingga penglihatannya pingsan, dan Ibn Hibban menyebutnya di antara yang dapat dipercaya, dan Ibn Sa'd mengatakan ia dapat dipercaya dan memiliki hadits. Kitab tersebut menyebutkan kematiannya pada tahun 78 H, dan beberapa orang mengatakan 94 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6808}"
