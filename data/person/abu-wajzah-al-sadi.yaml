summary:
  ar: 'يزيد بن عبيد السلمي السعدي، أبو وجزة: شاعر محدث مقرئ من التابعين، أصله من بني سليم، نشأ في بني سعد بن بكر بن هوازن فنسب إليهم، وسكن المدينة وتوفي بها سنة 130 هـ.'
  en: 'Yazid ibn Ubayd al-Sulami al-Sa''di, Abu Wajza: a poet, hadith transmitter and Qur''an reciter of the Tabi''un, of Banu Sulaym origin, raised among Banu Sa''d ibn Bakr ibn Hawazin, to whom his nisba refers; he lived in Medina and died there in 130 AH.'
