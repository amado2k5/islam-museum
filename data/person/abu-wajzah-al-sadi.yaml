gender: male
summary:
  ar: 'يزيد بن عبيد السلمي السعدي، أبو وجزة: شاعر محدث مقرئ من التابعين، أصله من بني سليم، نشأ في بني سعد بن بكر بن هوازن فنسب إليهم، وسكن المدينة وتوفي بها سنة 130 هـ.'
  en: 'Yazid ibn Ubayd al-Sulami al-Sa''di, Abu Wajza: a poet, hadith transmitter and Qur''an reciter of the Tabi''un, of Banu Sulaym origin, raised among Banu Sa''d ibn Bakr ibn Hawazin, to whom his nisba refers; he lived in Medina and died there in 130 AH.'
  fr: "Yazid ibn Ubayd al-Sulami al-Sa'di, Abu Wajza : poète, transmetteur du hadith et lecteur du Coran parmi les Tabi'un, originaire des Banu Sulaym, élevé parmi les Banu Sa'd ibn Bakr ibn Hawazin auxquels renvoie sa nisba ; il vécut à Médine et y mourut en 130 H."
  es: "Yazid ibn Ubayd al-Sulami al-Sa'di, Abu Wajza: poeta, transmisor de hadices y recitador del Corán de los Tabi'un, de origen Banu Sulaym, criado entre Banu Sa'd ibn Bakr ibn Hawazin, a quien se refiere su nisba; vivió en Medina y murió allí en el año 130 d.H."
  ur: "یزید بن عبید السلمی السعدی، ابو وجّہ: ایک شاعر، حدیث کی ترسیل کرنے والا اور تابعین کا قاری، بنو سلیم سے تعلق رکھنے والا، بنو سعد بن بکر بن ہوازن میں پرورش پایا، جس سے اس کا نسبہ مراد ہے؛ مدینہ میں مقیم رہے اور وہیں 130ھ میں وفات پائی۔"
