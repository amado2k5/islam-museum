summary:
  ar: "محمد ناصر الدين الألباني ⁦(1914–1999)⁩ محدّث ألباني-سوري-أردني، من أشهر محققي الحديث في القرن العشرين، أعاد تقييم دواوين السنة الكبرى وشكّل المنهج الحديثي للسلفية المعاصرة. من آثاره «سلسلة الأحاديث الصحيحة» و«سلسلة الأحاديث الضعيفة» و«صفة صلاة النبي»."
  en: "Muhammad Nasiruddin al-Albani (1914–1999) was an Albanian-Syrian-Jordanian hadith scholar, among the most famous hadith verifiers of the twentieth century, who re-evaluated the major Sunna collections and shaped the contemporary Salafi hadith method. His works include Silsilat al-Ahadith al-Sahihah, Silsilat al-Ahadith al-Da'ifah and Sifat Salat al-Nabi."
  ur: "محمد ناصرالدین البانی ⁦(1914–1999)⁩ البانی-شامی-اردنی محدث تھے، بیسویں صدی کے مشہور ترین محققینِ حدیث میں، جنہوں نے بڑی کتبِ سنہ کا دوبارہ جائزہ لیا اور عصری سلفی حدیثی منہج تشکیل دیا۔ آثار میں «سلسلة الأحاديث الصحيحة»، «سلسلة الأحاديث الضعيفة» اور «صفة صلاة النبي» شامل ہیں۔"
  es: "Muhammad Nasiruddin al-Albani (1914-1999) fue un erudito de hadices albanés-sirio-jordano, uno de los verificadores de hadices más famosos del siglo XX, quien reevaluó las principales colecciones de la Sunna y dio forma al método salafista contemporáneo de hadices. Entre sus obras destacan Silsilat al-Ahadith al-Sahihah, Silsilat al-Ahadith al-Da'ifah y Sifat Salat al-Nabi."
  fr: "Muhammad Nasiruddin al-Albani (1914-1999) était un érudit albanais, syro-jordanien du hadith, l'un des plus célèbres vérificateurs de hadiths du XXe siècle. Il a réévalué les principaux recueils de la Sunna et a façonné la méthode salafiste contemporaine du hadith. Parmi ses œuvres figurent Silsilat al-Ahadith al-Sahihah, Silsilat al-Ahadith al-Da'ifah et Sifat Salat al-Nabi."
