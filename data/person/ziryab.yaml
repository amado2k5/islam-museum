summary:
  ar: "علي بن نافع المعروف بزرياب المغني؛ مولى المهدي ومتعلم إبراهيم الموصلي، قدم على عبد الرحمن بن الحكم من العراق سنة ٢٠٦هـ فركب الأمير بنفسه لتلقيه وبالغ في إكرامه وأقام عنده بخير حال وأورث صناعة الغناء بالأندلس وخلف أولاده في صناعته وحظوته {cite:nafh-tib-maqqari p. 380}. وكان الغزال أقذع في هجائه فذكر ذلك لعبد الرحمن فأمر بنفيه فدخل العراق {cite:nafh-tib-maqqari p. 262 v.2}."
  en: "Ali ibn Nafi, called Ziryab — al-Mahdi's freedman and Ibrahim al-Mawsili's pupil — reached Abd al-Rahman II in AH 206 and the emir rode out himself to meet him; he bequeathed al-Andalus its craft of song, and the poet al-Ghazzal's savage lampoon of him was what sent al-Ghazzal into exile {cite:nafh-tib-maqqari p. 380, v.2 p. 262}."
