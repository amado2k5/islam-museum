summary:
  ar: "مغنٍّ وملحّن ومنتج بنغلاديشي؛ مؤسس شركة الإنتاج والتوزيع الإسلامية «هولي تيون» ورئيسها التنفيذي، والمدير التنفيذي لمنظمة كالاراب شيلبيغوشتي الثقافية التي يعمل فيها منذ نحو عقدين. بلغت قناته الشخصية على يوتيوب ‏(@bzamanofficial)‏ 148,000 مشترك بحسب vidIQ كما حُدّثت في 8 نوفمبر 2026، وبلغت صفحته على فيسبوك 3.7 ملايين متابع بحسب بيانات منشوره المؤرخ في 11 فبراير 2026."
  en: "Bangladeshi singer, composer and producer; founder and chief executive of the Islamic music label Holy Tune and executive director of the cultural organisation Kalarab Shilpigosthi, in which he has worked for about two decades. His personal YouTube channel (@bzamanofficial) counted 148,000 subscribers by vidIQ as updated on 8 November 2026, and his Facebook page counted 3.7 million followers by the metadata of his post of 11 February 2026."
  ur: "بنگلہ دیشی منشد، نغمہ ساز اور پروڈیوسر؛ اسلامی موسیقی کے لیبل «ہولی ٹیون» کے بانی و چیف ایگزیکٹو اور ثقافتی تنظیم کلاراب شیلپی گوشٹھی کے ایگزیکٹو ڈائریکٹر، جس میں وہ تقریباً دو دہائیوں سے کام کر رہے ہیں۔ ان کے ذاتی یوٹیوب چینل ‏(@bzamanofficial)‏ کے سبسکرائبر vidIQ کے مطابق 8 نومبر 2026ء کو 148,000 تھے، اور ان کے فیس بک صفحے کے فالوور 11 فروری 2026ء کی پوسٹ کے میٹا ڈیٹا کے مطابق 3.7 ملین تھے۔"
