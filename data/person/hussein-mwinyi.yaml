summary:
  ar: "سياسي وطبيب تنزاني (مواليد 1966) نجل الرئيس التنزاني الأسبق علي حسن مويني. عمل طبيبا ثم نائبا في البرلمان عن ماكورانغا وكوهاني، وتولى حقائب وزارية في تنزانيا آخرها الدفاع والخدمة الوطنية (2014–2020)، ثم صار الرئيس الثامن لزنجبار في 3 نوفمبر 2020 بعد فوزه بانتخابات 2020 بنسبة 76.27 في المئة. اشتهر بحملته على الفساد وببرنامج الاقتصاد الأزرق لزنجبار."
  en: "Tanzanian politician and physician (born 1966), the son of former Tanzanian president Ali Hassan Mwinyi. He worked as a doctor, then sat in parliament for Mkuranga and Kwahani and held Tanzanian ministerial portfolios, the last of them defence and national service (2014–2020), before becoming the eighth president of Zanzibar on 3 November 2020 after winning the 2020 election with 76.27 percent of the vote. He is known for his anti-corruption drive and for Zanzibar's blue-economy programme."
  ur: "تنزانیہ کے سیاست دان اور طبیب (پیدائش 1966ء)، سابق تنزانی صدر علی حسن موینی کے بیٹے۔ وہ طبیب رہے، پھر مکورانگا اور کوہانی سے رکنِ پارلیمنٹ بنے اور تنزانیہ میں وزارتی عہدے سنبھالے جن میں آخری دفاع اور قومی خدمت (2014ء–2020ء) تھا، پھر 2020ء کے انتخابات میں 76.27 فیصد ووٹوں سے کامیابی کے بعد 3 نومبر 2020ء کو زنجبار کے آٹھویں صدر بنے۔ وہ بدعنوانی کے خلاف مہم اور زنجبار کے نیلی معیشت پروگرام کے لیے جانے جاتے ہیں۔"
