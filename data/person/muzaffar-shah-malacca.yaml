summary:
  ar: "سلطان مظفر شاه (ت. 1459)، خامس سلاطين ملقا في جنوب شرق آسيا. وُلد باسم راجا قاسم ابنًا لسلطان محمد شاه، ونُصّب بعد وفاة أخيه غير الشقيق أبي شهيد شاه فحكم من 1445 أو 1446 إلى 1459. وهو عند الملايويين أول حكام ملقا تلقّب بالسلطان، وحرّر ملقا من تبعية أيوتايا، وصدّ هجوم سيام البحري سنة 1456 بقيادة تون بيراك، وحسم النزاع بين عمّه تون علي وتون بيراك بتطليق زوجته تون كودو ليتزوجها تون علي، فاستقر ملكه حتى وفاته سنة 1459 وخلفه ابنه منصور شاه."
  en: "Sultan Muzaffar Shah (d. 1459), fifth sultan of Malacca in Southeast Asia. Born Raja Kassim, a son of Sultan Muhammad Shah, he was installed after the death of his half-brother Abu Syahid Shah and ruled from 1445 or 1446 until 1459. Malay tradition counts him the first Malacca ruler to bear the title of sultan; he freed Malacca from Ayutthaya's overlordship, repelled the Siamese sea attack of 1456 under Tun Perak, and settled the feud between his uncle Tun Ali and Tun Perak by divorcing his own wife Tun Kudu so that Tun Ali could marry her, stabilising his kingdom until his death in 1459, when his son Mansur Shah succeeded him."
  ur: "سلطان مظفر شاہ (وفات 1459ء)، جنوب مشرقی ایشیا کی ملاکا سلطنت کے پانچویں سلطان۔ وہ راجا قاسم کے نام سے سلطان محمد شاہ کے بیٹے پیدا ہوئے اور اپنے سوتیلے بھائی ابو شاہد شاہ کی وفات کے بعد تخت نشین ہو کر 1445ء یا 1446ء سے 1459ء تک حکمران رہے۔ ملائی روایت میں وہ ملاکا کے پہلے حکمران ہیں جنھوں نے سلطان کا لقب اختیار کیا؛ انھوں نے ملاکا کو ایوتھایا کی بالا دستی سے آزاد کرایا، 1456ء میں تون پیراک کی قیادت میں سیام کے بحری حملے کو پسپا کیا، اور اپنے چچا تون علی اور تون پیراک کی دشمنی ختم کرنے کے لیے اپنی بیوی تون کودو کو طلاق دی تاکہ تون علی ان سے شادی کر لیں، یوں ان کی حکومت 1459ء میں ان کی وفات تک مستحکم رہی اور ان کے بیٹے منصور شاہ جانشین بنے۔"

