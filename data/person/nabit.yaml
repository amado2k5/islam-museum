summary:
  ar: "أكبر ولد إسماعيل من ابنة مضاض الجرهمي في سياق الرحيق المختوم؛ من ولده الأنباط الذين ازدهرت حضارتهم في شمال الحجاز واتخذوا البتراء عاصمة، ويُقال إنه ولي أمر مكة بعد أبيه هو وأخوه قيدار على خلاف في الترتيب؛ ورجّح سليمان الندوي أن آل غسان والأنصار من ولده لا من قحطان."
  en: "In al-Raheeq al-Makhtum's account the eldest of Ismail's sons by the daughter of Mudad al-Jurhumi; ancestor of the Nabataeans of northern Hijaz with Petra as their capital; said to have held Mecca after his father with his brother Qaydar, in disputed order; Sulayman al-Nadwi argued that the Ghassanids and the Ansar descend from him rather than from Qahtan."
