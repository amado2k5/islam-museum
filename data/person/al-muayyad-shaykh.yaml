id: person/al-muayyad-shaykh
class: person
label: { ar: "السلطان المؤيد شيخ", en: "Sultan al-Mu'ayyad Shaykh", fr: "Sultan al-Mu'ayyad Shaykh", es: "Sultan al-Mu'ayyad Shaykh", ur: "سلطان المعہد شیخ" }
summary:
  ar: "سلطان مملوكي جركسي، هزم السلطان الناصر فرج وقتله، وسكن الإصطبل وفوض إليه الخليفة المستعين تدبير المملكة ولقب نظام الملك حتى إن الأمراء إذا فرغوا من خدمة القصر نزلوا في خدمته بالإصطبل ويقع عنده الإبرام والنقض، ثم سأل الخليفة أن يفوض إليه السلطنة فاشترط الخليفة نزوله من القلعة فلم يوافق وتغلب على السلطنة وتلقب المؤيد وصرح بخلع المستعين في شعبان سنة خمس عشرة وبايع داود المعتضد فأفتى قضاة الشام بعدم جواز خلعه وقاتله نوروز، وفي أيامه تمت المدرسة المؤيدية سنة اثنتين وعشرين وجعل شيخها الشمس ابن الديري وحضر درسه وباشر ولده إبراهيم فرش سجادته بيده {cite:tarikh-khulafa-minhaj-1434 p. 767-770}. تسلطن سنة خمس عشرة وثمان مئة ولقب بالمؤيد وكني بأبي نصر وذلك بعد خلع الناصر فرج وسلطنة المستعين الخليفة ثم خلعه {cite:shadharat-dhahab p. 108}."
  en: "Circassian sultan who routed and killed Faraj, ruled as 'Nizam al-Mulk' from the stables till he seized the throne as al-Mu'ayyad in 815, deposing the caliph — a deposition Syria's jurists voided. His Mu'ayyadiyya madrasa opened in 822 with his own son laying the shaykh's rug {cite:tarikh-khulafa-minhaj-1434 p. 767-770}."
  fr: "Le sultan circassien qui a mis en déroute et tué Faraj, a régné comme « Nizam al-Mulk  » des écuries jusqu’à ce qu’il s’empare du trône comme al-Mu’ayyad en 815, déposant le calife – une déposition que les juristes syriens ont annulée. Sa madrasa Mu'ayyadiyya a ouvert en 822 avec son propre fils posant le tapis du shaykh {cite:tarikh-khulafa-minhaj-1434 p. 767-770}."
  es: "El sultán circasiano que derrotó y mató a Faraj, gobernó como 'Nizam al-Mulk' desde los establos hasta que se apoderó del trono como al-Mu'ayyad en 815, deponiendo al califa, una deposición que los juristas de Siria anularon. Su madrasa Mu'ayyadiyya se inauguró en 822 con su propio hijo colocando la alfombra del jeque {cite:tarikh-khulafa-minhaj-1434 p. 767-770}."
  ur: "سرکیسیئن سلطان جس نے فراج کو شکست دی اور قتل کر دیا، اصطبل سے 'نظام الملک' کے طور پر حکومت کرتا رہا یہاں تک کہ اس نے 815 میں المعیاد کے طور پر تخت پر قبضہ کر لیا، خلیفہ کو معزول کر دیا - یہ بیان شام کے فقہا نے باطل کر دیا۔ ان کا معاویہ مدرسہ 822 میں ان کے اپنے بیٹے نے شیخ کا قالین بچھا کر کھولا۔ 767-770}۔"
  tr: "Bir Çerkes Memlük sultanı, Sultan el-Nasir Faraj'ı yendi ve öldürdü, el-İstbal'e yerleşti ve Halife el-Musta'in ona krallığı ve Nizam al-Mulk unvanını emanet etti. Prensler sarayı bitirdikten sonra onun ahırında kaldılar ve kararlaştırıp iptal ettiler. Halife, halifeden sultanlığı kendisine devretmesini istedi, ancak halife kaleyi terk etmesini şart koştu, fakat o kabul etmedi. Sultanlığı yenerek el-Mu'l-Mülk unvanını kazandı 'Ayyad, Şa'ban 15'te el-Mu'ta'i'in'in tahttan indirildiğini ilan etti, Davud el-Mu'tadid'e bağlılık yemini etti, Levant hakimlerine onun görevden alınmasını yasaklayan bir fetva verdi ve Nowruz'u öldürdü. Onun hükümdarlığı sırasında, el-Mu'eydiyye okulu 22 Hicri yılında tamamlandı ve şeyhi el-Şems bin el-Diri'yi atadı ve derslerine katıldı. Oğlu İbrahim, halısını kendi eliyle halılamaya başladı {alıntı: Tarikh-khulafa-minhaj-1434, s. 767-770}. 1580 Hicri yılında hüküm sürdü, El-Muayyad unvanını aldı ve El-Nasir Faraj tahttan indirildikten ve halife El-Musta'in tahttan indirildikten sonra Ebu Nasr lakabını aldı, ardından {kaynak: şadharat-dhahab, s. 108}."
  id: "Seorang sultan Mamluk Circassian mengalahkan dan membunuh Sultan al-Nasir Faraj, menetap di al-Istbal, dan Khalifah al-Musta'in mempercayakan kepadanya untuk mengelola kerajaan dan gelar Nizam al-Mulk. Ketika para pangeran selesai melayani istana, mereka tinggal di kandangnya dan harus memutuskan serta mencabutnya. Kemudian khalifah meminta khalifah untuk mendelegasikan kesultanan kepadanya, tetapi khalifah menetapkan agar ia meninggalkan benteng, namun ia tidak setuju. Ia mengalahkan kesultanan yang bergelar al-Mu'ayyad, yang menyatakan pencopotan al-Mu'ta'i'in pada Sha'ban 15, bersumpah setia kepada Dawud al-Mu'tadid, mengeluarkan fatwa kepada hakim-hakim Levant yang melarang pencopotannya dan membunuhnya Nowruz. Selama pemerintahannya, aliran al-Mu'ayyadiyya selesai pada tahun 22 H, dan sheikhnya mengangkat al-Shams ibn al-Diri serta menghadiri pelajarannya. Putranya Ibrahim mulai mengoleskan karpetnya dengan tangannya sendiri {cite:Tarikh-khulafa-minhaj-1434, hlm. 767-770}. Ia memerintah pada tahun 1580 H, bergelar Al-Mu'ayyad, dan dijuluki Abu Nasr, setelah Al-Nasir Faraj digulingkan dan khalifah Al-Musta'in digulingkan, lalu {cite:shadharat-dhahab, hlm. 108}."
