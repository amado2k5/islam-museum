class: person
label: { ar: "السلطان المؤيد شيخ", en: "Sultan al-Mu'ayyad Shaykh" }
summary:
  ar: "سلطان مملوكي جركسي، هزم السلطان الناصر فرج وقتله، وسكن الإصطبل وفوض إليه الخليفة المستعين تدبير المملكة ولقب نظام الملك حتى إن الأمراء إذا فرغوا من خدمة القصر نزلوا في خدمته بالإصطبل ويقع عنده الإبرام والنقض، ثم سأل الخليفة أن يفوض إليه السلطنة فاشترط الخليفة نزوله من القلعة فلم يوافق وتغلب على السلطنة وتلقب المؤيد وصرح بخلع المستعين في شعبان سنة خمس عشرة وبايع داود المعتضد فأفتى قضاة الشام بعدم جواز خلعه وقاتله نوروز، وفي أيامه تمت المدرسة المؤيدية سنة اثنتين وعشرين وجعل شيخها الشمس ابن الديري وحضر درسه وباشر ولده إبراهيم فرش سجادته بيده {cite:tarikh-khulafa-minhaj-1434 p. 767-770}. تسلطن سنة خمس عشرة وثمان مئة ولقب بالمؤيد وكني بأبي نصر وذلك بعد خلع الناصر فرج وسلطنة المستعين الخليفة ثم خلعه {cite:shadharat-dhahab p. 108}."
  en: "Circassian sultan who routed and killed Faraj, ruled as 'Nizam al-Mulk' from the stables till he seized the throne as al-Mu'ayyad in 815, deposing the caliph — a deposition Syria's jurists voided. His Mu'ayyadiyya madrasa opened in 822 with his own son laying the shaykh's rug {cite:tarikh-khulafa-minhaj-1434 p. 767-770}."
