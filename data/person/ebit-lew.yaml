summary:
  ar: "داعية ورجل أعمال ماليزي من أصل صيني، وُلد باسم ليو يون باو في مواذم شاه بولاية بهانغ سنة 1984، واعتنق الإسلام في الثانية عشرة من عمره. تخرج في جامعة بوترا ماليزيا، واشتهر بندواته الأسرية «عائلة السنة»، وبسلسلة متاجر «إليوسمارت»، وببعثات الإغاثة واسعة النطاق إبان جائحة كورونا، وبلغ عدد متابعي حسابه على إنستغرام 6,503,185 متابعا بحسب عدّاد حي قُرئ في نوفمبر 2026."
  en: "Malaysian preacher and entrepreneur of Chinese descent, born Lew Yun Pau in Muadzam Shah, Pahang, in 1984; he embraced Islam at the age of twelve. A graduate of Universiti Putra Malaysia, he became known for his Keluarga Sunnah family seminars, the Elewsmart supermarket chain and large-scale relief missions during the COVID-19 pandemic; his Instagram account counted 6,503,185 followers on a live counter read in November 2026."
  ur: "چینی نژاد ملائیشیائی مبلغ اور کاروباری شخصیت، 1984 میں پہانگ کے موآذم شاہ میں لیو یون پاؤ کے نام سے پیدا ہوئے؛ بارہ سال کی عمر میں اسلام قبول کیا۔ یونیورسٹی پوترا ملائشیا کے فارغ التحصیل ہیں، «خاندانِ سنت» سیمیناروں، ایلیو سمارٹ سپر مارکیٹ سلسلے اور کووڈ 19 کے دوران بڑے پیمانے کی امدادی سرگرمیوں سے شہرت پائی؛ نومبر 2026 میں پڑھے گئے لائیو کاؤنٹر کے مطابق انسٹاگرام پر ان کے فالوورز 6,503,185 تھے۔"
