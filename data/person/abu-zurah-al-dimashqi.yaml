label:
  ar: "أبو زرعة الدمشقي"
  en: "Abu Zur'a al-Dimashqi"
  fr: "Abu Zur'a al-Dimashqi"
  es: "Abu Zur'a al-Dimashqi"
  ur: "ابو زرع الدمشقی"
roles: [muhaddith]
gender: male
summary:
  ar: "عبد الرحمن بن عمرو بن عبد الله بن صفوان النصري، أبو زرعة الدمشقي، من أئمة زمانه في الحديث ورجاله، دمشقي المولد والوفاة، له كتاب في التاريخ وعلل الرجال. يذكر الزركلي وفاته سنة 280 هـ."
  en: "Abd al-Rahman ibn Amr ibn Abdallah ibn Safwan al-Nasri, Abu Zur'a al-Dimashqi, a leading hadith authority of his time and expert on its narrators, of Damascus where he died; author of a book on history and the defects of narrators. Al-Zirikli prints his death as 280 AH (893)."
  fr: "Abd al-Rahman ibn Amr ibn Abdallah ibn Safwan al-Nasri, Abu Zur'a al-Dimashqi, grande autorité du hadith de son temps et spécialiste de ses transmetteurs, originaire de Damas où il mourut ; auteur d'un ouvrage sur l'histoire et les défauts des transmetteurs. Al-Zirikli situe sa mort en 280 H (893 ap. J.-C.)."
  es: "Abd al-Rahman ibn Amr ibn Abdallah ibn Safwan al-Nasri, Abu Zur'a al-Dimashqi, una de las principales autoridades en hadices de su época y experto en sus narradores, originario de Damasco, donde falleció; autor de un libro sobre historia y los defectos de los narradores. Al-Zirikli registra su muerte en el año 280 de la Hégira (893 d. C.)."
  ur: "عبدالرحمن بن عمرو بن عبد اللہ بن صفوان النصری، ابو زرعہ الدمشقی، اپنے وقت کے ایک معروف حدیثی اتھارٹی اور اس کے راویوں کے ماہر، دمشق کے جہاں ان کی وفات ہوئی؛ تاریخ اور راویوں کے نقائص پر ایک کتاب کا مصنف۔ الزرکلی نے ان کی وفات کو 280ھ (893) لکھا ہے۔"
