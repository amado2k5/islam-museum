summary:
  ar: "كاتب قصصي أردي (1912–1955) يُعد أعظم كتّاب القصة القصيرة في الأدب الأردي. وُلد في سامرالا بالبنجاب، وعمل في بومباي كاتب سيناريو وصحفيًا، وحُوكم ست مرات بتهمة الفحش دون إدانة، وهاجر إلى لاهور سنة 1948 حيث كتب أشهر قصصه عن تقسيم الهند ومنها «توبه تيك سينغ» و«كول دو» و«تهندا غوشت»، وتوفي شابًا متأثرًا بإدمانه الخمر."
  en: "Urdu short-story writer (1912–1955) regarded as the greatest short-story author in Urdu literature. Born at Samrala in Punjab, he worked in Bombay as a screenwriter and journalist, was tried six times for obscenity and never convicted, and migrated to Lahore in 1948, where he wrote his most famous stories of the Partition of India — 'Toba Tek Singh', 'Khol Do' and 'Thanda Gosht' — before dying young of alcoholism."
  ur: "اردو افسانہ نگار (1912ء–1955ء) جنھیں اردو ادب کا سب سے بڑا افسانہ نویس مانا جاتا ہے۔ ضلع لدھیانہ کے سامرالہ میں پیدا ہوئے، بمبئی میں منظر نویس اور صحافی رہے، فحاشی کے الزام میں چھ مرتبہ مقدمے چلے مگر کبھی سزا نہ ہوئی، 1948ء میں لاہور ہجرت کی جہاں تقسیم ہند پر ان کی مشہور کہانیاں ’ٹوبہ ٹیک سنگھ‘، ’کھول دو‘ اور ’ٹھنڈا گوشت‘ لکھی گئیں؛ شراب نوشی کے باعث کم عمری میں انتقال ہوا۔"
