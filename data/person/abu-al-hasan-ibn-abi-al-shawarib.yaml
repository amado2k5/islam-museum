id: person/abu-al-hasan-ibn-abi-al-shawarib
class: person
label: { ar: "قاضي القضاة أبو الحسن ابن أبي الشوارب", en: "Abu al-Hasan ibn Abi al-Shawarib", fr: "Abu al-Hasan ibn Abi al-Shawarib", es: "Abu al-Hasan ibn Abi al-Shawarib", ur: "ابو الحسن ابن ابی الشواریب" }
summary:
  ar: "أحمد بن محمد بن عبد الله بن العباس بن عبد الملك بن أبي الشوارب؛ قضى البصرة ثم قضاء القضاة ببغداد من ثالث شعبان سنة ٤٠٥ إلى موته في شوال سنة ٤١٧، وكان عفيفًا. وفي ترجمته خبر بيته في القضاء: عرض على جده عبد الملك القضاء في أيام المتوكل فاعتذر، وذُكر أن من أولادهم أربعة وعشرين قاضيًا ثمانية منهم قضاة قضاة {cite:muntazam-ibn-al-jawzi j.8 p.367-369}."
  en: "Ahmad ibn Muhammad ibn Abd Allah ibn al-Abbas ibn Abd al-Malik ibn Abi al-Shawarib. He held the judgeship of Basra, then the office of chief judge (qadi al-qudat) at Baghdad from 3 Sha'ban 405 until his death in Shawwal 417; he was scrupulous (afif). His biography includes an account of his family's judgeships: his grandfather Abd al-Malik was offered the judgeship in the days of al-Mutawakkil and declined it, and it is mentioned that twenty-four of their sons became judges, eight of them as chief judges {cite:muntazam-ibn-al-jawzi j.8 p.367-369}."
  fr: "Ahmad ibn Muhammad ibn Abd Allah ibn al-Abbas ibn Abd al-Malik ibn Abi al-Shawarib. Il exerça la judicature de Bassora, puis la charge de grand cadi (qadi al-qudat) à Bagdad du 3 Sha'ban 405 jusqu'à sa mort en Shawwal 417 ; il était intègre (afif). Sa biographie comprend un récit des judicatures de sa famille : on offrit la judicature à son grand-père Abd al-Malik à l'époque d'al-Mutawakkil et il la refusa, et l'on mentionne que vingt-quatre de leurs fils devinrent cadis, dont huit grands cadis {cite:muntazam-ibn-al-jawzi j.8 p.367-369}."
  es: "Ahmad ibn Muhammad ibn Abd Allah ibn al-Abbas ibn Abd al-Malik ibn Abi al-Shawarib. Ocupó el cargo de juez en Basora y, posteriormente, el de juez principal (qadi al-qudat) en Bagdad desde el 3 de Sha'ban de 405 hasta su muerte en Shawwal de 417; era escrupuloso (afif). Su biografía incluye un relato de los cargos judiciales de su familia: a su abuelo Abd al-Malik se le ofreció el cargo de juez en tiempos de al-Mutawakkil y lo rechazó, y se menciona que veinticuatro de sus hijos llegaron a ser jueces, ocho de ellos como jueces principales {cite:muntazam-ibn-al-jawzi, vol. 8, págs. 367-369}."
  ur: "احمد بن محمد بن عبد اللہ ابن العباس ابن عبد الملک ابن ابی الشواریب۔ وہ بصرہ کے قاضی کے عہدے پر فائز رہے، اس کے بعد بغداد میں 3 شعبان 405 سے شوال 417 میں اپنی وفات تک چیف جج کے عہدے پر فائز رہے۔ وہ متقی ⁦(عفیف)⁩ تھا۔ ان کی سوانح عمری میں ان کے خاندان کے ججوں کا بیان شامل ہے: ان کے دادا عبد الملک کو متوکل کے دنوں میں جج کی پیشکش کی گئی تھی اور انہوں نے اسے مسترد کر دیا تھا، اور یہ ذکر کیا گیا ہے کہ ان کے چوبیس بیٹے جج بنے، جن میں سے آٹھ چیف منصف تھے۔"
  tr: "Ahmed ibn Muhammed ibn Abdullah ibn el-Abbas ibn Abd el-Malik ibn Abi el-Şevarib; 405 yılının Şaban ayının üçüncü gününden 417 yılının Şevval ayındaki ölümüne kadar Basra'da ve daha sonra Bağdat'ta Başhakim olarak görev yapmıştır. Dürüstlüğüyle tanınırdı. Biyografisinde ailesinin yargı sistemindeki rolüne dair bir anlatım yer almaktadır: Mutevakkil döneminde kendisine hakimlik teklif edilmiş, ancak dedesi Abd el-Malik bunu reddetmiştir. Soyundan gelen yirmi dört kişinin hakim olduğu, bunlardan sekizinin başhakim olarak görev yaptığı belirtilmektedir. {cite:muntazam-ibn-al-jawzi j.8 pp.367-369}"
  id: "Ahmad ibn Muhammad ibn Abdullah ibn al-Abbas ibn Abd al-Malik ibn Abi al-Shawarib; beliau menjabat sebagai hakim di Basra dan kemudian sebagai Ketua Mahkamah Agung di Baghdad sejak tanggal 3 Sya'ban tahun 405 hingga wafatnya pada bulan Syawal tahun 417. Beliau dikenal karena integritasnya. Biografinya mencakup catatan tentang keterlibatan keluarganya dalam peradilan: beliau ditawari posisi hakim selama pemerintahan al-Mutawakkil, tetapi kakeknya, Abd al-Malik, menolak. Disebutkan bahwa dua puluh empat keturunan mereka adalah hakim, delapan di antaranya menjabat sebagai ketua mahkamah agung. {cite:muntazam-ibn-al-jawzi j.8 pp.367-369}"
