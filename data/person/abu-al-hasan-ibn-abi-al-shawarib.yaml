label: { ar: "قاضي القضاة أبو الحسن ابن أبي الشوارب", en: "Abu al-Hasan ibn Abi al-Shawarib" }
summary:
  ar: "أحمد بن محمد بن عبد الله بن العباس بن عبد الملك بن أبي الشوارب؛ قضى البصرة ثم قضاء القضاة ببغداد من ثالث شعبان سنة ٤٠٥ إلى موته في شوال سنة ٤١٧، وكان عفيفًا. وفي ترجمته خبر بيته في القضاء: عرض على جده عبد الملك القضاء في أيام المتوكل فاعتذر، وذُكر أن من أولادهم أربعة وعشرين قاضيًا ثمانية منهم قضاة قضاة {cite:muntazam-ibn-al-jawzi j.8 p.367-369}."
  en: "Ahmad ibn Muhammad ibn Abd Allah ibn al-Abbas ibn Abd al-Malik ibn Abi al-Shawarib. He held the judgeship of Basra, then the office of chief judge (qadi al-qudat) at Baghdad from 3 Sha'ban 405 until his death in Shawwal 417; he was scrupulous (afif). His biography includes an account of his family's judgeships: his grandfather Abd al-Malik was offered the judgeship in the days of al-Mutawakkil and declined it, and it is mentioned that twenty-four of their sons became judges, eight of them as chief judges {cite:muntazam-ibn-al-jawzi j.8 p.367-369}."
