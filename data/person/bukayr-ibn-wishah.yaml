label: { ar: "بكير بن وشاح", en: "Bukayr ibn Wishah", es: "Bukayr ibn Wishah", fr: "Bukayr ibn Wishah" }
summary:
  ar: "بكير بن وشاح ويقال وساح؛ كان على شرطة ابن خازم فخلعه وأخذ السلاح وبيت المال ودعا أهل مرو إلى بيعة عبد الملك فبايعوه وكتب إليه عبد الملك بولاية خراسان فأتي برأس ابن خازم فبعث به إلى عبد الملك فنصب بدمشق وولاه أمية بن عبد الله طخارستان ثم غزو ما وراء النهر فانصرف فخلع أمية وحبس ابنه ثم قاتله وصالحه على أن يوليه أي ناحية شاء ثم اتهم بالسعي في خلعه فأخذ وحبس فوثب به بجير بن ورقاء فقتله."
  en: "Bukayr ibn Wishah — some say Wisah; Ibn Khazim's shurta-chief who deposed him, seized arms and treasury, won Marw to Abd al-Malik's bay'a, and was made governor — he sent Ibn Khazim's head to Damascus. Under Umayya he held Tukharistan and the trans-river campaigns, then turned, imprisoned Umayya's son and deposed him; fought, then truced for a district, was seized on renewed suspicion and killed in his cell by Bujayr ibn Waraqa'."
  es: "Bukayr ibn Wishah —algunos lo llaman Wisah—, jefe de la guardia personal de Ibn Khazim, quien lo depuso, se apoderó de armas y tesoros, ganó Marw para la lealtad de Abd al-Malik y fue nombrado gobernador. Envió la cabeza de Ibn Khazim a Damasco. Bajo el reinado de Omayya, controló Tukharistán y las campañas transfluviales; luego se rebeló, encarceló al hijo de Omayya y lo depuso; luchó y luego firmó una tregua por un distrito; fue apresado bajo nuevas sospechas y asesinado en su celda por Bujayr ibn Waraqa'."
  fr: "Bukayr ibn Wishah (ou Wisah, selon certains), chef de la shurta d'Ibn Khazim, le déposa, s'empara de ses armes et de son trésor, remporta Marw pour la bay'a d'Abd al-Malik et fut nommé gouverneur. Il envoya la tête d'Ibn Khazim à Damas. Sous les Omeyyades, il contrôla le Tukharistan et mena les campagnes transfluviales, puis se retourna, emprisonna le fils d'Omayya et le déposa. Il combattit, puis conclut une trêve pour un district, avant d'être arrêté sur la base de soupçons renouvelés et tué dans sa cellule par Bujayr ibn Waraqa'."
