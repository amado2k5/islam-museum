id: person/bukayr-ibn-wishah
class: person
label: { ar: "بكير بن وشاح", en: "Bukayr ibn Wishah" }
summary:
  ar: "بكير بن وشاح ويقال وساح؛ كان على شرطة ابن خازم فخلعه وأخذ السلاح وبيت المال ودعا أهل مرو إلى بيعة عبد الملك فبايعوه وكتب إليه عبد الملك بولاية خراسان فأتي برأس ابن خازم فبعث به إلى عبد الملك فنصب بدمشق وولاه أمية بن عبد الله طخارستان ثم غزو ما وراء النهر فانصرف فخلع أمية وحبس ابنه ثم قاتله وصالحه على أن يوليه أي ناحية شاء ثم اتهم بالسعي في خلعه فأخذ وحبس فوثب به بجير بن ورقاء فقتله."
  en: "Bukayr ibn Wishah — some say Wisah; Ibn Khazim's shurta-chief who deposed him, seized arms and treasury, won Marw to Abd al-Malik's bay'a, and was made governor — he sent Ibn Khazim's head to Damascus. Under Umayya he held Tukharistan and the trans-river campaigns, then turned, imprisoned Umayya's son and deposed him; fought, then truced for a district, was seized on renewed suspicion and killed in his cell by Bujayr ibn Waraqa'."
