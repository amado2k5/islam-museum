label: { ar: "مزنة امرأة مروان بن محمد", en: "Muzna, Marwan's widow" }
summary:
  ar: "امرأة مروان بن محمد آخر خلفاء بني أمية، دخلت على الخيزران في أطمار رثة فقالت إنها أعاري، فذكرتها زينب بنت سليمان بن علي بدخولها عليها بحران وهي على البساط بعينه حين كلمتها في جثة إبراهيم الإمام فانتهرتها، فلما أخبرت الخيزران المهدي بكى وقال لولا أنها أكبر نسائنا لحلفت ألا أكلمها لزينب، وأقطعها وأخدمها فأقامت في قصره أيام المهدي والهادي وصدراً من أيام الرشيد حتى ماتت {cite:muruj-al-dhahab p. 303-305}."
  en: "The last Umayyad caliph's widow who came to al-Khayzuran in borrowed rags — lodged among the Hashimi women for three reigns after al-Mahdi's tears {cite:muruj-al-dhahab p. 303-305}."
