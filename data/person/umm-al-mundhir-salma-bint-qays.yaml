label: { ar: "أم المنذر سلمى بنت قيس", en: "Umm al-Mundhir Salma bint Qays" }
summary:
  ar: "سلمى بنت قيس بن عمرو بن عبيد بن مالك بن عدي، أم المنذر، الأنصارية البخارية، وهي بكنيتها أشهر، وهي أخت سليط بن قيس، وإحدى خالات النبي من جهة أبيه، صلت القبلتين وبايعت بيعة الرضوان. روت عنها أم سليط بن أيوب بن الحكم. ويذكر الكتاب وفاتها دون تاريخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7150}"
  en: "Salma bint Qays ibn Amr, Umm al-Mundhir al-Ansariyya, better known by her kunya, sister of Sulayt ibn Qays and one of the Prophet's maternal aunts through his father. She prayed towards both qiblas and swore the pledge of Ridwan. Umm Sulayt ibn Ayyub ibn al-Hakam related from her. The book gives no date of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7150}"
