kids:
  ar: "زينب بنت مظعون كانت أم حفصة وأخت عثمان بن مظعون، من أسرة قريشية عُرفت بالصحبة."
  en: "Zaynab bint Maz'un was the mother of Hafsa and the sister of Uthman ibn Maz'un, from a Quraysh family remembered among the Companions."
  ur: "زینب بنت مظعون حفصہ کی والدہ اور عثمان بن مظعون کی بہن تھیں، اور قریش کے ایسے گھرانے سے تھیں جو صحابہ میں شمار ہوا۔"
