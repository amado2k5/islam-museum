names:
  - { kind: full, value: "Zaynab bint Maz'un ibn Habib ibn Wahb ibn Hudhafa ibn Jumah" }
  - { kind: alternate, value: "Zaynab bint Mazun" }
  - { kind: alternate, value: "زينب بنت مظعون بن حبيب بن وهب بن حذافة بن جمح" }
summary:
  ar: "زينب بنت مظعون بن حبيب بن وهب بن حذافة بن جمح، أخت عثمان بن مظعون وزوجة عمر بن الخطاب، وأم عبد الله وحفصة وعبد الرحمن الأكبر من أولاده، وعدّها ابن عبد البر في الصحابيات {cite:isti-ab-ibn-abd-al-barr p. 909}. ونقل عن الزبير أنها كانت من المهاجرات، لكنه خشي أن يكون ذلك وهماً لأنه قيل إنها ماتت مسلمة بمكة قبل الهجرة، بينما كانت ابنتها حفصة من المهاجرات {cite:isti-ab-ibn-abd-al-barr p. 909}. وتجمع المصادر المقروءة على أنها أم حفصة {cite:nisa-hawl-alrasul p. 75} {cite:usd-al-ghaba p. 1496}."
  en: "Zaynab bint Maz'un ibn Habib ibn Wahb ibn Hudhafa ibn Jumah was the sister of Uthman ibn Maz'un and a wife of Umar ibn al-Khattab, and the mother of his children Abd Allah, Hafsa and Abd al-Rahman the Elder; Ibn Abd al-Barr lists her among the women Companions {cite:isti-ab-ibn-abd-al-barr p. 909}. He reports that al-Zubayr counted her among the emigrants but fears this is a mistake, since it was also said that she died a Muslim in Mecca before the hijra, while her daughter Hafsa was among the emigrants {cite:isti-ab-ibn-abd-al-barr p. 909}. The sources read agree that she was Hafsa's mother {cite:nisa-hawl-alrasul p. 75} {cite:usd-al-ghaba p. 1496}."
  ur: "زینب بنت مظعون بن حبیب بن وہب بن حذافہ بن جمح، عثمان بن مظعون کی بہن اور عمر بن الخطاب کی زوجہ تھیں، اور ان کے بیٹوں عبد اللہ، حفصہ اور عبد الرحمن اکبر کی والدہ تھیں؛ ابن عبد البر نے انہیں صحابیات میں شمار کیا ہے {cite:isti-ab-ibn-abd-al-barr p. 909}۔ وہ لکھتے ہیں کہ زبیر نے انہیں مہاجرات میں گنا ہے، مگر انہیں اندیشہ ہے کہ یہ وہم ہے، کیونکہ یہ بھی کہا گیا کہ وہ ہجرت سے پہلے مکہ میں مسلمان ہونے کی حالت میں فوت ہوئیں، جب کہ ان کی بیٹی حفصہ مہاجرات میں سے تھیں {cite:isti-ab-ibn-abd-al-barr p. 909}۔ پڑھے گئے مآخذ اس پر متفق ہیں کہ وہ حفصہ کی والدہ تھیں {cite:nisa-hawl-alrasul p. 75} {cite:usd-al-ghaba p. 1496}۔"
