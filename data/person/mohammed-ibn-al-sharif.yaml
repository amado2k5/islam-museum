summary:
  ar: "سيدي محمد بن الشريف ⁦(ت. 2 آب 1664)⁩، أكبر أبناء المولى الشريف مؤسس السلالة العلوية، وحاكم تافيلالت من 1636 ومتوَّجًا أميرًا عليها سنة 1640. بسط سلطانه على درعة ووجدة وتوات والصحراء الشرقية، وثبّت بمعاهدة 1647 حدَّ التافنة مع عثمانيي الجزائر، وصفه المؤرخ الإفرني بالكرم والشجاعة. قُتل في وقعة أنجاد بسهل بني سناسن في حربه مع أخيه مولاي الرشيد الذي خلفه."
  en: "Sidi Mohammed ibn al-Sharif (died 2 August 1664) was the eldest son of Moulay Sharif, founder of the Alawite line, and ruler of Tafilalt from 1636, crowned emir in 1640. He extended his rule over the Draa, Oujda, Tuat and the eastern Sahara, fixed the Tafna frontier with Ottoman Algiers by the treaty of 1647, and was remembered by the historian al-Ifrani for his generosity and bravery. He was killed at the battle of Angad, in the Beni Snassen plain, in his war with his brother Moulay Rashid, who succeeded him."
  ur: "سیدی محمد بن الشریف ⁦(وفات 2 اگست 1664ء)⁩ علوی سلسلے کے بانی مولای شریف کے سب سے بڑے بیٹے اور 1636ء سے تافیلالت کے حاکم تھے، 1640ء میں امیر کی حیثیت سے تاج پوشی ہوئی۔ درعہ، وجدہ، توات اور مشرقی صحرا تک اپنا اقتدار پھیلایا اور 1647ء کے معاہدے سے عثمانی الجزائر کے ساتھ تافنہ کی سرحد طے کی؛ مؤرخ افرانی نے ان کی سخاوت اور بہادری کا ذکر کیا ہے۔ اپنے بھائی مولای رشید سے جنگ میں انگاد کی لڑائی میں مارے گئے، اور رشید ہی ان کے جانشین بنے۔"
  es: "Sidi Mohammed ibn al-Sharif (fallecido el 2 de agosto de 1664) fue el hijo mayor de Moulay Sharif, fundador de la dinastía alauita, y gobernante de Tafilalt desde 1636, coronado emir en 1640. Extendió su dominio sobre el Draa, el Oujda, el Tuat y el Sáhara oriental, fijó la frontera de Tafna con el Argel otomano mediante el tratado de 1647, y fue recordado por el historiador al-Ifrani por su generosidad y valentía. Murió en la batalla de Angad, en la llanura de Beni Snassen, en su guerra contra su hermano Moulay Rashid, quien le sucedió."
  fr: "Sidi Mohammed ibn al-Sharif (mort le 2 août 1664) était le fils aîné de Moulay Sharif, fondateur de la dynastie alaouite et souverain de Tafilalt à partir de 1636, couronné émir en 1640. Il étendit son pouvoir sur le Drâa, l'Oujda, le Tuat et le Sahara oriental, fixa la frontière de Tafna avec Alger ottoman par le traité de 1647 et laissa dans le deuil l'historien al-Ifrani pour sa générosité et sa bravoure. Il trouva la mort à la bataille d'Angad, dans la plaine de Beni Snassen, lors de sa guerre contre son frère Moulay Rashid, qui lui succéda."
  tr: "Sidi Muhammed bin Cherif (ö. 2 Ağustos 1664), Alaouite hanedanının kurucusu Moulay Sharif'in en büyük oğluydu; 1636'dan itibaren Tafilalt valisi ve 1640'ta taç giyen prensi oldu. Drâa, Oujda, Touat ve Doğu Sahra üzerinde yetkisini genişletti ve 1647 antlaşmasıyla Cezayir Osmanlılarına olan bağlılığının sınırlarını belirledi. Tarihçi Al-Ifrani onu cömert ve cesur olarak tanımladı. Kardeşi Moulay Rashid ile savaşı sırasında Beni Senassen ovasındaki Angad Muharebesi'nde öldü ve Moulay Rashid kendisinden sonra savaştı."
  id: "Sidi Muhammad bin Cherif (wafat 2 Agustus 1664) adalah putra sulung Moulay Sharif, pendiri dinasti Alaouite, gubernur Tafilalt sejak 1636, dan putra mahkota di sana pada tahun 1640. Ia memperluas kekuasaannya atas Drâa, Oujda, Touat, dan Sahara Timur, serta menetapkan batas kesetiaannya kepada Ottoman di Aljazair dalam perjanjian tahun 1647. Sejarawan Al-Ifrani menggambarkannya sebagai sosok yang dermawan dan berani. Ia tewas dalam Pertempuran Angad di dataran Beni Senassen selama perang dengan saudaranya Moulay Rashid, yang menggantikannya."

