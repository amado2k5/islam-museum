summary:
  ar: "سيدي محمد بن الشريف (ت. 2 آب 1664)، أكبر أبناء المولى الشريف مؤسس السلالة العلوية، وحاكم تافيلالت من 1636 ومتوَّجًا أميرًا عليها سنة 1640. بسط سلطانه على درعة ووجدة وتوات والصحراء الشرقية، وثبّت بمعاهدة 1647 حدَّ التافنة مع عثمانيي الجزائر، وصفه المؤرخ الإفرني بالكرم والشجاعة. قُتل في وقعة أنجاد بسهل بني سناسن في حربه مع أخيه مولاي الرشيد الذي خلفه."
  en: "Sidi Mohammed ibn al-Sharif (died 2 August 1664) was the eldest son of Moulay Sharif, founder of the Alawite line, and ruler of Tafilalt from 1636, crowned emir in 1640. He extended his rule over the Draa, Oujda, Tuat and the eastern Sahara, fixed the Tafna frontier with Ottoman Algiers by the treaty of 1647, and was remembered by the historian al-Ifrani for his generosity and bravery. He was killed at the battle of Angad, in the Beni Snassen plain, in his war with his brother Moulay Rashid, who succeeded him."
  ur: "سیدی محمد بن الشریف (وفات 2 اگست 1664ء) علوی سلسلے کے بانی مولای شریف کے سب سے بڑے بیٹے اور 1636ء سے تافیلالت کے حاکم تھے، 1640ء میں امیر کی حیثیت سے تاج پوشی ہوئی۔ درعہ، وجدہ، توات اور مشرقی صحرا تک اپنا اقتدار پھیلایا اور 1647ء کے معاہدے سے عثمانی الجزائر کے ساتھ تافنہ کی سرحد طے کی؛ مؤرخ افرانی نے ان کی سخاوت اور بہادری کا ذکر کیا ہے۔ اپنے بھائی مولای رشید سے جنگ میں انگاد کی لڑائی میں مارے گئے، اور رشید ہی ان کے جانشین بنے۔"

