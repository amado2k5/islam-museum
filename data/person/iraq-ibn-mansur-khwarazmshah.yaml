summary:
  ar: "حاكم أفريغي في خوارزم أواخر القرن التاسع، ضرب فلوسًا سنة 280هـ تجمع صورة الفرس والرمز الشمسي مع لقب «مولى أمير المؤمنين» بالكوفي، وهو جد أحمد بن محمد خوارزمشاه {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 48}."
  en: "Afrighid ruler of Khwarazm in the late ninth century who struck fulus in 280 AH combining a horse and a solar sign with the Kufic title 'client of the Commander of the Faithful'; grandfather of Ahmad ibn Muhammad Khwarazmshah {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 48}."
  ur: "نویں صدی کے اواخر میں خوارزم کے آفریغی حکمران جنہوں نے 280ھ میں ایسے فلوس ڈھالے جن پر گھوڑے اور شمسی نشان کے ساتھ کوفی میں «مولیٰ امیر المومنین» کا لقب ہے؛ احمد بن محمد خوارزم شاہ کے دادا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 48}۔"
