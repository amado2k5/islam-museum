born:
  edtf: "1469-04-15"
  calendar: gregorian
  precision: day
  status: debated
  hijri: "0873"
  derived: true
  note: "Born at Rai Bhoi di Talwandi, present-day Nankana Sahib in the Punjab; the place has no entity in the graph, so the birthplace is prose-only. Most janamsakhis and the Sikh records give the third day of the bright fortnight of Vaisakh, Samvat 1526, corresponding to 15 April 1469, the date the English and Urdu articles and Wikidata carry and the one internally consistent with the Sikh records' stated age at his death. A rival tradition, the Bala janamsakhi's Kattak full moon, corresponds to 20 October 1469 and is the date on which the community now celebrates the Gurpurab; Britannica prints the day with a question mark (April 15?, 1469). The Hijri year is derived from the date."
  sources: [source/wikipedia-guru-nanak-en, source/wikipedia-guru-nanak-ur, source/britannica-guru-nanak, source/wikidata-guru-nanak]

died:
  edtf: "1539-09-22"
  calendar: gregorian
  precision: day
  status: historical
  hijri: "0946"
  derived: true
  note: "Died at Kartarpur on the Ravi, the settlement he founded; the place has no entity in the graph, so the death place is prose-only. The Sikh records date the death to the tenth day of Asauj, Samvat 1596, corresponding to 22 September 1539, at the stated age of 70 years, 5 months and 7 days, which fits the April 1469 birth. Britannica notes the tradition divided between 1538 and 1539, with 1539 the more likely; Wikidata carries three death values — 22 September 1538, 7 May 1539 and 22 September 1539 — all preserved here, with 22 September 1539 the value built. The Hijri year is derived from the date."
  sources: [source/wikipedia-guru-nanak-en, source/wikipedia-guru-nanak-ur, source/britannica-guru-nanak, source/wikidata-guru-nanak]

faith:
