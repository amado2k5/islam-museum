    basis: documented
    note: "Guru Nanak is the founder of Sikhism and the first of its ten Gurus, attested of the man himself by two independent sources: the English Wikipedia article, whose lead states that he 'is regarded as the founder of Sikhism and is the first of the ten Sikh gurus', and the Encyclopaedia Britannica biography, which states that he 'is revered as the founder and the first Guru of Sikhism'. Wikidata's religion value of Sikhism corroborates but is structured data and is not relied on. He is not recorded as a Muslim figure anywhere in this record: he stands in the museum as an honoured contemporary whose life and teaching interacted with the Muslim world, on the same footing as the lane's other honoured non-Muslim contemporaries."
    sources: [source/wikipedia-guru-nanak-en, source/britannica-guru-nanak]

