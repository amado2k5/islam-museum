summary:
  ar: "غورو ناناك (1469–1539)، مؤسس السيخية وأول غورواتها العشرة، وُلد في تالواندي (ننكانة صاحب اليوم) بالبنجاب ومات في كرتاربور التي أسسها. علّم وحدانية الله (إيك أونكار) والمساواة بين البشر، وألّف 974 ترنيمة محفوظة في الغورو غرانث صاحب. وتفاعل طوال حياته مع عالم الإسلام من حوله: تعلّم الفارسية والعربية عند مولوي، وعمل عند دولت خان لودي، ورافقه في أسفاره الموسيقي المسلم مردانا، وتنسب إليه حكايات الجانامساكي رحلات إلى مكة وبغداد — وهي روايات تقليدية متنازع في تاريخيتها — وتضمّن كتاب السيخ المقدس أبيات الصوفي المسلم فريد الدين غنج شكر. وهو هنا سجل لمعاصر مكرَّم تفاعل مع العالم الإسلامي، لا شخصية إسلامية."
  en: "Guru Nanak (1469–1539), founder of Sikhism and the first of its ten Gurus, born at Talwandi (present-day Nankana Sahib) in the Punjab and died at Kartarpur, the town he founded. He taught Ik Onkar, the one God, and the equality of all people, and composed 974 hymns preserved in the Guru Granth Sahib. His life ran through the Muslim world around him: he studied Persian and Arabic under a maulvi, worked for Daulat Khan Lodi, was accompanied on his journeys by the Muslim musician Mardana, and is credited by the janamsakhi tradition — as tradition, its historicity disputed — with journeys to Mecca and Baghdad; the Sikh scripture also preserves the verses of the Muslim Sufi Fariduddin Ganjshakar. He is recorded here as an honoured contemporary who interacted with the Muslim world, not as a Muslim figure."
  ur: "گرو نانک (1469ء–1539ء)، سکھ مت کے بانی اور اس کے دس گروؤں میں سے پہلے، پنجاب کے تلوںڈی (موجودہ ننکانہ صاحب) میں پیدا ہوئے اور اپنے قائم کردہ قصبے کرتار پور میں وفات پائی۔ انھوں نے اک اونکار، یعنی ایک خدا، اور تمام انسانوں کی برابری کی تعلیم دی، اور ان کے 974 شبد گرو گرنتھ صاحب میں محفوظ ہیں۔ ان کی زندگی اپنے گرد و نواح کے مسلم عالم سے جڑی رہی: انھوں نے مولوی سے فارسی اور عربی پڑھی، دولت خان لودھی کے ہاں ملازمت کی، ان کے سفر میں مسلمان موسیقار مردانہ ان کے رفیق رہے، اور جنم ساکھی روایت — بطور روایت، جس کی تاریخیت متنازع ہے — ان کے مکہ اور بغداد کے سفر بیان کرتی ہے؛ سکھ صحیفے میں مسلم صوفی فرید الدین گنج شکر کے اشعار بھی محفوظ ہیں۔ وہ یہاں عالم اسلام سے تعامل رکھنے والے ایک معزز ہم عصر کے طور پر درج ہیں، کوئی مسلمان شخصیت نہیں۔"

