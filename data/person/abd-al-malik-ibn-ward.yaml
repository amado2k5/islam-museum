summary:
  ar: "عبد الملك بن محمد بن عمر التميمي، أبو مروان، من أهل المرية، يُعرف بابن ورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} روى عن أبي علي الغساني، وأبي علي الصدفي وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} كان فقيهاً حافظاً للمسائل، متحققاً بالرأي، مشاوراً بصيراً بالفتيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} والمصدر المذكور: الذيل والتكملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} وتاريخ الوفاة في رأس الترجمة «٥٤٢ هجرية» مع علامة استفهام في أول التاريخ، فيُذكر بهذا التحفظ."
  en: "Abd al-Malik ibn Muhammad ibn Umar al-Tamimi, Abu Marwan, from Almeria, known as Ibn Ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} He transmitted from Abu Ali al-Ghassani, Abu Ali al-Sadafi and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} He was a jurist, a memorizer of questions, firm in opinion, consulted and perceptive in giving fatwas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} The source cited is al-Dhayl wal-takmila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} The heading gives 542 AH with a question mark at the start of the date, so it is stated with that caution."
  fr: "Abd al-Malik ibn Muhammad ibn Umar al-Tamimi, Abu Marwan, d'Almería, connu sous le nom d'Ibn Ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} Il transmit d'Abu Ali al-Ghassani, d'Abu Ali al-Sadafi et d'autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} Il était juriste, mémorisateur des questions, ferme dans ses avis, consulté et perspicace dans ses fatwas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} La source citée est al-Dhayl wal-takmila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} L'en-tête donne 542 H précédé d'un point d'interrogation, aussi la date est-elle donnée avec cette réserve."
  es: "Abd al-Malik ibn Muhammad ibn Umar al-Tamimi, Abu Marwan, almeriense, conocido como Ibn Ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} Transmitió desde Abu Ali al-Ghassani, Abu Ali al-Sadafi y otros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} Era un jurista, memorizador de preguntas, de opinión firme, consultado y perspicaz al pronunciar fatwas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} La fuente citada es al-Dhayl wal-takmila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} El encabezado da 542 AH con un signo de interrogación al comienzo de la fecha, por lo que se indica con esa precaución."
  ur: "عبد الملک ابن محمد ابن عمر التمیمی، ابو مروان، المیریا سے، جو ابن ورد کے نام سے مشہور ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17699} انہوں نے ابو علی الغسانی، ابو علی الصدفی اور دیگر سے نقل کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17699} وہ ایک فقیہ، سوالات کے حافظ، رائے میں پختہ، فتویٰ دینے میں مشورہ کرنے والے اور ادراک کرنے والے تھے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17699} الذیل والتکمیلہ کا حوالہ دیا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17699} سرخی 542 ہجری کو تاریخ کے شروع میں سوالیہ نشان کے ساتھ بتاتی ہے، اس لیے اسے احتیاط کے ساتھ بیان کیا گیا ہے۔"
  tr: "Almeriyeli Abdülmalik ibn Muhammed ibn Ömer el-Tamimi, Ebu Mervan, İbn Ward olarak bilinir. Ebu Ali el-Ghasani, Ebu Ali el-Sadafi ve diğerlerinden rivayet etmiştir. Hukukçu, hukuki konularda bilgili, görüşlerinde sağlam, güvenilir bir danışman ve fetva vermede basiretli bir kişiydi. Bahsedilen kaynak: El-Zeyl ve el-Takmila. Ölüm tarihi biyografinin başında \"542 Hicri\" olarak soru işaretiyle verilmiş ve bu uyarı ile birlikte belirtilmiştir."
  id: "Abd al-Malik ibn Muhammad ibn Umar al-Tamimi, Abu Marwan, dari Almeria, dikenal sebagai Ibn Ward. Beliau meriwayatkan dari Abu Ali al-Ghassani, Abu Ali al-Sadafi, dan lainnya. Beliau adalah seorang ahli hukum, mahir dalam masalah hukum, berwawasan luas, penasihat terpercaya, dan berwawasan dalam mengeluarkan fatwa. Sumber yang disebutkan adalah: Al-Dhayl wa al-Takmila. Tanggal kematiannya disebutkan di awal biografi sebagai \"542 H\" dengan tanda tanya di awal tanggal, dan disebutkan dengan catatan ini."
