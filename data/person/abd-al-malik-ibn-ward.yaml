summary:
  ar: "عبد الملك بن محمد بن عمر التميمي، أبو مروان، من أهل المرية، يُعرف بابن ورد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} روى عن أبي علي الغساني، وأبي علي الصدفي وغيرهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} كان فقيهاً حافظاً للمسائل، متحققاً بالرأي، مشاوراً بصيراً بالفتيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} والمصدر المذكور: الذيل والتكملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} وتاريخ الوفاة في رأس الترجمة «٥٤٢ هجرية» مع علامة استفهام في أول التاريخ، فيُذكر بهذا التحفظ."
  en: "Abd al-Malik ibn Muhammad ibn Umar al-Tamimi, Abu Marwan, from Almeria, known as Ibn Ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} He transmitted from Abu Ali al-Ghassani, Abu Ali al-Sadafi and others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} He was a jurist, a memorizer of questions, firm in opinion, consulted and perceptive in giving fatwas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} The source cited is al-Dhayl wal-takmila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17699} The heading gives 542 AH with a question mark at the start of the date, so it is stated with that caution."
