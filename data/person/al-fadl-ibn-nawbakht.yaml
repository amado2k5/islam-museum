  en: "Abu Sahl al-Fadl ibn Nawbakht the Persian, in al-Rashid's khizanat al-hikma, rendering into Arabic whatever Persian wisdom-books he found — 'his reliance in learning and books was on the books of the Persians', as al-Qifti says."
