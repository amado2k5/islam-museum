label:
  ar: أبو سهل الفضل بن نوبخت
  en: Abu Sahl al-Fadl ibn Nawbakht
  fr: "Abu Sahl al-Fadl ibn Nawbakht"
  es: "Abu Sahl al-Fadl ibn Nawbakht"
  ur: "ابو سہل الفضل بن نوبخت"
summary:
  ar: "أبو سهل الفضل بن نوبخت الفارسي، كان في خزانة الحكمة لهرون الرشيد ينقل من الفارسية إلى العربية ما يجده من كتب الحكمة الفارسية، ومعوّله في علمه وكتبه على كتب الفرس على ما قال القفطي."
  en: "Abu Sahl al-Fadl ibn Nawbakht the Persian, in al-Rashid's khizanat al-hikma, rendering into Arabic whatever Persian wisdom-books he found — 'his reliance in learning and books was on the books of the Persians', as al-Qifti says."
  fr: "Abu Sahl al-Fadl ibn Nawbakht le Persan, dans la khizanat al-hikma d’al-Rashid, traduisant en arabe tous les livres de sagesse perse qu’il trouvait — « son savoir et ses livres reposaient sur les livres des Perses », selon al-Qifti."
  es: "Abu Sahl al-Fadl ibn Nawbakht el Persa, en el Khizanat al-hikma de al-Rashid, tradujo al árabe todos los libros de sabiduría persa que encontró; \"su confianza en el aprendizaje y los libros estaba puesta en los libros de los persas\", como dice al-Qifti."
  ur: "ابو سہل الفضل بن نوبخت فارسی نے الرشید کی کتابت الحکمہ میں جو بھی فارسی حکمت کی کتابیں پائی اسے عربی میں پیش کیا - 'تعلیم اور کتابوں میں ان کا بھروسہ فارسیوں کی کتابوں پر تھا' جیسا کہ القیفتی کہتے ہیں۔"
  tr: "El-Kifti'nin anlattığına göre, Ebu Sahl el-Fadl ibn Nevbakht el-Farsi, Harun el-Raşid'in bilgelik hazinesinde görev yapmış, Farsça bilgelik kitaplarından bulduklarını Arapçaya çevirmiş ve bilgisi ile yazıları Farsça kitaplara dayanmıştır."
  id: "Abu Sahl al-Fadl ibn Nawbakht al-Farsi adalah salah satu tokoh yang memegang teguh ilmu kebijaksanaan Harun al-Rashid, menerjemahkan kitab-kitab kebijaksanaan Persia yang ditemukannya dari bahasa Persia ke bahasa Arab, dan pengetahuan serta tulisannya didasarkan pada kitab-kitab Persia, menurut apa yang dikatakan oleh al-Qifti."
