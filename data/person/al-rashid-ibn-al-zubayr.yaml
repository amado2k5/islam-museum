died: { edtf: "1168", hijri: "0563", calendar: julian, precision: year, status: tradition, derived: true, note: "قُتل ظلماً وعدواناً في الحرم سنة ثلاث وستين وخمسمائة؛ وقال العماد الكاتب: قتله شاور ظلماً لميله إلى أسد الدين شيركوه {cite:wafayat-ayan}." }
summary:
  ar: "القاضي الرشيد أبو إسحاق إبراهيم بن أحمد بن الحسين بن الزبير الغساني الأسواني؛ كان من أهل الفضل والنباهة والرئاسة؛ صنّف كتاب «الجنان» وذكر فيه جماعة من مشاهير الفضلاء وله كتاب العجائب والطرف والهدايا والتحف وله ديوان شعر؛ ولي النظر بثغر الإسكندرية في الدواوين السلطانية بغير اختياره سنة تسع وخمسين وخمسمائة ثم قُتل ظلماً؛ قال ابن خلكان: كان الرشيد أوحد عصره في علم الهندسة والرياضيات والعلوم الشرعية والآداب الشعرية {cite:wafayat-ayan}."
  en: "Al-Qadi al-Rashid Ibrahim b. al-Zubayr al-Ghassani (d. 563) — Aswan-born qadi, author of the Book of Gifts and a diwan, called by Ibn Khallikan unique in his age in geometry and belles-lettres; Shawar had him killed for inclining to Shirkuh {cite:wafayat-ayan}."
