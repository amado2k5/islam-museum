summary:
  ar: "القاضي الرشيد أبو إسحاق إبراهيم بن أحمد بن الحسين بن الزبير الغساني الأسواني؛ كان من أهل الفضل والنباهة والرئاسة؛ صنّف كتاب «الجنان» وذكر فيه جماعة من مشاهير الفضلاء وله كتاب العجائب والطرف والهدايا والتحف وله ديوان شعر؛ ولي النظر بثغر الإسكندرية في الدواوين السلطانية بغير اختياره سنة تسع وخمسين وخمسمائة ثم قُتل ظلماً؛ قال ابن خلكان: كان الرشيد أوحد عصره في علم الهندسة والرياضيات والعلوم الشرعية والآداب الشعرية {cite:wafayat-ayan}."
  en: "Al-Qadi al-Rashid Ibrahim b. al-Zubayr al-Ghassani (d. 563) — Aswan-born qadi, author of the Book of Gifts and a diwan, called by Ibn Khallikan unique in his age in geometry and belles-lettres; Shawar had him killed for inclining to Shirkuh {cite:wafayat-ayan}."
  fr: "Al-Qadi al-Rashid Ibrahim b. al-Zubayr al-Ghassani (mort en 563) – Qadi d’Assouan, auteur du Livre des dons et d’un diwan, appelé par Ibn Khallikan unique en son âge en géométrie et belles-lettres  ; Shawar le fit tuer pour inclination à Shirkuh {cite:wafayat-ayan}."
  es: "Al-Qadi al-Rashid Ibrahim b. al-Zubayr al-Ghassani (m. 563): cadí nacido en Asuán, autor del Libro de los Regalos y diwan, llamado por Ibn Khallikan único en su época en geometría y bellas letras; Shawar hizo que lo mataran por inclinarse hacia Shirkuh {cita:wafayat-ayan}."
  ur: "القادی الرشید ابراہیم بی۔ الزبیر الغسانی ⁦(متوفی 563)⁩ - اسوان میں پیدا ہونے والا قادی، تحفے کی کتاب کا مصنف اور ایک دیوان، جسے ابن خلیقان نے جیومیٹری اور بیلس لیٹرس میں اپنی عمر میں منفرد کہا ہے۔ شوار نے اسے شرکوہ کی طرف مائل ہونے کی وجہ سے قتل کر دیا تھا۔"
  tr: "Bilge yargıç Ebu İshaq İbrahim ibn Ahmed ibn el-Hüseyin ibn el-Zubeyr el-Ghassani el-Asvani; erdemli, içgörü ve liderlik sahibi bir adamdı; ünlü erdemli bireylerden bahsettiği \"El-Cinan\" adlı kitabı yazdı. 'Mucizeler, Dikkat, Hediyeler ve Armağanlar' adlı kitabı yazdı ve bir şiir koleksiyonu vardı; 559 Hicri yılında İskenderiye sınırını kraliyet saraylarında kendi isteğiyle denetledi ve haksız yere öldürüldü. İbn Hallikan şöyle dedi: El-Reşid, döneminin geometri, matematik, din bilimleri ve şiir edebiyatında eşsiz figürüydü."
  id: "Hakim bijak Abu Ishaq Ibrahim ibn Ahmad ibn al-Husayn ibn al-Zubayr al-Ghassani al-Aswani; ia adalah seorang yang berbudi luhur, berwawasan, dan memimpin; ia menulis buku \"Al-Jinan,\" di mana ia menyebutkan sekelompok tokoh ternama yang berbudi luhur. Ia menulis buku 'Keajaiban, Perhatian, Hadiah, dan Hadiah,' dan memiliki kumpulan puisi; ia mengawasi perbatasan Alexandria di istana kerajaan tanpa pilihannya pada tahun 559 H, dan dibunuh secara tidak adil. Ibn Khallikan berkata: Al-Rashid adalah sosok unik pada zamannya dalam geometri, matematika, ilmu agama, dan sastra puisi."
