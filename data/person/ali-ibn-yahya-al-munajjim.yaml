label: { ar: "علي بن يحيى المنجم", en: "'Ali ibn Yahya al-Munajjim", es: "'Ali ibn Yahya al-Munajjim", fr: "'Ali ibn Yahya al-Munajjim", ur: "علی ابن یحییٰ المنجم" }
summary:
  ar: "من بني المنجم، حدث عن نفسه أن المنتصر رآه مغموماً لضيعة أحب شراءها ولا قيمة عنده من ثمنها الثلاثين ألف درهم إلا عشرة، فأشار إلى خادمه فصار إلى داره ببغل عليه بدرتان فوفى الثمن ولم يعد المنتصر عليه حرفاً إلى أن فرق الموت بينهما، وقال ما رأيت أحداً أكرم أفعالاً بغير تبجح منه {cite:muruj-al-dhahab p. 521-522}."
  en: "The Banu'l-Munajjim astrologer — al-Muntasir quietly sent his servant round with the twenty thousand he lacked, never mentioning it again {cite:muruj-al-dhahab p. 521-522}."
  es: "El astrólogo Banu'l-Munajjim, al-Muntasir, envió discretamente a su sirviente con los veinte mil que le faltaban, sin volver a mencionarlo jamás {cite:muruj-al-dhahab p. 521-522}."
  fr: "L'astrologue des Banu'l-Munajjim — al-Muntasir a discrètement envoyé son serviteur avec les vingt mille qui lui manquaient, sans jamais en reparler {cite:muruj-al-dhahab p. 521-522}."
  ur: "بنو المنجم نجومی - المنتصر نے خاموشی سے اپنے نوکر کو بیس ہزار کی کمی کے ساتھ بھیج دیا، پھر کبھی اس کا ذکر نہیں کیا۔ 521-522}۔"
  tr: "Banu Al-Munajj'dan, Al-Muntasir'in onu satın almayı sevdiği bir çiftlik yüzünden üzgün gördüğünü ve onu on dirhem hariç otuz bin dirhem olarak değerlediğini anlattı. Hizmetçisine işaret etti ve üzerinde iki katır ile evine gitti, bedelini ödedi. Al-Muntassir ölüm onları ayırana kadar tek kelime etmedi. Dedi ki: Onun övündüğü kadar cömert birini görmedim {cite:muruj-al-dhahab, s. 521-522}."
  id: "Dari Banu Al-Munajj, ia berkata pada dirinya sendiri bahwa Al-Muntasir melihatnya gelisah karena sebuah pertanian yang ia sukai beli, yang nilainya adalah tiga puluh ribu dirham kecuali sepuluh. Ia memberi isyarat kepada pelayannya dan pergi ke rumahnya dengan dua keledai di atasnya, dan ia membayar harganya. Al-Muntassir tidak berkata sepatah kata pun sampai kematian memisahkan mereka. Ia berkata: Aku belum pernah melihat siapa pun yang lebih murah hati dalam perbuatan daripada yang ia banggakan {cite:muruj-al-dhahab, hlm. 521-522}."
