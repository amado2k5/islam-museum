id: person/barmak-ibn-abdallah-al-dabili
class: person
label: { ar: "برمك بن عبد الله الدبيلي", en: "Barmak ibn Abdallah al-Dabili", es: "Barmak ibn Abdallah al-Dabili", fr: "Barmak ibn Abdallah al-Dabili", ur: "برمک ابن عبداللہ الدبیلی" }
summary:
  ar: "برمك بن عبد الله الدبيلي من مشايخ أهل دبيل؛ عند البلاذري: هو من رواة قصة ذات اللجُم حين سرّح أصحاب حبيب دوابهم فأعجلهم العلوج عن الألجام فكروا عليهم فقتلوهم وارتجعوها."
  en: "Barmak ibn Abdallah al-Dabili, of the shaykhs of Dabil; in al-Baladhuri: he is among the transmitters of the Dhat al-Lujum story — Habib's men loosing their beasts' bridles, the Aluj hurrying them off, then the Muslims wheeling to kill them and take them back."
  es: "Barmak ibn Abdallah al-Dabili, de los shaykhs de Dabil; en al-Baladhuri: él está entre los transmisores de la historia de Dhat al-Lujum: los hombres de Habib sueltan las riendas de sus bestias, los Aluj se las llevan rápidamente, y luego los musulmanes dan vueltas para matarlas y recuperarlas."
  fr: "Barmak ibn Abdallah al-Dabili, des cheikhs de Dabil; dans al-Baladhuri: il est parmi les transmetteurs de l'histoire de Dhat al-Lujum — les hommes d'Habib détachant les brides de leurs bêtes, les Aluj les emmenant précipitamment, puis les musulmans se retournant pour les tuer et les ramener."
  ur: "برمک بن عبداللہ الدبیلی، دبیل کے شیوخ میں سے؛ البلادوری میں: وہ دات الوجوم کی کہانی کے ٹرانسمیٹروں میں سے ہے - حبیب کے آدمی اپنے درندوں کی لگام کھو دیتے ہیں، علوج انہیں جلدی سے اتارتے ہیں، پھر مسلمان انہیں مارنے اور واپس لے جانے کے لیے چکر لگاتے ہیں۔"
  tr: "Barmak ibn Abdullah al-Dubaili, Dubil halkının şeyhlerinden biriydi; el-Baladhuri'ye göre: Habib'in yoldaşları hayvanlarını gezdirirken Lahujlar onları dizginden aceleyle çıkardığında Dhat al-Lajm hikayesinin anlatıcılarından biridir. Onları düşündüler, öldürdüler ve geri döndüler."
  id: "Barmak ibn Abdullah al-Dubaili adalah salah satu sheikh masyarakat Dubil; menurut al-Baladhuri: Ia adalah salah satu narator kisah Dhat al-Lajm ketika para sahabat Habib berkeliaran di hewan mereka dan Lahooj segera menarik mereka dari tali kekang. Mereka memikirkan mereka, membunuhnya, lalu kembali kepada mereka."
