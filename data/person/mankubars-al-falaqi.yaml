summary:
  ar: "الأمير ركن الدين منكوبرس مملوك فلك الدين أخي العادل؛ كان ديناً صالحاً عفيفاً ملازماً لجامع بني أمية، وله بقاسيون مدرسة وتربة أوقف عليها شيئاً كثيراً وداخل دمشق مدرسة كبيرة للشافعية وقرية جرود وقف عليهما؛ توفي بجرود وحمل فدفن في تربته بقاسيون {cite:shadharat-dhahab p. 147}."
  en: "Amir Rukn al-Din Mankubars al-Falaqi (d. 631) — mamluk of al-Adil's brother Fakhr al-Din; a devout man devoted to the Umayyad mosque, whose endowments raised a madrasa and tomb at Qasyun and a great Shafi'i madrasa inside Damascus {cite:shadharat-dhahab p. 147}."
  es: "Amir Rukn al-Din Mankubars al-Falaqi (m. 631): mameluco del hermano de al-Adil, Fakhr al-Din; un hombre devoto devoto de la mezquita omeya, cuyas dotaciones levantaron una madrasa y una tumba en Qasyun y una gran madrasa Shafi'i dentro de Damasco {citar: shadharat-dhahab p. 147}."
  fr: "Amir Rukn al-Din Mankubars al-Falaqi (mort en 631) — Fakhr al-Din, frère mamelouk d'al-Adil; un homme pieux dévoué à la mosquée des Omeyyades, dont les dotations ont élevé une madrasa et un tombeau à Qasyun et une grande madrasa Shafi'i à l'intérieur de Damas {cite: shadharat-dhahab p. 147}."
  ur: "امیر رکن الدین منکبرس الفلقی ⁦(متوفی 631)⁩ - عادل کے بھائی فخر الدین کا مملوک؛ اموی مسجد کے لیے وقف ایک متقی شخص، جس کے اوقاف نے قصیون میں ایک مدرسہ اور مقبرہ اور دمشق کے اندر ایک عظیم شافعی مدرسہ قائم کیا۔ 147}۔"
  tr: "Prens Rukn al-Din Mankobaris Memlük Falak al-Din, kardeşim el-Adil; dindar ve iffetli bir adamdı ve Emevi Camii'ni yakından takip etti. Kasyon'da bir okulu ve mezarlığı vardı, bunlara birçok şey bağışladı. Şam'da, Şafiiler için büyük bir okul ve Jarud köyü vardı, her ikisi de ona bağışıktı. Jarud'da öldü ve Qasioun'daki mezarına defnedildi {cite:shadharat-dhahab, s. 147}."
  id: "Pangeran Rukn al-Din Mankobaris Mamluk Falak al-Din, saudaraku al-Adil; dia adalah pria yang saleh dan suci yang mengikuti Masjid Umayyah dengan rapat. Dia memiliki sekolah dan pemakaman di Qasioun yang menjadi dasar banyak benda baginya. Di dalam Damaskus, terdapat sekolah besar untuk Syafi'i dan desa Jaroud, keduanya dianugerahi olehnya. Dia meninggal di Jaroud dan dimakamkan di makamnya di Qasioun {cite:shadharat-dhahab, hlm. 147}."
