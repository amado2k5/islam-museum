  ar: "الأمير ركن الدين منكوبرس مملوك فلك الدين أخي العادل؛ كان ديناً صالحاً عفيفاً ملازماً لجامع بني أمية، وله بقاسيون مدرسة وتربة أوقف عليها شيئاً كثيراً وداخل دمشق مدرسة كبيرة للشافعية وقرية جرود وقف عليهما؛ توفي بجرود وحمل فدفن في تربته بقاسيون {cite:shadharat-dhahab p. 147}."
  en: "Amir Rukn al-Din Mankubars al-Falaqi (d. 631) — mamluk of al-Adil's brother Fakhr al-Din; a devout man devoted to the Umayyad mosque, whose endowments raised a madrasa and tomb at Qasyun and a great Shafi'i madrasa inside Damascus {cite:shadharat-dhahab p. 147}."
