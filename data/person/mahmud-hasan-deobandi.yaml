summary:
  ar: "عالم مسلم هندي (1851-1920) لُقّب بشيخ الهند، وهو أول طالب التحق بدار العلوم ديوبند ثم صار صدر المدرّسين فيها (1890-1915)، وقاد حركة الرسائل الحريرية ضد الحكم البريطاني فاعتُقل وسُجن في مالطة (1916-1920)، وشارك بعد إطلاقه في تأسيس الجامعة الملية الإسلامية ورأس جمعية علماء الهند، وألّف ترجمة أردية للقرآن أكملها تلميذه شبير أحمد العثماني بتفسيره المشهور."
  en: "Indian Muslim scholar (1851–1920) known as Shaykh al-Hind. He was the first student enrolled at Darul Uloom Deoband and later its principal (1890–1915); he led the Silk Letter Movement against British rule, was arrested and imprisoned in Malta (1916–1920), and after his release co-founded Jamia Millia Islamia and presided over the Jamiat Ulema-e-Hind. His Urdu translation of the Qur'an was completed by his student Shabbir Ahmad Usmani as the celebrated Tafsir-e-Usmani."
  ur: "ہندوستانی مسلمان عالم (1851-1920) جو شیخ الہند کے لقب سے مشہور ہیں۔ وہ دار العلوم دیوبند کے پہلے طالب علم اور بعد میں اس کے صدر المدرسین (1890-1915) رہے؛ انہوں نے برطانوی حکومت کے خلاف تحریکِ ریشمی رومال کی قیادت کی، گرفتار ہو کر مالٹا میں قید رہے (1916-1920)، اور رہائی کے بعد جامعہ ملیہ اسلامیہ کے قیام میں شریک ہوئے اور جمعیت علمائے ہند کی صدارت کی۔ ان کا اردو ترجمۂ قرآن ان کے شاگرد شبیر احمد عثمانی نے اپنے مشہور تفسیر کی صورت میں مکمل کیا۔"
