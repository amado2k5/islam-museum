summary:
  ar: "حمد بن عيسى آل خليفة (وُلد 28 يناير 1950) ملك البحرين منذ 2002، وكان أميرها من 1999. وُلد في الرفاع وعُيّن وليًا للعهد سنة 1964 في الرابعة عشرة، وتدرّب عسكريًا في بريطانيا والولايات المتحدة وقاد الحرس الوطني ثم قوة دفاع البحرين وأسّس سلاح جوّها. خلف والده عيسى أميرًا في 6 مارس 1999 فأطلق الميثاق الوطني للعمل ودستور 2002 الذي جعل البحرين مملكة وأعاد الانتخابات التشريعية بعد عقود، وشهد عهده احتجاجات 2011 وقمعها ثم جهودًا لتنويع الاقتصاد وتعزيز موقع البحرين المالي."
  en: "Hamad bin Isa Al Khalifa (born 28 January 1950) is King of Bahrain since 2002, having been its Emir from 1999. Born in Riffa and named heir apparent in 1964 aged fourteen, he trained militarily in Britain and the United States, commanded the National Guard and then the Bahrain Defence Force, and founded its air force. He succeeded his father Isa as Emir on 6 March 1999, launched the National Action Charter and the 2002 constitution that made Bahrain a kingdom and restored legislative elections after decades, and his reign has seen the 2011 protests and their suppression alongside efforts to diversify the economy and expand Bahrain's financial role."
  ur: "حمد بن عیسی آل خلیفہ (پیدائش 28 جنوری 1950ء) 2002ء سے بحرین کے بادشاہ ہیں اور اس سے قبل 1999ء سے امیر تھے۔ الرفاع میں پیدا ہوئے، 1964ء میں ولی عہد نامزد ہوئے، برطانیہ و امریکا میں عسکری تربیت پائی اور قومی محافظ دستے و بحرین دفاعی فوج کی قیادت کی۔ 6 مارچ 1999ء کو والد عیسیٰ کے جانشین بنے، میثاقِ قومی عمل اور 2002ء کا دستور لाए جس سے بحرین بادشاہت بنا اور پارلیمانی انتخابات بحال ہوئے؛ ان کے دور میں 2011ء کے احتجاج اور ان کا کچلنا بھی ہوا۔"
