summary:
  ar: "بطاقة أولية لأبي عبد الله محمد الرابع بن يوسف النصري، سلطان غرناطة الذي ولي سنة ١٣٢٥م وقتل غيلة بعد إضرار عهدته، توفي سنة ١٣٣٣م؛ تذكره معاجم الدول الإسلامية ولم تُراجع ترجمته على الصفحة بعد."
  en: "Draft card for Abu Abdallah Muhammad IV ibn Yusuf, Nasrid sultan of Granada from 1325 assassinated in 1333; the dynastic handbook entry is not yet checked on the page."
  es: "Ficha de nombramiento de Abu Abdallah Muhammad IV ibn Yusuf, sultán nazarí de Granada desde 1325, asesinado en 1333; la entrada en el libro de registro dinástico aún no se ha comprobado en la página."
  fr: "Fiche d'identité d'Abu Abdallah Muhammad IV ibn Yusuf, sultan nasride de Grenade à partir de 1325, assassiné en 1333; l'entrée du manuel dynastique n'est pas encore vérifiée sur la page."
  ur: "ابو عبداللہ محمد چہارم ابن یوسف کے لیے ڈرافٹ کارڈ، 1325 سے غرناطہ کے نصرید سلطان، 1333 میں قتل ہوئے۔ خاندانی ہینڈ بک کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "1325 yılında atanan ve hükümdarlığı zarar gördükten sonra Ghayla'yı öldüren Granada Sultanı Ebu Abdullah Muhammed IV bin Yusuf el-Nasri'nin ön kartı. 1333 yılında öldü; İslam Devletleri Sözlükleri'nde adı geçti ve çevirisi henüz sayfada incelenmedi."
  id: "Kartu pendahuluan Abu Abdullah Muhammad IV ibn Yusuf al-Nasri, Sultan Granada, yang diangkat pada tahun 1325 M dan membunuh Ghayla setelah pemerintahannya terganggu. Ia meninggal pada tahun 1333 M; ia disebutkan dalam Kamus Negara-Negara Islam dan terjemahannya belum ditinjau di halaman tersebut."
