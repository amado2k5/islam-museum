id: person/al-alqami
class: person
label: { ar: "الوزير مؤيد الدين العلقمي", en: "Vizier Mu'ayyad al-Din al-Alqami", fr: "Le vizir Mu’ayyad al-Din al-Alqami", es: "Vizier Mu'ayyad al-Din al-Alqami", ur: "وزیر معایۃ الدین العلقمی" }
summary:
  ar: "وزير المستعصم، كان حريصاً على إزالة الدولة العباسية ونقلها إلى العلوية وباطن التتار وأطمعهم في المجيء إلى العراق وأخذ بغداد وقطع الدولة العباسية ليقيم خليفة من آل علي وصار إذا جاءه خبر منهم كتمه عن الخليفة ويطالع التتار بأخبار الخليفة، وأشار على الخليفة بقطع أكثر الجند وأن مصانعة التتار يحصل بها المقصود {cite:tarikh-khulafa-minhaj-1434 p. 710-711}، ولم يتم له ما أراد وذاق من التتار الذل والهوان واطرحوه وصار معهم في صورة بعض الغلمان ومات كمداً {cite:tarikh-khulafa-minhaj-1434 p. 716,718}. وعند ابن خلدون وكان رافضياً؛ بلغ هلاكو في طريقه كتابه يستحثه لقصد بغداد ويهون عليه أمرها، ثم لما نزل هلاكو بغداد خرج إليه بن العلقمي فاستأمن لنفسه ورجع بالأمان إلى المستعصم، ولم يراع فيه ذمة الوزير بنهب بيوت الكرخ فآسفه ذلك {cite:tarikh-ibn-khaldun-ibar p. 900-901} كاتب التتار وحرضهم على قصد بغداد لأجل ما جرى على إخوانه الرافضة من النهب والخزي فظن أن الأمر يتم له وأنه يقيم خليفة علوياً وأرسل أخاه ومملوكه إلى هولاكو وسهل عليه أخذ بغداد وطلب أن يكون نائباً له عليها فوعدوه بالأماني، وكان لا يدع مكاتبات لؤلؤ صاحب الموصل تصل إلى الخليفة مع أنها لو وصلت لما أجدت لأن الخليفة كان يرد الأمر إليه {cite:shadharat-dhahab p. 278}."
  en: "Al-Musta'sim's vizier; keen to end the Abbasid state for an Alid caliph, he courted the Tatars, hid their news from the caliph, fed them his, and counselled the cutting of the army — the betrayal remembered against him {cite:tarikh-khulafa-minhaj-1434 p. 710-711}."
  fr: "Vizir d’al-Musta’sim ; désireux de mettre fin à l’État abbasside au profit d’un calife alide, il rechercha l’appui des Tatars, cacha leurs nouvelles au calife, leur transmit les siennes et conseilla de réduire l’armée — trahison retenue contre lui {cite:tarikh-khulafa-minhaj-1434 p. 710-711}."
  es: "Visir de Al-Musta'sim; deseoso de acabar con el estado abasí para un califa alí, cortejó a los tártaros, ocultó sus noticias al califa, les transmitió las suyas y aconsejó la reducción del ejército, traición que se le reprocharía {cite:tarikh-khulafa-minhaj-1434 p. 710-711}."
  ur: "المستسم کا وزیر؛ ایک علید خلیفہ کے لیے عباسی ریاست کو ختم کرنے کا خواہشمند، اس نے تاتاریوں سے ملاقات کی، خلیفہ سے ان کی خبریں چھپائیں، انہیں اپنا کھانا کھلایا، اور فوج کو کاٹنے کا مشورہ دیا - اس کے خلاف غداری یاد آ گئی۔ 710-711}۔"
  tr: "Mustafa'sim'in veziri, Abbasi devletini ortadan kaldırıp Alevilere ve Tatarların iç çevresine devretmek konusunda istekliydi. Onları Irak'a gelmeye, Bağdat'ı ele geçirmeye ve Abbasi devletini yıkıp Ali ailesinden bir halife kurmaya ikna etti. Onlardan gelen her haberi halifeden gizler ve Tatarlara halifenin faaliyetlerini bildirirdi. Halifeye ordunun büyük bir kısmını dağıtmasını tavsiye ederek, Tatarları yatıştırmanın amacına ulaşmasını sağlayacağını öne sürdü. Ancak planı başarılı olmadı ve Tatarların elinde aşağılanma ve rezilliğe uğradı. Onu dışladılar ve onların hizmetkarlarından biri oldu. Üzüntüden öldü. İbn Haldun'a göre, o bir Şii idi. Yolda, Hulagu'ya Bağdat'a yürümesi için teşvik eden ve meseleyi önemsiz gösteren bir mektup geldi. Sonra Hulagu Bağdat'a vardığında, İbn el-Alkami onun yanına gitti ve kendisi için güvenli geçiş istedi ve el-Musta'sim'e güvenli bir şekilde geri döndü. Vezirin verdiği sözü tutmayarak el-Karkh'ın evlerini yağmaladı, bu da onu kızdırdı. {cite:tarikh-ibn-khaldun-ibar s. 900-901} Tatarlara yazdı ve Şii kardeşlerinin başına gelen yağma ve rezillik nedeniyle onları Bağdat'a yürümeye teşvik etti. Meselenin kendisi için çözüleceğini ve bir Alid halifesi kuracağını düşünüyordu. Kardeşini ve kölesini Hulagu'ya gönderdi ve Bağdat'ı ele geçirmesini kolaylaştırdı, orada vekili olmayı istedi ve ona güvenlik sözü verdiler. Musul hükümdarı Lu'lu'nun mektuplarının halifeye ulaşmasına izin vermedi; ulaşsalar bile halifenin meseleyi ona geri havale etmesi nedeniyle etkili olmayacaklardı. {cite:shadharat-dhahab s. 278}"
  id: "Menteri al-Musta'sim sangat ingin menggulingkan negara Abbasiyah dan menyerahkannya kepada Alawiyah dan lingkaran dalam Tatar. Ia membujuk mereka untuk datang ke Irak, merebut Baghdad, dan membubarkan negara Abbasiyah untuk mengangkat seorang khalifah dari keluarga Ali. Setiap kali ia mendapat kabar dari mereka, ia akan menyembunyikannya dari khalifah dan memberi tahu Tatar tentang aktivitas khalifah. Ia menasihati khalifah untuk membubarkan sebagian besar tentara, dengan mengatakan bahwa menenangkan Tatar akan mencapai tujuannya {cite:tarikh-khulafa-minhaj-1434 hlm. 710-711}. Namun, rencananya tidak berhasil, dan ia menderita penghinaan dan aib di tangan Tatar. Mereka mengusirnya, dan ia menjadi salah satu pelayan mereka. Ia meninggal karena kesedihan {cite:tarikh-khulafa-minhaj-1434 hlm. 716,718}. Menurut Ibn Khaldun, ia adalah seorang Syiah. Dalam perjalanannya, Hulagu menerima surat yang mendesaknya untuk menyerang Baghdad dan membuat masalah itu tampak tidak penting baginya. Kemudian, ketika Hulagu tiba di Baghdad, Ibn al-Alqami menemuinya dan meminta jalan aman untuk dirinya sendiri dan kembali dengan jaminan keselamatan kepada al-Musta'sim. Ia tidak menghormati janji wazir dengan menjarah rumah-rumah al-Karkh, yang membuatnya marah. {cite:tarikh-ibn-khaldun-ibar hlm. 900-901} Ia menulis surat kepada Tatar dan menghasut mereka untuk menyerang Baghdad karena apa yang telah terjadi pada saudara-saudara Syiahnya dalam hal penjarahan dan penghinaan. Ia berpikir bahwa masalah itu akan diselesaikan untuknya dan bahwa ia akan mendirikan seorang khalifah Alid. Ia mengirim saudara laki-lakinya dan budaknya kepada Hulagu dan memfasilitasi penaklukannya atas Baghdad dan meminta untuk menjadi wakilnya di sana, dan mereka menjanjikan keamanan kepadanya. Dia tidak mengizinkan surat-surat Lu'lu', penguasa Mosul, sampai ke khalifah, meskipun jika surat-surat itu sampai kepadanya, surat-surat itu tidak akan berpengaruh karena khalifah mengembalikan masalah itu kepadanya. {cite:shadharat-dhahab p. 278}"
