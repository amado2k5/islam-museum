id: person/al-alqami
class: person
label: { ar: "الوزير مؤيد الدين العلقمي", en: "Vizier Mu'ayyad al-Din al-Alqami" }
summary:
  ar: "وزير المستعصم، كان حريصاً على إزالة الدولة العباسية ونقلها إلى العلوية وباطن التتار وأطمعهم في المجيء إلى العراق وأخذ بغداد وقطع الدولة العباسية ليقيم خليفة من آل علي وصار إذا جاءه خبر منهم كتمه عن الخليفة ويطالع التتار بأخبار الخليفة، وأشار على الخليفة بقطع أكثر الجند وأن مصانعة التتار يحصل بها المقصود {cite:tarikh-khulafa-minhaj-1434 p. 710-711}، ولم يتم له ما أراد وذاق من التتار الذل والهوان واطرحوه وصار معهم في صورة بعض الغلمان ومات كمداً {cite:tarikh-khulafa-minhaj-1434 p. 716,718}. وعند ابن خلدون وكان رافضياً؛ بلغ هلاكو في طريقه كتابه يستحثه لقصد بغداد ويهون عليه أمرها، ثم لما نزل هلاكو بغداد خرج إليه بن العلقمي فاستأمن لنفسه ورجع بالأمان إلى المستعصم، ولم يراع فيه ذمة الوزير بنهب بيوت الكرخ فآسفه ذلك {cite:tarikh-ibn-khaldun-ibar p. 900-901} كاتب التتار وحرضهم على قصد بغداد لأجل ما جرى على إخوانه الرافضة من النهب والخزي فظن أن الأمر يتم له وأنه يقيم خليفة علوياً وأرسل أخاه ومملوكه إلى هولاكو وسهل عليه أخذ بغداد وطلب أن يكون نائباً له عليها فوعدوه بالأماني، وكان لا يدع مكاتبات لؤلؤ صاحب الموصل تصل إلى الخليفة مع أنها لو وصلت لما أجدت لأن الخليفة كان يرد الأمر إليه {cite:shadharat-dhahab p. 278}."
  en: "Al-Musta'sim's vizier; keen to end the Abbasid state for an Alid caliph, he courted the Tatars, hid their news from the caliph, fed them his, and counselled the cutting of the army — the betrayal remembered against him {cite:tarikh-khulafa-minhaj-1434 p. 710-711}."
