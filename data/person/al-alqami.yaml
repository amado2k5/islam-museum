issue:
  ar: "ما دور الوزير ابن العلقمي في سقوط بغداد سنة 656هـ، وما دافعه؟"
  en: "What part did the vizier Ibn al-Alqami play in the fall of Baghdad in 656 AH, and what moved him?"
  ur: "656ھ میں سقوطِ بغداد میں وزیر ابن العلقمی کا کیا کردار تھا، اور اس کا محرک کیا تھا؟"
perspectives:
  - tradition: sunni
    id: sunni-chroniclers
    standing: main
    summary:
      ar: "أهل السنة من المؤرخين، كالسيوطي وابن خلدون وابن العماد، ينسبون إليه مكاتبة التتار وإطماعهم في بغداد، والإشارة على الخليفة بقطع أكثر الجند ومصانعة التتار، ويختلفون في دافعه: فعند السيوطي حرصه على نقل الخلافة إلى العلويين، وعند ابن العماد غضبه لما جرى على أهل مذهبه من النهب {cite:tarikh-khulafa-minhaj-1434 p. 710-711} {cite:tarikh-ibn-khaldun-ibar p. 900-901} {cite:shadharat-dhahab p. 278}."
      en: "Sunni chroniclers, al-Suyuti, Ibn Khaldun and Ibn al-Imad among them, ascribe to him letters to the Tatars encouraging them against Baghdad, and the advice to the caliph to cut most of the army and appease the Tatars; they differ on his motive: for al-Suyuti, the wish to move the caliphate to the Alids; for Ibn al-Imad, anger at the plundering suffered by those of his own school {cite:tarikh-khulafa-minhaj-1434 p. 710-711} {cite:tarikh-ibn-khaldun-ibar p. 900-901} {cite:shadharat-dhahab p. 278}."
      ur: "اہلِ سنت کے مؤرخین، جن میں سیوطی، ابن خلدون اور ابن العماد شامل ہیں، اس سے تاتاریوں کو بغداد پر ابھارنے والے خطوط اور خلیفہ کو اکثر فوج ختم کرنے اور تاتاریوں سے مصالحت کے مشورے منسوب کرتے ہیں؛ اس کے محرک میں وہ مختلف ہیں: سیوطی کے نزدیک خلافت کو علویوں کی طرف منتقل کرنے کی خواہش، اور ابن العماد کے نزدیک اپنے ہم مسلکوں پر ہونے والی لوٹ مار پر غصہ {cite:tarikh-khulafa-minhaj-1434 p. 710-711} {cite:tarikh-ibn-khaldun-ibar p. 900-901} {cite:shadharat-dhahab p. 278}۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/tarikh-ibn-khaldun-ibar, source/shadharat-dhahab]
  - tradition: sunni
    id: sunni-al-suwaidan
    summary:
      ar: "أهل السنة في عرض معاصر: يروي طارق السويدان أن ابن العلقمي، وهو عنده «لم يكن سنياً»، عقد مع هولاكو اتفاقاً سرياً على أن يعاون التتار بشرط أن يرعوا بغداد ولا يقتلوا الناس وأن يكون له مقعد في مجلس الحكم بعدها، ويقول إن كبار المؤرخين ومنهم ابن كثير يذكرون هذا الاتفاق؛ لكنه ينقل عن ابن كثير أنه يلوم الخليفة المستعصم أكثر من الوزير، ويحمّل الخليفة مسؤولية إبقائه في منصبه أربع عشرة سنة {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:05:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:07:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:07:30} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:08:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep15 00:07:00}."
      en: "A modern Sunni account: Tareq al-Suwaidan relates that Ibn al-Alqami, who he says \"was not a Sunni\", made a secret agreement with Hulagu to help the Tatars on condition that they spare Baghdad and its people and give him a seat on the governing council afterwards, and says the great historians, Ibn Kathir among them, mention this agreement; yet he reports Ibn Kathir as blaming the caliph al-Musta'sim more than the vizier, and holds the caliph responsible for keeping him in office for fourteen years {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:05:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:07:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:07:30} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:08:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep15 00:07:00}."
      ur: "اہلِ سنت کا ایک معاصر بیان: طارق السویدان بیان کرتے ہیں کہ ابن العلقمی نے، جو ان کے بقول «سنی نہیں تھا»، ہلاکو سے ایک خفیہ معاہدہ کیا کہ وہ تاتاریوں کی مدد کرے گا بشرطیکہ وہ بغداد اور اس کے لوگوں کو بخش دیں اور بعد میں اسے حکومتی مجلس میں نشست دیں، اور کہتے ہیں کہ بڑے مؤرخین، جن میں ابن کثیر بھی ہیں، اس معاہدے کا ذکر کرتے ہیں؛ تاہم وہ ابن کثیر سے نقل کرتے ہیں کہ وہ خلیفہ المستعصم کو وزیر سے زیادہ ملامت کرتے ہیں، اور خلیفہ کو اسے چودہ سال منصب پر رکھنے کا ذمہ دار ٹھہراتے ہیں {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:05:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:07:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:07:30} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep14 00:08:00} {cite:assabile-tareq-al-suwaidan alamani-al-tarikh/ep15 00:07:00}۔"
