summary:
  ar: "عميد الدولة شرف الدين أبو منصور محمد ولد الوزير فخر الدولة ابن جهير؛ كان ينوب عن أبيه في الوزارة، فلما عزله أبو الغنائم ابن دارست بإشارة نظام الملك خرج هو إلى نظام الملك أبي علي وزير ملكشاه بن ألب أرسلان السلجوقي ساعياً في إعادة الوزارة لمكان أبيه؛ وكان أبوه قد صالح السلطان ملكشاه وعقد له ديار بكر ففتح ولده أبو القاسم زعم الرؤساء مدينة آمد بعد حصار شديد ثم فتح هو ميافارقين سنة تسع وسبعين وأربعمائة {cite:wafayat-ayan}."
  en: "Amid al-Dawla Sharaf al-Din b. Ibn Jahir — deputy-vizier to his father Fakhr al-Dawla; when the father was dismissed he rode to Nizam al-Mulk seeking the vizierate's restoration {cite:wafayat-ayan}."
