id: person/ibrahim-ibn-abdallah-al-hasani
class: person
label: { ar: "إبراهيم بن عبد الله الحسني", en: "Ibrahim ibn Abdallah al-Hasani" }
summary:
  ar: "إبراهيم بن عبد الله بن الحسن بن الحسن بن علي بن أبي طالب أخو محمد النفس الزكية؛ عند البلاذري حاربه عيسى بن موسى وعسكر أبو الأسد مولى المنصور بينه وبين عسكره عند البطيحة وسبب حبس أبيه عبد الله بالمدينة الهاشمية هو ومحمد.، وعند المسعودي قتل بباخمرى على ستة عشر فرسخاً من الكوفة من أرض الطف مع أربعمائة وقيل خمسمائة من الزيدية، وأتى برأسه فوجه به المنصور مع الربيع إلى أبيه عبد الله في الحبس فوضعه بين أيديهم وهو يصلي فأخذه فوضعه في حجره وقال أهلاً وسهلاً يا أبا القاسم {cite:muruj-al-dhahab p. 285-288}"
  en: "Ibrahim ibn Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib, brother of Muhammad al-Nafs al-Zakiyya; in al-Baladhuri, fought by Isa ibn Musa while Abu al-Asad camped between them at the Batayih — he and Muhammad were the cause of their father Abdallah's imprisonment at the Hashimiyya."
