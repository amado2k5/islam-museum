summary:
  ar: 'السلطان مصطفى الثالث ⁦(١١٧١–١١٨٧هـ/١٧٥٧–١٧٧٣م)⁩؛ من السلاطين المجاهدين، تصدى للهجمات الروسية وأنزل بها هزائم عدة، وكان
    يرى بثاقب بصره أن الدولة بدأت في عصر التراجع والسقوط وظهرت تلك الرؤية في شعره: إن الدنيا منهدمة لا تظن أنها تستقيم لنا.
    وكان مهتماً بالتاريخ الإسلامي عموماً وتاريخ الدولة العثمانية خصوصاً. واستمرت الحرب مع روسيا من ١٧٦٨م إلى ١٧٧٤م وفقدت الدولة
    فيها أراضي واسعة، ومرض مصطفى الثالث في حرب روسيا حزناً وتوفي عن ٥٧ عاماً وتولى مكانه أخوه عبد الحميد الأول {cite:dawlat-uthmaniyya-salabi
    p. 316}.'
  en: Mustafa III (r. 1171–1187/1757–1773) — a mujahid sultan who beat the Russians several times yet foresaw the decline
    and wrote it in verse; the 1768–1774 war that ended at Küçük Kaynarca broke him — he fell ill with grief and died at 57
    {cite:dawlat-uthmaniyya-salabi p. 316}.
  es: "Mustafa III (r. 1171–1187/1757–1773) — un sultán muyahidín que derrotó a los rusos varias veces, pero previó la decadencia y la plasmó en verso; la guerra de 1768–1774 que terminó en Küçük Kaynarca lo destrozó — enfermó de pena y murió a los 57 años {cite:dawlat-uthmaniyya-salabi p. 316}."
  fr: "Mustafa III (r. 1171–1187/1757–1773) — un sultan moudjahid qui a vaincu les Russes à plusieurs reprises, mais qui a prédit le déclin et l'a écrit en vers; la guerre de 1768–1774 qui s'est terminée à Küçük Kaynarca l'a brisé — il est tombé malade de chagrin et est mort à 57 ans {cite:dawlat-uthmaniyya-salabi p. 316}."
  ur: "مصطفی III (r. 1171–1187/1757–1773) — ایک مجاہد سلطان جس نے کئی بار روسیوں کو شکست دی لیکن اس نے زوال کا اندازہ لگایا اور اسے آیت میں لکھا؛ 1768-1774 کی جنگ جو کوک کینارکا میں ختم ہوئی تھی - وہ غم سے بیمار ہوا اور 57 سال کی عمر میں انتقال کر گیا۔ 316}۔"
