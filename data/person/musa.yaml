summary:
  ar: "نبي بني إسرائيل. عند البخاري خبر الحجر الذي فرّ بثوبه فتبعه حتى برأه الله عند قومه {cite:sahih-al-bukhari 278}، وقصته مع الخضر بطولها على لسان ابن عباس الذي رد على من زعم أن موسى صاحب الخضر غيره {cite:sahih-al-bukhari 3401}، ورآه النبي ليلة الإسراء آدم جسيماً سبط الشعر {cite:sahih-al-bukhari 3207}، وإليه رجع يسترد الفرائض حتى انتهت إلى خمس {cite:sahih-al-bukhari 3207}."
  en: "The prophet of Banu Israel: the fleeing-stone vindication {cite:sahih-al-bukhari 278}, the al-Khidr journey at length {cite:sahih-al-bukhari 3401}, and his Isra meetings with the Prophet {cite:sahih-al-bukhari 3207}."
