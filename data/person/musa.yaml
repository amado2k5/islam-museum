summary:
  ar: "موسى نبي بني إسرائيل، ويعرض له الإسلام لقب كليم الله. تصفه دائرة المعارف الإسلامية في القرآن بأنه سابق لمحمد ومثال له، وتلخص قصته من طفولته وفراره إلى مدين ومهمته عند فرعون والمعجزات والألواح وتيه بني إسرائيل. وتقارن الرواية القرآنية بالتوراتية والهاغادية، وتذكر ما أضافته كتب قصص الأنبياء كالثعلبي من أساطير حول عصاه. وعند البخاري خبر الحجر والخضر والإسراء {cite:sahih-al-bukhari 278} {cite:sahih-al-bukhari 3401} {cite:sahih-al-bukhari 3207}."
  en: "Musa is a prophet of the Children of Israel, whom Islamic tradition calls Kalim Allah. The Encyclopaedia of Islam describes him in the Qur'an as forerunner and model for Muhammad and summarises his story from infancy and flight to Madyan through his mission to Pharaoh, the miracles, the tablets and the wandering of Israel. It compares the Qur'anic account with the Biblical and Haggadic ones and records the legends that later prophet-histories such as al-Tha'labi's added about his rod. Al-Bukhari relates the stone, al-Khidr and the Night Journey reports {cite:sahih-al-bukhari 278} {cite:sahih-al-bukhari 3401} {cite:sahih-al-bukhari 3207}."
  ur: "موسیٰ بنی اسرائیل کے نبی ہیں جنہیں اسلامی روایت کلیم اللہ کہتی ہے۔ انسائیکلوپیڈیا آف اسلام انہیں قرآن میں محمد کا پیش رو اور نمونہ بتاتا ہے اور ان کے قصے کا خلاصہ دیتا ہے، شیرخوارگی اور مدین کی طرف فرار سے فرعون کے پاس مشن، معجزات، تختیوں اور بنی اسرائیل کے بھٹکنے تک۔ وہ قرآنی بیان کا موازنہ بائبلی اور ہگادی بیانات سے کرتا ہے اور ثعلبی جیسی انبیاء کی تاریخوں نے ان کے عصا کے بارے میں جو داستانیں بڑھائیں انہیں درج کرتا ہے۔ بخاری میں پتھر، خضر اور معراج کی روایات ہیں {cite:sahih-al-bukhari 278} {cite:sahih-al-bukhari 3401} {cite:sahih-al-bukhari 3207}."
