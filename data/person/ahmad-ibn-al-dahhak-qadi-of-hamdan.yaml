id: person/ahmad-ibn-al-dahhak-qadi-of-hamdan
class: person
label:
  ar: أحمد بن الضحاك قاضي همدان
  en: Ahmad ibn al-Dahhak, qadi of Hamdan
  fr: "Ahmad ibn al-Dahhak, cadi de Hamdan"
  ur: احمد بن ضحاک، قاضی ہمدان
  es: "Ahmad ibn al-Dahhak, qadi of Hamdan"
summary:
  ar: قاضي همدان وفقيهها وعالمها بحسب الكتاب، ممن بايعوا الهادي، وروى مع مروّع الصائدي خبر دعائه على أبي محجن وجفتم.
  en: Qadi, jurist and scholar of Hamdan according to the book, one of those who pledged to al-Hadi, who with Murawwi al-Sa'idi told of his prayers against Abu Mihjan and Jaftam.
  fr: "Cadi, juriste et savant de Hamdan selon le livre, parmi ceux qui prêtèrent serment à al-Hadi et qui, avec Murawwi al-Sa'idi, racontèrent ses prières contre Abu Mihjan et Jaftam."
  ur: کتاب کے مطابق ہمدان کے قاضی، فقیہ اور عالم، ہادی سے بیعت کرنے والوں میں سے، جنہوں نے مروّع صائدی کے ساتھ ابو محجن اور جفتم کے خلاف ان کی دعاؤں کی خبر دی۔
  es: "Qadi, jurista y erudito de Hamdan según el libro, uno de los que juraron lealtad a al-Hadi, quien junto con Murawwi al-Sa'idi habló de sus oraciones contra Abu Mihjan y Jaftam."
  tr: "Kitaba göre, Hamadan'ın kadısı, hukukçusu ve alimi, Hadi'ye biat edenlerden biriydi ve Merve el-Sa'idi ile birlikte Ebu Mihcan ve Yaftam'a karşı yaptığı duanın hikayesini anlattı."
  id: "Menurut kitab tersebut, hakim Hamadan, seorang ahli hukum dan ulama, adalah salah satu orang yang berbaiat kepada al-Hadi, dan ia meriwayatkan bersama Marwa’ al-Sa’idi kisah permohonannya melawan Abu Mihjan dan Jaftam."
