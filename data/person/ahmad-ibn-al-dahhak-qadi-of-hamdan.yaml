  en: Ahmad ibn al-Dahhak, qadi of Hamdan
  ur: احمد بن ضحاک، قاضی ہمدان
summary:
  ar: قاضي همدان وفقيهها وعالمها بحسب الكتاب، ممن بايعوا الهادي، وروى مع مروّع الصائدي خبر دعائه على أبي محجن وجفتم.
  en: Qadi, jurist and scholar of Hamdan according to the book, one of those who pledged to al-Hadi, who with Murawwi al-Sa'idi told of his prayers against Abu Mihjan and Jaftam.
  ur: کتاب کے مطابق ہمدان کے قاضی، فقیہ اور عالم، ہادی سے بیعت کرنے والوں میں سے، جنہوں نے مروّع صائدی کے ساتھ ابو محجن اور جفتم کے خلاف ان کی دعاؤں کی خبر دی۔
