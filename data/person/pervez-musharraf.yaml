summary:
  ar: "جنرال وسياسي باكستاني حكم باكستان من انقلاب 1999 حتى استقالته سنة 2008، رئيسًا للأركان ثم رئيسًا تنفيذيًا ثم رئيسًا للجمهورية. حالف الولايات المتحدة بعد هجمات 11 سبتمبر، وحرّر الإعلام ووسّع الحكم المحلي، وانتهى حكمه بأزمة القضاء وحالة الطوارئ سنة 2007، وتوفي في دبي سنة 2023."
  en: "Pakistani general and politician who ruled Pakistan from the 1999 coup until his resignation in 2008, as chief of army staff, then chief executive, then president. He allied Pakistan with the United States after the September 11 attacks, liberalised the media and expanded local government; his rule ended amid the 2007 judiciary crisis and state of emergency. He died in Dubai in 2023."
  ur: "پاکستانی جنرل اور سیاست دان جنہوں نے 1999ء کی بغاوت سے 2008ء میں استعفے تک پاکستان پر حکمرانی کی: چیف آف آرمی اسٹاف، پھر چیف ایگزیکٹو، پھر صدر۔ انہوں نے 11 ستمبر کے حملوں کے بعد پاکستان کو امریکہ کا اتحادی بنایا، میڈیا کو آزاد کیا اور بلدیاتی نظام پھیلایا؛ ان کا دور 2007ء کی عدلیہ بحران اور ایمرجنسی پر ختم ہوا۔ 2023ء میں دبئی میں وفات پائی۔"
