summary:
  ar: "جنرال وسياسي باكستاني حكم باكستان من انقلاب 1999 حتى استقالته سنة 2008، رئيسًا للأركان ثم رئيسًا تنفيذيًا ثم رئيسًا للجمهورية. حالف الولايات المتحدة بعد هجمات 11 سبتمبر، وحرّر الإعلام ووسّع الحكم المحلي، وانتهى حكمه بأزمة القضاء وحالة الطوارئ سنة 2007، وتوفي في دبي سنة 2023."
  en: "Pakistani general and politician who ruled Pakistan from the 1999 coup until his resignation in 2008, as chief of army staff, then chief executive, then president. He allied Pakistan with the United States after the September 11 attacks, liberalised the media and expanded local government; his rule ended amid the 2007 judiciary crisis and state of emergency. He died in Dubai in 2023."
  ur: "پاکستانی جنرل اور سیاست دان جنہوں نے 1999ء کی بغاوت سے 2008ء میں استعفے تک پاکستان پر حکمرانی کی: چیف آف آرمی اسٹاف، پھر چیف ایگزیکٹو، پھر صدر۔ انہوں نے 11 ستمبر کے حملوں کے بعد پاکستان کو امریکہ کا اتحادی بنایا، میڈیا کو آزاد کیا اور بلدیاتی نظام پھیلایا؛ ان کا دور 2007ء کی عدلیہ بحران اور ایمرجنسی پر ختم ہوا۔ 2023ء میں دبئی میں وفات پائی۔"
  es: "General y político pakistaní que gobernó Pakistán desde el golpe de Estado de 1999 hasta su dimisión en 2008, primero como jefe del Estado Mayor del Ejército, luego como jefe del Ejecutivo y finalmente como presidente. Tras los atentados del 11 de septiembre, forjó una alianza entre Pakistán y Estados Unidos, liberalizó los medios de comunicación y amplió el gobierno local. Su mandato finalizó en medio de la crisis judicial y el estado de emergencia de 2007. Falleció en Dubái en 2023."
  fr: "Général et homme politique pakistanais, il a dirigé le Pakistan du coup d'État de 1999 jusqu'à sa démission en 2008, occupant successivement les fonctions de chef d'état-major des armées, de chef de l'exécutif et de président. Après les attentats du 11 septembre, il a allié le Pakistan aux États-Unis, libéralisé les médias et renforcé l'autonomie locale. Son mandat s'est achevé dans un contexte de crise judiciaire et d'état d'urgence en 2007. Il est décédé à Dubaï en 2023."
  tr: "1999 darbesinden 2008'de istifa edene kadar Pakistan'ı yöneten bir Pakistanlı general ve siyasetçi; önce Genelkurmay Başkanı, ardından Genelkurmay Başkanı ve nihayetinde Cumhurbaşkanı olarak görev yaptı. 11 Eylül saldırılarından sonra Amerika Birleşik Devletleri ile ittifak kurdu, medyayı serbestleştirdi, yerel yönetimi genişletti ve 2007'de yargı krizi ile olağanüstü hal ilan ederek yönetimini sona erdirdi ve 2023'te Dubai'de hayatını kaybetti."
  id: "Seorang jenderal dan politisi Pakistan yang memerintah Pakistan dari kudeta 1999 hingga pengunduran dirinya pada 2008, sebagai Kepala Staf, kemudian Kepala Staf, dan akhirnya Presiden Republik. Ia bersekutu dengan Amerika Serikat setelah serangan 11 September, meliberalisasi media, memperluas pemerintahan lokal, dan mengakhiri pemerintahannya dengan krisis yudisial serta keadaan darurat pada 2007, dan ia meninggal di Dubai pada 2023."
