summary:
  en: "Son of Qusayy who had already risen to leadership in his father’s lifetime; after his death his sons contested the offices with the sons of Abd al-Dar, and the siqaya and rifada fell to his line — inherited by Hashim, then al-Muttalib, then Abd al-Muttalib."
  ar: "ابن قصي، وقد شرف وساد في حياة أبيه؛ نازع بنوه بني عمهم عبد الدار في المناصب بعد موته، فصارت السقاية والرفادة إلى بنيه، فولاها هاشم ثم المطلب ثم عبد المطلب."
