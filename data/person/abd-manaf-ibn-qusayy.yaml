summary:
  en: "Son of Qusayy who had already risen to leadership in his father’s lifetime; after his death his sons contested the offices with the sons of Abd al-Dar, and the siqaya and rifada fell to his line — inherited by Hashim, then al-Muttalib, then Abd al-Muttalib."
  fr: "Fils de Qusayy qui s'était déjà élevé à la direction du vivant de son père ; après sa mort, ses fils disputèrent les charges aux fils d'Abd al-Dar, et la siqaya et la rifada échurent à sa lignée — héritées par Hashim, puis al-Muttalib, puis Abd al-Muttalib."
  ar: "ابن قصي، وقد شرف وساد في حياة أبيه؛ نازع بنوه بني عمهم عبد الدار في المناصب بعد موته، فصارت السقاية والرفادة إلى بنيه، فولاها هاشم ثم المطلب ثم عبد المطلب."
  es: "Hijo de Qusayy, quien ya había alcanzado el liderazgo en vida de su padre; tras su muerte, sus hijos disputaron los cargos con los hijos de Abd al-Dar, y la siqaya y la rifada recayeron en su linaje, heredadas por Hashim, luego por al-Muttalib y después por Abd al-Muttalib."
  ur: "قصی کا بیٹا جو اپنے والد کی زندگی میں ہی قیادت پر فائز ہو چکا تھا۔ اس کی موت کے بعد اس کے بیٹوں نے عبد الدار کے بیٹوں کے ساتھ دفتروں کا مقابلہ کیا، اور سقایا اور رفدہ اس کی صف میں آ گئے - وراثت میں ہاشم، پھر المطلب، پھر عبد المطلب۔"
  tr: "Babası hayattayken saygı ve hürmet gören İbn Kusay, ölümünden sonra oğullarını kuzenleri Abdülder ile makamlar konusunda çekişmeye soktu. Böylece su ve yiyecek sağlama sorumluluğu oğullarına geçti ve önce Haşim, sonra el-Muttalib, ardından da AbdülMuttalib bu göreve atandı."
  id: "Ibn Qusay, yang dihormati dan disegani selama masa hidup ayahnya, mendapati putra-putranya berselisih dengan sepupu mereka, Abd al-Dar, mengenai posisi setelah kematiannya. Maka tanggung jawab menyediakan air dan makanan jatuh kepada putra-putranya, dan Hashim diangkat untuk tugas itu, kemudian al-Muttalib, lalu Abd al-Muttalib."
