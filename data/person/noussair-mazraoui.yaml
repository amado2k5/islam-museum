summary:
  ar: "لاعب كرة قدم مغربي محترف (وُلد سنة 1997 في لايدردورب بهولندا لأبوين مغربيين من تطوان)، مدافع تدرّج في أكاديمية أياكس ولعب لبايرن ميونخ ثم مانشستر يونايتد منذ 2024، وخاض أكثر من خمسين مباراة دولية مع المغرب، وشارك في نصف نهائي كأس العالم 2022 وفاز بكأس الأمم الأفريقية 2025."
  en: "Moroccan professional footballer (born 1997 in Leiderdorp, Netherlands, to Moroccan parents from Tétouan). A defender who came through Ajax's academy, played for Bayern Munich and joined Manchester United in 2024, he has won over fifty caps for Morocco, reached the 2022 World Cup semi-finals with them and won the 2025 Africa Cup of Nations."
  ur: "مراکشی پیشہ ور فٹبالر (پیدائش 1997، لائیدرڈورپ، نیدرلینڈز، تطوان سے تعلق رکھنے والے مراکشی والدین کے ہاں)۔ دفاعی کھلاڑی جو آجیکس کی اکیڈمی سے آئے، بائرن میونخ کے لیے کھیلے اور 2024 میں مانچسٹر یونائیٹڈ میں شامل ہوئے؛ انہوں نے مراکش کے لیے پچاس سے زائد بین الاقوامی میچ کھیلے، 2022 ورلڈ کپ کے سیمی فائنل تک پہنچے اور 2025 افریقہ کپ آف نیشنز جیتا۔"
