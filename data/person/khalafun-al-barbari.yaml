id: person/khalafun-al-barbari
class: person
label: { ar: "خلفون البربري" }
summary:
  ar: "عند البلاذري: بربري يُقال إنه مولى لربيعة غزا بارة في الأرض الكبيرة ففتحها في أول خلافة المتوكل بعد أن عجز عنها جبلة مولى الأغلب."
  en: "In al-Baladhuri: a Berber said to be Rabi'a's mawla; he raided Barah in the Great Land and opened it at the start of al-Mutawakkil's caliphate after Jabala, al-Aghlab's mawla, had failed against it."
  es: "En al-Baladhuri: un bereber que se dice que fue el mawla de Rabi'a; saqueó Barah en la Gran Tierra y la abrió al comienzo del califato de al-Mutawakkil después de que Jabala, el mawla de al-Aghlab, hubiera fracasado contra ella."
  fr: "Dans al-Baladhuri: un Berbère dit être le mawla de Rabi'a; il a pillé Barah dans le Grand Pays et l'a ouvert au début du califat d'al-Mutawakkil après que Jabala, le mawla d'al-Aghlab, ait échoué contre elle."
  ur: "البلادوری میں ہے: ایک بربر کو ربیعہ کا مولا کہا جاتا ہے۔ اس نے عظیم سرزمین میں برہ پر چھاپہ مارا اور اسے المتوکل کی خلافت کے آغاز میں جبلہ، الاغلب کا مولا، اس کے خلاف ناکام ہونے کے بعد کھول دیا۔"
  tr: "al-Baladhuri'ye göre: Berbari'nin, Bara'ya büyük topraklarda sefer düzenleyip el-Mutawakkil'in halifeliğinin başında, Aglab'ın özgür adamı Ciblah bunu başaramadığı için burayı fethetmiş olan Rabi'ah'ın özgür adamı olduğu söylenir."
  id: "Menurut al-Baladhuri: Berbari dikatakan sebagai mantan Rabi'ah, yang berkampanye di Bara di tanah luas dan menaklukkannya pada awal kekhalifahan al-Mutawakkil setelah Jiblah, mantan Aghlab, tidak mampu melakukannya."
