summary:
  ar: "جلال الدين محمد البلخي الرومي، المعروف بمولانا: شاعر فارسي ومؤسس الطريقة المولوية، وُلد ببلخ سنة ٦٠٤هـ/١٢٠٧م وهاجرت أسرته مع أبيه بهاء الدين ولد غرباً حتى استقرت بقونية. تقول دائرة المعارف الإسلامية إن لقاءه شمس الدين التبريزي سنة ٦٤٢هـ/١٢٤٤م غيّر حياته وجعله شاعراً، وإن شمساً قُتل سنة ٦٤٥هـ/١٢٤٧م، وإن حسام الدين جلبي كان ملهم «المثنوي»؛ وتوفي بقونية سنة ٦٧٢هـ/١٢٧٣م {cite:britannica-rumi} {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  en: "Jalal al-Din Muhammad al-Balkhi al-Rumi, known as Mawlana: a Persian poet and founder of the Mawlawiyya order, born at Balkh in 604/1207, whose family moved west with his father Baha al-Din Walad until settling at Konya. The Encyclopaedia of Islam says his meeting with Shams al-Din of Tabriz in 642/1244 changed his life and made him a poet, that Shams was killed in 645/1247, and that Husam al-Din Chalabi inspired the Mathnavi; he died at Konya in 672/1273 {cite:britannica-rumi} {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
  ur: "جلال الدین محمد بلخی رومی، معروف بہ مولانا: فارسی شاعر اور مولویہ سلسلے کے بانی، 604ھ/1207ء میں بلخ میں پیدا ہوئے اور ان کا خاندان والد بہاء الدین ولد کے ساتھ مغرب کی طرف ہجرت کر کے قونیہ میں بسا۔ دائرۃ المعارف اسلامیہ کے مطابق 642ھ/1244ء میں شمس الدین تبریزی سے ملاقات نے ان کی زندگی بدل دی اور انہیں شاعر بنایا، شمس 645ھ/1247ء میں قتل ہوئے، اور حسام الدین چلبی مثنوی کے محرک تھے؛ انہوں نے 672ھ/1273ء میں قونیہ میں وفات پائی {cite:britannica-rumi} {cite:encyclopaedia-of-islam-2 vol. 2 p. 419}."
