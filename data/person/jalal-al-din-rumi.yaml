summary:
  ar: "جلال الدين محمد البلخي الرومي، المعروف بمولانا: أعظم شعراء التصوف بالفارسية وصاحب «المثنوي المعنوي»؛ ولد ببلخ سنة ٦٠٤هـ/١٢٠٧م ورحل مع أبيه بهاء الدين ولد حتى استقر بقونية، فلقي فيها شمس الدين التبريزي سنة ٦٤٢هـ/١٢٤٤م فانفتح له عالم المحبة الإلهية، وتوفي بها سنة ٦٧٢هـ/١٢٧٣م فأخذ أصحابه الطريقة المولوية عنه {cite:britannica-rumi}."
  en: "Jalal al-Din Muhammad al-Balkhi al-Rumi, known by the honorific Mawlana: the greatest Sufi mystic and poet in the Persian language and author of the Mathnavi; born at Balkh in 604/1207, he travelled with his father Baha al-Din Walad until settling at Konya, met Shams al-Din of Tabriz there in 642/1244 — the turning point of his life — and died at Konya in 672/1273, after which his disciples formed the Mawlawiyya order {cite:britannica-rumi}."
  ur: "جلال الدین محمد بلخی رومی، معروف بہ لقب مولانا: فارسی زبان کے عظیم ترین صوفی شاعر اور مثنوی معنوی کے مصنف؛ 604ھ/1207ء میں بلخ میں پیدا ہوئے، اپنے والد بہاء الدین ولد کے ساتھ سفر کرتے ہوئے قونیہ میں بسے، وہاں 642ھ/1244ء میں شمس الدین تبریزی سے ملاقات ان کی زندگی کا فیصلہ کن موڑ بنی، اور 672ھ/1273ء میں قونیہ میں وفات پائی؛ ان کے بعد مریدوں نے مولویہ سلسلہ قائم کیا۔"
