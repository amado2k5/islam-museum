id: person/wajjaj-ibn-zallu
class: person
label: { ar: "وجاج بن زلو اللمطي" }
summary:
  ar: "الفقيه بسجلماسة من الآخذين عن أبي عمران الفاسي؛ كتب إليه أبو عمران وعهد إليه أن يلتمس لوفد كدالة من يثق بدينه وفقهه ويروض نفسه على مسغبة أرضهم في معاشه فبعث معهم عبد الله بن ياسين الجزولي {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  en: "Wajjaj ibn Zallu al-Lamti, the Sijilmasa jurist who sent Abdallah b. Yasin with the Guddala {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  es: "Wajjaj ibn Zallu al-Lamti, el jurista de Sijilmasa que envió a Abdallah b. Yasin con el Guddala {citar:tarikh-ibn-khaldun-ibar p. 1645}."
  fr: "Wajjaj ibn Zallu al-Lamti, le juriste Sijilmasa qui envoya Abdallah b. Yasin avec le Guddala {cite:tarikh-ibn-khaldun-ibar p. 1645}."
  ur: "وجاج ابن ظلو اللمطی، سجلما فقیہ جس نے عبداللہ بن عباس کو بھیجا تھا۔ یاسین مع گڈالہ {حوالہ: تاریخ ابن خلدون ابر ص۔ 1645}۔"
  tr: "Sijilmasa'daki hukukçu, Ebu İmran el-Fasi'den alanlardan biri olarak, ona yazdı ve dinine ve fıkıhına güvenen, geçimini sağlamak için toprakta kendini geçindirecek birini bulmasını emretti. Abdullah ibn Yasin el-Cazuli'yi de onlarla birlikte gönderdi {atıf:Tarikh-ibn-khaldun-ibar s. 1645}."
  id: "Ahli hukum di Sijilmasa, salah satu yang mengambil dari Abu Imran al-Fasi, menulis kepadanya dan mempercayakan kepadanya untuk mencari delegasi seseorang yang mempercayai agama dan yurisprudensinya serta yang akan menghidupi dirinya sendiri di tanah itu untuk penghidupannya. Ia mengirim Abdullah ibn Yasin al-Jazuli bersama mereka {cite:Tarikh-ibn-khaldun-ibar hlm. 1645}."
