  ar: "عالم دين أوزبكستاني، وُلد سنة 1968 في أساكا بمنطقة أنديجان، وهو المفتي العام لأوزبكستان ورئيس إدارة مسلمي أوزبكستان منذ 19 أكتوبر 2021، وتهيمن مواعظه ودروسه على قناة الإدارة الرسمية على يوتيوب «مسلم أوز»."
