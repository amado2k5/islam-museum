summary:
  ar: "داعية باكستاني، وُلد سنة 1929 في قرية بيلاوال بمنطقة راولبندي. درس الحديث على مشايخ من مدرسة ديوبند، وخدم إمامًا في مساجد عدة، والتحق بجماعة التبليغ فصار نائبًا لأميرها في باكستان ثم أميرها الرابع في نوفمبر 2018 خلفًا للحاج عبد الوهاب؛ يشرف على مركز رايويند واجتماعاتها السنوية الكبرى."
  en: "Pakistani preacher, born in 1929 in the village of Bilawal near Rawalpindi. He studied hadith under teachers of the Deobandi line, served as mosque imam in several places, and rose within the Tablighi Jamaat to become its fourth amir in Pakistan in November 2018, succeeding Haji Abdul-Wahhab; he presides over the Raiwind centre and its mass annual congregations."
  ur: "پاکستانی مبلغ، 1929 میں راولپنڈی کے قریب بیلاوال گاؤں میں پیدا ہوئے۔ انھوں نے دیوبندی نسب کے اساتذہ سے حدیث پڑھی، کئی مساجد میں امام رہے، اور تبلیغی جماعت میں ترقی کر کے نومبر 2018 میں حاجی عبدالوہاب کے جانشین ہو کر پاکستان میں اس کے چوتھے امیر بنے؛ وہ رائیونڈ مرکز اور اس کے بڑے سالانہ اجتماعات کی نگرانی کرتے ہیں۔"
  es: "Predicador pakistaní, nacido en 1929 en la aldea de Bilawal, cerca de Rawalpindi. Estudió hadices con maestros de la tradición Deobandi, fue imán de mezquita en varios lugares y ascendió dentro de la Tablighi Jamaat hasta convertirse en su cuarto emir en Pakistán en noviembre de 2018, sucediendo a Haji Abdul-Wahhab; preside el centro de Raiwind y sus congregaciones anuales multitudinarias."
  fr: "Prédicateur pakistanais, né en 1929 dans le village de Bilawal, près de Rawalpindi. Il a étudié le hadith auprès de maîtres de l'école Deobandi, a été imam de mosquée dans plusieurs endroits et a gravi les échelons au sein de la Tablighi Jamaat pour devenir son quatrième émir au Pakistan en novembre 2018, succédant à Haji Abdul-Wahhab; il préside le centre de Raiwind et ses grands rassemblements annuels."
  tr: "1929 yılında Rawalpindi bölgesindeki Bilawal köyünde doğan Pakistanlı bir vaizdir. Deobandi okulundan şeyhlerin yanında hadis eğitimi almış, çeşitli camide imam olarak hizmet etmiş, Cemaat-e-Tablighi'ye katılarak Pakistan'da vali yardımcısı olmuş ve ardından Kasım 2018'de Hac Abdul Wahab'ın yerine dördüncü emiri olmuştur; Raiwind merkezini ve önemli yıllık toplantılarını denetlemektedir."
  id: "Seorang pengkhotbah Pakistan, lahir pada tahun 1929 di desa Bilawal di wilayah Rawalpindi. Ia belajar hadits di bawah bimbingan para sheikh dari aliran Deobandi, pernah menjadi imam di beberapa masjid, bergabung dengan Jamaat-e-Tablighi, menjadi wakil gubernur di Pakistan, dan kemudian emir keempat pada November 2018, menggantikan Haji Abdul Wahab; ia mengawasi pusat Raiwind dan pertemuan tahunan utamanya."
