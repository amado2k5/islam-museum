summary:
  ar: قرشي عامري، أخو سهيل بن عمرو؛ ذكره موسى بن عقبة وابن إسحاق في مهاجرة الحبشة، وتزوج النبي زوجته سودة بنت زمعة بعد موته؛ واختُلف هل مات بمكة مسلماً أم تنصّر بالحبشة.
  en: A Qurashi of Amir ibn Luayy and brother of Suhayl ibn Amr; Musa ibn Uqba and Ibn Ishaq list him among the emigrants to Abyssinia, and the Prophet married his widow Sawda bint Zam'a. Where and in what faith he died is disputed.
