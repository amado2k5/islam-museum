summary:
  ar: "الحسين بن القاسم بن علي العياني، المهدي لدين الله، من أئمة الزيدية باليمن، قام بالإمامة بعد أبيه وأقام بصنعاء، وقتل في البون شمالي صنعاء سنة 404 هـ، من كتبه «التحدي للعلماء والجهال»."
  en: "Al-Husayn ibn al-Qasim ibn Ali al-Iyani, al-Mahdi li-Din Allah, one of the Zaydi imams of Yemen, who took up the imamate after his father and lived at Sanaa; he was killed at al-Bun, north of Sanaa, in 404 AH. His books include 'al-Tahaddi lil-Ulama wa al-Juhhal'."
