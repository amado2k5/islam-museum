summary:
  ar: "العلامة المتكلم، نسبة إلى خسروشاه قرية بمرو؛ رحل فأخذ الكلام عن الإمام فخر الدين الرازي وبرع فيه وسمع من المؤيد الطوسي، وتقدم في علم الأصول والعقليات وأقام بالشام بالكرك مدة عند الناصر وتفنن في علوم متعددة منها الفلسفة ودرّس وناظر، واختصر المهذب في الفقه والشفاء لابن سينا وله إشكالات وإيرادات جيدة؛ روى عنه الدمياطي وأخذ عنه الخطيب زين الدين بن المرحل {cite:shadharat-dhahab p. 263-264}."
  en: "The Shafi'i mutakallim of Khasruwshah near Marw (b. 580, d. 12 Shawwal 652, Qasyun) — took kalam from Fakhr al-Din al-Razi himself, sojourned at Karak under al-Nasir, abridged al-Muhadhdhab in fiqh and Ibn Sina's Shifa' {cite:shadharat-dhahab p. 263-264}."
  es: "Los mutakallim Shafi'i de Khasruwshah cerca de Marw (n. 580, m. 12 Shawwal 652, Qasyun) - tomaron kalam del propio Fakhr al-Din al-Razi, residió en Karak bajo al-Nasir, compendió al-Muhadhdhab en fiqh y el Shifa' de Ibn Sina {cita: shadharat-dhahab p. 263-264}."
  fr: "Les mutakallim Shafi'i de Khasruwshah près de Marw (né en 580, mort le 12 Shawwal 652, Qasyun) — prirent le kalam de Fakhr al-Din al-Razi lui-même, séjournèrent à Karak sous al-Nasir, abrégé al-Muhadhdhab en fiqh et le Shifa d'Ibn Sina' {cite: shadharat-dhahab p. 263-264}."
  ur: "مروہ کے قریب خسروشہ کے شافعی متکلم ⁦(متوفی 580، وفات 12 شوال 652، قصیون)⁩ - خود فخرالدین الرازی سے کلام لیا، الناصر کے ماتحت کرک میں مقیم رہے، فقہ میں المحدثاب کو مختصر کیا اور ابنِ صاحِبِصاحب۔ 263-264}۔"
  tr: "Merw'deki Khosrowshah köyünden adını alan alim Al-Mutakallim; İmam Fakhr al-Din al-Razi'nin yanında seyahat etti ve eğitim aldı, bu alanda başarılı oldu ve al-Mu'eyyad al-Tusi'den dinledi. İlkeler ve akıl bilimlerinde ilerledi, bir süre Şam'daki El-Karak'ta el-Nasir'in yanında kaldı, felsefe dahil çeşitli bilimlerde üstün başarı gösterdi ve çalıştı, münazara yaptı. İbn Sina'nın fıkıh ve şifa alanında al-Muhadhdhab adlı eserini kısalttı; bu alanın önemli meseleleri ve gelirleri vardır; el-Dimyati ondan ve vaiz Zeyn-addin bin el-Murahal'dan rivayet etti {atıf: shadharat-dhahab, s. 263-264}."
  id: "Ulama Al-Mutakallim, dinamai menurut Khosrowshah, sebuah desa di Marw; ia bepergian dan belajar di bawah Imam Fakhr al-Din al-Razi, unggul di bidang itu, dan mendengar dari al-Mu'ayyad al-Tusi. Ia maju dalam ilmu prinsip dan rasionalitas, tinggal di Al-Karak di Damaskus untuk sementara waktu di bawah bimbingan al-Nasir, unggul dalam berbagai ilmu termasuk filsafat, serta belajar dan berdebat. Ia merangkum al-Muhadhdhab dalam bidang hukum dan penyembuhan oleh Ibn Sina, yang memiliki masalah dan pendapatan signifikan; al-Dimyati menceritakan dari dirinya dan pengkhotbah Zain al-Din ibn al-Murahal belajar di bawah bimbingan beliau {cite:shadharat-dhahab, hlm. 263-264}."
