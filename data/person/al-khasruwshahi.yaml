summary:
  ar: "العلامة المتكلم، نسبة إلى خسروشاه قرية بمرو؛ رحل فأخذ الكلام عن الإمام فخر الدين الرازي وبرع فيه وسمع من المؤيد الطوسي، وتقدم في علم الأصول والعقليات وأقام بالشام بالكرك مدة عند الناصر وتفنن في علوم متعددة منها الفلسفة ودرّس وناظر، واختصر المهذب في الفقه والشفاء لابن سينا وله إشكالات وإيرادات جيدة؛ روى عنه الدمياطي وأخذ عنه الخطيب زين الدين بن المرحل {cite:shadharat-dhahab p. 263-264}."
  en: "The Shafi'i mutakallim of Khasruwshah near Marw (b. 580, d. 12 Shawwal 652, Qasyun) — took kalam from Fakhr al-Din al-Razi himself, sojourned at Karak under al-Nasir, abridged al-Muhadhdhab in fiqh and Ibn Sina's Shifa' {cite:shadharat-dhahab p. 263-264}."
