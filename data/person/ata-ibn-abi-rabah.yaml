summary:
  ar: "من علماء مكة وفقهائها، ويذكر الكتاب أنه دخل على عبد الملك بن مروان في موسم حجه فوعظه بأن يتقي الله في أبناء المهاجرين والأنصار وأهل الثغور وفي رعيته {cite:salabi-umayyad-state-2020 p.36}. وقد عدّه الكتاب أفقه أهل مكة في الفتوى، وكان المسجد الحرام مقامه عشرين سنة {cite:salabi-umayyad-state-2020 p.36}. ويذكر الكتاب أنه انتهت إليه فتوى أهل مكة، وأنه كان يُنادى في الحج في عهد بني أمية: لا يفتي الناس إلا عطاء. {cite:salabi-umayyad-state-2020 p.281}"
