summary:
  ar: "الإمام سعود بن عبد العزيز بن محمد آل سعود (1748 – 1814)، الملقّب بعد وفاته بسعود الكبير، ثالث أئمة الدولة السعودية الأولى وحاكمها من سنة 1803 حتى وفاته. كان القائد العسكري للدولة في حياة أبيه، فضمّ الأحساء وقاد نهب كربلاء سنة 1802، ثم امتدت الدولة في عهده إلى مكة والمدينة والبحرين وعُمان، وتوفي بالدرعية بحمّى سنة 1814 فخلفه ابنه عبد الله."
  en: "Imam Saud ibn Abdulaziz ibn Muhammad Al Saud (1748–1814), called Saud al-Kabir, Saud the Great, after his death, was the third imam of the first Saudi state, ruling from 1803 until his death. He had been the state's chief military commander in his father's lifetime, taking al-Hasa and leading the sack of Karbala in 1802; under his own rule the state took Mecca and Medina and reached Bahrain and Oman. He died of a fever at Diriyah in 1814 and was succeeded by his son Abdullah."
  ur: "امام سعود بن عبد العزیز بن محمد آل سعود (1748ء – 1814ء)، جنھیں وفات کے بعد سعود الکبیر کہا گیا، پہلی سعودی ریاست کے تیسرے امام تھے اور 1803ء سے وفات تک حکمران رہے۔ والد کی زندگی میں ریاست کے سپہ سالار تھے؛ احساء فتح کیا اور 1802ء میں کربلا پر حملے کی قیادت کی۔ ان کے دور میں ریاست مکہ، مدینہ، بحرین اور عمان تک پھیلی۔ 1814ء میں درعیہ میں بخار سے وفات پائی اور بیٹے عبد اللہ جانشین ہوئے۔"

