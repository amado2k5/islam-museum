summary:
  ar: "الإمام سعود بن عبد العزيز بن محمد آل سعود (1748 – 1814)، الملقّب بعد وفاته بسعود الكبير، ثالث أئمة الدولة السعودية الأولى وحاكمها من سنة 1803 حتى وفاته. كان القائد العسكري للدولة في حياة أبيه، فضمّ الأحساء وقاد نهب كربلاء سنة 1802، ثم امتدت الدولة في عهده إلى مكة والمدينة والبحرين وعُمان، وتوفي بالدرعية بحمّى سنة 1814 فخلفه ابنه عبد الله."
  en: "Imam Saud ibn Abdulaziz ibn Muhammad Al Saud (1748–1814), called Saud al-Kabir, Saud the Great, after his death, was the third imam of the first Saudi state, ruling from 1803 until his death. He had been the state's chief military commander in his father's lifetime, taking al-Hasa and leading the sack of Karbala in 1802; under his own rule the state took Mecca and Medina and reached Bahrain and Oman. He died of a fever at Diriyah in 1814 and was succeeded by his son Abdullah."
  ur: "امام سعود بن عبد العزیز بن محمد آل سعود ⁦(1748ء – 1814ء)⁩، جنھیں وفات کے بعد سعود الکبیر کہا گیا، پہلی سعودی ریاست کے تیسرے امام تھے اور 1803ء سے وفات تک حکمران رہے۔ والد کی زندگی میں ریاست کے سپہ سالار تھے؛ احساء فتح کیا اور 1802ء میں کربلا پر حملے کی قیادت کی۔ ان کے دور میں ریاست مکہ، مدینہ، بحرین اور عمان تک پھیلی۔ 1814ء میں درعیہ میں بخار سے وفات پائی اور بیٹے عبد اللہ جانشین ہوئے۔"
  es: "El imán Saud ibn Abdulaziz ibn Muhammad Al Saud (1748-1814), conocido como Saud al-Kabir, Saud el Grande, tras su muerte, fue el tercer imán del primer estado saudí, gobernando desde 1803 hasta su fallecimiento. En vida de su padre, había sido el comandante militar en jefe del estado, tomando al-Hasa y liderando el saqueo de Karbala en 1802. Bajo su mandato, el estado conquistó La Meca y Medina, y llegó hasta Baréin y Omán. Falleció de fiebre en Diriyah en 1814 y fue sucedido por su hijo Abdullah."
  fr: "L'imam Saoud ben Abdelaziz ben Muhammad al-Saoud (1748-1814), dit Saoud al-Kabir ou Saoud le Grand après sa mort, fut le troisième imam du premier État saoudien, régnant de 1803 jusqu'à son décès. Du vivant de son père, il avait été le principal commandant militaire de l'État, s'emparant d'al-Hasa et menant le sac de Karbala en 1802; sous son règne, l'État conquit La Mecque et Médine et étendit son influence jusqu'à Bahreïn et Oman. Il mourut de la fièvre à Diriyah en 1814 et son fils Abdullah lui succéda."
  tr: "İmam Saud bin Abdulaziz bin Muhammad Al Saud (1748–1814), ölümünden dolayı Büyük Suud'un lakabını anan, Birinci Suudi Devleti'nin üçüncü imamı ve 1803'ten ölümüne kadar hükümdarıydı. Babası yaşarken devletin askeri komutanıydı; El-Ahsa'yı ilhak etti ve 1802'de Kerbel'in yağmalanmasına liderlik etti. Onun saltanatı sırasında devlet Mekke, Medine, Bahreyn ve Umman'a genişledi. 1814'te Diriye'de ateşli bir şekilde öldü, yerine oğlu Abdullah geçti."
  id: "Imam Saud bin Abdulaziz bin Muhammad Al Saud (1748–1814), dijuluki setelah kematiannya Saud yang Agung, adalah Imam ketiga Negara Saudi Pertama dan penguasanya dari tahun 1803 hingga kematiannya. Ia adalah komandan militer negara selama masa hidup ayahnya; ia menganeksasi Al-Ahsa dan memimpin penjarahan Karbala pada tahun 1802. Selama masa pemerintahannya, negara ini meluas ke Mekah, Madinah, Bahrain, dan Oman. Ia meninggal di Diriyah karena demam pada tahun 1814, digantikan oleh putranya Abdullah."

