  ar: "سلطان الثاني بن سيف بن سلطان بن سيف بن مالك اليعربي، خامس الأئمة اليعربيين الإباضية في عمان، بويع له بالرستاق بعد وفاة أبيه سنة 1123 هـ، وقاتل في البر والبحر واستولى على البحرين وهرمز، وبنى حصن الحزم وتوفي فيه سنة 1131 هـ."
  en: "Sultan (II) ibn Saif ibn Sultan ibn Saif ibn Malik al-Ya'rubi, the fifth Ya'rubid Ibadi imam of Oman; pledged to at al-Rustaq after his father's death in 1123 AH, he fought on land and sea, took Bahrain and Hormuz, built the fort of al-Hazm and died there in 1131 AH (1719)."
