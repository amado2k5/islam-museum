summary:
  ar: "با لبو، ابن أخي شيخو أحمدو مؤسس إمبراطورية ماسينا وقائدها العسكري البارز. رُشح لخلافة عمه عند وفاته سنة 1845 فاختار المجلس ابن المؤسس أحمدو سيكو (أحمدو الثاني)، ورُشح ثانية عند وفاة أحمدو الثاني سنة 1853 فدعم ابن أخيه أحمدو أحمدو (أحمدو الثالث) وصار قائد الجيش. وبعد سقوط حمد الله بيد عمر تال سنة 1862 وإعدام أحمدو الثالث، قاد بقايا قوات ماسينا، فجمع الفولاني والكنتة وطرد عمر تال من حمد الله سنة 1864 إلى جروف دوغون قرب باندياغارا حيث مات عمر، ثم قمع ابن أخيه تيدياني تال مقاومته، وتسرده قوائم الحكام إماما لماسينا في 1863-1867. لا يذكر أي مصدر مقروء تاريخ ولادته ولا وفاته."
  en: "Ba Lobbo, nephew of Seku Amadu, founder of the Massina Empire, and the empire's able general. Considered as his uncle's successor in 1845, he was passed over by the council for the founder's son Amadu Seku (Amadu II); considered again on Amadu II's death in 1853, he backed his nephew Amadu Amadu (Amadu III) and served as the army's leading general. After Hamdullahi fell to Umar Tall in 1862 and Amadu III was executed, Ba Lobbo led the remaining Massina forces, assembled Fulas and Kountas, and in 1864 drove Umar Tall from Hamdullahi into the Dogon cliffs near Bandiagara, where Umar died; Umar's nephew Tidiani Tall then suppressed his resistance. Ruler lists give him as Massina's almami in 1863–1867. No source read gives his birth or death date."
  ur: "با لوبو، سلطنتِ ماسینا کے بانی شیکھو احمدو کے بھتیجے اور سلطنت کے مایہ ناز سپہ سالار۔ 1845ء میں چچا کی جانشینی کے امیدوار تھے مگر مجلس نے بانی کے بیٹے احمدو سیکو (احمدو ثانی) کو چنا؛ 1853ء میں احمدو ثانی کی وفات پر دوبارہ امیدوار ہوئے تو اپنے بھتیجے احمدو احمدو (احمدو ثالث) کی حمایت کی اور فوج کے بڑے سالار بنے۔ 1862ء میں حمد اللہ عمر تال کے ہاتھوں گرنے اور احمدو ثالث کے قتل کے بعد انہوں نے ماسینا کی باقی فوج کی قیادت کی، فولانی اور کُنتہ کو جمع کر کے 1864ء میں عمر تال کو حمد اللہ سے نکال کر بانڈیاگارا کے قریب دوگون چٹانوں تک دھکیلا جہاں عمر کی موت واقع ہوئی؛ پھر عمر کے بھتیجے تیدیانی تال نے ان کی مزاحمت کچل دی۔ حکمرانوں کی فہرستیں انہیں 1863ء–1867ء میں ماسینا کا المامی بتاتی ہیں۔ کسی پڑھے گئے ماخذ میں ان کی ولادت یا وفات کی تاریخ نہیں ملتی۔"
