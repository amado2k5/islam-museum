summary:
  ar: عمة النبي وأم الزبير بن العوام وشقيقة حمزة؛ أسلمت وهاجرت مع ولدها، وتُروى عنها قصة قتلها يهودياً أطلّ على الحصن يوم الخندق، وعاشت إلى خلافة عمر.
  en: An aunt of the Prophet, mother of al-Zubayr ibn al-Awwam and full sister of Hamza; she embraced Islam and emigrated with her son, a report tells of her killing a man who spied on the women's fort at the Trench, and she lived into Umar's
    caliphate.
  ur: "نبی کی خالہ، زبیر بن عوام کی والدہ اور حمزہ کی سگی بہن؛ مسلمان ہوئیں اور بیٹے کے ساتھ ہجرت کی۔"
