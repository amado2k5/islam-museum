id: person/al-haytham-ibn-kharija
class: person
gender: male
label:
  ar: الهيثم بن خارجة المروذي البغدادي (أبو أحمد)
  en: Al-Haytham ibn Kharija al-Marwazi al-Baghdadi (Abu Ahmad, traditionist)
summary:
  ar: 'محدث حافظ من مرو ثم بغداد، يكنى أبا أحمد، ويقال أبا يحيى؛ حدث عن مالك والليث وحفص بن ميسرة وإسماعيل بن عياش ومحمد بن أيوب بن ميسرة وغيرهم، وحدث عنه أحمد بن حنبل وابنه عبد الله وإسماعيل بن أبي الحارث وأبو زرعة؛ وقال ابن معين: ثقة، وقال صالح إن أحمد بن حنبل كان يثني عليه، وذكره ابن حبان في الثقات، وقال الخليلي: ثقة متفق عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}'
  en: A traditionist and memorizer from Marw and later Baghdad, called Abu Ahmad (also Abu Yahya); he transmitted from Malik, al-Layth, Hafs ibn Maysara, Isma'il ibn Ayyash and Muhammad ibn Ayyub ibn Maysara; Ahmad ibn Hanbal, his son Abd Allah, Isma'il ibn Abi al-Harith and Abu Zur'a transmitted from him; Ibn Ma'in called him reliable, Ibn Hibban listed him among the reliable, and al-Khalili called him agreed upon as reliable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}
  ur: مرو اور پھر بغداد کے محدث اور حافظ، ابو احمد کنیت؛ مالک اور لیث سے روایت کی؛ احمد بن حنبل نے ان سے روایت کی؛ ابن معین نے ثقہ کہا اور ابن حبان نے ثقات میں ذکر کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}
