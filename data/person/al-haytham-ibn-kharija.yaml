id: person/al-haytham-ibn-kharija
class: person
gender: male
label:
  ar: الهيثم بن خارجة المروذي البغدادي ⁦(أبو أحمد)⁩
  en: Al-Haytham ibn Kharija al-Marwazi al-Baghdadi (Abu Ahmad, traditionist)
  es: "Al-Haytham ibn Kharija al-Marwazi al-Baghdadi (Abu Ahmad, traditionist)"
  fr: "Al-Haytham ibn Kharija al-Marwazi al-Baghdadi (Abu Ahmad, traditionist)"
  ur: "الہیثم بن خارجہ المروازی البغدادی ⁦(ابو احمد، روایت پسند)⁩"
summary:
  ar: 'محدث حافظ من مرو ثم بغداد، يكنى أبا أحمد، ويقال أبا يحيى؛ حدث عن مالك والليث وحفص بن ميسرة وإسماعيل بن عياش ومحمد بن أيوب بن ميسرة وغيرهم، وحدث عنه أحمد بن حنبل وابنه عبد الله وإسماعيل بن أبي الحارث وأبو زرعة؛ وقال ابن معين: ثقة، وقال صالح إن أحمد بن حنبل كان يثني عليه، وذكره ابن حبان في الثقات، وقال الخليلي: ثقة متفق عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}'
  en: A traditionist and memorizer from Marw and later Baghdad, called Abu Ahmad (also Abu Yahya); he transmitted from Malik, al-Layth, Hafs ibn Maysara, Isma'il ibn Ayyash and Muhammad ibn Ayyub ibn Maysara; Ahmad ibn Hanbal, his son Abd Allah, Isma'il ibn Abi al-Harith and Abu Zur'a transmitted from him; Ibn Ma'in called him reliable, Ibn Hibban listed him among the reliable, and al-Khalili called him agreed upon as reliable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}
  ur: مرو اور پھر بغداد کے محدث اور حافظ، ابو احمد کنیت؛ مالک اور لیث سے روایت کی؛ احمد بن حنبل نے ان سے روایت کی؛ ابن معین نے ثقہ کہا اور ابن حبان نے ثقات میں ذکر کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}
  es: "Un tradicionalista y memorizador de Marw y más tarde de Bagdad, llamado Abu Ahmad (también Abu Yahya); transmitió desde Malik, al-Layth, Hafs ibn Maysara, Isma'il ibn Ayyash y Muhammad ibn Ayyub ibn Maysara; Ahmad ibn Hanbal, su hijo Abd Allah, Isma'il ibn Abi al-Harith y Abu Zur'a transmitieron de él; Ibn Ma'in lo llamó confiable, Ibn Hibban lo incluyó entre los confiables y al-Khalili lo consideró confiable. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}"
  fr: "Un traditionniste et mémorisateur de Marw et plus tard de Bagdad, appelé Abu Ahmad (également Abu Yahya); il a transmis de Malik, al-Layth, Hafs ibn Maysara, Isma'il ibn Ayyash et Muhammad ibn Ayyub ibn Maysara; Ahmad ibn Hanbal, son fils Abd Allah, Isma'il ibn Abi al-Harith et Abu Zur'a transmis de lui; Ibn Ma'in l'a qualifié de fiable, Ibn Hibban l'a répertorié parmi les fiables et al-Khalili l'a qualifié de fiable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7845}"
  tr: "Merw ve o dönemde Bağdat'tan bir hadis alimi ve hadis alimi olan kunya Ebu Ahmed, aynı zamanda Ebu Yahya olarak da bilinir; Malik, El-Leys, Hafs ibn Maysara, İsmail ibn Ayyash, Muhammed ibn Eyyub ibn Maysara ve diğerlerinden rivayet etmiştir. Ahmed ibn Hanbal, oğlu Abdullah, İsmayıl ibn Ebi el-Haris ve Ebu Zur'ah ondan rivayet etmişlerdir. İbn Mein şöyle demiştir: Güvenilir. Salih dedi ki, Ahmed ibn Hanbal onu övmüştü, İbn Hibban da onu güvenilir kişiler arasında saymıştır. El-Halili, şöyle der: Güvenilir, kabul edilmiştir. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7845}"
  id: "Seorang ulama hadis dan ulama hadis dari Marw saat itu Baghdad, Kunya Abu Ahmad, juga disebut Abu Yahya; ia menceritakan dari Malik, Al-Layth, Hafs ibn Maysara, Ismail ibn Ayyash, Muhammad ibn Ayyub ibn Maysara, dan lainnya. Ahmad ibn Hanbal, putranya Abdullah, Isma'il ibn Abi al-Harith, dan Abu Zur'ah menceritakan darinya. Ibn Ma'in berkata: Dapat dipercaya. Salih berkata Ahmad ibn Hanbal biasa memujinya, dan Ibn Hibban menyebutnya sebagai salah satu yang dapat dipercaya. Al-Khalili berkata: Dapat dipercaya, setuju. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7845}"
