summary:
  ar: "علي بن محمد بن عبد الحق الزرويلي، أبو الحسن، المعروف بالصغير. فقيه مالكي من كبار المفتين بالمغرب، ولي القضاء بفاس، وكان يدرّس بجامع الأجدع فيها، وعُمّر أكثر من مئة عام. من تصانيفه «التقييد على المدونة»، و«فتاوى» قيّدها عنه تلاميذه. توفي سنة 719 للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
  en: "Ali ibn Muhammad ibn Abd al-Haqq al-Zarwili, Abu al-Hasan, known as al-Saghir: a Maliki jurist and one of the leading muftis of the Maghrib. He held the judgeship at Fez, taught at the Mosque of al-Ajda' there, and lived past a hundred years. His works include a commentary on the Mudawwana and a collection of fatwas that his students recorded. He died in the year 719 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
  fr: "Ali ibn Muhammad ibn Abd al-Haqq al-Zarwili, Abu al-Hasan, connu sous le nom d'al-Saghir : juriste malikite et l'un des principaux muftis du Maghreb. Il exerça la judicature à Fès, enseigna à la mosquée d'al-Ajda' de cette ville, et vécut plus de cent ans. Ses œuvres comprennent un commentaire de la Mudawwana et un recueil de fatwas que ses élèves consignèrent. Il mourut en l'an 719 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
  es: "Ali ibn Muhammad ibn Abd al-Haqq al-Zarwili, Abu al-Hasan, conocido como al-Saghir: jurista malikí y uno de los muftíes más importantes del Magreb. Ocupó el cargo de juez en Fez, enseñó en la Mezquita de al-Ajda' de la misma ciudad y vivió más de cien años. Entre sus obras se incluyen un comentario sobre la Mudawwana y una recopilación de fatuas registradas por sus discípulos. Falleció en el año 719 de la Hégira. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
  ur: "علی بن محمد بن عبد الحق الزرولی، ابو الحسن، الصغیر کے نام سے جانا جاتا ہے: ایک مالکی فقیہ اور مغرب کے سرکردہ مفتیوں میں سے ایک۔ آپ نے فیض میں قاضی کا عہدہ سنبھالا، وہاں کی مسجد اجداء میں درس دیا اور سو سال تک زندہ رہے۔ ان کی تصانیف میں مدوانہ کی تفسیر اور ان کے شاگردوں کے ریکارڈ کردہ فتووں کا مجموعہ شامل ہے۔ ان کی وفات 719ھ میں ہوئی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17455}"
  tr: "Ali ibn Muhammed ibn Abdülhak el-Zervili, Ebu el-Hasan, el-Sağrir (Genç) olarak da bilinir. Fas'ın önde gelen müftülerinden ve Maliki mezhebine mensup bir hukukçu olan El-Haqq el-Zervili, Fez'de kadı olarak görev yapmış ve oradaki el-Ajda Camii'nde ders vermiştir. Yüz yıldan fazla yaşamıştır. Eserleri arasında \"el-Taqyid 'ala el-Mudawwana\" (Mudawwana Üzerine Tefsir) ve öğrencilerinin derlediği \"fetvalar\" (hukuki görüşler) bulunmaktadır. Hicri 719 yılında vefat etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17455}"
  id: "Ali ibn Muhammad ibn Abd al-Haqq al-Zarwili, Abu al-Hasan, dikenal sebagai al-Saghir (yang Muda). Seorang ahli hukum Maliki dan salah satu mufti terkemuka di Maroko, ia menjabat sebagai hakim di Fez dan mengajar di Masjid al-Ajda' di sana. Ia hidup selama lebih dari seratus tahun. Di antara karyanya adalah \"al-Taqyid 'ala al-Mudawwana\" (Komentar tentang Mudawwana) dan \"fatwa\" (pendapat hukum) yang disusun oleh murid-muridnya. Ia wafat pada tahun 719 H. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
