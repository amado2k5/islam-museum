summary:
  ar: "علي بن محمد بن عبد الحق الزرويلي، أبو الحسن، المعروف بالصغير. فقيه مالكي من كبار المفتين بالمغرب، ولي القضاء بفاس، وكان يدرّس بجامع الأجدع فيها، وعُمّر أكثر من مئة عام. من تصانيفه «التقييد على المدونة»، و«فتاوى» قيّدها عنه تلاميذه. توفي سنة 719 للهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
  en: "Ali ibn Muhammad ibn Abd al-Haqq al-Zarwili, Abu al-Hasan, known as al-Saghir: a Maliki jurist and one of the leading muftis of the Maghrib. He held the judgeship at Fez, taught at the Mosque of al-Ajda' there, and lived past a hundred years. His works include a commentary on the Mudawwana and a collection of fatwas that his students recorded. He died in the year 719 AH. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17455}"
