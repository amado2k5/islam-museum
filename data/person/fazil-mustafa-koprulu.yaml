summary:
  ar: "بطاقة أولية لفاضل مصطفى باشا الكوبريللي، الصدر الأعظم الذي قُتل في سلانكمن سنة 1691، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع ترجمته في تاريخ الدولة العثمانية للصلابي على الصفحة بعد، لذلك لا تُذكر هنا تواريخ."
  en: "Draft card for Köprülü Fazıl Mustafa Pasha, the grand vizier killed at Slankamen in 1691, named from an open reference description (Wikidata); his entry in al-Salabi's history of the Ottoman state is not yet checked on the page, so no dates are given."
  es: "Ficha de borrador para Köprülü Fazıl Mustafa Pasha, el gran visir asesinado en Slankamen en 1691, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su entrada en la historia del estado otomano de al-Salabi aún no ha sido verificada en la página, por lo que no se proporcionan fechas."
  fr: "Fiche de candidature de Köprülü Fazıl Mustafa Pasha, le grand vizir tué à Slankamen en 1691, nommé d'après une description de référence ouverte (Wikidata); son entrée dans l'histoire de l'État ottoman d'al-Salabi n'est pas encore vérifiée sur la page, donc aucune date n'est donnée."
  ur: "Köprülü فضل مصطفی پاشا کے لیے ڈرافٹ کارڈ، 1691 میں سلانکامین میں مارے جانے والے عظیم وزیر، ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے نامزد کیا گیا؛ السلابی کی عثمانی ریاست کی تاریخ میں ان کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے، اس لیے کوئی تاریخ نہیں دی گئی ہے۔"
  tr: "1691'de Slankman'da öldürülen Sadrazam Fadil Mustafa Paşa Köprilli'nin ön kartı, açık bir referans tanımında (Wikidata) bahsedilmiştir. Al-Sallabi'nin Osmanlı Devleti Tarihi adlı eserinin çevirisi henüz sayfada incelenmemiştir, bu nedenle tarihler burada belirtilmemiştir."
  id: "Kartu awal oleh Fadil Mustafa Pasha Köprilli, Wazir Agung yang dibunuh di Slankman pada tahun 1691, disebutkan dalam deskripsi referensi terbuka (Wikidata). Terjemahannya atas Sejarah Negara Ottoman karya Al-Sallabi belum ditinjau di halaman tersebut, sehingga tanggal-tanggal tersebut tidak disebutkan di sini."
