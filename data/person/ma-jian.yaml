summary:
  ar: "عالم ومترجم مسلم صيني من الهوي، من شاديان في يونان (1906–1978)؛ درس عند هو سونغشان ثم في المدرسة الإسلامية النظامية في شنغهاي، وأُوفد سنة 1931 إلى الجامع الأزهر في القاهرة ضمن أول بعثة صينية، ودرّس العربية والدراسات الإسلامية في جامعة بكين منذ 1946، وترجم القرآن الكريم كاملًا إلى الصينية فصارت ترجمته أوسع الترجمات انتشارًا في الصين."
  en: "Hui Chinese Muslim scholar and translator from Shadian, Yunnan (1906–1978). He studied under Hu Songshan and at the Shanghai Islamic Normal School, was sent to al-Azhar in Cairo in 1931 in the first Chinese government-sponsored group, taught Arabic and Islamic studies at Peking University from 1946, and translated the whole Qur'an into Chinese; his translation remains the most widely used in China."
  ur: "شادیان، یوننان سے تعلق رکھنے والے ایک ہوئی چینی مسلمان عالم اور مترجم (1906ء–1978ء)؛ انہوں نے ہو سونگ شان اور شنگھائی اسلامی نارمل اسکول میں تعلیم حاصل کی، 1931ء میں پہلے چینی سرکاری گروپ کے ساتھ قاہرہ کی جامعہ ازہر بھیجے گئے، 1946ء سے پیکنگ یونیورسٹی میں عربی اور اسلامی علوم پڑھائے، اور قرآن مجید کا مکمل چینی ترجمہ کیا جو آج بھی چین میں سب سے زیادہ مستعمل ہے۔"
