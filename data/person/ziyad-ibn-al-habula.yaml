summary:
  ar: "من أشهر ملوك الضجاعمة، بني ضجعم بن سليح من قضاعة، الذين اصطنعهم الرومان ملوكاً على عرب الشام قبل الغساسنة؛ ويقدَّر زمن الضجاعمة من أوائل القرن الثاني الميلادي إلى نهايته تقريباً، في رواية الرحيق المختوم."
  en: "The most famous king of the Daja'ima, Banu Dajam ibn Salih of Quda'a, whom the Romans set up as kings over the Arabs of al-Sham before the Ghassanids; their era is reckoned from the early second century CE to about its end, in al-Raheeq al-Makhtum's account."
  es: "El rey más famoso de los Daja'ima, Banu Dajam ibn Salih de Quda'a, a quien los romanos establecieron como reyes sobre los árabes de al-Sham antes de los gasánidas; su era se calcula desde principios del siglo II d.C. hasta aproximadamente su final, según el relato de al-Raheeq al-Makhtum."
  fr: "Le roi le plus célèbre des Daja'ima, Banu Dajam ibn Salih de Quda'a, que les Romains ont établi comme rois des Arabes d'al-Sham avant les Ghassanides; leur ère est estimée du début du IIe siècle de notre ère jusqu'à sa fin, selon le récit d'al-Raheeq al-Makhtum."
  ur: "دجائمہ کا سب سے مشہور بادشاہ، قدعہ کا بنو دجام بن صالح، جسے رومیوں نے غسانیوں سے پہلے الشام کے عربوں پر بادشاہ مقرر کیا تھا۔ الرحیق المختم کے بیان میں ان کا دور دوسری صدی عیسوی کے اوائل سے اس کے اختتام تک شمار ہوتا ہے۔"
  tr: "Al-Daja'ama'nın en ünlü krallarından biri, Romalıların Gassanilerden önce Levant Araplarını kral yaptığı Kuda'a'dan Banu Daj'ibn Suleyh'ti; 'Mühürlü Nektar'a göre, Al-Daja'ama dönemi M.S. ikinci yüzyılın başından neredeyse sonuna kadar olduğu tahmin edilmektedir."
  id: "Di antara raja paling terkenal dari Al-Daja'ama adalah Banu Daj'am ibn Sulayh dari Quda'a, yang diangkat oleh Romawi sebagai raja atas bangsa Arab di Levant sebelum Ghassanid; periode Al-Daja'ama diperkirakan berlangsung dari awal hingga hampir akhir abad kedua Masehi, menurut novel 'The Sealed Nectar.'"
