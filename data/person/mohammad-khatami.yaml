summary:
  ar: "محمد خاتمي (وُلد 14 تشرين الأول 1943) رجل دين وفيلسوف إصلاحي إيراني، رئيس إيران من 3 آب 1997 إلى 3 آب 2005 خلفًا لأكبر هاشمي رفسنجاني. وزير للثقافة (1982–1992) وصاحب فكرة «حوار الحضارات» التي تبنّتها الأمم المتحدة لسنة 2001، ثم قائد المعسكر الإصلاحي، وهو ابن روح الله خاتمي."
  en: "Mohammad Khatami (born 14 October 1943) is an Iranian cleric and reformist philosopher who served as president of Iran from 3 August 1997 to 3 August 2005, succeeding Akbar Hashemi Rafsanjani. Minister of culture from 1982 to 1992, he proposed the Dialogue Among Civilizations adopted by the United Nations for 2001 and later led Iran's reformist camp; he is the son of Ruhollah Khatami."
