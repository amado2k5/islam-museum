summary:
  ar: "محمد خاتمي ⁦(وُلد 14 تشرين الأول 1943)⁩ رجل دين وفيلسوف إصلاحي إيراني، رئيس إيران من 3 آب 1997 إلى 3 آب 2005 خلفًا لأكبر هاشمي رفسنجاني. وزير للثقافة (1982–1992) وصاحب فكرة «حوار الحضارات» التي تبنّتها الأمم المتحدة لسنة 2001، ثم قائد المعسكر الإصلاحي، وهو ابن روح الله خاتمي."
  en: "Mohammad Khatami (born 14 October 1943) is an Iranian cleric and reformist philosopher who served as president of Iran from 3 August 1997 to 3 August 2005, succeeding Akbar Hashemi Rafsanjani. Minister of culture from 1982 to 1992, he proposed the Dialogue Among Civilizations adopted by the United Nations for 2001 and later led Iran's reformist camp; he is the son of Ruhollah Khatami."
  es: "Mohammad Khatami (nacido el 14 de octubre de 1943) es un clérigo y filósofo reformista iraní que fue presidente de Irán desde el 3 de agosto de 1997 hasta el 3 de agosto de 2005, sucediendo a Akbar Hashemi Rafsanjani. Ministro de Cultura de 1982 a 1992, propuso el Diálogo entre Civilizaciones, adoptado por las Naciones Unidas en 2001, y posteriormente lideró el sector reformista de Irán; es hijo de Ruhollah Khatami."
  fr: "Mohammad Khatami (né le 14 octobre 1943) est un religieux et philosophe réformateur iranien qui a été président de l'Iran du 3 août 1997 au 3 août 2005, succédant à Akbar Hashemi Rafsanjani. Ministre de la Culture de 1982 à 1992, il a proposé le Dialogue entre les civilisations, adopté par les Nations Unies en 2001, et a ensuite dirigé le camp réformateur iranien. Il est le fils de Ruhollah Khatami."
  ur: "محمد خاتمی ⁦(پیدائش: 14 اکتوبر 1943)⁩ ایک ایرانی عالم اور اصلاح پسند فلسفی ہیں جنہوں نے اکبر ہاشمی رفسنجانی کے بعد 3 اگست 1997 سے 3 اگست 2005 تک ایران کے صدر کی حیثیت سے خدمات انجام دیں۔ 1982 سے 1992 تک وزیر ثقافت، انہوں نے 2001 کے لیے اقوام متحدہ کی طرف سے اپنایا گیا تہذیبوں کے درمیان مکالمے کی تجویز پیش کی اور بعد میں ایران کے اصلاحی کیمپ کی قیادت کی۔ وہ روح اللہ خاتمی کا بیٹا ہے۔"
  tr: "Mohammad Khatemi (d. 14 Ekim 1943), İranlı din adamı ve reformist filozoftur; 3 Ağustos 1997'den 3 Ağustos 2005'e kadar İran Cumhurbaşkanı olarak görev yapmış ve Akbar Haşimi Rafsancani'nin yerine geçmiştir. Kültür Bakanı (1982–1992) ve 2001'de Birleşmiş Milletler tarafından benimsenen 'Medeniyetler Diyaloğu' fikrinin kurucusu, o dönemde reformist kampın lideri ve Ruhullah Hatemi'nin oğludur."
  id: "Mohammad Khatami (lahir 14 Oktober 1943) adalah seorang ulama dan filsuf reformis Iran, Presiden Iran dari 3 Agustus 1997 hingga 3 Agustus 2005, menggantikan Akbar Hashemi Rafsanjani. Menteri Kebudayaan (1982–1992) dan pendiri gagasan 'Dialog Peradaban' yang diadopsi oleh Perserikatan Bangsa-Bangsa pada tahun 2001, saat itu pemimpin kubu reformis, dan putra Ruhollah Khatami."
