summary:
  ar: "عبد الرشيد بن عبد الغفور المدني التتوي، لغوي فارسي وُلد في تتّة بالسند، وهو سيد بالنسب، ومؤلف فرهنگ رشیدی، أول معجم فارسي نقدي، ومعجم عربي فارسي اسمه منتخب اللغات أو الرشيدي. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  en: "Abd al-Rashid b. Abd al-Ghafur al-Madani al-Tattawi, a Persian lexicographer born in Tatta, a Sayyid by descent, author of the Farhang-i Rashidi, the first critical Persian dictionary, and of an Arabic-Persian dictionary. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  fr: "Abd al-Rashid b. Abd al-Ghafur al-Madani al-Tattawi, lexicographe persan né à Tatta, sayyid par sa lignée, auteur du Farhang-i Rashidi, le premier dictionnaire critique du persan, et d'un dictionnaire arabe-persan. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  ur: "عبدالرشید بن عبدالغفور المدنی التتوی، فارسی لغت نگار، جو ٹھٹہ ⁦(سندھ)⁩ میں پیدا ہوئے، نسباً سید تھے، اور فرہنگ رشیدی کے مصنف تھے، جو پہلی تنقیدی فارسی لغت ہے، نیز ایک عربی فارسی لغت کے مؤلف۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  es: "Abd al-Rashid b. Abd al-Ghafur al-Madani al-Tattawi, lexicógrafo persa nacido en Tatta, de ascendencia Sayyid, autor del Farhang-i Rashidi, el primer diccionario crítico persa, y de un diccionario árabe-persa. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  tr: "Sindh'in Tattah şehrinde doğan Farsça dilbilimci Abdülreşid ibn Abdülgafur el-Medani el-Tatvi, Seyyid soyundan olup, ilk eleştirel Farsça sözlük olan Farhang-e Raşidi'nin ve Muntakhab el-Lughat veya el-Rashidi olarak adlandırılan Arapça-Farsça sözlüğün yazarıdır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
  id: "Abd al-Rashid ibn Abd al-Ghafur al-Madani al-Tatwi, seorang ahli bahasa Persia yang lahir di Tattah, Sindh, adalah seorang Sayyid berdasarkan garis keturunan dan penulis Farhang-e Rashidi, kamus Persia kritis pertama, dan kamus Arab-Persia yang disebut Muntakhab al-Lughat atau al-Rashidi. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
