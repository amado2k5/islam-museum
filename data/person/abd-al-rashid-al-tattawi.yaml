  ar: "عبد الرشيد بن عبد الغفور المدني التتوي، لغوي فارسي وُلد في تتّة بالسند، وهو سيد بالنسب، ومؤلف فرهنگ رشیدی، أول معجم فارسي نقدي، ومعجم عربي فارسي اسمه منتخب اللغات أو الرشيدي. {cite:encyclopaedia-of-islam-2 vol. 1 p. 107}"
