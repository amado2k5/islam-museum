summary:
  ar: "أول من كتب المصاحف في الصدر الأول ويوصف بحسن الخط، رأى ابن النديم مصحفاً بخطه، وكتب لعمر بن عبد العزيز مصحفاً تنوّق فيه فاستحسنه عمر واستكثر ثمنه فرده عليه {cite:fihrist-ibn-al-nadim p. 15-16}."
  en: "The first famed mushaf calligrapher; his copy for Umar b. Abd al-Aziz was returned as too costly {cite:fihrist-ibn-al-nadim p. 15-16}."
