  fr: "Le premier calligraphe célèbre du mushaf; sa copie pour Umar b. Abd al-Aziz a été retournée comme étant trop coûteuse {cite:fihrist-ibn-al-nadim p. 15-16}."
  ur: "پہلا مشہور مصحف خطاط؛ عمر بن کے لیے اس کی نقل عبدالعزیز کو بہت مہنگا سمجھ کر واپس کیا گیا تھا 15-16}۔"
  tr: "Erken Sadr döneminde güzel olarak tanımlanan ilk Kur'an yazan İbn el-Nadim'dir; kendi el yazısıyla bir Kur'an görüp Ömer bin Abdülaziz için süslemesi için bir Kur'an yazmıştır; bu Kur'an Ömer tarafından beğenilmiş ve çok değer verilmiştir, bu yüzden ona geri vermiştir {atıf:Fihrist-ibn-al-Nadim s. 15-16}."
  id: "Orang pertama yang menulis Al-Qur'an pada era awal Sadr, yang digambarkan indah, adalah Ibn al-Nadim yang melihat Al-Qur'an dengan tulisan tangannya sendiri dan menulis Al-Qur'an untuk Umar ibn Abd al-Aziz sebagai hiasan, yang disukai dan sangat dihargai oleh Umar, sehingga ia mengembalikannya {cite:fihrist-ibn-al-nadim hlm. 15-16}."
