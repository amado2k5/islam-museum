label: { ar: "جرير بن يزيد البجلي", en: "Jarir ibn Yazid al-Bajali", es: "Jarir ibn Yazid al-Bajali", fr: "Jarir ibn Yazid al-Bajali", ur: "جریر ابن یزید البجلی" }
summary:
  ar: "داهية عصره، سرحه المنصور إلى أبي مسلم وقد أجمع على خلافه ومتنكب للعراق يريد خراسان فقال له ما آمن أن يقال طلب بثأر قوم ثم نقض بيعتهم، فأراد أن يجيب إلى الرجوع فنهاه مالك بن الهيثم وقال أبو مسلم لقد بليت بإبليس وما بليت بمثل هذا قط يعني الجريري، فلم يزل به حتى أقبل به على المنصور {cite:muruj-al-dhahab p. 280}."
  en: "The arch-schemer sent to turn Abu Muslim back from Khurasan — his Iblis-like persistence delivered the rebel to al-Mansur's couch of daggers {cite:muruj-al-dhahab p. 280}."
  es: "El gran intrigante enviado para hacer regresar a Abu Muslim de Jorasán, con su persistencia similar a la de Iblis, entregó al rebelde al lecho de dagas de al-Mansur {cite:muruj-al-dhahab p. 280}."
  fr: "L'archi-intrigant envoyé pour faire rebrousser chemin à Abu Muslim depuis le Khorasan — sa persévérance à la Iblis a livré le rebelle au lit de poignards d'al-Mansur {cite:muruj-al-dhahab p. 280}."
  ur: "ابو مسلم کو خراسان سے واپس لوٹانے کے لیے آرک سکیمر بھیجا گیا - اس کی ابلیس جیسی استقامت نے باغی کو المنصور کے خنجر کے تخت تک پہنچا دیا {حوالہ: مروج الذہب ص۔ 280}۔"
  tr: "Döneminin felaketi olan El-Mensur, onu Ebu Müslim'e gönderdi; Ebu Müslim ona karşı çıkmış ve Horasan'ı aramak için Irak'a gitmeye kararlıydı. Ona şöyle dedi: 'Bir halk için intikam aradığı ve sonra bağlılıklarını bozduğuna inanmıyordu.' Geri dönüşe cevap vermek istedi, ancak Malik ibn al-Haytham onu yasakladı ve 'İblis tarafından sınandım, hiç böyle sınanmadım,' yani El-Ceriri'yi kastetti. Kendisi bunu ısrar etti ve sonunda bunu el-Mansur'a çevirdi {atı:Muruj-al-Dhahab, s. 280}."
  id: "Karena bencana pada zamannya, Al-Mansur mengirimnya kepada Abu Muslim, yang telah setuju melawannya dan bertekad pergi ke Irak mencari Khorasan. Dia berkata kepadanya, 'Dia tidak percaya bahwa akan dikatakan bahwa dia mencari balas dendam untuk suatu bangsa lalu memutuskan kesetiaan mereka.' Dia ingin menanggapi kembalinya itu, tetapi Malik ibn al-Haytham melarangnya dan berkata: 'Aku telah diuji oleh Iblis, dan aku belum pernah diuji seperti ini,' maksudnya Al-Jariri. Dia terus berjuang sampai membalikkan hukuman itu terhadap al-Mansur {cite:muruj-al-dhahab, hlm. 280}."
