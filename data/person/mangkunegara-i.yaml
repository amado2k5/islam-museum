summary:
  ar: "مانغكونيغارا الأول (7 أبريل 1725 – 28 ديسمبر 1795)، وُلد باسم رادن ماس سعيد واشتُهر بلقب بانغيران سامبرنياوا أي «الأمير حاصد الأرواح»، أمير من ماتارام قاتل شركة الهند الشرقية الهولندية نحو ست عشرة سنة وخاض 250 معركة، حتى جعلته معاهدة سالاتيغا سنة 1757 مؤسس إمارة مانغكونيغاران في سوراكارتا وأول حكامها، فحكمها حتى وفاته. أعلنته إندونيسيا بطلًا قوميًا سنة 1988."
  en: "Mangkunegara I (7 April 1725 – 28 December 1795), born Raden Mas Said and famed as Pangeran Sambernyawa, 'the Life-Reaping Prince', was a Mataram prince who fought the Dutch East India Company for some sixteen years and, by the English article's count, 250 battles, until the Treaty of Salatiga in 1757 made him founder and first ruler of the Mangkunegaran principality in Surakarta, which he ruled until his death. Indonesia proclaimed him a National Hero in 1988."
  ur: "مانگکونیگارا اول (7 اپریل 1725ء – 28 دسمبر 1795ء)، پیدائشی نام رادن ماس سعید اور لقب پانگیران سامبرنیاوا یعنی «ارواح کاٹنے والا شہزادہ»، ماتارم کے شہزادے تھے جنہوں نے تقریباً سولہ سال ولندیزی ایسٹ انڈیا کمپنی سے جنگ کی اور 250 معرکے لڑے، حتیٰ کہ 1757ء میں سالاتیگا معاہدے نے انہیں سوراکارتا میں مانگکونیگاران ریاست کا بانی اور پہلا حکمران بنا دیا، جہاں انہوں نے وفات تک حکومت کی۔ انڈونیشیا نے 1988ء میں انہیں قومی ہیرو قرار دیا۔"

