summary:
  ar: "أبو عبد الله هشام بن معاوية الضرير النحوي الكوفي؛ صاحب أبي الحسن علي بن حمزة الكسائي أخذ عنه كثيراً من النحو وله فيه مقالة تعزى إليه وله فيه تصانيف عديدة منها كتاب «الحدود» وكتاب «المختصر» وكتاب «القياس»؛ وكان إسحاق بن إبراهيم بن مصعب قد لحن في بعض كلامه بحضرة المأمون فتعلم النحو على هشام المذكور {cite:wafayat-ayan}."
  en: "Hisham b. Mu'awiya al-Darir (d. 209) — al-Kisa'i's companion and first systematizer; author of al-Hudud, al-Mukhtasar and al-Qiyas; Ishaq b. Ibrahim b. Mus'ab learned grammar from him after slipping in al-Ma'mun's presence {cite:wafayat-ayan}."
