gender: female
roles: [mystic]
summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، كانت تقوم الليل في المحراب إلى السحر ثم تدعو حتى الفجر، وتقول إن ذكر الموت لا يدعها تنام، ويُذكر أنها لم تفطر ستين عاماً، ورُئيت يوم عيد في جبة صوف وقناع صوف وهي جلد وعظم."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who prayed in her prayer niche until the pre-dawn and then supplicated until daybreak, saying the remembrance of death would not let her sleep; it was said she had fasted for sixty years, and she was seen on a feast day in a woollen cloak and veil, nothing but skin and bone."
  fr: "Femme pieuse de Bassora mentionnée par Ibn al-Jawzi dans Sifat al-Safwa, qui priait dans sa niche de prière jusqu’à l’aube naissante, puis invoquait jusqu’au lever du jour, disant que le souvenir de la mort l’empêchait de dormir ; on disait qu’elle jeûnait depuis soixante ans et on la vit un jour de fête vêtue d’un manteau de laine et d’un voile, n’ayant plus que la peau sur les os."
  es: "Una mujer devota de Basora, mencionada por Ibn al-Jawzi en Sifat al-Safwa, rezaba en su nicho de oración hasta antes del amanecer y luego suplicaba hasta el amanecer, diciendo que el recuerdo de la muerte no la dejaba dormir; se decía que había ayunado durante sesenta años, y fue vista en un día festivo con una capa y un velo de lana, reducida a piel y huesos."
  ur: "بصرہ کی ایک متقی خاتون جو ابن الجوزی نے صفات الصفوی میں درج کی ہے، جس نے اپنی نماز کے طاق میں طلوع فجر تک نماز پڑھی اور پھر صبح ہونے تک دعا کی، اور کہا کہ موت کی یاد اسے سونے نہیں دے گی۔ کہا جاتا ہے کہ اس نے ساٹھ سال سے روزے رکھے تھے، اور عید کے دن اسے اونی چادر اور پردے میں دیکھا گیا تھا، سوائے جلد اور ہڈی کے۔"
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinde bahsettiği Basralı bir kadın, geceleyin namaz kılınan yerde şafak sökene kadar ayakta namaz kılardı, sonra da sabaha kadar dua ederdi. Ölümün hatırasının onu uyutmadığını söylerdi. Altmış yıl boyunca orucunu bozmadığı ve bayram günü yün bir elbise ve yün bir peçe giymiş, sadece deri ve kemikten ibaret halde görüldüğü rivayet edilir."
  id: "Seorang jamaah dari Basra, yang disebutkan oleh Ibnu al-Jawzi dalam “Sifat al-Safwa,” biasa berdiri shalat di tempat shalat pada malam hari hingga subuh, kemudian shalat hingga pagi. Ia berkata bahwa ingatan akan kematian mencegahnya untuk tidur. Disebutkan bahwa ia tidak berbuka puasa selama enam puluh tahun, dan ia terlihat pada hari raya Idul Fitri mengenakan jubah wol dan kerudung wol, yang hanya berupa kulit dan tulang."
