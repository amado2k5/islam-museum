summary:
  ar: "عابدة من أهل البصرة يذكرها ابن الجوزي في «صفة الصفوة»، كانت تقوم الليل في المحراب إلى السحر ثم تدعو حتى الفجر، وتقول إن ذكر الموت لا يدعها تنام، ويُذكر أنها لم تفطر ستين عاماً، ورُئيت يوم عيد في جبة صوف وقناع صوف وهي جلد وعظم."
  en: "A devout woman of Basra recorded by Ibn al-Jawzi in Sifat al-Safwa, who prayed in her prayer niche until the pre-dawn and then supplicated until daybreak, saying the remembrance of death would not let her sleep; it was said she had fasted for sixty years, and she was seen on a feast day in a woollen cloak and veil, nothing but skin and bone."
