class: person
label: { ar: "هارون بن غريب", en: "Harun ibn Gharib", es: "Harun ibn Gharib", fr: "Harun ibn Gharib", ur: "ہارون بن غریب" }
summary:
  ar: "قائد المقتدر الذي سيّره في الحال نحو قزوين لحرب أسفار بن شيرويه فكانت له معه حروب فانكشف هارون وقتل من أصحابه خلق كثير بباب قزوين {cite:muruj-al-dhahab p. 721}. وعند ابن الأثير أشار هو ومؤنس ونصر الحاجب على المقتدر بقتل ابن الفرات وولده سنة 312هـ {cite:kamil-ibn-al-athir p. 113}، وعند ابن الأثير قُتل سنة 322هـ؛ كان القاهر استعمله على ماء الكوفة وقصب الدينور وماسبذان، فلما خلع القاهر رأى هارون أنه أحق بالدولة من غيره لقرابته من الراضي إذ هو ابن خال المقتدر فكاتب القواد ببغداد وسار من الدينور إلى خانقين فتخرج إليه محمد بن ياقوت فوقعت الطلائع بعضها على بعض وتزاحف العسكران يوم الثلاثاء لست بقين من جمادى الآخرة فاستظهر أصحاب هارون لكثرتهم فانهزم أكثر أصحاب ابن ياقوت وقطع ابن ياقوت قنطرة نهر بين فلما جاء هارون يخالف... ثم قُتل {cite:kamil-ibn-al-athir p. 216-217}"
  en: "Al-Muqtadir's general, broken by Asfar at the gate of Qazvin {cite:muruj-al-dhahab p. 721}."
  es: "El general de Al-Muqtadir, derrotado por Asfar en la puerta de Qazvin {cita:muruj-al-dhahab p. 721}."
  fr: "Le général d'Al-Muqtadir, brisé par Asfar à la porte de Qazvin {cite:muruj-al-dhahab p. 721}."
  ur: "مقتدیر کا جنرل، قزوین کے دروازے پر اسفار سے ٹوٹ گیا۔ 721}۔"
  tr: "O, el-Muqtadir'in komutanıydı ve hemen onu Asfar bin Şiruveyh'e karşı savaş için Kazvin'e götürdü. Onunla savaştı, ancak Harun ortaya çıktı ve birçok yoldaşı Kazvin kapısında öldürüldü {cite:muruj-al-dhahab, s. 721}. İbn al-Athir'e göre, o, Mu'nis ve Nasr al-Hacib, 312 Hicri yılında el-Muqtadir'e İbn el-Furat ve oğlunu öldürmesini emretmişlerdir {cite:kamil-ibn-al-athir, s. 113}. İbn al-Athir'e göre, 322 Hicri yılında öldürülmüştür; el-Kahir onu Kufe suları, Dinawar sazlıkları ve benzeri yerlere atamıştır. El-Kahir onu tahttan indirdiğinde, Harun devlete sahip olmanın en çok hak sahibi olduğunu görmüştür; çünkü el-Kahir ile akrabalığı nedeniyle devlete diğerlerinden daha fazla hak kazanmıştır -Radi, çünkü el-Muqtadir'in kuzeniydi. Bağdat'taki komutanlara yazdı ve el-Dinevr'den Hanaqin'e yürüdü; burada Muhammed bin Yaqut ona katılmak üzere yola çıktı. Öncüler birbirine saldırdı ve iki ordu Salı günü ilerledi, Cumada el-Akhira'da kalmadan. Harun'un yoldaşları sayıca fazla olduğu için ortaya çıktı ve İbn Yakut'un yoldaşlarının çoğu yenildi. İbn Yaqut Bain Nehri köprüsünü geçti. Harun geldiğinde karşı çıktı... Sonra öldürüldü {atıf:) Kamil-ibn-al-Athir s. 216-217}"
  id: "Ia adalah komandan al-Muqtadir, yang segera membawanya menuju Qazvin untuk berperang melawan Asfar ibn Shiruwayh. Ia bertempur bersamanya, tetapi Harun terbongkar dan banyak rekannya tewas di gerbang Qazvin {cite:muruj-al-dhahab, hlm. 721}. Menurut Ibn al-Athir, dia, Mu'nis, dan Nasr al-Hajib memerintahkan al-Muqtadir untuk membunuh Ibn al-Furat dan putranya pada tahun 312 H {cite:kamil-ibn-al-athir, hlm. 113}. Menurut Ibn al-Athir, ia tewas pada tahun 322 H; al-Qahir mengangkatnya melewati perairan Kufa, alang-alang Dinawar, dan sejenisnya. Ketika al-Qahir menggulingkannya, Harun melihat bahwa ia lebih berhak atas negara daripada siapa pun karena kekeluargaannya dengan al-Radi, karena ia adalah sepupu al-Muqtadir. Ia menulis surat kepada para komandan di Baghdad dan berbaris dari al-Dinawr ke Khanaqin, di mana Muhammad ibn Yaqut berangkat untuk bergabung dengannya. Barisan depan saling bertarung, dan kedua pasukan maju pada hari Selasa, tidak tinggal di Jumada al-Akhira. Sahabat Harun muncul karena jumlah mereka, dan sebagian besar rekan Ibn Yaqut kalah. Ibn Yaqut menyeberangi jembatan Sungai Bain. Ketika Harun datang, ia melawan... Kemudian ia dibunuh {cite:Kamil-ibn-al-Athir hlm. 216-217}"
