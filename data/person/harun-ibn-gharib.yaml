id: person/harun-ibn-gharib
class: person
label: { ar: "هارون بن غريب", en: "Harun ibn Gharib" }
summary:
  ar: "قائد المقتدر الذي سيّره في الحال نحو قزوين لحرب أسفار بن شيرويه فكانت له معه حروب فانكشف هارون وقتل من أصحابه خلق كثير بباب قزوين {cite:muruj-al-dhahab p. 721}.، وعند ابن الأثير أشار هو ومؤنس ونصر الحاجب على المقتدر بقتل ابن الفرات وولده سنة 312هـ {cite:kamil-ibn-al-athir p. 113}، وعند ابن الأثير قُتل سنة 322هـ؛ كان القاهر استعمله على ماء الكوفة وقصب الدينور وماسبذان، فلما خلع القاهر رأى هارون أنه أحق بالدولة من غيره لقرابته من الراضي إذ هو ابن خال المقتدر فكاتب القواد ببغداد وسار من الدينور إلى خانقين فتخرج إليه محمد بن ياقوت فوقعت الطلائع بعضها على بعض وتزاحف العسكران يوم الثلاثاء لست بقين من جمادى الآخرة فاستظهر أصحاب هارون لكثرتهم فانهزم أكثر أصحاب ابن ياقوت وقطع ابن ياقوت قنطرة نهر بين فلما جاء هارون يخالف... ثم قُتل {cite:kamil-ibn-al-athir p. 216-217}"
  en: "Al-Muqtadir's general, broken by Asfar at the gate of Qazvin {cite:muruj-al-dhahab p. 721}."
