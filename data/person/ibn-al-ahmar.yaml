id: person/ibn-al-ahmar
class: person
label: { ar: "أبو عبد الله ابن الأحمر سلطان الأندلس" }
summary:
  ar: "سلطان المسلمين بالأندلس، انتصر على الفرنج سنة ثلاث وستين وست مئة واسترجع من أيديهم اثنتين وثلاثين بلداً من جملتها إشبيلية ومرسية {cite:tarikh-khulafa-minhaj-1434 p. 727}. وعند ابن خلدون فلما فشل ريح الموحدين تصدى محمد بن يوسف بن نصر للثورة على ابن هود وبويع سنة 629هـ وكان يعرف بالشيخ ويلقب بأبي دبوس {cite:tarikh-ibn-khaldun-ibar p. 1008}"
  en: "The Muslim sultan of al-Andalus who in 663 beat the Franks and took back thirty-two towns, Seville and Murcia among them {cite:tarikh-khulafa-minhaj-1434 p. 727}."
  es: "El sultán musulmán de al-Ándalus que en 663 derrotó a los francos y recuperó treinta y dos ciudades, entre ellas Sevilla y Murcia {cite:tarikh-khulafa-minhaj-1434 p. 727}."
  fr: "Le sultan musulman d'al-Andalus qui, en 663, battit les Francs et reprit trente-deux villes, dont Séville et Murcie {cite:tarikh-khulafa-minhaj-1434 p. 727}."
  ur: "اندلس کا مسلمان سلطان جس نے 663 میں فرینکوں کو شکست دی اور بتیس قصبوں کو واپس لے لیا جن میں سیویل اور مرسیہ بھی شامل ہیں۔ 727}۔"
  tr: "Müslüman Endülüs Sultanı olan Khaldus, 63 Hicri'de Frankları yendi ve Sevilla ile Murcia dahil otuz iki ülkeyi geri aldı {cite:History-Khulafa-Minhaj-1434, s. 727}. İbn Haldun'a göre, Almohad rüzgarı kesildiğinde, Muhammed ibn Yusuf ibn Nasr İbn Hud'a karşı isyan etti ve 629 Hicri'nde bağlılık yemini etti. Şeyh olarak biliniyordu ve Abu Dabbus lakabıyla anılıyordu {cite:History-ibn-khaldun-ibar s. 1008}"
  id: "Sultan Muslim Al-Andalus, ia mengalahkan bangsa Franka pada tahun 63 H dan merebut kembali tiga puluh dua negara, termasuk Seville dan Murcia {cite:History-Khulafa-Minhaj-1434, hlm. 727}. Menurut Ibn Khaldun, ketika angin Almohad reda, Muhammad ibn Yusuf ibn Nasr memberontak melawan Ibn Hud dan bersumpah setia pada tahun 629 H. Ia dikenal sebagai Sheikh dan dijuluki Abu Dabbus {cite:History-ibn-khaldun-ibar hlm. 1008}"
