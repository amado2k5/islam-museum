summary:
  ar: "أحمد بن حسين بن حسن بن علي، أبو العباس الرملي الشافعي، المعروف بابن رسلان، فقيه شافعي ولد بالرملة بفلسطين، وانتقل إلى القدس فتوفي بها سنة 844هـ. لزم الإفتاء والتدريس، وأجازه قاضي القضاة الباعوني بالإفتاء. ومن تصانيفه «صفوة الزبد» في الفقه منظومة، و«شرح سنن أبي داود». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
  en: "Ahmad ibn Husayn ibn Rislan, Abu al-Abbas al-Ramli al-Shafi'i (d. 844 AH), a Shafi'i jurist born in Ramla in Palestine who moved to Jerusalem, where he died. He kept to issuing fatwas and teaching, and Qadi al-Qudat al-Ba'uni authorised him to issue fatwas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3479}"
