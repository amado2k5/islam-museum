summary:
  ar: "أنصاري من بني خدرة بن عوف بن الحارث بن الخزرج، جد أبي سعيد الخدري؛ كان له أطم «الأجرد» الذي يقال لبئره البصة في دار بني خدرة المعروفة بهم {cite:samhudi-wafa-al-wafa p. 211}."
  en: "An Ansari of Banu Khudra ibn 'Awf of Banu al-Harith ibn al-Khazraj, grandfather of Abu Sa'id al-Khudri; he held the utm 'al-Ajrad' — whose well was called al-Basa — in the known Banu Khudra quarter {cite:samhudi-wafa-al-wafa p. 211}."
  es: "Un Ansari de Banu Khudra ibn 'Awf de Banu al-Harith ibn al-Khazraj, abuelo de Abu Sa'id al-Khudri; ocupó el utm 'al-Ajrad', cuyo pozo se llamaba al-Basa, en el conocido barrio de Banu Khudra {citar:samhudi-wafa-al-wafa p. 211}."
  fr: "Un Ansari de Banu Khudra ibn 'Awf de Banu al-Harith ibn al-Khazraj, grand-père d'Abu Sa'id al-Khudri; il détenait l'utm 'al-Ajrad' - dont le puits s'appelait al-Basa - dans le quartier connu de Banu Khudra {cite: samhudi-wafa-al-wafa p. 211}."
