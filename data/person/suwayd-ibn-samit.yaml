summary:
  en: "A renowned poet and noble warrior of the Aws tribe in Yathrib, called 'al-Kamil' for his valor and lineage; he met the Prophet in Mecca carrying the wisdom of Luqman, listened to the Qur'an, approved of it, and was killed at the battle of Bu'ath before fully establishing his practice."
  ar: "شاعر وفارس شريف من الأوس بيثرب لقّبه قومه بالكامل لجلادته وشعره وشرفه؛ لقيه النبي بمكة ومعه مجلة لقمان، فاستمع إلى القرآن وقال إن هذا لقول حسن، وقُتل يوم بعاث قبل أن يستحكم إسلامه."
