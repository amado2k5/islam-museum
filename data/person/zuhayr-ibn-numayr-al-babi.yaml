summary:
  ar: "أبو عبد الرحمن زهير بن نميم البابي، داعية، غلب عليه الصبر واليقين، فأُيّد بالنصر والتمكين. قال: لا يتم هذا الأمر إلا بشيئين: الصبر واليقين، فإن كان يقين بلا صبر لم يتم، وإن كان صبر بلا يقين لم يتم. وكان يقول: وددت أن جسدي قُرض بالمقارض وأن هذا الخلق أطاعوا الله، وقال لمن سأله عن النسب: من أنعم الله عليه بالإسلام."
  en: "Abu Abd al-Rahman Zuhayr ibn Numayr al-Babi, a preacher whose life was given to patience and certainty, and who was aided with victory and firm standing; he said this matter is not completed except by two things, patience and certainty, and that certainty without patience or patience without certainty is not complete; he wished his body were cut with shears so that people would obey God; asked about his lineage, he said: I am one whom God blessed with Islam."
  ur: "ابو عبد الرحمن زہیر بن نمیم بابی داعی تھے، جن کی زندگی پر صبر اور یقین غالب تھا، اور انہیں نصرت اور استقامت عطا ہوئی۔ انہوں نے کہا کہ یہ معاملہ صرف دو چیزوں سے مکمل ہوتا ہے: صبر اور یقین؛ یقین بغیر صبر کے اور صبر بغیر یقین کے مکمل نہیں ہوتا۔ وہ چاہتے تھے کہ ان کا جسم قینچیوں سے کاٹا جائے تاکہ لوگ اللہ کی اطاعت کریں۔ نسب پوچھا گیا تو کہا: میں وہ ہوں جس پر اللہ نے اسلام کی نعمت کی۔"
  es: "Abu Abd al-Rahman Zuhayr ibn Numayr al-Babi, un predicador cuya vida estuvo dedicada a la paciencia y la certeza, y que fue ayudado por la victoria y la firmeza; dijo que este asunto no se completa sino con dos cosas, paciencia y certeza, y que la certeza sin paciencia o la paciencia sin certeza no son completas; deseó que su cuerpo fuera cortado con tijeras para que la gente obedeciera a Dios; preguntado sobre su linaje, dijo: Soy uno a quien Dios bendijo con el Islam."
  fr: "Abou Abd al-Rahman Zuhayr ibn Numayr al-Babi, prédicateur dont la vie fut consacrée à la patience et à la certitude, et qui fut aidé par la victoire et une position ferme, affirmait que rien n'est complet sans deux choses: la patience et la certitude, et que la certitude sans la patience ou la patience sans la certitude sont incomplètes. Il souhaitait que son corps soit tranché aux ciseaux afin que les gens obéissent à Dieu. Interrogé sur sa lignée, il répondit: « Je suis de ceux que Dieu a bénis avec l'Islam. »"
  tr: "Vaiz Ebu Abdülrahman Zuhayr bin Numaym el-Babi, sabır ve kesinlikle sarsılmıştı, bu yüzden zafer ve güçle onu destekledi. Dedi ki: Bu mesele ancak iki şeyle gerçekleştirilebilir: sabır ve kesinlik. Sabır olmadan kesinlik varsa, yapılmaz, sabır kesinliksizse, yapılmaz. Derdi ki: Keşke bedenim borçlulara verilseydi ve bu yaratılış Allah'a itaat etseydi. Soy hakkında soranlara şöyle derdi: Allah İslam'ı kim bereketlemişse."
  id: "Abu Abd al-Rahman Zuhayr ibn Numaym al-Babi, seorang pendakwah, dibanjiri kesabaran dan keyakinan, sehingga ia mendukungnya dengan kemenangan dan pemberdayaan. Ia berkata: Hal ini hanya bisa dicapai dengan dua hal: kesabaran dan kepastian. Jika ada kepastian tanpa kesabaran, maka tidak dilakukan, dan jika kesabaran tanpa kepastian, maka tidak ada. Ia biasa berkata: Saya berharap tubuhku dipinjamkan kepada para penghutang dan agar ciptaan ini taat kepada Allah. Ia berkata kepada mereka yang bertanya tentang garis keturunan: Siapapun yang telah Allah berkati dengan Islam."
