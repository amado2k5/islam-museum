summary:
  ar: "أبو عبد الرحمن زهير بن نميم البابي، داعية، غلب عليه الصبر واليقين، فأُيّد بالنصر والتمكين. قال: لا يتم هذا الأمر إلا بشيئين: الصبر واليقين، فإن كان يقين بلا صبر لم يتم، وإن كان صبر بلا يقين لم يتم. وكان يقول: وددت أن جسدي قُرض بالمقارض وأن هذا الخلق أطاعوا الله، وقال لمن سأله عن النسب: من أنعم الله عليه بالإسلام."
  en: "Abu Abd al-Rahman Zuhayr ibn Numayr al-Babi, a preacher whose life was given to patience and certainty, and who was aided with victory and firm standing; he said this matter is not completed except by two things, patience and certainty, and that certainty without patience or patience without certainty is not complete; he wished his body were cut with shears so that people would obey God; asked about his lineage, he said: I am one whom God blessed with Islam."
  ur: "ابو عبد الرحمن زہیر بن نمیم بابی داعی تھے، جن کی زندگی پر صبر اور یقین غالب تھا، اور انہیں نصرت اور استقامت عطا ہوئی۔ انہوں نے کہا کہ یہ معاملہ صرف دو چیزوں سے مکمل ہوتا ہے: صبر اور یقین؛ یقین بغیر صبر کے اور صبر بغیر یقین کے مکمل نہیں ہوتا۔ وہ چاہتے تھے کہ ان کا جسم قینچیوں سے کاٹا جائے تاکہ لوگ اللہ کی اطاعت کریں۔ نسب پوچھا گیا تو کہا: میں وہ ہوں جس پر اللہ نے اسلام کی نعمت کی۔"
