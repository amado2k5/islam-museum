summary:
  ar: "أبو الحسن علي بن الحسن البلخي الحنفي الواعظ الزاهد الملقب برهان الدين؛ درس بالصادرية ثم جُعلت له دار الأمير طرخان مدرسة وقام عليه الحنابلة لأنه تكلم فيهم، وكان زاهداً معرضاً عن الدنيا وهو الذي قام في إبطال «حي على خير العمل» من حلب وكان معظماً مفخماً في الدولة ودرس أيضاً بمسجد خاتون؛ ترجمته في أخبار سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 628}."
  en: "Abu al-Hasan Ali ibn al-Hasan al-Balkhi, the Hanafi preacher and ascetic called Burhan al-Din; he lectured at the Sadiriyya until the amir Turkhan's house was made his madrasa — the Hanbalis rose against him for speaking of them; an ascetic who turned from the world, it was he who rose to abolish the 'hayya ala khayr al-amal' call at Aleppo, a grandee of state who also lectured at Khatun's mosque; his notice falls in year 548 {cite:shadharat-dhahab p. 628}."
