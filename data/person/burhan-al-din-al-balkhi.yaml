names:
  - { value: "أبو الحسن علي بن الحسن البلخي الحنفي الواعظ الزاهد برهان الدين", kind: full }
summary:
  ar: "أبو الحسن علي بن الحسن البلخي الحنفي الواعظ الزاهد الملقب برهان الدين؛ درس بالصادرية ثم جُعلت له دار الأمير طرخان مدرسة وقام عليه الحنابلة لأنه تكلم فيهم، وكان زاهداً معرضاً عن الدنيا وهو الذي قام في إبطال «حي على خير العمل» من حلب وكان معظماً مفخماً في الدولة ودرس أيضاً بمسجد خاتون؛ ترجمته في أخبار سنة ثمان وأربعين وخمسمائة {cite:shadharat-dhahab p. 628}."
  en: "Abu al-Hasan Ali ibn al-Hasan al-Balkhi, the Hanafi preacher and ascetic called Burhan al-Din; he lectured at the Sadiriyya until the amir Turkhan's house was made his madrasa — the Hanbalis rose against him for speaking of them; an ascetic who turned from the world, it was he who rose to abolish the 'hayya ala khayr al-amal' call at Aleppo, a grandee of state who also lectured at Khatun's mosque; his notice falls in year 548 {cite:shadharat-dhahab p. 628}."
  es: "Abu al-Hasan Ali ibn al-Hasan al-Balkhi, el predicador y asceta hanafí llamado Burhan al-Din; dio conferencias en la Sadiriyya hasta que la casa del emir Turkhan se convirtió en su madrasa; los hanbalíes se alzaron contra él por hablar de ellos; un asceta que se apartó del mundo, fue él quien se levantó para abolir el llamado 'hayya ala khayr al-amal' en Alepo, un gran señor del estado que también dio conferencias en la mezquita de Khatun; su mención se encuentra en el año 548 {cite:shadharat-dhahab p. 628}."
  fr: "Abu al-Hasan Ali ibn al-Hasan al-Balkhi, prédicateur et ascète hanafite surnommé Burhan al-Din, enseigna à la Sadiriyya jusqu'à ce que la maison de l'émir Turkhan devienne sa madrasa. Les Hanbalites se soulevèrent contre lui pour avoir parlé d'eux. Ascète renoncé au monde, c'est lui qui s'opposa à l'abolition du cri « hayya ala khayr al-amal » à Alep. Grand dignitaire de l'État, il enseigna également à la mosquée de Khatun. Sa mention date de l'an 548 {cite: shadharat-dhahab p. 628}."
  ur: "ابو الحسن علی ابن الحسن البالخی، حنفی مبلغ اور سنیاسی جسے برہان الدین کہا جاتا ہے۔ اس نے سدیریہ میں اس وقت تک لیکچر دیا جب تک کہ امیر ترکھان کے گھر کو اس کا مدرسہ نہ بنا دیا گیا - حنبلی ان کے بارے میں بات کرنے پر اس کے خلاف اٹھ کھڑے ہوئے۔ ایک سنیاسی جس نے دنیا سے منہ موڑ لیا، یہ وہی تھا جو حلب میں 'حیا الا خیر العمل' پکار کو ختم کرنے کے لیے اٹھ کھڑا ہوا، ریاست کا ایک عظیم الشان جس نے خاتون کی مسجد میں لیکچر بھی دیا۔ اس کا نوٹس 548 میں آتا ہے۔ 628}۔"
  tr: "Ebu el-Hasan Ali ibn el-Hasan el-Balkhi el-Hanafi, Burhan al-Din olarak bilinen münzevi vaiiz; Sadriyyah'da eğitim gördü, ardından Prens Tarxan'ın evi onun için yapıldı ve Hanbalılar onu konuştuğu için yerleştirdiler. O bir münzeviydi ve dünyadan kopuktu. Halep'ten 'Hayya 'ala hayr al-'amal'ı geçersiz kılan kişiydi, devlette seçkin ve seçkin bir figürdü ve ayrıca Hatun Camii'nde ders verdi; biyografisi 548 Hicri yılında Akhbar'da {atıf:şadharat-dhahab, s. 628}."
  id: "Abu al-Hasan Ali ibn al-Hasan al-Balkhi al-Hanafi, seorang pertapa yang dikenal sebagai Burhan al-Din; ia belajar di Sadriyyah, kemudian rumah Pangeran Tarkhan dibuat untuknya, dan para Hanbal mendirikannya karena ia berbicara tentang mereka. Ia adalah seorang pertapa dan terlepas dari dunia. Dialah yang membatalkan 'Hayya 'ala khayr al-'amal' dari Aleppo, merupakan sosok terkemuka dan terhormat di negara bagian, dan juga mengajar di Masjid Khatun; biografinya di Akhbar tahun 548 H {cite:shadharat-dhahab, hlm. 628}."
