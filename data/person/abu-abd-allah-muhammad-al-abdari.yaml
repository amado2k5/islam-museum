id: person/abu-abd-allah-muhammad-al-abdari
class: person
label:
  ar: "أبو عبد الله محمد العبدري"
  en: "Abu Abd Allah Muhammad al-Abdari"
  ur: "ابو عبداللہ محمد العبدری"
  fr: "Abu Abd Allah Muhammad al-Abdari"
  es: "Abu Abd Allah Muhammad al-Abdari"
summary:
  ar: "أبو عبد الله محمد بن محمود العبدري، رحّالة مغربي صاحب الرحلة المغربية، وهي من أهم وثائق تاريخ العلم في المغرب والمغرب الأوسط في القرن السابع الهجري، تحكي رحلته وقد بدأها في ذي القعدة سنة 688هـ. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  en: "Abu Abd Allah Muhammad al-Abdari, a Maghribi traveller and author of the Rihla al-Maghribiyya, a record of his journey that began in Dhu l-Qa'da 688/1289 and is a main source for the history of scholarship in the Maghrib. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  ur: "ابو عبداللہ محمد العبدری، مغربی سیاح اور رحلہ المغربیہ کے مصنف، جو 688ھ/1289ء کے ذی القعدہ میں شروع ہوا اور مغرب کی علمی تاریخ کا اہم ماخذ ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  fr: "Abu Abd Allah Muhammad al-Abdari, voyageur maghrébin et auteur de la Rihla al-Maghribiyya, récit de son voyage commencé en Dhu l-Qa'da 688/1289 et source principale de l'histoire de l'érudition au Maghreb. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  es: "Abu Abd Allah Muhammad al-Abdari, viajero magrebí y autor de la Rihla al-Maghribiyya, un relato de su viaje que comenzó en Dhu l-Qa'da 688/1289 y que constituye una fuente principal para la historia de la erudición en el Magreb. {cite:encyclopaedia-of-islam-2 vol. 1p. 115}"
  tr: "Faslı seyyah ve Fas Yolculuğu adlı eserin yazarı Ebu Abdullah Muhammed ibn Mahmud el-Abdari, Hicri yedinci yüzyılda Fas ve Orta Mağrip'teki bilim tarihinin en önemli belgelerinden biridir. Eser, Hicri 688 yılının Zilhicce ayında başladığı yolculuğunu anlatmaktadır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  id: "Abu Abdullah Muhammad ibn Mahmud al-Abdari, seorang penjelajah Maroko dan penulis karya Perjalanan Maroko, adalah salah satu dokumen terpenting dalam sejarah ilmu pengetahuan di Maroko dan Maghreb tengah selama abad ketujuh Hijriah. Karya ini menceritakan perjalanannya, yang dimulai pada Dzul Qi'dah 688 Hijriah. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
