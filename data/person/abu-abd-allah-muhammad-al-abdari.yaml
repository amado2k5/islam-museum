summary:
  ar: "أبو عبد الله محمد بن محمود العبدري، رحّالة مغربي صاحب الرحلة المغربية، وهي من أهم وثائق تاريخ العلم في المغرب والمغرب الأوسط في القرن السابع الهجري، تحكي رحلته وقد بدأها في ذي القعدة سنة 688هـ. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  en: "Abu Abd Allah Muhammad al-Abdari, a Maghribi traveller and author of the Rihla al-Maghribiyya, a record of his journey that began in Dhu l-Qa'da 688/1289 and is a main source for the history of scholarship in the Maghrib. {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
  ur: "ابو عبداللہ محمد العبدری، مغربی سیاح اور رحلہ المغربیہ کے مصنف، جو 688ھ/1289ء کے ذی القعدہ میں شروع ہوا اور مغرب کی علمی تاریخ کا اہم ماخذ ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 115}"
