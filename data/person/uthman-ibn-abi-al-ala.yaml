summary:
  ar: "شيخ الغزاة بغرناطة أيام بني الأحمر، واتفق بنو الأحمر أن يجعلوا مشيخة الغزاة لواحد من أقارب بني مرين لأنهم أول من ولي الأندلس عند استيلاء بني عمهم على ملك المغرب فلا منافسة بينهم؛ ونقل ابن خلدون ما كتب على قبره أنه عاش ثمانياً وثمانين سنة أنفقها بين روحة وغدوة في سبيل الله حتى استوفى في المشهور سبعمائة واثنتين وثلاثين غزوة، ووصفته كتابة قبره بشيخ الحماة وصدر الأبطال الكماة وأسد الآساد وسيف الجهاد، توفي يوم الأحد الثاني لذي الحجة من عام ثلاثين وسبعمائة {cite:nafh-tib-maqqari p. 488-489}."
  en: "The Nasrids' shaykh al-ghuzat — by convention a Marinid kinsman since they were the first to rule al-Andalus for their cousins — whose epitaph Ibn Khaldun copied: eighty-eight years spent 'between a dawn ride and an evening raid', seven hundred and thirty-two recorded ghazwas, dying on Sunday 2 Dhu al-Hijja 730 with his sword still drawn over the king of the Rum {cite:nafh-tib-maqqari p. 488-489}."
