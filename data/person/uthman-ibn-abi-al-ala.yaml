summary:
  ar: "شيخ الغزاة بغرناطة أيام بني الأحمر، واتفق بنو الأحمر أن يجعلوا مشيخة الغزاة لواحد من أقارب بني مرين لأنهم أول من ولي الأندلس عند استيلاء بني عمهم على ملك المغرب فلا منافسة بينهم؛ ونقل ابن خلدون ما كتب على قبره أنه عاش ثمانياً وثمانين سنة أنفقها بين روحة وغدوة في سبيل الله حتى استوفى في المشهور سبعمائة واثنتين وثلاثين غزوة، ووصفته كتابة قبره بشيخ الحماة وصدر الأبطال الكماة وأسد الآساد وسيف الجهاد، توفي يوم الأحد الثاني لذي الحجة من عام ثلاثين وسبعمائة {cite:nafh-tib-maqqari p. 488-489}."
  en: "The Nasrids' shaykh al-ghuzat — by convention a Marinid kinsman since they were the first to rule al-Andalus for their cousins — whose epitaph Ibn Khaldun copied: eighty-eight years spent 'between a dawn ride and an evening raid', seven hundred and thirty-two recorded ghazwas, dying on Sunday 2 Dhu al-Hijja 730 with his sword still drawn over the king of the Rum {cite:nafh-tib-maqqari p. 488-489}."
  es: "El shaykh al-ghuzat de los nazaríes —por convención un pariente mariní, ya que fueron los primeros en gobernar al-Ándalus para sus primos— cuyo epitafio copió Ibn Khaldun: ochenta y ocho años pasados \"entre un paseo al amanecer y una incursión al atardecer\", setecientos treinta y dos ghazwas registrados, muriendo el domingo 2 de Dhu al-Hijja 730 con su espada aún desenvainada sobre el rey de Rum {cite:nafh-tib-maqqari p. 488-489}."
  fr: "Le cheikh al-ghuzat des Nasrides — par convention un parent mérinide puisqu'ils furent les premiers à gouverner al-Andalus pour leurs cousins — dont Ibn Khaldun a copié l'épitaphe: quatre-vingt-huit ans passés « entre une chevauchée à l'aube et un raid au soir », sept cent trente-deux ghazwas enregistrés, mourant le dimanche 2 Dhu al-Hijja 730 avec son épée encore tirée au-dessus du roi du Rum {cite: nafh-tib-maqqari p. 488-489}."
  ur: "نصریوں کے شیخ الغزت - کنونشن کے ذریعہ ایک مرینی رشتہ دار چونکہ وہ اپنے چچازاد بھائیوں کے لئے اندلس پر حکمرانی کرنے والے پہلے تھے - جس کا تصنیف ابن خلدون نے نقل کیا ہے: 88 سال 'صبح کی سواری اور شام کے چھاپے کے درمیان' گزارے، جو 7 سو بتیس ذوالحجہ کو اتوار کو ریکارڈ کیے گئے۔ الحجہ 730 میں اپنی تلوار اب بھی روم کے بادشاہ پر کھینچی ہوئی ہے۔ 488-489}۔"
