summary:
  ar: "محمد بن عبد الواحد بن محمد بن عمر بن الميمون الدارمي البغدادي، أبو الفرج، صاحب كتاب الاستذكار الذي جمعه في صباه من كتب أصحاب الشافعي، ووصفه ابن الصلاح بأنه نفيس كثير الفوائد ذو نوادر وغرائب لا يصلح مطالعته إلا لعارف بالمذهب، وله أيضاً شرح الدور الحكمي. ولد يوم السبت الخامس والعشرين من شوال سنة 358، ومات بدمشق يوم الجمعة أول ذي القعدة سنة 448 {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  en: "Muhammad ibn Abd al-Wahid al-Darimi of Baghdad, Abu'l-Faraj (b. 25 Shawwal 358, d. Damascus 1 Dhu'l-Qa'da 448) — author of Kitab al-Istidhkar, which he collected in his youth from the books of al-Shafi'i's companions; Ibn al-Salah called it 'a precious work rich in benefits, rarities and curiosities, fit only for one who knows the madhhab'; he also wrote a commentary on al-Dawr al-Hukmi {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  fr: "Muhammad ibn Abd al-Wahid al-Darimi de Bagdad, Abu'l-Faraj (né le 25 chawwal 358 H, mort à Damas le 1er dhou al-qi'da 448 H), auteur du Kitab al-Istidhkar, qu'il compila jeune à partir des livres des disciples d'al-Shafi'i ; Ibn al-Salah le qualifia d'« ouvrage précieux, riche en enseignements, raretés et curiosités, convenant seulement à qui connaît le madhhab » ; il écrivit aussi un commentaire d'al-Dawr al-Hukmi {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  ur: "محمد بن عبد الواحد دارمی بغدادی، ابو الفرج ⁦(پ 358ھ، مت دمشق 448ھ)⁩ — کتاب الاستذکار کے مصنف جو انہوں نے جوانی میں امام شافعی کے اصحاب کی کتابوں سے جمع کی؛ ابن صلاح نے اسے مذهب کے جانکار کے لیے انمول قرار دیا؛ الدور الحکمی کی شرح بھی لکھی {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  es: "Muhammad ibn Abd al-Wahid al-Darimi de Bagdad, Abu'l-Faraj (n. 25 Shawwal 358, m. Damasco 1 Dhu'l-Qa'da 448) — autor de Kitab al-Istidhkar, que recopiló en su juventud de los libros de los compañeros de al-Shafi'i; Ibn al-Salah lo llamó 'una obra preciosa rica en beneficios, rarezas y curiosidades, apta solo para quien conoce la madhhab'; también escribió un comentario sobre al-Dawr al-Hukmi {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  tr: "Muhammed ibn Abdülvahid ibn Muhammed ibn Ömer ibn el-Meymun el-Darimi el-Bağdadi, Ebu el-Faraj, gençliğinde Şafiî mezhebinin kitaplarından derlediği el-İstidhkar adlı eserin yazarıdır. İbn el-Salah, bu eseri, nadir ve alışılmadık bilgiler içeren, yalnızca Şafiî mezhebini iyi bilenler için uygun, kıymetli ve son derece faydalı bir eser olarak tanımlamıştır. Ayrıca el-Davr el-Hakami üzerine bir tefsir de yazmıştır. Hicri 358 yılının Şevval ayının 25. Cumartesi günü doğmuş ve Hicri 448 yılının Zilhicce ayının 1. Cuma günü Şam'da vefat etmiştir."
  id: "Muhammad ibn Abd al-Wahid ibn Muhammad ibn Umar ibn al-Maymun al-Darimi al-Baghdadi, Abu al-Faraj, penulis kitab al-Istidhkar, yang disusunnya di masa mudanya dari kitab-kitab mazhab Syafi'i. Ibn al-Salah menggambarkannya sebagai karya yang berharga dan sangat bermanfaat, berisi wawasan yang langka dan luar biasa, hanya cocok bagi mereka yang mahir dalam mazhab Syafi'i. Ia juga menulis komentar atas kitab al-Dawr al-Hakami. Ia lahir pada hari Sabtu, tanggal 25 Syawal 358 H, dan wafat di Damaskus pada hari Jumat, tanggal 1 Dzul Qi'dah 448 H."
