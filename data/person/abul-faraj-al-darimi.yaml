roles: [scholar]
gender: male
summary:
  ar: "محمد بن عبد الواحد بن محمد بن عمر بن الميمون الدارمي البغدادي، أبو الفرج، صاحب كتاب الاستذكار الذي جمعه في صباه من كتب أصحاب الشافعي، ووصفه ابن الصلاح بأنه نفيس كثير الفوائد ذو نوادر وغرائب لا يصلح مطالعته إلا لعارف بالمذهب، وله أيضاً شرح الدور الحكمي. ولد يوم السبت الخامس والعشرين من شوال سنة 358، ومات بدمشق يوم الجمعة أول ذي القعدة سنة 448 {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  en: "Muhammad ibn Abd al-Wahid al-Darimi of Baghdad, Abu'l-Faraj (b. 25 Shawwal 358, d. Damascus 1 Dhu'l-Qa'da 448) — author of Kitab al-Istidhkar, which he collected in his youth from the books of al-Shafi'i's companions; Ibn al-Salah called it 'a precious work rich in benefits, rarities and curiosities, fit only for one who knows the madhhab'; he also wrote a commentary on al-Dawr al-Hukmi {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
  ur: "محمد بن عبد الواحد دارمی بغدادی، ابو الفرج (پ 358ھ، مت دمشق 448ھ) — کتاب الاستذکار کے مصنف جو انہوں نے جوانی میں امام شافعی کے اصحاب کی کتابوں سے جمع کی؛ ابن صلاح نے اسے مذهب کے جانکار کے لیے انمول قرار دیا؛ الدور الحکمی کی شرح بھی لکھی {cite:tabaqat-shafiiyya-subki j.3 p.77-78}."
