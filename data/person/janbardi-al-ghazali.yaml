summary:
  ar: "جانبردي الغزالي؛ كان في الدولة الجركسية كافل حماة ثم دمشق، وخامر على الغوري ووعده السلطان سليم بنيابة دمشق، ومع هذا فإنه لما فرّ من ميسرة الغوري بمرج دابق مخامراً رجع إلى مصر ولحق بطومان باي وأعانه على السلطان سليم، ولما افتتح السلطان سليم مصر ثبت على ميثاقه ووعده وولّاه نيابة الشام؛ فأعاد الشهود إلى مراكزهم على عادتهم في الدولة الجركسية، ونشر العدل في دمشق وأعمالها وأبطل ما كان حدث بها من المكس ومنع البوابين أن يأخذوا شيئاً من الداخلين إلى المدينة وجرد السيف على كل من تعرض من الروم لامرأة أو صبي، وكتب بذلك إلى السلطان سليم وأخبره أن دمشق غير معتادة لشيء من ذلك {cite:shadharat-dhahab p. 557}."
  en: "The Circassian commander who defected at Marj Dabiq — kafil of Hama then Damascus under al-Ghuri, he had secretly pledged himself to Selim for Damascus's niaba; yet after fleeing the sultan's wing he still joined Tuman Bay against Selim until Egypt fell, then held Damascus for the Ottomans, restoring the witnesses, abolishing the mukus tolls and barring even Ottoman troops from molesting women and children {cite:shadharat-dhahab p. 557}."
