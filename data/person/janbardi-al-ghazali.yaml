summary:
  ar: "جانبردي الغزالي؛ كان في الدولة الجركسية كافل حماة ثم دمشق، وخامر على الغوري ووعده السلطان سليم بنيابة دمشق، ومع هذا فإنه لما فرّ من ميسرة الغوري بمرج دابق مخامراً رجع إلى مصر ولحق بطومان باي وأعانه على السلطان سليم، ولما افتتح السلطان سليم مصر ثبت على ميثاقه ووعده وولّاه نيابة الشام؛ فأعاد الشهود إلى مراكزهم على عادتهم في الدولة الجركسية، ونشر العدل في دمشق وأعمالها وأبطل ما كان حدث بها من المكس ومنع البوابين أن يأخذوا شيئاً من الداخلين إلى المدينة وجرد السيف على كل من تعرض من الروم لامرأة أو صبي، وكتب بذلك إلى السلطان سليم وأخبره أن دمشق غير معتادة لشيء من ذلك {cite:shadharat-dhahab p. 557}. ويذكر الصلابي أنه في عهد سليمان القانوني قام والياً على الشام بتمرد على الدولة وأعلن العصيان وحاول الاستيلاء على حلب ففشل، فقُمعت الفتنة وقُطع رأسه وأُرسل إلى إسطنبول دلالة على انتهاء التمرد {cite:dawlat-uthmaniyya-salabi p. 200}."
  en: "The Circassian commander who defected at Marj Dabiq — kafil of Hama then Damascus under al-Ghuri, he had secretly pledged himself to Selim for Damascus's niaba; yet after fleeing the sultan's wing he still joined Tuman Bay against Selim until Egypt fell, then held Damascus for the Ottomans, restoring the witnesses, abolishing the mukus tolls and barring even Ottoman troops from molesting women and children {cite:shadharat-dhahab p. 557}."
  es: "El comandante circasiano que desertó en Marj Dabiq —cafil de Hama y luego Damasco bajo al-Ghuri— se había comprometido secretamente con Selim para obtener el niaba de Damasco; sin embargo, después de huir del ala del sultán, se unió a Tuman Bay contra Selim hasta la caída de Egipto, y luego mantuvo Damasco para los otomanos, restaurando a los testigos, aboliendo los peajes mukus e impidiendo incluso que las tropas otomanas abusaran de mujeres y niños {cite:shadharat-dhahab p. 557}."
  fr: "Le commandant circassien qui fit défection à Marj Dabiq — kafil de Hama puis Damas sous al-Ghuri, s'était secrètement engagé envers Selim pour la niaba de Damas; pourtant, après avoir fui l'aile du sultan, il rejoignit toujours la baie de Tuman contre Selim jusqu'à la chute de l'Égypte, puis tint Damas pour les Ottomans, rétablissant les témoins, abolissant les péages mukus et interdisant même aux troupes ottomanes de molester les femmes et les enfants {cite:shadharat-dhahab p. 557}."
  ur: "سرکاسی کمانڈر جو مرج دابیق میں منحرف ہو گیا تھا - حما کا کفیل پھر الغوری کے ماتحت دمشق، اس نے خفیہ طور پر دمشق کے نیابہ کے لیے سیلم سے عہد کر لیا تھا۔ پھر بھی سلطان کے بازو سے بھاگنے کے بعد بھی وہ سیلم کے خلاف تومان خلیج میں شامل ہو گیا یہاں تک کہ مصر گر گیا، پھر عثمانیوں کے لیے دمشق پر قبضہ کر لیا، گواہوں کو بحال کیا، مکس ٹولوں کو ختم کیا اور یہاں تک کہ عثمانی فوجوں کو عورتوں اور بچوں کے ساتھ بدتمیزی کرنے سے روک دیا۔ 557}۔"
  tr: "Janbardi el-Gazali, önce Çerkes devletinde Hama'nın ve ardından Şam'ın garantörüydü. El-Ghuri'nin savaş ağası idi ve Sultan Selim ona Şam'ın vekilliğini vaat etti. Buna rağmen, Mukhamar'daki Marj Dabiq'te Ghuri'nin solundan kaçtığında Mısır'a döndü, Tuman Bey'e katıldı ve Sultan Selim'e karşı ona yardım etti. Sultan Selim Mısır'ı fethettiğinde, antlaşma ve sözünü tuttu ve onu Levant yardımcısı olarak atadı. Tanıkları Çerkes devletindeki olağan pozisyonlarına geri getirdi, Şam'da adaleti tesis etti, mevcut gelenekleri iptal etti, kapı bekçilerinin şehre girenlerden bir şey almasını engelledi ve Romalılardan bir kadına ya da çocuğa zarar verenlere karşı kılıç çekti. Sultan Selim'e yazdı ve Şam'ın böyle şeylere alışık olmadığını söyledi {alıntı::Shadharat-Dhahab, s. 557}. El-Sallabi, Süleyman Yüce döneminde devlete karşı isyan ettiğini, isyan ilan ettiğini, Halep'i ele geçirmeye çalıştığını ancak başarısız olduğunu belirtir. İsyan bastırıldı, başı kesildi ve İstanbul'a isyanın sona erdiğini bildiren bir mesaj gönderildi {atıf:dawlat-uthmaniyya-salabi, s. 200}."
  id: "Janbardi al-Ghazali adalah penjamin Hama dan kemudian Damaskus di negara Circassia. Ia adalah panglima perang bagi al-Ghuri, dan Sultan Selim menjanjikan kepadanya sebagai wakil Damaskus. Namun, ketika ia melarikan diri dari kiri Ghuri di Marj Dabiq di Mukhamar, ia kembali ke Mesir, bergabung dengan Tuman Bey, dan membantunya melawan Sultan Selim. Ketika Sultan Selim menaklukkan Mesir, ia menepati perjanjian dan janjinya serta mengangkatnya sebagai wakil wakil Levant. Ia mengembalikan para saksi ke posisi biasa mereka di negara Circassia, menegakkan keadilan di Damaskus dan urusannya, membatalkan adat yang telah terjadi, mencegah penjaga gerbang mengambil apa pun dari mereka yang masuk ke kota, dan menghunus pedang terhadap siapa pun dari Romawi yang menyakiti wanita atau anak laki-laki. Ia menulis kepada Sultan Selim dan memberitahunya bahwa Damaskus tidak terbiasa dengan hal-hal seperti itu {cite:shadharat-dhahab, hlm. 557}. Al-Sallabi menyebutkan bahwa selama masa pemerintahan Suleiman yang Agung, ia memberontak melawan negara, menyatakan pemberontakan, mencoba merebut Aleppo, namun gagal. Hasutan itu berhasil dipadamkan, kepalanya dipenggal, dan sebuah pesan dikirim ke Istanbul menandai berakhirnya pemberontakan {cite:dawlat-uthmaniyya-salabi, hlm. 200}."
