summary:
  ar: "محمد بن حسن اللقاني، ناصر الدين، أبو عبد الله، من أهل مصر، فقيه مالكي وأصولي، انتهت إليه رئاسة العلم بمصر بعد موت أخيه الشمس اللقاني، واستفتي من سائر الأقاليم. له طرر ⁦(حواش)⁩ على التوضيح، وحاشية على شرح المحلي على جمع الجوامع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  en: "Muhammad ibn Hasan al-Laqani, Nasir al-Din, Abu Abd Allah, of Egypt, a Maliki jurist and usuli. After his brother Shams al-Din died, the leadership of learning in Egypt passed to him, and he was consulted from every region. He wrote glosses on al-Tawdih and a gloss on al-Mahalli's commentary on Jam' al-jawami'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  es: "Muhammad ibn Hasan al-Laqani, Nasir al-Din, Abu Abd Allah, de Egipto, fue un jurista malikí y usuli. Tras la muerte de su hermano Shams al-Din, el liderazgo del saber en Egipto recayó sobre él, y era consultado desde todas las regiones. Escribió glosas sobre al-Tawdih y una glosa sobre el comentario de al-Mahalli sobre Jam' al-jawami'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  fr: "Muhammad ibn Hasan al-Laqani, également connu sous les noms de Nasir al-Din et Abu Abd Allah, était un juriste et usuli malikite d'Égypte. Après la mort de son frère Shams al-Din, il hérita de la direction du savoir en Égypte et fut consulté dans toutes les régions. Il rédigea des gloses sur al-Tawdih et une glose sur le commentaire d'al-Mahalli concernant Jam' al-jawami'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  ur: "محمد بن حسن لقانی، ناصر الدین، ابو عبد اللہ، مصر، مالکی فقیہ اور اصولی۔ اس کے بھائی شمس الدین کے انتقال کے بعد، مصر میں علم کی قیادت اس کے پاس گئی، اور ہر علاقے سے اس سے مشورہ لیا گیا۔ انہوں نے التویدیح پر تالیفات اور جام الجوامی پر المحلی کی تفسیر پر تالیف لکھی۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1641}"
  tr: "Muhammed bin Hasan el-Laqani, Nasir al-Din, Ebu Abdullah, Mısır'dan, Maliki hukukçusu ve usul alimi, kardeşi El-Şems el-Laqani'nin ölümünden sonra Mısır'da bilginin liderliğini üstlendi ve diğer bölgelerden dini görüşler aradı. Açıklama için kenar notlar ve Mühalla'nın Jam'el-Cavami' üzerine yorumu üzerine kenar notları yazdı. {Alıntı:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.1641}"
  id: "Muhammad ibn Hasan al-Laqani, Nasir al-Din, Abu Abdullah, dari Mesir, seorang ahli hukum Maliki dan ulama usul, mengambil alih kepemimpinan ilmu pengetahuan di Mesir setelah kematian saudaranya Al-Shams al-Laqani, dan ia mencari pendapat agama dari wilayah lain. Ia menulis catatan pinggir tentang klarifikasi dan catatan pinggir atas komentar Al-Mahalla atas Jam' al-Jawami'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1641}"
