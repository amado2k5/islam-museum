summary:
  ar: "محمد بن حسن اللقاني، ناصر الدين، أبو عبد الله، من أهل مصر، فقيه مالكي وأصولي، انتهت إليه رئاسة العلم بمصر بعد موت أخيه الشمس اللقاني، واستفتي من سائر الأقاليم. له طرر (حواش) على التوضيح، وحاشية على شرح المحلي على جمع الجوامع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
  en: "Muhammad ibn Hasan al-Laqani, Nasir al-Din, Abu Abd Allah, of Egypt, a Maliki jurist and usuli. After his brother Shams al-Din died, the leadership of learning in Egypt passed to him, and he was consulted from every region. He wrote glosses on al-Tawdih and a gloss on al-Mahalli's commentary on Jam' al-jawami'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1641}"
