summary:
  ar: "داعية وكاتب إندونيسي، وُلد في 24 يناير 1984 في مدينة أمبون. تخرّج في الهندسة الكيميائية في جامعة غاجاه مادا، ونال الماجستير من جامعة الملك سعود بالرياض، والدكتوراه في إدارة التعليم من جامعة يوجياكارتا الحكومية سنة 2024. أسّس موقع رومايشو الديني ويرأس معهد دار الشالحين في غونونغكيدول، وتصل دروسه إلى جمهور واسع عبر قناة رومايشو تي في على يوتيوب التي بلغت 394,000 مشترك بحسب youtubers.me في نوفمبر 2026."
  en: "Indonesian preacher and writer, born on 24 January 1984 in the city of Ambon. He graduated in chemical engineering from Gadjah Mada University, took a master's degree at King Saud University in Riyadh, and a doctorate in education management at Yogyakarta State University in 2024. He founded the Rumaysho religious website and heads Pondok Pesantren Darush Sholihin in Gunungkidul; his teaching reaches a wide audience through the Rumaysho TV YouTube channel, which counted 394,000 subscribers by youtubers.me in November 2026."
  ur: "انڈونیشیائی مبلغ اور مصنف، جو 24 جنوری 1984ء کو امبون شہر میں پیدا ہوا۔ اس نے گاجاہ مادا یونیورسٹی سے کیمیکل انجینئرنگ میں گریجویشن، ریاض کی شاہ سعود یونیورسٹی سے ماسٹرز اور 2024ء میں یوگیاکارتا اسٹیٹ یونیورسٹی سے تعلیمی انتظام میں ڈاکٹریٹ کی۔ اس نے رومیشو دینی ویب سائٹ قائم کی اور گونونگ کیدول میں دار الشالحین مدرسے کا سربراہ ہے؛ اس کی تعلیم یوٹیوب کے رومیشو ٹی وی چینل کے ذریعے وسیع سامعین تک پہنچتی ہے جس کے سبسکرائبر youtubers.me کے مطابق نومبر 2026ء میں 394,000 تھے۔"
  es: "Predicador y escritor indonesio, nacido el 24 de enero de 1984 en la ciudad de Ambon. Se graduó en ingeniería química por la Universidad Gadjah Mada, obtuvo una maestría en la Universidad Rey Saud de Riad y un doctorado en gestión educativa por la Universidad Estatal de Yogyakarta en 2024. Fundó el sitio web religioso Rumaysho y dirige el Pondok Pesantren Darush Sholihin en Gunungkidul; sus enseñanzas llegan a un amplio público a través del canal de YouTube Rumaysho TV, que contaba con 394 000 suscriptores según youtubers.me en noviembre de 2026."
  fr: "Prédicateur et écrivain indonésien, né le 24 janvier 1984 à Ambon. Diplômé en génie chimique de l'université Gadjah Mada, il est également titulaire d'une maîtrise de l'université du Roi Saoud à Riyad et d'un doctorat en gestion de l'éducation de l'université d'État de Yogyakarta (2024). Il a fondé le site web religieux Rumaysho et dirige le Pondok Pesantren Darush Sholihin à Gunungkidul. Ses enseignements sont diffusés à un large public via la chaîne YouTube Rumaysho TV, qui comptait 394 000 abonnés selon youtubers.me en novembre 2026."
  tr: "24 Ocak 1984'te Ambon şehrinde doğan Endonezyalı vaiz ve yazardır. Gajah Mada Üniversitesi'nden kimya mühendisliği mezunu, Riyad'daki King Saud Üniversitesi'nden yüksek lisans derecesi ve 2024'te Yogyakarta Devlet Üniversitesi'nden eğitim yönetimi alanında doktora derecesi almıştır. Romaisho dini sitesini kurdu ve Gunungkidol'daki Dar Al-Shalaheen Enstitüsü'nün başkanlığını yürütmektedir. Dersleri, Kasım 2026'da youtubers.me'a göre 394.000 aboneye ulaşan Romaisho TV'nin YouTube kanalı aracılığıyla geniş bir kitleye ulaşmaktadır."
  id: "Seorang pengkhotbah dan penulis Indonesia, lahir pada 24 Januari 1984 di kota Ambon. Ia lulus di bidang teknik kimia dari Universitas Gajah Mada, meraih gelar magister dari Universitas King Saud di Riyadh, dan gelar PhD administrasi pendidikan dari Universitas Negeri Yogyakarta pada tahun 2024. Ia mendirikan situs keagamaan Romaisho dan memimpin Institut Dar Al-Shalaheen di Gunungkidol. Pelajarannya menjangkau audiens luas melalui saluran YouTube Romaisho TV, yang menurut youtubers.me mencapai 394.000 pelanggan pada November 2026."
