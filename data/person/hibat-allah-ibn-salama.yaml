id: person/hibat-allah-ibn-salama
class: person
label: { ar: "أبو القاسم هبة الله بن سلامة المفسر الضرير" }
summary:
  ar: "هبة الله بن سلامة بن نصر أبو القاسم البغدادي الضرير المفسر، كان من أحفظ الناس لتفسير القرآن، وله حلقة مشهورة في جامع المنصور، وصنف كتاب الناسخ والمنسوخ المشهور. سمع الحديث من أبي بكر أحمد بن جعفر بن مالك القطيعي وغيره، وتوفي ببغداد في رجب سنة عشر وأربعمائة {cite:muntazam-ibn-al-jawzi j.7 p.295}."
  tr: "Hibatullah ibn Salama ibn Nasr Abu al-Kasim al-Baghdadi al-Darir al-Qur'an, Kur'an yorumunda en çok ezberlenen kişilerden biriydi. El-Mensur Camii'nde ünlü bir çevresi vardı ve ünlü 'El-Nasik ve el-Abroçu' adlı kitabı yazdı. Ebu Bekir Ahmed bin Ca'far ibn Malik al-Qutai'i ve diğerlerinden hadis duydu ve dört yüz on yılında Bağdat'ta Recep'te öldü {cite:Muntazam-ibn-al-Jawzi j.7 s.295}."
  id: "Hibatullah ibn Salama ibn Nasr Abu al-Qasim al-Baghdadi al-Darir al-Qur'an, termasuk yang paling dihafal dalam penafsiran Al-Qur'an. Ia memiliki lingkaran terkenal di Masjid Al-Mansur dan menulis buku terkenal 'Al-Nasikh wa al-Abrochu'. Ia mendengar hadis dari Abu Bakr Ahmad ibn Ja'far ibn Malik al-Qutai'i dan lainnya, dan wafat di Baghdad di Rajab pada tahun empat ratus sepuluh {cite:muntazam-ibn-al-jawzi j.7 hlm.295}."
