summary:
  en: "Son of Yasir and Sumayya, a client of Banu Makhzum; he was tortured with his parents and heard the Prophet promise them Paradise — his inclusion among the eighty-three of the second Abyssinian migration is doubtful in the sources."
  ar: "ابن ياسر وسمية، مولى لبني مخزوم؛ عُذّب مع أبويه والنبي يبشّرهم بالجنة، ويُشك في عدّه ضمن الثمانية والثلاثين من مهاجرة الحبشة الثانية.، وعند المسعودي قتله بصفين أبو العادية العاملي وابن جون السكسكي عند المساء وله ثلاث وتسعون سنة وصلى عليه علي ولم يغسله وكان يغير شيبه، واختلف قاتلاه في سلبه إلى عبد الله بن عمرو بن العاص فأبعدهما بحديث النبي ما لهم ولعمار يدعوهم إلى الجنة ويدعونه إلى النار، وتنوزع في نسبه فألحقه بعضهم ببني مخزوم وقال آخرون كان من حلفائهم {cite:muruj-al-dhahab p. 673}"
