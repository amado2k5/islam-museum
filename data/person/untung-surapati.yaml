summary:
  ar: "أونتونغ سوراباتي (نحو 1660 – 1706)، وُلد باسم سوراويراجي في غيلغيل ببالي، بيع عبدًا في باتافيا وهو طفل، ولُقّب «أونتونغ» (المحظوظ) عند مالكه مور، وسُجن لعلاقته بابنة مور سوزان فهرب وقاد رفاقه. خدم الشركة الهولندية ملازمًا ثم انقلب عليها سنة 1684، وآواه بلاط أمانغكورات الثاني في كارتاسورا وقتل رجاله الكابتن تاك سنة 1686، ثم حكم باسوروان بلقب تومينغغونغ ويرانغارا، ومات سنة 1706 وهو يقاتل قوات الشركة وباكوبوونو الأول المشتركة؛ وهو بطل قومي في إندونيسيا منذ 1975."
  en: "Untung Surapati (c. 1660 – 1706), born Surawiraaji at Gelgel, Bali, was sold as a child slave in Batavia, nicknamed Untung ('lucky') under his owner Moor, imprisoned over Moor's daughter Suzanne, and escaped at the head of his fellow prisoners. He served the VOC as a lieutenant, turned against it in 1684, was sheltered by Amangkurat II's court at Kartasura — his men killed Captain Tack there in 1686 — then ruled Pasuruan as Tumenggung Wiranegara, and died in 1706 fighting the joint forces of the VOC and Pakubuwono I; he has been a National Hero of Indonesia since 1975."
  ur: "اونتونگ سوراپاتی (تقریباً 1660ء – 1706ء)، پیدائشی نام سوراویراجی، بالی کے گیلگیل میں پیدا ہوئے، بچپن میں باتاویا میں غلام بن کر بکے، مالک مور کے ہاں «اونتونگ» (خوش قسمت) لقب پایا، مور کی بیٹی سوزان سے تعلق پر قید ہوئے اور ساتھی قیدیوں سمیت فرار ہوئے۔ کمپنی میں لیفٹیننٹ رہے، 1684ء میں اسی کے خلاف اٹھے، کارتاسورا میں امانگکورات دوم کے دربار نے پناہ دی — ان کے آدمیوں نے 1686ء میں کپتان تاک کو قتل کیا — پھر پاسوروان پر تومینگگونگ ویرانیگارا کے لقب سے حکمران رہے، اور 1706ء میں کمپنی اور پاکوبوونو اول کی مشترکہ فوج سے لڑتے ہوئے مارے گئے؛ 1975ء سے انڈونیشیا کے قومی ہیرو ہیں۔"

