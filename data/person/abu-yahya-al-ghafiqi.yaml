summary:
  ar: "أبو يحيى الغافقي المقريء؛ أخذ القراءات عن أبيه وأبي الحسن شريح وطائفة وأقرأ بالإسكندرية والقاهرة واستملى عليه السلطان صلاح الدين وقربه واحترمه وكان فقيهاً مفتياً محدثاً مقرئاً نسابة أخبارياً بديع الخط، وقيل هو أول من خطب بالدعوة العباسية بمصر؛ توفي في رجب سنة خمس وسبعين وخمسمائة {cite:shadharat-dhahab p. 730}."
  en: "Abu Yahya al-Ghafiqi the muqri'; he took the readings from his father and Abu al-Hasan Shurayh, taught Qur'an at Alexandria and Cairo, and Sultan Salah al-Din had him copy manuscripts, drew him near and honoured him — jurist, mufti, muhaddith, genealogist, historian and fine calligrapher; he is said to be the first to preach the Abbasid da'wa in Egypt; d. Rajab 575 {cite:shadharat-dhahab p. 730}."
