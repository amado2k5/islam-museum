summary:
  ar: "أبو يحيى الغافقي المقريء؛ أخذ القراءات عن أبيه وأبي الحسن شريح وطائفة وأقرأ بالإسكندرية والقاهرة واستملى عليه السلطان صلاح الدين وقربه واحترمه وكان فقيهاً مفتياً محدثاً مقرئاً نسابة أخبارياً بديع الخط، وقيل هو أول من خطب بالدعوة العباسية بمصر؛ توفي في رجب سنة خمس وسبعين وخمسمائة {cite:shadharat-dhahab p. 730}."
  en: "Abu Yahya al-Ghafiqi the muqri'; he took the readings from his father and Abu al-Hasan Shurayh, taught Qur'an at Alexandria and Cairo, and Sultan Salah al-Din had him copy manuscripts, drew him near and honoured him — jurist, mufti, muhaddith, genealogist, historian and fine calligrapher; he is said to be the first to preach the Abbasid da'wa in Egypt; d. Rajab 575 {cite:shadharat-dhahab p. 730}."
  fr: "Abu Yahya al-Ghafiqi, le muqri', apprit les lectures auprès de son père et d'Abu al-Hasan Shurayh, enseigna le Coran à Alexandrie et au Caire ; le sultan Salah al-Din lui fit copier des manuscrits, le rapprocha de lui et l'honora. Juriste, mufti, traditionniste, généalogiste, historien et excellent calligraphe, il aurait été le premier à prêcher l'appel abbasside en Égypte ; mort en rajab 575 {cite:shadharat-dhahab p. 730}."
  es: "Abu Yahya al-Ghafiqi el muqri'; tomó las lecturas de su padre y de Abu al-Hasan Shurayh, enseñó el Corán en Alejandría y El Cairo, y el sultán Salah al-Din le hizo copiar manuscritos, lo atrajo y lo honró; jurista, muftí, muhaddith, genealogista, historiador y excelente calígrafo; se dice que fue el primero en predicar la da'wa abasí en Egipto; murió en Rajab de 575 {cita: shadharat-dhahab p. 730}."
  ur: "ابو یحییٰ الغافیقی مقری؛ اس نے اپنے والد اور ابو الحسن شوریح سے قراءت حاصل کی، اسکندریہ اور قاہرہ میں قرآن پڑھایا، اور سلطان صلاح الدین نے اس سے نسخے نقل کروائے، ان کے قریب کیا اور ان کی عزت افزائی کی - فقیہ، مفتی، محدث، نسب دان، مورخ اور عمدہ خطاط؛ کہا جاتا ہے کہ وہ مصر میں عباسی دعوت کی تبلیغ کرنے والے پہلے شخص تھے۔ d رجب 575 {حوالہ: شدّرت ذہب ص 730}۔"
  tr: "Ebu Yahya el-Gafiki el-Mukri’; Kur’an okumalarını babası Ebu el-Hasan Şurayh ve bir grup insandan öğrendi ve İskenderiye ile Kahire'de ders verdi. Sultan Selahaddin ona dikte ettirdi, onu yakın tuttu ve ona saygı duydu. O bir fıkıhçı, müftü, hadis âlimi, kıraatçi, şecere uzmanı, tarihçiydi ve güzel bir eli vardı. Mısır'da Abbasi çağrısını ilk vaaz eden kişi olduğu söylenir. Hicri 575 yılının Receb ayında vefat etti. {kaynak: Şadharat-dhahab s. 730}"
  id: "Abu Yahya al-Ghafiqi al-Muqri’; ia mempelajari bacaan Al-Quran dari ayahnya, Abu al-Hasan Shurayh dan sekelompok orang, dan ia mengajar di Alexandria dan Kairo. Sultan Salah al-Din mendiktekan Al-Quran kepadanya, mendekatkannya, dan menghormatinya. Ia adalah seorang ahli hukum, mufti, sarjana hadits, qari, ahli silsilah, sejarawan, dan memiliki tulisan tangan yang indah. Dikatakan bahwa ia adalah orang pertama yang menyebarkan seruan Abbasiyah di Mesir. Ia meninggal pada bulan Rajab tahun 575 H. {cite:shadharat-dhahab p. 730}."
