class: person
label: { ar: "أشرس بن عبد الله السلمي", en: "al-Ashras ibn Abdallah al-Sulami", fr: "Al-Ashras ibn Abdallah al-Sulami", es: "al-Ashras ibn Abdallah al-Sulami", ur: "العشرس بن عبداللہ السلمی" }
summary:
  ar: "أشرس بن عبد الله السلمي؛ استعمله هشام على خراسان وكان معه كاتب نبطي يكنى أبا أمية فزين له الشر فزاد في وظائف خراسان واستخف بالدهاقين ودعا أهل ما وراء النهر إلى الإسلام وطرح الجزية عمن أسلم فسارعوا إليه وانكسر الخراج فأخذ المسالمة فأنكروا وحبس ثابت قطنة ثم خلى سبيله فقتلته الترك."
  en: "al-Ashras ibn Abdallah al-Sulami; Hisham's governor, guided by his Nabati katib Abu Umayya — raised the levies, freed converts from jizya, watched the kharaj collapse, clawed it back as musalama, and sent the jailed-then-bailed Thabit Qutna to a death by Turks."
  fr: "Al-Ashras ibn Abdallah al-Sulami ; gouverneur de Hisham, guidé par son secrétaire nabatéen Abu Umayya, il augmenta les prélèvements, exempta les convertis de la jizya, vit s’effondrer le kharaj, le récupéra au titre de la musalama et envoya Thabit Qutna, emprisonné puis libéré sous caution, à la mort aux mains des Turcs."
  es: "al-Ashras ibn Abdallah al-Sulami, gobernador de Hisham, guiado por su katib nabati Abu Umayya, aumentó los impuestos, liberó a los conversos de la jizya, presenció el colapso del kharaj, lo recuperó como musalama y envió a Thabit Qutna, quien había sido encarcelado y luego puesto en libertad bajo fianza, a una muerte a manos de los turcos."
  ur: "العشرس بن عبداللہ السلمی؛ ہشام کے گورنر نے، اس کے نباتی کاتب ابو امیہ کی رہنمائی میں - لیویز کو بڑھایا، مذہب تبدیل کرنے والوں کو جزیہ سے آزاد کیا، خراج کے خاتمے کو دیکھا، اسے دوبارہ مسلمہ کے طور پر پنجہ لگایا، اور جیل میں بند ثابت قتنا کو ترکوں کے ہاتھوں موت کے گھاٹ اتار دیا۔"
