summary:
  ar: "أشرس بن عبد الله السلمي؛ استعمله هشام على خراسان وكان معه كاتب نبطي يكنى أبا أمية فزين له الشر فزاد في وظائف خراسان واستخف بالدهاقين ودعا أهل ما وراء النهر إلى الإسلام وطرح الجزية عمن أسلم فسارعوا إليه وانكسر الخراج فأخذ المسالمة فأنكروا وحبس ثابت قطنة ثم خلى سبيله فقتلته الترك."
  en: "al-Ashras ibn Abdallah al-Sulami; Hisham's governor, guided by his Nabati katib Abu Umayya — raised the levies, freed converts from jizya, watched the kharaj collapse, clawed it back as musalama, and sent the jailed-then-bailed Thabit Qutna to a death by Turks."
