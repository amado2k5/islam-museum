class: person
label: { ar: "أبرويز مرزبان زرنج", en: "Aparwiz, Marzban of Zaranj", es: "Aparwiz, Marzban of Zaranj", fr: "Aparwiz, Marzban of Zaranj", ur: "اپرویز، مرزبان آف زرنج" }
summary:
  ar: "أبرويز مرزبان زرنج؛ بعث إلى الربيع بن زياد يستأمنه ليصالحه فأجلسه الربيع على جثة قتيل واتكأ على أخرى وأجلس أصحابه على أجساد القتلى فهاله فصالحه على ألف وضيف مع كل وصيف جام من ذهب."
  en: "Aparwiz, marzban of Zaranj; sent to seek aman, al-Rabi' seated him on a corpse and leaned on another, his companions likewise — awed, he truced for a thousand slave-youths each bearing a gold cup."
  es: "Aparwiz, marzban de Zaranj, enviado a buscar a un hombre, al-Rabi' lo sentó sobre un cadáver y se apoyó en otro, sus compañeros hicieron lo mismo; impresionado, hizo una tregua por mil jóvenes esclavos, cada uno portando una copa de oro."
  fr: "Aparwiz, marzban de Zaranj; envoyé chercher un aman, al-Rabi' l'assit sur un cadavre et s'appuya sur un autre, ses compagnons de même — impressionné, il fit trêve pour mille jeunes esclaves portant chacun une coupe en or."
  ur: "اپرویز، مرزبان آف زرنج؛ امان کی تلاش کے لیے بھیجا گیا، الربیع نے اسے ایک لاش پر بٹھایا اور دوسرے پر ٹیک لگائے، اسی طرح اس کے ساتھی بھی حیران رہ گئے، اس نے ایک ہزار غلاموں کے لیے جنگ لڑی جن میں سے ہر ایک کے پاس سونے کا پیالہ تھا۔"
  tr: "Zarnj valisi Abrawiz; Barışması için güvenini istemesi için El-Rabi' ibn Ziyad'a gönderdi. El-Rabi onu öldürülmüş bir adamın bedenine oturttu, başka birine yaslandı ve yoldaşlarını öldürülenlerin bedenlerine oturttu. Her altın kadeh ustasıyla bin misafir için onunla barıştı ve şaşırdı."
  id: "Abrawiz, gubernur Zarnj; ia mengirim surat kepada Al-Rabi' ibn Ziyad untuk meminta kepercayaannya agar dapat berdamai dengannya. Al-Rabi mendudukkannya di atas tubuh seorang pria yang terbunuh, bersandar pada orang lain, dan menempatkan teman-temannya di atas mayat yang terbunuh. Ia terkejut dan berdamai dengannya untuk seribu tamu di setiap tempat gelas emas."
