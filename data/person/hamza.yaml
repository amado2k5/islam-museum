summary:
  en: "An uncle of the Prophet who became one of the fiercest early defenders of Islam; killed at Uhud and remembered in tradition as the Master of the Martyrs. The Encyclopaedia of Islam adds that he led a thirty-man expedition of Emigrants to the coast and fought in single combat at Badr."
  ar: "عمّ النبي الذي صار من أشد المدافعين الأوائل عن الإسلام، قُتل في أُحد، ويُذكر في التقليد بسيد الشهداء. وفي الصحيح يروي وحشي بن حرب نفسه خبر قتله: كمن له تحت صخرة فلما دنا رماه بحربته حتى خرجت من بين وركيه، وذلك أن مولاه جبير بن مطعم وعده الحرية إن قتل حمزة بعمه طعيمة بن عدي الذي قتله ببدر {cite:sahih-al-bukhari 4072}."
  ur: "نبی کے چچا جو اسلام کے شدید ترین ابتدائی محافظوں میں بنے؛ احد میں شہید ہوئے اور روایت میں شہیدوں کے سردار کے نام سے یاد کیے جاتے ہیں۔ انسائیکلوپیڈیا آف اسلام کے مطابق انہوں نے تیس مہاجرین کی ایک مہم کی قیادت کی اور بدر میں انفرادی مقابلوں میں حصہ لیا۔"
