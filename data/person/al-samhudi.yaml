summary:
  ar: "مؤرخ المدينة ومفتيها ومدرّسها، نزيلها من سنة 873هـ؛ وضع لأخبار دار الهجرة ثلاثة مؤلفات: الكبير «اقتفاء الوفا» الذي احترق في حريق المسجد النبوي ولم يُتمّ، والأوسط «وفاء الوفا» والمختصر «خلاصة الوفا»، وقد خدم بنفسه في إعادة بنيان الحجرة الشريفة فوقع في كتابه أخبارُ معاينة لا يلحقها مؤرخ غيره {cite:samhudi-wafa-al-wafa p. 4-8}."
  en: "Historian, mufti and teacher of Medina, resident there from 873 AH; he wrote three histories of the Prophet's city — the large Iqtisaf al-Wafa which burned unfinished in the mosque fire, the middling Wafa al-Wafa, and the brief Khulasat al-Wafa — and himself served in the rebuilding of the Noble Chamber, so his book carries eyewitness knowledge no other historian of the city matched {cite:samhudi-wafa-al-wafa p. 4-8}."
