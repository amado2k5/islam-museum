summary:
  ar: "مؤرخ المدينة ومفتيها ومدرّسها، نزيلها من سنة 873هـ؛ وضع لأخبار دار الهجرة ثلاثة مؤلفات: الكبير «اقتفاء الوفا» الذي احترق في حريق المسجد النبوي ولم يُتمّ، والأوسط «وفاء الوفا» والمختصر «خلاصة الوفا»، وقد خدم بنفسه في إعادة بنيان الحجرة الشريفة فوقع في كتابه أخبارُ معاينة لا يلحقها مؤرخ غيره {cite:samhudi-wafa-al-wafa p. 4-8}."
  en: "Historian, mufti and teacher of Medina, resident there from 873 AH; he wrote three histories of the Prophet's city — the large Iqtisaf al-Wafa which burned unfinished in the mosque fire, the middling Wafa al-Wafa, and the brief Khulasat al-Wafa — and himself served in the rebuilding of the Noble Chamber, so his book carries eyewitness knowledge no other historian of the city matched {cite:samhudi-wafa-al-wafa p. 4-8}."
  fr: "Historien, mufti et professeur de Médine, il y réside depuis 873 de l’hégire  ; il a écrit trois histoires de la ville du Prophète – la grande Iqtisaf al-Wafa qui brûlait inachevée dans l’incendie de la mosquée, la moyenne Wafa al-Wafa, et le bref Khulasat al-Wafa – et lui-même a servi dans la reconstruction de la Chambre Noble, de sorte que son livre porte la connaissance de témoin oculaire qu’aucun autre historien de la ville n’a égalé {cite:samhudi-wafa-al-wafa p. 4-8}."
  es: "Historiador, muftí y maestro de Medina, residente allí desde el año 873 de la Hégira; escribió tres historias de la ciudad del Profeta: la extensa Iqtisaf al-Wafa, que se quemó inconclusa en el incendio de la mezquita; la mediana Wafa al-Wafa; y la breve Khulasat al-Wafa. Él mismo participó en la reconstrucción de la Cámara Noble, por lo que su libro posee un conocimiento de primera mano que ningún otro historiador de la ciudad pudo igualar {cite:samhudi-wafa-al-wafa p. 4-8}."
  ur: "مدینہ کے مؤرخ، مفتی اور استاد، 873 ہجری سے وہاں مقیم؛ اس نے شہرِ نبوی کی تین تاریخیں لکھیں - ایک بڑا اقتصاف الوفاء جو مسجد کی آگ میں نامکمل جل گیا، درمیانی وفا الوفا، اور مختصر خلصۃ الوفاء - اور خود نوبل چیمبر کی تعمیر نو میں خدمات انجام دیں، اس لیے ان کی کتاب میں چشم دید معلومات موجود ہیں جو کہ کسی اور مؤرخ سے نہیں ملتی۔ 4-8}۔"
