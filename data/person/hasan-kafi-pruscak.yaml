  fr: "Hasan Kafi Pruščak"
  ur: "حسن کافی پروشاک"
roles: [scholar, writer, faqih]
gender: male
summary:
  ar: "حسن بن طورخان بن داود بن يعقوب الأقحصاري، ويقال له حسن كافي، فقيه باحث من أهل البوسنة، ولد في بلدة أقحصار وولي قضاءها وتوفي بها، من كتبه «أصول الحكم في نظام العالم»، وتوفي سنة 1025 هـ."
  en: "Hasan ibn Turkhan ibn Dawud ibn Ya'qub al-Aqhisari, called Hasan Kafi, a Bosnian jurist and researcher born in the town of Aqhisar (Prusac), whose judge he became and where he died; author of Usul al-Hikam fi Nizam al-Alam; died 1025 AH."
  es: "Hasan ibn Turkhan ibn Dawud ibn Ya'qub al-Aqhisari, llamado Hasan Kafi, jurista e investigador bosnio nacido en la ciudad de Aqhisar (Prusac), de la cual fue juez y donde murió; autor de Usul al-Hikam fi Nizam al-Alam; murió en 1025 AH."
  fr: "Hasan ibn Turkhan ibn Dawud ibn Ya'qub al-Aqhisari, dit Hasan Kafi, juriste et chercheur bosnien né dans la ville d'Aqhisar (Prusac), dont il devint juge et où il mourut; auteur de Usul al-Hikam fi Nizam al-Alam; mort en 1025 AH."
  ur: "حسن بن ترکان بن داؤد ابن یعقوب الاخیصاری، جسے حسن کافی کہا جاتا ہے، بوسنیائی فقیہ اور محقق قصبہ اخیسر ⁦(پروساک)⁩ میں پیدا ہوا، جس کا وہ جج بنا اور جہاں ان کی موت ہوئی؛ اصول الحکم فی نظام العالم کے مصنف؛ وفات 1025ھ۔"
