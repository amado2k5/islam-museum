id: person/aisha-bint-talha
class: person
label: { ar: "عائشة بنت طلحة", en: "Aisha bint Talha", fr: "Aïcha bint Talha", es: "Aisha bint Talha" }
gender: female
summary:
  ar: "نابغة في الأدب والسخاء كأبيها طلحة، وتُذكر مع سكينة بنت الحسين في مجالس الأدب. تزوجها مصعب بن الزبير، حاكم العراق في خلافة أخيه عبد الله بن الزبير ⁦(67–72هـ)⁩، وأمهرها مليون درهم حسب الكتاب {cite:umayyad-birth-to-fall-2006 p. 144}{cite:umayyad-birth-to-fall-2006 p. 145}."
  en: "A prodigy in literature and generosity like her father Talha, she is mentioned alongside Sakina bint al-Husayn in literary gatherings. Mus'ab ibn al-Zubayr, governor of Iraq during the caliphate of his brother Abd Allah ibn al-Zubayr (67–72 AH), married her, and according to the book her dower was one million dirhams {cite:umayyad-birth-to-fall-2006 p. 144}{cite:umayyad-birth-to-fall-2006 p. 145}."
  fr: "Prodige de la littérature et de la générosité comme son père Talha, elle est mentionnée aux côtés de Sakina bint al-Husayn dans les assemblées littéraires. Mus’ab ibn al-Zubayr, gouverneur de l’Irak durant le califat de son frère Abd Allah ibn al-Zubayr (67–72 H), l’épousa et, selon l’ouvrage, sa dot s’élevait à un million de dirhams {cite:umayyad-birth-to-fall-2006 p. 144}{cite:umayyad-birth-to-fall-2006 p. 145}."
  es: "Prodigio de la literatura y generosa como su padre Talha, se la menciona junto a Sakina bint al-Husayn en encuentros literarios. Mus'ab ibn al-Zubayr, gobernador de Irak durante el califato de su hermano Abd Allah ibn al-Zubayr (67-72 AH), se casó con ella, y según el libro, su dote fue de un millón de dirhams {cite:umayyad-birth-to-fall-2006 p. 144}{cite:umayyad-birth-to-fall-2006 p. 145}."
