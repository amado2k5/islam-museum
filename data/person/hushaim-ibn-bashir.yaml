summary:
  ar: "أبو معاوية هشيم بن بشير بن أبي خازم القاسم بن دينار السلمي الواسطي، وقيل بخاري الأصل، حافظ الحديث؛ سمع عمرو بن دينار والزهري ويونس بن عبيد وأبا السختياني وابن عون وخالد الحذاء والأشعث بن عبد الملك ومنصور بن زاذان ومغيرة بن مقسم وعبد الملك بن عمير وإسماعيل بن أبي خالد والأعمش، وروى عنه مالك بن أنس وسفيان الثوري وشعبة وعبد الله بن المبارك ويحيى بن سعيد القطان وعبد الرحمن بن مهدي وغندر ووكيع ويزيد بن هارون وأسود بن عامر وقتيبة بن سعيد وأحمد بن حنبل ويحيى بن معين وعلي بن المديني وأبو خيثمة وأبو عبيد القاسم بن سلام وشجاع بن مخلد وزياد بن أيوب ويعقوب الدورقي والحسن بن عرفة؛ انتقل من واسط قديماً إلى بغداد فسكنها {cite:tarikh-baghdad-khatib j.11 p.86}."
  en: "Abu Mu'awiya al-Sulami, the Wasiti traditionist of Bukharan origin who settled at Baghdad; Malik, al-Thawri, Shu'ba and Ibn al-Mubarak all heard hadith from him {cite:tarikh-baghdad-khatib j.11 p.86}."
