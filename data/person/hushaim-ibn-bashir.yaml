gender: male
summary:
  ar: "أبو معاوية هشيم بن بشير بن أبي خازم القاسم بن دينار السلمي الواسطي، وقيل بخاري الأصل، حافظ الحديث؛ سمع عمرو بن دينار والزهري ويونس بن عبيد وأبا السختياني وابن عون وخالد الحذاء والأشعث بن عبد الملك ومنصور بن زاذان ومغيرة بن مقسم وعبد الملك بن عمير وإسماعيل بن أبي خالد والأعمش، وروى عنه مالك بن أنس وسفيان الثوري وشعبة وعبد الله بن المبارك ويحيى بن سعيد القطان وعبد الرحمن بن مهدي وغندر ووكيع ويزيد بن هارون وأسود بن عامر وقتيبة بن سعيد وأحمد بن حنبل ويحيى بن معين وعلي بن المديني وأبو خيثمة وأبو عبيد القاسم بن سلام وشجاع بن مخلد وزياد بن أيوب ويعقوب الدورقي والحسن بن عرفة؛ انتقل من واسط قديماً إلى بغداد فسكنها {cite:tarikh-baghdad-khatib j.11 p.86}."
  en: "Abu Mu'awiya al-Sulami, the Wasiti traditionist of Bukharan origin who settled at Baghdad; Malik, al-Thawri, Shu'ba and Ibn al-Mubarak all heard hadith from him {cite:tarikh-baghdad-khatib j.11 p.86}."
  es: "Abu Mu'awiya al-Sulami, el tradicionalista wasiti de origen bujarano que se estableció en Bagdad; Malik, al-Thawri, Shu'ba e Ibn al-Mubarak escucharon hadices de él {citar:tarikh-baghdad-khatib j.11 p.86}."
  fr: "Abu Mu'awiya al-Sulami, le traditionniste Wasiti d'origine boukhara qui s'est installé à Bagdad; Malik, al-Thawri, Shu'ba et Ibn al-Mubarak ont tous entendu des hadiths de sa part {cite:tarikh-baghdad-khatib j.11 p.86}."
  ur: "ابو معاویہ السلمی، بخاران نژاد وصی روایت دان جو بغداد میں آباد ہوئے؛ مالک، الثوری، شعبہ اور ابن المبارک سب نے ان سے حدیثیں سنی ہیں {حوالہ: تاریخ بغداد خطیب ج11 ص 86}۔"
  tr: "Ebu Muaviye Hisim ibn Beşîr ibn Abi Khazim al-Kasim ibn Dinar al-Sulami al-Wasiti'dir ve kökeni Buhari olarak bilinen bir hadis ezbercisidir; Amr ibn Dinar, al-Zuhri, Yunus ibn Ubeyd, Abu al-Sakhtiyani, İbn 'Awn, Halid al-Hadha', al-Ash'ath ibn Abd al-Malik, Mansur ibn Zadhan, Muğira ibn Muqsim, Abd al-Malik ibn Umair, İsmail ibn Abi Khalid ve al-A'mash'ı duymuştur. Malik ibn Anas, Sufyan al-Thawri, Shu'bah, Abdullah ibn al-Mubarak, Yahya ibn Sa'id al-Qattan, Abd al-Rahman ibn Mahdi, Ghandar, Waki' ve al-A'mash'ı duymuştur Harun ve Asvad bin Amir, Qutaybah ibn Sa'id, Ahmed ibn Hanbal, Yahya ibn Ma'in, Ali ibn al-Madini, Abu Khaythamah, Abu Ubaid al-Qasim ibn Salam, Şuca' ibn Mukhlad, Ziyad ibn Eyyub, Yaqub al-Dawraci ve Hasan ibn 'Arafa; çok uzun zaman önce Wasit'ten Bağdat'a taşındılar ve orada yerleştiler {cite:Tarikh-baghdad-khatib J.11 s.86}."
  id: "Abu Muawiyah Hishim ibn Bashir ibn Abi Khazim al-Qasim ibn Dinar al-Sulami al-Wasiti, dan dikatakan berasal dari Bukhari, seorang penghafal hadis; ia mendengar Amr ibn Dinar, al-Zuhri, Yunus ibn Ubayd, Abu al-Sakhtiyani, Ibn 'Awn, Khalid al-Hadha', al-Ash'ath ibn Abd al-Malik, Mansur ibn Zadhan, Mughira ibn Muqsim, Abd al-Malik ibn Umair, Ismail ibn Abi Khalid, dan al-A'mash. Malik ibn Anas, Sufyan al-Thawri, Shu'bah, Abdullah ibn al-Mubarak, Yahya ibn Sa'id al-Qattan, Abd al-Rahman ibn Mahdi, Ghandar, Waki', dan Yazid ibn Harun dan Aswad ibn Amir, Qutaybah ibn Sa'id, Ahmad ibn Hanbal, Yahya ibn Ma'in, Ali ibn al-Madini, Abu Khaythamah, Abu Ubaid al-Qasim ibn Salam, Shuja' ibn Mukhlad, Ziyad ibn Ayyub, Yaqub al-Dawraqi, dan Hasan ibn 'Arafa; mereka pindah dari Wasit lama ke Baghdad dan menetap di sana {cite:Tarikh-baghdad-khatib J.11 hlm.86}."
