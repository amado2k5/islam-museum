summary:
  ar: "أحمد بن القاسم بن خليفة الخزرجي، موفق الدين، أبو العباس، ابن أبي أصيبعة، الطبيب المؤرخ ولد بدمشق ومقامه فيها، صاحب «عيون الأنباء في طبقات الأطباء»، زار مصر سنة 634 هـ وتوفي بصرخد، 596 إلى 668 هـ."
  en: "Ahmad ibn al-Qasim al-Khazraji, Muwaffaq al-Din, known as Ibn Abi Usaybi'a, the physician and historian, born and based in Damascus, author of 'Uyun al-Anba' fi Tabaqat al-Atibba'; he visited Egypt in 634 AH and died at Sarkhad, 596 to 668 AH."
  es: "Ahmad ibn al-Qasim al-Khazraji, Muwaffaq al-Din, conocido como Ibn Abi Usaybi'a, médico e historiador, nacido y residente en Damasco, autor de 'Uyun al-Anba' fi Tabaqat al-Atibba'; visitó Egipto en el año 634 de la Hégira y murió en Sarkhad entre los años 596 y 668 de la Hégira."
  fr: "Ahmad ibn al-Qasim al-Khazraji, Muwaffaq al-Din, connu sous le nom d'Ibn Abi Usaybi'a, médecin et historien, né et basé à Damas, auteur de 'Uyun al-Anba' fi Tabaqat al-Atibba'; il visita l'Égypte en 634 AH et mourut à Sarkhad, entre 596 et 668 AH."
  ur: "احمد بن القاسم الخزرجی، موفق الدین، ابن ابی عصیبیہ کے نام سے مشہور، طبیب اور مورخ، دمشق میں پیدا ہوئے اور مقیم، 'عیون الانبہ' فی طبقات العتیبہ' کے مصنف؛ اس نے 634 ہجری میں مصر کا دورہ کیا اور سرخاد میں 596 تا 668 ہجری وفات پائی۔"
