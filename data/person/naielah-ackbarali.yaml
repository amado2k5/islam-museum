summary:
  ar: "مؤسِّسة منصة «مسلمة كوتشينغ» للاستشارات والإرشاد الإسلامي ومديرتها التنفيذية منذ 2015؛ وُلدت في ترينيداد ونشأت في جنوب فلوريدا، ودرست العلوم الإسلامية في سوريا والأردن أكثر من خمس عشرة سنة، وهي معالجة مؤهلة بالعلاج المعرفي السلوكي ومستشارة زواج ومدرّسة دراسات إسلامية، ومؤلفة كتب في الزواج وفقه الحيض، وتحمل ماجستير الإرشاد والعلاج النفسي من جامعة باث سبا."
  en: "Founder and CEO of Muslima Coaching, an Islamic coaching and counselling service, since 2015. Born in Trinidad and raised in South Florida, she studied the Islamic sciences in Syria and Jordan for over fifteen years. She is a qualified CBT therapist, a Muslim marriage counsellor and an Islamic studies teacher, the author of books on marriage and the fiqh of menstruation, and holds a master's degree in counselling and psychotherapy practice from Bath Spa University."
  ur: "«مسلمہ کوچنگ» نامی اسلامی کوچنگ اور کاؤنسلنگ سروس کی بانی اور چیف ایگزیکٹو (2015 سے)؛ ٹرینیڈاڈ میں پیدا ہوئیں اور جنوبی فلوریڈا میں پلی بڑھیں، شام اور اردن میں پندرہ سال سے زائد اسلامی علوم کی تعلیم حاصل کی۔ وہ اہلیت یافتہ سی بی ٹی معالجہ، مسلم ازدواجی مشیرہ اور اسلامی مطالعے کی مدرسہ ہیں، شادی اور فقہِ حیض پر کتب کی مصنفہ ہیں، اور باتھ سپا یونیورسٹی سے کاؤنسلنگ اور سائیکو تھراپی میں ماسٹرز رکھتی ہیں۔"
