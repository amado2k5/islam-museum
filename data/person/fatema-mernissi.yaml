summary:
  ar: "عالمة اجتماع وكاتبة مغربية، وُلدت في فاس سنة 1940 ونشأت في حريم جدّتها لأبيها، ودرست في الرباط وباريس وجامعة براندايس، وصارت من مؤسسات النسوية الإسلامية بكتب مثل «ما وراء الحجاب» و«الحجاب والنخبة الذكورية» و«سلطانات منسيات»، وتوفيت في الرباط سنة 2015."
  en: "Moroccan sociologist and writer, born at Fez in 1940 and raised in her paternal grandmother's harem. Educated at Rabat, Paris and Brandeis University, she became a founding figure of Islamic feminism with books such as Beyond the Veil, The Veil and the Male Elite and The Forgotten Queens of Islam; she died at Rabat in 2015."
  ur: "مراکشی ماہرِ عمرانیات اور مصنفہ، جو 1940 میں فاس میں پیدا ہوئیں اور دادی کے حرم میں پلی بڑھیں؛ رباط، پیرس اور برینڈائس یونیورسٹی سے تعلیم پائی اور «پردے کے پیچھے»، «حجاب اور مرد اشرافیہ» اور «بھولی بسری سلطانائیں» جیسی کتابوں سے اسلامی نسائیت کی بانی شخصیات میں شمار ہوئیں؛ 2015 میں رباط میں وفات پائی۔"
