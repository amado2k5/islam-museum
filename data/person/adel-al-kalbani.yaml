summary:
  ar: "إمام وقارئ سعودي، وُلد في الرياض سنة 1959، أمّ المصلين في جامع الملك خالد بالرياض سنوات طويلة، ثم كُلّف سنة 2008 بإمامة صلاة التراويح في المسجد الحرام بمكة فكان أول إمام أسود يؤم المصلين فيه؛ عُرف بصوته في تلاوة القرآن وبمواقف معلنة أثارت جدلا ثم راجع بعضها."
  en: "Saudi imam and Quran reciter, born in Riyadh in 1959. He led prayers for many years at the King Khalid Mosque in Riyadh, and in 2008 was assigned to lead the tarawih prayers at the Grand Mosque of Mecca, becoming the first black imam to lead prayers there. He is known for his recitation and for publicly debated positions, some of which he later revised."
  ur: "سعودی امام اور قاری، جو 1959 میں ریاض میں پیدا ہوئے۔ وہ برسوں ریاض کی جامع مسجدِ ملک خالد کے امام رہے، اور 2008 میں انہیں مسجدِ حرام، مکہ میں تراویح کی امامت سونپی گئی، یوں وہ وہاں نماز پڑھانے والے پہلے سیاہ فام امام بنے۔ وہ اپنی تلاوت اور اپنے بعض متنازع عوامی مواقف کے لیے جانے جاتے ہیں، جن میں سے کچھ پر انہوں نے بعد میں نظرِ ثانی کی۔"
