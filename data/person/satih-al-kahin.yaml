summary:
  ar: "كاهن العرب المشهور، عدّه المسعودي في الكهان المعروفين بتشويه الخلق مع شق وسملقة وزوبعة وسديف بنت هوماس وطريفة وغيرهم {cite:muruj-al-dhahab p. 484}. وكان أول ما تكهن به وهو نائم مع إخوته في لحاف أن زعق وقال والضياء والشفق والظلام والغسق ليطرقنكم ما طرق، فأخبر بطوفان الأودية يفجؤهم في ليلة باردة قرة يسوق الأنعام والمواشي فكان كما قال، ومن أخباره تفسيره وشق رؤيا تبع الحميري في الجمرة الخارجة من الظلمة الآكلة بأرض تهامة كل ذات جمجمة، وخبره مع عبد المسيح في رؤيا الموبذان وارتجاج الإيوان {cite:muruj-al-dhahab p. 499-500}"
  en: "The celebrated Arab diviner Satih — of the marked-bodied kahins in al-Mas'udi's roster {cite:muruj-al-dhahab p. 484}."
  es: "El célebre adivino árabe Satih, de los kahins de cuerpo marcado en la lista de al-Mas'udi {cite:muruj-al-dhahab p. 484}."
  fr: "Le célèbre devin arabe Satih — l'un des kahins au corps marqué figurant dans la liste d'al-Mas'udi {cite:muruj-al-dhahab p. 484}."
  ur: "المسعودی کی فہرست میں نشان زدہ کاہنوں میں سے مشہور عرب شعیب ستیح۔ 484}۔"
  tr: "Ünlü Arap kahin El-Mes'udi, onu yaratılışı çarpıtmakla tanınan kahinler arasında saydı; Shaq, Samalqa, Zuba'a, Sadeef bint Homas, Tarifa ve diğerleriyle birlikte {cite:muruj-al-dhahab, s. 484}. Kardeşleriyle bir yorganla uyurken ilk kehanet ettiği şey, bağırıp \"Işık, alacakaranlık, karanlık ve alacakaranlıkla seni vursun\" demesiydi. Köyde soğuk bir gecede hayvan ve hayvan sürülerek vadilerin onları şaşırtacağını önceden söyledi ve dediği gibiydi. Raporları arasında, Tihama topraklarını yutan karanlıktan çıkan köz içindeki Himyarit'in vizyonunu yorumlaması ve Abdülmesih ile kafatasları ile iwan sallanışındaki hikayesi yer alıyor {cite:muruj-al-dhahab, s. 499-500}"
  id: "Peramal Arab terkenal, Al-Mas'udi, menganggapnya sebagai salah satu peramal yang dikenal karena mendistorsi ciptaan, bersama Shaq, Samalqa, Zuba'a, Sadeef bint Homas, Tarifa, dan lainnya {cite:muruj-al-dhahab, hlm. 484}. Hal pertama yang ia ramalkan saat tidur bersama saudara-saudaranya dalam selimut adalah bahwa ia berteriak dan berkata, \"Dengan cahaya, senja, kegelapan, dan senja untuk menyerang kalian seperti yang mereka lakukan.\" Ia meramalkan banjir lembah yang akan mengejutkan mereka pada malam dingin di desa yang menggiring ternak dan ternak, dan memang seperti yang ia katakan. Di antara laporannya adalah interpretasinya tentang penglihatan Himyarit dalam bara yang muncul dari kegelapan yang melahap tanah Tihama, dan kisahnya bersama Abd al-Masih dalam penglihatan tengkorak dan guncangan iwan {cite:muruj-al-dhahab, hlm. 499-500}"
