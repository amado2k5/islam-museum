id: person/satih-al-kahin
class: person
label: { ar: "سطيح الكاهن", en: "Satih the soothsayer" }
summary:
  ar: "كاهن العرب المشهور، عدّه المسعودي في الكهان المعروفين بتشويه الخلق مع شق وسملقة وزوبعة وسديف بنت هوماس وطريفة وغيرهم {cite:muruj-al-dhahab p. 484}.، وكان أول ما تكهن به وهو نائم مع إخوته في لحاف أن زعق وقال والضياء والشفق والظلام والغسق ليطرقنكم ما طرق، فأخبر بطوفان الأودية يفجؤهم في ليلة باردة قرة يسوق الأنعام والمواشي فكان كما قال، ومن أخباره تفسيره وشق رؤيا تبع الحميري في الجمرة الخارجة من الظلمة الآكلة بأرض تهامة كل ذات جمجمة، وخبره مع عبد المسيح في رؤيا الموبذان وارتجاج الإيوان {cite:muruj-al-dhahab p. 499-500}"
  en: "The celebrated Arab diviner Satih — of the marked-bodied kahins in al-Mas'udi's roster {cite:muruj-al-dhahab p. 484}."
