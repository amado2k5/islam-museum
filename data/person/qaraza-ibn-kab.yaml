label: { ar: "قرظة بن كعب الأنصاري", en: "Qaraza ibn Ka'b al-Ansari", es: "Qaraza ibn Ka'b al-Ansari", fr: "Qaraza ibn Ka'b al-Ansari" }
summary:
  ar: "قرظة بن كعب الأنصاري أبو مسلم؛ آخر من فتح الري بعد نقضها المتكرر وذلك في ولاية أبي موسى الأشعري الكوفة لعثمان فاستقامت بعده وكان عمّال الري ينزلون حصن الزنبدي ويجتمعون في مسجد اتخذ بحضرته ودخل ذلك في فصيل المحدثة ثم ولي الكوفة لعلي ومات بها فصلى عليه علي."
  en: "Qaraza ibn Ka'b al-Ansari, Abu Muslim; the last conqueror of Rayy after its repeated breaches, under Abu Musa's Kufa governorship for Uthman, after whom it stayed quiet — Rayy's governors lodged at Hisn al-Zaynabi gathering at the mosque built in his presence, counted in the muhdatha district; he later governed Kufa for Ali, died there, and Ali prayed over him — at Tustar he led Ammar ibn Yasir's horse."
  es: "Qaraza ibn Ka'b al-Ansari, Abu Muslim; el último conquistador de Rayy después de sus repetidas transgresiones, bajo el gobierno de Kufa de Abu Musa para Uthman, después de quien permaneció tranquilo — los gobernadores de Rayy se alojaron en Hisn al-Zaynabi reunidos en la mezquita construida en su presencia, contados en el distrito de muhdatha; más tarde gobernó Kufa para Ali, murió allí, y Ali oró por él — en Tustar condujo el caballo de Ammar ibn Yasir."
  fr: "Qaraza ibn Ka'b al-Ansari, Abu Muslim; le dernier conquérant de Rayy après ses brèches répétées, sous le gouvernement de Kufa d'Abu Musa pour Uthman, après quoi la ville resta calme — les gouverneurs de Rayy logeaient à Hisn al-Zaynabi, se rassemblant à la mosquée construite en sa présence, et étaient comptabilisés dans le district de muhdatha; il gouverna plus tard Kufa pour Ali, y mourut, et Ali pria sur lui — à Tustar, il mena la cavalerie d'Ammar ibn Yasir."
