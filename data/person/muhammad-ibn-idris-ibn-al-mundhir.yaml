class: person
label: { ar: "محمد بن إدريس بن المنذر أبو حاتم الحنظلي", en: "Abu Hatim al-Handhali al-Razi", es: "Abu Hatim al-Handhali al-Razi", fr: "Abu Hatim al-Handhali al-Razi", ur: "ابو حاتم الہندلی الرازی" }
roles: [muhaddith, scholar]
gender: male
summary:
  ar: "محمد بن إدريس بن المنذر بن داود بن مهران الحنظلي، أبو حاتم الرازي ⁦(195 - 277 هـ / 810 - 890 م)⁩: حافظ للحديث من أقران البخاري ومسلم، ولد في الري وتنقل في العراق والشام ومصر وبلاد الروم وتوفي ببغداد، وله «طبقات التابعين» و«الزينة» و«أعلام النبوة» {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 27}؛ وعدّه ابن الجوزي من الأئمة الحفاظ العارفين بعلل الحديث والجرح والتعديل {cite:muntazam-ibn-al-jawzi p. 171}."
  en: "Muhammad ibn Idris ibn al-Mundhir ibn Dawud ibn Mihran al-Handhali, Abu Hatim al-Razi (195-277 AH / 810-890): a hadith memorizer, contemporary of al-Bukhari and Muslim, born in Rayy, travelled in Iraq, Syria, Egypt and Rum and died in Baghdad; author of Tabaqat al-Tabi'in, al-Zina and A'lam al-Nubuwwa {cite:alam-zirikli-dar-al-ilm-2002 vol. 6 p. 27}. Ibn al-Jawzi counts him among the imam-huffaz who knew hadith-defects and jarh wa-ta'dil {cite:muntazam-ibn-al-jawzi p. 171}."
  es: "Muhammad ibn Idris ibn al-Mundhir ibn Dawud ibn Mihran al-Handhali, Abu Hatim al-Razi (195-277 d. H. / 810-890): memorizador de hadices, contemporáneo de al-Bukhari y musulmán, nacido en Rayy, viajó por Irak, Siria, Egipto y Rum y murió en Bagdad; autor de Tabaqat al-Tabi'in, al-Zina y A'lam al-Nubuwwa {cita:alam-zirikli-dar-al-ilm-2002 vol. 6p. 27}. Ibn al-Jawzi lo cuenta entre los imam-huffaz que conocían los defectos de los hadices y jarh wa-ta'dil {citar:muntazam-ibn-al-jawzi p. 171}."
  fr: "Muhammad ibn Idris ibn al-Mundhir ibn Dawud ibn Mihran al-Handhali, Abu Hatim al-Razi (195-277 AH / 810-890): mémorisateur de hadiths, contemporain d'al-Bukhari et de Muslim, né à Rayy, a voyagé en Irak, en Syrie, en Égypte et à Rum et est mort à Bagdad; auteur de Tabaqat al-Tabi'in, al-Zina et A'lam al-Nubuwwa {cite:alam-zirikli-dar-al-ilm-2002 vol. 18h. 27}. Ibn al-Jawzi le compte parmi les imam-huffaz qui connaissaient les défauts des hadiths et jarh wa-ta'dil {cite:muntazam-ibn-al-jawzi p. 171}."
  ur: "محمد بن ادریس بن المنذر بن داؤد ابن مہران الہندلی، ابو حاتم الرازی ⁦(195-277ھ / 810-890)⁩: ایک حدیث کا حافظ، بخاری و مسلم کا ہم عصر، رے میں پیدا ہوا، عراق، بعث، مصر اور شام کا سفر کیا۔ طبقات التابعین، الزینا اور اعلام النبوۃ کے مصنف {حوالہ دیں:عالم زرکلی دار العلم-2002 جلد۔ 6ص۔ 27}۔ ابن الجوزی نے ان کا شمار ان امام حفاظ میں کیا ہے جو حدیث کے نقائص اور جرح و تعدیل کو جانتے تھے۔ 171}۔"
