summary:
  ar: "مقدم جيش الكامل وأحد من يضرب به المثل في الشجاعة، وكان له من جملة مماليكه مائة خادم فيهم جماعة أمراء؛ توفي بحران في رمضان وكان نائباً عليها للكامل {cite:shadharat-dhahab p. 149}."
  en: "Shams al-Din Sawab al-Adili (d. Ramadan 632) — al-Kamil's field commander and Harran's governor, a byword for courage whose own retinue included a hundred mamluks, several of them amirs {cite:shadharat-dhahab p. 149}."
  es: "Shams al-Din Sawab al-Adili (m. Ramadán 632) — comandante de campo de al-Kamil y gobernador de Harran, sinónimo de valentía cuyo séquito incluía a un centenar de mamelucos, varios de ellos emires {cite:shadharat-dhahab p. 149}."
  fr: "Shams al-Din Sawab al-Adili (mort en Ramadan 632) — commandant de terrain d'al-Kamil et gouverneur de Harran, un symbole de courage dont la propre suite comprenait une centaine de mamelouks, dont plusieurs émirs {cite:shadharat-dhahab p. 149}."
  ur: "شمس الدین سواب العدیلی ⁦(متوفی رمضان 632)⁩ - الکامل کا فیلڈ کمانڈر اور حران کا گورنر، بہادری کا ایک لفظ جس کے اپنے دستے میں سو مملوک شامل تھے، جن میں سے کئی امیر تھے۔ 149}۔"
  tr: "El-Kamil'in ordusunun komutanı ve cesaretiyle örnek teşkil edenlerden biriydi; Memlükleri arasında yüz hizmetkârı vardı, aralarında bir grup prens de vardı; Ramazan ayında Bahran'da öldü ve El-Kamil'in yardımcısıydı {kaynak: shadharat-dhahab, s. 149}."
  id: "Komandan pasukan Al-Kamil dan salah satu yang dikenal sebagai contoh keberanian, dan di antara Mamluk-nya ia memiliki seratus pelayan, termasuk sekelompok pangeran; ia meninggal di Bahran selama Ramadan dan menjadi wakilnya untuk Al-Kamil {cite:shadharat-dhahab, hlm. 149}."
