summary:
  ar: "يحيى بن عبد الوهاب بن محمد ابن مندة العبدي الأصبهاني، أبو زكريا، مؤرخ حافظ للحديث من بيت علم في أصبهان، دخل بغداد حاجا وأملى بجامع المنصور، من كتبه تاريخ أصبهان ومناقب الإمام أحمد؛ 434 إلى 511 هـ."
  en: "Yahya ibn Abd al-Wahhab Ibn Mandah al-Abdi al-Isbahani, Abu Zakariyya, a historian and hafiz of hadith from a learned family of Isfahan, who came to Baghdad on pilgrimage and dictated at the mosque of al-Mansur; author of a History of Isfahan and the merits of Ahmad ibn Hanbal; 434 to 511 AH (1043 to 1118)."
