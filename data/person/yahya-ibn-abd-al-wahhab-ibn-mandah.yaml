id: person/yahya-ibn-abd-al-wahhab-ibn-mandah
class: person
label:
  ar: "ابن منده يحيى بن عبد الوهاب"
  en: "Yahya ibn Abd al-Wahhab Ibn Mandah"
  es: "Yahya ibn Abd al-Wahhab Ibn Mandah"
  fr: "Yahya ibn Abd al-Wahhab Ibn Mandah"
  ur: "یحییٰ بن عبد الوہاب ابن مندہ"
roles: [muhaddith, scholar]
gender: male
summary:
  ar: "يحيى بن عبد الوهاب بن محمد ابن مندة العبدي الأصبهاني، أبو زكريا، مؤرخ حافظ للحديث من بيت علم في أصبهان، دخل بغداد حاجا وأملى بجامع المنصور، من كتبه تاريخ أصبهان ومناقب الإمام أحمد؛ 434 إلى 511 هـ."
  en: "Yahya ibn Abd al-Wahhab Ibn Mandah al-Abdi al-Isbahani, Abu Zakariyya, a historian and hafiz of hadith from a learned family of Isfahan, who came to Baghdad on pilgrimage and dictated at the mosque of al-Mansur; author of a History of Isfahan and the merits of Ahmad ibn Hanbal; 434 to 511 AH (1043 to 1118)."
  es: "Yahya ibn Abd al-Wahhab Ibn Mandah al-Abdi al-Isbahani, Abu Zakariyya, historiador y hafiz de hadices de una familia erudita de Isfahán, que llegó a Bagdad en peregrinación y dictó en la mezquita de al-Mansur; autor de una Historia de Isfahán y los méritos de Ahmad ibn Hanbal; 434 a 511 AH (1043 a 1118)."
  fr: "Yahya ibn Abd al-Wahhab Ibn Mandah al-Abdi al-Isbahani, Abu Zakariyya, historien et hafiz de hadith issu d'une famille savante d'Ispahan, venu à Bagdad en pèlerinage et dictant à la mosquée d'al-Mansur; auteur d'une Histoire d'Ispahan et des mérites d'Ahmad ibn Hanbal; 434 à 511 AH (1043 à 1118)."
  ur: "یحییٰ بن عبد الوہاب ابن مندہ العبدی الصبہانی، ابو زکریا، ایک مورخ اور حافظ حدیث جو اصفہان کے ایک علمی گھرانے سے تھے، جو بغداد میں حج کے لیے آئے اور مسجد المنصور میں فتویٰ دیا۔ اصفہان کی تاریخ اور احمد بن حنبل کی خوبیوں کے مصنف؛ 434 تا 511 ہجری ⁦(1043 تا 1118)⁩۔"
  tr: "Yahya ibn Abd al-Wahhab ibn Muhammed ibn Manda al-Abdi al-Isfahani, tarihçi ve hadis ezberci olan Ebu Zekariya, İsfahan'da bir bilgili aileden hacı olarak Bağdat'a girmiş ve El-Mansur Camii'nde dikte etmiştir. Kitapları arasında 'İsfahan Tarihi ve İmam Ahmed'in Erdemleri'; 434 ila 511 Hicri arasında yer almaktadır."
  id: "Yahya ibn Abd al-Wahhab ibn Muhammad ibn Manda al-Abdi al-Isfahani, Abu Zakariya, seorang sejarawan dan penghafal hadis dari keluarga berpengetahuan di Isfahan, masuk ke Baghdad sebagai seorang peziarah dan mendikte di Masjid Al-Mansur. Di antara bukunya adalah 'Sejarah Isfahan dan Kebajikan Imam Ahmad'; 434 hingga 511 H."
