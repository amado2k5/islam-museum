summary:
  ar: "نصر حامد أبو زيد ⁦(1943–2010)⁩ مفكر وأستاذ الدراسات الإسلامية المصري، صاحب مشروع التأويل الإنساني للنص الديني. حكمت محكمة مصرية سنة 1995 بردته وفصلته عن زوجته، فعاش منفياً في أوروبا حتى وفاته. من كتبه «مفهوم النص» و«نقد الخطاب الديني»."
  en: "Nasr Hamid Abu Zayd (1943–2010) was an Egyptian thinker and professor of Islamic studies, author of a humanistic hermeneutics of the religious text. An Egyptian court ruled him an apostate in 1995 and separated him from his wife, driving him into European exile until his death. His books include Mafhum al-Nass (The Concept of the Text) and Naqd al-Khitab al-Dini (Critique of Religious Discourse)."
  ur: "نصر حامد ابوزید ⁦(1943–2010)⁩ مصری مفکر اور اسلامی مطالعات کے پروفیسر تھے، مذہبی متن کی انسانی تاویل کے منصوبے کے بانی۔ 1995 میں مصری عدالت نے انہیں مرتد قرار دیا اور بیوی سے الگ کیا، جس پر وہ وفات تک یورپ میں جلاوطن رہے۔ کتب میں «مفهوم النص» اور «نقد الخطاب الديني» شامل ہیں۔"
  es: "Nasr Hamid Abu Zayd (1943-2010) fue un pensador egipcio y profesor de estudios islámicos, autor de una obra sobre la hermenéutica humanista de los textos religiosos. En 1995, un tribunal egipcio lo declaró apóstata y lo separó de su esposa, lo que lo obligó a exiliarse en Europa hasta su muerte. Entre sus libros destacan Mafhum al-Nass (El concepto del texto) y Naqd al-Khitab al-Dini (Crítica del discurso religioso)."
  fr: "Nasr Hamid Abu Zayd (1943-2010) était un penseur et professeur d'études islamiques égyptien, auteur d'une herméneutique humaniste du texte religieux. Un tribunal égyptien le déclara apostat en 1995 et le sépara de son épouse, le contraignant à l'exil en Europe où il vécut jusqu'à sa mort. Parmi ses ouvrages figurent Mafhum al-Nass (Le Concept du Texte) et Naqd al-Khitab al-Dini (Critique du Discours Religieux)."
  tr: "Nasr Hamed Abu Zeid (1943–2010), Mısırlı bir düşünür ve İslam çalışmaları profesörüydü; dini metinlerin hümanist yorumu üzerine bir projenin yazarıdır. 1995 yılında bir Mısır mahkemesi onu sürgün etmeye ve eşinden ayırmaya karar verdi, bu yüzden ölümüne kadar Avrupa'da sürgünde yaşadı. Kitapları arasında \"Metnin Kavramı\" ve \"Dini Söylemin Eleştirisi\" bulunmaktadır."
  id: "Nasr Hamed Abu Zeid (1943–2010) adalah seorang pemikir dan profesor studi Islam asal Mesir, penulis proyek tentang interpretasi humanistik terhadap teks-teks agama. Sebuah pengadilan Mesir memutuskan pada tahun 1995 untuk mengasingkannya dan memisahkannya dari istrinya, sehingga ia hidup dalam pengasingan di Eropa hingga wafat. Di antara bukunya adalah \"The Concept of the Text\" dan \"Critique of Religious Discourse.\""
