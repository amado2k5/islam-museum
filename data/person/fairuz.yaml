summary:
  ar: "مغنية وممثلة لبنانية، وُلدت في بيروت باسم نهاد وديع حداد؛ صوت لبنان الأكثر تبجيلًا وأحد أكثر الفنانين مبيعًا في التاريخ العربي، إذ صاغت مع الأخوين رحباني شكلًا جديدًا للأغنية اللبنانية، وأصبحت — وهي مسيحية غنّت لكل الأطراف — رمزًا لوحدة لبنان في حربه الأهلية وما بعدها. وهي مدرجة في هذا المتحف بوصفها شخصية سامقة في العالم العربي والإسلامي الحديث، لا بوصفها مسلمة."
  en: "Lebanese singer and stage actress, born in Beirut as Nouhad Wadie Haddad. She is Lebanon's most revered voice and one of the best-selling recording artists in Arab history: with the Rahbani Brothers she shaped a new Lebanese song, and — a Christian whose songs were sung by all sides — she became a symbol of Lebanon's unity through its civil war and after. She is included in this museum as a towering figure of the modern Arab and Muslim world, not as a Muslim."
  ur: "لبنانی گلوکارہ و اداکارہ، بیروت میں نهاد ودیع حداد کے نام سے پیدا ہوئیں؛ لبنان کی سب سے معزز آواز اور عرب تاریخ کی سب سے زیادہ فروخت ہونے والی فنکاروں میں سے ایک، جنہوں نے رحبانی برادران کے ساتھ لبنانی گیت کی نئی صورت گھڑی، اور — ایک مسیحی ہوتے ہوئے جن کے گیت ہر فریق نے گائے — خانہ جنگی میں لبنان کی وحدت کی علامت بنیں۔ وہ اس میوزیم میں جدید عرب و مسلم دنیا کی ایک عظیم شخصیت کے طور پر شامل ہیں — مسلمان کے طور پر نہیں۔"
