summary:
  ar: "مغنية وممثلة لبنانية، وُلدت في بيروت باسم نهاد وديع حداد؛ صوت لبنان الأكثر تبجيلًا وأحد أكثر الفنانين مبيعًا في التاريخ العربي، إذ صاغت مع الأخوين رحباني شكلًا جديدًا للأغنية اللبنانية، وأصبحت — وهي مسيحية غنّت لكل الأطراف — رمزًا لوحدة لبنان في حربه الأهلية وما بعدها. وهي مدرجة في هذا المتحف بوصفها شخصية سامقة في العالم العربي والإسلامي الحديث، لا بوصفها مسلمة."
  en: "Lebanese singer and stage actress, born in Beirut as Nouhad Wadie Haddad. She is Lebanon's most revered voice and one of the best-selling recording artists in Arab history: with the Rahbani Brothers she shaped a new Lebanese song, and — a Christian whose songs were sung by all sides — she became a symbol of Lebanon's unity through its civil war and after. She is included in this museum as a towering figure of the modern Arab and Muslim world, not as a Muslim."
  ur: "لبنانی گلوکارہ و اداکارہ، بیروت میں نهاد ودیع حداد کے نام سے پیدا ہوئیں؛ لبنان کی سب سے معزز آواز اور عرب تاریخ کی سب سے زیادہ فروخت ہونے والی فنکاروں میں سے ایک، جنہوں نے رحبانی برادران کے ساتھ لبنانی گیت کی نئی صورت گھڑی، اور — ایک مسیحی ہوتے ہوئے جن کے گیت ہر فریق نے گائے — خانہ جنگی میں لبنان کی وحدت کی علامت بنیں۔ وہ اس میوزیم میں جدید عرب و مسلم دنیا کی ایک عظیم شخصیت کے طور پر شامل ہیں — مسلمان کے طور پر نہیں۔"
  es: "Cantante y actriz libanesa, nacida en Beirut como Nouhad Wadie Haddad. Es la voz más venerada del Líbano y una de las artistas con mayores ventas en la historia árabe: junto a los Hermanos Rahbani, dio forma a una nueva canción libanesa y, siendo cristiana, sus canciones fueron cantadas por todos los bandos, se convirtió en un símbolo de la unidad del Líbano durante la guerra civil y posteriormente. Se la incluye en este museo como una figura clave del mundo árabe y musulmán moderno, no como musulmana."
  fr: "Chanteuse et comédienne libanaise, née à Beyrouth sous le nom de Nouhad Wadie Haddad, elle est la voix la plus vénérée du Liban et l'une des artistes ayant vendu le plus de disques dans l'histoire du monde arabe. Avec les frères Rahbani, elle a façonné une nouvelle chanson libanaise et, chrétienne dont les chants étaient repris par tous, elle est devenue un symbole de l'unité du Liban pendant et après la guerre civile. Elle est présentée dans ce musée comme une figure emblématique du monde arabo-musulman moderne, et non comme une musulmane."
  tr: "Lübnanlı bir şarkıcı ve aktris, Beyrut'ta Nihad Wadie Haddad olarak doğmuştur; Lübnan'ın en saygı duyulan sesi ve Arap tarihinin en çok satan sanatçılarından biridir; Rahbani kardeşlerle birlikte yeni bir Lübnan şarkısı biçimi şekillendirmiş ve her tarafa şarkı söyleyen bir Hristiyan olarak Lübnan'ın iç savaşı ve sonrasında birliğinin bir simgesi olmuştur. Bu müzede modern Arap ve İslam dünyasında Müslüman olarak değil, devasa bir figür olarak listelenmiştir."
  id: "Seorang penyanyi dan aktris Lebanon, lahir di Beirut dengan nama Nihad Wadie Haddad; suara paling dihormati di Lebanon dan salah satu artis terlaris dalam sejarah Arab, yang bersama saudara Rahbani membentuk bentuk baru lagu Lebanon, dan menjadi—seorang Kristen yang bernyanyi untuk semua pihak—simbol persatuan Lebanon selama perang saudara dan seterusnya. Dia tercatat di museum ini sebagai sosok besar di dunia Arab dan Islam modern, bukan sebagai seorang Muslim."
