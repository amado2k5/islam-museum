  ar: "حيان مولى مصقلة من سبي الديلم يكنى أبا معمر من نبل الموالي وسرواتهم؛ وجهه يزيد بن المهلب إلى الأصبهبذ فخدعه حتى صالح يزيد على سبعمائة ألف درهم وأربعمائة قرن زعفراناً وتحمل حيان فضل ما بين وزني ستة وسبعة."
  en: "Hayyan, Masmala's mawla of Daylami captivity, Abu Ma'mar, among the noble and leading clients; Yazid sent him to the Ispahbadh and he worked him till the treaty stood at seven hundred thousand dirhams plus four hundred qirats of saffron — and bore himself the difference between the weight-six and weight-seven measures."
