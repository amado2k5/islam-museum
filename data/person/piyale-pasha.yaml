summary:
  ar: "قائد الأسطول العثماني؛ هاجم جزيرة جربة في رمضان ٩٦٧هـ/مايو ١٥٦٠م ونجح في تحقيق أهدافه ضد الأسبان الذين استنجدوا بفرنسا، ثم أقنعه درغوث باشا حاكم طرابلس بالتوجه لمعاقبة الثائرين قرب تاجوراء فدخل طرابلس دخول الفاتحين بسفن مزينة بأعلام الأعداء منكسة. وقاد الأسطول في حصار مالطة ٩٧٣هـ/١٥٦٥م {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  en: "Ottoman fleet commander; he attacked Djerba in Ramadan 967/May 1560 and achieved his aims against Spain — which did not scruple to call in France — then, persuaded by Dragut, governor of Tripoli, punished the rebels near Tajura, entering Tripoli like a conqueror with enemy flags drooping from his masts. He commanded the fleet again at Malta in 973/1565 {cite:dawlat-uthmaniyya-salabi p. 249-252}."
