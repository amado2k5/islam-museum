summary:
  ar: "قائد الأسطول العثماني؛ هاجم جزيرة جربة في رمضان ٩٦٧هـ/مايو ١٥٦٠م ونجح في تحقيق أهدافه ضد الأسبان الذين استنجدوا بفرنسا، ثم أقنعه درغوث باشا حاكم طرابلس بالتوجه لمعاقبة الثائرين قرب تاجوراء فدخل طرابلس دخول الفاتحين بسفن مزينة بأعلام الأعداء منكسة. وقاد الأسطول في حصار مالطة ٩٧٣هـ/١٥٦٥م {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  en: "Ottoman fleet commander; he attacked Djerba in Ramadan 967/May 1560 and achieved his aims against Spain — which did not scruple to call in France — then, persuaded by Dragut, governor of Tripoli, punished the rebels near Tajura, entering Tripoli like a conqueror with enemy flags drooping from his masts. He commanded the fleet again at Malta in 973/1565 {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  es: "Comandante de la flota otomana; atacó Djerba en Ramadán de 967/mayo de 1560 y logró sus objetivos contra España, que no dudó en recurrir a Francia. Luego, persuadido por Dragut, gobernador de Trípoli, castigó a los rebeldes cerca de Tajura, entrando en Trípoli como un conquistador con banderas enemigas ondeando en sus mástiles. Volvió a comandar la flota en Malta en 973/1565 {cite:dawlat-uthmaniyya-salabi p. 249-252}."
  fr: "Commandant de la flotte ottomane, il attaqua Djerba en Ramadan 967/mai 1560 et atteignit ses objectifs contre l'Espagne — qui n'hésita pas à faire appel à la France — puis, persuadé par Dragut, gouverneur de Tripoli, il punit les rebelles près de Tajura, entrant dans Tripoli en conquérant, les drapeaux ennemis flottant au vent. Il commanda de nouveau la flotte à Malte en 973/1565 (voir: Dawlat-Uthmaniyya-Salabi, p. 249-252)."
