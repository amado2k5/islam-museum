kids:
  ar: "برهان الدين كان معلّم الرومي الروحي، علّمه الطريق إلى الله قبل أن يصير شاعراً مشهوراً."
  en: "Burhan al-Din was the spiritual teacher of Rumi, who guided him on the path of the heart before he became a famous poet."
  ur: "برہان الدین رومی کے روحانی استاد تھے، جنہوں نے رومی کے مشہور شاعر بننے سے پہلے انہیں دل کے راستے کی تعلیم دی۔"
