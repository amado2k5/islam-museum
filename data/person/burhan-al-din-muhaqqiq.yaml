summary:
  ar: "السيد برهان الدين حسين المحقق الترمذي صوفي من أصل ترمذ على نهر جيحون، تلميذ بهاء الدين ولد وخليفته، ثم المرشد الروحي لجلال الدين الرومي في قونية، وكان الرومي يتتلمذ عليه نحو تسع سنوات. استقر بعد ذلك في قيصرية، وتتردد وفاته بين سنة 637هـ وسنة 638هـ، وتنسب إليه مقالات فارسية كبيرة تعكس سعة علمه {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  en: "Sayyid Burhan al-Din al-Husayn Muhaqqiq al-Tirmidhi was a Sufi from Tirmidh on the Oxus, a disciple and then successor of Baha al-Din Walad, and later the spiritual master of Jalal al-Din Rumi at Konya, where Rumi studied under him for about nine years. He then settled at Kayseri; his death is placed in 637 or 638 AH, and a large Persian collection of discourses is attributed to him {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  ur: "سید برہان الدین حسین محقق ترمذی دریائے آمو کے کنارے ترمذ سے تعلق رکھنے والے صوفی تھے، بہاء الدین ولد کے شاگرد اور جانشین، اور بعد میں قونیہ میں جلال الدین رومی کے روحانی مرشد، جن کے ہاں رومی نے تقریباً نو برس تعلیم پائی۔ اس کے بعد وہ قیصریہ میں رہے؛ ان کی وفات 637ھ یا 638ھ بتائی جاتی ہے اور ان سے فارسی مقالات کا ایک بڑا مجموعہ منسوب ہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
