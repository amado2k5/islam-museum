summary:
  ar: "السيد برهان الدين حسين المحقق الترمذي صوفي من أصل ترمذ على نهر جيحون، تلميذ بهاء الدين ولد وخليفته، ثم المرشد الروحي لجلال الدين الرومي في قونية، وكان الرومي يتتلمذ عليه نحو تسع سنوات. استقر بعد ذلك في قيصرية، وتتردد وفاته بين سنة 637هـ وسنة 638هـ، وتنسب إليه مقالات فارسية كبيرة تعكس سعة علمه {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  en: "Sayyid Burhan al-Din al-Husayn Muhaqqiq al-Tirmidhi was a Sufi from Tirmidh on the Oxus, a disciple and then successor of Baha al-Din Walad, and later the spiritual master of Jalal al-Din Rumi at Konya, where Rumi studied under him for about nine years. He then settled at Kayseri; his death is placed in 637 or 638 AH, and a large Persian collection of discourses is attributed to him {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  ur: "سید برہان الدین حسین محقق ترمذی دریائے آمو کے کنارے ترمذ سے تعلق رکھنے والے صوفی تھے، بہاء الدین ولد کے شاگرد اور جانشین، اور بعد میں قونیہ میں جلال الدین رومی کے روحانی مرشد، جن کے ہاں رومی نے تقریباً نو برس تعلیم پائی۔ اس کے بعد وہ قیصریہ میں رہے؛ ان کی وفات 637ھ یا 638ھ بتائی جاتی ہے اور ان سے فارسی مقالات کا ایک بڑا مجموعہ منسوب ہے {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  es: "Sayyid Burhan al-Din al-Husayn Muhaqqiq al-Tirmidhi fue un sufí de Tirmidh, a orillas del Oxus, discípulo y sucesor de Baha al-Din Walad, y posteriormente maestro espiritual de Jalal al-Din Rumi en Konya, donde Rumi estudió con él durante unos nueve años. Luego se estableció en Kayseri; su muerte se sitúa en el año 637 o 638 de la Hégira, y se le atribuye una extensa colección de discursos en persa {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  fr: "Sayyid Burhan al-Din al-Husayn Muhaqqiq al-Tirmidhi était un soufi originaire de Tirmidh, sur l'Oxus. Disciple puis successeur de Baha al-Din Walad, il fut plus tard le maître spirituel de Jalal al-Din Rumi à Konya, où ce dernier étudia auprès de lui pendant environ neuf ans. Il s'établit ensuite à Kayseri. Sa mort est située en 637 ou 638 de l'Hégire, et un important recueil de discours persans lui est attribué (voir: Encyclopaedia of Islam, vol. 10, p. 579)."
  tr: "Seyyid Burhan al-Din Hüseyin, el-Tirmidhi'nin editörü, aslen Ceyhun Nehri üzerindeki Termezh'den bir Sufi, Bahaeddin'in öğrencisi ve halefi olup, o dönemde Konya'da Celaleddin el-Rumi'nin manevi rehberiydi. Rumi, yaklaşık dokuz yıl onun yanında eğitim aldı. Daha sonra Sezariye'ye yerleşti ve ölümü sıkça 637 Hicri ile 638 Hicri arasında kaydedilir. Bilgisinin genişliğini yansıtan önemli Farsça makaleler yazdığı kabul edilir {cite:Encyclopaedia-of-Islam-2 cilt 10, s. 579}."
  id: "Sayyid Burhan al-Din Husayn, editor al-Tirmidhi, seorang Sufi yang berasal dari Termezh di Sungai Jayhun, murid Baha al-Din dan penerusnya, kemudian pembimbing spiritual Jalal al-Din al-Rumi di Konya. Rumi belajar di bawah bimbingannya selama sekitar sembilan tahun. Kemudian ia menetap di Kaisarea, dan kematiannya sering tercatat antara tahun 637 H dan 638 H. Ia dikaitkan dengan artikel besar Persia yang mencerminkan luasnya pengetahuannya {cite:Encyclopaedia-of-Islam-2 vol. 10, hlm. 579}."
