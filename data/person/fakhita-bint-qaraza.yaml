label: { ar: "فاختة بنت قرظة", en: "Fakhita bint Qaraza", es: "Fakhita bint Qaraza", fr: "Fakhita bint Qaraza", ur: "فاخیتہ بنت قرازہ" }
summary:
  ar: "فاختة بنت قرظة بن عبد عمرو بن نوفل بن عبد مناف بن قصي القرشية، امرأة معاوية بن أبي سفيان؛ حملها معه في غزوة قبرس الأولى سنة 28 امتثالاً لشرط عثمان «فإن ركبت البحر ومعك امرأتك فاركبه مأذوناً لك وإلا فلا». وروى المدائني عند المسعودي أن معاوية دخل عليها ومعه خصي وهي مكشوفة الرأس فغطت رأسها فقال إنه خصي فقالت يا أمير المؤمنين أترى المثلة به أحلت له ما حرم الله عليه فلم يدخل بعدها على حرمه خادماً {cite:muruj-al-dhahab p. 610}"
  en: "Fakhita bint Qaraza ibn Abd Amr ibn Nawfal ibn Abd Manaf ibn Qusayy the Qurashite, wife of Mu'awiya ibn Abi Sufyan; he carried her with him on the first Cyprus raid of year 28 in fulfilment of Uthman's condition — 'if you sail the sea with your wife aboard, you sail with my leave; else, no'."
  es: "Fakhita bint Qaraza ibn Abd Amr ibn Nawfal ibn Abd Manaf ibn Qusayy el Qurashita, esposa de Mu'awiya ibn Abi Sufyan; él la llevó consigo en la primera incursión a Chipre del año 28 en cumplimiento de la condición de Uthman: \"Si navegas por el mar con tu esposa a bordo, navegas con mi permiso; de lo contrario, no\"."
  fr: "Fakhita bint Qaraza ibn Abd Amr ibn Nawfal ibn Abd Manaf ibn Qusayy le Qurashite, épouse de Mu'awiya ibn Abi Sufyan; il l'emmena avec lui lors du premier raid sur Chypre de l'an 28 pour accomplir la condition d'Uthman: « Si vous naviguez en mer avec votre femme à bord, vous naviguez avec ma permission; sinon, non »."
  ur: "فاخیتہ بنت قرازہ بن عبد عمرو بن نوفل بن عبد مناف بن قصی قراشی، بیوی معاویہ بن ابی سفیان؛ وہ عثمان کی شرط کو پورا کرتے ہوئے سال 28 کے پہلے قبرص کے چھاپے پر اسے اپنے ساتھ لے گیا - 'اگر تم اپنی بیوی کے ساتھ سمندر میں سوار ہو تو تم میری اجازت سے جہاز چلاؤ۔ ورنہ، نہیں'۔"
