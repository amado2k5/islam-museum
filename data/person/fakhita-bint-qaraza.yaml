id: person/fakhita-bint-qaraza
class: person
label: { ar: "فاختة بنت قرظة", en: "Fakhita bint Qaraza" }
summary:
  ar: "فاختة بنت قرظة بن عبد عمرو بن نوفل بن عبد مناف بن قصي القرشية، امرأة معاوية بن أبي سفيان؛ حملها معه في غزوة قبرس الأولى سنة 28 امتثالاً لشرط عثمان «فإن ركبت البحر ومعك امرأتك فاركبه مأذوناً لك وإلا فلا».، وروى المدائني عند المسعودي أن معاوية دخل عليها ومعه خصي وهي مكشوفة الرأس فغطت رأسها فقال إنه خصي فقالت يا أمير المؤمنين أترى المثلة به أحلت له ما حرم الله عليه فلم يدخل بعدها على حرمه خادماً {cite:muruj-al-dhahab p. 610}"
  en: "Fakhita bint Qaraza ibn Abd Amr ibn Nawfal ibn Abd Manaf ibn Qusayy the Qurashite, wife of Mu'awiya ibn Abi Sufyan; he carried her with him on the first Cyprus raid of year 28 in fulfilment of Uthman's condition — 'if you sail the sea with your wife aboard, you sail with my leave; else, no'."
