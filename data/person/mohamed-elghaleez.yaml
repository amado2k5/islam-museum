summary:
  ar: "داعية مصري اشتهر بخطابه الوعظي المباشر الموجه إلى الشباب بالعامية المصرية. درس الصيدلة ولم يدرس العلوم الشرعية دراسة نظامية، ويدرّس دبلومات في العلوم الشرعية والسيرة. قناته الرسمية على يوتيوب «Mohammad Elghaleez» بدأت سنة 2012 وتجاوز مشتركوها 1.9 مليون مشترك، وفيها سلاسل مثل «فضفضة الأحد» و«الجواب» و«شهادة تقدير» و«كلمات»."
  en: "Egyptian preacher known for his direct preaching style addressed to young people in Egyptian colloquial Arabic. He studied pharmacy rather than formal religious sciences, and teaches diploma courses in the religious sciences and the sira. His official YouTube channel, 'Mohammad Elghaleez', began in 2012 and has passed 1.9 million subscribers; its series include Fadfadat al-Ahad (Sunday Heart-to-Heart), Al-Jawab (The Answer), Shahadat Taqdir (Certificate of Appreciation) and Kalimat (Words)."
  ur: "مصری مبلغ، جو مصری عوامی عربی میں نوجوانوں سے براہِ راست وعظی خطاب کے لیے مشہور ہیں۔ انہوں نے باقاعدہ دینی علوم کے بجائے فارمیسی کی تعلیم حاصل کی، اور دینی علوم و سیرت میں ڈپلوما کورسز پڑھاتے ہیں۔ ان کا رسمی یوٹیوب چینل «Mohammad Elghaleez» 2012 میں شروع ہوا اور اس کے سبسکرائبرز انیس لاکھ سے تجاوز کر گئے؛ اس کی سلسلوں میں «فضفضة الأحد»، «الجواب»، «شهادة تقدير» اور «كلمات» شامل ہیں۔"
