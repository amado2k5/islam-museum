summary:
  ar: "داعية مصري اشتهر بخطابه الوعظي المباشر الموجه إلى الشباب بالعامية المصرية. درس الصيدلة ولم يدرس العلوم الشرعية دراسة نظامية، ويدرّس دبلومات في العلوم الشرعية والسيرة. قناته الرسمية على يوتيوب «Mohammad Elghaleez» بدأت سنة 2012 وتجاوز مشتركوها 1.9 مليون مشترك، وفيها سلاسل مثل «فضفضة الأحد» و«الجواب» و«شهادة تقدير» و«كلمات»."
  en: "Egyptian preacher known for his direct preaching style addressed to young people in Egyptian colloquial Arabic. He studied pharmacy rather than formal religious sciences, and teaches diploma courses in the religious sciences and the sira. His official YouTube channel, 'Mohammad Elghaleez', began in 2012 and has passed 1.9 million subscribers; its series include Fadfadat al-Ahad (Sunday Heart-to-Heart), Al-Jawab (The Answer), Shahadat Taqdir (Certificate of Appreciation) and Kalimat (Words)."
  ur: "مصری مبلغ، جو مصری عوامی عربی میں نوجوانوں سے براہِ راست وعظی خطاب کے لیے مشہور ہیں۔ انہوں نے باقاعدہ دینی علوم کے بجائے فارمیسی کی تعلیم حاصل کی، اور دینی علوم و سیرت میں ڈپلوما کورسز پڑھاتے ہیں۔ ان کا رسمی یوٹیوب چینل «Mohammad Elghaleez» 2012 میں شروع ہوا اور اس کے سبسکرائبرز انیس لاکھ سے تجاوز کر گئے؛ اس کی سلسلوں میں «فضفضة الأحد»، «الجواب»، «شهادة تقدير» اور «كلمات» شامل ہیں۔"
  es: "Predicador egipcio conocido por su estilo directo al dirigirse a los jóvenes en árabe coloquial egipcio. Estudió farmacia en lugar de ciencias religiosas formales, e imparte cursos de diplomatura en ciencias religiosas y la sira. Su canal oficial de YouTube, «Mohammad Elghaleez», comenzó en 2012 y ha superado los 1,9 millones de suscriptores; entre sus series se incluyen Fadfadat al-Ahad (Conversación dominical), Al-Jawab (La respuesta), Shahadat Taqdir (Certificado de reconocimiento) y Kalimat (Palabras)."
  fr: "Prédicateur égyptien réputé pour son style direct et son enseignement aux jeunes en arabe dialectal égyptien. Il a étudié la pharmacie plutôt que les sciences religieuses et dispense des formations diplômantes en sciences religieuses et en sira. Sa chaîne YouTube officielle, « Mohammad Elghaleez », créée en 2012, compte plus de 1,9 million d'abonnés. Parmi ses séries, on trouve Fadfadat al-Ahad (Conversation du dimanche à cœur ouvert), Al-Jawab (La réponse), Shahadat Taqdir (Certificat de reconnaissance) et Kalimat (Paroles)."
  tr: "Mısır dilinde gençlere yönelik doğrudan vaazıyla ünlü Mısırlı bir vaiz. Eczacılık okudu ancak İslam bilimlerini resmi bir ders olarak okumadı ve şu anda İslam bilimleri ile Peygamber'in biyografisi diplomalarını okuyordu. Resmi YouTube kanalı \"Mohammad Elghaleez\" 2012'de başladı ve \"Fadfada Al-Ahad,\" \"Al-Jawab,\" \"Takdir Sertifikası\" ve \"Kalimat\" gibi diziler dahil olmak üzere 1,9 milyondan fazla abonesi var."
  id: "Seorang pengkhotbah Mesir yang terkenal dengan khotbahnya yang langsung ditujukan kepada pemuda dalam bahasa Arab sehari-hari Mesir. Ia belajar farmasi tetapi tidak mempelajari ilmu Islam secara formal, dan sedang menempuh diploma ilmu Islam serta biografi Nabi. Saluran YouTube resminya, \"Mohammad Elghaleez,\" dimulai pada tahun 2012 dan memiliki lebih dari 1,9 juta pelanggan, termasuk serial seperti \"Fadfada Al-Ahad,\" \"Al-Jawab,\" \"Certificate of Appreciation Certificate,\" dan \"Kalimat.\""
