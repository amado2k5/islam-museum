label:
  ar: دولة التتر ⁦(الإمبراطورية المغولية)⁩
  en: Mongol empire
  ur: "منگول سلطنت"
  es: "Imperio mongol"
  fr: "Empire mongol"
summary:
  ar: "دولة التتر من شعوب الترك وهم أمم من وراء الخطا نزلوا في حدود الصين؛ خرج عليهم جنكزخان ملك المغل فغلبوا على ممالك الإسلام وانتزعوا كرسي الخلافة ببغداد، ثم افترقت دولتهم إلى دول: ملوك ما وراء النهر وجوقية وبيت جوجي بالدشت وإيلخانات العراق، وأسلموا بعد ذلك."
  en: "The Tatar state of the Turkish nations beyond the Khita lands on China's marches; Genghis Khan, king of the Mongols, arose among them and they overran the Islamic realms and tore the caliphate's seat from Baghdad — then their state split into kingdoms: the rulers of Transoxiana, the Juchid house of the Dasht and the Ilkhans of Iraq, and in time they embraced Islam."
  ur: "چنگیز خان کے عروج سے پھیلنے والی سلطنت جس کی فوجوں نے اسلامی علاقوں اور بغداد کو فتح کیا۔ بعد میں اس کی مختلف شاخیں اور علاقائی ریاستیں قائم ہوئیں۔ {cite:tarikh-ibn-khaldun-ibar}"
  es: "El estado tártaro de las naciones turcas más allá de las tierras de Khita en las fronteras de China; Genghis Khan, rey de los mongoles, surgió entre ellos y conquistó los reinos islámicos y arrebató la sede del califato a Bagdad; luego su estado se dividió en reinos: los gobernantes de Transoxiana, la casa Juchid de los Dasht y los Ilkhanes de Irak, y con el tiempo abrazaron el Islam."
  fr: "L'État tatar des nations turques au-delà des terres Khita, aux portes de la Chine; Gengis Khan, roi des Mongols, émergea parmi eux et ils envahirent les royaumes islamiques et arrachèrent le siège du califat à Bagdad — puis leur État se divisa en royaumes: les souverains de Transoxiane, la maison Juchide des Dasht et les Ilkhans d'Irak, et avec le temps, ils embrassèrent l'islam."
