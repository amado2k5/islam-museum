summary:
  ar: "دولة التتر من شعوب الترك وهم أمم من وراء الخطا نزلوا في حدود الصين؛ خرج عليهم جنكزخان ملك المغل فغلبوا على ممالك الإسلام وانتزعوا كرسي الخلافة ببغداد، ثم افترقت دولتهم إلى دول: ملوك ما وراء النهر وجوقية وبيت جوجي بالدشت وإيلخانات العراق، وأسلموا بعد ذلك."
  en: "The Tatar state of the Turkish nations beyond the Khita lands on China's marches; Genghis Khan, king of the Mongols, arose among them and they overran the Islamic realms and tore the caliphate's seat from Baghdad — then their state split into kingdoms: the rulers of Transoxiana, the Juchid house of the Dasht and the Ilkhans of Iraq, and in time they embraced Islam."
