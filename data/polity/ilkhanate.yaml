label:
  ar: الدولة الإلخانية
  en: Ilkhanate
  ur: "ایل خانی سلطنت"
summary:
  ar: "الدولة الإلخانية أسرة مغولية حكمت بلاد فارس وبلاد الرافدين في القرنين الثالث عشر والرابع عشر الميلاديين، وبدأت بزحف هولاكو الذي أسقط بغداد سنة 1258م. وأوقف المماليك تقدمها في عين جالوت سنة 1260م، ثم اعتنق غازان الإسلام السني سنة 1295م. وانتهى حكم الأسرة الفعلي بوفاة أبي سعيد سنة 736هـ/1335م."
  en: "The Ilkhanate was the Mongol dynasty that ruled Persia and Mesopotamia in the thirteenth and fourteenth centuries, beginning with Hulegu's advance, which took Baghdad in 1258. The Mamluks halted its advance at Ayn Jalut in 1260, and Ghazan adopted Sunni Islam in 1295. Effective rule ended with the death of Abu Said in 736/1335."
  ur: "ایل خانی سلطنت ایک منگول خاندان تھا جس نے تیرہویں اور چودہویں صدی عیسوی میں ایران اور بین النہرین پر حکومت کی، اور اس کا آغاز ہلاکو کی پیش قدمی سے ہوا جس نے 1258ء میں بغداد لے لیا۔ مملوکوں نے 1260ء میں عین جالوت پر اس کی پیش قدمی روکی، اور غازان نے 1295ء میں سنی اسلام قبول کیا۔ خاندان کی مؤثر حکومت ابو سعید کی وفات 736ھ/1335ء پر ختم ہوئی۔"
