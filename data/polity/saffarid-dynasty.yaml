label:
  ar: الدولة الصفارية
  en: Saffarid dynasty
  es: "Dinastía Safárida"
  fr: "dynastie saffaride"
  ur: "سفاری خاندان"
  tr: "Saffari Devleti"
  id: "Negara Saffarid"
summary:
  ar: "دولة بني الصفار ملوك سجستان؛ نشأت من جماعة المتطوعة الذين اجتمعوا بنواحي سجستان لقتال الخوارج الشراة عند اضطراب الدولة ببغداد لقتل المتوكل، وكان اجتماعهم على صالح بن نصر الكناني، ثم قادها يعقوب بن الليث الصفار فملك هراة وكرمان وفارس وخراسان وأذعن له الخلفاء بالولايات، وتوفي سنة 265هـ فخلفه أخوه عمرو حتى أسره إسماعيل الساماني ببلخ، فانقرضت دولتهم الكبرى."
  en: "The Saffarid state, kings of Sistan; it arose from the mutatawwi'a volunteers who gathered in Sistan to fight the Kharijite Shurat as the Baghdad state faltered after al-Mutawakkil's killing, first rallying to Salih ibn Nasr al-Kinani, then led by Ya'qub ibn al-Layth al-Saffar who mastered Herat, Kirman, Fars and Khurasan with caliphal investiture — he died in 265 AH and his brother Amr succeeded until Isma'il al-Samani captured him at Balkh, ending their great state."
  es: "El estado saffarí, reyes de Sistán, surgió de los voluntarios mutatawwi'a que se reunieron en Sistán para luchar contra el Shurat jariyí cuando el estado de Bagdad flaqueó tras el asesinato de al-Mutawakkil, primero agrupándose con Salih ibn Nasr al-Kinani, y luego liderado por Ya'qub ibn al-Layth al-Saffar, quien dominó Herat, Kirman, Fars y Jorasán con la investidura califal; murió en el año 265 de la Hégira y su hermano Amr le sucedió hasta que Isma'il al-Samani lo capturó en Balkh, poniendo fin a su gran estado."
  fr: "L'État safaride, rois du Sistan; il est né des volontaires mutatawwi'a qui se sont rassemblés au Sistan pour combattre le Shurat kharijite alors que l'État de Bagdad vacillait après la mort d'al-Mutawakkil, se ralliant d'abord à Salih ibn Nasr al-Kinani, puis dirigé par Ya'qub ibn al-Layth al-Saffar qui a conquis Hérat, Kirman, Fars et le Khorasan avec l'investiture califale — il est mort en 265 AH et son frère Amr lui a succédé jusqu'à ce qu'Isma'il al-Samani le capture à Balkh, mettant fin à leur grand État."
  ur: "سفاری ریاست، سیستان کے بادشاہ؛ یہ متوکل کے رضاکاروں سے پیدا ہوا جو سیستان میں خارجی شوریٰ سے لڑنے کے لیے جمع ہوئے تھے کیونکہ المتوکل کے قتل کے بعد بغداد کی ریاست ناکام ہو گئی تھی، پہلے صالح بن نصر الکنانی کی طرف ریلی نکالی، پھر یعقوب بن لیث الصفر، کرسان خرطار، کرسان خرطار اور کفار کے ساتھ تھے۔ ان کا انتقال 265 ہجری میں ہوا اور اس کا بھائی عمرو اس وقت تک کامیاب ہوا یہاں تک کہ اسماعیل السمانی نے اسے بلخ پر قبضہ کر لیا اور ان کی عظیم ریاست کا خاتمہ کر دیا۔"
  tr: "Banu Saffar devleti, Sijastan'ın krallarıydı; Bağdat'taki devletin kargaşasında Şerari Haricilere karşı savaşmak için Sijistan çevresinde toplanan gönüllüler grubundan doğmuştur; bu kargaşa sırasında el-Mutevakkil'i öldürmek için savaşmıştır. Toplanmaları, o dönemde Herat, Kirman, Fars ve Horasan'ı yöneten Ya'qub ibn al-Layth al-Saffar tarafından yönetilen Salih bin Nasr el-Kinani tarafından yönetilmiş, halifeler ise eyaletlerde ona boyun eğmiştir. 265 Hicri'de ölmüş ve yerine kardeşi Amr geçmiştir; ta ki İsmail el-Samani onu Balh'ta yakalayana kadar; bu da büyük devletlerinin yok olmasına yol açmıştır."
  id: "Negara Banu Saffar adalah raja-raja Sijistan; berasal dari kelompok sukarelawan yang berkumpul di sekitar Sijistan untuk melawan Kharijite Sharari selama kekacauan negara di Baghdad untuk membunuh al-Mutawakkil. Pertemuan mereka dipimpin oleh Saleh ibn Nasr al-Kinani, yang saat itu dipimpin oleh Ya'qub ibn al-Layth al-Saffar, yang memerintah Herat, Kerman, Fars, dan Khorasan, dan para khalifah tunduk kepadanya di provinsi-provinsi. Ia meninggal pada tahun 265 H dan digantikan oleh saudaranya Amr hingga Ismail al-Samani menangkapnya di Balkh, yang menyebabkan kepunahan negara besar mereka."
