label:
  ar: الدولة الصفارية
  en: Saffarid dynasty
summary:
  ar: "دولة بني الصفار ملوك سجستان؛ نشأت من جماعة المتطوعة الذين اجتمعوا بنواحي سجستان لقتال الخوارج الشراة عند اضطراب الدولة ببغداد لقتل المتوكل، وكان اجتماعهم على صالح بن نصر الكناني، ثم قادها يعقوب بن الليث الصفار فملك هراة وكرمان وفارس وخراسان وأذعن له الخلفاء بالولايات، وتوفي سنة 265هـ فخلفه أخوه عمرو حتى أسره إسماعيل الساماني ببلخ، فانقرضت دولتهم الكبرى."
  en: "The Saffarid state, kings of Sistan; it arose from the mutatawwi'a volunteers who gathered in Sistan to fight the Kharijite Shurat as the Baghdad state faltered after al-Mutawakkil's killing, first rallying to Salih ibn Nasr al-Kinani, then led by Ya'qub ibn al-Layth al-Saffar who mastered Herat, Kirman, Fars and Khurasan with caliphal investiture — he died in 265 AH and his brother Amr succeeded until Isma'il al-Samani captured him at Balkh, ending their great state."
