id: polity/banu-salih-nekour
class: polity
kind: emirate
label:
  ar: بنو صالح بن منصور ملوك نكور
  en: Banu Salih ibn Mansur, kings of Nekour
  es: "Banu Salih ibn Mansur, reyes de Nekour"
  fr: "Banu Salih ibn Mansur, rois de Nekour"
  ur: "بنو صالح بن منصور، نیکور کے بادشاہ"
  tr: "Nakur kralları Banu Saleh bin Mansur"
  id: "Banu Saleh bin Mansur, raja-raja Nakur"
summary:
  ar: "إمارة بني صالح بن منصور بمدينة نكور وبلاد غمارة والهبط؛ من سلالة صالح بن منصور الحميري الذي جرى على يده إسلام غمارة في دولة بني أمية فكان إماماً مالكياً مستقيماً إلى أن هلك بتمساسان سنة 182هـ، وتوارثها ولده سعيد وصالح وسعيد بن صالح صاحب الحروب مع البربر، ونجا حفيدهم صالح اليتيم من سيف كتامة فرجع وبايعوه بمرسى غسامان سنة 305هـ في دعوة الناصر الأموي، حتى زحف إليها موسى بن أبي العافية فقتل المؤيد بن سعيد واستباح المدينة وخربها سنة 317هـ، ثم انقرض أمرهم في فتن المغرب."
  en: "The amirate of Banu Salih ibn Mansur at Nekour and the Ghumara–Habat lands; from the line of Salih ibn Mansur al-Himyari under whom Ghumara embraced Islam in the Umayyad state — a Maliki imam of upright rule until his death at Tamsasan in 182 AH — held by his heirs Sa'id, Salih and Sa'id ibn Salih through their Berber wars, and restored by the grandson Salih 'al-Yatim', who escaped the Kutama sword and took the bay'a at Marsa Ghassan in 305 under Cordoban da'wa, until Musa ibn Abi al-Afiya stormed it, killed al-Mu'ayyad ibn Sa'id and sacked the city in 317."
  es: "El emirato de Banu Salih ibn Mansur en Nekour y las tierras de Ghumara-Habat; de la línea de Salih ibn Mansur al-Himyari bajo quien Ghumara abrazó el Islam en el estado omeya —un imán malikí de gobierno recto hasta su muerte en Tamsasan en 182 AH— mantenido por sus herederos Sa'id, Salih y Sa'id ibn Salih a través de sus guerras bereberes, y restaurado por el nieto Salih 'al-Yatim', quien escapó de la espada de Kutama y tomó el bay'a en Marsa Ghassan en 305 bajo la da'wa cordobana, hasta que Musa ibn Abi al-Afiya lo asaltó, mató a al-Mu'ayyad ibn Sa'id y saqueó la ciudad en 317."
  fr: "L'émirat des Banu Salih ibn Mansur à Nekour et sur les terres de Ghumara-Habat; issu de la lignée de Salih ibn Mansur al-Himyari sous lequel Ghumara embrassa l'islam dans l'État omeyyade — un imam malikite au règne intègre jusqu'à sa mort à Tamsasan en 182 AH — détenu par ses héritiers Sa'id, Salih et Sa'id ibn Salih à travers leurs guerres berbères, et restauré par le petit-fils Salih 'al-Yatim', qui échappa à l'épée de Kutama et prêta allégeance à Marsa Ghassan en 305 sous la da'wa de Cordoue, jusqu'à ce que Musa ibn Abi al-Afiya prenne d'assaut la ville, tue al-Mu'ayyad ibn Sa'id et la pille en 317."
  ur: "نیکور میں بنو صالح بن منصور کی امارت اور ذمارہ-حبات سرزمین؛ صالح بن منصور الحمیری کے سلسلے سے جن کے تحت اموی ریاست میں غمارہ نے اسلام قبول کیا - ایک مالکی امام جو 182 ہجری میں تمسان میں اپنی موت تک سیدھا حکمرانی کرتا تھا - جو اس کے وارثوں سعید، صالح اور سعید ابن صالح کے پاس ان کی بربر جنگوں کے ذریعے تھا، اور جنہوں نے ان کی بربر جنگوں کے ذریعے اسے بحال کیا تھا۔ کوطمہ تلوار نے 305 میں قرطبہ دعوۃ کے تحت مرسہ غسان پر بیعت کی، یہاں تک کہ موسیٰ ابن ابی العفیہ نے اس پر حملہ کر دیا، معایۃ بن سعید کو قتل کر دیا اور 317 میں شہر پر قبضہ کر لیا۔"
  tr: "Nakur şehrindeki Banu Saleh bin Mansur emirliği ve Ghamara ile Al-Habt toprakları; Saleh bin Mansur Al-Himyari'nin soyundan geliyor; onu Emevi devletindeki Ghamara'da İslam'a götürdü. 182 Hicri Yıl'da Tamasan'da ölene kadar düz bir Maliki İmamıydı. Berberilerle savaş açan oğulları Sa'id, Salih ve Sa'id bin Salih onların yerine geçti. Torunları Saleh Al-Yatim, Katama kılıcından kaçtı ve geri döndü; Al-Nasir Al-Umayya'nın davetiyle 305 Hicri Marsa Ghassman'da ona bağlılık yemini ettiler; ta ki Musa bin Abi Al-Afiyah oraya yürüyüp Al-Muayyad bin Sa'id'i öldürüp şehri yağmalayıp 317 Hicri'de yıkana kadar. Sonra hükümdarlıkları Mağrip'in isyanları sırasında sona erdi."
  id: "Emirat Banu Saleh bin Mansur di kota Nakur dan tanah Ghamara serta Al-Habt; dari garis keturunan Saleh bin Mansur Al-Himyari, yang membawanya ke Islam di Ghamara di negara bagian Umayyah. Ia adalah Imam Maliki yang murni hingga meninggal di Tamasan pada tahun 182 H. Putra-putranya Sa'id, Salih, dan Sa'id bin Salih, yang telah berperang melawan bangsa Berber, menggantikan mereka. Cucu mereka Saleh Al-Yatim berhasil lolos dari pedang Katama dan kembali dan mereka bersumpah setia kepadanya di Marsa Ghassman pada tahun 305 H atas undangan Al-Nasir Al-Umayya, hingga Musa bin Abi Al-Afiyah berbaris ke sana, membunuh Al-Mu'ayyad bin Sa'id, menjarah kota itu, dan menghancurkannya pada tahun 317 H. Kemudian pemerintahan mereka berakhir di tengah pemberontakan Maghreb."
