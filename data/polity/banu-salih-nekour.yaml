id: polity/banu-salih-nekour
class: polity
kind: emirate
label:
  ar: بنو صالح بن منصور ملوك نكور
  en: Banu Salih ibn Mansur, kings of Nekour
summary:
  ar: "إمارة بني صالح بن منصور بمدينة نكور وبلاد غمارة والهبط؛ من سلالة صالح بن منصور الحميري الذي جرى على يده إسلام غمارة في دولة بني أمية فكان إماماً مالكياً مستقيماً إلى أن هلك بتمساسان سنة 182هـ، وتوارثها ولده سعيد وصالح وسعيد بن صالح صاحب الحروب مع البربر، ونجا حفيدهم صالح اليتيم من سيف كتامة فرجع وبايعوه بمرسى غسامان سنة 305هـ في دعوة الناصر الأموي، حتى زحف إليها موسى بن أبي العافية فقتل المؤيد بن سعيد واستباح المدينة وخربها سنة 317هـ، ثم انقرض أمرهم في فتن المغرب."
  en: "The amirate of Banu Salih ibn Mansur at Nekour and the Ghumara–Habat lands; from the line of Salih ibn Mansur al-Himyari under whom Ghumara embraced Islam in the Umayyad state — a Maliki imam of upright rule until his death at Tamsasan in 182 AH — held by his heirs Sa'id, Salih and Sa'id ibn Salih through their Berber wars, and restored by the grandson Salih 'al-Yatim', who escaped the Kutama sword and took the bay'a at Marsa Ghassan in 305 under Cordoban da'wa, until Musa ibn Abi al-Afiya stormed it, killed al-Mu'ayyad ibn Sa'id and sacked the city in 317."
