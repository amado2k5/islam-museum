kids:
  ar: "إمارة بني صالح حكمت مدينة نكور وبلاد غمارة في المغرب أكثر من مئة سنة، ابتداءً بصالح بن منصور الذي أسلم على يديه قومه."
  en: "A family kingdom, Banu Salih, ruled the city of Nekour in North Africa for over a hundred years, starting with Salih ibn Mansur, through whom his people embraced Islam."
  ur: "بنو صالح کی ایک ریاست جس نے شمالی افریقہ کے شہر نکور پر سو سال سے زیادہ حکومت کی — اس کی بنیاد صالح بن منصور نے رکھی جن کے ہاتھوں ان کی قوم مسلمان ہوئی۔"
