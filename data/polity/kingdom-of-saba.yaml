label: { en: "The Kingdom of Saba (Sheba)", ar: "مملكة سبأ", es: "El Reino de Saba (Sheba)", fr: "Le royaume de Saba (Sheba)", ur: "مملکت سبا ⁦(شیبا)⁩", tr: "Saba Krallığı", id: "Kerajaan Saba" }
summary:
  en: "The oldest named power of Yemen in the sira’s prologue: its traces reach twenty-five centuries before the Common Era in the excavations of Ur, its flourish begins in the eleventh century BCE, and it passed through the Mukarrib era at Sirwah and the kingdom era at Maʾrib before Himyar absorbed it around 115 BCE."
  ar: "أقدم قوة مسماة في اليمن في مقدمة السيرة: عُثر على ذكر قومها في حفريات أور بخمسة وعشرين قرناً قبل الميلاد، وازدهرت حضارتهم منذ أحد عشر قرناً قبله؛ مرّت بعهد المكاربة بصرواح ثم ملوك سبأ بمأرب، حتى غلبتها حمير نحو سنة 115ق.م."
  es: "La potencia más antigua de Yemen mencionada en el prólogo de la sira: sus vestigios se remontan a veinticinco siglos antes de la Era Común en las excavaciones de Ur, su apogeo comienza en el siglo XI a. C., y pasó por la era Mukarrib en Sirwah y la era del reino en Maʾrib antes de que Himyar la absorbiera alrededor del año 115 a. C."
  fr: "La plus ancienne puissance nommée du Yémen dans le prologue de la sira: ses traces remontent à vingt-cinq siècles avant notre ère dans les fouilles d'Ur, son apogée commence au XIe siècle avant notre ère, et elle a traversé l'ère de Mukarrib à Sirwah et l'ère du royaume de Maʾrib avant d'être absorbée par Himyar vers 115 avant notre ère."
  ur: "سیر کے پیش لفظ میں یمن کی قدیم ترین طاقت: اس کے آثار عر کی کھدائی میں عام دور سے پچیس صدیوں پہلے تک پہنچتے ہیں، اس کی نشوونما گیارہویں صدی قبل مسیح میں شروع ہوتی ہے، اور یہ سیروہ میں مکریب دور سے گزری اور ابریب کے ارد گرد بادشاہی دور سے گزری۔"
  tr: "Biyografinin girişinde Yemen'in en eski adı geçen güç: Halkı İsa'dan yirmi beş yüzyıl önce yapılan kazılarda anılmıştır. Uygarlıkları on bir yüzyıl önce gelişmiştir; Sirva'daki Makaribe döneminden ve ardından Marib'deki Saba krallarından geçerek yaklaşık MÖ 115'te Himyarlar tarafından fethedilmiştir."
  id: "Kekuatan tertua yang disebut di Yaman dalam pengantar biografi: Penduduknya disebutkan dalam penggalian pada dua puluh lima abad sebelum Kristus. Peradaban mereka berkembang sebelas abad sebelumnya; mereka melewati era Makaribah di Sirwah dan kemudian raja-raja Saba di Marib, hingga ditaklukkan oleh Himyar sekitar tahun 115 SM."
