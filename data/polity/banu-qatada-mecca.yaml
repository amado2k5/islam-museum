id: polity/banu-qatada-mecca
class: polity
kind: emirate
label:
  ar: بنو قتادة أمراء مكة
  en: Banu Qatada, sharifs of Mecca
  es: "Banu Qatada, sharifs de La Meca"
  fr: "Banu Qatada, chérifs de La Mecque"
  ur: "بنو قتادہ، شریف مکہ"
summary:
  ar: "بنو قتادة أمراء مكة بعد الهواشم؛ من ولد موسى الجون بن عبد الله بن الحسن المثنى كانوا بوادي ينبع ظواعن بادية، وكان أبو عزيز بن قتادة يناسب الهواشم فلما ضعف أمرهم ورث أمرهم وملك مكة من أيديهم من جهة النساء ومات سنة 589هـ، ثم استكثر قتادة بن إدريس من المماليك واتسعت ولايته من حدود اليمن إلى المدينة وله قلعة ينبع، ومن بعده عقبه إلى أبي نمي الذي استبد بأمر مكة نحواً من خمسين سنة ثم ابناه رميثة وحميضة، وهم أمراؤها إلى عهد ابن خلدون."
  en: "Banu Qatada, amirs of Mecca after the Hawashim; of Musa al-Jawn's line dwelling as nomads in Wadi Yanbu — Abu Aziz ibn Qatada intermarried with the Hawashim and on their decline inherited Mecca through the female line (d. 589); then Qatada ibn Idris multiplied his mamluks and stretched his writ from Yemen's borders to Medina from Yanbu's castle, his descendants ruling on to Abu Numayy who held Mecca's affairs some fifty years, then his sons Rumaytha and Humayda — Mecca's amirs in Ibn Khaldun's own day and ancestors of its later sharifs."
  es: "Banu Qatada, emires de La Meca después de los Hawashim; de la línea de Musa al-Jawn que habitaban como nómadas en Wadi Yanbu — Abu Aziz ibn Qatada se casó con los Hawashim y, en su declive, heredó La Meca por línea femenina (m. 589); luego Qatada ibn Idris multiplicó sus mamelucos y extendió su autoridad desde las fronteras de Yemen hasta Medina desde el castillo de Yanbu, sus descendientes gobernaron hasta Abu Numayy, quien dirigió los asuntos de La Meca durante unos cincuenta años, luego sus hijos Rumaytha y Humayda — emires de La Meca en la época de Ibn Khaldun y antepasados de sus posteriores sharifs."
  fr: "Les Banu Qatada, émirs de La Mecque après les Hawashim; de la lignée de Musa al-Jawn, vivant en nomades dans le Wadi Yanbu — Abu Aziz ibn Qatada s'allia par mariage avec les Hawashim et, à leur déclin, hérita de La Mecque par la lignée féminine (mort en 589); puis Qatada ibn Idris multiplia ses mamelouks et étendit son autorité des frontières du Yémen à Médine depuis le château de Yanbu, ses descendants régnant jusqu'à Abu Numayy qui gouverna La Mecque pendant une cinquantaine d'années, puis ses fils Rumaytha et Humayda — émirs de La Mecque à l'époque d'Ibn Khaldun et ancêtres de ses chérifs ultérieurs."
  ur: "بنو قتادہ، حواشم کے بعد مکہ کے امیر؛ وادی ینبو میں خانہ بدوش کے طور پر رہائش پذیر موسیٰ الجون کے سلسلے میں سے - ابوعزیز بن قتادہ نے حواشم کے ساتھ شادی کی اور ان کے زوال پر مکہ کو وراثت میں خواتین کے ذریعے ملا ⁦(متوفی 589)⁩؛ پھر قتادہ ابن ادریس نے اپنے مملوکوں کو کئی گنا بڑھایا اور یمن کی سرحدوں سے لے کر ینبو کے قلعے سے مدینہ تک اپنی رٹ کو پھیلایا، اس کی اولاد ابو نمعی تک حکومت کرتی رہی جس نے مکہ کے معاملات کو پچاس سال تک سنبھالا، پھر اس کے بیٹے رومیثہ اور حمیدہ - بعد میں مکہ مکرمہ کے اپنے ہی دن اور خلیفہ بن گئے۔ شریف"
