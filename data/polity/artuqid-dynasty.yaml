summary:
  ar: "دولة بني أرتق بن أكسك مملوك السلطان ملك شاه وملكهم لماردين وديار بكر؛ هلك أرتق سنة 483هـ بالقدس وملكه من بعده ابناه أبو الغازي وسقمان وكان لهما الرها وسروج، ولما ملك الإفرنج أنطاكية سنة 491هـ كان لسقمان في جهادهم المقام المحمود، ثم استولى على ماردين بعد مقتل ابنه ياقوتي فأقامت في ملكه مع حصن كيفا ونصيبين، وتشعبوا منها في ماردين وحصن كيفا وحرّان حتى آل ملك ماردين إلى بني أيوب."
  en: "The state of the sons of Artuq ibn Aksak, mamluk of Sultan Malikshah, masters of Mardin and Diyar Bakr; Artuq died in Jerusalem in 483 AH leaving his sons Abu al-Ghazi and Sukman holding al-Ruha and Saruj, and when the Franks took Antioch in 491 Sukman won renown in the jihad against them — after his son Yaquti's death he took Mardin itself, which stayed in his line together with Hisn Kayfa and Nisibis, branching into Mardin, Hisn Kayfa and Harran lines until Ayyubids inherited Mardin."
