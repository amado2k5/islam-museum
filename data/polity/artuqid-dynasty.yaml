summary:
  ar: "دولة بني أرتق بن أكسك مملوك السلطان ملك شاه وملكهم لماردين وديار بكر؛ هلك أرتق سنة 483هـ بالقدس وملكه من بعده ابناه أبو الغازي وسقمان وكان لهما الرها وسروج، ولما ملك الإفرنج أنطاكية سنة 491هـ كان لسقمان في جهادهم المقام المحمود، ثم استولى على ماردين بعد مقتل ابنه ياقوتي فأقامت في ملكه مع حصن كيفا ونصيبين، وتشعبوا منها في ماردين وحصن كيفا وحرّان حتى آل ملك ماردين إلى بني أيوب."
  en: "The state of the sons of Artuq ibn Aksak, mamluk of Sultan Malikshah, masters of Mardin and Diyar Bakr; Artuq died in Jerusalem in 483 AH leaving his sons Abu al-Ghazi and Sukman holding al-Ruha and Saruj, and when the Franks took Antioch in 491 Sukman won renown in the jihad against them — after his son Yaquti's death he took Mardin itself, which stayed in his line together with Hisn Kayfa and Nisibis, branching into Mardin, Hisn Kayfa and Harran lines until Ayyubids inherited Mardin."
  es: "El estado de los hijos de Artuq ibn Aksak, mameluco del sultán Malikshah, señores de Mardin y Diyar Bakr; Artuq murió en Jerusalén en el año 483 de la Hégira, dejando a sus hijos Abu al-Ghazi y Sukman al frente de al-Ruha y Saruj, y cuando los francos tomaron Antioquía en el año 491, Sukman ganó renombre en la yihad contra ellos; después de la muerte de su hijo Yaquti, tomó Mardin, que permaneció en su linaje junto con Hisn Kayfa y Nisibis, ramificándose en los linajes de Mardin, Hisn Kayfa y Harran hasta que los ayubíes heredaron Mardin."
  fr: "L'histoire des fils d'Artuq ibn Aksak, mamelouk du sultan Malikshah, maîtres de Mardin et Diyar Bakr; Artuq mourut à Jérusalem en 483 AH, laissant ses fils Abu al-Ghazi et Sukman régner sur al-Ruha et Saruj, et lorsque les Francs prirent Antioche en 491, Sukman acquit une grande renommée dans le jihad contre eux — après la mort de son fils Yaquti, il prit Mardin même, qui resta dans sa lignée avec Hisn Kayfa et Nisibis, se ramifiant en lignées de Mardin, Hisn Kayfa et Harran jusqu'à ce que les Ayyoubides héritent de Mardin."
  ur: "ارطوق ابن عسک کے بیٹوں کی حالت، سلطان ملک شاہ کے مملوک، مردین اور دیار بکر کے آقا؛ ارطوق 483 ہجری میں یروشلم میں فوت ہوا اپنے بیٹوں ابو الغازی اور سکمان کو الروح اور سروج کے پاس چھوڑ کر اور جب فرانکس نے 491 میں انطاکیہ پر قبضہ کیا تو سکمان نے ان کے خلاف جہاد میں شہرت حاصل کی - اپنے بیٹے یاقوطی کی موت کے بعد اس نے خود ماردین کو لے لیا، جو اس کی صف میں رہا اور اس کی شاخ حسنی، مریدین، کعبی اور نسیفہ کے ساتھ ساتھ رہا۔ حران لائنیں یہاں تک کہ ایوبیڈس کو ماردین وراثت میں ملا۔"
  tr: "Banu Artuq bin Aksk, Sultan Malik Şah devleti Mardin ve Diyarbeki'yi yönetti; Artuq 483 Hicri yılında Kudüs'te öldü ve ardından oğulları Ebu el-Gazi ile Saqman hüküm sürdü; hem Edessa hem de eyerleri vardı. Franklar 491 Hicri'de Antakya'yı yönettiğinde, Saqman onların cihadında takdire şayan bir konumdaydı. Oğlu Yaquti'nin öldürülmesinden sonra Mardin'i ele geçirdi, Kifa ve Nisibis kaleleriyle birlikte kendi yönetimi altına aldı ve Mardin, Kifa ve Harran'a yayıldılar, ta ki Mardin kralı Eyyub hanedanına geçene kadar."
  id: "Negara Banu Artuq ibn Aksk, Sultan Malik Shah, memerintah Mardin dan Diyarbakr; Artuq meninggal pada tahun 483 H di Yerusalem, dan setelahnya putra-putranya Abu al-Ghazi dan Saqman memerintah, yang memiliki Edessa dan pelana. Ketika bangsa Franka memerintah Antiokhia pada tahun 491 H, Saqman memegang posisi terpuji dalam jihad mereka. Ia kemudian merebut Mardin setelah kematian putranya Yaquti, mendirikannya di bawah pemerintahannya bersama benteng Kifa dan Nisibis, dan mereka menyebar ke Mardin, Kifa, dan Harran hingga raja Mardin beralih ke dinasti Ayyub."
