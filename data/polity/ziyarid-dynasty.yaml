label:
  ar: الدولة الزيارية
  en: Ziyarid dynasty
summary:
  ar: "دولة مرداويج بن زيار وأخيه وشمكير وبنيه من الجيل إخوة الديلم؛ كانوا من قواد الديلم للأطروش ثم قواداً للعلوية استظهروا بهم، فلما انقرضت دولة الأطروش على حين فشل الدولة العباسية ساروا في النواحي لطلب الملك متفرقين، فملك مرداويج أصفهان والري وبعث عن أخيه وشمكير من بلاد كيلان سنة 320هـ فاستظهر به، ثم ملك وشمكير طبرستان وجرجان بعد مقتل مرداويج وتنازع الري وأصفهان مع ركن الدولة بن بويه."
  en: "The state of Mardawij ibn Ziyar, his brother Washmakir and his sons of Gilan, brothers of the Daylamites; Daylamite commanders first for the Utrushids then the Alids, who scattered seeking kingship when the Utrushid state fell amid Abbasid weakness — Mardawij took Isfahan and Rayy and summoned Washmakir from Gilan in 320 AH to back him, then after Mardawij's killing Washmakir ruled Tabaristan and Jurjan and contested Rayy and Isfahan with Rukn al-Dawla ibn Buya."
