summary:
  ar: "زعامة مكة وولاية البيت من إسماعيل إلى قريش في عرض الرحيق المختوم: إسماعيل ثم ابناه، ثم جرهم زهاء عشرين قرناً، ثم خزاعة ثلاثمائة سنة، ثم قصي وقريش منذ نحو سنة 440م؛ حكومة خليط من الصدارة الدنيوية والزعامة الدينية، تحكم بين العرب باسم الدين وتشرف على مصالح الوافدين إلى البيت، لها دوائر تشبه البرلمان، لكنها ضعيفة كما وضح يوم غزو الأحباش."
  en: "The leadership of Mecca and custody of the House from Ismail to Quraysh in al-Raheeq al-Makhtum's account: Ismail and his sons, then Jurhum for about twenty centuries, then Khuza'a for three hundred years, then Qusayy and Quraysh from about 440 CE; a government mixing worldly primacy and religious leadership, ruling among the Arabs in religion's name and overseeing the pilgrims' affairs, with parliament-like offices, yet weak, as the Abyssinian invasion showed."
  es: "El liderazgo de La Meca y la custodia de la Casa desde Ismail hasta Quraysh, según el relato de al-Raheeq al-Makhtum: Ismail y sus hijos, luego Jurhum durante unos veinte siglos, luego Khuza'a durante trescientos años, luego Qusayy y Quraysh desde aproximadamente el año 440 d. C.; un gobierno que mezclaba la primacía mundana y el liderazgo religioso, que gobernaba entre los árabes en nombre de la religión y supervisaba los asuntos de los peregrinos, con oficinas similares a las del parlamento, pero débiles, como demostró la invasión abisinia."
  fr: "Le leadership de La Mecque et la tutelle de la Maison d'Ismaïl à Quraysh selon le récit d'al-Raheeq al-Makhtum: Ismaïl et ses fils, puis Jurhum pendant environ vingt siècles, puis Khuza'a pendant trois cents ans, puis Qusayy et Quraysh à partir d'environ 440 de notre ère; un gouvernement mêlant primauté temporelle et autorité religieuse, régnant parmi les Arabes au nom de la religion et supervisant les affaires des pèlerins, avec des organes semblables à un parlement, mais faibles, comme l'a montré l'invasion abyssinienne."
  ur: "رحیق المختم کے بیان میں مکہ کی قیادت اور اسماعیل سے قریش تک خانہ کعبہ کی نگرانی: اسماعیل اور ان کے بیٹے، پھر تقریباً بیس صدیوں تک جرہم، پھر تین سو سال تک خزاعہ، پھر قصی اور قریش تقریباً 440 عیسوی سے؛ ایک ایسی حکومت جو دنیاوی بالادستی اور مذہبی قیادت کو ملاتی ہے، عربوں میں مذہب کے نام پر حکومت کرتی ہے اور حجاج کے امور کی نگرانی کرتی ہے، پارلیمنٹ جیسے دفاتر کے ساتھ، پھر بھی کمزور، جیسا کہ حبشی حملے نے ظاہر کیا۔"
