id: polity/emirate-of-hijaz
education:
  did_you_know:
    ar: "زعامة مكة من إسماعيل إلى قريش عند المباركفوري: إسماعيل ثم ابناه، ثم جرهم زهاء عشرين قرناً، ثم خزاعة ثلاثمائة سنة، ثم قصيّ وقريش منذ نحو سنة ٤٤٠م."
    en: "Mecca's overlordship in al-Raheeq's telling ran from Isma'il and his two sons, to Jurhum for some twenty centuries, then Khuza'a for three hundred years, then Qusayy and Quraysh from about 440 CE."
    ur: "مبارکپوری کے بیان میں مکہ کی سرداری اسماعیل اور ان کے دو بیٹوں سے جُرہم تک تقریباً بیس صدیاں، پھر خزاعہ تین سو سال، اور پھر قصی اور قریش تقریباً 440ء سے رہی۔"
    sources: [source/mubarakpuri-raheeq, source/tabaqat-ibn-sad]
