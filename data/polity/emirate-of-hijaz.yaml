label: { ar: "الإمارة بالحجاز (حكومة مكة)", en: "The emirate of the Hijaz (the government of Mecca)" }
summary:
  ar: "زعامة مكة وولاية البيت من إسماعيل إلى قريش في عرض الرحيق المختوم: إسماعيل ثم ابناه، ثم جرهم زهاء عشرين قرناً، ثم خزاعة ثلاثمائة سنة، ثم قصي وقريش منذ نحو سنة 440م؛ حكومة خليط من الصدارة الدنيوية والزعامة الدينية، تحكم بين العرب باسم الدين وتشرف على مصالح الوافدين إلى البيت، لها دوائر تشبه البرلمان، لكنها ضعيفة كما وضح يوم غزو الأحباش."
  en: "The leadership of Mecca and custody of the House from Ismail to Quraysh in al-Raheeq al-Makhtum's account: Ismail and his sons, then Jurhum for about twenty centuries, then Khuza'a for three hundred years, then Qusayy and Quraysh from about 440 CE; a government mixing worldly primacy and religious leadership, ruling among the Arabs in religion's name and overseeing the pilgrims' affairs, with parliament-like offices, yet weak, as the Abyssinian invasion showed."
