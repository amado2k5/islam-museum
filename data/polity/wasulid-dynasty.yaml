label:
  ar: دولة بني واسول بسجلماسة
  en: Wasulid (Midrarid) state of Sijilmasa
  es: "Estado wasulid (midrárido) de Sijilmasa"
  fr: "État wasulide (midraride) de Sijilmasa"
summary:
  ar: "دولة بني واسول بن مصلان بن أبي يزول ملوك سجلماسة وأعمالها من مكناسة؛ دان أهل مواطن سجلماسة بدين الصفرية من الخوارج فاجتمع زهاء أربعين من رجالاتهم ونقضوا طاعة الخلفاء وولوا عيسى بن يزيد الأسود واختطوا مدينة سجلماسة سنة 140هـ، ثم انقلت الإمارة إلى أبي القاسم سمكو وبنيه فاستفحل ملكهم وبنوا سورها ومصانعها وقصورها، ودامت دولتهم حتى زحف إليها خزرون بن فلفول من ملوك مغراوة سنة 366هـ فقتل أميرهم المعتز بالله واستولى على بلده وذخيرته."
  en: "The state of Banu Wasul ibn Maslan ibn Abi Yazul, Miknasa kings of Sijilmasa and its districts; the people of Sijilmasa's site embraced the Sufrite Kharijite creed, forty of their chief men renounced caliphal obedience, elected Isa ibn Yazid al-Aswad and founded the city in 140 AH — the imamate then passed to Abu al-Qasim Samku and his sons, who built its wall, workshops and palaces, until Khazrun ibn Fulful of the Maghrawa kings marched in 366, killed their amir al-Mu'tazz bi'llah and seized the land and its hoard."
  es: "El estado de Banu Wasul ibn Maslan ibn Abi Yazul, reyes Miknasa de Sijilmasa y sus distritos; la gente del sitio de Sijilmasa abrazó el credo sufrita jariyita, cuarenta de sus principales hombres renunciaron a la obediencia califal, eligieron a Isa ibn Yazid al-Aswad y fundaron la ciudad en 140 AH; el imamato pasó entonces a Abu al-Qasim Samku y sus hijos, quienes construyeron su muralla, talleres y palacios, hasta que Khazrun ibn Fulful de los reyes maghrawa marchó en 366, mató a su emir al-Mu'tazz bi'llah y se apoderó de la tierra y su tesoro."
  fr: "L'État de Banu Wasul ibn Maslan ibn Abi Yazul, rois Miknasa de Sijilmasa et de ses districts; les habitants du site de Sijilmasa embrassèrent la croyance kharijite soufrite, quarante de leurs chefs renoncèrent à l'obéissance califale, élurent Isa ibn Yazid al-Aswad et fondèrent la ville en 140 AH — l'imamat passa ensuite à Abu al-Qasim Samku et à ses fils, qui construisirent ses murs, ses ateliers et ses palais, jusqu'à ce que Khazrun ibn Fulful des rois Maghrawa marche en 366, tue leur amir al-Mu'tazz bi'llah et s'empare du territoire et de son trésor."
