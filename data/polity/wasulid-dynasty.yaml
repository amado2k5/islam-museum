label:
  ar: دولة بني واسول بسجلماسة
  en: Wasulid (Midrarid) state of Sijilmasa
summary:
  ar: "دولة بني واسول بن مصلان بن أبي يزول ملوك سجلماسة وأعمالها من مكناسة؛ دان أهل مواطن سجلماسة بدين الصفرية من الخوارج فاجتمع زهاء أربعين من رجالاتهم ونقضوا طاعة الخلفاء وولوا عيسى بن يزيد الأسود واختطوا مدينة سجلماسة سنة 140هـ، ثم انقلت الإمارة إلى أبي القاسم سمكو وبنيه فاستفحل ملكهم وبنوا سورها ومصانعها وقصورها، ودامت دولتهم حتى زحف إليها خزرون بن فلفول من ملوك مغراوة سنة 366هـ فقتل أميرهم المعتز بالله واستولى على بلده وذخيرته."
  en: "The state of Banu Wasul ibn Maslan ibn Abi Yazul, Miknasa kings of Sijilmasa and its districts; the people of Sijilmasa's site embraced the Sufrite Kharijite creed, forty of their chief men renounced caliphal obedience, elected Isa ibn Yazid al-Aswad and founded the city in 140 AH — the imamate then passed to Abu al-Qasim Samku and his sons, who built its wall, workshops and palaces, until Khazrun ibn Fulful of the Maghrawa kings marched in 366, killed their amir al-Mu'tazz bi'llah and seized the land and its hoard."
