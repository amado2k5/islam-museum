kids:
  ar: "بنو عباد أسرة ملكت إشبيلية قبل نحو ألف سنة، وكان ملوكها يحبون الشعر والعلماء."
  en: "The Abbadids were a family of kings who ruled Seville about a thousand years ago and loved poetry and learning."
  ur: "بنو عباد بادشاہوں کا وہ خاندان تھا جس نے تقریباً ہزار سال پہلے اشبیلیہ پر حکومت کی اور شاعری اور علم سے محبت رکھتا تھا۔"
