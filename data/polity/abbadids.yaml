label: { ar: "بنو عباد", en: "Abbadids (Banu Abbad)", ur: "بنو عباد" }
summary:
  ar: "بنو عباد أسرة عربية حكمت جنوب غرب الأندلس وعاصمتها إشبيلية أكثر القرن الخامس الهجري/الحادي عشر الميلادي، بدأها القاضي محمد بن عباد سنة 414هـ/1013م، واشتهر منها المعتضد والمعتمد، وانتهت بسقوط إشبيلية في يد المرابطين، وتعدها دائرة المعارف الإسلامية أبرز دول الطوائف وأكثرها ازدهاراً للفنون والآداب {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
  en: "The Abbadids were an Arab dynasty who ruled the south-west of al-Andalus from Seville for most of the 5th/11th century. It began with the qadi Muhammad ibn Abbad, proclaimed ruler in 414 AH, and is best known for al-Mu'tadid and al-Mu'tamid. It ended when the Almoravids took Seville, and the Encyclopaedia of Islam counts it the most brilliant of the taifa dynasties and the one under which arts and letters shone brightest {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
  ur: "بنو عباد ایک عرب خاندان تھا جس نے پانچویں صدی ہجری/گیارہویں صدی عیسوی کے بیشتر حصے میں اندلس کے جنوب مغرب پر اشبیلیہ سے حکومت کی۔ اس کا آغاز قاضی محمد بن عباد سے ہوا جو 414ھ/1013ء میں حکمران قرار پائے، اور معتضد و معتمد اس کے مشہور ترین حکمران ہیں۔ خاندان کا خاتمہ اشبیلیہ پر مرابطین کے قبضے سے ہوا؛ دائرۃ المعارف الاسلامیہ اسے ملوک الطوائف کا سب سے درخشاں خاندان اور وہ دور کہتی ہے جس میں اندلس کے فنون و ادب سب سے زیادہ چمکے {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
