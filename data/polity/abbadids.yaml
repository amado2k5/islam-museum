label: { ar: "بنو عباد", en: "Abbadids (Banu Abbad)", ur: "بنو عباد", es: "Abadíes (Banu Abbad)", fr: "Abbadides (Banu Abbad)", tr: "Banu Abbad", id: "Banu Abbad" }
summary:
  ar: "بنو عباد أسرة عربية حكمت جنوب غرب الأندلس وعاصمتها إشبيلية أكثر القرن الخامس الهجري/الحادي عشر الميلادي، بدأها القاضي محمد بن عباد سنة 414هـ/1013م، واشتهر منها المعتضد والمعتمد، وانتهت بسقوط إشبيلية في يد المرابطين، وتعدها دائرة المعارف الإسلامية أبرز دول الطوائف وأكثرها ازدهاراً للفنون والآداب {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
  en: "The Abbadids were an Arab dynasty who ruled the south-west of al-Andalus from Seville for most of the 5th/11th century. It began with the qadi Muhammad ibn Abbad, proclaimed ruler in 414 AH, and is best known for al-Mu'tadid and al-Mu'tamid. It ended when the Almoravids took Seville, and the Encyclopaedia of Islam counts it the most brilliant of the taifa dynasties and the one under which arts and letters shone brightest {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
  ur: "بنو عباد ایک عرب خاندان تھا جس نے پانچویں صدی ہجری/گیارہویں صدی عیسوی کے بیشتر حصے میں اندلس کے جنوب مغرب پر اشبیلیہ سے حکومت کی۔ اس کا آغاز قاضی محمد بن عباد سے ہوا جو 414ھ/1013ء میں حکمران قرار پائے، اور معتضد و معتمد اس کے مشہور ترین حکمران ہیں۔ خاندان کا خاتمہ اشبیلیہ پر مرابطین کے قبضے سے ہوا؛ دائرۃ المعارف الاسلامیہ اسے ملوک الطوائف کا سب سے درخشاں خاندان اور وہ دور کہتی ہے جس میں اندلس کے فنون و ادب سب سے زیادہ چمکے {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
  es: "Los abbádidas fueron una dinastía árabe que gobernó el suroeste de al-Ándalus desde Sevilla durante la mayor parte de los siglos V al XI. Su reinado comenzó con el cadí Muhammad ibn Abbad, proclamado gobernante en el año 414 de la Hégira, y es especialmente conocida por al-Mu'tadid y al-Mu'tamid. Finalizó con la conquista de Sevilla por los almorávides, y la Enciclopedia del Islam la considera la más brillante de las dinastías taifas y aquella bajo cuyo reinado florecieron las artes y las letras {cite:encyclopaedia-of-islam-2 vol. 1 p. 24; vol. 1 p. 26}."
  fr: "Les Abbadides étaient une dynastie arabe qui régna sur le sud-ouest d'al-Andalus depuis Séville pendant la majeure partie du Ve/XIe siècle. Elle débuta avec le cadi Muhammad ibn Abbad, proclamé souverain en 414 AH, et est surtout connue pour ses figures emblématiques, les Mu'tadid et les Mu'tamid. Son règne prit fin avec la prise de Séville par les Almoravides. L'Encyclopédie de l'Islam la considère comme la plus brillante des dynasties taïfa et celle sous laquelle les arts et les lettres connurent leur apogée (encyclopédie de l'Islam, vol. 1, p. 24; vol. 1, p. 26)."
  tr: "Banu Abbad, beşinci yüzyıl / on birinci yüzyıl boyunca başkenti Sevilla'da bulunan Endülüs'ün güneybatısında hüküm süren bir Arap ailesiydi. 414 Hicri / 1013 yılında Yargıç Muhammed bin Abbad tarafından kurulmuştur. Aralarında al-Mu'tadid ve al-Mu'tamid ile ünlenmiştir ve sonunda Sevilla'nın Almoravidlere düşmesiyle sona ermiştir. İslam Ansiklopedisi, Tayfa'nın sanat ve edebiyat alanındaki en önde gelen ve gelişen devletlerinden biri olarak kabul edilir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 24; cilt 1, s. 26}."
  id: "Banu Abbad adalah keluarga Arab yang memerintah di barat daya al-Andalus, dengan ibu kotanya di Sevilla selama sebagian besar abad kelima H / abad kesebelas M. Gereja ini didirikan oleh Hakim Muhammad ibn Abbad pada tahun 414 H / 1013 M. Gereja ini menjadi terkenal di antara mereka karena al-Mu'tadid dan al-Mu'tamid, dan berakhir dengan jatuh Seville ke tangan Almoravid. Ensiklopedia Islam menganggapnya sebagai salah satu negara paling menonjol dan berkembang di Taifa dalam seni dan sastra {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 24; vol. 1, hlm. 26}."
