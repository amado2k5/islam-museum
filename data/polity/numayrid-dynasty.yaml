  tr: "On birinci yüzyılda Edessa, Rakka ve Harran'ı yöneten Arap göçebe ailesi Nimiris'in ön kartı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Nimiri, keluarga nomaden Arab yang memerintah Edessa, Raqqa, dan Harran pada abad kesebelas; sumber-sumbernya di halaman belum ditinjau."
