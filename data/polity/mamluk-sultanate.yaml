summary:
  ar: دولة حكمت مصر والشام والحجاز من نحو 1250م إلى الفتح العثماني سنة 1517م، وكان مركزها القاهرة. تعاقب عليها المماليك البحرية ثم البرجية.
  en: The state that ruled Egypt, Syria and the Hejaz from about 1250 until the Ottoman conquest in 1517, centred on Cairo; its rulers came first from the Bahri and then from the Burji Mamluks.
  ur: وہ ریاست جس نے تقریباً 1250ء سے 1517ء میں عثمانی فتح تک مصر، شام اور حجاز پر حکومت کی؛ اس کا مرکز قاہرہ تھا، اور اس کے حکمران پہلے بحری اور پھر برجی مملوکوں میں سے آئے۔
