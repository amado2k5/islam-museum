id: polity/ghana-empire
class: polity
kind: dynasty
label:
  ar: مملكة غانة القديمة
  en: Ghana Empire
  es: "Imperio de Ghana"
  fr: "Empire du Ghana"
  ur: "گھانا سلطنت"
  tr: "Antik Gana Krallığı"
  id: "Kerajaan kuno Ghana"
summary:
  ar: أعظم ممالك السودان قديماً، حاضرتها غانة بمدينتين على حافتي النيل من أعظم مدائن العالم، مسلمة من قديم الزمن، أول من أسلم من ملوكها برمندانه الذي حج واقتفت ملوكها من بعده سننه في الحج، ثم ضعف ملكها فتغلب عليها أهل صوصو ثم أهل مالي. ويذكر ابن خلدون في أخبار الأدارسة أنه كان بمدينة غانة من بلاد السودان مما يلي البحر ملك لبني صالح بن عبد الله من أعقاب موسى الجون بن عبد الله بن الحسن المثنى، يقال إنهم لحقوا بالمغرب لما حبس المأمون جدهم بخراسان، على ما أورده بعض المؤرخين ولم يذكره ابن حزم.
  en: The greatest of the old Sudanese kingdoms, its capital Ghana standing in two cities on the banks of the Niger among the largest cities of the world, Muslim from early times, whose first convert king was Barmandana the pilgrim, until the Susu then Mali absorbed it.
  es: "El más grande de los antiguos reinos sudaneses, con su capital Ghana, situada en dos ciudades a orillas del Níger, entre las más grandes del mundo, musulmán desde sus inicios, cuyo primer rey converso fue Barmandana el peregrino, hasta que los Susu y luego Malí lo absorbieron."
  fr: "Le plus grand des anciens royaumes soudanais, sa capitale Ghana, s'étendant sur deux villes sur les rives du Niger parmi les plus grandes villes du monde, musulman depuis les temps anciens, dont le premier roi converti fut Barmandana le pèlerin, jusqu'à ce que le Susu puis le Mali l'absorbent."
  ur: "پرانی سوڈانی سلطنتوں میں سب سے بڑی، اس کا دارالحکومت گھانا دنیا کے سب سے بڑے شہروں میں نائیجر کے کنارے پر دو شہروں میں کھڑا ہے، ابتدائی زمانے سے مسلمان، جس کا پہلا مذہب تبدیل کرنے والا بادشاہ برمندانا حجاج تھا، یہاں تک کہ سوسو پھر مالی نے اسے جذب کر لیا۔"
  tr: "Antik çağlarda Sudan'ın en büyük krallığı olan Gana, Nil kıyısındaki iki şehir tarafından kurulmuştur; bu şehir dünyanın en büyük şehirlerinden biridir. Eski zamanlardan beri Müslüman olan kralları arasında ilk İslam'a geçen Barmandana'dır; Hac ayini yapan ve kralları onun geleneklerini hac yolunda takip etmiştir. Daha sonra yönetimi zayıflamış, Soso halkı ve ardından Mali halkı galip gelmiştir. İbn Haldun, İdrisi anlatımlarında Sudan topraklarındaki Gana şehrinin, deniz kenarında, Musa al-Jawn ibn Abdullah ibn al-Hasan al-Muthanna'nın soyundan gelen Banu Salih ibn Abdullah'a ait olduğunu belirtir. Bazı tarihçilere göre, el-Mevmun büyükbabalarını Horasan'da hapse attığında Mağrip'e katıldıkları söylenir, ancak İbn Hazm tarafından bahsedilmemiştir."
  id: "Kerajaan terbesar Sudan pada zaman kuno, Ghana didirikan oleh dua kota di tepi Sungai Nil, salah satu kota terbesar di dunia. Muslim sejak zaman dahulu, raja pertama yang masuk Islam adalah Barmandana, yang melaksanakan Haji, dan raja-rajanya mengikuti tradisinya dalam ziarah. Kemudian pemerintahannya melemah, dan rakyat Soso menang serta rakyat Mali. Ibn Khaldun menyebutkan dalam catatan Idriyah bahwa kota Ghana di tanah Sudan, dekat laut, dimiliki oleh Banu Salih ibn Abdullah, keturunan Musa al-Jawn ibn Abdullah ibn al-Hasan al-Muthanna. Dikatakan bahwa mereka bergabung dengan Maghreb ketika al-Ma'mun memenjarakan kakek mereka di Khorasan, menurut beberapa sejarawan tetapi tidak disebutkan oleh Ibn Hazm."
