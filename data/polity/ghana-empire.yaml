label:
  ar: مملكة غانة القديمة
  en: Ghana Empire
summary:
  ar: أعظم ممالك السودان قديماً، حاضرتها غانة بمدينتين على حافتي النيل من أعظم مدائن العالم، مسلمة من قديم الزمن، أول من أسلم من ملوكها برمندانه الذي حج واقتفت ملوكها من بعده سننه في الحج، ثم ضعف ملكها فتغلب عليها أهل صوصو ثم أهل مالي. ويذكر ابن خلدون في أخبار الأدارسة أنه كان بمدينة غانة من بلاد السودان مما يلي البحر ملك لبني صالح بن عبد الله من أعقاب موسى الجون بن عبد الله بن الحسن المثنى، يقال إنهم لحقوا بالمغرب لما حبس المأمون جدهم بخراسان، على ما أورده بعض المؤرخين ولم يذكره ابن حزم.
  en: The greatest of the old Sudanese kingdoms, its capital Ghana standing in two cities on the banks of the Niger among the largest cities of the world, Muslim from early times, whose first convert king was Barmandana the pilgrim, until the Susu then Mali absorbed it.
