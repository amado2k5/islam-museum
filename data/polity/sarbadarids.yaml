summary:
  ar: "السربداريون حكام بيهق، أي ناحية سبزوار في غرب خراسان، وجزء من أتباعهم، في نحو نصف قرن بين وفاة أبي سعيد وفتح تيمور لبلاد فارس. بدأت حركتهم من باشتين قرب سبزوار في 9 شعبان 737هـ/13 آذار 1337م، وجمعت بين ملاك ريفيين وفتيان وأتباع شيوخ صوفية، وتحولت مع الزمن إلى التشيع، ويرى المقال أنها أصلح ما تُفهم محاولة حكم ذاتي لسكان غرب خراسان في وجه تفكك الحكم المغولي {cite:encyclopaedia-of-islam-2 vol. 9 p. 56} {cite:encyclopaedia-of-islam-2 vol. 9 p. 58}."
  en: "The Sarbadarids were the rulers of Bayhaq, the Sabzawar region of western Khurasan, together with part of their followers, in the half century between the death of Abu Said and Timur's conquest of Persia. The movement began at Bashtin near Sabzawar on 9 Sha'ban 737/13 March 1337, drew together rural landowners, young men and the followers of Sufi shaykhs, and moved over time towards Shi'ism; the article judges it best seen as an attempt at self-government by the indigenous population of western Khurasan facing the disintegration of Mongol rule {cite:encyclopaedia-of-islam-2 vol. 9 p. 56} {cite:encyclopaedia-of-islam-2 vol. 9 p. 58}."
  ur: "سربداری بیہق، یعنی مغربی خراسان کے علاقے سبزوار، کے حکمران اور ان کے پیروکاروں کا ایک حصہ تھے، جو ابو سعید کی وفات اور تیمور کی ایران پر فتح کے درمیان تقریباً نصف صدی تک رہے۔ تحریک 9 شعبان 737ھ/13 مارچ 1337ء کو سبزوار کے قریب باشتین سے شروع ہوئی، اس میں دیہی زمیندار، نوجوان اور صوفی شیوخ کے پیروکار شامل ہوئے، اور وقت کے ساتھ اس کا جھکاؤ تشیع کی طرف ہوا؛ مضمون کی رائے میں اسے مغربی خراسان کے مقامی باشندوں کی مغل حکومت کے انتشار کے سامنے خود حکمرانی کی کوشش سمجھنا زیادہ مفید ہے {cite:encyclopaedia-of-islam-2 vol. 9 p. 56} {cite:encyclopaedia-of-islam-2 vol. 9 p. 58}."
