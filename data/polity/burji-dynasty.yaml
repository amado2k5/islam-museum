summary:
  ar: "بطاقة أولية للمماليك البرجية، ثاني سلالات دولة المماليك بمصر وملوكها من الجراكسة من ١٣٨٢ إلى ١٥١٧م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Burji Mamluks, the second dynasty of the Mamluk sultanate in Egypt, its Circassian kings ruling from 1382 to 1517; its sources are not yet checked on the page."
  es: "Ficha preliminar de los mamelucos Burji, la segunda dinastía del sultanato mameluco en Egipto, cuyos reyes circasianos gobernaron desde 1382 hasta 1517; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet concernant les Mamelouks de Burji, la deuxième dynastie du sultanat mamelouk d'Égypte, dont les rois circassiens ont régné de 1382 à 1517; ses sources ne sont pas encore vérifiées sur la page."
  ur: "برجی مملوک کے لیے ڈرافٹ کارڈ، مصر میں مملوک سلطنت کا دوسرا خاندان، اس کے سرکاسی بادشاہوں نے 1382 سے 1517 تک حکومت کی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Mısır'daki Memlük devletinin ikinci hanedanı ve 1382-1517 yılları arasında Çerkes kralları olan Burji Memlüklerinin ön kartı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu awal Mamluk Burji, dinasti kedua negara Mamluk di Mesir dan raja-raja Circassian dari tahun 1382 hingga 1517 M; sumber-sumbernya di halaman tersebut belum ditinjau."
