id: polity/uqaylid-dynasty
class: polity
kind: dynasty
label:
  ar: الدولة العقيلية
  en: Uqaylid dynasty
  es: "Dinastía Uqaylid"
  fr: "dynastie des Ouqaylidés"
  ur: "عقیلد خاندان"
  tr: "Aqiliyya Devleti"
  id: "Negara Bagian Aqiliyya"
summary:
  ar: "دولة بني عقيل بن كعب بن ربيعة بن عامر بن صعصعة بالموصل والجزيرة؛ استفحل أمرهم عند فشل دولة بني حمدان فملكها أبو الدرداء محمد بن المسيب، ثم أخوه المقلد الملقب حسام الدولة بضمان بهاء الدولة البويهي، فكان له الموصل والكوفة والقصر والجامعان، وتداولها أبناؤه قرواش وبدران وذراعهم حتى أفضت إلى مسلم بن قريش الذي مد ملكها إلى الشام وحلب."
  en: "The state of Banu Uqayl ibn Ka'b at Mosul and the Jazira; they rose as Hamdanid power failed — Abu al-Darda' Muhammad ibn al-Musayyib seized Mosul, then his brother al-Muqallad (titled Husam al-Dawla under Baha' al-Dawla's patronage) held Mosul, Kufa, al-Qasr and the two congregational towns, and their sons Qirwash and Badran succeeded until Muslim ibn Quraysh extended the realm to Syria and Aleppo."
  es: "El estado de Banu Uqayl ibn Ka'b en Mosul y Jazira; surgieron cuando el poder de Hamdanid fracasó: Abu al-Darda' Muhammad ibn al-Musayyib se apoderó de Mosul, luego su hermano al-Muqallad (titulado Husam al-Dawla bajo el patrocinio de Baha' al-Dawla) gobernó Mosul, Kufa, al-Qasr y las dos ciudades congregacionales, y sus hijos Qirwash y Badran los sucedieron hasta que Muslim ibn Quraysh extendió el reino a Siria y Alepo."
  fr: "L'État de Banu Uqayl ibn Ka'b à Mossoul et dans la Jazira; ils se sont élevés lorsque le pouvoir hamdanide s'est effondré — Abu al-Darda' Muhammad ibn al-Musayyib s'est emparé de Mossoul, puis son frère al-Muqallad (titré Husam al-Dawla sous le patronage de Baha' al-Dawla) a détenu Mossoul, Kufa, al-Qasr et les deux villes de la congrégation, et leurs fils Qirwash et Badran ont succédé jusqu'à ce que Muslim ibn Quraysh étende le royaume à la Syrie et à Alep."
  ur: "موصل اور جزیرہ میں بنو عقیل بن کعب کی حالت؛ ہمدانی طاقت کے ناکام ہونے پر وہ اٹھ کھڑے ہوئے - ابو الدرداء محمد بن المسیب نے موصل پر قبضہ کیا، پھر اس کے بھائی المقلد ⁦(بہاء الدولہ کی سرپرستی میں حسام الدولہ کا عنوان)⁩ نے موصل، کوفہ، القصر اور دو اجتماعی قصبوں پر قبضہ کیا جب تک کہ ان کے بیٹے قشرین اور قشریٰ کے کامیاب نہ ہو گئے۔ اس کا دائرہ شام اور حلب تک پھیلا دیا۔"
  tr: "Musul ve Cazire'deki Banu Aqil ibn Ka'b ibn Rabi'ah ibn Amir ibn Sa'sa'a devleti; Banu Hamdan devleti çöktüğünde işleri kötüleşti ve devlet, Baha' al-Dawla al-Buwayhi'nin garantisiyle Ebu el-Derda Muhammed bin el-Musayyib, ardından kardeşi el-Muqallid tarafından Hüsam al-Dawla lakaplı Hüsam al-Dawla tarafından yönetildi. Musul, Kufe, saray ve iki cami vardı; bunlar oğulları Karvaş, Badran ve onların silahlarını değiştirdi; Müslüman ibn Kureyş'e ulaştı ve Müslüman ibn Kureyş, Şam ve Halep'e kadar hüküm sürdü."
  id: "Negara Banu Aqil ibn Ka'b ibn Rabi'ah ibn Amir ibn Sa'sa'a di Mosul dan Jazira; urusan mereka memburuk ketika negara Banu Hamdan gagal, dan diperintah oleh Abu al-Darda Muhammad ibn al-Musayyib, yang kemudian oleh saudaranya al-Muqallid yang dijuluki Hussam al-Dawla dengan jaminan Baha' al-Dawla al-Buwayhi. Ia memiliki Mosul, Kufa, istana, dan dua masjid, yang kemudian dipertukarkan oleh putra-putranya Qarwash, Badran, dan lambang mereka hingga mencapai Muslim ibn Quraysh, yang kemudian memperluas kekuasaannya ke Levant dan Aleppo."
