label:
  ar: الدولة العقيلية
  en: Uqaylid dynasty
summary:
  ar: "دولة بني عقيل بن كعب بن ربيعة بن عامر بن صعصعة بالموصل والجزيرة؛ استفحل أمرهم عند فشل دولة بني حمدان فملكها أبو الدرداء محمد بن المسيب، ثم أخوه المقلد الملقب حسام الدولة بضمان بهاء الدولة البويهي، فكان له الموصل والكوفة والقصر والجامعان، وتداولها أبناؤه قرواش وبدران وذراعهم حتى أفضت إلى مسلم بن قريش الذي مد ملكها إلى الشام وحلب."
  en: "The state of Banu Uqayl ibn Ka'b at Mosul and the Jazira; they rose as Hamdanid power failed — Abu al-Darda' Muhammad ibn al-Musayyib seized Mosul, then his brother al-Muqallad (titled Husam al-Dawla under Baha' al-Dawla's patronage) held Mosul, Kufa, al-Qasr and the two congregational towns, and their sons Qirwash and Badran succeeded until Muslim ibn Quraysh extended the realm to Syria and Aleppo."
