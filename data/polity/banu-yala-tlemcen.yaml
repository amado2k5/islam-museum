id: polity/banu-yala-tlemcen
class: polity
kind: emirate
label:
  ar: بنو يعلى ملوك تلمسان
  en: Banu Ya'la, kings of Tlemcen
  es: "Banu Ya'la, reyes de Tlemcen"
  fr: "Banu Ya'la, rois de Tlemcen"
  ur: "بنو یالہ، تلمسن کے بادشاہ"
  tr: "Banu Ya'ala, Tlemcen Kralları"
  id: "Banu Ya'ala, Raja Tlemcen"
summary:
  ar: "إمارة بني يعلى من آل خزر من مغراوة بتلمسان؛ من ولد يعلى بن الخير بن محمد بن خزر، جاوروا بني زيري بفاس وبني يفرن اليفرني بسلا وتادلا، وكانت لأمرائهم حروب ووقائع مع زغبة من العرب ومع بني حماد ومصامدة وبرغواطة، وآخر أمرائهم العباس بن بختي صاحب تلمسان الذي أغزى يوسف بن تاشفين إليه مزدلي بن تبلكان في عساكر لمتونة فدوّخوا المغرب الأوسط وقتلوا يعلى ابنه ثم قتل العباس نفسه في فتح تلمسان سنة 475هـ، فانقرضت دولتهم وصارت تلمسان ثغراً لملك المرابطين."
  en: "The emirate of Banu Ya'la of the Khazirid Maghrawa at Tlemcen; descendants of Ya'la ibn al-Khayr ibn Muhammad ibn Khazir, neighbours of the Fez Zirids and the Salé Yafranids, whose amirs warred the Zughba Arabs, the Hammadids, the Musamida and Barghawata — their last amir al-Abbas ibn Bakhti, against whom Yusuf ibn Tashfin sent Mazdali ibn Tablakan's Lamtuna host that swept the Middle Maghreb, killed his son Ya'la and then al-Abbas himself when Tlemcen fell in 475, ending the dynasty and making Tlemcen an Almoravid march."
  es: "El emirato de Banu Ya'la del Khazirid Maghrawa en Tlemcen; descendientes de Ya'la ibn al-Khayr ibn Muhammad ibn Khazir, vecinos de los ziríes de Fez y los yafranidas de Salé, cuyos emires lucharon contra los árabes zughba, los hammadidas, los musamidas y los barghawata; su último amir al-Abbas ibn Bakhti, contra quien Yusuf ibn Tashfin envió la hueste Lamtuna de Mazdali ibn Tablakan que arrasó el Oriente Medio. Magreb, mató a su hijo Ya'la y luego al propio al-Abbas cuando Tlemcen cayó en 475, poniendo fin a la dinastía y convirtiendo a Tlemcen en una marcha almorávide."
  fr: "L'émirat des Banu Ya'la du Maghrawa Khaziride à Tlemcen; descendants de Ya'la ibn al-Khayr ibn Muhammad ibn Khazir, voisins des Zirides de Fès et des Yafranides de Salé, dont les émirs combattirent les Arabes Zoghba, les Hammadides, les Musamida et les Barghawata - leur dernier amir al-Abbas ibn Bakhti, contre qui Yusuf ibn Tashfin envoya l'armée Lamtuna de Mazdali ibn Tablakan qui balaya le Moyen-Orient. Maghreb, tua son fils Ya'la puis al-Abbas lui-même lors de la chute de Tlemcen en 475, mettant fin à la dynastie et faisant de Tlemcen une marche almoravide."
  ur: "تلمسن میں خضرید مغراوہ کے بنو یعلی کی امارت؛ یعلیٰ بن الخیر بن محمد بن خضیر کی اولاد، فیز زردوں اور سالی یفرانیوں کے پڑوسی، جن کے امیروں نے زغبہ عربوں، حمادیوں، مسامدہ اور برغوطہ سے جنگ کی، ان کے آخری امیر العباس ابن بختی، جن کے خلاف تقنب المعروف تسنب المعروف تسنب المعروف بھیجا تھا۔ لامٹونا کے میزبان جس نے مشرق مغرب کو فتح کیا، اس نے اپنے بیٹے یالا اور پھر خود العباس کو قتل کر دیا جب 475 میں ٹیلمسن کا تختہ الٹا، خاندان کا خاتمہ ہوا اور تلمسن کو الموراوڈ مارچ بنا دیا۔"
  tr: "Banu Ya'la emirliği, Tlemcen'deki Maghrawa Hazar ailesindendi; Ya'la ibn al-Khayr ibn Muhammad ibn Hazar'ın soyundan geliyordu. Fez'de Banu Ziri ve Salé ile Tadla'da Banu Yafran al-Yafrani ile komşuydular. Prensleri Arap Zoghba, Banu Hammad, Masamada ve Barghawata ile savaşlar ve çatışmalar yaşadı. Prenslerinin sonuncusu Tlemcen hükümdarı al-Abbas ibn Bakhti'ydi; Yusuf ibn Tashfin, Lamtuna ordularında Mazdali ibn Tabulkan'a baskın düzenleyerek merkezi Magrip'i şaşkına çevirdi, oğlu Ya'la'yı öldürdü ve ardından Abbas'ı 475 Hicri'de Tlemcen'in fethetmesinde öldürdü. Devletleri sona erdi ve Tlemcen, Almoravid krallığının kalesi haline geldi."
  id: "Emirat Banu Ya'la berasal dari keluarga Khazar Maghrawa di Tlemcen; keturunan Ya'la ibn al-Khayr ibn Muhammad ibn Khazar. Mereka bertetangga dengan Banu Ziri di Fez dan Banu Yafran al-Yafrani di Salé dan Tadla. Para pangeran mereka berperang dan berkonflik dengan Zoghba Arab, Banu Hammad, Masamada, dan Barghawata. Pangeran terakhir mereka adalah al-Abbas ibn Bakhti, penguasa Tlemcen, yang menerima serangan Yusuf ibn Tashfin ke Mazdali ibn Tabulkan dalam pasukan Lamtuna, membingungkan Maghreb tengah, membunuh Ya'la, putranya, dan kemudian membunuh Abbas sendiri dalam penaklukan Tlemcen pada tahun 475 H. Negara mereka punah dan Tlemcen menjadi benteng kerajaan Almoravid."
