id: polity/banu-yala-tlemcen
class: polity
kind: emirate
label:
  ar: بنو يعلى ملوك تلمسان
  en: Banu Ya'la, kings of Tlemcen
summary:
  ar: "إمارة بني يعلى من آل خزر من مغراوة بتلمسان؛ من ولد يعلى بن الخير بن محمد بن خزر، جاوروا بني زيري بفاس وبني يفرن اليفرني بسلا وتادلا، وكانت لأمرائهم حروب ووقائع مع زغبة من العرب ومع بني حماد ومصامدة وبرغواطة، وآخر أمرائهم العباس بن بختي صاحب تلمسان الذي أغزى يوسف بن تاشفين إليه مزدلي بن تبلكان في عساكر لمتونة فدوّخوا المغرب الأوسط وقتلوا يعلى ابنه ثم قتل العباس نفسه في فتح تلمسان سنة 475هـ، فانقرضت دولتهم وصارت تلمسان ثغراً لملك المرابطين."
  en: "The emirate of Banu Ya'la of the Khazirid Maghrawa at Tlemcen; descendants of Ya'la ibn al-Khayr ibn Muhammad ibn Khazir, neighbours of the Fez Zirids and the Salé Yafranids, whose amirs warred the Zughba Arabs, the Hammadids, the Musamida and Barghawata — their last amir al-Abbas ibn Bakhti, against whom Yusuf ibn Tashfin sent Mazdali ibn Tablakan's Lamtuna host that swept the Middle Maghreb, killed his son Ya'la and then al-Abbas himself when Tlemcen fell in 475, ending the dynasty and making Tlemcen an Almoravid march."
