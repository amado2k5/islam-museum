label:
  ar: الدولة التيمورية
  en: Timurid Empire
  ur: "تیموری سلطنت"
summary:
  ar: "أسرة حكمت فارس وآسيا الوسطى من سنة 771هـ/1370م إلى سنة 913هـ/1507م، أسسها تيمور في ما وراء النهر، وعاصمتاها سمرقند ثم هراة. حفظ شاه رخ ملك أبيه، ثم انقسمت الدولة بعد سنة 850هـ/1447م، وبلغت هراة في عهد السلطان حسين بايقرا أوج ازدهارها في الشعر وفنون الكتاب، إلى أن أخذها الأوزبك سنة 913هـ/1507م."
  en: "A dynasty of Persia and Central Asia, 771/1370 to 913/1507, founded by Timur in Transoxiana, with capitals at Samarqand and later Herat. Shah Rukh held his father's realm together; after 850/1447 it divided, and under Sultan Husayn Bayqara Herat reached its height in poetry and the arts of the book before the Uzbeks took it in 913/1507."
  ur: "ایران اور وسطی ایشیا کا خاندان، 771ھ/1370ء سے 913ھ/1507ء تک، جس کی بنیاد تیمور نے ماوراء النہر میں رکھی اور جس کے دارالحکومت سمرقند اور بعد میں ہرات تھے۔ شاہ رخ نے اپنے باپ کی مملکت یکجا رکھی؛ 850ھ/1447ء کے بعد وہ بٹ گئی، اور سلطان حسین بایقرا کے عہد میں ہرات شاعری اور فنون کتاب میں اپنے عروج کو پہنچا، یہاں تک کہ 913ھ/1507ء میں ازبکوں نے اسے لے لیا۔"
