label:
  ar: دولة بني حمود
  en: Hammudid state
  es: "Estado hammudí"
  fr: "État hammudide"
  ur: "حمود ریاست"
  tr: "Bani Hammoud Eyaleti"
  id: "Negara Bagian Bani Hammoud"
summary:
  ar: "دولة بني حمود بن ميمون من الأدارسة بسبتة وطنجة وبلاد غمارة ثم بالأندلس؛ لما انقرضت الدولة العامرية نصب البرابرة سليمان بن الحكم فاختص به علي والقاسم ابنا حمود، وعقد لعلي على طنجة فانتقض ودعا لنفسه وأجاز إلى الأندلس وولي الخلافة، وتعاقب أهل بيته القاسم ويحيى وإدريس على قرطبة ومالقة والجزيرة الخضراء، ثم استقل بسبتة وطنجة من مواليهم الحاجب سكوت البرغواطي إلى أن أوقع به يوسف بن تاشفين سنة 476هـ فقتله وعثر على ذخائره وفيها خاتم يحيى بن علي بن حمود، وانقرضت دولتهم."
  en: "The state of Banu Hammud ibn Maymun of the Idrisids at Ceuta, Tangier and the Ghumara lands, then in al-Andalus; when the Amirid state collapsed the Berbers set up Sulayman ibn al-Hakam, and the brothers Ali and al-Qasim ibn Hammud stood him in good stead — Ali took Tangier, rebelled, crossed to Andalus and assumed the caliphate, and his house (al-Qasim, Yahya, Idris) held Cordoba, Malaga and Algeciras, until their Saqali client the hajib Sakkut the Barghawati seized Ceuta and Tangier, whom Yusuf ibn Tashfin destroyed in 476, finding among his hoard the seal-ring of Yahya ibn Ali — and the Hammudid state ended."
  es: "El estado de Banu Hammud ibn Maymun de los Idrisíes en Ceuta, Tánger y las tierras de Ghumara, luego en al-Ándalus; cuando el estado Amirí se derrumbó, los bereberes establecieron a Sulayman ibn al-Hakam, y los hermanos Ali y al-Qasim ibn Hammud le fueron de gran ayuda: Ali tomó Tánger, se rebeló, cruzó a Ándalus y asumió el califato, y su casa (al-Qasim, Yahya, Idris) controló Córdoba, Málaga y Algeciras, hasta que su cliente Saqali, el hajib Sakkut el Barghawati, se apoderó de Ceuta y Tánger, a quienes Yusuf ibn Tashfin destruyó en 476, encontrando entre su tesoro el anillo de sello de Yahya ibn Ali, y el estado Hammudí llegó a su fin."
  fr: "L'État des Banu Hammud ibn Maymun des Idrissides à Ceuta, Tanger et dans les terres de Ghumara, alors en al-Andalus; lorsque l'État amiride s'effondra, les Berbères établirent Sulayman ibn al-Hakam, et les frères Ali et al-Qasim ibn Hammud lui furent d'un grand secours — Ali prit Tanger, se rebella, traversa vers l'Andalousie et assuma le califat, et sa maison (al-Qasim, Yahya, Idris) contrôla Cordoue, Malaga et Algésiras, jusqu'à ce que leur client Saqali, le hajib Sakkut le Barghawati, s'empare de Ceuta et de Tanger, que Yusuf ibn Tashfin détruisit en 476, trouvant parmi son trésor l'anneau sigillaire de Yahya ibn Ali — et l'État hammudide prit fin."
  ur: "بنو حمود بن میمون کی ریاست ادریسیوں کے سیوٹا، تانگیر اور ثمرہ سرزمین پر، پھر اندلس میں؛ جب امیری ریاست کا خاتمہ ہوا تو بربروں نے سلیمان بن الحکم کو قائم کیا، اور بھائی علی اور القاسم ابن حمود نے ان کی جگہ پر کھڑا کیا - علی نے تانگیر کو لے لیا، بغاوت کی، اندلس کو عبور کیا اور خلافت سنبھالی، اور اس کے گھر ⁦(القاسم، یحییٰ، ادریس، صبغرض، اور ان کے مؤکلوں نے اس وقت تک قبضہ کر لیا)⁩ حاجب سکوت برغوتی نے سیوٹا اور تانگیر پر قبضہ کر لیا، جسے یوسف بن تاشفین نے 476 میں تباہ کر دیا، اس کے ذخیرے میں یحییٰ ابن علی کی مہر کی انگوٹھی ملی اور حمود ریاست کا خاتمہ ہوا۔"
  tr: "Ceuta, Tanca ve o zamanlar Endülüs'te bulunan Ghumara topraklarındaki İdrisilerin Banu Hammud ibn Maimun hanedanı vardı. Emevi devleti sona erdiğinde, Berberiler Süleyman bin el-Hakam'ı atadı; o da ona Hammud'un oğulları Ali ve el-Qasım'a münhasır statü verdi ve Ali'ye Tanca üzerinde bir sözleşme verdi, ancak Ali el-Endülüs'e izin verdi, hak iddia etti ve halifeliği üstlendi. Ailesi el-Qasim, Yahya ve İdris, sırasıyla Kordoba, Malaga ve Algeciras'ı yönetti. Daha sonra Ceuta ve Tangier'de vasalları, başkâman Sukut el-Barghawati'den bağımsız oldu; ta ki Yusuf ibn Taşfin onu 476 Hicri yılında yakalayıp öldürene kadar. Yahya ibn Ali ibn Hammoud'un yüzüğü de dahil olmak üzere eserleri bulundu ve devletleri sona erdi."
  id: "Dinasti Banu Hammud ibn Maimun dari Idrisiyah di Ceuta, Tangier, dan wilayah Ghumara, yang saat itu berada di Andalusia. Ketika negara Umayyah berakhir, bangsa Berber mengangkat Sulayman ibn al-Hakam, yang memberinya status eksklusif kepada Ali dan al-Qasim, putra Hammoud, dan memberikan kontrak atas Tangier kepada Ali, tetapi ia mengumumkan, mengklaim, dan memberi izin kepada al-Andalus untuk mengambil alih kekhalifahan. Keluarganya al-Qasim, Yahya, dan Idris secara berturut-turut memerintah Cordoba, Malaga, dan Algeciras. Ia kemudian merdeka di Ceuta dan Tangier dari vasal mereka, chamberlain Sukut al-Barghawati, hingga Yusuf ibn Tashfin menangkapnya pada tahun 476 H, dan membunuhnya. Artefak-artefaknya, termasuk cincin Yahya ibn Ali ibn Hammoud, ditemukan, dan negara mereka punah."
