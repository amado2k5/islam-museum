label:
  ar: دولة بني حمود
  en: Hammudid state
summary:
  ar: "دولة بني حمود بن ميمون من الأدارسة بسبتة وطنجة وبلاد غمارة ثم بالأندلس؛ لما انقرضت الدولة العامرية نصب البرابرة سليمان بن الحكم فاختص به علي والقاسم ابنا حمود، وعقد لعلي على طنجة فانتقض ودعا لنفسه وأجاز إلى الأندلس وولي الخلافة، وتعاقب أهل بيته القاسم ويحيى وإدريس على قرطبة ومالقة والجزيرة الخضراء، ثم استقل بسبتة وطنجة من مواليهم الحاجب سكوت البرغواطي إلى أن أوقع به يوسف بن تاشفين سنة 476هـ فقتله وعثر على ذخائره وفيها خاتم يحيى بن علي بن حمود، وانقرضت دولتهم."
  en: "The state of Banu Hammud ibn Maymun of the Idrisids at Ceuta, Tangier and the Ghumara lands, then in al-Andalus; when the Amirid state collapsed the Berbers set up Sulayman ibn al-Hakam, and the brothers Ali and al-Qasim ibn Hammud stood him in good stead — Ali took Tangier, rebelled, crossed to Andalus and assumed the caliphate, and his house (al-Qasim, Yahya, Idris) held Cordoba, Malaga and Algeciras, until their Saqali client the hajib Sakkut the Barghawati seized Ceuta and Tangier, whom Yusuf ibn Tashfin destroyed in 476, finding among his hoard the seal-ring of Yahya ibn Ali — and the Hammudid state ended."
