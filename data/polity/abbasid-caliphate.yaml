label:
  ar: الدولة العباسية
  en: Abbasid Caliphate
  ur: "عباسی خلافت"
  es: "Califato abasí"
  fr: "Califat abbasside"
  tr: "Abbasi Devleti"
  id: "Negara Abbasiyah"
summary:
  ar: كانت الدولة العباسية أسرة الخلفاء التي حكمت من 132هـ/750م إلى 656هـ/1258م وخلفت الدولة الأموية، وتنتسب إلى العباس عم النبي. وتقسم دائرة المعارف الإسلامية سيادتها إلى عصر تراجعت فيه سلطة الخلفاء أمام القادة العسكريين حتى دخول البويهيين بغداد سنة 334هـ/945م، ثم عصر احتفظ فيه الخلفاء بسيادة اسمية وحكمت أسر علمانية فعليًا. وانتهت الخلافة في بغداد على يد المغول سنة 656هـ/1258م، وأقيم لها خط اسمي في القاهرة المملوكية حتى سنة 1517م.
  en: The Abbasids were the dynasty of caliphs who ruled from 132/750 to 656/1258, succeeding the Umayyads and taking their name from al-Abbas, the Prophet's uncle. The Encyclopaedia of Islam divides their sovereignty into a period when the caliphs' authority declined before military leaders, until the Buyids entered Baghdad in 334/945, and a period when they kept only nominal suzerainty while secular dynasties held real power. The Mongols ended the caliphate at Baghdad in 656/1258, and a nominal Abbasid line continued in Mamluk Cairo until 1517.
  ur: "عباسی خلفاء کا وہ خاندان تھے جس نے 132ھ/750ء سے 656ھ/1258ء تک حکومت کی، اموی خلافت کے جانشین بنے اور نبی کے چچا عباس کی نسبت سے مشہور ہوئے۔ انسائیکلوپیڈیا آف اسلام ان کے اقتدار کو دو ادوار میں بانٹتا ہے: پہلے خلفاء کا اختیار فوجی سرداروں کے سامنے گھٹتا گیا یہاں تک کہ 334ھ/945ء میں بویہی بغداد میں داخل ہوئے، پھر خلفاء کے پاس برائے نام بالادستی رہی اور حقیقی طاقت سیکولر خاندانوں کے ہاتھ میں تھی۔ منگولوں نے 656ھ/1258ء میں بغداد کی خلافت ختم کی، اور مملوک قاہرہ میں برائے نام عباسی سلسلہ 1517ء تک جاری رہا۔"
  es: "Los abasíes fueron la dinastía de califas que gobernó desde el año 132/750 hasta el 656/1258, sucediendo a los omeyas y tomando su nombre de al-Abbas, tío del Profeta. La Enciclopedia del Islam divide su soberanía en un período en el que la autoridad de los califas declinó ante los líderes militares, hasta que los buyíes entraron en Bagdad en el año 334/945, y un período en el que mantuvieron una soberanía meramente nominal mientras las dinastías seculares ostentaban el poder real. Los mongoles pusieron fin al califato en Bagdad en el año 656/1258, y una línea abasí nominal continuó en el Cairo mameluco hasta 1517."
  fr: "Les Abbassides étaient la dynastie de califes qui régna de 132/750 à 656/1258, succédant aux Omeyyades et tirant leur nom d'al-Abbas, oncle du Prophète. L'Encyclopédie de l'Islam divise leur règne en deux périodes: d'abord, une période de déclin de l'autorité des califes face aux chefs militaires, jusqu'à l'entrée des Bouyides à Bagdad en 334/945; ensuite, une période où ils ne conservèrent qu'une suzeraineté nominale, le pouvoir réel étant détenu par des dynasties laïques. Les Mongols mirent fin au califat de Bagdad en 656/1258, et une lignée abbasside nominale se maintint au Caire mamelouk jusqu'en 1517."
  tr: "Abbasi devleti, 132 Hicri/750 M.S. ile 656 Hicri yılları/1258 yılları arasında hüküm süren halifeler hanedanıdır ve Emevî devletinin ardından gelir ve kökeni Peygamber'in amcası Abbas'a dayanır. İslam Ansiklopedisi, halifelerin otoritesinin askeri komutanlar öncesinde azaldığı ve Büvyilerin 334 H / 945 yılında Bağdat'a girdiği bir döneme ayırır; ardından halifelerin nominal egemenliklerini korudu ve dünyevi aileler fiilen hüküm sürdü. Bağdat'taki halifelik, 656 H / 1258 yılında Moğolların elinde sona erdi ve Memlük Kahire'de 1517 yılına kadar nominal bir soy kuruldu."
  id: "Negara Abbasiyah adalah dinasti khalifah yang memerintah dari tahun 132 H/750 M hingga 656 H/1258 M, menggantikan negara Umayyah, dan garis keturunannya menelusuri ke Abbas, paman Nabi. Ensiklopedia Islam membagi kedaulatannya ke dalam periode di mana otoritas khalifah menurun di hadapan komandan militer hingga Buyid memasuki Baghdad pada tahun 334 H/945 M, diikuti oleh era di mana khalifah mempertahankan kedaulatan nominal dan keluarga sekuler secara efektif memerintah. Khalifah di Baghdad berakhir di tangan Mongol pada tahun 656 H/1258 M, dan garis keturunan nominal ditetapkan untuknya di Kairo Mamluk hingga 1517 M."
