  en: Abbasid Caliphate
  ur: "عباسی خلافت"
summary:
  ar: كانت الدولة العباسية أسرة الخلفاء التي حكمت من 132هـ/750م إلى 656هـ/1258م وخلفت الدولة الأموية، وتنتسب إلى العباس عم النبي. وتقسم دائرة المعارف الإسلامية سيادتها إلى عصر تراجعت فيه سلطة الخلفاء أمام القادة العسكريين حتى دخول البويهيين بغداد سنة 334هـ/945م، ثم عصر احتفظ فيه الخلفاء بسيادة اسمية وحكمت أسر علمانية فعليًا. وانتهت الخلافة في بغداد على يد المغول سنة 656هـ/1258م، وأقيم لها خط اسمي في القاهرة المملوكية حتى سنة 1517م.
  en: The Abbasids were the dynasty of caliphs who ruled from 132/750 to 656/1258, succeeding the Umayyads and taking their name from al-Abbas, the Prophet's uncle. The Encyclopaedia of Islam divides their sovereignty into a period when the caliphs' authority declined before military leaders, until the Buyids entered Baghdad in 334/945, and a period when they kept only nominal suzerainty while secular dynasties held real power. The Mongols ended the caliphate at Baghdad in 656/1258, and a nominal Abbasid line continued in Mamluk Cairo until 1517.
  ur: "عباسی خلفاء کا وہ خاندان تھے جس نے 132ھ/750ء سے 656ھ/1258ء تک حکومت کی، اموی خلافت کے جانشین بنے اور نبی کے چچا عباس کی نسبت سے مشہور ہوئے۔ انسائیکلوپیڈیا آف اسلام ان کے اقتدار کو دو ادوار میں بانٹتا ہے: پہلے خلفاء کا اختیار فوجی سرداروں کے سامنے گھٹتا گیا یہاں تک کہ 334ھ/945ء میں بویہی بغداد میں داخل ہوئے، پھر خلفاء کے پاس برائے نام بالادستی رہی اور حقیقی طاقت سیکولر خاندانوں کے ہاتھ میں تھی۔ منگولوں نے 656ھ/1258ء میں بغداد کی خلافت ختم کی، اور مملوک قاہرہ میں برائے نام عباسی سلسلہ 1517ء تک جاری رہا۔"
