label:
  ar: الدولة البويهية
  en: Buyid dynasty
  ur: "بویہی سلطنت"
  es: "dinastía Buyid"
  fr: "dynastie Buyid"
  tr: "Buyid eyaleti"
  id: "Negara Buyid"
summary:
  ar: "دولة بني بويه من الديلم؛ كانوا من قواد الديلم فتطاولوا للاستيلاء على أعمال الخلفاء العباسيين لما لم يروا عنها مدافعاً ولا لها حامية، فملكوا أصفهان والري ثم انعطفوا على بلاد فارس فملكوا شيراز وأرجان، واستولى معز الدولة على الأهواز سنة 325هـ ثم واسط وبغداد سنة 334هـ، فصار الخلفاء في كفالتهم وتحت حجرهم من خلافة المستكفي إلى انقراض دولتهم بدخول طغرلبك بغداد سنة 447هـ، وكانت دولتهم ثلاث شعب: فارس لعماد الدولة وبنيه، والجبال لركن الدولة وبنيه، والعراق لمعز الدولة وبنيه."
  en: "The Buyid state of the Daylamites; Daylamite commanders who reached for the Abbasid caliphs' lands when they saw them undefended, taking Isfahan and Rayy, then Fars (Shiraz and Arrajan), with Mu'izz al-Dawla seizing al-Ahwaz in 325 AH then Wasit and Baghdad in 334 — the caliphs falling under their wardship from al-Mustakfi until the dynasty's extinction at Tughril Beg's entry into Baghdad in 447. The state ran in three branches: Fars for Imad al-Dawla's line, the Jibal for Rukn al-Dawla's, and Iraq for Mu'izz al-Dawla's."
  ur: "دیلم کے بنو بویہ کی سلطنت جس کی شاخیں فارس، جبال اور عراق میں قائم ہوئیں؛ معز الدولہ نے 334 ہجری میں بغداد پر قبضہ کیا اور عباسی خلفا ان کے زیر اختیار رہے، یہاں تک کہ 447 ہجری میں طغرل بیگ بغداد آئے۔ {cite:tarikh-ibn-khaldun-ibar}"
  es: "El estado buyí de los daylamitas; comandantes daylamitas que se abalanzaron sobre las tierras de los califas abasíes cuando las vieron indefensas, tomando Isfahán y Rayy, luego Fars (Shiraz y Arrajan), con Mu'izz al-Dawla apoderándose de al-Ahwaz en 325 AH y luego Wasit y Bagdad en 334; los califas quedaron bajo su tutela desde al-Mustakfi hasta la extinción de la dinastía con la entrada de Tughril Beg en Bagdad en 447. El estado se dividió en tres ramas: Fars para la línea de Imad al-Dawla, el Jibal para la de Rukn al-Dawla e Irak para la de Mu'izz al-Dawla."
  fr: "L'État bouyide des Daylamites; des commandants daylamites qui, voyant les terres des califes abbassides sans défense, s'emparèrent d'Ispahan et de Rayy, puis du Fars (Chiraz et Arrajan). Mu'izz al-Dawla conquit al-Ahwaz en 325 AH, puis Wasit et Bagdad en 334. Les califes tombèrent sous leur tutelle d'al-Mustakfi jusqu'à l'extinction de la dynastie lors de l'entrée de Tughril Beg à Bagdad en 447. L'État était divisé en trois branches: le Fars pour la lignée d'Imad al-Dawla, le Jibal pour celle de Rukn al-Dawla et l'Irak pour celle de Mu'izz al-Dawla."
  tr: "Büyü devleti Daylam hanedanından geliyordu; Daylamlıların komutanları arasındaydılar ve Abbasi halifelerinin topraklarını ne koruyucu ne de koruyucu görmeyince ele geçirmeye çalıştılar. İsfahan ve Rayy'yi yönettiler, ardından Perslere yönelerek Şiraz ve Arcan'ı yönettiler. Mu'izz al-Dawla 325 Hicri'de Ahvaz'ı, ardından 334 Hicri yılında Wasit ve Bağdat'ı ele geçirdi. Halifeler, 447 Hicri yılında Tuğril Beg'in Bağdat'a girmesiyle devletlerinin çöküşüne kadar onların koruması ve el-Mustafa halifeliğinden korumaları altında kaldılar. Devletleri üç koldan oluşuyordu: İmad el-Devle ve oğulları için Fars, Rukn al-Dawla ve oğulları için dağlar, Mu'izz al-Dawla ve oğulları için Irak."
  id: "Negara Buyid berasal dari dinasti Daylam; mereka termasuk di antara komandan Daylamites dan berusaha merebut wilayah khalifah Abbasiyah ketika mereka tidak melihat pembela atau pelindung dari mereka. Mereka memerintah Isfahan dan Rayy, lalu beralih ke Persia dan memerintah Shiraz dan Arjan. Mu'izz al-Dawla merebut Ahvaz pada tahun 325 H, kemudian Wasit dan Baghdad pada tahun 334 H. Para khalifah tetap berada di bawah perlindungan mereka dan di bawah perlindungan dari kekhalifahan al-Mustakfi hingga jatuhnya negara mereka dengan masuknya Tughril Beg ke Baghdad pada tahun 447 H. Negara mereka terdiri dari tiga cabang: Fars untuk Imad al-Dawla dan putra-putranya, pegunungan untuk Rukn al-Dawla dan putra-putranya, dan Irak untuk Mu'izz al-Dawla dan putra-putranya."
