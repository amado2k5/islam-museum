id: polity/sulayhid-dynasty
class: polity
kind: dynasty
label:
  ar: الدولة الصليحية باليمن
  en: Sulayhid dynasty of Yemen
  es: "Dinastía Sulayhid de Yemen"
  fr: "Dynastie soulayhide du Yémen"
  ur: "یمن کا سلیحید خاندان"
summary:
  ar: "الدولة الصليحية باليمن؛ أسسها علي بن محمد الصليحي بعد أن تضلع من علوم الباطنية الإسماعيلية على الداعي عامر بن عبد الله الرواحي، فصعد جبل مسور سنة 439هـ في ستين رجلاً حالفهم على الموت ثم طوى البلاد وافتتح الحصون واستقر ملكه في صنعاء داعياً للمستنصر صاحب مصر؛ وولي تهامة سعيدَ بن شهاب حين وزنت له زوجة الصليحي أسماءُ بنتُ شهاب مائةَ ألف دينار عن أخيها؛ وقُتل الصليحي مع أخيه ومائة وستين من أهل بيته في وقعة المهجم سنة 473هـ على يد سعيد الأحول بن نجاح ثأراً لأبيه الذي قتله الصليحي بالسم {cite:shadharat-dhahab p. 354-356}."
  en: "The Sulayhid state of Yemen — founded by Ali b. Muhammad al-Sulayhi, the Ismaili da'i's pupil who took Jabal Maswar in 439 with sixty sworn men, then wrapped up the land preaching al-Mustansir's da'wa from Sanaa; ended for its founder at al-Mahjam in 473 when Sa'id al-Ahwal b. Najah avenged his poisoned father on him and a hundred and sixty of his house {cite:shadharat-dhahab p. 354-356}."
  es: "El estado sulayhid de Yemen, fundado por Ali b. Muhammad al-Sulayhi, discípulo del da'i ismaelita que tomó Jabal Maswar en 439 con sesenta hombres juramentados, y luego conquistó la tierra predicando la da'wa de al-Mustansir desde Sanaa; terminó para su fundador en al-Mahjam en 473 cuando Sa'id al-Ahwal b. Najah vengó a su padre envenenado contra él y ciento sesenta de su casa {cite:shadharat-dhahab p. 354-356}."
  fr: "L'État sulayhid du Yémen — fondé par Ali b. Muhammad al-Sulayhi, disciple du da'i ismaélien qui prit Jabal Maswar en 439 avec soixante hommes assermentés, puis conquit le pays en prêchant la da'wa d'al-Mustansir depuis Sanaa; prit fin pour son fondateur à al-Mahjam en 473 lorsque Sa'id al-Ahwal b. Najah vengea son père empoisonné sur lui et cent soixante membres de sa maison {cite:shadharat-dhahab p. 354-356}."
  ur: "یمن کی سلاحی ریاست - جس کی بنیاد علی بن نے رکھی تھی۔ محمد السلیحی، اسماعیلی داعی کا شاگرد جس نے 439 میں جبل مسور پر ساٹھ قسم کے آدمیوں کے ساتھ قبضہ کیا، پھر صنعا سے المستنصر کی دعوت کی تبلیغ کرتے ہوئے زمین کو سمیٹ لیا۔ 473 میں المحجم میں اس کے بانی کے لیے ختم ہوا جب سعید الاحوال بن۔ نجاح نے اپنے زہریلے باپ کا بدلہ اس پر اور اس کے ایک سو ساٹھ گھر والوں سے لیا {حوالہ: شدارت ذہاب ص۔ 354-356}۔"
