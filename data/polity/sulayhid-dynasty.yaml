label:
  ar: الدولة الصليحية باليمن
  en: Sulayhid dynasty of Yemen
summary:
  ar: "الدولة الصليحية باليمن؛ أسسها علي بن محمد الصليحي بعد أن تضلع من علوم الباطنية الإسماعيلية على الداعي عامر بن عبد الله الرواحي، فصعد جبل مسور سنة 439هـ في ستين رجلاً حالفهم على الموت ثم طوى البلاد وافتتح الحصون واستقر ملكه في صنعاء داعياً للمستنصر صاحب مصر؛ وولي تهامة سعيدَ بن شهاب حين وزنت له زوجة الصليحي أسماءُ بنتُ شهاب مائةَ ألف دينار عن أخيها؛ وقُتل الصليحي مع أخيه ومائة وستين من أهل بيته في وقعة المهجم سنة 473هـ على يد سعيد الأحول بن نجاح ثأراً لأبيه الذي قتله الصليحي بالسم {cite:shadharat-dhahab p. 354-356}."
  en: "The Sulayhid state of Yemen — founded by Ali b. Muhammad al-Sulayhi, the Ismaili da'i's pupil who took Jabal Maswar in 439 with sixty sworn men, then wrapped up the land preaching al-Mustansir's da'wa from Sanaa; ended for its founder at al-Mahjam in 473 when Sa'id al-Ahwal b. Najah avenged his poisoned father on him and a hundred and sixty of his house {cite:shadharat-dhahab p. 354-356}."
