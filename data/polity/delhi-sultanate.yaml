summary:
  ar: "كبرى الممالك الإسلامية في شمال الهند من القرن السابع إلى القرن العاشر الهجري، وعاصمتها دهلي. قامت بعد الفتوح الغورية، وتعاقب عليها المماليك الترك والخلجيون والتغلقيون والسادات واللوديون؛ بلغت أوسع نفوذها في عهد علاء الدين الخلجي، وضعفت بعد غزو تيمور سنة 801هـ/1398م، وانتهى حكم اللوديين في باني بت سنة 932هـ/1526م."
  en: "The principal Muslim kingdom of northern India from the thirteenth to the sixteenth century, with its capital at Delhi. It arose from the Ghurid conquests and was ruled in turn by Turkish slave commanders, Khaljis, Tughluqs, Sayyids and Lodis; it reached its widest sway under 'Ala' al-Din Khalji, was broken by Timur's invasion of 801/1398, and Lodi rule ended at Panipat in 932/1526."
  ur: "تیرہویں سے سولہویں صدی عیسوی تک شمالی ہندوستان کی سب سے بڑی مسلم مملکت، جس کا دارالحکومت دہلی تھا۔ یہ غوری فتوحات سے وجود میں آئی اور اس پر ترک غلام سرداروں، خلجیوں، تغلقوں، سیدوں اور لودھیوں نے باری باری حکومت کی؛ علاء الدین خلجی کے عہد میں اس کا اقتدار سب سے وسیع ہوا، 801ھ/1398ء میں تیمور کے حملے نے اسے توڑ دیا، اور لودھی حکومت 932ھ/1526ء میں پانی پت میں ختم ہوئی۔"
  es: "El principal reino musulmán del norte de la India desde el siglo XIII hasta el XVI, con capital en Delhi. Surgió de las conquistas gúridas y fue gobernado sucesivamente por comandantes turcos esclavistas, los Khalji, los Tughluq, los Sayyid y los Lodi; alcanzó su máxima extensión bajo el reinado de Ala al-Din Khalji, fue quebrado por la invasión de Tamerlán en 801/1398, y el dominio Lodi terminó en Panipat en 932/1526."
  fr: "Le principal royaume musulman du nord de l'Inde du XIIIe au XVIe siècle, avec Delhi pour capitale, est issu des conquêtes ghurides et fut successivement gouverné par des commandants turcs esclavagistes, les Khaljis, les Tughluqs, les Sayyids et les Lodis. Il atteignit son apogée sous le règne d'Ala' al-Din Khalji, fut démantelé par l'invasion de Timour en 801/1398, et la domination Lodi prit fin à Panipat en 932/1526."
  tr: "7. yüzyıldan 10. yüzyıla kadar kuzey Hindistan'ın en büyük İslam krallıkları olup, başkenti Delhi'dir. Guri fetihlerinden sonra ortaya çıkmış ve sırasıyla Türk, Halci, Taghlaqid, Sedat ve Luddit Memlükler tarafından egemenlik altına alınmıştır; etkisi en geniş alanına Ala al-Din al-Khalji'nin saltanatı sırasında ulaşmış, ancak 801 Hicri / 1398 yılında Timur'un istilasından sonra zayıflamış ve Lodianların yönetimi 932 Hicri / 1526 yılında Bani Çukuru'nda sona ermiştir."
  id: "Kerajaan Islam terbesar di India utara dari abad ke-7 hingga ke-10 H, dengan ibu kotanya di Delhi. Kerajaan ini muncul setelah penaklukan Ghurid, dan secara berturut-turut didominasi oleh Mamluk Turkik, Khalji, Taghlaqid, Sadat, dan Luddit; pengaruhnya mencapai jangkauan terbesar selama masa pemerintahan Ala al-Din al-Khalji, melemah setelah invasi Timur pada 801 H / 1398 M, dan pemerintahan Lodian berakhir di Bani Pit pada 932 H / 1526 M."
