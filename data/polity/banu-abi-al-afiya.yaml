label:
  ar: بنو أبي العافية
  en: Banu Abi al-Afiya
summary:
  ar: "بنو أبي العافية بن أبي نائل، بطن مكناسة الذين ملكوا تسول وجهات تازا وملوية ومليلة؛ ظهر أمرهم في عهد الأدارسة فمالؤوا يحيى بن إدريس ثم صالوا عليه وطردوه عن عمله، وعظم ملك موسى بن أبي العافية حتى دانت له فاس وأجلى الأدارسة عن المغرب في عباءة الدعوة الشيعية، ثم حاربه ميسور الخصي قائد القيروان فأجلاه إلى نواحي ملوية ووطاط، وعاد فيظهر دوماً في فتن المغرب وصراع زيري بن عطية وبلكين بن زيري عليه، ولم يزالوا في طاعة بني زيري ومظاهرتهم إلى أن ظهرت دولة المرابطين فزحف إليهم يوسف بن تاشفين وأهلكنا آخر رؤسائهم."
  en: "Banu Abi al-Afiya ibn Abi Na'il, the Miknasa branch that ruled Tasul and the Taza–Malwiyya–Melilla marches; first clients then scourges of the Idrisids — Musa ibn Abi al-Afiya drove them from Fez under the Fatimid da'wa, warred the eunuch Maysur, was driven into the desert and returned, and the house survived as Zirid clients until Yusuf ibn Tashfin's Almoravids destroyed its last chiefs."
