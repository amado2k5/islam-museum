summary:
  ar: "بنو أبي العافية بن أبي نائل، بطن مكناسة الذين ملكوا تسول وجهات تازا وملوية ومليلة؛ ظهر أمرهم في عهد الأدارسة فمالؤوا يحيى بن إدريس ثم صالوا عليه وطردوه عن عمله، وعظم ملك موسى بن أبي العافية حتى دانت له فاس وأجلى الأدارسة عن المغرب في عباءة الدعوة الشيعية، ثم حاربه ميسور الخصي قائد القيروان فأجلاه إلى نواحي ملوية ووطاط، وعاد فيظهر دوماً في فتن المغرب وصراع زيري بن عطية وبلكين بن زيري عليه، ولم يزالوا في طاعة بني زيري ومظاهرتهم إلى أن ظهرت دولة المرابطين فزحف إليهم يوسف بن تاشفين وأهلكنا آخر رؤسائهم."
  en: "Banu Abi al-Afiya ibn Abi Na'il, the Miknasa branch that ruled Tasul and the Taza–Malwiyya–Melilla marches; first clients then scourges of the Idrisids — Musa ibn Abi al-Afiya drove them from Fez under the Fatimid da'wa, warred the eunuch Maysur, was driven into the desert and returned, and the house survived as Zirid clients until Yusuf ibn Tashfin's Almoravids destroyed its last chiefs."
  es: "Banu Abi al-Afiya ibn Abi Na'il, la rama Miknasa que gobernó Tasul y las marcas Taza-Malwiyya-Melilla; primero clientes y luego azotes de los Idrisíes: Musa ibn Abi al-Afiya los expulsó de Fez bajo la da'wa fatimí, luchó contra el eunuco Maysur, fue expulsado al desierto y regresó, y la casa sobrevivió como clientes de los Zirid hasta que los almorávides de Yusuf ibn Tashfin destruyeron a sus últimos jefes."
  fr: "Les Banu Abi al-Afiya ibn Abi Na'il, la branche Miknasa qui régnait sur Tasul et les marches de Taza–Malwiyya–Melilla; d'abord clients puis fléaux des Idrissides — Musa ibn Abi al-Afiya les chassa de Fès sous la da'wa fatimide, fit la guerre à l'eunuque Maysur, fut chassé dans le désert et revint, et la maison survécut comme clients zirides jusqu'à ce que les Almoravides de Yusuf ibn Tashfin détruisent ses derniers chefs."
  ur: "بنو ابی العفیہ ابن ابی نائل، مکناسہ کی شاخ جس نے تسول پر حکومت کی اور طزا-مالویہ-ملیلہ مارچ؛ پہلے گاہک پھر ادریسیوں کے کوڑے - موسیٰ ابن ابی العفیہ نے انہیں فاطمی دعوت کے تحت فیز سے بھگایا، خواجہ سرا میسور سے جنگ کی، صحرا میں بھگا کر واپس آ گیا، اور یہ گھر زیرد کے گاہک کے طور پر زندہ رہا یہاں تک کہ یوسف بن تاشفین کے الموراویڈز نے اس کے آخری سردار کو تباہ کر دیا۔"
  tr: "Meknassa'dan Banu Abi el-Afiyya ibn Abi Na'il, Taza, Moulawiya ve Melilla bölgelerini yöneten ailesi, İdrisi döneminde ortaya çıkmış, bu yüzden Yahya ibn Idris ile ittifak kurmuş, ardından ona karşı isyan edip onu görevden almıştır. Musa ibn Abi al-Afiya'nın yönetimi o kadar büyümüştür ki Fez ona teslim olur ve Shia kılığında İdrisileri Fas'tan kovmuş 'ism. Sonra Kairouan komutanı Maysur el-Khasi onunla savaştı ve onu Mulwiya ve Watat bölgelerine sürgün etti. Geri döndü ve sık sık Mağrip'teki isyanlarda ve Ziri ibn Atiyah ile Bilkin ibn Ziri arasındaki çatışmalarda yer aldı. Yusuf ibn Taşfin yürüyüp son liderlerini yok edene kadar Banu Ziri'ye ve gösterilerine itaat ettiler."
  id: "Banu Abi al-'Afiyya ibn Abi Na'il, klan Meknassa, yang memerintah wilayah Taza, Moulawiya, dan Melilla, muncul pada era Idrisiyah, sehingga mereka bersekutu dengan Yahya ibn Idris, lalu memberontak dan mengusirnya dari jabatan. Kekuasaan Musa ibn Abi al-Afiya berkembang begitu besar sehingga Fez menyerah kepadanya, dan ia mengusir Idrisiyah dari Maroko dengan dalih Syiah. Kemudian Maysur al-Khasi, komandan Kairouan, melawannya, mengusirnya ke wilayah Mulwiya dan Watat. Ia kembali dan sering muncul dalam pemberontakan Maghreb dan konflik antara Ziri ibn Atiyah dan Bilkin ibn Ziri atas mereka. Mereka tetap taat pada Banu Ziri dan demonstrasi mereka hingga negara Almoravid muncul, ketika Yusuf ibn Tashfin berbaris dan menghancurkan pemimpin terakhir mereka."
