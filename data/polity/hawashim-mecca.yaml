label:
  ar: دولة الهواشم بمكة
  en: Hawashim emirate of Mecca
  es: "Emirato de Hawashim de La Meca"
  fr: "Émirat d'Hawashim de La Mecque"
  ur: "حواشم امارت مکہ"
  tr: "Mekke'deki Haşimi Devleti"
  id: "Negara Hashemite di Mekah"
summary:
  ar: "دولة الهواشم بمكة من بني الحسن؛ استبد بإمارتها محمد بن جعفر وإخوته بعد السليمانيين، فتقلبت بها الفتن بين الخطبة العباسية والعبيدية، وفي أيامهم بعث المقتدي سنة سبعين منبراً إلى مكة منقشاً بالذهب وبعث ختلع التركي أول تركي تأمر على الحاج، ووقعت الفتنة بين الشيعة وأهل السنة فكسر المنبر وأحرق، ثم لما انقرضت دولة العبيديين وضعف أمر الهواشم كان أبو عزيز بن قتادة يناسبهم مات سنة تسع وثمانين وخمسمائة، فورث بنو قتادة أمرهم وملك مكة من أيديهم من جهة النساء وانقرضت دولتهم."
  en: "The Hawashim state of Mecca of the Banu Hasan; Muhammad ibn Ja'far and his brothers seized its emirate after the Sulaymanids, and its khutba swung between the Abbasid and Ubaydi calls through their years — al-Muqtadi sending Mecca's gold-inscribed minbar in year 470 and Khatlagh the first Turkic amir of the hajj, the minbar broken and burned in the Sunni-Shi'i fitna — until, with the Fatimid state's extinction and the Hawashim enfeebled, Abu Aziz ibn Qatada (d. 589) intermarried with them and Banu Qatada inherited the rule of Mecca through the female line."
  es: "El estado Hawashim de La Meca de los Banu Hasan; Muhammad ibn Ja'far y sus hermanos se apoderaron de su emirato después de los Sulaymaníes, y su jutba osciló entre las llamadas abasíes y ubeydíes a lo largo de los años —al-Muqtadi envió el minbar de La Meca con inscripciones de oro en el año 470 y Khatlagh el primer emir turco del Hajj, el minbar roto y quemado en la fitna suní-chií— hasta que, con la extinción del estado fatimí y el debilitamiento de los Hawashim, Abu Aziz ibn Qatada (m. 589) se casó con ellos y los Banu Qatada heredaron el gobierno de La Meca por línea femenina."
  fr: "L'État hawashim de La Mecque des Banu Hasan; Muhammad ibn Ja'far et ses frères s'emparèrent de son émirat après les Sulaymanides, et son khutba oscilla entre les appels abbassides et ubaydites au fil des ans — al-Muqtadi envoyant le minbar de La Mecque inscrit en or en l'an 470 et Khatlagh le premier émir turc du hajj, le minbar brisé et brûlé lors de la fitna sunnite-chiite — jusqu'à ce que, avec l'extinction de l'État fatimide et l'affaiblissement des Hawashim, Abu Aziz ibn Qatada (mort en 589) s'allie par mariage avec eux et que les Banu Qatada héritent du pouvoir à La Mecque par la lignée féminine."
  ur: "بنو حسن کی مکہ کی حواشم ریاست؛ محمد بن جعفر اور اس کے بھائیوں نے سلیمانیوں کے بعد اس کی امارت پر قبضہ کر لیا، اور اس کا خطبہ عباسیوں اور عبیدی کے درمیان ان کے برسوں تک چلتا رہا- المقتدی نے سنہ 470 میں مکہ کا سونے کا کندہ منبر بھیج دیا اور حج کے پہلے ترک امیر ختلغ نے سنہ منبر کو جلایا۔ فاطمی ریاست کے معدوم ہونے اور حواشم کے کمزور ہونے پر ابوعزیز بن قتادہ ⁦(متوفی 589)⁩ نے ان سے شادی کی اور بنو قتادہ کو خواتین کے سلسلے میں مکہ کی حکومت وراثت میں ملی۔"
  tr: "Mekke'deki Haşim devleti Banu Hasan tarafından yönetildi; Muhammed bin Ca'far ve kardeşleri Süleymanilerden sonra burayı yönetti, bu da Abbasiler ve Ubeyî vaizleri arasında karışıklığa yol açtı. Kendi dönemlerinde, el-Muktadi 70 Hicri yılında altınlarla kazılı vaazlar gönderdi ve ilk Türk'ü Hac'ı komuta etmek üzere gönderdi. Şiiler ve Sünniler arasında çatışma çıktı, kürsü yıkıldı ve yakıldı. Sonra, Ubeydi devleti sona erdiğinde ve Haşimiler zayıfladığında, Ebu Aziz bin Katada onlar için uygundu, 589 Hicri yılında öldü. Banu Kateda, kadınlarından ve Mekke'nin yönetimini miras aldı ve devletleri sona erdi."
  id: "Negara Hashim di Mekah diperintah oleh Banu Hasan; Muhammad ibn Ja'far dan saudara-saudaranya memerintahnya setelah Sulaymanid, yang menyebabkan kekacauan antara pengkhotbah Abbasiyah dan Ubayid. Pada masa itu, al-Muqtadi mengirim mimbar ke Mekah yang diukir dengan emas pada tahun tujuh puluh H dan mengirim orang Turki pertama untuk memimpin al-Hajj. Pertikaian pecah antara Syiah dan Sunni, memecah dan membakar mimbar. Kemudian, ketika negara Ubaydi berakhir dan Hashimite melemah, Abu Aziz ibn Qatada cocok untuk mereka, wafat pada tahun 589 H. Banu Qatada mewarisi kekuasaan mereka dan pemerintahan Mekah dari wanita-wanita mereka, dan negara mereka punah."
