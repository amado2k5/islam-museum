label:
  ar: دولة الهواشم بمكة
  en: Hawashim emirate of Mecca
summary:
  ar: "دولة الهواشم بمكة من بني الحسن؛ استبد بإمارتها محمد بن جعفر وإخوته بعد السليمانيين، فتقلبت بها الفتن بين الخطبة العباسية والعبيدية، وفي أيامهم بعث المقتدي سنة سبعين منبراً إلى مكة منقشاً بالذهب وبعث ختلع التركي أول تركي تأمر على الحاج، ووقعت الفتنة بين الشيعة وأهل السنة فكسر المنبر وأحرق، ثم لما انقرضت دولة العبيديين وضعف أمر الهواشم كان أبو عزيز بن قتادة يناسبهم مات سنة تسع وثمانين وخمسمائة، فورث بنو قتادة أمرهم وملك مكة من أيديهم من جهة النساء وانقرضت دولتهم."
  en: "The Hawashim state of Mecca of the Banu Hasan; Muhammad ibn Ja'far and his brothers seized its emirate after the Sulaymanids, and its khutba swung between the Abbasid and Ubaydi calls through their years — al-Muqtadi sending Mecca's gold-inscribed minbar in year 470 and Khatlagh the first Turkic amir of the hajj, the minbar broken and burned in the Sunni-Shi'i fitna — until, with the Fatimid state's extinction and the Hawashim enfeebled, Abu Aziz ibn Qatada (d. 589) intermarried with them and Banu Qatada inherited the rule of Mecca through the female line."
