  en: Begtiginid atabegs of Erbil
summary:
  ar: "أتابكية أربل البجتجنية؛ تنسب إلى بكتكين مملوك الجيش السلجوقي الذي ولى أربل، وأشهر أمرائها زين الدين علي كوجك بن بكتكين نائب الموصل ثم المظفر كوكبوري بن زين الدين صاحب أربل وحران الذي مالت إليه صلاح الدين أيوبي وصار من كبار أمرائه، ودامت دولتهم في الجزيرة إلى أن دخلت في طاعة بني أيوب ثم المغول."
  en: "The Begtiginid atabegs of Erbil; named for Begtigin, a Seljuk army mamluk seated at Erbil — their most famous Zayn al-Din Ali Kuchuk ibn Begtigin, lieutenant of Mosul, and his son Muzaffar al-Din Gokburi, lord of Erbil and Harran who became one of Saladin's great amirs — the house lasting in the Jazira until it passed into Ayyubid then Mongol allegiance."
