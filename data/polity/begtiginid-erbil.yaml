label:
  ar: أتابكية أربل البجتجنية
  en: Begtiginid atabegs of Erbil
  es: "Atabegs begtiginid de Erbil"
  fr: "Begtiginid atabegs d'Erbil"
  tr: "Erbil El-Beyciniyya Atabegiası"
  id: "Atabegia of Erbil Al-Bajjiniyya"
summary:
  ar: "أتابكية أربل البجتجنية؛ تنسب إلى بكتكين مملوك الجيش السلجوقي الذي ولى أربل، وأشهر أمرائها زين الدين علي كوجك بن بكتكين نائب الموصل ثم المظفر كوكبوري بن زين الدين صاحب أربل وحران الذي مالت إليه صلاح الدين أيوبي وصار من كبار أمرائه، ودامت دولتهم في الجزيرة إلى أن دخلت في طاعة بني أيوب ثم المغول."
  en: "The Begtiginid atabegs of Erbil; named for Begtigin, a Seljuk army mamluk seated at Erbil — their most famous Zayn al-Din Ali Kuchuk ibn Begtigin, lieutenant of Mosul, and his son Muzaffar al-Din Gokburi, lord of Erbil and Harran who became one of Saladin's great amirs — the house lasting in the Jazira until it passed into Ayyubid then Mongol allegiance."
  es: "Los atabegs begtiginíes de Erbil, llamados así por Begtigin, un mameluco del ejército selyúcida con sede en Erbil —su más famoso fue Zayn al-Din Ali Kuchuk ibn Begtigin, teniente de Mosul, y su hijo Muzaffar al-Din Gokburi, señor de Erbil y Harran, quien se convirtió en uno de los grandes emires de Saladino—, la casa permaneció en la Jazira hasta que pasó a estar bajo la lealtad ayubí y luego mongola."
  fr: "Les atabegs begtiginides d'Erbil; nommés d'après Begtigin, un mamelouk de l'armée seldjoukide installé à Erbil — leur plus célèbre Zayn al-Din Ali Kuchuk ibn Begtigin, lieutenant de Mossoul, et son fils Muzaffar al-Din Gokburi, seigneur d'Erbil et de Harran qui devint l'un des grands émirs de Saladin — la maison perdura dans la Jazira jusqu'à ce qu'elle passe sous allégeance ayyoubide puis mongole."
  ur: "اربیل کے بیگٹگینیڈ اتابیگس؛ بیگتیگین کے نام سے منسوب ایک سلجوک فوج مملوک جو اربیل میں بیٹھی تھی - ان کا سب سے مشہور زین الدین علی کچوک ابن بیگتگین، موصل کا لیفٹیننٹ، اور اس کا بیٹا مظفر الدین گوکبوری، اربیل کا مالک اور حران جو صلاح الدین کے عظیم امیروں میں سے ایک بن گیا تھا - اس کے بعد یہ جائنگیرا میں آخری گھر تک چلا گیا۔ بیعت"
  tr: "Erbil el-Beycaniye'nin Atabegleri, Erbil'i yöneten Selçuklu ordusunun Memlükleri Baktekin'e atfedilir. En ünlü prensleri, Musul'un vekili Zeynetin Ali Kujak ibn Baktekin, ardından Erbil ve Harran'ın hükümdarı el-Muzaffar Kawkpuri ibn Zain al-Din idi; Salah al-Din ona yöneldi ve onun kıdemli emirlerinden biri oldu. Cazire'deki devletleri, Eyyub ve ardından Moğolların otoritesine geçene kadar sürdü."
  id: "Atabeg Erbil al-Bajtjaniya dikaitkan dengan Baktekin, Mamluk dari tentara Seljuk yang memerintah Erbil. Pangeran paling terkenal adalah Zain al-Din Ali Kujak ibn Baktekin, wakil Mosul, kemudian al-Muzaffar Kawkpuri ibn Zain al-Din, penguasa Erbil dan Harran, yang didukung Salah al-Din dan menjadi salah satu emir seniornya. Negara mereka di Jazira bertahan hingga berada di bawah otoritas Ayyub dan kemudian Mongol."
