id: polity/burid-dynasty
class: polity
kind: dynasty
label:
  ar: الدولة البورية ⁦(أتابكة دمشق)⁩
  en: Burid dynasty (atabegs of Damascus)
  es: "Dinastía Burid (atabegs de Damasco)"
  fr: "Dynastie buride (atabegs de Damas)"
  ur: "برد خاندان ⁦(دمشق کے اتابیگس)⁩"
  tr: "Burid Devleti (Şam Atabege'i)"
  id: "Negara Burid (Atabegeh dari Damaskus)"
summary:
  ar: "دولة طغركين الأتابك وبنيه بدمشق؛ كان طغركين من موالي تتش فاستقل بالملك لما توفي دقاق سنة 497هـ، وحارب الفرنج حتى ناجز ملوكهم بمرج الصفر سنة 520هـ، وتوفي سنة 522هـ فملك ابنه تاج الدولة بوري ثم بنوه حتى انقرضت دولتهم باستيلاء نور الدين محمود بن زنكي على دمشق سنة 549هـ."
  en: "The state of the Atabeg Tughtakin and his sons at Damascus; a mamluk of Tutush, he took sole rule on Duqaq's death in 497 AH, warred on the Franks and met their kings at Marj al-Saffar in 520, died in 522 and was followed by his son Taj al-Dawla Buri and his line until Nur al-Din Mahmud ibn Zengi's seizure of Damascus in 549 ended their state."
  es: "El estado del Atabeg Tughtakin y sus hijos en Damasco; un mameluco de Tutush, tomó el gobierno único tras la muerte de Duqaq en el 497 AH, guerreó contra los francos y se reunió con sus reyes en Marj al-Saffar en el 520, murió en el 522 y fue sucedido por su hijo Taj al-Dawla Buri y su descendencia hasta que la toma de Damasco por Nur al-Din Mahmud ibn Zengi en el 549 puso fin a su estado."
  fr: "L'État de l'Atabeg Tughtakin et de ses fils à Damas; un mamelouk de Tutush, il prit le pouvoir seul à la mort de Duqaq en 497 AH, fit la guerre aux Francs et rencontra leurs rois à Marj al-Saffar en 520, mourut en 522 et fut suivi par son fils Taj al-Dawla Buri et sa lignée jusqu'à ce que la prise de Damas par Nur al-Din Mahmud ibn Zengi en 549 mette fin à leur État."
  ur: "دمشق میں عتاب طغتکین اور اس کے بیٹوں کی حالت؛ توتش کے ایک مملوک، اس نے 497 ہجری میں دقاق کی موت پر مکمل حکومت سنبھالی، فرینکوں سے جنگ کی اور 520 میں مرج الصفر میں ان کے بادشاہوں سے ملاقات کی، 522 میں وفات پائی اور اس کے بعد اس کا بیٹا تاج الدولہ بری اور اس کے بعد اس کا سلسلہ جاری رہا یہاں تک کہ نورالدین محمود ابن زیماس کی ریاست کا خاتمہ ہوا۔"
  tr: "Tuğhrkin el-Atabeg devleti ve oğulları Şam'da; Tuğrkin, Tutch'un müttefikiydi ve Daqqaq 497 Hicri'de öldüğünde bağımsız oldu. Franklarla savaştı, ta ki Franklar 520 Hicri'de Marj al-Safar'de krallarını fethedene kadar. 522 Hicri'de öldü, oğlu Tac al-Dawla Buri hüküm sürdü ve ardından oğulları hüküm sürdü; Nur al-Din Mahmud ibn Zengi 549 Hicri'de Şam'ı ele geçirince devletleri sona erdi."
  id: "Negara Tughrkin al-Atabeg dan putra-putranya di Damaskus; Tughrkin adalah klien Tutch dan menjadi merdeka ketika Daqqaq meninggal pada tahun 497 H. Ia berperang melawan bangsa Frank hingga mereka menaklukkan raja mereka di Marj al-Safar pada tahun 520 H. Ia meninggal pada tahun 522 H, dan putranya Taj al-Dawla Buri memerintah dan kemudian putra-putranya memerintah hingga negara mereka punah dengan Nur al-Din Mahmud ibn Zengi merebut Damaskus pada tahun 549 H."
