label:
  ar: الدولة البورية (أتابكة دمشق)
  en: Burid dynasty (atabegs of Damascus)
summary:
  ar: "دولة طغركين الأتابك وبنيه بدمشق؛ كان طغركين من موالي تتش فاستقل بالملك لما توفي دقاق سنة 497هـ، وحارب الفرنج حتى ناجز ملوكهم بمرج الصفر سنة 520هـ، وتوفي سنة 522هـ فملك ابنه تاج الدولة بوري ثم بنوه حتى انقرضت دولتهم باستيلاء نور الدين محمود بن زنكي على دمشق سنة 549هـ."
  en: "The state of the Atabeg Tughtakin and his sons at Damascus; a mamluk of Tutush, he took sole rule on Duqaq's death in 497 AH, warred on the Franks and met their kings at Marj al-Saffar in 520, died in 522 and was followed by his son Taj al-Dawla Buri and his line until Nur al-Din Mahmud ibn Zengi's seizure of Damascus in 549 ended their state."
