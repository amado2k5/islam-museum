summary:
  ar: "إمارة تركمانية في غرب الأناضول ⁦(708-829هـ/1308-1425م)⁩ حكمتها أسرة آيدين أوغلو، وبلغت قوتها البحرية في عهد عمر بك، وضمها العثمانيون سنة 829هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  en: "The Turkoman emirate of the Aydın-oghlu in western Anatolia (708-829 AH, 1308-1425), with a sea power under Umur Beg; the Ottomans annexed it in 829 AH {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  es: "El emirato turcomano de Aydın-oghlu en Anatolia occidental (708-829 AH, 1308-1425), con un poder marítimo bajo el mando de Umur Beg; los otomanos lo anexionaron en 829 AH {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
  fr: "L'émirat turkmène d'Aydın-oghlu en Anatolie occidentale (708-829 AH, 1308-1425), avec une puissance maritime sous Umur Beg; les Ottomans l'ont annexé en 829 AH {cite:encyclopaedia-of-islam-2 vol. 1 p. 832}."
