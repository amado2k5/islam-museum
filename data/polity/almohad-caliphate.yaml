id: polity/almohad-caliphate
class: polity
kind: caliphate
label:
  ar: الدولة الموحدية
  en: Almohad Caliphate
  ur: "موحدین کی خلافت"
summary:
  ar: "دولة أقامها أتباع المهدي ابن تومرت، أهل دعوة التوحيد، في شمال إفريقيا والأندلس في القرنين السادس والسابع الهجريين، وعاصمتها مراكش. بويع عبد المؤمن بالخلافة سنة 524هـ/1130م وأخذ مراكش سنة 542هـ/1147م ووحّد المغرب كله؛ وانتصرت في الأرك سنة 591هـ/1195م وهُزمت في العقاب سنة 609هـ/1212م، وأنهاها المرينيون بأخذ مراكش سنة 668هـ/1269م."
  en: "The state founded by the followers of the Mahdi Ibn Tumart and his teaching of the divine unity, ruling North Africa and al-Andalus in the twelfth and thirteenth centuries from Marrakesh. 'Abd al-Mu'min was proclaimed caliph in 524/1130, took Marrakesh in 542/1147 and united the whole Maghrib; the Almohads won at Alarcos in 591/1195, were defeated at Las Navas de Tolosa in 609/1212, and were ended by the Marinid capture of Marrakesh in 668/1269."
  ur: "مہدی ابن تومرت اور ان کی دعوت توحید کے پیروؤں کی قائم کردہ ریاست، جس نے چھٹی اور ساتویں صدی ہجری میں مراکش سے شمالی افریقہ اور اندلس پر حکومت کی۔ عبد المؤمن 524ھ/1130ء میں خلیفہ قرار پائے، 542ھ/1147ء میں مراکش لیا اور پورے مغرب کو متحد کیا؛ موحدین 591ھ/1195ء میں الارک میں فتح یاب ہوئے، 609ھ/1212ء میں العقاب میں شکست کھائی، اور 668ھ/1269ء میں مرینیوں نے مراکش لے کر انہیں ختم کر دیا۔"
