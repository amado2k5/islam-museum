    ar: "غلبت حِمْيَر على سبأ نحو سنة ١١٥ ق.م وملكت من ظفار؛ وفي قرونها الأخيرة انحطاطٌ ثم احتلال حبشي بعد مذبحة ذي نواس لنصارى نجران، ثم تبعية فارسية حتى إسلام باذان."
