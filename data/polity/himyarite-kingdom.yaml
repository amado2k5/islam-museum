summary:
  en: "The Himyarite power that took over Saba around 115 BCE and ruled from Zafar; its last centuries saw decline, the Abyssinian occupations after Dhu Nuwas’s massacre of Najran’s Christians, then Persian control until Badhan’s conversion in 638 CE."
  ar: "قوة حمير التي غلبت على سبأ نحو سنة 115ق.م وملكت من ظفار؛ شهدت قرونها الأخيرة انحطاطاً ثم الاحتلال الحبشي بعد مذبحة ذي نواس لنصارى نجران، ثم التبعية الفارسية حتى إسلام باذان سنة 638م."
  es: "El poder himyarita que se apoderó de Saba alrededor del año 115 a. C. y gobernó desde Zafar; sus últimos siglos vieron su declive, las ocupaciones abisinias tras la masacre de los cristianos de Najrán por parte de Dhu Nuwas, y luego el control persa hasta la conversión de Badhan en el año 638 d. C."
  fr: "La puissance himyarite qui s'empara de Saba vers 115 avant notre ère et régna depuis Zafar; ses derniers siècles furent marqués par le déclin, les occupations abyssiniennes après le massacre des chrétiens de Najran par Dhu Nuwas, puis le contrôle perse jusqu'à la conversion de Badhan en 638 de notre ère."
  ur: "ہماری طاقت جس نے 115 قبل مسیح کے قریب سبا پر قبضہ کیا اور ظفر سے حکومت کی۔ اس کی پچھلی صدیوں میں زوال دیکھا گیا، ذو نواس کے نجران کے عیسائیوں کے قتل عام کے بعد حبشیوں کے قبضے، پھر 638 عیسوی میں بدھان کی تبدیلی تک فارس کا کنٹرول۔"
