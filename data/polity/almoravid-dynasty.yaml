label:
  ar: دولة المرابطين
  en: Almoravid dynasty
  ur: "مرابطین کی سلطنت"
summary:
  ar: "دولة بربرية قامت على يد عبد الله بن ياسين الجزولي بين قبائل صنهاجة الملثمين من لمتونة وجدالة ومسوفة، وحكمت المغرب ثم الأندلس في النصف الثاني من القرن الخامس الهجري والنصف الأول من السادس. افتتح أميرهم يحيى بن عمر سجلماسة سنة 445هـ وثبت الملك ليوسف بن تاشفين الذي اختط مراكش سنة 454هـ وضم الأندلس بعد موقعة الزلاقة. استمر ملكهم إلى أن استولى الموحدون على مراكش سنة 541هـ، وبقي لبني غانية حكم في جزر البليار وإفريقية. وتعرض دائرة المعارف الإسلامية إرثهم في المغرب والصحراء وغرب أفريقيا."
  en: "A Berber dynasty raised by Abd Allah ibn Yasin al-Jazuli among the veiled Sanhaja tribes of Lamtuna, Guddala and Massufa, which ruled the Maghrib and then al-Andalus in the second half of the 5th/11th century and the first half of the 6th/12th. Their amir Yahya ibn Umar took Sijilmasa in 445 AH, and Yusuf ibn Tashfin, who founded Marrakesh in 454 AH, annexed al-Andalus after Zallaqa. Their rule lasted until the Almohads took Marrakesh in 541 AH, while the Banu Ghaniya held on in the Balearics and Ifriqiya. The Encyclopaedia of Islam also treats their legacy in the Maghrib, the Sahara and West Africa."
  ur: "ایک بربر خاندان جو عبداللہ بن یاسین الجزولی کی تحریک سے لمتونہ، جدالہ اور مسوفہ کے نقاب پوش صنہاجہ قبائل میں ابھرا اور پانچویں صدی ہجری کے دوسرے نصف اور چھٹی کے پہلے نصف میں مغرب اور پھر اندلس پر حکمران رہا۔ امیر یحییٰ بن عمر نے 445 ہجری میں سجلماسہ فتح کیا، اور یوسف بن تاشفین نے 454 ہجری میں مراکش قائم کیا اور زلاقہ کے بعد اندلس کو شامل کیا۔ ان کی حکومت 541 ہجری میں موحدین کے مراکش لینے تک رہی، جبکہ بنو غانیہ بلیار جزائر اور افریقیہ میں باقی رہے۔ انسائیکلوپیڈیا آف اسلام مغرب، صحرا اور مغربی افریقہ میں ان کے ورثے کا بھی ذکر کرتا ہے۔"
