summary:
  ar: "دولة بربرية قامت على يد عبد الله بن ياسين الجزولي بين قبائل صنهاجة الملثمين من لمتونة وجدالة ومسوفة، وحكمت المغرب ثم الأندلس في النصف الثاني من القرن الخامس الهجري والنصف الأول من السادس. افتتح أميرهم يحيى بن عمر سجلماسة سنة 445هـ وثبت الملك ليوسف بن تاشفين الذي اختط مراكش سنة 454هـ وضم الأندلس بعد موقعة الزلاقة. استمر ملكهم إلى أن استولى الموحدون على مراكش سنة 541هـ، وبقي لبني غانية حكم في جزر البليار وإفريقية. وتعرض دائرة المعارف الإسلامية إرثهم في المغرب والصحراء وغرب أفريقيا."
  en: "A Berber dynasty raised by Abd Allah ibn Yasin al-Jazuli among the veiled Sanhaja tribes of Lamtuna, Guddala and Massufa, which ruled the Maghrib and then al-Andalus in the second half of the 5th/11th century and the first half of the 6th/12th. Their amir Yahya ibn Umar took Sijilmasa in 445 AH, and Yusuf ibn Tashfin, who founded Marrakesh in 454 AH, annexed al-Andalus after Zallaqa. Their rule lasted until the Almohads took Marrakesh in 541 AH, while the Banu Ghaniya held on in the Balearics and Ifriqiya. The Encyclopaedia of Islam also treats their legacy in the Maghrib, the Sahara and West Africa."
  ur: "ایک بربر خاندان جو عبداللہ بن یاسین الجزولی کی تحریک سے لمتونہ، جدالہ اور مسوفہ کے نقاب پوش صنہاجہ قبائل میں ابھرا اور پانچویں صدی ہجری کے دوسرے نصف اور چھٹی کے پہلے نصف میں مغرب اور پھر اندلس پر حکمران رہا۔ امیر یحییٰ بن عمر نے 445 ہجری میں سجلماسہ فتح کیا، اور یوسف بن تاشفین نے 454 ہجری میں مراکش قائم کیا اور زلاقہ کے بعد اندلس کو شامل کیا۔ ان کی حکومت 541 ہجری میں موحدین کے مراکش لینے تک رہی، جبکہ بنو غانیہ بلیار جزائر اور افریقیہ میں باقی رہے۔ انسائیکلوپیڈیا آف اسلام مغرب، صحرا اور مغربی افریقہ میں ان کے ورثے کا بھی ذکر کرتا ہے۔"
  es: "Una dinastía bereber fundada por Abd Allah ibn Yasin al-Jazuli entre las tribus veladas Sanhaja de Lamtuna, Guddala y Massufa, gobernó el Magreb y posteriormente al-Ándalus durante la segunda mitad del siglo V/XI y la primera mitad del siglo VI/XII. Su emir, Yahya ibn Umar, conquistó Sijilmasa en el año 445 de la Hégira, y Yusuf ibn Tashfin, fundador de Marrakech en el año 454 de la Hégira, anexionó al-Ándalus tras Zallaqa. Su dominio se extendió hasta la conquista de Marrakech por los almohades en el año 541 de la Hégira, mientras que los Banu Ghaniya mantuvieron el control de las Baleares e Ifriqiya. La Enciclopedia del Islam también aborda su legado en el Magreb, el Sáhara y África Occidental."
  fr: "Une dynastie berbère, fondée par Abd Allah ibn Yasin al-Jazuli parmi les tribus voilées Sanhaja de Lamtuna, Guddala et Massufa, régna sur le Maghreb puis sur al-Andalus durant la seconde moitié du Ve/XIe siècle et la première moitié du VIe/XIIe siècle. Leur émir, Yahya ibn Umar, s'empara de Sijilmasa en 445 AH, et Yusuf ibn Tashfin, fondateur de Marrakech en 454 AH, annexa al-Andalus après Zallaqa. Leur règne dura jusqu'à la prise de Marrakech par les Almohades en 541 AH, tandis que les Banu Ghaniya conservaient leur influence aux Baléares et en Ifriqiya. L'Encyclopédie de l'Islam aborde également leur héritage au Maghreb, au Sahara et en Afrique de l'Ouest."
  tr: "Abdullah ibn Yassin el-Jazuli tarafından Lamtuna, Dadala ve Masufa'nın maskeli Sanhaja kabileleri arasında kurulan Berberi devleti; beşinci yüzyılın ikinci yarısı ve altıncı yüzyılın ilk yarısında Fas'ı ve ardından el-Endülüs'ü yönetti. Prensleri Yahya ibn Umar Sijilmasa, 445 Hicri'de krallığı fethetti ve taht, 454 Hicri'de Marakeş'i haritalayan ve Zallaka Savaşı'ndan sonra Endülüs'ü ilhak eden Yusuf ibn Taşfin için kuruldu. Onların yönetimi, Almohadlar 541 Hicri'de Marakeş'i ele geçirene kadar sürdü, Banu Ghaniyya ise Balear Adaları ve Ifriqiya'yı yönetmeye devam etti. İslami Ansiklopedi, onların mirasını Fas, Sahra ve Batı Afrika'da sunar."
  id: "Sebuah negara Berber yang didirikan oleh Abdullah ibn Yassin al-Jazuli di antara suku Sanhaja bertopeng dari Lamtuna, Dadala, dan Masoufa, memerintah Maroko dan kemudian al-Andalus pada paruh kedua abad kelima AH dan paruh pertama abad keenam. Pangeran mereka, Yahya ibn Umar Sijilmasa, menaklukkan kerajaan pada tahun 445 H, dan takhta didirikan untuk Yusuf ibn Tashfin, yang memetakan Marrakesh pada tahun 454 H dan menganeksasi al-Andalus setelah Pertempuran Zallaqa. Kekuasaan mereka berlangsung hingga Almohad merebut Marrakesh pada tahun 541 H, sementara Banu Ghaniyya tetap memerintah Kepulauan Balearic dan Ifriqiya. Ensiklopedia Islam menampilkan warisan mereka di Maroko, Sahara, dan Afrika Barat."
