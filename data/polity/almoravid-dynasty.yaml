label:
  ar: دولة المرابطين
  en: Almoravid dynasty
summary:
  ar: دولة قامت على يد عبد الله بن ياسين الجزولي بين قبائل لمتونة وجدالة ومسوفة من الملثمين، سماهم بالمرابطين على اسم رباطهم بجزيرة النيل، فافتتح أميرهم يحيى بن عمر سجلماسة سنة 445هـ وثبت الملك ليوسف بن تاشفين الذي اختط مراكش سنة 454هـ ودوخ أقطار المغرب وضم الأندلس بعد موقعة الزلاقة، واستمر ملكهم إلى أن استولى الموحدون على مراكش سنة 541هـ.
  en: The dynasty raised by Abd Allah ibn Yasin al-Jazuli among the Mulaththamun tribes of Lamtuna, Guddala and Massufa, named Murabitun after their ribat island on the Niger; their amir Yahya ibn Umar took Sijilmasa in 445 AH, Yusuf ibn Tashfin founded Marrakesh in 454 AH, subdued the Maghreb and annexed al-Andalus after Zallaqa, until the Almohads took Marrakesh in 541 AH.
