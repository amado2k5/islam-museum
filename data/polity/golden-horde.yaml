label:
  ar: دولة بني جوجي بالدست ⁦(القبيل الذهبي)⁩
  en: The Jochid state of the Dasht (Golden Horde)
  es: "El estado jochid de los dasht (Horda de Oro)"
  fr: "L'État Jochid de la Horde Dorée"
  ur: "دشت کی جوچڈ ریاست ⁦(گولڈن ہارڈ)⁩"
  tr: "Jochi Devleti Baldast (Altın Kabile)"
  id: "Negara Jochi Baldast (Suku Emas)"
summary:
  ar: "دولة بني جوجي ⁦(دوشي خان)⁩ بن جنكزخان بدست القفجاق من فيلاق إلى بلغار؛ خلف جوجي من الولد ناخوا وبركة، وأسلم بركة على يد شيخ من أصحاب نجم الدين كبرى ببخارى واستأذن أخاه منكوفان في الاستيلاء على أعمال الخلافة، وكانت دولتهم بصراي حتى ملك أزبك فظهر الإسلام فيهم وتصاهروا على ملوك مصر."
  en: "The state of the sons of Jochi (Dushi Khan) ibn Genghis in the Qipchaq Dasht from Filak to Bulgar; Jochi's sons Naju and Berke inherited it, Berke converting at a Bukhara shaykh's hand of Najm al-Din Kubra's school and seeking his brother Monke's leave to strike the caliphate's lands — their throne sat at Saray until Uzbek's reign when Islam spread among them and they intermarried with Egypt's kings."
  es: "El estado de los hijos de Jochi (Dushi Khan) ibn Genghis en Qipchaq Dasht desde Filak hasta Bulgar; los hijos de Jochi, Naju y Berke, lo heredaron, Berke convirtiéndose por mano de un jeque de Bujará de la escuela de Najm al-Din Kubra y buscando el permiso de su hermano Monke para atacar las tierras del califato; su trono estuvo en Saray hasta el reinado de Uzbek, cuando el Islam se extendió entre ellos y se casaron con reyes de Egipto."
  fr: "L'État des fils de Jochi (Dushi Khan) ibn Genghis dans le Qipchaq Dasht de Filak à Bulgar; les fils de Jochi, Naju et Berke, en héritèrent, Berke se convertissant sous la main d'un cheikh de Boukhara de l'école de Najm al-Din Kubra et demandant la permission à son frère Monke de conquérir les terres du califat — leur trône se trouvait à Saray jusqu'au règne d'Ouzbek, lorsque l'islam se répandit parmi eux et qu'ils s'allièrent par mariage avec les rois d'Égypte."
  ur: "فلک سے بلغار تک کیپچاق دشت میں جوچی ⁦(دوشی خان)⁩ ابن چنگیز کے بیٹوں کی حالت؛ جوچی کے بیٹوں نجو اور برکے نے اسے وراثت میں حاصل کیا، برکے نے بخارا کے شیخ کے ہاتھ سے نجم الدین کبری کے مکتب میں تبدیلی کی اور اپنے بھائی مونک سے خلافت کی سرزمینوں پر حملہ کرنے کی اجازت طلب کی - ان کا تخت سرائے پر بیٹھا رہا جب تک کہ ازبکوں کے دور حکومت میں ان کے درمیان اسلام پھیل گیا اور انہوں نے مصر کے ساتھ شادی کر لی۔"
  tr: "Cengiz Han'ın oğlu Banu Joçi (Doşi Han) devleti, Kipçak tarafından Falak'tan Bulgar'a kadar yönetiliyordu; Coçi'nin yerine Nakhwa ve Baraka oğullarından geçti. Baraka, Buhara'daki Necmeddin Kubra'nın sahabelerinden bir şeyh tarafından İslam'a geçti ve kardeşi Mankufan'dan halifeliği ele geçirmek için izin istedi. Devletleri Basray'dan Azbek kralına kadar uzandı; o zaman İslam aralarında ortaya çıktı ve Mısır krallarıyla evlendiler."
  id: "Negara Banu Jochi (Doshi Khan), putra Genghaz Khan, dipimpin oleh Kipchak dari Falaq ke Bulgar; ia menggantikan Jochi dari putra-putra Nakhwa dan Baraka. Baraka memeluk Islam di tangan seorang sheikh dari sahabat Najm al-Din Kubra di Bukhara dan meminta izin dari saudaranya Mankufan untuk merebut kekhalifahan. Negara mereka meluas dari Basrai hingga raja Azbek, ketika Islam muncul di antara mereka, dan mereka menikahi raja-raja Mesir."
