label:
  ar: دولة بني جوجي بالدست (القبيل الذهبي)
  en: The Jochid state of the Dasht (Golden Horde)
summary:
  ar: "دولة بني جوجي (دوشي خان) بن جنكزخان بدست القفجاق من فيلاق إلى بلغار؛ خلف جوجي من الولد ناخوا وبركة، وأسلم بركة على يد شيخ من أصحاب نجم الدين كبرى ببخارى واستأذن أخاه منكوفان في الاستيلاء على أعمال الخلافة، وكانت دولتهم بصراي حتى ملك أزبك فظهر الإسلام فيهم وتصاهروا على ملوك مصر."
  en: "The state of the sons of Jochi (Dushi Khan) ibn Genghis in the Qipchaq Dasht from Filak to Bulgar; Jochi's sons Naju and Berke inherited it, Berke converting at a Bukhara shaykh's hand of Najm al-Din Kubra's school and seeking his brother Monke's leave to strike the caliphate's lands — their throne sat at Saray until Uzbek's reign when Islam spread among them and they intermarried with Egypt's kings."
