label:
  ar: أتابكية فارس السلغرية
  en: Salghurid atabegs of Fars
summary:
  ar: "أتابكية فارس المعروفة بالدولة السلغرية؛ تنسب إلى سلغر قائد إحدى قبائل التركمان التي هاجمت خراسان وانضمت إلى طغرلبك فعينه في بلاطه، واستولى سنقر بن مودود على إقليم فارس سنة 543هـ فأسس دولة حكمت قرناً ونصفاً ومد نفوذه على كرمان واتخذ شيراز حاضرة لملكه، واستولى سعد بن زنكي على أصبهان ومد نفوذه على العراق العجمي والتقى جيوش خوارزمشاه بالري فانهزم فأكرمه وأعاده إلى بلاده مقتنعاً بالخطبة، ثم وسّع ابنه أبو بكر رقعة بلاده إلى البحرين وجزر الخليج وحادى جنكيز خان بالهدايا فلم يتعرض لسوء، إلى أن انقرض أمرهم سنة 686هـ."
  en: "The Salghurid atabegs of Fars; named for Salghur, a Turkmen chief who joined Tughril Beg's court — his descendant Sunqur ibn Mawdud seized Fars in 543, founding a century-and-a-half state seated at Shiraz with arms over Kirman; Sa'd ibn Zengi took Isfahan and the Iraqi 'Ajam lands, broke before Khwarazmshah at Rayy yet was honourably restored on a khutba-only tribute, and his son Abu Bakr stretched the realm to Bahrain and the Gulf isles, buying Genghis off with gifts — the house ending in 686."
