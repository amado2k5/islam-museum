label:
  ar: بنو المظفر اليزدي
  en: Muzaffarid dynasty
  es: "Dinastía Muzaffarid"
  fr: "Dynastie des Muzaffarides"
summary:
  ar: "دولة بني المظفر اليزدي المتغلبين على أصفهان وفارس وكرمان بعد انقراض دولة بني هلاكو؛ أصلهم أحمد المظفر من أهل يزد اتصل بالدولة أيام أبي سعيد فولي حفظ السابلة بفارس، فلما هلك أبو سعيد سنة 736هـ استبد ابنه شرف الدين محمود بأصفهان وفارس، ثم تغلب أخوه مبارز الدين محمد بن المظفر على كرمان ثم انتزع شيراز وأصفهان وقتل ابن أخيه أبا إسحاق أمير شيخ، وتوارث ولده محمود وشاه شجاع ومنصور بن شاه ولي وزين العابدين بن شجاع الملك حتى كبسهم تمر سنة 795هـ واستلحمهم واستصفى ملكهم من شيراز وأصفهان ويزد وكرمان."
  en: "The Muzaffarid (Mubariz al-Dinid) dynasty that ruled Isfahan, Fars and Kirman after the Ilkhanid fall; their root Ahmad al-Muzaffar of Yazd held the watch of Fars's roads under Abu Sa'id — at the Ilkhan's death in 736 his son Sharaf al-Din Mahmud seized Isfahan and Fars, then his brother Mubariz al-Din Muhammad took Kirman, wrested Shiraz and Isfahan and killed his nephew Abu Ishaq Amir Shaykh; his sons Mahmud, Shah Shuja', Mansur ibn Shah Wali and Zayn al-Abidin held the kingship until Timur stormed in 795, exterminated them and took Shiraz, Isfahan, Yazd and Kirman."
  es: "La dinastía Muzaffarid (Mubariz al-Dinid) que gobernó Isfahán, Fars y Kirman tras la caída de los Iljánidas; su raíz, Ahmad al-Muzaffar de Yazd, vigilaba los caminos de Fars bajo el mando de Abu Sa'id. Tras la muerte del Ilján en 736, su hijo Sharaf al-Din Mahmud se apoderó de Isfahán y Fars, luego su hermano Mubariz al-Din Muhammad tomó Kirman, arrebató Shiraz e Isfahán y mató a su sobrino Abu Ishaq Amir Shaykh. Sus hijos Mahmud, Shah Shuja', Mansur ibn Shah Wali y Zayn al-Abidin mantuvieron el trono hasta que Timur irrumpió en 795, los exterminó y tomó Shiraz, Isfahán, Yazd y Kirman."
  fr: "La dynastie des Muzaffarides (Mubariz al-Dinide) régna sur Ispahan, le Fars et Kirman après la chute des Ilkhanides; leur ancêtre, Ahmad al-Muzaffar de Yazd, était chargé de la surveillance des routes du Fars sous Abu Sa'id. À la mort de l'Ilkhan en 736, son fils Sharaf al-Din Mahmud s'empara d'Ispahan et du Fars, puis son frère Mubariz al-Din Muhammad prit Kirman, conquit Shiraz et Ispahan et tua son neveu Abu Ishaq Amir Shaykh; ses fils Mahmud, Shah Shuja', Mansur ibn Shah Wali et Zayn al-Abidin occupèrent le trône jusqu'à ce que Timour prenne d'assaut la région en 795, les extermine et prenne Shiraz, Ispahan, Yazd et Kirman."
