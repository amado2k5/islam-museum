label:
  ar: خانات قطلغ بكرمان
  en: Qutlugh-Khanids of Kirman
summary:
  ar: "أتابكية كرمان المعروفة بخانات قطلغ؛ أسسها براك حاجب أحد قواد دولة الخطا الذين دخلوا خدمة خوارزمشاه محمد بكرمان سنة 619هـ، وظلت البلاد خاضعة اسمياً للخوارزميين في عهد جلال الدين منكبرتي وكان براك نائباً له، ثم حاول الاستقلال سنة 623هـ فأرسل إلى المغول يحثهم على حربه، ودامت دولتهم في طاعة الإيلخانيين من ركن الدين خوجه الحق إلى قطب الدين محمد ثم أرملته قطلغ خاتون التي حكمت كرمان من 655 إلى 681هـ، إلى أن انقرض أمرهم نحو سنة 703هـ."
  en: "The Kirman atabegate known as the Qutlugh khans; founded by Baraq Hajib, a Qara-Khitai commander who entered Khwarazmshah Muhammad's service at Kirman in 619 — nominal vassal then rival of Jalal al-Din Mingburnu, courting the Mongols to break free in 623 — the state lasting under Ilkhanid suzerainty through Rukn al-Din Khwaja al-Haqq and Qutb al-Din Muhammad to his widow Qutlugh Khatun who ruled Kirman herself from 655 to 681, until the house faded about 703."
