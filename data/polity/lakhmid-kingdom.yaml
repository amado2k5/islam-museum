  en: "The Arab client kingdom at al-Hira on Persia’s border: from Amr ibn Adi under Shapur until the last Lakhmid al-Mundhir (al-Maʾrur) in 632, serving the Sasanians as a buffer against Arab raiders and Rome’s own Arab clients."
