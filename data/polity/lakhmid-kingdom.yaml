label: { en: "The Lakhmid Kingdom of al-Hira", ar: "مملكة الحيرة ⁦(المناذرة)⁩", es: "El Reino Lakhmid de al-Hira", fr: "Le royaume lakhmide d'al-Hira", ur: "الحیرہ کی لخمد بادشاہی", tr: "Al-Hirah Krallığı (Al-Munadhara)", id: "Kerajaan Al-Hirah (Al-Munadhara)" }
summary:
  en: "The Arab client kingdom at al-Hira on Persia’s border: from Amr ibn Adi under Shapur until the last Lakhmid al-Mundhir (al-Maʾrur) in 632, serving the Sasanians as a buffer against Arab raiders and Rome’s own Arab clients."
  ar: "المملكة العربية التابعة للفرس في الحيرة على تخوم ملكهم: من عمرو بن عدي في عهد سابور حتى آخرهم المنذر الملقب بالمعرور سنة 632م؛ كانت سداً للفرس أمام إغارات البادية وموازناً لعرب الشام أعوان الروم."
  es: "El reino árabe vasallo de al-Hira, en la frontera de Persia: desde Amr ibn Adi bajo el mando de Shapur hasta el último Lakhmid al-Mundhir (al-Maʾrur) en 632, sirviendo a los sasánidas como zona de amortiguación contra las incursiones árabes y los propios clientes árabes de Roma."
  fr: "Le royaume client arabe d'al-Hira à la frontière de la Perse: d'Amr ibn Adi sous Shapur jusqu'au dernier Lakhmid al-Mundhir (al-Maʾrur) en 632, servant les Sassanides comme tampon contre les pillards arabes et les propres clients arabes de Rome."
  ur: "فارس کی سرحد پر الحیرہ میں عرب کلائنٹ کی بادشاہت: عمرو ابن عدی سے شاپور کے ماتحت آخری لخمید المنذر ⁦(المرور)⁩ تک 632 میں، عرب حملہ آوروں اور روم کے اپنے عرب گاہکوں کے خلاف بفر کے طور پر ساسانیوں کی خدمت کر رہی تھی۔"
  tr: "Arap krallığı, Perslerin yönetimindeki El-Hirah'ta krallıklarının sınırlarında: Amr ibn Adi'den Sabor'un hükümdarlığı sırasında sonuncusu olan Al-Mundhir'e kadar, 632 yılında Al-Ma'rur lakabını aldı; Persler için çöl akınlarına karşı bir bariyer ve Levant Arapları olan Roma yardımcıları için denge unsuru olarak hizmet etti."
  id: "Kerajaan Arab di bawah Persia di Al-Hirah di perbatasan kerajaan mereka: dari Amr ibn Adi selama masa pemerintahan Sabor hingga yang terakhir, Al-Mundhir, yang dijuluki Al-Ma'rur pada tahun 632 M; kerajaan ini menjadi penghalang bagi Persia terhadap serangan gurun dan penyeimbang bagi bangsa Arab di Levant, para pembantu Romawi."
