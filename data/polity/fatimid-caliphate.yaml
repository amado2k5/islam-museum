summary:
  ar: "أسرة حكمت أولاً في شمال إفريقيا ثم في مصر من سنة 297هـ/909م إلى سنة 567هـ/1171م، وعاصمتها القاهرة بعد فتح جوهر لمصر. تعدّ دائرة المعارف الإسلامية أربعة عشر خليفة من عبيد الله المهدي إلى العاضد. ويعرض المقال المواقف المختلفة في نسبها، الفاطمي التقليدي والمعادي والإسماعيلي، دون حكم، ويصف سياستها وإدارتها واقتصادها وثقافتها وعلاقاتها بجيرانها، وانتهاءها على يد صلاح الدين سنة 567هـ."
  en: "A dynasty that ruled first in North Africa and then in Egypt, from 297 AH/909 CE to 567 AH/1171 CE, with Cairo as its capital after Jawhar's conquest of Egypt. The Encyclopaedia of Islam counts fourteen caliphs, from Ubayd Allah al-Mahdi to al-Adid. The article sets out the differing positions on its genealogy, Fatimid, hostile and Ismaili, without a verdict, and describes its policy, administration, economy, culture and relations with its neighbours, and its end under Saladin in 567 AH."
  ur: "ایک خاندان جس نے پہلے شمالی افریقہ میں اور پھر مصر میں 297ھ/909ء سے 567ھ/1171ء تک حکومت کی، اور جوہر کی فتحِ مصر کے بعد قاہرہ اس کا دارالحکومت بنا۔ انسائیکلوپیڈیا آف اسلام عبید اللہ المہدی سے العاضد تک چودہ خلفا گنتا ہے۔ مضمون اس کے نسب کے بارے میں مختلف مواقف، فاطمی، مخالف اور اسماعیلی، بغیر فیصلے کے بیان کرتا ہے، اور اس کی پالیسی، نظم و نسق، معیشت، ثقافت اور پڑوسیوں سے تعلقات، نیز 567ھ میں صلاح الدین کے ہاتھوں خاتمے کو بیان کرتا ہے۔"
