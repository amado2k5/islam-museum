summary:
  ar: "أسرة محلية حكمت خوارزم من كاث بلقب خوارزمشاه، أسسها أفريغ بحسب البيروني، وانتهت بقتل آخر ملوكها أبي عبد الله محمد بن أحمد سنة 385هـ/995م {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10}."
  en: "Local dynasty that ruled Khwarazm from Kath with the title Khwarazmshah, founded by Afrigh according to al-Biruni, and ended when its last ruler, Abu Abd Allah Muhammad ibn Ahmad, was killed in 385/995 {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10}."
  ur: "مقامی خاندان جس نے کاث سے خوارزم شاہ کے لقب کے ساتھ خوارزم پر حکومت کی؛ بیرونی کے مطابق اس کا بانی آفریغ تھا، اور 385ھ/995ء میں اس کے آخری حکمران ابو عبد اللہ محمد بن احمد کے قتل پر ختم ہوا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10}۔"
