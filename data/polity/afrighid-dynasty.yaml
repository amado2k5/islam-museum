label: { ar: "الأفريغيون ⁦(خوارزمشاهية كاث)⁩", en: "Afrighids (Khwarazmshahs of Kath)", ur: "آفریغی ⁦(کاث کے خوارزم شاہ)⁩", es: "Afrígidos (Khwarazmshahs de Kath)", fr: "Afrighids (Khwarazmshahs de Kath)", tr: "Afrikalılar (Khwarazmshahi Kath)", id: "Orang Afrika (Khwarazmshahi Kath)" }
summary:
  ar: "أسرة محلية حكمت خوارزم من كاث بلقب خوارزمشاه، أسسها أفريغ بحسب البيروني، وانتهت بقتل آخر ملوكها أبي عبد الله محمد بن أحمد سنة 385هـ/995م {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10}."
  en: "Local dynasty that ruled Khwarazm from Kath with the title Khwarazmshah, founded by Afrigh according to al-Biruni, and ended when its last ruler, Abu Abd Allah Muhammad ibn Ahmad, was killed in 385/995 {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10}."
  ur: "مقامی خاندان جس نے کاث سے خوارزم شاہ کے لقب کے ساتھ خوارزم پر حکومت کی؛ بیرونی کے مطابق اس کا بانی آفریغ تھا، اور 385ھ/995ء میں اس کے آخری حکمران ابو عبد اللہ محمد بن احمد کے قتل پر ختم ہوا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10}۔"
  es: "Dinastía local que gobernó Khwarazm desde Kath con el título Khwarazmshah, fundada por Afrigh según al-Biruni, y terminó cuando su último gobernante, Abu Abd Allah Muhammad ibn Ahmad, fue asesinado en 385/995 {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 9} {citar:ismoilov-xorazmshohlar-tangalari-2025 p. 10}."
  fr: "Dynastie locale qui dirigea le Khwarazm depuis Kath sous le titre de Khwarazmshah, fondée par Afrigh selon al-Biruni, et qui prit fin lorsque son dernier dirigeant, Abu Abd Allah Muhammad ibn Ahmad, fut tué en 385/995 {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 9} {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 10}."
  tr: "Yerel bir hanedan, Afrigh tarafından al-Biruni'ye göre kurulan ve son kralı Ebu Abdullah Muhammed bin Ahmed'in 385 Hicri / 995 yılında öldürülmesiyle sona eren Kath Harezm'i Khwarazmshah unvanıyla yönetmiştir {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 10}."
  id: "Sebuah dinasti lokal memerintah Khwarezm Kath dengan nama Khwarazmshah, yang didirikan oleh Afrigh menurut al-Biruni, dan berakhir dengan pembunuhan raja terakhirnya, Abu Abdullah Muhammad ibn Ahmad, pada tahun 385 H / 995 M {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 9} {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 10}."
