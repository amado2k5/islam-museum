kids:
  ar: "مملكة اسمها شاهات أرمنية قامت في أخلاط قرب بحيرة وان سنة 493هـ، حكمها أمراء ثم آل أيوب، إلى أن استولى عليها المغول."
  en: "A kingdom called Shah-i Arman founded at Akhlat by Lake Van in 1099; its princes ruled, then the Ayyubids, until the Mongols took it."
  ur: "شاہ ارمانیہ نامی ریاست جو 1099ء میں جھیل وان کے قریب اخلاط میں قائم ہوئی — پہلے اس کے شہزادوں نے حکومت کی پھر ایوبیوں نے، آخرکار منگولوں نے فتح کیا۔"
