label:
  ar: شاهات أرمينية بأخلاط
  en: Shah-i Arman of Akhlat
summary:
  ar: "شاهات أرمينية بدولة أخلاط؛ أسسها سكمان القطبي سنة 493هـ فكانت أقوى دويلات أرمينية السلجوقية على أن أغلب سكانها كانوا من الأرمن ولا تمثل إلا خمس بلاد أرمينية، وتعاقب عليها ظاهر الدين إبراهيم شاه أرمان وأحمد وناصر الدين سكمان الثاني وسيف الدين بكتمُر وبدر الدين آقسنقر، فلما انقرضت أسرة بني سكمان سنة 581هـ انتقل الحكم إلى مملوك بك تيمور ثم استولى الأيوبيون على البلاد سنة 604هـ فأقام الملك العادل ابنه الأوحد أميراً على أخلاط ثم أخوه الأشرف، وسقطت مملكة أخلاط التي كان يحكمها المظفر غازي آخر ملوك الأيوبيين بها سنة 642هـ باستيلاء هولاكو عليها."
  en: "The Shah-i Arman state of Akhlat; founded by Sukman al-Qutbi in 493, the strongest of Seljuk Armenia's lesser states though Armenian-majority and a fifth of the country — ruled by Zahir al-Din Ibrahim Shah-i Arman, Ahmad, Nasir al-Din Sukman II, Sayf al-Din Bektumr and Badr al-Din Aqsunqur until the Banu Sukman line ended in 581, passing to the mamluk Bak Timur, then to the Ayyubids in 604 — al-Adil seating his son al-Awhad then al-Ashraf — until Hulagu took al-Muzaffar Ghazi's kingdom of Akhlat in 642."
