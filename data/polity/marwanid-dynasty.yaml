id: polity/marwanid-dynasty
class: polity
kind: dynasty
label:
  ar: الدولة المروانية الكردية
  en: Marwanid dynasty (Kurdish)
  es: "Dinastía Marwaní (kurda)"
  fr: "Dynastie Marwanide (kurde)"
  ur: "مروانی خاندان ⁦(کرد)⁩"
  tr: "Marwani Kürt Devleti"
  id: "Negara Kurdi Marwanid"
summary:
  ar: "دولة بني مروان الأكراد بديار بكر بعد بني حمدان — وليست من العرب كما يبين ابن خلدون؛ أسسها باد الكردي الحسين بن دوشك الذي تغلب على آمد وديار بكر، ثم قام من بعده أبو علي بن مروان ابن أخته الذي استولى على حصن كيفا وضبط ديار بكر، وامتد ملك أبنائه حتى انقرض أمرهم مع قيام دول السلاجقة."
  en: "The Kurdish Marwanid state of Diyar Bakr after the Hamdanids — not Arab, as Ibn Khaldun notes; founded by Bad al-Kurdi Husayn ibn Dushik who seized Amid and Diyar Bakr, then carried on by his nephew Abu Ali ibn Marwan who took the Kayfa stronghold and secured Diyar Bakr, his descendants' rule lasting until the Seljuk states arose."
  es: "El estado kurdo marwánida de Diyar Bakr, posterior a los hamdánidas (no árabe, como señala Ibn Khaldun), fue fundado por Bad al-Kurdi Husayn ibn Dushik, quien conquistó Amid y Diyar Bakr, y posteriormente continuado por su sobrino Abu Ali ibn Marwan, quien tomó la fortaleza de Kayfa y aseguró Diyar Bakr. El dominio de sus descendientes perduró hasta el surgimiento de los estados selyúcidas."
  fr: "L'État kurde marwanide de Diyar Bakr après les Hamdanides — et non arabe, comme le note Ibn Khaldun; fondé par Bad al-Kurdi Husayn ibn Dushik qui s'empara d'Amid et de Diyar Bakr, puis poursuivi par son neveu Abu Ali ibn Marwan qui prit la place forte de Kayfa et sécurisa Diyar Bakr, le règne de ses descendants durant jusqu'à l'émergence des États seldjoukides."
  ur: "ہمدانیوں کے بعد دیار بکر کی کرد مروانی ریاست — عرب نہیں، جیسا کہ ابن خلدون نوٹ کرتا ہے۔ جس کی بنیاد بد الکردی حسین ابن دُشق نے رکھی جس نے امید اور دیار بکر پر قبضہ کیا، پھر اس کے بھتیجے ابو علی ابن مروان نے کیفہ کے گڑھ پر قبضہ کر کے دیار بکر کو محفوظ کر لیا، اس کی اولاد کی حکمرانی سلجوقی ریاستوں کے قیام تک جاری رہی۔"
  tr: "Banu Hamdan'dan sonra Diyarbakr'daki Banu Mervan Kürt devleti — İbn Haldun'un belirttiği gibi Arap değil — Kürt Bad al-Hüseyin bin Düşek tarafından kurulmuş, Amid ve Diyarbakr'ı mağlup etmiş, ardından yeğeni Ebu Ali ibn Mervan Kifa kalesini ele geçirip Diyarbeğ'i kontrol etmiştir. Oğullarının yönetimi, Selçuklu devletlerinin yükselişiyle hükümdarlıkları sona erene kadar sürmüştür."
  id: "Negara Kurdi Banu Marwan di Diyarbakr setelah Banu Hamdan — bukan Arab, seperti yang ditunjukkan Ibn Khaldun, didirikan oleh Kurdi Bad al-Husayn ibn Dushak, yang mengalahkan Amid dan Diyarbakr, diikuti oleh Abu Ali ibn Marwan, keponakannya, yang merebut benteng Kifa dan menguasai Diyarbakr. Kekuasaan putra-putranya berlanjut hingga kekuasaan mereka punah dengan bangkitnya negara-negara Seljuk."
