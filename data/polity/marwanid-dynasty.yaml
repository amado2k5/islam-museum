label:
  ar: الدولة المروانية الكردية
  en: Marwanid dynasty (Kurdish)
summary:
  ar: "دولة بني مروان الأكراد بديار بكر بعد بني حمدان — وليست من العرب كما يبين ابن خلدون؛ أسسها باد الكردي الحسين بن دوشك الذي تغلب على آمد وديار بكر، ثم قام من بعده أبو علي بن مروان ابن أخته الذي استولى على حصن كيفا وضبط ديار بكر، وامتد ملك أبنائه حتى انقرض أمرهم مع قيام دول السلاجقة."
  en: "The Kurdish Marwanid state of Diyar Bakr after the Hamdanids — not Arab, as Ibn Khaldun notes; founded by Bad al-Kurdi Husayn ibn Dushik who seized Amid and Diyar Bakr, then carried on by his nephew Abu Ali ibn Marwan who took the Kayfa stronghold and secured Diyar Bakr, his descendants' rule lasting until the Seljuk states arose."
