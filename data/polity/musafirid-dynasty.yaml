  en: Musafirid (Sallarid) dynasty
summary:
  ar: "دولة محمد بن مسافر من كبار الديلم صاحب الطرم وبنيه باذربيجان؛ كان له أولاد كثيرون منهم سلار وصعلوك ووهشودان والمرزبان، تنازع إخوته دسيم بن إبراهيم الكردي على أذربيجان حتى ملكها المرزبان سنة 330هـ، ومن أيامهم نزول الروس بردعة سنة 332هـ وظفر المرزبان بهم."
  en: "The state of Muhammad ibn Musafir, Daylamite master of al-Tarum, and his sons in Azerbaijan; among his many sons were Salar, Sa'luk, Wahsudan and al-Marzuban, who wrested Azerbaijan from Daysim ibn Ibrahim the Kurd in 330 AH — in their days came the Rus descent on Barda'a in 332 and al-Marzuban's victory over them."
