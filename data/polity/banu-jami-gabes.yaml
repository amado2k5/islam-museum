label:
  ar: بنو جامع الهلاليون أمراء قابس
  en: Banu Jami', Hilali amirs of Gabes
summary:
  ar: "إمارة بني جامع الهلاليين بقابس لعهد الصنهاجيين؛ وليها بكر بن كامل بن جامع أمير المناقشة من دهمان من بني علي إحدى بطون رياح فاستبد بأمرها وخلع الامتثال من عنقه سنة 435هـ وبايعته توزر وقفصة وسوس والحامة ونفزاوة وسائر أعمال قسطنطينة فاستفحل أمره وعظم سلطانه، وتوارثها ولده عيسى ورشيد ومحمد ومدافع إلى أن دخلوا في طاعة عبد المؤمن الموحدي سنة 554هـ فانقرض أمرهم."
  en: "The amirate of the Hilali Banu Jami' at Gabes under the Sanhaja era; Bakr ibn Kamil ibn Jami', amir of the Manaqisha of Duhman of Banu Ali of the Riyah, threw off obedience in 435 AH and drew the bay'a of Tozeur, Gafsa, Sus, al-Hama, Nafzawa and all the Constantine districts until his sultanate grew mighty — his sons Isa, Rashid, Muhammad and Mudafi' held it in turn until they entered Abd al-Mu'min's obedience in 554 and their house ended."
