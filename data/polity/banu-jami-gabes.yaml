id: polity/banu-jami-gabes
class: polity
kind: emirate
label:
  ar: بنو جامع الهلاليون أمراء قابس
  en: Banu Jami', Hilali amirs of Gabes
  es: "Banu Jami', emires Hilali de Gabes"
  fr: "Banu Jami', émirs hilali de Gabès"
  ur: "بنو جامی، گیبس کے ہلالی امیر"
  tr: "Hilaliyyun Camii İnşaatçıları, Gabes'in prensleridir"
  id: "Para Pembangun Masjid Hilaliyyun adalah pangeran Gabes"
summary:
  ar: "إمارة بني جامع الهلاليين بقابس لعهد الصنهاجيين؛ وليها بكر بن كامل بن جامع أمير المناقشة من دهمان من بني علي إحدى بطون رياح فاستبد بأمرها وخلع الامتثال من عنقه سنة 435هـ وبايعته توزر وقفصة وسوس والحامة ونفزاوة وسائر أعمال قسطنطينة فاستفحل أمره وعظم سلطانه، وتوارثها ولده عيسى ورشيد ومحمد ومدافع إلى أن دخلوا في طاعة عبد المؤمن الموحدي سنة 554هـ فانقرض أمرهم."
  en: "The amirate of the Hilali Banu Jami' at Gabes under the Sanhaja era; Bakr ibn Kamil ibn Jami', amir of the Manaqisha of Duhman of Banu Ali of the Riyah, threw off obedience in 435 AH and drew the bay'a of Tozeur, Gafsa, Sus, al-Hama, Nafzawa and all the Constantine districts until his sultanate grew mighty — his sons Isa, Rashid, Muhammad and Mudafi' held it in turn until they entered Abd al-Mu'min's obedience in 554 and their house ended."
  es: "El emirato de los Hilali Banu Jami' en Gabes durante la era Sanhaja; Bakr ibn Kamil ibn Jami', emir de la Manaqisha de Duhman de Banu Ali de Riyah, se rebeló contra la obediencia en 435 AH y obtuvo la bay'a de Tozeur, Gafsa, Sus, al-Hama, Nafzawa y todos los distritos de Constantina hasta que su sultanato se hizo poderoso; sus hijos Isa, Rashid, Muhammad y Mudafi' lo mantuvieron sucesivamente hasta que entraron en obediencia a Abd al-Mu'min en 554 y su casa terminó."
  fr: "L'émirat des Hilali Banu Jami' à Gabès sous l'ère Sanhaja; Bakr ibn Kamil ibn Jami', émir de la Manaqisha de Duhman des Banu Ali de la Riyah, rejeta l'obéissance en 435 AH et reçut la bay'a de Tozeur, Gafsa, Sus, al-Hama, Nafzawa et de tous les districts de Constantin jusqu'à ce que son sultanat devienne puissant — ses fils Isa, Rashid, Muhammad et Mudafi' le détenaient à tour de rôle jusqu'à ce qu'ils entrent dans l'obéissance d'Abd al-Mu'min en 554 et que leur maison s'éteigne."
  ur: "ہلالی بنو جامی کی امارت سنہاجہ کے تحت گیبس میں؛ بکر بن کامل ابن جمیع جو کہ ریا کے بنو علی کے دہمان کے مناقشہ کے امیر تھے، نے 435 ہجری میں اطاعت کو ترک کر دیا اور توزور، غفصہ، سوس، الحما، نفزاوہ اور قسطنطنیہ کے تمام اضلاع کی بیعت کر لی، یہاں تک کہ اس کا بیٹا محمد بن راشد بن گیا۔ مفعول نے اسے باری باری برقرار رکھا یہاں تک کہ وہ 554 میں عبد المومن کی اطاعت میں داخل ہوئے اور ان کا گھر ختم ہوگیا۔"
  tr: "Gabe'deki Banu Jami'al-Hilali emirliği Sanhaji döneminde elinde tutuluyordu; Riyah'ın kabilelerinden Bani Ali'den Dahman emiri Bakr ibn Kamil ibn Jami' tarafından yönetildi; 435 Hicri yılında, Dahman emri kontrolü ele geçirip itaatini boynundan aldı. Tozeur, Gafsa, Souss, Al-Hamma, Nafzawa ve diğer tüm Konstantinopolis eyaletleri ona bağlılık yemini etti, bu da onun gücünü ve otoritesini büyük ölçüde artırdı. Oğulları İsa, Rashid, Muhammed ve Madafi, 554 Hicri'de Abdül-Mu'min el-Muvahhidi'nin komutası altına geçene kadar burayı miras aldılar; bu yıl yönetimleri sona erdi."
  id: "Emirat Banu Jami' al-Hilali di Gabes dikuasai pada era Sanhaji; diperintah oleh Bakr ibn Kamil ibn Jami', emir Dahman dari Bani Ali, salah satu suku Riyah, yang mengambil alih dan mencabut ketaatan dari lehernya pada tahun 435 H. Tozeur, Gafsa, Souss, Al-Hamma, Nafzawa, dan semua provinsi Konstantinopel lainnya bersumpah setia kepadanya, yang sangat meningkatkan kekuasaan dan otoritasnya. Putra-putranya Isa, Rashid, Muhammad, dan Madafi mewarisinya hingga mereka berada di bawah komando Abd al-Mu'min al-Muwahhidi pada tahun 554 H, ketika pemerintahan mereka berakhir."
