label:
  ar: الدولة الإدريسية
  en: Idrisid dynasty
summary:
  ar: "دولة الأدارسة بالمغرب الأقصى؛ أول دولة قامت للعلويين بالمغرب لما لجأ إدريس بن عبد الله بن الحسن إلى وليلة فبايعته البرابرة، وقسم ابنه محمد الأعمال بين أولاده فكانت لغمارة والريف ونكور حصص منها، وحاربت دولتهم الأغالبة والعبيديين ثم استجدّ موسى بن أبي العافية فأجلاهم عن فاس سنة 313هـ إلى جبال غمارة وحجر النسر معقلهم، وقام فيهم أبو العيش بن إدريس ثم الحسن بن كنون على بيعة الناصر الأموي فهزم عسكر الحكم سنة 362هـ، حتى طردهم غالب بن عبد الرحمن إلى المشرق وقُتل الحسن راجعاً إلى المغرب، فانقرض ملكهم إلا رجعة بني حمود منهم بسبتة وطنجة."
  en: "The Idrisid state of the Far Maghreb; the first Alid polity there, raised when Idris ibn Abdallah took refuge at Walila and the Berbers gave him bay'a — his son Muhammad divided the realm among his sons, Ghumara, the Rif and Nekour among their shares; the dynasty warred the Aghlabids and Fatimids until Musa ibn Abi al-Afiya drove them from Fez in 313 to the Ghumara fastness of Hajar al-Nasr, where Abu al-Aysh ibn Idris and then al-Hasan ibn Kannun led them under Cordoban da'wa (routing al-Hakam's army in 362), until Ghalib exiled them east and al-Hasan was killed returning — Idrisid kingship ended save for the later Hammudid branch at Ceuta and Tangier."
