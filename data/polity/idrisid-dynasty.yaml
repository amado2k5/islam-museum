label:
  ar: الدولة الإدريسية
  en: Idrisid dynasty
  es: "Dinastía Idrisí"
  fr: "Dynastie idrisside"
summary:
  ar: "دولة الأدارسة بالمغرب الأقصى؛ أول دولة قامت للعلويين بالمغرب لما لجأ إدريس بن عبد الله بن الحسن إلى وليلة فبايعته البرابرة، وقسم ابنه محمد الأعمال بين أولاده فكانت لغمارة والريف ونكور حصص منها، وحاربت دولتهم الأغالبة والعبيديين ثم استجدّ موسى بن أبي العافية فأجلاهم عن فاس سنة 313هـ إلى جبال غمارة وحجر النسر معقلهم، وقام فيهم أبو العيش بن إدريس ثم الحسن بن كنون على بيعة الناصر الأموي فهزم عسكر الحكم سنة 362هـ، حتى طردهم غالب بن عبد الرحمن إلى المشرق وقُتل الحسن راجعاً إلى المغرب، فانقرض ملكهم إلا رجعة بني حمود منهم بسبتة وطنجة."
  en: "The Idrisid state of the Far Maghreb; the first Alid polity there, raised when Idris ibn Abdallah took refuge at Walila and the Berbers gave him bay'a — his son Muhammad divided the realm among his sons, Ghumara, the Rif and Nekour among their shares; the dynasty warred the Aghlabids and Fatimids until Musa ibn Abi al-Afiya drove them from Fez in 313 to the Ghumara fastness of Hajar al-Nasr, where Abu al-Aysh ibn Idris and then al-Hasan ibn Kannun led them under Cordoban da'wa (routing al-Hakam's army in 362), until Ghalib exiled them east and al-Hasan was killed returning — Idrisid kingship ended save for the later Hammudid branch at Ceuta and Tangier."
  es: "El estado idrisí del Magreb lejano, la primera entidad política alí allí, se formó cuando Idris ibn Abdallah se refugió en Walila y los bereberes le rindieron juramento de lealtad (bay'a). Su hijo Muhammad dividió el reino entre sus hijos, repartiendo Ghumara, el Rif y Nekour entre ellos. La dinastía guerreó contra los aglabíes y los fatimíes hasta que Musa ibn Abi al-Afiya los expulsó de Fez en 313 hasta la fortaleza ghumara de Hajar al-Nasr, donde Abu al-Aysh ibn Idris y luego al-Hasan ibn Kannun los dirigieron bajo la da'wa cordobesa (derrotando al ejército de al-Hakam en 362), hasta que Ghalib los exilió al este y al-Hasan murió en su regreso. La monarquía idrisí terminó, salvo por la posterior rama hammudid en Ceuta y Tánger."
  fr: "L'État idrisside du Maghreb lointain; première entité politique alide de la région, fondée lorsqu'Idris ibn Abdallah se réfugia à Walila et que les Berbères lui prêtèrent allégeance. Son fils Muhammad divisa le royaume entre ses fils, dont les territoires de Ghumara, du Rif et de Nekour figuraient parmi leurs parts. La dynastie guerroya contre les Aghlabides et les Fatimides jusqu'à ce que Musa ibn Abi al-Afiya les chasse de Fès en 313 vers la forteresse de Hajar al-Nasr, fief des Ghumara, où Abu al-Aysh ibn Idris puis al-Hasan ibn Kannun les menèrent sous la direction de Cordoban (mis en déroute l'armée d'al-Hakam en 362), jusqu'à ce que Ghalib les exile vers l'est et qu'al-Hasan soit tué à son retour. La royauté idrisside prit fin, à l'exception de la branche hammudide ultérieure à Ceuta et Tanger."
