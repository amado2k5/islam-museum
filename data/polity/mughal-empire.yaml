summary:
  ar: دولة إسلامية حكمت معظم شبه القارة الهندية بدءاً بظهير الدين بابر سنة 1526م، وبلغت ذروتها في عهد أكبر وشاه جهان، وتفككت تدريجياً بعد أورنغزيب. يعرض ريتشاردز تاريخها الإمبراطوري حتى 1720م.
  en: An Islamic dynasty that ruled most of the Indian subcontinent from Babur's conquest in 1526; it reached its height under Akbar and Shah Jahan and broke up gradually after Aurangzeb. Richards covers its imperial history to 1720.
  ur: "بابر کی 1526ء کی فتح کے بعد برصغیر کے بڑے حصے پر حکومت کرنے والا خاندان۔ اکبر اور شاہ جہاں کے عہد میں عروج کو پہنچا اور اورنگزیب کے بعد بتدریج منتشر ہوا۔ {cite:richards-mughal-empire-1993}"
