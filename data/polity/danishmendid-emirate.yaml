summary:
  ar: "الدولة الدانشمندية؛ وطد رئيسها التركي جمشتكين بن دانشمند قوته في كادوكيا في مدن سيواس وقيصرية وملطية، وهزم الفرنجة في المدينة الأخيرة، وقام خلفاؤه بدور رائع في الحروب الصليبية من غازي بن جمشتكين سنة 499هـ إلى محمد الثاني وذي النون ويعي أرسلان بن غازي، على أن هذه الأسرة سرعان ما اندمجت في جارتها السلجوقية العظيمة سلاجقة الروم."
  en: "The Danishmendid state; the Turkish chief Jumushtekin ibn Danishmend made his power fast in Cappadocia at Sivas, Kayseri and Malatya — routing the Franks at the last — and his heirs Ghazi, Muhammad II, Dhu'l-Nun and Ya'qib Arslan played a splendid part in the Crusader wars until the house was absorbed into its great Seljuk neighbour of Rum."
