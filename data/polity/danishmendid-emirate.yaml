summary:
  ar: "الدولة الدانشمندية؛ وطد رئيسها التركي جمشتكين بن دانشمند قوته في كادوكيا في مدن سيواس وقيصرية وملطية، وهزم الفرنجة في المدينة الأخيرة، وقام خلفاؤه بدور رائع في الحروب الصليبية من غازي بن جمشتكين سنة 499هـ إلى محمد الثاني وذي النون ويعي أرسلان بن غازي، على أن هذه الأسرة سرعان ما اندمجت في جارتها السلجوقية العظيمة سلاجقة الروم."
  en: "The Danishmendid state; the Turkish chief Jumushtekin ibn Danishmend made his power fast in Cappadocia at Sivas, Kayseri and Malatya — routing the Franks at the last — and his heirs Ghazi, Muhammad II, Dhu'l-Nun and Ya'qib Arslan played a splendid part in the Crusader wars until the house was absorbed into its great Seljuk neighbour of Rum."
  es: "El estado danés, cuyo jefe turco Jumushtekin ibn Danishmend consolidó su poder en Capadocia, en Sivas, Kayseri y Malatya —derrotando a los francos en esta última—, y sus herederos Ghazi, Muhammad II, Dhu'l-Nun y Ya'qib Arslan desempeñaron un papel destacado en las guerras de las Cruzadas hasta que la casa fue absorbida por su gran vecino selyúcida de Rum."
  fr: "L'État damandingue; le chef turc Jumushtekin ibn Danishmend consolida son pouvoir en Cappadoce à Sivas, Kayseri et Malatya — mettant en déroute les Francs à la fin — et ses héritiers Ghazi, Muhammad II, Dhu'l-Nun et Ya'qib Arslan jouèrent un rôle brillant dans les guerres croisées jusqu'à ce que la maison soit absorbée par son grand voisin seldjoukide de Rum."
  ur: "ڈنمارک کی ریاست؛ ترکی کے سربراہ جمشتکین ابن دانشمند نے کپاڈوشیا میں سیواس، قیصری اور ملاتیا میں اپنی طاقت کو تیز کیا - فرینکوں کو آخر کار شکست دی - اور اس کے وارث غازی، محمد دوم، ذوالنون اور یعقوب ارسلان نے صلیبی جنگوں میں شاندار کردار ادا کیا یہاں تک کہ اس کے عظیم پڑوسی کے گھر ابسورم بن گئے۔"
  tr: "Danimarka devleti; Türk lideri Gemshtekin ibn Danishmand, Kadokia'daki gücünü Sivas, Sezariye ve Malatya şehirlerinde pekiştirdi ve Malatya şehirlerinde Frankları mağlup etti. Onun halefleri, 499 Hicri'de Gazi ibn Gamştekin'den Mehmed II ve Dhu al-Nun'a kadar Haçlı Seferlerinde kayda değer bir rol oynadı. Arslan ibn Ghazi aynı zamanda Haçlı olarak da biliniyordu, ancak bu hanedan kısa sürede büyük Selçuklu komşusu Rum Selçukluları ile birleşti."
  id: "Negara Denmark; pemimpin Turkinya Gemshtekin ibn Danishmand mengkonsolidasikan kekuasaannya di Kadokia di kota-kota Sivas, Caesarea, dan Malatya, mengalahkan bangsa Frank di kota terakhir tersebut. Para penerusnya memainkan peran penting dalam Perang Salib, dari Ghazi ibn Gamshtekin pada tahun 499 H hingga Mehmed II dan Dhu al-Nun. Arslan ibn Ghazi juga dikenal sebagai Sang Tentara Salib, tetapi dinasti ini segera bergabung dengan tetangga besarnya dari Seljuk, Seljuk dari Rum."
