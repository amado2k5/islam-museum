summary:
  en: "The Roman power that ruled Egypt and Syria, controlled the sea trade routes that strangled Yemen’s caravan economy, set up client kings among the Arabs of al-Sham, and armed Abyssinia’s fleet for the second occupation of Yemen."
  ar: "قوة الروم الحاكمة لمصر والشام، المسيطرة على طرق التجارة البحرية التي أضعفت تجارة اليمن؛ اصطنعت ملوكاً من عرب الشام، وهيأت للأحباش الأسطول الذي احتل اليمن ثانية سنة 525م."
  ur: "رومی طاقت جو مصر اور شام پر حکمران رہی، بحری تجارتی راستوں پر اثر رکھتی تھی اور شام کے عرب علاقوں میں حلیف بادشاہوں کی پشت پناہی کرتی تھی۔ {cite:mubarakpuri-raheeq}"
