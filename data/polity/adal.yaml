  ar: سلطنة عدل
  en: Adal
summary:
  ar: "سلطنة إسلامية في شرق أفريقيا، على الساحل الشرقي للحبشة، صارت في القرن الخامس عشر جزءًا من إفات، وكان لها دور في الحروب بين الإسلام والمسيحية الحبشية؛ وتسمى أيضًا بلد زيلع وتعود تاريخيًا إلى السلطان سعد الدين {cite:encyclopaedia-of-islam-2 vol. 1 p. 195}."
  en: "A Muslim state of East Africa on the eastern edge of Abyssinia, part of Ifat in the 15th century, which played an important part in the wars between Islam and Abyssinian Christendom; it was often synonymous with the sultanate of Zayla and named after Sa'd al-Din {cite:encyclopaedia-of-islam-2 vol. 1 p. 195}."
