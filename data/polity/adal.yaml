  ar: سلطنة عدل
  en: Adal
  es: "Adal"
  fr: "Adal"
  ur: "عدل"
summary:
  ar: "سلطنة إسلامية في شرق أفريقيا، على الساحل الشرقي للحبشة، صارت في القرن الخامس عشر جزءًا من إفات، وكان لها دور في الحروب بين الإسلام والمسيحية الحبشية؛ وتسمى أيضًا بلد زيلع وتعود تاريخيًا إلى السلطان سعد الدين {cite:encyclopaedia-of-islam-2 vol. 1 p. 195}."
  en: "A Muslim state of East Africa on the eastern edge of Abyssinia, part of Ifat in the 15th century, which played an important part in the wars between Islam and Abyssinian Christendom; it was often synonymous with the sultanate of Zayla and named after Sa'd al-Din {cite:encyclopaedia-of-islam-2 vol. 1 p. 195}."
  es: "Estado musulmán de África Oriental en el extremo oriental de Abisinia, parte de Ifat en el siglo XV, que desempeñó un papel importante en las guerras entre el Islam y la cristiandad abisinia; a menudo era sinónimo del sultanato de Zayla y recibió su nombre de Sa'd al-Din {cite:encyclopaedia-of-islam-2 vol. 1 p. 195}."
  fr: "Un État musulman d'Afrique de l'Est, situé à l'extrémité orientale de l'Abyssinie, faisant partie d'Ifat au XVe siècle, qui a joué un rôle important dans les guerres entre l'Islam et la chrétienté abyssinienne; il était souvent synonyme du sultanat de Zayla et nommé d'après Sa'd al-Din {cite:encyclopaedia-of-islam-2 vol. 1 p. 195}."
  ur: "حبشہ کے مشرقی کنارے پر مشرقی افریقہ کی ایک مسلم ریاست، 15ویں صدی میں افات کا حصہ، جس نے اسلام اور حبشی عیسائیوں کے درمیان جنگوں میں اہم کردار ادا کیا؛ یہ اکثر زائلہ کی سلطنت کا مترادف تھا اور سعد الدین کے نام پر رکھا گیا {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد 1 ص۔ 195}"
