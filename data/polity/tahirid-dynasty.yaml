summary:
  ar: "بطاقة أولية للدولة الطاهرية، ولاة خراسان المستقلين فعلياً عن بغداد بقيادة طاهر بن الحسين ونسله من ٢٠٥هـ/٨٢١م حتى سقوطهم بيد الصفاريين سنة ٢٥٩هـ/٨٧٣م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Tahirid dynasty, the effectively autonomous governors of Khurasan under Tahir ibn al-Husayn and his line from 205/821 until the Saffarid takeover in 259/873; its sources are not yet checked on the page."
  es: "Boceto de ficha para la dinastía Tahirid, los gobernadores efectivamente autónomos de Jorasán bajo Tahir ibn al-Husayn y su línea desde 205/821 hasta la toma del poder por los Saffarid en 259/873; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la dynastie tahiride, les gouverneurs effectivement autonomes du Khorasan sous Tahir ibn al-Husayn et sa lignée de 205/821 jusqu'à la prise de pouvoir des Saffarides en 259/873; ses sources ne sont pas encore vérifiées sur la page."
  ur: "طاہر بن الحسین کے ماتحت خراسان کے مؤثر خود مختار گورنر اور 205/821 سے لے کر 259/873 میں صفرید کے قبضے تک ان کا سلسلہ طاہری خاندان کے لیے ڈرافٹ کارڈ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Tahiri devletinin ön kartı, Horasan valilerinin Bağdat'tan fiilen bağımsız olan ve 205 HIC / 821 M.S. yıllarından 259 Hicri/873 yılında Saffarilere düşmelerine kadar Tahir ibn al-Hüseyin ve onun soyundan gelenler; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu awal negara Tahirid, para gubernur Khorasan yang secara efektif merdeka dari Baghdad di bawah kepemimpinan Tahir ibn al-Husayn dan keturunannya dari tahun 205 H / 821 M hingga jatuhnya mereka ke tangan Saffarid pada 259 H/873 M; sumber-sumbernya di halaman tersebut belum ditinjau."
