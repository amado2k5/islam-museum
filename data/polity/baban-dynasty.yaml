summary:
  ar: "أسرة وإمارة كردية في كردستان العراق نشأت مطلع القرن الحادي عشر الهجري/السابع عشر الميلادي، وكان مقرها قرة جولان حتى تأسيس السليمانية سنة 1198هـ/1783م، وانتهى حكمها بخروج آخر أمرائها من السليمانية سنة 1267هـ/1850م {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}."
  en: "A Kurdish family and principality of Iraqi Kurdistan, which rose in the early eleventh/seventeenth century, held its seat at Kara Chulan until Sulaymaniyya was founded in 1198/1783, and ended when its last prince left Sulaymaniyya in 1267/1850 {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}."
  ur: "عراقی کردستان کا کرد خاندان اور ریاست، جو گیارہویں صدی ہجری/سترہویں صدی عیسوی میں ابھری، 1198ھ/1783ء میں سلیمانیہ کی بنیاد تک کرہ چولان میں مقیم رہی، اور 1267ھ/1850ء میں آخری شہزادے کے سلیمانیہ چھوڑنے پر ختم ہوئی {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}۔"
  es: "Una familia kurda y un principado del Kurdistán iraquí, que surgió a principios del siglo XI/XVII, mantuvo su sede en Kara Chulan hasta la fundación de Sulaymaniyya en 1198/1783, y terminó cuando su último príncipe abandonó Sulaymaniyya en 1267/1850 {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}."
  fr: "Une famille kurde et une principauté du Kurdistan irakien, apparue au début du XIe/XVIIe siècle, ont tenu leur siège à Kara Chulan jusqu'à la fondation de Sulaymaniyya en 1198/1783, et ont pris fin lorsque son dernier prince a quitté Sulaymaniyya en 1267/1850 {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}."
  tr: "Irak Kürdistanı'nda köken alan Kürt ailesi ve emirliği, 11. yüzyıl Hicri / 17. yüzyılda ortaya çıkmış, merkezi 1198 Hicri / 1783 yılında Süleymaniye'nin kuruluşuna kadar Qarat Golan'da bulunmuştur ve yönetimi son prenslerinin 1267 Hicri / 1850 yılında Süleymaniye'den ayrılmasıyla sona ermiştir {atıf:İslam Ansiklopedisi-2 cilt 1, s. 902}."
  id: "Sebuah keluarga dan emirat Kurdi di Kurdistan Irak yang berasal pada awal abad ke-11 H / abad ke-17 M, berkantor pusat di Qarat Golan hingga berdirinya Sulaymaniyah pada tahun 1198 H / 1783 M, dan pemerintahannya berakhir dengan kepergian para pangeran terakhirnya dari Sulaymaniyah pada tahun 1267 H / 1850 M {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 902}."
