label:
  ar: "آل بابان"
  en: "Baban dynasty"
  ur: "بابان خاندان"
summary:
  ar: "أسرة وإمارة كردية في كردستان العراق نشأت مطلع القرن الحادي عشر الهجري/السابع عشر الميلادي، وكان مقرها قرة جولان حتى تأسيس السليمانية سنة 1198هـ/1783م، وانتهى حكمها بخروج آخر أمرائها من السليمانية سنة 1267هـ/1850م {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}."
  en: "A Kurdish family and principality of Iraqi Kurdistan, which rose in the early eleventh/seventeenth century, held its seat at Kara Chulan until Sulaymaniyya was founded in 1198/1783, and ended when its last prince left Sulaymaniyya in 1267/1850 {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}."
  ur: "عراقی کردستان کا کرد خاندان اور ریاست، جو گیارہویں صدی ہجری/سترہویں صدی عیسوی میں ابھری، 1198ھ/1783ء میں سلیمانیہ کی بنیاد تک کرہ چولان میں مقیم رہی، اور 1267ھ/1850ء میں آخری شہزادے کے سلیمانیہ چھوڑنے پر ختم ہوئی {cite:encyclopaedia-of-islam-2 vol. 1 p. 902}۔"
