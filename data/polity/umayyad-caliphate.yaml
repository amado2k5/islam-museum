  en: Umayyad Caliphate
  ur: "اموی خلافت"
summary:
  ar: "خلافة حكمت الأقاليم العربية الإسلامية من مركزها في الشام من 41هـ/661م إلى 132هـ/750م، وعاصمتها دمشق. وكان جميع خلفائها من نسل أمية بن عبد شمس القرشي، في فرعين هما السفيانيون والمروانيون. وشهدت أول سك إسلامي خالص وبدء كتابة السجلات بالعربية وبناء قبة الصخرة، وأُسلمت وعُرّبت فيها أراضٍ من آسيا الوسطى إلى الأندلس بقدر ملموس. وتنقل الرواية الإسلامية صورة سلبية في الغالب عنها، بينما ترى الدراسات الحديثة أن هذه الرواية صاغها خصوم الأسرة."
  en: "A caliphate that ruled the Arab Islamic territories from a centre in Syria from 41/661 to 132/750, with its capital at Damascus. Its caliphs all descended from Umayya ibn Abd Shams of Quraysh, in two lines, the Sufyanids and the Marwanids. The period saw the first properly Islamic coinage, government records begin in Arabic and the Dome of the Rock built, and lands from Central Asia to al-Andalus were first significantly Islamised and Arabised. Muslim tradition gives a largely negative picture of the dynasty, while the Encyclopaedia of Islam notes that this tradition was shaped by the dynasty's opponents."
  ur: "ایسی خلافت جس نے شام کے مرکز سے 41ھ/661ء سے 132ھ/750ء تک عرب مسلم علاقوں پر حکومت کی اور جس کا دارالحکومت دمشق تھا۔ اس کے تمام خلفاء قریش کے امیہ بن عبد شمس کی نسل سے تھے اور دو شاخوں میں بٹے تھے، سفیانی اور مروانی۔ اس دور میں پہلا خالص اسلامی سکہ آیا، سرکاری ریکارڈ عربی میں رکھے جانے لگے اور قبۃ الصخرہ بنا، اور وسطی ایشیا سے اندلس تک کے علاقے پہلی بار نمایاں طور پر مسلمان اور عربی بولنے والے ہوئے۔ مسلم روایت میں خاندان کی تصویر زیادہ تر منفی ہے، جبکہ انسائیکلوپیڈیا آف اسلام کے مطابق یہ روایت زیادہ تر خاندان کے مخالف حلقوں سے آئی ہے۔"
