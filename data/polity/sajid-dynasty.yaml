  ur: "بنو سج، آذربائیجان کے حکمران خاندان اور 889 سے 929 تک عباسیوں کے لیے برائے نام ارران کے لیے ڈرافٹ کارڈ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "889-929 yılları arasında Abbasi Halifeliği adı altında Azerbaycan ve Eran'ı yöneten Banu Saj ailesine ait ön kart; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Banu Saj, keluarga yang memerintah Azerbaijan dan Eran dengan nama Kekhalifahan Abbasiyah dari tahun 889 hingga 929 M; sumber-sumbernya di halaman tersebut belum ditinjau."
