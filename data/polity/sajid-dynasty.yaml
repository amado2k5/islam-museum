summary:
  ar: "بطاقة أولية لبني الساج، الأسرة التي حكمت أذربيجان وأران باسم الخلافة العباسية من ٨٨٩ إلى ٩٢٩م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Banu Saj, the dynasty ruling Azerbaijan and Arran nominally for the Abbasids from 889 to 929; its sources are not yet checked on the page."
  es: "Boceto de ficha para los Banu Saj, la dinastía que gobernó Azerbaiyán y Arran nominalmente para los abasíes desde 889 hasta 929; sus fuentes aún no han sido verificadas en la página."
