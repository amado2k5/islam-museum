label:
  ar: سلطنة سلاجقة الروم
  en: Sultanate of Rum
  ur: "سلطنت سلاجقہ روم"
summary:
  ar: "الدولة السلجوقية في الأناضول وعاصمتها قونية، أسسها أحفاد قتلمش عن طريق ابنه سليمان، وتؤرخها موسوعة الإسلام من نحو 483 إلى 707هـ. توسعت بعد نصر قليج أرسلان الثاني على البيزنطيين في ميريوكيفالون سنة 572هـ ووصلت إلى ذروتها في عهد كيكاوس الأول وكيقباد الأول، ثم صارت تابعة للمغول بعد كوسه داغ سنة 641هـ وانتهت سنة 707هـ. وهي في رواية ابن خلدون دولة قطلمش وبنيه ملوك قونية وبلاد الروم، بقيت بقونية حتى انقرضت بالتتر."
  en: "The Seljuk state of Anatolia, centred on Konya, founded by descendants of Qutlumush through his son Sulayman and dated by the Encyclopaedia of Islam from about 483 to 707 AH. It grew after Kilij Arslan II's victory over the Byzantines at Myriocephalon in 572, reached its height under Kay Kawus I and Kay Kubadh I, became a Mongol vassal after Kose Dagh in 641 and ended in 707. In Ibn Khaldun's account it is the state of Qutlumush and his sons, kings of Konya and the land of Rum, which lasted at Konya until the Tatars ended it."
  ur: "اناطولیہ کی سلجوقی ریاست جس کا مرکز قونیہ تھا، جسے قتلمش کی اولاد نے اس کے بیٹے سلیمان کے ذریعے قائم کیا اور دائرۂ معارفِ اسلام اس کا زمانہ تقریباً 483 سے 707ھ بتاتا ہے۔ قلیج ارسلان دوم کی 572ھ میں میریوکیفالون میں بازنطینیوں پر فتح کے بعد اسے وسعت ملی، کیکاؤس اول اور کیقباد اول کے دور میں عروج ہوا، 641ھ میں کوسہ داغ کے بعد منگولوں کی باج گزار بنی اور 707ھ میں ختم ہو گئی۔ ابن خلدون کے بیان میں یہ قتلمش اور اس کی اولاد کی حکومت ہے، یعنی قونیہ اور بلادِ روم کے بادشاہ، جو تاتاریوں کے ہاتھوں ختم ہونے تک قونیہ میں رہے۔"
