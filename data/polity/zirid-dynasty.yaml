  en: Zirid dynasty
summary:
  ar: "دولة آل زيري بن مناد الصنهاجي ولاة العبيديين بإفريقية؛ اختار المعز لدين الله بلكين بن زيري لأمر إفريقية والمغرب عدا صقلية لما رحل إلى المشرق سنة 358هـ وكناه أبا الفتوح ولقبه سيف الدولة، فتوارث ولده المنصور ثم باديس الملك حتى انفصل عنهم أخوه حماد بالمغرب الأوسط، وكبست دولتهم عود العرب الهلالية بعد هجرة بني سليم إلى إفريقية فتحولوا إلى المهدية ولم يزالوا بها إلى أن قضى عليهم عبد المؤمن الموحدي سنة 555هـ."
  en: "The house of Ziri ibn Manad al-Sanhaji, Fatimid governors of Ifriqiya; al-Mu'izz li-Din Allah chose Buluggin ibn Ziri for the affairs of Ifriqiya and the Maghreb (save Sicily) when he departed east in 358 AH, styling him Abu al-Futuh Sayf al-Dawla — his heirs al-Mansur then Badis held the kingship until his brother Hammad broke away in the Middle Maghreb, and after Banu Hilal and Sulaym's Arab migration overwhelmed them they retired to Mahdiyya, where they lasted until Abd al-Mu'min the Almohad ended them in 555."
