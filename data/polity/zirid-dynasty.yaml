label:
  ar: دولة آل زيري بن مناد
  en: Zirid dynasty
  es: "Dinastía Zirid"
  fr: "Dynastie Ziride"
  ur: "زرد خاندان"
  tr: "Ziri bin Manad'ın Durumu"
  id: "Negara Ziri bin Manad"
summary:
  ar: "دولة آل زيري بن مناد الصنهاجي ولاة العبيديين بإفريقية؛ اختار المعز لدين الله بلكين بن زيري لأمر إفريقية والمغرب عدا صقلية لما رحل إلى المشرق سنة 358هـ وكناه أبا الفتوح ولقبه سيف الدولة، فتوارث ولده المنصور ثم باديس الملك حتى انفصل عنهم أخوه حماد بالمغرب الأوسط، وكبست دولتهم عود العرب الهلالية بعد هجرة بني سليم إلى إفريقية فتحولوا إلى المهدية ولم يزالوا بها إلى أن قضى عليهم عبد المؤمن الموحدي سنة 555هـ."
  en: "The house of Ziri ibn Manad al-Sanhaji, Fatimid governors of Ifriqiya; al-Mu'izz li-Din Allah chose Buluggin ibn Ziri for the affairs of Ifriqiya and the Maghreb (save Sicily) when he departed east in 358 AH, styling him Abu al-Futuh Sayf al-Dawla — his heirs al-Mansur then Badis held the kingship until his brother Hammad broke away in the Middle Maghreb, and after Banu Hilal and Sulaym's Arab migration overwhelmed them they retired to Mahdiyya, where they lasted until Abd al-Mu'min the Almohad ended them in 555."
  es: "La casa de Ziri ibn Manad al-Sanhaji, gobernadores fatimíes de Ifriqiya; al-Mu'izz li-Din Allah eligió a Buluggin ibn Ziri para los asuntos de Ifriqiya y el Magreb (excepto Sicilia) cuando partió hacia el este en 358 AH, nombrándolo Abu al-Futuh Sayf al-Dawla; sus herederos al-Mansur y luego Badis mantuvieron el trono hasta que su hermano Hammad se separó en el Magreb Medio, y después de que la migración árabe de Banu Hilal y Sulaym los abrumó, se retiraron a Mahdiyya, donde duraron hasta que Abd al-Mu'min el Almohad acabó con ellos en 555."
  fr: "La maison de Ziri ibn Manad al-Sanhaji, gouverneurs fatimides d'Ifriqiya; al-Mu'izz li-Din Allah choisit Buluggin ibn Ziri pour les affaires d'Ifriqiya et du Maghreb (à l'exception de la Sicile) lorsqu'il partit vers l'est en 358 AH, le nommant Abu al-Futuh Sayf al-Dawla — ses héritiers al-Mansur puis Badis détenaient le trône jusqu'à ce que son frère Hammad fasse sécession au Moyen Maghreb, et après que la migration arabe de Banu Hilal et Sulaym les ait submergés, ils se retirèrent à Mahdiyya, où ils restèrent jusqu'à ce qu'Abd al-Mu'min l'Almohade y mette fin en 555."
  ur: "زیری ابن مناد السنہجی کا گھر، افریقیہ کے فاطمی گورنر؛ المعز لدین اللہ نے 358 ہجری میں مشرق کی طرف روانہ ہونے پر بلوگین بن زری کو افریقیہ اور مغرب کے امور کے لیے منتخب کیا اور اسے ابو الفتوح سیف الدولہ کا لقب دیا- اس کے وارث المنصور پھر بدیس نے اس کے بھائی حماد کی بادشاہت کو توڑنے کے بعد اس کے درمیانی بھائی حماد کو اقتدار سے الگ کر دیا۔ ہلال اور سلیم کی عرب ہجرت نے انہیں مغلوب کر دیا وہ مہدیہ چلے گئے، جہاں وہ اس وقت تک قائم رہے جب تک کہ عبد المومن الموحد نے 555 میں ان کا خاتمہ نہیں کیا۔"
  tr: "Ziri ailesi bin Manad al-Sanhaji'nin devleti, İfrikiye'deki Ubaydilerin valileri; Al-Mu'izz li-Din Allah Balkin bin Ziri, 358 Hicri yılında doğuya seyahat ettiğinde Sicilya hariç İfriqiyiye ve Mağrip işleri için seçildi. Ona Abu al-Futuh ve Seyf al-Dawla lakabını taktılar. Oğlu el-Mansur o zamanlar Badis, kardeşi Hammad Magrip'te onlardan ayrılana kadar krallığı miras aldı. Banu Süleym'in İfrikiye'ye göçü sonrası devletleri Hilali Araplar tarafından bastırıldı, bu yüzden Mahdis'e geçtiler ve Abdül-Mümin el-Muvahhidi onları 555 Hicri yılında ortadan kaldırana kadar orada kaldılar."
  id: "Negara keluarga Ziri bin Manad al-Sanhaji, para gubernur Ubaydi di Ifriqiya; Al-Mu'izz li-Din Allah Balkin bin Ziri dipilih untuk urusan Ifriqiya dan Maghreb, kecuali Sisilia, ketika ia melakukan perjalanan ke Timur pada tahun 358 H. Mereka menjulukinya Abu al-Futuh dan menjuluki Sayf al-Dawla. Putranya al-Mansur kemudian Badis mewarisi kerajaan hingga saudaranya Hammad berpisah dari mereka di Maghreb tengah. Negara mereka dihancurkan oleh bangsa Arab Hilali setelah migrasi Banu Sulaym ke Ifriqiya, sehingga mereka berpindah ke Mahdi dan tinggal di sana hingga Abd al-Mu'min al-Muwahhidi menyingkirkan mereka pada tahun 555 H."
