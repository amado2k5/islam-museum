label:
  ar: الدولة الكاكويهية ⁦(آل كاكويه)⁩
  en: Kakuyid dynasty
  es: "Dinastía Kakuyid"
  fr: "Dynastie des Kakuyides"
summary:
  ar: "دولة آل كاكويه من الديلم ملوك أصفهان ويزد؛ كان علاء الدولة بن كاكويه على أصفهان فأطاع السلطان محمود بن سبكتكين وخطب له سنة 420هـ، وقصد مسعود بن محمود أصفهان فملكها منه ثم عاد إليها، وكان علاء الدولة كرساسف بن قرامرد بن كاكويه صاحب يزد وصهر السلطانين محمد وسنجر على أختهما، وبقي آل كاكويه في الجبل حتى غلبت الدولة السلجوقية."
  en: "The state of the Kakuyids, Daylamite kings of Isfahan and Yazd; Ala al-Dawla ibn Kakuya held Isfahan and gave Sultan Mahmud ibn Subuktigin allegiance and the khutba in 420 AH, Mas'ud took the city from him and he recovered it, and Ala al-Dawla Karsasf ibn Qaramard ibn Kakuya ruled Yazd as son-in-law of the sultans Muhammad and Sanjar upon their sister — the house held the Jibal until the Seljuks prevailed."
  es: "El estado de los Kakuyids, reyes daylamitas de Isfahán y Yazd; Ala al-Dawla ibn Kakuya gobernó Isfahán y le juró lealtad al sultán Mahmud ibn Subuktigin y le dio la jutba en el año 420 de la Hégira, Mas'ud le arrebató la ciudad y la recuperó, y Ala al-Dawla Karsasf ibn Qaramard ibn Kakuya gobernó Yazd como yerno de los sultanes Muhammad y Sanjar sobre su hermana; la casa gobernó Jibal hasta que los selyúcidas prevalecieron."
  fr: "L'État des Kakuyides, rois daylamites d'Ispahan et de Yazd; Ala al-Dawla ibn Kakuya détenait Ispahan et prêta allégeance au sultan Mahmud ibn Subuktigin, et il y prononça le khutba en 420 AH. Mas'ud lui prit la ville, mais il la récupéra. Ala al-Dawla Karsasf ibn Qamard ibn Kakuya régna sur Yazd en tant que gendre des sultans Muhammad et Sanjar, sur leur sœur. La maison conserva le Jibal jusqu'à la victoire des Seldjoukides."
