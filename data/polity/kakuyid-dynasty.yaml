label:
  ar: الدولة الكاكويهية (آل كاكويه)
  en: Kakuyid dynasty
summary:
  ar: "دولة آل كاكويه من الديلم ملوك أصفهان ويزد؛ كان علاء الدولة بن كاكويه على أصفهان فأطاع السلطان محمود بن سبكتكين وخطب له سنة 420هـ، وقصد مسعود بن محمود أصفهان فملكها منه ثم عاد إليها، وكان علاء الدولة كرساسف بن قرامرد بن كاكويه صاحب يزد وصهر السلطانين محمد وسنجر على أختهما، وبقي آل كاكويه في الجبل حتى غلبت الدولة السلجوقية."
  en: "The state of the Kakuyids, Daylamite kings of Isfahan and Yazd; Ala al-Dawla ibn Kakuya held Isfahan and gave Sultan Mahmud ibn Subuktigin allegiance and the khutba in 420 AH, Mas'ud took the city from him and he recovered it, and Ala al-Dawla Karsasf ibn Qaramard ibn Kakuya ruled Yazd as son-in-law of the sultans Muhammad and Sanjar upon their sister — the house held the Jibal until the Seljuks prevailed."
