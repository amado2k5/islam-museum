label:
  ar: الدولة الأيوبية
  en: Ayyubid dynasty
  ur: "ایوبی سلطنت"
  es: "Dinastía ayubí"
  fr: "dynastie ayyoubide"
summary:
  ar: "سلالة حاكمة قامت سنة 1171م وحكمت مصر حتى سنة 1250م، وامتدت سلطتها إلى الشام والجزيرة واليمن؛ عاصمتها القاهرة. والسجل مستكمل الآن من دائرة المعارف الإسلامية حتى وفاة الكامل سنة 635هـ ⁦(1238م)⁩."
  en: "A ruling dynasty founded in 1171 CE that governed Egypt until 1250 CE and extended its power over Syria, the Jazira and Yemen; its capital was Cairo. The record now also draws on the Encyclopaedia of Islam up to the death of al-Kamil in 635 AH (1238)."
  ur: "1171ء میں قائم ہونے والا حکمران خاندان، جس نے مصر میں 1250ء تک حکومت کی اور شام، جزیرہ اور یمن تک اقتدار پھیلایا۔ اس کا مرکزی شہر قاہرہ تھا۔ {cite:khitat-maqrizi-1998}"
  es: "Dinastía gobernante fundada en 1171 d. C. que gobernó Egipto hasta 1250 d. C. y extendió su poder sobre Siria, Jazira y Yemen; su capital era El Cairo. El registro actual también se basa en la Enciclopedia del Islam hasta la muerte de al-Kamil en 635 AH (1238)."
  fr: "Une dynastie régnante fondée en 1171 apr. J.-C. qui gouverna l'Égypte jusqu'en 1250 apr. J.-C. et étendit son pouvoir sur la Syrie, la Jazira et le Yémen; sa capitale était le Caire. Les archives s'appuient désormais également sur l'Encyclopédie de l'Islam jusqu'à la mort d'al-Kamil en 635 AH (1238)."
