summary:
  ar: "سلالة حاكمة قامت سنة 1171م وحكمت مصر حتى سنة 1250م، وامتدت سلطتها إلى الشام والجزيرة واليمن؛ عاصمتها القاهرة. والسجل مستكمل الآن من دائرة المعارف الإسلامية حتى وفاة الكامل سنة 635هـ (1238م)."
  en: "A ruling dynasty founded in 1171 CE that governed Egypt until 1250 CE and extended its power over Syria, the Jazira and Yemen; its capital was Cairo. The record now also draws on the Encyclopaedia of Islam up to the death of al-Kamil in 635 AH (1238)."
