id: polity/hammadid-dynasty
class: polity
kind: dynasty
label:
  ar: دولة آل حماد بالقلعة
  en: Hammadid dynasty
  es: "Dinastía Hammadí"
  fr: "Dynastie hammadide"
  ur: "حمادی خاندان"
summary:
  ar: "دولة آل حماد بن بلكين بالقلعة من ملوك صنهاجة؛ شعبة من دولة آل زيري عقد لها المنصور بلكيز لأخيه حماد على أشير والمسيلة فاستقل بها سنة 398هـ أيام باديس، وحارب زناتة بالمغرب الأوسط فأثخن فيهم وكان مظفراً عليهم، واختط مدينة القلعة ونقل إليها جراوة وتم بناؤها وتمصيرها على رأس المائة الرابعة ورحل إليها طلاب العلوم وأرباب الصنائع، ودامت دولتهم في القلعة وبجاية إلى أن محاها عبد المؤمن الموحدي."
  en: "The house of Hammad ibn Buluggin at the Qal'a, Sanhaja kings of the Middle Maghreb; a branch of the Zirid state — al-Mansur Buluggin invested his brother Hammad with Ashir and Msila, and in 398 AH he seceded in Badis's day, ground down the Zanata, founded the fortress-city of the Qal'a (settled by Jarawa and finished about 400) which drew scholars and craftsmen from afar, and the dynasty lasted at the Qal'a and Bijaya until Abd al-Mu'min the Almohad erased it."
  es: "La casa de Hammad ibn Buluggin en Qal'a, reyes Sanhaja del Magreb Medio; una rama del estado Zirid: al-Mansur Buluggin investió a su hermano Hammad con Ashir y Msila, y en el 398 AH se separó en la época de Badis, arrasó Zanata, fundó la ciudad fortaleza de Qal'a (habitada por Jarawa y terminada alrededor del año 400) que atrajo a eruditos y artesanos de tierras lejanas, y la dinastía duró en Qal'a y Bijaya hasta que Abd al-Mu'min el Almohad la aniquiló."
  fr: "La maison de Hammad ibn Buluggin à Qal'a, rois Sanhaja du Moyen Maghreb; une branche de l'État Ziride — al-Mansur Buluggin investit son frère Hammad d'Ashir et de Msila, et en 398 AH, il fit sécession à l'époque de Badis, détruisit la Zanata, fonda la ville-forteresse de Qal'a (colonisée par les Jarawa et achevée vers 400) qui attira des érudits et des artisans de loin, et la dynastie dura à Qal'a et Bijaya jusqu'à ce qu'Abd al-Mu'min l'Almohade l'efface."
  ur: "قلعہ میں حماد بن بلوگین کا گھر، وسطی مغرب کے سنہاجا بادشاہ؛ زیرد ریاست کی ایک شاخ - المنصور بلوگین نے اپنے بھائی حماد کو آشیر اور مسیلہ کے ساتھ سرمایہ کاری کی اور 398 ہجری میں اس نے بدیس کے دن، زانتہ کو گرا کر قلعہ کے شہر کی بنیاد رکھی ⁦(جراوا نے آباد کیا اور 400 کے قریب ختم کیا)⁩ جس نے علما اور فنکاروں اور قادیانیوں کو اپنی طرف متوجہ کیا۔ بجیا یہاں تک کہ عبد المومن الموحد نے اسے مٹا دیا۔"
