id: polity/dawlat-bani-mahdi-yemen
class: polity
kind: state
label:
  ar: دولة بني مهدي باليمن
  en: Banu Mahdi's state in Yemen
  es: "El estado de Banu Mahdi en Yemen"
  fr: "L'État de Banu Mahdi au Yémen"
  ur: "یمن میں بنو مہدی کی ریاست"
  tr: "Yemen'deki Beni Mehdi devleti"
  id: "Negara Bani Mahdi di Yaman"
summary:
  ar: "دولة علي بن مهدي الحميري وبنيه باليمن؛ بدأت بدعوة الواعظ علي بن مهدي حين حالفه أهل الجبال بعد موت أم فاتك سنة 545هـ، فظهر أمره وملك تهامة وجبالها وقهر بني نجاح بزبيد فملكها سنة 554هـ، وذهب ملك بني سليمان من جميع التهائم والجبال واليمن على يد بني مهدي، ثم انقرضت دولتهم حين جاءت دولة بني أيوب فملكوا اليمن."
  en: "The state of Ali ibn Mahdi al-Himyari and his sons in Yemen; begun in the preacher's da'wa when the mountain folk swore to him after Umm Fatik's death in 545 — his cause flared over Tihama and its mountains, he crushed the Najahids and took Zabid in 554, and the Sulaymanids' whole Yemeni kingship passed into Banu Mahdi's hands until the Ayyubid state came and took the country."
  es: "El estado de Ali ibn Mahdi al-Himyari y sus hijos en Yemen; comenzó con la da'wa del predicador cuando la gente de las montañas le juró lealtad después de la muerte de Umm Fatik en 545; su causa se extendió por Tihama y sus montañas, aplastó a los Najahids y tomó Zabid en 554, y todo el reino yemení de los Sulaymanids pasó a manos de Banu Mahdi hasta que el estado ayubí llegó y tomó el país."
  fr: "L'État d'Ali ibn Mahdi al-Himyari et de ses fils au Yémen; a commencé avec la da'wa du prédicateur lorsque les montagnards lui ont prêté serment après la mort d'Umm Fatik en 545 — sa cause s'est répandue sur Tihama et ses montagnes, il a écrasé les Najahides et pris Zabid en 554, et toute la royauté yéménite des Sulaymanides est passée entre les mains des Banu Mahdi jusqu'à ce que l'État ayyoubide vienne et prenne le pays."
  ur: "یمن میں علی بن مہدی الحمیری اور ان کے بیٹوں کی حالت؛ مبلغین کی دعوت میں اس وقت شروع ہوا جب 545 میں ام فاتک کی موت کے بعد پہاڑی لوگوں نے اس سے قسم کھائی - اس کا سبب تہامہ اور اس کے پہاڑوں پر بھڑک اٹھا، اس نے نجاحوں کو کچل دیا اور 554 میں زبید کو لے لیا، اور سلیمانیوں کی پوری یمنی بادشاہت بنو مہدیوب کے ہاتھ میں چلی گئی اور ملک بنو مہدیب کے ہاتھ میں آگیا۔"
  tr: "Ali ibn Mehdi el-Himyari ve oğullarının Yemen'deki devleti, 545 Hicri yılında Um Fatik'in ölümünden sonra dağ halkı onunla ittifak kurduğunda vaiz Ali bin Mehdi'nin çağrısıyla başladı. Onun yönetimi ortaya çıktı ve Tihama ile dağlarını yönetti, Banu Najah ise 554 Hicri yılında Zabide tarafından fethedildi. Banu Süleyman'ın tüm tepeler, dağlar ve Yemen üzerindeki yönetimi Banu Mehdi'ye kapıldı. Sonra Eyyub devleti gelince devletleri sona erdi ve Yemen'i yönettiler."
  id: "Negara Ali ibn Mahdi al-Himyari dan putra-putranya di Yaman dimulai dengan panggilan pengkhotbah Ali ibn Mahdi ketika penduduk pegunungan bersekutu dengannya setelah kematian um Fatik pada tahun 545 H. Pemerintahannya menjadi jelas, dan ia memerintah Tihama beserta pegunungannya, dan Banu Najah ditaklukkan oleh Zabid, yang memerintah pada tahun 554 H. Kekuasaan Banu Sulayman atas semua bukit, gunung, dan Yaman hilang dari Banu Mahdi. Kemudian negara mereka berakhir ketika negara Ayyub datang, dan mereka memerintah Yaman."
