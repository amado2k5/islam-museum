label:
  ar: دولة بني مهدي باليمن
  en: Banu Mahdi's state in Yemen
summary:
  ar: "دولة علي بن مهدي الحميري وبنيه باليمن؛ بدأت بدعوة الواعظ علي بن مهدي حين حالفه أهل الجبال بعد موت أم فاتك سنة 545هـ، فظهر أمره وملك تهامة وجبالها وقهر بني نجاح بزبيد فملكها سنة 554هـ، وذهب ملك بني سليمان من جميع التهائم والجبال واليمن على يد بني مهدي، ثم انقرضت دولتهم حين جاءت دولة بني أيوب فملكوا اليمن."
  en: "The state of Ali ibn Mahdi al-Himyari and his sons in Yemen; begun in the preacher's da'wa when the mountain folk swore to him after Umm Fatik's death in 545 — his cause flared over Tihama and its mountains, he crushed the Najahids and took Zabid in 554, and the Sulaymanids' whole Yemeni kingship passed into Banu Mahdi's hands until the Ayyubid state came and took the country."
