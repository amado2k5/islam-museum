label: { en: "The Aksumite Kingdom (Abyssinia)", ar: "مملكة أكسوم ⁦(الحبشة)⁩" , ur: "مملکت اکسوم", es: "El Reino Aksumita (Abisinia)", fr: "Le royaume aksoumite (Abyssinie)", tr: "Aksum Krallığı (Habeşistan)", id: "Kerajaan Aksum (Abyssinia)"}
summary:
  en: "The Ethiopian power across the Red Sea which twice occupied Yemen — first 340–378 exploiting Himyarite rivalries, then in 525 under Aryat with Roman ships, in revenge for Dhu Nuwas’s trenches of fire — and whose commander Abraha led the elephant campaign on Mecca."
  ar: "قوة الحبشة خلف البحر الأحمر التي احتلت اليمن مرتين: أولى 340–378 مستغلة منافسة همدان وحمير، وثانية 525م بقيادة أرباط بأسطول الروم انتقاماً لأخاديد ذي نواس؛ ومن قوادها أبرهة صاحب حملة الفيل على مكة."
  ur: "بحیرہ احمر کے پار حبشہ کی سلطنت جس نے دو مرتبہ یمن پر قبضہ کیا؛ اسی کے سپہ سالار ابرہہ کی مکہ کی جانب ہاتھیوں والی مہم کا ذکر اس تاریخ میں آتا ہے۔ {cite:mubarakpuri-raheeq}"
  es: "La potencia etíope al otro lado del Mar Rojo que ocupó Yemen en dos ocasiones: primero entre 340 y 378, explotando las rivalidades himyaritas, y luego en 525 bajo el mando de Aryat con barcos romanos, en venganza por las trincheras de fuego de Dhu Nuwas, y cuyo comandante, Abraha, dirigió la campaña de elefantes en La Meca."
  fr: "La puissance éthiopienne de l'autre côté de la mer Rouge qui a occupé le Yémen à deux reprises — d'abord de 340 à 378 en exploitant les rivalités himyarites, puis en 525 sous Aryat avec des navires romains, en représailles aux tranchées de feu de Dhu Nuwas — et dont le commandant Abraha a mené la campagne des éléphants sur La Mecque."
  tr: "Kızıldeniz'in arkasındaki Habeşli kuvvet, Yemen'i iki kez işgal etti: ilk olarak 340–378 yıllarında Hamdan ile Himyar arasındaki rekabeti kullanarak, ikincisi ise 525 yılında Roma filosundan Arbat liderliğinde, Dhi Nuwas'ın hendeklerine misilleme olarak; komutanları arasında Mekke'ye yapılan fil seferinin lideri Abraha da vardı."
  id: "Pasukan Abyssinia di belakang Laut Merah yang menduduki Yaman dua kali: pertama pada 340–378 M, memanfaatkan persaingan antara Hamdan dan Himyar, dan kedua pada 525 M, dipimpin oleh Arbat dalam armada Romawi sebagai balasan atas parit Dhi Nuwas; di antara komandannya adalah Abraha, pemimpin kampanye gajah ke Mekah."
