summary:
  en: "The Ethiopian power across the Red Sea which twice occupied Yemen — first 340–378 exploiting Himyarite rivalries, then in 525 under Aryat with Roman ships, in revenge for Dhu Nuwas’s trenches of fire — and whose commander Abraha led the elephant campaign on Mecca."
  ar: "قوة الحبشة خلف البحر الأحمر التي احتلت اليمن مرتين: أولى 340–378 مستغلة منافسة همدان وحمير، وثانية 525م بقيادة أرباط بأسطول الروم انتقاماً لأخاديد ذي نواس؛ ومن قوادها أبرهة صاحب حملة الفيل على مكة."
  ur: "بحیرہ احمر کے پار حبشہ کی سلطنت جس نے دو مرتبہ یمن پر قبضہ کیا؛ اسی کے سپہ سالار ابرہہ کی مکہ کی جانب ہاتھیوں والی مہم کا ذکر اس تاریخ میں آتا ہے۔ {cite:mubarakpuri-raheeq}"
