kind: dynasty
label:
  ar: بنو نجاح بزبيد
  en: Najahid dynasty of Zabid
  es: "Dinastía Najahid de Zabid"
  fr: "Dynastie Najahid de Zabid"
  ur: "زبید کا نجاد خاندان"
  tr: "Zabid'de Banu Najah"
  id: "Banu Najah di Zabid"
summary:
  ar: "بنو نجاح بزبيد موالي بني زياد؛ لما استولى الصليحي على زبيد كان لنجاح ثلاثة من الولد معارك وسعيد وجياش، فلحق سعيد وجياش بجزيرة دهلك يتعلمان القرآن والآداب، ثم بيتا علي الصليحي في اللجم وهو متوجه إلى مكة فانتقض عسكره وتولى قتله جياش بيده سنة 473هـ، ورحلوا إلى زبيد فاستولوا عليها وبقي ملكهم عليها يخطبون للعباسيين والصليحيون يخطبون للعبيديين، وكان جياش موصوفاً بالعدل هلك على رأس المائة الخامسة، ثم ولي ابنه الفاتك إلى أن انقرض أمر آل نجاح وملك زبيد علي بن مهدي الخارجي سنة 554هـ."
  en: "Banu Najah of Zabid, mawali of Banu Ziyad; when al-Sulayhi took Zabid, Najah's sons Mu'arik, Sa'id and Jayyash scattered — Sa'id and Jayyash fleeing to Dahlak island to learn Qur'an and adab — until they ambushed Ali al-Sulayhi by night in the saddle-lines on his march to Mecca and Jayyash killed him with his own hand in 473; they took Zabid, ruling under the Abbasid khutba against the Sulayhids' Ubaydi one, Jayyash famed for justice until his death at the turn of the fifth century, his son al-Fatik succeeding until Ali ibn Mahdi the Khariji ended the house in 554."
  es: "Banu Najah de Zabid, mawali de Banu Ziyad; cuando al-Sulayhi tomó Zabid, los hijos de Najah, Mu'arik, Sa'id y Jayyash, se dispersaron —Sa'id y Jayyash huyeron a la isla de Dahlak para aprender el Corán y el adab— hasta que emboscaron a Ali al-Sulayhi por la noche en las líneas de las cabalgatas durante su marcha a La Meca y Jayyash lo mató con su propia mano en 473; tomaron Zabid, gobernando bajo la jutba abasí contra la ubaydí de los Sulayhid, Jayyash fue famoso por su justicia hasta su muerte a principios del siglo V, su hijo al-Fatik lo sucedió hasta que Ali ibn Mahdi el Khariji acabó con la casa en 554."
  fr: "Les Banu Najah de Zabid, mawali des Banu Ziyad; lorsque al-Sulayhi prit Zabid, les fils de Najah, Mu'arik, Sa'id et Jayyash, se dispersèrent — Sa'id et Jayyash fuyant vers l'île de Dahlak pour étudier le Coran et l'adab — jusqu'à ce qu'ils tendent une embuscade nocturne à Ali al-Sulayhi sur les lignes de selle lors de sa marche vers La Mecque et que Jayyash le tue de sa propre main en 473; ils prirent Zabid, régnant sous la khutba abbasside contre celle des Sulayhides, l'Ubaydi, Jayyash étant réputé pour sa justice jusqu'à sa mort au tournant du Ve siècle, son fils al-Fatik lui succédant jusqu'à ce qu'Ali ibn Mahdi le Khariji mette fin à la maison en 554."
  ur: "زبید کے بنو نجح، بنو زیاد کے موالی۔ جب السلیحی نے زبید کو لے لیا، نجاح کے بیٹے معرک، سعید اور جیاش بکھر گئے - سعید اور جیاش قرآن اور ادب سیکھنے کے لیے جزیرہ دہلک کی طرف بھاگے - یہاں تک کہ انہوں نے رات کو علی الصلیحی کو مکہ کی طرف مارچ کرتے ہوئے کاٹھی کی لکیروں میں گھات لگا لیا اور جیاش نے اسے اپنے ہی ہاتھ سے مار ڈالا۔ انہوں نے زبید کو لے لیا، عباسیوں کے خطبے کے تحت سلیحی کے عبادی کے خلاف حکمرانی کر رہے تھے، جیاش پانچویں صدی کے آخر میں اپنی موت تک انصاف کے لئے مشہور تھے، اس کا بیٹا الفاتق اس وقت تک کامیاب ہوا جب تک کہ علی بن مہدی خارجی نے 554 میں گھر کا خاتمہ نہیں کیا۔"
  tr: "Banu Najah, Banu Ziyad'ın vasalıydı; el-Süleyhi Zubeyd'in kontrolünü ele geçirdiğinde Najah'ın üç oğlu oldu: Ma'ariq, Sa'id ve Jayash. Sa'id ve Cayaş, Kur'an ve edebiyat öğrenmek için onu Dahlak Adası'na takip ettiler. Sonra Ali el-Süleyhi, Mekke'ye giderken El-Lijam'da kaldı. Ordusu yenildi ve Ceyiş 473 Hicri'de kendi cinayetini devraldı. Zabide gittiler, burayı ele geçirdiler ve hükümdarlıkları orada kaldı, Abbasilere vaaz verirken, Süleyhiler Ubaydilere vaaz verdi. Adil olarak tanımlanan Ceyaş, beşinci yüzyılın başında öldü. Sonra oğlu Fatik, Necah hanedanının yönetimi sona erene kadar tahta geçti ve Zubeyd Ali bin Mehdi el-Harici 554 Hicri'de hüküm sürdü."
  id: "Banu Najah adalah vasal Banu Ziyad; ketika al-Sulayhi mengambil alih Zubayd, Najah memiliki tiga putra: Ma'ariq, Sa'id, dan Jayash. Sa'id dan Jayash mengikutinya ke Pulau Dahlak untuk mempelajari Al-Qur'an dan sastra. Kemudian Ali al-Sulayhi tinggal di Al-Lijam saat menuju Mekah. Pasukannya dikalahkan, dan Jayash mengambil alih pembunuhannya sendiri pada tahun 473 H. Mereka pergi ke Zabid, merebutnya, dan pemerintahan mereka tetap di sana, berkhotbah kepada Abbasiyah, sementara Sulayhid berkhotbah kepada Ubaydid. Jayash, yang digambarkan sebagai adil, meninggal pada awal abad kelima. Kemudian putranya Fatik mewarisi hingga masa pemerintahan dinasti Najah berakhir, dan Zubayd Ali ibn Mahdi al-Khariji memerintah pada tahun 554 H."
