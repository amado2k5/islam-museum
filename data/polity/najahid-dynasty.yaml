label:
  ar: بنو نجاح بزبيد
  en: Najahid dynasty of Zabid
summary:
  ar: "بنو نجاح بزبيد موالي بني زياد؛ لما استولى الصليحي على زبيد كان لنجاح ثلاثة من الولد معارك وسعيد وجياش، فلحق سعيد وجياش بجزيرة دهلك يتعلمان القرآن والآداب، ثم بيتا علي الصليحي في اللجم وهو متوجه إلى مكة فانتقض عسكره وتولى قتله جياش بيده سنة 473هـ، ورحلوا إلى زبيد فاستولوا عليها وبقي ملكهم عليها يخطبون للعباسيين والصليحيون يخطبون للعبيديين، وكان جياش موصوفاً بالعدل هلك على رأس المائة الخامسة، ثم ولي ابنه الفاتك إلى أن انقرض أمر آل نجاح وملك زبيد علي بن مهدي الخارجي سنة 554هـ."
  en: "Banu Najah of Zabid, mawali of Banu Ziyad; when al-Sulayhi took Zabid, Najah's sons Mu'arik, Sa'id and Jayyash scattered — Sa'id and Jayyash fleeing to Dahlak island to learn Qur'an and adab — until they ambushed Ali al-Sulayhi by night in the saddle-lines on his march to Mecca and Jayyash killed him with his own hand in 473; they took Zabid, ruling under the Abbasid khutba against the Sulayhids' Ubaydi one, Jayyash famed for justice until his death at the turn of the fifth century, his son al-Fatik succeeding until Ali ibn Mahdi the Khariji ended the house in 554."
