summary:
  ar: "إمارة أولاد منديل من مغراوة بوادي شلف ونواحي المغرب الأوسط؛ أعادوا لقومهم الملك بعد انقراض آل خزر، وأصلهم عبد الصمد بن محمد بن خزرون أحد بني خزرون ملوك طرابلس فرّ إلى جبل أوراس ثم إلى زواوة ثم إلى بقايا مغراوة بشلف فأصهر إليهم وعُرف ولده ببني محمد ثم بالخزرية، ومنهم أبو ناس منتحل العبادة الذي أقطعه الموحدون وادي شلف، فابنه عبد الرحمن الذي نشأ مدلاً بنسبه واعتصبت عليه قبائل مغراوة وكان في دولة الموحدين تقدمة، فابناه منديل وتهيم، وملك العباس بن منديل وجاهد بني يغمراسن وبني عبد الواد على تلمسان إلى أن فنيت دولتهم في فتن المرينيين."
  en: "The emirate of the Awlad Mandil of Maghrawa in Wadi Shelif and the Middle Maghreb marches; they restored their people's kingship after the Khazirids' fall, descending from Abd al-Samad ibn Muhammad ibn Khazrun of the Tripoli Khazrunids who fled to the Aures then Zawawa then intermarried with the Shelif Maghrawa — his line were called Banu Muhammad then the Khazriyya: Abu Nas the pious, granted Wadi Shelif by the Almohads; his son Abd al-Rahman, born of a Makkhukh princess and gathering the Maghrawa tribes under Almohad favour; his sons Mandil and Tuhaym; and al-Abbas ibn Mandil, who contested Tlemcen with the Yaghmurasanids and Abd al-Wadids until the Marinid fitnas extinguished the state."
  es: "El emirato de los Awlad Mandil de Maghrawa en Wadi Shelif y las marcas del Magreb Medio; restauraron la monarquía de su pueblo después de la caída de los Khazirids, descendientes de Abd al-Samad ibn Muhammad ibn Khazrun de los Khazrunids de Trípoli que huyeron a Aures y luego a Zawawa y luego se casaron con los Shelif Maghrawa; su línea fue llamada Banu Muhammad y luego Khazriyya: Abu Nas el piadoso, a quien los Almohads le concedieron Wadi Shelif; su hijo Abd al-Rahman, nacido de una princesa Makkhukh y que reunió a las tribus Maghrawa bajo el favor de los Almohads; sus hijos Mandil y Tuhaym; y al-Abbas ibn Mandil, que disputó Tlemcen con los Yaghmurasanids y Abd al-Wadids hasta que las fitnas Marinid extinguieron el estado."
  fr: "L'émirat des Awlad Mandil de Maghrawa, situé dans le Wadi Shelif et les marches du Moyen Maghreb, rétablit la royauté de son peuple après la chute des Khazirides. Ses descendants étaient Abd al-Samad ibn Muhammad ibn Khazrun, issu de la lignée des Khazrunides de Tripoli, qui s'enfuit chez les Aures puis chez les Zawawa, avant de s'unir par mariage aux Maghrawa du Wadi Shelif. Sa lignée fut appelée Banu Muhammad puis Khazriyya: Abu Nas le pieux, qui reçut le Wadi Shelif des Almohades; son fils Abd al-Rahman, né d'une princesse de Makkhukh, rassembla les tribus Maghrawa sous la faveur des Almohades; ses fils Mandil et Tuhaym; et al-Abbas ibn Mandil, qui lutta contre les Yaghmurasanides et les Abd al-Wadids à Tlemcen jusqu'à ce que les fitnas mérinides anéantissent l'État."
  ur: "وادی شیلف میں مغراوہ کے اوولاد منڈیل کی امارت اور درمیانی مغرب مارچ؛ انہوں نے خضریوں کے زوال کے بعد اپنی قوم کی بادشاہت کو بحال کیا، طرابلس خزرونیوں کے عبد الصمد بن محمد بن خزرون سے نزول کیا جو اوریس کی طرف بھاگے پھر ذواوا نے پھر شیلف مغراوہ سے شادی کی- ان کا سلسلہ بنو محمد پھر خضریہ کہلاتا تھا: ابو ناس متقی، الشیخ المعروف شیف المعروف اس کا بیٹا عبدالرحمٰن، ایک مخوخ شہزادی سے پیدا ہوا اور الموحد کے حق میں مغراوہ قبائل کو جمع کرنا۔ اس کے بیٹے مندل اور طہیم؛ اور العباس ابن مندل، جس نے یغموراسانیوں اور عبد الودیدوں کے ساتھ تلمسن کا مقابلہ کیا یہاں تک کہ مرینی فتنوں نے ریاست کو ختم کر دیا۔"
  tr: "Chlef Vadisi ve merkezi Magrip bölgelerindeki Mağrava Awlad Mandil Emirliği; Hazarların yok oluşundan sonra krallığı halklarına geri verdiler. Kökenleri, Trablus kralları olan Banu Hazrun'dan biri olan Abdül-Samad ibn Muhammed bin Hazrun'dur; önce Aurès Dağı'na, sonra Zawawa'ya ve ardından Chlef'teki Maghrawa kalıntılarına kaçtı ve onlarla evlendi. Oğlu şu şekilde tanındı: Banu Muhammed ve ardından Hazri olarak görev yaptı. Bunlar arasında, Almohadlar tarafından Wadi Chlef'e verilen dindar bir ibadet eden Abu Nas da vardı. Oğlu Abd al-Rahman, soyundan büyümüş, Maghrawa kabileleri tarafından yönetilmiş ve Almohad devletinde öncüydü. Oğulları Mandil ve Tahim'di ve Abbas ibn Mandil, Tlemcen üzerinde Banu Yaghmurasan ve Banu Abd al-Wad'a karşı hüküm sürdü ve savaştı; ta ki devletleri Marinid çatışmalarıyla yok edilene kadar."
  id: "Emirat Awlad Mandil Maghrawa di Lembah Chlef dan wilayah tengah Maghreb; mereka mengembalikan kerajaan kepada rakyatnya setelah punahnya Khazar. Asal-usul mereka adalah Abd al-Samad ibn Muhammad ibn Khazrun, salah satu Banu Khazrun, raja Tripoli, yang melarikan diri ke Gunung Aurès, kemudian ke Zawawa, dan kemudian ke sisa-sisa Maghrawa di Chlef, di mana ia menikah silang dengan mereka. Putranya dikenal sebagai Banu Muhammad dan kemudian sebagai Khazri. Di antara mereka adalah Abu Nas, pemuja taat yang diberikan oleh Almohad kepada Wadi Chlef. Putranya Abd al-Rahman, yang tumbuh berdasarkan garis keturunan dan diperintah oleh suku Maghrawa serta menjadi pelopor di negara bagian Almohad. Putra-putranya adalah Mandil dan Tahim, dan Abbas ibn Mandil memerintah dan berperang melawan Banu Yaghmurasan dan Banu Abd al-Wad atas Tlemcen hingga negara mereka hancur akibat konflik Marinid."
