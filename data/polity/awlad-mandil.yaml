label:
  ar: أولاد منديل
  en: Awlad Mandil
summary:
  ar: "إمارة أولاد منديل من مغراوة بوادي شلف ونواحي المغرب الأوسط؛ أعادوا لقومهم الملك بعد انقراض آل خزر، وأصلهم عبد الصمد بن محمد بن خزرون أحد بني خزرون ملوك طرابلس فرّ إلى جبل أوراس ثم إلى زواوة ثم إلى بقايا مغراوة بشلف فأصهر إليهم وعُرف ولده ببني محمد ثم بالخزرية، ومنهم أبو ناس منتحل العبادة الذي أقطعه الموحدون وادي شلف، فابنه عبد الرحمن الذي نشأ مدلاً بنسبه واعتصبت عليه قبائل مغراوة وكان في دولة الموحدين تقدمة، فابناه منديل وتهيم، وملك العباس بن منديل وجاهد بني يغمراسن وبني عبد الواد على تلمسان إلى أن فنيت دولتهم في فتن المرينيين."
  en: "The emirate of the Awlad Mandil of Maghrawa in Wadi Shelif and the Middle Maghreb marches; they restored their people's kingship after the Khazirids' fall, descending from Abd al-Samad ibn Muhammad ibn Khazrun of the Tripoli Khazrunids who fled to the Aures then Zawawa then intermarried with the Shelif Maghrawa — his line were called Banu Muhammad then the Khazriyya: Abu Nas the pious, granted Wadi Shelif by the Almohads; his son Abd al-Rahman, born of a Makkhukh princess and gathering the Maghrawa tribes under Almohad favour; his sons Mandil and Tuhaym; and al-Abbas ibn Mandil, who contested Tlemcen with the Yaghmurasanids and Abd al-Wadids until the Marinid fitnas extinguished the state."
