  tr: "Kağanlık Devleti (Karahanlılar)"
  id: "Negara Khaganat (Karakhanid)"
summary:
  ar: "دولة الترك في كاشغر وأعمال تركستان؛ كانوا ملوك تركستان وقاعدتها كاشغر وساغون وخيمو إلى أطراف الشاش، وأول من أسلم منهم سبق قراخان المتسمي عبد الملك، وكانوا يطيعون بني سامان يستنفرونهم في حروبهم إلى أن أطمعهم أبو علي بن سمجور في ملك بخارى عند اضطراب الدولة السامانية في عقد التسعين والثلاثمائة، فقصد بقراخان أعمالهم وملكها، ومات في طريقه من بخارى سنة ثلاث وثمانين وأربعمائة على قراءة النص، وكان ديناً عادلاً حسن السيرة محباً للعلماء متشيعاً سنياً، فولي أخوه ايلك خان سليمان الملقب شهير الدولة فاستولى على بخارى عاشر ذي القعدة سنة تسع وثمانين من المائة الرابعة على قراءة النص وقبض على بكثرزون وعبد الملك والمخلوع أبي الحارث منصور وانقرضت دولة بني سامان."
  en: "The Turkic state of Kashghar and the Turkestan marches — kings of Turkestan whose seat was Kashghar with Saqun and Khimo reaching the Shash lands; the first of them to accept Islam was Sabuq Qara Khan, named Abd al-Malik, and they served the Samanids as levied allies until Abu Ali ibn Simjur tempted them with Bukhara in the Samanid collapse of the 390s — Bughra Khan took the country piecemeal and died on the road from Bukhara (the text reads year 403 of the fourth century), pious, just, learned-loving and Sunni in leaning; his brother Ilig Khan Sulayman 'Shihab al-Dawla' then entered Bukhara on 10 Dhu'l-Qa'da of year 389 on the text's reading, seized Buktuzun and Abd al-Malik and the deposed Abu'l-Harith Mansur — and the Samanid state was ended."
  es: "El estado turco de Kashghar y las marcas de Turkestán — reyes de Turkestán cuya sede era Kashghar con Saqun y Khimo llegando a las tierras de Shash; el primero de ellos en aceptar el Islam fue Sabuq Qara Khan, llamado Abd al-Malik, y sirvieron a los Samánidas como aliados reclutados hasta que Abu Ali ibn Simjur los tentó con Bujará en el colapso de los Samánidas en la década de 390 — Bughra Khan tomó el país por partes y murió en el camino desde Bujará (el texto dice año 403 del siglo IV), piadoso, justo, amante de los eruditos y de inclinación sunita; su hermano Ilig Khan Sulayman 'Shihab al-Dawla' entró entonces en Bujará el 10 de Dhu'l-Qa'da del año 389 según la lectura del texto, se apoderó de Buktuzun y Abd al-Malik y del depuesto Abu'l-Harith Mansur — y el estado Samánida llegó a su fin."
  fr: "L'État turc de Kashghar et les marches du Turkestan — les rois du Turkestan dont le siège était Kashghar, Saqun et Khimo atteignant les terres de Shash; le premier d'entre eux à accepter l'islam fut Sabuq Qara Khan, nommé Abd al-Malik, et ils servirent les Samanides comme alliés levés jusqu'à ce qu'Abu Ali ibn Simjur les tente avec Boukhara lors de l'effondrement samanide des années 390 — Bughra Khan prit le pays morceau par morceau et mourut sur la route de Boukhara (le texte indique l'an 403 du IVe siècle), pieux, juste, érudit et sunnite; Son frère Ilig Khan Sulayman 'Shihab al-Dawla' entra alors à Boukhara le 10 Dhu'l-Qa'da de l'an 389, selon la lecture du texte, s'empara de Buktuzun et d'Abd al-Malik et du déchu Abu'l-Harith Mansur — et l'État samanide prit fin."
  ur: "ترکستان کی ریاست کاشغر اور ترکستان مارچ - ترکستان کے بادشاہ جن کی نشست کاشغر تھی ساقون اور خیمو کے ساتھ شاش سرزمین تک پہنچتے تھے۔ ان میں سب سے پہلے اسلام قبول کرنے والا صبوق قرہ خان تھا، جس کا نام عبد الملک تھا، اور انہوں نے سامانیوں کی بطور محصول حلیف خدمت کی یہاں تک کہ ابو علی ابن سمجور نے 390 کی دہائی کے سامانی سقوط میں انہیں بخارا کے ساتھ آزمایا - بغرا خان نے ملک کو ٹکڑے ٹکڑے کر دیا اور بخارا سے سڑک پر مر گیا ⁦(4 ویں صدی، 4 ویں صدی، 4 ویں صدی، 2018)⁩ اور سنی جھکاؤ میں؛ اس کے بھائی الیگ خان سلیمان 'شہاب الدولہ' پھر 10 ذی القعدہ 389 کو بخارا میں داخل ہوئے اور بکتزون اور عبد الملک اور معزول ابوالحارث منصور کو پکڑ لیا - اور سامانی ریاست کا خاتمہ ہوا۔"
  tr: "Kaşgar ve Türkistan topraklarındaki Türk devleti, Türkistan'ın krallarıydı; merkezi Kaşgar, Sagun ve Şimu Şehri'nin kıyısındaydı. Aralarında İslam'a ilk geçen Abdül-Malik'ti. Samanilere itaat edip savaşlarında seferber ettiler, ta ki 390'larda Samani devletinin kargaşasında Ebu Ali bin Samjur onları Buhara'nın yönetimiyle ayartana kadar. Karahan onların yönetimini ve egemenliğini istedi. Yolda öldü Buhara, metni okuduktan sonra 483 Hicri yılında. Adil ve terbiyeli bir dindi, alimleri severdi ve Sünni bir Şiiydi. Kardeşi İlak Han Süleyman, lakaplı Shahir al-Dawla, 89 Hicri yılının Zulüd-Kı'dah'ının onuncusunda Buhara'yı ele geçirdi, metnin okunmasını ele geçirdi, Bakatharzon, Abdülmalik ve tahttan indirilen Ebu el-Haris Mansur'u ele geçirdi ve Beni Saman devleti yok oldu."
  id: "Negara Turkik di Kashgar dan wilayah Turkestan adalah raja-raja Turkestan, dengan markasnya Kashgar, Sagun, dan Khimu di tepi Sungai Shash. Yang pertama masuk Islam di antara mereka adalah Qarakhan bernama Abd al-Malik. Mereka mematuhi Samanid dan memobilisasi mereka dalam perang sampai Abu Ali ibn Samjur menggoda mereka untuk memerintah Bukhara selama gejolak negara Samanid pada tahun 390-an. Qarakhan menginginkan kekuasaan dan pemerintahan mereka. Ia meninggal dalam perjalanan dari Bukhara pada tahun 483 H, setelah membaca teksnya. Ia adalah agama yang adil dan beradab, menyukai para ulama, dan seorang Syiah Sunni. Saudaranya Ilak Khan Suleiman, yang dijuluki Shahir al-Dawla, mengambil alih Bukhara pada tanggal sepuluh Dhu al-Qi'dah tahun 89 H, merebut pembacaan teks, menawan Bakatharzon, Abd al-Malik, dan Abu al-Harith Mansur yang digulingkan, sehingga negara bagian Bani Saman punah."
