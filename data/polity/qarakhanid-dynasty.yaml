label:
  ar: الدولة الخاقانية (القراخانية)
  en: Qarakhanid dynasty
summary:
  ar: "دولة الترك في كاشغر وأعمال تركستان؛ كانوا ملوك تركستان وقاعدتها كاشغر وساغون وخيمو إلى أطراف الشاش، وأول من أسلم منهم سبق قراخان المتسمي عبد الملك، وكانوا يطيعون بني سامان يستنفرونهم في حروبهم إلى أن أطمعهم أبو علي بن سمجور في ملك بخارى عند اضطراب الدولة السامانية في عقد التسعين والثلاثمائة، فقصد بقراخان أعمالهم وملكها، ومات في طريقه من بخارى سنة ثلاث وثمانين وأربعمائة على قراءة النص، وكان ديناً عادلاً حسن السيرة محباً للعلماء متشيعاً سنياً، فولي أخوه ايلك خان سليمان الملقب شهير الدولة فاستولى على بخارى عاشر ذي القعدة سنة تسع وثمانين من المائة الرابعة على قراءة النص وقبض على بكثرزون وعبد الملك والمخلوع أبي الحارث منصور وانقرضت دولة بني سامان."
  en: "The Turkic state of Kashghar and the Turkestan marches — kings of Turkestan whose seat was Kashghar with Saqun and Khimo reaching the Shash lands; the first of them to accept Islam was Sabuq Qara Khan, named Abd al-Malik, and they served the Samanids as levied allies until Abu Ali ibn Simjur tempted them with Bukhara in the Samanid collapse of the 390s — Bughra Khan took the country piecemeal and died on the road from Bukhara (the text reads year 403 of the fourth century), pious, just, learned-loving and Sunni in leaning; his brother Ilig Khan Sulayman 'Shihab al-Dawla' then entered Bukhara on 10 Dhu'l-Qa'da of year 389 on the text's reading, seized Buktuzun and Abd al-Malik and the deposed Abu'l-Harith Mansur — and the Samanid state was ended."
