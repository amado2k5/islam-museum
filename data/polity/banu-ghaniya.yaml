summary:
  ar: "بنو غانية من بقية المرابطين؛ بيت مسوفة من الملثمين، كان يحيى المسوفي من رجالات المرابطين وشجعانهم مقدماً عند يوسف بن تاشفين، فقتل وترك من امرأة اسمها غانية ولدين محمداً ويحيى نشآ في ظل يوسف بن تاشفين، فعقد علي بن يوسف ليحيى على غرب الأندلس وأنزله قرطبة وللمحمد على الجزائر الشرقية ميورقة ومنورقة ويابسة سنة 520هـ، واستبد بالأمر إسحاق بن محمد إلى أن هلك سنة 580هـ مخلفاً ثمانية من الولد، ثم نقل ابنه علي بن محمد إلى إفريقية فطرق بجاية على حين غفلة في صفر 581هـ وافتتح الجزائر ومازونة ومليانة وحاصر القلعة وملك قفصة ونازل طرابلس، وجاهده الموحدون براً وبحراً في حروب مشهورة إلى انقراض أمرهم."
  en: "Banu Ghaniya, remnant of the Almoravids; a Massufa house of the veiled tribes — Yahya al-Massufi their champion honoured by Yusuf ibn Tashfin, slain leaving by a wife named Ghaniya two sons Muhammad and Yahya raised in the sultan's care; Ali ibn Yusuf granted Yahya the western Andalus seated at Cordoba and Muhammad the eastern isles Majorca, Menorca and Ibiza in 520, and Ishaq ibn Muhammad held all until his death in 580 leaving eight sons — then his son Ali ibn Muhammad carried the house to Ifriqiya, striking Béjaïa unawares in Safar 581, taking Algiers, Mazuna and Milyana, besieging the Qal'a, ruling Qafsa and investing Tripoli, fighting the Almohads by land and sea in famous wars until their house was extinguished."
  es: "Banu Ghaniya, remanente de los almorávides; una casa Massufa de las tribus veladas: Yahya al-Massufi, su campeón, honrado por Yusuf ibn Tashfin, fue asesinado dejando con una esposa llamada Ghaniya dos hijos, Muhammad y Yahya, criados al cuidado del sultán; Ali ibn Yusuf concedió a Yahya el Andalus occidental, con sede en Córdoba, y a Muhammad las islas orientales de Mallorca, Menorca e Ibiza en 520, e Ishaq ibn Muhammad lo mantuvo todo hasta su muerte en 580, dejando ocho hijos; luego su hijo Ali ibn Muhammad llevó la casa a Ifriqiya, atacando a Béjaïa por sorpresa en Safar 581, tomando Argel, Mazuna y Milyana, asediando Qal'a, gobernando Qafsa e invadiendo Trípoli, luchando contra los almohades por tierra y mar en famosas guerras hasta que su casa se extinguió."
  fr: "Les Banu Ghaniya, descendants des Almoravides, étaient une lignée Massufa appartenant aux tribus voilées. Leur champion, Yahya al-Massufi, fut honoré par Yusuf ibn Tashfin, qui le tua, laissant de son épouse, également nommée Ghaniya, deux fils, Muhammad et Yahya, élevés sous la tutelle du sultan. En 520, Ali ibn Yusuf octroya à Yahya l'Andalousie occidentale, avec Cordoue comme siège, et à Muhammad les îles orientales de Majorque, Minorque et Ibiza. Ishaq ibn Muhammad conserva ces territoires jusqu'à sa mort en 580, laissant huit fils. Son fils, Ali ibn Muhammad, porta ensuite la lignée à Ifriqiya, surprenant Béjaïa en Safar 581, prenant Alger, Mazuna et Milyana, assiégeant Qal'a, régnant sur Qafsa et investissant Tripoli. Il combattit les Almohades sur terre et sur mer lors de guerres célèbres jusqu'à l'extinction de leur lignée."
  ur: "بنو ثنیہ، الموراوڈز کی باقیات؛ پردہ دار قبائل کا ایک مصوفہ گھر — یحییٰ المصوفی ان کے چیمپیئن کو یوسف بن تاشفین نے اعزاز دیا، غنیہ نامی بیوی کے ہاتھوں قتل ہوئے دو بیٹے محمد اور یحییٰ نے سلطان کی دیکھ بھال میں پرورش پائی۔ علی ابن یوسف نے یحییٰ کو مغربی اندلس کو قرطبہ اور محمد کو مشرقی جزائر میجرکا، مینورکا اور ابیزا 520 میں بٹھا دیا، اور اسحاق ابن محمد نے 580 میں اپنی موت تک آٹھ بیٹے چھوڑے، ان سب کو سنبھالے رکھا - پھر اس کے بیٹے علی ابن محمد نے اس گھر کو عفریقیہ تک پہنچایا، البیغفارس میں حملہ کیا۔ مازونہ اور ملیانہ نے قلعہ کا محاصرہ کیا، قفس پر حکومت کی اور طرابلس کی سرمایہ کاری کی، مشہور جنگوں میں المحدث سے زمینی اور سمندری راستے سے لڑتے رہے یہاں تک کہ ان کا گھر بجھ گیا۔"
  tr: "Almoravidlerin geri kalanından Banu Ghaniyah; maskeli adamlardan bir Masoufa ailesi. Yahya al-Masufi Almoravidlerin adamlarından ve cesur adamlarından biriydi ve Yusuf ibn Tashfin'in öncülerinden biriydi. Ghaniyah adında bir kadın, iki oğlu Muhammed ve Yahya tarafından öldürüldü ve geride bırakıldı; bu oğullar Yusuf ibn Tashfin'in yanında büyüdü. Ali ibn Yusuf, Yahya'yı batı Endülüs'e evlendirdi ve onu Cordoba'ya yerleştirdi, Muhammed ise doğu Cezayir'i Mallorca'da yönetti. Minorca ve 520 Hicri'de Yasa'ya gitti. İshaq ibn Muhammed, 580 Hicri'de ölene kadar bölgeyi yönetti ve geride sekiz çocuk bıraktı. Daha sonra oğlu Ali ibn Muhammed, Ifriqiya'ya nakledildi; burada beklenmedik şekilde 581 Hicri Seferi'nde Bejaia'ya ulaştı, Cezayir, Mazuna ve Miliana'yı fethetti, Gafsa kralını kuşattı ve Trablus'a yerleşti. Almohadlar, yönetimleri çökene kadar kara ve deniz yoluyla ünlü savaşlarda onunla savaştı."
  id: "Banu Ghaniyah dari sisa Almoravid; sebuah keluarga Masoufa dari orang-orang bertopeng. Yahya al-Masufi adalah salah satu pria dan pemberani Almoravid serta menjadi pelopor di bawah Yusuf ibn Tashfin. Ia dibunuh dan ditinggalkan oleh seorang wanita bernama Ghaniyah, dua putra: Muhammad dan Yahya, yang tumbuh di bawah Yusuf ibn Tashfin. Ali ibn Yusuf menikahkan Yahya ke Andalusia barat dan menetapkannya di Cordoba, sementara Muhammad memerintah Aljazair timur di Mallorca, Minorca, dan Yasa pada tahun 520 H. Ishaq ibn Muhammad memerintah wilayah tersebut hingga wafat pada tahun 580 H, meninggalkan delapan anak. Kemudian putranya Ali ibn Muhammad dipindahkan ke Ifriqiya, di mana ia tiba-tiba tiba di Bejaia pada Safar tahun 581 H, menaklukkan Aljir, Mazouna, dan Miliana, mengepung benteng, raja Gafsa, dan menetap di Tripoli. Bangsa Almohad melawannya melalui darat dan laut dalam perang terkenal hingga kekuasaan mereka runtuh."
