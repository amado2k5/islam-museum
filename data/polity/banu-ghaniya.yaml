label:
  ar: بنو غانية
  en: Banu Ghaniya
summary:
  ar: "بنو غانية من بقية المرابطين؛ بيت مسوفة من الملثمين، كان يحيى المسوفي من رجالات المرابطين وشجعانهم مقدماً عند يوسف بن تاشفين، فقتل وترك من امرأة اسمها غانية ولدين محمداً ويحيى نشآ في ظل يوسف بن تاشفين، فعقد علي بن يوسف ليحيى على غرب الأندلس وأنزله قرطبة وللمحمد على الجزائر الشرقية ميورقة ومنورقة ويابسة سنة 520هـ، واستبد بالأمر إسحاق بن محمد إلى أن هلك سنة 580هـ مخلفاً ثمانية من الولد، ثم نقل ابنه علي بن محمد إلى إفريقية فطرق بجاية على حين غفلة في صفر 581هـ وافتتح الجزائر ومازونة ومليانة وحاصر القلعة وملك قفصة ونازل طرابلس، وجاهده الموحدون براً وبحراً في حروب مشهورة إلى انقراض أمرهم."
  en: "Banu Ghaniya, remnant of the Almoravids; a Massufa house of the veiled tribes — Yahya al-Massufi their champion honoured by Yusuf ibn Tashfin, slain leaving by a wife named Ghaniya two sons Muhammad and Yahya raised in the sultan's care; Ali ibn Yusuf granted Yahya the western Andalus seated at Cordoba and Muhammad the eastern isles Majorca, Menorca and Ibiza in 520, and Ishaq ibn Muhammad held all until his death in 580 leaving eight sons — then his son Ali ibn Muhammad carried the house to Ifriqiya, striking Béjaïa unawares in Safar 581, taking Algiers, Mazuna and Milyana, besieging the Qal'a, ruling Qafsa and investing Tripoli, fighting the Almohads by land and sea in famous wars until their house was extinguished."
