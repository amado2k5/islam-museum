summary:
  ar: "بطاقة أولية للدولة الخلجية، ثاني سلالات سلطنة دلهي التي بلغت في عهد علاء الدين خلجي أقصى اتساعها من ١٢٩٠ إلى ١٣٢٠م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Khalji dynasty, the second house of the Delhi Sultanate which under Ala al-Din Khalji reached its greatest extent from 1290 to 1320; its sources are not yet checked on the page."
  es: "Boceto de ficha de la dinastía Khalji, la segunda casa del Sultanato de Delhi, que bajo Ala al-Din Khalji alcanzó su máxima extensión entre 1290 y 1320; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la dynastie Khalji, la deuxième maison du sultanat de Delhi qui, sous Ala al-Din Khalji, atteignit son apogée de 1290 à 1320; ses sources ne sont pas encore vérifiées sur la page."
  ur: "خلجی خاندان کے لیے ڈرافٹ کارڈ، دہلی سلطنت کا دوسرا گھر جو علاء الدین خلجی کے ماتحت 1290 سے 1320 تک اپنی سب سے بڑی حد تک پہنچ گیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Delhi Sultanlığı'nın ikinci hanedanı olan Halici devletinin ön kartı; en geniş yayılımını 1290-1320 yılları arasında Alauddin Halci döneminde yaşamıştır; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal negara Khaliji, dinasti kedua Kesultanan Delhi, yang mencapai jangkauan terbesarnya selama masa pemerintahan Alauddin Khalji dari tahun 1290 hingga 1320 M; sumber-sumbernya di halaman tersebut belum ditinjau."
