kind: caliphate
label:
  ar: الخلافة العباسية في القاهرة
  en: Abbasid Caliphate of Cairo
  ur: "قاہرہ کی عباسی خلافت"
  es: "Califato abasí de El Cairo"
  fr: "Califat abbasside du Caire"
  tr: "Kahire'deki Abbasi Halifeliği"
  id: "Kekhalifahan Abbasiyah di Kairo"
summary:
  ar: خط الخلفاء العباسيين في القاهرة من 1261م إلى 1517م تحت ظل سلطنة المماليك؛ خلفاء بلا سلطان فعلي، يليهم السلطان في التعيين والعزل.
  en: "The Abbasid caliphal line re-established at Cairo under Mamluk protection, 1261–1517 CE: caliphs without temporal power, installed and deposed at the sultan's hand, until Selim I ended the line after conquering Egypt."
  ur: "مملوکوں کی سرپرستی میں قاہرہ میں بحال عباسی خلافت، 1261ء تا 1517ء؛ بلا حقیقی اختیار خلفاء جنہیں سلاطین مقرر اور معزول کرتے، 1517ء میں سلِّم اول کے مصر فتح کرنے پر ختم ہوئی۔"
  es: "La línea califal abasí se restableció en El Cairo bajo la protección mameluca, entre 1261 y 1517 d. C.: califas sin poder temporal, instalados y depuestos por orden del sultán, hasta que Selim I puso fin a la línea tras la conquista de Egipto."
  fr: "La lignée califale abbasside rétablie au Caire sous la protection des Mamelouks, 1261-1517 apr. J.-C.: des califes sans pouvoir temporel, installés et déposés par le sultan, jusqu'à ce que Selim Ier mette fin à la lignée après avoir conquis l'Égypte."
  tr: "1261'den 1517'ye kadar Kahire'deki Abbasi Halifeleri, Memlük Sultanlığı döneminde; gerçek yetki olmadan halifeler, atamalarda ve görevden almalarda sultan takip etti."
  id: "Khalifah Abbasiyah di Kairo dari tahun 1261 M hingga 1517 M di bawah Kesultanan Mamluk; khalifah tanpa otoritas nyata, diikuti oleh sultan dalam pengangkatan dan pemberhentian."
