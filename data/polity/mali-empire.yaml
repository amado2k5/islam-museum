  ar: مملكة مالي
  en: Mali Empire
summary:
  ar: أعظم ممالك السودان الغربي الإسلامية، أسسها ماري جاطة بعد أن انتزع الملك من أيدي صوصو، وبلغت أوجها في القرن الثامن الهجري عندما امتد ملكها من منابع النيجر إلى المحيط، وحاضرة ملكها «بلد بني» (نياني) على الزرع والعمارة.
  en: The greatest Islamic kingdom of the western Sudan, founded by Mari Jata after wresting power from the Susu, reaching its height in the eighth century AH when its rule stretched from the Niger headlands to the ocean approaches.
