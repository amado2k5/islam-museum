id: polity/mali-empire
class: polity
kind: dynasty
label:
  ar: مملكة مالي
  en: Mali Empire
  es: "Imperio de Malí"
  fr: "Empire du Mali"
  ur: "مالی سلطنت"
  tr: "Mali Krallığı"
  id: "Kerajaan Mali"
summary:
  ar: أعظم ممالك السودان الغربي الإسلامية، أسسها ماري جاطة بعد أن انتزع الملك من أيدي صوصو، وبلغت أوجها في القرن الثامن الهجري عندما امتد ملكها من منابع النيجر إلى المحيط، وحاضرة ملكها «بلد بني» ⁦(نياني)⁩ على الزرع والعمارة.
  en: The greatest Islamic kingdom of the western Sudan, founded by Mari Jata after wresting power from the Susu, reaching its height in the eighth century AH when its rule stretched from the Niger headlands to the ocean approaches.
  es: "El mayor reino islámico del Sudán occidental, fundado por Mari Jata tras arrebatar el poder a los Susu, alcanzó su apogeo en el siglo VIII de la Hégira, cuando su dominio se extendía desde las cabeceras del Níger hasta las costas oceánicas."
  fr: "Le plus grand royaume islamique du Soudan occidental, fondé par Mari Jata après avoir arraché le pouvoir aux Susu, atteignit son apogée au VIIIe siècle de l'Hégire lorsque son règne s'étendait des promontoires du Niger jusqu'aux abords de l'océan."
  ur: "مغربی سوڈان کی سب سے بڑی اسلامی مملکت، جس کی بنیاد ماری جاٹا نے سوسو سے اقتدار چھیننے کے بعد رکھی تھی، آٹھویں صدی ہجری میں اپنے عروج کو پہنچی جب اس کی حکمرانی نائیجر کی سرزمین سے لے کر سمندر تک پھیلی ہوئی تھی۔"
  tr: "Batı Sudan'ın en büyük İslam krallığı, Mari Jata tarafından Sosu'dan alındıktan sonra kurulmuş, zirvesine sekizinci yüzyılda ulaşmış, krallığı Nijer kaynaklarından okyanusa kadar uzanmış ve başkenti tarım ve mimari olarak 'Bani kasabası' (Niani) olmuştur."
  id: "Kerajaan Islam terbesar di Sudan barat didirikan oleh Mari Jata setelah kerajaan direbut dari Sosu, mencapai puncaknya pada abad kedelapan H ketika kerajaannya meluas dari sumber Niger hingga lautan, dan ibu kotanya adalah 'kota Bani' (Niani) dalam bidang pertanian dan arsitektur."
