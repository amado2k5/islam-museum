  ur: "والاشما خاندان کے لیے ڈرافٹ کارڈ، وہ مسلم گھر جس نے ہارن آف افریقہ میں افات اور عادل کی سلطنتیں قائم کیں۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Efat Sultanlığı'nı kuran ve ardından Afrika Boynuzu'nda değiştiren Müslüman aile Wollshma hanedanı için ön hazırlık kartı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk dinasti Wollshma, keluarga Muslim yang mendirikan Kesultanan Efat dan kemudian diubah di Tanduk Afrika; sumber-sumbernya di halaman tersebut belum ditinjau."
