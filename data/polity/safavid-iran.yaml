label:
  ar: الدولة الصفوية
  en: Safavid Iran
summary:
  ar: "الدولة الصفوية بإيران، أسسها الشاه إسماعيل من ذرية الشيخ صفي الدين الأردبيلي؛ يصفها الصلابي بأنها سعت لبسط المذهب الشيعي في العراق وآسيا الصغرى مما دفع الدولة العثمانية نحو المشرق، وأن إسماعيل هُزم بجالديران سنة 920هـ/1514م وفقد تبريز، وأن تحالفه اللاحق مع البرتغاليين أقرّ سيطرتهم على هرمز {cite:dawlat-uthmaniyya-salabi p. 177-184}. قامت سنة 1501م وانتهت سنة 1736م."
  en: "Safavid Iran, founded by Shah Ismail of Shaykh Safi al-Din al-Ardabili's line; al-Salabi presents its drive to spread Shi'ism in Iraq and Asia Minor as the spur that turned the Ottomans east, records Ismail's crushing defeat at Chaldiran in 920/1514 with the loss of Tabriz, and his later league with the Portuguese confirming their hold on Hormuz {cite:dawlat-uthmaniyya-salabi p. 177-184}. Established 1501, ended 1736."
