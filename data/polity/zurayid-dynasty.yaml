label:
  ar: بنو الزريع بعدن
  en: Zurayid dynasty of Aden
summary:
  ar: "بنو الزريع بعدن من دعاة العبيديين باليمن؛ من عشيرة جسم بن يام من همدان أقرب عشائر الصليحي إليه، ولاها أحمد المكرم بن علي الصليحي، ثم انقسموا فغلب بنو الزريع بن العباس بن المكرم بعد حروب عظيمة، وأول مجتمع له الملك منهم الداعي بن أبي السعود بن الزريع استولى على عدن سنة 533هـ ومات بعد فتحها بسبعة أشهر، فولي ابنه الأغر ثم استبد مولاهم محمد بن سبا المنعوت الداعي المعظم المكنى بسيف أمير المؤمنين واشترى حصن ذي جبلة دار ملك الصليحيين، وآخر ملوكهم ياسر بن بلال كثير العطية للشعراء مدحه ابن قلاقس، حتى ملك سيف الدولة أخو صلاح الدين عدن وقبض عليه فانقطعت دولتهم، وكانوا قد اختطفوا مدينة الحديدة قرب عدن."
  en: "Banu al-Zuray' of Aden, the Ubaydi da'is of Yemen; of the Hamdan clan of Jasm ibn Yam nearest to al-Sulayhi, seated at Aden by Ahmad al-Mukarram — then splitting into factions, the Banu Zuray' ibn al-Abbas prevailed after great wars, their first king al-Da'i ibn Abi al-Su'ud taking Aden in 533 and dying seven months after the conquest; his son al-Agharr, then their mawla Muhammad ibn Saba', styled al-Da'i al-Mu'azzam Sayf Amir al-Mu'minin, who bought Dhi Jibla castle itself; last of their kings the poet-munificent Yasir ibn Bilal, praised by Ibn Qalaqis, until Sayf al-Dawla Saladin's brother took Aden and ended their state — they who had founded al-Hudayda near Aden."
