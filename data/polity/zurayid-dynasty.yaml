label:
  ar: بنو الزريع بعدن
  en: Zurayid dynasty of Aden
  es: "Dinastía Zurayid de Adén"
  fr: "Dynastie zurayide d'Aden"
  ur: "عدن کی زریید خاندان"
  tr: "Aden'deki Banu Al-Zarea"
  id: "Banu Al-Zarea di Aden"
summary:
  ar: "بنو الزريع بعدن من دعاة العبيديين باليمن؛ من عشيرة جسم بن يام من همدان أقرب عشائر الصليحي إليه، ولاها أحمد المكرم بن علي الصليحي، ثم انقسموا فغلب بنو الزريع بن العباس بن المكرم بعد حروب عظيمة، وأول مجتمع له الملك منهم الداعي بن أبي السعود بن الزريع استولى على عدن سنة 533هـ ومات بعد فتحها بسبعة أشهر، فولي ابنه الأغر ثم استبد مولاهم محمد بن سبا المنعوت الداعي المعظم المكنى بسيف أمير المؤمنين واشترى حصن ذي جبلة دار ملك الصليحيين، وآخر ملوكهم ياسر بن بلال كثير العطية للشعراء مدحه ابن قلاقس، حتى ملك سيف الدولة أخو صلاح الدين عدن وقبض عليه فانقطعت دولتهم، وكانوا قد اختطفوا مدينة الحديدة قرب عدن."
  en: "Banu al-Zuray' of Aden, the Ubaydi da'is of Yemen; of the Hamdan clan of Jasm ibn Yam nearest to al-Sulayhi, seated at Aden by Ahmad al-Mukarram — then splitting into factions, the Banu Zuray' ibn al-Abbas prevailed after great wars, their first king al-Da'i ibn Abi al-Su'ud taking Aden in 533 and dying seven months after the conquest; his son al-Agharr, then their mawla Muhammad ibn Saba', styled al-Da'i al-Mu'azzam Sayf Amir al-Mu'minin, who bought Dhi Jibla castle itself; last of their kings the poet-munificent Yasir ibn Bilal, praised by Ibn Qalaqis, until Sayf al-Dawla Saladin's brother took Aden and ended their state — they who had founded al-Hudayda near Aden."
  es: "Banu al-Zuray' de Adén, los da'is Ubaydi de Yemen; del clan Hamdan de Jasm ibn Yam más cercano a al-Sulayhi, con sede en Adén por Ahmad al-Mukarram — luego dividiéndose en facciones, los Banu Zuray' ibn al-Abbas prevalecieron después de grandes guerras, su primer rey al-Da'i ibn Abi al-Su'ud tomó Adén en 533 y murió siete meses después de la conquista; su hijo al-Agharr, luego su mawla Muhammad ibn Saba', llamado al-Da'i al-Mu'azzam Sayf Amir al-Mu'minin, quien compró el castillo de Dhi Jibla; el último de sus reyes el poeta-munífico Yasir ibn Bilal, elogiado por Ibn Qalaqis, hasta que Sayf al-Dawla, hermano de Saladino, tomó Adén y puso fin a su estado — ellos que habían fundado al-Hudayda cerca de Adén."
  fr: "Les Banu al-Zuray' d'Aden, les da'is Ubaydi du Yémen; du clan Hamdan de Jasm ibn Yam, le plus proche d'al-Sulayhi, établi à Aden par Ahmad al-Mukarram — se divisant ensuite en factions, les Banu Zuray' ibn al-Abbas l'emportèrent après de grandes guerres, leur premier roi al-Da'i ibn Abi al-Su'ud prenant Aden en 533 et mourant sept mois après la conquête; son fils al-Agharr, puis leur mawla Muhammad ibn Saba', appelé al-Da'i al-Mu'azzam Sayf Amir al-Mu'minin, qui acheta le château de Dhi Jibla lui-même; le dernier de leurs rois fut le poète et bienfaisant Yasir ibn Bilal, loué par Ibn Qalaqis, jusqu'à ce que le frère de Sayf al-Dawla Saladin prenne Aden et mette fin à leur État — ceux-là mêmes qui avaient fondé al-Hudayda près d'Aden."
  ur: "عدن کا بنو الزرعی، یمن کا عبیدی داع؛ السلیحی کے قریب جاسم بن یمان کے قبیلہ ہمدان کا، احمد المکرم کے ذریعہ عدن میں بیٹھا تھا - پھر دھڑوں میں بٹ گیا، بنو زری ابن العباس عظیم جنگوں کے بعد غالب آیا، ان کے پہلے بادشاہ الداعی ابن ابی السعود نے عدن پر فتح حاصل کی اور 53 میں سات ماہ بعد فتح حاصل کی۔ ان کے بیٹے الاثر، پھر ان کے مولا محمد ابن سبا نے الدعاء المعظم سیف امیر المومنین کو طرز بنایا، جس نے ذی جبلہ قلعہ خود خریدا تھا۔ ان کے بادشاہوں میں سے آخری شاعر یاسر بن بلال تھے، جن کی ابن قلقیس نے تعریف کی، یہاں تک کہ سیف الدولہ صلاح الدین کے بھائی نے عدن پر قبضہ کر لیا اور ان کی ریاست کا خاتمہ کر دیا - جنہوں نے عدن کے قریب الحدیدہ کی بنیاد رکھی تھی۔"
  tr: "Aden'deki Banu Al-Zuray', Yemen'deki Ubaydilerin misyonerleri arasındaydı; Hamdan'dan Juss bin Yam kabilesinden, El-Süleyhi'ye en yakın kabiledendi. Onlara Ahmed el-Mukarram bin Ali El-Süleyhi liderlik etti. Sonra ayrıldılar ve büyük savaşlardan sonra Banu El-Zuray' bin El-Abbas bin El-Mükarram galip geldi. Aralarında kral olan ilk grup, 533 Hicri'de Aden'i ele geçiren ve yedi ay sonra ölen El-Da'i bin Abi Al-Saud bin El-Zuray' idi Oğlu Al-Aghar onun halefi olarak atandı, ardından müttefikleri Muhammed bin Saba, Büyük Da'i olarak bilinen Saif Amir al-Mu'minin, Süleyhid kralının evi olan Dhi Jiblah kalesini devraldı ve satın aldı. Son kralları Yaser bin Bilal, şairlere büyük bir yetenekle sahipti ve İbn Kalikis tarafından övüldü. Hatta Salah al-Din'in kardeşi Saif Al-Dawla bile Aden'i yönetti ve esir alınarak devletleri sona erdi. Aden yakınlarındaki Al-Hudaydah şehrini kaçırmışlardı."
  id: "Banu Al-Zuray' di Aden termasuk di antara misionaris Ubaydi di Yaman; dari suku Juss bin Yam dari Hamdan, suku terdekat dengan Al-Sulayhi. Mereka dipimpin oleh Ahmad Al-Mukarram bin Ali Al-Sulayhi. Kemudian mereka berpecah, dan bin Al-Abbas bin Al-Mukarram Banu Al-Zuray menang setelah perang besar. Kelompok pertama yang memiliki raja di antara mereka adalah Al-Da'i bin Abi Al-Saud bin Al-Zuray', yang merebut Aden pada tahun 533 H dan meninggal tujuh tahun beberapa bulan setelah penaklukannya. Putranya Al-Aghar diangkat sebagai penerusnya, kemudian klien mereka Muhammad bin Saba, yang dikenal sebagai Da'i Agung yang dikenal sebagai Saif Amir al-Mu'minin, mengambil alih dan membeli benteng Dhi Jiblah, rumah raja Sulayhid. Raja terakhir mereka, Yasser bin Bilal, sangat berbakat dalam kalangan penyair dan dipuji oleh Ibn Qalaqis. Bahkan Saif Al-Dawla, saudara Salah al-Din, memerintah Aden dan ditangkap, mengakhiri negara mereka. Mereka menculik kota Al-Hudaydah dekat Aden."
