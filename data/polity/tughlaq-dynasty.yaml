  ur: "تغلق خاندان کے لیے ڈرافٹ کارڈ، 1320 سے 1414 تک غیاث الدین تغلق کے تحت دہلی سلطنت کا تیسرا حکمران گھر؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Delhi Sultanlığı'nın üçüncü hanedanı olan Taghlaqi devletinin ön kartı Ghayath al-Din'den 1320'den 1414'e kadar kapanmıştır; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal negara Taghlaqi, dinasti ketiga Kesultanan Delhi dari Ghayath al-Din, ditutup dari tahun 1320 hingga 1414 M; sumber-sumbernya di halaman tersebut belum ditinjau."
