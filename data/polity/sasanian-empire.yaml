summary:
  en: "The Persian power rebuilt by Ardashir from 226 CE: it ruled Iraq and the Gulf, kept the Lakhmid kings of al-Hira as frontier wardens, and absorbed Yemen as a province after expelling the Abyssinians until Badhan’s conversion."
  ar: "قوة فارس التي جمع شملها أردشير منذ سنة 226م؛ حكمت العراق والخليج، وأبقت ملوك الحيرة اللخميين حُرّاساً للتخوم، وضمّت اليمن بعد إجلاء الأحباش حتى أسلم عاملها باذان."
  es: "El poder persa fue reconstruido por Ardashir a partir del año 226 d. C.: gobernó Irak y el Golfo, mantuvo a los reyes lajmíes de al-Hira como guardianes de las fronteras y absorbió Yemen como provincia tras expulsar a los abisinios hasta la conversión de Badhan."
  fr: "La puissance perse reconstruite par Ardashir à partir de 226 après J.-C.: elle régnait sur l'Irak et le Golfe, conservait les rois lakhmides d'al-Hira comme gardiens des frontières et absorbait le Yémen comme province après avoir expulsé les Abyssins jusqu'à la conversion de Badhan."
  ur: "226 عیسوی سے اردشیر کے ذریعہ فارسی طاقت کو دوبارہ بنایا گیا: اس نے عراق اور خلیج پر حکومت کی، الحیرہ کے لخمید بادشاہوں کو سرحدی محافظوں کے طور پر رکھا، اور بدہان کی تبدیلی تک حبشیوں کو بے دخل کرنے کے بعد یمن کو ایک صوبے کے طور پر جذب کیا۔"
  tr: "Ardaşir'in 226 yılından beri birleştirdiği Pers kuvvetleri, Irak ve Körfez'i yönetti, El-Hira'nın Lakhmid krallarını sınır muhafızları olarak tuttu ve Habeşlilerin sürülmesinden sonra Yemen'i ilhak etti, ta ki valisi Badhan İslam'a geçene kadar."
  id: "Pasukan Persia, yang telah disatukan Ardashir sejak 226 M, menguasai Irak dan Teluk, mempertahankan raja-raja Lakhmid Al-Hirah sebagai penjaga perbatasan, dan menganeksasi Yaman setelah pengusiran Abyssinia hingga gubernurnya Badhan memeluk Islam."
