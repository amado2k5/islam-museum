label:
  ar: الدولة المزيدية
  en: Mazyadid dynasty
summary:
  ar: "دولة بني مزيد من بني أسد ملوك الحلة بالعراق؛ كانت مخلاتهم من بغداد إلى البصرة إلى نجد، وكبيرهم أبو الحسن علي بن مزيد الذي استولى على الجزيرة الدبيسية ثم قام الأمر في حياته لابنه دبيس نور الدولة، وبلغت الدولة ذروتها في حفيده صدقة بن منصور الذي بنى الحلة ولقب ملك العرب حتى قتل في حرب السلطان محمد بن ملك شاه سنة 501هـ، وانقرض أمرهم بعد أبنائه."
  en: "The state of Banu Mazyad of Banu Asad, kings of al-Hilla in Iraq, whose range ran from Baghdad to Basra and Najd; their chief Abu al-Hasan Ali ibn Mazyad took the Dubaysi islands and in his lifetime authority passed to his son Dubays Nur al-Dawla, the state peaking under his grandson Sadaqa ibn Mansur — builder of al-Hilla, titled king of the Arabs — until he was killed in 501 AH fighting Sultan Muhammad ibn Malikshah, after whose sons their line faded."
