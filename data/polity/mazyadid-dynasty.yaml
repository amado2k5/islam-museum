label:
  ar: الدولة المزيدية
  en: Mazyadid dynasty
  es: "Dinastía Mazyadí"
  fr: "Dynastie mazydide"
summary:
  ar: "دولة بني مزيد من بني أسد ملوك الحلة بالعراق؛ كانت مخلاتهم من بغداد إلى البصرة إلى نجد، وكبيرهم أبو الحسن علي بن مزيد الذي استولى على الجزيرة الدبيسية ثم قام الأمر في حياته لابنه دبيس نور الدولة، وبلغت الدولة ذروتها في حفيده صدقة بن منصور الذي بنى الحلة ولقب ملك العرب حتى قتل في حرب السلطان محمد بن ملك شاه سنة 501هـ، وانقرض أمرهم بعد أبنائه."
  en: "The state of Banu Mazyad of Banu Asad, kings of al-Hilla in Iraq, whose range ran from Baghdad to Basra and Najd; their chief Abu al-Hasan Ali ibn Mazyad took the Dubaysi islands and in his lifetime authority passed to his son Dubays Nur al-Dawla, the state peaking under his grandson Sadaqa ibn Mansur — builder of al-Hilla, titled king of the Arabs — until he was killed in 501 AH fighting Sultan Muhammad ibn Malikshah, after whose sons their line faded."
  es: "El estado de Banu Mazyad de Banu Asad, reyes de al-Hilla en Irak, cuyo territorio se extendía desde Bagdad hasta Basora y Najd; su jefe Abu al-Hasan Ali ibn Mazyad tomó las islas Dubaysi y, en vida, la autoridad pasó a su hijo Dubays Nur al-Dawla, alcanzando el estado su apogeo bajo su nieto Sadaqa ibn Mansur —constructor de al-Hilla, titulado rey de los árabes— hasta que murió en el año 501 de la Hégira luchando contra el sultán Muhammad ibn Malikshah, tras cuyos hijos su linaje se extinguió."
  fr: "L'État des Banu Mazyad, descendants des Banu Asad, rois d'al-Hilla en Irak, dont le territoire s'étendait de Bagdad à Bassora et au Najd; leur chef, Abu al-Hasan Ali ibn Mazyad, s'empara des îles Dubaysi et, de son vivant, l'autorité passa à son fils Dubays Nur al-Dawla. L'État atteignit son apogée sous le règne de son petit-fils Sadaqa ibn Mansur — bâtisseur d'al-Hilla, titré roi des Arabes — jusqu'à sa mort en 501 AH lors d'un combat contre le sultan Muhammad ibn Malikshah, après quoi leur lignée s'éteignit."
