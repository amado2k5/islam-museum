summary:
  en: "The strong north-Hijazi kingdom of the sons of Nabit ibn Ismail in the traditional account, capital at Petra, which dominated the peninsula’s fringes until Rome broke it."
  ar: "الحكومة القوية لأبناء نابت بن إسماعيل في شمال الحجاز في العرض النسقي، وعاصمتها البتراء؛ دان لها من بأطراف الجزيرة حتى نقضها الرومان."
  es: "El poderoso reino del norte de Hiyaz, perteneciente a los hijos de Nabit ibn Ismail según la tradición, con capital en Petra, que dominó los confines de la península hasta que Roma lo conquistó."
  fr: "Le puissant royaume du nord du Hedjaz, celui des fils de Nabit ibn Ismail selon la tradition, avait pour capitale Pétra et dominait les confins de la péninsule jusqu'à ce que Rome le détruise."
