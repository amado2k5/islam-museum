summary:
  ar: "أسرة مغولية تدّعي النسب إلى هولاكو، برزت في أواخر القرن التاسع الهجري (الخامس عشر الميلادي) من قندهار، ثم حكمت السند، وحكمت الفرع الترخاني من سنة 1556م حتى 1591م، وضم أكبر السند العليا سنة 1573م والسفلى سنة 1591م {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
  en: "A Mongol dynasty claiming descent from Hulagu, which rose towards the end of the fifteenth century from Kandahar and then ruled Sind; its Tarkhan branch ruled from 1556 to 1591. Akbar annexed upper Sind in 1573 and lower Sind in 1591 {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
