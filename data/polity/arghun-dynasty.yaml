label: { ar: "الأرغونيون", en: "Arghun dynasty", es: "Dinastía Arghun", fr: "dynastie Arghun", ur: "ارغون خاندان", tr: "Aragonlar", id: "Aragon" }
summary:
  ar: "أسرة مغولية تدّعي النسب إلى هولاكو، برزت في أواخر القرن التاسع الهجري ⁦(الخامس عشر الميلادي)⁩ من قندهار، ثم حكمت السند، وحكمت الفرع الترخاني من سنة 1556م حتى 1591م، وضم أكبر السند العليا سنة 1573م والسفلى سنة 1591م {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
  en: "A Mongol dynasty claiming descent from Hulagu, which rose towards the end of the fifteenth century from Kandahar and then ruled Sind; its Tarkhan branch ruled from 1556 to 1591. Akbar annexed upper Sind in 1573 and lower Sind in 1591 {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
  es: "Una dinastía mongola que afirmaba descender de Hulagu, que surgió a finales del siglo XV desde Kandahar y luego gobernó Sind; su rama Tarkhan gobernó desde 1556 hasta 1591. Akbar anexó el Alto Sind en 1573 y el Bajo Sind en 1591 {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
  fr: "Une dynastie mongole se réclamant de Hulagu, qui s'éleva vers la fin du XVe siècle à partir de Kandahar et régna ensuite sur le Sind; sa branche Tarkhan régna de 1556 à 1591. Akbar annexa le Haut-Sind en 1573 et le Bas-Sind en 1591 {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
  ur: "ایک منگول خاندان جو ہلاگو سے تعلق کا دعویٰ کرتا ہے، جو پندرہویں صدی کے آخر میں قندھار سے نکلا اور پھر سندھ پر حکومت کی۔ اس کی ترخان شاخ نے 1556 سے 1591 تک حکومت کی۔ اکبر نے 1573 میں بالائی سندھ اور 1591 میں زیریں سندھ کو اپنے ساتھ ملا لیا۔ 1 ص۔ 675}۔"
  tr: "Hulagu'ya bağlı olduğunu iddia eden bir Moğol hanedanı, dokuzuncu yüzyılın sonlarında (M.S. on beşinci yüzyıl) Kandahar'dan ortaya çıktı, ardından Sindh'i yönetti ve 1556'dan 1591'e kadar Tarkhanid kolunu yönetti; en büyük Sindler 1573'te, alt Sindh ise 1591'de ilhak edildi {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 675}."
  id: "Dinasti Mongol yang mengklaim garis keturunan Hulagu muncul pada akhir abad kesembilan H (abad kelima belas M) dari Kandahar, kemudian memerintah Sindh dan memerintah cabang Tarkhanid dari 1556 M hingga 1591 M, dengan Sinds terbesar dianeksasi pada 1573 M dan Sindh bawah pada 1591 M {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 675}."
