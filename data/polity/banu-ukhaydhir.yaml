id: polity/banu-ukhaydhir
class: polity
kind: emirate
label:
  ar: بنو الأخيضر باليمامة
  en: Banu al-Ukhaydhir of Yamama
  es: "Banu al-Ukhaydhir de Yamama"
  fr: "Banu al-Ukhaydhir de Yamama"
  ur: "یمامہ کے بنو الخیثیر"
summary:
  ar: "إمارة بني الأخيضر باليمامة من بني الحسن؛ من عقب موسى الجون بن عبد الله بن الحسن المثنى بن الحسن السبط، وكان من عقبه إسماعيل وأخوه محمد الأخيضر ابنا يوسف بن إبراهيم بن موسى، فخرج إسماعيل الملقب بالسفاك في أعراب الحجاز سنة 251هـ فقصد مكة فهرب عاملها وانتهب منازل أصحاب السلطان وأخذ كسوة الكعبة وأقام في نهبها خمسين يوماً، وحاصر المدينة حتى مات أهلها جوعاً ولم يُصلَّ في مسجدها، وتردد بالحجاز اثنتين وعشرين سنة، ثم خلفه أخوه محمد الأخيضر فاستقر ملكهم باليمامة إلى أن غلب عليهم القرامطة وانقرض أمرهم."
  en: "The emirate of Banu al-Ukhaydhir of Yamama, Hasanids; from the line of Musa al-Jawn ibn Abdallah ibn al-Hasan al-Muthanna — Ismail and his brother Muhammad al-Ukhaydhir, sons of Yusuf ibn Ibrahim ibn Musa. Ismail 'al-Saffak' rose among the Hijaz Arabs in 251, drove Mecca's governor out, plundered the caliphal households and the Ka'ba's kiswa for fifty days, starved Medina under siege until none prayed in the Prophet's mosque, and roamed the Hijaz twenty-two years; his brother Muhammad al-Ukhaydhir then founded their Yamama kingship, which lasted until the Qarmatians overwhelmed them."
  es: "El emirato de Banu al-Ukhaydhir de Yamama, Hasanidas; de la línea de Musa al-Jawn ibn Abdallah ibn al-Hasan al-Muthanna — Ismail y su hermano Muhammad al-Ukhaydhir, hijos de Yusuf ibn Ibrahim ibn Musa. Ismail 'al-Saffak' ascendió entre los árabes del Hiyaz en 251, expulsó al gobernador de La Meca, saqueó las casas del califa y la kiswa de la Kaaba durante cincuenta días, sometió a Medina bajo asedio hasta que nadie rezó en la mezquita del Profeta, y vagó por el Hiyaz durante veintidós años; su hermano Muhammad al-Ukhaydhir fundó entonces su reino de Yamama, que duró hasta que los cármatas los sometieron."
  fr: "L'émirat des Banu al-Ukhaydhir de Yamama, hassanides, descendait de Musa al-Jawn ibn Abdallah ibn al-Hasan al-Muthanna — Ismaïl et son frère Muhammad al-Ukhaydhir, fils de Yusuf ibn Ibrahim ibn Musa. Ismaïl al-Saffak se souleva parmi les Arabes du Hedjaz en 251, chassa le gouverneur de La Mecque, pilla les demeures califales et la kiswa de la Kaaba pendant cinquante jours, affama Médine assiégée jusqu'à ce que plus personne ne prie dans la mosquée du Prophète, et erra dans le Hedjaz pendant vingt-deux ans; son frère Muhammad al-Ukhaydhir fonda alors leur royaume de Yamama, qui dura jusqu'à ce que les Qarmates les conquièrent."
  ur: "یمامہ کی امارت بنو الخیثیر، حسنید؛ موسیٰ الجون ابن عبد اللہ ابن الحسن المثنیٰ کے سلسلے سے - اسماعیل اور ان کے بھائی محمد الخیثیر، یوسف بن ابراہیم ابن موسی کے بیٹے۔ اسماعیل الصفق 251 میں حجاز عرب کے درمیان اٹھے، مکہ کے گورنر کو نکال باہر کیا، خلیفہ کے گھرانوں اور کعبہ کے کسوہ کو پچاس دن تک لوٹا، مدینہ کو اس وقت تک محاصرے میں رکھا جب تک کہ کسی نے مسجد نبوی میں نماز نہیں پڑھی، اور حجاز کے کئی سال گھومتے رہے۔ اس کے بھائی محمد الخذیر نے پھر ان کی یمامہ بادشاہی کی بنیاد رکھی، جو اس وقت تک قائم رہی جب تک کہ قرامطیوں نے ان پر غلبہ نہ پا لیا۔"
