label:
  ar: بنو الأخيضر باليمامة
  en: Banu al-Ukhaydhir of Yamama
summary:
  ar: "إمارة بني الأخيضر باليمامة من بني الحسن؛ من عقب موسى الجون بن عبد الله بن الحسن المثنى بن الحسن السبط، وكان من عقبه إسماعيل وأخوه محمد الأخيضر ابنا يوسف بن إبراهيم بن موسى، فخرج إسماعيل الملقب بالسفاك في أعراب الحجاز سنة 251هـ فقصد مكة فهرب عاملها وانتهب منازل أصحاب السلطان وأخذ كسوة الكعبة وأقام في نهبها خمسين يوماً، وحاصر المدينة حتى مات أهلها جوعاً ولم يُصلَّ في مسجدها، وتردد بالحجاز اثنتين وعشرين سنة، ثم خلفه أخوه محمد الأخيضر فاستقر ملكهم باليمامة إلى أن غلب عليهم القرامطة وانقرض أمرهم."
  en: "The emirate of Banu al-Ukhaydhir of Yamama, Hasanids; from the line of Musa al-Jawn ibn Abdallah ibn al-Hasan al-Muthanna — Ismail and his brother Muhammad al-Ukhaydhir, sons of Yusuf ibn Ibrahim ibn Musa. Ismail 'al-Saffak' rose among the Hijaz Arabs in 251, drove Mecca's governor out, plundered the caliphal households and the Ka'ba's kiswa for fifty days, starved Medina under siege until none prayed in the Prophet's mosque, and roamed the Hijaz twenty-two years; his brother Muhammad al-Ukhaydhir then founded their Yamama kingship, which lasted until the Qarmatians overwhelmed them."
