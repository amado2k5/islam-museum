label:
  ar: دولة بني عبد الواد
  en: Abd al-Wadid (Zayyanid) kingdom of Tlemcen
summary:
  ar: "دولة بني عبد الواد من زناتة بتلمسان، أسسها يغمراسن بن زيان بعد استيلائه على تلمسان وحصاره لها ثمان سنين، وقال حين رُفع إليه نسب إلى إدريس بلسانهم ما معناه: «إن كان هذا صحيحاً فينفعنا عند الله وأما الدنيا فإنما نلناها بسيوفنا»، وملكوا المغرب الأوسط بين بني مرين والحفصيين حتى دخل المرينيون تلمسان وانتهت دولتهم."
  en: "The Abd al-Wadid kingdom of Zanata at Tlemcen, founded by Yaghmurasen ibn Zayyan who took the city after an eight-year siege — who answered, when an Idrisid pedigree was offered him, in their tongue: 'if true it profits us with God, but this world we won with our swords'; they held the central Maghreb between the Marinids and the Hafsids until the Marinids entered Tlemcen and ended their state."
