id: polity/zayyanid-tlemcen
class: polity
kind: dynasty
label:
  ar: دولة بني عبد الواد
  en: Abd al-Wadid (Zayyanid) kingdom of Tlemcen
  es: "Abd al-Wadid (Zayyanid) reino de Tlemcen"
  fr: "Abd al-Wadid (Zayyanid) royaume de Tlemcen"
  ur: "عبد الودید ⁦(زیانید)⁩ تلمسن کی سلطنت"
  tr: "Bani Abd El Wad Eyaleti"
  id: "Negara Bagian Bani Abd El Wad"
summary:
  ar: "دولة بني عبد الواد من زناتة بتلمسان، أسسها يغمراسن بن زيان بعد استيلائه على تلمسان وحصاره لها ثمان سنين، وقال حين رُفع إليه نسب إلى إدريس بلسانهم ما معناه: «إن كان هذا صحيحاً فينفعنا عند الله وأما الدنيا فإنما نلناها بسيوفنا»، وملكوا المغرب الأوسط بين بني مرين والحفصيين حتى دخل المرينيون تلمسان وانتهت دولتهم."
  en: "The Abd al-Wadid kingdom of Zanata at Tlemcen, founded by Yaghmurasen ibn Zayyan who took the city after an eight-year siege — who answered, when an Idrisid pedigree was offered him, in their tongue: 'if true it profits us with God, but this world we won with our swords'; they held the central Maghreb between the Marinids and the Hafsids until the Marinids entered Tlemcen and ended their state."
  es: "El reino Abd al-Wadid de Zanata en Tlemcen, fundado por Yaghmurasen ibn Zayyan, quien tomó la ciudad después de un asedio de ocho años, respondió, cuando se le ofreció un linaje Idrisí, en su idioma: \"si es cierto, nos beneficia ante Dios, pero este mundo lo ganamos con nuestras espadas\"; mantuvieron el Magreb central entre los Mariníes y los Hafsíes hasta que los Mariníes entraron en Tlemcen y pusieron fin a su estado."
  fr: "Le royaume Abd al-Wadid de Zanata à Tlemcen, fondé par Yaghmurasen ibn Zayyan qui prit la ville après un siège de huit ans — qui répondit, lorsqu'on lui offrit une ascendance idrisside, dans leur langue: « si c'est vrai, cela nous profite auprès de Dieu, mais ce monde, nous l'avons conquis par nos épées »; ils contrôlèrent le Maghreb central entre les Mérinides et les Hafsides jusqu'à ce que les Mérinides entrent à Tlemcen et mettent fin à leur État."
  ur: "تلمسن میں زنتا کی عبد الودید بادشاہی، جس کی بنیاد یغموراسن ابن زیان نے رکھی تھی جس نے آٹھ سال کے محاصرے کے بعد شہر پر قبضہ کیا تھا - جس نے جواب دیا، جب اسے ادریسی نسب کی پیشکش کی گئی تو ان کی زبان میں: 'اگر یہ سچ ہے تو ہمیں خدا کے نزدیک فائدہ ہے، لیکن یہ دنیا ہم نے اپنی تلواروں سے جیتی'؛ انہوں نے مرکزی مغرب کو مارینیڈز اور حفصیوں کے درمیان رکھا یہاں تک کہ مرینیڈز تلمسن میں داخل ہو گئے اور اپنی ریاست کا خاتمہ کر دیا۔"
  tr: "Tlemcen'deki Zenata'dan Banu Abd al-Wad devleti, Tlemcen'i ele geçirip sekiz yıl boyunca kuşatan Yaghmurasan ibn Zayan tarafından kuruldu. Ona atfettiğinde, bunu İdris'e kendi sözleriyle atfetti: \"Eğer bu doğruysa, Allah nezdinde bize fayda sağlar; dünyaya gelince, bunu ancak kılıçlarımızla alacağız.\" Marinidler Tlemcen'e girip devletlerini sona erdirene kadar merkezi Mağrip'i Marinidler ile Hafsidler arasında yönettiler."
  id: "Negara Banu Abd al-Wad dari Zenata di Tlemcen didirikan oleh Yaghmurasan ibn Zayan setelah ia merebut Tlemcen dan mengepungnya selama delapan tahun. Ketika ia mengaitkannya kepadanya, ia mengaitkannya dengan Idris dengan kata-kata mereka sendiri: \"Jika ini benar, maka akan menguntungkan kita dengan Tuhan; sedangkan dunia, kita hanya akan menerimanya dengan pedang kita.\" Mereka memerintah Maghreb tengah antara Marinid dan Hafsid hingga Marinid memasuki Tlemcen dan mengakhiri negara mereka."
