label: { ar: "المأمونيون ⁦(خوارزمشاهية الجرجانية)⁩", en: "Ma'munids (Khwarazmshahs of Jurjaniyya)", ur: "مامونی ⁦(جرجانیہ کے خوارزم شاہ)⁩", es: "Ma'munids (Khwarazmshahs de Jurjaniyya)", fr: "Mamunides (Khwarazmshahs de Jurjaniyya)", tr: "Ma'munidler (Jurjani Khwarazmshahiyya)", id: "Para Ma'munid (Jurjani Khwarazmshahiyya)" }
summary:
  ar: "أسرة حكمت من الجرجانية ⁦(كركانج)⁩ ثم خوارزم كلها بلقب خوارزمشاه بعد 385هـ/995م، حتى فتح محمود الغزنوي خوارزم سنة 1017م {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 11}."
  en: "Dynasty that ruled from Jurjaniyya (Gurganj) and then all Khwarazm as Khwarazmshahs after 385/995, until Mahmud of Ghazna conquered Khwarazm in 1017 {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 11}."
  ur: "وہ خاندان جس نے 385ھ/995ء کے بعد جرجانیہ ⁦(گرگانج)⁩ سے اور پھر پورے خوارزم پر خوارزم شاہ کے لقب سے حکومت کی، یہاں تک کہ 1017ء میں محمود غزنوی نے خوارزم فتح کیا {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 11}۔"
  es: "Dinastía que gobernó desde Jurjaniyya (Gurganj) y luego todo Khwarazm como Khwarazmshahs después de 385/995, hasta que Mahmud de Ghazna conquistó Khwarazm en 1017 {cita:ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cita:ismoilov-xorazmshohlar-tangalari-2025 p. 11}."
  fr: "Dynastie qui régna depuis Jurjaniyya (Gurganj) puis sur tout le Khwarazm sous le nom de Khwarazmshahs après 385/995, jusqu'à ce que Mahmud de Ghazna conquière le Khwarazm en 1017 {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 10} {cite: ismoilov-xorazmshohlar-tangalari-2025 p. 11}."
  tr: "Bir hanedan, 385 H/995 M.S.'den sonra Jurcani (Karkanj) ve ardından tüm Harezm'i Khwarazmshah unvanıyla yönetti; ta ki Gazni'li Mahmud 1017'de Harezm'i fethedene kadar {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 s. 11}."
  id: "Sebuah dinasti memerintah dari Jurjani (Karkanj) dan kemudian seluruh Khwarezm dengan gelar Khwarazmshah setelah 385 H/995 M, hingga Mahmud dari Ghazni menaklukkan Khwarezm pada 1017 M {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 10} {cite:ismoilov-xorazmshohlar-tangalari-2025 hlm. 11}."
