id: polity/artukids
class: polity
kind: dynasty
label:
  ar: "الأرتقيون"
  en: "Artukids"
  es: "Artúquidos"
  fr: "Artucides"
summary:
  ar: "أسرة تركمانية حكمت ديار بكر كلها أو بعضها، مستقلة أو تحت الحماية المغولية، من أواخر القرن الخامس الهجري ⁦(الحادي عشر الميلادي)⁩ حتى أوائل القرن التاسع الهجري ⁦(الخامس عشر الميلادي)⁩؛ وينسب تأسيسها إلى أرتق بن أكسب من قبيلة الدوكر، وكان في خدمة السلاجقة الكبار ثم تفرعت منها إمارتا ماردين وحصن كيفا وخرت برت {cite:encyclopaedia-of-islam-2 vol. 1 p. 663-664}."
  en: "A Turkoman dynasty which ruled Diyar Bakr, wholly or in part, either independently or under Mongol protection, from the end of the fifth/eleventh century to the beginning of the ninth/fifteenth. Its founder Artuk ibn Eksab belonged to the Turkoman tribe of the Doger and served the Great Saljuqs; it later split into the lines of Mardin and Hisn Kayfa, and of Khartpert {cite:encyclopaedia-of-islam-2 vol. 1 p. 663-664}."
  es: "Dinastía turcomana que gobernó Diyar Bakr, total o parcialmente, de forma independiente o bajo protección mongola, desde finales del siglo V/XI hasta principios del siglo IX/XV. Su fundador, Artuk ibn Eksab, pertenecía a la tribu turcomana de los Doger y sirvió a los Grandes Selyúcidas; posteriormente se dividió en las ramas de Mardin e Hisn Kayfa, y de Khartpert {cite:encyclopaedia-of-islam-2 vol. 1 p. 663-664}."
  fr: "Une dynastie turkmène qui régna sur Diyar Bakr, en totalité ou en partie, de manière indépendante ou sous protection mongole, de la fin du Ve/XIe siècle au début du IXe/XVe siècle. Son fondateur, Artuk ibn Eksab, appartenait à la tribu turkmène des Doger et servait les Grands Seldjoukides; elle se divisa plus tard en deux branches: Mardin, Hisn Kayfa et Khartpert (voir: Encyclopaedia of Islam, vol. 1, p. 663-664)."
