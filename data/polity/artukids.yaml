label:
  ar: "الأرتقيون"
  en: "Artukids"
summary:
  ar: "أسرة تركمانية حكمت ديار بكر كلها أو بعضها، مستقلة أو تحت الحماية المغولية، من أواخر القرن الخامس الهجري (الحادي عشر الميلادي) حتى أوائل القرن التاسع الهجري (الخامس عشر الميلادي)؛ وينسب تأسيسها إلى أرتق بن أكسب من قبيلة الدوكر، وكان في خدمة السلاجقة الكبار ثم تفرعت منها إمارتا ماردين وحصن كيفا وخرت برت {cite:encyclopaedia-of-islam-2 vol. 1 p. 663-664}."
  en: "A Turkoman dynasty which ruled Diyar Bakr, wholly or in part, either independently or under Mongol protection, from the end of the fifth/eleventh century to the beginning of the ninth/fifteenth. Its founder Artuk ibn Eksab belonged to the Turkoman tribe of the Doger and served the Great Saljuqs; it later split into the lines of Mardin and Hisn Kayfa, and of Khartpert {cite:encyclopaedia-of-islam-2 vol. 1 p. 663-664}."
