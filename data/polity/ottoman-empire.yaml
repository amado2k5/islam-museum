label:
  ar: الدولة العثمانية
  en: Ottoman Empire
  ur: "عثمانی سلطنت"
  es: "Imperio Otomano"
  fr: "Empire ottoman"
  tr: "Osmanlı İmparatorluğu"
  id: "Kekaisaran Ottoman"
summary:
  ar: "الدولة العثمانية إمبراطورية قامت سنة 1299م وانتهت سنة 1922م، وعاصمتها القسطنطينية. نشأت في الأناضول على الحد مع البيزنطيين، وفتحت القسطنطينية سنة 1453م، وضمت الشام ومصر سنة 1516م و1517م، وبلغت أقصى اتساعها في عهد سليمان القانوني. وبعد قرون من الضغوط والإصلاح والحرب العالمية الأولى ألغت الجمعية الوطنية الكبرى في أنقرة حكومة إسطنبول في 1 نوفمبر 1922م."
  en: "An empire established in 1299 CE and ended in 1922 CE; its capital was Constantinople. It arose in Anatolia on the frontier with the Byzantines, took Constantinople in 1453, absorbed Syria and Egypt in 1516 and 1517, and reached its greatest extent under Suleyman the Magnificent. After centuries of pressure, reform and the First World War, the Grand National Assembly at Ankara abolished the Istanbul government on 1 November 1922."
  ur: "1299ء میں قائم ہونے والی سلطنت جو 1922ء میں ختم ہوئی؛ قسطنطنیہ اس کا دارالحکومت تھا۔ یہ اناطولیہ میں بازنطینیوں کی سرحد پر اٹھی، 1453ء میں قسطنطنیہ لیا، 1516ء اور 1517ء میں شام اور مصر شامل کیے، اور سلیمان عالی شان کے دور میں اپنی وسیع ترین حد کو پہنچی۔ صدیوں کے دباؤ، اصلاحات اور پہلی عالمی جنگ کے بعد انقرہ کی قومی اسمبلی نے یکم نومبر 1922ء کو استنبول کی حکومت ختم کر دی۔ {cite:wikidata}"
  es: "Imperio fundado en 1299 d. C. y disuelto en 1922 d. C.; su capital era Constantinopla. Surgió en Anatolia, en la frontera con el Imperio Bizantino, conquistó Constantinopla en 1453, absorbió Siria y Egipto en 1516 y 1517, y alcanzó su máxima extensión bajo el reinado de Solimán el Magnífico. Tras siglos de presión, reformas y la Primera Guerra Mundial, la Gran Asamblea Nacional de Ankara abolió el gobierno de Estambul el 1 de noviembre de 1922."
  fr: "Un empire fondé en 1299 et dissous en 1922, dont la capitale était Constantinople. Né en Anatolie, à la frontière byzantine, il s'empara de Constantinople en 1453, annexa la Syrie et l'Égypte en 1516 et 1517, et atteignit son apogée sous le règne de Soliman le Magnifique. Après des siècles de pressions, de réformes et la Première Guerre mondiale, la Grande Assemblée nationale d'Ankara abolit le gouvernement d'Istanbul le 1er novembre 1922."
  tr: "Osmanlı İmparatorluğu, 1299 yılında kurulan ve 1922'de sona eren bir imparatorluktur; başkenti Konstantinopolis'tir. Anadolu'da, Bizans sınırında ortaya çıkmış, 1453 yılında Konstantinopolis'i fethetmiş, 1516 ve 1517 yıllarında Levant ve Mısır'ı ilhak etmiş ve en geniş kapsamına Süleyman Yüce Müthiş döneminde ulaşmıştır. Yüzyıllar süren baskı, reform ve I. Dünya Savaşı'nın ardından, Ankara'daki Büyük Millet Meclisi 1 Kasım 1922'de İstanbul hükümetini feshetmiştir."
  id: "Kekaisaran Ottoman adalah sebuah kekaisaran yang didirikan pada tahun 1299 M dan berakhir pada tahun 1922 M, dengan ibu kotanya di Konstantinopel. Kekaisaran ini berasal dari Anatolia di perbatasan dengan Bizantium, menaklukkan Konstantinopel pada tahun 1453 M, menganeksasi Levant dan Mesir pada tahun 1516 dan 1517 M, serta mencapai puncak kejayaannya selama masa pemerintahan Suleiman yang Agung. Setelah berabad-abad tekanan, reformasi, dan Perang Dunia I, Majelis Nasional Agung di Ankara membubarkan pemerintahan Istanbul pada 1 November 1922."
