summary:
  ar: "الدولة العثمانية إمبراطورية قامت سنة 1299م وانتهت سنة 1922م، وعاصمتها القسطنطينية. نشأت في الأناضول على الحد مع البيزنطيين، وفتحت القسطنطينية سنة 1453م، وضمت الشام ومصر سنة 1516م و1517م، وبلغت أقصى اتساعها في عهد سليمان القانوني. وبعد قرون من الضغوط والإصلاح والحرب العالمية الأولى ألغت الجمعية الوطنية الكبرى في أنقرة حكومة إسطنبول في 1 نوفمبر 1922م."
  en: "An empire established in 1299 CE and ended in 1922 CE; its capital was Constantinople. It arose in Anatolia on the frontier with the Byzantines, took Constantinople in 1453, absorbed Syria and Egypt in 1516 and 1517, and reached its greatest extent under Suleyman the Magnificent. After centuries of pressure, reform and the First World War, the Grand National Assembly at Ankara abolished the Istanbul government on 1 November 1922."
  ur: "1299ء میں قائم ہونے والی سلطنت جو 1922ء میں ختم ہوئی؛ قسطنطنیہ اس کا دارالحکومت تھا۔ یہ اناطولیہ میں بازنطینیوں کی سرحد پر اٹھی، 1453ء میں قسطنطنیہ لیا، 1516ء اور 1517ء میں شام اور مصر شامل کیے، اور سلیمان عالی شان کے دور میں اپنی وسیع ترین حد کو پہنچی۔ صدیوں کے دباؤ، اصلاحات اور پہلی عالمی جنگ کے بعد انقرہ کی قومی اسمبلی نے یکم نومبر 1922ء کو استنبول کی حکومت ختم کر دی۔ {cite:wikidata}"
