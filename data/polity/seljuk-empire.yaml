label:
  ar: الدولة السلجوقية
  en: Seljuk Empire
  ur: "سلجوق سلطنت"
summary:
  ar: "أسرة تركية أوغوزية حكمت في القرنين الخامس والسادس الهجريين، مباشرة أو عبر أمراء تابعين، رقعة واسعة من غربي آسيا من ما وراء النهر وخوارزم شرقًا إلى الأناضول والشام والحجاز غربًا. دخل طغرل بك بغداد سنة 447هـ/1055م فأنهى سلطان البويهيين، وبلغت الدولة ذروتها في عهد ألب أرسلان وملكشاه ووزيرهما نظام الملك، ثم أُنهكت بالنزاع على العرش وهُزم سنجر أمام القرا خطاي وأسره الغز سنة 548هـ/1153م."
  en: "A Turkish Oghuz dynasty that in the eleventh and twelfth centuries ruled, directly or through vassals, a wide area of Western Asia from Transoxania and Khwarazm to Anatolia, Syria and the Hijaz. Tughril Beg entered Baghdad in 447/1055 and ended Buyid rule; the state reached its height under Alp Arslan, Malik Shah and their vizier Nizam al-Mulk, was worn down by succession wars, and saw Sanjar routed by the Kara Khitay and captured by the Ghuzz in 548/1153."
  ur: "ایک ترک اوغوز خاندان جس نے پانچویں اور چھٹی صدی ہجری میں، براہ راست یا باج گزاروں کے ذریعے، ماوراء النہر اور خوارزم سے اناطولیہ، شام اور حجاز تک مغربی ایشیا کے وسیع علاقے پر حکومت کی۔ طغرل بیگ 447ھ/1055ء میں بغداد میں داخل ہوا اور آل بویہ کا اقتدار ختم کیا؛ الپ ارسلان، ملک شاہ اور ان کے وزیر نظام الملک کے عہد میں ریاست عروج کو پہنچی، پھر جانشینی کی جنگوں سے کمزور ہوئی، اور سنجر کو قرا ختائیوں نے شکست دی اور 548ھ/1153ء میں غزوں نے قید کر لیا۔"
