id: polity/umayyads-of-cordoba
class: polity
kind: caliphate
label:
  ar: الخلافة الأموية بقرطبة
  en: Caliphate of Córdoba
  ur: خلافتِ قرطبہ
summary:
  ar: الدولة الأموية في الأندلس التي كانت عاصمتها قرطبة، من دخول عبد الرحمن الداخل سنة 138هـ إلى خلع آخر خلفائها المعتد هشام سنة 424هـ على ما يرويه ابن عذاري، وتمييزاً لها عن الخلافة الأموية في دمشق {cite:bayan-mughrib-idhari p. 226}.
  en: The Umayyad state in al-Andalus with Córdoba as its capital, from Abd al-Rahman al-Dakhil's entry in 138 AH to the deposition of its last caliph Hisham al-Mu'tadd in 424 AH as Ibn Idhari reports, distinct from the Umayyad caliphate of Damascus {cite:bayan-mughrib-idhari p. 226}.
  ur: اندلس کی اموی ریاست جس کا دارالخلافہ قرطبہ تھا، عبد الرحمن الداخل کے داخلے 138ھ سے لے کر ابن عذاری کی روایت کے مطابق آخری خلیفہ ہشام معتد کے معزول ہونے 424ھ تک؛ دمشق کی اموی خلافت سے ممیز {cite:bayan-mughrib-idhari p. 226}.
