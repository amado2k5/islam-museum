summary:
  ar: "بطاقة أولية لدولة المماليك بدلهي، أسرة العبيد الملكية التي أسسها قطب الدين أيبك وحكمت دلهي من ١٢٠٦ حتى ١٢٩٠م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Mamluk dynasty of Delhi, the slave-soldier royal house founded by Qutb al-Din Aibak ruling Delhi from 1206 to 1290; its sources are not yet checked on the page."
  es: "Boceto de ficha de la dinastía mameluca de Delhi, la casa real de soldados esclavos fundada por Qutb al-Din Aibak que gobernó Delhi desde 1206 hasta 1290; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la dynastie mamelouke de Delhi, la maison royale d'esclaves-soldats fondée par Qutb al-Din Aibak qui régna sur Delhi de 1206 à 1290; ses sources ne sont pas encore vérifiées sur la page."
  ur: "دہلی کے مملوک خاندان کے لیے ڈرافٹ کارڈ، غلام سپاہی شاہی گھر جس کی بنیاد قطب الدین ایبک نے 1206 سے 1290 تک دہلی پر حکمرانی کی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Delhi'deki Memlük devletinin ön kartı; Qutb al-Din Aybak tarafından kurulan ve 1206-1290 yılları arasında Delhi'yi yöneten kraliyet köle hanedanıdır; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal negara Mamluk di Delhi, dinasti budak kerajaan yang didirikan oleh Qutb al-Din Aybak dan memerintah Delhi dari tahun 1206 hingga 1290 M; sumber-sumbernya di halaman tersebut belum ditinjau."
