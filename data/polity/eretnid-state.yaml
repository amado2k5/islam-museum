id: polity/eretnid-state
class: polity
kind: state
label:
  ar: دولة بني ارتنا ببلاد الروم
  en: Eretnid state of Rum
  es: "Estado eretnid de Rum"
  fr: "État éretnide de Rum"
  ur: "رم کی Eretnid حالت"
  tr: "Romalıların topraklarındaki Bani Artna devleti"
  id: "Negara bagian Bani Artna di tanah Romawi"
summary:
  ar: "دولة بني ارتنا ملوك بلاد الروم من المغل بعد بني هلاكو؛ أصلهم ارتنا أمير من أمراء المغل ولي الشحنة على بلاد الروم في آخر دولة الإيلخانات، فلما انقرض أمرهم استقل هو وولده بكرسيها بقيصرية وسيواس وأعمالهما من أقصر إلى ملطية وسميساط وما استضافوه من بلاد الأرمن، ودام ملكهم إلى أن ظهرت عليهم دول التركمان والعثمانيين وذهب ملكهم."
  en: "The state of the Banu Eretna, Mongol-blooded kings of Rum after the Ilkhanids; their root Eretna, an Ilkhanid commander who held the shihna governorship of the Rum lands, who with his sons took its throne at Kayseri and Sivas and the realms from Aqsaray to Malatya and Samsat and what they had annexed of Armenia — their kingship lasted until the Turkmen and Ottoman states rose over them."
  es: "El estado de los Banu Eretna, reyes de Rum de sangre mongola después de los Iljánidas; su raíz Eretna, un comandante Iljánida que ostentaba el cargo de gobernador de las tierras de Rum, quien con sus hijos tomó el trono en Kayseri y Sivas y los reinos desde Aqsaray hasta Malatya y Samsat y lo que habían anexionado de Armenia; su reinado duró hasta que los estados turcomano y otomano se alzaron sobre ellos."
  fr: "L'État des Banu Eretna, rois de Rum d'origine mongole après les Ilkhanides; leur ancêtre Eretna, un commandant ilkhanide qui détenait le gouvernement shihna des terres de Rum, qui avec ses fils prit le trône à Kayseri et Sivas et les royaumes d'Aqsaray à Malatya et Samsat et ce qu'ils avaient annexé de l'Arménie — leur royauté dura jusqu'à ce que les États turkmènes et ottomans se soulèvent contre eux."
  ur: "بنو اریتنا کی ریاست، الخانیوں کے بعد روم کے منگول خونی بادشاہ؛ ان کی جڑ اریتنا، ایک الخانی کمانڈر تھا جس نے رم کی سرزمین پر شیہنا گورنری سنبھالی تھی، جس نے اپنے بیٹوں کے ساتھ قیصری اور سیواس پر اس کا تخت سنبھالا تھا اور اکسرے سے ملاتیا اور سمسات تک کے علاقوں پر قبضہ کیا تھا اور جو انہوں نے آرمینیا کے ساتھ الحاق کیا تھا - ان کی بادشاہی اس وقت تک قائم رہی جب تک کہ ترکمان اور عثمانی سلطنت ان پر غالب نہ آئے۔"
  tr: "Banu Artna Devleti: Banu Hulagu'dan sonra Babürlerden Roma topraklarının kralları; kökenleri, İlhanlık hanedanının sonunda Roma topraklarını yöneten Moğol prenslerinden Artna'dır. Yönetimleri sona erdiğinde, o ve oğlu Sezariye ve Sivas'taki tahtlarında bağımsız oldular ve toprakları Luxor'dan Malatya ve Semisat'a kadar uzandı, ayrıca ev sahipliği yaptıkları Ermeniler de vardı. Yönetimleri, Türkmen ve Osmanlı devletleri ortaya çıkana ve krallıkları yok olana kadar sürdü."
  id: "Negara Banu Artna: Raja-raja tanah Romawi dari Mughal setelah Banu Hulagu; asal-usul mereka adalah Artna, seorang pangeran dari pangeran Mongol yang memerintah tanah Romawi pada akhir dinasti Ilkhanate. Ketika pemerintahan mereka berakhir, ia dan putranya menjadi merdeka di tahta mereka di Caesarea dan Sivas, dan wilayah mereka meluas dari Luxor hingga Malatya dan Semisat, serta orang Armenia yang mereka tampung. Kekuasaan mereka bertahan hingga negara Turkmen dan Ottoman muncul dan kerajaan mereka lenyap."
