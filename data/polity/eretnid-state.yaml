label:
  ar: دولة بني ارتنا ببلاد الروم
  en: Eretnid state of Rum
summary:
  ar: "دولة بني ارتنا ملوك بلاد الروم من المغل بعد بني هلاكو؛ أصلهم ارتنا أمير من أمراء المغل ولي الشحنة على بلاد الروم في آخر دولة الإيلخانات، فلما انقرض أمرهم استقل هو وولده بكرسيها بقيصرية وسيواس وأعمالهما من أقصر إلى ملطية وسميساط وما استضافوه من بلاد الأرمن، ودام ملكهم إلى أن ظهرت عليهم دول التركمان والعثمانيين وذهب ملكهم."
  en: "The state of the Banu Eretna, Mongol-blooded kings of Rum after the Ilkhanids; their root Eretna, an Ilkhanid commander who held the shihna governorship of the Rum lands, who with his sons took its throne at Kayseri and Sivas and the realms from Aqsaray to Malatya and Samsat and what they had annexed of Armenia — their kingship lasted until the Turkmen and Ottoman states rose over them."
