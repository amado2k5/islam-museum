summary:
  ar: "دولة في جنوب شرق آسيا، أرخبيل يبلغ عدد جزره 17508 جزيرة بحسب كتاب الزيارة، وعدد سكانها نحو 238 مليون نسمة، وعاصمتها جاكرتا في جزيرة جاوة {cite:rihla-imam-akbar-indonesia-azhar p. 24}. شعارها الوحدة في التنوع، ولغتها الرسمية الباسا {cite:rihla-imam-akbar-indonesia-azhar p. 26}. دخل إليها الإسلام، بحسب الكتاب، في أواخر القرن الثاني وأوائل الثالث الهجري على يد التجار العرب {cite:rihla-imam-akbar-indonesia-azhar p. 26}، وتعد بلداً ذا علاقات تاريخية بمصر تتضمن تبادلاً تجارياً وعلمياً وثقافياً {cite:rihla-imam-akbar-indonesia-azhar p. 40}."
  en: "A country in Southeast Asia: an archipelago of 17,508 islands by the book's count, about 238 million people, capital Jakarta on Java. The book gives Islam's arrival in the late 2nd or early 3rd century AH through Arab traders and places it within the Shafi'i and Ash'ari tradition; it describes long-standing Egyptian-Indonesian ties."
