  en: Eldiguzid atabegs of Azerbaijan
summary:
  ar: "أتابكية أذربيجان؛ يرجع أصلها إلى رجل من بلاد القفجاق كان مملوكاً للسلطان مسعود السلجوقي في العراق هو شمس الدين إلدجز الذي قامت دولته سنة 531هـ، فتعاقب عليها محمد البهلوان جاهان سنة 568هـ ثم قزل أرسلان عثمان سنة 587هـ ثم أبو بكر، ودامت في الجبال وأذربيجان والعراق العجمي إلى أن أزالها خوارزمشاه علاء الدين محمد على يد أوزبك البهلوان آخر أمرائها سنة 622هـ."
  en: "The atabegs of Azerbaijan; sprung from Shams al-Din Eldiguz, a Qipchaq mamluk of Sultan Mas'ud of Iraq, whose state rose in 531 — succeeded by Muhammad Bahlawan Jahan in 568, Qizil Arslan Uthman in 587, and Abu Bakr — ruling the Jibal, Azerbaijan and Persian Iraq until Khwarazmshah Ala al-Din Muhammad ended them under their last amir Uzbek al-Bahlawan in 622."
