label:
  ar: أتابكية أذربيجان
  en: Eldiguzid atabegs of Azerbaijan
  es: "Atabegs eldiguzid de Azerbaiyán"
  fr: "Atabegs Eldiguzid d'Azerbaïdjan"
  ur: "آذربائیجان کے الدیگوزید اتابیگ"
  tr: "Azerbaycan'ın Atabegyası"
  id: "Atabegia of Azerbaijan"
summary:
  ar: "أتابكية أذربيجان؛ يرجع أصلها إلى رجل من بلاد القفجاق كان مملوكاً للسلطان مسعود السلجوقي في العراق هو شمس الدين إلدجز الذي قامت دولته سنة 531هـ، فتعاقب عليها محمد البهلوان جاهان سنة 568هـ ثم قزل أرسلان عثمان سنة 587هـ ثم أبو بكر، ودامت في الجبال وأذربيجان والعراق العجمي إلى أن أزالها خوارزمشاه علاء الدين محمد على يد أوزبك البهلوان آخر أمرائها سنة 622هـ."
  en: "The atabegs of Azerbaijan; sprung from Shams al-Din Eldiguz, a Qipchaq mamluk of Sultan Mas'ud of Iraq, whose state rose in 531 — succeeded by Muhammad Bahlawan Jahan in 568, Qizil Arslan Uthman in 587, and Abu Bakr — ruling the Jibal, Azerbaijan and Persian Iraq until Khwarazmshah Ala al-Din Muhammad ended them under their last amir Uzbek al-Bahlawan in 622."
  es: "Los atabegs de Azerbaiyán; surgió de Shams al-Din Eldiguz, un mameluco Qipchaq del sultán Mas'ud de Irak, cuyo estado surgió en 531 (sucedido por Muhammad Bahlawan Jahan en 568, Qizil Arslan Uthman en 587 y Abu Bakr) gobernando Jibal, Azerbaiyán y el Irak persa hasta que Khwarazmshah Ala al-Din Muhammad acabó con ellos bajo su último emir Uzbek al-Bahlawan en 622."
  fr: "Les atabegs d'Azerbaïdjan; est né de Shams al-Din Eldiguz, un mamelouk Qipchaq du sultan Mas'ud d'Irak, dont l'État s'est élevé en 531 - succédé par Muhammad Bahlawan Jahan en 568, Qizil Arslan Uthman en 587 et Abu Bakr - dirigeant le Jibal, l'Azerbaïdjan et l'Irak perse jusqu'à ce que Khwarazmshah Ala al-Din Muhammad y mette fin sous leur dernier émir ouzbek al-Bahlawan en 622."
  ur: "آذربائیجان کے اتابگز؛ عراق کے سلطان مسعود کے ایک قپچاق مملوک شمس الدین الدیگوز سے پیدا ہوا، جس کی ریاست 531 میں قائم ہوئی - محمد بہلوان جہاں نے 568 میں، قزل ارسلان عثمان نے 587 میں، اور ابوبکر نے جبل، آذربائیجان اور فارس پر حکومت کی جب تک کہ ان کے آخری عراقی محمد الخرازہ کے دور میں محمد بہلوان نے حکومت کی۔ 622 میں امیر ازبک البہلوان۔"
  tr: "Azerbaycan Atabegleri; kökeni, Irak'taki Selçuklu Sultan Mes'ud Şemseddin Eldecz'e ait olan ve 531 Hicri'de kurulan Kipçak topraklarından bir adama dayanır. Yerine 568 H.'de Muhammed el-Behlvan Cihan, 587 H.'de Kızil Arslan Osman ve ardından Ebu Bekir geçti. Dağlarda, Azerbaycan'da ve Ajami Irak'ta varlığını sürdürdü; ta ki 622 Hicri'de son emiri Özbek el-Pehlvan tarafından Hwarazmşah Ala al-Din Muhammed tarafından devrilene kadar."
  id: "Atabeg dari Azerbaijan; asal-usulnya berasal dari seorang pria dari tanah Kipchak yang dimiliki oleh Sultan Mas'ud Seljuk di Irak, Shams al-Din Eldejz, yang negaranya didirikan pada tahun 531 H. Negara ini digantikan oleh Muhammad al-Bahlwan Jahan pada tahun 568 H, kemudian Qizil Arslan Osman pada tahun 587 H, dan kemudian Abu Bakr. Kota ini bertahan di pegunungan, Azerbaijan, dan Ajami Iraq hingga digulingkan oleh Khwarazmshah Ala al-Din Muhammad oleh Uzbek al-Pahlwan, emir terakhirnya, pada tahun 622 H."
