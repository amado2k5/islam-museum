  en: "The Ikhshidid state of Banu Tughj in Egypt and Syria, founded by Muhammad ibn Tughj al-Ikhshid, held after him by his sons and their master Kafur al-Ikhshidi until it ended with Jawhar al-Siqilli's entry into Egypt in 358 AH, the da'wa turning Alid and his founding of Cairo."
