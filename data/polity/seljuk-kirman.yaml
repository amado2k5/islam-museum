summary:
  ar: "سلاجقة كرمان؛ فرع من البيت السلجوقي أسسه قاورت بك عماد الدين قرا أرسلان سنة 433هـ، وتعاقب عليه كرمان شاه سنة 465هـ وحسن وقزل أرسلان وأوزبك وسلطان شاه ركن الدين وتوران شاه سنة 477هـ وإميران شاه سنة 490هـ وأرسلان شاه سنة 494هـ ومحمد الأول مغيث الدين سنة 536هـ، ودامت إمارتهم في كرمان إلى أن انقرضت أواخر القرن السادس."
  en: "The Seljuks of Kirman; a branch of the Seljuk house founded by Qawurd Beg Imad al-Din Qara Arslan in 433 — followed by Kirman Shah, Husayn, Qizil Arslan, Uzbak, Rukn al-Din Sultan Shah, Turan Shah, Imiran Shah, Arslan Shah and Mughith al-Din Muhammad I — their emirate lasting in Kirman to the late sixth century."
