summary:
  ar: "بطاقة أولية لإمارة بني رمضان، إمارة تركمانية حكمت أضنة وقيليقية من ١٣٥٢ حتى ضمّها العثمانيون ١٦٠٨م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Ramadanids, the Turkmen emirate that held Adana and Cilicia from 1352 until the Ottomans annexed it in 1608; its sources are not yet checked on the page."
  es: "Boceto de ficha para los Ramadánidas, el emirato turcomano que gobernó Adana y Cilicia desde 1352 hasta que los otomanos la anexionaron en 1608; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour les Ramadanides, l'émirat turkmène qui a détenu Adana et la Cilicie de 1352 jusqu'à son annexion par les Ottomans en 1608; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1352 سے لے کر 1608 میں عثمانیوں کے الحاق تک اڈانا اور سیلیسیا پر قبضہ کرنے والی ترکمان امارات کے لیے ڈرافٹ کارڈ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1352'den 1608'de Osmanlılar tarafından ilhak edilene kadar Adana ve Kilikya'yı yöneten Türkmen Emirliği Beni Ramazan Emirliği için ön hazırlık kartı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Emirat Bani Ramadan, sebuah emirat Turkmen yang memerintah Adana dan Kilikia dari tahun 1352 hingga dianeksasi oleh Ottoman pada tahun 1608 M; sumber-sumbernya di halaman tersebut belum ditinjau."
