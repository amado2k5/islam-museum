label:
  ar: بنو خزرون ملوك سجلماسة
  en: Banu Khazrun, kings of Sijilmasa
  es: "Banu Khazrun, reyes de Sijilmasa"
  fr: "Banu Khazrun, rois de Sijilmasa"
  ur: "بنو خزرون، سجلمسہ کے بادشاہ"
  tr: "Banu Khazrun, Sijilmasa Kralları"
  id: "Banu Khazrun, Raja-raja Sijilmasa"
summary:
  ar: "إمارة بني خزرون بن فلفول من مغراوة بسجلماسة؛ زحف خزرون إليها سنة 366هـ فهزم أمير بني مدرار المعتز بالله وقتله ومحا دولة آل مدرار والخوارج منها آخر الدهر وأقام الدعوة للمؤيد هشام فكانت أول دعوة أقيمت للمروانيين على سجلماسة، وملكها من بعده ابنه وانودين سنة 390هـ بعقد واضح الصقلبي على مال مفروض وعدة من الخيل والدرق يحملانها كل سنة إلى فاس، واستبد بأعمال سجلماسة ودرعة بعد انتثار سلك الخلافة، حتى افتتح المرابطون أعمال المغرب فهلك بنو خزر بسجلماسة وطرابلس."
  en: "The emirate of Banu Khazrun ibn Fulful of Maghrawa at Sijilmasa; Khazrun marched on it in 366, routed and killed its Midrarid amir al-Mu'tazz, erased the Kharijite Midrarid state for ever and raised the khutba for the caliph Hisham al-Mu'ayyad — the first Marwanid da'wa over Sijilmasa. His son Wanudin held it from 390 under Wadih's covenant of yearly tribute in coin, horses and shields, and after the Cordoban caliphate's thread snapped he ruled Sijilmasa and Dra'a independently, until the Almoravids swept the Maghreb and the Banu Khazrun perished at Sijilmasa and Tripoli."
  es: "El emirato de Banu Khazrun ibn Fulful de Maghrawa en Sijilmasa; Khazrun marchó sobre él en 366, derrotó y mató a su emir midrárida al-Mu'tazz, borró para siempre el estado midrárida jariyita y erigió la jutba para el califa Hisham al-Mu'ayyad, la primera da'wa marwaní sobre Sijilmasa. Su hijo Wanudin lo gobernó desde 390 bajo el pacto de Wadih de tributo anual en monedas, caballos y escudos, y después de que se rompiera el hilo del califato cordobés, gobernó Sijilmasa y Dra'a de forma independiente, hasta que los almorávides arrasaron el Magreb y los Banu Khazrun perecieron en Sijilmasa y Trípoli."
  fr: "L'émirat des Banu Khazrun ibn Fulful de Maghrawa à Sijilmasa; Khazrun marcha sur lui en 366, mit en déroute et tua son émir midraride al-Mu'tazz, anéantit définitivement l'État midraride kharijite et proclama le sermon du calife Hisham al-Mu'ayyad – la première da'wa marwanide sur Sijilmasa. Son fils Wanudin le conserva à partir de 390 sous le pacte de Wadih, prévoyant un tribut annuel en pièces de monnaie, chevaux et boucliers. Après la chute du califat de Cordoue, il gouverna Sijilmasa et Dra'a de manière indépendante, jusqu'à ce que les Almoravides déferlent sur le Maghreb et que les Banu Khazrun périssent à Sijilmasa et Tripoli."
  ur: "بنو خضرون بن فلفل کی امارت مغروہ سجلماسہ؛ خزرون نے 366 میں اس پر کوچ کیا، اس کے مدرید امیر المعتز کو شکست دی اور قتل کر دیا، خارجی مدرریڈ ریاست کو ہمیشہ کے لیے مٹا دیا اور خلیفہ ہشام المعیاد کے لیے خطبہ بلند کیا - سجلمسہ پر پہلا مروانی دعوت۔ اس کے بیٹے ونودین نے اسے 390 میں ودیح کے عہد کے تحت سالانہ خراج کے معاہدے کے تحت سکوں، گھوڑوں اور ڈھالوں میں رکھا، اور قرطبہ کی خلافت کے ٹوٹنے کے بعد اس نے سجلماسا اور درعا پر آزادانہ طور پر حکومت کی، یہاں تک کہ الموراویڈس نے مغرب اور بنو خزرون پر قبضہ کر لیا اور تری پولیسا میں۔"
  tr: "Banu Hazrun ibn Falful Emirliği, Sijilmasa'daki Mağrava'dan; Hazrun, 366 Hicri'de oraya yürüdü, Banu Madrar Emiri Al-Mu'tazz Billah'ı mağlup etti, zamanın sonunda Madrar ailesinin devletini ve Haricileri yok etti ve destekçisi Hisham'a çağrı yaptı. Bu, Marwanilerin Sijilmasa'yı talep etmeleri için ilk davetti. Onun ardından, oğlu Wannudin 390 Hicri'de Saqlabi'den sabit bir meblağ ve birkaç at ile süvari ile her yıl Fez'e taşıdığı açık bir sözleşmeyle yönetti. Halifeliğin dağılmasından sonra Sijilmasa ve Draa'nın kontrolünü ele geçirdi, ta ki Almoravidler Mağrip'i açıp Sijilmasa ve Trablus'taki Hazarları yok edene kadar."
  id: "Emirat Banu Khazrun ibn Falful dari Maghrawa di Sijilmasa; Khazrun berbaris ke sana pada tahun 366 H, mengalahkan Emir Banu Madrar, Al-Mu'tazz Billah, memusnahkan negara keluarga Madrar dan Kharijite pada akhir zaman, serta mengadakan panggilan untuk pendukung Hisham. Ini adalah undangan pertama bagi Marwanid untuk mengklaim Sijilmasa. Setelah itu, putranya Wannudin memerintah pada tahun 390 H dengan kontrak jelas dari Saqlabi atas jumlah tetap dan beberapa kuda serta kavaleri, yang dibawanya setiap tahun ke Fez. Dia mengambil alih Sijilmasa dan Draa setelah pembubaran kekhalifahan, hingga Almoravid membuka Maghreb dan menghancurkan Khazar di Sijilmasa dan Tripoli."
