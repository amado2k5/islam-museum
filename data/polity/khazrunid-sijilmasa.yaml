label:
  ar: بنو خزرون ملوك سجلماسة
  en: Banu Khazrun, kings of Sijilmasa
summary:
  ar: "إمارة بني خزرون بن فلفول من مغراوة بسجلماسة؛ زحف خزرون إليها سنة 366هـ فهزم أمير بني مدرار المعتز بالله وقتله ومحا دولة آل مدرار والخوارج منها آخر الدهر وأقام الدعوة للمؤيد هشام فكانت أول دعوة أقيمت للمروانيين على سجلماسة، وملكها من بعده ابنه وانودين سنة 390هـ بعقد واضح الصقلبي على مال مفروض وعدة من الخيل والدرق يحملانها كل سنة إلى فاس، واستبد بأعمال سجلماسة ودرعة بعد انتثار سلك الخلافة، حتى افتتح المرابطون أعمال المغرب فهلك بنو خزر بسجلماسة وطرابلس."
  en: "The emirate of Banu Khazrun ibn Fulful of Maghrawa at Sijilmasa; Khazrun marched on it in 366, routed and killed its Midrarid amir al-Mu'tazz, erased the Kharijite Midrarid state for ever and raised the khutba for the caliph Hisham al-Mu'ayyad — the first Marwanid da'wa over Sijilmasa. His son Wanudin held it from 390 under Wadih's covenant of yearly tribute in coin, horses and shields, and after the Cordoban caliphate's thread snapped he ruled Sijilmasa and Dra'a independently, until the Almoravids swept the Maghreb and the Banu Khazrun perished at Sijilmasa and Tripoli."
