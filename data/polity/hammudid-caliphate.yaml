summary:
  ar: خلافة ادّعاها الحموديون العلويون في قرطبة ومالقة خلال فتنة الأندلس، من 1016م وظهرت آخر مطالباتهم نحو 1057م.
  en: A caliphate claimed by the Idrisid-descended Hammudids in Cordoba and Malaga during the fitna of al-Andalus, from 1016 CE, their last claims fading around 1057.
  ur: "اندلس کی فتنہ کے زمانے میں حمودیوں کا خلافت کا دعویٰ، قرطبہ اور مالگا میں 1016ء سے؛ آخری دعوے 1057ء کے لگ بھگ۔"
  es: "Califato reclamado por los hammudíes, descendientes de los idrisíes, en Córdoba y Málaga durante la fitna de al-Ándalus, desde el año 1016 d. C., desvaneciéndose sus últimas pretensiones alrededor del año 1057."
  fr: "Un califat revendiqué par les Hammudides, descendants des Idrissides, à Cordoue et à Malaga pendant la fitna d'al-Andalus, à partir de 1016 de notre ère, leurs dernières prétentions s'estompant vers 1057."
  tr: "1016 yılından itibaren Endülüs kargaşaları sırasında Cordoba ve Malaga'da Al-Hammudi Alevileri tarafından talep edilen bir halifelik, son iddiaları yaklaşık 1057 yılında ortaya çıkmıştır."
  id: "Sebuah kekhalifahan yang diklaim oleh Alawit Al-Hammudi di Cordoba dan Malaga selama gejolak Andalusia sejak tahun 1016 M, dengan klaim terakhir mereka muncul sekitar tahun 1057 M."
