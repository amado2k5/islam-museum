label:
  ar: الدولة المرداسية
  en: Mirdasid dynasty
  es: "Dinastía Mirdasí"
  fr: "Dynastie mirdaside"
  ur: "میرداسید خاندان"
  tr: "Mardasi Devleti"
  id: "Negara Mardasi"
summary:
  ar: "دولة بني صالح بن مرداس من بني كلاب بن عامر بن صعصعة بحلب وما بينها إلى عنه؛ ابتدأها صالح بملك الرحبة ثم استولى على حلب من يد ابن شعبان الكتامي سنة 424هـ فاتسع ملكه من بعلبك إلى عنه، وبعد مهلكه سنة 429هـ تداولها بنوه نصر ⁦(شبل الدولة)⁩ وثمال حتى انقرضت دولتهم مع ظهور ملوك السلاجقة بالشام."
  en: "The state of Banu Salih ibn Mirdas of Banu Kilab ibn Amir ibn Sa'sa'a at Aleppo and the lands down to Ana; Salih began by taking al-Rahba, then seized Aleppo from Ibn Sha'ban al-Katami in 424 AH so his realm stretched from Baalbek to Ana — after his death in 429 his sons Nasr (Shibl al-Dawla) and Thimal held it until their line ended with the rise of the Seljuk kings in Syria."
  es: "El estado de Banu Salih ibn Mirdas de Banu Kilab ibn Amir ibn Sa'sa'a en Alepo y las tierras hasta Ana; Salih comenzó tomando al-Rahba, luego tomó Alepo de Ibn Sha'ban al-Katami en 424 AH por lo que su reino se extendía desde Baalbek hasta Ana; después de su muerte en 429, sus hijos Nasr (Shibl al-Dawla) y Thimal lo mantuvieron hasta que su linaje terminó con el ascenso de los reyes selyúcidas en Siria."
  fr: "L'État de Banu Salih ibn Mirdas de Banu Kilab ibn Amir ibn Sa'sa'a à Alep et les terres jusqu'à Ana; Salih commença par prendre al-Rahba, puis s'empara d'Alep à Ibn Sha'ban al-Katami en 424 AH, de sorte que son royaume s'étendait de Baalbek à Ana — après sa mort en 429, ses fils Nasr (Shibl al-Dawla) et Thimal le détenaient jusqu'à ce que leur lignée s'éteigne avec la montée des rois seldjoukides en Syrie."
  ur: "حلب میں بنو صالح بن مرداس بنو کلاب ابن عامر بن صاعع کی حالت اور عناء تک کی زمینیں؛ صالح نے الرحبہ کو لے کر شروع کیا، پھر 424 ہجری میں ابن شعبان الکاتمی سے حلب پر قبضہ کر لیا تو اس کا دائرہ بعلبک سے عناء تک پھیلا ہوا تھا - 429 میں اس کی موت کے بعد اس کے بیٹوں نصر ⁦(شبل الدولہ)⁩ اور تھیمل نے اسے اس وقت تک اپنے پاس رکھا جب تک کہ ان کا سلسلہ شام میں سلجوق کے عروج کے ساتھ ختم نہ ہوا۔"
  tr: "Banu Salih ibn Mirdas'ın devleti, Halep'teki Banu Kilab ibn Amir ibn Sa'sa'a'dan ve çevresinden ona kadar; Salih bunu Al-Rahbah yönetimiyle başlattı, ardından 424 Hicri yılında Halep'i İbn Şaban el-Katemi'den aldı ve yönetimi Baalbek'ten An'sa'a'ya kadar genişledi. 429 Hicri'ndeki düşüşünden sonra, Banu Nasr (Şibl al-Dawla) ve Thumal tarafından yönetildi; ancak Levant'ta Selçuklu krallarının yükselişiyle devletleri sona erdi."
  id: "Negara Banu Salih ibn Mirdas dari Banu Kilab ibn Amir ibn Sa'sa'a di Aleppo dan sekitarnya hingga kepadanya; Salih memulainya dengan pemerintahan Al-Rahbah, kemudian merebut Aleppo dari Ibn Sha'ban al-Katami pada tahun 424 H, dan pemerintahannya meluas dari Baalbek hingga An'sa'a. Setelah kejatuhannya pada tahun 429 H, wilayah ini diperintah oleh Banu Nasr (Shibl al-Dawla) dan Thumal hingga negara mereka punah dengan munculnya raja-raja Seljuk di Levant."
