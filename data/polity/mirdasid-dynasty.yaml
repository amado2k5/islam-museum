  en: Mirdasid dynasty
summary:
  ar: "دولة بني صالح بن مرداس من بني كلاب بن عامر بن صعصعة بحلب وما بينها إلى عنه؛ ابتدأها صالح بملك الرحبة ثم استولى على حلب من يد ابن شعبان الكتامي سنة 424هـ فاتسع ملكه من بعلبك إلى عنه، وبعد مهلكه سنة 429هـ تداولها بنوه نصر (شبل الدولة) وثمال حتى انقرضت دولتهم مع ظهور ملوك السلاجقة بالشام."
  en: "The state of Banu Salih ibn Mirdas of Banu Kilab ibn Amir ibn Sa'sa'a at Aleppo and the lands down to Ana; Salih began by taking al-Rahba, then seized Aleppo from Ibn Sha'ban al-Katami in 424 AH so his realm stretched from Baalbek to Ana — after his death in 429 his sons Nasr (Shibl al-Dawla) and Thimal held it until their line ended with the rise of the Seljuk kings in Syria."
