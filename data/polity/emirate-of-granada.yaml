summary:
  ar: "آخر السلالات الإسلامية الكبرى في شبه الجزيرة الإيبيرية، حكمها بنو نصر أو بنو الأحمر من غرناطة، وبدأ المؤسس محمد بن يوسف بن نصر دولته في أرجونة سنة 1232م ودخل غرناطة سنة 1237م. وحافظت المملكة على بقائها بالمعاهدات والجزية والتحالف مع المرينيين والتنقل بين قشتالة وأراغون، ثم أضعفها الانقسام الداخلي بين بوعبديل والزغل مع تفوق قشتالة في المدفعية، وسلّم بوعبديل غرناطة رسمياً في 2 كانون الثاني 1492م."
  en: "The last major Muslim dynasty of the Iberian Peninsula, ruled by the Nasrids or Banu al-Ahmar from Granada. Its founder, Muhammad b. Yusuf Ibn Nasr, began at Arjona in 1232 and entered Granada in 1237. The kingdom survived through treaties, tribute and alliances with the Marinids, then weakened through the split between Boabdil and al-Zaghal and Castile's growing artillery; Boabdil formally surrendered Granada on 2 January 1492."
  ur: "جزیرہ نمائے آئبیریا کا آخری بڑا مسلم خاندان، جس پر بنو نصر یا بنو الاحمر غرناطہ سے حکمران رہے۔ بانی محمد بن یوسف بن نصر نے 1232 میں ارجونہ سے آغاز کیا اور 1237 میں غرناطہ میں داخل ہوئے۔ سلطنت معاہدوں، خراج اور مرینیوں سے اتحاد کے ذریعے قائم رہی، پھر بوعبدیل اور الزغل کی تقسیم اور قشتالہ کے بڑھتے توپ خانے سے کمزور ہوئی؛ بوعبدیل نے 2 جنوری 1492 کو غرناطہ رسمی طور پر حوالے کیا."
  es: "La última gran dinastía musulmana de la península ibérica, gobernada por los nazaríes o Banu al-Ahmar desde Granada. Su fundador, Muhammad b. Yusuf Ibn Nasr, comenzó su reinado en Arjona en 1232 y entró en Granada en 1237. El reino sobrevivió gracias a tratados, tributos y alianzas con los mariníes, pero se debilitó posteriormente por la escisión entre Boabdil y al-Zaghal y el creciente poderío artillero de Castilla; Boabdil rindió formalmente Granada el 2 de enero de 1492."
  fr: "La dernière grande dynastie musulmane de la péninsule Ibérique, gouvernée par les Nasrides ou Banu al-Ahmar depuis Grenade. Son fondateur, Muhammad b. Yusuf Ibn Nasr, commença son règne à Arjona en 1232 et entra à Grenade en 1237. Le royaume survécut grâce à des traités, au tribut et à des alliances avec les Mérinides, puis s'affaiblit suite à la scission entre Boabdil et al-Zaghal et à la montée en puissance de l'artillerie castillane; Boabdil capitula officiellement à Grenade le 2 janvier 1492."
  tr: "İber Yarımadası'ndaki son büyük İslam hanedanları, Granada'nın Banu Nasr veya Banu al-Ahmar tarafından yönetildi. Kurucu Muhammed ibn Yusuf ibn Nasr, 1232 yılında Argonaut'ta devletini kurdu ve 1237 yılında Granada'ya girdi. Krallık, varlığını antlaşmalar, haraç ödemeleri, Marinidlerle ittifaklar ve Kastilya ile Aragon arasındaki hareketlerle sürdürdü. Bu durum, Kastilya'nın topçu üstünlüğü nedeniyle Bou Abil ile Zaghl arasındaki iç bölünmeyle daha da zayıfladı. Bou Bidil, 2 Ocak 1492'de Granada'yı resmen devretti."
  id: "Dinasti Islam besar terakhir di Semenanjung Iberia diperintah oleh Banu Nasr atau Banu al-Ahmar dari Granada. Pendiri Muhammad ibn Yusuf ibn Nasr memulai kerajaannya di Argonaut pada tahun 1232 M dan memasuki Granada pada tahun 1237 M. Kerajaan ini mempertahankan keberadaannya melalui perjanjian, upeti, aliansi dengan Marinid, dan pergerakan antara Kastilia dan Aragon. Hal ini semakin melemah akibat perpecahan internal antara Bou Abil dan Zaghl akibat keunggulan Kastilia dalam artileri. Bou Bidil secara resmi menyerahkan Granada pada 2 Januari 1492 M."
