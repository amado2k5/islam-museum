label:
  ar: مملكة غرناطة
  en: Emirate of Granada
summary:
  ar: "آخر السلالات الإسلامية الكبرى في شبه الجزيرة الإيبيرية، حكمها بنو نصر أو بنو الأحمر من غرناطة، وبدأ المؤسس محمد بن يوسف بن نصر دولته في أرجونة سنة 1232م ودخل غرناطة سنة 1237م. وحافظت المملكة على بقائها بالمعاهدات والجزية والتحالف مع المرينيين والتنقل بين قشتالة وأراغون، ثم أضعفها الانقسام الداخلي بين بوعبديل والزغل مع تفوق قشتالة في المدفعية، وسلّم بوعبديل غرناطة رسمياً في 2 كانون الثاني 1492م."
  en: "The last major Muslim dynasty of the Iberian Peninsula, ruled by the Nasrids or Banu al-Ahmar from Granada. Its founder, Muhammad b. Yusuf Ibn Nasr, began at Arjona in 1232 and entered Granada in 1237. The kingdom survived through treaties, tribute and alliances with the Marinids, then weakened through the split between Boabdil and al-Zaghal and Castile's growing artillery; Boabdil formally surrendered Granada on 2 January 1492."
  ur: "جزیرہ نمائے آئبیریا کا آخری بڑا مسلم خاندان، جس پر بنو نصر یا بنو الاحمر غرناطہ سے حکمران رہے۔ بانی محمد بن یوسف بن نصر نے 1232 میں ارجونہ سے آغاز کیا اور 1237 میں غرناطہ میں داخل ہوئے۔ سلطنت معاہدوں، خراج اور مرینیوں سے اتحاد کے ذریعے قائم رہی، پھر بوعبدیل اور الزغل کی تقسیم اور قشتالہ کے بڑھتے توپ خانے سے کمزور ہوئی؛ بوعبدیل نے 2 جنوری 1492 کو غرناطہ رسمی طور پر حوالے کیا."
