summary:
  ar: "أسرة تركمانية كانت من حرّاس الثغور للسلاجقة على حدودهم الغربية، عمّرت غورغورم ثم بيشهري وأقامت إمارة في تلك الناحية من الأناضول في النصف الثاني من القرن السابع الهجري (الثالث عشر الميلادي)، وأشهر أمرائها سيف الدين سليمان بك، الذي توفي سنة 702هـ (1302م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}"
  en: "A Turkoman family which served the Saljuqs of Rum as march-wardens on their western frontier, embellished Gorgurum and then Beyshehri, and established a principality in that region of Anatolia in the second half of the seventh/thirteenth century; its best-known amir, Sayf al-Din Sulayman Bey, died in 702 AH (1302) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}"
