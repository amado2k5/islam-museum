label:
  ar: "بنو أشرف أوغلو"
  en: "Ashraf-oghullari"
  es: "Ashraf-oghullari"
  fr: "Ashraf-Oghullari"
  ur: "اشرف اوغلیری"
summary:
  ar: "أسرة تركمانية كانت من حرّاس الثغور للسلاجقة على حدودهم الغربية، عمّرت غورغورم ثم بيشهري وأقامت إمارة في تلك الناحية من الأناضول في النصف الثاني من القرن السابع الهجري ⁦(الثالث عشر الميلادي)⁩، وأشهر أمرائها سيف الدين سليمان بك، الذي توفي سنة 702هـ ⁦(1302م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}"
  en: "A Turkoman family which served the Saljuqs of Rum as march-wardens on their western frontier, embellished Gorgurum and then Beyshehri, and established a principality in that region of Anatolia in the second half of the seventh/thirteenth century; its best-known amir, Sayf al-Din Sulayman Bey, died in 702 AH (1302) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}"
  es: "Una familia turcomana que sirvió a los selyúcidas de Rum como guardianes de la frontera occidental, embelleció Gorgurum y luego Beyshehri, y estableció un principado en esa región de Anatolia en la segunda mitad del siglo VII/XIII; su emir más conocido, Sayf al-Din Sulayman Bey, murió en el año 702 de la Hégira (1302). {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}"
  fr: "Une famille turkmène, qui servait les Seldjoukides de Roum comme gardes de marche sur leur frontière occidentale, embellit Gorgurum puis Beyshehri et établit une principauté dans cette région d'Anatolie dans la seconde moitié du VIIe/XIIIe siècle; son émir le plus connu, Sayf al-Din Sulayman Bey, mourut en 702 AH (1302) {cite:encyclopaedia-of-islam-2 vol. 1 p. 751}"
  ur: "ایک ترکمان خاندان جس نے رم کے سلجوقوں کی اپنی مغربی سرحد پر مارچ وارڈنز کے طور پر خدمت کی، گورگورم اور پھر بیشہری کو سجایا، اور ساتویں/تیرہویں صدی کے دوسرے نصف میں اناطولیہ کے اس علاقے میں ایک سلطنت قائم کی۔ اس کے مشہور امیر سیف الدین سلیمان بی کی وفات 702ھ (1302) میں ہوئی۔ 1 ص۔ 751}"
