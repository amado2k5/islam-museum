summary:
  ar: "بطاقة أولية للدولة الأغلبية، إمارة بني الأغلب في إفريقية من تولية إبراهيم بن الأغلب سنة ١٨٤هـ/٨٠٠م حتى سقوطها بيد الفاطميين سنة ٢٩٦هـ/٩٠٩م، وفتحت صقلية وبنت الجامع الكبير بصفاقس؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Aghlabid emirate, the house of Banu al-Aghlab ruling Ifriqiya from Ibrahim ibn al-Aghlab's investiture in 184/800 until the Fatimid takeover in 296/909 — conquerors of Sicily and builders of Sfax's Great Mosque; its sources are not yet checked on the page."
  es: "Ficha de borrador para el emirato aglabí, la casa de Banu al-Aghlab que gobernó Ifriqiya desde la investidura de Ibrahim ibn al-Aghlab en 184/800 hasta la toma del poder por los fatimíes en 296/909; conquistadores de Sicilia y constructores de la Gran Mezquita de Sfax; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour l'émirat aghlabide, la maison des Banu al-Aghlab régnant sur l'Ifriqiya depuis l'investiture d'Ibrahim ibn al-Aghlab en 184/800 jusqu'à la prise de pouvoir fatimide en 296/909 — conquérants de la Sicile et bâtisseurs de la Grande Mosquée de Sfax; ses sources ne sont pas encore vérifiées sur la page."
