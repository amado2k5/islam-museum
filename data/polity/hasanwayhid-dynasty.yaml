label:
  ar: الدولة الحسنويهية
  en: Hasanwayhid dynasty
summary:
  ar: "دولة بني حسنويه بن الحسين الكردي من طائفة الريزنكاس عشيرة الدويلتية؛ ورث الملك عن خاليه ونداد وغانم ابني أحمد بن علي من أكراد العبابية فغلب على أطراف الدينور وهمذان ونهاوند والصامغان وبعض نواحي أذربيجان، وبنى قلعة سرماج بالصخور المهندسة وجامع الدينور، وتوفي سنة 369هـ فافترق ولده حتى اصطنع عضد الدولة من بينهم أبا النجم بدراً فقوى حتى هزم عساكر مشرف الدولة بقيادة قراتكين سنة 377هـ وقلده بهاء الدولة ولقب ناصر الدولة سنة 388هـ."
  en: "The state of the sons of Hasanwayh ibn al-Husayn the Kurd, of the Rizankas' Duwaylatiyya clan; he inherited kingship from his uncles Wandad and Ghanim ibn Ahmad ibn Ali of the Abbabiyya Kurds, mastering the Dinawar, Hamadan, Nihawand and Samaghan marches into Azerbaijan's edge, built Sarmij castle of dressed stone and Dinawar's mosque, and died in 369 — his sons scattered until Adud al-Dawla raised Abu al-Najm Badr, who crushed Musharrif al-Dawla's host under Qaratikin in 377 and received Baha' al-Dawla's investiture and the laqab Nasir al-Dawla in 388."
