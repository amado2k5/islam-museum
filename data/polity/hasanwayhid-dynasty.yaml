id: polity/hasanwayhid-dynasty
class: polity
kind: dynasty
label:
  ar: الدولة الحسنويهية
  en: Hasanwayhid dynasty
  es: "Dinastía Hasanwayhid"
  fr: "dynastie des Hasanwayhides"
  ur: "حسن وحید خاندان"
  tr: "Hassanouih Devleti"
  id: "Negara Bagian Hassanouih"
summary:
  ar: "دولة بني حسنويه بن الحسين الكردي من طائفة الريزنكاس عشيرة الدويلتية؛ ورث الملك عن خاليه ونداد وغانم ابني أحمد بن علي من أكراد العبابية فغلب على أطراف الدينور وهمذان ونهاوند والصامغان وبعض نواحي أذربيجان، وبنى قلعة سرماج بالصخور المهندسة وجامع الدينور، وتوفي سنة 369هـ فافترق ولده حتى اصطنع عضد الدولة من بينهم أبا النجم بدراً فقوى حتى هزم عساكر مشرف الدولة بقيادة قراتكين سنة 377هـ وقلده بهاء الدولة ولقب ناصر الدولة سنة 388هـ."
  en: "The state of the sons of Hasanwayh ibn al-Husayn the Kurd, of the Rizankas' Duwaylatiyya clan; he inherited kingship from his uncles Wandad and Ghanim ibn Ahmad ibn Ali of the Abbabiyya Kurds, mastering the Dinawar, Hamadan, Nihawand and Samaghan marches into Azerbaijan's edge, built Sarmij castle of dressed stone and Dinawar's mosque, and died in 369 — his sons scattered until Adud al-Dawla raised Abu al-Najm Badr, who crushed Musharrif al-Dawla's host under Qaratikin in 377 and received Baha' al-Dawla's investiture and the laqab Nasir al-Dawla in 388."
  es: "El estado de los hijos de Hasanwayh ibn al-Husayn el kurdo, del clan Duwaylatiyya de los Rizankas; heredó el reino de sus tíos Wandad y Ghanim ibn Ahmad ibn Ali de los kurdos Abbabiyya, dominó las marchas de Dinawar, Hamadan, Nihawand y Samaghan hacia las fronteras de Azerbaiyán, construyó el castillo de piedra labrada de Sarmij y la mezquita de Dinawar al-Najm Badr, quien aplastó a las huestes de Musharrif al-Dawla bajo Qaratikin en 377 y recibió a Bahá'. La investidura de al-Dawla y el título de Nasir al-Dawla en 388 d.C."
  fr: "L'état des fils de Hasanwayh ibn al-Husayn le Kurde, du clan Duwaylatiyya des Rizankas; il a hérité du royaume de ses oncles Wandad et Ghanim ibn Ahmad ibn Ali des Kurdes Abbabiyya, a maîtrisé les marches de Dinawar, Hamadan, Nihawand et Samaghan jusqu'aux frontières de l'Azerbaïdjan, a construit le château de Sarmij en pierre de taille et la mosquée de Dinawar al-Najm Badr, qui a écrasé l'armée de Musharrif al-Dawla sous Qaratikin en 377 et a reçu l'investiture de Baha' al-Dawla. et le titre de Nasir al-Dawla en 388 CE."
  ur: "رزانکس کے دوئیلتیہ قبیلے کے حسن وے بن الحسین کرد کے بیٹوں کی حالت؛ اس نے بادشاہی اپنے چچا وانداد اور عبابیہ کردوں کے غنیم ابن احمد ابن علی سے وراثت میں حاصل کی، دیناور، ہمدان، نہاوند اور سمغان میں مہارت حاصل کی، آذربائیجان کے کنارے تک مارچ کیا، ملبوس پتھروں کا سرمج قلعہ اور دیناور کی مسجد المعروف النساء المعروف مسجد الحرام تعمیر کیا۔ 377 میں قراتکین کے زیر انتظام اور 388 عیسوی میں بہاء الدولہ کی سرمایہ کاری اور ناصر الدولہ کا لقب حاصل کیا۔"
  tr: "Riznakas mezhebi, Duwailitiya klanından Banu Hasanawayh ibn al-Husayn al-Kurdi devleti; krallığı, annesinin kardeşleri Wandad ve Ghanem'den, Ababid Kürtlerinden Ahmad ibn Ali'nin oğulları olan Wandad ve Ghanem'den miras aldı; Dinawar, Hamazan, Nahavand, Samghan ve Azerbaycan'ın bazı bölgelerine hakim oldu. Mühendislik taşlarından Sarmaj kalesini ve Dinur Camii'ni inşa etti. 369 Hicri'de öldü ve oğulları ayrıldı; ta ki el-Devla'nın desteğini sağlayana kadar; aralarında Ebu el-Necm Bedr de vardı. 377 Hicri'de Qaratkin liderliğindeki Muşrif el-Devle'nin güçlerini yenene kadar kendini güçlendirdi, ona Baha' al-Dawla unvanını verdi ve 388 Hicri'de Nasir al-Dawla unvanını aldı."
  id: "Negara Banu Hasanawayh ibn al-Husayn al-Kurdi dari sekte Riznakas, klan Duwailitiya; ia mewarisi kerajaan dari pamannya dari pihak ibu, Wandad dan Ghanem, putra Ahmad ibn Ali dari Kurdi Ababi, menguasai pinggiran Dinawar, Hamazan, Nahavand, Samghan, dan beberapa wilayah Azerbaijan. Ia membangun benteng Sarmaj dengan batu rekayasa dan Masjid Dinur. Ia meninggal pada tahun 369 H, dan putra-putranya terpisah hingga ia membangun dukungan al-Dawla, termasuk Abu al-Najm Badr. Ia memperkuat dirinya hingga mengalahkan pasukan Mushrif al-Dawla yang dipimpin oleh Qaratkin pada tahun 377 H, menganugerahkan Baha' al-Dawla kepadanya, dan diberi gelar Nasir al-Dawla pada tahun 388 H."
