label:
  ar: الدولة الطولونية
  en: Tulunid dynasty
  ur: "طولونی سلطنت"
  es: "Dinastía tuluní"
  fr: "Dynastie toulunide"
summary:
  ar: "دولة أحمد بن طولون وبنيه ومواليه بني طغج بمصر والشام؛ دخل أحمد مصر في رمضان سنة 254هـ خليفة عن باكبك فاستقل بها وجمع إليها الشام، وبنى القطائع شرقي الفسطاط، وخلفه ابنه خمارويه فالجيش فهارون حتى فشلت دولتهم وعاث القرامطة بالشام، فبعث المكتفي محمد بن سليمان الكاتب فاسترد الشام ودخل مصر وقيد بني طولون وأحرق القطائع سنة 292هـ فانقرضت دولتهم."
  en: "The state of Ahmad ibn Tulun, his sons and his mawali Banu Tughj in Egypt and Syria; Ahmad entered Egypt in Ramadan 254 AH as Bayakbak's deputy, made it independent, joined Syria to it and built al-Qata'i' east of Fustat — succeeded by his sons Khumarawayh, al-Jaysh and Harun until their state failed and the Qarmatians ravaged Syria, whereupon al-Muqtafi sent Muhammad ibn Sulayman al-Katib who retook Syria, entered Egypt, chained the Banu Tulun and burned al-Qata'i' in 292 AH, ending their dynasty."
  ur: "احمد بن طولون اور ان کے جانشینوں کی مصر اور شام میں حکومت۔ احمد بن طولون نے قطائع تعمیر کیا؛ بعد میں عباسی فوج کی مصر واپسی پر اس خاندان کی حکومت ختم ہوئی۔ {cite:tarikh-ibn-khaldun-ibar}"
  es: "El estado de Ahmad ibn Tulun, sus hijos y su mawali Banu Tughj en Egipto y Siria; Ahmad entró en Egipto en Ramadán del 254 AH como lugarteniente de Bayakbak, lo independizó, unió Siria a él y construyó al-Qata'i' al este de Fustat, siendo sucedido por sus hijos Khumarawayh, al-Jaysh y Harun hasta que su estado fracasó y los cármatas asolaron Siria, tras lo cual al-Muqtafi envió a Muhammad ibn Sulayman al-Katib, quien reconquistó Siria, entró en Egipto, encadenó a los Banu Tulun y quemó al-Qata'i' en el 292 AH, poniendo fin a su dinastía."
  fr: "L'État d'Ahmad ibn Tulun, de ses fils et de ses mawali Banu Tughj en Égypte et en Syrie; Ahmad entra en Égypte en Ramadan 254 AH en tant que représentant de Bayakbak, la rendit indépendante, y rattacha la Syrie et construisit al-Qata'i' à l'est de Fustat — lui succéda ses fils Khumarawayh, al-Jaysh et Harun jusqu'à ce que leur État s'effondre et que les Qarmates ravagent la Syrie, après quoi al-Muqtafi envoya Muhammad ibn Sulayman al-Katib qui reprit la Syrie, entra en Égypte, enchaîna les Banu Tulun et incendia al-Qata'i' en 292 AH, mettant fin à leur dynastie."
