label:
  ar: الدولة الطولونية
  en: Tulunid dynasty
  ur: "طولونی سلطنت"
summary:
  ar: "دولة أحمد بن طولون وبنيه ومواليه بني طغج بمصر والشام؛ دخل أحمد مصر في رمضان سنة 254هـ خليفة عن باكبك فاستقل بها وجمع إليها الشام، وبنى القطائع شرقي الفسطاط، وخلفه ابنه خمارويه فالجيش فهارون حتى فشلت دولتهم وعاث القرامطة بالشام، فبعث المكتفي محمد بن سليمان الكاتب فاسترد الشام ودخل مصر وقيد بني طولون وأحرق القطائع سنة 292هـ فانقرضت دولتهم."
  en: "The state of Ahmad ibn Tulun, his sons and his mawali Banu Tughj in Egypt and Syria; Ahmad entered Egypt in Ramadan 254 AH as Bayakbak's deputy, made it independent, joined Syria to it and built al-Qata'i' east of Fustat — succeeded by his sons Khumarawayh, al-Jaysh and Harun until their state failed and the Qarmatians ravaged Syria, whereupon al-Muqtafi sent Muhammad ibn Sulayman al-Katib who retook Syria, entered Egypt, chained the Banu Tulun and burned al-Qata'i' in 292 AH, ending their dynasty."
  ur: "احمد بن طولون اور ان کے جانشینوں کی مصر اور شام میں حکومت۔ احمد بن طولون نے قطائع تعمیر کیا؛ بعد میں عباسی فوج کی مصر واپسی پر اس خاندان کی حکومت ختم ہوئی۔ {cite:tarikh-ibn-khaldun-ibar}"
