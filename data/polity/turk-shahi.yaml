summary:
  ar: "بطاقة أولية للشاهية التركية، ملوك كابل وزابلستان الذين قاوموا الفتوحات العربية حتى القرن التاسع؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Turk Shahis, the kings of Kabul and Zabulistan who resisted the Arab conquests into the ninth century; its sources are not yet checked on the page."
  es: "Ficha de borrador para los shahis turcos, los reyes de Kabul y Zabulistán que resistieron las conquistas árabes hasta el siglo IX; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour les Shahis turcs, les rois de Kaboul et de Zabulistan qui ont résisté aux conquêtes arabes jusqu'au IXe siècle; ses sources ne sont pas encore vérifiées sur la page."
  ur: "ترک شاہیوں، کابل اور زابلستان کے بادشاہوں کے لیے ڈرافٹ کارڈ جنہوں نے نویں صدی میں عرب فتوحات کے خلاف مزاحمت کی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Türk kraliyet ailesinin, Arap fetihlerine dokuzuncu yüzyıla kadar direnen Kabil ve Zabulistan krallarının ön kartı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal dari kerajaan Turki, raja-raja Kabul dan Zabulistan yang melawan penaklukan Arab hingga abad kesembilan; sumber-sumbernya di halaman tersebut belum ditinjau."
