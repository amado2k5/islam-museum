label:
  ar: الدولة السليمانية بمكة
  en: Sulaymanid sharifate of Mecca
summary:
  ar: "دولة السليمانيين من بني الحسن بمكة ثم باليمن؛ لما انقرض سكان مكة من قريش بعد المائة الثانية بالفتن الواقعة بالحجاز حدثت الرياسة فيها لبني سليمان بن داود بن حسن المثنى، وكان كبيرهم آخر المائة الثانية محمد بن سليمان الملقب بالزيدي نسبة إلى نحلته من مذاهب الإمامية، وهو الذي وافاه يوم التروية بمكة أبو طاهر القرمطي فنهب الحاج سنة 317هـ، ودامت إمارتهم بمكة في فتن العلويين والقرامطة ثم انقرض أمرهم."
  en: "The Sulaymanid state of the Hasanids at Mecca and later Yemen; when Quraysh's folk died out of Mecca in the second-century fitnas the ra'asa arose for the Banu Sulayman ibn Dawud ibn Hasan al-Muthanna — their chief Muhammad ibn Sulayman 'al-Zaydi' (after his Imami creed), the amir whom Abu Tahir al-Qarmati met on the Day of Tarwiya and slaughtered the pilgrims in 317 — their emirate lasted through the Alid-Qarmatian wars until it faded."
