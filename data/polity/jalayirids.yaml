label:
  ar: الجلائريون
  en: Jalayirids
  ur: جلایری
summary:
  ar: "الجلائريون أسرة حاكمة انحدرت من قبيلة مغولية، وكانت من الدول التي تقاسمت أراضي الإلخانيين بعد وفاة أبي سعيد سنة 736هـ/1335م. أسسها الحسن بزرگ، واتخذت بغداد وتبريز مركزين لها، وبلغت ذروتها في عهد أويس، ثم أضعفها الصراع بين الإخوة وغزو تيمور، وسقط آخر أمرائها في حصار الحلة نحو سنة 835هـ/1432م {cite:encyclopaedia-of-islam-2 vol. 2 p. 426}."
  en: "The Jalayirids were a dynasty descended from a Mongol tribe, one of the successor states that divided the lands of the Ilkhanate after Abu Said died in 736/1335. Founded by Hasan Buzurg, they ruled from Baghdad and Tabriz, reached their height under Uways, and were weakened by quarrels among brothers and by Timur's invasions; their last prince fell during the siege of Hilla in about 835/1432 {cite:encyclopaedia-of-islam-2 vol. 2 p. 426}."
  ur: "جلایری ایک منگول قبیلے سے نکلا ہوا حکمران خاندان تھے اور ان ریاستوں میں سے ایک تھے جنہوں نے 736ھ/1335ء میں ابو سعید کی وفات کے بعد ایل خانی سلطنت کے علاقے آپس میں بانٹ لیے۔ اس کے بانی حسن بزرگ تھے، بغداد اور تبریز ان کے مراکز رہے، اویس کے عہد میں انہیں عروج ملا، پھر بھائیوں کی کشمکش اور تیمور کے حملوں نے انہیں کمزور کیا، اور ان کا آخری شہزادہ تقریباً 835ھ/1432ء میں حلہ کے محاصرے میں مارا گیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 426}."
