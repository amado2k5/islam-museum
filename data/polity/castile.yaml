summary:
  ar: "بطاقة أولية لمملكة قشتالة، المملكة النصرانية التي كانت أعظم خصوم الأندلس فالتقت معها في التاج مع ليون ثم قادت سقوط طوائفها، وردت في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم تُراجع أخبارها في تاريخ الإسلام لحسن إبراهيم على الصفحة بعد."
  en: "Draft card for the Kingdom of Castile, the Christian kingdom that was al-Andalus's greatest counterpart — joined to Leon and leading the fall of the taifa states — named from an open reference description (Wikidata); its coverage in Hasan Ibrahim's Tarikh al-Islam is not yet checked on the page."
  es: "Ficha preliminar del Reino de Castilla, el reino cristiano que fue la contraparte más importante de al-Ándalus —unido a León y que lideró la caída de los estados taifa—, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su cobertura en el Tarikh al-Islam de Hasan Ibrahim aún no se ha verificado en la página."
  fr: "Fiche provisoire du royaume de Castille, le royaume chrétien qui était le plus grand rival d'al-Andalus — uni à León et à l'origine de la chute des États taïfa — nommé d'après une description de référence ouverte (Wikidata); sa couverture dans le Tarikh al-Islam de Hasan Ibrahim n'est pas encore vérifiée sur la page."
  ur: "کاسٹائل کی بادشاہی کے لیے ڈرافٹ کارڈ، عیسائی بادشاہی جو کہ الاندلس کی سب سے بڑی ہم منصب تھی — لیون میں شامل ہوئی اور طائفہ ریاستوں کے زوال کا باعث بنی — جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے لیا گیا؛ حسن ابراہیم کی تاریخ الاسلام میں اس کی کوریج ابھی تک صفحہ پر چیک نہیں کی گئی ہے۔"
  tr: "Endülüs'ün en büyük rakibi olan Hristiyan krallığı, León ile taç kurmuş ve ardından mezheplerinin çöküşüne öncülük eden Hristiyan krallığı hakkında ön bir kart açık bir açıklamada (Wikidata) yer almaktadır. Hassan İbrahim'in İslam Tarihi haberleri henüz sayfada incelenmemiştir."
  id: "Kartu awal Kerajaan Kastilia, kerajaan Kristen yang merupakan rival terbesar Andalusia, yang memilikinya dalam mahkota bersama León dan kemudian memimpin kejatuhan sekte-sektenya, disebutkan dalam deskripsi referensi terbuka (Wikidata). Berita sejarah Islam oleh Hassan Ibrahim belum ditinjau di halaman tersebut."
