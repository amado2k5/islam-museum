label:
  ar: الدولة الغورية
  en: Ghurid dynasty
  ur: "غوری سلطنت"
summary:
  ar: "دولة بني حسين ملوك الغور القائمين بالدولة بعد بني سبكتكين؛ كانوا ملوكاً على بلاد الغور أيام سبكتكين واستفحل ملكهم من بيروزكوه، فلما قتل بهرام شاه الغزنوي محمداً بن حسين وصلب أخاه شوري على باب غزنة، سار أخوهم علاء الدين الحسين فملك غزنة سنة 547هـ وأحرقها، ثم استقرت الدولة لابني أخيه غياث الدين وشهاب الدين فدوخا خراسان وبلاد الهند حتى أقطع شهاب الدين دلهي لقطب الدين أيبك."
  en: "The Ghurid state, kings of Ghor who held the sultanate after the Ghaznavids; mountain kings at Firuzkuh in Subuktigin's days, when Bahramshah of Ghazna killed Muhammad ibn al-Husayn and crucified his brother Suri at Ghazna's gate their brother Ala al-Din al-Husayn marched in 547 AH, took and burned the city — then the state settled with his nephews Ghiyath al-Din and Shihab al-Din who overran Khurasan and India until Shihab al-Din granted Delhi as iqta' to Qutb al-Din Aybak."
  ur: "غور کے حکمرانوں کی سلطنت، جس نے غزنویوں کے بعد خراسان اور ہندوستان میں اقتدار پھیلایا۔ موجودہ اندراج میں فیروزکوہ اور غیاث الدین و شہاب الدین کے ادوار کا ذکر ہے۔ {cite:tarikh-ibn-khaldun-ibar}"
