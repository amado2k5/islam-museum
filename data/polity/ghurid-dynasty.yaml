label:
  ar: الدولة الغورية
  en: Ghurid dynasty
  ur: "غوری سلطنت"
  es: "Dinastía Ghurid"
  fr: "Dynastie des Ghurides"
summary:
  ar: "دولة بني حسين ملوك الغور القائمين بالدولة بعد بني سبكتكين؛ كانوا ملوكاً على بلاد الغور أيام سبكتكين واستفحل ملكهم من بيروزكوه، فلما قتل بهرام شاه الغزنوي محمداً بن حسين وصلب أخاه شوري على باب غزنة، سار أخوهم علاء الدين الحسين فملك غزنة سنة 547هـ وأحرقها، ثم استقرت الدولة لابني أخيه غياث الدين وشهاب الدين فدوخا خراسان وبلاد الهند حتى أقطع شهاب الدين دلهي لقطب الدين أيبك."
  en: "The Ghurid state, kings of Ghor who held the sultanate after the Ghaznavids; mountain kings at Firuzkuh in Subuktigin's days, when Bahramshah of Ghazna killed Muhammad ibn al-Husayn and crucified his brother Suri at Ghazna's gate their brother Ala al-Din al-Husayn marched in 547 AH, took and burned the city — then the state settled with his nephews Ghiyath al-Din and Shihab al-Din who overran Khurasan and India until Shihab al-Din granted Delhi as iqta' to Qutb al-Din Aybak."
  ur: "غور کے حکمرانوں کی سلطنت، جس نے غزنویوں کے بعد خراسان اور ہندوستان میں اقتدار پھیلایا۔ موجودہ اندراج میں فیروزکوہ اور غیاث الدین و شہاب الدین کے ادوار کا ذکر ہے۔ {cite:tarikh-ibn-khaldun-ibar}"
  es: "El estado gúrida, reyes de Ghor que mantuvieron el sultanato después de los gaznávidas; reyes de las montañas en Firuzkuh en los días de Subuktigin, cuando Bahramshah de Ghazna mató a Muhammad ibn al-Husayn y crucificó a su hermano Suri en la puerta de Ghazna su hermano Ala al-Din al-Husayn marchó en 547 AH, tomó y quemó la ciudad, luego el estado se estableció con sus sobrinos Ghiyath al-Din y Shihab al-Din que invadieron Jorasán e India hasta que Shihab al-Din otorgó Delhi como iqta' a Qutb al-Din Aybak."
  fr: "L'État ghuride, rois de Ghor qui détenaient le sultanat après les Ghaznévides; rois des montagnes à Firuzkuh à l'époque de Subuktigin, lorsque Bahramshah de Ghazna tua Muhammad ibn al-Husayn et crucifia son frère Suri à la porte de Ghazna, leur frère Ala al-Din al-Husayn marcha en 547 AH, prit et incendia la ville — puis l'État fut confié à ses neveux Ghiyath al-Din et Shihab al-Din qui envahirent le Khorasan et l'Inde jusqu'à ce que Shihab al-Din accorde Delhi comme iqta' à Qutb al-Din Aybak."
