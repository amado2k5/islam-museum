id: polity/hamdanid-dynasty
class: polity
kind: dynasty
label:
  ar: الدولة الحمدانية
  en: Hamdanid dynasty
  ur: "حمدانی سلطنت"
  es: "Dinastía Hamdaní"
  fr: "dynastie hamdanide"
  tr: "Hamdanid devleti"
  id: "Negara Hamdanid"
summary:
  ar: "دولة بني حمدان بن حمدون بن الحارث التغلبية، من بني تغلب بن وائل أهل الجزيرة؛ بدأت بالرياسة على الموصل لما ولي المكتفي أبا الهيجاء عبد اللّه بن حمدان عليها، ثم امتدت إلى الجزيرة والشام واستقرت بأمرائها الكبار ناصر الدولة على الموصل وسيف الدولة على حلب، مستبدة بالدعوة العباسية، على وصف ابن خلدون."
  en: "The state of the Banu Hamdan ibn Hamdun al-Taghlibi, of Banu Taghlib ibn Wa'il of the Jazira; it began with authority over Mosul when al-Muktafi appointed Abu al-Hayja Abd Allah ibn Hamdan over it, then extended through the Jazira and Syria, settling under its great amirs Nasir al-Dawla at Mosul and Sayf al-Dawla at Aleppo, acting independently under the Abbasid call — in Ibn Khaldun's description."
  ur: "جزیرہ کے بنو تغلب سے بنو حمدان کی ریاست؛ موصل سے جزیرہ اور شام تک پھیلی، ناصر الدولہ موصل اور سیف الدولہ حلب کے امیر رہے، اور ابن خلدون کے مطابق عباسی دعوت کے تحت خود مختار حکمرانی کی۔ {cite:tarikh-ibn-khaldun-ibar}"
  es: "El estado de los Banu Hamdan ibn Hamdun al-Taghlibi, de los Banu Taghlib ibn Wa'il de la Jazira; comenzó con autoridad sobre Mosul cuando al-Muktafi nombró a Abu al-Hayja Abd Allah ibn Hamdan sobre ella, luego se extendió por la Jazira y Siria, estableciéndose bajo sus grandes emires Nasir al-Dawla en Mosul y Sayf al-Dawla en Alepo, actuando independientemente bajo el llamado abasí, en la descripción de Ibn Khaldun."
  fr: "L'État des Banu Hamdan ibn Hamdun al-Taghlibi, des Banu Taghlib ibn Wa'il de la Jazira; il commença par exercer son autorité sur Mossoul lorsque al-Muktafi nomma Abu al-Hayja Abd Allah ibn Hamdan à sa tête, puis s'étendit à travers la Jazira et la Syrie, s'établissant sous l'autorité de ses grands émirs Nasir al-Dawla à Mossoul et Sayf al-Dawla à Alep, agissant de manière indépendante sous l'appel des Abbassides — selon la description d'Ibn Khaldun."
  tr: "Banu Hamdan ibn Hamdun ibn al-Haris al-Taghlib, Banu Taghlib ibn Wa'il'den olan yarımadanın sakinleri, el-Muktafi Abu al-Hija Abdullah ibn Hamdan'ın Musul'un liderliğiyle başladı, ardından Cazire ve Şam'a kadar yayıldı ve büyük prensleri Nasir al-Dawla ile birlikte Musul'da, Sayf al-Dawla ile Halep'te yerleşti; İbn Haldun'un anlattığı gibi Abbasi çağrısına hakim oldular."
  id: "Negara Banu Hamdan ibn Hamdun ibn al-Harith al-Taghlib, dari Banu Taghlib ibn Wa'il, penduduk semenanjung, dimulai dengan kepemimpinan Mosul ketika al-Muktafi Abu al-Hija Abdullah ibn Hamdan mengambil alih, kemudian meluas ke Jazira dan Levant, dan menetap bersama pangeran besarnya Nasir al-Dawla atas Mosul dan Sayf al-Dawla atas Aleppo, mendominasi panggilan Abbasiyah seperti yang dijelaskan oleh Ibn Khaldun."
