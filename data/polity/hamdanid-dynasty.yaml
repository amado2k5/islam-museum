label:
  ar: الدولة الحمدانية
  en: Hamdanid dynasty
  ur: "حمدانی سلطنت"
summary:
  ar: "دولة بني حمدان بن حمدون بن الحارث التغلبية، من بني تغلب بن وائل أهل الجزيرة؛ بدأت بالرياسة على الموصل لما ولي المكتفي أبا الهيجاء عبد اللّه بن حمدان عليها، ثم امتدت إلى الجزيرة والشام واستقرت بأمرائها الكبار ناصر الدولة على الموصل وسيف الدولة على حلب، مستبدة بالدعوة العباسية، على وصف ابن خلدون."
  en: "The state of the Banu Hamdan ibn Hamdun al-Taghlibi, of Banu Taghlib ibn Wa'il of the Jazira; it began with authority over Mosul when al-Muktafi appointed Abu al-Hayja Abd Allah ibn Hamdan over it, then extended through the Jazira and Syria, settling under its great amirs Nasir al-Dawla at Mosul and Sayf al-Dawla at Aleppo, acting independently under the Abbasid call — in Ibn Khaldun's description."
  ur: "جزیرہ کے بنو تغلب سے بنو حمدان کی ریاست؛ موصل سے جزیرہ اور شام تک پھیلی، ناصر الدولہ موصل اور سیف الدولہ حلب کے امیر رہے، اور ابن خلدون کے مطابق عباسی دعوت کے تحت خود مختار حکمرانی کی۔ {cite:tarikh-ibn-khaldun-ibar}"
