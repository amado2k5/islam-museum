label:
  ar: بنو الرسي بصعدة
  en: Rassid Zaydi imamate of Sa'da
summary:
  ar: "بنو الرسي أئمة الزيدية بصعدة؛ من أعقاب القاسم الرسي بن إبراهيم طباطبا بن إسماعيل الديباج، وأول من خرج بها يحيى بن الحسين بن القاسم الرسي دعا لنفسه بصعدة وتسمى بالهادي وبويع بها، وكان مجتهداً في الأحكام الشرعية له في الفقه رأي ذكره ابن حزم، ثم ولي بعده ابنه محمد المرتضى فاضطربت ولايته، ثم أخوه الناصر أحمد فاستقام ملكه واطرد في بنيه، ولم تزل إمامتهم بصعدة مطردة حتى جاء السليمانيون من مكة لما أخرجهم الهواشم فغلبوا عليهم بصعدة وانقرضت دولتهم بها في المائة السادسة، ثم بقي إمام آل رسي في أعقابهم إلى بعد السبعمائة."
  en: "Banu al-Rassi, the Zaydi imams of Sa'da; from the line of al-Qasim al-Rassi ibn Ibrahim Tabataba — first to rise there was Yahya ibn al-Husayn al-Rassi, who summoned Sa'da to himself, took the laqab al-Hadi and was sworn as imam, a mujtahid in legal rulings whose fiqh Ibn Hazm saw and judged not far from the Sunni way; his son Muhammad al-Murtada's tenure faltered but his brother al-Nasir Ahmad's held, and the imamate ran unbroken in his sons until the Sulaymanids of Mecca, driven out by the Hawashim, seized Sa'da and ended the state there in the sixth century — though the Rassid claim lived on in their descendants past 700."
