label:
  ar: بنو الرسي بصعدة
  en: Rassid Zaydi imamate of Sa'da
  es: "Imamato rassid zaydí de Sa'da"
  fr: "L'imamat de Rassid Zaydi à Sa'da"
  ur: "سعد زیدی کی امامت"
  tr: "Sa'Ada'da Banu Al-Rassi"
  id: "Banu Al-Rassi di Sa'Ada"
summary:
  ar: "بنو الرسي أئمة الزيدية بصعدة؛ من أعقاب القاسم الرسي بن إبراهيم طباطبا بن إسماعيل الديباج، وأول من خرج بها يحيى بن الحسين بن القاسم الرسي دعا لنفسه بصعدة وتسمى بالهادي وبويع بها، وكان مجتهداً في الأحكام الشرعية له في الفقه رأي ذكره ابن حزم، ثم ولي بعده ابنه محمد المرتضى فاضطربت ولايته، ثم أخوه الناصر أحمد فاستقام ملكه واطرد في بنيه، ولم تزل إمامتهم بصعدة مطردة حتى جاء السليمانيون من مكة لما أخرجهم الهواشم فغلبوا عليهم بصعدة وانقرضت دولتهم بها في المائة السادسة، ثم بقي إمام آل رسي في أعقابهم إلى بعد السبعمائة."
  en: "Banu al-Rassi, the Zaydi imams of Sa'da; from the line of al-Qasim al-Rassi ibn Ibrahim Tabataba — first to rise there was Yahya ibn al-Husayn al-Rassi, who summoned Sa'da to himself, took the laqab al-Hadi and was sworn as imam, a mujtahid in legal rulings whose fiqh Ibn Hazm saw and judged not far from the Sunni way; his son Muhammad al-Murtada's tenure faltered but his brother al-Nasir Ahmad's held, and the imamate ran unbroken in his sons until the Sulaymanids of Mecca, driven out by the Hawashim, seized Sa'da and ended the state there in the sixth century — though the Rassid claim lived on in their descendants past 700."
  es: "Banu al-Rassi, los imanes zaidíes de Sa'da; de la línea de al-Qasim al-Rassi ibn Ibrahim Tabataba —el primero en ascender allí fue Yahya ibn al-Husayn al-Rassi, quien convocó a Sa'da para sí, tomó el laqab al-Hadi y juró como imán, un mujtahid en dictámenes legales cuyo fiqh Ibn Hazm vio y juzgó no muy lejos de la vía suní; el mandato de su hijo Muhammad al-Murtada flaqueó, pero el de su hermano al-Nasir Ahmad se mantuvo, y el imamato se mantuvo ininterrumpido en sus hijos hasta que los Sulaymaníes de La Meca, expulsados por los Hawashim, se apoderaron de Sa'da y pusieron fin al estado allí en el siglo VI, aunque la pretensión rasí sobrevivió en sus descendientes más allá del año 700."
  fr: "Les Banu al-Rassi, les imams zaydites de Sa'da, descendent d'al-Qasim al-Rassi ibn Ibrahim Tabataba. Le premier à s'y élever fut Yahya ibn al-Husayn al-Rassi, qui appela Sa'da à lui, prit le laqab al-Hadi et prêta serment comme imam. Mujtahid, expert en jurisprudence, son fiqh, selon Ibn Hazm, était proche de la voie sunnite. Le mandat de son fils Muhammad al-Murtada vacilla, mais celui de son frère al-Nasir Ahmad se maintint, et l'imamat se poursuivit sans interruption chez ses fils jusqu'à ce que les Sulaymanides de La Mecque, chassés par les Hawashim, s'emparent de Sa'da et mettent fin à l'État au VIe siècle. La revendication rasside perdura cependant chez leurs descendants après 700."
  ur: "بنو الراسی، صعدہ کے زیدی ائمہ؛ القاسم الراسی ابن ابراہیم طباطبہ کے سلسلہ میں سب سے پہلے یحییٰ بن الحسین الراسی تھے، جنہوں نے سعدہ کو اپنے پاس بلایا، لقب الہادی کو لیا اور امام کے طور پر حلف لیا، قانونی احکام میں ایک مجتہد جس کا فقہ ابن سنن سے دور نظر نہیں آتا تھا۔ اس کے بیٹے محمد المرتضیٰ کا دور اقتدار میں کمی آئی لیکن اس کے بھائی النصیر احمد کی حکومت برقرار رہی، اور امامت ان کے بیٹوں میں اس وقت تک جاری رہی جب تک کہ مکہ کے سلیمانیوں نے، حواشم کے ہاتھوں نکالے گئے، سعدہ پر قبضہ کر لیا اور چھٹی صدی میں وہاں کی ریاست کا خاتمہ کر دیا - حالانکہ رشد کا دعویٰ ان کی اولاد میں ماضی میں زندہ تھا۔"
  tr: "Banu al-Rassi, Sa'dah'taki Zeydi imamlarıydı; el-Kasım el-Rassi ibn İbrahim Tabataba ibn İsmail el-Dibaj'ın soyundan geliyordu. Orada ortaya çıkan ilk kişi, kendisi için el-Hadi adını ilan eden ve orada bağlılık yemini eden Yahya ibn el-Hüseyin ibn el-Kasım el-Rassi'ydi. İslami hükümlerde titiz bir âlimdi ve İbn Hazm'ın da belirttiği bir görüşe sahipti. Yerine oğlu Muhammed el-Murtada geçti, ancak yönetimi istikrarsızlaştı. Daha sonra kardeşi el-Nasir Ahmed yönetimini yeniden tesis etti ve oğulları arasında sürgün edildi. Sa'da'daki liderlikleri, Süleymanlılar Mekke'den gelene kadar istikrarlı ve istikrarlı kaldı; o zaman Haşimiler onları alt etti ve devletleri altıncı yüzyılda ortadan kalktı. Daha sonra el-Rassi ailesinin imamı, yedi yüzüncü yüzyıldan sonra onların halefi olarak kaldı."
  id: "Banu al-Rassi adalah imam Zaydi di Sa'dah; keturunan al-Qasim al-Rassi ibn Ibrahim Tabataba ibn Ismail al-Dibaj. Yang pertama muncul di sana adalah Yahya ibn al-Husayn ibn al-Qasim al-Rassi, yang mengklaim nama al-Hadi untuk dirinya sendiri dan bersumpah setia di sana. Ia adalah ulama yang tekun dalam pemerintahan Islam dan memiliki pendapat yang disebutkan oleh Ibn Hazm. Ia digantikan oleh putranya Muhammad al-Murtada, yang pemerintahannya menjadi tidak stabil. Kemudian saudaranya al-Nasir Ahmad mengembalikan pemerintahannya dan diusir di antara putranya. Kepemimpinan mereka di Sa'dah tetap stabil hingga Sulaymanid datang dari Mekah ketika Hashemit mengalahkan mereka dan negara mereka hilang pada abad keenam. Kemudian Imam keluarga al-Rassi tetap menjadi penerus mereka hingga setelah abad ketujuh ratus."
