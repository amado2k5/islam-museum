summary:
  en: "The Arab client kingdom of Rome in al-Sham: the house of Jafna of the Azd displaced the Salihid Dajaʾima and ruled as Rome’s wardens of the desert frontier until Yarmuk, when their last king Jabala ibn al-Ayham entered Islam in Umar’s reign."
  ar: "المملكة العربية التابعة للروم في الشام: آل جفنة من الأزد غلبوا الضجاعمة بني سليح وملكوا وكلاء عن الروم على تخوم البادية حتى وقعة اليرموك، وانقاد للإسلام آخر ملوكهم جبلة بن الأيهم في عهد عمر."
  es: "El reino árabe vasallo de Roma en al-Sham: la casa de Jafna de Azd desplazó a los Salihid Dajaʾima y gobernó como guardianes romanos de la frontera del desierto hasta Yarmuk, cuando su último rey, Jabala ibn al-Ayham, se convirtió al Islam durante el reinado de Umar."
  fr: "Le royaume client arabe de Rome au Levant: la maison de Jafna d'Azd a déplacé les Salihid Daja'ima et a régné en tant que gardiens de Rome sur la frontière désertique jusqu'à Yarmouk, lorsque leur dernier roi Jabala ibn al-Ayham s'est converti à l'islam sous le règne d'Umar."
