summary:
  en: "The Arab client kingdom of Rome in al-Sham: the house of Jafna of the Azd displaced the Salihid Dajaʾima and ruled as Rome’s wardens of the desert frontier until Yarmuk, when their last king Jabala ibn al-Ayham entered Islam in Umar’s reign."
  ar: "المملكة العربية التابعة للروم في الشام: آل جفنة من الأزد غلبوا الضجاعمة بني سليح وملكوا وكلاء عن الروم على تخوم البادية حتى وقعة اليرموك، وانقاد للإسلام آخر ملوكهم جبلة بن الأيهم في عهد عمر."
