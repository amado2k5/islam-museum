id: polity/qaramanid-beylik
class: polity
kind: emirate
label:
  ar: بنو قرمان
  en: Qaramanid beylik
  es: "Beylik Qaramanid"
  fr: "beylik qaramanide"
summary:
  ar: "بنو قرمان من أمراء التركمان ببلاد الروم؛ غلبوا على قطعة من بلاد الروم ما بين سيواس وبلاد بني عثمان من أنطاكية والعلايا بجبال البحر إلى قونية، وكانوا في حدود أرمينية وجدهم هو الذي هزم هيشوش بن ليعون ملك سيس من الأرمن سنة 720هـ، ثم كان بينهم وبين بني عثمان جق اتصال ومصاهرة، ودام أمرهم في فتن التركمان حتى أذعنت دولهم لملوك بني عثمان."
  en: "Banu Qaraman, Turkmen amirs of Rum; they won a piece of the Rum lands between Sivas and the Ottomans' country — Antalya and the Alanya coast mountains to Konya — seated on the Armenian marches, their forefather the man who routed Hayton (Hetum) the Leo king of Sis in 720, their house bound thereafter to the Banu Uthman by ties and marriage until the Ottoman state absorbed them."
  es: "Los Banu Qaraman, emires turcomanos de Rum, conquistaron una parte de las tierras de Rum entre Sivas y el territorio otomano —Antalya y las montañas costeras de Alanya hasta Konya—, asentados en las fronteras armenias. Su antepasado fue el hombre que derrotó a Hayton (Hetum), el rey León de Sis, en el año 720. Su clan quedó vinculado a partir de entonces a los Banu Uthman por lazos y matrimonios hasta que el estado otomano los absorbió."
  fr: "Les Banu Qaraman, émirs turkmènes de Rum, ont conquis une partie des terres de Rum entre Sivas et le pays ottoman — Antalya et les montagnes côtières d'Alanya jusqu'à Konya — installées sur les marches arméniennes. Leur ancêtre était l'homme qui avait vaincu Hayton (Hetum), roi Lion de Sis, en 720. Leur maison fut ensuite liée aux Banu Uthman par des liens et des mariages jusqu'à ce que l'État ottoman les absorbe."
