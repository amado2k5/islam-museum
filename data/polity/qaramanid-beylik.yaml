label:
  ar: بنو قرمان
  en: Qaramanid beylik
summary:
  ar: "بنو قرمان من أمراء التركمان ببلاد الروم؛ غلبوا على قطعة من بلاد الروم ما بين سيواس وبلاد بني عثمان من أنطاكية والعلايا بجبال البحر إلى قونية، وكانوا في حدود أرمينية وجدهم هو الذي هزم هيشوش بن ليعون ملك سيس من الأرمن سنة 720هـ، ثم كان بينهم وبين بني عثمان جق اتصال ومصاهرة، ودام أمرهم في فتن التركمان حتى أذعنت دولهم لملوك بني عثمان."
  en: "Banu Qaraman, Turkmen amirs of Rum; they won a piece of the Rum lands between Sivas and the Ottomans' country — Antalya and the Alanya coast mountains to Konya — seated on the Armenian marches, their forefather the man who routed Hayton (Hetum) the Leo king of Sis in 720, their house bound thereafter to the Banu Uthman by ties and marriage until the Ottoman state absorbed them."
