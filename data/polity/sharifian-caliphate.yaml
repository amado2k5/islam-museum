summary:
  ar: خلافة أعلنها الحسين بن علي شريف مكة في مارس 1924م بعد إلغاء الخلافة العثمانية؛ لم يلقَ اعترافاً واسعاً وانتهت بتنازله سنة 1925م.
  en: The caliphate proclaimed by Husayn ibn Ali, Sharif of Mecca, in March 1924 after the abolition of the Ottoman caliphate; it found little recognition and ended with his abdication in 1925.
  ur: "شریف مکہ حسین بن علی کی مارچ 1924ء میں عثمانی خلافت کے خاتمے پر خلافت کا اعلان؛ وسیع تسلیم نہ ملی اور 1925ء میں ان کے دستبردار ہونے پر ختم ہوئی۔"
  es: "El califato proclamado por Husayn ibn Ali, jerife de La Meca, en marzo de 1924 tras la abolición del califato otomano, tuvo escaso reconocimiento y terminó con su abdicación en 1925."
  fr: "Le califat proclamé par Husayn ibn Ali, chérif de La Mecque, en mars 1924 après l'abolition du califat ottoman; il ne fut guère reconnu et prit fin avec son abdication en 1925."
