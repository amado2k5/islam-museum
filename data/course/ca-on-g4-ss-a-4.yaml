  title:
    en: 'Jars and pitchers in an Iranian city'
    ar: 'جرار وأباريق في مدينة إيرانية'
    ur: 'ایک ایرانی شہر میں مٹکے اور گھڑے'
  text:
    en: 'In early Islamic Nishapur, writes Wilkinson, unglazed pottery served for cooking and above all for storing water: storage jars, large pitchers holding water in every house, and small pitchers to drink from. He sees its chief interest in revealing aspects of life neither described in early Islamic literature nor, given the scarcity of painting, pictured. Its pitchers kept water cool by evaporation in a hot, dry land. What can a water jar tell you about a household?'
    ar: 'يرى ويلكنسون أن الفخار غير المزجج في نيسابور في العصر الإسلامي المبكر كان يُستعمل للطبخ وفوق ذلك لخزن الماء: جرار للخزن، وأباريق كبيرة تحفظ الماء في كل بيت، وأباريق صغيرة للشرب. ويرى أن أهم ما فيه كشفه جوانب من الحياة لم تصفها الكتابات الإسلامية المبكرة ولم تصوّرها اللوحات لقلتها. وكانت أباريقه تبرّد الماء بالتبخر في أرض حارة جافة. ماذا يخبرك إبريق الماء عن أهل البيت؟'
    ur: 'ولکنسن کے مطابق ابتدائی اسلامی نیشاپور میں بے لعاب مٹی کے برتن پکانے کے لیے اور سب سے بڑھ کر پانی ذخیرہ کرنے کے لیے استعمال ہوتے تھے: ذخیرے کے مٹکے، ہر گھر میں پانی رکھنے والے بڑے گھڑے، اور پینے کے لیے چھوٹی صراحیاں۔ ان کی نظر میں اس کی سب سے بڑی دلچسپی یہ ہے کہ وہ زندگی کے ایسے پہلو ظاہر کرتا ہے جو ابتدائی اسلامی تحریروں میں بیان نہیں ہوئے اور مصوری کی کمی کے باعث تصویروں میں بھی نہیں ملتے۔ اس کے گھڑے گرم خشک سرزمین میں بخارات کے ذریعے پانی ٹھنڈا رکھتے تھے۔ پانی کا ایک مٹکا کسی گھرانے کے بارے میں آپ کو کیا بتاتا ہے؟'
