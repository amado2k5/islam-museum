  title:
    en: 'Fresh water for everyone'
    ar: 'ماء عذب للناس'
    ur: 'سب کے لیے میٹھا پانی'
  text:
    en: 'Al-Haddad counts sabils an important branch of civil building, falling under charitable buildings or foundations, endowed to give people fresh water every day all year round. They drew water from wells, pools and springs, or from rain and floods through channels or pipes. Who provides drinking water in your town, and how?'
    ar: 'يعدّ الحداد الأسبلة فرعًا مهمًّا من العمارة المدنية، تندرج تحت ما يسميه المباني أو المؤسسات الخيرية، وهي موقوفة لتسقي الناس ماءً عذبًا كل يوم طوال السنة. وكانت تستمد الماء من الآبار والبرك والعيون، أو من المطر والسيول عبر قنوات أو أنابيب. من يوفّر ماء الشرب في بلدتك، وكيف؟'
    ur: 'الحداد سبیلوں کو شہری تعمیرات کی ایک اہم شاخ شمار کرتے ہیں جو ان کے بقول خیراتی عمارتوں یا اوقاف میں آتی ہے؛ انہیں اس لیے وقف کیا جاتا تھا کہ لوگوں کو ہر روز سال بھر میٹھا پانی ملے۔ وہ کنوؤں، حوضوں اور چشموں سے، یا بارش اور سیلاب کے پانی سے نالیوں یا نلکیوں کے ذریعے پانی لیتے تھے۔ آپ کے شہر میں پینے کا پانی کون مہیا کرتا ہے، اور کیسے؟'
