summary:
  en: "The Ontario Grade 12 university-preparation course Philosophy: Questions and Theories has eight strands, from research skills to aesthetics. The museum maps four of them, through the thinkers and ideas of the Islamic world."
  ar: "مقرر «الفلسفة: أسئلة ونظريات» للصف الثاني عشر الجامعي في أونتاريو له ثمانية محاور، من مهارات البحث إلى علم الجمال. ويربط المتحف أربعة منها من خلال مفكري العالم الإسلامي وأفكاره."
  ur: "اونٹاریو کے جماعت دوازدہم کے جامعاتی کورس «فلسفہ: سوالات اور نظریات» کی آٹھ شاخیں ہیں، تحقیقی مہارتوں سے جمالیات تک۔ میوزیم ان میں سے چار کو عالمِ اسلام کے مفکرین اور خیالات کے ذریعے جوڑتا ہے۔"
  es: "El curso preparatorio para la universidad de último año de secundaria en Ontario, Filosofía: Preguntas y Teorías, consta de ocho ejes temáticos, desde habilidades de investigación hasta estética. El museo explora cuatro de ellos a través de los pensadores e ideas del mundo islámico."
  fr: "Le cours préparatoire à l'université de 12e année en Ontario, intitulé « Philosophie: Questions et théories », comporte huit volets, allant des méthodes de recherche à l'esthétique. Le musée en présente quatre, à travers les penseurs et les idées du monde islamique."
  tr: "Ontario'daki 12. sınıf üniversite öğrencileri için verilen Felsefe: Sorular ve Teoriler dersi, araştırma becerilerinden estetiğe kadar sekiz modülden oluşmaktadır. Müze, bu modüllerin dördünü İslam dünyasının düşünürleri ve fikirleri aracılığıyla birbirine bağlamaktadır."
  id: "Kursus Filsafat: Pertanyaan dan Teori untuk siswa kelas 12 di universitas di Ontario memiliki delapan modul, mulai dari keterampilan penelitian hingga estetika. Museum ini menghubungkan empat modul tersebut melalui para pemikir dan gagasan dunia Islam."
