label:
  en: Grade 11 Biology, University Preparation (SBI3U)
  ar: الأحياء للصف الحادي عشر، إعداد جامعي ⁦(SBI3U)⁩
  ur: جماعت یازدہم حیاتیات، یونیورسٹی کی تیاری ⁦(SBI3U)⁩
  es: "Biología de 11.º grado, preparación universitaria (SBI3U)"
  fr: "Biologie de 11e année, préparation universitaire (SBI3U)"
summary:
  en: 'The Ontario Grade 11 course SBI3U: six strands, from investigation skills to evolution, genetics, animal systems and plants. The museum maps six expectations, through scholars, physicians, an agricultural author and a religious body of the Islamic world, and leaves the rest to the class.'
  ar: 'مقرر SBI3U للصف الحادي عشر في أونتاريو: ستة محاور، من مهارات البحث إلى التطور والوراثة وأجهزة الحيوان والنبات. ويربط المتحف ست توقعات، من خلال علماء وأطباء ومؤلف فلاحي وجهة دينية من العالم الإسلامي، ويترك الباقي للصف.'
  ur: 'اونٹاریو کا کورس SBI3U برائے جماعت یازدہم: چھ شاخیں، تحقیقی مہارتوں سے لے کر ارتقا، وراثت، جانوروں کے نظاموں اور پودوں تک۔ عجائب گھر چھ توقعات جوڑتا ہے، اسلامی دنیا کے اہلِ علم، اطبا، ایک زرعی مصنف اور ایک مذہبی ادارے کے ذریعے، اور باقی کلاس پر چھوڑتا ہے۔'
  es: "El curso SBI3U de 11.º grado de Ontario se compone de seis ejes temáticos, desde habilidades de investigación hasta evolución, genética, sistemas animales y plantas. El museo establece seis objetivos, a través de académicos, médicos, un autor especializado en agricultura y una institución religiosa del mundo islámico, y deja el resto a criterio de la clase."
  fr: "Le cours SBI3U de 11e année en Ontario comprend six volets, allant des compétences d'investigation à l'évolution, la génétique, les systèmes animaux et les plantes. Le musée définit six attentes, illustrées par des universitaires, des médecins, un auteur spécialisé en agriculture et une instance religieuse du monde islamique, et laisse le reste à la charge des élèves."
