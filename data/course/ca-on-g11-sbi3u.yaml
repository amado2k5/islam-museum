summary:
  en: 'The Ontario Grade 11 course SBI3U: six strands, from investigation skills to evolution, genetics, animal systems and plants. The museum maps six expectations, through scholars, physicians, an agricultural author and a religious body of the Islamic world, and leaves the rest to the class.'
  ar: 'مقرر SBI3U للصف الحادي عشر في أونتاريو: ستة محاور، من مهارات البحث إلى التطور والوراثة وأجهزة الحيوان والنبات. ويربط المتحف ست توقعات، من خلال علماء وأطباء ومؤلف فلاحي وجهة دينية من العالم الإسلامي، ويترك الباقي للصف.'
  ur: 'اونٹاریو کا کورس SBI3U برائے جماعت یازدہم: چھ شاخیں، تحقیقی مہارتوں سے لے کر ارتقا، وراثت، جانوروں کے نظاموں اور پودوں تک۔ عجائب گھر چھ توقعات جوڑتا ہے، اسلامی دنیا کے اہلِ علم، اطبا، ایک زرعی مصنف اور ایک مذہبی ادارے کے ذریعے، اور باقی کلاس پر چھوڑتا ہے۔'
