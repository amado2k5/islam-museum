connections:
- position: within
  kind: invention
  title:
    en: A book for people's needs
    ar: كتاب لحاجات الناس
    ur: لوگوں کی ضرورتوں کے لیے ایک کتاب
  text:
    en: The record says algebra, al-jabr wal-muqabala, is the art of finding an unknown number from known ones through an equation. Al-Khwarizmi set it out in Baghdad, in a concise book, for people's needs in inheritance, bequests, trade and land measurement. TDV adds that his algebra was wholly in words, with no symbols. What symbol could stand for the unknown number in a problem of your own?
    ar: يقول السجل إن علم الجبر والمقابلة صناعة يُستخرج بها العدد المجهول من الأعداد المعلومة بمعادلة بينها. وضعه الخوارزمي في بغداد في كتاب مختصر لما يلزم الناس في مواريثهم ووصاياهم وتجاراتهم ومساحة أرضيهم. وتضيف موسوعة TDV أن جبره كله بالكلمات بلا رموز. ما الرمز الذي يمكن أن يقوم مقام العدد المجهول في مسألة من وضعك؟
    ur: ریکارڈ کہتا ہے کہ علم الجبر والمقابلہ وہ فن ہے جس سے معلوم اعداد کے ذریعے ایک مساوات کی مدد سے نامعلوم عدد نکالا جاتا ہے۔ خوارزمی نے اسے بغداد میں ایک مختصر کتاب میں پیش کیا، تاکہ وراثت، وصیتوں، تجارت اور زمین کی پیمائش میں لوگوں کی ضرورت پوری ہو۔ ٹی ڈی وی انسائیکلوپیڈیا (TDV) مزید کہتا ہے کہ ان کا الجبرا مکمل طور پر الفاظ میں تھا، بغیر علامتوں کے۔ اپنے کسی مسئلے میں نامعلوم عدد کی جگہ کون سی علامت آ سکتی ہے؟
  entity: invention/algebra
  sources:
