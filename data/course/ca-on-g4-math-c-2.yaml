- position: after
  kind: invention
  title:
    en: Restoring and balancing
    ar: الجبر والمقابلة
    ur: پورا کرنا اور برابر کرنا
  text:
    en: Two operations give algebra its name, the record explains. Al-jabr, "restoring", removes a subtracted quantity from one side by adding it to both; al-muqabala, "balancing", cancels like terms that appear on both sides. How does doing the same thing to both sides keep an equation true, and how can you check your answer?
    ar: يشرح السجل أن عمليتين أعطتا هذا العلم اسمه. الجبر، وهو أن يُزال المستثنى من أحد الطرفين بزيادته على الطرفين معاً، والمقابلة، وهي إسقاط الأجناس المتماثلة من الطرفين. كيف يُبقي فعل الشيء نفسه بالطرفين المعادلة صحيحة، وكيف تتحقق من جوابك؟
    ur: ریکارڈ وضاحت کرتا ہے کہ دو عملوں نے اس علم کو اس کا نام دیا۔ الجبر، یعنی «پورا کرنا»، کسی طرف سے منفی مقدار کو دونوں طرف اضافہ کر کے ہٹا دیتا ہے؛ اور المقابلہ، یعنی «برابر کرنا»، دونوں طرف موجود ایک جیسے حدود کو ساقط کر دیتا ہے۔ دونوں طرف ایک ہی عمل کرنے سے مساوات کیوں درست رہتی ہے، اور آپ اپنا جواب کیسے جانچیں گے؟
