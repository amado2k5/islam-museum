  text:
    en: The record describes girih as Islamic geometric knot patterns that build stars and polygons from interlacing lines, common in Safavid and Seljuk architecture and resting on girih tiles. Which geometric properties of a star or polygon would you check to be sure its copies fit together without gaps?
    ar: يصف السجل الجيره بأنها عقد هندسية إسلامية تبني نجوماً ومضلعات بخطوط متشابكة، شاعت في العمارة الصفوية والسلجوقية وتقوم على بلاطات جيره. أي الخصائص الهندسية في النجمة أو المضلع تفحصها لتتأكد أن نسخها تتجاور دون فراغات؟
    ur: ریکارڈ گریہ کو اسلامی ہندسی گرہ نما نقوش بتاتا ہے جو باہم گندھی لکیروں سے ستارے اور کثیر الاضلاع بناتے ہیں، صفوی اور سلجوقی عمارت میں عام تھے اور گریہ کی ٹائلوں پر قائم ہیں۔ ستارے یا کثیر الاضلاع کی کون سی ہندسی خصوصیات آپ جانچیں گے تاکہ یقین ہو کہ اس کی نقلیں بغیر خلا کے جڑتی ہیں؟
