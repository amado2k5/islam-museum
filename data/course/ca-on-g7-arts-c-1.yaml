connections:
- position: before
  kind: invention
  entity: invention/ziryab-fifth-string
  title:
    en: A fifth string for the oud
    ar: وتر خامس للعود
    ur: عود کے لیے پانچویں تار
  text:
    en: Maqqari attributes to Ziryab an additional string on an inherited four-string oud; the account calls it red and places it below the mathlath and above the mathna. The record presents this as a refinement, not the invention of the oud, and notes that Dwight Reynolds shows how Maqqari assembled older voices into an idealized portrait of one artist. What changes in a sound when one string is added?
    ar: ينسب المقري إلى زرياب زيادة وتر خامس في عوده بالأندلس، بعد أن كان ذا أربعة أوتار؛ ويسميه الخبر وتراً أحمر ويضعه تحت المثلث وفوق المثنى. وهذه إضافة إلى آلة موروثة، لا اختراع العود نفسه، ويبين نقد دوايت رينولدز كيف جمعت سيرة المقري أصواتاً أقدم في صورة مثالية لفنان واحد. فماذا يتغير في الصوت حين يُضاف وتر؟
    ur: مقری زریاب سے اندلس میں ان کے عود میں پانچویں تار کا اضافہ منسوب کرتے ہیں، جب کہ پہلے اس میں چار تاریں تھیں؛ روایت اسے سرخ تار کہتی ہے اور مثلث کے نیچے اور مثنیٰ کے اوپر رکھتی ہے۔ یہ ایک موروثی آلے میں اضافہ ہے، خود عود کی ایجاد نہیں، اور ڈوائٹ رینالڈز کی تنقید دکھاتی ہے کہ مقری کی سوانح نے پرانی آوازوں کو ایک فن کار کی مثالی تصویر میں جمع کیا۔ ایک تار بڑھانے سے آواز میں کیا بدلتا ہے؟
  sources:
  - source/nafh-tib-maqqari
  - source/reynolds-ziryab-2008
- position: after
  kind: invention
  entity: invention/jazari-musical-boat
  title:
    en: A musical boat driven by water
    ar: قارب موسيقي يديره الماء
    ur: پانی سے چلنے والی موسیقی کی کشتی
  text:
    en: 'Al-Jazari describes a small boat carrying a courtly scene; the detailed section lists four performers: two tambourine players, a harpist and a wind-instrument player. Water carried inside the boat powers bursts of movement and a whistle. Hill finds no explanation for the claimed sailor motion, so the record does not call it the first programmed robot. How could a machine change what listeners expect of music?'
    ar: يصف الجزري قارباً صغيراً يحمل مجلساً مصوراً، ويشرح القسم التفصيلي أربعة عازفين، اثنان للدف وواحد للوتر وواحد للنفخ. والماء المحمول داخل القارب يدير أجزاء العرض على دفعات، وتصدر صفارة صوتاً. ويبين نقد هيل أن النص لا يشرح حركة البحارة المعلنة، فلا يُعدّ القارب أول روبوت مبرمج. كيف يمكن لآلة أن تغير ما ينتظره السامعون من الموسيقى؟
    ur: 'الجزری ایک چھوٹی کشتی بیان کرتے ہیں جس پر درباری منظر سجا ہے؛ تفصیلی حصے میں چار سازندے ہیں: دو دف بجانے والے، ایک ہارپ بجانے والا اور ایک پھونکنے والے ساز کو بجانے والا۔ کشتی کے اندر رکھا پانی نمائش کے حصوں کو وقفوں وقفوں سے چلاتا ہے اور سیٹی آواز دیتی ہے۔ ہل کی تنقید بتاتی ہے کہ متن ملاحوں کی بتائی گئی حرکت کی وضاحت نہیں کرتا، اس لیے اسے پہلا پروگرام شدہ روبوٹ نہیں کہا جاتا۔ مشین سننے والوں کی موسیقی سے توقعات کو کیسے بدل سکتی ہے؟'
  sources:
  - source/jazari-hill-1974
order: 1
