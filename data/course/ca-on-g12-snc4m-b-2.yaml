  title:
    en: Honey as a remedy
    ar: العسل علاجًا
    ur: علاج کے طور پر شہد
  text:
    en: The jurists' encyclopaedia reports that, in the lexicon's wording, asal is the saliva of the bee, which God made a healing for people; the Arabs use the word for anything found sweet. It reports that using honey as medicine is permitted, and that most scholars read the Qur'anic verse as saying that honey contains healing. The record gives a ruling and no measurement. What evidence would show a remedy helps?
    ar: تنقل الموسوعة أن العسل في اللغة، بحسب عبارة المعجم، لعاب النحل الذي جعله الله شفاء للناس، وأن العرب تسمي كل ما يُستلذ عسلًا. وتذكر أن التداوي بالعسل جائز، وأن جمهور العلماء قالوا إن في العسل شفاء للناس، وذلك في آية النحل. يقدّم السجل حكمًا ولا يقدّم قياسًا. أي دليل يبيّن أن العلاج ينفع؟
    ur: موسوعہ نقل کرتا ہے کہ لغت کی عبارت میں عسل شہد کی مکھی کا لعاب ہے، جسے اللہ نے لوگوں کے لیے شفا بنایا؛ اور عرب ہر لذیذ چیز کو عسل کہتے ہیں۔ وہ بتاتا ہے کہ شہد سے علاج جائز ہے، اور جمہور علما کہتے ہیں کہ شہد میں لوگوں کے لیے شفا ہے، آیتِ نحل کی بنا پر۔ ریکارڈ حکم دیتا ہے، پیمائش نہیں۔ کون سا ثبوت دکھائے گا کہ کوئی علاج فائدہ دیتا ہے؟
