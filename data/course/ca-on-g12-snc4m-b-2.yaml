  title:
    en: Cupping as a remedy
    ar: الحجامة علاجًا
    ur: علاج کے طور پر حجامہ
  text:
    en: Hijama is the drawing of blood by suction after the skin has been cut with a cupping instrument. It differs from fasd, which is opening a vein. Jurists classify cupping as a recommended (mustahabb) act of treatment on the basis of hadiths in the two Sahih collections; this is a legal classification, not a medical recommendation. The record reports this ruling and does not test whether cupping works. How would you test it?
    ar: الحجامة مص الدم بعد الشرط بالمحجم، وتفترق عن الفصد، وهو شق العرق لإخراج الدم. ويصنّف الفقهاء التداوي بها مندوبًا استنادًا إلى أحاديث في الصحيحين؛ وهذا تصنيف فقهي لا توصية طبية. يعرض السجل هذا الحكم ولا يختبر هل تنفع الحجامة أم لا. فكيف تختبر ذلك أنت، وما الذي ستقيسه قبل العلاج وبعده؟
    ur: حجامہ جلد کو آلۂ حجامہ سے چیرنے کے بعد چوس کر خون نکالنا ہے۔ یہ فصد سے مختلف ہے، جو رگ کھول کر خون نکالنا ہے۔ فقہا علاج کے لیے حجامہ کو مستحب قرار دیتے ہیں، صحیحین کی احادیث کی بنیاد پر؛ یہ فقہی درجہ بندی ہے، طبی سفارش نہیں۔ ریکارڈ یہ حکم بیان کرتا ہے اور یہ نہیں آزماتا کہ حجامہ مفید ہے یا نہیں۔ آپ اسے کیسے آزمائیں گے؟
  entity: concept/hijama
