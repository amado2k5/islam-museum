  title:
    en: Naming a child
    ar: نام المولود
    ur: بچے کا نام رکھنا
  text:
    en: 'The Kuwaiti Encyclopaedia of Fiqh records that the jurists use the word tasmiya in several senses, one of them giving a proper name to a child, and that they hold that the father has the better right to name a child; if the parents differ, the father''s choice is preferred. This is a legal discussion, not a custom of any community. It reports that the schools differ on the time: the Malikis hold that a child is named on the seventh day after the aqiqa sacrifice, the Shafi''is recommend the seventh day, and the Hanbalis report two views. How is a child named in your family?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن الفقهاء يستعملون كلمة التسمية في معان منها وضع الاسم العلم للمولود، وأنهم يرون أن الأب أولى بتسمية المولود من الأم، فإن اختلفا قُدّم الأب. وهذا بحث فقهي، لا عادة جماعة بعينها. وتذكر أن الفقهاء اختلفوا في الوقت: فالمالكية يرون تسمية المولود في اليوم السابع بعد ذبح العقيقة، والشافعية يستحبون اليوم السابع، والحنابلة على روايتين. كيف يُسمّى المولود في أسرتك؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا درج کرتا ہے کہ فقہاء لفظ تسمیہ کئی معانی میں برتتے ہیں، ان میں سے ایک بچے کا نام رکھنا ہے، اور ان کے نزدیک بچے کا نام رکھنے کا باپ کو زیادہ حق ہے؛ والدین میں اختلاف ہو تو باپ کی رائے کو ترجیح ہے۔ یہ ایک فقہی بحث ہے، کسی جماعت کا رواج نہیں۔ انسائیکلوپیڈیا کے مطابق وقت میں مذاہب مختلف ہیں: مالکیہ کے نزدیک بچے کا نام عقیقہ کے بعد ساتویں دن رکھا جاتا ہے، شافعیہ ساتویں دن کو مستحب کہتے ہیں، اور حنابلہ کی دو روایات ہیں۔ آپ کے خاندان میں بچے کا نام کیسے رکھا جاتا ہے؟'
