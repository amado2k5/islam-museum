  title:
    en: Al-Khwarizmi
    ar: الخوارزمي
    ur: الخوارزمی
  text:
    en: The editors of the Cairo edition of al-Khwarizmi's algebra quote Ibn al-Nadim's Fihrist that he came from Khwarazm and was attached to al-Ma'mun's Treasury of Wisdom. They hold that his name became Algorithm in English and Algorismus in Latin, and that Indian reckoning, with its use of zero, reached the West through his book on arithmetic. Which of his accomplishments would you tell a classmate first?
    ar: ينقل محققا طبعة القاهرة لكتاب الخوارزمي في الجبر عن «الفهرست» لابن النديم أن أصله من خوارزم وأنه كان منقطعًا إلى «خزانة الحكمة» للمأمون. ويريان أن اسمه صار كلمة Algorithm في الإنجليزية وAlgorismus في اللاتينية، وأن طريقة الحساب الهندية، ومنها استخدام الصفر، وصلت إلى الغرب عن طريق كتابه في الحساب. أي إنجازاته ستذكر أولاً لزميلك؟
    ur: قاہرہ ایڈیشن کے مرتبین الخوارزمی کی الجبر کی کتاب کے بارے میں ابن الندیم کی «الفہرست» سے نقل کرتے ہیں کہ ان کا اصل وطن خوارزم تھا اور وہ المامون کے «خزانۃ الحکمۃ» سے وابستہ تھے۔ ان کی رائے ہے کہ ان کا نام انگریزی میں Algorithm اور لاطینی میں Algorismus بن گیا، اور ہندی طریقۂ حساب، صفر کے استعمال سمیت، ان کی علمِ حساب کی کتاب کے ذریعے مغرب پہنچا۔ ان کی کون سی خدمات آپ ہم جماعت کو پہلے بتائیں گے؟
