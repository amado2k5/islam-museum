  title:
    en: An engineer of mechanical devices
    ar: مهندس الحيل الميكانيكية
    ur: میکانی آلات کا انجینئر
  text:
    en: Al-Jazari was an engineer who wrote a book on mechanical devices. According to the TDV Islamic Encyclopaedia, its six parts cover clocks, vessels for drinking, fountains, machines for raising water and other devices, with drawings and instructions for making and assembling them. Whose work with machines does your own community remember?
    ar: كان الجزري مهندسًا ألّف كتابًا في الحيل الميكانيكية. وبحسب موسوعة TDV الإسلامية تشمل أقسامه الستة الساعات وأواني الشراب والنوافير وآلات رفع الماء وغيرها من الأجهزة، مع رسوم وتعليمات لصنعها وتركيبها. عمل من في الآلات يذكر مجتمعك؟
    ur: الجزری ایک انجینئر تھا جس نے میکانی آلات پر کتاب لکھی۔ TDV اسلامی انسائیکلوپیڈیا کے مطابق اس کے چھ حصوں میں گھڑیاں، پینے کے برتن، فوارے، پانی اٹھانے کی مشینیں اور دوسرے آلات شامل ہیں، ساتھ انہیں بنانے اور جوڑنے کی تصویریں اور ہدایات بھی۔ آپ کی اپنی برادری مشینوں پر کس کے کام کو یاد رکھتی ہے؟
  entity: person/al-jazari-engineer
  sources:
  - source/tdv-cezeri
- position: after
  kind: invention
  title:
    en: Telling the time from a shadow
    ar: معرفة الوقت من الظل
    ur: سائے سے وقت معلوم کرنا
  text:
    en: On the northern minaret of the Umayyad Mosque in Damascus, according to David King, Ibn al-Shatir put up a large marble sundial where the time was read from the shadow of a pointer. Where in your community do people tell the time?
    ar: على المئذنة الشمالية للجامع الأموي بدمشق أقام ابن الشاطر، بحسب وصف ديفيد كينغ، ساعة شمسية رخامية كبيرة يُقرأ الوقت فيها من ظل مؤشّر. أين يعرف الناس الوقت في مجتمعك؟
    ur: دمشق کی جامع اموی کے شمالی مینار پر ابن الشاطر نے، ڈیوڈ کنگ کے بیان کے مطابق، ایک بڑی سنگِ مرمر کی دھوپ گھڑی بنائی جس میں وقت ایک اشارے کے سائے سے پڑھا جاتا تھا۔ آپ کی برادری میں لوگ وقت کہاں سے معلوم کرتے ہیں؟
  entity: invention/shatir-polar-sundial
  sources:
  - source/king-ibn-shatir-bea
