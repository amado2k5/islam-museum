  kind: story
  title:
    en: The earthquake of Jumada I, 460
    ar: زلزلة جمادى الأولى سنة 460
    ur: 460ھ کے جمادی الاولیٰ کا زلزلہ
  text:
    en: In Jumada I of the year 460 AH an earthquake struck the land of Palestine and destroyed the town of Ramla. Some merchants wrote that the whole of Ramla sank into the ground; during the quake the sea receded so far that its bed was uncovered and people walked on it, and then it returned to its former state. Where on a map would you mark this record?
    ar: في جمادى الأولى سنة ستين وأربعمائة كانت زلزلة بأرض فلسطين أهلكت بلد الرملة. وكتب بعض التجار أنها خسفت الرملة جميعها، وانجفل البحر وقت الزلزلة حتى انكشفت أرضه ومشى الناس فيه ثم عاد إلى حاله. أين على الخريطة تضع هذا السجل؟
    ur: 460ھ کے جمادی الاولیٰ میں فلسطین کی سرزمین پر زلزلہ آیا جس نے رملہ شہر کو تباہ کر دیا۔ بعض تاجروں نے لکھا کہ پورا رملہ زمین میں دھنس گیا۔ زلزلے کے وقت سمندر اتنا پیچھے ہٹ گیا کہ اس کی تہہ کھل گئی اور لوگ اس پر چلنے لگے، پھر وہ اپنی پہلی حالت پر لوٹ آیا۔ نقشے پر آپ اس ریکارڈ کو کہاں درج کریں گے؟
  entity: event/ramla-earthquake-460
  sources:
