- position: within
  kind: story
  title:
    en: Ramla shaken again, in 425
    ar: الرملة تُزلزل ثانية سنة 425
    ur: 425ھ میں رملہ پھر ہل گیا
  text:
    en: In 425 AH, the record says, Ramla was shaken and about half of it destroyed; villages sank into the ground, part of the wall of Jerusalem fell and the minaret of the mosque of Ascalon collapsed. The sea then receded about three leagues, and people who went out to gather fish and shells were carried off when the water returned. What does it mean for a map that Ramla appears in two records?
    ar: في سنة خمس وعشرين وأربعمائة زُلزلت الرملة فهُدم نحو نصفها وخُسف بقرى وسقط بعض حائط بيت المقدس وسقطت منارة جامع عسقلان. وجزر البحر نحو ثلاثة فراسخ فخرج الناس يتتبّعون السمك والصدف، فعاد الماء فأخذ قوماً منهم. ماذا يعني للخريطة أن الرملة ترد في سجلين؟
    ur: 425ھ میں رملہ میں زلزلہ آیا تو اس کا تقریباً نصف حصہ منہدم ہو گیا، کچھ بستیاں زمین میں دھنس گئیں، بیت المقدس کی دیوار کا کچھ حصہ گرا، اور عسقلان کی جامع مسجد کا مینار گر گیا۔ سمندر تقریباً تین فرسخ پیچھے ہٹ گیا، تو لوگ مچھلیاں اور سیپیاں ڈھونڈنے نکل آئے، پھر پانی واپس آیا اور ان میں سے کچھ لوگوں کو بہا لے گیا۔ نقشے کے لیے اس کا کیا مطلب ہے کہ رملہ دو ریکارڈوں میں آتا ہے؟
  entity: event/earthquake-tsunami-425
