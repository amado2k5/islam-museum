  title:
    en: Greeting on meeting and on parting
    ar: السلام عند اللقاء وعند الفراق
    ur: ملاقات اور جدائی کے وقت سلام
  text:
    en: Abd al-Rahman Mansour makes giving the greeting of peace the first of 'the keys to hearts' in his programme Ahalina. He says the greeting belongs to arriving and to leaving alike, and that the first is no more due than the last. Sheikh Omar Abdelkafy counts greeting on meeting among a Muslim's rights over his brother. When do you greet, and when do you take leave, in the language you study?
    ar: يجعل عبد الرحمن منصور إلقاء السلام أول «مفاتيح القلوب» في برنامجه «أهالينا»، ويقول إن السلام يكون عند اللقاء وعند الفراق، فليست الأولى أحق من الآخرة. ويذكر الشيخ عمر عبد الكافي أن السلام عند اللقاء من حقوق المسلم على أخيه. متى تحيّي ومتى تودّع في اللغة التي تتعلمها؟
    ur: عبد الرحمن منصور اپنے پروگرام «أهالينا» میں سلام کرنے کو «دلوں کی کنجیوں» میں پہلی کنجی بتاتے ہیں، اور کہتے ہیں کہ سلام ملاقات کے وقت بھی ہوتا ہے اور جدائی کے وقت بھی، پہلا دوسرے سے زیادہ حق دار نہیں۔ شیخ عمر عبد الکافی ملاقات کے وقت سلام کو مسلمان کے اپنے بھائی پر حقوق میں شمار کرتے ہیں۔ جس زبان کو آپ سیکھ رہے ہیں اس میں آپ کب سلام کرتے اور کب رخصت ہوتے ہیں؟
  entity: practice/greeting-salam
