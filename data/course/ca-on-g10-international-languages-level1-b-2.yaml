  title:
    en: Honouring someone by a kunya
    ar: تكريم الشخص بالكنية
    ur: کنیت سے کسی کو عزت دینا
  text:
    en: The Kuwaiti Encyclopaedia of Fiqh says that a kunya is a name that begins with ab, father, or umm, mother, such as Abu Abd Allah or Umm al-Khayr. It says it is a name besides the given name and the laqab, used with them or alone to honour its bearer, and that it belongs to notable people. Among the Arabs kunyas were so well known that they sometimes overcame the proper names. How would you address someone you wish to honour?
    ar: تقول الموسوعة الفقهية الكويتية إن الكنية ما صُدّر بأب أو أم، كأبي عبد الله وأم الخير، وإنها علم غير الاسم واللقب، تُستعمل معهما أو دونهما تفخيماً لصاحبها، وإنها تكون لأشراف الناس. وقد اشتهرت عند العرب حتى غلبت أحياناً على الأسماء. كيف ستخاطب شخصاً تريد تكريمه؟
    ur: کویتی فقہی انسائیکلوپیڈیا کہتا ہے کہ کنیت وہ نام ہے جو اب، یعنی باپ، یا ام، یعنی ماں، سے شروع ہو، جیسے ابو عبد اللہ اور ام الخیر۔ وہ کہتا ہے کہ یہ اصل نام اور لقب کے علاوہ ایک نام ہے جو ان کے ساتھ یا اکیلا اپنے حامل کی تعظیم کے لیے برتا جاتا ہے، اور یہ کہ وہ معزز لوگوں کے لیے ہوتا ہے۔ عربوں میں کنیتیں اتنی مشہور تھیں کہ کبھی اصل ناموں پر غالب آ گئیں۔ جسے آپ عزت دینا چاہیں اسے کیسے مخاطب کریں گے؟
  entity: concept/kunya-fiqh
