expectations:
- code: D1
  text:
    en: apply the creative process to produce a variety of two- and three-dimensional art works, using elements, principles, and techniques of visual arts to communicate feelings, ideas, and understandings
    ar: طبّق عملية الإبداع لإنتاج أعمال فنية متنوعة ثنائية وثلاثية الأبعاد، مستخدمًا عناصر الفنون البصرية ومبادئها وتقنياتها لإيصال المشاعر والأفكار والفهم
    ur: تخلیقی عمل کو بروئے کار لاتے ہوئے دو اور تین جہتی مختلف فن پارے بنائیں، بصری فنون کے عناصر، اصولوں اور تکنیکوں کو استعمال کرتے ہوئے احساسات، خیالات اور فہم پہنچانے کے لیے
- code: D2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of art works and art experiences
    ar: طبّق عملية التحليل النقدي لتعبّر عن مشاعرك وأفكارك وفهمك استجابةً لأعمال فنية وتجارب فنية متنوعة
    ur: تنقیدی تجزیے کے عمل کو بروئے کار لاتے ہوئے مختلف فن پاروں اور فنی تجربات کے جواب میں اپنے احساسات، خیالات اور فہم کا اظہار کریں
- code: D3
  text:
    en: demonstrate an understanding of a variety of art forms, styles, and techniques from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لأشكال وأساليب وتقنيات فنية متنوعة من الماضي والحاضر ولسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کے مختلف فنی اشکال، اسالیب اور تکنیکوں اور ان کے سماجی، ثقافتی اور تاریخی سیاق کی سمجھ کا مظاہرہ کریں
