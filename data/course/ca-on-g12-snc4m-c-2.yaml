connections:
- position: within
  kind: reflection
  title:
    en: Does disease pass from one person to another?
    ar: هل ينتقل المرض من شخص إلى آخر؟
    ur: کیا بیماری ایک شخص سے دوسرے کو لگتی ہے؟
  text:
    en: In the jurists' theology of causation, most scholars hold that disease does not pass by its own nature but by God's act and decree, and they reconcile the hadith 'no contagion' with the hadith 'the diseased should not be brought to the healthy'. Umar and a group of early scholars deny contagion; another group affirms it. The record adds that entering a land of plague is forbidden. What does each view ask of a person?
    ar: في عقيدة الفقهاء في السببية، جمهور العلماء على أن المرض لا يعدي بطبعه، وإنما بفعل الله وقدره، ويجمعون بين حديث «لا عدوى» وحديث «لا يورد ممرض على مصح». وذهب عمر وجماعة من السلف إلى نفي العدوى، وذهب فريق من العلماء إلى إثباتها. ويضيف السجل أن الدخول إلى أرض الوباء منهي عنه. ماذا يطلب كل رأي من الإنسان؟
    ur: فقہا کے نظریۂ اسباب میں، جمہور علما کہتے ہیں کہ بیماری اپنی طبیعت سے نہیں لگتی بلکہ اللہ کے فعل اور تقدیر سے، اور وہ حدیث «لا عدوى» اور حدیث «بیمار کو تندرست کے پاس نہ لایا جائے» کو جمع کرتے ہیں۔ عمر اور سلف کی ایک جماعت عدوی کی نفی کرتی ہے؛ علما کا ایک گروہ اس کا اثبات کرتا ہے۔ ریکارڈ مزید کہتا ہے کہ طاعون زدہ سرزمین میں داخل ہونا منع ہے۔ ہر رائے انسان سے کیا چاہتی ہے؟
  entity: concept/adwa
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: after
  kind: reflection
  title:
    en: Do not enter, do not flee
    ar: لا تدخلوها ولا تخرجوا فرارًا
    ur: نہ داخل ہوں، نہ بھاگیں
  text:
    en: 'The record describes the plague as a torment God sent upon whom He willed and made a mercy for believers. It gives a saying reported in the Sahih collections of al-Bukhari and Muslim: whoever hears of it in a land does not enter it, and whoever is in it does not flee from it. Which choice does each instruction put to an individual, and what would it change for others?'
    ar: 'يصف السجل الطاعون بأنه رجز وعذاب أرسله الله على من شاء من عباده، وجعله رحمة للمؤمنين. ويورد السجل توجيهًا مرويًّا في صحيحي البخاري ومسلم: من سمع به بأرض فلا يدخلها، ومن كان بها فلا يخرج منها هربًا. أي خيار يضعه كل توجيه أمام الفرد، وماذا يغيّر في حال غيره؟'
    ur: 'ریکارڈ طاعون کو ایسی آزمائش بتاتا ہے جو اللہ نے جس پر چاہا بھیجی اور اہلِ ایمان کے لیے رحمت بنایا۔ ریکارڈ ایک ارشاد دیتا ہے جو صحیح بخاری اور صحیح مسلم میں روایت ہوا ہے: جو اس کے بارے میں کسی سرزمین میں سنے وہ اس میں داخل نہ ہو، اور جو اس میں ہو وہ اس سے بھاگ کر نہ نکلے۔ ہر ہدایت فرد کے سامنے کون سا انتخاب رکھتی ہے، اور دوسروں کے لیے اس سے کیا بدلتا ہے؟'
