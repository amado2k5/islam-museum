  ur: عدوی کے بارے میں، اور طاعون زدہ سرزمین میں داخل ہونے یا وہاں سے نکلنے کے بارے میں، میوزیم کے ریکارڈ کیا کہتے ہیں، فرد کے انتخاب کے سوال کے طور پر ⁦(C1.2، C3.5)⁩۔
