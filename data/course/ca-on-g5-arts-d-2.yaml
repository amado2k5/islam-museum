- position: after
  kind: object
  title:
    en: Colour and the cut in glazed tile
    ar: اللون والقصّ في البلاط المزجج
    ur: چمکدار ٹائل میں رنگ اور کٹاؤ
  text:
    en: 'Newcomb describes zellij as the ceramic mosaic used in Morocco. Some is made of small squares, hexagons and other regular shapes, its pattern carried by colour. Inscriptions on panel borders are made from whole glazed tiles, usually black: the surface round the letters is cut through the glaze to the terracotta, leaving black letters on a terracotta ground. In this tilework, where does colour carry the design and where does the cut?'
    ar: الزليج فسيفساء خزفية تُكسى بها الأرضيات والجدران في المغرب الأقصى. ومن الفسيفساء عند نيوكومب ما يتألف من مربعات ومسدسات وأشكال منتظمة صغيرة يقوم نمطها على اختلاف الألوان. وتُصنع الكتابات العربية والكوفية في أطر اللوحات من بلاطات مزججة كاملة، سوداء في الغالب، يُنقر ما حول الحروف بالأزاميل حتى يظهر الفخار، فيبدو الخط أسود على أرضية فخارية. أين يحمل اللون التصميم وأين يحمله القصّ في هذا البلاط؟
    ur: زلیج مراکش میں فرشوں اور دیواروں پر لگایا جانے والا چینی موزیک ہے۔ نیوکومب کے بیان میں اس کا کچھ حصہ چھوٹے مربعوں، مسدسوں اور دوسری باقاعدہ شکلوں سے بنتا ہے جن کا نقش رنگوں کے فرق سے قائم ہوتا ہے۔ تختیوں کے کناروں پر عربی اور کوفی کتبے پوری چمکدار ٹائلوں سے بنتے ہیں، جو زیادہ تر سیاہ ہوتی ہیں؛ حروف کے گرد کا حصہ چھینیوں سے تراشا جاتا ہے یہاں تک کہ مٹی نکل آئے، اور خط مٹی کے رنگ کی زمین پر سیاہ دکھائی دیتا ہے۔ اس ٹائل کاری میں رنگ ڈیزائن کہاں اٹھاتا ہے اور کٹاؤ کہاں؟
