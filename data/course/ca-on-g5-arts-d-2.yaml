  title:
    en: A flat pattern that respects its surface
    ar: نقش مسطّح يحترم سطحه
    ur: سطح کا لحاظ رکھنے والا ہموار نقش
  text:
    en: Richard Yeomans sees the beginning of the Islamic arabesque in a style found at Samarra, where leaves become simple shapes, lose their stems and are arranged into a flat pattern on the surface. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. Where, on a wall or a page, would you look for a pattern that respects its surface?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز وُجد في سامراء، حيث تصير الأوراق أشكالًا بسيطة وتفقد سيقانها وتنتظم في نقش مسطّح على السطح. ويرى أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. أين تبحث، على جدار أو صفحة، عن نقش يحترم سطحه؟
    ur: ریچرڈ یومانز کے نزدیک اسلامی عربیسک کی ابتدا سامرا کے ایک طرز میں دکھائی دیتی ہے، جہاں پتے سادہ شکلیں بن جاتے ہیں، اپنے تنے کھو دیتے ہیں اور سطح پر ایک ہموار نقش میں ترتیب پاتے ہیں۔ ان کی رائے میں نباتاتی عربیسک اسلوبی اور دو جہتی ہے اور سطح کا لحاظ رکھتا ہے، بند اور فطرت نما یونانی رومی آرائش کے برعکس۔ دیوار یا صفحے پر آپ ایسا نقش کہاں تلاش کریں گے جو اپنی سطح کا لحاظ رکھتا ہو؟
  entity: concept/arabesque
