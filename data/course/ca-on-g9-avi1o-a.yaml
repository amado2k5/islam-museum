summary:
  en: What artists make art with, and how works reach an audience; the museum serves what Islamic artists used and two cases of display (A3.1, A3.3).
  ar: بمَ يصنع الفنانون فنّهم، وكيف تبلغ الأعمال جمهورها؛ ويقدّم المتحف ما استخدمه الفنانون المسلمون وحالتين للعرض ⁦(A3.1 وA3.3)⁩.
  ur: فنکار کس چیز سے فن بناتے ہیں اور فن پارے ناظرین تک کیسے پہنچتے ہیں؛ عجائب گھر وہ پیش کرتا ہے جو اسلامی فنکاروں نے استعمال کیا اور نمائش کی دو صورتیں ⁦(A3.1، A3.3)⁩۔
  es: "Con qué materiales crean arte los artistas y cómo sus obras llegan al público; el museo muestra lo que usaban los artistas islámicos y dos vitrinas de exposición (A3.1, A3.3)."
  fr: "Avec quoi les artistes créent-ils de l'art et comment les œuvres atteignent-elles un public ? Le musée présente ce que les artistes islamiques utilisaient et deux vitrines (A3.1, A3.3)."
  tr: "Sanatçılar eserlerini neyle yapıyorlar ve eserler izleyicilerine nasıl ulaşıyor? Müze, Müslüman sanatçıların kullandığı malzemeleri ve iki vitrini (A3.1 ve A3.3) sergiliyor."
  id: "Dengan apa para seniman membuat karya seni mereka, dan bagaimana karya-karya tersebut sampai ke khalayak? Museum ini menampilkan apa yang digunakan oleh para seniman Muslim dan dua etalase (A3.1 dan A3.3)."
