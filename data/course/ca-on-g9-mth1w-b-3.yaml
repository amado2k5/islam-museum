  title:
    ar: أجزاء مقررة من المال
    en: Fixed portions of wealth
    ur: مال کے مقررہ حصے
  text:
    ar: 'تعرّف الزكاة عند الفقهاء بأنها تمليك جزء مخصوص من مال مخصوص لشخص مخصوص. وكما يعدّدها أبو الوفاء المراغي في «من قضايا المال والعمل» فالمقادير: ربع العشر، أي جزء من أربعين، في عشرين مثقالًا من الذهب ومائتي درهم من الفضة؛ والعشر فيما سُقي بماء المطر من الزروع ونصفه، أي جزء من عشرين، فيما سُقي بالآلات؛ والخمس في المعدن والركاز. اكتب كل مقدار نسبةً مئوية. لو أعطى حقل يُسقى بماء المطر ثمانمئة كيلوغرام، فكم يبلغ عشرها؟'
    en: 'The jurists define zakat as the transfer of a fixed portion of a defined wealth to a defined recipient. As Abu al-Wafa al-Maraghi lists them in his Qadaya, the portions are: a quarter-tenth, one fortieth, on twenty mithqals of gold and two hundred dirhams of silver; a tenth on crops watered by rain and half of it, one twentieth, on crops watered by devices; and a fifth on minerals and buried treasure. Write each portion as a percentage. If a rain-fed field yields eight hundred kilograms, what is a tenth of it?'
    ur: 'فقہاء کے نزدیک زکاۃ کسی مخصوص مال کا مقررہ حصہ کسی مخصوص شخص کو دینا ہے۔ جیسا کہ ابو الوفاء المراغی «من قضایا المال والعمل» میں گنواتے ہیں، حصے یہ ہیں: بیس مثقال سونے اور دو سو درہم چاندی میں ربع العشر، یعنی چالیسواں حصہ؛ فصلوں میں بارش کے پانی پر عشر اور مشینوں سے سینچنے پر اس کا نصف، یعنی بیسواں حصہ؛ اور معدن اور رکاز میں خمس۔ ہر حصے کو فیصد کی شکل میں لکھیں۔ اگر بارانی کھیت آٹھ سو کلوگرام پیداوار دے تو اس کا دسواں حصہ کتنا ہوگا؟'
