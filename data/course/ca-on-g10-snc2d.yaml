summary:
  en: 'The Ontario Grade 10 Science course SNC2D has five strands: investigation skills, biology, chemistry, climate change and optics. The museum maps four of them, through physicians, optical scholars, fatwa answers and an old geography of the earth.'
  ar: 'لمقرر العلوم SNC2D للصف العاشر في أونتاريو خمسة محاور: مهارات الاستقصاء، والأحياء، والكيمياء، وتغيّر المناخ، والبصريات. ويربط المتحف أربعة منها، عبر الأطباء وعلماء البصريات وأجوبة الفتاوى وجغرافيا قديمة للأرض.'
  ur: 'اونٹاریو کے جماعت دہم سائنس کورس SNC2D کی پانچ شاخیں ہیں: تفتیشی مہارتیں، حیاتیات، کیمیا، موسمیاتی تبدیلی اور بصریات۔ میوزیم ان میں سے چار کو جوڑتا ہے، اطبا، بصریات کے علما، فتویٰ کے جوابات اور زمین کی ایک پرانی جغرافیہ کے ذریعے۔'
