summary:
  en: 'The Ontario Grade 10 Science course SNC2D has five strands: investigation skills, biology, chemistry, climate change and optics. The museum maps four of them, through physicians, optical scholars, fatwa answers and an old geography of the earth.'
  ar: 'لمقرر العلوم SNC2D للصف العاشر في أونتاريو خمسة محاور: مهارات الاستقصاء، والأحياء، والكيمياء، وتغيّر المناخ، والبصريات. ويربط المتحف أربعة منها، عبر الأطباء وعلماء البصريات وأجوبة الفتاوى وجغرافيا قديمة للأرض.'
  ur: 'اونٹاریو کے جماعت دہم سائنس کورس SNC2D کی پانچ شاخیں ہیں: تفتیشی مہارتیں، حیاتیات، کیمیا، موسمیاتی تبدیلی اور بصریات۔ میوزیم ان میں سے چار کو جوڑتا ہے، اطبا، بصریات کے علما، فتویٰ کے جوابات اور زمین کی ایک پرانی جغرافیہ کے ذریعے۔'
  es: "El curso de Ciencias de 10.º grado de Ontario, SNC2D, consta de cinco ejes temáticos: habilidades de investigación, biología, química, cambio climático y óptica. El museo ilustra cuatro de ellos a través de médicos, expertos en óptica, respuestas a fatuas y una antigua geografía de la Tierra."
  fr: "Le cours de sciences de 10e année de l'Ontario (SNC2D) comporte cinq volets: les techniques d'investigation, la biologie, la chimie, les changements climatiques et l'optique. Le musée en présente quatre, à travers des portraits de médecins, d'opticiens, des réponses à des fatwas et une ancienne carte géographique de la Terre."
  tr: "Ontario'daki 10. sınıf için SNC2D fen bilimleri müfredatı beş ana temaya sahiptir: araştırma becerileri, biyoloji, kimya, iklim değişikliği ve optik. Müze, bu temalardan dördünü hekimler, optisyenler, din bilginleri ve antik coğrafya aracılığıyla birbirine bağlıyor."
  id: "Kurikulum sains SNC2D untuk kelas 10 di Ontario memiliki lima tema utama: keterampilan penyelidikan, biologi, kimia, perubahan iklim, dan optik. Museum ini menghubungkan empat tema tersebut melalui dokter, ahli optik, cendekiawan agama, dan geografi kuno."
