label:
  en: Grade 11 Music (AMU3M)
  ar: الموسيقى للصف الحادي عشر، AMU3M
  ur: جماعت یازدہم موسیقی، AMU3M
  es: "Música de 11.º grado (AMU3M)"
  fr: "Musique de 11e année (AMU3M)"
  tr: "11. Sınıf Müzik Dersi, AMU3M"
  id: "Musik untuk Kelas 11, AMU3M"
summary:
  en: 'The Ontario Grade 11 course AMU3M: three strands, creating and performing, reflecting, responding and analysing, and foundations. The museum maps six of the expectations through examples from the Muslim world only: how music answers to its society, the musicians who shaped it, how traditions meet, how we know about a musician, and the development of an instrument and of music in South Asia.'
  ar: 'مقرر AMU3M للصف الحادي عشر في أونتاريو: ثلاثة محاور هي الإبداع والأداء، والتأمل والاستجابة والتحليل، والأسس. ويربط المتحف ست توقعات بأمثلة من العالم الإسلامي فقط: كيف تستجيب الموسيقى لمجتمعها، والموسيقيون الذين صنعوها، وكيف تلتقي التقاليد، وكيف نعرف شيئًا عن موسيقي، وتطور آلة موسيقية والموسيقى في جنوب آسيا.'
  ur: 'اونٹاریو کا کورس AMU3M برائے جماعت یازدہم: تین شاخیں، تخلیق و پیشکش، غور، ردِّعمل و تجزیہ، اور بنیادیں۔ عجائب گھر چھ توقعات کو جوڑتا ہے، صرف مسلم دنیا کی مثالوں سے: موسیقی اپنے معاشرے کو کیسے جواب دیتی ہے، اسے کن موسیقاروں نے شکل دی، روایتیں کیسے ملتی ہیں، موسیقار کے بارے میں ہم کیسے جانتے ہیں، اور ایک ساز اور جنوبی ایشیا کی موسیقی کی ترقی۔'
  es: "El curso AMU3M de 11.º grado de Ontario se compone de tres ejes: creación e interpretación, reflexión, respuesta y análisis, y fundamentos. El museo ilustra seis de las expectativas mediante ejemplos del mundo musulmán: cómo la música responde a su sociedad, los músicos que la moldearon, cómo confluyen las tradiciones, cómo conocemos a un músico y el desarrollo de un instrumento y de la música en el sur de Asia."
  fr: "Le cours AMU3M de 11e année en Ontario comprend trois volets: création et interprétation, réflexion, réaction et analyse, et fondements. Le musée illustre six des attentes à travers des exemples tirés exclusivement du monde musulman: la manière dont la musique reflète sa société, les musiciens qui l’ont façonnée, la rencontre des traditions, la manière dont on reconnaît un musicien, et le développement d’un instrument et de la musique en Asie du Sud."
  tr: "Ontario'daki 11. sınıf için AMU3M müfredatının üç ana teması vardır: Yaratıcılık ve Performans, Yansıtma, Tepki ve Analiz ve Temeller. Müze, bu temalardan altısını İslam dünyasından örneklerle ilişkilendiriyor: müziğin topluma nasıl tepki verdiği, onu yaratan müzisyenler, geleneklerin nasıl kesiştiği, bir müzisyen hakkında nasıl bilgi edindiğimiz ve Güney Asya'da bir müzik aletinin ve müziğin evrimi."
  id: "Kurikulum AMU3M untuk kelas 11 di Ontario memiliki tiga tema utama: Kreativitas dan Pertunjukan, Refleksi, Respons dan Analisis, serta Landasan. Museum ini menghubungkan enam tema tersebut dengan contoh-contoh dari dunia Islam: bagaimana musik merespons masyarakatnya, para musisi yang menciptakannya, bagaimana tradisi saling beririsan, bagaimana kita belajar tentang seorang musisi, dan evolusi alat musik dan musik di Asia Selatan."
