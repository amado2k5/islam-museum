summary:
  en: 'The Ontario Grade 11 course AMU3M: three strands, creating and performing, reflecting, responding and analysing, and foundations. The museum maps six of the expectations through examples from the Muslim world only: how music answers to its society, the musicians who shaped it, how traditions meet, how we know about a musician, and the development of an instrument and of music in South Asia.'
  ar: 'مقرر AMU3M للصف الحادي عشر في أونتاريو: ثلاثة محاور هي الإبداع والأداء، والتأمل والاستجابة والتحليل، والأسس. ويربط المتحف ست توقعات بأمثلة من العالم الإسلامي فقط: كيف تستجيب الموسيقى لمجتمعها، والموسيقيون الذين صنعوها، وكيف تلتقي التقاليد، وكيف نعرف شيئًا عن موسيقي، وتطور آلة موسيقية والموسيقى في جنوب آسيا.'
  ur: 'اونٹاریو کا کورس AMU3M برائے جماعت یازدہم: تین شاخیں، تخلیق و پیشکش، غور، ردِّعمل و تجزیہ، اور بنیادیں۔ عجائب گھر چھ توقعات کو جوڑتا ہے، صرف مسلم دنیا کی مثالوں سے: موسیقی اپنے معاشرے کو کیسے جواب دیتی ہے، اسے کن موسیقاروں نے شکل دی، روایتیں کیسے ملتی ہیں، موسیقار کے بارے میں ہم کیسے جانتے ہیں، اور ایک ساز اور جنوبی ایشیا کی موسیقی کی ترقی۔'
