connections:
- position: within
  kind: reflection
  title:
    en: A celebration that returns
    ar: احتفال يعود
    ur: لوٹ کر آنے والی تقریب
  text:
    en: '''Eid comes from ''awd, "returning", because it recurs. The Kuwaiti jurisprudence encyclopaedia, which gives this etymology, says the Muslims have two Eids: the day of fitr, the first of Shawwal, and the day of adha, the tenth of Dhu''l-Hijja. It adds that takbir is prescribed on the two Eids on the way to the prayer, in homes, markets and roads, until the prayer begins. What would you ask a family, to learn how they keep such a day?'
    ar: 'العيد مأخوذ من العود لأنه يتكرر. وتذكر الموسوعة الفقهية الكويتية، وهي التي تذكر هذا الاشتقاق، أن للمسلمين عيدين: يوم الفطر في أول شوال، ويوم الأضحى في العاشر من ذي الحجة. وتضيف أن التكبير مشروع في العيدين في الغدو إلى الصلاة في المنازل والأسواق والطرق حتى تبدأ الصلاة. ماذا تسأل أسرةً لتعرف كيف تُحيي يومًا كهذا؟'
    ur: 'عید «عود» سے ہے جس کا مطلب لوٹنا ہے، کیونکہ یہ بار بار آتی ہے۔ کویتی فقہی انسائیکلوپیڈیا کے مطابق، جو یہ اشتقاق بتاتا ہے، مسلمانوں کی دو عیدیں ہیں: عیدالفطر، یکم شوال کو، اور عیدالاضحیٰ، دس ذوالحجہ کو۔ وہ یہ بھی بتاتا ہے کہ دونوں عیدوں پر نماز کی طرف جاتے ہوئے گھروں، بازاروں اور راستوں میں نماز شروع ہونے تک تکبیر کہنا مشروع ہے۔ ایسا دن منانے کا طریقہ جاننے کے لیے آپ کسی خاندان سے کیا پوچھیں گے؟'
