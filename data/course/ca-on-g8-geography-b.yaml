expectations:
- code: B1
  text:
    en: 'analyse some interrelationships among factors that contribute to global inequalities, with a focus on inequalities in quality of life, and assess various responses to these inequalities (FOCUS ON: Interrelationships)'
    ar: 'حلّل بعض الترابطات بين العوامل المسهمة في التفاوتات العالمية، مع التركيز على التفاوتات في جودة الحياة، وقيّم مختلف الاستجابات لهذه التفاوتات ⁦(التركيز على: الترابطات)⁩'
    ur: 'عالمی عدم مساوات میں حصہ ڈالنے والے عوامل کے باہمی روابط کا تجزیہ کریں، خصوصاً معیارِ زندگی میں عدم مساوات، اور ان عدم مساواتوں کے مختلف جوابات کا جائزہ لیں ⁦(توجہ: باہمی روابط)⁩'
- code: B2
  text:
    en: 'use the geographic inquiry process to investigate issues related to global development and quality of life from a geographic perspective (FOCUS ON: Geographic Perspective)'
    ar: 'استخدم عملية الاستقصاء الجغرافي لدراسة قضايا التنمية العالمية وجودة الحياة من منظور جغرافي ⁦(التركيز على: المنظور الجغرافي)⁩'
    ur: 'جغرافیائی تحقیقی عمل کو استعمال کر کے عالمی ترقی اور معیارِ زندگی سے متعلق مسائل کی جغرافیائی نقطۂ نظر سے تحقیق کریں ⁦(توجہ: جغرافیائی نقطۂ نظر)⁩'
- code: B3
  text:
    en: 'demonstrate an understanding of significant patterns in and factors affecting economic development and quality of life in different regions of the world (FOCUS ON: Spatial Significance; Patterns and Trends)'
    ar: 'أظهر فهمًا للأنماط المهمة في التنمية الاقتصادية وجودة الحياة وللعوامل المؤثرة فيهما في مناطق مختلفة من العالم ⁦(التركيز على: الأهمية المكانية؛ الأنماط والاتجاهات)⁩'
    ur: 'دنیا کے مختلف خطوں میں معاشی ترقی اور معیارِ زندگی کے اہم نمونوں اور ان پر اثر ڈالنے والے عوامل کی سمجھ کا مظاہرہ کریں ⁦(توجہ: مکانی اہمیت؛ نمونے اور رجحانات)⁩'
