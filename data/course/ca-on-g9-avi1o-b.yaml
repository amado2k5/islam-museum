expectations:
- code: B1
  text:
    en: demonstrate an understanding of the critical analysis process by examining, interpreting, evaluating, and reflecting on various art works
    ar: أظهر فهمًا لعملية التحليل النقدي بفحص أعمال فنية متنوعة وتفسيرها وتقييمها والتأمل فيها
    ur: مختلف فن پاروں کا جائزہ لے کر، ان کی تعبیر اور تشخیص کر کے اور ان پر غور کر کے تنقیدی تجزیے کے عمل کی سمجھ کا مظاہرہ کریں
- code: B2
  text:
    en: demonstrate an understanding of how art works reflect the society in which they were created, and of how they can affect personal values
    ar: أظهر فهمًا لكيفية انعكاس المجتمع الذي أُنشئت فيه الأعمال الفنية عليها، ولكيفية تأثيرها في القيم الشخصية
    ur: اس بات کی سمجھ کا مظاہرہ کریں کہ فن پارے اس معاشرے کو کیسے ظاہر کرتے ہیں جس میں وہ تخلیق ہوئے، اور وہ ذاتی اقدار پر کیسے اثر ڈال سکتے ہیں
- code: B3
  text:
    en: demonstrate an understanding of the types of knowledge and skills developed in visual arts, and identify various opportunities related to visual arts
    ar: أظهر فهمًا لأنواع المعرفة والمهارات التي تنمّيها الفنون البصرية، وحدّد فرصًا متنوعة متصلة بالفنون البصرية
    ur: بصری فنون میں پروان چڑھنے والے علم اور مہارتوں کی اقسام کی سمجھ کا مظاہرہ کریں، اور بصری فنون سے متعلق مختلف مواقع کی نشاندہی کریں
