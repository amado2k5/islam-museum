- position: after
  kind: invention
  title:
    en: Measuring a ceiling of hollows
    ar: قياس سقف من التجاويف
    ur: کھوکھلوں سے بنی چھت کی پیمائش
  text:
    en: 'In the Key to Arithmetic, al-Kashi organised the measurement of muqarnas, the tiered cellular construction that articulates and decorates ceilings: he selects a module, counts elements by shape, and adds the surfaces of facets, roofs and connecting pieces. Dold-Samplonius notes an inconsistency in the projection and values whose derivation she does not know. Why is counting hollows in a photograph not enough to find the surface area?'
    ar: 'في «مفتاح الحساب» نظّم الكاشي قياس سطح المقرنص، وهو البناء الخلوي المتدرج الذي يربط أجزاء السقف ويزينها: يختار وحدة معيارية، ويعدّ الأجزاء بحسب أشكالها، ويجمع مساحات الوجوه والسقوف والعناصر الواصلة. وتذكر دولد-سامبلونيوس تناقضاً في المسقط وقيماً لم تعرف اشتقاقها. لماذا لا يكفي عدّ التجاويف في صورة لحساب السطح؟'
    ur: '«مفتاح الحساب» میں الکاشی نے مقرنس کی سطح کی پیمائش کو ترتیب دیا، جو تہ بہ تہ خانوں والی وہ تعمیر ہے جو چھت کے حصوں کو جوڑتی اور سجاتی ہے: وہ ایک معیاری اکائی چنتا ہے، اجزا کو ان کی شکلوں کے مطابق گنتا ہے، اور رخوں، چھتوں اور جوڑنے والے اجزا کے رقبے جمع کرتا ہے۔ دولد-سامبلونیوس اسقاط میں ایک تضاد اور ایسی قدروں کا ذکر کرتی ہیں جن کی اخذ کا انہیں علم نہیں۔ تصویر میں کھوکھلے گن لینا سطح کا رقبہ معلوم کرنے کے لیے کیوں کافی نہیں؟'
