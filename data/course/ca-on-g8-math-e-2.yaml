  title:
    en: A chapter on measuring
    ar: باب في المساحة
    ur: پیمائش کا ایک باب
  text:
    en: 'Mensuration is the science of measuring areas and volumes, and al-Khwarizmi gave it a chapter of his book. The record lists his rules: the area of a triangle is its height times half its base, and the circumference of a circle is the diameter times three and a seventh, which he calls "a convention among people, not a necessity". Which of these rules can you check by measuring a real circle?'
    ar: 'المساحة علم قياس السطوح والأجسام، وقد خصّه الخوارزمي بباب في كتابه. ويورد السجل قواعده: تكسير المثلث أن تضرب عموده في نصف قاعدته، ودور الدائرة، أي محيطها، القطر في ثلاثة وسبع، وهو عنده «اصطلاح بين الناس من غير اضطرار». أي هذه القواعد تستطيع أن تتحقق منه بقياس دائرة حقيقية؟'
    ur: 'مساحت سطحوں اور اجسام کو ناپنے کا علم ہے، اور الخوارزمی نے اس کے لیے اپنی کتاب میں ایک باب رکھا۔ ریکارڈ اس کے قاعدے گنواتا ہے: مثلث کا رقبہ اس کی بلندی کو آدھے قاعدے سے ضرب دینا ہے، اور دائرے کا محیط قطر کو تین اور ایک ساتویں سے ضرب دینا ہے، جسے وہ «لوگوں کے درمیان ایک اصطلاح، بغیر کسی لازمی ضرورت کے» کہتا ہے۔ ان میں سے کون سا قاعدہ آپ ایک حقیقی دائرہ ناپ کر جانچ سکتے ہیں؟'
  entity: concept/ilm-al-misaha
  sources:
