- position: within
  kind: invention
  title:
    en: Sixteen decimal places for the circle
    ar: ست عشرة منزلة عشرية للدائرة
    ur: دائرے کے لیے سولہ اعشاری مقام
  text:
    en: MacTutor dates al-Kashi's Treatise on the Circumference to 1424 and describes him expressing twice the ratio of circumference to diameter in sexagesimal and decimal forms with high precision. Okten reports the decimal value 6.2831853071795865, an approximation to twice the ratio, not to pi itself. The record calls this an improvement of an inherited calculation, not the discovery of pi. Which circle has a circumference equal to that number?
    ar: تؤرخ ماكتوتر «الرسالة المحيطية» للكاشي بسنة 1424، وتذكر أنه أخرج ضعف نسبة المحيط إلى القطر في النظام الستيني ثم العشري بدقة عالية. وينقل أوكتن العدد العشري 6.2831853071795865، وهو قيمة تقريبية لضعف النسبة لا لـpi نفسها. ويصف السجل ذلك بأنه تحسين لحساب قديم لا اكتشاف pi. أي دائرة يساوي محيطها هذا العدد؟
    ur: ماک ٹیوٹر الکاشی کی «الرسالۃ المحیطیہ» کو 1424ء کی بتاتی ہے اور کہتی ہے کہ اس نے محیط اور قطر کی نسبت کا دگنا ساٹھ کے نظام اور اعشاری نظام دونوں میں اعلیٰ درستی سے نکالا۔ اوکتن اعشاری عدد 6.2831853071795865 نقل کرتا ہے، جو نسبت کے دگنے کی تقریبی قدر ہے، pi کی نہیں۔ ریکارڈ اسے ایک پرانے حساب کی بہتری کہتا ہے، pi کی دریافت نہیں۔ کس دائرے کا محیط اس عدد کے برابر ہے؟
  entity: invention/al-kashi-pi-calculation
  sources:
