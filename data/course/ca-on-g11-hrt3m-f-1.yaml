  title:
    en: A mosque of mud brick
    ar: مسجد من اللبن
    ur: کچی اینٹوں کی مسجد
  text:
    en: 'Al-Samhudi writes in Wafa'' al-wafa that the Prophet''s mosque in Medina was built of mud brick on a stone foundation about three cubits high. He reports its area in different ways: seventy cubits by sixty, or a hundred by a hundred. He says its qibla was at first toward Jerusalem; when the qibla was changed, the back door was closed and a door opened opposite it. What does a plain building tell us about what its builders valued?'
    ar: 'يذكر السمهودي في «وفاء الوفا» أن المسجد النبوي في المدينة بُني من اللبن على أساس من الحجارة ارتفاعه نحو ثلاثة أذرع. ويروي مساحته بوجوه مختلفة: سبعون ذراعًا في ستين، أو مئة في مئة. ويقول إن قبلته كانت أولًا إلى بيت المقدس، فلما حُوّلت القبلة أُغلق الباب الخلفي وفُتح باب مقابله. ماذا يخبرنا بناء بسيط عما كان يعنيه لبانيه؟'
    ur: 'سمہودی «وفاء الوفا» میں لکھتے ہیں کہ مسجدِ نبوی مدینہ میں کچی اینٹوں سے پتھر کی تقریباً تین ہاتھ اونچی بنیاد پر بنائی گئی۔ وہ اس کا رقبہ مختلف طرح نقل کرتے ہیں: ستر ہاتھ ضرب ساٹھ، یا سو ضرب سو۔ وہ کہتے ہیں کہ اس کا قبلہ پہلے بیت المقدس کی طرف تھا؛ جب قبلہ بدلا گیا تو پچھلا دروازہ بند کر دیا گیا اور اس کے سامنے دروازہ کھولا گیا۔ ایک سادہ عمارت ہمیں بنانے والوں کی قدروں کے بارے میں کیا بتاتی ہے؟'
