  kind: reflection
  title:
    en: Images of living beings
    ar: صور ذوات الأرواح
    ur: جانداروں کی تصاویر
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence says depicting man-made things is lawful by agreement, and plants lawful for the majority; the prohibition concerns images of humans and animals, on which it reports three views among jurists. One permits them unless an idol is made for worship; the Malikis forbid only three-dimensional images complete in their limbs. Among the reasons it gives, images lead to excess and worship, as the Arabs made idols. How would you explain a prohibition and its limits?
    ar: تقول الموسوعة الفقهية الكويتية إن تصوير المصنوعات جائز بالاتفاق، وتصوير النبات جائز عند الجمهور؛ والمنع يتعلق بصور الإنسان والحيوان، وتنقل فيها ثلاثة أقوال للفقهاء. أحدها يجيزها إلا أن يصنع المرء صنمًا يُعبد، ويمنع المالكية ما له ظل وكان كامل الأعضاء. ومن الأسباب التي تذكرها أن الصور تفضي إلى الغلو والعبادة كما صنعت العرب الأصنام. كيف تشرح منعًا وحدوده؟
    ur: کویتی فقہی انسائیکلوپیڈیا کہتا ہے کہ انسانی بنائی چیزوں کی تصویر بالاتفاق جائز ہے اور پودوں کی جمہور کے نزدیک؛ ممانعت انسانوں اور جانوروں کی تصاویر سے متعلق ہے، جن پر وہ فقہا کے تین اقوال نقل کرتا ہے۔ ایک قول انہیں جائز کہتا ہے الا یہ کہ پوجا کے لیے بت بنایا جائے؛ مالکیہ صرف وہ سہ بعدی تصاویر منع کرتے ہیں جو اعضا میں مکمل ہوں۔ اس کی بیان کردہ وجوہ میں یہ ہے کہ تصاویر غلو اور عبادت کی طرف لے جاتی ہیں جیسے عربوں نے بت بنائے۔ آپ کسی ممانعت اور اس کی حدود کی وضاحت کیسے کریں گے؟
