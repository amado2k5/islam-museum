  title:
    en: The art of beautiful script
    ar: فن الخط الجميل
    ur: خوبصورت تحریر کا فن
  text:
    en: Wikidata describes Islamic calligraphy as the art of writing and shaping the Arabic letter beautifully, and ties it to the writing of the Qur'an. Its scripts include Kufic, Naskh, Thuluth and Diwani. How might an art of writing be tied to the writing of a scripture?
    ar: يصف ويكيداتا الخط الإسلامي بأنه فن كتابة الحرف العربي وتشكيله جمالياً، ويربطه بكتابة القرآن. ومن خطوطه الكوفي والنسخ والثلث والديواني. كيف يمكن أن يرتبط فن للكتابة بكتابة كتاب مقدس؟
    ur: ویکی ڈیٹا اسلامی خطاطی کو عربی حرف کو خوبصورتی سے لکھنے اور ڈھالنے کا فن بتاتا ہے، اور اسے قرآن کی کتابت سے جوڑتا ہے۔ اس کے خطوں میں کوفی، نسخ، ثلث اور دیوانی شامل ہیں۔ لکھنے کا فن کسی مقدس کتاب کی کتابت سے کیسے جڑ سکتا ہے؟
  entity: concept/islamic-calligraphy
  sources:
