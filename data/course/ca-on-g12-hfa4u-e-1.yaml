  title:
    en: When the flesh of an animal is lawful
    ar: متى يحلّ لحم الحيوان
    ur: جانور کا گوشت کب حلال ہوتا ہے
  text:
    en: The Kuwaiti jurisprudence encyclopaedia defines slaughter as cutting the throat or the lower neck, and dhaka as the wider term, the means that makes the flesh of a land animal lawful to eat. A valid slaughter needs a living animal killed by the cut, a sane slaughterer who is a Muslim or one of the People of the Book, and a blade that cuts. The majority require God's name to be invoked when it is remembered and possible. Which ingredient would this change?
    ar: تعرّف الموسوعة الفقهية الكويتية الذبح بأنه قطع الحلق أو اللبة، والذكاة أعم منه، وهي السبب الموصل لحل أكل الحيوان البري. ويشترط لصحة الذبح أن يكون المذبوح حيا وأن يزهق بالذبح، وأن يكون الذابح عاقلا مسلما أو كتابيا، وأن تكون الآلة قاطعة. وتجب التسمية عند الجمهور مع القدرة والتذكر. فأيّ مكوّن في الوصفة يتغير بهذا؟
    ur: کویتی فقہی انسائیکلوپیڈیا ذبح کی تعریف حلق یا لبہ ⁦(گردن کے نچلے حصے)⁩ کو کاٹنا کرتا ہے، اور ذکاۃ اس سے وسیع تر لفظ ہے، یعنی وہ ذریعہ جس سے خشکی کے جانور کا گوشت کھانا حلال ہوتا ہے۔ ذبح کے درست ہونے کے لیے ضروری ہے کہ جانور زندہ ہو، اس کی موت ذبح سے ہو، ذبح کرنے والا عاقل اور مسلمان یا اہلِ کتاب ہو، اور آلہ کاٹنے والا ہو۔ جمہور کے نزدیک یاد ہونے اور قدرت ہونے پر اللہ کا نام لینا لازم ہے۔ ترکیب کا کون سا جز اس سے بدلے گا؟
