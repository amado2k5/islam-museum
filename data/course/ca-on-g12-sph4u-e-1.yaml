  title:
    en: A glass sphere for a raindrop
    ar: كرة زجاجية بدل قطرة
    ur: بوند کی جگہ شیشے کا گولا
  text:
    en: Kamal al-Din al-Farisi replaced a tiny raindrop with a glass sphere filled with water, to study light in a model he could control. As Russell describes it, he explained the primary rainbow by two refractions with one internal reflection between them, and the secondary by two reflections. Russell also says his attempt to explain colour was unsuccessful. Where does the light bend on this path, and what is left unexplained?
    ar: استبدل كمال الدين الفارسي بالقطرة الصغيرة كرة زجاجية مملوءة بالماء، ليدرس مسار الضوء في نموذج يمكن التحكم فيه. وكما تعرض رسل، شرح القوس الأساسي بانكسارين بينهما انعكاس داخلي واحد، والثانوي بانعكاسين بين الانكسارين. وتصرّح رسل بأن محاولته تفسير اللون لم تنجح. أين ينحني الضوء في هذا المسار، وما الذي بقي بلا تفسير؟
    ur: کمال الدین فارسی نے چھوٹی سی بوند کی جگہ پانی سے بھرا شیشے کا گولا رکھا تاکہ روشنی کا مطالعہ ایسے نمونے میں کرے جسے قابو میں رکھا جا سکے۔ رسل کے بیان کے مطابق اس نے بنیادی قوسِ قزح کی وضاحت دو انعطافوں سے کی جن کے درمیان ایک اندرونی انعکاس ہے، اور ثانوی کی دو انعکاسوں سے۔ رسل یہ بھی کہتی ہے کہ رنگ کی وضاحت کی اس کی کوشش کامیاب نہ ہوئی۔ اس راستے میں روشنی کہاں مڑتی ہے، اور کیا بے وضاحت رہ جاتا ہے؟
