  title:
    en: Three states of light
    ar: ثلاثة أحوال للضوء
    ur: روشنی کی تین حالتیں
  text:
    en: 'Optics is the study of light and vision. The editor of the Kitab al-Manazir notes that the Greeks treated optics as a branch of mathematics, while Ibn al-Haytham made it a mixed science of natural and mathematical kinds and studied light in three states: travelling in straight lines, reflection and refraction. Which of these three have you already seen in everyday life?'
    ar: 'البصريات علم الضوء والإبصار. يرى محقق «كتاب المناظر» أن البحث في البصريات كان عند اليونان أحد فروع الرياضيات، فجعله ابن الهيثم علمًا مركّبًا من العلوم الطبيعية والتعليمية، ودرس فيه أحوال الضوء الثلاثة: الإشراق على الاستقامة والانعكاس والانعطاف. أي هذه الأحوال الثلاثة رأيته في حياتك اليومية؟'
    ur: 'بصریات روشنی اور بینائی کا علم ہے۔ «کتاب المناظر» کا مدیر لکھتا ہے کہ یونانیوں کے ہاں بصریات ریاضی کی ایک شاخ تھی، جبکہ ابن الہیثم نے اسے قدرتی اور ریاضیاتی علوم سے مل کر بنا علم بنایا اور روشنی کی تین حالتوں کا مطالعہ کیا: سیدھا سفر، انعکاس اور انعطاف۔ ان تینوں میں سے کون سی آپ روزمرہ زندگی میں دیکھ چکے ہیں؟'
