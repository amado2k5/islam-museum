  title:
    en: Organs of similar parts
    ar: الأعضاء متشابهة الأجزاء
    ur: ہم جنس حصوں والے اعضا
  text:
    en: In the Canon, Ibn Sina divides the body's organs into simple and composite. A simple organ, such as flesh, bone or nerve, shares the name and definition of the whole in any part taken from it, and such organs are called organs of similar parts. He counts the bone first, because it is the body's foundation and the support of movements, and the nerve, by which sensation and movement are completed. What is each part of the body for?
    ar: يقسّم ابن سينا في «القانون» الأعضاء إلى مفرد ومركّب. فالمفرد ما كان الجزء المأخوذ منه مشاركًا للكل في الاسم والحدّ كاللحم والعظم والعصب، وتسمّى هذه الأعضاء متشابهة الأجزاء. ويعدّد العظم أولًا لأنه أساس البدن ودعامة الحركات، ويعدّد العصب ليتمّ به الإحساس والحركة. فلأي شيء يصلح كل جزء من أجزاء الجسم؟
    ur: ابن سینا «القانون» میں اعضا کو سادہ اور مرکب میں تقسیم کرتا ہے۔ سادہ عضو، جیسے گوشت، ہڈی یا عصب، وہ ہے جس کا لیا ہوا ہر حصہ نام اور تعریف میں پورے کے برابر ہو، اور ایسے اعضا ہم جنس حصوں والے کہلاتے ہیں۔ وہ سب سے پہلے ہڈی کو گنتا ہے، کیونکہ وہ بدن کی بنیاد اور حرکتوں کا سہارا ہے، اور عصب کو، جس سے احساس اور حرکت مکمل ہوتی ہے۔ جسم کا ہر حصہ کس کام کا ہے؟
