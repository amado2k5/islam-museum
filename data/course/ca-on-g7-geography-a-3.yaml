  text:
    en: In al-Idrisi's medieval description, al-Muqattam is a mountain that extends from the first land of Egypt in the desert to near Aswan, and he reports that ochre and lime are extracted from some of its places. Where would you mark a range like this on a map, and what do people take from it?
    ar: في وصف الإدريسي الوسيط، المقطم جبل يمتد من أول أرض مصر في الصحراء حتى قرب أسوان، ويذكر أن المغرة والكلس تُستخرج من بعض مواضعه. أين تضع سلسلة كهذه على الخريطة، وماذا يأخذ الناس منها؟
    ur: ادریسی کے قرونِ وسطیٰ کے بیان کے مطابق مقطم ایک پہاڑ ہے جو مصر کی ابتدائی سرزمین سے صحرا میں اسوان کے قریب تک پھیلا ہوا ہے، اور اس کے بعض مقامات سے گیرو اور چونا نکالا جاتا ہے۔ آپ ایسے سلسلے کو نقشے پر کہاں دکھائیں گے، اور لوگ اس سے کیا لیتے ہیں؟
