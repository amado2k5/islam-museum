expectations:
- code: C3.1
  text:
    en: identify reasons why people make music in their daily lives […], and describe contexts in which they make music […]
    ar: حدِّد أسباب صنع الناس للموسيقى في حياتهم اليومية […]، وصِف السياقات التي يصنعون فيها الموسيقى […]
    ur: ان وجوہات کی نشاندہی کریں جن کی بنا پر لوگ اپنی روزمرہ زندگی میں موسیقی بناتے ہیں […]، اور ان سیاقات کو بیان کریں جن میں وہ موسیقی بناتے ہیں […]
- code: C3.2
  text:
    en: identify, through performing and/or listening, a variety of musical forms or pieces from different communities, times, and places […]
    ar: حدِّد، من خلال الأداء و/أو الاستماع، مجموعة متنوعة من الأشكال أو المقطوعات الموسيقية من مجتمعات وأزمنة وأماكن مختلفة […]
    ur: پیش کرنے اور/یا سننے کے ذریعے مختلف برادریوں، زمانوں اور مقامات کی موسیقی کی اشکال یا پارچوں کی ایک وسیع قسم کی نشاندہی کریں […]
connections:
- position: after
  kind: story
  title:
    en: A family song of devotion
    ar: غناء صوفي تتوارثه أسرة
    ur: عقیدت کا گیت جو ایک خاندان میں چلا آیا
  text:
    en: Qawwali is the Sufi devotional song of Pakistan and India, and the name of Nusrat Fateh Ali Khan (1948–1997) is associated with it. His family had passed qawwali down for some six centuries; he led his family's party from 1971 and performed in over forty countries. Who might gather to hear a devotional song, and what would they listen for?
    ar: القوالي فنّ الإنشاد الصوفي في باكستان والهند، ويرتبط به اسم نصرت فتح علي خان ⁦(1948–1997م)⁩. توارثت أسرته القوالي نحو ستة قرون، وقاد فرقة أسرته منذ 1971، وأحيا حفلات في أكثر من أربعين بلدًا. من قد يجتمع للاستماع إلى إنشاد صوفي، وماذا سيصغي إليه؟
    ur: قوالی پاکستان اور ہندوستان میں صوفیانہ عقیدت کا گیت ہے، اور نصرت فتح علی خان ⁦(1948–1997ء)⁩ کا نام اسی سے وابستہ ہے۔ ان کے خاندان میں قوالی تقریباً چھ صدیوں سے چلی آ رہی تھی؛ انہوں نے 1971 سے اپنے خاندان کی پارٹی کی قیادت کی اور چالیس سے زیادہ ممالک میں پیش کیا۔ عقیدت کا گیت سننے کون جمع ہوتا ہوگا، اور وہ کیا سننے کی توجہ رکھتے ہوں گے؟
  entity: person/nusrat-fatih-ali-khan
