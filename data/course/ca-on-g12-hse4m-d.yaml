expectations:
- code: D1
  text:
    en: demonstrate an understanding of how personal values, knowledge, and actions can contribute to equity and social justice, and assess strategies that people use to address equity and social justice concerns
    ar: أظهر فهمًا لكيفية إسهام القيم الشخصية والمعرفة والأفعال في الإنصاف والعدالة الاجتماعية، وقيّم الاستراتيجيات التي يستخدمها الناس لمعالجة شواغل الإنصاف والعدالة الاجتماعية
    ur: سمجھ ظاہر کریں کہ ذاتی اقدار، علم اور اعمال مساوات اور سماجی انصاف میں کیسے حصہ ڈال سکتے ہیں، اور ان حکمتِ عملیوں کا جائزہ لیں جو لوگ مساوات اور سماجی انصاف کے خدشات سے نمٹنے کے لیے اپناتے ہیں
- code: D2
  text:
    en: describe a variety of careers and volunteer opportunities in fields related to equity and social justice, and demonstrate an understanding of the skills and knowledge they require
    ar: صف مجموعة متنوعة من المهن وفرص التطوع في ميادين متصلة بالإنصاف والعدالة الاجتماعية، وأظهر فهمًا للمهارات والمعارف التي تتطلبها
    ur: مساوات اور سماجی انصاف سے متعلق شعبوں میں مختلف پیشوں اور رضاکارانہ مواقع کا بیان کریں، اور ان کے لیے درکار مہارتوں اور علم کی سمجھ ظاہر کریں
- code: D3
  text:
    en: design, implement, and evaluate an initiative to address an equity or social justice issue
    ar: صمّم مبادرة لمعالجة قضية من قضايا الإنصاف أو العدالة الاجتماعية ونفّذها وقيّمها
    ur: مساوات یا سماجی انصاف کے کسی مسئلے سے نمٹنے کے لیے ایک اقدام ڈیزائن کریں، نافذ کریں اور اس کا جائزہ لیں
