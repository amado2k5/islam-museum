  title:
    en: 'The Ottoman weaver: yarn and cloth'
    ar: 'الحائك العثماني: الغزل والقماش'
    ur: 'عثمانی جولاہا: سوت اور کپڑا'
  text:
    en: The TDV entry says the Ottoman weaver bought yarn ready-spun or spun raw cotton himself; cotton was the main fibre, and wool also appears. Common products were coarse cloth, lining, striped cloth, muslin, makrama and shirting. After dyeing, the merchants sold the cloth in the covered market. Which stages between fibre and cloth does the entry name?
    ar: يقول مدخل TDV إن الجلّاه العثماني كان يشتري الغزل جاهزًا أو يغزل القطن الخام بنفسه، وإن القطن كان الليف الرئيسي ويرد الصوف كذلك. ومن منتجاتهم القماش الخشن والبطانة والمخطط والتلبند والمكرمة وقماش القمصان. وبعد الصباغة يبيع البزازون القماش في البدستان. ما المراحل التي يسمّيها المدخل بين الليف والقماش؟
    ur: موسوعہ TDV کا اندراج کہتا ہے کہ عثمانی جولاہا سوت بنا بنایا خریدتا تھا یا کچی کپاس خود کات لیتا تھا؛ کپاس اصل ریشہ تھی اور اون کا بھی ذکر آتا ہے۔ عام مصنوعات میں موٹا کپڑا، استر، دھاری دار کپڑا، ململ، مکرمہ اور قمیص کا کپڑا شامل تھے۔ رنگائی کے بعد تاجر کپڑا بند بازار میں بیچتے تھے۔ اندراج ریشے اور کپڑے کے درمیان کن مراحل کا نام لیتا ہے؟
  entity: job/weaver
  sources:
