- position: after
  kind: invention
  title:
    en: Letters in the weave of the garment
    ar: الحرف في نسيج الثوب
    ur: لباس کی بُنت میں حروف
  text:
    en: 'Ibn Khaldun describes the craft: the names of rulers, or signs particular to them, were drawn into the weave of their silk and brocade garments, the letters made of the weft and warp in gold thread or in coloured threads that differed from the cloth, as the craftsmen judged. Which part of weaving does this passage describe?'
    ar: 'يصف ابن خلدون الصنعة: تُرسم أسماء الملوك أو علامات تختص بهم في طراز أثوابهم المعدّة للباسهم من الحرير أو الديباج أو الإبريسم، وتُعتبر كتابة خطّها في نسج الثوب ألحامًا وأسداءً بخيط الذهب، أو بخيوط ملوّنة تخالف لون الثوب، على ما يُحكمه الصنّاع. أي جزء من النسج يصفه هذا النص؟'
    ur: 'ابن خلدون اس صنعت کا حال بتاتے ہیں: بادشاہوں کے نام یا ان سے مخصوص نشان ان کے ریشم اور دیباج کے لباس کی بُنت میں اس طرح بنائے جاتے تھے کہ حروف بانے اور تانے سے، سونے کے دھاگے یا کپڑے سے مختلف رنگ کے دھاگوں سے، کاریگروں کی صوابدید کے مطابق بنتے تھے۔ یہ عبارت بُنائی کے کس حصے کو بیان کرتی ہے؟'
  entity: invention/tiraz
  sources:
