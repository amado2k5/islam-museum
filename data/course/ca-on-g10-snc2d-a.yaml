expectations:
- code: A1
  text:
    en: demonstrate scientific investigation skills (related to both inquiry and research) in the four areas of skills (initiating and planning, performing and recording, analysing and interpreting, and communicating)
    ar: أظهر مهارات الاستقصاء العلمي ⁦(المتصلة بالاستقصاء والبحث معًا)⁩ في مجالات المهارات الأربعة ⁦(البدء والتخطيط، والتنفيذ والتسجيل، والتحليل والتفسير، والتواصل)⁩
    ur: سائنسی تفتیش کی مہارتوں ⁦(جو استفسار اور تحقیق دونوں سے متعلق ہیں)⁩ کا مظاہرہ مہارتوں کے چار شعبوں ⁦(آغاز و منصوبہ بندی، عمل و اندراج، تجزیہ و تعبیر، اور ابلاغ)⁩ میں کریں
- code: A2
  text:
    en: identify and describe a variety of careers related to the fields of science under study, and identify scientists, including Canadians, who have made contributions to those fields
    ar: حدّد مجموعة متنوعة من المهن المتصلة بميادين العلم قيد الدراسة وصِفها، وحدّد علماء، ومنهم كنديون، أسهموا في تلك الميادين
    ur: زیرِ مطالعہ سائنسی شعبوں سے متعلق مختلف پیشوں کی نشاندہی کریں اور انہیں بیان کریں، اور ایسے سائنس دانوں کی نشاندہی کریں، جن میں کینیڈین بھی شامل ہیں، جنہوں نے ان شعبوں میں حصہ ڈالا
