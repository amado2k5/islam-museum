summary:
  en: 'The Ontario Ministry''s generic Level 2 University Preparation course in international languages, taught for many languages, Arabic among them: four strands, Listening, Speaking, Reading and Writing. The museum serves only the expectations that ask for knowledge of the cultures and communities where the language is spoken.'
  ar: 'مقرر وزارة أونتاريو العام للغات الدولية، المستوى 2، إعداد جامعي، ويُدرَّس لكثير من اللغات ومنها العربية: أربعة محاور هي الاستماع والتحدث والقراءة والكتابة. ولا يخدم المتحف إلا التوقعات التي تطلب معرفة ثقافات الجماعات التي تُتحدَّث فيها اللغة.'
  ur: 'اونٹاریو کی وزارت کا بین الاقوامی زبانوں کا عمومی کورس، سطح 2، جامعہ کی تیاری، جو کئی زبانوں کے لیے پڑھایا جاتا ہے، عربی بھی ان میں ہے: چار شاخیں، سننا، بولنا، پڑھنا اور لکھنا۔ عجائب گھر صرف ان توقعات کو پورا کرتا ہے جو اس زبان کے بولنے والی جماعتوں کی ثقافتوں کے علم کا تقاضا کرتی ہیں۔'
