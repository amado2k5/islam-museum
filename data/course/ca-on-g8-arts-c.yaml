- code: C2
  text:
    en: apply the critical analysis process to communicate their feelings, ideas, and understandings in response to a variety of music and musical experiences
    ar: طبّق عملية التحليل النقدي ليعبّر عن مشاعره وأفكاره وفهمه استجابةً لتنوّع من الموسيقى والتجارب الموسيقية
    ur: تنقیدی تجزیے کا عمل بروئے کار لا کر مختلف قسم کی موسیقی اور موسیقی کے تجربات کے جواب میں اپنے احساسات، خیالات اور سمجھ کا اظہار کریں
- code: C3
  text:
    en: demonstrate an understanding of a variety of musical genres and styles from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لتنوّع من الأنواع والأساليب الموسيقية من الماضي والحاضر وسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کی موسیقی کی مختلف اصناف اور اسالیب اور ان کے سماجی، ثقافتی اور تاریخی سیاق کی سمجھ کا مظاہرہ کریں
