expectations:
- code: C1
  text:
    en: apply the creative process to create and perform music for a variety of purposes, using the elements and techniques of music
    ar: طبّق عملية الإبداع لإنتاج الموسيقى وأدائها لأغراض متنوعة، مستخدمًا عناصر الموسيقى وتقنياتها
