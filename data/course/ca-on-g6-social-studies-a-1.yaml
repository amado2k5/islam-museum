connections:
- position: within
  kind: story
  title:
    en: A month for one community's history
    ar: شهر لتاريخ جماعة بعينها
    ur: ایک برادری کی تاریخ کا مہینہ
  text:
    ar: شهر التاريخ الإسلامي الكندي هو شهر أكتوبر من كل سنة في كندا، أُنشئ أول مرة سنة 2007 للتعريف بتاريخ المسلمين في كندا وثقافتهم وإسهاماتهم والاحتفاء بها والتأمل فيها. وتقدّمه صفحة حكومة كندا فرصةً لكل الكنديين للحوار وتعميق الفهم وتعزيز الاندماج وتقدير تنوع المجتمعات المسلمة الكندية. وتذكر الصفحة اسم الشهر وعناوين حملاته السنوية، مثل حملة 2023 «الاحتفاء بإسهامات النساء والفتيات المسلمات»، ولا تسمّي إسهامات بعينها. كيف يُظهر شهرٌ كهذا مكان جماعة دينية واحدة في هوية كندا، وأي إسهامات سيضيف صفّك؟
    en: Canadian Islamic History Month is October of every year in Canada, first established in 2007 to recognize, celebrate and reflect on the history, culture and contributions of Muslims in Canada. The Government of Canada's page presents it as an opportunity for all Canadians to engage in dialogue, advance understanding and foster inclusion and appreciation of the diversity of Canadian Muslim communities. The page names the month and its yearly themes, such as the 2023 campaign "Celebrating the Contributions of Muslim Women and Girls", but it names no particular contributions. How does a month like this show one religious community's place in Canadian identities, and what contributions would your class add?
    ur: کینیڈین اسلامی تاریخ کا مہینہ کینیڈا میں ہر سال اکتوبر کا مہینہ ہے، جو پہلی بار 2007 میں قائم ہوا تاکہ کینیڈا کے مسلمانوں کی تاریخ، ثقافت اور خدمات کو پہچانا، سراہا اور ان پر غور کیا جائے۔ حکومتِ کینیڈا کا صفحہ اسے تمام کینیڈینوں کے لیے مکالمے، باہمی فہم، شمولیت اور کینیڈین مسلم برادریوں کے تنوع کی قدر کا موقع بتاتا ہے۔ صفحہ مہینے اور اس کی سالانہ مہموں کے عنوانات بتاتا ہے، جیسے 2023 کی مہم «مسلم خواتین اور لڑکیوں کی خدمات کا اعتراف»، مگر کوئی خاص خدمات نام لے کر نہیں بتاتا۔ ایسا مہینہ کینیڈا کی شناختوں میں ایک مذہبی برادری کا مقام کیسے دکھاتا ہے، اور آپ کی جماعت کون سی خدمات شامل کرے گی؟
