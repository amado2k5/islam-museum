- code: D2
  text:
    en: investigate conditions necessary for plant growth, including the soil components most suitable for various species, and various environmentally sustainable methods that can be used to promote growth
    ar: استقصِ الشروط اللازمة لنمو النبات، ومنها مكوّنات التربة الأنسب لمختلف الأنواع، ومختلف الطرائق المستدامة بيئيًا التي تُستعمل لتعزيز النمو
    ur: پودوں کی نشوونما کے لیے ضروری حالات کی چھان بین کریں، بشمول مختلف انواع کے لیے موزوں ترین مٹی کے اجزا، اور نشوونما بڑھانے کے ماحولیاتی طور پر پائیدار مختلف طریقے
- code: D3
  text:
    en: demonstrate an understanding of conditions required for plant growth and of a variety of environmentally sustainable practices that can be used to promote growth
    ar: أظهر فهمًا للشروط المطلوبة لنمو النبات ولمجموعة من الممارسات المستدامة بيئيًا التي تُستعمل لتعزيز النمو
    ur: پودوں کی نشوونما کے لیے درکار حالات اور نشوونما بڑھانے کے ماحولیاتی طور پر پائیدار مختلف طریقوں کی فہم ظاہر کریں
