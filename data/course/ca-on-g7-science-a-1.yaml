  title:
    en: The architect
    ar: المعمار
    ur: معمار
  text:
    en: The architect (mi'mar) designs a building and oversees its construction. The Turkish encyclopaedia TDV, in its entry on the architect, writes that he was expected to know geometry, building technique and the measurement of land. Which school subjects would such a person need?
    ar: المعمار هو من يضع تصميم البناء ويشرف على تنفيذه. وتذكر الموسوعة التركية «TDV» في مدخل المعمار أنه كان يُنتظر منه أن يعرف الهندسة وفن البناء ومساحة الأرض. فأي مواد دراسية يحتاجها شخص كهذا؟
    ur: معمار عمارت کا نقشہ بناتا ہے اور اس کی تعمیر کی نگرانی کرتا ہے۔ ترکی کا انسائیکلوپیڈیا «TDV» معمار کے مدخل میں لکھتا ہے کہ اس سے توقع تھی کہ وہ ہندسہ، تعمیری فن اور زمین کی پیمائش جانتا ہو۔ ایسے شخص کو کون سے تعلیمی مضامین درکار ہوں گے؟
