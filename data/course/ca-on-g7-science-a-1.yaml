  title:
    en: Levelling a tunnel for water
    ar: تسوية نفق للماء
    ur: پانی کی سرنگ کی تسویہ
  text:
    en: Before water reaches a field, workers need a route that neither rises against its flow nor loses its direction underground. In The Extraction of Hidden Waters, Abu Bakr al-Karaji describes levels and surveying procedures within a manual that follows water from exploration to maintenance and handover. This is a particular contribution to an older tradition, not the invention of groundwater or qanats themselves. Whose skills does such a job need?
    ar: قبل أن يصل الماء إلى حقل، يجب أن يجد العامل طريقاً لا يرتفع في وجهه ولا يضل تحت الأرض. يشرح أبو بكر الكرجي في «إنباط المياه الخفية» موازين وطرائق للتسوية وتوجيه الحفر، ضمن كتاب يتابع الماء من البحث عنه إلى صيانة القناة وتسليم العمل. هذه مساهمة محددة في تقليد طويل، لا حكاية اختراع الماء الجوفي أو القناة نفسها. فمن أصحاب المهارات الذين يحتاجهم عمل كهذا؟
    ur: پانی کھیت تک پہنچنے سے پہلے مزدور کو ایسا راستہ چاہیے جو بہاؤ کے مقابل اونچا نہ ہو اور زیرزمین اپنی سمت نہ کھوئے۔ ابو بکر الکرجی «انباط المیاہ الخفیہ» میں تسویہ کے میزان اور کھدائی کی سمت درست رکھنے کے طریقے بیان کرتے ہیں، ایک ایسی کتاب کے اندر جو پانی کی تلاش سے دیکھ بھال اور کام سپرد کرنے تک رہنمائی دیتی ہے۔ یہ پرانی روایت میں ایک خاص خدمت ہے، زیرزمین پانی یا خود قنات کی ایجاد نہیں۔ ایسے کام کے لیے کن کن ہنر مندوں کی ضرورت پڑتی ہے؟
  entity: invention/karaji-qanat-surveying
  sources:
  - source/karaji-ataie-simmons-2020
- position: after
  kind: invention
  title:
    en: Measuring a ceiling of small faces
    ar: قياس سقف من وجوه صغيرة
    ur: چھوٹے رخوں والی چھت کی پیمائش
  text:
    en: How can a ceiling assembled from hundreds of little faces become an arithmetic problem? In the Key to Arithmetic, al-Kashi organized measurement of muqarnas, the tiered cellular construction articulating and decorating ceilings. He selects a module, counts elements by shape, and adds the surfaces of facets, roofs and connecting pieces. This is a calculation method within an older architectural practice, not an attribution of muqarnas itself to one inventor. What would you count first?
    ar: كيف يصير سقف من مئات الوجوه الصغيرة مسألة حساب؟ نظم غياث الدين الكاشي في «مفتاح الحساب» قياس سطح المقرنص، وهو البناء الخلوي المتدرج الذي يربط أجزاء السقف ويزينها. يختار وحدة معيارية، ويعد الأجزاء بحسب أشكالها، ويجمع مساحات الوجوه والسقوف والعناصر الواصلة. هذه طريقة حساب في عمارة موجودة قبله، لا نسبة اختراع المقرنص نفسه إليه. فماذا ستعدّ أولاً؟
    ur: سینکڑوں چھوٹے رخوں سے بنی چھت حساب کا سوال کیسے بنتی ہے؟ غیاث الدین کاشی نے «مفتاح الحساب» میں مقرنس کی سطح کا حساب منظم کیا، یعنی وہ تہہ دار خانوں والی ساخت جو چھت کے حصوں کو جوڑتی اور سجاتی ہے۔ وہ ایک معیاری اکائی چنتے ہیں، شکل کے مطابق اجزا گنتے ہیں اور رخوں، چھتوں اور ملانے والے ٹکڑوں کے رقبے جمع کرتے ہیں۔ یہ پرانی معماری کے اندر حسابی طریقہ ہے، خود مقرنس کو ایک فرد کی ایجاد کہنا نہیں۔ آپ سب سے پہلے کیا گنیں گے؟
  entity: invention/kashi-muqarnas-mensuration
