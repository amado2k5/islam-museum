  title:
    en: The muhtasib
    ar: المحتسب
    ur: محتسب
  text:
    en: 'The muhtasib was the official charged with hisba: enjoining good and forbidding wrong in public life. He watched the markets, weights and measures and prices, and the record lists protecting orphans, slaves and animals among his duties. Most jurists required him to know right from wrong in the matters he oversaw; they also held that arithmetic was needed to check weights and exchange rates. He was paid from the treasury. Which of these tasks has a counterpart today?'
    ar: المحتسب هو الموظف المكلَّف بالحِسبة، أي الأمر بالمعروف والنهي عن المنكر في الشأن العام. يراقب الأسواق والموازين والمكاييل والأسعار، ويذكر السجل من واجباته حماية الأيتام والعبيد والحيوانات. واشترط أكثر الفقهاء أن يكون عالمًا بالمعروف والمنكر في ما يراقبه، ورأوا أن الإلمام بالحساب ضروري لمراقبة الموازين وأسعار الصرف. وكان يتقاضى راتبًا من بيت المال. فأيّ هذه المهام له نظير اليوم؟
    ur: محتسب وہ اہلکار تھا جس کے ذمے حسبہ تھی، یعنی عوامی زندگی میں نیکی کا حکم دینا اور برائی سے روکنا۔ وہ بازاروں، ناپ تول اور قیمتوں کی نگرانی کرتا تھا، اور ریکارڈ اس کے فرائض میں یتیموں، غلاموں اور جانوروں کی حفاظت گنواتا ہے۔ اکثر فقہا کی شرط تھی کہ وہ جن معاملات کی نگرانی کرے ان میں اچھے اور برے کو جانتا ہو؛ ان کی رائے یہ بھی تھی کہ ترازو اور زرِ مبادلہ کے نرخ پرکھنے کے لیے حساب سے واقفیت ضروری ہے۔ اسے بیت المال سے تنخواہ ملتی تھی۔ ان میں سے کس کام کا آج کوئی ہم پلہ ہے؟
