  title:
    en: Where a calligrapher's work was shown
    ar: أين كان عمل الخطّاط يُعرض
    ur: خطاط کا کام کہاں دکھایا جاتا تھا
  text:
    en: The main output of the calligrapher is books, above all the mushaf, but the entry also lists the single-sided sheet, the album of decorated pieces, the scroll kept in a leather case, and the framed panel popular in the nineteenth and twentieth centuries. Architectural inscriptions were written on marble and tile, in mihrabs, on the bands around walls and the drums of domes. Which setting would suit your work?
    ar: أهم ما يكتبه الخطاط الكتب، وعلى رأسها المصحف، لكن السجل يذكر أيضًا القطعة المكتوبة على وجه واحد، والمرقّعات وهي ألبومات تجمع القطع المزخرفة، والتوماريات التي تُلفّ وتُحفظ في غلاف جلدي، واللوحات المؤطّرة التي راجت في القرنين التاسع عشر والعشرين. وكتابات العمارة تُكتب على الرخام والخزف، وعلى المحراب، وتحيط بالجدار وبطبلة القبة. أي موضع يليق بعملك؟
    ur: خطاط کی تحریر کا بڑا حصہ کتابیں ہیں، سب سے بڑھ کر مصحف، مگر اندراج ایک طرف لکھے گئے ورق، آراستہ ٹکڑوں کے البم، چمڑے کے غلاف میں رکھے جانے والے طومار، اور انیسویں اور بیسویں صدی میں مقبول فریم شدہ تختیوں کا بھی ذکر کرتا ہے۔ عمارتوں کی تحریریں سنگِ مرمر اور ٹائل پر، محراب میں، دیواروں کے گرد پٹیوں پر اور گنبد کے طبلے پر لکھی جاتی تھیں۔ آپ کے کام کے لیے کون سی جگہ موزوں ہوگی؟
