  title:
    en: The licence and the right to sign
    ar: الإجازة والحق في التوقيع
    ur: اجازت اور دستخط کا حق
  text:
    en: In the calligrapher's training, the TDV entry says, the licence grants the pupil leave to set his signature beneath his writing. When do you sign your own work, and what do you write beneath it?
    ar: تمنح الإجازة في تدريب الخطاط، كما يذكر مدخل «TDV»، التلميذَ إذنًا بأن يكتب توقيعه تحت خطه. متى توقّع أنت عملك، وماذا تكتب تحته؟
    ur: خطاط کی تربیت میں اجازت، جیسا کہ ٹی ڈی وی کا اندراج کہتا ہے، شاگرد کو اپنی تحریر کے نیچے دستخط کرنے کی اجازت دیتی ہے۔ آپ اپنا کام کب دستخط کرتے ہیں، اور اس کے نیچے کیا لکھتے ہیں؟
