expectations:
- code: A3.1
  text:
    en: explore and experiment with a variety of materials/media, including alternative media, and traditional and/or emerging technologies, tools, and techniques, and apply them to create art works […]
    ar: استكشف مجموعة متنوعة من المواد والوسائط، ومنها الوسائط البديلة، ومن التقنيات والأدوات والأساليب التقليدية و/أو الناشئة، وجرّبها، ووظّفها في إنتاج أعمال فنية […]
    ur: مختلف مواد اور وسائط کو، بشمول متبادل وسائط، اور روایتی اور/یا ابھرتی ہوئی ٹیکنالوجیوں، اوزاروں اور تکنیکوں کو کھوجیں اور ان کے ساتھ تجربہ کریں، اور انہیں فن پارے بنانے میں استعمال کریں […]
- code: A3.2
  text:
    en: demonstrate appropriate ways to prepare their art works for presentation […]
    ar: أظهر الطرق المناسبة لتجهيز أعمالك الفنية للعرض […]
    ur: اپنے فن پاروں کو پیش کش کے لیے تیار کرنے کے مناسب طریقے ظاہر کریں […]
- code: A3.3
  text:
    en: demonstrate an understanding of a variety of ways in which art works can be presented to reach different audiences […]
    ar: أظهر فهمًا لطرق متنوعة يمكن بها عرض الأعمال الفنية للوصول إلى جماهير مختلفة […]
    ur: ان مختلف طریقوں کی تفہیم ظاہر کریں جن سے فن پارے مختلف ناظرین تک پہنچانے کے لیے پیش کیے جا سکتے ہیں […]
connections:
- position: before
  kind: object
  title:
    en: 'Zellij: cut and laid ceramic mosaic'
    ar: 'الزليج: فسيفساء خزفية تُقصّ وتُرصف'
    ur: 'زلیج: کاٹ کر جوڑا جانے والا خزفی موزیک'
  text:
    en: Newcomb divides Moroccan decorative tilework into ceramic mosaic and painted tiles. Some mosaic is made of small squares, hexagons and other regular shapes, its pattern carried by colour; some is true mosaic, the pieces cut and laid like marble or glass tesserae. Zellij is the ceramic mosaic that covers floors and walls in Morocco. Which of your own materials could be cut and laid this way?
    ar: يقسم نيوكومب البلاط الزخرفي المغربي إلى فسيفساء خزفية وبلاط مرسوم. ومن الفسيفساء ما يتألف من مربعات ومسدسات وأشكال منتظمة صغيرة يقوم نمطها على اختلاف الألوان، ومنها فسيفساء حقيقية تُقص قطعها وتُرصف كما ترصف قطع الرخام أو الزجاج. والزليج هو الفسيفساء الخزفية التي تُكسى بها الأرضيات والجدران في المغرب الأقصى. أي موادّك يمكن أن تُقصّ وتُرصف على هذا النحو؟
    ur: نیوکومب مراکش کے آرائشی ٹائل کے کام کو خزفی موزیک اور مصور ٹائلوں میں تقسیم کرتے ہیں۔ کچھ موزیک چھوٹے چوکور، مسدس اور دوسری باقاعدہ شکلوں سے بنتا ہے جس کا نقش رنگوں کے فرق پر قائم ہوتا ہے؛ اور کچھ حقیقی موزیک ہے جس کے ٹکڑے کاٹ کر یوں جوڑے جاتے ہیں جیسے سنگِ مرمر یا شیشے کے ٹکڑے۔ زلیج وہ خزفی موزیک ہے جس سے مراکش میں فرش اور دیواریں ڈھانپی جاتی ہیں۔ آپ کے اپنے مواد میں سے کون سا اس طرح کاٹ کر جوڑا جا سکتا ہے؟
