  title:
    ar: مسألة ابن الهيثم في المرآة الدائرية
    en: Ibn al-Haytham's circular-mirror question
    ur: ابن الہیثم کا دائروی آئینے کا سوال
  text:
    ar: إذا عرفت موضع جسم وموضع عين، فأين ينبغي أن ينعكس الضوء على مرآة دائرية ليصل بينهما؟ مساهمة ابن الهيثم هنا مقدمات هندسية وتطبيقات في المقالة الخامسة من «كتاب المناظر». والمطلوب إنشاء نقطة على المحيط تحقق تساوي زاويتي السقوط والانعكاس بالنسبة إلى العمود المحلي. والطريقة إنشاء رياضي، لا مرآة أصلية نُسبت إلى المؤلف. أين العمود المقام عند نقطة الانعكاس، وأي زاويتين متساويتين؟
    en: Given the position of an object and an eye, where should light reflect on a circular mirror to connect them? Ibn al-Haytham's contribution here is geometrical lemmas and applications in Book V of the Book of Optics. The task is to construct a rim point where the angles of incidence and reflection are equal, measured against the local normal. It is a mathematical construction, not an original mirror attributed to the author. At the reflection point, where is the normal, and which two angles are equal?
    ur: اگر آپ کو کسی شے کا مقام اور آنکھ کا مقام معلوم ہو تو دائروی آئینے پر روشنی کو کہاں منعکس ہونا چاہیے کہ وہ دونوں کو ملا دے؟ ابن الہیثم کی یہاں شراکت «کتاب المناظر» کی پانچویں مقالے میں ہندسی مقدمات اور اطلاقات ہیں۔ مطلوب یہ ہے کہ محیط پر ایک ایسا نقطہ بنایا جائے جہاں زاویۂ سقوط اور زاویۂ انعکاس مقامی عمود کے لحاظ سے برابر ہوں۔ یہ ایک ریاضیاتی تعمیر ہے، مصنف سے منسوب کوئی اصل آئینہ نہیں۔ انعکاس کے نقطے پر عمود کہاں ہوتا ہے، اور کون سے دو زاویے برابر ہوتے ہیں؟
