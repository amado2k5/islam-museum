  kind: story
  title:
    en: Meccan, Medinan, Basran, Kufic
    ar: المكي والمدني والبصري والكوفي
    ur: مکی، مدنی، بصری اور کوفی
  text:
    en: In the Fihrist, Ibn al-Nadim surveys the accounts of the beginning of Arabic writing. He says the first of the Arabic scripts was the Meccan, then the Medinan, then the Basran, then the Kufic, and he notes in the Meccan and Medinan an inclination of the alifs toward the right hand. The record adds that he gives several accounts without preference. How could you tell one style of writing from another?
    ar: في «الفهرست» يستقصي ابن النديم أخبار ابتداء الخط العربي. ويذكر أن أول الخطوط العربية المكي، ثم المدني، ثم البصري، ثم الكوفي، ويلاحظ في المكي والمدني تعويجًا في الألفات إلى يمنة اليد. ويضيف السجل أنه ينقل أقوالًا متعددة دون ترجيح. كيف تميّز أسلوب كتابة من آخر؟
    ur: «الفہرست» میں ابن الندیم خطِ عربی کے آغاز کی روایتیں جمع کرتے ہیں۔ وہ بتاتے ہیں کہ عربی خطوں میں پہلا مکی تھا، پھر مدنی، پھر بصری، پھر کوفی، اور مکی اور مدنی میں الفوں کے دائیں ہاتھ کی طرف جھکاؤ کا ذکر کرتے ہیں۔ ریکارڈ بتاتا ہے کہ وہ کئی روایتیں بغیر ترجیح کے نقل کرتے ہیں۔ آپ ایک طرزِ تحریر کو دوسرے سے کیسے پہچانیں گے؟
  entity: concept/khatt-al-arabi
  sources:
  - source/fihrist-ibn-al-nadim
- position: after
  kind: object
  title:
    en: Beautiful writing
    ar: كتابة جميلة
    ur: خوبصورت تحریر
  text:
    en: "Islamic calligraphy is the art of writing and shaping the Arabic letter beautifully. Its scripts include Kufic, Naskh, Thuluth and Diwani. What does the style of a piece of writing tell you beyond the words it spells?"
    ar: "الخط الإسلامي فن كتابة الحرف العربي وتشكيله جمالياً. ومن خطوطه الكوفي والنسخ والثلث والديواني. ماذا يخبرك أسلوب قطعة مكتوبة سوى الكلمات التي تهجّيها؟"
    ur: "اسلامی خطاطی عربی حرف کو خوبصورتی سے لکھنے اور ڈھالنے کا فن ہے۔ اس کے خطوں میں کوفی، نسخ، ثلث اور دیوانی شامل ہیں۔ تحریر کا اسلوب آپ کو ان الفاظ کے علاوہ، جو وہ لکھتی ہے، اور کیا بتاتا ہے؟"
