expectations:
- code: F1
  text:
    en: analyse technological developments that have increased our knowledge of geological processes and structures, and how this knowledge assists in monitoring and managing these processes and structures
    ar: حلّل التطورات التقنية التي زادت معرفتنا بالعمليات والبنى الجيولوجية، وكيف تعين هذه المعرفة على رصد هذه العمليات والبنى وإدارتها
    ur: ان ٹیکنالوجیائی پیش رفتوں کا تجزیہ کریں جنہوں نے ارضیاتی عمل اور ساختوں کے بارے میں ہمارا علم بڑھایا، اور یہ علم ان عمل اور ساختوں کی نگرانی اور انتظام میں کیسے مدد دیتا ہے
- code: F2
  text:
    en: investigate, through the use of models and analysis of information gathered from various sources, the nature of internal and surficial Earth processes, and the ways in which these processes can be quantified
    ar: ابحث، باستخدام النماذج وتحليل المعلومات المجموعة من مصادر شتى، طبيعة العمليات الداخلية والسطحية للأرض والسبل التي يمكن بها قياس هذه العمليات كمّيًا
    ur: ماڈلوں اور مختلف ذرائع سے جمع شدہ معلومات کے تجزیے کے ذریعے زمین کے اندرونی اور سطحی عمل کی نوعیت اور ان عمل کو مقداری طور پر ناپنے کے طریقوں کی تحقیق کریں
- code: F3
  text:
    en: demonstrate an understanding of the processes at work within Earth and on its surface, and the role of these processes in shaping Earth’s surface
    ar: أظهر فهمًا للعمليات الجارية داخل الأرض وعلى سطحها ودورها في تشكيل سطح الأرض
    ur: زمین کے اندر اور اس کی سطح پر جاری عمل اور زمین کی سطح کو شکل دینے میں ان کے کردار کی فہم کا مظاہرہ کریں
