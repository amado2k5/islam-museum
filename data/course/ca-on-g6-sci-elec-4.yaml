expectations:
- code: C1.1
  text:
    en: assess the short- and long-term impacts of electrical energy generation technologies in Canada on society and the environment, including impacts on First Nations, Métis, and Inuit communities, and on climate change
    ar: قيِّم الآثار قصيرة الأمد وطويلة الأمد لتقنيات توليد الطاقة الكهربائية في كندا في المجتمع والبيئة، ومنها آثارها في مجتمعات الأمم الأولى والميتيس والإينويت، وفي تغيّر المناخ
    ur: کینیڈا میں برقی توانائی پیدا کرنے والی ٹیکنالوجیز کے معاشرے اور ماحول پر قلیل مدتی اور طویل مدتی اثرات کا جائزہ لیں، بشمول فرسٹ نیشنز، میتس اور انوئٹ برادریوں پر اور موسمیاتی تبدیلی پر اثرات
- code: C1.2
  text:
    en: assess choices that reduce personal use of electrical energy from both renewable and non-renewable sources, and advocate for the responsible use of electrical energy by the school community
    ar: قيِّم الخيارات التي تقلل الاستعمال الشخصي للطاقة الكهربائية المولَّدة من مصادر متجددة وغير متجددة، وادعُ إلى الاستعمال المسؤول للطاقة الكهربائية في المجتمع المدرسي
    ur: ان انتخابات کا جائزہ لیں جو قابلِ تجدید اور غیر قابلِ تجدید دونوں ذرائع سے حاصل ہونے والی برقی توانائی کے ذاتی استعمال کو کم کریں، اور اسکول برادری میں برقی توانائی کے ذمہ دارانہ استعمال کی وکالت کریں
