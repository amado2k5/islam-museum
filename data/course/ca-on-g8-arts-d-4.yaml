  title:
    en: Carpets in European pictures
    ar: سجاد في لوحات أوروبية
    ur: یورپی تصویروں میں قالین
  text:
    en: The record describes the appearance of Islamic carpets in European paintings from the fourteenth century onwards. They document the movement of carpets between East and West, and some patterns are named after the painters. What can a carpet painted in a European picture tell you about how objects and patterns travel between places?
    ar: يصف السجل ظهور السجاد الإسلامي في لوحات أوروبية من القرن الرابع عشر فصاعدًا. وهي وثيقة على حركة السجاد بين الشرق والغرب، وقد سُمّيت بعض الأنماط بأسماء الرسامين. ماذا تخبرك سجادة مرسومة في لوحة أوروبية عن كيفية انتقال الأشياء والأنماط بين الأماكن؟
    ur: ریکارڈ چودھویں صدی کے بعد سے یورپی مصوری میں اسلامی قالینوں کے ظاہر ہونے کو بیان کرتا ہے۔ یہ قالینوں کی مشرق و مغرب کے درمیان نقل و حرکت کی دستاویز ہیں، اور کچھ نمونوں کے نام مصوروں کے نام پر رکھے گئے ہیں۔ یورپی تصویر میں بنایا گیا قالین آپ کو یہ کیا بتاتا ہے کہ اشیا اور نقوش ایک جگہ سے دوسری جگہ کیسے سفر کرتے ہیں؟
