  title:
    en: Borrowing a plan, adding a place
    ar: اقتراض مخطط وإضافة مكان
    ur: نقشہ مستعار لینا اور اس میں مقام کو شامل کرنا
  text:
    en: Syed Ali Nadeem Rezavi argues in a 2002 chapter that Indo-Muslim architecture borrowed heavily from Iranian, Transoxanian and regional Indian traditions, and much more heavily after the Mughal dynasty was founded. He notes that the Quwwat al-Islam mosque (c. 1197) followed the Seljuq four-iwan plan with modifications. He concludes that the beauty of Mughal architecture came from synthesising these borrowings with indigenous elements; this is his view. What does a builder keep, and what does a builder change, when borrowing a plan?
    ar: يرى سيد علي نديم رضوي في فصل نشره سنة 2002م أن العمارة الهندية الإسلامية اقترضت كثيرًا من التقاليد الإيرانية والما وراء نهرية والهندية الإقليمية، وأن الاقتراض اشتد كثيرًا بعد قيام الدولة المغولية. ويذكر أن جامع قوة الإسلام ⁦(نحو 1197م)⁩ اتبع مخطط الجامع السلجوقي ذي الإيوانات الأربعة مع تعديلات. ويخلص إلى أن جمال العمارة المغولية جاء من دمج هذا الاقتراض بذكاء مع العناصر المحلية؛ وهذا رأيه. ماذا يُبقي البنّاء وماذا يغيّر حين يقترض مخططًا؟
    ur: سید علی ندیم رضوی 2002ء کے ایک باب میں کہتے ہیں کہ ہندوستانی اسلامی طرزِ تعمیر نے ایرانی، ماوراء النہری اور علاقائی ہندوستانی روایات سے بہت کچھ مستعار لیا، اور مغل سلطنت کے قیام کے بعد یہ مستعار لینا کہیں زیادہ بڑھ گیا۔ وہ بتاتے ہیں کہ قوت الاسلام مسجد ⁦(تقریباً 1197ء)⁩ نے سلجوقی چار ایوانی مسجد کے نقشے کی کچھ تبدیلیوں کے ساتھ پیروی کی۔ وہ نتیجہ نکالتے ہیں کہ مغل طرزِ تعمیر کا حسن اس مستعار لینے کو مقامی عناصر کے ساتھ ذہانت سے ملانے سے آیا؛ یہ ان کی رائے ہے۔ نقشہ مستعار لیتے وقت معمار کیا رکھتا ہے اور کیا بدلتا ہے؟
