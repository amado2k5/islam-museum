  title:
    en: Sensing light, interpreting size
    ar: الإحساس بالضوء وتأويل الحجم
    ur: روشنی کا احساس، جسامت کی تعبیر
  text:
    en: "Smith, the modern editor and historian of the Book of Optics, writes that Ibn al-Haytham separates sensing light and colour from inferring size and distance. In Smith's account, a tall man's representation in the perceptual apparatus is not itself as tall as the man, because interpretation, discrimination and memory intervene. Smith adds that he is analysing historical conceptual language, not attributing modern neuroscience to the author. Do we perceive the world as it really is?"
    ar: "يكتب سميث، المحقق الحديث ومؤرخ «المناظر»، أن ابن الهيثم يفصل بين الإحساس بالضوء واللون واستنتاج الحجم والبعد. وفي عرضه لا يكون تمثيل الرجل الطويل في جهاز الإدراك طويلًا بطوله، لأن التأويل والتمييز والذاكرة تتدخل. ويضيف سميث أنه يحلل لغة مفاهيمية تاريخية، ولا ينسب علم أعصاب حديثًا إلى المؤلف. هل ندرك العالم كما هو فعلًا؟"
    ur: "سمتھ، جو «المناظر» کے جدید مدون اور مؤرخ ہیں، لکھتے ہیں کہ ابن الہیثم روشنی اور رنگ کے احساس کو جسامت اور فاصلے کے استنباط سے الگ کرتے ہیں۔ ان کے بیان میں لمبے آدمی کی ادراکی نظام میں نمائندگی خود اتنی لمبی نہیں ہوتی جتنا وہ آدمی، کیونکہ تعبیر، تمیز اور یاد درمیان میں آتی ہیں۔ سمتھ مزید کہتے ہیں کہ وہ تاریخی تصوراتی زبان کا تجزیہ کر رہے ہیں، مصنف کی طرف جدید اعصابی سائنس منسوب نہیں کر رہے۔ کیا ہم دنیا کو واقعی ویسا ہی ادراک کرتے ہیں جیسی وہ ہے؟"
