  title:
    en: Making paper in Baghdad
    ar: صناعة الورق في بغداد
    ur: 'بغداد میں کاغذ سازی'
  text:
    en: 'Paper is a mat of fibres broken down in water, gathered on a screen and dried. The record says its origin is Chinese, so Baghdad''s story is moving a craft rather than inventing it. How might a new writing material change work?'
    ar: 'الورق شبكة من ألياف السليلوز: تُفكك مادتها في الماء، ثم تجمع على سطح شبكي وتُجفف. ويقول السجل إن أصله صيني، فحكاية بغداد نقل لحرفة لا اختراع لها. كيف قد تغيّر مادة جديدة للكتابة طريقة العمل؟'
    ur: 'کاغذ سیلولوز کے ریشوں کی تہ ہے: مواد کو پانی میں توڑ کر ریشے الگ کیے جاتے، جالی پر جمع ہوتے اور خشک ہو کر لکھنے کا ورق بنتے ہیں۔ ریکارڈ کے مطابق اس کی اصل چینی ہے، اس لیے بغداد کی کہانی ایک ہنر کے منتقل ہونے کی ہے، ایجاد ہونے کی نہیں۔ لکھنے کا نیا مواد کام کا طریقہ کیسے بدل سکتا ہے؟'
  entity: invention/baghdad-papermaking
  sources:
  - source/tdv-kagit
  - source/iranica-paper-i
- position: after
  kind: place
  title:
    en: A library in Baghdad
    ar: مكتبة في بغداد
    ur: 'بغداد میں ایک کتب خانہ'
  text:
    en: 'Ahmad Amin, in Duha al-Islam, calls the House of Wisdom the greatest library whose report survives from the early Abbasid period. Duha al-Islam states that its system and exact location remain shrouded in uncertainty. The record says al-Rashid laid its foundation and al-Mamun developed and strengthened it, and that al-Rashid appointed Yuhanna ibn Masawayh to translate the old medical books found in the lands of Rum. Why would a ruler gather and translate books?'
    ar: 'يعدّ أحمد أمين في «ضحى الإسلام» بيت الحكمة أكبر مكتبة نُقل خبرها من العصر العباسي الأول. ويذكر أحمد أمين أن نظامها وموضعها على وجه التعيين بقيا محفوفين بالغموض. ويذكر السجل أن الرشيد وضع نواتها وأن المأمون نمّاها وقوّاها، وأن الرشيد ولّى يوحنا بن ماسويه ترجمة الكتب الطبية القديمة التي وُجدت في بلاد الروم. لماذا يجمع حاكم الكتب ويأمر بترجمتها؟'
    ur: 'احمد امین «ضحی الاسلام» میں بیت الحکمہ کو عباسی دور کے ابتدائی زمانے سے منقول سب سے بڑا کتب خانہ قرار دیتے ہیں۔ احمد امین لکھتے ہیں کہ اس کا نظام اور ٹھیک مقام غموض میں لپٹے رہے۔ ریکارڈ کہتا ہے کہ ہارون الرشید نے اس کی بنیاد رکھی اور مامون نے اسے بڑھایا اور مضبوط کیا، اور الرشید نے یوحنا بن ماسویہ کو روم کے علاقوں میں ملنے والی قدیم طبی کتابوں کے ترجمے پر مقرر کیا۔ حکمران کتابیں کیوں جمع کرتا اور ان کے ترجمے کا حکم کیوں دیتا ہے؟'
