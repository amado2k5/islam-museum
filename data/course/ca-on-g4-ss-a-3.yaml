  title:
    en: Measuring the Nile flood
    ar: قياس فيضان النيل
    ur: 'نیل کے سیلاب کی پیمائش'
  text:
    en: 'On Rawda Island in Cairo stands a stone-lined pit, built in 862 to gauge the Nile during the annual flood. Yeomans, as the record reports, says its readings were essential in setting irrigation policy. The column is divided into nineteen cubits, and the sixteenth-cubit mark stands for the ideal flood level. Why would a government need to know how high the river would rise?'
    ar: 'في جزيرة الروضة بالقاهرة بئر مبطنة بالحجر، بُنيت سنة 862م لقياس ارتفاع ماء النيل أيام الفيضان السنوي. ويذكر السجل عن يومانز أن قراءاتها كانت أساسًا في تقدير سياسة الري. والعمود مقسوم تسع عشرة ذراعًا، وعلامة الذراع السادسة عشرة هي منسوب الفيضان المثالي. لماذا تحتاج حكومة إلى معرفة ارتفاع النهر القادم؟'
    ur: 'قاہرہ کے جزیرۂ روضہ میں پتھر سے چنا ہوا ایک کنواں ہے جو 862ء میں سالانہ طغیانی کے دنوں میں نیل کے پانی کی بلندی ناپنے کے لیے بنایا گیا۔ ریکارڈ کے مطابق یومنز کہتے ہیں کہ اس کی پیمائشیں آبپاشی کی پالیسی طے کرنے میں بنیادی تھیں۔ ستون انیس ذراع میں تقسیم ہے، اور سولہویں ذراع کا نشان طغیانی کی مثالی سطح ہے۔ حکومت کو یہ جاننے کی ضرورت کیوں ہو کہ دریا کتنا چڑھے گا؟'
  entity: building/nilometer-of-rawda
