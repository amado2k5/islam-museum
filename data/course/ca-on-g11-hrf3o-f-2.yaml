  title:
    en: The House at Mecca
    ar: البيت بمكة
    ur: مکہ کا گھر
  text:
    en: Al-Mubarakpuri writes in The Sealed Nectar that the Kaaba is the House that Abraham and his son Ismail built at Mecca. He says that before the building its site was a rise in the ground like a hillock, and that five years before the mission a flood left the Kaaba close to collapse, so Quraysh rebuilt it. How might a conviction that a place was built by a prophet shape what believers do toward it?
    ar: يذكر المباركفوري في «الرحيق المختوم» أن الكعبة هي البيت الذي بناه إبراهيم وابنه إسماعيل بمكة. ويقول إن موضعه قبل البناء كان رابيةً من الأرض كالتلّ، وإنه قبل البعثة بخمس سنين جرف السيل مكة وترك الكعبة على وشك الانهيار، فأعادت قريش بناءها. كيف يمكن أن يصوغ الاعتقاد بأن نبيًّا بنى مكانًا ما يفعله المؤمنون تجاهه؟
    ur: مبارکپوری «الرحیق المختوم» میں لکھتے ہیں کہ کعبہ وہ گھر ہے جسے ابراہیم اور ان کے بیٹے اسماعیل نے مکہ میں بنایا۔ وہ کہتے ہیں کہ تعمیر سے پہلے اس کی جگہ زمین کا ایک ٹیلے جیسا ابھار تھی، اور بعثت سے پانچ سال پہلے سیلاب نے مکہ کو بہا لیا اور کعبہ گرنے کے قریب ہو گیا، تو قریش نے اسے دوبارہ تعمیر کیا۔ یہ یقین کہ کسی جگہ کو ایک نبی نے بنایا ہے، ماننے والوں کے اس کی طرف عمل کو کیسے ڈھال سکتا ہے؟
