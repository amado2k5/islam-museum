  title:
    en: A journey with set rites
    ar: رحلة لها مناسك مقررة
    ur: مقررہ مناسک والا سفر
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence says that in legal usage hajj is heading for a specific place, the Sacred House and Arafa, at a specific time, to perform specific acts. It describes it as an individual duty, once in a lifetime, on every legally responsible person who is able, and one of the pillars of Islam. It also distinguishes umra, heading for the Sacred House for tawaf and sa'y. How does a journey with set rites differ from other journeys?
    ar: تذكر الموسوعة الفقهية الكويتية أن الحج في الاصطلاح الشرعي قصد مكان مخصوص، هو البيت الحرام وعرفة، في زمن مخصوص، لأداء أعمال مخصوصة. وتصفه بأنه فرض عين مرة في العمر على كل مكلف مستطيع، وأحد أركان الإسلام. وتفرّق بينه وبين العمرة، وهي قصد البيت الحرام للطواف والسعي. بمَ تختلف رحلة لها مناسك مقررة عن غيرها من الرحلات؟
    ur: کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ شرعی اصطلاح میں حج ایک مخصوص مقام، یعنی بیت الحرام اور عرفہ، کی طرف ایک مخصوص وقت میں مخصوص اعمال ادا کرنے کے لیے جانا ہے۔ وہ اسے ہر اس مکلف پر جو استطاعت رکھتا ہو عمر میں ایک بار فرضِ عین اور اسلام کے ارکان میں سے ایک بتاتا ہے۔ وہ عمرہ کو بھی الگ کرتا ہے، جو طواف اور سعی کے لیے بیت الحرام کی طرف جانا ہے۔ مقررہ مناسک والا سفر دوسرے سفروں سے کیسے مختلف ہے؟
