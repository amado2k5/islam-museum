  title:
    en: The first mosque in Medina
    ar: المسجد الأول في المدينة
    ur: مدینہ کی پہلی مسجد
  text:
    en: Al-Samhudi writes in Wafa' al-wafa that the Companions built the Prophet's Mosque of mud brick on a stone foundation about three cubits high. He says its qibla was at first toward Jerusalem; when the qibla was changed, the back door was closed and a door opened opposite it. It was not roofed at first, and was later shaded with palm trunks and fronds. What features of a place of worship can you see in this account?
    ar: يذكر السمهودي في «وفاء الوفا» أن الصحابة بنوا المسجد النبوي باللبن على أساس من الحجارة بارتفاع نحو ثلاثة أذرع. ويقول إن قبلته كانت أولًا إلى بيت المقدس؛ فلما حُوّلت القبلة سُدّ الباب الخلفي وفُتح باب في مقابله. ولم يكن مسقوفًا أول الأمر، ثم ظُلّل بجذوع النخل وجريده. أيّ سمات دار العبادة تراها في هذه الرواية؟
    ur: سمہودی «وفاء الوفا» میں لکھتے ہیں کہ صحابہ نے مسجدِ نبوی کچی اینٹوں سے تین ہاتھ کے قریب اونچی پتھر کی بنیاد پر بنائی۔ وہ کہتے ہیں کہ اس کا قبلہ پہلے بیت المقدس کی طرف تھا؛ جب قبلہ بدلا گیا تو پچھلا دروازہ بند کر دیا گیا اور اس کے سامنے ایک دروازہ کھولا گیا۔ پہلے اس پر چھت نہ تھی، بعد میں کھجور کے تنوں اور ٹہنیوں سے سایہ کیا گیا۔ اس بیان میں عبادت گاہ کی کون سی خصوصیات آپ دیکھتے ہیں؟
  entity: building/prophets-mosque
