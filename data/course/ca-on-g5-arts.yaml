summary:
  en: 'The Ontario Grade 5 Arts course has four strands: Dance, Drama, Music and Visual Arts. The museum maps two of them with five lessons; Dance and Drama have no honest link.'
  ar: 'لمقرر الفنون للصف الخامس في منهاج أونتاريو أربعة محاور: الرقص والدراما والموسيقى والفنون البصرية. ويربط المتحف اثنين منها بخمسة دروس؛ ولا صلة صادقة له بمحوري الرقص والدراما.'
  ur: 'اونٹاریو نصاب کے پانچویں جماعت کے فنون کورس کے چار محور ہیں: رقص، ڈراما، موسیقی اور بصری فنون۔ عجائب گھر ان میں سے دو کو پانچ اسباق سے جوڑتا ہے؛ رقص اور ڈراما سے اس کا کوئی صادق ربط نہیں۔'
  es: "El curso de Artes de quinto grado de Ontario tiene cuatro áreas temáticas: Danza, Teatro, Música y Artes Visuales. El museo relaciona dos de ellas con cinco lecciones; Danza y Teatro no tienen una conexión clara."
  fr: "Le programme d'arts de 5e année en Ontario comprend quatre volets: danse, théâtre, musique et arts visuels. Le musée en associe deux à travers cinq leçons; la danse et le théâtre n'ont aucun lien direct."
  tr: "Ontario'daki 5. Sınıf Sanat müfredatı dört temel alandan oluşmaktadır: dans, drama, müzik ve görsel sanatlar. Müze, bu alanlardan ikisini beş dersle ilişkilendiriyor; dans ve drama temel alanlarıyla gerçek bir bağlantısı yok."
  id: "Kurikulum Seni Kelas 5 di Ontario memiliki empat bidang inti: tari, drama, musik, dan seni visual. Museum ini menghubungkan dua bidang inti tersebut dengan lima pelajaran; museum ini tidak memiliki hubungan yang nyata dengan bidang inti tari dan drama."
