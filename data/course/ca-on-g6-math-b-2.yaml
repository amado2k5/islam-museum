  title:
    en: A debt in the middle of a multiplication
    ar: دين في وسط عملية ضرب
    ur: ضرب کے بیچ میں ایک دَین
  text:
    ar: في كتاب الحساب الذي يحتاج إليه الكتّاب والعمّال يشرح أبو الوفاء البوزجاني ضرب عددين بطريقة تستعمل متمميهما إلى العشرة التالية. في مثال المؤرخ، ثلاثة في خمسة، يظهر من طرح خمسة من ثلاثة دين مقداره اثنان. تقول البطاقة إن هذا شاهد على قبول وسيط سالب في حساب عملي، لا أول عدد سالب في العالم. وتظهر هنا كمية دون الصفر، هي دين مقداره اثنان، خطوةً وسيطة. أين يقع الدين على خط الأعداد؟
    en: In the arithmetic needed by scribes and officials, Abu al-Wafa al-Buzjani explains multiplication through complements to the next ten. In the historian's example, three times five, subtracting five from three yields a debt of two. The record says this is evidence that a negative middle step was accepted in practical arithmetic, not the world's first negative number. Here a quantity below zero, a debt of two, appears as a middle step. Where does a debt sit on a number line?
    ur: 'کاتبوں اور عاملوں کی ضرورت کے علم حساب میں ابو الوفا البوزجانی دو اعداد کو اگلی دہائی تک پہنچانے والے تکملوں سے ضرب بتاتے ہیں۔ مؤرخ کی مثال تین ضرب پانچ ہے: تین میں سے پانچ گھٹانا دو کا دَین دیتا ہے۔ اندراج کے مطابق یہ عملی حساب میں منفی وسطی حاصل کی قبولیت کی شہادت ہے، دنیا کا پہلا منفی عدد نہیں۔ یہاں صفر سے نیچے کی ایک مقدار، دو کا دَین، درمیانے مرحلے کے طور پر آتی ہے۔ عددی خط پر دَین کہاں آتا ہے؟'
