  title:
    en: The four schools
    ar: المذاهب الأربعة
    ur: چار مکاتبِ فکر
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence explains that in juristic usage a madhhab is the method of ijtihad and legal inference traced to an imam and his school, and that the jurists speak of the four madhhabs: Hanafi, Maliki, Shafi''i and Hanbali. What might differ between schools of one community, and what might they still share?'
    ar: 'تشرح الموسوعة الفقهية الكويتية أن المذهب في الاستعمال الفقهي هو طريقة الاجتهاد والاستنباط المنسوبة إلى إمام ومدرسته، وأن الفقهاء يتحدثون عن المذاهب الأربعة: الحنفي والمالكي والشافعي والحنبلي. ما الذي قد يختلف بين مذاهب الجماعة الواحدة، وما الذي قد يبقى مشتركًا بينها؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ فقہی اصطلاح میں مذہب اس اجتہاد اور استنباط کا طریقہ ہے جو کسی امام اور اس کے مکتب سے منسوب ہو، اور فقہا چار مذاہب کا ذکر کرتے ہیں: حنفی، مالکی، شافعی اور حنبلی۔ ایک ہی جماعت کے مکاتبِ فکر کے درمیان کیا مختلف ہو سکتا ہے، اور ان میں پھر بھی کیا مشترک رہ سکتا ہے؟'
  entity: concept/madhhab
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: within
  kind: career
  title:
    en: The one who leads the prayer
    ar: من يؤمّ المصلين
    ur: نماز پڑھانے والا
  text:
    en: Wikidata defines the imam as the person who leads worshippers in congregational prayer. It adds that among the Shia, imamate means religious and political leadership of the community. How can one word name more than one role, and what does that tell a student about differences within a faith?
    ar: يعرّف ويكيداتا الإمام بأنه من يقود المصلين في صلاة الجماعة، ويضيف أن الإمامة عند الشيعة تعني القيادة الدينية والسياسية للجماعة. كيف تدل كلمة واحدة على أكثر من دور، وماذا يخبر ذلك الطالب عن الاختلافات داخل الدين؟
    ur: ویکی ڈیٹا امام کی تعریف یوں کرتا ہے کہ وہ شخص جو باجماعت نماز میں نمازیوں کی قیادت کرتا ہے۔ وہ مزید کہتا ہے کہ شیعہ کے ہاں امامت کا مطلب جماعت کی دینی اور سیاسی قیادت ہے۔ ایک لفظ ایک سے زیادہ کرداروں کا نام کیسے بن سکتا ہے، اور یہ طالب علم کو ایک دین کے اندر کے اختلافات کے بارے میں کیا بتاتا ہے؟
  entity: concept/imam-masjid
