    ur: ویکی ڈیٹا مؤذن کی تعریف یوں کرتا ہے کہ وہ شخص جو مسجد سے نماز کے لیے پکارتا ہے۔ ان دونوں اندراجات کے مطابق مؤذن کا کردار امام کے کردار سے کیسے مختلف ہے؟
