  title:
    en: The grave and what follows
    ar: القبر وما بعده
    ur: قبر اور اس کے بعد
  text:
    en: Al-Tahawi's creed affirms the grave's punishment for whoever deserves it and the questioning of Munkar and Nakir in the grave about the Lord, the religion and the Prophet. He says the grave is a garden of Paradise's gardens, or a pit of the Fire's pits. What does this say about how the creed pictures the journey of life?
    ar: يثبت الطحاوي في عقيدته عذاب القبر لمن يستحقه، وسؤال منكر ونكير في القبر عن الرب والدين والنبي، ويقول إن القبر روضة من رياض الجنة أو حفرة من حفر النار. ماذا يقول هذا عن تصوّر العقيدة لرحلة الحياة؟
    ur: امام طحاوی اپنے عقیدے میں قبر کے عذاب کو اس کے مستحق کے لیے مانتے ہیں اور قبر میں منکر نکیر کے اس سوال کو بھی جو رب، دین اور نبی کے بارے میں ہوتا ہے، اور کہتے ہیں کہ قبر جنت کے باغوں میں سے ایک باغ ہے یا جہنم کے گڑھوں میں سے ایک گڑھا۔ یہ عقیدہ زندگی کے سفر کو کیسے دیکھتا ہے؟
  entity: concept/akhira
  sources:
  - source/aqida-tahawiyya
- position: within
  kind: reflection
  title:
    en: Prayer for the one who has died
    ar: الصلاة على الميت
    ur: میت کے لیے نماز
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence describes the funeral prayer as prayer over the dead, made standing, without bowing or prostration, with takbirs and supplication for the deceased. Among the transmitted words of that supplication it gives: "O God, forgive him, have mercy on him, keep him well and pardon him". What does a prayer made on behalf of the one who has died tell us about how the community sees that person''s journey?'
    ar: 'تصف الموسوعة الفقهية الكويتية صلاة الجنازة بأنها صلاة على الميت تُؤدّى قيامًا بلا ركوع ولا سجود، فيها تكبيرات ودعاء للميت. وتذكر من ألفاظ هذا الدعاء المأثورة: «اللهم اغفر له وارحمه وعافه واعفُ عنه». ماذا يخبرنا الدعاء للميت عن نظرة الجماعة إلى رحلته؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا نمازِ جنازہ کو میت پر کھڑے ہو کر پڑھی جانے والی نماز بتاتا ہے، بغیر رکوع و سجدے کے، جس میں تکبیریں اور میت کے لیے دعا ہوتی ہے۔ وہ اس دعا کے منقول الفاظ میں یہ دیتا ہے: «اے اللہ! اسے بخش دے، اس پر رحم فرما، اسے عافیت دے اور اسے معاف کر دے»۔ میت کی طرف سے کی جانے والی دعا ہمیں جماعت کے اس کے سفر کو دیکھنے کے بارے میں کیا بتاتی ہے؟'
