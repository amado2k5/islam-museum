summary:
  en: 'The Ontario Grade 11 course SVN3M: six strands, from investigation skills to energy conservation. The museum maps a small part of five of them, through its records on agriculture and waste, and on a few scientists and campaigners.'
  ar: 'مقرر SVN3M للصف الحادي عشر في أونتاريو: ستة محاور، من مهارات التقصي إلى حفظ الطاقة. ويربط المتحف جزءًا صغيرًا من خمسة منها، عبر سجلاته في الزراعة والنفايات وعن بعض العلماء والناشطين.'
  ur: 'اونٹاریو کا کورس SVN3M برائے جماعت یازدہم: چھ شاخیں، تحقیقی مہارتوں سے توانائی کی بچت تک۔ عجائب گھر ان میں سے پانچ کا ایک چھوٹا حصہ جوڑتا ہے، زراعت اور فضلے کے اپنے اندراجات اور چند سائنس دانوں اور مہم چلانے والوں کے ذریعے۔'
  es: "El curso SVN3M de 11.º grado de Ontario se compone de seis ejes temáticos, desde habilidades de investigación hasta conservación de energía. El museo abarca una pequeña parte de cinco de ellos, a través de sus registros sobre agricultura y residuos, así como sobre algunos científicos y activistas."
  fr: "Le cours SVN3M de 11e année en Ontario comprend six volets, allant des compétences d'investigation à la conservation de l'énergie. Le musée en présente une petite partie à travers ses archives sur l'agriculture et les déchets, ainsi que sur quelques scientifiques et militants."
  tr: "Ontario'daki on birinci sınıf için SVN3M müfredatı, araştırma becerilerinden enerji tasarrufuna kadar altı temadan oluşmaktadır. Müze, tarım ve atıklarla ilgili kayıtları ve bu alanda yer alan bazı bilim insanları ve aktivistler aracılığıyla bu temaların beşinin küçük bir bölümünü birbirine bağlamaktadır."
  id: "Kurikulum SVN3M untuk kelas sebelas di Ontario memiliki enam tema, mulai dari keterampilan penyelidikan hingga konservasi energi. Museum ini menghubungkan sebagian kecil dari lima tema tersebut, melalui catatan-catatannya tentang pertanian dan limbah, serta melalui beberapa ilmuwan dan aktivis yang terlibat."
