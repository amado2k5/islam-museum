  title:
    en: The pores in the wall of the heart
    ar: المسامّ في حاجز القلب
    ur: دل کی دیوار کے مسامات
  text:
    en: In the system taught by Galen and his school, which held sway in medicine for about a thousand years before Ibn al-Nafis, blood formed in the liver and reached the right ventricle, and part of it crossed to the left ventricle through invisible pores in the septum. The pores puzzled anatomists for more than a thousand years. Why would a scheme need passages that no one could see?
    ar: في النظام الذي علّمه جالينوس ومدرسته، وظلّ سائداً في الطب نحو ألف سنة قبل ابن النفيس، كان الدم يتكوّن في الكبد ويصل إلى البطين الأيمن، ويعبر قسم منه إلى البطين الأيسر من مسامّ غير مرئية في الحاجز. وكانت هذه المسامّ لغزاً حيّر المشرّحين أكثر من ألف سنة. فلماذا احتاج ذلك النظام إلى منافذ لا يراها أحد؟
    ur: گیلن اور ان کے مکتب کی تعلیم کے مطابق، جو ابن نفیس سے تقریباً ایک ہزار سال پہلے تک طب پر چھایا رہا، خون جگر میں بنتا اور دائیں بطین تک پہنچتا تھا، اور اس کا ایک حصہ حاجز کے نظر نہ آنے والے مسامات سے بائیں بطین میں جاتا تھا۔ یہ مسامات ایک ہزار سال سے زیادہ ماہرینِ تشریح کے لیے معمّا بنے رہے۔ ایسے نظام کو ان راستوں کی ضرورت کیوں پڑی جنہیں کوئی دیکھ نہ سکا؟
  entity: invention/pulmonary-circulation
