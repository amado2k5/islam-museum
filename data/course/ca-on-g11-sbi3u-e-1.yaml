- position: within
  kind: invention
  title:
    en: Blood passes through the lungs
    ar: الدم يمرّ عبر الرئتين
    ur: خون پھیپھڑوں سے گزرتا ہے
  text:
    en: 'In the thirteenth century the physician Ibn al-Nafis wrote, in his commentary on the anatomy of Ibn Sina''s Canon, that blood does not cross from the right ventricle to the left through pores in the wall between them, because that wall is solid; it reaches the left ventricle from the lung. The record adds that small passages join the pulmonary artery and the pulmonary vein. Trace this route on a diagram of the heart: which vessels does it name?'
    ar: 'في القرن السابع الهجري كتب الطبيب ابن النفيس، في شرحه على تشريح قانون ابن سينا، أن الدم لا يعبر من البطين الأيمن إلى البطين الأيسر من مسامّ في الحاجز بينهما كما قال جالينوس، لأن الحاجز هناك مصمت؛ بل يدخل البطين الأيسر من الرئة. ويذكر السجل أن بين الشريان الرئوي والوريد الرئوي منافذ صغيرة تصل بينهما. تتبّع هذا الطريق على رسم للقلب: أي الأوعية يسمّي؟'
    ur: 'ساتویں صدی ہجری میں طبیب ابن نفیس نے ابن سینا کے قانون کی تشریح پر اپنی شرح میں لکھا کہ خون دائیں بطین سے بائیں بطین میں ان کے درمیان کی دیوار کے مساموں سے نہیں گزرتا، جیسا کہ جالینوس نے کہا تھا، کیونکہ وہ دیوار ٹھوس ہے؛ بلکہ وہ پھیپھڑے سے بائیں بطین میں داخل ہوتا ہے۔ اندراج بتاتا ہے کہ پھیپھڑوں کی شریان اور پھیپھڑوں کی ورید کے درمیان چھوٹے راستے انہیں جوڑتے ہیں۔ دل کی کسی تصویر پر یہ راستہ دیکھیں: وہ کن رگوں کا نام لیتا ہے؟'
  entity: invention/pulmonary-circulation
