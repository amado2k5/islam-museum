    ur: بصری فن میں استعمال ہونے والی روایات کی اقسام کی اپنی سمجھ کو وسعت دیں […]، اور تفصیل سے بیان کریں کہ وہ مختلف فن پاروں میں کیسے استعمال ہوتی ہیں
