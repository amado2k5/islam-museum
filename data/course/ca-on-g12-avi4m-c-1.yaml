  title:
    en: Gilded brass on the dome and the doors
    ar: صفر مذهّب على القبة والأبواب
    ur: گنبد اور دروازوں پر سنہرا پیتل
  text:
    en: Al-Muqaddasi, who completed his book in 375 AH, describes the dome of the Dome of the Rock as covered in gilded brass and a hundred cubits high including its base. Al-Umari adds that each door leaf is sheathed with carved yellow brass. Which of these materials and techniques could you name correctly in a design of your own?
    ar: يصف المقدسي، وقد أتمّ كتابه سنة 375هـ، قبة الصخرة بأنها مُلبسة بالصفر المذهب ويبلغ ارتفاعها مئة ذراع بقاعدتها. ويضيف العمري أن مصراع كل باب مُلبَّس بالنحاس الأصفر المنقوش. أي هذه المواد والتقنيات تستطيع أن تسمّيها تسمية صحيحة في تصميم من عندك؟
    ur: المقدسی، جنہوں نے اپنی کتاب سنہ 375ھ میں مکمل کی، قبۃ الصخرہ کے گنبد کو سنہرے پیتل سے منڈھا ہوا بیان کرتے ہیں، جس کی بلندی اس کی بنیاد سمیت سو ہاتھ ہے۔ العمری اضافہ کرتے ہیں کہ ہر دروازے کا پٹ منقش زرد پیتل سے منڈھا ہے۔ ان میں سے کون سے مواد اور تکنیکوں کا نام آپ اپنے کسی ڈیزائن میں درست طور پر لے سکتے ہیں؟
