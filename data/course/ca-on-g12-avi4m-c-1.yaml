- position: within
  kind: object
  title:
    en: A pattern that works with its surface
    ar: زخرفة تعمل مع سطحها
    ur: ایسا نقش جو اپنی سطح کے ساتھ چلتا ہے
  text:
    en: 'Yeomans sees the vegetal arabesque as stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. He cites Owen Jones: the leaves of Greek scrollwork grow out of the surface, while Islamic design works with it. At the Mosque of Ibn Tulun, he writes, vine leaf, acanthus, palmettes and rosettes fill networks of interlacing circles, triangles and squares. What would you call a design that works with its surface?'
    ar: يرى يومانز أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. ويستشهد بأوين جونز الذي قال إن أوراق اللفائف الإغريقية تنمو خارجة من السطح، أما الزخرفة الإسلامية فتعمل معه. وفي جامع ابن طولون، كما يكتب، تملأ ورقة العنب والأقنثا والمراوح والوريدات شبكات من الدوائر المتشابكة والمثلثات والمربعات. ماذا تسمّي تصميمًا يعمل مع سطحه؟
    ur: یومانز کے نزدیک نباتاتی اربیسک مخصوص انداز میں ڈھلا ہوا اور دو بُعدی ہے، اور سطح کا لحاظ کرتا ہے، بخلاف یونانی رومی بند اور فطری مشابہت کی طرف مائل آرائش کے۔ وہ اووین جونز کا حوالہ دیتے ہیں کہ یونانی بیلوں کے پتے سطح سے باہر اگتے ہیں جبکہ اسلامی ڈیزائن اس کے ساتھ چلتا ہے۔ جامع ابن طولون میں، وہ لکھتے ہیں، انگور کا پتا، اقنثا، کھجور نما پنکھے اور گلابے آپس میں گندھے دائروں، تکونوں اور چوکوروں کے جال بھرتے ہیں۔ جو ڈیزائن اپنی سطح کے ساتھ چلے اسے آپ کیا نام دیں گے؟
