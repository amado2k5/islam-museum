  entity: person/mirza-fath-ali-akhundzada
  title:
    en: Comedies against feudalism and superstition
    ar: مسرحيات هزلية ضد الإقطاع والخرافة
    ur: جاگیرداری اور توہمات کے خلاف مزاحیہ ڈرامے
  text:
    en: Mirza Fath 'Ali Akhund-zada wrote six comedies between 1850 and 1857 in Adhari Turkish, and the Encyclopaedia of Islam calls him the first writer of original plays in a Turkish idiom. It says the plays put progressive ideas against feudalism, the corruption of justice and the superstition then widespread in the Caucasus. How is a value spoken aloud in a comedy?
    ar: كتب ميرزا فتح علي آخوندزاده بين 1850 و1857م ست مسرحيات هزلية بالتركية الأذربيجانية، وتصفه دائرة المعارف الإسلامية بأنه أول من كتب مسرحيات أصيلة بالتركية. وتذكر أنه ضمّن مسرحياته أفكارًا تقدمية ضد الإقطاع، وفساد القضاء، والخرافات المنتشرة آنذاك في القوقاز. فكيف تُقال القيمة جهرًا في مسرحية هزلية؟
    ur: میرزا فتح علی آخوندزادہ نے 1850ء سے 1857ء کے درمیان آذربائیجانی ترکی میں چھ مزاحیہ ڈرامے لکھے، اور انسائیکلوپیڈیا آف اسلام انھیں ترکی لب و لہجے میں اصل ڈرامے لکھنے والا پہلا مصنف قرار دیتا ہے۔ وہ بتاتا ہے کہ ان کے ڈراموں میں جاگیرداری، انصاف کی بدعنوانی اور اس زمانے میں قفقاز میں پھیلے توہمات کے خلاف ترقی پسند خیالات تھے۔ مزاحیہ ڈرامے میں کوئی قدر بلند آواز سے کیسے کہی جاتی ہے؟
  sources:
  - source/encyclopaedia-of-islam-2
