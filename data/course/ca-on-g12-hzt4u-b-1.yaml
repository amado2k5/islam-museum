  title:
    en: Plato among the Arabic readers
    ar: أفلاطون بين قرّاء العربية
    ur: عربی قارئین کے درمیان افلاطون
  text:
    en: "The Encyclopaedia of Islam treats Aflatun, Plato, as the standard philosopher of late Greek thought alongside Aristotle. It says most Arab thinkers subordinated him to Aristotle but recognised a common purpose between the two, and that al-Farabi used and partly reproduced the arrangement of his dialogues. How does an ancient philosopher reach a later period?"
    ar: "تعدّ موسوعة الإسلام أفلاطون فيلسوف الفكر اليوناني المتأخر المعتمد إلى جانب أرسطو. وتذكر أن أكثر المفكرين العرب جعلوه دون أرسطو لكنهم رأوا بينهما غاية مشتركة، وأن الفارابي استعمل ترتيب محاوراته المنهجي وأعاد بعضه. كيف يصل فيلسوف قديم إلى حقبة لاحقة؟"
    ur: "اسلامی انسائیکلوپیڈیا افلاطون کو ارسطو کے ساتھ متاخر یونانی فکر کا معیاری فلسفی شمار کرتی ہے۔ وہ بتاتی ہے کہ بیشتر عرب مفکرین نے اسے ارسطو کے ماتحت رکھا مگر دونوں میں مشترک مقصد مانا، اور فارابی نے اس کے مکالموں کی منظم ترتیب برتی اور جزوی طور پر دہرائی۔ قدیم فلسفی بعد کے دور تک کیسے پہنچتا ہے؟"
  entity: person/aflatun
  sources:
  - source/encyclopaedia-of-islam-2
- position: within
  kind: scholar
  title:
    en: Ibn Rushd of Cordoba, called Averroes
    ar: ابن رشد القرطبي ويسمّونه أفيرويس
    ur: قرطبہ کے ابن رشد، جنہیں ایورویس کہا گیا
  text:
    en: Abu al-Walid ibn Rushd of Cordoba, whom the Franks call Averroes, was a Maliki jurist, chief judge of Cordoba, physician and philosopher. Al-Zirikli says he devoted himself to Aristotle's words, translated them into Arabic and added much to them, and that his books were translated into Latin and Hebrew. What did the medieval period gain from a thinker like this?
    ar: أبو الوليد ابن رشد القرطبي، الذي يسميه الأفرنج «أفيرويس»، فقيه مالكي وقاضي الجماعة بقرطبة وطبيب وفيلسوف. ويقول الزركلي إنه عُني بكلام أرسطو وترجمه إلى العربية وزاد عليه زيادات كثيرة، وإن كتبه ترجمت إلى اللاتينية والعبرانية. ماذا كسبت الحقبة الوسيطة من مفكر كهذا؟
    ur: ابو الولید ابن رشد قرطبی، جنہیں فرنگی ایورویس کہتے ہیں، مالکی فقیہ، قرطبہ کے قاضی القضاۃ، طبیب اور فلسفی تھے۔ زرکلی کہتے ہیں کہ وہ ارسطو کے کلام میں منہمک رہے، اسے عربی میں منتقل کیا اور اس میں بہت اضافے کیے، اور ان کی کتابیں لاطینی اور عبرانی میں ترجمہ ہوئیں۔ ایسے مفکر سے قرونِ وسطیٰ نے کیا پایا؟
  entity: person/ibn-rushd
  sources:
  - source/al-aalam
  - source/bidaya-hallaq-v1
- position: after
  kind: object
  title:
    en: Philosophy and revealed law
    ar: الحكمة والشريعة
    ur: حکمت اور شریعت
  text:
    en: "Al-Zirikli counts among Ibn Rushd's printed works the Fasl al-Maqal, whose title, as he lists it, speaks of the accord of wisdom and the revealed law. How does a philosopher of the medieval period relate philosophy to the religion of his society?"
    ar: "يعدّ الزركلي من مؤلفات ابن رشد المطبوعة «فصل المقال»، وعنوانه كما يورده يتحدث عن اتصال الحكمة بالشريعة. كيف يربط فيلسوف الحقبة الوسيطة بين الفلسفة ودين مجتمعه؟"
    ur: "زرکلی ابن رشد کی مطبوعہ تصانیف میں «فصل المقال» کو شمار کرتے ہیں، جس کا عنوان، جیسا وہ درج کرتے ہیں، حکمت اور شریعت کے باہمی اتصال کی بات کرتا ہے۔ قرونِ وسطیٰ کا فلسفی فلسفے کو اپنے معاشرے کے دین سے کیسے جوڑتا ہے؟"
  entity: work/fasl-al-maqal
  sources:
  - source/al-aalam
