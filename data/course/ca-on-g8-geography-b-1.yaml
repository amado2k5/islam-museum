- position: after
  kind: place
  title:
    en: A hospital with endowments
    ar: مارستان بأوقاف
    ur: اوقاف والا ہسپتال
  text:
    en: Ibn al-Jawzi's history records the hospital built in Baghdad by the Buyid Adud al-Dawla, opened at the beginning of Rabi II 372 AH. Physicians, medicines, stewards, servants, vessels and clothing were gathered there, endowments were set for those who stayed in it, and the poor were given the clothing and vessels that left it. What kept the hospital supplied?
    ar: يذكر ابن الجوزي البيمارستان الذي بناه عضد الدولة البويهي في بغداد وافتُتح في أول ربيع الآخر سنة 372هـ. جُمع فيه الأطباء والأدوية والقوّام والخدم والآنية والكسوة، وجُعلت أوقاف لمن يقيم فيه، وأُعطي الفقراء ما يخرج من كسوة وآنية. ما الذي أبقى المكان مزوّداً؟
    ur: ابنِ جوزی کی تاریخ اس ہسپتال کا ذکر کرتی ہے جو بغداد میں بویہی عضدالدولہ نے بنوایا اور ربیع الآخر 372ھ کے شروع میں کھلا۔ وہاں طبیب، دوائیں، منتظم، خادم، برتن اور کپڑے جمع کیے گئے، وہاں ٹھہرنے والوں کے لیے اوقاف مقرر کیے گئے، اور غریبوں کو وہ کپڑے اور برتن دیے گئے جو وہاں سے نکلتے تھے۔ اس جگہ کو سامان کیسے ملتا رہا؟
  entity: building/bimaristan-adudi
