  kind: invention
  title:
    en: A gift that keeps working
    ar: عطاء يدوم
    ur: ایسا عطیہ جو جاری رہتا ہے
  text:
    en: A waqf is an act by which an owner locks the capital of a property away from sale, gift and inheritance, and gives its yield to a good cause for ever. The TDV encyclopedia says that from the mid-eighth to the late nineteenth century this system founded and ran most of the mosques, colleges, hospitals, fountains and soup kitchens of Muslim cities. How does such a gift keep working?
    ar: الوقف تصرّف يحبس فيه المالك أصل ماله عن البيع والهبة والإرث، ويجعل غلّته لوجه من وجوه البر على الدوام. وتقول موسوعة TDV إن الوقف صار من منتصف القرن الثامن إلى أواخر القرن التاسع عشر نظاماً يقوم عليه أكثر ما في المدن الإسلامية من مساجد ومدارس ومستشفيات وسُبل وعمارات. كيف يظل عطاء كهذا يعمل؟
    ur: وقف ایسا تصرف ہے جس میں مالک اپنی جائیداد کا اصل بیع، ہبہ اور وراثت سے ہمیشہ کے لیے روک لیتا ہے اور اس کی آمدنی کسی نیکی کے کام کے لیے مقرر کر دیتا ہے۔ TDV کا انسائیکلوپیڈیا کہتا ہے کہ آٹھویں صدی کے وسط سے انیسویں صدی کے آخر تک یہ نظام مسلم شہروں کی اکثر مساجد، مدارس، ہسپتالوں، سبیلوں اور لنگر خانوں کو قائم کرتا اور چلاتا رہا۔ ایسا عطیہ کیسے چلتا رہتا ہے؟
  entity: invention/waqf
