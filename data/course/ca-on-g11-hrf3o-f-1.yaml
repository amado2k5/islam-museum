connections:
- position: before
  kind: reflection
  title:
    en: The crescent as a time
    ar: الهلال وقتًا
    ur: ہلال بطور وقت
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says that technically the hilal is the first sighting of the lit part of the moon on the first night, and that the lawgiver made the crescents times for people: the rites, the pilgrimage, fasting and its breaking, and deferred dealings. It adds that what counts is the night of sighting, not the size of the crescent. What does it mean for worship to follow the moon?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن الهلال في الاصطلاح هو أول ظهور الجزء المضيء من القمر في الليلة الأولى، وأن الشارع جعل الأهلة مواقيت للناس: للعبادات من حج وصيام وفطر، وللمعاملات المؤجلة. وتضيف أن المعتبر ليلة الرؤية لا حجم الهلال. ماذا يعني أن تتبع العبادة القمر؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ اصطلاح میں ہلال چاند کے روشن حصے کا پہلی رات کو پہلی بار نظر آنا ہے، اور شارع نے ہلالوں کو لوگوں کے لیے اوقات ٹھہرایا: عبادات یعنی حج، روزہ اور افطار کے لیے، اور مؤخر معاملات کے لیے۔ وہ مزید کہتا ہے کہ اعتبار رؤیت کی رات کا ہے، ہلال کے حجم کا نہیں۔ عبادت کا چاند کے پیچھے چلنا کیا معنی رکھتا ہے؟'
  entity: concept/hilal-fiqh
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: within
  kind: reflection
  title:
    en: A calendar counted from a journey
    ar: تقويم يُعدّ من رحلة
    ur: ایک سفر سے گنا جانے والا کیلنڈر
  text:
    en: 'Al-Suyuti''s Tarikh al-Khulafa'' is the source cited for this: the Hijri calendar is a lunar calendar whose years are counted from the Prophet''s migration from Mecca to Medina, and it fixes the dates of Ramadan, the hajj and the two festivals. Which of the festivals and rites in this course depend on it?'
    ar: 'يُستشهد في ذلك بـ«تاريخ الخلفاء» للسيوطي: التقويم الهجري تقويم قمري تُعدّ سنواته من هجرة النبي من مكة إلى المدينة، وهو يحدّد مواعيد رمضان والحج والعيدين. أيّ الأعياد والشعائر في هذا المقرر تعتمد عليه؟'
    ur: 'اس کے لیے سیوطی کی «تاریخ الخلفاء» کا حوالہ دیا گیا ہے: ہجری کیلنڈر ایک قمری کیلنڈر ہے جس کے سال نبی کی مکہ سے مدینہ ہجرت سے گنے جاتے ہیں، اور یہ رمضان، حج اور دونوں عیدوں کی تاریخیں مقرر کرتا ہے۔ اس کورس کے کون سے تہوار اور رسمیں اس پر منحصر ہیں؟'
  entity: concept/hijri-calendar
  sources:
  - source/tarikh-khulafa-minhaj-1434
- position: after
  kind: story
  title:
    en: The year the count began
    ar: السنة التي بدأ فيها العدّ
    ur: وہ سال جب گنتی شروع ہوئی
  text:
    en: Ibn al-Athir's al-Kamil says that in the year 16, Umar ibn al-Khattab set the dating of the calendar on the advice of Ali ibn Abi Talib, and that the start of the Islamic calendar was made the Prophet's migration from Mecca to Medina. The museum's calendar record cautions that the reports differ on the occasion and the date of this decision, and that the disagreement needs a second source. Why might a community date its years from an event?
    ar: يذكر ابن الأثير في «الكامل» أنه في سنة 16 وضع عمر بن الخطاب التأريخ بمشورة علي بن أبي طالب، وأنه جُعل مبدأ التقويم الإسلامي هجرة النبي من مكة إلى المدينة. ويحذّر سجل المتحف عن التقويم الهجري من أن الروايات تختلف في مناسبة هذا القرار وتاريخه، وأن هذا الخلاف يحتاج إلى مصدر ثانٍ. لماذا قد تؤرّخ جماعة سنواتها بحدث؟
    ur: ابن اثیر «الکامل» میں لکھتے ہیں کہ سن 16 میں عمر بن خطاب نے علی بن ابی طالب کے مشورے سے تقویم کی تاریخ نویسی مقرر کی، اور اسلامی تقویم کی ابتدا نبی کی مکہ سے مدینہ کی ہجرت کو بنایا گیا۔ ہجری تقویم کے بارے میں عجائب گھر کا اندراج خبردار کرتا ہے کہ روایات اس فیصلے کے موقع اور تاریخ میں اختلاف کرتی ہیں اور اس اختلاف کے لیے دوسرے ماخذ کی ضرورت ہے۔ ایک جماعت اپنے سال کسی واقعے سے کیوں گن سکتی ہے؟
  entity: event/hijri-calendar-decree
  sources:
  - source/kamil-ibn-al-athir
