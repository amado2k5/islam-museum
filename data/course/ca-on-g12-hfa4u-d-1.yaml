  title:
    en: Agriculture, dead land and surplus water
    ar: الزراعة والأرض الموات وفضل الماء
    ur: زراعت، بنجر زمین اور فاضل پانی
  text:
    en: Al-Maraghi presents agriculture as the oldest livelihood, after Ibn Khaldun the simplest and closest to nature. Islam encourages it, he says, as the source of food for people and animals, and warns against farming usurped land. He holds that whoever revives dead land has the best claim to it, and that a tract left unworked for three years may be worked by another, conditioned on the ruler's leave. Which of these rules bears on whether food is available?
    ar: يعرض المراغي الزراعة بوصفها أسبق وجوه المعاش، نقلًا عن ابن خلدون الذي يراها أبسط الصنائع وأقربها إلى الطبيعة. ويرى أن الإسلام حثّ عليها لأنها مصدر أقوات الناس والأنعام، وحذّر من الزراعة في الأرض المغصوبة. ويذكر أن من أحيا أرضًا مواتًا فهو أحق بها، وأن من عطّل أرضه ثلاث سنين فلغيره أن يعمرها، ويقيّد ذلك بإذن ولي الأمر في العمل والقضاء. فأيّ هذه القواعد يمسّ توافر الغذاء؟
    ur: مراغی زراعت کو معاش کی سب سے قدیم صورت کے طور پر پیش کرتے ہیں، ابن خلدون کے حوالے سے جو اسے سب سے سادہ اور فطرت سے قریب ترین پیشہ مانتے ہیں۔ ان کی رائے میں اسلام نے اس کی ترغیب دی کیونکہ یہ انسانوں اور جانوروں کی خوراک کا ذریعہ ہے، اور غصب کی ہوئی زمین میں کاشت سے خبردار کیا۔ وہ لکھتے ہیں کہ جو بنجر زمین کو آباد کرے وہ اس کا زیادہ حق دار ہے، اور جو اپنی زمین تین سال بے کار رکھے اسے دوسرا آباد کر سکتا ہے، اور اسے عمل اور فیصلے میں حاکم کی اجازت سے مقید کرتے ہیں۔ ان میں سے کون سا قاعدہ خوراک کی دستیابی سے تعلق رکھتا ہے؟
  entity: concept/agriculture-in-islam
