- position: after
  kind: reflection
  title:
    en: 'Shirb: the right to water'
    ar: 'الشرب: الحق في الماء'
    ur: 'شرب: پانی کا حق'
  text:
    en: The Kuwaiti jurisprudence encyclopaedia sorts waters into four kinds by ownership and use. Public water belongs to all, who may drink from it and cut channels. Water from a spring the owner has is his in the Maliki and Shafi'i view, but he must give the surplus over his own drinking and his livestock's to others where there is no other water. Who may reach water, and on what terms?
    ar: تقسم الموسوعة الفقهية الكويتية المياه أربعة أنواع بحسب الملك والانتفاع. فالماء العام للجميع، لهم أن يشربوا منه ويشقوا القنوات. وماء المنبع المملوك يملكه صاحبه عند المالكية والشافعية، لكن عليه أن يبذل الفاضل عن شربه وشرب ماشيته لغيره حيث لا ماء غيره. فمن يصل إلى الماء، وبأي شروط؟
    ur: کویتی فقہی انسائیکلوپیڈیا پانی کو ملکیت اور استعمال کے لحاظ سے چار قسموں میں بانٹتا ہے۔ عام پانی سب کا ہے، وہ اس سے پی سکتے ہیں اور نالیاں نکال سکتے ہیں۔ مالک کے چشمے کا پانی مالکیہ اور شافعیہ کے نزدیک اسی کا ہے، مگر جہاں کوئی اور پانی نہ ہو وہاں اپنے اور اپنے مویشیوں کے پینے سے بچا ہوا پانی دوسروں کو دینا اس پر لازم ہے۔ پانی تک کون پہنچ سکتا ہے، اور کن شرائط پر؟
  entity: concept/shirb-water-rights
