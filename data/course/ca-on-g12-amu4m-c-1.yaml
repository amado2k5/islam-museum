  kind: invention
  title:
    en: A red string added to the oud
    ar: وتر أحمر يضاف إلى العود
    ur: عود میں ایک سرخ تار کا اضافہ
  text:
    en: Maqqari begins with a four-string oud corresponding to four bodily temperaments, and attributes to Ziryab an additional string. The account calls it red, places it below the mathlath and above the mathna, and associates it with the soul in an instrument-as-body analogy. The record stresses that this is a refinement of an inherited instrument, not invention of the oud, and not a surviving reconstruction with complete dimensions and tuning. What stays the same when a string is added?
    ar: يفتتح المقري الشرح بعود ذي أربعة أوتار، تقابل عنده الطبائع الأربع، وينسب إلى زرياب وتراً خامساً. يسميه الخبر وتراً أحمر ويضعه تحت المثلث وفوق المثنى، ويربطه بالنفس في تشبيه الآلة بالجسد. وهذه إضافة إلى آلة موروثة، لا اختراع العود، ولا إعادة بناء باقية بأبعاد وضبط كاملين. ما الذي يبقى كما هو حين يضاف وتر؟
    ur: مقری چار تاروں والے عود سے آغاز کرتے ہیں، جو ان کے ہاں چار مزاجوں کے مطابق ہے، اور زریاب سے ایک اضافی تار منسوب کرتے ہیں۔ روایت اسے سرخ تار کہتی ہے، مثلث کے نیچے اور مثنیٰ کے اوپر رکھتی ہے، اور ساز کو جسم سے تشبیہ دینے میں اسے نفس سے جوڑتی ہے۔ ریکارڈ زور دیتا ہے کہ یہ ایک وراثتی ساز میں بہتری ہے، عود کی ایجاد نہیں، اور نہ مکمل پیمائش اور سُر بندی کے ساتھ کوئی باقی رہنے والی تعمیرِ نو۔ تار بڑھانے پر کیا چیز وہی رہتی ہے؟
