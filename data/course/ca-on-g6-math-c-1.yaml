connections:
- position: within
  kind: invention
  title:
    en: A table built by adding neighbours
    ar: جدول يُبنى بجمع المتجاورين
    ur: متجاور اعداد جمع کر کے بننے والا جدول
  text:
    ar: "نبدأ بصف من الأعداد: 1، 2، 1. وفي الصف التالي يبقى الواحد عند الطرفين، ويُجمع كل عددين متجاورين: واحد واثنان يعطيان ثلاثة، واثنان وواحد يعطيان ثلاثة، فيكون 1، 3، 3، 1. تنسب المصادر إلى أبي بكر الكرجي قاعدة جمع الأعداد المتجاورة في جدول، وينقلها السموأل المغربي عن حساب أصلي لم يعد باقياً. تصفها البطاقة بأنها تحسين محدد، لا أول مثلث حسابي في العالم. هل تستطيع أن تصف القاعدة لصف تالٍ بكلماتك؟"
    en: "Start with a row of numbers, 1, 2, 1. The next row keeps a one at each end and adds each pair of neighbours: one and two make three, two and one make three, so the row is 1, 3, 3, 1. The sources attribute this rule of adding adjacent entries in a table to Abu Bakr al-Karaji; al-Samawal al-Maghribi transmits it from a computation that no longer survives. The record calls it a bounded improvement, not the world's first arithmetic triangle. Can you state the rule for the next row in your own words?"
    ur: "ایک صف سے شروع کریں: 1، 2، 1۔ اگلی صف میں دونوں سروں پر ایک رہتا ہے اور ہر دو متجاور اعداد جمع کیے جاتے ہیں: ایک اور دو کا جمع تین، دو اور ایک کا جمع تین، یوں صف 1، 3، 3، 1 بنتی ہے۔ مصادر جدول کے متجاور اعداد جمع کرنے کا یہ قاعدہ ابو بکر الکرجی سے منسوب کرتے ہیں؛ سموأل المغربی اسے اس اصل حساب سے نقل کرتے ہیں جو اب باقی نہیں رہا۔ اندراج اسے ایک متعین بہتری کہتا ہے، دنیا کا پہلا حسابی مثلث نہیں۔ کیا آپ اگلی صف کا قاعدہ اپنے الفاظ میں بتا سکتے ہیں؟"
