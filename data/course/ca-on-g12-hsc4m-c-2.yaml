connections:
- position: before
  kind: story
  title:
    en: A journey to one place
    ar: رحلة إلى مكان واحد
    ur: ایک ہی مقام کا سفر
  text:
    en: Hajj is the journey to the Sacred House at Mecca to perform prescribed rites, and one of the pillars of Islam. Among its purposes the Kuwaiti Encyclopaedia of Fiqh names the gathering of Muslims from across the earth, where they come to know one another and differences of wealth and poverty, race, colour and language fall away. How does a shared ritual shape the life of a community?
    ar: الحج قصد البيت الحرام بمكة لأداء مناسك مخصوصة، وهو أحد أركان الإسلام. ومن مقاصده التي تذكرها الموسوعة الفقهية الكويتية اجتماع المسلمين من أنحاء الأرض فيتعارفون وتزول الفروق بين الغنى والفقر والجنس واللون واللغة. كيف يشكّل طقس مشترك حياة جماعة؟
    ur: حج مکہ میں بیت الحرام کا قصد کر کے مقررہ مناسک ادا کرنا ہے اور اسلام کے ارکان میں سے ایک ہے۔ کویتی فقہی انسائیکلوپیڈیا اس کے مقاصد میں زمین کے کونے کونے سے مسلمانوں کا اکٹھا ہونا گنواتا ہے، جہاں وہ ایک دوسرے کو جانتے ہیں اور دولت و غربت، نسل، رنگ اور زبان کے فرق مٹ جاتے ہیں۔ ایک مشترک رسم کسی برادری کی زندگی کو کیسے ڈھالتی ہے؟
  entity: practice/hajj
  sources:
