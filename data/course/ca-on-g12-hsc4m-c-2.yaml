- position: within
  kind: reflection
  title:
    en: What makes food lawful
    ar: ما الذي يجعل الطعام حلالًا
    ur: کھانا کیا چیز حلال بناتی ہے
  text:
    en: In the jurists’ terms, dhaka is the means that makes the flesh of a land animal lawful to eat. For a valid slaughter, the record lists, the animal must be alive, the death must come from the cut, the slaughterer must be sane and a Muslim or one of the People of the Book, and the blade must cut. The schools differ on several points. How does a belief shape what a household eats?
    ar: الذكاة في اصطلاح الفقهاء هي السبب الموصل لحل أكل الحيوان البري. ويذكر السجل لصحة الذبح أن يكون المذبوح حيًا وأن يزهق بالذبح، وأن يكون الذابح عاقلًا مسلمًا أو كتابيًا، وأن تكون الآلة قاطعة. وتختلف المذاهب في مسائل عدة. كيف يشكّل الاعتقاد ما يأكله أهل البيت؟
    ur: فقہا کی اصطلاح میں ذکاۃ وہ ذریعہ ہے جو خشکی کے جانور کا گوشت کھانے کو حلال کرتا ہے۔ ریکارڈ کے مطابق ذبح درست ہونے کے لیے جانور زندہ ہو، موت ذبح سے ہو، ذبح کرنے والا عاقل اور مسلمان یا اہلِ کتاب میں سے ہو، اور آلہ کاٹنے والا ہو۔ مذاہب کئی مسائل میں اختلاف کرتے ہیں۔ عقیدہ کسی گھر کے کھانے کو کیسے ڈھالتا ہے؟
  entity: concept/dhabaih-fiqh
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: after
  kind: reflection
  title:
    en: One author on people and their surroundings
    ar: كاتب عن الإنسان ومحيطه
    ur: 'ایک مصنف: انسان اور اس کا ماحول'
  text:
    en: Muhyi al-Din Afifi Ahmad holds that pollution of water, air and land threatens the safety of persons and societies. He presents Islam as asking people to use their natural environment well and to live with it so as to keep its essentials, and reads the Qur’anic passages on the cosmos as calling for reflection on the relation between humans and creation. The record attributes these readings to the author. How might a belief about creation show in the way a community treats its surroundings?
    ar: يرى محيي الدين عفيفي أحمد أن تلوث الماء والهواء والأرض يهدد سلامة الأفراد والمجتمعات. ويعرض أن الإسلام حرص على أن يحسن الناس استغلال بيئتهم الطبيعية وأن يتعايشوا معها بما يحفظ مقوماتها، وأن الآيات التي تتناول الكون تدعو إلى التفكر في العلاقة بين الإنسان والكون. وينسب السجل هاتين القراءتين إلى الكاتب. كيف يمكن أن يظهر اعتقاد عن الخلق في طريقة تعامل جماعة مع محيطها؟
    ur: محی الدین عفیفی احمد کا خیال ہے کہ پانی، ہوا اور زمین کی آلودگی افراد اور معاشروں کی سلامتی کو خطرے میں ڈالتی ہے۔ وہ اسلام کو یوں پیش کرتے ہیں کہ وہ لوگوں سے چاہتا ہے کہ اپنے قدرتی ماحول سے اچھی طرح فائدہ اٹھائیں اور اس کے ساتھ اس طرح رہیں کہ اس کے بنیادی عناصر محفوظ رہیں، اور کائنات سے متعلق آیات کو انسان اور کائنات کے تعلق پر غور کی دعوت سمجھتے ہیں۔ ریکارڈ یہ دونوں قراءتیں مصنف کی طرف منسوب کرتا ہے۔ کسی عقیدے کا تخلیق کے بارے میں تصور ایک برادری کے اپنے گرد و پیش سے سلوک میں کیسے ظاہر ہو سکتا ہے؟
