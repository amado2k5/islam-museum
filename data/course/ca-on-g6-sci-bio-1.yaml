  title:
    en: 'A verse to read before you count'
    ar: 'آية تُقرأ قبل العدّ'
    ur: 'گننے سے پہلے پڑھنے کی آیت'
  text:
    en: 'Before you count species, pause and read the verse shown with this card, Qur''an 6:38. Read it slowly. Then look again at a wetland, a forest or your schoolyard. What do you notice about the living things there that a count alone would miss?'
    ar: 'قبل إحصاء الأنواع، توقف واقرأ الآية المعروضة مع هذه البطاقة، وهي الآية 38 من سورة الأنعام. اقرأها على مهل. ثم انظر من جديد إلى مستنقع أو غابة أو ساحة مدرستك. ما الذي تلاحظه في الكائنات الحية هناك مما قد يفوته العدّ وحده؟'
    ur: 'انواع گننے سے پہلے رک کر اس کارڈ کے ساتھ دکھائی گئی آیت پڑھیں، یعنی سورۂ انعام کی آیت 38۔ اسے آہستہ آہستہ پڑھیں۔ پھر کسی دلدل، جنگل یا اپنے اسکول کے صحن کو دوبارہ دیکھیں۔ وہاں کے جانداروں میں آپ کو کیا ایسا نظر آتا ہے جو صرف گنتی سے چھوٹ جاتا؟'
  ref: '6:38'
