- position: within
  kind: scholar
  title:
    en: 'A writer who slipped in jokes'
    ar: 'كاتب يدسّ الفكاهة'
    ur: 'لطیفے شامل کرنے والا ادیب'
  text:
    en: 'The Encyclopaedia of Islam says that al-Jahiz slipped anecdotes, witty remarks and amusing comments into even his weightiest passages. It adds that, without stepping outside the bounds of the faith, he claimed the right to examine accepted attitudes towards natural phenomena. Al-Mas''udi lists al-Hayawan (Animals) among his books and says that when he feared the reader would tire, he moved from seriousness to levity. Why might a book about animals need a joke?'
    ar: 'تذكر موسوعة الإسلام أن الجاحظ كان يدس النوادر والملاحظات الظريفة والتعليقات المسلية حتى في أثقل المواضع. وتضيف أنه، من دون أن يخرج عن حدود الدين، أخذ لنفسه حق فحص المواقف المقبولة من الظواهر الطبيعية. ويذكر المسعودي «الحيوان» بين كتبه، ويقول إنه كان إذا خاف ملل القارئ خرج من جد إلى هزل. لماذا قد يحتاج كتاب عن الحيوان إلى طُرفة؟'
    ur: 'موسوعۃ الاسلام کے مطابق الجاحظ لطیفے، ظریفانہ باتیں اور دل بہلانے والے تبصرے اپنے سب سے سنجیدہ مقامات میں بھی شامل کر دیتے تھے۔ وہ مزید کہتی ہے کہ دین کی حدود سے باہر نکلے بغیر انہوں نے قدرتی مظاہر کے بارے میں مسلّمہ رویوں کو پرکھنے کا حق اپنے لیے رکھا۔ مسعودی «الحیوان» کو ان کی کتابوں میں شمار کرتے ہیں اور کہتے ہیں کہ جب انہیں قاری کے اکتا جانے کا خدشہ ہوتا تو وہ سنجیدگی سے ہنسی مذاق کی طرف نکل جاتے۔ جانوروں کی کتاب کو لطیفے کی ضرورت کیوں پڑ سکتی ہے؟'
  entity: person/al-jahiz
  sources:
  - source/encyclopaedia-of-islam-2
  - source/muruj-al-dhahab
- position: after
  kind: story
  title:
    en: 'Dividing the world first'
    ar: 'قسمة العالم أولاً'
    ur: 'پہلے دنیا کی تقسیم'
  text:
    en: 'Before the kinds of animals, al-Jahiz sets out a division of the world: bodies are in sum inanimate or growing; the growing are animals and plants; animals walk, fly, swim or creep. He says he follows the names established among the people of this language. Not everything that flies on two wings is a bird, he notes: locusts, bees and flies fly but are not called birds, while the bat is reckoned among birds though featherless. How would you sort a bat?'
    ar: 'قبل الدخول في أصناف الحيوان يضع الجاحظ قسمة للعالم: الأجسام في الجملة جماد ونامٍ، والنامي حيوان ونبات، والحيوان ما يمشي وما يطير وما يسبح وما ينساح. ويقول إنه يتبع في ذلك الأسماء القائمة المعروفة عند أهل هذه اللغة. وينبه على أن ليس كل ما طار بجناحين طيراً، فالجراد والنحل والذباب تطير ولا تسمى طيراً، وأن الخفاش من الطير مع أنه بلا ريش. كيف كنت ستصنّف الخفاش؟'
    ur: 'جانوروں کی قسموں میں جانے سے پہلے الجاحظ دنیا کی ایک تقسیم رکھتے ہیں: اجسام مجموعی طور پر بے جان یا بڑھنے والے ہیں؛ بڑھنے والے جانور اور نباتات ہیں؛ جانور چلتے، اڑتے، تیرتے یا رینگتے ہیں۔ وہ کہتے ہیں کہ وہ اس زبان والوں کے ہاں قائم اور معروف ناموں کی پیروی کرتے ہیں۔ وہ بتاتے ہیں کہ ہر وہ چیز جو دو پروں سے اڑے پرندہ نہیں ہوتی: ٹڈی، شہد کی مکھی اور مکھی اڑتی ہیں مگر پرندہ نہیں کہلاتیں، اور چمگادڑ بے پر ہونے کے باوجود پرندوں میں شمار ہوتی ہے۔ آپ چمگادڑ کو کیسے درجہ دیتے؟'
