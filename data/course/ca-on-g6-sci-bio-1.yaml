label:
  en: What is biodiversity?
  ar: ما التنوع الحيوي؟
  ur: حیاتیاتی تنوع کیا ہے؟
  es: "¿Qué es la biodiversidad?"
  fr: "Qu'est-ce que la biodiversité ?"
  tr: "Biyoçeşitlilik nedir?"
  id: "Apa itu keanekaragaman hayati?"
summary:
  en: Understanding biodiversity as the diversity of life on Earth, and how variety within a species is essential for its survival.
  ar: فهم التنوع الحيوي بوصفه تنوع الحياة على الأرض، وكيف يكون التنوع داخل النوع الواحد ضروريًا لبقائه.
  ur: حیاتیاتی تنوع کو زمین پر زندگی کے تنوع کے طور پر سمجھنا، اور یہ کہ ایک نوع کے اندر تنوع اس کی بقا کے لیے کیسے ضروری ہے۔
  es: "Comprender la biodiversidad como la diversidad de la vida en la Tierra y cómo la variedad dentro de una especie es esencial para su supervivencia."
  fr: "Comprendre la biodiversité comme la diversité de la vie sur Terre, et comment la variété au sein d'une espèce est essentielle à sa survie."
  tr: "Biyoçeşitliliği, Dünya üzerindeki yaşam çeşitliliği olarak anlamak ve tek bir tür içindeki çeşitliliğin o türün hayatta kalması için ne kadar önemli olduğunu kavramak."
  id: "Memahami keanekaragaman hayati sebagai keragaman kehidupan di Bumi, dan bagaimana keragaman dalam satu spesies sangat penting untuk kelangsungan hidupnya."
