connections:
- position: before
  kind: quran
  title:
    en: Every creature a community
    ar: كل دابة أمة
    ur: 'ہر مخلوق ایک امت'
  text:
    en: 'Before counting species, pause: the Qur''an says there is no creature on earth or bird flying on its wings but that they are communities like yours (6:38). What might it mean that a wetland is
      a ''community''?'
    ar: 'قبل إحصاء الأنواع، تأمل: يقول القرآن إنه ما من دابة في الأرض ولا طائر يطير بجناحيه إلا أمم أمثالكم (6:38). ما الذي قد يعنيه أن يكون المستنقع «أمة»؟'
    ur: 'انواع گننے سے پہلے رک کر سوچیں: قرآن کہتا ہے کہ زمین کی کوئی مخلوق اور پروں سے اڑنے والا کوئی پرندہ نہیں مگر وہ تمہاری طرح امتیں ہیں (6:38)۔ دلدل کا «امت» ہونے کا کیا مطلب ہو سکتا ہے؟'
  ref: '6:38'
  sources:
  - source/tanzil-quran
- position: within
  kind: scholar
  title:
    en: al-Jahiz watched animals closely
    ar: الجاحظ يراقب الحيوان عن كثب
    ur: 'الجاحظ نے جانوروں کا غور سے مشاہدہ کیا'
  text:
    en: Twelve hundred years ago in Basra, al-Jahiz filled seven volumes — Kitab al-Hayawan — with observations of how animals eat, compete and depend on one another. He noticed that each creature is food
      for another, an early description of food chains.
    ar: قبل اثني عشر قرنًا في البصرة ملأ الجاحظ سبعة مجلدات — كتاب الحيوان — بمشاهداته لكيفية غذاء الحيوانات وتنافسها واعتماد بعضها على بعض، ولاحظ أن كل مخلوق غذاء لآخر، وهو وصف مبكر لسلاسل الغذاء.
    ur: 'بارہ سو سال پہلے بصرہ میں الجاحظ نے سات جلدیں — کتاب الحیوان — جانوروں کے کھانے، مقابلہ کرنے اور ایک دوسرے پر انحصار کے مشاہدات سے بھری۔ انہوں نے دیکھا کہ ہر مخلوق کسی اور کی خوراک ہے — خوراکی زنجیر کی ابتدائی تعریف۔'
  entity: person/al-jahiz
  sources:
  - source/hill-1993
- position: after
  kind: story
  title:
    en: A book that counted creation
    ar: كتاب أحصى الخلق
    ur: 'ایک کتاب جس نے تخلیق گنی'
  text:
    en: Al-Jahiz grouped animals by how they move and live — centuries before European naturalists built classification systems. His work reminds us that cataloguing the living world has deep roots in Muslim
      scholarship.
    ar: جمّع الجاحظ الحيوانات بحسب حركتها ومعيشتها قبل قرون من بناء علماء الطبيعة الأوروبيين أنظمة التصنيف؛ ويذكّرنا عمله بأن جرد عالم الأحياء له جذور عميقة في العلم الإسلامي.
    ur: 'الجاحظ نے جانوروں کو ان کی حرکت اور رہن سہن کے مطابق درجات میں بانٹا — یورپی ماہرینِ فطرت کے درجہ بندی نظاموں سے صدیاں پہلے۔ ان کا کام یاد دلاتا ہے کہ جاندار دنیا کی فہرست سازی کی جڑیں مسلم علم میں گہری ہیں۔'
  entity: work/kitab-al-hayawan
  sources:
  - source/hill-1993
order: 1
