expectations:
- code: B2.2
  text:
    en: demonstrate an understanding of biodiversity as the diversity of life on Earth, including the diversity of organisms within species, among species in a community, and among communities and the habitats that support them
    ar: أظهر فهمًا للتنوع الحيوي بوصفه تنوع الحياة على الأرض، بما في ذلك تنوع الكائنات داخل الأنواع، وبين الأنواع في المجتمع الحيوي، وبين المجتمعات الحيوية والموائل التي تدعمها
    ur: حیاتیاتی تنوع کو زمین پر زندگی کے تنوع کے طور پر سمجھنے کا مظاہرہ کریں، جس میں انواع کے اندر جانداروں کا تنوع، کسی برادری میں انواع کے درمیان تنوع، اور برادریوں اور ان کو سہارا دینے والے مساکن کے درمیان تنوع شامل ہیں
- code: B2.3
  text:
    en: describe ways in which biodiversity within species is essential for their survival
    ar: صِف الكيفيات التي يكون بها التنوع داخل الأنواع ضروريًا لبقائها
    ur: بیان کریں کہ انواع کے اندر حیاتیاتی تنوع ان کی بقا کے لیے کن طریقوں سے ضروری ہے
