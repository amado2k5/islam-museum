  title:
    en: A qawwal and a wider audience
    ar: قوّال وجمهور أوسع
    ur: ایک قوال اور وسیع سامعین
  text:
    en: Nusrat Fateh Ali Khan (1948–1997) was a Pakistani singer above all associated with qawwali, the Sufi devotional song of Pakistan and India. In 1988 he worked with Peter Gabriel on the score of The Last Temptation of Christ and in 1989 signed with Real World, reaching a wider audience with albums such as Mustt Mustt (1990). He also scored Indian and Pakistani films and performed in over forty countries. Who listens to music that comes from far away, and why?
    ar: نصرت فتح علي خان (1948–1997) مغنٍّ باكستاني ارتبط اسمه بالقوالي، فنّ الإنشاد الصوفي في باكستان والهند. تعاون في 1988 مع بيتر غابرييل على موسيقى فيلم «الإغواء الأخير للمسيح»، ثم وقّع مع Real World في 1989 فاتسع جمهوره بألبومات منها «Mustt Mustt» (1990)، ولحّن لأفلام هندية وباكستانية، وأحيا حفلات في أكثر من أربعين بلدًا. من يستمع إلى موسيقى قادمة من بعيد، ولماذا؟
    ur: نصرت فتح علی خان (1948–1997) پاکستانی گلوکار تھے جن کا نام سب سے بڑھ کر قوالی سے وابستہ ہے، جو پاکستان اور ہندوستان کی صوفیانہ عقیدتی گائیکی ہے۔ 1988 میں انہوں نے پیٹر گیبریل کے ساتھ فلم «دی لاسٹ ٹیمپٹیشن آف کرائسٹ» کی موسیقی پر کام کیا اور 1989 میں Real World سے معاہدہ کیا، جس سے «Mustt Mustt» (1990) جیسے البموں کے ذریعے ان کے سامعین کا دائرہ وسیع ہوا۔ انہوں نے ہندوستانی اور پاکستانی فلموں کی موسیقی بھی ترتیب دی اور چالیس سے زیادہ ملکوں میں پروگرام کیے۔ دور سے آنے والی موسیقی کو کون سنتا ہے، اور کیوں؟
