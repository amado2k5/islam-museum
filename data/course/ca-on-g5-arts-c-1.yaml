  title:
    en: A qawwali written for a film scene
    ar: قوالي كُتب لمشهد في فيلم
    ur: فلم کے منظر کے لیے لکھی گئی قوالی
  text:
    en: '''Kun Faya Kun'' is a qawwali composed by A. R. Rahman for the 2011 Hindi film Rockstar, directed by Imtiaz Ali, and dedicated to the Sufi saint Nizamuddin Auliya. The article recounts that when the film''s hero is thrown out of his house he goes to the Nizamuddin Dargah in Delhi, spends time with the qawwals and plays with them, and out of that journey the qawwali was composed. What can a song add to a scene that words alone cannot?'
    ar: «Kun Faya Kun» قوالي لحّنه أ. ر. رحمن لفيلم «روكستار» الهندي سنة 2011 من إخراج امتياز علي، وأهداه إلى الصوفي نظام الدين أولياء. وتروي المقالة أن بطل الفيلم لما طُرد من بيته لجأ إلى ضريح نظام الدين في دلهي وأقام مع القوالين وعزف معهم، ومن هذه الرحلة وُلد القوالي. ماذا تضيف الأغنية إلى المشهد مما لا تقوله الكلمات وحدها؟
    ur: «Kun Faya Kun» اے آر رحمان کی بنائی ہوئی قوالی ہے جو 2011 کی ہندی فلم «راک اسٹار» کے لیے بنی، جس کے ہدایت کار امتیاز علی ہیں، اور صوفی بزرگ نظام الدین اولیاء کے نام منسوب ہے۔ مضمون بتاتا ہے کہ جب فلم کا ہیرو گھر سے نکال دیا جاتا ہے تو وہ دہلی میں نظام الدین کی درگاہ جاتا ہے، قوالوں کے ساتھ وقت گزارتا اور ان کے ساتھ بجاتا ہے، اور اسی سفر سے یہ قوالی وجود میں آئی۔ ایک گانا کسی منظر میں ایسا کیا اضافہ کرتا ہے جو اکیلے الفاظ نہیں کر سکتے؟
