  title:
    en: People and the natural environment
    ar: الإنسان والبيئة الطبيعية
    ur: انسان اور قدرتی ماحول
  text:
    en: "Muhyi al-Din Afifi Ahmad holds that the pollution of water, air and soil threatens the safety of persons and societies, and that international conference resolutions went unimplemented. He presents Islam as taking care that people make good use of their natural environment and coexist with it in a way that preserves its constituents. This is the author's reading. Which big question about people and nature lies under a debate on environmental policy?"
    ar: "يرى محيي الدين عفيفي أحمد أن تلوث الماء والهواء والأرض يهدد سلامة الأفراد والمجتمعات، وأن قرارات المؤتمرات الدولية لم تُنفَّذ. ويعرض أن الإسلام حرص على أن يحسن الناس استغلال بيئتهم الطبيعية ويتعايشوا معها بما يحفظ مقوماتها. وهذه قراءة الكاتب. أي سؤال كبير عن الإنسان والطبيعة يقوم تحت نقاش في السياسة البيئية؟"
    ur: "محی الدین عفیفی احمد کا خیال ہے کہ پانی، ہوا اور زمین کی آلودگی افراد اور معاشروں کی سلامتی کے لیے خطرہ ہے، اور یہ کہ بین الاقوامی کانفرنسوں کے فیصلوں پر عمل نہیں ہوا۔ وہ پیش کرتے ہیں کہ اسلام نے اس کا اہتمام کیا کہ لوگ اپنے قدرتی ماحول سے اچھا فائدہ اٹھائیں اور اس کے ساتھ اس طرح رہیں کہ اس کے بنیادی عناصر محفوظ رہیں۔ یہ مصنف کی اپنی قراءت ہے۔ ماحولیاتی پالیسی کی بحث کے نیچے انسان اور فطرت کا کون سا بڑا سوال ہے؟"
  entity: concept/environmental-protection-in-islam
  sources:
  - source/nazarat-mawdu-iyya-azhar
- position: within
  kind: reflection
  title:
    en: When does the question of abortion arise?
    ar: الإجهاض عند الفقهاء
    ur: اسقاط فقہاء کے ہاں
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence records that classical jurists hold that after ensoulment, at about a hundred and twenty days, abortion is forbidden by consensus, and that before ensoulment they differ; the views it gives are these: some allow it only for an excuse, as the Hanafis do, some at the earliest stage, as one Hanbali view does, and the Shafi''is forbid it once the drop has settled. Which big question about the beginning of a person''s life does a debate on abortion turn on?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن الفقهاء يقولون إن إجهاض الجنين بعد نفخ الروح، وهو بعد مائة وعشرين يوماً، محرم بالإجماع، وإنهم قبل نفخ الروح اختلفوا؛ والآراء التي تذكرها هي: فمنهم من أباحه بعذر فقط، كالحنفية، ومنهم من أباحه في أول الحمل كالحنابلة في رواية، ومنع الشافعية الإجهاض بعد استقرار النطفة. على أي سؤال كبير عن بداية حياة الإنسان يقوم نقاش الإجهاض؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا درج کرتا ہے کہ فقہا کہتے ہیں کہ روح پھونکے جانے کے بعد، یعنی تقریباً ایک سو بیس دن کے بعد، اسقاط بالاجماع حرام ہے، اور روح پھونکے جانے سے پہلے ان میں اختلاف ہے؛ جو آراء وہ دیتا ہے یہ ہیں: بعض اسے صرف عذر کی بنا پر جائز کہتے ہیں جیسے حنفیہ، بعض حمل کے ابتدائی مرحلے میں جیسے ایک روایت میں حنابلہ، اور شافعیہ نطفے کے قرار پکڑنے کے بعد اسے منع کرتے ہیں۔ اسقاط کی بحث زندگی کے آغاز کے بارے میں کس بڑے سوال پر کھڑی ہے؟'
