expectations:
- code: B1
  text:
    en: apply the creative process to process drama and the development of drama works, using the elements and conventions of drama to communicate feelings, ideas, and multiple perspectives
    ar: طبّق عملية الإبداع على الدراما التمثيلية وتطوير الأعمال الدرامية، مستخدمًا عناصر الدراما وأعرافها للتعبير عن المشاعر والأفكار ووجهات النظر المتعددة
    ur: تخلیقی عمل کو بروئے کار لا کر عملی ڈرامے اور ڈرامائی کاموں کی تشکیل کریں، ڈرامے کے عناصر اور اصطلاحات کو استعمال کر کے احساسات، خیالات اور متعدد نقطہ ہائے نظر کا ابلاغ کریں
- code: B2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of drama works and experiences
    ar: طبّق عملية التحليل النقدي ليعبّر عن المشاعر والأفكار والفهم استجابةً لتنوّع من الأعمال الدرامية والتجارب الدرامية
    ur: تنقیدی تجزیے کا عمل بروئے کار لا کر مختلف ڈرامائی کاموں اور ڈرامائی تجربات کے جواب میں احساسات، خیالات اور سمجھ کا اظہار کریں
- code: B3
  text:
    en: demonstrate an understanding of a variety of drama and theatre forms, traditions, and styles from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لتنوّع من أشكال الدراما والمسرح وتقاليدهما وأساليبهما من الماضي والحاضر وسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کے ڈرامے اور تھیٹر کی مختلف اشکال، روایات اور اسالیب اور ان کے سماجی، ثقافتی اور تاریخی سیاق کی سمجھ کا مظاہرہ کریں
