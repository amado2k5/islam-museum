expectations:
- code: B1
  text:
    en: analyse the development of technologies that have contributed to our understanding of the universe, and evaluate the impact of milestones in astronomical theory or knowledge on the scientific community
    ar: حلّل تطوّر التقنيات التي أسهمت في فهمنا للكون، وقيّم أثر المحطات الفارقة في النظرية الفلكية أو المعرفة الفلكية في المجتمع العلمي
    ur: ان ٹیکنالوجیز کی ترقی کا تجزیہ کریں جنہوں نے کائنات کی ہماری فہم میں حصہ ڈالا، اور فلکیاتی نظریے یا علم کے سنگِ میلوں کے سائنسی برادری پر اثر کا جائزہ لیں
- code: B2
  text:
    en: investigate and analyse the properties of the universe, particularly the evolution and properties of stars, in both qualitative and quantitative terms
    ar: ابحث وحلّل خصائص الكون، ولا سيما تطوّر النجوم وخصائصها، بالمصطلحات النوعية والكمية معًا
    ur: کائنات کی خصوصیات، بالخصوص ستاروں کے ارتقا اور خصوصیات، کی کیفی اور مقداری دونوں اعتبار سے تحقیق اور تجزیہ کریں
- code: B3
  text:
    en: demonstrate an understanding of the origin and evolution of the universe, the principal characteristics of its components, and techniques used to study those components
    ar: أظهر فهمًا لأصل الكون وتطوّره، والخصائص الرئيسة لمكوّناته، والتقنيات المستخدمة في دراسة تلك المكوّنات
    ur: کائنات کے آغاز اور ارتقا، اس کے اجزا کی بنیادی خصوصیات، اور ان اجزا کے مطالعے کی تکنیکوں کی فہم کا مظاہرہ کریں
