  en: Astronomical technology, the properties of stars and the origin of the universe (expectations B1 to B3). The museum maps two lessons, on the astrolabe and on how earlier observers recorded the sky.
  ar: التقنية الفلكية وخصائص النجوم وأصل الكون ⁦(التوقعات B1 إلى B3)⁩. ويربط المتحف درسين، عن الأسطرلاب وعن تسجيل الراصدين القدماء للسماء.
  ur: فلکیاتی ٹیکنالوجی، ستاروں کی خصوصیات اور کائنات کا آغاز ⁦(توقعات B1 تا B3)⁩۔ میوزیم دو سبق جوڑتا ہے، اسطرلاب پر اور اس پر کہ پہلے کے مشاہدہ کرنے والے آسمان کیسے درج کرتے تھے۔
