- position: after
  kind: scholar
  title:
    en: The distances of the heavenly bodies
    ar: أبعاد الأجرام السماوية
    ur: آسمانی اجسام کے فاصلے
  text:
    en: Al-Farghani gives the distances of the Moon, the Sun, the five planets and the sphere of the fixed stars in Earth radii and in miles, taking the Earth's diameter as 6,500 miles. The figures are consistent with that radius, but they are read by OCR from the printed book and the least distance of the Moon is doubtful. These are a medieval astronomer's estimates, to be set beside today's measured distances in class. Why might the Earth's radius make a good unit for the sky?
    ar: يقدّر الفرغاني أبعاد القمر والشمس والكواكب الخمسة وفلك الثوابت بأنصاف قطر الأرض وبالأميال، ويجعل قطر الأرض 6500 ميل. والأرقام متسقة مع نصف القطر هذا، لكنها قراءة OCR من الكتاب المطبوع، وأدنى بُعد للقمر مشكوك فيه. وهي تقديرات فلكي من القرون الوسطى، تُقابَل في الصف بالمسافات المقيسة اليوم. لماذا يصلح نصف قطر الأرض وحدة لقياس السماء؟
    ur: الفرغانی چاند، سورج، پانچ سیاروں اور ثوابت کے فلک کے فاصلے زمین کے نصف قطر کی اکائیوں اور میلوں میں بتاتا ہے، اور زمین کا قطر 6,500 میل مانتا ہے۔ اعداد اسی نصف قطر سے ہم آہنگ ہیں، مگر وہ چھپی ہوئی کتاب سے OCR کے ذریعے پڑھے گئے ہیں اور چاند کا کم از کم فاصلہ مشکوک ہے۔ یہ قرونِ وسطیٰ کے ایک ماہرِ فلکیات کے اندازے ہیں، جنہیں جماعت میں آج کی ناپی ہوئی دوریوں کے ساتھ رکھ کر دیکھا جائے۔ زمین کا نصف قطر آسمان کے لیے اچھی اکائی کیوں ہو سکتا ہے؟
