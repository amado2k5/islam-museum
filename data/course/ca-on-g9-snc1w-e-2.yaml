- position: before
  kind: invention
  title:
    en: From a mountain top to the size of the Earth
    ar: من قمة جبل إلى حجم الأرض
    ur: پہاڑ کی چوٹی سے زمین کے حجم تک
  text:
    en: How can a measurement on a mountain reveal the Earth's size? From a height, the distant horizon lies below the observer's horizontal plane by a small angle; with the observer's height known, that angle can be related to the radius of a spherical Earth, and al-Biruni explains the relation through similar triangles and sine ratios. The record adds that a historical length has not automatically become a modern metre measurement. Why does the Earth's size matter for measuring the sky?
    ar: كيف ينتقل قياس من قمة جبل إلى حجم الأرض؟ عند النظر من مكان مرتفع إلى أفق بعيد يقع الأفق أسفل المستوى الأفقي عند الراصد، وانخفاضه زاوية صغيرة؛ وإذا عُرف ارتفاع الراصد أمكن ربط الزاوية بنصف قطر كرة تمثل الأرض. ويعرض البيروني هذه العلاقة بمثلثات متشابهة ونسب الجيوب. ولا يعني ذلك أن قيمة تاريخية معينة قد تحولت تلقائيًا إلى أمتار حديثة. فلماذا يهمّ حجم الأرض لقياس السماء؟
    ur: ایک پہاڑ پر کی گئی پیمائش زمین کے حجم کو کیسے ظاہر کر سکتی ہے؟ کسی بلندی سے دور کا افق دیکھنے والے کی افقی سطح سے ایک چھوٹے زاویے کے برابر نیچے ہوتا ہے؛ دیکھنے والے کی بلندی معلوم ہو تو اس زاویے کو کروی زمین کے نصف قطر سے جوڑا جا سکتا ہے، اور البیرونی اس رشتے کو ملتے جلتے مثلثوں اور جیب کی نسبتوں سے بیان کرتا ہے۔ ریکارڈ مزید کہتا ہے کہ کوئی تاریخی لمبائی خود بخود جدید میٹر کی پیمائش نہیں بن گئی۔ زمین کا حجم آسمان کی پیمائش کے لیے کیوں اہم ہے؟
