    en: Carrying weight, lightly
    ar: حمل الثقل بخفة
    ur: 'بوجھ اٹھانا، ہلکے سے'
  text:
    en: The Qur'an points to creatures and ships that carry our loads (16:7-8). Aircraft do the same at scale — a reason, in a tradition that warns against waste, to design them to sip fuel, not gulp it.
    ar: يستشهد القرآن بالدواب والسفن التي تحمل أثقالنا (16:7-8). والطائرات تفعل ذلك على نطاق واسع — وهذا سبب، في تقليد يحذر من الإسراف، لتصميمها ترشف الوقود لا تلتهمه.
    ur: 'قرآن ان جانوروں اور کشتیوں کی طرف اشارہ کرتا ہے جو ہمارے بوجھ اٹھاتے ہیں (16:7-8)۔ ہوائی جہاز بھی بڑے پیمانے پر یہی کرتے ہیں — اسراف سے روکنے والی روایت میں، انہیں ایسے بنانا ہی مقصود ہے کہ ایندھن گھونٹ گھونٹ پئیں، نگلیں نہیں۔'
