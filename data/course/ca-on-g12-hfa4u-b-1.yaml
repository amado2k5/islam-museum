  kind: story
  title:
    en: Bread out of reach in Baghdad
    ar: الخبز بعيد المنال في بغداد
    ur: بغداد میں روٹی پہنچ سے باہر
  text:
    en: Miskawayh records a severe famine in Baghdad in 334 AH, after the war of Mu'izz al-Dawla and Nasir al-Dawla for the city. Bread was five ratls a dirham on the east bank but one ratl for a dirham and a quarter on the west, when it could be found, and the soldiers reaped the countryside's crops. He writes that prices fell when the strife ended and the new harvest came in. Which factors changed what people could eat?
    ar: يسجّل مسكويه في حوادث سنة 334هـ غلاءً شديدًا ببغداد عقب حرب معز الدولة وناصر الدولة على المدينة. كان الخبز في الجانب الشرقي خمسة أرطال بدرهم، وفي الغربي الرطل الواحد بدرهم وربع إذا وُجد، وكان الجند يحصدون غلات أهل السواد ويحملونها إلى معسكرهم. ويكتب أن الأسعار انحلّت لما زالت الفتنة ودخلت الغلات الجديدة. فما العوامل التي غيّرت ما يستطيع الناس أكله؟
    ur: مسکویہ سنہ 334ھ کے واقعات میں بغداد کی ایک شدید گرانی درج کرتے ہیں جو معز الدولہ اور ناصر الدولہ کی شہر پر جنگ کے بعد آئی۔ مشرقی جانب روٹی پانچ رطل کی ایک درہم میں تھی، اور مغربی جانب ایک رطل سوا درہم میں، اگر مل جائے؛ اور سپاہی دیہات والوں کی فصلیں کاٹ کر اپنے کیمپ لے جاتے تھے۔ وہ لکھتے ہیں کہ فتنہ ختم ہوا اور نئی فصل آئی تو قیمتیں گر گئیں۔ کن عوامل نے لوگوں کے کھانے کو بدلا؟
  entity: event/baghdad-famine-334
  sources:
