- position: after
  kind: story
  title:
    en: Famine and plague in 448
    ar: الغلاء والوباء سنة 448
    ur: 448ھ کی گرانی اور وبا
  text:
    en: 'In 448 AH, the record says, a severe dearth and heavy plague struck Egypt, while Iraq was full of strife, fear and plunder. It quotes Ibn al-Jawzi''s al-Shudhur: hunger became so great that people ate carrion, and a quince, a pomegranate or a cucumber cost a dinar each. Famine and plague spread across all the lands. How do disease and disorder compare with war as causes of hunger?'
    ar: في سنة 448هـ، بحسب السجل، كان القحط الشديد بديار مصر والوباء المفرط، وكانت العراق مموجة بالفتن والخوف والنهب. وينقل عن ابن الجوزي في «الشذور» أن الجوع اشتد حتى أكلوا الميتة، وبلغت السفرجلة والرمانة والخيارة ديناراً لكل منها، وعمّ الغلاء والوباء جميع البلاد. فكيف يُقارن المرض والاضطراب بالحرب أسبابًا للجوع؟
    ur: ریکارڈ کے مطابق سنہ 448ھ میں مصر میں شدید قحط اور سخت وبا آئی، جبکہ عراق بدامنی، خوف اور لوٹ مار سے بھرا تھا۔ وہ ابن الجوزی کی «الشذور» سے نقل کرتا ہے کہ بھوک اتنی بڑھی کہ لوگوں نے مردار کھایا، اور ایک بہی، ایک انار یا ایک کھیرا ہر ایک دینار کا ہو گیا؛ اور گرانی اور وبا تمام شہروں میں پھیل گئی۔ بھوک کے اسباب کے طور پر بیماری اور بدامنی کا جنگ سے موازنہ کیسے کیا جائے؟
  entity: event/famine-iraq-egypt-448
