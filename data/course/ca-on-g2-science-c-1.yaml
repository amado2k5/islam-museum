  title:
    en: Pots that hold and cool water
    ar: جرار تحفظ الماء وتبرّده
    ur: پانی رکھنے اور ٹھنڈا کرنے والے گھڑے
  text:
    en: Wilkinson writes that at Nishapur unglazed ware served for cooking vessels and above all for storing water, and that because it soaked up liquids it was unfitting for milk, wine or oil. Large pitchers held water in every house, and its pitchers kept water cool by evaporation in a hot, dry land. Which materials in your classroom would soak up water, and which would repel it?
    ar: يكتب ويلكنسون أن الفخار غير المزجج في نيسابور كان يُستعمل لأواني الطبخ، وفوق ذلك لتخزين الماء، وأنه لأنه يتشرب السوائل لم يكن صالحًا للحليب أو الخمر أو الزيت. وكانت الأباريق الكبيرة تحفظ الماء في كل بيت، وكانت أباريقه تبرّد الماء بالتبخر في أرض حارة جافة. أي المواد في صفك تمتص الماء، وأيها تصدّه؟
    ur: ولکنسن لکھتے ہیں کہ نیشاپور میں بے لعاب مٹی کے برتن پکانے کے لیے اور سب سے بڑھ کر پانی ذخیرہ کرنے کے لیے استعمال ہوتے تھے، اور چونکہ وہ مائعات کو جذب کر لیتے تھے اس لیے دودھ، شراب یا تیل کے لیے نامناسب تھے۔ بڑے گھڑے ہر گھر میں پانی رکھتے تھے، اور ان کے گھڑے گرم خشک سرزمین میں بخارات بن کر اڑنے سے پانی ٹھنڈا رکھتے تھے۔ آپ کی جماعت کی کون سی چیزیں پانی جذب کرتی ہیں اور کون سی اسے دور رکھتی ہیں؟
