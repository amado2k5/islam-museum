  title:
    en: A week of snow in Baghdad
    ar: أسبوع من الثلج في بغداد
    ur: بغداد میں برف کا ایک ہفتہ
  text:
    en: Ibn al-Jawzi's al-Muntazam reports that snow fell at Baghdad on Wednesday, 11 Rabi' I 398, a cubit deep in places and a cubit and a half. It stayed a week unmelted, and people shovelled it from their roofs into the streets and lanes; traces remained some twenty days. How can snow change what people do in a city?
    ar: يروي ابن الجوزي في المنتظم أن الثلج وقع ببغداد يوم الأربعاء الحادي عشر من ربيع الأول سنة 398، فعلا الأرض ذراعًا في موضع وذراعًا ونصفًا في آخر. وأقام أسبوعًا لم يذب، فرماه الناس عن سطوحهم بالرفوش إلى الشوارع والدروب، وبقيت منه بقايا نحو عشرين يومًا. كيف يغيّر الثلج ما يفعله الناس في مدينة؟
    ur: ابن الجوزی المنتظم میں بتاتے ہیں کہ بغداد میں بدھ 11 ربیع الاول 398 کو برف پڑی، کہیں ایک ہاتھ اور کہیں ڈیڑھ ہاتھ گہری۔ وہ ایک ہفتہ نہ پگھلی، لوگوں نے اسے اپنی چھتوں سے بیلچوں سے گلیوں اور سڑکوں میں پھینکا، اور اس کے نشان تقریباً بیس دن رہے۔ برف شہر میں لوگوں کے کاموں کو کیسے بدل دیتی ہے؟
  entity: event/baghdad-great-snow-398
  sources:
