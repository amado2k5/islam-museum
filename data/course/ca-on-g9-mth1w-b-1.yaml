  title:
    ar: كتاب في الحساب بالأرقام الهندية
    en: A book on reckoning with the Indian numerals
    ur: ہندوستانی ہندسوں سے حساب پر ایک کتاب
  text:
    ar: ألّف محمد بن موسى الخوارزمي في بغداد كتاباً في الحساب بالأرقام الهندية التسعة والصفر في نظام عشري منزلي، دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي كما تذكر موسوعة TDV. ضاع أصله العربي، وبقيت ترجمة لاتينية من القرن الثاني عشر تبدأ بعبارة «Dixit Algorizmi»، أي «قال الخوارزمي». وصار اسمه اللاتيني «Algorismus» اسماً للأرقام نفسها، ومنه جاءت كلمة «algorithm». أي عدد تستعمله كل يوم له قصة تُروى؟
    en: Muhammad ibn Musa al-Khwarizmi wrote a book in Baghdad on reckoning with the nine Indian numerals and zero in a decimal place-value system, and TDV says the Indian numerals and the decimal system entered the Islamic world through it. Its Arabic original is lost, but a twelfth-century Latin translation survives that opens "Dixit Algorizmi", "al-Khwarizmi said". His Latin name "Algorismus" became a name for the numerals themselves, and from it comes "algorithm". Which number you use every day has a story to tell?
    ur: محمد بن موسیٰ خوارزمی نے بغداد میں ہندوستانی نو ہندسوں اور صفر کے ساتھ اعشاری مقامی قدر کے نظام میں حساب پر ایک کتاب لکھی، جس کے ذریعے، ٹی ڈی وی کے بیان کے مطابق، ہندوستانی ہندسے اور اعشاری نظام عالمِ اسلام میں داخل ہوئے۔ اس کا عربی اصل گم ہو گیا، مگر بارہویں صدی کا ایک لاطینی ترجمہ باقی ہے جو «Dixit Algorizmi» یعنی «خوارزمی نے کہا» سے شروع ہوتا ہے۔ ان کا لاطینی نام «Algorismus» خود ہندسوں کا نام بن گیا، اور اسی سے «algorithm» آیا۔ روزمرہ کے کس عدد کی کوئی کہانی ہے؟
