  title:
    en: Ibn Khaldun's three arguments
    ar: حجج ابن خلدون الثلاث
    ur: ابن خلدون کے تین دلائل
  text:
    en: "In the Muqaddima Ibn Khaldun argues against the philosophers. He holds that their attribution of existing things to the First Intellect falls short of what lies beyond it, that their universal mental proofs give no certainty about individuated external things, and that natural philosophy does not matter for religion or livelihood. The museum's record gives none of the philosophers' replies. Which argument is strongest?"
    ar: "يحتج ابن خلدون في «المقدمة» على الفلاسفة. ويرى أن إسنادهم الموجودات إلى العقل الأول قصور عما وراءه، وأن براهينهم الذهنية الكلية لا تفيد يقيناً في الموجودات الخارجية المتشخصة، وأن مسائل الطبيعيات لا تهم في دين ولا معاش. ولا يذكر سجل المتحف شيئاً من ردود الفلاسفة. أي الحجج أقواها؟"
    ur: "ابن خلدون «مقدمہ» میں فلسفیوں کے خلاف دلیل دیتے ہیں۔ ان کا خیال ہے کہ موجودات کو عقلِ اول کی طرف منسوب کرنا اس سے آگے کی چیزوں تک پہنچنے میں قاصر ہے، کہ ان کے کلی ذہنی براہین متشخص خارجی چیزوں میں یقین نہیں دیتے، اور یہ کہ طبیعیات کے مسائل نہ دین میں اہم ہیں نہ معاش میں۔ میوزیم کا ریکارڈ فلسفیوں کے کسی جواب کا ذکر نہیں کرتا۔ ان میں کون سی دلیل سب سے مضبوط ہے؟"
