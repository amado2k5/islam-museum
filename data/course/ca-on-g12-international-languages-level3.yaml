label:
  en: Grade 12 International Languages, Level 3, University Preparation, LBADU to LDYDU
  ar: اللغات الدولية، المستوى 3، إعداد جامعي، للصف الثاني عشر، LBADU إلى LDYDU
  ur: جماعت دوازدہم بین الاقوامی زبانیں، سطح 3، جامعہ کی تیاری، LBADU تا LDYDU
  es: "Idiomas internacionales de grado 12, nivel 3, preparación universitaria, LBADU a LDYDU"
  fr: "Langues internationales de 12e année, niveau 3, préparation universitaire, LBADU à LDYDU"
  tr: "Uluslararası Diller, Seviye 3, Üniversite Hazırlık, 12. Sınıf, LBADU'dan LDYDU'ya"
  id: "Bahasa Internasional, Tingkat 3, Persiapan Universitas, Kelas 12, LBADU hingga LDYDU"
summary:
  en: 'The Ontario Ministry''s generic Level 3 University Preparation course in international languages, taught for many languages, Arabic among them: four strands, Listening, Speaking, Reading and Writing. The museum serves only the expectations that ask for knowledge of the cultures and communities where the language is spoken.'
  ar: 'مقرر وزارة أونتاريو العام للغات الدولية، المستوى 3، إعداد جامعي، ويُدرَّس لكثير من اللغات ومنها العربية: أربعة محاور هي الاستماع والتحدث والقراءة والكتابة. ولا يخدم المتحف إلا التوقعات التي تطلب معرفة ثقافات الجماعات التي تُتحدَّث فيها اللغة.'
  ur: 'اونٹاریو کی وزارت کا بین الاقوامی زبانوں کا عمومی کورس، سطح 3، جامعہ کی تیاری، جو کئی زبانوں کے لیے پڑھایا جاتا ہے، عربی بھی ان میں ہے: چار شاخیں، سننا، بولنا، پڑھنا اور لکھنا۔ عجائب گھر صرف ان توقعات کو پورا کرتا ہے جو اس زبان کے بولنے والی جماعتوں کی ثقافتوں کے علم کا تقاضا کرتی ہیں۔'
  es: "El curso genérico de preparación universitaria de nivel 3 del Ministerio de Ontario en lenguas internacionales, impartido para varios idiomas, entre ellos el árabe, consta de cuatro áreas: comprensión auditiva, expresión oral, comprensión lectora y expresión escrita. El programa se centra exclusivamente en el conocimiento de las culturas y comunidades donde se habla el idioma."
  fr: "Le cours préparatoire universitaire de niveau 3 du ministère ontarien des Langues internationales, dispensé pour de nombreuses langues, dont l'arabe, comprend quatre volets: compréhension orale, expression orale, compréhension écrite et expression écrite. Le musée répond uniquement aux attentes qui exigent une connaissance des cultures et des communautés où la langue est parlée."
  tr: "Ontario Eğitim Bakanlığı'nın Uluslararası Diller Genel Kursu, Seviye 3, Üniversite Hazırlık programı, Arapça da dahil olmak üzere birçok dili öğretmekte ve dört alana odaklanmaktadır: dinleme, konuşma, okuma ve yazma. Ancak müze, dilin konuşulduğu toplulukların kültürlerini anlama beklentilerini karşılamaktadır."
  id: "Kursus Umum Bahasa Internasional Tingkat 3, Persiapan Universitas, dari Kementerian Pendidikan Ontario mengajarkan banyak bahasa, termasuk bahasa Arab, dan berfokus pada empat bidang: mendengarkan, berbicara, membaca, dan menulis. Namun, museum ini memenuhi harapan untuk memahami budaya komunitas tempat bahasa tersebut digunakan."
