  title:
    en: Leaves that become pattern
    ar: أوراق تصير نمطًا
    ur: پتے جو نقش بن جاتے ہیں
  text:
    en: Yeomans sees the genesis of the Islamic arabesque in Samarra style B, where leaves and palmettes become abstract, lose their stems and are organised into the surface geometry of polygons and polylobes. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. By what criteria would your class judge whether such a design works?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز سامراء الثاني، حيث تتجرد الأوراق والمراوح النخيلية وتفقد سيقانها وتنتظم في هندسة السطح من مضلعات ومتعددات الفصوص. وفي رأيه أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. وبأي معايير يحكم صفّك على نجاح تصميم كهذا؟
    ur: یومنز کے نزدیک اسلامی عربیسک کی پیدائش سامرا کے اسلوب ب میں دکھائی دیتی ہے، جہاں پتے اور کھجوری پنکھے تجریدی ہو جاتے ہیں، اپنی ڈنڈیاں کھو دیتے ہیں اور کثیر الاضلاع اور کثیر الفصوص شکلوں کی سطحی ہندسہ بندی میں منظم ہو جاتے ہیں۔ ان کی رائے میں نباتاتی عربیسک مخصوص انداز کا اور دو بعدی ہے اور سطح کا احترام کرتا ہے، برخلاف بند اور فطرت کی نقالی کی طرف مائل یونانی رومی آرائش کے۔ آپ کی جماعت کن معیاروں پر پرکھے گی کہ ایسا ڈیزائن کامیاب ہے؟
