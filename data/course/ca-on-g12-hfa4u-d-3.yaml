  title:
    en: Foods from modified animals
    ar: أغذية من حيوانات محورة
    ur: تبدیل شدہ جانوروں کی غذائیں
  text:
    en: 'The International Islamic Fiqh Academy defined genetically modified foods of animal origin as products from living animals whose genes were altered by genetic engineering, and noted aims such as increased resistance, better nutrition, faster growth or adaptation to particular environments. It permitted eating them on three conditions: safe methods that neither contravene the sharia nor harm health, modification between two animals lawful to eat, and disclosure of the necessary information. The museum records the text and issues no ruling. Which aims could affect supply?'
    ar: 'عرّف مجمع الفقه الإسلامي الدولي الأغذية المحورة وراثيًا من أصل حيواني بأنها منتجات تُستخلص من حيوانات حية عُدّلت مادتها الوراثية بالهندسة الجينية، وذكر أن غاية التحوير زيادة المقاومة وتحسين القيمة الغذائية وتسريع النمو أو التكيف مع بيئات معينة. وأباح استهلاكها بثلاثة شروط: أن يجري التحوير بطرق آمنة لا تخالف الشرع ولا تضر بالصحة، وأن يكون بين حيوانين يباح أكلهما، وأن يُفصح عن المعلومات اللازمة. ويسجّل المتحف النص ولا يُصدر فتوى. فأيّ غايات في قائمته قد تؤثر في الإمداد؟'
    ur: 'بین الاقوامی اسلامی فقہ اکیڈمی نے حیوانی اصل کی جینیاتی طور پر تبدیل شدہ غذاؤں کی تعریف یہ کی کہ وہ زندہ جانوروں سے حاصل کی گئی مصنوعات ہیں جن کا جینیاتی مواد جینیاتی انجینئرنگ سے بدلا گیا ہو، اور مقاصد بتائے جیسے مزاحمت میں اضافہ، غذائی قدر کی بہتری، تیز نشوونما یا مخصوص ماحول سے مطابقت۔ اس نے انہیں کھانے کی اجازت تین شرائط پر دی: محفوظ طریقے جو شریعت کے خلاف ہوں نہ صحت کو نقصان پہنچائیں، تبدیلی ایسے دو جانوروں کے درمیان ہو جنہیں کھانا جائز ہو، اور ضروری معلومات ظاہر کی جائیں۔ میوزیم متن درج کرتا ہے اور کوئی فتویٰ نہیں دیتا۔ اس کی فہرست کے کون سے مقاصد رسد پر اثر ڈال سکتے ہیں؟'
