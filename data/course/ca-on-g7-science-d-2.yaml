  title:
    en: An arch like an upturned boat
    ar: عقد كقارب مقلوب
    ur: الٹی کشتی جیسی محراب
  text:
    en: The keel arch is a pointed arch shaped like an upturned boat; it replaced the round arches of the first al-Azhar mosque. In the qibla-arcade dome of al-Azhar the dome rests on keel arches over antique columns braced by wooden tie-beams (timber beams that tie the columns together), which Yeomans sees as much lighter than the solid brick piers of Tulunid building. Which parts carry the weight here?
    ar: العقد المنكسر عقد مدبب على هيئة قارب مقلوب، حلّ محل العقود المستديرة في الجامع الأزهر الأول. وفي قبة رواق القبلة بالجامع الأزهر، من عهد الحافظ، تقوم القبة على عقود منكسرة فوق أعمدة قديمة تربطها روابط خشبية ⁦(عوارض من الخشب تشدّ الأعمدة بعضها إلى بعض)⁩؛ ويرى يومانز أنها أخف كثيراً من دعائم الآجر الطولونية الصلبة. فأي الأجزاء يحمل الثقل هنا؟
    ur: کشتی نما محراب ایک نوکدار محراب ہے جو الٹی کشتی کی شکل کی ہوتی ہے؛ اس نے پہلی جامع ازہر کی گول محرابوں کی جگہ لی۔ جامع ازہر کے قبلہ رواق کے گنبد میں گنبد قدیم ستونوں پر قائم کشتی نما محرابوں پر ٹکا ہے جنہیں لکڑی کی کڑیاں ⁦(لکڑی کے شہتیر جو ستونوں کو باہم باندھتے ہیں)⁩ باندھتی ہیں؛ یومانز کے نزدیک یہ طولونی ٹھوس اینٹ کے ستونوں سے کہیں ہلکی ہیں۔ یہاں وزن کون سے حصے اٹھاتے ہیں؟
  entity: concept/keel-arch
