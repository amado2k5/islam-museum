    en: A square room under a dome
    ar: غرفة مربعة مقببة
    ur: گنبد تلے مربع کمرہ
  text:
    en: The chahartaq is a square domed chamber rising on four crossing arches; from it came stellate vaults built over cruciform domed chambers. Is it a solid, a frame or a shell structure, and why?
    ar: الجهارطاق غرفة مربعة مقببة تقوم على تقاطع أربعة عقود، ومنها جاءت الأقبية النجمية المبنية على الغرف المقببة الصليبية. فهل هو منشأة صلبة أم هيكلية أم قشرية، ولماذا؟
    ur: چہار طاق چار باہم کٹتی محرابوں پر قائم مربع گنبد دار کمرہ ہے؛ اسی سے صلیبی گنبد دار کمروں پر بنی ستارہ نما محرابی چھتیں نکلیں۔ کیا یہ ٹھوس، فریم یا خول ڈھانچہ ہے، اور کیوں؟
  entity: concept/chahartaq
