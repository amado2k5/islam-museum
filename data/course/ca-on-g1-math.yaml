summary:
  en: 'The Ontario Grade 1 Mathematics course has six strands: social-emotional learning skills, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps parts of strands C and E only.'
  ar: 'لمقرر الرياضيات للصف الأول في منهاج أونتاريو ستة محاور: مهارات التعلم الاجتماعي العاطفي، والعدد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. ولا يربط المتحف إلا أجزاء من المحورين ج وهـ.'
  ur: 'اونٹاریو کے پہلی جماعت کی ریاضی کے کورس کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں، عدد، الجبر، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ میوزیم صرف محور ج اور ہ کے کچھ حصوں کو جوڑتا ہے۔'
  es: "El curso de Matemáticas de primer grado de Ontario consta de seis áreas temáticas: habilidades de aprendizaje socioemocional, Números, Álgebra, Datos, Percepción espacial y Alfabetización financiera. El mapa del museo abarca únicamente partes de las áreas C y E."
  fr: "Le programme de mathématiques de 1re année de l'Ontario comporte six volets: compétences socio-émotionnelles, nombres, algèbre, données, repérage spatial et littératie financière. Le musée ne cartographie que certaines parties des volets C et E."
  tr: "Ontario'daki birinci sınıf matematik müfredatı altı modülden oluşmaktadır: sosyal-duygusal öğrenme becerileri, sayılar, cebir, veri, mekansal farkındalık ve finansal okuryazarlık. Müze yalnızca C ve E modüllerinin bazı bölümlerini birbirine bağlamaktadır."
  id: "Kurikulum matematika kelas satu di Ontario memiliki enam modul: keterampilan belajar sosial-emosional, angka, aljabar, data, kesadaran spasial, dan literasi keuangan. Museum ini hanya menghubungkan sebagian dari modul C dan E."
