- position: within
  kind: reflection
  title:
    en: One God, no partner
    ar: إله واحد لا شريك له
    ur: ایک خدا، کوئی شریک نہیں
  text:
    en: 'Al-Tahawi opens his statement of the creed of the people of the Sunna and the Community with God''s oneness: ''We say of God''s oneness, believing by God''s guidance.'' He then lists the articles: God is one without partner, nothing is like Him, nothing overcomes Him, and there is no god but He. Which of these would you call a central tenet, and why?'
    ar: 'يفتتح الطحاوي بيان عقيدة أهل السنة والجماعة بالتوحيد فيقول: «نقول في توحيد الله معتقدين بتوفيق الله»، ثم يعدّد البنود: إن الله واحد لا شريك له، ولا شيء مثله، ولا شيء يعجزه، ولا إله غيره. أي هذه البنود تعدّه عقيدة محورية، ولماذا؟'
    ur: 'امام طحاوی اہلِ سنت و جماعت کے عقیدے کا بیان توحید سے شروع کرتے ہیں: «نقول في توحيد الله معتقدين بتوفيق الله»، یعنی ہم اللہ کی توحید کے بارے میں اللہ کی توفیق سے یقین رکھتے ہوئے کہتے ہیں۔ پھر وہ شقیں گنواتے ہیں: اللہ ایک ہے، اس کا کوئی شریک نہیں، کوئی چیز اس جیسی نہیں، کوئی چیز اسے عاجز نہیں کر سکتی اور اس کے سوا کوئی معبود نہیں۔ آپ ان میں سے کسے مرکزی عقیدہ کہیں گے اور کیوں؟'
  entity: concept/tawhid
  sources:
