- position: after
  kind: reflection
  title:
    en: Resurrection, reckoning and the Scale
    ar: البعث والحساب والميزان
    ur: حشر، حساب اور میزان
  text:
    en: 'Al-Tahawi''s creed lists the articles on the end: the resurrection, the requital of deeds on the Day of Resurrection, the reckoning, the reading of the book, the Sirat and the Scale. He says Paradise and the Fire are created and will never perish. How does a belief about the end show in what a community teaches about the present?'
    ar: 'يعدّد الطحاوي في عقيدته بنود الآخرة: البعث وجزاء الأعمال يوم القيامة والعرض والحساب وقراءة الكتاب والصراط والميزان، ويقول إن الجنة والنار مخلوقتان لا تفنيان أبدًا. كيف يظهر اعتقاد في النهاية فيما تعلّمه الجماعة عن الحاضر؟'
    ur: 'امام طحاوی اپنے عقیدے میں آخرت کی شقیں گنواتے ہیں: بعثت، قیامت کے دن اعمال کا بدلہ، پیشی، حساب، نامۂ اعمال کا پڑھا جانا، صراط اور میزان؛ اور وہ کہتے ہیں کہ جنت اور دوزخ پیدا کی جا چکی ہیں اور کبھی فنا نہ ہوں گی۔ انجام کے بارے میں عقیدہ جماعت کی حال کی تعلیم میں کیسے جھلکتا ہے؟'
  entity: concept/akhira
  sources:
