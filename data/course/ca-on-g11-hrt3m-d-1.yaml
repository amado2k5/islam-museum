  title:
    en: Five acts on which Islam is built
    ar: خمسة أعمال بُني عليها الإسلام
    ur: پانچ اعمال جن پر اسلام قائم ہے
  text:
    en: In the hadith narrated by Abdullah ibn Umar, as al-Bukhari gives it, Islam is built on the testimony that there is no god but God and that Muhammad is God's Messenger, establishing the prayer, giving zakat, the hajj and the fast of Ramadan. Ibn Rajab likens Islam to a building whose supports are these five. Which would you call the foundation of a believer's life?
    ar: في حديث عبد الله بن عمر عند البخاري بُني الإسلام على شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان. ويشبّه ابن رجب الإسلام ببناء دعائمه هذه الخمس. أيها تعدّه أساس حياة المؤمن؟
    ur: عبداللہ بن عمر کی حدیث میں، جیسا بخاری نے نقل کی، اسلام اس گواہی پر قائم ہے کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں، نیز نماز قائم کرنے، زکوٰۃ دینے، حج اور رمضان کے روزے پر۔ ابن رجب اسلام کو ایسی عمارت سے تشبیہ دیتے ہیں جس کے ستون یہی پانچ ہیں۔ آپ ان میں سے کسے مومن کی زندگی کی بنیاد کہیں گے؟
  entity: concept/five-pillars
