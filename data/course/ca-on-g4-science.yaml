summary:
  en: 'The 2022 Ontario Grade 4 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps four of them; Life Systems has no honest link.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف الرابع في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، ومنظومات الحياة، والمادة والطاقة، والمنشآت والآليات، ومنظومات الأرض والفضاء. ويربط المتحف أربعة منها؛ ولا صلة صادقة له بمنظومات الحياة.'
  ur: 'اونٹاریو نصاب 2022 کے چوتھی جماعت سائنس و ٹیکنالوجی کورس کے پانچ محور ہیں: STEM کی مہارتیں اور روابط، جاندار نظام، مادہ اور توانائی، ڈھانچے اور میکانزم، اور زمین اور خلا کے نظام۔ عجائب گھر ان میں سے چار کو جوڑتا ہے؛ جاندار نظام سے اس کا کوئی صادق ربط نہیں۔'
  es: "El curso de Ciencias y Tecnología de cuarto grado de Ontario de 2022 consta de cinco ejes temáticos: Habilidades y Conexiones STEM, Sistemas de la Vida, Materia y Energía, Estructuras y Mecanismos, y Sistemas Terrestres y Espaciales. El museo muestra cuatro de ellos; Sistemas de la Vida no tiene una relación directa."
  fr: "Le programme de sciences et technologie de 4e année de l'Ontario (2022) comprend cinq volets: compétences et liens en STIM, systèmes vivants, matière et énergie, structures et mécanismes, et systèmes Terre et espace. Le musée en présente quatre sur une carte; le volet « Systèmes vivants » n'a aucun lien direct avec le programme."
  tr: "Ontario'nun 2022 müfredatındaki 4. sınıf fen ve teknoloji dersinin beş ana teması vardır: STEM becerileri ve bağlantıları; yaşam sistemleri; madde ve enerji; yapılar ve mekanizmalar; ve Dünya ve uzay sistemleri. Müze bu temaların dördünü birbirine bağlıyor; ancak yaşam sistemleriyle gerçek bir bağlantısı yok."
  id: "Kurikulum sains dan teknologi kelas 4 dalam silabus Ontario 2022 memiliki lima tema utama: keterampilan STEM dan hubungannya; sistem kehidupan; materi dan energi; struktur dan mekanisme; dan sistem bumi dan ruang angkasa. Museum ini menghubungkan empat dari tema-tema tersebut; namun, museum ini tidak memiliki hubungan yang nyata dengan sistem kehidupan."
