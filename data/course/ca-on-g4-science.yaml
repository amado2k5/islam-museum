summary:
  en: 'The 2022 Ontario Grade 4 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps four of them; Life Systems has no honest link.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف الرابع في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، ومنظومات الحياة، والمادة والطاقة، والمنشآت والآليات، ومنظومات الأرض والفضاء. ويربط المتحف أربعة منها؛ ولا صلة صادقة له بمنظومات الحياة.'
  ur: 'اونٹاریو نصاب 2022 کے چوتھی جماعت سائنس و ٹیکنالوجی کورس کے پانچ محور ہیں: STEM کی مہارتیں اور روابط، جاندار نظام، مادہ اور توانائی، ڈھانچے اور میکانزم، اور زمین اور خلا کے نظام۔ عجائب گھر ان میں سے چار کو جوڑتا ہے؛ جاندار نظام سے اس کا کوئی صادق ربط نہیں۔'
