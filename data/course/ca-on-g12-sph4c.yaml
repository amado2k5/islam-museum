label:
  en: Grade 12 Physics, College Preparation (SPH4C)
  ar: الفيزياء SPH4C للصف الثاني عشر، الإعداد للكلية
  ur: جماعت دوازدہم طبیعیات، کالج کی تیاری SPH4C
  es: "Física de 12.º grado, preparación universitaria (SPH4C)"
  fr: "Physique de 12e année, préparation à l'université (SPH4C)"
summary:
  en: The Ontario Grade 12 college-preparation course Physics (SPH4C) has six strands. The museum maps four of them, with five lessons, through machines and instruments described by engineers and scholars of the Islamic world; the strands on motion, and on electricity and magnetism, have no honest link.
  ar: لمقرر الفيزياء SPH4C للصف الثاني عشر الإعدادي للكلية في أونتاريو ستة محاور. ويربط المتحف أربعة منها بخمسة دروس من خلال آلات وأدوات وصفها مهندسو العالم الإسلامي وعلماؤه؛ أما محورا الحركة، والكهرباء والمغناطيسية، فلا صلة صادقة له بهما.
  ur: اونٹاریو کے جماعت دوازدہم کے کالج کی تیاری کے کورس طبیعیات SPH4C کے چھ محور ہیں۔ عجائب گھر ان میں سے چار کو پانچ اسباق کے ساتھ ان مشینوں اور آلات کے ذریعے جوڑتا ہے جنہیں عالمِ اسلام کے انجینئروں اور علما نے بیان کیا؛ حرکت، اور بجلی و مقناطیسیت کے محوروں سے اس کا کوئی صادق ربط نہیں۔
  es: "El curso de Física de preparación universitaria de grado 12 de Ontario (SPH4C) tiene seis ejes temáticos. El museo ilustra cuatro de ellos, con cinco lecciones, a través de máquinas e instrumentos descritos por ingenieros y eruditos del mundo islámico; los ejes sobre movimiento, electricidad y magnetismo no tienen una relación directa."
  fr: "Le cours de physique préparatoire à l'université de 12e année en Ontario (SPH4C) comporte six volets. Le musée en présente quatre, à travers cinq leçons, concernant des machines et des instruments décrits par des ingénieurs et des érudits du monde islamique; les volets sur le mouvement, l'électricité et le magnétisme n'ont aucun lien direct avec le programme."
