summary:
  en: The Ontario Grade 12 college-preparation course Physics (SPH4C) has six strands. The museum maps four of them, with five lessons, through machines and instruments described by engineers and scholars of the Islamic world; the strands on motion, and on electricity and magnetism, have no honest link.
  ar: لمقرر الفيزياء SPH4C للصف الثاني عشر الإعدادي للكلية في أونتاريو ستة محاور. ويربط المتحف أربعة منها بخمسة دروس من خلال آلات وأدوات وصفها مهندسو العالم الإسلامي وعلماؤه؛ أما محورا الحركة، والكهرباء والمغناطيسية، فلا صلة صادقة له بهما.
  ur: اونٹاریو کے جماعت دوازدہم کے کالج کی تیاری کے کورس طبیعیات SPH4C کے چھ محور ہیں۔ عجائب گھر ان میں سے چار کو پانچ اسباق کے ساتھ ان مشینوں اور آلات کے ذریعے جوڑتا ہے جنہیں عالمِ اسلام کے انجینئروں اور علما نے بیان کیا؛ حرکت، اور بجلی و مقناطیسیت کے محوروں سے اس کا کوئی صادق ربط نہیں۔
