  title:
    en: Colours ground from minerals
    ar: ألوان تُطحن من المعادن
    ur: معدنوں سے پسے ہوئے رنگ
  text:
    en: 'Pigments in Persian painting were mostly mineral: the mineral was ground to a soft powder on a hard stone, sifted, washed and mixed with egg-white, glue or gum arabic, as Norah Titley describes. Blue came from lapis lazuli, lightened with ceruse white. Copper green, verdigris, is for Titley a conservationist''s nightmare, because the paper becomes brittle and drops out leaving a hole. These are historical materials, not for use in class. How did the painter''s choice of material shape the page?'
    ar: 'كانت الألوان في التصوير الفارسي معدنية في الغالب: يطحن المعدن ناعمًا على حجر صلب، ثم ينخل ويغسل ويخلط بزلال البيض أو الغراء أو الصمغ العربي، كما تصف نورا تيتلي. والأزرق يستخرج من اللازورد ويُفتّح بالإسفيداج. أما الأخضر المستخرج من النحاس، أي الزنجار، فصار عند تيتلي «كابوس المرممين» لأنه يجعل الورق هشًا فيسقط ويترك ثقبًا. هذه مواد تاريخية وليست للاستعمال في الصف. كيف شكّل اختيار المصوّر لمادته الصفحة؟'
    ur: 'فارسی مصوری میں رنگ زیادہ تر معدنی تھے: معدن کو سخت پتھر پر باریک پیسا جاتا، چھانا اور دھویا جاتا اور انڈے کی سفیدی، گوند یا گوندِ عربی میں ملایا جاتا تھا، جیسا کہ نورا ٹائٹلی بیان کرتی ہیں۔ نیلا رنگ لاجورد سے آتا اور سفیدے سے ہلکا کیا جاتا۔ تانبے سے بنا سبز رنگ، یعنی زنجار، ٹائٹلی کے نزدیک تحفظ کاروں کے لیے ڈراؤنا خواب ہے، کیونکہ کاغذ ٹوٹنے والا ہو کر گر جاتا اور سوراخ چھوڑ جاتا ہے۔ یہ تاریخی مواد ہیں، جماعت میں استعمال کے لیے نہیں۔ مصور کے مادے کے انتخاب نے صفحے کو کیسے شکل دی؟'
  entity: practice/persian-painting-pigments-and-gold
  sources:
  - source/titley-persian-miniature-painting-1983
- position: after
  kind: object
  title:
    en: Copying with a pricked outline
    ar: النقل بخط مثقوب
    ur: چھیدے ہوئے خاکے سے نقل
  text:
    en: 'Pouncing was a way of copying part of a composition: deerskin was laid over the original and its outline traced, the line pricked with a fine needle, then the pricked skin laid on the paper and charcoal dabbed on it from a mesh bag, leaving a guiding outline. Titley notes that styles of different schools and periods may occur in one late sixteenth-century manuscript. Which technique would you borrow to repeat a shape?'
    ar: 'كان النقل بالتثقيب طريقة لنقل تصويرة أو جزء من تكوين: يوضع جلد غزال شفاف على الأصل ويُرسم عليه خطه، ثم يثقب الخط بإبرة دقيقة، ثم يوضع الجلد المثقوب على الورق ويُذر عليه الفحم بكيس شبكي فينفذ من الثقوب ويرسم خطًا يهتدي به الناسخ. وتقول نورا تيتلي إن أساليب مدارس وعصور مختلفة قد تجتمع في مخطوطة واحدة من أواخر القرن السادس عشر. أي تقنية تستعير لتكرر شكلًا؟'
    ur: 'سوراخ دار خاکے سے نقل ایک تصویر یا ترکیب کے کسی حصے کو نقل کرنے کا طریقہ تھا: شفاف ہرن کی کھال اصل پر رکھ کر اس کا خاکہ اتارا جاتا، خاکے کو باریک سوئی سے چھیدا جاتا، پھر چھیدی ہوئی کھال کاغذ پر رکھ کر جالی دار تھیلی سے کوئلے کا سفوف چھڑکا جاتا جو سوراخوں سے گزر کر رہنما خاکہ چھوڑ دیتا۔ نورا ٹائٹلی کہتی ہیں کہ سولہویں صدی کے آخر کے ایک ہی مخطوطے میں مختلف مکاتب اور ادوار کے اسالیب جمع ہو سکتے ہیں۔ شکل کو دہرانے کے لیے آپ کون سی تکنیک مستعار لیں گے؟'
