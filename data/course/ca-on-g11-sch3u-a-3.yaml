expectations:
- code: A1.8
  text:
    en: synthesize, analyse, interpret, and evaluate qualitative and quantitative data; solve problems involving quantitative data; determine whether the evidence supports or refutes the initial prediction or hypothesis and whether it is consistent with scientific theory; identify sources of bias and error …
    ar: ادمج البيانات الكيفية والكمية وحلّلها وفسّرها وقيّمها؛ وحُلّ المسائل المتعلقة بالبيانات الكمية؛ وحدّد هل تؤيد الأدلة التنبؤ أو الفرضية الأولى أم تنفيها، وهل تتسق مع النظرية العلمية؛ وحدّد مصادر التحيز والخطأ …
    ur: کیفی اور مقداری اعداد و شمار کو یکجا کریں، ان کا تجزیہ کریں، ان کی تعبیر کریں اور انھیں پرکھیں؛ مقداری اعداد و شمار والے مسائل حل کریں؛ طے کریں کہ شواہد ابتدائی پیش گوئی یا مفروضے کی تائید کرتے ہیں یا تردید، اور آیا وہ سائنسی نظریے سے ہم آہنگ ہیں؛ جانب داری اور غلطی کے ماخذ کی نشاندہی کریں …
- code: A1.10
  text:
    en: draw conclusions based on inquiry results and research findings, and justify their conclusions with reference to scientific knowledge
    ar: استخلص النتائج مما أسفر عنه التحقيق وانتهى إليه البحث، وبرّر استنتاجاتك بالرجوع إلى المعرفة العلمية
    ur: تحقیق کے نتائج اور تحقیقی دریافتوں کی بنیاد پر نتائج اخذ کریں، اور اپنے نتائج کا جواز سائنسی علم کے حوالے سے پیش کریں
connections:
- position: before
  kind: invention
  title:
    en: What must be known before accepting an inference
    ar: ما ينبغي معرفته قبل قبول الاستنتاج
    ur: نتیجہ ماننے سے پہلے کیا جاننا ضروری ہے
  text:
    en: Seeing improvement after a substance is used does not, by itself, reveal what that substance did. In The Canon of Medicine, Ibn Sina sets out seven conditions for learning drug powers through experience. The record presents this as an organization of interpretive conditions within humoral medicine, not as a modern clinical-trial protocol. Which of your own results could be explained in more than one way?
    ar: لا تكفي مشاهدة تحسن بعد استعمال مادة لكي تُعرف حقيقة تأثيرها. ويرتب ابن سينا في القانون في الطب سبعة شروط لمعرفة قوى الأدوية بالتجربة. ويعرض السجل ذلك تنظيماً لشروط التفسير داخل طب الأمزجة، لا بروتوكول تجربة سريرية حديثة. أي نتائجك أنت يمكن أن تُفسَّر بأكثر من وجه؟
    ur: کسی مادے کے استعمال کے بعد بہتری دیکھ لینا بذاتِ خود یہ نہیں بتاتا کہ اس مادے نے کیا اثر کیا۔ ابنِ سینا القانون فی الطب میں تجربے کے ذریعے دواؤں کی قوتیں جاننے کی سات شرطیں ترتیب دیتے ہیں۔ اندراج اسے طبِ امزاج کے اندر تعبیر کی شرطوں کی تنظیم بتاتا ہے، نہ کہ جدید طبی آزمائش کا ضابطہ۔ آپ کے اپنے نتائج میں سے کون سے ایک سے زیادہ طریقوں سے سمجھائے جا سکتے ہیں؟
  entity: invention/ibn-sina-seven-drug-assessment-conditions
  sources:
