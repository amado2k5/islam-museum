- position: after
  kind: object
  title:
    en: Many ratios, no single test
    ar: نسب متعددة لا معيار واحد
    ur: کئی نسبتیں، کوئی ایک کسوٹی نہیں
  text:
    en: 'Plant-ash glass uses the ash of soda-rich plants as its flux instead of mineral natron, and by the tenth century it had become the dominant recipe of glassmaking in the Islamic world. Nadine Schibille proposes six chemical ratios that separate Egyptian, Levantine, Mesopotamian, Central Asian, Iberian and Sicilian glass. She stresses that no single criterion suffices: all must be used, both to exclude and to support an attribution. What would your data need before you drew a conclusion?'
    ar: زجاج رماد النباتات يستعمل رماد نباتات غنية بالصودا صاهراً بدل النطرون المعدني، وقد صار بحلول القرن العاشر الوصفة الغالبة في صناعة الزجاج بالعالم الإسلامي. وتقترح نادين شيبيل ست نسب كيميائية تفصل بين زجاج مصر والشام والعراق وآسيا الوسطى والأندلس وصقلية. وتؤكد أنه لا يكفي معيار واحد، بل يجب أن تؤخذ المعايير كلها نفياً وإثباتاً. ماذا تحتاج بياناتك قبل أن تستخلص نتيجة؟
    ur: پودوں کی راکھ والا شیشہ معدنی نطرون کی جگہ سوڈا سے بھرپور پودوں کی راکھ کو گداز کے طور پر استعمال کرتا ہے، اور دسویں صدی تک وہ اسلامی دنیا میں شیشہ سازی کا غالب نسخہ بن چکا تھا۔ نادین شیبیل چھ کیمیائی نسبتیں تجویز کرتی ہیں جو مصر، شام، عراق، وسطی ایشیا، اندلس اور صقلیہ کے شیشے کو الگ کرتی ہیں۔ وہ زور دیتی ہیں کہ کوئی ایک معیار کافی نہیں، سب کو استعمال کرنا چاہیے، نسبت دینے اور نسبت رد کرنے دونوں کے لیے۔ نتیجہ اخذ کرنے سے پہلے آپ کے اعداد و شمار کو کیا درکار ہوگا؟
