summary:
  en: 'The 2023 Ontario Grade 6 Social Studies course has two strands: Heritage and Identity: Communities in Canada, Past and Present, and People and Environments: Canada''s Interactions with the Global Community. The museum maps one lesson of strand A only.'
  ar: 'مقرر الدراسات الاجتماعية للصف السادس في منهاج أونتاريو 2023 له محوران: التراث والهوية: المجتمعات في كندا ماضيًا وحاضرًا، والناس والبيئات: تفاعلات كندا مع المجتمع العالمي. ولا يربط المتحف إلا درسًا واحدًا من المحور الأول.'
  ur: 'اونٹاریو کے 2023 کے نصاب میں جماعت ششم کی سماجی علوم کے دو محور ہیں: ورثہ اور شناخت: کینیڈا کی برادریاں، ماضی اور حال، اور لوگ اور ماحول: عالمی برادری کے ساتھ کینیڈا کے تعلقات۔ عجائب گھر صرف پہلے محور کا ایک سبق جوڑتا ہے۔'
  es: "El curso de Estudios Sociales de sexto grado de Ontario para 2023 consta de dos ejes temáticos: Patrimonio e identidad: Comunidades en Canadá, pasado y presente, y Personas y entornos: Interacciones de Canadá con la comunidad global. El mapa del museo incluye solo una lección del eje A."
  fr: "Le programme d'études sociales de 6e année de l'Ontario pour 2023 comporte deux volets: Patrimoine et identité: les communautés au Canada, hier et aujourd'hui, et Peuples et environnements: les interactions du Canada avec la communauté mondiale. Le musée présente une seule leçon du volet A."
  tr: "Ontario 2023'teki 6. Sınıf Sosyal Bilgiler müfredatının iki ana teması vardır: Miras ve Kimlik: Kanada'daki Topluluklar geçmişte ve bugün ve İnsanlar ve Çevreler: Kanada'nın küresel toplulukla etkileşimleri. Müze, ilk temanın yalnızca bir dersiyle bağlantılıdır."
  id: "Kurikulum Studi Sosial Kelas 6 di Ontario tahun 2023 memiliki dua tema utama: Warisan dan Identitas: Komunitas di Kanada masa lalu dan masa kini, dan Manusia dan Lingkungan: Interaksi Kanada dengan komunitas global. Museum ini hanya terkait dengan satu pelajaran dari tema pertama."
