summary:
  en: 'The 2023 Ontario Grade 2 Social Studies course has two strands: Heritage and Identity: Changing Family and Community Traditions, and People and Environments: Global Communities. The museum maps a few expectations of each strand.'
  ar: 'مقرر الدراسات الاجتماعية للصف الثاني في منهاج أونتاريو 2023 له محوران: التراث والهوية: تغيّر تقاليد الأسرة والمجتمع، والناس والبيئات: المجتمعات حول العالم. ويربط المتحف بعض توقعات كل محور.'
  ur: 'اونٹاریو کے 2023 کے نصاب میں جماعت دوم کے سماجی علوم کے کورس کے دو حصے ہیں: ورثہ اور شناخت: خاندان اور برادری کی بدلتی روایات، اور لوگ اور ماحول: دنیا بھر کی برادریاں۔ عجائب گھر ہر حصے کی چند توقعات کو جوڑتا ہے۔'
  es: "El curso de Estudios Sociales de segundo grado de Ontario para 2023 consta de dos ejes temáticos: Patrimonio e identidad: Tradiciones familiares y comunitarias en evolución, y Personas y entornos: Comunidades globales. El museo describe algunos de los objetivos de cada eje."
  fr: "Le programme d’études sociales de 2e année de l’Ontario pour 2023 comporte deux volets: Patrimoine et identité: Évolution des traditions familiales et communautaires, et Peuples et environnements: Communautés mondiales. Le musée présente quelques objectifs d’apprentissage pour chaque volet."
  tr: "Ontario'da 2023 yılında yürürlüğe giren 2. sınıf Sosyal Bilgiler müfredatının iki ana teması vardır: Miras ve Kimlik: Değişen Aile ve Toplum Gelenekleri ve İnsanlar ve Çevreler: Dünyanın Dört Bir Yanındaki Toplumlar. Müze, her temanın beklentilerinden bazılarını bir araya getiriyor."
  id: "Kurikulum Studi Sosial Kelas 2 di Ontario tahun 2023 memiliki dua tema utama: Warisan dan Identitas: Perubahan Tradisi Keluarga dan Komunitas, dan Manusia dan Lingkungan: Masyarakat di Seluruh Dunia. Museum ini menghubungkan beberapa harapan dari setiap tema tersebut."
