  title:
    en: A glaze that looks like porcelain
    ar: طلاء يشبه البورسلين
    ur: پورسلین جیسا لعاب
  text:
    en: The surface of Chinese porcelain could not be reproduced with a clear lead glaze over white slip, so the potters of Iraq mixed tin oxide into a modified lead glaze, making it opaque and white, which on a well-purified yellow or pinkish clay looked deceptively like porcelain. The ware is ninth-century Iraqi pottery. Which properties of clay and glaze mattered to them?
    ar: لم يكن ممكناً تقليد سطح البورسلين الصيني بطلاء رصاصي شفاف فوق بطانة بيضاء، فخلط خزافو العراق أكسيد القصدير بطلاء رصاصي معدّل فصار معتماً أبيض، فلما وُضع على طين أصفر أو وردي منقّى بدا شديد الشبه بالبورسلين. وهذا خزف عراقي من القرن التاسع. فأي خصائص في الطين والطلاء كانت تهمّهم؟
    ur: چینی پورسلین کی سطح کو سفید استر پر شفاف سیسے کے لعاب سے نقل کرنا ممکن نہ تھا، سو عراق کے کمہاروں نے ترمیم شدہ سیسے کے لعاب میں قلعی کا آکسائیڈ ملایا جس سے وہ مبہم سفید ہو گیا، اور صاف کی ہوئی زرد یا گلابی مٹی پر وہ دھوکا دینے کی حد تک پورسلین جیسا لگتا تھا۔ یہ نویں صدی کے عراق کے مٹی کے برتن ہیں۔ مٹی اور لعاب کی کون سی خصوصیات ان کے لیے اہم تھیں؟
