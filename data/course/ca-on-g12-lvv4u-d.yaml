expectations:
- code: D1
  text:
    en: demonstrate knowledge and understanding of the schools of classical philosophy and of classical contributions to the development of scientific inquiry
    ar: أظهر معرفة وفهمًا بمدارس الفلسفة الكلاسيكية وبإسهامات العالم الكلاسيكي في تطور البحث العلمي
