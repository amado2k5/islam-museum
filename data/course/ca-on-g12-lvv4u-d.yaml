- code: D3
  text:
    en: identify philosophical, scientific, and religious terminology in English derived from ancient Greek and Latin and use it correctly
    ar: تعرّف على المصطلحات الفلسفية والعلمية والدينية في الإنجليزية المشتقة من اليونانية القديمة واللاتينية، واستعملها استعمالًا صحيحًا
    ur: انگریزی کی وہ فلسفیانہ، سائنسی اور مذہبی اصطلاحات پہچانیں جو قدیم یونانی اور لاطینی سے ماخوذ ہیں، اور انہیں درست طور پر استعمال کریں
- code: D4
  text:
    en: describe how their learning about classical philosophy, science, and religion relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and their own experience
    ar: صف كيف يرتبط تعلّم الفلسفة الكلاسيكية والعلم والدين بفهمك لثقافات أخرى ومجالات دراسة أخرى وللعالم المعاصر ولتجربتك الخاصة، وكيف يعززه
    ur: بیان کریں کہ کلاسیکی فلسفے، سائنس اور مذہب کے بارے میں سیکھنا دیگر ثقافتوں اور مضامین، عصرِ حاضر اور اپنے تجربے کی سمجھ سے کیسے جڑتا اور اسے کیسے بڑھاتا ہے
