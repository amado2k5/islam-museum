- code: D2
  text:
    en: demonstrate knowledge and understanding of the diverse religions and religious rituals of the Graeco-Roman world
    ar: أظهر معرفة وفهمًا بالأديان المتنوعة وبالطقوس الدينية في العالم اليوناني الروماني
