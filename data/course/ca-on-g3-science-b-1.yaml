  title:
    en: Which water, which land?
    ar: أي ماء وأي أرض؟
    ur: کون سا پانی اور کون سی زمین؟
  text:
    en: In Al-Qasd wa-l-bayan, Ibn Bassal does not treat garden land as one substance needing the same water and work in every season. He distinguishes four water sources, among them rain, rivers, springs and wells, and ten practical land types, and relates what he observes to the season, the plants and the work the land needs. These are older descriptions, not modern laboratory measurements. Which of a plant's needs do his questions about water and land touch?
    ar: لا يعامل ابن بصال في «القصد والبيان» أرض البستان مادةً واحدة يصلح لها الماء والعمل نفسهما في كل فصل. فهو يميّز بين أربعة مصادر للماء، منها المطر والأنهار والعيون والآبار، وعشرة أنواع عملية من الأرض، ويربط ما يلاحظه بالموسم والنبات وما تحتاجه الأرض من عمل. وهذه أوصاف قديمة لا قياسات مخبرية حديثة. بأي حاجات للنبات تمسّ أسئلته عن الماء والأرض؟
    ur: «القصد والبیان» میں ابن بصال باغ کی زمین کو ایک ہی مادہ نہیں سمجھتے جسے ہر موسم میں یکساں پانی اور محنت چاہیے۔ وہ پانی کے چار ذرائع میں فرق کرتے ہیں، جن میں بارش، دریا، چشمے اور کنویں شامل ہیں، اور زمین کی دس عملی اقسام میں، اور جو دیکھتے ہیں اسے موسم، پودوں اور زمین کی ضرورت کی محنت سے جوڑتے ہیں۔ یہ پرانے بیانات ہیں، جدید لیبارٹری پیمائشیں نہیں۔ ان کے پانی اور زمین کے بارے میں سوال پودے کی کن ضرورتوں کو چھوتے ہیں؟
