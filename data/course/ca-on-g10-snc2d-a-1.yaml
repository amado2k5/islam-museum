  title:
    ar: ابن الهيثم وكتاب المناظر
    en: Ibn al-Haytham and the Book of Optics
    ur: ابن الہیثم اور کتاب المناظر
  text:
    ar: الحسن بن الهيثم عالم عربي في الرياضيات والفيزياء، اشتهر بكتابه «المناظر» في البصريات. ويصفه محقق طبعة الكتاب بأنه عاش في القرن الخامس الهجري. فأي عالم من علماء مقررك تضعه إلى جانبه؟
    en: Al-Hasan ibn al-Haytham was an Arab scholar of mathematics and physics, known for his Kitab al-Manazir on optics. The editor of the book's edition describes him as having lived in the fifth century AH. Which scientist of your own course would you set beside him?
    ur: حسن ابن الہیثم ریاضی اور طبیعیات کے ایک عرب عالم تھے، جو بصریات پر اپنی کتاب «المناظر» سے مشہور ہوئے۔ کتاب کے ایڈیشن کے محقق انہیں پانچویں صدی ہجری میں بیان کرتے ہیں۔ آپ کے اپنے کورس کا کون سا سائنس دان آپ کے نزدیک ان کے پہلو میں رکھا جا سکتا ہے؟
  entity: person/ibn-al-haytham
  sources:
