  title:
    ar: 'الطبيب: كيف كانت الحرفة تُتعلَّم'
    en: 'The physician: how the craft was learned'
    ur: 'طبیب: یہ فن کیسے سیکھا جاتا تھا'
  text:
    ar: الطبيب هو من يشخّص المرض ويعالجه بعلم الطب. وكان الطب في الدولة الإسلامية حرفة تُتعلَّم بالدراسة والتجربة والملازمة. ثم صار في العصر العباسي يُمنح بامتحان أمام رئيس الأطباء وإجازة. ماذا تطلب مهنة العلم من المتعلم اليوم؟
    en: The physician is the person who diagnoses illness and treats it by the science of medicine. In the Islamic states the craft was learned by study, practice and attachment to experienced practitioners. In the Abbasid period a practitioner was admitted after an examination before the head of physicians, who then issued a licence. What would a career in science ask of a learner today?
    ur: طبیب وہ ہے جو طب کے علم سے بیماری کی تشخیص اور علاج کرتا ہے۔ اسلامی ریاستوں میں یہ فن مطالعے، مشق اور تجربہ کار معالجوں کی صحبت سے سیکھا جاتا تھا۔ عباسی دور میں معالج کو رئیس الاطبا کے سامنے امتحان کے بعد داخلہ ملتا تھا، جو پھر اجازت نامہ جاری کرتا تھا۔ آج سائنس کے پیشے کو سیکھنے والے سے کیا مانگتا ہے؟
  entity: job/physician
  sources:
  - source/tdv-tip
  - source/tdv-hekimbasi
- position: after
  kind: career
  title:
    ar: شيخ الطب بالديار المصرية
    en: The shaykh of medicine in Egypt
    ur: مصر میں طب کا شیخ
  text:
    ar: تسمّي «شذرات الذهب» لابن العماد ابن النفيس شيخَ الطب بالديار المصرية، ومن انتهت إليه معرفة الطب، وتذكر أن له مشاركة في الفقه والأصول والحديث والعربية والمنطق. ألّف في الطب كتاب «الشامل» الذي تدل فهرسته على أنه يكون ثلثمائة مجلدة، ووقف أملاكه وكتبه على المارستان المنصوري. ما التدريب الذي تتطلبه مهنة في العلم؟
    en: Ibn al-Imad's Shadharat al-Dhahab calls Ibn al-Nafis the shaykh of medicine in Egypt, the one to whom knowledge of medicine ultimately led, and says he also took part in jurisprudence, the principles of law, hadith, Arabic and logic. He wrote the medical book al-Shamil, whose index suggests it would run to three hundred volumes, and he endowed his properties and his books to the Mansuri hospital. What training does a career in science ask?
    ur: ابن العماد کی «شذرات الذہب» ابن نفیس کو مصر میں طب کا شیخ کہتی ہے، وہ جن پر طب کا علم آ کر ختم ہوا، اور بتاتی ہے کہ وہ فقہ، اصول، حدیث، عربی اور منطق میں بھی شریک تھے۔ انہوں نے طب کی کتاب «الشامل» لکھی جس کی فہرست سے لگتا ہے کہ وہ تین سو جلدوں کی ہوتی، اور اپنی جائیدادیں اور کتابیں منصوری ہسپتال پر وقف کر دیں۔ سائنس کے کسی پیشے کے لیے کیسی تربیت درکار ہوتی ہے؟
  entity: person/ibn-al-nafis
  sources:
  - source/shadharat-dhahab
