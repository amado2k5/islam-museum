  title:
    en: The author of the Principles
    ar: صاحب الأصول
    ur: اصول کا مصنف
  text:
    en: Ibn al-Nadim counts Euclid among the mathematical philosophers, and as earlier than Archimedes and others. His book on the principles of geometry was translated twice by al-Hajjaj ibn Yusuf ibn Matar, the Ma'munian translation being the one on which people rely, and al-Mahani wrote a commentary on its fifth treatise. How does a field of inquiry stay alive after its founder?
    ar: يعدّه ابن النديم من الفلاسفة الرياضيين، وأقدم من أرشميدس وغيره. وكتابه في أصول الهندسة نقله الحجاج بن يوسف بن مطر نقلين، والمأموني منهما عليه يعوّل، وللماهاني شرح المقالة الخامسة. كيف يبقى ميدان من البحث حياً بعد مؤسسه؟
    ur: ابن ندیم انہیں ریاضی دان فلسفیوں میں شمار کرتے ہیں اور انہیں ارشمیدس وغیرہ سے پہلے کا بتاتے ہیں۔ ہندسے کے اصولوں پر ان کی کتاب کے حجاج بن یوسف بن مطر نے دو ترجمے کیے، اور اعتماد مامونی ترجمے پر کیا جاتا ہے، اور ماہانی نے اس کے پانچویں مقالے کی شرح لکھی۔ تحقیق کا کوئی میدان اپنے بانی کے بعد کیسے زندہ رہتا ہے؟
  entity: person/uqlidis
  sources:
  - source/fihrist-ibn-al-nadim
- position: within
  kind: scholar
  title:
    en: Books burned, books kept
    ar: كتب أُحرقت وكتب بقيت
    ur: جلی ہوئی کتابیں، بچی ہوئی کتابیں
  text:
    en: Ibn al-Nadim relates from a reliable source that the Byzantines burned fifteen loads of Archimedes' books. He lists those that survive, among them the book of the sphere and the cylinder, the book on squaring the circle, and the book on triangles. What can you learn about a scientist from the titles of his surviving books?
    ar: يروي ابن النديم عن ثقة أن الروم أحرقت من كتب أرشميدس خمسة عشر حملاً. ويعدد الموجود منها، ومنه كتاب الكرة والأسطوانة وكتاب تربيع الدائرة وكتاب المثلثات. ماذا تتعلم عن عالم من عناوين كتبه الباقية؟
    ur: ابن ندیم ایک قابلِ اعتماد شخص سے روایت کرتے ہیں کہ رومیوں نے ارشمیدس کی کتابوں میں سے پندرہ بوجھ جلا دیے۔ وہ موجود کتابوں کو شمار کرتے ہیں، جن میں «کرہ اور اسطوانہ» کی کتاب، «دائرے کا تربیع» کی کتاب اور «مثلثات» کی کتاب شامل ہیں۔ کسی سائنس دان کی باقی ماندہ کتابوں کے عنوانات سے آپ اس کے بارے میں کیا سیکھ سکتے ہیں؟
  entity: person/arshimidis
  sources:
  - source/fihrist-ibn-al-nadim
- position: after
  kind: scholar
  title:
    en: The heavens and the cities
    ar: السماء والمدن
    ur: آسمان اور شہر
  text:
    en: "Ptolemy is the author of the Almagest and the Geography. Al-Mas'udi writes that in the Geography he counted four thousand two hundred cities, and mentions him among the first who advanced in the sciences of the heavens before those who came after Islam. What would you need to check a count of four thousand two hundred cities?"
    ar: "بطليموس صاحب كتاب «المجسطي» وكتاب «الجغرافيا». ويذكر المسعودي أنه عدّ في الأخير أربعة آلاف ومائتي مدينة، ويذكره بين أوائل من تقدموا في علوم الهيئة قبل من جاء بعد الإسلام. ماذا تحتاج لتتحقق من إحصاء أربعة آلاف ومائتي مدينة؟"
    ur: "بطلیموس «المجسطی» اور «الجغرافیا» کے مصنف ہیں۔ مسعودی لکھتے ہیں کہ آخر الذکر کتاب میں انہوں نے چار ہزار دو سو شہروں کا شمار کیا ہے، اور وہ انہیں ان اولین لوگوں میں شمار کرتے ہیں جو اسلام کے بعد آنے والوں سے پہلے علمِ ہیئت میں آگے بڑھے۔ چار ہزار دو سو شہروں کی گنتی کو جانچنے کے لیے آپ کو کیا چاہیے ہوگا؟"
