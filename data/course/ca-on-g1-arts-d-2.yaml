  text:
    en: The record describes a turquoise ceramic bowl showing a lute player and his companion, from Iran in the late twelfth to early thirteenth century, held at the Metropolitan Museum of Art. Look at the picture on the bowl. What do the two figures seem to be doing?
    ar: يصف السجل قصعة خزفية فيروزية تصور عازف عود وجليسه، من إيران في أواخر القرن الثاني عشر إلى أوائل الثالث عشر الميلادي، وهي محفوظة في متحف المتروبوليتان للفن. انظر إلى الصورة على القصعة. ماذا يبدو أن الشخصين يفعلان؟
    ur: ریکارڈ فیروزی رنگ کا ایک سرامک پیالہ بیان کرتا ہے جس پر عود بجانے والا اور اس کا ساتھی دکھائے گئے ہیں؛ یہ ایران سے بارہویں صدی کے اواخر سے تیرہویں صدی کے اوائل کا ہے اور میٹروپولیٹن میوزیم آف آرٹ میں محفوظ ہے۔ پیالے پر بنی تصویر کو دیکھیں۔ دونوں شخصیات کیا کرتی نظر آتی ہیں؟
