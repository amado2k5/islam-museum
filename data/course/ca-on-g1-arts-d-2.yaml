  text:
    en: The record describes the Taj Mahal as a mausoleum in Agra built by Shah Jahan for his wife Mumtaz Mahal between 1632 and 1653, with a white marble dome above the Yamuna river, calligraphy and white marble inlay. Which parts of a famous building would you draw first?
    ar: 'يصف السجل تاج محل بأنه ضريح في آغرة بناه شاه جهان لزوجته ممتاز محل بين 1632 و1653م: قبّة رخامية بيضاء على نهر جمنا، وكتابة خطية وتطعيم بالرخام الأبيض. أي أجزاء بناء مشهور سترسم أولًا؟'
    ur: 'ریکارڈ تاج محل کو آگرہ کا ایک مقبرہ بتاتا ہے جسے شاہ جہاں نے اپنی بیوی ممتاز محل کے لیے 1632 اور 1653 عیسوی کے درمیان بنوایا: دریائے جمنا کے اوپر سفید سنگِ مرمر کا گنبد، خطاطی اور سفید سنگِ مرمر کی جڑاؤ۔ کسی مشہور عمارت کے کون سے حصے آپ پہلے بنائیں گے؟'
