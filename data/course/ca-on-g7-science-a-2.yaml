- position: after
  kind: invention
  title:
    en: A craft that moved to Baghdad
    ar: صنعة انتقلت إلى بغداد
    ur: ایک ہنر جو بغداد پہنچا
  text:
    en: 'Jonathan Bloom, in the Encyclopaedia Iranica, presents this as the story of moving a craft to a city, not inventing paper again: its Chinese origin precedes Islam by centuries, and Central Asia was part of its westward spread. Osman Ersoy attributes the proposal for a paper workshop in Baghdad in 178 AH/794–795 to al-Fadl ibn Yahya al-Barmaki; Jonathan Bloom supports manufacture there by the late eighth century without confirming that year or proposer. Whose work is each step?'
    ar: 'يعرض جوناثان بلوم في موسوعة إيرانيكا هذه القصة قصةَ انتقال صناعة إلى مدينة، لا اختراعاً جديداً للورق: فالأصل الصيني يسبق الإسلام بقرون، وكانت آسيا الوسطى محطة في انتشاره غرباً. ينسب عثمان أرصوي اقتراح مصنع للورق في بغداد سنة 178هـ/794–795م إلى الفضل بن يحيى البرمكي، ويؤيد جوناثان بلوم وجود الصناعة فيها بنهاية القرن الثامن دون أن يثبت مستقلاً هذا العام أو صاحب الاقتراح. فلمن يعود فضل كل خطوة؟'
    ur: 'جوناتھن بلوم انسائیکلوپیڈیا ایرانیکا میں اسے ایک ہنر کو شہر میں منتقل کرنے کی کہانی کے طور پر پیش کرتے ہیں، کاغذ کو دوبارہ ایجاد کرنے کی نہیں: اس کی چینی ابتدا اسلام سے کئی صدیاں پرانی ہے اور مغرب کی طرف اس کے پھیلاؤ میں وسطی ایشیا ایک مرحلہ تھا۔ عثمان ارسوئے بغداد میں 178ھ/794–795ء میں کاغذ کارخانے کی تجویز فضل بن یحییٰ برمکی سے منسوب کرتے ہیں، اور جوناتھن بلوم آٹھویں صدی کے آخر تک وہاں پیداوار کی تائید کرتے ہیں مگر اس سال یا تجویز کنندہ کی الگ تصدیق نہیں کرتے۔ ہر قدم کا سہرا کس کے سر ہے؟'
