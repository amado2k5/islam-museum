  title:
    en: Nine numerals and a zero
    ar: تسعة أرقام وصفر
    ur: نو ہندسے اور ایک صفر
  text:
    en: Algorism is a way of writing and working numbers with nine numerals and a zero, in which each place takes its value from its position. Muhammad ibn Musa al-Khwarizmi wrote a book on it in Baghdad, through which the Indian numerals and the decimal system entered the Islamic world. The numerals themselves are Indian, as their name says. Which community contributed what?
    ar: الحساب الهندي طريقة في كتابة الأعداد وحسابها بتسعة أرقام وصفر، تأخذ فيها كل خانة قيمتها من موضعها. ألّف فيها محمد بن موسى الخوارزمي في بغداد كتاباً دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي. والأرقام نفسها هندية كما يدل اسمها. فمن أسهم بماذا؟
    ur: ہندی حساب اعداد کو نو ہندسوں اور صفر سے لکھنے اور ان پر حساب کرنے کا طریقہ ہے، جس میں ہر خانہ اپنی قدر اپنے مقام سے لیتا ہے۔ محمد بن موسیٰ الخوارزمی نے بغداد میں اس پر ایک کتاب لکھی، جس کے ذریعے ہندی ہندسے اور اعشاری نظام اسلامی دنیا میں داخل ہوئے۔ ہندسے خود ہندی ہیں، جیسا کہ ان کا نام بتاتا ہے۔ کس برادری نے کیا حصہ ڈالا؟
  entity: invention/algorism
  sources:
