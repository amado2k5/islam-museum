  title:
    en: Writing for the gates of Cairo
    ar: كتابة لأبواب القاهرة
    ur: قاہرہ کے دروازوں کے لیے تحریر
  text:
    en: Bernard O'Kane's chapter follows kufic inscriptions in stone, stucco and wood in Fatimid Cairo, ending with the Aqmar Mosque facade of 519/1125–6, the most comprehensive scheme of facade inscriptions to that date. On Badr al-Jamali's gates, he notes, the vizier's titles take much more space than those of the caliph al-Mustansir, “a nod to the real holder of power”. Who is a monument's writing addressed to?
    ar: يتتبع فصل برنارد أوكين الكتابات الكوفية على الحجر والجص والخشب في القاهرة الفاطمية، وينتهي بواجهة جامع الأقمر سنة 519هـ/1125–1126م بوصفها أشمل برنامج كتابي على واجهة حتى ذلك الحين. ويلاحظ أن نقوش أبواب بدر الجمالي تعطي ألقابه مساحة أكبر بكثير من ألقاب الخليفة المستنصر، «إيماءً إلى صاحب السلطة الفعلية». إلى من تتوجه كتابة النصب؟
    ur: برنارڈ او کین کا باب فاطمی قاہرہ میں پتھر، گچ اور لکڑی پر کوفی کتبوں کا سراغ لگاتا ہے اور 519ھ / 1125–1126ء کی جامع اقمر کی سامنے کی دیوار پر ختم ہوتا ہے، جسے وہ اس وقت تک سامنے کی دیوار کے کتبوں کا سب سے جامع منصوبہ کہتے ہیں۔ وہ نوٹ کرتے ہیں کہ بدر الجمالی کے دروازوں پر وزیر کے القاب کو خلیفہ المستنصر کے القاب سے کہیں زیادہ جگہ ملتی ہے، «حقیقی اقتدار والے کی طرف اشارہ»۔ کسی یادگار کی تحریر کس سے مخاطب ہوتی ہے؟
