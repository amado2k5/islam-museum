- position: within
  kind: story
  title:
    en: A message on a coin
    ar: رسالة على نقد
    ur: سکے پر ایک پیغام
  text:
    en: 'The booklet published in Doha defines propaganda coins as those put into circulation either officially by the sultan or ruler for the occasion they were struck for, or unofficially by others according to their political stance toward the state. Their form was not fixed: a text, an image, a mark or a symbol. One example is a Ghurid coin of 597 AH with the motto “God is most high”. What message can a coin carry, and to whom?'
    ar: يعرّف كتيب «المسكوكات الإسلامية» الصادر في الدوحة المسكوكاتِ الإعلامية بأنها نقود كانت تُطرح للتداول إما رسميًا من قبل السلطان أو الحاكم في المناسبة التي ضُربت من أجلها، وإما بطريقة غير رسمية من قبل الخاصة أو العامة بحسب موقفهم السياسي من الدولة. ولم يقيد شكلها طابع معين، فقد تظهر نصًا أو صورة أو علامة أو رمزًا. ومن أمثلتها نقد غوري سنة 597هـ عليه شعار «الله أعلى». أي رسالة يحملها النقد، ولمن؟
    ur: 'دوحہ میں شائع ہونے والا کتابچہ تشہیری سکوں کی تعریف یوں کرتا ہے کہ وہ سکے جو یا تو سلطان یا حاکم کی طرف سے اس موقع پر سرکاری طور پر جاری ہوتے جس کے لیے ڈھالے گئے، یا دوسروں کی طرف سے غیر سرکاری طور پر ریاست کے بارے میں ان کے سیاسی موقف کے مطابق۔ ان کی شکل مقرر نہ تھی: متن، تصویر، نشان یا علامت۔ ایک مثال 597ھ کا غوری سکہ ہے جس پر شعار «اللہ اعلیٰ» ہے۔ سکہ کیا پیغام اٹھا سکتا ہے، اور کس کے لیے؟'
