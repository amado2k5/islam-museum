  title:
    en: One script, many uses
    ar: خط واحد، استعمالات كثيرة
    ur: ایک خط، کئی استعمال
  text:
    en: Maryam Ekhtiar describes kufic as a family of angular scripts governed by geometric proportion. It replaced hijazi as the preferred script for copying the Qur'an until about the mid- to late tenth century. The earliest dinars, dated 76 AH, bear Qur'anic verses in an early formal kufic, and the inscription around the Dome of the Rock, 72 AH, is a dated architectural example. What jobs can one script do?
    ar: تصف مريم اختيار الخط الكوفي بأنه فئة من الخطوط الزاوية، وأنه اتبع قواعد دقيقة لحروف موزونة ذات تناسب هندسي. وقد حلّ محل الخط الحجازي في نسخ المصاحف، وبقي كذلك إلى أواسط القرن العاشر الميلادي أو أواخره تقريبًا. وأقدم الدنانير المؤرخة سنة 76هـ/696–697م تحمل آيات بصورة مبكرة منه، ومن أمثلته المعمارية المؤرخة نقش رواق قبة الصخرة سنة 72هـ/691–692م. ماذا يمكن أن يؤدي خط واحد من وظائف؟
    ur: مریم اختیار کوفی کو زاویہ دار خطوں کا ایک گروہ بتاتی ہیں جو ہندسی تناسب کے مطابق ہے۔ اس نے قرآن کی نقل کے لیے حجازی کی جگہ لی اور تقریباً دسویں صدی کے وسط یا اواخر تک اسی کام کے لیے ترجیحی رہا۔ 76ھ / 696–697ء کے سب سے قدیم دینار اس کی ابتدائی رسمی صورت میں آیات رکھتے ہیں، اور قبۃ الصخرہ کے گرد کا کتبہ، 72ھ / 691–692ء، اس کی ایک تاریخ دار تعمیراتی مثال ہے۔ ایک خط کیا کیا کام کر سکتا ہے؟
  entity: concept/kufic-script
