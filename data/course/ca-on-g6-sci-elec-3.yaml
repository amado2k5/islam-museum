  kind: story
  title:
    en: The puzzling pot of Baghdad
    ar: جرة بغداد المحيرة
    ur: 'بغداد کا پراسرار مرتبان'
  text:
    en: 'A small clay jar found near Baghdad — copper cylinder, iron rod, bitumen stopper — has been claimed as a 2,000-year-old battery. Archaeologists doubt it: it may simply have held scrolls. The claim
      is famous, the evidence thin — a good lesson in labelling what we don''t know.'
    ar: 'ادّعى البعض أن جرة فخارية صغيرة وجدت قرب بغداد — أسطوانة نحاسية وقضيب حديد وسدادة قار — بطارية عمرها ألفا عام. لكن علماء الآثار يشكون: فقد تكون وعاءً للفائف لا أكثر. الادعاء شهير والدليل ضعيف —
      وهذا درس نافع في تعليم ما لا نعرف.'
    ur: 'بغداد کے قریب ملا ایک چھوٹا مٹی کا مرتبان — تانبے کا سلنڈر، لوہے کی چھڑ، رال کی سٹپر — جسے کچھ لوگوں نے 2000 سال پرانی بیٹری کہا۔ ماہرین آثار قدیمہ شک کرتے ہیں: شاید یہ صرف لٹو رکھنے کا برتن تھا۔ دعویٰ مشہور ہے، ثبوت کمزور — ان چیزوں کو پہچاننے کا سبق جو ہم نہیں جانتے۔'
  sources:
  - source/hill-1993
- position: after
  kind: reflection
  title:
    en: Transformed, not created
    ar: تتحول ولا تُخلق
    ur: 'تبدیل ہوتی ہے، پیدا نہیں'
  text:
    en: 'Students learn that energy is never made, only moved. For a believer, that is also a statement about the Creator: humans transform; they do not originate.'
    ar: 'يتعلم الطلاب أن الطاقة لا تُصنع بل تُنقل فقط. وللمؤمن في ذلك معنى عن الخالق أيضًا: البشر يحوّلون ولا يبدعون من عدم.'
    ur: 'طلبہ سیکھتے ہیں کہ توانائی کبھی بنائی نہیں جاتی، صرف منتقل ہوتی ہے۔ مومن کے لیے یہ خالق کے بارے میں بھی ایک بات ہے: انسان تبدیل کرتے ہیں، عدم سے نہیں بناتے۔'
  sources:
  - source/hill-1993
