  title:
    en: The puzzling pot of Baghdad
    ar: جرة بغداد المحيرة
  text:
    en: 'A small clay jar found near Baghdad — copper cylinder, iron rod, bitumen stopper — has been claimed as a 2,000-year-old battery. Archaeologists doubt it: it may simply have held scrolls. The claim
      is famous, the evidence thin — a good lesson in labelling what we don''t know.'
    ar: 'ادّعى البعض أن جرة فخارية صغيرة وجدت قرب بغداد — أسطوانة نحاسية وقضيب حديد وسدادة قار — بطارية عمرها ألفا عام. لكن علماء الآثار يشكون: فقد تكون وعاءً للفائف لا أكثر. الادعاء شهير والدليل ضعيف —
      وهذا درس نافع في تعليم ما لا نعرف.'
