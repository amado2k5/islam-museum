summary:
  en: 'The Ontario Grade 11 course Philosophy: The Big Questions has four strands, from research skills to the relevance of philosophy. The museum maps eight expectations, in three strands, through the thinkers and debates of the Islamic world.'
  ar: 'مقرر «الفلسفة: الأسئلة الكبرى» للصف الحادي عشر في أونتاريو له أربعة محاور، من مهارات البحث إلى صلة الفلسفة بالحياة. ويربط المتحف ثماني توقعات في ثلاثة محاور من خلال مفكري العالم الإسلامي ونقاشاته.'
  ur: 'اونٹاریو کے جماعت یازدہم کے کورس «فلسفہ: بڑے سوالات» کی چار شاخیں ہیں، تحقیقی مہارتوں سے فلسفے کی معنویت تک۔ میوزیم ان میں سے آٹھ توقعات کو، تین شاخوں میں، عالمِ اسلام کے مفکرین اور مباحث کے ذریعے جوڑتا ہے۔'
  es: "El curso de Filosofía: Las Grandes Preguntas para el undécimo grado en Ontario consta de cuatro ejes temáticos, desde habilidades de investigación hasta la relevancia de la filosofía. El museo presenta ocho objetivos, divididos en tres ejes temáticos, a través de los pensadores y debates del mundo islámico."
  fr: "Le cours de philosophie de 11e année en Ontario, intitulé « Les grandes questions », comporte quatre volets, allant des compétences en recherche à la pertinence de la philosophie. Le musée, quant à lui, met en perspective huit attentes, réparties en trois volets, à travers les penseurs et les débats du monde islamique."
  tr: "Ontario'daki 11. Sınıf Felsefe: Büyük Sorular dersinin dört ana teması vardır; bunlar araştırma becerilerinden felsefe ve yaşam arasındaki bağlantıya kadar uzanır. Müze, İslam dünyasından düşünürler ve onların tartışmaları aracılığıyla üç tema üzerinden sekiz beklentiyi bir araya getiriyor."
  id: "Kursus Filsafat Kelas 11: Pertanyaan-Pertanyaan Besar di Ontario memiliki empat tema utama, mulai dari keterampilan penelitian hingga hubungan antara filsafat dan kehidupan. Museum ini menghubungkan delapan harapan di tiga tema melalui para pemikir dari dunia Islam dan perdebatan mereka."
