  title:
    en: Nursing, maintenance and weaning
    ar: الإرضاع والنفقة والفصال
    ur: دودھ پلانا، نفقہ اور دودھ چھڑانا
  text:
    en: In his commentary on the nursing verse (al-Baqara 2:233), Sha'rawi treats the period of suckling, the child's claim on both parents, and the duty of maintenance, which he places on the father. He reads weaning as a matter for mutual consent and consultation, and holds that the verse protects the child from the effects of divorce. Read the verse in the museum's text. Who, in this account, is responsible for the infant's feeding?
    ar: يعرض الشعراوي في تفسير آية الرضاع ⁦(البقرة 233)⁩ مدة الرضاعة وحقّ الرضيع على أبويه، ويجعل النفقة على الأب، ويعالج الفِصال بالتراضي والتشاور. ويرى أن الآية تحمي الطفل من أثر الطلاق. اقرأ الآية من نص المتحف. فمن المسؤول في هذا العرض عن تغذية الرضيع؟
    ur: شعراوی نے دودھ پلانے کی آیت ⁦(البقرۃ 233)⁩ کی تفسیر میں رضاعت کی مدت، بچے کا دونوں والدین پر حق اور نفقے کی ذمہ داری بیان کی ہے، جسے وہ باپ پر رکھتے ہیں۔ وہ دودھ چھڑانے کو باہمی رضامندی اور مشورے کا معاملہ سمجھتے ہیں، اور ان کی رائے ہے کہ آیت بچے کو طلاق کے اثر سے بچاتی ہے۔ آیت کو میوزیم کے متن میں پڑھیں۔ اس بیان میں شیر خوار کی خوراک کا ذمہ دار کون ہے؟
  entity: concept/breastfeeding-and-weaning
