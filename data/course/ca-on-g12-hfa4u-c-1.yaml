- position: after
  kind: reflection
  title:
    en: Fasting while pregnant or nursing
    ar: صيام الحامل والمرضع
    ur: حمل اور رضاعت میں روزہ
  text:
    en: Jordan's General Iftaa Department answered that, in its view, fasting is obligatory for a pregnant or nursing woman, but if she fears harm that cannot normally be borne, to herself or to herself and the child, she breaks the fast and only makes it up. If she fears for the child alone she also owes the fidya, feeding one poor person for each day. The museum records this as a document and issues no ruling. The text does not say who judges whether harm is feared. What is being weighed against the fast?
    ar: أجابت دائرة الإفتاء العام الأردنية بأن الصيام، في رأيها، يجب على الحامل والمرضع، لكن إن خافتا على أنفسهما، أو على أنفسهما مع الولد، ضررًا لا يُحتمل عادة أفطرتا وعليهما القضاء فقط. وإن كان الفطر خوفًا على الجنين أو الطفل وحده وجبت الفدية مع القضاء، وهي إطعام مسكين عن كل يوم. ويسجّل المتحف هذا النص وثيقةً ولا يُصدر فتوى. ولا يذكر النص من يقدّر وقوع الضرر المخوف. فما الذي يُوزن في مقابل الصيام؟
    ur: اردن کے دارالافتاء العام نے جواب دیا کہ اس کی رائے میں حاملہ اور دودھ پلانے والی پر روزہ واجب ہے، لیکن اگر وہ اپنے لیے، یا اپنے اور بچے کے لیے، ایسے نقصان سے ڈریں جو عام طور پر برداشت نہیں ہوتا تو روزہ چھوڑ دیں اور صرف قضا کریں۔ اگر ڈر صرف جنین یا بچے کا ہو تو قضا کے ساتھ فدیہ بھی لازم ہے، یعنی ہر دن کے بدلے ایک مسکین کو کھانا کھلانا۔ میوزیم اسے ایک دستاویز کے طور پر درج کرتا ہے اور کوئی فتویٰ نہیں دیتا۔ متن یہ نہیں بتاتا کہ خوف کیے گئے نقصان کا فیصلہ کون کرے۔ روزے کے مقابل کیا تولا جا رہا ہے؟
