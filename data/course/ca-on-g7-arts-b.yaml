expectations:
- code: B1
  text:
    en: apply the creative process to process drama and the development of drama works, using the elements and conventions of drama to communicate feelings, ideas, and multiple perspectives
    ar: طبِّق عملية الإبداع على الدراما العملية وتطوير الأعمال الدرامية، مستخدمًا عناصر الدراما وأعرافها للتعبير عن المشاعر والأفكار ووجهات النظر المتعددة
    ur: تخلیقی عمل کو عملی ڈرامے اور ڈرامائی کاموں کی تشکیل پر لاگو کریں، ڈرامے کے عناصر اور روایات کو جذبات، خیالات اور متعدد نقطہ ہائے نظر بیان کرنے کے لیے استعمال کرتے ہوئے
- code: B2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of drama works and experiences
    ar: طبِّق عملية التحليل النقدي للتعبير عن المشاعر والأفكار والفهم استجابةً لمجموعة متنوعة من الأعمال والتجارب الدرامية
    ur: ڈرامے کے مختلف کاموں اور تجربات کے جواب میں جذبات، خیالات اور فہم کے اظہار کے لیے تنقیدی تجزیے کا عمل لاگو کریں
- code: B3
  text:
    en: demonstrate an understanding of a variety of drama and theatre forms, traditions, and styles from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لمجموعة متنوعة من أشكال الدراما والمسرح وتقاليدهما وأساليبهما من الماضي والحاضر، وسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کے ڈرامے اور تھیٹر کی اشکال، روایات اور اسالیب، اور ان کے سماجی، ثقافتی اور تاریخی سیاق و سباق کی ایک وسیع قسم کو سمجھنے کا مظاہرہ کریں
