expectations:
- code: D1
  text:
    en: apply the creative process to produce a variety of two- and three-dimensional art works, using elements, principles, and techniques of visual arts to communicate feelings, ideas, and understandings
    ar: طبِّق عملية الإبداع لإنتاج مجموعة متنوعة من الأعمال الفنية ثنائية وثلاثية الأبعاد، مستخدمًا عناصر الفنون البصرية ومبادئها وتقنياتها للتعبير عن المشاعر والأفكار والفهم
    ur: بصری فنون کے عناصر، اصولوں اور تکنیکوں کو استعمال کرتے ہوئے جذبات، خیالات اور فہم کے اظہار کے لیے دو اور تین جہتی فن پاروں کی ایک وسیع قسم تیار کرنے کے لیے تخلیقی عمل لاگو کریں
- code: D2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of art works and art experiences
    ar: طبِّق عملية التحليل النقدي للتعبير عن مشاعرهم وأفكارهم وفهمهم استجابةً لمجموعة متنوعة من الأعمال الفنية والتجارب الفنية
    ur: فن پاروں اور فنی تجربات کی ایک وسیع قسم کے جواب میں اپنے جذبات، خیالات اور فہم کے اظہار کے لیے تنقیدی تجزیے کا عمل لاگو کریں
- code: D3
  text:
    en: demonstrate an understanding of a variety of art forms, styles, and techniques from the past and present, and their social and/or community contexts
    ar: أظهر فهمًا لمجموعة متنوعة من الأشكال والأساليب والتقنيات الفنية من الماضي والحاضر، وسياقاتها الاجتماعية و/أو المجتمعية
    ur: ماضی اور حال کی فنی اشکال، اسالیب اور تکنیکوں کی ایک وسیع قسم، اور ان کے سماجی اور/یا برادری کے سیاق و سباق کو سمجھنے کا مظاہرہ کریں
