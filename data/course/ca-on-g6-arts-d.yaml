expectations:
- code: D1
  text:
    en: apply the creative process to produce art works in a variety of traditional two- and three-dimensional forms, as well as multimedia art works, that communicate feelings, ideas, and understandings, using elements, principles, and techniques of visual arts as well as …
    ar: طبّق عملية الإبداع لإنتاج أعمال فنية بأشكال تقليدية متنوعة ثنائية وثلاثية الأبعاد، وكذلك أعمال الوسائط المتعددة، تعبّر عن المشاعر والأفكار والفهم، مستخدمًا عناصر الفنون البصرية ومبادئها وتقنياتها وتقنيات الوسائط الحالية
    ur: تخلیقی عمل کو بروئے کار لا کر دو بعدی اور سہ بعدی روایتی اشکال کے ساتھ ساتھ ملٹی میڈیا فن پارے تخلیق کریں جو احساسات، خیالات اور سمجھ کا ابلاغ کریں، بصری فنون کے عناصر، اصول اور تکنیکوں کے ساتھ موجودہ ذرائع ابلاغ کی ٹیکنالوجی استعمال کرتے ہوئے
- code: D2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of art works and art experiences
    ar: طبّق عملية التحليل النقدي ليعبّر عن المشاعر والأفكار والفهم استجابةً لتنوّع من الأعمال الفنية والتجارب الفنية
    ur: تنقیدی تجزیے کا عمل بروئے کار لا کر مختلف فن پاروں اور فنی تجربات کے جواب میں احساسات، خیالات اور سمجھ کا اظہار کریں
- code: D3
  text:
    en: demonstrate an understanding of a variety of art forms, styles, and techniques from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لتنوّع من الأشكال الفنية والأساليب والتقنيات من الماضي والحاضر وسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کے فنی اشکال، اسالیب اور تکنیکوں اور ان کے سماجی، ثقافتی اور تاریخی سیاق کی سمجھ کا مظاہرہ کریں
