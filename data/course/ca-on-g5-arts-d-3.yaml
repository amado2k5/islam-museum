connections:
- position: within
  kind: invention
  title:
    en: Decoration that frames the Qur'an
    ar: زخرفة تحيط بالمصحف
    ur: قرآن کو گھیرنے والی آرائش
  text:
    en: Norah Titley traces the origin of illumination to the simple decoration of vowel marks and of the circles separating verses in Qur'ans written by Arab calligraphers in the seventh and eighth centuries. By the fourteenth century ornate palmettes and sunbursts decorated the borders of Qur'ans, and the arabesque had become inseparable from Islamic decoration. How does decoration come to say something about the book it frames?
    ar: تقول نورا تيتلي إن أصل التذهيب الزخرفة البسيطة لعلامات الشكل والدوائر الفاصلة بين الآيات في المصاحف التي كتبها الخطاطون العرب في القرنين السابع والثامن. وبحلول القرن الرابع عشر زينت حواشي المصاحف المراوح النخيلية والشموس، وصار التوريق جزءًا لا ينفصل عن الزخرفة الإسلامية. كيف تقول الزخرفة شيئًا عن الكتاب الذي تحيط به؟
    ur: نورا ٹائٹلی کے مطابق تذہیب کی اصل عرب خطاطوں کے لکھے ہوئے ساتویں اور آٹھویں صدی کے قرآنی نسخوں میں اعراب کی علامتوں اور آیتوں کو جدا کرنے والے دائروں کی سادہ آرائش ہے۔ چودھویں صدی تک قرآنی نسخوں کے حاشیے آراستہ کھجوری پنکھوں اور شمسوں سے سجنے لگے اور عربیسک اسلامی آرائش سے جدا نہ ہو سکنے والا حصہ بن گیا۔ آرائش اس کتاب کے بارے میں کیسے کچھ کہنے لگتی ہے جسے وہ گھیرتی ہے؟
  entity: practice/manuscript-illumination-tazhib
  sources:
  - source/titley-persian-miniature-painting-1983
- position: after
  kind: object
  title:
    en: A script on coins, on a dome, then on headings
    ar: خط على النقود وقبة ثم العناوين
    ur: سکوں، گنبد اور پھر عنوانوں پر ایک خط
  text:
    en: Maryam Ekhtiar writes that the earliest dinars, dated 76 AH/696–97 CE, bear Qur'anic verses in an early formal kufic, and that a dated architectural example is the inscription around the ambulatory of the Dome of the Rock, 72 AH/691–92 CE. She adds that once the new style and the rounded scripts took over, kufic was confined to ornament such as sura headings. What does a script's changing place tell you about its time?
    ar: تذكر مريم اختيار أن أقدم الدنانير المؤرخة سنة 76هـ/696–697م تحمل آيات بصورة مبكرة من الخط الكوفي، وأن من أمثلته المعمارية المؤرخة نقش رواق قبة الصخرة سنة 72هـ/691–692م. وتضيف أنه مع ظهور الخط الجديد والخطوط المستديرة انحصر الكوفي في الزخرفة كعناوين السور. ماذا يخبرك تغيّر موضع الخط عن زمنه؟
    ur: مریم اختیار لکھتی ہیں کہ سب سے قدیم مؤرخ دینار، سن 76ھ/696–697ء کے، کوفی خط کی ابتدائی صورت میں قرآنی آیات رکھتے ہیں، اور اس کی ایک مؤرخ تعمیراتی مثال قبۃ الصخرہ کے گرد برآمدے کا کتبہ ہے، سن 72ھ/691–692ء۔ وہ مزید لکھتی ہیں کہ جب نیا اسلوب اور گول خط چھا گئے تو کوفی آرائش تک محدود رہ گیا، جیسے سورتوں کے عنوان۔ کسی خط کی بدلتی جگہ اس کے زمانے کے بارے میں آپ کو کیا بتاتی ہے؟
  entity: concept/kufic-script
  sources:
