  ur: 'اونٹاریو نصاب کے چوتھی جماعت کے فنون کورس کے چار محور ہیں: رقص، ڈراما، موسیقی اور بصری فنون۔ عجائب گھر ان میں سے ایک کو دو اسباق سے جوڑتا ہے؛ رقص، ڈرامے اور موسیقی سے اس کا کوئی صادق ربط نہیں۔'
