summary:
  en: 'The Ontario Grade 4 Arts course has four strands: Dance, Drama, Music and Visual Arts. The museum maps one of them with two lessons; Dance, Drama and Music have no honest link.'
  ar: 'لمقرر الفنون للصف الرابع في منهاج أونتاريو أربعة محاور: الرقص والدراما والموسيقى والفنون البصرية. ويربط المتحف واحدًا منها بدرسين؛ ولا صلة صادقة له بمحاور الرقص والدراما والموسيقى.'
  ur: 'اونٹاریو نصاب کے چوتھی جماعت کے فنون کورس کے چار محور ہیں: رقص، ڈراما، موسیقی اور بصری فنون۔ عجائب گھر ان میں سے ایک کو دو اسباق سے جوڑتا ہے؛ رقص، ڈرامے اور موسیقی سے اس کا کوئی صادق ربط نہیں۔'
  es: "El curso de Artes de cuarto grado de Ontario tiene cuatro áreas temáticas: Danza, Teatro, Música y Artes Visuales. El museo relaciona una de ellas con dos lecciones; Danza, Teatro y Música no tienen una conexión clara."
  fr: "Le programme d'arts de 4e année en Ontario comprend quatre volets: danse, théâtre, musique et arts visuels. Le musée n'en aborde qu'un seul avec deux leçons; or, la danse, le théâtre et la musique n'ont aucun lien direct."
