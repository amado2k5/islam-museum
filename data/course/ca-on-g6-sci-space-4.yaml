expectations:
- code: E1.1
  text:
    en: analyse the impact that conditions in space have on humans engaged in space exploration, and explain how humans meet their social, emotional, and physiological needs in space
    ar: حلِّل أثر الظروف في الفضاء في البشر العاملين في استكشافه، واشرح كيف يلبّي البشر حاجاتهم الاجتماعية والعاطفية والفسيولوجية في الفضاء
    ur: خلا کی تلاش میں مصروف انسانوں پر خلا کے حالات کے اثر کا تجزیہ کریں، اور وضاحت کریں کہ انسان خلا میں اپنی سماجی، جذباتی اور جسمانی ضرورتیں کیسے پوری کرتے ہیں
- code: E1.2
  text:
    en: assess the role of space exploration technology in observing and understanding environmental changes on Earth, including climate change
    ar: قيِّم دور تقنية استكشاف الفضاء في رصد التغيرات البيئية على الأرض وفهمها، ومنها تغيّر المناخ
    ur: زمین پر ماحولیاتی تبدیلیوں، بشمول موسمیاتی تبدیلی، کو دیکھنے اور سمجھنے میں خلائی تلاش کی ٹیکنالوجی کے کردار کا جائزہ لیں
- code: E2.6
  text:
    en: identify various technologies used in space exploration, and describe how technological innovations have contributed to our understanding of space
    ar: حدِّد تقنيات متنوعة تُستعمل في استكشاف الفضاء، وصِف كيف أسهمت الابتكارات التقنية في فهمنا للفضاء
    ur: خلائی تلاش میں استعمال ہونے والی مختلف ٹیکنالوجیز کی شناخت کریں، اور بیان کریں کہ تکنیکی جدتوں نے خلا کی ہماری سمجھ میں کیسے حصہ ڈالا
connections:
- position: before
  kind: invention
  title:
    en: One disc for many latitudes
    ar: قرص واحد لعروض كثيرة
    ur: کئی عرض بلد کے لیے ایک قرص
  text:
    en: In 11th-century Toledo, Ibrahim ibn Yahya al-Zarqali developed an astronomical plate that did not require a replacement horizon plate whenever the observer changed latitude. The plate is a geometrical representation of the sky on a disc, with lines for moving between coordinate systems and a ruler representing the horizon. It was an improvement within the astrolabe tradition. What did one disc for many latitudes make easier?
    ar: 'في طليطلة في القرن الحادي عشر طور إبراهيم بن يحيى الزرقالي صفيحة فلكية لا تستلزم تبديل صفيحة الأفق كلما تغير عرض الراصد. والصفيحة تمثيل هندسي للسماء على قرص: تحمل خطوطاً تساعد في الانتقال بين طرق مختلفة لتعيين موضع جرم سماوي، ومعها مسطرة تمثل الأفق. وهي تطوير للأسطرلاب. ما الذي يسهّله قرص واحد لعروض كثيرة؟'
    ur: گیارہویں صدی کے طلیطلہ میں ابراہیم بن یحییٰ الزرقالی نے ایک فلکی تختی تیار کی جس میں دیکھنے والے کا عرض بلد بدلنے پر افق کی تختی بدلنے کی ضرورت نہیں تھی۔ یہ تختی ایک قرص پر آسمان کی ہندسی نمائندگی ہے، جس میں آسمانی جرم کی جگہ متعین کرنے کے مختلف طریقوں کے درمیان منتقل ہونے کے لیے خطوط ہیں اور افق کی نمائندگی کرنے والا ایک پیمانہ ہے۔ یہ اسطرلاب کی روایت کے اندر ایک بہتری تھی۔ کئی عرض بلد کے لیے ایک ہی قرص نے کیا آسان کیا؟
