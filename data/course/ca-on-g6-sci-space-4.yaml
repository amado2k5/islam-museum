  title:
    en: Looking at the Moon and the Earth from above
    ar: النظر إلى القمر والأرض من فوق
    ur: اوپر سے چاند اور زمین کو دیکھنا
  text:
    en: According to the English Wikipedia article, from 1986 Farouk El-Baz used satellite images to study the origin and evolution of desert landforms, and he is credited with providing evidence that the desert is not man-made but the result of major climatic variations. In the Apollo programme he pored over detailed photographs of the Moon's surface to select the most precise landing locations. What can an image taken from above show that a person on the ground cannot?
    ar: استخدم الباز منذ 1986 صور الأقمار الصناعية لدراسة نشأة الأشكال الأرضية الصحراوية وتطورها، ويُنسب إليه تقديم الدليل على أن الصحراء ليست من صنع الإنسان بل نتيجة تغيرات مناخية كبرى. وفي برنامج أبولو بدأ عمله بتمحيص صور مفصلة لسطح القمر، وهي خطوة في اختيار أدق موقع هبوط. ماذا تُظهر صورة من الأعلى مما لا يراه شخص على الأرض؟
    ur: انگریزی ویکیپیڈیا کے مضمون کے مطابق فاروق الباز نے 1986ء سے صحرائی زمینی شکلوں کی ابتدا اور ارتقا کے مطالعے کے لیے سیٹلائٹ تصاویر استعمال کیں، اور ان سے یہ ثبوت پیش کرنے کی نسبت کی جاتی ہے کہ صحرا انسان کا بنایا ہوا نہیں بلکہ بڑی موسمی تبدیلیوں کا نتیجہ ہے۔ اپولو پروگرام میں انہوں نے چاند کی سطح کی تفصیلی تصاویر کو کھنگال کر سب سے درست لینڈنگ مقام چننے کی راہ ہموار کی۔ اوپر سے لی گئی تصویر کیا دکھا سکتی ہے جو زمین پر کھڑا شخص نہیں دیکھ سکتا؟
