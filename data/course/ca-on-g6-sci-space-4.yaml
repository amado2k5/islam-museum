- position: after
  kind: story
  title:
    en: Eid aboard the station
    ar: العيد على متن المحطة
    ur: اسٹیشن پر عید
  text:
    en: Sheikh Muszaphar Shukor flew to the International Space Station in October 2007. For his flight Malaysia's National Fatwa Council drew up a guidebook for Muslims in space, addressing how to pray in a low-gravity environment, how to locate Mecca from the station, and fasting in an orbit with a day/night cycle every ninety minutes. He celebrated Eid al-Fitr aboard the station and shared satay and cookies with the crew. What else does a crew need besides air and food?
    ar: طار شيخ مظفر شكور إلى محطة الفضاء الدولية في أكتوبر 2007. وأصدر مجلس الفتوى الوطني الماليزي دليلاً للمسلمين في الفضاء، تناول كيفية الصلاة في بيئة منخفضة الجاذبية، وتحديد اتجاه مكة من المحطة، وقضايا الصيام في مدار تتكرر فيه دورة الليل والنهار كل تسعين دقيقة. واحتفل بعيد الفطر على متن المحطة، وشارك طاقمها الساتاي والبسكويت. أيّ حاجات للطاقم تخطط لها غير الهواء والطعام؟
    ur: شیخ مظفر شکور اکتوبر 2007ء میں بین الاقوامی خلائی اسٹیشن گئے۔ ملائیشیا کی قومی فتویٰ کونسل نے ان کی پرواز کے لیے خلا میں مسلمانوں کا ایک رہنما کتابچہ تیار کیا، جس میں کم کششِ ثقل کے ماحول میں نماز پڑھنے، اسٹیشن سے مکہ کی سمت معلوم کرنے، اور ایسے مدار میں روزے کے مسائل کا ذکر تھا جس میں ہر نوے منٹ بعد دن رات کا چکر دہراتا ہے۔ انہوں نے اسٹیشن پر عیدالفطر منائی اور عملے کے ساتھ ساتے اور بسکٹ بانٹے۔ ہوا اور خوراک کے علاوہ عملے کی کون سی ضرورتوں کا آپ منصوبہ بنائیں گے؟
