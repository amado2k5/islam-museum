  title:
    en: The first Muslim in orbit
    ar: أول مسلم في المدار
    ur: 'مدار میں پہلا مسلمان'
  text:
    en: 'In June 1985, Prince Sultan bin Salman flew on the space shuttle Discovery — the first Muslim and first Arab in space. From orbit he joined a live call where a question of faith came up: how do
      you face Mecca from space? Scholars had already written answers.'
    ar: 'في يونيو 1985 طار الأمير سلطان بن سلمان على مكوك ديسكفري — أول مسلم وأول عربي في الفضاء. ومن المدار شارك في اتصال حيّ طُرح فيه سؤال إيماني: كيف تستقبل القبلة من الفضاء؟ وكان العلماء قد كتبوا الأجوبة
      سلفًا.'
    ur: 'جون 1985ء میں شہزادہ سلطان بن سلمان خلائی شٹل ڈسکوری پر اڑے — فضا میں پہلا مسلمان اور پہلا عرب۔ مدار سے ایک براہ راست کال میں دینی سوال اٹھا: فضا سے قبلہ کیسے پاؤ؟ علماء پہلے ہی جواب لکھ چکے تھے۔'
  entity: person/sultan-bin-salman-al-saud
  sources:
  - source/hourani-1991
- position: after
  kind: quran
  title:
    en: A permission and a challenge
    ar: إذن وتحدٍّ
    ur: 'اجازت اور چیلنج'
  text:
    en: 'O company of jinn and men, if you can pass beyond the regions of heaven and earth, then pass — you cannot pass except by authority (55:33). Verse as launch licence: exploration is framed as both
      permitted and demanding.'
    ar: 'يا معشر الجن والإنس إن استطعتم أن تنفذوا من أقطار السماوات والأرض فانفذوا؛ لا تنفذون إلا بسلطان (55:33). آية كأنها رخصة إطلاق: الاستكشاف مباح ومطلوب معًا.'
    ur: 'اے جن و انس کی جماعت! اگر تم زمین و آسمانوں کے کناروں سے نکل سکتے ہو تو نکلو — تم سلطان کے بغیر نہیں نکل سکتے (55:33)۔ آیت جیسے اڑان کی اجازت نامہ: تلاش جائز بھی ہے اور مشکل بھی۔'
  ref: '55:33'
