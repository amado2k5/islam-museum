expectations:
- code: D1
  text:
    en: apply the creative process to produce a variety of two- and three-dimensional art works, using elements, principles, and techniques of visual arts to communicate feelings, ideas, and understandings
    ar: طبّق العملية الإبداعية لإنتاج مجموعة متنوعة من الأعمال الفنية ثنائية الأبعاد وثلاثية الأبعاد، مستخدمًا عناصر الفنون البصرية ومبادئها وتقنياتها للتعبير عن المشاعر والأفكار والفهم
    ur: دو اور تین جہتی فن پاروں کی ایک وسیع قسم تیار کرنے میں تخلیقی عمل کو بروئے کار لائیں، اور احساسات، خیالات اور فہم کے اظہار کے لیے بصری فنون کے عناصر، اصولوں اور تکنیکوں کو استعمال کریں
- code: D2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of art works and art experiences
    ar: طبّق عملية التحليل النقدي للتعبير عن المشاعر والأفكار والفهم استجابةً لمجموعة متنوعة من الأعمال الفنية والتجارب الفنية
    ur: فن پاروں اور فنی تجربات کی ایک وسیع قسم کے جواب میں احساسات، خیالات اور فہم کے اظہار کے لیے تنقیدی تجزیے کا عمل بروئے کار لائیں
- code: D3
  text:
    en: demonstrate an understanding of a variety of art forms, styles, and techniques from the past and present, and their social and/or community contexts
    ar: أظهِر فهمًا لمجموعة متنوعة من الأشكال الفنية وأساليبها وتقنياتها من الماضي والحاضر، وسياقاتها الاجتماعية و/أو المجتمعية
    ur: فنون کی مختلف شکلوں، اسلوبوں اور تکنیکوں کو ماضی اور حال سے، اور ان کے سماجی اور/یا معاشرتی سیاق کے ساتھ سمجھنے کا مظاہرہ کریں
