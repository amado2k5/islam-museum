  title:
    en: The dot, the mistar and the template
    ar: النقطة والمسطر والقالب
    ur: نقطہ، مسطر اور سانچا
  text:
    en: 'The TDV entry on calligraphy says letters are measured in units of a dot, the diamond or square the pen makes when its full width touches the paper, and lines are set with a ruler called the mistar. For large work the master made a template, kalip: the outlines of the letters pricked with a needle through several sheets, then dusted with charcoal or chalk. Which of these terms would you use for your own tools?'
    ar: 'يقول مدخل موسوعة TDV عن الخط إن الحرف يُقاس بوحدة النقطة، وهي شكل معيّن أو مربع يرسمه القلم بكامل فوهته على الورق، وإن الأسطر تُضبط بأداة تُسمى «المِسطر». وللعمل الكبير ينشئ الأستاذ «القالب»: تُثقب الحروف بإبرة على طول حدودها في أكثر من طبقة من الورق، ثم يُنفض السطح بالفحم أو بالطباشير. أي هذه الألفاظ ستستعمل لأدواتك أنت؟'
    ur: 'خط پر ٹی ڈی وی کا اندراج کہتا ہے کہ حرف کی پیمائش نقطے کی اکائی میں ہوتی ہے، یعنی وہ معین یا مربع شکل جو قلم اپنی پوری چوڑائی کے ساتھ کاغذ کو چھوتے ہوئے بناتا ہے، اور سطریں «مسطر» نامی پیمانے سے جمائی جاتی ہیں۔ بڑے کام کے لیے استاد «قالب» ⁦(سانچا)⁩ بناتا تھا: حروف کی حدود سوئی سے کئی ورقوں میں چھیدی جاتی تھیں، پھر سطح پر کوئلہ یا چاک چھڑکا جاتا تھا۔ ان میں سے کون سے الفاظ آپ اپنے اوزاروں کے لیے استعمال کریں گے؟'
