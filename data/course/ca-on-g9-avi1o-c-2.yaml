  title:
    en: Pricked skin and charcoal
    ar: جلد مثقوب وفحم
    ur: سوراخ دار کھال اور کوئلہ
  text:
    en: 'Pouncing is described as a way of copying a composition: transparent deerskin was laid over the original and its outline traced, the line closely pricked with a fine needle, then the pricked skin laid on the paper and charcoal dabbed on it from a mesh bag, leaving a guiding outline. Mughal artists used pouncing too, and stencils were widely used for border designs. Which of these terms names a tool, a material or a step?'
    ar: 'النقل بالتثقيب طريقة لنقل تصويرة أو جزء من تكوين: يوضع جلد غزال شفاف على الأصل ويُرسم عليه خطه، ثم يثقب الخط بإبرة دقيقة، ثم يوضع الجلد المثقوب على الورق ويُذر عليه الفحم بكيس شبكي فينفذ من الثقوب ويرسم خطًا يهتدي به الناسخ. واستعمل مصورو الهند المغولية التثقيب أيضًا، واستعملت الأستنسلات كثيرًا لزخارف الحواشي. أي هذه الألفاظ يسمّي أداة أو مادة أو خطوة؟'
    ur: 'سوراخ دار خاکے سے نقل ایک تصویر یا ترکیب کے حصے کی نقل کا طریقہ بیان کیا گیا ہے: شفاف ہرن کی کھال اصل پر رکھی جاتی اور اس کی لکیر اتاری جاتی، لکیر پر باریک سوئی سے گھنے سوراخ کیے جاتے، پھر سوراخ دار کھال کاغذ پر رکھ کر جالی دار تھیلی سے اس پر کوئلہ چھڑکا جاتا جو سوراخوں سے گزر کر رہنما خاکہ چھوڑ دیتا۔ مغل ہندوستان کے مصوروں نے بھی یہ طریقہ برتا، اور حاشیوں کے نقش کے لیے اسٹینسل عام استعمال ہوتے تھے۔ ان میں سے کون سا لفظ اوزار کا نام ہے، کون سا مواد کا، اور کون سا مرحلے کا؟'
  entity: practice/pouncing-in-persian-painting
