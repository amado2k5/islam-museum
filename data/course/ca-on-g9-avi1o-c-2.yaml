  title:
    en: Cut tile, lustre and mina'i
    ar: القاشاني المقطوع والبريق والمينائي
    ur: کٹے ٹائل، چمک اور مینائی
  text:
    en: The TDV entry on the potter names techniques with their own terms. Cut tile mosaic uses turquoise, purple, green and cobalt glazes cut to shape and set in plaster. The Seljuks developed lustre, in which the design was painted with a silver or copper oxide mixture and fired again at low heat. The mina'i technique paints seven colours over a fired glaze and fires them again. Which term would you add to your own studio vocabulary?
    ar: يسمّي مدخل موسوعة TDV عن الخزاف تقنيات بمصطلحاتها. ففسيفساء القاشاني المقطوعة تقوم على طلاءات بالفيروزي والأرجواني والأخضر والأزرق الكوبالتي تُقص وتُثبت بالجص. وطوّر السلاجقة البريق المعدني، فرُسم النقش بخليط من أكسيد الفضة أو النحاس وشُوي ثانية بحرارة منخفضة. وأما المينائي فبسبعة ألوان تُرسم فوق طلاء مشوي ثم يُعاد شيّها. أي لفظ ستضيفه إلى مفردات مشغلك؟
    ur: کمہار پر ٹی ڈی وی کا اندراج تکنیکوں کو ان کے اپنے الفاظ سے نام دیتا ہے۔ کٹے ہوئے ٹائل کی موزائیک میں فیروزی، ارغوانی، سبز اور کوبالٹ نیلے شیشے کی تہیں ہیں جنہیں ناپ پر کاٹ کر گچ میں جڑا جاتا ہے۔ سلجوقیوں نے دھاتی چمک ایجاد کی، جس میں نقش چاندی یا تانبے کے آکسائیڈ کے مرکب سے بنایا جاتا اور کم حرارت پر دوبارہ پکایا جاتا۔ مینائی تکنیک میں پکی ہوئی تہہ پر سات رنگ بنائے جاتے اور دوبارہ پکائے جاتے ہیں۔ ان میں سے کون سا لفظ آپ اپنے اسٹوڈیو کی لغت میں شامل کریں گے؟
