  title:
    en: Nine numerals and a zero
    ar: تسعة أرقام وصفر
    ur: نو ہندسے اور ایک صفر
  text:
    en: 'The record describes reckoning with nine Indian numerals and a zero, in which each place takes its value from its position: units, then tens, then hundreds, then thousands. It adds that al-Khwarizmi wrote a book on it in Baghdad, through which the Indian numerals and the decimal system entered the Islamic world. How does a digit''s place change what it is worth?'
    ar: 'يصف السجل الحساب بتسعة أرقام هندية وصفر، تأخذ فيه كل خانة قيمتها من موضعها: آحاد ثم عشرات ثم مئات ثم ألوف. ويضيف أن الخوارزمي ألّف فيه كتاباً في بغداد دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي. كيف يغيّر موضع الرقم قيمته؟'
    ur: 'ریکارڈ نو ہندی ہندسوں اور ایک صفر سے حساب کا طریقہ بیان کرتا ہے، جس میں ہر خانہ اپنی قیمت اپنے مقام سے لیتا ہے: اکائیاں، پھر دہائیاں، پھر سینکڑے، پھر ہزار۔ وہ مزید بتاتا ہے کہ خوارزمی نے بغداد میں اس پر ایک کتاب لکھی جس کے ذریعے ہندی ہندسے اور اعشاری نظام عالمِ اسلام میں داخل ہوئے۔ ہندسے کا مقام اس کی قیمت کو کیسے بدلتا ہے؟'
