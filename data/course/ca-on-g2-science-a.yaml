expectations:
- code: A1
  text:
    en: use a scientific research process, a scientific experimentation process, and an engineering design process to conduct investigations, following appropriate health and safety procedures
    ar: استخدم عملية بحث علمي وعملية تجريب علمي وعملية تصميم هندسي لإجراء استقصاءات، مع اتباع إجراءات الصحة والسلامة المناسبة
    ur: تحقیقات کرنے کے لیے سائنسی تحقیق کا عمل، سائنسی تجربے کا عمل اور انجینئری ڈیزائن کا عمل استعمال کریں، اور صحت و حفاظت کے مناسب طریقوں پر عمل کریں
- code: A2
  text:
    en: use coding in investigations and to model concepts, and assess the impact of coding and of emerging technologies on everyday life
    ar: استخدم البرمجة في الاستقصاءات وفي نمذجة المفاهيم، وقيّم أثر البرمجة والتقنيات الناشئة في الحياة اليومية
    ur: تحقیقات میں اور تصورات کے نمونے بنانے میں کوڈنگ استعمال کریں، اور روزمرہ زندگی پر کوڈنگ اور ابھرتی ٹیکنالوجیز کے اثرات کا جائزہ لیں
- code: A3
  text:
    en: demonstrate an understanding of the practical applications of science and technology, and of contributions to science and technology from people with diverse lived experiences
    ar: أظهر فهمًا للتطبيقات العملية للعلوم والتكنولوجيا ولإسهامات أصحاب التجارب الحياتية المتنوعة فيهما
    ur: سائنس اور ٹیکنالوجی کے عملی استعمالات اور متنوع زندہ تجربات رکھنے والے لوگوں کی ان میں خدمات کی سمجھ کا مظاہرہ کریں
