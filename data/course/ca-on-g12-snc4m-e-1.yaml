  title:
    en: The plague of Amwas
    ar: طاعون عمواس
    ur: طاعونِ عمواس
  text:
    en: Al-Baladhuri, in Futuh al-Buldan, reports that the plague of Amwas was in 18 AH and that many Muslims died in it. Among them was Abu Ubayda ibn al-Jarrah, who was the commander and was fifty-eight years old, and Muadh ibn Jabal, who died at thirty-eight. How does one epidemic change who leads a community?
    ar: يذكر البلاذري في «فتوح البلدان» أن طاعون عمواس كان سنة 18هـ، وأنه مات فيه خلق من المسلمين. منهم أبو عبيدة بن الجراح، وكان أميرًا وله ثمان وخمسون سنة، ومعاذ بن جبل، توفي وله ثمان وثلاثون سنة. كيف يغيّر وباء واحد من يقود الجماعة؟
    ur: البلاذری «فتوح البلدان» میں ذکر کرتے ہیں کہ طاعونِ عمواس 18 ہجری میں تھا اور اس میں مسلمانوں کی بڑی تعداد فوت ہوئی۔ ان میں ابوعبیدہ بن الجراح تھے، جو امیر تھے اور اٹھاون برس کے تھے، اور معاذ بن جبل جو اڑتیس برس کی عمر میں فوت ہوئے۔ ایک وبا جماعت کی قیادت کو کیسے بدل دیتی ہے؟
  entity: event/plague-of-amwas
  sources:
