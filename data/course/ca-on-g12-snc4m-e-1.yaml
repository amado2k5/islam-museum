  title:
    en: The Black Death in Tunis
    ar: الطاعون الأسود في تونس
    ur: تیونس میں سیاہ موت
  text:
    en: 'In 1349 the Black Death struck Tunis and took both of Ibn Khaldun''s parents. The record adds that the family had crossed from Spain after the fall of Seville and Cordoba and settled in Tunis, and that the loss marked a turning point: Ibn Khaldun then entered the service of rulers in the Maghreb and Spain. What does one family''s loss show about an epidemic''s reach?'
    ar: في سنة 1349م ضرب الطاعون الأسود تونس، فمات والد ابن خلدون ووالدته. وكانت أسرته قد هاجرت من الأندلس بعد سقوط إشبيلية وقرطبة، واستقرت في تونس. وكانت هذه الفاجعة بداية مرحلة جديدة في حياة ابن خلدون، إذ انتقل بعدها إلى خدمة الأمراء في المغرب والأندلس. ماذا تكشف خسارة أسرة واحدة عن اتساع أثر الوباء؟
    ur: 1349ء میں سیاہ موت نے تیونس کو آ لیا اور ابن خلدون کے والد اور والدہ دونوں کو لے گئی۔ ان کا خاندان اشبیلیہ اور قرطبہ کے زوال کے بعد اندلس سے آ کر تیونس میں بس گیا تھا۔ یہ سانحہ ابن خلدون کی زندگی میں نئے مرحلے کا آغاز تھا، کیونکہ اس کے بعد وہ مغرب اور اندلس کے امرا کی خدمت میں چلے گئے۔ ایک خاندان کا نقصان وبا کی وسعت کے بارے میں کیا بتاتا ہے؟
  entity: event/ibn-khaldun-parents-die-black-death-1349
  sources:
  - source/britannica-ibn-khaldun
- position: after
  kind: story
  title:
    en: Smallpox and the years of deaths
    ar: الجدري وسنوات الموتان
    ur: چیچک اور اموات کے سال
  text:
    en: 'Between 422 and 425 AH a run of deadly calamities struck: drought, epidemics and smallpox spread through Khurasan, al-Jabal, Iraq and Egypt. In Baghdad smallpox spread from April to October, and no house was spared. It was said that seventy thousand died in Baghdad in Dhu al-Hijja 425; these are the figures the sources give. Why do the numbers need caution?'
    ar: 'تتابع على بلاد الإسلام بين سنتي ٤٢٢ و٤٢٥هـ موتان متلاحقان: جفاف وأوبئة وجدري عمت خراسان والجبل والعراق ومصر. وعمّ بغداد الجدري من نيسان إلى تشرين فلم يسلم بيت. وقيل إنه مات ببغداد في ذي الحجة ٤٢٥هـ سبعون ألفًا، وهي أعداد المصادر بما فيها. لماذا تحتاج الأرقام إلى حذر؟'
    ur: '422 اور 425 ہجری کے درمیان اسلامی ممالک پر مسلسل اموات کا دور آیا: خشک سالی، وبائیں اور چیچک، جو خراسان، الجبل، عراق اور مصر میں پھیلیں۔ بغداد میں چیچک اپریل سے اکتوبر تک پھیلی اور کوئی گھر نہ بچا۔ کہا گیا کہ ذوالحجہ 425 ہجری میں بغداد میں ستر ہزار فوت ہوئے؛ یہ وہ اعداد ہیں جو ماخذ دیتے ہیں۔ اعداد کے بارے میں احتیاط کیوں ضروری ہے؟'
  entity: event/smallpox-epidemic-423
