  text:
    en: The record describes girih as Islamic geometric knot patterns that build stars and polygons from interlacing lines. They were common in Safavid and Seljuk architecture and rest on girih tiles. If a pattern is built from a few tile shapes, how could you describe what repeats in it?
    ar: يصف السجل الجيره بأنها عقد هندسية إسلامية تبني نجوماً ومضلعات بخطوط متشابكة، شاعت في العمارة الصفوية والسلجوقية وتقوم على بلاطات جيره. إذا بُني نمط من بضعة أشكال من البلاطات، فكيف تصف ما يتكرر فيه؟
    ur: ریکارڈ گرہ کو اسلامی ہندسی گرہیں بتاتا ہے جو ستارے اور کثیر الاضلاع متشابک لکیروں سے بناتی ہیں؛ یہ صفوی اور سلجوقی فنِ تعمیر میں عام ہوئیں اور ٹائلوں کی بنیاد پر قائم ہوتی ہیں۔ اگر کوئی نمونہ چند ٹائل شکلوں سے بنا ہو تو آپ اس میں دہرائی جانے والی چیز کو کیسے بیان کریں گے؟
