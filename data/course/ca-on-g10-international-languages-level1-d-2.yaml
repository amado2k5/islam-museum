  title:
    en: A good word
    ar: كلمة طيبة
    ur: اچھا کلمہ
  text:
    en: The Kuwaiti Encyclopaedia of Fiqh describes shukr as the acknowledgement of a kindness, its spreading and praise of its doer, made by the tongue, the heart and the limbs. It adds that to repay a kindness in deed is the root of thanks, and that if one cannot, a good word is enough. To whom will you write your thank-you note, and which kindness will you acknowledge in it?
    ar: تصف الموسوعة الفقهية الكويتية الشكر بأنه اعتراف بالمعروف ونشره والثناء على فاعله، ويكون باللسان والقلب والجوارح. وتذكر أن شكر المنعم بالفعل أصل، فإن لم يقدر فبالثناء الحسن. لمن تكتب رسالة شكرك، وأي معروف تعترف به فيها؟
    ur: کویتی فقہی انسائیکلوپیڈیا شکر کو بھلائی کا اعتراف، اسے پھیلانا اور کرنے والے کی تعریف بتاتا ہے، جو زبان، دل اور اعضاء سے ہوتا ہے۔ وہ یہ بھی بتاتا ہے کہ احسان کرنے والے کو عمل سے بدلہ دینا شکر کی اصل ہے، اور اگر کوئی ایسا نہ کر سکے تو اچھا کلمہ کافی ہے۔ آپ اپنا شکریے کا خط کسے لکھیں گے اور اس میں کس بھلائی کا اعتراف کریں گے؟
