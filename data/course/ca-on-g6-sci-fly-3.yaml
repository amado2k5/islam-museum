    ar: يعمل مهندسو الطيران والطيارون ومراقبو الحركة الجوية من خلفيات مسلمة في القطاع كله — من بومباردييه في مونتريال إلى طواقم هندسة طيران الإمارات.
    ur: 'مسلم پس منظر کے فضائی انجینئر، پائلٹ اور ائیر ٹریفک کنٹرولر پوری صنعت میں ہیں — مونٹریال کی بومباردیے سے امارات کی انجینئرنگ ٹیموں تک۔'
