- position: within
  kind: invention
  title:
    en: Balanced, yet still moving
    ar: متوازنة ومع ذلك تتحرك
    ur: متوازن، پھر بھی حرکت میں
  text:
    en: 'In NASA Glenn''s steady-glide diagram the force components are balanced while motion continues: equilibrium here does not mean hovering, but unchanged speed and direction in the simplified model. Weight is vertical, while lift and drag are oriented relative to an inclined path. The museum''s record says al-Maqqari gives no observation series testing these components. When are forces balanced while a glider is still moving?'
    ar: 'في رسم ناسا غلين للانزلاق المنتظم تتعادل مركبات القوى مع استمرار الحركة: «الاتزان» هنا لا يعني الوقوف في الهواء، بل عدم تغير السرعة والاتجاه في النموذج المبسط. والوزن رأسي، بينما يتجه الرفع والمقاومة بالنسبة إلى مسار مائل. ويقول سجل المتحف إن المقري لا يقدم سلسلة مشاهدات تختبر هذه المركبات. متى تكون القوى متوازنة وتبقى الطائرة الشراعية متحركة؟'
    ur: 'ناسا گلین کے مستقل انزلاق کے نقشے میں قوتوں کے اجزا متوازن ہیں مگر حرکت جاری ہے: یہاں توازن کا مطلب ہوا میں رکنا نہیں، بلکہ سادہ نمونے میں رفتار اور سمت کا نہ بدلنا ہے۔ وزن عمودی ہے، جبکہ اٹھان اور مزاحمت مائل راستے کی نسبت سے ہیں۔ میوزیم کا ریکارڈ کہتا ہے کہ مقری ایسے مشاہدات کا سلسلہ نہیں دیتے جو ان اجزا کو آزمائیں۔ قوتیں کب متوازن ہوتی ہیں جبکہ گلائیڈر پھر بھی حرکت میں رہتا ہے؟'
