  text:
    en: 'Every account of Ibn Firnas''s flight ends the same way: the glider worked, the landing didn''t, because no tail meant no control at touchdown. Control surfaces are not decoration — they are the
      difference between flying and falling.'
    ar: 'تنتهي كل رواية عن طيران ابن فرناس بالشكل ذاته: نجح المنزلق وأخفق الهبوط، لأن غياب الذيل يعني غياب التحكم لحظة النزول. أسطح التحكم ليست زينة — إنها الفرق بين الطيران والسقوط.'
    ur: 'ابن فرناس کی پرواز کی ہر روایت کا انجام ایک ہی ہے: گلائیڈر چلا، لینڈنگ نہیں — دم نہ ہونے کا مطلب اترتے وقت کوئی کنٹرول نہیں۔ کنٹرول سطحیں زینت نہیں — یہ پرواز اور گرنے میں فرق ہیں۔'
