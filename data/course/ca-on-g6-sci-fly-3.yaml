  title:
    en: 'Two accounts of the landing'
    ar: 'روايتان عن الهبوط'
    ur: 'اترنے کی دو روایتیں'
  text:
    en: 'Al-Maqqari reports that Abbas ibn Firnas covered himself with feathers, fitted two wings and attempted flight, suffering injury on landing. Maqqari attributes the landing difficulty to a missing tail, comparing a bird''s landing: an explanation within the narrative, not a modern aerodynamic test. Hasan Ibrahim Hasan describes unharmed survival. If you were steering a glider, what would you want at the back?'
    ar: 'يروي المقري أن عباس بن فرناس كسا جسمه بالريش واتخذ جناحين وحاول الطيران، ثم أصيب عند الوقوع. ويعزو المقري صعوبة الوقوع إلى عدم عمل ذيل، ويقارن ذلك بهبوط الطائر؛ وهذا تفسير في الرواية، لا نتيجة اختبار هوائي حديث. أما حسن إبراهيم حسن فيصف النجاة سالماً. لو كنتَ توجّه طائرة شراعية، فماذا تريد أن يكون في مؤخرتها؟'
    ur: 'المقری روایت کرتے ہیں کہ عباس بن فرناس نے اپنے جسم کو پروں سے ڈھانپا، دو بازو لگائے اور اڑنے کی کوشش کی، پھر اترتے وقت زخمی ہو گیا۔ المقری اترنے کی مشکل کو دم کے کام نہ کرنے سے منسوب کرتے ہیں اور اسے پرندے کے اترنے سے ملاتے ہیں؛ یہ روایت کے اندر کی توجیہ ہے، کسی جدید ہوائی آزمائش کا نتیجہ نہیں۔ حسن ابراہیم حسن بخیریت بچ نکلنے کا ذکر کرتے ہیں۔ اگر آپ گلائیڈر کو سنبھال رہے ہوتے تو پچھلے حصے میں آپ کیا چاہتے؟'
