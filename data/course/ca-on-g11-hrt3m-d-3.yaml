label:
  en: Sacred writings and oral teachings
  ar: الكتابات المقدسة والتعاليم الشفهية
  ur: مقدس تحریریں اور زبانی تعلیمات
summary:
  en: Which writings and teachings a tradition treats as significant, how they arose, what principles they set out, and how they compare in importance (D2.1, D2.2, D2.3, D2.4).
  ar: أي الكتابات والتعاليم يعدّها التقليد مهمة، وكيف نشأت، وما المبادئ التي تقررها، وكيف تتفاوت مكانتها ⁦(D2.1 وD2.2 وD2.3 وD2.4)⁩.
  ur: کوئی روایت کن تحریروں اور تعلیمات کو اہم مانتی ہے، وہ کیسے وجود میں آئیں، ان میں کون سے اصول ہیں، اور ان کی اہمیت میں کیا فرق ہے ⁦(D2.1، D2.2، D2.3، D2.4)⁩۔
