  - source/sahih-muslim
- position: after
  kind: story
  title:
    en: A sermon at Arafat
    ar: خطبة في عرفة
    ur: عرفات کا خطبہ
  text:
    en: Al-Mubarakpuri, in The Sealed Nectar, reports that on the day of Arafat, 9 Dhu al-Hijja 10 AH, the Prophet preached to more than a hundred thousand people. He declared their blood and property inviolable, set aside the blood and usury of the Jahiliyya, enjoined good treatment of women, and told them he had left among them the Book of God. Which of these principles would you call central?
    ar: يروي المباركفوري في «الرحيق المختوم» أنه في يوم عرفة، التاسع من ذي الحجة سنة 10هـ، خطب النبي في أكثر من مئة ألف. فأعلن حرمة دمائهم وأموالهم، ووضع دم الجاهلية وربا الجاهلية، وأوصى بالنساء خيرًا، وأخبرهم أنه ترك فيهم كتاب الله. أي هذه المبادئ تعدّه محوريًا؟
    ur: مبارکپوری «الرحیق المختوم» میں بیان کرتے ہیں کہ یومِ عرفہ، ۹ ذوالحجہ ۱۰ھ کو نبی نے ایک لاکھ سے زیادہ لوگوں سے خطاب کیا۔ آپ نے ان کے خون اور مال کی حرمت کا اعلان کیا، جاہلیت کے خون اور سود کو ختم کیا، عورتوں کے ساتھ اچھے سلوک کی تلقین کی اور بتایا کہ آپ ان میں اللہ کی کتاب چھوڑ رہے ہیں۔ آپ ان اصولوں میں سے کسے مرکزی کہیں گے؟
  entity: event/farewell-sermon-at-arafat
