  title:
    en: Words, deeds and approvals
    ar: الأقوال والأفعال والإقرارات
    ur: اقوال، افعال اور تقریرات
  text:
    en: Hadith is what is reported from the Prophet in word, deed, tacit approval or description, reaching us through a chain of transmission that ends with him. How does a teaching differ from a scripture in how it is passed on?
    ar: الحديث ما يُروى عن النبي من قول أو فعل أو تقرير أو وصف، ويصلنا بسند ينتهي إليه. كيف يختلف التعليم عن الكتاب المقدس في طريقة نقله؟
    ur: حدیث وہ ہے جو نبی سے قول، فعل، تقریر یا وصف کی صورت میں روایت ہو اور ایسی سند کے ذریعے ہم تک پہنچے جو آپ پر ختم ہوتی ہے۔ ایک تعلیم اور ایک مقدس کتاب کی منتقلی کے طریقے میں کیا فرق ہے؟
  entity: concept/al-hadith-al-nabawi
  sources:
