expectations:
- code: D2.1
  text:
    en: identify significant sacred writings […] and oral teachings […] of various religions and belief traditions
    ar: حدّد أهم الكتابات المقدسة […] والتعاليم الشفهية […] في مختلف الأديان وتقاليد المعتقد
    ur: مختلف مذاہب اور اعتقادی روایات کی اہم مقدس تحریروں […] اور زبانی تعلیمات […] کی نشاندہی کریں
- code: D2.2
  text:
    en: explain the origins and development of various sacred writings and oral teachings […]
    ar: اشرح أصول مختلف الكتابات المقدسة والتعاليم الشفهية وتطورها […]
    ur: مختلف مقدس تحریروں اور زبانی تعلیمات کی ابتدا اور ارتقا کی وضاحت کریں […]
- code: D2.3
  text:
    en: identify the central principles outlined in key oral teachings and passages of sacred writings in various religions and belief tradi­tions […]
    ar: حدّد المبادئ المحورية الواردة في التعاليم الشفهية الرئيسة ومقاطع الكتابات المقدسة في مختلف الأديان وتقاليد المعتقد […]
    ur: مختلف مذاہب اور اعتقادی روایات کی اہم زبانی تعلیمات اور مقدس تحریروں کے اقتباسات میں بیان کردہ مرکزی اصولوں کی نشاندہی کریں […]
- code: D2.4
  text:
    en: compare sacred writings and oral teachings within the same tradition in terms of their rec­ognized importance and influence on believers […]
    ar: قارن بين الكتابات المقدسة والتعاليم الشفهية داخل التقليد الواحد من حيث مكانتها المعترف بها وتأثيرها في المؤمنين […]
    ur: ایک ہی روایت کے اندر مقدس تحریروں اور زبانی تعلیمات کا ان کی تسلیم شدہ اہمیت اور ماننے والوں پر اثر کے لحاظ سے موازنہ کریں […]
connections:
- position: before
  kind: story
  title:
    en: Gathering the Qur'an
    ar: جمع القرآن
    ur: قرآن کا جمع کیا جانا
  text:
    en: The report, in al-Bukhari from Zayd ibn Thabit, says Abu Bakr sent for Zayd after the killing of the people of al-Yamama. Umar feared that much of the Qur'an would be lost as the reciters were killed, and urged that it be gathered. Zayd gathered it from scraps, shoulder-blades, palm-stalks and the breasts of men. What does this account say about how a sacred text was kept?
    ar: تروي القصة، في صحيح البخاري عن زيد بن ثابت، أن أبا بكر أرسل إلى زيد بعد مقتل أهل اليمامة. وخشي عمر أن يذهب كثير من القرآن بمقتل القراء، فرأى أن يُجمع. فجمعه زيد من الرقاع والأكتاف والعسب وصدور الرجال. ماذا يقول هذا الخبر عن كيفية حفظ نص مقدس؟
    ur: صحیح بخاری میں زید بن ثابت کی روایت کے مطابق یمامہ والوں کے قتل کے بعد ابوبکر نے زید کو بلوایا۔ عمر کو اندیشہ ہوا کہ قاریوں کے قتل ہونے سے قرآن کا بڑا حصہ جاتا رہے گا، اس لیے انہوں نے اسے جمع کرنے کی رائے دی۔ زید نے اسے ٹکڑوں، کندھے کی ہڈیوں، کھجور کی ٹہنیوں اور لوگوں کے سینوں سے جمع کیا۔ یہ روایت کسی مقدس متن کے محفوظ رکھے جانے کے بارے میں کیا بتاتی ہے؟
