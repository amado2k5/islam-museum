- position: after
  kind: story
  title:
    en: Servants of God who kept their discipline
    ar: خدّام الله الذين ثبتوا على السلمية
    ur: خدائی خدمتگار جو اپنے نظم پر قائم رہے
  text:
    en: Wikipedia's article on Khan Abdul Ghaffar Khan, a Pashtun activist called the 'Frontier Gandhi', says he founded the Khudai Khidmatgar, 'Servants of God', in 1929, and that its members took an oath of nonviolence. It reports that on 23 April 1930 troops fired on the unarmed crowd in Peshawar while members kept their nonviolent discipline. It says he recognised his struggle as a jihad in which, in its wording, only the enemy held swords. What can a leader's faith do for a movement?
    ar: تقول مقالة ويكيبيديا عن خان عبد الغفار خان، الناشط البشتوني الملقب «غاندي الحدود»، إنه أسس حركة خدائي خدمتغار، أي «خدّام الله»، سنة 1929، وإن أعضاءها أقسموا على اللاعنف. وتذكر أن القوات أطلقت النار في 23 أبريل 1930 على حشد أعزل في بيشاور وظل الأعضاء على انضباطهم السلمي. وتقول إنه رأى كفاحه جهادًا لا يحمل السيوف فيه، بحسب عبارتها، إلا العدو. ماذا يستطيع إيمان القائد أن يقدّم لحركة؟
    ur: خان عبدالغفار خان، جنہیں «سرحدی گاندھی» کہا جاتا ہے، کے بارے میں ویکی پیڈیا کا مضمون کہتا ہے کہ انہوں نے ۱۹۲۹ میں خدائی خدمتگار، یعنی «اللہ کے خدمتگار»، کی تحریک قائم کی اور اس کے ارکان نے عدم تشدد کا حلف لیا۔ وہ بتاتا ہے کہ ۲۳ اپریل ۱۹۳۰ کو پشاور میں فوجیوں نے نہتے ہجوم پر گولی چلائی جبکہ ارکان اپنے پرامن نظم پر قائم رہے۔ اس کے مطابق وہ اپنی جدوجہد کو ایسا جہاد سمجھتے تھے جس میں، اس کے الفاظ میں، تلواریں صرف دشمن کے ہاتھ میں تھیں۔ رہنما کا ایمان کسی تحریک کو کیا دے سکتا ہے؟
  entity: person/khan-abdul-ghaffar-khan
