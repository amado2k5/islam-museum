  title:
    en: The one who leads the prayer
    ar: من يؤمّ المصلين
    ur: نماز کی امامت کرنے والا
  text:
    en: Wikidata defines the imam as the person who leads worshippers in congregational prayer, and adds that among the Shia the imamate means religious and political leadership of the community. What does a prayer leader do for those who pray behind him?
    ar: يعرّف ويكيداتا الإمام بأنه من يقود المصلين في صلاة الجماعة، ويضيف أن الإمامة عند الشيعة تعني القيادة الدينية والسياسية للجماعة. ماذا يفعل الإمام لمن يصلّون خلفه؟
    ur: ویکی ڈیٹا امام کی تعریف یوں کرتا ہے کہ وہ شخص جو باجماعت نماز میں نمازیوں کی قیادت کرتا ہے، اور بتاتا ہے کہ شیعہ کے ہاں امامت کا مطلب جماعت کی دینی اور سیاسی قیادت ہے۔ امام اپنے پیچھے نماز پڑھنے والوں کے لیے کیا کرتا ہے؟
