  title:
    en: The Prophet of Islam
    ar: نبي الإسلام
    ur: نبیِ اسلام
  text:
    en: Al-Mubarakpuri, in The Sealed Nectar, calls Muhammad ibn Abdullah the Prophet of Islam, about 570 to 632 CE, and says his people called him al-Amin. He relates that when he had completed forty years the revelation came to him in the cave of Hira, and judges this to be the night of Monday, 21 Ramadan, or 10 August 610 CE. What does this account tell you about where his influence began?
    ar: يذكر المباركفوري في «الرحيق المختوم» أن محمد بن عبد الله نبي الإسلام، نحو 570 إلى 632م، وأن قومه كانوا يسمّونه الأمين. ويروي أنه لما أتم أربعين سنة جاءه الوحي في غار حراء، ويرجّح أن ذلك كان ليلة الاثنين 21 رمضان، الموافق 10 أغسطس 610م. ماذا يخبرنا هذا الخبر عن موضع بدء أثره؟
    ur: مبارکپوری «الرحیق المختوم» میں محمد بن عبداللہ کو اسلام کا نبی بتاتے ہیں، تقریباً ۵۷۰ سے ۶۳۲ عیسوی، اور کہتے ہیں کہ ان کی قوم انہیں امین کہتی تھی۔ وہ بیان کرتے ہیں کہ جب وہ چالیس برس کے ہو چکے تو غارِ حرا میں ان پر وحی آئی، اور ان کی رائے میں یہ پیر کی رات، ۲۱ رمضان، یعنی ۱۰ اگست ۶۱۰ عیسوی تھی۔ یہ بیان ان کے اثر کی ابتدا کے بارے میں کیا بتاتا ہے؟
  entity: person/muhammad
  sources:
