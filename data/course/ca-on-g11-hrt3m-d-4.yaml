connections:
- position: before
  kind: story
  title:
    en: What Islam asks of a believer
    ar: ما يطلبه الإسلام من المؤمن
    ur: اسلام مومن سے کیا چاہتا ہے
  text:
    en: 'In Gabriel''s hadith, as Ibn Khuzayma''s Sahih gives it, a man asks the Prophet ''What is Islam?'' and he answers: that you worship God and associate nothing with Him, establish the prayer, give the obligatory zakat and fast Ramadan. The editor of al-Bukhari''s Sahih explains that the man was Gabriel in human form. In another hadith the Prophet describes Islam as a building standing on five supports. How does a definition of a faith also list what is expected of its followers?'
    ar: 'في حديث جبريل كما يرويه ابن خزيمة في صحيحه يسأل رجل النبي: ما الإسلام؟ فيجيب: أن تعبد الله ولا تشرك به شيئًا، وتقيم الصلاة، وتؤدي الزكاة المفروضة، وتصوم رمضان. ويشرح محقق صحيح البخاري أن الرجل كان جبريل في صورة رجل. وفي حديث آخر يصف النبي الإسلام ببناء قائم على خمس دعائم. كيف يجمع تعريف الدين بين وصفه وما يُطلب من أتباعه؟'
    ur: 'ابن خزیمہ اپنی صحیح میں حدیثِ جبریل نقل کرتے ہیں: ایک آدمی نبی سے پوچھتا ہے: اسلام کیا ہے؟ آپ جواب دیتے ہیں: یہ کہ تم اللہ کی عبادت کرو اور اس کے ساتھ کسی کو شریک نہ ٹھہراؤ، نماز قائم کرو، فرض زکوٰۃ دو اور رمضان کے روزے رکھو۔ صحیح بخاری کا محقق وضاحت کرتا ہے کہ وہ آدمی انسانی صورت میں جبریل تھے۔ ایک اور حدیث میں نبی اسلام کو پانچ ستونوں پر کھڑی عمارت بتاتے ہیں۔ کسی دین کی تعریف اس کے ماننے والوں سے مطلوب باتوں کی فہرست بھی کیسے بن جاتی ہے؟'
