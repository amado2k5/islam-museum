expectations:
- code: C1
  text:
    en: demonstrate knowledge and understanding of the political and social history of societies in the classical world
    ar: أظهر معرفة وفهمًا بالتاريخ السياسي والاجتماعي لمجتمعات العالم الكلاسيكي
    ur: کلاسیکی دنیا کے معاشروں کی سیاسی اور سماجی تاریخ کا علم اور فہم ظاہر کریں
- code: C2
  text:
    en: demonstrate knowledge and understanding of the geography of the classical world and its influence on the development of classical culture
    ar: أظهر معرفة وفهمًا بجغرافية العالم الكلاسيكي وأثرها في تطور الثقافة الكلاسيكية
    ur: کلاسیکی دنیا کے جغرافیے اور کلاسیکی ثقافت کی ترقی پر اس کے اثر کا علم اور فہم ظاہر کریں
- code: C3
  text:
    en: identify historical and geographical terminology in English derived from ancient Greek and Latin, including political and legal terminology, and use it correctly
    ar: تعرّف على المصطلحات التاريخية والجغرافية في الإنجليزية المشتقة من اليونانية القديمة واللاتينية، ومنها المصطلحات السياسية والقانونية، واستعملها استعمالًا صحيحًا
    ur: انگریزی کی وہ تاریخی اور جغرافیائی اصطلاحات پہچانیں جو قدیم یونانی اور لاطینی سے ماخوذ ہیں، بشمول سیاسی اور قانونی اصطلاحات، اور انہیں درست طور پر استعمال کریں
- code: C4
  text:
    en: describe how their learning about the history and geography of the classical world relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and their own experience
    ar: صف كيف يرتبط تعلّم تاريخ العالم الكلاسيكي وجغرافيته بفهمك لثقافات أخرى ومجالات دراسة أخرى وللعالم المعاصر ولتجربتك الخاصة، وكيف يعززه
    ur: بیان کریں کہ کلاسیکی دنیا کی تاریخ اور جغرافیے کے بارے میں سیکھنا دیگر ثقافتوں اور مضامین، عصرِ حاضر اور اپنے تجربے کی سمجھ سے کیسے جڑتا اور اسے کیسے بڑھاتا ہے
