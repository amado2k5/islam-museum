summary:
  en: 'The 2023 Ontario Grade 3 Social Studies course has two strands: Heritage and Identity: Communities in Canada, 1780–1850, and People and Environments: Living and Working in Ontario. The museum maps one lesson of strand B only.'
  ar: 'مقرر الدراسات الاجتماعية للصف الثالث في منهاج أونتاريو 2023 له محوران: التراث والهوية: المجتمعات في كندا 1780–1850، والناس والبيئات: العيش والعمل في أونتاريو. ولا يربط المتحف إلا درسًا واحدًا من المحور الثاني.'
  ur: 'اونٹاریو کے 2023 کے نصاب میں جماعت سوم کی سماجی علوم کے دو محور ہیں: ورثہ اور شناخت: کینیڈا کی برادریاں، 1780–1850، اور لوگ اور ماحول: اونٹاریو میں رہنا اور کام کرنا۔ عجائب گھر صرف دوسرے محور کا ایک سبق جوڑتا ہے۔'
  es: "El curso de Estudios Sociales de tercer grado de Ontario de 2023 consta de dos ejes temáticos: Patrimonio e identidad: Comunidades en Canadá, 1780–1850, y Personas y entornos: Vida y trabajo en Ontario. El mapa del museo solo incluye una lección del eje B."
  fr: "Le programme d’études sociales de 3e année de l’Ontario pour 2023 comporte deux volets: Patrimoine et identité: les communautés au Canada, 1780-1850, et Population et environnement: vivre et travailler en Ontario. Le musée présente une seule leçon du volet B."
  tr: "Ontario 2023'teki 3. Sınıf Sosyal Bilgiler müfredatının iki ana teması vardır: Miras ve Kimlik: Kanada'daki Topluluklar 1780–1850 ve İnsanlar ve Çevreler: Ontario'da Yaşam ve Çalışma. Müze, ikinci temanın yalnızca bir dersiyle bağlantılıdır."
  id: "Kurikulum Studi Sosial Kelas 3 di Ontario tahun 2023 memiliki dua tema utama: Warisan dan Identitas: Komunitas di Kanada 1780–1850, dan Manusia dan Lingkungan: Hidup dan Bekerja di Ontario. Museum ini hanya terkait dengan satu pelajaran dari tema kedua."
