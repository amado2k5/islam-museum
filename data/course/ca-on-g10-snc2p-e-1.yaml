connections:
- position: within
  kind: invention
  title:
    en: Where does reflection happen?
    ar: أين يقع الانعكاس؟
    ur: انعکاس کہاں ہوتا ہے؟
  text:
    en: On a circular mirror, light reflects at a point on the rim where the angle of incidence and the angle of reflection are equal, each measured against the local normal. Ibn al-Haytham's contribution here is geometrical lemmas and applications in Book V of the Book of Optics, not the invention of the mirror or the discovery of the law of reflection from nothing. Where would you draw that normal?
    ar: في مرآة دائرية ينعكس الضوء عند نقطة على المحيط تتساوى عندها زاويتا السقوط والانعكاس، كلتاهما بالنسبة إلى العمود المحلي. ومساهمة ابن الهيثم هنا مقدمات هندسية وتطبيقات في المقالة الخامسة من «كتاب المناظر»، لا اختراع المرآة ولا اكتشاف قانون الانعكاس من الصفر. أين ترسم هذا العمود؟
    ur: دائروی آئینے پر روشنی کنارے کے ایک ایسے نقطے پر منعکس ہوتی ہے جہاں مقامی عمود کے لحاظ سے زاویۂ وقوع اور زاویۂ انعکاس برابر ہوں۔ ابن الہیثم کا حصہ یہاں «کتاب المناظر» کے پانچویں مقالے میں ہندسی مقدمات اور اطلاقات ہیں، نہ آئینے کی ایجاد اور نہ انعکاس کے قانون کی صفر سے دریافت۔ آپ یہ عمود کہاں کھینچیں گے؟
