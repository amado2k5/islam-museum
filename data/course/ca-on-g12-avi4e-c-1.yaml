connections:
- position: before
  kind: invention
  title:
    en: 'Illumination: the parts of a page and its colours'
    ar: 'التذهيب: أجزاء الصفحة وألوانها'
    ur: 'تذہیب: صفحے کے حصے اور رنگ'
  text:
    en: Illumination is the art of decorating title pages, headings, verse divisions, colophons, dedications, borders and book covers. Norah Titley notes that the academies of Shiraz favoured deep maroon and those of Herat black, and that Herat headings used lapis lazuli grounds. Which of these words for parts of a page, and which colours, would you add to your own list of vocabulary?
    ar: التذهيب فن زخرفة صفحات العناوين والرؤوس وفواصل الآيات والخواتيم والإهداءات والحواشي وأغلفة الكتب. وتذكر نورا تيتلي أن مزخرفي شيراز أحبوا العنابي الداكن ومزخرفي هراة الأسود، وأن اللازورد استُعمل أرضية للرؤوس في مخطوطات هراة. أي هذه الكلمات لأجزاء الصفحة، وأي هذه الألوان، تضيف إلى قائمة مفرداتك؟
    ur: تذہیب عنوان کے صفحات، سرناموں، آیات کی تقسیم، خاتموں، انتسابات، حاشیوں اور کتابوں کے سرورقوں کو آراستہ کرنے کا فن ہے۔ نورا ٹائٹلی لکھتی ہیں کہ شیراز کے مذہّبین گہرا عنابی رنگ اور ہرات کے مذہّبین سیاہ رنگ پسند کرتے تھے، اور ہرات کی مخطوطات میں سرناموں کی زمین لاجورد سے بنتی تھی۔ صفحے کے حصوں کے یہ کون سے الفاظ اور یہ کون سے رنگ آپ اپنی لغت میں جوڑیں گے؟
  entity: practice/manuscript-illumination-tazhib
  sources:
  - source/titley-persian-miniature-painting-1983
- position: within
  kind: career
  title:
    en: The calligrapher's pen, dot and gold
    ar: قلم الخطّاط ونقطته وذهبه
    ur: خطاط کا قلم، نقطہ اور سونا
  text:
    en: The hand is written with a reed pen and black soot ink. Letters are measured in units of a dot, the diamond or square shape the pen makes when its full width touches the paper, and lines are set with a ruler called the mistar. Gold is applied as gold ink, or as gold leaf fixed with an adhesive made from seed oil and then burnished with a stone. Which of these words would you use for your own tools?
    ar: يُكتب الخط بقلم من القصب ومداد أسود من السخام. والحرف يُقاس بوحدة النقطة، وهي شكل معيّن أو مربع يرسمه القلم بكامل فوهته على الورق، وتُضبط الأسطر بأداة تُسمى «المِسطر». ويُكتب الذهب بمداد ذهبي، أو بورق الذهب الذي يُلصق بمادة لاصقة من زيت البِزر، ثم يُصقل بحجر. أي هذه الكلمات تستعمل لأدواتك أنت؟
    ur: تحریر سرکنڈے کے قلم اور کاجل کی کالی روشنائی سے لکھی جاتی ہے۔ حرف کی پیمائش نقطے کی اکائی سے ہوتی ہے، جو معین یا چوکور شکل ہے جو قلم اپنی پوری چوڑائی کے ساتھ کاغذ کو چھوئے تو بنتی ہے، اور سطریں «مسطر» نامی آلے سے سیدھی کی جاتی ہیں۔ سونا سنہری روشنائی سے، یا سونے کے ورق سے لگایا جاتا ہے جو بیج کے تیل کے گوند سے چپکایا جاتا ہے اور پھر پتھر سے چمکایا جاتا ہے۔ ان میں سے کون سے الفاظ آپ اپنے اوزاروں کے لیے برتیں گے؟
  entity: job/calligrapher
  sources:
  - source/tdv-hat
- position: after
  kind: object
  title:
    en: Cutting through the glaze
    ar: القطع عبر الطلاء الزجاجي
    ur: چمکدار تہ کے آر پار کاٹنا
  text:
    en: On the borders of Moroccan tile panels, Arabic and Kufic inscriptions are made from whole glazed tiles, usually black. The inscription is laid out and the surface round the letters is cut through the glaze to the terracotta with chisels or sharp hammers, leaving black letters on a terracotta ground, a process demanding great skill. What effect does the cutting produce?
    ar: تُصنع الكتابات العربية والكوفية في أطر اللوحات المغربية من بلاطات مزججة كاملة، سوداء في الغالب، يُخطّ عليها النقش ثم يُنقر ما حول الحروف بالأزاميل حتى يظهر الفخار، فيبدو الخط أسود على أرضية فخارية، وهي صنعة تحتاج إلى مهارة بالغة. ما التأثير الذي ينتجه هذا القطع؟
    ur: مراکشی ٹائل کے تختوں کے کناروں پر عربی اور کوفی تحریریں پورے چمکدار ٹائلوں سے بنتی ہیں، جو عموماً کالے ہوتے ہیں۔ تحریر کا خاکہ بنایا جاتا ہے اور حروف کے گرد کی سطح کو چھینیوں یا تیز ہتھوڑوں سے چمکدار تہ کے آر پار مٹی تک کاٹا جاتا ہے، یوں مٹی کی زمین پر کالے حروف رہ جاتے ہیں، اور یہ عمل بڑی مہارت مانگتا ہے۔ اس کاٹنے سے کیا اثر پیدا ہوتا ہے؟
