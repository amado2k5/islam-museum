  title:
    en: Not everything that flies is a bird
    ar: ليس كل ما طار طيراً
    ur: جو اڑے وہ سب پرندہ نہیں
  text:
    en: 'In the edition prepared by Muhammad Basil ''Uyun al-Sud, al-Jahiz''s Kitab al-Hayawan divides the world: bodies are inanimate or growing, the growing are animals and plants, and animals walk, fly, swim or creep. Not everything that flies on two wings is a bird: locusts, bees and flies fly but are not called birds, and the bat is reckoned among birds though featherless while the ostrich has feathers but is not a bird. What does a way of grouping animals add to the study of living things?'
    ar: 'في طبعة محمد باسل عيون السود لـ«كتاب الحيوان» للجاحظ قسمة للعالم: الأجسام جماد ونامٍ، والنامي حيوان ونبات، والحيوان ما يمشي وما يطير وما يسبح وما ينساح. وليس كل ما طار بجناحين طيرًا، فالجراد والنحل والذباب تطير ولا تسمى طيرًا، والخفاش من الطير مع أنه بلا ريش، والنعامة ذات ريش وليست من الطير. ماذا يضيف تصنيف الحيوان إلى دراسة الكائنات الحية؟'
    ur: 'محمد باسل عیون السود کے مرتب کردہ ایڈیشن میں جاحظ کی کتاب الحیوان دنیا کی ایک تقسیم رکھتی ہے: اجسام بے جان یا نمو پانے والے ہیں، نمو پانے والے حیوان اور نبات ہیں، اور حیوان وہ ہے جو چلتا، اڑتا، تیرتا یا رینگتا ہے۔ جو دو پروں سے اڑے وہ سب پرندہ نہیں: ٹڈی، شہد کی مکھی اور مکھی اڑتی ہیں مگر پرندہ نہیں کہلاتیں، اور چمگادڑ پروں کے بغیر بھی پرندوں میں گنی جاتی ہے جبکہ شتر مرغ کے پر ہیں مگر وہ پرندہ نہیں۔ جانوروں کی گروہ بندی حیاتیات کے مطالعے میں کیا اضافہ کرتی ہے؟'
