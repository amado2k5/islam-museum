  text:
    en: Abu al-Qasim al-Zahrawi was an Andalusian physician and surgeon associated with Cordoba, author of the thirty-book al-Tasrif, completed around 390/1000, whose final book illustrates surgery and instruments. Early biographical evidence is sparse, and court service is not established by that early testimony. What is left of a scientist's contribution when little is known of his life?
    ar: أبو القاسم الزهراوي طبيب وجراح أندلسي ارتبط بقرطبة، صاحب موسوعة «التصريف» التي اكتملت نحو 390هـ/1000م وتضم ثلاثين مقالة، آخرها في الجراحة ورسوم أدواتها. والأخبار المبكرة عن حياته قليلة، والصلة بالبلاط خبر لا تثبته تلك الأخبار الأولى. ماذا يبقى من إسهام العالم حين يقلّ ما يُعرف عن سيرته؟
    ur: ابو القاسم الزہراوی قرطبہ سے وابستہ اندلسی طبیب اور جراح تھے، تیس مقالوں پر مشتمل «التصریف» کے مصنف، جو تقریباً 390 ہجری/1000 عیسوی میں مکمل ہوئی اور جس کی آخری کتاب سرجری اور اس کے آلات کی تصویریں پیش کرتی ہے۔ ان کی زندگی کے ابتدائی شواہد کم ہیں، اور دربار سے وابستگی کو وہ ابتدائی شہادتیں ثابت نہیں کرتیں۔ جب کسی سائنس دان کی زندگی کے بارے میں کم معلوم ہو تو اس کے کارنامے کا کیا باقی رہتا ہے؟
