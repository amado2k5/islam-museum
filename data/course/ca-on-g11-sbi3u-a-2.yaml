  title:
    en: The shaykh of medicine in Egypt
    ar: شيخ الطب بالديار المصرية
    ur: مصر میں شیخِ طب
  text:
    en: Ibn al-Imad's Shadharat al-Dhahab calls Ibn al-Nafis the shaykh of medicine in Egypt, the one to whom knowledge of medicine ultimately led. It records al-Subki as saying there was no one like him on earth in medicine. He wrote the medical book al-Shamil, whose index suggests it would run to three hundred volumes, and he endowed his properties and his books to the Mansuri hospital. By what would you measure such a contribution?
    ar: 'تسمّي «شذرات الذهب» لابن العماد علاء الدين علي بن أبي الحزم المعروف بابن النفيس شيخَ الطب بالديار المصرية، ومن انتهت إليه معرفة الطب، وتنقل قول السبكي: لم يكن على وجه الأرض مثله في الطب. وألّف في الطب كتاب «الشامل» الذي تدل فهرسته على أنه يكون ثلثمائة مجلدة، ووقف أملاكه وكتبه على المارستان المنصوري. بماذا تقيس إسهاماً كهذا؟'
    ur: ابن العماد کی «شذرات الذہب» ابن نفیس کو مصر میں طب کا شیخ کہتی ہے، وہ جن پر طب کی معرفت آ کر ختم ہوئی، اور سبکی کا یہ قول نقل کرتی ہے کہ طب میں روئے زمین پر ان جیسا کوئی نہ تھا۔ انہوں نے طب میں کتاب «الشامل» لکھی جس کی فہرست سے لگتا ہے کہ وہ تین سو جلدوں کی ہوتی، اور انہوں نے اپنی جائیداد اور کتابیں منصوری ہسپتال پر وقف کر دیں۔ ایسے کارنامے کو آپ کس چیز سے ناپیں گے؟
