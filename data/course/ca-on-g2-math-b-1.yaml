  title:
    en: Nine numerals and a zero
    ar: تسعة أرقام وصفر
    ur: نو ہندسے اور ایک صفر
  text:
    en: 'Algorism is a way of writing and working numbers with nine numerals and a zero, in which each place takes its value from its position: units, then tens, then hundreds. Muhammad ibn Musa al-Khwarizmi wrote a book on it in Baghdad, through which the Indian numerals and the decimal system entered the Islamic world. How would you show your number as tens and ones?'
    ar: 'الحساب الهندي طريقة في كتابة الأعداد وحسابها بتسعة أرقام وصفر، تأخذ فيها كل خانة قيمتها من موضعها: آحاد ثم عشرات ثم مئات. ألّف فيها محمد بن موسى الخوارزمي في بغداد كتابًا دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي. كيف تُظهر عددك عشرات وآحادًا؟'
    ur: 'ہندی حساب اعداد کو نو ہندسوں اور ایک صفر سے لکھنے اور ان سے حساب کرنے کا طریقہ ہے، جس میں ہر خانہ اپنی قیمت اپنے مقام سے لیتا ہے: اکائیاں، پھر دہائیاں، پھر سینکڑے۔ محمد بن موسیٰ خوارزمی نے بغداد میں اس پر ایک کتاب لکھی جس کے ذریعے ہندی ہندسے اور اعشاری نظام عالمِ اسلام میں داخل ہوئے۔ آپ اپنے عدد کو دہائیوں اور اکائیوں میں کیسے دکھائیں گے؟'
