- position: after
  kind: object
  title:
    en: Gold, silver and a black compound
    ar: ذهب وفضة ومادة سوداء
    ur: سونا، چاندی اور ایک سیاہ مرکب
  text:
    en: The Nuhad Es-Said collection booklet describes the inlaying of brass and bronze with gold, silver and copper as developed to an unequalled degree in Islamic culture. It sees the technique fully developed at Herat in the second half of the twelfth century, with inkwells and bowls inlaid with silver, copper and a black compound. What must a worker know to make metal carry a design?
    ar: يصف كتيب مجموعة نهاد السعيد تطعيم أواني النحاس الأصفر والبرونز بالذهب والفضة والنحاس بأنه تطور في الحضارة الإسلامية تطورًا لا نظير له. ويرى أن هذه التقنية نضجت في هراة في النصف الثاني من القرن الثاني عشر، ومن قطعها محابر وسلطانيات مطعمة بالفضة والنحاس ومادة سوداء. ماذا يحتاج الصانع أن يعرفه ليجعل المعدن يحمل زخرفة؟
    ur: نہاد السعید مجموعے کا کتابچہ پیتل اور کانسی پر سونے، چاندی اور تانبے کی جڑائی کو اسلامی تہذیب میں بے مثال حد تک ترقی یافتہ بتاتا ہے۔ اس کے نزدیک یہ تکنیک بارھویں صدی کے دوسرے نصف میں ہرات میں مکمل ہوئی، اور وہاں کی اشیا میں سیاہی دانیاں اور پیالے ہیں جن میں چاندی، تانبے اور ایک سیاہ مرکب کی جڑائی ہے۔ دھات پر نقش اٹھانے کے لیے کاریگر کو کیا جاننا چاہیے؟
  entity: concept/inlaid-metalwork
  sources:
