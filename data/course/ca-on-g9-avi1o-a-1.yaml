  title:
    en: Stone, egg-white and deerskin
    ar: حجر وزلال بيض وجلد غزال
    ur: پتھر، انڈے کی سفیدی اور ہرن کی کھال
  text:
    en: 'Norah Titley describes the pigments of Persian painting as mostly mineral: the mineral was ground to a soft powder on a hard stone, sifted, washed and mixed with egg-white, glue or gum arabic. Blue came from lapis lazuli, and copper green, made with vinegar, makes the paper brittle. Gold leaf was made by pounding gold between layers of deerskin. What would your own materials do to the page?'
    ar: 'تصف نورا تيتلي ألوان التصوير الفارسي بأنها معدنية في الغالب: يطحن المعدن ناعمًا على حجر صلب، ثم ينخل ويغسل ويخلط بزلال البيض أو الغراء أو الصمغ العربي. وكان الأزرق يستخرج من اللازورد، أما الأخضر النحاسي، أي الزنجار المحضر بمعالجة النحاس بالخل، فيجعل الورق هشًا. ويحضر ورق الذهب بدق الذهب بين طبقات جلد الغزال. ماذا يمكن أن تفعل موادّك أنت بالصفحة؟'
    ur: 'نورا ٹائٹلی بتاتی ہیں کہ فارسی مصوری کے رنگ زیادہ تر معدنی تھے: معدن کو سخت پتھر پر باریک پیسا جاتا، چھانا اور دھویا جاتا، پھر انڈے کی سفیدی، سریش یا گوند عربی میں ملایا جاتا۔ نیلا رنگ لاجورد سے نکلتا تھا، اور تانبے کا سبز، یعنی تانبے کو سرکے سے تیار کیا گیا زنجار، کاغذ کو بھربھرا کر دیتا ہے۔ سونے کا ورق ہرن کی کھال کی تہوں کے بیچ سونا کوٹ کر بنتا تھا۔ آپ کے اپنے مواد صفحے کے ساتھ کیا کریں گے؟'
  entity: practice/persian-painting-pigments-and-gold
  sources:
  - source/titley-persian-miniature-painting-1983
- position: within
  kind: career
  title:
    en: A reed pen and soot ink
    ar: قلم من القصب ومداد من السخام
    ur: سرکنڈے کا قلم اور کاجل کی روشنائی
  text:
    en: 'The TDV entry on calligraphy says the hand is written with a reed pen and black soot ink. It gives a rough measure of the nib: about 1 mm for naskh and about 2 to 2.5 mm for thuluth. Gold is applied as gold ink, or as gold leaf fixed with an adhesive made from seed oil and then burnished with a stone called zermuhre. How does the tool set the size of the letter?'
    ar: 'يقول مدخل موسوعة TDV عن الخط إن الخط يُكتب بقلم من القصب ومداد أسود من السخام، ويعطي مقياسًا تقريبيًا لفوهة القلم: نحو ملّيمتر للنسخ، ونحو ملّيمترين إلى ملّيمترين ونصف للثلث. ويُكتب الذهب بمداد ذهبي، أو بورق الذهب الذي يُلصق بمادة لاصقة من زيت البِزر ثم يُصقل بحجر يُسمّى «زرمهره». كيف تحدد الأداة حجم الحرف؟'
    ur: 'ٹی ڈی وی کا اندراج بتاتا ہے کہ خط سرکنڈے کے قلم اور کالی کاجل کی روشنائی سے لکھا جاتا ہے۔ وہ قلم کی نوک کا موٹا اندازہ دیتا ہے: نسخ کے لیے تقریباً ایک ملی میٹر اور ثلث کے لیے تقریباً دو سے ڈھائی ملی میٹر۔ سونا سنہری روشنائی سے، یا سونے کے ورق سے لگایا جاتا ہے جو بیج کے تیل کی بنی گوند سے چپکایا اور پھر «زرمہرہ» نامی پتھر سے چمکایا جاتا ہے۔ قلم حرف کی جسامت کیسے طے کرتا ہے؟'
  entity: job/calligrapher
