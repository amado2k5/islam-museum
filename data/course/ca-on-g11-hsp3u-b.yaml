  ur: بشریات کے نظریات اور طریقے، وہ عوامل جو ثقافت اور رویے کو ڈھالتے ہیں، اور یہ کہ ثقافت سماجی تربیت کے نمونے کیسے پیدا کرتی ہے۔ عجائب گھر اس کی تین توقعات کو جوڑتا ہے، صرف اسلامی مثالوں سے۔
