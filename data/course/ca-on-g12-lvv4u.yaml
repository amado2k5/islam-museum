summary:
  en: 'The Ontario Grade 12 course Classical Civilization, code LVV4U, has five strands: Critical Thinking and Literacy Skills, Mythology and Literature, History and Geography, Philosophy and Religion, and Material Culture. The museum maps parts of strands A, C, D and E only, through the Arabic reception of Greek learning.'
  ar: 'مقرر الحضارة الكلاسيكية للصف الثاني عشر في أونتاريو، رمزه LVV4U، له خمسة محاور: مهارات التفكير النقدي والإلمام بالقراءة والكتابة، والأساطير والأدب، والتاريخ والجغرافيا، والفلسفة والدين، والثقافة المادية. ولا يربط المتحف إلا أجزاء من المحاور A وC وD وE، من خلال تلقّي العالم الإسلامي للعلم اليوناني.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے کورس کلاسیکی تہذیب، کوڈ LVV4U، کی پانچ شاخیں ہیں: تنقیدی سوچ اور خواندگی کی مہارتیں، دیومالا اور ادب، تاریخ اور جغرافیہ، فلسفہ اور مذہب، اور مادی ثقافت۔ میوزیم صرف شاخ A، C، D اور E کے کچھ حصوں کو جوڑتا ہے، یونانی علم کے عالمِ اسلام میں استقبال کے ذریعے۔'
