  title:
    en: A quarter of a dinar is three dirhams
    ar: ربع دينار وهو ثلاثة دراهم
    ur: ایک چوتھائی دینار اور وہ تین درہم
  text:
    en: 'Malik names a sum as a quarter of a dinar, which is three dirhams. The same amount is named in two coins, a part of a dinar and a number of dirhams. Can you name an amount of money in two different ways?'
    ar: 'يسمّي مالك مبلغًا بأنه ربع دينار، وذلك ثلاثة دراهم. المبلغ نفسه مسمّى بعملتين، جزء من دينار وعدد من الدراهم. هل تستطيع أن تسمّي مبلغًا من المال بطريقتين مختلفتين؟'
    ur: 'مالک ایک رقم کو ایک چوتھائی دینار بتاتے ہیں، اور وہ تین درہم ہیں۔ ایک ہی رقم دو سکوں میں بتائی گئی ہے، دینار کا ایک حصہ اور کچھ درہم۔ کیا آپ رقم کی ایک مقدار کو دو مختلف طریقوں سے بتا سکتے ہیں؟'
