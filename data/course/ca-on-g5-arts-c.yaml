expectations:
- code: C1
  text:
    en: apply the creative process to create and perform music for a variety of purposes, using the elements and techniques of music
    ar: طبّق عملية الإبداع لابتكار الموسيقى وأدائها لأغراض متنوعة، مستخدمًا عناصر الموسيقى وتقنياتها
    ur: تخلیقی عمل کو بروئے کار لاتے ہوئے مختلف مقاصد کے لیے موسیقی تخلیق کریں اور پیش کریں، موسیقی کے عناصر اور تکنیکوں کو استعمال کرتے ہوئے
- code: C2
  text:
    en: apply the critical analysis process to communicate their feelings, ideas, and understandings in response to a variety of music and musical experiences
    ar: طبّق عملية التحليل النقدي لتعبّر عن مشاعرك وأفكارك وفهمك استجابةً لأنواع متنوعة من الموسيقى والتجارب الموسيقية
    ur: تنقیدی تجزیے کے عمل کو بروئے کار لاتے ہوئے مختلف قسم کی موسیقی اور موسیقی کے تجربات کے جواب میں اپنے احساسات، خیالات اور فہم کا اظہار کریں
- code: C3
  text:
    en: demonstrate an understanding of a variety of musical genres and styles from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لأنواع وأساليب موسيقية متنوعة من الماضي والحاضر ولسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کی موسیقی کی مختلف اصناف اور اسالیب اور ان کے سماجی، ثقافتی اور تاریخی سیاق کی سمجھ کا مظاہرہ کریں
