  title:
    en: One author on pollution and living with nature
    ar: كاتب عن التلوث والعيش مع الطبيعة
    ur: 'ایک مصنف: آلودگی اور فطرت کے ساتھ رہنا'
  text:
    en: Muhyi al-Din Afifi Ahmad holds that the pollution of water, air and soil threatens the safety of persons and societies, and that international conference resolutions went unimplemented. Islam, he presents, took care that people make good use of their natural environment and coexist with it in a way that preserves its constituents. This is the author's reading, attributed to him. What evidence would you want before agreeing?
    ar: يرى محيي الدين عفيفي أحمد أن تلوث الماء والهواء والأرض يهدد سلامة الأفراد والمجتمعات، وأن قرارات المؤتمرات الدولية لم تُنفَّذ. ويعرض أن الإسلام حرص على أن يحسن الناس استغلال بيئتهم الطبيعية ويتعايشوا معها بما يحفظ مقوماتها. وهذه قراءة الكاتب تُنسب إليه. فأي دليل تريده قبل أن توافقه؟
    ur: محی الدین عفیفی احمد کے نزدیک پانی، ہوا اور زمین کی آلودگی افراد اور معاشروں کی سلامتی کو خطرے میں ڈالتی ہے، اور عالمی کانفرنسوں کی قراردادیں نافذ نہیں ہوئیں۔ وہ بیان کرتے ہیں کہ اسلام نے اس کا اہتمام کیا کہ لوگ اپنے قدرتی ماحول سے اچھا فائدہ اٹھائیں اور اس کے ساتھ اس طرح رہیں کہ اس کے ارکان محفوظ رہیں۔ یہ مصنف کی قراءت ہے جو انہی سے منسوب ہے۔ اتفاق کرنے سے پہلے آپ کون سا ثبوت چاہیں گے؟
