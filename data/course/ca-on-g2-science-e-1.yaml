- position: within
  kind: invention
  title:
    en: A tunnel that brings water out
    ar: نفق يخرج الماء
    ur: پانی باہر لانے والی سرنگ
  text:
    en: Ataie-Ashtiani and Simmons describe a qanat as a gently sloping underground tunnel that brings water out by gravity, so the water runs out downhill, with vertical shafts (straight holes down from the ground) for working, access and maintenance. Al-Karaji wrote a manual on levels and on lining up such a tunnel. Why must the route of such a tunnel be chosen and checked?
    ar: يصف عطائي أشتياني وسيمونز القناة بأنها نفق جوفي خفيف الانحدار يُخرج الماء بفعل الجاذبية، فيجري الماء إلى الخارج نازلًا، وتتخلله آبار رأسية ⁦(حفر مستقيمة نحو الأسفل من سطح الأرض)⁩ للعمل والوصول والصيانة. وقد كتب الكرجي كتابًا في الموازين وضبط مسار مثل هذا النفق. لماذا ينبغي اختيار مسار نفق كهذا والتحقق منه؟
    ur: اتائی اشتیانی اور سیمنز قنات کو ایک ہلکی ڈھلان والی زیرِ زمین سرنگ بتاتے ہیں جو کشش ثقل سے پانی باہر لاتی ہے، یعنی پانی ڈھلان پر بہہ کر نکلتا ہے، اور جس میں کام، رسائی اور دیکھ بھال کے لیے عمودی کنویں ⁦(زمین سے سیدھے نیچے جاتے گڑھے)⁩ ہوتے ہیں۔ الکرجی نے سطح ناپنے اور ایسی سرنگ کی سمت درست رکھنے پر ایک کتاب لکھی۔ ایسی سرنگ کا راستہ کیوں چنا اور جانچا جانا چاہیے؟
  entity: invention/karaji-qanat-surveying
  sources:
  - source/karaji-ataie-simmons-2020
- position: after
  kind: invention
  title:
    en: Lifting water from a well
    ar: رفع الماء من البئر
    ur: کنویں سے پانی اٹھانا
  text:
    en: Al-Jazari describes a machine for raising water from a well or pool with a scoop carried by a moving stem. An animal supplies the motion. Why might a community need a machine to bring water up from a well?
    ar: يصف الجزري آلة ترفع الماء من بئر أو حوض بمغرفة تحملها ساق متحركة. ويمد الحيوان الآلة بالحركة. لماذا قد تحتاج جماعة إلى آلة ترفع الماء من البئر؟
    ur: الجزری ایک ایسی مشین بیان کرتے ہیں جو کنویں یا حوض سے ایک چلتی ہوئی ڈنڈی پر لگے ڈول سے پانی اوپر اٹھاتی ہے۔ جانور حرکت دیتا ہے۔ کسی برادری کو کنویں سے پانی اوپر لانے کے لیے مشین کی ضرورت کیوں پڑ سکتی ہے؟
  entity: invention/jazari-animal-scoop-water-lifter
