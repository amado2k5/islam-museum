  title:
    en: A fountain given to everyone
    ar: سبيل لكل الناس
    ur: سب کے لیے ایک سبیل
  text:
    en: Al-Haddad describes the sabil as a charitable building endowed to give people fresh water every day all year round. He says sabils drew water from wells, pools and springs, or from rain and floods through channels or pipes hidden in walls, and that some had one or two cisterns. Which of these sources of water can you find near your school?
    ar: يعد الحداد السبيل بناءً خيريًا يوقف لسقي الناس الماء العذب كل يوم وعلى مدار العام. ويذكر الحداد أن الأسبلة كانت تستمد الماء من الآبار والبرك والعيون، أو من المطر والسيول عبر مجارٍ أو أنابيب مخفية في الجدران، وأن لبعضها صهريجًا أو صهريجين. أي هذه المصادر للماء تجده قرب مدرستك؟
    ur: الحداد سبیل کو ایک خیراتی عمارت بتاتے ہیں جو لوگوں کو سال بھر روزانہ میٹھا پانی پلانے کے لیے وقف کی جاتی تھی۔ الحداد بتاتے ہیں کہ سبیلیں کنوؤں، تالابوں اور چشموں سے، یا بارش اور سیلاب سے دیواروں میں چھپی نالیوں یا نلکیوں کے ذریعے پانی لیتی تھیں، اور بعض میں ایک یا دو حوض تھے۔ ان میں سے پانی کے کون سے ذرائع آپ کو اپنے اسکول کے قریب ملتے ہیں؟
  entity: concept/sabil
