  title:
    en: Pottery with a metallic sheen
    ar: فخار ببريق معدني
    ur: دھاتی چمک والے برتن
  text:
    en: Arthur Lane, the record says, describes lustre pigment as sulphur in various forms with silver oxide, which stains glass or glaze yellow, and copper oxide, which gives the lustrous element, mixed with ochre and painted on a glazed vessel already fired once. The vessel is fired again lightly in a reducing kiln with little air and much smoke, and the ochre is rubbed away to leave a glittering metallic film. Which steps of this craft change the materials?
    ar: يقول آرثر لين، بحسب السجل، إن صبغة البريق تتكون أساسًا من الكبريت بأشكال مختلفة مع أكسيد الفضة، الذي يعطي على الزجاج أو الطلاء لونًا أصفر، وأكسيد النحاس الذي يعطي عنصر البريق، وتُمزج بمادة ترابية كالمغرة ويُرسم بها على إناء مطلي حُرق مرة. ثم يُحرق الإناء ثانية حرقًا خفيفًا في فرن مختزل قليل الهواء كثير الدخان، وتُحك المغرة فيبقى غشاء معدني لامع. أي خطوات هذه الصنعة تغيّر المواد؟
    ur: ریکارڈ کے مطابق آرتھر لین کہتا ہے کہ چمک کا رنگ بنیادی طور پر مختلف صورتوں میں گندھک اور چاندی کے آکسائیڈ سے بنتا ہے، جو شیشے یا گلیز کو زرد رنگ دیتا ہے، اور تانبے کے آکسائیڈ سے، جو چمک کا عنصر دیتا ہے؛ اسے گیرو جیسی مٹیلی چیز میں ملا کر ایک بار پکائے ہوئے گلیز والے برتن پر لگایا جاتا ہے۔ پھر برتن کو کم ہوا اور زیادہ دھویں والی تخفیفی بھٹی میں ہلکا سا دوبارہ پکایا جاتا ہے اور گیرو رگڑ کر ہٹا دیا جاتا ہے تو ایک چمکتی دھاتی جھلی رہ جاتی ہے۔ اس صنعت کے کون سے مراحل مادّوں کو بدلتے ہیں؟
