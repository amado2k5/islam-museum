- code: A2
  text:
    en: use coding in investigations and to model concepts, and assess the impact of coding and of emerging technologies on everyday life and in STEM-related fields
    ar: استعمل البرمجة في التحقيقات ولنمذجة المفاهيم، وقيِّم أثر البرمجة والتقنيات الناشئة في الحياة اليومية وفي المجالات المرتبطة بالعلوم والتقنية والهندسة والرياضيات
    ur: تحقیقات میں اور تصورات کے نمونے بنانے کے لیے کوڈنگ استعمال کریں اور روزمرہ زندگی اور STEM سے متعلق شعبوں پر کوڈنگ اور ابھرتی ہوئی ٹیکنالوجیوں کے اثر کا جائزہ لیں
- code: A3
  text:
    en: demonstrate an understanding of the practical applications of science and technology, and of contributions to science and technology from people with diverse lived experiences
    ar: أظهر فهمًا للتطبيقات العملية للعلوم والتكنولوجيا ولإسهامات أشخاص من خلفيات حياتية متنوعة في العلوم والتكنولوجيا
    ur: سائنس اور ٹیکنالوجی کے عملی استعمالات اور متنوع زندگی کے تجربات رکھنے والے لوگوں کی سائنس اور ٹیکنالوجی میں خدمات کی سمجھ کا مظاہرہ کریں
