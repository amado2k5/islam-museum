  title:
    en: A half as five tenths
    ar: النصف خمسة أعشار
    ur: آدھا یعنی پانچ دسویں
  text:
    en: A half can be written as five tenths, and half of that as twenty-five hundredths. The record says a book composed at Damascus by al-Uqlidisi has an early direct treatment of such fractions within Indian place-value arithmetic. It adds that this is not the invention of the Indian numerals or of today's decimal point, and that historians disagree about how complete the idea was. How would you write five tenths as a decimal?
    ar: نصف الواحد يمكن أن يُكتب خمسة أعشار، ونصف النصف خمسة وعشرين جزءاً من مئة. يذكر السجل أن في كتاب ألّفه الإقليدسي بدمشق معالجةً مبكرة مباشرة لمثل هذه الكسور داخل الحساب الهندي ذي القيمة المكانية. ويضيف أنها ليست اختراع الأرقام الهندية ولا النقطة العشرية الحالية، وأن المؤرخين مختلفون في مقدار اكتمال المفهوم. كيف تكتب خمسة أعشار عدداً عشرياً؟
    ur: نصف کو پانچ دسویں حصوں اور اس کے نصف کو پچیس سوویں حصوں میں لکھا جا سکتا ہے۔ ریکارڈ بتاتا ہے کہ اقلیدسی کی دمشق میں لکھی ہوئی کتاب میں ہندی مقامی حساب کے اندر ایسے کسور کی ابتدائی براہِ راست بحث ملتی ہے۔ وہ مزید کہتا ہے کہ یہ ہندی ہندسوں یا موجودہ اعشاری نقطے کی ایجاد نہیں، اور نظری مفہوم کی تکمیل پر مؤرخین مختلف رائے رکھتے ہیں۔ پانچ دسویں کو اعشاریے کی شکل میں آپ کیسے لکھیں گے؟
