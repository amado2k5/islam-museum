  title:
    en: The sabil, a water fountain for all
    ar: السبيل، سقاية الماء للناس
    ur: سبیل، سب کے لیے پانی
  text:
    en: Al-Haddad describes a sabil as a charitable building endowed to give people fresh water every day all year round. Sabils drew water from wells, pools and springs, or from rain and floods through well-built channels or pipes hidden in walls. What would happen in a neighbourhood if its water stopped?
    ar: يصف الحداد السبيل بأنه بناء خيري يُوقَف ليسقي الناس الماء العذب كل يوم وعلى مدار العام. وكانت الأسبلة تستمد ماءها من الآبار والبرك والعيون أو من الأمطار والسيول بقنوات محكمة أو أقصاب مغيبة في الجدران. ماذا يحدث في حيّ لو انقطع عنه الماء؟
    ur: الحداد سبیل کو ایک خیراتی عمارت بتاتے ہیں جو وقف کی جاتی تھی تاکہ لوگوں کو ہر روز اور سال بھر میٹھا پانی ملے۔ سبیلیں اپنا پانی کنوؤں، حوضوں اور چشموں سے، یا بارش اور سیلاب کے پانی سے، مضبوط نالیوں یا دیواروں میں چھپے پائپوں کے ذریعے حاصل کرتی تھیں۔ اگر کسی محلے کا پانی بند ہو جائے تو کیا ہوگا؟
  entity: concept/sabil
  sources:
  - source/haddad-asbila-makka-madina-2004
- position: after
  kind: place
  title:
    en: A hospital in Baghdad
    ar: مستشفى في بغداد
    ur: بغداد کا ایک ہسپتال
  text:
    en: In Baghdad Adud al-Dawla built a hospital. The record, following Ibn al-Jawzi, says physicians, medicines, stewards, servants, vessels and clothing were gathered there, and the poor were given the clothing and vessels that left it. Who looks after the sick in your community?
    ar: بنى عضد الدولة في بغداد بيمارستانًا. ويذكر السجل، نقلًا عن ابن الجوزي، أنه جُمع فيه الأطباء والأدوية والقوّام والخدم والآنية والكسوة، وأن الفقراء أُعطوا الكسوة والآنية التي خرجت منه. من يعتني بالمرضى في مجتمعك؟
    ur: بغداد میں عضد الدولہ نے ایک ہسپتال بنوایا۔ ریکارڈ، ابن الجوزی کے حوالے سے، بتاتا ہے کہ وہاں طبیب، دوائیں، نگران، خادم، برتن اور کپڑے جمع کیے گئے، اور غریبوں کو وہ کپڑے اور برتن دیے گئے جو اس سے نکلتے تھے۔ آپ کی برادری میں بیماروں کا خیال کون رکھتا ہے؟
  entity: building/bimaristan-adudi
