expectations:
- code: B1.1
  text:
    en: describe some of the ways in which people interact with the natural environment and the built features of, and human services in, the local community to meet their needs, and what might happen if these features/services did not exist
    ar: صِف بعض الطرق التي يتفاعل بها الناس مع البيئة الطبيعية والمعالم المبنية والخدمات البشرية في المجتمع المحلي لتلبية حاجاتهم، وماذا قد يحدث لو لم تكن هذه المعالم أو الخدمات موجودة
    ur: بیان کریں کہ لوگ اپنی ضرورتیں پوری کرنے کے لیے مقامی برادری کے قدرتی ماحول، تعمیر شدہ خصوصیات اور انسانی خدمات سے کن طریقوں سے کام لیتے ہیں، اور اگر یہ خصوصیات یا خدمات نہ ہوتیں تو کیا ہو سکتا تھا
- code: B1.2
  text:
    en: identify some services and service-related occupations in their community […], and describe how they meet people’s needs, including their own needs
    ar: حدّد بعض الخدمات والمهن المرتبطة بها في مجتمعهم المحلي […]، وصِف كيف تلبّي حاجات الناس، ومنها حاجاتهم هم
    ur: اپنی برادری کی کچھ خدمات اور ان سے متعلق پیشوں کی نشاندہی کریں […]، اور بیان کریں کہ وہ لوگوں کی ضرورتیں، بشمول ان کی اپنی ضرورتیں، کیسے پوری کرتے ہیں
