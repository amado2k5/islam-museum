  title:
    en: Moving the markets
    ar: نقل الأسواق
    ur: بازاروں کی منتقلی
  text:
    en: Al-Duri attributes to al-Mansur an order of 773 CE to move the markets from the city toward Karkh, for security. Le Strange describes the stalls being removed from the arcades, which were then used as barracks for the city police and horse guards. The sources give a security reason, not a measured result. What did each use of the space serve?
    ar: ينسب الدوري إلى المنصور أمراً سنة 773م بنقل الأسواق من المدينة نحو الكرخ بدافع الأمن. ويصف لسترنج إزالة المحال من الأروقة، ثم استعمال الأروقة ثكنات لشرطة المدينة وحرس الخيل. وتذكر المصادر سبباً أمنياً ولا تذكر نتيجة مقيسة. ماذا كان كل استعمال للمكان يخدم؟
    ur: الدوری منصور سے منسوب ایک حکم بیان کرتے ہیں، 773ء میں، کہ بازار شہر سے کرخ کی طرف منتقل کیے جائیں، سلامتی کی وجہ سے۔ لسٹرینج بتاتے ہیں کہ دکانیں راہداریوں سے ہٹا دی گئیں، اور ان راہداریوں کو بعد میں شہر کی پولیس اور گھڑ سوار پہرے کی بیرکوں کے طور پر استعمال کیا گیا۔ ماخذ سلامتی کی وجہ بتاتے ہیں، کسی ناپے گئے نتیجے کا ذکر نہیں کرتے۔ جگہ کے ہر استعمال سے کس کا مقصد پورا ہوتا تھا؟
