  title:
    en: Land for those who work it
    ar: الأرض لمن يعمل فيها
    ur: زمین ان کے لیے جو اس پر کام کرتے ہیں
  text:
    en: When the Sawad was conquered, the people asked Sa'd to divide it, and Sa'd wrote to Umar. Umar told him to divide the goods and the horses after the fifth and to leave the land and the rivers to their workers, saying that if he divided it among those present, nothing would remain for those who came after. Who had a claim on this land?
    ar: لما فُتح السواد طلب الناس من سعد أن يقسمه، فكتب سعد إلى عمر. فأمره عمر أن يقسم المال والكراع بعد الخمس وأن يترك الأرض والأنهار لعمالها، وقال إنه إن قسمها بين من حضر لم يكن لمن يبقى بعدهم شيء. من كان له حق في هذه الأرض؟
    ur: جب سواد فتح ہوا تو لوگوں نے سعد سے کہا کہ اسے تقسیم کر دیں، تو سعد نے عمر کو لکھا۔ عمر نے حکم دیا کہ مال اور سواریاں خمس کے بعد تقسیم کی جائیں اور زمین اور نہریں ان کے کام کرنے والوں کے پاس رہنے دی جائیں، اور کہا کہ اگر وہ موجود لوگوں میں اسے بانٹ دیں تو بعد میں آنے والوں کے لیے کچھ نہ بچے گا۔ اس زمین پر کس کا حق تھا؟
  entity: event/umar-sawad-settlement
