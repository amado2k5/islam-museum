  title:
    en: A day of fasting and what it remembers
    ar: يوم صيام وما يتذكّره
    ur: روزے کا ایک دن اور اس کی یاد
  text:
    en: Ashura is the tenth of Muharram. The Kuwaiti encyclopaedia of jurisprudence reports that Quraysh fasted it in the Jahiliyya and that the Prophet fasted it. In one report it gives, arriving in Medina he found the Jews fasting it as a righteous day on which God saved the Children of Israel from their enemy, so Musa fasted it; he fasted it and ordered it fasted. Which incident does the fast remember?
    ar: عاشوراء هو العاشر من محرم. وتذكر الموسوعة الفقهية الكويتية أن قريشًا كانت تصومه في الجاهلية وأن النبي صامه. وفي رواية تنقلها أنه لما قدم المدينة وجد اليهود يصومونه، وهو يوم صالح نجّى الله فيه بني إسرائيل من عدوهم فصامه موسى، فصامه وأمر بصيامه. أيّ واقعة يتذكّرها هذا الصيام؟
    ur: عاشوراء محرم کی دسویں تاریخ ہے۔ کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ قریش جاہلیت میں اس کا روزہ رکھتے تھے اور نبی نے بھی رکھا۔ ایک روایت میں جو وہ نقل کرتا ہے، مدینہ پہنچ کر انہوں نے یہودیوں کو اس دن روزہ رکھتے پایا، یہ ایک نیک دن ہے جس میں اللہ نے بنی اسرائیل کو ان کے دشمن سے نجات دی تو موسیٰ نے اس کا روزہ رکھا؛ انہوں نے بھی رکھا اور اس کا حکم دیا۔ یہ روزہ کس واقعے کی یاد دلاتا ہے؟
