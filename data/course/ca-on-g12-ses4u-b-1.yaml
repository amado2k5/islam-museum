- position: before
  kind: invention
  title:
    en: One plate for many latitudes
    ar: صفيحة واحدة لعروض كثيرة
    ur: ایک تختی، کئی عرض بلد
  text:
    en: In eleventh-century Toledo, Ibrahim ibn Yahya al-Zarqali developed an astronomical plate that did not need a new horizon plate whenever the observer's latitude changed. The record presents it as a development of the astrolabe, and says "universal" describes a design suited to different latitudes, not a device that finds place and time without knowledge or reading. Why would a maker want one plate for many latitudes?
    ar: في طليطلة في القرن الحادي عشر طور إبراهيم بن يحيى الزرقالي صفيحة فلكية لا تستلزم تبديل صفيحة الأفق كلما تغير عرض الراصد. وهي تطوير للأسطرلاب، و«جامعة» وصف لصلاحية التصميم للعروض المختلفة، لا لآلة تستخرج مكان الإنسان والساعة وحدها من غير معرفة أو قراءة. لماذا يريد صانع الأداة صفيحة واحدة لعروض كثيرة؟
    ur: گیارہویں صدی کے طلیطلہ میں ابراہیم بن یحییٰ الزرقالی نے ایسی فلکی تختی بنائی جس میں مشاہدہ کرنے والے کا عرض بلد بدلنے پر افق کی تختی بدلنا ضروری نہ تھا۔ یہ اسطرلاب کی روایت میں بہتری تھی، اور «جامع» کا مطلب مختلف عرض بلد کے لیے موزوں ڈیزائن ہے، ایسا آلہ نہیں جو علم یا قرأت کے بغیر خود مقام اور وقت معلوم کر لے۔ ایک صانع ایک ہی تختی کو کئی عرض بلد کے لیے کیوں چاہے گا؟
