  title:
    en: The astrolabe as a staff and threads
    ar: الأسطرلاب عصا وخيوطاً
    ur: اسطرلاب بطور عصا و دھاگے
  text:
    en: 'Sharaf al-Din al-Tusi is credited with a different arrangement from the plane astrolabe: a graduated staff, used with threads, that performs some of its work. The marks are not simply a ruler''s equal divisions; they carry astronomical and angular information. The account also states limits, especially in azimuth and meridian problems: a simple shape did not preserve every function equally well. What did this design give up for its simplicity?'
    ar: 'تصور الأسطرلاب المسطح صفحة تحمل دوائر السماء؛ أما شرف الدين الطوسي فارتبط بمحاولة مختلفة: حمل بعض أعمال تلك الصفحة على عصا مدرجة تستعمل معها خيوط. والعلامات ليست مقياس طول فحسب، لأنها تمثل مقادير فلكية وأوتار زوايا. ويذكر الوصف المنشور عجزاً أو خشونة في نتائج مسائل للسمت وخط الزوال. ماذا تخلى عنه هذا التصميم مقابل بساطته؟'
    ur: 'شرف الدین طوسی سے منسوب تبدیلی میں مسطح اسطرلاب کے کام کا کچھ حصہ ایک مدرج عصا اور دھاگوں کو سونپا گیا۔ یہ صرف لمبائی ناپنے کی لکڑی نہیں تھی، کیونکہ اس کی علامتیں فلکی مقداروں اور زاویوں کے اوتار کی خبر دیتی تھیں۔ بیان خود سمت اور خط نصف النہار کے بعض مسائل میں کمی یا موٹے اندازے بتاتا ہے: سادہ شکل کا مطلب یہ نہیں کہ ہر کام آسان یا ہر نتیجہ بہتر ہو گیا۔ اس ڈیزائن نے سادگی کے بدلے کیا چھوڑا؟'
