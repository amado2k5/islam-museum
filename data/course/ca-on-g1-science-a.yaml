expectations:
- code: A1
  text:
    en: use a scientific research process, a scientific experimentation process, and an engineering design process to conduct investigations, following appropriate health and safety procedures
    ar: استخدام عملية البحث العلمي وعملية التجريب العلمي وعملية التصميم الهندسي لإجراء استقصاءات، مع اتباع إجراءات الصحة والسلامة المناسبة
    ur: تحقیقات کرنے کے لیے سائنسی تحقیق کا عمل، سائنسی تجربے کا عمل اور انجینئرنگ ڈیزائن کا عمل استعمال کرنا، اور مناسب صحت و حفاظت کے طریقوں پر عمل کرنا
- code: A2
  text:
    en: use coding in investigations and to model concepts, and assess the impact of coding and of emerging technologies on everyday life
    ar: استخدام الترميز في الاستقصاءات ولنمذجة المفاهيم، وتقييم أثر الترميز والتقنيات الناشئة في الحياة اليومية
    ur: تحقیقات میں اور تصورات کی ماڈلنگ کے لیے کوڈنگ استعمال کرنا، اور روزمرہ زندگی پر کوڈنگ اور ابھرتی ہوئی ٹیکنالوجیوں کے اثر کا جائزہ لینا
- code: A3
  text:
    en: demonstrate an understanding of the practical applications of science and technology, and of contributions to science and technology from people with diverse lived experiences
    ar: إظهار فهم التطبيقات العملية للعلوم والتقنية، وإسهامات أصحاب التجارب الحياتية المتنوعة في العلوم والتقنية
    ur: سائنس و ٹیکنالوجی کے عملی استعمالات کی، اور متنوع زندگی کے تجربات رکھنے والے لوگوں کی سائنس و ٹیکنالوجی میں خدمات کی سمجھ ظاہر کرنا
