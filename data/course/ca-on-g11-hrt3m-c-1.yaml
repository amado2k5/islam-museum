- position: after
  kind: place
  title:
    en: Circling the Sacred House
    ar: الطواف بالبيت الحرام
    ur: بیت الحرام کا طواف
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence defines tawaf as circling a thing; in usage, circling the Sacred House, with the mataf as its place. It describes the arrival tawaf as prescribed for one arriving from outside Mecca to greet the House. What might the pilgrim's first act on arrival tell us about the journey?
    ar: تعرّف الموسوعة الفقهية الكويتية الطواف بأنه في اللغة الدوران حول الشيء، وفي الاستعمال الدوران حول البيت الحرام، والمطاف موضعه. وتذكر أن طواف القدوم مشروع لمن قدم من خارج مكة لتحية البيت. ماذا يخبرنا أول عمل للحاج عند وصوله عن الرحلة؟
    ur: 'کویتی فقہی انسائیکلوپیڈیا طواف کی تعریف یوں کرتا ہے: لغت میں کسی چیز کے گرد گھومنا، اور استعمال میں بیت الحرام کے گرد گھومنا؛ مطاف اس کی جگہ ہے۔ وہ بتاتا ہے کہ طوافِ قدوم مکہ سے باہر سے آنے والے کے لیے بیت اللہ کو سلام کرنے کے طور پر مقرر ہے۔ پہنچنے پر حاجی کا پہلا عمل ہمیں سفر کے بارے میں کیا بتاتا ہے؟'
