  title:
    en: A journey with set conditions
    ar: رحلة لها شروط
    ur: شرائط والا سفر
  text:
    en: In Arabic hajj means heading for something. The Kuwaiti encyclopaedia of jurisprudence defines it in legal usage as heading for the Sacred House and Arafa at a set time to perform set acts, which most scholars name as standing at Arafa, the tawaf and the sa'y. It holds hajj to be a once-in-a-lifetime duty on every responsible person who is able, and a pillar of Islam. The entry gives the rite's conditions, not the pilgrim's experience of it. How does a journey with such conditions shape the traveller's quest?
    ar: الحج في اللغة القصد. وتعرّفه الموسوعة الفقهية الكويتية في الاصطلاح بأنه قصد البيت الحرام وعرفة في وقت مخصوص لأداء أعمال مخصوصة، هي عند أكثر العلماء الوقوف بعرفة والطواف والسعي. وترى أنه فرض مرة في العمر على كل مكلف مستطيع وركن من أركان الإسلام. والمدخل يذكر شروط الشعيرة لا تجربة الحاج فيها. كيف تشكّل رحلة بهذه الشروط سعي المسافر؟
    ur: عربی میں حج کا مطلب کسی چیز کا قصد کرنا ہے۔ کویتی فقہی انسائیکلوپیڈیا شرعی اصطلاح میں اسے مقررہ وقت پر بیت الحرام اور عرفہ کا قصد کر کے مقررہ اعمال ادا کرنا بتاتا ہے، جو اکثر علما کے نزدیک عرفہ میں وقوف، طواف اور سعی ہیں۔ اس کے نزدیک حج ہر استطاعت رکھنے والے مکلف پر عمر میں ایک بار فرض اور اسلام کا رکن ہے۔ اندراج رسم کی شرائط بتاتا ہے، حاجی کا تجربہ نہیں۔ ایسی شرائط والا سفر مسافر کی تلاش کو کیسے ڈھالتا ہے؟
  entity: practice/hajj
