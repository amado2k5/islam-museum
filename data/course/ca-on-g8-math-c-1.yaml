  title:
    en: Restoring and cancelling
    ar: الجبر والمقابلة
    ur: جبر اور مقابلہ
  text:
    en: The editors of the 1939 Cairo edition note that the name of this science in every language comes from al-jabr, the word al-Khwarizmi used as the title of his book. In his problems al-jabr is completing a quantity that has a deficiency or deduction by adding its like to both sides, and al-muqabala is casting away like terms from both sides. What do both operations leave unchanged?
    ar: يذكر محققا طبعة القاهرة سنة 1939 أن اسم هذا العلم في جميع اللغات مشتق من كلمة «الجبر» التي جعلها الخوارزمي اسماً لكتابه. و«الجبر» في مسائله أن يُكمل ما فيه نقص أو استثناء بزيادة مثله على الطرفين، و«المقابلة» أن يُلقى المتماثل من الطرفين. ماذا تُبقي العمليتان دون تغيير؟
    ur: 1939ء کی قاہرہ طبع کے مرتبین بتاتے ہیں کہ اس علم کا نام ہر زبان میں اس لفظ «الجبر» سے نکلا ہے جسے الخوارزمی نے اپنی کتاب کا نام بنایا۔ اس کے مسائل میں «جبر» یہ ہے کہ جس مقدار میں کمی یا استثنا ہو اسے دونوں طرف اس جیسی مقدار جمع کر کے پورا کیا جائے، اور «مقابلہ» یہ ہے کہ دونوں طرف سے ایک جیسے اجزا ہٹا دیے جائیں۔ دونوں عمل کس چیز کو بدلے بغیر چھوڑتے ہیں؟
  entity: concept/algebra
