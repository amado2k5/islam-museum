- position: within
  kind: reflection
  title:
    en: A square and ten roots
    ar: مال وعشرة أجذار
    ur: ایک مال اور دس جذر
  text:
    en: 'Al-Khwarizmi divided everything needed in reckoning by al-jabr and al-muqabala into six types of equation, resting on three kinds of number: the root, the square (mal) and the simple number. One of his examples is "a square and ten of its roots equal thirty-nine dirhams", where the root comes out as three and the square as nine. Put three into that example: does the equation hold?'
    ar: 'قسّم الخوارزمي كل ما يحتاج إليه في حساب الجبر والمقابلة إلى ستة ضروب من المعادلات، مبنية على ثلاثة أنواع من الأعداد: الجذر والمال والعدد المفرد. ومن أمثلته «مال وعشرة أجذاره يعدل تسعة وثلاثين درهماً»، فيخرج الجذر ثلاثة والمال تسعة. عوّض الثلاثة في هذا المثال: هل تتحقق المعادلة؟'
    ur: 'الخوارزمی نے جبر و مقابلہ کے حساب میں درکار ہر بات کو مساواتوں کی چھ قسموں میں بانٹا، جو تین قسم کے اعداد پر قائم ہیں: جذر، مال اور سادہ عدد۔ اس کی ایک مثال «ایک مال اور اس کے دس جذر انتالیس درہم کے برابر ہیں» ہے، جس میں جذر تین اور مال نو نکلتا ہے۔ اس مثال میں تین رکھ کر دیکھیں: کیا مساوات پوری ہوتی ہے؟'
  entity: concept/al-durub-al-sitta
