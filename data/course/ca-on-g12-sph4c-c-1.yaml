connections:
- position: before
  kind: invention
  title:
    en: Wheels on one shaft, wheels in mesh
    ar: عجلات على محور واحد وعجلات متعشقة
    ur: ایک ہی محور پر پہیے، اور دندانوں میں جڑے پہیے
  text:
    en: Al-Biruni described an older device, the Moon Box, and proposed simplifying its solar gearing. In his proposal a four-tooth gear sits on the same arbor as a forty-tooth wheel, so they turn together, and the four meshes with a fifty-two-tooth wheel. The record says a shared arbor passes on the same rotation, while a mesh changes speed according to the tooth counts. Which pairs in this train share a shaft, and which mesh?
    ar: وصف البيروني آلة أقدم تسمى صندوق القمر، ثم اقترح تبسيطًا في تعشيقها الشمسي. وفي مقترحه يوضع ترس بأربع أسنان على محور ترس الأربعين نفسه، فيدوران معًا، ويعشق ترس الأربع ترسًا باثنتين وخمسين. ويقول السجل إن المحور المشترك ينقل الدوران نفسه، أما التعشيق فيغيّر السرعة بحسب عدد الأسنان. أي أزواج هذه السلسلة تشترك في محور، وأيها تتعشق؟
    ur: بیرونی نے ایک پرانی مشین بیان کی جسے «صندوقِ قمر» کہا جاتا ہے، پھر اس کے شمسی دندانہ جوڑ کو سادہ بنانے کی تجویز دی۔ اس کی تجویز میں چار دندانوں والا پہیہ چالیس دندانوں والے پہیے کے اسی محور پر بیٹھا ہے، اس لیے دونوں ساتھ گھومتے ہیں، اور چار والا پہیہ باون دندانوں والے پہیے سے جڑتا ہے۔ ریکارڈ کہتا ہے کہ مشترک محور وہی گردش آگے پہنچاتا ہے، جبکہ دندانوں کا جوڑ دندانوں کی تعداد کے مطابق رفتار بدلتا ہے۔ اس سلسلے کے کون سے جوڑے ایک محور میں شریک ہیں اور کون سے آپس میں جڑتے ہیں؟
