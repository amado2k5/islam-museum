  title:
    en: A due on wealth
    ar: حق في المال
    ur: مال میں واجب حق
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says zakat names both the due paid on specified wealth, under hawla and nisab conditions, and the portion itself; it is so called because it purifies and fructifies wealth. It cites the Prophet''s instruction to Mu''adh for Yemen: a sadaqa on their wealth, ''taken from their rich and returned to their poor''. What does this practice ask of a believer?'
    ar: تقول الموسوعة الفقهية الكويتية إن الزكاة اسم للحق الواجب في مال مخصوص على وجه مخصوص بشرطي الحول والنصاب، وللقدر المخرج نفسه، وسُمّيت بذلك لأنها تطهّر المال وتنمّيه. وتورد وصية النبي لمعاذ إلى اليمن بأن الله فرض عليهم صدقة في أموالهم تؤخذ من أغنيائهم وترد على فقرائهم. ماذا تطلب هذه الشعيرة من المؤمن؟
    ur: کویتی فقہی انسائیکلوپیڈیا کے مطابق زکوٰۃ نام ہے اس واجب حق کا جو مخصوص مال میں مخصوص طریقے سے، حولان اور نصاب کی شرطوں کے ساتھ ادا کیا جاتا ہے، اور اس ادا شدہ حصے کا بھی؛ اسے زکوٰۃ اس لیے کہتے ہیں کہ وہ مال کو پاک اور بابرکت بناتی ہے۔ وہ نبی کی معاذ کو یمن کے لیے ہدایت نقل کرتا ہے کہ اللہ نے ان کے مالوں میں صدقہ فرض کیا ہے جو ان کے مال داروں سے لیا جائے اور ان کے غریبوں کو لوٹایا جائے۔ یہ عمل مومن سے کیا چاہتا ہے؟
  entity: practice/zakat
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: after
  kind: reflection
  title:
    en: A month marked by the crescent
    ar: شهر يبدأ بالهلال
    ur: ہلال سے شروع ہونے والا مہینہ
  text:
    en: Muslims fast in Ramadan by abstaining from food and drink from dawn to sunset. The Kuwaiti encyclopaedia of jurisprudence says the month is established by sighting its crescent, or by completing Sha'ban to thirty days when sighting fails. For its last ten nights it reports that the jurists agree it is recommended to redouble effort in night prayer, alms and reciting and studying the Qur'an, and that i'tikaf is emphatically recommended. How do these practices turn a month on the calendar into a spiritual season?
    ar: يصوم المسلمون في رمضان بالإمساك عن الطعام والشراب من الفجر إلى الغروب. وتقول الموسوعة الفقهية الكويتية إن رمضان يثبت برؤية هلاله، أو بإكمال شعبان ثلاثين يومًا إذا تعذّرت الرؤية. وتذكر في عشره الأواخر اتفاق الفقهاء على استحباب الاجتهاد فيها بقيام الليل والصدقة وتلاوة القرآن ومدارسته، وتأكّد استحباب الاعتكاف فيها. كيف تحوّل هذه الأعمال شهرًا في التقويم إلى موسم روحي؟
    ur: مسلمان رمضان میں فجر سے غروبِ آفتاب تک کھانے پینے سے رک کر روزہ رکھتے ہیں۔ کویتی فقہی انسائیکلوپیڈیا کے مطابق رمضان ہلال کے دکھائی دینے سے ثابت ہوتا ہے، اور اگر رویت نہ ہو سکے تو شعبان کے تیس دن پورے کرنے سے۔ وہ اس کی آخری دس راتوں کے بارے میں بتاتا ہے کہ فقہا کا اتفاق ہے کہ ان میں قیامِ لیل، صدقہ اور قرآن کی تلاوت و مدارست میں زیادہ کوشش مستحب ہے، اور اعتکاف کا مستحب ہونا خاص طور پر مؤکد ہے۔ یہ اعمال کیلنڈر کے ایک مہینے کو روحانی موسم کیسے بنا دیتے ہیں؟
