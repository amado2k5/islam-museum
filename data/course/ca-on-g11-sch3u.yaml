summary:
  en: 'The Ontario Grade 11 course SCH3U: six strands, from investigation skills to matter, reactions, quantities, solutions and gases. The museum maps seven expectations, through the history of chemistry and water in the Islamic world.'
  ar: 'مقرر SCH3U للصف الحادي عشر في أونتاريو: ستة محاور، من مهارات التقصي إلى المادة والتفاعلات والكميات والمحاليل والغازات. ويربط المتحف سبع توقعات، عبر تاريخ الكيمياء والماء في العالم الإسلامي.'
  ur: 'اونٹاریو کا کورس SCH3U برائے جماعت یازدہم: چھ شاخیں، تحقیقی مہارتوں سے لے کر مادّے، تعاملات، مقداروں، محلولوں اور گیسوں تک۔ عجائب گھر سات توقعات کو جوڑتا ہے، اسلامی دنیا میں کیمیا اور پانی کی تاریخ کے ذریعے۔'
  es: "El curso SCH3U de 11.º grado de Ontario abarca seis ejes temáticos, desde habilidades de investigación hasta materia, reacciones, cantidades, disoluciones y gases. El museo presenta siete objetivos de aprendizaje a través de la historia de la química y el agua en el mundo islámico."
  fr: "Le cours SCH3U de 11e année en Ontario comprend six volets, allant des techniques d'investigation à la matière, aux réactions, aux quantités, aux solutions et aux gaz. Le musée illustre sept attentes à travers l'histoire de la chimie et de l'eau dans le monde islamique."
