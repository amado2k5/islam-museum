  title:
    en: A qawwal meets a record label
    ar: قوّال يلتقي شركة تسجيلات
    ur: ایک قوال اور ریکارڈ کمپنی کا ملاپ
  text:
    en: Nusrat Fateh Ali Khan was a Pakistani qawwal of the Qawwal Bachon ka Gharana of Delhi. The record says that in 1988 he worked with Peter Gabriel on the score of The Last Temptation of Christ, that in 1989 he signed with Real World, and that he reached a wider audience with albums such as Mustt Mustt in 1990. What may change, and what may stay, when a devotional tradition reaches a record label?
    ar: نصرت فتح علي خان قوّال باكستاني من «قوال بچوں کا گھرانہ» في دلهي. وتذكر صفحته أنه تعاون سنة 1988 مع بيتر غابرييل على موسيقى فيلم «الإغواء الأخير للمسيح»، ثم وقّع مع Real World سنة 1989 فاتسع جمهوره بألبومات منها «Mustt Mustt» سنة 1990. ماذا قد يتغير وماذا قد يبقى حين يبلغ فنٌّ تعبدي شركة تسجيلات؟
    ur: نصرت فتح علی خان «قوال بچوں کا گھرانہ» دہلی سے تعلق رکھنے والے پاکستانی قوال تھے۔ ریکارڈ کے مطابق انہوں نے 1988 میں پیٹر گیبریل کے ساتھ فلم «دی لاسٹ ٹیمپٹیشن آف کرائسٹ» کی موسیقی پر کام کیا، 1989 میں Real World سے معاہدہ کیا، اور 1990 کے «Mustt Mustt» جیسے البموں سے ان کے سامعین بڑھے۔ جب ایک عبادتی روایت ریکارڈ کمپنی تک پہنچتی ہے تو کیا بدل سکتا ہے اور کیا باقی رہ سکتا ہے؟
  entity: person/nusrat-fatih-ali-khan
