  title:
    en: A nasheed group on a world stage
    ar: فرقة نشيد على مسرح عالمي
    ur: عالمی اسٹیج پر ایک نشید گروپ
  text:
    en: Raihan is a Malaysian nasheed group founded in 1996, known for its debut album Puji-Pujian on Warner Music Malaysia. The record says that in 1997 it was invited to perform at the Commonwealth Heads of Government Meeting in Edinburgh, and that in Indonesia its compilation Koleksi Nasyid Terbaik sold more than 200,000 copies. What carries a devotional song from a local community to audiences like these?
    ar: ريحان فرقة نشيد ماليزية تأسست سنة 1996، واشتهرت بألبومها الأول «بوجي بوجيان» عن وارنر ميوزك ماليزيا. وتذكر صفحتها أنها دُعيت سنة 1997 إلى الغناء في اجتماع رؤساء حكومات الكومنولث في إدنبرة، وأن مجموعتها «أفضل الأناشيد» باعت في إندونيسيا أكثر من مئتي ألف نسخة. ما الذي ينقل أغنية تعبدية من جماعة محلية إلى جمهور كهذا؟
    ur: رائحان ایک ملائیشیائی نشید گروپ ہے جو 1996 میں قائم ہوا، اور وارنر میوزک ملائیشیا پر اپنے پہلے البم «پوجی پوجیان» سے مشہور ہوا۔ ریکارڈ کے مطابق اسے 1997 میں ایڈنبرا میں دولتِ مشترکہ کے سربراہانِ حکومت کے اجلاس میں پیش کش کی دعوت ملی، اور انڈونیشیا میں اس کا مجموعہ «Koleksi Nasyid Terbaik» دو لاکھ سے زیادہ بکا۔ عبادتی گیت کو مقامی برادری سے ایسے سامعین تک کون پہنچاتا ہے؟
