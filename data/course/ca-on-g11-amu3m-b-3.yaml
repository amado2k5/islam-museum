  title:
    en: Qawwali, ambient sound and Senegal
    ar: القوالي والموسيقى المحيطية وسنغال
    ur: قوالی، ایمبینٹ آواز اور سینیگال
  text:
    en: Night Song is a joint album of Nusrat Fateh Ali Khan and the Canadian musician Michael Brook, recorded in 1995 at Real World Studios and released in 1996. The record says it joins qawwali vocals to Brook's electronic ambient music, with musicians from Baaba Maal's Senegalese band, and that it reached number 4 on Billboard's world albums chart. Which traditions can you hear meeting in it?
    ar: «Night Song» ألبوم مشترك لنصرت فتح علي خان والموسيقي الكندي مايكل بروك، سُجّل سنة 1995 في استوديوهات ريل وورلد وصدر سنة 1996. وتذكر صفحته أنه يجمع صوت القوالي بموسيقى بروك المحيطية الإلكترونية، وشارك فيه موسيقيون من فرقة بابا مال السنغالية، وبلغ المرتبة الرابعة في قائمة بيلبورد للموسيقى العالمية. أي تقاليد تستطيع أن تسمعها تلتقي فيه؟
    ur: «Night Song» نصرت فتح علی خان اور کینیڈین موسیقار مائیکل بروک کا مشترکہ البم ہے، جو 1995 میں ریئل ورلڈ اسٹوڈیوز میں ریکارڈ ہوا اور 1996 میں جاری ہوا۔ ریکارڈ کے مطابق یہ قوالی کی آواز کو بروک کی الیکٹرانک ایمبینٹ موسیقی سے جوڑتا ہے، اس میں بابا مال کے سینیگالی گروپ کے موسیقار شریک تھے، اور یہ بل بورڈ کے عالمی البموں کے چارٹ پر چوتھے نمبر تک پہنچا۔ آپ اس میں کون سی روایتیں ملتی سن سکتے ہیں؟
