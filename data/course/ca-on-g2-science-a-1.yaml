  title:
    en: A family that gathered learning
    ar: أسرة جمعت العلم
    ur: ایک خاندان جس نے علم جمع کیا
  text:
    en: Ibn al-Nadim describes Muhammad, Ahmad and al-Hasan, the sons of Musa ibn Shakir, as men who pursued the ancient sciences to the utmost. He says geometry, mechanical devices, motion, music and astronomy were the sciences that dominated them, and that they brought copyists (people who copied books) from distant regions with generous pay. Among their books are "Mechanical Devices" by Ahmad and a book on the pneumatics. What can a family contribute when it spends its wealth on learning?
    ar: يصف ابن النديم محمدًا وأحمد والحسن، أبناء موسى بن شاكر، بأنهم ممن تناهى في طلب العلوم القديمة. ويذكر أن الغالب عليهم من العلوم الهندسة والحيل والحركات والموسيقى والنجوم، وأنهم أحضروا النقلة ⁦(الذين ينسخون الكتب)⁩ من الأصقاع البعيدة بالبذل السني. ومن كتبهم «الحيل» لأحمد، و«كتاب بني موسى في الفرستون». ماذا تستطيع أسرة أن تسهم به حين تنفق مالها في طلب العلم؟
    ur: ابن الندیم محمد، احمد اور حسن، موسیٰ بن شاکر کے بیٹوں، کو ان لوگوں میں شمار کرتے ہیں جنہوں نے قدیم علوم کے حصول میں انتہا کر دی۔ وہ بتاتے ہیں کہ ان پر ہندسہ، میکانی آلات، حرکت، موسیقی اور فلکیات کے علوم غالب تھے، اور انہوں نے دور دراز علاقوں سے نقل نویسوں ⁦(کتابیں نقل کرنے والوں)⁩ کو فراخ معاوضے پر بلایا۔ ان کی کتابوں میں احمد کی «میکانی آلات» اور ہوا کے دباؤ ⁦(نیومیٹکس)⁩ پر ایک کتاب شامل ہے۔ جب کوئی خاندان اپنی دولت علم پر خرچ کرے تو وہ کیا حصہ ڈال سکتا ہے؟
