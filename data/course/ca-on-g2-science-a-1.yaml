  title:
    en: Mathematics meets water
    ar: الرياضيات تلتقي بالماء
    ur: ریاضی کی پانی سے ملاقات
  text:
    en: 'Al-Karaji was a mathematician and engineer: MacTutor describes algebraic work followed by later engineering interests. Ataie-Ashtiani and Simmons describe his book on hidden waters as using levels, tools for measuring heights, together with geometry to explain how to line up a tunnel so that it can carry water. How do mathematics and engineering help each other with a problem about water?'
    ar: كان الكرجي رياضيًا ومهندسًا؛ ويصف موقع ماكتيوتر أعماله الجبرية ثم اهتماماته الهندسية المتأخرة. ويصف عطائي أشتياني وسيمونز كتابه في استنباط المياه الخفية بأنه يستعمل الموازين، وهي أدوات لقياس الارتفاعات، مع البرهان الهندسي لشرح كيفية ضبط مسار نفق حتى يحمل الماء. كيف تعين الرياضيات والهندسة إحداهما الأخرى في مسألة تتعلق بالماء؟
    ur: الکرجی ریاضی دان اور انجینئر تھے؛ میک ٹیوٹر ان کے الجبرائی کام اور بعد کی انجینئری دلچسپیوں کا ذکر کرتا ہے۔ اتائی اشتیانی اور سیمنز بتاتے ہیں کہ پوشیدہ پانیوں پر ان کی کتاب سطح ناپنے کے آلات، یعنی اونچائی ناپنے کے اوزار، اور ہندسی وضاحت کو استعمال کرتی ہے تاکہ سمجھایا جا سکے کہ سرنگ کو کیسے سیدھ میں رکھا جائے کہ وہ پانی لے جا سکے۔ ریاضی اور انجینئری پانی کے مسئلے میں ایک دوسرے کی مدد کیسے کرتے ہیں؟
