  title:
    en: An engineer at Amid
    ar: مهندس في آمد
    ur: آمد کا ایک انجینئر
  text:
    en: TDV calls al-Jazari an Islamic scholar and an engineer who wrote a book on mechanical devices. It describes a book of six parts, covering clocks, drinking vessels, fountains, water-raising machines and other devices, fifty in all, with coloured drawings and instructions for making and running them. Which other communities has your class found that shaped science and technology?
    ar: تصف موسوعة TDV الجزري بأنه عالم إسلامي ومهندس ألّف كتابًا في الآلات الميكانيكية. وتصف الكتاب بأنه ستة أقسام تشمل الساعات وأواني الشرب والنوافير وآلات رفع الماء وغيرها من الآلات، وعددها خمسون، مع رسوم ملونة وتعليمات لصنعها وتشغيلها. أي جماعات أخرى وجد صفك أنها أسهمت في العلوم والتقنية؟
    ur: ٹی ڈی وی انسائیکلوپیڈیا الجزری کو اسلامی عالم اور میکانی آلات پر کتاب لکھنے والا انجینئر بتاتا ہے۔ وہ کتاب کو چھ حصوں پر مشتمل بتاتا ہے جن میں گھڑیاں، پینے کے برتن، فوارے، پانی اٹھانے کی مشینیں اور دوسرے آلات آتے ہیں، کل پچاس، رنگین تصویروں اور بنانے اور چلانے کی ہدایات کے ساتھ۔ آپ کی جماعت کو اور کون سی برادریاں ملیں جنہوں نے سائنس اور ٹیکنالوجی کو شکل دی؟
