connections:
- position: before
  kind: object
  title:
    en: Stars, polygons and grids
    ar: نجوم ومضلعات وشبكات
    ur: ستارے، کثیر الاضلاع اور جالیاں
  text:
    en: 'Islamic geometric patterns are repeated patterns of stars, polygons and grids that cover the surfaces of Islamic architecture and art from al-Andalus to Central Asia. Look at one pattern from this tradition: which shapes repeat, and how does your eye move across the surface?'
    ar: 'الزخارف الهندسية الإسلامية أنماط متكررة من نجوم ومضلعات وشبكات تغطي أسطح العمارة والفن الإسلامي من الأندلس إلى آسيا الوسطى. تأمّل نمطًا واحدًا من هذا التقليد: أي الأشكال يتكرر، وكيف تتحرك عينك على السطح؟'
    ur: 'اسلامی ہندسی نقوش ستاروں، کثیر الاضلاع شکلوں اور جالیوں کے دہرائے جانے والے نمونے ہیں جو اندلس سے وسطی ایشیا تک اسلامی فنِ تعمیر اور فن کی سطحوں کو ڈھانپتے ہیں۔ اس روایت کا کوئی ایک نقش دیکھیں: کون سی شکلیں دہرائی جاتی ہیں، اور آپ کی نظر سطح پر کیسے چلتی ہے؟'
  entity: concept/islamic-geometric-patterns
  sources:
  - source/wikidata
- position: within
  kind: object
  title:
    en: A pattern that respects the surface
    ar: نمط يحترم السطح
    ur: ایسا نقش جو سطح کا احترام کرتا ہے
  text:
    en: 'In Yeomans''s view geometric forms in Islamic art are dynamic and open-ended, rarely coming to rest, and the vegetal arabesque is stylised and two-dimensional, respecting the surface. What would you change in a drawing so that it respects its surface?'
    ar: يرى يومانز أن الأشكال الهندسية في الفن الإسلامي حركية لا تنتهي ولا تستقر، وأن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح. ماذا تغيّر في رسم لتجعله يحترم سطحه؟
    ur: 'یومنز کے خیال میں اسلامی فن میں ہندسی شکلیں متحرک اور کھلی رہتی ہیں اور شاذ ہی ٹھہرتی ہیں، جبکہ نباتی عربیسک تجریدی اور دو جہتی ہے اور سطح کا احترام کرتا ہے۔ آپ ڈرائنگ میں کیا بدلیں گے کہ وہ اپنی سطح کا احترام کرے؟'
  entity: concept/arabesque
