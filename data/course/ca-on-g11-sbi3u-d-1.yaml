summary:
  en: 'How one religious body answered a question about cloning plant cells: its way of weighing benefit and harm for a biotechnology question, not an example of genetic modification or genomics research.'
  ar: 'كيف أجابت جهة دينية عن سؤال عن استنساخ الخلايا النباتية: طريقتها في موازنة المنفعة والضرر في مسألة تقنية حيوية، وليست مثالاً على التعديل الوراثي ولا على أبحاث الجينوم.'
  ur: 'ایک مذہبی ادارے نے پودوں کے خلیوں کی کلوننگ کے سوال کا کیا جواب دیا: حیاتی ٹیکنالوجی کے ایک سوال میں فائدے اور نقصان کو تولنے کا اس کا طریقہ، نہ کہ جینیاتی تبدیلی یا جینومکس کی تحقیق کی مثال۔'
