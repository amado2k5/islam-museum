  title:
    en: A question about cloning plant cells
    ar: سؤال عن استنساخ الخلايا النباتية
    ur: پودوں کے خلیوں کی کلوننگ کا ایک سوال
  text:
    en: Asked about cloning plant cells and multiplying them to make juices and food additives, Jordan's General Iftaa Department answered that scholars define plant cloning as forming a group of cells that yields an improved plant reproducing without change to its genetic content. It said using cloning in plants is unobjectionable provided it is shown not to harm the consumer or disrupt the plant ecosystem, and that experts judge benefit and harm. Which benefits and harms would your class weigh?
    ar: سُئلت دائرة الإفتاء العام الأردنية عن استنساخ الخلايا النباتية ومضاعفتها لصنع العصائر والمواد المضافة إلى الطعام، فأجابت بأن العلماء يعرفون الاستنساخ في النبات بأنه عملية حيوية تتكون بها مجموعة من الخلايا ينتج عنها نبات محسن الإنتاج يتكاثر دون تغيير في محتواه الوراثي. وقالت إنه لا حرج في الاستفادة من هذه التقنيات بشرط ثبوت عدم إضرارها بالمستهلك وعدم إخلالها بالنظام النباتي، ويرجع في ضبط المصالح والمفاسد إلى أهل الخبرة والاختصاص. أي المنافع والأضرار سيزنها صفّك؟
    ur: پودوں کے خلیوں کی کلوننگ اور انہیں بڑھا کر رس اور کھانے میں شامل ہونے والے مادّے بنانے کے بارے میں پوچھا گیا تو اردن کے محکمۂ افتائے عام نے جواب دیا کہ علما پودوں کی کلوننگ کو ایسا حیاتی عمل بتاتے ہیں جس سے خلیوں کا ایک مجموعہ بنتا ہے اور اس سے بہتر پیداوار والا پودا ملتا ہے جو اپنے وراثتی مواد میں تبدیلی کے بغیر نسل بڑھاتا ہے۔ اس نے کہا کہ پودوں میں کلوننگ کی تکنیکوں سے فائدہ اٹھانے میں کوئی حرج نہیں، بشرطیکہ ثابت ہو کہ وہ صارف کو نقصان نہیں پہنچاتیں اور پودوں کے نظام میں خلل نہیں ڈالتیں، اور فائدے اور نقصان کی جانچ ماہرین کے سپرد ہے۔ آپ کی کلاس کن فائدوں اور نقصانات کو تولے گی؟
