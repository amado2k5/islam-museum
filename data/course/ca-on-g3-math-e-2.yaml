  title:
    en: The sa' of Medina and the sa' of Iraq
    ar: صاع المدينة وصاع العراق
    ur: مدینہ کا صاع اور عراق کا صاع
  text:
    ar: 'الصاع في اصطلاح الفقهاء مكيال يُكال به في البيع والشراء وتُقدَّر به كثير من الأحكام الشرعية. واشتهر عند الفقهاء صاعان: صاع أهل المدينة وصاع أهل العراق، والأول أصغر من الثاني. واتفق الفقهاء على أن الصاع أربعة أمداد، ثم اختلفوا في مقدار المد. إذا كِيلت حبوب واحدة بمكيالين مختلفي الحجم، فأيهما يعطي عدداً أكبر؟'
    en: In the jurists' technical usage the sa' is a dry measure used in buying and selling, by which many legal rulings are quantified. Two sa's were well known among the jurists, the sa' of Medina and the sa' of Iraq, the first being the smaller. The jurists agree that a sa' is four mudds, then differ over the size of the mudd. If two scoops of different size measure the same grain, which gives the larger count?
    ur: 'صاع فقہ کی اصطلاح میں ایسا پیمانہ ہے جس سے خرید و فروخت میں ناپا جاتا ہے اور جس کے ذریعے بہت سے شرعی احکام کی مقداریں مقرر ہوتی ہیں۔ فقہا کے ہاں دو صاع مشہور ہیں: اہلِ مدینہ کا صاع اور اہلِ عراق کا صاع، اور پہلا دوسرے سے چھوٹا ہے۔ فقہا متفق ہیں کہ صاع چار مد ہوتا ہے، پھر مد کی مقدار میں اختلاف ہے۔ اگر ایک ہی اناج کو دو مختلف جسامت کے پیمانوں سے ناپا جائے تو کس سے گنتی زیادہ آئے گی؟'
