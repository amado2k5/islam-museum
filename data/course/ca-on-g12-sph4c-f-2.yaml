- position: after
  kind: invention
  title:
    en: A balance that weighs in water
    ar: ميزان يزن في الماء
    ur: ایک ترازو جو پانی میں تولتا ہے
  text:
    en: Robert Hall, in the record, describes al-Khazini's balance as connected with the treasury of Sultan Sanjar at Merv, in a treatise written in 515 AH/1121-1122 CE. An immersed object has a lower apparent weight because the liquid supports it, and comparing its weight in air with the loss of weight in water gives information about its density. Equal dry weights alone do not show that two objects are the same material. What else would you need to know?
    ar: يعرض السجل، عن روبرت هول، ميزان الخازني مرتبطًا بخزانة السلطان سنجر في مرو، في كتاب أُلّف سنة 515هـ/1121–1122م. فالجسم المغمور يبدو أخف لأن السائل يسنده، ومقارنة وزنه في الهواء بنقص الوزن في الماء تتيح بحث كثافته. ولا تكفي مساواة جسمين في الوزن الجاف للحكم بأنهما من المادة نفسها. فماذا تحتاج أن تعرف أيضًا؟
    ur: ریکارڈ، رابرٹ ہال کے حوالے سے، الخازنی کے ترازو کو سلطان سنجر کے خزانے سے مرو میں وابستہ بتاتا ہے، ایک رسالے میں جو 515 ہجری/1121–1122 عیسوی میں لکھا گیا۔ پانی میں ڈوبا ہوا جسم ہلکا دکھائی دیتا ہے کیونکہ مائع اسے سہارا دیتا ہے، اور ہوا میں اس کے وزن کا پانی میں وزن کی کمی سے موازنہ کرنے سے اس کی کثافت کے بارے میں معلومات ملتی ہیں۔ صرف خشک وزن کا برابر ہونا یہ ثابت نہیں کرتا کہ دو جسم ایک ہی مادے کے ہیں۔ آپ کو اور کیا جاننا ہوگا؟
  entity: invention/balance-of-wisdom
