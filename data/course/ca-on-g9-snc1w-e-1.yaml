  title:
    en: Stars that keep their places
    ar: كواكب تحفظ مواضعها
    ur: اپنی جگہ قائم رہنے والے ستارے
  text:
    en: 'Al-Farghani describes the fixed stars as those whose positions do not change relative to one another; they all move together from east to west once each day. He adds a slow motion on the poles of the zodiac, completing a circuit in thirty-six thousand years, and says he counted what could be measured: 1,022 stars in six magnitudes, fifteen of them in the first. What would you compare them with?'
    ar: يرى الفرغاني أن الكواكب الثابتة هي التي لا تتغير أوضاعها فيما بينها، وتتحرك جميعًا من المشرق إلى المغرب حركة واحدة في كل يوم. ويضيف حركة بطيئة على قطبي فلك البروج، دورها ستة وثلاثون ألف سنة، وقد عدّ ما أمكن قياسه من الكواكب فبلغ ألفًا واثنين وعشرين كوكبًا في ستة أقدار، خمسة عشر منها في القدر الأول. بماذا تقارنها؟
    ur: 'الفرغانی کے نزدیک ٹھہرے ستارے وہ ہیں جن کے مقام آپس میں نہیں بدلتے؛ وہ سب مل کر ہر دن مشرق سے مغرب کی طرف ایک ہی حرکت کرتے ہیں۔ وہ فلکِ بروج کے قطبوں پر ایک سست حرکت کا اضافہ کرتا ہے جس کا چکر چھتیس ہزار سال میں پورا ہوتا ہے، اور کہتا ہے کہ جتنا ناپا جا سکتا تھا اس نے گنا: چھ قدروں میں 1,022 ستارے، جن میں پندرہ پہلے درجے میں ہیں۔ آپ انہیں کس سے موازنہ کریں گے؟'
  entity: concept/al-kawakib-al-thabita
  sources:
  - source/farghani-elements-astronomy
- position: after
  kind: scholar
  title:
    en: The sun and planets move on their own
    ar: الشمس والكواكب تتحرك بحركتها الخاصة
    ur: سورج اور سیارے اپنی الگ حرکت کرتے ہیں
  text:
    en: In his Earth-centred scheme, al-Farghani calls the second motion the sun's and planets' own motion along the zodiac from west to east, opposite in direction to the first. He shows that the sun covers the zodiac by this motion in a solar year, returning to its point in about three hundred and sixty-five days and a quarter. How does this differ from the motion of the fixed stars?
    ar: في تصوره الذي تقف فيه الأرض في المركز، الحركة الثانية عند الفرغاني حركة الشمس والكواكب الخاصة بها على فلك البروج من المغرب إلى المشرق، وهي تخالف الحركة الأولى في الاتجاه. ويبيّن أن الشمس تقطع فلك البروج بحركتها الخاصة في عام شمسي، فتعود إلى نقطتها في نحو ثلاثمائة وخمسة وستين يومًا وربع يوم. بماذا تختلف عن حركة الكواكب الثابتة؟
    ur: اپنے اس نظام میں جس کے مرکز میں زمین ہے، الفرغانی دوسری حرکت اسے کہتا ہے جو سورج اور سیاروں کی اپنی حرکت ہے، فلکِ بروج پر مغرب سے مشرق کی طرف، اور سمت میں پہلی حرکت کے الٹ۔ وہ دکھاتا ہے کہ سورج اس حرکت سے فلکِ بروج کا چکر ایک شمسی سال میں پورا کرتا ہے اور تقریباً تین سو پینسٹھ دن اور ایک چوتھائی دن میں اپنے مقام پر لوٹ آتا ہے۔ یہ ٹھہرے ستاروں کی حرکت سے کیسے مختلف ہے؟
  entity: concept/al-harakat-al-thaniya
