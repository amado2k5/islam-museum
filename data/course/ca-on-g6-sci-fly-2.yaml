  title:
    en: 'A test meant to be repeated'
    ar: 'اختبار يُقصد تكراره'
    ur: 'ایسی آزمائش جسے دہرایا جا سکے'
  text:
    en: 'In the first book of the Kitab al-Manazir, Ibn al-Haytham lets the light of the sun, the moon, the stars and a fire into a dark room through a small hole, and studies it on the opposite wall. He cuts its path with an opaque body, lays a ruler along it and finds it perfectly straight. He sets out several versions, each meant to be repeated by the reader. What would you need to repeat it?'
    ar: 'في المقالة الأولى من «كتاب المناظر» يُدخل ابن الهيثم ضوء الشمس والقمر والكواكب والنار من ثقب صغير إلى بيت مظلم، ويتأمله على الجدار المقابل. ويقطع طريقه بجسم كثيف، ويمد عليه مسطرة، فيجده في غاية الاستقامة. ويعرض الاختبار في صور عدة، كل واحدة منها يقصد أن يكررها القارئ بنفسه. ماذا تحتاج كي تكرر الاختبار بنفسك؟'
    ur: '«کتاب المناظر» کے پہلے مقالے میں ابن الہیثم سورج، چاند، ستاروں اور آگ کی روشنی کو ایک چھوٹے سوراخ سے تاریک کمرے میں آنے دیتے ہیں اور سامنے کی دیوار پر اس کا مطالعہ کرتے ہیں۔ وہ اس کا راستہ ایک ٹھوس جسم سے کاٹتے ہیں، اس کے ساتھ سیدھا پیمانہ رکھتے ہیں اور اسے بالکل سیدھا پاتے ہیں۔ وہ اس آزمائش کی کئی صورتیں بیان کرتے ہیں، ہر ایک اس لیے کہ قاری خود اسے دہرائے۔ اسے دہرانے کے لیے آپ کو کیا چاہیے؟'
  entity: invention/camera-obscura
  sources:
