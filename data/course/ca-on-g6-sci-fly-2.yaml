  text:
    en: Ibn al-Haytham wrote that if learning the truth is the goal, a seeker must question what is handed down and test claims by experiment. That habit — observe, predict, test — is the same one that
      shapes every wing in this unit.
    ar: كتب ابن الهيثم أن من أراد معرفة الحق وجب أن يشك في المأثور ويختبر الدعاوى بالتجربة؛ وهذه العادة نفسها — لاحظ وتوقع واختبر — هي التي تشكّل كل جناح في هذه الوحدة.
    ur: 'ابن الہیثم نے لکھا کہ اگر سچائی جاننا مقصد ہے تو متلاشی کو ورثے میں ملی باتوں پر شک اور دعووں کو تجربے سے پرکھنا چاہیے۔ یہی عادت — دیکھو، اندازہ لگاؤ، آزماؤ — اس یونٹ کے ہر بازو کو ڈھالتی ہے۔'
