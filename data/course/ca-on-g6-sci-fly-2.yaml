  title:
    en: Flying, but not called birds
    ar: تطير ولا تسمى طيرًا
    ur: اڑتی ہیں مگر پرندہ نہیں کہلاتیں
  text:
    en: 'Kitab al-Hayawan is al-Jahiz''s book on animals, divided into seven parts. In it he notes that not everything that flies on two wings is a bird: locusts, bees and flies fly but are not called birds. Name three small creatures you have seen fly: what do their wings have in common, and how do they differ?'
    ar: '«كتاب الحيوان» كتاب الجاحظ في الحيوان، مقسوم على سبعة «مصاحف» أي أجزاء. وينبه فيه على أن ليس كل ما طار بجناحين طيراً: فالجراد والنحل والذباب تطير ولا تسمى طيراً. اذكر ثلاثة كائنات صغيرة رأيتها تطير: ما الذي تشترك فيه أجنحتها، وما الذي تختلف فيه؟'
    ur: '«کتاب الحیوان» جاحظ کی حیوانات پر کتاب ہے، جو سات «مصاحف» یعنی اجزاء میں تقسیم ہے۔ اس میں وہ تنبیہ کرتے ہیں کہ دو پروں سے اڑنے والی ہر چیز پرندہ نہیں: ٹڈی، شہد کی مکھی اور مکھی اڑتی ہیں مگر پرندہ نہیں کہلاتیں۔ تین چھوٹے جانداروں کے نام بتائیں جنہیں آپ نے اڑتے دیکھا ہے: ان کے پروں میں کیا بات مشترک ہے اور کیا مختلف؟'
