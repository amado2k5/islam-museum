  title:
    en: How the forces set the glide angle
    ar: كيف تحدد القوى زاوية الهبوط
    ur: قوتیں اترنے کا زاویہ کیسے طے کرتی ہیں
  text:
    en: In steady gliding, NASA Glenn relates the ratio of lift to drag to the angle at which a glider descends; the height lost divided by the horizontal distance gives the tangent of that angle. The record's modern paper example loses one unit of height across ten horizontal units, a slope of one to ten, and descends more steeply if only five are crossed. It does not calculate Ibn Firnas's range. Which force would you change to flatten the slope?
    ar: في الانزلاق المنتظم يربط دليل ناسا غلين بين نسبة الرفع إلى المقاومة وزاوية الهبوط، ونسبة الارتفاع المفقود إلى المسافة الأفقية هي ظل هذه الزاوية. وفي مثال ورقي حديث يرد في السجل تُفقد وحدة ارتفاع مع قطع عشر وحدات أفقية، فتكون نسبة الانحدار واحدة إلى عشرة، ويشتد الانحدار إذا قُطعت خمس وحدات فقط. ولا يحسب السجل منه مدى رحلة ابن فرناس. أي قوة تغيّر لتخفف الانحدار؟
    ur: مستقل انزلاق میں ناسا گلین اٹھان و مزاحمت کے تناسب کو نزولی زاویے سے ملاتی ہے، اور کھوئی بلندی تقسیم افقی فاصلہ اس زاویے کا ظل ہے۔ ریکارڈ کی ایک جدید کاغذی مثال میں ایک بلندی کی اکائی دس افقی اکائیوں میں کھوئی جاتی ہے، یعنی ڈھلان ایک بہ دس؛ اور اگر صرف پانچ افقی اکائیاں طے ہوں تو نزول زیادہ شدید ہے۔ ریکارڈ اس سے ابن فرناس کا فاصلہ نہیں نکالتا۔ آپ کون سی قوت بدلیں گے تاکہ ڈھلان کم ہو؟
