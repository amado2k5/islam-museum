  text:
    en: Ibn Firnas's wing suit was built from silk, wood and feathers — the materials his city had. Engineering has always meant solving the same problem with whatever is at hand.
    ar: صُنعت بدلة جناح ابن فرناس من الحرير والخشب والريش — وهي مواد مدينته المتاحة؛ فالهندسة تعني دائمًا حل المشكلة ذاتها بما تيسر.
    ur: 'ابن فرناس کی بازو والی پوشاک ریشم، لکڑی اور پرّوں سے بنی — جو مواد اس کے شہر میں تھا۔ انجینئرنگ ہمیشہ سے اسی مسئلے کو دستیاب چیزوں سے حل کرنے کا نام ہے۔'
