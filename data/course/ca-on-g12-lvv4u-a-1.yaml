- position: before
  kind: object
  title:
    en: Two accounts of one book
    ar: خبران عن كتاب واحد
    ur: ایک کتاب کے دو بیان
  text:
    en: 'Kashf al-Zunun reports, from Qadi-zada al-Rumi, that one of the kings of Greece asked a man from Tyre named Euclid to refine and arrange the book, and that it became famous under his name. Al-Kindi''s epistle says that a man named Apollonius the carpenter composed it in fifteen treatises. Two accounts of the origin of one book: who tells each, and how would you weigh them?'
    ar: 'يحكي «كشف الظنون» عن قاضي زاده الرومي أن بعض ملوك اليونان طلب من رجل بصور اسمه أقليدس تهذيب الكتاب وترتيبه، فاشتهر باسمه. وفي رسالة الكندي أن رجلاً اسمه أبلونيوس النجار ألفه في خمسة عشر قولاً. خبران عن أصل كتاب واحد: من يرويهما، وكيف توازن بينهما؟'
    ur: '«کشف الظنون» قاضی زادہ رومی کے حوالے سے بتاتی ہے کہ یونان کے کسی بادشاہ نے صور کے ایک شخص اقلیدس سے کتاب کی تہذیب اور ترتیب کو کہا، تو وہ انہی کے نام سے مشہور ہو گئی۔ کندی کے رسالے میں ہے کہ ابلونیوس نجار نامی ایک شخص نے اسے پندرہ مقالات میں لکھا۔ ایک ہی کتاب کی اصل کے دو بیان: انہیں کون سناتا ہے، اور آپ ان کو کیسے تولیں گے؟'
  entity: work/usul-uqlidis
  sources:
  - source/kashf-zunun-furqan
- position: within
  kind: story
  title:
    en: A dream, and one author
    ar: منام ومؤلف واحد
    ur: ایک خواب اور ایک مصنف
  text:
    en: "Ibn al-Nadim relates that al-Ma'mun saw in a dream a man who told him he was Aristotle, and who answered his question about the meaning of the good. Ibn al-Nadim counts this dream among the strongest causes of the production of the books. This picture comes from Ibn al-Nadim alone, and the museum's record gives no second source for it. What would you ask of a report that rests on one author?"
    ar: "يروي ابن النديم أن المأمون رأى في منامه رجلاً ذكر له أنه أرسطاطاليس، وأجابه عن معنى «الحسن». ويعد ابن النديم هذا المنام من أقوى أسباب إخراج الكتب. وهذه الصورة من رواية ابن النديم وحده، ولا يذكر سجل المتحف لها مصدراً ثانياً. ماذا تسأل عن خبر يستند إلى مؤلف واحد؟"
    ur: "ابن الندیم روایت کرتے ہیں کہ مأمون نے خواب میں ایک شخص کو دیکھا جس نے بتایا کہ وہ ارسطاطالیس ہے، اور اس نے «حسن» کے معنی کے بارے میں اس کے سوال کا جواب دیا۔ ابن الندیم اس خواب کو کتابیں نکلوانے کے سب سے مضبوط اسباب میں شمار کرتے ہیں۔ یہ تصویر صرف ابن الندیم کی روایت سے ہے، اور میوزیم کا ریکارڈ اس کے لیے کوئی دوسرا ماخذ نہیں دیتا۔ جو خبر ایک ہی مصنف پر قائم ہو اس کے بارے میں آپ کیا پوچھیں گے؟"
  entity: concept/harakat-al-tarjama
