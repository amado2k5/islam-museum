  title:
    en: A life, with two numbers
    ar: حياة برقمين
    ur: ایک زندگی، دو عدد
  text:
    en: 'Ibn al-Nadim, citing the book of Plutarch, says Plato''s name was Plato, son of Arsatn, and that his father was called Isthun and was one of the Greek notables. On Plato''s age the source differs: eighty-one years, and in Ishaq''s report, eighty. When a source itself keeps two numbers, what should a reader do with them?'
    ar: ينقل ابن النديم عن كتاب فلوطرخس أن اسمه أفلاطون بن أرسطن، وأن أباه يقال له إسطون وكان من أشراف اليونانيين. ويختلف المصدر في مدة عمره، فيقال إحدى وثمانون سنة، وفي رواية إسحاق ثمانون. حين يحتفظ المصدر نفسه برقمين، ماذا يفعل القارئ بهما؟
    ur: ابن الندیم فلوطرخس کی کتاب سے نقل کرتے ہیں کہ ان کا نام افلاطون بن ارسطن تھا، اور ان کے والد کو اسطون کہا جاتا تھا جو یونانی اشراف میں سے تھے۔ ماخذ ان کی عمر کی مدت میں مختلف ہے؛ کہا جاتا ہے کہ اکیاسی سال تھی، اور اسحاق کی روایت میں اسی سال۔ جب ماخذ خود دو عدد رکھے تو قاری ان کا کیا کرے؟
  entity: person/aflatun
