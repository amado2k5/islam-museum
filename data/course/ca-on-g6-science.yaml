summary:
  en: 'The 2022 Ontario Grade 6 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps parts of strands A, B, D and E and none of strand C.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف السادس في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، والنظم الحياتية، والمادة والطاقة، والمنشآت والآليات، ونظم الأرض والفضاء. ويربط المتحف أجزاء من المحاور أ وب ود وهـ ولا يربط شيئًا من المحور ج.'
  ur: 'اونٹاریو نصاب 2022 کے چھٹی جماعت سائنس و ٹیکنالوجی کورس کی پانچ شاخیں ہیں: STEM مہارتیں اور روابط، حیاتی نظام، مادہ اور توانائی، ساختیں اور میکانیات، اور زمین و خلا کے نظام۔ عجائب گھر شاخ A، B، D اور E کے کچھ حصے جوڑتا ہے اور شاخ C کا کوئی حصہ نہیں۔'
