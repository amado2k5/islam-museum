summary:
  en: 'The 2022 Ontario Grade 6 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps parts of strands A, B, D and E and none of strand C.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف السادس في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، والنظم الحياتية، والمادة والطاقة، والمنشآت والآليات، ونظم الأرض والفضاء. ويربط المتحف أجزاء من المحاور أ وب ود وهـ ولا يربط شيئًا من المحور ج.'
  ur: 'اونٹاریو نصاب 2022 کے چھٹی جماعت سائنس و ٹیکنالوجی کورس کی پانچ شاخیں ہیں: STEM مہارتیں اور روابط، حیاتی نظام، مادہ اور توانائی، ساختیں اور میکانیات، اور زمین و خلا کے نظام۔ عجائب گھر شاخ A، B، D اور E کے کچھ حصے جوڑتا ہے اور شاخ C کا کوئی حصہ نہیں۔'
  es: "El curso de Ciencias y Tecnología de sexto grado de Ontario para 2022 consta de cinco ejes temáticos: Habilidades y Conexiones STEM, Sistemas de la Vida, Materia y Energía, Estructuras y Mecanismos, y Sistemas Terrestres y Espaciales. El mapa del museo abarca partes de los ejes A, B, D y E, pero no del eje C."
  fr: "Le programme de sciences et technologie de 6e année de l'Ontario (2022) comprend cinq volets: compétences et liens en STIM, systèmes vivants, matière et énergie, structures et mécanismes, et systèmes Terre et espace. Le musée présente des éléments des volets A, B, D et E, mais aucun du volet C."
  tr: "Ontario'nun 2022 müfredatındaki 6. Sınıf Fen ve Teknoloji dersi beş temadan oluşmaktadır: STEM becerileri ve bağlantıları; yaşam sistemleri; madde ve enerji; yapılar ve mekanizmalar; ve Dünya ve uzay sistemleri. Müze, A, B, D ve E temalarının bazı bölümlerini birbirine bağlarken, C temasından hiçbir şey içermemektedir."
  id: "Kurikulum Sains dan Teknologi Kelas 6 dalam silabus Ontario 2022 memiliki lima tema: keterampilan STEM dan hubungannya; sistem kehidupan; materi dan energi; struktur dan mekanisme; dan sistem bumi dan ruang angkasa. Museum ini menghubungkan bagian-bagian dari tema A, B, D, dan E, tetapi tidak ada yang berkaitan dengan tema C."
