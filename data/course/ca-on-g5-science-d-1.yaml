- position: after
  kind: place
  title:
    en: Rebuilding al-Aqsa after the earthquake
    ar: إعادة بناء الأقصى بعد الزلزلة
    ur: زلزلے کے بعد اقصیٰ کی تعمیرِ نو
  text:
    en: The earthquake of 1033 devastated Jerusalem. The Fatimid caliph al-Zahir rebuilt al-Aqsa between 1034 and 1036, and the work was completed under al-Mustansir in 1065. The new mosque was smaller than its predecessor, with seven aisles instead of fifteen. What changed in the mosque when it was rebuilt?
    ar: 'كانت زلزلة سنة 1033م مدمرة على بيت المقدس كلها، فأعاد الخليفة الفاطمي الظاهر بناء الأقصى بين 1034 و1036م وأُكمل العمل في خلافة المستنصر سنة 1065م. وكان المسجد الجديد أصغر من سلفه: سبعة أروقة بدل خمسة عشر. ماذا تغيّر في المسجد حين أُعيد بناؤه؟'
    ur: '1033 عیسوی کے زلزلے نے پورے بیت المقدس کو تباہ کر دیا۔ فاطمی خلیفہ الظاہر نے 1034 سے 1036 عیسوی کے درمیان اقصیٰ کو دوبارہ تعمیر کروایا اور کام 1065 عیسوی میں المستنصر کے دور میں مکمل ہوا۔ نئی مسجد اپنی پیش رو سے چھوٹی تھی: پندرہ کی جگہ سات رواق۔ مسجد کی تعمیرِ نو میں کیا بدل گیا؟'
  entity: event/aqsa-fatimid-rebuild
