  kind: story
  title:
    en: A night flood in Damascus
    ar: سيل ليلي في دمشق
    ur: دمشق میں رات کا سیلاب
  text:
    en: In Sha'ban 683 AH, the chronicle says, a huge flood came at night in Damascus. Houses were destroyed and the rivers were blocked. The water broke the locks of the Faradis Gate, entered as far as the Muqaddamiyya college, and broke the bridge of the Faradis Gate. On which of these structures did the water act, and how?
    ar: في شعبان سنة 683هـ كانت الزيادة الهائلة بدمشق بالليل، وخربت البيوت وانطمّت الأنهار، وكسر الماء أقفال باب الفراديس ودخل حتى وصل إلى مدرسة المقدمية، وكسر جسر باب الفراديس. على أي هذه المنشآت عمل الماء، وكيف؟
    ur: خبر کے مطابق شعبان 683 ہجری میں دمشق میں رات کو بہت بڑا سیلاب آیا۔ گھر برباد ہو گئے اور دریا بند ہو گئے۔ پانی نے باب الفرادیس کے تالے توڑ دیے، مدرسہ مقدمیہ تک پہنچا اور باب الفرادیس کا پل توڑ دیا۔ پانی نے ان میں سے کن عمارتوں پر اثر کیا اور کیسے؟
  entity: event/damascus-flood-683
  sources:
  - source/shadharat-dhahab
- position: within
  kind: story
  title:
    en: What fell in the earthquake of 425
    ar: ما سقط في زلزلة سنة 425
    ur: 425 ہجری کے زلزلے میں کیا گرا
  text:
    en: In 425 AH, the chronicle says, Ramla was shaken and about half of it was destroyed. Villages sank into the ground, part of the wall of Jerusalem fell, and the minaret of the mosque of Ascalon collapsed. The same entry says the sea receded about three leagues and then returned. Which of these structures would you expect to suffer most, and why?
    ar: في سنة 425هـ، بحسب الخبر، زُلزلت الرملة فهُدم نحو نصفها وخُسف بقرى وسقط بعض حائط بيت المقدس وسقطت منارة جامع عسقلان. ويذكر الخبر نفسه أن البحر جزر نحو ثلاثة فراسخ ثم عاد الماء. أي هذه المنشآت تتوقع أن يصيبها الضرر الأكبر، ولماذا؟
    ur: خبر کے مطابق 425 ہجری میں رملہ ہلا اور اس کا تقریباً آدھا حصہ ڈھ گیا۔ بستیاں زمین میں دھنس گئیں، بیت المقدس کی فصیل کا کچھ حصہ گر گیا اور عسقلان کی جامع مسجد کا مینار گر پڑا۔ اسی اندراج میں ہے کہ سمندر تقریباً تین فرسخ پیچھے ہٹا اور پھر پانی لوٹ آیا۔ ان میں سے کون سی عمارتوں کو آپ سب سے زیادہ نقصان کی توقع کریں گے اور کیوں؟
  entity: event/earthquake-tsunami-425
