  title:
    en: Scripts with names
    ar: خطوط لها أسماء
    ur: نام رکھنے والے خط
  text:
    en: "Islamic calligraphy is the art of writing and shaping the Arabic letter beautifully. Its scripts include Kufic, Naskh, Thuluth and Diwani. If you saw two of these scripts side by side, what would you compare?"
    ar: "الخط الإسلامي فن كتابة الحرف العربي وتشكيله جمالياً. ومن خطوطه الكوفي والنسخ والثلث والديواني. لو رأيت اثنين من هذه الخطوط جنبًا إلى جنب، فماذا ستقارن؟"
    ur: "اسلامی خطاطی عربی حرف کو خوبصورتی سے لکھنے اور ڈھالنے کا فن ہے۔ اس کے خطوں میں کوفی، نسخ، ثلث اور دیوانی شامل ہیں۔ ان میں سے دو خط ساتھ ساتھ دیکھیں تو آپ کیا موازنہ کریں گے؟"
  entity: concept/islamic-calligraphy
