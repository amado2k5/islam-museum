  title:
    en: Machines that ran themselves
    ar: آلات تدير نفسها
  text:
    en: Long before electric switches, the Banu Musa brothers catalogued a hundred clever devices in Kitab al-Hiyal — fountains that alternated shapes, lamps that trimmed their own wicks. Control means
      making a mechanism respond to conditions; circuits are our era's way of doing it.
    ar: قبل المفاتيح الكهربائية بزمن طويل، صنّف بنو موسى مئة آلة بارعة في كتاب الحيل — نوافير تتبدل أشكالها وقناديل تتهذب فتائلها بنفسها. التحكم يعني جعل الآلية تستجيب للأحوال، والدوائر طريقة عصرنا في ذلك.
  entity: work/kitab-al-hiyal
