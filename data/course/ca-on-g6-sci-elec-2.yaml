  title:
    en: The engineer who wrote it down
    ar: المهندس الذي دوّنه
  text:
    en: Al-Jazari's Book of Knowledge of Ingenious Mechanical Devices (1206) drew each machine so precisely that modern engineers rebuild them from his pages — a reminder that a good circuit diagram is
      a gift to whoever comes next.
    ar: رسم الجزري في كتابه «الجامع بين العلم والعمل النافع في صناعة الحيل» (1206م) كل آلة بدقة تسمح لمهندسي اليوم بإعادة بنائها من صفحاته — تذكرة بأن مخطط الدائرة الجيد هدية لمن يأتي بعدك.
