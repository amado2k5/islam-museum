expectations:
- code: B1.1
  text:
    en: read, represent, compose, and decompose whole numbers up to and including 1000, using a variety of tools and strategies, and describe various ways they are used in everyday life
    ar: اقرأ الأعداد الكلية حتى 1000 شاملةً ومثّلها وركّبها وفكّكها باستخدام أدوات واستراتيجيات متنوعة، وصِف طرقًا مختلفة لاستخدامها في الحياة اليومية
    ur: ایک ہزار تک اور اس سمیت مکمل اعداد کو مختلف اوزار اور حکمتِ عملیوں سے پڑھیں، ظاہر کریں، جوڑیں اور کھولیں، اور روزمرہ زندگی میں ان کے استعمال کے مختلف طریقے بیان کریں
- code: B1.5
  text:
    en: use place value when describing and representing multi-digit numbers in a variety of ways, including with base ten materials
    ar: استخدم القيمة المنزلية عند وصف الأعداد المتعددة الخانات وتمثيلها بطرق متنوعة، ومنها مواد الأساس عشرة
    ur: کثیر ہندسی اعداد کو بیان اور ظاہر کرتے وقت مقامی قدر استعمال کریں، کئی طریقوں سے، بشمول بنیاد دس کے مواد کے
- code: B2.4
  text:
    en: demonstrate an understanding of algorithms for adding and subtracting whole numbers by making connections to and describing the way other tools and strategies are used to add and subtract
    ar: أظهر فهمًا لخوارزميات جمع الأعداد الكلية وطرحها بالربط بالطريقة التي تُستخدم بها الأدوات والاستراتيجيات الأخرى في الجمع والطرح ووصفها
    ur: مکمل اعداد کے جمع اور تفریق کے الگورتھم کی سمجھ کا مظاہرہ کریں، اس طرح کہ دوسرے اوزار اور حکمتِ عملیاں جمع اور تفریق کے لیے جس طرح استعمال ہوتی ہیں ان سے تعلق جوڑیں اور انہیں بیان کریں
- code: B2.5
  text:
    en: represent and solve problems involving the addition and subtraction of whole numbers that add up to no more than 1000, using various tools and algorithms
    ar: مثّل مسائل جمع الأعداد الكلية وطرحها التي لا يزيد مجموعها على 1000 وحلّها، باستخدام أدوات وخوارزميات متنوعة
    ur: مکمل اعداد کے جمع اور تفریق کے ایسے مسائل جن کا مجموعہ 1000 سے زیادہ نہ ہو، مختلف اوزار اور الگورتھم سے ظاہر کریں اور حل کریں
connections:
- position: before
  kind: invention
  title:
    en: Reckoning with nine numerals and zero
    ar: الحساب بتسعة أرقام وصفر
    ur: نو ہندسوں اور صفر سے حساب
  text:
    ar: 'الحساب الهندي طريقة في كتابة الأعداد وحسابها بتسعة أرقام وصفر، تأخذ فيها كل خانة قيمتها من موضعها: آحاد ثم عشرات ثم مئات ثم ألوف. ألّف فيها الخوارزمي في بغداد كتاباً، وبقيت له ترجمة لاتينية تبدأ بعبارة «Dixit Algorizmi»، أي «قال الخوارزمي». ويُجمع بها ويُطرح ويُضرب ويُقسم كتابةً بخطوات مرتبة. كيف يغيّر موضع الرقم قيمته؟'
    en: 'Algorism is a way of writing and working numbers with nine numerals and a zero, in which each place takes its value from its position: units, then tens, then hundreds, then thousands. Al-Khwarizmi wrote a book on it in Baghdad, and a Latin translation survives that opens "Dixit Algorizmi", "al-Khwarizmi said". Numbers are added, subtracted, multiplied and divided in writing by ordered steps. How does the place of a digit change its value?'
    ur: 'ہندی حساب اعداد کو نو ہندسوں اور ایک صفر سے لکھنے اور ان سے حساب کرنے کا طریقہ ہے، جس میں ہر خانہ اپنی قیمت اپنے مقام سے لیتا ہے: اکائیاں، پھر دہائیاں، پھر سینکڑے، پھر ہزار۔ خوارزمی نے بغداد میں اس پر ایک کتاب لکھی، اور اس کا ایک لاطینی ترجمہ باقی ہے جو «Dixit Algorizmi» یعنی «خوارزمی نے کہا» سے شروع ہوتا ہے۔ ان ہندسوں سے جمع، تفریق، ضرب اور تقسیم مرتب قدموں کے ساتھ لکھ کر کی جاتی ہے۔ ہندسے کی جگہ بدلنے سے اس کی قیمت کیسے بدلتی ہے؟'
  entity: invention/algorism
