expectations:
- code: C1
  text:
    en: apply the creative process to create and perform music for a variety of purposes, using the elements and techniques of music
    ar: طبِّق عملية الإبداع لتأليف الموسيقى وأدائها لأغراض متنوعة، مستخدمًا عناصر الموسيقى وتقنياتها
    ur: تخلیقی عمل کو مختلف مقاصد کے لیے موسیقی تخلیق کرنے اور پیش کرنے پر لاگو کریں، موسیقی کے عناصر اور تکنیکوں کو استعمال کرتے ہوئے
- code: C2
  text:
    en: apply the critical analysis process to communicate their feelings, ideas, and understandings in response to a variety of music and musical experiences
    ar: طبِّق عملية التحليل النقدي للتعبير عن مشاعرهم وأفكارهم وفهمهم استجابةً لمجموعة متنوعة من الموسيقى والتجارب الموسيقية
    ur: موسیقی اور موسیقیانہ تجربات کی ایک وسیع قسم کے جواب میں اپنے جذبات، خیالات اور فہم کے اظہار کے لیے تنقیدی تجزیے کا عمل لاگو کریں
- code: C3
  text:
    en: demonstrate an understanding of a variety of musical genres and styles from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لمجموعة متنوعة من الأنواع والأساليب الموسيقية من الماضي والحاضر، وسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کی موسیقی کی مختلف اصناف اور اسالیب، اور ان کے سماجی، ثقافتی اور تاریخی سیاق و سباق کی سمجھ کا مظاہرہ کریں
