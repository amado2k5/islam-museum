connections:
- position: within
  kind: story
  title:
    en: A black wind and an earthquake in 425
    ar: ريح سوداء وزلزلة سنة 425
    ur: 425 ہجری کی سیاہ آندھی اور زلزلہ
  text:
    en: Ibn al-Imad's chronicle reports that in 425 AH a black wind over Nisibin uprooted many of its orchards and knocked down a palace of baked brick, stone and lime. Ramla was then shaken and about half of it destroyed, and part of the wall of Jerusalem and the minaret of the mosque of Ascalon fell. Which of these effects fell on farmland, and which on buildings?
    ar: يروي ابن العماد في تاريخه أنه في سنة 425هـ هبّت ريح سوداء بنصيبين فقلعت كثيرًا من بساتينها وهدمت قصرًا من الآجر والحجارة والكلس. ثم زُلزلت الرملة فهُدم نحو نصفها، وسقط بعض حائط بيت المقدس ومنارة جامع عسقلان. أي هذه الآثار وقع على الأرض الزراعية، وأيها على الأبنية؟
    ur: ابن العماد کی تاریخ بتاتی ہے کہ 425 ہجری میں نصیبین پر ایک سیاہ آندھی چلی جس نے اس کے بہت سے باغ اکھاڑ دیے اور پکی اینٹ، پتھر اور چونے کا بنا ایک محل گرا دیا۔ پھر رملہ ہلا اور اس کا تقریباً آدھا حصہ تباہ ہوا، اور بیت المقدس کی دیوار کا کچھ حصہ اور عسقلان کی مسجد کا مینار گر گیا۔ ان میں سے کون سے اثرات زرعی زمین پر پڑے اور کون سے عمارتوں پر؟
  entity: event/earthquake-tsunami-425
  sources:
