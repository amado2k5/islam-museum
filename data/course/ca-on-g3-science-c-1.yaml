- position: after
  kind: story
  title:
    en: 'After the earthquake: rebuilding the Aqsa'
    ar: 'بعد الزلزلة: إعادة بناء الأقصى'
    ur: 'زلزلے کے بعد: مسجدِ اقصیٰ کی تعمیرِ نو'
  text:
    en: The earthquake of 1033 devastated Jerusalem, and the Fatimid caliph al-Zahir had al-Aqsa rebuilt between 1034 and 1036; the work was completed under al-Mustansir in 1065. The new mosque was smaller than the one before it, with seven aisles instead of fifteen. What was the rebuilt mosque like?
    ar: 'دمّرت زلزلة سنة 1033م بيت المقدس، فأعاد الخليفة الفاطمي الظاهر بناء المسجد الأقصى بين 1034 و1036م، واكتمل العمل في خلافة المستنصر سنة 1065م. وكان المسجد الجديد أصغر من سابقه: سبعة أروقة بدل خمسة عشر. كيف كان المسجد الذي أُعيد بناؤه؟'
    ur: '1033ء کے زلزلے نے بیت المقدس کو تباہ کر دیا، تو فاطمی خلیفہ الظاہر نے مسجدِ اقصیٰ کو 1034 سے 1036 کے درمیان دوبارہ بنوایا، اور کام المستنصر کے دور میں 1065ء میں مکمل ہوا۔ نئی مسجد پہلی سے چھوٹی تھی: پندرہ کی جگہ سات صحن۔ دوبارہ بنائی گئی مسجد کیسی تھی؟'
  entity: event/aqsa-fatimid-rebuild
