  title:
    en: Routes and client kings
    ar: طرق التجارة والملوك الموالون
    ur: تجارتی راستے اور وفادار بادشاہ
  text:
    en: "In The Sealed Nectar, al-Mubarakpuri calls the Byzantine empire the Romans. He writes that Yemen's trade failed as the Romans prevailed over the sea trade routes after extending their power over Egypt, Syria and northern Hijaz, and that this was among the causes of the migration of the Kahlan clans. He also writes that the Romans made the Dajaima and then the Ghassanids kings over the Arabs of Syria, to restrain the desert Arabs and to serve against the Persians. Which actions that he ascribes to the Romans touched societies far from Rome?"
    ar: "يكتب صفي الرحمن المباركفوري في «الرحيق المختوم» عن الروم، وهم الدولة البيزنطية في سجل المتحف. ويذكر أن تجارة اليمن فشلت بغلبة الرومان على طرق التجارة البحرية بعد نفوذ سلطانهم على مصر وسوريا وشمالي الحجاز، وأن ذلك كان من أسباب هجرة بطون كهلان. ويذكر أيضاً أن الرومان اصطنعوا الضجاعمة ثم الغساسنة ملوكاً على عرب الشام ليمنعوا عرب البرية وليكونوا عدة ضد الفرس. أي أفعال ينسبها إلى الرومان مسّت مجتمعات بعيدة عن روما؟"
    ur: "صفی الرحمن مبارکپوری «الرحیق المختوم» میں رومیوں کا ذکر کرتے ہیں، جنہیں میوزیم کا ریکارڈ بازنطینی سلطنت کے طور پر درج کرتا ہے۔ وہ لکھتے ہیں کہ مصر، شام اور شمالی حجاز پر رومی اقتدار کے بعد سمندری تجارتی راستوں پر ان کی بالادستی ہوئی تو یمن کی تجارت ناکام ہو گئی، اور یہ قبائل کہلان کی ہجرت کے اسباب میں سے تھا۔ وہ یہ بھی لکھتے ہیں کہ رومیوں نے شام کے عربوں پر ضجاعمہ اور پھر غساسنہ کو بادشاہ بنایا، تاکہ وہ صحرائی عربوں کو روکیں اور فارس کے مقابلے میں ایک قوت بنیں۔ وہ رومیوں کے جو اعمال بتاتے ہیں ان میں سے کون سے روم سے دور کے معاشروں تک پہنچے؟"
