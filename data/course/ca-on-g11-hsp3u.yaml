summary:
  en: 'The Ontario Grade 11 course HSP3U: research skills, then anthropology, psychology and sociology. The museum maps six expectations in two strands, through Islamic examples; the other 37 are in the gap register.'
  ar: 'مقرر HSP3U للصف الحادي عشر في أونتاريو: مهارات البحث، ثم الأنثروبولوجيا وعلم النفس وعلم الاجتماع. ويربط المتحف ستاً من توقعاته في محورين، بأمثلة إسلامية؛ وسائر التوقعات السبع والثلاثين في سجل الفجوات.'
  ur: 'اونٹاریو کا کورس HSP3U برائے جماعت یازدہم: تحقیقی مہارتیں، پھر بشریات، نفسیات اور سماجیات۔ عجائب گھر اس کی چھ توقعات کو دو شاخوں میں جوڑتا ہے، اسلامی مثالوں سے؛ باقی سینتیس فجوات کے اندراج میں ہیں۔'
  es: "El curso HSP3U de 11.º grado de Ontario abarca habilidades de investigación, seguidas de antropología, psicología y sociología. El museo presenta seis expectativas en dos ejes temáticos, a través de ejemplos islámicos; las otras 37 se encuentran en el registro de lagunas."
  fr: "Le cours HSP3U de 11e année en Ontario porte sur les compétences en recherche, puis sur l'anthropologie, la psychologie et la sociologie. Le musée illustre six attentes réparties en deux volets, à travers des exemples islamiques; les 37 autres sont répertoriées dans le registre des lacunes."
  tr: "Ontario'daki on birinci sınıf için HSP3U müfredatı, araştırma becerilerini, ardından antropoloji, psikoloji ve sosyolojiyi içermektedir. Müze, projeksiyonlarından altısını iki ana tema altında İslami örneklerle ilişkilendirirken, kalan otuz yedi projeksiyon ise boşluk doldurma yöntemiyle sunulmaktadır."
  id: "Kurikulum HSP3U untuk kelas sebelas di Ontario mencakup keterampilan penelitian, diikuti oleh antropologi, psikologi, dan sosiologi. Museum ini menghubungkan enam proyeksinya, dalam dua tema utama, dengan contoh-contoh Islam; tiga puluh tujuh proyeksi lainnya disajikan dalam register celah."
