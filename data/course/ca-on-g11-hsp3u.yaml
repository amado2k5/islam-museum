  ur: 'اونٹاریو کا کورس HSP3U برائے جماعت یازدہم: تحقیقی مہارتیں، پھر بشریات، نفسیات اور سماجیات۔ عجائب گھر اس کی چھ توقعات کو دو شاخوں میں جوڑتا ہے، اسلامی مثالوں سے؛ باقی سینتیس فجوات کے اندراج میں ہیں۔'
