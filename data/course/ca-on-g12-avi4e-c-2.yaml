  title:
    en: The arabesque and the surface
    ar: الأرابيسك والسطح
    ur: اربسک اور سطح
  text:
    en: Yeomans traces the Islamic arabesque to Samarra style B, where leaves and palmettes lose their stems and are organised into the surface geometry of polygons and polylobes. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. Which words from your own list for line, shape and pattern would you use to describe the difference?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز سامراء الثاني ⁦(ب)⁩، حيث تتجرد الأوراق والمراوح النخيلية وتفقد سيقانها وتنتظم في هندسة السطح من مضلعات ومتعددات الفصوص. ويرى أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. أي كلمات من قائمتك للخط والشكل والنمط تستعمل لوصف هذا الفرق؟
    ur: یومنز اسلامی عربیسک کی ابتدا سامرا کے دوسرے انداز ⁦(ب)⁩ میں دیکھتے ہیں، جہاں پتے اور کھجوری پنکھے تجریدی ہو جاتے ہیں، اپنی ڈنڈیاں کھو دیتے ہیں اور کثیر الاضلاع اور کثیر الفصوص اشکال کی سطحی ہندسے میں منظم ہو جاتے ہیں۔ ان کی رائے میں نباتی عربیسک منقش اور دو ابعادی ہے اور سطح کا لحاظ رکھتا ہے، برخلاف یونانی رومی آرائش کے جو بند اور فطرت کی نقالی کی طرف مائل ہے۔ لکیر، شکل اور نقش کے لیے اپنی فہرست کے کون سے الفاظ آپ اس فرق کو بیان کرنے میں برتیں گے؟
  entity: concept/arabesque
