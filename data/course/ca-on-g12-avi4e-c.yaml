summary:
  en: Terminology, conventions and techniques, and responsible practices in the visual arts (expectations C1 to C3). The museum maps two lessons, on the words and the conventions of Islamic crafts; responsible practices stay with the class.
  ar: المصطلحات والأعراف والتقنيات والممارسات المسؤولة في الفنون البصرية ⁦(التوقعات من C1 إلى C3)⁩. ويربط المتحف درسين، عن كلمات الصنائع الإسلامية وأعرافها؛ أما الممارسات المسؤولة فتبقى لصفّك.
  ur: اصطلاحات، رواج اور تکنیکیں، اور بصری فنون میں ذمہ دارانہ طریقے ⁦(توقعات C1 سے C3)⁩۔ میوزیم دو سبق جوڑتا ہے، اسلامی ہنروں کے الفاظ اور رواجوں پر؛ ذمہ دارانہ طریقے جماعت کے ذمے رہتے ہیں۔
  es: "Terminología, convenciones y técnicas, y prácticas responsables en las artes visuales (niveles C1 a C3). El museo propone dos lecciones: una sobre la terminología y otra sobre las convenciones de la artesanía islámica; la otra sobre prácticas responsables se aborda en clase."
  fr: "Terminologie, conventions et techniques, et pratiques responsables dans les arts visuels (objectifs C1 à C3). Le musée propose deux leçons, l'une sur le vocabulaire et les conventions de l'artisanat islamique; les pratiques responsables restent en classe."
  tr: "Görsel sanatlarda terminoloji, gelenekler, teknikler ve sorumlu uygulamalar (C1'den C3'e kadar beklentiler). Müze, biri İslami el sanatları terminolojisi ve gelenekleri üzerine olmak üzere iki dersi birbirine bağlıyor; sorumlu uygulamalar ise sizin sınıfınıza kalıyor."
  id: "Terminologi, konvensi, teknik, dan praktik bertanggung jawab dalam seni visual (harapan dari C1 hingga C3). Museum ini menghubungkan dua pelajaran, satu tentang terminologi dan konvensi kerajinan Islam; praktik bertanggung jawab tetap menjadi tanggung jawab kelas Anda."
