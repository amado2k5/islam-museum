expectations:
- code: C1
  text:
    en: demonstrate an understanding of, and use correct terminology when referring to, elements, principles, and other concepts related to visual arts
    ar: أظهر فهمًا للعناصر والمبادئ والمفاهيم الأخرى المتصلة بالفنون البصرية، واستعمل المصطلحات الصحيحة عند الإشارة إليها
    ur: بصری فنون سے متعلق عناصر، اصولوں اور دیگر تصورات کی سمجھ کا مظاہرہ کریں، اور ان کا ذکر کرتے وقت درست اصطلاحات استعمال کریں
- code: C2
  text:
    en: demonstrate an understanding of conventions and techniques that artists use in the creation of visual art works
    ar: أظهر فهمًا للأعراف والتقنيات التي يستعملها الفنانون في إنتاج الأعمال الفنية البصرية
    ur: بصری فن پارے تخلیق کرتے وقت فنکاروں کے برتے ہوئے رواجوں اور تکنیکوں کی سمجھ کا مظاہرہ کریں
- code: C3
  text:
    en: demonstrate an understanding of responsible practices related to visual arts
    ar: أظهر فهمًا للممارسات المسؤولة المتصلة بالفنون البصرية
    ur: بصری فنون سے متعلق ذمہ دارانہ طریقوں کی سمجھ کا مظاہرہ کریں
