summary:
  en: 'The Ontario Grade 12 university-preparation course Challenge and Change in Society has four strands: research skills, social change, social patterns and trends, and global social challenges. The museum maps two of them, through one thinker and two institutions of the Islamic world.'
  ar: 'مقرر «التحدي والتغيّر في المجتمع» للصف الثاني عشر الجامعي في أونتاريو له أربعة محاور: مهارات البحث، والتغير الاجتماعي، والأنماط والاتجاهات الاجتماعية، والتحديات الاجتماعية العالمية. ويربط المتحف محورين منها من خلال مفكر واحد ومؤسستين من العالم الإسلامي.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے جامعاتی کورس «معاشرے میں چیلنج اور تبدیلی» کے چار محور ہیں: تحقیقی مہارتیں، سماجی تبدیلی، سماجی رجحانات اور عالمی سماجی چیلنج۔ میوزیم ان میں سے دو کو عالمِ اسلام کے ایک مفکر اور دو اداروں کے ذریعے جوڑتا ہے۔'
