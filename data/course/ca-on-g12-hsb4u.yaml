summary:
  en: 'The Ontario Grade 12 university-preparation course Challenge and Change in Society has four strands: research skills, social change, social patterns and trends, and global social challenges. The museum maps two of them, through one thinker and two institutions of the Islamic world.'
  ar: 'مقرر «التحدي والتغيّر في المجتمع» للصف الثاني عشر الجامعي في أونتاريو له أربعة محاور: مهارات البحث، والتغير الاجتماعي، والأنماط والاتجاهات الاجتماعية، والتحديات الاجتماعية العالمية. ويربط المتحف محورين منها من خلال مفكر واحد ومؤسستين من العالم الإسلامي.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے جامعاتی کورس «معاشرے میں چیلنج اور تبدیلی» کے چار محور ہیں: تحقیقی مہارتیں، سماجی تبدیلی، سماجی رجحانات اور عالمی سماجی چیلنج۔ میوزیم ان میں سے دو کو عالمِ اسلام کے ایک مفکر اور دو اداروں کے ذریعے جوڑتا ہے۔'
  es: "El curso preparatorio para la universidad de último año de secundaria en Ontario, «Desafío y cambio en la sociedad», consta de cuatro ejes temáticos: habilidades de investigación, cambio social, patrones y tendencias sociales, y desafíos sociales globales. El museo ilustra dos de ellos, a través de un pensador y dos instituciones del mundo islámico."
  fr: "Le cours préparatoire universitaire de 12e année en Ontario, intitulé « Défis et changements dans la société », comporte quatre volets: les compétences en recherche, le changement social, les modèles et tendances sociaux, et les enjeux sociaux mondiaux. Le musée en illustre deux, à travers l’exemple d’un penseur et de deux institutions du monde islamique."
  tr: "Ontario'daki 12. sınıf üniversite dersi \"Toplumda Meydan Okuma ve Değişim\" dört ana temaya sahiptir: araştırma becerileri, sosyal değişim, sosyal kalıplar ve eğilimler ile küresel sosyal zorluklar. Müze, bu temalardan ikisini tek bir düşünür ve İslam dünyasından iki kurum aracılığıyla birbirine bağlıyor."
  id: "Mata kuliah universitas kelas 12 \"Tantangan dan Perubahan dalam Masyarakat\" di Ontario memiliki empat tema utama: keterampilan penelitian, perubahan sosial, pola dan tren sosial, dan tantangan sosial global. Museum ini menghubungkan dua tema tersebut melalui seorang pemikir dan dua institusi dari dunia Islam."
