expectations:
- code: C1
  text:
    en: analyse a range of historical and contemporary equity and social justice issues and the impact of economic and environmental factors on these issues
    ar: حلّل طيفًا من قضايا الإنصاف والعدالة الاجتماعية التاريخية والمعاصرة وأثر العوامل الاقتصادية والبيئية فيها
    ur: مساوات اور سماجی انصاف کے تاریخی اور معاصر مسائل کے ایک دائرے کا، اور ان مسائل پر معاشی اور ماحولیاتی عوامل کے اثر کا تجزیہ کریں
- code: C2
  text:
    en: evaluate the contributions of individuals and groups and/or movements identified with specific aspects of the struggle for equity and social justice
    ar: قيّم إسهامات أفراد وجماعات و/أو حركات ارتبطت بجوانب محددة من النضال من أجل الإنصاف والعدالة الاجتماعية
    ur: ان افراد، گروہوں اور/یا تحریکوں کی خدمات کا جائزہ لیں جو مساوات اور سماجی انصاف کی جدوجہد کے مخصوص پہلوؤں سے وابستہ ہیں
- code: C3
  text:
    en: compare policies, strategies, and initiatives used by various groups, including indigenous peoples and women, to address equity and social justice issues in a variety of jurisdictions
    ar: قارن السياسات والاستراتيجيات والمبادرات التي استخدمتها جماعات مختلفة، منها الشعوب الأصلية والنساء، لمعالجة قضايا الإنصاف والعدالة الاجتماعية في ولايات قضائية متنوعة
    ur: مختلف دائرہ ہائے اختیار میں مساوات اور سماجی انصاف کے مسائل سے نمٹنے کے لیے مختلف گروہوں، بشمول مقامی اقوام اور خواتین، کی اپنائی ہوئی پالیسیوں، حکمتِ عملیوں اور اقدامات کا موازنہ کریں
