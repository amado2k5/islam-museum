- code: F2
  text:
    en: analyse the interaction between society and various religions and belief traditions
    ar: حلّل التفاعل بين المجتمع ومختلف الأديان وتقاليد المعتقد
    ur: معاشرے اور مختلف مذاہب اور اعتقادی روایات کے باہمی تعامل کا تجزیہ کریں
- code: F3
  text:
    en: demonstrate an understanding of the challenges that adherents of various religions and belief systems experience in society
    ar: أظهر فهمًا للتحديات التي يواجهها أتباع مختلف الأديان ونظم المعتقد في المجتمع
    ur: ان چیلنجوں کی سمجھ کا مظاہرہ کریں جن کا سامنا مختلف مذاہب اور اعتقادی نظاموں کے ماننے والوں کو معاشرے میں ہوتا ہے
- code: F4
  text:
    en: describe and analyse ways in which various religions and belief traditions are interpreted and adapted within civil society and popular culture
    ar: صِف وحلّل الطرق التي تُفسَّر بها مختلف الأديان وتقاليد المعتقد وتُكيَّف داخل المجتمع المدني والثقافة الشعبية
    ur: ان طریقوں کو بیان اور ان کا تجزیہ کریں جن سے مختلف مذاہب اور اعتقادی روایات شہری معاشرے اور مقبول ثقافت میں سمجھی اور ڈھالی جاتی ہیں
