- code: F1
  text:
    en: identify and analyse ways in which various religions and belief traditions are embodied in cultural forms
    ar: حدّد وحلّل الطرق التي تتجسد بها مختلف الأديان وتقاليد المعتقد في الأشكال الثقافية
