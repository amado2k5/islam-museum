summary:
  en: 'The 2023 Ontario Grade 7 Geography course has two strands: Physical Patterns in a Changing World, and Natural Resources Around the World: Use and Sustainability. The museum links six lessons, built from nine of its thirty-seven specific expectations, to records from the Islamic world.'
  ar: 'مقرر الجغرافيا للصف السابع في منهاج أونتاريو 2023 له محوران: الأنماط الطبيعية في عالم متغيّر، والموارد الطبيعية حول العالم: الاستخدام والاستدامة. ويربط المتحف ستة دروس، بُنيت من تسعة من توقعاته الخاصة السبعة والثلاثين، بسجلات من العالم الإسلامي.'
  ur: 'اونٹاریو کے 2023 کے ساتویں جماعت کے جغرافیہ کورس کے دو محور ہیں: بدلتی دنیا میں طبعی نمونے، اور دنیا بھر کے قدرتی وسائل: استعمال اور پائیداری۔ عجائب گھر سینتیس مخصوص توقعات میں سے نو سے بنے چھ اسباق کو اسلامی دنیا کے ریکارڈوں سے جوڑتا ہے۔'
  es: "El curso de Geografía de séptimo grado de Ontario de 2023 consta de dos ejes temáticos: Patrones físicos en un mundo cambiante y Recursos naturales en todo el mundo: uso y sostenibilidad. El museo vincula seis lecciones, basadas en nueve de sus treinta y siete expectativas específicas, con registros del mundo islámico."
  fr: "Le programme de géographie de 7e année de l'Ontario pour 2023 comporte deux volets: « Modèles physiques dans un monde en mutation » et « Ressources naturelles à travers le monde: utilisation et durabilité ». Le musée relie six leçons, élaborées à partir de neuf de ses trente-sept attentes spécifiques, à des documents provenant du monde islamique."
  tr: "Ontario'nun 2023 müfredatındaki 7. sınıf coğrafya dersinin iki ana teması vardır: değişen bir dünyada doğal örüntüler ve dünya çapındaki doğal kaynaklar: kullanım ve sürdürülebilirlik. Müze, kendi 37 projeksiyonundan dokuzuna dayanan altı dersi, İslam dünyasından kayıtlarla ilişkilendiriyor."
  id: "Kurikulum geografi kelas 7 dalam silabus Ontario 2023 memiliki dua tema utama: pola alam di dunia yang berubah, dan sumber daya alam di seluruh dunia: penggunaan dan keberlanjutan. Museum ini menghubungkan enam pelajaran, yang dibangun berdasarkan sembilan dari 37 proyeksi miliknya sendiri, dengan catatan dari dunia Islam."
