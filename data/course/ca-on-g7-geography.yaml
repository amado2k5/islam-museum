summary:
  en: 'The 2023 Ontario Grade 7 Geography course has two strands: Physical Patterns in a Changing World, and Natural Resources Around the World: Use and Sustainability. The museum links six lessons, built from nine of its thirty-seven specific expectations, to records from the Islamic world.'
  ar: 'مقرر الجغرافيا للصف السابع في منهاج أونتاريو 2023 له محوران: الأنماط الطبيعية في عالم متغيّر، والموارد الطبيعية حول العالم: الاستخدام والاستدامة. ويربط المتحف ستة دروس، بُنيت من تسعة من توقعاته الخاصة السبعة والثلاثين، بسجلات من العالم الإسلامي.'
  ur: 'اونٹاریو کے 2023 کے ساتویں جماعت کے جغرافیہ کورس کے دو محور ہیں: بدلتی دنیا میں طبعی نمونے، اور دنیا بھر کے قدرتی وسائل: استعمال اور پائیداری۔ عجائب گھر سینتیس مخصوص توقعات میں سے نو سے بنے چھ اسباق کو اسلامی دنیا کے ریکارڈوں سے جوڑتا ہے۔'
