  title:
    en: Orientalism and its author
    ar: «الاستشراق» ومؤلفه
    ur: «اورینٹلزم» اور اس کے مصنف
  text:
    en: 'Edward Said, 1935–2003, was a Palestinian-American professor of literature at Columbia University and the author of Orientalism, 1978. Britannica sums up his achievement: he “showed how the Western world had historically constructed distorted images of ‘the Orient’ to justify colonialism and other forms of political subjugation”. The museum lists him as a major Palestinian intellectual of the modern Muslim world, not as a Muslim. What does it mean to construct an image of a culture?'
    ar: إدوارد سعيد، 1935–2003، أستاذ أدب فلسطيني-أمريكي في جامعة كولومبيا ومؤلف كتاب «الاستشراق» سنة 1978. وتلخّص موسوعة بريتانيكا إنجازه بأنه بيّن كيف صنع العالم الغربي عبر التاريخ صورًا مشوّهة عن «الشرق» لتبرير الاستعمار وغيره من أشكال الإخضاع السياسي. ويدرجه المتحف مفكرًا فلسطينيًا كبيرًا من مفكري عالم الإسلام الحديث، لا بوصفه مسلمًا. ماذا يعني أن تُصنع صورة عن ثقافة ما؟
    ur: ایڈورڈ سعید، 1935–2003، کولمبیا یونیورسٹی میں ادب کے فلسطینی-امریکی پروفیسر اور 1978 میں شائع «اورینٹلزم» کے مصنف تھے۔ برٹانیکا ان کے کام کا خلاصہ یوں کرتا ہے کہ انہوں نے دکھایا کہ مغربی دنیا نے تاریخی طور پر «مشرق» کی مسخ شدہ تصویریں گھڑیں تاکہ استعمار اور سیاسی محکومی کے دوسرے طریقوں کو جواز دیا جا سکے۔ میوزیم انہیں جدید عالمِ اسلام کے ایک بڑے فلسطینی مفکر کے طور پر درج کرتا ہے، مسلمان کے طور پر نہیں۔ کسی ثقافت کی تصویر گھڑنے کا کیا مطلب ہے؟
