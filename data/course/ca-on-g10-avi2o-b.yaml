expectations:
- code: B1
  text:
    en: demonstrate an understanding of the critical analysis process by examining, interpreting, evaluating, and reflecting on various art works
    ar: أظهر فهمًا لعملية التحليل النقدي من خلال فحص أعمال فنية متنوعة وتفسيرها وتقييمها والتأمل فيها
    ur: مختلف فن پاروں کا جائزہ لے کر، ان کی تعبیر، جانچ اور ان پر غور کر کے تنقیدی تجزیے کے عمل کی تفہیم ظاہر کریں
- code: B2
  text:
    en: demonstrate an understanding of how art works reflect the society in which they were created, and of how they can affect personal values
    ar: أظهر فهمًا لكيفية انعكاس المجتمع الذي أُنتجت فيه الأعمال الفنية عليها، وكيف تؤثر في القيم الشخصية
    ur: یہ سمجھ ظاہر کریں کہ فن پارے اس معاشرے کی عکاسی کیسے کرتے ہیں جس میں وہ بنائے گئے، اور وہ ذاتی اقدار پر کیسے اثر ڈال سکتے ہیں
- code: B3
  text:
    en: demonstrate an understanding of the types of knowledge and skills developed in visual arts, and describe various opportunities related to visual arts
    ar: أظهر فهمًا لأنواع المعارف والمهارات التي تنمّيها الفنون البصرية، وصف فرصًا متنوعة متصلة بالفنون البصرية
    ur: بصری فنون میں پروان چڑھنے والے علم اور مہارتوں کی اقسام کی تفہیم ظاہر کریں، اور بصری فنون سے متعلق مختلف مواقع بیان کریں
