summary:
  en: 'Critical analysis of art works, how they reflect their society, and what visual arts offer in knowledge, skills and careers (expectations B1 to B3). The museum maps two lessons: three works read for use and society, and the calligrapher''s craft.'
  ar: 'التحليل النقدي للأعمال الفنية، وكيف تعكس مجتمعها، وما تقدمه الفنون البصرية من معارف ومهارات ومهن ⁦(التوقعات من B1 إلى B3)⁩. ويربط المتحف درسين: ثلاثة أعمال تُقرأ من حيث الاستعمال والمجتمع، وصنعة الخطّاط.'
  ur: 'فن پاروں کا تنقیدی تجزیہ، وہ اپنے معاشرے کی عکاسی کیسے کرتے ہیں، اور بصری فنون علم، مہارتوں اور پیشوں میں کیا دیتے ہیں ⁦(توقعات B1 سے B3)⁩۔ میوزیم دو سبق جوڑتا ہے: استعمال اور معاشرے کے لحاظ سے پڑھے گئے تین کام، اور خطاط کا ہنر۔'
