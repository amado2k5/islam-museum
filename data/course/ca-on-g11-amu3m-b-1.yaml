  kind: story
  title:
    en: Singing women of the Abbasid court
    ar: مغنيات البلاط العباسي
    ur: عباسی دربار کی گانے والیاں
  text:
    en: In Duha al-Islam, Ahmad Amin describes the qiyan, singing slave women, as a social institution of the early Abbasid period. Their masters and teachers of singing trained them in melodies and voices. Some belonged to the caliph, the princes and the wealthy. The Kitab al-Aghani is full of their biographies. Where was this music heard, and who made it?
    ar: يصف أحمد أمين في «ضحى الإسلام» القيان، وهن جوارٍ مغنيات، بأنهن مؤسسة اجتماعية في العصر العباسي الأول. كان أسيادهن وأساتذة الغناء يدرّبونهن على الألحان والأصوات. وكان منهن قيان للخليفة والأمراء والأغنياء. وقد امتلأ كتاب «الأغاني» بتراجمهن. أين كانت تُسمع هذه الموسيقى، ومن كان يصنعها؟
    ur: احمد امین «ضحی الاسلام» میں قیان، یعنی گانے والی لونڈیوں، کو ابتدائی عباسی دور کا ایک سماجی ادارہ بتاتے ہیں۔ ان کے آقا اور گانے کے استاد انہیں راگوں اور آوازوں کی تربیت دیتے تھے۔ کچھ خلیفہ، شہزادوں اور امیروں کی ملکیت تھیں۔ «کتاب الاغانی» ان کی سوانح سے بھری ہے۔ یہ موسیقی کہاں سنی جاتی تھی، اور اسے کون بناتا تھا؟
