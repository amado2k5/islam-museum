  title:
    en: A qawwali written for a film
    ar: قوالي كُتبت لفيلم
    ur: فلم کے لیے لکھی گئی قوالی
  text:
    en: Kun Faya Kun is a qawwali composed by A. R. Rahman for the 2011 Hindi film Rockstar and dedicated to the Sufi saint Nizamuddin Auliya. The record's source recounts that the film's hero, who can express himself only through music, goes to the Nizamuddin Dargah in Delhi, spends time with the qawwals and plays with them, and that the qawwali was composed out of that journey. What does the song show about the place and the community it draws on?
    ar: «Kun Faya Kun» قوالي لحّنه أ. ر. رحمن لفيلم «روكستار» الهندي سنة 2011، وأهداه إلى الصوفي نظام الدين أولياء. وتروي مقالة المصدر أن بطل الفيلم، الذي لا يحسن التعبير إلا بالموسيقى، يلجأ إلى ضريح نظام الدين في دلهي ويقيم مع القوالين ويعزف معهم، وأن القوالي وُلد من هذه الرحلة. ماذا تُظهر الأغنية عن المكان والجماعة اللذين استقت منهما؟
    ur: «Kun Faya Kun» ایک قوالی ہے جسے اے آر رحمان نے 2011 کی ہندی فلم «روک اسٹار» کے لیے ترتیب دیا اور صوفی بزرگ نظام الدین اولیاء کے نام کیا۔ ریکارڈ کا ماخذ بتاتا ہے کہ فلم کا ہیرو، جو صرف موسیقی کے ذریعے اظہار کر پاتا ہے، دہلی میں درگاہِ نظام الدین جاتا ہے، قوالوں کے ساتھ وقت گزارتا اور ان کے ساتھ بجاتا ہے، اور اسی سفر سے قوالی تخلیق ہوئی۔ یہ گیت اس جگہ اور اس برادری کے بارے میں کیا دکھاتا ہے جس سے اس نے لیا؟
