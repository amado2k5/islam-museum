  title:
    en: A cubit by a cubit
    ar: ذراع في ذراع
    ur: ایک ذراع ضرب ایک ذراع
  text:
    ar: المساحة علم قياس السطوح والأجسام، وقد خصّه الخوارزمي بباب في كتابه يبدأ بأن معنى «واحد في واحد» إنما هو مساحة، ومعناه ذراع في ذراع. والمربع المتساوي الأضلاع الذي ضلعه اثنان أربعة أمثال سطح الذراع في الذراع، والمربع الذي ضلعه نصف ذراع ربع ذلك السطح. بماذا تغطي سطحاً لتعدّ مساحته؟
    en: Mensuration is the science of measuring areas and volumes. Al-Khwarizmi gave it a chapter of his book, which opens by saying that "one by one" means an area, that is, a cubit by a cubit. A square of side two is four times the cubit-by-cubit area, and a square of side half a cubit is a quarter of it. What would you cover a surface with to count its area?
    ur: مساحت سطحوں اور اجسام کی پیمائش کا علم ہے۔ خوارزمی نے اپنی کتاب میں اس کے لیے ایک باب رکھا جو اس بات سے شروع ہوتا ہے کہ «ایک ضرب ایک» کا مطلب رقبہ ہے، یعنی ایک ذراع ضرب ایک ذراع۔ برابر اضلاع کا مربع جس کا ضلع دو ہو، ذراع ضرب ذراع والے رقبے کا چار گنا ہے، اور جس کا ضلع آدھا ذراع ہو وہ اس کا چوتھائی ہے۔ رقبہ گننے کے لیے آپ سطح کو کس چیز سے ڈھانپیں گے؟
