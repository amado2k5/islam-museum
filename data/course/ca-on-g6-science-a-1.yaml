connections:
- position: before
  kind: career
  title:
    en: The astronomer's tables
    ar: جداول الفلكي
    ur: فلکیات دان کے جدول
  text:
    en: The astronomer watches the movements of the heavenly bodies, calculates them, and sets the results in tables called zijes. Ibrahim ibn Habib al-Fazari wrote a zij on the Arab reckoning, giving the basic tables for computing Islamic dates by the lunar calendar. Observatories were built at Maragha, Samarkand and Istanbul, and rulers sometimes paid for them. What everyday problem do tables like these solve for a community?
    ar: الفلكي هو من يرصد حركات الأجرام السماوية ويحسبها، ويضع نتائجها في جداول تُسمّى الأزياج. ووضع إبراهيم بن حبيب الفزاري زيجاً بالحساب العربي، فأعطى فيه الأصول اللازمة لحساب التواريخ الإسلامية بالتقويم القمري. وقامت مراصد في مراغة وسمرقند وإسطنبول، ورعاها الحكام أحياناً. أي مشكلة يومية تحلّها جداول كهذه لجماعة من الناس؟
    ur: فلکیات دان آسمانی اجرام کی حرکتوں کو دیکھتا اور ان کا حساب لگاتا ہے، اور نتائج کو زیج کہلانے والے جدولوں میں درج کرتا ہے۔ ابراہیم بن حبیب الفزاری نے عربی حساب پر ایک زیج لکھی، جس میں قمری تقویم سے اسلامی تاریخیں نکالنے کے لیے بنیادی اصول دیے۔ مراغہ، سمرقند اور استنبول میں رصدگاہیں قائم ہوئیں، اور حکمران کبھی کبھی ان کی سرپرستی کرتے تھے۔ ایسے جدول کسی جماعت کے لیے روزمرہ کا کون سا مسئلہ حل کرتے ہیں؟
  entity: job/astronomer
  sources:
  - source/tdv-ilm-i-felek
  - source/tdv-semerkant-rasathanesi
- position: within
  kind: career
  title:
    en: An engineer who improved earlier work
    ar: مهندس حسّن ما سبقه
    ur: پہلے کے کام کو بہتر بنانے والا انجینئر
  text:
    en: TDV places al-Jazari in a tradition extending from Hellenistic engineering to the Banu Musa, and describes an engineer improving earlier work, not the inventor of every underlying principle in his book. In his double-piston pump, flowing water drives a wheel and gears, with a pin and slotted rod converting rotation into reciprocating piston-rod motion. Whose earlier work might an engineer today build on?
    ar: تضع TDV الجزري في تقليد يمتد من الهندسة الهلنستية إلى بني موسى، وتصفه مهندساً يعنى بتحسين ما سبقه، لا مخترع كل أصل في كتابه. وفي مضخته ذات المكبسين يدير الماء دولاباً وتروساً، وينقل مسمار وقضيب مشقوق الدوران إلى ذراعي المكبسين ذهاباً وإياباً. على عمل مَن سبقه قد يبني مهندس اليوم؟
    ur: ٹی ڈی وی جزری کو ہیلینی انجینئرنگ سے بنو موسیٰ تک پھیلی روایت میں رکھتی ہے، اور اسے ایسا انجینئر بتاتی ہے جو پہلے کے کام کو بہتر بناتا ہے، اپنی کتاب کے ہر بنیادی اصول کا موجد نہیں۔ اس کے دو پسٹن والے پمپ میں بہتا پانی ایک پہیے اور گراریوں کو چلاتا ہے، اور ایک کیل اور شگافدار سلاخ گردش کو پسٹن کی سلاخوں کی آگے پیچھے حرکت میں بدلتے ہیں۔ آج کا انجینئر کس کے پہلے کام پر بنا سکتا ہے؟
  entity: person/al-jazari-engineer
  sources:
  - source/tdv-cezeri
- position: after
  kind: invention
  title:
    en: A timekeeper's marble dial
    ar: ساعة رخامية للموقِّت
    ur: وقت شناس کی سنگِ مرمر کی دھوپ گھڑی
  text:
    en: On the northern minaret of Damascus's Umayyad Mosque, Ibn al-Shatir erected a large horizontal marble sundial with curves for multiple time readings and a gnomon directed towards the celestial pole, according to David A. King. King reports equal-hour readings relative to sunrise, sunset, midday and the afternoon prayer. A timekeeper connects celestial phenomena with local schedules. Which parts of your day do you keep by the clock?
    ar: على المئذنة الشمالية من الجامع الأموي بدمشق أقام ابن الشاطر ساعة شمسية رخامية أفقية كبيرة، جمعت منحنيات لقراءات زمنية متعددة وشاخصاً موجهاً إلى القطب السماوي في وصف ديفيد كينغ. وبحسب كينغ أمكن للموقت قراءة ساعات متساوية نسبة إلى الشروق والغروب أو الظهر والعصر. يعمل الموقت بين الظاهرة السماوية والموعد المحلي. أي أجزاء من يومك تضبطها بالساعة؟
    ur: دمشق کی جامع اموی کے شمالی مینار پر ابن الشاطر نے سنگِ مرمر کی ایک بڑی افقی دھوپ گھڑی نصب کی، جس میں وقت کی متعدد قراءتوں کے خم تھے اور ایک شاخص قطبِ آسمانی کی طرف رخ کیے ہوئے تھا، یہ ڈیوڈ کنگ کی تفصیل کے مطابق ہے۔ کنگ کے مطابق وقت شناس طلوع و غروب یا ظہر و عصر کے لحاظ سے برابر گھنٹے پڑھ سکتا تھا۔ وقت شناس آسمانی مظہر اور مقامی وقت کے درمیان کام کرتا ہے۔ آپ کے دن کے کون سے حصے گھڑی سے طے ہوتے ہیں؟
  entity: invention/shatir-polar-sundial
