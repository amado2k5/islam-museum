  title:
    en: The dot, the ruler and the template
    ar: النقطة والمسطر والقالب
    ur: نقطہ، پیمانہ اور سانچہ
  text:
    en: 'Letters are measured in units of a dot, a diamond or square shape the pen makes when its full width touches the paper. Lines are set with a ruler called the mistar. For large work the master made a template, the kalip: the outline of the letters was pricked with a needle through several sheets, and the surface dusted with charcoal or chalk so the design passed to the sheet below. Which of these words do you already use under another name?'
    ar: 'يُقاس الحرف بوحدة النقطة، وهي شكل معيّن أو مربع يرسمه القلم بكامل فوهته على الورق. وتُضبط الأسطر بأداة تُسمى «المِسطر». وفي الجلي تُنقل الكتابة بإنشاء «القالب»: تُثقب الحروف بإبرة على طول حدودها في أكثر من طبقة من الورق، ثم يُنفض السطح بالفحم أو بالطباشير، فيظهر الخط على الورقة الأخرى. أي هذه الألفاظ تستعملها أنت باسم آخر؟'
    ur: 'حرف کی ناپ نقطے کی اکائی میں ہوتی ہے، یعنی معین یا چوکور شکل جو قلم اپنی پوری نوک کاغذ سے لگنے پر بناتا ہے۔ سطریں «مِسطر» نامی اوزار سے سیدھی کی جاتی ہیں۔ بڑے کام میں استاد «سانچہ» بناتا: حروف کی حدود پر کئی کاغذوں میں سوئی سے سوراخ کیے جاتے، پھر سطح پر کوئلہ یا چاک چھڑکا جاتا تاکہ نقش نیچے کے کاغذ پر آ جائے۔ ان میں سے کون سا لفظ آپ پہلے ہی کسی اور نام سے استعمال کرتے ہیں؟'
