  title:
    en: Pouncing
    ar: النقل بالتثقيب
    ur: سوراخ دار خاکے سے نقل
  text:
    en: 'Pouncing was a way of copying a miniature or part of a composition: transparent deerskin was laid over the original and its outline traced, the line closely pricked with a fine needle, then the pricked skin laid on the paper and charcoal dabbed on it from a mesh bag, penetrating the holes to leave a guiding outline. Can you explain the term to a classmate in your own words?'
    ar: 'النقل بالتثقيب طريقة لنقل تصويرة أو جزء من تكوين: يوضع جلد غزال شفاف على الأصل ويُرسم عليه خطه، ثم يثقب الخط بإبرة دقيقة، ثم يوضع الجلد المثقوب على الورق ويُذر عليه الفحم بكيس شبكي فينفذ من الثقوب ويرسم خطًا يهتدي به الناسخ. هل تستطيع أن تشرح اللفظ لزميلك بكلماتك؟'
    ur: 'پاؤنسنگ، یعنی سوراخ دار خاکے سے نقل، کسی تصویر یا ترکیب کے حصے کو نقل کرنے کا طریقہ تھا: شفاف ہرن کی کھال اصل پر رکھ کر اس کا خاکہ کھینچا جاتا، لکیر کو باریک سوئی سے گھنے سوراخوں سے چھیدا جاتا، پھر چھیدی ہوئی کھال کاغذ پر رکھ کر جالی دار تھیلی سے اس پر کوئلہ چھڑکا جاتا جو سوراخوں سے گزر کر رہنما خاکہ چھوڑ دیتا۔ کیا آپ یہ اصطلاح اپنے ہم جماعت کو اپنے الفاظ میں سمجھا سکتے ہیں؟'
  entity: practice/pouncing-in-persian-painting
  sources:
  - source/titley-persian-miniature-painting-1983
- position: within
  kind: career
  title:
    en: Cut tile, lustre and mina'i
    ar: القاشاني المقطوع والبريق المعدني والمينائي
    ur: کٹے ہوئے ٹائل، آب دار چمک اور مینائی
  text:
    en: 'The TDV entry on glazed tile uses terms a student can learn. Cut tile mosaic is made of turquoise, purple, green and cobalt glazes cut to shape and set in plaster. The Seljuks developed lustre: the design was painted on a glaze with a silver or copper oxide mixture and fired again at low heat. The mina''i technique paints seven colours over a fired glaze and fires it again. Which of these terms could you explain with a diagram?'
    ar: 'يستعمل مدخل موسوعة TDV عن البلاط المزجّج ألفاظًا يستطيع الطالب أن يتعلمها. فسيفساء القاشاني المقطوعة بالفيروزي والأرجواني والأخضر والأزرق الكوبالتي تُقص وتُثبت بالجص. وطوّر السلاجقة البريق المعدني: رُسم النقش على طلاء بخليط من أكسيد الفضة أو النحاس وشُوي ثانية بحرارة منخفضة. وأما المينائي فبسبعة ألوان تُرسم فوق طلاء مشوي ثم يُعاد شيّها. أي هذه الألفاظ تستطيع أن تشرحه برسم؟'
    ur: 'شیشہ دار ٹائل پر TDV کا اندراج ایسی اصطلاحات استعمال کرتا ہے جو طالب علم سیکھ سکتا ہے۔ کٹے ہوئے ٹائل کا موزائیک فیروزی، ارغوانی، سبز اور کوبالٹ نیلے شیشوں کو شکل میں کاٹ کر گچ میں جمانے سے بنتا ہے۔ سلجوقیوں نے آب دار چمک کو ترقی دی: نقش چاندی یا تانبے کے آکسائیڈ کے مرکب سے شیشے پر بنایا جاتا اور کم حرارت پر دوبارہ پکایا جاتا۔ مینائی تکنیک میں سات رنگ پہلے سے پکے ہوئے شیشے پر بنائے جاتے ہیں اور دوبارہ پکائے جاتے ہیں۔ ان میں سے کون سی اصطلاح آپ خاکے سے سمجھا سکتے ہیں؟'
