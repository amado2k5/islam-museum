  title:
    en: The dark room
    ar: البيت المظلم
    ur: تاریک کمرہ
  text:
    en: Ibn al-Haytham let the light of the sun, the moon, the stars and a fire into a dark room through a small hole and studied it on the opposite wall. He cut its path with an opaque body and laid a ruler along it, and found it perfectly straight. TDV calls this experiment the basis of today's photographic camera. Which property of light does a camera depend on?
    ar: أدخل ابن الهيثم ضوء الشمس والقمر والكواكب والنار من ثقب صغير إلى بيت مظلم، وتأمله على الجدار المقابل. قطع طريقه بجسم كثيف ومدّ عليه مسطرة فوجده في غاية الاستقامة. وتعدّ موسوعة TDV هذه التجربة أساس آلة التصوير اليوم. على أي خاصية من خصائص الضوء تعتمد آلة التصوير؟
    ur: ابن الہیثم نے سورج، چاند، ستاروں اور آگ کی روشنی ایک چھوٹے سوراخ سے تاریک کمرے میں آنے دی اور سامنے کی دیوار پر اس کا مطالعہ کیا۔ اس نے ایک ٹھوس جسم سے اس کا راستہ کاٹا اور اس پر پیمانہ رکھا تو اسے بالکل سیدھا پایا۔ TDV اس تجربے کو آج کے فوٹوگرافی کیمرے کی بنیاد کہتی ہے۔ کیمرہ روشنی کی کس خصوصیت پر انحصار کرتا ہے؟
