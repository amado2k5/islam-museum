  kind: invention
  title:
    ar: نصف الواحد خمسة أعشار
    en: A half is five tenths
    ur: آدھا یعنی پانچ دسویں
  text:
    ar: في كتاب ألّفه الإقليدسي بدمشق سنة 341هـ/952–953م معالجة مبكرة مباشرة للكسور العشرية داخل الحساب الهندي ذي القيمة المكانية. يعرض سعيدان السلسلة 13 ثم 6.5 ثم 3.25 ثم 1.625 ثم 0.8125 بالتنصيف المتكرر، ويذكر خطاً فوق منزلة الآحاد يصر المؤلف على استعماله. ويؤكد السجل أن هذا ليس اختراع الأرقام الهندية ولا النقطة العشرية الحالية. لماذا يفيد أن نعلّم منزلة الآحاد؟
    en: A book composed by al-Uqlidisi at Damascus in 341 AH (952–953 CE) contains an early direct treatment of decimal fractions within Indian place-value arithmetic. Saidan gives the repeated-halving sequence 13, 6.5, 3.25, 1.625, 0.8125, and describes a stroke over the units position that the author insists should be used. The record stresses that this is not the invention of the Indian numerals or of today's decimal point. Why does it help to mark the units place?
    ur: اقلیدسی کی دمشق میں سن 341ھ / 952–953ء میں لکھی ہوئی کتاب میں ہندوستانی مقامی قدر والے حساب کے اندر اعشاری کسور کا ایک ابتدائی براہِ راست بیان ملتا ہے۔ سعیدان بار بار آدھا کرنے سے 13، 6.5، 3.25، 1.625، 0.8125 کی لڑی بتاتے ہیں، اور اکائی کے مقام کے اوپر ایک لکیر کا ذکر کرتے ہیں جسے مصنف استعمال کرنے پر اصرار کرتا ہے۔ ریکارڈ زور دیتا ہے کہ یہ ہندوستانی ہندسوں یا آج کے اعشاری نقطے کی ایجاد نہیں۔ اکائی کا مقام نشان زد کرنا کیوں مددگار ہے؟
