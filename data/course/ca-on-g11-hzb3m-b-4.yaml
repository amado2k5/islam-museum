  title:
    en: A soul that is not a body
    ar: نفس ليست بجسم
    ur: نفس جو جسم نہیں
  text:
    en: "Al-Mas'udi attributes to some people the claim that the soul is a substance that is not a body, living, knowing and governing bodies, and that its death is its passing from one body to another. How would you define the soul using only these words?"
    ar: "ينسب المسعودي إلى قوم زعموا أن النفس جوهر ليست بجسم، حية عالمة مدبرة للأجسام، وأن موتها انتقالها من جسد إلى جسد. كيف تعرّف النفس بهذه الألفاظ وحدها؟"
    ur: "مسعودی کچھ لوگوں کی طرف یہ دعویٰ منسوب کرتے ہیں کہ نفس ایک جوہر ہے جو جسم نہیں، زندہ، عالم اور اجسام کی مدبر ہے، اور اس کی موت ایک جسم سے دوسرے جسم میں اس کا منتقل ہونا ہے۔ آپ صرف انہی الفاظ سے نفس کی تعریف کیسے کریں گے؟"
  entity: person/aflatun
  sources:
  - source/muruj-al-dhahab
- position: after
  kind: reflection
  title:
    en: The servant's deed and the decree
    ar: فعل العبد والقدر
    ur: بندے کا فعل اور قدر
  text:
    en: "On human acts and the decree, Ibn Qudama holds in Lum'at al-I'tiqad that the servant has a deed and an acquisition, requited for its good with reward and its evil with punishment, occurring by God's decree. Ibn Taymiyya holds in al-'Aqida al-Wasitiyya that servants have power over their deeds and will, and God is the creator of their power and will. Which word would you define first, freedom or decree?"
    ar: "في الكلام على فعل العبد والقدر، يرى ابن قدامة في «لمعة الاعتقاد» أن للعبد فعلاً وكسباً يجزى على حسنه بالثواب وعلى سيئه بالعقاب، وهو واقع بقضاء الله وقدره. ويرى ابن تيمية في «العقيدة الواسطية» أن للعباد قدرة على أعمالهم ولهم إرادة، والله خالقهم وخالق قدرتهم وإرادتهم. أي لفظ تعرّف أولاً: الحرية أم القدر؟"
    ur: "بندے کے فعل اور قدر کے بارے میں ابن قدامہ «لمعۃ الاعتقاد» میں کہتے ہیں کہ بندے کا ایک فعل اور کسب ہے جس کی بھلائی پر ثواب اور برائی پر عذاب ملتا ہے، اور وہ اللہ کے قضا و قدر سے واقع ہوتا ہے۔ ابن تیمیہ «العقیدہ الواسطیہ» میں کہتے ہیں کہ بندوں کو اپنے اعمال پر قدرت اور ارادہ حاصل ہے، اور اللہ ان کا اور ان کی قدرت و ارادے کا خالق ہے۔ آپ کس لفظ کی تعریف پہلے کریں گے: آزادی یا قدر؟"
  entity: concept/qadar
