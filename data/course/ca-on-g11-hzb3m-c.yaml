expectations:
- code: C1
  text:
    en: demonstrate an understanding of terms, methods, and fallacies associated with philosophical reasoning
    ar: أظهر فهمًا للمصطلحات والمناهج والمغالطات المرتبطة بالاستدلال الفلسفي
    ur: فلسفیانہ استدلال سے وابستہ اصطلاحات، طریقوں اور مغالطوں کی فہم کا مظاہرہ کریں
- code: C2
  text:
    en: analyse, using their own philosophical reasoning skills as well as the arguments of other critics, the strengths and weaknesses of the responses of major philosophers or schools of philosophy to some of the big questions of philosophy
    ar: حلِّل، بمهارات الاستدلال الفلسفي الخاصة بك وبحجج نقّاد آخرين، مواطن القوة والضعف في أجوبة كبار الفلاسفة أو المدارس الفلسفية عن بعض الأسئلة الكبرى في الفلسفة
    ur: اپنی فلسفیانہ استدلالی مہارتوں اور دوسرے ناقدین کے دلائل کی مدد سے، بڑے فلسفیوں یا فلسفیانہ مکاتب کے فلسفے کے کچھ بڑے سوالات پر جوابات کی خوبیوں اور کمزوریوں کا تجزیہ کریں
- code: C3
  text:
    en: use philosophical reasoning and critical thinking skills to formulate responses to big questions of philosophy and to arguments encountered in everyday life
    ar: وظّف الاستدلال الفلسفي ومهارات التفكير الناقد لصياغة أجوبة عن الأسئلة الكبرى في الفلسفة وعن الحجج التي تصادفها في الحياة اليومية
    ur: فلسفیانہ استدلال اور تنقیدی سوچ کی مہارتوں کو بروئے کار لا کر فلسفے کے بڑے سوالات اور روزمرہ زندگی میں سامنے آنے والے دلائل کے جوابات تشکیل دیں
