expectations:
- code: C1
  text:
    en: demonstrate an understanding of artistic expressions, philosophies, and religious/spiritual beliefs found within specific cultures, and of how these expressions relate to various aspects of those cultures
    ar: أظهر فهمًا للتعبيرات الفنية والفلسفات والمعتقدات الدينية أو الروحية الموجودة في ثقافات بعينها، ولكيفية ارتباط هذه التعبيرات بجوانب متعددة من تلك الثقافات
    ur: مخصوص ثقافتوں میں پائے جانے والے فنی اظہارات، فلسفوں اور مذہبی یا روحانی عقائد کی سمجھ ظاہر کریں، اور یہ کہ یہ اظہارات ان ثقافتوں کے مختلف پہلوؤں سے کیسے جڑے ہیں
- code: C2
  text:
    en: analyse specific cultural expressions and a range of factors that can affect them
    ar: حلّل تعبيرات ثقافية محددة ومجموعة من العوامل التي قد تؤثر فيها
    ur: مخصوص ثقافتی اظہارات اور ان پر اثر انداز ہو سکنے والے عوامل کی ایک رینج کا تجزیہ کریں
- code: C3
  text:
    en: assess the contributions to and influence on various cultures/societies, including Canada, of a diverse range of ethnocultural groups and individuals from those groups
    ar: قيّم إسهامات مجموعات إثنية ثقافية متنوعة وأفراد منها في ثقافات ومجتمعات مختلفة، ومنها كندا، وتأثيرها فيها
    ur: مختلف ثقافتوں اور معاشروں، بشمول کینیڈا، میں متنوع نسلی و ثقافتی گروہوں اور ان کے افراد کے حصے اور اثر کا جائزہ لیں
