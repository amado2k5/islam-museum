  title:
    en: Taken from the rich, returned to the poor
    ar: تؤخذ من الأغنياء وترد على الفقراء
    ur: امیروں سے لیا، غریبوں کو دیا
  text:
    en: 'Zakat is an obligation of Islam and a pillar of the religion. The record gives the Prophet''s instruction to Muadh for Yemen: God had imposed a sadaqa on their wealth, "taken from their rich and returned to their poor". It explains the word as growth and increase. In what ways could a duty like this alleviate poverty, and in what ways might it not?'
    ar: الزكاة فريضة من فرائض الإسلام وركن من أركان الدين. ويذكر السجل توجيه النبي معاذًا إلى اليمن بأن الله افترض عليهم صدقة في أموالهم «تؤخذ من أغنيائهم وترد على فقرائهم». ويفسّر لفظ الزكاة بالنماء والزيادة. بأي طرق يمكن لواجب كهذا أن يخفف الفقر، وبأي طرق قد لا يفعل؟
    ur: زکوٰۃ اسلام کے فرائض اور دین کے ارکان میں سے ہے۔ ریکارڈ میں نبی کی معاذ کو یمن کے لیے ہدایت درج ہے کہ اللہ نے ان کے مالوں میں صدقہ فرض کیا ہے «جو ان کے امیروں سے لیا اور ان کے غریبوں کو دیا جائے»۔ ریکارڈ لفظ کو نمو اور اضافے سے سمجھاتا ہے۔ ایسا فرض غربت کو کن طریقوں سے کم کر سکتا ہے، اور کن طریقوں سے شاید نہ کر سکے؟
  entity: practice/zakat
