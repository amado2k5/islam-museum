- position: after
  kind: invention
  title:
    en: Keeping the capital, giving the yield
    ar: حبس الأصل وتسبيل الثمرة
    ur: اصل کو روکنا، آمدنی کو خیرات کرنا
  text:
    en: A waqf is an act by which an owner locks the capital of his property away from sale, gift and inheritance and gives its yield to a good cause for ever; the TDV encyclopedia says the beneficiary may be a described group such as the poor, students or travellers. The TDV encyclopedia also says that from this formula grew a system that funded most of the mosques, colleges, hospitals, public fountains and soup kitchens of Muslim cities from the mid-eighth century to the late nineteenth. Who bore the cost of such services?
    ar: الوقف تصرّف يحبس فيه المالك أصل ماله عن البيع والهبة والإرث، ويجعل غلّته لوجه من وجوه البر على الدوام؛ وتقول موسوعة TDV إن الموقوف عليه قد يكون جماعة موصوفة كالفقراء والطلاب والمسافرين. وتقول الموسوعة نفسها إن من هذه الصيغة نشأ نظام قامت عليه أكثر مساجد المدن الإسلامية ومدارسها ومستشفياتها وسُبلها وعماراتها التي تطعم الفقراء من منتصف القرن الثامن إلى أواخر القرن التاسع عشر. من كان يتحمل كلفة هذه الخدمات؟
    ur: وقف ایک ایسا عمل ہے جس کے ذریعے مالک اپنی جائیداد کی اصل کو بیچنے، ہبہ کرنے اور وراثت میں جانے سے روک دیتا ہے، اور اس کی آمدنی ہمیشہ کے لیے کسی نیک مقصد کو دے دیتا ہے؛ TDV انسائیکلوپیڈیا کے مطابق فائدہ اٹھانے والا کوئی بیان کردہ گروہ ہو سکتا ہے جیسے غریب، طلبہ یا مسافر۔ اسی انسائیکلوپیڈیا کے مطابق اسی صیغے سے ایک ایسا نظام پروان چڑھا جس نے آٹھویں صدی کے وسط سے انیسویں صدی کے اواخر تک مسلم شہروں کی بیشتر مساجد، مدارس، شفاخانوں، سبیلوں اور غریبوں کو کھانا کھلانے والی عمارتوں کا خرچ اٹھایا۔ ایسی خدمات کا خرچ کون اٹھاتا تھا؟
  entity: invention/waqf
