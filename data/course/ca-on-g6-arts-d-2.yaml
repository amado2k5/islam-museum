connections:
- position: before
  kind: story
  title:
    en: A report on the first Arabic letters
    ar: رواية في أصل الخط العربي
    ur: خطِ عربی کی ابتدا کی ایک روایت
  text:
    en: Al-Baladhuri relays from al-Sharqi ibn al-Qatami a report about the origin of the Arabic script. Three men of Tayy gathered at Baqqa, namely Maramir ibn Murra, Aslam ibn Sidra and Amir ibn Jadra. They devised the script, measuring the spelling of Arabic against the spelling of Syriac. The record notes that this is a single report from a single narrator, with no date. Why might a script take shape by being measured against another?
    ar: ينقل البلاذري عن الشرقي بن القطامي رواية في أصل الخط العربي. اجتمع ثلاثة من طيئ في بقة، هم مرامر بن مرة وأسلم بن سدرة وعامر بن جدرة، فوضعوا الخط وقاسوا هجاء العربية على هجاء السريانية. ويلاحظ السجل أنها رواية واحدة منسوبة إلى راوٍ واحد ولا تاريخ لها. لماذا قد يتشكّل خط بمقايسته على خط آخر؟
    ur: البلاذری الشرقی بن القطامی سے خطِ عربی کی ابتدا کے بارے میں ایک روایت نقل کرتے ہیں۔ قبیلہ طَیّ کے تین آدمی بَقّہ میں جمع ہوئے، یعنی مرامر بن مرہ، اسلم بن سدرہ اور عامر بن جدرہ۔ انہوں نے خط وضع کیا اور عربی کے ہجے کو سریانی کے ہجے پر پرکھا۔ ریکارڈ نوٹ کرتا ہے کہ یہ ایک راوی سے منسوب ایک ہی روایت ہے اور اس کی کوئی تاریخ نہیں۔ کوئی خط کسی دوسرے خط سے ناپ کر کیوں ڈھل سکتا ہے؟
  entity: event/arabic-script-origin
  sources:
  - source/futuh-buldan-maarif-1407
- position: within
  kind: story
  title:
    en: Meccan, Medinan, Basran, Kufic
    ar: المكي والمدني والبصري والكوفي
    ur: مکی، مدنی، بصری اور کوفی
  text:
    en: In the Fihrist, Ibn al-Nadim surveys the accounts of the beginning of Arabic writing. He says the first of the Arabic scripts was the Meccan, then the Medinan, then the Basran, then the Kufic, and he notes in the Meccan and Medinan an inclination of the alifs toward the right hand. The record adds that he gives several accounts without preference. How could you tell one style of writing from another?
    ar: في «الفهرست» يستقصي ابن النديم أخبار ابتداء الخط العربي. ويذكر أن أول الخطوط العربية المكي، ثم المدني، ثم البصري، ثم الكوفي، ويلاحظ في المكي والمدني تعويجًا في الألفات إلى يمنة اليد. ويضيف السجل أنه ينقل أقوالًا متعددة دون ترجيح. كيف تميّز أسلوب كتابة من آخر؟
    ur: «الفہرست» میں ابن الندیم خطِ عربی کے آغاز کی روایتیں جمع کرتے ہیں۔ وہ بتاتے ہیں کہ عربی خطوں میں پہلا مکی تھا، پھر مدنی، پھر بصری، پھر کوفی، اور مکی اور مدنی میں الفوں کے دائیں ہاتھ کی طرف جھکاؤ کا ذکر کرتے ہیں۔ ریکارڈ بتاتا ہے کہ وہ کئی روایتیں بغیر ترجیح کے نقل کرتے ہیں۔ آپ ایک طرزِ تحریر کو دوسرے سے کیسے پہچانیں گے؟
  entity: concept/khatt-al-arabi
  sources:
  - source/fihrist-ibn-al-nadim
- position: after
  kind: object
  title:
    en: Beautiful writing
    ar: كتابة جميلة
    ur: خوبصورت تحریر
  text:
    en: "Islamic calligraphy is the art of writing and shaping the Arabic letter beautifully. Its scripts include Kufic, Naskh, Thuluth and Diwani. What can a style of writing tell you about the community that used it?"
    ar: "الخط الإسلامي فن كتابة الحرف العربي وتشكيله جمالياً. ومن خطوطه الكوفي والنسخ والثلث والديواني. ماذا يستطيع أسلوب في الكتابة أن يخبرك عن الجماعة التي استعملته؟"
    ur: "اسلامی خطاطی عربی حرف کو خوبصورتی سے لکھنے اور ڈھالنے کا فن ہے۔ اس کے خطوں میں کوفی، نسخ، ثلث اور دیوانی شامل ہیں۔ تحریر کا کوئی اسلوب آپ کو اسے استعمال کرنے والی جماعت کے بارے میں کیا بتا سکتا ہے؟"
  entity: concept/islamic-calligraphy
