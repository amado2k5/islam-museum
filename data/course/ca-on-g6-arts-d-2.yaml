  ur: کسی تحریری نظام اور اس کے اسالیب کو علامات کے طور پر کیسے پڑھا جائے، اور کوئی فن کسی جماعت کے عقائد اور روایات کی عکاسی کیسے کرتا ہے ⁦(D2.3 اور D3.1)⁩
