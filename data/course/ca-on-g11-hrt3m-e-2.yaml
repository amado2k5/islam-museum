  title:
    en: A festival named for returning
    ar: عيد سُمّي لأنه يعود
    ur: واپسی کے نام پر تہوار
  text:
    en: 'Eid al-Fitr falls on the first of Shawwal and closes Ramadan. The Kuwaiti encyclopaedia of jurisprudence says ''Eid comes from ''awd, returning, because it recurs, and that Muslims have two: the day of fitr, the first of Shawwal, and the day of adha, the tenth of Dhu al-Hijja. Why might a festival be named for returning?'
    ar: 'يقع عيد الفطر في أول شوال ويختم رمضان. وتقول الموسوعة الفقهية الكويتية إن العيد من العَوْد، لأنه يعود، وإن للمسلمين عيدين: يوم الفطر في أول شوال ويوم الأضحى في العاشر من ذي الحجة. لماذا يُسمّى عيد باسم العَوْد؟'
    ur: 'عید الفطر یکم شوال کو آتی ہے اور رمضان کو ختم کرتی ہے۔ کویتی فقہی انسائیکلوپیڈیا کے مطابق عید کا لفظ عَوْد یعنی لوٹنے سے ہے کیونکہ وہ بار بار آتی ہے، اور مسلمانوں کی دو عیدیں ہیں: یومِ فطر یکم شوال کو اور یومِ اضحیٰ دس ذوالحجہ کو۔ کسی تہوار کا نام لوٹنے پر کیوں رکھا جا سکتا ہے؟'
  entity: practice/eid-al-fitr
