expectations:
- code: C1
  text:
    en: apply the creative process to create and perform music for a variety of purposes, using the elements and techniques of music
    ar: طبِّق عملية الإبداع لابتكار الموسيقى وأدائها لأغراض متنوعة، مستخدمًا عناصر الموسيقى وتقنياتها
    ur: موسیقی کے عناصر اور تکنیکوں کو استعمال کرتے ہوئے مختلف مقاصد کے لیے موسیقی تخلیق کرنے اور پیش کرنے کے لیے تخلیقی عمل لاگو کریں
- code: C2
  text:
    en: apply the critical analysis process to communicate their feelings, ideas, and understandings in response to a variety of music and musical experiences
    ar: طبِّق عملية التحليل النقدي للتعبير عن مشاعرهم وأفكارهم وفهمهم استجابةً لمجموعة متنوعة من الموسيقى والتجارب الموسيقية
    ur: موسیقی اور موسیقی کے مختلف تجربات کے جواب میں اپنے جذبات، خیالات اور فہم کے اظہار کے لیے تنقیدی تجزیے کا عمل لاگو کریں
- code: C3
  text:
    en: demonstrate an understanding of a variety of musical genres and styles from the past and present, and their social and/or community contexts
    ar: أظهر فهمًا لمجموعة متنوعة من الأنواع والأساليب الموسيقية من الماضي والحاضر، وسياقاتها الاجتماعية و/أو المجتمعية
    ur: ماضی اور حال کی موسیقی کی اصناف اور اسالیب کی ایک وسیع قسم، اور ان کے سماجی اور/یا برادری کے سیاق و سباق کو سمجھنے کا مظاہرہ کریں
