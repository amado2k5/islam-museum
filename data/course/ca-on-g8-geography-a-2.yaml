  text:
    en: In al-Baladhuri's account, al-Hajjaj dug the river al-Nil and the river al-Zabi, naming the second for the old al-Zabi from which he took it. He revived the lands on both rivers and founded the town known as al-Nil, which he made a garrison city. How does a dug waterway change the land beside it?
    ar: عند البلاذري احتفر الحجاج نهر النيل ونهر الزابي، وسمّى الثاني زابياً لأنه أخذه من الزابي القديم. وأحيا الأرضين التي عليهما، وأحدث المدينة المعروفة بالنيل واتخذها مصراً. كيف يغيّر مجرى محفور الأرض التي إلى جانبه؟
    ur: البلاذری کے بیان میں حجاج نے نہرِ نیل اور نہرِ زابی کھودی، اور دوسری کو زابی اس لیے کہا کہ اسے پرانے زابی سے نکالا تھا۔ انہوں نے ان دونوں پر واقع زمینوں کو آباد کیا اور نیل کے نام سے معروف شہر قائم کر کے اسے فوجی چھاؤنی شہر بنایا۔ کھودی ہوئی نہر اپنے پہلو کی زمین کو کیسے بدل دیتی ہے؟
