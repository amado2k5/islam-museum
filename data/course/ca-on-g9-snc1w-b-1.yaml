  kind: invention
  title:
    en: Which land, which water?
    ar: أي أرض وأي ماء؟
    ur: کون سی زمین، کون سا پانی؟
  text:
    en: In Al-Qasd wa-l-bayan, Ibn Bassal distinguishes four water sources and ten practical land types, and relates their observed properties to season, plants and cultivation. His soil chapter warns that the surface can differ from what lies beneath, and that judging land needs examination and repeated practice. The record adds that his ten types are not a modern laboratory standard. What would you test in a local soil?
    ar: في «القصد والبيان» يميز ابن بصال أربعة مصادر للماء وعشرة أنواع عملية من الأرض، ويربط الخواص التي يلاحظها بالموسم والنبات وما تحتاجه الأرض من خدمة. وينبه في باب الأرضين إلى أن السطح قد يختلف عن الباطن، وأن الحكم يحتاج اختبارًا وامتحانًا وعملًا متكررًا. وليست فئاته العشر معيارًا مخبريًا حديثًا. ماذا ستفحص في تربة منطقتك؟
    ur: «القصد والبیان» میں ابن بصال پانی کے چار ذرائع اور زمین کی دس عملی اقسام میں فرق کرتا ہے، اور دیکھی ہوئی خصوصیات کو موسم، پودوں اور کاشت سے جوڑتا ہے۔ زمین کے باب میں وہ خبردار کرتا ہے کہ سطح اندر کی تہہ سے مختلف ہو سکتی ہے، اس لیے زمین پر حکم لگانے کے لیے جانچ اور بار بار کے عملی تجربے کی ضرورت ہے۔ ریکارڈ کہتا ہے کہ اس کی دس اقسام جدید تجربہ گاہی معیار نہیں ہیں۔ آپ اپنے علاقے کی مٹی میں کیا جانچیں گے؟
