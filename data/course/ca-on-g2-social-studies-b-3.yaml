  title:
    en: One author on living with the environment
    ar: كاتب عن العيش مع البيئة
    ur: ماحول کے ساتھ رہنے پر ایک مصنف
  text:
    en: Muhyi al-Din Afifi Ahmad holds, the record says, that the pollution of water, air and soil threatens the safety of persons and societies. He presents Islam as asking people to make good use of their natural environment and to live with it in a way that keeps what it needs. These are the author's own views. What could happen to a village if its water or soil were used up?
    ar: يرى محيي الدين عفيفي أحمد، بحسب السجل، أن تلوث الماء والهواء والأرض يهدد سلامة الأفراد والمجتمعات. ويعرض أن الإسلام حرص على أن يحسن الناس استغلال بيئتهم الطبيعية وأن يتعايشوا معها بما يحفظ ما تحتاج إليه. وهذه قراءة الكاتب ونسبتها إليه. ماذا قد يحدث لقرية إذا استُنفد ماؤها أو تربتها؟
    ur: ریکارڈ کے مطابق محی الدین عفیفی احمد کا خیال ہے کہ پانی، ہوا اور زمین کی آلودگی افراد اور معاشروں کی سلامتی کو خطرے میں ڈالتی ہے۔ وہ پیش کرتے ہیں کہ اسلام نے چاہا کہ لوگ اپنے قدرتی ماحول سے اچھی طرح فائدہ اٹھائیں اور اس کے ساتھ اس طرح رہیں کہ اس کی ضرورت کی چیزیں محفوظ رہیں۔ یہ مصنف کی اپنی رائے ہے۔ اگر کسی گاؤں کا پانی یا مٹی ختم ہو جائے تو کیا ہو سکتا ہے؟
