expectations:
- code: B3.1
  text:
    en: demonstrate an understanding that there are a variety of countries, continents, physical features, and bodies of water around the world and that their locations can be represented in different ways […]
    ar: أظهر فهمًا بأن في العالم دولًا وقاراتٍ ومعالمَ طبيعية ومسطحاتٍ مائية متنوعة، وأن مواقعها يمكن تمثيلها بطرق مختلفة […]
    ur: سمجھ کا مظاہرہ کریں کہ دنیا میں مختلف ممالک، براعظم، طبعی خدوخال اور آبی ذخائر ہیں اور ان کے مقامات کو مختلف طریقوں سے ظاہر کیا جا سکتا ہے […]
- code: B3.2
  text:
    en: identify continents, significant bodies of water, the equator, poles, and hemispheres, using a globe, print, digital, or interactive maps, and/or a mapping program
    ar: حدّد القارات والمسطحات المائية المهمة وخط الاستواء والقطبين ونصفَي الكرة الأرضية، مستعينًا بكرة أرضية أو بخرائط مطبوعة أو رقمية أو تفاعلية و/أو ببرنامج خرائط
    ur: گلوب، چھپے ہوئے، ڈیجیٹل یا متعامل نقشوں اور/یا نقشہ سازی کے پروگرام کی مدد سے براعظموں، اہم آبی ذخائر، خطِ استوا، قطبین اور نصف کروں کی نشاندہی کریں
connections:
- position: within
  kind: invention
  title:
    en: A world on a disc and in a book
    ar: عالم على قرص وفي كتاب
    ur: ایک قرص پر اور ایک کتاب میں دنیا
  text:
    en: 'In al-Idrisi''s account, he made in the middle of the twelfth century for Roger II, king of Sicily, a picture of the whole inhabited world in two parts: a big metal disc engraved with lands, rivers and routes, and a book of seventy maps. How is a disc different from a book of maps?'
    ar: 'في رواية الإدريسي نفسه أنه صنع في منتصف القرن الثاني عشر للملك روجر الثاني، ملك صقلية، صورة للعالم المأهول كله في جزأين: قرص معدني كبير نُقشت عليه البلدان والأنهار والطرق، وكتاب فيه سبعون خريطة. بماذا يختلف القرص عن كتاب الخرائط؟'
    ur: 'ادریسی کے اپنے بیان کے مطابق انہوں نے بارہویں صدی کے وسط میں سسلی کے بادشاہ راجر دوم کے لیے پوری آباد دنیا کی ایک تصویر دو حصوں میں بنائی: ایک بڑا دھاتی قرص جس پر ملک، دریا اور راستے کندہ تھے، اور ستر نقشوں کی ایک کتاب۔ قرص اور نقشوں کی کتاب میں کیا فرق ہے؟'
  entity: invention/tabula-rogeriana
  sources:
  - source/nuzhat-al-mushtaq-2002
- position: after
  kind: reflection
  title:
    en: The line that halves the earth
    ar: الخط الذي يقسم الأرض
    ur: وہ لکیر جو زمین کو دو حصوں میں بانٹتی ہے
  text:
    en: Following al-Farghani, the record describes the equator as the circle on the earth that divides it into northern and southern halves. Al-Farghani adds that there the time from sunrise to sunset equals the time from sunset to sunrise on every day of the year. Where would you find this line on a globe?
    ar: 'يصف السجل، اعتمادًا على الفرغاني، دائرة الاستواء بأنها الدائرة التي تقسم الأرض نصفين: شماليًّا وجنوبيًّا. ويضيف الفرغاني أن الزمن بين طلوع الشمس وغروبها عندها يساوي الزمن بين غروبها وطلوعها في كل يوم من أيام السنة. أين تجد هذا الخط على الكرة الأرضية؟'
    ur: ریکارڈ فرغانی کی بنیاد پر خطِ استوا کو وہ دائرہ بتاتا ہے جو زمین کو شمالی اور جنوبی دو نصفوں میں بانٹتا ہے۔ فرغانی یہ بھی بتاتے ہیں کہ وہاں سال کے ہر دن سورج نکلنے اور ڈوبنے کا درمیانی وقت ڈوبنے اور نکلنے کے درمیانی وقت کے برابر ہوتا ہے۔ آپ گلوب پر یہ لکیر کہاں پائیں گے؟
  entity: concept/dairat-al-istiwa
