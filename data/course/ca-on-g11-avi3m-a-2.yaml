  title:
    en: A museum built for the purpose
    ar: متحف أُنشئ لغرضه
    ur: خاص مقصد کے لیے بنا عجائب گھر
  text:
    en: The Museum of Islamic Art in Doha was built to the specifications of I. M. Pei on an island off an artificial peninsula, and opened on 22 November 2008. It reopened in October 2022 with eighteen renovated galleries showing more than 1,100 mostly newly acquired objects arranged by era and region. It has also lent objects to the Islamic Arts Biennale in Jeddah. How does such a setting guide what visitors notice?
    ar: بُني متحف الفن الإسلامي في الدوحة بحسب مواصفات المعماري آي إم باي على جزيرة في شبه جزيرة اصطناعية، وافتتحه أمير قطر في 22 نوفمبر 2008. وأُعيد افتتاحه في أكتوبر 2022 بثماني عشرة قاعة مجددة تعرض أكثر من 1,100 قطعة معظمها مقتنيات جديدة، مرتبة بحسب العصور والمناطق. وأعار المتحف قطعًا إلى بينالي الفنون الإسلامية في جدة. كيف يوجّه مكانٌ كهذا ما ينتبه إليه الزوار؟
    ur: دوحہ کا اسلامی فن کا عجائب گھر آئی ایم پی کی ہدایات کے مطابق ایک مصنوعی جزیرہ نما کے قریب جزیرے پر بنایا گیا، اور 22 نومبر 2008 کو کھولا گیا۔ اکتوبر 2022 میں یہ اٹھارہ تجدید شدہ گیلریوں کے ساتھ دوبارہ کھلا جن میں ایک ہزار ایک سو سے زیادہ، زیادہ تر نئی حاصل کی گئی، اشیا دور اور خطے کے لحاظ سے ترتیب سے رکھی ہیں۔ اس نے جدہ کے اسلامی فنون بینالے کو بھی اشیا مستعار دی ہیں۔ ایسا مقام زائرین کی توجہ کو کیسے رخ دیتا ہے؟
