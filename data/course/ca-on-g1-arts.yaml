summary:
  en: 'The Ontario Grade 1 Arts course has four strands: Dance, Drama, Music and Visual Arts. The museum maps parts of one of them: visual arts.'
  ar: 'مقرر الفنون للصف الأول في منهاج أونتاريو له أربعة محاور: الرقص والدراما والموسيقى والفنون البصرية. ويربط المتحف أجزاء من واحد منها: الفنون البصرية.'
  ur: 'اونٹاریو کے گریڈ اول فنون کے کورس کے چار حصے ہیں: رقص، ڈراما، موسیقی اور بصری فنون۔ عجائب گھر ان میں سے ایک، بصری فنون، کے کچھ حصوں کو جوڑتا ہے۔'
  es: "El curso de Artes de primer grado de Ontario tiene cuatro áreas temáticas: Danza, Teatro, Música y Artes Visuales. El museo muestra partes de una de ellas: las artes visuales."
  fr: "Le programme d'arts de première année de l'Ontario comprend quatre volets: danse, théâtre, musique et arts visuels. Le musée présente une partie de l'un d'eux: les arts visuels."
  tr: "Ontario'daki 1. sınıf sanat müfredatı dört ana bileşenden oluşmaktadır: dans, drama, müzik ve görsel sanatlar. Müze, bunlardan birinin, yani görsel sanatların unsurlarını bir araya getirmektedir."
  id: "Kurikulum seni kelas 1 di Ontario memiliki empat komponen utama: tari, drama, musik, dan seni visual. Museum ini menghubungkan elemen-elemen dari salah satu komponen tersebut: seni visual."
