connections:
- position: before
  kind: career
  title:
    en: The shaykh of medicine in Egypt
    ar: شيخ الطب بالديار المصرية
    ur: مصر میں طب کا شیخ
  text:
    en: Ibn al-Imad's Shadharat al-Dhahab calls Ibn al-Nafis the shaykh of medicine in Egypt, the one to whom knowledge of medicine ultimately led. He wrote a medical book, al-Shamil, whose index suggests it would run to three hundred volumes, and he endowed his properties and his books to the Mansuri hospital. What kind of work and training does a career in medicine involve?
    ar: تسمّي «شذرات الذهب» لابن العماد ابن النفيس شيخَ الطب بالديار المصرية، ومن انتهت إليه معرفة الطب. ألّف في الطب كتاب «الشامل» الذي تدل فهرسته على أنه يكون ثلثمائة مجلدة، ووقف أملاكه وكتبه على المارستان المنصوري. أي عمل وأي تدريب يتطلبهما العمل في الطب؟
    ur: ابن العماد کی «شذرات الذہب» ابن نفیس کو مصر میں طب کا شیخ کہتی ہے، وہ شخص جس پر طب کا علم آ کر ختم ہوا۔ اس نے طب کی کتاب «الشامل» لکھی جس کی فہرست سے لگتا ہے کہ وہ تین سو جلدوں کی ہوتی، اور اس نے اپنی جائیدادیں اور کتابیں منصوری ہسپتال پر وقف کر دیں۔ طب کے پیشے میں کس طرح کا کام اور کس طرح کی تربیت شامل ہے؟
  entity: person/ibn-al-nafis
  sources:
  - source/shadharat-dhahab
- position: after
  kind: scholar
  title:
    en: A scholar of optics
    ar: عالم في البصريات
    ur: بصریات کا ایک عالم
  text:
    en: Ibn al-Haytham was an Arab scholar of mathematics and physics, known for his book Kitab al-Manazir on optics. The editor of the book's edition describes him as having lived in the fifth century AH. Which scientists, from your own country or elsewhere, contributed to a field you are studying?
    ar: ابن الهيثم عالم عربي في الرياضيات والفيزياء، اشتهر بكتابه «المناظر» في البصريات. يصفه محقق طبعة الكتاب بأنه عاش في القرن الخامس الهجري. فأي علماء من بلدك أو من غيره أسهموا في ميدان تدرسه أنت؟
    ur: ابن الہیثم ریاضی اور طبیعیات کا عرب عالم تھا، جو بصریات پر اپنی کتاب «المناظر» سے مشہور ہے۔ کتاب کا مدیر اسے پانچویں صدی ہجری میں رکھتا ہے۔ آپ کے اپنے ملک یا کسی اور جگہ کے کن سائنس دانوں نے کسی ایسے شعبے میں حصہ ڈالا جو آپ پڑھ رہے ہیں؟
