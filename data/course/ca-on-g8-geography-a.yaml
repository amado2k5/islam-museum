expectations:
- code: A1
  text:
    en: 'analyse some significant interrelationships between Earth’s physical features and processes and human settlement patterns, and some ways in which the physical environment and issues of sustainability may affect settlement in the future (FOCUS ON: Interrelationships)'
    ar: 'حلّل بعض الترابطات المهمة بين المظاهر والعمليات الطبيعية للأرض وأنماط الاستيطان البشري، وبعض الطرق التي قد تؤثر بها البيئة الطبيعية وقضايا الاستدامة في الاستيطان مستقبلًا ⁦(التركيز على: الترابطات)⁩'
    ur: 'زمین کے طبعی مظاہر و عمل اور انسانی آبادکاری کے نمونوں کے درمیان کچھ اہم باہمی روابط کا تجزیہ کریں، اور یہ بھی کہ طبعی ماحول اور پائیداری کے مسائل مستقبل میں آبادکاری پر کیسے اثر ڈال سکتے ہیں ⁦(توجہ: باہمی روابط)⁩'
- code: A2
  text:
    en: 'use the geographic inquiry process to investigate issues related to the interrelationship between human settlement and sustainability from a geographic perspective (FOCUS ON: Geographic Perspective; Interrelationships)'
    ar: 'استخدم عملية الاستقصاء الجغرافي لدراسة قضايا العلاقة المتبادلة بين الاستيطان البشري والاستدامة من منظور جغرافي ⁦(التركيز على: المنظور الجغرافي؛ الترابطات)⁩'
    ur: 'جغرافیائی تحقیقی عمل کو استعمال کر کے انسانی آبادکاری اور پائیداری کے باہمی تعلق سے متعلق مسائل کی جغرافیائی نقطۂ نظر سے تحقیق کریں ⁦(توجہ: جغرافیائی نقطۂ نظر؛ باہمی روابط)⁩'
- code: A3
  text:
    en: 'demonstrate an understanding of significant patterns and trends related to human settlement and of ways in which human settlement affects the environment (FOCUS ON: Patterns and Trends; Spatial Significance)'
    ar: 'أظهر فهمًا للأنماط والاتجاهات المهمة المتصلة بالاستيطان البشري ولطرق تأثير الاستيطان البشري في البيئة ⁦(التركيز على: الأنماط والاتجاهات؛ الأهمية المكانية)⁩'
    ur: 'انسانی آبادکاری سے متعلق اہم نمونوں اور رجحانات کی اور اس کی کہ انسانی آبادکاری ماحول پر کیسے اثر ڈالتی ہے، سمجھ کا مظاہرہ کریں ⁦(توجہ: نمونے اور رجحانات؛ مکانی اہمیت)⁩'
