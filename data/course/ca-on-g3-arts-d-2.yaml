- position: within
  kind: object
  title:
    en: Letters on the walls of Cairo
    ar: حروف على جدران القاهرة
    ur: قاہرہ کی دیواروں پر حروف
  text:
    en: Bernard O'Kane notes that on Badr al-Jamali's gates his titles take up much more space than those of the caliph al-Mustansir, "a nod to the real holder of power". At the Aqmar Mosque the foundation inscription in the names of the caliph and his vizier appears twice on the facade, the upper floriated and the lower plain against a foliate scroll. What do the size and place of words tell someone walking past?
    ar: يلاحظ برنارد أوكين أن نقوش أبواب بدر الجمالي تعطي ألقابه مساحة أكبر بكثير من ألقاب الخليفة المستنصر، «إيماءً إلى صاحب السلطة الفعلية». وفي جامع الأقمر يتكرر نقش التأسيس باسم الخليفة ووزيره مرتين على الواجهة، أعلاه مورَّق وأسفله غير مورَّق على أرضية من الأوراق. ماذا يخبر حجم الكلمات ومكانها من يمرّ بها؟
    ur: برنارڈ او کین لکھتا ہے کہ بدر الجمالی کے دروازوں پر اس کے القاب خلیفہ المستنصر کے القاب سے کہیں زیادہ جگہ گھیرتے ہیں، «اصل صاحبِ اختیار کی طرف اشارہ»۔ جامع الاقمر میں خلیفہ اور اس کے وزیر کے نام پر بنیاد کی تحریر عمارت کے سامنے کے رخ پر دو بار آتی ہے، اوپر والی پتوں سے آراستہ (مورَّق) اور نیچے والی بیل بوٹوں کی زمین پر سادہ۔ لفظوں کا سائز اور مقام وہاں سے گزرنے والے کو کیا بتاتا ہے؟
