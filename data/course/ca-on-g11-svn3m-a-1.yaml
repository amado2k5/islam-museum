  title:
    en: A chemist of jute
    ar: عالم كيمياء الجوت
    ur: پٹ سن کا ماہرِ کیمیا
  text:
    en: 'According to English Wikipedia, Mubarak Ahmad Khan is a Bangladeshi scientist who took a PhD in polymer and radiation chemistry in 1991, worked at the Bangladesh Atomic Energy Commission from 1984 and rose to its director general, and is credited with the Sonali Bag, a jute-cellulose bag offered as an alternative to polythene bags. What education and training does such a career ask for?'
    ar: 'وفقًا لويكيبيديا الإنجليزية، مبارك أحمد خان عالم بنغلاديشي نال الدكتوراه في كيمياء البوليمرات والإشعاع سنة 1991، وعمل في هيئة الطاقة الذرية البنغلاديشية منذ 1984 حتى صار مديرها العام، وتُنسب إليه «سونالي باغ»، كيس من سليلوز الجوت عُرض بديلًا لأكياس البوليثين. أي تعليم وتدريب تتطلبهما مهنة كهذه؟'
    ur: 'انگریزی وکی پیڈیا کے مطابق مبارک احمد خان بنگلہ دیش کے سائنس دان ہیں جنہوں نے 1991 میں پولیمر اور تابکاری کیمیا میں پی ایچ ڈی کی، 1984 سے بنگلہ دیش اٹامک انرجی کمیشن میں کام کیا اور اس کے ڈائریکٹر جنرل بنے، اور سونالی بیگ، پٹ سن کی سیلولوز کا تھیلا جو پولی تھین کے تھیلوں کے متبادل کے طور پر پیش کیا گیا، انہی سے منسوب ہے۔ ایسے پیشے کے لیے کون سی تعلیم اور تربیت درکار ہے؟'
  entity: person/mubarak-ahmad-khan
  sources:
  - source/wikipedia-mubarak-ahmad-khan-en
- position: after
  kind: career
  title:
    en: An environmental lawyer
    ar: محامية بيئية
    ur: ماحولیاتی وکیل
  text:
    en: 'According to English Wikipedia, Rizwana Hasan is a Bangladeshi environmental lawyer who took her bachelor''s and master''s degrees in law at the University of Dhaka. As chief executive of the Bangladesh Environmental Lawyers Association she has led court campaigns since 2003 on the shipbreaking industry, polythene, deforestation and other issues. How does a lawyer''s training serve the environment, compared with a laboratory scientist''s?'
    ar: 'تذكر ويكيبيديا الإنجليزية أن سيدة رضوانة حسن محامية بيئية بنغلاديشية، نالت درجتي البكالوريوس والماجستير في القانون من جامعة دكا، وأنها بصفتها الرئيسة التنفيذية لرابطة المحامين البيئيين في بنغلاديش قادت منذ 2003 حملات قضائية على صناعة تفكيك السفن والبولي إيثيلين وإزالة الغابات وغيرها. كيف يخدم تكوين المحامي البيئة، مقارنة بتكوين عالم المختبر؟'
    ur: 'انگریزی وکی پیڈیا کے مطابق رضوانہ حسن بنگلہ دیش کی ماحولیاتی وکیل ہیں جنہوں نے ڈھاکہ یونیورسٹی سے قانون میں بیچلر اور ماسٹر کی ڈگریاں لیں۔ بنگلہ دیش انوائرنمنٹل لائرز ایسوسی ایشن کی چیف ایگزیکٹو کی حیثیت سے وہ 2003 سے جہاز شکنی کی صنعت، پولی تھین، جنگلات کی کٹائی اور دوسرے مسائل پر عدالتی مہمات چلاتی رہی ہیں۔ ایک وکیل کی تربیت ماحول کی خدمت کیسے کرتی ہے، تجربہ گاہ کے سائنس دان کی تربیت کے مقابلے میں؟'
  entity: person/rizwana-hasan
  sources:
  - source/wikipedia-rizwana-hasan-en
