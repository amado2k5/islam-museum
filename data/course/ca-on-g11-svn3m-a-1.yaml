  title:
    en: A garden author of Toledo and Seville
    ar: مؤلف فلاحة من طليطلة وإشبيلية
    ur: طلیطلہ اور اشبیلیہ کے زرعی مصنف
  text:
    en: Ibn Bassal was an agronomic author working in Toledo and Seville. His book relates land, water and season to plants, presenting practical observations in an older vocabulary of natures. The record says this is neither the invention of farming nor a current laboratory classification, and that the dates of his life are uncertain. What can we say, within those limits, about a scientist's contribution?
    ar: كان ابن بصال فلاحًا ومؤلفًا أندلسيًا عمل في طليطلة وإشبيلية. وفي كتابه العملي يربط خواص الأرض والماء والموسم بما يلائم النباتات، ويعرض ملاحظات عملية بلغة الطبائع القديمة. ويقول السجل إن ذلك لا يثبت أنه اخترع الزراعة ولا أن تصنيفه معيار مخبري معاصر، وإن تواريخ حياته غير يقينية. فماذا نقول، ضمن هذه الحدود، عن إسهام عالم؟
    ur: ابن بصال اندلس کے ایک زرعی مصنف تھے جنہوں نے طلیطلہ اور اشبیلیہ میں کام کیا۔ اپنی عملی کتاب میں وہ زمین، پانی اور موسم کی خصوصیات کو پودوں کی موزونیت سے جوڑتے ہیں اور عملی مشاہدات کو قدیم طبائع کی زبان میں پیش کرتے ہیں۔ اندراج کہتا ہے کہ اس سے نہ یہ ثابت ہوتا ہے کہ انہوں نے کاشت کاری ایجاد کی اور نہ یہ کہ ان کی درجہ بندی آج کا تجربہ گاہی معیار ہے، اور ان کی زندگی کی تاریخیں غیر یقینی ہیں۔ ان حدود کے اندر ہم ایک سائنس دان کے حصے کے بارے میں کیا کہہ سکتے ہیں؟
