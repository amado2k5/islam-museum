connections:
- position: before
  kind: reflection
  title:
    en: One author's reading of equality
    ar: قراءة مؤلف للمساواة
    ur: مساوات کے بارے میں ایک مصنف کی رائے
  text:
    en: 'Muhammad al-Khidr Husayn holds that people are created alike in nature and then differ in social life, and that Islam set obligations on a basis of parity: no privilege of noble over commoner or of king over subject, and piety alone alters neither limits nor rights. The record gives this as the author''s reading. What would a belief like this ask of a school, a workplace or a court?'
    ar: يرى محمد الخضر حسين أن الناس خُلقوا متماثلين في الفطرة ثم تفاوتوا في الحياة الاجتماعية، وأن الإسلام جعل التكاليف على قاعدة التكافؤ، فلا امتياز لشريف على وضيع ولا لملك على عامة، والتقوى وحدها لا تغير الحدود ولا الحقوق. ويعرض السجل هذا بوصفه قراءة المؤلف. فماذا يطلب اعتقاد كهذا من مدرسة أو مكان عمل أو محكمة؟
    ur: 'محمد الخضر حسین کی رائے ہے کہ انسان فطرت میں یکساں پیدا کیے گئے اور پھر سماجی زندگی میں ایک دوسرے سے مختلف ہوئے، اور اسلام نے ذمہ داریاں برابری کی بنیاد پر رکھیں: کسی شریف کو عام آدمی پر اور کسی بادشاہ کو رعایا پر کوئی امتیاز نہیں، اور تنہا تقویٰ نہ حدود بدلتا ہے نہ حقوق۔ ریکارڈ اسے مصنف کی رائے کے طور پر پیش کرتا ہے۔ ایسا عقیدہ کسی اسکول، کام کی جگہ یا عدالت سے کیا تقاضا کرے گا؟'
  entity: concept/equality-in-islam
  sources:
  - source/al-hurriyya-fi-al-islam-azhar
- position: within
  kind: reflection
  title:
    en: Giving as a duty
    ar: العطاء فريضة
    ur: دینا ایک فریضہ
  text:
    en: The jurists define zakat as the transfer of a fixed portion of a defined wealth to a defined recipient, and count it the third pillar after the two testimonies and the prayer. Abu al-Wafa al-Maraghi lists the thresholds, among them twenty mithqals of gold and two hundred dirhams of silver, on which a quarter-tenth is due. How does calling a gift a duty change what the rich and the poor expect of each other?
    ar: تعرّف الزكاة عند الفقهاء بأنها تمليك جزء مخصوص من مال مخصوص لشخص مخصوص، وهي الركن الثالث بعد الشهادتين والصلاة. ويعدّد أبو الوفاء المراغي النصب، منها نصاب الذهب عشرون مثقالًا والفضة مائتا درهم، والواجب فيهما ربع العشر. فكيف يغيّر وصفُ العطاء بأنه فريضة ما ينتظره الغني والفقير كلٌّ من الآخر؟
    ur: فقہا زکوٰۃ کی تعریف یوں کرتے ہیں کہ ایک مخصوص مال کا ایک مخصوص حصہ ایک مخصوص شخص کو مالک بنا دینا، اور اسے شہادتین اور نماز کے بعد تیسرا رکن مانتے ہیں۔ ابو الوفا المراغی نصاب گنواتے ہیں، جن میں بیس مثقال سونا اور دو سو درہم چاندی شامل ہیں، اور ان پر ربع العشر، یعنی عشر کا چوتھائی، واجب ہے۔ عطیے کو فرض کہنے سے مال دار اور محتاج کی ایک دوسرے سے توقعات کیسے بدلتی ہیں؟
  entity: concept/zakat
