  title:
    en: A ruling on cloning plant cells
    ar: حكم استنساخ الخلايا النباتية
    ur: پودوں کے خلیوں کی کلوننگ کا حکم
  text:
    en: A question asked about cloning plant cells and multiplying them to make juices and food additives. Jordan's General Iftaa Department answered that using cloning techniques in plants is unobjectionable, provided they are shown not to harm the consumer or disrupt the plant ecosystem; if the process leads to such harm, it is not permitted. It referred the judgment of benefit and harm to experts. Who should decide where the limits lie?
    ar: سؤال عن استنساخ الخلايا النباتية ومضاعفتها لصنع العصائر والمواد المضافة إلى الطعام. أجابت دائرة الإفتاء العام الأردنية بأنه لا حرج في الاستفادة من تقنيات الاستنساخ في النباتات بشرط ثبوت عدم إضرارها بالمستهلك وعدم إخلالها بالنظام النباتي، فإن أدت إلى ضرر بالإنسان أو اختلال في النظام النباتي فلا تجوز. ويرجع في ضبط المصالح والمفاسد إلى أهل الخبرة والاختصاص. من الذي ينبغي أن يحدد الحدود؟
    ur: جوس اور کھانے کے اجزا بنانے کے لیے پودوں کے خلیوں کی کلوننگ اور افزائش کے بارے میں سوال پوچھا گیا۔ اردن کے دارالافتاء نے جواب دیا کہ پودوں میں کلوننگ کی تکنیکوں سے فائدہ اٹھانے میں حرج نہیں، بشرطیکہ ثابت ہو کہ وہ صارف کو نقصان نہیں دیتیں اور نباتاتی نظام میں خلل نہیں ڈالتیں؛ ورنہ جائز نہیں۔ نفع و نقصان کی جانچ اہلِ خبرہ کے سپرد کی۔ حدیں کون طے کرے؟
