connections:
- position: before
  kind: reflection
  title:
    en: Modified foods and three conditions
    ar: الأغذية المحورة وثلاثة ضوابط
    ur: تبدیل شدہ غذائیں اور تین شرطیں
  text:
    en: 'A collective resolution of the International Islamic Fiqh Academy permits consuming genetically modified foods of animal origin on three conditions: the modification is done by safe methods that neither contravene the sharia nor harm health; it takes place between two animals that are lawful to eat; and the necessary information about the food and how it was produced is disclosed. Who benefits, and who is told?'
    ar: 'أباح قرار جماعي لمجمع الفقه الإسلامي الدولي استهلاك الأغذية المحورة وراثيًا من أصل حيواني بثلاثة ضوابط: أن يجري التحوير بطرق آمنة غير مخالفة للشرع ولا مضرة بالصحة، وأن يكون بين حيوانين يباح أكلهما، وأن يُفصح عن المعلومات اللازمة عن الغذاء المحور وطريقة إعداده. من المستفيد، ومن يُخبَر؟'
    ur: 'بین الاقوامی اسلامی فقہ اکیڈمی کی ایک اجتماعی قرارداد نے حیوانی اصل کی جینیاتی طور پر تبدیل شدہ غذاؤں کا استعمال تین شرطوں پر جائز کیا: تبدیلی محفوظ طریقوں سے ہو جو شریعت کے خلاف نہ ہوں اور صحت کو نقصان نہ دیں؛ وہ ایسے دو جانوروں کے درمیان ہو جن کا کھانا جائز ہے؛ اور غذا اور اس کی تیاری کی ضروری معلومات ظاہر کی جائیں۔ فائدہ کسے، اور اطلاع کسے؟'
