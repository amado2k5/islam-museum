summary:
  en: Two rulings on biotechnology in food, one on genetically modified foods of animal origin and one on cloning plant cells, and the social, ethical and legal question of where the limits lie (F1.1, F1.2).
  ar: حكمان في التقنية الحيوية في الغذاء، أحدهما في الأغذية المحورة وراثيًا من أصل حيواني والآخر في استنساخ الخلايا النباتية، وسؤال أين تقع الحدود الاجتماعية والأخلاقية والقانونية ⁦(F1.1، F1.2)⁩.
  ur: غذا میں حیاتی ٹیکنالوجی پر دو احکام، ایک حیوانی اصل کی جینیاتی طور پر تبدیل شدہ غذاؤں پر اور ایک پودوں کے خلیوں کی کلوننگ پر، اور یہ سماجی، اخلاقی اور قانونی سوال کہ حدیں کہاں ہیں ⁦(F1.1، F1.2)⁩۔
