expectations:
- code: D1.2
  text:
    en: assess various ways in which humans mitigate impacts of forces from natural phenomena on structures in urban, rural, and remote communities
    ar: قيِّم سبلاً متنوعة يخفف بها البشر آثار القوى الناتجة عن الظواهر الطبيعية في المنشآت في المجتمعات الحضرية والريفية والنائية
    ur: شہری، دیہی اور دور دراز برادریوں میں ڈھانچوں پر قدرتی مظاہر کی قوتوں کے اثرات کم کرنے کے وہ مختلف طریقے جانچیں جو انسان اپناتے ہیں
- code: D2.3
  text:
    en: describe forces resulting from natural phenomena that can have severe consequences for human-built structures, and identify structural features and materials that can allow such structures to withstand these forces
    ar: صِف القوى الناتجة عن الظواهر الطبيعية التي قد تكون لها عواقب وخيمة على المنشآت التي بناها الإنسان، وحدِّد الخصائص والمواد البنائية التي تتيح لهذه المنشآت أن تصمد أمامها
    ur: قدرتی مظاہر سے پیدا ہونے والی ان قوتوں کو بیان کریں جو انسان کے بنائے ڈھانچوں کے لیے شدید نتائج رکھ سکتی ہیں، اور ان ساختی خصوصیات اور مواد کی نشاندہی کریں جو ایسے ڈھانچوں کو ان کا مقابلہ کرنے دیتے ہیں
connections:
- position: within
  kind: place
  title:
    en: A dome raised after an earthquake
    ar: قبة رُفعت بعد زلزال
    ur: زلزلے کے بعد اونچا کیا گیا گنبد
  text:
    en: The emperor required that the new building be proof against both fire and earthquake, so the architects chose a dome-and-cupola design. Even so, the eastern part of the dome collapsed in an earthquake on 7 May 558. The dome had been designed too flat, so it was raised by more than 20 feet and the supports of the great pillars were strengthened. What does that repair tell you about the forces on a dome?
    ar: ولأن الإمبراطور أمر بأن يصمد المبنى الجديد للحريق والزلازل معاً، اختار المعماريان تصميماً بقبة وقبوات. غير أن الجزء الشرقي من القبة انهار في زلزال 7 مايو 558م. وكانت القبة مسطحة أكثر مما ينبغي، فرُفعت بأكثر من عشرين قدماً، وقُوّيت دعامات الأعمدة الكبيرة. ماذا يخبرك هذا الإصلاح عن القوى المؤثرة في القبة؟
    ur: چونکہ شہنشاہ نے حکم دیا تھا کہ نئی عمارت آگ اور زلزلے دونوں کے مقابلے میں ٹھہرے، اس لیے معماروں نے گنبد اور نصف گنبدوں والا نقشہ چنا۔ پھر بھی 7 مئی 558 عیسوی کے زلزلے میں گنبد کا مشرقی حصہ گر گیا۔ گنبد ضرورت سے زیادہ چپٹا بنا تھا، اس لیے اسے بیس فٹ سے زیادہ اونچا کیا گیا اور بڑے ستونوں کے سہارے مضبوط کیے گئے۔ یہ مرمت گنبد پر لگنے والی قوتوں کے بارے میں آپ کو کیا بتاتی ہے؟
  entity: building/hagia-sophia
  sources:
  - source/encyclopaedia-of-islam-2
- position: after
  kind: place
  title:
    en: Buttresses against later earthquakes
    ar: دعامات ضد الزلازل اللاحقة
    ur: بعد کے زلزلوں کے مقابلے میں پشتے
  text:
    en: Part of the dome collapsed again in an earthquake on 26 October 986, and the flying buttresses on the western facade probably date from that time. Mehmed II built great buttresses against the south wall, and Selim II and Murad III built others. The article says the mosque has not suffered from earthquakes since the tenth century and credits this largely to the buttresses. Which feature of a building would you check first?
    ar: انهار جزء من القبة مرة أخرى في زلزال وقع في 26 أكتوبر 986م، ويرجح أن الدعامات الطائرة في الواجهة الغربية تعود إلى ذلك الوقت. وأقام محمد الفاتح الدعامات الضخمة على الجدار الجنوبي، وأقام سليم الثاني ومراد الثالث غيرها. ويقول المقال إن المسجد لم يتعرض لزلازل منذ القرن العاشر، ويرجع ذلك في الغالب إلى الدعامات. أي خاصية في البناء تفحصها أولاً؟
    ur: 26 اکتوبر 986 عیسوی کے زلزلے میں گنبد کا ایک حصہ پھر گر گیا، اور مغربی دیوار کے اڑتے ہوئے پشتے غالباً اسی زمانے کے ہیں۔ محمد فاتح نے جنوبی دیوار کے ساتھ بڑے پشتے بنائے، اور سلیم ثانی اور مراد ثالث نے دوسرے بنائے۔ مضمون کہتا ہے کہ دسویں صدی کے بعد مسجد کو زلزلوں سے نقصان نہیں پہنچا اور اس کا سہرا زیادہ تر پشتوں کو دیتا ہے۔ عمارت کی کون سی خصوصیت آپ سب سے پہلے جانچیں گے؟
