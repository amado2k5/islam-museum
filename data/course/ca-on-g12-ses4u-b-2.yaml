  title:
    en: Where the observer stands
    ar: أين يقف الراصد
    ur: مشاہدہ کرنے والا کہاں کھڑا ہے
  text:
    en: Al-Farghani writes that if the conjunction falls away from the nodes, parallax makes the visible differ from the true, and an eclipse may appear partial from one place and total from another. How does the observer's place change what is recorded?
    ar: يذكر الفرغاني أنه إن كان الاجتماع في غير الرأس والذنب اختلف المرئي عن الحقيقي بسبب اختلاف المنظر، وقد يبدو الكسوف جزئياً من موضع وكلياً من موضع آخر. كيف يغيّر موضع الراصد ما يسجّله؟
    ur: الفرغانی لکھتا ہے کہ اگر اجتماع عقدوں سے ہٹ کر ہو تو اختلافِ منظر دکھائے گئے اور اصل میں فرق ڈال دیتا ہے، اور ایک جگہ سے گرہن جزوی اور دوسری جگہ سے مکمل نظر آ سکتا ہے۔ مشاہدہ کرنے والے کی جگہ اس کے درج کردہ کو کیسے بدلتی ہے؟
