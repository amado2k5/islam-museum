  title:
    en: A tailed star over Najd and Yemen
    ar: نجم ذو ذؤابة فوق نجد واليمن
    ur: نجد اور یمن پر دم دار ستارہ
  text:
    en: In 905 AH a tailed star rose from the east of Najd; its rising was in Aries, its tail over Yemen and its course through Syria. That is what Shadharat al-Dhahab reports of where it rose and where it went. How would you record the position of a feature of the sky today, with the terms you have learned?
    ar: في سنة 905هـ طلع من مشرق نجد نجم ذو ذؤابة، وكان طلوعه من برج الحمل وذؤابته في اليمن وسيره في الشام. هذا ما يذكره «شذرات الذهب» عن موضع طلوعه وجهة سيره. كيف تسجّل اليوم موضع معلم في السماء بالمصطلحات التي تعلمتها؟
    ur: سن 905ھ میں نجد کے مشرق سے ایک دم دار ستارہ طلوع ہوا؛ اس کا طلوع برج حمل سے تھا، اس کی دم یمن میں اور سفر شام کی طرف۔ «شذرات الذہب» اس کے طلوع کی جگہ اور سفر کی سمت یوں بتاتی ہے۔ آج آپ جو اصطلاحات سیکھ چکے ہیں ان سے آسمان کی کسی خصوصیت کی جگہ کیسے درج کریں گے؟
  entity: event/comet-905
