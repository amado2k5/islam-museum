- position: within
  kind: invention
  title:
    en: A drill for a stone in the urethra
    ar: مثقاب لحصاة في الإحليل
    ur: پیشاب کی نالی کی پتھری کا مثقب
  text:
    en: Al-Zahrawi describes a drill for a stone lodged in the urethra, the urine passage beyond the bladder. In the translated text it is a metal part with a sharp triangular end and a wooden handle, worked by hand, described in chapter 60 on extracting stones. The record documents a historical account, not clinical success by modern measures. What would a surgeon need from such a tool?
    ar: يصف الزهراوي مثقابًا لحصاة علقت في الإحليل، وهو مجرى البول بعد المثانة. والأداة في النص المترجم جزء معدني ذو نهاية حادة مثلثة ومقبض خشبي، يعمل بالحركة اليدوية، ويذكرها المؤلف في الفصل الستين الخاص باستخراج الحصاة. والسجل يثبت الوصف التاريخي، لا نجاحه السريري بمقاييس حديثة. ماذا يحتاج الجرّاح من أداة كهذه؟
    ur: الزہراوی پیشاب کی نالی میں پھنسی پتھری کے لیے ایک مثقب بیان کرتے ہیں، یعنی مثانے کے بعد پیشاب کے راستے میں۔ ترجمہ شدہ متن میں یہ دھات کا ایک حصہ ہے جس کا سرا تیز اور تکونا ہے اور دستہ لکڑی کا ہے، ہاتھ سے چلتا ہے، اور پتھری نکالنے کے ساٹھویں باب میں بیان ہوا ہے۔ ریکارڈ تاریخی بیان کو ثابت کرتا ہے، جدید پیمانوں سے طبی کامیابی کو نہیں۔ ایسے آلے سے جراح کو کیا چاہیے ہوگا؟
  entity: invention/zahrawi-mishab
  sources:
