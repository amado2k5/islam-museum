connections:
- position: before
  kind: invention
  title:
    en: Different tools for different surfaces
    ar: أدوات مختلفة لأسطح مختلفة
    ur: مختلف سطحوں کے لیے مختلف آلات
  text:
    en: Abu al-Qasim al-Zahrawi does not present one instrument suitable for every tooth surface. His scraper chapter distinguishes tools for inner, outer and interdental surfaces, linking differences of form to differences of position. The record treats this as described and illustrated specialization, not as proof that one person invented dentistry. Why would a tool's shape follow where it is used?
    ar: لا يعرض أبو القاسم الزهراوي أداة واحدة تصلح لكل سطح من الأسنان. يميز باب مجارد الأسنان بين أداة الداخل وأداة الخارج وأداة ما بين الأسنان، ويربط اختلاف الشكل باختلاف الموضع المقصود. ويعدّ السجل هذا تخصصًا موصوفًا ومصوّرًا، لا دليلًا على أن شخصًا واحدًا اخترع طب الأسنان. لماذا يتبع شكل الأداة موضع استعمالها؟
    ur: ابوالقاسم الزہراوی دانت کی ہر سطح کے لیے ایک ہی آلہ پیش نہیں کرتے۔ ان کا باب اندرونی، بیرونی اور دانتوں کے درمیان کی سطحوں کے لیے الگ آلات بتاتا ہے اور شکل کے فرق کو جگہ کے فرق سے جوڑتا ہے۔ ریکارڈ اسے بیان اور تصویر سے ثابت تخصص سمجھتا ہے، اس بات کا ثبوت نہیں کہ ایک شخص نے دندان سازی ایجاد کی۔ آلے کی شکل استعمال کی جگہ کے مطابق کیوں ہوتی ہے؟
  entity: invention/zahrawi-dental-scrapers
