- position: after
  kind: invention
  title:
    en: Thread from animal intestines
    ar: خيوط من أمعاء الحيوان
    ur: جانوروں کی آنتوں کے دھاگے
  text:
    en: 'Al-Zahrawi describes animal-intestinal filaments in a discussion of intestinal suturing in the surgical book of al-Tasrif. The material is thin filaments from animal intestines, used to join an internal wound. Leclerc''s French translation keeps a qualification: this approach remains experimental. The record does not claim he invented all suturing. What makes a thread suitable for repairing tissue?'
    ar: 'يصف الزهراوي خيوطًا من أمعاء الحيوان في حديثه عن خياطة الأمعاء بكتاب الجراحة من «التصريف». والمادة الموصوفة ألياف رفيعة مصدرها أمعاء الحيوانات، تُستعمل في الربط ضمن معالجة جرح داخلي. وتحفظ ترجمة لوكلير الفرنسية قيدًا مهمًا: هذا النهج ما زال في التجريب. ولا يزعم السجل أنه اخترع الخياطة كلها. ما الذي يجعل خيطًا صالحًا لإصلاح النسيج؟'
    ur: 'الزہراوی «التصریف» کی کتابِ جراحی میں آنتوں کی سلائی کے بیان میں جانوروں کی آنتوں کے ریشے ذکر کرتے ہیں۔ مادہ جانوروں کی آنتوں کے باریک ریشے ہیں جو اندرونی زخم جوڑنے کے لیے استعمال ہوتے ہیں۔ لوکلیر کا فرانسیسی ترجمہ ایک قید رکھتا ہے: یہ طریقہ ابھی تجربے میں ہے۔ ریکارڈ یہ دعویٰ نہیں کرتا کہ انہوں نے ہر سلائی ایجاد کی۔ کیا چیز دھاگے کو بافت کی مرمت کے لیے موزوں بناتی ہے؟'
  entity: invention/zahrawi-intestinal-suture
