expectations:
- code: E1
  text:
    en: demonstrate knowledge and understanding of archaeological history, practices, and issues, and the physical remains or artefacts related to classical sites
    ar: أظهر معرفة وفهمًا بتاريخ علم الآثار وممارساته وقضاياه، وبالبقايا المادية والقطع الأثرية المتصلة بالمواقع الكلاسيكية
    ur: آثارِ قدیمہ کی تاریخ، طریقوں اور مسائل، اور کلاسیکی مقامات سے متعلق مادی باقیات اور نوادر کا علم اور فہم ظاہر کریں
- code: E2
  text:
    en: make inferences about the social structures, customs, and technological achievements of classical societies based on information derived from their material culture
    ar: استنتج ما يخص البنى الاجتماعية والعادات والإنجازات التقنية في المجتمعات الكلاسيكية استنادًا إلى معلومات مستمدة من ثقافتها المادية
    ur: کلاسیکی معاشروں کے سماجی ڈھانچوں، رسوم اور تکنیکی کامیابیوں کے بارے میں ان کی مادی ثقافت سے حاصل معلومات کی بنیاد پر نتائج اخذ کریں
- code: E3
  text:
    en: identify archaeological, aesthetic, and architectural terms in English derived from ancient Greek and Latin and use them correctly
    ar: تعرّف على المصطلحات الأثرية والجمالية والمعمارية في الإنجليزية المشتقة من اليونانية القديمة واللاتينية، واستعملها استعمالًا صحيحًا
    ur: انگریزی کی وہ آثاریاتی، جمالیاتی اور تعمیراتی اصطلاحات پہچانیں جو قدیم یونانی اور لاطینی سے ماخوذ ہیں، اور انہیں درست طور پر استعمال کریں
- code: E4
  text:
    en: describe how their learning about classical material culture relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and personal experience
    ar: صف كيف يرتبط تعلّم الثقافة المادية الكلاسيكية بفهمك لثقافات أخرى ومجالات دراسة أخرى وللعالم المعاصر ولتجربتك الشخصية، وكيف يعززه
    ur: بیان کریں کہ کلاسیکی مادی ثقافت کے بارے میں سیکھنا دیگر ثقافتوں اور مضامین، عصرِ حاضر اور ذاتی تجربے کی سمجھ سے کیسے جڑتا اور اسے کیسے بڑھاتا ہے
