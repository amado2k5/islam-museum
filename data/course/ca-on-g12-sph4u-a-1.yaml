  text:
    en: Ibn al-Haytham is described as an Arab mathematician and physicist who wrote the Kitab al-Manazir, the Book of Optics. Its editor places him in the fifth century AH. Whose contributions to science does your own class know, and where would you find them?
    ar: يصف السجل ابن الهيثم بأنه عالم عربي في الرياضيات والفيزياء، صاحب «كتاب المناظر». ويضعه محقق الكتاب في القرن الخامس الهجري. فمن أصحاب الإسهامات في العلوم يعرف صفّك، وأين تجد أخبارهم؟
    ur: ریکارڈ ابن الہیثم کو ریاضی اور طبیعیات کا عرب عالم بتاتا ہے جس نے «کتاب المناظر» لکھی۔ کتاب کا مدیر اسے پانچویں صدی ہجری میں رکھتا ہے۔ آپ کی جماعت سائنس میں اور کن لوگوں کی خدمات جانتی ہے، اور ان کا ذکر کہاں ملے گا؟
  entity: person/ibn-al-haytham
