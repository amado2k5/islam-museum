  title:
    en: An extra string on the oud
    ar: وتر زائد في العود
    ur: عود پر ایک اضافی تار
  text:
    en: 'In al-Maqqari''s account, Ziryab adds a fifth string in al-Andalus to an oud that had four: a refinement of an inherited instrument, not the invention of the oud itself. The account calls the added string red and places it below the mathlath and above the mathna. Dwight Reynolds shows that al-Maqqari assembled older voices into an idealized portrait of one artist. What would you set beside this instrument to compare two musical cultures?'
    ar: في رواية المقري يضيف زرياب في الأندلس وترًا خامسًا إلى عود كان ذا أربعة أوتار؛ هذه إضافة إلى آلة موروثة، لا اختراع العود نفسه. يسمّي الخبر الوتر المضاف أحمر ويضعه تحت المثلث وفوق المثنى. ويبيّن نقد دوايت رينولدز كيف جمعت سيرة المقري أصواتًا أقدم في صورة مثالية لفنان واحد. ماذا تضع بجانب هذه الآلة لتقارن بين ثقافتين موسيقيتين؟
    ur: 'المقری کے بیان میں زریاب اندلس میں چار تاروں والے عود میں پانچویں تار کا اضافہ کرتا ہے: یہ ورثے میں ملے ساز میں اضافہ ہے، خود عود کی ایجاد نہیں۔ بیان اس اضافی تار کو سرخ کہتا ہے اور اسے مثلث کے نیچے اور مثنیٰ کے اوپر رکھتا ہے۔ ڈوائٹ رینولڈز دکھاتے ہیں کہ المقری نے پرانی آوازوں کو ایک فنکار کی مثالی تصویر میں جمع کر دیا۔ اس ساز کے ساتھ آپ کیا رکھیں گے تاکہ دو موسیقی ثقافتوں کا موازنہ کر سکیں؟'
  entity: invention/ziryab-fifth-string
