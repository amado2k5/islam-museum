  title:
    en: Six pistons on one shaft
    ar: ست مكابس على محور واحد
    ur: ایک محور پر چھ پسٹن
  text:
    en: In Al-Turuq al-saniyya, Taqi al-Din ibn Maruf described six tubes with pistons, weights and valves, moved by projections distributed around a shaft and joined to a shared outlet. A cam raises a piston through a rocker, and a weight then drives it down. The record says the common pipe collects the delivery and does not become an independent energy source. What has to turn the shaft?
    ar: في «الطرق السنية» وصف تقي الدين بن معروف ست قصبات بمكابس وأثقال وصمامات، تحركها نتوءات موزعة على محور، وتتجمع مخارجها في أنبوب واحد. ترفع الكامة المكبس عبر الذراع، ثم يدفعه ثقل إلى أسفل. ويقول السجل إن الأنبوب الجامع يستقبل نتائج الوحدات ولا يتحول إلى مصدر طاقة مستقل. ما الذي يلزم لإدارة المحور؟
    ur: «الطرق السنیہ» میں تقی الدین بن معروف نے چھ نلکیاں بیان کیں جن میں پسٹن، وزن اور والو ہیں؛ انہیں ایک محور کے گرد پھیلے ابھار چلاتے ہیں اور ان کے نکاس ایک مشترکہ نلکی میں ملتے ہیں۔ کیم ایک بازو کے ذریعے پسٹن کو اٹھاتی ہے، پھر ایک وزن اسے نیچے دھکیلتا ہے۔ ریکارڈ کہتا ہے کہ مشترکہ نلکی یونٹوں کا حاصل جمع کرتی ہے اور توانائی کا آزاد ذریعہ نہیں بنتی۔ محور کو کیا گھمائے گا؟
