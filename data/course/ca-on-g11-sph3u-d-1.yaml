  kind: invention
  title:
    en: The cow that does not turn the wheel
    ar: البقرة التي لا تدير الساقية
    ur: وہ گائے جو پہیہ نہیں گھماتی
  text:
    en: Al-Jazari describes a pool hiding a wheel and drive below, with jars lifting water to a channel above. A wooden cow seems to turn the machine, but the record says water drives it, and the shaft turns the cow, not the reverse. It adds that the arrangement needs a supply, a drainage path and a fall that lets the water do work; it is not a closed pool creating its own power. Where does the energy come from?
    ar: يصف الجزري حوضًا يخفي تحته دولابًا ومحركًا، وتعلوه جرار تصعد بالماء إلى قناة. تبدو بقرة خشبية كأنها تدير الآلة، لكن السجل يقول إن الماء هو الذي يديرها، وإن العمود يدور فتدور معه البقرة لا العكس. ويضيف أن الترتيب يحتاج موردًا ومسار صرف وانخفاضًا يسمح للماء بأن يؤدي شغلًا، وليس حوضًا مغلقًا يخلق قوة من ذاته. من أين تأتي الطاقة؟
    ur: جزری ایک حوض بیان کرتے ہیں جس کے نیچے ایک پہیہ اور چلانے والی قوت چھپی ہے، اور اوپر گھڑے پانی کو ایک نالی تک اٹھاتے ہیں۔ ایک لکڑی کی گائے مشین کو گھماتی دکھائی دیتی ہے، مگر ریکارڈ کہتا ہے کہ اسے پانی چلاتا ہے، اور محور گھومتا ہے تو گائے اس کے ساتھ گھومتی ہے، اس کے برعکس نہیں۔ وہ مزید کہتا ہے کہ اس ترتیب کو پانی کی رسد، نکاسی کا راستہ اور ایسا ڈھلوان چاہیے جو پانی سے کام لینے دے؛ یہ ایسا بند حوض نہیں جو اپنی ذات سے قوت پیدا کرے۔ توانائی کہاں سے آتی ہے؟
