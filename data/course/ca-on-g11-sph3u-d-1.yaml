  title:
    en: An animal turns the drive
    ar: حيوان يدير المحرك
    ur: جانور چلانے والی قوت دیتا ہے
  text:
    en: 'In Category V, chapter 4, al-Jazari describes a water lifter powered by an animal: gears carry rotation to a pin that moves in a slot in the ladle''s stem, raising and lowering the scoop. The record says the animal powers the driving assembly, and the geared mechanism turns that input into a repeated lifting movement. How does rotation become up-and-down motion here?'
    ar: في القسم الخامس، الباب الرابع، يصف الجزري رافعة ماء تعمل بالطاقة الحيوانية؛ تنقل التروس الدوران إلى دبوس يتحرك في شق ساق المغرفة فيرفعها ويخفضها. ويقول السجل إن الحيوان يمد مجموعة الحركة بالطاقة، وإن الآلة المسننة تنقل هذا الإدخال إلى حركة رفع متكررة. كيف يتحول الدوران هنا إلى حركة صعود ونزول؟
    ur: 'پانچویں حصے کے چوتھے باب میں جزری جانور کی قوت سے چلنے والی پانی اٹھانے کی مشین بیان کرتے ہیں: دندانے دار پہیے گردش کو ایک کیل تک پہنچاتے ہیں جو چمچے کی ڈنڈی کے شگاف میں چلتی ہے اور مغرفے کو اٹھاتی اور گراتی ہے۔ ریکارڈ کہتا ہے کہ جانور حرکتی مجموعے کو توانائی دیتا ہے اور دندانے دار نظام اس دخل کو بار بار اٹھانے کی حرکت میں بدل دیتا ہے۔ یہاں گردش اوپر نیچے کی حرکت کیسے بنتی ہے؟'
  entity: invention/jazari-animal-scoop-water-lifter
