summary:
  en: 'The Ontario Grade 12 Science course, code SNC4M, has six strands: Scientific Investigation Skills and Career Exploration, Medical Technologies, Pathogens and Disease, Nutritional Science, Science and Public Health Issues, and Biotechnology. The museum maps parts of all six strands.'
  ar: 'مقرر العلوم للصف الثاني عشر في أونتاريو، رمزه SNC4M، له ستة محاور: مهارات الاستقصاء العلمي واستكشاف المهن، والتقنيات الطبية، ومسبّبات الأمراض والمرض، وعلم التغذية، والعلم وقضايا الصحة العامة، والتقنية الحيوية. ويربط المتحف أجزاء من المحاور الستة كلها.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے سائنس کورس، کوڈ SNC4M، کی چھ شاخیں ہیں: سائنسی تحقیقی مہارتیں اور پیشوں کی تلاش، طبی ٹیکنالوجیاں، جراثیم اور بیماری، غذائی سائنس، سائنس اور صحتِ عامہ کے مسائل، اور حیاتی ٹیکنالوجی۔ میوزیم چھ کی چھ شاخوں کے کچھ حصے جوڑتا ہے۔'
