  kind: story
  title:
    en: 'Babies sent to the desert'
    ar: 'رضيع يُرسل إلى البادية'
    ur: 'شیرخوار بچے بادیہ بھیجے گئے'
  text:
    en: 'Al-Raheeq al-Makhtum says the Arabs of the towns used to seek wet-nurses for their babies among the desert people, to keep them from the diseases of the towns, strengthen their bodies and firm their nerves, and let them master Arabic in the cradle. In the case the book tells, the child stayed in the desert for two years until weaning. Who looks after babies in your family?'
    ar: 'يذكر الرحيق المختوم أن عرب الحواضر كانوا يلتمسون المراضع لأطفالهم الرضّع من أهل البادية، ليبعدوهم عن أمراض المدن، ويقوّوا أجسادهم ويشدّوا أعصابهم، ويتقنوا العربية في المهد. وفي الخبر الذي ينقله الكتاب بقي الطفل في البادية سنتين حتى فُطم. من يرعى الرضّع في أسرتك؟'
    ur: 'الرحیق المختوم بتاتی ہے کہ شہروں کے عرب اپنے شیر خوار بچوں کے لیے دودھ پلانے والیاں بادیہ کے لوگوں میں تلاش کرتے تھے، تاکہ انہیں شہروں کی بیماریوں سے دور رکھیں، ان کے جسم مضبوط اور اعصاب مستحکم کریں، اور وہ گہوارے ہی میں عربی پر عبور پا لیں۔ کتاب جو واقعہ بیان کرتی ہے اس میں بچہ دو سال تک دودھ چھڑانے تک بادیہ میں رہا۔ آپ کے گھرانے میں شیر خوار بچوں کی دیکھ بھال کون کرتا ہے؟'
  entity: concept/istirda-al-badiya
  sources:
  - source/mubarakpuri-raheeq
- position: after
  kind: place
  title:
    en: 'A school above a fountain'
    ar: 'كتّاب فوق سبيل ماء'
    ur: 'پانی کے سبیل کے اوپر ایک مکتب'
  text:
    en: 'Yeomans describes the sabil-kuttab as a two-storey structure: below, a public fountain dispensing water through iron window grilles; above, a Qur''an school for children, known by its open windows and balconies. The combination became a feature of fifteenth-century mosque architecture in Cairo and later appeared as a separate building. How is the place where you learn different from a kuttab?'
    ar: 'يصف ييومانز السبيل والكتّاب بأنه بناء من طابقين: في الأسفل سبيل عام يوزّع الماء عبر شبابيك حديدية، وفي الأعلى كتّاب لتعليم القرآن للأطفال يُعرف بنوافذه المفتوحة وشرفاته. وقد صار هذا الجمع سمة من عمارة مساجد القرن الخامس عشر في القاهرة، ثم ظهر لاحقًا بناءً مستقلًا. بم يختلف المكان الذي تتعلم فيه عن الكتّاب؟'
    ur: 'یومانز سبیل کتاب کو دو منزلہ عمارت بتاتے ہیں: نیچے ایک عوامی سبیل جو لوہے کی جالیوں والی کھڑکیوں سے پانی دیتا ہے، اور اوپر بچوں کے لیے قرآن کا مکتب، جسے کتّاب کہتے ہیں، جس کی پہچان کھلی کھڑکیاں اور بالکونیاں ہیں۔ یہ امتزاج قاہرہ میں پندرھویں صدی کی مساجد کی تعمیر کی ایک خصوصیت بنا اور بعد میں الگ عمارت کے طور پر بھی نظر آیا۔ آپ جہاں پڑھتے ہیں وہ جگہ کتّاب سے کیسے مختلف ہے؟'
