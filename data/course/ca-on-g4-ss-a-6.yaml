  text:
    en: 'describe some of the ways in which their daily life differs from the lives of young people from different backgrounds […] in a few early societies, including at least one First Nation and one Inuit society […]'
    ar: 'صِف بعض الأوجه التي تختلف فيها حياتك اليومية عن حياة الصغار من خلفيات مختلفة […] في عدد قليل من المجتمعات المبكرة، ومنها مجتمع واحد على الأقل من الأمم الأولى ومجتمع واحد من الإنويت […]'
