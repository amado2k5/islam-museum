  title:
    en: Two numbers that give each other
    ar: عددان يعيد كل منهما الآخر
    ur: دو اعداد جو ایک دوسرے کو لوٹاتے ہیں
  text:
    ar: قد يجمع عدد قواسمه فيعطي عدداً آخر، ثم تعيد قواسم الآخر العدد الأول. يسمى العددان المختلفان متحابين، مثل 220 و284. لم يخترع كمال الدين الفارسي هذا المثال أو قاعدة ثابت بن قرة الأقدم؛ مساهمته هنا منهج جديد بالعوامل والاختيارات لإثبات القاعدة. ما قواسم 220؟
    en: A number can yield another when its proper divisors are added, and the other's divisors can lead back to the first. Two different numbers with this property are amicable, like 220 and 284. The record says Kamal al-Din al-Farisi did not invent this example or Thabit ibn Qurra's older rule; his contribution here is a new factorization approach to proving the rule. What are the divisors of 220?
    ur: ایک عدد کے خاص مقسوم علیہ جمع ہوں تو دوسرا عدد آئے، اور دوسرے کے مقسوم علیہ پہلے کو واپس دیں۔ دو مختلف اعداد کا ایسا جوڑا متحاب کہلاتا ہے، مثلاً 220 اور 284۔ کمال الدین فارسی نے یہ مثال یا ثابت بن قرہ کا قدیم قاعدہ ایجاد نہیں کیا؛ یہاں ان کی خدمت عوامل کے ذریعے اس قاعدے کے اثبات کا نیا طریقہ ہے۔ 220 کے مقسوم علیہ کیا ہیں؟
