  title:
    en: The Dome of the Rock as al-Muqaddasi saw it
    ar: قبة الصخرة كما رآها المقدسي
    ur: قبۃ الصخرہ جیسا المقدسی نے دیکھا
  text:
    en: 'Around 375 AH, al-Muqaddasi saw the Dome of the Rock as an octagon with four gilded doors, its columns, he says, finer than marble, and its dome a hundred cubits high, sheathed in gilded brass. He describes the dome as built in three layers: painted boards, an iron lattice that, he says, was set there so the winds would not tilt it, and a timber plate. Which materials appear in the description, and why might wind matter to a dome like this?'
    ar: 'رأى المقدسي قبة الصخرة نحو سنة 375هـ مبنىً مثمّنًا بأربعة أبواب مذهّبة، ووصف أعمدته بأنها أجلّ من الرخام، وقبته بارتفاع مئة ذراع مكسوّة بنحاس مذهّب. ويذكر أن القبة بُنيت من ثلاث طبقات: ألواح مدهونة، وشبكة حديد جُعلت، كما يقول، لئلا تميلها الرياح، وصفيحة خشب. أي مواد جاءت في الوصف، ولماذا قد تهمّ الريح قبةً كهذه؟'
    ur: 'تقریباً 375 ہجری میں المقدسی نے قبۃ الصخرہ کو ایک ہشت پہلو عمارت کے طور پر دیکھا جس کے چار سنہرے دروازے تھے، ستون ان کے بقول سنگِ مرمر سے بڑھ کر، اور گنبد سو ہاتھ بلند، سنہری پیتل سے ڈھکا ہوا۔ وہ گنبد کو تین تہوں میں بنا بتاتے ہیں: رنگ کیے ہوئے تختے، لوہے کی جالی جو ان کے بقول اس لیے لگائی گئی کہ ہوائیں اسے جھکا نہ دیں، اور لکڑی کی تختی۔ بیان میں کون سے مواد آئے ہیں، اور ایسے گنبد کے لیے ہوا کیوں اہم ہو سکتی ہے؟'
