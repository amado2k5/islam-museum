  title:
    en: 'The Dome of the Rock as al-Muqaddasi saw it'
    ar: 'قبة الصخرة كما رآها المقدسي'
    ur: 'قبۃ الصخرہ جیسا المقدسی نے دیکھا'
  text:
    en: 'Al-Muqaddasi described the Dome of the Rock in a book he completed in 375 AH. He says it is an octagonal building with four gilded doors, each facing a flight of steps. Inside, three ambulatories circle on columns that he calls finer than marble. Above them is a dome sheathed in gilded brass. He says the dome shines when the sun rises on it. Which materials does he name? Which one would you choose for a roof, and why?'
    ar: 'وصف المقدسي قبة الصخرة في كتاب أتمّه سنة 375هـ. قال إنها بيت مثمّن بأربعة أبواب مذهّبة، يقابل كل باب منها مرقاة. وفي داخله ثلاثة أروقة دائرة على أعمدة قال إنها أجلّ من الرخام. وفوقها قبة ملبسة بالصفر المذهب. وقال إن الشمس إذا بزغت عليها أشرقت القبة. أي مواد ذكرها؟ وأيها تختار لسقف، ولماذا؟'
    ur: 'المقدسی نے قبۃ الصخرہ کا حال ایک ایسی کتاب میں لکھا جسے انہوں نے 375ھ میں مکمل کیا۔ وہ کہتے ہیں کہ یہ ہشت پہلو عمارت ہے جس کے چار سنہرے دروازے ہیں، ہر دروازے کے سامنے سیڑھیاں ہیں۔ اندر تین راہداریاں ستونوں پر گھومتی ہیں، جنہیں وہ سنگِ مرمر سے بڑھ کر کہتے ہیں۔ ان کے اوپر سنہری پیتل سے ڈھکا گنبد ہے۔ وہ کہتے ہیں کہ سورج چڑھتا ہے تو گنبد چمک اٹھتا ہے۔ انہوں نے کون سے مواد گنوائے؟ چھت کے لیے آپ کون سا چنتے، اور کیوں؟'
