- position: before
  kind: invention
  title:
    en: 'Tiraz: the band of writing on the garment'
    ar: 'الطراز: شريط الكتابة في الثوب'
    ur: 'طراز: لباس پر تحریر کی پٹی'
  text:
    en: Tiraz is a band of writing woven or embroidered into fine garments, carrying the ruler's name and words of good omen. Ibn Khaldun says the Persian kings put the images of kings in their tiraz, and the kings of Islam put written names in their place. The TDV encyclopedia records that Abd al-Malik ibn Marwan ordered the Greek tiraz on Egypt's cloth dropped and the declaration of God's oneness woven. What changed, and what stayed?
    ar: الطراز شريط من الكتابة يُنسج أو يُطرَّز في الثياب الفاخرة، يحمل اسم الحاكم وكلمات تجري مجرى الفأل. يذكر ابن خلدون أن ملوك العجم كانوا يجعلون طرازهم بصور الملوك، ثم اعتاض ملوك الإسلام عن ذلك بكتب أسمائهم. وتذكر موسوعة TDV أن عبد الملك بن مروان أمر بترك الطراز اليوناني على قماش مصر وبنسج كلمة التوحيد. ما الذي تغيّر وما الذي بقي؟
    ur: طراز عمدہ لباس میں بُنی یا کڑھی ہوئی تحریر کی پٹی ہے جس پر حکمران کا نام اور نیک فال کے کلمات ہوتے ہیں۔ ابن خلدون کہتے ہیں کہ ایرانی بادشاہ اپنے طراز میں بادشاہوں کی تصویریں رکھتے تھے، پھر اسلام کے بادشاہوں نے ان کی جگہ اپنے نام لکھوائے۔ موسوعہ TDV کے مطابق عبدالملک بن مروان نے حکم دیا کہ مصر کے کپڑے پر یونانی طراز ترک کیا جائے اور کلمۂ توحید بُنا جائے۔ کیا بدلا اور کیا باقی رہا؟
  entity: invention/tiraz
  sources:
  - source/muqaddima-ibn-khaldun
  - source/tdv-tiraz
- position: after
  kind: object
  title:
    en: A tiraz silk fragment over a thousand years old
    ar: قطعة طراز حريرية عمرها أكثر من ألف عام
    ur: ہزار سال سے زیادہ پرانا طراز ریشم کا ٹکڑا
  text:
    en: A fragment of yellow tiraz silk bearing an Arabic maker's inscription, dated 132 AH (749–750 CE); originally found in a cemetery at Akhmim, Egypt, it is one of four fragments that once formed a single textile, held by the Victoria and Albert Museum, London. What does a fragment tell us about a garment of which little else survives?
    ar: قطعة من نسيج طراز حريري أصفر كُتب عليه نص تصنيع بالعربية، مؤرخة سنة ١٣٢هـ ⁦(٧٤٩–٧٥٠م)⁩؛ عُثر عليها أصلًا في مقبرة بالأخميم بمصر، وهي إحدى أربع قطع كانت يومًا نسيجًا واحدًا، ومحفوظة في متحف فيكتوريا وألبرت بلندن. ماذا تخبرنا قطعة عن ثوب لم يبقَ منه غيرها؟
    ur: زرد طراز ریشم کا ایک ٹکڑا جس پر عربی میں بنانے والے کی تحریر ہے، ۱۳۲ھ ⁦(۷۴۹–۷۵۰ء)⁩ کا؛ یہ اصل میں مصر کے اخمیم کے ایک قبرستان سے ملا، اور ان چار ٹکڑوں میں سے ایک ہے جو کبھی ایک ہی کپڑا تھے؛ یہ وکٹوریہ اینڈ البرٹ میوزیم، لندن میں محفوظ ہے۔ ایک ٹکڑا ہمیں اس لباس کے بارے میں کیا بتاتا ہے جس کا اور کچھ نہیں بچا؟
