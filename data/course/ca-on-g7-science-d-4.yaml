  text:
    en: In 425 AH a black wind blew over Nisibin, knocking down a palace built of baked brick, stone and lime. Ramla was shaken and about half of it was destroyed; part of the wall of Jerusalem fell, and the minaret of the mosque of Ascalon collapsed. What forces acted on these buildings?
    ar: في سنة خمس وعشرين وأربعمائة هبّت ريح سوداء بنصيبين فرمت قصراً مبنياً بآجر وحجارة وكلس. وزُلزلت الرملة فهُدم نحو نصفها وسقط بعض حائط بيت المقدس وسقطت منارة جامع عسقلان. فأي قوى أثّرت في هذه الأبنية؟
    ur: 425ھ میں نصیبین میں ایک سیاہ آندھی چلی جس نے اینٹ، پتھر اور چونے سے بنے ایک محل کو گرا دیا۔ رملہ میں زلزلہ آیا تو اس کا تقریباً نصف حصہ منہدم ہو گیا، بیت المقدس کی دیوار کا کچھ حصہ گرا، اور عسقلان کی جامع مسجد کا مینار گر گیا۔ ان عمارتوں پر کون سی قوتیں عمل کر رہی تھیں؟
