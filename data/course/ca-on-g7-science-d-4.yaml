  text:
    en: In Jumada I 332 the rains multiplied until houses collapsed. Bathhouses closed, and markets and mosques went idle. Why might rain bring a house down?
    ar: في جمادى الأولى 332هـ كثرت الأمطار فتساقطت منازل الناس، وأُغلقت عدة حمامات وتعطلت أسواق ومساجد. فلماذا قد يُسقط المطر بيتاً؟
    ur: جمادی الاولیٰ 332ھ میں بارشیں بڑھیں اور گھر زمین بوس ہوئے؛ کئی حمام بند ہوئے اور بازار اور مسجدیں بے کار پڑے رہے۔ بارش کسی گھر کو کیوں گرا سکتی ہے؟
