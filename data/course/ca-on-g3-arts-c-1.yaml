  title:
    en: A festival that gathers sacred music
    ar: مهرجان يجمع التراتيل
    ur: ایک میلہ جو مقدس موسیقی کو اکٹھا کرتا ہے
  text:
    en: The Fez Festival of World Sacred Music is an annual festival in Fez, begun in 1994, that brings together Sufi chants, qawwali and hymns with the music of other faiths on the stages of the old city. What does music gather people for in your own community?
    ar: مهرجان فاس للموسيقى الروحية العالمية مهرجان سنوي في فاس بدأ سنة ⁦1994م⁩، يجمع التراتيل الصوفية والقوالي والأناشيد مع موسيقى الأديان الأخرى على مسارح المدينة القديمة. ما الذي يجمعه الناس حول الموسيقى في مجتمعك؟
    ur: فاس کا عالمی مقدس موسیقی میلہ فاس میں ہر سال منعقد ہونے والا میلہ ہے، جو ⁦1994ء⁩ میں شروع ہوا، اور پرانے شہر کے اسٹیجوں پر صوفی ترانوں، قوالی اور اناشید کو دوسرے مذاہب کی موسیقی کے ساتھ اکٹھا کرتا ہے۔ آپ کے اپنے معاشرے میں موسیقی لوگوں کو کس لیے اکٹھا کرتی ہے؟
