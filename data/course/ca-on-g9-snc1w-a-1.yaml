connections:
- position: before
  kind: invention
  title:
    en: A mountain and the size of the Earth
    ar: جبل وحجم الأرض
    ur: ایک پہاڑ اور زمین کا حجم
  text:
    en: Al-Biruni described a method combining a mountain's known height, the dip of the horizon below the horizontal and tangent geometry, then reported applying it near Nandana fort. The date, 416 AH/1025 CE, belongs to his book, the Tahdid, not to a day of observation, and the same text preserves an earlier account of Sanad ibn Ali. What does it mean for a contribution to have predecessors?
    ar: وصف البيروني طريقة تجمع ارتفاعًا معلومًا للجبل وانخفاض الأفق عن المستوى الأفقي وهندسة المماس، ثم روى تطبيقها قرب حصن نندنة. والتاريخ 416هـ/1025م للكتاب، «تحديد نهايات الأماكن لتصحيح مسافات المساكن»، لا ليوم تجربة بعينه، ويحفظ النص نفسه رواية أقدم عن سنَد بن علي. ماذا يعني أن يكون لإسهام علمي سابقون؟
    ur: البیرونی نے ایک ایسا طریقہ بیان کیا جو پہاڑ کی معلوم بلندی، افق کے افقی سطح سے نیچے جھکاؤ اور مماس کی ہندسہ کو جمع کرتا ہے، پھر اس کے ندنہ قلعے کے قریب اطلاق کی روایت کی۔ سن 416ھ/1025ء اس کی کتاب «تحدید نہایات الاماکن» کا ہے، کسی دن کے مشاہدے کا نہیں، اور وہی متن سند بن علی کا ایک قدیم بیان بھی محفوظ رکھتا ہے۔ کسی علمی خدمت کے پیش رو ہونے کا کیا مطلب ہے؟
  entity: invention/al-biruni-earth-radius
