- position: after
  kind: invention
  title:
    en: 'One precise problem: the Moon''s distance'
    ar: 'مسألة محددة: بعد القمر'
    ur: 'ایک خاص مسئلہ: چاند کا فاصلہ'
  text:
    en: An astronomical model can describe the Moon's direction yet exaggerate how its distance from Earth changes; Victor Roberts highlights this problem in Ptolemy's lunar theory. Ibn al-Shatir's double-epicycle arrangement reduced that defect, with Earth still central. The record stresses that the achievement is one mathematical relationship, not heliocentrism. Is a contribution to science always a whole new theory?
    ar: قد ينجح نموذج فلكي في وصف اتجاه القمر ثم يبالغ في تغير بعده عن الأرض؛ وهذه هي المشكلة التي يبرزها فيكتور روبرتس في النظرية القمرية البطلمية. وقد خفف تركيب ابن الشاطر بفلكي تدوير هذا الخلل مع بقاء الأرض في مركز الوصف. والإنجاز علاقة حسابية محددة، لا القول بمركزية الشمس. هل يكون الإسهام العلمي دائمًا نظرية جديدة كاملة؟
    ur: ایک فلکیاتی نمونہ چاند کی سمت تو درست بیان کر سکتا ہے مگر زمین سے اس کے فاصلے کی تبدیلی میں مبالغہ کر سکتا ہے؛ وکٹر رابرٹس بطلیموسی قمری نظریے میں اسی مسئلے کی نشاندہی کرتے ہیں۔ ابن الشاطر کی دو تدویری دائروں کی ترتیب نے اس خلل کو کم کیا، اور زمین وضاحت کے مرکز میں رہی۔ یہ کارنامہ ایک خاص ریاضیاتی تعلق ہے، سورج کے مرکز ہونے کا دعویٰ نہیں۔ کیا سائنسی خدمت ہمیشہ ایک مکمل نیا نظریہ ہوتی ہے؟
  entity: invention/ibn-al-shatir-lunar-model
