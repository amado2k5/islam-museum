connections:
- position: within
  kind: reflection
  title:
    en: Putting something aside
    ar: ادخار الشيء لوقت الحاجة
    ur: ضرورت کے وقت کے لیے رکھ چھوڑنا
  text:
    en: The record explains that saving, idkhar, is putting a thing aside for the time of need, and that the jurists keep to this sense. What would you put money aside for?
    ar: 'يوضح السجل أن الادخار خبء الشيء لوقت الحاجة، وأن الفقهاء لا يخرجون عن هذا المعنى. لأي غاية تدّخر أنت مالاً؟'
    ur: ریکارڈ بتاتا ہے کہ ادخار ضرورت کے وقت کے لیے کوئی چیز محفوظ رکھنا ہے، اور فقہاء اسی معنی پر قائم رہتے ہیں۔ آپ کس مقصد کے لیے رقم بچا کر رکھیں گے؟
  entity: concept/idkhar-fiqh
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: after
  kind: reflection
  title:
    en: Giving for God's sake
    ar: العطاء ابتغاء وجه الله
    ur: اللہ کی رضا کے لیے دینا
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence, as the record gives it, defines sadaqa as what is given seeking nearness to God rather than human favour, covering both zakat and voluntary alms. It adds that sadaqa aids the weak, relieves the distressed, gives thanks for God's blessings, and shows the giver's faith. What could a gift of your own help someone with?
    ar: تذكر الموسوعة الفقهية الكويتية، كما يعرضها السجل، أن الصدقة ما يُعطى على وجه التقرب إلى الله لا على وجه المكرمة، وتشمل الزكاة وصدقة التطوع. وتضيف أن الصدقة إعانة الضعيف وإغاثة اللهيف وشكر لله على نعمه ودليل على صحة إيمان مؤديها. فيمَ يمكن أن تعين هديةٌ منك إنساناً؟
    ur: کویتی فقہی انسائیکلوپیڈیا، جیسا کہ ریکارڈ اسے پیش کرتا ہے، بتاتا ہے کہ صدقہ وہ ہے جو اللہ کی رضا کے لیے دیا جائے نہ کہ انسانی احسان کے بدلے، اور اس میں زکوٰۃ اور تطوع کا صدقہ دونوں شامل ہیں۔ وہ مزید کہتا ہے کہ صدقہ کمزور کی مدد، ستم زدہ کی اغاثت، اللہ کی نعمتوں کا شکر اور دینے والے کے ایمان کی صداقت کا ثبوت ہے۔ آپ کا اپنا کوئی عطیہ کسی کی کس چیز میں مدد کر سکتا ہے؟
  entity: practice/sadaqa
