  text:
    en: 'In his commentary on al-Tusi''s Tadhkira, al-Sharif al-Jurjani examined the two usual refutations of the earth''s rotation: that a stone thrown upward would fall west of its starting point, and that birds and arrows would be affected. He judged both unsatisfactory, since the air might move with the earth and carry with it what it contains. He then reaffirmed the earth''s rest on other grounds. What does a thrown stone share with the ground it left?'
    ar: 'في شرحه على تذكرة الطوسي ناقش الشريف الجرجاني الحجتين المشهورتين في رد دوران الأرض: أن الحجر المرمي إلى أعلى يقع غربي موضعه، وأن الطائر والسهم يتأثران بحركة الأرض. ورأى أنهما غير كافيتين، لأن الهواء قد يتحرك مع الأرض بالموافقة فيحمل معه ما فيه. ثم عاد فأكد سكون الأرض بحجة أخرى. ما الذي يشترك فيه الحجر المرمي مع الأرض التي تركها؟'
    ur: 'طوسی کی «التذکرہ» کی شرح میں شریف جرجانی نے زمین کی گردش کے رد میں دی جانے والی دو عام دلیلوں کو پرکھا: یہ کہ اوپر پھینکا گیا پتھر اپنے مقامِ آغاز کے مغرب میں گرے گا، اور یہ کہ پرندے اور تیر متاثر ہوں گے۔ انہوں نے دونوں کو ناکافی ٹھہرایا، کیونکہ ہو سکتا ہے ہوا زمین کے ساتھ موافق حرکت کرے اور اپنے اندر کی چیزوں کو ساتھ لے جائے۔ پھر انہوں نے زمین کے سکون کی تصدیق دوسری بنیاد پر کی۔ پھینکا ہوا پتھر اس زمین سے کیا مشترک رکھتا ہے جسے وہ چھوڑتا ہے؟'
