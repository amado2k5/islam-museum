  title:
    en: The oldest way of making a living
    ar: أقدم وجوه المعاش
    ur: معاش کی قدیم ترین صورت
  text:
    en: Al-Maraghi presents agriculture as the oldest livelihood, which Ibn Khaldun, he reports, sees as the simplest of crafts and the closest to nature. He holds that Islam encourages it because it is the source of food for people and animals. It is, then, a way of living from plants. Which foods in your own home were once plants that someone grew?
    ar: يعرض المراغي الزراعة بوصفها أسبق وجوه المعاش، وهي عند ابن خلدون، فيما ينقل، أبسط الصنائع وأقربها إلى الطبيعة. ويرى أن الإسلام حثّ عليها لأنها مصدر أقوات الناس والأنعام. فهي إذن طريقة للعيش من النبات. أي أطعمة في بيتك كانت نباتًا زرعه أحدهم؟
    ur: المراغی زراعت کو معاش کی قدیم ترین صورت کے طور پر پیش کرتے ہیں، جسے ابن خلدون کے حوالے سے وہ سب سے سادہ اور فطرت کے سب سے قریب پیشہ بتاتے ہیں۔ ان کے خیال میں اسلام نے اس کی ترغیب دی کیونکہ یہ انسانوں اور جانوروں کی خوراک کا ذریعہ ہے۔ یوں یہ پودوں سے جینے کا ایک طریقہ ہے۔ آپ کے گھر کی کون سی غذائیں کبھی پودے تھیں جنہیں کسی نے اگایا؟
