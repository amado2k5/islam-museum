summary:
  en: 'The Ontario Grade 12 course Visual Arts, AVI4E, has three strands: creating and presenting, reflecting, responding and analysing, and foundations. The museum maps five lessons, through calligraphy, tilework, book illumination, the arabesque and three historical works read for their use and society.'
  ar: 'لمقرر الفنون البصرية AVI4E للصف الثاني عشر في أونتاريو ثلاثة محاور: الإبداع والعرض، والتأمل والاستجابة والتحليل، والأسس. ويربط المتحف خمسة دروس، عبر الخط العربي والبلاط والتذهيب والأرابيسك وثلاثة أعمال تاريخية تُقرأ من حيث استعمالها ومجتمعها.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے کورس «بصری فنون» AVI4E کے تین محور ہیں: تخلیق و پیشکش، غور و فکر، ردِعمل اور تجزیہ، اور بنیادیں۔ میوزیم پانچ سبق جوڑتا ہے، خطاطی، ٹائل کے کام، کتاب کی تذہیب، عربیسک اور استعمال و معاشرے کے لحاظ سے پڑھے گئے تین تاریخی کاموں کے ذریعے۔'
  es: "El curso de Artes Visuales de 12.º grado de Ontario, AVI4E, consta de tres ejes temáticos: creación y presentación, reflexión, respuesta y análisis, y fundamentos. El museo presenta cinco lecciones a través de la caligrafía, el trabajo con azulejos, la iluminación de libros, el arabesco y tres obras históricas analizadas por su uso y su contexto social."
  fr: "Le cours d’arts visuels de 12e année en Ontario (AVI4E) comporte trois volets: création et présentation, réflexion, interprétation et analyse, et fondements. Le musée propose cinq leçons à travers la calligraphie, la mosaïque, l’enluminure, l’arabesque et l’étude de trois œuvres historiques, analysées pour leur usage et leur rôle dans la société."
  tr: "Ontario'da 12. sınıf için Görsel Sanatlar AVI4E müfredatı üç ana temaya sahiptir: Yaratım ve Sunum, Yansıtma, Tepki ve Analiz ve Temeller. Müze, Arap kaligrafisi, çini işleme, yaldızlama, arabesk ve kullanımları ve toplulukları açısından yorumlanan üç tarihi eser aracılığıyla beş dersi birbirine bağlar."
  id: "Kurikulum Seni Visual AVI4E untuk kelas 12 di Ontario memiliki tiga tema utama: Kreasi dan Presentasi, Refleksi, Respons dan Analisis, serta Dasar-Dasar. Museum ini menghubungkan lima pelajaran tersebut, melalui kaligrafi Arab, pemasangan ubin, penyepuhan, arabesque, dan tiga karya sejarah yang diinterpretasikan berdasarkan penggunaan dan komunitasnya."
