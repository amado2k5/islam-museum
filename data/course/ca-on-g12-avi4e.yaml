summary:
  en: 'The Ontario Grade 12 course Visual Arts, AVI4E, has three strands: creating and presenting, reflecting, responding and analysing, and foundations. The museum maps five lessons, through calligraphy, tilework, book illumination, the arabesque and three historical works read for their use and society.'
  ar: 'لمقرر الفنون البصرية AVI4E للصف الثاني عشر في أونتاريو ثلاثة محاور: الإبداع والعرض، والتأمل والاستجابة والتحليل، والأسس. ويربط المتحف خمسة دروس، عبر الخط العربي والبلاط والتذهيب والأرابيسك وثلاثة أعمال تاريخية تُقرأ من حيث استعمالها ومجتمعها.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے کورس «بصری فنون» AVI4E کے تین محور ہیں: تخلیق و پیشکش، غور و فکر، ردِعمل اور تجزیہ، اور بنیادیں۔ میوزیم پانچ سبق جوڑتا ہے، خطاطی، ٹائل کے کام، کتاب کی تذہیب، عربیسک اور استعمال و معاشرے کے لحاظ سے پڑھے گئے تین تاریخی کاموں کے ذریعے۔'
