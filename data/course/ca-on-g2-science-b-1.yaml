  title:
    en: Al-Jahiz sorts the animals
    ar: الجاحظ يصنف الحيوان
    ur: الجاحظ جانوروں کی درجہ بندی کرتے ہیں
  text:
    en: 'Before the kinds of animals, al-Jahiz sets out a division: animals walk, fly, swim or creep. He notes that not everything that flies on two wings is a bird, since locusts, bees and flies fly but are not called birds, and that predators armed with talons, such as the eagle, differ from those armed with beaks, such as vultures and crows. How would you sort the animals you know by how they move?'
    ar: 'قبل أنواع الحيوان يضع الجاحظ تقسيمًا: الحيوان يمشي أو يطير أو يسبح أو يزحف. ويلاحظ أن كل ما طار بجناحين ليس طائرًا، فالجراد والنحل والذباب تطير ولا تسمى طيرًا، وأن الجوارح ذوات المخالب كالعقاب تختلف عن ذوات المناقير كالنسور والغربان. كيف تصنّف الحيوانات التي تعرفها بحسب طريقة حركتها؟'
    ur: 'جانوروں کی قسموں سے پہلے الجاحظ ایک تقسیم رکھتے ہیں: جانور چلتے ہیں، اڑتے ہیں، تیرتے ہیں یا رینگتے ہیں۔ وہ بتاتے ہیں کہ دو پروں سے اڑنے والی ہر چیز پرندہ نہیں ہوتی، کیونکہ ٹڈی، شہد کی مکھی اور مکھی اڑتی ہیں مگر پرندہ نہیں کہلاتیں، اور پنجوں سے لیس شکاری، جیسے عقاب، چونچ سے لیس شکاریوں، جیسے گدھ اور کوّے، سے مختلف ہیں۔ آپ جن جانوروں کو جانتے ہیں انہیں ان کی حرکت کے طریقے سے کیسے ترتیب دیں گے؟'
