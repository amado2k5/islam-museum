  title:
    en: Holding back goods until prices rise
    ar: حبس السلع حتى ترتفع الأسعار
    ur: قیمتیں بڑھنے تک مال روکنا
  text:
    en: A food trader asked Jordan's General Iftaa Department about merchants who withhold goods expecting prices to rise. The Department answered that hoarding is forbidden because it harms people, defining it as holding what was bought at a time of high prices to sell it dearer when need is acute, and that it is more gravely forbidden for staple foods. The museum records this as a document and issues no ruling. How does withholding food change who can reach it?
    ar: سأل تاجر مواد غذائية دائرة الإفتاء العام الأردنية عن تجار يحبسون السلع لعلمهم بارتفاع أسعارها قريبًا. فأجابت بأن الاحتكار حرام لما فيه من الإضرار بالناس، وعرفته بإمساك ما اشتُري وقت الغلاء لبيعه بأكثر عند اشتداد الحاجة، وبأنه في الأقوات أشد حرمة. ويسجّل المتحف هذا النص وثيقةً ولا يُصدر فتوى. فكيف يغيّر حبس الغذاء من يصل إليه؟
    ur: ایک غذائی تاجر نے اردن کے دارالافتاء العام سے ان تاجروں کے بارے میں پوچھا جو مال اس لیے روکتے ہیں کہ انہیں معلوم ہے قیمتیں جلد بڑھیں گی۔ دارالافتاء نے جواب دیا کہ احتکار حرام ہے کیونکہ اس سے لوگوں کو نقصان پہنچتا ہے، اور اس کی تعریف یہ کی کہ مہنگائی کے وقت خریدا ہوا مال روک کر شدید ضرورت کے وقت زیادہ قیمت پر بیچا جائے، اور یہ کہ بنیادی غذاؤں میں یہ اور سخت حرام ہے۔ میوزیم اسے ایک دستاویز کے طور پر درج کرتا ہے اور کوئی فتویٰ نہیں دیتا۔ خوراک روکنے سے یہ کیسے بدلتا ہے کہ اس تک کون پہنچ سکتا ہے؟
