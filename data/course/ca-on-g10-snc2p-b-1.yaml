  title:
    en: Blood through the lung
    ar: الدم عبر الرئة
    ur: پھیپھڑے سے گزرتا خون
  text:
    en: The physician Ibn al-Nafis wrote, in his commentary on the anatomy of Ibn Sina's Canon, that blood does not cross from the right ventricle of the heart to the left through pores in the wall between them, as Galen had taught, because that wall is solid; it reaches the left ventricle from the lung. John West (2008) calls this the first known description of the pulmonary circulation. How are the heart and the lungs linked in this account?
    ar: كتب الطبيب ابن النفيس، في شرحه على تشريح «القانون» لابن سينا، أن الدم لا يعبر من البطين الأيمن إلى الأيسر من مسامّ في الحاجز بينهما كما قال جالينوس، لأن الحاجز هناك مصمت؛ بل يدخل البطين الأيسر من الرئة. ويراه جون وست (2008) أول وصف معروف للدورة الدموية الرئوية. كيف يرتبط القلب بالرئتين في هذا الوصف؟
    ur: طبیب ابن نفیس نے ابن سینا کی «القانون» کی تشریح پر اپنی شرح میں لکھا کہ خون، جیسا کہ جالینوس نے سکھایا تھا، دونوں بطینوں کے بیچ کی دیوار کے مساموں سے دائیں بطین سے بائیں میں نہیں جاتا، کیونکہ وہ دیوار ٹھوس ہے؛ بلکہ وہ بائیں بطین میں پھیپھڑے سے پہنچتا ہے۔ جون ویسٹ (2008) اسے پھیپھڑوں کی دورانِ خون کا پہلا معلوم بیان قرار دیتے ہیں۔ اس بیان میں دل اور پھیپھڑے کیسے جڑے ہیں؟
