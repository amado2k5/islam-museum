- position: before
  kind: object
  entity: concept/arabesque
  title:
    en: The arabesque and the surface
    ar: الأرابيسك والسطح
    ur: عربیسک اور سطح
  text:
    en: Yeomans sees the beginning of the Islamic arabesque in a style found at Samarra, where leaves become simple shapes, lose their stems and are arranged into a flat pattern on the surface. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. How does a design that respects its surface change the way a wall looks?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز وُجد في سامراء، حيث تصير الأوراق أشكالًا بسيطة وتفقد سيقانها وتنتظم في نقش مسطّح على السطح. ويرى أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. فكيف يغيّر تصميم يحترم سطحه مظهر الجدار؟
    ur: یومنز کے نزدیک اسلامی عربیسک کی پیدائش سامرا کے ایک طرز میں دکھائی دیتی ہے، جہاں پتے سادہ شکلیں بن جاتے ہیں، اپنے تنے کھو دیتے ہیں اور سطح پر ایک ہموار نقش میں ترتیب پاتے ہیں۔ ان کی رائے میں نباتاتی عربیسک مخصوص انداز کا اور دو بعدی ہے اور سطح کا احترام کرتا ہے، برخلاف یونانی رومی بند اور فطرت نما آرائش کے۔ جو نقش اپنی سطح کا احترام کرے، وہ دیوار کے منظر کو کیسے بدلتا ہے؟
  sources:
  - source/yeomans-islamic-cairo-2006
- position: after
  kind: object
  entity: work/monumental-calligraphy-in-fatimid-egypt
  title:
    en: Inscriptions on the gates and facades of Cairo
    ar: الكتابات على أبواب القاهرة وواجهاتها
    ur: قاہرہ کے دروازوں اور سامنے کی دیواروں پر کتبے
  text:
    en: Bernard O'Kane follows the Kufic inscriptions of Fatimid Cairo in stone, stucco and wood. He observes that on Badr al-Jamali's gates his titles take up much more space than those of the caliph al-Mustansir, "a nod to the real holder of power". At al-Aqmar the foundation inscription appears twice on the facade, the upper floriated and the lower plain, with the caliph's name placed in the middle above the doorway. What can size and position say?
    ar: يتتبع برنارد أوكين الكتابات الكوفية على الحجر والجص والخشب في القاهرة الفاطمية. ويلاحظ أن نقوش أبواب بدر الجمالي تعطي ألقابه مساحة أكبر بكثير من ألقاب الخليفة المستنصر، «إيماءً إلى صاحب السلطة الفعلية». وفي الأقمر يتكرر نقش التأسيس مرتين على الواجهة، أعلاه مورَّق وأسفله غير مورَّق، ووُضع اسم الخليفة في الوسط فوق الباب مباشرة. فماذا يقول الحجم والموضع؟
    ur: برنارڈ او کین قاہرہ کے فاطمی دور میں پتھر، گچ اور لکڑی پر کوفی کتبوں کا سراغ لگاتے ہیں۔ وہ دیکھتے ہیں کہ بدر الجمالی کے دروازوں پر اس کے القاب کو خلیفہ المستنصر کے القاب سے کہیں زیادہ جگہ ملی ہے، «اصل صاحبِ اقتدار کی طرف اشارہ»۔ الاقمر میں بنیاد کا کتبہ سامنے کی دیوار پر دو بار آتا ہے، اوپر والا پھول دار اور نیچے والا سادہ، اور خلیفہ کا نام دروازے کے اوپر بیچ میں رکھا گیا ہے۔ سائز اور مقام کیا کہتے ہیں؟
  sources:
  - source/okane-monumental-calligraphy-fatimid-egypt
