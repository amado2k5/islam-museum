  text:
    en: demonstrate an understanding of the practical applications of science and technology, and of contributions to science and technology from people with diverse lived experiences
    ar: أظهر فهمًا للتطبيقات العملية للعلوم والتكنولوجيا ولإسهامات في العلوم والتكنولوجيا قدّمها أشخاص من تجارب حياتية متنوعة
    ur: سائنس و ٹیکنالوجی کے عملی استعمال اور متنوع زندگی کے تجربات رکھنے والے لوگوں کی سائنس و ٹیکنالوجی میں خدمات کی سمجھ کا مظاہرہ کریں
