- code: A1
  text:
    en: use a scientific research process, a scientific experimentation process, and an engineering design process to conduct investigations, following appropriate health and safety procedures
    ar: استخدم عملية البحث العلمي وعملية التجريب العلمي وعملية التصميم الهندسي لإجراء الاستقصاءات، مع اتباع إجراءات الصحة والسلامة المناسبة
