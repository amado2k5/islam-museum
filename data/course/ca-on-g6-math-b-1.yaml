- position: within
  kind: invention
  title:
    en: Half of a half, in tenths and hundredths
    ar: نصف النصف بالأعشار والأجزاء من المئة
    ur: آدھے کا آدھا، دسویں اور سوویں حصوں میں
  text:
    ar: نصف الواحد يمكن أن يكتب خمسة أعشار، ونصف النصف خمسة وعشرين جزءاً من مئة. في كتاب ألّفه أبو الحسن الإقليدسي بدمشق نجد معالجة مبكرة مباشرة لمثل هذه الكسور داخل الحساب الهندي ذي القيمة المكانية. ليست القصة اختراع الأرقام الهندية أو النقطة العشرية الحالية، وبين المؤرخين خلاف في مقدار اكتمال المفهوم. جرّب أن تنصّف عدداً بالأعشار.
    en: A half can be written as five tenths, and half of that as twenty-five hundredths. In a book composed at Damascus, Abu al-Hasan al-Uqlidisi treats such fractions directly within Indian place-value arithmetic. The record says this is not the invention of the Indian numerals or of today's decimal point, and that historians disagree over how complete his idea was. Try halving a number in tenths.
    ur: آدھے کو پانچ دسویں حصوں میں لکھ سکتے ہیں اور اس کے آدھے کو پچیس سوویں حصوں میں۔ ابو الحسن الاقلیدسی کی دمشق میں تصنیف کردہ کتاب ہندی مقامی حساب میں ایسے کسور کی ابتدائی براہ راست بحث رکھتی ہے۔ یہ ہندی ہندسوں یا موجودہ اعشاری نقطے کی ایجاد نہیں، اور نظری مفہوم کی تکمیل پر مؤرخین مختلف ہیں۔ کسی عدد کو دسویں حصوں میں آدھا کر کے دیکھیں۔
