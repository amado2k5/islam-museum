expectations:
- code: A1.4
  text:
    en: 'compare a few early societies, including at least one First Nation and one Inuit society, in terms of their relationship with the environment […], and describe some key similarities and differences in environmental practices between these societies and present-day Canada'
    ar: 'قارن بين عدد قليل من المجتمعات المبكرة، ومنها مجتمع واحد على الأقل من الأمم الأولى ومجتمع واحد من الإنويت، من حيث علاقتها بالبيئة […]، وصِف بعض أوجه التشابه والاختلاف الرئيسة في الممارسات البيئية بين هذه المجتمعات وكندا اليوم'
    ur: 'چند ابتدائی معاشروں کا، جن میں کم از کم ایک فرسٹ نیشن اور ایک اِنوئٹ معاشرہ شامل ہو، ماحول سے ان کے تعلق کے لحاظ سے موازنہ کریں […]، اور ان معاشروں اور آج کے کینیڈا کے ماحولیاتی طرزِ عمل میں کچھ اہم مماثلتیں اور فرق بیان کریں'
- code: A3.5
  text:
    en: 'describe the importance of the environment for a few early societies, including at least one First Nation and one Inuit society, with a particular focus on how the local environment affected the ways in which people met their physical needs […]'
    ar: 'صِف أهمية البيئة لعدد قليل من المجتمعات المبكرة، ومنها مجتمع واحد على الأقل من الأمم الأولى ومجتمع واحد من الإنويت، مع تركيز خاص على كيف أثّرت البيئة المحلية في الطرق التي لبّى بها الناس حاجاتهم الجسدية […]'
    ur: 'چند ابتدائی معاشروں کے لیے، جن میں کم از کم ایک فرسٹ نیشن اور ایک اِنوئٹ معاشرہ شامل ہو، ماحول کی اہمیت بیان کریں، خاص طور پر اس پر کہ مقامی ماحول نے لوگوں کے اپنی جسمانی ضروریات پوری کرنے کے طریقوں کو کیسے متاثر کیا […]'
connections:
- position: before
  kind: place
  title:
    en: 'Land set aside for grazing'
    ar: 'أرض مخصوصة للرعي'
    ur: 'چراگاہ کے لیے مخصوص زمین'
  text:
    en: 'In Ibn Hisham''s biography, when the people of Jurash embraced Islam, the Prophet reserved for them a hima around their village, marked by known signs, for the horse, the riding camel and the plough-ox. A hima is land that the ruler reserves so that none may graze it except those for whom it was reserved. Why might a community reserve land?'
    ar: 'في سيرة ابن هشام، لما أسلم أهل جرش حمى لهم النبي حمًى حول قريتهم بعلامات معروفة، للفرس والراحلة وثور الحراثة. والحمى أرض يخصّصها الحاكم فلا يرعاها إلا من خُصّصت لهم. لماذا قد تحجز جماعة أرضًا؟'
    ur: 'سیرتِ ابن ہشام میں ہے کہ جب اہلِ جرش اسلام لائے تو نبی نے ان کے گاؤں کے گرد معروف نشانات کے ساتھ ایک حِمیٰ مخصوص کر دیا، گھوڑے، سواری کے اونٹ اور ہل چلانے والے بیل کے لیے۔ حِمیٰ وہ زمین ہے جسے حاکم محفوظ کر دے تاکہ اس میں صرف وہی چرائیں جن کے لیے وہ محفوظ کی گئی۔ کوئی جماعت زمین کیوں مخصوص کر سکتی ہے؟'
  entity: concept/hima
  sources:
