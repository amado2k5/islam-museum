- position: within
  kind: reflection
  title:
    en: 'Farming, dead land and water'
    ar: 'الزراعة والأرض الموات والماء'
    ur: 'کھیتی، بنجر زمین اور پانی'
  text:
    en: 'Al-Maraghi, after Ibn Khaldun, presents agriculture as the oldest livelihood, the simplest and most natural of crafts. He warns against withholding surplus water from crops. How does the way a community uses land and water shape its life?'
    ar: 'يعرض المراغي، تبعًا لابن خلدون، الزراعة بوصفها أقدم أوجه المعاش وأبسط الصناعات وأقربها إلى الطبيعة. ويحذّر من منع فضل الماء عن الزرع. كيف يشكّل استعمال الجماعة للأرض والماء حياتها؟'
    ur: 'مراغی، ابن خلدون کی پیروی میں، زراعت کو معاش کی سب سے قدیم، سب سے سادہ اور فطرت سے قریب ترین صورت کے طور پر پیش کرتے ہیں۔ وہ کھیتی سے فاضل پانی روکنے کے خلاف خبردار کرتے ہیں۔ کسی جماعت کا زمین اور پانی کو استعمال کرنے کا طریقہ اس کی زندگی کو کیسے ڈھالتا ہے؟'
  entity: concept/agriculture-in-islam
  sources:
  - source/min-qadaya-al-mal-wal-amal-azhar
- position: after
  kind: place
  title:
    en: 'Water points on a desert road'
    ar: 'مناهل في طريق صحراوي'
    ur: 'صحرائی راستے پر پانی کے مقامات'
  text:
    en: 'On Ibn Jubayr''s journey to the pilgrimage he left Qus on camels with camel-drivers and halted first at a water known as al-Hajir. Ibn Jubayr''s book then names more desert water points, such as al-Khubayb and Shaghib, before Aydhab, a coastal city, and states that this road was deadly to pilgrims through thirst. What would a traveller need to find or carry on such a road?'
    ar: 'في رحلة ابن جبير إلى الحج غادر قوص على الجمال مع جمّالين من المبرز، ونزلوا أول الليل عند ماء يُعرف بالحاجر. ثم يذكر كتاب ابن جبير مناهل أخرى في الصحراء، منها الخبيب وشاغب، قبل عيذاب، وهي مدينة على الساحل، ويقول إن هذا الطريق كان مهلكًا للحجاج من العطش. ماذا يحتاج المسافر أن يجده أو يحمله في طريق كهذا؟'
    ur: 'ابن جبیر کے سفرِ حج میں وہ قوص سے مبرز کے شتربانوں کے ساتھ اونٹوں پر روانہ ہوئے اور رات کے آغاز میں حاجر نامی پانی پر رکے۔ پھر ابن جبیر کی کتاب صحرا میں پانی کے مزید مقامات گنواتی ہے، جیسے خبیب اور شاغب، عیذاب سے پہلے، جو ساحل پر ایک شہر ہے، اور کہتی ہے کہ یہ راستہ پیاس کے باعث حاجیوں کے لیے جان لیوا تھا۔ ایسے راستے پر مسافر کو کیا ڈھونڈنا یا ساتھ رکھنا پڑتا ہے؟'
  entity: journey/qus-to-aydhab-jubayr-desert
  sources:
