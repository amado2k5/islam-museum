  title:
    en: Ibn Rushd and Aristotle
    ar: ابن رشد وأرسطو
    ur: ابن رشد اور ارسطو
  text:
    en: "Al-Zirikli, in al-A'lam, says that Ibn Rushd devoted himself to the words of Aristotle and translated him into Arabic, and that he wrote about fifty books. What would you add to find out how Aristotle was read after Ibn Rushd?"
    ar: "يذكر الزركلي في «الأعلام» أن ابن رشد عُني بكلام أرسطو فترجمه إلى العربية، وأنه صنّف نحو خمسين كتاباً. ماذا تضيف لتعرف كيف قُرئ أرسطو بعد ابن رشد؟"
    ur: "زرکلی «الاعلام» میں بتاتے ہیں کہ ابن رشد نے ارسطو کے کلام کی خاص عنایت کی اور اسے عربی میں ترجمہ کیا، اور یہ کہ انہوں نے تقریباً پچاس کتابیں تصنیف کیں۔ یہ جاننے کے لیے کہ ابن رشد کے بعد ارسطو کو کیسے پڑھا گیا، آپ کیا شامل کریں گے؟"
