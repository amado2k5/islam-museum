connections:
- position: before
  kind: place
  title:
    en: A library for old books
    ar: مكتبة للكتب القديمة
    ur: پرانی کتابوں کا کتب خانہ
  text:
    en: "Ahmad Amin, in Duha al-Islam, writes that the House of Wisdom was a library in Baghdad: al-Rashid laid its foundation and al-Mamun developed and strengthened it. Al-Rashid appointed Yuhanna ibn Masawayh to translate the old medical books found in the lands of Rum, and al-Mamun sent to the king of Rum asking permission to send for the ancient sciences he chose. He adds that its system and exact location remain uncertain. What would a library like this give its readers?"
    ar: "يكتب أحمد أمين في «ضحى الإسلام» أن بيت الحكمة مكتبة في بغداد: وضع الرشيد نواتها ونماها المأمون وقواها. ولّى الرشيد يوحنا بن ماسويه ترجمة الكتب الطبية القديمة التي وُجدت في بلاد الروم، وبعث المأمون إلى ملك الروم يستأذنه في إرسال من يختار من العلوم القديمة. ويضيف أن نظامها وموضعها على وجه التعيين بقيا محفوفين بالغموض. ماذا تمنح مكتبة كهذه قراءها؟"
    ur: "احمد امین «ضحی الاسلام» میں لکھتے ہیں کہ بیت الحکمہ بغداد کا ایک کتب خانہ تھا: اس کی بنیاد ہارون الرشید نے رکھی اور مامون نے اسے بڑھایا اور مضبوط کیا۔ الرشید نے یوحنا بن ماسویہ کو روم کے علاقوں میں ملنے والی قدیم طبی کتابوں کے ترجمے پر مقرر کیا، اور مامون نے رومی بادشاہ کو پیغام بھیج کر اجازت مانگی کہ وہ قدیم علوم میں سے جو چاہے منتخب کر کے بھیجے۔ وہ مزید کہتے ہیں کہ اس کا نظام اور عین مقام دونوں غیر واضح ہی رہے۔ ایسا کتب خانہ اپنے قارئین کو کیا دیتا ہوگا؟"
  entity: building/bayt-al-hikma
