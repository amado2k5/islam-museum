  title:
    en: A reader who did not always defer
    ar: قارئ لا يسلّم دائماً
    ur: ایک قاری جو ہمیشہ مان نہیں لیتا
  text:
    en: 'In Kitab al-Hayawan, al-Jahiz often quotes Aristotle, whom he calls the master of logic. He does not always defer to him: where Aristotle claims that seeing an eagle''s chick is a hard thing, al-Jahiz says he is not able to judge between them and turns to what he knows of the crows of Basra. Where would you check an old claim for yourself?'
    ar: 'يكثر الجاحظ في «كتاب الحيوان» من النقل عن أرسطو، ويسميه «صاحب المنطق». ولا يسلّم له دائماً: فإذا زعم أن رؤية فرخ العقاب أمر عسير قال الجاحظ: «ولست أحسن أن أقضي بينهما»، ثم ذكر ما يعرفه من الغربان بالبصرة. أين تتحقق بنفسك من دعوى قديمة؟'
    ur: 'کتاب الحیوان میں جاحظ ارسطو سے کثرت سے نقل کرتے ہیں اور انہیں «صاحب المنطق» کہتے ہیں۔ وہ ہمیشہ ان کی بات تسلیم نہیں کرتے: جہاں ارسطو کہتے ہیں کہ عقاب کا بچہ دیکھنا مشکل ہے، جاحظ کہتے ہیں «میں ان دونوں کے درمیان فیصلہ کرنا نہیں جانتا» اور بصرہ کے کووں کے بارے میں اپنی معلومات کی طرف آتے ہیں۔ کسی پرانے دعوے کو آپ خود کہاں جانچیں گے؟'
  entity: person/aristutalis
