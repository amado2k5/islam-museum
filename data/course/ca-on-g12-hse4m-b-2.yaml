  kind: story
  title:
    en: A pact among the communities of Medina
    ar: عهد بين جماعات المدينة
    ur: مدینہ کی جماعتوں کے درمیان ایک معاہدہ
  text:
    en: 'In Medina the Prophet concluded a treaty among the believers of Quraysh and Yathrib and those who followed them. Al-Raheeq al-Makhtum lists among its clauses: the believers unite against whoever seeks injustice, sin or aggression, even if he is one of their own sons; the Jews who follow the believers have support and are neither wronged nor allied against; disputes go to God and the Prophet. The record notes that the early reports differ in the order and detail of the clauses. What does a written pact do that a custom does not?'
    ar: عقد النبي في المدينة معاهدة بين المؤمنين من قريش ويثرب ومن تبعهم. ويذكر «الرحيق المختوم» من بنودها أن المؤمنين يتعاونون على من ابتغى ظلمًا أو إثمًا أو عدوانًا ولو كان ولد أحدهم، وأن لليهود الذين تبعوا المؤمنين النصر غير مظلومين ولا متناصرين عليهم، وأن ما يختلفون فيه يُرد إلى الله وإلى النبي. ويشير السجل إلى أن الروايات تتفاوت في ترتيب البنود وتفاصيلها. فماذا يفعل عهد مكتوب لا تفعله العادة؟
    ur: 'مدینہ میں نبی نے قریش اور یثرب کے مومنوں اور ان کے پیروکاروں کے درمیان ایک معاہدہ کیا۔ «الرحیق المختوم» اس کی شقوں میں سے یہ ذکر کرتی ہے: مومن اس کے خلاف متحد ہوں جو ظلم، گناہ یا زیادتی چاہے، چاہے وہ ان میں سے کسی کا بیٹا ہو؛ جو یہودی مومنوں کے ساتھ ہوں ان کے لیے مدد ہے، نہ ان پر ظلم ہو نہ ان کے خلاف کوئی مدد کرے؛ اور جس بات میں اختلاف ہو وہ اللہ اور نبی کی طرف لوٹائی جائے۔ ریکارڈ بتاتا ہے کہ روایات شقوں کی ترتیب اور تفصیل میں مختلف ہیں۔ ایک تحریری معاہدہ وہ کیا کرتا ہے جو رواج نہیں کرتا؟'
