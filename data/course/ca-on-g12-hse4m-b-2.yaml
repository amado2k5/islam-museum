- position: after
  kind: story
  title:
    en: A General Assembly resolution
    ar: قرار للجمعية العامة
    ur: جنرل اسمبلی کی ایک قرارداد
  text:
    en: On 15 March 2022 the United Nations General Assembly adopted resolution A/RES/76/254 by consensus, proclaiming 15 March the International Day to Combat Islamophobia. In 2024 it adopted a resolution condemning incitement to discrimination, hostility or violence against Muslims, calling on member states to take legislative and policy measures, and requesting a Special Envoy. How might a text like this change what people think the issue is?
    ar: في 15 مارس 2022 اعتمدت الجمعية العامة للأمم المتحدة بتوافق الآراء القرار A/RES/76/254 الذي أعلن 15 مارس يومًا دوليًا لمكافحة الإسلاموفوبيا. وفي 2024 اعتمدت قرارًا يدين التحريض على التمييز أو العداء أو العنف ضد المسلمين، ويدعو الدول الأعضاء إلى تدابير تشريعية وسياسية، ويطلب تعيين مبعوث خاص. فكيف يمكن لنص كهذا أن يغيّر ما يظنه الناس عن القضية؟
    ur: 15 مارچ 2022 کو اقوامِ متحدہ کی جنرل اسمبلی نے اتفاقِ رائے سے قرارداد A/RES/76/254 منظور کی، جس نے 15 مارچ کو اسلاموفوبیا کے خلاف عالمی دن قرار دیا۔ 2024 میں اس نے ایک اور قرارداد منظور کی جو مسلمانوں کے خلاف امتیاز، دشمنی یا تشدد پر اکسانے کی مذمت کرتی ہے، رکن ممالک سے قانون سازی اور پالیسی کے اقدامات کا مطالبہ کرتی ہے، اور خصوصی ایلچی مقرر کرنے کی درخواست کرتی ہے۔ ایسی تحریر لوگوں کے اس خیال کو کیسے بدل سکتی ہے کہ مسئلہ کیا ہے؟
  entity: event/international-day-to-combat-islamophobia
  sources:
