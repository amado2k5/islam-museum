- position: after
  kind: quran
  title:
    en: Read Saba 16
    ar: اقرأ سبأ 16
    ur: سورۂ سبا آیت 16 پڑھیں
  text:
    en: 'The record of the flood points to Surat Saba, verse 16, as the place where the Qur''an mentions the flood of al-Arim. Read the verse on the page as the museum prints it. Then ask: what does it say in its own words, and how does it sit beside the history of the dam in this lesson?'
    ar: 'يشير سجل السيل إلى سورة سبأ، الآية 16، موضعاً ذكر فيه القرآن سيل العرم. اقرأ الآية كما يعرضها المتحف من نصه المثبت، ثم اسأل: ماذا تقول بألفاظها هي، وكيف تقف إلى جانب تاريخ السد الذي رأيته في هذا الدرس؟'
    ur: 'سیلاب کا ریکارڈ سورۂ سبا کی آیت 16 کی طرف اشارہ کرتا ہے جہاں قرآن نے سیلِ عرم کا ذکر کیا ہے۔ آیت کو اس طرح پڑھیں جیسے عجائب گھر اپنے محفوظ متن سے دکھاتا ہے، پھر پوچھیں: وہ اپنے الفاظ میں کیا کہتی ہے، اور اس سبق میں دیکھی گئی بند کی تاریخ کے ساتھ اس کا کیا تعلق بنتا ہے؟'
  ref: '34:16'
  entity: passage/quran-34-16
