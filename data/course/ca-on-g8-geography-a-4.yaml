  kind: story
  title:
    en: The dam that burst
    ar: السد الذي انفجر
    ur: وہ بند جو پھٹ گیا
  text:
    en: The Sealed Nectar puts the bursting of the Marib Dam in Yemen at 450 or 451 CE, the great flood that the Qur'an mentions as the flood of al-Arim. The author calls it a major event that led to the ruin of settlement and the scattering of peoples, and notes that the sources differ widely on the dating. How can the failure of one water structure change where people can live?
    ar: يقدّر الرحيق المختوم انفجار سد مأرب في اليمن بسنة 450م أو 451م، وهو السيل العظيم الذي ذكره القرآن بسيل العرم. ويصفه المؤلف بأنه حادثة كبرى أدت إلى خراب العمران وتشتت الشعوب، وينبّه إلى أن المصادر تختلف كثيراً في تعيين السنين. كيف يغيّر انهيار منشأة مائية واحدة المواضع التي يستطيع الناس العيش فيها؟
    ur: الرحیق المختوم یمن کے سدِ مأرب کے پھٹنے کا زمانہ 450 یا 451 عیسوی بتاتی ہے، یعنی وہ بڑا سیلاب جسے قرآن سیلِ عرم کہتا ہے۔ مصنف اسے ایک بڑا واقعہ قرار دیتا ہے جس سے آبادی اجڑ گئی اور قومیں بکھر گئیں، اور متنبہ کرتا ہے کہ سنین کے تعین میں ماخذ بہت مختلف ہیں۔ ایک آبی ڈھانچے کا ٹوٹنا لوگوں کے رہنے کی جگہوں کو کیسے بدل سکتا ہے؟
  entity: event/flood-of-al-aram
  sources:
