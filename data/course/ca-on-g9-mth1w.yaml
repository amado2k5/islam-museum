summary:
  ar: 'مقرر MTH1W للرياضيات في الصف التاسع في منهاج أونتاريو له سبعة محاور. يربط المتحف أجزاء من أربعة منها: العدد، والجبر، والهندسة والقياس، والثقافة المالية؛ أما محاور المهارات الاجتماعية والعاطفية والتفكير الرياضي والبيانات فلا يربط منها شيئاً.'
  en: 'The Ontario Grade 9 Mathematics course MTH1W has seven strands. The museum maps parts of four of them: Number, Algebra, Geometry and Measurement, and Financial Literacy; it maps nothing in the strands on social-emotional skills, mathematical thinking and Data.'
  ur: 'اونٹاریو کے نویں جماعت کے ریاضی کورس MTH1W کے سات محور ہیں۔ عجائب گھر ان میں سے چار کے کچھ حصے جوڑتا ہے: عدد، الجبرا، ہندسہ اور پیمائش، اور مالی خواندگی؛ سماجی و جذباتی مہارتوں، ریاضیاتی سوچ اور ڈیٹا کے محوروں میں کچھ نہیں جوڑتا۔'
  es: "El curso de Matemáticas de noveno grado de Ontario, MTH1W, tiene siete ejes temáticos. El museo abarca partes de cuatro de ellos: Números, Álgebra, Geometría y Medición, y Alfabetización Financiera; no abarca nada de los ejes temáticos sobre habilidades socioemocionales, pensamiento matemático y datos."
  fr: "Le cours de mathématiques de 9e année de l'Ontario (MTH1W) comporte sept volets. Le musée en cartographie des parties: nombres, algèbre, géométrie et mesure, et littératie financière. Il n'en cartographie aucun pour les volets relatifs aux compétences socio-émotionnelles, à la pensée mathématique et aux données."
  tr: "Ontario'daki MTH1W 9. sınıf matematik müfredatı yedi modülden oluşmaktadır. Müze, bu modüllerden dördünün (sayılar, cebir, geometri ve ölçme ile finansal okuryazarlık) bazı bölümlerini birbirine bağlar; sosyal ve duygusal beceriler, matematiksel akıl yürütme ve veri modülleri ise bunlardan hiçbirini birbirine bağlamaz."
  id: "Kurikulum matematika MTH1W kelas 9 di Ontario memiliki tujuh modul. Museum ini menghubungkan bagian-bagian dari empat modul tersebut: bilangan, aljabar, geometri dan pengukuran, serta literasi keuangan; modul tentang keterampilan sosial dan emosional, penalaran matematika, dan data tidak menghubungkan satu pun dari modul tersebut."
