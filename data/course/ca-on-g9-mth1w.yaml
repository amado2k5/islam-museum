summary:
  ar: 'مقرر MTH1W للرياضيات في الصف التاسع في منهاج أونتاريو له سبعة محاور. يربط المتحف أجزاء من أربعة منها: العدد، والجبر، والهندسة والقياس، والثقافة المالية؛ أما محاور المهارات الاجتماعية والعاطفية والتفكير الرياضي والبيانات فلا يربط منها شيئاً.'
  en: 'The Ontario Grade 9 Mathematics course MTH1W has seven strands. The museum maps parts of four of them: Number, Algebra, Geometry and Measurement, and Financial Literacy; it maps nothing in the strands on social-emotional skills, mathematical thinking and Data.'
  ur: 'اونٹاریو کے نویں جماعت کے ریاضی کورس MTH1W کے سات محور ہیں۔ عجائب گھر ان میں سے چار کے کچھ حصے جوڑتا ہے: عدد، الجبرا، ہندسہ اور پیمائش، اور مالی خواندگی؛ سماجی و جذباتی مہارتوں، ریاضیاتی سوچ اور ڈیٹا کے محوروں میں کچھ نہیں جوڑتا۔'
