expectations:
- code: A1
  text:
    en: 'assess contributions to Canadian identities made by various groups and communities, including First Nations, Métis, and Inuit communities, and by various features of Canadian communities and regions (FOCUS ON: Cause and Consequence; Patterns and Trends)'
    ar: 'قيّم إسهامات جماعات ومجتمعات متنوعة، منها مجتمعات الأمم الأولى والميتيس والإنويت، وسمات متنوعة في المجتمعات والمناطق الكندية، في الهويات الكندية ⁦(التركيز على: السبب والنتيجة؛ الأنماط والاتجاهات)⁩'
    ur: 'کینیڈا کی شناختوں میں مختلف گروہوں اور برادریوں، بشمول فرسٹ نیشنز، میٹس اور انوئٹ برادریوں، اور کینیڈا کی برادریوں اور علاقوں کی مختلف خصوصیات کے حصے کا جائزہ لیں ⁦(توجہ: سبب اور نتیجہ؛ رجحانات اور نمونے)⁩'
- code: A2
  text:
    en: 'use the social studies inquiry process to investigate different perspectives on the historical and/or contemporary experiences of a few distinct communities, including First Nations, Métis, and/or Inuit communities, in Canada (FOCUS ON: Perspective)'
    ar: 'استخدم عملية الاستقصاء في الدراسات الاجتماعية لتبحث في وجهات النظر المختلفة حول التجارب التاريخية و/أو المعاصرة لعدد قليل من المجتمعات المتميزة في كندا، ومنها مجتمعات الأمم الأولى والميتيس و/أو الإنويت ⁦(التركيز على: المنظور)⁩'
    ur: 'سماجی علوم کے تحقیقی عمل سے کام لے کر کینیڈا میں چند مخصوص برادریوں، بشمول فرسٹ نیشنز، میٹس اور/یا انوئٹ برادریوں، کے تاریخی اور/یا موجودہ تجربات کے بارے میں مختلف نقطہ ہائے نظر کی چھان بین کریں ⁦(توجہ: نقطۂ نظر)⁩'
- code: A3
  text:
    en: 'demonstrate an understanding of significant experiences of, and major changes and aspects of life in, various historical and contemporary communities, including First Nations, Métis, and Inuit communities, in Canada (FOCUS ON: Significance; Continuity and Change)'
    ar: 'أظهر فهمًا للتجارب المهمة والتغيرات الكبرى وجوانب الحياة في مجتمعات تاريخية ومعاصرة متنوعة في كندا، منها مجتمعات الأمم الأولى والميتيس والإنويت ⁦(التركيز على: الأهمية؛ الاستمرار والتغيّر)⁩'
    ur: 'کینیڈا کی مختلف تاریخی اور موجودہ برادریوں، بشمول فرسٹ نیشنز، میٹس اور انوئٹ برادریوں، کے اہم تجربات، بڑی تبدیلیوں اور زندگی کے پہلوؤں کی فہم کا مظاہرہ کریں ⁦(توجہ: اہمیت؛ تسلسل اور تبدیلی)⁩'
order: 1
