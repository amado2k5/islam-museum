expectations:
- code: B1
  text:
    en: 'analyse aspects of the extraction/harvesting and use of natural resources in different regions of the world, and assess ways of preserving these resources (FOCUS ON: Spatial Significance; Interrelationships)'
    ar: 'حلّل جوانب من استخراج الموارد الطبيعية/حصادها واستخدامها في مناطق مختلفة من العالم، وقيّم سبل الحفاظ على هذه الموارد ⁦(التركيز على: الأهمية المكانية؛ الترابطات)⁩'
    ur: 'دنیا کے مختلف خطوں میں قدرتی وسائل کے نکالنے/حاصل کرنے اور استعمال کے مختلف پہلوؤں کا تجزیہ کریں، اور ان وسائل کے تحفظ کے طریقوں کا جائزہ لیں ⁦(توجہ کا محور: مکانی اہمیت؛ باہمی روابط)⁩'
- code: B2
  text:
    en: 'use the geographic inquiry process to investigate issues related to the impact of the extraction/harvesting and/or use of natural resources around the world from a geographic perspective (FOCUS ON: Geographic Perspective)'
    ar: 'استخدم عملية الاستقصاء الجغرافي لدراسة قضايا تتصل بأثر استخراج الموارد الطبيعية/حصادها و/أو استخدامها حول العالم من منظور جغرافي ⁦(التركيز على: المنظور الجغرافي)⁩'
    ur: 'جغرافیائی تحقیق کے عمل کو استعمال کرتے ہوئے دنیا بھر میں قدرتی وسائل کے نکالنے/حاصل کرنے اور/یا استعمال کے اثرات سے متعلق مسائل کی جغرافیائی نقطۂ نظر سے چھان بین کریں ⁦(توجہ کا محور: جغرافیائی نقطۂ نظر)⁩'
- code: B3
  text:
    en: 'demonstrate an understanding of the sources and use of different types of natural resources and of some of the effects of the extraction/harvesting and use of these resources (FOCUS ON: Spatial Significance; Geographic Perspective)'
    ar: 'أظهر فهمًا لمصادر مختلف أنواع الموارد الطبيعية واستخداماتها ولبعض آثار استخراج هذه الموارد/حصادها واستخدامها ⁦(التركيز على: الأهمية المكانية؛ المنظور الجغرافي)⁩'
    ur: 'مختلف اقسام کے قدرتی وسائل کے ذرائع اور استعمال کی، اور ان وسائل کے نکالنے/حاصل کرنے اور استعمال کے بعض اثرات کی سمجھ کا مظاہرہ کریں ⁦(توجہ کا محور: مکانی اہمیت؛ جغرافیائی نقطۂ نظر)⁩'
