- position: after
  kind: invention
  title:
    en: Telling two diseases apart
    ar: التمييز بين مرضين
    ur: دو بیماریوں میں فرق
  text:
    en: Abu Bakr al-Razi's treatise on smallpox and measles compares what the two diseases share and where they differ. It assembles shared symptoms, then distinguishes relatively more nausea and anxiety in measles from more characteristic back pain in smallpox, according to his observations and his period's interpretation. It is a document in medical history, not a guide to diagnosis today. How do you compare two similar conditions?
    ar: في رسالة أبي بكر الرازي عن الجدري والحصبة مقارنة بين ما يتشابه وما يختلف في المرضين. يعرض أعراضًا مشتركة، ثم يفرّق بين تكرر الغثيان والقلق في الحصبة وبروز ألم الظهر في الجدري، بحسب ملاحظته وتفسير عصره. والرسالة وثيقة في تاريخ الطب، وليست دليلًا لتشخيص مرض اليوم. كيف تقارن بين حالتين متشابهتين؟
    ur: ابوبکر الرازی کا چیچک اور خسرے پر رسالہ دونوں بیماریوں کی مشترک اور مختلف باتوں کا موازنہ کرتا ہے۔ وہ مشترک علامات جمع کرتا ہے، پھر اپنے مشاہدے اور اپنے دور کی تعبیر کے مطابق خسرے میں متلی اور بے چینی کو چیچک کی نمایاں کمر درد سے الگ کرتا ہے۔ یہ طب کی تاریخ کی دستاویز ہے، آج کی تشخیص کی رہنمائی نہیں۔ ملتی جلتی دو کیفیتوں کا موازنہ آپ کیسے کریں گے؟
  entity: invention/al-razi-smallpox-measles
