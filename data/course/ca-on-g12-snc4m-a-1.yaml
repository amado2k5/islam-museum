  title:
    en: The physician's craft
    ar: حرفة الطبيب
    ur: طبیب کا پیشہ
  text:
    en: The physician diagnoses illness and treats it by the science of medicine. In the Islamic states the craft was learned by study, practice and attachment to experienced practitioners. In the Abbasid period a practitioner was admitted after an examination before the head of physicians, who then issued a licence. How is a physician trained and licensed where you live?
    ar: الطبيب من يشخّص المرض ويعالجه بعلم الطب. وفي الدولة الإسلامية كان الطب حرفة تُتعلَّم بالدراسة والتجربة والملازمة. ثم صار في العصر العباسي يُمنح بامتحان أمام رئيس الأطباء وإجازة. كيف يتدرّب الطبيب ويحصل على الإجازة اليوم في المكان الذي تعيش فيه؟ وما الذي تغيّر منذ ذلك العهد؟
    ur: طبیب بیماری کی تشخیص کرتا اور علمِ طب سے اس کا علاج کرتا ہے۔ اسلامی ریاستوں میں یہ پیشہ مطالعے، مشق اور تجربہ کار معالجوں کی صحبت سے سیکھا جاتا تھا۔ عباسی دور میں معالج کو رئیس الاطباء کے سامنے امتحان کے بعد داخل کیا جاتا اور وہ اسے اجازت نامہ دیتا۔ آپ کے ہاں طبیب کی تربیت اور اجازت کیسے ہوتی ہے؟
