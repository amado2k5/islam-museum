  title:
    en: A physician corrects Galen
    ar: طبيب يصحّح جالينوس
    ur: ایک معالج جالینوس کی تصحیح کرتا ہے
  text:
    en: In the thirteenth century the physician Ibn al-Nafis wrote, in his commentary on the anatomy of Ibn Sina's Canon, that blood does not cross from the right ventricle to the left through pores in the wall between them, as Galen had taught, because that wall is solid; it reaches the left ventricle from the lung. Which part of this was new, and which was already known?
    ar: كتب الطبيب ابن النفيس في القرن السابع الهجري، في شرحه على تشريح قانون ابن سينا، أن الدم لا يعبر من البطين الأيمن إلى البطين الأيسر من مسامّ في الحاجز بينهما كما قال جالينوس، لأن الحاجز هناك مصمت؛ بل يدخل البطين الأيسر من الرئة. أي جزء من هذا كان جديدًا، وأي جزء كان معروفًا من قبل؟
    ur: طبیب ابن النفیس نے ساتویں صدی ہجری میں ابن سینا کے قانون کی تشریح پر اپنی شرح میں لکھا کہ خون دل کے دائیں بطین سے بائیں بطین میں ان مساموں سے نہیں گزرتا جو جالینوس کے بقول دونوں کے درمیانی پردے میں ہیں، کیونکہ وہ پردہ ٹھوس ہے؛ بلکہ وہ پھیپھڑے سے بائیں بطین میں پہنچتا ہے۔ اس میں کیا نیا تھا اور کیا پہلے سے معلوم تھا؟
