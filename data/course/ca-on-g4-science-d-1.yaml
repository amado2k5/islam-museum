  title:
    en: A peacock, a float and two figures
    ar: طاووس وعوّامة وشخصيتان
    ur: ایک طاؤس، ایک تیرنے والا پرزہ اور دو مورتیاں
  text:
    en: 'A peacock pours water, one figure offers soap and another a towel: a hand-washing design in al-Jazari''s book. The Cleveland Museum of Art explains the sequence: collected water raises a float, releasing a soap-bearing figure and then a towel-bearing one, and the used water drains through a spigot. The museum does not know for certain whether the machine was ever built. Which part does which job?'
    ar: 'طاووس يصب ماءً، وشخصية تقدّم الصابون، ثم أخرى تحمل المنديل: تصميم لغسل اليدين في كتاب الجزري. يشرح متحف كليفلاند التتابع: يرفع الماء المتجمع عوّامة تُخرج شخصية بالصابون ثم أخرى بالمنديل، ثم يُصرف الماء المستعمل بصنبور. ولا يعرف المتحف بيقين هل بُنيت الآلة فعلًا. أي جزء يؤدي أي عمل؟'
    ur: 'ایک طاؤس پانی ڈالتا ہے، ایک مورتی صابن پیش کرتی ہے اور دوسری تولیہ: جزری کی کتاب میں ہاتھ دھونے کا ایک ڈیزائن۔ کلیولینڈ میوزیم آف آرٹ ترتیب سمجھاتا ہے: جمع شدہ پانی ایک تیرنے والے پرزے کو اٹھاتا ہے جو صابن والی مورتی کو اور پھر تولیے والی مورتی کو آزاد کرتا ہے، اور استعمال شدہ پانی نل سے نکل جاتا ہے۔ عجائب گھر یقین سے نہیں جانتا کہ یہ مشین کبھی بنی بھی یا نہیں۔ کون سا پرزہ کون سا کام کرتا ہے؟'
