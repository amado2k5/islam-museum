expectations:
- code: A1
  text:
    en: demonstrate scientific investigation skills (related to both inquiry and research) in the four areas of skills (initiating and planning, performing and recording, analysing and interpreting, and communicating)
    ar: أظهر مهارات التقصي العلمي ⁦(المتعلقة بالاستقصاء والبحث معًا)⁩ في مجالات المهارات الأربعة ⁦(الشروع والتخطيط، والتنفيذ والتسجيل، والتحليل والتفسير، والتواصل)⁩
