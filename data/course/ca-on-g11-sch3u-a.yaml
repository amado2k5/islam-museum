- code: A2
  text:
    en: identify and describe careers related to the fields of science under study, and describe the contributions of scientists, including Canadians, to those fields
    ar: حدّد ووصف المهن المتصلة بميادين العلم قيد الدراسة، وصف إسهامات العلماء، ومنهم الكنديون، في تلك الميادين
    ur: زیرِ مطالعہ سائنسی شعبوں سے متعلق پیشوں کی نشاندہی اور ان کا بیان کریں، اور ان شعبوں میں سائنس دانوں، بشمول کینیڈین، کی خدمات بیان کریں
