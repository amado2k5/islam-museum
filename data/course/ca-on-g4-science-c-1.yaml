- position: within
  kind: invention
  title:
    en: A dark room and a hole
    ar: بيت مظلم وثقب
    ur: تاریک کمرہ اور ایک سوراخ
  text:
    en: Ibn al-Haytham let the light of the sun, the moon, the stars and a fire into a dark room through a small hole and studied it on the opposite wall. He cut its path with an opaque body and laid a ruler along it, and found it perfectly straight. With several candles before one hole, a spot of light appeared opposite each candle along a straight line through the hole. What does this show about how light travels?
    ar: أدخل ابن الهيثم ضوء الشمس والقمر والكواكب والنار من ثقب صغير إلى بيت مظلم، وتأمله على الجدار المقابل. قطع طريقه بجسم كثيف ومدّ عليه مسطرة فوجده في غاية الاستقامة. وحين وضع عدة سرج أمام ثقب واحد ظهر ضوء مقابل كل سراج على الخط المستقيم المارّ بالثقب. ماذا يبيّن هذا عن طريقة انتقال الضوء؟
    ur: ابن الہیثم نے سورج، چاند، ستاروں اور آگ کی روشنی ایک چھوٹے سوراخ سے تاریک کمرے میں آنے دی اور سامنے کی دیوار پر اس کا مطالعہ کیا۔ اس نے ایک ٹھوس جسم سے اس کا راستہ کاٹا اور اس پر پیمانہ رکھا تو اسے بالکل سیدھا پایا۔ جب ایک ہی سوراخ کے سامنے کئی چراغ رکھے گئے تو ہر چراغ کے سامنے سوراخ سے گزرتی سیدھی لکیر پر روشنی کا ایک دھبہ ظاہر ہوا۔ یہ روشنی کے سفر کے بارے میں کیا ظاہر کرتا ہے؟
