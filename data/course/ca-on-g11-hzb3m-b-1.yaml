  title:
    en: Miskawayh and moral philosophy
    ar: مسكويه وفلسفة الأخلاق
    ur: مسکویہ اور اخلاقی فلسفہ
  text:
    en: "Abu al-Qasim Imami, the editor of Tajarib al-umam, describes Miskawayh as a moral philosopher and historian of the Buyid age. He writes that Miskawayh's biographers described him as sage, theologian, philosopher and moralist, and that he was called the Third Teacher, said to be for his part in rebuilding the practical branch of Greek philosophy, moral philosophy. The museum's record of him is a biography and sets out no big question that he asked. Which big question would a moral philosopher set out to answer?"
    ar: "يصف أبو القاسم إمامي، محقق «تجارب الأمم»، مسكويه بأنه فيلسوف في الأخلاق ومؤرخ عاش في العصر البويهي، ويذكر أن المترجمين له وصفوه بالحكيم والمتكلم والفيلسوف والأخلاقي، ولُقّب «المعلم الثالث»، ويقال إن ذلك لدوره في إعادة بناء الفلسفة اليونانية في فرعها العملي، أي فلسفة الأخلاق. وسجل المتحف عنه ترجمة لحياته ولا يعرض سؤالًا كبيرًا طرحه. أي سؤال كبير يتصدى له فيلسوف الأخلاق؟"
    ur: "«تجارب الامم» کے محقق ابو القاسم امامی مسکویہ کو عہدِ بویہی کا اخلاقی فلسفی اور مؤرخ بتاتے ہیں، اور لکھتے ہیں کہ ان کے سوانح نگاروں نے انہیں حکیم، متکلم، فلسفی اور ماہرِ اخلاق کہا، اور انہیں «معلمِ ثالث» کا لقب ملا، جس کی وجہ کہا جاتا ہے کہ یونانی فلسفے کی عملی شاخ، یعنی اخلاقی فلسفے، کی تعمیرِ نو میں ان کا حصہ تھا۔ میوزیم میں ان کا ریکارڈ ان کی سوانح ہے اور اس میں کوئی بڑا سوال بیان نہیں ہوا جو انہوں نے اٹھایا ہو۔ ایک اخلاقی فلسفی کون سا بڑا سوال اٹھاتا ہے؟"
  entity: person/ibn-miskawayh
