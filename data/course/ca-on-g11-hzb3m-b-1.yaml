- position: after
  kind: reflection
  title:
    en: A question about human choice
    ar: سؤال عن اختيار الإنسان
    ur: انسانی اختیار کے بارے میں ایک سوال
  text:
    en: In Duha al-Islam, Ahmad Amin presents ilm al-kalam as a new science that took shape in the early Abbasid period. Among its internal causes he lists that the Qur'an reported the views of those who denied prophethood and resurrection, and questions of predestination and free will. Which big question about human choice do those words name?
    ar: يعرض أحمد أمين في «ضحى الإسلام» علم الكلام علمًا جديدًا تشكل في العصر العباسي الأول. ومن أسبابه الداخلية عنده أن القرآن حكى عن منكري النبوات والحشر ومسائل الجبر والاختيار. أي سؤال كبير عن اختيار الإنسان تسميه هذه العبارة؟
    ur: احمد امین «ضحی الاسلام» میں علمِ کلام کو ایک نیا علم قرار دیتے ہیں جو ابتدائی عباسی دور میں تشکیل پایا۔ اس کے اندرونی اسباب میں وہ یہ گنواتے ہیں کہ قرآن نے نبوتوں اور حشر کا انکار کرنے والوں کے اقوال اور جبر و اختیار کے مسائل بیان کیے۔ یہ الفاظ انسانی اختیار کے بارے میں کس بڑے سوال کا نام لیتے ہیں؟
  entity: concept/ilm-al-kalam
  sources:
  - source/duha-islam
