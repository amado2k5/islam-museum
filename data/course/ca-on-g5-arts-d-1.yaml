  title:
    en: A script named for a city
    ar: خط سُمّي باسم مدينة
    ur: ایک شہر کے نام پر رکھا گیا خط
  text:
    en: Maryam Ekhtiar counts the rise of Kufic in the late seventh to early eighth century as a major development in the history of Islamic calligraphy. The name comes from Kufa, but it denotes a category of angular scripts with many variations, not necessarily a place of production. It is marked by clarity, generous spacing and the horizontal extension of letters along the baseline. What can a style's name tell you, and what can it hide?
    ar: تعدّ مريم اختيار ظهور الخط الكوفي وانتشاره بين أواخر القرن السابع وأوائل الثامن الميلادي تطورًا كبيرًا في تاريخ الخط الإسلامي. والاسم مأخوذ من الكوفة، لكنه يدل على فئة من الخطوط الزاوية لها صور كثيرة، لا على مكان صنعها بالضرورة. ويتميز بالوضوح وسعة المسافات ومدّ الحروف أفقيًا على السطر. ماذا يخبرك اسم الأسلوب، وماذا قد يخفي؟
    ur: مریم اختیار کے نزدیک کوفی خط کا ابھرنا اور پھیلنا ساتویں صدی کے آخر اور آٹھویں کے آغاز میں اسلامی خطاطی کی تاریخ کی ایک بڑی پیش رفت ہے۔ نام کوفہ سے لیا گیا ہے، لیکن یہ زاویہ دار خطوط کے ایک گروہ کو ظاہر کرتا ہے جس کی بہت سی صورتیں ہیں، ضروری نہیں کہ جائے تیاری کو۔ اس کی پہچان وضاحت، کشادہ فاصلے اور حروف کا سطر پر افقی کھنچاؤ ہے۔ کسی اسلوب کا نام آپ کو کیا بتاتا ہے، اور کیا چھپا سکتا ہے؟
  entity: concept/kufic-script
  sources:
  - source/ekhtiar-how-to-read-islamic-calligraphy-2018
- position: after
  kind: invention
  title:
    en: A legend and the scholars' account
    ar: رواية ورأي الباحثين
    ur: ایک روایت اور محققین کا بیان
  text:
    en: Ekhtiar reports a legend that Mir Ali Tabrizi invented nasta'liq after Ali ibn Abi Talib, traditionally regarded as the first calligrapher in Islam, appeared to him in a dream and told him to make letters like the wings of flying geese. Scholars, however, hold that it developed in the second half of the fourteenth century in Shiraz and Tabriz as a gradual merging of naskh and ta'liq. How do the legend and the scholars' account differ in what they explain?
    ar: تذكر مريم اختيار أن الرواية تنسب اختراع النستعليق إلى مير علي التبريزي ⁦(نشط أواخر القرن الرابع عشر)⁩ بعد أن رأى علي بن أبي طالب، الذي يُعدّ تقليديًا أول خطاط في الإسلام، في المنام، فأمره أن يصنع حروفًا تشبه أجنحة الإوز الطائر. أما الباحثون فيرون أن النستعليق تطور في النصف الثاني من القرن الرابع عشر في شيراز وتبريز من اندماج تدريجي بين النسخ والتعليق، فجمع استواء النسخ ووضوحه إلى ضربات التعليق الواسعة. بماذا تختلف الرواية عن رأي الباحثين فيما تفسّره؟
    ur: مریم اختیار بتاتی ہیں کہ ایک روایت نستعلیق کی ایجاد میر علی تبریزی ⁦(چودھویں صدی کے آخر میں سرگرم)⁩ سے منسوب کرتی ہے، اس کے بعد کہ انہوں نے خواب میں علی بن ابی طالب کو دیکھا، جنہیں روایتی طور پر اسلام کا پہلا خطاط مانا جاتا ہے، اور انہوں نے حکم دیا کہ اڑتی ہوئی بطخوں کے پروں جیسے حروف بنائیں۔ محققین کے نزدیک البتہ نستعلیق چودھویں صدی کے دوسرے نصف میں شیراز اور تبریز میں نسخ اور تعلیق کے بتدریج امتزاج سے بنا، اور اس نے نسخ کی ہمواری اور وضاحت کو تعلیق کے وسیع اشاروں سے جوڑا۔ روایت اور محققین کا بیان اس میں کیسے مختلف ہیں کہ وہ کیا سمجھاتے ہیں؟
