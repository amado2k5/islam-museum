    ar: أظهر فهمًا لخصائص التمثيلات المختلفة للعلاقات الخطية وغير الخطية، مستعينًا بأدوات منها البرمجة عند الاقتضاء
    ur: خطی اور غیر خطی تعلقات کی مختلف نمائندگیوں کی خصوصیات کی سمجھ کا مظاہرہ کریں، اوزار استعمال کرتے ہوئے، جن میں مناسب ہونے پر کوڈنگ بھی شامل ہے
