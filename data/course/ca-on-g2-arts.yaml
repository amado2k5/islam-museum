summary:
  en: 'The Ontario Grade 2 Arts course has four strands: Dance, Drama, Music and Visual Arts. The museum maps two of them with three lessons; Dance and Drama have no honest link.'
  ar: 'لمقرر الفنون للصف الثاني في منهاج أونتاريو أربعة محاور: الرقص والدراما والموسيقى والفنون البصرية. ويربط المتحف اثنين منها بثلاثة دروس؛ ولا صلة صادقة له بمحوري الرقص والدراما.'
  ur: 'اونٹاریو نصاب کے دوسری جماعت کے فنون کورس کے چار محور ہیں: رقص، ڈراما، موسیقی اور بصری فنون۔ عجائب گھر ان میں سے دو کو تین اسباق سے جوڑتا ہے؛ رقص اور ڈرامے سے اس کا کوئی صادق ربط نہیں۔'
  es: "El curso de Artes de segundo grado de Ontario tiene cuatro áreas temáticas: Danza, Teatro, Música y Artes Visuales. El museo relaciona dos de ellas con tres lecciones; Danza y Teatro no tienen una conexión clara."
  fr: "Le programme d'arts de 2e année en Ontario comprend quatre volets: danse, théâtre, musique et arts visuels. Le musée en associe deux à trois leçons; la danse et le théâtre n'ont aucun lien direct."
  tr: "Ontario'daki 2. Sınıf Sanat müfredatının dört ana teması vardır: dans, drama, müzik ve görsel sanatlar. Müze, bunlardan ikisini üç dersle ilişkilendiriyor; ancak dans ve drama temalarıyla gerçek bir bağlantı kurmuyor."
  id: "Kurikulum Seni Kelas 2 di Ontario memiliki empat tema utama: tari, drama, musik, dan seni visual. Museum ini menghubungkan dua tema tersebut dengan tiga pelajaran; namun, museum ini tidak membuat hubungan yang nyata dengan tema tari dan drama."
