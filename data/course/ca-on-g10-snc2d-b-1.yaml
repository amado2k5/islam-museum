- position: after
  kind: invention
  title:
    ar: ابن النفيس ومرور الدم عبر الرئتين
    en: Ibn al-Nafis and the blood's way through the lungs
    ur: ابن نفیس اور پھیپھڑوں سے خون کا گزر
  text:
    ar: كتب الطبيب ابن النفيس في القرن السابع الهجري، في شرحه على تشريح قانون ابن سينا، أن الدم لا يعبر من البطين الأيمن إلى البطين الأيسر من مسامّ في الحاجز بينهما كما قال جالينوس، لأن الحاجز هناك مصمت؛ بل يدخل البطين الأيسر من الرئة. ويراه جون وست (2008) أول وصف معروف للدورة الدموية الرئوية. لماذا يحتاج الدم إلى المرور بالرئتين؟
    en: In the thirteenth century the physician Ibn al-Nafis wrote, in his commentary on the anatomy of Ibn Sina's Canon, that blood does not cross from the right ventricle to the left through pores in the wall between them, as Galen had taught, because that wall is solid; it reaches the left ventricle from the lung. John West (2008) calls this the first known description of the pulmonary circulation. Why does the blood need to pass through the lungs?
    ur: تیرھویں صدی میں طبیب ابن نفیس نے ابن سینا کے «القانون» کی تشریح پر اپنی شرح میں لکھا کہ خون دائیں بطن سے بائیں بطن میں ان کے بیچ کی دیوار کے مسامات سے نہیں گزرتا جیسا کہ جالینوس نے کہا تھا، کیونکہ وہ دیوار ٹھوس ہے؛ بلکہ وہ بائیں بطن میں پھیپھڑے سے پہنچتا ہے۔ جون ویسٹ (2008) اسے پھیپھڑوں کی دورانِ خون کا پہلا معلوم بیان قرار دیتے ہیں۔ خون کو پھیپھڑوں سے کیوں گزرنا پڑتا ہے؟
  entity: invention/pulmonary-circulation
  sources:
  - source/west-2008-ibn-al-nafis
