connections:
- position: before
  kind: reflection
  title:
    ar: أعضاء مفردة وأعضاء مركّبة
    en: Simple organs, composite organs
    ur: سادہ اعضاء اور مرکب اعضاء
  text:
    ar: 'في «القانون» يقسم ابن سينا الأعضاء إلى مفردة، كاللحم والعظم والعصب، ومركّبة، كاليد والوجه. ويعدّ من الأعضاء الرئيسة بحسب بقاء الشخص ثلاثة: القلب مبدأ قوة الحياة، والدماغ مبدأ قوة الحس والحركة، والكبد مبدأ قوة التغذية. ويذكر ابن النفيس أنه لم يباشر التشريح بنفسه. كيف يعتمد بعض الأعضاء والأجهزة على بعض؟'
    en: 'In the Canon, Ibn Sina divides organs into simple ones, such as flesh, bone and nerve, and composite ones, such as the hand and the face. Of the principal organs he counts three: the heart, source of the power of life, the brain, of sensation and movement, and the liver, of nutrition. Ibn al-Nafis says he did not dissect himself. How do organs and systems depend on one another?'
    ur: '«القانون» میں ابن سینا اعضاء کو سادہ میں تقسیم کرتے ہیں، جیسے گوشت، ہڈی اور عصب، اور مرکب میں، جیسے ہاتھ اور چہرہ۔ بنیادی اعضاء میں وہ فرد کی بقا کے لحاظ سے تین گنتے ہیں: دل قوتِ حیات کا مبدا، دماغ حس و حرکت کا مبدا، اور جگر تغذیہ کی قوت کا مبدا۔ ابن نفیس بتاتے ہیں کہ انہوں نے خود چیر پھاڑ نہیں کی۔ اعضاء اور نظام ایک دوسرے پر کیسے منحصر ہوتے ہیں؟'
  entity: concept/anatomy
  sources:
