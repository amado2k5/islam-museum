  title:
    en: One city, several communities
    ar: مدينة واحدة وجماعات عدة
    ur: ایک شہر، کئی جماعتیں
  text:
    en: Al-Mubarakpuri writes in The Sealed Nectar that in Medina the Prophet concluded a treaty among the believers of Quraysh and Yathrib and those who followed them, which made the believers one community. He adds that the Prophet agreed with the Jews a treaty leaving them complete freedom in religion and property. The museum's record cautions that the sources preserve only parts of the document and differ on the order and detail of its clauses. What would members of each community need to know about the others?
    ar: يذكر المباركفوري في «الرحيق المختوم» أن النبي عقد في المدينة معاهدة بين المؤمنين من قريش ويثرب ومن تبعهم جعلت المؤمنين أمة واحدة، ويضيف أنه عقد مع اليهود معاهدة تركت لهم مطلق الحرية في الدين والمال. ويحذّر سجل المتحف من أن المصادر لا تحفظ إلا أجزاء من الوثيقة وتختلف في ترتيب بنودها وتفصيلها. ماذا يحتاج أفراد كل جماعة أن يعرفوه عن الجماعات الأخرى؟
    ur: مبارکپوری «الرحیق المختوم» میں لکھتے ہیں کہ مدینہ میں نبی نے قریش اور یثرب کے مومنوں اور ان کے پیروکاروں کے درمیان ایک معاہدہ کیا جس نے مومنوں کو ایک امت بنا دیا۔ وہ مزید لکھتے ہیں کہ آپ نے یہودیوں کے ساتھ ایسا معاہدہ کیا جس میں انہیں دین اور مال کی مکمل آزادی دی گئی۔ عجائب گھر کا اندراج خبردار کرتا ہے کہ ماخذ دستاویز کے صرف کچھ حصے محفوظ رکھتے ہیں اور اس کی شقوں کی ترتیب اور تفصیل میں اختلاف کرتے ہیں۔ ہر جماعت کے افراد کو دوسری جماعتوں کے بارے میں کیا جاننا ضروری ہوگا؟
