  kind: hadith
  title:
    en: What belief asks of a neighbour
    ar: ما يطلبه الإيمان من الجار
    ur: ایمان ہمسائے سے کیا چاہتا ہے
  text:
    en: Sahih Muslim places this report of Anas ibn Malik in its Book of Faith, in the chapter on the evidence that among the qualities of faith is that one loves for his Muslim brother the good he loves for himself. How can a belief held by one person change the way he deals with others?
    ar: يضع صحيح مسلم هذا الحديث عن أنس بن مالك في كتاب الإيمان، في باب الدليل على أن من خصال الإيمان أن يحب المرء لأخيه المسلم ما يحب لنفسه من الخير. كيف يمكن لاعتقاد يحمله شخص أن يغيّر طريقة تعامله مع الآخرين؟
    ur: صحیح مسلم انس بن مالک کی یہ روایت اپنی کتاب الایمان میں اس باب کے تحت رکھتی ہے جو اس پر دلیل ہے کہ ایمان کی خصلتوں میں سے ہے کہ آدمی اپنے مسلمان بھائی کے لیے وہی بھلائی چاہے جو اپنے لیے چاہتا ہے۔ ایک شخص کا رکھا ہوا عقیدہ دوسروں کے ساتھ اس کے برتاؤ کو کیسے بدل سکتا ہے؟
  entity: passage/muslim-0045
