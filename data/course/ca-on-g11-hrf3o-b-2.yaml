summary:
  en: How a city or a country can hold several faiths, how a society marks one of them, why neighbours need to know about each other, and how a belief can change how a person treats others (B1.2, B1.3, B3.4).
  ar: كيف تتسع مدينة أو بلد لأديان عدة، وكيف يُحيي مجتمعٌ ذكرى إحداها، ولماذا يحتاج الجيران إلى معرفة بعضهم، وكيف يغيّر اعتقادٌ طريقة معاملة الإنسان لغيره ⁦(B1.2 وB1.3 وB3.4)⁩.
  ur: ایک شہر یا ملک کئی مذاہب کو کیسے سمو لیتا ہے، ایک معاشرہ ان میں سے کسی کی یاد کیسے مناتا ہے، ہمسایوں کو ایک دوسرے کے بارے میں جاننے کی ضرورت کیوں ہے، اور عقیدہ کسی شخص کے دوسروں سے برتاؤ کو کیسے بدلتا ہے ⁦(B1.2 اور B1.3 اور B3.4)⁩۔
