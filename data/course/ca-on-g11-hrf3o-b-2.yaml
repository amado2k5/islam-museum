  kind: story
  title:
    en: A month to learn about neighbours
    ar: شهر للتعرّف إلى الجيران
    ur: ہمسایوں کو جاننے کا ایک مہینہ
  text:
    en: According to the Government of Canada's page on commemorations, Canadian Islamic History Month falls every October in Canada and was first established in 2007, as a time to recognise, celebrate and reflect on the history, culture and contributions of Muslims in Canada. The federal page presents it as a chance for dialogue and inclusion. Why might a country set aside a month to learn about one community?
    ar: بحسب صفحة حكومة كندا عن المناسبات التذكارية، يقع شهر التاريخ الإسلامي الكندي في أكتوبر من كل عام في كندا، وقد أُنشئ أول مرة عام 2007 مناسبةً للاعتراف بتاريخ المسلمين في كندا وثقافتهم وإسهاماتهم والاحتفاء بها والتأمل فيها. وتقدّمه الصفحة الاتحادية فرصةً للحوار والاحتواء. لماذا قد تخصص دولة شهرًا للتعرّف إلى جماعة واحدة؟
    ur: حکومتِ کینیڈا کے یادگاری مواقع کے صفحے کے مطابق کینیڈین اسلامی تاریخ کا مہینہ کینیڈا میں ہر سال اکتوبر میں آتا ہے اور اسے پہلی بار 2007 میں اس مقصد سے قائم کیا گیا کہ کینیڈا میں مسلمانوں کی تاریخ، ثقافت اور خدمات کو تسلیم کیا جائے، ان کا جشن منایا جائے اور ان پر غور کیا جائے۔ وفاقی صفحہ اسے مکالمے اور شمولیت کا موقع قرار دیتا ہے۔ ایک ملک ایک جماعت کو جاننے کے لیے ایک مہینہ کیوں مخصوص کر سکتا ہے؟
  entity: event/canadian-islamic-history-month
