  title:
    en: A famous musician and his portrait
    ar: موسيقي مشهور وصورته
    ur: ایک مشہور موسیقار اور اس کی تصویر
  text:
    en: Abu al-Hasan Ali ibn Nafi, called Ziryab, was a musician associated with Baghdad, Kairouan and Cordoba. The TDV biography describes training under Ibrahim and Ishaq al-Mawsili, life in Kairouan under the Aghlabid Ziyadat Allah, and settlement with Abd al-Rahman II. Accounts attribute singing instruction and oud refinements to him, but his wider portrait needs older reports distinguished from later idealization. How would you test a famous story?
    ar: أبو الحسن علي بن نافع، المعروف بزرياب، موسيقي ارتبط ببغداد والقيروان وقرطبة. تذكر السيرة تعلمه على إبراهيم الموصلي وإسحاق، ثم حياته بالقيروان في رعاية زيادة الله الأغلبي، واستقراره عند عبد الرحمن الثاني في قرطبة. وتنسب إليه روايات تعليم الغناء وتحسين العود، وتحتاج صورته الواسعة إلى فصل الأخبار القديمة عن السيرة المثالية المتأخرة. كيف تختبر قصة مشهورة؟
    ur: ابو الحسن علی بن نافع، جو زریاب کے نام سے معروف ہیں، ایک موسیقار تھے جن کا تعلق بغداد، قیروان اور قرطبہ سے جڑتا ہے۔ ترکی کے انسائیکلوپیڈیا کی سوانح کے مطابق انہوں نے ابراہیم اور اسحاق موصلی سے سیکھا، قیروان میں اغلبی زیادۃ اللہ کی سرپرستی میں رہے اور عبد الرحمن ثانی کے ہاں بس گئے۔ روایات ان سے گانا سکھانے اور عود میں بہتری کی نسبت کرتی ہیں، مگر ان کی وسیع تصویر میں پرانی خبروں کو بعد کی مثالی سوانح سے الگ کرنا پڑتا ہے۔ آپ کسی مشہور کہانی کو کیسے پرکھیں گے؟
