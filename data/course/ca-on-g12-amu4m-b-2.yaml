  title:
    en: Carrying a devotional song to the world
    ar: حمل فنّ الإنشاد الصوفي إلى العالم
    ur: عقیدت کے گیت کو دنیا تک لے جانا
  text:
    en: Nusrat Fateh Ali Khan, who lived from 1948 to 1997, belonged to a Punjabi Muslim family in which qawwali, the Sufi devotional song of Pakistan and India, had passed down for some six centuries. His father wanted him to be a doctor or an engineer, qawwals then having low standing. He signed with Real World in 1989, reached a wider audience with albums such as Mustt Mustt, and performed in over forty countries. How far can one musician carry a genre?
    ar: ينتمي نصرت فتح علي خان، الذي عاش من 1948 إلى 1997، إلى أسرة بنجابية مسلمة توارثت القوالي، فنّ الإنشاد الصوفي في باكستان والهند، نحو ستة قرون. أراده أبوه طبيبًا أو مهندسًا لتدني مكانة القوالين يومئذ. ووقّع مع Real World في 1989 فاتسع جمهوره بألبومات منها «Mustt Mustt»، وأحيا حفلات في أكثر من أربعين بلدًا. إلى أي مدى يستطيع موسيقي واحد أن يحمل فنًّا؟
    ur: نصرت فتح علی خان، جو 1948 سے 1997 تک زندہ رہے، ایک پنجابی مسلم خاندان سے تھے جس میں قوالی، پاکستان اور ہندوستان کا صوفی عقیدتی گیت، تقریباً چھ صدیوں سے نسل در نسل چلی آ رہی تھی۔ ان کے والد انہیں ڈاکٹر یا انجینئر بنانا چاہتے تھے، کیونکہ قوالوں کا مقام اس وقت پست تھا۔ 1989 میں انہوں نے Real World سے معاہدہ کیا، «Mustt Mustt» جیسے البموں سے ان کے سامعین بڑھے، اور انہوں نے چالیس سے زیادہ ملکوں میں پیشکش کی۔ ایک موسیقار کوئی صنف کہاں تک لے جا سکتا ہے؟
