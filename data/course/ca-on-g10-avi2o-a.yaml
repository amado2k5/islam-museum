summary:
  en: 'Applying the creative process, design and a range of materials, and presenting art works (expectations A1 to A3). The museum maps one lesson: the materials, preparation and showing of works.'
  ar: 'تطبيق عملية الإبداع والتصميم ومواد متنوعة، وعرض الأعمال الفنية ⁦(التوقعات من A1 إلى A3)⁩. ويربط المتحف درسًا واحدًا: المواد وتجهيز الأعمال وعرضها.'
  ur: 'تخلیقی عمل، ڈیزائن اور مختلف مواد کا استعمال، اور فن پاروں کی پیش کش ⁦(توقعات A1 سے A3)⁩۔ میوزیم ایک سبق جوڑتا ہے: مواد، تیاری اور نمائش۔'
  es: "Aplicación del proceso creativo, diseño y variedad de materiales, y presentación de obras de arte (niveles A1 a A3). El museo incluye una lección: materiales, preparación y exhibición de obras."
  fr: "L’application du processus créatif, du design et d’une variété de matériaux, ainsi que la présentation d’œuvres d’art (niveaux A1 à A3) sont abordées. Le musée propose une leçon: les matériaux, la préparation et la présentation des œuvres."
  tr: "Müze, yaratıcı süreci, tasarımı ve çeşitli malzemeleri kullanarak sanat eserlerini (A1'den A3'e kadar projeksiyonlar) sergiliyor. Bu kavramları tek bir ders üzerinden birleştiriyor: malzemeler, çalışma hazırlığı ve sergileme."
  id: "Museum ini menerapkan proses kreatif, desain, dan beragam material, serta memajang karya seni (proyeksi dari A1 hingga A3). Museum ini menghubungkan konsep-konsep tersebut melalui satu pelajaran tunggal: material, persiapan karya, dan pameran."
