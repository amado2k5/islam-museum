expectations:
- code: A1
  text:
    en: apply the creative process to create a variety of art works, individually and/or collaboratively
    ar: طبّق عملية الإبداع لإنتاج مجموعة متنوعة من الأعمال الفنية، فرديًا و/أو تعاونيًا
    ur: تخلیقی عمل کو برت کر مختلف فن پارے بنائیں، انفرادی طور پر اور/یا مل کر
- code: A2
  text:
    en: apply elements and principles of design to create art works for the purpose of self-expression and to communicate ideas, information, and/or messages
    ar: طبّق عناصر التصميم ومبادئه لإنتاج أعمال فنية للتعبير عن الذات ولنقل الأفكار و/أو المعلومات و/أو الرسائل
    ur: ڈیزائن کے عناصر اور اصولوں کو برت کر ایسے فن پارے بنائیں جو اظہارِ ذات اور خیالات، معلومات اور/یا پیغامات کی ترسیل کے لیے ہوں
- code: A3
  text:
    en: produce art works, using a variety of media/materials and traditional and/or emerging technologies, tools, and techniques, and demonstrate an understanding of a variety of ways of presenting their works and the works of others
    ar: أنتج أعمالًا فنية باستعمال مجموعة متنوعة من الوسائط والمواد والتقنيات والأدوات والأساليب التقليدية و/أو الناشئة، وأظهر فهمًا لطرق متنوعة لعرض أعماله وأعمال الآخرين
    ur: مختلف وسائط اور مواد اور روایتی اور/یا ابھرتی ہوئی ٹیکنالوجیوں، اوزاروں اور تکنیکوں سے فن پارے تیار کریں، اور اپنے اور دوسروں کے فن پاروں کو پیش کرنے کے مختلف طریقوں کی تفہیم ظاہر کریں
