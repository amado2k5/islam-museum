  title:
    en: A pump turned by water
    ar: مضخة يديرها الماء
    ur: پانی سے چلنے والا پمپ
  text:
    en: 'Al-Jazari''s book describes a pump driven by flowing water: a stream turns a wheel and gears, and a pin with a slotted rod turns the rotation into back-and-forth motion of the piston rods. What did he add to machines that already existed?'
    ar: 'يصف كتاب الجزري مضخة يحرّكها الماء الجاري: يدير التيار دولابًا وتروسًا، ودبوس بقضيب مشقوق يحوّل الدوران إلى حركة ذهاب وإياب في قضيبَي المكبسين. ماذا أضاف إلى آلات كانت موجودة قبله؟'
    ur: 'الجزری کی کتاب ایک ایسا پمپ بیان کرتی ہے جسے بہتا پانی چلاتا ہے: دھارا ایک پہیے اور دندانے دار پہیوں کو گھماتا ہے، اور شگاف دار سلاخ والی کیل گردش کو پسٹن کی سلاخوں کی آگے پیچھے حرکت میں بدلتی ہے۔ انہوں نے پہلے سے موجود مشینوں میں کیا اضافہ کیا؟'
  entity: invention/jazari-double-piston-pump
