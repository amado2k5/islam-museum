- position: within
  kind: invention
  title:
    en: A word that came from a name
    ar: كلمة خرجت من اسم
    ur: ایک نام سے نکلا ہوا لفظ
  text:
    en: Muhammad ibn Musa al-Khwarizmi wrote a book in Baghdad on reckoning with nine Indian numerals and a zero, through which the Indian numerals and the decimal system entered the Islamic world. Its Arabic original is lost; a Latin translation survives that opens 'Dixit Algorizmi', 'al-Khwarizmi said', and from his name comes the word 'algorithm'. Whose knowledge travelled in this book, and whose hands carried it on?
    ar: كتب محمد بن موسى الخوارزمي في بغداد كتابًا عن الحساب بتسعة أرقام هندية وصفر، دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي. أصله العربي مفقود، وتبقى ترجمة لاتينية تبدأ بعبارة «Dixit Algorizmi» أي «قال الخوارزمي»، ومن اسمه جاءت كلمة «الخوارزمية» في لغات العالم. ما المعرفة التي سافرت في هذا الكتاب، وبأيدي من استمرت؟
    ur: محمد بن موسیٰ الخوارزمی نے بغداد میں نو ہندی اعداد اور صفر کے ساتھ حساب پر ایک کتاب لکھی، جس کے ذریعے ہندی اعداد اور اعشاری نظام اسلامی دنیا میں داخل ہوا۔ اس کا عربی اصل گم ہے؛ ایک لاطینی ترجمہ باقی ہے جو «Dixit Algorizmi» یعنی «الخوارزمی نے کہا» سے شروع ہوتا ہے، اور ان کے نام سے لفظ «الگورتھم» نکلا۔ اس کتاب میں کس کا علم سفر کرتا رہا، اور کن ہاتھوں نے اسے آگے بڑھایا؟
  entity: invention/algorism
  sources:
