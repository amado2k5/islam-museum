  title:
    en: A dark room that tested light
    ar: غرفة مظلمة تختبر الضوء
    ur: روشنی کو پرکھنے والا تاریک کمرہ
  text:
    en: 'In his Book of Optics, Ibn al-Haytham let the light of the sun, the moon, the stars and a fire into a dark room through a small hole, followed it across the opposite wall, and laid a ruler along its path, finding it straight. The museum records this as an improvement: he did not discover that light passes through a hole, but turned a familiar sight into a repeatable test. What did his test add to what people already saw?'
    ar: 'في كتاب المناظر أدخل ابن الهيثم ضوء الشمس والقمر والنجوم والنار إلى غرفة مظلمة من ثقب صغير، وتتبّعه على الجدار المقابل، ووضع مسطرة على مساره فوجده مستقيمًا. ويسجّل المتحف ذلك تحسينًا لا اكتشافًا: لم يكتشف ابن الهيثم أن الضوء يمرّ من ثقب، لكنه حوّل مشهدًا مألوفًا إلى اختبار منظّم قابل للإعادة. ماذا أضاف اختباره إلى ما كان الناس يرونه؟'
    ur: 'اپنی کتاب المناظر میں ابن الہیثم نے سورج، چاند، ستاروں اور آگ کی روشنی ایک چھوٹے سوراخ سے تاریک کمرے میں داخل ہونے دی، سامنے کی دیوار پر اس کا پیچھا کیا اور اس کے راستے پر پیمانہ رکھ کر اسے سیدھا پایا۔ عجائب گھر اسے بہتری کے طور پر درج کرتا ہے، دریافت کے طور پر نہیں: انہوں نے یہ دریافت نہیں کیا کہ روشنی سوراخ سے گزرتی ہے، بلکہ ایک جانے پہچانے منظر کو ترتیب وار، دہرائے جانے والے تجربے میں بدل دیا۔ ان کے تجربے نے اس میں کیا اضافہ کیا جو لوگ پہلے دیکھتے تھے؟'
  entity: invention/camera-obscura
  sources:
