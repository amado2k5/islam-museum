  title:
    en: A singer of today
    ar: مغنية من اليوم
    ur: آج کی ایک گلوکارہ
  text:
    en: Abida Parveen, born in 1954, is a Pakistani singer, composer and musician of Sufi music. Her breakthrough came on Radio Pakistan in 1973 with a Sindhi song. She sings ghazal, thumri, khayal, qawwali and above all kafi, in Urdu, Sindhi, Punjabi, Arabic and Persian. What would you need to find out before you could compare her music with music from the past?
    ar: عابدة پروين، المولودة سنة 1954م، مغنية وملحنة وعازفة باكستانية للموسيقى الصوفية. وكانت انطلاقتها في إذاعة باكستان سنة 1973م بأغنية سندية. وتغني الغزل والثمري والخيال والقوالي، والكافي قبل ذلك كله، بالأردية والسندية والبنجابية والعربية والفارسية. ماذا تحتاج أن تعرف قبل أن تقارن موسيقاها بموسيقى من الماضي؟
    ur: عابدہ پروین، جو 1954ء میں پیدا ہوئیں، صوفی موسیقی کی پاکستانی گلوکارہ، موسیقار اور سازندہ ہیں۔ ان کی شہرت کا آغاز 1973ء میں ریڈیو پاکستان پر ایک سندھی گیت سے ہوا۔ وہ غزل، ٹھمری، خیال، قوالی اور سب سے بڑھ کر کافی اردو، سندھی، پنجابی، عربی اور فارسی میں گاتی ہیں۔ ان کی موسیقی کا ماضی کی موسیقی سے موازنہ کرنے سے پہلے آپ کو کیا معلوم کرنا ہوگا؟
