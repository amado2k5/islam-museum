  id: "Membahas komunitas-komunitas tempat bahasa Arab digunakan dan kebiasaan mereka; dan museum ini melayani siswa kelas B3.1 dan B3.2 dengan satu kata dan dengan kebiasaan memberi salam dan sapaan."
