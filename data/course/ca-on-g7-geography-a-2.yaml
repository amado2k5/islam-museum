  kind: story
  title:
    en: A desert road and its water points
    ar: طريق صحراوي ومناهله
    ur: ایک صحرائی راستہ اور اس کے پانی کے مقام
  text:
    en: 'A stage of Ibn Jubayr''s journey to the pilgrimage: he left Qus on camels with the camel-drivers and reached Aydhab, and the record lists the desert water points on the way, among them al-Hajir, Shaghib and Anqash. Ibn Jubayr''s book states that this road was deadly to pilgrims through thirst. What does a traveller''s list of water points tell you about this desert?'
    ar: 'مرحلة من رحلة ابن جبير إلى الحج: خرج من قوص على الإبل مع الجمّالين ثم وصل عيذاب، ويعدّد السجل مواضع الماء في الطريق، منها الحاجر وشاغب وأنقاش. ويقول كتاب ابن جبير إن هذا الطريق كان مهلكًا للحجاج عطشًا. ماذا تخبرك قائمة مواضع الماء التي دوّنها مسافر عن هذه الصحراء؟'
    ur: 'ابن جبیر کے سفرِ حج کا ایک مرحلہ: وہ قوص سے اونٹوں پر شتربانوں کے ساتھ روانہ ہوئے اور عیذاب پہنچے، اور ریکارڈ راستے کے صحرائی پانی کے مقامات گنواتا ہے، ان میں الحاجر، شاغب اور انقاش شامل ہیں۔ ابن جبیر کی کتاب کہتی ہے کہ یہ راستہ حاجیوں کے لیے پیاس کی وجہ سے ہلاکت خیز تھا۔ ایک مسافر کے لکھے ہوئے پانی کے مقامات کی فہرست اس صحرا کے بارے میں کیا بتاتی ہے؟'
  entity: journey/qus-to-aydhab-jubayr-desert
