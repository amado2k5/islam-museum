label:
  en: How cultures differ and meet
  ar: كيف تختلف الثقافات وكيف تلتقي
  ur: ثقافتیں کیسے مختلف ہوتی ہیں اور کیسے ملتی ہیں
summary:
  en: Asks you to explain how culture produces diverse behaviour, how cultures meeting each other change culture, and what studying other places and groups teaches; the museum offers a birth rite, a translation movement and one scholar among another people.
  ar: يسألك أن تشرح كيف تُنتج الثقافة سلوكاً متنوعاً، وكيف يغيّر التقاء الثقافات الثقافة، وماذا تعلّمنا دراسة أماكن وجماعات أخرى؛ ويقدّم المتحف شعيرة ولادة وحركة ترجمة وعالماً بين شعب آخر.
  ur: آپ سے کہتا ہے کہ بتائیں کہ ثقافت متنوع رویے کیسے پیدا کرتی ہے، ثقافتوں کے ملاپ سے ثقافت کیسے بدلتی ہے، اور دوسری جگہوں اور گروہوں کا مطالعہ کیا سکھاتا ہے؛ عجائب گھر ولادت کی ایک رسم، تحریکِ ترجمہ اور ایک دوسری قوم کے بیچ ایک عالم پیش کرتا ہے۔
