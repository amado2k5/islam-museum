  title:
    en: Al-Biruni among the Indians
    ar: البيروني بين أهل الهند
    ur: بیرونی ہندوستانیوں کے درمیان
  text:
    en: Al-Biruni lived among the Indians, learned their language, took up their sciences, and produced Tahqiq ma li-l-Hind around 1030. The editor of al-Qanun al-Mas'udi cites Sachau, who edited it in 1887, as noting that al-Biruni mastered Sanskrit for the sake of study. What does a student gain by learning another group's language in order to study it?
    ar: أقام البيروني بين أهل الهند وتعلم لغتهم واقتبس علومهم، وأخرج كتابه «تحقيق ما للهند» نحو سنة 1030م. وينقل محقق «القانون المسعودي» عن سخاو، ناشر الكتاب سنة 1887م، أن البيروني أتقن السنسكريتية قصدًا للدراسة. ماذا يكسب الدارس إذا تعلّم لغة جماعة ما ليدرسها؟
    ur: بیرونی ہندوستانیوں کے درمیان رہے، ان کی زبان سیکھی، ان کے علوم حاصل کیے، اور تقریباً 1030ء میں «تحقیق ما للہند» لکھی۔ «القانون المسعودی» کے محقق سخاؤ کا حوالہ دیتے ہیں، جنہوں نے اسے 1887ء میں شائع کیا، کہ بیرونی نے مطالعے کی غرض سے سنسکرت پر عبور حاصل کیا۔ جب کوئی طالب علم کسی گروہ کی زبان اس کے مطالعے کے لیے سیکھتا ہے تو اسے کیا حاصل ہوتا ہے؟
  entity: person/al-biruni-muhammad-ibn-ahmad
