  title:
    en: The Abbasid translation movement
    ar: حركة الترجمة في العصر العباسي
    ur: عباسی دور کی تحریکِ ترجمہ
  text:
    en: The translation movement was the effort to render the books of ancient philosophy and science into Arabic in the Abbasid period. Ibn al-Nadim reports from Abu Sulayman al-Mantiqi that the Banu Shakir paid translators about five hundred dinars a month. Al-Jahiz holds that poetry cannot be carried over, since its metre is broken and its beauty lost. What is gained and what is lost when ideas cross a language?
    ar: حركة الترجمة هي جهد نقل كتب الفلسفة والعلوم القديمة إلى العربية في العصر العباسي. وينقل ابن النديم عن أبي سليمان المنطقي أن بني شاكر كانوا يعطون النقلة نحو خمسمائة دينار في الشهر. ويرى الجاحظ أن الشعر لا يُترجم، فإذا حُوّل تقطع نظمه وبطل وزنه وذهب حسنه. ماذا يُكسب وماذا يضيع حين تعبر الأفكار إلى لغة أخرى؟
    ur: 'ترجمے کی تحریک عباسی دور میں فلسفے اور قدیم علوم کی کتابوں کو عربی میں منتقل کرنے کی کوشش ہے۔ ابن النديم ابو سلیمان المنطقی سے نقل کرتے ہیں کہ بنو شاکر مترجمین کو تقریباً پانچ سو دینار ماہانہ دیتے تھے۔ جاحظ کی رائے ہے کہ شعر کا ترجمہ ممکن نہیں: منتقل ہوتے ہی اس کا وزن ٹوٹ جاتا اور حسن جاتا رہتا ہے۔ جب خیالات ایک زبان سے دوسری میں جاتے ہیں تو کیا ملتا ہے اور کیا کھو جاتا ہے؟'
