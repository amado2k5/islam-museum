  title:
    en: One birth rite, different customs
    ar: عقيقة المولود بين عادات مختلفة
    ur: 'نومولود کا عقیقہ: مختلف رواج'
  text:
    en: The Encyclopaedia of Islam defines the 'akika as the sacrifice on the seventh day after a child's birth, on which it is recommended to slaughter two rams or two he-goats for a boy and, for a girl, one of these according to the Shafi'is, but one animal for either sex according to the Malikis. Doughty observed it in the Arabian desert only at the birth of a boy. What varies here, and what stays the same?
    ar: تعرّف موسوعة الإسلام العقيقة بأنها الذبيحة في اليوم السابع من ولادة الطفل، ويُستحب فيه أن تُذبح شاتان أو تيسان عن الغلام، وعن الجارية واحدة منهما عند الشافعية، أما عند المالكية فذبيحة واحدة عن الذكر والأنثى. ويذكر دوتي أنها في الصحراء العربية لا تُقام إلا عند ولادة الغلام. ما الذي يختلف هنا وما الذي يبقى؟
    ur: 'انسائیکلوپیڈیا آف اسلام عقیقہ کی تعریف بچے کی پیدائش کے ساتویں دن کی ذبیحہ کے طور پر کرتا ہے؛ اس دن ذبیحہ کرنا مستحب ہے: لڑکے کے لیے دو بکرے یا دو بکرے کے بچے، اور لڑکی کے لیے شافعی مسلک کے مطابق ان میں سے ایک، جبکہ مالکی مسلک کے مطابق دونوں صورتوں میں صرف ایک جانور۔ ڈاؤتی نے لکھا ہے کہ عرب صحرا میں یہ صرف لڑکے کی پیدائش پر کیا جاتا ہے۔ یہاں کیا بدلتا ہے اور کیا باقی رہتا ہے؟'
