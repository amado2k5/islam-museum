connections:
- position: before
  kind: invention
  title:
    ar: ضعف الضلع وحجم المخروط
    en: Doubling a side, and the volume of a cone
    ur: ضلع دگنا کرنا اور مخروط کا حجم
  text:
    ar: يقول الخوارزمي في باب المساحة إن المربع المتساوي الأضلاع الذي ضلعه اثنان أربعة أمثال سطح الذراع في الذراع، وإن المربع الذي ضلعه نصف ذراع ربع ذلك السطح. ويقول إن المخروط المحدد الرأس تكسيره ثلث تكسير أسفله في عموده، وإن المخروط المقطوع يُكمل حتى يصير محدداً ثم يُطرح منه ما زيد. ماذا يحدث للمساحة حين يتضاعف الضلع؟
    en: In his mensuration chapter al-Khwarizmi says that an equal-sided square of side two is four times the area of the cubit-by-cubit square, and a square of side half a cubit is a quarter of it. He gives the volume of a pointed cone or pyramid as a third of its base times its height, and says a truncated one is completed to a point and the added part subtracted. What happens to an area when a side doubles?
    ur: اپنے باب مساحت میں خوارزمی کہتے ہیں کہ برابر اضلاع کا مربع جس کا ضلع دو ہو، ذراع ضرب ذراع والے رقبے کا چار گنا ہے، اور جس کا ضلع آدھا ذراع ہو وہ اس کا چوتھائی ہے۔ وہ نوکدار مخروط یا ہرم کا حجم اس کے قاعدے کا تہائی ضرب اس کی بلندی بتاتے ہیں، اور کٹے ہوئے کو نوک تک پورا کر کے بڑھایا ہوا حصہ گھٹانے کو کہتے ہیں۔ جب ضلع دگنا ہو تو رقبے کے ساتھ کیا ہوتا ہے؟
  entity: concept/ilm-al-misaha
  sources:
  - source/khwarizmi-jabr-cairo-1939
- position: after
  kind: invention
  title:
    ar: تكبير الأطوال وتكبير المساحة
    en: Scaling lengths and scaling area
    ur: لمبائیوں کو بڑا کرنا اور رقبے کا بڑھنا
  text:
    ar: في قياس الكاشي لسطح المقرنص يقول السجل إن تكبير كل طول مرتين يكبر المساحة أربعاً، وإن وحدات الشكل والتكبير جزء من صحة الجواب. ماذا يحدث لمساحة شكل لو ضاعفنا ضلعه؟
    en: On al-Kashi's way of measuring the surface of muqarnas, the record says that doubling every length quadruples the area, and that scale and units are part of the mathematical answer. What would happen to the area of a shape if its side were doubled?
    ur: مقرنص کی سطح ناپنے کے کاشی کے طریقے پر ریکارڈ کہتا ہے کہ ہر لمبائی کو دگنا کرنے سے رقبہ چار گنا ہو جاتا ہے، اور یہ کہ پیمانہ اور اکائیاں ریاضیاتی جواب کا حصہ ہیں۔ اگر کسی شکل کا ضلع دگنا کر دیا جائے تو اس کے رقبے کا کیا ہوگا؟
