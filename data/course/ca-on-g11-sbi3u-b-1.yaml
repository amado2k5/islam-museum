  title:
    en: Not everything that flies is a bird
    ar: ليس كل ما طار طيراً
    ur: جو اڑے وہ سب پرندہ نہیں
  text:
    en: 'Al-Jahiz divides the world: bodies are inanimate or growing, the growing are animals and plants, and animals walk, fly, swim or creep. He notes that not everything that flies on two wings is a bird: locusts, bees and flies fly but are not called birds. The bat is reckoned among birds though featherless; the ostrich has feathers but is not a bird. He says he follows the names already known in the language. Which traits does he rely on?'
    ar: 'يضع الجاحظ قسمة للعالم: الأجسام جماد ونامٍ، والنامي حيوان ونبات، والحيوان ما يمشي وما يطير وما يسبح وما ينساح. وينبه على أن ليس كل ما طار بجناحين طيراً، فالجراد والنحل والذباب تطير ولا تسمى طيراً، وأن الخفاش من الطير مع أنه بلا ريش، والنعامة ذات ريش وليست من الطير. ويقول إنه يتبع الأسماء المعروفة عند أهل هذه اللغة. بأي صفات يستعين؟'
    ur: 'جاحظ دنیا کی ایک تقسیم رکھتے ہیں: اجسام بے جان یا نمو پانے والے ہیں، نمو پانے والے حیوان اور نبات ہیں، اور حیوان وہ ہے جو چلتا، اڑتا، تیرتا یا رینگتا ہے۔ وہ توجہ دلاتے ہیں کہ جو دو پروں سے اڑے وہ سب پرندہ نہیں: ٹڈی، شہد کی مکھی اور مکھی اڑتی ہیں مگر پرندہ نہیں کہلاتیں، اور چمگادڑ پروں کے بغیر بھی پرندوں میں گنی جاتی ہے جبکہ شتر مرغ کے پر ہیں مگر وہ پرندہ نہیں۔ وہ کہتے ہیں کہ وہ اس زبان والوں کے معروف ناموں کی پیروی کرتے ہیں۔ وہ کن صفات پر انحصار کرتے ہیں؟'
