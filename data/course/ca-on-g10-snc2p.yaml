summary:
  en: 'The Ontario Grade 10 applied Science course SNC2P has five strands: investigation skills and careers, Biology, Chemistry, Earth and Space Science, and Physics. The museum maps four of them with seven lessons; Earth and Space Science, on climate change, has no honest link.'
  ar: 'لمقرر العلوم التطبيقي SNC2P للصف العاشر في أونتاريو خمسة محاور: مهارات الاستقصاء والمهن، والأحياء، والكيمياء، وعلوم الأرض والفضاء، والفيزياء. ويربط المتحف أربعة منها بسبعة دروس؛ ولا صلة صادقة له بعلوم الأرض والفضاء، وهي عن تغيّر المناخ.'
  ur: 'اونٹاریو کے دسویں جماعت کے عملی سائنس کورس SNC2P کے پانچ محور ہیں: تفتیشی مہارتیں اور پیشے، حیاتیات، کیمیا، زمین اور خلا کی سائنس، اور طبیعیات۔ عجائب گھر ان میں سے چار کو سات اسباق سے جوڑتا ہے؛ زمین اور خلا کی سائنس، جو موسمیاتی تبدیلی پر ہے، کا کوئی صادق ربط نہیں۔'
