summary:
  en: 'The Ontario Grade 8 Mathematics course has six strands: Social-Emotional Learning Skills, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps four of them to five lessons; the skills strand names no subject matter.'
  ar: 'لمقرر الرياضيات للصف الثامن في أونتاريو ستة محاور: مهارات التعلم الاجتماعي العاطفي، والعدد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. ويربط المتحف أربعة منها بخمسة دروس؛ أما محور المهارات فلا يسمّي مادة علمية.'
  ur: 'اونٹاریو کے آٹھویں جماعت ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں، عدد، الجبر، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ عجائب گھر ان میں سے چار کو پانچ اسباق سے جوڑتا ہے؛ مہارتوں کا محور کوئی موضوعی مادہ نہیں بتاتا۔'
