summary:
  en: 'The Ontario Grade 8 Mathematics course has six strands: Social-Emotional Learning Skills, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps four of them to five lessons; the skills strand names no subject matter.'
  ar: 'لمقرر الرياضيات للصف الثامن في أونتاريو ستة محاور: مهارات التعلم الاجتماعي العاطفي، والعدد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. ويربط المتحف أربعة منها بخمسة دروس؛ أما محور المهارات فلا يسمّي مادة علمية.'
  ur: 'اونٹاریو کے آٹھویں جماعت ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں، عدد، الجبر، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ عجائب گھر ان میں سے چار کو پانچ اسباق سے جوڑتا ہے؛ مہارتوں کا محور کوئی موضوعی مادہ نہیں بتاتا۔'
  es: "El curso de matemáticas de octavo grado de Ontario consta de seis áreas temáticas: Habilidades de aprendizaje socioemocional, Números, Álgebra, Datos, Percepción espacial y Alfabetización financiera. El museo asigna cuatro de ellas a cinco lecciones; el área de habilidades no especifica ningún tema."
  fr: "Le programme de mathématiques de 8e année de l'Ontario comporte six volets: compétences socio-émotionnelles, nombres, algèbre, données, repérage spatial et littératie financière. Le musée associe quatre de ces volets à cinq leçons; le volet « compétences » ne mentionne aucun sujet."
  tr: "Ontario'daki sekizinci sınıf matematik müfredatı altı modülden oluşmaktadır: sosyal-duygusal öğrenme becerileri, sayılar, cebir, veri, mekansal farkındalık ve finansal okuryazarlık. Müze, bunlardan dördünü beş dersle ilişkilendiriyor; beceri modülü bir ders olarak belirlenmemiştir."
  id: "Kurikulum matematika kelas delapan di Ontario memiliki enam modul: keterampilan belajar sosial-emosional, angka, aljabar, data, kesadaran spasial, dan literasi keuangan. Museum ini menghubungkan empat modul tersebut dengan lima pelajaran; modul keterampilan tidak ditetapkan sebagai mata pelajaran tersendiri."
