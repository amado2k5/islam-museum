  title:
    en: The botanist of the marketplace
    ar: عالم نبات السوق
    ur: 'بازار کا ماہر نباتات'
  text:
    en: Ibn al-Baytar of Malaga walked markets and mountainsides recording plants; his compendium listed about 1,400 plants and drugs. Classification began with people who looked very, very carefully.
    ar: كان ابن البيطار المالقي يجوب الأسواق والجبال يدوّن النباتات، وأحصى معجمه نحو 1400 نبات ودواء؛ فالتصنيف بدأ بأناس تأملوا بعمق شديد.
    ur: 'مالاگہ کا ابن البیطار بازاروں اور پہاڑی دامنوں میں گھومتا اور پودے درج کرتا رہا؛ اس کے معجم میں تقریباً 1400 پودے اور ادویات ہیں۔ درجہ بندی ان لوگوں سے شروع ہوئی جنہوں نے بہت بہت غور سے دیکھا۔'
  entity: person/ibn-al-baytar
  sources:
