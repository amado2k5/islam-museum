  title:
    en: Naming the living world today
    ar: تسمية عالم الأحياء اليوم
    ur: 'آج جاندار دنیا کے نام رکھنا'
  text:
    en: Taxonomists, herbarium keepers and field botanists across the Muslim world — from Morocco to Indonesia — still do this work. Naming a species is the first step toward protecting it.
    ar: ما زال علماء التصنيف وأمناء المعشبات وعلماء النبات الميدانيون في العالم الإسلامي — من المغرب إلى إندونيسيا — يقومون بهذا العمل؛ فتسمية النوع خطوة أولى نحو حمايته.
    ur: 'مغرب سے انڈونیشیا تک اسلامی دنیا کے درجہ بندی ماہرین، نمونہ گاہوں کے نگہبان اور میدانی ماہرینِ نباتات آج بھی یہی کام کرتے ہیں۔ کسی نوع کا نام رکھنا اس کی حفاظت کا پہلا قدم ہے۔'
