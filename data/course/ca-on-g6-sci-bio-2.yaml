  title:
    en: Walk, fly, swim or creep
    ar: يمشي أو يطير أو يسبح أو ينساح
    ur: چلنے والے، اڑنے والے، تیرنے والے، رینگنے والے
  text:
    en: 'Before the kinds of animals, al-Jahiz sets out a division of the world: bodies are in sum inanimate or growing; the growing are animals and plants; animals walk, fly, swim or creep; and those that walk are humans, beasts, predators and vermin. He says he follows the names established and known among the people of this language, singling out what they single out and grouping what they group. What would you sort the living things around you by?'
    ar: 'قبل الدخول في أصناف الحيوان يضع الجاحظ في «كتاب الحيوان» قسمة للعالم: الأجسام في الجملة جماد ونامٍ، والنامي حيوان ونبات، والحيوان ما يمشي وما يطير وما يسبح وما ينساح، والماشي ناس وبهائم وسباع وحشرات. ويقول إنه يتبع في ذلك الأسماء القائمة المعروفة عند أهل هذه اللغة، فيُفرد ما أفردوا ويجمع ما جمعوا. فبأي صفة تقسّم أنت الكائنات التي تراها حولك؟'
    ur: 'جانداروں کی اقسام سے پہلے جاحظ «کتاب الحیوان» میں عالم کی ایک تقسیم پیش کرتے ہیں: اجسام مجموعی طور پر جماد یا نامی ہیں؛ نامی حیوان اور نبات ہیں؛ حیوان چلنے والا، اڑنے والا، تیرنے والا یا رینگنے والا ہے؛ اور چلنے والے انسان، چوپائے، درندے اور حشرات ہیں۔ وہ کہتے ہیں کہ اس میں وہ اس زبان والوں کے ہاں قائم اور معروف ناموں کی پیروی کرتے ہیں، جسے انہوں نے الگ رکھا اسے الگ اور جسے جمع کیا اسے جمع رکھتے ہیں۔ آپ اپنے آس پاس کے جانداروں کو کس صفت سے بانٹیں گے؟'
  entity: work/kitab-al-hayawan
  sources:
  - source/hayawan-jahiz-ilmiyya-2003-v1
- position: within
  kind: object
  title:
    en: Feathers do not settle it
    ar: الريش لا يحسم
    ur: پر فیصلہ نہیں کرتے
  text:
    en: Al-Jahiz then divides birds into predators, grazers and swarming insects, and tells predators armed with talons, such as the eagle, from those armed with beaks, such as vultures and crows. He notes that the bat is reckoned among birds though featherless, that the ostrich has feathers but is not a bird, and that not everything that swims is a fish. Which feature would you trust to place an animal in its group, and why?
    ar: ثم يقسم الجاحظ الطير إلى سباع وبهائم وهمج، ويفرّق بين السباع ذوات المخالب كالعقاب وذوات المناقير كالنسور والرخم والغربان. وينبه على أن الخفاش من الطير مع أنه بلا ريش، وأن النعامة ذات ريش وليست من الطير، وأن ليس كل عائم سمكة. فأي صفة تثق بها لتضع حيوانًا في مجموعته، ولماذا؟
    ur: پھر جاحظ پرندوں کو درندوں، چرندوں اور ہمج میں تقسیم کرتے ہیں، اور پنجوں والے درندوں جیسے عقاب اور چونچوں والے جیسے گدھ اور کوے میں فرق کرتے ہیں۔ وہ تنبیہ کرتے ہیں کہ چمگادڑ بے پر ہونے کے باوجود پرندوں میں ہے، شتر مرغ پر رکھتا ہے مگر پرندہ نہیں، اور ہر تیرنے والا مچھلی نہیں۔ کسی جانور کو اس کے گروہ میں رکھنے کے لیے آپ کس صفت پر بھروسا کریں گے، اور کیوں؟
