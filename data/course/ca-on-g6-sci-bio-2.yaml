  title:
    en: 'One plant, many names'
    ar: 'نبات واحد وأسماء كثيرة'
    ur: 'ایک پودا، کئی نام'
  text:
    en: 'One plant can have several names; one name can denote different things. In his Compendium of Simples, Ibn al-Baytar assembled earlier authors'' descriptions, circulating names and his experience in an alphabetical reference. Iranica distinguishes about 1,422 substantive simples from 931 short synonym entries, not 2,353 independent plant species. How does a list help you when two names point to the same plant?'
    ar: 'قد يحمل النبات أسماء كثيرة، وقد يحمل الاسم الواحد أشياء مختلفة. في «الجامع للمفردات» وضع ابن البيطار أوصاف المؤلفين السابقين والأسماء المتداولة وخبرته في مرجع ألفبائي. وتوضح إيرانيكا أن عدده يضم نحو 1422 مادة أصلية و931 مدخلاً قصيراً للأسماء المترادفة، لا 2353 نوعاً نباتياً مستقلاً. كيف تعينك قائمة كهذه حين يشير اسمان إلى نبات واحد؟'
    ur: 'ایک پودے کے کئی نام ہو سکتے ہیں، اور ایک نام مختلف چیزوں کے لیے بھی آ سکتا ہے۔ «الجامع للمفردات» میں ابن البیطار نے پہلے مؤلفین کے بیانات، رائج ناموں اور اپنے تجربے کو حروفِ تہجی کی ترتیب میں ایک مرجع کی صورت میں جمع کیا۔ ایرانیکا کے مطابق اس میں تقریباً 1422 اصل مفرد مواد اور 931 مترادف ناموں کے مختصر اندراجات ہیں، 2353 الگ پودوں کی انواع نہیں۔ ایسی فہرست آپ کی کیسے مدد کرتی ہے جب دو نام ایک ہی پودے کی طرف اشارہ کریں؟'
  entity: invention/ibn-baytar-comparative-materia-medica
  sources:
