  title:
    en: One book
    ar: كتاب واحد
    ur: ایک کتاب
  text:
    en: The Qur'an is the holy book of Islam, which Muslims believe was sent down to the Prophet Muhammad. It contains 114 suras and 6,236 verses, in the Hafs transmission, as in the Tanzil project text. The museum does not write out the verses on its pages. What does it mean for a community to hold one book?
    ar: القرآن هو الكتاب المقدس للإسلام، ويعتقد المسلمون أنه أُنزل على النبي محمد. وفيه 114 سورة و6236 آية في رواية حفص كما في نص مشروع تنزيل. ولا يكتب المتحف الآيات على صفحاته. ماذا يعني أن تحتفظ جماعة بكتاب واحد؟
    ur: قرآن اسلام کی مقدس کتاب ہے جس کے بارے میں مسلمانوں کا اعتقاد ہے کہ وہ نبی محمد پر نازل کی گئی۔ اس میں 114 سورتیں اور 6236 آیات ہیں، روایتِ حفص میں، جیسا کہ تنزیل منصوبے کے متن میں ہے۔ عجائب گھر اپنے صفحات پر آیات نہیں لکھتا۔ ایک جماعت کا ایک کتاب کو تھامے رکھنا کیا معنی رکھتا ہے؟
  entity: work/quran
