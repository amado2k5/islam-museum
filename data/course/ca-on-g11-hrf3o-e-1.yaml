- position: within
  kind: hadith
  title:
    en: What is handed on by report
    ar: ما يُنقل بالرواية
    ur: جو روایت سے آگے پہنچایا جاتا ہے
  text:
    en: Hadith is what is reported from the Prophet in word, deed, tacit approval or description, reaching us through a chain of transmission, the sanad, that ends with him. How does a teaching passed on by report differ from a book?
    ar: الحديث ما يُنقل عن النبي من قول أو فعل أو تقرير أو وصف، ويصلنا بسلسلة نقل، هي السند، تنتهي إليه. بمَ يختلف تعليم متناقل بالرواية عن كتاب؟
    ur: حدیث وہ ہے جو نبی سے قول، فعل، تقریر یا وصف کی صورت میں نقل ہوا ہو اور ہم تک سند، یعنی نقل کے سلسلے، سے پہنچا ہو جو ان پر ختم ہوتا ہے۔ روایت سے آگے پہنچنے والی تعلیم ایک کتاب سے کیسے مختلف ہے؟
  entity: concept/al-hadith-al-nabawi
