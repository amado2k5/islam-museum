    en: A tunnel that brings water out
    ar: نفق يُخرج الماء
    ur: پانی باہر لانے والی سرنگ
  text:
    en: 'The record describes a qanat as a gently sloping underground tunnel that brings water out by gravity, with vertical shafts for working, access and maintenance. How does water reach your home: a tap, a well, a river?'
    ar: 'يصف السجل القناة الجوفية بأنها نفق ذو انحدار لطيف يُخرج الماء بالجاذبية، وتتصل به فتحات رأسية للعمل والوصول والصيانة. كيف يصل الماء إلى بيتك: من صنبور أم بئر أم نهر؟'
    ur: 'ریکارڈ قنات کو ہلکی ڈھلان والی زیرِ زمین سرنگ بتاتا ہے جو پانی کو کشش ثقل سے باہر لاتی ہے، اور جس سے کام، رسائی اور دیکھ بھال کے لیے عمودی کنویں جڑے ہوتے ہیں۔ آپ کے گھر تک پانی کیسے پہنچتا ہے: نل سے، کنویں سے یا دریا سے؟'
