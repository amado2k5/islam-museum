    en: A fountain given for all
    ar: سبيل ماء للجميع
    ur: سب کے لیے پانی کی سبیل
  text:
    en: Al-Haddad describes a sabil as a charitable building endowed to give people fresh water every day all year round. Sabils drew their water from wells, pools and springs, or from rain and floods, through channels or pipes hidden in walls. Where do the people of your community get fresh water?
    ar: يصف الحداد السبيل بأنه بناء خيري يُوقف لسقي الناس الماء العذب كل يوم وعلى مدار العام. وكانت الأسبلة تستمد ماءها من الآبار والبرك والعيون أو من الأمطار والسيول بقنوات أو أقصاب مغيبة في الجدران. من أين يحصل أهل مجتمعك على الماء العذب؟
    ur: الحداد سبیل کو ایک فلاحی عمارت بتاتے ہیں جو لوگوں کو سال بھر ہر روز میٹھا پانی پلانے کے لیے وقف کی جاتی تھی۔ سبیلیں اپنا پانی کنوؤں، حوضوں اور چشموں سے، یا بارش اور سیلاب سے، نالیوں یا دیواروں میں چھپی نلیوں کے ذریعے لیتی تھیں۔ آپ کی برادری کے لوگوں کو میٹھا پانی کہاں سے ملتا ہے؟
