summary:
  en: 'The 2022 Ontario Grade 3 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum links parts of four of them to real records.'
  ar: 'مقرر العلوم والتكنولوجيا للصف الثالث في منهاج أونتاريو 2022 له خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، والنظم الحيّة، والمادة والطاقة، والبُنى والآليات، ونظم الأرض والفضاء. ولا يربط المتحف إلا أجزاء من أربعة منها بسجلات حقيقية.'
  ur: 'اونٹاریو نصاب 2022 کے جماعت سوم کے سائنس و ٹیکنالوجی کورس کی پانچ شاخیں ہیں: STEM مہارتیں اور روابط، جاندار نظام، مادہ اور توانائی، ڈھانچے اور میکانزم، اور زمین و خلا کے نظام۔ عجائب گھر ان میں سے چار کے کچھ حصوں کو حقیقی ریکارڈوں سے جوڑتا ہے۔'
