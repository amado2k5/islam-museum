  title:
    en: A ceiling counted by its pieces
    ar: سقف يُحسب بأجزائه
    ur: اجزا سے گنی جانے والی چھت
  text:
    ar: نظم الكاشي في مفتاح الحساب قياس سطح المقرنص، وهو البناء الخلوي المتدرج الذي يربط أجزاء السقف ويزينها. يختار وحدة معيارية، ويعد الأجزاء بحسب أشكالها. وفي التعريف الذي تناقشه الدراسة، الخلية ذات وجهين وسقف، والطبقة تجمع خلايا قواعدها في مستوى أفقي واحد. كم شكلاً تجد في سقف مبني من خلايا؟
    en: In the Key to Arithmetic, al-Kashi organized the measurement of muqarnas, the tiered cellular construction that articulates and decorates ceilings. He selects a module and counts elements by shape. In the definition the study discusses, a cell consists of two facets and a roof, and cells with bases in one horizontal plane form a tier. How many shapes can you find in a ceiling built of cells?
    ur: غیاث الدین کاشی نے «مفتاح الحساب» میں مقرنس کی سطح کا حساب منظم کیا، وہ تہہ دار خانے جو سقف کو جوڑتے اور سجاتے ہیں۔ پہلے معیاری اکائی منتخب، پھر شکل کے مطابق اجزا شمار ہوتے ہیں۔ مطالعے میں نقل تعریف کے مطابق ایک خانہ دو رخوں اور اوپری چھت پر مشتمل ہے، اور جن خانوں کی بنیادیں ایک افقی سطح میں ہوں وہ ایک تہہ بناتے ہیں۔ ایسی چھت میں آپ کتنی شکلیں پہچان سکتے ہیں جو خانوں سے بنی ہو؟
