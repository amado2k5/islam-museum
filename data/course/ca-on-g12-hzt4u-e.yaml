expectations:
- code: E1
  text:
    en: demonstrate an understanding of the main questions in epistemology, and of the positions of major philosophers and schools of philosophy with respect to some of these questions
    ar: أظهر فهمًا للأسئلة الرئيسة في نظرية المعرفة، ولمواقف كبار الفلاسفة والمدارس الفلسفية من بعض هذه الأسئلة
    ur: نظریۂ علم کے بنیادی سوالات اور ان میں سے بعض کے بارے میں بڑے فلسفیوں اور فلسفیانہ مکاتبِ فکر کے مؤقف کی فہم کا مظاہرہ کریں
- code: E2
  text:
    en: demonstrate an understanding of epistemological theories, and evaluate responses to some of the main questions in epistemology by major philosophers and schools of philosophy
    ar: أظهر فهمًا للنظريات المعرفية، وقيّم إجابات كبار الفلاسفة والمدارس الفلسفية عن بعض الأسئلة الرئيسة في نظرية المعرفة
    ur: علمیاتی نظریات کی فہم کا مظاہرہ کریں، اور نظریۂ علم کے بعض بنیادی سوالات پر بڑے فلسفیوں اور فلسفیانہ مکاتبِ فکر کے جوابات کا جائزہ لیں
- code: E3
  text:
    en: demonstrate an understanding of connections between epistemology and other areas of philosophy, other subject areas, and various aspects of society, including everyday life
    ar: أظهر فهمًا للصلات بين نظرية المعرفة وسائر مجالات الفلسفة والمواد الدراسية الأخرى ومختلف جوانب المجتمع، ومنها الحياة اليومية
    ur: نظریۂ علم اور فلسفے کے دیگر شعبوں، دیگر مضامین اور معاشرے کے مختلف پہلوؤں، بشمول روزمرہ زندگی، کے درمیان روابط کی فہم کا مظاہرہ کریں
- code: E4
  text:
    en: use philosophical reasoning skills to develop, communicate, and defend their own responses to epistemological questions
    ar: استخدم مهارات الاستدلال الفلسفي لتطوير إجاباتك الخاصة عن الأسئلة في نظرية المعرفة والتعبير عنها والدفاع عنها
    ur: فلسفیانہ استدلال کی مہارتیں برت کر نظریۂ علم کے سوالات پر اپنے جوابات تشکیل دیں، بیان کریں اور ان کا دفاع کریں
