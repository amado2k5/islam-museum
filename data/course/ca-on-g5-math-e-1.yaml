connections:
- position: within
  kind: invention
  title:
    en: A triangle's area in cubits
    ar: مساحة المثلث بالأذرع
    ur: ہاتھوں میں تکون کا رقبہ
  text:
    en: 'Mensuration is the science of measuring areas and volumes, and al-Khwarizmi gave it a chapter of his Book of al-Jabr and al-Muqabala. In it the area of a triangle is its height times half its base, and triangles are of three kinds: right, acute and obtuse. For an acute triangle with sides of 13, 14 and 15 cubits he gets a height of twelve and an area of eighty-four. Can you draw all three kinds?'
    ar: 'المساحة علم قياس السطوح والأجسام، وقد خصّها الخوارزمي بباب في كتابه الجبر والمقابلة. وفيه مساحة المثلث أن تضرب عموده في نصف قاعدته، والمثلثات ثلاثة أجناس: قائمة وحادة ومنفرجة. وفي مثلث حاد مختلف الأضلاع أطواله 13 و14 و15 ذراعاً يخرج العمود اثني عشر والمساحة أربعة وثمانين. هل تستطيع رسم الأجناس الثلاثة؟'
    ur: 'پیمائش سطحوں اور اجسام کو ناپنے کا علم ہے، اور خوارزمی نے اپنی کتابِ جبر و مقابلہ میں اس کے لیے ایک باب رکھا۔ اس میں تکون کا رقبہ اس کی اونچائی کو آدھے قاعدے سے ضرب دینا ہے، اور تکون تین قسم کے ہیں: قائمہ، حادہ اور منفرجہ۔ 13، 14 اور 15 ہاتھ کے اضلاع والے ایک حادہ تکون میں اونچائی بارہ اور رقبہ چوراسی نکلتا ہے۔ کیا آپ تینوں قسمیں بنا سکتے ہیں؟'
  entity: concept/ilm-al-misaha
