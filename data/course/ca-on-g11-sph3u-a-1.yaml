  text:
    en: Al-Jazari was an engineer and an author on mechanical devices. The record, following the TDV encyclopedia, notes his service to the Artuqids at Amid in 1181–1206 and a book commissioned by Nasir al-Din Mahmud, completed in 1205 according to the entry. It adds that little is known of his life beyond the book's introduction, so his training is not supplied from conjecture. What would you need to know to describe it?
    ar: الجزري مهندس ومؤلف في الحيل. يذكر السجل، عن موسوعة TDV، خدمته للأرتقيين في آمد بين 1181 و1206م وكتابًا كتبه بطلب الأمير ناصر الدين محمود، تؤرخ إتمامه بسنة 1205م. ويضيف أن ما يُعرف عن حياته خارج مقدمة كتابه قليل، فلا يملأ السجل تدريبه من التخمين. ماذا تحتاج أن تعرف لتصفه؟
    ur: جزری ایک انجینئر اور میکانی تدبیروں ⁦(حیل)⁩ پر مصنف تھے۔ ریکارڈ، TDV انسائیکلوپیڈیا کے حوالے سے، آمد میں ارتقیوں کے لیے ان کی خدمت 1181 سے 1206ء تک اور ناصر الدین محمود کے حکم پر لکھی گئی کتاب کا ذکر کرتا ہے، جس کی تکمیل اندراج کے مطابق 1205ء میں ہوئی۔ وہ یہ بھی کہتا ہے کہ کتاب کے مقدمے سے باہر ان کی زندگی کے بارے میں بہت کم معلوم ہے، اس لیے ان کی تربیت قیاس سے نہیں بھری گئی۔ اسے بیان کرنے کے لیے آپ کو کیا جاننا ہوگا؟
