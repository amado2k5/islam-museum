  title:
    en: A dramatist of the Caucasus
    ar: كاتب مسرحي من القوقاز
    ur: قفقاز کا ایک ڈرامہ نگار
  text:
    en: The Encyclopaedia of Islam calls Mirza Fath 'Ali Akhund-zada the first writer of original plays in a Turkish idiom, the Azerbaijani Turkish of the Caucasus. Between 1850 and 1857 he wrote six comedies and a historical-satirical narrative, putting progressive ideas against feudalism, the corruption of justice and superstition. Pupils of the Azerbaijani state schools gave the first performances in the original language at the end of the 1870s. What might a play in a community's own language add?
    ar: تصف دائرة المعارف الإسلامية ميرزا فتح علي آخوندزاده بأنه أول من كتب مسرحيات أصيلة بالتركية، أي الأذربيجانية في القوقاز. وبين 1850 و1857م كتب ست ملاهٍ وحكاية تاريخية هزلية، وضمّنها أفكارًا تقدمية ضد الإقطاع وفساد القضاء والخرافات. وقدّم تلاميذ المدارس الحكومية الأذربيجانية أولى العروض باللغة الأصلية في نهاية سبعينيات القرن التاسع عشر. ماذا قد تضيف مسرحية بلغة جماعتها إلى جمهورها؟
    ur: انسائیکلوپیڈیا آف اسلام میرزا فتح علی آخوند زادہ کو ترکی لہجے، یعنی قفقاز کی آذربائیجانی ترکی، میں اصل ڈرامے لکھنے والا پہلا مصنف قرار دیتا ہے۔ 1850ء اور 1857ء کے درمیان انہوں نے چھ مزاحیہ ڈرامے اور ایک تاریخی طنزیہ حکایت لکھی، جن میں جاگیرداری، انصاف کی بدعنوانی اور توہم پرستی کے خلاف ترقی پسند خیالات رکھے۔ آذربائیجانی سرکاری اسکولوں کے طلبہ نے 1870ء کی دہائی کے آخر میں اصل زبان میں پہلی پیش کشیں کیں۔ کسی جماعت کی اپنی زبان میں ڈرامہ اس کے ناظرین کو کیا دے سکتا ہے؟
