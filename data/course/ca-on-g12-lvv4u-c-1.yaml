  title:
    en: Counting from a reign that was not Alexander's
    ar: عدّ يبدأ بعد الإسكندر
    ur: سکندر کے بعد سے شروع ہونے والی گنتی
  text:
    en: 'Al-Biruni explains that when Alexander died at Babylon his realm was divided in three: Macedonia to his brother Philip Arrhidaeus, Egypt and the West to the Ptolemies, and Syria and Iraq to Antiochus. Seleucus shared rule with Antiochus until he ruled alone, and from then the Greeks began to date. The era bears Alexander''s name, though it starts in the thirteenth year after his death. Where would you mark it on your timeline?'
    ar: 'يبين البيروني أن الإسكندر لما مات ببابل انقسمت مملكته أثلاثاً: مقدونيا لأخيه فيلبس أريدايوس، ومصر والمغرب للبطالسة، والشام والعراق لأنطيوخس. وكان سلوقس يشارك أنطيوخس حتى تفرد بالملك، ومن هناك ابتدأ اليونانيون بالتاريخ، فاشتهر باسم الإسكندر، وإنما هو من السنة الثالثة عشرة من مماته. أين تضع هذا التاريخ على خطك الزمني؟'
    ur: 'بیرونی بتاتے ہیں کہ جب اسکندر بابل میں فوت ہوا تو اس کی سلطنت تین حصوں میں بٹ گئی: مقدونیہ اس کے بھائی فیلبس اریدایوس کو ملا، مصر اور مغرب بطالسہ کو، اور شام و عراق انطیوخس کو۔ سلوقس انطیوخس کے ساتھ شریک رہا یہاں تک کہ اکیلا حکمران بنا؛ وہیں سے یونانیوں نے تاریخ شروع کی، اور یہ اسکندر کے نام سے مشہور ہو گئی حالانکہ یہ اس کی موت کے تیرہویں سال سے ہے۔ آپ اسے اپنی زمانی لکیر پر کہاں رکھیں گے؟'
