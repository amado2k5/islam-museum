  es: "Energía eléctrica: electricidad estática y corriente, circuitos, origen de la energía eléctrica y cómo usarla de forma responsable (niveles de competencia C1 y C2). El museo aún no dispone de registros para esta área temática."
  fr: "Énergie électrique: électricité statique et électrique, circuits, origine de l’énergie électrique et utilisation responsable (objectifs C1 et C2). Le musée ne possède pas encore de documentation sur ce sujet."
  tr: "Elektrik enerjisi: Statik ve akım elektriği ve devreleri, elektrik enerjisi kaynakları ve sorumlu kullanımı, C1 ve C2 beklentileri. Müzede bu bölümün kaydı henüz bulunmamaktadır."
  id: "Energi listrik: Listrik statis dan arus serta rangkaian listrik, sumber energi listrik dan cara menggunakannya secara bertanggung jawab, Harapan C1 dan C2. Museum belum memiliki catatan untuk bagian ini."
