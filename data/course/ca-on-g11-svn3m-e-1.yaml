  title:
    en: Reclaimed water and the mosque
    ar: المياه المستصلحة والمسجد
    ur: دوبارہ قابلِ استعمال پانی اور مسجد
  text:
    en: A question asked about using water reclaimed from household wastewater in mosques for cleaning and ablution. Jordan's General Iftaa Department answered that chemical treatment and physical separation are not enough to deem it pure, noting that Jordanian standard no. 893/2021 does not allow its use for every purpose. It concluded that the water may not be used for ablution, and that cleaning mosques with it should be avoided. This answer decides whether water counts as ritually pure; it is not a test of whether water is safe to drink or use, and the museum gives no safety guidance. How do the two answers differ on what treatment achieves?
    ar: سُئلت دائرة الإفتاء العام الأردنية عن استعمال المياه المستصلحة من مياه الصرف المنزلي في المساجد للتنظيف والوضوء، فأجابت بأن المعالجة الكيميائية والفصل الفيزيائي لا يكفيان للحكم بطهارتها، وذكرت أن المواصفة القياسية الأردنية رقم 893/2021 لا تجيز استعمالها في جميع الأغراض. وخلصت إلى أنه لا يجوز استعمالها في الوضوء، ويجب اجتناب تنظيف المساجد بها. وهذا الجواب يحكم في كون الماء طاهراً طهارة شرعية، وليس اختباراً لسلامة الماء للشرب أو الاستعمال، ولا يقدّم المتحف إرشاداً في السلامة. فبماذا يختلف الجوابان في ما تحققه المعالجة؟
    ur: اردن کے دارالافتاء العام سے گھریلو گندے پانی سے دوبارہ قابلِ استعمال بنائے گئے پانی کو مساجد میں صفائی اور وضو کے لیے استعمال کرنے کے بارے میں پوچھا گیا۔ اس نے جواب دیا کہ کیمیائی عمل اور طبیعی علیحدگی اسے پاک قرار دینے کے لیے کافی نہیں، اور ذکر کیا کہ اردنی معیار نمبر 893/2021 اس کے ہر مقصد میں استعمال کی اجازت نہیں دیتا۔ اس نے نتیجہ نکالا کہ اسے وضو میں استعمال نہیں کیا جا سکتا اور مساجد کی صفائی میں اس سے بچنا چاہیے۔ یہ جواب اس بات کا فیصلہ کرتا ہے کہ پانی شرعی طور پر پاک شمار ہوگا یا نہیں؛ یہ اس بات کا امتحان نہیں کہ پانی پینے یا استعمال کے لیے محفوظ ہے، اور عجائب گھر حفاظت کے بارے میں کوئی رہنمائی نہیں دیتا۔ پانی کو صاف کرنے کے عمل سے کیا حاصل ہوتا ہے، اس بارے میں دونوں جوابوں میں کیا فرق ہے؟
