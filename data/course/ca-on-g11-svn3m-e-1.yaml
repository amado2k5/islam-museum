  title:
    en: Gardens watered with recycled sewage
    ar: حدائق تُروى بمياه مجارٍ مكررة
    ur: ری سائیکل شدہ سیوریج سے سیراب باغات
  text:
    en: A hospital worker asked about gardens watered with recycled sewage and about the fruit of the trees. Ibn Baz answered that once it has been treated until the colour, taste and smell of impurity are gone, it takes the ruling of purity. If traces of impurity remain, he said, it is not to be used for irrigation or anything else, and should be diverted where it harms no one. This answer decides whether water counts as ritually pure (tahara); it is not a test of whether water is safe to drink or use, and the museum gives no safety guidance. What does this answer assume about how treated water is judged?
    ar: سأل عامل في مستشفى عن حدائق تُروى بمياه مجارٍ مكررة وعن ثمار الأشجار. وأجاب ابن باز بأنها إذا كُررت حتى ذهب لون النجاسة وطعمها وريحها صار لها حكم الطهارة. أما إن بقيت فيها آثار النجاسة فلا تُستعمل في سقي ولا غيره، وتُصرف إلى جهة لا تؤذي الناس. وهذا الجواب يحكم في كون الماء طاهراً طهارة شرعية، وليس اختباراً لسلامة الماء للشرب أو الاستعمال، ولا يقدّم المتحف إرشاداً في السلامة. فماذا يفترض هذا الجواب في طريقة الحكم على الماء المعالَج؟
    ur: ایک اسپتال کے کارکن نے ری سائیکل شدہ سیوریج کے پانی سے سیراب باغات اور درختوں کے پھل کے بارے میں پوچھا۔ ابن باز نے جواب دیا کہ جب اسے اس حد تک صاف کر دیا جائے کہ نجاست کا رنگ، ذائقہ اور بو جاتی رہے تو اسے پاکی کا حکم حاصل ہو جاتا ہے۔ اور اگر اس میں نجاست کے آثار باقی ہوں تو اسے آبپاشی یا کسی اور کام میں نہ لایا جائے، اور ایسی جگہ بہا دیا جائے جہاں کسی کو نقصان نہ پہنچے۔ یہ جواب اس بات کا فیصلہ کرتا ہے کہ پانی شرعی طور پر پاک شمار ہوگا یا نہیں؛ یہ اس بات کا امتحان نہیں کہ پانی پینے یا استعمال کے لیے محفوظ ہے، اور عجائب گھر حفاظت کے بارے میں کوئی رہنمائی نہیں دیتا۔ یہ جواب صاف کیے ہوئے پانی کو پرکھنے کے طریقے کے بارے میں کیا فرض کرتا ہے؟
