- position: within
  kind: invention
  title:
    ar: البيت المظلم عند ابن الهيثم
    en: Ibn al-Haytham's dark room
    ur: ابن الہیثم کا تاریک کمرہ
  text:
    ar: في المقالة الأولى من «كتاب المناظر» يُدخل ابن الهيثم ضوء الشمس والقمر والكواكب والنار من ثقب صغير إلى بيت مظلم، ويتأمله على الجدار المقابل. يقطع طريقه بجسم كثيف ويمد عليه مسطرة، فيجده في غاية الاستقامة. وتعدّ موسوعة TDV تجربة الحجرة المظلمة هذه أساسَ آلة التصوير اليوم. كيف يمكن لآلة التصوير أن تفيد من استقامة الضوء؟
    en: In the first book of the Kitab al-Manazir, Ibn al-Haytham lets the light of the sun, the moon, the stars and a fire into a dark room through a small hole, and studies it on the opposite wall. He cuts its path with an opaque body, lays a ruler along it, and finds it perfectly straight. TDV calls this dark-room experiment the basis of today's photographic camera. How might a camera use the straightness of light?
    ur: «کتاب المناظر» کی پہلی مقالے میں ابن الہیثم سورج، چاند، ستاروں اور آگ کی روشنی کو ایک چھوٹے سوراخ سے تاریک کمرے میں آنے دیتے ہیں اور اسے سامنے کی دیوار پر دیکھتے ہیں۔ وہ اس کا راستہ کسی دبیز جسم سے کاٹتے ہیں اور اس پر پیمانہ رکھتے ہیں، اور اسے انتہائی سیدھا پاتے ہیں۔ TDV انسائیکلوپیڈیا اس تاریک کمرے کے تجربے کو آج کے فوٹوگرافک کیمرے کی بنیاد کہتی ہے۔ کیمرا روشنی کی اس سیدھ سے کیسے فائدہ اٹھا سکتا ہے؟
  entity: invention/camera-obscura
  sources:
  - source/manazir-sabra-1983
  - source/tdv-ibnul-heysem
- position: after
  kind: invention
  title:
    ar: كرة الفارسي المائية وقوس قزح
    en: Al-Farisi's water sphere and the rainbow
    ur: فارسی کا آبی کرہ اور قوسِ قزح
  text:
    ar: استبدل كمال الدين الفارسي بالقطرة الصغيرة كرة زجاجية مملوءة بالماء، ليدرس مسار الضوء في نموذج يمكن التحكم فيه. تعرض رسل تجربته في غرفة مظلمة ذات فتحة واحدة، وشرحه للقوس الأساسي بانكسارين بينهما انعكاس داخلي واحد، وللثانوي بانعكاسين بين الانكسارين. ولم يكن ذلك نظرية حديثة صحيحة لفيزياء اللون. ما خاصية الضوء التي يكشفها قوس قزح؟
    en: Kamal al-Din al-Farisi replaced a tiny raindrop with a water-filled glass sphere to study light in a controllable model. Russell describes his experiment in a dark room with one aperture, and his explanation of the primary rainbow by two refractions with one internal reflection between them, and of the secondary bow by two reflections between the refractions. It was not a successful modern theory of colour. Which property of light does a rainbow show?
    ur: کمال الدین فارسی نے چھوٹی بوند کی جگہ پانی سے بھرا شیشے کا کرہ رکھا تاکہ روشنی کا راستہ ایک قابو میں رکھے جا سکنے والے نمونے میں پرکھیں۔ رسل ان کا تجربہ ایک تاریک کمرے میں، جس میں ایک ہی روزن ہو، بیان کرتے ہیں، اور بنیادی قوس کی وضاحت دو انعطافوں کے ساتھ جن کے بیچ ایک اندرونی انعکاس ہے، اور ثانوی قوس کی وضاحت انعطافوں کے بیچ دو انعکاسوں سے۔ یہ رنگ کی طبیعیات کا کوئی کامیاب جدید نظریہ نہیں تھا۔ قوسِ قزح روشنی کی کون سی خاصیت دکھاتی ہے؟
