expectations:
- code: D1
  text:
    en: apply the creative process to produce art works in a variety of traditional two- and three-dimensional forms, as well as multimedia art works, that communicate feelings, ideas, and understandings, using elements, principles, and techniques of visual arts as well as …
    ar: طبِّق عملية الإبداع لإنتاج أعمال فنية في مجموعة متنوعة من الأشكال التقليدية ثنائية الأبعاد وثلاثية الأبعاد، وكذلك الأعمال الفنية متعددة الوسائط، تعبّر عن المشاعر والأفكار والفهم، مستخدمًا عناصر الفنون البصرية ومبادئها وتقنياتها وكذلك …
    ur: تخلیقی عمل کو روایتی دو بعدی اور تین بعدی اشکال کے ساتھ ساتھ کثیر وسائطی فن پاروں کی تیاری پر لاگو کریں، جو جذبات، خیالات اور فہم کو بیان کریں، بصری فنون کے عناصر، اصولوں اور تکنیکوں کے ساتھ ساتھ …
- code: D2
  text:
    en: apply the critical analysis process to communicate feelings, ideas, and understandings in response to a variety of art works and art experiences
    ar: طبِّق عملية التحليل النقدي للتعبير عن المشاعر والأفكار والفهم استجابةً لمجموعة متنوعة من الأعمال والتجارب الفنية
    ur: فن پاروں اور فنی تجربات کی ایک وسیع قسم کے جواب میں جذبات، خیالات اور فہم کے اظہار کے لیے تنقیدی تجزیے کا عمل لاگو کریں
- code: D3
  text:
    en: demonstrate an understanding of a variety of art forms, styles, and techniques from the past and present, and their sociocultural and historical contexts
    ar: أظهر فهمًا لمجموعة متنوعة من الأشكال والأساليب والتقنيات الفنية من الماضي والحاضر، وسياقاتها الاجتماعية الثقافية والتاريخية
    ur: ماضی اور حال کی فنی اشکال، اسالیب اور تکنیکوں کی ایک وسیع قسم، اور ان کے سماجی، ثقافتی اور تاریخی سیاق و سباق کی سمجھ کا مظاہرہ کریں
