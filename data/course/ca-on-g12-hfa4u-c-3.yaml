  title:
    en: 'Hamiyya: keeping the sick from what harms'
    ar: 'الحمية: منع المريض مما يضره'
    ur: 'حمیہ: بیمار کو نقصان دہ چیز سے روکنا'
  text:
    en: The Kuwaiti jurisprudence encyclopaedia says hamiyya means keeping the sick from what harms him, and that it is a lawful form of treatment. Ibn al-Qayyim cites the narration in which the Prophet told Ali to avoid food and to take barley and chard (silq), and the report that Umar kept a sick man from food until he sucked a date-stone. The encyclopaedia adds that the diet is to follow the principles of medicine and sound experience. These are historical reports and a legal ruling about treatment, not dietary or medical advice; someone who is ill should follow a doctor's advice. What does each example change in what the patient eats?
    ar: تقول الموسوعة الفقهية الكويتية إن الحمية في اللغة المنع، وحمى المريض ما يضره، وهي نوع من التداوي وهو مشروع. ويذكر ابن القيم حديث أم المنذر أن النبي نهى عليا عن الطعام وأمر بالشعير والسلق، وعن عمر أنه كان يحمي المريض حتى يمتص النوى. وتضيف الموسوعة أنه يراعى في الحمية أصول الطب والتجربة الصحيحة. وهذه روايات تاريخية وحكم فقهي في التداوي، لا نصيحة غذائية أو طبية؛ ومن كان مريضًا فليتبع نصيحة طبيبه. فماذا يغيّر كل مثال في ما يأكله المريض؟
    ur: کویتی فقہی انسائیکلوپیڈیا کہتا ہے کہ حمیہ لغت میں منع کرنا ہے، یعنی بیمار کو اس چیز سے روکنا جو اسے نقصان دے، اور یہ علاج کی ایک جائز صورت ہے۔ ابن القیم ام المنذر کی روایت ذکر کرتے ہیں جس میں نبی نے علی کو کھانے سے منع کیا اور جو اور سلق، یعنی چقندر کے خاندان کا ساگ، کا حکم دیا، اور عمر کے بارے میں کہ وہ بیمار کو کھانے سے روکتے تھے یہاں تک کہ وہ گٹھلی چوسے۔ انسائیکلوپیڈیا مزید کہتا ہے کہ پرہیز میں طب کے اصولوں اور صحیح تجربے کی رعایت ہونی چاہیے۔ یہ تاریخی روایات اور علاج کے بارے میں ایک فقہی حکم ہیں، غذائی یا طبی مشورہ نہیں؛ جو بیمار ہو وہ ڈاکٹر کے مشورے پر چلے۔ ہر مثال بیمار کے کھانے میں کیا بدلتی ہے؟
