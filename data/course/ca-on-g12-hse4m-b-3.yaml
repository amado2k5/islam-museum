connections:
- position: before
  kind: story
  title:
    en: Bilal under Umayya ibn Khalaf
    ar: بلال عند أمية بن خلف
    ur: بلال، امیہ بن خلف کے ہاتھ میں
  text:
    en: Bilal ibn Rabah was born in Mecca to an enslaved Abyssinian mother around 580 CE and became Muslim while owned by Umayya ibn Khalaf. In al-Raheeq's account Umayya threw him on the sands of Mecca at the height of noon, laid a rock on his chest and told him to stay so until he died or disbelieved in Muhammad, until Abu Bakr bought him and freed him. Who held power in this scene, and what could each person do?
    ar: 'وُلد بلال بن رباح بمكة لأم حبشية مملوكة نحو سنة 580م، وأسلم وهو مملوك لأمية بن خلف. وفي رواية الرحيق المختوم كان أمية يلقيه في بطحاء مكة في حر الظهيرة ويضع الصخرة على صدره ويقول له: لا تزال هكذا حتى تموت أو تكفر بمحمد، حتى اشتراه أبو بكر وأعتقه. فمن كان يملك القوة في هذا المشهد، وماذا كان بوسع كلٍّ منهم أن يفعل؟'
    ur: بلال بن رباح تقریباً 580ء میں مکہ میں ایک غلام حبشی ماں کے ہاں پیدا ہوئے اور اس وقت مسلمان ہوئے جب وہ امیہ بن خلف کی ملکیت میں تھے۔ الرحیق المختوم کی روایت کے مطابق امیہ انہیں دوپہر کی گرمی میں مکہ کی ریت پر ڈالتا، ان کے سینے پر پتھر رکھتا اور کہتا کہ جب تک مر نہ جاؤ یا محمد کا انکار نہ کرو اسی طرح رہو گے، یہاں تک کہ ابوبکر نے انہیں خرید کر آزاد کر دیا۔ اس منظر میں طاقت کس کے پاس تھی، اور ہر شخص کیا کر سکتا تھا؟
  entity: person/bilal-ibn-rabah
