- position: after
  kind: reflection
  title:
    en: The jurists' rules on bondage
    ar: قواعد الفقهاء في الرق
    ur: غلامی کے بارے میں فقہا کے قواعد
  text:
    en: The Kuwaiti fiqh encyclopaedia sets out the jurists' rules on bondage (riq). It says freedom is the original state. The owner must feed and clothe the slave, may not set him work beyond his strength and may not disfigure him. In crimes, a free man is not retaliated against for killing a slave, while a slave who kills a free man is. The same record lets the owner sell, pledge or give the slave, and sets the hadd for a slave at half a free man's. What may one person do to another under these rules, and what is forbidden?
    ar: تعرض الموسوعة الفقهية الكويتية قواعد الفقهاء في الرق، وتقول إن الأصل في الإنسان الحرية. وعلى السيد نفقة رقيقه وكسوته، ويحرم تكليفه ما يغلبه ويحرم التمثيل به. وفي الجنايات لا يقتص من الحر إذا قتل الرقيق، ويقتص من الرقيق إذا قتل حرًا. وللسيد أن يبيع رقيقه أو يرهنه أو يهبه، ويُحد الرقيق بنصف حد الحر. فماذا يجوز لشخص أن يفعله بآخر في ظل هذه القواعد، وماذا يحرم عليه؟
    ur: کویتی فقہی انسائیکلوپیڈیا غلامی کے بارے میں فقہا کے قواعد بیان کرتا ہے اور کہتا ہے کہ انسان میں اصل آزادی ہے۔ مالک پر غلام کا نفقہ اور لباس واجب ہے، اسے اس کی طاقت سے زیادہ کام دینا حرام ہے اور اس کا مثلہ کرنا حرام ہے۔ جرائم میں آزاد آدمی سے غلام کے قتل پر قصاص نہیں لیا جاتا، جبکہ غلام سے آزاد کے قتل پر قصاص لیا جاتا ہے۔ اسی ریکارڈ کے مطابق مالک اپنے غلام کو بیچ سکتا ہے، رہن رکھ سکتا ہے یا ہبہ کر سکتا ہے، اور غلام کی حد آزاد کی حد کا آدھا ہے۔ ان قواعد کے تحت ایک شخص دوسرے کے ساتھ کیا کر سکتا ہے، اور کیا حرام ہے؟
  entity: concept/riq-fiqh
