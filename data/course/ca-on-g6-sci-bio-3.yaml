summary:
  en: Describing how diversity keeps communities of living things resilient, and how the relationships among organisms and their environment sustain biodiversity.
  ar: وصف كيف يحفظ التنوع مرونة المجتمعات الحيوية، وكيف تدعم العلاقات المتبادلة بين الكائنات وبيئتها التنوع الحيوي.
  ur: یہ بیان کرنا کہ تنوع جانداروں کی برادریوں کو لچکدار کیسے رکھتا ہے، اور جانداروں اور ان کے ماحول کے باہمی تعلقات حیاتیاتی تنوع کو کیسے سہارا دیتے ہیں۔
  es: "Describe cómo la diversidad mantiene la resiliencia de las comunidades de seres vivos y cómo las relaciones entre los organismos y su entorno sustentan la biodiversidad."
  fr: "Décrire comment la diversité assure la résilience des communautés d'êtres vivants, et comment les relations entre les organismes et leur environnement soutiennent la biodiversité."
  tr: "Biyolojik toplulukların dayanıklılığını çeşitliliğin nasıl koruduğunu ve organizmalar ile çevreleri arasındaki karşılıklı ilişkilerin biyolojik çeşitliliği nasıl desteklediğini açıklayın."
  id: "Jelaskan bagaimana keanekaragaman menjaga ketahanan komunitas biologis, dan bagaimana hubungan antar organisme dan lingkungannya mendukung keanekaragaman hayati."
