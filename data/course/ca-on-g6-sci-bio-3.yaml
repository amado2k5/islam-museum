label:
  en: How living things depend on each other
  ar: كيف تعتمد الكائنات الحية بعضها على بعض
  ur: جاندار ایک دوسرے پر کیسے انحصار کرتے ہیں
  es: "Cómo dependen los seres vivos unos de otros"
  fr: "Comment les êtres vivants dépendent les uns des autres"
