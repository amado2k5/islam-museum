  kind: hadith
  title:
    en: Mercy down the chain
    ar: رحمة على امتداد السلسلة
    ur: 'زنجیر بھر میں رحمت'
  text:
    en: A hadith tells of a man forgiven for giving water to a thirsty dog — and of another punished for starving a cat (Bukhari and Muslim). In an ecosystem, every creature matters; in the Prophet's teaching,
      every creature is owed mercy.
    ar: يحدث الحديث عن رجل غُفر له لسقيه كلبًا ظمآن، وعن امرأة عُذبت بحبسها قطة حتى ماتت ⁦(البخاري ومسلم)⁩. في النظام البيئي كل مخلوق مهم، وفي تعليم النبي لكل مخلوق حق الرحمة.
    ur: 'حدیث میں ایک شخص آتا ہے جسے پیاسے کتے کو پانی پلانے پر بخش دیا گیا — اور ایک عورت جو بلی کو بھوکا رکھ کر سزا پائی ⁦(بخاری و مسلم)⁩۔ ماحولیاتی نظام میں ہر مخلوق اہم ہے؛ نبی کریم کی تعلیم میں ہر مخلوق رحمت کا حقدار ہے۔'
  ref: Bukhari 3321; Muslim 2245
  sources:
  - source/sahih-al-bukhari
  - source/sahih-muslim
- position: within
  kind: story
  title:
    en: Reading the desert's web
    ar: قراءة شبكة الصحراء
    ur: 'صحرا کے جال کو پڑھنا'
  text:
    en: Al-Jahiz described how mosquitoes feed elephants' ticks feed birds feed predators — his 'struggle for existence' sketched what we now draw as a food web.
    ar: وصف الجاحظ كيف يقتات بعض المخلوقات ببعض في سلسلة متصلة من الصغير إلى الكبير، فكانت «صيرته للوجود» تخطيطًا مبكرًا لما نرسمه اليوم شبكةً غذائية.
    ur: 'الجاحظ نے بیان کیا کہ چھوٹی مخلوق بڑی مخلوق کی خوراک بنتی ہے اور زنجیر بڑھتی جاتی ہے — اس کی «وجود کی جدوجہد» اس کا ابتدائی خاکہ تھا جسے آج ہم خوراکی جال کہتے ہیں۔'
  sources:
