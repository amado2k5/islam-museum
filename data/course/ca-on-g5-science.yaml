summary:
  en: 'The 2022 Ontario Grade 5 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps a few expectations in each strand; most are in the gap register.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف الخامس في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، ومنظومات الحياة، والمادة والطاقة، والمنشآت والآليات، ومنظومات الأرض والفضاء. ويربط المتحف توقعات قليلة في كل محور، أما أكثرها ففي سجل الفجوات.'
  ur: 'اونٹاریو نصاب 2022 کے پانچویں جماعت سائنس و ٹیکنالوجی کورس کے پانچ محور ہیں: STEM کی مہارتیں اور روابط، جاندار نظام، مادہ اور توانائی، ڈھانچے اور میکانزم، اور زمین اور خلا کے نظام۔ عجائب گھر ہر محور میں چند توقعات کو جوڑتا ہے؛ زیادہ تر خالی جگہوں کے اندراج میں ہیں۔'
  es: "El curso de Ciencias y Tecnología de 5.º grado de Ontario para 2022 consta de cinco ejes temáticos: Habilidades y Conexiones STEM, Sistemas de la Vida, Materia y Energía, Estructuras y Mecanismos, y Sistemas Terrestres y Espaciales. El museo describe algunos objetivos en cada eje temático; la mayoría se encuentran en el registro de deficiencias."
  fr: "Le programme de sciences et technologie de 5e année de l'Ontario (2022) comprend cinq volets: compétences et liens en STIM, systèmes vivants, matière et énergie, structures et mécanismes, et systèmes Terre et espace. Le musée présente quelques attentes pour chaque volet; la plupart des compétences à acquérir sont à approfondir."
  tr: "Ontario'nun 2022 müfredatındaki 5. Sınıf Fen ve Teknoloji dersi beş temadan oluşmaktadır: STEM becerileri ve bağlantıları; yaşam sistemleri; madde ve enerji; yapılar ve mekanizmalar; ve Dünya ve uzay sistemleri. Müze, her temadaki bazı beklentileri birbirine bağlamaktadır, ancak çoğu eksiklikler listesinde yer almaktadır."
  id: "Kurikulum Sains dan Teknologi Kelas 5 dalam silabus Ontario 2022 memiliki lima tema: keterampilan STEM dan hubungannya; sistem kehidupan; materi dan energi; struktur dan mekanisme; dan sistem bumi dan ruang angkasa. Museum ini menghubungkan beberapa harapan dalam setiap tema, tetapi sebagian besar masih dalam tahap pengembangan."
