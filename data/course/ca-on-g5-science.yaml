summary:
  en: 'The 2022 Ontario Grade 5 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps a few expectations in each strand; most are in the gap register.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف الخامس في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، ومنظومات الحياة، والمادة والطاقة، والمنشآت والآليات، ومنظومات الأرض والفضاء. ويربط المتحف توقعات قليلة في كل محور، أما أكثرها ففي سجل الفجوات.'
  ur: 'اونٹاریو نصاب 2022 کے پانچویں جماعت سائنس و ٹیکنالوجی کورس کے پانچ محور ہیں: STEM کی مہارتیں اور روابط، جاندار نظام، مادہ اور توانائی، ڈھانچے اور میکانزم، اور زمین اور خلا کے نظام۔ عجائب گھر ہر محور میں چند توقعات کو جوڑتا ہے؛ زیادہ تر خالی جگہوں کے اندراج میں ہیں۔'
