  title:
    en: A column for counting the flood
    ar: عمود لعدّ الفيضان
    ur: سیلاب گننے کا ستون
  text:
    en: On Rawda Island in Cairo stands a stone-lined pit built in 862 to gauge the Nile flood. Yeomans writes that its readings were essential in setting irrigation policy; the measuring column is divided into nineteen cubits, and the sixteenth-cubit mark stands for the ideal flood level. How could a measured flood shape decisions about irrigation?
    ar: في جزيرة الروضة بالقاهرة بئر مبطنة بالحجر بُنيت سنة 862م لقياس فيضان النيل. ويذكر يومانز أن قراءاتها كانت أساساً في تقدير سياسة الري؛ وعمود القياس مقسوم تسع عشرة ذراعاً، وعلامة الذراع السادسة عشرة هي منسوب الفيضان المثالي. كيف يمكن لفيضان مقيس أن يوجّه قرارات الري؟
    ur: قاہرہ کے جزیرۂ روضہ میں پتھر سے استر کیا ہوا ایک کنواں ہے جو 862ء میں نیل کا سیلاب ناپنے کے لیے بنایا گیا۔ یومانز لکھتے ہیں کہ اس کی پیمائشیں آبپاشی کی پالیسی طے کرنے میں بنیادی تھیں؛ ناپنے والا ستون انیس ہاتھ ⁦(ذراع)⁩ میں بٹا ہوا ہے اور سولھویں ہاتھ کا نشان مثالی سیلابی سطح کا ہے۔ ناپا گیا سیلاب آبپاشی کے فیصلوں کو کیسے رخ دے سکتا ہے؟
