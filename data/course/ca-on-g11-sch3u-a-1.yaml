  title:
    en: A balance with five pans
    ar: ميزان بخمس كفف
    ur: پانچ پلڑوں والا ترازو
  text:
    en: Abd al-Rahman al-Khazini described a balance with a long beam, a sensitive indicator tongue and five pans used in different arrangements, including one in which the object is immersed in a known liquid. Robert Hall explains that it combined weighing in air, weighing in liquid and calibrated pan positions to investigate metals and gems. The record calls it a refinement within a long tradition, not weighing invented from nothing. Which readings would your own inquiry need?
    ar: وصف عبد الرحمن الخازني ميزاناً ذا عارضة طويلة ولسان حساس وخمس كفف تُستعمل في ترتيبات مختلفة، منها ترتيب يجعل الجسم مغموراً في سائل معلوم. ويشرح روبرت هول أنه جمع الوزن في الهواء والوزن في السائل ومواضع كفف مضبوطة ليختبر المعادن والأحجار. ويصفه السجل بأنه مرحلة أدق ضمن تقليد طويل من الموازين المائية، لا اختراع للوزن من الصفر. أي قراءات يحتاجها تحقيقك أنت؟
    ur: عبدالرحمن الخازنی نے ایسا ترازو بیان کیا جس میں لمبی ڈنڈی، حساس سوئی اور پانچ پلڑے ہیں جو مختلف ترتیبوں میں استعمال ہوتے ہیں، ان میں ایک ترتیب وہ ہے جس میں جسم ایک معلوم مائع میں ڈوبا ہوتا ہے۔ رابرٹ ہال بتاتے ہیں کہ اس میں ہوا میں وزن، مائع میں وزن اور پلڑوں کے ناپے ہوئے مقامات کو ملا کر دھاتوں اور جواہر کو جانچا جاتا تھا۔ اندراج اسے پانی کے ترازوؤں کی طویل روایت کے اندر ایک مزید باریک مرحلہ بتاتا ہے، نہ کہ وزن کی ایجاد۔ آپ کی اپنی تحقیق کو کون سی پیمائشیں درکار ہوں گی؟
