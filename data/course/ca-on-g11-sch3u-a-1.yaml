  title:
    en: The parts of a distilling apparatus
    ar: أجزاء جهاز التقطير
    ur: کشید کے آلے کے حصے
  text:
    en: 'The record on the anbik says the complete distilling apparatus had three parts: the cucurbit (qar''a), the cap or head (anbik), and the receiver (qabila). Modern retorts combine the cap and the cucurbit into one. The name comes from the Greek word for a head or cap. When you choose glassware for an inquiry, which part does each piece of your set-up play?'
    ar: 'يتكون جهاز التقطير الكامل، كما يذكر سجل الأنبيق، من ثلاثة أجزاء: القرعة، والرأس أو القلنسوة وهو الأنبيق، والمستقبِل وهو القابلة. وتجمع المقطّرات الحديثة الرأس والقرعة في قطعة واحدة. والأنبيق اسم يوناني الأصل لرأس جهاز التقطير. حين تختار الزجاجيات لتحقيقك، أي جزء تؤدي كل قطعة من تركيبك؟'
    ur: 'انبیق کا اندراج بتاتا ہے کہ کشید کے مکمل آلے کے تین حصے تھے: قرعہ، سر یا ٹوپی جو انبیق ہے، اور وصول کنندہ جو قابلہ ہے۔ جدید ریٹارٹ سر اور قرعہ کو ایک ہی ٹکڑے میں جوڑ دیتے ہیں۔ انبیق یونانی الاصل نام ہے جو کشید کے آلے کے سر کے لیے ہے۔ اپنی تحقیق کے لیے شیشے کا سامان چنتے وقت آپ کے انتظام کا ہر ٹکڑا کون سا حصہ ادا کرتا ہے؟'
  entity: concept/anbik
