connections:
- position: before
  kind: invention
  title:
    en: Numbers that take their value from their place
    ar: أعداد تأخذ قيمتها من موضعها
    ur: ایسے اعداد جو اپنی جگہ سے قدر پاتے ہیں
  text:
    en: 'Algorism is a way of writing and working numbers with nine numerals and a zero, in which each place takes its value from its position: units, then tens, then hundreds, then thousands. Muhammad ibn Musa al-Khwarizmi wrote a book on it in Baghdad, through which the Indian numerals and the decimal system entered the Islamic world. In the numbers 5, 50 and 500, what is the digit 5 worth in each?'
    ar: 'الحساب الهندي طريقةٌ في كتابة الأعداد وحسابها بتسعة أرقام وصفر، تأخذ فيها كل خانة قيمتها من موضعها: آحاد ثم عشرات ثم مئات ثم ألوف. ألّف فيها محمد بن موسى الخوارزمي في بغداد كتاباً دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي. في الأعداد 5 و50 و500، كم تساوي الخمسة في كل منها؟'
    ur: 'ہندی حساب اعداد کو نو ہندسوں اور صفر سے لکھنے اور ان پر عمل کرنے کا طریقہ ہے، جس میں ہر خانہ اپنی قدر اپنے مقام سے لیتا ہے: اکائیاں، پھر دہائیاں، پھر سیکڑے، پھر ہزار۔ محمد بن موسیٰ خوارزمی نے بغداد میں اس پر ایک کتاب لکھی جس کے ذریعے ہندی ہندسے اور اعشاری نظام اسلامی دنیا میں داخل ہوا۔ اعداد 5، 50 اور 500 میں ہر ایک میں ہندسہ پانچ کی قدر کیا ہے؟'
  entity: invention/algorism
  sources:
  - source/tdv-harizmi
- position: after
  kind: invention
  title:
    en: Tenths and hundredths
    ar: الأعشار والأجزاء من مئة
    ur: دسویں اور سویں حصے
  text:
    en: A half can be written as five tenths, and half of that as twenty-five hundredths. A book composed by Abu al-Hasan al-Uqlidisi at Damascus in 341/952–953 contains an early direct treatment of such fractions within Indian place-value arithmetic. The record adds that this is not the invention of Indian numerals or of today's decimal point. Which place holds the five in five tenths?
    ar: نصف الواحد يمكن أن يكتب خمسة أعشار، ونصف النصف خمسة وعشرين جزءاً من مئة. في كتاب ألّفه أبو الحسن الإقليدسي بدمشق سنة 341هـ/952–953م نجد معالجة مبكرة مباشرة لمثل هذه الكسور داخل الحساب الهندي ذي القيمة المكانية. وليست القصة اختراع الأرقام الهندية أو النقطة العشرية الحالية. في أي خانة يقع الخمسة في خمسة أعشار؟
    ur: ایک کا نصف پانچ دسویں حصے لکھا جا سکتا ہے، اور اس کا نصف پچیس سویں حصے۔ ابو الحسن اقلیدسی نے دمشق میں 341ھ/952–953ء میں جو کتاب لکھی، اس میں ہندی مقامی قدر والے حساب کے اندر ایسے کسروں کا ایک ابتدائی براہِ راست بیان ملتا ہے۔ ریکارڈ بتاتا ہے کہ یہ ہندی ہندسوں یا آج کے اعشاری نقطے کی ایجاد نہیں۔ پانچ دسویں میں پانچ کس خانے میں آتا ہے؟
  entity: invention/decimal-fractions-al-uqlidisi
  sources:
