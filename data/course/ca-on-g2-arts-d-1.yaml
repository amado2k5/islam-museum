- position: after
  kind: object
  title:
    en: Flowers fired on clay
    ar: أزهار على الطين المحروق
    ur: مٹی پر پکائے گئے پھول
  text:
    en: R. L. Hobson describes a new and striking style of pottery decoration that developed in the Ottoman lands towards the middle of the sixteenth century, marked by bold designs of naturalistic flowers. In its first group a brilliant tomato red appears with blue, leaf green, turquoise and black outlines, and the rose, carnation, tulip and hyacinth can be recognised. Which flowers would you look for on a piece of pottery, and in which colours?
    ar: يصف ر. ل. هوبسون أسلوبًا جديدًا لافتًا في زخرفة الخزف ظهر في الدولة العثمانية نحو منتصف القرن السادس عشر، أبرز ما فيه التصاميم الجريئة للأزهار الطبيعية. وفي مجموعته الأولى أحمر طماطمي لامع مع الأزرق والأخضر والفيروزي والأسود للخطوط، وأزهار تُعرف فيها الوردة والقرنفل والخزامى ⁦(التوليب)⁩ والسنبل. أي الأزهار ستبحث عنها على قطعة خزف، وبأي ألوان؟
    ur: آر. ایل. ہوبسن عثمانی سرزمینوں میں سولہویں صدی کے وسط کے قریب ظروف کی آرائش کا ایک نیا اور نمایاں انداز بیان کرتا ہے، جس کی پہچان فطری پھولوں کے جرأت مندانہ نقش ہیں۔ اس کے پہلے گروہ میں چمکدار ٹماٹری سرخ رنگ نیلے، پتوں جیسے سبز، فیروزی اور خطوط کے لیے سیاہ کے ساتھ آتا ہے، اور اس میں گلاب، قرنفل، ٹیولپ اور سنبل پہچانے جا سکتے ہیں۔ آپ مٹی کے کسی برتن پر کون سے پھول تلاش کریں گے، اور کن رنگوں میں؟
  entity: concept/iznik-pottery
