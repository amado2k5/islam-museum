  title:
    en: A particular elephant
    ar: فيل بعينه
    ur: ایک مخصوص ہاتھی
  text:
    en: 'Milo Cleveland Beach writes that a recognisable Mughal style was formed under Akbar, mixing Rajput and Muslim Indian elements with those of Safavid Iran. Beach describes a Mughal elephant as a specific elephant in a relatively naturalistic space. What do you notice when a painter shows one particular animal?'
    ar: 'يقول ميلو كليفلاند بيتش إن الأسلوب المغولي المعروف تشكّل في عهد أكبر، وإنه مزج عناصر راجبوتية وإسلامية هندية بعناصر إيران الصفوية. ويصف بيتش الفيل المغولي بأنه فيل بعينه في فضاء طبيعي نسبيًا. ماذا تلاحظ حين يصوّر المصوّر حيوانًا بعينه؟'
    ur: 'میلو کلیولینڈ بیچ لکھتا ہے کہ پہچانا جانے والا مغل اسلوب اکبر کے دور میں بنا، اور اس میں راجپوت اور مسلم ہندی عناصر کو صفوی ایران کے عناصر سے ملایا گیا۔ بیچ مغل ہاتھی کو ایک مخصوص ہاتھی بتاتا ہے جو نسبتاً فطری فضا میں دکھایا گیا ہے۔ جب مصور کسی ایک مخصوص جانور کو دکھاتا ہے تو آپ کیا دیکھتے ہیں؟'
  entity: concept/mughal-painting
  sources:
