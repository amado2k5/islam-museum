expectations:
- code: F1
  text:
    en: analyse a variety of social, ethical, and legal issues related to applications of biotechnology in the health, agricultural, or environmental sector
    ar: حلّل مجموعة متنوعة من القضايا الاجتماعية والأخلاقية والقانونية المتصلة بتطبيقات التقنية الحيوية في القطاع الصحي أو الزراعي أو البيئي
    ur: صحت، زراعت یا ماحول کے شعبے میں حیاتی ٹیکنالوجی کے اطلاقات سے متعلق مختلف سماجی، اخلاقی اور قانونی مسائل کا تجزیہ کریں
- code: F2
  text:
    en: investigate various techniques used in biotechnology and how they are applied in the food industry and the health and agricultural sectors
    ar: استقصِ تقنيات متنوعة تُستعمل في التقنية الحيوية وكيف تُطبَّق في صناعة الغذاء والقطاعين الصحي والزراعي
    ur: حیاتی ٹیکنالوجی میں استعمال ہونے والی مختلف تکنیکوں اور ان کے غذائی صنعت اور صحت و زراعت کے شعبوں میں اطلاق کی تحقیق کریں
- code: F3
  text:
    en: demonstrate an understanding of biological processes related to biotechnology and of applications of biotechnology in the health, agricultural, and environmental sectors
    ar: أظهر فهمًا للعمليات الحيوية المتصلة بالتقنية الحيوية ولتطبيقات التقنية الحيوية في القطاعات الصحية والزراعية والبيئية
    ur: حیاتی ٹیکنالوجی سے متعلق حیاتیاتی عملوں اور صحت، زراعت اور ماحول کے شعبوں میں حیاتی ٹیکنالوجی کے اطلاقات کی فہم کا مظاہرہ کریں
