summary:
  en: 'Biotechnology and its issues (expectations F1 to F3). The museum maps one lesson: a fatwa on the use of plant-cloning techniques in food production, as an ethical and legal question (F1.2).'
  ar: 'التقنية الحيوية وقضاياها ⁦(التوقعات F1 إلى F3)⁩. ويربط المتحف درسًا واحدًا: فتوى في استعمال تقنيات استنساخ النبات في إنتاج الغذاء بوصفه سؤالًا أخلاقيًا وقانونيًا ⁦(F1.2)⁩.'
  ur: 'حیاتی ٹیکنالوجی اور اس کے مسائل ⁦(توقعات F1 تا F3)⁩۔ میوزیم ایک سبق جوڑتا ہے: غذائی پیداوار میں پودوں کی کلوننگ کی تکنیکوں کے استعمال پر ایک فتویٰ، اخلاقی اور قانونی سوال کے طور پر ⁦(F1.2)⁩۔'
  es: "La biotecnología y sus problemáticas (expectativas F1 a F3). El museo presenta una lección: una fatwa sobre el uso de técnicas de clonación vegetal en la producción de alimentos, como una cuestión ética y legal (F1.2)."
  fr: "La biotechnologie et ses enjeux (attentes F1 à F3). Le musée propose une leçon: une fatwa sur l’utilisation des techniques de clonage végétal dans la production alimentaire, comme question éthique et juridique (F1.2)."
  tr: "Biyoteknoloji ve sorunları (Beklentiler F1 ila F3). Müze, bir dersi şu şekilde ilişkilendiriyor: gıda üretiminde bitki klonlama tekniklerinin kullanımına ilişkin etik ve yasal bir soru olarak bir fetva (F1.2)."
  id: "Bioteknologi dan permasalahannya (Harapan F1 hingga F3). Museum ini menghubungkan satu pelajaran: fatwa tentang penggunaan teknik kloning tanaman dalam produksi pangan sebagai pertanyaan etika dan hukum (F1.2)."
