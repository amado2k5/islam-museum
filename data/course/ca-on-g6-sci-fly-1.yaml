- position: within
  kind: invention
  title:
    en: Gliding on rising air
    ar: الانزلاق على هواء صاعد
    ur: اٹھتی ہوا پر گلائیڈنگ
  text:
    en: 'NASA Glenn describes gliding as trading altitude for speed: a glider descends relative to its surrounding air, although rising air can increase its height relative to the ground. The museum''s record adds that this explanation cannot invent an updraft at a launch place that al-Maqqari''s account does not name. What does it mean for something to rise relative to the ground while it sinks relative to the air?'
    ar: 'تشرح ناسا غلين الانزلاق بأنه مبادلة ارتفاع بسرعة: تنخفض الطائرة الشراعية بالنسبة إلى كتلة الهواء التي تطير فيها، وقد تكسب ارتفاعًا بالنسبة إلى الأرض إذا حملها تيار هوائي صاعد. ويقول سجل المتحف إن هذا الشرح لا يثبت تيارًا صاعدًا في المكان الذي لا يسميه خبر المقري. فما معنى أن يرتفع جسم بالنسبة إلى الأرض وينخفض بالنسبة إلى الهواء؟'
    ur: 'ناسا گلین گلائیڈنگ کو بلندی کے بدلے رفتار کہتی ہے: گلائیڈر اپنے آس پاس کی ہوا کی نسبت نیچے جاتا ہے، اگرچہ اٹھتی ہوا زمین کی نسبت اس کی بلندی بڑھا سکتی ہے۔ میوزیم کا ریکارڈ کہتا ہے کہ یہ وضاحت مقری کی خبر میں نامعلوم آغاز کی جگہ پر اٹھتی ہوا فرض نہیں کر سکتی۔ کسی چیز کا زمین کی نسبت اوپر جانا اور ہوا کی نسبت نیچے جانا کیا معنی رکھتا ہے؟'
