connections:
- position: before
  kind: invention
  title:
    en: Four forces, and a glider without an engine
    ar: أربع قوى، وطائرة شراعية بلا محرك
    ur: چار قوتیں، اور بغیر انجن کا گلائیڈر
  text:
    en: 'The museum''s record sets the account of Ibn Firnas beside NASA Glenn''s guide: weight towards Earth''s centre, lift perpendicular to motion through air, drag opposing motion, and thrust from propulsion in a powered aircraft. NASA describes a glider as an aircraft without an engine, subject to lift, drag and weight without engine thrust. This is modern teaching, not a description of Ibn Firnas''s wings. Which of the four forces is missing on a glider?'
    ar: 'يضع سجل المتحف خبر ابن فرناس إلى جوار شرح ناسا غلين: الوزن نحو مركز الأرض، والرفع عموديّ على الحركة في الهواء، والمقاومة تعارض الحركة، والدفع في الطائرة المزودة بمحرك من جهاز دفع. وتصف ناسا الطائرة الشراعية بأنها بلا محرك، تعمل عليها قوى الرفع والمقاومة والوزن بدل قوة دفع من محرك. هذا تعليم حديث لا وصف لجناحي ابن فرناس. فأي قوة من الأربع تغيب عن الطائرة الشراعية؟'
    ur: 'میوزیم کا ریکارڈ ابن فرناس کی خبر کو ناسا گلین کی رہنما تحریر کے ساتھ رکھتا ہے: وزن مرکزِ زمین کی طرف، اٹھان ہوا میں حرکت کے عمود پر، مزاحمت حرکت کے خلاف، اور دھکا انجن والے جہاز میں محرکہ سے۔ ناسا گلائیڈر کو بغیر انجن کا جہاز کہتا ہے، جس پر اٹھان، مزاحمت اور وزن کام کرتے ہیں، انجن کا دھکا نہیں۔ یہ جدید تعلیم ہے، ابن فرناس کے بازوؤں کا وصف نہیں۔ چاروں قوتوں میں سے کون سی قوت گلائیڈر پر نہیں ہوتی؟'
  entity: invention/firnas-reported-winged-flight
