    en: Held up in the sky
    ar: ممسكات في الجو
    ur: 'آسمان میں قائم'
  text:
    en: 'Do they not see the birds held in the middle of the sky? — asks the Qur''an (16:79). The verse invites exactly what this unit does: look at flight, then ask how.'
    ar: 'ألم يروا إلى الطير مسخرات في جو السماء؟ يسأل القرآن (16:79). والآية دعوة لما تفعله هذه الوحدة تمامًا: انظر إلى الطيران ثم اسأل كيف.'
    ur: 'کیا وہ آسمان کے بیچ معلق پرندوں کو نہیں دیکھتے؟ — قرآن پوچھتا ہے (16:79)۔ یہ آیت بالکل وہی دعوت ہے جو یہ یونٹ دیتی ہے: پرواز کو دیکھو، پھر پوچھو کیسے۔'
  ref: 16:79
