  text:
    en: In 9th-century Cordoba, Abbas ibn Firnas covered a wooden frame with feathers, climbed a tower, and glided — witnesses said he stayed aloft before landing roughly, having studied everything except
      the tail. The story is preserved by later historians; the details are debated, the ambition is not.
    ar: في قرطبة القرن التاسع، غطى عباس بن فرناس هيكلًا خشبيًا بالريش وصعد برجًا وانزلق طائرًا؛ قال الشهود إنه مكث في الجو قبل أن يهبط بخشونة، إذ درس كل شيء إلا الذيل. حفظ المؤرخون المتأخرون القصة؛ والتفاصيل
      محل خلاف أما الطموح فلا.
