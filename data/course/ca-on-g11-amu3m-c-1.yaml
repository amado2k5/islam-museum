connections:
- position: before
  kind: invention
  title:
    en: One more string on an inherited oud
    ar: وتر آخر في عود موروث
    ur: ورثے کے عود پر ایک اور تار
  text:
    en: The record on Ziryab's reported fifth oud string places the attribution inside an inherited instrument. Maqqari begins with a four-string oud, and the added string is red, placed below the mathlath and above the mathna. The record calls this a refinement of the oud's arrangement, not a new instrument and not a surviving product with complete dimensions and tuning. How can an instrument change and still be the same instrument?
    ar: تضع صفحة الوتر الخامس المنسوب لزرياب النسبة داخل آلة موروثة. يفتتح المقري بعود ذي أربعة أوتار، والوتر المضاف أحمر يوضع تحت المثلث وفوق المثنى. وتصف الصفحة هذا بأنه تغيير في تجهيز آلة يعرفها السامعون، لا آلة جديدة منفصلة ولا منتجاً باقياً بقياسات ونظام ضبط كامل. كيف تتغير آلة وتبقى هي نفسها؟
    ur: زریاب سے منسوب عود کی پانچویں تار پر ریکارڈ اس نسبت کو ایک ورثے میں ملے آلے کے اندر رکھتا ہے۔ المقری چار تاروں والے عود سے آغاز کرتا ہے، اور اضافی تار سرخ ہے جو مثلث کے نیچے اور مثنیٰ کے اوپر رکھی جاتی ہے۔ ریکارڈ اسے عود کی ترتیب کی اصلاح کہتا ہے، نہ کوئی نیا آلہ اور نہ مکمل پیمائش اور سُر بندی کے ساتھ بچی ہوئی مصنوعات۔ ایک آلہ بدل کر بھی وہی آلہ کیسے رہتا ہے؟
  entity: invention/ziryab-fifth-string
  sources:
