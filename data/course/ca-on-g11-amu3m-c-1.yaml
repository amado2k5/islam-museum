- position: after
  kind: scholar
  title:
    en: Forms and languages of Sufi song
    ar: ألوان الغناء الصوفي ولغاته
    ur: صوفی گائیکی کی اصناف اور زبانیں
  text:
    en: The record on Abida Parveen says she sang at dargahs from the early 1970s and that her breakthrough came on Radio Pakistan in 1973 with a Sindhi song. It adds that she sings ghazal, thumri, khayal, qawwali and above all kafi, in Urdu, Sindhi, Punjabi, Arabic and Persian. Which of these forms and languages can you find in a recording you can hear in class?
    ar: تذكر صفحة عابدة پروين أنها غنّت في الدرگاهات منذ أوائل السبعينيات، وأن انطلاقتها كانت في إذاعة باكستان سنة 1973 بأغنية سندية. وتضيف أنها تغني الغزل والثمري والخيال والقوالي والكافي، وهو تخصصها، بالأردية والسندية والبنجابية والعربية والفارسية. أي هذه الألوان واللغات تجده في تسجيل تسمعه في صفك؟
    ur: عابدہ پروین پر ریکارڈ بتاتا ہے کہ وہ 1970 کی دہائی کے آغاز سے درگاہوں پر گاتی رہیں اور ان کی کامیابی کا آغاز 1973 میں ریڈیو پاکستان پر ایک سندھی گیت سے ہوا۔ وہ مزید کہتا ہے کہ وہ غزل، ٹھمری، خیال، قوالی اور سب سے بڑھ کر کافی، اردو، سندھی، پنجابی، عربی اور فارسی میں گاتی ہیں۔ ان میں سے کون سی اصناف اور زبانیں آپ کو کلاس میں سنی جانے والی کسی ریکارڈنگ میں ملتی ہیں؟
