  title:
    en: A building endowed to give water
    ar: بناء موقوف لسقي الماء
    ur: پانی پلانے کے لیے وقف عمارت
  text:
    en: The record defines the sabil as a charitable building endowed to give people fresh water every day all year round, called siqaya in the first five centuries and known as sabil from the late fifth century AH. Sabils drew water from wells, pools and springs, or from rain and floods through channels or pipes hidden in walls, and some had one or two cisterns. Who should bear the cost of drinking water in your community?
    ar: السبيل، كما يعرّفه السجل، بناء خيري يوقف لسقي الناس الماء العذب كل يوم وعلى مدار العام، عُرف بالسقاية في القرون الخمسة الأولى ثم اشتهر باسم السبيل منذ أواخر القرن الخامس الهجري. وكانت الأسبلة تستمد ماءها من الآبار والبرك والعيون أو من الأمطار والسيول بقنوات محكمة أو أقصاب مغيبة في الجدران، وبعضها زُوّد بصهريج أو صهريجين. من ينبغي أن يتحمل كلفة مياه الشرب في مجتمعك؟
    ur: اندراج سبیل کی تعریف یوں کرتا ہے کہ یہ ایک فلاحی عمارت ہے جو لوگوں کو سال بھر ہر روز میٹھا پانی پلانے کے لیے وقف کی جاتی تھی؛ ابتدائی پانچ صدیوں میں اسے سقایہ کہا جاتا تھا اور پانچویں صدی ہجری کے اواخر سے سبیل کے نام سے مشہور ہوا۔ سبیلیں کنوؤں، حوضوں اور چشموں سے، یا بارش اور سیلاب کے پانی سے نالیوں یا دیواروں میں چھپے پائپوں کے ذریعے پانی لیتی تھیں، اور بعض میں ایک یا دو ٹنکیاں تھیں۔ آپ کے معاشرے میں پینے کے پانی کی لاگت کس کو اٹھانی چاہیے؟
