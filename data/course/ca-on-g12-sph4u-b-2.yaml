  title:
    en: A duel of catapults
    ar: مبارزة المجانيق
    ur: منجنیقوں کا مقابلہ
  text:
    en: According to Ibn al-Imad in Shadharat al-Dhahab, in 674 AH the Tatars, thirty thousand horsemen, set up a catapult against the fortress of al-Bira, its operator a Muslim. The defenders answered with one of their own; its first shot passed high over the Tatar machines. After an arm was cut from the catapult's leg, a shot struck a Tatar catapult and smashed it. Which effects does the account report, and which does it leave out?
    ar: بحسب ابن العماد في «شذرات الذهب»، نزل التتار سنة 674هـ على إلبيرة، وكانوا ثلاثين ألف فارس، ونصبوا على القلعة منجنيقًا كان راميه مسلمًا. فنصب أهل القلعة منجنيقًا ورموا به على مجانيق التتار فجاء الرمي عاليًا عليها. ثم قُطع من رجل المنجنيق ذراع، فرُمي بالمنجنيق فأصاب منجنيق التتار فكسره. أي الآثار يذكرها الخبر، وأيها لا يذكره؟
    ur: ابن العماد کی «شذرات الذہب» کے مطابق 674 ہجری میں تیس ہزار گھڑ سوار تاتاریوں نے البیرہ کے قلعے پر ایک منجنیق نصب کی، اور اسے چلانے والا مسلمان تھا۔ محافظوں نے اپنی منجنیق نصب کر کے جواب دیا اور اس کا پہلا وار تاتاری مشینوں کے اوپر سے نکل گیا۔ پھر منجنیق کی ٹانگ سے ایک بازو کاٹا گیا، اور اس کے بعد کا وار ایک تاتاری منجنیق پر لگا اور اسے توڑ گیا۔ خبر کون سے اثرات بتاتی ہے اور کون سے چھوڑ دیتی ہے؟
