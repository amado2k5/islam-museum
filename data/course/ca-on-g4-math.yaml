summary:
  en: 'The Ontario Grade 4 Mathematics course has six strands: social-emotional learning skills, number, algebra, data, spatial sense and financial literacy. The museum maps parts of strands B, C, E and F.'
  ar: 'مقرر الرياضيات للصف الرابع في منهاج أونتاريو له ستة محاور: مهارات التعلم الاجتماعي العاطفي، والعدد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. ولا يربط المتحف إلا أجزاء من المحاور ب وج وهـ و.'
  ur: 'اونٹاریو کے نصاب میں چوتھی جماعت کے ریاضی کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں، عدد، الجبر، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ عجائب گھر محور ب، ج، ہ اور و کے صرف کچھ حصے جوڑتا ہے۔'
  es: "El curso de matemáticas de cuarto grado de Ontario consta de seis ejes temáticos: habilidades de aprendizaje socioemocional, números, álgebra, datos, percepción espacial y educación financiera. El museo muestra en su mapa partes de los ejes B, C, E y F."
  fr: "Le programme de mathématiques de 4e année de l'Ontario comporte six volets: compétences socio-émotionnelles, nombres, algèbre, données, sens spatial et littératie financière. Le musée présente des éléments des volets B, C, E et F."
  tr: "Ontario'daki dördüncü sınıf matematik müfredatı altı modülden oluşmaktadır: sosyal-duygusal öğrenme becerileri, sayılar, cebir, veri, mekansal farkındalık ve finansal okuryazarlık. Müze, bu modüllerin yalnızca bazı kısımlarını B, C, E ve F bölümlerine bağlamaktadır."
  id: "Kurikulum matematika kelas empat di Ontario memiliki enam modul: keterampilan belajar sosial-emosional, angka, aljabar, data, kesadaran spasial, dan literasi keuangan. Museum ini hanya menghubungkan sebagian dari modul-modul tersebut dengan bagian B, C, E, dan F."
