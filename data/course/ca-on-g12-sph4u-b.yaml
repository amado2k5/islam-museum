- code: B2
  text:
    en: investigate, in qualitative and quantitative terms, forces involved in uniform circular motion and motion in a plane, and solve related problems
    ar: استقصِ، كيفيًّا وكميًّا، القوى المتدخلة في الحركة الدائرية المنتظمة والحركة في مستوٍ، واحلّ المسائل المتصلة بها
    ur: کیفیتی اور کمیتی دونوں اعتبار سے یکساں دائروی حرکت اور سطح میں حرکت میں شامل قوتوں کی تحقیق کریں، اور متعلقہ مسائل حل کریں
- code: B3
  text:
    en: demonstrate an understanding of the forces involved in uniform circular motion and motion in a plane
    ar: أظهر فهمًا للقوى المتدخلة في الحركة الدائرية المنتظمة والحركة في مستوٍ
    ur: یکساں دائروی حرکت اور سطح میں حرکت میں شامل قوتوں کی سمجھ کا مظاہرہ کریں
