expectations:
- code: B1
  text:
    en: analyse technological devices that apply the principles of the dynamics of motion, and assess the technologies’ social and environmental impact
    ar: حلِّل أجهزة تقنية تطبّق مبادئ ديناميكا الحركة، وقيِّم أثر هذه التقنيات في المجتمع والبيئة
