  kind: invention
  title:
    ar: نسبة المحيط إلى القطر «اصطلاح»
    en: The ratio of circumference to diameter as a convention
    ur: محیط اور قطر کی نسبت ایک اصطلاح
  text:
    ar: 'يقول الخوارزمي في باب المساحة من كتابه إن جعل المحيط القطر في ثلاثة وسبع «اصطلاح بين الناس من غير اضطرار». ويذكر قولين آخرين، منهما قول أهل النجوم: أن تضرب القطر في 62832 وتقسم على 20000، ويقول إن ذلك كله قريب بعضه من بعض. ويعلّق محققا طبعة القاهرة بأن أقرب هذه القيم إلى الحقيقة قيمة أهل النجوم. لماذا يسمّي قيمةً ما «اصطلاحاً»؟'
    en: 'In the mensuration chapter of his book, al-Khwarizmi says that taking the circumference as three and a seventh times the diameter is "a convention among people, not a necessity". He gives two other views, one of them the astronomers'' rule: multiply the diameter by 62,832 and divide by 20,000, and says all of them are close to one another. The Cairo editors comment that the astronomers'' value is the closest to the truth. Why might he call a value a convention?'
    ur: 'خوارزمی اپنی کتاب کے باب مساحت میں کہتے ہیں کہ محیط کو قطر کا تین اور ایک ساتواں گنا ماننا «لوگوں میں ایک اصطلاح ہے، کوئی لازمی بات نہیں»۔ وہ دو اور قول بیان کرتے ہیں، جن میں اہلِ نجوم کا قاعدہ ہے: قطر کو 62832 سے ضرب دے کر 20000 پر تقسیم کرو؛ اور کہتے ہیں کہ یہ سب ایک دوسرے کے قریب ہیں۔ قاہرہ ایڈیشن کے محققین تبصرہ کرتے ہیں کہ اہلِ نجوم کی قیمت حقیقت سے سب سے قریب ہے۔ وہ کسی قیمت کو اصطلاح کیوں کہتے ہیں؟'
  entity: concept/ilm-al-misaha
