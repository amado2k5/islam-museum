  title:
    en: Grades of eating
    ar: درجات الأكل
    ur: کھانے کے درجے
  text:
    en: The record sets out grades of eating by need. Eating is obligatory up to what keeps a person alive, required for standing prayer and obligatory fasts, recommended for earning and learning, permitted up to satiety, and forbidden beyond satiety or where it is known to damage the stomach. These grades are the encyclopaedia's legal classification, not dietary advice. Which of these grades depends on the person's health or way of life?
    ar: يعرض السجل درجات الأكل بحسب الحاجة. فالأكل فرض بقدر ما يدفع الهلاك، وواجب بقدر ما يقوم به المكلف من الصلاة قائمًا والصوم، ومندوب لتحصيل الرزق والعلم، ومباح إلى حد الشبع، وحرام فوق الشبع أو إذا علم أنه يفسد المعدة. وهذه الدرجات تصنيف فقهي لا نصيحة غذائية. أي هذه الدرجات يتعلق بصحة الإنسان أو بنمط حياته؟
    ur: ریکارڈ ضرورت کے لحاظ سے کھانے کے درجے بیان کرتا ہے۔ کھانا اتنا فرض ہے جس سے ہلاکت دور ہو، اتنا واجب ہے جس سے مکلف کھڑے ہو کر نماز پڑھ سکے اور روزہ رکھ سکے، کمائی اور علم کے لیے مستحب ہے، سیری تک مباح ہے، اور سیری سے زیادہ یا جب معلوم ہو کہ معدے کو خراب کرے گا تو حرام ہے۔ یہ درجے فقہی درجہ بندی ہیں، غذائی مشورہ نہیں۔ ان میں سے کون سا درجہ صحت یا طرزِ زندگی پر منحصر ہے؟
