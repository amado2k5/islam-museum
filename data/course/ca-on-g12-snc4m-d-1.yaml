  title:
    en: Keeping the sick from what harms
    ar: منع المريض مما يضره
    ur: بیمار کو نقصان دہ چیز سے روکنا
  text:
    en: 'Hamiyya lexically means prohibition: keeping the sick from what harms him. The record calls it a lawful form of treatment. It gives the narration of Umm al-Mundhir in which the Prophet ordered Ali to avoid food and to take barley and chard (silq), and Umar''s keeping a sick man from food until he sucked a date-stone. The encyclopaedia adds that the diet is to follow the principles of medicine and sound experience. These are historical reports and a legal ruling about treatment, not dietary or medical advice; someone who is ill should follow a doctor''s advice.'
    ar: الحمية في اللغة المنع، وحمى المريض ما يضره. ويعدّها السجل نوعًا من التداوي مشروعًا. ويورد حديث أم المنذر في أن النبي نهى عليًا عن الطعام وأمر بالشعير والسلق، وما عن عمر من أنه كان يحمي المريض حتى يمتص النوى. وتضيف الموسوعة أنه يراعى في الحمية أصول الطب والتجربة الصحيحة. وهذه روايات تاريخية وحكم فقهي في التداوي، لا نصيحة غذائية أو طبية؛ ومن كان مريضًا فليتبع نصيحة طبيبه.
    ur: حمیہ کا لغوی معنی روکنا ہے، یعنی بیمار کو اس چیز سے روکنا جو اسے نقصان دے۔ ریکارڈ اسے علاج کی ایک جائز صورت بتاتا ہے۔ وہ ام المنذر کی روایت دیتا ہے کہ نبی نے علی کو کھانے سے روکا اور جو اور سلق، یعنی چقندر کے خاندان کا ساگ، کا حکم دیا، اور عمر کا بیمار کو کھانے سے روکے رکھنا یہاں تک کہ وہ گٹھلی چوسے۔ موسوعہ مزید کہتا ہے کہ پرہیز میں طب کے اصولوں اور صحیح تجربے کی رعایت کی جاتی ہے۔ یہ تاریخی روایات اور علاج کے بارے میں ایک فقہی حکم ہیں، غذائی یا طبی مشورہ نہیں؛ جو بیمار ہو وہ ڈاکٹر کے مشورے پر چلے۔
