expectations:
- code: B1
  text:
    en: demonstrate an understanding of the critical analysis process by examining, interpreting, evaluating, and reflecting on various art works
    ar: أظهر فهمًا لعملية التحليل النقدي بفحص أعمال فنية متنوعة وتفسيرها وتقييمها والتأمل فيها
    ur: مختلف فن پاروں کا جائزہ لے کر، ان کی تعبیر اور تشخیص کر کے اور ان پر غور کر کے تنقیدی تجزیے کے عمل کی سمجھ کا مظاہرہ کریں
- code: B2
  text:
    en: demonstrate an understanding of how art works reflect the society in which they were created, and of how they can affect both social and personal values
    ar: أظهر فهمًا لكيفية انعكاس المجتمع الذي أُنشئت فيه الأعمال الفنية عليها، ولكيفية تأثيرها في القيم الاجتماعية والشخصية معًا
    ur: اس بات کی سمجھ کا مظاہرہ کریں کہ فن پارے اس معاشرے کو کیسے ظاہر کرتے ہیں جس میں وہ تخلیق ہوئے، اور وہ سماجی اور ذاتی دونوں اقدار پر کیسے اثر ڈال سکتے ہیں
- code: B3
  text:
    en: describe opportunities and requirements for continued engagement in visual arts
    ar: صف الفرص والمتطلبات اللازمة لمواصلة الانخراط في الفنون البصرية
    ur: بصری فنون میں مسلسل شمولیت کے مواقع اور تقاضوں کو بیان کریں
