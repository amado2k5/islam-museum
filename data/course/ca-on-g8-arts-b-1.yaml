  title:
    en: A dramatist of the Caucasus
    ar: كاتب مسرحي من القوقاز
    ur: قفقاز کا ایک ڈرامہ نگار
  text:
    en: Mirza Fath 'Ali Akhund-zada was the first writer of original plays in a Turkish idiom, the Azerbaijani Turkish of the Caucasus. Between 1850 and 1857 he wrote six comedies and a historical-satirical narrative, putting progressive ideas against feudalism, the corruption of justice and superstition. Pupils of the Azerbaijani state schools gave the first performances in the original language at the end of the 1870s. How might a play help a community think about its own problems?
    ar: ميرزا فتح علي آخوندزاده أول من كتب مسرحيات أصيلة بالتركية، أي الأذربيجانية في القوقاز. وبين 1850 و1857م كتب ست ملاهٍ وحكاية تاريخية هزلية، وضمّنها أفكارًا تقدمية ضد الإقطاع وفساد القضاء والخرافات. وقدّم تلاميذ المدارس الحكومية الأذربيجانية أولى العروض باللغة الأصلية في نهاية سبعينيات القرن التاسع عشر. كيف قد تعين مسرحية جماعةً على التفكير في مشكلاتها؟
    ur: میرزا فتح علی آخوند زادہ ترکی لہجے، یعنی قفقاز کی آذربائیجانی ترکی، میں اصل ڈرامے لکھنے والے پہلے مصنف تھے۔ 1850ء اور 1857ء کے درمیان انہوں نے چھ مزاحیہ ڈرامے اور ایک تاریخی طنزیہ حکایت لکھی، جن میں جاگیرداری، انصاف کی بدعنوانی اور توہم پرستی کے خلاف ترقی پسند خیالات رکھے۔ آذربائیجانی سرکاری اسکولوں کے طلبہ نے 1870ء کی دہائی کے آخر میں اصل زبان میں پہلی پیش کشیں کیں۔ کوئی ڈرامہ کسی برادری کو اپنے مسائل پر سوچنے میں کیسے مدد دے سکتا ہے؟
