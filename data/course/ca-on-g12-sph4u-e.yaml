expectations:
- code: E1
  text:
    en: analyse technologies that use the wave nature of light, and assess their impact on society and the environment
    ar: حلِّل تقنيات تستعمل الطبيعة الموجية للضوء، وقيِّم أثرها في المجتمع والبيئة
    ur: ایسی ٹیکنالوجیز کا تجزیہ کریں جو روشنی کی موجی نوعیت استعمال کرتی ہیں، اور ان کے سماج اور ماحول پر اثر کا جائزہ لیں
- code: E2
  text:
    en: investigate, in qualitative and quantitative terms, the properties of waves and light, and solve related problems
    ar: استقصِ، كيفيًّا وكميًّا، خصائص الموجات والضوء، واحلّ المسائل المتصلة بها
    ur: کیفیتی اور کمیتی دونوں اعتبار سے لہروں اور روشنی کی خصوصیات کی تحقیق کریں، اور متعلقہ مسائل حل کریں
- code: E3
  text:
    en: demonstrate an understanding of the properties of waves and light in relation to diffraction, refraction, interference, and polarization
    ar: أظهر فهمًا لخصائص الموجات والضوء في ما يتعلق بالحيود والانكسار والتداخل والاستقطاب
    ur: انعراج، انعطاف، تداخل اور استقطاب کے سلسلے میں لہروں اور روشنی کی خصوصیات کی سمجھ کا مظاہرہ کریں
