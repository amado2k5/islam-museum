  title:
    en: Seven climates
    ar: الأقاليم السبعة
    ur: سات اقلیمیں
  text:
    en: Al-Masudi reports that, according to the astronomers, each quarter of the earth contains seven climates, and that inhabited land extends twenty-four degrees beyond the equator, the rest being covered by the sea. The southern quarter is empty of people, ruined by heat, and the best inhabited land is the fourth climate, where the sun's rays fall clear. This is a medieval view, and it is not what modern climate maps show. Al-Muqaddasi divided the lands of Islam differently, into fourteen climates. Why might people divide the earth into bands?
    ar: ينقل المسعودي عن أهل الهيئة أن لكل ربع من الأرض سبعة أقاليم، وأن العمارة بعد خط الاستواء أربع وعشرون درجة، والباقي يعمّه البحر. ويخلو الربع الجنوبي من الخلق خرابًا لشدة الحر، وأفضل المسكون الإقليم الرابع حيث ينتهي شعاع الشمس صافيًا. هذا رأي وسيط، وليس ما تُظهره خرائط المناخ الحديثة. وخالفهم المقدسي فجعل أقاليم الإسلام أربعة عشر. لماذا يقسم الناس الأرض إلى نطق؟
    ur: المسعودی اہلِ ہیئت سے نقل کرتے ہیں کہ زمین کے ہر ربع میں سات اقلیمیں ہیں، اور آباد زمین خطِ استوا کے بعد چوبیس درجے تک ہے، باقی کو سمندر ڈھانپتا ہے۔ جنوبی ربع شدید گرمی سے ویران اور انسانوں سے خالی ہے، اور بہترین آباد زمین چوتھی اقلیم ہے جہاں سورج کی شعاع صاف پہنچتی ہے۔ یہ قرونِ وسطیٰ کا نقطۂ نظر ہے، اور جدید موسمی نقشے یہ نہیں دکھاتے۔ مقدسی نے اسلامی سرزمین کو مختلف طرح سے چودہ اقلیموں میں بانٹا۔ لوگ زمین کو پٹیوں میں کیوں بانٹتے ہیں؟
