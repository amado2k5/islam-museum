- position: after
  kind: story
  title:
    en: The Farewell Pilgrimage
    ar: حجة الوداع
    ur: حجۃ الوداع
  text:
    en: Ibn Hisham, relaying Ibn Ishaq, calls the Farewell Pilgrimage the only pilgrimage the Prophet performed after the Hijra, in the tenth year of the Hijra. He says the Prophet showed the people their rites and delivered his well-known sermon, and that it is called the Farewell Pilgrimage because he did not perform the pilgrimage again after it. What does an episode like this show about the role of a founding figure?
    ar: يسمّي ابن هشام، ناقلًا عن ابن إسحاق، حجة الوداع الحجة الوحيدة التي أدّاها النبي بعد الهجرة، في السنة العاشرة للهجرة. ويقول إنه أرى الناس مناسكهم وخطب خطبته المعروفة، وإنها سُمّيت حجة الوداع لأنه لم يحج بعدها. ماذا تُظهر حادثة كهذه عن دور الشخصية المؤسِّسة؟
    ur: ابن ہشام، ابن اسحاق سے نقل کرتے ہوئے، حجۃ الوداع کو وہ واحد حج قرار دیتے ہیں جو نبی نے ہجرت کے بعد ادا کیا، ہجرت کے دسویں سال میں۔ وہ کہتے ہیں کہ آپ نے لوگوں کو ان کے مناسک دکھائے اور اپنا معروف خطبہ دیا، اور اسے حجۃ الوداع اس لیے کہا گیا کہ اس کے بعد آپ نے حج نہیں کیا۔ ایسا واقعہ کسی بانی شخصیت کے کردار کے بارے میں کیا ظاہر کرتا ہے؟
  entity: event/farewell-pilgrimage
