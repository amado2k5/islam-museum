connections:
- position: before
  kind: story
  title:
    en: The Prophet of Islam
    ar: نبي الإسلام
    ur: اسلام کے نبی
  text:
    en: Al-Mubarakpuri, in The Sealed Nectar, gives Muhammad as the Prophet of Islam, born in Mecca about 570 CE. He relates that when Muhammad had completed forty years the revelation came to him in the cave of Hira; he then emigrated to Medina, and died there in 11 AH, having completed sixty-three years. Which of these are episodes, and which show a role?
    ar: يقدّم المباركفوري في «الرحيق المختوم» محمدًا نبيَّ الإسلام، وُلد بمكة نحو سنة 570م. ويروي أنه لما أتمّ أربعين سنة جاءه الوحي بغار حراء، ثم هاجر إلى المدينة وتوفي بها سنة 11هـ وقد أتمّ ثلاثًا وستين سنة. أيّ هذه أحداث، وأيّها يدل على دور؟
    ur: مبارکپوری «الرحیق المختوم» میں محمد کو اسلام کے نبی کے طور پر بیان کرتے ہیں جو تقریباً 570 عیسوی میں مکہ میں پیدا ہوئے۔ وہ بیان کرتے ہیں کہ جب وہ چالیس برس مکمل کر چکے تو غارِ حرا میں ان پر وحی آئی؛ پھر انہوں نے مدینہ ہجرت کی اور وہیں سن 11 ہجری میں تریسٹھ برس پورے کر کے وفات پائی۔ ان میں سے کون سی باتیں واقعات ہیں اور کون سی کردار کو ظاہر کرتی ہیں؟
  entity: person/muhammad
