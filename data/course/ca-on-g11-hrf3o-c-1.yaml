- position: within
  kind: story
  title:
    en: The journey to Medina
    ar: رحلة إلى المدينة
    ur: مدینہ کا سفر
  text:
    en: Al-Mubarakpuri, in The Sealed Nectar, and al-Mas'udi, in Muruj al-dhahab, describe the Hijra as the migration of the Prophet Muhammad from Mecca to Medina in 622 CE, the fourteenth year of the mission. Ibn Ishaq and al-Bukhari report that his companions had begun to emigrate before him; al-Mubarakpuri says he hid in the cave of Thawr for three nights and then travelled to Medina. Why might a community remember a journey as a turning point?
    ar: يصف المباركفوري في «الرحيق المختوم» والمسعودي في «مروج الذهب» الهجرة بأنها انتقال النبي محمد من مكة إلى المدينة سنة 622م، في السنة الرابعة عشرة من البعثة. ويروي ابن إسحاق والبخاري أن أصحابه بدؤوا الهجرة قبله، ويقول المباركفوري إنه اختبأ في غار ثور ثلاث ليال، ثم سار من الغار إلى المدينة. لماذا قد تتذكّر جماعةٌ رحلةً بوصفها منعطفًا؟
    ur: مبارکپوری «الرحیق المختوم» میں اور مسعودی «مروج الذہب» میں ہجرت کو نبی محمد کے مکہ سے مدینہ کی طرف 622 عیسوی میں، بعثت کے چودھویں سال، منتقل ہونے کے طور پر بیان کرتے ہیں۔ ابن اسحاق اور بخاری روایت کرتے ہیں کہ ان کے ساتھیوں نے ان سے پہلے ہجرت شروع کر دی تھی؛ مبارکپوری کہتے ہیں کہ وہ تین راتیں غارِ ثور میں چھپے رہے اور پھر مدینہ کی طرف روانہ ہوئے۔ ایک جماعت کسی سفر کو موڑ کے طور پر کیوں یاد رکھتی ہے؟
