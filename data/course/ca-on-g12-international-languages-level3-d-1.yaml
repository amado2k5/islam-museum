  title:
    en: A hospital in Baghdad
    ar: مستشفى في بغداد
    ur: بغداد کا ایک ہسپتال
  text:
    en: The Adudi Bimaristan in Baghdad was the hospital built by the Buyid Adud al-Dawla, opened at the beginning of Rabi II 372 AH. According to Ibn al-Jawzi's al-Muntazam, physicians, medicines, stewards, servants, vessels and clothing were gathered there, endowments were set for those who stayed, and the poor were given the clothing and vessels that left it. What would you compare in a paragraph?
    ar: البيمارستان العضدي في بغداد هو المستشفى الذي بناه عضد الدولة البويهي، وافتُتح في بداية ربيع الآخر سنة 372هـ. وبحسب «المنتظم» لابن الجوزي جُمع فيه الأطباء والأدوية والقوّام والخدم والأواني والثياب، ووُقف على من نزل به، وأُعطي الفقراء ما يخرج منه من الثياب والأواني. ماذا ستقارن في فقرة؟
    ur: بغداد کا البیمارستان العضدی وہ ہسپتال تھا جو بویہی حکمران عضد الدولہ نے بنوایا اور جو ربیع الثانی 372ھ کے آغاز میں کھلا۔ ابن الجوزی کی «المنتظم» کے مطابق اس میں طبیب، دوائیں، منتظم، خادم، برتن اور کپڑے جمع کیے گئے، وہاں ٹھہرنے والوں کے لیے وقف مقرر ہوئے، اور غریبوں کو اس سے نکلنے والے کپڑے اور برتن دیے گئے۔ آپ ایک پیراگراف میں کیا موازنہ کریں گے؟
  entity: building/bimaristan-adudi
  sources:
  - source/muntazam-ibn-al-jawzi
- position: within
  kind: invention
  title:
    en: A hospital with conditions of admission and discharge
    ar: مستشفى بشروط للقبول والخروج
    ur: داخلے اور رخصتی کی شرطوں والا ہسپتال
  text:
    en: Al-Maqrizi quotes the compiler of the Tulunid biography that Ahmad ibn Tulun established a hospital in the Fustat area, endowed it with properties and set conditions for admission, care and discharge. The administration kept a patient's clothes and money safe, supplied dress, bedding, medicines and food until recovery, and returned belongings on discharge. How would you describe this care to readers in Ontario?
    ar: ينقل المقريزي عن جامع السيرة الطولونية أن أحمد بن طولون أنشأ في منطقة الفسطاط بيمارستاناً أوقف عليه عقارات، وحدد شروط قبول المرضى والعناية بهم وخروجهم. وكانت الإدارة تحفظ ثياب المريض وماله، وتوفر له لباساً وفراشاً ودواءً وغذاءً إلى أن يتعافى، ثم ترد إليه أمتعته عند الخروج. كيف ستصف هذه الرعاية لقراء في أونتاريو؟
    ur: المقریزی تولونی سوانح کے مرتب سے نقل کرتے ہیں کہ احمد بن طولون نے فسطاط کے علاقے میں ایک ہسپتال قائم کیا، اس پر جائیدادیں وقف کیں اور مریضوں کے داخلے، نگہداشت اور رخصتی کی شرطیں مقرر کیں۔ انتظامیہ مریض کے کپڑے اور مال محفوظ رکھتی، شفا پانے تک اسے لباس، بستر، دوا اور غذا دیتی، اور رخصتی پر اس کا سامان لوٹا دیتی۔ آپ اونٹاریو کے قارئین کو یہ نگہداشت کیسے بیان کریں گے؟
