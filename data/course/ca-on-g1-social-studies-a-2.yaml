  title:
    en: The rights of a neighbour
    ar: حقوق الجار
    ur: پڑوسی کے حقوق
  text:
    en: The Kuwaiti jurisprudence encyclopaedia says that jiwar covers the rights a neighbour has over a neighbour, and that a neighbour's rights limit how an owner may use his property where it harms the neighbour. What does a good neighbour do on your street?
    ar: تذكر الموسوعة الفقهية الكويتية أن الجوار ما تتعلق به حقوق الجار على جاره، وأن حقوق الجيران تقيّد تصرف المالك في ملكه حيث يضر بجاره. ماذا يفعل الجار الطيب في شارعك؟
    ur: کویتی فقہی انسائیکلوپیڈیا کے مطابق جوار وہ ہے جس سے پڑوسی کے اپنے پڑوسی پر حقوق متعلق ہوتے ہیں، اور پڑوسیوں کے حقوق مالک کو اس کی ملکیت میں ایسا تصرف کرنے سے روکتے ہیں جس سے پڑوسی کو نقصان پہنچے۔ آپ کی گلی میں اچھا پڑوسی کیا کرتا ہے؟
