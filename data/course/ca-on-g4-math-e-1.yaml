  title:
    en: A cubit by a cubit
    ar: ذراع في ذراع
    ur: ایک ذراع ضرب ایک ذراع
  text:
    en: Mensuration, the record says, is the science of measuring surfaces and solids. Al-Khwarizmi gave it a chapter of his book on al-jabr and al-muqabala, which opens by saying that "one by one" means an area, that is, a cubit by a cubit. A square of side two is four times that area. How many such squares fit in a rectangle three units by four?
    ar: يقول السجل إن المساحة علم قياس السطوح والأجسام، وقد خصّه الخوارزمي بباب في كتابه الجبر والمقابلة يبدأ بأن معنى «واحد في واحد» إنما هو مساحة، ومعناه ذراع في ذراع. والمربع المتساوي الأضلاع الذي ضلعه اثنان أربعة أمثال هذا السطح. كم مربعاً من هذه المربعات يتسع له مستطيل طوله ثلاث وحدات وعرضه أربع؟
    ur: ریکارڈ کہتا ہے کہ مساحت سطحوں اور اجسام کی پیمائش کا علم ہے۔ خوارزمی نے اپنی کتاب الجبر والمقابلہ میں اس کے لیے ایک باب رکھا جو اس بات سے شروع ہوتا ہے کہ «ایک ضرب ایک» کا مطلب رقبہ ہے، یعنی ایک ذراع ضرب ایک ذراع۔ جس مربع کا ضلع دو ہو وہ اس رقبے کا چار گنا ہے۔ تین اکائی لمبے اور چار اکائی چوڑے مستطیل میں ایسے کتنے مربع سماتے ہیں؟
