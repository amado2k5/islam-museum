  title:
    en: What do jurists say about making images?
    ar: ماذا قال الفقهاء في صناعة الصور؟
    ur: تصویر بنانے کے بارے میں فقہا کیا کہتے ہیں؟
  text:
    en: The Kuwaiti Fiqh Encyclopedia defines tasweer as making an image. It says depicting plants and trees is lawful for the majority, and that jurists differ on images of humans and animals. One view holds it is not forbidden unless one makes an idol worshipped besides God. Another, that of the Malikis, some early scholars and Ibn Hamdan, forbids only images that are three-dimensional and complete in their limbs, and dislikes flat ones. The majority of the Hanafis, Shafi'is and Hanbalis, and many early scholars, forbid making flat images as they forbid three-dimensional ones, except the cut-off, the demeaned and some other things. How might views like these shape what an artist chooses to make?
    ar: تعرّف الموسوعة الفقهية الكويتية التصوير بأنه صنع الصورة. وتذكر أن تصوير النباتات والأشجار جائز عند الجمهور، وأن العلماء اختلفوا في صورة ذوات الأرواح. قال بعضهم إنه غير حرام إلا إن صُنع صنمًا يُعبد من دون الله. وقول آخر، هو مذهب المالكية وبعض السلف وابن حمدان، أنه لا يحرم إلا ما كان مجسمًا كامل الأعضاء، وأن المسطحة مكروهة. وذهب جمهور الحنفية والشافعية والحنابلة، ونُقل عن كثير من السلف، إلى تحريم صناعة الصور المسطحة كالمجسمة، واستثنوا منها المقطوعة والممتهنة وأشياء أخرى. كيف يمكن لآراء كهذه أن تشكّل ما يختار الفنان صنعه؟
    ur: کویتی فقہی انسائیکلوپیڈیا تصویر کی تعریف تصویر بنانے کے عمل کے طور پر کرتا ہے۔ وہ بتاتا ہے کہ پودوں اور درختوں کی تصویر بنانا جمہور کے نزدیک جائز ہے، اور انسانوں اور جانداروں کی تصویر میں فقہا مختلف ہیں۔ ایک قول کے مطابق وہ حرام نہیں سوائے اس کے کہ کوئی ایسا بت بنایا جائے جسے اللہ کے سوا پوجا جائے۔ دوسرا قول، جو مالکیہ، بعض سلف اور ابن حمدان کا ہے، صرف اس تصویر کو حرام کہتا ہے جو مجسم اور تمام اعضا کے ساتھ مکمل ہو، اور مسطح تصویر کو مکروہ کہتا ہے۔ حنفیہ، شافعیہ اور حنابلہ کی اکثریت اور بہت سے سلف مسطح تصویریں بنانے کو بھی مجسم کی طرح حرام کہتے ہیں، سوائے کٹی ہوئی، پامال اور کچھ دوسری صورتوں کے۔ ایسے اقوال ایک فن کار کے بنانے کے انتخاب کو کیسے ڈھال سکتے ہیں؟
