  title:
    en: A building raised over a remembered place
    ar: بناء أُقيم فوق موضع يُتذكَّر
    ur: یاد کی جانے والی جگہ پر اٹھائی گئی عمارت
  text:
    en: Muhammad Qabbani writes that Abd al-Malik ibn Marwan ordered, in 72 AH, a mosque to be built over the Rock from which, he says, the Prophet was taken up on the night of the Isra and Mi'raj, and he counts it among the best-known mosques the Umayyads raised. The Thesaurus d'Epigraphie Islamique records for it a building inscription dated 72 AH. What can a building do for a place that people already remember?
    ar: يذكر محمد قباني أن عبد الملك بن مروان أمر سنة 72هـ ببناء مسجد فوق الصخرة التي يقول إن النبي عُرج به من فوقها ليلة الإسراء والمعراج، ويعدّه من أشهر المساجد التي أقامها الأمويون. ويسجّل قاموس النقوش الإسلامية لها نقشًا بنائيًا مؤرخًا بسنة 72هـ. ماذا يمكن لبناء أن يفعل لموضع يتذكّره الناس أصلًا؟
    ur: محمد قبانی لکھتے ہیں کہ عبد الملک بن مروان نے سنہ 72ھ میں اس چٹان کے اوپر مسجد بنانے کا حکم دیا جس کے اوپر سے، ان کے بقول، نبی کو شبِ اسرا و معراج میں اٹھایا گیا، اور وہ اسے ان مشہور ترین مسجدوں میں شمار کرتے ہیں جو بنو امیہ نے بنائیں۔ مجمعِ نقوشِ اسلامی (Thesaurus d'Epigraphie Islamique) اس کے لیے سنہ 72ھ کا ایک تعمیری کتبہ درج کرتا ہے۔ ایک عمارت اس جگہ کے لیے کیا کر سکتی ہے جسے لوگ پہلے سے یاد رکھتے ہیں؟
