  kind: story
  title:
    en: Amber, the electric word
    ar: العنبر، الكلمة الكهربائية
    ur: 'کہربا — برقی لفظ'
  text:
    en: 'Rub amber and it attracts straw — Greeks knew that (their word elektron gave ''electricity''). Arabic kept its own memory of the same trick: kahraba, the word for electricity today, comes from
      kahruba, amber. Two languages, one rubbed stone.'
    ar: 'افرك العنبر فيجذب القش — عرفها اليونان ⁦(ومن كلمتهم إلكترون جاءت electricity)⁩. وحفظت العربية ذكرى الحيلة ذاتها: فكلمة كهرباء مشتقة من كَهْرُبا أي العنبر. لغتان وحجر واحد مُدلِك.'
    ur: 'کہربا رگڑو تو بھوسے کو کھینچتی ہے — یونانی یہ جانتے تھے ⁦(ان کے لفظ elektron سے electricity بنا)⁩۔ عربی نے بھی اسی چال کی یاد رکھی: آج بجلی کو «کہرُبا» کہتے ہیں، یعنی کہربا سے۔ دو زبانیں، ایک رگڑا ہوا پتھر۔'
