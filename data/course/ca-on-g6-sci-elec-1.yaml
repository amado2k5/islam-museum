  title:
    en: Hidden force, visible sign
    ar: قوة خفية وأثر بيّن
  text:
    en: An invisible force that moves things was a wonder to experimenters from Baghdad to Europe. Wonder, in the Qur'anic sense, is a beginning of knowledge — 'the lightning shows you fear and hope' (13:12).
    ar: كانت القوة الخفية التي تحرك الأشياء عجيبة لدى المجربين من بغداد إلى أوروبا؛ والدهشة بمعناها القرآني بداية معرفة — «هو الذي يريكم البرق خوفًا وطمعًا» (13:12).
