- position: within
  kind: reflection
  title:
    en: God is one, and nothing is like Him
    ar: الله واحد ولا شيء مثله
    ur: اللہ ایک ہے اور کوئی اس جیسا نہیں
  text:
    en: Al-Tahawi, opening his statement of the creed of the people of the Sunna, says that God is one without partner, that nothing is like Him and that there is no god but He. He adds that imaginations do not reach Him and that He does not resemble mortals. How does this description answer the expectation's question about the nature of the divine?
    ar: يفتتح الطحاوي بيانه لعقيدة أهل السنة والجماعة بقوله إن الله واحد لا شريك له، ولا شيء مثله، ولا إله غيره. ويضيف أن الأوهام لا تبلغه وأنه لا يشبه الأنام. كيف يجيب هذا الوصف عن سؤال التوقع عن طبيعة الإلهي؟
    ur: طحاوی اہلِ سنت و جماعت کے عقیدے کا بیان شروع کرتے ہوئے کہتے ہیں کہ اللہ ایک ہے، اس کا کوئی شریک نہیں، اس جیسا کوئی نہیں اور اس کے سوا کوئی معبود نہیں۔ وہ مزید کہتے ہیں کہ تصورات اس تک نہیں پہنچتے اور وہ انسانوں کے مشابہ نہیں۔ یہ بیان توقع کے اس سوال کا کیا جواب دیتا ہے کہ الٰہی کی ماہیت کیا ہے؟
