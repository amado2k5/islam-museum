  title:
    en: The first of the five
    ar: أول الخمسة
    ur: پانچ میں پہلی بات
  text:
    en: Ibn Khuzayma's Sahih gives the two testimonies as the testimony that there is no god but God and that Muhammad is God's messenger. They are the first thing the Prophet mentioned in his saying, as Ibn Khuzayma gives it, that Islam is built on five. Where does this faith begin when it speaks of the divine?
    ar: يذكر ابن خزيمة في صحيحه الشهادتين بأنهما الشهادة بألّا إله إلا الله وأن محمدًا رسول الله، وهما أول ما ذكره النبي في قوله، كما يرويه ابن خزيمة، إن الإسلام بُني على خمس. من أين يبدأ هذا الدين حين يتحدث عن الإلهي؟
    ur: ابن خزیمہ اپنی صحیح میں دو گواہیوں کو اس شہادت کے طور پر بیان کرتے ہیں کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں۔ یہ پہلی بات ہے جو نبی نے اپنے اس فرمان میں ذکر کی، جیسا کہ ابن خزیمہ نے روایت کیا ہے، کہ اسلام پانچ چیزوں پر قائم ہے۔ جب یہ دین الٰہی کی بات کرتا ہے تو کہاں سے آغاز کرتا ہے؟
  entity: concept/shahada
  sources:
