summary:
  en: 'The 2023 Ontario Grade 4 Social Studies course has two strands: Heritage and Identity: Early Societies to 1500 CE, and People and Environments: Political and Physical Regions of Canada. The museum maps strand A only.'
  ar: 'مقرر الدراسات الاجتماعية للصف الرابع في منهاج أونتاريو 2023 له محوران: التراث والهوية: المجتمعات المبكرة حتى عام 1500م، والناس والبيئات: المناطق السياسية والطبيعية في كندا. ولا يربط المتحف إلا المحور الأول.'
  ur: 'اونٹاریو کے 2023 کے نصاب میں چوتھی جماعت کے سماجی علوم کے دو محور ہیں: ورثہ اور شناخت: ابتدائی معاشرے 1500ء تک، اور لوگ اور ماحول: کینیڈا کے سیاسی اور طبعی خطے۔ عجائب گھر صرف پہلے محور کو جوڑتا ہے۔'
  es: "El curso de Estudios Sociales de cuarto grado de Ontario para 2023 consta de dos ejes temáticos: Patrimonio e identidad: desde las primeras sociedades hasta el año 1500 d. C., y Personas y entornos: regiones políticas y físicas de Canadá. El mapa del museo corresponde únicamente al eje A."
  fr: "Le programme d’études sociales de 4e année de l’Ontario (2023) comporte deux volets: Patrimoine et identité: des premières sociétés à 1500 apr. J.-C., et Population et environnement: régions politiques et physiques du Canada. Les cartes du musée couvrent uniquement le volet A."
