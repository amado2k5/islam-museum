  title:
    en: Where the Moon's light comes from
    ar: من أين يأتي نور القمر
    ur: چاند کی روشنی کہاں سے آتی ہے
  text:
    en: Al-Farghani shows that the moon is lit by the sun's light, so the half of its disc facing the sun is bright. At opposition the moon enters the earth's shadow, which is a cone narrowing as it extends. Of the two bodies, which gives light, and which is only lit?
    ar: يبيّن الفرغاني أن القمر يستضيء بنور الشمس، فيكون نصف كرته المقابل للشمس مضيئاً. وعند المقابلة يدخل القمر ظل الأرض، ويكون ظل الأرض مخروطاً يضيق كلما امتد. أيّ الجرمين يعطي الضوء، وأيّهما مستنير فقط؟
    ur: الفرغانی بتاتا ہے کہ چاند سورج کی روشنی سے روشن ہوتا ہے، اس لیے اس کے گولے کا سورج کے سامنے والا آدھا حصہ روشن ہوتا ہے۔ مقابلے کے وقت چاند زمین کے سائے میں داخل ہوتا ہے، اور زمین کا سایہ ایک مخروط ہے جو پھیلتے پھیلتے تنگ ہوتا جاتا ہے۔ ان دونوں اجرام میں سے کون روشنی دیتا ہے اور کون صرف روشن ہوتا ہے؟
  entity: concept/eclipses
  sources:
  - source/farghani-elements-astronomy
- position: after
  kind: story
  title:
    en: The lit part of the Moon, first sighted
    ar: الجزء المضيء من القمر وأول رؤيته
    ur: چاند کا روشن حصہ، پہلی بار دیکھا گیا
  text:
    en: The Kuwaiti Encyclopaedia of Fiqh gives hilal, technically, as the first sighting of the lit part of the moon on the first night. It adds that the size of the crescent is no guide to the start of the month; what counts is the night of sighting. Which body lights the part of the Moon that is sighted?
    ar: تذكر الموسوعة الفقهية الكويتية أن الهلال في الاصطلاح ما يُرى من المضيء من القمر أول ليلة. وتذكر أنه لا يُعوَّل على كبر الهلال أو صغره في تحديد أول الشهر، وإنما هو ابن ليلة الرؤية. أي جرم يضيء الجزء الذي يُرى من القمر؟
    ur: کویتی فقہی انسائیکلوپیڈیا کے مطابق اصطلاح میں ہلال چاند کے روشن حصے کا پہلی رات پہلی بار دکھائی دینا ہے۔ وہ یہ بھی بتاتا ہے کہ مہینے کے آغاز کے تعین میں ہلال کے چھوٹے یا بڑے ہونے پر اعتماد نہیں کیا جاتا، بلکہ وہ رات دیکھی جاتی ہے جس میں وہ نظر آیا۔ چاند کے جس حصے کو دیکھا جاتا ہے اسے کون سا جرم روشن کرتا ہے؟
