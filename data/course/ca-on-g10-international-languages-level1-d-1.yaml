- position: before
  kind: reflection
  title:
    en: Names from plants
    ar: أسماء من النبات
    ur: پودوں سے لیے گئے نام
  text:
    en: Al-Hamdani observed that the Arabs tended in men's names towards the thorny trees that grow in pasture, because of their roughness, sharpness, hardness and patience with scarce water. Among their men's names are Talha, Samura and Sabra. Among women's names are names of tenderness and fruits, such as Bashama and Busra. What are the origin and meaning of your name?
    ar: لاحظ الهمداني أن العرب تميل في أسماء الرجال إلى العِضاه الشائكة المرتعية لما فيها من الخشونة والحدة والصلابة والصبر على قلة المياه، ومن أسمائهم طلحة وسَمُرة وصَبرة. وفي النساء أسماء النواعم والثمار كبَشامة وبُسْرة. ما أصل اسمك ومعناه؟
    ur: الہمدانی نے دیکھا کہ عرب مردوں کے ناموں میں چراگاہ میں اگنے والے کانٹے دار درختوں کی طرف مائل ہوتے تھے، کیونکہ ان میں سختی، تیزی، مضبوطی اور کم پانی پر صبر ہوتا ہے۔ ان کے مردانہ ناموں میں طلحہ، سمرہ اور صبرہ ہیں۔ عورتوں کے ناموں میں نزاکت اور پھلوں والے نام ہیں، جیسے بشامہ اور بسرہ۔ آپ کے نام کی اصل اور معنی کیا ہیں؟
  entity: concept/asma-al-arab-min-al-nabat
  sources:
