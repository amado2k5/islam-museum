- position: after
  kind: place
  title:
    en: From a teacher's house to the madrasa
    ar: من حلقات البيوت إلى المدرسة
    ur: اساتذہ کے گھروں سے مدرسے تک
  text:
    en: Yeomans writes that madrasas began in eastern Persia as small informal establishments attached to the houses of teachers and Sufi shaykhs; when upholding Sunni orthodoxy became a political necessity, state-funded madrasas followed; Yeomans names the Nizamiyya, founded by the Seljuk vizier Nizam al-Mulk in Baghdad in 1068, as the first, and in his view it became the model for later ones. How would you compare learning there with your school today in a two-column chart?
    ar: يكتب يومانز أن المدارس نشأت في شرق فارس من حلقات صغيرة غير رسمية ملحقة ببيوت المعلمين وشيوخ الصوفية، فلما صار حفظ المذهب السني ضرورة سياسية أُنشئت مدارس تموّلها الدولة؛ ويسمّي يومانز النظامية، التي أسسها الوزير السلجوقي نظام الملك في بغداد سنة 1068م، أولاها، ويرى أنها صارت نموذجاً لما بعدها. كيف تقارن التعليم هناك بمدرستك اليوم في جدول من عمودين؟
    ur: یومنز لکھتے ہیں کہ مدرسے مشرقی فارس میں اساتذہ اور صوفی شیوخ کے گھروں سے ملحق چھوٹے غیر رسمی حلقوں سے شروع ہوئے؛ جب سنی مسلک کی حفاظت سیاسی ضرورت بنی تو ریاستی مالی امداد والے مدرسے قائم ہوئے، یومنز سلجوقی وزیر نظام الملک کے 1068ء میں بغداد میں قائم کردہ نظامیہ کو پہلا بتاتے ہیں، اور ان کی رائے میں وہ بعد کے مدرسوں کا نمونہ بنا۔ آپ وہاں کی تعلیم کا اپنے آج کے اسکول سے دو کالموں کے جدول میں موازنہ کیسے کریں گے؟
