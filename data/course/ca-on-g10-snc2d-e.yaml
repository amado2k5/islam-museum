expectations:
- code: E1
  text:
    en: evaluate the effectiveness of technological devices and procedures designed to make use of light, and assess their social benefits
    ar: قيّم فاعلية الأجهزة والإجراءات التقنية المصممة للإفادة من الضوء، وقدّر منافعها الاجتماعية
    ur: روشنی سے فائدہ اٹھانے کے لیے بنائے گئے تکنیکی آلات اور طریقوں کی تاثیر کا جائزہ لیں، اور ان کے سماجی فوائد کا اندازہ لگائیں
- code: E2
  text:
    en: investigate, through inquiry, the properties of light, and predict its behaviour, particularly with respect to reflection in plane and curved mirrors and refraction in converging lenses
    ar: استقصِ بالاستقصاء خصائص الضوء، وتنبّأ بسلوكه، ولا سيما في الانعكاس عن المرايا المستوية والمنحنية والانكسار في العدسات المجمّعة
    ur: استفسار کے ذریعے روشنی کی خصوصیات کی تحقیق کریں، اور اس کے برتاؤ کی پیش گوئی کریں، خاص طور پر ہموار اور خمدار آئینوں میں انعکاس اور مجتمع عدسوں میں انعطاف کے بارے میں
- code: E3
  text:
    en: demonstrate an understanding of various characteristics and properties of light, particularly with respect to reflection in mirrors and reflection and refraction in lenses
    ar: أظهر فهمًا لمختلف صفات الضوء وخصائصه، ولا سيما الانعكاس في المرايا والانعكاس والانكسار في العدسات
    ur: روشنی کی مختلف صفات اور خصوصیات کی فہم کا مظاہرہ کریں، خاص طور پر آئینوں میں انعکاس اور عدسوں میں انعکاس و انعطاف کے بارے میں
