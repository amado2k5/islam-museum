label:
  en: 'Strand C: Pathogens and Disease'
  ar: 'المحور C: مسبّبات الأمراض والمرض'
  ur: 'شاخ C: جراثیم اور بیماری'
  es: "Línea C: Patógenos y enfermedades"
  fr: "Volet C: Pathogènes et maladies"
summary:
  en: 'Pathogens and the control of disease (expectations C1 to C3). The museum maps two lessons: how Ibn Sina set conditions for judging a drug''s effect, and what the museum''s records say about contagion and about entering or leaving a plague land.'
  ar: 'مسبّبات الأمراض والسيطرة على المرض ⁦(التوقعات C1 إلى C3)⁩. ويربط المتحف درسين: كيف وضع ابن سينا شروطًا للحكم على أثر الدواء، وما تقوله سجلات المتحف عن العدوى وعن دخول أرض الطاعون أو الخروج منها.'
  ur: 'جراثیم اور بیماری کا قابو ⁦(توقعات C1 تا C3)⁩۔ میوزیم دو سبق جوڑتا ہے: ابن سینا نے دوا کے اثر کو جانچنے کی شرطیں کیسے رکھیں، اور عدوی اور طاعون زدہ سرزمین میں داخل ہونے یا وہاں سے نکلنے کے بارے میں میوزیم کے ریکارڈ کیا کہتے ہیں۔'
  es: "Patógenos y control de enfermedades (expectativas C1 a C3). El museo presenta dos lecciones: cómo Ibn Sina estableció las condiciones para evaluar el efecto de un medicamento y qué revelan los registros del museo sobre el contagio y sobre la entrada o salida de una zona afectada por la peste."
  fr: "Agents pathogènes et lutte contre les maladies (objectifs C1 à C3). Le musée met en lumière deux points essentiels: comment Ibn Sina a défini les critères d’évaluation de l’efficacité d’un médicament, et ce que les archives du musée révèlent sur la contagion et sur les modalités d’entrée et de sortie d’une zone touchée par la peste."
