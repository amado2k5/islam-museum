summary:
  en: 'Pathogens and the control of disease (expectations C1 to C3). The museum maps two lessons: how Ibn Sina set conditions for judging a drug''s effect, and what the museum''s records say about contagion and about entering or leaving a plague land.'
  ar: 'مسبّبات الأمراض والسيطرة على المرض ⁦(التوقعات C1 إلى C3)⁩. ويربط المتحف درسين: كيف وضع ابن سينا شروطًا للحكم على أثر الدواء، وما تقوله سجلات المتحف عن العدوى وعن دخول أرض الطاعون أو الخروج منها.'
  ur: 'جراثیم اور بیماری کا قابو ⁦(توقعات C1 تا C3)⁩۔ میوزیم دو سبق جوڑتا ہے: ابن سینا نے دوا کے اثر کو جانچنے کی شرطیں کیسے رکھیں، اور عدوی اور طاعون زدہ سرزمین میں داخل ہونے یا وہاں سے نکلنے کے بارے میں میوزیم کے ریکارڈ کیا کہتے ہیں۔'
