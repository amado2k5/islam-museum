expectations:
- code: C1
  text:
    en: evaluate the impact of scientific and technological knowledge and individual behaviour on the control of pathogens and the prevention of disease
    ar: قيّم أثر المعرفة العلمية والتقنية والسلوك الفردي في السيطرة على مسبّبات الأمراض والوقاية من المرض
    ur: جراثیم کے قابو اور بیماری سے بچاؤ پر سائنسی و تکنیکی علم اور انفرادی طرزِ عمل کے اثر کا جائزہ لیں
- code: C2
  text:
    en: investigate the nature and growth of pathogens and the effectiveness of measures intended to prevent their spread
    ar: استقصِ طبيعة مسبّبات الأمراض ونموّها وفعالية التدابير الرامية إلى منع انتشارها
    ur: جراثیم کی نوعیت اور نشوونما، اور ان کے پھیلاؤ کو روکنے کے اقدامات کی تاثیر کی تحقیق کریں
- code: C3
  text:
    en: demonstrate an understanding of pathogens, the diseases they cause, and ways of controlling their spread
    ar: أظهر فهمًا لمسبّبات الأمراض والأمراض التي تسببها وطرق السيطرة على انتشارها
    ur: جراثیم، ان سے پیدا ہونے والی بیماریوں اور ان کے پھیلاؤ کو قابو کرنے کے طریقوں کی فہم کا مظاہرہ کریں
