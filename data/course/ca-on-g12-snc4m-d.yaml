expectations:
- code: D1
  text:
    en: assess how personal and societal factors affect eating behaviours, and evaluate the social and economic impact of the use of non-nutrient food additives
    ar: قيّم كيف تؤثر العوامل الشخصية والمجتمعية في سلوكيات الأكل، وقيّم الأثر الاجتماعي والاقتصادي لاستعمال المضافات الغذائية غير المغذية
    ur: جائزہ لیں کہ ذاتی اور سماجی عوامل کھانے کے رویّوں کو کیسے متاثر کرتے ہیں، اور غیر غذائی اضافی اجزا کے استعمال کے سماجی و معاشی اثر کا جائزہ لیں
- code: D2
  text:
    en: investigate chemical components of and energy in food, and the processes by which food is digested
    ar: استقصِ المكوّنات الكيميائية في الغذاء والطاقة فيه والعمليات التي يُهضم بها الغذاء
    ur: غذا کے کیمیائی اجزا اور اس میں توانائی، اور ان عملوں کی تحقیق کریں جن سے غذا ہضم ہوتی ہے
- code: D3
  text:
    en: demonstrate an understanding of chemical components of and energy in food, and the processes by which food is digested
    ar: أظهر فهمًا للمكوّنات الكيميائية في الغذاء والطاقة فيه والعمليات التي يُهضم بها الغذاء
    ur: غذا کے کیمیائی اجزا اور اس میں توانائی، اور ان عملوں کی فہم کا مظاہرہ کریں جن سے غذا ہضم ہوتی ہے
