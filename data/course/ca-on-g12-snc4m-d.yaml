summary:
  en: 'Nutrition, food and digestion (expectations D1 to D3). The museum maps one lesson: how illness and the grades of eating shape what a person eats, as the jurists'' encyclopaedia records them.'
  ar: 'التغذية والغذاء والهضم ⁦(التوقعات D1 إلى D3)⁩. ويربط المتحف درسًا واحدًا: كيف يؤثر المرض ودرجات الأكل فيما يأكله الإنسان كما تسجّلها موسوعة الفقهاء.'
  ur: 'غذائیت، خوراک اور ہاضمہ ⁦(توقعات D1 تا D3)⁩۔ میوزیم ایک سبق جوڑتا ہے: بیماری اور کھانے کے درجے انسان کی خوراک کو کیسے متاثر کرتے ہیں، جیسا کہ فقہا کا موسوعہ انہیں درج کرتا ہے۔'
  es: "Nutrición, alimentación y digestión (niveles D1 a D3). El museo presenta una lección clave: cómo la enfermedad y los distintos grados de alimentación influyen en los hábitos alimenticios de una persona, según lo documenta la enciclopedia de los juristas."
  fr: "Nutrition, alimentation et digestion (objectifs D1 à D3). Le musée illustre une leçon: comment la maladie et les différents niveaux d’alimentation influencent le régime alimentaire d’une personne, tel que consigné dans l’encyclopédie des juristes."
  tr: "Beslenme, gıda ve sindirim (beklentiler D1 ila D3). Müze, Hukukçular Ansiklopedisi'nde kaydedildiği üzere, hastalıkların ve beslenme alışkanlıklarının bir kişinin ne yediğini nasıl etkilediği konusunda bir ders sunuyor."
  id: "Nutrisi, makanan, dan pencernaan (harapan D1 hingga D3). Museum ini menghubungkan satu pelajaran: bagaimana penyakit dan kebiasaan makan memengaruhi apa yang dimakan seseorang, seperti yang tercatat dalam Ensiklopedia Ahli Hukum."
