expectations:
- code: C1
  text:
    en: analyse common mechanical systems that use friction and applied forces, and evaluate their effectiveness in meeting social or environmental challenges
    ar: حلِّل أنظمة ميكانيكية شائعة تستخدم الاحتكاك والقوى المطبَّقة، وقيِّم فاعليتها في مواجهة تحديات اجتماعية أو بيئية
    ur: ایسے عام میکانیکی نظاموں کا تجزیہ کریں جو رگڑ اور لاگو قوتوں کو استعمال کرتے ہیں، اور سماجی یا ماحولیاتی چیلنجوں سے نمٹنے میں ان کی مؤثریت کا جائزہ لیں
- code: C2
  text:
    en: investigate forces, torque, work, coefficients of friction, simple machines, and mechanical advantage, and interpret related data
    ar: استقصِ القوى والعزم والشغل ومعاملات الاحتكاك والآلات البسيطة والفائدة الميكانيكية، وفسِّر البيانات المتصلة بها
    ur: قوتوں، ٹارک، کام، رگڑ کے عددی سر، سادہ مشینوں اور میکانیکی فائدے کی تحقیق کریں، اور متعلقہ اعداد و شمار کی تعبیر کریں
- code: C3
  text:
    en: demonstrate an understanding of concepts related to forces and mechanical advantage in relation to mechanical systems
    ar: أظهر فهمًا للمفاهيم المتصلة بالقوى والفائدة الميكانيكية في علاقتها بالأنظمة الميكانيكية
    ur: میکانیکی نظاموں کے تناظر میں قوتوں اور میکانیکی فائدے سے متعلق تصورات کی سمجھ کا مظاہرہ کریں
