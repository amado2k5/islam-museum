  title:
    en: The art of the letter
    ar: فن الحرف
    ur: حرف کا فن
  text:
    en: "Islamic calligraphy is the art of writing and shaping the Arabic letter beautifully. Its scripts include Kufic, Naskh, Thuluth and Diwani. Wikidata, the record’s only source, links the art to the writing of the Qur’an. What can a script do besides carry words?"
    ar: "الخط الإسلامي فن كتابة الحرف العربي وتشكيله جمالياً. ومن خطوطه الكوفي والنسخ والثلث والديواني. وتربط ويكيداتا، وهي مصدر السجل الوحيد، هذا الفن بكتابة القرآن. ماذا يستطيع الخط أن يفعل غير حمل الكلمات؟"
    ur: "اسلامی خطاطی عربی حرف کو خوبصورتی سے لکھنے اور ڈھالنے کا فن ہے۔ اس کے خطوں میں کوفی، نسخ، ثلث اور دیوانی شامل ہیں۔ ویکی ڈیٹا، جو ریکارڈ کا واحد ماخذ ہے، اس فن کو قرآن کی کتابت سے جوڑتا ہے۔ خط الفاظ اٹھانے کے سوا اور کیا کر سکتا ہے؟"
  entity: concept/islamic-calligraphy
  sources:
  - source/wikidata
- position: after
  kind: object
  title:
    en: Cairo’s buildings in their setting
    ar: عمارة القاهرة في سياقها
    ur: قاہرہ کی عمارتیں اپنے سیاق میں
  text:
    en: 'Richard Yeomans’s book follows the architecture and decorative arts of Cairo from the Arab conquest of 642 to the Ottoman conquest of 1517, setting the development of styles within their religious, social and political contexts. Its first chapters take Umayyad and Tulunid architecture, then Fatimid. Choose one building from the book: what was it for, and when and where was it built?'
    ar: 'يتتبع كتاب ريتشارد يومانز عمارة القاهرة وفنونها الزخرفية من الفتح العربي سنة 642 إلى الفتح العثماني سنة 1517، واضعًا تطور الأساليب في سياقاتها الدينية والاجتماعية والسياسية. ويعالج فصلاه الأولان العمارة الأموية والطولونية ثم الفاطمية. اختر منشأة واحدة من الكتاب: لأي غرض بُنيت، ومتى وأين؟'
    ur: 'ریچرڈ یومانز کی کتاب قاہرہ کی تعمیر اور آرائشی فنون کو سنہ 642 کی عرب فتح سے سنہ 1517 کی عثمانی فتح تک دیکھتی ہے، اور اسالیب کے ارتقا کو ان کے مذہبی، سماجی اور سیاسی سیاق میں رکھتی ہے۔ اس کے پہلے دو باب اموی اور طولونی، پھر فاطمی تعمیر کو لیتے ہیں۔ کتاب سے کوئی ایک عمارت چنیں: وہ کس مقصد کے لیے بنی، اور کب اور کہاں؟'
  entity: work/art-and-architecture-of-islamic-cairo
