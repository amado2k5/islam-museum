connections:
- position: within
  kind: story
  title:
    en: One city, several communities
    ar: مدينة واحدة وجماعات عدة
    ur: 'ایک شہر، کئی جماعتیں'
  text:
    en: In Ibn Hisham's account, as the museum's record summarises it, the Prophet concluded a treaty in Medina among the believers of Quraysh and Yathrib and those who followed them, which made the believers one community. The Sealed Nectar adds that he agreed with the Jews a treaty leaving them complete freedom in religion and property. How might an agreement like this help different groups live side by side?
    ar: في رواية ابن هشام، كما يلخصها سجل المتحف، عقد النبي في المدينة معاهدة بين المؤمنين من قريش ويثرب ومن تبعهم جعلت المؤمنين أمة واحدة، ويضيف الرحيق المختوم أنه عقد مع اليهود معاهدة تركت لهم مطلق الحرية في الدين والمال. كيف يمكن لعهد كهذا أن يعين جماعات مختلفة على العيش جنبًا إلى جنب؟
    ur: 'ابن ہشام کے بیان کے مطابق، جیسا کہ عجائب گھر کا ریکارڈ اسے خلاصہ کرتا ہے، نبی نے مدینہ میں قریش اور یثرب کے مومنوں اور ان کے پیروکاروں کے درمیان ایک معاہدہ کیا جس نے مومنوں کو ایک امت بنا دیا۔ الرحیق المختوم مزید بتاتی ہے کہ آپ نے یہود سے ایسا معاہدہ کیا جس میں انہیں دین اور مال میں مکمل آزادی دی گئی۔ ایسا معاہدہ مختلف گروہوں کو پہلو بہ پہلو رہنے میں کیسے مدد دے سکتا ہے؟'
  entity: event/constitution-of-medina
  sources:
  - source/mubarakpuri-raheeq
- position: after
  kind: story
  title:
    en: A promise of safety for a city
    ar: أمان لمدينة
    ur: 'ایک شہر کے لیے امان'
  text:
    en: 'The deed of safe-conduct Umar ibn al-Khattab wrote for the people of Iliya when the city surrendered, as the source quotes it from al-Tabari: security for persons, property, churches and crosses; churches neither settled nor demolished; no one coerced in religion; no Jew to dwell with them in Iliya; and the jizya upon them. The book places it in 15 AH. Which promises protect the people''s religion, and what was asked of them?'
    ar: 'وثيقة الأمان التي كتبها عمر بن الخطاب لأهل إيلياء عند صلحه معهم، ينقلها المصدر عن الطبري: أمان لأنفسهم وأموالهم وكنائسهم وصلبانهم، لا تُسكن كنائسهم ولا تُهدم، ولا يُكره أحد على دينه، ولا يسكن معهم يهودي في إيلياء، وعليهم الجزية. ويذكر الكتاب أنها كُتبت سنة 15هـ. أي بنودها تحمي دين الناس، وماذا طُلب منهم؟'
    ur: 'وہ امان نامہ جو عمر بن الخطاب نے اہلِ ایلیاء کو ان کے صلح کرنے پر لکھا، جیسا کہ مصنف طبری سے نقل کرتا ہے: ان کی جانوں، اموال، گرجا گھروں اور صلیبوں کی امان؛ گرجا گھر نہ آباد کیے جائیں نہ مسمار؛ کسی کو دین پر مجبور نہ کیا جائے؛ ایلیاء میں کوئی یہودی ان کے ساتھ نہ رہے؛ اور ان پر جزیہ ہو۔ کتاب بتاتی ہے کہ یہ سن 15ھ میں لکھا گیا۔ کون سی شقیں لوگوں کے دین کی حفاظت کرتی ہیں، اور ان سے کیا مانگا گیا؟'
  entity: event/umar-covenant-jerusalem
