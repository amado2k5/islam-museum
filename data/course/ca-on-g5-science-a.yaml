expectations:
- code: A1
  text:
    en: use a scientific research process, a scientific experimentation process, and an engineering design process to conduct investigations, following appropriate health and safety procedures
    ar: استخدم عملية بحث علمي وعملية تجريب علمي وعملية تصميم هندسي لإجراء استقصاءات، مع اتباع إجراءات الصحة والسلامة المناسبة
    ur: تحقیقات کرنے کے لیے سائنسی تحقیق کا عمل، سائنسی تجربے کا عمل اور انجینئری ڈیزائن کا عمل استعمال کریں، اور صحت و حفاظت کے مناسب طریقوں پر عمل کریں
- code: A2
  text:
    en: use coding in investigations and to model concepts, and assess the impact of coding and of emerging technologies on everyday life and in STEM-related fields
    ar: استخدم البرمجة في الاستقصاءات ولنمذجة المفاهيم، وقيِّم أثر البرمجة والتقنيات الناشئة في الحياة اليومية وفي المجالات المرتبطة بالعلوم والتقنية والهندسة والرياضيات
    ur: تحقیقات میں اور تصورات کے ماڈل بنانے کے لیے کوڈنگ استعمال کریں، اور روزمرہ زندگی اور STEM سے متعلق شعبوں میں کوڈنگ اور ابھرتی ہوئی ٹیکنالوجیوں کے اثر کا جائزہ لیں
- code: A3
  text:
    en: demonstrate an understanding of the practical applications of science and technology, and of contributions to science and technology from people with diverse lived experiences
    ar: أظهر فهمًا للتطبيقات العملية للعلوم والتكنولوجيا ولإسهامات أشخاص من تجارب حياتية متنوعة في العلوم والتكنولوجيا
    ur: سائنس و ٹیکنالوجی کے عملی استعمالات اور متنوع زندگی کے تجربات رکھنے والے لوگوں کی سائنس و ٹیکنالوجی میں خدمات کی سمجھ کا مظاہرہ کریں
