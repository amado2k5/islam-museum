  ar: 'التطورات الطبية والتقنية، والانقسام الخلوي والتخصص، وتنظيم الأنسجة والأعضاء والأجهزة ⁦(التوقعات من B1 إلى B3)⁩. ويربط المتحف ثلاثة دروس: أجزاء الجسم، ومقارنة مرضين، وأخلاقيات علم الأحياء الجديد.'
  en: 'Medical and technological developments, cell division and specialization, and the organization of tissues, organs and systems (expectations B1 to B3). The museum maps three lessons: the parts of a body, a disease compared, and the ethics of new biology.'
