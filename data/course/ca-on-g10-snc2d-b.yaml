expectations:
- code: B1
  text:
    en: evaluate the importance of medical and other technological developments related to systems biology, and analyse their societal and ethical implications
    ar: قيّم أهمية التطورات الطبية وغيرها من التطورات التقنية المتصلة بعلم الأحياء المنظومي، وحلّل آثارها المجتمعية والأخلاقية
    ur: نظامی حیاتیات سے متعلق طبی اور دیگر تکنیکی پیش رفتوں کی اہمیت کا جائزہ لیں، اور ان کے سماجی و اخلاقی اثرات کا تجزیہ کریں
- code: B2
  text:
    en: investigate cell division, cell specialization, organs, and systems in animals and plants, using research and inquiry skills, including various laboratory techniques
    ar: استقصِ الانقسام الخلوي والتخصص الخلوي والأعضاء والأجهزة في الحيوان والنبات، مستعينًا بمهارات البحث والاستقصاء، ومنها تقنيات مخبرية متنوعة
    ur: جانوروں اور پودوں میں خلیاتی تقسیم، خلیاتی تخصص، اعضاء اور نظاموں کی تحقیق کریں، تحقیق و استفسار کی مہارتوں کو بروئے کار لاتے ہوئے، جن میں مختلف تجربہ گاہی تکنیکیں شامل ہیں
- code: B3
  text:
    en: demonstrate an understanding of the hierarchical organization of cells, from tissues, to organs, to systems in animals and plants
    ar: أظهر فهمًا للتنظيم الهرمي للخلايا، من الأنسجة إلى الأعضاء إلى الأجهزة، في الحيوان والنبات
    ur: جانوروں اور پودوں میں خلیوں کی درجہ وار تنظیم کی فہم کا مظاہرہ کریں، یعنی بافتوں سے اعضاء تک اور اعضاء سے نظاموں تک
