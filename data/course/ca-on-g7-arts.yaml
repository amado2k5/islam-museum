summary:
  en: 'The Ontario Grade 7 Arts course has four strands: Dance, Drama, Music and Visual Arts. The museum maps three of them with four lessons; Dance has no honest link.'
  ar: 'لمقرر الفنون للصف السابع في منهاج أونتاريو أربعة محاور: الرقص والدراما والموسيقى والفنون البصرية. ويربط المتحف ثلاثة منها بأربعة دروس؛ ولا صلة صادقة له بمحور الرقص.'
  ur: 'اونٹاریو نصاب کے ساتویں جماعت کے فنون کورس کے چار محور ہیں: رقص، ڈراما، موسیقی اور بصری فنون۔ عجائب گھر ان میں سے تین کو چار اسباق سے جوڑتا ہے؛ رقص سے اس کا کوئی صادق ربط نہیں۔'
  es: "El curso de Artes de séptimo grado de Ontario tiene cuatro áreas temáticas: Danza, Teatro, Música y Artes Visuales. El museo relaciona tres de ellas con cuatro lecciones; Danza no tiene una conexión clara."
  fr: "Le programme d'arts de 7e année en Ontario comprend quatre volets: danse, théâtre, musique et arts visuels. Le musée en associe trois à quatre leçons; la danse n'y est pas directement intégrée."
  tr: "Ontario'daki 7. sınıf sanat müfredatının dört ana teması vardır: dans, drama, müzik ve görsel sanatlar. Müze, bunlardan üçünü dört dersle ilişkilendiriyor; dans temasıyla gerçek bir bağlantısı yok."
  id: "Kurikulum Seni Kelas 7 di Ontario memiliki empat tema utama: tari, drama, musik, dan seni visual. Museum ini menghubungkan tiga tema tersebut dengan empat pelajaran; namun, museum ini tidak memiliki hubungan yang nyata dengan tema tari."
