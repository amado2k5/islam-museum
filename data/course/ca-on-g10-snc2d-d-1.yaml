  title:
    ar: الأقاليم السبعة
    en: The seven climates
    ur: سات اقلیمیں
  text:
    ar: يذكر المسعودي أن كل ربع من الأرض، شماليّه وجنوبيّه، سبعة أقاليم عند أهل الهيئة. والعمارة بعد خط الاستواء أربع وعشرون درجة، والباقي يعمّه البحر الكبير. ويضيف أن أفضل المسكون عندهم ما ينتهي إليه شعاع الشمس صافيًا، وهو الإقليم الرابع، وهو العراق عند هذه الطائفة. وهذا تقسيم للمعمور بحسب خطوط العرض، لا تصنيف مناخي حديث. في أي هذه الأقاليم تضع منطقتك أنت؟
    en: Al-Masudi reports that, according to the astronomers, each quarter of the earth, northern and southern, contains seven climates. Inhabited land extends twenty-four degrees beyond the equator, and the great sea covers the rest. Al-Masudi adds that these astronomers hold the best inhabited land to be the one on which the sun's rays fall clear, the fourth climate, which for this group is Iraq. This is a division of inhabited land by latitude, not a modern climate classification. In which of these climates would you place your own region?
    ur: مسعودی بتاتے ہیں کہ اہلِ ہیئت کے نزدیک زمین کے ہر ربع میں، شمالی اور جنوبی، سات اقلیمیں ہیں۔ آبادی خطِ استوا کے بعد چوبیس درجے تک ہے، اور باقی کو بڑا سمندر ڈھانپے ہوئے ہے۔ وہ مزید بتاتے ہیں کہ ان کے نزدیک بہترین آباد زمین وہ ہے جہاں سورج کی شعاع صاف پہنچتی ہے، یعنی چوتھی اقلیم، اور اس گروہ کے نزدیک وہ عراق ہے۔ یہ آباد زمین کی عرضِ بلد کے لحاظ سے تقسیم ہے، موسم کی جدید درجہ بندی نہیں۔ آپ اپنے علاقے کو ان اقلیموں میں سے کس میں رکھیں گے؟
