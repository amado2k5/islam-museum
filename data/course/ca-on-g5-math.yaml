summary:
  en: 'The Ontario Grade 5 Mathematics course has six strands: social-emotional learning skills, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps a few expectations in four strands, through the history of numerals, algebra, mensuration and early Islamic law and economics; most expectations are in the gap register.'
  ar: 'لمقرر الرياضيات للصف الخامس في منهاج أونتاريو ستة محاور: مهارات التعلم الاجتماعي العاطفي، والعدد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. ويربط المتحف توقعات قليلة في أربعة محاور عبر تاريخ الأرقام وعلم الجبر والمساحة والفقه والاقتصاد في العصر الإسلامي المبكر، أما أكثر التوقعات ففي سجل الفجوات.'
  ur: 'اونٹاریو نصاب کے پانچویں جماعت ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی تعلم کی مہارتیں، عدد، الجبر، ڈیٹا، مکانی فہم اور مالی خواندگی۔ عجائب گھر چار محوروں میں چند توقعات کو ہندسوں، جبر، پیمائش اور ابتدائی اسلامی فقہ و معیشت کی تاریخ کے ذریعے جوڑتا ہے؛ زیادہ تر توقعات خالی جگہوں کے اندراج میں ہیں۔'
