summary:
  en: 'The Ontario Grade 5 Mathematics course has six strands: social-emotional learning skills, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps a few expectations in four strands, through the history of numerals, algebra, mensuration and early Islamic law and economics; most expectations are in the gap register.'
  ar: 'لمقرر الرياضيات للصف الخامس في منهاج أونتاريو ستة محاور: مهارات التعلم الاجتماعي العاطفي، والعدد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. ويربط المتحف توقعات قليلة في أربعة محاور عبر تاريخ الأرقام وعلم الجبر والمساحة والفقه والاقتصاد في العصر الإسلامي المبكر، أما أكثر التوقعات ففي سجل الفجوات.'
  ur: 'اونٹاریو نصاب کے پانچویں جماعت ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی تعلم کی مہارتیں، عدد، الجبر، ڈیٹا، مکانی فہم اور مالی خواندگی۔ عجائب گھر چار محوروں میں چند توقعات کو ہندسوں، جبر، پیمائش اور ابتدائی اسلامی فقہ و معیشت کی تاریخ کے ذریعے جوڑتا ہے؛ زیادہ تر توقعات خالی جگہوں کے اندراج میں ہیں۔'
  es: "El curso de matemáticas de quinto grado de Ontario consta de seis ejes temáticos: habilidades de aprendizaje socioemocional, números, álgebra, datos, percepción espacial y educación financiera. El museo presenta algunas expectativas en cuatro ejes temáticos, a través de la historia de los números, el álgebra, la medición y el derecho y la economía islámicos primitivos; la mayoría de las expectativas se encuentran en el registro de brechas."
  fr: "Le programme de mathématiques de 5e année de l'Ontario comporte six volets: compétences socio-émotionnelles, nombres, algèbre, données, repérage spatial et littératie financière. Le musée illustre quelques attentes dans quatre de ces volets, à travers l'histoire des chiffres, l'algèbre, la géométrie et le droit et l'économie islamiques anciens; la plupart des attentes se situent dans la section « écart »."
  tr: "Ontario'daki beşinci sınıf matematik müfredatı altı modülden oluşmaktadır: sosyal-duygusal öğrenme becerileri, sayılar, cebir, veri, mekansal farkındalık ve finansal okuryazarlık. Müze, bu modüllerin dördünde, erken İslam dönemindeki sayılar, cebir, ölçme, hukuk ve ekonomi tarihi üzerinden bazı tahminleri birbirine bağlarken, tahminlerin çoğu kayıtlardaki boşluklarda bulunmaktadır."
  id: "Kurikulum matematika kelas lima di Ontario memiliki enam modul: keterampilan belajar sosial-emosional, angka, aljabar, data, kesadaran spasial, dan literasi keuangan. Museum ini menghubungkan beberapa prediksi dalam empat modul tersebut melalui sejarah angka, aljabar, survei, yurisprudensi, dan ekonomi pada periode Islam awal, sementara prediksi terbanyak ditemukan pada celah-celah dalam catatan sejarah."
