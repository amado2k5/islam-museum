summary:
  en: 'The Ontario Grade 12 course World Cultures, code HSC4M, has four strands: Research and Inquiry Skills, The Concept of Culture, Cultural Expressions and Critical Cultural Issues. The museum maps parts of strands B and C only.'
  ar: 'مقرر الثقافات العالمية للصف الثاني عشر في أونتاريو، رمزه HSC4M، له أربعة محاور: مهارات البحث والاستقصاء، ومفهوم الثقافة، والتعبيرات الثقافية، والقضايا الثقافية الحرجة. ولا يربط المتحف إلا أجزاء من المحورين ب وج.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے کورس عالمی ثقافتیں، کوڈ HSC4M، کی چار شاخیں ہیں: تحقیق و استفسار کی مہارتیں، ثقافت کا تصور، ثقافتی اظہارات اور نازک ثقافتی مسائل۔ میوزیم صرف شاخ ب اور ج کے کچھ حصوں کو جوڑتا ہے۔'
  es: "El curso de Culturas del Mundo de 12.º grado de Ontario, código HSC4M, consta de cuatro ejes temáticos: Habilidades de Investigación y Averiguación, El Concepto de Cultura, Expresiones Culturales y Cuestiones Culturales Críticas. El mapa del museo abarca únicamente partes de los ejes B y C."
  fr: "Le cours de 12e année en Ontario intitulé Cultures du monde (code HSC4M) comporte quatre volets: Méthodologie de recherche et d’enquête, Concept de culture, Expressions culturelles et Enjeux culturels critiques. Le musée ne couvre que partiellement les volets B et C."
  tr: "Ontario'da 12. sınıf Küresel Kültürler dersi (kod: HSC4M) dört modülden oluşmaktadır: araştırma ve sorgulama becerileri, kültür kavramı, kültürel ifadeler ve eleştirel kültürel konular. Müze yalnızca B ve C modüllerinin bazı bölümlerini birbirine bağlamaktadır."
  id: "Kursus Budaya Global Kelas 12 di Ontario, dengan kode HSC4M, memiliki empat modul: keterampilan penelitian dan penyelidikan, konsep budaya, ekspresi budaya, dan isu-isu budaya kritis. Museum ini hanya menghubungkan sebagian dari modul B dan C."
