expectations:
- code: D1
  text:
    en: analyse some of the effects of climate change around the world, and assess the effectiveness of initiatives that attempt to address the issue of climate change
    ar: حلّل بعض آثار تغيّر المناخ في أنحاء العالم، وقيّم فاعلية المبادرات التي تسعى إلى معالجة قضية تغيّر المناخ
    ur: دنیا بھر میں موسمیاتی تبدیلی کے بعض اثرات کا تجزیہ کریں، اور ان اقدامات کی تاثیر کا جائزہ لیں جو موسمیاتی تبدیلی کے مسئلے کو حل کرنے کی کوشش کرتے ہیں
- code: D2
  text:
    en: investigate various natural and human factors that influence Earth’s climate and climate change
    ar: استقصِ عوامل طبيعية وبشرية متنوعة تؤثر في مناخ الأرض وفي تغيّر المناخ
    ur: زمین کے موسم اور موسمیاتی تبدیلی پر اثر انداز ہونے والے مختلف قدرتی اور انسانی عوامل کی تحقیق کریں
- code: D3
  text:
    en: demonstrate an understanding of natural and human factors, including the greenhouse effect, that influence Earth’s climate and contribute to climate change
    ar: أظهر فهمًا للعوامل الطبيعية والبشرية، ومنها الاحتباس الحراري، التي تؤثر في مناخ الأرض وتسهم في تغيّر المناخ
    ur: ان قدرتی اور انسانی عوامل کی فہم کا مظاہرہ کریں، جن میں گرین ہاؤس اثر بھی شامل ہے، جو زمین کے موسم پر اثر ڈالتے اور موسمیاتی تبدیلی میں حصہ ڈالتے ہیں
