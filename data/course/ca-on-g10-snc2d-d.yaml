label:
  ar: 'المحور D: علوم الأرض والفضاء: تغيّر المناخ'
  en: 'Strand D: Earth and Space Science: Climate Change'
  ur: 'شاخ D: ارضی و فضائی سائنس: موسمیاتی تبدیلی'
  es: "Área temática D: Ciencias de la Tierra y del Espacio: Cambio Climático"
  fr: "Volet D: Sciences de la Terre et de l'espace: Changement climatique"
  tr: "Eksen D: Yer ve Uzay Bilimleri: İklim Değişikliği"
  id: "Sumbu D: Ilmu Bumi dan Antariksa: Perubahan Iklim"
summary:
  ar: آثار تغيّر المناخ، والعوامل التي تشكّل مناخ الأرض، والاحتباس الحراري ⁦(التوقعات من D1 إلى D3)⁩. ويربط المتحف درسًا واحدًا، عن طريقة قديمة لتقسيم الأرض إلى أقاليم.
  en: The effects of climate change, the factors that shape Earth's climate and the greenhouse effect (expectations D1 to D3). The museum maps one lesson, on an old way of dividing the earth into climates.
  ur: موسمیاتی تبدیلی کے اثرات، زمین کے موسم کو ڈھالنے والے عوامل اور گرین ہاؤس اثر ⁦(توقعات D1 سے D3)⁩۔ میوزیم ایک سبق جوڑتا ہے، زمین کو اقلیموں میں بانٹنے کے ایک پرانے طریقے پر۔
  es: "Los efectos del cambio climático, los factores que determinan el clima de la Tierra y el efecto invernadero (expectativas D1 a D3). El museo presenta una lección sobre una antigua forma de dividir la Tierra en climas."
  fr: "Les effets du changement climatique, les facteurs qui façonnent le climat terrestre et l'effet de serre (objectifs D1 à D3). Le musée propose une leçon illustrée par une ancienne méthode de classification des climats terrestres."
  tr: "İklim değişikliğinin etkileri, Dünya'nın iklimini şekillendiren faktörler ve küresel ısınma (D1'den D3'e kadar olan projeksiyonlar). Müze, bunu Dünya'yı bölgelere ayırmanın eski bir yöntemine dair tek bir dersle ilişkilendiriyor."
  id: "Dampak perubahan iklim, faktor-faktor yang membentuk iklim Bumi, dan pemanasan global (proyeksi dari D1 hingga D3). Museum ini menghubungkan hal tersebut dengan satu pelajaran tentang metode kuno untuk membagi Bumi menjadi beberapa wilayah."
