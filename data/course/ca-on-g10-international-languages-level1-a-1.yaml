  title:
    en: Arabic in the museum's record
    ar: العربية في سجل المتحف
    ur: عجائب گھر کے اندراج میں عربی
  text:
    en: The record on Arabic describes it as the language of the Qur'an and the prayer, and as the language of the Arabian Peninsula that spread with the Islamic conquests until it became the language of learning, religion and literature from al-Andalus to Persia. This is a short historical description; the record does not say where Arabic is spoken today or by how many. Where do you meet Arabic in your community?
    ar: يصف سجل العربية لغةً بأنها لغة القرآن والصلاة، ولغة شبه الجزيرة العربية التي انتشرت مع الفتح الإسلامي حتى صارت لغة علم ودين وأدب من الأندلس إلى فارس. وهذا وصف تاريخي موجز، ولا يذكر السجل أين تُتحدَّث العربية اليوم ولا كم عدد متحدثيها. أين تلتقي بالعربية في مجتمعك؟
    ur: عربی کے اندراج میں اسے قرآن اور نماز کی زبان کہا گیا ہے، اور جزیرۂ عرب کی وہ زبان جو فتوحاتِ اسلامی کے ساتھ پھیلی یہاں تک کہ اندلس سے فارس تک علم، دین اور ادب کی زبان بن گئی۔ یہ ایک مختصر تاریخی بیان ہے؛ اندراج یہ نہیں بتاتا کہ آج عربی کہاں اور کتنے لوگ بولتے ہیں۔ آپ اپنی جماعت میں عربی سے کہاں ملتے ہیں؟
