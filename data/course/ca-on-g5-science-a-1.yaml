- position: within
  kind: scholar
  title:
    en: A physician and his books
    ar: طبيب وكتبه
    ur: ایک طبیب اور اس کی کتابیں
  text:
    en: Ibn al-Imad calls Ibn al-Nafis the shaykh of medicine in Egypt, the one to whom knowledge of medicine ultimately led. Ibn al-Nafis wrote the medical book al-Shamil, and he endowed his properties and his books to the Mansuri hospital. What would a physician's books do for the patients of a hospital?
    ar: يصف ابن العماد ابن النفيس بأنه شيخ الطب بالديار المصرية، ومن انتهت إليه معرفة الطب. وقد ألّف ابن النفيس في الطب كتاب «الشامل»، ووقف أملاكه وكتبه على المارستان المنصوري. ماذا تفيد كتب الطبيب مرضى المستشفى؟
    ur: ابن العماد ابن نفیس کو مصر میں طب کا شیخ کہتا ہے، وہ جن پر طب کا علم آ کر ختم ہوا۔ ابن نفیس نے طب میں کتاب «الشامل» لکھی اور اپنی جائیدادیں اور کتابیں مارستانِ منصوری کے لیے وقف کر دیں۔ ایک طبیب کی کتابیں ہسپتال کے مریضوں کے کس کام آتی ہیں؟
  entity: person/ibn-al-nafis
  sources:
  - source/shadharat-dhahab
- position: after
  kind: story
  title:
    en: A hospital built on an earlier model
    ar: مستشفى على مثال سابق
    ur: پہلے کے نمونے پر بنا شفاخانہ
  text:
    en: TDV records that during the reign of Harun al-Rashid, 786–809, a hospital was set up on the Kerhaya canal in Baghdad on the model of the hospital at Jundishapur. It names Jibril ibn Bukhtishu in its founding, Abu Yuhanna Masawayh as its director and his son Yuhanna as his successor. The record calls this a transfer of a model and of physicians' expertise, and TDV describes Jibril's family as Nestorian Christian. Whose work do you see in this hospital?
    ar: تذكر موسوعة TDV أن بيمارستاناً أُنشئ في بغداد على قناة كرخايا في خلافة هارون الرشيد، بين 786 و809م، على مثال مستشفى جنديسابور، وتسمّي جبرائيل بن بختيشوع في خبر إنشائه، وأبا يوحنا ماسويه في إدارته، ثم ابنه يوحنا الذي خلفه. وهو نقل لنموذج مستشفى وخبرة أطبائه، لا اختراع للمستشفى من العدم، وتصف الموسوعة أسرة جبرائيل بأنها نسطورية مسيحية. عمل من ترى في هذا المستشفى؟
    ur: TDV کا بیان ہے کہ ہارون الرشید کے دور، 786 تا 809 عیسوی، میں بغداد میں نہرِ کرخایا پر جندی شاپور کے ہسپتال کے نمونے پر ایک بیمارستان بنایا گیا۔ وہ اس کے قیام میں جبرائیل بن بختیشوع، اس کی ادارت میں ابو یوحنا ماسویہ اور ان کے جانشین کے طور پر ان کے بیٹے یوحنا کا نام لیتا ہے۔ ریکارڈ اسے ایک نمونے اور اطبا کی مہارت کی منتقلی کہتا ہے، ہسپتال کی ایجاد نہیں، اور TDV جبرائیل کے خاندان کو نسطوری مسیحی بتاتا ہے۔ اس ہسپتال میں آپ کو کس کا کام نظر آتا ہے؟
