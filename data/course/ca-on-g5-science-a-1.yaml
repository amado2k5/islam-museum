  kind: place
  title:
    en: A hospital with an endowment
    ar: مستشفى له وقف
    ur: وقف والا شفاخانہ
  text:
    en: 'Al-Maqrizi quotes the compiler of the Tulunid biography: Ahmad ibn Tulun established a hospital in the Fustat area and endowed it with properties. The hospital kept a patient''s clothes and money safe, supplied hospital dress, bedding, medicines and food until recovery, and returned his belongings when he left. The account names the physicians, the custodian and the attendants only by their roles. Which of these jobs would you ask about?'
    ar: ينقل المقريزي عن جامع السيرة الطولونية أن أحمد بن طولون أنشأ في منطقة الفسطاط بيمارستاناً أوقف عليه عقارات. وتحفظ الإدارة ثياب المريض وماله، وتوفر له لباساً وفراشاً ودواءً وغذاءً إلى أن يتعافى، ثم ترد إليه أمتعته عند الخروج. ويسمّي الخبر الأطباء والأمين والخدم بوظائفهم لا بأسمائهم. أي هذه الوظائف تود أن تسأل عنها؟
    ur: مقریزی سیرتِ طولونیہ کے مؤلف سے نقل کرتا ہے کہ احمد بن طولون نے فسطاط کے علاقے میں ایک شفاخانہ قائم کیا اور اس پر جائیدادیں وقف کیں۔ انتظامیہ مریض کے کپڑے اور مال محفوظ رکھتی ہے، اسے لباس، بستر، دوا اور غذا صحت یاب ہونے تک دیتی ہے، اور رخصت کے وقت اس کا سامان لوٹا دیتی ہے۔ یہ بیان اطبا، امین اور خادموں کو ناموں سے نہیں، صرف ان کے کاموں سے یاد کرتا ہے۔ ان میں سے کس کام کے بارے میں آپ پوچھنا چاہیں گے؟
  entity: invention/ibn-tulun-bimaristan
  sources:
