summary:
  ar: 'مقرر الرياضيات للصف السابع في منهاج أونتاريو له ستة محاور. يربط المتحف أجزاء من ثلاثة منها: العدد، والجبر، والحس المكاني؛ أما محاور المهارات الاجتماعية والعاطفية والبيانات والثقافة المالية فلا يربط منها شيئاً.'
  en: 'The Ontario Grade 7 Mathematics course has six strands. The museum maps parts of three of them: Number, Algebra and Spatial Sense; it maps nothing in the strands on social-emotional skills, Data and Financial Literacy.'
  ur: 'اونٹاریو کے ساتویں جماعت کے ریاضی کورس کے چھ محور ہیں۔ عجائب گھر ان میں سے تین کے کچھ حصے جوڑتا ہے: عدد، الجبرا اور مکانی فہم؛ سماجی و جذباتی مہارتوں، ڈیٹا اور مالی خواندگی کے محوروں میں کچھ نہیں جوڑتا۔'
