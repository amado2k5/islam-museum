  title:
    ar: اسم العلم من كتاب الخوارزمي
    en: The name of the science comes from a title
    ur: علم کا نام ایک کتاب کے عنوان سے
  text:
    ar: يذكر محققا طبعة القاهرة سنة 1939 لكتاب الخوارزمي «الجبر والمقابلة» أن اسم هذا العلم في جميع لغات العالم مشتق من الكلمة العربية «الجبر» التي جعلها الخوارزمي اسماً لكتابه. ويعرضان تاريخ الجبر قبله، من بردي أحميس نحو سنة 1700 قبل الميلاد إلى البابليين والإغريق والهنود، ويخلصان إلى أن الجبر نشأ نتيجة طبيعية لاهتمام الأمم بمسائل الهندسة وخواص الأعداد، مع تأثر كل بلد بما يجري في جيرانه. ماذا تخبرك كلمة «algebra» عن رحلة الفكرة؟
    en: The editors of the 1939 Cairo edition of al-Khwarizmi's Book of al-Jabr and al-Muqabala note that the name of this science in every language comes from the Arabic word al-jabr, which he used as the title of his book. They also survey algebra before him, from the Ahmes papyrus of about 1700 BCE to the Babylonians, Greeks and Indians, and conclude that algebra arose naturally from people's interest in geometry and the properties of numbers, each country being influenced by its neighbours. What does the word "algebra" tell you about the idea's journey?
    ur: خوارزمی کی «الجبر والمقابلہ» کے 1939ء کے قاہرہ ایڈیشن کے محققین بتاتے ہیں کہ اس علم کا نام دنیا کی ہر زبان میں عربی لفظ «الجبر» سے نکلا ہے، جسے خوارزمی نے اپنی کتاب کا نام بنایا۔ وہ ان سے پہلے کی الجبرا کی تاریخ بھی بیان کرتے ہیں، احمس کے پیپائرس سے، جو تقریباً 1700 قبل مسیح کا ہے، بابلیوں، یونانیوں اور ہندوستانیوں تک، اور نتیجہ نکالتے ہیں کہ الجبرا قوموں کی ہندسے کے مسائل اور اعداد کی خصوصیات سے دلچسپی کا فطری نتیجہ تھا، اور ہر ملک اپنے پڑوسیوں سے متاثر ہوا۔ لفظ «algebra» آپ کو اس خیال کے سفر کے بارے میں کیا بتاتا ہے؟
