connections:
- position: before
  kind: reflection
  title:
    en: A month set by the moon
    ar: شهر يحدّده الهلال
    ur: چاند سے طے ہونے والا مہینہ
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says Ramadan is the name of the known month, and that it is established by sighting its crescent, or by completing Sha''ban to thirty when sighting fails. It adds that the jurists agree it is recommended to redouble effort in its last ten nights: night prayer, alms, and reciting and studying the Quran. What does a month of fasting ask of a whole community?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن رمضان اسم الشهر المعروف، وأنه يثبت برؤية هلاله، أو بإكمال شعبان ثلاثين يومًا إذا تعذّرت الرؤية. وتضيف أن الفقهاء متفقون على استحباب الاجتهاد في العشر الأواخر منه: قيام الليل والصدقة وتلاوة القرآن ودراسته. ماذا يطلب شهر الصيام من جماعة كاملة؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ رمضان معروف مہینے کا نام ہے، اور یہ اس کے چاند کے دیکھنے سے ثابت ہوتا ہے، یا چاند نظر نہ آنے پر شعبان کے تیس دن پورے کرنے سے۔ وہ مزید کہتا ہے کہ فقہا اس پر متفق ہیں کہ اس کی آخری دس راتوں میں کوشش بڑھانا مستحب ہے: رات کی نماز، صدقہ، اور قرآن کی تلاوت اور مطالعہ۔ روزوں کا مہینہ ایک پوری جماعت سے کیا تقاضا کرتا ہے؟'
  entity: practice/sawm-ramadan
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: within
  kind: reflection
  title:
    en: The day that returns
    ar: اليوم الذي يعود
    ur: لوٹ کر آنے والا دن
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says that Eid comes from the Arabic for returning, for it recurs, and that the Muslims have two: the day of fitr, the first of Shawwal, and the day of adha, the tenth of Dhu''l-Hijja. It adds that takbir is prescribed on the way to the prayer, and the Eid bath is recommended, as the Prophet bathed on the two days. Which of these practices could a visitor see?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن العيد من العَود لأنه يتكرر، وأن للمسلمين عيدين: يوم الفطر في أول شوال، ويوم الأضحى في العاشر من ذي الحجة. وتضيف أنه يُشرع التكبير في الطريق إلى الصلاة، ويُستحب الغسل للعيد كما اغتسل النبي في اليومين. أيّ هذه الممارسات يمكن أن يراه زائر؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ عید کا لفظ لوٹنے سے ہے کیونکہ وہ بار بار آتی ہے، اور مسلمانوں کی دو عیدیں ہیں: یومِ فطر شوال کی پہلی تاریخ کو اور یومِ اضحیٰ ذوالحجہ کی دسویں تاریخ کو۔ وہ مزید کہتا ہے کہ نماز کے راستے میں تکبیر مشروع ہے اور عید کے لیے غسل مستحب ہے، جیسے نبی نے دونوں دن غسل کیا۔ ان میں سے کون سے اعمال کوئی مہمان دیکھ سکتا ہے؟'
  entity: practice/eid-al-fitr
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: after
  kind: reflection
  title:
    en: The day of sacrifice
    ar: يوم الأضحى
    ur: قربانی کا دن
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says the day of adha is the tenth of Dhu''l-Hijja, one of the Muslims'' two Eids, named for the udhiyya slaughtered on it. It adds that the jurists agree the udhiyya is prescribed on it and differ on its ruling: a sunna for the majority, obligatory for the Hanafis. Which of these details name something done on the day?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن يوم الأضحى هو العاشر من ذي الحجة، وهو أحد عيدي المسلمين، سُمّي بالأضحية التي تُذبح فيه. وتضيف أن الفقهاء متفقون على مشروعية الأضحية فيه، ومختلفون في حكمها: سنة عند الجمهور، وواجبة عند الحنفية. أيّ هذه التفاصيل يسمّي شيئًا يُفعل في ذلك اليوم؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ یومِ اضحیٰ ذوالحجہ کی دسویں تاریخ ہے اور مسلمانوں کی دو عیدوں میں سے ایک ہے، جس کا نام اس قربانی ⁦(اضحیہ)⁩ کی وجہ سے ہے جو اس دن ذبح کی جاتی ہے۔ وہ مزید کہتا ہے کہ فقہا اس دن قربانی کے مشروع ہونے پر متفق ہیں اور اس کے حکم میں اختلاف کرتے ہیں: جمہور کے نزدیک سنت، حنفیہ کے نزدیک واجب۔ ان تفصیلات میں سے کون سی اس دن کیے جانے والے کسی عمل کا نام لیتی ہے؟'
  entity: practice/eid-al-adha
