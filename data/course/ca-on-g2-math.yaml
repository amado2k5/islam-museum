summary:
  en: 'The Ontario Grade 2 Mathematics course has six strands: Social-Emotional Learning Skills and the Mathematical Processes, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps parts of strands B, C, E and F; strand A names skills only and strand D is in the gap register.'
  ar: 'مقرر الرياضيات للصف الثاني في أونتاريو له ستة محاور: مهارات التعلم الاجتماعي العاطفي والعمليات الرياضية، والأعداد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. يربط المتحف أجزاء من المحاور ب وج وهـ وو؛ أما المحور أ فيسمّي مهارات فقط، وأما المحور د فهو في سجل الفجوات.'
  ur: 'اونٹاریو کے دوسری جماعت کے ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں اور ریاضیاتی عمل، اعداد، الجبرا، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ عجائب گھر محور ب، ج، ہ اور و کے کچھ حصے جوڑتا ہے؛ محور الف صرف مہارتوں کا نام لیتا ہے اور محور د فجوات کے اندراج میں ہے۔'
  es: "El curso de Matemáticas de segundo grado de Ontario consta de seis ejes temáticos: Habilidades de Aprendizaje Socioemocional y Procesos Matemáticos, Números, Álgebra, Datos, Percepción Espacial y Alfabetización Financiera. El museo incluye partes de los ejes B, C, E y F; el eje A solo menciona las habilidades y el eje D se encuentra en el registro de lagunas."
  fr: "Le programme de mathématiques de 2e année de l'Ontario comporte six volets: compétences socio-émotionnelles et processus mathématiques, nombres, algèbre, données, sens spatial et littératie financière. Le musée présente des éléments des volets B, C, E et F; le volet A mentionne uniquement les compétences et le volet D figure dans le registre des lacunes."
