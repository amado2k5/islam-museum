summary:
  en: 'The 2023 Ontario Grade 8 Geography course has two strands: Global Settlement: Patterns and Sustainability, and Global Inequalities: Economic Development and Quality of Life. The museum offers a few historical cases to each; most of the course lies outside what it holds.'
  ar: 'لمقرر الجغرافيا للصف الثامن في منهاج أونتاريو 2023 محوران: الاستيطان العالمي: الأنماط والاستدامة، والتفاوتات العالمية: التنمية الاقتصادية وجودة الحياة. يقدّم المتحف لكل منهما حالات تاريخية قليلة، ومعظم المقرر خارج ما يملكه.'
  ur: 'اونٹاریو کے 2023 کے نصاب میں جماعت ہشتم جغرافیہ کے دو محور ہیں: عالمی آبادکاری: نمونے اور پائیداری، اور عالمی عدم مساوات: معاشی ترقی اور معیارِ زندگی۔ عجائب گھر ہر ایک کے لیے چند تاریخی مثالیں دیتا ہے؛ کورس کا بڑا حصہ اس کے پاس موجود چیزوں سے باہر ہے۔'
  es: "El curso de Geografía de 8.º grado de Ontario de 2023 consta de dos ejes temáticos: Asentamientos globales: Patrones y sostenibilidad, y Desigualdades globales: Desarrollo económico y calidad de vida. El museo ofrece algunos casos históricos para cada uno; la mayor parte del curso se desarrolla fuera de su ámbito de estudio."
  fr: "Le programme de géographie de 8e année de l'Ontario (2023) comporte deux volets: « Peuplement mondial: tendances et durabilité » et « Inégalités mondiales: développement économique et qualité de vie ». Le musée présente quelques exemples historiques pour chaque volet; la majeure partie du cours se déroule à l'extérieur de ses collections."
  tr: "Ontario'nun 2023 müfredatındaki 8. sınıf coğrafya dersinin iki ana teması vardır: küresel yerleşim: kalıplar ve sürdürülebilirlik ve küresel eşitsizlikler: ekonomik kalkınma ve yaşam kalitesi. Müze, her iki tema için de birkaç tarihi örnek sunmaktadır ve müfredatın büyük bir kısmı müze koleksiyonunun dışında yer almaktadır."
  id: "Kurikulum geografi kelas 8 dalam silabus Ontario 2023 memiliki dua tema utama: pemukiman global: pola dan keberlanjutan, dan ketidaksetaraan global: pembangunan ekonomi dan kualitas hidup. Museum ini menawarkan beberapa studi kasus historis untuk masing-masing tema, dan sebagian besar kurikulum berada di luar koleksinya."
