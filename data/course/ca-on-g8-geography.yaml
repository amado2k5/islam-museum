summary:
  en: 'The 2023 Ontario Grade 8 Geography course has two strands: Global Settlement: Patterns and Sustainability, and Global Inequalities: Economic Development and Quality of Life. The museum offers a few historical cases to each; most of the course lies outside what it holds.'
  ar: 'لمقرر الجغرافيا للصف الثامن في منهاج أونتاريو 2023 محوران: الاستيطان العالمي: الأنماط والاستدامة، والتفاوتات العالمية: التنمية الاقتصادية وجودة الحياة. يقدّم المتحف لكل منهما حالات تاريخية قليلة، ومعظم المقرر خارج ما يملكه.'
  ur: 'اونٹاریو کے 2023 کے نصاب میں جماعت ہشتم جغرافیہ کے دو محور ہیں: عالمی آبادکاری: نمونے اور پائیداری، اور عالمی عدم مساوات: معاشی ترقی اور معیارِ زندگی۔ عجائب گھر ہر ایک کے لیے چند تاریخی مثالیں دیتا ہے؛ کورس کا بڑا حصہ اس کے پاس موجود چیزوں سے باہر ہے۔'
