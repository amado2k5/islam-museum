expectations:
- code: B1
  text:
    en: analyse social and economic issues related to an environmental challenge, and how societal needs influence scientific endeavours related to the environment
    ar: حلّل القضايا الاجتماعية والاقتصادية المتصلة بتحدٍّ بيئي، وكيف تؤثر حاجات المجتمع في الجهود العلمية المتعلقة بالبيئة
    ur: کسی ماحولیاتی چیلنج سے متعلق سماجی اور معاشی مسائل کا تجزیہ کریں، اور یہ کہ معاشرتی ضروریات ماحول سے متعلق سائنسی کوششوں پر کیسے اثر ڈالتی ہیں
- code: B2
  text:
    en: investigate a range of perspectives that have contributed to scientific knowledge about the environment, and how scientific knowledge and procedures are applied to address contemporary environmental problems
    ar: استقصِ طيفًا من وجهات النظر التي أسهمت في المعرفة العلمية عن البيئة، وكيف تُطبَّق المعرفة العلمية وإجراءاتها لمعالجة المشكلات البيئية المعاصرة
    ur: ان نقطہ ہائے نظر کی ایک حد کا جائزہ لیں جنہوں نے ماحول کے بارے میں سائنسی علم میں حصہ ڈالا، اور یہ کہ سائنسی علم اور طریقۂ کار کو عصری ماحولیاتی مسائل کے حل کے لیے کیسے برتا جاتا ہے
- code: B3
  text:
    en: demonstrate an understanding of major contemporary environmental challenges and how we acquire knowledge about them
    ar: أظهر فهمًا للتحديات البيئية المعاصرة الكبرى وكيف نكتسب المعرفة عنها
    ur: عصرِ حاضر کے بڑے ماحولیاتی چیلنجوں کی فہم ظاہر کریں اور یہ کہ ہم ان کے بارے میں علم کیسے حاصل کرتے ہیں
