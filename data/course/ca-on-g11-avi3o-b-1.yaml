- position: within
  kind: story
  title:
    en: A message on a coin
    ar: رسالة على نقد
    ur: سکے پر پیغام
  text:
    en: The Islamic Coins booklet published in Doha defines propaganda coins as coins put into circulation officially by a ruler for the occasion they were struck for, or unofficially by others, secretly or openly, according to their political stance toward the state. A Ghurid coin of 597 AH records Sultan Ghiyath al-Din's victories over the Khwarazmians, with the motto "God is most high". What can a small coin say to many people?
    ar: يعرّف كتيب «المسكوكات الإسلامية» الصادر في الدوحة المسكوكاتِ الإعلامية بأنها نقود كانت تُطرح للتداول إما رسميًا من قبل السلطان أو الحاكم في المناسبة التي ضُربت من أجلها، وإما بطريقة غير رسمية من قبل الخاصة أو العامة، سرًا أو علنًا، بحسب موقفهم السياسي من الدولة. ومنها نقد غوري سنة 597هـ بمناسبة انتصارات السلطان غياث الدين على الخوارزمية، عليه شعار «الله أعلى». ماذا يستطيع نقد صغير أن يقول لكثيرين؟
    ur: دوحہ میں شائع ہونے والا کتابچہ «اسلامی سکے» تشہیری سکوں کو ایسے سکے بتاتا ہے جو یا تو سلطان یا حاکم کی طرف سے سرکاری طور پر اس موقع پر جاری ہوتے جس کے لیے ڈھالے گئے، یا دوسروں کی طرف سے غیر سرکاری طور پر، خفیہ یا کھلے، ریاست کے بارے میں ان کے سیاسی موقف کے مطابق۔ ان میں ایک غوری سکہ 597 ہجری کا ہے جو سلطان غیاث الدین کی خوارزمیوں پر فتوحات کے موقع پر ڈھلا، اس پر شعار «اللہ اعلیٰ» ہے۔ ایک چھوٹا سکہ بہت سے لوگوں سے کیا کہہ سکتا ہے؟
