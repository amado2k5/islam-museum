  title:
    en: Writing for the Qur'an and for a monument
    ar: كتابة للمصحف وللنصب
    ur: قرآن اور یادگار کے لیے تحریر
  text:
    en: Maryam Ekhtiar counts the rise of kufic in the late seventh to early eighth century as a major development in the history of Islamic calligraphy. Kufic replaced hijazi as the preferred script for copying the Qur'an, a status it kept until about the mid- to late tenth century. A dated architectural example is the inscription around the ambulatory of the Dome of the Rock, 72 AH/691–92 CE. What work did writing do in these two places?
    ar: تعدّ مريم اختيار ظهور الخط الكوفي وانتشاره بين أواخر القرن السابع وأوائل الثامن الميلادي تطورًا كبيرًا في تاريخ الخط الإسلامي. وقد حلّ الكوفي محل الخط الحجازي في نسخ المصاحف، وبقي كذلك إلى أواسط القرن العاشر الميلادي أو أواخره تقريبًا. ومن أمثلته المعمارية المؤرخة نقش رواق قبة الصخرة سنة 72هـ/691–692م. أي عمل أدّته الكتابة في هذين الموضعين؟
    ur: مریم اختیار کے نزدیک کوفی کا ظہور اور پھیلاؤ، ساتویں صدی کے آخر اور آٹھویں صدی کے آغاز میں، اسلامی خطاطی کی تاریخ کی ایک بڑی پیش رفت ہے۔ کوفی نے قرآن کی نقل میں حجازی کی جگہ لی اور تقریباً دسویں صدی کے وسط یا آخر تک پسندیدہ رہا۔ اس کی ایک تاریخ دار تعمیراتی مثال قبۃ الصخرہ کے برآمدے کے گرد کا کتبہ ہے، 72 ہجری مطابق 691 تا 692 عیسوی۔ ان دو مقامات پر تحریر نے کیا کام کیا؟
  entity: concept/kufic-script
