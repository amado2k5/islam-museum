  title:
    en: Names on the gates of Cairo
    ar: أسماء على أبواب القاهرة
    ur: قاہرہ کے دروازوں پر نام
  text:
    en: Bernard O'Kane follows the inscriptions of Fatimid Cairo in order, from the stucco of al-Azhar to the facade of the Aqmar Mosque. He notes that on Badr al-Jamali's gates his titles take up much more space than those of the caliph al-Mustansir, "a nod to the real holder of power". Whom does the size of a name on a wall serve?
    ar: يتتبع برنارد أوكين كتابات العمائر الفاطمية في القاهرة بالترتيب، من جص الأزهر إلى واجهة مسجد الأقمر. ويلاحظ أن نقوش أبواب بدر الجمالي تعطي ألقابه مساحة أكبر بكثير من ألقاب الخليفة المستنصر، «إيماءً إلى صاحب السلطة الفعلية». لمن تخدم مساحة الاسم على الجدار؟
    ur: برنارڈ اوکین قاہرہ کے فاطمی کتبوں کو ترتیب سے دیکھتے ہیں، الازہر کے گچ سے مسجد الاقمر کے سامنے کے حصے تک۔ وہ نوٹ کرتے ہیں کہ بدر الجمالی کے دروازوں پر اس کے القاب خلیفہ المستنصر کے القاب سے کہیں زیادہ جگہ گھیرتے ہیں، «اصل اقتدار والے کی طرف اشارہ»۔ دیوار پر نام کی جگہ کس کے کام آتی ہے؟
