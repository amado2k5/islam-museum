  title:
    en: Society as the subject of a science
    ar: المجتمع موضوعًا لعلم
    ur: معاشرہ ایک علم کا موضوع
  text:
    en: "In the Muqaddima Ibn Khaldun made al-umran, the necessary human association, the subject of his new science. Richard Yeomans, in his guide The Art and Architecture of Islamic Cairo, writes that he developed a sociological explanation of history, analysing geographical, climatic, social, economic and moral factors. How might ideas about society change the way history is written?"
    ar: "جعل ابن خلدون في «المقدمة» العمران، أي الاجتماع الإنساني الضروري، موضوع علمه الجديد. ويكتب ريتشارد يومانز في دليله «فن القاهرة الإسلامية وعمارتها» أنه وضع تفسيرًا اجتماعيًّا للتاريخ، يحلّل فيه العوامل الجغرافية والمناخية والاجتماعية والاقتصادية والأخلاقية. كيف يمكن أن تغيّر أفكار عن المجتمع طريقة كتابة التاريخ؟"
    ur: "ابن خلدون نے «المقدمہ» میں عمران، یعنی ضروری انسانی اجتماع، کو اپنے نئے علم کا موضوع بنایا۔ رچرڈ یومنز اپنے رہنما «قاہرۂ اسلامی کا فن اور فنِ تعمیر» میں لکھتے ہیں کہ انہوں نے تاریخ کی سماجیاتی تشریح تیار کی، جس میں جغرافیائی، موسمی، سماجی، معاشی اور اخلاقی عوامل کا تجزیہ ہے۔ معاشرے کے بارے میں خیالات تاریخ لکھنے کا طریقہ کیسے بدل سکتے ہیں؟"
