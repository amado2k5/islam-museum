  title:
    en: An arch shaped like an upturned boat
    ar: عقد على هيئة قارب مقلوب
    ur: الٹی کشتی جیسی محراب
  text:
    en: In the dome of al-Azhar in Cairo, the dome rests on pointed arches shaped like an upturned boat, standing on old columns held in place by wooden bars. Richard Yeomans describes this as much lighter than the solid brick piers of earlier building. What holds up the roof of a building you know?
    ar: في قبة الأزهر بالقاهرة تستند القبة إلى عقود مدبّبة على هيئة قارب مقلوب فوق أعمدة قديمة تشدّها قضبان خشبية. ويصف ريتشارد ييومانز ذلك بأنه أخف كثيرًا من الدعائم الآجرية الصلبة في البناء الأقدم. ما الذي يحمل سقف بناء تعرفه؟
    ur: قاہرہ میں الازہر کے گنبد میں گنبد الٹی کشتی جیسی نوکیلی محرابوں پر ٹھہرا ہے جو پرانے ستونوں پر کھڑی ہیں اور انہیں لکڑی کی سلاخیں باندھے رکھتی ہیں۔ رچرڈ ییومنز اسے پرانی تعمیر کے ٹھوس اینٹوں کے ستونوں سے بہت ہلکا بتاتا ہے۔ آپ کی جانی ہوئی کسی عمارت کی چھت کو کیا سہارا دیتا ہے؟
