summary:
  en: 'The Ontario Grade 11 course HRT3M: six strands, from research skills and approaches to the study of the sacred to teachings, rites and social contexts. The museum maps four of them, through Islamic examples only.'
  ar: 'مقرر HRT3M للصف الحادي عشر في أونتاريو: ستة محاور، من مهارات البحث ومناهج دراسة المقدس إلى التعاليم والشعائر والسياقات الاجتماعية. ولا يربط المتحف إلا أربعة منها، بأمثلة إسلامية فقط.'
  ur: 'اونٹاریو کا کورس HRT3M برائے جماعت یازدہم: چھ شاخیں، تحقیقی مہارتوں اور مقدس کے مطالعے کے طریقوں سے لے کر تعلیمات، رسوم اور سماجی سیاق تک۔ عجائب گھر ان میں سے چار کو جوڑتا ہے، صرف اسلامی مثالوں سے۔'
  es: "El curso HRT3M de 11.º grado de Ontario consta de seis ejes temáticos, que abarcan desde habilidades de investigación y enfoques para el estudio de lo sagrado hasta enseñanzas, ritos y contextos sociales. El museo ilustra cuatro de ellos, utilizando únicamente ejemplos islámicos."
  fr: "Le cours HRT3M de 11e année en Ontario comprend six volets, allant des méthodes de recherche et des approches de l'étude du sacré aux enseignements, aux rites et aux contextes sociaux. Le musée en présente quatre, à travers des exemples islamiques uniquement."
