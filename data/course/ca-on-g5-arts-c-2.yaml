  text:
    en: 'Maqqari attributes an additional oud string to Ziryab in al-Andalus, following an inherited four-string arrangement: a refinement, not invention of the oud itself. Dwight Reynolds shows how Maqqari assembled older voices into an idealized portrait of one artist, so this is a qualified historical attribution. The photograph shows a much later Cleveland instrument, not one surviving from his court. What did the oud already have before the story begins?'
    ar: ينسب المقري إلى زرياب زيادة وتر خامس في عوده بالأندلس، بعد أن كان ذا أربعة أوتار في وصفه؛ هذه إضافة إلى آلة موروثة، لا اختراع العود نفسه. ويبيّن نقد دوايت رينولدز كيف جمعت سيرة المقري أصواتًا أقدم في صورة مثالية لفنان واحد، فهي نسبة تاريخية مقيدة. أما الصورة فهي لعود متأخر في كليفلاند، لا لآلة نجت من بلاطه. ماذا كان للعود قبل أن تبدأ القصة؟
    ur: مقری اندلس میں زریاب سے عود میں ایک اضافی (پانچویں) تار کا اضافہ منسوب کرتا ہے، جب کہ اس کے بیان میں عود پہلے سے چار تاروں والا تھا؛ یہ ایک موروثی ساز میں اضافہ ہے، خود عود کی ایجاد نہیں۔ ڈوائٹ رینالڈز کی تنقید دکھاتی ہے کہ مقری کی سوانح نے پرانی آوازوں کو ایک فنکار کی مثالی تصویر میں جمع کر دیا، اس لیے یہ ایک مشروط تاریخی نسبت ہے۔ تصویر کلیولینڈ کے ایک بہت بعد کے عود کی ہے، ایسے ساز کی نہیں جو اس کے دربار سے بچا ہو۔ کہانی شروع ہونے سے پہلے عود کے پاس کیا کچھ تھا؟
