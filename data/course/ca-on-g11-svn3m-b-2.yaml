  text:
    en: 'According to English Wikipedia, the Sonali Bag is among Mubarak Ahmad Khan''s inventions; the article describes it as a cellulose-based biodegradable bioplastic bag, offered as a practical alternative to polluting polythene bags. What was the problem, and what new material was offered to answer it?'
    ar: 'تذكر ويكيبيديا الإنجليزية «سونالي باغ» بين اختراعات مبارك أحمد خان، وتصفه بأنه كيس بلاستيكي حيوي من سليلوز الجوت قابل للتحلل، عُرض بديلًا عمليًا لأكياس البوليثين المضرّة بيئيًا. ما المشكلة، وأي مادة جديدة عُرضت للإجابة عنها؟'
    ur: 'انگریزی وکی پیڈیا مبارک احمد خان کی ایجادات میں سونالی بیگ کا ذکر کرتی ہے اور اسے سیلولوز پر مبنی قابلِ تحلیل بایو پلاسٹک کا تھیلا بتاتی ہے، جسے آلودگی پھیلانے والے پولی تھین کے تھیلوں کے عملی متبادل کے طور پر پیش کیا گیا۔ مسئلہ کیا تھا، اور اس کے جواب میں کون سا نیا مادہ پیش کیا گیا؟'
