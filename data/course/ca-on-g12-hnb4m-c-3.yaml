  title:
    en: Indian cotton, then European
    ar: القطن الهندي ثم الأوروبي
    ur: ہندوستانی، پھر یورپی کپاس
  text:
    en: From the seventeenth century cheap Indian cotton yarn and cloth flooded the Ottoman markets, and the weavers used the yarn and imitated Indian cloth. In the second half of the eighteenth century European cottons imitating muslin entered. The entry calls the European mechanisation of the 1830s a turning point, and says cheap imports hastened the collapse of the guilds by the 1850s. What happens to a craft when cheaper cloth reaches its market?
    ar: منذ القرن السابع عشر غمر الغزل والقماش القطني الهندي الرخيص الأسواق العثمانية، فاستعمل الحائكون الغزل وقلدوا القماش الهندي. وفي النصف الثاني من القرن الثامن عشر دخلت أقطان أوروبية تقلد الموسلين. ويعدّ المدخل تمكين أوروبا بالآلات في ثلاثينيات القرن التاسع عشر منعطفًا، ويقول إن الواردات الرخيصة عجّلت انهيار الطوائف في خمسينياته. ماذا يحدث لحرفة حين يصل إلى سوقها قماش أرخص؟
    ur: سترھویں صدی سے ہندوستان کا سستا سوتی دھاگا اور کپڑا عثمانی بازاروں میں بھر گیا، اور جولاہوں نے یہ دھاگا استعمال کیا اور ہندوستانی کپڑے کی نقل کی۔ اٹھارہویں صدی کے دوسرے نصف میں ململ کی نقل کرنے والی یورپی سوتی چیزیں آ گئیں۔ اندراج یورپ کی ۱۸۳۰ کی دہائی کی مشینی ترقی کو موڑ کہتا ہے، اور کہتا ہے کہ سستی درآمدات نے ۱۸۵۰ کی دہائی تک برادریوں کے ٹوٹنے کو تیز کر دیا۔ جب کسی دستکاری کے بازار میں سستا کپڑا پہنچتا ہے تو اس کا کیا ہوتا ہے؟
