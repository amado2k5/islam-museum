  title:
    en: The weavers' guild and its inspection
    ar: طائفة الحائكين ورقابتها
    ur: جولاہوں کی برادری اور اس کی نگرانی
  text:
    en: The weavers of a town agreed the quantity and size of cloth among themselves, and the qadi certified it through the ahi baba. A selected inspector checked output, and cloth that exceeded the size or was faulty was torn and the weaver fined. The weavers often worked to orders from the cloth merchants, and they could not sell their own cloth in the market. What did these arrangements protect?
    ar: اتفق حائكو المدينة فيما بينهم على كمية القماش ومقاسه، وصدّق القاضي ذلك بواسطة أخي بابا. ويفحص مفتش مختار الإنتاج، فما زاد عن المقاس أو كان معيبًا مُزّق وغُرّم الحائك. وكثيرًا ما عمل الحائكون بطلب من البزازين، ولم يكن لهم أن يبيعوا قماشهم في السوق. فما الذي كانت هذه الترتيبات تحميه؟
    ur: شہر کے جولاہے کپڑے کی مقدار اور ناپ آپس میں طے کرتے اور قاضی اخی بابا کے ذریعے اس کی تصدیق کرتا تھا۔ ایک چنا ہوا نگران پیداوار جانچتا، اور جو کپڑا ناپ سے بڑھ جاتا یا عیب دار ہوتا اسے پھاڑ دیا جاتا اور جولاہے پر جرمانہ ہوتا۔ جولاہے اکثر کپڑا فروشوں کے آرڈر پر کام کرتے تھے اور اپنا کپڑا خود بازار میں نہیں بیچ سکتے تھے۔ یہ انتظامات کس چیز کی حفاظت کرتے تھے؟
