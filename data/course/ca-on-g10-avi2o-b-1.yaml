- position: after
  kind: invention
  title:
    en: 'Tiraz: a ruler''s name woven into cloth'
    ar: 'الطراز: اسم الحاكم منسوجًا في الثوب'
    ur: 'طراز: کپڑے میں بُنا ہوا حاکم کا نام'
  text:
    en: Tiraz is a band of writing woven or embroidered into fine garments, carrying the name of the ruler and words of good omen, made in workshops of the state. Ibn Khaldun counts it among the grandest marks of kingship, and says that the Persian kings before Islam put the images of kings in their tiraz, while the kings of Islam put written names. What did a garment tell those who saw it?
    ar: الطراز شريط من الكتابة يُنسج أو يُطرَّز في الثياب الفاخرة، يحمل اسم الحاكم وكلمات تجري مجرى الفأل، ويُصنع في دُور للدولة. يعدّه ابن خلدون من أبّهة الملك والسلطان، ويذكر أن ملوك العجم قبل الإسلام كانوا يجعلون طرازهم بصور الملوك وأشكالهم، ثم اعتاض ملوك الإسلام عن ذلك بكتب أسمائهم. ماذا كان الثوب يخبر به من يراه؟
    ur: طراز ایک تحریری پٹی ہے جو قیمتی لباس میں بُنی یا کڑھی جاتی ہے، اس میں حاکم کا نام اور نیک فال کے کلمات ہوتے ہیں، اور وہ ریاست کے کارخانوں میں بنتی تھی۔ ابن خلدون اسے بادشاہت اور سلطنت کی شان میں شمار کرتے ہیں، اور بتاتے ہیں کہ اسلام سے پہلے عجم کے بادشاہ اپنے طراز میں بادشاہوں کی تصویریں اور شکلیں رکھتے تھے، پھر اسلام کے بادشاہوں نے اس کے بدلے اپنے ناموں کی تحریر رکھی۔ لباس دیکھنے والوں کو کیا بتاتا تھا؟
  entity: invention/tiraz
  sources:
  - source/muqaddima-ibn-khaldun
  - source/tdv-tiraz
