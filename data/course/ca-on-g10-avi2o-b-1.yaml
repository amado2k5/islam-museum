  title:
    en: The Dome of the Rock in two descriptions
    ar: قبة الصخرة في وصفين
    ur: قبۃ الصخرہ دو بیانات میں
  text:
    en: Al-Maqdisi described the Dome of the Rock around 375 AH as an octagonal building with four gilded doors, each facing a flight of steps. Inside, he says, three ambulatories circle on columns that he calls finer than marble, and above them is a dome sheathed in gilded brass a hundred cubits high. Later al-Umari recorded door leaves sheathed in chased yellow brass. Which materials does each writer notice first?
    ar: وصف المقدسي قبة الصخرة نحو سنة 375هـ فقال إنها بيت مثمّن بأربعة أبواب مذهّبة يقابل كل باب منها مرقاة. وفي داخلها، كما يقول، ثلاثة أروقة دائرة على أعمدة يراها أجلّ من الرخام، وفوقها قبة ملبسة بالصفر المذهب طولها مئة ذراع. وذكر العمري لاحقًا مصراعين ملبّسين بالنحاس الأصفر المنقوش. أي المواد يلتفت إليها كل واصف أولًا؟
    ur: المقدسی نے تقریباً 375ھ میں قبۃ الصخرہ کو آٹھ پہلو والی عمارت بتایا جس کے چار سنہری دروازے ہیں اور ہر دروازے کے سامنے سیڑھیاں ہیں۔ ان کے بقول اندر تین گشتی راہداریاں ہیں جو ستونوں پر گھومتی ہیں اور جنہیں وہ سنگِ مرمر سے بڑھ کر کہتے ہیں، اور ان کے اوپر سو ہاتھ بلند گنبد ہے جس پر سنہری پیتل چڑھا ہے۔ بعد میں العمری نے ایسے دروازوں کے پٹ لکھے جن پر نقش دار زرد پیتل چڑھا تھا۔ ہر بیان کرنے والا سب سے پہلے کن مواد کی طرف توجہ کرتا ہے؟
