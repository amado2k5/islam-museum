  title:
    en: Glass and gold on the walls of Damascus
    ar: الزجاج والذهب على جدران دمشق
    ur: دمشق کی دیواروں پر شیشہ اور سونا
  text:
    en: Gold-leaf tesserae are small glass cubes carrying a leaf of gold or silver, used to decorate the Great Umayyad Mosque of Damascus. Its walls were covered inside and out with glass mosaic, and Nadine Schibille estimates its mosaics needed about 170 tons of glass. Tenth-century Arab sources, Schibille notes, say the tesserae and workmen came from the Byzantine empire. Whose skills and materials went into this work?
    ar: فصوص الفسيفساء المذهبة قطع زجاجية صغيرة تحمل ورقة ذهب ⁦(أو فضة)⁩، زُيّن بها الجامع الأموي بدمشق. وكسيت جدرانه بالفسيفساء الزجاجية داخلًا وخارجًا، وتقدّر نادين شيبيل ما احتاجته فسيفساؤه بنحو 170 طنًا من الزجاج. وتذكر أن مصادر عربية من القرن العاشر تقول إن الفصوص والصناع جاؤوا من بلاد الروم. فمهارات من ومواد من دخلت في هذا العمل؟
    ur: سونے کے ورق والے شیشے کے ٹکڑے چھوٹے شیشے کے مکعب ہیں جن پر سونے یا چاندی کا ورق ہوتا ہے، اور ان سے دمشق کی جامع اموی کو آراستہ کیا گیا۔ اس کی دیواریں اندر اور باہر شیشے کے موزیک سے ڈھانپی گئیں، اور نادین شیبیل کے اندازے میں اس کے موزیک کو تقریباً 170 ٹن شیشہ درکار تھا۔ شیبیل لکھتی ہیں کہ دسویں صدی کے عربی مآخذ کہتے ہیں کہ یہ ٹکڑے اور کاریگر بازنطینی سلطنت سے آئے تھے۔ اس کام میں کس کی مہارت اور کس کا مواد لگا؟
  entity: concept/gold-leaf-glass-tesserae
  sources:
