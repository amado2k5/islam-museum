  title:
    en: A day set aside by the United Nations
    ar: يوم خصّصته الأمم المتحدة
    ur: اقوامِ متحدہ کا مقرر کردہ ایک دن
  text:
    en: 'The International Day to Combat Islamophobia falls on 15 March, the anniversary of the 2019 attack on two mosques in Christchurch, New Zealand, in which 51 people were killed during Friday prayer. The United Nations places the Day within its wider work against hate speech, including the 2019 Strategy and Plan of Action on Hate Speech and the #NoToHate campaign. What can a commemoration do that a law cannot?'
    ar: يوافق اليوم الدولي لمكافحة الإسلاموفوبيا 15 مارس، ذكرى الهجوم على مسجدين في كرايستشيرش بنيوزيلندا سنة 2019، الذي قُتل فيه 51 شخصًا أثناء صلاة الجمعة. وتضع الأمم المتحدة اليوم ضمن جهدها الأوسع ضد خطاب الكراهية، ومنه استراتيجية 2019 وخطة العمل بشأن خطاب الكراهية وحملة «لا للكراهية». فماذا تستطيع ذكرى أن تفعل لا يستطيعه قانون؟
    ur: اسلاموفوبیا کے خلاف عالمی دن 15 مارچ کو آتا ہے، جو 2019 میں نیوزی لینڈ کے شہر کرائسٹ چرچ میں دو مساجد پر حملے کی برسی ہے، جس میں جمعے کی نماز کے دوران 51 افراد مارے گئے۔ اقوامِ متحدہ اس دن کو نفرت انگیز تقریر کے خلاف اپنے وسیع تر کام کے اندر رکھتی ہے، جس میں 2019 کی حکمتِ عملی اور نفرت انگیز تقریر پر لائحۂ عمل اور «نو ٹو ہیٹ» مہم شامل ہیں۔ ایک یادگار وہ کیا کر سکتی ہے جو قانون نہیں کر سکتا؟
