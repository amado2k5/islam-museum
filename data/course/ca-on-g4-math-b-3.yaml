connections:
- position: within
  kind: invention
  title:
    en: Joining and separating
    ar: الضم والتفريق
    ur: جوڑنا اور الگ کرنا
  text:
    en: 'The record gives Ibn Khaldun''s account of arithmetic as reckoning numbers by joining and separating: joining one by one is addition, and joining by multiples is multiplication; separating one by one is subtraction, and separating into equal parts is division. Indian reckoning, it says, is doing these four operations with numerals written in their places. Which of the four does each of your problems ask for?'
    ar: 'يعرض السجل قول ابن خلدون في صناعة الحساب أنها حسبان الأعداد بالضم والتفريق: الضم بالإفراد هو الجمع، وبالتضعيف هو الضرب، والتفريق بالإفراد هو الطرح، وبالتجزئة إلى أجزاء متساوية هو القسمة. ويقول إن الحساب الهندي هو أداء هذه الأعمال الأربعة بالأرقام المكتوبة في خاناتها. أي هذه الأعمال الأربعة تطلبه كل مسألة من مسائلك؟'
    ur: 'ریکارڈ فنِ حساب کے بارے میں ابن خلدون کا بیان پیش کرتا ہے کہ وہ اعداد کو جوڑنے اور الگ کرنے کے ذریعے گننا ہے: ایک ایک کر کے جوڑنا جمع ہے اور گنا کر کے جوڑنا ضرب؛ ایک ایک کر کے الگ کرنا تفریق ہے اور برابر حصوں میں بانٹنا تقسیم۔ وہ کہتا ہے کہ ہندی حساب انہی چار عملوں کو اپنے اپنے خانوں میں لکھے ہندسوں سے انجام دینا ہے۔ آپ کا ہر مسئلہ ان چاروں میں سے کون سا عمل مانگتا ہے؟'
  entity: invention/algorism
