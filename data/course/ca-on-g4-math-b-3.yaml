- position: after
  kind: invention
  title:
    en: From al-Khwarizmi to "algorithm"
    ar: من الخوارزمي إلى «algorithm»
    ur: خوارزمی سے «algorithm» تک
  text:
    en: Where does the word "algorithm" come from? The record says al-Khwarizmi's Arabic book on Indian reckoning is lost, but a twelfth-century Latin translation survives that opens "Dixit Algorizmi", "al-Khwarizmi said". The editors of the Cairo edition of his algebra say that Westerners learned arithmetic from this Latin translation and from books built on it; his Latin name, "Algorismus", became a name for the numerals themselves, and from it comes the word "algorithm". Which steps does your own method for adding follow?
    ar: من أين جاءت كلمة «algorithm»؟ يقول السجل إن الأصل العربي لكتاب الخوارزمي في الحساب الهندي ضاع، وبقيت ترجمة لاتينية له من القرن الثاني عشر تبدأ بعبارة «Dixit Algorizmi»، أي «قال الخوارزمي». ويقول محققا طبعة القاهرة لكتاب الجبر والمقابلة للخوارزمي إن الغربيين تعلموا الحساب من هذه الترجمة اللاتينية ومن كتب بُنيت عليها؛ وصار اسم الخوارزمي اللاتيني «Algorismus» اسماً للأرقام نفسها، ومنه جاءت كلمة «algorithm». ما الخطوات التي تتبعها طريقتك في الجمع؟
    ur: لفظ «algorithm» کہاں سے آیا؟ ریکارڈ کہتا ہے کہ خوارزمی کی ہندی حساب پر کتاب کا عربی اصل گم ہو گیا، مگر بارہویں صدی کا ایک لاطینی ترجمہ باقی ہے جو «Dixit Algorizmi» یعنی «خوارزمی نے کہا» سے شروع ہوتا ہے۔ خوارزمی کی الجبر کے قاہرہ ایڈیشن کے مدیر کہتے ہیں کہ مغربیوں نے حساب اسی لاطینی ترجمے اور اس پر بنی کتابوں سے سیکھا؛ خوارزمی کا لاطینی نام «Algorismus» خود ہندسوں کا نام بن گیا، اور اسی سے لفظ «algorithm» آیا۔ جمع کرنے کا آپ کا اپنا طریقہ کون سے قدم اٹھاتا ہے؟
