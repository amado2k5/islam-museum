summary:
  en: 'The Ontario Grade 12 course HNB4M: four strands, from research skills, history and influences to textile production, globalization, and design and construction skills. The museum maps two of them, through its records on textiles, tiraz, turbans and weaving.'
  ar: 'مقرر HNB4M للصف الثاني عشر في أونتاريو: أربعة محاور، من مهارات البحث والتاريخ والتأثيرات إلى إنتاج النسيج والعولمة ومهارات التصميم والخياطة. ويربط المتحف محورين منها بسجلات النسيج والطراز والعمائم والحياكة.'
  ur: 'اونٹاریو کا کورس HNB4M برائے جماعت دوازدہم: چار شاخیں، تحقیقی مہارتوں، تاریخ اور اثرات سے لے کر ٹیکسٹائل کی پیداوار، عالمگیریت اور ڈیزائن و سلائی کی مہارتوں تک۔ عجائب گھر ان میں سے دو کو کپڑے، طراز، عماموں اور بُنائی کے اندراجات سے جوڑتا ہے۔'
