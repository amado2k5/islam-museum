summary:
  en: 'The Ontario Grade 12 course HNB4M: four strands, from research skills, history and influences to textile production, globalization, and design and construction skills. The museum maps two of them, through its records on textiles, tiraz, turbans and weaving.'
  ar: 'مقرر HNB4M للصف الثاني عشر في أونتاريو: أربعة محاور، من مهارات البحث والتاريخ والتأثيرات إلى إنتاج النسيج والعولمة ومهارات التصميم والخياطة. ويربط المتحف محورين منها بسجلات النسيج والطراز والعمائم والحياكة.'
  ur: 'اونٹاریو کا کورس HNB4M برائے جماعت دوازدہم: چار شاخیں، تحقیقی مہارتوں، تاریخ اور اثرات سے لے کر ٹیکسٹائل کی پیداوار، عالمگیریت اور ڈیزائن و سلائی کی مہارتوں تک۔ عجائب گھر ان میں سے دو کو کپڑے، طراز، عماموں اور بُنائی کے اندراجات سے جوڑتا ہے۔'
  es: "El curso HNB4M de 12.º grado de Ontario se compone de cuatro ejes temáticos: desde habilidades de investigación, historia e influencias hasta producción textil, globalización y habilidades de diseño y confección. El museo ilustra dos de ellos a través de sus registros sobre textiles, tiraz, turbantes y tejido."
  fr: "Le cours HNB4M de 12e année en Ontario comprend quatre volets, allant des compétences en recherche, à l'histoire et aux influences, en passant par la production textile, la mondialisation et les techniques de conception et de fabrication. Le musée en illustre deux à travers ses collections sur les textiles, les tiraz, les turbans et le tissage."
  tr: "Ontario'daki 12. sınıf için HNB4M müfredatı dört ana alanı kapsar: araştırma becerileri, tarih ve etkiler; tekstil üretimi ve küreselleşme; ve tasarım ve dikiş becerileri. Müze, bu alanlardan ikisini tekstil kayıtları, desenler, türbanlar ve örgü ile ilişkilendirir."
  id: "Kurikulum HNB4M untuk kelas 12 di Ontario mencakup empat bidang utama: keterampilan penelitian, sejarah, dan pengaruh; produksi tekstil dan globalisasi; serta keterampilan desain dan menjahit. Museum ini menghubungkan dua bidang tersebut dengan catatan tekstil, pola, turban, dan rajutan."
