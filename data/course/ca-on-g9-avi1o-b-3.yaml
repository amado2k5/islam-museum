  title:
    en: Geometry, building and a palace school
    ar: الهندسة والبناء ومدرسة القصر
    ur: جیومیٹری، تعمیر اور محل کا مدرسہ
  text:
    en: 'The TDV entry says the architect designs a building and oversees its construction, and was expected to know geometry, building technique and the measurement of land. The entry on the chief architect adds that the palace office was a school: chosen young men learned theory and practice in a master-apprentice relationship. After the Imperial Land Engineering School was founded in 1795, its graduates began to qualify as architects. Which path would you have taken?'
    ar: يقول مدخل موسوعة TDV إن المعمار هو من يضع تصميم البناء ويشرف على تنفيذه، وكان يُنتظر منه أن يعرف الهندسة وفن البناء ومساحة الأرض. ويضيف مدخل رئيس المعماريين أن الديوان كان مدرسة من مدارس القصر، يتلقى فيها فتيان مختارون دروسًا نظرية وعملية في علاقة معلّم بتلميذ. وبعد إنشاء «مدرسة المهندسخانة البرية» سنة 1795م صار المعماريون يتخرجون منها. أي مسار كنت ستسلك؟
    ur: 'ٹی ڈی وی کا اندراج کہتا ہے کہ معمار عمارت کا نقشہ بناتا اور اس کی تعمیر کی نگرانی کرتا ہے، اور اس سے توقع تھی کہ وہ جیومیٹری، تعمیر کی فن اور زمین کی پیمائش جانتا ہو۔ رئیس المعماروں پر اندراج مزید کہتا ہے کہ محل کا دفتر محل کا ایک مدرسہ تھا: منتخب نوجوان استاد اور شاگرد کے رشتے میں نظری اور عملی سبق لیتے تھے۔ 1795ء میں «مہندس خانہ برّی ہمایوں» کے قیام کے بعد اس کے فارغ التحصیل معمار کے طور پر اہل ہونے لگے۔ آپ کون سا راستہ اختیار کرتے؟'
  entity: job/architect
