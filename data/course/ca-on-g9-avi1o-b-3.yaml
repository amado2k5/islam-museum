  title:
    en: Meshk and the licence
    ar: المشق والإجازة
    ur: مشق اور اجازت
  text:
    en: 'The TDV entry on the calligrapher says teaching is called meshk, or practice: the master writes a model line in a lesson, and the pupil copies it and shows it to him. The licence is given once the pupil has copied a piece by an old master chosen by his teacher, at a ceremony before a jury of calligraphers who endorse it in writing. What would you copy first?'
    ar: يقول مدخل موسوعة TDV عن الخطاط إن التعليم يُسمّى «المشق»، فيكتب الأستاذ سطرًا نموذجيًا في الدرس، ويكتب التلميذ مثله ويعرضه عليه. وتتم الإجازة بعد أن يقلّد الطالب قطعة لأستاذ قديم اختاره أستاذه، في احتفال يحضره خطاطون يصدّقون الإجازة كتابةً. ماذا كنت ستنسخ أولًا؟
    ur: 'خطاط پر ٹی ڈی وی کا اندراج کہتا ہے کہ تعلیم کو «مشق» کہتے ہیں: استاد سبق میں ایک نمونے کی سطر لکھتا ہے، اور شاگرد اسی کی نقل لکھ کر اسے دکھاتا ہے۔ اجازت اس وقت دی جاتی ہے جب شاگرد کسی پرانے استاد کا وہ ٹکڑا نقل کر لے جو اس کے استاد نے چنا ہو، ایک تقریب میں جہاں خطاطوں کی ایک جیوری اسے تحریری طور پر تصدیق کرتی ہے۔ آپ سب سے پہلے کیا نقل کرتے؟'
  entity: job/calligrapher
