  title:
    en: Inlaying brass and bronze
    ar: تطعيم النحاس الأصفر والبرونز
    ur: پیتل اور کانسی کی جڑائی
  text:
    en: The Nuhad Es-Said collection booklet describes inlaying brass and bronze with gold, silver and copper as a technique developed to an unequalled degree in Islamic culture. It sees the technique fully developed at Herat in the second half of the twelfth century, in inkwells and bowls inlaid with silver, copper and a black compound. What would you need to learn before you tried a technique this demanding?
    ar: يصف كتيب مجموعة نهاد السعيد تطعيم أواني النحاس الأصفر والبرونز بالذهب والفضة والنحاس بأنه تطور في الحضارة الإسلامية تطورًا لا نظير له، ويرى أنه نضج في هراة في النصف الثاني من القرن الثاني عشر، في محابر وسلطانيات مطعمة بالفضة والنحاس ومادة سوداء. ماذا عليك أن تتعلم قبل أن تجرّب تقنية بهذه الصعوبة؟
    ur: نہاد السعید مجموعے کا کتابچہ پیتل اور کانسی میں سونے، چاندی اور تانبے کی جڑائی کو ایسی تکنیک بتاتا ہے جو اسلامی تہذیب میں بے مثال حد تک ترقی پا گئی۔ وہ اسے بارہویں صدی کے دوسرے نصف میں ہرات میں پوری طرح پختہ دیکھتا ہے، دواتوں اور پیالوں میں جو چاندی، تانبے اور ایک سیاہ مرکب سے جڑے ہیں۔ ایسی مشکل تکنیک آزمانے سے پہلے آپ کو کیا سیکھنا ہوگا؟
  entity: concept/inlaid-metalwork
