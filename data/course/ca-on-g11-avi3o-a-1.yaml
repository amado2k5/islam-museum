  title:
    en: Pigments and gold leaf
    ar: الألوان وورق الذهب
    ur: رنگ اور سونے کا ورق
  text:
    en: 'In Persian painting the pigments were mostly mineral: ground to a soft powder on a hard stone, sifted, washed and mixed with egg-white, glue or gum arabic, as Norah Titley describes. Blue came from lapis lazuli. Gold leaf was made by pounding gold thin between layers of deerskin, then brushed on and burnished with agate. Which of these materials or steps could you test, and how would you adapt it?'
    ar: 'كانت الألوان في التصوير الفارسي معدنية في الغالب: يطحن المعدن ناعمًا على حجر صلب، ثم ينخل ويغسل ويخلط بزلال البيض أو الغراء أو الصمغ العربي، كما تصف نورا تيتلي. وكان الأزرق يستخرج من اللازورد. وكان ورق الذهب يحضر بدق الذهب حتى يرق بين طبقات جلد الغزال، ثم يطلى بالفرشاة ويصقل بالعقيق. أي هذه المواد أو الخطوات تستطيع أن تجرّبها، وكيف تكيّفها؟'
    ur: 'فارسی مصوری میں رنگ زیادہ تر معدنی تھے: معدن کو سخت پتھر پر باریک پیسا جاتا، چھانا اور دھویا جاتا، پھر انڈے کی سفیدی، سریش یا گوند عربی میں ملایا جاتا، جیسا کہ نورا ٹائٹلی بیان کرتی ہیں۔ نیلا رنگ لاجورد سے آتا تھا۔ سونے کا ورق ہرن کی کھال کی تہوں کے درمیان سونے کو پتلا کوٹ کر بنایا جاتا، پھر برش سے لگا کر عقیق سے چمکایا جاتا۔ ان میں سے کون سا مواد یا مرحلہ آپ آزما سکتے ہیں، اور اسے کیسے ڈھالیں گے؟'
  entity: practice/persian-painting-pigments-and-gold
  sources:
  - source/titley-persian-miniature-painting-1983
- position: within
  kind: career
  title:
    en: The reed pen, the ink and the gold
    ar: قلم القصب والمداد والذهب
    ur: سرکنڈے کا قلم، روشنائی اور سونا
  text:
    en: 'The calligrapher writes the hand with a reed pen and black soot ink. The entry gives a rough nib width: about 1 mm for naskh and about 2 to 2.5 mm for thuluth. Gold is applied as gold ink, or as gold leaf fixed with an adhesive made from seed oil and then burnished with a stone called zermuhre. How would a different tool change the line you draw?'
    ar: 'يُكتب الخط بقلم من القصب ومداد أسود من السخام. وتذكر الموسوعة مقاسًا تقريبيًا لعرض فوهة القلم: نحو ملّيمتر للنسخ، ونحو ملّيمترين إلى ملّيمترين ونصف للثلث. ويُكتب الذهب بمداد ذهبي، أو بورق الذهب الذي يُلصق بمادة لاصقة من زيت البِزر ثم يُصقل بحجر يُسمّى «زرمهره». كيف تغيّر أداةٌ أخرى الخطَّ الذي ترسمه؟'
    ur: 'خط سرکنڈے کے قلم اور کاجل کی سیاہ روشنائی سے لکھا جاتا ہے۔ اندراج قلم کی نوک کی چوڑائی کا ایک موٹا اندازہ دیتا ہے: نسخ کے لیے تقریباً ایک ملی میٹر اور ثلث کے لیے تقریباً دو سے ڈھائی ملی میٹر۔ سونا سنہری روشنائی سے لگایا جاتا ہے، یا سونے کے ورق سے جو بیج کے تیل سے بنے چپکنے والے مادے سے جمایا اور پھر زرمُہرہ نامی پتھر سے چمکایا جاتا ہے۔ کوئی دوسرا اوزار آپ کی کھینچی ہوئی لکیر کو کیسے بدلے گا؟'
  entity: job/calligrapher
