  title:
    en: Lawful, unlawful and doubtful
    ar: الحلال والحرام والمشتبه
    ur: حلال، حرام اور مشتبہ
  text:
    en: 'This is Ibn Rajab’s classification of rulings and things, not a food list. In his commentary he divides them into plainly lawful, plainly unlawful, and doubtful matters between them. As plainly lawful he gives the good foods: crops, fruits and livestock. As plainly unlawful he gives carrion, blood, pork and wine. As doubtful he gives what is disputed, such as horses, mules, donkeys, the dabb lizard and drinks that intoxicate when abundant. Which of these would shape a family''s shopping list?'
    ar: هذا تصنيف لابن رجب للأحكام والأعيان، لا قائمة أطعمة. يعرض في شرحه تقسيم الأحكام والأعيان إلى حلال محض وحرام محض وأمور مشتبهات بينهما. فالحلال المحض عنده أكل الطيبات من الزروع والثمار وبهيمة الأنعام. والحرام المحض كالميتة والدم ولحم الخنزير والخمر. والمشتبه ما اختلف في حله أو تحريمه كالخيل والبغال والحمير والضب والأنبذة التي يسكر كثيرها. فأيّ هذه يؤثر في قائمة مشتريات الأسرة؟
    ur: 'یہ ابن رجب کی احکام اور چیزوں کی درجہ بندی ہے، کھانوں کی فہرست نہیں۔ وہ اپنی شرح میں چیزوں کو خالص حلال، خالص حرام اور ان کے بیچ مشتبہ امور میں بانٹتے ہیں۔ خالص حلال میں وہ اچھی غذائیں رکھتے ہیں: کھیتیاں، پھل اور مویشی۔ خالص حرام میں مردار، خون، سور کا گوشت اور شراب۔ اور مشتبہ میں وہ چیزیں جن کے حلال یا حرام ہونے میں اختلاف ہے، جیسے گھوڑے، خچر، گدھے، ضب ⁦(گوہ)⁩ اور وہ مشروبات جن کی زیادہ مقدار نشہ دیتی ہے۔ ان میں سے کون سی چیز کسی گھرانے کی خریداری کی فہرست پر اثر ڈالے گی؟'
