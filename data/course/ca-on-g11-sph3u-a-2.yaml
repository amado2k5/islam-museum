  title:
    en: Ibn al-Haytham and his book on optics
    ar: ابن الهيثم وكتابه في البصريات
    ur: ابن الہیثم اور بصریات پر ان کی کتاب
  text:
    en: Al-Hasan ibn al-Haytham was an Arab scholar of mathematics and physics, known for his book Kitab al-Manazir on optics. The editor of the book's edition describes him as having lived in the fifth century AH. What can one book tell us about a scholar's contribution to a field?
    ar: الحسن بن الهيثم عالم عربي في الرياضيات والفيزياء، اشتهر بكتابه «المناظر» في البصريات. يصفه محقق طبعة الكتاب بأنه عاش في القرن الخامس الهجري. ماذا يخبرنا كتاب واحد عن إسهام عالم في ميدانه؟
    ur: الحسن ابن الہیثم ریاضی اور طبیعیات کے عرب عالم تھے، جو بصریات پر اپنی کتاب «المناظر» کے لیے معروف ہیں۔ کتاب کے ایڈیشن کے محقق انہیں پانچویں صدی ہجری کا بتاتے ہیں۔ ایک کتاب کسی عالم کے اپنے میدان میں حصے کے بارے میں ہمیں کیا بتاتی ہے؟
  entity: person/ibn-al-haytham
  sources:
