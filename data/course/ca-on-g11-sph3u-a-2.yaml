- position: within
  kind: invention
  title:
    en: A balance for metals and gems
    ar: ميزان للمعادن والأحجار
    ur: دھاتوں اور جواہر کے لیے ایک ترازو
  text:
    en: Abd al-Rahman al-Khazini described a balance that combines weighing in air, weighing in liquid and calibrated pan positions to investigate metals and gems, as Robert E. Hall explains. The instrument has a long beam, a sensitive indicator tongue and five pans. The record says this is not weighing invented from nothing, but a refinement within a long hydrostatic-balance tradition. Is a refinement a contribution?
    ar: وصف عبد الرحمن الخازني ميزانًا يجمع الوزن في الهواء والوزن في السائل ومواضع كفف مضبوطة ليختبر المعادن والأحجار، كما يشرح روبرت هول. وللميزان عارضة طويلة ولسان حساس وخمس كفف. ويقول السجل إن القصة ليست اختراع الوزن من الصفر، بل بلوغ تقليد طويل من الموازين المائية مرحلة أدق. هل يُعدّ التحسين إسهامًا؟
    ur: عبد الرحمٰن الخازنی نے ایک ایسا ترازو بیان کیا جو ہوا میں تول، مائع میں تول اور پلڑوں کے ناپے ہوئے مقامات کو ملا کر دھاتوں اور جواہر کو پرکھتا ہے، جیسا کہ رابرٹ ای ہال بیان کرتے ہیں۔ آلے میں لمبی ڈنڈی، حساس زبان اور پانچ پلڑے ہیں۔ ریکارڈ کہتا ہے کہ یہ تول کی ایجاد صفر سے نہیں، بلکہ مائی ترازوؤں کی طویل روایت کا ایک زیادہ باریک مرحلہ ہے۔ کیا کسی بہتری کو بھی خدمت کہا جا سکتا ہے؟
  entity: invention/balance-of-wisdom
  sources:
  - source/khazini-hall-dsb
- position: after
  kind: invention
  title:
    en: A vessel that catches displaced water
    ar: إناء يجمع الماء المزاح
    ur: ہٹے ہوئے پانی کو جمع کرنے والا برتن
  text:
    en: The Balance of Wisdom transmits a conical vessel attributed to Abu Rayhan al-Biruni, which directs displaced water through a side tube into a balance pan. Weighing that water allows sample volume and weight to be compared, but drops can remain in the tube. The record calls this a measurement refinement with operating difficulties, not the invention of buoyancy. What does a contribution look like when its difficulties are recorded too?
    ar: ينقل «ميزان الحكمة» وصف إناء مخروطي منسوب إلى أبي الريحان البيروني، يوجه الماء المزاح عبر أنبوب جانبي إلى كفة ميزان. وبوزن ذلك الماء يمكن مقارنة حجم العينة ووزنها، لكن قطرات قد تبقى في الأنبوب. ويصفه السجل بأنه تحسين لأداة قياس وصعوبة في تشغيلها، لا اختراع الطفو. كيف يبدو الإسهام حين تُسجَّل صعوباته أيضًا؟
    ur: «میزان الحکمہ» ایک مخروطی برتن کا بیان نقل کرتا ہے جو ابو ریحان البیرونی سے منسوب ہے اور جو ہٹائے گئے پانی کو ایک پہلو کی نالی سے ترازو کے پلڑے میں پہنچاتا ہے۔ اس پانی کو تول کر نمونے کے حجم اور وزن کا موازنہ ممکن ہے، لیکن نالی میں قطرے رہ سکتے ہیں۔ ریکارڈ اسے پیمائش کی بہتری اور اس کے چلانے کی دشواری کہتا ہے، نہ کہ طفو کی ایجاد۔ جب کسی خدمت کی دشواریاں بھی درج ہوں تو وہ کیسی نظر آتی ہے؟
  entity: invention/biruni-displacement-vessel
