  title:
    en: Ten kinds of land, four kinds of water
    ar: عشرة أنواع من الأرض وأربعة مصادر للماء
    ur: زمین کی دس اقسام، پانی کے چار ذرائع
  text:
    en: 'Ibn Bassal does not treat a garden''s soil as one material. In his book he tells four water sources and ten practical land types apart, then relates the properties he observes to season and plant. The record adds that these are not modern laboratory categories: soil is described in the old vocabulary of heat, cold, moisture and dryness. What would you ask of soil and water before choosing a plant?'
    ar: 'لا يعامل ابن بصال أرض البستان مادة واحدة. ففي «القصد والبيان» يميز أربعة مصادر للماء وعشرة أنواع عملية من الأرض، ثم يربط الخواص التي يلاحظها بالموسم والنبات. ويبين السجل أن هذه الفئات ليست معيارًا مخبريًا حديثًا، فالنص يصف ذلك بلغة الطبائع القديمة: الحرارة والبرودة والرطوبة واليبوسة. فماذا تسأل عن الأرض والماء قبل أن تختار نباتًا؟'
    ur: 'ابن بصال باغ کی مٹی کو ایک ہی مادہ نہیں سمجھتے۔ اپنی کتاب میں وہ پانی کے چار ذرائع اور زمین کی دس عملی اقسام میں فرق کرتے ہیں، پھر جن خصوصیات کا وہ مشاہدہ کرتے ہیں انہیں موسم اور پودے سے جوڑتے ہیں۔ اندراج مزید کہتا ہے کہ یہ جدید تجربہ گاہی زمرے نہیں ہیں: مٹی کو حرارت، برودت، رطوبت اور یبوست کی قدیم زبان میں بیان کیا گیا ہے۔ پودا چننے سے پہلے آپ مٹی اور پانی کے بارے میں کیا پوچھیں گے؟'
