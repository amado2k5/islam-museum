connections:
- position: before
  kind: reflection
  title:
    en: What is Arabic?
    ar: ما العربية؟
    ur: عربی کیا ہے؟
  text:
    en: In the lexicon, Arabic is eloquence and purity of speech; the Arabic language is what the Arabs spoke, and the Qur'an came down in it. The Kuwaiti jurists' encyclopaedia, which the record follows, adds that Arabic has merit as the tongue of the people of paradise and that a person is rewarded for learning and teaching it. How does a community's view of its language shape the way others learn it?
    ar: العربية في اللغة الفصاحة، واللغة العربية ما نطقت به العرب، ونزل القرآن بها. وتضيف الموسوعة الفقهية الكويتية، التي يتبعها السجل، أن للعربية فضلاً لأنها لسان أهل الجنة، وأن المرء يثاب على تعلمها وتعليمها. كيف تؤثر نظرة جماعة إلى لغتها في طريقة تعلم الآخرين لها؟
    ur: لغت میں عربی کا مطلب فصاحت ہے، اور عربی زبان وہ ہے جو عرب بولتے تھے اور قرآن اسی میں نازل ہوا۔ کویتی فقہی انسائیکلوپیڈیا، جس کی پیروی اندراج کرتا ہے، اضافہ کرتا ہے کہ عربی کو اہلِ جنت کی زبان ہونے کی فضیلت ہے اور اسے سیکھنے سکھانے پر اجر ملتا ہے۔ کسی جماعت کا اپنی زبان کے بارے میں نظریہ دوسروں کے اسے سیکھنے کے انداز کو کیسے متاثر کرتا ہے؟
  entity: concept/arabiyya
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: within
  kind: story
  title:
    en: How the script travelled
    ar: كيف انتقل الخط
    ur: رسم الخط کا سفر
  text:
    en: Al-Baladhuri relays a report from al-Sharqi ibn al-Qatami that three men of Tayy devised the script, measuring the spelling of Arabic against the spelling of Syriac. People of al-Anbar learned it from them, then the people of al-Hira, and Bishr ibn Abd al-Malik taught it in Mecca. The record notes that this is a single report from one narrator and needs a further source. What would you check next?
    ar: ينقل البلاذري عن الشرقي بن القطامي أن ثلاثة من طيئ وضعوا الخط وقاسوا هجاء العربية على هجاء السريانية. وتعلمه منهم قوم من أهل الأنبار، ثم أهل الحيرة، وعلّمه بشر بن عبد الملك في مكة. ويلاحظ السجل أن هذه رواية واحدة منسوبة إلى راوٍ واحد وأنها تحتاج إلى مصدر إضافي. ماذا ستتحقق منه بعد ذلك؟
    ur: البلاذری الشرقی بن القطامی سے روایت نقل کرتے ہیں کہ طے کے تین آدمیوں نے رسم الخط وضع کیا اور عربی کے ہجے کو سریانی کے ہجے پر پرکھا۔ ان سے انبار کے لوگوں نے سیکھا، پھر حیرہ والوں نے، اور بشر بن عبد الملک نے اسے مکہ میں سکھایا۔ اندراج نوٹ کرتا ہے کہ یہ ایک ہی راوی سے منسوب ایک ہی روایت ہے اور اسے مزید ماخذ کی ضرورت ہے۔ آپ آگے کیا جانچیں گے؟
  entity: event/arabic-script-origin
  sources:
