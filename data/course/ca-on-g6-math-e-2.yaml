connections:
- position: within
  kind: invention
  title:
    en: One cubit by one cubit
    ar: ذراع في ذراع
    ur: ایک ذراع ضرب ایک ذراع
  text:
    ar: خصّ الخوارزمي علم المساحة بباب في كتابه يبدأ بأن معنى «واحد في واحد» إنما هو مساحة، ومعناه ذراع في ذراع. وتكسير المثلث، أي مساحته، أن تضرب عموده في نصف قاعدته، وتكسير المعيّن أن تضرب أحد القطرين في نصف الآخر. وفي مثلث أضلاعه ثلاثة عشر وأربعة عشر وخمسة عشر ذراعاً يخرج العمود اثني عشر والتكسير أربعة وثمانين. هل تستطيع أن تُري قاعدة المعيّن بتقطيعه؟
    en: Al-Khwarizmi gave mensuration a chapter of his book, which opens by saying that "one by one" means an area, a cubit by a cubit. The area of a triangle, he says, is its height times half its base, and of a rhombus one diagonal times half the other. For a triangle with sides of thirteen, fourteen and fifteen cubits, the height comes out at twelve and the area at eighty-four. Can you show the rhombus rule by cutting the shape up?
    ur: خوارزمی نے مساحت کے لیے اپنی کتاب میں ایک باب رکھا جو اس بات سے شروع ہوتا ہے کہ «ایک ضرب ایک» کا مطلب رقبہ ہے، یعنی ایک ذراع ضرب ایک ذراع۔ مثلث کا تکسیر یعنی رقبہ اس کا عمود ضرب نصف قاعدہ ہے، اور معین کا ایک قطر ضرب دوسرے کا نصف۔ تیرہ، چودہ اور پندرہ ذراع کے اضلاع والے مثلث میں عمود بارہ اور رقبہ چوراسی نکلتا ہے۔ کیا آپ معین کا قاعدہ اسے کاٹ کر دکھا سکتے ہیں؟
  entity: concept/ilm-al-misaha
  sources:
  - source/khwarizmi-jabr-cairo-1939
- position: after
  kind: invention
  title:
    en: Adding up the surfaces of a ceiling
    ar: جمع أسطح سقف
    ur: سقف کی سطحوں کا جمع
  text:
    ar: نظم الكاشي في مفتاح الحساب قياس سطح المقرنص، وهو البناء الخلوي المتدرج الذي يربط أجزاء السقف ويزينها. يختار وحدة معيارية، ويعد الأجزاء بحسب أشكالها، ويجمع مساحات الوجوه والسقوف والعناصر الواصلة. وتنبه البطاقة إلى أنها طريقة حساب في عمارة موجودة قبله. كيف يعينك جمع مساحات الوجوه على إيجاد مساحة سطح منشور؟
    en: In the Key to Arithmetic, al-Kashi organised the measurement of the surface of muqarnas, the tiered cellular construction that articulates and decorates ceilings. He selects a module, counts the elements by shape, and adds the surfaces of facets, roofs and connecting pieces. The record stresses that this is a calculation method within older building practice. How could adding the areas of faces help you find the surface area of a prism?
    ur: کاشی نے مفتاح الحساب میں مقرنس کی سطح کا حساب منظم کیا، وہ تہہ دار خانے جو سقف کو جوڑتے اور سجاتے ہیں۔ پہلے معیاری اکائی منتخب، پھر شکل کے مطابق اجزا شمار، پھر رخوں، چھتوں اور ملانے والے ٹکڑوں کے رقبے جمع ہوتے ہیں۔ اندراج کہتا ہے کہ یہ پرانی معماری کے اندر حسابی طریقہ ہے۔ رخوں کے رقبے جمع کرنے سے منشور کی سطح کا رقبہ نکالنے میں کیا مدد ملتی ہے؟
  entity: invention/kashi-muqarnas-mensuration
