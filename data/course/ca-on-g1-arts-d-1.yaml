  title:
    en: Stars, polygons and grids
    ar: نجوم ومضلعات وشبكات
    ur: ستارے، کثیر الاضلاع اور جالیاں
  text:
    en: The record describes repeating geometric patterns of stars, polygons and grids that cover the surfaces of Islamic architecture and art, from al-Andalus to Central Asia. Look for the shapes that come back again and again. Which lines and shapes would you repeat to cover a page with a pattern of your own?
    ar: يصف السجل أنماطًا هندسية متكررة من نجوم ومضلعات وشبكات تغطي أسطح العمارة والفن الإسلامي من الأندلس إلى آسيا الوسطى. ابحث عن الأشكال التي تعود مرة بعد مرة. أي الخطوط والأشكال ستكرر لتغطية ورقة بنمط من تصميمك؟
    ur: ریکارڈ ستاروں، کثیر الاضلاع اور جالیوں کے دہرائے جانے والے ہندسی نقوش بیان کرتا ہے جو اندلس سے وسطی ایشیا تک اسلامی تعمیرات اور فن کی سطحوں پر چھائے ہوئے ہیں۔ وہ شکلیں تلاش کریں جو بار بار لوٹتی ہیں۔ اپنے نقش سے ایک صفحہ بھرنے کے لیے آپ کون سی لکیریں اور شکلیں دہرائیں گے؟
  entity: concept/islamic-geometric-patterns
