  title:
    en: Plant lines that interlace
    ar: خطوط نباتية متشابكة
    ur: نباتاتی لکیریں جو گتھی ہوئی ہیں
  text:
    en: The record describes the arabesque as intertwined plant ornament, a hallmark of Islamic art, flowing across plaster, stone, wood, manuscripts, mosques and palaces. Which curving lines would you use to fill a flat page?
    ar: يصف السجل الأرابيسك بأنه زخرفة نباتية متشابكة صارت علامة الفن الإسلامي، تنساب في الجص والحجر والخشب والمخطوطات والمساجد والقصور. أي الخطوط المنحنية ستستخدم لتملأ صفحة مسطحة؟
    ur: ریکارڈ عربسک کو باہم گتھی ہوئی نباتاتی آرائش بتاتا ہے جو اسلامی فن کی پہچان بنی اور گچ، پتھر، لکڑی، مخطوطات، مساجد اور محلات میں پھیلی ہوئی ہے۔ ایک سپاٹ صفحہ بھرنے کے لیے آپ کون سی خمدار لکیریں استعمال کریں گے؟
