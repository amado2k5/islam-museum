connections:
- position: within
  kind: invention
  title:
    en: Counting letters to read a hidden message
    ar: عدّ الحروف لقراءة رسالة خفية
    ur: پوشیدہ پیغام پڑھنے کے لیے حروف کی گنتی
  text:
    ar: 'قد تتغير أسماء الحروف في رسالة خفية، ويبقى تكرارها مفتاحاً لفهمها. يشرح الكندي طريقة تبدأ بعدّ الحروف في نص من لغة معروفة، وترتيبها بحسب كثرة الاستعمال، ثم مقارنة هذا الترتيب برموز النص المعمى. لكنه لا يجعل العدد حكماً نهائياً: فالرسالة القصيرة قد تخالف العادة، ويحتاج الظن إلى اختبار باقتران الحروف وسياق الكلام. ماذا تعدّ أولاً، وما طول العيّنة التي تريدها؟'
    en: 'Letters in a concealed message may change their names while repetition remains a clue. Al-Kindi describes counting letters in a sample of a known language, ranking them by use and comparing that ranking with the message''s symbols. Numbers are not his final verdict: a short message may depart from ordinary usage, and a guess needs checking against letter combinations and context. What would you count first, and how long a sample would you want?'
    ur: 'پوشیدہ پیغام میں حروف کے نام بدل سکتے ہیں، مگر ان کی تکرار سراغ رہ سکتی ہے۔ کندی معلوم زبان کے نمونے میں حروف گننے، کثرت کے لحاظ سے ترتیب دینے اور معمى کی علامتوں سے مقابلہ کرنے کا طریقہ بیان کرتے ہیں۔ عدد آخری فیصلہ نہیں: مختصر پیغام عام استعمال سے مختلف ہو سکتا ہے اور اندازے کو حروف کے جوڑ اور سیاق سے جانچنا پڑتا ہے۔ آپ پہلے کیا گنیں گے، اور نمونہ کتنا لمبا چاہیں گے؟'
  entity: invention/frequency-analysis-al-kindi
