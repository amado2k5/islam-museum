expectations:
- code: A1
  text:
    en: select and organize information about the classical world from a variety of oral, written, and visual primary and secondary sources
    ar: اختر معلومات عن العالم الكلاسيكي من مصادر أولية وثانوية شفهية ومكتوبة ومرئية متنوعة ونظّمها
    ur: کلاسیکی دنیا کے بارے میں معلومات کو زبانی، تحریری اور بصری بنیادی اور ثانوی ماخذ کی ایک وسیع قسم سے منتخب اور منظم کریں
- code: A2
  text:
    en: interpret and evaluate information to make inferences about the cultural customs and values of the classical world
    ar: فسّر المعلومات وقيّمها لتستنتج منها عادات العالم الكلاسيكي الثقافية وقيمه
    ur: معلومات کی تعبیر اور جانچ کریں تاکہ کلاسیکی دنیا کی ثقافتی رسوم و اقدار کے بارے میں نتائج اخذ کیے جا سکیں
- code: A3
  text:
    en: communicate knowledge and understanding of the classical world using a variety of media
    ar: بلّغ معرفتك وفهمك للعالم الكلاسيكي باستخدام وسائط متنوعة
    ur: مختلف ذرائع ابلاغ کے ذریعے کلاسیکی دنیا کے بارے میں اپنے علم اور فہم کا اظہار کریں
- code: A4
  text:
    en: describe how learning about the classical world relates to and enhances their understanding of other cultures and fields of study, the contemporary world, and their own experience
    ar: صف كيف يرتبط تعلّم العالم الكلاسيكي بفهمك لثقافات أخرى ومجالات دراسة أخرى وللعالم المعاصر ولتجربتك الخاصة، وكيف يعززه
    ur: بیان کریں کہ کلاسیکی دنیا کے بارے میں سیکھنا دیگر ثقافتوں اور مضامین، عصرِ حاضر اور اپنے تجربے کی سمجھ سے کیسے جڑتا اور اسے کیسے بڑھاتا ہے
