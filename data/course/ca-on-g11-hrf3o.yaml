summary:
  en: 'The Ontario Grade 11 course HRF3O has six strands: research skills, commonalities and concepts, community, actions, sacred stories and writings, and dimensions of the sacred. The museum maps strands B to F, and only what its records say about Islam; strand A (research skills) is not mapped.'
  ar: 'لمقرر HRF3O للصف الحادي عشر في أونتاريو ستة محاور: مهارات البحث، والقواسم المشتركة والمفاهيم، والجماعة، والأفعال، والقصص والكتابات المقدسة، وأبعاد المقدس. ويربط المتحف المحاور من ب إلى و، وبما تقوله سجلاته عن الإسلام وحده؛ أما المحور أ ⁦(مهارات البحث)⁩ فلا يُربط.'
  ur: 'اونٹاریو کے گیارہویں جماعت کے کورس HRF3O کے چھ محور ہیں: تحقیقی مہارتیں، مشترک پہلو اور تصورات، جماعت، اعمال، مقدس کہانیاں اور تحریریں، اور تقدس کے پہلو۔ عجائب گھر محور B سے F تک کو جوڑتا ہے، اور صرف وہ جو اس کے ریکارڈ اسلام کے بارے میں کہتے ہیں؛ محور A (تحقیقی مہارتیں) نہیں جوڑا جاتا۔'
