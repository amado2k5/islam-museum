label:
  en: 'Grade 11 HRF3O: World Religions and Belief Traditions in Daily Life'
  ar: 'الصف الحادي عشر HRF3O: أديان العالم والمعتقدات في الحياة اليومية'
  ur: 'جماعت یازدہم HRF3O: دنیا کے مذاہب اور اعتقادی روایات روزمرہ زندگی میں'
  es: "Grado 11 HRF3O: Religiones del mundo y tradiciones de creencias en la vida cotidiana"
  fr: "11e année HRF3O: Religions du monde et traditions de croyance dans la vie quotidienne"
  tr: "11. Sınıf HRF3O: Dünya Dinleri ve İnançlar Günlük Yaşamda"
  id: "Kelas 11 HRF3O: Agama-agama Dunia dan Kepercayaan dalam Kehidupan Sehari-hari"
summary:
  en: 'The Ontario Grade 11 course HRF3O has six strands: research skills, commonalities and concepts, community, actions, sacred stories and writings, and dimensions of the sacred. The museum maps strands B to F, and only what its records say about Islam; strand A (research skills) is not mapped.'
  ar: 'لمقرر HRF3O للصف الحادي عشر في أونتاريو ستة محاور: مهارات البحث، والقواسم المشتركة والمفاهيم، والجماعة، والأفعال، والقصص والكتابات المقدسة، وأبعاد المقدس. ويربط المتحف المحاور من ب إلى و، وبما تقوله سجلاته عن الإسلام وحده؛ أما المحور أ ⁦(مهارات البحث)⁩ فلا يُربط.'
  ur: 'اونٹاریو کے گیارہویں جماعت کے کورس HRF3O کے چھ محور ہیں: تحقیقی مہارتیں، مشترک پہلو اور تصورات، جماعت، اعمال، مقدس کہانیاں اور تحریریں، اور تقدس کے پہلو۔ عجائب گھر محور B سے F تک کو جوڑتا ہے، اور صرف وہ جو اس کے ریکارڈ اسلام کے بارے میں کہتے ہیں؛ محور A ⁦(تحقیقی مہارتیں)⁩ نہیں جوڑا جاتا۔'
  es: "El curso HRF3O de 11.º grado de Ontario consta de seis ejes temáticos: habilidades de investigación, puntos en común y conceptos, comunidad, acciones, relatos y escritos sagrados, y dimensiones de lo sagrado. El museo incluye los ejes B a F en su mapa, y solo la información que sus registros contienen sobre el islam; el eje A (habilidades de investigación) no está incluido."
  fr: "Le cours HRF3O de 11e année en Ontario comporte six volets: compétences en recherche, points communs et concepts, communauté, actions, récits et écrits sacrés, et dimensions du sacré. Le musée cartographie les volets B à F, et uniquement ce que ses archives disent de l’islam; le volet A (compétences en recherche) n’est pas cartographié."
  tr: "Ontario'da on birinci sınıf için HRF3O müfredatı altı modülden oluşmaktadır: araştırma becerileri, ortak noktalar ve kavramlar, topluluk, eylemler, kutsal öyküler ve yazılar ve kutsalın boyutları. Müze, B'den F'ye kadar olan modülleri birbirine bağlar ve yalnızca kayıtlarında İslam hakkında belirtilenleri bağlar; A modülü (araştırma becerileri) bağlantılı değildir."
  id: "Kurikulum HRF3O untuk kelas sebelas di Ontario memiliki enam modul: keterampilan penelitian, kesamaan dan konsep, komunitas, tindakan, kisah dan tulisan suci, dan dimensi kesucian. Museum ini menghubungkan modul B hingga F, dan hanya modul yang tercatat dalam arsipnya yang berkaitan dengan Islam; modul A (keterampilan penelitian) tidak terhubung."
