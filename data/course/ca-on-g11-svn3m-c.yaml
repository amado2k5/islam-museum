- code: C2
  text:
    en: investigate environmental factors that can affect human health, and analyse related data
    ar: استقصِ العوامل البيئية التي قد تؤثر في صحة الإنسان، وحلّل البيانات المتعلقة بها
    ur: ان ماحولیاتی عوامل کی چھان بین کریں جو انسانی صحت پر اثر ڈال سکتے ہیں، اور متعلقہ اعداد و شمار کا تجزیہ کریں
- code: C3
  text:
    en: demonstrate an understanding of various environmental factors that can affect human health, and explain how the impact of these factors can be reduced
    ar: أظهر فهمًا لمختلف العوامل البيئية التي قد تؤثر في صحة الإنسان، واشرح كيف يمكن تقليل أثر هذه العوامل
    ur: انسانی صحت پر اثر ڈالنے والے مختلف ماحولیاتی عوامل کی فہم ظاہر کریں، اور وضاحت کریں کہ ان عوامل کا اثر کیسے کم کیا جا سکتا ہے
