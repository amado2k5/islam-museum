expectations:
- code: C1
  text:
    en: analyse initiatives, both governmental and non-governmental, that are intended to reduce the impact of environmental factors on human health
    ar: حلّل المبادرات، الحكومية وغير الحكومية، الرامية إلى تقليل أثر العوامل البيئية في صحة الإنسان
