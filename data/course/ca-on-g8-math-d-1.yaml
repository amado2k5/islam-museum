  text:
    en: 'Al-Kindi describes counting the letters in a sample of a known language, ranking them by use, and comparing that ranking with the symbols of a concealed message. The record stresses that numbers are not his final verdict: a short message may depart from ordinary usage, and a guess needs checking against letter combinations and context. What would make a count of letters too small to trust?'
    ar: 'يشرح الكندي طريقة تبدأ بعدّ الحروف في نص من لغة معروفة، وترتيبها بحسب كثرة الاستعمال، ثم مقارنة هذا الترتيب برموز النص المعمى. ويقول السجل إنه لا يجعل العدد حكماً نهائياً: فالرسالة القصيرة قد تخالف العادة، ويحتاج الظن إلى اختبار باقتران الحروف وسياق الكلام. ما الذي يجعل عدّ الحروف قليلاً لا يوثق به؟'
    ur: 'الکندی ایک ایسا طریقہ بیان کرتا ہے جس میں کسی معلوم زبان کے نمونے میں حروف گنے جاتے ہیں، استعمال کی کثرت کے لحاظ سے انہیں ترتیب دیا جاتا ہے، پھر اس ترتیب کا مخفی پیغام کی علامتوں سے موازنہ کیا جاتا ہے۔ ریکارڈ زور دیتا ہے کہ گنتی اس کا آخری فیصلہ نہیں: چھوٹا پیغام عام استعمال سے ہٹ سکتا ہے، اور اندازے کو حروف کے میل اور عبارت کے سیاق سے پرکھنا پڑتا ہے۔ حروف کی گنتی کو کس بات سے اتنا کم سمجھا جائے کہ اس پر بھروسا نہ ہو؟'
