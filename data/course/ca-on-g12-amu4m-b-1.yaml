  title:
    en: Singing at the shrines of the saints
    ar: الغناء في أضرحة الأولياء
    ur: اولیا کے مزاروں پر گانا
  text:
    en: Abida Parveen was born in 1954 and raised in Larkana, Sindh, in a Sindhi Sufi family. She trained with her father, Ustad Ghulam Haider, who ran a music school; she sang with him at the shrines of Sufi saints, and he chose her over his two sons as his musical heir. She sings ghazal, qawwali and above all kafi, in Urdu, Sindhi, Punjabi, Arabic and Persian. What is music doing at a shrine?
    ar: وُلدت عابدة پروين سنة 1954 ونشأت في بلاڑکانہ في السند لأسرة سندية صوفية. تعلّمت على أبيها الأستاذ غلام حيدر، الذي كانت له مدرسة موسيقية، وكانت ترافقه في الغناء بأضرحة الأولياء، واختارها وريثة لفنه دون أخويها. وتغني الغزل والقوالي والكافي، وهو تخصصها، بالأردية والسندية والبنجابية والعربية والفارسية. ماذا تفعل الموسيقى عند الضريح؟
    ur: عابدہ پروین 1954 میں پیدا ہوئیں اور لاڑکانہ، سندھ میں ایک سندھی صوفی خاندان میں پلی بڑھیں۔ انہوں نے اپنے والد استاد غلام حیدر سے سیکھا، جن کا ایک موسیقی کا مدرسہ تھا؛ وہ ان کے ساتھ صوفی بزرگوں کے مزاروں پر گاتی تھیں، اور انہوں نے اپنے دو بیٹوں کے بجائے انہیں اپنے فن کا وارث چنا۔ وہ غزل، قوالی اور سب سے بڑھ کر کافی گاتی ہیں، اردو، سندھی، پنجابی، عربی اور فارسی میں۔ مزار پر موسیقی کیا کام کر رہی ہے؟
