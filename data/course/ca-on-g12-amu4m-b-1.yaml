  title:
    en: Qawwali meets ambient music
    ar: القوالي تلتقي بالموسيقى المحيطية
    ur: قوالی کی ملاقات ایمبینٹ موسیقی سے
  text:
    en: Night Song is a joint album of the Pakistani singer Nusrat Fateh Ali Khan and the Canadian musician Michael Brook, recorded in 1995 and released on 20 February 1996. It joins qawwali vocals to Brook's electronic ambient music; the two wrote the songs together, and musicians from Baaba Maal's Senegalese band took part. Which traditions meet on this record?
    ar: «Night Song» ألبوم مشترك للمغني الباكستاني نصرت فتح علي خان والموسيقي الكندي مايكل بروك، سُجّل سنة 1995 وصدر في 20 فبراير 1996. يجمع الألبوم صوت القوالي بموسيقى بروك المحيطية الإلكترونية، وكتب الاثنان أغانيه معًا، وشارك فيه موسيقيون من فرقة بابا مال السنغالية. أي تقاليد تلتقي في هذا الألبوم؟
    ur: «Night Song» پاکستانی گلوکار نصرت فتح علی خان اور کینیڈین موسیقار مائیکل بروک کا مشترکہ البم ہے، جو 1995 میں ریکارڈ ہوا اور 20 فروری 1996 کو جاری ہوا۔ یہ قوالی کی آواز کو بروک کی الیکٹرانک ایمبینٹ موسیقی سے جوڑتا ہے؛ دونوں نے گیت مل کر لکھے، اور بابا مال کے سینیگالی بینڈ کے موسیقار اس میں شریک ہوئے۔ اس البم میں کون سی روایتیں مل رہی ہیں؟
