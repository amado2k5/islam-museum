  title:
    en: The singing women of early Abbasid society
    ar: مغنيات المجتمع العباسي الأول
    ur: ابتدائی عباسی معاشرے کی گانے والی عورتیں
  text:
    en: In Duha al-Islam, Ahmad Amin describes the qiyan as singing slave women, a social institution of the early Abbasid period. Their masters and the teachers of singing trained them in melodies and voices, and Ibrahim al-Mawsili taught his own slave women the art. Some belonged to the caliph, the princes and the wealthy. The Kitab al-Aghani is full of their biographies. Where was this music heard, and who made it?
    ar: يصف أحمد أمين في «ضحى الإسلام» القيان بأنهن جوارٍ مغنيات كنّ مؤسسة اجتماعية في العصر العباسي الأول. كان أسيادهن وأساتذة الغناء يدرّبونهن على الألحان والأصوات، وكان إبراهيم الموصلي يعلّم جواريه الفن. وكان منهن قيان للخليفة والأمراء والأغنياء. وقد امتلأ كتاب «الأغاني» بتراجمهن. أين كانت تُسمع هذه الموسيقى، ومن كان يصنعها؟
    ur: احمد امین «ضحی الاسلام» میں قیان کو گانے والی کنیزیں بتاتے ہیں، جو ابتدائی عباسی دور کا ایک سماجی ادارہ تھیں۔ ان کے آقا اور گانے کے استاد انہیں راگوں اور آوازوں کی تربیت دیتے تھے، اور ابراہیم موصلی اپنی کنیزوں کو یہ فن سکھاتے تھے۔ کچھ خلیفہ، شہزادوں اور دولت مندوں کی ملکیت تھیں۔ «کتاب الاغانی» ان کی سوانح سے بھری ہے۔ یہ موسیقی کہاں سنی جاتی تھی، اور اسے کون بناتا تھا؟
