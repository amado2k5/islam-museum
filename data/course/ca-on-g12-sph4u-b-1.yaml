  title:
    en: A pin in a slot, again
    ar: مسمار في شق مرة أخرى
    ur: شگاف میں کیل، ایک بار پھر
  text:
    en: Chapter V.4 of al-Jazari's book describes a water lifter turned by an animal. Gears carry the rotation to a pin that moves inside a slot in the ladle stem, raising and lowering the scoop. The record makes no claim that he was the first, and says a folio at the Metropolitan Museum is a later copy, not a surviving machine. How is this pin and slot like the pin and slot of the pump?
    ar: يصف الباب الخامس، الفصل الرابع، من كتاب الجزري رافعة ماء يديرها حيوان. تنقل التروس الدوران إلى مسمار يتحرك داخل شق في ساق المغرفة فيرفعها ويخفضها. ولا يدّعي السجل له أسبقية، ويقول إن ورقة المتروبوليتان نسخة متأخرة لا آلة باقية. بماذا يشبه هذا المسمار وهذا الشق مسمار المضخة وشقها؟
    ur: جزری کی کتاب کا باب پنجم، فصل چہارم، ایک ایسے آبکش کو بیان کرتا ہے جسے جانور گھماتا ہے۔ دندانے دار پہیے گردش کو ایک کیل تک پہنچاتے ہیں جو مغرفے کے دستے کے شگاف میں چلتی ہے اور مغرفے کو اٹھاتی اور گراتی ہے۔ ریکارڈ اس کے اولین ہونے کا دعویٰ نہیں کرتا، اور کہتا ہے کہ میٹروپولیٹن میوزیم کا ورق بعد کی نقل ہے، باقی رہنے والی مشین نہیں۔ یہ کیل اور شگاف پمپ کی کیل اور شگاف سے کیسے ملتے جلتے ہیں؟
