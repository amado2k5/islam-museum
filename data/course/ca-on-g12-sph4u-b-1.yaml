  kind: invention
  title:
    en: A pump driven by a stream
    ar: مضخة يديرها تيار
    ur: بہتے پانی سے چلنے والا پمپ
  text:
    en: Al-Jazari described a pump powered by flowing water. According to the TDV encyclopedia, a stream drives a wheel and gears, and a pin with a slotted rod converts the rotation into back-and-forth motion in the arms of two pistons. The record stresses that the contribution is this arrangement, not the invention of water lifting, and that the Science Museum's model is a reconstruction. Where does the motion change its kind?
    ar: وصف الجزري مضخة يحرّكها الماء الجاري. وبحسب موسوعة TDV يدير التيار دولابًا وتروسًا، وينقل مسمار وقضيب مشقوق الدوران إلى حركة ذراعي مكبسين ذهابًا وإيابًا. ويؤكد السجل أن الإسهام هو هذا الترتيب لا اختراع رفع الماء، وأن نموذج متحف العلوم إعادة بناء. أين تتغير نوعية الحركة؟
    ur: جزری نے بہتے پانی سے چلنے والا پمپ بیان کیا۔ ٹی ڈی وی انسائیکلوپیڈیا کے مطابق ایک دھارا پہیے اور دندانوں والے پہیوں کو چلاتا ہے، اور ایک کیل اور شگاف دار ڈنڈا گردش کو دو پسٹنوں کے بازوؤں کی آگے پیچھے حرکت میں بدل دیتے ہیں۔ ریکارڈ زور دیتا ہے کہ خدمت یہی ترتیب ہے، نہ کہ پانی اٹھانے کی ایجاد، اور یہ کہ سائنس میوزیم کا نمونہ دوبارہ تعمیر ہے۔ حرکت کی نوعیت کہاں بدلتی ہے؟
  entity: invention/jazari-double-piston-pump
