  title:
    en: The head of a still
    ar: رأس جهاز التقطير
    ur: کشید کے آلے کا سر
  text:
    en: 'The anbik, from the Greek word for a head or cap, is the part of the distilling apparatus also called the head or cap. It appears as early as the tenth century in a translation of Dioscorides and in al-Razi, and writers often describe it as one of the apparatus used for distilling rose-water. The complete apparatus had three parts: the cucurbit, the cap or head, and the receiver. Which mixture would you separate with it?'
    ar: 'الأنبيق اسم يوناني الأصل لرأس جهاز التقطير، ويُسمى أيضاً الرأس أو القلنسوة. وقد ورد في القرن العاشر في ترجمة لديوسقوريدس وعند الرازي، وكثيراً ما وُصف بأنه أحد أجهزة تقطير ماء الورد. ويتكون جهاز التقطير الكامل من ثلاثة أجزاء: القرعة، والرأس أو القلنسوة، والمستقبِل. فأي مخلوط ستفصله به؟'
    ur: 'انبیق یونانی لفظ سے ہے اور تقطیر کے آلے کا وہ حصہ ہے جسے سر یا ٹوپی بھی کہتے ہیں۔ یہ دسویں صدی میں دیوسقوریدس کے ترجمے اور رازی کے ہاں ملتا ہے، اور اکثر اسے گلاب کا عرق کشید کرنے والے آلات میں شمار کیا گیا۔ مکمل تقطیری آلے کے تین حصے تھے: قرعہ، سر یا ٹوپی یعنی انبیق، اور وصول کنندہ۔ آپ اس سے کون سا آمیزہ الگ کریں گے؟'
  entity: concept/anbik
