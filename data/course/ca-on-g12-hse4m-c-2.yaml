  title:
    en: Umar ibn Abd al-Aziz
    ar: عمر بن عبد العزيز
    ur: عمر بن عبد العزیز
  text:
    en: Umar ibn Abd al-Aziz was an Umayyad caliph. Al-Sallabi writes that he began the return of unjustly taken property with himself and then with the Umayyads, and that he wrote to his governor of Egypt to lift the jizya from those who became Muslim. Al-Sallabi also reports that the scholars counted him among the Rightly Guided Caliphs. Which of his circumstances and qualities does this account point to?
    ar: عمر بن عبد العزيز خليفة أموي. ويذكر الصلابي أنه بدأ بنفسه في رد المظالم ثم ببني أمية، وأنه كتب إلى عامله على مصر أن يضع الجزية عمن أسلم. وينقل الصلابي أن أهل العلم عدّوه من الخلفاء الراشدين. فإلى أي من ظروفه وصفاته يشير هذا الخبر؟
    ur: عمر بن عبد العزیز ایک اموی خلیفہ تھے۔ الصلابی لکھتے ہیں کہ انہوں نے مظالم کی واپسی کی ابتدا اپنے آپ سے کی پھر بنو امیہ سے، اور مصر میں اپنے عامل کو لکھا کہ جو مسلمان ہو جائے اس سے جزیہ اٹھا دے۔ الصلابی یہ بھی نقل کرتے ہیں کہ اہلِ علم نے انہیں خلفائے راشدین میں شمار کیا۔ یہ بیان ان کے کن حالات اور خوبیوں کی طرف اشارہ کرتا ہے؟
