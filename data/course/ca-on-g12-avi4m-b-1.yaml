  title:
    en: Another great mosque, from the same author
    ar: جامع كبير آخر، من المؤلف نفسه
    ur: ایک اور عظیم مسجد، اسی مصنف کے قلم سے
  text:
    en: 'Ibn Fadl Allah al-Umari describes the Great Mosque of Cordoba as half roofed and half courtyard. Its roofed part has nineteen arches, and among its pillars there are a thousand, small and large. The ceiling panels are of Tartushi pine. Set this account beside his account of the Dome of the Rock: which shapes and materials does each make you picture?'
    ar: 'يذكر ابن فضل الله العمري أن جامع قرطبة نصفه مسقف ونصفه صحن. في مسقفه تسعة عشر قوسًا، ومن سواريه ألف سارية صغارًا وكبارًا، وسماوات سقفه من صنوبر طرطوشي. ضع هذا الوصف إلى جانب وصفه لقبة الصخرة: أي الأشكال والمواد يستحضرها كل منهما في ذهنك؟'
    ur: 'ابن فضل اللہ العمری بیان کرتے ہیں کہ جامع قرطبہ آدھی چھت دار اور آدھی صحن ہے۔ اس کے چھت دار حصے میں انیس محرابیں ہیں، اور اس کے ستونوں میں چھوٹے بڑے ملا کر ایک ہزار ہیں، اور چھت کے تختے طرطوشی صنوبر کے ہیں۔ اس بیان کو قبۃ الصخرہ کے ان کے بیان کے ساتھ رکھ کر دیکھیں: ہر ایک آپ کے ذہن میں کون سی شکلیں اور مواد لاتا ہے؟'
