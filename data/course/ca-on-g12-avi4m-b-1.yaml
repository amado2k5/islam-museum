  title:
    en: An octagon under a dome, measured in cubits
    ar: بناء مثمّن تعلوه قبة، مقيس بالأذرع
    ur: گنبد کے نیچے ہشت پہلو عمارت، گزوں میں ناپی ہوئی
  text:
    en: Ibn Fadl Allah al-Umari describes the building as it stood in 743 AH, relying on a short book that set down its measurements in cubits. The octagon rises eighteen cubits above the paved court, and the drum of the dome has sixteen gilded glass windows. Each side is faced with veined white marble below and gilded mosaic above, and the building has four doors. Which of these forms and surfaces would you name first?
    ar: يصف ابن فضل الله العمري البناء على ما استقر عليه إلى سنة 743هـ، معتمدًا على كتاب صغير حرّر قياساته بالذراع. يرتفع البناء المثمن ثمانية عشر ذراعًا من وجه الصحن المبلّط، وفي كرسي القبة ست عشرة طاقة زجاج مذهبة. وكل تثمينة مكسوّة بالرخام الأبيض المشجّر في أسفلها وبالفص المذهب في أعلاها، وللبناء أربعة أبواب. أي هذه الأشكال والأسطح تسمّيه أولًا؟
    ur: ابن فضل اللہ العمری عمارت کو اس صورت میں بیان کرتے ہیں جس پر وہ سنہ 743ھ تک قائم تھی، اور ایک مختصر کتاب پر اعتماد کرتے ہیں جس میں اس کی پیمائشیں گزوں میں درج تھیں۔ ہشت پہلو عمارت پختہ صحن سے اٹھارہ گز اونچی ہے، اور گنبد کے کرسی میں سونے کے پانی چڑھے شیشے کی سولہ کھڑکیاں ہیں۔ ہر پہلو نیچے دھاری دار سفید سنگِ مرمر سے اور اوپر سنہرے فص ⁦(موزیک)⁩ سے ڈھکا ہے، اور عمارت کے چار دروازے ہیں۔ ان میں سے کون سی شکل یا سطح آپ سب سے پہلے بیان کریں گے؟
