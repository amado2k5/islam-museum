connections:
- position: before
  kind: story
  title:
    en: Who ordered it, when, and how it was paid for
    ar: من أمر به، ومتى، وكيف دُفعت نفقته
    ur: کس نے حکم دیا، کب، اور خرچ کیسے پورا ہوا
  text:
    en: The Dome of the Rock was built over the sacred rock in the Haram at Jerusalem by order of Abd al-Malik ibn Marwan. The book the record cites gives its building as begun in 66 AH (685 CE) and finished in 72 AH (691 CE), and relates that its cost was drawn from Egypt's kharaj for seven years. How might knowing who ordered a work, and how it was paid for, change what you see in it?
    ar: بُنيت قبة الصخرة فوق الصخرة المقدسة في الحرم ببيت المقدس بأمر عبد الملك بن مروان. ويذكر الكتاب الذي يستند إليه السجل أنه شُرع فيها سنة 66هـ ⁦(685م)⁩ وفُرغ منها سنة 72هـ ⁦(691م)⁩، وينقل أن نفقتها أُخذت من خراج مصر سبع سنين. كيف يغيّر علمك بمن أمر بعمل ما وبكيفية دفع نفقته ما تراه فيه؟
    ur: قبۃ الصخرہ کو بیت المقدس کے حرم میں مقدس چٹان کے اوپر عبد الملک بن مروان کے حکم سے بنایا گیا۔ جس کتاب کا ریکارڈ حوالہ دیتا ہے وہ بتاتی ہے کہ اس کا آغاز سنہ 66ھ ⁦(685ء)⁩ میں ہوا اور تکمیل سنہ 72ھ ⁦(691ء)⁩ میں، اور یہ بھی کہ اس کا خرچ سات سال تک مصر کے خراج سے لیا گیا۔ کسی فن پارے کو حکم دینے والے اور اس کے خرچ کے ذریعے کا علم آپ کے اس میں دیکھنے کو کیسے بدل سکتا ہے؟
  entity: event/dome-of-the-rock-construction
