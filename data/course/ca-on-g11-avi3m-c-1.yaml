  title:
    en: Cutting tile to make letters
    ar: قصّ البلاط لصنع الحروف
    ur: حروف بنانے کے لیے ٹائل کاٹنا
  text:
    en: 'Zellij is the ceramic mosaic used to pave and wainscot floors and walls in Morocco. Rexford Newcomb describes true mosaic whose pieces are cut and laid like marble or glass tesserae. Inscriptions are made from whole glazed tiles, usually black: the surface round the letters is cut through the glaze to the terracotta with chisels, leaving black letters on a terracotta ground. Which effect comes from cutting away, not adding?'
    ar: الزليج فسيفساء خزفية تُكسى بها الأرضيات والجدران في المغرب الأقصى. ويصف ركسفورد نيوكومب فسيفساء حقيقية تُقص قطعها وتُرصف كما ترصف قطع الرخام أو الزجاج. وتُصنع الكتابات من بلاطات مزججة كاملة، سوداء في الغالب، يُنقر ما حول الحروف بالأزاميل حتى يظهر الفخار، فيبدو الخط أسود على أرضية فخارية. أي تأثير هنا جاء من الحذف لا من الإضافة؟
    ur: 'زلیج وہ سرامک موزائیک ہے جو مراکش میں فرشوں اور دیواروں پر لگایا جاتا ہے۔ ریکسفورڈ نیوکومب ایسا حقیقی موزائیک بیان کرتے ہیں جس کے ٹکڑے کاٹ کر اس طرح جڑے جاتے ہیں جیسے سنگ مرمر یا شیشے کے ٹکڑے۔ کتبے پورے شیشہ دار ٹائلوں سے بنتے ہیں، زیادہ تر سیاہ: حروف کے گرد کی سطح کو چھینی سے شیشے کی تہہ کے آر پار ٹیراکوٹا تک کاٹا جاتا ہے، اور ٹیراکوٹا کی زمین پر سیاہ حروف رہ جاتے ہیں۔ کون سا اثر یہاں جوڑنے سے نہیں بلکہ کاٹنے سے آیا؟'
