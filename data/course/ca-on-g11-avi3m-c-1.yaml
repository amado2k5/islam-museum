  title:
    en: Leaves that lose their stems
    ar: أوراق تفقد سيقانها
    ur: پتے جو اپنے تنے کھو دیتے ہیں
  text:
    en: Richard Yeomans sees the birth of the Islamic arabesque in Samarra style B, where leaves and palmettes become abstract, lose their stems and are organised into the surface geometry of polygons and polylobes. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface. Which of your design terms describes what the leaves have become?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز سامراء الثاني ⁦(ب)⁩، حيث تتجرد الأوراق والمراوح النخيلية وتفقد سيقانها وتنتظم في هندسة السطح من مضلعات ومتعددات الفصوص. ويرى أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح. أي مصطلح من مصطلحات التصميم عندك يصف ما صارت إليه الأوراق؟
    ur: رچرڈ یومانز اسلامی عربیسک کی پیدائش سامرا کے دوسرے انداز ب میں دیکھتے ہیں، جہاں پتے اور کھجوری پنکھے تجریدی ہو جاتے ہیں، اپنے تنے کھو دیتے ہیں اور کثیرالاضلاع اور کثیر الپہلو شکلوں کی سطحی ہندسہ میں منظم ہو جاتے ہیں۔ ان کے نزدیک نباتی عربیسک مخصوص ڈھانچے میں ڈھلا ہوا اور دو بُعدی ہے، اور سطح کا احترام کرتا ہے۔ آپ کی ڈیزائن کی کون سی اصطلاح بتاتی ہے کہ پتے کیا بن گئے ہیں؟
