  title:
    en: Stars and polygons from interlacing lines
    ar: نجوم ومضلعات من خطوط متشابكة
    ur: باہم گندھی لکیروں سے ستارے اور کثیرالاضلاع
  text:
    en: 'Girih is Islamic geometric strapwork: interlacing lines that build stars and polygons. The record says the patterns were common in Safavid and Seljuk architecture and rest on girih tiles. Look at a girih design: which lines and shapes do you see, and which words from your own design vocabulary would you use to name them?'
    ar: 'الجيره عقد هندسية إسلامية تبني نجومًا ومضلعات بخطوط متشابكة؛ وقد شاعت في العمارة الصفوية والسلجوقية وتقوم على بلاطات جيره. انظر إلى نمط من الجيره: أي خطوط وأشكال تراها، وبأي كلمات من مفردات التصميم عندك تسمّيها؟'
    ur: 'گرہ اسلامی ہندسی بندش ہے: باہم گندھی لکیریں جو ستارے اور کثیرالاضلاع بناتی ہیں۔ اندراج کہتا ہے کہ یہ نقش صفوی اور سلجوقی فنِ تعمیر میں عام تھے اور گرہ ٹائلوں پر قائم ہیں۔ گرہ کا کوئی نمونہ دیکھیں: آپ کو کون سی لکیریں اور شکلیں نظر آتی ہیں، اور آپ انہیں اپنی ڈیزائن کی کن اصطلاحات سے نام دیں گے؟'
