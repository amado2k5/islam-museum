  title:
    en: A green mark on turbans
    ar: علامة خضراء على العمائم
    ur: عماموں پر سبز نشان
  text:
    en: Al-Suyuti, in History of the Caliphs, reports that in 773 AH the green sign was introduced on the turbans of the Sharifs so that they would be distinguished, by order of the sultan, and that this was the first thing of its kind introduced. He gives verses by Abu Abd Allah ibn Jabir the blind grammarian saying that the sign is for one who is not well known. Whom does a mark on cloth serve?
    ar: يذكر السيوطي في «تاريخ الخلفاء» أنه في سنة 773هـ أُحدثت العلامة الخضراء على عمائم الشرفاء ليتميزوا بها، بأمر السلطان، وأن هذا أول ما أُحدث من ذلك. ويورد أبياتًا لأبي عبد الله بن جابر الأعمى النحوي يقول فيها إن العلامة شأن من لم يشتهر. فمن تخدم العلامة على الثوب؟
    ur: السیوطی «تاریخ الخلفاء» میں لکھتے ہیں کہ ۷۷۳ھ میں سلطان کے حکم سے شرفا کی عماموں پر سبز نشان رائج کیا گیا تاکہ وہ پہچانے جائیں، اور یہ اپنی نوعیت کی پہلی چیز تھی۔ وہ ابو عبداللہ ابن جابر نابینا نحوی کے اشعار بھی نقل کرتے ہیں جن میں وہ کہتے ہیں کہ نشان اس کے لیے ہوتا ہے جو مشہور نہ ہو۔ کپڑے پر لگا نشان کس کے کام آتا ہے؟
