  text:
    en: Yeomans describes the undersides of the arches of the Mosque of Ibn Tulun, where a vine leaf and other plant forms fill networks of interlacing circles, triangles and squares. Choose three of these shapes and make a pattern of your own from them, with objects or with a drawing.
    ar: يصف يومانز بطون عقود جامع ابن طولون، حيث تملأ ورقة العنب وأشكال نباتية أخرى شبكات من الدوائر المتشابكة والمثلثات والمربعات. اختر ثلاثة من هذه الأشكال وابنِ منها نمطك الخاص، بالأشياء أو بالرسم.
    ur: یومنز جامع ابن طولون کی محرابوں کے اندرونی رخ کا ذکر کرتے ہیں، جہاں انگور کا پتا اور دیگر نباتاتی شکلیں باہم گتھے دائروں، مثلثوں اور مربعوں کے جال کو بھرتی ہیں۔ ان میں سے تین شکلیں چنیں اور ان سے اشیا یا خاکے کے ذریعے اپنا نمونہ بنائیں۔
