  title:
    ar: الصك والحوالة
    en: The sakk and the hawala
    ur: الصک اور الحوالہ
  text:
    ar: يعرض حسن إبراهيم حسن في «تاريخ الإسلام» الصك والحوالة أداتين ماليتين. الصك أشبه بالشيك اليوم، وينقل المؤلف عن الخوارزمي في «مفاتيح العلوم» أنه كان يُجمع فيه أسماء المستحقين وعددهم وما يستحقونه من المال، ثم يوقّع الخليفة أو السلطان أو الأمير في آخره. ومن شواهد اتساع استعمال الحوالة أن الملاحين الذين نقلوا السلطان السلجوقي ملكشاه وجيوشه عبر نهر جيحون تسلموا من وزيره نظام الملك حوالات، يقبضون قيمتها من العامل السلجوقي بإنطاكية. من استفاد من أداة كهذه، وكيف؟
    en: Hasan Ibrahim Hasan presents the sakk and the hawala in Tarikh al-Islam as two financial instruments. The sakk is much like today's cheque; the author cites al-Khwarizmi in Mafatih al-ulum that it gathered the names of those entitled to payment, their number and what each was due, and the caliph, sultan or prince then signed at its foot. As evidence of how widely the hawala was used, the boatmen who ferried the Seljuk sultan Malikshah and his armies across the river Jayhun received bills of exchange from his vizier Nizam al-Mulk, and collected their value from the Seljuk agent in Antioch. Who gained from such an instrument, and how?
    ur: حسن ابراہیم حسن «تاریخ الاسلام» میں الصک اور الحوالہ کو دو مالی آلات کے طور پر پیش کرتے ہیں۔ الصک آج کے چیک جیسا ہے؛ مصنف خوارزمی کی «مفاتیح العلوم» سے نقل کرتے ہیں کہ اس میں مستحقین کے نام، ان کی تعداد، اور ان کے مستحق مال کی مقدار جمع کی جاتی تھی، پھر خلیفہ یا سلطان یا امیر آخر میں دستخط کرتا تھا۔ حوالہ کے وسیع استعمال کی ایک مثال یہ ہے کہ وہ ملاح جنہوں نے سلجوقی سلطان ملک شاہ اور اس کے لشکر کو دریائے جیحون کے پار پہنچایا، انہوں نے اپنے وزیر نظام الملک سے حوالات وصول کیں اور ان کی رقم انطاکیہ میں سلجوقی عامل سے وصول کرتے تھے۔ ایسے آلے سے کس کو، اور کیسے، فائدہ ہوتا؟
