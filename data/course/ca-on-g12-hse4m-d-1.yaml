  title:
    en: An endowment that outlasts its founder
    ar: مال يبقى بعد صاحبه
    ur: وقف جو بانی کے بعد بھی باقی رہتا ہے
  text:
    en: The TDV Encyclopedia of Islam defines waqf as the permanent dedication of property to a religious, social or charitable purpose. The purpose can be a group, such as the poor, students or travellers, or a public building, such as a mosque, college or hospital. The record says a system grew from this formula that funded most of the mosques, colleges and hospitals of Muslim cities from the mid-eighth to the late nineteenth century. How would you judge whether it worked?
    ar: تعرّف موسوعة TDV الوقف بأنه تخصيص مالٍ تخصيصًا دائمًا لغاية دينية أو اجتماعية أو خيرية. والجهة قد تكون جماعة موصوفة كالفقراء والطلاب والمسافرين، وقد تكون منشأة عامة كالمسجد والمدرسة والمستشفى. ويقول السجل إن نظامًا نشأ من هذه الصيغة قامت عليه أكثر مساجد المدن الإسلامية ومدارسها ومستشفياتها من منتصف القرن الثامن إلى أواخر القرن التاسع عشر. فبأي معيار نحكم أنه نجح، ولمن؟
    ur: ترک انسائیکلوپیڈیا TDV وقف کی تعریف یوں کرتا ہے کہ مال کو مستقل طور پر کسی دینی، سماجی یا خیراتی مقصد کے لیے مخصوص کر دینا۔ مقصد ایک بیان کردہ گروہ ہو سکتا ہے، جیسے محتاج، طلبہ یا مسافر، یا کوئی عوامی عمارت، جیسے مسجد، مدرسہ یا ہسپتال۔ ریکارڈ کہتا ہے کہ اس صورت سے ایک نظام بنا جس پر آٹھویں صدی کے وسط سے انیسویں صدی کے آخر تک مسلم شہروں کی اکثر مساجد، مدارس اور ہسپتال قائم رہیں۔ آپ کیسے جانچیں گے کہ وہ کامیاب رہا، اور کس کے لیے؟
