connections:
- position: before
  kind: story
  title:
    en: A cry from Mount Abu Qubays
    ar: نداء من جبل أبي قبيس
    ur: جبلِ ابو قبیس سے ایک فریاد
  text:
    en: It is said that a man from Zabid came to Mecca with merchandise, and al-As ibn Wa'il al-Sahmi bought it and withheld his due. The confederates he appealed to paid him no heed, so he climbed Abu Qubays and called out verses describing his grievance. The men named in the pact then gathered, went to al-As and took the Zabidi's due from him. What made the appeal effective, and for whom?
    ar: يُقال في سبب الحلف إن رجلًا من زبيد قدم مكة ببضاعة فاشتراها منه العاص بن وائل السهمي وحبس عنه حقه، فاستعدى عليه الأحلاف فلم يكترثوا له. فعلا جبل أبي قبيس ونادى بأشعار يصف فيها ظلامته رافعًا صوته. فاجتمع المذكورون في الحلف، وقاموا إلى العاص بن وائل فانتزعوا منه حق الزبيدي. فما الذي جعل النداء فاعلًا، ولمن؟
    ur: کہا جاتا ہے کہ قبیلہ زبید کا ایک آدمی سامان لے کر مکہ آیا، اور عاص بن وائل سہمی نے وہ خرید لیا اور اس کا حق روک لیا۔ اس نے جن حلیفوں سے مدد مانگی انہوں نے اس کی پروا نہ کی، تو وہ جبلِ ابو قبیس پر چڑھا اور اونچی آواز میں اپنی شکایت بیان کرنے والے اشعار پکارے۔ پھر عہد میں مذکور لوگ جمع ہوئے، عاص بن وائل کے پاس گئے اور اس سے زبیدی کا حق چھین لیا۔ فریاد کو مؤثر کس چیز نے بنایا، اور کس کے لیے؟
