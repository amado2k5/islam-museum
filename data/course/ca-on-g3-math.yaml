summary:
  en: 'The Ontario Grade 3 Mathematics course has six strands: Social-Emotional Learning Skills and the Mathematical Processes, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps parts of strands B to E; strand A names skills only and strand F is in the gap register.'
  ar: 'مقرر الرياضيات للصف الثالث في أونتاريو له ستة محاور: مهارات التعلم الاجتماعي العاطفي والعمليات الرياضية، والأعداد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. يربط المتحف أجزاء من المحاور ب إلى هـ؛ أما المحور أ فيسمّي مهارات فقط، والمحور و في سجل الفجوات.'
  ur: 'اونٹاریو کے تیسری جماعت کے ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں اور ریاضیاتی عمل، اعداد، الجبرا، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ عجائب گھر محور ب تا ہ کے کچھ حصے جوڑتا ہے؛ محور الف صرف مہارتوں کا نام لیتا ہے اور محور و فجوات کے اندراج میں ہے۔'
  es: "El curso de Matemáticas de tercer grado de Ontario consta de seis ejes temáticos: Habilidades de Aprendizaje Socioemocional y Procesos Matemáticos, Números, Álgebra, Datos, Percepción Espacial y Alfabetización Financiera. El museo incluye partes de los ejes B a E; el eje A solo menciona las habilidades y el eje F se encuentra en el registro de lagunas."
  fr: "Le programme de mathématiques de 3e année de l'Ontario comporte six volets: compétences socio-émotionnelles et processus mathématiques, nombres, algèbre, données, sens spatial et littératie financière. Le musée présente des éléments des volets B à E; le volet A mentionne uniquement les compétences et le volet F figure dans le registre des lacunes."
  tr: "Ontario'daki 3. sınıf matematik müfredatı altı eksenden oluşmaktadır: sosyal-duygusal öğrenme becerileri, matematiksel işlemler, sayılar, cebir, veri, mekansal farkındalık ve finansal okuryazarlık. Müze, B'den E'ye kadar olan eksenlerin bölümlerini birbirine bağlamaktadır; A ekseni \"sadece beceriler\" olarak etiketlenmiş, F ekseni ise eksiklikler listesinde yer almaktadır."
  id: "Kurikulum matematika kelas 3 di Ontario memiliki enam sumbu: keterampilan pembelajaran sosial-emosional, operasi matematika, angka, aljabar, data, kesadaran spasial, dan literasi keuangan. Museum ini menghubungkan bagian-bagian dari sumbu B hingga E; sumbu A diberi label \"hanya keterampilan,\" dan sumbu F tercantum dalam daftar kesenjangan."
