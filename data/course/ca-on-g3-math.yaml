summary:
  en: 'The Ontario Grade 3 Mathematics course has six strands: Social-Emotional Learning Skills and the Mathematical Processes, Number, Algebra, Data, Spatial Sense and Financial Literacy. The museum maps parts of strands B to E; strand A names skills only and strand F is in the gap register.'
  ar: 'مقرر الرياضيات للصف الثالث في أونتاريو له ستة محاور: مهارات التعلم الاجتماعي العاطفي والعمليات الرياضية، والأعداد، والجبر، والبيانات، والحس المكاني، والثقافة المالية. يربط المتحف أجزاء من المحاور ب إلى هـ؛ أما المحور أ فيسمّي مهارات فقط، والمحور و في سجل الفجوات.'
  ur: 'اونٹاریو کے تیسری جماعت کے ریاضی کورس کے چھ محور ہیں: سماجی و جذباتی سیکھنے کی مہارتیں اور ریاضیاتی عمل، اعداد، الجبرا، اعداد و شمار، مکانی فہم اور مالی خواندگی۔ عجائب گھر محور ب تا ہ کے کچھ حصے جوڑتا ہے؛ محور الف صرف مہارتوں کا نام لیتا ہے اور محور و فجوات کے اندراج میں ہے۔'
