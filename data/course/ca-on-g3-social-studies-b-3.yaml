  title:
    en: Pasture kept for a village
    ar: مرعى محمي لقرية
    ur: ایک بستی کے لیے محفوظ چراگاہ
  text:
    en: In Ibn Hisham's biography, when the people of Jurash embraced Islam, the Prophet reserved for them a hima around their village, marked by known signs, for the horse, the riding camel and the plough-ox. What need does land kept for one purpose meet?
    ar: في سيرة ابن هشام، لما أسلم أهل جرش حمى لهم النبي حمى حول قريتهم على أعلام معلومة، للفرس والراحلة والمثيرة، وهي بقرة الحرث. أي حاجة تلبّيها أرض مخصصة لغرض واحد؟
    ur: جب اہلِ جرش اسلام لائے تو سیرتِ ابن ہشام کے مطابق نبی نے ان کے لیے ان کی بستی کے گرد معلوم نشانیوں کے ساتھ ایک حمیٰ مخصوص کیا، گھوڑے، سواری کی اونٹنی اور ہل چلانے والے بیل کے لیے۔ ایک ہی مقصد کے لیے رکھی گئی زمین کون سی ضرورت پوری کرتی ہے؟
  entity: concept/hima
  sources:
  - source/ibn-hisham-saqqa
- position: after
  kind: story
  title:
    en: Farmland and food
    ar: الأرض الزراعية والقوت
    ur: کھیتی کی زمین اور خوراک
  text:
    en: Al-Maraghi presents agriculture as the oldest livelihood and says Islam urges it as the source of food for people and animals. Which of people's needs does farmland meet?
    ar: يعرض المراغي الزراعة بوصفها أسبق وجوه المعاش، ويرى أن الإسلام حثّ عليها لأنها مصدر قوت الناس والأنعام. أي حاجات الناس تلبّيها الأرض الزراعية؟
    ur: المراغی زراعت کو معاش کا سب سے قدیم ذریعہ بتاتے ہیں اور کہتے ہیں کہ اسلام نے اس پر ابھارا کیونکہ یہ انسانوں اور جانوروں کی خوراک کا ذریعہ ہے۔ کھیتی کی زمین لوگوں کی کون سی ضرورتیں پوری کرتی ہے؟
  entity: concept/agriculture-in-islam
  sources:
