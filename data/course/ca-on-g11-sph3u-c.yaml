expectations:
- code: C1
  text:
    en: analyse and propose improvements to technologies that apply concepts related to dynamics and Newton’s laws, and assess the technologies’ social and environmental impact
    ar: حلّل تقنيات تطبّق مفاهيم تتعلق بالديناميكا وقوانين نيوتن واقترح تحسينات لها، وقيّم أثر هذه التقنيات في المجتمع والبيئة
