- code: C2
  text:
    en: investigate, in qualitative and quantitative terms, net force, acceleration, and mass, and solve related problems
    ar: ابحث، بصورة نوعية وكمية، في القوة المحصلة والتسارع والكتلة، وحُلّ مسائل متصلة بذلك
    ur: خالص قوت، اسراع اور کمیت کی کیفی اور مقداری انداز میں تحقیق کریں، اور متعلقہ مسائل حل کریں
- code: C3
  text:
    en: demonstrate an understanding of the relationship between changes in velocity and unbalanced forces in one dimension
    ar: أظهر فهمًا للعلاقة بين تغيّر السرعة المتجهة والقوى غير المتوازنة في بعد واحد
    ur: ایک جہت میں سمتی رفتار کی تبدیلی اور غیر متوازن قوتوں کے درمیان تعلق کی فہم کا مظاہرہ کریں
