- code: D2
  text:
    en: investigate energy transformations and the law of conservation of energy, and solve related problems
    ar: ابحث في تحولات الطاقة وقانون حفظ الطاقة، وحُلّ مسائل متصلة بذلك
    ur: توانائی کی تبدیلیوں اور قانونِ بقائے توانائی کی تحقیق کریں، اور متعلقہ مسائل حل کریں
- code: D3
  text:
    en: demonstrate an understanding of work, efficiency, power, gravitational potential energy, kinetic energy, nuclear energy, and thermal energy and its transfer (heat)
    ar: أظهر فهمًا للشغل والكفاءة والقدرة وطاقة الوضع الثقالية والطاقة الحركية والطاقة النووية والطاقة الحرارية وانتقالها ⁦(الحرارة)⁩
    ur: کام، کارکردگی، طاقت، تجاذبی مخفی توانائی، حرکی توانائی، نیوکلیائی توانائی، اور حرارتی توانائی اور اس کی منتقلی ⁦(حرارت)⁩ کی فہم کا مظاہرہ کریں
