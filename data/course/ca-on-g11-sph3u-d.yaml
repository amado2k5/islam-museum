expectations:
- code: D1
  text:
    en: analyse technologies that apply principles of and concepts related to energy transformations, and assess the technologies’ social and environmental impact
    ar: حلّل تقنيات تطبّق مبادئ ومفاهيم تتعلق بتحولات الطاقة، وقيّم أثر هذه التقنيات في المجتمع والبيئة
