  title:
    en: The blood's route through the lung
    ar: طريق الدم عبر الرئة
    ur: پھیپھڑے سے خون کا راستہ
  text:
    en: In the thirteenth century the physician Ibn al-Nafis wrote, in his commentary on the anatomy of Ibn Sina's Canon, that blood does not cross from the right ventricle of the heart to the left through pores in the wall between them, as Galen had taught, because that wall is solid; it reaches the left ventricle from the lung. Which organs does the blood visit on this route?
    ar: كتب الطبيب ابن النفيس في القرن السابع الهجري، في شرحه على تشريح قانون ابن سينا، أن الدم لا يعبر من البطين الأيمن إلى البطين الأيسر من مسامّ في الحاجز بينهما كما قال جالينوس، لأن الحاجز هناك مصمت؛ بل يدخل البطين الأيسر من الرئة. أي الأعضاء يمرّ بها الدم في هذا الطريق؟
    ur: تیرھویں صدی عیسوی میں طبیب ابن نفیس نے ابن سینا کے «القانون» کی تشریح پر اپنی شرح میں لکھا کہ خون دل کے دائیں بطن سے بائیں بطن میں ان مساموں سے نہیں گزرتا جو دونوں کے درمیان دیوار میں ہیں، جیسا کہ جالینوس نے سکھایا تھا، کیونکہ وہاں دیوار ٹھوس ہے؛ بلکہ وہ بائیں بطن میں پھیپھڑے سے پہنچتا ہے۔ اس راستے میں خون کن اعضا سے گزرتا ہے؟
