connections:
- position: before
  kind: story
  title:
    en: Honest measure in buying and selling
    ar: الكيل الصحيح في البيع والشراء
    ur: خرید و فروخت میں ٹھیک ناپ تول
  text:
    ar: 'يرى المراغي التجارة من أوسع ميادين النشاط الإنساني. وينقل عن ابن خلدون أنها تستدعي المكايسة والغش والأيمان الكاذبة، فخصّها الإسلام بالترغيب والترهيب: أمر بالتثبت من الكيل والوزن، وببيان العيب، واستحب السماحة في البيع والشراء. ويعرض كذلك صور الشركة، ومنها المضاربة. كيف يحمي الكيل الصحيح البائع والمشتري معاً؟'
    en: 'Al-Maraghi sees commerce as one of the widest fields of human activity. Quoting Ibn Khaldun that trade invites haggling, fraud and false oaths, he shows Islam surrounding it with exhortation and warning: exact measure and weight, disclosure of defects, and commendation of leniency in buying and selling. He also sets out the forms of partnership, among them mudaraba. How does honest measure protect both the buyer and the seller?'
    ur: 'مراغی تجارت کو انسانی سرگرمی کے وسیع ترین میدانوں میں شمار کرتے ہیں۔ ابن خلدون سے نقل کرتے ہیں کہ تجارت سودے بازی، فریب اور جھوٹی قسموں کو جنم دیتی ہے، اسی لیے اسلام نے اسے ترغیب اور ترہیب دونوں سے گھیرا: ناپ تول کی پابندی، عیب کی نمائش اور خرید و فروخت میں نرمی۔ وہ شرکت اور مضاربت کی صورتیں بھی پیش کرتے ہیں۔ درست ناپ تول خریدار اور فروخت کنندہ دونوں کی حفاظت کیسے کرتی ہے؟'
  entity: concept/trade-in-islam
  sources:
  - source/min-qadaya-al-mal-wal-amal-azhar
