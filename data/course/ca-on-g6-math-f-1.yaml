  title:
    en: The sakk and the hawala
    ar: الصك والحوالة
    ur: صک اور حوالہ
  text:
    ar: يذكر حسن إبراهيم حسن في «تاريخ الإسلام» أن الصك أشبه بالشيك اليوم؛ كان يُجمع فيه أسماء المستحقين وما يستحقونه من المال، ثم يوقّع الخليفة أو السلطان أو الأمير في آخره باعتماد دفع هذه الأرزاق. ومن شواهد اتساع استعمال الحوالة أن الملاحين الذين نقلوا السلطان ملكشاه السلجوقي وجيوشه عبر نهر جيحون تسلموا من وزيره حوالات يقبضون قيمتها من العامل السلجوقي بإنطاكية. لماذا قد تكون الورقة أيسر من النقود؟
    en: 'Hasan Ibrahim Hasan writes in his Tarikh al-Islam that the sakk is much like today''s cheque: it gathered the names of those entitled and what each was due, and the caliph, sultan or prince signed at its foot to authorise payment. As evidence of the hawala''s wide use, the boatmen who ferried the Seljuk sultan Malikshah and his armies across the river Jayhun received bills of exchange from his vizier, to be collected from the Seljuk agent in Antioch. Why might a paper be handier than coins?'
    ur: حسن ابراہیم حسن اپنی «تاریخ الاسلام» میں لکھتے ہیں کہ صک آج کے چیک جیسا ہے؛ اس میں مستحقین کے نام اور ان کے مستحق مال کی مقدار جمع کی جاتی تھی، پھر خلیفہ یا سلطان یا امیر آخر میں ان وظائف کی ادائیگی کی منظوری پر دستخط کرتا تھا۔ حوالہ کے وسیع استعمال کی ایک مثال یہ ہے کہ سلجوقی سلطان ملک شاہ اور اس کے لشکر کو دریائے جیحون کے پار پہنچانے والے ملاحوں نے اس کے وزیر سے حوالات وصول کیں، جن کی رقم وہ انطاکیہ میں سلجوقی عامل سے وصول کرتے تھے۔ کاغذ سکوں سے آسان کیوں ہو سکتا ہے؟
  entity: concept/al-sakk-wal-hawala
  sources:
  - source/tarikh-islam-hasan-ibrahim
- position: after
  kind: invention
  title:
    en: Giving the yield and keeping the principal
    ar: تسبيل الغلّة وحبس الأصل
    ur: آمدنی کا عطیہ اور اصل کی حفاظت
  text:
    ar: الوقف تصرّف يحبس فيه المالك أصل ماله عن البيع والهبة والإرث، ويجعل غلّته لوجه من وجوه البر على الدوام. وأشهر ما يُروى في أوله أن عمر بن الخطاب أصاب أرضاً بخيبر، فتصدق بها على ألا تباع ولا توهب ولا تورث. وتقول موسوعة TDV إن أكثر مساجد المدن الإسلامية ومدارسها ومستشفياتها وسُبلها قام عليه من منتصف القرن الثامن إلى أواخر القرن التاسع عشر. إلى من تذهب الغلّة؟
    en: A waqf is an act by which an owner locks the capital of his property away from sale, gift and inheritance, and gives its yield to a good cause for ever. The best-known report of its beginning is that Umar ibn al-Khattab acquired land at Khaybar and gave it on condition that it would not be sold, given away or inherited. The TDV encyclopaedia says it funded most of the mosques, colleges, hospitals and public fountains of Muslim cities from the mid-eighth to the late nineteenth century. Who receives the yield?
    ur: 'وقف ایک ایسا عمل ہے جس کے ذریعے مالک اپنی جائیداد کی اصل کو بیچنے، ہبہ کرنے اور وراثت میں جانے سے روک دیتا ہے، اور اس کی آمدنی ہمیشہ کے لیے کسی نیک مقصد کو دے دیتا ہے۔ سب سے مشہور روایت عمر بن الخطاب کی ہے: انہیں خیبر میں زمین ملی تو انہوں نے اسے اس شرط پر صدقہ کیا کہ وہ نہ بیچی جائے، نہ ہبہ کی جائے اور نہ وراثت میں جائے۔ ٹی ڈی وی کے مطابق اس نظام نے آٹھویں صدی کے وسط سے انیسویں صدی کے اواخر تک مسلم شہروں کی بیشتر مساجد، مدارس، شفاخانوں اور سبیلوں کا خرچ اٹھایا۔ آمدنی کسے ملتی ہے؟'
  entity: invention/waqf
  sources:
  - source/sahih-al-bukhari-bugha
