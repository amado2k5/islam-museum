connections:
- position: within
  kind: place
  title:
    en: A river decides where to camp
    ar: نهر يحدد موضع المعسكر
    ur: دریا نے پڑاؤ کی جگہ طے کی
  text:
    en: In the account of Ibn Abd al-Hakam that this record gives, Amr wanted to settle in Alexandria. Umar asked whether water would come between him and the Muslims. Told yes, when the Nile was in flood, he wrote that he did not wish the Muslims to settle where water would lie between him and them, and Amr moved to al-Fustat. What part of the land shaped that choice?
    ar: 'في رواية ابن عبد الحكم التي يوردها السجل، أراد عمرو أن يسكن الإسكندرية، فسأل عمر: هل يحول بيني وبين المسلمين ماء؟ فقيل له: نعم، إذا جرى النيل. فكتب عمر أنه لا يحب أن ينزل المسلمين منزلاً يحول الماء بينه وبينهم، فتحوّل عمرو إلى الفسطاط. ما الذي في الأرض والنهر صاغ هذا الاختيار؟'
    ur: ابنِ عبدالحکم کی جس روایت کو یہ ریکارڈ بیان کرتا ہے اس کے مطابق عمرو اسکندریہ میں بسنا چاہتے تھے۔ عمر نے پوچھا کہ کیا میرے اور مسلمانوں کے درمیان پانی حائل ہو جائے گا؟ بتایا گیا کہ ہاں، جب نیل چڑھ آئے۔ تب عمر نے لکھا کہ وہ نہیں چاہتے کہ مسلمان ایسی جگہ ٹھہریں جہاں پانی عمر اور مسلمانوں کے درمیان حائل ہو، چنانچہ عمرو فسطاط منتقل ہو گئے۔ زمین کے کس پہلو نے اس انتخاب کو شکل دی؟
