  title:
    ar: الرازي يقارن بين الجدري والحصبة
    en: Al-Razi compares smallpox and measles
    ur: رازی چیچک اور خسرے کا موازنہ کرتے ہیں
  text:
    ar: في رسالة أبي بكر الرازي عن الجدري والحصبة مقارنة بين ما يتشابه وما يختلف في وصف المرضين. يعرض الفصل الثالث أعراضًا مشتركة، ثم يفرّق بين تكرر الغثيان والقلق في الحصبة وبروز ألم الظهر في الجدري، بحسب ملاحظته وتفسير عصره. والرسالة وثيقة في تاريخ الطب، وليست دليلًا لتشخيص مرض أو علاجه اليوم. ماذا تقارن لو درست مرضين؟
    en: Abu Bakr al-Razi's treatise on smallpox and measles compares the resemblance and difference of the two diseases. Its third chapter sets out shared symptoms, then separates the nausea and anxiety that occur more in measles from the back pain that is more characteristic of smallpox, according to his observations and his period's interpretation. It is a document in medical history, not a guide to diagnosis today. What would you compare if you studied two diseases?
    ur: ابوبکر رازی کا چیچک اور خسرے پر رسالہ دونوں بیماریوں کی مشابہت اور فرق کا موازنہ کرتا ہے۔ اس کا تیسرا باب مشترک علامات بیان کرتا ہے، پھر اپنے مشاہدے اور اپنے عہد کی تعبیر کے مطابق اس متلی اور بےچینی کو جو خسرے میں زیادہ ہوتی ہے اس کمر درد سے الگ کرتا ہے جو چیچک کی زیادہ نمایاں علامت ہے۔ یہ طب کی تاریخ کی ایک دستاویز ہے، آج کی تشخیص کی رہنما نہیں۔ اگر آپ دو بیماریوں کا مطالعہ کریں تو کیا موازنہ کریں گے؟
