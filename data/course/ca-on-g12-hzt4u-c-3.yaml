  title:
    en: The House of Wisdom
    ar: بيت الحكمة
    ur: بیت الحکمت
  text:
    en: "The House of Wisdom was a library in Baghdad. Ahmad Amin, in Duha al-Islam, calls it the largest library whose report survives from the early Abbasid period. He writes that al-Rashid laid its foundation and al-Ma'mun developed it, sending to ask leave to bring the ancient sciences he chose, and that its system and exact location stay uncertain. Where did the ancients' ideas meet Arabic?"
    ar: "كان بيت الحكمة مكتبة في بغداد. ويعدّها أحمد أمين في «ضحى الإسلام» أكبر مكتبة نُقل خبرها من العصر العباسي الأول. ويذكر أن الرشيد وضع نواتها وأن المأمون نماها وقواها، فبعث يستأذن في إرسال من يختار من العلوم القديمة، وأن نظامها وموقعها بالتحديد يكتنفهما الغموض. أين لقيت أفكار القدماء العربية؟"
    ur: "بیت الحکمت بغداد میں ایک کتب خانہ تھا۔ احمد امین «ضحی الاسلام» میں اسے ابتدائی عباسی دور کا وہ سب سے بڑا کتب خانہ کہتے ہیں جس کی خبر ہم تک پہنچی۔ وہ لکھتے ہیں کہ رشید نے اس کی بنیاد رکھی اور مامون نے اسے ترقی دی اور قدیم علوم کی کتابیں لانے کی اجازت مانگنے کے لیے پیغام بھیجا، اور یہ کہ اس کا نظام اور ٹھیک مقام غیر واضح رہتا ہے۔ قدیم لوگوں کے خیالات کی عربی سے ملاقات کہاں ہوئی؟"
  entity: building/bayt-al-hikma
  sources:
  - source/duha-islam
- position: within
  kind: story
  title:
    en: "Al-Ma'mun's letter and the paid translators"
    ar: "كتاب المأمون وأجور النقلة"
    ur: "مامون کا خط اور مترجمین کی اجرت"
  text:
    en: "Ibn al-Nadim, in the Fihrist, relates that al-Ma'mun wrote to the king of the Romans asking permission to translate what he chose of the ancient sciences kept in his treasury, and sent a group, among them al-Hajjaj ibn Matar, Ibn al-Bitriq and Salm, who was in charge of the House of Wisdom. He reports from Abu Sulayman al-Mantiqi that the Banu Shakir paid the translators, among them Hunayn ibn Ishaq, Habish ibn al-Hasan and Thabit ibn Qurra, about five hundred dinars a month. The museum's record notes that this picture comes from Ibn al-Nadim alone. How can a force like this shape later thought?"
    ar: "يروي ابن النديم في «الفهرست» أن المأمون كتب إلى ملك الروم يطلب الإذن في نقل ما اختاره من العلوم القديمة المخزونة عنده، وأنه أرسل جماعة، منهم الحجاج بن مطر وابن البطريق وسلم صاحب بيت الحكمة. وينقل عن أبي سليمان المنطقي أن بني شاكر كانوا يعطون النقلة، ومنهم حنين بن إسحاق وحبيش بن الحسن وثابت بن قرة، نحو خمسمائة دينار في الشهر. ويلاحظ سجل المتحف أن هذه الصورة من ابن النديم وحده. كيف لقوة كهذه أن تشكّل الفكر اللاحق؟"
    ur: "ابن الندیم «الفہرست» میں بیان کرتے ہیں کہ مامون نے رومیوں کے بادشاہ کو لکھا کہ جو قدیم علوم اس کے خزانے میں ہیں ان میں سے اپنی چنی ہوئی کا ترجمہ کرنے کی اجازت دے، اور ایک جماعت بھیجی جس میں حجاج بن مطر، ابن البطریق اور سلم، جو بیت الحکمت کے سربراہ تھے، شامل تھے۔ وہ ابو سلیمان منطقی سے نقل کرتے ہیں کہ بنو شاکر مترجمین کو، جن میں حنین بن اسحاق، حبیش بن الحسن اور ثابت بن قرہ تھے، ماہانہ تقریباً پانچ سو دینار دیتے تھے۔ میوزیم کا ریکارڈ نوٹ کرتا ہے کہ یہ تصویر صرف ابن الندیم سے آتی ہے۔ ایسی قوت بعد کی فکر کو کیسے ڈھال سکتی ہے؟"
