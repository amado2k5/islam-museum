- position: within
  kind: story
  title:
    en: Half the sky speaks Arabic
    ar: نصف السماء يتكلم العربية
    ur: 'ادھا آسمان عربی بولتا ہے'
  text:
    en: Betelgeuse (bayt al-jawza), Aldebaran (al-dabaran), Algol (al-ghul), Vega (al-nasr al-waqi) — most bright-star names in your textbook are Arabic, fossilized from the era when Muslim astronomers
      mapped the sky.
    ar: بيت الجوزاء والدبران والغول والنسر الواقع — معظم أسماء النجوم اللامعة في كتابك عربية الأصل، متحجرة من زمن رسم فيه فلكيو المسلمين السماء.
    ur: 'بیت الجوزا، الدّبران، الغول، النسر الواقع — تمہاری کتاب کے زیادہ تر روشن ستاروں کے نام عربی ہیں، اس زمانے سے جمے ہوئے جب مسلم فلکیوں نے آسمان کا نقشہ بنایا۔'
  sources:
  - source/hill-1993
- position: within
  kind: scholar
  title:
    en: The model Copernicus borrowed
    ar: النموذج الذي استعاره كوبرنيك
    ur: 'وہ ماڈل جو کوپرنیک نے ادھار لیا'
  text:
    en: Ibn al-Shatir of Damascus rebuilt planetary models to remove Ptolemy's fudge factors; a century and a half later Copernicus used strikingly similar mathematics. Ideas travel — good ones far.
    ar: أعاد ابن الشاطر الدمشقي بناء نماذج الكواكب ليزيل الترقيعات البطلمية؛ وبعد نحو قرن ونصف استخدم كوبرنيك رياضيات شديدة الشبه. الأفكار تسافر — والجيدة منها بعيدًا.
    ur: 'دمشق کے ابن الشاطر نے سیاروں کے ماڈل بطلیموس کی الجھنیں نکال کر دوبارہ بنائے؛ ڈیڑھ صدی بعد کوپرنیک نے حیران کن طور پر ملتی جلتی ریاضی استعمال کی۔ خیالات سفر کرتے ہیں — اچھے دور تک۔'
  entity: person/ibn-al-shatir
  sources:
  - source/hill-1993
- position: after
  kind: place
  title:
    en: The observatory mountain
    ar: جبل المرصد
    ur: 'رصد گاہ کا پہاڑ'
  text:
    en: At Maragha (1259), astronomers worked in a purpose-built observatory — library, instruments, and scholars from several faiths under one dome of sky.
    ar: في مراغة ⁦(1259م)⁩ عمل الفلكيون في مرصد بُني لغايته — مكتبة وآلات وعلماء من أديان شتى تحت قبة سماء واحدة.
    ur: 'مراغہ ⁦(1259ء)⁩ میں فلکی ایک مخصوص رصد گاہ میں کام کرتے تھے — کتب خانہ، آلات، اور ایک ہی آسمان کے گنبد تلے کئی مذاہب کے علماء۔'
  entity: building/maragha-observatory
  sources:
  - source/hill-1993
