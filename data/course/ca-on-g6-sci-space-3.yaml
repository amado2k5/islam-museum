- position: after
  kind: story
  title:
    en: A tailed star over Yemen and Syria
    ar: نجم ذو ذؤابة فوق اليمن والشام
    ur: یمن اور شام کے اوپر دم والا ستارہ
  text:
    en: Shadharat al-Dhahab reports that in 905 AH a tailed star rose from the east of Najd; its rising was in Aries, its tail over Yemen and its course through Syria. The report tells where it rose, where its tail lay and where it moved. What would you look for to tell a comet from an ordinary star?
    ar: تذكر «شذرات الذهب» أنه في سنة 905هـ طلع من مشرق نجد نجم ذو ذؤابة، وكان طلوعه من برج الحمل وذؤابته في اليمن وسيره في الشام. تخبرنا الرواية أين طلع وأين كانت ذؤابته وأين سار. ما الذي تبحث عنه لتميّز المذنّب من النجم العادي؟
    ur: «شذرات الذہب» بتاتی ہے کہ 905ھ میں نجد کے مشرق سے ایک دم والا ستارہ طلوع ہوا؛ اس کا طلوع برجِ حمل سے تھا، اس کی دم یمن کے اوپر تھی اور اس کی چال شام میں تھی۔ روایت بتاتی ہے کہ وہ کہاں سے نکلا، اس کی دم کہاں تھی اور وہ کہاں چلا۔ دُمدار ستارے کو عام ستارے سے الگ پہچاننے کے لیے آپ کیا دیکھیں گے؟
