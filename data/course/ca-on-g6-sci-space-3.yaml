  title:
    en: Half the sky speaks Arabic
    ar: نصف السماء يتكلم العربية
    ur: 'ادھا آسمان عربی بولتا ہے'
  text:
    en: Betelgeuse (bayt al-jawza), Aldebaran (al-dabaran), Algol (al-ghul), Vega (al-nasr al-waqi) — most bright-star names in your textbook are Arabic, fossilized from the era when Muslim astronomers
      mapped the sky.
    ar: بيت الجوزاء والدبران والغول والنسر الواقع — معظم أسماء النجوم اللامعة في كتابك عربية الأصل، متحجرة من زمن رسم فيه فلكيو المسلمين السماء.
    ur: 'بیت الجوزا، الدّبران، الغول، النسر الواقع — تمہاری کتاب کے زیادہ تر روشن ستاروں کے نام عربی ہیں، اس زمانے سے جمے ہوئے جب مسلم فلکیوں نے آسمان کا نقشہ بنایا۔'
