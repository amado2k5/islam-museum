  title:
    en: The Sun and the planets move along the zodiac
    ar: الشمس والكواكب تتحرك على فلك البروج
    ur: سورج اور سیارے فلکِ بروج پر چلتے ہیں
  text:
    en: Al-Farghani describes the second motion as the sun's and planets' own motion along the zodiac from west to east, opposite in direction to the first. He shows that the sun covers the zodiac by its own motion in a solar year, returning to its point in about three hundred and sixty-five days and a quarter. Which bodies of the sky does this description name?
    ar: الحركة الثانية حركة الشمس والكواكب الخاصة بها على فلك البروج من المغرب إلى المشرق، وهي تخالف الحركة الأولى في الاتجاه. ويبين الفرغاني أن الشمس تقطع فلك البروج بحركتها الخاصة في عام شمسي، فتعود إلى نقطتها في نحو ثلاثمائة وخمسة وستين يوماً وربع يوم. أيّ أجرام السماء يسمّيها هذا الوصف؟
    ur: الفرغانی کے مطابق دوسری حرکت سورج اور سیاروں کی اپنی حرکت ہے جو فلکِ بروج پر مغرب سے مشرق کی طرف ہوتی ہے اور پہلی حرکت کے برعکس رخ میں ہے۔ وہ بتاتا ہے کہ سورج اپنی خاص حرکت سے ایک شمسی سال میں فلکِ بروج طے کرتا ہے اور تقریباً تین سو پینسٹھ دن اور ایک چوتھائی دن میں اپنے نقطے پر لوٹ آتا ہے۔ یہ بیان آسمان کے کن اجرام کا نام لیتا ہے؟
  entity: concept/al-harakat-al-thaniya
