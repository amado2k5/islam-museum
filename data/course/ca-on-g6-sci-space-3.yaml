  kind: invention
  title:
    en: 'Fixing the Moon''s distance'
    ar: 'تصحيح بُعد القمر'
    ur: 'چاند کے فاصلے کی اصلاح'
  text:
    en: 'Victor Roberts studied Ibn al-Shatir''s double-epicycle model of the Moon. Ptolemy''s lunar theory exaggerated the changing distance of the Moon, and Ibn al-Shatir''s arrangement reduced that defect, with the Earth still central. Roberts finds Copernicus''s lunar construction structurally identical apart from small parameter differences. On whether it travelled to Europe, Roberts in 1957 leaves the question open, while David A. King later reads the reappearance of its details as evidence of some transmission.'
    ar: 'درس فيكتور روبرتس نموذج ابن الشاطر القمري بفلكي تدوير. فالنظرية القمرية البطلمية بالغت في تغير المسافة، أما تركيب ابن الشاطر فخفف هذا الخلل، مع بقاء الأرض في المركز. ويقول روبرتس إن النموذج القمري لكوبرنيكوس مماثل من حيث البنية مع فروق صغيرة في المعاملات. أما الانتقال إلى أوروبا فمنسوب: روبرتس سنة 1957م يترك السؤال مفتوحاً، بينما يستدل ديفيد كينغ لاحقاً بعودة تفاصيل النماذج على حصول انتقال ما.'
    ur: 'وکٹر رابرٹس نے ابن الشاطر کے چاند کے دو تدویری دائروں والے نمونے کا مطالعہ کیا۔ بطلیموسی قمری نظریے نے چاند کی بدلتی دوری کو بڑھا چڑھا دیا تھا، اور ابن الشاطر کی ترتیب نے اس خرابی کو کم کیا، جبکہ زمین مرکز میں رہی۔ رابرٹس کے مطابق کوپرنیکس کی قمری ساخت ڈھانچے میں اس جیسی ہے، صرف معاملات میں معمولی فرق ہیں۔ یورپ تک پہنچنے کے سوال کو رابرٹس 1957ء میں کھلا چھوڑتے ہیں، جبکہ ڈیوڈ کنگ بعد میں نمونے کی تفصیلوں کے دوبارہ ظاہر ہونے کو کسی نہ کسی منتقلی کی دلیل مانتے ہیں۔'
  entity: invention/ibn-al-shatir-lunar-model
  sources:
