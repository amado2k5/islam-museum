- position: after
  kind: place
  title:
    en: 'The observatory on the hill'
    ar: 'المرصد على التل'
    ur: 'ٹیلے پر رصدگاہ'
  text:
    en: 'After the taking of Baghdad in 656 AH/1258 CE, Hulagu took up quarters in Maragha and ordered an observatory built from the plans of Nasir al-Din al-Tusi, who became its first director. The Encyclopaedia of Islam dates the foundation to 657 AH/1259 CE; it had a residence for Hulagu, a mosque and a rich library, and was financed from pious endowments. What do astronomers need besides their instruments?'
    ar: 'بعد أخذ بغداد سنة 656هـ/1258م نزل هولاكو مراغة وأمر ببناء مرصد على تصميم نصير الدين الطوسي، الذي أشرف على بنائه وصار أول مدير له. وتؤرخ دائرة المعارف الإسلامية التأسيس بسنة 657هـ/1259م؛ وضم المرصد مسكناً لهولاكو ومسجداً ومكتبة غنية، وكان يموَّل من ريع الأوقاف. ما الذي يحتاجه الفلكيون غير آلاتهم؟'
    ur: 'بغداد پر قبضے کے بعد، 656ھ/1258ء میں، ہولاکو نے مراغہ میں قیام کیا اور نصیر الدین الطوسی کے نقشے پر رصدگاہ بنانے کا حکم دیا؛ الطوسی اس کے پہلے ناظم بنے۔ موسوعۃ الاسلام اس کی بنیاد 657ھ/1259ء بتاتی ہے؛ اس میں ہولاکو کی رہائش، ایک مسجد اور ایک بھرپور کتب خانہ تھا، اور اسے وقف کی آمدنی سے چلایا جاتا تھا۔ فلکیات دانوں کو اپنے آلات کے علاوہ اور کیا چاہیے؟'
  entity: building/maragha-observatory
  sources:
  - source/encyclopaedia-of-islam-2
