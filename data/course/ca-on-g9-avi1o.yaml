summary:
  en: 'The Ontario Grade 9 open course AVI1O: three strands, creating and presenting, reflecting and analysing, and foundations. The museum maps nine of the expectations through Islamic examples only: materials, display, the work art does, the society behind it, careers, pattern and technique.'
  ar: 'مقرر AVI1O المفتوح للصف التاسع في أونتاريو: ثلاثة محاور هي الإبداع والعرض، والتأمل والتحليل، والأسس. ويربط المتحف تسعًا من التوقعات بأمثلة إسلامية فقط: المواد، والعرض، ووظيفة الفن، والمجتمع الذي وراءه، والمهن، والزخرفة والتقنية.'
  ur: 'اونٹاریو کا کھلا کورس AVI1O برائے جماعت نہم: تین شاخیں، تخلیق و پیشکش، غور و تجزیہ، اور بنیادیں۔ عجائب گھر نو توقعات کو جوڑتا ہے، صرف اسلامی مثالوں سے: مواد، نمائش، فن کا کام، اس کے پیچھے معاشرہ، پیشے، اور نقش و تکنیک۔'
