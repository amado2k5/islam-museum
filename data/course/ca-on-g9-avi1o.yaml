summary:
  en: 'The Ontario Grade 9 open course AVI1O: three strands, creating and presenting, reflecting and analysing, and foundations. The museum maps nine of the expectations through Islamic examples only: materials, display, the work art does, the society behind it, careers, pattern and technique.'
  ar: 'مقرر AVI1O المفتوح للصف التاسع في أونتاريو: ثلاثة محاور هي الإبداع والعرض، والتأمل والتحليل، والأسس. ويربط المتحف تسعًا من التوقعات بأمثلة إسلامية فقط: المواد، والعرض، ووظيفة الفن، والمجتمع الذي وراءه، والمهن، والزخرفة والتقنية.'
  ur: 'اونٹاریو کا کھلا کورس AVI1O برائے جماعت نہم: تین شاخیں، تخلیق و پیشکش، غور و تجزیہ، اور بنیادیں۔ عجائب گھر نو توقعات کو جوڑتا ہے، صرف اسلامی مثالوں سے: مواد، نمائش، فن کا کام، اس کے پیچھے معاشرہ، پیشے، اور نقش و تکنیک۔'
  es: "El curso abierto AVI1O de noveno grado de Ontario se divide en tres ejes: creación y presentación, reflexión y análisis, y fundamentos. El museo ilustra nueve de las expectativas únicamente a través de ejemplos islámicos: materiales, exhibición, la función del arte, la sociedad que lo sustenta, las trayectorias profesionales, el patrón y la técnica."
  fr: "Le cours ouvert AVI1O de 9e année en Ontario comprend trois volets: création et présentation, réflexion et analyse, et fondements. Le musée illustre neuf des attentes à travers des exemples exclusivement islamiques: matériaux, présentation, fonction artistique, société sous-jacente, carrières, motifs et techniques."
  tr: "Ontario'daki dokuzuncu sınıf için AVI1O açık müfredatı üç eksene dayanmaktadır: yaratıcılık ve sunum, yansıtma ve analiz ile temeller. Müze, bu eksenlerden dokuzunu yalnızca İslami örneklerle ilişkilendiriyor: malzemeler, sunum, sanatın işlevi, arkasındaki toplum, meslekler, süsleme ve teknik."
  id: "Kurikulum terbuka AVI1O untuk kelas sembilan di Ontario memiliki tiga poros: kreativitas dan presentasi, refleksi dan analisis, serta dasar-dasar. Museum ini menghubungkan sembilan poros tersebut hanya dengan contoh-contoh Islam: material, presentasi, fungsi seni, masyarakat di baliknya, profesi, ornamen, dan teknik."
