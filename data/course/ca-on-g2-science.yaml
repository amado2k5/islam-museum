summary:
  en: 'The 2022 Ontario Grade 2 Science and Technology course has five strands: STEM Skills and Connections, Life Systems, Matter and Energy, Structures and Mechanisms, and Earth and Space Systems. The museum maps five lessons, one in each strand.'
  ar: 'مقرر العلوم والتكنولوجيا للصف الثاني في منهاج أونتاريو 2022 له خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وارتباطاتها، والأنظمة الحية، والمادة والطاقة، والبنى والآليات، ونظم الأرض والفضاء. ويربط المتحف خمسة دروس، درسًا في كل محور.'
  ur: 'اونٹاریو نصاب 2022 کی جماعت دوم سائنس و ٹیکنالوجی کی پانچ شاخیں ہیں: STEM مہارتیں اور روابط، جاندار نظام، مادّہ اور توانائی، ڈھانچے اور میکانزم، اور زمین اور خلا کے نظام۔ عجائب گھر پانچ اسباق جوڑتا ہے، ہر شاخ میں ایک۔'
