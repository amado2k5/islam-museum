  title:
    en: Ibn Rushd on wisdom and the revealed law
    ar: ابن رشد في الحكمة والشريعة
    ur: 'ابن رشد: حکمت اور شریعت'
  text:
    en: "Al-Zirikli counts among Ibn Rushd's printed works the Fasl al-Maqal, whose title, as he lists it, speaks of the accord of wisdom and the revealed law. Which big question does a title like this answer, and how does Ibn Khaldun answer it?"
    ar: "يعدّ الزركلي من مؤلفات ابن رشد المطبوعة «فصل المقال»، وعنوانه كما يورده يتحدث عن اتصال الحكمة بالشريعة. أي سؤال كبير يجيب عنه عنوان كهذا، وكيف يجيب عنه ابن خلدون؟"
    ur: "زرکلی ابن رشد کی مطبوعہ تصانیف میں «فصل المقال» کو شمار کرتے ہیں، جس کا عنوان، جیسا وہ درج کرتے ہیں، حکمت اور شریعت کے باہمی اتصال کی بات کرتا ہے۔ ایسا عنوان کس بڑے سوال کا جواب ہے، اور ابن خلدون اس کا جواب کیسے دیتے ہیں؟"
  entity: work/fasl-al-maqal
  sources:
  - source/al-aalam
- position: after
  kind: reflection
  title:
    en: Ibn Khaldun's refutation of philosophy
    ar: إبطال الفلسفة عند ابن خلدون
    ur: ابن خلدون کا ابطالِ فلسفہ
  text:
    en: "In the Muqaddima, Ibn Khaldun devotes a chapter to refuting philosophy. He holds that the philosophers' proofs are universal mental judgements, while external existing things are individuated by their matter, so there is no certainty that the mental conforms to the external. How do you weigh this against the answer that the title of the Fasl al-Maqal suggests?"
    ar: "خصّص ابن خلدون في «المقدمة» فصلاً لإبطال الفلسفة. ويرى أن براهينهم أحكام ذهنية كلية، والموجودات الخارجية متشخصة بموادها، فلا يقين في مطابقة الذهني للخارجي. كيف توازن بين هذا والجواب الذي يوحي به عنوان «فصل المقال»؟"
    ur: "ابن خلدون «مقدمہ» میں فلسفے کے ابطال کے لیے ایک باب مخصوص کرتے ہیں۔ ان کا خیال ہے کہ فلسفیوں کے براہین کلی ذہنی احکام ہیں، جبکہ خارجی موجودات اپنے مادوں سے متشخص ہیں، اس لیے ذہنی کے خارجی سے مطابق ہونے میں یقین نہیں۔ آپ اسے اس جواب کے مقابل کیسے تولتے ہیں جس کی طرف «فصل المقال» کا عنوان اشارہ کرتا ہے؟"
