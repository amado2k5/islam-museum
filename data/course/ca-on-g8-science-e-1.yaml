  title:
    en: Who has the first turn at the water?
    ar: من له أول نوبة في الماء؟
    ur: پانی پر پہلی باری کس کی؟
  text:
    en: The Kuwaiti Encyclopedia of Fiqh (al-Mawsu'a al-Fiqhiyya al-Kuwaitiyya), on shirb, the right to water, sorts waters into four kinds by ownership and use, and says public water, like great rivers and mountain springs, belongs to all. It states that when water is short the one first to bring the land to life has priority, but that a person who needs water to drink goes before one who needs it for land, and that cleaning public canals is paid from the treasury of the Muslims. Whose needs come first where you live?
    ar: تقسم الموسوعة الفقهية الكويتية، في الكلام على الشِّرب، المياه أربعة أنواع بالنظر إلى تملكها والانتفاع بها، وتقول إن الماء العام، كالأنهار الكبيرة والعيون في الجبال، حق للناس جميعًا. وتذكر أنه إذا قل الماء قُدّم السابق في الإحياء، وأن المحتاج إلى الماء للشرب يُقدَّم على من يحتاجه لسقي الأرض، وأن مؤنة كرى الأنهار العامة من بيت مال المسلمين. فحاجة من تُقدَّم أولًا في مكان إقامتك؟
    ur: کویتی فقہی انسائیکلوپیڈیا ⁦(الموسوعۃ الفقہیۃ الکویتیۃ)⁩ شِرب ⁦(پانی کے حق)⁩ کے بیان میں پانی کو ملکیت اور استعمال کے لحاظ سے چار اقسام میں بانٹتا ہے، اور کہتا ہے کہ عام پانی، جیسے بڑے دریا اور پہاڑوں کے چشمے، سب لوگوں کا حق ہے۔ وہ بتاتا ہے کہ جب پانی کم ہو تو زمین آباد کرنے میں پہل کرنے والے کو ترجیح ملتی ہے، مگر پینے کے لیے پانی چاہنے والا زمین کے لیے چاہنے والے سے پہلے آتا ہے، اور عام نہروں کی صفائی کا خرچ مسلمانوں کے بیت المال سے ہے۔ جہاں آپ رہتے ہیں وہاں کس کی ضرورت پہلے آتی ہے؟
