- position: after
  kind: invention
  title:
    en: Finding a route for hidden water
    ar: البحث عن مسار للماء الخفي
    ur: پوشیدہ پانی کے لیے راستہ تلاش کرنا
  text:
    en: In The Extraction of Hidden Waters, the record says, al-Karaji describes levels and surveying procedures inside a manual that follows water from exploration to maintenance and handover. It explains a qanat as a gently sloping underground tunnel that brings water out by gravity, with vertical shafts for working, access and maintenance, and stresses that this is a refinement, not the invention of qanats. Why must the route neither climb against the flow nor lose its direction?
    ar: يذكر السجل أن الكرجي يشرح في «إنباط المياه الخفية» موازين وطرائق للتسوية وتوجيه الحفر، ضمن كتاب يتابع الماء من البحث عنه إلى صيانة القناة وتسليم العمل. والقناة الجوفية نفق ذو انحدار لطيف يخرج الماء بالجاذبية، وتتصل به فتحات رأسية للعمل والوصول والصيانة، ويؤكد السجل أن هذا تحسين لا اختراع للقنوات. لماذا يجب ألا يرتفع المسار في وجه الجريان ولا يضل اتجاهه؟
    ur: ریکارڈ بتاتا ہے کہ کرجی «انباطِ میاہِ خفیہ» میں سطح بندی اور کھدائی کی سمت درست رکھنے کے آلات اور طریقے بیان کرتا ہے، ایک ایسی کتاب کے اندر جو پانی کے ساتھ اس کی تلاش سے لے کر دیکھ بھال اور حوالگی تک چلتی ہے۔ زیرزمین قنات ہلکی ڈھلان والی سرنگ ہے جو پانی کو ثقل سے باہر لاتی ہے، اور اس سے کام، رسائی اور دیکھ بھال کے لیے عمودی سوراخ جڑے ہوتے ہیں؛ ریکارڈ زور دیتا ہے کہ یہ بہتری ہے، قناتوں کی ایجاد نہیں۔ راستے کو بہاؤ کے خلاف چڑھنا کیوں نہیں چاہیے اور اپنی سمت کیوں نہیں کھونی چاہیے؟
