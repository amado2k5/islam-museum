  title:
    en: Public water in a wall
    ar: ماء للناس في جدار
    ur: دیوار میں لوگوں کا پانی
  text:
    en: The record on the sabil, the public water building, follows al-Haddad. It says sabils drew their water from wells, pools and springs, or from rain and floods through well-built channels or pipes hidden in the walls, and that some had one or two cisterns and stone or marble basins. They received great care in their siting and building, and in the many endowments that kept them working. Who today keeps a public supply running?
    ar: يتبع سجل السبيل، أي مبنى الماء العام، ما يقوله الحداد. فقد كانت الأسبلة تستمد ماءها من الآبار والبرك والعيون أو من الأمطار والسيول بقنوات محكمة أو أقصاب مغيبة في الجدران، وبعضها زُوّد بصهريج أو صهريجين وبأحواض من الحجر أو الرخام. وحظيت بعناية في اختيار مواقعها وعمارتها، وفي الأوقاف الكثيرة التي وُقفت عليها لدوام منفعتها. فمن يُبقي اليوم إمدادًا عامًا بالماء قائمًا؟
    ur: سبیل، یعنی عوامی پانی کی عمارت، کا ریکارڈ الحداد کی پیروی کرتا ہے۔ وہ بتاتا ہے کہ سبیلیں اپنا پانی کنوؤں، تالابوں اور چشموں سے، یا بارش اور سیلاب سے محکم نالیوں یا دیواروں میں چھپی نلیوں کے ذریعے لیتی تھیں، اور بعض میں ایک یا دو حوض اور پتھر یا سنگِ مرمر کے حوضچے تھے۔ ان کی جگہ کے انتخاب اور تعمیر میں بڑی احتیاط برتی جاتی تھی، اور ان کے چلتے رہنے کے لیے بہت سے اوقاف تھے۔ آج عوامی پانی کی فراہمی کو کون چلتا رکھتا ہے؟
  entity: concept/sabil
