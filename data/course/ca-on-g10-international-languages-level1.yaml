label:
  en: Grade 10 International Languages, Level 1, Academic, LBABD to LDYBD
  ar: اللغات الدولية، المستوى 1، أكاديمي، للصف العاشر، LBABD إلى LDYBD
  ur: جماعت دہم بین الاقوامی زبانیں، سطح 1، اکیڈمک، LBABD تا LDYBD
  es: "Lenguas Internacionales de 10.º grado, Nivel 1, Académico, LBABD a LDYBD"
