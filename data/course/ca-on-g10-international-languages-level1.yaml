summary:
  en: 'The Ontario Ministry''s generic Level 1 Academic course in international languages, taught for many languages, Arabic among them: four strands, Listening, Speaking, Reading and Writing. The museum serves only the expectations that ask for knowledge of the cultures and communities where the language is spoken.'
  ar: 'مقرر وزارة أونتاريو العام للغات الدولية، المستوى 1، الأكاديمي، ويُدرَّس لكثير من اللغات ومنها العربية: أربعة محاور هي الاستماع والتحدث والقراءة والكتابة. ولا يخدم المتحف إلا التوقعات التي تطلب معرفة ثقافات الجماعات التي تُتحدَّث فيها اللغة.'
  ur: 'اونٹاریو کی وزارت کا بین الاقوامی زبانوں کا عمومی کورس، سطح 1، اکیڈمک، جو کئی زبانوں کے لیے پڑھایا جاتا ہے، عربی بھی ان میں ہے: چار شاخیں، سننا، بولنا، پڑھنا اور لکھنا۔ عجائب گھر صرف ان توقعات کو پورا کرتا ہے جو اس زبان کے بولنے والی جماعتوں کی ثقافتوں کے علم کا تقاضا کرتی ہیں۔'
  es: "El curso académico genérico de nivel 1 del Ministerio de Ontario sobre lenguas internacionales, impartido para varios idiomas, entre ellos el árabe, consta de cuatro áreas: comprensión auditiva, expresión oral, comprensión lectora y expresión escrita. El museo solo satisface las expectativas que exigen conocimiento de las culturas y comunidades donde se habla el idioma."
  fr: "Le cours académique générique de niveau 1 du ministère ontarien des Langues internationales, dispensé pour de nombreuses langues, dont l'arabe, comprend quatre volets: compréhension orale, expression orale, compréhension écrite et expression écrite. Le musée répond uniquement aux attentes qui exigent une connaissance des cultures et des communautés où la langue est parlée."
