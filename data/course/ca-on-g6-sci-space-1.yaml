- position: within
  kind: scholar
  title:
    en: Following the Sun's course from al-Raqqa
    ar: متابعة مسير الشمس من الرقة
    ur: رقہ سے سورج کی چال کا مشاہدہ
  text:
    en: Al-Battani spent most of his life in al-Raqqa and observed the sky there for many years to set the elements of his tables for that city's meridian and latitude. He measured the Sun's course over successive years, fixed the solstices and equinoxes above all in 882 and 883 CE, and observed solar and lunar eclipses in 883 and 891. What would you write down each day to follow the Sun?
    ar: قضى البتاني معظم حياته في الرقة، ورصد فيها السماء سنين طويلة ليضع أصول جداوله على طول المدينة وعرضها. ورصد فيها مسير الشمس سنين متوالية، وحدد الانقلابين والاعتدالين ولا سيما في سنتي 882 و883م، ورصد كسوفات الشمس وخسوفات القمر في سنتي 883 و891م. ماذا تحتاج أن تسجل كل يوم لتتابع مسير الشمس؟
    ur: البتانی نے اپنی زندگی کا بیشتر حصہ رقہ میں گزارا اور وہاں برسوں آسمان کا مشاہدہ کیا تاکہ اس شہر کے طول و عرض کے مطابق اپنے جدولوں کی بنیادیں رکھ سکیں۔ انہوں نے متواتر برسوں تک سورج کی چال ناپی، انقلابین اور اعتدالین متعین کیے، خاص طور پر 882ء اور 883ء میں، اور 883ء اور 891ء میں سورج گرہن اور چاند گرہن کا مشاہدہ کیا۔ سورج کی چال کو دیکھنے کے لیے آپ روزانہ کیا لکھیں گے؟
  entity: person/al-battani
  sources:
  - source/nallino-albatenii-opus-astronomicum
- position: after
  kind: invention
  title:
    en: Fixing the Moon's changing distance
    ar: ضبط تغير بعد القمر
    ur: چاند کے بدلتے فاصلے کی درستی
  text:
    en: 'Victor Roberts highlights a problem in studying Ibn al-Shatir: Ptolemy''s lunar theory exaggerated the changing distance, whereas Ibn al-Shatir''s double-epicycle arrangement reduced that defect. Earth remains central to the overall description. Why would the Moon''s changing distance from Earth matter to anyone who wants to know where it will appear?'
    ar: 'يبرز فيكتور روبرتس عند دراسة ابن الشاطر مشكلة: النظرية القمرية البطلمية بالغت في تغير المسافة، أما تركيب ابن الشاطر بفلكي تدوير فخفف هذا الخلل. والأرض باقية في مركز الوصف العام. لماذا يهمّ تغيّر بعد القمر عن الأرض من يريد أن يعرف موضعه في السماء؟'
    ur: 'ابن الشاطر کے مطالعے میں وکٹر رابرٹس ایک مسئلہ نمایاں کرتے ہیں: بطلیموسی قمری نظریے نے فاصلے کی تبدیلی کو بڑھا چڑھا کر پیش کیا، جبکہ ابن الشاطر کی دو تدویری دائروں والی ترتیب نے اس خامی کو کم کیا۔ زمین عمومی بیان کے مرکز میں رہتی ہے۔ چاند کے زمین سے بدلتے فاصلے کی کیا اہمیت ہے اس شخص کے لیے جو جاننا چاہتا ہے کہ وہ آسمان میں کہاں نظر آئے گا؟'
  entity: invention/ibn-al-shatir-lunar-model
