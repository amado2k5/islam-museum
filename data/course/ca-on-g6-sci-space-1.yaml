  title:
    en: How al-Farghani explains an eclipse of the sun
    ar: كيف يفسّر الفرغاني كسوف الشمس
    ur: الفرغانی سورج گرہن کی وضاحت کیسے کرتا ہے
  text:
    en: Al-Farghani treats an eclipse of the sun as the moon's passing between the sun and the earth at conjunction. At conjunction the moon is at the ascending or descending node with no latitude from the sun's path, and covers it wholly. If the conjunction falls away from the nodes, parallax makes the visible differ from the true, and an eclipse may appear partial from one place and total from another. Where must the Moon stand to cover the Sun?
    ar: يعالج الفرغاني كسوف الشمس بأنه اعتراض القمر بين الشمس والأرض عند الاجتماع. وعند الاجتماع يكون القمر على الرأس أو الذنب ولا عرض له عن طريق الشمس فيحجبها كلها. وإن كان الاجتماع في غير الرأس والذنب، اختلف المرئي عن الحقيقي بسبب اختلاف المنظر، وقد يبدو الكسوف جزئياً من موضع وكلياً من موضع آخر. أين يجب أن يقف القمر ليحجب الشمس؟
    ur: الفرغانی سورج گرہن کو اجتماع کے وقت چاند کے سورج اور زمین کے درمیان آ جانے کے طور پر لیتا ہے۔ اجتماع کے وقت چاند راس یا ذنب پر ہوتا ہے اور سورج کے راستے سے اس کا کوئی عرض نہیں ہوتا، اس لیے وہ سورج کو پورا ڈھانپ لیتا ہے۔ اگر اجتماع راس اور ذنب کے علاوہ کہیں ہو تو اختلافِ منظر کی وجہ سے نظر آنے والا حقیقی سے مختلف ہوتا ہے، اور گرہن ایک جگہ سے جزوی اور دوسری جگہ سے کلی دکھائی دے سکتا ہے۔ سورج کو ڈھانپنے کے لیے چاند کو کہاں ہونا چاہیے؟
  entity: concept/eclipses
  sources:
