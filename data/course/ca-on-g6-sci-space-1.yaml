    en: Counting the year to minutes
    ar: إحصاء السنة إلى الدقائق
    ur: 'سال کو منٹوں تک گننا'
  text:
    en: 'Al-Battani measured the solar year at about 365 days, 5 hours and 46 minutes — centuries before Europe improved on it. Astronomy was worship-adjacent work: calendars, prayer times, fasting.'
    ar: 'قاس البتاني السنة الشمسية بنحو 365 يومًا و5 ساعات و46 دقيقة — قبل أن يتفوق عليه الأوروبيون بقرون. كان الفلك عملًا ملاصقًا للعبادة: تقاويم ومواقيت صلاة وصيام.'
    ur: 'البتانی نے شمسی سال 365 دن، 5 گھنٹے اور 46 منٹ ناپا — یورپ کے اس پر سبقت سے صدیاں پہلے۔ فلکیات عبادت سے جڑا کام تھا: کیلنڈر، نماز کے اوقات، روزے۔'
  entity: person/al-battani
  sources:
