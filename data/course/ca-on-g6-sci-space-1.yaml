  title:
    en: 'Watching the Sun from al-Raqqa'
    ar: 'رصد الشمس من الرقة'
    ur: 'رقہ سے سورج کا مشاہدہ'
  text:
    en: 'Al-Battani spent most of his life in al-Raqqa and observed the sky there for many years to set the elements of his tables for that city''s meridian and latitude. He measured the Sun''s course over successive years and fixed the solstices and equinoxes, above all in 882 and 883 CE. Ja''far ibn al-Muktafi reported from him that he began observing in 264 AH and continued to 306. What would you write down each day to follow the Sun?'
    ar: 'قضى البتاني معظم حياته في الرقة، ورصد فيها السماء سنين طويلة ليضع أصول جداوله على طول المدينة وعرضها. ورصد فيها مسير الشمس سنين متوالية، وحدد الانقلابين والاعتدالين ولا سيما في سنتي 882 و883م. وروى جعفر بن المكتفي عنه أنه بدأ الرصد سنة 264هـ وانتهى إلى سنة 306هـ. ماذا تحتاج أن تسجل كل يوم لتتابع مسير الشمس سنين طويلة؟'
    ur: 'البتانی نے اپنی زندگی کا بیشتر حصہ رقہ میں گزارا اور وہاں برسوں آسمان کا مشاہدہ کیا تاکہ اس شہر کے طول و عرض کے مطابق اپنے جدولوں کی بنیادیں رکھ سکیں۔ انہوں نے متواتر برسوں تک سورج کی چال ناپی اور انقلابین اور اعتدالین متعین کیے، خاص طور پر 882ء اور 883ء میں۔ جعفر بن المکتفی نے ان سے روایت کیا کہ انہوں نے 264ھ میں مشاہدہ شروع کیا اور 306ھ تک جاری رکھا۔ اتنے برسوں تک سورج کی چال کو دیکھنے کے لیے آپ کو روزانہ کیا لکھنا ہوگا؟'
  entity: person/al-battani
  sources:
  - source/nallino-albatenii-opus-astronomicum
- position: within
  kind: invention
  title:
    en: 'A treatise on using the astrolabe'
    ar: 'رسالة في استعمال الأسطرلاب'
    ur: 'اسطرلاب کے استعمال پر ایک رسالہ'
  text:
    en: 'Risalat al-Mizzi fi al-asturlab, al-Azhar Library no. 476/65513, is one of the manuscripts on observational instruments. The Bibliotheca Alexandrina book says it explains how to take altitudes, the two shadows, the latitudes of towns, the arcs of night and day, prayer times, and the times of rising and setting of stars. How could measuring an altitude help you picture the Sun''s path above the Earth?'
    ar: '«رسالة المزي في الأسطرلاب»، رقم 476/65513 في مكتبة الأزهر، من المخطوطات التي تعالج علم آلات الرصد. ويصف كتاب مكتبة الإسكندرية الرسالة بأنها تتحدث عن طريقة أخذ الارتفاع، ومعرفة الظلين، وعروض البلاد، وقوس الليل والنهار، وأوقات الصلاة، وأوقات طلوع الكواكب وغروبها. كيف يعينك قياس الارتفاع على تخيّل مسار الشمس فوق الأرض؟'
    ur: '«رسالۃ المزی فی الاسطرلاب»، الازہر کے کتب خانے میں نمبر 476/65513، آلاتِ رصد پر مخطوطات میں سے ایک ہے۔ مکتبۃ الاسکندریہ کی کتاب کے مطابق یہ رسالہ ارتفاع لینے کے طریقے، دونوں سایوں، شہروں کے عرض بلد، رات اور دن کی قوسوں، نماز کے اوقات اور ستاروں کے طلوع و غروب کے اوقات کے بارے میں ہے۔ ارتفاع ناپنا زمین کے اوپر سورج کا راستہ تصور کرنے میں آپ کی کیسے مدد کر سکتا ہے؟'
  entity: work/risalat-al-mizzi-fi-al-asturlab
  sources:
