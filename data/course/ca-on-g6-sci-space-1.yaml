- position: within
  kind: invention
  title:
    en: A computer you hold to the sky
    ar: حاسوب ترفعه إلى السماء
    ur: 'ایک کمپیوٹر جو آسمان کی طرف اٹھاتے ہو'
  text:
    en: The astrolabe — refined to high art in the Islamic world — could tell time from stars, find latitudes and answer dozens of sky questions with a few brass plates. It was the smartphone of its millennium.
    ar: كان الأسطرلاب — الذي بلغ في العالم الإسلامي ذروة الصنعة — يقيس الوقت من النجوم ويحدد خطوط العرض ويجيب عن عشرات الأسئلة السماوية بألواح نحاسية قليلة؛ لقد كان هاتف ألفيته الذكي.
    ur: 'اسطرلاب — جسے اسلامی دنیا نے فن کی بلندی پر پہنچایا — تاروں سے وقت بتاتا، عرض بلد نکالتا اور چند پیتل کی تختیوں سے آسمان کے درجنوں سوالوں کے جواب دیتا۔ یہ اپنے ہزار سال کا اسمارٹ فون تھا۔'
