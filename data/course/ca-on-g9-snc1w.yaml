summary:
  en: 'The Ontario Grade 9 Science course SNC1W has five strands: STEM Skills, Careers, and Connections; Biology; Chemistry; Physics; and Earth and Space Science. The museum maps four of them; Physics has no honest link.'
  ar: 'لمقرر العلوم SNC1W للصف التاسع في أونتاريو خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات والمهن وصلاتها، والأحياء، والكيمياء، والفيزياء، وعلوم الأرض والفضاء. ويربط المتحف أربعة منها؛ ولا صلة صادقة له بالفيزياء.'
  ur: 'اونٹاریو کے نویں جماعت سائنس کورس SNC1W کے پانچ محور ہیں: STEM مہارتیں، پیشے اور روابط، حیاتیات، کیمیا، طبیعیات، اور زمین و خلا کی سائنس۔ عجائب گھر ان میں سے چار کو جوڑتا ہے؛ طبیعیات سے اس کا کوئی صادق ربط نہیں۔'
