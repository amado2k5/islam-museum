summary:
  en: 'The Ontario Grade 9 Science course SNC1W has five strands: STEM Skills, Careers, and Connections; Biology; Chemistry; Physics; and Earth and Space Science. The museum maps four of them; Physics has no honest link.'
  ar: 'لمقرر العلوم SNC1W للصف التاسع في أونتاريو خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات والمهن وصلاتها، والأحياء، والكيمياء، والفيزياء، وعلوم الأرض والفضاء. ويربط المتحف أربعة منها؛ ولا صلة صادقة له بالفيزياء.'
  ur: 'اونٹاریو کے نویں جماعت سائنس کورس SNC1W کے پانچ محور ہیں: STEM مہارتیں، پیشے اور روابط، حیاتیات، کیمیا، طبیعیات، اور زمین و خلا کی سائنس۔ عجائب گھر ان میں سے چار کو جوڑتا ہے؛ طبیعیات سے اس کا کوئی صادق ربط نہیں۔'
  es: "El curso de Ciencias de 9.º grado de Ontario, SNC1W, consta de cinco áreas temáticas: Habilidades, Carreras y Conexiones STEM; Biología; Química; Física; y Ciencias de la Tierra y el Espacio. El museo incluye cuatro de ellas; Física no tiene una relación directa."
  fr: "Le cours de sciences de 9e année de l'Ontario (SNC1W) comporte cinq volets: compétences, carrières et applications en STIM; biologie; chimie; physique; et sciences de la Terre et de l'espace. Le musée en présente quatre sur sa carte; le volet physique n'a aucun lien concret avec le programme."
  tr: "Ontario'daki dokuzuncu sınıf için SNC1W fen bilimleri müfredatı beş temel konuyu içerir: fen bilimleri, teknoloji, mühendislik, matematik, meslekler ve bunların bağlantıları, biyoloji, kimya, fizik ve yer ve uzay bilimleri. Müze bunlardan dördünü birbirine bağlar; ancak fizikle gerçek bir bağlantısı yoktur."
  id: "Kurikulum sains SNC1W untuk kelas sembilan di Ontario memiliki lima mata pelajaran inti: sains, teknologi, teknik, matematika, karier dan hubungannya, biologi, kimia, fisika, dan ilmu bumi dan antariksa. Museum ini menghubungkan empat di antaranya; namun, museum ini tidak memiliki hubungan yang nyata dengan fisika."
