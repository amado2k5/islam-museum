expectations:
- code: B1
  text:
    en: assess the impact of medical technologies and therapies, both conventional and alternative, used to diagnose and treat human health conditions
    ar: قيّم أثر التقنيات والعلاجات الطبية، التقليدية والبديلة، المستعملة في تشخيص الحالات الصحية البشرية وعلاجها
    ur: انسانی صحت کی کیفیات کی تشخیص اور علاج میں استعمال ہونے والی طبی ٹیکنالوجیوں اور علاجوں، روایتی اور متبادل دونوں، کے اثر کا جائزہ لیں
- code: B2
  text:
    en: investigate the uses of, and analyse the information provided by, a variety of medical technologies
    ar: استقصِ استعمالات مجموعة متنوعة من التقنيات الطبية وحلّل المعلومات التي تقدمها
    ur: مختلف طبی ٹیکنالوجیوں کے استعمالات کی تحقیق کریں اور ان کی فراہم کردہ معلومات کا تجزیہ کریں
- code: B3
  text:
    en: demonstrate an understanding of the function and use of a variety of medical technologies and the information they provide about the human body
    ar: أظهر فهمًا لوظيفة مجموعة متنوعة من التقنيات الطبية واستعمالها وللمعلومات التي تقدمها عن جسم الإنسان
    ur: مختلف طبی ٹیکنالوجیوں کے کام اور استعمال، اور جسمِ انسانی کے بارے میں ان کی فراہم کردہ معلومات کی فہم کا مظاہرہ کریں
