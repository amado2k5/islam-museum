  title:
    en: A painter and his patrons
    ar: مصوّر ورعاته
    ur: ایک مصور اور اس کے سرپرست
  text:
    en: Behzad of Herat was a miniature painter. In 1486 a decree of Sultan Husayn Bayqara made him head of the royal ateliers in Herat. After Husayn Bayqara's death in 1506, Babur links Behzad with the patronage of Muhammad Shaybani Khan in Herat. He later moved to Tabriz, the date and circumstances unknown, and directed the Safavid royal workshop. How can a change of rulers change where an artist works and for whom?
    ar: كمال الدين بهزاد الهراتي مصوّر منمنمات؛ وفي سنة 1486 صدر مرسوم السلطان حسين بايقرا بتعيينه رئيسًا لورش هراة الملكية. وبعد وفاة حسين بايقرا سنة 1506 يربط بابُر بهزاد برعاية محمد شيباني خان في هراة. ثم انتقل إلى تبريز في تاريخ وظروف مجهولين فأدار ورش البلاط الصفوي. كيف يغيّر تبدّل الحكام المكان الذي يعمل فيه الفنان والجهة التي يعمل لها؟
    ur: کمال الدین بہزاد ہراتی مصوری کی چھوٹی تصویروں کے مصور تھے؛ 1486ء میں سلطان حسین بایقرا کے فرمان نے انہیں ہرات کے شاہی کارخانوں کا سربراہ مقرر کیا۔ حسین بایقرا کی وفات کے بعد 1506ء میں بابر بہزاد کو ہرات میں محمد شیبانی خان کی سرپرستی سے جوڑتے ہیں۔ بعد میں وہ تبریز منتقل ہوئے، جس کی تاریخ اور حالات معلوم نہیں، اور صفوی شاہی کارخانے کی سربراہی کی۔ حکمرانوں کی تبدیلی اس بات کو کیسے بدل سکتی ہے کہ فنکار کہاں اور کس کے لیے کام کرتا ہے؟
