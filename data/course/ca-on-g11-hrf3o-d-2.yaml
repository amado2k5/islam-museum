  kind: reflection
  title:
    en: A sacrifice for the newborn
    ar: ذبيحة للمولود
    ur: نوزائیدہ کے لیے قربانی
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence defines the aqiqa, in juristic terms, as what is slaughtered for the newborn in thanks to God. The Encyclopaedia of Islam is cited for the sacrifice on the seventh day after birth, when it is recommended to name the child, shave its hair and slaughter a victim, with the greater part of the meat given to the poor. What does each act do for the child and the community?
    ar: تعرّف الموسوعة الفقهية الكويتية العقيقة، اصطلاحًا فقهيًّا، بأنها ما يُذبح عن المولود شكرًا لله. ويُستشهد بدائرة المعارف الإسلامية في أن الذبح يكون في اليوم السابع بعد الولادة، وفيه يُستحب تسمية الطفل وحلق شعره وذبح الذبيحة، ويُعطى الجزء الأكبر من اللحم للفقراء. ماذا يفعل كل عمل منها للطفل وللجماعة؟
    ur: کویتی فقہی انسائیکلوپیڈیا فقہی اصطلاح میں عقیقہ کی تعریف یہ کرتا ہے کہ وہ جانور جو نوزائیدہ کی طرف سے اللہ کے شکر میں ذبح کیا جائے۔ انسائیکلوپیڈیا آف اسلام کا حوالہ اس بات کے لیے دیا گیا ہے کہ قربانی پیدائش کے ساتویں دن ہوتی ہے، جس میں بچے کا نام رکھنا، اس کے بال مونڈنا اور جانور ذبح کرنا مستحب ہے، اور گوشت کا بڑا حصہ غریبوں کو دیا جاتا ہے۔ ان میں سے ہر عمل بچے اور جماعت کے لیے کیا کرتا ہے؟
  entity: practice/aqiqa
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
  - source/encyclopaedia-of-islam-2
- position: after
  kind: reflection
  title:
    en: The prayer over the dead
    ar: الصلاة على الميت
    ur: میت پر نماز
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says the funeral prayer is, for the majority of jurists, a communal obligation, discharged once some perform it, and that it consists of takbirs and supplication for the deceased, without bowing or prostration. Among the transmitted words of that supplication it gives: "O God, forgive him, have mercy on him, keep him well and pardon him". It adds that the Hanafis and Malikis required the body to be present, while the Shafi''is and Hanbalis allowed prayer over an absent deceased. Whom is the community gathering for?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن صلاة الجنازة فرض كفاية عند جمهور الفقهاء، تسقط بأداء بعضهم لها، وهي تكبيرات ودعاء للميت بلا ركوع ولا سجود. وتذكر من ألفاظ هذا الدعاء المأثورة: «اللهم اغفر له وارحمه وعافه واعفُ عنه». وتضيف أن الحنفية والمالكية اشترطوا حضور الجثمان، بينما أجاز الشافعية والحنابلة الصلاة على الغائب. لمن تجتمع الجماعة؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ نمازِ جنازہ جمہور فقہا کے نزدیک فرضِ کفایہ ہے جو کچھ لوگوں کے ادا کر دینے سے پوری ہو جاتی ہے، اور اس میں تکبیریں اور میت کے لیے دعا ہوتی ہے، بغیر رکوع اور سجدے کے۔ وہ اس دعا کے منقول الفاظ میں یہ دیتا ہے: «اے اللہ! اسے بخش دے، اس پر رحم فرما، اسے عافیت دے اور اسے معاف کر دے»۔ وہ مزید کہتا ہے کہ حنفیہ اور مالکیہ نے میت کا سامنے ہونا شرط رکھا، جبکہ شافعیہ اور حنابلہ نے غائب میت پر نماز کی اجازت دی۔ جماعت کس کے لیے جمع ہوتی ہے؟'
