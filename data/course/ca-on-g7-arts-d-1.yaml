  entity: concept/kufic-script
  title:
    en: 'Kufic: an angular script'
    ar: 'الكوفي: خط زاوي'
    ur: 'کوفی: زاویہ دار خط'
  text:
    en: Kufic is a family of angular Arabic scripts following precise rules for calibrated letters with geometric proportion. The name comes from Kufa but denotes a category, not necessarily a place of production. Maryam Ekhtiar counts its rise in the late seventh to early eighth century as a major development; it was the preferred script for copying the Qur'an until about the mid- to late tenth century. What does the shape of a script tell its reader?
    ar: الكوفي فئة من الخطوط الزاوية، اتبعت قواعد دقيقة لحروف موزونة ذات تناسب هندسي وانتظام. والاسم مأخوذ من الكوفة، لكنه يدل على فئة لا على مكان صنعها بالضرورة. وتعدّ مريم اختيار ظهوره وانتشاره بين أواخر القرن السابع وأوائل الثامن الميلادي تطورًا كبيرًا، وقد بقي الخط المفضل لنسخ المصاحف إلى أواسط القرن العاشر الميلادي أو أواخره تقريبًا. فماذا يقول شكل الخط لقارئه؟
    ur: کوفی زاویہ دار عربی خطوں کا ایک خاندان ہے جو ہندسی تناسب کے ساتھ متوازن حروف کے دقیق قواعد کی پیروی کرتا ہے۔ نام کوفہ سے لیا گیا ہے، مگر یہ ایک قسم کا نام ہے اور ضروری نہیں کہ جائے تیاری کا۔ مریم اختیار کے نزدیک ساتویں صدی عیسوی کے آخر اور آٹھویں کے اوائل میں اس کا ظہور اور پھیلاؤ ایک بڑی پیش رفت تھی، اور یہ دسویں صدی عیسوی کے وسط یا آخر تک قرآن کی نقل کا پسندیدہ خط رہا۔ خط کی شکل قاری کو کیا بتاتی ہے؟
  sources:
  - source/ekhtiar-how-to-read-islamic-calligraphy-2018
- position: after
  kind: object
  entity: concept/nastaliq-script
  title:
    en: 'Nasta''liq: a lyrical script for poetry'
    ar: 'النستعليق: خط غنائي للشعر'
    ur: 'نستعلیق: شاعری کے لیے غنائی خط'
  text:
    en: For Maryam Ekhtiar, nasta'liq is an elegant, lyrical script that originated in Iran and Central Asia and spread east to Mughal India and west to Ottoman Turkey. As the favoured script of Persian poetry, called the "bride of scripts", it was especially popular in Iran from the fifteenth century. Scholars hold that it developed in Shiraz and Tabriz as a gradual merging of naskh and ta'liq. What might a poem gain from a lyrical script?
    ar: النستعليق عند مريم اختيار خط رشيق غنائي نشأ في إيران وآسيا الوسطى، وانتشر شرقًا إلى الهند المغولية وغربًا إلى تركيا العثمانية. وبوصفه الخط المفضل للشعر الفارسي، ولقبه «عروس الخطوط»، شاع في إيران خاصة منذ القرن الخامس عشر الميلادي. ويرى الباحثون أنه تطور في شيراز وتبريز من اندماج تدريجي بين النسخ والتعليق. فماذا قد يكسب الشعر من خط غنائي؟
    ur: مریم اختیار کے نزدیک نستعلیق ایک نفیس، غنائی خط ہے جو ایران اور وسطی ایشیا میں پیدا ہوا اور مشرق میں مغل ہندوستان اور مغرب میں عثمانی ترکی تک پھیلا۔ فارسی شاعری کے پسندیدہ خط کے طور پر، جسے «خطوں کی دلہن» کہا جاتا ہے، یہ پندرہویں صدی عیسوی سے خاص طور پر ایران میں مقبول ہوا۔ محققین کی رائے ہے کہ یہ شیراز اور تبریز میں نسخ اور تعلیق کے بتدریج امتزاج سے وجود میں آیا۔ شاعری کو غنائی خط سے کیا حاصل ہو سکتا ہے؟
  sources:
  - source/ekhtiar-how-to-read-islamic-calligraphy-2018
