  title:
    en: A day set aside against prejudice
    ar: يوم مخصص لمكافحة الأحكام المسبقة
    ur: تعصب کے خلاف مخصوص ایک دن
  text:
    en: The International Day to Combat Islamophobia is a United Nations observance on 15 March each year, designated by the General Assembly in 2022. According to Wikipedia, the date marks the 2019 attack on two mosques in Christchurch, New Zealand, in which 51 people were killed during Friday prayer. General Assembly resolution A/RES/76/254 stresses that terrorism and violent extremism cannot and should not be associated with any religion. Why might an assembly of states name a prejudice with a day?
    ar: اليوم الدولي لمكافحة الإسلاموفوبيا مناسبة للأمم المتحدة في 15 مارس من كل عام، أقرتها الجمعية العامة سنة 2022. وبحسب ويكيبيديا فإن هذا التاريخ ذكرى هجوم 2019 على مسجدين في كرايستشيرش بنيوزيلندا، قُتل فيه 51 شخصًا أثناء صلاة الجمعة. ويؤكد قرار الجمعية العامة A/RES/76/254 أنه لا يمكن ولا ينبغي ربط الإرهاب والتطرف العنيف بأي دين. لماذا قد تسمّي جمعية دول حكمًا مسبقًا بيوم؟
    ur: اسلاموفوبیا کے خلاف عالمی دن اقوامِ متحدہ کی ایک یاد ہے جو ہر سال ۱۵ مارچ کو منائی جاتی ہے اور جنرل اسمبلی نے ۲۰۲۲ میں اسے مقرر کیا۔ ویکی پیڈیا کے مطابق یہ تاریخ نیوزی لینڈ کے شہر کرائسٹ چرچ میں دو مساجد پر ۲۰۱۹ کے حملے کی یاد ہے جس میں جمعے کی نماز کے دوران ۵۱ افراد مارے گئے۔ جنرل اسمبلی کی قرارداد A/RES/76/254 زور دیتی ہے کہ دہشت گردی اور پرتشدد انتہا پسندی کو کسی مذہب سے نہیں جوڑا جا سکتا اور نہ جوڑا جانا چاہیے۔ ریاستوں کی کوئی اسمبلی کسی تعصب کو دن کے نام سے کیوں موسوم کر سکتی ہے؟
