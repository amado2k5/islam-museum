  title:
    en: The sage who was put to death
    ar: الحكيم الذي قُتل
    ur: وہ حکیم جسے قتل کیا گیا
  text:
    en: Ibn al-Nadim describes Socrates as of the city of Athens, which he calls the city of scholars and sages. He says Socrates was an ascetic, an eloquent speaker and a wise man, that the Greeks killed him because he opposed them, and that Plato was among his companions. How does a society treat a thinker who opposes it?
    ar: يقول ابن النديم إنه من أهل مدينة إثينة، وصفها بمدينة العلماء والحكماء، وإنه كان زاهداً خطيباً حكيماً، وإن اليونانيين قتلوه لأنه خالفهم، وإن أفلاطون من أصحابه. كيف يعامل مجتمعٌ مفكراً يخالفه؟
    ur: ابن ندیم بیان کرتے ہیں کہ وہ اتھینہ شہر کے باشندے تھے، جسے انہوں نے علماء اور حکماء کا شہر کہا ہے، اور وہ زاہد، خطیب اور حکیم تھے، اور یونانیوں نے انہیں اس لیے قتل کیا کہ وہ ان کے مخالف رائے رکھتے تھے، اور افلاطون ان کے شاگردوں میں سے تھے۔ معاشرہ اس مفکر کے ساتھ کیا کرتا ہے جو اس کی مخالفت کرے؟
  entity: person/suqrat
  sources:
  - source/fihrist-ibn-al-nadim
- position: within
  kind: scholar
  title:
    en: A pupil who changed teachers
    ar: تلميذ تنقّل بين المعلمين
    ur: وہ شاگرد جس نے استاد بدلے
  text:
    en: Ibn al-Nadim, citing the book of Plutarch, says that in his early years Plato inclined to poetry, then attended the session of Socrates and left it, and then moved to the saying of Pythagoras. Aristotle took from him. How would you trace a school of thought from teacher to pupil?
    ar: ينقل ابن النديم عن كتاب فلوطرخس أن أفلاطون مال في أول أمره إلى الشعر، ثم حضر مجلس سقراط فتركه، ثم انتقل إلى قول فيثاغورس. وعنه أخذ أرسطاليس. كيف تتتبع مدرسة فكرية من المعلم إلى التلميذ؟
    ur: ابن ندیم فلوطرخس کی کتاب سے نقل کرتے ہیں کہ افلاطون ابتدا میں شاعری کی طرف مائل ہوئے، پھر سقراط کی مجلس میں حاضر ہوئے اور اسے چھوڑ کر فیثاغورس کی بات کی طرف گئے۔ ان سے ارسطو نے علم لیا۔ آپ کسی مکتبِ فکر کو استاد سے شاگرد تک کیسے تلاش کریں گے؟
  entity: person/aflatun
  sources:
  - source/fihrist-ibn-al-nadim
- position: after
  kind: scholar
  title:
    en: The successor and his books
    ar: الخليفة وكتبه
    ur: جانشین اور اس کی کتابیں
  text:
    en: Ibn al-Nadim calls Aristotle the son of Nicomachus, who took from Plato and succeeded him, and says that his books on logic, natural science and theology were translated into Arabic. They were interpreted by Alexander of Aphrodisias, Themistius, Yahya al-Nahwi, al-Farabi, al-Kindi and others. What does a long line of commentators say about a teacher's influence?
    ar: يقول ابن النديم إن أرسطاطاليس بن نيقوماخوس أخذ عن أفلاطون وخلفه، وإن كتبه في المنطق والطبيعيات والإلهيات نقلت إلى العربية. وفسرها الإسكندر الأفروديسي وثامسطيوس ويحيى النحوي والفارابي والكندي وغيرهم. ماذا تقول سلسلة طويلة من الشراح عن أثر المعلم؟
    ur: ابن ندیم کہتے ہیں کہ ارسطاطالیس بن نیقوماخس نے افلاطون سے علم حاصل کیا اور ان کے جانشین ہوئے، اور ان کی منطق، طبیعیات اور الٰہیات کی کتابیں عربی میں منتقل ہوئیں۔ ان کی شرحیں اسکندر افروڈیسی، ثامسطیوس، یحییٰ نحوی، فارابی، کندی اور دوسروں نے لکھیں۔ شارحین کا ایک طویل سلسلہ استاد کے اثر کے بارے میں کیا بتاتا ہے؟
  entity: person/aristutalis
  sources:
  - source/fihrist-ibn-al-nadim
