summary:
  en: The Ontario Grade 11 university-preparation course Physics (SPH3U) has six strands, from investigation skills to electricity and magnetism. The museum maps four of them, through the scholars, machines and instruments of the Islamic world.
  ar: لمقرر «الفيزياء» الجامعي للصف الحادي عشر في أونتاريو ستة محاور، من مهارات الاستقصاء إلى الكهرباء والمغناطيسية. ويربط المتحف أربعة منها من خلال علماء العالم الإسلامي وآلاته وأدواته.
  ur: اونٹاریو کے گیارھویں جماعت کے جامعاتی کورس «طبیعیات» کی چھ شاخیں ہیں، تحقیقی مہارتوں سے برق و مقناطیسیت تک۔ میوزیم ان میں سے چار کو عالمِ اسلام کے علما، مشینوں اور سازوں کے ذریعے جوڑتا ہے۔
  es: "El curso de Física de preparación universitaria de 11.º grado de Ontario (SPH3U) consta de seis ejes temáticos, que abarcan desde habilidades de investigación hasta electricidad y magnetismo. El museo ilustra cuatro de ellos a través de los eruditos, las máquinas y los instrumentos del mundo islámico."
  fr: "Le cours de physique de 11e année (SPH3U) du programme préparatoire universitaire de l'Ontario comporte six volets, allant des techniques d'investigation à l'électricité et au magnétisme. Le musée en présente quatre, à travers les savants, les machines et les instruments du monde islamique."
  tr: "Ontario'daki on birinci sınıf fizik müfredatı, araştırma becerilerinden elektriğe ve manyetizmaya kadar altı modülden oluşmaktadır. Müze, bu modüllerin dördünü İslam dünyasının bilim insanları, aletleri ve araçları aracılığıyla birbirine bağlamaktadır."
  id: "Kurikulum fisika kelas sebelas di Ontario memiliki enam modul, mulai dari keterampilan penyelidikan hingga listrik dan magnetisme. Museum ini menghubungkan empat modul tersebut melalui para ilmuwan, instrumen, dan peralatan dunia Islam."
