  title:
    en: Looms counted
    ar: إحصاء النول
    ur: کھڈیوں کی گنتی
  text:
    ar: تذكر شذرات الذهب لسنة 837هـ إحصاءً للحاكة في الإسكندرية ولقرى مصر، وتقارنه بما كان قبل ذلك. فكان في الإسكندرية ثمان مئة نول، وكان فيها في آخر القرن الثامن الهجري أربعة عشر ألف نول. الأرقام منقولة عن المصدر وحده، ويقول السجل إنه يحتاج إلى مصدر إضافي. ماذا تسأل عن هذه الأرقام؟
    en: The "Fragments of Gold" records for 837 AH a count of the weavers in Alexandria and of the villages of Egypt, and compares it with what had been before. There were eight hundred looms in Alexandria, where at the end of the eighth century AH there had been fourteen thousand. The figures are given on the source's own authority, and the record says an additional source is needed. What would you ask about these numbers?
    ur: «شذرات الذہب» 837ھ کی ایک مردم شماری کا ذکر کرتی ہے جو اسکندریہ میں کھڈیوں اور مصر کے دیہات کے بارے میں ہے، اور اسے پہلے کی حالت سے موازنہ کرتی ہے۔ اسکندریہ میں آٹھ سو کھڈیاں تھیں، جبکہ آٹھویں صدی ہجری کے آخر میں وہاں چودہ ہزار کھڈیاں تھیں۔ یہ اعداد صرف اسی ماخذ کی سند پر ہیں، اور اندراج کہتا ہے کہ ایک اضافی ماخذ درکار ہے۔ آپ ان اعداد کے بارے میں کیا پوچھیں گے؟
