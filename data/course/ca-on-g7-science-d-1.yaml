  title:
    en: Water for everyone, all year
    ar: ماء للناس طوال العام
    ur: سب کے لیے پانی، سال بھر
  text:
    en: A sabil is a charitable building endowed to give people fresh water every day all year round. Sabils received great care in their siting, building and decoration, and in the many endowments that kept them working. They drew water from wells, pools and springs, or from rain and floods through well-built channels or pipes hidden in walls. What would you weigh before building one?
    ar: السبيل بناء خيري يوقف لسقي الناس الماء العذب كل يوم وعلى مدار العام. وقد حظيت الأسبلة بعناية في اختيار مواقعها وعمارتها وزخرفتها، وفي الأوقاف الكثيرة التي وُقفت عليها لدوام منفعتها. وكانت تستمد ماءها من الآبار والبرك والعيون أو من الأمطار والسيول بقنوات محكمة أو أقصاب مغيبة في الجدران. فماذا ستزن قبل أن تبني واحداً؟
    ur: سبیل ایک رفاہی عمارت ہے جو لوگوں کو سال بھر ہر روز میٹھا پانی پلانے کے لیے وقف کی جاتی تھی۔ سبیلوں کی جگہ کے انتخاب، تعمیر اور آرائش میں، اور ان پر کیے گئے بہت سے اوقاف میں، جن سے ان کی افادیت جاری رہتی، بڑی توجہ دی گئی۔ وہ اپنا پانی کنوؤں، تالابوں اور چشموں سے، یا بارش اور سیلاب سے، مضبوط نالیوں یا دیواروں میں چھپی نلیوں کے ذریعے لیتی تھیں۔ کوئی سبیل بنانے سے پہلے آپ کیا کیا تولیں گے؟
