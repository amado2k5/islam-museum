  title:
    en: Ten kinds of land
    ar: عشرة أنواع من الأرض
    ur: زمین کی دس قسمیں
  text:
    en: Ibn Bassal gave ten practical land descriptions, among them soft, heavy, mountain and sandy land, and followed each name with observations about openings, cracking, water movement and suitable plants. He warned that the surface can differ from what lies beneath. These descriptions are not a modern laboratory standard. How would you examine the soil of your schoolyard beyond its surface?
    ar: ذكر ابن بصال عشرة أوصاف عملية للأرض، منها الأرض الرخوة والثقيلة والجبلية والرملية، وأتبع كل اسم بملاحظات عن المسامّ والتشقق ومرور الماء والنبات المناسب. وحذّر من أن ظاهر الأرض قد يخالف ما تحته. وليست هذه الأوصاف معيارًا مخبريًا حديثًا. كيف تفحص تربة ساحة مدرستك فحصًا يتجاوز ظاهرها؟
    ur: ابن بصال نے زمین کی دس عملی صفتیں بیان کیں، جن میں نرم، بھاری، پہاڑی اور ریتلی زمین شامل ہیں، اور ہر نام کے بعد مساموں، دراڑوں، پانی کے گزرنے اور موزوں پودوں کے بارے میں مشاہدات دیے۔ انہوں نے خبردار کیا کہ زمین کی سطح اس کے نیچے کی چیز سے مختلف ہو سکتی ہے۔ یہ بیانات جدید لیبارٹری معیار نہیں۔ آپ اپنے اسکول کے صحن کی مٹی کو اس کی سطح سے آگے کیسے پرکھیں گے؟
