- code: E1
  text:
    en: evaluate the impact on society and the environment of energy-transformation technologies, and propose ways to improve the sustainability of one such technology
    ar: قيِّم أثر تقنيات تحويل الطاقة في المجتمع والبيئة، واقترح سبلًا لتحسين استدامة إحدى هذه التقنيات
