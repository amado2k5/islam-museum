- position: after
  kind: object
  title:
    en: A book that expects to be improved
    ar: كتاب ينتظر من يزيد عليه
    ur: ایک کتاب جو بہتری کی منتظر ہے
  text:
    en: The Muqaddima is a book on the value of the science of history, the verification of its methods and the errors historians fall into. It treats human social organisation, group solidarity, the state, the caliphate, kingship, the crafts and the sciences. In its conclusion Ibn Khaldun says that whoever comes after him will dive deeper into its questions than he wrote. How would you test one of its ideas?
    ar: «المقدمة» كتاب في فضل علم التاريخ وتحقيق مذاهبه والاطلاع على ما يعرض للمؤرخين من المغالط، وهو في طبيعة العمران في الخليقة والعصبية والدولة والخلافة والملك والصنائع والعلوم. وفي خاتمته يقول ابن خلدون إن من يأتي بعده سيغوص من مسائله على أكثر مما كتب. كيف تختبر فكرة من أفكاره؟
    ur: «المقدمہ» تاریخ کے علم کی فضیلت، اس کے مناہج کی تحقیق اور مؤرخین کو پیش آنے والی غلطیوں کی نشاندہی پر کتاب ہے۔ اس میں انسانی تمدن کی فطرت، عصبیت، ریاست، خلافت، بادشاہت، ہنروں اور علوم کا بیان ہے۔ خاتمے میں ابن خلدون کہتے ہیں کہ ان کے بعد آنے والا ان مسائل میں ان کی لکھی ہوئی بات سے زیادہ گہرائی میں جائے گا۔ آپ ان کے کسی خیال کو کیسے پرکھیں گے؟
  entity: work/al-muqaddima
