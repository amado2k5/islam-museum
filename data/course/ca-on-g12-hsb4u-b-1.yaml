  kind: scholar
  title:
    en: The man who made society a subject of study
    ar: الرجل الذي جعل المجتمع موضوعًا للدرس
    ur: وہ شخص جس نے معاشرے کو مطالعے کا موضوع بنایا
  text:
    en: Ibn Khaldun, born in Tunis in 732 AH and died in 808 AH, wrote the Muqaddima and the Kitab al-Ibar. He opens the Muqaddima by calling history a noble art of many benefits, and he makes the subject of his new science umran, the necessary human association. If a society can be the subject of a science, what would that science try to explain?
    ar: ابن خلدون، ولد بتونس سنة 732هـ وتوفي سنة 808هـ، مؤلف «المقدمة» وكتاب «العبر». افتتح مقدمته بأن فن التاريخ عزيز المذهب كثير الفوائد، وجعل موضوع علمه الجديد «العمران»، أي الاجتماع الإنساني الضروري. إذا صار المجتمع موضوع علم، فماذا يحاول هذا العلم أن يفسّر؟
    ur: ابن خلدون سنہ 732ھ میں تونس میں پیدا ہوئے اور سنہ 808ھ میں وفات پائی؛ وہ «المقدمہ» اور «کتاب العبر» کے مؤلف ہیں۔ وہ اپنے مقدمے کا آغاز اس سے کرتے ہیں کہ تاریخ ایک باعزت فن ہے جس کے فوائد بہت ہیں، اور اپنے نئے علم کا موضوع «العمران» یعنی ناگزیر انسانی اجتماع ٹھہراتے ہیں۔ اگر معاشرہ کسی علم کا موضوع بن سکتا ہے تو وہ علم کیا سمجھانے کی کوشش کرے گا؟
  entity: person/ibn-khaldun
  sources:
  - source/muqaddima-ibn-khaldun
  - source/mawsuat-a3lam-ulama-adaba
- position: within
  kind: reflection
  title:
    en: The bond that holds a group together
    ar: الرابطة التي تُمسك الجماعة
    ur: وہ رشتہ جو گروہ کو جوڑے رکھتا ہے
  text:
    en: 'In Ibn Khaldun''s thought, asabiyya is the master key of his science of umran: a kin-solidarity in which genealogy itself is imaginary and its use lies in the bond. The record adds that he made it the key to understanding the rise and fall of states. Which bonds hold the groups of a society you study together, and which weaken over time?'
    ar: العصبية عند ابن خلدون مفتاح علمه في العمران، وهي التحام بالنسب، ويرى أن النسب نفسه أمر وهمي لا حقيقة له وأن نفعه إنما هو في هذه الوصلة. ويضيف السجل أنه جعلها مفتاح فهم قيام الدول وسقوطها. أي روابط تجمع الجماعات في مجتمع تدرسه، وأيها يضعف مع الزمن؟
    ur: 'ابن خلدون کے ہاں عصبیت ان کے علمِ عمران کی کنجی ہے: نسب کے ذریعے جڑنے کا وہ رشتہ جس میں نسب بذاتِ خود محض وہمی ہے اور اس کا فائدہ اسی تعلق میں ہے۔ ریکارڈ مزید بتاتا ہے کہ انہوں نے اسے ریاستوں کے قیام و زوال کو سمجھنے کی کنجی قرار دیا۔ آپ جس معاشرے کا مطالعہ کر رہے ہیں اس کے گروہوں کو کون سے رشتے جوڑے رکھتے ہیں، اور کون سے وقت کے ساتھ کمزور پڑتے ہیں؟'
