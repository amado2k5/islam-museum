connections:
- position: before
  kind: invention
  title:
    en: Restoring and cancelling
    ar: الجبر والمقابلة
    ur: جبر اور مقابلہ
  text:
    ar: الجبر فرع من الرياضيات يحل المسائل بفرض المجهول ومعالجة المعادلات بطرق عامة، ويذكر محققا طبعة القاهرة سنة 1939 لكتابه أن اسم هذا العلم في جميع لغات العالم مشتق من الكلمة العربية «الجبر» التي جعلها الخوارزمي اسماً لكتابه. و«الجبر» في مسائله أن يُكمل ما فيه نقص أو استثناء بزيادة مثله على الطرفين، و«المقابلة» أن يُلقى المتماثل من الطرفين. أيهما تستعمل حين توازن معادلة؟
    en: Algebra is the branch of mathematics that solves problems by positing an unknown and handling equations by general methods. The editors of the 1939 Cairo edition of his book note that the name of the science in every language comes from al-jabr, the word al-Khwarizmi used as the title of his book. In his problems al-jabr completes a quantity that has a deficiency by adding its like to both sides, and al-muqabala casts away like terms from both sides. Which of the two do you use when you balance an equation?
    ur: الجبرا ریاضی کی وہ شاخ ہے جو مجہول فرض کر کے اور مساوات کو عمومی طریقوں سے حل کر کے مسائل نکالتی ہے، اور قاہرہ کے 1939ء کے ایڈیشن کے محققین ان کی کتاب کے بارے میں لکھتے ہیں کہ اس علم کا نام ہر زبان میں عربی لفظ «الجبر» سے نکلا ہے جسے خوارزمی نے اپنی کتاب کا نام بنایا۔ ان کے مسائل میں «الجبر» یہ ہے کہ جس مقدار میں کمی یا استثنا ہو اسے دونوں طرف اس کا مثل بڑھا کر پورا کیا جائے، اور «المقابلہ» یہ ہے کہ دونوں طرف سے یکساں حدیں گرا دی جائیں۔ مساوات کو متوازن کرتے وقت آپ ان میں سے کون سا کرتے ہیں؟
