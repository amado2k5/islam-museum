  title:
    en: Six types of equation
    ar: ستة ضروب من المعادلات
    ur: مساواتوں کی چھ صورتیں
  text:
    ar: قسّم الخوارزمي كل ما يحتاج إليه في الجبر والمقابلة إلى ستة ضروب. من الضروب المفردة قوله «أربعة أجذار تعدل عشرين»، فالجذر خمسة والمال خمسة وعشرون. تحقّق من الجواب بوضعه في المعادلة.
    en: Al-Khwarizmi divided everything he needed in al-jabr and al-muqabala into six types. One simple type is "four roots equal twenty", so the root is five and the square twenty-five. Check the answer by putting it back in the equation.
    ur: خوارزمی نے جبر و مقابلہ کے حساب کی ہر ضرورت کو چھ صورتوں میں تقسیم کیا۔ مفرد صورتوں میں سے ایک «چار جذر بیس کے برابر ہیں» ہے، تو جذر پانچ اور مال پچیس۔ جواب کو مساوات میں رکھ کر جانچیں۔
