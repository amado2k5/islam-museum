  title:
    en: A Sufi singer's reach
    ar: أثر مغنية صوفية
    ur: ایک صوفی گلوکارہ کی پہنچ
  text:
    en: Abida Parveen is a Pakistani singer of Sufi music, born in 1954. The record says her breakthrough came on Radio Pakistan in 1973 with a Sindhi song, and that she sings ghazal, thumri, khayal, qawwali and above all kafi, in Urdu, Sindhi, Punjabi, Arabic and Persian. It adds that she has toured the world since 1993 and received the Nishan-e-Imtiaz, Pakistan's highest civil award, on 23 March 2021. What does the record show of the mark she has made on music, and what does it leave out?
    ar: عابدة پروين مغنية باكستانية للموسيقى الصوفية، وُلدت سنة 1954. يذكر السجل أن انطلاقتها كانت في إذاعة باكستان سنة 1973 بأغنية سندية، وأنها تغني الغزل والثمري والخيال والقوالي والكافي، وهو تخصصها، بالأردية والسندية والبنجابية والعربية والفارسية. ويضيف أنها جالت في العالم منذ 1993 ونالت نشان امتياز، أرفع وسام مدني في باكستان، في 23 مارس 2021. ماذا يُظهر السجل من أثرها في الموسيقى، وماذا يترك؟
    ur: عابدہ پروین پاکستانی صوفی موسیقی کی گلوکارہ ہیں، 1954 میں پیدا ہوئیں۔ ریکارڈ کے مطابق ان کی کامیابی کا آغاز 1973 میں ریڈیو پاکستان پر ایک سندھی گیت سے ہوا، اور وہ غزل، ٹھمری، خیال، قوالی اور سب سے بڑھ کر کافی اردو، سندھی، پنجابی، عربی اور فارسی میں گاتی ہیں۔ ریکارڈ مزید بتاتا ہے کہ وہ 1993 سے دنیا بھر میں دورے کر چکی ہیں اور 23 مارچ 2021 کو انہیں پاکستان کا اعلیٰ ترین سول اعزاز نشانِ امتیاز ملا۔ ریکارڈ ان کے موسیقی پر اثر کے بارے میں کیا دکھاتا ہے، اور کیا چھوڑ دیتا ہے؟
