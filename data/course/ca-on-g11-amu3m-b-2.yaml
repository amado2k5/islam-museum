  title:
    en: A musician of Baghdad, Kairouan and Cordoba
    ar: موسيقي بغداد والقيروان وقرطبة
    ur: بغداد، قیروان اور قرطبہ کا موسیقار
  text:
    en: The record on Ziryab, a musician associated with Baghdad, Kairouan and Cordoba, says that accounts attribute singing instruction and oud refinements to him. The TDV entry it cites describes his training under Ibrahim and Ishaq al-Mawsili. The record adds that his wider portrait needs older reports separated from later idealization. Which of his contributions can you name with confidence, and which only as attributed?
    ar: تذكر صفحة زرياب، وهو موسيقي ارتبط ببغداد والقيروان وقرطبة، أن الروايات تنسب إليه تعليم الغناء وتحسين العود. وتذكر موسوعة الإسلام التي تستند إليها تعلمه على إبراهيم الموصلي وإسحاق، وتضيف أن صورته الواسعة تحتاج إلى فصل الأخبار القديمة عن السيرة المثالية المتأخرة. أي إسهاماته تستطيع أن تسميها بثقة، وأيها منسوب فحسب؟
    ur: زریاب پر ریکارڈ، جو بغداد، قیروان اور قرطبہ سے وابستہ ایک موسیقار تھا، بتاتا ہے کہ روایات اس سے گانے کی تعلیم اور عود کی اصلاحات منسوب کرتی ہیں۔ جس TDV مضمون پر ریکارڈ مبنی ہے وہ ابراہیم اور اسحاق الموصلی کے ہاں اس کی تربیت بیان کرتا ہے۔ ریکارڈ یہ بھی کہتا ہے کہ اس کی وسیع تصویر میں پرانی خبروں کو بعد کی آئیڈیل بنائی ہوئی سیرت سے الگ کرنا پڑتا ہے۔ اس کی کون سی خدمات آپ اعتماد سے بتا سکتے ہیں اور کون سی صرف منسوب ہیں؟
