connections:
- position: before
  kind: career
  title:
    en: An engineer at a royal court
    ar: مهندس في بلاط أمير
    ur: ایک امیر کے دربار کا انجینئر
  text:
    en: Al-Jazari was an engineer who wrote a book on mechanical devices. TDV records that he served the Artuqids at Amid between 1181 and 1206 and that his book was commissioned by Nasir al-Din Mahmud. Its six divisions cover clocks, vessels for drinking and banquets, vessels for hand washing, fountains and automatic musical instruments, water-raising machines and miscellaneous devices. What problem would each kind of device solve for the people who used it?
    ar: كان الجزري مهندسًا ألّف كتابًا في الآلات الميكانيكية. تذكر موسوعة TDV أنه خدم الأرتقيين في آمد بين 1181 و1206م، وأن كتابه ألّفه بطلب من ناصر الدين محمود. وللكتاب ستة أقسام تشمل الساعات، وأواني الشرب والمآدب، وأواني غسل اليدين، والنوافير والآلات الموسيقية الآلية، وآلات رفع الماء، والآلات المتفرقة. أي مشكلة كان كل نوع من هذه الآلات يحلّها لمن يستعمله؟
    ur: 'جزری ایک انجینئر تھا جس نے میکانی آلات پر کتاب لکھی۔ ٹی ڈی وی انسائیکلوپیڈیا کے مطابق اس نے 1181 سے 1206 عیسوی تک آمد میں ارتقی حکمرانوں کی خدمت کی اور اس کی کتاب ناصر الدین محمود کی فرمائش پر لکھی گئی۔ کتاب کے چھ حصے ہیں: گھڑیاں، مشروب اور ضیافت کے برتن، ہاتھ دھونے کے برتن، فوارے اور خودکار موسیقی کے آلات، پانی اٹھانے کی مشینیں، اور متفرق آلات۔ ان میں سے ہر قسم استعمال کرنے والوں کے لیے کون سا مسئلہ حل کرتی تھی؟'
  entity: person/al-jazari-engineer
  sources:
  - source/tdv-cezeri
- position: after
  kind: scholar
  title:
    en: A book on light that mattered
    ar: كتاب في الضوء كان له شأن
    ur: روشنی پر ایک اہم کتاب
  text:
    en: Ibn al-Haytham was an Arab mathematician and physicist. The editor of the Kitab al-Manazir, the Book of Optics, calls it the principal optical work of the Islamic world, places him in the fifth century AH and judges it the most valuable thing Arab scholars produced in physics. The museum also records his dark-room test of how light travels. Whose contributions to science does your own class know, and where would you find them?
    ar: كان ابن الهيثم عالمًا عربيًا في الرياضيات والفيزياء. ويرى محقق «كتاب المناظر» أنه المصنَّف الرئيس في البصريات في العالم الإسلامي، ويضع ابن الهيثم في القرن الخامس الهجري، ويحكم بأنه أنفس ما أنتجه علماء العرب في الفيزياء. ويسجّل المتحف أيضًا تجربته في البيت المظلم لمعرفة كيف ينتقل الضوء. فمن أصحاب الإسهامات في العلوم يعرف صفّك، وأين تجد أخبارهم؟
    ur: ابن الہیثم ریاضی اور طبیعیات کا عرب عالم تھا۔ «کتاب المناظر» کا مدیر اسے اسلامی دنیا میں بصریات کا بنیادی کام کہتا ہے، ابن الہیثم کو پانچویں صدی ہجری میں رکھتا ہے اور کتاب کو طبیعیات میں عرب علما کی سب سے قیمتی پیداوار قرار دیتا ہے۔ عجائب گھر تاریک کمرے میں اس کا وہ تجربہ بھی درج کرتا ہے جس سے روشنی کے سفر کو پرکھا گیا۔ آپ کی جماعت سائنس میں اور کن لوگوں کی خدمات جانتی ہے، اور ان کا ذکر کہاں ملے گا؟
  entity: person/ibn-al-haytham
