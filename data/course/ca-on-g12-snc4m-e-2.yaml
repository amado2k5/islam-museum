label:
  en: Protecting the public from epidemic disease
  ar: حماية الناس من الأوبئة
  ur: وبائی امراض سے عوام کا تحفظ
summary:
  en: 'Measures the museum''s records describe for protecting the public from epidemic disease: the instruction at Sargh, the saying on entering and leaving, and the confinement of lepers in a caliph''s hospital (E3.5).'
  ar: 'تدابير تصفها سجلات المتحف لحماية الناس من الأوبئة: ما جرى في سرغ، والتوجيه في الدخول والخروج، وحبس المجذومين في بيمارستان خليفة ⁦(E3.5)⁩.'
  ur: 'وہ اقدامات جو میوزیم کے ریکارڈ وبائی امراض سے عوام کے تحفظ کے لیے بیان کرتے ہیں: سرغ کا واقعہ، داخل ہونے اور نکلنے کی ہدایت، اور ایک خلیفہ کے شفاخانے میں جذام کے مریضوں کو روکے رکھنا ⁦(E3.5)⁩۔'
