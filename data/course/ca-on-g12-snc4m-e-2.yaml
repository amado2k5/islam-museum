connections:
- position: before
  kind: hadith
  title:
    en: Umar turns back at Sargh
    ar: عمر يرجع من سرغ
    ur: عمر سرغ سے لوٹ آتے ہیں
  text:
    en: Malik transmits that Umar set out for Syria, and at Sargh the commanders, Abu Ubayda ibn al-Jarrah and his companions, told him that the plague had broken out there. Umar consulted the emigrants and the Ansar, who disagreed, then the elders of Quraysh, who agreed to return. Abd al-Rahman ibn Awf then reported what he had heard. What measure is decided here?
    ar: يروي مالك أن عمر بن الخطاب خرج إلى الشام، حتى إذا كان بسرغ لقيه أمراء الأجناد أبو عبيدة بن الجراح وأصحابه، فأخبروه أن الوباء قد وقع بالشام. فاستشار المهاجرين والأنصار فاختلفوا، ثم مشيخة قريش فاتفقوا على الرجوع. ثم جاء عبد الرحمن بن عوف فروى ما سمعه. أي تدبير يُتخذ هنا؟
    ur: مالک روایت کرتے ہیں کہ عمر شام کی طرف نکلے، اور سرغ میں ابوعبیدہ بن الجراح اور ساتھی امرا نے انہیں بتایا کہ وہاں وبا پھیل گئی ہے۔ عمر نے مہاجرین اور انصار سے مشورہ کیا تو انہوں نے اختلاف کیا، پھر قریش کے بزرگوں سے، تو وہ لوٹنے پر متفق ہوئے۔ پھر عبدالرحمن بن عوف نے وہ بات بیان کی جو انہوں نے سنی تھی۔ یہاں کون سا اقدام طے ہو رہا ہے؟
  entity: passage/muwatta-31-2611
  sources:
