- position: within
  kind: reflection
  title:
    en: Do not flee it, do not enter it
    ar: لا تخرجوا فرارًا ولا تدخلوا
    ur: نہ بھاگیں، نہ داخل ہوں
  text:
    en: 'The record defines epidemic disease as the general disease spreading through a land. It gives the Prophet''s saying: if it falls in a land you are in, do not flee it, and do not enter it. Who is bound by this instruction, and who is protected by it?'
    ar: 'يعرّف السجل الوباء بأنه المرض العام الذي يفشو في الأرض. ويورد قول النبي: إذا وقع بأرض وأنتم بها فلا تخرجوا فرارًا منه ولا تدخلوا عليها. على من يسري هذا التوجيه، ومن يحميه؟'
    ur: 'ریکارڈ وبا کو وہ عام بیماری بتاتا ہے جو کسی سرزمین میں پھیل جائے۔ وہ نبی کا یہ ارشاد دیتا ہے: اگر وہ کسی سرزمین میں پڑ جائے اور تم اس میں ہو تو اس سے بھاگ کر نہ نکلو، اور اس میں داخل نہ ہو۔ یہ ہدایت کس پر لاگو ہوتی ہے، اور کسے بچاتی ہے؟'
  entity: concept/al-waba
  sources:
  - source/sahih-al-bukhari
  - source/sahih-muslim
- position: after
  kind: invention
  title:
    en: A hospital and the confinement of lepers
    ar: بيمارستان وحبس المجذومين
    ur: شفاخانہ اور جذامیوں کو روکے رکھنا
  text:
    en: Al-Maqrizi says that the first to build a maristan, a house for the sick, in Islam was al-Walid ibn Abd al-Malik, in 88 AH. He placed physicians in it on paid allowances, ordered the lepers confined so that they would not go out, and gave allowances to them and to the blind. The record notes that the claim to be first is disputed. Al-Maqrizi reports the confinement; the museum does not assess it. What does confinement protect, and what does it cost?
    ar: 'ينقل المقريزي أن الوليد بن عبد الملك بنى سنة 88هـ داراً للمرضى، وقال إنه أول من بنى المارستان في الإسلام: جعل فيها الأطباء وأجرى عليهم الأرزاق، وأمر بحبس المجذومين لئلا يخرجوا، وأجرى عليهم وعلى العميان الأرزاق. ويذكر السجل أن الأولية موضع خلاف. ينقل المقريزي الحبس ولا يقيّمه المتحف. ماذا يحمي الحبس، وما كلفته؟'
    ur: 'المقریزی کہتے ہیں کہ اسلام میں مارستان، یعنی مریضوں کا گھر، بنانے والے پہلے شخص ولید بن عبدالملک تھے، 88 ہجری میں: اس میں معالج رکھے اور ان کے وظیفے مقرر کیے، جذامیوں کو باہر نکلنے سے روکے رکھنے کا حکم دیا، اور انہیں اور نابینوں کو وظیفے دیے۔ ریکارڈ بتاتا ہے کہ اولیت کا دعویٰ متنازع ہے۔ المقریزی روکے رکھنے کو نقل کرتے ہیں؛ میوزیم اس کا جائزہ نہیں لیتا۔ روکے رکھنے سے کس کی حفاظت ہوتی ہے، اور اس کی قیمت کیا ہے؟'
