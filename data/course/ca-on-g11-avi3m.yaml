summary:
  en: 'The Ontario Grade 11 course AVI3M: three strands, creating and presenting, reflecting and analysing, and foundations. The museum maps nine of the expectations through Islamic examples only: materials and tools, display, the work art does, the society behind it, careers, pattern and technique.'
  ar: 'مقرر AVI3M للصف الحادي عشر في أونتاريو: ثلاثة محاور هي الإبداع والعرض، والتأمل والتحليل، والأسس. ويربط المتحف تسعًا من التوقعات بأمثلة إسلامية فقط: المواد والأدوات، والعرض، ووظيفة الفن، والمجتمع الذي وراءه، والمهن، والزخرفة والتقنية.'
  ur: 'اونٹاریو کا کورس AVI3M برائے جماعت یازدہم: تین شاخیں، تخلیق و پیشکش، غور و تجزیہ، اور بنیادیں۔ عجائب گھر نو توقعات کو جوڑتا ہے، صرف اسلامی مثالوں سے: مواد اور اوزار، نمائش، فن کا کام، اس کے پیچھے معاشرہ، پیشے، اور نقش و تکنیک۔'
