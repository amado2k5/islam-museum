  kind: invention
  title:
    en: A tank that keeps its level
    ar: خزان يحفظ مستواه
    ur: ایک ٹنکی جو اپنی سطح برقرار رکھتی ہے
  text:
    en: 'In the record on al-Jazari''s castle clock, a float in a reservoir descends as the water falls and passes its movement on through ropes and pulleys. A falling level in an unregulated tank changes the conditions under which the water leaves, so another chamber has its own float and a conical plug: rising water closes the inlet, falling water lets more in, and the level stays approximately steady. What decides how fast water leaves a tank?'
    ar: 'في سجل ساعة القلعة عند الجزري عوامة في خزان تنخفض مع انخفاض الماء وتنقل حركتها بالحبال والبكرات. لكن انخفاض منسوب خزان غير منظم يغير شروط خروج الماء، ولهذا توجد حجرة أخرى ذات عوامة وسدادة مخروطية: عندما يرتفع الماء تسد الوارد، وعندما ينقص تسمح بالمزيد، فيبقى مستواها مضبوطًا تقريبًا. ما الذي يحدد سرعة خروج الماء من خزان؟'
    ur: 'جزری کی قلعہ نما گھڑی کے ریکارڈ میں ٹنکی کے اندر ایک تیرنے والا پرزہ پانی گرنے کے ساتھ نیچے آتا ہے اور اپنی حرکت رسیوں اور چرخیوں کے ذریعے آگے پہنچاتا ہے۔ بغیر ضابطے والی ٹنکی میں سطح گرنے سے پانی کے نکلنے کے حالات بدل جاتے ہیں، اس لیے ایک اور خانہ ہے جس میں اپنا تیرنے والا پرزہ اور مخروطی ڈاٹ ہے: پانی چڑھے تو آمد بند کرتی ہے، گھٹے تو مزید آنے دیتی ہے، اور سطح تقریباً قائم رہتی ہے۔ ٹنکی سے پانی کے نکلنے کی رفتار کیا طے کرتا ہے؟'
  entity: invention/jazari-castle-clock
  sources:
