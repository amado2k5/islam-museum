- position: after
  kind: invention
  title:
    en: The blood's route through the lungs
    ar: طريق الدم عبر الرئتين
    ur: خون کا پھیپھڑوں سے گزرنے کا راستہ
  text:
    en: The record defines the pulmonary circulation as the blood's route from the right side of the heart to the lungs, and from the lungs to the left side. It says that Ibn al-Nafis wrote, against Galen, that blood does not cross the wall between the ventricles through pores, because that wall is solid, and that it reaches the left ventricle from the lung. Where, in a body or in a machine, must a fluid be made to take one route and not another?
    ar: يعرّف السجل الدورة الدموية الرئوية بأنها طريق الدم من الجانب الأيمن للقلب إلى الرئة، ثم منها إلى الجانب الأيسر. ويقول إن ابن النفيس نفى، خلافًا لجالينوس، أن يعبر الدم الحاجز بين البطينين من مسامّ، لأن ذلك الحاجز مصمت، وقال إن الدم يدخل البطين الأيسر من الرئة. أين يجب، في جسم أو في آلة، أن يُحمل مائع على طريق دون آخر؟
    ur: ریکارڈ پھیپھڑوں کی دورانِ خون کو خون کا دل کے دائیں حصے سے پھیپھڑوں تک اور پھیپھڑوں سے بائیں حصے تک کا راستہ قرار دیتا ہے۔ وہ بتاتا ہے کہ ابن النفیس نے جالینوس کے برخلاف لکھا کہ خون بطینوں کے درمیان کی دیوار کے مساموں سے نہیں گزرتا کیونکہ وہ دیوار ٹھوس ہے، اور وہ بائیں بطین میں پھیپھڑے سے پہنچتا ہے۔ جسم میں یا مشین میں، کہاں سیال کو ایک راستے پر چلانا اور دوسرے پر نہیں چلانا پڑتا ہے؟
  entity: invention/pulmonary-circulation
