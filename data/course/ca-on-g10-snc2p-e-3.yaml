  title:
    en: A raindrop in a glass sphere
    ar: قطرة مطر في كرة زجاجية
    ur: شیشے کے گولے میں بارش کی بوند
  text:
    en: Kamal al-Din al-Farisi replaced a tiny raindrop with a glass sphere filled with water, to study the path of light in a model he could control. The record, following Russell, describes his explanation of the primary rainbow by two refractions with one internal reflection between them, and of the secondary bow by two internal reflections, and adds that this was not a successful modern physical theory of colour. Where does the light bend in this path?
    ar: استبدل كمال الدين الفارسي بالقطرة الصغيرة كرة زجاجية مملوءة بالماء، ليدرس مسار الضوء في نموذج يمكن التحكم فيه. وتعرض رسل، بحسب السجل، شرحه للقوس الأساسي بانكسارين بينهما انعكاس داخلي واحد، وللثانوي بانعكاسين بين الانكسارين، ويضيف السجل أن ذلك لم يكن نظرية حديثة صحيحة لفيزياء اللون. أين ينكسر الضوء في هذا المسار؟
    ur: کمال الدین فارسی نے بارش کی چھوٹی بوند کی جگہ پانی سے بھرا شیشے کا گولا لیا، تاکہ روشنی کے راستے کو ایسے نمونے میں پرکھے جس پر قابو ہو۔ ریکارڈ، رسل کے حوالے سے، بنیادی قوسِ قزح کی اس کی وضاحت دو انعطافوں اور ان کے بیچ ایک اندرونی انعکاس سے، اور ثانوی کی وضاحت دو اندرونی انعکاسوں سے بتاتا ہے، اور اضافہ کرتا ہے کہ یہ رنگ کی طبیعیات کی کوئی درست جدید نظریہ نہیں تھا۔ اس راستے میں روشنی کہاں مڑتی ہے؟
