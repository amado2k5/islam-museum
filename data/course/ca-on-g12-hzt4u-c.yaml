expectations:
- code: C1
  text:
    en: demonstrate an understanding of the main questions in metaphysics, and of the positions of major philosophers and schools of philosophy with respect to some of these questions
    ar: أظهر فهمًا للأسئلة الرئيسة في الميتافيزيقا، ولمواقف كبار الفلاسفة والمدارس الفلسفية من بعض هذه الأسئلة
    ur: مابعدالطبیعیات کے بنیادی سوالات اور ان میں سے بعض کے بارے میں بڑے فلسفیوں اور فلسفیانہ مکاتبِ فکر کے مؤقف کی فہم کا مظاہرہ کریں
- code: C2
  text:
    en: demonstrate an understanding of metaphysical theories, and evaluate responses to some of the main questions in metaphysics by major philosophers and schools of philosophy
    ar: أظهر فهمًا للنظريات الميتافيزيقية، وقيّم إجابات كبار الفلاسفة والمدارس الفلسفية عن بعض الأسئلة الرئيسة في الميتافيزيقا
    ur: مابعدالطبیعیاتی نظریات کی فہم کا مظاہرہ کریں، اور مابعدالطبیعیات کے بعض بنیادی سوالات پر بڑے فلسفیوں اور فلسفیانہ مکاتبِ فکر کے جوابات کا جائزہ لیں
- code: C3
  text:
    en: demonstrate an understanding of connections between metaphysics and other areas of philosophy, other subject areas, and various aspects of society, including everyday life
    ar: أظهر فهمًا للصلات بين الميتافيزيقا وسائر مجالات الفلسفة والمواد الدراسية الأخرى ومختلف جوانب المجتمع، ومنها الحياة اليومية
    ur: مابعدالطبیعیات اور فلسفے کے دیگر شعبوں، دیگر مضامین اور معاشرے کے مختلف پہلوؤں، بشمول روزمرہ زندگی، کے درمیان روابط کی فہم کا مظاہرہ کریں
- code: C4
  text:
    en: use philosophical reasoning skills to develop, communicate, and defend their own responses to metaphysical questions
    ar: استخدم مهارات الاستدلال الفلسفي لتطوير إجاباتك الخاصة عن الأسئلة في الميتافيزيقا والتعبير عنها والدفاع عنها
    ur: فلسفیانہ استدلال کی مہارتیں برت کر مابعدالطبیعیات کے سوالات پر اپنے جوابات تشکیل دیں، بیان کریں اور ان کا دفاع کریں
