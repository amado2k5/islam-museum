  title:
    en: Arranged, lent and toured
    ar: ترتيب وإعارة وتطواف
    ur: ترتیب، اعارہ اور سفر
  text:
    en: The Museum of Islamic Art in Doha shows Islamic art from three continents over 1,400 years. It reopened in October 2022 with eighteen renovated galleries arranged by era and region. It lent four objects to the first Islamic Arts Biennale in Jeddah in 2023, and it has travelling exhibitions, among them one at the National Museum of Korea. For whom is each of these ways of showing meant?
    ar: يعرض متحف الفن الإسلامي في الدوحة فنونًا إسلامية من ثلاث قارات على مدى 1,400 سنة. وقد أُعيد افتتاحه في أكتوبر 2022م بثماني عشرة قاعة مجددة مرتبة بحسب العصور والمناطق، وأعار أربع قطع إلى الدورة الأولى من بينالي الفنون الإسلامية في جدة سنة 2023م، وله معارض متنقلة منها معرض في المتحف الوطني الكوري. لمن تُعدّ كل طريقة من طرق العرض هذه؟
    ur: دوحہ کا عجائب گھر اسلامی فن تین براعظموں سے چودہ سو سال کے اسلامی فن کی نمائش کرتا ہے۔ وہ اکتوبر 2022ء میں اٹھارہ تجدید شدہ قاعات کے ساتھ دوبارہ کھلا جو عہد اور خطے کے مطابق ترتیب دیے گئے ہیں؛ اس نے 2023ء میں جدہ کے پہلے اسلامی فنون بینالے کو چار اشیا مستعار دیں، اور اس کی سفری نمائشیں بھی ہیں، جن میں کوریا کے قومی عجائب گھر کی ایک نمائش شامل ہے۔ نمائش کے ان طریقوں میں سے ہر ایک کس کے لیے ہے؟
