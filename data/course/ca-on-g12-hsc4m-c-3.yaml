  title:
    en: Illumination on the move
    ar: التذهيب في رحلته
    ur: تذہیب کا سفر
  text:
    en: Norah Titley traces illumination to the decoration of vowel marks and verse-dividing circles in Qur’ans written by Arab calligraphers in the seventh and eighth centuries. Artists of Iran, Turkey, India and Kashmir added their own characteristics to the arabesque, an originally Arab art, and she notes that Tabriz work passed to India under Humayun and to Istanbul after 1514. What travelled, and what did each place add?
    ar: تردّ نورا تيتلي أصل التذهيب إلى زخرفة علامات الشكل والدوائر الفاصلة بين الآيات في المصاحف التي كتبها الخطاطون العرب في القرنين السابع والثامن. وأضاف فنانو إيران وتركيا والهند وكشمير خصائصهم إلى التوريق، وهو فن عربي الأصل، وتذكر أن فن تبريز انتقل إلى الهند في عهد همايون وإلى إستانبول بعد سنة 1514م. ماذا انتقل، وماذا أضاف كل مكان؟
    ur: نورا ٹائٹلی مخطوطات کی تذہیب کی اصل ساتویں اور آٹھویں صدی کے ان قرآنی نسخوں کی آرائش میں بتاتی ہیں جو عرب خطاطوں نے لکھے، یعنی اعراب کی علامتوں اور آیات کے درمیان دائروں کی آرائش۔ ایران، ترکی، ہندوستان اور کشمیر کے فنکاروں نے توریق، جو عربی الاصل فن ہے، میں اپنی خصوصیات شامل کیں، اور وہ لکھتی ہیں کہ تبریز کا فن ہمایوں کے دور میں ہندوستان اور 1514ء کے بعد استنبول پہنچا۔ کیا کیا منتقل ہوا، اور ہر جگہ نے کیا اضافہ کیا؟
