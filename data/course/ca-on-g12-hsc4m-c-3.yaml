  title:
    en: Coffee comes to Damascus
    ar: القهوة تصل إلى دمشق
    ur: قہوہ دمشق پہنچتا ہے
  text:
    en: Ibn al-Imad al-Hanbali, in Shadharat al-dhahab, reports that coffee appeared in Damascus about twelve years before the ban, when Shaykh Sa’d al-Din ibn Iraq made its drinking known during his stay there, and its shops multiplied from then. He names the judge of Damascus, Shams al-Din Muhammad ibn Abd al-Awwal, who with Shaykh Qutb al-Din ibn Sultan and Shaykh Yunus al-Aythawi held it forbidden, and a sultanic order abolished it in Shawwal 953 AH. He adds that the matter later settled on permission. What can the welcome and the ban of a drink tell us about a culture?
    ar: يذكر ابن العماد الحنبلي في «شذرات الذهب» أن القهوة ظهرت في دمشق قبل نحو اثنتي عشرة سنة من المنع، حين أشاع الشيخ سعد الدين بن عراق شربها أثناء إقامته بها، وكثرت حوانيتها من حينها. ويسمّي قاضي دمشق شمس الدين محمد بن عبد الأول، وقد وافق الشيخين قطب الدين بن سلطان ويونس العيثاوي في القول بتحريمها، وورد أمر سلطاني بإبطالها في شوال سنة 953هـ. ويضيف أن الأمر استقر لاحقًا على الإباحة. ماذا يخبرنا استقبال مشروب ومنعه عن ثقافة ما؟
    ur: ابن العماد حنبلی «شذرات الذہب» میں لکھتے ہیں کہ دمشق میں قہوہ پابندی سے تقریباً بارہ سال پہلے ظاہر ہوا، جب شیخ سعد الدین بن عراق نے وہاں اپنے قیام کے دوران اس کا پینا مشہور کیا، اور تب سے اس کی دکانیں بڑھتی گئیں۔ وہ دمشق کے قاضی شمس الدین محمد بن عبدالاول کا نام لیتے ہیں جنہوں نے شیخ قطب الدین بن سلطان اور شیخ یونس عیثاوی کے ساتھ اسے حرام قرار دیا، اور شوال سنہ 953ھ میں سلطانی حکم نے اسے ممنوع کر دیا۔ وہ مزید لکھتے ہیں کہ معاملہ بعد میں اجازت پر ٹھہرا۔ کسی مشروب کا خیرمقدم اور اس پر پابندی ہمیں کسی ثقافت کے بارے میں کیا بتاتی ہے؟
