    ur: 'یومنز کے خیال میں نباتی عربیسک تجریدی اور سپاٹ یعنی دو جہتی ہے اور سطح کا احترام کرتا ہے۔ آپ ڈرائنگ میں کیا بدلیں گے کہ وہ اپنی سطح کا احترام کرے؟'
