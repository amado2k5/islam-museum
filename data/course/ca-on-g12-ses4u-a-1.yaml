- position: within
  kind: invention
  title:
    en: Measuring the Earth from a mountain
    ar: قياس الأرض من جبل
    ur: پہاڑ سے زمین کی پیمائش
  text:
    en: In the Tahdid, composed in 416 AH/1025 CE, al-Biruni sets out a method that joins a mountain's known height, the dip of the horizon and the geometry of the tangent, then reports applying it near the fort of Nandana. What is documented is an explanation, a proof and a numerical application, and the book keeps an earlier account by Sanad ibn Ali. What can one reading from a summit say about the whole Earth?
    ar: عرض البيروني في «تحديد نهايات الأماكن لتصحيح مسافات المساكن»، المؤلف سنة 416هـ/1025م، طريقة تجمع ارتفاعاً معلوماً للجبل وزاوية انخفاض الأفق وهندسة المماس، ثم روى تطبيقها قرب حصن نندنة. والمساهمة الموثقة شرح وبرهان وتطبيق عددي، والكتاب نفسه يحفظ رواية أقدم عن سنَد بن علي. ماذا يكشف قياس واحد من قمة جبل عن الأرض كلها؟
    ur: بیرونی نے «تحدید نہایات الاماکن لتصحیح مسافات المساکن» میں، جو 416ھ/1025ء میں لکھی گئی، معلوم اونچائی کے پہاڑ، افق کے جھکاؤ اور مماس کے ہندسے کو ملانے کا طریقہ بیان کیا، پھر قلعۂ نندنہ کے پاس اس کے استعمال کی خبر دی۔ مستند حصہ توضیح، برہان اور عددی اطلاق ہے، اور اسی کتاب میں سند بن علی کا پہلے کا بیان محفوظ ہے۔ پہاڑ کی چوٹی کا ایک ناپ پوری زمین کے بارے میں کیا بتاتا ہے؟
