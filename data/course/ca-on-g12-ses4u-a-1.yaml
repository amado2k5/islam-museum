  title:
    en: Al-Biruni, astronomer and geographer
    ar: البيروني عالم الفلك والجغرافيا
    ur: بیرونی، ماہرِ فلکیات و جغرافیہ
  text:
    en: The reference works Mawsu'at A'lam al-Ulama' wa-l-Adaba' and Hajji Khalifa's Kashf al-Zunun describe Abu al-Rayhan Muhammad ibn Ahmad al-Biruni as one of the great astronomers, mathematicians, geographers and historians of his age, born on the outskirts of Khwarazm (Kath) in 362 AH (973 CE). Back from India he settled at the Ghaznavid court and dedicated al-Qanun al-Mas'udi on astronomy to the sultan Mas'ud. In which fields did he work?
    ar: تصف «موسوعة أعلام العلماء والأدباء العرب والمسلمين» و«كشف الظنون» لحاجي خليفة أبا الريحان محمد بن أحمد البيروني بأنه من كبار علماء الفلك والرياضيات والجغرافيا والتاريخ في عصره، ولد في ضواحي مدينة خوارزم ⁦(كاث)⁩ سنة 362هـ ⁦(973م)⁩. ولما عاد من الهند استقر في البلاط الغزنوي، وأهدى إلى السلطان مسعود «القانون المسعودي» في الهيئة والنجوم. في أي ميادين عمل؟
    ur: «موسوعۃ اعلام العلماء والادباء العرب والمسلمین» اور حاجی خلیفہ کی «کشف الظنون» ابو ریحان محمد بن احمد بیرونی کو اپنے دور کے بڑے فلکیات دان، ریاضی دان، جغرافیہ دان اور مورخ بتاتی ہیں؛ وہ خوارزم ⁦(کاث)⁩ کے نواح میں 362ھ ⁦(973ء)⁩ میں پیدا ہوئے۔ ہندوستان سے واپس آ کر وہ غزنوی دربار میں مقیم ہوئے اور ہیئت پر «القانون المسعودی» سلطان مسعود کے نام معنون کی۔ انہوں نے کن شعبوں میں کام کیا؟
