- position: after
  kind: story
  title:
    en: An eclipse as people saw it
    ar: كسوف كما رآه الناس
    ur: ایک گرہن جیسا لوگوں نے دیکھا
  text:
    en: Ibn al-Imad relates in Shadharat al-Dhahab that the sun was eclipsed in a great eclipse on the eighteenth of Shawwal 836 AH, from after the afternoon prayer to near sunset. The people performed the eclipse prayer and thought the sun had set eclipsed, until it cleared shortly before that. Which of the causes you have studied explains what they saw?
    ar: يذكر ابن العماد في «شذرات الذهب» أن الشمس كسفت كسوفًا عظيمًا في الثامن عشر من شوال سنة 836هـ، من بعد العصر إلى قرب المغرب. وصلّى الناس صلاة الكسوف، وظنوا أن الشمس غربت كاسفة، ثم انجلت قبيل ذلك. أي الأسباب التي درستها تفسّر ما رأوه؟
    ur: ابن العماد «شذرات الذہب» میں بیان کرتے ہیں کہ 18 شوال 836ھ کو سورج کو بڑا گرہن لگا، عصر کے بعد سے غروب کے قریب تک۔ لوگوں نے کسوف کی نماز پڑھی اور سمجھا کہ سورج گرہن کی حالت میں غروب ہو گیا، پھر وہ اس سے ذرا پہلے صاف ہو گیا۔ آپ نے جو اسباب پڑھے ہیں ان میں سے کون سا اس کی وضاحت کرتا ہے جو انہوں نے دیکھا؟
  entity: event/solar-eclipse-836
