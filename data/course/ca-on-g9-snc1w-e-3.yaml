  title:
    en: Conjunction, opposition and the earth's shadow
    ar: الاجتماع والمقابلة وظل الأرض
    ur: اجتماع، مقابلہ اور زمین کا سایہ
  text:
    en: For al-Farghani, a solar eclipse is the moon's passing between the sun and the earth at conjunction, and a lunar eclipse is the moon's entering the earth's shadow at opposition. He adds that parallax changes what is seen, so an eclipse may appear partial from one place and total from another. What positions of sun, moon and earth does each case need?
    ar: الكسوف عند الفرغاني اعتراض القمر بين الشمس والأرض عند الاجتماع، والخسوف دخول القمر ظل الأرض عند المقابلة. ويضيف أن اختلاف المنظر يغيّر ما يُرى، فقد يبدو الكسوف جزئيًا من موضع وكليًا من موضع آخر. ما أوضاع الشمس والقمر والأرض التي تحتاجها كل حالة؟
    ur: الفرغانی کے نزدیک سورج گرہن چاند کا اجتماع کے وقت سورج اور زمین کے درمیان آ جانا ہے، اور چاند گرہن چاند کا مقابلے کے وقت زمین کے سائے میں داخل ہونا ہے۔ وہ مزید کہتا ہے کہ اختلافِ منظر سے جو دکھائی دیتا ہے بدل جاتا ہے، اس لیے ایک گرہن ایک جگہ سے جزوی اور دوسری جگہ سے کلی نظر آ سکتا ہے۔ ہر صورت کے لیے سورج، چاند اور زمین کے کون سے مقام ضروری ہیں؟
