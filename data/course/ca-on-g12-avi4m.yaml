summary:
  en: 'The Ontario Grade 12 university/college-preparation course Visual Arts has three strands: creating and presenting, reflecting, responding and analysing, and foundations. The museum maps two of them, through records of buildings, an event, a concept of images and an art form.'
  ar: 'مقرر «الفنون البصرية» للصف الثاني عشر الجامعي/الكلّياتي في أونتاريو له ثلاثة محاور: الإبداع والعرض، والتأمل والاستجابة والتحليل، والأسس. ويربط المتحف محورين منها بسجلات عن مبانٍ ومفهوم للصور وفن زخرفي.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے جامعاتی/کالج تیاری کے کورس «بصری فنون» کے تین محور ہیں: تخلیق و پیشکش، غور و فکر، ردِعمل اور تجزیہ، اور بنیادیں۔ میوزیم ان میں سے دو کو عمارتوں، تصویر کے ایک تصور اور ایک آرائشی فن کے ریکارڈ کے ذریعے جوڑتا ہے۔'
