- position: within
  kind: story
  title:
    en: Five prayers, and how they began
    ar: خمس صلوات وكيف بدأت
    ur: پانچ نمازیں اور ان کی ابتدا
  text:
    en: Ibn Khuzayma's Sahih describes the prayer as an obligatory worship and one of Islam's five pillars. In a hadith it gives, fifty prayers a day were prescribed at first, on the night of the Isra; after Moses advised asking for a lighter duty, they were reduced to five. What exceeds the five prayers in the day and night is voluntary. What does an origin story add to a daily practice?
    ar: يصف ابن خزيمة في صحيحه الصلاة بأنها عبادة مفروضة وركن من أركان الإسلام الخمسة. وفي حديث يرويه فُرضت خمسون صلاة في اليوم أول الأمر، ليلة الإسراء، ثم خُففت إلى خمس بعد أن أشار موسى بسؤال التخفيف. وما زاد على الصلوات الخمس في اليوم والليلة تطوع. ماذا تضيف قصة البدء إلى ممارسة يومية؟
    ur: ابن خزیمہ اپنی صحیح میں نماز کو فرض عبادت اور اسلام کے پانچ ارکان میں سے ایک بتاتے ہیں۔ ان کی نقل کردہ ایک حدیث میں شبِ اسریٰ کو پہلے روزانہ پچاس نمازیں فرض ہوئیں؛ موسیٰ کے ہلکا کرنے کا مطالبہ کرنے کا مشورہ دینے کے بعد وہ گھٹ کر پانچ رہ گئیں۔ دن رات میں پانچ نمازوں سے زائد نفل ہے۔ روزمرہ عمل میں ابتدا کی کہانی کیا اضافہ کرتی ہے؟
  entity: practice/salah
  sources:
  - source/sahih-ibn-khuzayma
