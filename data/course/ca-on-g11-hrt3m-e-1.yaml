  title:
    en: A verse the prayer record cites
    ar: آية يستشهد بها سجل الصلاة
    ur: وہ آیت جس کا حوالہ نماز کا اندراج دیتا ہے
  text:
    en: The museum's record on salah cites Al-Nisa' 103 among its Qur'anic texts on the prayer. Read that verse as the museum prints it from the Tanzil text, then read the card that follows. What do you notice when you set the verse beside what Ibn Khuzayma's hadith says about the prayer?
    ar: يذكر سجل المتحف عن الصلاة آية النساء 103 بين نصوصه القرآنية عن الصلاة. اقرأ هذه الآية كما يعرضها المتحف عن نص تنزيل، ثم اقرأ البطاقة التالية. ماذا تلاحظ حين تضع الآية بجانب ما يرويه ابن خزيمة في حديثه عن الصلاة؟
    ur: نماز کے بارے میں عجائب گھر کا اندراج سورۃ النساء کی آیت ۱۰۳ کو نماز سے متعلق اپنے قرآنی متون میں شمار کرتا ہے۔ یہ آیت اسی طرح پڑھیں جیسے عجائب گھر تنزیل کے متن سے پیش کرتا ہے، پھر اگلا کارڈ پڑھیں۔ آیت کو ابن خزیمہ کی نماز سے متعلق حدیث کے ساتھ رکھ کر آپ کیا دیکھتے ہیں؟
  ref: 4:103
  entity: passage/quran-4-103
  sources:
