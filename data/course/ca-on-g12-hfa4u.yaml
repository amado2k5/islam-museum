summary:
  en: 'The Ontario Grade 12 course Nutrition and Health, code HFA4U, has five strands: Research and Inquiry Skills, Nutrition and Health, Eating Patterns and Trends, Local and Global Issues, and Food-Preparation Skills. The museum maps nine lessons in strands B to E and none in strand A.'
  ar: 'مقرر التغذية والصحة للصف الثاني عشر في أونتاريو، رمزه HFA4U، له خمسة محاور: مهارات البحث والاستقصاء، والتغذية والصحة، وأنماط الأكل واتجاهاته، والقضايا المحلية والعالمية، ومهارات إعداد الطعام. ويربط المتحف تسعة دروس في المحاور من ب إلى هـ، ولا يربط شيئًا في المحور أ.'
  ur: 'اونٹاریو کے جماعت دوازدہم کے کورس غذائیت اور صحت، کوڈ HFA4U، کی پانچ شاخیں ہیں: تحقیق و استفسار کی مہارتیں، غذائیت اور صحت، کھانے کے انداز اور رجحانات، مقامی اور عالمی مسائل، اور خوراک تیار کرنے کی مہارتیں۔ میوزیم شاخ ب سے ہ تک نو اسباق کو جوڑتا ہے اور شاخ الف میں کچھ نہیں۔'
