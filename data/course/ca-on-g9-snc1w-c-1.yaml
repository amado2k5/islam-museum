  title:
    en: A flux from a mineral
    ar: صاهر من معدن
    ur: ایک معدنی پگھلانے والا جزو
  text:
    en: Natron-type glass uses mineral natron as its flux; it was the basis of glassmaking in the traditional centres of Egypt and the Levant in Roman and late antique times. In Egypt it was still made until about 870, and Nadine Schibille links this to restrictions on natron extraction imposed by the director of finances Ibn al-Mudabbir. What happens to a product when a raw material becomes hard to get?
    ar: يستعمل زجاج النطرون النطرون المعدني صاهرًا، وكان أساس صناعة الزجاج في المراكز التقليدية بمصر والشام في العصرين الروماني والمتأخر. وفي مصر صُنع منه الزجاج حتى نحو 870م، وتربط نادين شيبيل ذلك بالقيود التي فرضها مدير الخراج ابن المدبر على استخراج النطرون. ماذا يحدث لمنتج حين يصعب الحصول على مادته الخام؟
    ur: نیٹرون شیشہ معدنی نیٹرون کو پگھلانے والے جزو کے طور پر استعمال کرتا ہے، اور رومی اور متأخر قدیم دور میں مصر و شام کے روایتی مراکز میں شیشہ سازی کی بنیاد تھا۔ مصر میں اس سے شیشہ تقریباً 870ء تک بنتا رہا، اور نادین شیبیل اس کو خراج کے ناظم ابن المدبر کی نیٹرون نکالنے پر عائد پابندیوں سے جوڑتی ہیں۔ جب کسی مصنوعے کا خام مال حاصل کرنا مشکل ہو جائے تو اس کا کیا ہوتا ہے؟
  entity: concept/natron-glass
  sources:
