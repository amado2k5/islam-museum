  title:
    en: Glass made from metal waste
    ar: زجاج من نفايات المعادن
    ur: دھاتی فضلے سے شیشہ
  text:
    en: Analyses of glass from the suburb of Šaqunda at Córdoba revealed lead glass made in the late eighth or early ninth century, which Nadine Schibille treats as an invention using metallurgical waste. About 60% of the glass found there is still recycled natron glass, and a second group has about 52% lead oxide and 34% silica. Which part of a product's life cycle does reuse change?
    ar: كشفت تحاليل زجاج ربض شقندة في قرطبة عن زجاج رصاص صُنع في أواخر القرن الثامن أو مطلع التاسع، وتعدّه نادين شيبيل ابتكارًا يستعمل نفايات المعادن. ونحو 60٪ مما وُجد هناك ما زال من زجاج النطرون المعاد تدويره، وفي مجموعة ثانية نحو 52٪ من أكسيد الرصاص و34٪ من السيليكا. أي مرحلة من حياة المنتج تغيّرها إعادة الاستعمال؟
    ur: قرطبہ کے محلے شقندہ سے ملنے والے شیشے کے تجزیوں نے آٹھویں صدی کے آخر یا نویں صدی کے آغاز میں بنا سیسے والا شیشہ ظاہر کیا، جسے نادین شیبیل دھاتی فضلے سے بنی ایک ایجاد قرار دیتی ہیں۔ وہاں ملنے والے شیشے کا تقریباً 60٪ اب بھی دوبارہ استعمال شدہ نیٹرون شیشہ ہے، اور ایک دوسرے گروہ میں تقریباً 52٪ سیسے کا آکسائیڈ اور 34٪ سلیکا ہے۔ دوبارہ استعمال مصنوعے کی زندگی کے کس مرحلے کو بدلتا ہے؟
  entity: concept/andalusi-lead-glass
