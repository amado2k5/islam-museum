  title:
    en: Ash of plants instead of a mineral
    ar: رماد النباتات بدل المعدن
    ur: معدن کی جگہ پودوں کی راکھ
  text:
    en: Plant-ash glass uses the ash of soda-rich plants as its flux instead of mineral natron, and by the tenth century it had become the dominant recipe of glassmaking in the Islamic world. Nadine Schibille notes that it is harder to classify than natron glass, because the ash component is highly variable by nature. How might a variable ingredient affect the glass made from it?
    ar: يستعمل زجاج رماد النباتات رماد نباتات غنية بالصودا صاهرًا بدل النطرون المعدني، وقد صار الوصفة الغالبة في صناعة الزجاج بالعالم الإسلامي بحلول القرن العاشر. وتقول نادين شيبيل إن تصنيفه أصعب من تصنيف زجاج النطرون لأن مكوّن الرماد شديد التغير بطبيعته. كيف قد يؤثر مكوّن متغير في الزجاج المصنوع منه؟
    ur: پودوں کی راکھ والا شیشہ سوڈا سے بھرپور پودوں کی راکھ کو معدنی نیٹرون کی جگہ پگھلانے والے جزو کے طور پر استعمال کرتا ہے، اور دسویں صدی تک اسلامی دنیا میں شیشہ سازی کا غالب نسخہ بن چکا تھا۔ نادین شیبیل لکھتی ہیں کہ اس کی درجہ بندی نیٹرون شیشے سے مشکل ہے، کیونکہ راکھ کا جزو فطرتاً بہت بدلتا رہتا ہے۔ ایک بدلتا ہوا جزو اس سے بننے والے شیشے پر کیسے اثر ڈال سکتا ہے؟
  entity: concept/plant-ash-glass
