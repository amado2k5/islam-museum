connections:
- position: within
  kind: reflection
  title:
    en: Kinship and tribe in Arabia before Islam
    ar: القرابة والقبيلة في جزيرة العرب قبل الإسلام
    ur: اسلام سے پہلے عرب میں قرابت اور قبیلہ
  text:
    en: Al-Rahiq al-Makhtum says the basis of the social order of the Arabs before Islam was solidarity by descent and kinship, and that rivalry for honour often led to wars among tribes that shared one father. It describes circles whose conditions differ, and judges the social condition to have been at the bottom of weakness and blindness. The record notes that modern studies of this society are not yet added. How would you separate its description from its judgement?
    ar: يذكر الرحيق المختوم أن أساس النظام الاجتماعي عند العرب قبل الإسلام كان العصبية الجنسية والرحم، وأن التنافس في الشرف والسؤدد كثيراً ما كان يفضي إلى الحروب بين القبائل التي يجمعها أب واحد. ويصف أوساطاً تختلف أحوالها، ويحكم بأن الحالة الاجتماعية كانت في الحضيض من الضعف والعماية. ويذكر السجل أن نظرة الدراسات الحديثة لم تُضف بعد. كيف تفصل وصفه عن حكمه؟
    ur: الرحیق المختوم بیان کرتا ہے کہ اسلام سے پہلے عربوں کے سماجی نظام کی بنیاد جنسی عصبیت اور رحم تھی، اور شرف اور سیادت کی رقابت اکثر ان قبائل کے درمیان جنگوں کا سبب بنتی جنہیں ایک باپ جمع کرتا۔ وہ مختلف طبقات بیان کرتا ہے جن کے احوال الگ ہیں، اور حکم لگاتا ہے کہ سماجی حالت ضعف اور جہالت کی انتہا پر تھی۔ اندراج کے مطابق جدید مطالعات کا نظریہ ابھی شامل نہیں ہوا۔ آپ اس کے بیان کو اس کے حکم سے کیسے الگ کریں گے؟
