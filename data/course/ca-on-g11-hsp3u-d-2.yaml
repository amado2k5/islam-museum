summary:
  en: Asks you to explain how factors such as physical environment, and social structures such as family and kin, shape individual and group behaviour; the museum offers one historical account, of tribe and kinship.
  ar: يسألك أن تشرح كيف تشكّل عوامل مثل البيئة الطبيعية، وبُنى اجتماعية مثل الأسرة والقرابة، سلوك الأفراد والجماعات؛ ويقدّم المتحف رواية تاريخية واحدة عن القبيلة والقرابة.
  ur: آپ سے کہتا ہے کہ بتائیں کہ طبعی ماحول جیسے عوامل اور خاندان و قرابت جیسے سماجی ڈھانچے افراد اور گروہوں کے رویے کو کیسے ڈھالتے ہیں؛ عجائب گھر قبیلے اور قرابت کا ایک تاریخی بیان پیش کرتا ہے۔
