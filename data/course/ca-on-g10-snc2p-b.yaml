expectations:
- code: B1
  text:
    en: analyse some current technologies or substances that have an impact on human tissues, organs, or systems, and evaluate their effects on human health
    ar: حلِّل بعض التقنيات أو المواد الراهنة التي تؤثر في أنسجة الإنسان أو أعضائه أو أجهزته، وقيِّم آثارها في الصحة
    ur: انسانی بافتوں، اعضا یا نظاموں پر اثر انداز ہونے والی کچھ موجودہ ٹیکنالوجیز یا مادّوں کا تجزیہ کریں اور انسانی صحت پر ان کے اثرات کا جائزہ لیں
- code: B2
  text:
    en: investigate cell division, cell specialization, and the organization of systems in animals, including humans, using various laboratory techniques
    ar: افحص انقسام الخلايا وتخصّصها وتنظيم الأجهزة في الحيوانات، ومنها الإنسان، باستعمال تقنيات مخبرية متنوعة
    ur: مختلف لیبارٹری تکنیکوں کے ذریعے جانوروں، بشمول انسان، میں خلیوں کی تقسیم، خلیوں کی تخصیص اور نظاموں کی تنظیم کی تحقیق کریں
- code: B3
  text:
    en: demonstrate an understanding of the hierarchical organization of cells, from tissues, to organs, to systems in animals, including humans
    ar: أظهِر فهمًا للتنظيم الهرمي للخلايا، من الأنسجة إلى الأعضاء إلى الأجهزة، في الحيوانات ومنها الإنسان
    ur: جانوروں، بشمول انسان، میں خلیوں سے بافتوں، پھر اعضا، پھر نظاموں تک کی درجہ وار تنظیم کی سمجھ کا مظاہرہ کریں
