- position: after
  kind: invention
  title:
    ar: حساب الكاشي لمحيط الدائرة
    en: Al-Kashi computes the circumference
    ur: کاشی کا محیطِ دائرہ کا حساب
  text:
    ar: تؤرخ ماكتوتر «الرسالة المحيطية» للكاشي بسنة 1424م، وتذكر إخراج ضعف نسبة المحيط إلى القطر في النظام الستيني ثم العشري بدقة عالية، وينقل أوكتن العدد العشري 6.2831853071795865. ويقول السجل إنه تحسين لحساب قديم لا اكتشاف العدد pi، وإن إيرانيكا تصف مضلعات داخل الدائرة وحولها لتقريب المحيط. كيف يقرّبنا مضلع من دائرة؟
    en: MacTutor dates al-Kashi's Treatise on the Circumference to 1424 and describes it as giving twice the ratio of circumference to diameter in sexagesimal and decimal forms with high precision, and Okten reports the decimal value 6.2831853071795865. The record says this improved an inherited calculation and did not discover pi, and that Iranica describes polygons inside and around a circle to approach the circumference. How does a polygon bring you closer to a circle?
    ur: میک ٹیوٹر کاشی کے «رسالۂ محیطیہ» کو 1424ء کا بتاتا ہے اور کہتا ہے کہ اس میں محیط اور قطر کی نسبت کا دگنا ستّینی اور اعشاری دونوں صورتوں میں بلند درستی کے ساتھ دیا گیا ہے، اور اوکتن اعشاری قیمت 6.2831853071795865 نقل کرتے ہیں۔ ریکارڈ کہتا ہے کہ یہ ایک وراثت میں ملے حساب کی بہتری تھی، pi کی دریافت نہیں، اور یہ کہ ایرانیکا محیط کے قریب پہنچنے کے لیے دائرے کے اندر اور باہر کثیر الاضلاع کا ذکر کرتا ہے۔ کثیر الاضلاع ہمیں دائرے کے قریب کیسے لاتا ہے؟
