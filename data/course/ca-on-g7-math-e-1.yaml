connections:
- position: before
  kind: invention
  title:
    ar: المحيط والمساحة في باب المساحة عند الخوارزمي
    en: Circumference and area in al-Khwarizmi's mensuration
    ur: خوارزمی کے باب مساحت میں محیط اور رقبہ
  text:
    ar: يعطي باب المساحة عند الخوارزمي دور الدائرة، أي محيطها، بأنه القطر في ثلاثة وسبع، وتكسيرها، أي مساحتها، بأنه نصف القطر في نصف الدور. ويقول إن جعل المحيط القطر في ثلاثة وسبع «اصطلاح بين الناس من غير اضطرار»، وفي مسألة الدائرة التي قطرها سبعة أذرع يجعل المحيط اثنين وعشرين ذراعاً، وينبّه المحققان على أن هذا تقريبي. كيف تقارن قاعدة المساحة هذه بالصيغة التي تعرفها؟
    en: Al-Khwarizmi's mensuration chapter gives a circle's circumference as the diameter times three and a seventh, and its area as half the diameter times half the circumference. He calls taking three and a seventh "a convention among people, not a necessity", and for a circle of diameter seven cubits he takes the circumference as twenty-two cubits, which the editors note is approximate. How does this area rule compare with the formula you know?
    ur: خوارزمی کے باب مساحت میں دائرے کا دور یعنی محیط قطر ضرب تین اور ایک ساتواں ہے، اور اس کا رقبہ نصف قطر ضرب نصف محیط۔ وہ کہتے ہیں کہ محیط کو قطر کا تین اور ایک ساتواں گنا ماننا «لوگوں میں ایک اصطلاح ہے، کوئی لازمی بات نہیں»، اور سات ذراع قطر والے دائرے کے مسئلے میں محیط بائیس ذراع لیتے ہیں، جسے محققین تقریبی بتاتے ہیں۔ رقبے کا یہ قاعدہ اس کلیے سے کیسے ملتا ہے جو آپ جانتے ہیں؟
  entity: concept/ilm-al-misaha
  sources:
