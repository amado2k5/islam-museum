- position: after
  kind: story
  title:
    en: Records first, then books
    ar: السجلات أولاً ثم الكتب
    ur: پہلے ریکارڈ، پھر کتابیں
  text:
    en: Jonathan Bloom describes Iranian Muslims adopting paper at first for records and only gradually in place of parchment for copying books, Qur'an manuscripts among them. Osman Ersoy connects its abundance and spread with flourishing centres of knowledge and culture, naming Samarkand as an example. What changes for a society when writing material becomes common?
    ar: يصف جوناثان بلوم تبني المسلمين الإيرانيين للورق أولاً في حفظ السجلات، ثم الانتقال التدريجي إلى نسخ الكتب عوضاً عن الرق، بما فيها المصاحف. ويربط عثمان أرصوي وفرته وانتشاره بازدهار مراكز العلم والثقافة، ويذكر سمرقند مثالاً. ماذا يتغير في مجتمع حين تتوافر مادة الكتابة؟
    ur: جوناتھن بلوم بیان کرتا ہے کہ ایرانی مسلمانوں نے کاغذ کو پہلے ریکارڈ کے لیے اپنایا اور کتابوں کی نقل میں چمڑے کی جگہ آہستہ آہستہ لیا، جن میں قرآن کے نسخے بھی تھے۔ عثمان ایرسوئے اس کی کثرت اور پھیلاؤ کو علم و ثقافت کے پھلتے پھولتے مراکز سے جوڑتا ہے اور سمرقند کو مثال کے طور پر نام لیتا ہے۔ جب لکھنے کا مواد عام ہو جائے تو معاشرے میں کیا بدلتا ہے؟
