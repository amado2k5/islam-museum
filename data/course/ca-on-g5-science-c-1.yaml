  title:
    en: From fibres to a sheet
    ar: من الألياف إلى الورقة
    ur: ریشوں سے ورق تک
  text:
    en: 'Paper is a mat of cellulose fibres: the material is broken down in water, collected on a screen and dried into a sheet, and the fibres may come from plants, rags or old ropes. Osman Ersoy attributes the proposal for a paper workshop in Baghdad, under Harun al-Rashid, to al-Fadl ibn Yahya al-Barmaki. The record calls this the moving of a craft to a city, not the invention of paper. What would a city do with more paper?'
    ar: 'الورق شبكة من ألياف السليلوز: تُفكك مادتها في الماء، ثم تجمع على سطح شبكي وتُجفف ورقةً، وقد تأتي الألياف من نباتات أو خرق أو حبال قديمة. وينسب عثمان أرصوي اقتراح إنشاء مصنع للورق في بغداد، في خلافة هارون الرشيد، إلى الفضل بن يحيى البرمكي. ويقول السجل إن هذه قصة انتقال صناعة إلى مدينة، لا اختراع الورق. ماذا تفعل مدينة بمزيد من الورق؟'
    ur: 'کاغذ سیلولوز کے ریشوں کی ایک تہ ہے: اس کا مادہ پانی میں توڑا جاتا ہے، جالی پر جمع کیا جاتا ہے اور خشک کر کے ورق بنایا جاتا ہے، اور ریشے پودوں، چیتھڑوں یا پرانی رسیوں سے آ سکتے ہیں۔ عثمان ایرسوئے بغداد میں ہارون الرشید کے دور میں کاغذ کا کارخانہ بنانے کی تجویز کو فضل بن یحییٰ برمکی سے منسوب کرتا ہے۔ ریکارڈ اسے ایک صنعت کا شہر میں منتقل ہونا کہتا ہے، کاغذ کی ایجاد نہیں۔ ایک شہر زیادہ کاغذ کا کیا کرے گا؟'
  entity: invention/baghdad-papermaking
  sources:
