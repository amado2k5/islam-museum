  title:
    en: Eid al-Fitr
    ar: عيد الفطر
    ur: عید الفطر
  text:
    en: 'The Kuwaiti jurists'' encyclopaedia, which the record on Eid al-Fitr follows, explains that ''eid comes from ''awd, returning, because it recurs. It says the Muslims have two: the day of fitr, on the first of Shawwal, and the day of adha, on the tenth of Dhu''l-Hijja. It adds that takbir is prescribed on the way to the prayer, in homes, markets and roads, until the prayer begins. Which festival does your community keep, and when does it recur?'
    ar: 'تشرح الموسوعة الفقهية الكويتية، التي يتبعها السجل، أن العيد من العود لأنه يتكرر، وأنه عند المسلمين يومان: يوم الفطر في أول شوال ويوم الأضحى في العاشر من ذي الحجة. وتذكر أن التكبير مشروع في الغدو إلى الصلاة في المنازل والأسواق والطرق حتى تبدأ الصلاة. أي مهرجان تقيمه جماعتك، ومتى يتكرر؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا، جس کی پیروی یہ اندراج کرتا ہے، بتاتا ہے کہ «عید» «عود» یعنی لوٹنے سے ہے کیونکہ وہ بار بار آتی ہے، اور مسلمانوں کے ہاں دو عیدیں ہیں: یوم الفطر یکم شوال کو اور یوم الاضحیٰ دس ذوالحجہ کو۔ وہ یہ بھی بتاتا ہے کہ نماز کی طرف جاتے ہوئے گھروں، بازاروں اور راستوں میں تکبیر مشروع ہے جب تک نماز شروع ہو۔ آپ کی جماعت کون سا تہوار مناتی ہے اور وہ کب لوٹ کر آتا ہے؟'
