  title:
    en: Islamic calligraphy
    ar: الخط الإسلامي
    ur: اسلامی خطاطی
  text:
    en: "Islamic calligraphy is the art of writing and shaping the Arabic letter beautifully. Its scripts include Kufic, Naskh, Thuluth and Diwani. Where have you seen Arabic writing, on a poster or in a comic strip, and which script do you see in it?"
    ar: "الخط الإسلامي فن كتابة الحرف العربي وتشكيله جمالياً. ومن خطوطه الكوفي والنسخ والثلث والديواني. أين رأيت الكتابة العربية في ملصق أو قصة مصورة، وأي خط تراه فيها؟"
    ur: "اسلامی خطاطی عربی حرف کو خوبصورتی سے لکھنے اور ڈھالنے کا فن ہے۔ اس کے خطوں میں کوفی، نسخ، ثلث اور دیوانی شامل ہیں۔ آپ نے عربی تحریر کہاں دیکھی، کسی پوسٹر یا مصور کہانی میں، اور اس میں کون سا خط نظر آتا ہے؟"
