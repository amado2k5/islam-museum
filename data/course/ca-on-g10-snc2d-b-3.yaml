  title:
    ar: فتوى في استنساخ النباتات
    en: A fatwa on cloning plants
    ur: پودوں کی کلوننگ پر ایک فتویٰ
  text:
    ar: سُئلت الدائرة عن استنساخ الخلايا النباتية ومضاعفتها لصنع العصائر والمواد المضافة إلى الطعام، فأجابت بأنه لا حرج في الاستفادة من تقنيات الاستنساخ في النباتات بشرط ثبوت عدم إضرارها بالمستهلك وعدم إخلالها بالنظام النباتي. ورجعت في ضبط المصالح والمفاسد إلى أهل الخبرة والاختصاص، واستشهدت بقرار لمجمع الفقه الإسلامي الدولي بجدة سنة 1997. كيف تختبر شرطًا كهذا؟
    en: Asked about cloning plant cells and multiplying them to make juices and food additives, the Department answered that using cloning techniques in plants is unobjectionable, provided they are shown not to harm the consumer or disrupt the plant ecosystem. It referred the judgment of benefits and harms to experts and specialists, and cited a 1997 resolution of the International Islamic Fiqh Academy in Jeddah. How would you test a condition like that?
    ur: پودوں کے خلیوں کی کلوننگ اور انہیں بڑھا کر جوس اور کھانے میں ملائی جانے والی اشیا بنانے کے بارے میں پوچھا گیا تو دائرے نے جواب دیا کہ پودوں میں کلوننگ کی تکنیکوں سے فائدہ اٹھانے میں کوئی حرج نہیں، بشرطیکہ ثابت ہو کہ وہ صارف کو نقصان نہیں پہنچاتیں اور نباتاتی نظام کو نہیں بگاڑتیں۔ اس نے فوائد اور نقصانات کی پرکھ ماہرین اور اہلِ اختصاص کے سپرد کی، اور جدہ میں مجمع الفقہ الاسلامی الدولی کی 1997 کی ایک قرارداد کا حوالہ دیا۔ آپ ایسی شرط کو کیسے آزمائیں گے؟
