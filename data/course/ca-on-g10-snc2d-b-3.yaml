  title:
    ar: فتوى في الوصية بالتبرع بالأعضاء
    en: A fatwa on bequeathing organs
    ur: اعضا کے عطیے کی وصیت پر ایک فتویٰ
  text:
    ar: سُئلت دائرة الإفتاء العام الأردنية، من مبادرة للتوعية بالتبرع بالأعضاء، عن وصية الإنسان بالتبرع بأعضائه بعد وفاته. فأجابت بأن التبرع بالأعضاء بعد الوفاة لدفع الضرر عن الآخرين تبيحه الشريعة، وعدّته من التعاون على البر، وأدرجته تحت قاعدتي أن الضرورات تبيح المحظورات وأن الضرورة تقدر بقدرها. ويسجّل المتحف هذا جواب الدائرة. فأي أصوات أخرى تزن معه؟
    en: Jordan's General Iftaa Department was asked by an organ-donation awareness initiative about a person bequeathing his organs for donation after death. It answered that donating organs after death to relieve harm to others is permitted by the sharia, counted it as cooperation in righteousness, and placed it under the maxims that necessity makes the prohibited permissible and that necessity is measured by its extent. The museum records this as the Department's answer. What other voices would you weigh with it?
    ur: اردن کے دائرۃ الافتاء العام سے اعضا کے عطیے کی آگاہی کی ایک مہم نے سوال کیا کہ کوئی شخص اپنے مرنے کے بعد اپنے اعضا عطیہ کرنے کی وصیت کرے تو اس کا کیا حکم ہے۔ اس نے جواب دیا کہ دوسروں سے ضرر دور کرنے کے لیے موت کے بعد اعضا کا عطیہ شریعت میں جائز ہے، اسے نیکی پر تعاون شمار کیا، اور اسے ان دو قواعد کے تحت رکھا کہ ضرورتیں ممنوعات کو مباح کر دیتی ہیں اور ضرورت کا اندازہ اس کی مقدار سے ہوتا ہے۔ میوزیم اسے ادارے کا جواب کہہ کر درج کرتا ہے۔ اس کے ساتھ آپ اور کن آوازوں کو تولیں گے؟
  entity: work/fatwa-aliftaa-jo-bequeathing-ones-organs-after-death
