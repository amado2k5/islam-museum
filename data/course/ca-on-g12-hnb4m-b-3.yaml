  title:
    en: The houses of tiraz and their looms
    ar: دور الطراز وأنوالها
    ur: دارالطراز اور ان کی کھڈیاں
  text:
    en: 'Weaving in the houses of tiraz became work for many hands: at Tinnis in Egypt some 5,000 looms were working, among them a workshop belonging to the caliph, and a governor under al-Muqtadir had eighty tiraz workshops of his own. The man in charge, the sahib al-tiraz, oversaw the dyers, the tools and the weavers. What can a count of looms tell us about an industry?'
    ar: 'صار النسج في دور الطراز عمل أيدٍ كثيرة: ففي تنّيس بمصر كان نحو 5000 نول يعمل، منها دار للخليفة، وكان لأحد الولاة في عهد المقتدر ثمانون دار طراز يُنسج فيها قماشه. وكان القائم على دور الطراز، وهو صاحب الطراز، ينظر في أمور الصبّاغين والآلة والحاكة. ماذا يخبرنا عدد الأنوال عن صناعة ما؟'
    ur: 'دارالطراز میں بُنائی بہت سے ہاتھوں کا کام بن گئی: مصر کے تنّیس میں تقریباً ۵۰۰۰ کھڈیاں چلتی تھیں، جن میں ایک خلیفہ کا کارخانہ بھی تھا، اور مقتدر کے عہد میں ایک والی کے اپنے اسّی دارالطراز تھے جن میں اس کا کپڑا بُنا جاتا تھا۔ ان کارخانوں کا نگران، صاحبِ طراز، رنگ سازوں، اوزاروں اور بُنکروں کی دیکھ بھال کرتا تھا۔ کھڈیوں کی گنتی ہمیں کسی صنعت کے بارے میں کیا بتاتی ہے؟'
