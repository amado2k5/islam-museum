  title:
    en: The Ottoman weaver's loom and its price
    ar: نول الحائك العثماني وثمنه
    ur: عثمانی جولاہے کی کھڈی اور اس کی قیمت
  text:
    en: The TDV entry describes the cullah, the Ottoman weaver, who mostly wove cotton. Looms were made by the weavers, ordered or bought ready, and differed in size; the comb and shuttle were measured for the cloth, and the 1640 price list gave an Edirne loom 170 akce and a plain loom 120. Manisa had 3,000 looms in the nineteenth century. What would you need to know to judge what a loom cost a weaver?
    ar: يصف مدخل TDV الجلّاه، أي الحائك العثماني الذي نسج القطن في الغالب. كانت الأنوال تُصنع عند الحائكين أو تُطلب أو تُشترى جاهزة، وتفاوتت أحجامها، وقيست الأمشاط والمكوك بحسب القماش؛ وفي قائمة التسعير سنة 1640م نول أدرنة بمئة وسبعين أقجة والنول البسيط بمئة وعشرين. وكان في مانيسا ثلاثة آلاف نول في القرن التاسع عشر. ما الذي تحتاج معرفته لتقدّر ما كلّفه النول للحائك؟
    ur: موسوعہ TDV کا اندراج عثمانی جولاہے، یعنی چُلّاہ، کا حال بتاتا ہے جو زیادہ تر سوتی کپڑا بُنتا تھا۔ کھڈیاں جولاہے خود بناتے، منگواتے یا بنی بنائی خریدتے تھے اور ان کے سائز مختلف ہوتے تھے؛ کنگھی اور ڈھرکی کپڑے کے حساب سے ناپی جاتی تھیں، اور ۱۶۴۰ء کی نرخ فہرست میں ادرنہ کی کھڈی ۱۷۰ اقچہ اور سادہ کھڈی ۱۲۰ اقچہ کی تھی۔ انیسویں صدی میں مانیسا میں تین ہزار کھڈیاں تھیں۔ یہ جاننے کے لیے کہ کھڈی جولاہے کو کتنے میں پڑتی تھی، آپ کو اور کیا جاننا ہوگا؟
