expectations:
- code: A1
  text:
    en: 'analyse some challenges and opportunities presented by the physical environment and ways in which people have responded to them (FOCUS ON: Spatial Significance; Interrelationships)'
    ar: 'حلّل بعض التحديات والفرص التي تقدمها البيئة الطبيعية والطرق التي استجاب بها الناس لها ⁦(التركيز على: الأهمية المكانية؛ الترابطات)⁩'
    ur: 'طبعی ماحول کے پیش کردہ بعض چیلنجوں اور مواقع کا، اور ان کے جواب میں لوگوں کے اپنائے ہوئے طریقوں کا تجزیہ کریں ⁦(توجہ کا محور: مکانی اہمیت؛ باہمی روابط)⁩'
- code: A2
  text:
    en: 'use the geographic inquiry process to investigate the impact of natural events and/or human activities that change the physical environment, exploring the impact from a geographic perspective (FOCUS ON: Geographic Perspective)'
    ar: 'استخدم عملية الاستقصاء الجغرافي لدراسة أثر الظواهر الطبيعية و/أو الأنشطة البشرية التي تغيّر البيئة الطبيعية، مستكشفًا هذا الأثر من منظور جغرافي ⁦(التركيز على: المنظور الجغرافي)⁩'
    ur: 'جغرافیائی تحقیق کے عمل کو استعمال کرتے ہوئے ان قدرتی واقعات اور/یا انسانی سرگرمیوں کے اثرات کی چھان بین کریں جو طبعی ماحول کو بدلتی ہیں، اور اس اثر کو جغرافیائی نقطۂ نظر سے دیکھیں ⁦(توجہ کا محور: جغرافیائی نقطۂ نظر)⁩'
- code: A3
  text:
    en: 'demonstrate an understanding of significant patterns in Earth’s physical features and of some natural processes and human activities that create and change those features (FOCUS ON: Patterns and Trends; Spatial Significance)'
    ar: 'أظهر فهمًا للأنماط المهمة في المظاهر الطبيعية للأرض ولبعض العمليات الطبيعية والأنشطة البشرية التي تُنشئ هذه المظاهر وتغيّرها ⁦(التركيز على: الأنماط والاتجاهات؛ الأهمية المكانية)⁩'
    ur: 'زمین کی طبعی خصوصیات کے اہم نمونوں کی، اور ان قدرتی عمل اور انسانی سرگرمیوں کی جو ان خصوصیات کو بناتی اور بدلتی ہیں، سمجھ کا مظاہرہ کریں ⁦(توجہ کا محور: نمونے اور رجحانات؛ مکانی اہمیت)⁩'
