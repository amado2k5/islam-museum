connections:
- position: before
  kind: reflection
  title:
    en: Washing before prayer
    ar: الوضوء قبل الصلاة
    ur: نماز سے پہلے وضو
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence says wudu is, in juristic usage, the use of pure water on the four limbs, face, hands, head and feet, in the prescribed manner, and that it lifts the minor ritual impurity. It adds that jurists agreed it was ordained in Mecca together with prayer, and that no prayer was ever transmitted without it. What does it mean for a rite to come before another rite?
    ar: 'تذكر الموسوعة الفقهية الكويتية أن الوضوء في الاصطلاح الفقهي استعمال الماء الطهور في الأعضاء الأربعة: الوجه واليدين والرأس والرجلين، على الصفة المشروعة، وأنه يرفع الحدث الأصغر. وتضيف أن الفقهاء اتفقوا على أنه شُرع بمكة مع الصلاة، وأنه لم تُنقل صلاة قط بغير وضوء. ماذا يعني أن تسبق شعيرةٌ شعيرةً أخرى؟'
    ur: کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ فقہی اصطلاح میں وضو چار اعضا، یعنی چہرہ، ہاتھ، سر اور پاؤں پر پاک پانی کو مقررہ طریقے سے استعمال کرنا ہے، اور یہ حدثِ اصغر کو دور کرتا ہے۔ وہ مزید کہتا ہے کہ فقہا متفق ہیں کہ یہ مکہ میں نماز کے ساتھ مشروع ہوا اور کوئی نماز وضو کے بغیر منقول نہیں۔ ایک رسم کا دوسری رسم سے پہلے آنا کیا معنی رکھتا ہے؟
  entity: practice/wudu
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
- position: within
  kind: reflection
  title:
    en: The call that marks the hour
    ar: نداء يعلن الوقت
    ur: وقت کا اعلان کرنے والی پکار
  text:
    en: 'The Kuwaiti encyclopaedia of jurisprudence says the adhan is, in the law, the announcement of the time of an obligatory prayer with fixed, transmitted words in a prescribed form. It adds that the jurists agree it is one of Islam''s distinguishing public rites, and differ on its ruling: a communal obligation for some, an emphatic sunna for others. Who hears it, and what does it ask them to do?'
    ar: 'تذكر الموسوعة الفقهية الكويتية أن الأذان في الشرع الإعلام بدخول وقت صلاة مفروضة بألفاظ مخصوصة منقولة على صفة مشروعة. وتضيف أن الفقهاء متفقون على أنه من شعائر الإسلام الظاهرة، ومختلفون في حكمه: فرض كفاية عند بعضهم، وسنة مؤكدة عند آخرين. من يسمعه، وماذا يطلب منه؟'
    ur: 'کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ شریعت میں اذان فرض نماز کے وقت کا اعلان ہے جو مخصوص منقول الفاظ میں مقررہ صورت کے ساتھ ہوتا ہے۔ وہ مزید کہتا ہے کہ فقہا متفق ہیں کہ یہ اسلام کے نمایاں ظاہری شعائر میں سے ہے، اور اس کے حکم میں اختلاف کرتے ہیں: بعض کے نزدیک فرضِ کفایہ، دوسروں کے نزدیک سنتِ مؤکدہ۔ اسے کون سنتا ہے اور یہ اس سے کیا کرنے کو کہتی ہے؟'
  entity: practice/adhan
