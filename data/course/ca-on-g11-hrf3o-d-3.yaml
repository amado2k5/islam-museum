- position: after
  kind: reflection
  title:
    en: Five prayers in the day and night
    ar: خمس صلوات في اليوم والليلة
    ur: دن رات میں پانچ نمازیں
  text:
    en: Ibn Khuzayma's Sahih describes the prayer, salah, as an obligatory worship and one of the five pillars of Islam. In the hadith of Talha ibn Ubayd Allah about the Bedouin, as Ibn Khuzayma gives it, the obligation is five prayers in the day and night, and what exceeds them is voluntary. How would five fixed prayers shape a believer's day?
    ar: يصف ابن خزيمة في صحيحه الصلاة بأنها عبادة مفروضة وأحد أركان الإسلام الخمسة. وفي حديث طلحة بن عبيد الله عن الأعرابي، كما يرويه ابن خزيمة، الفرض خمس صلوات في اليوم والليلة، وما زاد عليها تطوع. كيف تصوغ خمس صلوات محددة يوم المؤمن؟
    ur: ابن خزیمہ اپنی صحیح میں نماز کو فرض عبادت اور اسلام کے پانچ ارکان میں سے ایک بتاتے ہیں۔ طلحہ بن عبید اللہ کی اس حدیث میں جو دیہاتی کے بارے میں ہے، جیسے ابن خزیمہ نے دی ہے، فرض دن رات میں پانچ نمازیں ہیں اور جو ان سے زائد ہے وہ نفل ہے۔ پانچ مقررہ نمازیں ایک مومن کے دن کو کیسے ڈھالتی ہیں؟
  entity: practice/salah
  sources:
  - source/sahih-ibn-khuzayma
