  kind: invention
  title:
    en: An office to watch the market
    ar: منصب لمراقبة السوق
    ur: بازار کی نگرانی کا منصب
  text:
    en: Ibn Khaldun writes in the Muqaddima that the hisba is an office in which the ruler appoints a capable person to watch over the markets and streets. This officer looks into fraud in measures, weights and foodstuffs, blocked streets and buildings about to fall, and acts without waiting for a complaint. Who looks after markets and streets in your community today?
    ar: يذكر ابن خلدون في المقدمة أن الحسبة منصب يولّي فيه السلطان رجلًا كفئًا يراقب الأسواق والشوارع، فينظر في الغش في المكاييل والموازين والمأكولات، وفي الشوارع المسدودة والأبنية الآيلة إلى السقوط، ويتحرك دون أن ينتظر شكوى. من يعتني اليوم بالأسواق والشوارع في مجتمعك؟
    ur: ابن خلدون مقدمہ میں لکھتے ہیں کہ حسبہ ایسا منصب ہے جس میں حکمران ایک قابل شخص کو بازاروں اور گلیوں کی نگرانی پر مقرر کرتا ہے۔ یہ افسر ناپ تول اور کھانے پینے کی چیزوں میں دھوکے، بند گلیوں اور گرنے کے قریب عمارتوں کو دیکھتا ہے، اور شکایت کا انتظار کیے بغیر کارروائی کرتا ہے۔ آج آپ کی برادری میں بازاروں اور گلیوں کا خیال کون رکھتا ہے؟
  entity: invention/hisba
