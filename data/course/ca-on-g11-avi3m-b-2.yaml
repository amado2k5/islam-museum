  title:
    en: Glass, ash and capitals
    ar: الزجاج والرماد والعواصم
    ur: شیشہ، راکھ اور دارالحکومت
  text:
    en: 'By the tenth century the old glassmaking industry and its markets had been transformed: natron-type glass ceased in the traditional centres of the Levant and Egypt, and new recipes based on plant ash emerged. Nadine Schibille ties changes to new capitals; Umayyad Damascus, for one, imported large consignments of mosaic tesserae for the Great Umayyad Mosque and palaces. How can materials and patrons help explain what glassworkers made?'
    ar: 'بحلول القرن العاشر للميلاد كانت صناعة الزجاج القديمة وأسواقها قد تغيرت تمامًا: فقد توقف إنتاج زجاج النطرون في مراكزه التقليدية في الشام ومصر، وظهرت وصفات جديدة تقوم على رماد النباتات. وتربط نادين شيبيل تحولات الصناعة بقيام العواصم: فقد استوردت دمشق الأموية شحنات كبيرة من فصوص الفسيفساء لزخرفة الجامع الأموي والقصور. كيف تساعد المواد والرعاة في تفسير ما صنعه صنّاع الزجاج؟'
    ur: 'دسویں صدی تک شیشہ سازی کی قدیم صنعت اور اس کی منڈیاں بالکل بدل چکی تھیں: شام اور مصر کے روایتی مراکز میں نیٹرون شیشے کی پیداوار رک گئی، اور نباتاتی راکھ پر مبنی نئے نسخے سامنے آئے۔ نادین شیبیل صنعت کی تبدیلیوں کو نئے دارالحکومتوں سے جوڑتی ہیں: اموی دمشق نے جامع اموی اور محلات کی آرائش کے لیے موزائیک کے ٹکڑوں کی بڑی کھیپیں درآمد کیں۔ مواد اور سرپرست اس بات کی وضاحت میں کیسے مدد دیتے ہیں کہ شیشہ سازوں نے کیا بنایا؟'
  entity: practice/islamic-glassmaking
