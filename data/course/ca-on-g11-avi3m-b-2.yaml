  title:
    en: Tile ordered by decree
    ar: بلاط مطلوب بفرمان
    ur: فرمان سے منگوایا گیا ٹائل
  text:
    en: The TDV entry on the potter, the maker of glazed tiles, says the tiles of the Selimiye in Edirne were ordered from Iznik by decrees of 1572. It adds that the chief court illuminators Shahkulu and Kara Memi designed patterns for the tile masters. What does an order from the state, and a pattern from the court, tell you about the tiles on a wall?
    ar: يقول مدخل موسوعة TDV عن الخزاف، صانع البلاط المزجّج، إن بلاط السليمية بأدرنة طُلب من إزنيق بفرمانات سنة 1572م. ويضيف أن شاه قولي وقره ممي، من رؤساء نقاشي البلاط، كانا يصممان الزخارف لأساتذة البلاط. ماذا يخبرك طلبٌ من الدولة وزخرفةٌ من البلاط عن بلاط على جدار؟
    ur: کمہار، یعنی شیشہ دار ٹائل بنانے والے، پر TDV کا اندراج کہتا ہے کہ ادرنہ کی سلیمیہ کے ٹائل 1572 کے فرمانوں سے ازنیق سے منگوائے گئے۔ وہ مزید کہتا ہے کہ شاہ قلی اور قرہ مِمی، جو دربار کے سربراہ مصوروں میں سے تھے، ٹائل کے استادوں کے لیے نقش بناتے تھے۔ ریاست کا حکم اور دربار کا نقش دیوار پر لگے ٹائلوں کے بارے میں آپ کو کیا بتاتے ہیں؟
