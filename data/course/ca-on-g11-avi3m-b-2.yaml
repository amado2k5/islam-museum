  kind: story
  title:
    en: A style made in a royal studio
    ar: أسلوب صُنع في مرسم ملكي
    ur: شاہی اسٹوڈیو میں بنا انداز
  text:
    en: Milo Cleveland Beach writes that a recognisable Mughal style was formed under Akbar, who placed the Iranians Mir Sayyid Ali and Abd al-Samad in charge of the painting studios; what emerged mixed Hindu (Rajput) and Muslim Indian elements with those of Safavid Iran. European prints were the source of new techniques of shading. What can a painting's patron and studio tell you about its meaning?
    ar: 'يقول ميلو كليفلاند بيتش إن الأسلوب المغولي المعروف تشكّل في عهد أكبر: فقد وضع الإمبراطور الإيرانيين مير سيد علي وعبد الصمد على رأس مراسم التصوير، لكن ما خرج منها أسلوب جديد يمزج عناصر هندية ⁦(راجبوتية)⁩ وإسلامية هندية بعناصر إيران الصفوية. ومن المطبوعات الأوروبية أُخذت تقنيات التظليل الجديدة. ماذا يخبرك راعي اللوحة ومرسمها عن معناها؟'
    ur: 'میلو کلیولینڈ بیچ لکھتے ہیں کہ پہچانا جانے والا مغل انداز اکبر کے دور میں بنا: بادشاہ نے ایرانیوں میر سید علی اور عبدالصمد کو مصوری کے اسٹوڈیوز کا سربراہ بنایا، لیکن جو نکلا وہ نیا انداز تھا جس میں ہندو راجپوت اور مسلم ہندوستانی عناصر صفوی ایران کے عناصر سے ملے ہوئے تھے۔ سائے کی نئی تکنیکیں یورپی چھاپوں سے آئیں۔ کسی تصویر کا سرپرست اور اس کا اسٹوڈیو آپ کو اس کے معنی کے بارے میں کیا بتا سکتا ہے؟'
