  ur: گنبد والی عمارت، شیشے کا موزیک اور کپڑے پر لکھی ہوئی پٹی، جنہیں وقت کے آر پار ان کے مواد، استعمال اور ان کو بنانے والے معاشرے کے لحاظ سے پڑھا جائے ⁦(B1.3 اور B2.2)⁩۔
