- code: E2
  text:
    en: investigate, through inquiry, properties of light, and predict its behaviour in mirrors and as it passes through different media
    ar: استقصِ، عبر الاستقصاء، خصائص الضوء، وتنبّأ بسلوكه في المرايا وحين يمرّ في أوساط مختلفة
    ur: تفتیش کے ذریعے روشنی کی خصوصیات کی تحقیق کریں، اور آئینوں میں اور مختلف واسطوں سے گزرتے وقت اس کے برتاؤ کی پیش گوئی کریں
- code: E3
  text:
    en: demonstrate an understanding of characteristics and properties of light, particularly with respect to reflection and refraction and the addition and subtraction of colour
    ar: أظهِر فهمًا لخصائص الضوء، لا سيما الانعكاس والانكسار وجمع الألوان وطرحها
    ur: روشنی کی خصوصیات کی سمجھ کا مظاہرہ کریں، خاص طور پر انعکاس، انعطاف اور رنگوں کے جمع اور تفریق کے بارے میں
