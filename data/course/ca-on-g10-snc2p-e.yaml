expectations:
- code: E1
  text:
    en: analyse how properties of light and colour are applied in technology and the impact of these technologies on society
    ar: حلِّل كيف تُطبَّق خصائص الضوء واللون في التقنية، وأثر هذه التقنيات في المجتمع
