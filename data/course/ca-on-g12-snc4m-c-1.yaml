  title:
    en: Seven conditions for judging a drug
    ar: سبعة شروط للحكم على الدواء
    ur: دوا کو جانچنے کی سات شرطیں
  text:
    en: Seeing improvement after a substance is used does not, by itself, reveal what it actually did. Ibn Sina faces this problem in the Canon of Medicine, setting out seven conditions for learning drug powers through experience. The record calls this an organization of conditions within humoral medicine, not the birth of a modern clinical trial. What would you control in your own inquiry?
    ar: لا تكفي مشاهدة تحسن بعد استعمال مادة لكي تُعرف حقيقة تأثيرها. يواجه ابن سينا هذه المشكلة في مقالة من القانون في الطب ترتب سبعة شروط لمعرفة قوى الأدوية بالتجربة. ويعدّ السجل ذلك تنظيمًا لشروط التفسير داخل طب الأمزجة، لا إعلان ميلاد تجربة سريرية حديثة. ما الذي ستضبطه في استقصائك أنت؟
    ur: کسی چیز کے استعمال کے بعد بہتری دیکھ لینا بذاتِ خود یہ نہیں بتاتا کہ اس نے اصل میں کیا کیا۔ ابن سینا القانون فی الطب میں اس مسئلے کا سامنا کرتے ہیں اور تجربے سے دواؤں کی قوتیں جاننے کی سات شرطیں ترتیب دیتے ہیں۔ ریکارڈ اسے طبِ اخلاط کے اندر تعبیر کی شرطوں کی تنظیم کہتا ہے، جدید طبی آزمائش کی پیدائش کا اعلان نہیں۔ اپنی تحقیق میں آپ کس چیز کو قابو میں رکھیں گے؟
