  title:
    en: The muhtasib, the market inspector
    ar: المحتسب مراقب السوق
    ur: 'محتسب، بازار کا نگران'
  text:
    en: The muhtasib was the official charged with watching the markets, weights and measures, and prices. Following a Turkish encyclopaedia, the record says the sources name five early overseers of the markets of Mecca and Medina, among them Samra bint Nuhayk and Shifa bint Abdullah. Unlike the judge, the muhtasib may act without a complaint. Whose work today looks like this?
    ar: المحتسب هو الموظف المكلّف بالحسبة، فيراقب الأسواق والمكاييل والموازين والأسعار. ويذكر السجل، نقلًا عن موسوعة تركية، أن المصادر تسمّي خمسة من المشرفين الأوائل على الأسواق في مكة والمدينة، منهم سمراء بنت نهيك والشفاء بنت عبد الله. وبخلاف القاضي يجوز للمحتسب أن يتحرك من غير شكوى. أي عمل في زماننا يشبه هذا العمل؟
    ur: 'محتسب وہ اہلکار تھا جس کے ذمے بازاروں، پیمانوں، تولوں اور قیمتوں کی نگرانی تھی۔ ایک ترک انسائیکلوپیڈیا کے حوالے سے ریکارڈ کہتا ہے کہ مآخذ مکہ اور مدینہ کے بازاروں کے پانچ ابتدائی نگرانوں کے نام بتاتے ہیں، جن میں سمراء بنت نہیک اور شفاء بنت عبداللہ شامل ہیں۔ قاضی کے برخلاف محتسب شکایت کے بغیر بھی کارروائی کر سکتا ہے۔ آج کس کا کام اس جیسا لگتا ہے؟'
  entity: job/muhtasib
  sources:
  - source/tdv-hisbe
- position: after
  kind: place
  title:
    en: A hospital in Baghdad
    ar: مستشفى في بغداد
    ur: 'بغداد میں ایک ہسپتال'
  text:
    en: In Baghdad the Buyid ruler Adud al-Dawla built a hospital, opened at the beginning of Rabi II 372 AH. The record, following Ibn al-Jawzi, says physicians, medicines, stewards, servants, vessels and clothing were gathered there, and the poor were given the clothing and vessels that left it. Who worked in a hospital like this?
    ar: بنى عضد الدولة البويهي في بغداد بيمارستانًا افتُتح في مطلع ربيع الآخر سنة 372هـ. ويذكر السجل، نقلًا عن ابن الجوزي، أنه جُمع فيه الأطباء والأدوية والقوّام والخدم والآنية والكسوة، وأن الفقراء أُعطوا الكسوة والآنية التي خرجت منه. من كان يعمل في مستشفى كهذا؟
    ur: 'بغداد میں بویہی حکمران عضد الدولہ نے ایک ہسپتال بنوایا جو ربیع الآخر 372 ہجری کے آغاز میں کھولا گیا۔ ریکارڈ ابن الجوزی کے حوالے سے بتاتا ہے کہ وہاں طبیب، دوائیں، منتظمین، خادم، برتن اور لباس جمع کیے گئے، اور جو لباس اور برتن وہاں سے نکلے وہ غریبوں کو دیے گئے۔ ایسے ہسپتال میں کون کام کرتا تھا؟'
  entity: building/bimaristan-adudi
  sources:
  - source/muntazam-ibn-al-jawzi
