connections:
- position: before
  kind: invention
  title:
    en: An office to watch the market
    ar: منصب لمراقبة السوق
    ur: 'بازار کی نگرانی کا منصب'
  text:
    en: 'Ibn Khaldun, in the Muqaddima, describes the hisba as an office in which the ruler appoints a capable person to watch over the markets and streets. This officer looks into fraud in measures, weights and foodstuffs, keeps the streets from being blocked, orders buildings about to collapse to be pulled down, and punishes in proportion to the offence, without waiting for a complaint. What does such an office tell us about how a city was governed?'
    ar: 'يذكر ابن خلدون في المقدمة أن الحسبة ولاية يعيّن فيها الحاكم رجلًا كفئًا يتفقد الأسواق والطرق، فينظر في الغش في المكاييل والموازين والأقوات، ويمنع تضييق الطرق، ويأمر بهدم الأبنية الآيلة للسقوط، ويؤدّب على قدر المخالفة، ولا ينتظر أن تُرفع إليه شكوى. ماذا يخبرنا منصب كهذا عن طريقة حكم المدينة؟'
    ur: 'ابن خلدون مقدمہ میں حسبہ کو ایسا منصب بتاتے ہیں جس میں حکمران ایک اہل شخص کو بازاروں اور راستوں کی نگرانی پر مقرر کرتا ہے۔ یہ افسر ناپ تول اور غذائی اشیاء میں دھوکے کو دیکھتا ہے، راستوں کو تنگ ہونے سے روکتا ہے، گرنے والی عمارتوں کو گرانے کا حکم دیتا ہے، جرم کے مطابق سزا دیتا ہے، اور شکایت کا انتظار نہیں کرتا۔ ایسا منصب ہمیں شہر کے نظم و نسق کے بارے میں کیا بتاتا ہے؟'
  entity: invention/hisba
  sources:
  - source/muqaddima-ibn-khaldun
- position: within
