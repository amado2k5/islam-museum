  title:
    en: A script measured against another
    ar: خط قيس على خط
    ur: ایک خط، دوسرے کے مقابل ناپا گیا
  text:
    en: Al-Baladhuri relays a report that three men of Tayy devised the Arabic script, measuring the spelling of Arabic against the spelling of Syriac. People of al-Anbar learned it from them, then the people of al-Hira; Bishr ibn Abd al-Malik, who also learned it, later taught it in Mecca. The record notes that this is a single report from a single narrator. Who taught whom, and what did each group keep?
    ar: ينقل البلاذري خبرًا مفاده أن ثلاثة رجال من طيّئ وضعوا الخط، فقاسوا هجاء العربية على هجاء السريانية. ثم تعلّمه قوم من الأنبار، ثم أهل الحيرة، وتعلّمه بشر بن عبد الملك أيضًا ثم علّمه بعد ذلك في مكة. ويشير السجل إلى أنه خبر واحد عن راوٍ واحد. فمن علّم مَن، وماذا احتفظت به كل جماعة؟
    ur: البلاذری ایک روایت نقل کرتے ہیں کہ قبیلہ طیّئ کے تین آدمیوں نے عربی خط وضع کیا اور عربی کے ہجے کو سریانی کے ہجے سے ناپا۔ ان سے اہلِ انبار نے سیکھا، پھر اہلِ حیرہ نے؛ بشر بن عبدالملک نے بھی اسے سیکھا اور بعد میں مکہ میں سکھایا۔ ریکارڈ بتاتا ہے کہ یہ ایک ہی راوی کی ایک ہی روایت ہے۔ کس نے کس کو سکھایا، اور ہر گروہ نے کیا برقرار رکھا؟
