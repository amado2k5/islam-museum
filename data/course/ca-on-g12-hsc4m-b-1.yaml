  title:
    en: A craft moves to Baghdad
    ar: حرفة تنتقل إلى بغداد
    ur: ایک دستکاری بغداد پہنچتی ہے
  text:
    en: 'The record calls this a craft moved to a city, not paper invented again: its Chinese origin precedes Islam by centuries, and Central Asia was part of its westward spread. Osman Ersoy attributes the proposal for a paper workshop in Baghdad in 178 AH, 794–795, to al-Fadl ibn Yahya al-Barmaki, and Jonathan Bloom supports manufacture there by the late eighth century. What does a craft gain, and what does it keep, when it moves?'
    ar: 'يصف السجل ما جرى بأنه انتقال صناعة إلى مدينة لا اختراعٌ جديد للورق: فأصله الصيني يسبق الإسلام بقرون، وكانت آسيا الوسطى جزءًا من انتشاره غربًا. وينسب عثمان أرصوي اقتراح إنشاء مصنع للورق في بغداد سنة 178هـ، 794–795م، إلى الفضل بن يحيى البرمكي، ويؤيد جوناثان بلوم وجود الصناعة هناك بنهاية القرن الثامن. ماذا تكسب الحرفة حين تنتقل، وماذا تحتفظ به؟'
    ur: 'ریکارڈ اسے کسی شہر میں ایک دستکاری کی منتقلی بتاتا ہے، کاغذ کی نئی ایجاد نہیں: اس کی چینی اصل اسلام سے صدیوں پہلے کی ہے اور وسطی ایشیا مغرب کی طرف اس کے پھیلاؤ کا حصہ تھا۔ عثمان ارصوئی کے مطابق بغداد میں کاغذ کے کارخانے کی تجویز سنہ 178ھ، یعنی 794–795ء میں فضل بن یحییٰ برمکی کی طرف منسوب ہے، اور جوناتھن بلوم آٹھویں صدی کے آخر تک وہاں کاغذ سازی کی تائید کرتے ہیں۔ ایک دستکاری جب منتقل ہوتی ہے تو کیا پاتی ہے اور کیا برقرار رکھتی ہے؟'
