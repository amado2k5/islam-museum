  title:
    en: Numerals on the road from India
    ar: أرقام في طريقها من الهند إلى الغرب
    ur: ہندوستان سے مغرب تک ہندسوں کا سفر
  text:
    en: Al-Khwarizmi wrote a book in Baghdad through which the Indian numerals and the decimal system entered the Islamic world. Its Arabic original is lost, but a twelfth-century Latin translation survives that opens “Dixit Algorizmi”, “al-Khwarizmi said”. The editors of the Cairo edition of al-Khwarizmi’s Algebra write that the West learned arithmetic from it, and that his Latinized name became a name for the numerals themselves. What changed, and what stayed, as the numerals changed hands?
    ar: ألّف الخوارزمي في بغداد كتابًا دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي. ضاع أصله العربي وبقيت ترجمة لاتينية من القرن الثاني عشر تبدأ بعبارة «Dixit Algorizmi» أي «قال الخوارزمي». ويذكر محققا طبعة القاهرة لكتاب «الجبر والمقابلة» للخوارزمي أن الغرب تعلّم الحساب منها، وأن اسمه اللاتيني صار اسمًا للأرقام نفسها. ماذا تغيّر وماذا بقي حين انتقلت الأرقام من يد إلى يد؟
    ur: الخوارزمی نے بغداد میں ایک کتاب لکھی جس کے ذریعے ہندی ہندسے اور اعشاری نظام عالمِ اسلام میں داخل ہوئے۔ اس کا عربی اصل ضائع ہو گیا، مگر بارہویں صدی کا ایک لاطینی ترجمہ باقی ہے جو «Dixit Algorizmi» یعنی «الخوارزمی نے کہا» سے شروع ہوتا ہے۔ الخوارزمی کی «الجبر والمقابلہ» کے قاہرہ ایڈیشن کے مدیر لکھتے ہیں کہ مغرب نے حساب اسی سے سیکھا اور ان کا لاطینی نام خود ہندسوں کا نام بن گیا۔ ہندسے ایک ہاتھ سے دوسرے ہاتھ گئے تو کیا بدلا اور کیا باقی رہا؟
