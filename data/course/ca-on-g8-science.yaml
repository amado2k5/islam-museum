summary:
  en: 'The 2022 Ontario Grade 8 Science and Technology course has five strands: STEM Skills and Connections, Life Systems (cells), Matter and Energy (fluids), Structures and Mechanisms (systems) and Earth and Space Systems (water). The museum maps four of them; Life Systems has no honest link.'
  ar: 'لمقرر العلوم والتكنولوجيا للصف الثامن في منهاج أونتاريو 2022 خمسة محاور: مهارات العلوم والتقنية والهندسة والرياضيات وصلاتها، ومنظومات الحياة ⁦(الخلايا)⁩، والمادة والطاقة ⁦(الموائع)⁩، والمنشآت والآليات ⁦(المنظومات)⁩، ومنظومات الأرض والفضاء ⁦(الماء)⁩. ويربط المتحف أربعة منها؛ ولا صلة صادقة له بمنظومات الحياة.'
  ur: 'اونٹاریو نصاب 2022 کے آٹھویں جماعت سائنس و ٹیکنالوجی کورس کے پانچ محور ہیں: STEM کی مہارتیں اور روابط، جاندار نظام ⁦(خلیے)⁩، مادہ اور توانائی ⁦(سیال)⁩، ڈھانچے اور میکانزم ⁦(نظام)⁩، اور زمین اور خلا کے نظام ⁦(پانی)⁩۔ عجائب گھر ان میں سے چار کو جوڑتا ہے؛ جاندار نظام سے اس کا کوئی صادق ربط نہیں۔'
