  title:
    en: The architect
    ar: المعمار
    ur: معمار
  text:
    en: The architect designs a building and oversees its construction, and was expected to know geometry, building technique and the measurement of land. In the Ottoman palace the office of architects was a school where chosen young men learned theory and practice in a master-apprentice relationship. After the Imperial Land Engineering School was founded in 1795, its graduates began to qualify as architects. What would you need to study for this career?
    ar: المعمار هو من يضع تصميم البناء ويشرف على تنفيذه، وكان يُنتظر منه أن يعرف الهندسة وفن البناء ومساحة الأرض. وكان ديوان المعماريين في القصر مدرسة من مدارس القصر، يتلقى فيها فتيان مختارون دروسًا نظرية وعملية في علاقة معلّم بتلميذ. وبعد إنشاء «مدرسة المهندسخانة البرية» سنة 1795 صار المعماريون يتخرجون منها. ماذا يلزمك أن تدرس لهذه المهنة؟
    ur: معمار عمارت کا نقشہ بناتا اور اس کی تعمیر کی نگرانی کرتا ہے، اور اس سے توقع تھی کہ وہ ہندسہ، تعمیری فن اور زمین کی پیمائش جانتا ہو۔ عثمانی محل میں معماروں کا دفتر ایک مدرسہ تھا جس میں چنے ہوئے نوجوان استاد اور شاگرد کے رشتے میں نظری اور عملی تعلیم پاتے تھے۔ 1795 میں شاہی ہندسی مدرسہ قائم ہونے کے بعد اس کے فارغ التحصیل معمار کے طور پر اہل ہونے لگے۔ اس پیشے کے لیے آپ کو کیا پڑھنا ہوگا؟
  entity: job/architect
