  title:
    en: Learning the hand and earning the licence
    ar: تعلّم الخط ونيل الإجازة
    ur: خط سیکھنا اور اجازت پانا
  text:
    en: 'Training in calligraphy is called meshk: the master writes a model line, the pupil copies it and shows it to him. The licence is given once the pupil has copied a piece by an old master chosen by his teacher, and it is endorsed at a ceremony before a jury of calligraphers. UNESCO placed Arabic calligraphy on its intangible heritage list in 2021. What skills does this path ask for?'
    ar: يُسمّى التعليم «المشق»، فيكتب الأستاذ سطرًا نموذجيًا في الدرس، ويكتب التلميذ مثله ويعرضه عليه. وتتم الإجازة بعد أن يقلّد الطالب قطعة لأستاذ قديم اختاره أستاذه، وتُعقد للمجاز حفلة يحضرها خطاطون يصدّقون الإجازة كتابةً. وأدرجت اليونسكو ممارسة الخط العربي في قائمة التراث الثقافي غير المادي عام 2021. أي مهارات يطلبها هذا المسار؟
    ur: 'خطاطی کی تربیت «مشق» کہلاتی ہے: استاد ایک نمونے کی سطر لکھتا ہے، شاگرد اسی طرح لکھ کر اسے دکھاتا ہے۔ اجازت اس وقت دی جاتی ہے جب شاگرد اپنے استاد کے چنے ہوئے کسی قدیم استاد کا ٹکڑا نقل کر لے، اور خطاطوں کی ایک جیوری کے سامنے ایک تقریب میں اس کی تصدیق ہوتی ہے۔ یونیسکو نے 2021 میں عربی خطاطی کو غیر مادی ثقافتی ورثے کی فہرست میں شامل کیا۔ یہ راستہ کن مہارتوں کا تقاضا کرتا ہے؟'
  entity: job/calligrapher
