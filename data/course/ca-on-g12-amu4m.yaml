summary:
  en: 'The Ontario Grade 12 music course AMU4M: three strands, creating and presenting, reflecting and analysing, and foundations. The museum maps five of its 29 specific expectations, through the Islamic world and its neighbours only: music and community, a musician and his portrait, and the oud.'
  ar: 'مقرر الموسيقى AMU4M للصف الثاني عشر في أونتاريو: ثلاثة محاور هي الإبداع والعرض، والتأمل والتحليل، والأسس. ويربط المتحف خمسًا من توقعاته التسع والعشرين المحددة، عبر العالم الإسلامي وجواره فقط: الموسيقى والمجتمع، وموسيقي وصورته، والعود.'
  ur: 'اونٹاریو کا کورس AMU4M موسیقی برائے جماعت دوازدہم: تین شاخیں، تخلیق و پیشکش، غور و تجزیہ، اور بنیادیں۔ عجائب گھر اس کی انتیس مخصوص توقعات میں سے پانچ کو جوڑتا ہے، صرف اسلامی دنیا اور اس کے پڑوس کے ذریعے: موسیقی اور برادری، ایک موسیقار اور اس کی تصویر، اور عود۔'
  es: "El curso de música de 12.º grado de Ontario, AMU4M, se compone de tres ejes: creación y presentación, reflexión y análisis, y fundamentos. El museo aborda cinco de sus 29 objetivos específicos, centrándose exclusivamente en el mundo islámico y sus países vecinos: música y comunidad, el músico y su retrato, y el laúd."
  fr: "Le cours de musique de 12e année de l'Ontario (AMU4M) comprend trois volets: création et présentation, réflexion et analyse, et fondements. Le musée illustre cinq de ses 29 attentes spécifiques, à travers le monde islamique et ses voisins: la musique et la communauté, un musicien et son portrait, et le oud."
  tr: "Ontario'daki 12. sınıf AMU4M müzik müfredatının üç ana teması vardır: yaratım ve performans, düşünme ve analiz ile temeller. Müze, İslam dünyasına ve çevresindeki bölgelere odaklanarak, 29 özel temasından beşini bir araya getiriyor: müzik ve toplum, müzisyen ve imajı ile ud."
  id: "Kurikulum musik AMU4M untuk kelas 12 di Ontario memiliki tiga tema utama: kreasi dan pertunjukan, refleksi dan analisis, serta dasar-dasar. Museum ini menghubungkan lima dari 29 tema spesifiknya, yang berfokus sepenuhnya pada dunia Islam dan wilayah sekitarnya: musik dan masyarakat, musisi dan citranya, serta oud."
