summary:
  en: 'The Ontario Grade 12 music course AMU4M: three strands, creating and presenting, reflecting and analysing, and foundations. The museum maps five of its 29 specific expectations, through the Islamic world and its neighbours only: music and community, a musician and his portrait, and the oud.'
  ar: 'مقرر الموسيقى AMU4M للصف الثاني عشر في أونتاريو: ثلاثة محاور هي الإبداع والعرض، والتأمل والتحليل، والأسس. ويربط المتحف خمسًا من توقعاته التسع والعشرين المحددة، عبر العالم الإسلامي وجواره فقط: الموسيقى والمجتمع، وموسيقي وصورته، والعود.'
  ur: 'اونٹاریو کا کورس AMU4M موسیقی برائے جماعت دوازدہم: تین شاخیں، تخلیق و پیشکش، غور و تجزیہ، اور بنیادیں۔ عجائب گھر اس کی انتیس مخصوص توقعات میں سے پانچ کو جوڑتا ہے، صرف اسلامی دنیا اور اس کے پڑوس کے ذریعے: موسیقی اور برادری، ایک موسیقار اور اس کی تصویر، اور عود۔'
