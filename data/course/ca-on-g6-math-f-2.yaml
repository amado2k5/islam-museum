    en: The Kuwaiti encyclopaedia of jurisprudence defines saving (idkhar) as setting wealth aside for a time of need. What might a student save for, and what makes it a need?
    ur: کویتی فقہی انسائیکلوپیڈیا ادخار کو ضرورت کے وقت کے لیے مال محفوظ رکھنا بتاتی ہے۔ ایک طالب علم کس چیز کے لیے بچت کر سکتا ہے، اور اسے ضرورت کیا بناتا ہے؟
  entity: concept/idkhar-fiqh
