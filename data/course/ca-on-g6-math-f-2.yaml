  title:
    en: Excess on a debt in return for delay
    ar: زيادة في الدين مقابل الأجل
    ur: مدت کے بدلے قرض پر اضافہ
  text:
    ar: تعرّف موسوعة الفقه الكويتية الربا بأنه في اللغة الزيادة، وفي اصطلاح الفقهاء زيادة في أحد العوضين في المعاوضة، أو زيادة في الدين مقابل الأجل. وتذكر أن الفقهاء على تحريمه بالكتاب والسنة والإجماع. وهل يشمل هذا التعريف الفائدة في مصرف حديث؟ لا يجيب السجل عن ذلك. أي كلمات في هذا التعريف تقارنها بالطريقة التي يصف بها المصرف الفائدة على القرض؟
    en: The Kuwaiti encyclopaedia of jurisprudence defines riba as excess in the lexical sense; in the jurists' usage it is an excess on one of two counter-values in an exchange, or an excess on a debt in return for delay. The encyclopaedia says the jurists hold it forbidden by the Qur'an, the Sunna and consensus. Whether this definition covers interest at a modern bank is a question the record does not answer. Which words in this definition would you compare with the way a bank describes interest on a loan?
    ur: 'کویتی فقہی انسائیکلوپیڈیا ربا کی تعریف یوں کرتی ہے: لغت میں زیادتی، اور فقہاء کے ہاں عوض کے تبادلے میں کسی ایک عوض پر زیادتی، یا مدت کے بدلے قرض پر اضافہ۔ انسائیکلوپیڈیا کے مطابق فقہاء اسے قرآن، سنت اور اجماع سے حرام مانتے ہیں۔ اندراج اس کا جواب نہیں دیتا کہ آیا یہ تعریف آج کے بینک کے سود پر لاگو ہوتی ہے۔ اس تعریف کے کون سے الفاظ کا موازنہ آپ اس طریقے سے کریں گے جس سے بینک قرض پر سود کو بیان کرتا ہے؟'
  entity: concept/riba-fiqh
