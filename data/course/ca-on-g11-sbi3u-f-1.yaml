  title:
    en: Four waters and ten lands
    ar: أربعة مياه وعشر أرضين
    ur: چار پانی اور دس زمینیں
  text:
    en: In Al-Qasd wa-l-bayan, Ibn Bassal distinguishes four water sources and ten practical land types, relating observed properties to season, plants and cultivation. His soil chapter warns that the surface can differ from what lies beneath, and that judgment requires examination and repeated practical experience. The record adds that his ten categories are not a modern laboratory standard. How would your class test one of these relationships?
    ar: في «القصد والبيان» يميز ابن بصال أربعة مصادر للماء وعشرة أنواع عملية من الأرض، ثم يربط الخواص التي يلاحظها بالموسم والنبات وما تحتاجه الأرض من خدمة. وينبه في باب الأرضين إلى أن السطح قد يختلف عن الباطن، وأن الحكم يحتاج اختباراً وامتحاناً وعملاً متكرراً. ويقول السجل إن فئاته العشر ليست معياراً مخبرياً حديثاً. كيف يختبر صفّك إحدى هذه العلاقات؟
    ur: «القصد والبیان» میں ابن بصال پانی کے چار ذرائع اور زمین کی دس عملی قسموں میں فرق کرتے ہیں، اور جو خصوصیات وہ دیکھتے ہیں انہیں موسم، پودوں اور کاشت سے جوڑتے ہیں۔ زمین کے باب میں وہ خبردار کرتے ہیں کہ سطح اندر کی تہہ سے مختلف ہو سکتی ہے اور فیصلے کے لیے جانچ اور بار بار کے عملی تجربے کی ضرورت ہے۔ اندراج بتاتا ہے کہ ان کی دس قسمیں جدید تجربہ گاہی معیار نہیں ہیں۔ آپ کی کلاس ان میں سے کسی ایک تعلق کو کیسے جانچے گی؟
