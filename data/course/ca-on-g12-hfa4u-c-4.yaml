  title:
    en: Two reasons for the Ramadan fast
    ar: سببان لصيام رمضان
    ur: رمضان کے روزے کی دو وجوہ
  text:
    en: In Ramadan Muslims abstain from food and drink from dawn to sunset. The record gives Yusuf al-Qaradawi saying that fasting was known to earlier nations and that it trains the will by giving up what is lawful. It gives al-Sha'rawi, in a different programme, saying that the aim of the fast is God-consciousness and the purification of the self, not that the one who fasts should feel the hunger of the poor. What does each reason say about why people adopt it?
    ar: في شهر رمضان يصوم المسلمون فيمتنعون عن الطعام والشراب من الفجر إلى الغروب. ويذكر السجل أن يوسف القرضاوي يقول إن الصيام كان معروفًا عند الأمم السابقة وإنه تربية للإرادة بترك الحلال. ويذكر أن الشعراوي يقول في برنامج آخر إن غاية الصيام المفروض التقوى وتزكية النفس، لا أن يشعر الصائم بجوع الفقير. فماذا يقول كل سبب عن علّة تبنّي هذا النمط؟
    ur: رمضان میں مسلمان فجر سے غروب تک کھانے اور پینے سے رکتے ہیں۔ ریکارڈ بتاتا ہے کہ یوسف القرضاوی کہتے ہیں کہ روزہ پچھلی امتوں میں بھی معروف تھا اور وہ حلال کو چھوڑ کر ارادے کی تربیت ہے۔ وہ یہ بھی بتاتا ہے کہ شعراوی ایک اور پروگرام میں کہتے ہیں کہ فرض روزے کی غایت تقویٰ اور تزکیۂ نفس ہے، یہ نہیں کہ روزے دار غریب کی بھوک محسوس کرے۔ ہر وجہ اس بارے میں کیا کہتی ہے کہ یہ انداز کیوں اپنایا جاتا ہے؟
