  title:
    en: Plato read through the Neoplatonists
    ar: أفلاطون مقروءًا عبر الأفلاطونيين المحدثين
    ur: نو افلاطونیوں کے ذریعے پڑھا گیا افلاطون
  text:
    en: "The Encyclopaedia of Islam says most Arab thinkers subordinated Plato to Aristotle but recognised a common purpose between the two, and read him through the Neoplatonists Plotinus, Porphyry and Proclus. It adds that no Arabic translation of a dialogue has been traced. How does a tradition travel when its main texts do not?"
    ar: "تذكر الموسوعة الإسلامية أن أكثر المفكرين العرب جعلوا أفلاطون دون أرسطو لكنهم رأوا بينهما غاية مشتركة، وقرأوه من خلال الأفلاطونيين المحدثين أفلوطين وفورفوريوس وبروقلس. وتضيف أنه لم يُعثر على ترجمة عربية لمحاورة واحدة. كيف ينتقل تقليد فلسفي حين لا تنتقل نصوصه الرئيسة؟"
    ur: "اسلامی انسائیکلوپیڈیا بتاتی ہے کہ بیشتر عرب مفکرین نے افلاطون کو ارسطو کے ماتحت رکھا مگر دونوں میں مشترک مقصد مانا، اور اسے نو افلاطونیوں افلوطین، فرفوریوس اور پروکلس کے ذریعے پڑھا۔ وہ یہ بھی کہتی ہے کہ کسی ایک مکالمے کا عربی ترجمہ نہیں ملا۔ جب کسی روایت کی بنیادی تحریریں نہ پہنچیں تو وہ روایت کیسے منتقل ہوتی ہے؟"
