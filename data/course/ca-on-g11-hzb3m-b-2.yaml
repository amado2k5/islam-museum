  title:
    en: Aristotle and his Arabic interpreters
    ar: أرسطو ومفسّروه بالعربية
    ur: ارسطو اور عربی میں اس کے شارحین
  text:
    en: Ibn al-Nadim says Aristotle, son of Nicomachus, took from Plato and succeeded him, and that his books on logic, natural science and theology were translated into Arabic. They were interpreted, he says, by Alexander of Aphrodisias, Themistius, Yahya al-Nahwi, al-Farabi, al-Kindi and others. Where would a student of this tradition look for its Arabic voices?
    ar: يقول ابن النديم إن أرسطاطاليس بن نيقوماخوس أخذ عن أفلاطون وخلفه، وإن كتبه في المنطق والطبيعيات والإلهيات نقلت إلى العربية. ويذكر أنها فسرها الإسكندر الأفروديسي وثامسطيوس ويحيى النحوي والفارابي والكندي وغيرهم. أين يبحث دارس هذا التقليد عن أصواته العربية؟
    ur: ابن الندیم کہتے ہیں کہ ارسطاطالیس بن نیقوماخوس نے افلاطون سے لیا اور ان کے جانشین ہوئے، اور ان کی منطق، طبیعیات اور الٰہیات کی کتابیں عربی میں منتقل ہوئیں۔ وہ بتاتے ہیں کہ ان کی شرح اسکندر افرودیسی، ثامسطیوس، یحییٰ نحوی، فارابی، کندی اور دوسروں نے کی۔ اس روایت کا طالب علم اس کی عربی آوازیں کہاں تلاش کرے؟
