  title:
    en: Studying under a master of medicine
    ar: الدراسة على شيخ الطب
    ur: طب کے استاد سے تعلیم
  text:
    en: Ibn al-Nafis studied medicine under the shaykh Muhadhdhib al-Din al-Dakhwar, Damascus's shaykh of medicine, and excelled in the craft and in treatment. Al-Dakhwar died in 628/1230, so the apprenticeship predates that year. A television programme, Tariq al-Suwaydan's al-Mubdi'un, adds that he enrolled at the Nuri hospital in Damascus, but its dates for his turn to medicine do not agree with the date of al-Dakhwar's death. What does this show about how a physician was trained in his day?
    ar: اشتغل ابن النفيس في الطب على الشيخ مهذب الدين الدخوار، شيخ الطب بدمشق، فبرع في الصناعة والعلاج. والدخوار متوفى سنة ٦٢٨هـ، فيكون الاشتغال عليه قبل ذلك. ويضيف برنامج تلفزيوني، «المبدعون» لطارق السويدان، أنه التحق بالمستشفى النوري بدمشق، لكن تواريخه لتحوله إلى الطب لا تتفق مع تاريخ وفاة الدخوار. ماذا يدلّ هذا على طريقة تدريب الطبيب في زمانه؟
    ur: ابن نفیس نے دمشق کے شیخِ طب مہذب الدین دخوار سے طب کی تعلیم حاصل کی اور فن اور علاج دونوں میں کمال پایا۔ دخوار کی وفات 628 ہجری میں ہوئی، اس لیے ان سے تعلیم اس سے پہلے ہوئی۔ ایک ٹیلی ویژن پروگرام، طارق السویدان کا «المبدعون»، مزید بتاتا ہے کہ وہ دمشق کے نوری ہسپتال میں داخل ہوئے، مگر اس کی تاریخیں ان کے طب کی طرف آنے کے بارے میں دخوار کی وفات کی تاریخ سے میل نہیں کھاتیں۔ اس سے ظاہر ہوتا ہے کہ اس زمانے میں طبیب کی تربیت کیسے ہوتی تھی؟
