  title:
    en: Chief physician of Egypt
    ar: رئيس أطباء مصر
    ur: مصر کے رئیس الاطباء
  text:
    en: 'Headship of medicine in Egypt came to rest with him: he was made Chief Physician of Egypt and personal physician of sultan Baybars, within Baybars''s reign of 658–676/1260–1277. The record adds that he also lectured on Shafi''i law at the Masruriyya madrasa, where the grammarian Abu Hayyan al-Gharnati was his disciple in logic. Which of these roles would you call a career in medicine?'
    ar: انتهت إليه رياسة الطب بالديار المصرية، فصار رئيس أطباء مصر والطبيب الخاص للسلطان الظاهر بيبرس، وذلك في عهد بيبرس ٦٥٨–٦٧٦هـ. ويضيف السجل أنه درّس الفقه الشافعي بالمدرسة المسرورية، وكان النحوي أبو حيان الغرناطي تلميذه في المنطق. أي هذه الأدوار تعدّها مهنة في الطب؟
    ur: 'مصر میں طب کی سربراہی انہی پر آ ٹھہری: وہ مصر کے رئیس الاطباء اور سلطان ظاہر بیبرس کے خصوصی طبیب بنائے گئے، اور یہ بیبرس کے دور 658–676 ہجری میں ہوا۔ اندراج مزید بتاتا ہے کہ انہوں نے مدرسہ مسروریہ میں شافعی فقہ پڑھائی، جہاں نحوی ابو حیان غرناطی منطق میں ان کے شاگرد تھے۔ ان میں سے کون سے کردار کو آپ طب کا پیشہ کہیں گے؟'
