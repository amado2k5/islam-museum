  title:
    en: From the Nuri hospital to Cairo
    ar: من البيمارستان النوري إلى القاهرة
    ur: نوری ہسپتال سے قاہرہ تک
  text:
    en: According to the record on the pulmonary circulation, Ibn al-Nafis was born in or near Damascus and trained in medicine at its Nuri hospital. At 23 he moved to Cairo, where he worked first at the Nasiri hospital and then at the Mansuri hospital, becoming its chief physician. The sources differ on his birth year. Which stages of this path were learning, and which were work?
    ar: وُلد ابن النفيس في دمشق أو قريباً منها، وتعلّم الطب في البيمارستان النوري بها. ولمّا بلغ الثالثة والعشرين انتقل إلى القاهرة، فعمل في البيمارستان الناصري ثم في البيمارستان المنصوري، وصار فيه رئيس الأطباء. وتختلف المصادر في سنة مولده. أي مراحل هذا المسار كانت تعلّماً، وأيها كانت عملاً؟
    ur: پھیپھڑوں کی دورانِ خون کے اندراج کے مطابق ابن نفیس دمشق یا اس کے قریب پیدا ہوئے اور وہاں کے نوری ہسپتال میں طب سیکھی۔ تئیس برس کی عمر میں وہ قاہرہ گئے، جہاں پہلے ناصری ہسپتال اور پھر منصوری ہسپتال میں کام کیا اور اس کے رئیس الاطباء بنے۔ ان کی پیدائش کے سال پر ماخذ مختلف ہیں۔ اس راستے کے کون سے مرحلے سیکھنا تھے اور کون سے کام؟
