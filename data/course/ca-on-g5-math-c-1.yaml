  title:
    en: Finding an unknown number
    ar: إيجاد عدد مجهول
    ur: نامعلوم عدد کی تلاش
  text:
    en: Algebra, al-jabr wal-muqabala, is the art of finding an unknown number from known ones through an equation. Al-Khwarizmi set it out in Baghdad under the caliph al-Ma'mun in a concise book, for people's needs in inheritance, bequests, trade and land measurement. The TDV biography of al-Khwarizmi describes his drawing with squares and rectangles as a geometric representation and verification of the solution, and TDV notes that his algebra was wholly in words, with no symbols. How could you show the same unknown in words, in a drawing and in symbols?
    ar: علم الجبر والمقابلة صناعة يُستخرج بها العدد المجهول من الأعداد المعلومة بمعادلة بينها. وضعه محمد بن موسى الخوارزمي في بغداد في عهد الخليفة المأمون في كتاب مختصر، لما يلزم الناس في مواريثهم ووصاياهم وتجاراتهم ومساحة أرضيهم. وتصف سيرة الخوارزمي في موسوعة TDV رسمه بالمربعات والمستطيلات بأنه تمثيل هندسي للحل التحليلي والتحقق منه، وتذكر موسوعة TDV أن جبره كان كله بالكلمات بلا رموز. كيف تُظهر المجهول نفسه بالكلمات وبالرسم وبالرموز؟
    ur: علمِ جبر و مقابلہ ایسا فن ہے جس سے معلوم اعداد کے ساتھ ایک مساوات کے ذریعے نامعلوم عدد نکالا جاتا ہے۔ محمد بن موسیٰ خوارزمی نے اسے بغداد میں خلیفہ مامون کے دور میں ایک مختصر کتاب میں ترتیب دیا، لوگوں کی وراثت، وصیتوں، تجارت اور زمین کی پیمائش کی ضرورتوں کے لیے۔ TDV میں خوارزمی کی سوانح بتاتی ہے کہ مربعوں اور مستطیلوں کی اس کی ڈرائنگ حل کی ایک ہندسی نمائندگی اور اس کی تصدیق ہے، اور TDV لکھتی ہے کہ اس کا جبر پورا الفاظ میں تھا، علامتوں کے بغیر۔ ایک ہی نامعلوم کو الفاظ، ڈرائنگ اور علامتوں میں کیسے دکھایا جائے؟
