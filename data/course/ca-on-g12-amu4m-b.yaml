expectations:
- code: B1
  text:
    en: use the critical analysis process when responding to, analysing, reflecting on, and interpreting music
    ar: استخدم عملية التحليل النقدي عند الاستجابة للموسيقى وتحليلها والتأمل فيها وتفسيرها
    ur: موسیقی پر ردِّعمل ظاہر کرتے، اس کا تجزیہ کرتے، اس پر غور کرتے اور اس کی تعبیر کرتے وقت تنقیدی تجزیے کا عمل استعمال کریں
- code: B2
  text:
    en: demonstrate an understanding of social and cultural influences on and effects and functions of traditional, commercial, and art music
    ar: أظهر فهمًا للتأثيرات الاجتماعية والثقافية في الموسيقى التقليدية والتجارية والفنية، ولآثارها ووظائفها
    ur: روایتی، تجارتی اور فنی موسیقی پر سماجی اور ثقافتی اثرات، اور اس کے اثرات اور کاموں کی سمجھ کا مظاہرہ کریں
