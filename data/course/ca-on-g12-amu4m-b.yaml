label:
  en: 'Strand B: Reflecting, Responding, and Analysing'
  ar: 'المحور ب: التأمل والاستجابة والتحليل'
  ur: 'شاخ ب: غور، ردِّعمل اور تجزیہ'
  es: "Eje B: Reflexión, respuesta y análisis"
  fr: "Volet B: Réfléchir, répondre et analyser"
  tr: "B Ekseni: Yansıma, Tepki ve Analiz"
  id: "Sumbu B: Refleksi, Respons, dan Analisis"
summary:
  en: How music reflects the community that made it and what it does there, and how to weigh information about musicians; the museum offers examples from the Islamic world and its neighbours (B1.4, B2.1, B2.2, B2.3).
  ar: 'كيف تعكس الموسيقى المجتمع الذي صنعها وماذا تفعل فيه، وكيف تُوزن المعلومات عن الموسيقيين؛ ويقدّم المتحف أمثلة من العالم الإسلامي وجواره: B1.4 وB2.1 وB2.2 وB2.3.'
  ur: 'موسیقی اپنی برادری کو کیسے ظاہر کرتی ہے اور وہاں کیا کام کرتی ہے، اور موسیقاروں کے بارے میں معلومات کو کیسے پرکھا جائے؛ عجائب گھر اسلامی دنیا اور اس کے پڑوس سے مثالیں دیتا ہے: B1.4، B2.1، B2.2، B2.3۔'
  es: "Cómo la música refleja la comunidad que la creó y qué función cumple allí, y cómo sopesar la información sobre los músicos; el museo ofrece ejemplos del mundo islámico y sus vecinos (B1.4, B2.1, B2.2, B2.3)."
  fr: "Comment la musique reflète la communauté qui l’a créée et ce qu’elle y fait, et comment pondérer les informations sur les musiciens; le musée propose des exemples du monde islamique et de ses voisins (B1.4, B2.1, B2.2, B2.3)."
  tr: "Müzik, onu yaratan toplumu nasıl yansıtır ve bu toplumda ne gibi bir rol oynar? Müzisyenler hakkındaki bilgiler nasıl değerlendirilir? Müze, İslam dünyasından ve çevresinden örnekler sunmaktadır: B1.4, B2.1, B2.2 ve B2.3."
  id: "Bagaimana musik mencerminkan masyarakat yang menciptakannya dan apa perannya di dalamnya, serta bagaimana informasi tentang para musisi dipertimbangkan? Museum ini menyajikan contoh-contoh dari dunia Islam dan sekitarnya: B1.4, B2.1, B2.2 dan B2.3."
