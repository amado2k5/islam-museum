- position: after
  kind: scholar
  title:
    en: The shaykh of medicine in Egypt
    ar: شيخ الطب في الديار المصرية
    ur: مصر میں طب کے شیخ
  text:
    en: Ibn al-Imad writes in Shadharat al-Dhahab that Ibn al-Nafis wrote a work on medicine, al-Shamil, whose index showed it would run to 300 volumes, of which he fair-copied eighty, and that he dictated his works from memory. John B. West (2008) writes that, in his commentary on the anatomy of Ibn Sina's Canon, he described blood passing from the right ventricle through the lungs to the left ventricle. Whose work in medicine or engineering does your own class already know, and where would you read about it?
    ar: يكتب ابن العماد في «شذرات الذهب» أن ابن النفيس ألّف في الطب كتاب «الشامل» الذي تدل فهرسته على أنه يبلغ ثلثمائة مجلدة، بيّض منها ثمانين، وأنه كان يملي تصانيفه من حفظه. ويكتب جون ب. وست (2008) أنه وصف في شرحه لتشريح «القانون» لابن سينا مرور الدم من البطين الأيمن عبر الرئتين إلى البطين الأيسر. فمن أصحاب العمل في الطب أو الهندسة يعرف صفّك، وأين تقرأ عنهم؟
    ur: ابن العماد «شذرات الذہب» میں لکھتے ہیں کہ ابن النفیس نے طب میں «الشامل» تصنیف کی جس کی فہرست کے مطابق وہ تین سو جلدوں کی ہوتی، جن میں سے اس نے اسی جلدیں صاف نقل کیں، اور یہ کہ وہ اپنی تصانیف یادداشت سے املا کراتا تھا۔ جان بی ویسٹ (2008) لکھتے ہیں کہ ابن سینا کی «القانون» کی تشریح پر اپنی شرح میں اس نے خون کے دائیں بطین سے پھیپھڑوں کے راستے بائیں بطین تک پہنچنے کو بیان کیا۔ طب یا انجینئرنگ میں آپ کی اپنی جماعت کن لوگوں کے کام کو جانتی ہے، اور ان کے بارے میں کہاں پڑھا جا سکتا ہے؟
  entity: person/ibn-al-nafis
