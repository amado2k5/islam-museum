connections:
- position: before
  kind: career
  title:
    en: An engineer at a royal court
    ar: مهندس في بلاط أمير
    ur: ایک امیر کے دربار کا انجینئر
  text:
    en: Al-Jazari was an engineer who wrote a book on mechanical devices. The TDV Islamic Encyclopedia records that he served the Artuqids at Amid between 1181 and 1206 and that his book was commissioned by Nasir al-Din Mahmud. Its six divisions cover clocks, vessels for drinking and banquets, handwashing and bloodletting vessels, fountains and automatic musical instruments, water-raising machines and miscellaneous devices. What problem would each kind of device solve for the people who used it?
    ar: كان الجزري مهندسًا ألّف كتابًا في الآلات الميكانيكية. تذكر موسوعة TDV الإسلامية أنه خدم الأرتقيين في آمد بين 1181 و1206م، وأن كتابه ألّفه بطلب من ناصر الدين محمود. وللكتاب ستة أقسام تشمل الساعات، وأواني الشرب والمآدب، وأواني غسل اليدين والفصد، والنوافير والآلات الموسيقية الآلية، وآلات رفع الماء، والآلات المتفرقة. أي مشكلة كان كل نوع من هذه الآلات يحلّها لمن يستعمله؟
    ur: 'جزری ایک انجینئر تھا جس نے میکانی آلات پر کتاب لکھی۔ ٹی ڈی وی اسلامی انسائیکلوپیڈیا بتاتی ہے کہ اس نے 1181 سے 1206 عیسوی تک آمد میں ارتقی حکمرانوں کی خدمت کی اور اس کی کتاب ناصر الدین محمود کی فرمائش پر لکھی گئی۔ کتاب کے چھ حصے ہیں: گھڑیاں، مشروب اور ضیافت کے برتن، ہاتھ دھونے اور فصد کے برتن، فوارے اور خودکار موسیقی کے آلات، پانی اٹھانے کی مشینیں، اور متفرق آلات۔ ان میں سے ہر قسم استعمال کرنے والوں کے لیے کون سا مسئلہ حل کرتی تھی؟'
  entity: person/al-jazari-engineer
