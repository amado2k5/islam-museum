- position: within
  kind: invention
  title:
    en: A handbook of materials, instruments and operations
    ar: دليل للمواد والآلات والعمليات
    ur: مادوں، آلات اور عملیات کی رہنما کتاب
  text:
    en: The Book of Secrets, attributed to Abu Bakr al-Razi, opens by announcing materials, then instruments, then operations, and gives the earthy materials six nested classes. The record calls this an organized handbook and classification, not the invention of matter or of all chemistry, and notes that it is an alchemical book whose aims and explanations do not coincide with present chemistry. What would you ask about a scientist whose work you wanted to describe?
    ar: يعلن افتتاح «كتاب الأسرار»، المنسوب إلى أبي بكر الرازي، ترتيباً يبدأ بالمواد ثم الآلات ثم العمليات، وتنقسم المواد الأرضية داخله إلى ست فئات. ويرى السجل أن هذه المساهمة تنظيم دليل وتصنيف متداخل، لا اختراع المادة أو جميع الكيمياء، وأن الكتاب ينتمي إلى صناعة قديمة ذات أهداف وتصورات لا تتطابق مع الكيمياء الحالية. ماذا تسأل عن عالم تريد وصف إسهامه؟
    ur: کتاب الاسرار، جو ابوبکر رازی سے منسوب ہے، ایسی ترتیب کا اعلان کرتی ہے جو پہلے مادوں سے، پھر آلات سے، پھر عملیات سے شروع ہوتی ہے، اور زمینی مادوں کی چھ تہہ در تہہ قسمیں بناتی ہے۔ اندراج اسے رہنما کتاب اور درجہ بندی کی تنظیم کہتا ہے، نہ کہ مادے یا پوری کیمیا کی ایجاد، اور بتاتا ہے کہ یہ ایک کیمیا گری کی کتاب ہے جس کے مقاصد اور تصورات موجودہ کیمیا سے مطابقت نہیں رکھتے۔ جس سائنس دان کا کام آپ بیان کرنا چاہتے ہیں اس کے بارے میں آپ کیا پوچھیں گے؟
