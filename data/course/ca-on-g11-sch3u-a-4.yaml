  title:
    en: The perfumer and druggist
    ar: العطّار
    ur: عطّار
  text:
    en: The record says the 'attar was originally a dealer in perfumes and drugs, and the word came to mean chemist and herbal practitioner. His trade combined commerce, science and medicine. Al-Dimashqi said he had to know the diverse drugs, their good and bad varieties and what was fraudulent, and how they could be preserved or reconstituted. What education and training would such a trade ask for today?
    ar: يقول السجل إن العطّار كان في الأصل بائع العطور والأدوية، ثم صار اللفظ يعني الصيدلي والمعالج بالأعشاب، وإن حرفته تجمع بين التجارة والعلم والطب. وقال الدمشقي إن عليه أن يعرف الأدوية المتنوعة، جيّدها ورديئها وما يُغشّ منها، وكيف يُحفظ أو يُعاد تركيبه. ما التعليم والتدريب اللذان تطلبهما حرفة كهذه اليوم؟
    ur: اندراج کہتا ہے کہ عطّار اصل میں عطروں اور دواؤں کا بیچنے والا تھا، پھر یہ لفظ دوا ساز اور جڑی بوٹیوں کے معالج کے معنی میں آیا، اور اس کا پیشہ تجارت، علم اور طب کو جمع کرتا تھا۔ دمشقی نے کہا کہ اسے طرح طرح کی دوائیں جاننی چاہییں، ان کی اچھی اور ردی قسمیں اور وہ جن میں ملاوٹ کی جاتی ہے، اور یہ بھی کہ انھیں کیسے محفوظ رکھا یا دوبارہ ترتیب دیا جائے۔ ایسے پیشے کے لیے آج کون سی تعلیم اور تربیت درکار ہوگی؟
  entity: practice/attar-druggist
  sources:
