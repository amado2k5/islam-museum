expectations:
- code: B1.1
  text:
    en: read and represent whole numbers up to and including one million, using appropriate tools and strategies, and describe various ways they are used in everyday life
    ar: اقرأ الأعداد الكلية حتى المليون ومعه ومثّلها، مستخدمًا الأدوات والاستراتيجيات المناسبة، وصِف طرقًا متنوعة تُستعمل بها في الحياة اليومية
    ur: مکمل اعداد کو دس لاکھ تک اور اس سمیت پڑھیں اور مناسب اوزاروں اور حکمتِ عملیوں سے ظاہر کریں، اور بیان کریں کہ روزمرہ زندگی میں وہ کن مختلف طریقوں سے استعمال ہوتے ہیں
- code: B2.4
  text:
    en: represent and solve problems involving the addition and subtraction of whole numbers and decimal numbers, using estimation and algorithms
    ar: مثّل مسائل الجمع والطرح للأعداد الكلية والأعداد العشرية وحلّها، مستخدمًا التقدير والخوارزميات
    ur: تخمین اور الگورتھم کے ذریعے مکمل اعداد اور اعشاری اعداد کے جمع اور تفریق کے مسائل ظاہر کریں اور حل کریں
- code: B2.7
  text:
    en: represent and solve problems involving the multiplication of three-digit whole numbers by decimal tenths, using algorithms
    ar: مثّل مسائل ضرب الأعداد الكلية ذات الأرقام الثلاثة في أعشار عشرية وحلّها، مستخدمًا الخوارزميات
    ur: الگورتھم کے ذریعے تین ہندسوں والے مکمل اعداد کو اعشاری دسویں حصوں سے ضرب دینے کے مسائل ظاہر کریں اور حل کریں
- code: B2.8
  text:
    en: represent and solve problems involving the division of three-digit whole numbers by decimal tenths, using appropriate tools, strategies, and algorithms, and expressing remainders as appropriate
    ar: مثّل مسائل قسمة الأعداد الكلية ذات الأرقام الثلاثة على أعشار عشرية وحلّها، مستخدمًا الأدوات والاستراتيجيات والخوارزميات المناسبة، وعبّر عن البواقي بما يناسب
    ur: مناسب اوزاروں، حکمتِ عملیوں اور الگورتھم کے ذریعے تین ہندسوں والے مکمل اعداد کو اعشاری دسویں حصوں پر تقسیم کرنے کے مسائل ظاہر کریں اور حل کریں، اور باقی کو مناسب طور پر بیان کریں
connections:
- position: before
  kind: invention
  title:
    en: Nine numerals and a zero
    ar: تسعة أرقام وصفر
    ur: نو ہندسے اور ایک صفر
  text:
    ar: 'الحساب الهندي طريقةٌ في كتابة الأعداد وحسابها بتسعة أرقام وصفر، تأخذ فيها كل خانة قيمتها من موضعها: آحاد ثم عشرات ثم مئات ثم ألوف. ألّف فيها الخوارزمي في بغداد كتاباً دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي، بحسب موسوعة TDV. ويُجمع بها ويُطرح ويُضرب ويُقسم كتابةً بخطوات مرتبة. ما الخطوات التي تتبعها حين تجمع بيدك؟'
    en: 'Algorism is a way of writing and working numbers with nine numerals and a zero, each place taking its value from its position: units, tens, hundreds, thousands. Al-Khwarizmi wrote a book on it in Baghdad through which, says the TDV encyclopaedia, the Indian numerals and the decimal system entered the Islamic world. Numbers are added, subtracted, multiplied and divided in writing by ordered steps. Which steps do you follow when you add by hand?'
    ur: 'ہندی حساب اعداد کو نو ہندسوں اور ایک صفر سے لکھنے اور ان سے حساب کرنے کا طریقہ ہے، جس میں ہر خانہ اپنی قیمت اپنے مقام سے لیتا ہے: اکائیاں، پھر دہائیاں، پھر سینکڑے، پھر ہزار۔ خوارزمی نے بغداد میں اس پر ایک کتاب لکھی، جس کے ذریعے ٹی ڈی وی کے مطابق ہندی ہندسے اور اعشاری نظام عالمِ اسلام میں داخل ہوئے۔ اس سے جمع، تفریق، ضرب اور تقسیم مرتب قدموں کے ساتھ لکھ کر کی جاتی ہے۔ ہاتھ سے جمع کرتے وقت آپ کون سے قدم اٹھاتے ہیں؟'
