summary:
  en: The Ontario Grade 12 university-preparation course Physics (SPH4U) has six strands. The museum maps three of them, with five lessons, through engineers and scholars of the Islamic world; the strands on energy and momentum, fields, and modern physics have no honest link.
  ar: لمقرر الفيزياء SPH4U للصف الثاني عشر الجامعي في أونتاريو ستة محاور. ويربط المتحف ثلاثة منها بخمسة دروس من خلال مهندسي العالم الإسلامي وعلمائه؛ أما محاور الطاقة والزخم، والمجالات، والفيزياء الحديثة فلا صلة صادقة له بها.
  ur: اونٹاریو کے جماعت دوازدہم کے جامعاتی کورس طبیعیات SPH4U کے چھ محور ہیں۔ عجائب گھر ان میں سے تین کو پانچ اسباق کے ساتھ عالمِ اسلام کے انجینئروں اور علما کے ذریعے جوڑتا ہے؛ توانائی اور معیارِ حرکت، میدانوں اور جدید طبیعیات کے محوروں سے اس کا کوئی صادق ربط نہیں۔
