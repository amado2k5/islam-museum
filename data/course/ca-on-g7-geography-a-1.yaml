  title:
    en: A great dam in Yemen
    ar: سد عظيم في اليمن
    ur: یمن کا ایک عظیم بند
  text:
    en: The Marib Dam is the dam whose construction began in the time of the Mukarribs of Saba, in the centuries before 650 BCE, and it holds a great place in the history of Yemen. Al-Raheeq al-Makhtum says breaches began to appear in it, and then came the great flood the Qur'an refers to as the flood of al-Aram, in 450 or 451 CE by the estimate of its author, al-Mubarakpuri, a major event that ruined settlements and scattered peoples. How can one dam shape a land's life and, when it fails, undo it?
    ar: سد مأرب سدٌّ بدأ بناؤه في عهد مكاربة سبأ، في القرون التي سبقت سنة 650 ق.م، وله مكانة عظيمة في تاريخ اليمن. ويذكر الرحيق المختوم أن الشقوق بدأت تظهر فيه، ثم جاء السيل العظيم الذي يشير إليه القرآن بسيل العرم، سنة 450 أو 451م بتقدير مؤلفه المباركفوري، وكان حدثًا جللًا أدى إلى خراب المساكن وتفرّق الناس. كيف يصنع سدٌّ واحد حياة أرض، ثم يهدمها إذا انهار؟
    ur: سدِ مأرب وہ بند ہے جس کی تعمیر سبا کے مکاربوں کے زمانے میں، 650 قبل مسیح سے پہلے کی صدیوں میں، شروع ہوئی، اور یمن کی تاریخ میں اس کا بڑا مقام ہے۔ الرحیق المختوم بتاتی ہے کہ اس میں شگاف پڑنے لگے، پھر وہ عظیم سیلاب آیا جسے قرآن سیلِ عرم کے نام سے ذکر کرتا ہے، اس کے مصنف مبارکپوری کے اندازے سے 450 یا 451 عیسوی میں، ایک بڑا واقعہ جس نے بستیاں اجاڑ دیں اور لوگوں کو بکھیر دیا۔ ایک بند زمین کی زندگی کیسے بناتا ہے، اور ٹوٹنے پر اسے کیسے اجاڑ دیتا ہے؟
