  title:
    en: A canal for a city
    ar: نهر لمدينة
    ur: ایک شہر کے لیے نہر
  text:
    en: Al-Baladhuri reports that Umar ibn al-Khattab ordered Abu Musa al-Ash'ari to dig a canal for the people of Basra, and the digging began from a place called al-Ijana. Abu Musa led the canal three farsakhs until it reached Basra, and the canal of al-Ubulla reached four farsakhs. The account adds that people used to drink from the monastery of Qawaws on the Tigris. What does a dug channel change for the life of a city?
    ar: يروي البلاذري أن عمر بن الخطاب أمر أبا موسى الأشعري أن يحتفر لأهل البصرة نهرًا، فبدأ الحفر من موضع يسمى الإجانة. وقاد أبو موسى النهر ثلاثة فراسخ حتى بلغ البصرة، وبلغ طول نهر الأبلة أربعة فراسخ. ويضيف الخبر أن الناس كانوا يشربون من دير قاووس في دجلة. ماذا يغيّر النهر المحفور في حياة مدينة؟
    ur: البلاذری بتاتے ہیں کہ عمر بن الخطاب نے ابو موسیٰ اشعری کو حکم دیا کہ وہ بصرہ والوں کے لیے نہر کھودیں، اور کھدائی الاِجانہ نامی جگہ سے شروع ہوئی۔ ابو موسیٰ نے نہر کو تین فرسخ لے جا کر بصرہ تک پہنچایا، اور نہرِ ابلہ کی لمبائی چار فرسخ تک پہنچی۔ بیان میں ہے کہ لوگ دجلہ پر واقع قاووس کی خانقاہ سے پانی پیتے تھے۔ کھودی ہوئی نہر کسی شہر کی زندگی میں کیا تبدیلی لاتی ہے؟
