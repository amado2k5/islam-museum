  title:
    en: Levelling a tunnel underground
    ar: تسوية نفقٍ تحت الأرض
    ur: زیرِ زمین سرنگ کی سطح بندی
  text:
    en: In The Extraction of Hidden Waters, Abu Bakr al-Karaji describes levelling and surveying procedures within a manual that follows water from exploration to maintenance. The record explains a qanat as a gently sloping underground tunnel that brings water out by gravity, with vertical shafts for working, access and maintenance, and it says Karaji refined an older tradition rather than inventing qanats. How could a builder choose a tunnel's route before any water flowed?
    ar: يشرح أبو بكر الكرجي في «إنباط المياه الخفية» طرائق التسوية وضبط مسار الحفر، ضمن كتاب يتابع الماء من البحث عنه إلى صيانة القناة. ويصف السجل القناة الجوفية بأنها نفق ذو انحدار لطيف يُخرج الماء بالجاذبية، وتتصل به فتحات رأسية للعمل والوصول والصيانة، ويقول إن الكرجي حسّن تقليدًا أقدم ولم يخترع القنوات. كيف يختار الحافر مسار نفقٍ قبل أن يجري فيه ماء؟
    ur: ابو بکر الکرجی اپنی کتاب «استخراجِ پوشیدہ پانی» میں سطح بندی اور کھدائی کا راستہ متعین کرنے کے طریقے بیان کرتے ہیں، ایک ایسے رسالے میں جو پانی کی تلاش سے لے کر نالی کی دیکھ بھال تک اس کے ساتھ چلتا ہے۔ ریکارڈ قنات کو ہلکی ڈھلان والی زیرِ زمین سرنگ بتاتا ہے جو کشش ثقل سے پانی باہر لاتی ہے، جس سے کام، رسائی اور دیکھ بھال کے لیے عمودی راستے جڑے ہوتے ہیں؛ اور کہتا ہے کہ کرجی نے ایک پرانی روایت کو بہتر کیا، قناتوں کو ایجاد نہیں کیا۔ پانی بہنے سے پہلے کھدائی کرنے والا سرنگ کا راستہ کیسے چنے؟
  entity: invention/karaji-qanat-surveying
