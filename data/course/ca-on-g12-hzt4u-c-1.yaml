  title:
    en: Decree and the servant's deed
    ar: القدر وفعل العبد
    ur: قدر اور بندے کا فعل
  text:
    en: "Ibn Taymiyya says in al-'Aqida al-Wasitiyya that the servants have power over their deeds and will, and God is the creator of their power and will. Ibn Qudama says in Lum'at al-I'tiqad that the servant has a deed and an acquisition, requited by reward or punishment. Which question about freedom do these answers address?"
    ar: "يقول ابن تيمية في «العقيدة الواسطية» إن للعباد قدرة على أعمالهم وإرادة، وإن الله خالقهم وخالق قدرتهم وإرادتهم؛ ويقول ابن قدامة في «لمعة الاعتقاد» إن للعبد فعلًا وكسبًا يُجازى عليه ثوابًا أو عقابًا. أي سؤال عن الحرية تجيب عنه هذه الأقوال؟"
    ur: "ابن تیمیہ «العقیدہ الواسطیہ» میں کہتے ہیں کہ بندوں کو اپنے اعمال پر قدرت اور ارادہ حاصل ہے اور اللہ ان کی قدرت اور ارادے کا خالق ہے؛ ابن قدامہ «لمعۃ الاعتقاد» میں کہتے ہیں کہ بندے کا ایک فعل اور کسب ہے جس پر ثواب یا عذاب ملتا ہے۔ یہ جوابات آزادی کے کس سوال کا جواب دیتے ہیں؟"
