  title:
    en: Glass follows the capitals
    ar: الزجاج يتبع العواصم
    ur: شیشہ دارالحکومتوں کے پیچھے چلتا ہے
  text:
    en: 'Nadine Schibille ties the changes in glassmaking to new capitals: Umayyad Damascus imported large consignments of mosaic tesserae for the Great Umayyad Mosque and palaces. Al-Ya''qubi relates that al-Mu''tasim gathered craftsmen, glassworkers among them, from Basra and sent them to Samarra. How does a ruler''s building shape who makes what?'
    ar: 'تربط نادين شيبيل تحولات الصناعة بقيام العواصم: فقد استوردت دمشق الأموية شحنات كبيرة من فصوص الفسيفساء لزخرفة الجامع الأموي والقصور. ويروي اليعقوبي أن المعتصم جمع الصناع، ومنهم صناع الزجاج، من البصرة وأرسلهم إلى سامراء. كيف يشكّل بناء الحاكم من يصنع ماذا؟'
    ur: 'نادین شیبیل صنعت کی تبدیلیوں کو نئے دارالحکومتوں سے جوڑتی ہیں: اموی دمشق نے جامع اموی اور محلات کی آرائش کے لیے موزائیک کے ٹکڑوں کی بڑی کھیپیں درآمد کیں۔ یعقوبی بیان کرتے ہیں کہ معتصم نے بصرہ سے کاریگروں کو، جن میں شیشہ ساز بھی تھے، جمع کیا اور سامرا بھیج دیا۔ حکمران کی تعمیر یہ کیسے طے کرتی ہے کہ کون کیا بنائے؟'
  entity: practice/islamic-glassmaking
