connections:
- position: before
  kind: object
  title:
    en: A painting made for a patron
    ar: لوحة صُنعت لراعٍ
    ur: ایک سرپرست کے لیے بنائی گئی تصویر
  text:
    en: Princes of the House of Timur is a large opaque watercolour on cotton in the British Museum. The catalogue calls it the earliest known work by the Safavid court artists whom Humayun brought to India. Its close observation of cooks, waiters and minor courtiers, it says, reveals Humayun's effectiveness as a patron. Portraits of Akbar, Jahangir and Prince Khurram were added about 1607. What can a patron tell you about what a painting shows?
    ar: «أمراء البيت التيموري» لوحة كبيرة بالألوان المعتمة على القطن محفوظة في المتحف البريطاني، ويعدها الفهرس أقدم عمل معروف لرسامي البلاط الصفوي الذين جاء بهم همايون إلى الهند. وتكشف ملاحظتها الدقيقة للطهاة والسقاة وصغار رجال البلاط، كما يقول، عن فاعلية همايون راعياً. وأضيفت إليها نحو 1607م صور أكبر وجهانكير والأمير خرم. ماذا يخبرك الراعي عمّا تصوّره اللوحة؟
    ur: «خاندانِ تیمور کے شہزادے» برٹش میوزیم میں کپڑے پر بنی ایک بڑی مبہم رنگوں کی تصویر ہے۔ فہرست اسے ان صفوی درباری مصوروں کا سب سے قدیم معلوم کام کہتی ہے جنہیں ہمایوں ہندوستان لایا۔ باورچیوں، ساقیوں اور چھوٹے درباریوں کا اس کا باریک مشاہدہ، فہرست کے مطابق، ہمایوں کے ایک مؤثر سرپرست ہونے کو ظاہر کرتا ہے۔ تقریباً 1607ء میں اکبر، جہانگیر اور شہزادہ خرم کے پورٹریٹ اس میں شامل کیے گئے۔ سرپرست آپ کو اس بارے میں کیا بتا سکتا ہے کہ تصویر کیا دکھاتی ہے؟
