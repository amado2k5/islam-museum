  title:
    en: A style made in royal studios
    ar: أسلوب صُنع في مراسم ملكية
    ur: شاہی اسٹوڈیوز میں بنا انداز
  text:
    en: Milo Cleveland Beach writes that a recognisable Mughal style formed under Akbar, who put the Iranians Mir Sayyid Ali and Abd al-Samad in charge of the painting studios; it mixed Hindu (Rajput) and Muslim Indian elements with those of Safavid Iran. A Mughal elephant, he says, presents a specific animal in a relatively naturalistic space, unlike a Deccani one that the line makes a general type. What does a change in how a subject is painted tell you?
    ar: 'يقول ميلو كليفلاند بيتش إن الأسلوب المغولي المعروف تشكّل في عهد أكبر: فقد وضع الإمبراطور الإيرانيين مير سيد علي وعبد الصمد على رأس مراسم التصوير، لكن ما خرج منها أسلوب جديد يمزج عناصر هندية ⁦(راجبوتية)⁩ وإسلامية هندية بعناصر إيران الصفوية. ويقارن بين فيل دكني يجعله الخط نمطًا عامًا، وفيل مغولي يصوّر فيلًا بعينه في فضاء طبيعي نسبيًا. ماذا يمكن أن يخبرك تغيّر طريقة تصوير موضوع ما عمّن طلبوه؟'
    ur: 'میلو کلیولینڈ بیچ لکھتے ہیں کہ پہچانا جانے والا مغل انداز اکبر کے دور میں بنا: بادشاہ نے ایرانیوں میر سید علی اور عبدالصمد کو مصوری کے اسٹوڈیوز کا سربراہ بنایا، لیکن جو نکلا وہ نیا انداز تھا جس میں ہندو راجپوت اور مسلم ہندوستانی عناصر صفوی ایران کے عناصر سے ملے ہوئے تھے۔ وہ ایک دکنی ہاتھی کا موازنہ، جسے لکیر ایک عمومی نمونہ بنا دیتی ہے، ایک مغل ہاتھی سے کرتے ہیں جو نسبتاً فطری فضا میں ایک مخصوص ہاتھی دکھاتا ہے۔ کسی موضوع کو بنانے کے انداز میں تبدیلی آپ کو ان لوگوں کے بارے میں کیا بتا سکتی ہے جنہوں نے اسے بنوایا؟'
