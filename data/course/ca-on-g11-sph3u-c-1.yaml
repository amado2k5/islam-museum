  title:
    en: A magnet and the fall of objects
    ar: المغناطيس وسقوط الأجسام
    ur: مقناطیس اور اجسام کا گرنا
  text:
    en: 'TDV records a physical explanation in the preface of al-Idrisi''s book: he compares the Earth''s attraction of objects with a magnet attracting iron, to explain why objects in the air fall towards the Earth. The museum attributes this analogy to him; it does not present a modern law of gravitation or an experimental discovery. The record says nothing about the speed or direction of the falling object. What pulls an object, and what does the pull change?'
    ar: 'تحفظ قراءة TDV لمقدمة الإدريسي تفسيرًا فيزيائيًا: يشبه جذب الأرض للأجسام بجذب المغناطيس للحديد، فيفسر به سقوط ما في الهواء نحو الأرض. يعرض المتحف التشبيه منسوبًا إليه، لا قانونًا للجاذبية الحديثة ولا اكتشافًا تجريبيًا. ولا يقول السجل شيئًا عن سرعة الجسم الساقط أو اتجاهه. ما الذي يجذب الجسم، وماذا يغيّر الجذب؟'
    ur: 'TDV کے مطابق ادریسی کی کتاب کے مقدمے میں ایک طبعی تشریح ملتی ہے: وہ زمین کے اجسام کو کھینچنے کو مقناطیس کے لوہے کو کھینچنے سے تشبیہ دیتے ہیں، تاکہ سمجھائیں کہ ہوا میں موجود چیزیں زمین کی طرف کیوں گرتی ہیں۔ میوزیم اس تشبیہ کو ان سے منسوب کرتا ہے؛ اسے جدید قانونِ تجاذب یا تجرباتی دریافت کے طور پر پیش نہیں کرتا۔ ریکارڈ گرتی ہوئی چیز کی رفتار یا سمت کے بارے میں کچھ نہیں کہتا۔ جسم کو کیا کھینچتا ہے، اور کھینچاؤ کیا بدلتا ہے؟'
