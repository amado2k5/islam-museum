- code: A1
  text:
    en: 'compare some significant traditions and celebrations among diverse groups and at different times, including those of First Nations, Métis, and/or Inuit, and identify some of the reasons for changes in these traditions/celebrations (FOCUS ON: Perspective; Cause and Consequence)'
    ar: 'قارن بين بعض التقاليد والاحتفالات المهمة بين جماعات متنوعة وفي أزمنة مختلفة، ومنها تقاليد الأمم الأولى والميتيس و/أو الإنويت، وحدّد بعض أسباب تغيّر هذه التقاليد والاحتفالات ⁦(التركيز على: المنظور؛ السبب والنتيجة)⁩'
