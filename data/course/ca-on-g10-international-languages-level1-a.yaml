summary:
  en: Listening to and about the communities where Arabic is spoken; the museum serves the intercultural expectations A3.1 and A3.2, through a description of the language, the story of a city, and conventions of greeting and thanks.
  ar: الاستماع إلى الجماعات التي تُتحدَّث فيها العربية وعنها؛ ويخدم المتحف توقعات الفهم بين الثقافات A3.1 وA3.2 بوصف اللغة وقصة مدينة وبأعراف التحية والشكر.
  ur: ان جماعتوں کو اور ان کے بارے میں سننا جہاں عربی بولی جاتی ہے؛ عجائب گھر بین الثقافتی توقعات A3.1 اور A3.2 کو زبان کے بیان، ایک شہر کی کہانی، اور سلام اور شکر کی روایات سے پورا کرتا ہے۔
  es: "Al escuchar y conocer las comunidades donde se habla árabe, el museo satisface las expectativas interculturales A3.1 y A3.2 mediante la descripción del idioma, la historia de una ciudad y las convenciones de saludo y agradecimiento."
  fr: "À l’écoute des communautés où l’arabe est parlé et s’intéressant à leur histoire, le musée répond aux attentes interculturelles A3.1 et A3.2, à travers une description de la langue, l’histoire d’une ville et les conventions de salutation et de remerciement."
  tr: "Arapça konuşulan ve Arapça hakkında konuşulan toplulukları dinlemek; ve müze, dili, bir şehrin hikayesini ve selamlaşma ve şükran geleneklerini anlatarak kültürlerarası anlayış beklentilerini (A3.1 ve A3.2) karşılamaktadır."
  id: "Mendengarkan komunitas tempat dan tentang bahasa Arab digunakan; dan museum tersebut memenuhi harapan pemahaman antarbudaya A3.1 dan A3.2 dengan mendeskripsikan bahasa, kisah sebuah kota, dan kebiasaan memberi salam dan ucapan terima kasih."
