  title:
    en: A scholar people disagreed about
    ar: عالم اختلف الناس في أمره
    ur: ایک عالم جن کے بارے میں لوگوں میں اختلاف تھا
  text:
    en: Ibn al-Nadim reports that people differed about Jabir ibn Hayyan. The Shi'a say he was one of their great men and a companion of Ja'far al-Sadiq; people of the craft of gold and silver say leadership in the craft came to him. Others say he has no real existence and that people wrote the works and ascribed them to him; Ibn al-Nadim replies that the man was real. How would you weigh these reports?
    ar: يعرض ابن النديم أن الناس اختلفوا في أمر جابر بن حيان. قالت الشيعة إنه من كبارهم وصاحب جعفر الصادق، وزعم أهل صناعة الذهب والفضة أن الرياسة انتهت إليه. وقال جماعة إنه لا أصل له وإن المصنفات صنّفها الناس ونحلوه إياها، وردّ ابن النديم بأن للرجل حقيقة. كيف تزن هذه الأخبار؟
    ur: ابنِ ندیم بیان کرتے ہیں کہ جابر بن حیان کے بارے میں لوگوں نے اختلاف کیا۔ شیعہ کہتے ہیں کہ وہ ان کے بزرگوں میں سے اور جعفر صادق کے ساتھی تھے، اور سونے چاندی کی صنعت والوں کا دعویٰ ہے کہ اس فن کی سربراہی ان تک پہنچی۔ ایک گروہ نے کہا کہ ان کی کوئی حقیقت نہیں اور تصانیف لوگوں نے لکھ کر ان سے منسوب کر دیں؛ ابنِ ندیم نے جواب دیا کہ وہ شخص حقیقی تھا۔ آپ ان بیانات کو کیسے تولیں گے؟
  entity: person/jabir-ibn-hayyan
  sources:
  - source/fihrist-ibn-al-nadim
- position: within
  kind: reflection
  title:
    en: Claims passed on by their holders
    ar: دعاوى منقولة عن أصحابها
    ur: دعوے جو اپنے ماننے والوں سے نقل ہوئے
  text:
    en: Ibn al-Nadim devotes the tenth treatise of the Fihrist to the reports of the alchemists. He transmits that practitioners claimed the first to speak on the science of the craft was Hermes the Babylonian sage, and that Abu Bakr al-Razi claimed a man is not called a philosopher unless he has valid knowledge of alchemy. The record adds that these are claims transmitted from their adherents and need a further source. What would count as that source?
    ar: خصص ابن النديم المقالة العاشرة من الفهرست لأخبار الكيميائيين. وينقل أن أهل الصنعة زعموا أن أول من تكلم على علم الصنعة هرمس الحكيم البابلي، وأن أبا بكر الرازي زعم أنه لا يسمى الإنسان فيلسوفاً إلا أن يصح له علم صناعة الكيمياء. ويضيف السجل أن هذه دعاوى منقولة عن أصحابها وتحتاج إلى مصدر إضافي. ماذا يصلح أن يكون هذا المصدر؟
    ur: ابنِ ندیم نے فہرست کا دسواں مقالہ کیمیا گروں کی خبروں کے لیے مخصوص کیا۔ وہ نقل کرتے ہیں کہ اہلِ فن نے دعویٰ کیا کہ اس فن پر سب سے پہلے ہرمس حکیم بابلی نے کلام کیا، اور ابوبکر رازی نے دعویٰ کیا کہ کوئی شخص اس وقت تک فلسفی نہیں کہلاتا جب تک اسے کیمیا کی صنعت کا صحیح علم نہ ہو۔ اندراج یہ اضافہ کرتا ہے کہ یہ دعوے اپنے ماننے والوں سے نقل ہوئے ہیں اور انھیں ایک اضافی ماخذ چاہیے۔ وہ ماخذ کیا ہو سکتا ہے؟
  entity: concept/sinaat-al-kimiya
