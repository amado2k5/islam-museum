  title:
    en: A ship and its passengers
    ar: سفينة وركابها
    ur: کشتی اور اس کے مسافر
  text:
    en: Anton Heinen traces how astronomers of the thirteenth to the sixteenth century used a ship, with passengers moving about it as on firm ground, as a standard example for accidental motion and the earth's possible rotation. Al-Jurjani judged two usual objections, a stone thrown upward and birds and arrows, insufficient, since the air might move with the earth; he then reaffirmed the earth's rest on other grounds. Relative to what is a passenger at rest?
    ar: يتتبع أنطون هاينن كيف صار تمثيل السفينة الجارية في البحر أو النهر، وركابها يتحركون فيها كأنهم على أرض ثابتة، مثالًا معتادًا عند أهل الهيئة من القرن الثالث عشر إلى السادس عشر في بحث الحركة العرضية وإمكان دوران الأرض. ورأى الشريف الجرجاني أن حجتي الحجر المرمي إلى أعلى والطائر والسهم غير كافيتين، لأن الهواء قد يتحرك مع الأرض، ثم عاد فأكد سكونها لسبب آخر. بالنسبة إلى ماذا يكون الراكب ساكنًا؟
    ur: انتون ہائنن دکھاتا ہے کہ تیرہویں سے سولہویں صدی کے اہلِ ہیئت کے ہاں بہتی کشتی اور اس کے مسافروں کی تمثیل، جو اس میں یوں چلتے پھرتے ہیں گویا مضبوط زمین پر ہوں، حرکتِ عرضی اور زمین کی ممکنہ گردش کی بحث میں معمول کی مثال کیسے بنی۔ شریف جرجانی نے اوپر پھینکے گئے پتھر اور پرندوں اور تیروں کی دو معروف دلیلوں کو ناکافی سمجھا، کیونکہ ہوا زمین کے ساتھ حرکت کر سکتی ہے؛ پھر اس نے زمین کے سکون کی توثیق ایک اور بنیاد پر کی۔ مسافر کس کے لحاظ سے ساکن ہے؟
