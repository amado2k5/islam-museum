connections:
- position: before
  kind: reflection
  title:
    en: Farming, dead land and surplus water
    ar: الزراعة والأرض الموات وفضل الماء
    ur: کھیتی، بنجر زمین اور فاضل پانی
  text:
    en: Al-Maraghi presents agriculture, after Ibn Khaldun, as the oldest livelihood, the simplest of crafts and the closest to nature. Islam urges it, he says, as the source of food for people and animals; whoever revives dead land has the best claim to it, and he warns against withholding surplus water from crops. What do a society's rules about land and water show about how it lives off its environment?
    ar: يعرض المراغي الزراعة، نقلًا عن ابن خلدون، بوصفها أسبق وجوه المعاش وأبسط الصنائع وأقربها إلى الطبيعة. ويرى أن الإسلام حثّ عليها لأنها مصدر أقوات الناس والأنعام، وأن من أحيا أرضًا مواتًا فهو أحق بها، ويحذّر من منع فضل الماء عن الزرع. ماذا تكشف قواعد مجتمع في الأرض والماء عن طريقة عيشه من بيئته؟
    ur: المراغی زراعت کو، ابن خلدون کے حوالے سے، معاش کی سب سے پرانی صورت، سب سے سادہ پیشہ اور فطرت کے سب سے قریب بتاتے ہیں۔ ان کے نزدیک اسلام اس کی ترغیب اس لیے دیتا ہے کہ یہ انسانوں اور جانوروں کی خوراک کا ذریعہ ہے؛ جو بنجر زمین کو آباد کرے وہ اس کا زیادہ حق دار ہے، اور وہ کھیتی سے فاضل پانی روکنے سے خبردار کرتے ہیں۔ کسی معاشرے کے زمین اور پانی کے ضابطے اس کے اپنے ماحول سے گزر بسر کے بارے میں کیا بتاتے ہیں؟
  entity: concept/agriculture-in-islam
  sources:
  - source/min-qadaya-al-mal-wal-amal-azhar
- position: within
  kind: place
  title:
    en: Water given to all, every day
    ar: ماء يُبذل للناس كل يوم
    ur: پانی جو ہر روز سب کو دیا جاتا
  text:
    en: Al-Haddad treats the sabil as a charitable building endowed to give people fresh water every day all year round. It was called siqaya in the first five centuries and sabil from the late fifth century AH, and it drew water from wells, pools and springs, or from rain and floods through channels or pipes hidden in walls. Where does a city's drinking water come from, and who pays for it?
    ar: يعدّ الحداد السبيل منشأة خيرية موقوفة لإعطاء الناس ماءً عذبًا كل يوم طوال العام. وكانت تسمى سقاية في القرون الخمسة الأولى ثم عُرفت بالسبيل منذ أواخر القرن الخامس الهجري، وتستمد ماءها من الآبار والبرك والعيون أو من المطر والسيول عبر قنوات أو أنابيب مخفية في الجدران. من أين يأتي ماء الشرب في مدينة، ومن يتكفل به؟
    ur: الحداد سبیل کو ایک خیراتی عمارت قرار دیتے ہیں جو لوگوں کو سال بھر روزانہ میٹھا پانی دینے کے لیے وقف کی جاتی تھی۔ پہلی پانچ صدیوں میں اسے سقایہ کہا جاتا تھا اور پانچویں صدی ہجری کے آخر سے سبیل، اور وہ کنوؤں، تالابوں اور چشموں سے، یا بارش اور سیلاب کا پانی دیواروں میں چھپی نالیوں یا نلکیوں کے ذریعے لے کر پانی دیتی تھی۔ کسی شہر کا پینے کا پانی کہاں سے آتا ہے، اور اس کا خرچ کون اٹھاتا ہے؟
