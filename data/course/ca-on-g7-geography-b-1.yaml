- position: after
  kind: reflection
  title:
    en: Protecting a pasture
    ar: حماية مرعى
    ur: چراگاہ کا تحفظ
  text:
    en: In the Kuwaiti jurisprudence encyclopedia a hima is a stretch of waste land that the ruler protects for particular herds. The encyclopedia says the rule is prohibition, since it narrows the common ground; it says the majority allow the ruler to protect pasture for the horses of fighters, zakat camels and weak herds under conditions, among them that it serve the Muslims, not be private property, and be small, and that the ruler should appoint an agent to admit the herds of the weak and bar those of the strong. How might a shared pasture be managed when many herds need it?
    ar: الحمى في الموسوعة الفقهية الكويتية موضع من الموات يحميه الإمام لمواشي مخصوصة. وتقول الموسوعة إن الأصل فيه المنع لأنه تضييق على الناس، وإن الجمهور أجازوا للإمام أن يحمي لخيل المجاهدين وإبل الصدقة والماشية الضعيفة بشروط، منها أن يكون لمصلحة المسلمين وألا يكون ملكًا لأحد وأن يكون قليلًا، وإنه يُندب أن ينصب الإمام أمينًا يُدخل دواب الضعفاء ويمنع دواب الأقوياء. كيف يمكن تدبير مرعى مشترك حين تحتاج إليه قطعان كثيرة؟
    ur: کویتی فقہی انسائیکلوپیڈیا میں حمیٰ بنجر زمین کا وہ حصہ ہے جسے حاکم مخصوص مویشیوں کے لیے محفوظ کرتا ہے۔ انسائیکلوپیڈیا کہتا ہے کہ اصل حکم ممانعت ہے کیونکہ اس سے لوگوں پر تنگی ہوتی ہے؛ وہ کہتا ہے کہ جمہور حاکم کو شرطوں کے ساتھ مجاہدین کے گھوڑوں، زکوٰۃ کے اونٹوں اور کمزور مویشیوں کے لیے چراگاہ محفوظ کرنے کی اجازت دیتے ہیں، ان شرطوں میں یہ ہے کہ وہ مسلمانوں کے مفاد میں ہو، کسی کی ملکیت نہ ہو اور چھوٹی ہو، اور یہ کہ حاکم ایک امین مقرر کرے جو کمزوروں کے جانور داخل کرے اور طاقتوروں کے روک دے۔ جب بہت سے ریوڑوں کو ایک مشترک چراگاہ کی ضرورت ہو تو اسے کیسے سنبھالا جا سکتا ہے؟
  entity: concept/hima-protected-pasture
