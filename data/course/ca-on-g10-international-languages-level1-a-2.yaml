  title:
    en: Returning a greeting
    ar: ردّ التحية
    ur: سلام کا جواب
  text:
    en: 'The record on greeting with peace gives the etiquette of the greeting on meeting. In his commentary on the Surat al-Nisa passage about greetings, Sha''rawi says a greeting is returned with its like or something better, and sets out who begins and who answers. Listen: how is a greeting answered in the dialogues you hear?'
    ar: 'يعرض سجل التحية بالسلام آداب التحية عند اللقاء. وفي تفسير الشعراوي لآية سورة النساء الواردة في التحية أن التحية تُرد بمثلها أو بأحسن منها، وقد فصّل من يبدأ ومن يرد. أنصت: كيف يُردّ السلام في الحوارات التي تسمعها؟'
    ur: 'سلام کے اندراج میں ملاقات کے وقت سلام کے آداب بیان ہوئے ہیں۔ سورۂ نساء کی سلام والی آیت کی تفسیر میں الشعراوی کہتے ہیں کہ سلام کا جواب اسی جیسے یا اس سے بہتر لفظ سے دیا جائے، اور وہ بتاتے ہیں کہ ابتدا کون کرے اور جواب کون دے۔ غور سے سنیں: جو مکالمے آپ سنتے ہیں ان میں سلام کا جواب کیسے دیا جاتا ہے؟'
  entity: practice/greeting-salam
