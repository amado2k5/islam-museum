- position: within
  kind: reflection
  title:
    en: Gratitude
    ar: الشكر
    ur: شکر
  text:
    en: Shukr, in language, as the Kuwaiti Encyclopaedia of Fiqh defines it, is the acknowledgement of a kindness received, its spreading and praise of its doer. It shows in the tongue, the heart and the limbs; by the tongue, it is acknowledgement and praise. After you listen to a dialogue, which words did you hear that acknowledge a kindness?
    ar: الشكر في اللغة، كما تعرّفه الموسوعة الفقهية الكويتية، الاعتراف بالمعروف المسدى إليك ونشره والثناء على فاعله. وهو يظهر على اللسان والقلب والجوارح؛ فهو باللسان إقرار بالمعروف وثناء. بعد أن تسمع حواراً، أي كلمات سمعتها تعترف بمعروف؟
    ur: کویتی فقہی انسائیکلوپیڈیا کے مطابق شکر لغت میں کسی کی جانب سے پہنچنے والی بھلائی کا اعتراف، اسے پھیلانا اور کرنے والے کی تعریف کرنا ہے۔ یہ زبان، دل اور اعضاء تینوں سے ظاہر ہوتا ہے؛ زبان سے یہ اعتراف اور تعریف ہے۔ کوئی مکالمہ سننے کے بعد بتائیں کہ آپ نے کون سے الفاظ سنے جو کسی بھلائی کا اعتراف کرتے ہیں؟
  entity: concept/gratitude-shukr
  sources:
  - source/fiqh-mawsua-kuwaitiyya-noor-v3
