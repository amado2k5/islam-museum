  ur: مخصوص ملبوسات کی منڈیاں، جن میں دینی جماعتیں بھی ہیں، اور ان کے کپڑے اور افعال ⁦(C1.1، C1.2)⁩؛ عجائب گھر لباس کے بارے میں ایک دینی جماعت کی باتیں اور حاجی کے لباس پیش کرتا ہے۔
