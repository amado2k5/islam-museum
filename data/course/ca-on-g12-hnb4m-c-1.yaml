  title:
    en: The rida' and izar of the pilgrim
    ar: الرداء والإزار للمحرم
    ur: احرام میں ردا اور ازار
  text:
    en: In the lexicon the rida' is the garment that covers the upper body over the izar. For a pilgrim in ihram the record names a white izar and rida'; in prayer the majority of jurists prefer a shirt with a rida'. Who needs these garments, and when?
    ar: الرداء في اللغة الثوب الذي يستر أعلى البدن فوق الإزار. ويذكر السجل للمحرم رداءً وإزارًا أبيضين، ويفضل جمهور الفقهاء في الصلاة القميص مع الرداء. من الذي يحتاج هذه الثياب، ومتى؟
    ur: لغت میں ردا وہ کپڑا ہے جو ازار کے اوپر بالائی بدن کو ڈھانپتا ہے۔ اندراج احرام والے حاجی کے لیے سفید ازار اور ردا بتاتا ہے، اور نماز میں جمہور فقہا قمیص کے ساتھ ردا کو ترجیح دیتے ہیں۔ ان کپڑوں کی ضرورت کسے ہوتی ہے، اور کب؟
