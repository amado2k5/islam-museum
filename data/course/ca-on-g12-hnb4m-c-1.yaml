connections:
- position: before
  kind: reflection
  title:
    en: What the jurists say about dress
    ar: ما يقوله الفقهاء عن اللباس
    ur: لباس کے بارے میں فقہا کیا کہتے ہیں
  text:
    en: The Kuwaiti Encyclopaedia of Fiqh records that the jurists hold clothing to be what covers the body and protects against heat and cold. They hold that covering the nakedness is obligatory, that dressing well at gatherings and festivals is recommended so long as it is not for pride, that materials are lawful unless a text forbids them, as silk is for men, and that white is recommended. How might rules like these shape what a group of buyers looks for?
    ar: تذكر الموسوعة الفقهية الكويتية أن الفقهاء يرون أن اللباس ما يستر البدن ويدفع الحر والبرد، وأن ستر العورة فرض، وأن التزين في الجمع والأعياد مندوب ما لم يكن للتكبر، وأن الأصل في الأشياء التي تُصنع منها الألبسة الحل إلا ما ورد النص بتحريمه كالحرير للذكور، وأن الأبيض مستحب. كيف يمكن لأحكام كهذه أن تشكّل ما يبحث عنه جمهور من المشترين؟
    ur: کویتی فقہی انسائیکلوپیڈیا درج کرتا ہے کہ فقہا کے نزدیک لباس وہ ہے جو بدن کو ڈھانپے اور گرمی سردی سے بچائے؛ ستر ڈھانپنا فرض ہے، اجتماعات اور عیدوں میں اچھا لباس پہننا مستحب ہے بشرطیکہ تکبر کے لیے نہ ہو، لباس بننے والی چیزوں میں اصل حلال ہونا ہے جب تک کوئی نص حرام نہ کرے، جیسے مردوں کے لیے ریشم، اور سفید رنگ مستحب ہے۔ ایسے احکام خریداروں کے ایک گروہ کی تلاش کو کیسے ڈھال سکتے ہیں؟
  entity: concept/albisa
