  title:
    en: A clock that marks every half hour
    ar: ساعة تُعلن كل نصف ساعة
    ur: ہر نصف گھنٹے کا اعلان کرنے والی گھڑی
  text:
    en: 'Every half hour figures move, a ball drops and a sound is heard: this is how the Met''s catalogue describes the elephant clock in al-Jazari''s book. The rider strikes the elephant, the bird moves and a ball passes from falcon to dragon to a vessel containing a gong; counting the accumulated balls indicates elapsed time. How long would it take for ten balls to gather?'
    ar: 'كل نصف ساعة تتحرك شخصيات، وتسقط كرة، ويصدر صوت: هكذا تصف فهرسة المتروبوليتان ساعة الفيل في كتاب الجزري. يضرب الراكب الفيل بأداته، ويتحرك الطائر، وتمر الكرة من الصقر إلى التنين ثم إلى إناء فيه ناقوس؛ ويُعرف الزمن بعدّ الكرات المتجمعة. كم من الوقت تحتاج عشر كرات لتجتمع؟'
    ur: 'ہر نصف گھنٹے شکلیں حرکت کرتیں، گیند گرتی اور آواز آتی: میٹ کی فہرست جزری کی کتاب کی ہاتھی گھڑی یوں بیان کرتی ہے۔ سوار اپنے آلے سے ہاتھی کو مارتا، پرندہ حرکت کرتا اور گیند باز سے اژدہے، پھر ناقوس والے برتن میں پہنچتی؛ جمع گیندوں کی گنتی گزرا وقت بتاتی۔ دس گیندیں جمع ہونے میں کتنا وقت لگے گا؟'
