summary:
  en: 'The Ontario Grade 10 Visual Arts course AVI2O has three strands: creating and presenting, reflecting and analysing, and foundations. The museum maps five lessons, through calligraphy, tilework, book illumination, the arabesque and three works read for their use and society.'
  ar: 'لمقرر الفنون البصرية AVI2O للصف العاشر في أونتاريو ثلاثة محاور: الإبداع والعرض، والتأمل والتحليل، والأسس. ويربط المتحف خمسة دروس، عبر الخط العربي والبلاط والتذهيب والأرابيسك وثلاثة أعمال تُقرأ من حيث استعمالها ومجتمعها.'
  ur: 'اونٹاریو کے جماعت دہم بصری فنون کورس AVI2O کی تین شاخیں ہیں: تخلیق اور پیش کش، غور اور تجزیہ، اور بنیادیں۔ میوزیم پانچ سبق جوڑتا ہے، خطاطی، ٹائل کے کام، کتاب کی تذہیب، عربیسک اور استعمال و معاشرے کے لحاظ سے پڑھے گئے تین کاموں کے ذریعے۔'
