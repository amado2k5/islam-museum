expectations:
- code: G1
  text:
    en: demonstrate an understanding of the main questions in social and political philosophy, and of the positions of major philosophers and schools of philosophy with respect to some of these questions
    ar: أظهر فهمًا للأسئلة الرئيسة في الفلسفة الاجتماعية والسياسية، ولمواقف كبار الفلاسفة والمدارس الفلسفية من بعض هذه الأسئلة
    ur: سماجی و سیاسی فلسفہ کے بنیادی سوالات اور ان میں سے بعض کے بارے میں بڑے فلسفیوں اور فلسفیانہ مکاتبِ فکر کے مؤقف کی فہم کا مظاہرہ کریں
- code: G2
  text:
    en: demonstrate an understanding of theories in social and political philosophy, and evaluate responses to some of the main questions in social and political philosophy by major philosophers and schools of philosophy
    ar: أظهر فهمًا للنظريات في الفلسفة الاجتماعية والسياسية، وقيّم إجابات كبار الفلاسفة والمدارس الفلسفية عن بعض الأسئلة الرئيسة في الفلسفة الاجتماعية والسياسية
    ur: سماجی و سیاسی فلسفہ کے نظریات کی فہم کا مظاہرہ کریں، اور سماجی و سیاسی فلسفہ کے بعض بنیادی سوالات پر بڑے فلسفیوں اور فلسفیانہ مکاتبِ فکر کے جوابات کا جائزہ لیں
- code: G3
  text:
    en: demonstrate an understanding of connections between social and political philosophy and other areas of philosophy, other subject areas, and various aspects of society, including everyday life
    ar: أظهر فهمًا للصلات بين الفلسفة الاجتماعية والسياسية وسائر مجالات الفلسفة والمواد الدراسية الأخرى ومختلف جوانب المجتمع، ومنها الحياة اليومية
    ur: سماجی و سیاسی فلسفہ اور فلسفے کے دیگر شعبوں، دیگر مضامین اور معاشرے کے مختلف پہلوؤں، بشمول روزمرہ زندگی، کے درمیان روابط کی فہم کا مظاہرہ کریں
- code: G4
  text:
    en: use philosophical reasoning skills to develop, communicate, and defend their own responses to questions in social and political philosophy
    ar: استخدم مهارات الاستدلال الفلسفي لتطوير إجاباتك الخاصة عن الأسئلة في الفلسفة الاجتماعية والسياسية والتعبير عنها والدفاع عنها
    ur: فلسفیانہ استدلال کی مہارتیں برت کر سماجی و سیاسی فلسفہ کے سوالات پر اپنے جوابات تشکیل دیں، بیان کریں اور ان کا دفاع کریں
