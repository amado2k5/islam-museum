- position: after
  kind: hadith
  title:
    en: A precept about a brother
    ar: مبدأ عن الأخ
    ur: بھائی کے بارے میں ایک اصول
  text:
    en: Sahih Muslim places this report of Anas ibn Malik in its Book of Faith, in the chapter on the evidence that among the qualities of faith is that one loves for his Muslim brother the good he loves for himself. Compare it with a precept from the sacred teachings of another tradition. What do they have in common?
    ar: يضع صحيح مسلم هذا الحديث عن أنس بن مالك في كتاب الإيمان، في باب الدليل على أن من خصال الإيمان أن يحب المرء لأخيه المسلم ما يحب لنفسه من الخير. قارنه بمبدأ من التعاليم المقدسة في معتقد آخر. ما القاسم المشترك بينهما؟
    ur: صحیح مسلم انس بن مالک کی یہ روایت اپنی کتاب الایمان میں اس باب کے تحت رکھتی ہے جو اس پر دلیل ہے کہ ایمان کی خصلتوں میں سے ہے کہ آدمی اپنے مسلمان بھائی کے لیے وہی بھلائی چاہے جو اپنے لیے چاہتا ہے۔ اسے کسی دوسری روایت کی مقدس تعلیمات کے کسی اصول سے ملا کر دیکھیں۔ ان میں کیا مشترک ہے؟
  entity: passage/muslim-0045
