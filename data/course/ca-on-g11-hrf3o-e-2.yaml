connections:
- position: within
  kind: reflection
  title:
    en: A month and a book
    ar: شهر وكتاب
    ur: ایک مہینہ اور ایک کتاب
  text:
    en: The Kuwaiti encyclopaedia of jurisprudence says Ramadan is distinguished by the revelation of the Qur'an in it, by the obligation of its fast, by the excellence of charity in it, by the night of power, and by the recommended taraweeh and i'tikaf in its last ten nights. It adds that studying and reciting the Qur'an are especially recommended in it. How is a season of the year tied to a book?
    ar: تذكر الموسوعة الفقهية الكويتية أن رمضان يتميز بنزول القرآن فيه، وبفرض صيامه، وفضل الصدقة فيه، وبليلة القدر، وباستحباب التراويح والاعتكاف في العشر الأواخر. وتضيف أن دراسة القرآن وتلاوته مستحبتان فيه استحبابًا خاصًّا. كيف يرتبط فصل من السنة بكتاب؟
    ur: کویتی فقہی انسائیکلوپیڈیا بتاتا ہے کہ رمضان کی خصوصیت اس میں قرآن کا نازل ہونا، اس کے روزے کا فرض ہونا، اس میں صدقے کی فضیلت، شبِ قدر، اور آخری دس راتوں میں تراویح اور اعتکاف کا مستحب ہونا ہے۔ وہ مزید کہتا ہے کہ اس میں قرآن کا مطالعہ اور تلاوت خاص طور پر مستحب ہیں۔ سال کا ایک موسم ایک کتاب سے کیسے جڑ جاتا ہے؟
  entity: concept/ramadan-fiqh
  sources:
