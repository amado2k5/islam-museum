summary:
  en: How sacred texts and reports shape what a community does, which precepts they hold in common, and how a month is tied to a book (E2.2, E2.3).
  ar: كيف تصوغ النصوص المقدسة والروايات ما تفعله جماعة، وأي مبادئ تشترك فيها، وكيف يرتبط شهر بكتاب ⁦(E2.2 وE2.3)⁩.
  ur: مقدس متن اور روایات ایک جماعت کے اعمال کو کیسے ڈھالتے ہیں، کون سے اصول سب میں مشترک ہیں، اور ایک مہینہ ایک کتاب سے کیسے جڑا ہے ⁦(E2.2 اور E2.3)⁩۔
