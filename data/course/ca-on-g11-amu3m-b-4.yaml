  title:
    en: A famous life and its sources
    ar: سيرة مشهورة ومصادرها
    ur: ایک مشہور سیرت اور اس کے ماخذ
  text:
    en: The record on Ziryab says that Dwight Reynolds finds Maqqari left out rivals and less flattering anecdotes and made a portrait evoking an ideal Andalusi past; it adds that criticism of the portrait is not a verdict that every detail is false. It also presents Maqqari's story of Ziryab's departure from Baghdad as an attributed narrative, not a contemporary proceeding. Whose account should a researcher weigh, and how?
    ar: تذكر صفحة زرياب أن دوايت رينولدز يرى أن المقري حذف منافسين وأخباراً أقل مديحاً وصنع صورة تستحضر زمناً أندلسياً مثالياً، وتضيف أن نقد الصورة لا يعني حكماً بأن كل خبر كاذب. وتعرض رواية المقري عن رحيل زرياب من بغداد بوصفها رواية منسوبة، لا محضراً معاصراً. رواية من ينبغي أن يزن الباحث، وكيف؟
    ur: زریاب پر ریکارڈ بتاتا ہے کہ ڈوائٹ رینالڈز کے نزدیک المقری نے حریفوں اور کم تعریفی قصوں کو حذف کیا اور ایک ایسی تصویر بنائی جو آئیڈیل اندلسی زمانے کو یاد دلاتی ہے؛ ساتھ ہی کہتا ہے کہ تصویر پر تنقید کا مطلب یہ فیصلہ نہیں کہ ہر تفصیل جھوٹی ہے۔ وہ زریاب کے بغداد سے روانہ ہونے کے بارے میں المقری کی کہانی کو بھی منسوب روایت کے طور پر پیش کرتا ہے، نہ کہ ہم عصر کارروائی۔ محقق کو کس کا بیان تولنا چاہیے، اور کیسے؟
  entity: person/ziryab
  sources:
  - source/reynolds-ziryab-2008
  - source/nafh-tib-maqqari
- position: after
  kind: invention
  title:
    en: A photograph that is not his oud
    ar: صورة ليست لعوده
    ur: ایک تصویر جو اس کا عود نہیں
  text:
    en: 'The record on Ziryab''s reported fifth oud string says Maqqari attributes to him an extra red string on an inherited four-string oud: a refinement, not the invention of the oud itself. It adds that its photograph shows a much later instrument in the Cleveland Museum of Art, not an oud surviving from his court. What may a reader conclude from an account of this kind, and what must stay open?'
    ar: تذكر صفحة الوتر الخامس المنسوب لزرياب أن المقري ينسب إليه زيادة وتر أحمر خامس في عود موروث ذي أربعة أوتار؛ إضافة إلى آلة قائمة لا اختراع العود نفسه. وتضيف أن الصورة فيها لعود متأخر جداً في متحف كليفلاند للفن، لا لآلة نجت من بلاطه. ماذا يستطيع القارئ أن يستنتج من رواية كهذه، وما الذي ينبغي أن يبقى مفتوحاً؟
    ur: 'زریاب سے منسوب عود کی پانچویں تار پر ریکارڈ بتاتا ہے کہ المقری اس سے ورثے میں ملے چار تاروں والے عود پر ایک اضافی سرخ تار منسوب کرتا ہے: یہ ایک اصلاح ہے، خود عود کی ایجاد نہیں۔ وہ یہ بھی کہتا ہے کہ اس کی تصویر کلیولینڈ میوزیم آف آرٹ کے بہت بعد کے ایک آلے کی ہے، اس عود کی نہیں جو اس کے دربار سے بچا ہو۔ ایسی روایت سے قاری کیا نتیجہ نکال سکتا ہے، اور کیا کھلا رہنا چاہیے؟'
