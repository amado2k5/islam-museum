  title:
    en: A calendar counted by the moon
    ar: تقويم يُحسب بالقمر
    ur: چاند سے گنا جانے والا کیلنڈر
  text:
    en: 'The Hijri calendar is a lunar calendar whose years are counted from the Prophet''s migration from Mecca to Medina, and it fixes the dates of Ramadan, the hajj and the feasts. Its year is about eleven days shorter than the solar year, so its months move through the seasons. Find one month of your own calendar: in which season does it fall?'
    ar: 'التقويم الهجري تقويم قمري تُعدّ سنواته من هجرة النبي من مكة إلى المدينة، ويُحدَّد به موعد رمضان والحج والأعياد. وهو أقصر من السنة الشمسية بنحو أحد عشر يومًا، فتتحرك شهوره عبر الفصول. اختر شهرًا من تقويمك أنت: في أي فصل يقع؟'
    ur: 'ہجری تقویم ایک قمری تقویم ہے جس کے سال نبی کی مکہ سے مدینہ ہجرت سے گنے جاتے ہیں، اور اسی سے رمضان، حج اور عیدوں کا وقت متعین ہوتا ہے۔ اس کا سال شمسی سال سے تقریباً گیارہ دن چھوٹا ہے، اس لیے اس کے مہینے موسموں میں گھومتے رہتے ہیں۔ اپنے کیلنڈر کا کوئی ایک مہینہ دیکھیں: وہ کس موسم میں آتا ہے؟'
