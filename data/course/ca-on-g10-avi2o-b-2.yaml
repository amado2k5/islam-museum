- position: after
  kind: career
  title:
    en: Who practises Arabic calligraphy today
    ar: من يمارس الخط العربي اليوم
    ur: آج عربی خطاطی کون کرتا ہے
  text:
    en: UNESCO placed Arabic calligraphy on its Representative List of the Intangible Cultural Heritage of Humanity in 2021. It describes the practice as transmitted through formal and informal education and through apprenticeship, and practised by professional calligraphers, artists, designers, teachers and artisans, men and women alike. Among its contemporary forms it names writing with markers and paint, and lettering on walls. Which of these paths could you follow?
    ar: أدرجت اليونسكو الخط العربي عام 2021 في القائمة التمثيلية للتراث الثقافي غير المادي للإنسانية. وتصف الممارسة بأنها تُنقل بالتعليم الرسمي وغير الرسمي وبالتلمذة، ويمارسها الخطاطون المحترفون والفنانون والمصممون والمدرّسون والحرفيون من الرجال والنساء. وتقول إن من أشكالها المعاصرة الكتابة بالأقلام الملونة والطلاء والرذاذ على الجدران. أي هذه المسارات يمكن أن تسلك؟
    ur: یونیسکو نے 2021 میں عربی خطاطی کو انسانیت کے غیر مادی ثقافتی ورثے کی نمائندہ فہرست میں شامل کیا۔ وہ اس عمل کو رسمی اور غیر رسمی تعلیم اور شاگردی کے ذریعے منتقل ہونے والا بتاتی ہے، اور کہتی ہے کہ اسے پیشہ ور خطاط، فنکار، ڈیزائنر، اساتذہ اور دست کار، مرد اور عورتیں، کرتے ہیں۔ اس کی معاصر صورتوں میں وہ مارکر اور رنگ سے لکھنے اور دیواروں پر تحریر کا ذکر کرتی ہے۔ آپ ان میں سے کون سا راستہ اختیار کر سکتے ہیں؟
