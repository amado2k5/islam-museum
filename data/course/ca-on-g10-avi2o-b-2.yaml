  title:
    en: 'Meşk: learning by copying and correcting'
    ar: 'المشق: التعلّم بالنسخ والتصحيح'
    ur: 'مشق: نقل اور اصلاح سے سیکھنا'
  text:
    en: In the calligrapher's training, teaching is called meşk. The master writes a model line, the pupil copies it and shows it to him, and the master writes the corrected letter beneath any fault. Training has two stages, the letters one by one and then joined words. It usually begins in youth, but some began after fifty. What can a student learn by copying, correcting and copying again?
    ar: 'يُسمّى تعليم الخط «المشق»، فيكتب الأستاذ سطرًا نموذجيًا في الدرس، ويكتب التلميذ مثله ويعرضه عليه، وإن رأى الأستاذ خطأً كتب تحت السطر الحرف المصحَّح. ويُعلّم الخط في مرحلتين: «مشق المفردات» تُكتب فيه الحروف واحدًا واحدًا، ثم «مشق المركّبات» تُكتب فيه الكلمات المركبة. ويبدأ تعلّم الخط عادةً في الصبا، لكن بعض الخطاطين بدأوا بعد الخمسين. ماذا يتعلم الطالب من النسخ والتصحيح والنسخ من جديد؟'
    ur: 'خطاطی کی تعلیم کو «مشق» کہا جاتا ہے۔ استاد سبق میں ایک نمونے کی سطر لکھتا ہے، شاگرد اسے نقل کر کے استاد کو دکھاتا ہے، اور خطا ہو تو استاد سطر کے نیچے درست حرف لکھتا ہے۔ تعلیم دو مرحلوں میں ہوتی ہے: پہلے حروف ایک ایک کر کے، پھر جڑے ہوئے الفاظ۔ یہ عموماً لڑکپن میں شروع ہوتی ہے، مگر کچھ خطاطوں نے پچاس سال کے بعد شروع کی۔ نقل، اصلاح اور پھر نقل سے طالب علم کیا سیکھ سکتا ہے؟'
