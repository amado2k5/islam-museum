  title:
    en: Plant ornament that respects the surface
    ar: زخرفة نباتية تحترم السطح
    ur: سطح کا لحاظ کرنے والی نباتاتی آرائش
  text:
    en: Richard Yeomans sees the beginning of the Islamic arabesque in Samarra style B, where leaves and palmettes become abstract, lose their stems and are organised into the surface geometry of polygons and polylobes. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. Which of these words describes what you see in a pattern?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز سامراء الثاني ⁦(ب)⁩، حيث تتجرد الأوراق والمراوح النخيلية وتفقد سيقانها وتنتظم في هندسة السطح من مضلعات ومتعددات الفصوص. ويرى أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. أي هذه الألفاظ يصف ما تراه في زخرفة؟
    ur: رچرڈ یومانز اسلامی عربی نقش کا آغاز سامرا کے طرز ب میں دیکھتے ہیں، جہاں پتے اور کھجور نما پنکھے تجریدی ہو جاتے ہیں، اپنے ڈنٹھل کھو دیتے ہیں اور کثیر الاضلاع اور کثیر الفصوص کی سطحی ہندسے میں منظم ہو جاتے ہیں۔ ان کی رائے میں نباتاتی عربی نقش اسلوب بند اور دو بعدی ہے، سطح کا لحاظ کرتا ہے، بند اور فطری یونانی رومی آرائش کے برخلاف۔ ان میں سے کون سا لفظ نقش میں آپ کے دیکھے ہوئے کو بیان کرتا ہے؟
  entity: concept/arabesque
