connections:
- position: before
  kind: object
  title:
    en: Stars and polygons from bands
    ar: نجوم ومضلعات من أشرطة
    ur: پٹیوں سے ستارے اور کثیر الاضلاع
  text:
    en: The record on girih says only that these are Islamic geometric strapwork patterns that build stars and polygons from interlacing bands. It adds that they were common in Safavid and Seljuk architecture and are based on girih tiles. It gives no more. Which words would you use to describe a pattern made of interlacing bands?
    ar: يقول سجل الجيره فقط إنها عقد هندسية إسلامية تبني نجومًا ومضلعات بخطوط متشابكة، وإنها شاعت في العمارة الصفوية والسلجوقية وتقوم على بلاطات جيره، ولا يزيد على ذلك. ما الألفاظ التي ستستعملها لوصف زخرفة مصنوعة من خطوط متشابكة؟
    ur: جیرہ کا اندراج صرف اتنا کہتا ہے کہ یہ اسلامی ہندسی گرہ کے نقش ہیں جو باہم گتھی ہوئی لکیروں سے ستارے اور کثیر الاضلاع بناتے ہیں، کہ وہ صفوی اور سلجوقی تعمیر میں عام تھے اور جیرہ ٹائلوں پر مبنی ہیں؛ وہ اس سے زیادہ کچھ نہیں کہتا۔ آپ باہم گتھی ہوئی لکیروں سے بنے نقش کو بیان کرنے کے لیے کون سے الفاظ استعمال کریں گے؟
