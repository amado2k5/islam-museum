- position: after
  kind: object
  title:
    en: Cutting away to leave letters
    ar: القص لتبقى الحروف
    ur: حروف باقی رکھنے کے لیے کاٹنا
  text:
    en: 'Rexford Newcomb divides Moroccan tilework into ceramic mosaic and painted tiles. In true mosaic the pieces are cut and laid like marble or glass tesserae. Inscriptions on panel borders are made from whole glazed tiles, usually black: the surface around the letters is cut through the glaze to the terracotta, leaving black letters on a terracotta ground, a process demanding great skill. How does cutting away produce an effect?'
    ar: يقسم نيوكومب البلاط الزخرفي المغربي إلى فسيفساء خزفية وبلاط مرسوم. ومن الفسيفساء ما هو فسيفساء حقيقية تُقص قطعها وتُرصف كما ترصف قطع الرخام أو الزجاج. وتُصنع الكتابات في أطر اللوحات من بلاطات مزججة كاملة، سوداء في الغالب، يُنقر ما حول الحروف بالأزاميل حتى يظهر الفخار، فيبدو الخط أسود على أرضية فخارية، وهي صنعة تحتاج إلى مهارة بالغة. كيف يصنع القصّ تأثيرًا؟
    ur: 'ریکسفورڈ نیوکومب مراکشی ٹائل کے کام کو سیرامک موزائیک اور رنگ کیے ہوئے ٹائلوں میں تقسیم کرتے ہیں۔ حقیقی موزائیک میں ٹکڑے سنگ مرمر یا شیشے کے ٹکڑوں کی طرح کاٹ کر جوڑے جاتے ہیں۔ تختیوں کے کناروں کی تحریریں پورے شیشہ دار ٹائلوں سے بنتی ہیں، عموماً سیاہ: حروف کے گرد کی سطح کو چھینیوں سے کاٹا جاتا ہے یہاں تک کہ مٹی نظر آئے، یوں مٹی کی زمین پر سیاہ حروف رہ جاتے ہیں، اور یہ عمل بڑی مہارت مانگتا ہے۔ کاٹ کر ہٹانا اثر کیسے پیدا کرتا ہے؟'
