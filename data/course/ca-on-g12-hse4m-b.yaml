- code: B2
  text:
    en: analyse, in historical and contemporary contexts, the dynamics of power relations and privilege as well as various factors that contribute to power or marginalization
    ar: حلّل، في سياقات تاريخية ومعاصرة، ديناميات علاقات القوة والامتياز وكذلك العوامل المختلفة التي تسهم في القوة أو التهميش
