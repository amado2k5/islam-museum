  text:
    ar: 'في شرح ما أشكل من مصادرات كتاب إقليدس درس عمر الخيام بناء نظرية المتوازيات باستعمال رباعي ذي ساقين متساويين عموديين على قاعدة، ويُوصل طرفاهما العلويان بخط. ويسأل البحث عن الزاويتين عند هذا الوصل: أهما قائمتان أم حادتان أم منفرجتان؟ وهذه مساهمة في ترتيب البرهان، لا إثبات المصادرة الخامسة من بقية المصادرات وحدها. ما الخصائص التي تستطيع أن تحصيها لهذا الرباعي من الرسم؟'
    en: In his commentary on Euclid's postulates, Umar Khayyam reconstructed the theory of parallels using a quadrilateral with equal legs perpendicular to its base, their upper ends joined. The investigation asks whether the two summit angles are right, acute or obtuse. The record says this concerns how a proof is organised, not proving the fifth postulate from Euclid's other assumptions alone. Which properties of this quadrilateral can you list from a drawing?
    ur: شرح مشکلات مصادرات کتاب اقلیدس میں عمر خیام نے متوازی نظریے کی نئی ترتیب ایک چہارضلعی سے کی جس کی مساوی ساقیں قاعدے پر عمود ہیں اور ان کے بالائی سرے ملائے گئے ہیں۔ سوال ہے کہ اوپر دونوں زاویے قائم، حادہ یا منفرجہ ہیں؟ اضافہ برہان کی ترتیب کا ہے، باقی مسلموں سے تنہا پانچویں مسلمے کا ثبوت نہیں۔ ڈرائنگ سے آپ اس چہارضلعی کی کون سی خصوصیات گنوا سکتے ہیں؟
