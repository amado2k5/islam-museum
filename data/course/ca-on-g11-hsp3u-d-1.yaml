- position: within
  kind: reflection
  title:
    en: Why humans must live together
    ar: لماذا لا بد للناس من الاجتماع
    ur: انسانوں کے لیے مل جل کر رہنا کیوں لازم ہے
  text:
    en: 'Ibn Khaldun shows that man must associate, because the power of the individual falls short of obtaining his sustenance alone: wheat needs grinding, kneading and cooking, and tools from the smith, the carpenter and the potter. He also mentions the need for a restraining authority, the wazi'', because of the aggression in people''s natures. Which of these two reasons seems stronger to you, and why?'
    ar: يبين ابن خلدون أن الإنسان لا بد له من الاجتماع، لأن قدرة الفرد قاصرة عن تحصيل قوته وحده؛ فالحنطة تحتاج إلى طحن وعجن وطبخ وآلات من حداد ونجار وفخاري. ويذكر كذلك حاجة الناس إلى «وازع» يدفع بعضهم عن بعض لما في طباعهم من العدوان. أي السببين تراه أقوى، ولماذا؟
    ur: ابن خلدون بیان کرتے ہیں کہ انسان کے لیے اجتماع لازم ہے، کیونکہ فرد کی قدرت اپنی خوراک اکیلے حاصل کرنے سے قاصر ہے؛ مثلاً گندم کو پیسنا، گوندھنا، پکانا اور لوہار، بڑھئی اور کمہار کے آلات چاہییں، تو تعاون لازم ہے۔ وہ لوگوں کی ایک «وازع» کی ضرورت بھی ذکر کرتے ہیں جو ان کی طبیعتوں میں موجود زیادتی کی وجہ سے ایک دوسرے کو روکے۔ آپ کو ان دو وجوہ میں سے کون سی زیادہ مضبوط لگتی ہے، اور کیوں؟
