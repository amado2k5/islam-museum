  title:
    en: Ibn Khaldun and the science of umran
    ar: ابن خلدون وعلم العمران
    ur: ابن خلدون اور علمِ عمران
  text:
    en: Ibn Khaldun, author of the Muqaddima, opens it by calling the art of history a noble discipline with many benefits, and takes as the subject of his new science umran, the necessary human association. The Mawsu'at A'lam al-Ulama' wa-l-Adaba' calls him the author of the first book on the philosophy of history and human society among the scholars of Arab-Islamic civilisation. What would you need to read to judge a theorist's contribution?
    ar: ابن خلدون مؤلف «المقدمة»، افتتحها بأن فن التاريخ فن عزيز المذهب كثير الفوائد، وجعل موضوع علمه الجديد «العمران»، أي الاجتماع الإنساني الضروري. وتعدّه «موسوعة أعلام العلماء والأدباء» صاحب أول كتاب في فلسفة التاريخ والاجتماع البشري بين علماء الحضارة العربية الإسلامية. ماذا تحتاج أن تقرأ لتحكم على إسهام منظِّر ما؟
    ur: ابن خلدون «المقدمہ» اور «کتاب العبر» کے مؤلف تھے۔ انہوں نے مقدمے کا آغاز اس بات سے کیا کہ تاریخ کا فن ایک باوقار علم ہے جس کے فوائد بہت ہیں، اور اپنے نئے علم کا موضوع «عمران» قرار دیا، یعنی ضروری انسانی اجتماعیت۔ کسی نظریہ ساز کی خدمت کو پرکھنے کے لیے آپ کو کیا پڑھنا ہوگا؟
  entity: person/ibn-khaldun
  sources:
  - source/muqaddima-ibn-khaldun
