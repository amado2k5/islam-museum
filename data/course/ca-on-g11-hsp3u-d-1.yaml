- position: after
  kind: reflection
  title:
    en: 'Asabiyya: a theorist''s key term'
    ar: 'العصبية: مصطلح مفتاحي عند منظِّر'
    ur: 'عصبیت: ایک مفکر کی کلیدی اصطلاح'
  text:
    en: Asabiyya is the bond of descent and blood around which the members of a tribe gather, so that they support one another. Al-Rahiq al-Makhtum states that it was the foundation of the social order among the Arabs of the Jahiliyya, and Ibn Khaldun later made it the key to understanding the rise and fall of states. The record notes that the book does not elaborate his theory of it. How would you explain a theorist's key term in one sentence?
    ar: العصبية هي رابطة النسب والدم التي يلتفّ حولها أبناء القبيلة فينصر بعضهم بعضاً. يذكر الرحيق المختوم أنها كانت أساس النظام الاجتماعي عند عرب الجاهلية، وجعلها ابن خلدون لاحقاً مفتاح فهم قيام الدول وسقوطها. ويذكر السجل أن الرحيق المختوم لا يفصّل نظرية ابن خلدون فيها. كيف تشرح في جملة واحدة مصطلحاً مفتاحياً لمنظِّر ما؟
    ur: عصبیت نسب اور خون کا وہ رشتہ ہے جس کے گرد قبیلے کے افراد جمع ہو کر ایک دوسرے کی مدد کرتے ہیں۔ الرحیق المختوم بیان کرتا ہے کہ یہی جاہلی عرب کے سماجی نظام کی بنیاد تھی، اور بعد میں ابن خلدون نے اسے ریاستوں کے قیام و زوال کو سمجھنے کی کنجی قرار دیا۔ اندراج بتاتا ہے کہ الرحیق المختوم ابن خلدون کے نظریے کی تفصیل نہیں دیتا۔ آپ کسی نظریہ ساز کی کلیدی اصطلاح کو ایک جملے میں کیسے سمجھائیں گے؟
