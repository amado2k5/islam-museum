  text:
    en: 'compare aspects of the daily lives of different groups within a few early societies, including at least one First Nation and one Inuit society […], and explain how differences were related to the social organization of that society […]'
    ar: 'قارن بين جوانب من الحياة اليومية لجماعات مختلفة داخل عدد قليل من المجتمعات المبكرة، ومنها مجتمع واحد على الأقل من الأمم الأولى ومجتمع واحد من الإنويت […]، واشرح كيف ارتبطت الفروق بالتنظيم الاجتماعي لذلك المجتمع […]'
    ur: 'چند ابتدائی معاشروں کے اندر مختلف گروہوں کی روزمرہ زندگی کے پہلوؤں کا موازنہ کریں، جن میں کم از کم ایک فرسٹ نیشن اور ایک اِنوئٹ معاشرہ شامل ہو […]، اور وضاحت کریں کہ فرق اس معاشرے کی سماجی تنظیم سے کیسے جڑے تھے […]'
