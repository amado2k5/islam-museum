  kind: object
  title:
    en: 'Who wore what in al-Andalus'
    ar: 'من كان يلبس ماذا في الأندلس'
    ur: 'اندلس میں کون کیا پہنتا تھا'
  text:
    en: 'Ibn Sa''id, as al-Maqqari transmits him, describes the dress of the people of al-Andalus. In the west no judge or jurist was seen without a turban, and only venerable elders placed the shawl on their heads. Woollen ghafa''ir were worn in red and green, with yellow reserved for Jews. Only the scholar let his lock of hair hang down. What do such differences show about how a society was organised?'
    ar: 'يصف ابن سعيد، فيما ينقله المقري، زي أهل الأندلس. ففي غربها لا يُرى قاضٍ ولا فقيه إلا بعمامة، ولا يضع الطيلسان على رأسه إلا الأشياخ المعظمون. ويلبسون غفائر الصوف حمراً وخضراً، والصفراء مخصوصة باليهود. والذؤابة لا يرخيها إلا العالم. ماذا تدل هذه الفروق على طريقة تنظيم المجتمع؟'
    ur: 'ابن سعید، جیسا کہ مقری نے نقل کیا، اہلِ اندلس کے لباس کا حال بیان کرتے ہیں۔ مغربی اندلس میں کوئی قاضی یا فقیہ پگڑی کے بغیر نظر نہیں آتا تھا، اور طیلسان سر پر صرف معزز بزرگ رکھتے تھے۔ اون کی غفائر سرخ اور سبز پہنی جاتی تھیں، اور زرد رنگ یہود کے لیے مخصوص تھا۔ ذُؤابہ صرف عالم لٹکاتا تھا۔ یہ فرق معاشرے کی تنظیم کے بارے میں کیا ظاہر کرتے ہیں؟'
