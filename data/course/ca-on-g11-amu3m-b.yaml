expectations:
- code: B1
  text:
    en: use the critical analysis process when responding to, analysing, reflecting on, and interpreting music
    ar: استخدم عملية التحليل النقدي عند الاستجابة للموسيقى وتحليلها والتأمل فيها وتفسيرها
    ur: موسیقی پر ردِّعمل ظاہر کرتے، اس کا تجزیہ کرتے، اس پر غور کرتے اور اس کی تعبیر کرتے وقت تنقیدی تجزیے کا عمل استعمال کریں
- code: B2
  text:
    en: demonstrate an understanding of social and cultural influences on and effects of traditional, commercial, and art music
    ar: أظهر فهمًا للتأثيرات الاجتماعية والثقافية في الموسيقى التقليدية والتجارية والفنية ولآثارها
    ur: روایتی، تجارتی اور فنی موسیقی پر سماجی و ثقافتی اثرات اور اس کے اثرات کی سمجھ کا مظاہرہ کریں
- code: B3
  text:
    en: demonstrate an understanding of how performing, creating, and critically analysing music has affected their skills and personal development
    ar: أظهر فهمًا لكيفية تأثير الأداء الموسيقي وإبداع الموسيقى وتحليلها نقديًا في مهاراتك ونموك الشخصي
    ur: موسیقی کی پیش کش، تخلیق اور تنقیدی تجزیے نے آپ کی مہارتوں اور ذاتی نشوونما پر کیا اثر ڈالا، اس کی سمجھ کا مظاہرہ کریں
- code: B4
  text:
    en: analyse opportunities and requirements for continued engagement in music
    ar: حلّل الفرص والمتطلبات اللازمة لمواصلة الانخراط في الموسيقى
    ur: موسیقی میں مسلسل شمولیت کے مواقع اور تقاضوں کا تجزیہ کریں
