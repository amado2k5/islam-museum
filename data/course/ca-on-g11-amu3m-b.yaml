summary:
  en: How music answers to its society, who shaped it, how traditions meet, and how we know about musicians; the museum serves examples from the Muslim world (B1.4, B2.1, B2.2, B2.3).
  ar: كيف تستجيب الموسيقى لمجتمعها، ومن صنعها، وكيف تلتقي التقاليد، وكيف نعرف شيئًا عن الموسيقيين؛ ويقدّم المتحف أمثلة من العالم الإسلامي، B1.4 وB2.1 وB2.2 وB2.3.
  ur: موسیقی اپنے معاشرے کو کیسے جواب دیتی ہے، اسے کس نے شکل دی، روایتیں کیسے ملتی ہیں اور موسیقاروں کے بارے میں ہم کیسے جانتے ہیں؛ عجائب گھر مسلم دنیا کی مثالیں پیش کرتا ہے، B1.4، B2.1، B2.2، B2.3۔
