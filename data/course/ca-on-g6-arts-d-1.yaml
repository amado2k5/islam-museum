  title:
    en: Stars, polygons and grids
    ar: نجوم ومضلعات وشبكات
    ur: ستارے، کثیر الاضلاع اور جالیاں
  text:
    en: The record describes Islamic geometric patterns as repeated patterns of stars, polygons and grids that cover the surfaces of Islamic architecture and art from al-Andalus to Central Asia. Which shapes can you pick out, and what does repeating them across a surface do to the way a wall or a page looks?
    ar: يصف السجل الزخارف الهندسية الإسلامية بأنها أنماط هندسية متكررة من نجوم ومضلعات وشبكات تغطي أسطح العمارة والفن الإسلامي من الأندلس إلى آسيا الوسطى. أي أشكال تستطيع تمييزها، وماذا يفعل تكرارها على سطح ما في مظهر الجدار أو الصفحة؟
    ur: ریکارڈ اسلامی ہندسی نقوش کو ستاروں، کثیر الاضلاع شکلوں اور جالیوں کے دہرائے جانے والے ہندسی نمونے بتاتا ہے جو اندلس سے وسطی ایشیا تک اسلامی عمارتوں اور فن کی سطحوں کو ڈھانپتے ہیں۔ آپ کون سی شکلیں پہچان سکتے ہیں، اور انہیں کسی سطح پر دہرانے سے دیوار یا صفحے کا انداز کیسے بدلتا ہے؟
  entity: concept/islamic-geometric-patterns
