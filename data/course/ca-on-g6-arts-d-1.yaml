- position: within
  kind: object
  title:
    en: Leaves that become pattern
    ar: أوراق تصير نمطًا
    ur: پتے جو نقش بن جاتے ہیں
  text:
    en: Yeomans sees the beginning of the Islamic arabesque in a style found at Samarra, where leaves become simple shapes, lose their stems and are arranged into a flat pattern on the surface. In his view the vegetal arabesque is stylised and two-dimensional, respecting the surface, unlike closed, naturalistic Graeco-Roman ornament. How does a design that respects the surface differ from one that seems to grow out of it?
    ar: يرى يومانز أن مولد الأرابيسك الإسلامي يُشهد في طراز وُجد في سامراء، حيث تصير الأوراق أشكالًا بسيطة وتفقد سيقانها وتنتظم في نقش مسطّح على السطح. وفي رأيه أن الأرابيسك النباتي منمّط ثنائي البعد يحترم السطح، بخلاف الزخرفة الإغريقية الرومانية المغلقة الميّالة إلى المحاكاة. كيف يختلف تصميم يحترم السطح عن تصميم يبدو كأنه ينمو خارجًا منه؟
    ur: یومنز کے نزدیک اسلامی عربیسک کی پیدائش سامرا کے ایک طرز میں دکھائی دیتی ہے، جہاں پتے سادہ شکلیں بن جاتے ہیں، اپنے تنے کھو دیتے ہیں اور سطح پر ایک ہموار نقش میں ترتیب پاتے ہیں۔ ان کی رائے میں نباتاتی عربیسک مخصوص انداز کا اور دو بعدی ہے اور سطح کا احترام کرتا ہے، برخلاف بند اور فطرت کی نقالی کی طرف مائل یونانی رومی آرائش کے۔ جو ڈیزائن سطح کا احترام کرے وہ اس ڈیزائن سے کیسے مختلف ہے جو سطح سے باہر اگتا محسوس ہو؟
