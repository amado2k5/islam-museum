  title:
    en: Taking the shipbreaking yards to court
    ar: مقاضاة ساحات تفكيك السفن
    ur: جہاز شکنی کے یارڈز کو عدالت میں لانا
  text:
    en: 'According to English Wikipedia, Rizwana Hasan became involved in the shipbreaking industry by suing the breaking yards in Chittagong in 2003 for, among other reasons, health hazards to workers, poor working conditions and improper waste disposal, and in March 2003 the court declared shipbreaking without an environmental clearance illegal. The article adds that she has since sued over lake-filling, polythene and deforestation. Which part of this protects health?'
    ar: 'تذكر ويكيبيديا الإنجليزية أن رضوانة حسن انخرطت في قضية تفكيك السفن ابتداء من مقاضاة ساحات التفكيك في شيتاغونغ سنة 2003 لأسباب منها مخاطرها الصحية على العمال وسوء ظروف العمل والتخلص غير السليم من النفايات، وأن المحكمة أعلنت في مارس 2003 عدم قانونية تفكيك السفن دون تصريح بيئي. وتضيف المقالة أنها قاضت لاحقًا في ردم البحيرات والبولي إيثيلين وإزالة الغابات. فأي جزء من هذا يحمي الصحة؟'
    ur: 'انگریزی وکی پیڈیا کے مطابق رضوانہ حسن جہاز شکنی کی صنعت میں اس طرح شامل ہوئیں کہ 2003 میں انہوں نے چٹاگانگ کے توڑ پھوڑ کے یارڈز پر مقدمہ کیا، دوسری وجوہ کے علاوہ کارکنوں کے لیے صحت کے خطرات، خراب حالاتِ کار اور فضلہ کو غلط طریقے سے ٹھکانے لگانے کی بنا پر، اور مارچ 2003 میں عدالت نے ماحولیاتی منظوری کے بغیر جہاز شکنی کو غیر قانونی قرار دیا۔ مضمون مزید کہتا ہے کہ بعد میں انہوں نے جھیلوں کی بھرائی، پولی تھین اور جنگلات کی کٹائی پر بھی مقدمے کیے۔ اس میں سے کون سا حصہ صحت کی حفاظت کرتا ہے؟'
