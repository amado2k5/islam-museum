  title:
    en: An owl and a helmeted head
    ar: بومة ورأس بخوذة
    ur: الو اور خود پہنے سر
  text:
    en: "Farajallah Ahmad Yusuf writes that the Sabaeans struck coins on the Greek model, the oldest from the second half of the fourth century BCE, with the helmeted head of Athena on one face and an owl, olive sprig and crescent on the other, and letters in Musnad script marking the denomination. He adds that Nabataean coins were Hellenistic in influence before Obodas II and less so after. What travels with a coin besides its metal?"
    ar: "يذكر فرج الله أحمد يوسف أن السبئيين ضربوا نقودهم على الطراز الإغريقي، وأقدمها من النصف الثاني للقرن الرابع قبل الميلاد، على وجهها رأس المعبودة أثينا بخوذة، وعلى ظهرها بومة وغصن زيتون وهلال، وعليها حروف بخط المسند تحدد القيمة. ويضيف أن نقود الأنباط كانت قبل الملك عبادة الثاني متأثرة بالنقود الهلنستية ثم قلت تلك التأثيرات. ماذا ينتقل مع العملة غير معدنها؟"
    ur: "فرج اللہ احمد یوسف لکھتے ہیں کہ سبائیوں نے یونانی طرز پر سکے ضرب کیے، قدیم ترین چوتھی صدی قبل مسیح کے نصفِ آخر کے، جن کے رخ پر خود پہنے دیوی ایتھینا کا سر اور پشت پر الو، زیتون کی ٹہنی اور ہلال، اور مسند خط میں قیمت بتانے والے حروف ہیں۔ وہ مزید لکھتے ہیں کہ نبطی سکے عبادہ دوم سے پہلے ہیلینی اثر میں تھے اور بعد میں کم۔ سکے کے ساتھ اس کی دھات کے سوا اور کیا سفر کرتا ہے؟"
