  text:
    en: Girih are Islamic geometric knot patterns that build stars and polygons from interlacing lines. They were widespread in Safavid and Seljuk architecture and rest on girih tiles. Which shapes can you pick out in one of them?
    ar: الجيره عقد هندسية إسلامية تبني نجومًا ومضلعات بخطوط متشابكة؛ شاعت في العمارة الصفوية والسلجوقية وتقوم على بلاطات جيره. أيّ الأشكال تستطيع أن تميّزها في أحدها؟
    ur: گرہ اسلامی ہندسی گرہیں ہیں جو ستارے اور کثیر الاضلاع متشابک لکیروں سے بناتی ہیں؛ یہ صفوی اور سلجوقی فن تعمیر میں عام ہوئیں اور ٹائلوں کی بنیاد پر قائم ہوتی ہیں۔ ان میں سے کسی ایک میں آپ کون سی شکلیں پہچان سکتے ہیں؟
