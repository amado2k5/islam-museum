expectations:
- code: B1
  text:
    en: demonstrate an understanding of the critical analysis process by examining, interpreting, evaluating, and reflecting on various art works
    ar: أظهر فهمًا لعملية التحليل النقدي من خلال فحص أعمال فنية متنوعة وتفسيرها وتقييمها والتأمل فيها
    ur: مختلف فن پاروں کا جائزہ لے کر، ان کی تعبیر، تشخیص اور ان پر غور کر کے تنقیدی تجزیے کے عمل کی سمجھ کا مظاہرہ کریں
- code: B2
  text:
    en: demonstrate an understanding of how art works reflect the society in which they were created, and of how they can affect both social and personal values
    ar: أظهر فهمًا لكيفية انعكاس المجتمع الذي نشأت فيه الأعمال الفنية عليها، ولكيفية تأثيرها في القيم الاجتماعية والشخصية معًا
    ur: اس بات کی سمجھ کا مظاہرہ کریں کہ فن پارے اس معاشرے کی عکاسی کیسے کرتے ہیں جس میں وہ تخلیق ہوئے، اور وہ سماجی اور ذاتی دونوں اقدار پر کیسے اثر ڈال سکتے ہیں
- code: B3
  text:
    en: demonstrate an understanding of various job opportunities both within and outside the area of visual arts and how skills related to visual arts can be applied in the workplace
    ar: أظهر فهمًا لفرص العمل المتنوعة داخل مجال الفنون البصرية وخارجه، ولكيفية تطبيق المهارات المتصلة بالفنون البصرية في مكان العمل
    ur: بصری فنون کے شعبے کے اندر اور باہر روزگار کے مختلف مواقع کی، اور اس بات کی سمجھ کا مظاہرہ کریں کہ بصری فنون سے متعلق مہارتیں کام کی جگہ پر کیسے برتی جا سکتی ہیں
