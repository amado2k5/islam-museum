  ur: 'فن پاروں کا جائزہ، وہ اپنے معاشروں کی عکاسی اور ان پر اثر کیسے کرتے ہیں، اور بصری فنون میں روزگار کے مواقع ⁦(توقعات B1 سے B3)⁩۔ میوزیم دو سبق جوڑتا ہے: تین تاریخی کام، اور خطاط کا ہنر۔'
