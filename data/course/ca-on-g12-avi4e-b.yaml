label:
  en: 'Strand B: Reflecting, Responding, and Analysing'
  ar: 'المحور B: التأمل والاستجابة والتحليل'
  ur: 'شاخ B: غور و فکر، ردِعمل اور تجزیہ'
  es: "Eje B: Reflexión, respuesta y análisis"
  fr: "Volet B: Réfléchir, répondre et analyser"
  tr: "B Ekseni: Yansıma, Tepki ve Analiz"
  id: "Sumbu B: Refleksi, Respons, dan Analisis"
summary:
  en: 'Examining art works, how they reflect and affect their societies, and job opportunities in the visual arts (expectations B1 to B3). The museum maps two lessons: three historical works, and the calligrapher''s craft.'
  ar: 'فحص الأعمال الفنية، وكيف تعكس مجتمعاتها وتؤثر فيها، وفرص العمل في الفنون البصرية ⁦(التوقعات من B1 إلى B3)⁩. ويربط المتحف درسين: ثلاثة أعمال تاريخية، وصنعة الخطّاط.'
  ur: 'فن پاروں کا جائزہ، وہ اپنے معاشروں کی عکاسی اور ان پر اثر کیسے کرتے ہیں، اور بصری فنون میں روزگار کے مواقع ⁦(توقعات B1 سے B3)⁩۔ میوزیم دو سبق جوڑتا ہے: تین تاریخی کام، اور خطاط کا ہنر۔'
  es: "Analizar obras de arte, cómo reflejan e influyen en sus sociedades y las oportunidades laborales en las artes visuales (niveles B1 a B3). El museo propone dos lecciones: tres obras históricas y el oficio del calígrafo."
  fr: "Ce cours porte sur l'étude des œuvres d'art, leur influence sur les sociétés et les perspectives d'emploi dans le domaine des arts visuels (niveaux B1 à B3). Le musée propose deux leçons: trois œuvres historiques et l'art de la calligraphie."
  tr: "Bu çalışma, sanat eserlerini, bunların toplumlarını nasıl yansıttığını ve etkilediğini ve görsel sanatlar alanındaki kariyer fırsatlarını (B1'den B3'e kadar beklentiler) inceliyor. Müze, iki dersi birbirine bağlıyor: üç tarihi eser ve kaligrafi sanatı."
  id: "Studi ini meneliti karya seni, bagaimana karya seni tersebut mencerminkan dan memengaruhi masyarakatnya, serta peluang karier di bidang seni visual (harapan dari tingkat B1 hingga B3). Museum ini menghubungkan dua pelajaran: tiga karya bersejarah dan seni kaligrafi."
