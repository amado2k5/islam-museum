- { id: person/abu-burqan, label: { ar: "أبو برقان", en: "Abu Burqan" }, note: "عم النبي من الرضاعة ومن وفد هوازن الأربعة عشر إلى الجعرانة" }
- { id: person/masud-ibn-amr-al-ghifari, label: { ar: "مسعود بن عمرو الغفاري", en: "Mas'ud ibn Amr al-Ghifari" }, note: "أمين الغنائم المحبوسة بالجعرانة بعد حنين" }
- { id: person/al-harith-ibn-al-harith-ibn-kalda, label: { ar: "الحارث بن الحارث بن كلدة", en: "al-Harith ibn al-Harith ibn Kalda" }, note: "من سادات قريش، أعطاه النبي مائة من الإبل بالجعرانة" }
# Added by the raheeq lane (batch 22: hajj of Abu Bakr and the delegations, pp. 440-457)
- { id: group/abd-al-qays, label: { ar: "عبد القيس", en: "Abd al-Qays" }, note: "قبيلة من ربيعة بالبحرين؛ وفدوا مرتين سنة 5هـ وسنة 9هـ" }
- { id: group/judham, label: { ar: "جذام", en: "Judham" }, note: "قبيلة قضاعية على تخوم الشام، منها فروة بن عمرو" }
- { id: group/daws, label: { ar: "دوس", en: "Daws" }, note: "قبيلة من الأزد، قوم الطفيل بن عمرو، وفدوا نحو ثمانين بيتاً سنة 7هـ" }
- { id: group/himyar, label: { ar: "حمير", en: "Himyar" }, note: "ملوك اليمن في زمن النبوة، كتبوا بإسلامهم بعد تبوك" }
- { id: group/hamdan, label: { ar: "همدان", en: "Hamdan" }, note: "قبيلة يمنية كبيرة أسلمت جميعاً على يد علي بن أبي طالب سنة 9هـ" }
- { id: group/tajib, label: { ar: "تجيب", en: "Tajib" }, note: "قبيلة قدم وفدها بصدقات قومه ثلاثة عشر رجلاً" }
- { id: group/udhra, label: { ar: "عذرة", en: "Udhra" }, note: "قبيلة قضاعية من أخوة قصي لأمه، وفدوا اثني عشر رجلاً صفر 9هـ" }
- { id: group/bali, label: { ar: "بلي", en: "Bali" }, note: "قبيلة قضاعية وفدت ربيع الأول 9هـ وسأل رئيسهم عن الضيافة" }
- { id: group/fazara, label: { ar: "فزارة", en: "Fazara" }, note: "قبيلة غطفانية شكت للنبي جدب بلادها فاستسقى لهم سنة 9هـ" }
- { id: group/sadaf, label: { ar: "صداء", en: "Sadaf" }, note: "قبيلة من اليمن ورد وفدها بعد الجعرانة سنة 8هـ" }
- { id: group/nakh, label: { ar: "نخع", en: "Nakh'" }, note: "قبيلة يمنية، آخر الوفود المدونة؛ توافدت منتصف محرم 11هـ في مائتي رجل" }
- { id: group/kinda, label: { ar: "كندة", en: "Kinda" }, note: "قبيلة من حضرموت وردت ضمن وفود عام الوفود" }
- { id: group/azd, label: { ar: "الأزد", en: "al-Azd" }, note: "من كبرى قبائل اليمن، وردت ضمن وفود عام الوفود" }
- { id: person/al-ashajj-al-asri, label: { ar: "الأشج العصري", en: "al-Ashajj al-Asri" }, note: "كبير وفد عبد القيس الأول؛ قال فيه النبي: فيك خصلتان يحبهما الله: الحلم والأناة" }
- { id: person/jarud-ibn-al-ala, label: { ar: "الجارود بن العلاء", en: "al-Jarud ibn al-Ala" }, note: "العبدي النصراني الذي أسلم وحسن إسلامه في وفد عبد القيس الثاني" }
- { id: person/abd-al-masih-al-aqib, label: { ar: "عبد المسيح العاقب", en: "Abd al-Masih al-Aqib" }, note: "عاقب وفد نجران وصاحب الإمارة والحكومة؛ أسلم بعد رجوعه فيما رووا" }
- { id: person/al-sayyid-al-ayham, label: { ar: "السيد الأيهم", en: "al-Sayyid al-Ayham" }, note: "سيد وفد نجران وصاحب أمورها الثقافية والسياسية، ويُقال اسمه شرحبيل" }
- { id: person/malik-ibn-murra-al-rahawi, label: { ar: "مالك بن مرة الرهاوي", en: "Malik ibn Murra al-Rahawi" }, note: "رسول ملوك حمير إلى النبي بإسلامهم" }
- { id: person/malik-ibn-al-namt, label: { ar: "مالك بن النمط", en: "Malik ibn al-Namt" }, note: "أمّره النبي على من أسلم من همدان" }
- { id: person/ziyad-ibn-al-harith-al-sudai, label: { ar: "زياد بن الحارث الصدائي", en: "Ziyad ibn al-Harith al-Suda'i" }, note: "جاء إلى النبي وافداً عن قومه صداء فردّ جيش الأربعمائة عنهم" }
- { id: person/fayruz-al-daylami, label: { ar: "فيروز الديلمي", en: "Fayruz al-Daylami" }, note: "قاتل الأسود العنسي باليمن قبل وفاة النبي بيوم وليلة" }
- { id: person/al-aswad-al-ansi, label: { ar: "الأسود العنسي", en: "al-Aswad al-Ansi" }, note: "المتنبئ الثاني باليمن، قتله فيروز الديلمي" }
- { id: person/bujayr-ibn-zuhayr, label: { ar: "بجير بن زهير", en: "Bujayr ibn Zuhayr" }, note: "أخو كعب بن زهير؛ كتب إليه يحذره ويدله على الاستئمان" }
- { id: person/zuhayr-ibn-abi-sulma, label: { ar: "زهير بن أبي سلمى", en: "Zuhayr ibn Abi Sulma" }, note: "الشاعر الجاهلي صاحب المعلقة، والد كعب وبجير" }
- { id: person/abu-al-dubayb, label: { ar: "أبو الضبيب", en: "Abu al-Dubayb" }, note: "رئيس وفد بلي؛ سأل النبي عن أجر الضيافة وضالة الغنم والبعير" }
- { id: person/hamza-ibn-al-numan, label: { ar: "حمزة بن النعمان", en: "Hamza ibn al-Nu'man" }, note: "من وفد عذرة الاثني عشر صفر 9هـ" }
- { id: person/amr-ibn-salama, label: { ar: "عمرو بن سلمة", en: "Amr ibn Salama" }, note: "صاحب حديث «اتركوه وقومه»، أمّ قومه بالصلاة وهو غلام لأكثرهم قرآناً" }
- { id: person/khalid-ibn-jafar, label: { ar: "خالد بن جعفر", en: "Khalid ibn Ja'far" }, note: "من رؤساء وفد بني عامر" }
- { id: person/jabbar-ibn-aslam, label: { ar: "جبار بن أسلم", en: "Jabbar ibn Aslam" }, note: "من رؤساء وفد بني عامر" }
- { id: person/labid-ibn-rabia, label: { ar: "لبيد بن ربيعة", en: "Labid ibn Rabi'a" }, note: "الشاعر العامري صاحب المعلقة، أخو أربد بن قيس لأمه" }
- { id: place/afra, label: { ar: "عفراء", en: "Afra'" }, note: "ماء بفلسطين صُلب عليه فروة بن عمرو الجذامي" }
- { id: place/maan, label: { ar: "معان", en: "Ma'an" }, note: "بلدة بجنوب الشام، منزل فروة بن عمرو عامل الروم" }
# Added by the raheeq lane (batch 23: the Farewell Pilgrimage and the death, pp. 458-472)
- { id: place/arafat, label: { ar: "عرفة", en: "Arafat" }, note: "موقف الحج الأعظم خارج الحرم، مكان خطبة الوداع" }
- { id: place/mina, label: { ar: "منى", en: "Mina" }, note: "وادٍ بين مكة ومزدلفة، فيه الجمرات والمنحر وخطبتا النحر والتشريق" }
- { id: place/muzdalifa, label: { ar: "مزدلفة", en: "Muzdalifa" }, note: "المشعر الحرام بين منى وعرفات، مبيت الحجاج ليلة النحر" }
- { id: place/al-baqia, label: { ar: "بقيع الغرقد", en: "al-Baqi'" }, note: "مقبرة المدينة، دفن فيها كثير من الصحابة وأهل البيت" }
- { id: place/dhu-al-hulayfa, label: { ar: "ذو الحليفة", en: "Dhu al-Hulayfa" }, note: "ميقات أهل المدينة على بعد نحو عشرة كيلومترات منها" }
- { id: person/qutham-ibn-al-abbas, label: { ar: "قثم بن العباس", en: "Qutham ibn al-Abbas" }, note: "ابن عم النبي، ممن قلّبه عند الغسل" }
- { id: person/shaqran, label: { ar: "شقران", en: "Shuqran" }, note: "مولى النبي، صبّ الماء مع أسامة عند غسله" }
- { id: person/aws-ibn-khawli, label: { ar: "أوس بن خولي", en: "Aws ibn Khawli" }, note: "أسند جسد النبي إلى صدره عند الغسل" }
- { id: person/abu-talha-zayd-ibn-sahl, label: { ar: "أبو طلحة زيد بن سهل", en: "Abu Talha Zayd ibn Sahl" }, note: "الأنصاري الذي رفع فراش النبي وحفر تحته فجُعل القبر لحداً" }
- { id: person/sarra-bint-nabhan, label: { ar: "سرّاء بنت نبهان", en: "Sarra' bint Nabhan" }, note: "راوية خطبة يوم الرؤوس في أيام التشريق" }
- { id: person/abd-al-rahman-ibn-abi-bakr, label: { ar: "عبد الرحمن بن أبي بكر", en: "Abd al-Rahman ibn Abi Bakr" }, note: "صاحب السواك الذي أخذته عائشة فلينته للنبي في احتضاره" }
- { id: person/abu-juhayfa, label: { ar: "أبو جحيفة" }, class: person, note: "صحابي روى أوصاف النبي — شمائل" }
- { id: person/jabir-ibn-samra, label: { ar: "جابر بن سمرة" }, class: person, note: "صحابي روى أوصاف النبي — شمائل" }
- { id: person/abu-l-as-ibn-al-rabi, label: { ar: "أبو العاص بن الربيع" }, class: person, note: "زوج زينب بنت النبي؛ ابن خالة لها" }
- { id: person/khunays-ibn-hudhafa, label: { ar: "خُنيس بن حذافة" }, class: person, note: "زوج حفصة بنت عمر الأول؛ استشهد ببدر أو توفي بعده" }
- { id: person/kharija-ibn-zayd, label: { ar: "خارجة بن زيد" }, class: person, note: "راوٍ نقل صفة مجلس النبي — شمائل" }
- { id: person/abu-tufayl-amir-ibn-wathila, label: { ar: "أبو الطفيل عامر بن واثلة" }, class: person, note: "صحابي وصف النبي؛ آخر من رآه موتاً بمكة" }
- { id: person/al-rabi-bint-muawwidh, label: { ar: "الربيع بنت معوذ" }, class: person, note: "صحابية؛ وصفت النبي ليلة زفافها" }
