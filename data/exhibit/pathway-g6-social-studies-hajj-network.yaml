id: exhibit/pathway-g6-social-studies-hajj-network
class: exhibit
kind: lesson
label:
  ar: "الحج: رحلة تربط مجتمعات العالم"
  en: "The Hajj: one journey that links communities across the world"
  ur: "حج: ایک سفر جو دنیا کی برادریوں کو جوڑتا ہے"
  es: "El Hajj: un viaje que une comunidades de todo el mundo."
  fr: "Le Hajj: un voyage qui unit les communautés du monde entier"
  tr: "Hac: Dünyanın topluluklarını birbirine bağlayan bir yolculuk"
  id: "Haji: Sebuah perjalanan yang menghubungkan komunitas-komunitas di seluruh dunia"
summary:
  ar: "درس للصف السادس عن الحج بوصفه شبكة عالمية: ما يفعله الحجاج في مكة، ومن أين يأتون منذ قرون، وكيف يرتبط مجتمع مسلم في كندا اليوم بالعالم عبر هذه الرحلة."
  en: "A Grade 6 lesson on the Hajj as a global network: what pilgrims do in Mecca, where they have come from for centuries, and how a Muslim community in Canada today is linked to the world through this journey."
  ur: "جماعت ششم کا سبق حج پر ایک عالمی جال کے طور پر: حاجی مکہ میں کیا کرتے ہیں، صدیوں سے وہ کہاں سے آتے ہیں، اور آج کینیڈا کی ایک مسلم برادری اس سفر کے ذریعے دنیا سے کیسے جڑی ہے۔"
  es: "Una lección para alumnos de sexto grado sobre el Hajj como red global: qué hacen los peregrinos en La Meca, de dónde han venido durante siglos y cómo una comunidad musulmana en Canadá hoy en día está conectada con el mundo a través de este viaje."
  fr: "Une leçon de 6e année sur le Hajj en tant que réseau mondial: ce que font les pèlerins à La Mecque, d’où ils viennent depuis des siècles et comment une communauté musulmane au Canada est aujourd’hui liée au monde par ce voyage."
  tr: "Altıncı sınıf öğrencileri için Hac'ı küresel bir ağ olarak ele alan bir ders: Hacılar Mekke'de neler yapıyor, yüzyıllardır nereden geliyorlar ve Kanada'daki bir Müslüman topluluğu bugün bu yolculuk aracılığıyla dünyayla nasıl bağlantı kuruyor."
  id: "Pelajaran kelas enam tentang Haji sebagai jaringan global: apa yang dilakukan para peziarah di Mekah, dari mana mereka berasal selama berabad-abad, dan bagaimana komunitas Muslim di Kanada saat ini terhubung dengan dunia melalui perjalanan ini."
audience:
  - teacher
  - student
level: intro
duration_minutes: 60
wings: []
goal:
  ar: أن يشرح التلميذ مراحل الحج وأن يبيّن كيف تربط رحلةٌ واحدة مجتمعاتٍ في بلاد كثيرة، منها مجتمعه في كندا.
  en: Students explain the stages of the Hajj and show how one journey links communities in many countries, including their own in Canada.
  ur: طلبہ حج کے مراحل بیان کریں اور دکھائیں کہ ایک سفر کئی ملکوں کی برادریوں کو، جن میں کینیڈا کی ان کی اپنی برادری بھی ہے، کیسے جوڑتا ہے۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: G6-SS
  course_title:
    ar: الدراسات الاجتماعية، الصف السادس
    en: Social Studies, Grade 6
    ur: سوشل اسٹڈیز، جماعت ششم
  grade: "6"
  strand: A
  strand_title:
    ar: "التراث والهوية: المجتمعات في كندا ماضيًا وحاضرًا"
    en: "Heritage and Identity: Communities in Canada, Past and Present"
    ur: "ورثہ اور شناخت: کینیڈا کی برادریاں، ماضی اور حال"
  expectations:
    - A2
    - A3
  expectation:
    ar: "يعطي الدرس المادة التاريخية والجغرافية لممارسةٍ تُعرّف بها جماعة دينية معاصرة في كندا: الحج. يقدّم المتحف الرحلة ومراحلها وتاريخها، ويضيف المعلم تجربة مجتمع مسلم محلي ⁦(مسجد الحي، عائلة، ضيف)⁩ فيدرس التلاميذ منظور هذا المجتمع وجوانب حياته كما يطلب المحور."
    en: "The lesson supplies the historical and geographical matter of a practice that defines a contemporary religious community in Canada: the Hajj. The museum provides the journey, its stages and its history; the teacher adds the experience of a local Muslim community (a neighbourhood mosque, a family, a guest), so that students investigate that community's perspective and aspects of its life, as the strand asks."
    ur: یہ سبق کینیڈا کی ایک معاصر مذہبی برادری کی پہچان بننے والے عمل، حج، کا تاریخی اور جغرافیائی مواد دیتا ہے۔ میوزیم سفر، اس کے مراحل اور تاریخ فراہم کرتا ہے؛ استاد مقامی مسلم برادری کا تجربہ ⁦(محلے کی مسجد، ایک خاندان، ایک مہمان)⁩ جوڑتا ہے، تا کہ طلبہ اس برادری کے نقطۂ نظر اور اس کی زندگی کے پہلوؤں کی تحقیق کریں جیسا شاخ کا تقاضا ہے۔
  document: "The Ontario Curriculum: Social Studies, Grades 1 to 6; History and Geography, Grades 7 and 8, 2023 (dcp.edu.gov.on.ca)"
  verified: 2026-10-23
rooms:
  - title:
      ar: ما الحج؟
      en: What is the Hajj?
      ur: حج کیا ہے؟
      es: "¿Qué es el Hajj?"
      fr: "Qu'est-ce que le Hajj ?"
      tr: "Hac nedir?"
      id: "Apa itu Haji?"
    body:
      ar: رحلة إلى مكة مرة في العمر لمن استطاع، في أيام معلومة من السنة.
      en: A journey to Mecca once in a lifetime for those who are able, on set days of the year.
      ur: جو کر سکے اس کے لیے زندگی میں ایک بار مکہ کا سفر، سال کے مقررہ دنوں میں۔
      es: "Un viaje a La Meca que solo se puede realizar una vez en la vida, en fechas específicas del año, para quienes tengan la posibilidad."
      fr: "Un pèlerinage à La Mecque, une fois dans sa vie, pour ceux qui en ont les moyens, à des dates fixes de l'année."
      tr: "Yılın belirli günlerinde, imkanı olanlar için ömürde bir kez yaşanacak bir deneyim olan Mekke ziyareti."
      id: "Perjalanan ke Mekah yang hanya bisa dilakukan sekali seumur hidup bagi mereka yang mampu, pada hari-hari tertentu dalam setahun."
    features:
      - practice/hajj
  - title:
      ar: مكة والكعبة
      en: Mecca and the Kaaba
      ur: مکہ اور کعبہ
      es: "La Meca y la Kaaba"
      fr: "La Mecque et la Kaaba"
      tr: "Mekke ve Kabe"
      id: "Mekah dan Ka'bah"
    body:
      ar: المدينة التي يتوجّه إليها المسلمون في صلاتهم، والبيت الذي يطوفون حوله.
      en: The city Muslims face in prayer, and the House they walk around.
      ur: وہ شہر جس کی طرف مسلمان نماز میں رخ کرتے ہیں، اور وہ گھر جس کے گرد وہ چکر لگاتے ہیں۔
      es: "La ciudad hacia la que se orientan los musulmanes en sus oraciones, y la Casa que rodean."
      fr: "La ville vers laquelle les musulmans se tournent pour prier, et la Maison autour de laquelle ils circulent."
      tr: "Müslümanların namaz kılarken yöneldikleri şehir ve etrafında tavaf ettikleri ev."
      id: "Kota yang menjadi arah hadap umat Muslim saat berdoa, dan rumah yang mereka tawaf di sekelilingnya."
    features:
      - place/mecca
      - building/kaaba
  - title:
      ar: الطواف
      en: Tawaf, circling the Kaaba
      ur: طواف
      es: "Tawaf, circunvalación de la Kaaba"
      fr: "Tawaf, circumambulation de la Kaaba"
      tr: "Çevresel yürüyüş"
      id: "Berkeliling"
    body:
      ar: "سبعة أشواط حول الكعبة: ماذا يفعل الحاج وماذا يقول."
      en: "Seven circuits around the Kaaba: what the pilgrim does and says."
      ur: "کعبہ کے گرد سات چکر: حاجی کیا کرتا اور کیا کہتا ہے۔"
      es: "Siete vueltas alrededor de la Kaaba: qué hace y dice el peregrino."
      fr: "Les sept tours autour de la Kaaba: ce que fait et dit le pèlerin."
      tr: "Kabe'nin etrafında yedi tavaf: Hacı ne yapar ve ne söyler?"
      id: "Tujuh putaran mengelilingi Ka'bah: Apa yang dilakukan dan apa yang diucapkan oleh jamaah haji?"
    features:
      - practice/tawaf
  - title:
      ar: يوم عرفة
      en: The day of Arafat
      ur: عرفہ کا دن
      es: "El día de Arafat"
      fr: "Le jour d'Arafat"
      tr: "Arafat Günü"
      id: "Hari Arafah"
    body:
      ar: "أهم يوم في الحج: وقوف في سهل واسع من الظهر إلى المغرب."
      en: "The most important day of the Hajj: standing on a wide plain from noon to sunset."
      ur: "حج کا سب سے اہم دن: ایک وسیع میدان میں ظہر سے مغرب تک قیام۔"
      es: "El día más importante del Hajj: permanecer de pie en una amplia llanura desde el mediodía hasta la puesta del sol."
      fr: "Le jour le plus important du Hajj: rester debout sur une vaste plaine de midi jusqu’au coucher du soleil."
      tr: "Hac ibadetinin en önemli günü: Öğleden gün batımına kadar geniş bir düzlükte ayakta durmak."
      id: "Hari terpenting dalam ibadah haji: Berdiri di dataran luas dari tengah hari hingga matahari terbenam."
    features:
      - place/arafat
  - title:
      ar: منى والعيد
      en: Mina and the Eid
      ur: منیٰ اور عید
      es: "Mina y el Eid"
      fr: "Mina et l'Aïd"
      tr: "Mona ve Eid"
      id: "Mona dan Idul Fitri"
    body:
      ar: أيام الخيام في منى، وعيد الأضحى الذي يحتفل به المسلمون في العالم كله في اليوم نفسه.
      en: The tent days at Mina, and Eid al-Adha, which Muslims across the world celebrate on the same day.
      ur: منیٰ میں خیموں کے دن، اور عید الاضحیٰ جو دنیا بھر کے مسلمان اسی دن مناتے ہیں۔
      es: "Los días de acampada en Mina y el Eid al-Adha, que los musulmanes de todo el mundo celebran el mismo día."
      fr: "Les journées sous les tentes à Mina et l'Aïd al-Adha, que les musulmans du monde entier célèbrent le même jour."
      tr: "Mina'daki çadır günleri ve dünyanın dört bir yanındaki Müslümanların aynı gün kutladığı Kurban Bayramı."
      id: "Hari-hari mendirikan tenda di Mina, dan Idul Adha, yang dirayakan oleh umat Muslim di seluruh dunia pada hari yang sama."
    features:
      - place/mina
      - practice/eid-al-adha
  - title:
      ar: ملك من مالي يحج
      en: A king from Mali goes on Hajj
      ur: مالی کا ایک بادشاہ حج پر
      es: "Un rey de Malí realiza el Hajj."
      fr: "Un roi du Mali part en pèlerinage à La Mecque"
      tr: "Mali'den bir kral Hac ibadetini yerine getiriyor."
      id: "Seorang raja dari Mali sedang melaksanakan ibadah haji."
    body:
      ar: "منسا موسى سافر من تمبكتو إلى مكة سنة 1324 بقافلة كبيرة: الحج قبل سبعة قرون."
      en: "Mansa Musa travelled from Timbuktu to Mecca in 1324 with a great caravan: the Hajj seven centuries ago."
      ur: "منسا موسیٰ سنہ 1324 میں تمبکتو سے مکہ ایک بڑے قافلے کے ساتھ گیا: سات صدیاں پہلے کا حج۔"
      es: "Mansa Musa viajó de Tombuctú a La Meca en 1324 con una gran caravana: la peregrinación a La Meca (Hajj) hace siete siglos."
      fr: "Mansa Musa a voyagé de Tombouctou à La Mecque en 1324 avec une grande caravane: le Hajj, il y a sept siècles."
      tr: "Mansa Musa, 1324 yılında büyük bir kervanla Timbuktu'dan Mekke'ye yolculuk etti: yedi yüzyıl önce gerçekleşen Hac."
      id: "Mansa Musa melakukan perjalanan dari Timbuktu ke Mekah pada tahun 1324 dengan kafilah besar: ibadah haji tujuh abad yang lalu."
    features:
      - person/mansa-musa
  - title:
      ar: رحّالة من المغرب
      en: A traveller from Morocco
      ur: مراکش کا ایک سیاح
      es: "Un viajero de Marruecos"
      fr: "Un voyageur du Maroc"
      tr: "Faslı bir gezgin"
      id: "Seorang wisatawan dari Maroko"
    body:
      ar: ابن بطوطة خرج للحج فطاف العالم ثلاثين سنة ودوّن ما رأى.
      en: Ibn Battuta set out for the Hajj and travelled the world for thirty years, writing down what he saw.
      ur: ابن بطوطہ حج کے لیے نکلا اور تیس سال دنیا گھومتا رہا، جو دیکھا لکھتا گیا۔
      es: "Ibn Battuta emprendió la peregrinación a La Meca (Hajj) y viajó por el mundo durante treinta años, escribiendo sobre lo que veía."
      fr: "Ibn Battuta entreprit le pèlerinage à La Mecque et parcourut le monde pendant trente ans, consignant par écrit ce qu'il voyait."
      tr: "İbn Battuta hac yolculuğuna çıktı ve otuz yıl boyunca dünyayı dolaşarak gördüklerini kaydetti."
      id: "Ibn Battuta melakukan perjalanan ziarah dan berkeliling dunia selama tiga puluh tahun, mencatat apa yang dilihatnya."
    features:
      - person/ibn-battuta-muhammad
  - title:
      ar: تقويم يعرفه العالم
      en: A calendar the world keeps
      ur: ایک کیلنڈر جو دنیا رکھتی ہے
      es: "Un calendario que el mundo mantiene"
      fr: "Un calendrier que le monde garde"
      tr: "Dünya çapında bilinen bir takvim"
      id: "Kalender yang dikenal di seluruh dunia"
    body:
      ar: التقويم الهجري يحدّد أيام الحج والعيد لكل مسلم في أي بلد.
      en: The Hijri calendar fixes the days of the Hajj and the Eid for every Muslim in any country.
      ur: ہجری کیلنڈر ہر ملک کے ہر مسلمان کے لیے حج اور عید کے دن مقرر کرتا ہے۔
      es: "El calendario Hijri fija las fechas del Hajj y del Eid para todos los musulmanes de cualquier país."
      fr: "Le calendrier hégirien fixe les dates du Hajj et de l'Aïd pour chaque musulman, quel que soit son pays."
      tr: "İslam takvimi, her ülkedeki her Müslüman için Hac ve Bayram günlerini belirler."
      id: "Kalender Islam menentukan hari-hari ibadah Haji dan Idul Fitri bagi setiap Muslim di negara mana pun."
    features:
      - concept/hijri-calendar
  - title:
      ar: من كندا إلى مكة
      en: From Canada to Mecca
      ur: کینیڈا سے مکہ
      es: "De Canadá a La Meca"
      fr: "Du Canada à La Mecque"
      tr: "Kanada'dan Mekke'ye"
      id: "Dari Kanada ke Mekah"
    body:
      ar: "خطوة المعلم: كيف يستعدّ مجتمع مسلم في مدينتكم للحج والعيد؟ استضيفوا من يحكي."
      en: "The teacher's step: how does a Muslim community in your town prepare for the Hajj and the Eid? Invite someone to tell it."
      ur: "استاد کا مرحلہ: آپ کے شہر کی مسلم برادری حج اور عید کی تیاری کیسے کرتی ہے؟ کسی کو بلائیں جو بتائے۔"
      es: "El paso del maestro: ¿Cómo se prepara una comunidad musulmana de tu ciudad para el Hajj y el Eid? Invita a alguien a que lo cuente."
      fr: "Étape pour l'enseignant: comment une communauté musulmane de votre ville se prépare-t-elle pour le Hajj et l'Aïd ? Invitez quelqu'un à en parler."
      tr: "Öğretmenin Sorusu: Şehrinizdeki Müslüman topluluk Hac ve Ramazan Bayramı'na nasıl hazırlanıyor? Bir hikaye anlatıcısı davet edin."
      id: "Langkah Guru: Bagaimana komunitas Muslim di kota Anda mempersiapkan diri untuk Haji dan Idul Fitri? Undang seorang pendongeng."
    features:
      - practice/hajj
outcomes:
  - text:
      ar: أرتّب مراحل الحج الرئيسة.
      en: I can put the main stages of the Hajj in order.
      ur: میں حج کے اہم مراحل ترتیب سے لگا سکتا ہوں۔
    steps:
      - 0
      - 2
      - 3
      - 4
  - text:
      ar: أعطي مثالين تاريخيين على حجاج جاؤوا من بلاد بعيدة.
      en: I can give two historical examples of pilgrims who came from far away.
      ur: میں دور کے ملکوں سے آنے والے حاجیوں کی دو تاریخی مثالیں دے سکتا ہوں۔
    steps:
      - 5
      - 6
  - text:
      ar: أشرح كيف يرتبط مجتمع في كندا بالعالم عبر رحلة واحدة.
      en: I can explain how a community in Canada is linked to the world through one journey.
      ur: میں بتا سکتا ہوں کہ کینیڈا کی ایک برادری ایک سفر کے ذریعے دنیا سے کیسے جڑی ہے۔
    steps:
      - 7
      - 8
worksheet:
  - prompt:
      ar: "ارسم خط الرحلة: من بيت الحاج إلى مكة ثم عرفة ثم منى. ماذا يحدث في كل مكان؟"
      en: "Draw the route: from the pilgrim's home to Mecca, then Arafat, then Mina. What happens at each place?"
      ur: "سفر کی لکیر بنائیں: حاجی کے گھر سے مکہ، پھر عرفہ، پھر منیٰ۔ ہر جگہ کیا ہوتا ہے؟"
    steps:
      - 0
      - 2
      - 3
      - 4
  - prompt:
      ar: "منسا موسى وابن بطوطة: من أين جاء كلٌّ منهما، وفي أي قرن؟"
      en: "Mansa Musa and Ibn Battuta: where did each come from, and in which century?"
      ur: "منسا موسیٰ اور ابن بطوطہ: ہر ایک کہاں سے آیا، اور کس صدی میں؟"
    steps:
      - 5
      - 6
  - prompt:
      ar: لماذا يحتفل مسلمون في كندا وإندونيسيا ومصر بالعيد في اليوم نفسه؟
      en: Why do Muslims in Canada, Indonesia and Egypt celebrate the Eid on the same day?
      ur: کینیڈا، انڈونیشیا اور مصر کے مسلمان عید ایک ہی دن کیوں مناتے ہیں؟
    steps:
      - 4
      - 7
  - prompt:
      ar: اكتب سؤالًا تطرحه على حاجٍّ من مجتمعك.
      en: Write one question you would ask a pilgrim from your community.
      ur: ایک سوال لکھیں جو آپ اپنی برادری کے کسی حاجی سے پوچھیں گے۔
    steps:
      - 8
  - prompt:
      ar: ما الذي يجمع بين مجتمعك المحلي ومدينة على بعد آلاف الكيلومترات؟
      en: What links your local community with a city thousands of kilometres away?
      ur: آپ کی مقامی برادری اور ہزاروں کلومیٹر دور کے ایک شہر کے بیچ کیا رشتہ ہے؟
    steps:
      - 8
quiz:
  - q:
      ar: كم مرة يجب الحج على المسلم المستطيع؟
      en: How many times must an able Muslim perform the Hajj?
      ur: ایک قابل مسلمان پر حج کتنی بار فرض ہے؟
    options:
      - ar: كل سنة
        en: Every year
        ur: ہر سال
      - ar: مرة في العمر
        en: Once in a lifetime
        ur: زندگی میں ایک بار
      - ar: كل شهر
        en: Every month
        ur: ہر مہینے
      - ar: خمس مرات
        en: Five times
        ur: پانچ بار
    answer: 1
    teaches: 0
  - q:
      ar: ما الطواف؟
      en: What is tawaf?
      ur: طواف کیا ہے؟
    options:
      - ar: المشي حول الكعبة سبع مرات
        en: Walking around the Kaaba seven times
        ur: کعبہ کے گرد سات بار چلنا
      - ar: الصلاة في منى
        en: Praying at Mina
        ur: منیٰ میں نماز
      - ar: صيام يوم
        en: Fasting a day
        ur: ایک دن کا روزہ
      - ar: رمي الحجارة
        en: Throwing stones
        ur: کنکریاں مارنا
