id: exhibit/pathway-g6-social-studies-hajj-network
class: exhibit
kind: lesson
label:
  ar: "الحج: رحلة تربط مجتمعات العالم"
  en: "The Hajj: one journey that links communities across the world"
  ur: "حج: ایک سفر جو دنیا کی برادریوں کو جوڑتا ہے"
summary:
  ar: "درس للصف السادس عن الحج بوصفه شبكة عالمية: ما يفعله الحجاج في مكة، ومن أين يأتون منذ قرون، وكيف يرتبط مجتمع مسلم في كندا اليوم بالعالم عبر هذه الرحلة."
  en: "A Grade 6 lesson on the Hajj as a global network: what pilgrims do in Mecca, where they have come from for centuries, and how a Muslim community in Canada today is linked to the world through this journey."
  ur: "جماعت ششم کا سبق حج پر ایک عالمی جال کے طور پر: حاجی مکہ میں کیا کرتے ہیں، صدیوں سے وہ کہاں سے آتے ہیں، اور آج کینیڈا کی ایک مسلم برادری اس سفر کے ذریعے دنیا سے کیسے جڑی ہے۔"
audience:
  - teacher
  - student
level: intro
duration_minutes: 60
wings: []
goal:
  ar: أن يشرح التلميذ مراحل الحج وأن يبيّن كيف تربط رحلةٌ واحدة مجتمعاتٍ في بلاد كثيرة، منها مجتمعه في كندا.
  en: Students explain the stages of the Hajj and show how one journey links communities in many countries, including their own in Canada.
  ur: طلبہ حج کے مراحل بیان کریں اور دکھائیں کہ ایک سفر کئی ملکوں کی برادریوں کو، جن میں کینیڈا کی ان کی اپنی برادری بھی ہے، کیسے جوڑتا ہے۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: G6-SS
  course_title:
    ar: الدراسات الاجتماعية، الصف السادس
    en: Social Studies, Grade 6
    ur: سوشل اسٹڈیز، جماعت ششم
  grade: "6"
  strand: A
  strand_title:
    ar: "التراث والهوية: المجتمعات في كندا ماضيًا وحاضرًا"
    en: "Heritage and Identity: Communities in Canada, Past and Present"
    ur: "ورثہ اور شناخت: کینیڈا کی برادریاں، ماضی اور حال"
  expectations:
    - A2
    - A3
  expectation:
    ar: "يعطي الدرس المادة التاريخية والجغرافية لممارسةٍ تُعرّف بها جماعة دينية معاصرة في كندا: الحج. يقدّم المتحف الرحلة ومراحلها وتاريخها، ويضيف المعلم تجربة مجتمع مسلم محلي (مسجد الحي، عائلة، ضيف) فيدرس التلاميذ منظور هذا المجتمع وجوانب حياته كما يطلب المحور."
    en: "The lesson supplies the historical and geographical matter of a practice that defines a contemporary religious community in Canada: the Hajj. The museum provides the journey, its stages and its history; the teacher adds the experience of a local Muslim community (a neighbourhood mosque, a family, a guest), so that students investigate that community's perspective and aspects of its life, as the strand asks."
    ur: یہ سبق کینیڈا کی ایک معاصر مذہبی برادری کی پہچان بننے والے عمل، حج، کا تاریخی اور جغرافیائی مواد دیتا ہے۔ میوزیم سفر، اس کے مراحل اور تاریخ فراہم کرتا ہے؛ استاد مقامی مسلم برادری کا تجربہ (محلے کی مسجد، ایک خاندان، ایک مہمان) جوڑتا ہے، تا کہ طلبہ اس برادری کے نقطۂ نظر اور اس کی زندگی کے پہلوؤں کی تحقیق کریں جیسا شاخ کا تقاضا ہے۔
  document: "The Ontario Curriculum: Social Studies, Grades 1 to 6; History and Geography, Grades 7 and 8, 2023 (dcp.edu.gov.on.ca)"
  verified: 2026-10-23
rooms:
  - title:
      ar: ما الحج؟
      en: What is the Hajj?
      ur: حج کیا ہے؟
    body:
      ar: رحلة إلى مكة مرة في العمر لمن استطاع، في أيام معلومة من السنة.
      en: A journey to Mecca once in a lifetime for those who are able, on set days of the year.
      ur: جو کر سکے اس کے لیے زندگی میں ایک بار مکہ کا سفر، سال کے مقررہ دنوں میں۔
    features:
      - practice/hajj
  - title:
      ar: مكة والكعبة
      en: Mecca and the Kaaba
      ur: مکہ اور کعبہ
    body:
      ar: المدينة التي يتوجّه إليها المسلمون في صلاتهم، والبيت الذي يطوفون حوله.
      en: The city Muslims face in prayer, and the House they walk around.
      ur: وہ شہر جس کی طرف مسلمان نماز میں رخ کرتے ہیں، اور وہ گھر جس کے گرد وہ چکر لگاتے ہیں۔
    features:
      - place/mecca
      - building/kaaba
  - title:
      ar: الطواف
      en: Tawaf, circling the Kaaba
      ur: طواف
    body:
      ar: "سبعة أشواط حول الكعبة: ماذا يفعل الحاج وماذا يقول."
      en: "Seven circuits around the Kaaba: what the pilgrim does and says."
      ur: "کعبہ کے گرد سات چکر: حاجی کیا کرتا اور کیا کہتا ہے۔"
    features:
      - practice/tawaf
  - title:
      ar: يوم عرفة
      en: The day of Arafat
      ur: عرفہ کا دن
    body:
      ar: "أهم يوم في الحج: وقوف في سهل واسع من الظهر إلى المغرب."
      en: "The most important day of the Hajj: standing on a wide plain from noon to sunset."
      ur: "حج کا سب سے اہم دن: ایک وسیع میدان میں ظہر سے مغرب تک قیام۔"
    features:
      - place/arafat
  - title:
      ar: منى والعيد
      en: Mina and the Eid
      ur: منیٰ اور عید
    body:
      ar: أيام الخيام في منى، وعيد الأضحى الذي يحتفل به المسلمون في العالم كله في اليوم نفسه.
      en: The tent days at Mina, and Eid al-Adha, which Muslims across the world celebrate on the same day.
      ur: منیٰ میں خیموں کے دن، اور عید الاضحیٰ جو دنیا بھر کے مسلمان اسی دن مناتے ہیں۔
    features:
      - place/mina
      - practice/eid-al-adha
  - title:
      ar: ملك من مالي يحج
      en: A king from Mali goes on Hajj
      ur: مالی کا ایک بادشاہ حج پر
    body:
      ar: "منسا موسى سافر من تمبكتو إلى مكة سنة 1324 بقافلة كبيرة: الحج قبل سبعة قرون."
      en: "Mansa Musa travelled from Timbuktu to Mecca in 1324 with a great caravan: the Hajj seven centuries ago."
      ur: "منسا موسیٰ سنہ 1324 میں تمبکتو سے مکہ ایک بڑے قافلے کے ساتھ گیا: سات صدیاں پہلے کا حج۔"
    features:
      - person/mansa-musa
  - title:
      ar: رحّالة من المغرب
      en: A traveller from Morocco
      ur: مراکش کا ایک سیاح
    body:
      ar: ابن بطوطة خرج للحج فطاف العالم ثلاثين سنة ودوّن ما رأى.
      en: Ibn Battuta set out for the Hajj and travelled the world for thirty years, writing down what he saw.
      ur: ابن بطوطہ حج کے لیے نکلا اور تیس سال دنیا گھومتا رہا، جو دیکھا لکھتا گیا۔
    features:
      - person/ibn-battuta-muhammad
  - title:
      ar: تقويم يعرفه العالم
      en: A calendar the world keeps
      ur: ایک کیلنڈر جو دنیا رکھتی ہے
    body:
      ar: التقويم الهجري يحدّد أيام الحج والعيد لكل مسلم في أي بلد.
      en: The Hijri calendar fixes the days of the Hajj and the Eid for every Muslim in any country.
      ur: ہجری کیلنڈر ہر ملک کے ہر مسلمان کے لیے حج اور عید کے دن مقرر کرتا ہے۔
    features:
      - concept/hijri-calendar
  - title:
      ar: من كندا إلى مكة
      en: From Canada to Mecca
      ur: کینیڈا سے مکہ
    body:
      ar: "خطوة المعلم: كيف يستعدّ مجتمع مسلم في مدينتكم للحج والعيد؟ استضيفوا من يحكي."
      en: "The teacher's step: how does a Muslim community in your town prepare for the Hajj and the Eid? Invite someone to tell it."
      ur: "استاد کا مرحلہ: آپ کے شہر کی مسلم برادری حج اور عید کی تیاری کیسے کرتی ہے؟ کسی کو بلائیں جو بتائے۔"
    features:
      - practice/hajj
outcomes:
  - text:
      ar: أرتّب مراحل الحج الرئيسة.
      en: I can put the main stages of the Hajj in order.
      ur: میں حج کے اہم مراحل ترتیب سے لگا سکتا ہوں۔
    steps:
      - 0
      - 2
      - 3
      - 4
  - text:
      ar: أعطي مثالين تاريخيين على حجاج جاؤوا من بلاد بعيدة.
      en: I can give two historical examples of pilgrims who came from far away.
      ur: میں دور کے ملکوں سے آنے والے حاجیوں کی دو تاریخی مثالیں دے سکتا ہوں۔
    steps:
      - 5
      - 6
  - text:
      ar: أشرح كيف يرتبط مجتمع في كندا بالعالم عبر رحلة واحدة.
      en: I can explain how a community in Canada is linked to the world through one journey.
      ur: میں بتا سکتا ہوں کہ کینیڈا کی ایک برادری ایک سفر کے ذریعے دنیا سے کیسے جڑی ہے۔
    steps:
      - 7
      - 8
worksheet:
  - prompt:
      ar: "ارسم خط الرحلة: من بيت الحاج إلى مكة ثم عرفة ثم منى. ماذا يحدث في كل مكان؟"
      en: "Draw the route: from the pilgrim's home to Mecca, then Arafat, then Mina. What happens at each place?"
      ur: "سفر کی لکیر بنائیں: حاجی کے گھر سے مکہ، پھر عرفہ، پھر منیٰ۔ ہر جگہ کیا ہوتا ہے؟"
    steps:
      - 0
      - 2
      - 3
      - 4
  - prompt:
      ar: "منسا موسى وابن بطوطة: من أين جاء كلٌّ منهما، وفي أي قرن؟"
      en: "Mansa Musa and Ibn Battuta: where did each come from, and in which century?"
      ur: "منسا موسیٰ اور ابن بطوطہ: ہر ایک کہاں سے آیا، اور کس صدی میں؟"
    steps:
      - 5
      - 6
  - prompt:
      ar: لماذا يحتفل مسلمون في كندا وإندونيسيا ومصر بالعيد في اليوم نفسه؟
      en: Why do Muslims in Canada, Indonesia and Egypt celebrate the Eid on the same day?
      ur: کینیڈا، انڈونیشیا اور مصر کے مسلمان عید ایک ہی دن کیوں مناتے ہیں؟
    steps:
      - 4
      - 7
  - prompt:
      ar: اكتب سؤالًا تطرحه على حاجٍّ من مجتمعك.
      en: Write one question you would ask a pilgrim from your community.
      ur: ایک سوال لکھیں جو آپ اپنی برادری کے کسی حاجی سے پوچھیں گے۔
    steps:
      - 8
  - prompt:
      ar: ما الذي يجمع بين مجتمعك المحلي ومدينة على بعد آلاف الكيلومترات؟
      en: What links your local community with a city thousands of kilometres away?
      ur: آپ کی مقامی برادری اور ہزاروں کلومیٹر دور کے ایک شہر کے بیچ کیا رشتہ ہے؟
    steps:
      - 8
quiz:
  - q:
      ar: كم مرة يجب الحج على المسلم المستطيع؟
      en: How many times must an able Muslim perform the Hajj?
      ur: ایک قابل مسلمان پر حج کتنی بار فرض ہے؟
    options:
      - ar: كل سنة
        en: Every year
        ur: ہر سال
      - ar: مرة في العمر
        en: Once in a lifetime
        ur: زندگی میں ایک بار
      - ar: كل شهر
        en: Every month
        ur: ہر مہینے
      - ar: خمس مرات
        en: Five times
        ur: پانچ بار
    answer: 1
    teaches: 0
  - q:
      ar: ما الطواف؟
      en: What is tawaf?
      ur: طواف کیا ہے؟
    options:
      - ar: المشي حول الكعبة سبع مرات
        en: Walking around the Kaaba seven times
        ur: کعبہ کے گرد سات بار چلنا
      - ar: الصلاة في منى
        en: Praying at Mina
        ur: منیٰ میں نماز
      - ar: صيام يوم
        en: Fasting a day
        ur: ایک دن کا روزہ
      - ar: رمي الحجارة
        en: Throwing stones
        ur: کنکریاں مارنا
    answer: 0
    teaches: 2
  - q:
      ar: أين يقف الحجاج في أهم يوم من الحج؟
      en: Where do pilgrims stand on the most important day of the Hajj?
      ur: حج کے سب سے اہم دن حاجی کہاں ٹھہرتے ہیں؟
    options:
      - ar: في المدينة
        en: In Medina
        ur: مدینہ میں
      - ar: في جدة
        en: In Jeddah
        ur: جدہ میں
      - ar: في عرفة
        en: At Arafat
        ur: عرفہ میں
      - ar: في القدس
        en: In Jerusalem
        ur: یروشلم میں
    answer: 2
    teaches: 3
  - q:
      ar: من أين جاء منسا موسى إلى الحج؟
      en: Where did Mansa Musa come from for the Hajj?
      ur: منسا موسیٰ حج کے لیے کہاں سے آیا؟
    options:
      - ar: من الهند
        en: From India
        ur: ہندوستان سے
      - ar: من الأندلس
        en: From al-Andalus
        ur: اندلس سے
      - ar: من الصين
        en: From China
        ur: چین سے
      - ar: من مالي في غرب أفريقيا
        en: From Mali in West Africa
        ur: مغربی افریقہ کے مالی سے
    answer: 3
    teaches: 5
  - q:
      ar: لماذا يحتفل المسلمون في بلاد كثيرة بعيد الأضحى في اليوم نفسه؟
      en: Why do Muslims in many countries celebrate Eid al-Adha on the same day?
      ur: بہت سے ملکوں کے مسلمان عید الاضحیٰ ایک ہی دن کیوں مناتے ہیں؟
    options:
      - ar: لأنهم يتبعون تقويمًا واحدًا
        en: Because they follow one calendar
        ur: کیونکہ وہ ایک ہی کیلنڈر پر چلتے ہیں
      - ar: لأن الطقس واحد
        en: Because the weather is the same
        ur: کیونکہ موسم ایک ہے
      - ar: لأن الحكومات تقرّر
        en: Because governments decide
        ur: کیونکہ حکومتیں فیصلہ کرتی ہیں
      - ar: لأنه يوم أحد دائمًا
        en: Because it is always a Sunday
        ur: کیونکہ وہ ہمیشہ اتوار ہوتا ہے
    answer: 0
    teaches: 7
