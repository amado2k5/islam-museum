id: exhibit/pathway-g11-chw3m-rise-of-islam
class: exhibit
kind: lesson
label:
  ar: "نشأة الإسلام: من مكة إلى دمشق (610–750)"
  en: "The rise of Islam: from Mecca to Damascus (610–750)"
  ur: "اسلام کا عروج: مکہ سے دمشق تک (610–750)"
summary:
  ar: "مسار لمقرر CHW3M يتابع نشأة مجتمع جديد في الجزيرة العربية وتحوّله في قرن واحد إلى دولة تمتد من الأندلس إلى آسيا الوسطى: السياق، والوحي، والهجرة، ووثيقة المدينة، والمعارك الأولى، والخلافة الراشدة، ودمشق الأموية."
  en: "A CHW3M pathway following the rise of a new community in Arabia and its transformation within a century into a state stretching from al-Andalus to Central Asia: the setting, the revelation, the Hijra, the Constitution of Medina, the first battles, the Rashidun caliphate and Umayyad Damascus."
  ur: "CHW3M کا ایک راستہ جو عرب میں ایک نئی برادری کے عروج اور ایک صدی میں اندلس سے وسطی ایشیا تک پھیلی ریاست میں اس کی تبدیلی کا پیچھا کرتا ہے: پس منظر، وحی، ہجرت، میثاقِ مدینہ، پہلی جنگیں، خلافتِ راشدہ اور اموی دمشق۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب البنى الاجتماعية والسياسية التي قام عليها المجتمع الإسلامي الأول، والعوامل التي أسهمت في استقراره وتوسّعه حتى سنة 750.
  en: Students analyse the social and political structures on which the first Muslim community rested and the factors that contributed to its stability and expansion to 750.
  ur: طلبہ ان معاشرتی اور سیاسی ڈھانچوں کا تجزیہ کریں جن پر پہلی مسلم برادری قائم ہوئی، اور ان عوامل کا جو 750 تک اس کے استحکام اور توسیع میں شریک رہے۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHW3M
  course_title:
    ar: تاريخ العالم حتى نهاية القرن الخامس عشر، الصف 11، إعداد جامعي/كلّي
    en: World History to the End of the Fifteenth Century, Grade 11, University/College Preparation
    ur: پندرہویں صدی کے اختتام تک دنیا کی تاریخ، جماعت 11، یونیورسٹی/کالج تیاری
  grade: "11"
  strand: C
  strand_title:
    ar: مجتمعات وحضارات مزدهرة
    en: Flourishing Societies and Civilizations
    ur: پھلتے پھولتے معاشرے اور تہذیبیں
  expectations:
    - C1
    - C2
  expectation:
    ar: "يقدّم الدرس المجتمع الإسلامي الأول (610–750) بوصفه حضارة مزدهرة من إقليم وزمن محدّدين: بناه الاجتماعية والاقتصادية والسياسية (القبيلة، وثيقة المدينة، الخلافة)، والعوامل التي أدّت إلى استقراره وتوسّعه (الهجرة، التحالفات، الفتوح، الإدارة الأموية). يصلح واحدًا من المجتمعات الثلاثة التي يطلبها المحور."
    en: "The lesson presents the first Muslim society (610–750) as a flourishing civilisation from a specific region and period: its social, economic and political structures (the tribe, the Constitution of Medina, the caliphate) and the factors that led to its stability and expansion (the Hijra, alliances, the conquests, Umayyad administration). It serves as one of the three societies the strand requires."
    ur: "یہ سبق پہلے مسلم معاشرے (610–750) کو ایک مخصوص خطے اور دور کی پھلتی پھولتی تہذیب کے طور پر پیش کرتا ہے: اس کے معاشرتی، معاشی اور سیاسی ڈھانچے (قبیلہ، میثاقِ مدینہ، خلافت) اور وہ عوامل جو اس کے استحکام اور توسیع کا سبب بنے (ہجرت، اتحاد، فتوحات، اموی انتظام)۔ یہ شاخ کے مطلوبہ تین معاشروں میں سے ایک کا کام دیتا ہے۔"
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: الجزيرة قبل الإسلام
      en: Arabia before Islam
      ur: اسلام سے پہلے عرب
    body:
      ar: "القبائل، والتجارة، والقوى المحيطة: الروم وفارس والحبشة."
      en: "Tribes, trade and the surrounding powers: Byzantium, Persia and Abyssinia."
      ur: "قبیلے، تجارت اور گرد و پیش کی طاقتیں: روم، فارس اور حبشہ۔"
    features:
      - period/pre-islamic-arabia
      - place/mecca
  - title:
      ar: النبي محمد والوحي الأول
      en: The Prophet Muhammad and the first revelation
      ur: نبی محمد اور پہلی وحی
    body:
      ar: رجل من قريش في الأربعين، وغار قرب مكة، وبداية رسالة.
      en: A man of Quraysh at forty, a cave near Mecca, and the start of a message.
      ur: قریش کا ایک چالیس برس کا شخص، مکہ کے پاس ایک غار، اور ایک پیغام کا آغاز۔
    features:
      - person/muhammad
      - event/first-revelation
  - title:
      ar: الهجرة
      en: The Hijra
      ur: ہجرت
    body:
      ar: "سنة 622: انتقال الجماعة إلى يثرب، وبداية التقويم."
      en: "622: the community moves to Yathrib, and a calendar begins."
      ur: "622: برادری یثرب منتقل ہوتی ہے، اور ایک کیلنڈر شروع ہوتا ہے۔"
    features:
      - event/hijra
  - title:
      ar: وثيقة المدينة
      en: The Constitution of Medina
      ur: میثاقِ مدینہ
    body:
      ar: "عقد بين المهاجرين والأنصار واليهود: ما تقوله الوثيقة عن المجتمع الجديد."
      en: "A pact between the emigrants, the Ansar and the Jews: what the document says about the new society."
      ur: "مہاجرین، انصار اور یہود کے بیچ ایک عہد: دستاویز نئے معاشرے کے بارے میں کیا کہتی ہے۔"
    features:
      - event/constitution-of-medina
  - title:
      ar: بدر وما بعدها
      en: Badr and after
      ur: بدر اور اس کے بعد
    body:
      ar: "المعارك الأولى مع قريش: أسبابها ونتائجها، كما تروى في المصادر."
      en: "The first battles with Quraysh: their causes and consequences as the sources tell them."
      ur: "قریش سے پہلی جنگیں: ان کے اسباب اور نتائج جیسے ماخذ بیان کرتے ہیں۔"
    features:
      - event/battle-of-badr
  - title:
      ar: الحديبية وفتح مكة
      en: Hudaybiyya and the conquest of Mecca
      ur: حدیبیہ اور فتح مکہ
    body:
      ar: "صلح ثم دخول مكة بلا قتال يُذكر: التفاوض بوصفه أداة سياسية."
      en: "A treaty, then an entry into Mecca almost without fighting: negotiation as a political tool."
      ur: "ایک صلح، پھر تقریباً بغیر لڑائی مکہ میں داخلہ: مذاکرات بطور سیاسی آلہ۔"
    features:
      - event/treaty-of-hudaybiyya
      - event/conquest-of-mecca
  - title:
      ar: الخلافة الراشدة
      en: The Rashidun caliphate
      ur: خلافتِ راشدہ
    body:
      ar: كيف اختير الخلفاء الأربعة، وكيف أُديرت أرض امتدت من مصر إلى فارس.
      en: How the four caliphs were chosen, and how a land from Egypt to Persia was governed.
      ur: چار خلیفے کیسے چنے گئے، اور مصر سے فارس تک کی زمین کا انتظام کیسے ہوا۔
    features:
      - polity/rashidun-caliphate
  - title:
      ar: الأمويون ودمشق
      en: The Umayyads and Damascus
      ur: اموی اور دمشق
    body:
      ar: "دولة وراثية بعاصمة قديمة: الإدارة والعملة واللغة والمساجد الكبرى."
      en: "A hereditary state in an ancient capital: administration, coinage, language and the great mosques."
      ur: "ایک قدیم دارالحکومت میں موروثی ریاست: انتظام، سکہ، زبان اور بڑی مسجدیں۔"
    features:
      - polity/umayyad-caliphate
      - place/damascus
outcomes:
