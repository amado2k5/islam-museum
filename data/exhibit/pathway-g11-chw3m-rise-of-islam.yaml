      en: I can describe the social and political structures of the first Muslim community.
      ur: میں پہلی مسلم برادری کے معاشرتی اور سیاسی ڈھانچے بیان کر سکتا ہوں۔
    steps:
      - 0
      - 3
      - 6
  - text:
      ar: أشرح ثلاثة عوامل أسهمت في استقرار الدولة وتوسّعها حتى 750.
      en: I can explain three factors behind the state's stability and expansion to 750.
      ur: میں 750 تک ریاست کے استحکام اور توسیع کے تین عوامل بیان کر سکتا ہوں۔
    steps:
      - 2
      - 5
      - 7
  - text:
      ar: أميّز بين ما ترويه المصادر الإسلامية وما يناقشه المؤرخون.
      en: I can distinguish what the Islamic sources relate from what historians debate.
      ur: میں اسلامی ماخذ کی روایت اور مؤرخین کی بحث میں فرق کر سکتا ہوں۔
    steps:
      - 1
      - 4
worksheet:
  - prompt:
      ar: ما القوى الثلاث التي أحاطت بالجزيرة العربية سنة 600، وكيف أثّرت في تجارة مكة؟
      en: Which three powers surrounded Arabia in 600, and how did they affect Mecca's trade?
      ur: سنہ 600 میں عرب کے گرد کون سی تین طاقتیں تھیں، اور انہوں نے مکہ کی تجارت پر کیا اثر ڈالا؟
    steps:
      - 0
  - prompt:
      ar: "اقرأ وثيقة المدينة في المتحف: اذكر بندين وما يقولان عن العلاقة بين الجماعات."
      en: "Read the Constitution of Medina in the museum: name two clauses and what they say about relations between groups."
      ur: "میوزیم میں میثاقِ مدینہ پڑھیں: دو شقیں اور وہ گروہوں کے باہمی تعلق کے بارے میں کیا کہتی ہیں، لکھیں۔"
    steps:
      - 3
  - prompt:
      ar: لماذا يعدّ المؤرخون الحديبية نقطة تحوّل أكثر من بدر؟
      en: Why do historians treat Hudaybiyya as a greater turning point than Badr?
      ur: مؤرخین حدیبیہ کو بدر سے بڑا موڑ کیوں مانتے ہیں؟
    steps:
      - 5
  - prompt:
      ar: قارن طريقة اختيار الخليفة في العهد الراشد بالوراثة في العهد الأموي.
      en: Compare how the caliph was chosen in the Rashidun period with Umayyad hereditary succession.
      ur: خلافتِ راشدہ میں خلیفہ کے انتخاب کا اموی موروثی جانشینی سے موازنہ کریں۔
    steps:
      - 6
      - 7
  - prompt:
      ar: أي عامل تراه الأهم في توسّع الدولة حتى 750؟ ادعم رأيك بخطوة من المسار.
      en: Which factor do you judge most important in the state's expansion to 750? Support it with a step from the pathway.
      ur: 750 تک ریاست کی توسیع میں آپ کس عامل کو سب سے اہم سمجھتے ہیں؟ راستے کے ایک مرحلے سے دلیل دیں۔
    steps:
      - 2
      - 5
      - 7
quiz:
  - q:
      ar: أي قوتين كبيرتين أحاطتا بالجزيرة العربية قبل الإسلام؟
      en: Which two great powers surrounded Arabia before Islam?
      ur: اسلام سے پہلے عرب کو کون سی دو بڑی طاقتیں گھیرے ہوئے تھیں؟
    options:
      - ar: روما ومصر الفرعونية
        en: Rome and Pharaonic Egypt
        ur: روم اور فرعونی مصر
      - ar: الروم (بيزنطة) وفارس
        en: Byzantium and Persia
        ur: روم (بازنطیہ) اور فارس
      - ar: الصين والهند
        en: China and India
        ur: چین اور ہندوستان
      - ar: الفرنجة والقوط
        en: The Franks and the Goths
        ur: فرنگی اور گوتھ
    answer: 1
    teaches: 0
  - q:
      ar: لماذا يُعدّ عام 622 بداية التقويم الإسلامي؟
      en: Why does 622 begin the Islamic calendar?
      ur: 622 سے اسلامی کیلنڈر کیوں شروع ہوتا ہے؟
    options:
      - ar: لأنه عام الوحي الأول
        en: It was the year of the first revelation
        ur: یہ پہلی وحی کا سال تھا
      - ar: لأنه عام فتح مكة
        en: It was the year of the conquest of Mecca
        ur: یہ فتح مکہ کا سال تھا
      - ar: لأنه عام الهجرة إلى المدينة
        en: It was the year of the Hijra to Medina
        ur: یہ مدینہ کی ہجرت کا سال تھا
      - ar: لأنه عام ميلاد النبي
        en: It was the year of the Prophet's birth
        ur: یہ نبی کی پیدائش کا سال تھا
    answer: 2
    teaches: 2
  - q:
      ar: ماذا نظّمت وثيقة المدينة؟
      en: What did the Constitution of Medina regulate?
      ur: میثاقِ مدینہ نے کیا طے کیا؟
    options:
      - ar: أوقات الصلاة
        en: The times of prayer
        ur: نماز کے اوقات
      - ar: التجارة مع فارس
        en: Trade with Persia
        ur: فارس سے تجارت
      - ar: حدود الدولة الأموية
        en: The Umayyad frontiers
        ur: اموی سرحدیں
      - ar: العلاقة بين جماعات المدينة وواجباتها
        en: Relations and duties between the groups of Medina
        ur: مدینہ کے گروہوں کے باہمی تعلقات اور ذمہ داریاں
    answer: 3
    teaches: 3
  - q:
      ar: كيف دخل النبي مكة سنة 630؟
      en: How did the Prophet enter Mecca in 630?
      ur: نبی 630 میں مکہ میں کیسے داخل ہوئے؟
    options:
      - ar: بعد صلح ثم بقتال يسير
        en: After a treaty, then almost without fighting
        ur: صلح کے بعد، تقریباً بغیر لڑائی
      - ar: بحصار دام سنة
        en: After a year-long siege
        ur: سال بھر کے محاصرے کے بعد
      - ar: بحرًا من جدة
        en: By sea from Jeddah
        ur: جدہ سے سمندر کے راستے
      - ar: لم يدخلها قط
        en: He never entered it
        ur: وہ کبھی داخل نہ ہوئے
    answer: 0
    teaches: 5
  - q:
      ar: ما الذي يميّز الخلافة الأموية عن الراشدة في انتقال الحكم؟
      en: How did the Umayyads differ from the Rashidun in the transfer of power?
      ur: اقتدار کی منتقلی میں اموی راشدین سے کیسے مختلف تھے؟
    options:
      - ar: كان الخليفة يُختار بالقرعة
        en: The caliph was chosen by lot
        ur: خلیفہ قرعے سے چنا جاتا تھا
      - ar: صار الحكم وراثيًا في أسرة واحدة
        en: Rule became hereditary within one family
        ur: حکومت ایک خاندان میں موروثی ہو گئی
      - ar: انتخب الناس الخليفة كل سنة
        en: The people elected the caliph yearly
        ur: لوگ ہر سال خلیفہ چنتے تھے
      - ar: حكمت المدينة من دمشق
        en: Medina ruled from Damascus
        ur: مدینہ دمشق سے حکومت کرتا تھا
    answer: 1
    teaches: 7
