id: exhibit/pathway-g12-chy4u-ottomans-gunpowder-empires
class: exhibit
kind: lesson
label:
  ar: العثمانيون وإمبراطوريات البارود (1450–1650)
  en: The Ottomans and the gunpowder empires (1450–1650)
  ur: عثمانی اور بارودی سلطنتیں (1450–1650)
summary:
  ar: "مسار لمقرر CHY4U عن ثلاث إمبراطوريات إسلامية حكمت من البلقان إلى البنغال بين 1450 و1650: فتح القسطنطينية، ومحمد الثاني وسليمان، وإسطنبول ومساجدها، والصفويون والمغول الهنود، وما جمع بين الثلاث من بارود وإدارة وفن."
  en: "A CHY4U pathway on three Muslim empires that ruled from the Balkans to Bengal between 1450 and 1650: the conquest of Constantinople, Mehmed II and Suleiman, Istanbul and its mosques, the Safavids and the Mughals, and what gunpowder, administration and art the three shared."
  ur: "CHY4U کا ایک راستہ تین مسلم سلطنتوں پر جنہوں نے 1450 اور 1650 کے بیچ بلقان سے بنگال تک حکومت کی: قسطنطنیہ کی فتح، محمد ثانی اور سلیمان، استنبول اور اس کی مسجدیں، صفوی اور مغل، اور بارود، انتظام اور فن میں تینوں کی مشترک باتیں۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب البنى السياسية والاقتصادية لإمبراطوريات البارود، وعلاقاتها بجيرانها، وإسهام حكّام وفنانين بأعيانهم في هويتها بين 1450 و1650.
  en: Students analyse the political and economic structures of the gunpowder empires, their relations with their neighbours, and the contribution of named rulers and artists to their identity between 1450 and 1650.
  ur: طلبہ بارودی سلطنتوں کے سیاسی اور معاشی ڈھانچوں، ہمسایوں سے ان کے تعلقات، اور 1450 اور 1650 کے بیچ نامزد حاکموں اور فنکاروں کے ان کی شناخت میں حصے کا تجزیہ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHY4U
  course_title:
    ar: تاريخ العالم منذ القرن الخامس عشر، الصف 12، إعداد جامعي
    en: World History since the Fifteenth Century, Grade 12, University Preparation
    ur: پندرہویں صدی سے دنیا کی تاریخ، جماعت 12، یونیورسٹی تیاری
  grade: "12"
  strand: B
  strand_title:
    ar: العالم 1450–1650
    en: The World, 1450–1650
    ur: دنیا، 1450–1650
  expectations:
    - B1
    - B2
    - B3
  expectation:
    ar: "يغطي الدرس الفترة 1450–1650 في إقليم غير أوروبي بثلاث دول: البنى السياسية والاقتصادية (الديوان، الجند، التجارة)، والعلاقات بين الجماعات والدول المتجاورة (العثمانيون والصفويون، العثمانيون وأوروبا)، وإسهام أفراد محدّدين (محمد الثاني، سليمان، معماري البلاط) في الهوية والتراث عبر العمارة والقانون."
    en: "The lesson covers 1450–1650 in a non-European region through three states: political and economic structures (the divan, the army, trade), relations between neighbouring groups and states (Ottomans and Safavids, Ottomans and Europe), and the contribution of named individuals (Mehmed II, Suleiman, the court architect) to identity and heritage through architecture and law."
    ur: "یہ سبق 1450–1650 کے دور کو ایک غیر یورپی خطے میں تین ریاستوں کے ذریعے پڑھاتا ہے: سیاسی اور معاشی ڈھانچے (دیوان، فوج، تجارت)، ہمسایہ گروہوں اور ریاستوں کے تعلقات (عثمانی اور صفوی، عثمانی اور یورپ)، اور نامزد افراد (محمد ثانی، سلیمان، درباری معمار) کا فنِ تعمیر اور قانون کے ذریعے شناخت اور ورثے میں حصہ۔"
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: الدولة العثمانية
      en: The Ottoman state
      ur: عثمانی ریاست
    body:
      ar: "من إمارة في الأناضول إلى إمبراطورية ثلاث قارات: البنية والجند والديوان."
      en: "From an Anatolian principality to an empire on three continents: structure, army and divan."
      ur: "اناطولیہ کی ایک امارت سے تین براعظموں کی سلطنت تک: ڈھانچہ، فوج اور دیوان۔"
    features:
      - polity/ottoman-empire
  - title:
      ar: محمد الثاني وفتح القسطنطينية
      en: Mehmed II and the conquest of Constantinople
      ur: محمد ثانی اور قسطنطنیہ کی فتح
    body:
      ar: "سنة 1453: المدافع الكبيرة، والمدينة التي صارت إسطنبول."
      en: "1453: the great cannon, and the city that became Istanbul."
      ur: "1453: بڑی توپیں، اور وہ شہر جو استنبول بنا۔"
    features:
      - person/mehmed-ii
      - event/conquest-constantinople-857
  - title:
      ar: إسطنبول وآيا صوفيا
      en: Istanbul and Hagia Sophia
      ur: استنبول اور آیا صوفیہ
    body:
      ar: "عاصمة قديمة تُعاد صياغتها: من كنيسة إلى مسجد، ومن مدينة رومية إلى مدينة عثمانية."
      en: "An old capital refashioned: from church to mosque, from Roman city to Ottoman city."
      ur: "ایک پرانا دارالحکومت نئے روپ میں: کلیسا سے مسجد، رومی شہر سے عثمانی شہر۔"
    features:
      - place/istanbul
      - building/hagia-sophia
  - title:
      ar: سليمان القانوني
      en: Suleiman the Lawgiver
      ur: سلیمان قانونی
    body:
      ar: "أطول سلاطين القرن حكمًا: القانون والجيش والحدود مع أوروبا وفارس."
      en: "The longest-reigning sultan of the century: law, army, and frontiers with Europe and Persia."
      ur: "صدی کا سب سے لمبی حکومت والا سلطان: قانون، فوج، اور یورپ و فارس سے سرحدیں۔"
    features:
      - person/sulayman-al-qanuni
  - title:
      ar: جامع السليمانية
      en: The Suleymaniye Mosque
      ur: سلیمانیہ مسجد
    body:
      ar: "معمار البلاط سنان وقبة تطلّ على المدينة: العمارة بوصفها سلطة."
      en: "The court architect Sinan and a dome over the city: architecture as power."
      ur: "درباری معمار سنان اور شہر پر چھایا ایک گنبد: فنِ تعمیر بطور اقتدار۔"
    features:
      - building/sulaymaniyya-mosque
  - title:
      ar: الصفويون في إيران
      en: The Safavids in Iran
      ur: ایران میں صفوی
    body:
      ar: "دولة منافسة ذات مذهب مختلف: أصفهان، والحدود، والحرب والتجارة مع العثمانيين."
      en: "A rival state of a different confession: Isfahan, the frontier, and war and trade with the Ottomans."
      ur: "الگ مسلک کی ایک حریف ریاست: اصفہان، سرحد، اور عثمانیوں سے جنگ اور تجارت۔"
    features:
      - polity/safavid-iran
  - title:
      ar: المغول في الهند
      en: The Mughals in India
      ur: ہندوستان میں مغل
    body:
      ar: "بابر وأكبر: إمبراطورية إسلامية تحكم أغلبية غير مسلمة."
      en: "Babur and Akbar: a Muslim empire ruling a non-Muslim majority."
      ur: "بابر اور اکبر: ایک مسلم سلطنت غیر مسلم اکثریت پر حکومت کرتی ہے۔"
    features:
      - polity/mughal-empire
  - title:
      ar: عصر إمبراطوريات البارود
      en: The age of the gunpowder empires
      ur: بارودی سلطنتوں کا دور
    body:
      ar: "ما جمع الثلاث: المدفع، والديوان، والمنمنمات، وما فرّق بينها."
      en: What the three shared, cannon, divan and miniature painting, and what divided them.
      ur: تینوں میں کیا مشترک تھا، توپ، دیوان اور منی ایچر، اور کیا الگ۔
    features:
      - period/gunpowder-empires
outcomes:
  - text:
      ar: أصف البنى السياسية والاقتصادية للدولة العثمانية بين 1450 و1650.
      en: I can describe the political and economic structures of the Ottoman state between 1450 and 1650.
      ur: میں 1450 اور 1650 کے بیچ عثمانی ریاست کے سیاسی اور معاشی ڈھانچے بیان کر سکتا ہوں۔
    steps:
      - 0
      - 3
  - text:
      ar: أحلّل علاقة العثمانيين بجيرانهم في أوروبا وإيران.
      en: I can analyse Ottoman relations with their neighbours in Europe and Iran.
      ur: میں یورپ اور ایران میں عثمانیوں کے ہمسایوں سے تعلقات کا تجزیہ کر سکتا ہوں۔
    steps:
      - 1
      - 5
  - text:
      ar: أبيّن إسهام حاكم ومعمار في هوية الإمبراطورية وتراثها.
      en: I can show the contribution of a ruler and an architect to the empire's identity and heritage.
      ur: میں ایک حاکم اور ایک معمار کے سلطنت کی شناخت اور ورثے میں حصے کو دکھا سکتا ہوں۔
    steps:
      - 2
      - 4
      - 6
      - 7
worksheet:
  - prompt:
      ar: ما الذي غيّرته المدافع في حروب القرن الخامس عشر؟ استعمل مثال 1453.
      en: What did cannon change in fifteenth-century warfare? Use the example of 1453.
      ur: پندرہویں صدی کی جنگوں میں توپوں نے کیا بدلا؟ 1453 کی مثال استعمال کریں۔
    steps:
      - 1
  - prompt:
      ar: كيف أعاد العثمانيون تشكيل إسطنبول بعد الفتح؟ اذكر مبنيين.
      en: How did the Ottomans refashion Istanbul after the conquest? Name two buildings.
      ur: فتح کے بعد عثمانیوں نے استنبول کو نئے روپ میں کیسے ڈھالا؟ دو عمارتوں کے نام لیں۔
    steps:
      - 2
      - 4
  - prompt:
      ar: ما الذي يعنيه لقب «القانوني»؟ وما علاقة القانون بالإمبراطورية الواسعة؟
      en: What does the title 'Lawgiver' mean, and how does law relate to a vast empire?
      ur: لقب «قانونی» کا کیا مطلب ہے، اور قانون کا وسیع سلطنت سے کیا تعلق ہے؟
    steps:
      - 3
  - prompt:
      ar: قارن العلاقة العثمانية الصفوية بالعلاقة العثمانية مع دولة أوروبية واحدة.
      en: Compare Ottoman–Safavid relations with Ottoman relations with one European state.
      ur: عثمانی–صفوی تعلقات کا ایک یورپی ریاست سے عثمانی تعلقات کے ساتھ موازنہ کریں۔
    steps:
      - 5
  - prompt:
      ar: لماذا يجمع المؤرخون الدول الثلاث تحت اسم «إمبراطوريات البارود»؟ هل تقنعك التسمية؟
      en: Why do historians group the three states as 'gunpowder empires'? Does the label convince you?
      ur: مؤرخین تینوں ریاستوں کو «بارودی سلطنتیں» کیوں کہتے ہیں؟ کیا یہ نام آپ کو قائل کرتا ہے؟
    steps:
      - 7
quiz:
  - q:
      ar: في أي سنة فتح محمد الثاني القسطنطينية؟
      en: In which year did Mehmed II take Constantinople?
      ur: محمد ثانی نے قسطنطنیہ کب فتح کیا؟
    options:
      - ar: "1258"
        en: "1258"
        ur: "1258"
      - ar: "1453"
        en: "1453"
        ur: "1453"
      - ar: "1492"
        en: "1492"
        ur: "1492"
      - ar: "1526"
        en: "1526"
        ur: "1526"
    answer: 1
    teaches: 1
  - q:
      ar: ماذا صارت آيا صوفيا بعد الفتح؟
      en: What did Hagia Sophia become after the conquest?
      ur: فتح کے بعد آیا صوفیہ کیا بنی؟
    options:
      - ar: قصرًا
        en: A palace
        ur: قصر
      - ar: مكتبة
        en: A library
        ur: لائبریری
      - ar: مسجدًا
        en: A mosque
        ur: مسجد
      - ar: سوقًا
        en: A market
        ur: بازار
    answer: 2
    teaches: 2
  - q:
      ar: لماذا لُقّب سليمان بـ«القانوني»؟
      en: Why was Suleiman called 'the Lawgiver'?
      ur: سلیمان کو «قانونی» کیوں کہا گیا؟
    options:
      - ar: لتنظيمه القوانين والإدارة
        en: For ordering the laws and administration
        ur: قوانین اور انتظام کی ترتیب کے لیے
      - ar: لأنه كان قاضيًا
        en: Because he was a judge
        ur: کیونکہ وہ قاضی تھا
      - ar: لأنه كتب دستورًا حديثًا
        en: Because he wrote a modern constitution
        ur: کیونکہ اس نے جدید آئین لکھا
      - ar: لأنه ألغى القوانين
        en: Because he abolished the laws
        ur: کیونکہ اس نے قوانین ختم کیے
    answer: 0
    teaches: 3
  - q:
      ar: ما الذي ميّز الصفويين عن العثمانيين؟
      en: What distinguished the Safavids from the Ottomans?
      ur: صفوی عثمانیوں سے کیسے مختلف تھے؟
    options:
      - ar: لم يستعملوا البارود
        en: They used no gunpowder
        ur: انہوں نے بارود استعمال نہ کیا
      - ar: حكموا مصر
        en: They ruled Egypt
        ur: انہوں نے مصر پر حکومت کی
      - ar: كانوا نصارى
        en: They were Christians
        ur: وہ مسیحی تھے
      - ar: مذهب مختلف وعاصمة في إيران
        en: A different confession and a capital in Iran
        ur: الگ مسلک اور ایران میں دارالحکومت
    answer: 3
    teaches: 5
  - q:
      ar: لماذا يجمع المؤرخون العثمانيين والصفويين والمغول تحت اسم واحد؟
      en: Why do historians group the Ottomans, Safavids and Mughals under one name?
      ur: مؤرخین عثمانیوں، صفویوں اور مغلوں کو ایک نام کیوں دیتے ہیں؟
    options:
      - ar: لأنهم تكلّموا لغة واحدة
        en: They spoke one language
        ur: وہ ایک زبان بولتے تھے
      - ar: لأنهم استعملوا المدافع وإدارة مركزية في زمن واحد
        en: They used cannon and centralised administration in the same age
        ur: انہوں نے ایک ہی دور میں توپیں اور مرکزی انتظام استعمال کیا
      - ar: لأنهم حكموا من مدينة واحدة
        en: They ruled from one city
        ur: وہ ایک شہر سے حکومت کرتے تھے
      - ar: لأنهم أسرة واحدة
        en: They were one family
        ur: وہ ایک خاندان تھے
    answer: 1
    teaches: 7
