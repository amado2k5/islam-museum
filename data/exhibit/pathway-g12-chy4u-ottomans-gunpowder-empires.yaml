id: exhibit/pathway-g12-chy4u-ottomans-gunpowder-empires
class: exhibit
kind: lesson
label:
  ar: العثمانيون وإمبراطوريات البارود (1450–1650)
  en: The Ottomans and the gunpowder empires (1450–1650)
  ur: عثمانی اور بارودی سلطنتیں (1450–1650)
  es: "Los otomanos y los imperios de la pólvora (1450-1650)"
  fr: "Les Ottomans et les empires de la poudre à canon (1450-1650)"
  tr: "Osmanlılar ve Barut İmparatorlukları (1450–1650)"
  id: "Kekaisaran Ottoman dan Kekaisaran Mesiu (1450–1650)"
summary:
  ar: "مسار لمقرر CHY4U عن ثلاث إمبراطوريات إسلامية حكمت من البلقان إلى البنغال بين 1450 و1650: فتح القسطنطينية، ومحمد الثاني وسليمان، وإسطنبول ومساجدها، والصفويون والمغول الهنود، وما جمع بين الثلاث من بارود وإدارة وفن."
  en: "A CHY4U pathway on three Muslim empires that ruled from the Balkans to Bengal between 1450 and 1650: the conquest of Constantinople, Mehmed II and Suleiman, Istanbul and its mosques, the Safavids and the Mughals, and what gunpowder, administration and art the three shared."
  ur: "CHY4U کا ایک راستہ تین مسلم سلطنتوں پر جنہوں نے 1450 اور 1650 کے بیچ بلقان سے بنگال تک حکومت کی: قسطنطنیہ کی فتح، محمد ثانی اور سلیمان، استنبول اور اس کی مسجدیں، صفوی اور مغل، اور بارود، انتظام اور فن میں تینوں کی مشترک باتیں۔"
  es: "Un recorrido de CHY4U sobre tres imperios musulmanes que gobernaron desde los Balcanes hasta Bengala entre 1450 y 1650: la conquista de Constantinopla, Mehmed II y Solimán, Estambul y sus mezquitas, los safávidas y los mogoles, y qué pólvora, administración y arte compartieron los tres."
  fr: "Un parcours CHY4U sur trois empires musulmans qui ont régné des Balkans au Bengale entre 1450 et 1650: la conquête de Constantinople, Mehmed II et Soliman, Istanbul et ses mosquées, les Safavides et les Moghols, et ce que la poudre à canon, l’administration et l’art ont partagé entre les trois."
  tr: "CHY4U ders programı, 1450 ile 1650 yılları arasında Balkanlardan Bengal'e kadar uzanan bölgede hüküm süren üç İslam imparatorluğunu konu alıyor: İstanbul'un fethi, II. Muhammed ve Süleyman, İstanbul ve camileri, Safeviler ve Hint Babürleri; ve bu üç imparatorluğun barut, yönetim ve sanat açısından ortak noktaları."
  id: "Jalur pembelajaran CHY4U tentang tiga kekaisaran Islam yang memerintah dari Balkan hingga Bengal antara tahun 1450 dan 1650: penaklukan Konstantinopel, Muhammad II dan Suleiman, Istanbul dan masjid-masjidnya, Dinasti Safawi dan Mughal India, serta kesamaan ketiganya dalam hal bubuk mesiu, administrasi, dan seni."
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب البنى السياسية والاقتصادية لإمبراطوريات البارود، وعلاقاتها بجيرانها، وإسهام حكّام وفنانين بأعيانهم في هويتها بين 1450 و1650.
  en: Students analyse the political and economic structures of the gunpowder empires, their relations with their neighbours, and the contribution of named rulers and artists to their identity between 1450 and 1650.
  ur: طلبہ بارودی سلطنتوں کے سیاسی اور معاشی ڈھانچوں، ہمسایوں سے ان کے تعلقات، اور 1450 اور 1650 کے بیچ نامزد حاکموں اور فنکاروں کے ان کی شناخت میں حصے کا تجزیہ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHY4U
  course_title:
    ar: تاريخ العالم منذ القرن الخامس عشر، الصف 12، إعداد جامعي
    en: World History since the Fifteenth Century, Grade 12, University Preparation
    ur: پندرہویں صدی سے دنیا کی تاریخ، جماعت 12، یونیورسٹی تیاری
  grade: "12"
  strand: B
  strand_title:
    ar: العالم 1450–1650
    en: The World, 1450–1650
    ur: دنیا، 1450–1650
  expectations:
    - B1
    - B2
    - B3
  expectation:
    ar: "يغطي الدرس الفترة 1450–1650 في إقليم غير أوروبي بثلاث دول: البنى السياسية والاقتصادية ⁦(الديوان، الجند، التجارة)⁩، والعلاقات بين الجماعات والدول المتجاورة ⁦(العثمانيون والصفويون، العثمانيون وأوروبا)⁩، وإسهام أفراد محدّدين ⁦(محمد الثاني، سليمان، معماري البلاط)⁩ في الهوية والتراث عبر العمارة والقانون."
    en: "The lesson covers 1450–1650 in a non-European region through three states: political and economic structures (the divan, the army, trade), relations between neighbouring groups and states (Ottomans and Safavids, Ottomans and Europe), and the contribution of named individuals (Mehmed II, Suleiman, the court architect) to identity and heritage through architecture and law."
    ur: "یہ سبق 1450–1650 کے دور کو ایک غیر یورپی خطے میں تین ریاستوں کے ذریعے پڑھاتا ہے: سیاسی اور معاشی ڈھانچے ⁦(دیوان، فوج، تجارت)⁩، ہمسایہ گروہوں اور ریاستوں کے تعلقات ⁦(عثمانی اور صفوی، عثمانی اور یورپ)⁩، اور نامزد افراد ⁦(محمد ثانی، سلیمان، درباری معمار)⁩ کا فنِ تعمیر اور قانون کے ذریعے شناخت اور ورثے میں حصہ۔"
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: الدولة العثمانية
      en: The Ottoman state
      ur: عثمانی ریاست
      es: "El estado otomano"
      fr: "L'État ottoman"
      tr: "Osmanlı İmparatorluğu"
      id: "Kekaisaran Ottoman"
    body:
      ar: "من إمارة في الأناضول إلى إمبراطورية ثلاث قارات: البنية والجند والديوان."
      en: "From an Anatolian principality to an empire on three continents: structure, army and divan."
      ur: "اناطولیہ کی ایک امارت سے تین براعظموں کی سلطنت تک: ڈھانچہ، فوج اور دیوان۔"
      es: "De un principado anatolio a un imperio en tres continentes: estructura, ejército y diván."
      fr: "D'une principauté anatolienne à un empire sur trois continents: structure, armée et divan."
      tr: "Anadolu'daki bir emirlikten üç kıtaya yayılan bir imparatorluğa: yapı, ordu ve saray."
      id: "Dari sebuah emirat di Anatolia menjadi sebuah kekaisaran yang meliputi tiga benua: struktur, militer, dan istana."
    features:
      - polity/ottoman-empire
  - title:
      ar: محمد الثاني وفتح القسطنطينية
      en: Mehmed II and the conquest of Constantinople
      ur: محمد ثانی اور قسطنطنیہ کی فتح
      es: "Mehmed II y la conquista de Constantinopla"
      fr: "Mehmed II et la conquête de Constantinople"
      tr: "II. Mehmed ve Konstantinopolis'in Fethi"
      id: "Mehmed II dan penaklukan Konstantinopel"
    body:
      ar: "سنة 1453: المدافع الكبيرة، والمدينة التي صارت إسطنبول."
      en: "1453: the great cannon, and the city that became Istanbul."
      ur: "1453: بڑی توپیں، اور وہ شہر جو استنبول بنا۔"
      es: "1453: el gran cañón y la ciudad que se convertiría en Estambul."
      fr: "1453: le grand canon et la ville qui allait devenir Istanbul."
      tr: "1453 yılı: Büyük toplar ve İstanbul'a dönüşen şehir."
      id: "Tahun 1453: Meriam-meriam besar, dan kota yang kemudian menjadi Istanbul."
    features:
      - person/mehmed-ii
      - event/conquest-constantinople-857
  - title:
      ar: إسطنبول وآيا صوفيا
      en: Istanbul and Hagia Sophia
      ur: استنبول اور آیا صوفیہ
      es: "Estambul y Santa Sofía"
      fr: "Istanbul et Sainte-Sophie"
      tr: "İstanbul ve Ayasofya"
      id: "Istanbul dan Hagia Sophia"
    body:
      ar: "عاصمة قديمة تُعاد صياغتها: من كنيسة إلى مسجد، ومن مدينة رومية إلى مدينة عثمانية."
      en: "An old capital refashioned: from church to mosque, from Roman city to Ottoman city."
      ur: "ایک پرانا دارالحکومت نئے روپ میں: کلیسا سے مسجد، رومی شہر سے عثمانی شہر۔"
      es: "Una antigua capital reinventada: de iglesia a mezquita, de ciudad romana a ciudad otomana."
      fr: "Une ancienne capitale réinventée: d'église en mosquée, de ville romaine en ville ottomane."
      tr: "Eski bir başkent yeniden şekilleniyor: kiliseden camiye, Roma şehrinden Osmanlı şehrine."
      id: "Sebuah ibu kota kuno yang dibentuk ulang: dari gereja menjadi masjid, dari kota Romawi menjadi kota Ottoman."
    features:
      - place/istanbul
      - building/hagia-sophia
  - title:
      ar: سليمان القانوني
      en: Suleiman the Lawgiver
      ur: سلیمان قانونی
      es: "Solimán el Legislador"
      fr: "Soliman le Législateur"
      tr: "Muhteşem Süleyman"
      id: "Suleiman yang Agung"
    body:
      ar: "أطول سلاطين القرن حكمًا: القانون والجيش والحدود مع أوروبا وفارس."
      en: "The longest-reigning sultan of the century: law, army, and frontiers with Europe and Persia."
      ur: "صدی کا سب سے لمبی حکومت والا سلطان: قانون، فوج، اور یورپ و فارس سے سرحدیں۔"
      es: "El sultán que más tiempo reinó en el siglo: ley, ejército y fronteras con Europa y Persia."
      fr: "Le sultan au règne le plus long du siècle: droit, armée et frontières avec l'Europe et la Perse."
      tr: "Yüzyılın en uzun süre tahtta kalan sultanları: Hukuk, ordu ve Avrupa ile İran ile sınırlar."
      id: "Sultan-sultan yang memerintah paling lama di abad ini: Hukum, militer, dan perbatasan dengan Eropa dan Persia."
    features:
      - person/sulayman-al-qanuni
  - title:
      ar: جامع السليمانية
      en: The Suleymaniye Mosque
      ur: سلیمانیہ مسجد
      es: "La mezquita de Suleymaniye"
      fr: "La mosquée Süleymaniye"
      tr: "Süleymaniye Camii"
      id: "Masjid Sulaymaniyah"
    body:
      ar: "معمار البلاط سنان وقبة تطلّ على المدينة: العمارة بوصفها سلطة."
      en: "The court architect Sinan and a dome over the city: architecture as power."
      ur: "درباری معمار سنان اور شہر پر چھایا ایک گنبد: فنِ تعمیر بطور اقتدار۔"
      es: "El arquitecto de la corte, Sinan, y una cúpula sobre la ciudad: la arquitectura como poder."
      fr: "L'architecte de la cour, Sinan, et un dôme au-dessus de la ville: l'architecture comme outil de pouvoir."
      tr: "Saraya ev sahipliği yapan Sinan'ın mimarlığı ve şehre bakan kubbe: Mimari, gücün bir göstergesi."
      id: "Arsitek istana, Sinan, dan sebuah kubah yang menghadap ke kota: Arsitektur sebagai kekuatan."
    features:
      - building/sulaymaniyya-mosque
  - title:
      ar: الصفويون في إيران
      en: The Safavids in Iran
      ur: ایران میں صفوی
      es: "Los safávidas en Irán"
      fr: "Les Safavides en Iran"
      tr: "İran'daki Safeviler"
      id: "Dinasti Safawi di Iran"
    body:
      ar: "دولة منافسة ذات مذهب مختلف: أصفهان، والحدود، والحرب والتجارة مع العثمانيين."
      en: "A rival state of a different confession: Isfahan, the frontier, and war and trade with the Ottomans."
      ur: "الگ مسلک کی ایک حریف ریاست: اصفہان، سرحد، اور عثمانیوں سے جنگ اور تجارت۔"
      es: "Un estado rival de confesión diferente: Isfahán, la frontera, y la guerra y el comercio con los otomanos."
      fr: "Un État rival d'une confession différente: Ispahan, la frontière, la guerre et le commerce avec les Ottomans."
      tr: "Farklı bir doktrine sahip rakip bir devlet: İsfahan, sınırlar, savaş ve Osmanlılarla ticaret."
      id: "Negara saingan dengan doktrin yang berbeda: Isfahan, perbatasan, perang, dan perdagangan dengan Ottoman."
    features:
      - polity/safavid-iran
  - title:
      ar: المغول في الهند
      en: The Mughals in India
      ur: ہندوستان میں مغل
      es: "Los mogoles en la India"
      fr: "Les Moghols en Inde"
      tr: "Hindistan'daki Babürler"
      id: "Dinasti Mughal di India"
    body:
      ar: "بابر وأكبر: إمبراطورية إسلامية تحكم أغلبية غير مسلمة."
      en: "Babur and Akbar: a Muslim empire ruling a non-Muslim majority."
      ur: "بابر اور اکبر: ایک مسلم سلطنت غیر مسلم اکثریت پر حکومت کرتی ہے۔"
      es: "Babur y Akbar: un imperio musulmán que gobernaba a una mayoría no musulmana."
      fr: "Babur et Akbar: un empire musulman régnant sur une majorité non musulmane."
      tr: "Babür ve Ekber: Müslüman olmayan çoğunluğa hükmeden bir İslam imparatorluğu."
      id: "Babur dan Akbar: Sebuah kekaisaran Islam yang memerintah mayoritas non-Muslim."
    features:
      - polity/mughal-empire
  - title:
      ar: عصر إمبراطوريات البارود
      en: The age of the gunpowder empires
      ur: بارودی سلطنتوں کا دور
      es: "La era de los imperios de la pólvora"
      fr: "L'ère des empires de la poudre à canon"
      tr: "Barut İmparatorlukları Çağı"
      id: "Zaman Kekaisaran Bubuk Mesiu"
    body:
      ar: "ما جمع الثلاث: المدفع، والديوان، والمنمنمات، وما فرّق بينها."
      en: What the three shared, cannon, divan and miniature painting, and what divided them.
      ur: تینوں میں کیا مشترک تھا، توپ، دیوان اور منی ایچر، اور کیا الگ۔
      es: "Lo que los tres compartían: el cañón, el diván y la pintura en miniatura, y lo que los dividía."
      fr: "Ce que les trois avaient en commun: le canon, le divan et la peinture miniature ; et ce qui les divisait."
      tr: "Üçünü bir araya getiren şey neydi: top, divan ve minyatürler; ve onları birbirinden ayıran şey neydi?"
      id: "Apa yang menyatukan ketiganya: meriam, sofa, dan miniatur, dan apa yang memisahkan mereka."
    features:
      - period/gunpowder-empires
