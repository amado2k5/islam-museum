  ur: "ابن الزبیر کی جنگ کا ایک راستہ۔"
  tr: "İbn el-Zübeyr'in savaşına dair bir ders: Mekke, on yıl boyunca on ikinci halifelik, el-Haccac Kâbe'yi iki kez kuşatır ve Mervan devleti yeniden kurar - Emeviler yeniden doğar."
  id: "Sebuah pelajaran tentang perang Ibn al-Zubayr: Mekah, kekhalifahan kedua belas selama sepuluh tahun, al-Hajjaj mengepung Ka'bah dua kali, dan Marwan memulihkan negara — Dinasti Umayyah terlahir kembali."
