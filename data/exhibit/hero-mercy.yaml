- title:
    ar: "زينب بنت علي"
    en: "Zaynab bint Ali"
    ur: "زینب بنت علی"
    es: "Zaynab bint Ali"
    fr: "Zaynab bint Ali"
    tr: "Zainab bint Ali"
    id: "Zainab bint Ali"
  body:
    ar: "يوم كربلاء فقدت أخاها وأهل بيتها، فصارت للسبايا والأطفال أمًّا وراعية حتى رُدّت الأمانة."
    en: "At Karbala she lost her brother and her household, then became mother and guardian to the captives and children until the trust was returned."
    ur: "کربلا میں بھائی اور گھر والوں کو کھویا، پھر قیدیوں اور بچوں کی ماں اور سرپرست بن گئیں یہاں تک کہ امانت واپس آئی۔"
    es: "En Karbala perdió a su hermano y a su familia, y entonces se convirtió en madre y tutora de los cautivos y los niños hasta que se les devolvió la confianza."
    fr: "À Karbala, elle perdit son frère et sa famille, puis devint mère et tutrice des captifs et des enfants jusqu'à ce que la confiance soit rétablie."
    tr: "Kerbela günü kardeşini ve ailesini kaybettiği için, emanet geri verilene kadar esirlere ve çocuklara annelik ve vasilik yaptı."
    id: "Pada hari Karbala, dia kehilangan saudara laki-lakinya dan keluarganya, sehingga dia menjadi seorang ibu dan wali bagi para tawanan dan anak-anak sampai amanah itu dikembalikan."
  features:
  - person/zaynab-bint-ali
  - event/battle-of-karbala
- title:
    ar: "نور الدين محمود زنكي"
    en: "Nur al-Din Mahmud Zangi"
    ur: "نورالدین محمود زنگی"
    es: "Nur al-Din Mahmud Zangi"
    fr: "Nur al-Din Mahmud Zangi"
    tr: "Nur ad-Din Mahmud Zangi"
    id: "Nur ad-Din Mahmud Zangi"
  body:
    ar: "العادل: أقام بيت العدل في دمشق يرد المظالم، ووحّد الشام ومصر على نصرة واجتماع."
    en: "The Just: he raised the House of Justice at Damascus to restore wrongs, and united Syria and Egypt around victory and concord."
    ur: "عادل: دمشق میں دارالعدل قائم کر کے مظالم واپس دلائے، اور شام اور مصر کو نصرت اور اتحاد پر جمع کیا۔"
    es: "El Justo: erigió la Casa de la Justicia en Damasco para reparar las injusticias y unió a Siria y Egipto en torno a la victoria y la concordia."
    fr: "Le Juste: il a érigé la Maison de Justice à Damas pour réparer les injustices et a uni la Syrie et l'Égypte autour de la victoire et de la concorde."
    tr: "El-Adil: Haksızlıkları gidermek için Şam'da Adalet Evi'ni kurdu ve Suriye ile Mısır'ı destek ve birlik içinde birleştirdi."
    id: "Al-Adil: Dia mendirikan Rumah Keadilan di Damaskus untuk menyelesaikan perselisihan, dan dia menyatukan Suriah dan Mesir dalam dukungan dan persatuan."
  features:
  - person/nur-al-din-mahmud-ibn-zangi
  - place/damascus
- title:
    ar: "عبد القادر الجزائري"
    en: "Abd al-Qadir al-Jaza'iri"
    ur: "عبدالقادر جزائری"
    es: "Abd al-Qadir al-Jaza'iri"
    fr: "Abd al-Qadir al-Jaza'iri"
    tr: "Abdülkadir el-Cezâiri"
    id: "Abd al-Qadir al-Jaza'iri"
  body:
    ar: "أمير المقاومة الجزائرية، ثم في منفاه بدمشق خرج بنفسه يوم الفتنة يحمي مسيحيّ المدينة فأنقذ ألوفًا."
    en: "Emir of the Algerian resistance; in his Damascus exile he himself went out in the riots to protect the city's Christians and saved thousands."
    ur: "الجزائری مزاحمت کے امیر؛ دمشق میں جلاوطنی کے زمانے فسادات میں خود نکل کر شہر کے مسیحیوں کی حفاظت کی اور ہزاروں جانیں بچائیں۔"
    es: "Emir de la resistencia argelina; durante su exilio en Damasco, él mismo salió a las calles en medio de los disturbios para proteger a los cristianos de la ciudad y salvó a miles."
    fr: "Émir de la résistance algérienne ; durant son exil à Damas, il participa lui-même aux émeutes pour protéger les chrétiens de la ville et en sauva des milliers."
    tr: "Cezayir direnişinin emiri, o sırada Şam'da sürgünde olmasına rağmen, çatışma günü bizzat dışarı çıkarak şehrin Hristiyanlarını korudu ve binlerce kişiyi kurtardı."
    id: "Emir perlawanan Aljazair, yang saat itu berada di pengasingan di Damaskus, turun sendiri pada hari terjadinya konflik untuk melindungi umat Kristen di kota itu dan menyelamatkan ribuan orang."
