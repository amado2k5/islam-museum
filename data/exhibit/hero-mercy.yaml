rooms:
- title:
    ar: "الحسن البصري"
    en: "Al-Hasan al-Basri"
    ur: "حسن بصری"
  body:
    ar: "سيد التابعين: جمع بين ورع الزاهد ورحمة المعلم، وكان وعظه بالبصرة شفاءً للقلوب."
    en: "The master of the Successors: he joined an ascetic's scrupulousness to a teacher's mercy, and his sermons at Basra healed hearts."
    ur: "تابعین کے سردار: زاہد کے پرہیز اور استاد کے رحم کو جمع کیا، اور بصرہ میں ان کے مواعظ دلوں کی شفا تھے۔"
  features:
  - person/al-hasan-al-basri
  - place/basra
- title:
    ar: "زينب بنت علي"
    en: "Zaynab bint Ali"
    ur: "زینب بنت علی"
  body:
    ar: "يوم كربلاء فقدت أخاها وأهل بيتها، فصارت للسبايا والأطفال أمًّا وراعية حتى رُدّت الأمانة."
    en: "At Karbala she lost her brother and her household, then became mother and guardian to the captives and children until the trust was returned."
    ur: "کربلا میں بھائی اور گھر والوں کو کھویا، پھر قیدیوں اور بچوں کی ماں اور سرپرست بن گئیں یہاں تک کہ امانت واپس آئی۔"
  features:
  - person/zaynab-bint-ali
  - event/battle-of-karbala
- title:
    ar: "نور الدين محمود زنكي"
    en: "Nur al-Din Mahmud Zangi"
    ur: "نورالدین محمود زنگی"
  body:
    ar: "العادل: أقام بيت العدل في دمشق يرد المظالم، ووحّد الشام ومصر على نصرة واجتماع."
    en: "The Just: he raised the House of Justice at Damascus to restore wrongs, and united Syria and Egypt around victory and concord."
    ur: "عادل: دمشق میں دارالعدل قائم کر کے مظالم واپس دلائے، اور شام اور مصر کو نصرت اور اتحاد پر جمع کیا۔"
  features:
  - person/nur-al-din-mahmud-ibn-zangi
  - place/damascus
- title:
    ar: "عبد القادر الجزائري"
    en: "Abd al-Qadir al-Jaza'iri"
    ur: "عبدالقادر جزائری"
  body:
    ar: "أمير المقاومة الجزائرية، ثم في منفاه بدمشق خرج بنفسه يوم الفتنة يحمي مسيحيّ المدينة فأنقذ ألوفًا."
    en: "Emir of the Algerian resistance; in his Damascus exile he himself went out in the riots to protect the city's Christians and saved thousands."
    ur: "الجزائری مزاحمت کے امیر؛ دمشق میں جلاوطنی کے زمانے فسادات میں خود نکل کر شہر کے مسیحیوں کی حفاظت کی اور ہزاروں جانیں بچائیں۔"
  features:
