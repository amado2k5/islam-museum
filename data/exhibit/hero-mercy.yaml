label:
  ar: "أبطال الرحمة"
  en: "Heroes of Mercy"
  ur: "رحم کے ہیرو"
  es: "Héroes de la Misericordia"
  fr: "Héros de la Miséricorde"
  tr: "Merhamet Kahramanları"
  id: "Pahlawan Belas Kasih"
summary:
  ar: " 'مسار فيمن جعلوا الرحمة سلطانًا على القوة: الحسن البصري واعظ الزهاد، وزينب سيدة الصبر والاحتضان يوم كربلاء، ونور الدين العادل الذي ردّ المظالم، وعبد القادر الجزائري الذي آوى المسيحيين في دمشق.'"
  en: " 'A trail of those who let mercy rule their strength: al-Hasan al-Basri the preacher of the renunciants, Zaynab the refuge of Karbala's orphans, Nur al-Din the just who restored rights, and Abd al-Qadir who sheltered Damascus's Christians.'"
  ur: " 'ان لوگوں کا سفر جنھوں نے طاقت پر رحم کو غالب کیا: حسن بصری زاہدوں کے واعظ، زینب کربلا کے یتیموں کی پناہ، نور الدین عادل مظلوموں کو ان کا حق دلانے والے، اور عبدالقادر جزائری دمشق کے مسیحیوں کو پناہ دینے والے۔'"
  es: "«Una muestra de aquellos que dejaron que la misericordia rigiera su fuerza: al-Hasan al-Basri, el predicador de los renunciantes; Zaynab, el refugio de los huérfanos de Karbala; Nur al-Din, el justo que restauró los derechos; y Abd al-Qadir, que dio cobijo a los cristianos de Damasco»."
  fr: "« Une série de ceux qui ont laissé la miséricorde guider leur force: al-Hasan al-Basri, le prédicateur des renonçants, Zaynab, le refuge des orphelins de Karbala, Nur al-Din, le juste qui a rétabli les droits, et Abd al-Qadir, qui a abrité les chrétiens de Damas. »"
  tr: "'Merhameti gücün önüne geçirenlerin yolu: Zühdün vaizi Hasan el-Besri, Kerbela günü sabrı ve kucaklaşmasıyla tanınan Zeyneb, haksızlıkları düzelten Nur el-Din el-Adil ve Şam'da Hristiyanlara sığınak sağlayan Abdülkadir el-Ceziri.'"
  id: "'Jalan yang ditempuh oleh mereka yang menjadikan rahmat sebagai penguasa atas kekuasaan: Al-Hasan Al-Basri, penyebar ajaran para pertapa, Zainab, wanita yang sabar dan penuh kasih sayang pada hari Karbala, Nur Al-Din Al-Adil, yang menegakkan keadilan, dan Abdul Qadir Al-Jazairi, yang melindungi kaum Kristen di Damaskus.'"
