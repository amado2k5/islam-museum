    tr: "El-Hasan el-Basri"
    id: "Al-Hasan al-Basri"
  body:
    ar: "سيد التابعين: جمع بين ورع الزاهد ورحمة المعلم، وكان وعظه بالبصرة شفاءً للقلوب."
    en: "The master of the Successors: he joined an ascetic's scrupulousness to a teacher's mercy, and his sermons at Basra healed hearts."
    ur: "تابعین کے سردار: زاہد کے پرہیز اور استاد کے رحم کو جمع کیا، اور بصرہ میں ان کے مواعظ دلوں کی شفا تھے۔"
    es: "El maestro de los Sucesores: combinó la escrupulosidad de un asceta con la misericordia de un maestro, y sus sermones en Basora sanaron corazones."
    fr: "Le maître des Successeurs: il alliait la rigueur de l'ascète à la miséricorde du maître, et ses sermons à Bassora guérissaient les cœurs."
    tr: "Takipçilerin üstadı: O, münzevi dindarlığını öğretmenin merhametiyle birleştirmişti ve Basra'daki vaazları kalplere şifa olmuştu."
    id: "Sang pemimpin para pengikut: Ia menggabungkan kesalehan seorang pertapa dengan belas kasih seorang guru, dan dakwahnya di Basra merupakan obat bagi hati."
