id: exhibit/pathway-g11-hrf3o-five-pillars-daily-life
class: exhibit
kind: lesson
label:
  ar: الأركان الخمسة في الحياة اليومية
  en: The five pillars in daily life
  ur: روزمرہ زندگی میں پانچ ارکان
summary:
  ar: "مسار لمقرر HRF3O عن الأركان الخمسة كما تُعاش يومًا بيوم: الشهادة، والوضوء والصلاة، والزكاة، وصيام رمضان وعيد الفطر، والحج وعيد الأضحى، والتقويم الذي ينظّم السنة."
  en: "An HRF3O pathway on the five pillars as they are lived day by day: the shahada, wudu and prayer, zakat, fasting in Ramadan and Eid al-Fitr, the Hajj and Eid al-Adha, and the calendar that orders the year."
  ur: "HRF3O کا ایک راستہ پانچ ارکان پر جیسے وہ روز بہ روز گزارے جاتے ہیں: شہادت، وضو اور نماز، زکات، رمضان کے روزے اور عید الفطر، حج اور عید الاضحیٰ، اور وہ کیلنڈر جو سال کو ترتیب دیتا ہے۔"
audience:
  - teacher
  - student
level: intro
duration_minutes: 60
wings: []
goal:
  ar: أن يصف الطالب وظيفة الممارسات اليومية والسنوية في حياة المسلم ودلالتها، وأن يميّز بين ما يفعله الفرد وما تفعله الجماعة.
  en: Students describe the function and meaning of the daily and yearly observances in a Muslim's life, and distinguish what the individual does from what the community does.
  ur: طلبہ ایک مسلمان کی زندگی میں روزانہ اور سالانہ اعمال کے کام اور معنی بیان کریں، اور فرد کے کام کو برادری کے کام سے الگ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: HRF3O
  course_title:
    ar: أديان العالم وتقاليد الاعتقاد في الحياة اليومية، الصف 11، مفتوح
    en: World Religions and Belief Traditions in Daily Life, Grade 11, Open
    ur: روزمرہ زندگی میں دنیا کے مذاہب اور عقائد کی روایات، جماعت 11، اوپن
  grade: "11"
  strand: D
  strand_title:
    ar: الأعياد وشعائر العبور والممارسات اليومية
    en: Festivals, Celebrations, and Commemorations; Rites of Passage; Daily Observances
    ur: تہوار، جشن اور یادگاریں؛ رسومِ گزر؛ روزانہ کے اعمال
  expectations:
    - D3
    - D1
  expectation:
    ar: يصف الدرس الممارسات اليومية للمسلم (الشهادة، الوضوء، الصلوات الخمس) ويشرح وظيفتها ودلالتها، ثم الأعياد والمناسبات السنوية (رمضان، العيدان، الحج) ودورها في حياة الجماعة، بلغة الوصف لا الحكم، وفي الإطار السنّي المسمّى.
    en: The lesson describes a Muslim's daily observances (the shahada, wudu, the five prayers) and explains their function and meaning, then the yearly festivals and occasions (Ramadan, the two Eids, the Hajj) and their role in the community's life, in the language of description, not ruling, and in the named Sunni frame.
    ur: یہ سبق ایک مسلمان کے روزانہ اعمال (شہادت، وضو، پانچ نمازیں) بیان کرتا ہے اور ان کے کام اور معنی سمجھاتا ہے، پھر سالانہ تہوار اور مواقع (رمضان، دو عیدیں، حج) اور برادری کی زندگی میں ان کا کردار، بیان کی زبان میں نہ کہ حکم کی، اور نامزد سنی خاکے میں۔
  document: "The Ontario Curriculum, Grades 9 to 12: Social Sciences and Humanities, 2013"
  verified: 2026-10-23
rooms:
  - title:
      ar: الأركان الخمسة
      en: The five pillars
      ur: پانچ ارکان
    body:
      ar: "خمسة أعمال تجمع المسلمين: ما هي ولماذا خمسة."
      en: "Five acts that unite Muslims: what they are and why five."
      ur: "پانچ عمل جو مسلمانوں کو جوڑتے ہیں: وہ کیا ہیں اور پانچ ہی کیوں۔"
    features:
      - concept/five-pillars
  - title:
      ar: الشهادة
      en: The shahada
      ur: شہادت
    body:
      ar: جملة واحدة تدخل بها إلى الإسلام وتُقال كل يوم.
      en: One sentence by which a person enters Islam and which is said every day.
      ur: ایک جملہ جس سے انسان اسلام میں داخل ہوتا ہے اور جو ہر روز کہا جاتا ہے۔
    features:
      - concept/shahada
  - title:
      ar: الوضوء
      en: Wudu
      ur: وضو
    body:
      ar: "الماء قبل الصلاة: الطهارة بوصفها عادة يومية."
      en: "Water before prayer: purity as a daily habit."
      ur: "نماز سے پہلے پانی: پاکیزگی بطور روزانہ کی عادت۔"
    features:
      - practice/wudu
  - title:
      ar: الصلاة
      en: Prayer
      ur: نماز
    body:
      ar: "خمس مرات في اليوم: الأوقات، والحركات، والمسجد والبيت."
      en: "Five times a day: the times, the movements, the mosque and the home."
      ur: "دن میں پانچ بار: اوقات، حرکات، مسجد اور گھر۔"
    features:
      - practice/salah
  - title:
      ar: الزكاة
      en: Zakat
      ur: زکات
    body:
      ar: "نسبة من المال كل سنة لمن يستحق: العبادة بوصفها اقتصادًا."
      en: "A share of wealth each year for those entitled: worship as economics."
      ur: "ہر سال مال کا ایک حصہ حق داروں کے لیے: عبادت بطور معیشت۔"
    features:
      - practice/zakat
  - title:
      ar: صيام رمضان
      en: Fasting in Ramadan
      ur: رمضان کے روزے
    body:
      ar: "شهر من الفجر إلى المغرب: اليوم، والإفطار، والليل."
      en: "A month from dawn to sunset: the day, the iftar, the night."
      ur: "فجر سے مغرب تک ایک مہینہ: دن، افطار اور رات۔"
    features:
      - practice/sawm-ramadan
  - title:
      ar: عيد الفطر
      en: Eid al-Fitr
      ur: عید الفطر
    body:
      ar: "صباح العيد بعد الشهر: الصلاة، والصدقة، والزيارات."
      en: "The morning of the Eid after the month: prayer, charity and visits."
      ur: "مہینے کے بعد عید کی صبح: نماز، صدقہ اور ملاقاتیں۔"
    features:
      - practice/eid-al-fitr
  - title:
      ar: الحج وعيد الأضحى
      en: The Hajj and Eid al-Adha
      ur: حج اور عید الاضحیٰ
    body:
      ar: رحلة العمر لمن استطاع، وعيد يحتفل به من بقي في بيته.
      en: The journey of a lifetime for those who can, and a festival for those who stay at home.
      ur: جو کر سکے اس کے لیے زندگی کا سفر، اور گھر رہنے والوں کے لیے ایک عید۔
    features:
      - practice/hajj
      - practice/eid-al-adha
  - title:
      ar: التقويم الهجري
      en: The Hijri calendar
      ur: ہجری کیلنڈر
    body:
      ar: "سنة قمرية تنتقل في الفصول: لماذا يأتي رمضان في الصيف مرة وفي الشتاء مرة."
      en: "A lunar year that moves through the seasons: why Ramadan falls in summer one decade and in winter another."
      ur: "ایک قمری سال جو موسموں میں گھومتا ہے: رمضان کبھی گرمیوں میں اور کبھی سردیوں میں کیوں آتا ہے۔"
    features:
      - concept/hijri-calendar
outcomes:
  - text:
      ar: أسمّي الأركان الخمسة وأصف كيف يُؤدّى كل ركن.
      en: I can name the five pillars and describe how each is performed.
      ur: میں پانچ ارکان کے نام لے سکتا ہوں اور بتا سکتا ہوں کہ ہر ایک کیسے ادا ہوتا ہے۔
    steps:
      - 0
      - 1
      - 3
      - 4
      - 5
      - 7
  - text:
      ar: أميّز بين الممارسة اليومية والمناسبة السنوية وأشرح وظيفة كل منهما.
      en: I can distinguish a daily observance from a yearly occasion and explain the function of each.
      ur: میں روزانہ کے عمل کو سالانہ موقعے سے الگ کر سکتا ہوں اور ہر ایک کا کام بیان کر سکتا ہوں۔
    steps:
      - 2
      - 6
      - 8
  - text:
      ar: أصف يومًا في رمضان في بيت مسلم بالوصف لا بالحكم.
      en: I can describe a day of Ramadan in a Muslim home in the language of description, not judgement.
      ur: میں ایک مسلم گھر میں رمضان کا ایک دن بیان کی زبان میں، فیصلے کی زبان میں نہیں، بتا سکتا ہوں۔
    steps:
      - 5
      - 6
worksheet:
  - prompt:
      ar: "ارسم جدول يوم واحد لمسلم: أين تقع الصلوات الخمس؟"
      en: "Draw the timetable of one day for a Muslim: where do the five prayers fall?"
      ur: "ایک مسلمان کے ایک دن کا نظام الاوقات بنائیں: پانچ نمازیں کہاں آتی ہیں؟"
    steps:
      - 3
  - prompt:
      ar: ما وظيفة الوضوء قبل الصلاة؟ وماذا يقول ذلك عن معنى الطهارة؟
      en: What is the function of wudu before prayer, and what does it say about the meaning of purity?
      ur: نماز سے پہلے وضو کا کیا کام ہے، اور یہ پاکیزگی کے معنی کے بارے میں کیا کہتا ہے؟
    steps:
      - 2
  - prompt:
      ar: كيف تجمع الزكاة بين العبادة والمجتمع؟
      en: How does zakat join worship and society?
      ur: زکات عبادت اور معاشرے کو کیسے جوڑتی ہے؟
    steps:
      - 4
  - prompt:
      ar: صِف يومًا من رمضان في بيت مسلم من الفجر إلى الليل.
      en: Describe a day of Ramadan in a Muslim home from dawn to night.
      ur: ایک مسلم گھر میں فجر سے رات تک رمضان کا ایک دن بیان کریں۔
    steps:
      - 5
      - 6
  - prompt:
      ar: لماذا يأتي رمضان في فصول مختلفة من عام إلى عام؟
      en: Why does Ramadan come in different seasons from year to year?
      ur: رمضان ہر سال الگ موسم میں کیوں آتا ہے؟
    steps:
      - 8
quiz:
  - q:
      ar: كم مرة يصلي المسلم في اليوم؟
      en: How many times a day does a Muslim pray?
      ur: مسلمان دن میں کتنی بار نماز پڑھتا ہے؟
    options:
      - ar: مرة
        en: Once
        ur: ایک بار
      - ar: ثلاث مرات
        en: Three times
        ur: تین بار
      - ar: خمس مرات
        en: Five times
        ur: پانچ بار
      - ar: سبع مرات
        en: Seven times
        ur: سات بار
    answer: 2
    teaches: 3
  - q:
      ar: ما الوضوء؟
      en: What is wudu?
      ur: وضو کیا ہے؟
    options:
      - ar: الغسل بالماء قبل الصلاة
        en: Washing with water before prayer
        ur: نماز سے پہلے پانی سے دھونا
      - ar: صلاة الليل
        en: The night prayer
        ur: رات کی نماز
      - ar: نوع من الصدقة
        en: A kind of charity
        ur: صدقے کی ایک قسم
      - ar: صيام يوم عرفة
        en: Fasting on the day of Arafat
        ur: عرفہ کے دن کا روزہ
    answer: 0
    teaches: 2
  - q:
      ar: ما الزكاة؟
      en: What is zakat?
      ur: زکات کیا ہے؟
    options:
      - ar: صلاة العيد
        en: The Eid prayer
        ur: عید کی نماز
      - ar: رحلة إلى مكة
        en: A journey to Mecca
        ur: مکہ کا سفر
      - ar: قراءة القرآن كله
        en: Reading the whole Qur'an
        ur: پورا قرآن پڑھنا
      - ar: نسبة من المال تُدفع كل سنة لمن يستحق
        en: A share of wealth paid each year to those entitled
        ur: مال کا حصہ جو ہر سال حق داروں کو دیا جاتا ہے
    answer: 3
    teaches: 4
  - q:
      ar: متى يصوم المسلم في رمضان؟
      en: When does a Muslim fast in Ramadan?
      ur: مسلمان رمضان میں کب روزہ رکھتا ہے؟
    options:
      - ar: من الفجر إلى المغرب
        en: From dawn to sunset
        ur: فجر سے مغرب تک
      - ar: من الظهر إلى منتصف الليل
        en: From noon to midnight
        ur: ظہر سے آدھی رات تک
      - ar: طول اليوم والليل
        en: All day and night
        ur: پورا دن اور رات
      - ar: يوم الجمعة فقط
        en: Only on Fridays
        ur: صرف جمعے کو
    answer: 0
    teaches: 5
  - q:
      ar: لماذا يأتي رمضان في فصول مختلفة من سنة إلى سنة؟
      en: Why does Ramadan fall in different seasons from year to year?
      ur: رمضان ہر سال الگ موسم میں کیوں آتا ہے؟
    options:
      - ar: لأن الحكومات تغيّره
        en: Governments move it
        ur: حکومتیں اسے بدلتی ہیں
      - ar: لأن السنة الهجرية قمرية وأقصر من الشمسية
        en: The Hijri year is lunar and shorter than the solar year
        ur: ہجری سال قمری ہے اور شمسی سال سے چھوٹا
      - ar: لأنه يتبع الطقس
        en: It follows the weather
        ur: یہ موسم کے پیچھے چلتا ہے
      - ar: لا يتغيّر موعده
        en: Its date never changes
        ur: اس کی تاریخ نہیں بدلتی
    answer: 1
    teaches: 8
