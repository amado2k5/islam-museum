id: exhibit/path-fatimid-cairo
class: exhibit
kind: trail
label:
  ar: القاهرة الفاطمية
  en: Fatimid Cairo
summary:
  ar: 'مسار في دولة الفاطميين: جوهر يدخل مصر ويبني القاهرة، والمعز ينزل بقصره فيها، والجامع الأزهر والحاكم، ثم الأيوبيون.'
  en: A trail through the Fatimid state; Jawhar enters Egypt and lays out Cairo, al-Mu'izz lodges in his palace there, then al-Azhar, al-Hakim and the Ayyubids.
audience:
- newcomer
- student
duration_minutes: 30
wings: []
regions:
- egypt-nile
rooms:
- title:
    ar: جوهر
    en: Jawhar
  body:
    ar: 'أرسل المعز جوهراً إلى مصر، فنزل موضع القاهرة في شعبان سنة 358هـ وأدار سورها الأول من اللبن. {cite:khitat-maqrizi-1998 p.1030} {cite:khitat-maqrizi-1998 p.1067} وأُنفق مال بيت المال على عساكره من سنة 358 إلى 362هـ. {cite:khitat-maqrizi-1998 p.1011}'
    en: 'Al-Mu''izz sent Jawhar to Egypt. He reached the site of Cairo in Sha''ban 358 AH and built its first wall of mud brick. {cite:khitat-maqrizi-1998 p.1030} {cite:khitat-maqrizi-1998 p.1067} The treasure was spent on his armies from 358 to 362 AH. {cite:khitat-maqrizi-1998 p.1011}'
  features:
  - person/jawhar-al-siqilli
  - place/cairo
- title:
    ar: المعز
    en: Al-Mu'izz
  body:
    ar: 'دخل المعز مصر ونزل بقصره في القاهرة، ثم أمر في رمضان سنة 362هـ بكتابة «خير الناس بعد رسول الله» على أماكن المدينة. {cite:khitat-maqrizi-1998 p.2174} وسُمّيت المدينة القاهرة بعدما كانت المنصورية. {cite:khitat-maqrizi-1998 p.1067} وكانت القصور الفاطمية ينزلها الخليفة بحرمه وخواصه. {cite:khitat-maqrizi-1998 p.1001}'
    en: 'Al-Mu''izz entered Egypt and lodged in his palace in Cairo. In Ramadan 362 AH he ordered that "the best of people after the Messenger of God" be written on the places of the city. {cite:khitat-maqrizi-1998 p.2174} The city, once called al-Mansuriyya, was named al-Qahira. {cite:khitat-maqrizi-1998 p.1067} The caliph lived there with his household and his closest people. {cite:khitat-maqrizi-1998 p.1001}'
  features:
  - person/al-muizz-li-din-allah
  - polity/fatimid-caliphate
- title:
    ar: الأزهر
    en: Al-Azhar
  body:
    ar: 'يُقال للجامع «جامع القاهرة» و«الجامع الأزهر»، ومجموع القصرين «القصور الزاهرة». {cite:khitat-maqrizi-1998 p.1032} وكان داعي الدعاة يفرد للنساء مجلساً فيه. {cite:khitat-maqrizi-1998 p.1098} وفي يوم المولد النبوي كان خطيبه يخطب في مجلس الخليفة. {cite:khitat-maqrizi-1998 p.1194}'
    en: 'The mosque was called "Jami'' al-Qahira" and "al-Azhar", and the two palaces together "the Splendid Palaces". {cite:khitat-maqrizi-1998 p.1032} The chief da''i set aside a session for women in it. {cite:khitat-maqrizi-1998 p.1098} On the day of the Prophet''s birth its preacher preached before the caliph. {cite:khitat-maqrizi-1998 p.1194}'
  features:
  - building/al-azhar
  - place/cairo
- title:
    ar: الحاكم
    en: Al-Hakim
  body:
    ar: 'فقد الحاكم في شوال سنة 411هـ، وكان عمره ستاً وثلاثين سنة وسبعة أشهر. {cite:khitat-maqrizi-1998 p.2041} واتخذ دار العلم في القاهرة، وفتحت دار الحكمة سنة 395هـ. {cite:khitat-maqrizi-1998 p.1250} ويرجّح المقريزي رواية الرجل الذي أقر بقتله سنة 415هـ. {cite:khitat-maqrizi-1998 p.2042}'
    en: 'Al-Hakim disappeared in Shawwal 411 AH, at the age of thirty-six years and seven months. {cite:khitat-maqrizi-1998 p.2041} He took the Dar al-Ilm in Cairo, and the Dar al-Hikma was opened in 395 AH. {cite:khitat-maqrizi-1998 p.1250} Al-Maqrizi prefers the account of a man who confessed to killing him in 415 AH. {cite:khitat-maqrizi-1998 p.2042}'
  features:
  - person/al-hakim-bi-amr-allah
  - place/cairo
- title:
    ar: الأيوبيون
    en: The Ayyubids
  body:
    ar: 'دخل صلاح الدين مصر، فانقضت الدولة الفاطمية بدخول الغز واستيلاء صلاح الدين يوسف بن أيوب. {cite:khitat-maqrizi-1998 p.290} وانتقل الملك الكامل من القاهرة إلى قلعة الجبل، فصارت القاهرة مدينة سكنى. {cite:khitat-maqrizi-1998 p.1001} وانتهت دولة بني أيوب في مصر سنة 648هـ بعد إحدى وثمانين سنة وسبعة عشر يوماً. {cite:khitat-maqrizi-1998 p.1912}'
    en: 'Saladin took Egypt and the Fatimid state ended with the Ghuzz and the seizure of the kingdom by Saladin Yusuf ibn Ayyub. {cite:khitat-maqrizi-1998 p.290} Al-Kamil moved from Cairo to the Citadel, and the city became a city of residence. {cite:khitat-maqrizi-1998 p.1001} The Ayyubid rule in Egypt ended in 648 AH, after eighty-one years and seventeen days. {cite:khitat-maqrizi-1998 p.1912}'
  features:
  - polity/ayyubid-dynasty
  - place/cairo
