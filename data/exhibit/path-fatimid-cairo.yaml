id: exhibit/path-fatimid-cairo
class: exhibit
kind: trail
label:
  ar: القاهرة الفاطمية
  en: Fatimid Cairo
  es: "El Cairo fatimí"
  fr: "Le Caire fatimide"
  ur: "فاطمی قاہرہ"
  tr: "Fatimid Kahire"
  id: "Kairo Fatimiyah"
summary:
  ar: 'مسار في دولة الفاطميين: جوهر يدخل مصر ويبني القاهرة، والمعز ينزل بقصره فيها، والجامع الأزهر والحاكم، ثم الأيوبيون.'
  en: A trail through the Fatimid state; Jawhar enters Egypt and lays out Cairo, al-Mu'izz lodges in his palace there, then al-Azhar, al-Hakim and the Ayyubids.
  es: "Un recorrido por el estado fatimí; Jawhar entra en Egipto y funda El Cairo, al-Mu'izz se aloja en su palacio allí, luego al-Azhar, al-Hakim y los ayubíes."
  fr: "Un parcours à travers l'État fatimide ; Jawhar entre en Égypte et établit le Caire, al-Mu'izz s'y installe dans son palais, puis al-Azhar, al-Hakim et les Ayyoubides."
  ur: "فاطمی ریاست کے ذریعے ایک پگڈنڈی؛ جوہر مصر میں داخل ہوتا ہے اور قاہرہ میں رہتا ہے، المعز وہاں اپنے محل میں قیام کرتا ہے، پھر الازہر، الحکیم اور ایوبی۔"
  tr: "Fatımi devletinde bir yolculuk: Cevher Mısır'a girer ve Kahire'yi inşa eder, Müizz orada sarayında kalır, El-Ezher Camii ve El-Hakim inşa edilir, ardından Eyyubiler gelir."
  id: "Sebuah perjalanan dalam kerajaan Fatimiyah: Jawhar memasuki Mesir dan membangun Kairo, Al-Mu'izz tinggal di istananya di sana, Masjid Al-Azhar dan Al-Hakim, kemudian dinasti Ayyubiyah."
