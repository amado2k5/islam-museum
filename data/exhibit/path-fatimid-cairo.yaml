rooms:
- title:
    ar: جوهر
    en: Jawhar
    es: "Jawhar"
    fr: "Jawhar"
    ur: "جوہر"
    tr: "özü"
    id: "esensi"
  body:
    ar: 'أرسل المعز جوهراً إلى مصر، فنزل موضع القاهرة في شعبان سنة 358هـ وأدار سورها الأول من اللبن. {cite:khitat-maqrizi-1998 p.1030} {cite:khitat-maqrizi-1998 p.1067} وأُنفق مال بيت المال على عساكره من سنة 358 إلى 362هـ. {cite:khitat-maqrizi-1998 p.1011}'
    en: 'Al-Mu''izz sent Jawhar to Egypt. He reached the site of Cairo in Sha''ban 358 AH and built its first wall of mud brick. {cite:khitat-maqrizi-1998 p.1030} {cite:khitat-maqrizi-1998 p.1067} The treasure was spent on his armies from 358 to 362 AH. {cite:khitat-maqrizi-1998 p.1011}'
    es: "Al-Mu'izz envió a Jawhar a Egipto. Llegó al emplazamiento de El Cairo en Sha'ban del año 358 de la Hégira y construyó su primera muralla de adobe. {cite:khitat-maqrizi-1998 p.1030} {cite:khitat-maqrizi-1998 p.1067} El tesoro se gastó en sus ejércitos desde el año 358 hasta el 362 de la Hégira. {cite:khitat-maqrizi-1998 p.1011}"
    fr: "Al-Mu'izz envoya Jawhar en Égypte. Il atteignit le site du Caire en Sha'ban 358 AH et en fit construire le premier mur en briques de terre crue. {cite:khitat-maqrizi-1998 p.1030} {cite:khitat-maqrizi-1998 p.1067} Le trésor fut dépensé pour ses armées entre 358 et 362 AH. {cite:khitat-maqrizi-1998 p.1011}"
    ur: "المعز نے جوہر کو مصر بھیجا۔ وہ شعبان 358ھ میں قاہرہ کے مقام پر پہنچے اور اس کی پہلی دیوار مٹی کی اینٹوں سے تعمیر کی۔ {حوالہ:خطت مقریضی-1998ص1030} {حوالہ:خطت مقریزی-1998ص1067} یہ خزانہ 358 سے 362 ہجری تک ان کی فوجوں پر خرچ ہوا۔ {حوالہ: خطت مقریزی-1998 صفحہ 1011}"
    tr: "El-Mu'izz, Cevher'i Mısır'a gönderdi ve Cevher, Hicri 358 yılının Şaban ayında Kahire'nin bulunduğu yere vararak ilk kerpiç surunu inşa etti. Hazinenin kaynakları, Hicri 358 ile 362 yılları arasında ordusunun masraflarını karşılamak için kullanıldı."
    id: "Al-Mu'izz mengutus Jawhar ke Mesir, dan ia tiba di lokasi Kairo pada bulan Sya'ban tahun 358 H dan membangun tembok batu lumpur pertamanya. Dana perbendaharaan dihabiskan untuk pasukannya dari tahun 358 hingga 362 H."
  features:
  - person/jawhar-al-siqilli
  - place/cairo
- title:
    ar: المعز
    en: Al-Mu'izz
    es: "Al-Mu'izz"
    fr: "Al-Mu'izz"
    ur: "المعز"
    tr: "Al-Mu'izz"
    id: "Al-Mu'izz"
  body:
    ar: 'دخل المعز مصر ونزل بقصره في القاهرة، ثم أمر في رمضان سنة 362هـ بكتابة «خير الناس بعد رسول الله» على أماكن المدينة. {cite:khitat-maqrizi-1998 p.2174} وسُمّيت المدينة القاهرة بعدما كانت المنصورية. {cite:khitat-maqrizi-1998 p.1067} وكانت القصور الفاطمية ينزلها الخليفة بحرمه وخواصه. {cite:khitat-maqrizi-1998 p.1001}'
    en: 'Al-Mu''izz entered Egypt and lodged in his palace in Cairo. In Ramadan 362 AH he ordered that "the best of people after the Messenger of God" be written on the places of the city. {cite:khitat-maqrizi-1998 p.2174} The city, once called al-Mansuriyya, was named al-Qahira. {cite:khitat-maqrizi-1998 p.1067} The caliph lived there with his household and his closest people. {cite:khitat-maqrizi-1998 p.1001}'
    es: "Al-Mu'izz entró en Egipto y se alojó en su palacio de El Cairo. En Ramadán del año 362 de la Hégira ordenó que se escribiera en los lugares de la ciudad: «El mejor de los hombres después del Mensajero de Dios». {cite:khitat-maqrizi-1998 p.2174} La ciudad, antes llamada al-Mansuriyya, pasó a llamarse al-Qahira. {cite:khitat-maqrizi-1998 p.1067} El califa vivió allí con su familia y sus allegados. {cite:khitat-maqrizi-1998 p.1001}"
    fr: "Al-Mu'izz entra en Égypte et s'installa dans son palais du Caire. Au mois de Ramadan 362 AH, il ordonna que le nom « les meilleurs des hommes après le Messager de Dieu » soit inscrit sur les murs de la ville. {cite:khitat-maqrizi-1998 p.2174} La ville, autrefois appelée al-Mansuriyya, fut rebaptisée al-Qahira. {cite:khitat-maqrizi-1998 p.1067} Le calife y résidait avec sa famille et ses proches. {cite:khitat-maqrizi-1998 p.1001}"
    ur: "المعز مصر میں داخل ہوا اور قاہرہ میں اپنے محل میں قیام کیا۔ رمضان المبارک 362 ہجری میں آپ نے حکم دیا کہ شہر کے مقامات پر \"رسول اللہ کے بعد بہترین لوگ\" لکھے جائیں۔ {حوالہ: خطت مقریزی-1998 صفحہ 2174} اس شہر کا نام، جسے کبھی المنصوریہ کہا جاتا تھا، کا نام القاہرہ تھا۔ خلیفہ اپنے گھر والوں اور قریبی لوگوں کے ساتھ وہاں رہتا تھا۔ {حوالہ:خطت مقریزی-1998ص1001}"
    tr: "El-Mu'izz Mısır'a girdi ve Kahire'deki sarayında kaldı. Ardından, Hicri 362 yılının Ramazan ayında, şehrin önemli yerlerine \"Allah'ın Resulü'nden sonra insanların en hayırlısı\" ifadesinin yazılmasını emretti. {cite:khitat-maqrizi-1998 s.2174} Şehir, daha önce El-Mansuriye olarak biliniyordu ve Kahire olarak yeniden adlandırıldı. {cite:khitat-maqrizi-1998 s.1067} Fatımi sarayları, halifenin ailesi ve yakın çevresiyle birlikte kaldığı yerlerdi. {cite:khitat-maqrizi-1998 s.1001}"
    id: "Al-Mu'izz memasuki Mesir dan tinggal di istananya di Kairo. Kemudian, pada bulan Ramadan tahun 362 H, beliau memerintahkan agar frasa \"Sebaik-baik manusia setelah Rasulullah\" diukir pada bangunan-bangunan penting di kota tersebut. {cite:khitat-maqrizi-1998 hlm. 2174} Kota itu kemudian berganti nama menjadi Kairo, yang sebelumnya dikenal sebagai Al-Mansuriyya. {cite:khitat-maqrizi-1998 hlm. 1067} Istana-istana Fatimiyah adalah tempat Khalifah tinggal bersama keluarganya dan para sahabat dekatnya. {cite:khitat-maqrizi-1998 hlm. 1001}"
  features:
  - person/al-muizz-li-din-allah
  - polity/fatimid-caliphate
- title:
    ar: الأزهر
    en: Al-Azhar
    es: "Al-Azhar"
    fr: "Al-Azhar"
    ur: "الازہر"
    tr: "El-Azhar"
    id: "Al-Azhar"
  body:
    ar: 'يُقال للجامع «جامع القاهرة» و«الجامع الأزهر»، ومجموع القصرين «القصور الزاهرة». {cite:khitat-maqrizi-1998 p.1032} وكان داعي الدعاة يفرد للنساء مجلساً فيه. {cite:khitat-maqrizi-1998 p.1098} وفي يوم المولد النبوي كان خطيبه يخطب في مجلس الخليفة. {cite:khitat-maqrizi-1998 p.1194}'
    en: 'The mosque was called "Jami'' al-Qahira" and "al-Azhar", and the two palaces together "the Splendid Palaces". {cite:khitat-maqrizi-1998 p.1032} The chief da''i set aside a session for women in it. {cite:khitat-maqrizi-1998 p.1098} On the day of the Prophet''s birth its preacher preached before the caliph. {cite:khitat-maqrizi-1998 p.1194}'
    es: "La mezquita se llamaba \"Jami' al-Qahira\" y \"al-Azhar\", y los dos palacios juntos \"los Palacios Espléndidos\". {cite:khitat-maqrizi-1998 p.1032} El da'i principal reservó una sesión para mujeres en ella. {cite:khitat-maqrizi-1998 p.1098} El día del nacimiento del Profeta, su predicador predicó ante el califa. {cite:khitat-maqrizi-1998 p.1194}"
    fr: "La mosquée était appelée « Jami' al-Qahira » et « al-Azhar », et les deux palais, ensemble, « les Palais Splendides ». {cite:khitat-maqrizi-1998 p.1032} Le grand da'i y organisa une session réservée aux femmes. {cite:khitat-maqrizi-1998 p.1098} Le jour de la naissance du Prophète, son prédicateur prêcha devant le calife. {cite:khitat-maqrizi-1998 p.1194}"
    ur: "مسجد کو \"جامع القاہرہ\" اور \"الازہر\" کہا جاتا تھا، اور دونوں محلات کو ایک ساتھ \"شاندار محل\" کہا جاتا تھا۔ {حوالہ:خطت مقریزی-1998 صفحہ 1032} چیف داعی نے اس میں خواتین کے لیے ایک سیشن مقرر کیا۔ {حوالہ: خطت مقریزی-1998 صفحہ 1098} نبی کی ولادت کے دن اس کے مبلغ نے خلیفہ کے سامنے تبلیغ کی۔ {حوالہ:خطت مقریزی-1998 ص1194}"
    tr: "Camiye \"El-Kahire Camii\" ve \"El-Ezher Camii\" denir ve iki saray birlikte \"El-Kuşür el-Zehire\" (Parlak Saraylar) olarak adlandırılır. {cite:khitat-maqrizi-1998 s.1032} Baş vaiz orada kadınlar için ayrı bir salon tahsis ederdi. {cite:khitat-maqrizi-1998 s.1098} Peygamberin doğum gününde, vaizi halifenin sarayında bir vaaz verirdi. {cite:khitat-maqrizi-1998 s.1194}"
    id: "Masjid tersebut disebut \"Masjid Al-Qahira\" dan \"Masjid Al-Azhar,\" dan kedua istana tersebut secara bersama-sama disebut \"Al-Qusur al-Zahira\" (Istana-Istana yang Bercahaya). {cite:khitat-maqrizi-1998 hlm. 1032} Penceramah utama akan menyediakan aula terpisah untuk wanita di sana. {cite:khitat-maqrizi-1998 hlm. 1098} Pada hari ulang tahun Nabi, penceramah beliau akan menyampaikan khutbah di istana Khalifah. {cite:khitat-maqrizi-1998 hlm. 1194}"
  features:
  - building/al-azhar
  - place/cairo
- title:
    ar: الحاكم
    en: Al-Hakim
    es: "Al-Hakim"
    fr: "Al-Hakim"
    ur: "الحکیم"
    tr: "Yönetici"
    id: "Penguasa"
  body:
    ar: 'فقد الحاكم في شوال سنة 411هـ، وكان عمره ستاً وثلاثين سنة وسبعة أشهر. {cite:khitat-maqrizi-1998 p.2041} واتخذ دار العلم في القاهرة، وفتحت دار الحكمة سنة 395هـ. {cite:khitat-maqrizi-1998 p.1250} ويرجّح المقريزي رواية الرجل الذي أقر بقتله سنة 415هـ. {cite:khitat-maqrizi-1998 p.2042}'
    en: 'Al-Hakim disappeared in Shawwal 411 AH, at the age of thirty-six years and seven months. {cite:khitat-maqrizi-1998 p.2041} He took the Dar al-Ilm in Cairo, and the Dar al-Hikma was opened in 395 AH. {cite:khitat-maqrizi-1998 p.1250} Al-Maqrizi prefers the account of a man who confessed to killing him in 415 AH. {cite:khitat-maqrizi-1998 p.2042}'
    es: "Al-Hakim desapareció en Shawwal del año 411 de la Hégira, a la edad de treinta y seis años y siete meses. {cite:khitat-maqrizi-1998 p.2041} Tomó el Dar al-Ilm en El Cairo, y el Dar al-Hikma se inauguró en el año 395 de la Hégira. {cite:khitat-maqrizi-1998 p.1250} Al-Maqrizi prefiere el relato de un hombre que confesó haberlo matado en el año 415 de la Hégira. {cite:khitat-maqrizi-1998 p.2042}"
    fr: "Al-Hakim disparut en Shawwal 411 AH, à l'âge de trente-six ans et sept mois. {cite:khitat-maqrizi-1998 p.2041} Il prit la direction du Dar al-Ilm au Caire, et le Dar al-Hikma fut ouvert en 395 AH. {cite:khitat-maqrizi-1998 p.1250} Al-Maqrizi privilégie le récit d'un homme qui avoua l'avoir tué en 415 AH. {cite:khitat-maqrizi-1998 p.2042}"
    ur: "الحاکم شوال 411ھ میں چھتیس سال اور سات ماہ کی عمر میں غائب ہو گئے۔ {حوالہ:خطت مقریزی-1998 صفحہ 2041} اس نے دارالعلم کو قاہرہ میں لیا اور دارالحکمہ 395ھ میں کھولا گیا۔ {حوالہ: خطت مقریزی-1998 صفحہ 1250} المقریزی نے ایک ایسے شخص کے بیان کو ترجیح دی جس نے 415 ہجری میں اسے قتل کرنے کا اعتراف کیا۔ {حوالہ:خطت مقریزی-1998ص2042}"
    tr: "Hükümdar, Hicri 411 yılının Şevval ayında, otuz altı yaş ve yedi aylıkken vefat etmiştir. {cite:khitat-maqrizi-1998 s.2041} Kahire'de bir ilim merkezi kurmuş ve Hicri 395 yılında Bilgelik Evi açılmıştır. {cite:khitat-maqrizi-1998 s.1250} El-Makrizi, Hicri 415 yılında onu öldürdüğünü itiraf eden adamın anlatımını desteklemektedir. {cite:khitat-maqrizi-1998 s.2042}"
    id: "Penguasa tersebut wafat pada bulan Syawal tahun 411 H, pada usia tiga puluh enam tahun tujuh bulan. {cite:khitat-maqrizi-1998 hlm. 2041} Beliau mendirikan pusat pembelajaran di Kairo, dan Baitul Hikmah dibuka pada tahun 395 H. {cite:khitat-maqrizi-1998 hlm. 1250} Al-Maqrizi lebih menyukai keterangan dari orang yang mengaku membunuhnya pada tahun 415 H. {cite:khitat-maqrizi-1998 hlm. 2042}"
  features:
  - person/al-hakim-bi-amr-allah
  - place/cairo
- title:
    ar: الأيوبيون
    en: The Ayyubids
    es: "Los ayubíes"
    fr: "Les Ayyoubides"
    ur: "ایوبیوں"
    tr: "Eyyubiler"
    id: "Dinasti Ayyubiyah"
  body:
    ar: 'دخل صلاح الدين مصر، فانقضت الدولة الفاطمية بدخول الغز واستيلاء صلاح الدين يوسف بن أيوب. {cite:khitat-maqrizi-1998 p.290} وانتقل الملك الكامل من القاهرة إلى قلعة الجبل، فصارت القاهرة مدينة سكنى. {cite:khitat-maqrizi-1998 p.1001} وانتهت دولة بني أيوب في مصر سنة 648هـ بعد إحدى وثمانين سنة وسبعة عشر يوماً. {cite:khitat-maqrizi-1998 p.1912}'
    en: 'Saladin took Egypt and the Fatimid state ended with the Ghuzz and the seizure of the kingdom by Saladin Yusuf ibn Ayyub. {cite:khitat-maqrizi-1998 p.290} Al-Kamil moved from Cairo to the Citadel, and the city became a city of residence. {cite:khitat-maqrizi-1998 p.1001} The Ayyubid rule in Egypt ended in 648 AH, after eighty-one years and seventeen days. {cite:khitat-maqrizi-1998 p.1912}'
    es: "Saladino tomó Egipto y el estado fatimí terminó con el Ghuzz y la toma del reino por Saladino Yusuf ibn Ayyub. {cite:khitat-maqrizi-1998 p.290} Al-Kamil se trasladó de El Cairo a la Ciudadela, y la ciudad se convirtió en una ciudad de residencia. {cite:khitat-maqrizi-1998 p.1001} El dominio ayubí en Egipto terminó en el año 648 de la Hégira, después de ochenta y un años y diecisiete días. {cite:khitat-maqrizi-1998 p.1912}"
    fr: "Saladin conquit l'Égypte et l'État fatimide prit fin avec la bataille de Ghuzz et la conquête du royaume par Saladin Yusuf ibn Ayyub. {cite:khitat-maqrizi-1998 p.290} Al-Kamil quitta le Caire pour la Citadelle, et la ville devint une résidence. {cite:khitat-maqrizi-1998 p.1001} Le règne ayyoubide en Égypte prit fin en 648 AH, après quatre-vingt-un ans et dix-sept jours. {cite:khitat-maqrizi-1998 p.1912}"
    ur: "صلاح الدین نے مصر پر قبضہ کر لیا اور فاطمی ریاست کا خاتمہ غزوہ اور صلاح الدین یوسف ابن ایوب کی سلطنت پر قبضے کے ساتھ ہوا۔ الکامل قاہرہ سے قلعہ منتقل ہوا، اور یہ شہر رہائش کا شہر بن گیا۔ مصر میں ایوبی حکومت کا خاتمہ اکیاسی سال سترہ دن کے بعد 648ھ میں ہوا۔ {حوالہ:خطت مقریزی-1998 ص1912}"
    tr: "Selahaddin Mısır'a girdi ve Guzz'un gelişi ve Selahaddin Yusuf ibn Eyyub'un fethiyle Fatımi Halifeliği sona erdi. {cite:khitat-maqrizi-1998 s.290} El-Malik el-Kamil Kahire'den Kale'ye taşındı ve Kahire yerleşim yeri haline geldi. {cite:khitat-maqrizi-1998 s.1001} Mısır'daki Eyyubi hanedanlığı seksen bir yıl on yedi gün sonra, 648 Hicri yılında sona erdi. {cite:khitat-maqrizi-1998 s.1912}"
    id: "Saladin memasuki Mesir, dan Kekhalifahan Fatimiyah berakhir dengan kedatangan Ghuzz dan penaklukan oleh Saladin Yusuf ibn Ayyub. {cite:khitat-maqrizi-1998 p.290} Al-Malik al-Kamil pindah dari Kairo ke Benteng, dan Kairo menjadi kota tempat tinggal. {cite:khitat-maqrizi-1998 p.1001} Dinasti Ayyubiyah di Mesir berakhir pada tahun 648 H setelah delapan puluh satu tahun dan tujuh belas hari. {cite:khitat-maqrizi-1998 p.1912}"
