id: exhibit/pathway-g11-hrt3m-islamic-art-architecture
class: exhibit
kind: lesson
label:
  ar: "الفن والعمارة الإسلامية: الخط والزخرفة والمسجد"
  en: "Islamic art and architecture: calligraphy, pattern and the mosque"
  ur: "اسلامی فن اور فنِ تعمیر: خطاطی، نقش اور مسجد"
summary:
  ar: "مسار لمقرر HRT3M عن تعبير دين عن نفسه في الثقافة: الخط العربي والخط الإسلامي، والأرابيسك والنجوم المتداخلة، وأجزاء المسجد، ومبانٍ من القدس وقرطبة وغرناطة وإسطنبول، وآلة علمية مزخرفة."
  en: "An HRT3M pathway on how a religion expresses itself in culture: the Arabic script and Islamic calligraphy, the arabesque and interlacing stars, the parts of a mosque, buildings from Jerusalem, Cordoba, Granada and Istanbul, and an ornamented scientific instrument."
  ur: "HRT3M کا ایک راستہ اس پر کہ ایک مذہب ثقافت میں اپنا اظہار کیسے کرتا ہے: عربی رسم الخط اور اسلامی خطاطی، عربیسک اور گندھے ہوئے ستارے، مسجد کے حصے، یروشلم، قرطبہ، غرناطہ اور استنبول کی عمارتیں، اور ایک آراستہ سائنسی آلہ۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب كيف تُعبَّر العقائد الإسلامية عن نفسها في الفن والعمارة، ولماذا غلب الخط والهندسة على التصوير.
  en: Students analyse how Islamic beliefs are expressed in art and architecture, and why calligraphy and geometry prevailed over figurative images.
  ur: طلبہ تجزیہ کریں کہ اسلامی عقائد فن اور فنِ تعمیر میں اپنا اظہار کیسے کرتے ہیں، اور خطاطی اور جیومیٹری تصویری فن پر کیوں غالب رہی۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: HRT3M
  course_title:
    ar: "أديان العالم وتقاليد الاعتقاد: منظورات وقضايا وتحدّيات، الصف 11، إعداد جامعي/كلّي"
    en: "World Religions and Belief Traditions: Perspectives, Issues, and Challenges, Grade 11, University/College Preparation"
    ur: "دنیا کے مذاہب اور عقائد کی روایات: نقطۂ نظر، مسائل اور چیلنج، جماعت 11، یونیورسٹی/کالج تیاری"
  grade: "11"
  strand: F
  strand_title:
    ar: السياقات الثقافية والاجتماعية والسياسية
    en: Cultural, Social, and Political Contexts
    ur: ثقافتی، معاشرتی اور سیاسی سیاق
  expectations:
    - F1
  expectation:
    ar: يبيّن الدرس كيف يُعبَّر الإسلام عن نفسه في ثقافة شعوبه، في الخط والزخرفة والعمارة، وكيف تتغيّر هذه التعبيرات من إقليم إلى آخر مع ثبات أصول مشتركة، ويطلب من الطالب أن يفسّر اختيارًا فنيًا بعقيدة أو ممارسة.
    en: The lesson shows how Islam expresses itself in the culture of its peoples, in calligraphy, ornament and architecture, and how these expressions vary from region to region while sharing common roots, and asks students to explain an artistic choice by a belief or a practice.
    ur: یہ سبق دکھاتا ہے کہ اسلام اپنی اقوام کی ثقافت میں، خطاطی، آرائش اور فنِ تعمیر میں، اپنا اظہار کیسے کرتا ہے، اور یہ اظہار مشترک جڑوں کے ساتھ خطے سے خطے میں کیسے بدلتا ہے، اور طلبہ سے کہتا ہے کہ ایک فنی انتخاب کی وجہ کسی عقیدے یا عمل سے بیان کریں۔
  document: "The Ontario Curriculum, Grades 9 to 12: Social Sciences and Humanities, 2013"
  verified: 2026-10-23
rooms:
  - title:
      ar: الخط العربي
      en: The Arabic script
      ur: عربی رسم الخط
    body:
      ar: كيف وُلد الخط الذي كُتب به القرآن، وما تقوله المصادر عن أوّله.
      en: How the script in which the Qur'an was written came to be, and what the sources say of its beginnings.
      ur: وہ رسم الخط جس میں قرآن لکھا گیا کیسے وجود میں آیا، اور اس کی ابتدا کے بارے میں ماخذ کیا کہتے ہیں۔
    features:
      - concept/khatt-al-arabi
  - title:
      ar: الخط الإسلامي
      en: Islamic calligraphy
      ur: اسلامی خطاطی
    body:
      ar: "الكوفي والنسخ والثلث: الكتابة بوصفها أشرف الفنون."
      en: "Kufic, naskh and thuluth: writing as the noblest of the arts."
      ur: "کوفی، نسخ اور ثلث: لکھائی سب سے معزز فن۔"
    features:
      - concept/islamic-calligraphy
  - title:
      ar: الأرابيسك
      en: The arabesque
      ur: عربیسک
    body:
      ar: "النبات الذي لا ينتهي: زخرفة تملأ السطح بلا صورة."
      en: "The endless plant: ornament that fills a surface without an image."
      ur: "نہ ختم ہونے والی بیل: آرائش جو سطح کو بغیر تصویر بھر دیتی ہے۔"
    features:
      - concept/arabesque
  - title:
      ar: الجريه والنجوم
      en: Girih and the stars
      ur: گرہ اور ستارے
    body:
      ar: "هندسة الأشرطة المتداخلة: الرياضيات في الجدار."
      en: "The geometry of interlacing straps: mathematics on the wall."
      ur: "گندھی ہوئی پٹیوں کی جیومیٹری: دیوار پر ریاضی۔"
    features:
      - concept/girih
  - title:
      ar: المسجد وأجزاؤه
      en: The mosque and its parts
      ur: مسجد اور اس کے حصے
    body:
      ar: "المحراب والمنبر والمنارة والصحن: الوظيفة قبل الشكل."
      en: "Mihrab, minbar, minaret and courtyard: function before form."
      ur: "محراب، منبر، مینار اور صحن: شکل سے پہلے کام۔"
    features:
      - concept/masjid-umum
  - title:
      ar: قبة الصخرة
      en: The Dome of the Rock
      ur: قبۃ الصخرہ
    body:
      ar: "أقدم مبنى إسلامي قائم بزخارفه: القدس سنة 691."
      en: "The oldest standing Islamic building with its ornament: Jerusalem, 691."
      ur: "اپنی آرائش کے ساتھ سب سے قدیم قائم اسلامی عمارت: یروشلم، 691۔"
    features:
      - building/dome-of-the-rock
  - title:
      ar: جامع قرطبة والحمراء
      en: The Great Mosque of Cordoba and the Alhambra
      ur: قرطبہ کی جامع مسجد اور الحمرا
    body:
      ar: "الأقواس والخط على الجدران: الأندلس في مبنيين."
      en: "Arches and calligraphy on the walls: al-Andalus in two buildings."
      ur: "محرابیں اور دیواروں پر خطاطی: دو عمارتوں میں اندلس۔"
    features:
      - building/great-mosque-cordoba
      - building/alhambra
  - title:
      ar: السليمانية
      en: The Suleymaniye
      ur: سلیمانیہ
    body:
      ar: "القبة العثمانية ومعمارها سنان: الضوء بوصفه مادة."
      en: "The Ottoman dome and its architect Sinan: light as a material."
      ur: "عثمانی گنبد اور اس کا معمار سنان: روشنی بطور مادہ۔"
    features:
      - building/sulaymaniyya-mosque
  - title:
      ar: أسطرلاب مزخرف
      en: An ornamented astrolabe
      ur: ایک آراستہ اسطرلاب
    body:
      ar: "آلة علمية من اليمن تحمل الخط والزخرفة: العلم والفن في يد واحدة."
      en: "A scientific instrument from Yemen bearing script and ornament: science and art in one hand."
      ur: "یمن کا ایک سائنسی آلہ جس پر خط اور آرائش ہے: علم اور فن ایک ہاتھ میں۔"
    features:
      - object/astrolabe-umar-ibn-yusuf
outcomes:
  - text:
      ar: أسمّي ثلاثة عناصر من الفن الإسلامي وأشرح أصلها الديني.
      en: I can name three elements of Islamic art and explain their religious root.
      ur: میں اسلامی فن کے تین عناصر بتا سکتا ہوں اور ان کی مذہبی جڑ بیان کر سکتا ہوں۔
    steps:
      - 1
      - 2
      - 3
  - text:
      ar: أصف أجزاء المسجد ووظيفة كل جزء.
      en: I can describe the parts of a mosque and the function of each.
      ur: میں مسجد کے حصے اور ہر حصے کا کام بیان کر سکتا ہوں۔
    steps:
      - 4
  - text:
      ar: أقارن مبنيين من إقليمين وأبيّن المشترك والمختلف.
      en: I can compare two buildings from two regions and show what is shared and what differs.
      ur: میں دو خطوں کی دو عمارتوں کا موازنہ کر سکتا ہوں اور مشترک اور مختلف دکھا سکتا ہوں۔
    steps:
      - 5
      - 6
      - 7
worksheet:
  - prompt:
      ar: لماذا صار الخط «أشرف الفنون» عند المسلمين؟ اربط الجواب بالقرآن.
      en: Why did calligraphy become 'the noblest of the arts' for Muslims? Tie the answer to the Qur'an.
      ur: خطاطی مسلمانوں کے نزدیک «سب سے معزز فن» کیوں بنی؟ جواب کو قرآن سے جوڑیں۔
    steps:
      - 0
      - 1
  - prompt:
      ar: ارسم نجمة ثمانية من شريطين متداخلين. ما العلاقة بين هذا الشكل والرياضيات؟
      en: Draw an eight-pointed star from two interlacing straps. How does this shape relate to mathematics?
      ur: دو گندھی پٹیوں سے آٹھ کونوں کا ستارہ بنائیں۔ اس شکل کا ریاضی سے کیا تعلق ہے؟
    steps:
      - 3
  - prompt:
      ar: سمِّ أربعة أجزاء من المسجد واذكر وظيفة كل جزء.
      en: Name four parts of a mosque and give the function of each.
      ur: مسجد کے چار حصوں کے نام لیں اور ہر ایک کا کام لکھیں۔
    steps:
      - 4
  - prompt:
      ar: "قارن قبة الصخرة بالسليمانية: ماذا تغيّر في تسعة قرون وماذا بقي؟"
      en: "Compare the Dome of the Rock with the Suleymaniye: what changed in nine centuries and what stayed?"
      ur: "قبۃ الصخرہ کا سلیمانیہ سے موازنہ کریں: نو صدیوں میں کیا بدلا اور کیا رہا؟"
    steps:
      - 5
      - 7
  - prompt:
      ar: لماذا يحمل أسطرلاب علمي زخرفة وخطًا؟ ماذا يقول ذلك عن العلاقة بين العلم والدين والفن؟
      en: Why does a scientific astrolabe carry ornament and script? What does that say about science, religion and art?
      ur: ایک سائنسی اسطرلاب پر آرائش اور خط کیوں ہے؟ یہ علم، مذہب اور فن کے بارے میں کیا کہتا ہے؟
    steps:
      - 8
quiz:
  - q:
      ar: لماذا صار الخط «أشرف الفنون» عند المسلمين؟
      en: Why did calligraphy become 'the noblest of the arts' for Muslims?
      ur: خطاطی مسلمانوں کے نزدیک «سب سے معزز فن» کیوں بنی؟
    options:
      - ar: لأنه أسهل الفنون
        en: It is the easiest art
        ur: یہ سب سے آسان فن ہے
      - ar: لارتباطه بكتابة القرآن
        en: It is tied to writing the Qur'an
        ur: یہ قرآن لکھنے سے جڑی ہے
      - ar: لأن الملوك أمروا به
        en: Kings ordered it
        ur: بادشاہوں نے حکم دیا
      - ar: لأنه جاء من الصين
        en: It came from China
        ur: یہ چین سے آئی
    answer: 1
    teaches: 1
  - q:
      ar: ما الأرابيسك؟
      en: What is the arabesque?
      ur: عربیسک کیا ہے؟
    options:
      - ar: نوع من الخط
        en: A style of script
        ur: خط کی ایک قسم
      - ar: آلة موسيقية
        en: A musical instrument
        ur: ایک ساز
      - ar: زخرفة نباتية متواصلة تملأ السطح
        en: A continuous plant ornament that fills a surface
        ur: لگاتار بیل بوٹوں کی آرائش جو سطح بھر دیتی ہے
      - ar: قبة من الحجر
        en: A stone dome
        ur: پتھر کا گنبد
    answer: 2
    teaches: 2
  - q:
      ar: ما المحراب في المسجد؟
      en: What is the mihrab in a mosque?
      ur: مسجد میں محراب کیا ہے؟
    options:
      - ar: منبر الخطيب
        en: The preacher's pulpit
        ur: خطیب کا منبر
      - ar: حوض الوضوء
        en: The ablution basin
        ur: وضو کا حوض
      - ar: المنارة
        en: The minaret
        ur: مینار
      - ar: تجويف في الجدار يشير إلى اتجاه الصلاة
        en: A niche in the wall marking the direction of prayer
        ur: دیوار میں طاق جو نماز کی سمت بتاتا ہے
    answer: 3
    teaches: 4
  - q:
      ar: أين تقع قبة الصخرة ومتى بُنيت؟
      en: Where is the Dome of the Rock and when was it built?
      ur: قبۃ الصخرہ کہاں ہے اور کب بنی؟
    options:
      - ar: في القدس، في القرن السابع
        en: In Jerusalem, in the seventh century
        ur: یروشلم میں، ساتویں صدی میں
      - ar: في مكة، في القرن العاشر
        en: In Mecca, in the tenth century
        ur: مکہ میں، دسویں صدی میں
      - ar: في إسطنبول، في القرن السادس عشر
        en: In Istanbul, in the sixteenth century
        ur: استنبول میں، سولہویں صدی میں
      - ar: في قرطبة، في القرن الثامن
        en: In Cordoba, in the eighth century
        ur: قرطبہ میں، آٹھویں صدی میں
    answer: 0
    teaches: 5
  - q:
      ar: من معمار جامع السليمانية؟
      en: Who was the architect of the Suleymaniye Mosque?
      ur: سلیمانیہ مسجد کا معمار کون تھا؟
    options:
      - ar: ابن مقلة
        en: Ibn Muqla
        ur: ابن مقلہ
      - ar: زرياب
        en: Ziryab
        ur: زریاب
      - ar: سنان
        en: Sinan
        ur: سنان
      - ar: الخوارزمي
        en: Al-Khwarizmi
        ur: خوارزمی
    answer: 2
    teaches: 7
