rooms:
- title:
    ar: "سمية بنت خياط"
    en: "Sumayya bint Khayyat"
    ur: "سمیّہ بنت خیاط"
  body:
    ar: "أول شهيدة في الإسلام: احتملت العذاب في مكة وأبت أن تكفر، فكانت أول من بذل روحه على الطريق."
    en: "The first martyr of Islam: she bore torture in Mecca and refused to renounce her faith, the first to give her life on the path."
    ur: "اسلام کی پہلی شہید: مکہ میں تشدد برداشت کیا اور کفر سے انکار کر دیا، راہ میں جان دینے والی پہلی شخصیت۔"
  features:
  - person/sumayya-bint-khayyat
  - place/mecca
- title:
    ar: "مصعب بن عمير"
    en: "Mus'ab ibn Umayr"
    ur: "مصعب بن عمیر"
  body:
    ar: "ترك نعيم مكة سفيرًا للإسلام إلى يثرب، ثم حمل اللواء يوم أحد حتى قُتل والراية في يده."
    en: "He left Mecca's luxury as Islam's envoy to Yathrib, then carried the banner at Uhud until he was killed with the flag in his hand."
    ur: "مکہ کی آسائش چھوڑ کر یثرب میں اسلام کے سفیر بنے، پھر احد کے دن پرچم تھامے شہید ہوئے۔"
  features:
  - person/musab-ibn-umayr
  - event/battle-of-uhud
- title:
    ar: "نسيبة بنت كعب"
    en: "Nusayba bint Ka'b"
    ur: "نصیبہ بنت کعب"
  body:
    ar: "أم عمارة: جاءت تسقي الجرحى فقاتلت دون النبي يوم أحد حتى رُميت بالسهام والسيوف."
    en: "Umm Umara: she came to give water to the wounded and ended up fighting in front of the Prophet at Uhud until arrows and swords struck her."
    ur: "ام عمارة: زخمیوں کو پانی پلانے آئیں اور احد کے دن نبی کے آگے لڑتی رہیں یہاں تک کہ تیر اور تلواریں انہیں لگیں۔"
  features:
  - person/nusayba-bint-kab
  - event/battle-of-uhud
- title:
    ar: "زيد بن حارثة"
    en: "Zayd ibn Haritha"
    ur: "زید بن حارثہ"
  body:
    ar: "آثر النبيَّ على أبيه يوم خُيّر، وقاد جيش مؤتة أميرًا فاستشهد والراية بيده."
    en: "He chose the Prophet over his own father when given the choice, and led the army at Mu'ta until he fell holding the banner."
    ur: "اختیار ملنے پر اپنے باپ پر نبی کو چنا، اور مؤتہ میں فوج کی قیادت پرچم تھامے شہادت تک کرتے رہے۔"
  features:
  - person/zayd-ibn-haritha
  - event/battle-of-mutah
