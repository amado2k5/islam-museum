    en: "Sumayya bint Khayyat"
    ur: "سمیّہ بنت خیاط"
    es: "Sumayya bint Khayyat"
    fr: "Sumayya bint Khayyat"
  body:
    ar: "أول شهيدة في الإسلام: احتملت العذاب في مكة وأبت أن تكفر، فكانت أول من بذل روحه على الطريق."
    en: "The first martyr of Islam: she bore torture in Mecca and refused to renounce her faith, the first to give her life on the path."
    ur: "اسلام کی پہلی شہید: مکہ میں تشدد برداشت کیا اور کفر سے انکار کر دیا، راہ میں جان دینے والی پہلی شخصیت۔"
    es: "La primera mártir del Islam: soportó torturas en La Meca y se negó a renunciar a su fe, la primera en dar su vida en el camino."
    fr: "La première martyre de l'islam: elle a enduré la torture à La Mecque et a refusé d'abjurer sa foi, la première à donner sa vie pour la cause."
  features:
  - person/sumayya-bint-khayyat
  - place/mecca
- title:
    ar: "مصعب بن عمير"
    en: "Mus'ab ibn Umayr"
    ur: "مصعب بن عمیر"
    es: "Mus'ab ibn Umayr"
    fr: "Mus'ab ibn Umayr"
  body:
    ar: "ترك نعيم مكة سفيرًا للإسلام إلى يثرب، ثم حمل اللواء يوم أحد حتى قُتل والراية في يده."
    en: "He left Mecca's luxury as Islam's envoy to Yathrib, then carried the banner at Uhud until he was killed with the flag in his hand."
    ur: "مکہ کی آسائش چھوڑ کر یثرب میں اسلام کے سفیر بنے، پھر احد کے دن پرچم تھامے شہید ہوئے۔"
    es: "Abandonó el lujo de La Meca como enviado del Islam a Yathrib, y luego portó el estandarte en Uhud hasta que fue asesinado con la bandera en la mano."
    fr: "Il quitta le luxe de La Mecque en tant qu'envoyé de l'Islam à Yathrib, puis porta l'étendard à Uhud jusqu'à ce qu'il soit tué avec le drapeau à la main."
  features:
  - person/musab-ibn-umayr
  - event/battle-of-uhud
- title:
    ar: "نسيبة بنت كعب"
    en: "Nusayba bint Ka'b"
    ur: "نصیبہ بنت کعب"
    es: "Nusayba bint Ka'b"
    fr: "Nusayba bint Ka'b"
  body:
    ar: "أم عمارة: جاءت تسقي الجرحى فقاتلت دون النبي يوم أحد حتى رُميت بالسهام والسيوف."
    en: "Umm Umara: she came to give water to the wounded and ended up fighting in front of the Prophet at Uhud until arrows and swords struck her."
    ur: "ام عمارة: زخمیوں کو پانی پلانے آئیں اور احد کے دن نبی کے آگے لڑتی رہیں یہاں تک کہ تیر اور تلواریں انہیں لگیں۔"
    es: "Umm Umara: vino a dar agua a los heridos y acabó luchando delante del Profeta en Uhud hasta que flechas y espadas la alcanzaron."
    fr: "Umm Umara: elle était venue donner de l'eau aux blessés et s'est retrouvée à combattre devant le Prophète à Uhud jusqu'à ce qu'elle soit touchée par des flèches et des épées."
  features:
  - person/nusayba-bint-kab
  - event/battle-of-uhud
- title:
    ar: "زيد بن حارثة"
    en: "Zayd ibn Haritha"
    ur: "زید بن حارثہ"
    es: "Zayd ibn Haritha"
    fr: "Zayd ibn Haritha"
  body:
    ar: "آثر النبيَّ على أبيه يوم خُيّر، وقاد جيش مؤتة أميرًا فاستشهد والراية بيده."
    en: "He chose the Prophet over his own father when given the choice, and led the army at Mu'ta until he fell holding the banner."
    ur: "اختیار ملنے پر اپنے باپ پر نبی کو چنا، اور مؤتہ میں فوج کی قیادت پرچم تھامے شہادت تک کرتے رہے۔"
    es: "Cuando tuvo la oportunidad, eligió al Profeta por encima de su propio padre y dirigió al ejército en Mu'ta hasta que cayó sosteniendo el estandarte."
    fr: "Lorsqu'il eut le choix, il choisit le Prophète plutôt que son propre père et mena l'armée à Mu'ta jusqu'à sa mort, brandissant l'étendard."
