summary:
  ar: " 'مسار فيمن بذلوا أنفسهم وراحتهم ودنياهم في سبيل غيرهم: سمية أول شهيدة في الإسلام، ومصعب حامل اللواء، ونسيبة درع أحد، وزيد الذي قاد الجيش حتى الرماح.'"
  en: " 'A trail of those who gave themselves and their ease for others: Sumayya the first martyr of Islam, Musab the flag-bearer, Nusayba the shield of Uhud, and Zayd who led until the spears found him.'"
  ur: " 'ان لوگوں کا سفر جنھوں نے دوسروں کے لیے اپنی جانیں اور آسائشیں قربان کیں: سمیّہ پہلی شہید، مصعب پرچم بردار، نسیبہ احد کی ڈھال، اور زید جو نیزوں تک قیادت کرتے رہے۔'"
  es: "«Una estela de aquellos que se entregaron y compartieron su bienestar por los demás: Sumayya, la primera mártir del Islam; Musab, el abanderado; Nusayba, el escudo de Uhud; y Zayd, quien lideró hasta que las lanzas lo alcanzaron»."
  fr: "« La trace de ceux qui se sont donnés corps et âme aux autres: Sumayya, le premier martyr de l'Islam, Musab, le porte-étendard, Nusayba, le bouclier d'Uhud, et Zayd, qui a mené jusqu'à ce que les lances le trouvent. »"
