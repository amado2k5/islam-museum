summary:
  ar: 'مسار في عروس القرآن: الرحمن علّم القرآن، وفبأي آلاء ربكما تكذبان، والجنة والحور — سورة النعم.'
  en: A trail through the bride of the Qur'an.
  es: "Un recorrido por la novia del Corán."
  fr: "Un sentier à travers la mariée du Coran."
  ur: "قرآن کی دلہن کے ذریعے ایک پگڈنڈی۔"
  tr: "Kur'an'ın Gelini'nde bir yol: Rahman olan Allah Kur'an'ı öğretti. Rabbinizin nimetlerinden hangisini inkar edersiniz? Cennet ve huriler... — Na'am Suresi."
  id: "Jalan dalam Surah Al-Na'am: Allah Yang Maha Penyayang mengajarkan Al-Qur'an, dan nikmat Tuhanmu yang manakah yang kamu dustakan, dan surga serta bidadari-bidadari? — Surah Al-Na'am."
