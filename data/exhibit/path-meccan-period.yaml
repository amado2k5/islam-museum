label:
  ar: 'العهد المكي: من الغار إلى الهجرة'
  en: "The Meccan Period: From the Cave to the Hijra"
  es: "El período de La Meca: de la cueva a la Hégira"
  fr: "La période mecquoise: de la grotte à l'Hégire"
  ur: "مکی دور: غارِ ثور سے ہجرت تک"
  tr: "Mekke Dönemi: Mağaradan Hicrete"
  id: "Era Mekah: Dari Gua hingga Hijrah"
summary:
  ar: مسارٌ زمني عبر سنوات الدعوة بمكة، من نزول الوحي في غار حراء إلى الهجرة، في اثني عشر حدثًا مرتّبة كما تسلسلت.
  en: "A chronological trail through the years of the call in Mecca, from the descent of the revelation in the cave of Hira to the Hijra, in twelve events ordered as they unfolded."
  es: "Un recorrido cronológico a través de los años de la llamada en La Meca, desde el descenso de la revelación en la cueva de Hira hasta la Hégira, en doce acontecimientos ordenados según su desarrollo."
  fr: "Un parcours chronologique à travers les années de l'appel à La Mecque, depuis la descente de la révélation dans la grotte de Hira jusqu'à l'Hégire, en douze événements ordonnés selon leur déroulement."
  ur: "مکہ میں اذان کے سالوں کا ایک تاریخی راستہ، غار حرا میں نزول وحی سے لے کر ہجرت تک، بارہ واقعات میں ترتیب دیا گیا جیسے وہ منظر عام پر آئے۔"
  tr: "Hira mağarasındaki vahiyden hicrete kadar Mekke'de İslam'a davetin yıllarını, meydana geliş sırasına göre düzenlenmiş on iki olay halinde gösteren bir zaman çizelgesi."
  id: "Garis waktu melalui tahun-tahun seruan kepada Islam di Mekah, dari wahyu di gua Hira hingga hijrah, dalam dua belas peristiwa yang disusun sesuai urutan kejadiannya."
