  en: A trail through the last power before the Mongols.
  es: "Un recorrido por el último poder antes de los mongoles."
  fr: "Un sentier à travers la dernière puissance avant les Mongols."
  ur: "منگولوں سے پہلے آخری طاقت کے ذریعے ایک پگڈنڈی."
  tr: "Moğollardan önceki son gücün gidişatı: Harezm Şah İran ve Horasan'a sahipken, Celaleddin Cengiz Han'a karşı direniyor - yirmi yıllık bir imparatorluk."
  id: "Sebuah perjalanan kekuasaan terakhir sebelum Mongol: Khwarazm Shah menguasai Iran dan Khorasan, dan Jalal ad-Din melawan Genghis — sebuah kekaisaran yang berkuasa selama dua puluh tahun."
