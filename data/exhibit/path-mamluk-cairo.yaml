rooms:
- title:
    ar: بيبرس
    en: Baybars
  body:
    ar: 'أنشأ الظاهر بيبرس المدرسة الظاهرية عند باب الذهب من القصر الفاطمي. {cite:khitat-maqrizi-1998 p.1032} وخرج مع قلاوون إلى الشام بعد قتل أقطاي. {cite:khitat-maqrizi-1998 p.1081} وتسلطن ولقب بالملك الظاهر بعد قتل قطز. {cite:tarikh-khulafa-minhaj-1434 p.720}'
    en: 'Al-Zahir Baybars founded the al-Zahiriyya madrasa at Bab al-Dhahab of the Fatimid palace. {cite:khitat-maqrizi-1998 p.1032} He left Cairo with Qalawun for Syria after Aqtay was killed. {cite:khitat-maqrizi-1998 p.1081} He took the sultanate after Qutuz was killed, under the title al-Malik al-Zahir. {cite:tarikh-khulafa-minhaj-1434 p.720}'
  features:
  - person/baybars
  - place/cairo
- title:
    ar: قلاوون
    en: Qalawun
  body:
    ar: 'بُني المارستان المنصوري على موضع القصر الغربي الصغير، وفي داخل المجمع القبة المنصورية. {cite:khitat-maqrizi-1998 p.1061} وشرع المنصور قلاوون في بناء المارستان والمدرسة والتربة، وتولى عمارتها سنجر الشجاعي. {cite:khitat-maqrizi-1998 p.1249} والمدرسة الناصرية ملاصقة لمئذنة القبة المنصورية. {cite:khitat-maqrizi-1998 p.1062}'
    en: 'The Mansuri hospital was built on the site of the small western palace, and inside the complex stands the Mansuri dome. {cite:khitat-maqrizi-1998 p.1061} Qalawun began the hospital, the madrasa and the mausoleum, and Sanjar al-Shuja''i oversaw the works. {cite:khitat-maqrizi-1998 p.1249} The al-Nasiriyya madrasa stands beside the minaret of the Mansuri dome. {cite:khitat-maqrizi-1998 p.1062}'
  features:
  - person/qalawun
  - place/cairo
- title:
    ar: الناصر
    en: Al-Nasir
  body:
    ar: 'كان الملك الناصر محمد بن قلاوون سلطان مصر سنة 702هـ، والقائم بتدبير الدولة بيبرس الجاشنكير. {cite:khitat-maqrizi-1998 p.240} وعمّر الجسر على بحر النيل ليكسر قوة التيار عن البر. {cite:khitat-maqrizi-1998 p.241} وأنشأ الجامع الجديد الناصري ظاهر مصر. {cite:khitat-maqrizi-1998 p.831}'
    en: 'Al-Malik al-Nasir Muhammad ibn Qalawun was sultan in Egypt in 702 AH, with Baybars al-Jashnakir managing the state. {cite:khitat-maqrizi-1998 p.240} He built a bridge over the Nile to break the force of the current from the bank. {cite:khitat-maqrizi-1998 p.241} He founded the al-Jami'' al-Jadid al-Nasiri outside Misr. {cite:khitat-maqrizi-1998 p.831}'
  features:
  - person/al-nasir-muhammad-ibn-qalawun
  - place/cairo
- title:
    ar: السلطان حسن
    en: Sultan Hasan
  body:
    ar: 'بدأ السلطان حسن عمارة مسجده ومدرسته سنة 757هـ. {cite:khitat-maqrizi-1998 p.2111} واستمرت العمارة ثلاث سنين لا تنقطع، وأُرصد لها عشرون ألف درهم كل يوم. {cite:khitat-maqrizi-1998 p.2111} ويقول المقريزي إنه لا يُعرف في بلاد الإسلام معبد يحكيه. {cite:khitat-maqrizi-1998 p.2111}'
    en: 'Sultan Hasan began building his mosque and madrasa in 757 AH. {cite:khitat-maqrizi-1998 p.2111} The building went on for three years without a break, with twenty thousand dirhams set aside each day. {cite:khitat-maqrizi-1998 p.2111} Al-Maqrizi says that no mosque of the Muslims is known to resemble it. {cite:khitat-maqrizi-1998 p.2111}'
  features:
  - building/masjid-sultan-hasan
  - place/cairo
- title:
    ar: المدينة
    en: The city
  body:
    ar: 'نزل جوهر موضع القاهرة في شعبان سنة 358هـ. {cite:khitat-maqrizi-1998 p.1030} وكانت القاهرة دار خلافة ينزلها الخليفة بحرمه وخواصه. {cite:khitat-maqrizi-1998 p.1001} ثم صارت مدينة سكنى بعدما كانت حصناً يُعتقل فيه. {cite:khitat-maqrizi-1998 p.1001}'
    en: 'Jawhar settled on the site of Cairo in Sha''ban 358 AH. {cite:khitat-maqrizi-1998 p.1030} Cairo was a caliphal residence where the caliph lived with his household and his closest people. {cite:khitat-maqrizi-1998 p.1001} It then became a city of residence, after it had been a fortress in which one was held. {cite:khitat-maqrizi-1998 p.1001}'
  features:
  - place/cairo
  - building/al-azhar
