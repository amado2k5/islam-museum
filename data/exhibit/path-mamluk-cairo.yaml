rooms:
- title:
    ar: بيبرس
    en: Baybars
    es: "Barras de bahía"
    fr: "Baybars"
    ur: "بیبرس"
    tr: "Baybarlar"
    id: "Baybars"
  body:
    ar: 'أنشأ الظاهر بيبرس المدرسة الظاهرية عند باب الذهب من القصر الفاطمي. {cite:khitat-maqrizi-1998 p.1032} وخرج مع قلاوون إلى الشام بعد قتل أقطاي. {cite:khitat-maqrizi-1998 p.1081} وتسلطن ولقب بالملك الظاهر بعد قتل قطز. {cite:tarikh-khulafa-minhaj-1434 p.720}'
    en: 'Al-Zahir Baybars founded the al-Zahiriyya madrasa at Bab al-Dhahab of the Fatimid palace. {cite:khitat-maqrizi-1998 p.1032} He left Cairo with Qalawun for Syria after Aqtay was killed. {cite:khitat-maqrizi-1998 p.1081} He took the sultanate after Qutuz was killed, under the title al-Malik al-Zahir. {cite:tarikh-khulafa-minhaj-1434 p.720}'
    es: "Al-Zahir Baybars fundó la madrasa al-Zahiriyya en Bab al-Dhahab del palacio fatimí. {cite:khitat-maqrizi-1998 p.1032} Salió de El Cairo con Qalawun hacia Siria después de que Aqtay fuera asesinado. {cite:khitat-maqrizi-1998 p.1081} Asumió el sultanato después del asesinato de Qutuz, bajo el título de al-Malik al-Zahir. {cita:tarikh-khulafa-minhaj-1434 p.720}"
    fr: "Al-Zahir Baybars a fondé la madrasa al-Zahiriyya à Bab al-Dhahab du palais fatimide. {cite:khitat-maqrizi-1998 p.1032} Il a quitté le Caire avec Qalawun pour la Syrie après la mort d'Aqtay. {cite:khitat-maqrizi-1998 p.1081} Il prit le sultanat après la mort de Qutuz, sous le titre d'al-Malik al-Zahir. {cite:tarikh-khulafa-minhaj-1434 p.720}"
    ur: "الظاہر بیبرس نے فاطمی محل کے باب الذہب میں الظاہریہ مدرسہ کی بنیاد رکھی۔ {حوالہ:خطات مقریزی-1998 صفحہ 1032} وہ قاہرہ سے قالون کے ساتھ شام کے لیے روانہ ہوئے جب اقتے کے قتل ہو گئے۔ {حوالہ:خطت مقریزی-1998 صفحہ 1081} اس نے قطوز کے قتل کے بعد سلطنت سنبھالی، المالک الظاہر کے عنوان سے۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص720}"
    tr: "El-Zahir Baybars, Fatımi Sarayı'nın Altın Kapısı yakınlarında el-Zahiriye Medresesi'ni kurdu. {cite:khitat-maqrizi-1998 s.1032} Aktai'nin öldürülmesinden sonra Kalavun ile birlikte Suriye'ye gitti. {cite:khitat-maqrizi-1998 s.1081} Kutuz'un öldürülmesinden sonra Sultan oldu ve el-Malik el-Zahir unvanını aldı. {cite:tarikh-khulafa-minhaj-1434 s.720}"
    id: "Al-Zahir Baybars mendirikan Madrasah al-Zahiriyah di dekat Gerbang Emas Istana Fatimiyah. {cite:khitat-maqrizi-1998 p.1032} Ia pergi bersama Qalawun ke Suriah setelah pembunuhan Aqtai. {cite:khitat-maqrizi-1998 p.1081} Ia menjadi Sultan dan diberi gelar al-Malik al-Zahir setelah pembunuhan Qutuz. {cite:tarikh-khulafa-minhaj-1434 p.720}"
