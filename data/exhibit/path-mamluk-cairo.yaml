- title:
    ar: قلاوون
    en: Qalawun
    es: "Qalawun"
    fr: "Qalawun"
    ur: "قالون"
    tr: "Qalawun"
    id: "Qalawun"
  body:
    ar: 'بُني المارستان المنصوري على موضع القصر الغربي الصغير، وفي داخل المجمع القبة المنصورية. {cite:khitat-maqrizi-1998 p.1061} وشرع المنصور قلاوون في بناء المارستان والمدرسة والتربة، وتولى عمارتها سنجر الشجاعي. {cite:khitat-maqrizi-1998 p.1249} والمدرسة الناصرية ملاصقة لمئذنة القبة المنصورية. {cite:khitat-maqrizi-1998 p.1062}'
    en: 'The Mansuri hospital was built on the site of the small western palace, and inside the complex stands the Mansuri dome. {cite:khitat-maqrizi-1998 p.1061} Qalawun began the hospital, the madrasa and the mausoleum, and Sanjar al-Shuja''i oversaw the works. {cite:khitat-maqrizi-1998 p.1249} The al-Nasiriyya madrasa stands beside the minaret of the Mansuri dome. {cite:khitat-maqrizi-1998 p.1062}'
    es: "El hospital Mansuri se construyó en el emplazamiento del pequeño palacio occidental, y dentro del complejo se alza la cúpula Mansuri. {cite:khitat-maqrizi-1998 p.1061} Qalawun inició la construcción del hospital, la madrasa y el mausoleo, y Sanjar al-Shuja'i supervisó las obras. {cite:khitat-maqrizi-1998 p.1249} La madrasa al-Nasiriyya se encuentra junto al minarete de la cúpula Mansuri. {cite:khitat-maqrizi-1998 p.1062}"
    fr: "L'hôpital Mansuri fut construit sur l'emplacement du petit palais occidental, et le dôme Mansuri se dresse à l'intérieur du complexe. {cite:khitat-maqrizi-1998 p.1061} Qalawun initia la construction de l'hôpital, de la madrasa et du mausolée, et Sanjar al-Shuja'i supervisa les travaux. {cite:khitat-maqrizi-1998 p.1249} La madrasa al-Nasiriyya se trouve à côté du minaret du dôme Mansuri. {cite:khitat-maqrizi-1998 p.1062}"
    ur: "منصوری ہسپتال چھوٹے مغربی محل کی جگہ پر بنایا گیا تھا، اور کمپلیکس کے اندر منصوری گنبد کھڑا ہے۔ {حوالہ:خطت مقریزی-1998 صفحہ 1061} قلعہون نے اسپتال، مدرسہ اور مزار کا آغاز کیا اور سنجار الشجاعی نے کاموں کی نگرانی کی۔ {حوالہ:خطت مقریزی-1998 صفحہ 1249} النصیریہ مدرسہ منصوری گنبد کے مینار کے ساتھ کھڑا ہے۔ {حوالہ:خطت مقریزی-1998 ص1062}"
    tr: "Mansuri Hastanesi, küçük batı sarayının bulunduğu yere inşa edilmiş olup, kompleksin içinde Mansuri Kubbesi de yer almaktadır. {cite:khitat-maqrizi-1998 s.1061} Al-Mansur Qalawun hastane, medrese ve türbenin inşasına öncülük etmiş, Sanjar al-Shuja'i ise inşaatın denetimini üstlenmiştir. {cite:khitat-maqrizi-1998 s.1249} Nasiriyya Medresesi, Mansuri Kubbesi'nin minaresinin bitişiğinde yer almaktadır. {cite:khitat-maqrizi-1998 s.1062}"
    id: "Rumah Sakit Mansuri dibangun di lokasi istana barat kecil, dan di dalam kompleks tersebut terdapat Kubah Mansuri. {cite:khitat-maqrizi-1998 p.1061} Al-Mansur Qalawun memulai pembangunan rumah sakit, madrasah, dan mausoleum, dan Sanjar al-Shuja'i mengawasi pembangunannya. {cite:khitat-maqrizi-1998 p.1249} Madrasah Nasiriyya bersebelahan dengan menara Kubah Mansuri. {cite:khitat-maqrizi-1998 p.1062}"
  features:
  - person/qalawun
  - place/cairo
- title:
    ar: الناصر
    en: Al-Nasir
    es: "Al-Nasir"
    fr: "Al-Nasir"
    ur: "النصیر"
    tr: "Nasser"
    id: "Nasser"
  body:
    ar: 'كان الملك الناصر محمد بن قلاوون سلطان مصر سنة 702هـ، والقائم بتدبير الدولة بيبرس الجاشنكير. {cite:khitat-maqrizi-1998 p.240} وعمّر الجسر على بحر النيل ليكسر قوة التيار عن البر. {cite:khitat-maqrizi-1998 p.241} وأنشأ الجامع الجديد الناصري ظاهر مصر. {cite:khitat-maqrizi-1998 p.831}'
    en: 'Al-Malik al-Nasir Muhammad ibn Qalawun was sultan in Egypt in 702 AH, with Baybars al-Jashnakir managing the state. {cite:khitat-maqrizi-1998 p.240} He built a bridge over the Nile to break the force of the current from the bank. {cite:khitat-maqrizi-1998 p.241} He founded the al-Jami'' al-Jadid al-Nasiri outside Misr. {cite:khitat-maqrizi-1998 p.831}'
    es: "Al-Malik al-Nasir Muhammad ibn Qalawun fue sultán de Egipto en el año 702 de la Hégira, con Baybars al-Jashnakir al frente del estado. {cite:khitat-maqrizi-1998 p.240} Construyó un puente sobre el Nilo para contrarrestar la fuerza de la corriente desde la orilla. {cite:khitat-maqrizi-1998 p.241} Fundó el al-Jami' al-Jadid al-Nasiri en las afueras de Misr. {cite:khitat-maqrizi-1998 p.831}"
    fr: "Al-Malik al-Nasir Muhammad ibn Qalawun était sultan d'Égypte en 702 de l'Hégire, Baybars al-Jashnakir administrant l'État. {cite:khitat-maqrizi-1998 p.240} Il fit construire un pont sur le Nil afin d'atténuer la force du courant sur les rives. {cite:khitat-maqrizi-1998 p.241} Il fonda le Jami' al-Jadid al-Nasiri aux abords de Misr. {cite:khitat-maqrizi-1998 p.831}"
    ur: "المالک النصیر محمد ابن قولون 702 ہجری میں مصر کا سلطان تھا، جس کے پاس ریاست کا انتظام بیبرس الجشناکر تھا۔ {حوالہ:خطت مقریزی-1998 صفحہ 240} اس نے دریائے نیل پر ایک پل بنایا تاکہ کنارے سے کرنٹ کی قوت کو توڑنے کے لیے۔ انہوں نے مصر کے باہر الجامع الجدید النصیری کی بنیاد رکھی۔ {حوالہ:خطت مقریزی-1998 ص831}"
    tr: "Kral Nasır Muhammed ibn Kalavun, Hicri 702 yılında Mısır Sultanıydı ve devletin yöneticisi Baybars el-Ceşankir idi. {cite:khitat-maqrizi-1998 s.240} Akıntının karaya karşı gücünü kırmak için Nil Nehri üzerine bir köprü inşa ettirdi. {cite:khitat-maqrizi-1998 s.241} Ayrıca Kahire'de yeni El-Nasır Camii'ni kurdurdu. {cite:khitat-maqrizi-1998 s.831}"
    id: "Raja Al-Nasir Muhammad ibn Qalawun adalah Sultan Mesir pada tahun 702 H, dan administrator negara adalah Baybars al-Jashankir. {cite:khitat-maqrizi-1998 p.240} Beliau membangun jembatan di atas Sungai Nil untuk mengurangi kekuatan arus yang menghantam daratan. {cite:khitat-maqrizi-1998 p.241} Beliau juga mendirikan Masjid Al-Nasiri yang baru di Kairo. {cite:khitat-maqrizi-1998 p.831}"
  features:
  - person/al-nasir-muhammad-ibn-qalawun
  - place/cairo
- title:
    ar: السلطان حسن
    en: Sultan Hasan
    es: "Sultán Hasan"
    fr: "Sultan Hassan"
    ur: "سلطان حسن"
    tr: "Sultan Hasan"
    id: "Sultan Hassan"
  body:
    ar: 'بدأ السلطان حسن عمارة مسجده ومدرسته سنة 757هـ. {cite:khitat-maqrizi-1998 p.2111} واستمرت العمارة ثلاث سنين لا تنقطع، وأُرصد لها عشرون ألف درهم كل يوم. {cite:khitat-maqrizi-1998 p.2111} ويقول المقريزي إنه لا يُعرف في بلاد الإسلام معبد يحكيه. {cite:khitat-maqrizi-1998 p.2111}'
    en: 'Sultan Hasan began building his mosque and madrasa in 757 AH. {cite:khitat-maqrizi-1998 p.2111} The building went on for three years without a break, with twenty thousand dirhams set aside each day. {cite:khitat-maqrizi-1998 p.2111} Al-Maqrizi says that no mosque of the Muslims is known to resemble it. {cite:khitat-maqrizi-1998 p.2111}'
    es: "El sultán Hasan comenzó la construcción de su mezquita y madrasa en el año 757 de la Hégira. {cite:khitat-maqrizi-1998 p.2111} La construcción se prolongó durante tres años sin interrupción, destinándose veinte mil dirhams diarios. {cite:khitat-maqrizi-1998 p.2111} Al-Maqrizi afirma que no se conoce ninguna mezquita musulmana que se le parezca. {cite:khitat-maqrizi-1998 p.2111}"
    fr: "Le sultan Hassan entreprit la construction de sa mosquée et de sa madrasa en 757 de l'Hégire. Les travaux se poursuivirent sans interruption pendant trois ans, avec un budget quotidien de vingt mille dirhams. Al-Maqrizi affirme qu'aucune autre mosquée musulmane connue ne lui ressemble."
    ur: "سلطان حسن نے 757ھ میں اپنی مسجد اور مدرسہ بنانا شروع کیا۔ {حوالہ:خطت مقریزی-1998 صفحہ 2111} یہ عمارت تین سال تک بغیر وقفے کے چلتی رہی، جس میں ہر روز بیس ہزار درہم رکھے گئے تھے۔ المقرزی کہتے ہیں کہ مسلمانوں کی کوئی مسجد اس سے مشابہت نہیں رکھتی۔ {حوالہ:خطت مقریزی-1998ص2111}"
    tr: "Sultan Hasan, cami ve okulunun inşasına Hicri 757 yılında başladı. İnşaat üç yıl boyunca aralıksız devam etti ve günlük yirmi bin dirhem tahsis edildi. El-Makrizi, İslam dünyasında hiçbir mabedin onunla kıyaslanamayacağını belirtir."
    id: "Sultan Hassan memulai pembangunan masjid dan sekolahnya pada tahun 757 Hijriah. Pembangunan berlangsung tanpa gangguan selama tiga tahun, dengan alokasi dana sebesar dua puluh ribu dirham setiap hari. Al-Maqrizi menyatakan bahwa tidak ada kuil lain di dunia Islam yang sebanding dengannya."
  features:
  - building/masjid-sultan-hasan
  - place/cairo
- title:
    ar: المدينة
    en: The city
    es: "La ciudad"
    fr: "La ville"
    ur: "شہر"
    tr: "Şehir"
    id: "Kota"
  body:
    ar: 'نزل جوهر موضع القاهرة في شعبان سنة 358هـ. {cite:khitat-maqrizi-1998 p.1030} وكانت القاهرة دار خلافة ينزلها الخليفة بحرمه وخواصه. {cite:khitat-maqrizi-1998 p.1001} ثم صارت مدينة سكنى بعدما كانت حصناً يُعتقل فيه. {cite:khitat-maqrizi-1998 p.1001}'
    en: 'Jawhar settled on the site of Cairo in Sha''ban 358 AH. {cite:khitat-maqrizi-1998 p.1030} Cairo was a caliphal residence where the caliph lived with his household and his closest people. {cite:khitat-maqrizi-1998 p.1001} It then became a city of residence, after it had been a fortress in which one was held. {cite:khitat-maqrizi-1998 p.1001}'
    es: "Jawhar se estableció en el sitio de El Cairo en Sha'ban 358 AH. {cite:khitat-maqrizi-1998 p.1030} El Cairo era una residencia califal donde el califa vivía con su familia y sus allegados. {cite:khitat-maqrizi-1998 p.1001} Posteriormente se convirtió en una ciudad residencial, después de haber sido una fortaleza donde se mantenía una población. {cite:khitat-maqrizi-1998 p.1001}"
    fr: "Jawhar s'établit sur le site du Caire en Sha'ban 358 AH. {cite:khitat-maqrizi-1998 p.1030} Le Caire était une résidence califale où le calife vivait avec sa famille et ses proches. {cite:khitat-maqrizi-1998 p.1001} Elle devint ensuite une ville de résidence, après avoir été une forteresse. {cite:khitat-maqrizi-1998 p.1001}"
    ur: "جوہر شعبان 358ھ میں قاہرہ کے مقام پر آباد ہوئے۔ قاہرہ ایک خلیفہ کی رہائش گاہ تھی جہاں خلیفہ اپنے گھر والوں اور اپنے قریبی لوگوں کے ساتھ رہتا تھا۔ {حوالہ:خطت مقریزی-1998 صفحہ 1001} اس کے بعد یہ رہائش کا شہر بن گیا، جب یہ ایک قلعہ تھا جس میں ایک منعقد ہوا تھا۔ {حوالہ:خطت مقریزی-1998ص1001}"
    tr: "Jawhar, Hicri 358 yılının Şaban ayında Kahire'ye geldi. {cite:khitat-maqrizi-1998 s.1030} Kahire, halifenin ailesi ve yakın çevresiyle birlikte yaşadığı halifeliğin merkeziydi. {cite:khitat-maqrizi-1998 s.1001} Daha sonra, tutsakların tutulduğu bir kale olduktan sonra, yerleşim yeri haline geldi. {cite:khitat-maqrizi-1998 s.1001}"
    id: "Jawhar tiba di lokasi Kairo pada bulan Sya'ban tahun 358 Hijriah. {cite:khitat-maqrizi-1998 hlm. 1030} Kairo adalah pusat Kekhalifahan, tempat Khalifah tinggal bersama keluarganya dan para sahabat dekatnya. {cite:khitat-maqrizi-1998 hlm. 1001} Kemudian, kota ini menjadi kota pemukiman setelah sebelumnya menjadi benteng tempat para tahanan ditahan. {cite:khitat-maqrizi-1998 hlm. 1001}"
