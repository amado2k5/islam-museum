label:
  ar: القاهرة المملوكة
  en: Mamluk Cairo
  es: "El Cairo mameluco"
  fr: "Le Caire mamelouk"
  ur: "مملوک قاہرہ"
  tr: "Kahire'ye aitti."
  id: "Kairo memiliki"
summary:
  ar: 'مسار في سلطنة المماليك: بيبرس وقلاوون والناصر محمد، ومسجد السلطان حسن، ومدينة القاهرة في القرن الثامن الهجري.'
  en: A trail through the Mamluk sultanate.
  es: "Un sendero a través del sultanato mameluco."
  fr: "Un sentier à travers le sultanat mamelouk."
  ur: "مملوک سلطنت کے ذریعے ایک پگڈنڈی۔"
  tr: "Memlük Sultanlığı'nda bir rota: Baybars, Qalawun ve Al-Nasir Muhammed, Sultan Hasan Camii ve Hicri sekizinci yüzyılda Kahire şehri."
  id: "Rute di Kesultanan Mamluk: Baybars, Qalawun dan Al-Nasir Muhammad, Masjid Sultan Hassan, dan kota Kairo pada abad kedelapan Hijriah."
