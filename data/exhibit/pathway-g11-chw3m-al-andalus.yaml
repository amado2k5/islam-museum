id: exhibit/pathway-g11-chw3m-al-andalus
class: exhibit
kind: lesson
label:
  ar: "الأندلس: ثمانية قرون من قرطبة إلى غرناطة"
  en: "Al-Andalus: eight centuries from Cordoba to Granada"
  ur: "اندلس: قرطبہ سے غرناطہ تک آٹھ صدیاں"
summary:
  ar: "مسار لمقرر CHW3M عن الأندلس: قرطبة الأموية وجامعها ومكتبتها، وزرياب وابن رشد، وما عاشت فيه ثلاث ديانات من تعايش وتوتر، ثم غرناطة والحمراء ونهاية الإمارة سنة 1492."
  en: "A CHW3M pathway on al-Andalus: Umayyad Cordoba, its mosque and library, Ziryab and Ibn Rushd, the coexistence and tension of three faiths, then Granada, the Alhambra and the end of the emirate in 1492."
  ur: "CHW3M کا ایک راستہ اندلس پر: اموی قرطبہ، اس کی مسجد اور لائبریری، زریاب اور ابن رشد، تین مذاہب کے ساتھ رہنے اور کھنچاؤ کی زندگی، پھر غرناطہ، الحمرا اور 1492 میں امارت کا خاتمہ۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يقيّم الطالب إسهام أفراد وجماعات في هوية وثقافة مجتمع أندلسي مزدهر، وأن يحلّل تراثه الثقافي والسياسي في أوروبا والعالم الإسلامي.
  en: Students assess the contribution of individuals and groups to the identity and culture of a flourishing Andalusi society, and analyse its cultural and political legacy in Europe and the Muslim world.
  ur: طلبہ ایک پھلتے پھولتے اندلسی معاشرے کی شناخت اور ثقافت میں افراد اور گروہوں کے حصے کا جائزہ لیں، اور یورپ اور مسلم دنیا میں اس کی ثقافتی اور سیاسی میراث کا تجزیہ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHW3M
  course_title:
    ar: تاريخ العالم حتى نهاية القرن الخامس عشر، الصف 11، إعداد جامعي/كلّي
    en: World History to the End of the Fifteenth Century, Grade 11, University/College Preparation
    ur: پندرہویں صدی کے اختتام تک دنیا کی تاریخ، جماعت 11، یونیورسٹی/کالج تیاری
  grade: "11"
  strand: C
  strand_title:
    ar: مجتمعات وحضارات مزدهرة
    en: Flourishing Societies and Civilizations
    ur: پھلتے پھولتے معاشرے اور تہذیبیں
  expectations:
    - C3
    - E1
  expectation:
    ar: يعرض الدرس الأندلس حضارةً مزدهرة من إقليم أوروبي وزمن يمتد من 711 إلى 1492، ويركّز على إسهام أفراد (زرياب، ابن رشد) وجماعات (المسلمون والنصارى واليهود) في هويتها وثقافتها، ثم على تراثها في العمارة والفلسفة والعلم. التوترات بين الجماعات تُعرض كما ترويها المصادر دون حكم.
    en: The lesson presents al-Andalus as a flourishing civilisation of a European region and a period from 711 to 1492, focusing on the contribution of individuals (Ziryab, Ibn Rushd) and groups (Muslims, Christians and Jews) to its identity and culture, then on its legacy in architecture, philosophy and science. Tensions between the groups are shown as the sources relate them, without a verdict.
    ur: یہ سبق اندلس کو ایک یورپی خطے اور 711 سے 1492 تک کے دور کی پھلتی پھولتی تہذیب کے طور پر پیش کرتا ہے، افراد (زریاب، ابن رشد) اور گروہوں (مسلمان، مسیحی اور یہودی) کے اس کی شناخت اور ثقافت میں حصے پر، پھر فنِ تعمیر، فلسفے اور علم میں اس کی میراث پر زور دیتا ہے۔ گروہوں کے بیچ کھنچاؤ ویسا ہی دکھایا گیا ہے جیسا ماخذ بیان کرتے ہیں، بغیر فیصلے کے۔
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: ما الأندلس؟
      en: What is al-Andalus?
      ur: اندلس کیا ہے؟
    body:
      ar: اسم الأرض التي حكمها المسلمون في شبه الجزيرة الإيبيرية من 711 إلى 1492.
      en: The name of the land Muslims ruled in the Iberian peninsula from 711 to 1492.
      ur: جزیرہ نما آئبیریا کی اس زمین کا نام جس پر مسلمانوں نے 711 سے 1492 تک حکومت کی۔
    features:
      - place/al-andalus
  - title:
      ar: قرطبة الأموية
      en: Umayyad Cordoba
      ur: اموی قرطبہ
    body:
      ar: أمير فارّ من دمشق يبني دولة، وخلافة تُعلن سنة 929.
      en: A prince fleeing Damascus builds a state, and a caliphate is proclaimed in 929.
      ur: دمشق سے بھاگا ایک شہزادہ ریاست بناتا ہے، اور 929 میں خلافت کا اعلان ہوتا ہے۔
    features:
      - place/cordoba
      - polity/umayyads-of-cordoba
  - title:
      ar: جامع قرطبة
      en: The Great Mosque of Cordoba
      ur: قرطبہ کی جامع مسجد
    body:
      ar: "مبنى توسّع على مراحل قرنين: العمارة بوصفها سياسة."
      en: "A building enlarged in stages over two centuries: architecture as politics."
      ur: "دو صدیوں میں مرحلہ وار بڑھائی گئی عمارت: فنِ تعمیر بطور سیاست۔"
    features:
      - building/great-mosque-cordoba
  - title:
      ar: مكتبة القصر
      en: The palace library
      ur: قصر کی لائبریری
    body:
      ar: "خزانة كتب الحكم المستنصر: ما تقوله المصادر عن حجمها وما لم يبق."
      en: "Al-Hakam's library: what the sources say about its size, and what did not survive."
      ur: "حکم کی لائبریری: ماخذ اس کے حجم کے بارے میں کیا کہتے ہیں، اور کیا باقی نہ رہا۔"
    features:
      - building/khizanat-kutub-qurtuba
  - title:
      ar: زرياب
      en: Ziryab
      ur: زریاب
    body:
      ar: "موسيقي من بغداد يغيّر الذوق الأندلسي: الموسيقى والطعام واللباس."
      en: "A musician from Baghdad changes Andalusi taste: music, food and dress."
      ur: "بغداد کا ایک موسیقار اندلسی ذوق بدل دیتا ہے: موسیقی، کھانا اور لباس۔"
    features:
      - person/ziryab
  - title:
      ar: ابن رشد
      en: Ibn Rushd
      ur: ابن رشد
    body:
      ar: قاضٍ وفيلسوف شرح أرسطو فقرأته أوروبا اللاتينية.
      en: A judge and philosopher whose commentaries on Aristotle Latin Europe read.
      ur: ایک قاضی اور فلسفی جس کی ارسطو کی شرحیں لاطینی یورپ نے پڑھیں۔
    features:
      - person/ibn-rushd
  - title:
      ar: غرناطة
      en: Granada
      ur: غرناطہ
    body:
      ar: آخر إمارة إسلامية في الأندلس وقد ضاقت الأرض.
      en: The last Muslim emirate in al-Andalus as the land shrank.
      ur: اندلس کی آخری مسلم امارت جب زمین سمٹتی گئی۔
    features:
      - place/granada
      - polity/emirate-of-granada
  - title:
      ar: الحمراء
      en: The Alhambra
      ur: الحمرا
    body:
      ar: "قصر وحصن ومدينة: الزخرفة والماء والخط."
      en: "Palace, fortress and city: ornament, water and calligraphy."
      ur: "قصر، قلعہ اور شہر: آرائش، پانی اور خطاطی۔"
    features:
      - building/alhambra
outcomes:
  - text:
      ar: أضع الأندلس في الزمان والمكان وأسمّي مراحلها الكبرى.
      en: I can place al-Andalus in time and space and name its main phases.
      ur: میں اندلس کو زمان و مکان میں رکھ سکتا ہوں اور اس کے بڑے مراحل بتا سکتا ہوں۔
    steps:
      - 0
      - 1
      - 6
  - text:
      ar: أقيّم إسهام فردين على الأقل في ثقافة الأندلس.
      en: I can assess the contribution of at least two individuals to Andalusi culture.
      ur: میں اندلسی ثقافت میں کم سے کم دو افراد کے حصے کا جائزہ لے سکتا ہوں۔
    steps:
      - 4
      - 5
  - text:
      ar: أحلّل ما بقي من تراث الأندلس في العمارة والفكر.
      en: I can analyse what survives of al-Andalus in architecture and thought.
      ur: میں فنِ تعمیر اور فکر میں اندلس کی باقی میراث کا تجزیہ کر سکتا ہوں۔
    steps:
      - 2
      - 3
      - 5
      - 7
worksheet:
  - prompt:
      ar: ارسم خطًا زمنيًا من 711 إلى 1492 وضع عليه قرطبة الأموية وإعلان الخلافة وسقوط غرناطة.
      en: Draw a timeline from 711 to 1492 and place Umayyad Cordoba, the proclamation of the caliphate and the fall of Granada on it.
      ur: 711 سے 1492 تک ایک ٹائم لائن بنائیں اور اس پر اموی قرطبہ، خلافت کا اعلان اور غرناطہ کا زوال رکھیں۔
    steps:
      - 1
      - 6
  - prompt:
      ar: لماذا توسّع جامع قرطبة مرارًا؟ ما الذي يقوله ذلك عن الحاكم؟
      en: Why was the Great Mosque of Cordoba enlarged again and again? What does that say about the ruler?
      ur: قرطبہ کی جامع مسجد بار بار کیوں بڑھائی گئی؟ یہ حاکم کے بارے میں کیا بتاتا ہے؟
    steps:
      - 2
  - prompt:
      ar: ماذا جلب زرياب من بغداد إلى قرطبة؟ اذكر ثلاثة أشياء.
      en: What did Ziryab bring from Baghdad to Cordoba? Name three things.
      ur: زریاب بغداد سے قرطبہ کیا لایا؟ تین چیزیں لکھیں۔
    steps:
      - 4
  - prompt:
      ar: كيف وصل فكر ابن رشد إلى جامعات أوروبا اللاتينية؟
      en: How did Ibn Rushd's thought reach the universities of Latin Europe?
      ur: ابن رشد کی فکر لاطینی یورپ کی یونیورسٹیوں تک کیسے پہنچی؟
    steps:
      - 5
  - prompt:
      ar: اختر عنصرًا واحدًا من الحمراء وبيّن ما يقوله عن ثقافة غرناطة.
      en: Choose one element of the Alhambra and show what it says about the culture of Granada.
      ur: الحمرا کا ایک عنصر چنیں اور دکھائیں کہ وہ غرناطہ کی ثقافت کے بارے میں کیا کہتا ہے۔
    steps:
      - 7
quiz:
  - q:
      ar: بين أي سنتين حكم المسلمون أرضًا في شبه الجزيرة الإيبيرية؟
      en: Between which years did Muslims rule land in the Iberian peninsula?
      ur: مسلمانوں نے جزیرہ نما آئبیریا میں کس عرصے میں حکومت کی؟
    options:
      - ar: 622–750
        en: 622–750
        ur: 622–750
      - ar: 711–1492
        en: 711–1492
        ur: 711–1492
      - ar: 1099–1291
        en: 1099–1291
        ur: 1099–1291
      - ar: 1453–1650
        en: 1453–1650
        ur: 1453–1650
    answer: 1
    teaches: 0
  - q:
      ar: لماذا توسّع جامع قرطبة مرارًا؟
      en: Why was the Great Mosque of Cordoba enlarged repeatedly?
      ur: قرطبہ کی جامع مسجد بار بار کیوں بڑھائی گئی؟
    options:
      - ar: لأن المدينة نمت وأراد الحكام إظهار قوتهم
        en: The city grew and rulers displayed their power
        ur: شہر بڑھا اور حاکموں نے اپنی طاقت دکھائی
      - ar: لأن الزلازل هدمته
        en: Earthquakes destroyed it
        ur: زلزلوں نے اسے گرا دیا
      - ar: لأنه صار قصرًا
        en: It became a palace
        ur: وہ قصر بن گئی
      - ar: لم يتوسّع قط
        en: It was never enlarged
        ur: وہ کبھی نہ بڑھی
    answer: 0
    teaches: 2
  - q:
      ar: من كان زرياب؟
      en: Who was Ziryab?
      ur: زریاب کون تھا؟
    options:
      - ar: قاضٍ من غرناطة
        en: A judge of Granada
        ur: غرناطہ کا قاضی
      - ar: خليفة قرطبة
        en: The caliph of Cordoba
        ur: قرطبہ کا خلیفہ
      - ar: طبيب من بخارى
        en: A physician from Bukhara
        ur: بخارا کا طبیب
      - ar: موسيقي من بغداد غيّر ذوق الأندلس
        en: A musician from Baghdad who changed Andalusi taste
        ur: بغداد کا موسیقار جس نے اندلسی ذوق بدلا
    answer: 3
    teaches: 4
  - q:
      ar: بماذا اشتهر ابن رشد عند الأوروبيين؟
      en: For what was Ibn Rushd known among Europeans?
      ur: ابن رشد یورپ میں کس چیز سے مشہور تھے؟
    options:
      - ar: بشروحه على أرسطو
        en: His commentaries on Aristotle
        ur: ارسطو کی شرحوں سے
      - ar: بخرائطه
        en: His maps
        ur: اپنے نقشوں سے
      - ar: بأشعاره
        en: His poetry
        ur: اپنی شاعری سے
      - ar: بسفنه
        en: His ships
        ur: اپنے جہازوں سے
    answer: 0
    teaches: 5
  - q:
      ar: ما الحمراء؟
      en: What is the Alhambra?
      ur: الحمرا کیا ہے؟
    options:
      - ar: مكتبة في قرطبة
        en: A library in Cordoba
        ur: قرطبہ کی ایک لائبریری
      - ar: مسجد في إشبيلية
        en: A mosque in Seville
        ur: اشبیلیہ کی ایک مسجد
      - ar: قصر وحصن في غرناطة
        en: A palace and fortress in Granada
        ur: غرناطہ میں قصر اور قلعہ
      - ar: جزيرة قرب طليطلة
        en: An island near Toledo
        ur: طلیطلہ کے پاس ایک جزیرہ
    answer: 2
    teaches: 7
