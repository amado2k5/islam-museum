id: exhibit/pathway-g4-social-studies-four-cities
class: exhibit
kind: lesson
label:
  ar: "أربع مدن إسلامية قبل سنة 1500: بغداد وقرطبة والقاهرة وتمبكتو"
  en: "Four Muslim cities before 1500: Baghdad, Cordoba, Cairo and Timbuktu"
  ur: "سنہ 1500 سے پہلے کے چار مسلم شہر: بغداد، قرطبہ، قاہرہ اور تمبکتو"
  es: "Cuatro ciudades musulmanas antes de 1500: Bagdad, Córdoba, El Cairo y Tombuctú."
  fr: "Quatre villes musulmanes avant 1500: Bagdad, Cordoue, Le Caire et Tombouctou"
  tr: "1500 yılından önce var olan dört İslam şehri: Bağdat, Kurtuba, Kahire ve Timbuktu."
  id: "Empat kota Islam sebelum tahun 1500: Baghdad, Cordoba, Kairo, dan Timbuktu"
summary:
  ar: "درس للصف الرابع عن أربع مدن من مجتمعات ما قبل سنة 1500: كيف عاش الناس فيها، ومن حكمها، وكيف تعلّموا وتاجروا، وما الذي يشبه حياتنا اليوم وما الذي يختلف."
  en: "A Grade 4 lesson on four cities of societies before 1500: how people lived there, who governed, how they learned and traded, and what is like our life today and what is different."
  ur: "جماعت چہارم کا سبق سنہ 1500 سے پہلے کے معاشروں کے چار شہروں پر: لوگ وہاں کیسے رہتے تھے، کون حکومت کرتا تھا، وہ کیسے سیکھتے اور تجارت کرتے تھے، اور آج کی زندگی سے کیا ملتا ہے اور کیا الگ ہے۔"
  es: "Una lección para alumnos de cuarto grado sobre cuatro ciudades y sociedades anteriores a 1500: cómo vivían sus habitantes, quiénes los gobernaban, cómo aprendían y comerciaban, y en qué se parece nuestra vida hoy en día y en qué se diferencia."
  fr: "Une leçon de 4e année sur quatre villes et leurs sociétés d'avant 1500: comment les gens y vivaient, qui les gouvernait, comment ils apprenaient et commerçaient, et en quoi cela ressemble à notre vie aujourd'hui et en quoi est-ce différent."
  tr: "1500 öncesi toplumlardan dört şehri konu alan dördüncü sınıf dersi: insanların bu şehirlerde nasıl yaşadıkları, kimlerin yönettiği, nasıl eğitim gördükleri ve ticaret yaptıkları, günümüzdeki yaşamlarımızla benzerlikleri ve farklılıkları."
  id: "Pelajaran kelas empat tentang empat kota dari masyarakat pra-1500: bagaimana orang-orang hidup di dalamnya, siapa yang memerintahnya, bagaimana mereka belajar dan berdagang, apa yang mirip dengan kehidupan kita saat ini dan apa yang berbeda."
audience:
  - teacher
  - student
level: intro
duration_minutes: 60
wings: []
goal:
  ar: أن يصف التلميذ الحياة اليومية والتنظيم الاجتماعي في مدينة إسلامية قبل 1500، وأن يقارنها بمجتمعه في كندا اليوم.
  en: Students describe daily life and social organisation in a Muslim city before 1500 and compare it with their own community in Canada today.
  ur: طلبہ سنہ 1500 سے پہلے کے ایک مسلم شہر کی روزمرہ زندگی اور معاشرتی نظم بیان کریں اور آج کینیڈا میں اپنی برادری سے اس کا موازنہ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: G4-SS
  course_title:
    ar: الدراسات الاجتماعية، الصف الرابع
    en: Social Studies, Grade 4
    ur: سوشل اسٹڈیز، جماعت چہارم
  grade: "4"
  strand: A
  strand_title:
    ar: "التراث والهوية: المجتمعات المبكرة حتى سنة 1500"
    en: "Heritage and Identity: Early Societies to 1500 CE"
    ur: "ورثہ اور شناخت: ابتدائی معاشرے 1500ء تک"
  expectations:
    - A1
    - A3
  expectation:
    ar: "يغطي الدرس مجتمعاتٍ مبكرة من خارج كندا بأمثلة من أربع مدن إسلامية قبل سنة 1500: تنظيمها السياسي والاجتماعي، وحياتها اليومية، وعلاقتها بالبيئة وبالمجتمعات الأخرى عبر التجارة، ثم يطلب من التلاميذ مقارنتها بمجتمعهم اليوم. يكمّل المعلم بمجتمع من الأمم الأولى ومجتمع إنويت كما يشترط المحور."
    en: "The lesson covers early societies outside Canada through four Muslim cities before 1500: their political and social organisation, daily life, and relations with the environment and with other societies through trade, then asks students to compare them with their own community today. The teacher pairs it with a First Nation and an Inuit society, as the strand requires."
    ur: "یہ سبق کینیڈا سے باہر کے ابتدائی معاشروں کو سنہ 1500 سے پہلے کے چار مسلم شہروں کی مثال سے پڑھاتا ہے: ان کا سیاسی اور معاشرتی نظم، روزمرہ زندگی، اور ماحول اور تجارت کے ذریعے دوسرے معاشروں سے تعلق، پھر طلبہ سے آج اپنی برادری کے ساتھ موازنہ کرواتا ہے۔ استاد اسے ایک فرسٹ نیشن اور ایک انوئٹ معاشرے کے ساتھ جوڑتا ہے جیسا کہ شاخ کا تقاضا ہے۔"
  document: "The Ontario Curriculum: Social Studies, Grades 1 to 6; History and Geography, Grades 7 and 8, 2023 (dcp.edu.gov.on.ca)"
  verified: 2026-10-23
rooms:
  - title:
      ar: "بغداد: مدينة دائرية جديدة"
      en: "Baghdad: a new round city"
      ur: "بغداد: ایک نیا گول شہر"
      es: "Bagdad: una nueva ciudad redonda"
      fr: "Bagdad: une nouvelle ville ronde"
      tr: "Bağdat: Yeni bir dairesel şehir"
      id: "Baghdad: Sebuah kota melingkar baru"
    body:
      ar: كيف أُسست بغداد، ومن سكنها، ولماذا صارت كبيرة.
      en: How Baghdad was founded, who lived in it and why it grew so large.
      ur: بغداد کیسے بسا، اس میں کون رہتا تھا اور وہ اتنا بڑا کیوں ہوا۔
      es: "Cómo se fundó Bagdad, quiénes vivían en ella y por qué creció tanto."
      fr: "Comment Bagdad a été fondée, qui y vivait et pourquoi elle est devenue si grande."
      tr: "Bağdat nasıl kuruldu, kimler yaşadı ve neden bu kadar büyük bir şehir oldu?"
      id: "Bagaimana Baghdad didirikan, siapa yang tinggal di dalamnya, dan mengapa kota itu menjadi begitu besar?"
    features:
      - place/baghdad
      - event/founding-of-baghdad
  - title:
      ar: "بيت الحكمة: مكتبة المدينة"
      en: "The House of Wisdom: the city's library"
      ur: "بیت الحکمہ: شہر کی لائبریری"
      es: "La Casa de la Sabiduría: la biblioteca de la ciudad"
      fr: "La Maison de la Sagesse: la bibliothèque de la ville"
      tr: "Bilgelik Evi: Şehir Kütüphanesi"
      id: "Rumah Kebijaksanaan: Perpustakaan Kota"
    body:
      ar: "مكان للكتب والترجمة: من عمل فيه وما كان يفعل."
      en: "A place for books and translation: who worked there and what they did."
      ur: "کتابوں اور ترجمے کی جگہ: وہاں کون کام کرتا تھا اور کیا کرتا تھا۔"
      es: "Un espacio para los libros y la traducción: quiénes trabajaban allí y qué hacían."
      fr: "Un lieu dédié aux livres et à la traduction: qui y travaillait et ce qu'ils faisaient."
      tr: "Kitap ve çeviri merkezi: Orada kimler çalıştı ve neler yaptılar."
      id: "Tempat untuk buku dan penerjemahan: siapa yang bekerja di sana dan apa yang mereka lakukan."
    features:
      - building/bayt-al-hikma
  - title:
      ar: "قرطبة: مدينة في الأندلس"
      en: "Cordoba: a city in al-Andalus"
      ur: "قرطبہ: اندلس کا ایک شہر"
      es: "Córdoba: una ciudad en al-Ándalus"
      fr: "Cordoue: une ville d'al-Andalus"
      tr: "Cordoba: Endülüs'te bir şehir."
      id: "Cordoba: Sebuah kota di Andalusia"
    body:
      ar: مدينة أوروبية حكمها المسلمون قرونًا، وعاش فيها مسلمون ونصارى ويهود.
      en: A European city ruled by Muslims for centuries, where Muslims, Christians and Jews lived.
      ur: ایک یورپی شہر جس پر صدیوں مسلمانوں نے حکومت کی، جہاں مسلمان، مسیحی اور یہودی رہتے تھے۔
      es: "Una ciudad europea gobernada por musulmanes durante siglos, donde convivían musulmanes, cristianos y judíos."
      fr: "Une ville européenne gouvernée par les musulmans pendant des siècles, où vivaient musulmans, chrétiens et juifs."
      tr: "Yüzyıllarca Müslümanların yönetimi altında kalmış ve Müslümanların, Hristiyanların ve Yahudilerin birlikte yaşadığı bir Avrupa şehri."
      id: "Sebuah kota di Eropa yang diperintah oleh umat Muslim selama berabad-abad, dan di mana umat Muslim, Kristen, dan Yahudi hidup berdampingan."
    features:
      - place/cordoba
  - title:
      ar: جامع قرطبة
      en: The Great Mosque of Cordoba
      ur: قرطبہ کی جامع مسجد
      es: "La Gran Mezquita de Córdoba"
      fr: "La Grande Mosquée de Cordoue"
      tr: "Kordoba Camii"
      id: "Masjid Cordoba"
    body:
      ar: "مبنى كبير بأقواسه الشهيرة: كيف بُني وفيم استُعمل."
      en: "A great building with its famous arches: how it was built and what it was used for."
      ur: "اپنی مشہور محرابوں والی ایک بڑی عمارت: کیسے بنی اور کس کام آئی۔"
      es: "Un magnífico edificio con sus famosos arcos: cómo se construyó y para qué se utilizaba."
      fr: "Un édifice remarquable avec ses célèbres arches: comment il a été construit et à quoi il servait."
      tr: "Ünlü kemerleriyle büyük bir bina: nasıl inşa edildi ve ne amaçla kullanıldı."
    features:
      - building/great-mosque-cordoba
  - title:
      ar: القاهرة والأزهر
      en: Cairo and al-Azhar
      ur: قاہرہ اور الازہر
      es: "El Cairo y Al-Azhar"
      fr: "Le Caire et al-Azhar"
      tr: "Kahire ve El-Azhar"
      id: "Kairo dan Al-Azhar"
    body:
      ar: مدينة على النيل، ومسجد صار مدرسة يتعلّم فيها الناس حتى اليوم.
      en: A city on the Nile, and a mosque that became a school where people still study today.
      ur: نیل کے کنارے ایک شہر، اور ایک مسجد جو مدرسہ بنی جہاں لوگ آج تک پڑھتے ہیں۔
      es: "Una ciudad a orillas del Nilo y una mezquita que se convirtió en escuela donde todavía hoy se imparten clases."
      fr: "Une ville sur le Nil et une mosquée transformée en école où l'on étudie encore aujourd'hui."
      tr: "Nil Nehri kıyısında bir şehir ve günümüzde hala insanların eğitim gördüğü bir okula dönüştürülen bir cami."
      id: "Sebuah kota di tepi Sungai Nil, dan sebuah masjid yang menjadi sekolah tempat orang-orang masih belajar hingga hari ini."
    features:
      - place/cairo
      - building/al-azhar
  - title:
      ar: تمبكتو ومنسا موسى
      en: Timbuktu and Mansa Musa
      ur: تمبکتو اور منسا موسیٰ
      es: "Tombuctú y Mansa Musa"
      fr: "Tombouctou et Mansa Moussa"
      tr: "Timbuktu ve Mansa Musa"
      id: "Timbuktu dan Mansa Musa"
    body:
      ar: مدينة على طرف الصحراء الكبرى، وملك مشهور سافر منها إلى مكة.
      en: A city at the edge of the Sahara, and a famous king who travelled from it to Mecca.
      ur: صحارا کے کنارے ایک شہر، اور ایک مشہور بادشاہ جو وہاں سے مکہ گیا۔
      es: "Una ciudad en los confines del Sahara, y un famoso rey que viajó desde allí hasta La Meca."
      fr: "Une ville aux portes du Sahara, et un roi célèbre qui voyagea de là jusqu'à La Mecque."
      tr: "Sahra Çölü'nün kıyısında yer alan bir şehir ve oradan Mekke'ye seyahat eden ünlü bir kral."
      id: "Sebuah kota di tepi Gurun Sahara, dan seorang raja terkenal melakukan perjalanan dari sana ke Mekah."
    features:
      - place/timbuktu
      - person/mansa-musa
  - title:
      ar: التجارة تربط المدن
      en: Trade links the cities
      ur: تجارت شہروں کو جوڑتی ہے
      es: "El comercio conecta las ciudades"
      fr: "Les liens commerciaux relient les villes"
      tr: "Ticaret şehirleri birbirine bağlar."
      id: "Perdagangan menghubungkan kota-kota"
    body:
      ar: "القوافل والسفن والأسواق: كيف وصل الورق والذهب والملح والكتب من مدينة إلى مدينة."
      en: "Caravans, ships and markets: how paper, gold, salt and books travelled from city to city."
      ur: "قافلے، جہاز اور بازار: کاغذ، سونا، نمک اور کتابیں شہر سے شہر کیسے پہنچتی تھیں۔"
      es: "Caravanas, barcos y mercados: cómo viajaban el papel, el oro, la sal y los libros de ciudad en ciudad."
      fr: "Caravanes, navires et marchés: comment le papier, l'or, le sel et les livres voyageaient de ville en ville."
      tr: "Kervanlar, gemiler ve pazarlar: Kağıt, altın, tuz ve kitaplar şehirden şehre nasıl taşındı?"
      id: "Karavan, kapal, dan pasar: Bagaimana kertas, emas, garam, dan buku berpindah dari kota ke kota."
    features:
      - concept/trade-in-islam
  - title:
      ar: المسجد في وسط المدينة
      en: The mosque at the heart of the city
      ur: شہر کے بیچ میں مسجد
      es: "La mezquita en el corazón de la ciudad"
      fr: "La mosquée au cœur de la ville"
      tr: "Şehir merkezindeki cami"
      id: "Masjid di pusat kota"
    body:
      ar: "مكان الصلاة والتعلّم واللقاء: ما تشترك فيه المساجد في المدن الأربع."
      en: "A place for prayer, learning and meeting: what the mosques of the four cities share."
      ur: "نماز، سیکھنے اور ملنے کی جگہ: چار شہروں کی مسجدوں میں کیا بات مشترک ہے۔"
      es: "Un lugar para la oración, el aprendizaje y el encuentro: eso es lo que tienen en común las mezquitas de las cuatro ciudades."
      fr: "Un lieu de prière, d'apprentissage et de rencontre: ce que partagent les mosquées des quatre villes."
      tr: "Dua, öğrenme ve buluşma yeri: Dört şehirdeki camilerin ortak noktası bu."
      id: "Tempat berdoa, belajar, dan bertemu: kesamaan yang dimiliki masjid-masjid di keempat kota tersebut."
    features:
      - concept/masjid-umum
outcomes:
