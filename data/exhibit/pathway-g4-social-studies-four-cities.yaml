id: exhibit/pathway-g4-social-studies-four-cities
class: exhibit
kind: lesson
label:
  ar: "أربع مدن إسلامية قبل سنة 1500: بغداد وقرطبة والقاهرة وتمبكتو"
  en: "Four Muslim cities before 1500: Baghdad, Cordoba, Cairo and Timbuktu"
  ur: "سنہ 1500 سے پہلے کے چار مسلم شہر: بغداد، قرطبہ، قاہرہ اور تمبکتو"
summary:
  ar: "درس للصف الرابع عن أربع مدن من مجتمعات ما قبل سنة 1500: كيف عاش الناس فيها، ومن حكمها، وكيف تعلّموا وتاجروا، وما الذي يشبه حياتنا اليوم وما الذي يختلف."
  en: "A Grade 4 lesson on four cities of societies before 1500: how people lived there, who governed, how they learned and traded, and what is like our life today and what is different."
  ur: "جماعت چہارم کا سبق سنہ 1500 سے پہلے کے معاشروں کے چار شہروں پر: لوگ وہاں کیسے رہتے تھے، کون حکومت کرتا تھا، وہ کیسے سیکھتے اور تجارت کرتے تھے، اور آج کی زندگی سے کیا ملتا ہے اور کیا الگ ہے۔"
audience:
  - teacher
  - student
level: intro
duration_minutes: 60
wings: []
goal:
  ar: أن يصف التلميذ الحياة اليومية والتنظيم الاجتماعي في مدينة إسلامية قبل 1500، وأن يقارنها بمجتمعه في كندا اليوم.
  en: Students describe daily life and social organisation in a Muslim city before 1500 and compare it with their own community in Canada today.
  ur: طلبہ سنہ 1500 سے پہلے کے ایک مسلم شہر کی روزمرہ زندگی اور معاشرتی نظم بیان کریں اور آج کینیڈا میں اپنی برادری سے اس کا موازنہ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: G4-SS
  course_title:
    ar: الدراسات الاجتماعية، الصف الرابع
    en: Social Studies, Grade 4
    ur: سوشل اسٹڈیز، جماعت چہارم
  grade: "4"
  strand: A
  strand_title:
    ar: "التراث والهوية: المجتمعات المبكرة حتى سنة 1500"
    en: "Heritage and Identity: Early Societies to 1500 CE"
    ur: "ورثہ اور شناخت: ابتدائی معاشرے 1500ء تک"
  expectations:
    - A1
    - A3
  expectation:
    ar: "يغطي الدرس مجتمعاتٍ مبكرة من خارج كندا بأمثلة من أربع مدن إسلامية قبل سنة 1500: تنظيمها السياسي والاجتماعي، وحياتها اليومية، وعلاقتها بالبيئة وبالمجتمعات الأخرى عبر التجارة، ثم يطلب من التلاميذ مقارنتها بمجتمعهم اليوم. يكمّل المعلم بمجتمع من الأمم الأولى ومجتمع إنويت كما يشترط المحور."
    en: "The lesson covers early societies outside Canada through four Muslim cities before 1500: their political and social organisation, daily life, and relations with the environment and with other societies through trade, then asks students to compare them with their own community today. The teacher pairs it with a First Nation and an Inuit society, as the strand requires."
    ur: "یہ سبق کینیڈا سے باہر کے ابتدائی معاشروں کو سنہ 1500 سے پہلے کے چار مسلم شہروں کی مثال سے پڑھاتا ہے: ان کا سیاسی اور معاشرتی نظم، روزمرہ زندگی، اور ماحول اور تجارت کے ذریعے دوسرے معاشروں سے تعلق، پھر طلبہ سے آج اپنی برادری کے ساتھ موازنہ کرواتا ہے۔ استاد اسے ایک فرسٹ نیشن اور ایک انوئٹ معاشرے کے ساتھ جوڑتا ہے جیسا کہ شاخ کا تقاضا ہے۔"
  document: "The Ontario Curriculum: Social Studies, Grades 1 to 6; History and Geography, Grades 7 and 8, 2023 (dcp.edu.gov.on.ca)"
  verified: 2026-10-23
rooms:
  - title:
      ar: "بغداد: مدينة دائرية جديدة"
      en: "Baghdad: a new round city"
      ur: "بغداد: ایک نیا گول شہر"
    body:
      ar: كيف أُسست بغداد، ومن سكنها، ولماذا صارت كبيرة.
      en: How Baghdad was founded, who lived in it and why it grew so large.
      ur: بغداد کیسے بسا، اس میں کون رہتا تھا اور وہ اتنا بڑا کیوں ہوا۔
    features:
      - place/baghdad
      - event/founding-of-baghdad
  - title:
      ar: "بيت الحكمة: مكتبة المدينة"
      en: "The House of Wisdom: the city's library"
      ur: "بیت الحکمہ: شہر کی لائبریری"
    body:
      ar: "مكان للكتب والترجمة: من عمل فيه وما كان يفعل."
      en: "A place for books and translation: who worked there and what they did."
      ur: "کتابوں اور ترجمے کی جگہ: وہاں کون کام کرتا تھا اور کیا کرتا تھا۔"
    features:
      - building/bayt-al-hikma
  - title:
      ar: "قرطبة: مدينة في الأندلس"
      en: "Cordoba: a city in al-Andalus"
      ur: "قرطبہ: اندلس کا ایک شہر"
    body:
      ar: مدينة أوروبية حكمها المسلمون قرونًا، وعاش فيها مسلمون ونصارى ويهود.
      en: A European city ruled by Muslims for centuries, where Muslims, Christians and Jews lived.
      ur: ایک یورپی شہر جس پر صدیوں مسلمانوں نے حکومت کی، جہاں مسلمان، مسیحی اور یہودی رہتے تھے۔
    features:
      - place/cordoba
  - title:
      ar: جامع قرطبة
      en: The Great Mosque of Cordoba
      ur: قرطبہ کی جامع مسجد
    body:
      ar: "مبنى كبير بأقواسه الشهيرة: كيف بُني وفيم استُعمل."
      en: "A great building with its famous arches: how it was built and what it was used for."
      ur: "اپنی مشہور محرابوں والی ایک بڑی عمارت: کیسے بنی اور کس کام آئی۔"
    features:
      - building/great-mosque-cordoba
  - title:
      ar: القاهرة والأزهر
      en: Cairo and al-Azhar
      ur: قاہرہ اور الازہر
    body:
      ar: مدينة على النيل، ومسجد صار مدرسة يتعلّم فيها الناس حتى اليوم.
      en: A city on the Nile, and a mosque that became a school where people still study today.
      ur: نیل کے کنارے ایک شہر، اور ایک مسجد جو مدرسہ بنی جہاں لوگ آج تک پڑھتے ہیں۔
    features:
      - place/cairo
      - building/al-azhar
  - title:
      ar: تمبكتو ومنسا موسى
      en: Timbuktu and Mansa Musa
      ur: تمبکتو اور منسا موسیٰ
    body:
      ar: مدينة على طرف الصحراء الكبرى، وملك مشهور سافر منها إلى مكة.
      en: A city at the edge of the Sahara, and a famous king who travelled from it to Mecca.
      ur: صحارا کے کنارے ایک شہر، اور ایک مشہور بادشاہ جو وہاں سے مکہ گیا۔
    features:
      - place/timbuktu
      - person/mansa-musa
  - title:
      ar: التجارة تربط المدن
      en: Trade links the cities
      ur: تجارت شہروں کو جوڑتی ہے
    body:
      ar: "القوافل والسفن والأسواق: كيف وصل الورق والذهب والملح والكتب من مدينة إلى مدينة."
      en: "Caravans, ships and markets: how paper, gold, salt and books travelled from city to city."
      ur: "قافلے، جہاز اور بازار: کاغذ، سونا، نمک اور کتابیں شہر سے شہر کیسے پہنچتی تھیں۔"
    features:
      - concept/trade-in-islam
  - title:
      ar: المسجد في وسط المدينة
      en: The mosque at the heart of the city
      ur: شہر کے بیچ میں مسجد
    body:
      ar: "مكان الصلاة والتعلّم واللقاء: ما تشترك فيه المساجد في المدن الأربع."
      en: "A place for prayer, learning and meeting: what the mosques of the four cities share."
      ur: "نماز، سیکھنے اور ملنے کی جگہ: چار شہروں کی مسجدوں میں کیا بات مشترک ہے۔"
    features:
      - concept/masjid-umum
outcomes:
  - text:
      ar: أسمّي أربع مدن إسلامية قبل سنة 1500 وأضعها على الخريطة.
      en: I can name four Muslim cities before 1500 and place them on a map.
      ur: میں سنہ 1500 سے پہلے کے چار مسلم شہروں کے نام لے سکتا ہوں اور انہیں نقشے پر رکھ سکتا ہوں۔
    steps:
      - 0
      - 2
      - 4
      - 5
  - text:
      ar: أصف كيف تعلّم الناس وتاجروا في هذه المدن.
      en: I can describe how people learned and traded in these cities.
      ur: میں بتا سکتا ہوں کہ ان شہروں میں لوگ کیسے سیکھتے اور تجارت کرتے تھے۔
    steps:
      - 1
      - 6
  - text:
      ar: أقارن حياة مدينة قديمة بحياة مجتمعي اليوم.
      en: I can compare life in an old city with my community today.
      ur: میں ایک پرانے شہر کی زندگی کا آج اپنی برادری سے موازنہ کر سکتا ہوں۔
    steps:
      - 7
worksheet:
  - prompt:
      ar: اختر مدينة من المدن الأربع. ما اسم نهرها أو صحراؤها، ومن كان يحكمها؟
      en: Choose one of the four cities. What river or desert is it near, and who governed it?
      ur: چار شہروں میں سے ایک چنیں۔ وہ کس دریا یا صحرا کے پاس ہے، اور اس پر کون حکومت کرتا تھا؟
    steps:
      - 0
      - 2
      - 4
      - 5
  - prompt:
      ar: ماذا كان يفعل الناس في بيت الحكمة؟ اكتب عملين.
      en: What did people do in the House of Wisdom? Write two jobs.
      ur: بیت الحکمہ میں لوگ کیا کرتے تھے؟ دو کام لکھیں۔
    steps:
      - 1
  - prompt:
      ar: ما البضائع التي سافرت بين المدن؟ ارسم قافلة وسمِّ ثلاث بضائع.
      en: Which goods travelled between the cities? Draw a caravan and name three goods.
      ur: شہروں کے بیچ کون سا سامان سفر کرتا تھا؟ ایک قافلہ بنائیں اور تین چیزوں کے نام لکھیں۔
    steps:
      - 6
  - prompt:
      ar: لماذا سافر منسا موسى من تمبكتو إلى مكة؟
      en: Why did Mansa Musa travel from Timbuktu to Mecca?
      ur: منسا موسیٰ تمبکتو سے مکہ کیوں گیا؟
    steps:
      - 5
  - prompt:
      ar: اكتب شيئًا يشبه حياتنا اليوم في هذه المدن، وشيئًا يختلف.
      en: Write one thing in these cities that is like our life today, and one thing that is different.
      ur: ان شہروں کی ایک بات لکھیں جو آج ہماری زندگی جیسی ہے، اور ایک جو الگ ہے۔
    steps:
      - 7
quiz:
  - q:
      ar: على أي نهر تقع بغداد؟
      en: On which river does Baghdad stand?
      ur: بغداد کس دریا پر ہے؟
    options:
      - ar: النيل
        en: The Nile
        ur: نیل
      - ar: دجلة
        en: The Tigris
        ur: دجلہ
      - ar: الفرات فقط
        en: Only the Euphrates
        ur: صرف فرات
      - ar: نهر النيجر
        en: The Niger
        ur: نائجر
    answer: 1
    teaches: 0
  - q:
      ar: ماذا كان يُعمل في بيت الحكمة؟
      en: What work was done at the House of Wisdom?
      ur: بیت الحکمہ میں کیا کام ہوتا تھا؟
    options:
      - ar: صناعة السفن
        en: Shipbuilding
        ur: جہاز بنانا
      - ar: الترجمة والنسخ
        en: Translation and copying
        ur: ترجمہ اور نقل
      - ar: تدريب الجند
        en: Training soldiers
        ur: سپاہیوں کی تربیت
      - ar: طبع الكتب بالآلة
        en: Printing books by machine
        ur: مشین سے کتابیں چھاپنا
    answer: 1
    teaches: 1
  - q:
      ar: في أي بلاد تقع قرطبة اليوم؟
      en: In which country is Cordoba today?
      ur: قرطبہ آج کس ملک میں ہے؟
    options:
      - ar: المغرب
        en: Morocco
        ur: مراکش
      - ar: مصر
        en: Egypt
        ur: مصر
      - ar: إسبانيا
        en: Spain
        ur: اسپین
      - ar: تركيا
        en: Türkiye
        ur: ترکی
    answer: 2
    teaches: 2
  - q:
      ar: إلى أين سافر منسا موسى من تمبكتو؟
      en: Where did Mansa Musa travel from Timbuktu?
      ur: منسا موسیٰ تمبکتو سے کہاں گیا؟
    options:
      - ar: إلى مكة
        en: To Mecca
        ur: مکہ
      - ar: إلى بغداد
        en: To Baghdad
        ur: بغداد
      - ar: إلى الصين
        en: To China
        ur: چین
      - ar: إلى روما
        en: To Rome
        ur: روم
    answer: 0
    teaches: 5
  - q:
      ar: ما الذي جمع المدن الأربع؟
      en: What linked the four cities?
      ur: چار شہروں کو کیا جوڑتا تھا؟
    options:
      - ar: لغة واحدة فقط
        en: Only one language
        ur: صرف ایک زبان
      - ar: ملك واحد
        en: One king
        ur: ایک بادشاہ
      - ar: البحر نفسه
        en: The same sea
        ur: ایک ہی سمندر
      - ar: التجارة والمساجد والعلم
        en: Trade, mosques and learning
        ur: تجارت، مسجدیں اور علم
    answer: 3
    teaches: 6
