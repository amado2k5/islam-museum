id: exhibit/pathway-g11-chw3m-mongols-and-after
class: exhibit
kind: lesson
label:
  ar: "المغول وما بعدهم: سقوط بغداد وعين جالوت وتيمور"
  en: "The Mongols and after: the fall of Baghdad, Ayn Jalut and Timur"
  ur: "منگول اور ان کے بعد: بغداد کا زوال، عین جالوت اور تیمور"
summary:
  ar: "مسار لمقرر CHW3M عن القرن الذي غيّر العالم الإسلامي: الغزوات المغولية، وسقوط بغداد سنة 1258، ووقوف المماليك في عين جالوت، وإسلام الإلخانيين، وابن خلدون يقرأ انهيار الدول، وسمرقند تيمور."
  en: "A CHW3M pathway on the century that changed the Muslim world: the Mongol invasions, the fall of Baghdad in 1258, the Mamluk stand at Ayn Jalut, the Ilkhans' conversion, Ibn Khaldun reading the collapse of states, and Timur's Samarqand."
  ur: "CHW3M کا ایک راستہ اس صدی پر جس نے مسلم دنیا بدل دی: منگول حملے، 1258 میں بغداد کا زوال، عین جالوت میں مملوکوں کا ڈٹ جانا، ایلخانوں کا قبولِ اسلام، ابن خلدون کا ریاستوں کے زوال کو پڑھنا، اور تیمور کا سمرقند۔"
audience:
  - teacher
  - student
level: deep
duration_minutes: 75
wings: []
goal:
  ar: أن يفسّر الطالب دور العوامل الداخلية والخارجية في انحدار دولةٍ (الخلافة العباسية) وفي قيام أخرى من الصدمة نفسها (المماليك، التيموريون).
  en: Students explain the part of internal and external factors in the decline of one state (the Abbasid caliphate) and in the rise of others out of the same shock (the Mamluks, the Timurids).
  ur: طلبہ ایک ریاست (عباسی خلافت) کے زوال اور اسی صدمے سے دوسری ریاستوں (مملوک، تیموری) کے عروج میں اندرونی اور بیرونی عوامل کا کردار بیان کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHW3M
  course_title:
    ar: تاريخ العالم حتى نهاية القرن الخامس عشر، الصف 11، إعداد جامعي/كلّي
    en: World History to the End of the Fifteenth Century, Grade 11, University/College Preparation
    ur: پندرہویں صدی کے اختتام تک دنیا کی تاریخ، جماعت 11، یونیورسٹی/کالج تیاری
  grade: "11"
  strand: D
  strand_title:
    ar: حضارات في انحدار
    en: Civilizations in Decline
    ur: زوال پذیر تہذیبیں
  expectations:
    - D1
    - D2
  expectation:
    ar: "يقدّم الدرس الخلافة العباسية في القرن الثالث عشر واحدةً من الحضارات المنحدرة التي يطلبها المحور: العوامل الاجتماعية والسياسية الداخلية، وأثر العلاقة بمجتمع خارجي (المغول) في الانحدار، وما جرى للناس في بغداد، ثم كيف ردّت مجتمعات أخرى (المماليك، الإلخانيون بعد إسلامهم) وكيف قرأ ابن خلدون الظاهرة."
    en: "The lesson presents the Abbasid caliphate in the thirteenth century as one of the declining civilisations the strand requires: the internal social and political factors, the effect of relations with an outside society (the Mongols) on the decline, what happened to the people of Baghdad, then how other societies responded (the Mamluks, the Ilkhans after their conversion) and how Ibn Khaldun read the phenomenon."
    ur: "یہ سبق تیرہویں صدی کی عباسی خلافت کو شاخ کی مطلوبہ زوال پذیر تہذیبوں میں سے ایک کے طور پر پیش کرتا ہے: اندرونی معاشرتی اور سیاسی عوامل، ایک بیرونی معاشرے (منگول) سے تعلق کا زوال پر اثر، بغداد کے لوگوں پر کیا گزری، پھر دوسرے معاشروں (مملوک، قبولِ اسلام کے بعد ایلخان) نے کیا جواب دیا اور ابن خلدون نے اس مظہر کو کیسے پڑھا۔"
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: الإمبراطورية المغولية
      en: The Mongol empire
      ur: منگول سلطنت
    body:
      ar: "من السهوب إلى أكبر إمبراطورية برّية متصلة: من هم المغول وكيف حاربوا."
      en: "From the steppe to the largest contiguous land empire: who the Mongols were and how they fought."
      ur: "میدانوں سے سب سے بڑی متصل زمینی سلطنت تک: منگول کون تھے اور کیسے لڑتے تھے۔"
    features:
      - polity/mongol-empire
  - title:
      ar: الغزوات
      en: The invasions
      ur: حملے
    body:
      ar: "خوارزم وخراسان أولًا: ما تصفه المصادر العربية والفارسية."
      en: "Khwarazm and Khurasan first: what the Arabic and Persian sources describe."
      ur: "پہلے خوارزم اور خراسان: عربی اور فارسی ماخذ کیا بیان کرتے ہیں۔"
    features:
      - event/mongol-invasions
  - title:
      ar: سقوط بغداد 1258
      en: The fall of Baghdad, 1258
      ur: بغداد کا زوال، 1258
    body:
      ar: "هولاكو أمام المدينة، ونهاية الخلافة فيها: الحدث وأرقامه المتضاربة."
      en: "Hulagu before the city and the end of the caliphate there: the event and its conflicting numbers."
      ur: "شہر کے سامنے ہلاکو اور وہاں خلافت کا خاتمہ: واقعہ اور اس کے متضاد اعداد۔"
    features:
      - event/sack-of-baghdad-656
  - title:
      ar: عين جالوت 1260
      en: Ayn Jalut, 1260
      ur: عین جالوت، 1260
    body:
      ar: "المماليك يوقفون التقدم المغولي في فلسطين: لماذا نجحوا."
      en: "The Mamluks halt the Mongol advance in Palestine: why they succeeded."
      ur: "مملوک فلسطین میں منگول پیش قدمی روک دیتے ہیں: وہ کیوں کامیاب ہوئے۔"
    features:
      - event/ayn-jalut-658
  - title:
      ar: الإلخانيون
      en: The Ilkhanate
      ur: ایلخانی
    body:
      ar: دولة مغولية في إيران والعراق تدخل الإسلام بعد جيلين.
      en: A Mongol state in Iran and Iraq that embraces Islam within two generations.
      ur: ایران اور عراق میں ایک منگول ریاست جو دو نسلوں میں اسلام قبول کرتی ہے۔
    features:
      - polity/ilkhanate
  - title:
      ar: دولة المماليك
      en: The Mamluk state
      ur: مملوک ریاست
    body:
      ar: "القاهرة عاصمة العالم الإسلامي بعد بغداد: الجند والعلم والعمارة."
      en: "Cairo as the capital of the Muslim world after Baghdad: soldiers, learning and architecture."
      ur: "بغداد کے بعد مسلم دنیا کا دارالحکومت قاہرہ: سپاہی، علم اور فنِ تعمیر۔"
    features:
      - polity/mamluk-sultanate
  - title:
      ar: ابن خلدون والمقدمة
      en: Ibn Khaldun and the Muqaddima
      ur: ابن خلدون اور مقدمہ
    body:
      ar: "مؤرخ من القرن الرابع عشر يسأل: لماذا تقوم الدول وتسقط؟"
      en: A fourteenth-century historian asks why states rise and fall.
      ur: "چودہویں صدی کا ایک مؤرخ پوچھتا ہے: ریاستیں کیوں بنتی اور گرتی ہیں؟"
    features:
      - person/ibn-khaldun
      - work/al-muqaddima
  - title:
      ar: تيمور وسمرقند
      en: Timur and Samarqand
      ur: تیمور اور سمرقند
    body:
      ar: فاتح جديد من آسيا الوسطى، وعاصمة تُبنى بالمعماريين المجلوبين.
      en: A new conqueror from Central Asia, and a capital built with architects brought from afar.
      ur: وسطی ایشیا کا ایک نیا فاتح، اور دور سے لائے گئے معماروں سے بنتا ایک دارالحکومت۔
    features:
      - polity/timurid-empire
      - place/samarqand
outcomes:
  - text:
      ar: أذكر عوامل داخلية وخارجية في انحدار الخلافة العباسية.
      en: I can name internal and external factors in the decline of the Abbasid caliphate.
      ur: میں عباسی خلافت کے زوال کے اندرونی اور بیرونی عوامل بتا سکتا ہوں۔
    steps:
      - 1
      - 2
  - text:
      ar: أشرح كيف خرج من الصدمة المغولية مجتمعان على الأقل بصورتين مختلفتين.
      en: I can explain how at least two societies came out of the Mongol shock in different ways.
      ur: میں بتا سکتا ہوں کہ کم سے کم دو معاشرے منگول صدمے سے الگ الگ طریقوں سے کیسے نکلے۔
    steps:
      - 3
      - 4
      - 5
      - 7
  - text:
      ar: أستعمل مفهومًا من ابن خلدون لقراءة حدث تاريخي.
      en: I can use one concept from Ibn Khaldun to read a historical event.
      ur: میں ابن خلدون کا ایک تصور ایک تاریخی واقعے کو پڑھنے کے لیے استعمال کر سکتا ہوں۔
    steps:
      - 6
worksheet:
  - prompt:
      ar: ما العوامل التي أضعفت الخلافة العباسية قبل وصول المغول؟
      en: What factors had weakened the Abbasid caliphate before the Mongols arrived?
      ur: منگولوں کے آنے سے پہلے عباسی خلافت کو کن عوامل نے کمزور کیا تھا؟
    steps:
      - 1
      - 2
  - prompt:
      ar: لماذا تتضارب أرقام القتلى في سقوط بغداد بين المصادر؟ ماذا نفعل بأرقام متضاربة؟
      en: Why do the sources' death tolls for the fall of Baghdad conflict? What do we do with conflicting numbers?
      ur: بغداد کے زوال کی ہلاکتوں کے اعداد ماخذ میں کیوں متضاد ہیں؟ متضاد اعداد کے ساتھ ہم کیا کریں؟
    steps:
      - 2
  - prompt:
      ar: لماذا استطاع المماليك ما لم يستطعه غيرهم في عين جالوت؟
      en: Why could the Mamluks do at Ayn Jalut what others could not?
      ur: عین جالوت میں مملوک وہ کیوں کر سکے جو دوسرے نہ کر سکے؟
    steps:
      - 3
  - prompt:
      ar: ما معنى أن يدخل الغالب (الإلخانيون) دين المغلوب؟
      en: What does it mean that the conqueror (the Ilkhans) took the religion of the conquered?
      ur: فاتح (ایلخانوں) کے مفتوح کا مذہب اختیار کرنے کا کیا مطلب ہے؟
    steps:
      - 4
  - prompt:
      ar: اشرح بكلماتك فكرة «العصبية» عند ابن خلدون وطبّقها على دولة واحدة من المسار.
      en: Explain Ibn Khaldun's idea of 'asabiyya in your own words and apply it to one state in the pathway.
      ur: ابن خلدون کے «عصبیت» کے خیال کو اپنے الفاظ میں بیان کریں اور راستے کی ایک ریاست پر لاگو کریں۔
    steps:
      - 6
quiz:
  - q:
      ar: في أي سنة سقطت بغداد في يد هولاكو؟
      en: In which year did Baghdad fall to Hulagu?
      ur: بغداد ہلاکو کے ہاتھ کب گرا؟
    options:
      - ar: "1099"
        en: "1099"
        ur: "1099"
      - ar: "1187"
        en: "1187"
        ur: "1187"
      - ar: "1258"
        en: "1258"
        ur: "1258"
      - ar: "1453"
        en: "1453"
        ur: "1453"
    answer: 2
    teaches: 2
  - q:
      ar: ماذا جرى في عين جالوت سنة 1260؟
      en: What happened at Ayn Jalut in 1260?
      ur: 1260 میں عین جالوت میں کیا ہوا؟
    options:
      - ar: أوقف المماليك التقدم المغولي
        en: The Mamluks halted the Mongol advance
        ur: مملوکوں نے منگول پیش قدمی روکی
      - ar: سقطت القاهرة
        en: Cairo fell
        ur: قاہرہ گر گیا
      - ar: تأسست بغداد
        en: Baghdad was founded
        ur: بغداد کی بنیاد پڑی
      - ar: فتح العثمانيون القسطنطينية
        en: The Ottomans took Constantinople
        ur: عثمانیوں نے قسطنطنیہ فتح کیا
    answer: 0
    teaches: 3
  - q:
      ar: ماذا فعل الإلخانيون بعد جيلين من حكم إيران والعراق؟
      en: What did the Ilkhans do after two generations ruling Iran and Iraq?
      ur: ایران اور عراق پر دو نسلوں کی حکومت کے بعد ایلخانوں نے کیا کیا؟
    options:
      - ar: عادوا إلى منغوليا
        en: Returned to Mongolia
        ur: منگولیا واپس گئے
      - ar: دخلوا الإسلام
        en: Embraced Islam
        ur: اسلام قبول کیا
      - ar: اتحدوا مع الفرنج
        en: United with the Franks
        ur: فرنگیوں سے اتحاد کیا
      - ar: أعادوا الخلافة إلى بغداد
        en: Restored the caliphate in Baghdad
        ur: بغداد میں خلافت بحال کی
    answer: 1
    teaches: 4
  - q:
      ar: ما السؤال الذي يطرحه ابن خلدون في المقدمة؟
      en: What question does Ibn Khaldun ask in the Muqaddima?
      ur: ابن خلدون مقدمے میں کیا سوال اٹھاتا ہے؟
    options:
      - ar: كيف تُبنى السفن
        en: How ships are built
        ur: جہاز کیسے بنتے ہیں
      - ar: أين تقع الهند
        en: Where India lies
        ur: ہندوستان کہاں ہے
      - ar: ما طول نهر النيل
        en: How long the Nile is
        ur: نیل کتنا لمبا ہے
      - ar: لماذا تقوم الدول وتسقط
        en: Why states rise and fall
        ur: ریاستیں کیوں بنتی اور گرتی ہیں
    answer: 3
    teaches: 6
  - q:
      ar: أي مدينة جعلها تيمور عاصمته؟
      en: Which city did Timur make his capital?
      ur: تیمور نے کس شہر کو دارالحکومت بنایا؟
    options:
      - ar: بغداد
        en: Baghdad
        ur: بغداد
      - ar: القاهرة
        en: Cairo
        ur: قاہرہ
      - ar: سمرقند
        en: Samarqand
        ur: سمرقند
      - ar: دلهي
        en: Delhi
        ur: دہلی
    answer: 2
    teaches: 7
