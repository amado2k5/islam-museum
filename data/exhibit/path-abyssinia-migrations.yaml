- east-africa
rooms:
- title:
    ar: لماذا خرجوا؟
    en: "Why Did They Leave?"
  body:
    ar: 'السياق: الأذى الذي سبق الهجرة.'
    en: "The context: the harm that preceded the emigration."
  features:
  - event/persecution-of-mustadafin
- title:
    ar: الهجرة الأولى
    en: "The First Emigration"
  body:
    ar: من خرج، ومتى، وكيف.
    en: "Who left, when, and how."
  features:
  - event/first-migration-to-abyssinia
- title:
    ar: الملك الذي آواهم
    en: "The King Who Sheltered Them"
  body:
    ar: من هو النجاشي كما تقدّمه الصفحة، وما قيل في إسلامه.
    en: "Who the Negus is as the page presents him, and what is said about his Islam."
  features:
  - person/negus-of-aksum
- title:
    ar: الهجرة الثانية
    en: "The Second Emigration"
  body:
    ar: من خرج ثانية وما فعلت قريش.
    en: "Who left a second time, and what Quraysh did."
  features:
  - event/second-migration-to-abyssinia
- title:
    ar: جعفر بن أبي طالب
    en: "Ja'far ibn Abi Talib"
  body:
    ar: الذي تكلّم أمام الملك باسم المهاجرين.
    en: "The one who spoke before the king on the emigrants' behalf."
  features:
  - person/jafar-ibn-abi-talib
- title:
    ar: مهاجرو الحبشة
    en: "The Emigrants to Abyssinia"
  body:
    ar: كيف يصنّفهم ابن إسحاق بحسب عودتهم.
    en: "How Ibn Ishaq classifies them by their return."
  features:
  - concept/muhajirun-of-abyssinia
- title:
    ar: حالةٌ مختلفة
    en: "A Different Case"
  body:
    ar: ليس كل من خرج بقي على إسلامه كما يروي ابن إسحاق، وتنبّه إلى أن الكتاب لا يؤرّخ الواقعة.
    en: "Not everyone who left remained Muslim, as Ibn Ishaq relates; note that the book does not date the event."
  features:
  - event/ubaydullah-ibn-jahsh-leaves-islam-in-abyssinia
- title:
    ar: أم حبيبة
    en: "Umm Habiba"
  body:
    ar: من هاجرت وعادت وصارت من أمهات المؤمنين.
    en: "One who emigrated, returned, and became a Mother of the Believers."
  features:
  - person/umm-habiba-bint-abi-sufyan
- title:
    ar: أسماء بنت عميس
    en: "Asma bint Umays"
  body:
