id: exhibit/path-abyssinia-migrations
class: exhibit
kind: lesson
label:
  ar: الهجرتان إلى الحبشة
  en: "The Two Emigrations to Abyssinia"
summary:
  ar: 'درسٌ قصير عن الخروج الأول من مكة: لماذا ذهبوا إلى الحبشة، ومن آواهم، وما جرى هناك، وكيف عادوا، مع الروايات المختلفة عن عودتهم.'
  en: "A short lesson on the first departure from Mecca: why they went to Abyssinia, who sheltered them, what happened there and how they returned, with the differing accounts of their return."
audience:
- student
duration_minutes: 25
wings:
- time
- people
periods:
- period/prophetic-era
regions:
