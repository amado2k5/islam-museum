    en: "Its account on the page, according to Ibn Ishaq."
  features:
  - event/return-of-abyssinian-emigrants
- title:
    ar: رواية أخرى لقدوم جعفر
    en: "Another Account of Ja'far's Arrival"
  body:
    ar: خبر ينقله ابن هشام عن غير ابن إسحاق؛ قارن بين الصفحتين.
    en: "A report Ibn Hisham transmits from other than Ibn Ishaq; compare the two pages."
  features:
  - event/jafar-arrival-at-khaybar
