label:
  ar: الهجرتان إلى الحبشة
  en: "The Two Emigrations to Abyssinia"
  es: "Las dos emigraciones a Abisinia"
  fr: "Les deux émigrations vers l'Abyssinie"
  ur: "حبشہ کی طرف دو ہجرتیں"
  tr: "Habeşistan'a yapılan iki göç"
  id: "Dua migrasi ke Abyssinia"
summary:
  ar: 'درسٌ قصير عن الخروج الأول من مكة: لماذا ذهبوا إلى الحبشة، ومن آواهم، وما جرى هناك، وكيف عادوا، مع الروايات المختلفة عن عودتهم.'
  en: "A short lesson on the first departure from Mecca: why they went to Abyssinia, who sheltered them, what happened there and how they returned, with the differing accounts of their return."
  es: "Una breve lección sobre la primera partida de La Meca: por qué fueron a Abisinia, quién los acogió, qué sucedió allí y cómo regresaron, con los diferentes relatos de su regreso."
  fr: "Un bref aperçu du premier départ de La Mecque: pourquoi ils sont allés en Abyssinie, qui les a abrités, ce qui s’est passé là-bas et comment ils sont revenus, avec les différents récits de leur retour."
  ur: "مکہ سے پہلی روانگی پر ایک مختصر سبق: وہ حبشہ کیوں گئے، کس نے انہیں پناہ دی، وہاں کیا ہوا اور کیسے واپس آئے، ان کی واپسی کے مختلف بیانات کے ساتھ۔"
  tr: "Mekke'den ilk Mısır'dan çıkış hakkında kısa bir ders: Neden Habeşistan'a gittiler, kimler onlara sığınak sağladı, orada neler oldu ve nasıl geri döndüler, ayrıca dönüşlerine dair farklı anlatımlar."
  id: "Pelajaran singkat tentang eksodus pertama dari Mekah: mengapa mereka pergi ke Abyssinia, siapa yang memberi mereka perlindungan, apa yang terjadi di sana, dan bagaimana mereka kembali, beserta berbagai versi cerita tentang kepulangan mereka."
