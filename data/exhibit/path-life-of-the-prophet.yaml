label:
  ar: "سيرة النبي: من الفيل إلى الوفاة"
  en: "The Prophet's Life: From the Elephant to the Passing"
summary:
  ar: "مسار في حياة النبي محمد في اثني عشر مقاماً: مولده عام الفيل، والوحي بغار حراء، وبيعة العقبة، والهجرة، وبناء المدينة، وبدر وأحد والخندق، والحديبية، وفتح مكة، وحجة الوداع، وعام الوفود، ثم الوفاة — كما ترويه صفحات المتحف المرتبة على الأحداث."
  en: "A trail through the Prophet Muhammad's life in twelve stations: his birth in the Year of the Elephant, the revelation in the cave of Hira, the Aqaba pledges, the Hijra, the building of Medina, Badr, Uhud and the Trench, Hudaybiyya, the conquest of Mecca, the Farewell Pilgrimage, the Year of Delegations, and the passing — as the museum's pages tell them in order."
audience:
- newcomer
- student
duration_minutes: 60
wings:
- people
- time
periods:
- period/pre-islamic-arabia
- period/prophetic-era
regions:
