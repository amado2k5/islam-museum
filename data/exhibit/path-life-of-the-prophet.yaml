    ar: "بيعة العقبة"
    en: "The Pledges of Aqaba"
  body:
    ar: "وفود من يثرب تبايع النبي، ويمهد الأنصار دار الهجرة."
    en: "Delegations from Yathrib pledge to the Prophet, preparing the city of the Hijra."
  features:
  - event/pledges-of-aqaba
- title:
