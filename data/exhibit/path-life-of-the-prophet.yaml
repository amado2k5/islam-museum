  body:
    ar: "في غار حراء ينزل الوحي، وتبدأ ثلاث وعشرون سنة من الدعوة."
    en: "In the cave of Hira the revelation descends, opening twenty-three years of the call."
  features:
  - event/first-revelation
  - place/ghar-hira
- title:
    ar: "الدعوة والأذى"
    en: "The Call and the Hurt"
  body:
