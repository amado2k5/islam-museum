label:
  ar: "سيرة النبي: من الفيل إلى الوفاة"
  en: "The Prophet's Life: From the Elephant to the Passing"
  es: "La vida del profeta: del elefante al fallecimiento"
  fr: "La vie du Prophète: De l'éléphant à la mort"
  ur: "پیغمبر کی زندگی: ہاتھی سے گزرنے تک"
summary:
  ar: "مسار في حياة النبي محمد في اثني عشر مقاماً: مولده عام الفيل، والوحي بغار حراء، وبيعة العقبة، والهجرة، وبناء المدينة، وبدر وأحد والخندق، والحديبية، وفتح مكة، وحجة الوداع، وعام الوفود، ثم الوفاة — كما ترويه صفحات المتحف المرتبة على الأحداث."
  en: "A trail through the Prophet Muhammad's life in twelve stations: his birth in the Year of the Elephant, the revelation in the cave of Hira, the Aqaba pledges, the Hijra, the building of Medina, Badr, Uhud and the Trench, Hudaybiyya, the conquest of Mecca, the Farewell Pilgrimage, the Year of Delegations, and the passing — as the museum's pages tell them in order."
  es: "Un recorrido por la vida del Profeta Mahoma en doce etapas: su nacimiento en el Año del Elefante, la revelación en la cueva de Hira, las promesas de Aqaba, la Hégira, la construcción de Medina, Badr, Uhud y la Trinchera, Hudaybiyya, la conquista de La Meca, la Peregrinación de Despedida, el Año de las Delegaciones y el fallecimiento, tal como se narran en orden en las páginas del museo."
  fr: "Un parcours à travers la vie du prophète Mahomet en douze étapes: sa naissance durant l'année de l'Éléphant, la révélation dans la grotte de Hira, les serments d'Aqaba, l'Hégire, la construction de Médine, Badr, Uhud et le Fossé, Hudaybiyya, la conquête de La Mecque, le pèlerinage d'adieu, l'année des délégations et le décès — tels que les pages du musée les racontent dans l'ordre."
  ur: "بارہ مقامات پر پیغمبر اسلام کی زندگی کا ایک پگڈنڈی: ہاتھی کے سال میں آپ کی پیدائش، غار حرا میں نزول، عقبہ عہد، ہجرت، مدینہ کی تعمیر، بدر، احد اور خندق، حدیبیہ، فتح مکہ، الوداعی حج کا سال، حج کا سال، حج کا صفحہ انہیں ترتیب سے بتائیں."
