id: exhibit/pathway-g11-chw3m-crusades-muslim-side
class: exhibit
kind: lesson
label:
  ar: الحروب الصليبية من الجانب الإسلامي (1099–1291)
  en: The Crusades from the Muslim side (1099–1291)
  ur: صلیبی جنگیں مسلم زاویے سے (1099–1291)
summary:
  ar: "مسار لمقرر CHW3M يروي قرنَي الحروب الصليبية كما كتبها المؤرخون المسلمون: سقوط القدس سنة 1099، وزنكي ونور الدين، وصلاح الدين وحطين ودخول القدس سنة 1187، والأيوبيون والمماليك حتى نهاية الممالك الصليبية."
  en: "A CHW3M pathway telling the two crusading centuries as Muslim historians wrote them: the fall of Jerusalem in 1099, Zangi and Nur al-Din, Salah al-Din, Hattin and the entry into Jerusalem in 1187, the Ayyubids and the Mamluks to the end of the crusader states."
  ur: "CHW3M کا ایک راستہ جو صلیبی جنگوں کی دو صدیاں مسلم مؤرخین کے قلم سے بیان کرتا ہے: 1099 میں یروشلم کا زوال، زنگی اور نور الدین، صلاح الدین، حطین اور 1187 میں یروشلم میں داخلہ، ایوبی اور مملوک صلیبی ریاستوں کے خاتمے تک۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب التفاعل بين مجتمعات متخاصمة قبل 1500 من منظور الطرف الذي قلّما يُروى في الصف، وأن يقارن بين روايتين لحدث واحد.
  en: Students analyse interaction between opposed societies before 1500 from the side rarely told in class, and compare two accounts of one event.
  ur: طلبہ 1500 سے پہلے متخالف معاشروں کے باہمی تعامل کا اس فریق کے زاویے سے تجزیہ کریں جو کلاس میں کم ہی سنایا جاتا ہے، اور ایک واقعے کے دو بیانوں کا موازنہ کریں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHW3M
  course_title:
    ar: تاريخ العالم حتى نهاية القرن الخامس عشر، الصف 11، إعداد جامعي/كلّي
    en: World History to the End of the Fifteenth Century, Grade 11, University/College Preparation
    ur: پندرہویں صدی کے اختتام تک دنیا کی تاریخ، جماعت 11، یونیورسٹی/کالج تیاری
  grade: "11"
  strand: E
  strand_title:
    ar: تراث الحضارات
    en: The Legacy of Civilizations
    ur: تہذیبوں کی میراث
  expectations:
    - E2
  expectation:
    ar: يدرس الدرس نوعًا من التفاعل بين المجتمعات قبل 1500، الحرب والصلح والتجارة في زمن الحروب الصليبية، من مصادر الطرف الإسلامي، ويطلب من الطالب أن يبيّن ما أفاد منه كل طرف وما تضرّر به، وأن يفسّر اختلاف الروايات باختلاف المنظور التاريخي.
    en: The lesson studies one kind of interaction between societies before 1500, war, truce and trade in the crusading age, from the sources of the Muslim side, and asks students to show what each side gained and lost and to explain differing accounts by differing historical perspective.
    ur: یہ سبق 1500 سے پہلے معاشروں کے باہمی تعامل کی ایک قسم، صلیبی دور کی جنگ، صلح اور تجارت، کو مسلم فریق کے ماخذ سے پڑھاتا ہے، اور طلبہ سے کہتا ہے کہ دکھائیں ہر فریق نے کیا پایا اور کیا کھویا، اور بیانوں کے فرق کو تاریخی نقطۂ نظر کے فرق سے سمجھائیں۔
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: عصر الحروب الصليبية
      en: The crusading age
      ur: صلیبی جنگوں کا دور
    body:
      ar: "الإطار الزمني والجغرافي: الشام ومصر بين 1099 و1291."
      en: "The frame in time and space: Syria and Egypt between 1099 and 1291."
      ur: "زمان و مکان کا خاکہ: 1099 اور 1291 کے بیچ شام اور مصر۔"
    features:
      - period/crusades-ayyubid-mamluk
  - title:
      ar: القدس 1099
      en: Jerusalem 1099
      ur: یروشلم 1099
    body:
      ar: ماذا كتب المؤرخون المسلمون عن دخول الفرنج المدينة.
      en: What Muslim historians wrote about the Franks' entry into the city.
      ur: مسلم مؤرخین نے فرنگیوں کے شہر میں داخلے کے بارے میں کیا لکھا۔
    features:
      - place/jerusalem
      - event/franks-jerusalem-492
  - title:
      ar: زنكي ونور الدين
      en: Zangi and Nur al-Din
      ur: زنگی اور نور الدین
    body:
      ar: "أميران من الموصل وحلب يجمعان الشام: الوحدة قبل الحرب."
      en: "Two amirs of Mosul and Aleppo unite Syria: unity before war."
      ur: "موصل اور حلب کے دو امیر شام کو جوڑتے ہیں: جنگ سے پہلے اتحاد۔"
    features:
      - person/imad-al-din-zangi
      - person/nur-al-din-mahmud-ibn-zangi
  - title:
      ar: صلاح الدين
      en: Salah al-Din
      ur: صلاح الدین
    body:
      ar: من كردي في خدمة نور الدين إلى سلطان مصر والشام.
      en: From a Kurd in Nur al-Din's service to sultan of Egypt and Syria.
      ur: نور الدین کی خدمت کے ایک کرد سے مصر و شام کے سلطان تک۔
    features:
      - person/salah-al-din-yusuf-ibn-ayyub
  - title:
      ar: حطين 1187
      en: Hattin, 1187
      ur: حطین 1187
    body:
      ar: "معركة يوم واحد قرّرت مصير مملكة: كيف تصفها المصادر العربية."
      en: "A one-day battle that decided a kingdom: how the Arabic sources describe it."
      ur: "ایک دن کی جنگ جس نے ایک سلطنت کا فیصلہ کیا: عربی ماخذ اسے کیسے بیان کرتے ہیں۔"
    features:
      - event/battle-of-hattin-583
  - title:
      ar: دخول القدس
      en: The entry into Jerusalem
      ur: یروشلم میں داخلہ
    body:
      ar: "شروط التسليم سنة 1187 مقارنة بسنة 1099: ما تقوله الروايتان."
      en: "The terms of surrender in 1187 compared with 1099: what the two accounts say."
      ur: "1187 کے ہتھیار ڈالنے کی شرائط 1099 کے مقابل: دونوں بیان کیا کہتے ہیں۔"
    features:
      - event/saladin-jerusalem-583
  - title:
      ar: الأيوبيون
      en: The Ayyubids
      ur: ایوبی
    body:
      ar: "أسرة صلاح الدين بعده: صلح وتجارة ومعاهدات مع الفرنج."
      en: "Salah al-Din's house after him: truces, trade and treaties with the Franks."
      ur: "صلاح الدین کے بعد ان کا خاندان: فرنگیوں سے صلح، تجارت اور معاہدے۔"
    features:
      - polity/ayyubid-dynasty
  - title:
      ar: المماليك ونهاية الممالك الصليبية
      en: The Mamluks and the end of the crusader states
      ur: مملوک اور صلیبی ریاستوں کا خاتمہ
    body:
      ar: دولة الجند تنهي الوجود الصليبي في الشام سنة 1291.
      en: The soldiers' state ends the crusader presence in Syria in 1291.
      ur: سپاہیوں کی ریاست 1291 میں شام میں صلیبی موجودگی ختم کرتی ہے۔
    features:
      - polity/mamluk-sultanate
outcomes:
  - text:
      ar: أرتّب الأحداث الكبرى بين 1099 و1291 وأسمّي أطرافها.
      en: I can order the main events between 1099 and 1291 and name the parties.
      ur: میں 1099 اور 1291 کے بیچ بڑے واقعات ترتیب دے سکتا ہوں اور فریقوں کے نام لے سکتا ہوں۔
    steps:
      - 0
      - 1
      - 4
      - 7
  - text:
      ar: أقارن روايتين لحدث واحد وأفسّر اختلافهما بالمنظور.
      en: I can compare two accounts of one event and explain their difference by perspective.
      ur: میں ایک واقعے کے دو بیانوں کا موازنہ کر سکتا ہوں اور ان کے فرق کو نقطۂ نظر سے سمجھا سکتا ہوں۔
    steps:
      - 1
      - 5
  - text:
      ar: أبيّن أن التفاعل في هذا العصر كان حربًا وصلحًا وتجارة معًا.
      en: I can show that interaction in this age was war, truce and trade at once.
      ur: میں دکھا سکتا ہوں کہ اس دور کا تعامل بیک وقت جنگ، صلح اور تجارت تھا۔
    steps:
      - 2
      - 3
      - 6
worksheet:
  - prompt:
      ar: كيف تصف المصادر العربية دخول الفرنج القدس سنة 1099؟ وكيف تصفه مصادر الفرنج التي درستها؟
      en: How do the Arabic sources describe the Franks' entry into Jerusalem in 1099, and how do the Frankish sources you studied describe it?
      ur: عربی ماخذ 1099 میں فرنگیوں کے یروشلم میں داخلے کو کیسے بیان کرتے ہیں، اور آپ کے پڑھے فرنگی ماخذ کیسے؟
    steps:
      - 1
  - prompt:
      ar: ما الذي فعله نور الدين قبل أن يستطيع أحدٌ مواجهة الفرنج؟ لماذا كان ذلك شرطًا؟
      en: What did Nur al-Din do before anyone could face the Franks, and why was it a precondition?
      ur: نور الدین نے فرنگیوں کا سامنا ممکن ہونے سے پہلے کیا کیا، اور وہ شرط کیوں تھی؟
    steps:
      - 2
  - prompt:
      ar: قارن شروط تسليم القدس سنة 1187 بما جرى سنة 1099.
      en: Compare the terms of Jerusalem's surrender in 1187 with what happened in 1099.
      ur: 1187 میں یروشلم کے ہتھیار ڈالنے کی شرائط کا 1099 کے واقعات سے موازنہ کریں۔
    steps:
      - 5
  - prompt:
      ar: اذكر مثالًا على التجارة أو المعاهدة بين الأيوبيين والفرنج.
      en: Give one example of trade or a treaty between the Ayyubids and the Franks.
      ur: ایوبیوں اور فرنگیوں کے بیچ تجارت یا معاہدے کی ایک مثال دیں۔
    steps:
      - 6
  - prompt:
      ar: لماذا يختلف اسم هذه الحروب بين اللغات؟ ماذا يكشف الاسم عن الراوي؟
      en: Why does the name of these wars differ between languages? What does the name reveal about the narrator?
      ur: ان جنگوں کا نام زبانوں میں الگ کیوں ہے؟ نام راوی کے بارے میں کیا ظاہر کرتا ہے؟
    steps:
      - 0
quiz:
  - q:
      ar: في أي سنة دخل الفرنج القدس أول مرة؟
      en: In which year did the Franks first enter Jerusalem?
      ur: فرنگی پہلی بار یروشلم میں کب داخل ہوئے؟
    options:
      - ar: "1099"
        en: "1099"
        ur: "1099"
      - ar: "1187"
        en: "1187"
        ur: "1187"
      - ar: "1258"
        en: "1258"
        ur: "1258"
      - ar: "1291"
        en: "1291"
        ur: "1291"
    answer: 0
    teaches: 1
  - q:
      ar: ماذا فعل نور الدين قبل مواجهة الفرنج؟
      en: What did Nur al-Din do before facing the Franks?
      ur: فرنگیوں کا سامنا کرنے سے پہلے نور الدین نے کیا کیا؟
    options:
      - ar: بنى أسطولًا
        en: Built a fleet
        ur: بحری بیڑا بنایا
      - ar: وحّد مدن الشام تحت حكمه
        en: United the cities of Syria under his rule
        ur: شام کے شہر اپنی حکومت میں جوڑے
      - ar: تحالف مع بيزنطة
        en: Allied with Byzantium
        ur: بازنطیہ سے اتحاد کیا
      - ar: انتقل إلى مصر
        en: Moved to Egypt
        ur: مصر چلا گیا
    answer: 1
    teaches: 2
  - q:
      ar: ما نتيجة معركة حطين سنة 1187؟
      en: What was the outcome of the battle of Hattin in 1187?
      ur: 1187 کی حطین کی جنگ کا نتیجہ کیا تھا؟
    options:
      - ar: انتصار الفرنج
        en: A Frankish victory
        ur: فرنگیوں کی فتح
      - ar: تعادل بلا نتيجة
        en: A stalemate
        ur: بے نتیجہ
      - ar: انتصار صلاح الدين ثم دخول القدس
        en: Salah al-Din's victory, then the entry into Jerusalem
        ur: صلاح الدین کی فتح، پھر یروشلم میں داخلہ
      - ar: سقوط دمشق
        en: The fall of Damascus
        ur: دمشق کا زوال
    answer: 2
    teaches: 4
  - q:
      ar: كيف تختلف رواية تسليم القدس سنة 1187 عن 1099 في المصادر؟
      en: How do the sources' accounts of Jerusalem's surrender in 1187 differ from 1099?
      ur: ماخذ میں 1187 میں یروشلم کے ہتھیار ڈالنے کا بیان 1099 سے کیسے مختلف ہے؟
    options:
      - ar: لا فرق بينهما
        en: There is no difference
        ur: کوئی فرق نہیں
      - ar: 1099 كانت بشروط و1187 بالقوة
        en: 1099 was by terms and 1187 by force
        ur: 1099 شرائط پر اور 1187 طاقت سے
      - ar: كلتاهما بلا قتال
        en: Both were without fighting
        ur: دونوں بغیر لڑائی
      - ar: 1187 كانت بشروط تسليم و1099 بدخول قسري
        en: 1187 was a negotiated surrender and 1099 a forced entry
        ur: 1187 طے شدہ ہتھیار ڈالنا اور 1099 جبری داخلہ
    answer: 3
    teaches: 5
  - q:
      ar: من أنهى الوجود الصليبي في الشام سنة 1291؟
      en: Who ended the crusader presence in Syria in 1291?
      ur: 1291 میں شام میں صلیبی موجودگی کس نے ختم کی؟
    options:
      - ar: المماليك
        en: The Mamluks
        ur: مملوک
      - ar: الأمويون
        en: The Umayyads
        ur: اموی
      - ar: العثمانيون
        en: The Ottomans
        ur: عثمانی
      - ar: المغول
        en: The Mongols
        ur: منگول
    answer: 0
    teaches: 7
