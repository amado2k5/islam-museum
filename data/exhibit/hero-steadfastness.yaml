- title:
    ar: "سلمان الفارسي"
    en: "Salman al-Farisi"
    ur: "سلمان فارسی"
    es: "Salman al-Farisi"
    fr: "Salman al-Farisi"
    tr: "Salman Al-Farsi"
    id: "Salman Al-Farsi"
  body:
    ar: "خرج من فارس يطلب الحق من أهل الكتاب إلى أهل الكتاب، حتى انتهى رقيقًا في يثرب فوجد ما كان يبحث عنه."
    en: "He left Persia seeking truth from teacher to teacher until he ended enslaved in Yathrib — and there found what he had been searching for."
    ur: "حق کی تلاش میں فارس سے استاد در استاد نکلے یہاں تک کہ یثرب میں غلام بن گئے — اور وہیں وہ پایا جو تلاش کرتے تھے۔"
    es: "Abandonó Persia en busca de la verdad, de maestro en maestro, hasta que acabó esclavizado en Yathrib, y allí encontró lo que había estado buscando."
    fr: "Il quitta la Perse en quête de vérité, allant de maître en maître, jusqu'à ce qu'il finisse esclave à Yathrib — et là, il trouva ce qu'il cherchait."
    tr: "Gerçeği Kitap Ehli'nden aramak için İran'ı terk etti ve sonunda Yathrib'de köle olarak yaşamaya başladı ve aradığını orada buldu."
    id: "Dia meninggalkan Persia untuk mencari kebenaran dari Ahli Kitab kepada Ahli Kitab, hingga akhirnya dia menjadi budak di Yathrib dan menemukan apa yang dicarinya."
  features:
  - person/salman-al-farisi
  - place/medina
- title:
    ar: "أبو بكر الصديق"
    en: "Abu Bakr al-Siddiq"
    ur: "ابو بکر صدیق"
    es: "Abu Bakr al-Siddiq"
    fr: "Abou Bakr al-Siddiq"
    tr: "Ebu Bekir el-Siddik"
    id: "Abu Bakr al-Siddiq"
  body:
    ar: "صاحب الغار: آمن حين شكّت الأرض، وثبّت الأمة بعد رحيل النبي بأقرب ما عند الناس وأشدّه."
    en: "The Companion of the Cave: he believed when the world doubted, and after the Prophet's death held the ummah firm with what people found hardest to bear."
    ur: "غار کے ساتھی: جب دنیا شک میں تھی ایمان لائے، اور نبی کی رحلت کے بعد سب سے مشکل کام کر کے امت کو ثابت رکھا۔"
    es: "El Compañero de la Cueva: creyó cuando el mundo dudaba, y tras la muerte del Profeta mantuvo firme a la ummah ante lo que a la gente le resultaba más difícil de soportar."
    fr: "Le Compagnon de la Caverne: il a cru quand le monde doutait, et après la mort du Prophète, il a maintenu la communauté musulmane ferme sur ce que les gens trouvaient le plus difficile à supporter."
    tr: "Mağaradaki arkadaş: Yer sarsıldığı zaman iman etti ve Peygamber'in vefatından sonra, insanlara en yakın ve en güçlü olanla ümmeti güçlendirdi."
    id: "Sahabat penghuni gua: Dia beriman ketika bumi bergetar, dan dia menguatkan umat setelah kepergian Nabi dengan apa yang paling dekat dan kuat bagi manusia."
  features:
  - person/abu-bakr
  - event/hijra
- title:
    ar: "عبد المطلب بن هاشم"
    en: "Abd al-Muttalib"
    ur: "عبدالمطلب"
    es: "Abd al-Muttalib"
    fr: "Abd al-Muttalib"
    tr: "Abdul Muttalib ibn Haşim"
    id: "Abdul Muttalib ibn Hashim"
  body:
    ar: "سيد قريش وصاحب زمزم: وقف لأبرهة يوم الفيل بكلمة لا تخاف، وحمل أمانة بيت الله حتى جاء النور."
    en: "Chief of Quraysh and keeper of Zamzam: he faced Abraha on the day of the Elephant with an unafraid word, and carried the trust of God's House until the light came."
    ur: "قریش کے سردار اور زمزم کے محافظ: ہاتھی والے دن ابرہہ کے سامنے بلا خوف کلام کیا، اور بیت اللہ کی امانت نبھائی یہاں تک کہ نور آ گیا۔"
    es: "Jefe de los Quraysh y guardián de Zamzam: se enfrentó a Abraha el día del Elefante con una palabra valiente, y llevó la confianza de la Casa de Dios hasta que llegó la luz."
    fr: "Chef des Quraysh et gardien de Zamzam: il affronta Abraha le jour de l'Éléphant avec une parole sans crainte, et porta la garde de la Maison de Dieu jusqu'à ce que la lumière vienne."
    tr: "Kureyş'in efendisi ve Zemzem kuyusunun sahibi: Fil felaketi gününde Abraha'ya karşı korkusuz olduğunu belirten bir sözle karşı çıktı ve Allah'ın evinin emanetini nur gelinceye kadar korudu."
    id: "Pemimpin suku Quraisy dan pemilik Zamzam: Ia menghadapi Abraha pada hari terjadinya peristiwa gajah dengan sebuah perkataan yang tak membuatnya takut, dan ia mengemban amanah Rumah Allah hingga cahaya datang."
