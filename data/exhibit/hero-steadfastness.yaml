label:
  ar: "أبطال الثبات"
  en: "Heroes of Steadfastness"
  ur: "ثابت قدمی کے ہیرو"
  es: "Héroes de la firmeza"
  fr: "Héros de la constance"
summary:
  ar: " 'مسار فيمن ثبتوا على الحق عقودًا حين اهتزت الدنيا: بلال الذي ما فتأ يقول أحدًا أحدًا تحت الصخرة، وسلمان باحث الحق الطويل، وأبو بكر الذي حسم أمر الأمة بعد رحيل النبي، وعبد المطلب قائد مكة وصاحب الكلمة يوم الفيل.'"
  en: " 'A trail of those who stood firm for decades while the world shook: Bilal who kept saying \"One, One\" beneath the boulder, Salman the lifelong seeker of truth, Abu Bakr who settled the ummah's affairs after the Prophet, and Abd al-Muttalib Mecca's leader on the day of the Elephant.'"
  ur: " 'ان لوگوں کا سفر جو دنیا کے ہلنے پر بھی برسوں حق پر قائم رہے: بلال جو چٹان تلے «احد، احد» کہتے رہے، سلمان حق کے طویل تلاشی، ابو بکر جنھوں نے نبی کے بعد امت کا معاملہ سنوارا، اور عبدالمطلب مکہ کے قائد اور ہاتھی والے دن کے صاحبِ کلام۔'"
  es: "«Una estela de aquellos que se mantuvieron firmes durante décadas mientras el mundo temblaba: Bilal, que seguía repitiendo \"Uno, Uno\" bajo la roca; Salman, el buscador de la verdad de toda la vida; Abu Bakr, que resolvió los asuntos de la ummah tras el Profeta; y Abd al-Muttalib, líder de La Meca en el día del Elefante»."
  fr: "« La trace de ceux qui sont restés fermes pendant des décennies alors que le monde tremblait: Bilal qui répétait sans cesse « Un, Un » sous le rocher, Salman, chercheur de vérité toute sa vie, Abu Bakr qui a réglé les affaires de la umma après le Prophète, et Abd al-Muttalib, le chef de La Mecque le jour de l'Éléphant. »"
