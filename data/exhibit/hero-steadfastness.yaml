    es: "Bilal ibn Rabah"
    fr: "Bilal ibn Rabah"
    tr: "Bilal ibn Rabah"
    id: "Bilal bin Rabah"
  body:
    ar: "عبدٌ حبشي عُذّب على رمضاء مكة وهو يقول أحدًا أحدًا، حتى صار مؤذن الإسلام الأول."
    en: "An Abyssinian bondsman tortured on Mecca's burning sand while he kept saying \"One, One\" — until he became Islam's first muezzin."
    ur: "ایک حبشی غلام جو مکہ کی تپتی ریت پر «احد، احد» کہتے تشدد جھیلتا رہا — یہاں تک کہ اسلام کے پہلے مؤذن بنے۔"
    es: "Un esclavo abisinio fue torturado en las ardientes arenas de La Meca mientras repetía \"Uno, uno\", hasta que se convirtió en el primer muecín del Islam."
    fr: "Un esclave abyssinien torturé sur le sable brûlant de La Mecque tout en répétant « Un, Un » — jusqu'à devenir le premier muezzin de l'islam."
    tr: "Habeşistanlı bir köle, Mekke'nin sıcak kumlarında \"Bir, bir\" diyerek işkence gördü ve sonunda İslam'ın ilk müezzini oldu."
    id: "Seorang budak dari Abyssinia disiksa di pasir panas Mekah sambil mengucapkan \"Satu, Satu,\" hingga ia menjadi muazin pertama dalam Islam."
