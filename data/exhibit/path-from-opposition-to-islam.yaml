label:
  ar: 'من الخصومة إلى الإسلام: من غيّروا موقفهم'
  en: "From Opposition to Islam: Those Who Changed Sides"
  es: "De la oposición al islam: aquellos que cambiaron de bando"
  fr: "De l'opposition à l'islam: ceux qui ont changé de camp"
  ur: "اسلام کی مخالفت سے: وہ لوگ جنہوں نے رخ بدلا۔"
summary:
  ar: مسارٌ عبر اثني عشر موضعًا من قصص من عارضوا الدعوة في مكة ثم دخلوا الإسلام، من عمر إلى مسلمة الفتح، ثم صنف «المؤلفة قلوبهم».
  en: "A trail through twelve places in the stories of those who opposed the call in Mecca and then entered Islam, from Umar to the Muslims of the conquest, and then the category of 'those whose hearts were to be reconciled'."
  es: "Un recorrido por doce momentos clave en las historias de quienes se opusieron al llamado en La Meca y luego se convirtieron al Islam, desde Umar hasta los musulmanes de la conquista, y luego la categoría de \"aquellos cuyos corazones debían reconciliarse\"."
  fr: "Un parcours à travers douze lieux dans les récits de ceux qui se sont opposés à l'appel à la conversion à La Mecque puis se sont convertis à l'islam, d'Umar aux musulmans de la conquête, puis la catégorie de « ceux dont les cœurs devaient être réconciliés »."
  ur: "مکہ میں دعوت کی مخالفت کرنے والوں اور پھر اسلام میں داخل ہونے والوں کی کہانیوں میں بارہ مقامات پر ایک پگڈنڈی، عمر سے لے کر فتح کے مسلمانوں تک، اور پھر 'جن کے دلوں میں صلح کرنی تھی' کے زمرے میں۔"
