  en: "From Opposition to Islam: Those Who Changed Sides"
summary:
  ar: مسارٌ عبر اثني عشر موضعًا من قصص من عارضوا الدعوة في مكة ثم دخلوا الإسلام، من عمر إلى مسلمة الفتح، ثم صنف «المؤلفة قلوبهم».
  en: "A trail through twelve places in the stories of those who opposed the call in Mecca and then entered Islam, from Umar to the Muslims of the conquest, and then the category of 'those whose hearts were to be reconciled'."
