rooms:
- title:
    ar: "علي بن أبي طالب"
    en: "Ali ibn Abi Talib"
    ur: "علی بن ابی طالب"
    es: "Ali ibn Abi Talib"
    fr: "Ali ibn Abi Talib"
  body:
    ar: "أول من أسلم من الفتيان، ونام في فراش النبي ليلة الهجرة فدىً له، وفارس بدر وأحد والخندق وخيبر."
    en: "The first boy to accept Islam; he slept in the Prophet's bed on the night of the Hijra to shield him, and was the knight of Badr, Uhud, the Trench and Khaybar."
    ur: "سب سے پہلے ایمان لانے والے لڑکے؛ ہجرت کی رات نبی کے بستر پر سو کر ان کی جان بچائی، اور بدر، احد، خندق اور خیبر کے فارس۔"
    es: "Fue el primer niño en aceptar el Islam; durmió en la cama del Profeta la noche de la Hégira para protegerlo, y fue el caballero de Badr, Uhud, la Trinchera y Khaybar."
    fr: "Le premier garçon à se convertir à l'islam ; il dormit dans le lit du Prophète la nuit de l'Hégire pour le protéger, et fut le chevalier de Badr, d'Uhud, du Fossé et de Khaybar."
  features:
  - person/ali-ibn-abi-talib
  - event/battle-of-badr
- title:
    ar: "خالد بن الوليد"
    en: "Khalid ibn al-Walid"
    ur: "خالد بن ولید"
    es: "Khalid ibn al-Walid"
    fr: "Khalid ibn al-Walid"
  body:
    ar: "سيف الله: لم يهزم في مئة واقعة، وقاد اليرموك أعظم فتوح المشرق وأشهدها خطةً."
    en: "The Sword of God: undefeated in a hundred engagements; at Yarmuk he led the greatest and best-planned of the eastern conquests."
    ur: "اللہ کی تلوار: سو معرکوں میں کبھی نہ ہرا؛ یرموک میں مشرقی فتحوں کی عظیم ترین اور بہترین منصوبہ بند قیادت کی۔"
    es: "La Espada de Dios: invicto en cien batallas; en Yarmuk lideró la mayor y mejor planificada de las conquistas orientales."
    fr: "L'Épée de Dieu: invaincu en cent combats ; à Yarmouk, il mena la plus grande et la mieux planifiée des conquêtes orientales."
  features:
  - person/khalid-ibn-al-walid
  - event/battle-of-yarmuk
- title:
    ar: "صلاح الدين الأيوبي"
    en: "Salah al-Din (Saladin)"
    ur: "صلاح الدین ایوبی"
    es: "Saladino"
    fr: "Salah al-Din (Saladin)"
  body:
    ar: "وحّد مصر والشام ثم كسر جيوش الصليب في حطين واسترد القدس، وكان في النصر عفوًا وفي الحرب أدبًا."
    en: "He united Egypt and Syria, broke the Crusader armies at Hattin and recovered Jerusalem — gracious in victory, chivalrous in war."
    ur: "مصر اور شام متحد کیے، حطین میں صلیبی فوجیں توڑیں اور بیت المقدس واپس لیا — فتح میں معاف کرنے والا اور جنگ میں اہل ادب۔"
    es: "Unificó Egipto y Siria, derrotó a los ejércitos cruzados en Hattin y recuperó Jerusalén; fue un caballero en la victoria y un guerrero en la guerra."
    fr: "Il unifia l'Égypte et la Syrie, brisa les armées croisées à Hattin et reconquit Jérusalem — gracieux dans la victoire, chevaleresque dans la guerre."
  features:
  - person/salah-al-din-yusuf-ibn-ayyub
  - event/battle-of-hattin-583
  - place/jerusalem
- title:
    ar: "عمر المختار"
    en: "Omar Mukhtar"
    ur: "عمر مختار"
    es: "Omar Mukhtar"
    fr: "Omar Mukhtar"
  body:
    ar: "شيخ المجاهدين: قاوم الاحتلال الإيطالي في برقة عشرين سنة وهو شيخ سبعيني، حتى شُنق ولم يستسلم."
    en: "The lion of the desert: he resisted the Italian occupation of Cyrenaica for twenty years as a seventy-year-old teacher, and was hanged without ever surrendering."
    ur: "صحرا کا شیر: ستر سالہ مدرس ہوکر بھی برقہ میں اطالوی قبضے کے خلاف بیس برس مزاحمت کرتا رہا اور پھانسی تک ہتھیار نہ ڈالے۔"
    es: "El león del desierto: resistió la ocupación italiana de Cirenaica durante veinte años siendo un maestro de setenta años, y fue ahorcado sin haberse rendido jamás."
    fr: "Le lion du désert: il résista pendant vingt ans à l'occupation italienne de la Cyrénaïque, alors qu'il était un enseignant de soixante-dix ans, et fut pendu sans jamais se rendre."
