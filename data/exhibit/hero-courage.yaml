label:
  ar: "أبطال الشجاعة"
  en: "Heroes of Courage"
  ur: "جرأت کے ہیرو"
  es: "Héroes de coraje"
  fr: "Héros du courage"
summary:
  ar: " 'مسار فيمن ثبتوا حين انهزم غيرهم وقادوا في أصعب الوقفات: علي باب مدينة العلم وفارس بدر، وخالد سيف الميادين، وصلاح الدين فارس حطين، وعمر المختار شيخ المجاهدين في الصحراء الليبية.'"
  en: " 'A trail of those who stood when others fell back and led at the hardest moments: Ali the gate of knowledge and knight of Badr, Khalid the sword of the battlefields, Saladin the knight of Hattin, and Omar Mukhtar the lion of the Libyan desert.'"
  ur: " 'ان لوگوں کا سفر جو دوسروں کے پسپا ہونے پر ثابت قدم رہے اور مشکل ترین موقعوں پر قیادت کی: علی علم کے دروازے اور بدر کے فارس، خالد میدانوں کی تلوار، صلاح الدین حطین کے فارس، اور عمر مختار لیبیا کے شیر۔'"
  es: "«Una estela de aquellos que se mantuvieron firmes cuando otros retrocedieron y lideraron en los momentos más difíciles: Ali, la puerta del conocimiento y caballero de Badr; Khalid, la espada de los campos de batalla; Saladino, el caballero de Hattin; y Omar Mukhtar, el león del desierto libio»."
  fr: "« Une lignée de ceux qui ont tenu bon quand les autres ont reculé et qui ont mené dans les moments les plus difficiles: Ali, la porte du savoir et chevalier de Badr, Khalid, l'épée des champs de bataille, Saladin, le chevalier de Hattin, et Omar Mukhtar, le lion du désert libyen. »"
