  fr: "Un chemin à travers la sourate de la Grande Nouvelle."
  ur: "عظیم خبر کی سورت کے ذریعے ایک پگڈنڈی."
  tr: "Sual Suresi'nde bir yol: Neyi soruyorlar, Büyük Haber ve Kıyamet resimlerle anlatılıyor — 'Amma'nın ilk bölümü sonuca ulaşmayı öğretiyor."
  id: "Sebuah uraian dalam Surah Al-Su'al: Apa yang mereka tanyakan, Kabar Gembira, dan Kebangkitan dalam bentuk gambar — bagian pertama dari 'Amma mengajarkan kesimpulannya."
