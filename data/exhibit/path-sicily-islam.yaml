rooms:
- title:
    ar: الفتح
    en: The conquest
    ur: فتح
  body:
    ar: 'يذكر البلاذري أن معاوية بن حديج الكندي غزا صقلية في أيام معاوية بن أبي سفيان، وكان أول من غزاها. {cite:futuh-buldan-maarif-1407 p.329} ثم فتح آل الأغلب بن سالم منها أكثر من عشرين مدينة، وفتح أحمد بن محمد بن الأغلب قصر يانة وحصن غليانة في خلافة المتوكل على الله. {cite:futuh-buldan-maarif-1407 p.329} وينقل ابن خلدون أن الجيش نزل مدينة مازر في «سنة اثنتي عشرة»، أي سنة 212هـ بحسب السياق. {cite:tarikh-ibn-khaldun-ibar p.1026}'
    en: 'Al-Baladhuri says that Mu''awiya ibn Hudayj al-Kindi raided Sicily in the days of Mu''awiya ibn Abi Sufyan, and was the first to raid it. {cite:futuh-buldan-maarif-1407 p.329} The house of al-Aghlab ibn Salim then opened more than twenty of its cities, and Ahmad ibn Muhammad ibn al-Aghlab took the palace of Yana and the fort of Ghalyana in the caliphate of al-Mutawakkil. {cite:futuh-buldan-maarif-1407 p.329} Ibn Khaldun says that the army landed at the town of Mazara in "the year twelve", which the context places in 212 AH. {cite:tarikh-ibn-khaldun-ibar p.1026}'
    ur: 'بلاذری بتاتے ہیں کہ معاویہ بن حدیج الکندی نے معاویہ بن ابی سفیان کے زمانے میں صقلیہ پر حملہ کیا، اور وہ پہلے شخص تھے جنہوں نے اس پر حملہ کیا۔ {cite:futuh-buldan-maarif-1407 p.329} پھر آلِ اغلب بن سالم نے اس کے بیس سے زیادہ شہر فتح کیے، اور احمد بن محمد بن الاغلب نے متوکل علی اللہ کی خلافت میں قصر یانہ اور حصن غلیانہ لیے۔ {cite:futuh-buldan-maarif-1407 p.329} ابن خلدون کہتے ہیں کہ فوج «سنۃ اثنتی عشرۃ» میں مازر میں اتری، جو سیاق کے مطابق 212ھ ہے۔ {cite:tarikh-ibn-khaldun-ibar p.1026}'
  features:
  - polity/emirate-of-sicily
  - place/siqilliya
- title:
    ar: باليرمو
    en: Palermo
    ur: پالرمو
  body:
    ar: 'ينقل ابن خلدون أن المسلمين حاصروا بليرم ثم فتحوها، ولا يذكر النص سنة الفتح في الموضع الذي قُرئ. {cite:tarikh-ibn-khaldun-ibar p.1026} وفي زمن ابن جبير كانت المدينة «حضرة صقلية»، مقرّ الملك، وقد شبّهها بقرطبة في البنيان. {cite:rihla-ibn-jubayr-1907 p.93} وكان للمسلمين فيها أرباض وقاض وجامع، وأكثر مساجدهم محاضر لمعلمي القرآن. {cite:rihla-ibn-jubayr-1907 p.92}'
    en: 'Ibn Khaldun says that the Muslims besieged Balarm and then opened it; the lines read here do not give the year of the opening. {cite:tarikh-ibn-khaldun-ibar p.1026} In Ibn Jubayr''s time the city was "the seat of Sicily", the king''s seat, and he compares its building to Cordoba''s. {cite:rihla-ibn-jubayr-1907 p.93} The Muslims there had quarters of their own, a qadi and a congregational mosque, and most of their mosques were used for teaching the Qur''an. {cite:rihla-ibn-jubayr-1907 p.92}'
    ur: 'ابن خلدون کے مطابق مسلمانوں نے بلیرم کا محاصرہ کیا، پھر اسے فتح کیا؛ یہاں پڑھی گئی سطروں میں فتح کا سال نہیں ہے۔ {cite:tarikh-ibn-khaldun-ibar p.1026} ابن جبیر کے زمانے میں یہ شہر «حضرۃ صقلیہ»، یعنی بادشاہ کا مقام تھا، اور وہ اس کی عمارتوں کو قرطبہ جیسا بتاتے ہیں۔ {cite:rihla-ibn-jubayr-1907 p.93} یہاں کے مسلمانوں کے الگ محلے، ایک قاضی اور ایک جامع مسجد تھی، اور زیادہ تر مساجد میں قرآن کی تعلیم ہوتی تھی۔ {cite:rihla-ibn-jubayr-1907 p.92}'
  features:
  - place/palermo
- title:
    ar: العلم والبساتين
    en: Learning and orchards
    ur: علم اور باغات
  body:
    ar: 'يصف الإدريسي صقلية بأنها «فريدة الزمان فضلاً ومحاسن»، ويذكر أن الرحالة من سائر الأقطار قصدوها وأجمعوا على تفضيلها. {cite:nuzhat-al-mushtaq-2002 p.588} وفي باليرمو ساحات وبسائط كلها بستان، كما يصفها ابن جبير. {cite:rihla-ibn-jubayr-1907 p.93} والمساجد نفسها كان أكثرها مجالس يحضرها معلّمو القرآن، كما ذكر ابن جبير. {cite:rihla-ibn-jubayr-1907 p.92}'
    en: 'Al-Idrisi calls Sicily "unique in its age for excellence and virtues", and says that travellers from every region came to it and agreed on its excellence. {cite:nuzhat-al-mushtaq-2002 p.588} In Palermo, Ibn Jubayr describes open squares and plains that are all orchards. {cite:rihla-ibn-jubayr-1907 p.93} Most of the city''s mosques, he records, were places where teachers of the Qur''an sat with their pupils. {cite:rihla-ibn-jubayr-1907 p.92}'
    ur: 'ادریسی صقلیہ کو «زمانے میں فضیلت اور خوبیوں میں یکتا» کہتے ہیں، اور بیان کرتے ہیں کہ مختلف خطوں کے سیاح یہاں آئے اور سب نے اس کی فضیلت تسلیم کی۔ {cite:nuzhat-al-mushtaq-2002 p.588} پالرمو میں ابن جبیر کھلے میدان اور صحن بیان کرتے ہیں جو سب باغات ہیں۔ {cite:rihla-ibn-jubayr-1907 p.93} ابن جبیر کے مطابق شہر کی بیشتر مساجد وہ جگہیں تھیں جہاں قرآن کے معلم اپنے شاگردوں کے ساتھ بیٹھتے تھے۔ {cite:rihla-ibn-jubayr-1907 p.92}'
