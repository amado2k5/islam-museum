- title:
    ar: النورمان
    en: The Normans
    ur: نورمن
  body:
    ar: 'يذكر الإدريسي أن رجار بن تنقرين بدأ فتح الجزيرة سنة 453هـ، واستولى عليها جميعاً في ثلاثين عاماً. {cite:nuzhat-al-mushtaq-2002 p.589} ثم صنّف الإدريسي كتابه للملك رجار المعظم، ملك صقلية وإيطالية، وأتمّه في شوال سنة 548هـ. {cite:nuzhat-al-mushtaq-2002 p.4} {cite:nuzhat-al-mushtaq-2002 p.7} وفي قصر الملك في زمن ابن جبير جواري مسلمات كلهن، ينقل ابن جبير ذلك عن أحد خدّامه. {cite:rihla-ibn-jubayr-1907 p.99}'
    en: 'Al-Idrisi says that Roger ibn Tancred began to conquer the island in 453 AH and took all of it over thirty years. {cite:nuzhat-al-mushtaq-2002 p.589} He dedicated his book to the great king Roger, king of Sicily and Italy, and finished it in Shawwal 548 AH. {cite:nuzhat-al-mushtaq-2002 p.4} {cite:nuzhat-al-mushtaq-2002 p.7} In Ibn Jubayr''s account of the king''s palace, the concubines were all Muslims, a detail he reports from one of the king''s servants. {cite:rihla-ibn-jubayr-1907 p.99}'
    ur: 'ادریسی بتاتے ہیں کہ رجار بن تنقرین نے 453ھ میں جزیرے کی فتح شروع کی اور تیس برس میں پورا جزیرہ لے لیا۔ {cite:nuzhat-al-mushtaq-2002 p.589} ادریسی نے اپنی کتاب صقلیہ اور اٹلی کے بادشاہ المعظم رجار کے لیے لکھی، اور اسے شوال سنہ 548ھ میں مکمل کیا۔ {cite:nuzhat-al-mushtaq-2002 p.4} {cite:nuzhat-al-mushtaq-2002 p.7} ابن جبیر بادشاہ کے محل کے بارے میں بتاتے ہیں کہ اس کی لونڈیاں سب مسلمان تھیں، یہ بات انہوں نے بادشاہ کے ایک خادم سے سنی۔ {cite:rihla-ibn-jubayr-1907 p.99}'
  features:
  - place/palermo
  - question/what-were-the-crusades
