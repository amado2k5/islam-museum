summary:
  ar: 'مسار في أعظم كارثة في تاريخ الإسلام وتحولها: سقوط بغداد فعين جالوت فإسلام الخانات فالإحياء.'
  en: 'A trail through the catastrophe and its transformation: Baghdad''s fall, Ayn Jalut, the khanates''
    conversion.'
  es: "Un recorrido por la catástrofe y su transformación: la caída de Bagdad, Ayn Jalut, la conversión de los kanatos."
  fr: "Un parcours à travers la catastrophe et sa transformation: la chute de Bagdad, Ayn Djalout, la conversion des khanats."
  ur: "تباہی اور اس کی تبدیلی کے ذریعے ایک راستہ: بغداد کا زوال، عین جالوت، خانات کی تبدیلی۔"
  tr: "İslam tarihinin en büyük felaketine ve dönüşümüne giden bir yol: Bağdat'ın düşüşü, Ayn Calut, Hanların İslamlaştırılması ve yeniden diriliş."
  id: "Menelusuri perjalanan melalui bencana terbesar dalam sejarah Islam dan transformasinya: jatuhnya Baghdad, Ain Jalut, Islamisasi para Khan, dan kebangkitannya."
