label:
  ar: "الحديث النبوي: من السماع إلى الصحيح"
  en: "The Prophetic Hadith: From Hearing to the Collections"
  es: "El Hadiz Profético: De la escucha a las colecciones"
  fr: "Le hadith prophétique: de l'écoute à la collecte"
  ur: "حدیث نبوی: سماع سے جمع تک"
  tr: "Peygamber Hadisleri: İşitmekten Doğrulamaya"
  id: "Hadits Nabi: Dari Mendengar hingga Otentikasi"
summary:
  ar: "مسار في علوم الحديث في ثماني محطات: ما الحديث، والإسناد الذي به يصل إلينا، والكتب الستة، وعلم المصطلح، والسيرة التي تحفظ سياقه، والشمائل التي تحفظ صورته، ونماذج من نصوص الصحيح — مدخل لأجنحة الكتب النبوية في المتحف."
  en: "A trail through the hadith sciences in seven stations: what a hadith is, the isnad that conveys it, the six books, the science of methodology, the sira that preserves its context, the shama'il that preserve the Prophet's portrait, and selected texts from the Sahih — a doorway into the museum's Prophetic-word shelves."
  es: "Un recorrido por las ciencias del hadiz en siete etapas: qué es un hadiz, el isnad que lo transmite, los seis libros, la ciencia de la metodología, la sira que preserva su contexto, el shama’il que preserva el retrato del Profeta y textos seleccionados del Sahih: una puerta de entrada a las estanterías del museo dedicadas a la palabra profética."
  fr: "Un parcours à travers les sciences du hadith en sept étapes: la définition d’un hadith, l’isnad qui le transmet, les six livres, la science de la méthodologie, la sira qui préserve son contexte, le shama’il qui préserve le portrait du Prophète et une sélection de textes du Sahih – une porte d’entrée vers les rayons du musée consacrés à la parole prophétique."
  ur: "حدیث کے علوم کے ذریعے سات مقامات پر ایک ٹریل: حدیث کیا ہے، اسناد جو اسے پہنچاتی ہے، چھ کتابیں، طریقہ کار کی سائنس، اپنے سیاق و سباق کو محفوظ کرنے والی سیرت، شمائل جو پیغمبر کی تصویر کو محفوظ کرتی ہے، اور صحیح سے منتخب تحریریں - میوزیم کے پیغمبری لفظ شیل کا دروازہ۔"
  tr: "Hadis ilminin sekiz aşamada ele alınışı: Hadis nedir, bize ulaşan rivayet zinciri, altı kitap, terminoloji ilmi, bağlamını koruyan biyografisi, imajını koruyan özellikleri ve sahih metin örnekleri — müzedeki peygamber kitaplarının kanatlarına bir giriş."
  id: "Sebuah perjalanan menelusuri ilmu Hadits dalam delapan tahapan: Apa itu Hadits, rantai periwayatan yang melaluinya Hadits sampai kepada kita, enam kitab, ilmu terminologi, biografi yang melestarikan konteksnya, karakteristik yang melestarikan citranya, dan contoh-contoh teks otentik — pengantar ke sayap kitab-kitab kenabian di museum."
