    en: "His form and character as eyewitnesses conveyed them: the Shama'il book in Tirmidhi's Jami'."
    es: "Su forma y carácter, tal como los transmitieron los testigos presenciales: el libro Shama'il en el Jami' de Tirmidhi."
    fr: "Sa forme et son caractère en tant que témoins oculaires les ont transmis: le livre Shama'il dans le Jami' de Tirmidhi."
