  body:
    ar: "نصوص مختارة من صحيحي البخاري ومسلم كما وردت: في فضل الأنصار، وأيام المغازي، وساعات الوفاة، وحديث جبريل في الإسلام والإيمان والإحسان، ووصف حجة الوداع، ووصية الثقلين."
    en: "Selected texts from Sahih al-Bukhari and Sahih Muslim as transmitted: on the Ansar's standing, the days of the campaigns, the hours of the Prophet's death, the Jibril hadith on Islam, iman and ihsan, the description of the Farewell Pilgrimage, and the Thaqalayn injunction."
    es: "Textos seleccionados de Sahih al-Bukhari y Sahih Muslim, tal como fueron transmitidos: sobre la posición de los Ansar, los días de las campañas, las horas de la muerte del Profeta, el hadiz de Jibril sobre el Islam, el iman y el ihsan, la descripción de la Peregrinación de Despedida y el mandato de Thaqalayn."
    fr: "Textes choisis du Sahih al-Bukhari et du Sahih Muslim tels que transmis: sur la position des Ansar, les jours des campagnes, les heures de la mort du Prophète, le hadith de Jibril sur l'Islam, l'iman et l'ihsan, la description du Pèlerinage d'Adieu et l'injonction de Thaqalayn."
    ur: "صحیح البخاری اور صحیح مسلم سے منتخب نصوص جیسا کہ منتقل کیا گیا ہے: انصار کے قیام، مہمات کے ایام، رسول اللہ کے وصال کے اوقات، جبریل کی حدیث اسلام، ایمان اور احسان، حجۃ الوداع کی تفصیل اور ثقلین کا حکم۔"
    tr: "Sahih Buhari ve Sahih Müslim'den rivayet edildiği şekliyle seçilmiş metinler: Ensar'ın fazileti, savaş günleri, ölüm vakti, Cebrail'in İslam, iman ve iyilik hakkındaki hadisi, Veda Haccı'nın tasviri ve iki ağır şeyin vasiyeti."
    id: "Teks-teks terpilih dari Sahih al-Bukhari dan Sahih Muslim sebagaimana diriwayatkan: Tentang keutamaan kaum Ansar, hari-hari peperangan, saat-saat kematian, hadits Jibril tentang Islam, iman dan kebaikan, uraian tentang Haji Perpisahan, dan wasiat tentang dua perkara besar."
