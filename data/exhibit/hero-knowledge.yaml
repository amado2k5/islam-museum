summary:
  ar: " 'مسار فيمن حملوا العلم أمانةً ودفعوا عنه أرواحهم وأعمارهم: الشافعي واضع أصول الفقه، وأحمد صابر المحنة، ورابعة العدوية عارفة البصرة، والخنساء الشاعرة التي صانعت الحق بلسانها.'"
  en: " 'A trail of those who carried knowledge as a trust and spent their lives defending it: al-Shafi'i who laid the foundations of jurisprudence, Ahmad ibn Hanbal steadfast through the inquisition, Rabi'a al-Adawiyya the knower of Basra, and al-Khansa who served truth with her tongue.'"
  ur: " 'ان لوگوں کا سفر جنھوں نے علم کو امانت سمجھ کر اٹھایا اور اس پر اپنی جانیں اور عمریں لگائیں: شافعی اصولِ فقہ کے بانی، احمد بن حنبل محنت کے صابر، رابعہ عدویہ بصرہ کی عارفہ، اور خنساء جو اپنی زبان سے حق کی خدمت کرتی رہیں۔'"
  es: "«Una estela de aquellos que llevaron el conocimiento como un don y dedicaron sus vidas a defenderlo: al-Shafi'i, quien sentó las bases de la jurisprudencia; Ahmad ibn Hanbal, firme ante la Inquisición; Rabi'a al-Adawiyya, la conocedora de Basora; y al-Khansa, quien sirvió a la verdad con su palabra.»"
  fr: "« Une lignée de ceux qui ont porté le savoir comme un dépôt et ont consacré leur vie à le défendre: al-Shafi'i, qui a posé les fondements de la jurisprudence ; Ahmad ibn Hanbal, inébranlable face à l'Inquisition ; Rabi'a al-Adawiyya, le savant de Bassora ; et al-Khansa, qui a servi la vérité par sa parole. »"
  tr: "'Bilgiyi emanet olarak taşıyan ve canlarını, yıllarını onun uğruna feda edenlerin yolu: Fıkıh esaslarının kurucusu Şafiî, imtihan sahibi Ahmed Sabir, Basralı bilgili kadın Rabi el-Adaviyye ve hakikati diliyle savunan şaire Hansa.'"
  id: "'Jalan yang ditempuh oleh mereka yang mengemban ilmu sebagai amanah dan mengorbankan hidup dan tahun-tahun mereka untuknya: Al-Shafi'i, pendiri prinsip-prinsip fiqih, Ahmad Sabir, sang pencoba, Rabia al-Adawiyya, wanita berilmu dari Basra, dan Al-Khansa, penyair wanita yang membela kebenaran dengan lidahnya.'"
