rooms:
- title:
    ar: "محمد بن إدريس الشافعي"
    en: "Al-Shafi'i"
    ur: "امام شافعی"
    es: "Al-Shafi'i"
    fr: "Al-Shafi'i"
    tr: "Muhammed ibn İdris el-Şafiî"
    id: "Muhammad ibn Idris al-Shafi'i"
  body:
    ar: "جال بين مكة والمدينة والعراق ومصر حتى وضع أصول الفقه برسالته، وعلّم أمةً كيف تستدل."
    en: "He journeyed between Mecca, Medina, Iraq and Egypt until he wrote the Risala that founded legal theory — teaching an ummah how to reason from evidence."
    ur: "مکہ، مدینہ، عراق اور مصر کی سیاحتیں کیں یہاں تک کہ رسالہ لکھ کر اصولِ فقہ کی بنیاد رکھی — امت کو دلیل سے استدلال سکھایا۔"
    es: "Viajó entre La Meca, Medina, Irak y Egipto hasta que escribió la Risala, que sentó las bases de la teoría jurídica, enseñando a la comunidad musulmana a razonar a partir de las pruebas."
    fr: "Il voyagea entre La Mecque, Médine, l'Irak et l'Égypte jusqu'à la rédaction de la Risala, texte fondateur de la théorie juridique, qui enseignait à la communauté musulmane comment raisonner à partir de preuves."
    tr: "Mekke, Medine, Irak ve Mısır arasında seyahat ederek hukuk ilkelerini risalesinde ortaya koydu ve bir millete nasıl akıl yürütüleceğini öğretti."
    id: "Ia melakukan perjalanan antara Mekah, Madinah, Irak, dan Mesir hingga ia menetapkan prinsip-prinsip yurisprudensi dalam risalahnya, dan mengajarkan suatu bangsa bagaimana bernalar."
  features:
  - person/al-shafii
  - place/cairo
- title:
    ar: "أحمد بن حنبل"
    en: "Ahmad ibn Hanbal"
    ur: "احمد بن حنبل"
    es: "Ahmad ibn Hanbal"
    fr: "Ahmad ibn Hanbal"
    tr: "Ahmed ibn Hanbal"
    id: "Ahmad bin Hanbal"
  body:
    ar: "صبر في المحنة على الجلد والحبس وأبى أن يقول بخلق القرآن، فثبّت العلمَ والعلماءَ بعده."
    en: "He bore flogging and prison in the inquisition rather than declare the Qur'an created, and by standing firm he steadied knowledge and scholars after him."
    ur: "محنت میں کوڑے اور قید برداشت کیے مگر قرآنِ مخلوق کہنے سے انکار کر دیا، اور ثابت قدمی سے آنے والے علم اور علماء کو مضبوط کیا۔"
    es: "Soportó los azotes y la prisión en la Inquisición antes que declarar la creación del Corán, y al mantenerse firme, consolidó el conocimiento y formó a eruditos posteriores."
    fr: "Il a supporté la flagellation et la prison lors de l'Inquisition plutôt que de déclarer le Coran créé, et par sa fermeté, il a consolidé le savoir et formé des érudits après lui."
    tr: "O, zorluklara, kırbaçlanmaya ve hapse katlandı ve Kur'an'ın yaratılmış olduğunu söylemeyi reddederek, kendisinden sonra gelen bilgi ve alimlerin yolunu açtı."
    id: "Dia menanggung kesulitan, cambukan, dan penjara, dan menolak untuk mengatakan bahwa Al-Qur'an diciptakan, sehingga menegakkan ilmu pengetahuan dan para ulama setelahnya."
  features:
  - person/ahmad-ibn-hanbal
  - event/mihna-of-the-quran
  - place/baghdad
- title:
    ar: "رابعة العدوية"
    en: "Rabi'a al-Adawiyya"
    ur: "رابعہ عدویہ"
    es: "Rabi'a al-Adawiyya"
    fr: "Rabi'a al-Adawiyya"
    tr: "Rabia al-Adawiyya"
    id: "Rabia al-Adawiyya"
  body:
    ar: "مملوكةٌ تحررت فصارت عارفة البصرة: علّمت حبَّ الله لذاته لا طمعًا ولا خوفًا."
    en: "An emancipated bondswoman who became Basra's knower of God: she taught love of God for Himself, not from hope or fear."
    ur: "ایک آزاد شدہ لونڈی جو بصرہ کی عارفہ بنی: اس نے اللہ سے محبت اس کے لیے سکھائی نہ کہ لالچ یا خوف سے۔"
    es: "Una esclava emancipada que se convirtió en la conocedora de Dios de Basora: enseñó a amar a Dios por sí mismo, no por esperanza ni por miedo."
    fr: "Une ancienne esclave affranchie devenue à Bassora celle qui connaissait Dieu: elle enseignait l'amour de Dieu pour Lui-même, et non par espoir ou par crainte."
    tr: "Özgürlüğüne kavuşan bir köle kadın, Basra'nın bilge kadını oldu: Tanrı'yı açgözlülük veya korkudan değil, O'nun hatırı için sevmeyi öğretti."
    id: "Seorang budak perempuan yang dibebaskan menjadi perempuan bijak di Basra: ia mengajarkan kasih kepada Tuhan demi Dia sendiri, bukan karena keserakahan atau ketakutan."
  features:
  - person/rabia-al-adawiyya
  - place/basra
- title:
    ar: "الخنساء"
    en: "Al-Khansa"
    ur: "خنساء"
    es: "Al-Khansa"
    fr: "Al-Khansa"
    tr: "El-Khansa"
    id: "Al-Khansa"
  body:
    ar: "شاعرة الإسلام: قدّمت أبناءها الأربعة في القادسية فقالت حمدت الله الذي شرفني باستشهادهم."
    en: "The poet of Islam: she offered her four sons at al-Qadisiyya and said she praised God for honouring her with their martyrdom."
    ur: "اسلام کی شاعرہ: قادسیہ میں اپنے چار بیٹے پیش کیے اور کہا اللہ کا شکر ہے جس نے مجھے ان کی شہادت سے سرفراز کیا۔"
    es: "La poetisa del Islam: ofreció a sus cuatro hijos en al-Qadisiyya y dijo que alababa a Dios por honrarla con su martirio."
    fr: "La poétesse de l'Islam: elle a offert ses quatre fils en martyre à al-Qadisiyya et a déclaré louer Dieu de l'avoir honorée par leur sacrifice."
    tr: "İslam şairi: Kadisiye'de dört oğlunu kurban etti ve şöyle dedi: \"Onların şehitliğiyle beni şereflendiren Allah'a şükrediyorum.\""
    id: "Sang penyair Islam: Ia mempersembahkan keempat putranya di Qadisiyah dan berkata, “Aku bersyukur kepada Allah yang telah memuliakanku dengan kemartiran mereka.”"
  features:
