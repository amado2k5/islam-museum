summary:
  ar: 'مسار في عبادات المسلم عبر سنته: الصلوات الخمس، والجمعة، ورمضان وقيامه وليلته، والعيدان، والحج والعمرة.'
  en: 'A trail through the Muslim''s year of worship: the five prayers, Friday, Ramadan, the two eids,
    hajj and umrah.'
  es: "Un recorrido por el año de culto musulmán: las cinco oraciones, el viernes, el Ramadán, las dos festividades del Eid, el Hajj y la Umrah."
  fr: "Un parcours à travers l'année de culte musulmane: les cinq prières, le vendredi, le Ramadan, les deux fêtes de l'Aïd, le Hajj et la Omra."
  ur: "مسلمان کی عبادت کے سال کا ایک راستہ: پانچ نمازیں، جمعہ، رمضان، دو عیدیں، حج اور عمرہ۔"
  tr: "Bir Müslümanın yıl boyunca ibadet yolculuğu: beş vakit namaz, Cuma namazı, Ramazan ve gece namazları, iki bayram, Hac ve Umre."
  id: "Rukun ibadah seorang Muslim sepanjang tahun: lima shalat wajib, shalat Jumat, Ramadan dan shalat malamnya, dua hari raya Idul Fitri dan Idul Adha, Haji dan Umrah."
