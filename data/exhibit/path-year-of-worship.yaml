summary:
  ar: 'مسار في عبادات المسلم عبر سنته: الصلوات الخمس، والجمعة، ورمضان وقيامه وليلته، والعيدان، والحج والعمرة.'
  en: 'A trail through the Muslim''s year of worship: the five prayers, Friday, Ramadan, the two eids,
    hajj and umrah.'
