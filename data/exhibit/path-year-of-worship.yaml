  fr: "Un parcours à travers l'année de culte musulmane: les cinq prières, le vendredi, le Ramadan, les deux fêtes de l'Aïd, le Hajj et la Omra."
  ur: "مسلمان کی عبادت کے سال کا ایک راستہ: پانچ نمازیں، جمعہ، رمضان، دو عیدیں، حج اور عمرہ۔"
