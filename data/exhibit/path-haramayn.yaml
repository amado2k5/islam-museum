  body:
    ar: هاجر إليها فأسس مسجده ودولته ودفن في حجرته.
    en: He migrated to it, founded his mosque and state, and lies in its chamber.
    es: "Emigró a ella, fundó su mezquita y su estado, y yace en su cámara."
    fr: "Il y a émigré, y a fondé sa mosquée et son État, et repose dans sa chambre funéraire."
    ur: "اس نے اس کی طرف ہجرت کی، اپنی مسجد اور ریاست کی بنیاد رکھی اور اس کے حجرے میں پڑا۔"
    tr: "Oraya göç etti, camisini ve devletini kurdu ve odasına defnedildi."
    id: "Dia berhijrah ke sana, mendirikan masjid dan negaranya, dan dimakamkan di kamarnya."
