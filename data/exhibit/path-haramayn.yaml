    fr: "La première maison des hommes: la qibla de la prière, la destination du hajj."
    ur: "لوگوں کا پہلا گھر: نماز کا قبلہ، حج کی منزل۔"
    tr: "İnsanlar için kurulan ilk ev: dua yönü ve hac yolculuğunun varış noktası."
    id: "Rumah pertama yang didirikan untuk manusia: arah doa dan tujuan ziarah."
