summary:
  ar: 'مسار في أقدس بقاع الأرض عند المسلمين: المسجد الحرام والكعبة وزمزم وغار حراء، ثم مسجد النبي وقباء
    وأحد والبقيع.'
  en: 'A trail through the holiest ground: the Haram, Kaaba, Zamzam, Hira''s cave, then the Prophet''s
    Mosque, Quba, Uhud and Baqi.'
  es: "Un recorrido por los lugares más sagrados: el Haram, la Kaaba, Zamzam, la cueva de Hira, la Mezquita del Profeta, Quba, Uhud y Baqi."
  fr: "Un itinéraire à travers les lieux les plus sacrés: le Haram, la Kaaba, Zamzam, la grotte de Hira, puis la mosquée du Prophète, Quba, Uhud et Baqi."
  ur: "مقدس ترین زمین سے گزرنے والا راستہ: حرم، کعبہ، زمزم، غار حرا، پھر مسجد نبوی، قبا، احد اور بقیع۔"
  tr: "Müslümanlar için yeryüzündeki en kutsal yerlerden geçen bir rota: Büyük Cami, Kâbe, Zemzem, Hira Mağarası, ardından Peygamber Camii, Kuba, Uhud ve Bakî."
  id: "Rute melalui tempat-tempat paling suci di bumi bagi umat Muslim: Masjidil Haram, Ka'bah, Zamzam, Gua Hira, kemudian Masjidil Haram, Quba, Uhud, dan Al-Baqi'."
