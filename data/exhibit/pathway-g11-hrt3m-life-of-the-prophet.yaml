id: exhibit/pathway-g11-hrt3m-life-of-the-prophet
class: exhibit
kind: lesson
label:
  ar: "سيرة النبي محمد: شخصية مؤثرة في تكوين دين"
  en: "The life of the Prophet Muhammad: a figure who shaped a religion"
  ur: "نبی محمد کی سیرت: ایک شخصیت جس نے ایک مذہب کی تشکیل کی"
summary:
  ar: "مسار لمقرر HRT3M يتابع سيرة النبي محمد من مكة إلى الوداع: المدينة التي وُلد فيها، وخديجة، والوحي، والحصار، والهجرة، والمسجد الأول، والصلح، وحجة الوداع، ثم كيف حُفظت أقواله في الحديث."
  en: "An HRT3M pathway following the life of the Prophet Muhammad from Mecca to the farewell: the city of his birth, Khadija, the revelation, the boycott, the Hijra, the first mosque, the treaty, the Farewell Pilgrimage, and how his words were preserved in hadith."
  ur: "HRT3M کا ایک راستہ نبی محمد کی سیرت پر مکہ سے وداع تک: ان کی پیدائش کا شہر، خدیجہ، وحی، بائیکاٹ، ہجرت، پہلی مسجد، صلح، حجۃ الوداع، پھر ان کے اقوال حدیث میں کیسے محفوظ ہوئے۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب كيف أثّر فرد ذو دور محدّد، نبيٌّ في عقيدة أتباعه ومؤسِّس مجتمع في عين المؤرخ، في تكوين الإسلام في مراحله الأولى.
  en: Students analyse how an individual with a specific role, a prophet in his followers' belief and a community founder in the historian's eye, shaped Islam in its first stages.
  ur: طلبہ تجزیہ کریں کہ ایک مخصوص کردار والے فرد نے، جو اپنے پیروکاروں کے عقیدے میں نبی اور مؤرخ کی نظر میں ایک برادری کا بانی ہے، ابتدائی مراحل میں اسلام کی تشکیل کیسے کی۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: HRT3M
  course_title:
    ar: "أديان العالم وتقاليد الاعتقاد: منظورات وقضايا وتحدّيات، الصف 11، إعداد جامعي/كلّي"
    en: "World Religions and Belief Traditions: Perspectives, Issues, and Challenges, Grade 11, University/College Preparation"
    ur: "دنیا کے مذاہب اور عقائد کی روایات: نقطۂ نظر، مسائل اور چیلنج، جماعت 11، یونیورسٹی/کالج تیاری"
  grade: "11"
  strand: D
  strand_title:
    ar: العقائد والممارسات والتعاليم
    en: Tenets, Practices, and Teachings
    ur: عقائد، اعمال اور تعلیمات
  expectations:
    - D3
    - D1
  expectation:
    ar: يعرض الدرس سيرة النبي محمد بوصفه الشخصية ذات الدور المحدّد التي أثّرت في تكوين الإسلام، بمراحلها ومصادرها، ويربط كل مرحلة بتعليم أو ممارسة نشأت فيها (الصلاة، المسجد، العهد). الإطار الإسلامي السنّي يُسمّى بوصفه إطارًا، والدراسة الأكاديمية للمصادر تُسمّى كذلك.
    en: The lesson presents the life of the Prophet Muhammad as the figure with a specific role who shaped Islam, in its stages and from its sources, and ties each stage to a teaching or practice that arose in it (prayer, the mosque, the pact). The Sunni Islamic frame is named as a frame, and the academic study of the sources is named as such.
    ur: یہ سبق نبی محمد کی سیرت کو اس مخصوص کردار والی شخصیت کے طور پر پیش کرتا ہے جس نے اسلام کی تشکیل کی، اس کے مراحل اور ماخذ کے ساتھ، اور ہر مرحلے کو اس میں پیدا ہونے والی تعلیم یا عمل (نماز، مسجد، عہد) سے جوڑتا ہے۔ سنی اسلامی خاکے کو خاکے کے طور پر نام دیا گیا ہے، اور ماخذ کے علمی مطالعے کو بھی اسی طرح۔
  document: "The Ontario Curriculum, Grades 9 to 12: Social Sciences and Humanities, 2013"
  verified: 2026-10-23
rooms:
  - title:
      ar: "محمد: المدخل"
      en: "Muhammad: the record"
      ur: "محمد: اندراج"
    body:
      ar: ما يعرفه المتحف عن حياته قبل الأربعين، ومصادر السيرة وأزمنتها.
      en: What the museum records of his life before forty, and the sira sources and their dates.
      ur: چالیس برس سے پہلے کی زندگی کے بارے میں میوزیم کیا جانتا ہے، اور سیرت کے ماخذ اور ان کے زمانے۔
    features:
      - person/muhammad
      - place/mecca
  - title:
      ar: خديجة
      en: Khadija
      ur: خدیجہ
    body:
      ar: "تاجرة مكية وأول من آمن: الزواج والبيت الأول."
      en: "A merchant of Mecca and the first to believe: the marriage and the first household."
      ur: "مکہ کی ایک تاجر اور سب سے پہلے ایمان لانے والی: شادی اور پہلا گھرانہ۔"
    features:
      - person/khadija
  - title:
      ar: الوحي الأول
      en: The first revelation
      ur: پہلی وحی
    body:
      ar: غار حراء، والآيات الأولى، وما تقوله المصادر عن تجربة الوحي.
      en: The cave of Hira, the first verses, and what the sources say of the experience of revelation.
      ur: غارِ حرا، پہلی آیتیں، اور وحی کے تجربے کے بارے میں ماخذ کیا کہتے ہیں۔
    features:
      - event/first-revelation
  - title:
      ar: الحصار
      en: The boycott
      ur: بائیکاٹ
    body:
      ar: "مقاطعة بني هاشم: الثمن الاجتماعي للدعوة في مكة."
      en: "The boycott of the Banu Hashim: the social price of the call in Mecca."
      ur: "بنو ہاشم کا بائیکاٹ: مکہ میں دعوت کی معاشرتی قیمت۔"
    features:
      - event/boycott-of-banu-hashim
  - title:
      ar: الهجرة والمدينة
      en: The Hijra and Medina
      ur: ہجرت اور مدینہ
    body:
      ar: "مدينة جديدة ومجتمع جديد: من اللاجئ إلى الحاكم."
      en: "A new city and a new community: from refugee to governor."
      ur: "ایک نیا شہر اور ایک نئی برادری: پناہ گزین سے حاکم تک۔"
    features:
      - event/hijra
      - place/medina
  - title:
      ar: المسجد النبوي
      en: The Prophet's Mosque
      ur: مسجدِ نبوی
    body:
      ar: "أول مبنى للجماعة: مكان الصلاة والقضاء والتعليم."
      en: "The community's first building: a place of prayer, judgement and teaching."
      ur: "برادری کی پہلی عمارت: نماز، فیصلے اور تعلیم کی جگہ۔"
    features:
      - building/prophets-mosque
  - title:
      ar: الحديبية
      en: Hudaybiyya
      ur: حدیبیہ
    body:
      ar: "صلح بشروط صعبة قبِله النبي: التفاوض في السيرة."
      en: "A treaty on hard terms that the Prophet accepted: negotiation in the sira."
      ur: "سخت شرائط پر ایک صلح جو نبی نے قبول کی: سیرت میں مذاکرات۔"
    features:
      - event/treaty-of-hudaybiyya
  - title:
      ar: حجة الوداع
      en: The Farewell Pilgrimage
      ur: حجۃ الوداع
    body:
      ar: "الخطبة الأخيرة أمام الجمع: ما حُفظ منها وكيف."
      en: "The last sermon before the gathering: what was preserved of it and how."
      ur: "اجتماع کے سامنے آخری خطبہ: اس میں سے کیا محفوظ رہا اور کیسے۔"
    features:
      - event/farewell-pilgrimage
  - title:
      ar: "الحديث: كيف حُفظت الأقوال"
      en: "Hadith: how the words were kept"
      ur: "حدیث: اقوال کیسے محفوظ ہوئے"
    body:
      ar: "من الذاكرة إلى الكتب: الإسناد، والجمع، ونقد المحدّثين."
      en: "From memory to books: the isnad, the collections and the scholars' criticism."
      ur: "یادداشت سے کتابوں تک: اسناد، مجموعے اور محدثین کی تنقید۔"
    features:
      - concept/al-hadith-al-nabawi
outcomes:
  - text:
      ar: أرتّب مراحل سيرة النبي محمد الكبرى وأضعها بين 610 و632.
      en: I can order the main stages of the Prophet Muhammad's life between 610 and 632.
      ur: میں نبی محمد کی سیرت کے بڑے مراحل 610 اور 632 کے بیچ ترتیب دے سکتا ہوں۔
    steps:
      - 0
      - 2
      - 4
      - 7
  - text:
      ar: أربط ممارسةً إسلامية بمرحلة من السيرة نشأت فيها.
      en: I can tie an Islamic practice to the stage of the life in which it arose.
      ur: میں ایک اسلامی عمل کو سیرت کے اس مرحلے سے جوڑ سکتا ہوں جس میں وہ پیدا ہوا۔
    steps:
      - 5
      - 6
  - text:
      ar: أشرح كيف تُقرأ المصادر الإسلامية في الدراسة الأكاديمية وفي الإيمان معًا.
      en: I can explain how the Islamic sources are read both in academic study and in faith.
      ur: میں بتا سکتا ہوں کہ اسلامی ماخذ علمی مطالعے اور ایمان دونوں میں کیسے پڑھے جاتے ہیں۔
    steps:
      - 0
      - 8
worksheet:
  - prompt:
      ar: ما المصادر التي تعتمد عليها سيرة النبي؟ وما الفرق بين القرآن والسيرة والحديث؟
      en: Which sources does the Prophet's biography rest on, and what is the difference between the Qur'an, the sira and hadith?
      ur: نبی کی سیرت کن ماخذ پر قائم ہے، اور قرآن، سیرت اور حدیث میں کیا فرق ہے؟
    steps:
      - 0
      - 8
  - prompt:
      ar: ما دور خديجة في السنوات الأولى؟
      en: What was Khadija's role in the first years?
      ur: پہلے برسوں میں خدیجہ کا کیا کردار تھا؟
    steps:
      - 1
  - prompt:
      ar: لماذا تُعدّ الهجرة بداية تقويم ودولة معًا؟
      en: Why is the Hijra the start of both a calendar and a state?
      ur: ہجرت ایک کیلنڈر اور ایک ریاست دونوں کا آغاز کیوں ہے؟
    steps:
      - 4
  - prompt:
      ar: اذكر وظيفتين للمسجد النبوي غير الصلاة.
      en: Name two functions of the Prophet's Mosque besides prayer.
      ur: مسجدِ نبوی کے نماز کے سوا دو کام لکھیں۔
    steps:
      - 5
  - prompt:
      ar: كيف يحكم المحدّثون على حديث؟ اشرح الإسناد بمثال.
      en: How do hadith scholars judge a report? Explain the isnad with an example.
      ur: محدثین کسی روایت پر حکم کیسے لگاتے ہیں؟ اسناد کو ایک مثال سے سمجھائیں۔
    steps:
      - 8
quiz:
  - q:
      ar: من كانت خديجة؟
      en: Who was Khadija?
      ur: خدیجہ کون تھیں؟
    options:
      - ar: ابنة أبي بكر
        en: Abu Bakr's daughter
        ur: ابوبکر کی بیٹی
      - ar: تاجرة مكية وزوجة النبي الأولى
        en: A Meccan merchant and the Prophet's first wife
        ur: مکہ کی تاجر اور نبی کی پہلی بیوی
      - ar: ملكة الحبشة
        en: The queen of Abyssinia
        ur: حبشہ کی ملکہ
      - ar: شاعرة من المدينة
        en: A poet of Medina
        ur: مدینہ کی شاعرہ
    answer: 1
    teaches: 1
  - q:
      ar: ماذا كان حصار بني هاشم؟
      en: What was the boycott of the Banu Hashim?
      ur: بنو ہاشم کا بائیکاٹ کیا تھا؟
    options:
      - ar: حرب في المدينة
        en: A war in Medina
        ur: مدینہ میں جنگ
      - ar: رحلة إلى الحبشة
        en: A journey to Abyssinia
        ur: حبشہ کا سفر
      - ar: مقاطعة اجتماعية واقتصادية لعشيرة النبي في مكة
        en: A social and economic boycott of the Prophet's clan in Mecca
        ur: مکہ میں نبی کے خاندان کا معاشرتی اور معاشی بائیکاٹ
      - ar: معاهدة مع قريش
        en: A treaty with Quraysh
        ur: قریش سے معاہدہ
    answer: 2
    teaches: 3
  - q:
      ar: أي وظائف أدّاها المسجد النبوي غير الصلاة؟
      en: Which functions did the Prophet's Mosque serve besides prayer?
      ur: مسجدِ نبوی نماز کے سوا کس کام آئی؟
    options:
      - ar: القضاء والتعليم واللقاء
        en: Judgement, teaching and assembly
        ur: فیصلہ، تعلیم اور اجتماع
      - ar: السوق فقط
        en: Only a market
        ur: صرف بازار
      - ar: مخزن للسلاح
        en: An arms store
        ur: اسلحہ خانہ
      - ar: لا شيء غير الصلاة
        en: Nothing but prayer
        ur: نماز کے سوا کچھ نہیں
    answer: 0
    teaches: 5
  - q:
      ar: لماذا تُعدّ الحديبية مهمة في السيرة؟
      en: Why does Hudaybiyya matter in the Prophet's life?
      ur: حدیبیہ سیرت میں کیوں اہم ہے؟
    options:
      - ar: لأنها معركة كبيرة
        en: It was a great battle
        ur: یہ بڑی جنگ تھی
      - ar: لأنها أول مسجد
        en: It was the first mosque
        ur: یہ پہلی مسجد تھی
      - ar: لأنها رحلة إلى الشام
        en: It was a journey to Syria
        ur: یہ شام کا سفر تھا
      - ar: لأنها صلح بشروط صعبة قبِله النبي
        en: It was a treaty on hard terms that the Prophet accepted
        ur: یہ سخت شرائط پر صلح تھی جو نبی نے قبول کی
    answer: 3
    teaches: 6
  - q:
      ar: ما الإسناد في علم الحديث؟
      en: What is the isnad in hadith scholarship?
      ur: علم حدیث میں اسناد کیا ہے؟
    options:
      - ar: سلسلة الرواة الذين نقلوا القول
        en: The chain of transmitters who passed on a report
        ur: راویوں کا سلسلہ جس نے قول نقل کیا
      - ar: نص الحديث نفسه
        en: The text of the report itself
        ur: روایت کا متن
      - ar: كتاب البخاري
        en: Al-Bukhari's book
        ur: بخاری کی کتاب
      - ar: خطبة الجمعة
        en: The Friday sermon
        ur: جمعے کا خطبہ
    answer: 0
    teaches: 8
