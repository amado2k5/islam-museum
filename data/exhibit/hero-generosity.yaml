rooms:
- title:
    ar: "عبد الرحمن بن عوف"
    en: "Abd al-Rahman ibn Awf"
    ur: "عبدالرحمٰن بن عوف"
  body:
    ar: "هاجر تاركًا ماله فأعاده الله أضعافًا، فكان يسدّ قوافل بالصدقة حتى تذكر المدينة يوم رحيله."
    en: "He migrated leaving his wealth behind, was repaid manyfold, and kept sending caravans of charity until Medina still tells of the day he died."
    ur: "ہجرت میں اپنا مال چھوڑا، اللہ نے کئی گنا لوٹایا، اور صدقے کے قافلے بھیجتے رہے یہاں تک کہ مدینہ آج بھی ان کے رحلت کا دن یاد کرتا ہے۔"
  features:
  - person/abd-al-rahman-ibn-awf
  - place/medina
- title:
    ar: "عثمان بن عفان"
    en: "Uthman ibn Affan"
    ur: "عثمان بن عفان"
  body:
    ar: "جهّز جيش العسرة بماله حتى قال النبي ما ضرّه ما عمل بعدها، واشترى بئر رومة فوقفها للناس."
    en: "He equipped the Army of Hardship with his own money and bought the well of Ruma for everyone — the Prophet said nothing he did after could harm him."
    ur: "اپنے مال سے لشکرِ عسرہ کو سازوسامان دیا اور کنواںِ رومہ سب کے لیے خرید کر وقف کیا — نبی نے فرمایا اب جو کچھ کرے اسے نقصان نہ پہنچا سکتا۔"
  features:
  - person/uthman-ibn-affan
  - place/medina
- title:
    ar: "خديجة بنت خويلد"
    en: "Khadija bint Khuwaylid"
    ur: "خدیجہ بنت خویلد"
  body:
    ar: "أم المؤمنين: آمنت أولًا حين شكّ الناس، وآزرت الدعوة بمالها وصبرت في الشعب ثلاث سنين."
    en: "The Mother of the Believers: she believed first when people doubted, backed the call with her wealth, and endured three years in the boycott."
    ur: "ام المومنین: جب لوگ شک میں تھے سب سے پہلے ایمان لائیں، اپنے مال سے دعوت کی حمایت کی، اور شعب میں تین برس صبر کیا۔"
  features:
  - person/khadija
  - place/mecca
- title:
    ar: "فاطمة الفهرية"
    en: "Fatima al-Fihri"
    ur: "فاطمہ فہری"
  body:
    ar: "وقفت ميراثها في فاس جامعًا وجامعةً، فخرّجت القرويّين علماءَ تسعة قرون وما زال أثر وقفها."
    en: "She endowed her inheritance at Fez as a mosque-university; al-Qarawiyyin has graduated scholars for nine centuries and her endowment still stands."
    ur: "فاس میں اپنی ساری وراثت مسجد-جامعہ وقف کر دی؛ قرویین نے نو صدیوں سے علماء پیدا کیے اور ان کا وقف آج بھی قائم ہے۔"
  features:
  - person/fatima-al-fihri
  - building/qarawiyyin
  - place/fes
