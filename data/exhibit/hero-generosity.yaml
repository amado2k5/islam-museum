  body:
    ar: "وقفت ميراثها في فاس جامعًا وجامعةً، فخرّجت القرويّين علماءَ تسعة قرون وما زال أثر وقفها."
    en: "She endowed her inheritance at Fez as a mosque-university; al-Qarawiyyin has graduated scholars for nine centuries and her endowment still stands."
    ur: "فاس میں اپنی ساری وراثت مسجد-جامعہ وقف کر دی؛ قرویین نے نو صدیوں سے علماء پیدا کیے اور ان کا وقف آج بھی قائم ہے۔"
    es: "Ella legó su herencia en Fez para que se convirtiera en una mezquita-universidad; al-Qarawiyyin ha formado a eruditos durante nueve siglos y su legado aún se mantiene."
    fr: "Elle a légué son héritage à Fès pour en faire une mosquée-université ; al-Qarawiyyin a formé des érudits pendant neuf siècles et sa fondation existe toujours."
    tr: "Fez'de bir cami ve bir üniversite kurarak mirasını bıraktı ve dokuz yüzyıl boyunca Karaviyye âlimleri yetiştirdi; vakfının etkisi hala devam etmektedir."
    id: "Ia mewariskan hartanya di Fez berupa sebuah masjid dan universitas, dan telah melahirkan para cendekiawan dari aliran Qarawiyyin selama sembilan abad, dan pengaruh dari wakafnya masih terasa hingga kini."
