summary:
  ar: " 'مسار فيمن جعلوا أموالهم جسورًا للناس: عبد الرحمن بن عوف تاجر المدينة الكريم، وعثمان جهّاز جيش العسرة، وخديجة التي آزرت الدعوة بمالها كله، وفاطمة الفهرية التي وقفت ميراثها جامعةً للعالم.'"
  en: " 'A trail of those who turned wealth into bridges for people: Abd al-Rahman ibn Awf the generous merchant of Medina, Uthman who equipped the Army of Hardship, Khadija who backed the call with all she had, and Fatima al-Fihri who endowed her inheritance as a university for the world.'"
  ur: " 'ان لوگوں کا سفر جنھوں نے اپنے مال کو لوگوں کے لیے پل بنایا: عبدالرحمٰن بن عوف مدینہ کے سخی تاجر، عثمان لشکرِ عسرہ کو سازوسامان دینے والے، خدیجہ جنھوں نے سارے مال سے دعوت کی حمایت کی، اور فاطمہ فہری جنھوں نے اپنی وراثت دنیا کے لیے جامعہ وقف کر دی۔'"
  es: "«Una muestra de aquellos que transformaron su riqueza en puentes para la gente: Abd al-Rahman ibn Awf, el generoso mercader de Medina; Uthman, que equipó al Ejército de la Resistencia; Khadija, que apoyó la causa con todo lo que tenía; y Fatima al-Fihri, que legó su herencia a una universidad para el mundo.»"
  fr: "« Une série de personnes qui ont transformé leur richesse en ponts pour les hommes: Abd al-Rahman ibn Awf, le généreux marchand de Médine, Uthman qui a équipé l'Armée des Épreuves, Khadija qui a soutenu l'appel de toutes ses forces, et Fatima al-Fihri qui a légué son héritage pour créer une université pour le monde. »"
  tr: "'İnsanlar için paralarını köprü yapanların yolu: Medine'nin cömert tüccarı Abdülrahman ibn Avf, zorluk ordusuna destek veren Osman, tüm malıyla tebliğ çalışmalarına destek veren Hatice ve mirasını dünyayı birleştirmeye adayan Fatıma el-Fihri.'"
  id: "'Jalan yang ditempuh oleh mereka yang menjadikan harta mereka sebagai jembatan bagi sesama manusia: Abd al-Rahman ibn Awf, pedagang dermawan dari Madinah, Uthman, pemberi rezeki bagi orang-orang yang mengalami kesulitan, Khadija, yang mendukung seruan tersebut dengan seluruh hartanya, dan Fatimah al-Fihri, yang mendedikasikan warisannya untuk mempersatukan dunia.'"
