  body:
    ar: "جهّز جيش العسرة بماله حتى قال النبي ما ضرّه ما عمل بعدها، واشترى بئر رومة فوقفها للناس."
    en: "He equipped the Army of Hardship with his own money and bought the well of Ruma for everyone — the Prophet said nothing he did after could harm him."
    ur: "اپنے مال سے لشکرِ عسرہ کو سازوسامان دیا اور کنواںِ رومہ سب کے لیے خرید کر وقف کیا — نبی نے فرمایا اب جو کچھ کرے اسے نقصان نہ پہنچا سکتا۔"
    es: "Equipó al Ejército de la Dificultad con su propio dinero y compró el pozo de Ruma para todos; el Profeta dijo que nada de lo que hiciera después podría perjudicarle."
    fr: "Il a équipé l'Armée des Épreuves de ses propres deniers et a acheté le puits de Ruma pour tous — le Prophète a dit que rien de ce qu'il a fait par la suite ne pouvait lui nuire."
    tr: "Zorluklarla boğuşan orduyu kendi parasıyla donattı; öyle ki Peygamberimiz bundan sonra yaptığı hiçbir şeyin ona zarar vermeyeceğini söyledi. Ruma kuyusunu satın aldı ve halka bağışladı."
