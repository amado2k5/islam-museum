  body:
    ar: "أم المؤمنين: آمنت أولًا حين شكّ الناس، وآزرت الدعوة بمالها وصبرت في الشعب ثلاث سنين."
    en: "The Mother of the Believers: she believed first when people doubted, backed the call with her wealth, and endured three years in the boycott."
    ur: "ام المومنین: جب لوگ شک میں تھے سب سے پہلے ایمان لائیں، اپنے مال سے دعوت کی حمایت کی، اور شعب میں تین برس صبر کیا۔"
    es: "La Madre de los Creyentes: ella fue la primera en creer cuando la gente dudaba, respaldó el llamado con su riqueza y soportó tres años de boicot."
    fr: "La Mère des Croyants: elle a cru la première quand les autres doutaient, elle a soutenu l'appel par sa richesse et a enduré trois années de boycott."
    tr: "Müminlerin Annesi: İnsanlar şüphe ederken o ilk inanan oldu, çağrıya parasıyla destek verdi ve üç yıl boyunca vadide sabırla bekledi."
    id: "Ibu Para Mukmin: Dialah yang pertama kali beriman ketika orang-orang ragu, dan dia mendukung seruan itu dengan hartanya serta tetap sabar di lembah selama tiga tahun."
