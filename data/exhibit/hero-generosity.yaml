    id: "Abd al-Rahman ibn Awf"
  body:
    ar: "هاجر تاركًا ماله فأعاده الله أضعافًا، فكان يسدّ قوافل بالصدقة حتى تذكر المدينة يوم رحيله."
    en: "He migrated leaving his wealth behind, was repaid manyfold, and kept sending caravans of charity until Medina still tells of the day he died."
    ur: "ہجرت میں اپنا مال چھوڑا، اللہ نے کئی گنا لوٹایا، اور صدقے کے قافلے بھیجتے رہے یہاں تک کہ مدینہ آج بھی ان کے رحلت کا دن یاد کرتا ہے۔"
    es: "Emigró dejando atrás su fortuna, fue recompensado con creces y siguió enviando caravanas de caridad hasta que Medina aún cuenta la historia del día en que murió."
    fr: "Il émigra en abandonnant sa fortune, fut récompensé au centuple et continua d'envoyer des caravanes de charité jusqu'à ce que Médine raconte encore le jour de sa mort."
    tr: "Servetini geride bırakarak göç etti ve Tanrı ona servetini kat kat geri verdi. Şehir onun ayrıldığı günü hatırlayana kadar kervanlara sadaka vererek destek oldu."
    id: "Ia beremigrasi, meninggalkan kekayaannya, dan Tuhan mengembalikannya kepadanya berkali-kali lipat. Ia biasa membantu kafilah-kafilah dengan amal hingga kota itu mengingat hari kepergiannya."
