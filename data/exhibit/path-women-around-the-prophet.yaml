label:
  ar: 'النساء حول النبي: اثنتا عشرة سيرة'
  en: "The Women Around the Prophet: Twelve Lives"
  es: "Las mujeres que rodearon al profeta: Doce vidas"
  fr: "Les femmes autour du prophète: douze vies"
  ur: "نبی کے آس پاس کی خواتین: بارہ زندگی"
  tr: "Peygamberin Çevresindeki Kadınlar: On İki Biyografi"
  id: "Wanita di sekitar Nabi: Dua belas biografi"
summary:
  ar: مسارٌ بين حياة اثنتي عشرة امرأة من محيط النبي، من الصابرات في مكة إلى المهاجرات والمقاتلات وأمهات المؤمنين، تعرفهن بما نُقل عنهن.
  en: "A trail through the lives of twelve women from the Prophet's circle — from the steadfast in Mecca to the emigrants, the fighters and the Mothers of the Believers — known by what has been transmitted of them."
  es: "Un recorrido por las vidas de doce mujeres del círculo del Profeta —desde las fieles en La Meca hasta las emigrantes, las luchadoras y las Madres de los Creyentes— conocidas por lo que se ha transmitido de ellas."
  fr: "Un parcours à travers la vie de douze femmes de l'entourage du Prophète — des fidèles de La Mecque aux émigrantes, en passant par les combattantes et les Mères des Croyants — connues par ce qui leur a été transmis."
  ur: "حلقہ نبوی سے تعلق رکھنے والی بارہ خواتین کی زندگی کا ایک پگڈنڈی - مکہ میں ثابت قدم رہنے سے لے کر ہجرت کرنے والوں، جنگجوؤں اور مومنوں کی ماؤں تک - جو ان میں سے منتقل ہوا ہے اس سے جانا جاتا ہے۔"
  tr: "Peygamberimizin çevresinden on iki kadının hayatına bir yolculuk: Mekke'deki sabırlı kadınlardan, hicret edenlere, savaşçılara ve müminlerin annelerine kadar uzanan bu yolculukta, onlar hakkında anlatılanları sizlerle paylaşıyoruz."
  id: "Sebuah perjalanan menelusuri kehidupan dua belas wanita dari lingkaran Nabi, dari wanita-wanita sabar di Mekah hingga para emigran, pejuang, dan ibu-ibu kaum beriman, memperkenalkan mereka pada apa yang telah diriwayatkan tentang mereka."
