id: exhibit/path-women-around-the-prophet
class: exhibit
kind: trail
label:
  ar: 'النساء حول النبي: اثنتا عشرة سيرة'
  en: "The Women Around the Prophet: Twelve Lives"
summary:
  ar: مسارٌ بين حياة اثنتي عشرة امرأة من محيط النبي، من الصابرات في مكة إلى المهاجرات والمقاتلات وأمهات المؤمنين، تعرفهن بما نُقل عنهن.
  en: "A trail through the lives of twelve women from the Prophet's circle — from the steadfast in Mecca to the emigrants, the fighters and the Mothers of the Believers — known by what has been transmitted of them."
