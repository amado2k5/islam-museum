id: exhibit/hunt-seven-places
class: exhibit
kind: trail
label:
  ar: سبعة ألغاز، سبعة أماكن
  en: Seven riddles, seven places
  ur: سات پہیلیاں، سات مقامات
  fr: Sept énigmes, sept lieux
  es: Siete acertijos, siete lugares
  tr: Yedi bilmece, yedi yer
  id: Tujuh teka-teki, tujuh tempat
summary:
  ar: 'مفتاح لعبة البحث عن الكنز: سبعة أماكن تتكلم بالألغاز، من غار الكلمة الأولى إلى خزانة كتب بغداد، وجواب كل لغز معه.'
  en: 'The key to the museum''s treasure hunt: seven places that speak in riddles, from the cave of the first word to the library of Baghdad, each with its answer.'
  ur: 'عجائب گھر کی خزانے کی تلاش کی کنجی: پہیلیوں میں بولتے سات مقامات، پہلے لفظ کے غار سے بغداد کے کتب خانے تک، ہر ایک اپنے جواب کے ساتھ۔'
  fr: 'La clé de la chasse au trésor du musée : sept lieux qui parlent par énigmes, de la grotte du premier mot à la bibliothèque de Bagdad, chacun avec sa réponse.'
  es: 'La clave de la búsqueda del tesoro del museo: siete lugares que hablan con acertijos, de la cueva de la primera palabra a la biblioteca de Bagdad, cada uno con su respuesta.'
  tr: 'Müzenin hazine avının anahtarı: ilk sözün mağarasından Bağdat kütüphanesine, bilmecelerle konuşan yedi yer ve cevapları.'
  id: 'Kunci perburuan harta museum: tujuh tempat yang berbicara dalam teka-teki, dari gua kata pertama hingga perpustakaan Baghdad, masing-masing dengan jawabannya.'
audience:
