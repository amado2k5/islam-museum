rooms:
- title:
    ar: غار حراء
    en: Ghar Hira (Cave of Hira)
    ur: غار حرا ⁦(غار حرا)⁩
    fr: Ghar Hira (Grotte de Hira)
    es: Ghar Hira (Cueva de Hira)
    tr: Hira Mağarası
    id: Gua Hira
  body:
    ar: 'أنا صغير: طولي أربعة أذرع، ولا أتسع إلا لواحد أو اثنين. في أعلى جبل النور سُمعت عندي الكلمة الأولى: اقرأ. فما أنا؟'
    en: 'I am small: four cubits long, with room for one or two. High on the Mountain of Light, the first word was heard in me: Read. What am I?'
    ur: 'میں چھوٹا ہوں: چار ہاتھ لمبا، ایک دو آدمیوں کی جگہ۔ جبل نور کی بلندی پر مجھ میں پہلا لفظ سنا گیا: پڑھو۔ میں کیا ہوں؟'
    fr: 'Je suis petite : quatre coudées de long, de la place pour une ou deux personnes. En haut de la montagne de la Lumière, on a entendu en moi le premier mot : Lis. Que suis-je ?'
    es: 'Soy pequeña: cuatro codos de largo, con sitio para una o dos personas. En lo alto del monte de la Luz se oyó en mí la primera palabra: Lee. ¿Qué soy?'
    tr: 'Küçüğüm: boyum dört arşın, bir ya da iki kişi sığar. Nur Dağı''nın yükseğinde ilk söz bende duyuldu: Oku. Ben neyim?'
    id: 'Aku kecil: panjangku empat hasta, cukup untuk satu atau dua orang. Di ketinggian Gunung Cahaya, kata pertama terdengar di dalamku: Bacalah. Apakah aku?'
  features:
  - place/ghar-hira
  why_next:
    ar: 'من غار إلى بيت: انزل إلى مكة وابحث عن دار على تل.'
    en: 'From a cave to a house: go down to Mecca and look for a home on a hill.'
    ur: 'غار سے گھر تک: مکہ اترو اور ایک پہاڑی پر گھر تلاش کرو۔'
    fr: 'D''une grotte à une maison : descendez à La Mecque et cherchez une demeure sur une colline.'
    es: 'De una cueva a una casa: baje a La Meca y busque un hogar sobre una colina.'
    tr: 'Bir mağaradan bir eve: Mekke''ye inin ve tepedeki bir evi arayın.'
    id: 'Dari gua ke rumah: turunlah ke Makkah dan carilah sebuah rumah di atas bukit.'
- title:
    ar: دار الأرقم
    en: Dar al-Arqam
    ur: دار ارقم
    fr: Dar al-Arqam
    es: Dar al-Arqam
    tr: Dar Al Arqam
    id: Dar Al Arqam
  body:
    ar: أنا دار على الصفا بمكة. حين كان الإيمان يُقال همسًا اجتمع الناس فيّ سرًّا. أحمل اسم صاحبي. فدار من أنا؟
    en: I am a house on the hill of al-Safa in Mecca. When faith had to be whispered, people met inside me in secret. I carry my owner's name. Whose house am I?
    ur: میں مکہ میں صفا پر ایک گھر ہوں۔ جب ایمان سرگوشی میں بیان ہوتا تھا، لوگ مجھ میں چھپ کر ملتے تھے۔ میں اپنے مالک کا نام رکھتا ہوں۔ میں کس کا گھر ہوں؟
    fr: Je suis une maison sur la colline d'al-Safa, à La Mecque. Quand la foi se disait à voix basse, on se réunissait chez moi en secret. Je porte le nom de mon propriétaire. La maison de qui suis-je ?
    es: Soy una casa en la colina de al-Safa, en La Meca. Cuando la fe se decía en susurros, la gente se reunía en mí en secreto. Llevo el nombre de mi dueño. ¿De quién soy la casa?
    tr: Mekke'de Safa tepesinde bir evim. İman fısıltıyla söylenirken insanlar bende gizlice toplandı. Sahibimin adını taşırım. Ben kimin eviyim?
    id: Aku sebuah rumah di bukit Safa di Makkah. Ketika iman harus dibisikkan, orang-orang berkumpul di dalamku secara rahasia. Aku menyandang nama pemilikku. Rumah siapakah aku?
  features:
  - building/dar-al-arqam
  why_next:
    ar: ثم جاء وقت الرحيل، وكان الطريق الأول إلى الجنوب.
    en: Then came the time to leave, and the first road led south.
    ur: پھر رخصت کا وقت آیا، اور پہلا راستہ جنوب کو جاتا تھا۔
    fr: Puis vint le temps de partir, et le premier chemin menait au sud.
    es: Luego llegó la hora de partir, y el primer camino llevaba al sur.
    tr: Sonra ayrılma vakti geldi ve ilk yol güneye gidiyordu.
    id: Lalu tibalah waktu untuk pergi, dan jalan pertama mengarah ke selatan.
- title:
    ar: غار ثور
    en: Ghar Thawr (Cave of Thawr)
    ur: غار ثور
    fr: Ghar Thawr (Grotte de Thawr)
    es: Ghar Thawr (Cueva de Thawr)
    tr: Thor Mağarası
    id: Gua Thor
  body:
    ar: أنا غار، ولست الغار الأول. في قمة جبل وعر جنوب مكة اختبأ فيّ مسافران ثلاث ليالٍ، وبلغ المطاردون بابي ثم رجعوا. فما اسمي؟
    en: I am a cave, but not the first one. At the top of a rugged mountain south of Mecca, two travellers hid in me for three nights. Their pursuers reached my door and turned back. What is my name?
    ur: میں ایک غار ہوں مگر پہلا نہیں۔ مکہ کے جنوب میں ایک دشوار پہاڑ کی چوٹی پر دو مسافر تین راتیں مجھ میں چھپے رہے۔ پیچھا کرنے والے میرے دروازے تک آئے اور لوٹ گئے۔ میرا نام کیا ہے؟
    fr: Je suis une grotte, mais pas la première. Au sommet d'une montagne escarpée au sud de La Mecque, deux voyageurs se sont cachés en moi trois nuits. Leurs poursuivants arrivèrent à mon entrée et repartirent. Quel est mon nom ?
    es: Soy una cueva, pero no la primera. En la cima de un monte escarpado al sur de La Meca, dos viajeros se ocultaron en mí tres noches. Sus perseguidores llegaron a mi entrada y se volvieron. ¿Cómo me llamo?
    tr: Bir mağarayım ama ilki değilim. Mekke'nin güneyinde sarp bir dağın tepesinde iki yolcu bende üç gece gizlendi. Peşlerindekiler kapıma kadar gelip geri döndü. Adım ne?
    id: Aku sebuah gua, tetapi bukan yang pertama. Di puncak gunung terjal di selatan Makkah, dua musafir bersembunyi di dalamku tiga malam. Para pengejar sampai di pintuku lalu kembali. Siapa namaku?
  features:
  - place/ghar-thawr
  why_next:
    ar: بعد ثلاث ليالٍ سار الطريق شمالًا إلى قرية عند المدينة.
    en: After three nights the road turned north, to a village near Medina.
    ur: تین راتوں کے بعد راستہ شمال کو مدینہ کے قریب ایک بستی کی طرف مڑا۔
    fr: Après trois nuits, la route tourna vers le nord, vers un village près de Médine.
    es: Tras tres noches, el camino giró al norte, hacia una aldea cercana a Medina.
    tr: Üç gecenin ardından yol kuzeye, Medine yakınında bir köye döndü.
    id: Setelah tiga malam, jalan berbelok ke utara, ke sebuah desa di dekat Madinah.
- title:
    ar: مسجد قباء
    en: Quba Mosque
    ur: مسجد قبا
    fr: Mosquée de Quba
    es: Mezquita de Quba
    tr: Quba Camii
    id: Masjid Quba
  body:
    ar: أنا مسجد في قرية من أرض المدينة. تقول رواية إني أول مسجد أسسه المسلمون، ويُذكر أن لي زيارة كل سبت. فما اسمي؟
    en: I am a mosque in a village in the territory of Medina. One tradition says I was the first mosque founded by Muslims, and a visit to me every Saturday is reported. What is my name?
    ur: میں مدینہ کی زمین کی ایک بستی میں مسجد ہوں۔ ایک روایت کہتی ہے کہ میں مسلمانوں کی قائم کردہ پہلی مسجد ہوں، اور ہر ہفتے کے دن میری زیارت کا ذکر ملتا ہے۔ میرا نام کیا ہے؟
    fr: Je suis une mosquée dans un village du territoire de Médine. Selon une tradition, je fus la première mosquée fondée par des musulmans, et l'on rapporte une visite chaque samedi. Quel est mon nom ?
    es: Soy una mezquita en una aldea del territorio de Medina. Según una tradición, fui la primera mezquita fundada por musulmanes, y se cuenta que se me visitaba cada sábado. ¿Cómo me llamo?
    tr: Medine topraklarındaki bir köyde bir camiyim. Bir rivayete göre Müslümanların kurduğu ilk cami benim; her cumartesi ziyaret edildiğim de anlatılır. Adım ne?
    id: Aku masjid di sebuah desa di wilayah Madinah. Menurut satu riwayat, akulah masjid pertama yang didirikan kaum Muslim, dan dikisahkan ada kunjungan kepadaku setiap hari Sabtu. Siapa namaku?
  features:
  - building/masjid-quba
  why_next:
    ar: بعد نحو سبعين سنة، ارتفعت قبة فوق مدينة أخرى.
    en: About seventy years later, a dome rose over another city.
    ur: تقریباً ستر برس بعد ایک اور شہر پر ایک گنبد بلند ہوا۔
    fr: Environ soixante-dix ans plus tard, une coupole s'éleva sur une autre ville.
    es: Unos setenta años después, una cúpula se alzó sobre otra ciudad.
    tr: Yaklaşık yetmiş yıl sonra başka bir şehrin üstünde bir kubbe yükseldi.
    id: Sekitar tujuh puluh tahun kemudian, sebuah kubah menjulang di atas kota lain.
- title:
    ar: قبة الصخرة
    en: Dome of the Rock
    ur: چٹان کا گنبد
    fr: Dôme du Rocher
    es: Cúpula de la Roca
    tr: Kubbetü’s-Sahra
    id: Kubah Batu
  body:
    ar: لي ثمانية أضلاع وقبة مذهبة، وأقف في القدس. نقشي الطويل يحمل سنة 72هـ. فما أنا؟
    en: I have eight sides and a gilded dome, and I stand in Jerusalem. My long inscription carries the year 72 AH. What am I?
    ur: میرے آٹھ پہلو اور ایک سنہرا گنبد ہے، اور میں یروشلم میں ہوں۔ میرے طویل کتبے پر 72 ہجری کا سال ہے۔ میں کیا ہوں؟
    fr: J'ai huit côtés et une coupole dorée, et je me dresse à Jérusalem. Ma longue inscription porte l'an 72 de l'hégire. Que suis-je ?
    es: Tengo ocho lados y una cúpula dorada, y me alzo en Jerusalén. Mi larga inscripción lleva el año 72 de la hégira. ¿Qué soy?
    tr: Sekiz kenarım ve yaldızlı bir kubbem var, Kudüs'te dururum. Uzun kitabem hicrî 72 yılını taşır. Ben neyim?
    id: Aku bersisi delapan dan berkubah emas, berdiri di Yerusalem. Prasasti panjangku memuat tahun 72 H. Apakah aku?
  features:
  - building/dome-of-the-rock
  why_next:
    ar: سِر الآن غربًا إلى إفريقية.
    en: Now travel west, to North Africa.
    ur: اب مغرب کو شمالی افریقہ چلو۔
    fr: Voyagez maintenant vers l'ouest, en Afrique du Nord.
    es: Viaje ahora al oeste, al norte de África.
    tr: Şimdi batıya, Kuzey Afrika'ya gidin.
    id: Kini berjalanlah ke barat, ke Afrika Utara.
- title:
    ar: جامع القيروان
    en: Great Mosque of Qayrawan
    ur: قیروان کی عظیم مسجد
    fr: Grande Mosquée de Kairouan
    es: Gran Mezquita de Qayrawan
    tr: Kairouan Camii
    id: Masjid Kairouan
  body:
    ar: خُطّ موضعي قبل أن تُخطّ المدينة من حولي. مزاريبي من الرصاص وصحني من الرخام، ومن أبوابي باب الصباغين. في أي مدينة أنا؟
    en: My ground was marked out before the city around me. My gutters were of lead, my courtyard was of marble, and one of my gates was the Gate of the Dyers. In which city do I stand?
    ur: میری جگہ کا نشان اردگرد کے شہر سے پہلے لگایا گیا۔ میرے پرنالے سیسے کے اور صحن سنگ مرمر کا تھا، اور میرا ایک دروازہ باب الصباغین تھا۔ میں کس شہر میں ہوں؟
    fr: Mon emplacement fut tracé avant la ville qui m'entoure. Mes gouttières étaient de plomb, ma cour de marbre, et l'une de mes portes était celle des Teinturiers. Dans quelle ville suis-je ?
    es: Mi solar se trazó antes que la ciudad que me rodea. Mis canalones eran de plomo, mi patio de mármol, y una de mis puertas era la de los Tintoreros. ¿En qué ciudad estoy?
    tr: Yerim, çevremdeki şehirden önce çizildi. Oluklarım kurşundan, avlum mermerdendi; kapılarımdan biri Boyacılar Kapısı'ydı. Hangi şehirdeyim?
    id: Tempatku ditandai sebelum kota di sekelilingku. Talangku dari timah hitam, pelataranku dari marmer, dan salah satu gerbangku adalah Gerbang Para Pencelup. Di kota mana aku berdiri?
  features:
  - building/jami-qayrawan
  why_next:
    ar: 'بقي باب واحد: عُد شرقًا إلى بغداد.'
    en: 'One door is left: turn back east, to Baghdad.'
    ur: 'ایک دروازہ باقی ہے: مشرق کو بغداد لوٹو۔'
    fr: 'Il reste une porte : revenez vers l''est, à Bagdad.'
    es: 'Queda una puerta: vuelva al este, a Bagdad.'
    tr: 'Tek bir kapı kaldı: doğuya, Bağdat''a dönün.'
    id: 'Tinggal satu pintu: kembalilah ke timur, ke Baghdad.'
- title:
    ar: بيت الحكمة ⁦(خزانة الحكمة)⁩
    en: Bayt al-Hikma — the House of Wisdom
    ur: بیت الحکمہ - حکمت کا گھر
    fr: Bayt al-Hikma — la Maison de la Sagesse
    es: Bayt al-Hikma — la Casa de la Sabiduría
    tr: Beytülhikma (Bilgelik Hazinesi)
    id: Bayt Al-Hikma (Perbendaharaan Kebijaksanaan)
  body:
    ar: كنت خزانة كتب ببغداد، نُقلت فيها كتب الأمم إلى العربية. ولا يُعرف اليوم موضعي على وجه التعيين. فما أنا؟
    en: I was a library in Baghdad, where books of other nations were turned into Arabic. Today no one knows exactly where I stood. What am I?
    ur: میں بغداد کا ایک کتب خانہ تھا جہاں دوسری قوموں کی کتابیں عربی میں منتقل ہوئیں۔ آج کوئی ٹھیک نہیں جانتا کہ میں کہاں تھا۔ میں کیا ہوں؟
    fr: J'étais une bibliothèque de Bagdad où les livres d'autres peuples passaient en arabe. Aujourd'hui, nul ne sait exactement où je me trouvais. Que suis-je ?
    es: Fui una biblioteca de Bagdad donde libros de otros pueblos se vertían al árabe. Hoy nadie sabe con exactitud dónde estuve. ¿Qué soy?
    tr: Bağdat'ta bir kütüphaneydim; başka milletlerin kitapları bende Arapçaya çevrildi. Bugün tam yerimi kimse bilmiyor. Ben neyim?
    id: Aku perpustakaan di Baghdad, tempat buku-buku bangsa lain dialihkan ke bahasa Arab. Kini tak seorang pun tahu persis di mana aku berdiri. Apakah aku?
  features:
  - building/bayt-al-hikma
