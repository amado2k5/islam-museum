    es: "El tercer rango en el hadiz de Gabriel, después del Islam y el iman."
    fr: "Le troisième rang dans le hadith de Gabriel, après l'islam et la foi."
    ur: "جبرائیل کی حدیث میں اسلام اور ایمان کے بعد تیسرا درجہ ہے۔"
    tr: "Cebrail hadislerinde İslam ve imandan sonra üçüncü sırada yer alır."
    id: "Peringkat ketiga dalam hadits Jibril, setelah Islam dan iman."
  features:
