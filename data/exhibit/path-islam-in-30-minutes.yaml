    tr: "Hac"
    id: "Haji"
  body:
    ar: 'الركن الخامس: قصد البيت الحرام لمن استطاع، وهو يقودك إلى مكة.'
    en: "The fifth pillar: the pilgrimage to the Sacred House for whoever is able, which leads you to Mecca."
    es: "El quinto pilar: la peregrinación a la Casa Sagrada para quien pueda, que conduce a La Meca."
    fr: "Le cinquième pilier: le pèlerinage à la Maison Sainte pour tous ceux qui en ont la possibilité, qui conduit à La Mecque."
    ur: "پانچواں ستون: جو بھی استطاعت رکھتا ہو اس کے لیے بیت المقدس کی زیارت، جو آپ کو مکہ کی طرف لے جاتی ہے۔"
    tr: "Beşinci şart: Gücü yetenlerin Kutsal Evi (Kâbe'yi) ziyaret etme niyeti ve bu niyet sizi Mekke'ye götürür."
    id: "Pilar kelima: Berniat mengunjungi Rumah Suci (Ka'bah) bagi mereka yang mampu, dan hal itu akan membawa Anda ke Mekah."
  features:
