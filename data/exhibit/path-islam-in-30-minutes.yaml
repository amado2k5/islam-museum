id: exhibit/path-islam-in-30-minutes
class: exhibit
kind: tour
label:
  ar: الإسلام في ثلاثين دقيقة
  en: "Islam in Thirty Minutes"
  es: "El Islam en treinta minutos"
  fr: "L'islam en trente minutes"
  ur: "تیس منٹ میں اسلام"
  tr: "30 Dakikada İslam"
  id: "Islam dalam 30 menit"
summary:
  ar: 'مسارٌ تمهيدي لمن لم يعرف الإسلام من قبل: معنى الإسلام والإيمان والإحسان، والأركان الخمسة وكيف تُؤدّى، ثم من هو النبي وكيف بدأت الرسالة ومن أين يبدأ التقويم الهجري.'
  en: "An introductory trail for those who have not known Islam before: the meanings of Islam, iman and ihsan, the five pillars and how they are performed, then who the Prophet is, how the message began and where the Hijri calendar starts."
  es: "Un recorrido introductorio para quienes no conocen el Islam: los significados del Islam, iman e ihsan, los cinco pilares y cómo se practican, quién es el Profeta, cómo comenzó el mensaje y dónde empieza el calendario Hijri."
  fr: "Un parcours d'introduction pour ceux qui ne connaissent pas l'islam auparavant: les significations de l'islam, de l'iman et de l'ihsan, les cinq piliers et leur mise en pratique, puis qui est le Prophète, comment le message a commencé et où commence le calendrier hégirien."
  ur: "ان لوگوں کے لیے ایک تعارفی راستہ جو اسلام کو پہلے نہیں جانتے تھے: اسلام، ایمان اور احسان کے معنی، پانچ ستون اور ان پر عمل کیسے کیا جاتا ہے، پھر پیغمبر کون ہیں، پیغام کیسے شروع ہوا اور ہجری کیلنڈر کہاں سے شروع ہوتا ہے۔"
  tr: "İslam'ı daha önce tanımayanlar için giriş niteliğinde bir kurs: İslam'ın anlamı, iman ve iyi ameller, beş şart ve bunların nasıl yerine getirildiği, Peygamberin kim olduğu, mesajın nasıl başladığı ve Hicri takvimin nerede başladığı."
  id: "Kursus pengantar bagi mereka yang belum mengenal Islam: makna Islam, iman dan amal saleh, lima rukun Islam dan cara pelaksanaannya, kemudian siapa Nabi Muhammad SAW, bagaimana risalah dimulai, dan di mana kalender Hijriah dimulai."
audience:
- newcomer
duration_minutes: 30
wings: []
