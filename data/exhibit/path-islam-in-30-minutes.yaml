  body:
    ar: اقرأ كيف يميّزها الحديث عن صدقة التطوع، ومن مصارفها.
    en: "Read how the hadith distinguishes it from voluntary charity, and who its recipients are."
    es: "Lea cómo el hadiz la distingue de la caridad voluntaria y quiénes son sus beneficiarios."
    fr: "Découvrez comment le hadith la distingue de la charité volontaire et qui en sont les bénéficiaires."
    ur: "پڑھیں کہ حدیث اسے رضاکارانہ خیرات سے کیسے ممتاز کرتی ہے، اور اس کے وصول کنندگان کون ہیں۔"
    tr: "Hadisin, bunu gönüllü sadakadan ve sadaka harcamalarından nasıl ayırdığını okuyun."
    id: "Bacalah bagaimana hadits tersebut membedakannya dari sedekah sukarela, dan dari pengeluarannya."
  features:
  - practice/zakat
- title:
