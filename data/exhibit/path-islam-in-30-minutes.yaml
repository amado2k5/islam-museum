    es: "Tras ver las columnas, conozca al portador del mensaje, tal como lo presenta el museo."
    fr: "Après les piliers, rencontrez le porteur du message tel que le musée le présente."
    ur: "ستونوں کے بعد، پیغام کے حامل سے ملیں جیسا کہ میوزیم اسے پیش کرتا ہے۔"
    tr: "Köşeleri gezdikten sonra, müze tarafından sunulan mesajın yazarını tanıyın."
    id: "Setelah melewati sudut-sudut, kenali penulis pesan seperti yang disajikan oleh museum."
