rooms:
- title:
    ar: ما الإسلام؟
    en: "What Is Islam?"
    es: "¿Qué es el Islam?"
    fr: "Qu'est-ce que l'islam ?"
    ur: "اسلام کیا ہے؟"
    tr: "İslam nedir?"
    id: "Apakah Islam itu?"
  body:
    ar: 'ابدأ بالكلمة نفسها: كيف عرّفها النبي في الحديث، وما الدعائم التي يقوم عليها.'
    en: "Start with the word itself: how the Prophet defined it in the hadith, and the supports it rests on."
    es: "Comencemos con la palabra misma: cómo la definió el Profeta en el hadiz y los fundamentos en los que se basa."
    fr: "Commencez par le mot lui-même: comment le Prophète l’a défini dans le hadith, et les fondements sur lesquels il repose."
    ur: "اس لفظ سے شروع کریں: حدیث میں نبی نے اس کی تعریف کیسے کی ہے، اور اس کی تائید کس طرح ہوتی ہے۔"
    tr: "Kelimenin kendisinden başlayalım: Peygamberimiz hadiste onu nasıl tanımladı ve hangi esaslara dayanıyor?"
    id: "Mulailah dengan kata itu sendiri: bagaimana Nabi mendefinisikannya dalam hadits, dan apa saja pilar-pilar yang menjadi dasarnya."
  features:
  - concept/islam-din
- title:
    ar: ما الإيمان؟
    en: "What Is Iman?"
    es: "¿Qué es el Imán?"
    fr: "Qu'est-ce que l'Iman ?"
    ur: "ایمان کیا ہے؟"
    tr: "İman nedir?"
    id: "Apakah itu iman?"
  body:
    ar: "حديث جبريل يسأل عن الإيمان والإسلام والإحسان. والسؤال المطروح هنا: هل يدخل العمل في حقيقة الإيمان؟ اقرأ الأقوال المنقولة في الصفحة، وانتبه إلى موقف أهل الحديث كما يعرضه صحيح البخاري."
    en: "Gabriel's hadith asks about iman, Islam and ihsan. The question open here is whether deeds belong to the reality of iman; read the positions quoted on the page, and note the hadith scholars' position as Sahih al-Bukhari presents it."
    es: "El hadiz de Gabriel pregunta sobre el iman, el Islam y el ihsan. La cuestión que se plantea aquí es si las obras forman parte de la realidad del iman; lea las posturas citadas en la página y observe la posición de los eruditos del hadiz tal como la presenta Sahih al-Bukhari."
    fr: "Le hadith de Gabriel interroge les auteurs sur la foi (iman), l'islam et l'excellence (ihsan). La question qui se pose est de savoir si les actes relèvent de la réalité de la foi ; il convient d'examiner les avis cités et de prendre note de la position des savants du hadith telle que présentée par Sahih al-Bukhari."
    ur: "جبرائیل کی حدیث ایمان، اسلام اور احسان کے بارے میں سوال کرتی ہے۔ یہاں سوال کھلتا ہے کہ کیا اعمال کا تعلق ایمان کی حقیقت سے ہے؟ صفحہ پر درج کی گئی پوزیشنوں کو پڑھیں، اور صحیح البخاری کے پیش کردہ حدیث کے علماء کے موقف کو نوٹ کریں۔"
    tr: "Cebrail Hadisi, iman, İslam ve ihsan (mükemmellik) hakkında sorular sorar. Burada sorulan soru şudur: Amel, iman tanımı kapsamına girer mi? Sayfada alıntılanan ifadeleri okuyun ve Sahih el-Buhari'de sunulan hadis âlimlerinin görüşüne dikkat edin."
    id: "Hadits Jibril menanyakan tentang iman, Islam, dan Ihsan (keunggulan). Pertanyaan yang diajukan di sini adalah: Apakah amal perbuatan termasuk dalam definisi iman? Bacalah pernyataan yang dikutip di halaman ini, dan perhatikan posisi para ulama Hadits sebagaimana yang disajikan dalam Sahih al-Bukhari."
  features:
