id: exhibit/path-islam-in-30-minutes
class: exhibit
kind: tour
label:
  ar: الإسلام في ثلاثين دقيقة
  en: "Islam in Thirty Minutes"
summary:
  ar: 'مسارٌ تمهيدي لمن لم يعرف الإسلام من قبل: معنى الإسلام والإيمان والإحسان، والأركان الخمسة وكيف تُؤدّى، ثم من هو النبي وكيف بدأت الرسالة ومن أين يبدأ التقويم الهجري.'
  en: "An introductory trail for those who have not known Islam before: the meanings of Islam, iman and ihsan, the five pillars and how they are performed, then who the Prophet is, how the message began and where the Hijri calendar starts."
audience:
- newcomer
duration_minutes: 30
wings: []
periods:
- period/prophetic-era
regions:
- arabia
rooms:
- title:
    ar: ما الإسلام؟
    en: "What Is Islam?"
  body:
    ar: 'ابدأ بالكلمة نفسها: كيف عرّفها النبي في الحديث، وما الدعائم التي يقوم عليها.'
    en: "Start with the word itself: how the Prophet defined it in the hadith, and the supports it rests on."
  features:
  - concept/islam-din
- title:
    ar: ما الإيمان؟
    en: "What Is Iman?"
  body:
    ar: "حديث جبريل يسأل عن الإيمان والإسلام والإحسان. والسؤال المطروح هنا: هل يدخل العمل في حقيقة الإيمان؟ اقرأ الأقوال المنقولة في الصفحة، وانتبه إلى موقف أهل الحديث كما يعرضه صحيح البخاري."
    en: "Gabriel's hadith asks about iman, Islam and ihsan. The question open here is whether deeds belong to the reality of iman; read the positions quoted on the page, and note the hadith scholars' position as Sahih al-Bukhari presents it."
  features:
  - concept/iman
- title:
    ar: ما الإحسان؟
    en: "What Is Ihsan?"
  body:
    ar: المرتبة الثالثة في حديث جبريل، بعد الإسلام والإيمان.
    en: "The third rank in Gabriel's hadith, after Islam and iman."
  features:
  - concept/ihsan
- title:
    ar: الأركان الخمسة
    en: "The Five Pillars"
  body:
    ar: 'الآن ترى الصورة كلها في سطر واحد: الأعمال الخمسة التي بُني عليها الإسلام.'
    en: "Now you see the whole picture in one line: the five works on which Islam is built."
  features:
  - concept/five-pillars
- title:
    ar: الشهادة
    en: "The Testimony"
  body:
    ar: أول الأركان في ترتيب حديث ابن عمر.
    en: "The first pillar in the order of Ibn Umar's hadith."
  features:
  - concept/shahada
- title:
    ar: الصلاة
    en: "The Prayer"
  body:
    ar: 'الركن الثاني: كيف تتكرر في اليوم والليلة، وماذا يفرّق الفريضة عن التطوع.'
    en: "The second pillar: how it recurs through day and night, and what distinguishes the obligatory from the voluntary."
  features:
  - practice/salah
- title:
    ar: الزكاة
    en: "The Zakat"
  body:
    ar: اقرأ كيف يميّزها الحديث عن صدقة التطوع، ومن مصارفها.
    en: "Read how the hadith distinguishes it from voluntary charity, and who its recipients are."
  features:
  - practice/zakat
- title:
    ar: صيام رمضان
    en: "Fasting Ramadan"
  body:
    ar: 'الركن الرابع: الشهر الذي أُنزل فيه القرآن، ومن تُرخَّص له الفطر.'
    en: "The fourth pillar: the month in which the Qur'an was sent down, and who is granted leave to break the fast."
  features:
  - practice/sawm-ramadan
- title:
    ar: الحج
    en: "The Hajj"
  body:
    ar: 'الركن الخامس: قصد البيت الحرام لمن استطاع، وهو يقودك إلى مكة.'
    en: "The fifth pillar: the pilgrimage to the Sacred House for whoever is able, which leads you to Mecca."
  features:
  - practice/hajj
- title:
    ar: من هو النبي؟
    en: "Who Is the Prophet?"
  body:
    ar: بعد الأركان، تعرّف على صاحب الرسالة كما يقدّمه المتحف.
    en: "After the pillars, meet the bearer of the message as the museum presents him."
  features:
  - person/muhammad
- title:
    ar: كيف بدأت الرسالة؟
    en: "How Did the Message Begin?"
  body:
    ar: 'غار حراء ونزول الوحي: أول لحظة في القصة.'
    en: "The cave of Hira and the descent of the revelation: the first moment of the story."
  features:
  - event/first-revelation
- title:
    ar: الهجرة وبداية التقويم
    en: "The Hijra and the Start of the Calendar"
  body:
    ar: الحدث الذي يبدأ منه التقويم الهجري، ونهاية المسار.
    en: "The event from which the Hijri calendar begins, and the end of the trail."
  features:
  - event/hijra
