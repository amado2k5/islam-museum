- title:
    ar: الأركان الخمسة
    en: "The Five Pillars"
    es: "Los cinco pilares"
    fr: "Les cinq piliers"
    ur: "پانچ ستون"
    tr: "Beş Temel İlke"
    id: "Lima Pilar"
  body:
    ar: 'الآن ترى الصورة كلها في سطر واحد: الأعمال الخمسة التي بُني عليها الإسلام.'
    en: "Now you see the whole picture in one line: the five works on which Islam is built."
    es: "Ahora puedes ver el panorama completo en una sola línea: las cinco obras sobre las que se fundamenta el Islam."
    fr: "Vous voyez maintenant le tableau d'ensemble en une seule phrase: les cinq œuvres sur lesquelles l'islam est bâti."
    ur: "اب آپ پوری تصویر کو ایک لائن میں دیکھیں: وہ پانچ کام جن پر اسلام کی تعمیر ہے۔"
    tr: "Şimdi tüm resmi tek bir satırda görüyorsunuz: İslam'ın üzerine kurulduğu beş temel eser."
    id: "Sekarang Anda dapat melihat gambaran keseluruhannya dalam satu kalimat: lima karya yang menjadi landasan Islam."
  features:
  - concept/five-pillars
