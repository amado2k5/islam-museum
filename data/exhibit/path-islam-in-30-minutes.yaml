  body:
    ar: 'الركن الثاني: كيف تتكرر في اليوم والليلة، وماذا يفرّق الفريضة عن التطوع.'
    en: "The second pillar: how it recurs through day and night, and what distinguishes the obligatory from the voluntary."
    es: "El segundo pilar: cómo se repite día y noche, y qué distingue lo obligatorio de lo voluntario."
    fr: "Le deuxième pilier: comment il se répète jour et nuit, et ce qui distingue l'obligatoire du volontaire."
    ur: "دوسرا ستون: یہ دن اور رات میں کیسے دہرایا جاتا ہے، اور کیا چیز واجب کو رضاکارانہ سے ممتاز کرتی ہے۔"
    tr: "İkinci temel ilke: Bunun gece gündüz nasıl tekrarlandığı ve farz olan fiilleri gönüllü olanlardan ayıran özellikler nelerdir?"
    id: "Pilar kedua: Bagaimana hal itu diulang-ulang siang dan malam, dan apa yang membedakan amalan wajib dari amalan sunnah."
  features:
  - practice/salah
- title:
    ar: الزكاة
