    fr: "Le premier pilier de l'ordre des hadiths d'Ibn Umar."
    ur: "ابن عمر کی حدیث کی ترتیب میں پہلا ستون۔"
    tr: "İbn Ömer'in hadislerinin düzenlenmesindeki ilk temel direk."
    id: "Pilar pertama dalam susunan hadits Ibnu Umar."
  features:
