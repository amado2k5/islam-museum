    ur: "پیغام کیسے شروع ہوا؟"
    tr: "Mesaj nasıl başladı?"
    id: "Bagaimana pesan itu bermula?"
  body:
    ar: 'غار حراء ونزول الوحي: أول لحظة في القصة.'
    en: "The cave of Hira and the descent of the revelation: the first moment of the story."
    es: "La cueva de Hira y el descenso de la revelación: el primer momento de la historia."
    fr: "La grotte de Hira et la descente de la révélation: le premier moment du récit."
    ur: "غار حرا اور نزول وحی: کہانی کا پہلا لمحہ۔"
    tr: "Hira Mağarası ve vahiy: hikâyenin ilk anı."
    id: "Gua Hira dan wahyu: momen pertama dalam cerita."
