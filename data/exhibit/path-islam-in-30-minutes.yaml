    es: "El acontecimiento que da comienzo al calendario islámico y el final de la ruta."
    fr: "L'événement qui marque le début du calendrier hégirien et la fin du parcours."
    ur: "وہ واقعہ جہاں سے ہجری کیلنڈر شروع ہوتا ہے، اور پگڈنڈی کا اختتام۔"
    tr: "İslam takviminin başlangıç ve bitiş noktası olan olay."
    id: "Peristiwa yang menjadi awal kalender Islam, dan akhir dari perjalanan tersebut."
