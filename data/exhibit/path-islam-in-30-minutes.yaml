    ur: "رمضان کے روزے رکھنا"
    tr: "Ramazan orucu"
    id: "puasa Ramadhan"
  body:
    ar: 'الركن الرابع: الشهر الذي أُنزل فيه القرآن، ومن تُرخَّص له الفطر.'
    en: "The fourth pillar: the month in which the Qur'an was sent down, and who is granted leave to break the fast."
    es: "El cuarto pilar: el mes en que fue revelado el Corán, y a quien se le concede permiso para romper el ayuno."
    fr: "Le quatrième pilier: le mois durant lequel le Coran a été révélé, et celui où il est permis de rompre le jeûne."
    ur: "چوتھا ستون: وہ مہینہ جس میں قرآن نازل ہوا اور جس میں روزہ افطار کرنے کی اجازت دی گئی ہے۔"
    tr: "Dördüncü şart: Kur'an'ın indirildiği ay ve orucu bozmaya izin verilen ay."
    id: "Rukun Islam keempat: bulan di mana Al-Quran diturunkan, dan siapa yang diperbolehkan berbuka puasa."
  features:
  - practice/sawm-ramadan
