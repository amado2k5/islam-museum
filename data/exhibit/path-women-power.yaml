  tr: "Hüküm süren ve kurum kuranların izinden giden bir yol: Sultan olarak Şacer el-Durr, lider olarak Fatıma el-Fihri, alim olarak Ayşe ve Zeyneb — tarihteki kadınların gücü."
  id: "Menelusuri jejak para penguasa dan tokoh yang berkiprah: Shajar al-Durr sebagai seorang sultana, Fatima al-Fihri sebagai seorang pemimpin, Aisha sebagai seorang cendekiawan, dan Zainab — kekuatan perempuan dalam sejarah."
