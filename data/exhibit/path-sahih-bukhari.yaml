  ar: 'مسار في أصح الكتب: البخاري يجمع سبع سنين، والمصحف يُجمع بعد اليمامة، والأحرف السبعة، وإمامة أبي
    بكر — نصوص مؤسسة.'
  en: A trail through the most authentic book.
  es: "Un recorrido por el libro más auténtico."
  fr: "Un parcours à travers le livre le plus authentique."
  ur: "سب سے مستند کتاب کے ذریعے ایک ٹریل."
  tr: "En güvenilir kitaplarda izlenecek yol: Yedi yılda derlenen Buhari, ondan sonra derlenen Kur'an, Yedi Mektup ve Ebu Bekir'in İmamlığı - temel metinler."
  id: "Sebuah jalan yang terdapat dalam kitab-kitab paling otentik: Al-Bukhari menyusunnya selama tujuh tahun, Al-Quran disusun setelah Al-Yamamah, tujuh huruf, dan Imamah Abu Bakar — teks-teks fundamental."
