id: exhibit/pathway-g11-hrt3m-quran-as-a-text
class: exhibit
kind: lesson
label:
  ar: "القرآن نصًّا: من الوحي إلى المصحف إلى الحفظ"
  en: "The Qur'an as a text: from revelation to the mushaf to memorisation"
  ur: "قرآن ایک متن کے طور پر: وحی سے مصحف اور حفظ تک"
summary:
  ar: "مسار لمقرر HRT3M عن القرآن بوصفه نصًّا مقدّسًا: كيف نزل، وكيف جُمع في مصحف واحد في عهد عثمان، وكيف يُحفظ ويُتلى بالتجويد، وكيف يُشرح في التفسير، وما علاقة الإسناد بنقل النصوص."
  en: "An HRT3M pathway on the Qur'an as a sacred text: how it was revealed, how it was gathered into one mushaf under Uthman, how it is memorised and recited with tajwid, how it is explained in commentary, and what the isnad has to do with transmitting texts."
  ur: "HRT3M کا ایک راستہ قرآن پر ایک مقدس متن کے طور پر: یہ کیسے نازل ہوا، عثمان کے عہد میں ایک مصحف میں کیسے جمع ہوا، اسے کیسے حفظ کیا اور تجوید سے پڑھا جاتا ہے، تفسیر میں اس کی وضاحت کیسے ہوتی ہے، اور متون کی نقل میں اسناد کا کیا کردار ہے۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: "أن يحلّل الطالب دور كتاب مقدّس في دين من الأديان: نشأته، ونقله، وطرق قراءته في العبادة والعلم."
  en: "Students analyse the role of a sacred book in a religion: its origin, its transmission, and the ways it is read in worship and in scholarship."
  ur: "طلبہ ایک مذہب میں ایک مقدس کتاب کے کردار کا تجزیہ کریں: اس کا آغاز، اس کی نقل، اور عبادت اور علم میں اسے پڑھنے کے طریقے۔"
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: HRT3M
  course_title:
    ar: "أديان العالم وتقاليد الاعتقاد: منظورات وقضايا وتحدّيات، الصف 11، إعداد جامعي/كلّي"
    en: "World Religions and Belief Traditions: Perspectives, Issues, and Challenges, Grade 11, University/College Preparation"
    ur: "دنیا کے مذاہب اور عقائد کی روایات: نقطۂ نظر، مسائل اور چیلنج، جماعت 11، یونیورسٹی/کالج تیاری"
  grade: "11"
  strand: D
  strand_title:
    ar: العقائد والممارسات والتعاليم
    en: Tenets, Practices, and Teachings
    ur: عقائد، اعمال اور تعلیمات
  expectations:
    - D2
  expectation:
    ar: "يدرس الدرس دور الكتاب المقدّس في الإسلام: كيف يفهم المسلمون نزول القرآن، وكيف جُمع ونُقل تاريخيًا، وكيف يُستعمل في الصلاة والحفظ والتلاوة وفي التفسير. نصّ القرآن نفسه يُقرأ من الصفحات المخصّصة له في المتحف ولا يُكتب في الدرس."
    en: "The lesson studies the role of the sacred book in Islam: how Muslims understand the revelation of the Qur'an, how it was gathered and transmitted historically, and how it is used in prayer, memorisation, recitation and commentary. The Qur'anic text itself is read from its own pages in the museum and is not typed into the lesson."
    ur: "یہ سبق اسلام میں مقدس کتاب کے کردار کو پڑھاتا ہے: مسلمان قرآن کے نزول کو کیسے سمجھتے ہیں، تاریخی طور پر یہ کیسے جمع اور منقول ہوا، اور نماز، حفظ، تلاوت اور تفسیر میں اسے کیسے استعمال کیا جاتا ہے۔ قرآن کا متن میوزیم میں اس کے اپنے صفحات سے پڑھا جاتا ہے اور سبق میں لکھا نہیں جاتا۔"
  document: "The Ontario Curriculum, Grades 9 to 12: Social Sciences and Humanities, 2013"
  verified: 2026-10-23
rooms:
  - title:
      ar: "القرآن: المدخل"
      en: "The Qur'an: the record"
      ur: "قرآن: اندراج"
    body:
      ar: ما الكتاب، وكم سورة وآية فيه، وكيف يصفه المسلمون.
      en: What the book is, how many suras and verses it has, and how Muslims describe it.
      ur: کتاب کیا ہے، اس میں کتنی سورتیں اور آیتیں ہیں، اور مسلمان اسے کیسے بیان کرتے ہیں۔
    features:
      - work/quran
  - title:
      ar: أول ما نزل
      en: The first to be revealed
      ur: پہلی نازل ہونے والی
    body:
      ar: حدث الوحي الأول، والآيات الخمس الأولى من سورة العلق على صفحتها.
      en: The event of the first revelation, and the first five verses of sura 96 on their own page.
      ur: پہلی وحی کا واقعہ، اور سورۃ العلق کی پہلی پانچ آیتیں اپنے صفحے پر۔
    features:
      - event/first-revelation
      - passage/quran-96-1
  - title:
      ar: من الصدور إلى المصحف
      en: From memory to the mushaf
      ur: سینوں سے مصحف تک
    body:
      ar: الكتابة في حياة النبي، والجمع في عهد أبي بكر، والمصحف الواحد في عهد عثمان.
      en: Writing in the Prophet's lifetime, the collection under Abu Bakr, and the single mushaf under Uthman.
      ur: نبی کی زندگی میں کتابت، ابوبکر کے عہد میں جمع، اور عثمان کے عہد میں ایک مصحف۔
    features:
      - concept/mushaf
      - person/uthman-ibn-affan
  - title:
      ar: الحفظ
      en: Memorisation
      ur: حفظ
    body:
      ar: لماذا يحفظ ملايين الناس النص كاملًا، وكيف يُعلَّم.
      en: Why millions memorise the whole text, and how it is taught.
      ur: کروڑوں لوگ پورا متن کیوں حفظ کرتے ہیں، اور یہ کیسے سکھایا جاتا ہے۔
    features:
      - practice/hifz-al-quran
  - title:
      ar: التجويد
      en: Tajwid
      ur: تجوید
    body:
      ar: "قواعد التلاوة: الصوت بوصفه جزءًا من النص."
      en: "The rules of recitation: sound as part of the text."
      ur: "تلاوت کے قواعد: آواز متن کا حصہ۔"
    features:
      - practice/tajwid
  - title:
      ar: الإسناد
      en: The isnad
      ur: اسناد
    body:
      ar: "سلسلة الرواة التي يُنقل بها النص والحديث: أداة نقدٍ عمرها أربعة عشر قرنًا."
      en: "The chain of transmitters by which text and hadith are passed on: a critical tool fourteen centuries old."
      ur: "راویوں کا سلسلہ جس سے متن اور حدیث آگے بڑھتے ہیں: چودہ صدیوں پرانا تنقیدی آلہ۔"
    features:
      - concept/isnad
  - title:
      ar: الحديث والقرآن
      en: Hadith and the Qur'an
      ur: حدیث اور قرآن
    body:
      ar: "نصّان مختلفان في المنزلة والنقل: ما الفرق ولماذا يهمّ."
      en: "Two texts different in status and transmission: the difference and why it matters."
      ur: "مرتبے اور نقل میں دو مختلف متون: فرق کیا ہے اور کیوں اہم ہے۔"
    features:
      - concept/al-hadith-al-nabawi
  - title:
      ar: "التفسير: الطبري"
      en: "Commentary: al-Tabari"
      ur: "تفسیر: طبری"
    body:
      ar: "مؤرخ ومفسّر من القرن العاشر جمع أقوال من سبقه: كيف يُشرح النص."
      en: "A tenth-century historian and commentator who gathered the views of his predecessors: how the text is explained."
      ur: "دسویں صدی کا ایک مؤرخ اور مفسر جس نے اپنے پیش روؤں کے اقوال جمع کیے: متن کی وضاحت کیسے ہوتی ہے۔"
    features:
      - person/al-tabari
outcomes:
  - text:
      ar: أصف كيف يفهم المسلمون نزول القرآن وكيف جُمع تاريخيًا.
      en: I can describe how Muslims understand the Qur'an's revelation and how it was gathered historically.
      ur: میں بیان کر سکتا ہوں کہ مسلمان قرآن کے نزول کو کیسے سمجھتے ہیں اور تاریخی طور پر یہ کیسے جمع ہوا۔
    steps:
      - 0
      - 1
      - 2
  - text:
      ar: أشرح ثلاث طرق يُستعمل بها النص في حياة المسلم.
      en: I can explain three ways the text is used in a Muslim's life.
      ur: میں تین طریقے بیان کر سکتا ہوں جن سے متن ایک مسلمان کی زندگی میں استعمال ہوتا ہے۔
    steps:
      - 3
      - 4
      - 7
  - text:
      ar: أميّز القرآن من الحديث وأشرح الإسناد.
      en: I can distinguish the Qur'an from hadith and explain the isnad.
      ur: میں قرآن کو حدیث سے الگ کر سکتا ہوں اور اسناد بیان کر سکتا ہوں۔
    steps:
      - 5
      - 6
worksheet:
  - prompt:
      ar: افتح صفحة الآيات الأولى من سورة العلق في المتحف. ماذا تذكر المصادر عن لحظة نزولها؟
      en: Open the museum page of the first verses of sura 96. What do the sources say about the moment of their revelation?
      ur: میوزیم میں سورۃ العلق کی پہلی آیتوں کا صفحہ کھولیں۔ ان کے نزول کے لمحے کے بارے میں ماخذ کیا کہتے ہیں؟
    steps:
      - 1
  - prompt:
      ar: ما الخطوات الثلاث من الوحي إلى المصحف الواحد؟ من قام بكل خطوة؟
      en: What are the three steps from revelation to the single mushaf, and who carried out each?
      ur: وحی سے ایک مصحف تک تین مرحلے کیا ہیں، اور ہر ایک کس نے انجام دیا؟
    steps:
      - 2
  - prompt:
      ar: لماذا يُعدّ الصوت جزءًا من النص في التجويد؟
      en: Why is sound treated as part of the text in tajwid?
      ur: تجوید میں آواز کو متن کا حصہ کیوں مانا جاتا ہے؟
    steps:
      - 4
  - prompt:
      ar: اشرح الإسناد لصديق لا يعرفه، بمثال.
      en: Explain the isnad to a friend who has never heard of it, with an example.
      ur: اسناد کو ایک مثال سے اس دوست کو سمجھائیں جس نے کبھی اس کا نام نہ سنا ہو۔
    steps:
      - 5
  - prompt:
      ar: ما الفرق بين القرآن والحديث في المنزلة والنقل؟
      en: How do the Qur'an and hadith differ in status and transmission?
      ur: قرآن اور حدیث مرتبے اور نقل میں کیسے مختلف ہیں؟
    steps:
      - 6
quiz:
  - q:
      ar: كم سورة في القرآن؟
      en: How many suras does the Qur'an have?
      ur: قرآن میں کتنی سورتیں ہیں؟
    options:
      - ar: "99"
        en: "99"
        ur: "99"
      - ar: "114"
        en: "114"
        ur: "114"
      - ar: "200"
        en: "200"
        ur: "200"
      - ar: "30"
        en: "30"
        ur: "30"
    answer: 1
    teaches: 0
  - q:
      ar: في عهد أي خليفة جُمع المصحف الواحد؟
      en: Under which caliph was the single mushaf established?
      ur: ایک مصحف کس خلیفہ کے عہد میں مقرر ہوا؟
    options:
      - ar: عمر
        en: Umar
        ur: عمر
      - ar: علي
        en: Ali
        ur: علی
      - ar: عثمان
        en: Uthman
        ur: عثمان
      - ar: معاوية
        en: Mu'awiya
        ur: معاویہ
    answer: 2
    teaches: 2
  - q:
      ar: ما التجويد؟
      en: What is tajwid?
      ur: تجوید کیا ہے؟
    options:
      - ar: ترجمة القرآن
        en: Translating the Qur'an
        ur: قرآن کا ترجمہ
      - ar: كتابة القرآن بالخط الكوفي
        en: Writing the Qur'an in Kufic
        ur: قرآن کوفی خط میں لکھنا
      - ar: شرح معاني الآيات
        en: Explaining the verses
        ur: آیتوں کی وضاحت
      - ar: قواعد تلاوة القرآن
        en: The rules of reciting the Qur'an
        ur: قرآن کی تلاوت کے قواعد
    answer: 3
    teaches: 4
  - q:
      ar: ما وظيفة الإسناد في نقل النصوص؟
      en: What is the isnad's function in transmitting texts?
      ur: متون کی نقل میں اسناد کا کیا کام ہے؟
    options:
      - ar: تحديد من نقل النص ليُفحص صدقه
        en: To name who transmitted the text so its reliability can be checked
        ur: بتانا کہ متن کس نے نقل کیا تا کہ اس کی صداقت جانچی جا سکے
      - ar: ترتيب السور
        en: To order the suras
        ur: سورتوں کی ترتیب
      - ar: تلوين المخطوطات
        en: To colour manuscripts
        ur: مخطوطات کی رنگ آمیزی
      - ar: تحديد أوقات الصلاة
        en: To fix the prayer times
        ur: نماز کے اوقات مقرر کرنا
    answer: 0
    teaches: 5
  - q:
      ar: ما الفرق بين القرآن والحديث عند المسلمين؟
      en: How do Muslims distinguish the Qur'an from hadith?
      ur: مسلمان قرآن اور حدیث میں کیا فرق کرتے ہیں؟
    options:
      - ar: لا فرق
        en: No difference
        ur: کوئی فرق نہیں
      - ar: القرآن كلام الله والحديث أقوال النبي وأفعاله
        en: The Qur'an is God's word; hadith are the Prophet's words and deeds
        ur: قرآن اللہ کا کلام ہے؛ حدیث نبی کے اقوال اور افعال
      - ar: الحديث أقدم من القرآن
        en: Hadith is older than the Qur'an
        ur: حدیث قرآن سے پرانی ہے
      - ar: القرآن بالفارسية والحديث بالعربية
        en: The Qur'an is in Persian, hadith in Arabic
        ur: قرآن فارسی میں، حدیث عربی میں
    answer: 1
    teaches: 6
