summary:
  ar: 'مسار في عشرة أعيان من مقتنيات المتحف: محراب سالتنج، وكسوة الكعبة، ومنبر الكتبية، وسجادة أردبيل،
    والأسطرلابات والمصاحف.'
  en: 'A trail through ten museum treasures: the Salting Mihrab, the Kiswa, the Kutubiyya minbar, the
    Ardabil carpet, astrolabes and Qur''an folios.'
  es: "Un recorrido por los tesoros de diez museos: el Mihrab de Salting, la Kiswa, el minbar de Kutubiyya, la alfombra de Ardabil, astrolabios y folios del Corán."
  fr: "Un parcours à travers dix trésors de musées: le mihrab de Salting, la kiswa, le minbar de Kutubiyya, le tapis d'Ardabil, des astrolabes et des feuillets du Coran."
  ur: "دس عجائب گھروں کے خزانوں کے ذریعے ایک پگڈنڈی: سالٹنگ محراب، کسوا، قطبیہ منبر، اردبیل قالین، آسٹرو لیبز اور قرآن کے فولیو۔"
  tr: "Müzenin koleksiyonundaki on önemli eserin yer aldığı bir rota: Tuzlama Mihrab'ı, Kâbe örtüsü, Kutubiyye minberi, Ardabil halısı, usturlaplar ve Kur'anlar."
  id: "Sebuah rute melalui sepuluh artefak penting dari koleksi museum: Mihrab Salting, kain penutup Ka'bah, mimbar Kutubiyya, karpet Ardabil, astrolab, dan Al-Qur'an."
