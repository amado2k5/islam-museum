id: exhibit/pathway-g11-chw3m-baghdad-and-the-silk-roads
class: exhibit
kind: lesson
label:
  ar: بغداد العباسية وطرق الحرير
  en: Abbasid Baghdad and the Silk Roads
  ur: عباسی بغداد اور شاہراہِ ریشم
summary:
  ar: "مسار لمقرر CHW3M عن بغداد في قرنها الذهبي وشبكة الطرق التي ربطتها بسمرقند وبخارى والصين: المدينة، وبيت الحكمة وحركة الترجمة، والخوارزمي وابن سينا، والتجارة التي حملت الورق والعلم والناس."
  en: "A CHW3M pathway on Baghdad in its golden century and the network of routes that linked it to Samarqand, Bukhara and China: the city, the House of Wisdom and the translation movement, al-Khwarizmi and Ibn Sina, and the trade that carried paper, learning and people."
  ur: "CHW3M کا ایک راستہ بغداد کی سنہری صدی اور ان راستوں کے جال پر جو اسے سمرقند، بخارا اور چین سے جوڑتے تھے: شہر، بیت الحکمہ اور ترجمے کی تحریک، خوارزمی اور ابن سینا، اور وہ تجارت جو کاغذ، علم اور لوگوں کو لے کر چلی۔"
audience:
  - teacher
  - student
level: standard
duration_minutes: 75
wings: []
goal:
  ar: أن يحلّل الطالب كيف أسهمت مدينة واحدة وشبكة تجارية في ازدهار حضارة، وأن يقيّم تراث التفاعل بين المجتمعات على طرق الحرير قبل 1500.
  en: Students analyse how one city and one trade network contributed to a flourishing civilisation, and assess the legacy of interaction between societies along the Silk Roads before 1500.
  ur: طلبہ تجزیہ کریں کہ ایک شہر اور ایک تجارتی جال نے ایک تہذیب کے عروج میں کیا حصہ ڈالا، اور 1500 سے پہلے شاہراہِ ریشم پر معاشروں کے باہمی تعامل کی میراث کا جائزہ لیں۔
path_kind: starter
curriculum:
  jurisdiction: on-ca
  course: CHW3M
  course_title:
    ar: تاريخ العالم حتى نهاية القرن الخامس عشر، الصف 11، إعداد جامعي/كلّي
    en: World History to the End of the Fifteenth Century, Grade 11, University/College Preparation
    ur: پندرہویں صدی کے اختتام تک دنیا کی تاریخ، جماعت 11، یونیورسٹی/کالج تیاری
  grade: "11"
  strand: E
  strand_title:
    ar: تراث الحضارات
    en: The Legacy of Civilizations
    ur: تہذیبوں کی میراث
  expectations:
    - E1
    - E2
  expectation:
    ar: "يتناول الدرس التراث الثقافي والعلمي للحضارة العباسية (الترجمة، الجبر، الطب) وأنواع التفاعل بين المجتمعات على طرق الحرير: التجارة، وانتقال الورق والكتب، والرحلة، وما أفاد منه كلّ طرف وما تضرّر به. منهج أونتاريو للصفين 7 و8 (2023) لا يحوي محورًا عن التجارة الوسيطة، فوضع المتحف طرق الحرير هنا."
    en: "The lesson treats the cultural and scientific legacy of the Abbasid civilisation (translation, algebra, medicine) and the kinds of interaction between societies along the Silk Roads: trade, the movement of paper and books, travel, and what each side gained and lost. The Ontario Grades 7 and 8 curriculum (2023) has no strand on medieval trade, so the museum places the Silk Roads here."
    ur: "یہ سبق عباسی تہذیب کی ثقافتی اور علمی میراث (ترجمہ، الجبرا، طب) اور شاہراہِ ریشم پر معاشروں کے باہمی تعامل کی اقسام پر ہے: تجارت، کاغذ اور کتابوں کی نقل و حرکت، سفر، اور ہر فریق نے کیا پایا اور کیا کھویا۔ اونٹاریو کے جماعت 7 اور 8 کے نصاب (2023) میں وسطی زمانے کی تجارت پر کوئی شاخ نہیں، اس لیے میوزیم نے شاہراہِ ریشم کو یہاں رکھا ہے۔"
  document: "The Ontario Curriculum, Grades 11 and 12: Canadian and World Studies, 2015"
  verified: 2026-10-23
rooms:
  - title:
      ar: الدولة العباسية
      en: The Abbasid state
      ur: عباسی ریاست
    body:
      ar: انتقال الخلافة من دمشق إلى العراق سنة 750، وما تغيّر معها.
      en: The caliphate passes from Damascus to Iraq in 750, and what changed with it.
      ur: 750 میں خلافت دمشق سے عراق منتقل ہوتی ہے، اور اس کے ساتھ کیا بدلا۔
    features:
      - polity/abbasid-caliphate
  - title:
      ar: تأسيس بغداد
      en: The founding of Baghdad
      ur: بغداد کی بنیاد
    body:
      ar: "مدينة مدوّرة على دجلة: من خطّطها ولماذا هنا."
      en: "A round city on the Tigris: who planned it and why here."
      ur: "دجلہ پر ایک گول شہر: کس نے اس کا نقشہ بنایا اور یہاں کیوں۔"
    features:
      - event/founding-of-baghdad
  - title:
      ar: الرشيد والمأمون
      en: Harun al-Rashid and al-Ma'mun
      ur: ہارون رشید اور مامون
    body:
      ar: "خليفتان في ذروة المدينة: البلاط، والمال، والعلم بوصفه سياسة."
      en: "Two caliphs at the city's height: court, money, and learning as policy."
      ur: "شہر کے عروج پر دو خلیفے: دربار، دولت، اور علم بطور پالیسی۔"
    features:
      - person/harun-al-rashid
      - person/abd-allah-al-mamun
  - title:
      ar: بيت الحكمة وحركة الترجمة
      en: The House of Wisdom and the translation movement
      ur: بیت الحکمہ اور ترجمے کی تحریک
    body:
      ar: "من اليونانية والفارسية والسريانية إلى العربية: من ترجم، وماذا، ولمن."
      en: "From Greek, Persian and Syriac into Arabic: who translated, what, and for whom."
      ur: "یونانی، فارسی اور سریانی سے عربی میں: کس نے ترجمہ کیا، کیا، اور کس کے لیے۔"
    features:
      - building/bayt-al-hikma
      - concept/harakat-al-tarjama
  - title:
      ar: الخوارزمي والجبر
      en: Al-Khwarizmi and algebra
      ur: خوارزمی اور الجبرا
    body:
      ar: كتاب في حلّ المعادلات أعطى علمًا اسمه، والأرقام الهندية تدخل العالم العربي.
      en: A book on solving equations gave a science its name, and Indian numerals enter the Arabic world.
      ur: مساواتیں حل کرنے کی ایک کتاب نے ایک علم کو اس کا نام دیا، اور ہندی ہندسے عربی دنیا میں آئے۔
    features:
      - person/al-khwarizmi
  - title:
      ar: ابن سينا والطب
      en: Ibn Sina and medicine
      ur: ابن سینا اور طب
    body:
      ar: طبيب من بخارى كتب كتابًا دُرّس في أوروبا قرونًا.
      en: A physician from Bukhara wrote a book taught in Europe for centuries.
      ur: بخارا کا ایک طبیب جس کی کتاب صدیوں یورپ میں پڑھائی گئی۔
    features:
      - person/ibn-sina
  - title:
      ar: سمرقند وبخارى
      en: Samarqand and Bukhara
      ur: سمرقند اور بخارا
    body:
      ar: "مدينتا الطريق في آسيا الوسطى: الورق والحرير والمدارس."
      en: "The two cities of the road in Central Asia: paper, silk and schools."
      ur: "وسطی ایشیا میں راستے کے دو شہر: کاغذ، ریشم اور مدرسے۔"
    features:
      - place/samarqand
      - place/bukhara
  - title:
      ar: رحّالة على الطريق
      en: A traveller on the road
      ur: راستے پر ایک سیاح
    body:
      ar: "ابن بطوطة من المغرب إلى الصين: ما يروي عن المدن والتجار."
      en: "Ibn Battuta from Morocco to China: what he relates about cities and merchants."
      ur: "ابن بطوطہ مراکش سے چین تک: وہ شہروں اور تاجروں کے بارے میں کیا بیان کرتا ہے۔"
    features:
      - person/ibn-battuta-muhammad
  - title:
      ar: التجارة بوصفها تفاعلًا
      en: Trade as interaction
      ur: تجارت بطور تعامل
    body:
      ar: "ما حملته القوافل غير البضائع: الأفكار واللغات والأمراض والأديان."
      en: "What the caravans carried besides goods: ideas, languages, diseases and religions."
      ur: "قافلے سامان کے سوا کیا لے کر چلے: خیالات، زبانیں، بیماریاں اور مذاہب۔"
    features:
      - concept/trade-in-islam
outcomes:
  - text:
      ar: أشرح دور بغداد وبيت الحكمة في حفظ العلوم القديمة ونقلها.
      en: I can explain the role of Baghdad and the House of Wisdom in preserving and passing on ancient learning.
      ur: میں قدیم علوم کو محفوظ رکھنے اور آگے پہنچانے میں بغداد اور بیت الحکمہ کا کردار بیان کر سکتا ہوں۔
    steps:
      - 1
      - 3
  - text:
      ar: أذكر إنجازين علميين وأبيّن أثرهما خارج العالم الإسلامي.
      en: I can name two scientific achievements and show their effect beyond the Muslim world.
      ur: میں دو علمی کارنامے بتا سکتا ہوں اور مسلم دنیا سے باہر ان کا اثر دکھا سکتا ہوں۔
    steps:
      - 4
      - 5
  - text:
      ar: أقيّم فوائد التفاعل على طرق الحرير وأضراره لأكثر من طرف.
      en: I can weigh the benefits and harms of interaction along the Silk Roads for more than one side.
      ur: میں شاہراہِ ریشم پر تعامل کے فائدے اور نقصان ایک سے زیادہ فریقوں کے لیے جانچ سکتا ہوں۔
    steps:
      - 6
      - 7
      - 8
worksheet:
  - prompt:
      ar: لماذا اختار المنصور موقع بغداد؟ اذكر سببين جغرافيين أو اقتصاديين.
      en: Why did al-Mansur choose the site of Baghdad? Give two geographical or economic reasons.
      ur: منصور نے بغداد کی جگہ کیوں چنی؟ دو جغرافیائی یا معاشی وجوہ لکھیں۔
    steps:
      - 1
  - prompt:
      ar: من اللغات التي تُرجم منها في بيت الحكمة؟ ولماذا كان الخلفاء يموّلون الترجمة؟
      en: From which languages was translation done at the House of Wisdom, and why did caliphs fund it?
      ur: بیت الحکمہ میں کن زبانوں سے ترجمہ ہوتا تھا، اور خلیفے ترجمے پر خرچ کیوں کرتے تھے؟
    steps:
      - 3
  - prompt:
      ar: ما العلاقة بين اسم الخوارزمي وكلمة «الخوارزمية» اليوم؟
      en: What links al-Khwarizmi's name to the word 'algorithm' today?
      ur: خوارزمی کے نام اور آج کے لفظ «الگورتھم» میں کیا تعلق ہے؟
    steps:
      - 4
  - prompt:
      ar: "تتبّع رحلة ورقة واحدة من سمرقند إلى بغداد: من صنعها ومن حملها ومن كتب عليها."
      en: "Trace one sheet of paper from Samarqand to Baghdad: who made it, who carried it, who wrote on it."
      ur: "کاغذ کے ایک ورق کا سمرقند سے بغداد تک پیچھا کریں: کس نے بنایا، کس نے اٹھایا، کس نے اس پر لکھا۔"
    steps:
      - 6
      - 8
  - prompt:
      ar: اذكر فائدة وضررًا من التفاعل على طرق الحرير لمجتمعين مختلفين.
      en: Name one benefit and one harm of Silk Road interaction for two different societies.
      ur: دو مختلف معاشروں کے لیے شاہراہِ ریشم کے تعامل کا ایک فائدہ اور ایک نقصان لکھیں۔
    steps:
      - 8
quiz:
  - q:
      ar: في أي سنة انتقلت الخلافة إلى العباسيين؟
      en: In which year did the caliphate pass to the Abbasids?
      ur: خلافت کس سال عباسیوں کو ملی؟
    options:
      - ar: "622"
        en: "622"
        ur: "622"
      - ar: "711"
        en: "711"
        ur: "711"
      - ar: "750"
        en: "750"
        ur: "750"
      - ar: "1258"
        en: "1258"
        ur: "1258"
    answer: 2
    teaches: 0
  - q:
      ar: من اللغات التي تُرجم منها في بيت الحكمة؟
      en: From which languages did the House of Wisdom translate?
      ur: بیت الحکمہ کن زبانوں سے ترجمہ کرتا تھا؟
    options:
      - ar: اليونانية والفارسية والسريانية
        en: Greek, Persian and Syriac
        ur: یونانی، فارسی اور سریانی
      - ar: اللاتينية والفرنسية
        en: Latin and French
        ur: لاطینی اور فرانسیسی
      - ar: الصينية فقط
        en: Only Chinese
        ur: صرف چینی
      - ar: التركية والمغولية
        en: Turkish and Mongolian
        ur: ترکی اور منگولی
    answer: 0
    teaches: 3
  - q:
      ar: بأي علم ارتبط اسم الخوارزمي؟
      en: With which science is al-Khwarizmi's name linked?
      ur: خوارزمی کا نام کس علم سے جڑا ہے؟
    options:
      - ar: الطب
        en: Medicine
        ur: طب
      - ar: البصريات
        en: Optics
        ur: بصریات
      - ar: الموسيقى
        en: Music
        ur: موسیقی
      - ar: الجبر
        en: Algebra
        ur: الجبرا
    answer: 3
    teaches: 4
  - q:
      ar: من أي مدينة جاء ابن سينا؟
      en: From which city did Ibn Sina come?
      ur: ابن سینا کس شہر سے تھے؟
    options:
      - ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      - ar: بخارى
        en: Bukhara
        ur: بخارا
      - ar: القاهرة
        en: Cairo
        ur: قاہرہ
      - ar: دمشق
        en: Damascus
        ur: دمشق
    answer: 1
    teaches: 5
  - q:
      ar: ما الذي حملته القوافل على طرق الحرير غير البضائع؟
      en: What did the caravans carry along the Silk Roads besides goods?
      ur: شاہراہِ ریشم کے قافلے سامان کے سوا کیا لے جاتے تھے؟
    options:
      - ar: لا شيء غير البضائع
        en: Nothing but goods
        ur: سامان کے سوا کچھ نہیں
      - ar: الجيوش فقط
        en: Only armies
        ur: صرف فوجیں
      - ar: الأفكار واللغات والأمراض
        en: Ideas, languages and diseases
        ur: خیالات، زبانیں اور بیماریاں
      - ar: الذهب فقط
        en: Only gold
        ur: صرف سونا
    answer: 2
    teaches: 8
