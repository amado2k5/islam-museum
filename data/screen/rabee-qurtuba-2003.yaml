summary:
  ar: مسلسل سوري لحاتم علي عن أحداث فتنة الأندلس وسقوط الخلافة الأموية في قرطبة سنة 1009؛ من أرقى الدراما العربية عن الأندلس.
  en: Hatem Ali's Syrian series on the Andalusian fitna and the fall of the Umayyad caliphate of Cordoba in 1009 — a landmark
    Arabic drama on al-Andalus.
  es: "La serie siria de Hatem Ali sobre la fitna andalusí y la caída del califato omeya de Córdoba en 1009: un drama árabe emblemático sobre al-Ándalus."
  fr: "La série syrienne de Hatem Ali sur la fitna andalouse et la chute du califat omeyyade de Cordoue en 1009 — un drame arabe marquant sur al-Andalus."
  ur: "حاتم علی کی اندلس کے فتنے پر شامی سیریز اور 1009 میں قرطبہ کی اموی خلافت کا زوال - الاندلس پر ایک تاریخی عربی ڈرامہ۔"
  tr: "Hatem Ali'nin 1009'da Kordoba'da Endülüs Kargaşası ve Emevi Halifeliği'nin düşüşünü konu alan Suriye dizisi; Endülüs hakkında en iyi Arap dramalarından biridir."
  id: "Sebuah seri Suriah karya Hatem Ali tentang peristiwa Kekacauan Andalusia dan jatuhnya Kekhalifahan Umayyah di Cordoba pada tahun 1009; salah satu drama Arab terbaik tentang Andalusia."
