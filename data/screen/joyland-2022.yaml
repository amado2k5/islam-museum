summary:
  ar: فيلم باكستاني لصائم صادق عن أسرة في لاهور تهتزّ حين يلتحق ابنها بفرقة رقص؛ أثار منعاً مؤقتاً وجدلاً دينياً ثم رُفع المنع
    وفاز بجائزة في كان.
  en: Saim Sadiq's Cannes-winning film about a Lahore family shaken when the son joins a dance theatre — briefly banned in
    Pakistan, then released amid religious debate.
  es: "La película de Saim Sadiq, ganadora en Cannes, trata sobre una familia de Lahore que se ve conmocionada cuando el hijo se une a un grupo de danza; fue prohibida brevemente en Pakistán y luego estrenada en medio de un debate religioso."
  fr: "Le film de Saim Sadiq, primé à Cannes, raconte l'histoire d'une famille de Lahore bouleversée lorsque le fils intègre un théâtre de danse — brièvement interdit au Pakistan, puis sorti au milieu d'un débat religieux."
  ur: "لاہور کے ایک خاندان کے بارے میں صائم صادق کی کانز جیتنے والی فلم اس وقت ہل گئی جب بیٹا ڈانس تھیٹر میں شامل ہوتا ہے — پاکستان میں مختصر طور پر پابندی عائد کر دی گئی، پھر مذہبی بحث کے درمیان ریلیز ہوئی۔"
  tr: "Saim Sadiq'in, oğullarının bir dans topluluğuna katılmasıyla sarsılan Lahor'daki bir aileyi konu alan Pakistan yapımı filmi; geçici bir yasak ve dini tartışmaya yol açtı, ardından yasağı kaldırdı ve Cannes'da ödül kazandı."
  id: "Film Pakistan karya Saim Sadiq tentang sebuah keluarga di Lahore yang terguncang ketika putra mereka bergabung dengan grup tari; film ini memicu larangan sementara dan kontroversi agama, lalu larangan itu dicabut dan memenangkan penghargaan di Cannes."
