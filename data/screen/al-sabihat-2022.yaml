  tr: "İki kız kardeş, Yusra ve Sara Mardini, Ege Denizi'ni mülteci olarak geçen ve ardından Rio Olimpiyatları'nı geçen iki Suriyeli yüzücü hakkında bir film; ünlü bir mülteci draması."
  id: "Sebuah film tentang dua saudari, Yusra dan Sara Mardini, dua perenang Suriah yang menyeberangi Laut Aegea sebagai pengungsi, lalu Olimpiade Rio; sebuah drama pengungsi terkenal."
