  en: Indonesia's long-running Ramadan series about a village mosque community navigating everyday crises and repentance.
  es: "Serie indonesia de larga duración ambientada en el Ramadán, que narra la historia de una comunidad rural que vive bajo una mezquita y que afronta crisis cotidianas y se arrepiente de sus actos."
  fr: "Une série indonésienne diffusée pendant le Ramadan et qui raconte l'histoire d'une communauté de mosquée villageoise confrontée aux crises quotidiennes et au repentir."
  ur: "انڈونیشیا کی ایک طویل عرصے سے جاری رمضان سیریز جس میں ایک گاؤں کی مسجد کمیونٹی روزمرہ کے بحرانوں اور توبہ کے لیے تشریف لے جاتی ہے۔"
  tr: "Endonezya kökenli Ramazan dizisi, krizler ve tövbe içinde bir Müslüman köy grubunu ve günlük yaşamlarını konu alır; Endonezya'nın en uzun soluklu dini dramalarından biridir."
  id: "Sebuah serial panjang Ramadan Indonesia tentang kelompok desa Muslim dan kehidupan sehari-hari mereka di tengah krisis dan penyesalan; ini adalah salah satu drama keagamaan Indonesia yang paling lama tayang."
