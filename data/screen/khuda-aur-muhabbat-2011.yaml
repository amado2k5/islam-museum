  en: A Pakistani series about a young man whose love for a religious girl transforms his life; revived with later seasons
    that broke Pakistani viewership records.
  es: "Una serie pakistaní sobre un joven cuyo amor por una chica religiosa transforma su vida; fue revivida con temporadas posteriores que batieron récords de audiencia en Pakistán."
  fr: "Une série pakistanaise racontant l'histoire d'un jeune homme dont l'amour pour une jeune fille religieuse transforme sa vie; relancée avec des saisons ultérieures qui ont battu des records d'audience au Pakistan."
  ur: "ایک نوجوان کے بارے میں ایک پاکستانی سیریز جس کی ایک مذہبی لڑکی سے محبت اس کی زندگی بدل دیتی ہے۔ بعد کے سیزن کے ساتھ دوبارہ زندہ ہوا جس نے پاکستانی ناظرین کے ریکارڈ توڑ دیے۔"
  tr: "Dini bir kıza aşık olan ve hayatını yeniden yaşayan genç bir adamı konu alan Pakistan dizisidir; inanç temalı en ünlü Pakistan dramalarından biridir ve iki yeni sezonda yeniden üretilmiştir."
  id: "Sebuah serial Pakistan tentang seorang pemuda yang jatuh cinta pada seorang gadis religius dan mengenang kembali hidupnya; ini adalah salah satu drama Pakistan paling terkenal dengan tema berbasis iman, dan telah direproduksi dalam dua musim baru."
