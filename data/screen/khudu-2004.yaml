summary:
  ar: فيلم قصير هولندي لتيو فان غوغ وآيان حرسي علي يعنقد وضع المرأة في الإسلام بمشاهد صادمة؛ أدى إلى اغتيال فان غوغ بعد أشهر.
  en: Theo van Gogh and Ayaan Hirsi Ali's short film criticising the treatment of women under Islam; van Gogh was assassinated
    months after its broadcast.
  es: "Cortometraje de Theo van Gogh y Ayaan Hirsi Ali que critica el trato que reciben las mujeres en el Islam; van Gogh fue asesinado meses después de su emisión."
  fr: "Le court métrage de Theo van Gogh et Ayaan Hirsi Ali critiquant le traitement des femmes sous l'islam; van Gogh a été assassiné quelques mois après sa diffusion."
  ur: "تھیو وین گوگ اور آیان ہرسی علی کی مختصر فلم جس میں اسلام کے تحت خواتین کے ساتھ سلوک پر تنقید؛ وین گو کو اس کے نشر ہونے کے چند ماہ بعد قتل کر دیا گیا تھا۔"
  tr: "Theo van Gogh ve Ian Harsi Ali'nin Hollanda yapımı kısa filmi, İslam'da kadınların durumunu şok edici sahnelerle inceliyor; bu olay aylar sonra Van Gogh'un suikastına yol açtı."
  id: "Film pendek Belanda karya Theo van Gogh dan Ian Harsi Ali mengkaji status perempuan dalam Islam dengan adegan-adegan mengejutkan; film ini berujung pada pembunuhan Van Gogh beberapa bulan kemudian."
