summary:
  ar: مسلسل إيراني لداوود مير باقري عن المختار بن أبي عبيد الثقفي وثورته في الكوفة للثأر لقتلى كربلاء؛ يصوّر أئمة أهل البيت
    بالوجوه وفق التقليد الشيعي.
  en: Davoud Mirbagheri's Iranian series on al-Mukhtar ibn Abi Ubayd's uprising in Kufa to avenge Karbala; members of the
    Prophet's family are depicted on screen per Shia convention.
  es: "La serie iraní de Davoud Mirbagheri narra el levantamiento de al-Mukhtar ibn Abi Ubayd en Kufa para vengar Karbala; según la tradición chiíta, los miembros de la familia del Profeta aparecen representados en pantalla."
  fr: "La série iranienne de Davoud Mirbagheri sur le soulèvement d'al-Mukhtar ibn Abi Ubayd à Kufa pour venger Karbala; les membres de la famille du Prophète sont représentés à l'écran selon la convention chiite."
  ur: "کربلا کا بدلہ لینے کے لیے کوفہ میں المختار ابن ابی عبید کی بغاوت پر داؤد میرباغری کی ایرانی سیریز؛ شیعہ کنونشن کے مطابق پیغمبر کے خاندان کے افراد کو اسکرین پر دکھایا گیا ہے۔"
  tr: "Davud Mir Bagheri'nin İran dizisi, El-Muhtar bin Ebi Ubeyd el-Tekafi ve Kerbela şehitlerinin intikamını almak için Kufe'de devrimi hakkında; Ehl-Beyt imamlarının yüzlerini Şii geleneğine göre tasvir eder."
  id: "Sebuah serial Iran karya Dawood Mir Bagheri tentang Al-Mukhtar ibn Abi Ubaid Al-Thaqafi dan revolusinya di Kufa untuk membalas para syuhada Karbala; menggambarkan para Imam Ahl al-Bayt dengan wajah mereka sesuai tradisi Syiah."
