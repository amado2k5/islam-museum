summary:
  ar: مسلسل عربي كبير إنتاج مشترك عن أحداث الفتنة الكبرى من خلافة الحسن إلى صلحه ووقائع معاوية وكربلاء؛ أثار جدلاً حول تصوير
    أهل البيت والصحابة.
  en: A major Arabic co-production dramatising the first fitna — from Hasan's caliphate and abdication to Muawiya's rule and
    Karbala; contested for depicting the Prophet's household.
  es: "Una importante coproducción árabe que dramatiza la primera fitna —desde el califato y la abdicación de Hasan hasta el gobierno de Muawiya y Karbala—; controvertida por representar a la familia del Profeta."
  fr: "Une importante coproduction arabe dramatisant la première fitna — du califat et de l'abdication de Hasan au règne de Muawiya et à Karbala; contestée pour sa représentation de la famille du Prophète."
  ur: "ایک بڑی عربی مشترکہ پروڈکشن جس میں پہلے فتنے کو ڈرامہ بنایا گیا ہے — حسن کی خلافت اور معاویہ کی حکومت سے دستبرداری اور کربلا تک؛ نبی کے گھرانے کی تصویر کشی کے لیے مقابلہ کیا۔"
  tr: "El-Hasan halifeliğinden uzlaşmasına ve Muaviye ile Kerbela olaylarına kadar büyük fitnenin olaylarını ortak yapımcılıkla paylaşan büyük bir Arap dizisi; Ehl-Beyt ve Sahabelerin tasviri konusunda tartışmalara yol açtı."
  id: "Sebuah serial Arab besar diproduksi bersama tentang peristiwa fitna besar dari kekhalifahan Al-Hasan hingga rekonsiliasinya dan peristiwa Muawiya dan Karbala; serial ini memicu kontroversi terkait penggambaran Ahl al-Bayt dan para Sahabat."
