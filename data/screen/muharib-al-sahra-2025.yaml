summary:
  ar: فيلم مغامرات بإنتاج سعودي-أمريكي لروبرت وايات، يدور في الجزيرة العربية في القرن السابع عشية ظهور الإسلام، بطولة أنتوني
    ماكي وعائشة هارت؛ من أوائل الإنتاجات الهوليوودية الكبرى المصوّرة في نيوم.
  en: Rupert Wyatt's Saudi-backed epic set in seventh-century Arabia on the eve of Islam, starring Anthony Mackie and Aiysha
    Hart — among the first major Hollywood-scale productions shot at NEOM.
  es: "La épica película de Rupert Wyatt, con financiación saudí, ambientada en la Arabia del siglo VII en vísperas del Islam, protagonizada por Anthony Mackie y Aiysha Hart, fue una de las primeras grandes producciones a escala de Hollywood rodadas en NEOM."
  fr: "Le film épique de Rupert Wyatt, produit par l'Arabie saoudite et se déroulant dans l'Arabie du VIIe siècle à la veille de l'islam, avec Anthony Mackie et Aiysha Hart dans les rôles principaux, est l'une des premières grandes productions hollywoodiennes tournées à NEOM."
  ur: "روپرٹ وائٹ کی سعودی حمایت یافتہ مہاکاوی ساتویں صدی کے عرب میں اسلام کے موقع پر ترتیب دی گئی تھی، جس میں اینتھونی میکی اور عائشہ ہارٹ نے اداکاری کی تھی - NEOM میں شوٹ کی جانے والی پہلی ہالی ووڈ پیمانے کی پروڈکشنز میں۔"
  tr: "Robert Wyatt'ın Suudi-Amerikan filmi tarafından üretilen, yedinci yüzyılda İslam'ın gelişinin arifesinde Arap Yarımadası'nda geçen, Anthony Mackie ve Aisha Hart'ın başrollerini paylaştığı bir macera filmi; NEOM'da çekilen en erken büyük Hollywood yapımlarından biri."
  id: "Film petualangan yang diproduksi oleh film Saudi-Amerika karya Robert Wyatt, berlatar di Semenanjung Arab pada abad ketujuh menjelang datangnya Islam, dibintangi Anthony Mackie dan Aisha Hart; salah satu produksi Hollywood besar paling awal yang difilmkan di NEOM."
