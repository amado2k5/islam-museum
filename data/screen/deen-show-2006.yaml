  en: Eddie's long-running English-language YouTube interview programme on Islam — scholars, celebrities and converts — among
    the oldest and widest-reaching da'wah channels.
  es: "El programa de entrevistas en inglés de Eddie en YouTube, que lleva muchos años emitiéndose, trata sobre el Islam (con académicos, celebridades y conversos), y es uno de los canales de da'wah más antiguos y de mayor alcance."
  fr: "L'émission d'interviews en anglais d'Eddie sur YouTube, diffusée depuis longtemps et consacrée à l'islam — avec des érudits, des célébrités et des convertis — figure parmi les chaînes de da'wah les plus anciennes et les plus influentes."
  ur: "اسلام پر ایڈی کا طویل عرصے سے جاری انگریزی زبان کا یوٹیوب انٹرویو پروگرام - اسکالرز، مشہور شخصیات اور مذہب تبدیل کرنے والے - سب سے قدیم اور سب سے زیادہ پہنچنے والے دعوہ چینلز میں۔"
  tr: "2006'dan beri Eddie (Edward Radzinski) tarafından sunulan Amerikan röportaj programı olan bu program, Müslüman alimleri, ünlüleri ve İslam takipçilerini ağırlamaktadır; en eski ve en yaygın İngilizce Da'wah kanallarından biridir."
  id: "Program wawancara Amerika di YouTube yang dipandu oleh Eddie (Edward Radzinski) sejak 2006, menampilkan ulama Muslim, selebriti, dan pengikut Islam; salah satu saluran Da'wah bahasa Inggris tertua dan paling banyak tersebar."
