  ar: "فيلم ماجد مجيدي عن عامل بناء إيراني يكتشف أن زميله فتاة أفغانية متنكرة؛ من أعماله عن اللاجئين الأفغان."
  en: "Majid Majidi's film about an Iranian construction worker who discovers his co-worker is an Afghan girl in disguise; one of his Afghan-refugee works."
  es: "Película de Majid Majidi sobre un obrero de la construcción iraní que descubre que su compañera de trabajo es una chica afgana disfrazada; una de sus obras sobre refugiados afganos."
  fr: "Le film de Majid Majidi raconte l'histoire d'un ouvrier du bâtiment iranien qui découvre que sa collègue est une jeune Afghane déguisée; une de ses œuvres sur les réfugiés afghans."
  ur: "ایک ایرانی تعمیراتی کارکن کے بارے میں ماجد مجیدی کی فلم جس کو پتہ چلتا ہے کہ اس کے ساتھی کارکن بھیس میں ایک افغان لڑکی ہے۔ ان کا ایک افغان مہاجر کام۔"
  tr: "Majid Majidi'nin filmi, meslektaşının kılık değiştirmiş bir Afgan kız olduğunu keşfeden İranlı bir inşaat işçisini konu alıyor; eserlerinden biri Afgan mülteciler hakkında."
  id: "Film Majid Majidi tentang seorang pekerja konstruksi Iran yang menemukan bahwa rekannya adalah seorang gadis Afghanistan yang menyamar; salah satu karyanya adalah tentang pengungsi Afghanistan."
