  ur: "الازہر میں ایک متقی انڈونیشی طالب علم اور اس کی محبتوں کے بارے میں حبیب الرحمن الشیرازی کے ناول پر مبنی انڈونیشیائی رجحان - اس نے انڈونیشی سنیما کو مذہبی رومانس کی طرف دوبارہ بنایا۔"
