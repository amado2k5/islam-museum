summary:
  ar: فيلم عبد الرحمن سيساكو عن حياة تمبكتو تحت حكم جماعة أنصار الدين الجهادية سنة 2012؛ ترشح لأوسكار أفضل فيلم أجنبي وأدان
    التطرف العنيف من داخل الحياة المسلمة.
  en: Abderrahmane Sissako's Oscar-nominated film on Timbuktu under Ansar Dine's jihadist rule in 2012 — an indictment of
    violent extremism made from inside Muslim life.
  es: "La película de Abderrahmane Sissako, nominada al Oscar, sobre Tombuctú bajo el dominio yihadista de Ansar Dine en 2012, es una denuncia del extremismo violento surgida desde dentro de la vida musulmana."
  fr: "Le film d'Abderrahmane Sissako, nominé aux Oscars en 2012, sur Tombouctou sous le régime djihadiste d'Ansar Dine — une dénonciation de l'extrémisme violent au sein même de la vie musulmane."
  ur: "2012 میں انصار دین کی جہادی حکمرانی کے تحت ٹمبکٹو پر عبدالرحمٰن سیساکو کی آسکر نامزد فلم - مسلمانوں کی زندگی کے اندر سے پرتشدد انتہا پسندی کا الزام۔"
  tr: "Abdelrahman Sissako'nun 2012'de Timbuktu'da Ansar Dine cihatçı grubunun yönetimi altındaki yaşamı konu alan filmi, En İyi Yabancı Film dalında Oscar'a aday gösterildi ve Müslüman yaşamındaki şiddet yanlısı aşırılığı kınadı."
  id: "Film Abdelrahman Sissako tentang kehidupan di Timbuktu di bawah kekuasaan kelompok jihadis Ansar Dine pada tahun 2012 dinominasikan untuk Oscar kategori Film Berbahasa Asing Terbaik dan mengutuk ekstremisme kekerasan dalam kehidupan Muslim."
