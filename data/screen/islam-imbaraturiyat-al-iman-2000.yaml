summary:
  ar: سلسلة وثائقية أمريكية من ثلاث حلقات أنتجتها بي بي إس وغاردنر للأفلام تستعرض التاريخ الإسلامي من البعثة إلى الدولة العثمانية؛
    من أكثر الوثائقيات عرضاً عن الحضارة الإسلامية في الغرب.
  en: A three-part PBS/Gardner Films documentary surveying Islamic history from the Prophet's mission to the Ottoman empire
    — one of the most-broadcast documentaries on Islamic civilisation in the West.
  es: "Un documental de tres partes de PBS/Gardner Films que repasa la historia islámica desde la misión del Profeta hasta el Imperio Otomano, uno de los documentales sobre la civilización islámica más emitidos en Occidente."
  fr: "Un documentaire en trois parties produit par PBS et Gardner Films, retraçant l'histoire islamique de la mission du Prophète à l'empire ottoman — l'un des documentaires sur la civilisation islamique les plus diffusés en Occident."
  ur: "تین حصوں پر مشتمل PBS/Gardner فلمز کی دستاویزی فلم جس میں پیغمبر اسلام کے مشن سے لے کر سلطنت عثمانیہ تک اسلامی تاریخ کا سروے کیا گیا ہے - جو مغرب میں اسلامی تہذیب پر سب سے زیادہ نشر ہونے والی دستاویزی فلموں میں سے ایک ہے۔"
  tr: "PBS ve Gardner Films tarafından üretilen üç bölümlük Amerikan belgesel dizisi, Osmanlı İmparatorluğu'na kadar olan misyondan İslam tarihini inceliyor; Batı'daki İslam uygarlığı hakkında en çok izlenen belgesellerden biri."
  id: "Sebuah serial dokumenter Amerika tiga episode yang diproduksi oleh PBS dan Gardner Films mengulas sejarah Islam dari misi ke Kekaisaran Ottoman; salah satu dokumenter yang paling banyak ditonton tentang peradaban Islam di Barat."
