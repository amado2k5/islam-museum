  en: The Emirati animated feature on Bilal ibn Rabah, from enslavement to becoming Islam's first muezzin — the first animated
    feature of its scale on a Companion.
  es: "El largometraje de animación emiratí sobre Bilal ibn Rabah, desde su esclavitud hasta convertirse en el primer muecín del Islam, es el primer largometraje de animación de esta envergadura publicado por la serie Companion."
  fr: "Le long métrage d'animation émirati sur Bilal ibn Rabah, de l'esclavage à son accession au titre de premier muezzin de l'islam — le premier long métrage d'animation de cette envergure sur un Compagnon."
  ur: "بلال بن رباح پر اماراتی اینی میٹڈ فیچر، غلامی سے لے کر اسلام کا پہلا مؤذن بننے تک - کسی صحابی پر اس کے پیمانے کی پہلی متحرک خصوصیت۔"
  tr: "Bilal bin Rabah'ı konu alan bir Emirlik animasyon filmi; kölelikten İslam'daki ilk müezzin olmaya kadar; bu ölçekte bir yoldaş hakkında ilk uzun metrajlı animasyon filmi."
  id: "Film animasi Emirat tentang Bilal bin Rabah, dari masa perbudakan hingga menjadi muezzin pertama dalam Islam; film animasi berdurasi panjang pertama tentang seorang pendamping sebesar ini."
