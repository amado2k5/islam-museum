summary:
  ar: فيلم مغامرات بطولة أنطونيو بانديراس في دور أحمد بن فضلان، السفير العباسي الذي يجد نفسه مع محاربي الفايكنج؛ مبني على
    رواية كرايتون المأخوذة عن رسالة ابن فضلان.
  en: John McTiernan's adventure film starring Antonio Banderas as Ahmad ibn Fadlan, the Abbasid envoy thrown in with Viking
    warriors — adapted from Crichton's novel drawn on Ibn Fadlan's risala.
  es: "La película de aventuras de John McTiernan, protagonizada por Antonio Banderas como Ahmad ibn Fadlan, el enviado abasí que se une a los guerreros vikingos, está adaptada de la novela de Crichton basada en la risala de Ibn Fadlan."
  fr: "Le film d'aventure de John McTiernan avec Antonio Banderas dans le rôle d'Ahmad ibn Fadlan, l'envoyé abbasside mêlé à des guerriers vikings — adapté du roman de Crichton inspiré du risala d'Ibn Fadlan."
  ur: "جان میک ٹیرنن کی ایڈونچر فلم جس میں انتونیو بینڈراس نے احمد ابن فدلان کا کردار ادا کیا تھا، جو عباسی ایلچی وائکنگ جنگجوؤں کے ساتھ شامل تھے - جو ابن فدلان کے رسالہ پر تیار کردہ کرچٹن کے ناول سے اخذ کی گئی ہے۔"
  tr: "Antonio Banderas'ın başrolünde olduğu macera filmi, Abbasi elçisi Ahmed bin Fadlan'ı canlandırır; Viking savaşçılarıyla birlikte bulur ve Crichton'un İbn Fadlan'ın mektubuna dayanan romanına dayanır."
  id: "Film petualangan yang dibintangi Antonio Banderas sebagai Ahmed bin Fadlan, duta besar Abbasiyah yang bertemu dengan para pejuang Viking; film ini didasarkan pada novel Crichton yang didasarkan pada surat Ibn Fadlan."
