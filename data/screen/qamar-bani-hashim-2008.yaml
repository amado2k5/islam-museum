summary:
  ar: مسلسل سوري لمحمد عزيزية عن بني هاشم من عبد المطلب إلى بعثة النبي؛ يجيب على سؤال تصوير النبي بإظهار أثره لا شخصه، ويصوّر
    قصة مكة قبيل البعثة.
  en: The Syrian series on the Banu Hashim from Abd al-Muttalib to the Prophet's mission; it answers the depiction question
    by showing the Prophet's trace, not his person.
  es: "La serie siria sobre los Banu Hashim, desde Abd al-Muttalib hasta la misión del Profeta, responde a la pregunta sobre su representación mostrando la huella del Profeta, no su persona."
  fr: "La série syrienne sur les Banu Hashim, d'Abd al-Muttalib à la mission du Prophète, répond à la question de la représentation en montrant la trace du Prophète, et non sa personne."
  ur: "بنو ہاشم پر عبد المطلب سے پیغمبر کے مشن تک شام کا سلسلہ؛ یہ تصویر کے سوال کا جواب نبی کا نشان دکھا کر دیتا ہے، نہ کہ اس کی شخصیت۔"
  tr: "Muhammed Aziziye'nin Banu Haşim'i Abdul Muttalib'den Peygamber'in misyonuna kadar anlatan Suriye serisi; Peygamber'in izini göstererek tasvir etme sorusuna yanıt verir ve misyon öncesi Mekke'nin hikayesini anlatır."
  id: "Sebuah seri Suriah karya Muhammad Aziziyah tentang Banu Hashim dari Abdul Muttalib hingga misi Nabi; ini menjawab pertanyaan tentang penggambaran Nabi dengan menunjukkan jejaknya, bukan dengan pribadinya, dan menggambarkan kisah Mekah sebelum misi dimulai."
