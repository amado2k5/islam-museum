  en: Shahriar Bahrani's Iranian film on the prophet Solomon's kingdom as told in Islamic sources; Solomon appears on screen
    per Iranian convention.
  es: "Película iraní de Shahriar Bahrani sobre el reino del profeta Salomón según las fuentes islámicas; Salomón aparece en pantalla según la convención iraní."
  fr: "Le film iranien de Shahriar Bahrani sur le royaume du prophète Salomon tel que relaté dans les sources islamiques; Salomon apparaît à l'écran conformément à la convention iranienne."
  ur: "شہریار بحرانی کی ایرانی فلم حضرت سلیمان کی بادشاہی پر جیسا کہ اسلامی ذرائع میں بتایا گیا ہے؛ سلیمان ایرانی کنونشن کے مطابق اسکرین پر ظاہر ہوتا ہے۔"
  tr: "İslami kaynaklarda bildirildiğine göre, Şehryar Behreyni'nin Davut oğlu Peygamber Süleyman ve krallığı hakkında İran filmi; Süleyman, İran sinema geleneğine göre ekranda yer almaktadır."
  id: "Film Iran karya Shahryar Bahrani tentang Nabi Salomo putra Daud dan kerajaannya, seperti yang dilaporkan oleh sumber Islam; Suleiman muncul di layar sesuai tradisi sinematik Iran."
