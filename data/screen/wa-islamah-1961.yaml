  tr: "Salah Abu Seif'in başrolünde olduğu, Lubna Abdel Aziz'in başrolünde olduğu, Bağdat'ın düşüşünden sonra Moğol istilasına karşı Memlük Mısır'ının direnişini konu alan Mısır filmi; Arap tarihi sinemasının klasiklerinden biridir."
  id: "Film Mesir yang dibintangi Salah Abu Seif, dibintangi Lubna Abdel Aziz, tentang perlawanan Mesir Mamluk terhadap invasi Mongol setelah jatuhnya Baghdad; ini adalah salah satu klasik sinema sejarah Arab."
