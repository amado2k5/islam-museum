summary:
  ar: فيلم إيراني ملحمي لماجد مجيدي عن طفولة النبي في مكة؛ تظهر شخصيته من الخلف واليدين دون ملامح الوجه، وكان مقرراً أن يكون
    أول جزء من ثلاثية.
  en: Majid Majidi's Iranian epic about the Prophet's childhood in Mecca; he is shown from behind and in silhouette, never
    his face. It was planned as the first part of a trilogy.
  es: "La epopeya iraní de Majid Majidi sobre la infancia del Profeta en La Meca; se le muestra de espaldas y en silueta, nunca su rostro. Fue concebida como la primera parte de una trilogía."
  fr: "L'épopée iranienne de Majid Majidi, qui relate l'enfance du Prophète à La Mecque, le montre de dos et en silhouette, jamais de visage. Elle était conçue comme le premier volet d'une trilogie."
  ur: "مکہ میں نبی کے بچپن کے بارے میں مجید مجیدی کا ایرانی افسانہ؛ اسے پیچھے سے اور سلیویٹ میں دکھایا گیا ہے، اس کا چہرہ کبھی نہیں۔ اسے تریی کے پہلے حصے کے طور پر پلان کیا گیا تھا۔"
