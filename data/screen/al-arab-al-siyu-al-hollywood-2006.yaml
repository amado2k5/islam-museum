  ar: وثائقي مبني على كتاب جاك شاهين يوثّق كيف صوّرت هوليوود العرب والمسلمين نمطياً في أكثر من ألف فيلم على مدى قرن.
  en: The Media Education Foundation documentary built on Jack Shaheen's book documenting Hollywood's stereotyped portrayal
    of Arabs and Muslims across a thousand films.
  es: "El documental de la Media Education Foundation se basa en el libro de Jack Shaheen, que documenta la representación estereotipada de los árabes y musulmanes en Hollywood a lo largo de mil películas."
  fr: "Le documentaire de la Media Education Foundation s'appuie sur le livre de Jack Shaheen qui documente la représentation stéréotypée des Arabes et des musulmans par Hollywood dans un millier de films."
  ur: "میڈیا ایجوکیشن فاؤنڈیشن کی دستاویزی فلم جیک شاہین کی کتاب پر بنائی گئی ہے جس میں ہالی ووڈ کی ایک ہزار فلموں میں عربوں اور مسلمانوں کی دقیانوسی تصویر کشی کی دستاویز ہے۔"
  tr: "Jack Chahine'in kitabına dayanan bir belgesel, Hollywood'un yüzyıl boyunca binin üzerinde filmde Arapları ve Müslümanları nasıl stereotipik olarak tasvir ettiğini belgeliyor."
  id: "Sebuah dokumenter yang didasarkan pada buku Jack Chahine mendokumentasikan bagaimana Hollywood secara stereotip menggambarkan Arab dan Muslim dalam lebih dari seribu film selama satu abad."
