summary:
  ar: فيلم مايكل مان بطولة ويل سميث عن محمد علي كلاي بين اعتناق الإسلام والدفاع عن لقبه ورفض الذهاب إلى فيتنام؛ رشح سميث لأوسكار
    عن الدور.
  en: Michael Mann's biopic with Will Smith as Muhammad Ali — from his conversion to the Nation of Islam to the title fights
    and the Vietnam refusal; Smith was Oscar-nominated.
  es: "La película biográfica de Michael Mann, con Will Smith como Muhammad Ali, narra su historia desde su conversión a la Nación del Islam hasta las peleas por el título y su negativa a ir a Vietnam; Smith fue nominado al Oscar."
  fr: "Le biopic de Michael Mann avec Will Smith dans le rôle de Muhammad Ali — de sa conversion à la Nation of Islam aux combats pour le titre et à son refus de combattre au Vietnam; Smith a été nominé aux Oscars."
  ur: "مائیکل مان کی بایوپک ول اسمتھ کے ساتھ بطور محمد علی — اس کے نیشن آف اسلام میں تبدیل ہونے سے لے کر ٹائٹل فائٹس اور ویتنام سے انکار تک؛ اسمتھ کو آسکر نامزد کیا گیا تھا۔"
  tr: "Michael Mann'ın Will Smith'in başrolünde olduğu filmi, Muhammed Ali Clay'i İslam'a geçiş ve unvanını savunma ile Vietnam'a gitmeyi reddederken canlandırıyor; Smith, bu rolüyle Oscar'a aday gösterildi."
  id: "Film Michael Mann yang dibintangi Will Smith menggambarkan Muhammad Ali Clay antara memeluk Islam dan mempertahankan gelarnya serta menolak pergi ke Vietnam; Smith dinominasikan untuk Oscar atas peran tersebut."
