  en: A Pakistani film about a devout naat-reciter shunned after a wedding video of him dancing goes viral — delayed by religious
    protest, then Pakistan's Oscar submission.
  es: "Una película pakistaní sobre un devoto recitador de naat (cánticos religiosos) que es marginado después de que un video de su boda bailando se volviera viral, se retrasó debido a protestas religiosas y luego a la presentación de Pakistán para los premios Óscar."
  fr: "Un film pakistanais racontant l'histoire d'un récitant de naat dévot mis au ban de la société après la diffusion virale d'une vidéo de mariage où on le voit danser — retardée par des protestations religieuses, puis candidate du Pakistan aux Oscars."
  ur: "ایک عقیدت مند نعت پڑھنے والے کے بارے میں ایک پاکستانی فلم کو اس کے رقص کی شادی کی ویڈیو وائرل ہونے کے بعد چھوڑ دیا گیا - مذہبی احتجاج، پھر پاکستان کی طرف سے آسکر جمع کرانے میں تاخیر۔"
