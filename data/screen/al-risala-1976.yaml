reception:
- kind: approval
  by: al-Azhar University and the Higher Islamic Shia Council of Lebanon, as stated in the film's opening intertitles
  date:
    edtf: '1976'
  status: debated
  note: The script was approved in full by Tawfiq al-Hakim of al-Azhar; the approval was later revoked and the film called
    an insult to Islam, as NPR reported in 2016.
  sources:
  - source/wikipedia-the-message-1976-en
  - source/npr-message-2016
- kind: withdrawal
  by: Government of Morocco
  where:
  - ma
  date:
    edtf: '1974-08-05'
    precision: day
  note: Moroccan police stopped filming on 5 August 1974, King Hassan II having been pressed by King Faisal of Saudi Arabia;
    filming moved to Libya from October 1974 to May 1975.
  sources:
  - source/wikipedia-the-message-1976-en
- kind: ban
  where:
  - eg
  - kw
  - sa
  note: Banned in Egypt, Kuwait and Saudi Arabia; in Saudi Arabia until 2018. In Egypt the censorship office later asked al-Azhar
    to permit both versions after 22 years of prohibition.
  sources:
  - source/wikipedia-the-message-1976-en
  - source/wikipedia-the-message-1976-ar
- kind: protest
  where:
  - us
  date:
    edtf: 1977-03
    precision: month
  note: In March 1977, as the film was to open in the United States, the Hanafi Movement besieged the Washington chapter of
    B'nai B'rith, wrongly believing that Anthony Quinn played the Prophet, and demanded that the opening be cancelled; the
    film was pulled on its premiere day and resumed after the siege ended.
  sources:
  - source/wikipedia-the-message-1976-en
  - source/atlantic-message-2012
  - source/telegraph-message-1976
- kind: release
  where:
  - in
  date:
    edtf: 2007-12
    precision: month
  note: Hindi-Urdu dub with a new soundtrack including A. R. Rahman's Marhaba Mustapha, approved for release by Kalbe Sadiq
    and other Indian scholars.
  sources:
  - source/wikipedia-the-message-1976-en
- kind: ban
  where:
  - in
  date:
    edtf: 2008-02
    precision: month
  note: Screenings of the dub in Hyderabad were stopped after objections from the local group Tanzeem Islah-e-Muashra and
    the Majlis-e-Ittehadul Muslimeen; the distributor said the film contained nothing objectionable.
  sources:
  - source/wikipedia-the-message-1976-en
- kind: release
  where:
  - ae
  - sa
  date:
    edtf: 2017-12/2018
    precision: month
  note: A 4K restoration was shown at the Dubai International Film Festival in December 2017 and released in Saudi cinemas
    in 2018.
  sources:
  - source/wikipedia-the-message-1976-en
  - source/wikipedia-the-message-1976-ar
- kind: other
  note: 'Critics divided: Dilys Powell (Sunday Times), Variety, Charles Champlin (Los Angeles Times), Alexander Walker (Evening
    Standard) and Bob Thomas (AP) praised it; Richard Eder (New York Times), John Pym (Monthly Film Bulletin) and Derek Malcolm
    (Guardian) criticised it; Gene Siskel gave it two stars of four. NPR called it a classic forty years on.'
  sources:
  - source/wikipedia-the-message-1976-en
  - source/nyt-message-review-1977
  - source/npr-message-2016
- kind: other
  date:
    edtf: 2008-10
    precision: month
  note: In October 2008 the producer Oscar Zoghbi announced a remake, The Messenger of Peace; it was not made.
  sources:
  - source/guardian-message-remake-2008
