summary:
  ar: فيلم ملحمي أخرجه وأنتجه مصطفى العقاد عن بزوغ الإسلام، صُوّر بين المغرب وليبيا بنسختين عربية وإنجليزية بممثلين مختلفين،
    وعُرض أولا في لندن في 29 يوليو 1976 باسم «محمد رسول الله» قبل أن يتغير عنوانه إلى «الرسالة»؛ لا يُرى فيه النبي ولا يُسمع،
    ورُشحت موسيقاه لموريس جار للأوسكار، ومُنع في مصر والكويت والسعودية زمنا طويلا.
  en: An epic film on the birth of Islam directed and produced by Moustapha Akkad, shot in Morocco and Libya in separate Arabic
    and English versions with different casts, and first shown in London on 29 July 1976 as Mohammad, Messenger of God before
    being retitled The Message; the Prophet is never seen or heard, Maurice Jarre's score was nominated for an Oscar, and
    the film was long banned in Egypt, Kuwait and Saudi Arabia.
  ur: مصطفیٰ العقاد کی ہدایت اور پیشکش میں اسلام کے آغاز پر ایک رزمیہ فلم، جو مراکش اور لیبیا میں الگ الگ کاسٹ کے ساتھ عربی
    اور انگریزی نسخوں میں فلمائی گئی اور 29 جولائی 1976 کو لندن میں «محمد، رسول اللہ» کے نام سے پہلی بار دکھائی گئی، پھر اس
    کا نام «دی میسج» ہوا؛ اس میں نبی نہ دکھائی دیتے ہیں نہ سنائی دیتے ہیں۔ موریس جار کی موسیقی آسکر کے لیے نامزد ہوئی، اور
    فلم مصر، کویت اور سعودی عرب میں طویل عرصہ ممنوع رہی۔
