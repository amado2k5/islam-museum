  ar: فيلم وثائقي لأبرار حسين يرصد يوماً كاملاً في المسجد الحرام من أعين العاملين فيه — المؤذنين والخطباء وعمال النظافة والحراس.
  en: Abrar Hussain's documentary observing a full day in Masjid al-Haram through the eyes of its muezzins, imams, cleaners
    and guards.
  es: "El documental de Abrar Hussain muestra un día completo en la Mezquita Sagrada (Masjid al-Haram) a través de los ojos de sus muecines, imanes, limpiadores y guardias."
