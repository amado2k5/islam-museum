  tr: "Abrar Hüseyin'in belgesel filmi, Mescid-Camii'deki tam bir günü personelinin gözünden — müezzinler, vaizler, temizlik görevlileri ve muhafızlar — yansıtıyor."
  id: "Film dokumenter karya Abrar Hussein menangkap satu hari penuh di Masjid Agung melalui mata stafnya — muezzin, pengkhotbah, pekerja sanitasi, dan penjaga."
