  en: The Indonesian animated children's series about Nussa and his sister Rarra learning Islamic values — the most-watched
    Islamic children's animation worldwide on YouTube.
  es: "La serie animada infantil indonesia sobre Nussa y su hermana Rarra aprendiendo valores islámicos es la animación infantil islámica más vista en todo el mundo en YouTube."
  fr: "La série animée indonésienne pour enfants racontant l'histoire de Nussa et de sa sœur Rarra apprenant les valeurs islamiques — l'animation islamique pour enfants la plus regardée au monde sur YouTube."
  ur: "Nussa اور اس کی بہن Rarra کے بارے میں انڈونیشی اینیمیٹڈ بچوں کی سیریز جو اسلامی اقدار سیکھ رہی ہے - YouTube پر دنیا بھر میں سب سے زیادہ دیکھی جانے والی اسلامی بچوں کی اینیمیشن۔"
  tr: "Nosa ve kız kardeşi Rara hakkında bir çocuk animasyon çocuk dizisi; YouTube'da dünya çapında en başarılı İslami çocuk çizgi filmlerinden biri."
  id: "Sebuah serial animasi anak-anak Indonesia tentang seorang anak laki-laki Nosa dan saudara perempuannya Rara serta mengajarkan nilai-nilai Islam; salah satu kartun anak-anak Islam paling sukses di dunia di YouTube."
