summary:
  ar: فيلم هيفاء المنصور — أول فيلم روائي طويل تصوّره مخرجة داخل السعودية — عن طفلة في الرياض تريد دراجة هوائية؛ لغة سينمائية
    هادئة عن قيود المكان والنوع.
  en: Haifaa al-Mansour's film — the first feature directed by a woman inside Saudi Arabia — about a girl in Riyadh who wants
    a bicycle; a quiet study of gender and public space.
  es: "La película de Haifaa al-Mansour —el primer largometraje dirigido por una mujer en Arabia Saudí— trata sobre una niña de Riad que quiere una bicicleta; un estudio sobrio sobre el género y el espacio público."
  fr: "Le film de Haifaa al-Mansour — le premier long métrage réalisé par une femme en Arabie saoudite — raconte l'histoire d'une jeune fille à Riyad qui rêve d'un vélo; une étude subtile du genre et de l'espace public."
  ur: "حائفہ المنصور کی فلم - سعودی عرب کے اندر ایک خاتون کی طرف سے ہدایت کردہ پہلی فیچر - ریاض میں ایک لڑکی کے بارے میں جو ایک سائیکل چاہتی ہے۔ صنف اور عوامی جگہ کا خاموش مطالعہ۔"
  tr: "Haifa Al-Mansour'un filmi — Suudi Arabistan'da kadın bir yönetmen tarafından çekilen ilk uzun metrajlı film — Riyad'da bisiklet isteyen bir kızı konu alıyor; mekân ve cinsiyet kısıtlamaları hakkında sakin bir sinematik dil."
  id: "Film Haifa Al-Mansour — film fitur pertama yang difilmkan oleh sutradara perempuan di dalam Arab Saudi — bercerita tentang seorang gadis di Riyadh yang menginginkan sepeda; bahasa sinematik yang tenang tentang batasan tempat dan gender."
