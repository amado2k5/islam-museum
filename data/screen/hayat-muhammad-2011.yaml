  en: A three-part BBC documentary presented by Rageh Omaar, tracing the Prophet's life on location in Arabia with scholars
    and contemporary Muslims.
  es: "Un documental de la BBC en tres partes, presentado por Rageh Omaar, que recorre la vida del Profeta en diversos lugares de Arabia con la participación de académicos y musulmanes contemporáneos."
  fr: "Un documentaire en trois parties de la BBC, présenté par Rageh Omaar, retraçant la vie du Prophète sur les lieux mêmes de son existence en Arabie, en compagnie d'érudits et de musulmans contemporains."
  ur: "بی بی سی کی ایک تین حصوں پر مشتمل دستاویزی فلم جو راضہ عمر نے پیش کی ہے، جس میں علماء اور عصری مسلمانوں کے ساتھ عرب میں مقام پر نبی کی زندگی کا پتہ لگایا گیا ہے۔"
  tr: "BBC'de Ragheb Omar tarafından sunulan, Peygamber'in biyografisini Arap Yarımadası genelindeki alanlarda çekimler yoluyla belgeleyen üç bölümlük belgesel dizisi; araştırmacılar ve çağdaş Müslümanlarla yapılan röportajlar yer alıyor."
  id: "Seri dokumenter tiga episode yang dipresentasikan oleh Ragheb Omar di BBC yang mendokumentasikan biografi Nabi melalui pengambilan gambar di situs-situs di seluruh Semenanjung Arab dengan wawancara dengan peneliti dan Muslim kontemporer."
