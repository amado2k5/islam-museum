summary:
  ar: فيلم مصري قديم عن قصة أبي لهب وعداوته للإسلام في مكة؛ من أوائل الأفلام العربية التي تناولت شخصيات السيرة والقرآن.
  en: An early Egyptian film dramatising Abu Lahab's opposition to Islam in Mecca — among the first Arabic films on a Qur'anic
    figure.
  es: "Una de las primeras películas egipcias que dramatiza la oposición de Abu Lahab al Islam en La Meca, y que se encuentra entre las primeras películas árabes sobre una figura coránica."
  fr: "Un des premiers films égyptiens dramatisant l'opposition d'Abu Lahab à l'islam à La Mecque — l'un des premiers films arabes sur un personnage coranique."
  ur: "ایک ابتدائی مصری فلم جو مکہ میں ابو لہب کی اسلام کی مخالفت کو ڈرامہ کرتی ہے - ایک قرآنی شخصیت پر بننے والی پہلی عربی فلموں میں۔"
  tr: "Mekke'de Ebu Lahab'ın hikayesi ve İslam'a karşı düşmanlığı konu alan eski bir Mısır filmi; biyografi ve Kur'an'daki karakterlere değinen en erken Arap filmlerinden biri."
  id: "Film Mesir kuno tentang kisah Abu Lahab dan permusuhannya terhadap Islam di Mekah; salah satu film Arab paling awal yang membahas tokoh-tokoh dari biografi dan Al-Qur'an."
