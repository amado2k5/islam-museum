perspectives:
- tradition: sunni
  standing: main
  stance:
    ar: 'أهل السنة ⁦(المانعون)⁩: لا يجوز تمثيل الصحابة'
    en: 'Sunni (those who forbade it): the Companions may not be portrayed'
    ur: 'سني ⁦(اہلِ سنت)⁩ — منع کرنے والے: صحابہ کی تمثیل جائز نہیں'
  summary:
    ar: مفتي السعودية عبد العزيز آل الشيخ وصالح الفوزان ومجمع البحوث الإسلامية في الأزهر وعلماء آخرون رأوا تمثيل الخلفاء والصحابة
      غير جائز، واستند الفوزان إلى إجماع العلماء وقرار رابطة العالم الإسلامي.
    en: The Saudi Grand Mufti Abd al-Aziz Al al-Shaykh, Salih al-Fawzan, al-Azhar's Islamic Research Academy and other scholars
      held that portraying the caliphs and Companions is not permitted; al-Fawzan cited the scholars' consensus and the Muslim
      World League's resolution.
    ur: سعودی مفتی اعظم عبد العزیز آل الشیخ، صالح الفوزان، ازہر کی مجمع البحوث الاسلامیہ اور دیگر علما کے نزدیک خلفا اور صحابہ
      کی تمثیل جائز نہیں؛ الفوزان نے علما کے اجماع اور رابطہ عالم اسلامی کی قرارداد کا حوالہ دیا۔
  sources:
  - source/wikipedia-omar-tv-series-en
  - source/thr-omar-fatwa-2012
- tradition: sunni
  standing: main
  stance:
    ar: 'أهل السنة ⁦(المجيزون)⁩: يجوز بضوابط'
    en: 'Sunni (those who approved it): permitted with safeguards'
    ur: 'سني ⁦(اہلِ سنت)⁩ — اجازت دینے والے: شرائط کے ساتھ جائز'
  summary:
    ar: يوسف القرضاوي وسلمان العودة وياسر قاضي وعلي الصلابي وخالد المصلح أجازوا المسلسل، وراجع بعضهم نصه في لجنة علمية للتحقق
      من دقته التاريخية.
    en: Yusuf al-Qaradawi, Salman al-Awda, Yasir Qadhi, Ali al-Sallabi and Khaled al-Musleh approved the series, and some
      of them reviewed its script on a scholars' committee for historical accuracy.
    ur: یوسف القرضاوی، سلمان العودہ، یاسر قاضی، علی الصلابی اور خالد المصلح نے سیریز کو جائز کہا، اور ان میں سے بعض نے تاریخی
      صحت کے لیے علمی کمیٹی میں اس کا متن دیکھا۔
  sources:
  - source/wikipedia-omar-tv-series-en
  - source/alarabiya-omar-2012
  - source/national-omar-2012
- tradition: other
  standing: other
  stance:
    ar: نقد من بعض الشيعة
    en: Criticism from some Shia commentators
    ur: بعض شیعہ مبصرین کی تنقید
  summary:
    ar: 'في الرواية الشيعية: انتقد بعض علماء الشيعة ومعلقيهم تصوير المسلسل لعلي بن أبي طالب وما عدّوه تحريفا تاريخيا، ومُنع
      المسلسل في إيران.'
    en: 'In Shia perspective: some Shia scholars and commentators criticised the series'' portrayal of Ali ibn Abi Talib and
      what they regarded as historical distortions, and the series was banned in Iran.'
    ur: 'شیعہ نقطۂ نظر میں: بعض شیعہ علما اور مبصرین نے سیریز میں علی بن ابی طالب کی تصویر کشی اور اپنے نزدیک تاریخی تحریفات
      پر تنقید کی، اور ایران میں اس پر پابندی لگی۔'
