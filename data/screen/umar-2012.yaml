summary:
  ar: مسلسل تاريخي من إنتاج مجموعة إم بي سي وتلفزيون قطر، أخرجه حاتم علي وكتبه وليد سيف، يتتبع سيرة عمر بن الخطاب من شبابه
    في مكة إلى مقتله خليفةً، في 31 حلقة عُرضت في رمضان 1433 من 20 يوليو 2012؛ لا يظهر فيه النبي، لكنه جسّد الخلفاء الراشدين،
    فانقسم العلماء حوله بين مانعٍ ومجيز.
  en: A historical series produced by MBC Group and Qatar TV, directed by Hatem Ali and written by Walid Saif, following Umar
    ibn al-Khattab from his youth in Mecca to his assassination as caliph, in 31 episodes broadcast in Ramadan 1433 from 20
    July 2012; the Prophet is not shown, but the four rightly guided caliphs are, and scholars divided between those who forbade
    it and those who approved it.
  ur: ایم بی سی گروپ اور قطر ٹی وی کی تاریخی سیریز، ہدایت کار حاتم علی اور مصنف ولید سیف، جو عمر بن الخطاب کی زندگی مکہ میں
    جوانی سے خلیفہ کی حیثیت سے شہادت تک 31 اقساط میں دکھاتی ہے، رمضان 1433 میں 20 جولائی 2012 سے نشر ہوئی؛ اس میں نبی نہیں
    دکھائے گئے لیکن خلفائے راشدین دکھائے گئے، اور علما اسے ممنوع اور جائز کہنے والوں میں بٹ گئے۔
