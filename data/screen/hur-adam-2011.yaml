summary:
  ar: فيلم تركي عن سيرة بديع الزمان سعيد النورسي من مدرس كردي إلى مؤلف رسائل النور وسجين المحاكم العلمانية؛ أكبر عمل سينمائي
    عن عالم دين تركي حديث.
  en: A Turkish biopic of Bediüzzaman Said Nursi — Kurdish scholar to author of the Risale-i Nur — the largest film about
    a modern Turkish religious scholar.
  es: "Una película biográfica turca sobre Bediüzzaman Said Nursi, erudito kurdo y autor del Risale-i Nur, la película más extensa sobre un erudito religioso turco moderno."
  fr: "Un biopic turc de Bediüzzaman Said Nursi — érudit kurde et auteur du Risale-i Nur — le plus grand film jamais réalisé sur un érudit religieux turc moderne."
  ur: "بیدی الزمان سید نورسی کی ایک ترک بائیوپک - کرد عالم سے لے کر رسالے نور کے مصنف - ایک جدید ترک مذہبی اسکالر کے بارے میں سب سے بڑی فلم ہے۔"
  tr: "Badi'al-Zaman Said Nursi'nin biyografisini konu alan bir Türk filmi; bir Kürt öğretmenden ışık mektuplarının yazarı ve laik mahkemelerin mahkumu olarak yazılmış; modern bir Türk dini âlimi hakkında en büyük sinema eseri."
  id: "Film Turki tentang biografi Badi' al-Zaman Said Nursi, dari seorang guru Kurdi hingga penulis surat cahaya dan tahanan pengadilan sekuler; karya sinematik terbesar tentang seorang sarjana agama Turki modern."
