summary:
  ar: فيلم جيلو بونتيكورفو عن معركة الجزائر 1956–1957 بين جبهة التحرير والاستعمار الفرنسي؛ من أشهر أفلام حركات التحرر، ويرصد
    بدايات الحي العربي وصراعه.
  en: Gillo Pontecorvo's landmark film on the 1956–57 Battle of Algiers between the FLN and French colonial forces — the classic
    screen account of an anti-colonial struggle.
  es: "La emblemática película de Gillo Pontecorvo sobre la batalla de Argel de 1956-57 entre el FLN y las fuerzas coloniales francesas: el relato cinematográfico clásico de una lucha anticolonial."
  fr: "Le film emblématique de Gillo Pontecorvo sur la bataille d'Alger de 1956-1957 entre le FLN et les forces coloniales françaises — le récit cinématographique classique d'une lutte anticoloniale."
  ur: "FLN اور فرانسیسی نوآبادیاتی قوتوں کے درمیان الجزائر کی 1956-57 کی لڑائی پر گیلو پونٹیکوروو کی تاریخی فلم - نوآبادیاتی مخالف جدوجہد کا کلاسک اسکرین اکاؤنٹ۔"
  tr: "Gillo Pontecorvo'nun, Kurtuluş Cephesi ile Fransız sömürgeciliği arasındaki 1956–1957 Cezayir Muharebesi'ni konu alan filmi; Arap Mahallesi'nin başlangıcını ve mücadelesini belgeleyen kurtuluş hareketlerinin en ünlü filmlerinden biridir."
  id: "Film Gillo Pontecorvo tentang Pertempuran Aljir 1956–1957 antara Front Pembebasan dan kolonialisme Prancis; salah satu film gerakan pembebasan yang paling terkenal, mendokumentasikan awal mula dan perjuangan Kawasan Arab."
