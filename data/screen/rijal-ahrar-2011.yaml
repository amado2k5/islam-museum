summary:
  ar: فيلم فرنسي لإسماعيل فروخي عن جامع باريس الكبير وإمامه سي كدور بن غبريل اللذين أنقذا يهوداً خلال الاحتلال النازي — قصة
    حقيقية لموقف مسلم.
  en: Ismaël Ferroukhi's film on the Grand Mosque of Paris and rector Si Kaddour Benghabrit sheltering Jews under Nazi occupation
    — a true story of Muslim rescue.
  es: "La película de Ismaël Ferroukhi sobre la Gran Mezquita de París y el rector Si Kaddour Benghabrit, que dio refugio a judíos durante la ocupación nazi: una historia real de rescate musulmán."
  fr: "Le film d'Ismaël Ferroukhi sur la Grande Mosquée de Paris et le recteur Si Kaddour Benghabrit qui ont abrité des Juifs pendant l'occupation nazie — une histoire vraie de sauvetage de musulmans."
  ur: "اسماعیل فیروخی کی پیرس کی گرینڈ مسجد اور ریکٹر سی کدور بنگھبریت پر نازی قبضے کے دوران یہودیوں کو پناہ دینے والی فلم – مسلمانوں کے بچاؤ کی ایک سچی کہانی۔"
  tr: "İsmail Froukhi'nin Paris'teki Büyük Camii ve imamı C. Kaddour Ben Gabriel'i konu alan Fransız filmi; Nazi işgali sırasında Yahudileri kurtaran — Müslüman duruşunun gerçek bir hikayesi."
  id: "Film Prancis karya Ismail Froukhi tentang Masjid Besar Paris dan imamnya, C. Kaddour Ben Gabriel, yang menyelamatkan orang Yahudi selama pendudukan Nazi — kisah nyata tentang sikap Muslim."
