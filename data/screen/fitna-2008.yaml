  en: Geert Wilders's short film juxtaposing Qur'anic verses with footage of violence; it prompted international condemnation
    and diplomatic protest. Indexed as a document of anti-Islam polemics, not endorsed.
  es: "Cortometraje de Geert Wilders que yuxtapone versículos coránicos con imágenes de violencia; provocó la condena internacional y protestas diplomáticas. Catalogado como documento de polémica antiislámica, no respaldado."
  fr: "Le court métrage de Geert Wilders, qui juxtapose des versets coraniques à des images de violence, a suscité une condamnation internationale et des protestations diplomatiques. Classé comme document polémique anti-islam, il n'a pas reçu d'approbation."
  ur: "Geert Wilders کی مختصر فلم قرآنی آیات کو تشدد کی فوٹیج کے ساتھ جوڑتی ہے؛ اس نے بین الاقوامی مذمت اور سفارتی احتجاج کو جنم دیا۔ اسلام مخالف سیاست کی دستاویز کے طور پر ترتیب دی گئی، اس کی توثیق نہیں کی گئی۔"
