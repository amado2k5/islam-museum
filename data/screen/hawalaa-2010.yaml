summary:
  ar: فيلم دوني فيلنوف عن توأمين كنديين يعودان إلى بلد أمّهما في الشرق الأوسط ليكتشفا ماضي الحرب الأهلية بين مسلمين ومسيحيين؛
    مرشح لأوسكار أفضل فيلم أجنبي.
  en: Denis Villeneuve's Oscar-nominated film about Canadian twins returning to their mother's Middle Eastern homeland, uncovering
    a civil war fought between Muslims and Christians.
  es: "La película de Denis Villeneuve, nominada al Oscar, trata sobre dos gemelos canadienses que regresan a la tierra natal de su madre en Oriente Medio y descubren una guerra civil librada entre musulmanes y cristianos."
  fr: "Le film de Denis Villeneuve, nominé aux Oscars, raconte l'histoire de jumeaux canadiens retournant dans le pays d'origine de leur mère au Moyen-Orient et découvrant une guerre civile entre musulmans et chrétiens."
  ur: "Denis Villeneuve کی آسکر کے لیے نامزد کردہ فلم کینیڈا کے جڑواں بچوں کے بارے میں ہے جو اپنی ماں کے مشرق وسطیٰ کے وطن واپس لوٹ رہی ہے، جس میں مسلمانوں اور عیسائیوں کے درمیان لڑی جانے والی خانہ جنگی کا پردہ فاش کیا گیا ہے۔"
  tr: "Donis Villeneuve'ün Kanadalı ikizlerin Orta Doğu'daki annelerinin ülkesine dönerek Müslümanlar ve Hristiyanlar arasındaki iç savaşın geçmişini keşfetmelerini konu alan filmi; En İyi Yabancı Dil Film Oscar'ına aday gösterildi."
  id: "Film Donis Villeneuve tentang kembar Kanada yang kembali ke negara ibu mereka di Timur Tengah untuk menemukan masa lalu perang saudara antara Muslim dan Kristen; dinominasikan untuk Oscar untuk Film Berbahasa Asing Terbaik."
