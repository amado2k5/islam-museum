summary:
  ar: فيلم عثمان سمبين السنغالي عن قرية سنغالية تقاوم اعتناق الإسلام والمسيحية والاستعمار معاً؛ من أعمدة السينما الأفريقية
    ويصوّر دخول الإسلام بعين نقدية.
  en: Ousmane Sembène's Senegalese classic about a village resisting Islam, Christianity and colonialism alike — a pillar
    of African cinema portraying Islam's arrival with a critical eye.
  es: "El clásico senegalés de Ousmane Sembène sobre un pueblo que resiste al Islam, al cristianismo y al colonialismo por igual: un pilar del cine africano que retrata la llegada del Islam con una mirada crítica."
  fr: "Le classique sénégalais d'Ousmane Sembène, qui raconte l'histoire d'un village résistant à l'islam, au christianisme et au colonialisme, est un pilier du cinéma africain qui dépeint l'arrivée de l'islam avec un regard critique."
  ur: "Ousmane Sembène کی سینیگالی کلاسک ایک گاؤں کے بارے میں جو اسلام، عیسائیت اور استعمار کی یکساں مزاحمت کر رہی ہے - افریقی سنیما کا ایک ستون جو اسلام کی آمد کو تنقیدی نظر سے پیش کرتا ہے۔"
  tr: "Senegal filmi Ousmane Semben, İslam, Hristiyanlık ve sömürgeciliğin birlikte benimsenmesine karşı direnen bir Senegal köyünü konu alır; Afrika sinemasının temel taşlarından biri olup, İslam'ın girişini eleştirel bir bakış açısıyla tasvir eder."
  id: "Film Senegal Ousmane Semben, tentang sebuah desa Senegal yang bersama-sama melawan penerimaan Islam, Kristen, dan kolonialisme; salah satu pilar sinema Afrika, menggambarkan masuknya Islam dari perspektif kritis."
