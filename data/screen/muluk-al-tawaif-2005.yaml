summary:
  ar: مسلسل سوري لحاتم علي عن عصر ملوك الطوائف في الأندلس بعد سقوط قرطبة — المعتمد بن عباد وابن زيدون وولادة — وصراع المدن
    مع المرابطين.
  en: Hatem Ali's Syrian series on the taifa kings of al-Andalus after Cordoba's fall — al-Mu'tamid, Ibn Zaydun and Wallada
    — and the cities' struggle against the Almoravids.
  es: "La serie siria de Hatem Ali sobre los reyes de las taifas de al-Ándalus tras la caída de Córdoba —al-Mu'tamid, Ibn Zaydun y Wallada— y la lucha de las ciudades contra los almorávides."
  fr: "La série syrienne de Hatem Ali sur les rois taïfa d'al-Andalus après la chute de Cordoue — al-Mu'tamid, Ibn Zaydun et Wallada — et la lutte des villes contre les Almoravides."
  ur: "قرطبہ کے زوال کے بعد الاندلس کے طائفہ بادشاہوں پر حاتم علی کی شامی سیریز — المتمید، ابن زیدون اور والادہ — اور الموراوڈز کے خلاف شہروں کی جدوجہد۔"
  tr: "Hatim Ali tarafından yazılan Suriye dizisi, Kordoba'nın düşüşünden sonra Endülüs'teki Taifa krallarının dönemini — Al-Mu'tamid ibn Abbad, İbn Zeydun ve Walada — ve şehirlerin Almoravidlerle mücadelesini konu alır."
  id: "Sebuah seri Suriah karya Hatim Ali tentang era raja-raja Taifa di Andalusia setelah jatuhnya Córdoba — Al-Mu'tamid ibn Abbad, Ibn Zaydun, dan Walada — serta perjuangan kota-kota dengan Almoravid."
