summary:
  ar: فيلم أفغاني لصادق برمك — أول فيلم أفغاني بعد طالبان — عن فتاة تتنكر باسم أسامة لتعيل أسرتها تحت حكم طالبان؛ فاز بجائزة
    غولدن غلوب.
  en: Siddiq Barmak's film — the first Afghan feature after the Taliban — about a girl disguised as a boy named Osama to feed
    her family; Golden Globe winner.
  es: "La película de Siddiq Barmak —el primer largometraje afgano después de los talibanes— trata sobre una niña disfrazada de niño llamada Osama para alimentar a su familia; ganadora del Globo de Oro."
  fr: "Le film de Siddiq Barmak — le premier long métrage afghan après celui des talibans — raconte l'histoire d'une jeune fille déguisée en garçon nommé Osama pour nourrir sa famille; lauréat d'un Golden Globe."
  ur: "صدیق برمک کی فلم — طالبان کے بعد پہلی افغان فیچر — ایک لڑکی کے بارے میں جو اسامہ نامی لڑکے کے بھیس میں اپنے خاندان کا پیٹ پالنے کے لیے ہے۔ گولڈن گلوب فاتح۔"
  tr: "Taliban'dan sonraki ilk Afgan filmi olan Sadiq Barmak'ın Afgan filmi, Taliban yönetimi altında ailesini desteklemek için Osama kılığına giren bir kızı konu alıyor; Altın Küre ödülü kazandı."
  id: "Film Afghanistan karya Sadiq Barmak — film Afghanistan pertama setelah Taliban — tentang seorang gadis yang menyamar sebagai Osama untuk mendukung keluarganya di bawah pemerintahan Taliban; film ini memenangkan penghargaan Golden Globe."
