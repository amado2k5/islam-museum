  tr: "Abrar Hüseyin'in belgeseli, Kararname Gecesi'nde Mescid-i Aksa içinde çekildi; Filistinli ibadet edenleri, kutsal yer muhafızlarını ve işçilerini yılın en kutsal gecesinde takip ediyor."
