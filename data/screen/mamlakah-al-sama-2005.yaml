summary:
  ar: فيلم ريدلي سكوت عن باليان إيبيلين والدفاع عن القدس سنة 1187؛ يظهر صلاح الدين شخصية رئيسية كريمة، ولطالما نوقش تصويره
    للعلاقة بين الصليبيين والمسلمين.
  en: Ridley Scott's epic about Balian of Ibelin and the defence of Jerusalem in 1187; Saladin is a major, dignified character
    and the film's portrayal of the Crusades has been widely discussed.
  es: "La épica película de Ridley Scott sobre Balian de Ibelin y la defensa de Jerusalén en 1187; Saladino es un personaje importante y digno, y la representación de las Cruzadas en la película ha sido ampliamente debatida."
  fr: "Le film épique de Ridley Scott sur Balian d'Ibelin et la défense de Jérusalem en 1187; Saladin y est un personnage majeur et digne, et la représentation des croisades dans le film a fait l'objet de nombreuses discussions."
  ur: "1187 میں Ibelin کے بالین اور یروشلم کے دفاع کے بارے میں رڈلے سکاٹ کی مہاکاوی؛ صلاح الدین ایک اہم، باوقار کردار ہے اور فلم میں صلیبی جنگوں کی تصویر کشی پر بڑے پیمانے پر بحث کی گئی ہے۔"
  tr: "Ridley Scott'ın Balian İbelin ve 1187'de Kudüs'ün savunması üzerine yaptığı film, Selahaddin'i asil bir ana karakter olarak tasvir eder ve Haçlılar ile Müslümanlar arasındaki ilişkiyi tasviri uzun süredir tartışılmaktadır."
  id: "Film Ridley Scott tentang Balian Ibelin dan pertahanan Yerusalem pada tahun 1187 menggambarkan Saladin sebagai tokoh utama yang mulia, dan penggambarannya tentang hubungan antara Tentara Salib dan Muslim telah lama diperdebatkan."
