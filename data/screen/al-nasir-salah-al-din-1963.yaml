summary:
  ar: فيلم مصري ليوسف شاهين بطولة أحمد مظهر عن صلاح الدين وتحرير القدس من الصليبيين، ومن أشهر الأفلام العربية عن الحروب الصليبية.
  en: Youssef Chahine's Egyptian epic starring Ahmed Mazhar as Saladin and the liberation of Jerusalem — the most famous Arabic
    film on the Crusades.
  es: "La épica película egipcia de Youssef Chahine, protagonizada por Ahmed Mazhar como Saladino, que narra la liberación de Jerusalén, es la película árabe más famosa sobre las Cruzadas."
  fr: "L'épopée égyptienne de Youssef Chahine, avec Ahmed Mazhar dans le rôle de Saladin et la libération de Jérusalem — le film arabe le plus célèbre sur les croisades."
  ur: "یوسف چاہین کی مصری مہاکاوی جس میں احمد مظہر نے صلاح الدین کا کردار ادا کیا اور یروشلم کی آزادی - صلیبی جنگوں پر سب سے مشہور عربی فلم۔"
  tr: "Ahmed Mazhar'ın başrolünde olduğu Youssef Chahine'nin Mısır filmi, Salah al-Din ve Kudüs'ün Haçlılardan kurtuluşu hakkında, Haçlı Seferleri hakkında en ünlü Arap filmlerinden biri."
  id: "Film Mesir karya Youssef Chahine yang dibintangi Ahmed Mazhar tentang Salah al-Din dan pembebasan Yerusalem dari Tentara Salib, serta salah satu film Arab paling terkenal tentang Perang Salib."
