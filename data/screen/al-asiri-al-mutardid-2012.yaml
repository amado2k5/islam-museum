summary:
  ar: فيلم ميرا ناير عن رواية محسن حميد — باكستاني متخرج من برينستون يُستجوب بعد 11 سبتمبر حول مساره من وول ستريت إلى لاهور.
  en: Mira Nair's adaptation of Mohsin Hamid's novel — a Princeton-educated Pakistani questioned about his path from Wall
    Street to Lahore after 9/11.
  es: "La adaptación que Mira Nair hizo de la novela de Mohsin Hamid, sobre un pakistaní educado en Princeton al que se le pregunta sobre su trayectoria desde Wall Street hasta Lahore después del 11 de septiembre."
  fr: "L'adaptation par Mira Nair du roman de Mohsin Hamid — un Pakistanais diplômé de Princeton interrogé sur son parcours de Wall Street à Lahore après le 11 septembre."
  ur: "میرا نیر کی محسن حامد کے ناول کی موافقت - ایک پرنسٹن سے تعلیم یافتہ پاکستانی نے 9/11 کے بعد وال سٹریٹ سے لاہور تک کے راستے کے بارے میں سوال کیا۔"
  tr: "Mira Nair'in, 11 Eylül sonrası Wall Street'ten Lahor'a giden rotası hakkında sorgulanan Pakistanlı Princeton mezunu Mohsin Hameed'in romanından uyarlanan filmi."
  id: "Film Mira Nair yang diadaptasi dari novel karya Mohsin Hameed — seorang lulusan Princeton asal Pakistan yang diinterogasi setelah 9/11 tentang rutenya dari Wall Street ke Lahore."
