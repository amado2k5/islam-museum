summary:
  ar: فيلم يوسف شاهين المستوحى من قصة يوسف في مصر القديمة؛ أثار معركة قضائية وإعلامية في مصر حول تصوير أنبياء القرآن على الشاشة،
    فجُرّد بطلُه من الاسم القرآني.
  en: Youssef Chahine's retelling of the Joseph story set in ancient Egypt; its release sparked a legal battle in Egypt over
    depicting Qur'anic prophets on screen.
  es: "La reinterpretación de Youssef Chahine de la historia de José, ambientada en el antiguo Egipto, desató una batalla legal en Egipto sobre la representación de profetas coránicos en la pantalla."
  fr: "Le film de Youssef Chahine, qui revisite l'histoire de Joseph dans l'Égypte antique, a déclenché une bataille juridique en Égypte concernant la représentation des prophètes coraniques à l'écran."
  ur: "یوسف چاہنے کی قدیم مصر میں قائم جوزف کی کہانی کو دوبارہ بیان کرنا۔ اس کی ریلیز نے پردے پر قرآنی انبیاء کی تصویر کشی پر مصر میں قانونی جنگ چھیڑ دی۔"
  tr: "Antik Mısır'daki Yusuf'un hikayesinden esinlenen Youssef Chahine filmi, Kur'an peygamberlerinin ekranda tasviri konusunda Mısır'da hukuki ve medya mücadelesine yol açtı ve başkahramanının Kur'an adını elinden aldı."
  id: "Film Youssef Chahine, yang terinspirasi dari kisah Yusuf di Mesir kuno, memicu pertarungan hukum dan media di Mesir terkait penggambaran nabi Al-Qur'an di layar, sehingga tokoh utamanya kehilangan nama Al-Quran."
