summary:
  ar: "بنو توجين من شعوب بني بادين من الطبقة الثالثة من زناتة، من أعظم أحيائهم وأوفرهم عدداً؛ مواطنهم حفافي وادي شلف قبلة جبل وانشريش، ورياستهم لبني دافلتن فمنهم عطية بن دافلتن ولقمان بن المعتز الذي أوفد ابنه يدر على باديس قبل اللقاء طاعة وانحياشاً وكان قومهم زهاء ثلاثة آلاف، وكانت لهم آثار في حروب حماد بن بلكين، ثم انتقلت رياستهم لبني عبد القوي فغلب بنو عبد الواد على مواطنهم، ومن أمرائهم المتأخرين عطية الحيو الذي قتل سنة 607هـ بمكيدة عامل تلمسان ونصر بن عمر صاحب جبل وانشريش حتى أيام أبي حمو الأخير."
  en: "Banu Tujin of the Badin folk of the third Zanata tier, one of their greatest and most numerous divisions; their homeland the slopes of Wadi Shelif below Jabal Wansharish, their chieftaincy the Banu Daflaten — Atiyya ibn Daflaten and Luqman ibn al-Mu'tazz, who sent his son Yidr with bay'a to Badis before the battle when his folk numbered some three thousand — famed in Hammad ibn Buluggin's wars; the chieftaincy then passed to the Banu Abd al-Qawi until the Abd al-Wadids took their homeland, and among their later amirs Atiyya al-Hayyu, killed in 607 by the Tlemcen governor's ruse, and Nasr ibn Umar of Jabal Wansharish into the days of the last Abu Hammu."
  es: "Banu Tujin del pueblo Badin del tercer nivel de Zanata, una de sus divisiones más grandes y numerosas; su tierra natal las laderas de Wadi Shelif debajo de Jabal Wansharish, su jefatura los Banu Daflaten — Atiyya ibn Daflaten y Luqman ibn al-Mu'tazz, quien envió a su hijo Yidr con bay'a a Badis antes de la batalla cuando su pueblo contaba con unos tres mil — famosos en las guerras de Hammad ibn Buluggin; la jefatura pasó luego a los Banu Abd al-Qawi hasta que los Abd al-Wadids tomaron su tierra natal, y entre sus últimos emires Atiyya al-Hayyu, asesinado en 607 por la astucia del gobernador de Tlemcen, y Nasr ibn Umar de Jabal Wansharish hasta los días del último Abu Hammu."
  fr: "Les Banu Tujin, du peuple Badin, appartenant au troisième groupe Zanata, l'une de leurs divisions les plus importantes et les plus nombreuses; leur patrie se situait sur les pentes du Wadi Shelif, en contrebas du Jabal Wansharish; leur chefferie était celle des Banu Daflaten — Atiyya ibn Daflaten et Luqman ibn al-Mu'tazz, qui envoya son fils Yidr prêter allégeance aux Badis avant la bataille, alors que son peuple comptait environ trois mille hommes — célèbres lors des guerres de Hammad ibn Buluggin; la chefferie passa ensuite aux Banu Abd al-Qawi jusqu'à ce que les Abd al-Wadids s'emparent de leur patrie, et parmi leurs émirs ultérieurs, on compte Atiyya al-Hayyu, tué en 607 par la ruse du gouverneur de Tlemcen, et Nasr ibn Umar du Jabal Wansharish, jusqu'au règne du dernier Abu Hammu."
  ur: "تیسرے زناتا درجے کے بدین لوک بنو تجین، ان کی سب سے بڑی اور بے شمار تقسیموں میں سے ایک؛ ان کا وطن جبل ونشریش کے نیچے وادی شیلف کی ڈھلوان، ان کے سردار بنو دفلاطین - عطیہ بن دفلاطین اور لقمان ابن المعتز، جنہوں نے اپنے بیٹے یدر کو بیع کے ساتھ جنگ سے پہلے بدیس بھیجا جب اس کی قوم کی تعداد تین ہزار کے قریب تھی - حماد بن بلوگسن میں مشہور تھا۔ اس کے بعد سرداری بنو عبد القوی کے پاس چلی گئی یہاں تک کہ عبد الوداع نے اپنا وطن لے لیا، اور ان کے بعد کے امیروں میں عطیہ الحیو، جو 607 میں تلمسن کے گورنر کے ہاتھوں مارے گئے، اور جبل ونشریش کے نصر بن عمر آخری ابو حمو کے دور میں۔"
  tr: "Banu Tujin, Zenata'nın üçüncü sınıfı olan Banu Badin halkının en büyük ve en kalabalık kabilelerinden biridir. Anavatanları, Vançreş Dağı'nın önündeki Çelif Vadisi'nin kenarıdır. Liderlikleri, aralarında Atiya bin Dafilten ve Lukman bin Al-Mu'tazz'ın da bulunduğu Banu Dafilten tarafından yürütülmüştür. Lukman bin Al-Mu'tazz, toplantıdan önce itaat ve teslimiyet içinde oğlu Yadr'ı Badis'e göndermiştir. Halklarının sayısı yaklaşık üç bin civarındaydı ve Hammad bin Bulkin'in savaşlarında izleri görülmüştür. Daha sonra liderlikleri Banu Abd Al-Qawi'ye geçmiş ve Banu Abd Al-Wad, anavatanlarında egemenlik kurmuştur. Daha sonraki prensleri arasında, Hicri 607 yılında Tlemcen valisinin komplosuyla öldürülen Atiya Al-Hayyu ve sonuncusu Ebu Hammu'ya kadar Vançreş Dağı'nın hükümdarı olan Nasr bin Ömer bulunmaktadır."
  id: "Bani Tujin berasal dari Bani Badin dari kelas ketiga Zenata, salah satu suku terbesar dan terbanyak mereka. Tanah air mereka berada di tepi Lembah Chelif, di depan gunung Wanchreesh. Kepemimpinan mereka dipegang oleh Bani Dafilten, di antaranya Atiya bin Dafilten dan Luqman bin Al-Mu’tazz, yang mengirim putranya Yadr ke Badis sebelum pertemuan, sebagai bentuk ketaatan dan kepatuhan. Jumlah penduduk mereka sekitar tiga ribu, dan mereka memiliki jejak dalam peperangan Hammad bin Bulkin. Kemudian kepemimpinan mereka beralih ke Bani Abd Al-Qawi, dan Bani Abd Al-Wad menguasai tanah air mereka. Di antara para pangeran mereka di kemudian hari adalah Atiya Al-Hayyu, yang terbunuh pada tahun 607 H oleh konspirasi gubernur Tlemcen, dan Nasr bin Omar, penguasa gunung Wanchreesh, hingga masa Abu Hammu terakhir."
