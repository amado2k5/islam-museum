label:
  ar: بنو توجين
  en: Banu Tujin
summary:
  ar: "بنو توجين من شعوب بني بادين من الطبقة الثالثة من زناتة، من أعظم أحيائهم وأوفرهم عدداً؛ مواطنهم حفافي وادي شلف قبلة جبل وانشريش، ورياستهم لبني دافلتن فمنهم عطية بن دافلتن ولقمان بن المعتز الذي أوفد ابنه يدر على باديس قبل اللقاء طاعة وانحياشاً وكان قومهم زهاء ثلاثة آلاف، وكانت لهم آثار في حروب حماد بن بلكين، ثم انتقلت رياستهم لبني عبد القوي فغلب بنو عبد الواد على مواطنهم، ومن أمرائهم المتأخرين عطية الحيو الذي قتل سنة 607هـ بمكيدة عامل تلمسان ونصر بن عمر صاحب جبل وانشريش حتى أيام أبي حمو الأخير."
  en: "Banu Tujin of the Badin folk of the third Zanata tier, one of their greatest and most numerous divisions; their homeland the slopes of Wadi Shelif below Jabal Wansharish, their chieftaincy the Banu Daflaten — Atiyya ibn Daflaten and Luqman ibn al-Mu'tazz, who sent his son Yidr with bay'a to Badis before the battle when his folk numbered some three thousand — famed in Hammad ibn Buluggin's wars; the chieftaincy then passed to the Banu Abd al-Qawi until the Abd al-Wadids took their homeland, and among their later amirs Atiyya al-Hayyu, killed in 607 by the Tlemcen governor's ruse, and Nasr ibn Umar of Jabal Wansharish into the days of the last Abu Hammu."
