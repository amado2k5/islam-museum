label:
  ar: لمتونة
  en: Lamtuna
  es: "Lamtuna"
  fr: "Lamtuna"
  ur: "لمٹونا"
summary:
  ar: أعظم بطون الملثمين من صنهاجة الصحراء، منها خرجت دولة المرابطين؛ كانت رئاستهم في بني ورتانطق بيت أميرهم يحيى بن إبراهيم الجدالي الذي حج وجاءهم بالفقيه عبد الله بن ياسين، ومنهم أمراؤهم يحيى بن عمر وأخوه أبو بكر وابن عمهما يوسف بن تاشفين.
  en: The greatest of the veiled Sanhaja tribes of the Sahara, from whom the Almoravid state arose; their chieftaincy lay in the Banu Wartantaq house of Yahya ibn Ibrahim al-Juddali whose hajj brought them the jurist Abd Allah ibn Yasin, and their amirs were Yahya ibn Umar, his brother Abu Bakr, and their cousin Yusuf ibn Tashfin.
  es: "La más importante de las tribus veladas Sanhaja del Sahara, de la que surgió el estado almorávide; su jefatura residía en la casa Banu Wartantaq de Yahya ibn Ibrahim al-Juddali, cuyo hajj les trajo al jurista Abd Allah ibn Yasin, y sus emires eran Yahya ibn Umar, su hermano Abu Bakr y su primo Yusuf ibn Tashfin."
  fr: "La plus importante des tribus voilées Sanhaja du Sahara, dont est issu l'État almoravide; leur chefferie se trouvait dans la maison Banu Wartantaq de Yahya ibn Ibrahim al-Juddali, dont le hajj leur apporta le juriste Abd Allah ibn Yasin, et leurs émirs étaient Yahya ibn Umar, son frère Abu Bakr et leur cousin Yusuf ibn Tashfin."
  ur: "صحارا کے پردہ دار سنہاجا قبیلوں میں سے سب سے بڑا، جن سے الموراوڈ ریاست کا آغاز ہوا۔ ان کی سرداری یحییٰ بن ابراہیم الجدلی کے گھر بنو وارطاق میں تھی جس کا حج انہیں فقیہ عبداللہ بن یاسین لے کر آیا اور ان کے امیر یحییٰ بن عمر، ان کے بھائی ابوبکر اور ان کے چچا زاد بھائی یوسف بن تاشفین تھے۔"
