  en: Lamtuna
summary:
  ar: أعظم بطون الملثمين من صنهاجة الصحراء، منها خرجت دولة المرابطين؛ كانت رئاستهم في بني ورتانطق بيت أميرهم يحيى بن إبراهيم الجدالي الذي حج وجاءهم بالفقيه عبد الله بن ياسين، ومنهم أمراؤهم يحيى بن عمر وأخوه أبو بكر وابن عمهما يوسف بن تاشفين.
  en: The greatest of the veiled Sanhaja tribes of the Sahara, from whom the Almoravid state arose; their chieftaincy lay in the Banu Wartantaq house of Yahya ibn Ibrahim al-Juddali whose hajj brought them the jurist Abd Allah ibn Yasin, and their amirs were Yahya ibn Umar, his brother Abu Bakr, and their cousin Yusuf ibn Tashfin.
