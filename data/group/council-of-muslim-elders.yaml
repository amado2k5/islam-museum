summary:
  ar: "هيئة تضم عدداً من كبار الحكماء والعلماء من العالم الإسلامي، يرأسها الإمام الأكبر أحمد الطيب بوصفه أول رئيس منتخب لها، ويقول الكتاب إنها تأسست في 21 رمضان 1435هـ (19 يوليو 2014م) وإنها تهدف إلى تعزيز السلم في المجتمعات {cite:rihla-imam-akbar-indonesia-azhar p. 17}. عقدت جلستها الدورية السابعة في جاكرتا خلال الزيارة، وقررت إرسال قوافل سلام إلى بورما {cite:rihla-imam-akbar-indonesia-azhar p. 69}، وأرسلت بالتعاون مع الأزهر خمس عشرة قافلة سلام {cite:rihla-imam-akbar-indonesia-azhar p. 72}."
  en: "A body of senior scholars and elders from the Muslim world, chaired by the Grand Imam as its first elected president. The book dates its founding to 19 July 2014, which needs a second source. Its seventh session met in Jakarta during the 2016 visit."
