summary:
  ar: "هيئة تضم عدداً من كبار الحكماء والعلماء من العالم الإسلامي، يرأسها الإمام الأكبر أحمد الطيب بوصفه أول رئيس منتخب لها، ويقول الكتاب إنها تأسست في 21 رمضان 1435هـ ⁦(19 يوليو 2014م)⁩ وإنها تهدف إلى تعزيز السلم في المجتمعات {cite:rihla-imam-akbar-indonesia-azhar p. 17}. عقدت جلستها الدورية السابعة في جاكرتا خلال الزيارة، وقررت إرسال قوافل سلام إلى بورما {cite:rihla-imam-akbar-indonesia-azhar p. 69}، وأرسلت بالتعاون مع الأزهر خمس عشرة قافلة سلام {cite:rihla-imam-akbar-indonesia-azhar p. 72}."
  en: "A body of senior scholars and elders from the Muslim world, chaired by the Grand Imam as its first elected president. The book dates its founding to 19 July 2014, which needs a second source. Its seventh session met in Jakarta during the 2016 visit."
  es: "Un organismo integrado por destacados eruditos y ancianos del mundo musulmán, presidido por el Gran Imán como su primer presidente electo. El libro fecha su fundación el 19 de julio de 2014, fecha que requiere una segunda fuente. Su séptima sesión se celebró en Yakarta durante la visita de 2016."
  fr: "Un organe composé d'éminents érudits et d'anciens du monde musulman, présidé par le Grand Imam, son premier président élu. L'ouvrage situe sa fondation au 19 juillet 2014, date qui nécessite une autre source. Sa septième session s'est tenue à Jakarta lors de la visite de 2016."
  ur: "مسلم دنیا کے بزرگ علماء اور عمائدین کا ایک ادارہ جس کی صدارت گرینڈ امام اپنے پہلے منتخب صدر کے طور پر کرتے ہیں۔ اس کتاب کی تاریخ 19 جولائی 2014 ہے، جس کے لیے دوسرے ماخذ کی ضرورت ہے۔ اس کا ساتواں اجلاس 2016 کے دورے کے دوران جکارتہ میں ہوا۔"
