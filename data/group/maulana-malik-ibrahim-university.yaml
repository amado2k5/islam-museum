summary:
  ar: "جامعة إسلامية حكومية في مالانج بجاوة الشرقية. منحت الإمام الأكبر درجة الدكتوراه الفخرية يوم 24 فبراير 2016م تقديراً لجهوده في وسطية الإسلام ونشر السلام {cite:rihla-imam-akbar-indonesia-azhar p. 112}، وقال رئيسها إن طلابها يدرسون مناهج الأزهر ويسيرون على دربه {cite:rihla-imam-akbar-indonesia-azhar p. 115}."
  en: "State Islamic university in Malang, East Java. It gave the Grand Imam an honorary doctorate on 24 February 2016 for his work on moderation and peace; its rector said its students study Al-Azhar's curriculum."
  es: "Universidad Estatal Islámica en Malang, Java Oriental. Otorgó al Gran Imán un doctorado honoris causa el 24 de febrero de 2016 por su labor en pro de la moderación y la paz; su rector afirmó que sus estudiantes cursan el plan de estudios de Al-Azhar."
  fr: "L'université islamique d'État de Malang, dans l'est de Java, a décerné au Grand Imam un doctorat honoris causa le 24 février 2016 pour son travail en faveur de la modération et de la paix; son recteur a déclaré que ses étudiants y suivent le programme d'Al-Azhar."
  ur: "ملنگ، مشرقی جاوا میں ریاستی اسلامی یونیورسٹی۔ اس نے 24 فروری 2016 کو گرینڈ امام کو اعتدال اور امن کے بارے میں ان کے کام کے لیے ڈاکٹریٹ کی اعزازی ڈگری دی۔ اس کے ریکٹر نے کہا کہ اس کے طلباء الازہر کا نصاب پڑھتے ہیں۔"
