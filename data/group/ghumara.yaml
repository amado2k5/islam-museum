  ar: غمارة
  en: Ghumara
summary:
  ar: "غمارة من قبائل البربر سكان جبال غمارة وبلاد الريف بالمغرب الأقصى ما بين طنجة وملوية؛ جرى إسلامهم في دولة بني أمية على يد صالح بن منصور الحميري فبنوا مدينة نكور، وانتحلوا بدعوة الأدارسة مقامات وآثاراً، ومنهم عرف أهل العهد بانتحال السحر والكهانة، ومن كبرى عشائرهم بنو رزين وبنو ورصيخ، ودام أمرهم في بلادهم تحت رايات المتعاقبين من ملوك المغرب إلى عهد ابن خلدون."
  en: "Ghumara, the Berber tribe of the Ghumara mountains and the Rif between Tangier and the Malwiyya; their Islam came in the Umayyad state through Salih ibn Mansur al-Himyari, who built Nekour — they embraced the Idrisid da'wa with famous resorts and stations, were proverbial in Ibn Khaldun's day for sorcery and soothsaying, and counted Banu Razin and Banu Wursikh among their great clans, holding their mountains under successive Maghreb kings into his own time."
