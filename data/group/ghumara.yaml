summary:
  ar: "غمارة من قبائل البربر سكان جبال غمارة وبلاد الريف بالمغرب الأقصى ما بين طنجة وملوية؛ جرى إسلامهم في دولة بني أمية على يد صالح بن منصور الحميري فبنوا مدينة نكور، وانتحلوا بدعوة الأدارسة مقامات وآثاراً، ومنهم عرف أهل العهد بانتحال السحر والكهانة، ومن كبرى عشائرهم بنو رزين وبنو ورصيخ، ودام أمرهم في بلادهم تحت رايات المتعاقبين من ملوك المغرب إلى عهد ابن خلدون."
  en: "Ghumara, the Berber tribe of the Ghumara mountains and the Rif between Tangier and the Malwiyya; their Islam came in the Umayyad state through Salih ibn Mansur al-Himyari, who built Nekour — they embraced the Idrisid da'wa with famous resorts and stations, were proverbial in Ibn Khaldun's day for sorcery and soothsaying, and counted Banu Razin and Banu Wursikh among their great clans, holding their mountains under successive Maghreb kings into his own time."
  es: "Los ghumaras, tribu bereber de las montañas de ghumara y del Rif entre Tánger y Malwiyya; su Islam llegó al estado omeya a través de Salih ibn Mansur al-Himyari, quien construyó Nekour; adoptaron la da'wa idrisí con famosos balnearios y estaciones, eran proverbiales en la época de Ibn Khaldun por la hechicería y la adivinación, y contaban con los Banu Razin y los Banu Wursikh entre sus grandes clanes, manteniendo sus montañas bajo sucesivos reyes del Magreb hasta su propia época."
  fr: "Les Ghumara, tribu berbère des monts Ghumara et du Rif entre Tanger et la Malwiyya; leur islam est arrivé dans l'État omeyyade par l'intermédiaire de Salih ibn Mansur al-Himyari, qui a construit Nekour — ils ont embrassé la da'wa idrisside avec des stations et des lieux de villégiature célèbres, étaient proverbiaux à l'époque d'Ibn Khaldun pour la sorcellerie et la divination, et comptaient les Banu Razin et les Banu Wursikh parmi leurs grands clans, conservant leurs montagnes sous les rois successifs du Maghreb jusqu'à son époque."
  ur: "گھمارہ، گھمارا پہاڑوں کا بربر قبیلہ اور تانگیر اور مالویہ کے درمیان رف؛ ان کا اسلام اموی ریاست میں صالح بن منصور الحمیری کے ذریعے آیا، جس نے نیکور کو تعمیر کیا - انہوں نے مشہور ریزورٹس اور سٹیشنوں کے ساتھ ادریسی دعوت کو قبول کیا، ابن خلدون کے زمانے میں جادو ٹونے اور کاہنیوں کے لیے کہاوت تھی، اور بنو رزین اور بنو ورشیخ کو اپنے پہاڑوں کے ماتحت اپنے عظیم حکمرانوں میں شمار کرتے تھے۔ اپنا وقت."
