label:
  ar: مغراوة
  en: Maghrawa
summary:
  ar: "مغراوة من زناتة، من أعظم قبائل الطبقة الأولى بالمغرب؛ رأسهم آل خزر وهم محمد بن خزر داعية الناصر وأخوه معبد وابنه الخير، أولياء الدولة الأموية بالمغرب حتى أجهز بلكين بن زيري على الخير سنة 361هـ ودوّخ زناتة، ثم اجتمع ملكهم إلى آل زيري بن عطيّة فمهّد دولة فاس على طاعة المنصور بن أبي عامر إلى أن قضت عليها دولة المرابطين."
  en: "Maghrawa of the Zanata, among the greatest tribes of the first tier in the Maghreb; their chiefs were the house of Khazir — Muhammad ibn Khazir, al-Nasir's propagandist, his brother Ma'bad and son al-Khayr, Umayyad clients until Buluggin ibn Ziri destroyed al-Khayr in 361 and crushed Zanata — then their kingship gathered to the house of Ziri ibn Atiyya, who founded the state of Fez in obedience to al-Mansur Ibn Abi Amir until the Almoravid state ended them."
