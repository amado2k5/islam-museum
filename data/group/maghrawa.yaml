summary:
  ar: "مغراوة من زناتة، من أعظم قبائل الطبقة الأولى بالمغرب؛ رأسهم آل خزر وهم محمد بن خزر داعية الناصر وأخوه معبد وابنه الخير، أولياء الدولة الأموية بالمغرب حتى أجهز بلكين بن زيري على الخير سنة 361هـ ودوّخ زناتة، ثم اجتمع ملكهم إلى آل زيري بن عطيّة فمهّد دولة فاس على طاعة المنصور بن أبي عامر إلى أن قضت عليها دولة المرابطين."
  en: "Maghrawa of the Zanata, among the greatest tribes of the first tier in the Maghreb; their chiefs were the house of Khazir — Muhammad ibn Khazir, al-Nasir's propagandist, his brother Ma'bad and son al-Khayr, Umayyad clients until Buluggin ibn Ziri destroyed al-Khayr in 361 and crushed Zanata — then their kingship gathered to the house of Ziri ibn Atiyya, who founded the state of Fez in obedience to al-Mansur Ibn Abi Amir until the Almoravid state ended them."
  es: "Maghrawa de Zanata, una de las tribus más importantes del primer nivel del Magreb; sus jefes eran la casa de Khazir: Muhammad ibn Khazir, propagandista de al-Nasir, su hermano Ma'bad y su hijo al-Khayr, clientes de los Omeyas hasta que Buluggin ibn Ziri destruyó a al-Khayr en 361 y aplastó a Zanata; luego su reino se reunió en la casa de Ziri ibn Atiyya, quien fundó el estado de Fez en obediencia a al-Mansur Ibn Abi Amir hasta que el estado almorávide acabó con ellos."
  fr: "Les Maghrawa de Zanata, parmi les plus grandes tribus du premier rang du Maghreb; leurs chefs étaient la maison de Khazir — Muhammad ibn Khazir, propagandiste d'al-Nasir, son frère Ma'bad et son fils al-Khayr, clients des Omeyyades jusqu'à ce que Buluggin ibn Ziri détruise al-Khayr en 361 et écrase les Zanata — puis leur royauté s'est concentrée dans la maison de Ziri ibn Atiyya, qui a fondé l'État de Fès en obéissance à al-Mansur Ibn Abi Amir jusqu'à ce que l'État almoravide les anéantisse."
  ur: "مغرب میں پہلے درجے کے عظیم ترین قبائل میں سے زناتا کا مغروا؛ ان کے سردار خضر کے گھر تھے - محمد بن خضیر، النصیر کا پروپیگنڈہ کرنے والا، اس کا بھائی معبد اور بیٹا الخیر، اموی مؤکل تھے یہاں تک کہ بلوگین ابن زری نے 361 میں الخیر کو تباہ کر دیا اور زانت کو کچل ڈالا - پھر ان کی بادشاہی زیری کے گھر میں جمع ہوئی جو کہ ریاست فزینس میں واقع ہے۔ المنصور ابن ابی عامر یہاں تک کہ الموراوی ریاست نے ان کا خاتمہ کیا۔"
  tr: "Fas'ın en büyük birinci sınıf kabilelerinden biri olan Zenata'dan Maghrawa kabilesinin liderleri, Hazar ailesinden, yani Al-Nasir'in vaizi Muhammed bin Hazar, kardeşi Ma'bad ve oğlu Al-Khair'den oluşmaktadır. Bu aile, Buluggin bin Ziri'nin Hicri 361 yılında Al-Khair'i öldürüp Zenata'yı ele geçirmesine kadar Fas'taki Emevi devletinin koruyucularıydı. Daha sonra kralları Ziri bin Atiya ailesine katıldı ve Al-Mansur bin Abi Aamir'in emriyle Fez devletini kurdu; ta ki Almoravid devleti tarafından ortadan kaldırılana kadar."
  id: "Maghrawa dari Zenata, salah satu suku terbesar kelas satu di Maroko; pemimpin mereka adalah keluarga Khazar, yaitu Muhammad bin Khazar, pendakwah Al-Nasir, saudaranya Ma’bad, dan putranya Al-Khair, para penjaga negara Umayyah di Maroko hingga Buluggin bin Ziri membunuh Al-Khair pada tahun 361 H dan menaklukkan Zenata. Kemudian raja mereka bergabung dengan keluarga Ziri bin Atiya dan mendirikan negara Fez di bawah ketaatan Al-Mansur bin Abi Aamir hingga negara Almoravid menghancurkannya."
