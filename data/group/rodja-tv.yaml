summary:
  ar: "قناة تلفزيونية دعوية إندونيسية انطلقت سنة 2009 من شبكة راديو رودجا في تشيلونغسي ببوغور، وتديرها مؤسسة جاهايا سنة؛ بدأت الشبكة إذاعةً مجتمعية سنة 2005 ثم على 756 AM سنة 2007، وتبث رودجا تي في عبر الإنترنت والقمر الصناعي، واسمها اختصار «إذاعة دعوة أهل السنة والجماعة»."
  en: "An Indonesian dawah television channel launched in 2009 from the Radio Rodja network in Cileungsi, Bogor, and run by the Cahaya Sunnah foundation; the network began as a community radio station in 2005 and on 756 AM in 2007, and Rodja TV broadcasts online and by satellite. Its name abbreviates Radio Dakwah Ahlussunnah wal Jamaah, 'the dawah radio of the People of the Sunna and the Community'."
  ur: "روجا ٹی وی انڈونیشیا کا دعوتی ٹیلی ویژن چینل ہے جو 2009ء میں بوگور کے چیلونگسی میں قائم ریڈیو روجا نیٹ ورک سے شروع ہوا اور اسے جاہایا سنہ فاؤنڈیشن چلاتی ہے؛ یہ نیٹ ورک 2005ء میں کمیونٹی ریڈیو کے طور پر شروع ہوا، 2007ء میں 756 AM پر آیا، اور روجا ٹی وی انٹرنیٹ اور سیٹلائٹ پر نشر ہوتا ہے۔ اس کا نام «ریڈیو دعوۃ اہل السنۃ والجماعۃ» کا اختصار ہے۔"
founded: { edtf: "2009", calendar: gregorian, precision: year, status: historical, note: "Rodja TV launched in 2009 as the television arm of Radio Rodja, streaming over the internet; satellite broadcasts followed in 2011. The parent station began as a community FM radio in Cileungsi, Bogor, with experimental broadcasts in early 2005 and was officially launched on 756 AM in 2007. The network is run by Yayasan Cahaya Sunnah from its studio complex on Jalan Pahlawan, Kampung Tengah, Cileungsi, beside Masjid Al-Barkah.", sources: [source/appkk-radio-rodja-overview] }
