label:
  ar: "مجمع الملك سلمان العالمي للغة العربية"
  en: "King Salman Global Academy for the Arabic Language"
  ur: "شاہ سلمان عالمی مجمعِ عربی زبان"
  fr: "Académie mondiale du roi Salmane pour la langue arabe"
  es: "Academia Mundial Rey Salmán de la Lengua Árabe"
  tr: "Kral Salman Küresel Arap Dili Akademisi"
