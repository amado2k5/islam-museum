summary:
  ar: "مجمع الملك سلمان العالمي للغة العربية في الرياض، أُنشئ سنة 2020 بقرار مجلس الوزراء رقم 34 وتاريخ 13 / 1 / 1442هـ نحو 1 سبتمبر 2020، مرجع وطني ودولي في سياسات اللغة العربية وتخطيطها، له أدوات لغوية حاسوبية ومدونات وقاموس الرياض للغة العربية المعاصرة ومكتبة رقمية وبرامج واختبارات تعليمية وشراكات مع الألكسو، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:ksaa-gov-sa} {cite:alecso-org}."
  en: "The King Salman Global Academy for the Arabic Language in Riyadh, founded in 2020 by Council of Ministers decree No. 34 of 13/01/1442 AH, about 1 September 2020, a national and international reference for Arabic language policy and planning, with computational linguistics tools and corpora, the Riyadh Dictionary of Contemporary Arabic, a digital library, educational programmes and tests, and partnerships with ALECSO, as a research file supplied to the museum summarises it {cite:ksaa-gov-sa} {cite:alecso-org}."
  ur: "شاہ سلمان عالمی مجمعِ عربی زبان، ریاض میں، جو 2020 میں کابینہ کے فیصلہ نمبر 34 مورخہ 13/01/1442ھ، یعنی تقریباً 1 ستمبر 2020، سے قائم ہوا، عربی زبان کی پالیسی اور منصوبہ بندی میں قومی اور بین الاقوامی حوالہ ہے، جس کے پاس کمپیوٹیشنل لسانیات کے اوزار اور لسانی ذخائر، ریاض کی لغتِ معاصر عربی، ایک ڈیجیٹل لائبریری، تعلیمی پروگرام اور امتحانات، اور الیکسو کے ساتھ شراکتیں ہیں، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اسے خلاصہ کرتی ہے {cite:ksaa-gov-sa} {cite:alecso-org}۔"
  fr: "L'Académie mondiale du roi Salmane pour la langue arabe, à Riyad, fondée en 2020 par la décision n° 34 du Conseil des ministres du 13/01/1442 de l'Hégire, soit vers le 1er septembre 2020, référence nationale et internationale pour la politique et la planification de la langue arabe, dotée d'outils de linguistique computationnelle et de corpus, du Dictionnaire de Riyad de l'arabe contemporain, d'une bibliothèque numérique, de programmes éducatifs et de tests, et de partenariats avec l'ALECSO, comme le résume un dossier de recherche remis au musée {cite:ksaa-gov-sa} {cite:alecso-org}."
  es: "La Academia Mundial Rey Salmán de la Lengua Árabe, en Riad, fundada en 2020 por la decisión n.º 34 del Consejo de Ministros del 13/01/1442 de la Hégira, hacia el 1 de septiembre de 2020, referencia nacional e internacional de la política y la planificación de la lengua árabe, con herramientas de lingüística computacional y corpus, el Diccionario de Riad del árabe contemporáneo, una biblioteca digital, programas educativos y pruebas, y alianzas con la ALECSO, según lo resume un expediente de investigación entregado al museo {cite:ksaa-gov-sa} {cite:alecso-org}."
  tr: "Riyad'daki Kral Salman Küresel Arap Dili Akademisi, 1 Eylül 2020 tarihine denk gelen 13/1/1442 Hicri tarihli 34 numaralı Bakanlar Kurulu Kararı ile 2020 yılında kurulmuştur. Arap dili politikaları ve planlamasında ulusal ve uluslararası bir referans noktası olup, bilgisayar tabanlı dilbilim araçlarına, veri tabanlarına, Riyad Çağdaş Arapça Sözlüğü'ne, dijital kütüphaneye, eğitim programlarına ve testlerine ve ALECSO ile ortaklıklara sahiptir; bu bilgiler müzeye sunulan bir araştırma dosyasında özetlenmiştir {cite:ksaa-gov-sa} {cite:alecso-org}."
  id: "Akademi Bahasa Arab Global Raja Salman di Riyadh didirikan pada tahun 2020 berdasarkan Keputusan Kabinet No. 34 tanggal 13/1/1442 H, yang bertepatan dengan 1 September 2020. Akademi ini merupakan lembaga rujukan nasional dan internasional dalam kebijakan dan perencanaan bahasa Arab, dan memiliki perangkat linguistik berbasis komputer, korpus, Kamus Bahasa Arab Kontemporer Riyadh, perpustakaan digital, program dan tes pendidikan, serta kemitraan dengan ALECSO, sebagaimana dirangkum dalam berkas penelitian yang diserahkan ke museum {cite:ksaa-gov-sa} {cite:alecso-org}."
