label: { ar: "قحطان ⁦(العرب العاربة)⁩", en: "Qahtan (the Original Arabs)", es: "Qahtan (los árabes originales)", fr: "Qahtan (les Arabes originaux)", ur: "قحطان ⁦(اصل عرب)⁩", tr: "Kahtan (asıl Araplar)", id: "Qahtan (orang Arab asli)" }
summary:
  ar: "السلالة التي تسمى العرب العاربة: المنحدرون من يعرب بن يشجب بن قحطان، ومهدها بلاد اليمن، وأشهر بطونها حمير وكهلان."
  en: "The lineage called the Original Arabs: descendants of Yaʾrub ibn Yashjub ibn Qahtan, based in Yemen, whose best-known branches are Himyar and Kahlan."
  es: "El linaje conocido como los árabes originales: descendientes de Yaʾrub ibn Yashjub ibn Qahtan, asentados en Yemen, cuyas ramas más conocidas son Himyar y Kahlan."
  fr: "La lignée appelée les Arabes originaux: descendants de Yaʾrub ibn Yashjub ibn Qahtan, établis au Yémen, dont les branches les plus connues sont Himyar et Kahlan."
  ur: "نسب کو اصل عرب کہا جاتا ہے: یمن میں مقیم یعرب ابن یشجب ابن قحطان کی اولاد، جن کی مشہور شاخیں حمیار اور کہلان ہیں۔"
  tr: "Saf Araplar olarak adlandırılan soy, Ya'rub bin Yashjub bin Qahtan'ın soyundan gelir ve kökeni Yemen topraklarıdır; en ünlü kolları ise Himyar ve Kahlan'dır."
  id: "Garis keturunan yang disebut Arab Murni: mereka yang merupakan keturunan Ya'rub bin Yashjub bin Qahtan, dan tempat asalnya adalah tanah Yaman, dan cabang-cabangnya yang paling terkenal adalah Himyar dan Kahlan."
