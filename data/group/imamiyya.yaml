label: { ar: "الإمامية", en: "Imamiyya", es: "Imamiyya", fr: "Imamiyya", ur: "امامیہ", tr: "İmamiyye", id: "Imamiyyah" }
summary:
  ar: "الإمامية أحد مذهبي التشيع الكبيرين الباقيين إلى اليوم مع الزيدية {cite:duha-islam p. 848}؛ وأهم فرقهم الاثناعشرية التي سُميت لقولها باثني عشر إماماً، وهي مذهب الدولة الرسمي في إيران في عصر أحمد أمين، ويبلغون نحو سبعة ملايين في فارس ومليون ونصف في العراق وخمسة ملايين في الهند {cite:duha-islam p. 849-850}. ومن الإمامية من قال إن الإمامة بعد جعفر الصادق انتقلت إلى إسماعيل ابنه لا إلى موسى الكاظم فسمُّوا الإسماعيلية، وقالوا بعد إسماعيل أتت أئمة مستورة لأن الإمام يجوز له أن يستتر إذا لم تكن له شوكة، وظل الأئمة يتداولون الإمامة في ستر إلى أن جاء عبيد الله المهدي رأس الدولة الفاطمية فأظهر الدعوة؛ وقيل سموا الباطنية لقولهم بأن لكل ظاهر باطناً ولكل تنزيل تأويلاً {cite:duha-islam p. 850-851}. وللشيعة خلاف طويل في الفقه: ينكرون العَوْل في الميراث ويذهبون مذهب ابن عباس في تقديم بعض الورثة على بعض، ويقدمون القرابة على العصبة فيروون عن الصادق «المال للأقرب والعصبة في فيه التراب»، ويقولون إن ابن العم الشقيق مقدم على العم لأب — وهو ما يقدم علياً في إرث النبي على العباس — ولا يورّثون النساء من الأرض والعقار، ويقولون إن الأنبياء يُورَثون خلافاً لأهل السنة المتعلقين بحديث «نحن معاشر الأنبياء لا نورث»؛ ولهم خلاف في صيغة الأذان كزيادة «حي على خير العمل» {cite:duha-islam p. 885-887}."
  en: "The Imamiyya — with the Zaydiyya one of the two surviving branches of Shi'ism; its chief division the Twelvers, and the Ismailis the branch tracing imamate through Isma'il to the hidden imams and the Fatimid da'wa {cite:duha-islam p. 848-851}."
  es: "La Imamiyya — con la Zaydiyya una de las dos ramas supervivientes del chiismo; su división principal son los Duodecimanos, y los Ismailíes la rama que rastrea el imamato a través de Isma'il hasta los imanes ocultos y la da'wa fatimí {cite:duha-islam p. 848-851}."
  fr: "L'Imamiyya — avec les Zaydiyya, l'une des deux branches survivantes du chiisme; sa principale division étant les Douze, et les Ismaéliens, la branche qui fait remonter l'imamat à travers Isma'il jusqu'aux imams cachés et à la da'wa fatimide {cite:duha-islam p. 848-851}."
  ur: "امامیہ - زیدیہ کے ساتھ شیعہ مذہب کی دو زندہ شاخوں میں سے ایک؛ اس کی مرکزی تقسیم بارہیوں اور اسماعیلیوں کی شاخ ہے جو اسماعیل کے ذریعے پوشیدہ ائمہ اور فاطمی دعوت تک امامت کا پتہ لگاتی ہے۔ 848-851}۔"
  tr: "İmamiyye, Zeydiyye ile birlikte günümüze kadar varlığını sürdüren iki büyük Şii mezhebinden biridir. En önemli mezhepleri, on iki imama inanmaları nedeniyle On İki İmam Şiiliği olarak adlandırılan mezheptir. Bu mezhep, Ahmed Amin döneminde İran'da resmi devlet diniydi ve takipçilerinin sayısı İran'da yaklaşık yedi milyon, Irak'ta bir buçuk milyon ve Hindistan'da beş milyon civarındaydı. Bazı İmamiyye mensupları, Cafer el-Sadık'tan sonra imamlığın Musa el-Kadim'e değil, oğlu İsmail'e geçtiğini savunmuş ve bu nedenle İsmailîler olarak adlandırılmışlardır. İsmail'den sonra gizli imamların geldiğini, çünkü bir imamın gücü yoksa gizli kalmasının caiz olduğunu söylemişlerdir. İmamlar, Fatımi devletinin başı Ubeydullah el-Mehdi gelip çağrıyı kamuoyuna açıklayana kadar imamlığı gizlice devretmeye devam etmişlerdir. Ayrıca, her görünen anlamın gizli bir anlamı olduğuna ve her vahyin bir yorumu olduğuna inandıkları için onlara Batiniyye denildiği de söylenir. Şiiler arasında uzun süredir devam eden bir fıkıh anlaşmazlığı vardır: Mirasta \"evl\" kavramını reddederler ve bazı mirasçıların diğerlerinden önceliği konusunda İbn Abbas'ın görüşünü takip ederler; akrabalığa, Sadık'tan rivayet ettikleri gibi, \"Para en yakın akrabaya aittir, ataerkiller ise toprağa gömülmüştür\" diyerek, tam kuzenin oğlunun amcadan önce geldiğini söylerler - ki bu da Peygamberin mirasında Ali'nin Abbas'tan önce gelmesine neden olur - ve kadınlara toprak ve gayrimenkulden miras vermezler; ve Sünnilerin \"Biz, peygamberler ümmeti, miras bırakmayız\" hadisine bağlı kalmalarının aksine, peygamberlerin miras yoluyla geçtiğini söylerler. Ayrıca ezanın metninde, örneğin \"En güzel amellere gelin\" ifadesinin eklenmesi gibi konularda da görüş ayrılığı bulunmaktadır. {Kaynak: Duha-islam s. 885-887}"
  id: "Imamiyyah adalah salah satu dari dua mazhab Syiah utama yang masih ada hingga saat ini, bersama dengan Zaidiyyah. Sekte mereka yang paling penting adalah Syiah Dua Belas Imam, yang dinamakan demikian karena kepercayaan mereka pada dua belas imam. Ini adalah agama negara resmi di Iran pada masa Ahmad Amin, dan pengikut mereka berjumlah sekitar tujuh juta di Persia, satu setengah juta di Irak, dan lima juta di India. Beberapa Imamiyyah berpendapat bahwa imamah setelah Ja'far al-Sadiq diteruskan kepada putranya Isma'il, bukan kepada Musa al-Kadhim, dan karena itu mereka disebut Isma'iliyyah. Mereka mengatakan bahwa setelah Isma'il datang imam-imam tersembunyi, karena diperbolehkan bagi seorang imam untuk tetap tersembunyi jika ia kekurangan kekuasaan. Para imam terus meneruskan imamah secara rahasia hingga Ubayd Allah al-Mahdi, kepala negara Fatimiyah, datang dan mengumumkan seruan tersebut secara terbuka. Dikatakan juga bahwa mereka disebut Batiniyyah karena mereka percaya bahwa setiap makna yang tampak memiliki makna tersembunyi, dan setiap wahyu memiliki penafsiran. Kaum Syiah memiliki perbedaan pendapat yang sudah lama dalam bidang hukum Islam: mereka menolak konsep 'awl dalam warisan dan mengikuti pendapat Ibnu Abbas mengenai prioritas beberapa ahli waris atas yang lain, dan mereka mengutamakan hubungan kekerabatan daripada hubungan kekerabatan agnatik, sebagaimana mereka meriwayatkan dari al-Sadiq, \"Uang adalah untuk kerabat terdekat, dan kerabat agnatik berada di dalam debu,\" dan mereka mengatakan bahwa putra sepupu kandung lebih diutamakan daripada paman dari pihak ayah — yang menjadikan Ali lebih diutamakan daripada al-Abbas dalam warisan Nabi — dan mereka tidak memberikan warisan tanah dan properti kepada perempuan, dan mereka mengatakan bahwa para nabi diwarisi, bertentangan dengan kaum Sunni yang berpegang pada hadits, \"Kami, umat para nabi, tidak meninggalkan warisan\"; dan mereka memiliki perbedaan pendapat dalam redaksi azan, seperti penambahan \"Marilah kepada amal perbuatan yang sebaik-baiknya\" {kutip:duha-islam hlm. 885-887}."
