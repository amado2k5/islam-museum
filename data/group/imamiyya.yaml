label: { ar: "الإمامية" }
summary:
  ar: "الإمامية أحد مذهبي التشيع الكبيرين الباقيين إلى اليوم مع الزيدية {cite:duha-islam p. 848}؛ وأهم فرقهم الاثناعشرية التي سُميت لقولها باثني عشر إماماً، وهي مذهب الدولة الرسمي في إيران في عصر أحمد أمين، ويبلغون نحو سبعة ملايين في فارس ومليون ونصف في العراق وخمسة ملايين في الهند {cite:duha-islam p. 849-850}. ومن الإمامية من قال إن الإمامة بعد جعفر الصادق انتقلت إلى إسماعيل ابنه لا إلى موسى الكاظم فسمُّوا الإسماعيلية، وقالوا بعد إسماعيل أتت أئمة مستورة لأن الإمام يجوز له أن يستتر إذا لم تكن له شوكة، وظل الأئمة يتداولون الإمامة في ستر إلى أن جاء عبيد الله المهدي رأس الدولة الفاطمية فأظهر الدعوة؛ وقيل سموا الباطنية لقولهم بأن لكل ظاهر باطناً ولكل تنزيل تأويلاً {cite:duha-islam p. 850-851}. وللشيعة خلاف طويل في الفقه: ينكرون العَوْل في الميراث ويذهبون مذهب ابن عباس في تقديم بعض الورثة على بعض، ويقدمون القرابة على العصبة فيروون عن الصادق «المال للأقرب والعصبة في فيه التراب»، ويقولون إن ابن العم الشقيق مقدم على العم لأب — وهو ما يقدم علياً في إرث النبي على العباس — ولا يورّثون النساء من الأرض والعقار، ويقولون إن الأنبياء يُورَثون خلافاً لأهل السنة المتعلقين بحديث «نحن معاشر الأنبياء لا نورث»؛ ولهم خلاف في صيغة الأذان كزيادة «حي على خير العمل» {cite:duha-islam p. 885-887}."
  en: "The Imamiyya — with the Zaydiyya one of the two surviving branches of Shi'ism; its chief division the Twelvers, and the Ismailis the branch tracing imamate through Isma'il to the hidden imams and the Fatimid da'wa {cite:duha-islam p. 848-851}."
