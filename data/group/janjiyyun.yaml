  ar: "الجنجيين أصحاب جنجي الجوخاني الذي كان يعبد الأصنام ويضرب الزنجليج في بيت الوثن فترك ذلك وابتدع مذهبا: أن شيئا كان قبل النور والظلمة وفي الظلمة صورتان ذكر وأنثى، ظهر للأنثى نور فسرقت منه وخلقت منه السماء والجبال والأرض، ويزعمون أن النار ملكة العالم {cite:fihrist-ibn-al-nadim p. 475}."
