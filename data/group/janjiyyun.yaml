label: { ar: "الجنجيين", en: "Janjiyyun", es: "Janjiyyun", fr: "Janjiyyun", ur: "جنجیون", tr: "Janjiyin", id: "Janjiyin" }
summary:
  ar: "الجنجيين أصحاب جنجي الجوخاني الذي كان يعبد الأصنام ويضرب الزنجليج في بيت الوثن فترك ذلك وابتدع مذهبا: أن شيئا كان قبل النور والظلمة وفي الظلمة صورتان ذكر وأنثى، ظهر للأنثى نور فسرقت منه وخلقت منه السماء والجبال والأرض، ويزعمون أن النار ملكة العالم {cite:fihrist-ibn-al-nadim p. 475}."
  en: "Followers of Janji al-Jukhani — a pre-dualist third thing, and fire as queen of the world {cite:fihrist-ibn-al-nadim}"
  es: "Seguidores de Janji al-Jukhani: una tercera cosa predualista y el fuego como reina del mundo {cite:fihrist-ibn-al-nadim}"
  fr: "Les adeptes de Janji al-Jukhani — une troisième chose pré-dualiste, et le feu comme reine du monde {cite:fihrist-ibn-al-nadim}"
  ur: "جنجی الجوخانی کے پیروکار - پہلے سے دوہری تیسری چیز، اور دنیا کی ملکہ کے طور پر آگ"
  tr: "Janjiler, putlara tapan ve put evinde zencalic döven Janji el-Jawkhani'nin takipçileridir. O, bu uygulamayı terk ederek bir öğreti ortaya koymuştur: Işık ve karanlıktan önce bir şey vardı ve karanlıkta erkek ve kadın olmak üzere iki biçim vardı. Kadına ışık göründü, o da ışıktan çaldı ve gökleri, dağları ve yeri yarattı. Ateşin dünyanın kraliçesi olduğunu iddia ederler. {cite:fihrist-ibn-al-nadim s. 475}"
  id: "Kaum Janji adalah pengikut Janji al-Jawkhani, yang dulu menyembah berhala dan memukuli kaum Zanjalij di rumah berhala. Ia meninggalkan hal itu dan menciptakan doktrin baru: bahwa sesuatu telah ada sebelum cahaya dan kegelapan, dan dalam kegelapan terdapat dua bentuk, laki-laki dan perempuan. Cahaya muncul pada perempuan, lalu ia mengambil dari cahaya itu dan menciptakan langit, gunung, dan bumi. Mereka mengklaim bahwa api adalah ratu dunia. {cite:fihrist-ibn-al-nadim p. 475}"
