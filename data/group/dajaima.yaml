label: { ar: "الضجاعمة ⁦(بنو سليح)⁩", en: "The Daja'ima (Banu Salih)", es: "Los Daja'ima (Banu Salih)", fr: "Les Daja'ima (Banu Salih)", ur: "دجاعمہ ⁦(بنو صالح)⁩" }
summary:
  ar: "بنو ضجعم بن سليح بن حلوان من قضاعة، بطون نزلت مشارف الشام في عهد الهجرات فاصطنعهم الرومان ليمنعوا عرب البرية من العبث وليكونوا عدة ضد الفرس، وولّوا منهم ملكاً تعاقب الملك فيهم سنين؛ من أشهر ملوكهم زياد بن الهبولة، وزمنهم من أوائل القرن الثاني الميلادي إلى نهايته تقريباً، وانتهت ولايتهم بغلبة آل غسان."
  en: "Banu Dajam ibn Salih ibn Hulwan of Quda'a, who settled the Syrian marches in the age of migrations and were set up by the Romans as kings to hold back the desert Arabs and serve against Persia; Ziyad ibn al-Habula was their most famous king, their era runs from the early second century CE to about its end, and the Ghassanids displaced them."
  es: "Los Banu Dajam ibn Salih ibn Hulwan de Quda'a, que se asentaron en las marcas sirias en la época de las migraciones y fueron erigidos por los romanos como reyes para contener a los árabes del desierto y luchar contra Persia; Ziyad ibn al-Habula fue su rey más famoso, su era abarca desde principios del siglo II d. C. hasta aproximadamente su final, y los gasánidas los desplazaron."
  fr: "Les Banu Dajam ibn Salih ibn Hulwan de Quda'a, qui s'établirent dans les marches syriennes à l'époque des migrations et furent établis par les Romains comme rois pour contenir les Arabes du désert et lutter contre la Perse; Ziyad ibn al-Habula fut leur roi le plus célèbre, leur règne s'étend du début du IIe siècle de notre ère jusqu'à sa fin, et les Ghassanides les ont remplacés."
  ur: "قدعہ کے بنو دجام بن صالح بن حلوان، جنہوں نے ہجرت کے زمانے میں شام کے مارچوں کو طے کیا اور رومیوں نے صحرائی عربوں کو روکنے اور فارس کے خلاف خدمت کرنے کے لیے بادشاہوں کے طور پر مقرر کیا تھا۔ زیاد ابن الحبولہ ان کا سب سے مشہور بادشاہ تھا، ان کا دور دوسری صدی عیسوی کے اوائل سے اپنے اختتام تک چلتا ہے، اور غسانیوں نے انہیں بے گھر کر دیا۔"
