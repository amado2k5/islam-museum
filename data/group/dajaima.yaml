label: { ar: "الضجاعمة (بنو سليح)", en: "The Daja'ima (Banu Salih)" }
summary:
  ar: "بنو ضجعم بن سليح بن حلوان من قضاعة، بطون نزلت مشارف الشام في عهد الهجرات فاصطنعهم الرومان ليمنعوا عرب البرية من العبث وليكونوا عدة ضد الفرس، وولّوا منهم ملكاً تعاقب الملك فيهم سنين؛ من أشهر ملوكهم زياد بن الهبولة، وزمنهم من أوائل القرن الثاني الميلادي إلى نهايته تقريباً، وانتهت ولايتهم بغلبة آل غسان."
  en: "Banu Dajam ibn Salih ibn Hulwan of Quda'a, who settled the Syrian marches in the age of migrations and were set up by the Romans as kings to hold back the desert Arabs and serve against Persia; Ziyad ibn al-Habula was their most famous king, their era runs from the early second century CE to about its end, and the Ghassanids displaced them."
