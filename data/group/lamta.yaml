summary:
  ar: "لمطة من بطون صنهاجة الملثمين؛ من إخوة لمتونة وجدالة وكدالة، مواطنهم القفر الجنوبي بين سجلماسة وبلاد السودان، وكانوا مع أبناء عمومتهم أهل الطرق والمحامل بين الصحراء والمغرب، وانقادوا في أجيال لدول الملثمين والمرابطين."
  en: "Lamta of the Sanhaja veil-wearers; brothers of Lamtuna, Jadala and Guddala, their homeland the southern waste between Sijilmasa and the Sudan lands — masters of the desert roads and camel-litters between the Sahara and the Maghreb, drawn in their generations into the veiled ones' states and the Almoravids."
