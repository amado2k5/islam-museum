summary:
  ar: "لمطة من بطون صنهاجة الملثمين؛ من إخوة لمتونة وجدالة وكدالة، مواطنهم القفر الجنوبي بين سجلماسة وبلاد السودان، وكانوا مع أبناء عمومتهم أهل الطرق والمحامل بين الصحراء والمغرب، وانقادوا في أجيال لدول الملثمين والمرابطين."
  en: "Lamta of the Sanhaja veil-wearers; brothers of Lamtuna, Jadala and Guddala, their homeland the southern waste between Sijilmasa and the Sudan lands — masters of the desert roads and camel-litters between the Sahara and the Maghreb, drawn in their generations into the veiled ones' states and the Almoravids."
  es: "Lamta, de la tribu Sanhaja, portadores de velo; hermanos de Lamtuna, Jadala y Guddala, cuya tierra natal es el desierto meridional entre Sijilmasa y Sudán; maestros de los caminos del desierto y de las literas de camello entre el Sáhara y el Magreb, atraídos en sus generaciones por los estados de los velados y los almorávides."
  fr: "Lamta des Sanhaja, les femmes voilées; frères de Lamtuna, Jadala et Guddala, leur patrie étant le désert du sud entre Sijilmasa et les terres du Soudan — maîtres des routes du désert et des caravanes de chameaux entre le Sahara et le Maghreb, entraînés de génération en génération dans les États des femmes voilées et les Almoravides."
