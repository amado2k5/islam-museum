summary:
  ar: "بطن من بني تميم: دارم بن مالك بن حنظلة بن مالك بن زيد مناة بن تميم؛ منهم عطارد بن حاجب والأقرع بن حابس والحتات بن يزيد من وفد بني تميم سنة 9هـ، وبهم فخر الزبرقان: «ليس في أرض الحجاز كدارم»، وإليهم وجّه حسان نهيه عن الفخر."
  en: "A clan of Banu Tamim: Darim ibn Malik ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim; Utarid ibn Hajib, al-Aqra' ibn Habis and al-Hutat ibn Yazid of the 9 AH delegation belonged to it; al-Zibriqan boasted that none in the Hijaz equalled Darim, and Hassan addressed his rebuke to them."
