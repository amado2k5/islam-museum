summary:
  ar: "بطن من بني تميم: دارم بن مالك بن حنظلة بن مالك بن زيد مناة بن تميم؛ منهم عطارد بن حاجب والأقرع بن حابس والحتات بن يزيد من وفد بني تميم سنة 9هـ، وبهم فخر الزبرقان: «ليس في أرض الحجاز كدارم»، وإليهم وجّه حسان نهيه عن الفخر."
  en: "A clan of Banu Tamim: Darim ibn Malik ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim; Utarid ibn Hajib, al-Aqra' ibn Habis and al-Hutat ibn Yazid of the 9 AH delegation belonged to it; al-Zibriqan boasted that none in the Hijaz equalled Darim, and Hassan addressed his rebuke to them."
  es: "Un clan de Banu Tamim: Darim ibn Malik ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim; A ella pertenecían Utarid ibn Hajib, al-Aqra' ibn Habis y al-Hutat ibn Yazid de la delegación del 9 AH; al-Zibriqan se jactaba de que nadie en el Hijaz igualaba a Darim, y Hassan les dirigió su reprimenda."
  fr: "Un clan de Banu Tamim: Darim ibn Malik ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim; Utarid ibn Hajib, al-Aqra' ibn Habis et al-Hutat ibn Yazid de la délégation 9 AH en faisaient partie; al-Zibriqan s'est vanté qu'aucun dans le Hijaz n'égalait Darim, et Hassan leur a adressé ses réprimandes."
