summary:
  ar: "كدالة من بطون صنهاجة الملثمين؛ مواطنهم القفر الجنوبي من بلاد السودان إلى ما يواجه بلاد مكناسة ودرعة، وكانوا في أول الإسلام ملوكاً على السودان في بعض الزمان وهم أقرب بطون الملثمين إلى بلاد الإسلام، ومنهم ومن لمطونة وجدالة تألفت الدعوة الأولى للمرابطين على يد عبد الله بن ياسين ويحيى بن إبراهيم الجدالي."
  en: "Guddala of the Sanhaja veil-wearers; their homeland the southern waste from the Sudan lands facing Miknasa and Dra'a — for a while kings over the Sudan in early Islam and the nearest of the veiled tribes to the settled lands; with Lamtuna and Jadala they formed the Almoravids' first da'wa under Abdallah ibn Yasin and Yahya ibn Ibrahim al-Jadali."
  es: "Guddala, de las sanhaja que portaban velo; su tierra natal eran las tierras desérticas del sur de Sudán, frente a Miknasa y Dra'a; durante un tiempo fueron reyes de Sudán en los inicios del Islam y la tribu velada más cercana a las tierras habitadas; junto con Lamtuna y Jadala formaron la primera da'wa de los almorávides bajo el liderazgo de Abdallah ibn Yasin y Yahya ibn Ibrahim al-Jadali."
  fr: "Guddala, des Sanhaja, porteuses du voile; leur patrie était le désert méridional des terres du Soudan, face à Miknasa et Dra'a — ils furent un temps rois du Soudan au début de l'Islam et les tribus voilées les plus proches des terres sédentaires; avec Lamtuna et Jadala, ils formèrent la première da'wa des Almoravides sous Abdallah ibn Yasin et Yahya ibn Ibrahim al-Jadali."
