  ar: كدالة
  en: Guddala
summary:
  ar: "كدالة من بطون صنهاجة الملثمين؛ مواطنهم القفر الجنوبي من بلاد السودان إلى ما يواجه بلاد مكناسة ودرعة، وكانوا في أول الإسلام ملوكاً على السودان في بعض الزمان وهم أقرب بطون الملثمين إلى بلاد الإسلام، ومنهم ومن لمطونة وجدالة تألفت الدعوة الأولى للمرابطين على يد عبد الله بن ياسين ويحيى بن إبراهيم الجدالي."
  en: "Guddala of the Sanhaja veil-wearers; their homeland the southern waste from the Sudan lands facing Miknasa and Dra'a — for a while kings over the Sudan in early Islam and the nearest of the veiled tribes to the settled lands; with Lamtuna and Jadala they formed the Almoravids' first da'wa under Abdallah ibn Yasin and Yahya ibn Ibrahim al-Jadali."
