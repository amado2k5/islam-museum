id: group/janissaries
class: group
kind: army
label:
  ar: "فيلق الينيچري ⁦(الجيش الجديد)⁩"
  en: "The Janissary corps (Yeniçeri)"
  es: "El cuerpo de jenízaros (Yeniçeri)"
  fr: "Le corps des janissaires (Yeniçeri)"
  ur: "جنیسری کور (Yeniçeri)"
  tr: "Yenegri Kolordusu (Yeni Ordu)"
  id: "Korps Yenegri (Tentara Baru)"
summary:
  ar: "الجيش النظامي الجديد الذي يذكر الصلابي أن السلطان أورخان أنشأه باقتراح أخيه علاء الدين بن عثمان، وأن فكرته قامت على تربية الأسرى والمسبيين تربية إسلامية وتدريبهم على الحرب، فسُمّي الجيش الجديد «الينيچري». ويذكر الكتاب أن أورخان نظّم الجيش في عشرات ومئات وألوف وخصّص خمس الغنائم له وأنشأ مراكز للتدريب، وأن علاء الدين وأورخان اتفقا على أن الهدف من التشكيل الجديد بناء قوة نظامية دائمة {cite:dawlat-uthmaniyya-salabi p. 53-55}. ويصرّ المؤلف على أن التصور الشائع لنظام «الدثرمة» — أي جمع أبناء النصارى بالإكراه وإسلامهم قسراً — «كذبة دُسّت على تاريخ أورخان ومراد»، وأن أورخان لم ينتزع غلاماً نصرانياً واحداً من بيت أبيه — وهذا دفاع المؤلف وموقفه لا إجماع المؤرخين {cite:dawlat-uthmaniyya-salabi p. 53-55}."
  en: "The 'new army' (Yeniçeri) that al-Sallabi says Orhan founded on his brother Alaeddin's proposal — a standing corps raised from captives given Islamic training, organized in tens, hundreds and thousands with a fifth of spoils assigned to it and dedicated training centres {cite:dawlat-uthmaniyya-salabi p. 53-55}. The author insists the familiar devşirme picture — Christian boys forcibly levied and converted — is 'a lie planted in Orhan's and Murad's history'; that is the author's apologetic position, not a consensus of historians {cite:dawlat-uthmaniyya-salabi p. 53-55}."
  es: "El «nuevo ejército» (Yeniçeri) que, según al-Sallabi, Orhan fundó a propuesta de su hermano Alaeddin, era un cuerpo permanente formado por cautivos que recibían formación islámica, organizado en decenas, cientos y miles, con una quinta parte del botín asignada y centros de entrenamiento específicos {cite:dawlat-uthmaniyya-salabi p. 53-55}. El autor insiste en que la conocida imagen de los devşirme —jóvenes cristianos reclutados a la fuerza y convertidos— es «una mentira sembrada en la historia de Orhan y Murad»; esta es la postura apologética del autor, no un consenso entre los historiadores {cite:dawlat-uthmaniyya-salabi p. 53-55}."
  fr: "La « nouvelle armée » (Yeniçeri) qu'al-Sallabi affirme avoir été fondée par Orhan sur la proposition de son frère Alaeddin – un corps permanent composé de captifs ayant reçu une formation islamique, organisé en dizaines, centaines et milliers d'hommes, recevant un cinquième du butin et disposant de centres d'entraînement dédiés (voir: Dawlat-Uthmaniyya-Salabi, p. 53-55). L'auteur insiste sur le fait que l'image courante du devşirme – des jeunes garçons chrétiens enrôlés de force et convertis – est « un mensonge inséré dans l'histoire d'Orhan et de Murad »; il s'agit là de la position apologétique de l'auteur, et non d'un consensus parmi les historiens (voir: Dawlat-Uthmaniyya-Salabi, p. 53-55)."
  ur: "'نئی فوج' ⁦(ینیچری)⁩ جسے السلبی کہتے ہیں کہ اورہان نے اپنے بھائی علاءالدین کی تجویز پر قائم کیا تھا - اسلامی تربیت دینے والے اسیروں سے اٹھائے گئے ایک کھڑے دستے، جو دسیوں، سیکڑوں اور ہزاروں کی تعداد میں اس کے لیے تفویض کردہ غنیمت کے پانچویں حصے کے ساتھ منظم کیے گئے تھے اور تربیتی مراکز وقف کیے گئے تھے۔ 53-55}۔ مصنف کا اصرار ہے کہ جانی پہچانی devşirme تصویر — عیسائی لڑکوں پر زبردستی ٹیکس لگا کر تبدیل کر دیا گیا — یہ 'اورہان اور مراد کی تاریخ میں لگایا گیا جھوٹ' ہے۔ یہ مصنف کا معذرت خواہانہ موقف ہے، مورخین کا اجماع نہیں۔ 53-55}۔"
  tr: "El-Sallabi'nin belirttiğine göre, Sultan Orhan'ın kardeşi Alaeddin ibn Osman'ın önerisiyle kurduğu yeni düzenli ordu, savaş esirlerinin İslami eğitimine ve askeri eğitimine dayanıyordu. Bu yeni orduya \"Yeniçeri\" adı verildi. Kitapta, Orhan'ın orduyu onar, yüzer ve bin askerden oluşan gruplara ayırdığı, savaş ganimetlerinin beşte birini orduya tahsis ettiği ve eğitim merkezleri kurduğu belirtiliyor. Ayrıca Alaeddin ve Orhan'ın bu yeni oluşumun amacının kalıcı, düzenli bir güç oluşturmak olduğu konusunda anlaştıkları da ifade ediliyor. {cite:dawlat-uthmaniyya-salabi pp. 53-55} Yazar, \"Dithrim\" sistemi hakkındaki yaygın algının -yani Hristiyan çocukların zorla askere alınması ve İslam'a zorlanmalarının- \"Orhan ve Murad'ın tarihine eklenmiş bir yalan\" olduğunu ve Orhan'ın babasının evinden tek bir Hristiyan çocuğu bile almadığını ısrarla savunmaktadır; bu, tarihçilerin genel görüşü değil, yazarın savunması ve görüşüdür {cite:dawlat-uthmaniyya-salabi pp. 53-55}."
  id: "Tentara reguler baru, yang menurut al-Sallabi didirikan oleh Sultan Orhan atas saran saudaranya Alaeddin ibn Osman, didasarkan pada pendidikan Islam dan pelatihan militer para tawanan perang. Tentara baru ini disebut \"Yeniçeri.\" Kitab tersebut menyebutkan bahwa Orhan mengorganisir tentara menjadi puluhan, ratusan, dan ribuan tentara, mengalokasikan seperlima dari rampasan perang untuknya, dan mendirikan pusat-pusat pelatihan. Kitab itu juga menyatakan bahwa Alaeddin dan Orhan sepakat bahwa tujuan dari formasi baru ini adalah untuk membangun kekuatan tetap dan reguler {cite:dawlat-uthmaniyya-salabi hlm. 53-55}. Penulis bersikeras bahwa persepsi umum tentang sistem \"Dithrim\"—yaitu, wajib militer paksa terhadap anak-anak Kristen dan pemaksaan mereka untuk masuk Islam—adalah \"kebohongan yang disisipkan ke dalam sejarah Orhan dan Murad,\" dan bahwa Orhan tidak mengambil satu pun anak laki-laki Kristen dari rumah ayahnya—ini adalah pembelaan dan posisi penulis, bukan konsensus para sejarawan {cite:dawlat-uthmaniyya-salabi pp. 53-55}."
issue: { ar: "كيف نشأت فرقة الينيچري، وما حقيقة نظام الدوشرمة ⁦(جمع الأطفال)⁩؟", en: "How was the Janissary corps founded, and what is the truth of the devşirme (child-levy) system?" }
