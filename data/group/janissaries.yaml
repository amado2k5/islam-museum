id: group/janissaries
class: group
kind: army
label:
  ar: "فيلق الينيچري (الجيش الجديد)"
  en: "The Janissary corps (Yeniçeri)"
summary:
  ar: "الجيش النظامي الجديد الذي يذكر الصلابي أن السلطان أورخان أنشأه باقتراح أخيه علاء الدين بن عثمان، وأن فكرته قامت على تربية الأسرى والمسبيين تربية إسلامية وتدريبهم على الحرب، فسُمّي الجيش الجديد «الينيچري». ويذكر الكتاب أن أورخان نظّم الجيش في عشرات ومئات وألوف وخصّص خمس الغنائم له وأنشأ مراكز للتدريب، وأن علاء الدين وأورخان اتفقا على أن الهدف من التشكيل الجديد بناء قوة نظامية دائمة {cite:dawlat-uthmaniyya-salabi p. 53-55}. ويصرّ المؤلف على أن التصور الشائع لنظام «الدثرمة» — أي جمع أبناء النصارى بالإكراه وإسلامهم قسراً — «كذبة دُسّت على تاريخ أورخان ومراد»، وأن أورخان لم ينتزع غلاماً نصرانياً واحداً من بيت أبيه — وهذا دفاع المؤلف وموقفه لا إجماع المؤرخين {cite:dawlat-uthmaniyya-salabi p. 53-55}."
  en: "The 'new army' (Yeniçeri) that al-Sallabi says Orhan founded on his brother Alaeddin's proposal — a standing corps raised from captives given Islamic training, organized in tens, hundreds and thousands with a fifth of spoils assigned to it and dedicated training centres {cite:dawlat-uthmaniyya-salabi p. 53-55}. The author insists the familiar devşirme picture — Christian boys forcibly levied and converted — is 'a lie planted in Orhan's and Murad's history'; that is the author's apologetic position, not a consensus of historians {cite:dawlat-uthmaniyya-salabi p. 53-55}."
issue: { ar: "كيف نشأت فرقة الينيچري، وما حقيقة نظام الدوشرمة (جمع الأطفال)؟", en: "How was the Janissary corps founded, and what is the truth of the devşirme (child-levy) system?" }
