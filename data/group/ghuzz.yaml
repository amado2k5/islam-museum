summary:
  ar: "قبائل تركمانية بخراسان، خرجت على السلطان سنجر سنة ثمان وأربعين فأسرته وأذاقته الذل وملكوا بلاده وبقوا الخطبة باسمه وبقي معهم صورة بلا معنى {cite:tarikh-khulafa-minhaj-1434 p. 674}. وذكرهم المسعودي في أنواع الترك نحو بلاد غرش وبسطام وبست مما يلي بلاد سجستان، وكذلك من بلاد كرمان من أرض القفص والبلوج والجت {cite:muruj-al-dhahab p. 440}"
  en: "Turkmen tribes of Khurasan who rose on sultan Sanjar in 548, captured and humbled him and ruled his lands with the khutba still in his name {cite:tarikh-khulafa-minhaj-1434 p. 674}."
  es: "Tribus turcomanas de Jorasán que se alzaron contra el sultán Sanjar en 548, lo capturaron y humillaron, y gobernaron sus tierras con la jutba aún en su nombre {cite:tarikh-khulafa-minhaj-1434 p. 674}."
  fr: "Les tribus turkmènes du Khorasan qui se sont soulevées contre le sultan Sanjar en 548, l'ont capturé et humilié et ont gouverné ses terres avec la khutba toujours en son nom {cite:tarikh-khulafa-minhaj-1434 p. 674}."
  ur: "خراسان کے ترکمان قبائل جو 548 میں سلطان سنجار پر چڑھے تھے، انہوں نے اسے گرفتار کر کے عاجز کیا اور اس کے نام پر خطبہ کے ساتھ اس کی زمینوں پر حکومت کی۔ 674}۔"
  tr: "Horasan'daki Türkmen kabileleri, Hicri 48 yılında Sultan Sanjar'a isyan ederek onu esir aldılar, aşağıladılar ve topraklarına el koydular. Cuma hutbelerini onun adına okumaya devam ederek, onu sadece sembolik ve anlamsız bir figür olarak bıraktılar. {Kaynak:tarikh-khulafa-minhaj-1434 s. 674}. El-Mas'udi, onları Sistan'a sınır olan Garş, Bistam ve Bust bölgelerindekiler ile Kerman'da, özellikle Kaf, Beluç ve Jat bölgelerindekiler de dahil olmak üzere çeşitli Türk kabileleri arasında zikretmiştir. {Kaynak:muruj-al-dhahab s. 440}"
  id: "Suku-suku Turkmen di Khorasan memberontak terhadap Sultan Sanjar pada tahun 48 Hijriah, menangkapnya, mempermalukannya, dan merebut tanah miliknya. Mereka terus menyampaikan khutbah Jumat atas namanya, sehingga ia hanya memiliki simbol dan figur yang tidak berarti. {cite:tarikh-khulafa-minhaj-1434 hlm. 674}. Al-Mas'udi menyebutkan mereka di antara berbagai suku Turkik, termasuk yang berada di tanah Gharsh, Bistam, dan Bust, yang berbatasan dengan Sistan, serta yang berada di Kerman, khususnya di tanah Qafs, Baluch, dan Jat. {cite:muruj-al-dhahab hlm. 440}"
