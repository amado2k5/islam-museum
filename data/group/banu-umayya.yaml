label: { en: Banu Umayya ibn Abd Shams, ar: "بنو أمية بن عبد شمس" }
summary:
  ar: "من بطون قريش؛ يقدّمه ابن إسحاق بنسبه «أمية بن عبد شمس بن عبد مناف» ويجعله قسماً مستقلاً من مهاجرة الحبشة. وعند المسعودي كان جميع ملكهم إلى أن بويع أبو العباس ألف شهر كاملة لأنهم ملكوا تسعين سنة وأحد عشر شهراً وثلاثة عشر يوماً، وذكر قوم أن تأويل ليلة القدر خير من ألف شهر أيامهم، وروي عن ابن عباس والله ليملكن بنو العباس ضعف ما ملكته بنو أمية باليوم يومين وبالشهر شهرين وبالسنة سنتين وبالخليفة خليفتين، وسئل بعض شيوخهم عقيب زوال الملك عن سببه فقال شغلنا بلذاتنا عن تفقد ما يلزمنا فظلمنا رعيتنا فيئسوا من إنصافنا وتمنوا الراحة منا وتحوملنا على أهل خراجنا فتخلوا عنا وخرِبت ضياعنا فخلت بيوت أموالنا ووثقنا بوزرائنا فآثروا مرافقهم على منافعنا، وكانت العصبية بين نزار واليمان من دواعي زوال ملكهم {cite:muruj-al-dhahab p. 219-223}"
  en: A clan of Quraysh; Ibn Ishaq lists it as 'Umayya ibn Abd Shams ibn Abd Manaf' and makes it a separate section of the Abyssinia emigration.
