label: { en: Banu Umayya ibn Abd Shams, ar: "بنو أمية بن عبد شمس", es: "Banu Umayya ibn Abd Shams", fr: "Banu Umayya ibn Abd Shams", ur: "بنو امیہ بن عبد شمس", tr: "Banu Umayya ibn Abd Shams", id: "Banu Umayya ibn Abd Shams" }
summary:
  ar: "من بطون قريش؛ يقدّمه ابن إسحاق بنسبه «أمية بن عبد شمس بن عبد مناف» ويجعله قسماً مستقلاً من مهاجرة الحبشة. وعند المسعودي كان جميع ملكهم إلى أن بويع أبو العباس ألف شهر كاملة لأنهم ملكوا تسعين سنة وأحد عشر شهراً وثلاثة عشر يوماً، وذكر قوم أن تأويل ليلة القدر خير من ألف شهر أيامهم، وروي عن ابن عباس والله ليملكن بنو العباس ضعف ما ملكته بنو أمية باليوم يومين وبالشهر شهرين وبالسنة سنتين وبالخليفة خليفتين، وسئل بعض شيوخهم عقيب زوال الملك عن سببه فقال شغلنا بلذاتنا عن تفقد ما يلزمنا فظلمنا رعيتنا فيئسوا من إنصافنا وتمنوا الراحة منا وتحوملنا على أهل خراجنا فتخلوا عنا وخرِبت ضياعنا فخلت بيوت أموالنا ووثقنا بوزرائنا فآثروا مرافقهم على منافعنا، وكانت العصبية بين نزار واليمان من دواعي زوال ملكهم {cite:muruj-al-dhahab p. 219-223}"
  en: A clan of Quraysh; Ibn Ishaq lists it as 'Umayya ibn Abd Shams ibn Abd Manaf' and makes it a separate section of the Abyssinia emigration.
  es: "Un clan de los Quraysh; Ibn Ishaq lo menciona como 'Umayya ibn Abd Shams ibn Abd Manaf' y lo convierte en una sección aparte de la emigración abisinia."
  fr: "Un clan de Quraysh; Ibn Ishaq le mentionne sous le nom d'« Umayya ibn Abd Shams ibn Abd Manaf » et en fait une section distincte de l'émigration abyssinienne."
  ur: "قریش کا ایک قبیلہ؛ ابن اسحاق نے اسے امیہ بن عبد شمس بن عبد مناف کے نام سے درج کیا ہے اور اسے حبشہ کی ہجرت کا ایک الگ حصہ قرار دیا ہے۔"
  tr: "Kureyş kabilelerinden; İbn İshak, onu \"Umayya ibn Abd Şems ibn Abd Manaf\" olarak adlandırarak Habeşistan'a hicret edenlerin bağımsız bir kolu olarak gösterir. El-Mas'udi'ye göre, Ebu el-Abbas'a biat edilene kadar olan tüm saltanatları tam bin ay sürmüştür; çünkü doksan yıl, on bir ay ve on üç gün hüküm sürmüşlerdir. Bazıları, Kadir Gecesi'nin tefsirinin onların bin aylık saltanatından daha iyi olduğunu belirtmiştir. İbn Abbas'tan rivayet edildiğine göre, \"Allah'a yemin olsun ki, Abbasiler Emevilerden iki kat daha uzun süre hüküm süreceklerdir - günde iki gün, ayda iki ay, yılda iki yıl ve iki halife.\" Krallığın yıkılmasının ardından bazı ileri gelenlerine bunun sebebi sorulduğunda, şöyle dediler: \"Zevklerimizle meşgul olduk ve görevlerimizi ihmal ettik, bu yüzden tebaamızı ezdik ve onlar adaletimizden ümitlerini kestiler ve bizden kurtuluş beklediler. Vergilerimizi toplayanları zor durumda bıraktık, bu yüzden bizi terk ettiler. Mallarımız harap oldu, bu yüzden hazinelerimiz boşaldı. Bakanlarımıza güvendik, bu yüzden kendi çıkarlarını bizimkine tercih ettiler.\" Nizar ve Yaman arasındaki kabile rekabeti, krallıklarının yıkılmasının sebeplerinden biriydi. 219-223"
  id: "Dari klan Quraysh; Ibnu Ishaq menyebutkan garis keturunannya sebagai \"Umayyah bin Abd Syam bin Abd Manaf\" dan menjadikannya cabang independen dari kaum emigran ke Abyssinia. Menurut Al-Mas'udi, seluruh pemerintahan mereka, hingga Abu al-Abbas mengucapkan sumpah setia, berlangsung selama seribu bulan penuh, karena mereka memerintah selama sembilan puluh tahun, sebelas bulan, dan tiga belas hari. Beberapa orang menyebutkan bahwa penafsiran Malam Lailatul Qadar lebih baik daripada seribu bulan pemerintahan mereka. Diriwayatkan dari Ibnu Abbas, \"Demi Allah, Dinasti Abbasiyah akan memerintah dua kali lebih lama daripada Dinasti Umayyah—dua hari sehari, dua bulan sebulan, dua tahun setahun, dan dua khalifah.\" Beberapa tetua mereka ditanyai tentang penyebabnya setelah jatuhnya kerajaan, dan mereka berkata, \"Kami terlalu sibuk dengan kesenangan kami dan mengabaikan kewajiban kami, sehingga kami menindas rakyat kami, dan mereka putus asa akan keadilan kami dan mendambakan pembebasan dari kami. Kami membebani mereka yang memungut pajak kami, sehingga mereka meninggalkan kami. Harta benda kami hancur, sehingga perbendaharaan kami dikosongkan. Kami mempercayai para menteri kami, sehingga mereka lebih mengutamakan kepentingan mereka sendiri daripada kepentingan kami.\" Persaingan antar suku antara Nizar dan Yaman adalah salah satu alasan jatuhnya kerajaan mereka. 219-223"
