summary:
  ar: "بنو عقيل بن كعب بن عامر بن صعصعة القيسيون، أكبر بطون العرب بالجزيرة؛ ملكوا الموصل وما حولها منذ نهاية القرن الرابع الهجري فكان منهم قرواش بن المقلد معتمد الدولة الذي كانت له الموصل والكوفة وشط الفرات، ثم قريش بن بدران {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  en: "Banu Uqayl ibn Ka'b — the great Qaysi tribe of the Jazira who held Mosul and its marches from the late fourth century: Qirwash ibn al-Muqallad Mu'tamad al-Dawla ruled Mosul, Kufa and the Euphrates shore, then Quraysh ibn Badran {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  es: "Banu Uqayl ibn Ka'b: la gran tribu Qaysi de Jazira que controló Mosul y sus fronteras desde finales del siglo IV: Qirwash ibn al-Muqallad Mu'tamad al-Dawla gobernó Mosul, Kufa y la costa del Éufrates, luego Quraysh ibn Badran {cita:muntazam-ibn-al-jawzi j.8 p.489-490}."
  fr: "Banu Uqayl ibn Ka'b — la grande tribu Qaysi de la Jazira qui détenait Mossoul et ses marches à partir de la fin du IVe siècle: Qirwash ibn al-Muqallad Mu'tamad al-Dawla régnait sur Mossoul, Kufa et la rive de l'Euphrate, puis Quraysh ibn Badran {cite: muntazam-ibn-al-jawzi j.8 p.489-490}."
