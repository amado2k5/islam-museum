summary:
  ar: "بنو عقيل بن كعب بن عامر بن صعصعة القيسيون، أكبر بطون العرب بالجزيرة؛ ملكوا الموصل وما حولها منذ نهاية القرن الرابع الهجري فكان منهم قرواش بن المقلد معتمد الدولة الذي كانت له الموصل والكوفة وشط الفرات، ثم قريش بن بدران {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
  en: "Banu Uqayl ibn Ka'b — the great Qaysi tribe of the Jazira who held Mosul and its marches from the late fourth century: Qirwash ibn al-Muqallad Mu'tamad al-Dawla ruled Mosul, Kufa and the Euphrates shore, then Quraysh ibn Badran {cite:muntazam-ibn-al-jawzi j.8 p.489-490}."
