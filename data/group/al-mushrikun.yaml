summary:
  ar: "المشركون عند المصادر العرب الوثنيون أهل مكة ومن دان بدينهم من الأوساط حول الحرم: عبدوا اللات والعزى ومناة وهبل والأصنام وجعلوا لله شركاء؛ القرآن يخاطبهم ويحاجهم ويأمر بالبراءة منهم بعد الفتح، والسيرة تحفظ موقفهم من الدعوة من الإسراء إلى الفتح — أبو جهل وأبو لهب وعتبة وأمية وقادتهم في بدر وأحد والخندق حتى أسلموا أو هُزموا {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "Al-Mushrikun in the sources are the idol-worshipping Arabs of Makka and those who shared their religion around the Sanctuary: they worshipped al-Lat, al-'Uzza, Manat, Hubal and the idols, and made partners with God. The Qur'an addresses them, argues with them and declares the bara'a from them after the Conquest; the Sira keeps their stand against the Call from the persecution to the Conquest — Abu Jahl, Abu Lahab, 'Utba, Umayya and their leaders at Badr, Uhud and the Trench, until they submitted or were defeated {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "مشرکین مصادر میں مکہ کے بت پرست عرب اور حرم کے گرد ان کے دین کے شریک قومیں ہیں: انہوں نے لات، عزّٰی، منات، ہبل اور بتوں کی عبادت کی اور خدا کے شریک ٹھہرائے؛ قرآن ان سے مخاطب ہوتا ہے اور فتح کے بعد ان سے براءت کا حکم دیتا ہے، اور سیرت ستبرے سے فتح مکہ تک ان کے موقف کو محفوظ رکھتی ہے — ابو جہل، ابو لہب، عتبہ، امیہ اور بدر، احد اور خندق کے ان کے سردار۔"
  es: "En las fuentes, los al-Mushrikun son los árabes idólatras de La Meca y aquellos que compartieron su religión alrededor del Santuario: adoraban a al-Lat, al-'Uzza, Manat, Hubal y los ídolos, y asociaban a Dios con otros. El Corán se dirige a ellos, discute con ellos y declara la bara'a de ellos después de la Conquista; la Sira mantiene su postura contra el Llamamiento desde la persecución hasta la Conquista: Abu Jahl, Abu Lahab, 'Utba, Umayya y sus líderes en Badr, Uhud y la Trinchera, hasta que se sometieron o fueron derrotados {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  fr: "Les « Mushrikun » mentionnés dans les sources sont les Arabes idolâtres de La Mecque et ceux qui partageaient leur religion autour du Sanctuaire: ils adoraient al-Lat, al-'Uzza, Manat, Hubal et les idoles, et leur associaient des divinités. Le Coran s'adresse à eux, les interpelle et prononce la bara'a (répudiation) à leur sujet après la Conquête; la Sira maintient sa résistance face à l'appel, depuis la persécution jusqu'à la Conquête — Abou Jahl, Abou Lahab, 'Utba, les Omeyyades et leurs chefs à Badr, Uhud et au Fossé, jusqu'à leur soumission ou leur défaite {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  tr: "Arap kaynaklarına göre, çok tanrılılar, Mekke'nin putperest halkı ve kutsal alanın çevresindeki çevrelerden gelen dindarlardı: El-Lat, El-Uzza, Manat, Hubal ve putlara tapıyorlar ve Allah'a ortak koşuyorlardı. Kur'an onlara hitap eder, onlarla tartışır ve fetihten sonra onlardan vazgeçmeyi emreder. Biyografi, İsra'dan fetih çağrısına kadar olan süreçteki konumlarını korur: Ebu Cehl, Ebu Lahab, Utbe, Emevi ve liderleri Bedir, Uhud ve Hendek'te İslam'ı kabul edene veya yenilene kadar. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  id: "Menurut sumber-sumber Arab, kaum politeis adalah penduduk Mekah yang menganut paganisme dan mereka yang mengikuti agama mereka dari lingkaran di sekitar tempat suci: mereka menyembah Al-Lat, Al-Uzza, Manat, Hubal, dan berhala-berhala, serta menyekutukan Tuhan. Al-Qur'an membahas mereka, berdebat dengan mereka, dan memerintahkan untuk meninggalkan mereka setelah penaklukan. Biografi tersebut mempertahankan posisi mereka mengenai seruan dari Isra' untuk penaklukan — Abu Jahl, Abu Lahab, Utbah, Umayyah, dan para pemimpin mereka di Badr, Uhud, dan Palung sampai mereka memeluk Islam atau dikalahkan. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
