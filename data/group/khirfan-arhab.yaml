label:
  ar: أهل خرفان من أرحب
  en: The people of Khirfan (of Arhab)
  ur: ارحب کے اہل خرفان
summary:
  ar: قوم من أرحب بحسب الراوي، من بني عم الدعام ومن كان يتقوى بهم في حربه للهادي، هربوا إلى رؤوس الجبال حين قدم الهادي ثم نزلوا بالأمان وحلفوا له في المحرم أو صفر سنة 286هـ.
  en: A people of Arhab by the narrator, cousins of al-Da'am and men he relied on in his war on al-Hadi, who fled to the mountain tops when al-Hadi came, then came down under safe-conduct and swore to him in Muharram or Safar 286 AH.
  ur: راوی کے مطابق ارحب کی ایک قوم، دعام کے چچازاد اور ہادی کے خلاف اس کی جنگ میں اس کا سہارا، جو ہادی کے آنے پر پہاڑوں کی چوٹیوں پر بھاگ گئے، پھر امان پا کر اتر آئے اور محرم یا صفر 286ھ میں ان کے لیے قسم کھائی۔
