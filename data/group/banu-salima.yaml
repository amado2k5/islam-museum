label: { ar: "بنو سلمة", en: "Banu Salima", es: "Banu Salima", fr: "Banu Salima", ur: "بنو سلیمہ" }
summary:
  ar: "عشيرة من الخزرج؛ منها كعب بن مالك، والرجل الذي ذمّ كعباً في تبوك، والرجال الذين لاموه بعد صدقه مع النبي. وعند السمهودي: نزلوا ما بين مسجد القبلتين إلى المذاد في سند الحرة في دار تسمى «خُربى» سماها النبي «صلحة» على الصواب — وفي نسخة ابن زبالة «طلحة» — وابتنوا آطاماً منها «الأغلب» و«خيط» و«منيع»؛ ولما شكوا بُعد دورهم قال لهم النبي «اثبتوا فإنكم أوتادها»، ثم نقلهم عمر إلى سفح سلع {cite:samhudi-wafa-al-wafa p. 213-216}."
  en: "A clan of the Khazraj; it includes Ka'b ibn Malik, the man who disparaged Ka'b at Tabuk, and the men who reproached him after he told the Prophet the truth. In al-Samhudi they settled between the Mosque of the Two Qiblas and al-Midhad in a quarter called 'Khurba' — ruin — which the Prophet renamed 'Sulha' on the sounder reading ('Talha' in Ibn Zabala's copy); they built the utum al-Aghlab, Khayt and Mani', and when they complained of their distance the Prophet said 'stay, for you are its tent-pegs', then Umar moved them to the foot of Sal' {cite:samhudi-wafa-al-wafa p. 213-216}."
  es: "Un clan de los Khazraj; incluye a Ka'b ibn Malik, el hombre que menospreció a Ka'b en Tabuk, y a los hombres que lo reprocharon después de que le dijera la verdad al Profeta. En al-Samhudi se establecieron entre la Mezquita de las Dos Qiblas y al-Midhad en un barrio llamado 'Khurba' —ruina— que el Profeta renombró 'Sulha' en la lectura más sonora ('Talha' en la copia de Ibn Zabala); construyeron el utum al-Aghlab, Khayt y Mani', y cuando se quejaron de su distancia el Profeta dijo 'quédense, porque ustedes son sus estacas', entonces Umar los trasladó al pie de Sal' {cite:samhudi-wafa-al-wafa p. 213-216}."
  fr: "Un clan des Khazraj, comprenant Ka'b ibn Malik, celui qui dénigra Ka'b à Tabuk, et ceux qui le réprimandèrent après qu'il eut révélé la vérité au Prophète. À al-Samhudi, ils s'établirent entre la Mosquée des Deux Qiblas et al-Midhad, dans un quartier appelé « Khurba » (ruine), que le Prophète renomma « Sulha » sur la transcription sonore (« Talha » dans le manuscrit d'Ibn Zabala). Ils y construisirent les utum al-Aghlab, Khayt et Mani'. Se plaignant de leur éloignement, le Prophète leur dit: « Restez, car vous êtes les piquets de la tente. » Umar les déplaça alors au pied du mont Sal' (voir: Samhudi-Wafa-Al-Wafa, p. 213-216)."
  ur: "خزرج کا ایک قبیلہ؛ اس میں کعب بن مالک بھی شامل ہے، وہ شخص جس نے تبوک میں کعب کو برا بھلا کہا تھا، اور وہ لوگ جنہوں نے نبی کو سچ بتانے کے بعد ان کی توہین کی تھی۔ السمھودی میں انہوں نے دو قبلوں کی مسجد اور المحدث کے درمیان ایک چوتھائی میں آباد کیا جسے 'خربہ' کہا جاتا ہے - کھنڈر - جسے نبی نے آواز سے پڑھنے پر 'سلحہ' کا نام دیا ⁦(ابن زبالہ کی نقل میں 'طلحہ')⁩؛ انہوں نے اتم الاغلب، خیط اور منی کی تعمیر کی، اور جب انہوں نے اپنی دوری کی شکایت کی تو رسول اللہ نے فرمایا کہ ٹھہرو، کیونکہ تم اس کے خیمے کی کھونٹی ہو، پھر عمر نے انہیں صلوٰۃ کے دامن میں منتقل کر دیا۔ 213-216}۔"
