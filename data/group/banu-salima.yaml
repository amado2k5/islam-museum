label: { ar: "بنو سلمة", en: "Banu Salima" }
summary:
  ar: "عشيرة من الخزرج؛ منها كعب بن مالك، والرجل الذي ذمّ كعباً في تبوك، والرجال الذين لاموه بعد صدقه مع النبي. وعند السمهودي: نزلوا ما بين مسجد القبلتين إلى المذاد في سند الحرة في دار تسمى «خُربى» سماها النبي «صلحة» على الصواب — وفي نسخة ابن زبالة «طلحة» — وابتنوا آطاماً منها «الأغلب» و«خيط» و«منيع»؛ ولما شكوا بُعد دورهم قال لهم النبي «اثبتوا فإنكم أوتادها»، ثم نقلهم عمر إلى سفح سلع {cite:samhudi-wafa-al-wafa p. 213-216}."
  en: "A clan of the Khazraj; it includes Ka'b ibn Malik, the man who disparaged Ka'b at Tabuk, and the men who reproached him after he told the Prophet the truth. In al-Samhudi they settled between the Mosque of the Two Qiblas and al-Midhad in a quarter called 'Khurba' — ruin — which the Prophet renamed 'Sulha' on the sounder reading ('Talha' in Ibn Zabala's copy); they built the utum al-Aghlab, Khayt and Mani', and when they complained of their distance the Prophet said 'stay, for you are its tent-pegs', then Umar moved them to the foot of Sal' {cite:samhudi-wafa-al-wafa p. 213-216}."
