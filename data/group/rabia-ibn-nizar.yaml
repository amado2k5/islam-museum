label: { ar: "ربيعة بن نزار", en: "Rabi'a ibn Nizar", es: "Rabi'a ibn Nizar", fr: "Rabi'a ibn Nizar", ur: "ربیعہ بن نضر" }
summary:
  ar: "ربيعة بن نزار بن معد، قسم له أبوه عند وفاته الفرس الأدهم والخباء الأسود ففسرها الأفعى بالخيل الدهم والسلاح وما فيها من عبيد فسمي ربيعة الفرس، وكان يغزو على الخيل ويصل إخوته حين أهلكت السنة الشاء والإبل {cite:muruj-al-dhahab p. 431-434}."
  en: "Son of Nizar allotted the bay horse and black tent — read by al-Af'a as the horses and arms, whence his name 'Rabi'a of the horse'; he raided on horseback and sustained his brothers through the famine {cite:muruj-al-dhahab p. 431-434}."
  es: "El hijo de Nizar recibió el caballo bayo y la tienda negra —leído por al-Af'a como los caballos y las armas, de donde proviene su nombre 'Rabi'a del caballo'; asaltó a caballo y sostuvo a sus hermanos durante la hambruna {cite:muruj-al-dhahab p. 431-434}."
  fr: "Le fils de Nizar attribua le cheval bai et la tente noire — lus par al-Af'a comme les chevaux et les armes, d'où son nom « Rabi'a du cheval »; il mena des raids à cheval et soutint ses frères pendant la famine {cite: muruj-al-dhahab p. 431-434}."
  ur: "نزار کے بیٹے نے خلیج کا گھوڑا اور کالا خیمہ الاٹ کیا - جسے الفا نے گھوڑے اور بازو کے طور پر پڑھا، اس سے اس کا نام 'گھوڑے کا ربیع' پڑ گیا۔ اس نے گھوڑے پر چڑھائی کی اور قحط سے اپنے بھائیوں کو پالا۔ 431-434}۔"
