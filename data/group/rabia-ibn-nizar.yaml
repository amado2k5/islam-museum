  en: "Son of Nizar allotted the bay horse and black tent — read by al-Af'a as the horses and arms, whence his name 'Rabi'a of the horse'; he raided on horseback and sustained his brothers through the famine {cite:muruj-al-dhahab p. 431-434}."
