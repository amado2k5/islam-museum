summary:
  ar: "قناة استوديو كازاخية إسلامية على يوتيوب (@ali_stydiasy) فُتحت في 9 فبراير 2013، تصف نفسها بأنها قناة إسلامية تعليمية و«منصّة للتربية الروحية والمواعظ النافعة»؛ تنشر مواعظ ودروسًا مسجلة لعدد كبير من دعاة كازاخستان، منهم عبد الغفار سمانوف وأرمان قانيشباييف ونور سلطان قاسموف، وبلغ عدد مشتركيها نحو 1.09 مليون مشترك بحسب عدّاد vidIQ المقروء في 4 نوفمبر 2026، وهو رقم منصّة مؤرّخ. ولا تُسمّي موادّ القناة المنشورة جهةً مشغّلة أو مؤسّسًا لها."
  en: "A Kazakh-language Islamic studio channel on YouTube (@ali_stydiasy), opened on 9 February 2013, which describes itself as an Islamic educational channel and 'a platform for spiritual upbringing and useful sermons'. It publishes sermons and lessons recorded from many Kazakh preachers — among them Abdugappar Smanov, Arman Kuanyshbayev and Nursultan Kasimov — and counted about 1.09 million subscribers by vidIQ's count read on 4 November 2026, a dated platform figure. No operating organisation or founder is named in the channel's published materials."
  ur: "علی اسٹوڈیو قازق زبان کی ایک اسلامی اسٹوڈیو چینل ہے جو یوٹیوب (@ali_stydiasy) پر 9 فروری 2013ء کو کھلی؛ یہ خود کو اسلامی تعلیمی چینل اور «روحانی تربیت اور مفید وعظوں کا پلیٹ فارم» کہتی ہے۔ یہ قازقستان کے متعدد مبلغین کے ریکارڈ شدہ وعظ و دروس شائع کرتی ہے، جن میں عبد الغفار سمانوف، ارمان قانیش بایف اور نور سلطان قاسموف شامل ہیں؛ اس کے اراکین کی تعداد vidIQ کے 4 نومبر 2026ء کو پڑھے گئے شمار کے مطابق تقریباً 1.09 ملین تھی، جو ایک مؤرخہ پلیٹ فارم عدد ہے۔ چینل کی شائع کردہ مواد میں کسی چلانے والی تنظیم یا بانی کا نام نہیں ملتا۔"
