label: { en: "The Ansar", ar: "الأنصار" }
summary:
  en: "'The Helpers': the Muslims of Medina, from the Aws and the Khazraj, who invited the Prophet to their city, sheltered the refugees, and supplied the community's fighting strength. The Encyclopaedia of Islam says the name replaced their older joint name Banu Kayla, that the old feuds between the two tribes faded under the Prophet, and that the Ansar later lost influence and merged with Quraysh and other settlers in Medina."
  ar: "«الأنصار»: مسلمو المدينة من الأوس والخزرج الذين دعوا النبي إلى مدينتهم، وآووا المهاجرين، وكانوا عماد قوة الجماعة. وتذكر دائرة المعارف الإسلامية أن الاسم حلّ محل اسمهم المشترك القديم بني قيلة، وأن الخصومات القديمة بين القبيلتين خفتت في عهد النبي، وأن الأنصار تراجع نفوذهم لاحقاً واندمجوا مع قريش وغيرها من المستقرين في المدينة. وفي الصحيح أنهم سُمّوا به من عند الله لا باجتهادهم {cite:sahih-al-bukhari 3776}، وأن النبي قال «لولا الهجرة لكنت امرءاً من الأنصار، ولو سلك الناس وادياً وسلكت الأنصار وادياً لسلكت وادي الأنصار» {cite:sahih-al-bukhari 3779}، وقال «خير دور الأنصار بنو النجار ثم بنو عبد الأشهل ثم بنو الحارث بن الخزرج ثم بنو ساعدة، وفي كل دور الأنصار خير» {cite:sahih-al-bukhari 3807}."
  ur: "«انصار» یعنی مددگار: مدینہ کے وہ مسلمان جو اوس اور خزرج سے تھے، جنہوں نے نبی کو اپنے شہر میں بلایا، مہاجرین کو پناہ دی اور جماعت کی جنگی قوت فراہم کی۔ انسائیکلوپیڈیا آف اسلام کے مطابق یہ نام ان کے پرانے مشترکہ نام بنو قیلہ کی جگہ آیا، دونوں قبیلوں کی پرانی دشمنیاں نبی کے زمانے میں مدھم پڑ گئیں، اور انصار بعد میں اپنا اثر کھو کر قریش اور مدینہ کے دوسرے آباد کاروں میں گھل مل گئے۔"
