label: { en: "The Ansar", ar: "الأنصار" }
summary:
  en: "'The Helpers' — the Muslims of Medina, of Aws and Khazraj, who invited the Prophet to their city, sheltered the refugees, and supplied the community's fighting strength."
  ar: "«الأنصار» — مسلمو المدينة من الأوس والخزرج الذين دعوا النبي إلى مدينتهم، وآووا المهاجرين، وكانوا عماد قوة الجماعة. وفي الصحيح أنهم سُمّوا به من عند الله لا باجتهادهم {cite:sahih-al-bukhari 3776}، وأن النبي قال «لولا الهجرة لكنت امرءاً من الأنصار، ولو سلك الناس وادياً وسلكت الأنصار وادياً لسلكت وادي الأنصار» {cite:sahih-al-bukhari 3779}، وقال «خير دور الأنصار بنو النجار ثم بنو عبد الأشهل ثم بنو الحارث بن الخزرج ثم بنو ساعدة، وفي كل دور الأنصار خير» {cite:sahih-al-bukhari 3807}."
