label: { ar: "القبائل اليهودية في الحجاز", en: "The Jewish tribes of the Hijaz", es: "Las tribus judías del Hiyaz", fr: "Les tribus juives du Hedjaz", ur: "حجاز کے یہودی قبائل", tr: "Hicaz'daki Yahudi kabileleri", id: "Suku-suku Yahudi di Hejaz" }
summary:
  ar: "القبائل اليهودية التي استقرت في يثرب وخيبر وتيماء بعد هجرتي اليهود من فلسطين ⁦(بعد بختنصر وبعد الرومان)⁩، وأنشأت القرى والآطام والقلاع؛ المشهورة منها عند مجيء الإسلام خيبر والنضير والمصطلق وقريظة وقينقاع، وذكر السمهودي أن عددها يزيد على عشرين، في رواية الرحيق المختوم. وينقل السمهودي عن الشرقي أن يهود يثرب كانوا نيفاً وعشرين قبيلة، وعن ابن النجار أن آطامهم كانت تسعة وخمسين أطماً وللعرب النازلين عليهم قبل الأنصار ثلاثة عشر أطماً {cite:samhudi-wafa-al-wafa p. 177}."
  en: "The Jewish tribes that settled Yathrib, Khaybar and Tayma after the two Jewish migrations from Palestine (after Nebuchadnezzar and after the Romans) and built villages, forts and castles; those well known at the coming of Islam were Khaybar, al-Nadir, al-Mustaliq, Qurayza and Qaynuqa, and al-Samhudi counts more than twenty, in al-Raheeq al-Makhtum's account."
  es: "Las tribus judías que se asentaron en Yathrib, Khaybar y Tayma después de las dos migraciones judías desde Palestina (después de Nabucodonosor y después de los romanos) y construyeron aldeas, fuertes y castillos; las más conocidas a la llegada del Islam fueron Khaybar, al-Nadir, al-Mustaliq, Qurayza y Qaynuqa, y al-Samhudi menciona más de veinte, según el relato de al-Raheeq al-Makhtum."
  fr: "Les tribus juives qui s'établirent à Yathrib, Khaybar et Tayma après les deux migrations juives de Palestine (après Nabuchodonosor et après les Romains) et y construisirent des villages, des forts et des châteaux; celles qui étaient bien connues à l'arrivée de l'Islam étaient Khaybar, al-Nadir, al-Mustaliq, Qurayza et Qaynuqa, et al-Samhudi en compte plus de vingt, selon le récit d'al-Raheeq al-Makhtum."
  ur: "وہ یہودی قبائل جنہوں نے فلسطین سے دو یہودیوں کی ہجرت کے بعد یثرب، خیبر اور تیمہ کو آباد کیا ⁦(نبوچدنضر اور رومیوں کے بعد)⁩ اور گاؤں، قلعے اور قلعے بنائے؛ اسلام کے آنے کے وقت جو مشہور تھے وہ خیبر، النضیر، المصطلق، قریظہ اور قینقہ تھے، اور الرحیق المختم کے حساب سے السمہدی کی تعداد بیس سے زیادہ ہے۔"
  tr: "Filistin'den Yahudilerin iki göçünden (Nebukadnezar ve Romalılardan sonra) sonra Yathrib, Hayber ve Tayma'ya yerleşen Yahudi kabileleri köyler, kaleler ve hisarlar kurdular. İslam'ın ortaya çıkışı döneminde bunların en ünlüleri arasında Hayber, el-Nadir, el-Mustaliq, Kurayza ve Kaynuka vardı. El-Samhudi, *Mühürlü Nektar* adlı eserinde bunların sayısının yirmiyi aştığını belirtir. El-Samhudi, el-Şarki'nin Yathrib Yahudilerinin yirmiden fazla kabileden oluştuğunu, İbn el-Necar'ın ise elli dokuz kaleye sahip olduklarını söylediğini aktarır; oysa Ensar'dan önce aralarına yerleşen Arapların on üç kalesi vardı. {cite:samhudi-wafa-al-wafa s. 177}"
  id: "Suku-suku Yahudi yang menetap di Yathrib, Khaybar, dan Tayma setelah dua migrasi orang Yahudi dari Palestina (setelah Nebukadnezar dan setelah Romawi) mendirikan desa-desa, benteng-benteng, dan tempat perlindungan. Di antara yang paling terkenal pada masa kedatangan Islam adalah Khaybar, al-Nadir, al-Mustaliq, Qurayza, dan Qaynuqa. Al-Samhudi menyebutkan bahwa jumlah mereka melebihi dua puluh, menurut catatannya dalam *The Sealed Nectar*. Al-Samhudi mengutip al-Sharqi yang mengatakan bahwa orang Yahudi di Yathrib berjumlah lebih dari dua puluh suku, dan Ibn al-Najjar yang mengatakan bahwa mereka memiliki lima puluh sembilan benteng, sementara orang Arab yang menetap di antara mereka sebelum Ansar memiliki tiga belas benteng. {cite:samhudi-wafa-al-wafa p. 177}"
