label: { ar: "القبائل اليهودية في الحجاز", en: "The Jewish tribes of the Hijaz" }
summary:
  ar: "القبائل اليهودية التي استقرت في يثرب وخيبر وتيماء بعد هجرتي اليهود من فلسطين (بعد بختنصر وبعد الرومان)، وأنشأت القرى والآطام والقلاع؛ المشهورة منها عند مجيء الإسلام خيبر والنضير والمصطلق وقريظة وقينقاع، وذكر السمهودي أن عددها يزيد على عشرين، في رواية الرحيق المختوم. وينقل السمهودي عن الشرقي أن يهود يثرب كانوا نيفاً وعشرين قبيلة، وعن ابن النجار أن آطامهم كانت تسعة وخمسين أطماً وللعرب النازلين عليهم قبل الأنصار ثلاثة عشر أطماً {cite:samhudi-wafa-al-wafa p. 177}."
  en: "The Jewish tribes that settled Yathrib, Khaybar and Tayma after the two Jewish migrations from Palestine (after Nebuchadnezzar and after the Romans) and built villages, forts and castles; those well known at the coming of Islam were Khaybar, al-Nadir, al-Mustaliq, Qurayza and Qaynuqa, and al-Samhudi counts more than twenty, in al-Raheeq al-Makhtum's account."
