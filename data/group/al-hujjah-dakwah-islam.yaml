summary:
  ar: "قناة تجميعية إندونيسية للدعوة على يوتيوب ترفع منذ 12 يناير 2013 بإيقاع مستمر، بلغ عدد مشتركيها نحو 713,000 مشترك بحسب موقع youtubers.me كما قُرئ في 15 نوفمبر 2026، ويوافقه موقع ThoughtLeaders بنحو 714 ألفًا. لم تُتح لها صفحة vidIQ، فأرقامها من متتبّعَين ثانويَّين وتُدرَّج على هذا الأساس. ولا يسمّي أي مصدر قُرئ مشغّلًا لها، فسُجّلت علامةَ قناة لا شخصًا."
  en: "An Indonesian dawah aggregator channel on YouTube, uploading since 12 January 2013 at a sustained cadence, with about 713,000 subscribers by youtubers.me as read on 15 November 2026, agreed closely by ThoughtLeaders at about 714,000. No vidIQ page could be pinned for it, so its figures rest on two secondary trackers and are graded accordingly. No source read names an operator for it, so it is recorded as a channel brand rather than a person."
  ur: "انڈونیشیا کی ایک دعوتی مجموعی ⁦(aggregator)⁩ یوٹیوب چینل، جو 12 جنوری 2013ء سے مسلسل اپ لوڈ کر رہی ہے؛ youtubers.me کے 15 نومبر 2026ء کے پڑھنے کے مطابق اس کے سبسکرائبرز تقریباً 713,000 تھے، اور ThoughtLeaders تقریباً 714,000 سے اس کی تائید کرتا ہے۔ اس کے لیے کوئی vidIQ صفحہ ثابت نہ ہو سکا، اس لیے اس کے اعداد دو ثانوی ٹریکرز پر مبنی ہیں اور اسی درجے کے ہیں۔ کسی بھی مأخذ میں اس کا کوئی منتظم نامزد نہیں، اس لیے اسے کسی شخص کے بجائے چینل برانڈ کے طور پر درج کیا گیا ہے۔"
  es: "Un canal agregador de dawah indonesio en YouTube, que sube contenido desde el 12 de enero de 2013 con una frecuencia constante, cuenta con aproximadamente 713 000 suscriptores según youtubers.me (dato del 15 de noviembre de 2026), cifra que ThoughtLeaders coincide en torno a los 714 000. No se pudo encontrar una página fija en vidIQ para este canal, por lo que sus cifras se basan en dos rastreadores secundarios y se clasifican en consecuencia. Ninguna fuente menciona a un operador, por lo que se registra como una marca de canal en lugar de una persona."
  fr: "Une chaîne YouTube indonésienne de prédication (dawah), active depuis le 12 janvier 2013 à un rythme soutenu, comptait environ 713 000 abonnés selon youtubers.me (chiffre relevé le 15 novembre 2026), un chiffre proche de celui de ThoughtLeaders (environ 714 000). Aucune page vidIQ n'ayant pu être trouvée pour cette chaîne, ses statistiques proviennent de deux outils de suivi secondaires et sont donc évaluées en conséquence. Aucune source n'identifiant d'opérateur, elle est enregistrée comme une marque de chaîne et non comme une personne."
