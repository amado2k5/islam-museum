summary:
  ar: "أشهر أمة في العرب البائدة؛ قوم هود، وكانوا يسكنون الأحقاف من الرمال بين اليمن وحضرموت وأظهرت عاد إرم ذات العماد التي لم يخلق مثلها في البلاد؛ أهلكتهم الريح العقيم إذ كذبوا نبيهم {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
  en: "The best-known of the vanished Arab nations — the people of Hud, who dwelt in the sand-dunes of al-Ahqaf between Yemen and Hadramawt; of them came 'Aad of Iram 'of the pillars', destroyed by the barren wind for denying their prophet {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
  es: "La más conocida de las naciones árabes desaparecidas fue el pueblo de Hud, que habitaba en las dunas de arena de al-Ahqaf entre Yemen y Hadramawt; de ellos surgió 'Aad de Iram 'de los pilares', destruido por el viento estéril por negar a su profeta {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
