label: { ar: "بنو عبس", en: "Banu ʿAbs", es: "Banu ʿAbs", fr: "Banu ʿAbs", ur: "بنو عباس", tr: "Banu Abs", id: "Banu Abs" }
summary:
  ar: "بنو عبس بن بغيض بن ريث بن غطفان بن سعد بن قيس عيلان؛ أشهر بطون غطفان بالشعر والفروسية، منهم عنترة بن شداد العبسي وعروة بن الورد العبسي وداحس والغبراء حربهم على ذبيان {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  en: "Banu Abs ibn Baghid ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays Aylan — Ghatafan's most famous clan for poetry and horsemanship; from them Antara ibn Shaddad and Urwa ibn al-Ward, and their war on Dhubyan named for Dahis and al-Ghabra {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  es: "Banu Abs ibn Baghid ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays Aylan, el clan más famoso de Ghatafan por su poesía y equitación; de ellos Antara ibn Shaddad y Urwa ibn al-Ward, y su guerra en Dhubyan llamada así por Dahis y al-Ghabra {cita:tarikh-al-tabari} {cita:kamil-ibn-al-athir} {cita:mubarakpuri-raheeq p.16}."
  fr: "Banu Abs ibn Baghid ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays Aylan — le clan le plus célèbre de Ghatafan pour la poésie et l'équitation; d'eux Antara ibn Shaddad et Urwa ibn al-Ward, et leur guerre contre Dhubyan nommée d'après Dahis et al-Ghabra {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  ur: "بنو عباس ابن بغید بن ریث ابن غطفان ابن سعد ابن قیس علان — غطفان کا سب سے مشہور قبیلہ شاعری اور گھڑ سواری۔ ان میں سے عنطارہ بن شداد اور عروہ بن الورد، اور ان کی جنگ ذبیان کا نام دحیس اور الغبرا {حوالہ:تاریخ الطبری} {حوالہ:کامل ابن الثیر} {حوالہ:مبارکپوری الرحیق ص 16}۔"
  tr: "Banu Abs ibn Baghidh ibn Rayth ibn Ghatafan ibn Saad ibn Qais Aylan; Aralarında Antarah ibn Şeddad el-Absi, Urve ibn el-Vard el-Absi, Dahis ve el-Ghabra'nın da bulunduğu Gatafan kabilelerinin şiir ve binicilik alanında en ünlüleri, Dhubyan'a karşı savaşları {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq s.16}."
  id: "Bani Abs ibn Baghidh ibn Rayth ibn Ghatafan ibn Saad ibn Qais Aylan; yang paling terkenal dari klan Ghatafan dalam puisi dan menunggang kuda, di antaranya Antarah ibn Shaddad al-Absi, Urwah ibn al-Ward al-Absi, Dahis dan al-Ghabra, perang mereka melawan Dhubyan {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq hal.16}."
