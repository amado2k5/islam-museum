label:
  ar: المرجئة
  en: "Murji'a"
summary:
  ar: "طائفة تقول إن الإيمان قول دون عمل، ولا يزيد ولا ينقص، ولا يتفاضل الناس فيه؛ ويصف الكتاب قولهم كما نقله عن أهل السنة، ويحكم عليه بالبطلان. ويعرض أحمد أمين المسألة من داخلها: أساس الإرجاء تحديد معنى الإيمان — فللدين ثلاثة عناصر تصديق بالقلب وإقرار باللسان وعمل بالجوارح — فمن المرجئة من قصر الإيمان على التصديق بالقلب احتجاجاً بأن الإيمان في اللغة التصديق، ومنهم من جعله ركنين تصديقاً وإقراراً، ويكادون يجمعون على أن العمل ليس ركناً منه؛ وبدأ القول بالإرجاء بسيطاً ساذجاً في العصر الأموي فلما تفلسفت المذاهب في العصر العباسي تفلسف الإرجاء {cite:duha-islam p. 932-933}."
  en: "A sect holding that faith is speech without deed, that it neither increases nor decreases, and that people do not differ in it; the book describes their view as it relays it from the People of the Sunna, and rules it void. Ahmad Amin presents the question from the inside: the basis of irja' is how faith is defined. Religion has three elements, assent of the heart, profession of the tongue and action of the limbs. Some Murji'a confined faith to assent of the heart, arguing that iman means tasdiq in the lexicon; others made it two pillars, assent and profession, and they nearly all agree that deed is no pillar of it. Irja' began simple and naive in the Umayyad period, and as doctrines grew philosophical in the Abbasid age, irja' became philosophical too {cite:duha-islam p. 932-933}."
