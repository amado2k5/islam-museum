id: group/murjia
education:
  did_you_know:
    ar: "المرجئة تقول إن الإيمان قول دون عمل لا يزيد ولا ينقص؛ وبدأ الإرجاء بسيطاً في العصر الأموي ثم تفلسف في العباسي كما يقول أحمد أمين."
    en: "The Murji'a hold faith is word without deed, neither increasing nor decreasing; Ahmad Amin says irja' began simply in Umayyad times then grew philosophical under the Abbasids."
    ur: "مرجئہ کا قول ہے کہ ایمان صرف قول ہے عمل کے بغیر، نہ بڑھتا نہ گھٹتا؛ احمد امین کہتے ہیں ارجاء اموی دور میں سادہ شروع ہوا اور عباسی دور میں فلسفیانہ ہو گیا۔"
    sources: [source/duha-islam, source/madkhal-ibn-badran-turki]
