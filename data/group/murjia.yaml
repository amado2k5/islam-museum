  id: ibn-batta-ibana
  standing: main
  stance:
    ar: الإرجاء أضر البدع، والقول بأن الإيمان قول بلا عمل ضلال يُحذَّر من أصحابه
    en: Irja' is the most harmful innovation; the view that faith is word without deed is misguidance whose holders are to be avoided
    ur: ارجاء سب سے نقصان دہ بدعت ہے؛ ایمان کو بغیر عمل کے قول کہنا گمراہی ہے جس کے قائلین سے بچا جائے
  summary:
    ar: يعقد ابن بطة في كتاب الإيمان من الإبانة الكبرى باباً في المرجئة يروي فيه آثاراً في ذمهم، ويصف مقالتهم بأن الإيمان قول بلا عمل، وأن المعرفة بالقلب إيمان يغني عن الطاعة، وأن الإيمان لا يزيد ولا ينقص، ويحكم عليها بالكفر والضلال، ويلزم القائل بأن المعرفة إيمان أن يسوي إبليس وأبا جهل بالأنبياء.
    en: In the Book of Faith of al-Ibana al-Kubra Ibn Batta devotes a chapter to the Murji'a, transmitting reports that censure them; he describes their doctrine as faith being word without deed, knowledge in the heart being a faith that dispenses with obedience, and faith neither increasing nor decreasing; he judges it unbelief and misguidance, and argues that whoever calls knowledge faith must make Iblis and Abu Jahl equal to the prophets.
    ur: الابانہ الکبریٰ کی کتاب الایمان میں ابن بطہ مرجئہ پر ایک باب باندھتے ہیں جس میں ان کی مذمت کے آثار روایت کرتے ہیں؛ وہ ان کا قول یہ بیان کرتے ہیں کہ ایمان بغیر عمل کے قول ہے، دل کی معرفت ایسا ایمان ہے جو اطاعت سے بے نیاز کر دیتا ہے، اور ایمان نہ بڑھتا ہے نہ گھٹتا ہے؛ وہ اسے کفر و گمراہی قرار دیتے ہیں اور کہتے ہیں کہ معرفت کو ایمان کہنے والے کو ابلیس اور ابو جہل کو انبیا کے برابر ماننا پڑے گا۔
