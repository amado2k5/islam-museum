id: group/banu-thabit-tripoli
class: group
kind: tribe
label:
  ar: بنو ثابت رؤساء طرابلس
  en: Banu Thabit, chiefs of Tripoli
  es: "Banu Thabit, jefes de Trípoli"
  fr: "Banu Thabit, chefs de Tripoli"
summary:
  ar: "بنو ثابت، رؤساء مدينة طرابلس وأعمالها من العرب؛ لما استولى العرب الهلاليون على أعمال إفريقية وغلبوا الزناتيين على طرابلس صارت رئاستها لبني ثابت هؤلاء، ودام لهم أمر الرياسة على البلد وضواحيها في طاعة من دانت له دول المغرب من الموحدين والحفصيين إلى عهد ابن خلدون."
  en: "Banu Thabit, the Arab chiefs of the city of Tripoli and its districts; when the Hilali Arabs took the Ifriqiyan lands and wrested Tripoli from the Zanata Khazrunids, its chieftaincy settled on this house, which held the ra'asa over town and suburbs in obedience to whatever Maghreb state — Almohad or Hafsid — held sway, into Ibn Khaldun's own time."
  es: "Los Banu Thabit, los jefes árabes de la ciudad de Trípoli y sus distritos; cuando los árabes Hilali tomaron las tierras Ifriqiya y arrebataron Trípoli a los Zanata Khazruníes, su jefatura se estableció en esta casa, que mantuvo el ra'asa sobre la ciudad y los suburbios en obediencia a cualquier estado magrebí —almohad o hafsí— que estuviera en el poder, hasta la época de Ibn Khaldun."
  fr: "Les Banu Thabit, chefs arabes de la ville de Tripoli et de ses districts; lorsque les Arabes Hilali prirent les terres Ifriqiyan et arrachèrent Tripoli aux Khazrunides Zanata, leur chefferie s'établit sur cette maison, qui détenait le ra'asa sur la ville et les faubourgs en obéissance à l'État maghrébin — almohade ou hafside — qui régnait, jusqu'à l'époque d'Ibn Khaldun."
