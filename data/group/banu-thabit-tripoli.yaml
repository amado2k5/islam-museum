label:
  ar: بنو ثابت رؤساء طرابلس
  en: Banu Thabit, chiefs of Tripoli
summary:
  ar: "بنو ثابت، رؤساء مدينة طرابلس وأعمالها من العرب؛ لما استولى العرب الهلاليون على أعمال إفريقية وغلبوا الزناتيين على طرابلس صارت رئاستها لبني ثابت هؤلاء، ودام لهم أمر الرياسة على البلد وضواحيها في طاعة من دانت له دول المغرب من الموحدين والحفصيين إلى عهد ابن خلدون."
  en: "Banu Thabit, the Arab chiefs of the city of Tripoli and its districts; when the Hilali Arabs took the Ifriqiyan lands and wrested Tripoli from the Zanata Khazrunids, its chieftaincy settled on this house, which held the ra'asa over town and suburbs in obedience to whatever Maghreb state — Almohad or Hafsid — held sway, into Ibn Khaldun's own time."
