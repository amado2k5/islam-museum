label: { ar: "البربر", en: "The Berbers", es: "Los bereberes", fr: "Les Berbères", ur: "بربرز", tr: "Berberler", id: "Berber" }
summary:
  ar: "البربر عند البلاذري عن عبد الله بن صالح: يزعمون أنهم ولد برّ بن قيس وما جعل الله لقيس ولداً يقال له برّ وإنما هم من الجبارين الذين قاتلهم داود وكان منازلهم على أيدي الدهر فلسطين وهم أهل عمود فأتوا المغرب فتناسلوا به؛ ومنهم لواتة أهل العهد ببرقة والمستثنون في خطبة عمرو بن العاص بأنطابلس. وعند البلاذري أن البرابرة من العماليق في قول، وأن تبّعاً يقال له أفريقيس بن قيس بن صيفي الحميري غزا إفريقية فافتتحها فسميت به، وسمع كلام هؤلاء العماليق فقال «ما أكثر بربرتهم» فسموا البرابرة، وأقام معهم بنو صنهاجة وكتامة من حمير فهم فيهم إلى اليوم {cite:ansab-al-ashraf p. 8}"
  en: "The Berbers in al-Baladhuri on Abdallah ibn Salih's report: they claim descent from Barr ibn Qays — but God gave Qays no son called Barr; rather they are of the Jabbarin whom Dawud fought, whose seats in ancient days were Palestine, the people of Amud — who came to the Maghreb and multiplied there; of them are Lawata, the covenant-holders of Barqa, and the Antabulus folk excepted in Amr ibn al-As's sermon."
  es: "Los bereberes en al-Baladhuri sobre el informe de Abdallah ibn Salih: afirman descender de Barr ibn Qays, pero Dios no le dio a Qays ningún hijo llamado Barr; más bien son de los Jabbarin contra quienes luchó Dawud, cuyos asentamientos en la antigüedad eran Palestina, el pueblo de Amud, que llegó al Magreb y se multiplicó allí; de ellos son Lawata, los poseedores del pacto de Barqa, y el pueblo de Antabulus exceptuado en el sermón de Amr ibn al-As."
  fr: "Les Berbères mentionnés dans al-Baladhuri, d'après le récit d'Abdallah ibn Salih: ils prétendent descendre de Barr ibn Qays — mais Dieu n'a donné à Qays aucun fils appelé Barr; ils sont plutôt des Jabbarin que Dawud a combattus, dont les sièges dans les temps anciens étaient la Palestine, le peuple d'Amud — qui est venu au Maghreb et s'y est multiplié; parmi eux se trouvent les Lawata, les détenteurs de l'alliance de Barqa, et le peuple d'Antabulus, excepté dans le sermon d'Amr ibn al-As."
  ur: "البلادوری میں بربر عبداللہ بن صالح کی رپورٹ پر: وہ بر بن قیس سے نسل کا دعویٰ کرتے ہیں لیکن خدا نے قیس کو کوئی بیٹا نہیں دیا جسے برر کہا جاتا ہے۔ بلکہ وہ جابرین میں سے ہیں جن سے داؤد نے جنگ کی، جن کی نشستیں قدیم زمانے میں فلسطین تھیں، عمود کے لوگ - جو مغرب میں آئے اور وہاں بڑھ گئے۔ ان میں سے لواتا، برقع کے عہد دار، اور عمرو بن العاص کے خطبہ میں مستثنیٰ انتابلوس لوگ ہیں۔"
  tr: "El-Baladhuri'ye göre, Abdullah ibn Salih'in rivayetine dayanarak, Berberler Barr ibn Kays'ın soyundan geldiklerini iddia ederler. Ancak Allah Kays'a Barr adında bir oğul vermemiştir. Aksine, onlar Davud'un savaştığı devler arasındadır ve asıl yurtları Filistin'dir. Onlar (Amad kabilesinin) direk halkıydılar ve Mağrip'e (Kuzey Afrika) göç edip orada çoğaldılar. Aralarında Lawata, Barqa'daki ahit halkı ve Trablus'ta Amr ibn el-As'ın hutbesinde dışlananlar da vardır. El-Baladhuri ayrıca Berberlerin Amaleklilerden geldiğini ve Afriqis ibn Kays ibn Sayfi el-Himyari adıyla bilinen Tubba'nın İfriqiya'yı (Kuzey Afrika) işgal edip fethettiğini ve bu bölgenin onun adıyla anıldığını belirtir. Bu Amaleklilerin konuşmalarını duyup \"Ne kadar da gevezelik ediyorlar!\" demiş ve bu yüzden onlara Berberler denmiştir. Himyar'dan Banu Sanhaja ve Kutama kabileleri onlarla birlikte yerleştiler ve bugüne kadar aralarında yaşamaya devam ediyorlar. {kaynak:ansab-al-ashraf s. 8}"
  id: "Menurut al-Baladhuri, berdasarkan riwayat Abdullah ibn Salih, orang Berber mengaku sebagai keturunan Barr ibn Qays. Namun, Allah tidak menganugerahi Qays seorang putra bernama Barr. Sebaliknya, mereka termasuk di antara raksasa yang diperangi Daud, dan tanah asal mereka adalah Palestina. Mereka adalah kaum pilar (dari suku Amad), dan mereka bermigrasi ke Maghreb (Afrika Utara) dan berkembang biak di sana. Di antara mereka adalah Lawata, kaum perjanjian di Barqa, dan mereka yang dikecualikan dalam khutbah Amr ibn al-As di Tripoli. Al-Baladhuri juga menyatakan bahwa orang Berber berasal dari Amalek, dan bahwa Tubba', yang bernama Afriqis ibn Qays ibn Sayfi al-Himyari, menyerbu dan menaklukkan Ifriqiya (Afrika Utara), yang kemudian dinamai menurut namanya. Dia mendengar ucapan orang-orang Amalek ini dan berkata, \"Betapa banyak mereka mengoceh!\" sehingga mereka disebut orang Berber. Bani Sanhaja dan Kutama dari Himyar menetap bersama mereka, dan mereka tetap berada di antara mereka hingga hari ini. {cite:ansab-al-ashraf p. 8}"
