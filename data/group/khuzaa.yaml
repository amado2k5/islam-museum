label: { en: "Khuza'a", ar: "خزاعة" }
summary:
  en: "The tribe of the Meccan lowland, long allied to the Prophet's house by marriage and oath; it entered his pact at Hudaybiyya, was attacked at al-Watir by Banu Bakr with Quraysh's secret aid, and its appeal to Medina set off the conquest of Mecca."
  ar: "قبيلة تهامة جاورت مكة وصاهرت بيت النبوة؛ دخلت في عقد النبي وعهده يوم صلح الحديبية، فاعتدت عليها بنو بكر على ماء الوتير بمظاهرة قريش، فاستغاثت بالمدينة فكان في استغاثتها ما هاج فتح مكة. وعند المسعودي أنها سميت خزاعة لانخزاعها في بطن مر عمن كان معها من الناس وهم بنو عمرو بن لحي فتخزعت هنالك حين وجهها الكاهن عمران بن عامر بقوله من كان ذا حاجة ووطر وسياسة ونظر وصبر على أزمات الدهر فليلحق ببطن مر، وفي ذلك يقول حسان ولما هبطنا بطن مر تخزعت خزاعة منا في ملوك كراكر {cite:muruj-al-dhahab p. 497}، وعند البلاذري قويت على جرهم بعد الطاعون وغلبت على البيت وأخرجتهم من مكة {cite:ansab-al-ashraf p. 8}"
