label: { en: "Khuza'a", ar: "خزاعة", es: "Khuza'a", fr: "Khuza'a", ur: "خزاعہ", tr: "Khuza'a", id: "Khuza'a" }
summary:
  en: "The tribe of the Meccan lowland, long allied to the Prophet's house by marriage and oath; it entered his pact at Hudaybiyya, was attacked at al-Watir by Banu Bakr with Quraysh's secret aid, and its appeal to Medina set off the conquest of Mecca."
  ar: "قبيلة تهامة جاورت مكة وصاهرت بيت النبوة؛ دخلت في عقد النبي وعهده يوم صلح الحديبية، فاعتدت عليها بنو بكر على ماء الوتير بمظاهرة قريش، فاستغاثت بالمدينة فكان في استغاثتها ما هاج فتح مكة. وعند المسعودي أنها سميت خزاعة لانخزاعها في بطن مر عمن كان معها من الناس وهم بنو عمرو بن لحي فتخزعت هنالك حين وجهها الكاهن عمران بن عامر بقوله من كان ذا حاجة ووطر وسياسة ونظر وصبر على أزمات الدهر فليلحق ببطن مر، وفي ذلك يقول حسان ولما هبطنا بطن مر تخزعت خزاعة منا في ملوك كراكر {cite:muruj-al-dhahab p. 497}، وعند البلاذري قويت على جرهم بعد الطاعون وغلبت على البيت وأخرجتهم من مكة {cite:ansab-al-ashraf p. 8}"
  es: "La tribu de la llanura de La Meca, aliada desde hacía mucho tiempo a la casa del Profeta por matrimonio y juramento, que firmó su pacto en Hudaybiyya, fue atacada en al-Watir por los Banu Bakr con la ayuda secreta de los Quraysh, y su apelación a Medina desencadenó la conquista de La Meca."
  fr: "La tribu des basses terres de La Mecque, longtemps alliée à la maison du Prophète par le mariage et le serment; elle entra dans son pacte à Hudaybiyya, fut attaquée à al-Watir par Banu Bakr avec l'aide secrète de Quraysh, et son appel à Médine déclencha la conquête de La Mecque."
  ur: "مکہ کے نشیبی علاقے کا قبیلہ، شادی اور حلف کے ذریعے نبی کے گھر سے طویل عرصے سے وابستہ تھا۔ اس نے حدیبیہ میں اپنا معاہدہ کیا، قریش کی خفیہ مدد سے بنو بکر نے الطیر پر حملہ کیا، اور مدینہ سے اس کی اپیل نے مکہ کی فتح کو روک دیا۔"
  tr: "Tihama kabilesi Mekke yakınlarında yaşıyordu ve Peygamber ailesiyle evlilik yoluyla akrabalık kurmuştu. Hudeybiye Antlaşması günü Peygamber'in ahdine ve sözleşmesine girdiler. Beni Bekir, Kureyş'in desteğiyle Vâtir sulama yerinde onlara saldırdı. Medine'den yardım istediler ve yardım talepleri Mekke'nin fethine katkıda bulundu. Mesudit'e göre, yanlarında bulunan Beni Amr ibn Luhayy'dan ayrılarak Murr vadisine çekildikleri için Huze'ye adını aldılar. Kahin İmran ibn Amir'in, \"İhtiyacı, arzusu, siyasi zekası ve zamanın zorluklarına dayanma gücü olan herkes Murr vadisine katılsın\" demesi üzerine oraya çekildiler. Hasan bu konuda şöyle demiştir: \"Murr vadisine indiğimizde, Huzeyye Karakir kralları arasında bizden ayrıldı\" (kaynak: Muruj-al-Dhahab, s. 497). El-Baladhuri'ye göre, veba salgınından sonra Jurhum üzerinde güç kazandılar, Kâbe'yi ele geçirdiler ve onları Mekke'den kovdular (kaynak: Ansab-al-Ashraf, s. 8)."
  id: "Suku Tihama tinggal di dekat Mekah dan menikah dengan keluarga Nabi. Mereka memasuki perjanjian dan kesepakatan Nabi pada hari Perjanjian Hudaybiyyah. Bani Bakr menyerang mereka di tempat pengambilan air al-Watir, dengan dukungan Quraisy. Mereka meminta bantuan dari Madinah, dan permohonan bantuan mereka berkontribusi pada penaklukan Mekah. Menurut al-Mas'udi, mereka disebut Khuza'ah karena mereka mundur ke lembah Murr dari orang-orang yang bersama mereka, yaitu Bani 'Amr ibn Luhayy. Mereka mundur ke sana setelah peramal 'Imran ibn 'Amir mengarahkan mereka, dengan mengatakan, \"Siapa pun yang memiliki kebutuhan, keinginan, kecerdasan politik, dan kemampuan untuk menanggung cobaan zaman hendaknya bergabung dengan lembah Murr.\" Hassan berkata tentang hal ini, \"Ketika kami turun ke lembah Murr, Khuza'ah menarik diri dari kami di antara raja-raja Karakir\" (kutip: Muruj-al-Dhahab hlm. 497). Menurut al-Baladhuri, mereka memperoleh kekuasaan atas Jurhum setelah wabah, menaklukkan Ka'bah, dan mengusir mereka dari Mekah (kutip: Ansab-al-Ashraf hlm. 8)."
