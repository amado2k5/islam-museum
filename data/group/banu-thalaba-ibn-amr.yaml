  id: "Cabang dari suku Aws di Yathrib, dari mana berasal Ubadah ibn al-Samit, pemimpin Aqaba, al-Harith ibn al-Simmah, dan Usayd ibn Hudayr al-Badri; dari keluarga Aws yang berbaiat pada malam Aqaba dan kebaikan mereka melimpah dalam Islam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
