summary:
  ar: "بطن من بكر بن وائل بن قاسط، بيت الملوك في بكر قبل الإسلام؛ منه عمرو بن هند الجبان ملك المناذرة، ومنه هانئ بن قبيصة الشيباني صاحب حادثة يوم ذي قار {cite:tarikh-al-tabari}."
  en: "A batn of Bakr ibn Wa'il — the royal house of Bakr before Islam; from it Amr ibn Hind the tyrant king of the Lakhmid vassals and Hani ibn Qabisa of the Dhi Qar affair {cite:tarikh-al-tabari}."
  ur: "بکر بن وائل کا بطن تیم اللات — اسلام سے پہلے بکر کا شاہی گھرانہ، ذی قار کے ہانی بن قبیصہ اسی سے۔"
  es: "Un batn de Bakr ibn Wa'il — la casa real de Bakr antes del Islam; de él Amr ibn Hind el rey tirano de los vasallos Lakhmid y Hani ibn Qabisa del asunto Dhi Qar {cite:tarikh-al-tabari}."
  fr: "Une batn de Bakr ibn Wa'il — la maison royale de Bakr avant l'Islam; de là sont issus Amr ibn Hind, le roi tyran des vassaux Lakhmid et Hani ibn Qabisa de l'affaire Dhi Qar {cite:tarikh-al-tabari}."
  tr: "İslam öncesi dönemde Bakr'daki kralların ailesi olan Bakr ibn Wael ibn Qasit'in bir kolu; bu koldan Lahmilerin kralı Amr ibn Hind al-Jubban ve ondan da Zıkar günü olayına karışan Hani ibn Qubaysah al-Shaybani gelmiştir. {Kaynak: Tarik-i Tebrih}"
  id: "Cabang dari Bakr ibn Wael ibn Qasit, keluarga raja-raja di Bakr sebelum Islam; darinya lahirlah Amr ibn Hind al-Jubban, raja Lakhmids, dan darinya lahirlah Hani ibn Qubaysah al-Shaybani, orang yang terlibat dalam peristiwa hari Dhi Qar {cite:tarikh-al-tabari}."
