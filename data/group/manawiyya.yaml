label: { ar: "المانوية", en: "Manawiyya" }
summary:
  ar: "المانوية أصحاب ماني بن فتق، مذهبه استخرجه من المجوسية والنصرانية: أن مبدأ العالم كونين أحدهما نور والآخر ظلمة كل واحد منفصل عن الآخر، فالنور العظيم الأول وهو الإله ملك جنان النور له خمسة أعضاء الحلم والعلم والعقل والغيب والفطنة وخمسة أخر روحانية الحب والإيمان والوفاء والمروءة والحكمة، ومعه شيئان أزليان الجو والأرض وأعضاؤهما خمسة، والكون الآخر الظلمة أعضاؤها خمسة الضباب والحريق والسموم والسم والظلمة، والكون النير مجاور للكون المظلم لا حاجز بينهما {cite:fihrist-ibn-al-nadim p. 458-459}.، وذكر ابن النديم شريعة ماني: عشر فرائض على السماعين وثلاث خواتيم وصيام سبعة أيام في كل شهر والإيمان بالمظاهر الأربع الله ونوره وقوته وحكمته، والفرائض ترك عبادة الأصنام والكذب والبخل والقتل والزنا والسرقة، وصلوات أربع أو سبع عند الزوال وبين الزوال والمغرب وبعد المغرب والعتمة، وللصديق عند الوفاة ركوة ولباس وعصابة وتاج وإكليل نور يعرج به في عمود السبح إلى فلك القمر والإنسان القديم، وأئمتهم بعد ماني سيس ثم يتناولون الدين {cite:fihrist-ibn-al-nadim p. 465-469}"
  en: "The Manichees — the two-eternal-realms doctrine as the Fihrist details it {cite:fihrist-ibn-al-nadim}"
sources: [source/fihrist-ibn-al-nadim]
