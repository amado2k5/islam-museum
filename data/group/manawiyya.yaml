label: { ar: "المانوية", en: "Manawiyya", es: "Manawiyya", fr: "Manawiyya", ur: "مناویہ", tr: "Maniheizm", id: "Manikeisme" }
summary:
  ar: "المانوية أصحاب ماني بن فتق، مذهبه استخرجه من المجوسية والنصرانية: أن مبدأ العالم كونين أحدهما نور والآخر ظلمة كل واحد منفصل عن الآخر، فالنور العظيم الأول وهو الإله ملك جنان النور له خمسة أعضاء الحلم والعلم والعقل والغيب والفطنة وخمسة أخر روحانية الحب والإيمان والوفاء والمروءة والحكمة، ومعه شيئان أزليان الجو والأرض وأعضاؤهما خمسة، والكون الآخر الظلمة أعضاؤها خمسة الضباب والحريق والسموم والسم والظلمة، والكون النير مجاور للكون المظلم لا حاجز بينهما {cite:fihrist-ibn-al-nadim p. 458-459}. وذكر ابن النديم شريعة ماني: عشر فرائض على السماعين وثلاث خواتيم وصيام سبعة أيام في كل شهر والإيمان بالمظاهر الأربع الله ونوره وقوته وحكمته، والفرائض ترك عبادة الأصنام والكذب والبخل والقتل والزنا والسرقة، وصلوات أربع أو سبع عند الزوال وبين الزوال والمغرب وبعد المغرب والعتمة، وللصديق عند الوفاة ركوة ولباس وعصابة وتاج وإكليل نور يعرج به في عمود السبح إلى فلك القمر والإنسان القديم، وأئمتهم بعد ماني سيس ثم يتناولون الدين {cite:fihrist-ibn-al-nadim p. 465-469}، وأول من دخل بلاد ما وراء النهر من غير السمنية من الأديان المنانية، فلما قتل كسرى ماني وقتل أصحابه هربوا حتى عبروا نهر بلخ ودخلوا مملكة خان ملك الترك فكانوا عنده، وعادوا في أيام ملوك بني أمية وكان خالد بن عبد الله القسري يعني بهم وإنما كانت الرياسة تعقد ببابل، واجتمع منهم بسمرقند نحو خمسمائة رجل فأراد صاحب خراسان قتلهم فأرسل إليه ملك الصين يقول إن في بلادي من المسلمين أضعاف من في بلادك من أهل ديني وحلف إن قتل واحدا منهم قتلهم وأخرب المساجد فكف عنهم وأخذ منهم الجزية، وكان ابن النديم يعرف منهم بمدينة السلام في أيام معز الدولة نحو ثلاثمائة وفي وقته ليس بالحضرة منهم خمسة أنفس، وكان البرامكة كلهم عند قوم زنادقة إلا محمد بن خالد، وقتل المهدي كاتبه محمد بن عبيد الله بعد أن اعترف بالزندقة، وقرأ ابن النديم بخط أهل المذهب أن المأمون كان منهم وكذبه في ذلك {cite:fihrist-ibn-al-nadim p. 471-473}"
  en: "The Manichees — the two-eternal-realms doctrine as the Fihrist details it {cite:fihrist-ibn-al-nadim}"
  es: "Los maniqueos: la doctrina de los dos reinos eternos, tal como la detalla el Fihrist {cite:fihrist-ibn-al-nadim}"
  fr: "Les Manichéens — la doctrine des deux royaumes éternels telle que Fihrist la détaille {cite:fihrist-ibn-al-nadim}"
  ur: "مانیچیز - دو ابدی دائروں کا نظریہ جیسا کہ فہرسٹ اس کی تفصیلات بیان کرتے ہیں"
  tr: "Mani ibn Fatık'ın, doktrinini Zerdüştlük ve Hristiyanlıktan çıkardığı Maniheistler, dünyanın kökeninin, biri ışık diğeri karanlık olmak üzere, birbirinden ayrı iki âlem olduğuna inanırlar. İlk büyük ışık, yani Tanrı, ışık göklerinin kralı, beş bölümden oluşur: rüya, bilgi, akıl, görünmeyen ve ayırt etme yeteneği; ve beş manevi bölüm daha: sevgi, iman, sadakat, şövalyelik ve bilgelik. Bununla birlikte iki ebedi şey vardır: atmosfer ve yeryüzü ve bunların da beş bölümü vardır. Diğer âlem karanlıktır ve onun da beş bölümü vardır: sis, ateş, zehirler, zehir ve karanlık. Aydınlık âlem, karanlık âleme bitişiktir ve aralarında hiçbir engel yoktur. {cite:fihrist-ibn-al-nadim p. 458-459} İbn el-Nadim, Mani'nin kanunundan bahsetmiştir: Dinleyiciler için on farz, üç kapanış namazı, her ay yedi gün oruç ve dört tezahüre iman: Allah, nuru, gücü ve hikmeti. Farz olanlar, putlara tapınmayı, yalan söylemeyi, cimriliği, cinayeti, zinayı ve hırsızlığı terk etmektir. Öğle vakti, öğle ile gün batımı arasında, gün batımından sonra ve gece vakti olmak üzere dört veya yedi namaz vardır. Ölüm anında dost için bir kahvelik, giysi, alın bandı, taç ve tesbih sütununda ay küresine ve eski insanın dünyasına yükseldiği bir nur çelengi vardır. Mani'den sonra imamları Sis'tir, sonra da dine yönelirler. {cite:fihrist-ibn-al-nadim s. 465-469 yılları arasında, Transoksanya'ya giren ilk Samniyye dışı Maniheistler, Hüsrev Mani ve takipçilerini öldürdüğünde, Belh Nehri'ni geçip Türklerin kralı Han'ın krallığına giren ve onunla kalanlardı. Emevi halifeleri döneminde geri döndüler ve liderlik Babil'de olmasına rağmen Halid ibn Abdullah el-Kasri onlarla ilgilendi. Yaklaşık beş yüz kişi Semerkant'ta toplandı ve Horasan hükümdarı onları öldürmek istedi, ancak Çin kralı ona, kendi topraklarında kendi topraklarından çok daha fazla Müslüman olduğunu belirten bir mesaj gönderdi ve eğer birini öldürürse hepsini öldüreceğine ve camileri yıkacağına yemin etti. Bu yüzden onları öldürmekten vazgeçti ve onlardan cizye (vergi) aldı. İbn el-Nadim, Mu'izz el-Dawla'nın hükümdarlığı döneminde Bağdat'ta onlardan yaklaşık üç yüz tanesini biliyordu, ancak kendi zamanında başkentte onlardan beş tane bile yoktu. Muhammed ibn Halid hariç, tüm Barmakidler bir grup insan tarafından sapkın olarak kabul ediliyordu. El-Mehdi, kâtibi Muhammed ibn Ubeyd Allah'ı sapkınlığı itiraf ettikten sonra öldürdü. İbn el-Nadim, mezhep mensuplarının el yazısında el-Ma'mun'un onlardan biri olduğunu okudu ve bu konuda onu reddetti. {cite:fihrist-ibn-al-nadim s. 471-473}"
  id: "Kaum Manikeisme, pengikut Mani ibn Fatiq, yang ajarannya ia ambil dari Zoroastrianisme dan Kekristenan, percaya bahwa asal mula dunia adalah dua alam, satu alam terang dan yang lainnya alam gelap, masing-masing terpisah satu sama lain. Cahaya agung pertama, yaitu Tuhan, raja langit terang, memiliki lima bagian: mimpi, pengetahuan, akal budi, hal gaib, dan kebijaksanaan, dan lima bagian spiritual lainnya: cinta, iman, kesetiaan, kesatriaan, dan kearifan. Bersamanya ada dua hal abadi: atmosfer dan bumi, dan bagian-bagiannya ada lima. Alam lainnya adalah kegelapan, dan bagian-bagiannya ada lima: kabut, api, racun, dan kegelapan. Alam terang bersebelahan dengan alam gelap, tanpa penghalang di antara keduanya. {cite:fihrist-ibn-al-nadim p. 458-459} Ibn al-Nadim menyebutkan hukum Mani: sepuluh kewajiban bagi para pendengar, tiga shalat penutup, puasa tujuh hari setiap bulan, dan kepercayaan pada empat manifestasi: Tuhan, cahaya-Nya, kekuasaan-Nya, dan kebijaksanaan-Nya. Kewajibannya adalah meninggalkan penyembahan berhala, berbohong, kikir, pembunuhan, perzinahan, dan pencurian. Ada empat atau tujuh shalat pada tengah hari, antara tengah hari dan matahari terbenam, setelah matahari terbenam, dan saat senja. Untuk sahabat pada saat kematian, ada teko kopi, pakaian, ikat kepala, mahkota, dan karangan bunga cahaya yang dengannya ia naik di tiang Rosario ke alam bulan dan manusia purba. Imam mereka setelah Mani adalah Sis, kemudian mereka memeluk agama. {cite:fihrist-ibn-al-nadim p. 465-469}, dan yang pertama dari kaum Manikeisme non-Samniyya yang memasuki Transoxiana adalah mereka yang, ketika Khosrow membunuh Mani dan para pengikutnya, melarikan diri hingga menyeberangi Sungai Balkh dan memasuki kerajaan Khan, raja Turki, dan tinggal bersamanya. Mereka kembali selama pemerintahan khalifah Umayyah, dan Khalid ibn Abdullah al-Qasri memperhatikan mereka, meskipun kepemimpinan dipegang di Babilonia. Sekitar lima ratus dari mereka berkumpul di Samarkand, dan penguasa Khurasan ingin membunuh mereka, tetapi raja Tiongkok mengiriminya pesan yang mengatakan bahwa ada jauh lebih banyak Muslim yang beriman kepadanya di wilayahnya daripada di wilayahnya sendiri, dan dia bersumpah bahwa jika dia membunuh salah satu dari mereka, dia akan membunuh mereka semua dan menghancurkan masjid-masjid. Jadi dia menahan diri untuk tidak membunuh mereka dan mengambil jizya (upeti) dari mereka. Ibn al-Nadim mengetahui keberadaan sekitar tiga ratus orang dari mereka di Baghdad selama pemerintahan Mu'izz al-Dawla, tetapi pada zamannya tidak ada lima orang pun dari mereka di ibu kota. Semua pengikut Barmakid dianggap sesat oleh sekelompok orang, kecuali Muhammad ibn Khalid. Al-Mahdi membunuh juru tulisnya, Muhammad ibn Ubayd Allah, setelah ia mengaku sesat. Ibn al-Nadim membaca tulisan tangan orang-orang dari mazhab tersebut bahwa al-Ma'mun adalah salah satu dari mereka, dan ia membantahnya. {cite:fihrist-ibn-al-nadim p. 471-473"
