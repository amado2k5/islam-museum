summary:
  ar: "الروم عند العرب بنو الأصفر: الرومان البيزنطيون أهل القسطنطينية والشام قبل الإسلام؛ سورة الروم افتتحت بغلبهم ثم غلبتهم «ألم غلبت الروم في أدنى الأرض»، وهم الذين عندهم كسرى كسر مكتوب النبي وقيصر أكرمه {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
  en: "Al-Rum to the Arabs are the 'sons of the Yellow' — the Byzantine Romans of Constantinople and al-Sham before Islam. Surah al-Rum opens with their defeat then their victory «Alif-Lam-Mim, the Romans have been defeated» (30:1-2), and theirs is Caesar who honoured the Prophet's letter where Chosroes tore it {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
