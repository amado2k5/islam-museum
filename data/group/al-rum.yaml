label: { ar: "الروم", en: "Al-Rum (the Romans/Byzantines)", es: "Al-Rum (los romanos/bizantinos)", fr: "Al-Rum (les Romains/Byzantins)", ur: "الروم ⁦(رومی / بازنطینی)⁩", tr: "Romalılar", id: "orang Romawi" }
summary:
  ar: "الروم عند العرب بنو الأصفر: الرومان البيزنطيون أهل القسطنطينية والشام قبل الإسلام؛ سورة الروم افتتحت بغلبهم ثم غلبتهم «ألم غلبت الروم في أدنى الأرض»، وهم الذين عندهم كسرى كسر مكتوب النبي وقيصر أكرمه {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
  en: "Al-Rum to the Arabs are the 'sons of the Yellow' — the Byzantine Romans of Constantinople and al-Sham before Islam. Surah al-Rum opens with their defeat then their victory «Alif-Lam-Mim, the Romans have been defeated» (30:1-2), and theirs is Caesar who honoured the Prophet's letter where Chosroes tore it {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
  es: "Para los árabes, Al-Rum son los 'hijos de los amarillos': los romanos bizantinos de Constantinopla y al-Sham antes del Islam. La Sura Al-Rum comienza con su derrota y luego su victoria «Alif-Lam-Mim, los romanos han sido derrotados» (30:1-2), y de ellos es César quien honró la carta del Profeta donde Cosroes la rompió {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
  fr: "Pour les Arabes, Al-Rum désigne les « fils du Jaune », c'est-à-dire les Byzantins de Constantinople et du Levant avant l'islam. La sourate Al-Rum s'ouvre sur leur défaite puis leur victoire: « Alif-Lam-Mim, les Romains ont été vaincus » (30:1-2). Parmi eux figure César, qui a honoré la lettre du Prophète là où Chosroès l'avait déchirée."
  ur: "عربوں کے لیے الروم 'پیلے کے بیٹے' ہیں - قسطنطنیہ کے بازنطینی رومی اور اسلام سے پہلے الشام۔ سورہ روم ان کی شکست کے ساتھ کھلتی ہے پھر ان کی فتح «الف-لام-میم، رومیوں کو شکست ہوئی ہے» (30:1-2)، اور ان کا قیصر ہے جس نے پیغمبر کے اس خط کی تعظیم کی جہاں چوسرو نے اسے پھاڑ دیا۔"
  tr: "Araplara göre Romalılar, El-Aşer'in oğullarıdır: Bizanslı Romalılar, İslam öncesi Konstantinopolis ve Levant halkı; Rum Suresi onların yenilgisiyle başlar, sonra da yenilgiye uğrarlar: \"Elif Lam Mim. Romalılar en yakın topraklarda yenilgiye uğradılar.\" Onlar, Peygamberin mektubunu bozan bir krala sahip olan ve Sezar'ın ona saygı gösterdiği kişilerdir. {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
  id: "Menurut orang Arab, bangsa Romawi adalah keturunan Al-Asfar: bangsa Romawi Bizantium, penduduk Konstantinopel dan Levant sebelum Islam; Surah Ar-Rum dimulai dengan kekalahan mereka, kemudian mereka dikalahkan: “Alif Lam Mim. Bangsa Romawi telah dikalahkan di negeri terdekat.” Mereka adalah orang-orang yang memiliki raja yang melanggar surat Nabi dan Kaisar menghormatinya. {cite:tafsir-tabari-shakir-v01} {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira}."
