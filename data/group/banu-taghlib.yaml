label: { ar: "بنو تغلب بن وائل", en: "Banu Taghlib ibn Wa'il" }
summary:
  ar: "بنو تغلب بن وائل من ربيعة، وكثير منهم على النصرانية في الجزيرة؛ اشتهر فيهم قول زرعة بن النعمان لعمر «قوم من العرب نائفون من الجزية» فصالحهم على ضعف الصدقة التي تؤخذ من المسلمين في الأرض والسائمة دون جزية الأعلاج على أن لا ينصّروا أولادهم — وفي ذلك خلاف فقهي وكلام لعلي في نقضهم بترك الذمة — ومنهم مالك بن طوق صاحب الرحبة ومن جاورهم في ديار ربيعة."
  en: "Banu Taghlib ibn Wa'il of Rabi'a, many of them Christian in the Jazira; famed for Zur'a ibn al-Nu'man's words to Umar — 'a people of Arabs who would scorn the jizya' — so he compounded with them for double the sadaqa taken of Muslims on land and herds, not foreigners' jizya, on condition they not Christianise their children, a clause over which jurists differed and Ali censured their breach; of them is Malik ibn Tawq, lord of al-Rahba."
