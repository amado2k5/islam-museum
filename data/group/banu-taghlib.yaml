label: { ar: "بنو تغلب بن وائل", en: "Banu Taghlib ibn Wa'il", es: "Banu Taghlib ibn Wa'il", fr: "Banu Taghlib ibn Wa'il", ur: "بنو تغلب ابن وائل", tr: "Banu Taghlib ibn Wa'il", id: "Banu Taghlib ibn Wa'il" }
summary:
  ar: "بنو تغلب بن وائل من ربيعة، وكثير منهم على النصرانية في الجزيرة؛ اشتهر فيهم قول زرعة بن النعمان لعمر «قوم من العرب نائفون من الجزية» فصالحهم على ضعف الصدقة التي تؤخذ من المسلمين في الأرض والسائمة دون جزية الأعلاج على أن لا ينصّروا أولادهم — وفي ذلك خلاف فقهي وكلام لعلي في نقضهم بترك الذمة — ومنهم مالك بن طوق صاحب الرحبة ومن جاورهم في ديار ربيعة."
  en: "Banu Taghlib ibn Wa'il of Rabi'a, many of them Christian in the Jazira; famed for Zur'a ibn al-Nu'man's words to Umar — 'a people of Arabs who would scorn the jizya' — so he compounded with them for double the sadaqa taken of Muslims on land and herds, not foreigners' jizya, on condition they not Christianise their children, a clause over which jurists differed and Ali censured their breach; of them is Malik ibn Tawq, lord of al-Rahba."
  es: "Banu Taghlib ibn Wa'il de Rabi'a, muchos de ellos cristianos en la Jazira; famosos por las palabras de Zur'a ibn al-Nu'man a Umar: \"un pueblo de árabes que despreciaría la jizya\", por lo que llegó a un acuerdo con ellos para que se les cobrara el doble de la sadaqa tomada a los musulmanes sobre tierras y rebaños, no la jizya de los extranjeros, con la condición de que no cristianizaran a sus hijos, una cláusula sobre la que los juristas discreparon y Ali censuró su incumplimiento; entre ellos se encuentra Malik ibn Tawq, señor de al-Rahba."
  fr: "Banu Taghlib ibn Wa'il de Rabi'a, dont beaucoup étaient chrétiens dans la Jazira; célèbre pour les paroles de Zur'a ibn al-Nu'man à Umar — « un peuple d'Arabes qui mépriserait la jizya » — il a donc conclu un accord avec eux pour le double de la sadaqa prélevée sur les terres et les troupeaux des musulmans, et non la jizya des étrangers, à condition qu'ils ne christianisent pas leurs enfants, une clause sur laquelle les juristes étaient en désaccord et Ali a blâmé leur violation; parmi eux se trouve Malik ibn Tawq, seigneur d'al-Rahba."
  ur: "ربیعہ کے بنو تغلب بن وائل، جن میں سے بہت سے جزیرہ میں عیسائی ہیں۔ عمر کے بارے میں زرعہ بن نعمان کے کہے گئے الفاظ کے لیے مشہور تھے - 'عرب کے لوگ جو جزیہ کو حقیر سمجھتے ہیں' - اس لیے اس نے ان کے ساتھ زمینوں اور ریوڑیوں پر مسلمانوں سے لیے گئے صدقہ کو دوگنا کیا، نہ کہ غیر ملکیوں کا جزیہ، اس شرط پر کہ وہ اپنے بچوں کو عیسائی نہ بنائیں، اس شق پر فقہاء کا اختلاف ہے؛ ان میں سے مالک بن توق ہیں۔"
  tr: "Rabi'ah'tan Beni Taghlib ibn Wa'il kabilesi ve bunların birçoğu adada Hristiyandır; Zur'ah ibn al-Nu'man, Ömer'e, \"Cizye'ye karşı çıkan bir grup Arap\" demiştir. Bunun üzerine Ömer, Müslümanlardan toprak ve hayvan vergisi olarak alınan sadakanın iki katını, Arap olmayanlardan alınan cizye hariç olmak üzere, çocuklarını Hristiyanlığa geçirmemeleri şartıyla onlarla barışmıştır. Bu konuda görüş ayrılığı vardır ve Ali, bu anlaşmayı bozarak ahdi terk ettiklerini söylemiştir. Bunların arasında el-Rahbah'ın sahibi Malik ibn Tawq ve Rabi'ah topraklarında onların yakınlarında yaşayanlar da bulunmaktadır."
  id: "Banu Taghlib ibn Wa’il dari Rabi’ah, dan banyak dari mereka adalah orang Kristen di pulau itu; Zur’ah ibn al-Nu’man terkenal berkata kepada Umar, “Sekelompok orang Arab yang menentang jizya,” maka beliau berdamai dengan mereka berdasarkan dua kali lipat zakat yang diambil dari Muslim atas tanah dan ternak, tanpa jizya non-Arab, dengan syarat mereka tidak mengislamkan anak-anak mereka — dan ada perbedaan pendapat mengenai hal ini, dan Ali berbicara tentang mereka yang melanggar perjanjian tersebut dengan meninggalkan kesepakatan — dan di antara mereka adalah Malik ibn Tawq, pemilik al-Rahbah, dan orang-orang yang tinggal di dekat mereka di tanah Rabi’ah."
