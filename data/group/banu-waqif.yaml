label: { ar: "بنو واقف", en: "Banu Waqif" }
summary:
  ar: "بطن من الأوس نسب إليها ابن إسحاق هلال بن أمية الواقفي أحد الثلاثة المخلفين؛ وعند السمهودي نزلوا مع بني السلم ابني امرئ القيس بن مالك بن الأوس عند مسجد الفضيخ، وابتنوا أطماً يقال له «الزيدان» وكانت عامة موضعه في قبلة مسجد الفضيخ {cite:samhudi-wafa-al-wafa p. 207-208}؛ وكانوا من «أوس الله» الذين وقف بهم أبو قيس بن الأسلت عن الإسلام حتى مضت بدر وأحد والخندق ثم أسلموا كلهم {cite:samhudi-wafa-al-wafa p. 239-240}."
  en: "A clan of the Aws to which Ibn Ishaq ascribes Hilal ibn Umayya al-Waqifi, one of the three left behind; in al-Samhudi they settled with Banu al-Salm (sons of Imru' al-Qays ibn Malik al-Awsi) by the Fadikh mosque, and built the utm 'al-Zaydan' whose site lay mostly south of that mosque {cite:samhudi-wafa-al-wafa p. 207-208}."
