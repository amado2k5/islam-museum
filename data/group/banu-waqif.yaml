label: { ar: "بنو واقف", en: "Banu Waqif", es: "Banu Waqif", fr: "Banu Waqif" }
summary:
  ar: "بطن من الأوس نسب إليها ابن إسحاق هلال بن أمية الواقفي أحد الثلاثة المخلفين؛ وعند السمهودي نزلوا مع بني السلم ابني امرئ القيس بن مالك بن الأوس عند مسجد الفضيخ، وابتنوا أطماً يقال له «الزيدان» وكانت عامة موضعه في قبلة مسجد الفضيخ {cite:samhudi-wafa-al-wafa p. 207-208}؛ وكانوا من «أوس الله» الذين وقف بهم أبو قيس بن الأسلت عن الإسلام حتى مضت بدر وأحد والخندق ثم أسلموا كلهم {cite:samhudi-wafa-al-wafa p. 239-240}."
  en: "A clan of the Aws to which Ibn Ishaq ascribes Hilal ibn Umayya al-Waqifi, one of the three left behind; in al-Samhudi they settled with Banu al-Salm (sons of Imru' al-Qays ibn Malik al-Awsi) by the Fadikh mosque, and built the utm 'al-Zaydan' whose site lay mostly south of that mosque {cite:samhudi-wafa-al-wafa p. 207-208}."
  es: "Un clan de los Aws al que Ibn Ishaq atribuye a Hilal ibn Umayya al-Waqifi, uno de los tres que quedaron atrás; en al-Samhudi se establecieron con Banu al-Salm (hijos de Imru' al-Qays ibn Malik al-Awsi) junto a la mezquita Fadikh, y construyeron el utm 'al-Zaydan' cuyo emplazamiento se encontraba mayormente al sur de esa mezquita {cite:samhudi-wafa-al-wafa p. 207-208}."
  fr: "Un clan des Aws auquel Ibn Ishaq attribue Hilal ibn Umayya al-Waqifi, l'un des trois laissés sur place; à al-Samhudi, ils s'installèrent avec les Banu al-Salm (fils d'Imru' al-Qays ibn Malik al-Awsi) près de la mosquée Fadikh, et construisirent l'utm 'al-Zaydan' dont le site se trouvait principalement au sud de cette mosquée {cite:samhudi-wafa-al-wafa p. 207-208}."
