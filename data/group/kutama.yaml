summary:
  ar: "بطن من برابرة البَرَنِس بالمغرب وأشدهم بأساً وأطولهم باعاً في الملك؛ نسبهم نسابة العرب إلى حمير على ما ذكر ابن الكلبي والطبري؛ موطنهم أرياف قسطنطينة إلى تخوم بجاية وجبل أوراس، ولهم قصور كتامة بالمغرب، ومنهم قامت دعوة الشيعة التي تناولوا بها الملك من أيدي الأغالبة {cite:tarikh-ibn-khaldun-ibar p. 1627}."
  en: "Kutama, the toughest branch of the Baranis Berbers — claimed by Arab genealogists as Himyarite; settled between Constantine's countryside and Auras, and the tribe whose shi'i da'wa took the realm from the Aghlabids {cite:tarikh-ibn-khaldun-ibar p. 1627}."
  es: "Kutama, la rama más dura de los bereberes Baranis —reivindicados por los genealogistas árabes como himyaritas— se asentó entre la campiña de Constantino y Auras, y la tribu cuya da'wa chiíta tomó el reino de los aglabíes {cite:tarikh-ibn-khaldun-ibar p. 1627}."
  fr: "Kutama, la branche la plus coriace des Berbères Baranis — revendiquée par les généalogistes arabes comme Himyarite; établie entre la campagne de Constantin et Auras, et la tribu dont la shi'i da'wa a pris le royaume aux Aghlabides {cite:tarikh-ibn-khaldun-ibar p. 1627}."
  ur: "کٹاما، بارانیس بربرز کی سب سے مشکل شاخ - جسے عرب ماہرین نسب نے ہمیارائٹ کے طور پر دعوی کیا ہے۔ قسطنطنیہ کے دیہی علاقوں اور اورس کے درمیان آباد ہوا، اور وہ قبیلہ جس کے شیعی دعوے نے اغلبیوں سے سلطنت حاصل کی تھی۔ 1627}۔"
  tr: "Mağrip Berberilerinin bir kolu olan bu topluluk, krallıktaki en güçlü ve en uzun süre varlığını sürdüren topluluktur; Arap soybilimcileri, İbn el-Kalbi ve el-Taberi'nin de belirttiği gibi, soylarını Himyar'a kadar takip etmişlerdir; anavatanları, Bejaia ve Aurès Dağları sınırlarına kadar uzanan Konstantin kırsalıdır ve Mağrip'teki Kutama saraylarına sahiptirler; ve onlardan Şiilik çağrısı doğmuştur ve bu sayede krallığı Ağlabidlerin elinden almışlardır. {Kaynak: tarikh-ibn-khaldun-ibar s. 1627}"
  id: "Sebuah cabang dari suku Berber di Maghreb, yang paling kuat dan paling lama bertahan di kerajaan; para ahli silsilah Arab menelusuri garis keturunan mereka kembali ke Himyar, seperti yang disebutkan oleh Ibn al-Kalbi dan al-Tabari; tanah air mereka adalah pedesaan Konstantin hingga perbatasan Bejaia dan Pegunungan Aurès, dan mereka memiliki istana Kutama di Maghreb, dan dari merekalah muncul seruan Syiah yang dengannya mereka merebut kerajaan dari tangan Aghlabid {cite:tarikh-ibn-khaldun-ibar p. 1627}."
