summary:
  ar: "بطن من برابرة البَرَنِس بالمغرب وأشدهم بأساً وأطولهم باعاً في الملك؛ نسبهم نسابة العرب إلى حمير على ما ذكر ابن الكلبي والطبري؛ موطنهم أرياف قسطنطينة إلى تخوم بجاية وجبل أوراس، ولهم قصور كتامة بالمغرب، ومنهم قامت دعوة الشيعة التي تناولوا بها الملك من أيدي الأغالبة {cite:tarikh-ibn-khaldun-ibar p. 1627}."
  en: "Kutama, the toughest branch of the Baranis Berbers — claimed by Arab genealogists as Himyarite; settled between Constantine's countryside and Auras, and the tribe whose shi'i da'wa took the realm from the Aghlabids {cite:tarikh-ibn-khaldun-ibar p. 1627}."
