label:
  ar: النصيرية
  en: Nusayriyya (Alawites)
summary:
  ar: "النصيرية، وهم من الشيعة الغالية وقد أطلق عليهم اسم «العلويين» حديثاً؛ موطنهم جبل النصيرية أو الأنصارية جزء من جبل لبنان وبلادهم تمتد شرقاً إلى سهل حماة وحمص وحلب وشمالاً إلى ما وراء أنطاكية، واسمهم يذكر بمؤسسهم الفقيه الشيعي محمد بن نصير المتوفى سنة 260هـ من أتباع الحسن العسكري الإمام الحادي عشر، وهم من أقدم سكان شمالي الشام قبل مجيء الدروز إلى لبنان، وفي ديانتهم أسرار شبيهة بأسرار الدروز مع احتفاظ بعضهم بأعياد مسيحية كعيد الميلاد والقيامة وأسماء مسيحية الأصل."
  en: "The Nusayriyya, ghulat Shi'a lately called Alawites; seated on Jabal al-Nusayriyya, their lands stretching to the plains of Hama, Homs and Aleppo and north past Antioch, named for the Shi'i jurist Muhammad ibn Nusayr (d. 260), a follower of the eleventh imam al-Hasan al-Askari — northern Syria's old stock before the Druze came to Lebanon, their faith a secreted blend holding also to Christian festivals like Christmas and Easter and names like Matta and Hanna."
