summary:
  ar: "النصيرية، وهم من الشيعة الغالية وقد أطلق عليهم اسم «العلويين» حديثاً؛ موطنهم جبل النصيرية أو الأنصارية جزء من جبل لبنان وبلادهم تمتد شرقاً إلى سهل حماة وحمص وحلب وشمالاً إلى ما وراء أنطاكية، واسمهم يذكر بمؤسسهم الفقيه الشيعي محمد بن نصير المتوفى سنة 260هـ من أتباع الحسن العسكري الإمام الحادي عشر، وهم من أقدم سكان شمالي الشام قبل مجيء الدروز إلى لبنان، وفي ديانتهم أسرار شبيهة بأسرار الدروز مع احتفاظ بعضهم بأعياد مسيحية كعيد الميلاد والقيامة وأسماء مسيحية الأصل."
  en: "The Nusayriyya, ghulat Shi'a lately called Alawites; seated on Jabal al-Nusayriyya, their lands stretching to the plains of Hama, Homs and Aleppo and north past Antioch, named for the Shi'i jurist Muhammad ibn Nusayr (d. 260), a follower of the eleventh imam al-Hasan al-Askari — northern Syria's old stock before the Druze came to Lebanon, their faith a secreted blend holding also to Christian festivals like Christmas and Easter and names like Matta and Hanna."
  es: "Los Nusayriyya, ghulat chiítas llamados últimamente alauitas; asentados en Jabal al-Nusayriyya, sus tierras se extienden hasta las llanuras de Hama, Homs y Alepo y al norte más allá de Antioquía, llamados así por el jurista chiíta Muhammad ibn Nusayr (m. 260), seguidor del undécimo imán al-Hasan al-Askari, antiguos pobladores del norte de Siria antes de que los drusos llegaran al Líbano, su fe es una mezcla secreta que también conserva festividades cristianas como la Navidad y la Pascua y nombres como Matta y Hanna."
  fr: "Les Nusayriyya, chiites ghulat récemment appelés Alaouites; installés sur le Jabal al-Nusayriyya, leurs terres s'étendant jusqu'aux plaines de Hama, Homs et Alep et au nord au-delà d'Antioche, nommés d'après le juriste chiite Muhammad ibn Nusayr (mort en 260), un disciple du onzième imam al-Hasan al-Askari — l'ancien peuple du nord de la Syrie avant l'arrivée des Druzes au Liban, leur foi étant un mélange secret incluant également des fêtes chrétiennes comme Noël et Pâques et des noms comme Matta et Hanna."
  ur: "نصیریہ، غلت شیعہ حال ہی میں علوی کہلاتے ہیں۔ جبل النصیریہ پر بیٹھے ہوئے، ان کی سرزمین حما، حمص اور حلب کے میدانی علاقوں تک پھیلی ہوئی ہے اور انطاکیہ کے شمال میں، شیعہ فقیہ محمد بن نصیر ⁦(متوفی 260)⁩ کے نام سے منسوب ہے، جو گیارھویں امام الحسن العسکری کے پیروکار تھے - شمالی شام کا پرانا عقیدہ لبنان سے پہلے خفیہ رکھنے کے لیے آیا تھا۔ کرسمس اور ایسٹر جیسے عیسائی تہوار اور مٹا اور حنا جیسے نام۔"
  tr: "Aşırı Şii mezhepler arasında yer alan ve yakın zamana kadar \"Aleviler\" olarak adlandırılan Nusayrilerin anavatanı, Lübnan Dağı'nın bir parçası olan Cebel Nusayriyah veya Ensariye'dir ve toprakları doğuda Hama, Homs ve Halep ovalarına, kuzeyde ise Antakya'nın ötesine kadar uzanır. İsimleri, 260 Hicri yılında vefat eden Şii hukukçu Muhammed bin Nusayr'ı anımsatır; kendisi on birinci İmam Hasan el-Askari'nin bir takipçisidir. Dürzilerin Lübnan'a gelişinden önce Kuzey Suriye'nin en eski sakinleri arasındadırlar ve dinleri, Dürzilerin sırlarına benzer sırlar içerir; bazıları Noel ve Paskalya gibi Hristiyan bayramlarını ve Hristiyan kökenli isimleri korur."
  id: "Kaum Nusayri, yang termasuk dalam kelompok Syiah ekstremis dan baru-baru ini disebut \"Alawiyah\", tanah air mereka adalah Jabal Nusayriyah atau Ansariyah, bagian dari Gunung Lebanon, dan wilayah mereka membentang ke timur hingga dataran Hama, Homs, dan Aleppo serta ke utara hingga melampaui Antiokhia. Nama mereka mengingatkan pada pendiri mereka, ahli hukum Syiah Muhammad bin Nusayr, yang meninggal pada tahun 260 Hijriah, seorang pengikut Al-Hasan Al-Askari, Imam kesebelas. Mereka termasuk penduduk tertua di Suriah utara sebelum kedatangan Druze ke Lebanon, dan agama mereka mengandung rahasia yang mirip dengan rahasia Druze, dengan beberapa di antara mereka mempertahankan hari raya Kristen seperti Natal dan Paskah serta nama-nama yang berasal dari Kristen."
