summary:
  ar: "قناة مدني هي المحطة التلفزيونية لحركة دعوت إسلامي الباكستانية وقناتها على يوتيوب (@madanichannelofficial)؛ تعمل القناة التلفزيونية منذ سنة 2008 وانطلقت بالأردية ثم بالإنجليزية والعربية والبنغالية، وبلغ عدد مشتركي قناتها على يوتيوب نحو 3.63 مليون بحسب عدّاد vidIQ المقروء في 5 نوفمبر 2026."
  en: "Madani Channel is the television station of the Pakistani movement Dawat-e-Islami and its YouTube channel (@madanichannelofficial); the television channel has operated since 2008, launched in Urdu before English, Arabic and Bengali services, and its YouTube channel counted about 3.63 million subscribers by vidIQ's count read on 5 November 2026."
  ur: "مدنی چینل پاکستانی تحریک دعوتِ اسلامی کا ٹیلی ویژن اسٹیشن اور اس کا یوٹیوب چینل (@madanichannelofficial) ہے؛ ٹیلی ویژن چینل 2008ء سے جاری ہے اور اردو کے بعد انگریزی، عربی اور بنگالی نشریات شروع ہوئیں، اور اس کے یوٹیوب سبسکرائبرز کی تعداد 5 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 3.63 ملین تھی۔"
  es: "Madani Channel es la estación de televisión del movimiento pakistaní Dawat-e-Islami y su canal de YouTube (@madanichannelofficial); el canal de televisión ha estado en funcionamiento desde 2008, lanzado en urdu antes de los servicios en inglés, árabe y bengalí, y su canal de YouTube contaba con aproximadamente 3,63 millones de suscriptores según el recuento de vidIQ realizado el 5 de noviembre de 2026."
  fr: "Madani Channel est la chaîne de télévision du mouvement pakistanais Dawat-e-Islami et sa chaîne YouTube (@madanichannelofficial); la chaîne de télévision fonctionne depuis 2008, lancée en ourdou avant les services en anglais, en arabe et en bengali, et sa chaîne YouTube comptait environ 3,63 millions d'abonnés selon le décompte de vidIQ lu le 5 novembre 2026."
  tr: "Madani Kanalı, Pakistan İslam Davet Hareketi'nin televizyon kanalı ve YouTube kanalıdır (@madanichannelofficial). Televizyon kanalı 2008'den beri faaliyet göstermekte olup, başlangıçta Urduca, daha sonra İngilizce, Arapça ve Bengalce dillerinde yayın yapmaktadır. 5 Kasım 2026'da vidIQ sayacından okunan verilere göre, YouTube kanalının abone sayısı yaklaşık 3,63 milyona ulaşmıştır."
  id: "Madani Channel adalah stasiun televisi Gerakan Dakwah Islam Pakistan dan saluran YouTube-nya (@madanichannelofficial). Saluran televisi ini telah beroperasi sejak tahun 2008 dan dimulai dalam bahasa Urdu, kemudian dalam bahasa Inggris, Arab, dan Bengali. Jumlah pelanggan saluran YouTube-nya mencapai sekitar 3,63 juta menurut penghitung vidIQ pada 5 November 2026."
