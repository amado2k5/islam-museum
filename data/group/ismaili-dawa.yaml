id: group/ismaili-dawa
class: group
kind: sect
label: { ar: "دعوة الإسماعيلية", en: "The Ismaili Da'wa" }
summary:
  ar: "فن مستقل في الفهرست بمذاهب الإسماعيلية ودعاتها ومصنفيها، منهم النسفي صاحب عنوان الدين وأصول الشرع، وأبو حاتم الرازي صاحب كتاب الزينة الكبير وكتاب الجامع، وبنو حماد المواصلة الذين كانوا أصحاب الدعوة بالجزيرة وما والاها من قبل أبي يعقوب خليفة الإمام المقيم بالري وصنفوا كتبا أضافوها إلى عبدان منها الحق النير والحق المبين، وابن نفيس الذي كانت الحضرة إليه خلافة لأبي يعقوب فتنكر عليه فأنفذ قوما من الأعاجم فقتلوه بالغيلة في داره، والديلي الذي كان ينافسه الرياسة {cite:fihrist-ibn-al-nadim p. 673-675}."
  en: "The Fihrist's Ismaili chapter — the da'is Nasafi, Abu Hatim al-Razi, Banu Hammad of Mosul, Ibn Nafis {cite:fihrist-ibn-al-nadim p. 673-675}."
sources: [source/fihrist-ibn-al-nadim]
