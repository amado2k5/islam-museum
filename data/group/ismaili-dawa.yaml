label: { ar: "دعوة الإسماعيلية", en: "The Ismaili Da'wa" }
summary:
  ar: "فن مستقل في الفهرست بمذاهب الإسماعيلية ودعاتها ومصنفيها، منهم النسفي صاحب عنوان الدين وأصول الشرع، وأبو حاتم الرازي صاحب كتاب الزينة الكبير وكتاب الجامع، وبنو حماد المواصلة الذين كانوا أصحاب الدعوة بالجزيرة وما والاها من قبل أبي يعقوب خليفة الإمام المقيم بالري وصنفوا كتبا أضافوها إلى عبدان منها الحق النير والحق المبين، وابن نفيس الذي كانت الحضرة إليه خلافة لأبي يعقوب فتنكر عليه فأنفذ قوما من الأعاجم فقتلوه بالغيلة في داره، والديلي الذي كان ينافسه الرياسة {cite:fihrist-ibn-al-nadim p. 673-675}. وللإسماعيلية البلاغات السبع وهي كتاب البلاغ الأول للعامة والثاني لفوق هؤلاء قليلا والثالث لمن دخل في المذهب سنة والرابع لمن دخل سنتين والخامس لمن دخل ثلاث سنين والسادس لمن دخل أربع سنين والبلاغ السابع وفيه نتيجة المذهب والكشف الأكبر قال ابن النديم قد قرأته فرأيت فيه أمرا عظيما من إباحة المحظورات والوضع من الشرائع، ومنذ نحو عشرين سنة تقاصر أمر المذهب وقل الدعاة فيه حتى إنه لا يرى من الكتب المصنفة فيه شيئا بعد أن كان في أيام معز الدولة في أوله ظاهرا والدعاة منبثون في كل صقع {cite:fihrist-ibn-al-nadim p. 268}، وعند ابن الجوزي يسمون الإسماعيلية والباطنية والقرامطة والحرمية والبابكية والمحمرة والسبعية والتعليمية {cite:muntazam-ibn-al-jawzi p. 111}"
  en: "The Fihrist's Ismaili chapter — the da'is Nasafi, Abu Hatim al-Razi, Banu Hammad of Mosul, Ibn Nafis {cite:fihrist-ibn-al-nadim p. 673-675}."
