id: group/ismaili-dawa
class: group
kind: sect
label: { ar: "دعوة الإسماعيلية", en: "The Ismaili Da'wa", es: "La Da'wa Ismaili", fr: "La Da'wa ismaélienne", ur: "اسماعیلی دعوت", tr: "İsmailî Çağrısı", id: "Panggilan Ismaili" }
summary:
  ar: "فن مستقل في الفهرست بمذاهب الإسماعيلية ودعاتها ومصنفيها، منهم النسفي صاحب عنوان الدين وأصول الشرع، وأبو حاتم الرازي صاحب كتاب الزينة الكبير وكتاب الجامع، وبنو حماد المواصلة الذين كانوا أصحاب الدعوة بالجزيرة وما والاها من قبل أبي يعقوب خليفة الإمام المقيم بالري وصنفوا كتبا أضافوها إلى عبدان منها الحق النير والحق المبين، وابن نفيس الذي كانت الحضرة إليه خلافة لأبي يعقوب فتنكر عليه فأنفذ قوما من الأعاجم فقتلوه بالغيلة في داره، والديلي الذي كان ينافسه الرياسة {cite:fihrist-ibn-al-nadim p. 673-675}. وللإسماعيلية البلاغات السبع وهي كتاب البلاغ الأول للعامة والثاني لفوق هؤلاء قليلا والثالث لمن دخل في المذهب سنة والرابع لمن دخل سنتين والخامس لمن دخل ثلاث سنين والسادس لمن دخل أربع سنين والبلاغ السابع وفيه نتيجة المذهب والكشف الأكبر قال ابن النديم قد قرأته فرأيت فيه أمرا عظيما من إباحة المحظورات والوضع من الشرائع، ومنذ نحو عشرين سنة تقاصر أمر المذهب وقل الدعاة فيه حتى إنه لا يرى من الكتب المصنفة فيه شيئا بعد أن كان في أيام معز الدولة في أوله ظاهرا والدعاة منبثون في كل صقع {cite:fihrist-ibn-al-nadim p. 268}، وعند ابن الجوزي يسمون الإسماعيلية والباطنية والقرامطة والحرمية والبابكية والمحمرة والسبعية والتعليمية {cite:muntazam-ibn-al-jawzi p. 111}"
  en: "The Fihrist's Ismaili chapter — the da'is Nasafi, Abu Hatim al-Razi, Banu Hammad of Mosul, Ibn Nafis {cite:fihrist-ibn-al-nadim p. 673-675}."
  es: "El capítulo ismailí de Fihrist: los da'is Nasafi, Abu Hatim al-Razi, Banu Hammad de Mosul, Ibn Nafis {citar:fihrist-ibn-al-nadim p. 673-675}."
  fr: "Le chapitre ismaili du Fihrist — les da'is Nasafi, Abu Hatim al-Razi, Banu Hammad de Mossoul, Ibn Nafis {cite: fihrist-ibn-al-nadim p. 673-675}."
  ur: "فہرست کا اسماعیلی باب — داعی نسفی، ابو حاتم الرازی، بنو حماد آف موصل، ابن نفیس {حوالہ: فہرست ابن الندیم ص. 673-675}۔"
  tr: "İsmaililerin doktrinleri, vaizleri ve yazarları arasında, din ve şeriat esasları adlı eserin yazarı el-Nasafi, büyük süsleme kitabı ve kapsamlı kitapların yazarı Ebu Hatim el-Razi, Rayy'da ikamet eden İmam'ın halefi Ebu Yakub adına adada ve çevresinde tebliğ yapan ve Abdan'a ekledikleri, aydınlanmış hakikat ve açık hakikat gibi kitaplar yazan Beni Hammad el-Mevsili ve Ebu Yakub'un halifeliğinde sarayında bulunan ancak ona karşı dönen ve bu yüzden evinde hainlikle öldürülen bir grup Arap olmayanı gönderen İbn Nafis ve onunla liderlik için yarışan el-Deyli de dahil olmak üzere bağımsız bir sanat eseri yer almaktadır. {Kaynak: Fihrist-ibn-al-nadim s. 673-675} İsmaililerin yedi mesajı vardır: Birincisi genel halk için, ikincisi biraz daha üst düzeydekiler için, üçüncüsü bir yıl içinde mezhebe girenler için, dördüncüsü iki yıl içinde girenler için, beşincisi üç yıl içinde girenler için, altıncısı dört yıl içinde girenler için ve yedinci mesaj ise mezhebin sonunu ve en büyük vahyi içerir. İbn el-Nadim şöyle demiştir: Bunu okudum ve içinde haram olanı helal kılma ve kanun uydurma konusunda büyük bir mesele gördüm. Yaklaşık yirmi yıldır mezhebin durumu geriledi ve vaizlerinin sayısı azaldı, öyle ki hakkında hiçbir kitap yazılmadı. Oysa Mu'izz el-Dawla döneminde başlangıcında çok önemliydi ve vaizleri her bölgeye yayılmıştı. {cite:fihrist-ibn-al-nadim s. 268} İbnü'l-Cevzi'ye göre ise bunlara İsmaililer, Bâtiniyye, Karmatîler, Haramiyye, Babakiyye, Muhammara, Sab'iyye ve Ta'limiyye denir. {alıntı:muntazam-ibn-el-cevzi s. 111}"
  id: "Seni independen dalam indeks dengan doktrin Ismailiyah, para pengkhotbah dan penulis mereka, termasuk al-Nasafi, penulis kitab agama dan prinsip-prinsip Syariah, Abu Hatim al-Razi, penulis kitab perhiasan agung dan kitab komprehensif, dan Bani Hammad al-Mawsili, yang merupakan pendukung dakwah di pulau dan sekitarnya atas nama Abu Yaqub, penerus Imam yang tinggal di Rayy, dan mereka menulis buku-buku yang mereka tambahkan ke Abdan, termasuk kebenaran yang tercerahkan dan kebenaran yang jelas, dan Ibnu Nafis, yang berada di istana pada masa kekhalifahan Abu Yaqub, tetapi ia berbalik melawannya, sehingga ia mengirim sekelompok orang non-Arab yang membunuhnya dengan tipu daya di rumahnya, dan al-Dayli, yang bersaing dengannya untuk kepemimpinan {kutipan:fihrist-ibn-al-nadim hlm. 673-675}. Kaum Ismailiyah memiliki tujuh pesan, yaitu: pesan pertama untuk masyarakat umum, pesan kedua untuk mereka yang sedikit di atas mereka, pesan ketiga untuk mereka yang masuk sekte selama satu tahun, pesan keempat untuk mereka yang masuk selama dua tahun, pesan kelima untuk mereka yang masuk selama tiga tahun, pesan keenam untuk mereka yang masuk selama empat tahun, dan pesan ketujuh, yang berisi kesimpulan sekte dan wahyu terbesar. Ibn al-Nadim berkata: Saya membacanya dan melihat di dalamnya suatu hal besar tentang membolehkan yang dilarang dan membuat hukum-hukum palsu. Dan selama sekitar dua puluh tahun, masalah sekte ini telah menurun dan jumlah pengkhotbahnya telah berkurang, sehingga tidak ada buku yang ditulis tentangnya, setelah sekte ini terkenal pada masa Mu'izz al-Dawla pada awalnya, dan para pengkhotbah tersebar di setiap wilayah. {cite:fihrist-ibn-al-nadim p. 268}. Dan menurut Ibnu al-Jawzi, mereka disebut kaum Ismaili, Batiniyya, Qarmatiyya, Haramiyya, Babakiyya, Muhammara, Sab'iyya, dan Ta'limiyya. {kutip:muntazam-ibn-al-jawzi hal. 111}"
