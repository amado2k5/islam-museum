summary:
  ar: "بنو مزيد بن أسد الأسديون من تميم، أمراء البادية بين العراق والشام ونجد؛ استنصر بهم وجوه شيعة واسط وعلويوها لما احترقت محالهم في فتنة السنة والشيعة نحو سنة ست وأربعمائة، فصاروا أملاج أهل واسط ثم ملكوا الحلة ومنها دولتهم المشهورة {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  en: "The Asadi Mazyadids of Tamim — desert amirs between Iraq, Syria and Najd whom Wasit's Alawid notables begged for aid when their quarters burned in the 406 fitna; from that patronage they took Wasit and then al-Hilla, seat of their famous dynasty {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  es: "Los Asadi Mazyadíes de Tamim, emires del desierto entre Irak, Siria y Najd, a quienes los notables alauitas de Wasit imploraron ayuda cuando sus aposentos ardieron en la fitna del 406; gracias a ese patrocinio tomaron Wasit y luego al-Hilla, sede de su famosa dinastía {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  fr: "Les Asadi Mazyadids de Tamim — émirs du désert entre l'Irak, la Syrie et le Najd — que les notables alaouides de Wasit ont suppliés de les aider lorsque leurs quartiers ont brûlé lors de la fitna de 406; grâce à ce patronage, ils ont pris Wasit puis al-Hilla, siège de leur célèbre dynastie {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  ur: "تمیم کے اسدی مازیادی - عراق، شام اور نجد کے درمیان صحرائی شہزادے جن کے 406 فتنے میں ان کے کوارٹر جلنے پر وصیت کے علوی نامور لوگوں نے مدد کی بھیک مانگی۔ اس سرپرستی سے انہوں نے وصیت اور پھر الحلّہ کو اپنے مشہور خاندان کی نشست پر قبضہ کر لیا۔"
