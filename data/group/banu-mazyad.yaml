summary:
  ar: "بنو مزيد بن أسد الأسديون من تميم، أمراء البادية بين العراق والشام ونجد؛ استنصر بهم وجوه شيعة واسط وعلويوها لما احترقت محالهم في فتنة السنة والشيعة نحو سنة ست وأربعمائة، فصاروا أملاج أهل واسط ثم ملكوا الحلة ومنها دولتهم المشهورة {cite:muntazam-ibn-al-jawzi j.7 p.283}."
  en: "The Asadi Mazyadids of Tamim — desert amirs between Iraq, Syria and Najd whom Wasit's Alawid notables begged for aid when their quarters burned in the 406 fitna; from that patronage they took Wasit and then al-Hilla, seat of their famous dynasty {cite:muntazam-ibn-al-jawzi j.7 p.283}."
