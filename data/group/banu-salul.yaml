label: { ar: "بنو سلول", en: "Banu Salul", es: "Banu Salul", fr: "Banu Salul", ur: "بنو سلول" }
summary:
  ar: "قبيل عربي مات في بيت امرأة منه عامر بن الطفيل في رجوعه من وفد بني عامر، فتأسف أن يموت «في بيت امرأة من بني سلول»؛ ويذكر محققو طبعة 1936 أنهم كانوا موصوفين عند العرب باللؤم، وأن ذلك شيء غلب عليهم لا لؤم في أصولهم، كما غلب على محارب وباهلة."
  en: "An Arab clan in whose woman's house Amir ibn al-Tufayl died on his way back from the Banu Amir delegation, lamenting that he should die 'in the house of a woman of Banu Salul'; the 1936 editors note that the Arabs reputed them mean, a reputation that attached to them rather than a fault of their lineage, as with Muharib and Bahila."
  es: "Un clan árabe en cuya casa de la mujer murió Amir ibn al-Tufayl de regreso de la delegación de Banu Amir, lamentando haber muerto \"en la casa de una mujer de Banu Salul\"; los editores de 1936 señalan que los árabes los consideraban mezquinos, una reputación que se les atribuía más que a un defecto de su linaje, como ocurría con Muharib y Bahila."
  fr: "Un clan arabe chez la femme duquel Amir ibn al-Tufayl mourut sur le chemin du retour de la délégation des Banu Amir, déplorant de mourir « dans la maison d'une femme des Banu Salul »; les éditeurs de 1936 notent que les Arabes les réputaient avares, une réputation qui leur était attachée plutôt qu'un défaut de leur lignée, comme ce fut le cas pour Muharib et Bahila."
  ur: "ایک عرب قبیلہ جس کی عورت کے گھر میں امیر ابن الطفیل بنو عامر کے وفد سے واپسی پر مر گیا، اس پر افسوس کا اظہار کرتے ہوئے کہ اسے 'بنو سلول کی ایک عورت کے گھر' مرنا چاہیے۔ 1936 کے ایڈیٹرز نوٹ کرتے ہیں کہ عربوں نے ان کی شہرت کا مطلب یہ ہے کہ وہ شہرت جو ان کے نسب کی خرابی کے بجائے ان سے وابستہ ہے، جیسا کہ محرب اور بہلہ کے ساتھ ہے۔"
