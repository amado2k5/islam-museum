label: { ar: "بنو سلول", en: "Banu Salul" }
summary:
  ar: "قبيل عربي مات في بيت امرأة منه عامر بن الطفيل في رجوعه من وفد بني عامر، فتأسف أن يموت «في بيت امرأة من بني سلول»؛ ويذكر محققو طبعة 1936 أنهم كانوا موصوفين عند العرب باللؤم، وأن ذلك شيء غلب عليهم لا لؤم في أصولهم، كما غلب على محارب وباهلة."
  en: "An Arab clan in whose woman's house Amir ibn al-Tufayl died on his way back from the Banu Amir delegation, lamenting that he should die 'in the house of a woman of Banu Salul'; the 1936 editors note that the Arabs reputed them mean, a reputation that attached to them rather than a fault of their lineage, as with Muharib and Bahila."
