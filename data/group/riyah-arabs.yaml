label:
  ar: رياح بن هلال
  en: Riyah ibn Hilal
summary:
  ar: "رياح بن هلال من بطون بني هلال بن عامر، من أكثر شعوب العرب بالمغرب عدداً وأعظمها جأشاً؛ بلادهم بنواحي قسنطينة والسلم والزاب، ومنهم عتبة بنواحي بجاية، ومنهم بالمغرب الأقصى خلق كثير، وهم الذين يقول فيهم ابن حزم من بطون بني هلال بنو رياح الذين أفسدوا إفريقية، ومنهم بنو علي أمراء قابس من بني جامع وغيرهم من رؤساء العرب."
  en: "Riyah ibn Hilal of the Hilal ibn Amir branches, the most numerous and proudest of the Maghreb's Arab divisions; their lands around Constantine, the Selm and the Zab, with the Utba branch near Bijaya and a great mass in the Far Maghreb — Ibn Hazm names them 'Banu Riyah who ruined Ifriqiya', and of them Banu Ali the Gabes amirs of Banu Jami' and other Arab chiefs."
