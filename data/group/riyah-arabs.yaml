summary:
  ar: "رياح بن هلال من بطون بني هلال بن عامر، من أكثر شعوب العرب بالمغرب عدداً وأعظمها جأشاً؛ بلادهم بنواحي قسنطينة والسلم والزاب، ومنهم عتبة بنواحي بجاية، ومنهم بالمغرب الأقصى خلق كثير، وهم الذين يقول فيهم ابن حزم من بطون بني هلال بنو رياح الذين أفسدوا إفريقية، ومنهم بنو علي أمراء قابس من بني جامع وغيرهم من رؤساء العرب."
  en: "Riyah ibn Hilal of the Hilal ibn Amir branches, the most numerous and proudest of the Maghreb's Arab divisions; their lands around Constantine, the Selm and the Zab, with the Utba branch near Bijaya and a great mass in the Far Maghreb — Ibn Hazm names them 'Banu Riyah who ruined Ifriqiya', and of them Banu Ali the Gabes amirs of Banu Jami' and other Arab chiefs."
  es: "Riyah ibn Hilal de las ramas de Hilal ibn Amir, la más numerosa y orgullosa de las divisiones árabes del Magreb; sus tierras alrededor de Constantina, el Selm y el Zab, con la rama de Utba cerca de Bijaya y una gran masa en el Magreb lejano: Ibn Hazm los llama 'Banu Riyah que arruinaron Ifriqiya', y de ellos Banu Ali los emires Gabes de Banu Jami' y otros jefes árabes."
  fr: "Riyah ibn Hilal, de la branche de Hilal ibn Amir, la plus nombreuse et la plus fière des divisions arabes du Maghreb; leurs terres autour de Constantin, du Selm et du Zab, avec la branche d'Utba près de Bijaya et une grande masse dans le Maghreb lointain — Ibn Hazm les nomme « Banu Riyah qui a ruiné Ifriqiya », et parmi eux, Banu Ali, les émirs de Gabes des Banu Jami' et d'autres chefs arabes."
  ur: "ہلال ابن عامر کی شاخوں میں سے ریا بن ہلال، مغرب کے عرب حصوں میں سب سے زیادہ اور قابل فخر؛ قسطنطنیہ، سیلم اور زاب کے ارد گرد ان کی زمینیں، جس میں عتبہ کی شاخ بجیا کے قریب ہے اور مغرب میں ایک بہت بڑا اجتماع ہے - ابن حزم نے ان کا نام 'بنو ریا' رکھا ہے جس نے عفریقیہ کو برباد کیا، اور ان میں سے بنو علی، بنو جامی کے غیب کے امیر' اور دوسرے عرب سردار۔"
  tr: "Riyah ibn Hilal, Mağrip'in en kalabalık ve cesur Arap halklarından biri olan Beni Hilal ibn Amir'in bir koludur. Toprakları Konstantin, Salam ve Zab civarındadır. Bazıları Bejaia civarında, birçoğu ise uzak Mağrip'tedir. İbn Hazm'ın \"Beni Hilal'in kollarından Afrika'yı bozan Beni Riyah vardır\" dediği kişiler onlardır. Aralarında Beni Ali, Gabes prensleri, Beni Cami'den olanlar ve diğer Arap reisleri de bulunmaktadır."
  id: "Riyah ibn Hilal adalah salah satu cabang dari Banu Hilal ibn Amir, salah satu suku Arab yang paling banyak dan pemberani di Maghreb. Tanah mereka berada di sekitar Konstantinus, Salam, dan Zab. Sebagian dari mereka berada di sekitar Bejaia, dan banyak dari mereka berada di Maghreb yang jauh. Mereka adalah orang-orang yang disebutkan oleh Ibnu Hazm, “Dari cabang-cabang Banu Hilal terdapat Banu Riyah yang merusak Afrika.” Di antara mereka adalah Banu Ali, para pangeran Gabes, dari Banu Jami’, dan para pemimpin Arab lainnya."
