summary:
  ar: "قناة يوتيوب بنغلاديشية تجمع محاضرات الوعظ بالبنغالية وتنشرها على نطاق واسع؛ بلغ عدد مشتركيها نحو 529 ألفًا بحسب عدّاد vidIQ المقروء في 7 نوفمبر 2026. لم يُحدَّد لها مشغّل أو مسؤول بالاسم في هذا المسح."
  en: "A Bangladeshi YouTube channel (@bangladeshislamicwazmedia) aggregating Bengali waz lectures at scale; it counted about 529 thousand subscribers by vidIQ's count read on 7 November 2026. No named head or operator was identified for it in this pass."
  ur: "بنگلہ دیشی یوٹیوب چینل جو بنگالی واز لیکچرز بڑے پیمانے پر جمع و شائع کرتا ہے؛ 7 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق اس کے سبسکرائبرز تقریباً 529 ہزار تھے۔ اس مرحلے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہو سکا۔"
  es: "Un canal de YouTube de Bangladesh (@bangladeshislamicwazmedia) que recopila conferencias de waz en bengalí a gran escala, contaba con aproximadamente 529 mil suscriptores según el recuento de vidIQ realizado el 7 de noviembre de 2026. En esta ocasión no se identificó a ningún responsable ni operador."
  fr: "Une chaîne YouTube bangladaise (@bangladeshislamicwazmedia) rassemblant des conférences waz en bengali à grande échelle; elle comptait environ 529 000 abonnés selon le décompte de vidIQ lu le 7 novembre 2026. Aucun responsable ou opérateur nommé n'a été identifié pour elle dans cette passe."
  tr: "Bangladeş merkezli, Bengalce vaazları derleyip geniş çapta yayan bir YouTube kanalı; 7 Kasım 2026'da vidIQ sayacından okunan verilere göre yaklaşık 529.000 aboneye sahipti. Bu araştırmada hiçbir işletmeci veya yönetici ismiyle tespit edilemedi."
  id: "Sebuah saluran YouTube Bangladesh yang mengumpulkan dan menyebarluaskan secara luas ceramah-ceramah berbahasa Bengali; saluran ini memiliki sekitar 529.000 pelanggan menurut penghitung vidIQ yang dibaca pada 7 November 2026. Tidak ada operator atau administrator yang diidentifikasi namanya dalam survei ini."
