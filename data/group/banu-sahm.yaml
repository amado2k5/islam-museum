summary:
  ar: "من بطون قريش؛ يقدّمه ابن إسحاق في قوائم مهاجرة الحبشة بنسبه «سهم بن عمرو بن هصيص بن كعب»، ويعدّ منه مهاجرين ونساءً وأبناءً ولدوا هناك."
  en: A clan of Quraysh; Ibn Ishaq lists it in the Abyssinia rolls as 'Sahm ibn Amr ibn Hasis ibn Ka'b', counting emigrants, women and children born there.
  es: "Un clan de los Quraysh; Ibn Ishaq lo menciona en los registros de Abisinia como 'Sahm ibn Amr ibn Hasis ibn Ka'b', donde se contabilizan los emigrantes, las mujeres y los niños nacidos allí."
  fr: "Un clan de Quraysh; Ibn Ishaq le mentionne dans les registres d'Abyssinie sous le nom de « Sahm ibn Amr ibn Hasis ibn Ka'b », comptant les émigrants, les femmes et les enfants nés là-bas."
  ur: "قریش کا ایک قبیلہ؛ ابن اسحاق نے اسے حبشہ کی فہرست میں 'سہم بن عمرو بن حصص بن کعب' کے نام سے درج کیا ہے، یہاں پر پیدا ہونے والے مہاجرین، عورتوں اور بچوں کو شمار کیا ہے۔"
  tr: "İbn İshak, Kureyş kabilelerinden olan bu kişiyi, Habeşistan'a hicret edenlerin listelerinde \"Sahm bin Amr bin Hasis bin Kaab\" soyuyla birlikte sunar ve ondan oraya göç eden kadınları ve çocukları sayar."
  id: "Dari klan Quraysh; Ibnu Ishaq memasukkannya dalam daftar para emigran ke Abyssinia dengan garis keturunannya \"Sahm bin Amr bin Hasis bin Kaab\", dan menghitung dari keturunannya para emigran, wanita, dan anak-anak yang lahir di sana."
