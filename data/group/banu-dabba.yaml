label: { ar: "بنو ضبة بن أد", en: "Banu Dabba ibn Udd", es: "Banu Dabba ibn Udd", fr: "Banu Dabba ibn Udd", ur: "بنو ڈبہ ابن عد", tr: "Banu Dabba ibn Ad", id: "Banu Dabba ibn Ad" }
summary:
  ar: "بنو ضبة بن أد بن طابخة بن إلياس بن مضر، قبيلة مضرية من أبناء الرباب؛ أول من نادى «يا آل خندف» حين أصرختهم بنو أسد يوم النسار فكان ذلك أول تخندفهم، ومن وقائعهم يوم الشقيقة الذي قتلوا فيه بسطام بن قيس سيد شيبان {cite:kamil-ibn-al-athir p. 461-465}."
  en: "Banu Dabba ibn Udd, a Mudar tribe of the Rabbab; the first to raise the cry 'ya Al Khindif' — hence the federation's name — when Asad answered them at al-Nasar, and victors of al-Shaqiqa where Bustam ibn Qays of Shayban fell {cite:kamil-ibn-al-athir p. 461-465}."
  es: "Banu Dabba ibn Udd, una tribu Mudar de los Rabbab; los primeros en lanzar el grito 'ya Al Khindif' —de ahí el nombre de la federación— cuando Asad les respondió en al-Nasar, y vencedores de al-Shaqiqa donde cayó Bustam ibn Qays de Shayban {cite:kamil-ibn-al-athir p. 461-465}."
  fr: "Banu Dabba ibn Udd, une tribu Mudar des Rabbab; les premiers à lancer le cri 'ya Al Khindif' — d'où le nom de la fédération — lorsqu'Asad leur répondit à al-Nasar, et vainqueurs d'al-Shaqiqa où Bustam ibn Qays de Shayban tomba {cite:kamil-ibn-al-athir p. 461-465}."
  ur: "بنو ڈبہ ابن عد، رباب کا ایک مدر قبیلہ؛ \"یا الخندف\" کی صدا بلند کرنے والے سب سے پہلے - اسی وجہ سے وفاق کا نام - جب اسد نے الناصر میں ان کا جواب دیا، اور الشقیقہ کے فاتحین جہاں بسطام بن قیس آف شیبان گرے تھے {حوالہ دیں: کامل ابن الاثیر ص۔ 461-465}۔"
  tr: "Beni Dabba ibn Ad ibn Tabikha ibn İlyas ibn Mudar, El-Rabab oğullarından Mudar kabilesine mensuptur; Beni Asad'ın Nisar günü onlara seslenmesi üzerine \"Ey Khindif halkı!\" diye ilk seslenen kabiledir ve bu onların ilk Khindif savaşıdır. Savaşları arasında, Şeyban'ın lideri Bistam ibn Kays'ı öldürdükleri Şakika günü de bulunmaktadır. {Kaynak: Kamil ibn el-Athir, s. 461-465}"
  id: "Banu Dabba ibn Ad ibn Tabikha ibn Ilyas ibn Mudar, sebuah suku Mudarit dari keturunan Al-Rabab; yang pertama kali menyerukan “Wahai penduduk Khindif” ketika Banu Asad menyerukan kepada mereka pada hari Al-Nisar, dan itulah Khindif pertama mereka, dan di antara pertempuran mereka adalah hari Al-Shaqiqa, di mana mereka membunuh Bistam ibn Qais, pemimpin Shaiban {cite:kamil-ibn-al-athir hlm. 461-465}."
