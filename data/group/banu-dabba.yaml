summary:
  ar: "بنو ضبة بن أد بن طابخة بن إلياس بن مضر، قبيلة مضرية من أبناء الرباب؛ أول من نادى «يا آل خندف» حين أصرختهم بنو أسد يوم النسار فكان ذلك أول تخندفهم، ومن وقائعهم يوم الشقيقة الذي قتلوا فيه بسطام بن قيس سيد شيبان {cite:kamil-ibn-al-athir p. 461-465}."
  en: "Banu Dabba ibn Udd, a Mudar tribe of the Rabbab; the first to raise the cry 'ya Al Khindif' — hence the federation's name — when Asad answered them at al-Nasar, and victors of al-Shaqiqa where Bustam ibn Qays of Shayban fell {cite:kamil-ibn-al-athir p. 461-465}."
