label:
  ar: مجلس العلماء الإندونيسي
  en: "Indonesian Ulama Council"
  es: "Consejo de Ulemas de Indonesia"
  fr: "Conseil des oulémas indonésiens"
  ur: "انڈونیشین علماء کونسل"
summary:
  ar: "مجلس يجمع علماء من مذاهب مختلفة في إندونيسيا، ويرأسه في وقت الزيارة الدكتور معروف أمين {cite:rihla-imam-akbar-indonesia-azhar p. 63}. استقبل فيه الإمام الأكبر يوم 23 فبراير 2016م، وأشاد بتجربته في جمع علماء المذاهب في مجلس واحد، ودعا إلى أن يصدر عنه رأي واحد في المسألة يرفع الحرج عن السائل {cite:rihla-imam-akbar-indonesia-azhar p. 150}."
  en: "Indonesian council that brings together scholars of different madhhabs. The Grand Imam met it on 23 February 2016 and praised the model of one council for all madhhabs."
  es: "Consejo indonesio que reúne a eruditos de diferentes escuelas jurídicas (madhhabs). El Gran Imán se reunió con él el 23 de febrero de 2016 y elogió el modelo de un consejo único para todas las escuelas jurídicas."
  fr: "Le Conseil indonésien réunit des érudits de différentes écoles juridiques (madhhabs). Le Grand Imam l'a rencontré le 23 février 2016 et a salué le modèle d'un conseil unique pour toutes les écoles juridiques."
  ur: "انڈونیشین کونسل جو مختلف مذاہب کے علماء کو اکٹھا کرتی ہے۔ امام اعظم نے 23 فروری 2016 کو اس سے ملاقات کی اور تمام مذاہب کے لیے ایک کونسل کے ماڈل کی تعریف کی۔"
