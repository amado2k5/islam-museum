summary:
  ar: "مجلس يجمع علماء من مذاهب مختلفة في إندونيسيا، ويرأسه في وقت الزيارة الدكتور معروف أمين {cite:rihla-imam-akbar-indonesia-azhar p. 63}. استقبل فيه الإمام الأكبر يوم 23 فبراير 2016م، وأشاد بتجربته في جمع علماء المذاهب في مجلس واحد، ودعا إلى أن يصدر عنه رأي واحد في المسألة يرفع الحرج عن السائل {cite:rihla-imam-akbar-indonesia-azhar p. 150}."
  en: "Indonesian council that brings together scholars of different madhhabs. The Grand Imam met it on 23 February 2016 and praised the model of one council for all madhhabs."
