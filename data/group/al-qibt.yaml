summary:
  ar: "الأقباط أهل مصر قبل الإسلام؛ ورد في الحديث «ستفتح عليكم أرضاً يذكر فيها القيراط فإذا فتحتموها فاستوصوا بأهلها خيراً فإن لهم ذمة ورحماً»، ومنهم مارية القبطية أم إبراهيم بن النبي والمقوقس عظيمها {cite:sahih-muslim} {cite:mubarakpuri-raheeq} {cite:kamil-ibn-al-athir}."
  en: "Al-Qibt are the Copts of Egypt before Islam; the hadith foretells «a land where the qirat is spoken of will be conquered for you — when you take it, treat its people well, for they have protection and kinship», and from them came Maria the Copt, mother of the Prophet's son Ibrahim, and al-Muqawqis her master {cite:sahih-muslim} {cite:mubarakpuri-raheeq} {cite:kamil-ibn-al-athir}."
