label: { ar: "الأقباط", en: "Al-Qibt (the Copts)", es: "Al-Qibt (los coptos)", fr: "Al-Qibt (les Coptes)", ur: "القبط ⁦(قبطی)⁩" }
summary:
  ar: "الأقباط أهل مصر قبل الإسلام؛ ورد في الحديث «ستفتح عليكم أرضاً يذكر فيها القيراط فإذا فتحتموها فاستوصوا بأهلها خيراً فإن لهم ذمة ورحماً»، ومنهم مارية القبطية أم إبراهيم بن النبي والمقوقس عظيمها {cite:sahih-muslim} {cite:mubarakpuri-raheeq} {cite:kamil-ibn-al-athir}."
  en: "Al-Qibt are the Copts of Egypt before Islam; the hadith foretells «a land where the qirat is spoken of will be conquered for you — when you take it, treat its people well, for they have protection and kinship», and from them came Maria the Copt, mother of the Prophet's son Ibrahim, and al-Muqawqis her master {cite:sahih-muslim} {cite:mubarakpuri-raheeq} {cite:kamil-ibn-al-athir}."
  es: "Al-Qibt son los coptos de Egipto antes del Islam; el hadiz predice «una tierra de la que se habla el qirat será conquistada para vosotros; cuando la toméis, tratad bien a su gente, pues tienen protección y parentesco», y de ellos surgió María la copta, madre del hijo del Profeta, Ibrahim, y al-Muqawqis su señor {cite:sahih-muslim} {cite:mubarakpuri-raheeq} {cite:kamil-ibn-al-athir}."
  fr: "Les Al-Qibt sont les Coptes d'Égypte avant l'Islam; le hadith prédit « une terre dont on parle de la qirat sera conquise pour vous — lorsque vous la prendrez, traitez bien ses habitants, car ils ont protection et parenté », et c'est d'eux que vient Maria la Copte, mère du fils du Prophète Ibrahim, et al-Muqawqis son maître {cite:sahih-muslim} {cite:mubarakpuri-raheeq} {cite:kamil-ibn-al-athir}."
  ur: "القبط اسلام سے پہلے مصر کے قبطی ہیں۔ حدیث میں بتایا گیا ہے کہ \"ایک ایسی سرزمین جہاں قیراط کی بات کی جائے گی وہ تمہارے لیے فتح ہو جائے گی - جب تم اسے لے لو تو اس کے لوگوں سے اچھا سلوک کرو، کیونکہ ان کے پاس حفاظت اور رشتہ داری ہے\"، اور ان میں سے ماریہ قبطی، جو رسول اللہ کے بیٹے ابراہیم کی والدہ تھیں، اور ان کے آقا المقوقس کا نام آیا۔ {حوالہ: کامل ابن الاثیر}"
