label: { ar: "بنو الضبيب من جذام", en: "Banu Dubayb of Judham", es: "Banu Dubayb de Judá", fr: "Banu Dubayb de Judham", ur: "یہودھم کی بنو دوبئی" }
summary:
  ar: "رهط رفاعة بن زيد من جذام؛ أسلموا على كتاب النبي الذي حمله رفاعة، واستنقذوا متاع دحية الكلبي من الهنيد بن عوص، ثم أصابتهم سرية زيد بن حارثة فركب نفر منهم إلى رفاعة ثم إلى النبي فردّ عليهم ما أُخذ."
  en: "Rifa'a ibn Zayd's clan of Judham; they embraced Islam on the Prophet's letter which Rifa'a brought, recovered Dihya al-Kalbi's goods from al-Hunayd ibn Us, were then struck by Zayd ibn Haritha's detachment, and a party of them rode to Rifa'a and on to the Prophet, who restored what had been taken."
  es: "El clan de Rifa'a ibn Zayd de Judham; abrazaron el Islam tras recibir la carta del Profeta que Rifa'a trajo, recuperaron los bienes de Dihya al-Kalbi de manos de al-Hunayd ibn Us, luego fueron atacados por el destacamento de Zayd ibn Haritha, y un grupo de ellos cabalgó hasta Rifa'a y luego hasta el Profeta, quien restituyó lo que había sido robado."
  fr: "Le clan de Judham de Rifa'a ibn Zayd; ils embrassèrent l'Islam sur la lettre du Prophète que Rifa'a apporta, récupérèrent les biens de Dihya al-Kalbi auprès d'al-Hunayd ibn Us, furent ensuite attaqués par le détachement de Zayd ibn Haritha, et un groupe d'entre eux se rendit à Rifa'a puis auprès du Prophète, qui restitua ce qui avait été pris."
  ur: "رفاع بن زید کا قبیلہ جُدھم؛ انہوں نے رسول اللہ کے اس خط پر اسلام قبول کیا جو رفاعہ لائے تھے، حنید بن عاص سے دحیہ الکلبی کا سامان برآمد کیا، پھر زید بن حارثہ کی دستبرداری سے متاثر ہوئے، اور ان میں سے ایک جماعت رفاعہ اور نبی کے پاس چلی گئی، جس نے جو لیا گیا تھا اسے بحال کر دیا۔"
