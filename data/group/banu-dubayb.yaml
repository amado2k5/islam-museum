label: { ar: "بنو الضبيب من جذام", en: "Banu Dubayb of Judham" }
summary:
  ar: "رهط رفاعة بن زيد من جذام؛ أسلموا على كتاب النبي الذي حمله رفاعة، واستنقذوا متاع دحية الكلبي من الهنيد بن عوص، ثم أصابتهم سرية زيد بن حارثة فركب نفر منهم إلى رفاعة ثم إلى النبي فردّ عليهم ما أُخذ."
  en: "Rifa'a ibn Zayd's clan of Judham; they embraced Islam on the Prophet's letter which Rifa'a brought, recovered Dihya al-Kalbi's goods from al-Hunayd ibn Us, were then struck by Zayd ibn Haritha's detachment, and a party of them rode to Rifa'a and on to the Prophet, who restored what had been taken."
