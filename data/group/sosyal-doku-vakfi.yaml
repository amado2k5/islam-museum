label: { ar: "وقف النسيج الاجتماعي", en: "Sosyal Doku Vakfı", ur: "سوسیال ڈوکو وقفی", es: "Sosyal Doku Vakfı" }
summary:
  ar: "قناة وقف النسيج الاجتماعي في إسطنبول على يوتيوب ⁦(@sosyaldokudernegi)⁩، وهو الوقف الذي ينشر دروس نور الدين يلدز ويدير موقع الفتاوى المرتبط به؛ بلغ عدد مشتركيها 822,000 مشترك وعدد مشاهداتها 265,338,370 مشاهدة في 8,864 مقطعًا بحسب عدّاد vidIQ كما في 9 نوفمبر 2026. تذكر المصادر المقروءة أن يلدز أسّس منظمة النسيج الاجتماعي وتصفه بأنه مؤسس الوقف ورئيسه، فكُتبت علاقة التأسيس هنا في جانب المجموعة إلى سجله الشخصي المبني في القسم A من هذه الموجة نفسها."
  en: "The YouTube channel (@sosyaldokudernegi) of the Sosyal Doku Vakfı (Social Texture Foundation) in Istanbul, the foundation that publishes Nureddin Yıldız's lessons and runs its associated fatwa site; it counted 822,000 subscribers, 265,338,370 views and 8,864 videos by vidIQ's count as of 9 November 2026. Sources read state that Yıldız founded the Sosyal Doku organisation and describe him as the foundation's founder and president, so the founded_by edge is written here, on the group side, to his person record built in section A of this same wave."
  ur: "استنبول کے سوسیال ڈوکو وقفی کی یوٹیوب چینل ⁦(@sosyaldokudernegi)⁩ — وہ فاؤنڈیشن جو نورالدین یلدز کے اسباق شائع کرتی ہے اور اس سے منسلک فتویٰ سائٹ چلاتی ہے؛ 9 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 822,000، ویوز 265,338,370 اور ویڈیوز 8,864 تھیں۔ پڑھے گئے ماخذ بتاتے ہیں کہ یلدز نے سوسیال ڈوکو تنظیم قائم کی اور اسے فاؤنڈیشن کا بانی اور صدر بیان کرتے ہیں، اس لیے بانی کا رشتہ یہاں گروپ کی جانب سے اس کے شخصی ریکارڈ سے لکھا گیا ہے جو اسی ویو کے حصہ A میں بنایا گیا ہے۔"
  es: "El canal de YouTube (@sosyaldokudernegi) de la Sosyal Doku Vakfı (Fundación Textura Social) en Estambul, la fundación que publica las lecciones de Nureddin Yıldız y administra su sitio web de fatwas asociado, contaba con 822.000 suscriptores, 265.338.370 visualizaciones y 8.864 vídeos según el recuento de vidIQ al 9 de noviembre de 2026. Las fuentes consultadas afirman que Yıldız fundó la organización Sosyal Doku y lo describen como el fundador y presidente de la fundación, por lo que el borde found_by está escrito aquí, en el lado del grupo, en su registro personal construido en la sección A de esta misma ola."
