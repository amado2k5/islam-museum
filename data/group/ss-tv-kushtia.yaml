summary:
  ar: "قناة يوتيوب من مدينة كوشتيا في بنغلاديش تنشر تسجيلات محافل الوعظ بالبنغالية؛ بلغ عدد مشتركيها نحو 573 ألفًا بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026. وسم تصنيف يوتيوب الخاص بها هو «أسلوب الحياة»، غير أن عيّنة محتواها الأعلى مشاهدة تقودها محاضرات الوعظ، فلا يوصف محتواها كله بأنه وعظي."
  en: "A YouTube channel from Kushtia, Bangladesh (@sstvkushtia), publishing Bengali waz mahfil recordings; it counted about 573 thousand subscribers by vidIQ's count read on 8 November 2026. YouTube's own category tag for the channel is Lifestyle, while its most-viewed content sample is waz-led, so its output is not described here as wholly sermon content."
  ur: "بنگلہ دیش کے شہر کشتیا کا یوٹیوب چینل جو بنگالی واز محفلوں کی ریکارڈنگز شائع کرتا ہے؛ 8 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق اس کے سبسکرائبرز تقریباً 573 ہزار تھے۔ یوٹیوب کا اس کے لیے اپنا زمرہ «طرزِ زندگی» ہے، اگرچہ اس کی سب سے زیادہ دیکھی جانے والی ویڈیوز واز پر مبنی ہیں۔"
  es: "Un canal de YouTube de Kushtia, Bangladesh (@sstvkushtia), que publica grabaciones de sermones religiosos bengalíes (waz mahfil), contaba con unos 573 mil suscriptores según el recuento de vidIQ realizado el 8 de noviembre de 2026. La categoría que YouTube le asigna al canal es Estilo de vida, mientras que su contenido más visto es de tipo waz-led, por lo que su producción no se describe aquí como contenido exclusivamente de sermones."
  fr: "Une chaîne YouTube de Kushtia, au Bangladesh (@sstvkushtia), publiant des enregistrements de waz mahfil en bengali; elle comptait environ 573 000 abonnés selon le décompte de vidIQ relevé le 8 novembre 2026. La catégorie attribuée par YouTube à la chaîne est « Style de vie », tandis que son contenu le plus visionné est principalement composé de waz, sa production n’est donc pas décrite ici comme étant exclusivement composée de sermons."
  tr: "Bangladeş'in Kuştia kentinden, Bengalce vaaz kayıtları yayınlayan bir YouTube kanalı; 8 Kasım 2026'da vidIQ sayacına göre yaklaşık 573.000 aboneye sahip. YouTube etiketi \"Yaşam Tarzı\" olsa da, en çok izlenen içeriklerinin büyük çoğunluğu vaazlardan oluştuğu için, içeriğinin tamamı vaaz odaklı olarak nitelendirilemez."
  id: "Sebuah saluran YouTube dari Kushtia, Bangladesh, yang menerbitkan rekaman khotbah dalam bahasa Bengali; saluran ini memiliki sekitar 573.000 pelanggan menurut penghitung vidIQ pada 8 November 2026. Tag YouTube-nya adalah \"Gaya Hidup\", namun, sampel konten yang paling banyak ditonton didominasi oleh khotbah, sehingga tidak semua kontennya dapat digambarkan sebagai berbasis khotbah."
