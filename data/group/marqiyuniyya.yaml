label: { ar: "المرقيونية", en: "Marqiyuniyya" }
summary:
  ar: "المرقيونية أصحاب مرقيون وهم قبل الديصانية طائفة من النصارى أقرب من المنانية والديصانية، زعمت أن الأصلين القديمين النور والظلمة وأن هنا كونا ثالثا مزجها وخالطها فمنهم من قال هو الحياة وهو عيسى ومنهم من زعم أن عيسى رسول ذلك الكون الثالث، وأجمعوا على أن العالم محدث والصنعة بينة فيه، وللمرقيونية كتاب يختصون به يكتبون به ديانتهم ولمرقيون كتاب إنجيل سماه، وهم يتسترون بالنصرانية وبخراسان كثير {cite:fihrist-ibn-al-nadim p. 474-475}."
  en: "Marcionites — the third-being doctrine and Marcion's own Gospel {cite:fihrist-ibn-al-nadim}"
