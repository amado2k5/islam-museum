label: { ar: "المرقيونية", en: "Marqiyuniyya", es: "Marqiyuniyya", fr: "Marqiyuniyya", ur: "مارکیونیا", tr: "Marcionizm", id: "Marcionisme" }
summary:
  ar: "المرقيونية أصحاب مرقيون وهم قبل الديصانية طائفة من النصارى أقرب من المنانية والديصانية، زعمت أن الأصلين القديمين النور والظلمة وأن هنا كونا ثالثا مزجها وخالطها فمنهم من قال هو الحياة وهو عيسى ومنهم من زعم أن عيسى رسول ذلك الكون الثالث، وأجمعوا على أن العالم محدث والصنعة بينة فيه، وللمرقيونية كتاب يختصون به يكتبون به ديانتهم ولمرقيون كتاب إنجيل سماه، وهم يتسترون بالنصرانية وبخراسان كثير {cite:fihrist-ibn-al-nadim p. 474-475}."
  en: "Marcionites — the third-being doctrine and Marcion's own Gospel {cite:fihrist-ibn-al-nadim}"
  es: "Los marcionitas: la doctrina del tercer ser y el Evangelio del propio Marción {cite:fihrist-ibn-al-nadim}"
  fr: "Marcionites — la doctrine du troisième être et l'Évangile de Marcion lui-même {cite:fihrist-ibn-al-nadim}"
  ur: "Marcionites - تیسرے وجود کا نظریہ اور Marcion کی اپنی انجیل"
  tr: "Marcioncular, Marcion'un takipçileridir ve Daysaniyye'den önce Maniheistler ve Daysaniyye'ye daha yakın bir Hristiyan mezhebiydiler. İki kadim ilkenin ışık ve karanlık olduğunu ve bunlarla karışıp kaynaşan üçüncü bir evrenin var olduğunu iddia ettiler. Bazıları bunun yaşam ve İsa olduğunu söylerken, bazıları da İsa'nın bu üçüncü evrenin elçisi olduğunu iddia etti. Hepsi dünyanın yaratıldığını ve yaratılışın onda açıkça görüldüğünü kabul etti. Marcioncuların uzmanlaştıkları, dinlerini yazdıkları bir kitapları vardır ve Marcion'un da İncil adını verdiği bir kitabı vardır. Kendilerini Hristiyanlık ve Horasan ile gizlerler, birçoğu {cite:fihrist-ibn-al-nadim s. 474-475}."
  id: "Kaum Marcionit adalah pengikut Marcion, dan sebelum Daysaniyya, mereka adalah sekte Kristen yang lebih dekat dengan Manichean dan Daysaniyya. Mereka mengklaim bahwa dua prinsip kuno adalah terang dan gelap, dan bahwa ada alam semesta ketiga yang bercampur dan berbaur dengan keduanya. Beberapa dari mereka mengatakan bahwa itu adalah kehidupan dan bahwa itu adalah Yesus, dan beberapa dari mereka mengklaim bahwa Yesus adalah utusan dari alam semesta ketiga itu. Mereka semua sepakat bahwa dunia diciptakan dan bahwa penciptaan itu tampak jelas di dalamnya. Kaum Marcionit memiliki sebuah buku yang menjadi spesialisasi mereka, di mana mereka menulis agama mereka, dan Marcion memiliki sebuah buku Injil yang disebutnya. Mereka menyembunyikan diri dengan Kekristenan dan dengan Khorasan, banyak {cite:fihrist-ibn-al-nadim p. 474-475}."
