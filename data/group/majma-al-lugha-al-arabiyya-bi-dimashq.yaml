summary:
  ar: "مجمع اللغة العربية بدمشق، أقدم المجامع اللغوية العربية الحديثة كما يلخص ملف بحث قُدّم للمتحف. بدأ سنة 1918-1919 في عهد فيصل الأول، وترأسه محمد كرد علي من 1919 إلى 1953، وأصدر مجلة علمية من سنة 1921 وحقق كتباً وكلّف بمعاجم منها متن اللغة لأحمد رضا، وتصدّر التعريب بعد العهد العثماني."
  en: "The Arab Academy of Damascus, the oldest modern Arabic language academy according to a research summary supplied to the museum. It began in 1918-1919 under Faisal I, was presided over by Muhammad Kurd Ali from 1919 to 1953, issued a scholarly journal from 1921, published critical editions and commissioned dictionaries such as Ahmad Rida's Matn al-Lugha, and led Arabisation after Ottoman rule."
  ur: "مجمع اللغۃ العربیہ دمشق، جدید عربی لسانی مجامع میں سب سے قدیم، جیسا کہ عجائب گھر کو فراہم کردہ تحقیقی خلاصہ بتاتا ہے۔ اس کی ابتدا 1918-1919ء میں فیصل اول کے دور میں ہوئی، محمد کرد علی 1919ء سے 1953ء تک اس کے صدر رہے، اس نے 1921ء سے علمی رسالہ نکالا، کتابوں کے تنقیدی ایڈیشن شائع کیے اور احمد رضا کی متن اللغۃ جیسی لغات کی ذمہ داری دی، اور عثمانی دور کے بعد تعریب میں پیش پیش رہا۔"
  fr: "L'Académie arabe de Damas, la plus ancienne des académies modernes de la langue arabe selon une note de recherche fournie au musée. Elle naît en 1918-1919 sous Fayçal Ier, est présidée par Muhammad Kurd Ali de 1919 à 1953, publie une revue savante dès 1921, donne des éditions critiques et commande des dictionnaires comme le Matn al-Lugha d'Ahmad Rida, et mène l'arabisation après la période ottomane."
  es: "La Academia Árabe de Damasco, la más antigua de las academias modernas de la lengua árabe según un resumen de investigación entregado al museo. Nació en 1918-1919 bajo Faisal I, la presidió Muhammad Kurd Ali de 1919 a 1953, publicó una revista erudita desde 1921, editó críticamente libros y encargó diccionarios como el Matn al-Lugha de Ahmad Rida, y encabezó la arabización tras el dominio otomano."
