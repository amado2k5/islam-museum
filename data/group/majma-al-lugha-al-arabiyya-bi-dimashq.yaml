  en: "Arab Academy of Damascus (Majma' al-Lugha al-'Arabiyya bi-Dimashq)"
  ur: "مجمع اللغۃ العربیہ دمشق"
  fr: "Académie arabe de Damas (Majma' al-Lugha al-'Arabiyya bi-Dimashq)"
