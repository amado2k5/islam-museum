label: { ar: "الواقفة ⁦(في القرآن)⁩", en: "The Waqifa (those who suspend judgement on the Qur'an)", ur: "واقفہ ⁦(قرآن کے بارے میں توقف کرنے والے)⁩" }
summary:
  ar: "اسم أطلقه أئمة أهل الحديث في القرن الثالث على من قال في مسألة خلق القرآن: القرآن كلام الله، ولا يقول مخلوق ولا غير مخلوق. يجعلهم أحمد بن حنبل فيما يروى عنه إحدى فرق الجهمية الثلاث، ويفرق في الحكم بين من يخاصم ويعرف بالكلام، ومن لا يعرف به، والجاهل الذي يُعلَّم."
  en: "A name given by third-century hadith imams to those who, in the dispute over the createdness of the Qur'an, said 'The Qur'an is God's speech' but would say neither 'created' nor 'uncreated'. Ahmad ibn Hanbal, in reports from him, counts them one of the three branches of the Jahmiyya, and distinguishes the disputant versed in theology, the one not versed in it, and the ignorant person who is to be taught."
