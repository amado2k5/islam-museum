id: group/khawarij
class: group
kind: sect
label: { ar: "الخوارج" }
summary:
  ar: "الخوارج، فرقة يدور مذهبها — كما يلاحظ أحمد أمين — على مسألة الكفر والإيمان كالإرجاء لكن على النقيض منه؛ ففي كتاب الفرق بين الفرق للأشعري أن الذي يجمع الخوارج على افتراق مذاهبها تكفير علي وعثمان وأصحاب الجمل والحكمين وكل من رضي التحكيم، ووجوب الخروج على الإمام الجائر، واختلف الكعبي والأشعري في أن إكفار مرتكب الكبائر محل إجماعهم أم رأي أغلبيتهم إذ لا تكفر النجدات أصحاب الكبائر. ونظروا في الإيمان نظراً ضيقاً فلم يُعَد عندهم مؤمناً إلا من تحرز عن الكبائر، وهم على النقيض من الشيعة في أمرين: بينما يقدس الشيعة علياً يكفره الخوارج ويرون قاتله عبد الرحمن بن ملجم من خير البرية كما في أبيات عمران بن حطان {cite:duha-islam p. 944-945}. وكانت ثقافتهم — لغلبة البداوة — عربية خالصة لغوية أدبية بلا أثر للثقافات الأجنبية {cite:duha-islam p. 949}."
  en: "The Khawarij — a sect whose doctrine turns on kufr and iman like the Murji'a but in the opposite direction; per al-Ash'ari's Kitab al-Farq, what unites them is takfir of Ali, Uthman, the people of the Camel and the two arbitrators, and the duty of rising against unjust rulers {cite:duha-islam p. 944-945}."
