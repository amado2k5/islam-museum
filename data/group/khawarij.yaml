label: { ar: "الخوارج", en: "Khawarij", es: "Khawarij", fr: "Khawarij", ur: "خوارج", tr: "Hariciler", id: "Kharijites" }
summary:
  ar: "الخوارج، فرقة يدور مذهبها — كما يلاحظ أحمد أمين — على مسألة الكفر والإيمان كالإرجاء لكن على النقيض منه؛ ففي كتاب الفرق بين الفرق للأشعري أن الذي يجمع الخوارج على افتراق مذاهبها تكفير علي وعثمان وأصحاب الجمل والحكمين وكل من رضي التحكيم، ووجوب الخروج على الإمام الجائر، واختلف الكعبي والأشعري في أن إكفار مرتكب الكبائر محل إجماعهم أم رأي أغلبيتهم إذ لا تكفر النجدات أصحاب الكبائر. ونظروا في الإيمان نظراً ضيقاً فلم يُعَد عندهم مؤمناً إلا من تحرز عن الكبائر، وهم على النقيض من الشيعة في أمرين: بينما يقدس الشيعة علياً يكفره الخوارج ويرون قاتله عبد الرحمن بن ملجم من خير البرية كما في أبيات عمران بن حطان {cite:duha-islam p. 944-945}. وكانت ثقافتهم — لغلبة البداوة — عربية خالصة لغوية أدبية بلا أثر للثقافات الأجنبية {cite:duha-islam p. 949}."
  en: "The Khawarij — a sect whose doctrine turns on kufr and iman like the Murji'a but in the opposite direction; per al-Ash'ari's Kitab al-Farq, what unites them is takfir of Ali, Uthman, the people of the Camel and the two arbitrators, and the duty of rising against unjust rulers {cite:duha-islam p. 944-945}."
  es: "Los Khawarij — una secta cuya doctrina se basa en la kufr y la iman como los Murji'a pero en la dirección opuesta; según el Kitab al-Farq de al-Ash'ari, lo que los une es el takfir de Ali, Uthman, la gente del Camello y los dos árbitros, y el deber de levantarse contra los gobernantes injustos {cite:duha-islam p. 944-945}."
  fr: "Les Kharijites — une secte dont la doctrine repose sur la mécréance et la foi comme les Murji'a mais dans le sens inverse; selon le Kitab al-Farq d'al-Ash'ari, ce qui les unit est le takfir d'Ali, d'Uthman, des gens du Chameau et des deux arbitres, et le devoir de se soulever contre les dirigeants injustes {cite: duha-islam p. 944-945}."
  ur: "خوارج - ایک ایسا فرقہ جس کا عقیدہ کفر و ایمان کو مرجع کی طرح لیکن مخالف سمت میں چلا جاتا ہے۔ اشعری کی کتاب الفرق کے مطابق جو چیز انہیں متحد کرتی ہے وہ علی، عثمان، اونٹ والوں اور دو ثالثوں کی تکفیر اور ظالم حکمرانوں کے خلاف اٹھنے کا فرض ہے۔ 944-945}۔"
  tr: "Hariciler, Ahmed Amin'in de belirttiği gibi, doktrinleri Murci'ye çok benzeyen ancak ona karşıt bir şekilde küfür ve iman meselesi etrafında dönen bir mezheptir. El-Eş'ari, *Mezhepler Arasındaki Fark* adlı kitabında, farklı düşünce ekollerine rağmen Haricileri birleştiren şeyin, Ali, Osman, Deve'nin arkadaşları, iki hakem ve hakemliği kabul eden herkesi dışlamaları ve haksız bir yöneticiye karşı isyan etme yükümlülüğüne inanmaları olduğunu belirtir. El-Kâbi ve El-Eş'ari, büyük günah işleyenlerin dışlanmasının bir ittifak meselesi mi yoksa sadece çoğunluğun görüşü mü olduğu konusunda farklı görüşlere sahipti; zira Necidliler büyük günah işleyenleri dışlamazlar. Onlar, sadece büyük günahlardan uzak duranları mümin olarak kabul eden dar bir iman anlayışına sahiptiler. Şiilerden iki açıdan farklıydılar: Şiiler Ali'ye saygı gösterirken, Hariciler onu dışlarlar ve katili Abdülrahman ibn Mulcem'i, İmran ibn Hattan'ın ayetlerinde de belirtildiği gibi, yaratılmışların en iyilerinden sayarlar (bkz: duha-islam s. 944-945). Kültürleri ise, Bedevi yaşam tarzının yaygınlığı nedeniyle, dil ve edebiyat bakımından tamamen Arapça olup, yabancı kültürlerden hiçbir etki taşımamıştır (bkz: duha-islam s. 949)."
  id: "Kaum Kharijites, sebuah sekte yang doktrinnya—seperti yang diamati Ahmad Amin—berputar di sekitar masalah kekafiran dan iman, mirip dengan Murji'ah, tetapi berlawanan dengannya. Dalam bukunya, *Perbedaan Antar Sekte*, al-Ash'ari menyatakan bahwa yang menyatukan kaum Kharijites, terlepas dari perbedaan aliran pemikiran mereka, adalah pengucilan mereka terhadap Ali, Utsman, para Sahabat Unta, kedua arbiter, dan semua orang yang menerima arbitrase, serta keyakinan mereka akan kewajiban untuk memberontak terhadap penguasa yang tidak adil. Al-Ka'bi dan al-Ash'ari berbeda pendapat mengenai apakah pengucilan terhadap orang-orang yang melakukan dosa besar merupakan masalah konsensus atau hanya pendapat mayoritas, karena kaum Najdit tidak mengucilkan orang-orang yang melakukan dosa besar. Mereka memiliki pandangan sempit tentang iman, hanya menganggap orang-orang yang menjauhi dosa besar sebagai orang beriman. Mereka berbeda dari Syiah dalam dua hal: sementara Syiah menghormati Ali, kaum Kharijites mengucilkannya dan menganggap pembunuhnya, Abd al-Rahman ibn Muljam, sebagai salah satu manusia terbaik, sebagaimana dalam syair-syair Imran ibn Hattan (kutipan:duha-islam hlm. 944-945). Budaya mereka—karena dominasi kehidupan Badui—murni berbahasa dan sastra Arab, tanpa pengaruh dari budaya asing (kutipan:duha-islam hlm. 949)."
