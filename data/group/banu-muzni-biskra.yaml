label:
  ar: بنو مزني أمراء بسكرة
  en: Banu Muzni, amirs of Biskra
  es: "Banu Muzni, emires de Biskra"
  fr: "Banu Muzni, émirs de Biskra"
  ur: "بنو مزنی، بسکرہ کے امیر"
  tr: "Banu Mazni, Biskra prensleri"
  id: "Banu Mazni, pangeran Biskra"
summary:
  ar: "بنو مزني، أمراء بسكرة وبلاد الزاب؛ من بني جرى بن علوان من الأثبج فيما يتلقاه ابن خلدون من نسابة الهلاليين، نزلوا قرى الزاب على من كان بها قبلهم من زناتة وطوالع الفتح وقاسموا أهلها في الحلو والمر، وانتظم كبارهم في أرباب الشورى على تسيير البلد، ومن أمرائهم موسى بن محمد بن مسعود البلط أمير البدو الذي بايع لأبي إسحاق الحفصي لما خرج على أخيه المستنصر، ودام أمرهم في فتن بني عبد الواد وبني مرين إلى عهد ابن خلدون."
  en: "Banu Muzni, amirs of Biskra and the Zab country; of Banu Jari ibn Ulwan of the Athbaj by the genealogists Ibn Khaldun cites, who settled the Zab villages over the earlier Zanata and conquest-era inhabitants and shared sweet and bitter with them, their grandees organised as lords of the shura council — among their amirs Musa ibn Muhammad ibn Mas'ud al-Balt, amir of the nomads who gave bay'a to the Hafsid Abu Ishaq against his brother al-Mustansir, their rule enduring through the Abd al-Wadid and Marinid fitnas to Ibn Khaldun's day."
  es: "Banu Muzni, emires de Biskra y del país de Zab; de Banu Jari ibn Ulwan de Athbaj por los genealogistas que cita Ibn Khaldun, que asentaron las aldeas de Zab sobre los habitantes anteriores de Zanata y de la época de la conquista y compartieron con ellos lo dulce y lo amargo, sus grandes organizados como señores del consejo de la shura, entre sus emires Musa ibn Muhammad ibn Mas'ud al-Balt, emir de los nómadas que prestó juramento de lealtad al Hafsid Abu Ishaq contra su hermano al-Mustansir, su gobierno perduró a través de las fitnas Abd al-Wadid y Marinid hasta la época de Ibn Khaldun."
  fr: "Les Banu Muzni, émirs de Biskra et du pays de Zab; des Banu Jari ibn Ulwan d'Athbaj selon les généalogistes cités par Ibn Khaldun, qui installèrent les villages de Zab sur les anciens habitants de Zanata et de l'époque de la conquête et partagèrent avec eux les joies et les peines, leurs grands chefs étant organisés en seigneurs du conseil de la shura — parmi leurs émirs Musa ibn Muhammad ibn Mas'ud al-Balt, émir des nomades qui prêta allégeance au Hafsid Abu Ishaq contre son frère al-Mustansir, leur règne perdurant à travers les fitnas des Abd al-Wadid et des Mérinides jusqu'à l'époque d'Ibn Khaldun."
  ur: "بنو مزنی، بسکرہ اور ملک زب کے امیر؛ ابن خلدون نے ابن خلدون کی طرف سے عتبج کے بنو جری بن علوان کا حوالہ دیا ہے، جنہوں نے زاب دیہات کو سابقہ زانت اور فتح کے زمانے کے باشندوں پر آباد کیا اور ان کے ساتھ میٹھا اور کڑوا بانٹا، ان کے بزرگوں نے شوریٰ کونسل کے سرداروں کے طور پر منظم کیا - ان کے امیروں میں سے موسیٰ بن محمد بن المسعود بن مسعود کو امیر المومنین کا عہدہ دیا۔ حفصید ابو اسحاق اپنے بھائی المستنصر کے خلاف، ان کی حکمرانی عبد الودید اور مرنید فتنوں کے ذریعے ابن خلدون کے دور تک جاری رہی۔"
  tr: "İbn Haldun'un Hilaliyyin soyağacı uzmanlarından aldığı bilgilere göre, Biskra ve Zab topraklarının prensleri olan Beni Mazni, Athbaj kabilesinden Beni Jari ibn Alwan'dan geliyordu. Zenata ve ilk fatihlerden gelenlerin izinden giderek Zab köylerine yerleştiler ve halkıyla iyi ve kötü günleri paylaştılar. Büyükleri, ülkeyi yönetmek üzere Şura halkı olarak örgütlenmişti. Prensleri arasında, kardeşi el-Mustansir'e isyan ettiğinde Ebu İshak el-Hafsi'ye biat eden Bedevi prensi Musa ibn Muhammed ibn Mesud el-Balt da vardı. Yönetimleri, Beni Abd el-Vad ve Beni Marin'in sıkıntıları sırasında İbn Haldun zamanına kadar devam etti."
  id: "Bani Mazni, para pangeran Biskra dan wilayah Zab, berasal dari Bani Jari bin Alwan dari Athbaj, menurut apa yang diterima Ibnu Khaldun dari para ahli silsilah Hilaliyyin. Mereka menetap di desa-desa Zab berdasarkan orang-orang yang telah ada di sana sebelumnya dari Zenata dan para penakluk awal, dan mereka berbagi suka dan duka dengan penduduknya. Para tetua mereka diorganisir menjadi anggota Dewan Syura untuk menjalankan pemerintahan negara. Di antara para pangeran mereka adalah Musa bin Muhammad bin Masoud al-Balt, pangeran Badui, yang berjanji setia kepada Abu Ishaq al-Hafsi ketika ia memberontak melawan saudaranya al-Mustansir. Pemerintahan mereka berlanjut selama masa kesengsaraan Bani Abd al-Wad dan Bani Marin hingga zaman Ibnu Khaldun."
