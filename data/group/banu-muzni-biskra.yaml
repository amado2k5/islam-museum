label:
  ar: بنو مزني أمراء بسكرة
  en: Banu Muzni, amirs of Biskra
summary:
  ar: "بنو مزني، أمراء بسكرة وبلاد الزاب؛ من بني جرى بن علوان من الأثبج فيما يتلقاه ابن خلدون من نسابة الهلاليين، نزلوا قرى الزاب على من كان بها قبلهم من زناتة وطوالع الفتح وقاسموا أهلها في الحلو والمر، وانتظم كبارهم في أرباب الشورى على تسيير البلد، ومن أمرائهم موسى بن محمد بن مسعود البلط أمير البدو الذي بايع لأبي إسحاق الحفصي لما خرج على أخيه المستنصر، ودام أمرهم في فتن بني عبد الواد وبني مرين إلى عهد ابن خلدون."
  en: "Banu Muzni, amirs of Biskra and the Zab country; of Banu Jari ibn Ulwan of the Athbaj by the genealogists Ibn Khaldun cites, who settled the Zab villages over the earlier Zanata and conquest-era inhabitants and shared sweet and bitter with them, their grandees organised as lords of the shura council — among their amirs Musa ibn Muhammad ibn Mas'ud al-Balt, amir of the nomads who gave bay'a to the Hafsid Abu Ishaq against his brother al-Mustansir, their rule enduring through the Abd al-Wadid and Marinid fitnas to Ibn Khaldun's day."
