summary:
  ar: "قناة تلفزيونية إسلامية ماليزية حكومية مجانية، تملكها وتديرها شركة الهجرة الإعلامية تحت إشراف إدارة التنمية الإسلامية الماليزية، انطلقت رسميًا في 7 ديسمبر 2010 من مجمع المركز الإسلامي في كوالالمبور، وهي أول شبكة تلفزيونية إسلامية ماليزية متكاملة متوافقة مع الشريعة؛ بلغ عدد متابعي حسابها على تيك توك ⁦(@tvalhijrah)⁩ 265,200 متابع بحسب كولر كما زُحفت صفحته نحو 13 نوفمبر 2026، ولم يُثبَّت عدد مشتركي قناتها على يوتيوب في أي قراءة مؤرخة."
  en: "Malaysia's state-owned free-to-air Islamic television channel, owned and operated by AlHijrah Media Corporation under the Department of Islamic Development Malaysia, officially launched on 7 December 2010 from the Islamic Centre Complex in Kuala Lumpur and the country's first full-fledged sharia-compliant free-to-air Islamic television network; its TikTok account (@tvalhijrah) counted 265,200 followers by Kolr's count as crawled about 13 November 2026, and no dated subscriber count for its YouTube channel could be pinned."
  ur: "ملائیشیا کی سرکاری ملکیت والی مفت اسلامی ٹیلی ویژن چینل، جس کی مالک اور منتظم الہجرہ میڈیا کارپوریشن ہے جو ملائیشیا کی اسلامی ترقی کی انتظامیہ کی نگرانی میں ہے؛ باضابطہ آغاز 7 دسمبر 2010ء کو کوالالمپور کے اسلامک سینٹر کمپلیکس سے ہوا اور یہ ملک کی پہلی مکمل شریعت سے ہم آہنگ مفت اسلامی ٹیلی ویژن نیٹ ورک ہے؛ اس کے ٹک ٹاک اکاؤنٹ ⁦(@tvalhijrah)⁩ کے فالوورز کی تعداد تقریباً 13 نومبر 2026ء کو کرال کیے گئے کولر کے شمار کے مطابق 265,200 تھی، اور اس کی یوٹیوب چینل کے سبسکرائبرز کی کوئی مؤرخہ تعداد ثابت نہیں ہو سکی۔"
  es: "El canal de televisión islámico gratuito de propiedad estatal de Malasia, propiedad de AlHijrah Media Corporation y operado por esta bajo el Departamento de Desarrollo Islámico de Malasia, se lanzó oficialmente el 7 de diciembre de 2010 desde el Complejo del Centro Islámico en Kuala Lumpur y es la primera red de televisión islámica gratuita del país que cumple plenamente con la sharia; su cuenta de TikTok (@tvalhijrah) contaba con 265.200 seguidores según el recuento de Kolr realizado alrededor del 13 de noviembre de 2026, y no se pudo determinar el número de suscriptores de su canal de YouTube."
