  layer: own-research
  source: "The wave-196 harvest listed Khidma TV in its uncounted channel universe at about 180,000 Facebook followers read on a third-party post dated January 2026 — expressly not a direct read — and the coordinator's coordinator check required a direct re-read before any promotion. That re-read was attempted on 8 November 2026 by four routes: (1) a text fetch of the Facebook page itself (facebook.com/mzeewakhidma, the handle given in the outlet's own YouTube video descriptions) SUCCEEDED and returned the profile header 'Khidma TV (@MzeewaKhidma)', account type professional and 184,577 followers — the dated direct figure recorded here, which clears the 100,000 bar and supersedes the harvest's third-party figure; (2) the Facebook connector's profile lookup for the same handle returned HTTP 403 'Profile Not Accessible' (that tool reads only the viewer and the viewer's friends), so it returned no count and is not relied on; (3) web searches for the page, its handle and tracker pages naming it returned no Facebook tracker figure — the only tracker page found, Instastatistics, names the outlet's Instagram account @khidma_tv at 45,486 followers (page crawled 21 March 2026), a different platform, not used for the Facebook figure; (4) the outlet's own YouTube channel (@khidmaonlinetv350) and TikTok account (@khidmatv1) were read directly the same day and returned no follower or subscriber counts, so no count is stated for them. Identity: the organisation behind the page is Khidma TV itself, pinned from the page itself (display name Khidma TV, professional account) and from the outlet's own cross-platform self-presentation actually read — its YouTube descriptions list the Facebook, Instagram, TikTok and YouTube handles together as its own social accounts, and its TikTok bio gives a Tanzanian (+255) contact number; its content is multi-speaker lecture coverage (khutbahs and muhadharas by various sheikhs, filmed at Dar es Salaam mosques including Masjid Idirssa in Kariakoo and Masjid Songea in Ilala), so it is built as a media-outlet group, not as any one speaker's page. NO source read in this run names a separate parent organisation, a legal owner or an individual manager, and no founding date is documented in the sources read, so neither is asserted. This outlet is distinct from group/khidmatulquran-islamic-foundation, the Tanzanian Qur'an-competition foundation (khidmatulquran.or.tz) built in wave 191: different name, different work, no link between them appears in any source read. De-duplicated against the staging tree: no khidma-tv record existed."
