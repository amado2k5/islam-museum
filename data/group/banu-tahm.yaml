label: { en: Banu Taym ibn Murra, ar: "بنو تيم بن مرة", es: "Banu Taym ibn Murra", fr: "Banu Taym ibn Murra", ur: "بنو تیم بن مرہ", tr: "Banu Taym ibn Murrah", id: "Banu Taym ibn Murrah" }
summary:
  ar: "من بطون قريش؛ يقدّمه ابن إسحاق في قوائم مهاجرة الحبشة بنسبه «تيم بن مرة بن كعب»، ويعدّ منه مهاجرين ونساءً وأبناءً ولدوا هناك."
  en: A clan of Quraysh; Ibn Ishaq lists it in the Abyssinia rolls as 'Taym ibn Murra ibn Ka'b', counting emigrants, women and children born there.
  es: "Un clan de los Quraysh; Ibn Ishaq lo menciona en los registros de Abisinia como 'Taym ibn Murra ibn Ka'b', donde se contabilizan los emigrantes, las mujeres y los niños nacidos allí."
  fr: "Un clan de Quraysh; Ibn Ishaq le mentionne dans les registres d'Abyssinie sous le nom de « Taym ibn Murra ibn Ka'b », comptant les émigrants, les femmes et les enfants qui y sont nés."
  ur: "قریش کا ایک قبیلہ؛ ابن اسحاق نے اسے حبشہ کی فہرست میں 'تیم ابن مرہ ابن کعب' کے نام سے درج کیا ہے، جس میں وہاں پیدا ہونے والے مہاجرین، عورتوں اور بچوں کی گنتی کی گئی ہے۔"
  tr: "Kureyş kabilelerinden olan İbn İshak, Habeşistan'a hicret edenlerin listelerinde onu \"Taym ibn Murrah ibn Ka'b\" soyuyla birlikte sunar ve ondan oraya doğan hicret edenleri, kadınları ve çocukları sayar."
  id: "Dari klan Quraysh; Ibnu Ishaq memasukkannya dalam daftar para emigran ke Abyssinia dengan garis keturunannya \"Taym ibn Murrah ibn Ka'b\", dan menghitung dari keturunannya para emigran, wanita, dan anak-anak yang lahir di sana."
