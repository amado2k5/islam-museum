summary:
  ar: "تنوخ بن مالك بن فهم بن تيم اللات بن الأزد بن وبرة بن ثعلبة بن حلوان بن عمران بن الحاف بن قضاعة بن مالك بن حمير، وكان أول من ملك من تنوخ النعمان بن عمرو بن مالك ثم ابنه عمرو ثم الحواري بن النعمان ولم يملك من تنوخ غيرهم، ثم وردت سليح الشام فغلبت على تنوخ وتنصرت {cite:muruj-al-dhahab p. 425}."
  en: "The Quda'a-line tribe whose three kings — al-Nu'man, Amr and al-Hawari — ruled the Arabs of Syria under Rome before Saliḥ displaced them and embraced Christianity {cite:muruj-al-dhahab p. 425}."
