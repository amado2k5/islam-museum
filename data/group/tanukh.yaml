label: { ar: "تنوخ", en: "Tanukh", es: "Tanukh", fr: "Tanukh", ur: "تنوخ" }
summary:
  ar: "تنوخ بن مالك بن فهم بن تيم اللات بن الأزد بن وبرة بن ثعلبة بن حلوان بن عمران بن الحاف بن قضاعة بن مالك بن حمير، وكان أول من ملك من تنوخ النعمان بن عمرو بن مالك ثم ابنه عمرو ثم الحواري بن النعمان ولم يملك من تنوخ غيرهم، ثم وردت سليح الشام فغلبت على تنوخ وتنصرت {cite:muruj-al-dhahab p. 425}."
  en: "The Quda'a-line tribe whose three kings — al-Nu'man, Amr and al-Hawari — ruled the Arabs of Syria under Rome before Saliḥ displaced them and embraced Christianity {cite:muruj-al-dhahab p. 425}."
  es: "La tribu Quda'a-line, cuyos tres reyes —al-Nu'man, Amr y al-Hawari— gobernaron a los árabes de Siria bajo el dominio romano antes de que Saliḥ los desplazara y abrazara el cristianismo {cite:muruj-al-dhahab p. 425}."
  fr: "La tribu de la lignée Quda'a dont les trois rois — al-Nu'man, Amr et al-Hawari — ont régné sur les Arabes de Syrie sous Rome avant que Saliḥ ne les déplace et n'embrasse le christianisme {cite:muruj-al-dhahab p. 425}."
  ur: "قبیلہ قدعہ جس کے تین بادشاہوں - النعمان، عمرو اور الحواری - نے روم کے ماتحت شام کے عربوں پر صالح کے بے گھر ہونے اور عیسائیت قبول کرنے سے پہلے حکومت کی تھی۔ 425}۔"
