  ar: "أكبر الطرق الصوفية انتشارًا في آسيا الوسطى والعالم العثماني والهند، تنسب إلى بهاء الدين نقشبند البخاري (ت 791هـ/1389م)؛ تتميز بالذكر الخفي والزهد في الظاهر، ومن أشهر فروعها المجددية {cite:trimingham-sufi-orders-1998 p. 31} {cite:ziad-naqshbandi-mujaddidi-2018}."
  en: "The most widespread of the Sufi orders across Central Asia, the Ottoman lands and India, named after Baha al-Din Naqshband of Bukhara (d. 791 AH/1389 CE); marked by silent remembrance (dhikr khafi) and outward sobriety, its best-known branch the Mujaddidi {cite:trimingham-sufi-orders-1998 p. 31} {cite:ziad-naqshbandi-mujaddidi-2018}."
