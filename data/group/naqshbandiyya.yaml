id: group/naqshbandiyya
class: group
kind: order
label:
  ar: الطريقة النقشبندية
  en: The Naqshbandi order
  ur: نقشبندیہ طریقہ
  es: "La orden Naqshbandi"
  fr: "L'ordre Naqshbandi"
  tr: "Nakşibendi Tarikatı"
  id: "Tarekat Naqshbandi"
summary:
  ar: "أكبر الطرق الصوفية انتشارًا في آسيا الوسطى والعالم العثماني والهند، تنسب إلى بهاء الدين نقشبند البخاري ⁦(ت 791هـ/1389م)⁩؛ تتميز بالذكر الخفي والزهد في الظاهر، ومن أشهر فروعها المجددية {cite:trimingham-sufi-orders-1998 p. 31} {cite:ziad-naqshbandi-mujaddidi-2018}."
  en: "The most widespread of the Sufi orders across Central Asia, the Ottoman lands and India, named after Baha al-Din Naqshband of Bukhara (d. 791 AH/1389 CE); marked by silent remembrance (dhikr khafi) and outward sobriety, its best-known branch the Mujaddidi {cite:trimingham-sufi-orders-1998 p. 31} {cite:ziad-naqshbandi-mujaddidi-2018}."
  es: "La más extendida de las órdenes sufíes en Asia Central, los territorios otomanos e India, nombrada en honor a Baha al-Din Naqshband de Bujará (m. 791 AH/1389 CE); caracterizada por el recuerdo silencioso (dhikr khafi) y la sobriedad exterior, su rama más conocida es la Mujaddidi {cite:trimingham-sufi-orders-1998 p. 31} {cite:ziad-naqshbandi-mujaddidi-2018}."
  fr: "L'ordre soufi le plus répandu en Asie centrale, dans les territoires ottomans et en Inde, nommé d'après Baha al-Din Naqshband de Boukhara (mort en 791 AH/1389 CE); marqué par le souvenir silencieux (dhikr khafi) et la sobriété extérieure, sa branche la plus connue est celle des Mujaddidi {cite:trimingham-sufi-orders-1998 p. 31} {cite:ziad-naqshbandi-mujaddidi-2018}."
  ur: "وسطی ایشیا، عثمانی سرزمینوں اور ہندوستان میں سب سے زیادہ پھیلے ہوئے صوفی احکامات، بخارا کے بہاء الدین نقشبند کے نام سے منسوب ⁦(متوفی 791ھ/1389 عیسوی)⁩؛ خاموش یاد ⁦(ذکر خفی)⁩ اور ظاہری سکون سے نشان زد، اس کی سب سے مشہور شاخ مجددی {حوالہ: ترمنگھم-صوفی-آرڈرز-1998 ص۔ 31} {حوالہ: زیاد-نقشبندی-مجددی-2018}۔"
  tr: "Orta Asya, Osmanlı dünyası ve Hindistan'daki en büyük Sufi tarikatı Bahaüddin Nakşibend el-Buhari'ye (ö. 791 H./1389 MS) atfedilir; gizli zikir ve zahiri zühd ile karakterize edilir ve onun en ünlü dallarından biri Müceddidiyye'dir {cite:trimingham-sufi-orders-1998 s. 31} {alıntı:ziad-naqshbandi-mujaddidi-2018}."
  id: "Tarekat sufi terbesar di Asia Tengah, dunia Ottoman dan India, dimiliki oleh Baha’ al-Din Naqsyband al-Bukhari (w. 791 H/1389 M); ia dicirikan oleh ingatan tersembunyi dan asketisme lahiriah, dan salah satu cabangnya yang paling terkenal adalah Mujaddidiyya {cite:trimingham-sufi-orders-1998 p. 31} {kutip:ziad-naqsybandi-mujaddidi-2018}."
