label:
  ar: المذهب المالكي
  en: "The Maliki school (madhhab)"
  es: "La escuela Maliki (madhhab)"
  fr: "L'école malikite (madhhab)"
  ur: "مالکی مکتب ⁦(مذہب)⁩"
  tr: "Maliki düşünce okulu"
  id: "Aliran pemikiran Maliki"
summary:
  ar: "مذهب مالك بن أنس صاحب الموطأ؛ يعده أحمد أمين ثالث المذاهب في استعمال الرأي بعد الحنابلة والظاهرية {cite:duha-islam p. 502}، ومن أدواته «الاستصلاح» أو «المصالح المرسلة» المبنية على أن الشارع يدور في تشريعه على حفظ أمور خمسة: الدين والنفس والعقل والنسل والمال {cite:duha-islam p. 504}؛ ويذكر السايس أن مالكًا قدّم عمل أهل المدينة على القياس وخبر الواحد، وأخذ بالمصالح المرسلة وبقول الصحابي إذا صح سنده {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 92-93}."
  en: "Malik ibn Anas's school — third of the madhhabs in resort to ra'y {cite:duha-islam p. 502}, working the tool of istislah, the safeguarding of religion, life, reason, progeny and wealth {cite:duha-islam p. 504}."
  es: "La escuela de Malik ibn Anas — tercera de las madhhabs en recurrir a ra'y {cite:duha-islam p. 502}, trabajando la herramienta de istislah, la salvaguarda de la religión, la vida, la razón, la descendencia y la riqueza {cite:duha-islam p. 504}."
  fr: "L'école de Malik ibn Anas — troisième des madhhabs à recourir au ra'y {cite:duha-islam p. 502}, utilisant l'outil de l'istislah, la sauvegarde de la religion, de la vie, de la raison, de la progéniture et des richesses {cite:duha-islam p. 504}."
  ur: "مالک ابن انس کا مکتبہ - رائی کے سہارے میں تیسرا مکتب۔ 502}، استحاضہ کا آلہ کار، دین، زندگی، عقل، اولاد اور مال کی حفاظت کرنا۔ 504}۔"
  tr: "Ahmed Amin'e göre, El-Muvatta'nın yazarı Malik ibn Anas'ın düşünce ekolü, Hanbeli ve Zehiri'den sonra görüşe dayalı üçüncü ekol olarak kabul edilir {kaynak:duha-islam s. 502}. Bu ekolün araçlarından biri de, kanun koyucunun yasalarının beş hususu koruma etrafında döndüğü gerçeğine dayanan \"istislah\" veya \"masalih mursalah\"tır: din, hayat, akıl, soy ve mal {kaynak:duha-islam s. 504}. El-Sayis, Malik'in Medine halkının uygulamasına kıyas ve tek bir rivayetin yerine öncelik verdiğini ve isnad zinciri sağlam ise masalih mursalah'ı ve Sahabe'nin sözünü benimsediğini belirtir {kaynak:nashat-al-fiqh-al-ijtihadi-azhar s. 92-93}."
  id: "Mazhab Malik bin Anas, penulis kitab Al-Muwatta, dianggap oleh Ahmad Amin sebagai mazhab ketiga dalam penggunaan pendapat setelah mazhab Hanbali dan Zahiri {cite:duha-islam hlm. 502}. Di antara alat-alatnya adalah “istislah” atau “masalih mursalah” berdasarkan fakta bahwa legislasi pembuat hukum berpusat pada pelestarian lima hal: agama, kehidupan, akal, keturunan, dan harta benda {cite:duha-islam hlm. 504}. Al-Sayis menyebutkan bahwa Malik lebih mengutamakan praktik penduduk Madinah daripada analogi dan riwayat dari satu perawi, dan ia mengadopsi masalih mursalah dan pernyataan seorang Sahabat jika sanadnya sahih {cite:nashat-al-fiqh-al-ijtihadi-azhar hlm. 92-93}."
