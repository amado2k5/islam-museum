  tr: "Andaghar, Sistan ile sınır komşusu olan Kerman bölgesinden bir halktır. Asawira'dan sonra İslamiyet'i kabul etmişler ve Ebu Musa onları Sayyija ve Zutt ile birlikte Basra'ya yerleştirmiştir."
  id: "Suku Andaghar adalah orang-orang dari wilayah Kerman, yang berbatasan dengan Sistan. Mereka masuk Islam setelah Asawira, dan Abu Musa menempatkan mereka di Basra bersama dengan Sayyija dan Zutt."
