  ar: "الأندغار قوم من ناحية كرمان مما يلي سجستان؛ أسلموا على أثر الأساورة وأنزلهم أبو موسى البصرة مع السيايجة والزط."
  en: "The Andaghar — a people of the Kirman side toward Sijistan; they converted in the asawira's wake and were lodged at Basra with the Sayabija and Zutt."
