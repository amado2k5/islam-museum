label:
  ar: دائرة التنمية الإسلامية الماليزية ⁦(جاكيم)⁩
  en: Department of Islamic Development Malaysia (JAKIM)
  ur: محکمہ اسلامی ترقی ملائیشیا ⁦(جاکیم)⁩
summary:
  ar: وكالة حكومية اتحادية ماليزية تدير الشؤون الإسلامية، أُسست في 1 يناير 1997؛ فيها قسم لإدارة الحلال، وأطلقت شعار شهادة
    الحلال الموحّد في 1 أكتوبر 2003، وتتولى أمانة مجلس الحلال الماليزي والاعتراف بجهات التصديق الأجنبية.
  en: A Malaysian federal government agency administering Islamic affairs, established on 1 January 1997; it has a Halal Management
    division, introduced the standardised halal certification logo on 1 October 2003, and serves as secretary of the Malaysian
    Halal Council, which recognises foreign halal certification bodies.
  ur: ملائیشیا کی وفاقی سرکاری ایجنسی جو اسلامی امور کا انتظام کرتی ہے؛ یکم جنوری 1997 کو قائم ہوئی؛ اس کا حلال انتظامی ڈویژن
    ہے، اس نے یکم اکتوبر 2003 کو یکساں حلال نشان متعارف کرایا، اور یہ ملائیشین حلال کونسل کی سیکرٹری ہے جو غیر ملکی حلال اداروں
    کو تسلیم کرتی ہے۔
