label: { ar: "بنو عبد مناف", en: "Banu Abd Manaf", es: "Banu Abd Manaf", fr: "Banu Abd Manaf", ur: "بنو عبد مناف", tr: "Banu Abd Manaf", id: "Banu Abd Manaf" }
summary:
  ar: "بنو عبد مناف بن قصي — قريش البطاح والبيت النبوي: هاشم والمطلب وعبد شمس ونوفل أولاد عبد مناف، وإليهم خرجت السقاية والرفادة واللواء والإيفاد في قرعة المناصب {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/125-132}."
  en: "Banu Abd Manaf ibn Qusayy — Quraysh of the hollows and the Prophet's house: Hashim, al-Muttalib, Abd Shams and Nawfal, the sons of Abd Manaf, to whose line the siqaya, rifada, liwa and ifada fell in the casting of the offices {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/125-132}."
  es: "Banu Abd Manaf ibn Qusayy — Quraysh de los huecos y la casa del Profeta: Hashim, al-Muttalib, Abd Shams y Nawfal, los hijos de Abd Manaf, a cuya línea recayeron la siqaya, rifada, liwa e ifada en el reparto de los cargos {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/125-132}."
  fr: "Banu Abd Manaf ibn Qusayy — Quraysh des creux et de la maison du Prophète: Hashim, al-Muttalib, Abd Shams et Nawfal, les fils d'Abd Manaf, à la lignée desquels les siqaya, rifada, liwa et ifada sont tombés dans le jet des offices {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/125-132}."
  ur: "بنو عبد مناف ابن قصی - کھوکھلیوں کے قریش اور رسول کے گھر: ہاشم، المطلب، عبد شمس اور نوفل، عبد مناف کے بیٹے، جن کے سلسلے میں سیاقیہ، رفدہ، لیوا اور افادہ دفتروں کی کاسٹنگ میں گرے تھے۔ 1/125-132}۔"
  tr: "Abd Manaf ibn Qusai'nin oğulları - ovaların Kureyş'i ve Peygamberlik Evi: Abd Manaf'ın oğulları Haşim, El-Muttalib, Abd Şems ve Nevfel; sulama, besleme, sancak ve makamlar için yapılan kura çekiminde heyet onlara gitti. {Kaynak:mubarakpuri-raheeq s.31} {Kaynak:ibn-hisham-sira 1/125-132}"
  id: "Putra-putra Abd Manaf ibn Qusai — kaum Quraisy di dataran dan keluarga Nabi: Hashim, Al-Muttalib, Abd Shams dan Nawfal, putra-putra Abd Manaf, dan kepada mereka diberikan air, makanan, panji dan delegasi dalam undian untuk posisi-posisi tersebut {cite:mubarakpuri-raheeq p.31} {cite:ibn-hisham-sira 1/125-132}."
