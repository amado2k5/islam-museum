  ar: "قناة المحمدية التلفزيونية الرسمية في إندونيسيا، انطلقت في نوفمبر 2013 تحت شعار «ذكيّ منوّر» بعد توجيه من المؤتمر الوطني للجمعية سنة 2005؛ بلغ عدد مشتركي قناتها على يوتيوب ⁦(@televisimuhammadiyah)⁩ نحو 415,000 مشترك بحسب vidIQ في قراءة حُدّثت في 8 نوفمبر 2026، مع 39,300,000 مشاهدة ونحو 27,034 مقطعًا."
  en: "Muhammadiyah's official television channel in Indonesia, launched in November 2013 under the tagline Cerdas Mencerahkan ('smart, enlightening') after a 2005 directive of the organisation's national assembly; its YouTube channel (@televisimuhammadiyah) counted about 415,000 subscribers by vidIQ's count on a reading last updated 8 November 2026, with 39,300,000 views and about 27,034 videos."
  ur: "انڈونیشیا میں محمدیہ کی باضابطہ ٹیلی ویژن چینل، جو تنظیم کی قومی مجلس کی 2005ء کی ہدایت کے بعد نومبر 2013ء میں «چرداس منچراہکن» ⁦(ذہین، روشن کرنے والا)⁩ کے نعرے کے تحت شروع ہوئی؛ اس کے یوٹیوب چینل ⁦(@televisimuhammadiyah)⁩ کے سبسکرائبرز کی تعداد 8 نومبر 2026ء کو آخری بار اپ ڈیٹ کی گئی vidIQ کی خوانی کے مطابق تقریباً 415,000 تھی، جبکہ اس کی ویڈیوز تقریباً 27,034 اور ویوز 39,300,000 تھے۔"
  es: "El canal de televisión oficial de Muhammadiyah en Indonesia, lanzado en noviembre de 2013 bajo el lema Cerdas Mencerahkan ('inteligente, esclarecedor') tras una directiva de la asamblea nacional de la organización en 2005; su canal de YouTube (@televisimuhammadiyah) contaba con unos 415.000 suscriptores según el recuento de vidIQ en una lectura actualizada por última vez el 8 de noviembre de 2026, con 39.300.000 visualizaciones y unos 27.034 vídeos."
