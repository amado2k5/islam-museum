summary:
  ar: "ولد سليح بن حلوان بن عمران بن الحاف بن قضاعة، وردت سليح الشام فغلبت على تنوخ وتنصرت فملكتها الروم على العرب الذين بالشام فاستقام ملكها بالشام حتى غلبت عليها غسان {cite:muruj-al-dhahab p. 425}."
  en: "The Quda'id tribe that displaced Tanukh in Syria, was Christianised and set over the Arabs by Rome, and held the kingship until Ghassan prevailed {cite:muruj-al-dhahab p. 425}."
  es: "La tribu Quda'id, que desplazó a Tanukh en Siria, fue cristianizada y puesta sobre los árabes por Roma, y mantuvo el trono hasta que prevaleció Ghassan {cite:muruj-al-dhahab p. 425}."
  fr: "La tribu Quda'id qui a déplacé Tanukh en Syrie, a été christianisée et placée sur les Arabes par Rome, et a détenu la royauté jusqu'à ce que Ghassan l'emporte {cite:muruj-al-dhahab p. 425}."
  ur: "قُدید قبیلہ جس نے تنوخ کو شام میں بے گھر کر دیا تھا، کو عیسائی بنایا گیا تھا اور روم کے ذریعے عربوں پر قائم کیا گیا تھا، اور غسان کے غالب آنے تک بادشاہی پر فائز تھا 425}۔"
  tr: "Sulayh ibn Halwan ibn İmran ibn el-Haf ibn Kuda’ah doğdu. Sulayh Levant’a geldi, Tanukh’u yendi ve Hristiyanlığı kabul etti. Romalılar onları Levant’taki Arapların kralı yaptılar ve Levant’taki egemenlikleri Ghassan onları yenene kadar sürdü. {cite:muruj-al-dhahab s. 425}"
  id: "Sulayh bin Halwan bin Imran bin al-Haf bin Quda’ah lahir. Sulayh datang ke Levant dan mengalahkan Tanukh serta memeluk agama Kristen. Bangsa Romawi menjadikan mereka raja atas bangsa Arab di Levant, dan kekuasaan mereka di Levant berlangsung hingga Ghassan mengalahkan mereka. {cite:muruj-al-dhahab hlm. 425}"
