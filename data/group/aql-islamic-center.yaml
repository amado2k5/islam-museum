summary:
  ar: "قناة مركز AQL الإسلامي في جاكرتا على يوتيوب (@aqlislamiccenter)، وهو المركز الدعوي الذي أسسه بختيار ناصر، تحمل خطب الجمعة والدروس والمحاضرات من المركز؛ بلغ عدد مشتركيها 439,000 مشترك بحسب عدّاد vidIQ كما في 14 نوفمبر 2026، وأكثر مقاطعها مشاهدة خطبة جمعة لبختيار ناصر. بُني سجل شخص لمؤسس المركز في الموجة 201، وكُتبت علاقة التأسيس هنا، في جانب المجموعة."
  en: "The YouTube channel (@aqlislamiccenter) of the AQL Islamic Center in Jakarta, the dawah centre founded by Bachtiar Nasir, carrying Friday khutbahs, lessons and lectures from the centre; it counted 439,000 subscribers by vidIQ's count as of 14 November 2026, and its most-viewed upload is a Friday khutbah by Bachtiar Nasir. Its founder's person record is built in wave 201, and the founder edge is written here, on the group side."
  ur: "جکارتا کے اے کیو ایل اسلامک سینٹر کی یوٹیوب چینل ⁦(@aqlislamiccenter)⁩ — وہ دعوتی مرکز جو بختیار ناصر نے قائم کیا — جو مرکز کے جمعہ کے خطبات، اسباق اور لیکچرز پیش کرتی ہے؛ 14 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 439,000 تھے، اور اس کی سب سے زیادہ دیکھی گئی ویڈیو بختیار ناصر کا جمعہ کا خطبہ ہے۔ مرکز کے بانی کا شخصی ریکارڈ ویو 201 میں بنایا گیا، اور بانی کا رشتہ یہاں، گروپ کی جانب سے لکھا گیا ہے۔"
  es: "El canal de YouTube (@aqlislamiccenter) del Centro Islámico AQL en Yakarta, el centro de dawah fundado por Bachtiar Nasir, transmite sermones de los viernes, lecciones y conferencias del centro; según el recuento de vidIQ al 14 de noviembre de 2026, contaba con 439.000 suscriptores, y su video más visto es un sermón de los viernes de Bachtiar Nasir. El registro personal de su fundador se creó en la ola 201, y la ventaja del fundador está escrita aquí, en el lado del grupo."
  fr: "La chaîne YouTube (@aqlislamiccenter) du Centre islamique AQL de Jakarta, centre de prédication fondé par Bachtiar Nasir, diffuse les sermons du vendredi, des leçons et des conférences du centre. Au 14 novembre 2026, elle comptait 439 000 abonnés selon le décompte de vidIQ, et sa vidéo la plus visionnée est un sermon du vendredi de Bachtiar Nasir. La fiche personnelle du fondateur date de la vague 201, et son nom est inscrit ici, du côté du groupe."
  tr: "Jakarta'daki AQL İslam Merkezi'nin (@aqlislamiccenter) YouTube kanalında, Bakhtiar Nasir tarafından kurulan davet merkezinin cuma hutbeleri, dersleri ve konferansları yer alıyor. vidIQ'nun 14 Kasım 2026 tarihli abone sayısına göre, kanalın 439.000 abonesi bulunuyor ve en çok izlenen videosu Bakhtiar Nasir'in cuma hutbesi. Merkezin kurucusu için 201. dalgada kişisel bir kayıt oluşturuldu ve kurucu ilişki burada, grubun tarafında belirtiliyor."
  id: "Saluran YouTube AQL Islamic Center di Jakarta (@aqlislamiccenter), pusat dakwah yang didirikan oleh Bakhtiar Nasir, menampilkan khutbah Jumat, pelajaran, dan ceramah dari pusat tersebut. Menurut jumlah pelanggan vidIQ per 14 November 2026, saluran tersebut memiliki 439.000 pelanggan, dan video yang paling banyak ditonton adalah khutbah Jumat oleh Bakhtiar Nasir. Sebuah catatan pribadi untuk pendiri pusat tersebut dibuat di Wave 201, dan hubungan pendirian tersebut dicatat di sini, dari sisi kelompok."
