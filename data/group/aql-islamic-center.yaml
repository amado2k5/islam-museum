summary:
  ar: "قناة مركز AQL الإسلامي في جاكرتا على يوتيوب (@aqlislamiccenter)، وهو المركز الدعوي الذي أسسه بختيار ناصر، تحمل خطب الجمعة والدروس والمحاضرات من المركز؛ بلغ عدد مشتركيها 439,000 مشترك بحسب عدّاد vidIQ كما في 14 نوفمبر 2026، وأكثر مقاطعها مشاهدة خطبة جمعة لبختيار ناصر. بُني سجل شخص لمؤسس المركز في الموجة 201، وكُتبت علاقة التأسيس هنا، في جانب المجموعة."
  en: "The YouTube channel (@aqlislamiccenter) of the AQL Islamic Center in Jakarta, the dawah centre founded by Bachtiar Nasir, carrying Friday khutbahs, lessons and lectures from the centre; it counted 439,000 subscribers by vidIQ's count as of 14 November 2026, and its most-viewed upload is a Friday khutbah by Bachtiar Nasir. Its founder's person record is built in wave 201, and the founder edge is written here, on the group side."
  ur: "جکارتا کے اے کیو ایل اسلامک سینٹر کی یوٹیوب چینل ⁦(@aqlislamiccenter)⁩ — وہ دعوتی مرکز جو بختیار ناصر نے قائم کیا — جو مرکز کے جمعہ کے خطبات، اسباق اور لیکچرز پیش کرتی ہے؛ 14 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 439,000 تھے، اور اس کی سب سے زیادہ دیکھی گئی ویڈیو بختیار ناصر کا جمعہ کا خطبہ ہے۔ مرکز کے بانی کا شخصی ریکارڈ ویو 201 میں بنایا گیا، اور بانی کا رشتہ یہاں، گروپ کی جانب سے لکھا گیا ہے۔"
