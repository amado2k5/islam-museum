label: { ar: "الجراجمة", en: "The Jarajima" }
summary:
  ar: "الجراجمة جماعة من مدينة الجرجومة على جبل اللكام بين بياس وبوقا، كانوا في العهد الروماني تبعاً لبطريق أنطاكية؛ صالحهم المسلمون على أن يكونوا أعواناً وعيوناً ومسالح بلا جزية يُنفّلون أسلاب من يقتلون، ودخل في صلحهم التجار والأجراء والأنباط فسُمّوا الرواديف؛ ولما استوثق بهم عبد الملك بن مروان بعد فتنة ابن الزبير فتح لهم الوليد سنة 88 مدينتهم على أن ينزلوا حيث أحبوا من الشام بثمانية دنانير للمرء وقوت العيال من قمح وزيت ولا يُكره أحد منهم على ترك النصرانية ويلبسوا لباس المسلمين ولا جزية عليهم ولا على أولادهم ونسائهم ويغزوا مع المسلمين مُتفَّلين أسلاب من يقتلونه مبارزة وتؤخذ من تجاراتهم ما يؤخذ من المسلمين، فأخرب مدينتهم وأسكنهم جبل الموار وسنح اللولون وعمق تيزين وصار بعضهم إلى حمص؛ وكان بعض العمال ألزمهم بأنطاكية جزية الرؤوس فرفعوه إلى الواثق فأسقطها عنهم ثم أمر المتوكل بأخذها منهم مع إجراء الأرزاق عليهم لكونهم ممن يستعان به في المسالح."
  en: "The Jarajima, a community of the city al-Jurjuma on Jabal al-Lukkam between Bayyas and Buqa, clients of Antioch's patrician under Byzantium; the Muslims compounded with them to be auxiliaries, scouts and watchmen without jizya, granted the spoils of those they slew, the treaty taking in traders, hirelings and Nabataeans called the Rawadif; after Abd al-Malik secured them following Ibn al-Zubayr's fitna, al-Walid in year 88 took their city on terms that they settle where they wished in Syria at eight dinars a man plus provisions of wheat and oil for their households, none compelled to leave Christianity, wearing Muslim dress, no jizya on them or their children or wives, fighting beside the Muslims with the spoils of those they killed in single combat, and taxed on trade as the Muslims are — he then razed their city and settled them at Jabal al-Mawar, Sanh al-Lulun and the Tizin vale, some going to Hims; certain officials had imposed head-jizya on them at Antioch which they appealed to al-Wathiq, who remitted it, then al-Mutawakkil ordered it taken of them with stipends paid, since they were among those employed at the watchposts."
