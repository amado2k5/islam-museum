label: { ar: "الجراجمة", en: "The Jarajima", es: "El Jarajima", fr: "Le Jarajima", ur: "جراجیما", tr: "Sapanlar", id: "Para pelempar" }
summary:
  ar: "الجراجمة جماعة من مدينة الجرجومة على جبل اللكام بين بياس وبوقا، كانوا في العهد الروماني تبعاً لبطريق أنطاكية؛ صالحهم المسلمون على أن يكونوا أعواناً وعيوناً ومسالح بلا جزية يُنفّلون أسلاب من يقتلون، ودخل في صلحهم التجار والأجراء والأنباط فسُمّوا الرواديف؛ ولما استوثق بهم عبد الملك بن مروان بعد فتنة ابن الزبير فتح لهم الوليد سنة 88 مدينتهم على أن ينزلوا حيث أحبوا من الشام بثمانية دنانير للمرء وقوت العيال من قمح وزيت ولا يُكره أحد منهم على ترك النصرانية ويلبسوا لباس المسلمين ولا جزية عليهم ولا على أولادهم ونسائهم ويغزوا مع المسلمين مُتفَّلين أسلاب من يقتلونه مبارزة وتؤخذ من تجاراتهم ما يؤخذ من المسلمين، فأخرب مدينتهم وأسكنهم جبل الموار وسنح اللولون وعمق تيزين وصار بعضهم إلى حمص؛ وكان بعض العمال ألزمهم بأنطاكية جزية الرؤوس فرفعوه إلى الواثق فأسقطها عنهم ثم أمر المتوكل بأخذها منهم مع إجراء الأرزاق عليهم لكونهم ممن يستعان به في المسالح."
  en: "The Jarajima, a community of the city al-Jurjuma on Jabal al-Lukkam between Bayyas and Buqa, clients of Antioch's patrician under Byzantium; the Muslims compounded with them to be auxiliaries, scouts and watchmen without jizya, granted the spoils of those they slew, the treaty taking in traders, hirelings and Nabataeans called the Rawadif; after Abd al-Malik secured them following Ibn al-Zubayr's fitna, al-Walid in year 88 took their city on terms that they settle where they wished in Syria at eight dinars a man plus provisions of wheat and oil for their households, none compelled to leave Christianity, wearing Muslim dress, no jizya on them or their children or wives, fighting beside the Muslims with the spoils of those they killed in single combat, and taxed on trade as the Muslims are — he then razed their city and settled them at Jabal al-Mawar, Sanh al-Lulun and the Tizin vale, some going to Hims; certain officials had imposed head-jizya on them at Antioch which they appealed to al-Wathiq, who remitted it, then al-Mutawakkil ordered it taken of them with stipends paid, since they were among those employed at the watchposts."
  es: "Los Jarajima, una comunidad de la ciudad de al-Jurjuma en Jabal al-Lukkam entre Bayyas y Buqa, clientes del patricio de Antioquía bajo Bizancio; los musulmanes se aliaron con ellos para ser auxiliares, exploradores y vigilantes sin jizya, recibiendo el botín de aquellos a quienes mataban, el tratado incluía comerciantes, mercenarios y nabateos llamados Rawadif; Después de que Abd al-Malik los asegurara tras la fitna de Ibn al-Zubayr, al-Walid tomó su ciudad en el año 88 con la condición de que se establecieran donde quisieran en Siria a cambio de ocho dinares por hombre más provisiones de trigo y aceite para sus familias, sin que nadie fuera obligado a abandonar el cristianismo, vistiendo ropa musulmana, sin jizya para ellos ni sus hijos o esposas, luchando junto a los musulmanes con el botín de los que mataran en combate singular, y pagando impuestos sobre el comercio como los musulmanes. Luego arrasó su ciudad y los asentó en Jabal al-Mawar, Sanh al-Lulun y el valle de Tizin, algunos se fueron a Hims; ciertos funcionarios les habían impuesto jizya en Antioquía, la cual apelaron a al-Wathiq, quien la condonó, luego al-Mutawakkil ordenó que se les cobrara con estipendios pagados, ya que estaban entre los empleados en los puestos de vigilancia."
  fr: "Les Jarajima, une communauté de la ville d'al-Jurjuma sur Jabal al-Lukkam entre Bayyas et Buqa, clients du patricien d'Antioche sous Byzance; les musulmans s'allièrent avec eux pour être auxiliaires, éclaireurs et gardiens sans jizya, bénéficiant du butin de ceux qu'ils tuaient, le traité incluant des commerçants, des mercenaires et des Nabatéens appelés les Rawadif; Après qu'Abd al-Malik les eut sécurisés suite à la fitna d'Ibn al-Zubayr, al-Walid prit leur ville en l'an 88, à condition qu'ils s'installent où ils le souhaitaient en Syrie, moyennant huit dinars par homme, plus des provisions de blé et d'huile pour leurs foyers. Nul ne serait contraint d'abandonner le christianisme, ils pourraient porter des vêtements musulmans, ni être soumis à la jizya, ni à celle de leurs enfants ou de leurs femmes. Ils pourraient combattre aux côtés des musulmans avec le butin de leurs victimes en combat singulier et seraient imposés sur le commerce comme les musulmans. Il rasa ensuite leur ville et les installa à Jabal al-Mawar, Sanh al-Lulun et dans la vallée de Tizin, certains se rendant à Hims. Certains fonctionnaires leur avaient imposé une jizya à Antioche, ce à quoi ils firent appel auprès d'al-Wathiq, qui la leur remit. Al-Mutawakkil ordonna alors que la jizya leur soit prélevée, avec versement d'indemnités, car ils faisaient partie de ceux qui étaient employés aux postes de garde."
  ur: "جراجیما، البیاس اور بوکا کے درمیان جبل ال لکم پر شہر الجرجمہ کی ایک کمیونٹی، بازنطیم کے ماتحت انطاکیہ کے سرپرست کے مؤکل؛ مسلمانوں نے بغیر جزیہ کے معاونین، سکاؤٹس اور چوکیداروں کے طور پر ان کے ساتھ ملایا، ان کے قتل ہونے والوں کا مال غنیمت عطا کیا، تاجروں، مزدوروں اور نباتیوں سے معاہدہ کیا جسے روادیف کہا جاتا ہے۔ عبد الملک نے ابن الزبیر کے فتنے کی پیروی کرتے ہوئے انہیں محفوظ کر لیا، 88 میں الولید نے ان کے شہر کو اس شرط پر لے لیا کہ وہ شام میں جہاں چاہیں آٹھ دینار میں ایک آدمی کے علاوہ اپنے گھر والوں کے لیے گندم اور تیل کا بندوبست کریں، کسی کو عیسائیت چھوڑنے پر مجبور نہ کیا جائے، مسلمان کا لباس پہنا جائے، نہ ان کے بچوں کے ساتھ لڑیں اور نہ ہی مسلمانوں کے ساتھ لڑیں۔ ان لوگوں کا مال غنیمت جو انہوں نے ایک ہی لڑائی میں مارے، اور تجارت پر ٹیکس عائد کیا جیسا کہ مسلمانوں پر ہے - پھر اس نے ان کے شہر کو مسمار کر دیا اور جبل الماور، سنہ اللولون اور وادی تزین میں بسایا، کچھ اس کی طرف جا رہے تھے۔ انطاکیہ میں بعض اہلکاروں نے ان پر سر جزیہ عائد کیا تھا جسے انہوں نے الوثیق سے درخواست کی، جس نے اسے معاف کر دیا، پھر متوکل نے حکم دیا کہ وہ ان سے ادا شدہ وظیفہ لے لیں، کیونکہ وہ چوکیوں پر ملازم تھے۔"
  tr: "Cerajime, Bayas ve Buka arasında, El-Lakam Dağı üzerindeki Cerjume şehrinden bir gruptur. Roma döneminde Antakya Patriği'nin otoritesi altındaydılar. Müslümanlar, onlara haraç ödemeden yardımcı, casus ve muhafız olmaları ve öldürdüklerinin ganimetlerini almaları şartıyla barış yaptılar. Tüccarlar, işçiler ve Nabateanlar da bu barışa katıldılar ve onlara Ravadif adı verildi. İbnü'zübeyr'in fitnesinden sonra Abdülmalik ibn Mervan onlarla güven ilişkisi kurunca, el-Valid 88 yılında, Levant'ta istedikleri yere kişi başı sekiz dinar karşılığında yerleşmeleri ve ailelerinin geçimini buğday ve zeytinyağı ile sağlamaları, hiçbirinin Hristiyanlığı terk etmeye zorlanmaması, Müslümanların kıyafetlerini giymeleri, kendilerinden, çocuklarından ve kadınlarından vergi alınmaması, Müslümanlarla birlikte baskınlara katılmaları, teke tek dövüşte öldürdüklerinin ganimetlerini almaları ve ticaretlerinden elde edilenlerin Müslümanlardan alınması şartıyla şehirlerini onlara açtı. Bunun üzerine şehirlerini yıktı ve onları Mever Dağı, Sanh el-Lulun ve Amq Tizin'e yerleştirdi; bazıları da Homs'a gitti. Antakya'daki işçilerden bazıları kafa vergisi ödemekle yükümlüydü, bu yüzden bunu El-Vathiq'e bildirdiler ve o da vergiyi onlardan kaldırdı. Bunun üzerine El-Mutavakkil, güvenlik güçlerinde görev yapanlar arasında oldukları için, onlardan yiyecek temin edilerek paralarının alınmasını emretti."
  id: "Suku Jarajimah adalah kelompok dari kota Jarjumah di Gunung Al-Lakam antara Bayas dan Buqa. Pada zaman Romawi, mereka berada di bawah kekuasaan Patriark Antiokhia. Kaum Muslim berdamai dengan mereka dengan syarat mereka menjadi penolong, mata-mata, dan penjaga tanpa membayar upeti, dan mereka mengambil rampasan dari orang-orang yang mereka bunuh. Para pedagang, buruh, dan orang Nabatea bergabung dalam perdamaian dengan mereka, dan mereka disebut Rawadif. Ketika Abd al-Malik ibn Marwan merasa aman bersama mereka setelah fitnah Ibn al-Zubayr, al-Walid membuka kota mereka untuk mereka pada tahun 88 dengan syarat mereka menetap di mana pun mereka suka di Levant dengan biaya delapan dinar per orang dan nafkah keluarga berupa gandum dan minyak, dan bahwa tidak seorang pun dari mereka dipaksa untuk meninggalkan agama Kristen, dan bahwa mereka mengenakan pakaian Muslim, dan bahwa tidak ada upeti yang dibebankan kepada mereka atau kepada anak-anak dan perempuan mereka, dan bahwa mereka menyerang bersama kaum Muslim, mengambil rampasan dari mereka yang mereka bunuh dalam duel satu lawan satu, dan bahwa apa yang diambil dari perdagangan mereka diambil dari kaum Muslim. Maka ia menghancurkan kota mereka dan menempatkan mereka di Gunung Al-Mawar, Sanh al-Lulun, dan Amq Tizin, dan sebagian dari mereka pergi ke Homs. Beberapa pekerja di Antiokhia wajib membayar pajak kepala, jadi mereka membicarakannya dengan Al-Wathiq, yang kemudian menghapuskannya dari mereka. Kemudian Al-Mutawakkil memerintahkan agar barang itu diambil dari mereka sambil memberikan mereka bekal karena mereka termasuk orang-orang yang digunakan dalam pasukan keamanan."
