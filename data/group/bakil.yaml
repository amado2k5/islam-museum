summary:
  ar: "أحد ساقي همدان الكبرى وشقيق هاشد، وهو بكيل بن جشم بن هبران بن نوف بن همدان؛ ديارها — عند الهمداني — من نصف رحبة صنعاء إلى نجران والجوف وشاكر وصرواح، ومنها سفيان بن أرحب الذي انحدرت منه الحدنية في خيوان، ولا سوق لها إلا ورور وغُرق وريدة في بلد هاشد {cite:sifat-jazirat-al-arab pp. 93-95}."
  en: "The other shaft of Hamdan, brother of Hashid — Bakil ibn Jusham of the Hamdan line. Its homelands in al-Hamdani's mapping stretch from half of Sana'a's Rahba plain to Najran, al-Jawf, Shakir and Sirwah, counting Sufyan ibn Arhab (whence the Hudayniyya of Khaywan) among its houses; it held no market of its own but shared Warur, Ghuraq and Rayda in Hashid country {cite:sifat-jazirat-al-arab pp. 93-95}."
