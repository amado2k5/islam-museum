summary:
  ar: "أحد ساقي همدان الكبرى وشقيق هاشد، وهو بكيل بن جشم بن هبران بن نوف بن همدان؛ ديارها — عند الهمداني — من نصف رحبة صنعاء إلى نجران والجوف وشاكر وصرواح، ومنها سفيان بن أرحب الذي انحدرت منه الحدنية في خيوان، ولا سوق لها إلا ورور وغُرق وريدة في بلد هاشد {cite:sifat-jazirat-al-arab pp. 93-95}."
  en: "The other shaft of Hamdan, brother of Hashid — Bakil ibn Jusham of the Hamdan line. Its homelands in al-Hamdani's mapping stretch from half of Sana'a's Rahba plain to Najran, al-Jawf, Shakir and Sirwah, counting Sufyan ibn Arhab (whence the Hudayniyya of Khaywan) among its houses; it held no market of its own but shared Warur, Ghuraq and Rayda in Hashid country {cite:sifat-jazirat-al-arab pp. 93-95}."
  es: "El otro vástago de Hamdan, hermano de Hashid, fue Bakil ibn Jusham de la línea de Hamdan. Sus tierras de origen en el mapa de al-Hamdani se extienden desde la mitad de la llanura de Rahba en Sana'a hasta Najran, al-Jawf, Shakir y Sirwah, contando a Sufyan ibn Arhab (de donde proviene la Hudayniyya de Khaywan) entre sus casas; no tenía mercado propio, pero compartía Warur, Ghuraq y Rayda en el país de Hashid {cite:sifat-jazirat-al-arab pp. 93-95}."
  fr: "L'autre branche de Hamdan, frère de Hashid — Bakil ibn Jusham de la lignée de Hamdan. Ses terres, selon la cartographie d'al-Hamdani, s'étendent de la moitié de la plaine de Rahba à Sanaa jusqu'à Najran, al-Jawf, Shakir et Sirwah, comptant parmi ses familles Sufyan ibn Arhab (d'où proviennent les Hudayniyya de Khaywan); elle ne possédait pas de marché propre mais partageait Warur, Ghuraq et Rayda dans le pays de Hashid {cite:sifat-jazirat-al-arab pp. 93-95}."
  ur: "حمدان کا دوسرا شافٹ، حشد کا بھائی - ہمدان لائن کا بکل ابن جشم۔ الحمدانی کی نقشہ سازی میں اس کا آبائی علاقہ صنعاء کے رہبہ کے میدان کے نصف سے لے کر نجران، الجوف، شاکر اور صروح تک پھیلا ہوا ہے، سفیان بن ارحب ⁦(جہاں خیوان کی حدینیہ)⁩ کو اپنے گھروں میں شمار کرتا ہے۔ اس کا اپنا کوئی بازار نہیں تھا لیکن حشد ملک میں ورور، غورق اور ردا کا اشتراک کیا گیا تھا۔"
  tr: "Büyük Hamdan'ın iki ayağından biri ve Haşid'in kardeşi olan Bakil bin Ceşm bin Habran bin Nevf bin Hamdan'dır; el-Hamdani'ye göre toprakları Rahba Sana'a'nın ortasından Necran, el-Cevf, Şakir ve Sarve'ye kadar uzanır ve oradan Sufyan bin Arhab gelir; ondan Hayvan'da Hadaniyye soyundan gelenler vardır ve Haşid topraklarında Warwar, Ghurq ve Rida dışında bir pazarı yoktur. {Kaynak: Sifat-Ceziret-el-Arab, s. 93-95}"
  id: "Salah satu dari dua kaki Hamdan Agung dan saudara Hashid, dia adalah Bakil bin Jashm bin Habran bin Nawf bin Hamdan; tanah miliknya - menurut al-Hamdani - membentang dari tengah Rahba Sana'a hingga Najran, al-Jawf, Shakir dan Sarwah, dan dari sana terdapat Sufyan bin Arhab, dari siapa Hadaniyyah berasal di Khaywan, dan tidak ada pasar kecuali Warwar, Ghurq dan Rida di tanah Hashid {cite:sifat-jazirat-al-arab pp. 93-95}."
