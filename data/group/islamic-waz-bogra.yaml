summary:
  ar: "قناة يوتيوب تجميعية إقليمية مقرها بوغرا في بنغلاديش، تنشر محافل الوعظ البنغالية لخطباء كثيرين؛ بلغ عدد مشتركيها (@islamicwazbograofficial) نحو 4.74 ملايين بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح."
  en: "A Bogra-based regional YouTube aggregator channel in Bangladesh publishing Bengali waz mahfils by many speakers; its channel (@islamicwazbograofficial) counted about 4.74 million subscribers by vidIQ's count read on 8 November 2026, and no named head or operator for it was identified in this pass."
  ur: "اسلامک واز بوگرا بنگلہ دیش کے شہر بوگرا سے چلنے والا ایک علاقائی مجموعی یوٹیوب چینل ہے جو بہت سے خطباء کی بنگالی وعظ محافل شائع کرتا ہے؛ اس کے سبسکرائبرز کی تعداد 8 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 4.74 ملین تھی، اور اس جائزے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہوا۔"
  es: "Un canal agregador regional de YouTube con sede en Bogra, Bangladesh, que publica waz mahfils en bengalí de muchos hablantes; su canal (@islamicwazbograofficial) contaba con aproximadamente 4,74 millones de suscriptores según el recuento de vidIQ realizado el 8 de noviembre de 2026, y en este informe no se identificó a ningún responsable u operador con nombre."
  fr: "Une chaîne YouTube régionale basée à Bogra, au Bangladesh, publiant des waz mahfils bengalis animés par de nombreux orateurs; sa chaîne (@islamicwazbograofficial) comptait environ 4,74 millions d'abonnés selon le décompte de vidIQ le 8 novembre 2026, et aucun responsable ou opérateur n'a été identifié à ce jour."
  tr: "Bangladeş'in Bogra kentinde bulunan ve birçok vaizin Bengalce vaazlarını yayınlayan bölgesel bir derleme YouTube kanalı; 8 Kasım 2026'da vidIQ sayacından okunan verilere göre abone sayısı (@islamicwazbograofficial) yaklaşık 4,74 milyondu ve bu araştırmada herhangi bir operatör veya isimli yönetici tespit edilmedi."
  id: "Sebuah saluran YouTube kompilasi regional yang berbasis di Bogra, Bangladesh, yang menerbitkan sesi dakwah berbahasa Bengali oleh banyak pendakwah; jumlah pelanggannya (@islamicwazbograofficial) mencapai sekitar 4,74 juta menurut penghitung vidIQ yang dibaca pada 8 November 2026, dan tidak ada operator atau administrator yang disebutkan namanya dalam survei ini."
