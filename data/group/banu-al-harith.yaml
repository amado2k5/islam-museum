label: { en: Banu al-Harith ibn Fihr, ar: "بنو الحارث بن فهر", es: "Banu al-Harith ibn Fihr", fr: "Banu al-Harith ibn Fihr", ur: "بنو الحارث ابن فہر", tr: "Banu al-Harith ibn Fihr", id: "Banu al-Harith ibn Fihr" }
summary:
  ar: "من بطون قريش؛ يقدّمه ابن إسحاق في قوائم مهاجرة الحبشة بنسبه «الحارث بن فهر بن مالك»، ويعدّ منه مهاجرين ونساءً وأبناءً ولدوا هناك."
  en: A clan of Quraysh; Ibn Ishaq lists it in the Abyssinia rolls as 'al-Harith ibn Fihr ibn Malik', counting emigrants, women and children born there.
  es: "Un clan de los Quraysh; Ibn Ishaq lo menciona en los registros de Abisinia como 'al-Harith ibn Fihr ibn Malik', donde se contabilizan los emigrantes, las mujeres y los niños nacidos allí."
  fr: "Un clan de Quraysh; Ibn Ishaq le mentionne dans les registres d'Abyssinie sous le nom d'« al-Harith ibn Fihr ibn Malik », comptant les émigrants, les femmes et les enfants qui y sont nés."
  ur: "قریش کا ایک قبیلہ؛ ابن اسحاق نے حبشہ کی فہرست میں اسے حارث بن فہر بن مالک کے نام سے درج کیا ہے، یہاں پر پیدا ہونے والے مہاجرین، عورتوں اور بچوں کو شمار کیا ہے۔"
  tr: "Kureyş kabilelerinden olan İbn İshak, Habeşistan'a hicret edenlerin listelerinde onu \"El-Harith bin Fahr bin Malik\" soyuyla birlikte sunar ve ondan oraya doğan hicret edenleri, kadınları ve çocukları sayar."
  id: "Dari klan Quraysh; Ibnu Ishaq memasukkannya dalam daftar para emigran ke Abyssinia dengan garis keturunannya \"Al-Harith bin Fahr bin Malik\", dan menghitung dari keturunannya para emigran, wanita, dan anak-anak yang lahir di sana."
