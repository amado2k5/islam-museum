summary:
  ar: "بطن من قريش من ولد الحارث بن فهر بن مالك، صنو قصي في العمود؛ منهم سهيل بن عمرو صاحب صلح الحديبية وأبو سفيان بن الحارث بن عبد المطلب بالولاء {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "A batn of Quraysh descended from al-Harith ibn Fihr ibn Malik, uncle-peer of Qusayy; from them Suhayl ibn Amr of the Hudaybiyya treaty {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "قریش کا بطن، حارث بن فہر بن مالک کی اولاد — حدیبیہ کے سہیل بن عمرو اسی خاندان سے۔"
  es: "Un batn de Quraysh descendía de al-Harith ibn Fihr ibn Malik, tío-par de Qusayy; de ellos Suhayl ibn Amr del tratado de Hudaybiyya {citar:ibn-hisham-sira} {citar:mubarakpuri-raheeq}."
  fr: "Un batn de Quraysh descendait d'al-Harith ibn Fihr ibn Malik, oncle-pair de Qusayy; d'eux Suhayl ibn Amr du traité Hudaybiyya {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  tr: "Kureyş kabilesinin, soy ağacında Kusay'ın kardeşi olan El-Harith bin Fihr bin Malik'in soyundan gelen bir kolu; aralarında Hudeybiye Antlaşması'nı yapan Suhayl bin Amr ve biat yoluyla Abu Sufyan bin El-Harith bin Abdülmuttalib de bulunmaktadır."
  id: "Sebuah klan Quraisy dari keturunan Al-Harith bin Fihr bin Malik, saudara Qusay dalam garis keturunan; di antara mereka adalah Suhayl bin Amr, orang yang membuat Perjanjian Hudaybiyyah, dan Abu Sufyan bin Al-Harith bin Abd Al-Muttalib sebagai baiatnya."
