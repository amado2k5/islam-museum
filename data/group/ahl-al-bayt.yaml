    id: sunni
    summary: { en: "Sunni tradition includes in Ahl al-Bayt the Prophet's wives together with Ali, Fatima, Hasan and Husayn and their kin — honored by the verse of purification and the hadith of the cloak, without conferring religious authority on descent alone." }
    sources: [source/ibn-sad-tabaqat-bewley]
  - tradition: academic
    id: academic
    summary: { en: "Historians treat 'the house' as a sacred category that expanded with the community's later debates about leadership, its boundaries drawn differently at different moments." }
