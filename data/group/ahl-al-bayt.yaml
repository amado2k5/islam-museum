  - tradition: shia-twelver
    id: shia-twelver
    summary: { en: "Twelver Shia tradition defines Ahl al-Bayt as the people of the cloak — Muhammad, Ali, Fatima, Hasan and Husayn — and the line of Imams descended through them, bearers of the Prophet's religious authority." }
    sources: [source/momen-1985]
