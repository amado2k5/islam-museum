summary:
  en: "'The People of the House' — the Prophet's household: the family around whom the deepest loyalties and the deepest split in Islamic history would form."
  ar: "«أهل البيت» — بيت النبي: العائلة التي تشكّل حولها أعمق الولاءات وأعمق انقسام في تاريخ الإسلام. وفي صحيح مسلم نصّان مؤسسان في حدهم: حديث الثقلين «وأهل بيتي، أذكركم الله في أهل بيتي» عند غدير خم {cite:sahih-muslim 2408}، وحديث الكساء حيث أدخل النبي علياً وفاطمة والحسنين تحت المرط وتلا آية التطهير {cite:sahih-muslim 2424}."
