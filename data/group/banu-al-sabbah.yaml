label: { ar: "بنو الصباح", en: "Banu al-Sabbah", es: "Banu al-Sabbah", fr: "Banu al-Sabbah", ur: "بنو الصباح", tr: "Banu Sabah", id: "Banu Sabah" }
summary:
  ar: "محمد وإبراهيم والحسن بنو الصباح والجميع من حذاق المنجمين بعلوم الهيئة والأحكام، ولهم كتاب برهان صنعة الأسطرلاب ألفه محمد ولم يتمه فتممه إبراهيم وكتاب عمل نصف النهار بقياسة واحدة بالهندسة عمله محمد وتممه الحسن وكتاب رسالة محمد في صنعة الرخامات {cite:fihrist-ibn-al-nadim p. 385}."
  en: "The Banu al-Sabbah — astrolabe-makers whose brothers finished each other's treatises {cite:fihrist-ibn-al-nadim}"
  es: "Los Banu al-Sabbah — fabricantes de astrolabios cuyos hermanos completaron los tratados de los demás {cite:fihrist-ibn-al-nadim}"
  fr: "Les Banu al-Sabbah — fabricants d'astrolabes dont les frères achevaient les traités l'un de l'autre {cite:fihrist-ibn-al-nadim}"
  ur: "بنو الصباح - نجومی بنانے والے جن کے بھائیوں نے ایک دوسرے کی کتابیں ختم کیں"
  tr: "El-Sabah'ın oğulları Muhammed, İbrahim ve Hasan, hepsi de astronomi ve astroloji bilimlerinde yetenekli astrologlardı. Muhammed'in yazdığı ancak tamamlamadığı, İbrahim'in tamamladığı usturlapın yapımına dair bir kitapları vardır. Ayrıca Muhammed'in yazdığı ve Hasan'ın tamamladığı, geometride bir ölçüyle günün yarısını hesaplama üzerine bir kitapları ve Muhammed'in mermerlerin yapımı üzerine bir risalesi de bulunmaktadır. {cite:fihrist-ibn-al-nadim s. 385}"
  id: "Muhammad, Ibrahim, dan Al-Hasan, putra-putra Al-Sabah, semuanya adalah ahli astrologi yang mahir dalam ilmu astronomi dan hukum. Mereka memiliki sebuah buku tentang bukti konstruksi astrolab, yang ditulis oleh Muhammad tetapi tidak diselesaikannya, sehingga Ibrahim menyelesaikannya. Mereka juga memiliki sebuah buku tentang menghitung setengah hari dengan satu pengukuran dalam geometri, yang ditulis oleh Muhammad dan diselesaikan oleh Al-Hasan, dan sebuah buku tentang risalah Muhammad tentang konstruksi marmer. {cite:fihrist-ibn-al-nadim p. 385}."
