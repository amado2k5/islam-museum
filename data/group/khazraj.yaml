summary:
  ar: "ثاني شطري الأنصار، الخزرج بن حارثة بن ثعلبة بن عمرو بن عامر الأزدية؛ أكثر أنصار يثرب عدداً ومنهم سعد بن عبادة سيد الخزرج وعبد الله بن أبي بن سلول وزيد بن ثابت كاتب الوحي وحسان بن ثابت شاعر الرسول والعباس بن عبادة بن نضلة {cite:mubarakpuri-raheeq p.18-19} {cite:isaba} {cite:ibn-hisham-sira}."
  en: "The second branch of the Ansar — al-Khazraj ibn Haritha ibn Tha'laba ibn Amr ibn Amir, of the Azd; the more numerous of the Yathrib helpers, and from them came Sa'd ibn Ubada the sayyid of Khazraj, Abdullah ibn Ubayy ibn Salul, Zayd ibn Thabit the scribe of the revelation, Hassaan ibn Thabit the poet, and al-Abbas ibn Ubada ibn Nadla {cite:mubarakpuri-raheeq p.18-19} {cite:isaba} {cite:ibn-hisham-sira}."
