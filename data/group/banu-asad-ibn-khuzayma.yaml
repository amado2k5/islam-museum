summary:
  ar: "قبيلة عربية غير قرشية؛ منها عبيد الله بن جحش وقيس بن عبد الله بحسب ابن إسحاق، وهي غير بني أسد بن عبد العزى من قريش."
  en: A non-Qurashi Arab tribe; Ibn Ishaq places Ubaydullah ibn Jahsh and Qays ibn Abdullah in it. It is distinct from the Qurashi Banu Asad ibn Abd al-Uzza.
  es: "Una tribu árabe no Qurashi; Ibn Ishaq coloca en él a Ubaydullah ibn Jahsh y Qays ibn Abdullah. Es distinto del Qurashi Banu Asad ibn Abd al-Uzza."
  fr: "Une tribu arabe non Qurashi; Ibn Ishaq y place Ubaydullah ibn Jahsh et Qays ibn Abdullah. Il est distinct du Qurashi Banu Asad ibn Abd al-Uzza."
  ur: "ایک غیر قریشی عرب قبیلہ؛ ابن اسحاق نے اس میں عبید اللہ ابن جحش اور قیس بن عبداللہ کو جگہ دی ہے۔ یہ قریش بنو اسد بن عبد العزی سے ممتاز ہے۔"
  tr: "İbn İshak'a göre, Kureyş kabilesinden olmayan bir Arap kabilesi; bunların arasında Ubeydullah ibn Cahş ve Kays ibn Abdullah da bulunmaktadır. Bunlar, Kureyş kabilesinden olan Beni Asad ibn Abdül-Uzza ile aynı değildir."
  id: "Suku Arab yang bukan dari suku Quraisy; di antara mereka adalah Ubayd Allah ibn Jahsh dan Qays ibn Abdullah, menurut Ibnu Ishaq. Mereka tidak sama dengan Bani Asad ibn Abd al-Uzza dari suku Quraisy."
