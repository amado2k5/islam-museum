label:
  ar: "قوم تُبَّع"
  en: "The people of Tubba'"
  ur: "قوم تبع"
summary:
  ar: "قوم تبع في القرآن أمة كذبت الرسل فأهلكناهم: ملوك حمير في اليمن قبل الإسلام الذين لقبوا بالتبابعه، وعند المفسرين أن التبع ملك حميري واسع السلطان وأن قومه هم الذين أهلكوا؛ والسيرة تذكر تبعاً في قصة إمرئ القيس وذي نواس وملوك اليمن {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  en: "The people of Tubba' in the Qur'an are a nation that denied the messengers and was destroyed: the Himyarite kings of Yemen before Islam who bore the title Tubba'. The commentators say the Tubba' was a far-ruling Himyarite king and that his people were the ones destroyed; the Sira names Tubba' in the accounts of Imru' al-Qays, Dhu Nuwas and the kings of Yemen {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  ur: "قوم تبع قرآن میں وہ امت ہے جس نے رسولوں کو جھٹلایا تو ہلاک ہوئی: اسلام سے پہلے یمن کے حمیری بادشاہ جو تبابعہ کہلاتے تھے؛ مفسرین کے نزدیک تبع ایک وسیع سلطنت والا حمیری بادشاہ تھا اور اس کی قوم ہلاک ہوئی؛ سیرت امرء القیس، ذو نواس اور بادشاہوں کے قصے میں تبع کا ذکر رکھتی ہے۔"
