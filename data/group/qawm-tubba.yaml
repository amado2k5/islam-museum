label:
  ar: "قوم تُبَّع"
  en: "The people of Tubba'"
  ur: "قوم تبع"
  es: "La gente de Tubba'"
  fr: "Les habitants de Tubba'"
  tr: "Tubba halkı"
  id: "Penduduk Tubba'"
summary:
  ar: "قوم تبع في القرآن أمة كذبت الرسل فأهلكناهم: ملوك حمير في اليمن قبل الإسلام الذين لقبوا بالتبابعه، وعند المفسرين أن التبع ملك حميري واسع السلطان وأن قومه هم الذين أهلكوا؛ والسيرة تذكر تبعاً في قصة إمرئ القيس وذي نواس وملوك اليمن {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  en: "The people of Tubba' in the Qur'an are a nation that denied the messengers and was destroyed: the Himyarite kings of Yemen before Islam who bore the title Tubba'. The commentators say the Tubba' was a far-ruling Himyarite king and that his people were the ones destroyed; the Sira names Tubba' in the accounts of Imru' al-Qays, Dhu Nuwas and the kings of Yemen {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  ur: "قوم تبع قرآن میں وہ امت ہے جس نے رسولوں کو جھٹلایا تو ہلاک ہوئی: اسلام سے پہلے یمن کے حمیری بادشاہ جو تبابعہ کہلاتے تھے؛ مفسرین کے نزدیک تبع ایک وسیع سلطنت والا حمیری بادشاہ تھا اور اس کی قوم ہلاک ہوئی؛ سیرت امرء القیس، ذو نواس اور بادشاہوں کے قصے میں تبع کا ذکر رکھتی ہے۔"
  es: "El pueblo de Tubba' en el Corán es una nación que negó a los mensajeros y fue destruida: los reyes himyaritas de Yemen antes del Islam que ostentaban el título de Tubba'. Los comentaristas dicen que Tubba' fue un rey himyarita de gran poder y que su pueblo fue el destruido; la Sira menciona a Tubba' en los relatos de Imru' al-Qays, Dhu Nuwas y los reyes de Yemen {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  fr: "Le peuple de Tubba' mentionné dans le Coran est une nation qui a renié les messagers et a été anéantie: il s'agit des rois himyarites du Yémen, antérieurs à l'islam, qui portaient le nom de Tubba'. Les commentateurs affirment que Tubba' était un roi himyarite au vaste règne et que c'est son peuple qui a péri; la Sira cite Tubba' dans les récits d'Imru' al-Qays, de Dhu Nuwas et des rois du Yémen {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  tr: "Kur'an'da geçen Tubba' kavmi, peygamberleri inkâr eden bir ümmettir; bu yüzden onları helak ettik: İslam'dan önce Yemen'deki Himyar kralları, Tubba'lar olarak anılırdı. Tefsircilere göre Tubba, büyük güce sahip bir Himyar kralıydı ve helak edilenler onun halkıydı. Biyografide Tubba'dan İmru' el-Kays, Zü'nüvas ve Yemen krallarının hikayesinde bahsedilir. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  id: "Kaum Tubba’ dalam Al-Qur’an adalah kaum yang mengingkari para rasul, lalu Kami binasakan mereka: raja-raja Himyar di Yaman sebelum Islam yang disebut Tubba’. Menurut para penafsir, Tubba’ adalah seorang raja Himyar yang memiliki kekuasaan besar, dan kaumnyalah yang dibinasakan. Biografi menyebutkan Tubba’ dalam kisah Imru’ al-Qais, Dhu Nuwas, dan raja-raja Yaman. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
