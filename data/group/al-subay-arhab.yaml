id: group/al-subay-arhab
class: group
kind: tribe
label:
  ar: أهل السبيع من أرحب
  en: The people of al-Subay' (of Arhab)
  ur: ارحب کے اہل السبیع
  es: "La gente de al-Subay' (de Arhab)"
  fr: "Les habitants d'al-Subay' (d'Arhab)"
  tr: "Arhab'dan Al-Subai halkı"
  id: "Penduduk Al-Subai' dari Arhab"
summary:
  ar: قوم من أرحب بحسب الراوي، من بني عم الدعام وممن كان يتقوى بهم، نزلوا إلى الهادي بالأمان وحلفوا له في المحرم أو صفر سنة 286هـ بعد أن هربوا إلى رؤوس الجبال.
  en: A people of Arhab by the narrator, cousins of al-Da'am and among those he relied on, who came down to al-Hadi under safe-conduct and swore to him in Muharram or Safar 286 AH after fleeing to the mountain tops.
  ur: راوی کے مطابق ارحب کی ایک قوم، دعام کے چچازاد اور اس کے سہاروں میں سے، جو پہاڑوں کی چوٹیوں پر بھاگنے کے بعد امان پا کر ہادی کے پاس اتر آئے اور محرم یا صفر 286ھ میں قسم کھائی۔
  es: "Según el narrador, un pueblo de Arhab, primos de al-Da'am y entre aquellos en quienes confiaba, que bajaron a al-Hadi bajo salvoconducto y le juraron lealtad en Muharram o Safar 286 AH después de huir a las cumbres de las montañas."
  fr: "Un peuple d'Arhab, selon le narrateur, cousins d'al-Da'am et parmi ceux sur qui il comptait, qui descendirent auprès d'al-Hadi sous sauf-conduit et lui prêtèrent serment en Muharram ou Safar 286 AH après avoir fui vers les sommets des montagnes."
  tr: "Rivayet edene göre, Arhab'dan, Al-Da'am'ın kuzenlerinin oğullarından ve onların desteğini alanlardan bir grup, dağ zirvelerine kaçtıktan sonra Hicri 286 yılının Muharrem veya Safer ayında Al-Hadi'ye gelerek ona güven yemini etmişlerdir."
  id: "Menurut perawi, sekelompok orang dari Arhab, dari keturunan sepupu Al-Da'am dan orang-orang yang dikuatkan oleh mereka, datang menemui Al-Hadi dengan jaminan keselamatan dan bersumpah kepadanya pada bulan Muharram atau Safar tahun 286 H setelah mereka mengungsi ke puncak gunung."
