label:
  ar: أهل السبيع من أرحب
  en: The people of al-Subay' (of Arhab)
  ur: ارحب کے اہل السبیع
summary:
  ar: قوم من أرحب بحسب الراوي، من بني عم الدعام وممن كان يتقوى بهم، نزلوا إلى الهادي بالأمان وحلفوا له في المحرم أو صفر سنة 286هـ بعد أن هربوا إلى رؤوس الجبال.
  en: A people of Arhab by the narrator, cousins of al-Da'am and among those he relied on, who came down to al-Hadi under safe-conduct and swore to him in Muharram or Safar 286 AH after fleeing to the mountain tops.
  ur: راوی کے مطابق ارحب کی ایک قوم، دعام کے چچازاد اور اس کے سہاروں میں سے، جو پہاڑوں کی چوٹیوں پر بھاگنے کے بعد امان پا کر ہادی کے پاس اتر آئے اور محرم یا صفر 286ھ میں قسم کھائی۔
