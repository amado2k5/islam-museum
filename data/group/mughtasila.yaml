label: { ar: "المغتسلة", en: "Mughtasila" }
summary:
  ar: "المغتسلة قوم بنواحي دوميسان والبطائح لحق بهم فتق أبو ماني لما هتف به هاتف من هيكل بيت الأصنام بطيسفون أن لا تأكل لحما ولا تشرب خمرا ولا تنكح امرأة، وكانت امرأة فتق حاملا بماني فربي ماني معهم على ملتهم وبقيت بقاياهم بتلك النواحي إلى وقت ابن النديم {cite:fihrist-ibn-al-nadim p. 457}. ورئيسهم يعرف بالحسيح وهو الذي شرع الملة ويزعم أن الكونين ذكر وأنثى وأن البقول من شرع الذكر والأكشوت من شرع الأنثى وأن الأشجار عروقه، وكان تلميذه يقال له شمعون، وكانوا يوافقون المانوية في الأصلين ويفترق مذهبهم بعد، وفيهم من يعظم النجوم إلى وقت ابن النديم، ومنهم خرج شيلي ثم بابك بن بهرام ثم مليح الخولاني {cite:fihrist-ibn-al-nadim p. 477-478}"
  en: "The baptists of the marshlands among whom Mani was raised {cite:fihrist-ibn-al-nadim}"
wings: []
sources: [source/fihrist-ibn-al-nadim]
