summary:
  ar: "المغتسلة قوم بنواحي دوميسان والبطائح لحق بهم فتق أبو ماني لما هتف به هاتف من هيكل بيت الأصنام بطيسفون أن لا تأكل لحما ولا تشرب خمرا ولا تنكح امرأة، وكانت امرأة فتق حاملا بماني فربي ماني معهم على ملتهم وبقيت بقاياهم بتلك النواحي إلى وقت ابن النديم {cite:fihrist-ibn-al-nadim p. 457}."
  en: "The baptists of the marshlands among whom Mani was raised {cite:fihrist-ibn-al-nadim}"
