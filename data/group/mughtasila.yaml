label: { ar: "المغتسلة", en: "Mughtasila", es: "Mughtasila", fr: "Mughtasila", ur: "مغطاسلہ", tr: "Hamam", id: "Rumah pemandian" }
summary:
  ar: "المغتسلة قوم بنواحي دوميسان والبطائح لحق بهم فتق أبو ماني لما هتف به هاتف من هيكل بيت الأصنام بطيسفون أن لا تأكل لحما ولا تشرب خمرا ولا تنكح امرأة، وكانت امرأة فتق حاملا بماني فربي ماني معهم على ملتهم وبقيت بقاياهم بتلك النواحي إلى وقت ابن النديم {cite:fihrist-ibn-al-nadim p. 457}. ورئيسهم يعرف بالحسيح وهو الذي شرع الملة ويزعم أن الكونين ذكر وأنثى وأن البقول من شرع الذكر والأكشوت من شرع الأنثى وأن الأشجار عروقه، وكان تلميذه يقال له شمعون، وكانوا يوافقون المانوية في الأصلين ويفترق مذهبهم بعد، وفيهم من يعظم النجوم إلى وقت ابن النديم، ومنهم خرج شيلي ثم بابك بن بهرام ثم مليح الخولاني {cite:fihrist-ibn-al-nadim p. 477-478}"
  en: "The baptists of the marshlands among whom Mani was raised {cite:fihrist-ibn-al-nadim}"
  es: "Los bautistas de las marismas entre quienes se crió Mani {cite:fihrist-ibn-al-nadim}"
  fr: "Les baptistes des marais parmi lesquels Mani a été élevé {cite:fihrist-ibn-al-nadim}"
  ur: "دلدل کے بپتسمہ دینے والے جن کے درمیان منی کی پرورش ہوئی"
  tr: "Maghtasila, Domisan ve bataklıklar civarında yaşayan bir halktı. Ktesifon'daki putlar tapınağından gelen bir ses ona et yememesini, şarap içmemesini ve kadınla evlenmemesini söylediğinde, Fatık Ebu Mani de onlara katıldı. Fatık'ın karısı Mani'ye hamileydi, bu yüzden Mani onların dinine göre aralarında büyütüldü ve kalıntıları İbn el-Nadim zamanına kadar o bölgelerde kaldı. Liderleri, dini kuran ve iki evrenin, erkek ve kadın, var olduğunu, sebzelerin erkek yasasından, porsuk ağacının ise kadın yasasından olduğunu ve ağaçların da kökleri olduğunu iddia eden el-Hasiih olarak biliniyordu. Öğrencisi Simeon'du. İki temel konuda Maniheizm ile hemfikirdiler, ancak doktrinleri daha sonra farklılaştı. Aralarında İbn el-Nadim zamanına kadar yıldızlara tapanlar da vardı. Onlardan Şili, sonra Babak ibn Behram, ardından Malih el-Hawlani geldi {cite:fihrist-ibn-al-nadim s. 477-478}"
  id: "Kaum Maghtasila adalah sekelompok orang yang tinggal di sekitar Domisan dan rawa-rawa. Mereka bergabung dengan Fatiq Abu Mani ketika sebuah suara memanggilnya dari kuil berhala di Ctesiphon, menyuruhnya untuk tidak makan daging, tidak minum anggur, dan tidak menikahi seorang wanita. Istri Fatiq sedang mengandung Mani, sehingga Mani dibesarkan di antara mereka sesuai dengan agama mereka, dan sisa-sisa mereka tetap berada di wilayah tersebut hingga zaman Ibn al-Nadim {cite:fihrist-ibn-al-nadim p. 457}. Pemimpin mereka dikenal sebagai al-Hasiih, yang mendirikan agama tersebut dan menyatakan bahwa ada dua alam semesta, laki-laki dan perempuan, bahwa tumbuh-tumbuhan berasal dari hukum laki-laki dan pohon cemara dari hukum perempuan, dan bahwa pohon adalah akarnya. Muridnya bernama Simeon. Mereka sepakat dengan Manikeisme pada dua prinsip dasar tersebut, tetapi doktrin mereka kemudian berbeda. Di antara mereka ada yang memuja bintang-bintang hingga zaman Ibn al-Nadim. Dari mereka datanglah Shili, lalu Babak ibn Bahram, lalu Malih al-Khawlani {cite:fihrist-ibn-al-nadim pp. 477-478}"
