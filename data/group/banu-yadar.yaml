label:
  ar: بنو يدر
  en: Banu Yadar
  es: "Banu Yadar"
  fr: "Banu Yadar"
  ur: "بنو یادر"
summary:
  ar: "بنو يدر أمراء السوس من فتن الموحدين بعد انقراض بني عبد المؤمن؛ من بني باداس، خرج علي بن يدر إلى السوس مجاهراً بالخلاف سنة 651هـ فنزل حصن تيونودين وشيده وحصنه وتغلب على حصن تيزخت وأطاعته قبائل كزولة ولمطة وزكن ولخس، وأجلب على عامل الموحدين بتارودنت وهزم عسكر ابن أصناك، ولما استولى بنو مرين على مراكش سنة 668هـ استبد وتملك سوس واستولى على تارودنت وإيفري وسائر أمصاره حتى قتل سنة 668هـ، فقام بأمره ابن أخيه علي بن عبد الرحمن بن الحسن ثم أخوه علي بن الحسن بن يدر إلى أن استولى عليهم سلطان بني مرين وانقرض أمرهم."
  en: "Banu Yadar, amirs of the Sus from the post-Abd al-Mu'min Almohad fitnas; of Banu Badas — Ali ibn Yadar marched into the Sus in open revolt in 651, fortifying Tiyunudin and taking Tazakht, obeyed by the Kazula, Lamta, Zakn and Lakhs tribes, starving the Almohad governor of Taroudant and routing Ibn Asnak's army; when the Marinids took Marrakesh in 668 he seized Taroudant, Ifri and all the Sus's strongholds until his killing that year — his nephews Ali ibn Abd al-Rahman and Ali ibn al-Hasan ibn Yadar holding on until the Marinid sultan extinguished them."
  es: "Banu Yadar, emires de los Sus de las fitnas almohades posteriores a Abd al-Mu'min; de Banu Badas: Ali ibn Yadar marchó a los Sus en abierta revuelta en 651, fortificando Tiyunudin y tomando Tazakht, obedecido por las tribus Kazula, Lamta, Zakn y Lakhs, matando de hambre al gobernador almohade de Taroudant y derrotando al ejército de Ibn Asnak; cuando los Mariníes tomaron Marrakech en 668, se apoderó de Taroudant, Ifri y todas las fortalezas de los Sus hasta su muerte ese mismo año; sus sobrinos Ali ibn Abd al-Rahman y Ali ibn al-Hasan ibn Yadar resistieron hasta que el sultán Mariní los exterminó."
  fr: "Les Banu Yadar, émirs du Sous depuis les fitnas almohades post-Abd al-Mu'min; des Banu Badas — Ali ibn Yadar marcha sur le Sous en révolte ouverte en 651, fortifiant Tiyunudin et prenant Tazakht, obéissant aux tribus Kazula, Lamta, Zakn et Lakhs, affamant le gouverneur almohade de Taroudant et mettant en déroute l'armée d'Ibn Asnak; lorsque les Mérinides prirent Marrakech en 668, il s'empara de Taroudant, d'Ifri et de toutes les forteresses du Sous jusqu'à sa mort la même année — ses neveux Ali ibn Abd al-Rahman et Ali ibn al-Hasan ibn Yadar résistèrent jusqu'à ce que le sultan mérinide les élimine."
  ur: "بنو یادر، بعد از عبد المومن الموحد فتنے سے سوس کے امیر؛ بنو باداس کے - علی ابن یدر نے 651 میں کھلی بغاوت کرتے ہوئے سوس کی طرف کوچ کیا، تیونودین کو مضبوط کیا اور تزخت لے لیا، کازولا، لمتا، زکن اور لکس قبائل کی اطاعت کی، ترودنت کے گورنر الموحد کو بھوکا مارا اور ابن اشنک کی فوج کو بھگا دیا۔ 668 میں جب میرینیڈز نے مراکش پر قبضہ کر لیا تو اس نے تاروڈنٹ، افری اور سوس کے تمام مضبوط قلعوں پر قبضہ کر لیا یہاں تک کہ اس سال اس کے قتل ہو گئے — اس کے بھتیجے علی بن عبدالرحمٰن اور علی ابن الحسن ابن یدار اس وقت تک ڈٹے رہے جب تک مارینیڈ سلطان نے انہیں بجھا نہیں دیا۔"
