label:
  ar: بنو يدر
  en: Banu Yadar
summary:
  ar: "بنو يدر أمراء السوس من فتن الموحدين بعد انقراض بني عبد المؤمن؛ من بني باداس، خرج علي بن يدر إلى السوس مجاهراً بالخلاف سنة 651هـ فنزل حصن تيونودين وشيده وحصنه وتغلب على حصن تيزخت وأطاعته قبائل كزولة ولمطة وزكن ولخس، وأجلب على عامل الموحدين بتارودنت وهزم عسكر ابن أصناك، ولما استولى بنو مرين على مراكش سنة 668هـ استبد وتملك سوس واستولى على تارودنت وإيفري وسائر أمصاره حتى قتل سنة 668هـ، فقام بأمره ابن أخيه علي بن عبد الرحمن بن الحسن ثم أخوه علي بن الحسن بن يدر إلى أن استولى عليهم سلطان بني مرين وانقرض أمرهم."
  en: "Banu Yadar, amirs of the Sus from the post-Abd al-Mu'min Almohad fitnas; of Banu Badas — Ali ibn Yadar marched into the Sus in open revolt in 651, fortifying Tiyunudin and taking Tazakht, obeyed by the Kazula, Lamta, Zakn and Lakhs tribes, starving the Almohad governor of Taroudant and routing Ibn Asnak's army; when the Marinids took Marrakesh in 668 he seized Taroudant, Ifri and all the Sus's strongholds until his killing that year — his nephews Ali ibn Abd al-Rahman and Ali ibn al-Hasan ibn Yadar holding on until the Marinid sultan extinguished them."
