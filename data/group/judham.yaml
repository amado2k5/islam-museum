label: { ar: "جذام", en: "Judham", es: "Judá", fr: "Judham", ur: "جودھم", tr: "cüzzam", id: "kusta" }
summary:
  ar: "قبيلة من بطون كهلان القحطانية، يقرنها الرحيق المختوم بلخم في القسم الثاني من مهاجري كهلان، وتذكرها المصادر على تخوم الشام؛ منها فروة بن عمرو الجذامي."
  en: "A Kahlani tribe of Qahtan, paired with Lakhm in al-Raheeq al-Makhtum's second group of Kahlani emigrants and placed by the sources on the Syrian marches; Farwa ibn Amr al-Judhami was of it."
  es: "Una tribu Kahlani de Qahtan, vinculada a Lakhm en el segundo grupo de emigrantes Kahlani de al-Raheeq al-Makhtum y ubicada por las fuentes en las fronteras sirias; Farwa ibn Amr al-Judhami pertenecía a ella."
  fr: "Une tribu Kahlani de Qahtan, associée à Lakhm dans le deuxième groupe d'émigrants Kahlani d'al-Raheeq al-Makhtum et placée par les sources sur les marches syriennes; Farwa ibn Amr al-Judhami en faisait partie."
  ur: "قحطان کا ایک کہلانی قبیلہ، جس کو الرحیق المختم کے کہلانی ہجرت کرنے والوں کے دوسرے گروپ میں لخم کے ساتھ جوڑا گیا اور ذرائع کے ذریعہ شامی مارچوں پر رکھا گیا۔ فروا بن عمرو الجثمی اس میں سے تھے۔"
  tr: "Al-Raheeq al-Makhtoum'un Kahlan göçmenlerinin ikinci bölümünde Lakhm ile ilişkilendirdiği ve kaynakların Levant sınırlarında bahsettiği Kahlan al-Qahtani'nin kollarından bir kabile; bunların arasında Farwa bin Amr al-Judhami de bulunmaktadır."
  id: "Sebuah suku dari cabang Kahlan al-Qahtani, yang oleh Al-Raheeq al-Makhtoum dikaitkan dengan Lakhm di bagian kedua migran Kahlan, dan yang oleh sumber-sumber disebutkan berada di perbatasan Levant; di antara mereka adalah Farwa bin Amr al-Judhami."
