summary:
  ar: "قناة معهد دار الشالحين ومنصة روميشو على يوتيوب، تحمل دروس الكاجيان اليومية للمعهد؛ بلغ عدد مشتركيها 394,000 مشترك بحسب موقع youtubers.me كما قُرئ في 15 نوفمبر 2026. مشغّلها ومعلّمها الرئيس محمد عبده تواسيكال، مؤسس المعهد وموقع روميشو، ويُبنى سجله شخصًا في هذه الموجة نفسها."
  en: "The YouTube channel of Pondok Pesantren Darush Sholihin and the Rumaysho platform, carrying the pesantren's daily kajian lessons; it counted 394,000 subscribers by youtubers.me as read on 15 November 2026. Its operator and principal teacher is Muhammad Abduh Tuasikal, founder of the pesantren and of the Rumaysho website, whose person record is built in this same wave."
  ur: "پونڈوک پسانترین دار الشالحین اور رومیشو پلیٹ فارم کی یوٹیوب چینل، جو مدرسے کے روزانہ کاجیان اسباق پیش کرتی ہے؛ youtubers.me کے 15 نومبر 2026ء کے پڑھنے کے مطابق اس کے سبسکرائبرز 394,000 تھے۔ اس کے منتظم اور مرکزی استاد محمد عبدہ تواسیکال ہیں، مدرسے اور رومیشو ویب سائٹ کے بانی، جن کا شخصی ریکارڈ اسی ویو میں بنایا جا رہا ہے۔"
  es: "El canal de YouTube de Pondok Pesantren Darush Sholihin y la plataforma Rumaysho, que transmiten las lecciones diarias de kajian del pesantren, contaban con 394.000 suscriptores según youtubers.me, según datos del 15 de noviembre de 2026. Su operador y profesor principal es Muhammad Abduh Tuasikal, fundador del pesantren y del sitio web Rumaysho, cuya trayectoria personal se ha desarrollado en esta misma ola."
