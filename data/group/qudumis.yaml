label:
  ar: "القدميون أهل قدم"
  en: "The Qudumis, the people of Qudum"
  ur: "قدمی، اہل قدم"
summary:
  ar: "أهل بلد قدم الذين اجتمعوا إلى رجلين من آل يعفر سنة 288هـ وأعانوا صعصعة بن جعفر، ثم دخلوا شبام ليلة الأحد فكسروا الحبس وقُتل ابن أبي عباد، وقاتلهم الهادي بعد ذلك."
  en: "The people of the land of Qudum who gathered to two men of Al Ya'fur in 288 AH and joined Sa'sa'a ibn Ja'far, then entered Shibam on the night of Sunday and broke the prison where Ibn Abi Abbad was killed, and whom al-Hadi afterwards fought."
  ur: "بلدِ قدم کے لوگ جو سنہ 288ھ میں آل یعفر کے دو آدمیوں کے گرد جمع ہوئے اور صعصعہ بن جعفر کے ساتھ ہوئے، پھر اتوار کی رات شبام میں داخل ہو کر قید خانہ توڑا جس میں ابن ابی عباد مارا گیا، اور جن سے ہادی نے بعد میں جنگ کی۔"
