  en: "The Berbers"
  ur: "بربر"
summary:
  ar: "البربر في كتب الفتوح والتاريخ أهل المغرب الأقصى والأوسط: ملتهم قبل الإسلام بين وثنية ونصرانية ويهودية، فتحهم موسى بن نصير وطارق بن زياد على عهد الوليد، ودخلوا في الإسلام وقادوا جيوش الأندلس والموحدين والمرابطين {cite:futuh-misr} {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  en: "The Berbers in the books of conquest and history are the people of the farthest and middle Maghrib: their faith before Islam was mixed among idol-worship, Christianity and Judaism; Musa ibn Nusayr and Tariq ibn Ziyad conquered them under al-Walid, and they entered Islam and led the armies of al-Andalus, the Almohads and the Almoravids {cite:futuh-misr} {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  ur: "بربر فتوحات اور تاریخ کی کتابوں میں دور دراز اور وسطی مغرب کے باشندے ہیں: اسلام سے پہلے ان کا دین بت پرستی، مسیحیت اور یہودیت میں بٹا ہوا تھا؛ ولید کے عہد میں موسیٰ بن نصیر اور طارق بن زیاد نے انہیں فتح کیا، وہ اسلام میں داخل ہوئے اور اندلس، موحدین اور مرابطین کے لشکروں کی قیادت کی۔"
