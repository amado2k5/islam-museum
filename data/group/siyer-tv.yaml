summary:
  ar: "قناة سيير تي في على يوتيوب ⁦(@siyertv)⁩، وهي قناة وقف السيرة في إسطنبول وتنشر محاضرات وسلاسل في السيرة والتاريخ؛ بلغ عدد مشتركيها 719,000 مشترك وعدد مشاهداتها 148,084,156 مشاهدة في 4,897 مقطعًا بحسب عدّاد vidIQ كما في 13 نوفمبر 2026. تذكر سيرة منشورة لمحمد أمين يلدرم أنه بادر في أكتوبر 2010 إلى تأسيس وقف السيرة، ويُذكر ذلك في النثر فقط ولا تُكتب علاقة تأسيس، لأن سجله الشخصي غير موجود."
  en: "The Siyer TV YouTube channel (@siyertv), the channel of the Siyer Foundation (Siyer Vakfı) in Istanbul, publishing sirah and history lectures and series; it counted 719,000 subscribers, 148,084,156 views and 4,897 videos by vidIQ's count as of 13 November 2026. A published biography of Muhammed Emin Yıldırım states that he pioneered the establishment of the Siyer Foundation in October 2010; that association is stated in prose only and no founded_by edge is written, because his person record does not exist."
  ur: "سیر ٹی وی کی یوٹیوب چینل ⁦(@siyertv)⁩، استنبول کے سیر وقف کی چینل جو سیرت اور تاریخ کے لیکچرز اور سلسلے شائع کرتی ہے؛ 13 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 719,000، ویوز 148,084,156 اور ویڈیوز 4,897 تھیں۔ محمد امین یلدرم کی شائع شدہ سوانح بتاتی ہے کہ اس نے اکتوبر 2010ء میں سیر فاؤنڈیشن کے قیام کی پیش قدمی کی؛ یہ نسبت صرف نثر میں بیان کی گئی ہے اور بانی کا کوئی رشتہ نہیں لکھا گیا، کیونکہ اس کا شخصی ریکارڈ موجود نہیں ہے۔"
  es: "El canal de YouTube Siyer TV (@siyertv), canal de la Fundación Siyer (Siyer Vakfı) en Estambul, publica conferencias y series sobre historia y religión; según el recuento de vidIQ al 13 de noviembre de 2026, contaba con 719.000 suscriptores, 148.084.156 visualizaciones y 4.897 vídeos. Una biografía publicada de Muhammed Emin Yıldırım afirma que fue el pionero en la creación de la Fundación Siyer en octubre de 2010; dicha asociación se menciona solo en prosa y no se indica quién la fundó, ya que no existe ningún registro personal suyo."
  fr: "La chaîne YouTube Siyer TV (@siyertv), chaîne de la Fondation Siyer (Siyer Vakfı) à Istanbul, publie des conférences et des séries sur la sirah et l'histoire; elle comptait 719 000 abonnés, 148 084 156 vues et 4 897 vidéos selon le décompte de vidIQ au 13 novembre 2026. Une biographie publiée de Muhammed Emin Yıldırım indique qu'il a été le pionnier de la création de la Fondation Siyer en octobre 2010; cette association est mentionnée uniquement en prose et aucune mention de son fondateur n'est faite, car sa fiche personnelle n'existe pas."
  tr: "İstanbul'daki Sira Vakfı'nın YouTube kanalı olan Siyer TV'nin kanalı (@siyertv), biyografi ve tarih üzerine konferanslar ve seriler yayınlıyor. 13 Kasım 2026 itibarıyla vidIQ sayacına göre 719.000 abonesi ve 4.897 videoda 148.084.156 izlenme sayısı bulunuyor. Mehmet Emin Yıldırım'ın yayınlanmış bir biyografisinde, Sira Vakfı'nın kuruluşuna Ekim 2010'da öncülük ettiği belirtiliyor, ancak bu sadece düz yazı olarak geçiyor ve kişisel kaydı bulunmadığı için kuruluş ilişkisine dair herhangi bir bilgi verilmiyor."
  id: "Saluran YouTube Siyer TV (@siyertv), saluran milik Yayasan Sira di Istanbul, menerbitkan ceramah dan serial tentang biografi dan sejarah. Menurut penghitung vidIQ per 13 November 2026, saluran ini memiliki 719.000 pelanggan dan 148.084.156 penayangan dalam 4.897 video. Biografi Mehmet Emin Yıldırım yang diterbitkan menyebutkan bahwa ia memprakarsai pendirian Yayasan Sira pada Oktober 2010, tetapi hal ini hanya disebutkan dalam bentuk narasi dan tidak ada hubungan pendirian yang tertulis, karena catatan pribadinya tidak ada."
