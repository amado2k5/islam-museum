label:
  ar: بنو معمر من همدان
  en: Banu Ma'mar (of Hamdan)
  ur: بنو معمر ہمدان کے
summary:
  ar: قوم من همدان كانت في قلب جيش الهادي ثم في ميمنته في حرب أثافت، وفي أرضها موضع وصله أبو القاسم ابن الهادي ليلة الفطر سنة 285هـ.
  en: A people of Hamdan who were in the centre and then on the right of al-Hadi's army in the war at Athafit, and in whose land Abu al-Qasim ibn al-Hadi spent the night of the Fitr in 285 AH.
  ur: ہمدان کی ایک قوم جو اثافت کی جنگ میں ہادی کے لشکر کے قلب اور پھر میمنہ میں تھی، اور جس کی سرزمین میں ابو القاسم بن ہادی نے 285ھ میں عید الفطر کی رات گزاری۔
