summary:
  en: "The Jewish oasis communities of Khaybar, north of Medina — farmers and smiths behind strong fortresses, including exiles of Banu Nadir — subdued in 628 and left on the land under tribute until Umar's expulsion."
  ar: "الجماعات اليهودية بواحة خيبر شمال المدينة — زرّاع وحدادون وراء حصون منيعة، منهم مهجّرو بني النضير — أُخضعت سنة 628م وبقيت في الأرض بخراج حتى إجلاء عمر."
  es: "Las comunidades judías del oasis de Khaybar, al norte de Medina —agricultores y herreros protegidos por sólidas fortalezas, entre los que se encontraban exiliados de Banu Nadir— fueron sometidas en 628 y permanecieron en esas tierras bajo tributo hasta la expulsión de Umar."
  fr: "Les communautés juives de l'oasis de Khaybar, au nord de Médine — agriculteurs et forgerons derrière de puissantes forteresses, y compris des exilés de Banu Nadir — furent soumises en 628 et laissées sur la terre sous tribut jusqu'à l'expulsion d'Umar."
  ur: "خیبر کی یہودی نخلستانی کمیونٹیز، مدینہ کے شمال میں - مضبوط قلعوں کے پیچھے کاشتکار اور اسمتھ، بشمول بنو نادر کے جلاوطن - 628 میں مغلوب ہو گئے اور عمر کے اخراج تک خراج تحسین کے تحت زمین پر چھوڑ گئے۔"
