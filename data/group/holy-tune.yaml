summary:
  ar: "شركة إنتاج وتوزيع للموسيقى الإسلامية في بنغلاديش، وهي العلامة التجارية وشركة الإنتاج التابعة لمنظمة كالاراب شيلبيغوشتي الثقافية؛ تأسست سنة 2016 ويملكها المغني محمد بدر الزمان، وقناتها على يوتيوب (@holytunebdofficial) أكبر قناة ليبل إسلامي في البلاد بنحو 10.8 ملايين مشترك بحسب عدّاد vidIQ المقروء في 5 نوفمبر 2026."
  en: "A Bangladeshi Islamic music record label and production company, the label of the cultural organisation Kalarab Shilpigosthi; established in 2016 and owned by the singer Muhammad Badruzzaman, its YouTube channel (@holytunebdofficial) is the country's largest Islamic label channel, with about 10.8 million subscribers by vidIQ's count read on 5 November 2026."
  ur: "ہولی ٹیون بنگلہ دیش کا اسلامی موسیقی کا ریکارڈ لیبل اور پروڈکشن ادارہ ہے، جو ثقافتی تنظیم کلاراب شیلپی گوشٹھی کا لیبل ہے؛ یہ 2016ء میں قائم ہوا اور اس کے یوٹیوب چینل (@holytunebdofficial) کے سبسکرائبرز کی تعداد 5 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 10.8 ملین تھی۔"
founded: { edtf: "2016", calendar: gregorian, precision: year, status: historical, note: "The label was established in 2016, according to the English Wikipedia article on Kalarab Shilpigosthi, citing the channel's own About page; it has been under contract with Kalarab since its inception. The label's YouTube channel itself is older: vidIQ records its creation on 14 January 2011.", sources: [source/wikipedia-kalarab-shilpigosthi-en, source/vidiq-holy-tune] }
