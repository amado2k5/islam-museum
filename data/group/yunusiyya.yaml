summary:
  ar: "اليونسية طائفة من الفقراء منسوبون إلى الشيخ يونس بن يوسف المخارقي ومعروفون به؛ وكان يونس في نظر أصحابه مجذوباً بلا شيخ — ويسمون من لا شيخ له بالمجذوب يريدون أنه جُذب إلى طريق الخير والصلاح — وقبره بقريته القنية من أعمال دارا مشهور يزار {cite:wafayat-ayan p. 256-257}."
  en: "The Yunusiyya — the fuqara' named for Shaykh Yunus al-Mukhariqi, whom his companions counted a majdhub drawn to the path without a shaykh; his tomb at al-Qunayya near Dara remains visited {cite:wafayat-ayan p. 256-257}."
  es: "La Yunusiyya — la fuqara' que lleva el nombre del jeque Yunus al-Mukhariqi, a quien sus compañeros consideraban un majdhub atraído por el camino sin un jeque; su tumba en al-Qunayya, cerca de Dara, sigue siendo visitada. 256-257}."
  fr: "La Yunusiyya — la fuqara' nommée d'après le cheikh Yunus al-Mukhariqi, que ses compagnons considéraient comme un majdhub attiré par la voie sans cheikh; sa tombe à al-Qunayya près de Dara reste visitée. 256-257}."
  ur: "یونسیہ - شیخ یونس المخارقی کے نام سے منسوب فقراء، جنہیں ان کے اصحاب شیخ کے بغیر راستے کی طرف متوجہ ہونے والا مجذوب سمجھتے تھے۔ دارا کے قریب القنیہ میں ان کا مقبرہ باقی ہے۔ 256-257}۔"
