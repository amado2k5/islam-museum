label: { en: Aslam, ar: "أسلم", es: "Aslam", fr: "Aslam", ur: "اسلم", tr: "İslâm", id: "Islam" }
summary:
  ar: "قبيلة؛ ذكر ابن إسحاق على لسان أبي رهم أن رهطاً منها كانوا حلفاء في بني غفار، وأن النبي عدّ أسلم مع قريش والأنصار وغفار في قوله عمن تخلف."
  en: A tribe; Ibn Ishaq has Abu Ruhm say that a party of them were allies within Banu Ghifar, and that the Prophet counted Aslam with Quraysh, the Ansar and Ghifar when he spoke of those who stayed behind.
  es: "Una tribu; Ibn Ishaq hace que Abu Ruhm diga que un grupo de ellos eran aliados dentro de Banu Ghifar, y que el Profeta incluyó a Aslam con Quraysh, los Ansar y Ghifar cuando habló de los que se quedaron atrás."
  fr: "Une tribu; Ibn Ishaq rapporte qu'Abu Ruhm a dit qu'un groupe d'entre eux étaient alliés au sein des Banu Ghifar, et que le Prophète a compté les Aslam avec les Quraysh, les Ansar et les Ghifar lorsqu'il a parlé de ceux qui sont restés."
  ur: "ایک قبیلہ؛ ابن اسحاق نے ابورحمہ سے کہا ہے کہ ان میں سے ایک جماعت بنو غفار میں حلیف تھی اور نبی نے اسلم کو قریش، انصار اور غفار کے ساتھ شمار کیا جب آپ نے پیچھے رہ جانے والوں کا ذکر کیا۔"
  tr: "İbn İshak, Ebu Rahm'dan rivayetle, onların bir grubunun Beni Gıfar'ın müttefikleri olduğunu ve Peygamber'in geride kalanlar hakkındaki açıklamasında Aslam'ı Kureyş, Ensar ve Gıfar ile birlikte saydığını belirtmiştir."
  id: "Suku; Ibnu Ishaq menyebutkan dari Abu Rahm bahwa sekelompok dari mereka adalah sekutu Bani Ghifar, dan bahwa Nabi memasukkan Aslam bersama Quraysh, Ansar dan Ghifar dalam pernyataannya tentang orang-orang yang tertinggal."
