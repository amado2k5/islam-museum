label:
  ar: "الهند"
  en: "The Hind (the people of India)"
  ur: "ہند"
  es: "Los Hind (el pueblo de la India)"
  fr: "Les Hinds (le peuple de l'Inde)"
  tr: "Hindistan"
  id: "India"
summary:
  ar: "الهند عند المصادر أهل شبه القارة الهندية: حديث «غزوة الهند» وما ورد في وصف أهلها، والفتوح على عهد الحجاج ومحمد بن القاسم فتح السند، وكتب الجغرافيا والرحلات تصف بلادهم وملوكهم وأديانهم {cite:mubarakpuri-raheeq} {cite:futuh-al-buldan} {cite:kamil-ibn-al-athir}."
  en: "The Hind in the sources are the people of the Indian subcontinent: the hadith of «the raid on India» and what is reported of them, the conquests under al-Hajjaj and Muhammad ibn al-Qasim's taking of Sind, and the geographies and travel books describing their land, kings and religions {cite:mubarakpuri-raheeq} {cite:futuh-al-buldan} {cite:kamil-ibn-al-athir}."
  ur: "ہند مصادر میں برصغیر ہندوستان کے باشندے ہیں: «غزوۂ ہند» کی حدیث اور ان کے اوصاف، حجاج کے عہد میں فتوحات اور محمد بن قاسم کی سندھ کی فتح، اور جغرافیہ و سیاحت کی کتب ان کے ملک، بادشاہوں اور مذاہب کو بیان کرتی ہیں۔"
  es: "Los Hind en las fuentes son los pueblos del subcontinente indio: el hadiz de «la incursión en la India» y lo que se informa de ellos, las conquistas bajo al-Hajjaj y la toma de Sind por Muhammad ibn al-Qasim, y las geografías y libros de viajes que describen su tierra, reyes y religiones {cite:mubarakpuri-raheeq} {cite:futuh-al-buldan} {cite:kamil-ibn-al-athir}."
  fr: "Les Hind dans les sources sont les peuples du sous-continent indien: le hadith du « raid sur l'Inde » et ce qui est rapporté à leur sujet, les conquêtes sous al-Hajjaj et la prise du Sind par Muhammad ibn al-Qasim, et les géographies et les livres de voyage décrivant leur pays, leurs rois et leurs religions {cite:mubarakpuri-raheeq} {cite:futuh-al-buldan} {cite:kamil-ibn-al-athir}."
  tr: "Hindistan, Hint alt kıtası halklarının kaynaklarına göre: \"Hindistan'ın fethi\" hadisi ve halkının tasvirinde bahsedilenler, Haccac ve Muhammed bin Kasım dönemindeki fetihler, Sindh'in fethi ve ülkelerini, krallarını ve dinlerini anlatan coğrafya ve seyahat kitapları."
  id: "India menurut sumber-sumber dari masyarakat anak benua India: hadits tentang “penaklukan India” dan apa yang disebutkan dalam uraian tentang penduduknya, penaklukan pada masa Al-Hajjaj dan Muhammad bin Al-Qasim, penaklukan Sindh, dan buku-buku geografi dan perjalanan yang menggambarkan negara, raja, dan agama mereka."
