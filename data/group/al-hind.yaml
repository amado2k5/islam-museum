  en: "The Hind (the people of India)"
  ur: "ہند"
summary:
  ar: "الهند عند المصادر أهل شبه القارة الهندية: حديث «غزوة الهند» وما ورد في وصف أهلها، والفتوح على عهد الحجاج ومحمد بن القاسم فتح السند، وكتب الجغرافيا والرحلات تصف بلادهم وملوكهم وأديانهم {cite:mubarakpuri-raheeq} {cite:futuh-al-buldan} {cite:kamil-ibn-al-athir}."
  en: "The Hind in the sources are the people of the Indian subcontinent: the hadith of «the raid on India» and what is reported of them, the conquests under al-Hajjaj and Muhammad ibn al-Qasim's taking of Sind, and the geographies and travel books describing their land, kings and religions {cite:mubarakpuri-raheeq} {cite:futuh-al-buldan} {cite:kamil-ibn-al-athir}."
  ur: "ہند مصادر میں برصغیر ہندوستان کے باشندے ہیں: «غزوۂ ہند» کی حدیث اور ان کے اوصاف، حجاج کے عہد میں فتوحات اور محمد بن قاسم کی سندھ کی فتح، اور جغرافیہ و سیاحت کی کتب ان کے ملک، بادشاہوں اور مذاہب کو بیان کرتی ہیں۔"
