summary:
  ar: "مجمع اللغة العربية بالشارقة، أُنشئ سنة 2016 بالمرسوم الأميري رقم 96 لسنة 2016 الصادر عن حاكم الشارقة الشيخ الدكتور سلطان بن محمد القاسمي، جهة حكومية علمية تدعم قضايا العربية ومجامع اللغة العربية والإسلامية وتشرف على عمل معجمي كبير وتصدر مجلة ومكتبة وتستضيف جوانب من اتحاد المجامع، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:alashj-ae} {cite:dohadictionary-org-home}."
  en: "The Arabic Language Academy in Sharjah, founded in 2016 by Amiri Decree No. 96 of 2016 of the Ruler of Sharjah, Sheikh Dr. Sultan bin Muhammad Al Qasimi, a government academic body supporting Arabic language issues and Arab and Islamic language academies, overseeing a major lexicographical work, with a journal, a library and the hosting of aspects of the Union of Arab Language Academies, as a research file supplied to the museum summarises it {cite:alashj-ae} {cite:dohadictionary-org-home}."
  ur: "مجمعِ عربی زبان شارجہ، جو 2016 میں حاکمِ شارجہ شیخ ڈاکٹر سلطان بن محمد القاسمی کے امیری فرمان نمبر 96 برائے 2016 سے قائم ہوا، ایک سرکاری علمی ادارہ ہے جو عربی زبان کے مسائل اور عربی و اسلامی لسانی مجامع کی معاونت کرتا ہے، ایک بڑے لغوی کام کی نگرانی کرتا ہے، ایک جریدہ اور ایک لائبریری رکھتا ہے اور اتحادِ مجامع کے بعض پہلوؤں کی میزبانی کرتا ہے، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اسے خلاصہ کرتی ہے {cite:alashj-ae} {cite:dohadictionary-org-home}۔"
  fr: "L'Académie de la langue arabe de Sharjah, fondée en 2016 par le décret émiral n° 96 de 2016 du souverain de Sharjah, le cheikh Dr Sultan bin Muhammad Al Qasimi, organe académique gouvernemental qui soutient les questions de langue arabe et les académies de langue arabes et islamiques, supervise une grande œuvre lexicographique, possède une revue et une bibliothèque et accueille certains aspects de l'Union des académies de langue arabe, comme le résume un dossier de recherche remis au musée {cite:alashj-ae} {cite:dohadictionary-org-home}."
  es: "La Academia de la Lengua Árabe de Sharjah, fundada en 2016 por el Decreto Emiral n.º 96 de 2016 del gobernante de Sharjah, el jeque Dr. Sultán bin Muhammad Al Qasimi, órgano académico gubernamental que apoya las cuestiones de la lengua árabe y las academias de lengua árabes e islámicas, supervisa una gran obra lexicográfica, tiene una revista y una biblioteca y acoge aspectos de la Unión de Academias de la Lengua Árabe, según lo resume un expediente de investigación entregado al museo {cite:alashj-ae} {cite:dohadictionary-org-home}."
  tr: "Şarjah Emiri Şeyh Dr. Sultan bin Muhammed Al Qasimi tarafından 2016 yılında yayımlanan 96 numaralı Emirlik Kararnamesi ile kurulan Şarjah Arap Dili Akademisi, Arapça konularını ve Arapça ve İslami dil akademilerini destekleyen, önemli bir sözlükbilim çalışmasını denetleyen, bir dergi ve kütüphane yayınlayan ve Akademiler Birliği'nin bazı yönlerine ev sahipliği yapan bilimsel bir devlet kuruluşudur; bu durum, müzeye sunulan bir araştırma dosyasında özetlenmiştir."
  id: "Akademi Bahasa Arab Sharjah, yang didirikan pada tahun 2016 berdasarkan Dekrit Emir No. 96 tahun 2016 yang dikeluarkan oleh Penguasa Sharjah, Sheikh Dr. Sultan bin Muhammad Al Qasimi, adalah badan pemerintah ilmiah yang mendukung isu-isu Arab dan akademi bahasa Arab dan Islam, mengawasi karya leksikografi utama, menerbitkan jurnal dan perpustakaan, serta menjadi tuan rumah aspek-aspek Persatuan Akademi, sebagaimana dirangkum dalam berkas penelitian yang diserahkan ke museum {cite:alashj-ae} {cite:dohadictionary-org-home}."
