label:
  ar: بنو سلامة أصحاب قلعة تاوغزوت
  en: Banu Salama of Qal'at Tawghzut
summary:
  ar: "بنو سلامة أصحاب قلعة تاوغزوت بجبل وانشريش، رؤساؤهم بنو يدللتن من بطون توجين وأشدهم شوكة وأوفرهم عدداً؛ أوطنوا الجعبات وتاوغزوت بعد بني قاضي وبني مادون، وناغى بعضهم الخوارج في دعوتهم، وبايع رئيسهم نصر بن عمر بن عثمان المسعود بن بو زيد بن خالد بن عبد الرحمن لما ملك تلمسان، وقاتلوا عدي بن سلطان وقومه فكانت لهم العاقبة، ودام ملكهم بتاوغزوت إلى أيام أبي زيان بن السلطان أبي سعيد وفتن بني مرين وعام 783هـ."
  en: "Banu Salama, holders of Qal'at Tawghzut in Jabal Wansharish, chiefs the Banu Yadlaten of the Tujin folk — the stoutest and most numerous of its branches, who settled al-Ja'bat and Tawghzut after Banu Qadi and Banu Madun; some fraternised with the Kharijites in their da'wa, and their chief Nasr ibn Umar ibn Uthman gave bay'a to al-Mas'ud ibn Bu Zayd ibn Khalid ibn Abd al-Rahman when he held Tlemcen — their Tawghzut kingship lasted into the fitnas of the Marinids and the era of Abu Ziyyan ibn al-Sultan Abi Sa'id, about 783 AH."
