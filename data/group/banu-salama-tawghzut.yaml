label:
  ar: بنو سلامة أصحاب قلعة تاوغزوت
  en: Banu Salama of Qal'at Tawghzut
  es: "Banu Salama de Qal'at Tawghzut"
  fr: "Banu Salama de Qal'at Tawghzut"
  ur: "قل تغزوت بنو سلامہ"
  tr: "Tawghzout kalesinin sahipleri olan Banu Salama halkı."
  id: "Banu Salama, pemilik benteng Tawghzout"
summary:
  ar: "بنو سلامة أصحاب قلعة تاوغزوت بجبل وانشريش، رؤساؤهم بنو يدللتن من بطون توجين وأشدهم شوكة وأوفرهم عدداً؛ أوطنوا الجعبات وتاوغزوت بعد بني قاضي وبني مادون، وناغى بعضهم الخوارج في دعوتهم، وبايع رئيسهم نصر بن عمر بن عثمان المسعود بن بو زيد بن خالد بن عبد الرحمن لما ملك تلمسان، وقاتلوا عدي بن سلطان وقومه فكانت لهم العاقبة، ودام ملكهم بتاوغزوت إلى أيام أبي زيان بن السلطان أبي سعيد وفتن بني مرين وعام 783هـ."
  en: "Banu Salama, holders of Qal'at Tawghzut in Jabal Wansharish, chiefs the Banu Yadlaten of the Tujin folk — the stoutest and most numerous of its branches, who settled al-Ja'bat and Tawghzut after Banu Qadi and Banu Madun; some fraternised with the Kharijites in their da'wa, and their chief Nasr ibn Umar ibn Uthman gave bay'a to al-Mas'ud ibn Bu Zayd ibn Khalid ibn Abd al-Rahman when he held Tlemcen — their Tawghzut kingship lasted into the fitnas of the Marinids and the era of Abu Ziyyan ibn al-Sultan Abi Sa'id, about 783 AH."
  es: "Banu Salama, poseedores de Qal'at Tawghzut en Jabal Wansharish, jefes de los Banu Yadlaten del pueblo Tujin, la más fuerte y numerosa de sus ramas, que establecieron al-Ja'bat y Tawghzut después de Banu Qadi y Banu Madun; algunos confraternizaron con los jarijitas en su da'wa, y su jefe Nasr ibn Umar ibn Uthman dio bay'a a al-Mas'ud ibn Bu Zayd ibn Khalid ibn Abd al-Rahman cuando ocupó Tlemcen; su reinado Tawghzut duró hasta las fitnas de los Marinids y la era de Abu Ziyyan ibn al-Sultan Abi Sa'id, aproximadamente 783 AH."
  fr: "Banu Salama, détenteurs de Qal'at Tawghzut à Jabal Wansharish, chefs des Banu Yadlaten du peuple Tujin — la plus forte et la plus nombreuse de ses branches, qui se sont installés à al-Ja'bat et Tawghzut après Banu Qadi et Banu Madun; certains ont fraternisé avec les Kharijites dans leur da'wa, et leur chef Nasr ibn Umar ibn Uthman a donné la bay'a à al-Mas'ud ibn Bu Zayd ibn Khalid ibn Abd al-Rahman lorsqu'il tenait Tlemcen - leur royauté Tawghzut a duré jusqu'aux fitnas des Mérinides et à l'ère d'Abu Ziyyan ibn al-Sultan Abi Sa'id, vers 783. Ah."
  ur: "بنو سلامہ، جبل ونشارش میں قلات تغزوت کے حاملین، توجین قوم کے بنو یدلتین کے سردار - اس کی شاخوں میں سب سے مضبوط اور بے شمار، جنہوں نے بنو قادی اور بنو مدون کے بعد الجبت اور توغزوت کو آباد کیا؛ کچھ ان کی دعوت میں خوارج کے ساتھ برادرانہ تھے، اور ان کے سردار نصر ابن عمر بن عثمان نے المسعود بن بو زید بن خالد بن عبدالرحمٰن کی بیعت کی تھی جب وہ تلمسن پر فائز تھے - ان کی توغزوت بادشاہی ابو الانبیاء کے فتنے اور مریانی عنبی کے فتنوں تک جاری رہی۔ سعید، تقریباً 783ھ۔"
  tr: "Vanshresh dağlarındaki Tevzout kalesinin sahipleri olan Beni Salama kabilesinin liderleri, Tawjin kolundan gelen Beni Yadlaltin kabilesidir ve en güçlü ve en kalabalık kabiledirler. Beni Kadı ve Beni Madun kabilelerinden sonra El-Cebat ve Tevzout'a yerleştiler ve bazıları Haricilerle işbirliği yaparak onların çağrısına uydular. Liderleri Nasr bin Ömer bin Osman el-Mesud bin Buzeyd bin Halid bin Abdül Rahman, Tlemcen'i ele geçirdiğinde biat etti ve Adi bin Sultan ve halkıyla savaştılar ve sonuç onların lehine oldu. Tevzout'taki yönetimleri, Ebu Ziyan bin Sultan Ebu Said dönemine, Beni Marin fitnesine ve Hicri 783 yılına kadar sürdü."
  id: "Bani Salama, pemilik benteng Tawghzout di pegunungan Wanshresh, pemimpin mereka adalah Bani Yadlaltin dari cabang Tawjin, dan mereka adalah yang paling kuat dan paling banyak jumlahnya. Mereka menetap di Al-Ja’bat dan Tawghzout setelah Bani Qadi dan Bani Madun, dan sebagian dari mereka bersekongkol dengan Kharijites dalam seruan mereka, dan pemimpin mereka Nasr bin Omar bin Othman Al-Masoud bin Bou Zaid bin Khalid bin Abdul Rahman berjanji setia ketika ia menguasai Tlemcen, dan mereka memerangi Adi bin Sultan dan kaumnya, dan hasilnya menguntungkan mereka, dan kekuasaan mereka di Tawghzout berlangsung hingga zaman Abu Ziyan bin Sultan Abu Saeed dan fitnah Bani Marin dan tahun 783 H."
