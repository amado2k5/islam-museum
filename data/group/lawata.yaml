label: { ar: "لواتة", en: "Lawata" }
summary:
  ar: "لواتة قرية من البربر أهل عهد بأرض برقة؛ كتب عمرو بن العاص في شرطه عليهم أن عليكم أن تبيعوا أبناءكم ونساءكم فيما عليكم من الجزية فقال الليث بن سعد لو كانوا عبيداً ما حلّ ذلك منهم، وكتب عمر بن عبد العزيز في اللواتيات أن من كانت عنده لواتية فليخطبها إلى أبيها أو فليردها إلى أهلها."
  en: "Lawata, a covenant-holding Berber village in the land of Barqa; Amr ibn al-As wrote in their treaty 'upon you is to sell your sons and your women toward the jizya upon you' — whereupon al-Layth ibn Sa'd said 'were they slaves, that would not be lawful of them'; and Umar ibn Abd al-Aziz wrote concerning the Lawatiyyat that whoever holds a Lawatiyya must offer her in marriage to her father or return her to her people."
