summary:
  ar: "لواتة قرية من البربر أهل عهد بأرض برقة؛ كتب عمرو بن العاص في شرطه عليهم أن عليكم أن تبيعوا أبناءكم ونساءكم فيما عليكم من الجزية فقال الليث بن سعد لو كانوا عبيداً ما حلّ ذلك منهم، وكتب عمر بن عبد العزيز في اللواتيات أن من كانت عنده لواتية فليخطبها إلى أبيها أو فليردها إلى أهلها."
  en: "Lawata, a covenant-holding Berber village in the land of Barqa; Amr ibn al-As wrote in their treaty 'upon you is to sell your sons and your women toward the jizya upon you' — whereupon al-Layth ibn Sa'd said 'were they slaves, that would not be lawful of them'; and Umar ibn Abd al-Aziz wrote concerning the Lawatiyyat that whoever holds a Lawatiyya must offer her in marriage to her father or return her to her people."
  es: "Lawata, una aldea bereber que mantenía un pacto en la tierra de Barqa; Amr ibn al-As escribió en su tratado 'sobre vosotros está la obligación de vender a vuestros hijos y a vuestras mujeres para pagar la jizya que os corresponde', a lo que al-Layth ibn Sa'd dijo 'si fueran esclavos, eso no les sería lícito'; y Umar ibn Abd al-Aziz escribió acerca de la Lawatiyyat que quien posea una Lawatiyya debe ofrecerla en matrimonio a su padre o devolverla a su gente."
  fr: "Lawata, un village berbère lié par un pacte dans le pays de Barqa; Amr ibn al-As écrivit dans leur traité: « Il vous incombe de vendre vos fils et vos femmes pour payer la jizya qui vous est due » — sur quoi al-Layth ibn Sa'd dit: « S'ils étaient esclaves, cela ne leur serait pas licite »; et Umar ibn Abd al-Aziz écrivit au sujet des Lawatiyyat que quiconque possède une Lawatiyya doit la donner en mariage à son père ou la rendre à son peuple."
  ur: "لواتا، برقع کی سرزمین میں ایک عہد کے حامل بربر گاؤں؛ عمرو بن العاص نے ان کے معاہدے میں لکھا ہے کہ 'تم پر اپنے بیٹوں اور عورتوں کو بیچ دینا تم پر جزیہ ہے' - اس پر لیث بن سعد نے کہا 'اگر وہ غلام ہوتے تو یہ ان کے لیے حلال نہیں ہوتا'؛ اور عمر بن عبدالعزیز نے لواطیہ کے بارے میں لکھا ہے کہ جس کے پاس لواطیہ ہو وہ اسے اس کے باپ سے نکاح میں پیش کرے یا اسے اس کی قوم کو واپس کرے۔"
  tr: "Lawata, Barqa topraklarında yaşayan, ahit ehli bir Berberi köyüdür. Amr ibn al-Aas, onlar için koyduğu şartlarda, \"Borçlu olduğunuz cizye karşılığında oğullarınızı ve kadınlarınızı satmalısınız\" diye yazmıştır. Al-Layth ibn Saad, \"Eğer köle olsalardı, bu onlar için caiz olmazdı\" demiştir. Ömer ibn Abd al-Aziz, Lawata halkı hakkında, yanında Lawata bir kadın bulunan kişinin ya babasına evlenme teklif etmesi ya da onu ailesine geri vermesi gerektiğini yazmıştır."
  id: "Lawata adalah sebuah desa Berber, kaum yang terikat perjanjian di tanah Barqa. Amr ibn al-Aas menulis dalam syarat-syaratnya untuk mereka bahwa kalian harus menjual putra dan wanita kalian sebagai ganti jizya yang kalian hutang. Al-Layth ibn Saad berkata, “Jika mereka adalah budak, itu tidak diperbolehkan bagi mereka.” Umar ibn Abd al-Aziz menulis mengenai kaum Lawata bahwa siapa pun yang memiliki wanita Lawata bersamanya harus melamar ayahnya atau mengembalikannya kepada keluarganya."
