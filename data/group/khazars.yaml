id: group/khazars
class: group
kind: tribe
label: { ar: "الخزر", en: "The Khazars", es: "Los jázaros", fr: "Les Khazars", ur: "خزر" }
summary:
  ar: "الخزر عند البلاذري أمّة خلف القوقاز ملكُهم الأعظم خاقان؛ قاتلهم سلمان بن ربيعة حتى قُتل ببلنجر وجاشوا في ولاية الجرّاح فعبر الرسّ فواقعهم حتى استشهد قرب أردبيل، ولما بلغ عظيمهم كثرة من وطىء به مروان بن محمد بلاده ملأه ذلك رعباً فأرسل يدعوه إلى الإسلام أو الحرب فقال مروان قد قبلت الإسلام فأظهر الخاقان الإسلام ووادعه على أن أقرّه في مملكته وسار معه بخلق منهم فأنزلهم ما بين السمور والشابران في سهل أرض اللكز، وصاهر يزيد بن أسيد ملكهم بأمر المنصور فولدت له ابنة الخاقان ابناً فمات وماتت في نفاسها."
  en: "The Khazars in al-Baladhuri are the people beyond the Caucasus whose great king bears the title Khaqan; Salman ibn Rabi'a warred on them until slain at Balanjar, and they surged across the Rass in al-Jarrah's day until he met and fell fighting them near Ardabil; when their great king learned the numbers Marwan ibn Muhammad trod into his lands it filled him with dread, and he sent summoning him to Islam or war — Marwan answering 'I accept Islam', whereupon the Khaqan showed forth Islam, Marwan compounding with him confirming his kingdom, and settled a body of them between al-Samur and al-Shabiran in the Lakz plain; and Yazid ibn Asid married into their king's house at al-Mansur's command, the Khaqan's daughter bearing him a son who died while she died in her lying-in."
  es: "Los jázaros de al-Baladhuri son el pueblo que vive más allá del Cáucaso, cuyo gran rey ostenta el título de Khaqan. Salman ibn Rabi'a les guerreó hasta que murió en Balanjar, y ellos cruzaron el Rass en tiempos de al-Jarrah hasta que los encontró y cayó luchando cerca de Ardabil. Cuando su gran rey supo la cantidad de tropas que Marwan ibn Muhammad había traído a sus tierras, se llenó de temor y lo mandó llamar al Islam o a la guerra. Marwan respondió: \"Acepto el Islam\". Entonces el Khaqan proclamó el Islam, Marwan se reconcilió con él, confirmando su reino, y asentó a un grupo de ellos entre al-Samur y al-Shabiran en la llanura de Lakz. Yazid ibn Asid se casó con una mujer de la casa real por orden de al-Mansur, y la hija del Khaqan le dio un hijo que murió mientras ella moría en el parto."
  fr: "Les Khazars d'al-Baladhuri sont le peuple d'au-delà du Caucase dont le grand roi porte le titre de Khaqan. Salman ibn Rabi'a leur fit la guerre jusqu'à sa mort à Balanjar, et ils déferlèrent sur le Rass au temps d'al-Jarrah jusqu'à ce qu'il les rencontre et périsse en les combattant près d'Ardabil. Lorsque leur grand roi apprit le nombre de Marwan ibn Muhammad qui envahissaient ses terres, il fut saisi d'effroi et l'envoya le sommer de se convertir à l'islam ou de lui faire la guerre. Marwan répondit: « J'accepte l'islam », et le Khaqan se convertit alors. Marwan conclut un accord avec lui, confirmant ainsi son royaume, et installa une partie d'entre eux entre al-Samur et al-Shabiran, dans la plaine de Lakz. Yazid ibn Asid épousa une femme de la maison royale sur ordre d'al-Mansur; la fille du Khaqan lui donna un fils qui mourut pendant qu'elle était en couches."
  ur: "البلادوری میں خزر قفقاز سے باہر کے لوگ ہیں جن کا عظیم بادشاہ خاقان کا لقب رکھتا ہے۔ سلمان بن ربیعہ نے ان سے جنگ کی یہاں تک کہ بلنجر میں قتل ہو گئے، اور وہ الجراح کے دن راس کے پار بڑھے یہاں تک کہ وہ اردبیل کے قریب ان سے لڑتے ہوئے گر پڑے۔ جب ان کے عظیم بادشاہ نے مروان بن محمد کو اپنی سرزمین میں گھومنے کی تعداد معلوم کی تو اس نے اسے خوف سے بھر دیا، اور اس نے اسے اسلام یا جنگ کی طرف بلانے کے لیے بھیجا - مروان نے جواب دیا 'میں اسلام قبول کرتا ہوں'، اس کے بعد خاقان نے اسلام ظاہر کیا، مروان نے اس کے ساتھ مل کر اپنی سلطنت کی تصدیق کی، اور ان کے ایک جسم کو الصامرین اور لاصغران کے درمیان آباد کیا۔ اور یزید بن اسید نے المنصور کے حکم پر اپنے بادشاہ کے گھر میں شادی کر لی، خاقان کی بیٹی نے اس کے لیے ایک بیٹا پیدا کیا جو اس کے لیٹے ہوئے ہی مر گیا۔"
