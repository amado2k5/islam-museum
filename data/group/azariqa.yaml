summary:
  ar: "فرع من الخوارج نُسب إلى نافع بن الأزرق، فرّق الخوارج بالتكفير واستحلال نساء المخالفين وأطفالهم، وأُبيد أتباعه في القرن الثاني الهجري {cite:encyclopaedia-of-islam-2 vol. 1 p. 860-861}."
  en: "A main branch of the Kharijites named after Nafi' b. al-Azraq, who split them over the killing of adversaries' women and children; the movement was crushed in the early eighth century {cite:encyclopaedia-of-islam-2 vol. 1 p. 860-861}."
  es: "Una rama principal de los jariyitas que lleva el nombre de Nafi' b. al-Azraq, quien los dividió por el asesinato de mujeres y niños de los adversarios; el movimiento fue aplastado a principios del siglo VIII {cite:encyclopaedia-of-islam-2 vol. 1 p. 860-861}."
  fr: "Une branche principale des Kharijites nommée d'après Nafi' b. al-Azraq, qui les a divisés à propos du meurtre des femmes et des enfants des adversaires; le mouvement a été écrasé au début du VIIIe siècle {cite:encyclopaedia-of-islam-2 vol. 1 p. 860-861}."
  ur: "خوارج کی ایک اہم شاخ نافع بن کے نام سے منسوب ہے۔ الازرق، جس نے انہیں مخالفین کی عورتوں اور بچوں کے قتل پر تقسیم کیا۔ آٹھویں صدی کے اوائل میں اس تحریک کو کچل دیا گیا تھا۔ 1 ص۔ 860-861}۔"
