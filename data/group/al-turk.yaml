summary:
  ar: "الترك عند المصادر أهل ما وراء النهر وسهوب آسيا الوسطى: حديث «لا تقوم الساعة حتى تقاتلوا الترك» ووصفهم صغار الأعين، وتاريخ ابن الأثير واليعقوبي يقصان فتوحهم ودخولهم في الإسلام وبناء دولهم — السلاجقة ثم العثمانيين {cite:sahih-al-bukhari} {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  en: "The Turks in the sources are the people of Transoxiana and the steppes of Central Asia: the hadith «the Hour will not come until you fight the Turks» and the descriptions of them, and the histories of Ibn al-Athir and al-Ya'qubi recount their entry into Islam and the states they built — the Seljuks then the Ottomans {cite:sahih-al-bukhari} {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  ur: "ترک مصادر میں ماوراء النہر اور وسط ایشیائی میدانوں کے باشندے ہیں: حدیث «قیامت قائم نہیں ہوگی جب تک تم ترکوں سے نہ لڑو» اور ان کے اوصاف، اور ابن اثیر و یعقوبی کی تاریخیں ان کے اسلام میں داخلے اور ان کی ریاستوں — سلجوقی پھر عثمانی — کا قصہ بیان کرتی ہیں۔"
