summary:
  ar: "قناة يوتيوب تجميعية للوعظ البنغالي تحمل اسم دكا ودولة قناتها مضبوطة على الإمارات العربية المتحدة، فهي تعمل من الشتات؛ بلغ عدد مشتركيها (@dhakabanglawaz) نحو 875 ألفًا بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح."
  en: "A diaspora-operated YouTube aggregator channel for Bengali waz: it carries Dhaka in its name while its channel country is set to the United Arab Emirates; its channel (@dhakabanglawaz) counted about 875 thousand subscribers by vidIQ's count read on 8 November 2026, and no named head or operator for it was identified in this pass."
  ur: "ڈھاکہ بنگلا واز بنگالی وعظ کا ایک مجموعی یوٹیوب چینل ہے جس کے نام میں ڈھاکہ آتا ہے لیکن اس کا چینل ملک متحدہ عرب امارات مقرر ہے، یعنی یہ بیرونِ ملک سے چلایا جاتا ہے؛ اس کے سبسکرائبرز کی تعداد 8 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 875 ہزار تھی، اور اس جائزے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہوا۔"
  es: "Un canal agregador de YouTube operado por la diáspora para waz bengalí: lleva Dhaka en su nombre, pero el país del canal está configurado como Emiratos Árabes Unidos; su canal (@dhakabanglawaz) contaba con unos 875 mil suscriptores según el recuento de vidIQ realizado el 8 de noviembre de 2026, y en este informe no se identificó a ningún responsable u operador con nombre."
  fr: "Une chaîne YouTube agrégatrice de waz bengali gérée par la diaspora: son nom inclut Dhaka tandis que son pays de diffusion est défini sur les Émirats arabes unis; sa chaîne (@dhakabanglawaz) comptait environ 875 000 abonnés selon le décompte de vidIQ relevé le 8 novembre 2026, et aucun responsable ou opérateur n'a été identifié à ce jour."
