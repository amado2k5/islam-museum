  ar: "قناة يوتيوب تجميعية للوعظ البنغالي تحمل اسم دكا ودولة قناتها مضبوطة على الإمارات العربية المتحدة، فهي تعمل من الشتات؛ بلغ عدد مشتركيها (@dhakabanglawaz) نحو 875 ألفًا بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح."
