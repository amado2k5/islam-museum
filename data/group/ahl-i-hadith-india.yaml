label:
  ar: "أهل الحديث (شبه القارة)"
  en: "Ahl-i Hadith"
summary:
  ar: "أهل الحديث، أي «أتباع السنة النبوية»، اسم تُعرف به في الهند وباكستان جماعة مسلمة تدعي الأخذ بآراء أصحاب الحديث الأوائل، فلا تتقيد بالتقليد لأئمة المذاهب الأربعة، وتعتمد الأحاديث الصحيحة مع القرآن، وتشدد على التوحيد وترك البدع. ظهرت فرقةً مستقلة في القرن التاسع عشر بفضل صديق حسن خان وسيد نذير حسين الدهلوي، ونظّمت مؤتمرها الهندي من سنة 1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 281}."
  en: "Ahl-i Hadith, 'the followers of the Prophetic tradition', is the name in India and Pakistan of a Muslim movement that claims the views of the early ashab al-hadith. It does not bind itself to taqlid of the four law schools, takes the authentic traditions with the Qur'an as the guide, and stresses the unity of God and the rejection of innovation. It appeared as a distinct sect in the nineteenth century, through Siddiq Hasan Khan and Sayyid Nadhir Husayn of Delhi, and from 1912 it held an All-India Ahl-i Hadith Conference at Delhi {cite:encyclopaedia-of-islam-2 vol. 1 p. 281}."
