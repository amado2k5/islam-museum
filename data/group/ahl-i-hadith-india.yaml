summary:
  ar: "أهل الحديث، أي «أتباع السنة النبوية»، اسم تُعرف به في الهند وباكستان جماعة مسلمة تدعي الأخذ بآراء أصحاب الحديث الأوائل، فلا تتقيد بالتقليد لأئمة المذاهب الأربعة، وتعتمد الأحاديث الصحيحة مع القرآن، وتشدد على التوحيد وترك البدع. ظهرت فرقةً مستقلة في القرن التاسع عشر بفضل صديق حسن خان وسيد نذير حسين الدهلوي، ونظّمت مؤتمرها الهندي من سنة 1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 281}."
  en: "Ahl-i Hadith, 'the followers of the Prophetic tradition', is the name in India and Pakistan of a Muslim movement that claims the views of the early ashab al-hadith. It does not bind itself to taqlid of the four law schools, takes the authentic traditions with the Qur'an as the guide, and stresses the unity of God and the rejection of innovation. It appeared as a distinct sect in the nineteenth century, through Siddiq Hasan Khan and Sayyid Nadhir Husayn of Delhi, and from 1912 it held an All-India Ahl-i Hadith Conference at Delhi {cite:encyclopaedia-of-islam-2 vol. 1 p. 281}."
  es: "Ahl-i Hadith, «los seguidores de la tradición profética», es el nombre que recibe en India y Pakistán un movimiento musulmán que se adhiere a las ideas de los primeros ashab al-hadith. No se adhiere a la taqlid de las cuatro escuelas jurídicas, toma las tradiciones auténticas con el Corán como guía y enfatiza la unidad de Dios y el rechazo a la innovación. Surgió como una secta distinta en el siglo XIX, a través de Siddiq Hasan Khan y Sayyid Nadhir Husayn de Delhi, y desde 1912 celebró una Conferencia Panindia de Ahl-i Hadith en Delhi {cite:encyclopaedia-of-islam-2 vol. 1 p. 281}."
  fr: "Ahl-i Hadith, « les adeptes de la tradition prophétique », désigne en Inde et au Pakistan un mouvement musulman qui se réclame des enseignements des premiers ashab al-hadith. Ce mouvement ne se soumet pas à l'interprétation littérale (taqlid) des quatre écoles juridiques, s'appuie sur les traditions authentiques et le Coran comme guide, et insiste sur l'unicité de Dieu et le rejet de l'innovation. Apparu comme une secte distincte au XIXe siècle, sous l'impulsion de Siddiq Hasan Khan et Sayyid Nadhir Husayn de Delhi, il organisa à partir de 1912 une conférence panindienne Ahl-i Hadith à Delhi (voir Encyclopaedia of Islam, vol. 2, p. 281)."
  ur: "اہل حدیث، 'نبی روایت کے پیروکار'، ہندوستان اور پاکستان میں ایک مسلم تحریک کا نام ہے جو ابتدائی اصحاب الحدیث کے نظریات کا دعویٰ کرتی ہے۔ یہ اپنے آپ کو چار قانون مکاتب کی تقلید کا پابند نہیں کرتا، قرآن کے ساتھ مستند روایات کو رہنما کے طور پر لیتا ہے، اور خدا کی وحدانیت اور بدعت کے رد پر زور دیتا ہے۔ یہ انیسویں صدی میں ایک الگ فرقے کے طور پر، صدیق حسن خان اور سید نادر حسین دہلی کے ذریعے ظاہر ہوا، اور 1912 سے اس نے دہلی میں آل انڈیا اہل حدیث کانفرنس کا انعقاد کیا۔ 1 ص۔ 281}۔"
