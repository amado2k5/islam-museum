label: { ar: "عدنان ⁦(العرب المستعربة)⁩", en: "Adnan (the Arabized Arabs)", es: "Adnan (los árabes arabizados)", fr: "Adnan (les Arabes arabisés)", ur: "عدنان ⁦(عربی عرب)⁩", tr: "Adnan (Araplaşmış Araplar)", id: "Adnan (Orang Arab yang telah diarabkan)" }
summary:
  ar: "السلالة التي تسمى العرب المستعربة: تنسب إلى إسماعيل بن إبراهيم وتسمى العدنانية، ومنها ربيعة ومضر ومنهما قريش وسائر قبائل الحجاز ونجد."
  en: "The lineage called the Arabized Arabs: tracing to Ismail ibn Ibrahim, also called Adnani; from it come Rabiʾa and Mudar, and through them Quraysh and the tribes of the Hijaz and Najd."
  es: "El linaje llamado árabes arabizados: que se remonta a Ismail ibn Ibrahim, también llamado Adnani; de él provienen Rabiʾa y Mudar, y a través de ellos Quraysh y las tribus del Hiyaz y Najd."
  fr: "La lignée appelée les Arabes arabisés: remontant à Ismail ibn Ibrahim, également appelé Adnani; de lui viennent Rabiʾa et Mudar, et par eux les Quraysh et les tribus du Hedjaz et du Najd."
  ur: "نسب کو عربی عرب کہا جاتا ہے: اسماعیل بن ابراہیم، جسے عدنانی بھی کہا جاتا ہے، کا پتہ لگانا۔ اس سے ربیعہ اور مدر نکلے اور ان کے ذریعے قریش اور حجاز اور نجد کے قبائل۔"
  tr: "Araplaşmış Araplar olarak adlandırılan soy: İsmail bin İbrahim'e atfedilir ve Adnanlılar olarak adlandırılır; Rabi'ah ve Mudar'ı içerir ve onlardan Kureyş ve Hicaz ile Necd'in tüm kabileleri gelir."
  id: "Garis keturunan yang disebut Arab yang terarabkan: Garis keturunan ini dikaitkan dengan Ismail bin Ibrahim dan disebut Adnanites, dan termasuk Rabi’ah dan Mudar, dan dari mereka berasal Quraysh dan semua suku Hijaz dan Najd."
