summary:
  ar: "السلالة التي تسمى العرب المستعربة: تنسب إلى إسماعيل بن إبراهيم وتسمى العدنانية، ومنها ربيعة ومضر ومنهما قريش وسائر قبائل الحجاز ونجد."
  en: "The lineage called the Arabized Arabs: tracing to Ismail ibn Ibrahim, also called Adnani; from it come Rabiʾa and Mudar, and through them Quraysh and the tribes of the Hijaz and Najd."
  es: "El linaje llamado árabes arabizados: que se remonta a Ismail ibn Ibrahim, también llamado Adnani; de él provienen Rabiʾa y Mudar, y a través de ellos Quraysh y las tribus del Hiyaz y Najd."
  fr: "La lignée appelée les Arabes arabisés: remontant à Ismail ibn Ibrahim, également appelé Adnani; de lui viennent Rabiʾa et Mudar, et par eux les Quraysh et les tribus du Hedjaz et du Najd."
