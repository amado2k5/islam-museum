summary:
  ar: "بنو شيبان بن ثعلبة بن عكابة بن صعب بن علي بن بكر بن وائل؛ بطن ربيعي من بكر بن وائل بالجزيرة والفرات، منهم المثنى بن حارثة الشيباني صاحب أول مشاهد الفرس في الإسلام وابنه المهنا، وعندهم من صناعة الحرب ما عرفوا به {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  en: "Banu Shayban ibn Tha'laba ibn Ukaba ibn Sa'b ibn Ali ibn Bakr ibn Wa'il — a Rabi'i clan of Bakr ibn Wa'il on the Jazira-Euphrates; from them al-Muthanna ibn Haritha who opened the first Persian battlefields of Islam, and his son al-Muhanna — masters of the art of war {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
