label:
  ar: بنو هلال
  en: Banu Hilal
summary:
  ar: "بنو هلال بن عامر بن صعصعة، من أعظم أحياء العرب في الإسلام؛ كانوا في الجاهلية بنجد ثم ساروا إلى الديار المصرية في حروب القرامطة، ثم أجازهم الوزير البارزي في خلافة المستنصر العبيدي لحرب المعز بن باديس فملكوا ضواحي إفريقية وأفسدوها فيما قال ابن حزم، ثم زاحمهم بنو سليم فساروا إلى الغرب ما بين بونة وقسطنطينة إلى البحر المحيط، وكان لهلال خمسة من الولد: شعبة وناشرة ونهيك وعبد مناف وعبد الله، وترجع قبائلهم إلى أثبج ورياح وزغبة وقارع."
  en: "Banu Hilal ibn Amir ibn Sa'sa'a, among the greatest Arab divisions in Islam; Najd-dwellers who moved into Egypt in the Qarmatian wars, then were let west by the vizier al-Yazuri under the Fatimid al-Mustansir to war al-Mu'izz ibn Badis — they seized Ifriqiya's countryside and ruined it, then, pressed by Banu Sulaym, moved into the Maghreb between Bona and Constantine to the Ocean; Hilal's five sons — Shu'ba, Nashira, Nuhayk, Abd Manaf and Abdallah — father all their clans, of whom the Athbaj, Riyah, Zughba and Qari'."
