label: { ar: "العجم", en: "Al-ʿAjam (non-Arabs)" }
summary:
  ar: "العجم في كلام العرب من لا يفصح بالعربية، وخصوصاً الفرس في عهد النبي؛ ورد في القرآن «أعجمي وعربي» وفي الحديث «لو كان الإيمان معلقاً بالثريا لناله رجال من أبناء فارس» وحديث «العجم والعرب» في معنى المساواة {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
  en: "Al-'Ajam in Arab speech are the non-Arabs who do not speak clear Arabic — above all the Persians in the Prophet's time. The Qur'an pairs 'ajami' with 'arabi' (41:44), and the hadith says «were faith hung on the Pleiades, men of Persian stock would take it» — and the sermons make Arab and non-Arab equal {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
