label: { ar: "العجم", en: "Al-ʿAjam (non-Arabs)", es: "Al-ʿAjam (no árabes)", fr: "Al-ʿAjam (non-Arabes)", ur: "العجم ⁦(غیر عرب)⁩", tr: "Persler", id: "orang Persia" }
summary:
  ar: "العجم في كلام العرب من لا يفصح بالعربية، وخصوصاً الفرس في عهد النبي؛ ورد في القرآن «أعجمي وعربي» وفي الحديث «لو كان الإيمان معلقاً بالثريا لناله رجال من أبناء فارس» وحديث «العجم والعرب» في معنى المساواة {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
  en: "Al-'Ajam in Arab speech are the non-Arabs who do not speak clear Arabic — above all the Persians in the Prophet's time. The Qur'an pairs 'ajami' with 'arabi' (41:44), and the hadith says «were faith hung on the Pleiades, men of Persian stock would take it» — and the sermons make Arab and non-Arab equal {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
  es: "Al-'Ajam en el habla árabe son los no árabes que no hablan un árabe claro, sobre todo los persas en la época del Profeta. El Corán asocia 'ajami' con 'arabi' (41:44), y el hadiz dice «si la fe estuviera colgada de las Pléyades, los hombres de ascendencia persa la tomarían», y los sermones equiparan a árabes y no árabes {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
  fr: "Dans le langage arabe, les « al-'Ajam » désignent les non-Arabes qui ne parlent pas un arabe clair, notamment les Perses à l'époque du Prophète. Le Coran associe « ajami » à « arabi » (41:44), et un hadith affirme que « si la foi dépendait des Pléiades, les hommes d'origine perse l'accepteraient ». Les sermons, quant à eux, établissent une équivalence entre Arabes et non-Arabes."
  ur: "عربی تقریر میں العجم وہ غیر عرب ہیں جو واضح عربی نہیں بولتے ہیں - پیغمبر کے زمانے میں فارسیوں سے بڑھ کر۔ قرآن نے 'عجمی' کو 'عربی' (41:44) کے ساتھ جوڑا ہے، اور حدیث کہتی ہے کہ \"اگر ایمان لٹکا دیا جائے تو فارسی اسٹاک کے لوگ اسے لے لیں گے\" - اور خطبات عرب اور غیر عرب کو برابر قرار دیتے ہیں۔"
  tr: "Arapçada \"Acem\" terimi, özellikle Peygamberimiz zamanındaki Persler arasında, Arapçayı akıcı konuşamayan kişiyi ifade eder. Kur'an'da \"Acem ve Arap\" olarak, Hadis'te ise \"Eğer iman Ülker yıldızlarından sarkıtılsa bile, Pers oğullarından olanlar ona kavuşurlar\" şeklinde geçmektedir. Hadis'teki \"Acem ve Arap\" ifadesi eşitlik anlamındadır. {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}"
  id: "Istilah “Ajam” dalam bahasa Arab merujuk kepada seseorang yang tidak fasih berbahasa Arab, terutama orang Persia pada zaman Nabi. Istilah ini disebutkan dalam Al-Qur'an sebagai “Ajami dan Arab” dan dalam Hadits sebagai “Sekiranya iman digantungkan pada Pleiades, maka orang-orang dari keturunan Persia akan memperolehnya.” Hadits “Ajam dan Arab” memiliki makna kesetaraan. {cite:tafsir-tabari-shakir-v01} {cite:sahih-al-bukhari} {cite:mubarakpuri-raheeq}."
