summary:
  ar: "عشيرة كبيرة من سادة حضرموت وصوفيتها، يسكن أكثرها تريم وما حولها، وأسسها الصوفي محمد بن علي الأستاذ الأعظم، ولها علماء ومؤرخون وصوفية عبر القرون {cite:encyclopaedia-of-islam-2 vol. 1 p. 877-879}."
  en: "A large clan of Hadrami sayyids and Sufis living mostly in and around Tarim; its founder of the Sufi line was Muhammad b. 'Ali al-Ustadh al-a'zam, and it produced scholars, historians and Sufis over the centuries {cite:encyclopaedia-of-islam-2 vol. 1 p. 877-879}."
  es: "Un gran clan de sayyids y sufíes hadramíes que vivían principalmente en Tarim y sus alrededores; su fundador de la línea sufí fue Muhammad b. 'Ali al-Ustadh al-a'zam, y produjo eruditos, historiadores y sufíes a lo largo de los siglos {cite:encyclopaedia-of-islam-2 vol. 1 p. 877-879}."
  fr: "Un grand clan de sayyids et soufis hadramites vivant principalement à Tarim et dans ses environs; son fondateur de la lignée soufie était Muhammad b. 'Ali al-Ustadh al-a'zam, et il a produit des érudits, des historiens et des soufis au fil des siècles {cite:encyclopaedia-of-islam-2 vol. 1 p. 877-879}."
  ur: "حضرمی سیدوں اور صوفیاء کا ایک بڑا قبیلہ جو زیادہ تر ترم کے اندر اور اس کے آس پاس رہتا ہے۔ اس کے صوفی سلسلے کے بانی محمد بن تھے۔ علی الاستاد الاعظم، اور اس نے صدیوں کے دوران علماء، مورخین اور صوفی پیدا کیے 1 ص۔ 877-879}۔"
