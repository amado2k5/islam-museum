summary:
  ar: "عشيرة كبيرة من سادة حضرموت وصوفيتها، يسكن أكثرها تريم وما حولها، وأسسها الصوفي محمد بن علي الأستاذ الأعظم، ولها علماء ومؤرخون وصوفية عبر القرون {cite:encyclopaedia-of-islam-2 vol. 1 p. 877-879}."
  en: "A large clan of Hadrami sayyids and Sufis living mostly in and around Tarim; its founder of the Sufi line was Muhammad b. 'Ali al-Ustadh al-a'zam, and it produced scholars, historians and Sufis over the centuries {cite:encyclopaedia-of-islam-2 vol. 1 p. 877-879}."
