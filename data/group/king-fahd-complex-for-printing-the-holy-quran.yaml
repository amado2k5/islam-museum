label:
  ar: "مجمع الملك فهد لطباعة المصحف الشريف"
  en: "King Fahd Complex for the Printing of the Holy Qur'an"
  ur: "مجمع الملک فہد لطباعۃ المصحف الشریف"
summary:
  ar: "مؤسسة بالمدينة المنورة تابعة لوزارة الشؤون الإسلامية والأوقاف والدعوة والإرشاد في المملكة العربية السعودية، يشرف عليها الوزير، تُعنى بطباعة المصحف الشريف وبتبليغ معاني القرآن لغير الناطقين بالعربية بترجمات تمر بلجان مراجعة، ولهذا الغرض أصدرت «التفسير الميسر» أساسًا لترجماتها."
  en: "An institution in Medina under Saudi Arabia's Ministry of Islamic Affairs, Endowments, Da'wa and Guidance, supervised by the minister, devoted to printing the Qur'an and to conveying its meanings to non-Arabic speakers through translations reviewed by committees; to that end it issued al-Tafsir al-Muyassar as the basis of its translations."
  ur: "مدینہ منورہ میں سعودی عرب کی وزارتِ اسلامی امور، اوقاف، دعوت و ارشاد کے تحت ایک ادارہ، جس کی نگرانی وزیر کرتے ہیں، جو قرآن کی طباعت اور غیر عربی دانوں تک کمیٹیوں سے نظرثانی شدہ تراجم کے ذریعے اس کے معانی پہنچانے کے لیے وقف ہے؛ اسی مقصد کے لیے اس نے اپنے تراجم کی بنیاد کے طور پر «التفسیر المیسر» شائع کی۔"
