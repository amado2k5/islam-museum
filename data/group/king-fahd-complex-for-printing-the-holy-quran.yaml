label:
  ar: "مجمع الملك فهد لطباعة المصحف الشريف"
  en: "King Fahd Complex for the Printing of the Holy Qur'an"
  ur: "مجمع الملک فہد لطباعۃ المصحف الشریف"
  es: "Complejo Rey Fahd para la Impresión del Sagrado Corán"
  fr: "Complexe du roi Fahd pour l'impression du Saint Coran"
  tr: "Kral Fahd Kur'an Basım Kompleksi"
  id: "Kompleks Raja Fahd untuk Mencetak Al-Quran Suci"
summary:
  ar: "مؤسسة بالمدينة المنورة تابعة لوزارة الشؤون الإسلامية والأوقاف والدعوة والإرشاد في المملكة العربية السعودية، يشرف عليها الوزير، تُعنى بطباعة المصحف الشريف وبتبليغ معاني القرآن لغير الناطقين بالعربية بترجمات تمر بلجان مراجعة، ولهذا الغرض أصدرت «التفسير الميسر» أساسًا لترجماتها."
  en: "An institution in Medina under Saudi Arabia's Ministry of Islamic Affairs, Endowments, Da'wa and Guidance, supervised by the minister, devoted to printing the Qur'an and to conveying its meanings to non-Arabic speakers through translations reviewed by committees; to that end it issued al-Tafsir al-Muyassar as the basis of its translations."
  ur: "مدینہ منورہ میں سعودی عرب کی وزارتِ اسلامی امور، اوقاف، دعوت و ارشاد کے تحت ایک ادارہ، جس کی نگرانی وزیر کرتے ہیں، جو قرآن کی طباعت اور غیر عربی دانوں تک کمیٹیوں سے نظرثانی شدہ تراجم کے ذریعے اس کے معانی پہنچانے کے لیے وقف ہے؛ اسی مقصد کے لیے اس نے اپنے تراجم کی بنیاد کے طور پر «التفسیر المیسر» شائع کی۔"
  es: "Una institución en Medina dependiente del Ministerio de Asuntos Islámicos, Dotaciones, Da'wa y Orientación de Arabia Saudita, supervisada por el ministro, dedicada a imprimir el Corán y a transmitir su significado a los hablantes no árabes a través de traducciones revisadas por comités; con ese fin, publicó al-Tafsir al-Muyassar como base de sus traducciones."
  fr: "Une institution à Médine, sous l'autorité du ministère saoudien des Affaires islamiques, des Biens religieux, de la Da'wa et de l'Orientation, placée sous la supervision du ministre, se consacrait à l'impression du Coran et à la transmission de son sens aux non-arabophones grâce à des traductions examinées par des comités; à cette fin, elle publiait al-Tafsir al-Muyassar comme base de ses traductions."
  tr: "Suudi Arabistan Krallığı'nda İslam İşleri, Vakıflar, Davet ve Rehberlik Bakanlığı'na bağlı, Bakanın gözetiminde faaliyet gösteren Medine merkezli bir kurum, Kur'an-ı Kerim'in basımı ve Kur'an'ın anlamlarının, inceleme komitelerinden geçen tercümeler aracılığıyla Arapça bilmeyenlere aktarılmasıyla ilgilenmektedir. Bu amaçla, tercümelerinin temeli olarak \"Basitleştirilmiş Tefsir\"i yayınlamıştır."
  id: "Sebuah lembaga di Madinah yang berafiliasi dengan Kementerian Urusan Islam, Wakaf, Dakwah dan Bimbingan di Kerajaan Arab Saudi, di bawah pengawasan Menteri, yang bertugas mencetak Al-Qur'an dan menyampaikan makna Al-Qur'an kepada penutur bahasa non-Arab melalui terjemahan yang melalui komite peninjau. Untuk tujuan ini, lembaga tersebut menerbitkan \"Tafsir Sederhana\" sebagai dasar terjemahannya."
