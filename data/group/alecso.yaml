label:
  ar: "الألكسو ومشاريعها في اللغة العربية"
  en: "ALECSO and its Arabic-language projects"
  ur: "الکسو اور عربی زبان میں اس کے منصوبے"
  fr: "L'ALECSO et ses projets pour la langue arabe"
  es: "La ALECSO y sus proyectos sobre la lengua árabe"
summary:
  ar: "المنظمة العربية للتربية والثقافة والعلوم ⁦(الألكسو)⁩ التابعة لجامعة الدول العربية وما يتصل بها من مشاريع في اللغة العربية: مكتب تنسيق التعريب بالرباط ⁦(1961 في هذا الملف و1962 في ملف آخر)⁩، والإطار المرجعي المشترك للغة العربية، ونظام السياسة اللغوية في الدول العربية، ومنصة معجم المصطلحات العربية الموحد المطلقة سنة 2026 مع مجمع الملك سلمان، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:alecso-org} {cite:alhawary-arabic-applied-linguistics-2021} {cite:ksaa-gov-sa}."
  en: "The Arab League Educational, Cultural and Scientific Organization (ALECSO) and its Arabic-language projects: the Arabization Coordination Bureau in Rabat (1961 in this file, 1962 in another), the Common Framework of Reference for the Arabic Language, the Language Policy System in Arab Countries, and the Unified Arabic Terminology Dictionary platform launched in 2026 with the King Salman Academy, as a research file supplied to the museum summarises them {cite:alecso-org} {cite:alhawary-arabic-applied-linguistics-2021} {cite:ksaa-gov-sa}."
  ur: "عرب لیگ سے وابستہ عرب تنظیم برائے تعلیم، ثقافت اور علوم ⁦(الکسو)⁩ اور عربی زبان میں اس سے متعلق منصوبے: رباط میں مکتب تنسیق التعریب ⁦(اس فائل میں 1961 اور ایک دوسری فائل میں 1962)⁩، عربی زبان کا مشترکہ حوالہ جاتی خاکہ، عرب ممالک میں لسانی پالیسی کا نظام، اور مجمع الملک سلمان کے ساتھ 2026 میں شروع کیا گیا متحدہ عربی اصطلاحات لغت کا پلیٹ فارم، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اس کا خلاصہ کرتی ہے {cite:alecso-org} {cite:alhawary-arabic-applied-linguistics-2021} {cite:ksaa-gov-sa}."
  fr: "L'Organisation de la Ligue arabe pour l'éducation, la culture et les sciences (ALECSO) et ses projets pour la langue arabe : le Bureau de coordination de l'arabisation à Rabat (1961 dans ce dossier, 1962 dans un autre), le Cadre de référence commun pour la langue arabe, le Système de politique linguistique dans les pays arabes et la plateforme du Dictionnaire unifié de la terminologie arabe lancée en 2026 avec l'Académie du roi Salmane, comme les résume un dossier de recherche remis au musée {cite:alecso-org} {cite:alhawary-arabic-applied-linguistics-2021} {cite:ksaa-gov-sa}."
  es: "La Organización de la Liga Árabe para la Educación, la Cultura y las Ciencias (ALECSO) y sus proyectos sobre la lengua árabe: la Oficina de Coordinación de la Arabización en Rabat (1961 en este expediente, 1962 en otro), el Marco de Referencia Común para la Lengua Árabe, el Sistema de Política Lingüística en los Países Árabes y la plataforma del Diccionario Unificado de Terminología Árabe lanzada en 2026 con la Academia del Rey Salmán, tal como los resume un expediente de investigación entregado al museo {cite:alecso-org} {cite:alhawary-arabic-applied-linguistics-2021} {cite:ksaa-gov-sa}."
