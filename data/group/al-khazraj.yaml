summary:
  ar: "الخزرج بن حارثة بن ثعلبة بن عمرو مزيقياء الأزدي، سكن مع أخيه الأوس يثرب ذات النخل حين وجههما الكاهن عمران بن عامر إليها، وهم من الذين سموا غسان من بني مازن قبل تفرقهم {cite:muruj-al-dhahab p. 497-498}."
  en: "Son of Haritha ibn Tha'laba ibn Muzayqiya — settled with his brother Aws in Yathrib at the kahin's word, of those who once bore the Ghassan name {cite:muruj-al-dhahab p. 497-498}."
  es: "Hijo de Haritha ibn Tha'laba ibn Muzayqiya — se estableció con su hermano Aws en Yathrib por palabra del kahin, de aquellos que una vez llevaron el nombre Ghassan {cite:muruj-al-dhahab p. 497-498}."
  fr: "Fils de Haritha ibn Tha'laba ibn Muzayqiya — s'installa avec son frère Aws à Yathrib sur ordre du kahin, de ceux qui portaient autrefois le nom Ghassan {cite:muruj-al-dhahab p. 497-498}."
  ur: "حارثہ بن ثعلبہ ابن مزاقیہ کا بیٹا - اپنے بھائی اوس کے ساتھ یثرب میں کاہین کی بات پر آباد ہوا، ان لوگوں میں سے جو کبھی غسان کا نام رکھتے تھے۔ 497-498}۔"
  tr: "Al-Khazraj bin Haritha bin Tha’laba bin Amr Muzayqiya Al-Azdi, kardeşi Al-Aws ile birlikte Yathrib Dhat Al-Nakhl'da yaşıyordu; bu orayı rahip İmran bin Amer onlara tavsiye etmişti. Onlar, dağılmadan önce Beni Mazin'den Ghassan olarak adlandırılanlar arasındadırlar. {kaynak:muruj-al-dhahab s. 497-498}"
  id: "Al-Khazraj bin Haritha bin Tha’laba bin Amr Muzayqiya Al-Azdi, tinggal bersama saudaranya Al-Aws di Yathrib Dhat Al-Nakhl ketika pendeta Imran bin Amer mengarahkan mereka ke sana. Mereka termasuk di antara orang-orang yang disebut Ghassan dari Bani Mazin sebelum mereka tercerai-berai {cite:muruj-al-dhahab p. 497-498}."
