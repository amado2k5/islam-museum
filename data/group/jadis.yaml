summary:
  ar: "جديس بن عابر بن إرم بن سام بن نوح سار بولده ومن تبعه فنزلوا اليمامة وهو يقول أنا جديس والمسير المسلكا فدتك نفسي يا ثمود المهلكا، وهم من العرب العاربة البائدة {cite:muruj-al-dhahab p. 450}. ثم أفناهم الملك حسان بحمير بعد خديعة الشجر المقتلع على زرقاء اليمامة، فسبى نساءهم وصبيانهم وهرب ملكهم الأسود بن غفار إلى طيء {cite:muruj-al-dhahab p. 455-456}"
  en: "Descendants of Jadis ibn 'Abir who marched to al-Yamama — one of the vanished Arabic mother-tribes {cite:muruj-al-dhahab p. 450}."
  es: "Descendientes de Jadis ibn 'Abir que marcharon a al-Yamama, una de las tribus madre árabes desaparecidas {cite:muruj-al-dhahab p. 450}."
  fr: "Descendants de Jadis ibn 'Abir qui ont marché jusqu'à al-Yamama — l'une des tribus mères arabes disparues {cite:muruj-al-dhahab p. 450}."
  ur: "جدیس بن عبیر کی اولاد جنہوں نے یمامہ کی طرف کوچ کیا - معدوم ہونے والے عربی مادری قبائل میں سے ایک۔ 450}۔"
  tr: "Cedis ibn Ebir ibn Aram ibn Sam ibn Nuh, oğlu ve onu takip edenlerle birlikte Al-Yamame'ye yerleşene kadar yolculuk etti ve şöyle diyordu: \"Ben Cedis'im ve doğru yolda yürüyenim. Ey helak olmuş Semud, sana canımı feda edeyim!\" Onlar, eski, soyu tükenmiş Arap kabilelerindendi. {kaynak:muruj-al-dhahab s. 450} Sonra Himyar Kralı Hasan, Zarqa' al-Yamame'deki devrilmiş ağaçların hilesiyle onları yok etti; kadınlarını ve çocuklarını esir aldı ve kralları Al-Aswad ibn Ghaffar Tayy'e kaçtı. {kaynak:muruj-al-dhahab s. 455-456}"
  id: "Jadis bin Abir bin Aram bin Sam bin Nuh melakukan perjalanan bersama putranya dan para pengikutnya hingga mereka menetap di Al-Yamamah, dan dia berkata, “Aku adalah Jadis, dan orang yang menempuh jalan yang benar. Semoga jiwaku dikorbankan untukmu, wahai kaum Tsamud yang binasa.” Mereka berasal dari suku-suku Arab kuno yang telah punah. {kutipan:muruj-al-dhahab hlm. 450} Kemudian Raja Hassan dari Himyar memusnahkan mereka setelah tipu daya pohon-pohon yang tercabut di Zarqa’ al-Yamamah, sehingga ia menawan wanita dan anak-anak mereka, dan raja mereka, Al-Aswad bin Ghaffar, melarikan diri ke Tayy. {kutipan:muruj-al-dhahab hlm. 455-456}"
