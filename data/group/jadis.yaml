  ar: "جديس بن عابر بن إرم بن سام بن نوح سار بولده ومن تبعه فنزلوا اليمامة وهو يقول أنا جديس والمسير المسلكا فدتك نفسي يا ثمود المهلكا، وهم من العرب العاربة البائدة {cite:muruj-al-dhahab p. 450}.، ثم أفناهم الملك حسان بحمير بعد خديعة الشجر المقتلع على زرقاء اليمامة، فسبى نساءهم وصبيانهم وهرب ملكهم الأسود بن غفار إلى طيء {cite:muruj-al-dhahab p. 455-456}"
  en: "Descendants of Jadis ibn 'Abir who marched to al-Yamama — one of the vanished Arabic mother-tribes {cite:muruj-al-dhahab p. 450}."
