label: { ar: "قناة تربية السنة", en: "Tarbiyah Sunnah Channel", ur: "تربیۃ السنہ چینل", es: "Canal Tarbiyah Sunnah", fr: "Chaîne Tarbiyah Sunnah", tr: "Sünnet Eğitim Kanalı", id: "Saluran Pendidikan Sunnah" }
summary:
  ar: "قناة كاجيان إندونيسية مقرّها باندونغ على يوتيوب (@tarbiyahsunnahchannel)، تنشرها مؤسسة تربية السنة وتحمل جلسات دراسة لمعلّمين عدة من دائرة المؤسسة؛ بلغ عدد مشتركيها 198,000 مشترك بحسب عدّاد vidIQ كما في 15 نوفمبر 2026. لم يُثبَّت مقدّم-مشغّل فرد لها في أي مصدر قُرئ، فالناشر المسمّى هو المؤسسة، واسم القناة وصف ذاتي لا يحسم شيئًا."
  en: "A Bandung-based Indonesian kajian channel on YouTube (@tarbiyahsunnahchannel), published by the Tarbiyah Sunnah foundation and carrying study sessions by several teachers of the foundation's circle; it counted 198,000 subscribers by vidIQ's count as of 15 November 2026. No single presenter-operator could be pinned in any source read, so the named publisher is the foundation; the channel's name is a self-description and settles nothing."
  ur: "بانڈونگ میں قائم انڈونیشی کاجیان یوٹیوب چینل ⁦(@tarbiyahsunnahchannel)⁩، جسے تربیۃ السنہ فاؤنڈیشن شائع کرتی ہے اور جو فاؤنڈیشن کے حلقے کے کئی اساتذہ کے دروس پیش کرتی ہے؛ 15 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 198,000 تھے۔ کسی بھی مأخذ میں کوئی واحد پیش کار-منتظم ثابت نہ ہو سکا، اس لیے نامزد ناشر فاؤنڈیشن ہے؛ چینل کا نام خود-وصف ہے اور کچھ طے نہیں کرتا۔"
  es: "Un canal de kajian indonesio con sede en Bandung en YouTube (@tarbiyahsunnahchannel), publicado por la fundación Tarbiyah Sunnah y que ofrece sesiones de estudio impartidas por varios maestros del círculo de la fundación; contaba con 198.000 suscriptores según el recuento de vidIQ al 15 de noviembre de 2026. No se pudo identificar a ningún presentador u operador en ninguna fuente consultada, por lo que el editor mencionado es la fundación; el nombre del canal es una autodescripción y no aclara nada."
  fr: "Une chaîne YouTube indonésienne basée à Bandung (@tarbiyahsunnahchannel), publiée par la fondation Tarbiyah Sunnah et proposant des sessions d'étude animées par plusieurs enseignants affiliés à la fondation, comptait 198 000 abonnés selon le décompte de vidIQ au 15 novembre 2026. Aucune source consultée ne permet d'identifier précisément l'animateur ou l'opérateur, ce qui confirme que l'éditeur désigné est la fondation; le nom de la chaîne est une simple auto-description et ne permet pas de trancher."
  tr: "Bandung merkezli Kajian kanalı, YouTube'da (@tarbiyahsunnahchannel), Tarbiyah Sunnah Vakfı tarafından yayınlanmaktadır ve Vakfın çevresindeki çeşitli öğretmenlerin derslerini içermektedir; 15 Kasım 2026 itibarıyla vidIQ sayacına göre 198.000 abonesi bulunmaktadır. Okunan hiçbir kaynakta bireysel sunucu-operatör tespit edilmemiştir, yayıncı olarak Vakıf adı geçmektedir ve kanal adı da herhangi bir şeyi açıklığa kavuşturmayan kendi kendini tanımlayan bir isimdir."
  id: "Saluran Kajian, yang berbasis di Bandung, di YouTube (@tarbiyahsunnahchannel), diterbitkan oleh Yayasan Tarbiyah Sunnah dan berisi sesi belajar untuk beberapa guru dari lingkaran Yayasan tersebut; saluran ini memiliki 198.000 pelanggan menurut penghitung vidIQ pada 15 November 2026. Tidak ada presenter-operator individu yang diidentifikasi dalam sumber mana pun yang dibaca, penerbit yang disebutkan adalah Yayasan, dan nama saluran tersebut merupakan deskripsi diri yang tidak menjelaskan apa pun."
