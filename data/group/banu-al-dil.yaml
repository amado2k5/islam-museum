label: { en: "Banu al-Dil", ar: "بنو الديل" }
summary:
  en: "A clan of Banu Bakr ibn Abd Manat ibn Kinana — its leading house, Banu al-Aswad ibn Razn, had been killed by Khuza'a before Islam; in the truce of Hudaybiyya its men under Nawfal ibn Mu'awiya carried out the night attack on al-Watir."
  ar: "بطن من بني بكر بن عبد مناف بن كنانة؛ قتلت خزاعة أشرافهم بني الأسود بن رزن قبل الإسلام، فاغتنموا هدنة الحديبية وبيّتوا خزاعة على الوتير بقيادة نوفل بن معاوية طلبًا للثأر."
