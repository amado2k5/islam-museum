label: { en: "Banu al-Dil", ar: "بنو الديل", es: "Banu al-Dil", fr: "Banu al-Dil", ur: "بنو الدل", tr: "Banu al-Dil", id: "Banu al-Dil" }
summary:
  en: "A clan of Banu Bakr ibn Abd Manat ibn Kinana — its leading house, Banu al-Aswad ibn Razn, had been killed by Khuza'a before Islam; in the truce of Hudaybiyya its men under Nawfal ibn Mu'awiya carried out the night attack on al-Watir."
  ar: "بطن من بني بكر بن عبد مناف بن كنانة؛ قتلت خزاعة أشرافهم بني الأسود بن رزن قبل الإسلام، فاغتنموا هدنة الحديبية وبيّتوا خزاعة على الوتير بقيادة نوفل بن معاوية طلبًا للثأر."
  es: "Un clan de Banu Bakr ibn Abd Manat ibn Kinana —su rama principal, Banu al-Aswad ibn Razn, había sido asesinado por Khuza'a antes del Islam—; en la tregua de Hudaybiyya, sus hombres, bajo el mando de Nawfal ibn Mu'awiya, llevaron a cabo el ataque nocturno contra al-Watir."
  fr: "Un clan de Banu Bakr ibn Abd Manat ibn Kinana — sa branche principale, Banu al-Aswad ibn Razn, avait été tuée par Khuza'a avant l'Islam; dans la trêve de Hudaybiyya, ses hommes sous Nawfal ibn Mu'awiya ont mené l'attaque nocturne sur al-Watir."
  ur: "بنو بکر بن عبد منات ابن کنانہ کا ایک قبیلہ - اس کا سرکردہ گھر، بنو الاسود بن رزن، اسلام سے پہلے خزاعہ کے ہاتھوں قتل ہوا تھا۔ حدیبیہ کی جنگ بندی میں نوفل بن معاویہ کے ماتحت اس کے جوانوں نے الطیر پر رات کو حملہ کیا۔"
  tr: "Banu Bekr ibn Abd Menaf ibn Kinane'nin bir kolu; Khuza'ah, İslam'dan önce soyluları Beni el-Esved ibn Razan'ı öldürdü, bu yüzden el-Hudeybiye ateşkesinden yararlandılar ve intikam almak için Nevfel ibn Mu'awiyah liderliğindeki el-Watir'deki Khuza'ah'a saldırdılar."
  id: "Cabang dari Bani Bakr ibn Abd Manaf ibn Kinanah; Khuza’ah membunuh bangsawan mereka, Banu al-Aswad ibn Razan, sebelum Islam, sehingga mereka memanfaatkan gencatan senjata al-Hudaybiyyah dan menyerang Khuza’ah di al-Watir, dipimpin oleh Naufal ibn Mu’awiyah, untuk membalas dendam."
