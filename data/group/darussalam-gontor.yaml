summary:
  ar: "معهد وجامعة إسلامية في إندونيسيا، يحتفل بمرور تسعين عاماً على إنشائه بحسب الكتاب {cite:rihla-imam-akbar-indonesia-azhar p. 136}. زاره الإمام الأكبر في 25 فبراير 2016م، وأعلن فيه منح 50 منحة دراسية إضافية لطلابه للدراسة بالأزهر، ودشّن فيه مبنى الدراسات العليا بالجامعة {cite:rihla-imam-akbar-indonesia-azhar p. 140}."
  en: "Islamic institute and university in Indonesia, marking 90 years since its founding by the book's count. The Grand Imam visited on 25 February 2016, announced 50 additional Azhar scholarships for its students and opened its postgraduate building."
  es: "Instituto y universidad islámica en Indonesia, que conmemora 90 años desde su fundación según los libros sagrados. El Gran Imán visitó el centro el 25 de febrero de 2016, anunció 50 becas adicionales de Al-Azhar para sus estudiantes e inauguró el edificio de posgrado."
  fr: "L'institut islamique et l'université d'Indonésie célèbrent leurs 90 ans de fondation. Le Grand Imam s'y est rendu le 25 février 2016, a annoncé l'octroi de 50 bourses d'études supplémentaires pour ses étudiants et a inauguré son bâtiment dédié aux études supérieures."
