label:
  ar: "مجمع اللغة العربية الأردني"
  en: "Jordan Academy of Arabic (Majma' al-Lugha al-'Arabiyya al-Urduni)"
  ur: "مجمع اللغۃ العربیہ الاردنی"
  fr: "Académie jordanienne de la langue arabe (Majma' al-Lugha al-'Arabiyya al-Urduni)"
  es: "Academia Jordana de la Lengua Árabe (Majma' al-Lugha al-'Arabiyya al-Urduni)"
  tr: "Ürdün Arapça Dil Akademisi"
  id: "Akademi Bahasa Arab Yordania"
summary:
  ar: "مجمع اللغة العربية الأردني في عمّان، أُنشئ أول مرة قصيراً في 1923-1924 على يد سعيد الكرمي، ثم أُعيد تأسيسه بقانون مؤقت رقم 40 في 1 يوليو 1976، كما يلخص ملف بحث قُدّم للمتحف. يحفظ العربية وينظمها ويعرّب المصطلح التقني والجامعي ويحيي التراث العربي الإسلامي، وله مجلة نصف سنوية ومعاجم واختبار كفاية في العربية."
  en: "The Jordan Academy of Arabic in Amman, first established briefly in 1923-1924 by Sa'id al-Karmi and then re-established by Provisional Law No. 40 on 1 July 1976, as a research summary supplied to the museum gives it. It regulates and preserves Arabic, Arabises technical and university-level terms, revives the Arab-Islamic heritage, and publishes a biannual journal and dictionaries and oversees Arabic proficiency testing."
  ur: "عمّان میں مجمع اللغۃ العربیہ الاردنی، جو پہلے مختصر طور پر 1923-1924ء میں سعید الکرمی کے ہاتھوں قائم ہوا اور پھر 1 جولائی 1976ء کو عارضی قانون نمبر 40 سے دوبارہ قائم کیا گیا، جیسا کہ عجائب گھر کو فراہم کردہ تحقیقی خلاصہ دیتا ہے۔ یہ عربی کو منظم اور محفوظ کرتا ہے، تکنیکی اور جامعاتی اصطلاحات کی تعریب کرتا ہے، عربی اسلامی ورثے کو زندہ کرتا ہے، نیم سالانہ رسالہ اور لغات شائع کرتا ہے اور عربی مہارت کے امتحانات کی نگرانی کرتا ہے۔"
  fr: "L'Académie jordanienne de la langue arabe à Amman, d'abord établie brièvement en 1923-1924 par Sa'id al-Karmi puis rétablie par la loi provisoire n° 40 le 1er juillet 1976, comme le donne une note de recherche fournie au musée. Elle régule et préserve l'arabe, arabise les termes techniques et universitaires, ravive le patrimoine arabo-islamique, publie une revue semestrielle et des dictionnaires et supervise les tests de maîtrise de l'arabe."
  es: "La Academia Jordana de la Lengua Árabe en Amán, establecida primero brevemente en 1923-1924 por Sa'id al-Karmi y restablecida luego por la Ley Provisional n.º 40 el 1 de julio de 1976, según un resumen de investigación entregado al museo. Regula y preserva el árabe, arabiza los términos técnicos y universitarios, revive el patrimonio árabe-islámico, publica una revista semestral y diccionarios y supervisa las pruebas de competencia en árabe."
  tr: "Amman'daki Ürdün Arap Dili Akademisi, ilk olarak 1923-1924 yıllarında Said el-Karmi tarafından kısa bir süreliğine kurulmuş, daha sonra müzeye sunulan bir araştırma dosyasında özetlendiği üzere, 1 Temmuz 1976'da 40 numaralı Geçici Kanun ile yeniden kurulmuştur. Akademi, Arap dilini korumak ve düzenlemek, teknik ve akademik terminolojiyi Arapçaya çevirmek ve Arap-İslam mirasını canlandırmakla görevlidir. İki yılda bir yayınlanan bir dergi, sözlükler ve Arapça yeterlilik sınavı çıkarmaktadır."
  id: "Akademi Bahasa Arab Yordania di Amman pertama kali didirikan secara singkat pada tahun 1923-1924 oleh Said al-Karmi, dan kemudian didirikan kembali oleh Undang-Undang Sementara No. 40 pada tanggal 1 Juli 1976, sebagaimana diringkas dalam berkas penelitian yang diserahkan ke museum. Akademi ini melestarikan dan mengatur bahasa Arab, mengarabkan terminologi teknis dan akademis, serta menghidupkan kembali warisan Arab-Islam. Akademi ini menerbitkan jurnal dua tahunan, kamus, dan tes kemampuan berbahasa Arab."
