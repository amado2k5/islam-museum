id: group/chishtiyya
class: group
kind: order
label:
  ar: الطريقة الجشتية
  en: The Chishti order (Chishtiyya)
  ur: چشتیہ طریقہ
  es: "La orden Chishti (Chishtiyya)"
  fr: "L'ordre Chishti (Chishtiyya)"
  tr: "Çişti Metodu"
  id: "Metode Chishti"
summary:
  ar: "الطريقة الجشتية من أعظم طرق الصوفية في جنوب آسيا، تنسب إلى جشت بخراسان وانتشرت في الهند حتى صارت من أوسع طرقها {cite:trimingham-sufi-orders-1998}."
  en: "The Chishti order is among the greatest Sufi orders of South Asia, traced to Chisht in Khurasan and spread through India until it became among its widest orders {cite:trimingham-sufi-orders-1998}."
  es: "La orden Chishti se encuentra entre las órdenes sufíes más importantes del sur de Asia, con orígenes en Chisht en Jorasán y extendida por toda la India hasta convertirse en una de las órdenes más extensas {cite:trimingham-sufi-orders-1998}."
  fr: "L'ordre Chishti est parmi les plus grands ordres soufis d'Asie du Sud, originaire de Chisht au Khorasan et répandu à travers l'Inde jusqu'à devenir l'un des ordres les plus importants {cite:trimingham-sufi-orders-1998}."
  ur: "چشتی ترتیب جنوبی ایشیا کے سب سے بڑے صوفی حکموں میں سے ہے، جس کا سراغ خراسان کے چشت میں پایا جاتا ہے اور ہندوستان میں اس وقت تک پھیلتا ہے جب تک کہ یہ اس کے وسیع تر احکامات میں شامل نہ ہو گیا۔"
  tr: "Çişti tarikatı, Güney Asya'nın en büyük Sufi tarikatlarından biridir. Horasan'da Çişt'e atfedilir ve Hindistan'da yayılarak en geniş tarikatlardan biri haline gelmiştir. {cite:trimingham-sufi-orders-1998}"
  id: "Tarekat Chishti adalah salah satu tarekat Sufi terbesar di Asia Selatan. Tarekat ini dikaitkan dengan Chisht di Khorasan dan menyebar di India hingga menjadi salah satu tarekat terluas di negara tersebut {cite:trimingham-sufi-orders-1998}."
