summary:
  ar: "الطريقة الجشتية من أعظم طرق الصوفية في جنوب آسيا، تنسب إلى جشت بخراسان وانتشرت في الهند حتى صارت من أوسع طرقها {cite:trimingham-sufi-orders-1998}."
  en: "The Chishti order is among the greatest Sufi orders of South Asia, traced to Chisht in Khurasan and spread through India until it became among its widest orders {cite:trimingham-sufi-orders-1998}."
  es: "La orden Chishti se encuentra entre las órdenes sufíes más importantes del sur de Asia, con orígenes en Chisht en Jorasán y extendida por toda la India hasta convertirse en una de las órdenes más extensas {cite:trimingham-sufi-orders-1998}."
