summary:
  ar: "جراوة من زناتة، قوم الكاهنة الداهية التي ملكت في البربر وبايعوها وجاهدوا تحت رايتها أهل المغرب حتى هزمهم حسان بن النعمان وقتلها، ونقلهم حماد بن بلكين من المغرب فأنزلهم بمدينة القلعة التي اختطها فكانوا من عدة دولته وأهلها."
  en: "Jarawa of the Zanata, the people of al-Kahina 'the seeress' who ruled among the Berbers — they gave her bay'a and fought under her banner against Hassan ibn al-Nu'man until her fall; Hammad ibn Buluggin later moved them west and settled them in his new fortress-city of the Qal'a, where they formed part of its host."
