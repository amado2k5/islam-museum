summary:
  ar: "جراوة من زناتة، قوم الكاهنة الداهية التي ملكت في البربر وبايعوها وجاهدوا تحت رايتها أهل المغرب حتى هزمهم حسان بن النعمان وقتلها، ونقلهم حماد بن بلكين من المغرب فأنزلهم بمدينة القلعة التي اختطها فكانوا من عدة دولته وأهلها."
  en: "Jarawa of the Zanata, the people of al-Kahina 'the seeress' who ruled among the Berbers — they gave her bay'a and fought under her banner against Hassan ibn al-Nu'man until her fall; Hammad ibn Buluggin later moved them west and settled them in his new fortress-city of the Qal'a, where they formed part of its host."
  es: "Los Jarawa de Zanata, el pueblo de al-Kahina 'la vidente' que gobernó entre los bereberes, le rindieron juramento de lealtad (bay'a) y lucharon bajo su estandarte contra Hassan ibn al-Nu'man hasta su caída; Hammad ibn Buluggin los trasladó más tarde hacia el oeste y los asentó en su nueva ciudad fortaleza de Qal'a, donde formaron parte de su ejército."
  fr: "Les Jarawa de Zanata, le peuple d'al-Kahina « la voyante » qui régnait parmi les Berbères — ils lui prêtèrent allégeance et combattirent sous sa bannière contre Hassan ibn al-Nu'man jusqu'à sa chute; Hammad ibn Buluggin les déplaça plus tard vers l'ouest et les installa dans sa nouvelle ville-forteresse de Qal'a, où ils formèrent une partie de son armée."
