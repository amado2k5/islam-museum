label: { ar: "البرامكة", en: "Barmakids", es: "Barmakids", fr: "Barmakids", ur: "برمکڈز", tr: "Barmenler", id: "Para Barmakids" }
summary:
  ar: "البرامكة أسرة فارسية عريقة تنتسب إلى جدها برمك وهو لقب أطلق على سادن معبد النوبهار في مدينة بلخ؛ برز منها في أوائل عهد الخلافة العباسية خالد بن برمك الذي قلده السفاح ديوان الخراج وديوان الجند وتولى وزارة التنفيذ بعد مصرع أبي سلمة الخلال وعمل مستشاراً للمنصور وظلت له مكانته في عهد المهدي، ثم ولده يحيى الذي قلده الرشيد وزارة التفويض ومنحه سلطات مطلقة فكانت الدواوين كلها بيده وهو أول من أمر الوزراء، وأدار يحيى بمساعدة ولديه الفضل وجعفر دولة الخلافة سبعة عشر عاماً ⁦(١٧٠-١٨٧هـ)⁩ وهي فترة تألق البرامكة وعصرهم الذهبي؛ وتوزعت المناصب الكبرى بين أفراد الأسرة حتى قتل الرشيد جعفراً في أول ليلة من صفر سنة ١٨٧هـ وسجن يحيى وبقية أبنائه وصادر ممتلكاتهم، فمات يحيى سنة ١٩٠هـ والفضل سنة ١٩٣هـ، ويرى طقّوش أن فكرة الثأر لمقتل أبي مسلم قد اتخذت منهجاً جديداً هو السيطرة على دولة الخلافة من الداخل بعد فشل النيل منها من الخارج {cite:tarikh-dawla-abbasiyya-taqqush p. 96-100}. وأظهر البرامكة ميولاً سياسية نحو الطالبيين وارتبط تاريخهم بتعاطفهم مع يحيى بن عبد الله العلوي وأحمد بن عيسى بن زيد {cite:tarikh-dawla-abbasiyya-taqqush p. 100}."
  en: "The Barmakids — the Persian vizierial dynasty from Balkh's Nawbahar shrine; from Khalid under al-Saffah through Yahya's seventeen-year golden age to the nakba of 187 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 96-100}."
  es: "Los Barmakids — la dinastía vizial persa del santuario de Nawbahar de Balkh; desde Khalid bajo al-Saffah, pasando por la edad de oro de diecisiete años de Yahya, hasta la nakba del 187 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 96-100}."
  fr: "Les Barmakids — la dynastie viziriale perse du sanctuaire de Nawbahar de Balkh; de Khalid sous al-Saffah à l'âge d'or de dix-sept ans de Yahya jusqu'à la nakba de 187 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 96-100}."
  ur: "برمکیڈس — بلخ کے مزارِ نوبہار سے فارسی وزیری خاندان؛ خالد انڈر الصفح سے لے کر یحییٰ کے سترہ سالہ سنہری دور سے لے کر 187 ہجری کے نقبہ تک۔ 96-100}۔"
  tr: "Barmakîler, soylarını Belh şehrindeki Nevbahar tapınağının koruyucusu Barmak'a kadar uzanan eski bir Pers ailesidir. Aralarında Abbasi Halifeliğinin ilk dönemlerinde ortaya çıkan Halid ibn Barmak, el-Saffah tarafından Divan el-Haraj ve Divan el-Cund'a atanmış ve Ebu Salama el-Hallal'ın ölümünden sonra İdam Bakanlığını üstlenmiştir. El-Mansur'a danışmanlık yapmış ve el-Mehdi döneminde de bu görevini sürdürmüştür. Ardından oğlu Yahya, el-Raşid tarafından Vekalet Bakanlığına atanmış ve ona mutlak yetkiler verilmiştir; böylece tüm Divanlar onun elinde olmuş ve bakanlara komuta eden ilk kişi olmuştur. Yahya, iki oğlu el-Fadl ve Cafer'in yardımıyla on yedi yıl (170-187 Hicri) boyunca Halifeliği yönetmiş, bu dönem Barmakîlerin parlak ve altın çağı olmuştur. Önemli makamlar, 187 Hicri yılının Safer ayının ilk gecesinde el-Raşid'in Cafer'i öldürmesine, Yahya ve diğer oğullarını hapse atmasına ve mallarına el koymasına kadar aile üyeleri arasında dağıtılmıştı. Yahya 190 Hicri yılında, el-Fadl ise 193 Hicri yılında vefat etti. Takqush, Ebu Müslim'in öldürülmesinin intikamını alma fikrinin yeni bir yaklaşım benimsediğine inanır: halifeliği dışarıdan zayıflatma girişimleri başarısız olduktan sonra içeriden kontrol altına almak (kaynak: tarikh-dawla-abbasiyya-taqqush s. 96-100). Barmakidler, Alidlere karşı siyasi eğilimler göstermiş ve tarihleri, Yahya ibn Abdullah el-Alavi ve Ahmed ibn İsa ibn Zeyd'e olan sempatileriyle bağlantılıdır (kaynak: tarikh-dawla-abbasiyya-taqqush s. 100)."
  id: "Keluarga Barmakid adalah keluarga Persia kuno yang menelusuri garis keturunannya kembali ke leluhurnya, Barmak, sebuah gelar yang diberikan kepada penjaga kuil Nawbahar di kota Balkh. Di antara mereka muncul pada masa awal Kekhalifahan Abbasiyah, Khalid ibn Barmak, yang diangkat oleh al-Saffah ke Diwan al-Kharaj dan Diwan al-Jund, dan yang memegang jabatan Menteri Eksekusi setelah kematian Abu Salama al-Khallal. Ia bekerja sebagai penasihat al-Mansur dan mempertahankan posisinya selama pemerintahan al-Mahdi. Kemudian putranya, Yahya, yang diangkat oleh al-Rashid ke Kementerian Delegasi dan diberi kekuasaan mutlak, sehingga semua Diwan berada di tangannya, dan dialah yang pertama kali memimpin para menteri. Yahya, dengan bantuan kedua putranya, al-Fadl dan Ja'far, mengelola Kekhalifahan selama tujuh belas tahun (170-187 H), yang merupakan periode kejayaan dan zaman keemasan keluarga Barmakid. Jabatan-jabatan penting didistribusikan di antara anggota keluarga hingga al-Rashid membunuh Ja'far pada malam pertama Safar tahun 187 H, memenjarakan Yahya dan putra-putranya yang lain, dan menyita harta mereka. Yahya meninggal pada tahun 190 H dan al-Fadl pada tahun 193 H. Taqqush berpendapat bahwa gagasan untuk membalaskan dendam atas pembunuhan Abu Muslim mengambil pendekatan baru: mengendalikan kekhalifahan dari dalam setelah gagal melemahkannya dari luar (kutip:tarikh-dawla-abbasiyya-taqqush hlm. 96-100). Dinasti Barmakid menunjukkan kecenderungan politik terhadap Dinasti Alid, dan sejarah mereka terkait dengan simpati mereka terhadap Yahya ibn Abdullah al-Alawi dan Ahmad ibn Isa ibn Zayd (kutip:tarikh-dawla-abbasiyya-taqqush hlm. 100)."
