label: { ar: "البرامكة" }
summary:
  ar: "البرامكة أسرة فارسية عريقة تنتسب إلى جدها برمك وهو لقب أطلق على سادن معبد النوبهار في مدينة بلخ؛ برز منها في أوائل عهد الخلافة العباسية خالد بن برمك الذي قلده السفاح ديوان الخراج وديوان الجند وتولى وزارة التنفيذ بعد مصرع أبي سلمة الخلال وعمل مستشاراً للمنصور وظلت له مكانته في عهد المهدي، ثم ولده يحيى الذي قلده الرشيد وزارة التفويض ومنحه سلطات مطلقة فكانت الدواوين كلها بيده وهو أول من أمر الوزراء، وأدار يحيى بمساعدة ولديه الفضل وجعفر دولة الخلافة سبعة عشر عاماً (١٧٠-١٨٧هـ) وهي فترة تألق البرامكة وعصرهم الذهبي؛ وتوزعت المناصب الكبرى بين أفراد الأسرة حتى قتل الرشيد جعفراً في أول ليلة من صفر سنة ١٨٧هـ وسجن يحيى وبقية أبنائه وصادر ممتلكاتهم، فمات يحيى سنة ١٩٠هـ والفضل سنة ١٩٣هـ، ويرى طقّوش أن فكرة الثأر لمقتل أبي مسلم قد اتخذت منهجاً جديداً هو السيطرة على دولة الخلافة من الداخل بعد فشل النيل منها من الخارج {cite:tarikh-dawla-abbasiyya-taqqush p. 96-100}. وأظهر البرامكة ميولاً سياسية نحو الطالبيين وارتبط تاريخهم بتعاطفهم مع يحيى بن عبد الله العلوي وأحمد بن عيسى بن زيد {cite:tarikh-dawla-abbasiyya-taqqush p. 100}."
  en: "The Barmakids — the Persian vizierial dynasty from Balkh's Nawbahar shrine; from Khalid under al-Saffah through Yahya's seventeen-year golden age to the nakba of 187 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 96-100}."
