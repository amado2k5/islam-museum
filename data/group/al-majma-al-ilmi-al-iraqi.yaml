summary:
  ar: "المجمع العلمي العراقي في بغداد، ثالث المجامع اللغوية العربية، أُنشئ سنة 1947 كما يلخص ملف بحث قُدّم للمتحف. كان محمد رضا الشبيبي أول رئيس له، ومن أعضائه الأوائل أحمد سوسة ومحمد بهجة الأثري، ويعمل على تطوير العربية وضبطها ووضع المصطلح العلمي وإصدار مجلة، وفيه منذ 1963 مجمعان للكردية والسريانية."
  en: "The Iraqi Academy of Sciences in Baghdad, the third Arabic language academy, founded in 1947 as a research summary supplied to the museum gives it. Muhammad Rida al-Shabibi was its first president and Ahmad Sousa and Muhammad Bahjat al-Athari among its early members; it works to develop and regulate Arabic, coin scientific terms and publish a journal, and since 1963 has had departments for Kurdish and Syriac."
  ur: "بغداد میں المجمع العلمی العراقی، تیسرا عربی لسانی مجمع، جو 1947ء میں قائم ہوا، جیسا کہ عجائب گھر کو فراہم کردہ تحقیقی خلاصہ بتاتا ہے۔ محمد رضا الشبیبی اس کے پہلے صدر تھے اور احمد سوسہ اور محمد بہجت الاثری ابتدائی ارکان میں تھے؛ یہ عربی کی ترقی اور ضبط، علمی اصطلاح سازی اور رسالے کی اشاعت کرتا ہے، اور 1963ء سے اس میں کردی اور سریانی کے شعبے ہیں۔"
  fr: "L'Académie irakienne des sciences à Bagdad, troisième académie de la langue arabe, fondée en 1947 comme le donne une note de recherche fournie au musée. Muhammad Rida al-Shabibi en fut le premier président, Ahmad Sousa et Muhammad Bahjat al-Athari comptant parmi ses premiers membres ; elle travaille à développer et réguler l'arabe, créer des termes scientifiques et publier une revue, et possède depuis 1963 des départements de kurde et de syriaque."
  es: "La Academia Iraquí de Ciencias en Bagdad, tercera academia de la lengua árabe, fundada en 1947 según un resumen de investigación entregado al museo. Muhammad Rida al-Shabibi fue su primer presidente y Ahmad Sousa y Muhammad Bahjat al-Athari figuran entre sus primeros miembros; trabaja en desarrollar y regular el árabe, acuñar términos científicos y publicar una revista, y desde 1963 tiene departamentos de kurdo y siríaco."
  tr: "Müzeye sunulan bir araştırma dosyasında özetlendiği üzere, Arap dili akademilerinin üçüncüsü olan Bağdat'taki Irak Bilimler Akademisi 1947 yılında kurulmuştur. İlk başkanı Muhammed Rıza el-Şabibi olup, ilk üyeleri arasında Ahmed Susa ve Muhammed Bahjat el-Athari de bulunmaktadır. Akademi, Arap dilini geliştirmek ve standartlaştırmak, bilimsel terminoloji oluşturmak ve bir dergi yayınlamak için çalışmaktadır. 1963'ten beri Kürtçe ve Süryanice akademilerini de içermektedir."
  id: "Akademi Ilmu Pengetahuan Irak di Baghdad, akademi bahasa Arab ketiga, didirikan pada tahun 1947, sebagaimana diringkas dalam berkas penelitian yang diserahkan ke museum. Presiden pertamanya adalah Muhammad Rida al-Shabibi, dan di antara anggota awalnya adalah Ahmad Susa dan Muhammad Bahjat al-Athari. Akademi ini berupaya mengembangkan dan menstandarisasi bahasa Arab, menetapkan terminologi ilmiah, dan menerbitkan jurnal. Sejak tahun 1963, akademi ini juga mencakup akademi untuk bahasa Kurdi dan Suriah."
