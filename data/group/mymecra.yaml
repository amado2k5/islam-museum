  source: "Built on 16 November 2026 in wave 203 section C from the harvest file islam-museum-modern-figures-harvest-wave203-sliceA-2026-11-16.md, group entry 5, and build-time reads the same day. vidIQ stated, as of 16 November 2026, 1,270,000 subscribers, 310,978,876 total views and 2,123 videos for @mymecra, and dates the channel's start to 16 July 2020 with its channel country set to Türkiye. The channel itself, read at build, presents itself as MY Media, principled and entertaining, protecting the family structure and attaching importance to culture and art and to education, and its video descriptions link mymecra.com and its social accounts under the name mymecra; its programmes as listed by vidIQ and the channel include the HâsılıKelâm conversations and the Biri Bir Gün series fronted by Serdar Tuncer and series by other presenters, so the channel is a multi-presenter operation. The KÜRE Encyclopedia entry on Serdar Tuncer, read at build, states that in 2020 he launched his YouTube channel MyMecra; Tuncer is therefore named in prose as the channel's launcher and best-known face, but NO relation is written to him in either direction, per the lane's siyer-tv precedent, and his own channel's audience is not credited to this group. No Wikipedia article for MyMecra and no Wikidata item for it were verified at build on 16 November 2026 — searches of Wikipedia and of Wikidata returned no article or item for it — and that absence is recorded here rather than left blank. The harvest's designation screen for this group returned PASS. De-duplicated against the tree: no group/mymecra existed."
