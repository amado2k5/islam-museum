summary:
  ar: "قناة ماي مجرا على يوتيوب ⁦(@mymecra)⁩، وهي قناة إعلامية تركية تقدّم نفسها باسم MY Media وتنشر أحاديث ومحاورات في الأسرة والثقافة والشعر والتاريخ والموضوعات الدينية؛ بلغ عدد مشتركيها 1,270,000 مشترك وعدد مشاهداتها 310,978,876 مشاهدة في 2,123 مقطعًا بحسب عدّاد vidIQ كما في 16 نوفمبر 2026. تذكر موسوعة «كوره» أن سردار تونجر أطلق قناة ماي مجرا على يوتيوب سنة 2020، وهو أشهر وجوهها، ويُذكر ذلك في النثر فقط ولا تُكتب أي علاقة له بها في هذا السجل."
  en: "The MyMecra YouTube channel (@mymecra), a Turkish media channel presenting itself as MY Media and publishing talks and conversations on family, culture, poetry, history and religious topics; it counted 1,270,000 subscribers, 310,978,876 views and 2,123 videos by vidIQ's count as of 16 November 2026. The KÜRE Encyclopedia states that Serdar Tuncer launched the MyMecra YouTube channel in 2020, and he is its best-known face; that association is stated in prose only and no relation to him is written in this record."
  ur: "مائی مجرا کی یوٹیوب چینل ⁦(@mymecra)⁩، ایک ترک میڈیا چینل جو خود کو MY Media کے نام سے پیش کرتی ہے اور خاندان، ثقافت، شاعری، تاریخ اور دینی موضوعات پر گفتگوئیں اور مکالمے شائع کرتی ہے؛ 16 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 1,270,000، ویوز 310,978,876 اور ویڈیوز 2,123 تھیں۔ کوره انسائیکلوپیڈیا بتاتی ہے کہ سردار تونجر نے 2020ء میں مائی مجرا یوٹیوب چینل شروع کیا، اور وہ اس کا سب سے معروف چہرہ ہے؛ یہ نسبت صرف نثر میں بیان کی گئی ہے اور اس ریکارڈ میں اس سے کوئی رشتہ نہیں لکھا گیا۔"
  es: "El canal de YouTube MyMecra (@mymecra), un canal de medios turco que se presenta como MY Media y publica charlas y conversaciones sobre familia, cultura, poesía, historia y temas religiosos, contaba con 1.270.000 suscriptores, 310.978.876 visualizaciones y 2.123 vídeos según el recuento de vidIQ al 16 de noviembre de 2026. La enciclopedia KÜRE afirma que Serdar Tuncer lanzó el canal de YouTube MyMecra en 2020 y es su rostro más conocido; dicha asociación se menciona solo en prosa y no se escribe ninguna relación con él en este registro."
