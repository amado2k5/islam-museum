  ar: "فرسان فارسيون دخلوا في الإسلام جملة زمن الفتح؛ عند البلاذري كانوا مقيمين بإزاء الديلم فلما غشيهم المسلمون بقزوين أسلموا على مثل ما أسلم عليه أساورة البصرة وأتوا الكوفة فأقاموا بها ودخل فيهم من سيّره زياد من حمراء ديلم إلى البصرة."
  en: "Persian cavalrymen who entered Islam en bloc at the conquest; in al-Baladhuri they lived opposite Daylam and converted when the Muslims came to Qazwin on the terms of Basra's asawira, then settled at Kufa, joined there by those of Hamra' Daylam whom Ziyad moved to Basra."
