id: group/asawira
class: group
kind: tribe
label: { ar: "الأساورة", en: "the Asawira", es: "el Asawira", fr: "l'Asawira", ur: "اساویرا" }
summary:
  ar: "فرسان فارسيون دخلوا في الإسلام جملة زمن الفتح؛ عند البلاذري كانوا مقيمين بإزاء الديلم فلما غشيهم المسلمون بقزوين أسلموا على مثل ما أسلم عليه أساورة البصرة وأتوا الكوفة فأقاموا بها ودخل فيهم من سيّره زياد من حمراء ديلم إلى البصرة."
  en: "Persian cavalrymen who entered Islam en bloc at the conquest; in al-Baladhuri they lived opposite Daylam and converted when the Muslims came to Qazwin on the terms of Basra's asawira, then settled at Kufa, joined there by those of Hamra' Daylam whom Ziyad moved to Basra."
  es: "Jinetes persas que se convirtieron al Islam en bloque tras la conquista; en al-Baladhuri vivían frente a Daylam y se convirtieron cuando los musulmanes llegaron a Qazwin en virtud del acuerdo de asawira de Basora, para luego establecerse en Kufa, donde se les unieron los de Hamra' Daylam a quienes Ziyad trasladó a Basora."
  fr: "Cavaliers persans qui entrèrent dans l'Islam en bloc lors de la conquête; à al-Baladhuri, ils vivaient en face de Daylam et se convertirent lorsque les musulmans arrivèrent à Qazwin aux termes de l'asawira de Basra, puis s'installèrent à Kufa, rejoints là par ceux de Hamra' Daylam que Ziyad déplaça à Basra."
  ur: "فارسی گھڑ سوار جو فتح کے وقت اسلام میں داخل ہوئے؛ البلادوری میں دیلم کے مقابل رہتے تھے اور جب مسلمان بصرہ کے اساویرہ کی شرائط پر قزوین پہنچے تو کوفہ میں آباد ہوئے، وہاں حمرا دیلم کے وہ لوگ شامل ہوئے جن سے زیاد بصرہ چلا گیا تھا۔"
