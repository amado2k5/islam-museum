summary:
  ar: "بطن من بكر بن وائل بن قاسط من ولد قيس بن ثعلبة، أوسع بطون بكر وأشهرها في الفتوح والإدارة؛ منه المثنى بن حارثة الشيباني فاتح العراق الأول، ومنه معظم أمراء بكر {cite:tarikh-al-tabari}."
  en: "A batn of Bakr ibn Wa'il from Qays ibn Tha'laba — the widest and most famous Bakr clan in the conquests; from it al-Muthanna ibn Haritha, the first conqueror of Iraq, and most of Bakr's emirs {cite:tarikh-al-tabari}."
  ur: "بکر بن وائل کا وسیع بطن قیس بن ثعلبہ — عراق کی فتح کا پہلا سردار مثنی بن حارثہ اسی خاندان سے۔"
  es: "Un batn de Bakr ibn Wa'il de Qays ibn Tha'laba, el clan Bakr más extenso y famoso en las conquistas; de él al-Muthanna ibn Haritha, el primer conquistador de Irak, y la mayoría de los emires de Bakr {cite:tarikh-al-tabari}."
  fr: "Une branche de Bakr ibn Wa'il issue de Qays ibn Tha'laba — le clan Bakr le plus large et le plus célèbre des conquêtes; de lui est issu al-Muthanna ibn Haritha, le premier conquérant d'Irak, et la plupart des émirs de Bakr {cite:tarikh-al-tabari}."
  tr: "Bakr ibn Wael ibn Qasit'in bir kolu olup, Qais ibn Tha'labah'ın soyundan gelmektedir ve fetihler ve yönetimde Bakr kollarının en büyük ve en ünlüsüdür; Irak'ın ilk fatihi Al-Muthanna ibn Haritha Al-Shaybani de bu koldan çıkmıştır ve Bakr prenslerinin çoğu da bu koldan gelmiştir. {Kaynak:tarikh-al-tabari}"
  id: "Cabang Bakr ibn Wael ibn Qasit, dari keturunan Qais ibn Tha’labah, cabang Bakr terbesar dan paling terkenal dalam penaklukan dan pemerintahan; darinya lahirlah Al-Muthanna ibn Haritha Al-Shaybani, penakluk pertama Irak, dan darinya pula sebagian besar pangeran Bakr berasal {cite:tarikh-al-tabari}."
