summary:
  ar: "العرب، الجماعات الناطقة بالعربية المنحدرة أصلاً من الجزيرة العربية؛ جمع المسعودي في مروج الذهب أنسابهم وملوكهم القدماء. بطاقة أولية وردت من وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩ ولم تُراجع على صفحات المصدر بعد."
  en: "The Arabs — the Arabic-speaking peoples originally of the Arabian Peninsula, whose genealogies and early kings al-Mas'udi gathers in Muruj al-Dhahab. Draft card from an open reference description (Wikidata); not yet checked on the source page."
  es: "Los árabes —los pueblos de habla árabe originarios de la península arábiga, cuyas genealogías y primeros reyes al-Mas'udi recopila en Muruj al-Dhahab. Boceto de ficha a partir de una descripción de referencia abierta (Wikidata); aún no verificado en la página de origen."
  fr: "Les Arabes — les peuples arabophones originaires de la péninsule arabique, dont al-Mas'udi rassemble les généalogies et les premiers rois dans son ouvrage Muruj al-Dhahab. Fiche provisoire issue d'une description de référence ouverte (Wikidata); non encore vérifiée sur la page source."
  ur: "عرب - عربی بولنے والے لوگ اصل میں جزیرہ نما عرب کے ہیں، جن کے نسب اور ابتدائی بادشاہ المسعودی مروج الذہب میں جمع ہوتے ہیں۔ ایک کھلے حوالہ کی تفصیل سے ڈرافٹ کارڈ ⁦(وکی ڈیٹا)⁩؛ ابھی تک سورس پیج پر چیک نہیں کیا گیا۔"
  tr: "Araplar, aslen Arap Yarımadası'ndan gelen Arapça konuşan gruplardır; El-Mas'udi, *Altın Çayırlar* adlı eserinde onların soyağaçlarını ve eski krallarını derlemiştir. Bu, açık bir referanstan (Wikidata) alınan ön bir giriştir ve kaynak sayfalarında henüz incelenmemiştir."
  id: "Bangsa Arab, kelompok berbahasa Arab yang berasal dari Semenanjung Arab; Al-Mas'udi menyusun silsilah dan raja-raja kuno mereka dalam karyanya *Padang Rumput Emas*. Ini adalah entri pendahuluan dari referensi terbuka (Wikidata) dan belum ditinjau di halaman sumber."
