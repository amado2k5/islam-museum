summary:
  ar: "مشروع تلفزيوني دعوي أسسه عدي هداية في نوفمبر 2016 مع هيرو سوكاري وروي وينارتو، وهو الذراع الإعلامية لمعهد كوانتم أخيار الذي أسسه سنة 2013؛ لا توجد قناة يوتيوب مستقلة باسم «أخيار تي في» يمكن تثبيت عدد مشتركيها، فعملية المشروع على يوتيوب هي قناة «عدي هداية الرسمية» ⁦(@adihidayatofficial)⁩ التي بلغ مشتركوها 6,190,000 مشترك بحسب vidIQ كما حُدّث في 10 نوفمبر 2026 — وهذا العدد عدد قناة عدي هداية الرسمية، لا عدد قناة مستقلة لأخيار تي في."
  en: "A dawah television venture founded by Adi Hidayat in November 2016 with Heru Sukari and Roy Winarto, the media arm of the Quantum Akhyar Institute he founded in 2013. Akhyar TV has no standalone YouTube channel with a pinnable count: its YouTube operation is the Adi Hidayat Official channel (@adihidayatofficial), which counted 6,190,000 subscribers by vidIQ's count as updated on 10 November 2026 — that count belongs to Adi Hidayat Official, not to a standalone Akhyar TV channel."
  ur: "ایک دعوتی ٹیلی ویژن منصوبہ جو عدی ہدایت نے نومبر 2016ء میں ہیرو سوکاری اور روئے وینارٹو کے ساتھ قائم کیا، اور یہ ان کے 2013ء میں قائم کردہ کوانٹم اخیار انسٹی ٹیوٹ کا میڈیا بازو ہے۔ اخیار ٹی وی کی کوئی الگ یوٹیوب چینل نہیں جس کے سبسکرائبرز کی تعداد ثابت کی جا سکے: یوٹیوب پر اس منصوبے کی کارروائی عدی ہدایت آفیشل چینل ⁦(@adihidayatofficial)⁩ ہے، جس کے سبسکرائبرز 10 نومبر 2026ء کو اپ ڈیٹ کیے گئے vidIQ کے شمار کے مطابق 6,190,000 تھے — اور یہ تعداد عدی ہدایت آفیشل کی ہے، اخیار ٹی وی کی کسی الگ چینل کی نہیں۔"
