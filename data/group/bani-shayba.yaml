label: {"ar": "بنو شيبة", "en": "Banu Shaybah", "ur": "بنو شیبہ"}
summary:
  ar: "الأسرة القرشية الحافظة لمفتاح الكعبة من قبل الإسلام: لما دخل النبي مكة عام الفتح أخذ عثمان بن طلحة المفتاح فردّه إليه وقال إنها عندكم إلى يوم القيامة لا ينزعها إلا ظالم. يفتح كبيرهم باب الكعبة عند غسلها، ومفاتيح قديمة لهم في المتاحف."
  en: "The Qurashi family that has kept the Kaaba's key since before Islam: when the Prophet entered Mecca at the conquest he took the key from Uthman ibn Talha, then returned it saying it stays with you until the end of time and none but a wrongdoer shall take it. Their senior keeps and opens the Kaaba door at its washing; their old keys sit in museums."
  ur: "بنو شیبہ، قریش کا وہ خاندان جو اسلام سے پہلے سے کعبہ کی چابی کا امین ہے: فتح کے دن نبی کریم نے عثمان بن طلحہ سے چابی لی پھر لوٹا دی اور فرمایا یہ قیامت تک تمہارے پاس رہے گی اور اسے کوئی ظالم ہی چھینے گا؛ ان کے بزرگ غسلِ کعبہ پر دروازہ کھولتے ہیں اور ان کی پرانی چابیاں عجائب گھروں میں ہیں۔"
