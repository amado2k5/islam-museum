label: { ar: "الديصانية", en: "Daysaniyya" }
summary:
  ar: "الديصانية أصحاب ابن ديصان من مذاهب التنوية الكلدانيين عند ابن النديم {cite:fihrist-ibn-al-nadim p. 442,458}. واختلفت الديصانية في اختلاط النور بالظلمة على فرقتين: فرقة زعمت أن النور خالط الظلمة باختياره ليصلحها فلما حصل فيها ورام الخروج امتنع عليه، وفرقة زعمت أن النور أراد أن يرفع الظلمة عنه لما أحس بخشونتها ونتنها فشابكها بغير اختياره، ولابن ديصان كتاب النور والظلمة وكتاب روحانية الحق وكتاب المتحرك والجماد {cite:fihrist-ibn-al-nadim p. 474}"
  en: "The Daysanites among the dualist sects {cite:fihrist-ibn-al-nadim}"
