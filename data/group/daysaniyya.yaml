label: { ar: "الديصانية", en: "Daysaniyya", es: "Daysaniyya", fr: "Daysaniyya", ur: "دنانیہ", tr: "Daysaniyah", id: "Daysaniyah" }
summary:
  ar: "الديصانية أصحاب ابن ديصان من مذاهب التنوية الكلدانيين عند ابن النديم {cite:fihrist-ibn-al-nadim p. 442,458}. واختلفت الديصانية في اختلاط النور بالظلمة على فرقتين: فرقة زعمت أن النور خالط الظلمة باختياره ليصلحها فلما حصل فيها ورام الخروج امتنع عليه، وفرقة زعمت أن النور أراد أن يرفع الظلمة عنه لما أحس بخشونتها ونتنها فشابكها بغير اختياره، ولابن ديصان كتاب النور والظلمة وكتاب روحانية الحق وكتاب المتحرك والجماد {cite:fihrist-ibn-al-nadim p. 474}"
  en: "The Daysanites among the dualist sects {cite:fihrist-ibn-al-nadim}"
  es: "Los Daysanitas entre las sectas dualistas {cite:fihrist-ibn-al-nadim}"
  fr: "Les Daysanites parmi les sectes dualistes {cite:fihrist-ibn-al-nadim}"
  ur: "دوہری فرقوں کے درمیان دیسانی لوگ"
  tr: "İbn Deysan'ın takipçileri olan Deysanîler, İbn el-Nadim'e göre Keldani Tanîler arasındadır (kaynak: Fihrist-ibn-al-nadim, s. 442, 458). Deysanîler, ışık ve karanlığın karışımı konusunda iki gruba ayrılmışlardır: Bir grup, ışığın karanlığı arındırmak için isteyerek onunla karıştığını, ancak içine girip çıkmaya çalıştığında engellendiğini iddia ederken; diğer grup ise ışığın, karanlığın pürüzlülüğünü ve kötü kokusunu hissettiğinde onu kendisinden uzaklaştırmak istediğini ve bu nedenle istemeden onunla karıştığını iddia etmiştir. İbn Deysan, Işık ve Karanlık Kitabı, Hakikat Maneviyatı Kitabı ve Hareket Eden ve Cansız Şeyler Kitabı'nı yazmıştır (kaynak: Fihrist-ibn-al-nadim, s. 474)."
  id: "Menurut Ibn al-Nadim {cite:fihrist-ibn-al-nadim hlm. 442,458}, kaum Daysaniyah, pengikut Ibn Daysan, termasuk dalam kelompok Taniyah Kaldea. Kaum Daysaniyah berbeda pendapat mengenai percampuran cahaya dan kegelapan, terbagi menjadi dua kelompok: satu kelompok mengklaim bahwa cahaya bercampur dengan kegelapan atas kemauan sendiri untuk membersihkannya, tetapi ketika cahaya masuk dan mencoba keluar, ia dicegah; kelompok lain mengklaim bahwa cahaya ingin menghilangkan kegelapan dari dirinya sendiri ketika merasakan kekasaran dan baunya, sehingga bercampur dengannya tanpa sengaja. Ibn Daysan menulis Kitab Cahaya dan Kegelapan, Kitab Spiritualitas Kebenaran, dan Kitab Yang Bergerak dan Yang Mati {cite:fihrist-ibn-al-nadim hlm. 474}."
