label:
  ar: "الأخيّة"
  en: "The Akhi associations of Anatolia (akhism)"
  es: "Las asociaciones Akhi de Anatolia (akhismo)"
  fr: "Les associations Akhi d'Anatolie (akhisme)"
  ur: "اناطولیہ کی اکی انجمنیں ⁦(اکھ ازم)⁩"
  tr: "Kız kardeş"
  id: "Saudari itu"
summary:
  ar: "الأخيّة، جمعيات من الفتيان المنظمين في طوائف حرفية بالأناضول في القرنين السابع والثامن الهجريين ⁦(الثالث عشر والرابع عشر الميلاديين)⁩، تأخذ بمثل الفتوة، وكان أغلب أعضائها من الحرفيين؛ ويرأس كل جماعة «أخي»، وتنتهي الجماعة إلى التأثير في طوائف الأتراك حتى القرن الخامس عشر. {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}"
  en: "The Akhi associations were young men's guilds in Anatolia in the 13th and 14th centuries, which took the ideals of futuwwa and recruited mainly craftsmen; each was led by an 'akhi'. Their information fades in the 15th century, but their tradition survives in the Turkish guilds {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}."
  es: "Las asociaciones Akhi eran gremios de jóvenes en Anatolia durante los siglos XIII y XIV, que adoptaron los ideales de la futuwwa y reclutaron principalmente artesanos; cada una estaba dirigida por un 'akhi'. Su información se pierde en el siglo XV, pero su tradición sobrevive en los gremios turcos {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}."
  fr: "Les associations Akhi étaient des guildes de jeunes hommes en Anatolie aux XIIIe et XIVe siècles, qui s'inspiraient des idéaux de la futuwwa et recrutaient principalement des artisans; chacune était dirigée par un « akhi ». Les informations les concernant disparaissent au XVe siècle, mais leur tradition perdure au sein des guildes turques (voir: Encyclopaedia of Islam, vol. 1, p. 343-345)."
  ur: "اکی انجمنیں 13ویں اور 14ویں صدی میں اناطولیہ میں نوجوانوں کی تنظیمیں تھیں، جنہوں نے فتووا کے نظریات کو اپنایا اور بنیادی طور پر کاریگروں کو بھرتی کیا۔ ہر ایک کی قیادت ایک 'اکھی' کر رہی تھی۔ ان کی معلومات 15ویں صدی میں ختم ہو جاتی ہیں، لیکن ان کی روایت ترک تنظیموں میں زندہ رہتی ہے۔ 1 ص۔ 343-345}۔"
  tr: "Ahiyye, Hicri 7. ve 8. yüzyıllarda (Miladi 13. ve 14. yüzyıllar) Anadolu'da zanaat loncaları içinde örgütlenmiş genç erkek topluluklarıydı. Şövalyelik ilkelerine bağlıydılar ve çoğunlukla zanaatkarlardan oluşuyorlardı. Her grubun başında bir \"Ahi\" bulunuyordu ve Ahiyye, 15. yüzyıla kadar Türk toplumlarını etkilemeye devam etti. {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}"
  id: "Akhiyya adalah perkumpulan pemuda yang terorganisir dalam serikat pengrajin di Anatolia selama abad ke-7 dan ke-8 Hijriah (abad ke-13 dan ke-14 Masehi). Mereka mengikuti prinsip-prinsip kesatriaan dan sebagian besar terdiri dari para pengrajin. Setiap kelompok dipimpin oleh seorang \"Akhi,\" dan Akhiyya terus memengaruhi komunitas Turki hingga abad ke-15. {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}"
