label:
  ar: "الأخيّة"
  en: "The Akhi associations of Anatolia (akhism)"
summary:
  ar: "الأخيّة، جمعيات من الفتيان المنظمين في طوائف حرفية بالأناضول في القرنين السابع والثامن الهجريين (الثالث عشر والرابع عشر الميلاديين)، تأخذ بمثل الفتوة، وكان أغلب أعضائها من الحرفيين؛ ويرأس كل جماعة «أخي»، وتنتهي الجماعة إلى التأثير في طوائف الأتراك حتى القرن الخامس عشر. {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}"
  en: "The Akhi associations were young men's guilds in Anatolia in the 13th and 14th centuries, which took the ideals of futuwwa and recruited mainly craftsmen; each was led by an 'akhi'. Their information fades in the 15th century, but their tradition survives in the Turkish guilds {cite:encyclopaedia-of-islam-2 vol. 1 p. 343-345}."
