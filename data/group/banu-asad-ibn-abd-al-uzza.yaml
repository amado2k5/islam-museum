summary:
  ar: "بطن من قريش من ولد أسد بن عبد العزى بن قصي، من بيوتات قريش المشرّفة؛ منهم حاطب بن أبي بلتعة والزبير بن العوام بأمه أسماء بنت عبد المطلب بالولاء القربي، وفي هذا البطن وقعت أول بيعة الأنصار تقريباً بدار بني أسد {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "A batn of Quraysh descended from Asad ibn Abd al-Uzza ibn Qusayy — among its names Hatib ibn Abi Balta'a and, through his mother Asma bint Abd al-Muttalib, al-Zubayr ibn al-Awwam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "قریش کا بطن، اسد بن عبد العزی بن قصی کی اولاد — حاطب بن ابی بلتعہ اور والدہ کی طرف سے زبیر بن عوام اسی خاندان سے جڑے۔"
