label: { ar: "بيت الحكمة", en: "Bayt al-Hikma", es: "Bayt al-Hikma", fr: "Bayt al-Hikma", ur: "بیت الحکمہ", tr: "Bilgelik Evi", id: "Rumah Kebijaksanaan" }
summary:
  ar: "خزانة العلم والكتب ببغداد، كان عليها سهل بن هارون صاحب بيت الحكمة ثم سلم، وكان ينسخ فيها للرشيد والمأمون، وكان سلما صاحب بيت الحكمة في جملة من أخرجهم المأمون إلى بلد الروم يجلبون الكتب القديمة {cite:fihrist-ibn-al-nadim p. 339-340,358}. وعند أحمد أمين أن مؤسسها على الظاهر الرشيد وضع نواتها ثم مهاها المأمون وقوّاها، وأن الخزانة محوطة بغموض شديد لم يعثر عليه الباحثون إلا على نتف، وأنها كانت في عهد الرشيد مكاناً فيه كتب وله رئيس وأعوان وفيه تُنسخ الكتب اليونانية والفارسية وتترجم، وأن المأمون راسل ملك الروم يستأذنه في إنفاذ ما يختار من العلوم القديمة المخزونة ببلد الروم فأجابه بعد امتناع، فأخرج له جماعة منهم الحجاج بن مطر وابن البطريق وسلم صاحب بيت الحكمة، وأن المأمون لما هادن صاحب قبرص طلب منه خزانة كتب اليونان المجموعة عندهم في بيت لا يظهر عليه أحد فأرسلها إليه وجعل سهل بن هارون خازناً لها {cite:duha-islam p. 426-427}."
  en: "Baghdad's library-house under Sahl b. Harun then Salman — a node of the translation movement {cite:fihrist-ibn-al-nadim p. 339-340}. Per Ahmad Amin, al-Rashid laid its nucleus and al-Ma'mun expanded it: correspondence with the Byzantine king won permission to fetch the stored ancient sciences, a mission that included al-Hajjaj ibn Matar, Ibn al-Bitriq and Salman of the Bayt al-Hikma; and Cyprus's hidden Greek library came to Baghdad under truce {cite:duha-islam p. 426-427}."
  es: "La biblioteca-casa de Bagdad bajo Sahl b. Harun y luego Salman —un nodo del movimiento de traducción {cite:fihrist-ibn-al-nadim p. 339-340}. Según Ahmad Amin, al-Rashid sentó sus bases y al-Ma'mun la expandió: la correspondencia con el rey bizantino le valió permiso para recuperar las ciencias antiguas almacenadas, una misión que incluyó a al-Hajjaj ibn Matar, Ibn al-Bitriq y Salman de la Bayt al-Hikma; y la biblioteca griega oculta de Chipre llegó a Bagdad bajo una tregua {cite:duha-islam p. 426-427}."
  fr: "La bibliothèque de Bagdad, sous Sahl b. Harun puis Salman, fut un centre névralgique du mouvement de traduction (voir Fihrist ibn al-Nadim, p. 339-340). Selon Ahmad Amin, al-Rashid en posa le noyau et al-Ma'mun l'agrandit: une correspondance avec le roi byzantin permit d'obtenir l'autorisation de récupérer les ouvrages scientifiques antiques qui y étaient conservés, mission à laquelle participèrent al-Hajjaj ibn Matar, Ibn al-Bitriq et Salman de la Bayt al-Hikma; et la bibliothèque grecque cachée de Chypre parvint à Bagdad grâce à une trêve (voir Duha Islam, p. 426-427)."
  ur: "بغداد کا کتب خانہ سہل ب. ہارون پھر سلمان - ترجمے کی تحریک کا ایک نوڈ 339-340}۔ فی احمد امین، الرشید نے اپنا مرکز قائم کیا اور المامون نے اسے بڑھایا: بازنطینی بادشاہ کے ساتھ خط و کتابت کے ذریعے ذخیرہ شدہ قدیم علوم کو حاصل کرنے کی اجازت مل گئی، یہ مشن جس میں بیت الحکمہ کے الحجاج ابن مطر، ابن البطریق اور سلمان شامل تھے۔ اور قبرص کا پوشیدہ یونانی کتب خانہ جنگ بندی کے تحت بغداد آیا۔ 426-427}۔"
  tr: "Bağdat'taki bilgi ve kitap kütüphanesi, önce Bilgelik Evi'nin sahibi Sahl ibn Harun'un, daha sonra da Sallam'ın sorumluluğundaydı. Orada Raşid ve Ma'mun için kitap kopyaları yapardı. Bilgelik Evi'nin sahibi Sallam, Ma'mun'un eski kitapları geri getirmek için Roma topraklarına gönderdiği kişiler arasındaydı. (Kaynak: Fihrist ibn el-Nadim, s. 339-340, 358). Ahmed Amin'e göre, kurucusu Ali el-Zahir el-Raşid temellerini atmış, daha sonra Ma'mun onu güçlendirmiş ve sağlamlaştırmıştır. Kütüphane büyük bir gizemle çevrilidir ve araştırmacılar yalnızca parçalarını bulabilmiştir. Raşid zamanında, bir baş ve yardımcılarıyla birlikte, Yunanca ve Farsça kitapların kopyalanıp tercüme edildiği bir yerdi. Ma'mun, Bizans imparatoruyla yazışarak, Bizans topraklarında saklanan eski bilimlerden dilediği her şeyi kendisine gönderme izni istemiştir. İlk başta bir miktar ret cevabı aldıktan sonra, ona aralarında el-Haccac ibn Matar, İbn el-Batrik ve Bilgelik Evi'nin sahibi Salim'in de bulunduğu bir grup gönderdi. El-Ma'mun Kıbrıs hükümdarıyla barış yaptığında, kimsenin göremeyeceği bir evde toplanmış olan Yunanca kitap kütüphanesini istedi. Kütüphaneyi ona gönderdi ve Sahl ibn Harun'u muhafız olarak atadı. {cite:duha-islam s. 426-427}"
  id: "Perpustakaan ilmu pengetahuan dan buku di Baghdad berada di bawah pengelolaan Sahl ibn Harun, pemilik Baitullah, dan kemudian Sallam. Ia biasa menyalin buku-buku di sana untuk Al-Rashid dan Al-Ma'mun. Sallam, pemilik Baitullah, termasuk di antara orang-orang yang dikirim Al-Ma'mun ke negeri Romawi untuk membawa kembali buku-buku kuno. {cite:fihrist-ibn-al-nadim hlm. 339-340,358}. Menurut Ahmad Amin, pendirinya, Ali al-Zahir al-Rashid, meletakkan fondasinya, kemudian al-Ma'mun memperkuat dan memperkokohnya. Perpustakaan ini diselimuti misteri besar, yang hanya ditemukan fragmen-fragmennya oleh para peneliti. Pada masa al-Rashid, tempat ini merupakan tempat penyimpanan buku, dengan seorang kepala dan asisten, di mana buku-buku Yunani dan Persia disalin dan diterjemahkan. Al-Ma'mun berkorespondensi dengan kaisar Bizantium, meminta izinnya untuk mengirimkan apa pun yang dipilihnya dari ilmu-ilmu kuno yang tersimpan di wilayah Bizantium. Setelah beberapa penolakan awal, ia menanggapi permintaan tersebut dan mengirimkan sekelompok orang, termasuk al-Hajjaj ibn Matar, Ibn al-Batriq, dan Salim, pemilik Rumah Kebijaksanaan. Ketika al-Ma’mun berdamai dengan penguasa Siprus, ia meminta perpustakaan buku-buku Yunani yang dikumpulkan di sebuah rumah yang tersembunyi. Penguasa Siprus mengirimkannya kepadanya dan menunjuk Sahl ibn Harun sebagai penjaganya. {cite:duha-islam hlm. 426-427}"
