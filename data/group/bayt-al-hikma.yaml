label: { ar: "بيت الحكمة", en: "Bayt al-Hikma" }
summary:
  ar: "خزانة العلم والكتب ببغداد، كان عليها سهل بن هارون صاحب بيت الحكمة ثم سلم، وكان ينسخ فيها للرشيد والمأمون، وكان سلما صاحب بيت الحكمة في جملة من أخرجهم المأمون إلى بلد الروم يجلبون الكتب القديمة {cite:fihrist-ibn-al-nadim p. 339-340,358}. وعند أحمد أمين أن مؤسسها على الظاهر الرشيد وضع نواتها ثم مهاها المأمون وقوّاها، وأن الخزانة محوطة بغموض شديد لم يعثر عليه الباحثون إلا على نتف، وأنها كانت في عهد الرشيد مكاناً فيه كتب وله رئيس وأعوان وفيه تُنسخ الكتب اليونانية والفارسية وتترجم، وأن المأمون راسل ملك الروم يستأذنه في إنفاذ ما يختار من العلوم القديمة المخزونة ببلد الروم فأجابه بعد امتناع، فأخرج له جماعة منهم الحجاج بن مطر وابن البطريق وسلم صاحب بيت الحكمة، وأن المأمون لما هادن صاحب قبرص طلب منه خزانة كتب اليونان المجموعة عندهم في بيت لا يظهر عليه أحد فأرسلها إليه وجعل سهل بن هارون خازناً لها {cite:duha-islam p. 426-427}."
  en: "Baghdad's library-house under Sahl b. Harun then Salman — a node of the translation movement {cite:fihrist-ibn-al-nadim p. 339-340}. Per Ahmad Amin, al-Rashid laid its nucleus and al-Ma'mun expanded it: correspondence with the Byzantine king won permission to fetch the stored ancient sciences, a mission that included al-Hajjaj ibn Matar, Ibn al-Bitriq and Salman of the Bayt al-Hikma; and Cyprus's hidden Greek library came to Baghdad under truce {cite:duha-islam p. 426-427}."
