summary:
  ar: "فرقة من الخوارج خالفت سائرهم فزعمت أن الإمامة غير واجب نصبها، ووافقهم أناس من المعتزلة على أن الأمة إذا عدلت ولم يكن فيها فاسق لم تحتج إلى إمام {cite:muruj-al-dhahab p. 210}."
  en: "The Kharijite sect that held appointing an imam not obligatory — some Mu'tazilites agreed a just and sinless community needs none {cite:muruj-al-dhahab p. 210}."
  es: "La secta jariyita que sostenía que nombrar un imán no era obligatorio —algunos mu'tazilitas coincidían en que una comunidad justa y sin pecado no necesita ninguno {cite:muruj-al-dhahab p. 210}."
  fr: "La secte kharijite qui considérait que la nomination d'un imam n'était pas obligatoire — certains mu'tazilites étaient d'accord pour dire qu'une communauté juste et sans péché n'en a pas besoin {cite:muruj-al-dhahab p. 210}."
  ur: "خارجی فرقہ جو کہ امام کی تقرری کو واجب نہیں سمجھتا تھا - کچھ معتزلی اس بات پر متفق تھے کہ ایک عادل اور بے گناہ کمیونٹی کو کسی کی ضرورت نہیں ہے {حوالہ: مروج الذہب ص۔ 210}۔"
  tr: "Haricilerden bir grup, diğerlerinden farklı olarak imamlığın zorunlu olmadığını iddia etti ve Mu'tezile'den bazı kişiler de onlarla aynı fikirde olarak, eğer ümmet adil ise ve içinde ahlaksız kimse yoksa, imama ihtiyaç duymadığını savundu. {Kaynak: Muruj-al-Dhahab s. 210}"
  id: "Sekelompok Kharijites berbeda pendapat dengan yang lain dan menyatakan bahwa pengangkatan Imam tidaklah wajib, dan sebagian dari Mu'tazila setuju dengan mereka bahwa jika suatu umat adil dan tidak ada orang yang tidak bermoral di dalamnya, maka umat tersebut tidak membutuhkan seorang Imam {kutip:muruj-al-dhahab hlm. 210}."
