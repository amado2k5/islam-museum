label:
  ar: هيئة تنظيم ضمان المنتجات الحلال الإندونيسية
  en: Halal Product Assurance Organizing Agency (BPJPH, Halal Indonesia)
  ur: حلال مصنوعات کی ضمانت کی انڈونیشیائی ایجنسی
summary:
  ar: وكالة حكومية إندونيسية بمستوى وزاري تنظّم شهادات الحلال، انفصلت عن وزارة الشؤون الدينية في 2024 خلفا لهيئة ضمان المنتجات
    الحلال التابعة للوزارة، ويرأسها حيكل حسن منذ 22 أكتوبر 2024.
  en: An Indonesian cabinet-level government agency that organises halal certification, spun off from the Ministry of Religious
    Affairs in 2024 to succeed the ministry's halal product assurance body; Haikal Hassan has led it since 22 October 2024.
  ur: انڈونیشیا کی وزارتی درجے کی سرکاری ایجنسی جو حلال سرٹیفکیشن کا انتظام کرتی ہے؛ 2024 میں وزارتِ مذہبی امور سے الگ ہو
    کر بنی؛ 22 اکتوبر 2024 سے حیکل حسن اس کے سربراہ ہیں۔
