label: { ar: "بنو الأحمر", en: "Banu al-Ahmar", es: "Banu al-Ahmar", fr: "Banu al-Ahmar", ur: "بنو الاحمر" }
summary:
  ar: "آخر دول الأندلس بغرناطة؛ أصلهم من أرجونة من حصون قرطبة ويعرفون ببني نصر وينسبون إلى سعد بن عبادة سيد الخزرج، أسسها محمد بن يوسف بن نصر المعروف بابن الأحمر بعد انهيار دولة الموحدين فاستقر بغرناطة سنة 635هـ ودامت دولتهم إلى سقوطها {cite:tarikh-ibn-khaldun-ibar p. 1008}."
  en: "The last Muslim dynasty of al-Andalus at Granada: the Banu Nasr of Arjuna near Cordoba, claimed for Sa'd b. Ubada, founded by Muhammad b. Yusuf Ibn al-Ahmar who settled at Granada 635 after the Almohad collapse {cite:tarikh-ibn-khaldun-ibar p. 1008}."
  es: "La última dinastía musulmana de al-Andalus en Granada: los Banu Nasr de Arjuna cerca de Córdoba, reivindicados por Sa'd b. Ubada, fundada por Muhammad b. Yusuf Ibn al-Ahmar, quien se estableció en Granada en 635 después del colapso almohade {citar:tarikh-ibn-khaldun-ibar p. 1008}."
  fr: "Dernière dynastie musulmane d'al-Andalus à Grenade: les Banu Nasr d'Arjuna près de Cordoue, revendiqués pour Sa'd b. Ubada, fondée par Muhammad b. Yusuf Ibn al-Ahmar qui s'est installé à Grenade 635 après l'effondrement des Almohades {cite:tarikh-ibn-khaldun-ibar p. 1008}."
  ur: "غرناطہ میں اندلس کا آخری مسلمان خاندان: قرطبہ کے قریب ارجنا کے بنو نصر نے سعد بن عباس کے لیے دعویٰ کیا۔ عبادہ، جس کی بنیاد محمد بن نے رکھی تھی۔ یوسف ابن الاحمر جو المحدث کے انہدام کے بعد غرناطہ 635 میں آباد ہوا 1008}۔"
