summary:
  ar: "قناة تلفزيونية دينية ناطقة بالكردية مقرّها السليمانية، أسسها سنة 2013 الداعية عبداللطيف أحمد مصطفى — واسمها من الكردية ئامۆژگاری بمعنى النصيحة — وتبثّ بالسورانية مع قناة صوتية ثانية بالعربية، وتدير مركزًا لتحفيظ القرآن وأكاديمية في السليمانية. بلغ عدد متابعي صفحتها على فيسبوك 1,800,000 متابع بحسب بيانات منشورها المؤرخ في 1 أبريل 2026 كما قرأها حصاد الموجة 199 في 9 نوفمبر 2026. أما قناتها الحالية على يوتيوب فقد بدأت فقط في 25 يناير 2026 وبلغ مشتركوها 7,890 مشتركًا بحسب vidIQ كما في 8 نوفمبر 2026؛ فالمحطة أقدم من القناة، وتأهّلها قائم على جمهورها في فيسبوك لا على يوتيوب."
  en: "A Kurdish-language religious television broadcaster based in Sulaymaniyah, founded in 2013 by the preacher Abdullatif Ahmad Mustafa — its name comes from the Kurdish amozhgari, 'advice' — broadcasting in Sorani, with a second audio channel in Arabic; it also runs a Qur'an memorisation centre and academy in Sulaymaniyah. Its Facebook page counted 1,800,000 followers by the metadata of its post dated 1 April 2026, as read by the wave-199 harvest on 9 November 2026. Its present YouTube channel (@AmozhgaryOfficial) only started on 25 January 2026 and counted just 7,890 subscribers as read by vidIQ on 8 November 2026; the station is older than the channel, and it qualifies on its Facebook audience, not on YouTube."
  ur: "سلیمانیہ میں قائم کردی زبان کا مذہبی ٹیلی ویژن براڈکاسٹر، جسے 2013ء میں واعظ عبداللطیف احمد مصطفیٰ نے قائم کیا — اس کا نام کردی لفظ ئامۆژگاری سے ہے جس کے معنی نصیحت کے ہیں — یہ سورانی میں نشر کرتا ہے اور اس کی دوسری آڈیو چینل عربی میں ہے؛ یہ سلیمانیہ میں قرآن حفظ کا مرکز اور اکیڈمی بھی چلاتا ہے۔ اس کے فیس بک پیج کے فالوور یکم اپریل 2026ء کی پوسٹ کے میٹا ڈیٹا کے مطابق 1,800,000 تھے، جو ویو 199 کے ہارویسٹ نے 9 نومبر 2026ء کو پڑھا۔ اس کا موجودہ یوٹیوب چینل صرف 25 جنوری 2026ء کو شروع ہوا اور 8 نومبر 2026ء کی vidIQ قرأت کے مطابق اس کے سبسکرائبر صرف 7,890 تھے؛ اسٹیشن چینل سے پرانا ہے، اور اس کی اہلیت اس کے فیس بک سامعین پر ہے، یوٹیوب پر نہیں۔"
founded: { edtf: "2013", calendar: gregorian, precision: year, status: historical, note: "The station was founded in 2013: The New Region states that he 'founded the Kurdish-language Salafi television channel Amozhgari', The Amargi's profile dates the start, with wealthy Gulf backers, to 2013, and the Middle East Journal (2021), as read by the wave-199 harvest, records that in 2013 he renamed his station Amozhgary TV, from the Kurdish amozhgari, 'advice'. The present YouTube channel's start date (25 January 2026, vidIQ) is a different, later thing and is not the station's founding.", sources: [source/new-region-abdullatif-dismissal-2026, source/amargi-abdullatif-salafi-profile-2026, source/mej-salafism-iraqi-kurdistan-2021] }
