id: group/mutazila
education:
  did_you_know:
    ar: "اجتمعت المعتزلة عند المسعودي على خمسة أصول: التوحيد، والعدل، والوعد والوعيد، والمنزلة بين المنزلتين، والأمر بالمعروف والنهي عن المنكر."
    en: "Al-Mas'udi counts five principles uniting the Mu'tazila: divine unity, justice, promise and threat, the rank between two ranks, and enjoining good and forbidding wrong."
    ur: "مسعودی معتزلہ کے پانچ اصول گناتا ہے: توحید، عدل، وعدہ اور وعید، دو درجوں کے درمیان درجہ، اور نیکی کا حکم و برائی سے منع۔"
    sources: [source/muruj-al-dhahab, source/madkhal-ibn-badran-turki]
class: group
kind: sect
label:
  ar: "المعتزلة، وعند أبي بكر بن الإخشيد كما في الفهرست أن اسم الاعتزال حدث بعد الحسن البصري إذ اعتزل عمرو بن عبيد مجلس قتادة فسماها قتادة المعتزلة فأظهر عمرو تقبله وقال إن الاعتزال وصف مدحه الله في كتابه {cite:fihrist-ibn-al-nadim p. 557}"
  en: "Mu'tazila"
  es: "Mu'tazila"
  fr: "Mu'tazila"
  ur: "معتزلہ"
  tr: "Mu'tezile ve Ebu Bekr İbn el-İhşid'e göre, Fihrist'te de belirtildiği üzere, Mu'tezile adı Hasan el-Basri'den sonra ortaya çıkmıştır. Amr İbn Ubeyd, Katade'nin meclisinden ayrıldığında Katade bu mezhebe Mu'tezile adını vermiş, Amr da bunu kabul ederek Mu'tezileliğin Allah'ın kitabında övdüğü bir sıfat olduğunu söylemiştir. {cite:fihrist-ibn-al-nadim s. 557}"
  id: "Mu'tazila, dan menurut Abu Bakr Ibn al-Ikhshid, sebagaimana disebutkan dalam Fihrist, nama Mu'tazil muncul setelah al-Hasan al-Basri, ketika Amr Ibn Ubayd menarik diri dari majelis Qatada, sehingga Qatada menyebutnya Mu'tazil, dan Amr menunjukkan penerimaannya dan mengatakan bahwa Mu'tazilisme adalah deskripsi yang dipuji Allah dalam kitab-Nya {kutip:fihrist-ibn-al-nadim hlm. 557}"
summary:
  ar: "فرقة كلامية تقول بقول القدرية، وتنكر عذاب القبر والشفاعة والحوض، وترى أن أعمال العباد ليست في اللوح المحفوظ؛ ويصف الكتاب مقالاتهم كما نقلها، ولم تُضف بعد أقوالهم بألفاظهم. وعند المسعودي اجتمعت المعتزلة من البصريين والبغداديين على خمسة أصول: التوحيد بأن الله لا كالأشياء ليس بجسم ولا عرض ولا عنصر ولا جزء ولا جوهر وأنه لا تدركه الحواس في الدنيا ولا في الآخرة، والعدل بأن الله لا يحب الفساد ولا يخلق أفعال العباد بل يفعلون بالقدرة التي جعلها لهم، والوعيد بأنه لا يغفر لمرتكب الكبائر إلا بالتوبة، والمنزلة بين المنزلتين بأن الفاسق ليس بمؤمن ولا كافر بل يسمى فاسقاً وبهذا الباب سميت المعتزلة، والأمر بالمعروف والنهي عن المنكر بالسيف فما دونه ولا فرق عندهم بين مجاهدة الكافر والفاسق، فمن اعتقد هذه الأصول الخمسة كان معتزلياً، وذهبت المعتزلة إلى أن الإمامة اختيار من الأمة لم ينص الله على رجل بعينه وتجوز في قريش وغيرهم من أهل العدالة، واستدلوا بقول عمر لو أن سالماً حياً ما دخلتني فيه الظنون لما فوض الأمر إلى أهل الشورى وسالم مولى أبي حذيفة {cite:muruj-al-dhahab p. 208-210}، وعند المسعودي اجتمعت المعتزلة على خمسة أصول من اعتقدها كان معتزلياً فإن اعتقد الأكثر أو الأقل لم يستحق الاسم: التوحيد، والعدل، والوعد والوعيد، والمنزلة بين المنزلتين، والأمر بالمعروف والنهي عن المنكر؛ وبهذا الباب الأخير سمي الاعتزال {cite:muruj-al-dhahab p. 209}. ويرتب ابن حزم في الملل والنحل معتقدي الإسلام على خمس فرق ويجعل أقرب فرق المعتزلة إلى أهل السنة أصحاب الحسين بن محمد النجار وبشر بن غياث المريسي، وأبعدهم أصحاب أبي الهذيل العلاف وضرار بن عمرو، ويذكر أن المعتزلة تفرد بالكلام في التوحيد وما يوصف به الله ثم يزيد بعضهم الكلام في القدر والتسمية بالفسق والإيمان والوعيد {cite:fisal-ibn-hazm-kotobarabia p. 595-597}"
  en: "A kalam sect that holds the views of the Qadariyya, denies the punishment of the grave, intercession and the Pool, and holds that people's deeds are not in the Preserved Tablet; the book describes their doctrines as it relays them, and their own words have not yet been added. According to al-Mas'udi, the Mu'tazila of Basra and Baghdad agreed on five principles: tawhid, that God is not like things, neither body, accident, element, part nor substance, and is not perceived by the senses in this world or the next; justice, that God does not will corruption and does not create people's acts, which they perform by the power He gave them; the promise and the threat, that He does not forgive the grave sinner without repentance; the intermediate position, that the grave sinner is neither believer nor unbeliever but is called a sinner, and it is by this principle that the Mu'tazila were named; and enjoining good and forbidding evil, by the sword or less, with no distinction in their view between fighting the unbeliever and fighting the sinner. Whoever holds these five principles is a Mu'tazili. The Mu'tazila held that the imamate is a choice of the community, not a designation by God of a named man, and that it is permissible among Quraysh and among others of probity; they cited Umar's remark that, had Salim, freedman of Abu Hudhayfa, been alive, no doubt would have troubled him and he would not have entrusted the matter to the council {cite:muruj-al-dhahab p. 208-210}. Al-Mas'udi also records that the Mu'tazila agreed on five principles, and that whoever holds them is a Mu'tazili, while one who holds most or fewer does not merit the name: tawhid, justice, the promise and the threat, the intermediate position, and enjoining good and forbidding evil; it is from this last principle that the name al-i'tizal came {cite:muruj-al-dhahab p. 209}. In al-Fisal Ibn Hazm divides the Muslims into five groups and places the nearest Mu'tazila to the Sunna among the followers of al-Husayn ibn Muhammad al-Najjar and Bishr ibn al-Ghiyath al-Marisi, and the farthest among the followers of Abu al-Hudhayl al-Allaf and Dirar ibn Amr; he notes that the Mu'tazila are distinguished by their treatment of tawhid and the attributes, some of them adding discourse on qadar, the naming of fisq and iman, and the threat {cite:fisal-ibn-hazm-kotobarabia p. 595-597}."
  es: "Una secta kalam que sostiene las opiniones de los Qadariyya, niega el castigo de la tumba, la intercesión y el Estanque, y sostiene que los actos de las personas no están en la Tabla Preservada; el libro describe sus doctrinas tal como las transmite, y sus propias palabras aún no se han agregado. Según al-Mas'udi, los Mu'tazila de Basora y Bagdad coincidieron en cinco principios: tawhid, que Dios no es como las cosas, ni cuerpo, accidente, elemento, parte ni sustancia, y no es percibido por los sentidos en este mundo ni en el próximo; justicia, que Dios no quiere la corrupción y no crea los actos de las personas, que realizan por el poder que Él les dio; la promesa y la amenaza, que Él no perdona al pecador grave sin arrepentimiento; la posición intermedia, que el pecador grave no es ni creyente ni incrédulo sino que es llamado pecador, y es por este principio que los Mu'tazila fueron nombrados; y ordenar el bien y prohibir el mal, por la espada o menos, sin distinción en su punto de vista entre luchar contra el incrédulo y luchar contra el pecador. Quien sostiene estos cinco principios es un Mu'tazili. Los Mu'tazila sostenían que el imamato es una elección de la comunidad, no una designación de Dios de un hombre nombrado, y que es permisible entre los Quraysh y entre otros de probidad; citaron el comentario de Umar de que, si Salim, liberto de Abu Hudhayfa, hubiera estado vivo, sin duda lo habría perturbado y no habría confiado el asunto al consejo {cite:muruj-al-dhahab p. 208-210}. Al-Mas'udi también registra que los Mu'tazila estaban de acuerdo en cinco principios, y que quien los sostiene es un Mu'tazili, mientras que quien sostiene la mayoría o menos no merece el nombre: tawhid, justicia, la promesa y la amenaza, la posición intermedia y ordenar el bien y prohibir el mal; Es de este último principio que surgió el nombre al-i'tizal {cite:muruj-al-dhahab p. 209}. En al-Fisal, Ibn Hazm divide a los musulmanes en cinco grupos y sitúa a los Mu'tazila más cercanos a la Sunna entre los seguidores de al-Husayn ibn Muhammad al-Najjar y Bishr ibn al-Ghiyath al-Marisi, y a los más alejados entre los seguidores de Abu al-Hudhayl al-Allaf y Dirar ibn Amr; señala que los Mu'tazila se distinguen por su tratamiento del tawhid y los atributos, algunos de ellos añadiendo un discurso sobre el qadar, la denominación del fisq y el iman, y la amenaza {cite:fisal-ibn-hazm-kotobarabia p. 595-597}."
  fr: "Une secte kalam, partageant les vues des Qadariyya, nie le châtiment de la tombe, l'intercession et le Bassin, et soutient que les actes des hommes ne sont pas inscrits sur la Table Préservée. Le livre décrit leurs doctrines telles qu'il les relate, sans que leurs propres paroles n'y figurent encore. Selon al-Mas'udi, les Mu'tazilites de Bassora et de Bagdad s'accordaient sur cinq principes: le tawhid, selon lequel Dieu est incomparable aux choses, n'étant ni corps, ni accident, ni élément, ni partie, ni substance, et n'étant perceptible par les sens ni dans ce monde ni dans l'autre; la justice, selon laquelle Dieu ne veut pas la corruption et n'est pas à l'origine des actes des hommes, qui sont accomplis par le pouvoir qu'Il leur a conféré; la promesse et la menace, selon lesquelles Il ne pardonne pas au pécheur invétéré sans repentir; la position intermédiaire, selon laquelle le pécheur invétéré n'est ni croyant ni incroyant, mais est simplement qualifié de pécheur, et c'est sur ce principe que les Mu'tazilites ont été nommés. et d'ordonner le bien et d'interdire le mal, par l'épée ou autrement, sans distinction à leurs yeux entre combattre l'incroyant et combattre le pécheur. Quiconque adhère à ces cinq principes est un Mu'tazilite. Les Mu'tazilites considéraient que l'imamat est un choix de la communauté, et non une désignation divine d'un homme nommé, et qu'il est permis parmi les Qurayshites et parmi les autres personnes intègres; ils citaient la remarque d'Umar selon laquelle, si Salim, affranchi d'Abu Hudhayfa, avait été vivant, il l'aurait sans doute interpellé et n'aurait pas confié la question au conseil (voir: Muruj-al-Dhahab, p. 208-210). Al-Mas'udi rapporte également que les Mu'tazilites s'accordaient sur cinq principes, et que quiconque les adhère est un Mu'tazilite, tandis que celui qui en adhère à la plupart ou à une partie seulement ne mérite pas ce titre: le tawhid (l'unicité de Dieu), la justice, la promesse et la menace, la position intermédiaire, et l'injonction du bien et l'interdiction du mal. C’est de ce dernier principe que provient le nom al-i’tizal (voir Muruj al-Dhahab, p. 209). Dans al-Fisal, Ibn Hazm divise les musulmans en cinq groupes et place les Mu’tazilites les plus proches de la Sunna parmi les disciples d’al-Husayn ibn Muhammad al-Najjar et de Bishr ibn al-Ghiyath al-Marisi, et les plus éloignés parmi les disciples d’Abu al-Hudhayl al-Allaf et de Dirar ibn Amr. Il note que les Mu’tazilites se distinguent par leur conception du tawhid et des attributs, certains d’entre eux ajoutant un discours sur le qadar, la dénomination du fisq et de l’iman, et la menace (voir Fisal ibn Hazm, Kotobarabia, p. 595-597)."
  ur: "ایک کلام فرقہ جو قادریہ کے نظریات کا حامل ہے، عذاب قبر، شفاعت اور حوض کا انکار کرتا ہے، اور یہ کہتا ہے کہ لوگوں کے اعمال محفوظ شدہ تختی میں نہیں ہیں۔ کتاب ان کے عقائد کو بیان کرتی ہے جیسا کہ یہ ان سے متعلق ہے، اور ان کے اپنے الفاظ ابھی تک شامل نہیں کیے گئے ہیں۔ المسعودی کے مطابق، بصرہ اور بغداد کے معتزلہ نے پانچ اصولوں پر اتفاق کیا: توحید، کہ خدا چیزوں کی طرح نہیں ہے، نہ جسم، نہ حادثہ، عنصر، نہ جزو، نہ مادہ، اور نہ ہی حواس کے ذریعے اس دنیا یا آخرت میں محسوس کیا جاتا ہے۔ انصاف، کہ خدا بدعنوانی نہیں کرتا اور لوگوں کے اعمال کو پیدا نہیں کرتا، جو وہ اس کی عطا کردہ طاقت سے انجام دیتے ہیں۔ وعدہ اور دھمکی، کہ وہ توبہ کے بغیر سنگین گنہگار کو معاف نہیں کرتا؛ درمیانی مقام یہ ہے کہ گناہ گار نہ مومن ہوتا ہے نہ کافر بلکہ اسے گنہگار کہا جاتا ہے اور اسی اصول سے معتزلہ کا نام لیا گیا ہے۔ اور نیکی کا حکم دینا اور برائی سے منع کرنا، تلوار یا اس سے کم، ان کے خیال میں کافر سے لڑنے اور گنہگار سے لڑنے میں کوئی فرق نہیں ہے۔ جو ان پانچوں اصولوں کو رکھتا ہے وہ معتزلی ہے۔ معتزلہ کا خیال تھا کہ امامت برادری کا انتخاب ہے، نہ کہ کسی نامی شخص کے خدا کی طرف سے، اور یہ کہ یہ قریش اور انبیاء کے درمیان جائز ہے۔ انہوں نے عمر کے اس قول کا حوالہ دیا کہ اگر ابو حذیفہ کا آزاد کرنے والا سلیم زندہ ہوتا تو بلاشبہ انہیں پریشان نہ کرتا اور وہ یہ معاملہ کونسل کے سپرد نہ کرتے۔ 208-210}۔ المسعودی نے یہ بھی لکھا ہے کہ معتزلہ نے پانچ اصولوں پر اتفاق کیا ہے، اور جو ان کو رکھتا ہے وہ معتزلی ہے، جب کہ جو زیادہ یا کم رکھتا ہے وہ نام کے لائق نہیں: توحید، انصاف، وعدہ اور دھمکی، درمیانی مقام، اور نیکی کا حکم دینا اور برائی سے منع کرنا؛ اسی آخری اصول سے یہ نام الاعتضال آیا {حوالہ: مروج الذہب ص۔ 209}۔ الفصل میں ابن حزم نے مسلمانوں کو پانچ گروہوں میں تقسیم کیا ہے اور حسین بن محمد النجار اور بشر بن الغیث المرسی کے پیروکاروں میں سنت کے قریب ترین معتزلہ کو اور ابو الذیل العلاف کے پیروکاروں میں سب سے زیادہ فاصلہ رکھنے والے معتزلہ کو قرار دیا ہے۔ اس نے نوٹ کیا کہ معتزلہ کو توحید کے ساتھ سلوک اور صفات سے ممتاز کیا جاتا ہے، ان میں سے بعض نے قدر، فسق اور ایمان کا نام اور خطرہ شامل کیا ہے۔ 595-597}۔"
  tr: "Kadercilik doktrinine inanan, kabir azabını, şefaati ve Havza'yı reddeden ve kulların amellerinin Levha'da bulunmadığına inanan bir teolojik grup. Kitap, onların sözlerini aktarıldığı şekliyle anlatıyor ve sözleri henüz eklenmedi. El-Mas'udi'ye göre, Basra ve Bağdat Mu'tezililer beş ilke üzerinde anlaştılar: tevhid, yani Tanrı'nın şeylere benzemeyen, ne bir cisim ne bir olay ne bir unsur ne bir parça ne bir madde olduğu ve bu dünyada veya ahirette duyularla algılanamayacağı; adalet, yani Tanrı'nın yolsuzluğu sevmediği ve insanların eylemlerini yaratmadığı, aksine insanların O'nun verdiği güçle hareket ettikleri; ceza tehdidi, yani Tanrı'nın büyük günah işleyenleri ancak tövbe yoluyla affettiği; orta yol, yani günahkarın ne mümin ne de kâfir olduğu, ancak günahkar olarak adlandırıldığı ve Mu'tezililerin bu temelde adlandırıldığı. Kılıçla veya daha hafif araçlarla iyiliği emretmeyi ve kötülüğü yasaklamayı esas alırlardı ve kâfirle ve günahkârla savaşmak arasında ayrım yapmazlardı. Bu beş ilkeye inanan herkes Mu'tezile mensuptu. Mu'tezileler, imametin cemaatin seçimi olduğunu, Allah'ın belirli bir kişiyi belirtmediğini ve Kureyş ve diğer iyi karakterli kişilerin seçilmesinin caiz olduğunu savundular. Delil olarak Ömer'in şu sözünü gösterdiler: \"Salim hayatta olsaydı, onun hakkında hiçbir şüphem olmazdı, çünkü bu işi Şura halkına emanet etmezdi.\" Salim, Ebu Hudeyfe'nin azatlı kölesiydi. (208-210) El-Mas'udi'ye göre, Mu'tezileler beş ilke üzerinde anlaştılar; bunlara inanan herkes Mu'tezile mensuptu ve bunlardan az ya da çokuna inananlar bu ismi hak etmiyordu: tevhid, adalet, vaat ve tehdit, orta hal ve iyiliği emretme ve kötülüğü yasaklama. Mu'tezilelerin bu son ilke nedeniyle adlandırıldıkları anlaşılıyor {kaynak:muruj-al-dhahab s. 209}. İbn Hazm, \"al-Milal wa al-Nihal\" (Dinler ve Mezhepler) adlı kitabında İslam müminlerini beş gruba ayırarak, Hüseyin ibn Muhammed al-Najjar ve Bişr ibn Ghiyas al-Marisi'nin takipçilerini Sünnilere en yakın Mu'tezile grupları arasında, Ebu el-Hüdâyl al-'Allaf ve Dirar ibn 'Amr'ın takipçilerini ise en uzak gruplar arasında konumlandırıyor. Mu'tezilelerin tevhid ve Allah'a atfedilen sıfatlar konusundaki tartışmalarının benzersiz olduğunu ve bazılarının kader, günahın belirlenmesi, iman ve ceza tehdidi konularını da ele aldığını belirtiyor {kaynak:fisal-ibn-hazm-kotobarabia s. 595-597}."
  id: "Sebuah kelompok teologis yang meyakini doktrin predestinasi, menolak siksaan kubur, syafaat, dan Lailatul Qadar, serta meyakini bahwa perbuatan hamba-hamba Allah tidak tercatat dalam Lauh Mahfuz. Kitab ini menggambarkan pernyataan mereka sebagaimana yang telah diriwayatkan, dan kata-kata mereka belum ditambahkan. Menurut al-Mas'udi, kaum Mu'tazilah di Basra dan Baghdad sepakat pada lima prinsip: monoteisme, bahwa Tuhan tidak seperti benda, bukan tubuh, bukan kecelakaan, bukan unsur, bukan bagian, bukan substansi, dan bahwa Dia tidak dapat dirasakan oleh indra di dunia ini atau di akhirat; keadilan, bahwa Tuhan tidak menyukai kerusakan dan tidak menciptakan perbuatan manusia, melainkan mereka bertindak dengan kekuatan yang telah Dia berikan kepada mereka; ancaman hukuman, bahwa Dia tidak mengampuni orang-orang yang melakukan dosa besar kecuali melalui pertobatan; posisi tengah, bahwa pelanggar bukanlah orang beriman maupun orang kafir, tetapi disebut pelanggar, dan atas dasar inilah kaum Mu'tazilah dinamai demikian; Mereka menyeru kepada kebaikan dan melarang kejahatan dengan pedang atau cara yang lebih ringan, dan mereka tidak membedakan antara memerangi orang kafir dan orang yang melanggar hukum. Siapa pun yang beriman pada kelima prinsip ini adalah seorang Mu'tazilah. Kaum Mu'tazilah berpendapat bahwa imamah adalah pilihan masyarakat, bahwa Tuhan tidak menentukan orang tertentu, dan bahwa diperbolehkan bagi kaum Quraisy dan orang-orang lain yang berakhlak baik untuk dipilih. Mereka mengutip sebagai bukti pernyataan Umar: \"Jika Salim masih hidup, aku tidak akan ragu tentangnya, karena dia tidak akan menyerahkan masalah ini kepada orang-orang Syura.\" Salim adalah budak yang dibebaskan oleh Abu Hudhayfa. 208-210} Menurut al-Mas'udi, kaum Mu'tazilah sepakat pada lima prinsip; siapa pun yang beriman pada prinsip-prinsip tersebut adalah seorang Mu'tazilah, dan siapa pun yang beriman pada lebih atau kurang dari prinsip-prinsip tersebut tidak pantas disebut demikian: monoteisme, keadilan, janji dan ancaman, keadaan antara, dan menyeru kepada kebaikan dan melarang kejahatan. Karena prinsip terakhir inilah kaum Mu'tazilah diberi nama {cite:muruj-al-dhahab hlm. 209}. Ibn Hazm, dalam bukunya \"al-Milal wa al-Nihal\" (Agama dan Sekte), mengelompokkan penganut Islam menjadi lima kelompok, menempatkan pengikut al-Husayn ibn Muhammad al-Najjar dan Bishr ibn Ghiyath al-Marisi di antara kelompok Mu'tazilah yang paling dekat dengan Sunni, dan pengikut Abu al-Hudhayl al-'Allaf dan Dirar ibn 'Amr di antara yang paling jauh. Ia menyebutkan bahwa kaum Mu'tazilah unik dalam pembahasan mereka tentang monoteisme dan sifat-sifat yang dikaitkan dengan Tuhan, dan sebagian dari mereka menambahkan pembahasan tentang takdir, penentuan dosa, iman, dan ancaman hukuman {cite:fisal-ibn-hazm-kotobarabia hlm. 595-597}."
