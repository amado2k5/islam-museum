label:
  ar: "المعتزلة"
summary:
  ar: "فرقة كلامية تقول بقول القدرية، وتنكر عذاب القبر والشفاعة والحوض، وترى أن أعمال العباد ليست في اللوح المحفوظ؛ ويصف الكتاب مقالاتهم كما نقلها، ولم تُضف بعد أقوالهم بألفاظهم.، وعند المسعودي اجتمعت المعتزلة من البصريين والبغداديين على خمسة أصول: التوحيد بأن الله لا كالأشياء ليس بجسم ولا عرض ولا عنصر ولا جزء ولا جوهر وأنه لا تدركه الحواس في الدنيا ولا في الآخرة، والعدل بأن الله لا يحب الفساد ولا يخلق أفعال العباد بل يفعلون بالقدرة التي جعلها لهم، والوعيد بأنه لا يغفر لمرتكب الكبائر إلا بالتوبة، والمنزلة بين المنزلتين بأن الفاسق ليس بمؤمن ولا كافر بل يسمى فاسقاً وبهذا الباب سميت المعتزلة، والأمر بالمعروف والنهي عن المنكر بالسيف فما دونه ولا فرق عندهم بين مجاهدة الكافر والفاسق، فمن اعتقد هذه الأصول الخمسة كان معتزلياً، وذهبت المعتزلة إلى أن الإمامة اختيار من الأمة لم ينص الله على رجل بعينه وتجوز في قريش وغيرهم من أهل العدالة، واستدلوا بقول عمر لو أن سالماً حياً ما دخلتني فيه الظنون لما فوض الأمر إلى أهل الشورى وسالم مولى أبي حذيفة {cite:muruj-al-dhahab p. 208-210}"
