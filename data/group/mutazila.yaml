id: group/mutazila
education:
  did_you_know:
    ar: "اجتمعت المعتزلة عند المسعودي على خمسة أصول: التوحيد، والعدل، والوعد والوعيد، والمنزلة بين المنزلتين، والأمر بالمعروف والنهي عن المنكر."
    en: "Al-Mas'udi counts five principles uniting the Mu'tazila: divine unity, justice, promise and threat, the rank between two ranks, and enjoining good and forbidding wrong."
    ur: "مسعودی معتزلہ کے پانچ اصول گناتا ہے: توحید، عدل، وعدہ اور وعید، دو درجوں کے درمیان درجہ، اور نیکی کا حکم و برائی سے منع۔"
    sources: [source/muruj-al-dhahab, source/madkhal-ibn-badran-turki]
class: group
kind: sect
label:
  ar: "المعتزلة، وعند أبي بكر بن الإخشيد كما في الفهرست أن اسم الاعتزال حدث بعد الحسن البصري إذ اعتزل عمرو بن عبيد مجلس قتادة فسماها قتادة المعتزلة فأظهر عمرو تقبله وقال إن الاعتزال وصف مدحه الله في كتابه {cite:fihrist-ibn-al-nadim p. 557}"
  en: "Mu'tazila"
summary:
  ar: "فرقة كلامية تقول بقول القدرية، وتنكر عذاب القبر والشفاعة والحوض، وترى أن أعمال العباد ليست في اللوح المحفوظ؛ ويصف الكتاب مقالاتهم كما نقلها، ولم تُضف بعد أقوالهم بألفاظهم. وعند المسعودي اجتمعت المعتزلة من البصريين والبغداديين على خمسة أصول: التوحيد بأن الله لا كالأشياء ليس بجسم ولا عرض ولا عنصر ولا جزء ولا جوهر وأنه لا تدركه الحواس في الدنيا ولا في الآخرة، والعدل بأن الله لا يحب الفساد ولا يخلق أفعال العباد بل يفعلون بالقدرة التي جعلها لهم، والوعيد بأنه لا يغفر لمرتكب الكبائر إلا بالتوبة، والمنزلة بين المنزلتين بأن الفاسق ليس بمؤمن ولا كافر بل يسمى فاسقاً وبهذا الباب سميت المعتزلة، والأمر بالمعروف والنهي عن المنكر بالسيف فما دونه ولا فرق عندهم بين مجاهدة الكافر والفاسق، فمن اعتقد هذه الأصول الخمسة كان معتزلياً، وذهبت المعتزلة إلى أن الإمامة اختيار من الأمة لم ينص الله على رجل بعينه وتجوز في قريش وغيرهم من أهل العدالة، واستدلوا بقول عمر لو أن سالماً حياً ما دخلتني فيه الظنون لما فوض الأمر إلى أهل الشورى وسالم مولى أبي حذيفة {cite:muruj-al-dhahab p. 208-210}، وعند المسعودي اجتمعت المعتزلة على خمسة أصول من اعتقدها كان معتزلياً فإن اعتقد الأكثر أو الأقل لم يستحق الاسم: التوحيد، والعدل، والوعد والوعيد، والمنزلة بين المنزلتين، والأمر بالمعروف والنهي عن المنكر؛ وبهذا الباب الأخير سمي الاعتزال {cite:muruj-al-dhahab p. 209}"
  en: "A kalam sect that holds the views of the Qadariyya, denies the punishment of the grave, intercession and the Pool, and holds that people's deeds are not in the Preserved Tablet; the book describes their doctrines as it relays them, and their own words have not yet been added. According to al-Mas'udi, the Mu'tazila of Basra and Baghdad agreed on five principles: tawhid, that God is not like things, neither body, accident, element, part nor substance, and is not perceived by the senses in this world or the next; justice, that God does not will corruption and does not create people's acts, which they perform by the power He gave them; the promise and the threat, that He does not forgive the grave sinner without repentance; the intermediate position, that the grave sinner is neither believer nor unbeliever but is called a sinner, and it is by this principle that the Mu'tazila were named; and enjoining good and forbidding evil, by the sword or less, with no distinction in their view between fighting the unbeliever and fighting the sinner. Whoever holds these five principles is a Mu'tazili. The Mu'tazila held that the imamate is a choice of the community, not a designation by God of a named man, and that it is permissible among Quraysh and among others of probity; they cited Umar's remark that, had Salim, freedman of Abu Hudhayfa, been alive, no doubt would have troubled him and he would not have entrusted the matter to the council {cite:muruj-al-dhahab p. 208-210}. Al-Mas'udi also records that the Mu'tazila agreed on five principles, and that whoever holds them is a Mu'tazili, while one who holds most or fewer does not merit the name: tawhid, justice, the promise and the threat, the intermediate position, and enjoining good and forbidding evil; it is from this last principle that the name al-i'tizal came {cite:muruj-al-dhahab p. 209}."
