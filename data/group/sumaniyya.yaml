label: { ar: "السمنية", en: "Sumaniyya" }
summary:
  ar: "السمنية نبيهم بوداسف وعلى هذا المذهب كان أكثر أهل ما وراء النهر قبل الإسلام وفي القديم، ومعنى السمنية منسوب إلى سمني وهم أسخى أهل الأرض والأديان، وذلك أن نبيهم أعلمهم أن أعظم الأمور التي لا تحل ولا يسع الإنسان أن يعتقدها ولا يفعلها قول لا في الأمور كلها فهم على ذلك قولا وفعلا وقول لا عندهم من فعل الشيطان ومذهبهم دفع الشيطان {cite:fihrist-ibn-al-nadim p. 484}."
  en: "The Sumaniyya — the pre-Islamic creed of most Transoxanians, whose prophet Budasaf forbade them ever to say no {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
