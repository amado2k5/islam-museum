id: group/sumaniyya
class: group
kind: sect
label: { ar: "السمنية", en: "Sumaniyya", es: "Sumaniyya", fr: "Sumaniyya", ur: "سمنیہ", tr: "Meni", id: "Air mani" }
summary:
  ar: "السمنية نبيهم بوداسف وعلى هذا المذهب كان أكثر أهل ما وراء النهر قبل الإسلام وفي القديم، ومعنى السمنية منسوب إلى سمني وهم أسخى أهل الأرض والأديان، وذلك أن نبيهم أعلمهم أن أعظم الأمور التي لا تحل ولا يسع الإنسان أن يعتقدها ولا يفعلها قول لا في الأمور كلها فهم على ذلك قولا وفعلا وقول لا عندهم من فعل الشيطان ومذهبهم دفع الشيطان {cite:fihrist-ibn-al-nadim p. 484}."
  en: "The Sumaniyya — the pre-Islamic creed of most Transoxanians, whose prophet Budasaf forbade them ever to say no {cite:fihrist-ibn-al-nadim}"
  es: "La Sumaniyya — el credo preislámico de la mayoría de los transoxanos, cuyo profeta Budasaf les prohibió decir jamás no {cite:fihrist-ibn-al-nadim}"
  fr: "La Sumaniyya — la croyance préislamique de la plupart des Transoxaniens, dont le prophète Budasaf leur interdisait de dire non {cite:fihrist-ibn-al-nadim}"
  ur: "سمانیہ - زیادہ تر ٹرانسکسانیوں کا قبل از اسلام عقیدہ، جس کے نبی بوداسف نے انہیں کبھی بھی نہ کہنے سے منع کیا تھا"
  tr: "Samaniyye mezhebine mensup olanların peygamberi Budasaf'tır ve bu, İslam öncesi ve eski zamanlarda Transoksanya halkının çoğunun doktriniydi. Samaniyye kelimesinin anlamı Samani'ye atfedilir ve onlar yeryüzünün ve dinlerin en cömert insanlarıdır. Çünkü peygamberleri onlara, bir insanın inanmaması ve yapmaması gereken en büyük şeyin her konuda \"hayır\" demek olduğunu bildirmiştir. Dolayısıyla onlar bunu söz ve fiil olarak benimserler ve onlara göre \"hayır\" demek şeytanın işidir ve onların doktrini şeytanı kovmaktır. {kaynak: Fihrist ibn el-Nadim s. 484}"
  id: "Kaum Samaniyyah, nabi mereka adalah Buddhaf, dan ini adalah doktrin sebagian besar penduduk Transoxiana sebelum Islam dan pada zaman kuno. Arti Samaniyyah dikaitkan dengan Samani, dan mereka adalah orang-orang yang paling dermawan di bumi dan agama-agama. Ini karena nabi mereka memberi tahu mereka bahwa hal terbesar yang tidak diperbolehkan dan yang tidak dapat dipercaya atau dilakukan seseorang adalah mengatakan tidak dalam segala hal. Jadi mereka berpegang teguh pada hal itu dalam perkataan dan perbuatan, dan mengatakan tidak kepada mereka adalah pekerjaan Setan, dan doktrin mereka adalah untuk menolak Setan. {cite:fihrist-ibn-al-nadim p. 484}."
