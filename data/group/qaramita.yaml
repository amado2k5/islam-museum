label: { ar: "القرامطة", en: "The Qarmatians" }
summary:
  ar: "فرقة من الباطنية اشتد شأنها أواخر القرن الثالث وأوائل الرابع؛ وعند ابن الجوزي سميت الباطنية بألقاب: الإسماعيلية انتساباً إلى إسماعيل بن جعفر الصادق، والباطنية لدعواهم أن لظواهر القرآن والأخبار بواطن تجري مجرى اللب من القشر، والقرامطة والحرمية والبابكية والمحمرة والسبعية والتعليمية، ولتسميتهم بالقرامطة ستة أقوال منها أن أول من أشارهم محمد الوراق المقرسط الكوفي، ومنها أن لهم رئيساً من سواد الأنباط يلقب بقرمطا، ومنها قرمطاً غلاماً لإسماعيل بن جعفر أحدث لهم مقالاتهم، ومنها داعٍ نزل برجل يقال له كرمية فتسمّوا به ثم خفف الاسم فقيل قرمط، وقال أهل السير كان ذلك الداعي من ناحية خوزستان يظهر الزهد والتقشف ويسف الخوص ويأكل من كسبه ويحفظ للقوم ما صرموا من نخلهم في حظيرة ويأخذ عند إفطاره من البقال تمراً فيجمع نواه ويدفعه إليه حتى سمع التجار الذين صرموا نخلهم فوثبوا عليه وضربوه ثم ندموا فازداد بذلك نبلاً {cite:muntazam-ibn-al-jawzi p. 111-112}، وكانوا يستدرجون الناس إلى مذاهبهم بما يقدرون عليه فيميلون إلى كل قوم بسبب يوافقهم: فللشيعي يظهرون بغض أبي بكر وعمر ولليهودي انتظار المسيح وعكسه للنصراني وللصابئ تعظيم الكواكب وللمجوسي الغار والنوروز، ويوصون دعاتهم بألا يكلموا عالماً بل الجهال ويتحصنوا بإلقاء المتشابه {cite:muntazam-ibn-al-jawzi p. 118-119}.، وعند ابن الجوزي ونقل ابن الجوزي سلسلة زعمائهم في قوله: ظهروا بإمامة ابن الحنفية وقالوا إن روحه انتقلت إلى أبي مسلم صاحب الدعوة ثم إلى المهدي ثم إلى رجل يعرف بابن القصري ثم خمدت نارهم، ثم تناصروا في أيام المعتصم وكاتبوا الأفشين واجتمعوا مع بابك ثم زاد جمعهم على ثلاثمائة ألف فقتل المعتصم منهم ستين ألفاً وقتل الأفشين أيضاً ثم ركدت دولتهم ثم نبغ منهم جماعة فيهم رجل من ولد بهرام جور وقصدوا إبطال الإسلام ورد الدولة الفارسية وجعلوا لهم رأساً يعرف بعبيد الله بن ميمون، ومراتبهم عنده يرتقي المبتدئ إلى الدعوة ثم إلى أن يكون حجة ثم إلى الإمامة ثم يلحق مرتبة... والمتقدمون منهم يستخلفون عند الموت وكلهم خلفاء لمعد بن تميم بن إسماعيل بن جعفر الطالبي، ومن الدعاة إلى الإمام معد بن تميم وابنه إسماعيل وهم المتغلبون على بلاد المغرب {cite:muntazam-ibn-al-jawzi p. 119-120}"
  en: "The Qarmatian movement of the late third/early fourth century; Ibn al-Jawzi lists the Batiniyya's names — Ismaili after Ismail b. Ja'far, Batiniyya for their hidden readings, plus Hurmiyya, Babakiyya, Muhammira, Sab'iyya, Ta'limiyya — and six etymologies of 'Qarmati' including the Nabati chief Qarmita and the ascetic Khuzistani dai who saved date-stones for the greengrocer; their recruiters were taught to approach each man through his own passion — Shi'i grievance, messianism, Sabian stars, Magian feasts — and to argue only with the ignorant {cite:muntazam-ibn-al-jawzi p. 111-119}."
