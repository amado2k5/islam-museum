summary:
  ar: "فرقة من الباطنية اشتد شأنها أواخر القرن الثالث وأوائل الرابع؛ وعند ابن الجوزي سميت الباطنية بألقاب: الإسماعيلية انتساباً إلى إسماعيل بن جعفر الصادق، والباطنية لدعواهم أن لظواهر القرآن والأخبار بواطن تجري مجرى اللب من القشر، والقرامطة والحرمية والبابكية والمحمرة والسبعية والتعليمية، ولتسميتهم بالقرامطة ستة أقوال منها أن أول من أشارهم محمد الوراق المقرسط الكوفي، ومنها أن لهم رئيساً من سواد الأنباط يلقب بقرمطا، ومنها قرمطاً غلاماً لإسماعيل بن جعفر أحدث لهم مقالاتهم، ومنها داعٍ نزل برجل يقال له كرمية فتسمّوا به ثم خفف الاسم فقيل قرمط، وقال أهل السير كان ذلك الداعي من ناحية خوزستان يظهر الزهد والتقشف ويسف الخوص ويأكل من كسبه ويحفظ للقوم ما صرموا من نخلهم في حظيرة ويأخذ عند إفطاره من البقال تمراً فيجمع نواه ويدفعه إليه حتى سمع التجار الذين صرموا نخلهم فوثبوا عليه وضربوه ثم ندموا فازداد بذلك نبلاً {cite:muntazam-ibn-al-jawzi p. 111-112}، وكانوا يستدرجون الناس إلى مذاهبهم بما يقدرون عليه فيميلون إلى كل قوم بسبب يوافقهم: فللشيعي يظهرون بغض أبي بكر وعمر ولليهودي انتظار المسيح وعكسه للنصراني وللصابئ تعظيم الكواكب وللمجوسي الغار والنوروز، ويوصون دعاتهم بألا يكلموا عالماً بل الجهال ويتحصنوا بإلقاء المتشابه {cite:muntazam-ibn-al-jawzi p. 118-119}. وعند ابن الجوزي ونقل ابن الجوزي سلسلة زعمائهم في قوله: ظهروا بإمامة ابن الحنفية وقالوا إن روحه انتقلت إلى أبي مسلم صاحب الدعوة ثم إلى المهدي ثم إلى رجل يعرف بابن القصري ثم خمدت نارهم، ثم تناصروا في أيام المعتصم وكاتبوا الأفشين واجتمعوا مع بابك ثم زاد جمعهم على ثلاثمائة ألف فقتل المعتصم منهم ستين ألفاً وقتل الأفشين أيضاً ثم ركدت دولتهم ثم نبغ منهم جماعة فيهم رجل من ولد بهرام جور وقصدوا إبطال الإسلام ورد الدولة الفارسية وجعلوا لهم رأساً يعرف بعبيد الله بن ميمون، ومراتبهم عنده يرتقي المبتدئ إلى الدعوة ثم إلى أن يكون حجة ثم إلى الإمامة ثم يلحق مرتبة... والمتقدمون منهم يستخلفون عند الموت وكلهم خلفاء لمعد بن تميم بن إسماعيل بن جعفر الطالبي، ومن الدعاة إلى الإمام معد بن تميم وابنه إسماعيل وهم المتغلبون على بلاد المغرب {cite:muntazam-ibn-al-jawzi p. 119-120}"
  en: "The Qarmatian movement of the late third/early fourth century; Ibn al-Jawzi lists the Batiniyya's names — Ismaili after Ismail b. Ja'far, Batiniyya for their hidden readings, plus Hurmiyya, Babakiyya, Muhammira, Sab'iyya, Ta'limiyya — and six etymologies of 'Qarmati' including the Nabati chief Qarmita and the ascetic Khuzistani dai who saved date-stones for the greengrocer; their recruiters were taught to approach each man through his own passion — Shi'i grievance, messianism, Sabian stars, Magian feasts — and to argue only with the ignorant {cite:muntazam-ibn-al-jawzi p. 111-119}."
  es: "El movimiento Qarmatiano de finales del siglo III y principios del IV; Ibn al-Jawzi enumera los nombres de Batiniyya: Ismaili después de Ismail b. Ja'far, Batiniyya por sus lecturas ocultas, además de Hurmiyya, Babakiyya, Muhammira, Sab'iyya, Ta'limiyya, y seis etimologías de 'Qarmati', incluido el jefe nabati Qarmita y el asceta Khuzistani dai que guardaba piedras de dátiles para el verdulero; a sus reclutadores se les enseñó a acercarse a cada hombre a través de su propia pasión (el agravio chiíta, el mesianismo, las estrellas sabias, las fiestas mágicas) y a discutir sólo con los ignorantes {citar:muntazam-ibn-al-jawzi p. 111-119}."
  fr: "Le mouvement qarmate de la fin du IIIe/début du IVe siècle; Ibn al-Jawzi énumère les noms des Batiniyya - Ismaili après Ismail b. Ja'far, Batiniyya pour leurs lectures cachées, plus Hurmiyya, Babakiyya, Muhammira, Sab'iyya, Ta'limiyya — et six étymologies de « Qarmati », dont le chef Nabati Qarmita et l'ascète Khuzistani dai qui gardait des pierres de dattes pour le marchand de légumes; leurs recruteurs apprenaient à approcher chaque homme à travers sa propre passion – griefs chiites, messianisme, étoiles sabiennes, fêtes magiennes – et à discuter uniquement avec les ignorants {cite:muntazam-ibn-al-jawzi p. 111-119}."
  ur: "تیسری / چوتھی صدی کے اوائل کی قرمتی تحریک؛ ابن الجوزی نے اسماعیل بن کے بعد بطینیہ اسماعیلی کے نام درج کیے ہیں۔ جعفر، بطنیہ ان کے چھپے ہوئے پڑھنے کے لیے، نیز حرمیہ، بابکیہ، محرما، سبیہ، تلیمیہ — اور 'قرمتی' کے چھ اشعار بشمول نباتی سربراہ قرمیتا اور سنیاسی خوزستانی دائی جنہوں نے سبزی خور کے لیے کھجور کے پتھر محفوظ کیے تھے۔ ان کے بھرتی کرنے والوں کو سکھایا گیا تھا کہ ہر ایک آدمی سے اس کے اپنے جذبے کے ذریعے رابطہ کریں — شیعوں کی شکایت، مسیحیت، صابی ستاروں، مجوسیوں کی دعوتیں — اور صرف جاہلوں سے بحث کرنا۔ 111-119}۔"
  tr: "Üçüncü yüzyılın sonlarında ve dördüncü yüzyılın başlarında öne çıkan bir Bâtiniyye mezhebi; İbnü'l-Cevzi'ye göre Batıniyye çeşitli isimlerle anılıyordu: İsmail ibn Cafer el-Sadık'tan sonra İsmailiyye; Batıniyye, Kur'an ve hadislerin zahiri manalarının, kabuğun içindeki çekirdek gibi gizli manaları olduğunu iddia ettikleri için; Karmatiler; Haramiyye; Babakiyya; Muhammara; Sab'iyya; ve Ta'limiyya. Karmatiler ismiyle ilgili altı teori var: Birincisi, Muhammed el-Varrak el-Mukarrasit el-Kufi'nin onları öneren ilk kişi olduğu; bir diğeri ise Nebatilerden Karmat adında bir liderlerinin olması; bir diğeri ise Karmat'ın, onların öğretilerini tanıtan İsmail ibn Cafer'in hizmetkarı olduğudur; Bir başka rivayete göre, bir vaiz Karmiyya adında bir adamın yanında kalmış ve onun adını benimsemişlerdir; bu isim daha sonra Qarmat olarak kısaltılmıştır. Tarihçiler, bu vaizin Huzistan bölgesinden olduğunu, dışarıdan çilecilik ve sadelik sergilediğini, hurma yapraklarından dokuma yaptığını, kendi kazancıyla geçindiğini ve halkın topladığı hurmaları bir ağılda sakladığını söylerler. Kahvaltıda bakkaldan hurma alır, çekirdeklerini toplar ve ona verirdi. Bu durum, hurmaları toplayan tüccarlar bunu duyunca ona saldırdılar ve dövdüler, ancak daha sonra pişman oldular ve bunun sonucunda onun asaleti arttı. {cite:muntazam-ibn-al-jawzi s. 111-112} ve insanları kendi doktrinlerine çekmek için ellerinden gelen her yolu kullanırlardı; böylece her gruba kendilerine uygun bir sebeple meyilli olurlardı: Şiiler için Ebu Bekir ve Ömer'e karşı nefret gösterirlerdi, Yahudiler için Mesih'i beklerlerdi ve Hristiyanlar için bunun tam tersini yaparlardı, Sabiiler için yıldızlara taparlardı ve Mecusiler için mağaraya ve Nevruz'a taparlardı ve vaizlerine bir âlimle değil, cahillerle konuşmalarını ve belirsiz şeyleri ortaya atarak kendilerini güçlendirmelerini tavsiye ederlerdi. {alıntı:muntazam-ibn-al-jawzi s. 118-119} İbn el-Cevzi, önderlerinin zincirini şöyle rivayet etmiştir: İbn el-Hanefiyye'nin imamlığıyla ortaya çıktılar ve onun ruhunun önce davetin önderi Ebu Müslim'e, sonra Mehdi'ye, sonra da İbn el-Kasri diye bilinen bir kişiye geçtiğini söylediler. Sonra ateşleri söndü, sonra Mu'tesim döneminde birbirlerini desteklediler, Afşin ile yazıştılar ve Babak ile görüştüler. Sonra sayıları üç yüz bine ulaştı. Mu'tesim onlardan altmış binini ve Afşin'i öldürdü. Sonra durumları durgunlaştı. Sonra içlerinden bir grup çıktı, aralarında Bahram Gur'un soyundan bir adam vardı ve İslam'ı ortadan kaldırmayı ve Pers devletini yeniden kurmayı amaçladılar. Kendilerine Ubeydullah ibn Maymun diye bilinen bir önder atadılar ve ona göre dereceleri şöyledir: Başlangıç seviyesindeki kişi davete yükselir, sonra delil olur, sonra imamlığa ulaşır, sonra bir dereceye erişir... ve aralarındaki ileri gelenler... Ölüm üzerine yerlerine geçenler Ma'd ibn Tamim ibn İsmail ibn Cafer el-Talibî'nin halefleridir ve imam Ma'd ibn Tamim ve oğlu İsmail'e davet edenler arasındadırlar ve Mağrip topraklarının kontrolünü ele geçirenler de onlardır. {Kaynak: Muntazam ibn el-Cevzi, s. 119-120}"
  id: "Sebuah sekte Batiniyya yang semakin menonjol pada akhir abad ketiga dan awal abad keempat; Menurut Ibn al-Jawzi, Batiniyya disebut dengan beberapa nama: Isma'iliyya, diambil dari nama Isma'il ibn Ja'far al-Sadiq; Batiniyya, karena mereka menyatakan bahwa makna nyata dalam Al-Qur'an dan hadits mempunyai makna tersembunyi, seperti inti di dalam cangkang; orang Qarmatian; Haramiyya; Babakiyya; Muhammara; Sab'iyya; dan Ta'limiyya. Ada enam teori mengenai nama mereka, Qarmatians: pertama adalah bahwa Muhammad al-Warraq al-Muqarrasit al-Kufi adalah orang pertama yang mengemukakan mereka; yang lainnya adalah mereka mempunyai pemimpin dari suku Nabataean yang disebut Qarmat; lainnya adalah bahwa Qarmat adalah hamba Isma'il ibn Ja'far yang memperkenalkan doktrin mereka; Kisah lain menyebutkan bahwa seorang pendakwah tinggal bersama seorang pria bernama Karmiyya, dan mereka mengadopsi namanya, yang kemudian disingkat menjadi Qarmat. Para sejarawan mengatakan bahwa pendakwah ini berasal dari wilayah Khuzestan, secara lahiriah menunjukkan sikap asketis dan sederhana, menenun daun palem, makan dari penghasilannya sendiri, dan menyimpan kurma yang dipanen oleh masyarakat di dalam sebuah wadah. Saat sarapan, ia akan mengambil kurma dari pedagang, mengumpulkan bijinya, dan memberikannya kepada pedagang tersebut. Hal ini terus berlanjut hingga para pedagang yang telah memanen kurma mereka mendengar tentang hal itu, menyerangnya, dan memukulinya, tetapi kemudian menyesalinya, dan kemuliaannya meningkat sebagai akibatnya. {cite:muntazam-ibn-al-jawzi p. 111-112}, dan mereka akan memikat orang-orang kepada doktrin mereka dengan cara apa pun yang mereka bisa, sehingga mereka akan condong ke setiap kelompok karena alasan yang sesuai dengan mereka: untuk kaum Syiah mereka akan menunjukkan kebencian terhadap Abu Bakar dan Umar, untuk kaum Yahudi mereka akan menantikan Mesias dan sebaliknya untuk kaum Kristen, untuk kaum Sabian mereka akan memuja bintang-bintang, dan untuk kaum Majusi mereka akan memuja gua dan Nowruz, dan mereka akan menasihati para pengkhotbah mereka untuk tidak berbicara kepada seorang ulama tetapi kepada orang-orang yang tidak tahu apa-apa dan untuk membentengi diri mereka sendiri dengan menyampaikan hal-hal yang ambigu {kutip:muntazam-ibn-al-jawzi hlm. 118-119}. Dan Ibnu al-Jawzi, dan Ibnu al-Jawzi meriwayatkan sanad para pemimpin mereka, mengatakan: Mereka muncul dengan imamat Ibnu al-Hanafiyya dan berkata bahwa rohnya berpindah kepada Abu Muslim, pemimpin dakwah, kemudian kepada al-Mahdi, kemudian kepada seorang pria yang dikenal sebagai Ibnu al-Qasri, kemudian api mereka padam, kemudian mereka saling mendukung pada masa al-Mu'tasim dan berkorespondensi dengan al-Afshin dan bertemu dengan Babak, kemudian jumlah mereka bertambah menjadi tiga ratus ribu, sehingga al-Mu'tasim membunuh enam puluh ribu dari mereka dan membunuh al-Afshin juga, kemudian keadaan mereka stagnan, kemudian muncul sekelompok orang dari mereka, di antara mereka seorang pria dari keturunan Bahram Gur, dan mereka bertujuan untuk menghapus Islam dan memulihkan negara Persia, dan mereka mengangkat seorang pemimpin yang dikenal sebagai Ubayd Allah ibn Maymun, dan tingkatan mereka menurutnya adalah: pemula naik ke dakwah, kemudian menjadi saksi, kemudian ke imamat, kemudian dia mencapai suatu tingkatan... dan yang lebih maju di antara mereka adalah Mereka menggantikan Ma'd ibn Tamim ibn Isma'il ibn Ja'far al-Talibi setelah kematian mereka, dan semuanya adalah penerus Ma'd ibn Tamim ibn Isma'il ibn Ja'far al-Talibi, dan di antara para penyeru imam terdapat Ma'd ibn Tamim dan putranya Isma'il, dan merekalah yang merebut kendali atas wilayah Maghreb {kutip:muntazam-ibn-al-jawzi hlm. 119-120}"
