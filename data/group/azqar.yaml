summary:
  ar: "قبيلة من البربر رحالة في الصحراء، ذات إبل كثيرة وألبان غزيرة، ويذكر المؤلف عن أهل المغرب أنهم أعلم الناس بخط الرمل المنسوب إلى دانيال، وأنهم يستخرجون الأشياء الضائعة بالخط في الرمل {cite:nuzhat-al-mushtaq-2002 p. 112}، {cite:nuzhat-al-mushtaq-2002 p. 113}، {cite:nuzhat-al-mushtaq-2002 p. 114}."
  en: "A nomadic Berber tribe of the desert with many camels and rich milk. The author reports that people of the Maghreb consider them the most skilled in the sand-writing said to go back to Daniel, and that they find lost items by drawing in sand {cite:nuzhat-al-mushtaq-2002 p. 112}, {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 114}."
