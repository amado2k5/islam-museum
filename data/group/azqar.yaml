label: { ar: "آزقار", en: "Azqar", es: "Azqar", fr: "Azqar", ur: "ازقر" }
summary:
  ar: "قبيلة من البربر رحالة في الصحراء، ذات إبل كثيرة وألبان غزيرة، ويذكر المؤلف عن أهل المغرب أنهم أعلم الناس بخط الرمل المنسوب إلى دانيال، وأنهم يستخرجون الأشياء الضائعة بالخط في الرمل {cite:nuzhat-al-mushtaq-2002 p. 112}، {cite:nuzhat-al-mushtaq-2002 p. 113}، {cite:nuzhat-al-mushtaq-2002 p. 114}."
  en: "A nomadic Berber tribe of the desert with many camels and rich milk. The author reports that people of the Maghreb consider them the most skilled in the sand-writing said to go back to Daniel, and that they find lost items by drawing in sand {cite:nuzhat-al-mushtaq-2002 p. 112}, {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 114}."
  es: "Una tribu bereber nómada del desierto con muchos camellos y leche rica. El autor informa que la gente del Magreb los considera los más hábiles en la escritura en la arena que se dice que se remonta a Daniel, y que encuentran objetos perdidos dibujando en la arena {cite:nuzhat-al-mushtaq-2002 p. 112}, {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 114}."
  fr: "Une tribu berbère nomade du désert, possédant de nombreux chameaux et produisant un lait riche. L'auteur rapporte que les Maghrebiens les considèrent comme les plus habiles dans l'art de l'écriture sur sable, une pratique qui remonterait à Daniel, et qu'ils retrouvent des objets perdus en dessinant dans le sable {cite:nuzhat-al-mushtaq-2002 p. 112}, {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 114}."
  ur: "صحرا کا ایک خانہ بدوش بربر قبیلہ جس میں بہت سے اونٹ اور بھرپور دودھ ہے۔ مصنف نے رپورٹ کیا ہے کہ مغرب کے لوگ انہیں ریت کی تحریر میں سب سے زیادہ ماہر سمجھتے ہیں جس کے بارے میں کہا جاتا ہے کہ وہ دانیال کے پاس واپس جائیں، اور یہ کہ وہ ریت میں ڈرائنگ کرکے کھوئی ہوئی چیزیں تلاش کرتے ہیں۔ 112}، {حوالہ: نزہت المشتاق-2002 ص۔ 113}، {حوالہ: نزہت المشتاق-2002 ص۔ 114}۔"
