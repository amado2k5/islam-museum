summary:
  ar: "قناة دعوية كوردية ناطقة بالسورانية مقرّها العراق، تبثّ المحاضرات الدينية عبر القمر الصناعي — حيث تصنّفها قوائم القنوات الكوردية قناةً دينية ولا تسمّي مالكًا لها — وعبر فيسبوك، حيث بلغ عدد متابعي صفحتها 2.7 مليون متابع بحسب بيانات وصفية لمنشورات مؤرخة في 18 فبراير و23 مارس 2026 قُرئت في 9 نوفمبر 2026. لا تسمّي القناة مؤلفًا فردًا ولا مشغّلًا في أي مصدر قُرئ، فسُجّلت علامةَ قناة لا شخصًا. وهي قناة كوردية متميزة عن علامات المحاضرات البنغالية «بنغلا واز» في بنغلاديش رغم تشابه الأسماء بالحروف اللاتينية."
  en: "A Sorani Kurdish dawah-lecture broadcaster based in Iraq, carried on satellite — Kurdish channel lists class it as a religious channel and name no owner for it — and on Facebook, where its page counted 2.7 million followers by Facebook post metadata on posts dated 18 February and 23 March 2026, read on 9 November 2026. The channel names no individual author or operator in any source read, and it is recorded as a channel brand rather than a person. It is a Kurdish broadcaster, distinct from the Bengali 'Bangla Waz' lecture brands of Bangladesh despite the similar romanised names."
  ur: "عراق میں قائم سورانی کوردی دعوتی لیکچر براڈکاسٹر، جو سیٹلائٹ پر نشر ہوتا ہے — کوردی چینل فہرستیں اسے مذہبی چینل قرار دیتی ہیں اور اس کا کوئی مالک نامزد نہیں کرتیں — اور فیس بک پر، جہاں اس کے پیج کے فالوورز 18 فروری اور 23 مارچ 2026ء کی پوسٹوں کے میٹا ڈیٹا کے مطابق 2.7 ملین تھے، جو 9 نومبر 2026ء کو پڑھا گیا۔ کسی بھی مأخذ میں چینل کسی انفرادی مصنف یا منتظم کا نام نہیں لیتا، اس لیے اسے کسی شخص کے بجائے چینل برانڈ کے طور پر درج کیا گیا ہے۔ یہ بنگلہ دیش کے بنگالی «بنگلا واز» لیکچر برانڈز سے الگ ایک کوردی براڈکاسٹر ہے، اگرچہ رومن حروف میں نام ملتے جلتے ہیں۔"
