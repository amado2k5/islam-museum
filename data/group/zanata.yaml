label:
  ar: زناتة
  en: Zanata
summary:
  ar: "زناتة من أكبر قبائل البربر؛ من بطون البرانس عند نسابتهم، مواطنهم المغرب الأوسط والأقصى وسجلماسة وضواحيها وكانوا ظواعن آهلين، وقامت لهم طبقات: الأولى مغراوة وبنو يفرن ومكناسة، والثانية أولاد منديل ومصامدة ومن إليهم، والثالثة بنو بادين ومنهم بنو توجين وبنو مرين ملوك فاس وبنو عبد الواد ملوك تلمسان، ومنهم خرج أبو يزيد صاحب الحمار على الدولة العبيدية، ودانت أيامهم بالدعوة المروانية تارة وبالشيعية أخرى إلى أن ظهرت دولة المرابطين."
  en: "Zanata, among the greatest Berber tribes; of the Baranis stock in the genealogists' count, their homeland the Middle and Far Maghreb, Sijilmasa and its marches, tent-dwellers and settlers both — their tiers: the first Maghrawa, Banu Yafran and Miknasa; the second Awlad Mandil, Musamida and their kin; the third Banu Badin including Banu Tujin and the royal houses of the Marinids of Fez and Abd al-Wadids of Tlemcen — from them rose Abu Yazid 'Man of the Donkey' against the Fatimids, and they obeyed by turns the Marwanid and Fatimid da'wa until the Almoravid state arose."
