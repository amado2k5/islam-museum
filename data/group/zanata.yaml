summary:
  ar: "زناتة من أكبر قبائل البربر؛ من بطون البرانس عند نسابتهم، مواطنهم المغرب الأوسط والأقصى وسجلماسة وضواحيها وكانوا ظواعن آهلين، وقامت لهم طبقات: الأولى مغراوة وبنو يفرن ومكناسة، والثانية أولاد منديل ومصامدة ومن إليهم، والثالثة بنو بادين ومنهم بنو توجين وبنو مرين ملوك فاس وبنو عبد الواد ملوك تلمسان، ومنهم خرج أبو يزيد صاحب الحمار على الدولة العبيدية، ودانت أيامهم بالدعوة المروانية تارة وبالشيعية أخرى إلى أن ظهرت دولة المرابطين."
  en: "Zanata, among the greatest Berber tribes; of the Baranis stock in the genealogists' count, their homeland the Middle and Far Maghreb, Sijilmasa and its marches, tent-dwellers and settlers both — their tiers: the first Maghrawa, Banu Yafran and Miknasa; the second Awlad Mandil, Musamida and their kin; the third Banu Badin including Banu Tujin and the royal houses of the Marinids of Fez and Abd al-Wadids of Tlemcen — from them rose Abu Yazid 'Man of the Donkey' against the Fatimids, and they obeyed by turns the Marwanid and Fatimid da'wa until the Almoravid state arose."
  es: "Zanata, una de las tribus bereberes más importantes; del linaje Baranis según los genealogistas, su tierra natal el Magreb Medio y Lejano, Sijilmasa y sus fronteras, habitantes de tiendas y sedentarios por igual; sus estratos: el primero Maghrawa, Banu Yafran y Miknasa; el segundo Awlad Mandil, Musamida y sus parientes; el tercero Banu Badin, incluyendo Banu Tujin y las casas reales de los Marinids de Fez y Abd al-Wadids de Tlemcen; de ellos surgió Abu Yazid 'Hombre del Burro' contra los fatimíes, y obedecieron alternativamente la da'wa marwaní y fatimí hasta que surgió el estado almorávide."
  fr: "Les Zanata, parmi les plus grandes tribus berbères; de la souche Baranis selon les généalogistes, leur patrie le Maghreb moyen et lointain, Sijilmassa et ses marches, habitants de tentes et sédentaires à la fois — leurs différents niveaux: le premier Maghrawa, Banu Yafran et Miknasa; le deuxième Awlad Mandil, Musamida et leurs proches; le troisième Banu Badin, y compris Banu Tujin et les maisons royales des Mérinides de Fès et des Abd al-Wadids de Tlemcen — d'eux est sorti Abu Yazid « l'Homme à l'Âne » contre les Fatimides, et ils ont obéi tour à tour à la da'wa marwanide et fatimide jusqu'à l'avènement de l'État almoravide."
  ur: "زناٹا، بربر کے عظیم ترین قبائل میں سے؛ نسب ناموں کی گنتی میں بارانیوں کا ذخیرہ، ان کا وطن مشرق اور دور مغرب، سجلماسا اور اس کے مارچ، خیمہ میں رہنے والے اور آباد کرنے والے دونوں - ان کے درجے: پہلا مغروا، بنو یفران اور مکناسہ؛ دوسرا اولاد منڈیل، مسامدہ اور ان کے رشتہ دار؛ تیسرا بنو بدین جس میں بنو توجین اور فیز کے مرینیوں کے شاہی گھرانوں اور تلمسن کے عبد الودیدس - ان میں سے ابو یزید 'گدھے کا آدمی' فاطمیوں کے خلاف کھڑا ہوا، اور انہوں نے مروانی اور فاطمی دعوے کی تعمیل کی یہاں تک کہ الموراوی ریاست قائم ہو گئی۔"
