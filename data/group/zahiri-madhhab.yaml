  en: "The Zahiri school (madhhab)"
summary:
  ar: "المذهب الذي استقل به داود بن علي الأصبهاني بعد تعصبه للشافعي، وتبعه كثير من الناس خصوصاً في فارس والأندلس؛ موقفه موقف النقيض من الحنفية: ينكر القياس ويرى أن في القرآن والحديث وعموماتهما ما يكفي لبيان الأحكام فيتمسك بظاهر الكتاب والسنة ومنه اشتُق الاسم، ويرى أن القول بالقياس تشريع عقلي والدين إلهي، ولو كان الدين بالعقل لجرت أحكام على خلاف ما أتى به الكتاب والسنة، ولا يبيح القياس إلا إذا ورد نص بتحريم أو تحليل بُني فيه على علة، فحينئذ يُشرك في الحكم ما اتّحد في العلة؛ وأضيق المذاهب مجالاً للتشريع إذ أكبر مناحي الاجتهاد — القياس — منكور عندهم {cite:duha-islam p. 567-568}."
  en: "Dawud ibn Ali al-Isbahani's school — literalist, rejecting qiyas outright: God legislated, not reason; smallest of the circles of ra'y, strongest in Persia and al-Andalus {cite:duha-islam p. 567-568}."
