tags: [madhahib-browser, mh-ukhra]
label:
  ar: المذهب الظاهري
  en: "The Zahiri school (madhhab)"
  es: "La escuela Zahiri (Madhhab)"
  fr: "L'école Zahiri (Madhhab)"
  ur: "ظاہری مکتب ⁦(مذہب)⁩"
  tr: "Kelimeci okul"
  id: "Aliran literalist"
summary:
  ar: "المذهب الذي استقل به داود بن علي الأصبهاني بعد تعصبه للشافعي، وتبعه كثير من الناس خصوصاً في فارس والأندلس؛ موقفه موقف النقيض من الحنفية: ينكر القياس ويرى أن في القرآن والحديث وعموماتهما ما يكفي لبيان الأحكام فيتمسك بظاهر الكتاب والسنة ومنه اشتُق الاسم، ويرى أن القول بالقياس تشريع عقلي والدين إلهي، ولو كان الدين بالعقل لجرت أحكام على خلاف ما أتى به الكتاب والسنة، ولا يبيح القياس إلا إذا ورد نص بتحريم أو تحليل بُني فيه على علة، فحينئذ يُشرك في الحكم ما اتّحد في العلة؛ وأضيق المذاهب مجالاً للتشريع إذ أكبر مناحي الاجتهاد — القياس — منكور عندهم {cite:duha-islam p. 567-568}."
  en: "Dawud ibn Ali al-Isbahani's school — literalist, rejecting qiyas outright: God legislated, not reason; smallest of the circles of ra'y, strongest in Persia and al-Andalus {cite:duha-islam p. 567-568}."
  es: "La escuela de Dawud ibn Ali al-Isbahani: literalista, que rechaza rotundamente las qiyas: Dios legisló, no la razón; el más pequeño de los círculos de ra'y, más fuerte en Persia y al-Andalus {cita:duha-islam p. 567-568}."
  fr: "L'école de Dawud ibn Ali al-Isbahani — littéraliste, rejetant catégoriquement les qiyas: Dieu a légiféré, pas la raison; le plus petit des cercles de ra'y, le plus fort en Perse et en al-Andalus {cite:duha-islam p. 567-568}."
  ur: "داؤد بن علی الاسبہانی کا مکتب - لغوی، قیاس کو یکسر مسترد کرنا: خدا نے قانون بنایا، عقل نہیں؛ رعی کے حلقوں میں سب سے چھوٹا، فارس اور اندلس میں سب سے مضبوط۔ 567-568}۔"
  tr: "Davud ibn Ali el-İsfahani'nin Şafiî mezhebinden sonra benimsediği ve özellikle İran ve Endülüs'te birçok kişinin takip ettiği düşünce ekolü, Hanefilerin tam tersi bir görüşe sahiptir: kıyası reddeder ve Kur'an ile hadislerin ve bunların genel hükümlerinin hükümleri açıklamak için yeterli olduğuna inanır; bu nedenle Kitap ve Sünnetin zahiri anlamına bağlı kalır ve adı da buradan gelir. Kıyaslamanın akılcı bir yasa olduğuna ve dinin ilahi olduğuna inanır; eğer din akla dayalı olsaydı, Kitap ve Sünnette gelenlere aykırı hükümler verilirdi. Bir yasaklama veya izin metni varsa ve buna bir sebep dayanıyorsa, kıyasa izin verir; bu durumda sebepte birleşen şey hükme dahil edilir. İçtihatın en önemli yönü olan kıyası reddettiği için, yasama açısından en dar görüşlü ekoldür. {alıntı:duha-islam s. 567-568}."
  id: "Mazhab yang dianut Dawud ibn Ali al-Isfahani setelah fanatismenya terhadap al-Shafi’i, dan yang diikuti banyak orang, terutama di Persia dan Andalusia, memiliki posisi yang berlawanan dengan mazhab Hanafi: mazhab ini menolak analogi dan meyakini bahwa Al-Qur'an dan hadits serta generalisasinya sudah cukup untuk menjelaskan hukum-hukum, sehingga berpegang pada makna yang tampak dari Kitab dan Sunnah, dan dari situlah nama mazhab ini berasal. Mazhab ini meyakini bahwa berbicara tentang analogi adalah legislasi yang rasional dan agama adalah ilahi, dan jika agama didasarkan pada akal, maka hukum-hukum akan dikeluarkan bertentangan dengan apa yang terdapat dalam Kitab dan Sunnah. Mazhab ini tidak memperbolehkan analogi kecuali jika ada teks larangan atau izin yang didasarkan pada alasan, sehingga apa yang disatukan dalam alasan tersebut termasuk dalam hukum. Mazhab ini adalah mazhab yang paling sempit dalam hal legislasi, karena aspek terbesar ijtihad — analogi — ditolak oleh mereka {cite:duha-islam p. 567-568}."
