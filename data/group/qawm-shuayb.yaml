label:
  ar: "قوم شعيب (أصحاب الأيكة ومَديَن)"
  en: "The people of Shu'ayb (Madyan and al-Ayka)"
  ur: "قوم شعیب"
summary:
  ar: "قوم شعيب في القرآن أهل مدين وأصحاب الأيكة الذين أرسل إليهم شعيب فنهاهم عن تطفيف الكيل والميزان والإفساد في الأرض فكذبوه فأخذتهم الرجفة وعذاب يوم الظلة؛ القرآن يقص خبرهم في الأعراف وهود والشعراء والحجر والعنكبوت وق {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  en: "The people of Shu'ayb in the Qur'an are the dwellers of Madyan and the Companions of the Ayka, to whom Shu'ayb was sent forbidding short measure and corruption in the land; they denied him, so the earthquake and the torment of the Day of Shadow took them. The Qur'an tells them in al-A'raf, Hud, al-Shu'ara', al-Hijr, al-'Ankabut and Qaf {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  ur: "قوم شعیب قرآن میں مدین کے باشندے اور اصحابِ ایکہ ہیں جن پر شعیب بھیجے گئے تاکہ ناپ تول میں کمی اور زمین میں فساد سے روکیں؛ انہوں نے جھٹلایا تو زلزلے اور سائے والے دن کے عذاب نے پکڑا؛ قرآن ان کا قصہ اعراف، ہود، شعراء، حجر، عنکبوت اور ق میں بیان کرتا ہے۔"
