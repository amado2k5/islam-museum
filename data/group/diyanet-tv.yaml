label: { ar: "ديانت تي في", en: "Diyanet TV", ur: "دیانت ٹی وی", es: "Televisión Diyanet", fr: "Diyanet TV", tr: "Diant TV", id: "Diant TV" }
summary:
  ar: "قناة ديانت تي في، وهي محطة تلفزيونية تركية تملكها وتديرها رئاسة الشؤون الدينية في تركيا، أسسها في 2012 كل من TRT والرئاسة وبدأت بثها المنتظم في 8 يوليو 2013 من مقرها في تشانكايا بأنقرة؛ بلغ عدد مشتركي قناتها على يوتيوب ⁦(@diyanettv)⁩ 1,670,000 مشترك وعدد مشاهداتها 701,796,406 مشاهدات في 45,440 مقطعًا بحسب عدّاد vidIQ كما في 6 نوفمبر 2026. تُفهرس هنا بوصفها جهة بث فقط، دون أي لغة تأييد."
  en: "Diyanet TV, a Turkish television station owned and operated by the Presidency of Religious Affairs of Turkey, founded in 2012 by TRT and the Presidency and broadcasting regularly from 8 July 2013 from its headquarters in Çankaya, Ankara; its YouTube channel (@diyanettv) counted 1,670,000 subscribers, 701,796,406 views and 45,440 videos by vidIQ's count as of 6 November 2026. It is catalogued here as a broadcaster only, with no endorsement language."
  ur: "دیانت ٹی وی، ایک ترک ٹیلی ویژن اسٹیشن جس کی مالک اور منتظم ترکی کی صدارتِ مذہبی امور ہے، جسے 2012ء میں TRT اور صدارت نے قائم کیا اور جس کی باقاعدہ نشریات 8 جولائی 2013ء سے چانکایا، انقرہ میں اس کے صدر دفتر سے شروع ہوئیں؛ اس کی یوٹیوب چینل ⁦(@diyanettv)⁩ کے سبسکرائبرز 1,670,000، ویوز 701,796,406 اور ویڈیوز 45,440 تھے، 6 نومبر 2026ء کے vidIQ شمار کے مطابق۔ اسے یہاں صرف ایک براڈکاسٹر کے طور پر درج کیا گیا ہے، بغیر کسی تائیدی زبان کے۔"
  es: "Diyanet TV, una cadena de televisión turca propiedad de la Presidencia de Asuntos Religiosos de Turquía, fue fundada en 2012 por TRT y la Presidencia y emite regularmente desde el 8 de julio de 2013 desde su sede en Çankaya, Ankara. Su canal de YouTube (@diyanettv) contaba con 1.670.000 suscriptores, 701.796.406 visualizaciones y 45.440 vídeos, según datos de vidIQ al 6 de noviembre de 2026. Aquí se la cataloga únicamente como emisora, sin ningún tipo de respaldo."
  fr: "Diyanet TV, chaîne de télévision turque détenue et gérée par la Direction des affaires religieuses de Turquie, a été fondée en 2012 par TRT et la Direction et diffuse régulièrement depuis le 8 juillet 2013 depuis son siège à Çankaya, Ankara. Sa chaîne YouTube (@diyanettv) comptait 1 670 000 abonnés, 701 796 406 vues et 45 440 vidéos, selon le décompte de vidIQ au 6 novembre 2026. Elle est répertoriée ici uniquement comme diffuseur, sans mention de son contenu."
  tr: "Türkiye Diyanet İşleri Başkanlığı'na ait ve onun tarafından işletilen bir Türk televizyon kanalı olan Diyanet TV, 2012 yılında TRT ve Cumhurbaşkanlığı tarafından kurulmuş ve 8 Temmuz 2013'te Ankara Çankaya'daki genel merkezinden düzenli yayınlarına başlamıştır. 6 Kasım 2026 tarihi itibariyle vidIQ sayacına göre YouTube kanalı (@diyanettv) 1.670.000 aboneye ve 45.440 videoda 701.796.406 görüntülemeye sahipti. Burada sadece yayıncı olarak, dil desteği olmadan indekslenmiştir."
  id: "Diyanet TV, sebuah stasiun televisi Turki yang dimiliki dan dioperasikan oleh Kepresidenan Urusan Agama di Turki, didirikan pada tahun 2012 oleh TRT dan Kepresidenan dan mulai melakukan siaran reguler pada 8 Juli 2013 dari kantor pusatnya di Çankaya, Ankara. Saluran YouTube-nya (@diyanettv) memiliki 1.670.000 pelanggan dan 701.796.406 penayangan di 45.440 video menurut penghitung vidIQ per 6 November 2026. Diindeks di sini hanya sebagai penyiar, tanpa dukungan bahasa apa pun."
