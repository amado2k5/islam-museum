summary:
  ar: "جامعة إسلامية حكومية في جاكرتا. ألقى فيها الإمام الأكبر يوم 23 فبراير 2016م خطابه الموجه إلى المسلمين في آسيا والعالم، وذكر رئيسها أن دراسة الجامعة تسير على مناهج كليات الأزهر {cite:rihla-imam-akbar-indonesia-azhar p. 79}."
  en: "State Islamic university in Jakarta, where the Grand Imam gave his address to Muslims in Asia and the world on 23 February 2016; its rector said the curriculum follows Al-Azhar's faculties."
  es: "La Universidad Estatal Islámica de Yakarta, donde el Gran Imán pronunció su discurso a los musulmanes de Asia y del mundo el 23 de febrero de 2016, tiene como rector un programa de estudios que sigue el de las facultades de Al-Azhar."
  fr: "L'université islamique d'État de Jakarta, où le Grand Imam a prononcé son discours aux musulmans d'Asie et du monde le 23 février 2016; son recteur a déclaré que le programme d'études suit celui des facultés d'Al-Azhar."
  ur: "جکارتہ میں ریاستی اسلامی یونیورسٹی، جہاں 23 فروری 2016 کو عظیم الشان امام نے ایشیا اور دنیا کے مسلمانوں سے خطاب کیا۔ اس کے ریکٹر نے کہا کہ نصاب الازہر کی فیکلٹی کے مطابق ہے۔"
  tr: "Cakarta'da bulunan devlet tarafından işletilen bir İslami üniversite. Büyük İmam, 23 Şubat 2016'da burada Asya ve dünyadaki Müslümanlara hitaben bir konuşma yaptı. Üniversite rektörü, üniversitenin müfredatının El-Azhar Üniversitesi'nin öğretim yöntemlerini izlediğini belirtti. {cite:rihla-imam-akbar-indonesia-azhar s. 79}"
  id: "Sebuah universitas Islam negeri di Jakarta. Imam Besar menyampaikan pidatonya kepada umat Islam di Asia dan dunia di sana pada tanggal 23 Februari 2016. Rektor universitas tersebut menyatakan bahwa kurikulum universitas tersebut mengikuti metode pengajaran Universitas Al-Azhar {cite:rihla-imam-akbar-indonesia-azhar p. 79}."
