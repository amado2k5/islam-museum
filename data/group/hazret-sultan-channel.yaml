summary:
  ar: "القناة الرسمية على يوتيوب (@aziretsultanmosque) لمسجد حضرت سلطان في أستانا، المسجد الوطني لكازاخستان الذي افتُتح في 6 يوليو 2012. أُنشئت القناة في 13 يونيو 2012 مع اكتمال بناء المسجد، وتنشر دروس القرآن والتجويد وسلاسل التفسير وأحاديث الفقه والمواعظ، منها سلسلة محاضرات لإمام المسجد إربولات جوسيبوف، وبلغ عدد مشتركيها نحو 406 آلاف مشترك بحسب عدّاد vidIQ المقروء في 5 نوفمبر 2026، وهو رقم منصّة مؤرّخ. ويضمّ المسجد استوديو «حكمت» التلفزيوني الإذاعي وهيئة تحرير موقع Muslim.kz، وهي الجهة الإعلامية الداخلية التي تقف وراء بثّه."
  en: "The official YouTube channel (@aziretsultanmosque) of the Hazret Sultan Mosque in Astana, Kazakhstan's national mosque, inaugurated on 6 July 2012. The channel was created on 13 June 2012, as the mosque was being completed, and publishes Qur'an and tajwid lessons, tafsir series, fiqh talks and sermons — among them a lecture series by the mosque's imam Erbolat Zhusipov — and counted about 406 thousand subscribers by vidIQ's count read on 5 November 2026, a dated platform figure. The mosque houses the Hikmet television and radio studio and the Muslim.kz editorial office, the in-house media operation behind its broadcasts."
  ur: "حضرت سلطان مسجد، آستانہ — قازقستان کی قومی مسجد جو 6 جولائی 2012ء کو کھلی — کی آفیشل یوٹیوب چینل (@aziretsultanmosque)۔ یہ چینل 13 جون 2012ء کو اس وقت بنائی گئی جب مسجد مکمل ہو رہی تھی؛ یہ قرآن و تجوید کے اسباق، تفسیر کی سلسلہ وار محاضرات، فقہی گفتگوئیں اور وعظ شائع کرتی ہے، جن میں مسجد کے امام ایربولات جوسیپوف کی لیکچر سیریز بھی شامل ہے؛ اس کے اراکین کی تعداد vidIQ کے 5 نومبر 2026ء کو پڑھے گئے شمار کے مطابق تقریباً 406 ہزار تھی، جو ایک مؤرخہ پلیٹ فارم عدد ہے۔ مسجد میں «حکمت» ٹیلی ویژن و ریڈیو اسٹوڈیو اور Muslim.kz کا ادارہ بھی واقع ہے، جو اس کی نشریات کے پیچھے اس کا اندرونِ خانہ میڈیا شعبہ ہے۔"
