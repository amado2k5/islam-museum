label: { en: Banu Zubayd, ar: "بنو زبيد" }
summary:
  ar: "قبيلة يمانية من مذحج؛ قدم منها عمرو بن معدي كرب في أناس منها على النبي فأسلم، وكانت تحت ولاية فروة بن مسيك مع مراد ومذحج، وارتد عمرو فيها بعد وفاة النبي. وذكر ابن إسحاق أن محمية بن الجزء منها حليف لبني سهم."
  en: "A Yemeni tribe of Madhhij; Amr ibn Ma'dikarib came from it with a party to the Prophet and embraced Islam, it was placed under Farwa ibn Musayk with Murad and Madhhij, and Amr apostatised among it after the Prophet's death. Ibn Ishaq also records that Muhayyisa ibn al-Juzu' of it was an ally of Banu Sahm."
