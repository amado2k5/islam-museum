id: group/banu-zubayd
class: group
label: { en: Banu Zubayd, ar: "بنو زبيد", es: "Banu Zubayd", fr: "Banu Zubayd" }
summary:
  ar: "قبيلة يمانية من مذحج؛ قدم منها عمرو بن معدي كرب في أناس منها على النبي فأسلم، وكانت تحت ولاية فروة بن مسيك مع مراد ومذحج، وارتد عمرو فيها بعد وفاة النبي. وذكر ابن إسحاق أن محمية بن الجزء منها حليف لبني سهم."
  en: "A Yemeni tribe of Madhhij; Amr ibn Ma'dikarib came from it with a party to the Prophet and embraced Islam, it was placed under Farwa ibn Musayk with Murad and Madhhij, and Amr apostatised among it after the Prophet's death. Ibn Ishaq also records that Muhayyisa ibn al-Juzu' of it was an ally of Banu Sahm."
  es: "Una tribu yemení de Madhhij; Amr ibn Ma'dikarib provenía de ella con un grupo que siguió al Profeta y abrazó el Islam. Fue puesta bajo el mando de Farwa ibn Musayk junto con Murad y Madhhij, y Amr apostó entre ellos tras la muerte del Profeta. Ibn Ishaq también registra que Muhayyisa ibn al-Juzu', de esta tribu, fue aliado de Banu Sahm."
  fr: "Une tribu yéménite de Madhhij; Amr ibn Ma'dikarib, issu de cette tribu, vint se convertir à l'islam avec le Prophète. Cette tribu fut placée sous l'autorité de Farwa ibn Musayk, aux côtés de Murad et des Madhhij. Après la mort du Prophète, Amr apostasia parmi les siens. Ibn Ishaq rapporte également que Muhayyisa ibn al-Juzu', membre de cette tribu, était un allié des Banu Sahm."
