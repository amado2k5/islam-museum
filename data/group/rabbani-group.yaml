summary:
  ar: "فرقة نشيد ماليزية تأسست في كوالالمبور في 1 مارس 1997 بثلاثة عشر عضوا بقيادة محمد أسري إبراهيم، تمزج النشيد شبه التقليدي بعناصر حديثة؛ باع ألبومها الأول أكثر من تسعين ألف نسخة، وتوفي قائدها في 13 أغسطس 2009، ولها ثلاثة عشر ألبوم استوديو بين 1997 و2016."
  en: "A Malaysian nasheed group founded in Kuala Lumpur on 1 March 1997 with thirteen members led by Mohammed Asri Ibrahim, mixing quasi-traditional nasheed with modern elements; its first album sold more than 90,000 copies, its leader died on 13 August 2009, and it released thirteen studio albums between 1997 and 2016."
  ur: "یکم مارچ 1997 کو کوالالمپور میں محمد اسری ابراہیم کی قیادت میں تیرہ ارکان کے ساتھ قائم ہونے والا ملائیشیائی نشید گروپ، جو نیم روایتی نشید کو جدید عناصر سے ملاتا ہے؛ اس کا پہلا البم نوے ہزار سے زیادہ بکا اور اس کے قائد 13 اگست 2009 کو انتقال کر گئے۔"
