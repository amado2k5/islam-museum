summary:
  ar: "دولة زناتة بالمغرب الأوسط؛ أسسها يغمراسن بن زيان بتلمسان وحاصرها ثمان سنين ثم دخلها وتسمى بالمعتضد، واستمرت دولتهم بعده بين بني مرين بالمغرب والحفصيين بإفريقية إلى أن ذهب أثرهم {cite:tarikh-ibn-khaldun-ibar p. 1707}."
  en: "The Zanata dynasty of the central Maghreb; Yaghmurasan b. Ziyyan besieged Tlemcen eight years then took it as al-Mu'tadid, and his house ruled between the Marinids and Hafsids until their trace faded {cite:tarikh-ibn-khaldun-ibar p. 1707}."
  es: "La dinastía Zanata del Magreb central; Yaghmurasan b. Ziyyan asedió Tlemcen durante ocho años y luego la tomó como al-Mu'tadid, y su casa gobernó entre los Mariníes y los Hafsíes hasta que su rastro se desvaneció {cite:tarikh-ibn-khaldun-ibar p. 1707}."
  fr: "La dynastie Zanata du Maghreb central; Yaghmurasan b. Ziyyan assiégea Tlemcen pendant huit ans, puis la prit comme al-Mu'tadid, et sa maison régna entre les Mérinides et les Hafsides jusqu'à ce que leur trace disparaisse {cite:tarikh-ibn-khaldun-ibar p. 1707}."
  ur: "وسطی مغرب کی زناتا خاندان؛ یغموراسن بی۔ زیان نے تلمسن کا آٹھ سال تک محاصرہ کیا پھر اسے المتدید کے طور پر لے لیا، اور اس کے گھر نے مرینیوں اور حفصیوں کے درمیان حکومت کی یہاں تک کہ ان کا نشان ختم نہ ہو گیا۔ 1707}۔"
  tr: "Orta Mağrip'teki Zenata devleti; Yaghmurasen bin Zayan tarafından Tlemcen'de kurulmuş, sekiz yıl boyunca kuşatma altında tutulmuş, daha sonra şehre girmiş ve Al-Mu'tadid olarak adlandırılmıştır. Bu devlet, ondan sonra Mağrip'teki Banu Marin ile İfrikiye'deki Hafsidler arasında varlığını sürdürmüş ve izleri kaybolana kadar devam etmiştir. {Kaynak:tarikh-ibn-khaldun-ibar s. 1707}"
  id: "Negara Zenata di Maghreb tengah; negara ini didirikan oleh Yaghmurasen bin Zayan di Tlemcen, dan ia mengepungnya selama delapan tahun, kemudian memasukinya dan disebut Al-Mu’tadid. Negara mereka berlanjut setelahnya di antara Banu Marin di Maghreb dan Hafsid di Ifriqiya hingga jejak mereka menghilang {cite:tarikh-ibn-khaldun-ibar p. 1707}."
