id: group/khurramiyya
class: group
kind: sect
label: { ar: "الخرمية", en: "The Khurramiyya" }
summary:
  ar: "الخرمية مذاهب في نيابة الإله وتناول اللذات والانعكاف على بلوغ الشهوات والأكل والشرب والمواساة والاختلاط وترك الاستبداد بعضهم على بعض، ولهم مشاركة في الحرم والأهل لا يمتنع الواحد منهم من حرمة الآخر، ومع هذه الحال يرون أفعال الخير وترك القتل وإدخال الآلام على النفوس، وهم مذهب في الضيافات ليس لأحد من الأمم: إذا أضافوا الإنسان لم يمنعوه من شيء يلتمسه كائنا ما كان، وعلى هذا المذهب مزدك الأخير الذي ظهر في أيام قباد بن فيروز وقتله أنوشروان، وأما الخرمية البابكية فأن صاحبهم بابك الخرمي كان يقول لمن استغواه إنه إله وأحدث في مذاهبهم القتل والغضب والحروب والمثلة ولم يكن الخرمية يعرفون ذلك {cite:fihrist-ibn-al-nadim p. 479-481}."
  en: "The Khurrami creed of hospitality, shared intimacy and anti-violence — and how Babak added bloodshed to it {cite:fihrist-ibn-al-nadim p. 479-481}."
