label: { ar: "الخرمية", en: "The Khurramiyya", es: "La Khurramiyya", fr: "Les Khurramiyya", ur: "خرمیہ", tr: "Khurramiyya", id: "Khurramiyya" }
summary:
  ar: "الخرمية مذاهب في نيابة الإله وتناول اللذات والانعكاف على بلوغ الشهوات والأكل والشرب والمواساة والاختلاط وترك الاستبداد بعضهم على بعض، ولهم مشاركة في الحرم والأهل لا يمتنع الواحد منهم من حرمة الآخر، ومع هذه الحال يرون أفعال الخير وترك القتل وإدخال الآلام على النفوس، وهم مذهب في الضيافات ليس لأحد من الأمم: إذا أضافوا الإنسان لم يمنعوه من شيء يلتمسه كائنا ما كان، وعلى هذا المذهب مزدك الأخير الذي ظهر في أيام قباد بن فيروز وقتله أنوشروان، وأما الخرمية البابكية فأن صاحبهم بابك الخرمي كان يقول لمن استغواه إنه إله وأحدث في مذاهبهم القتل والغضب والحروب والمثلة ولم يكن الخرمية يعرفون ذلك {cite:fihrist-ibn-al-nadim p. 479-481}."
  en: "The Khurrami creed of hospitality, shared intimacy and anti-violence — and how Babak added bloodshed to it {cite:fihrist-ibn-al-nadim p. 479-481}."
  es: "El credo Khurrami de hospitalidad, intimidad compartida y antiviolencia, y cómo Babak le añadió derramamiento de sangre {cite:fihrist-ibn-al-nadim p. 479-481}."
  fr: "Le credo Khurrami d’hospitalité, d’intimité partagée et d’antiviolence — et comment Babak y a ajouté l’effusion de sang {cite:fihrist-ibn-al-nadim p. 479-481}."
  ur: "مہمان نوازی کا خرمی عقیدہ، مشترکہ قربت اور تشدد مخالف — اور بابک نے اس میں کس طرح خونریزی کا اضافہ کیا۔ 479-481}۔"
  tr: "Haramîler, Allah'ın vekilliği, zevklere düşkünlük, arzuların peşinden koşma, yeme içme, teselli bulma, kaynaşma ve birilerinin diğerleri üzerindeki zulmünden vazgeçme konularında doktrinlere sahiptirler. Kutsal mekânı ve aileyi paylaşırlar ve hiçbiri diğerinin kutsallığını ihlal etmekten alıkonulmaz. Buna rağmen, iyi ameller işlemeye ve öldürmekten, canlara acı çektirmekten kaçınmaya inanırlar. Başka hiçbir millette bulunmayan bir misafirperverlik doktrinine sahiptirler: Birini misafir ettiklerinde, ne isterse istesin, onu hiçbir şeyden alıkoymazlar. Kubad ibn Firuz zamanında ortaya çıkan ve Anuşirvan tarafından öldürülen son Mazdak da bu doktrini izlemiştir. Babakici Haramîlere gelince, liderleri Babak el-Harramî, baştan çıkardığı kişilere kendisinin bir tanrı olduğunu söylerdi ve Haramîlerin bilmediği öldürme, öfke, savaş ve sakatlama gibi öğretileri onların inançlarına soktu. {cite:fihrist-ibn-al-nadim s. 479-481}"
  id: "Ajaran Khurramiyah berkaitan dengan perwakilan Tuhan, menikmati kesenangan, dan mengejar keinginan, makan, minum, menghibur, bergaul, dan meninggalkan tirani sebagian orang atas yang lain. Mereka berbagi tempat suci dan keluarga, dan tidak ada satu pun dari mereka yang dilarang melanggar kesucian orang lain. Meskipun demikian, mereka percaya pada perbuatan baik dan menahan diri dari membunuh dan menyiksa jiwa. Mereka memiliki ajaran keramahan yang tidak ditemukan di bangsa lain: jika mereka menjamu seseorang, mereka tidak menghalangi orang tersebut dari apa pun yang dimintanya, apa pun itu. Mazdak terakhir, yang muncul pada masa Qubad ibn Firuz dan dibunuh oleh Anushirvan, mengikuti ajaran ini. Adapun Khurramiyah Babakiyah, pemimpin mereka Babak al-Khurrami biasa mengatakan kepada orang-orang yang dirayunya bahwa dia adalah tuhan, dan dia memasukkan ke dalam ajaran mereka pembunuhan, kemarahan, perang, dan mutilasi, yang tidak dikenal oleh Khurramiyah. {mengutip:fihrist-ibn-al-nadim hal. 479-481}."
