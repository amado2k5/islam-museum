summary:
  ar: "المغول، أهل منغوليا وما جاورها؛ غزت جحافلهم بلاد الإسلام في القرن السابع الهجري فهدمت بغداد، كما يقص ابن الأثير في الكامل. بطاقة أولية وردت من وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩ ولم تُراجع على صفحات المصدر بعد."
  en: "The Mongols — the people of Mongolia and its neighbours whose hosts swept the Islamic lands in the seventh Hijri century and brought down Baghdad, as Ibn al-Athir narrates in al-Kamil. Draft card from an open reference description (Wikidata); not yet checked on the source page."
  es: "Los mongoles —los habitantes de Mongolia y sus vecinos, cuyas huestes arrasaron las tierras islámicas en el siglo VII de la Hégira y derrocaron Bagdad, como narra Ibn al-Athir en al-Kamil. Boceto de ficha de una descripción de referencia abierta (Wikidata); aún no verificado en la página de origen."
  fr: "Les Mongols — peuple de Mongolie et de ses voisins — dont les armées ont envahi les terres islamiques au VIIe siècle de l'Hégire et conquis Bagdad, comme le relate Ibn al-Athir dans al-Kamil. Fiche provisoire issue d'une description de référence ouverte (Wikidata); non encore vérifiée sur la page source."
  ur: "منگول - منگولیا کے لوگ اور اس کے ہمسایہ ممالک جن کے میزبانوں نے ساتویں ہجری صدی میں اسلامی سرزمین پر قبضہ کیا اور بغداد کو گرا دیا جیسا کہ ابن الثیر نے الکامل میں بیان کیا ہے۔ ایک کھلے حوالہ کی تفصیل سے ڈرافٹ کارڈ ⁦(وکی ڈیٹا)⁩؛ ابھی تک سورس پیج پر چیک نہیں کیا گیا۔"
