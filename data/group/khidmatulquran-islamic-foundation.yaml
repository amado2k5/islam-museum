label: { ar: "مؤسسة خدمة القرآن الإسلامية", en: "Khidmatulquran Islamic Foundation", ur: "خدمت القرآن اسلامک فاؤنڈیشن" }
summary:
  ar: "مؤسسة تنزانية غير ربحية يرأسها الشيخ علي محمد صالح، تُنظّم مسابقات تجويد القرآن في تنزانيا منذ 2004 — بدءًا من مسابقة أسّسها منظّموها في مسجد إدريسا، فمسابقة شرق أفريقيا للتجويد منذ 2008، ثم مسابقات دولية للتلاوة والتجويد تستضيف قرّاء عالميين — وتدرّس القرآن وتنشره. تسجّل قناتها على يوتيوب (@khidmatulquran)، المنشأة سنة 2013، مسابقاتها، وبلغ عدد مشتركيها نحو 153 ألفًا بحسب عدّاد vidIQ في 4 نوفمبر 2026."
  en: "A Tanzanian non-profit foundation, chaired by Sheikh Ally Mohammed Saleh, which has organised Qur'an tajweed competitions in Tanzania since 2004 — from a competition its organisers established at Masjid Idrisa, to an East Africa tajweed competition from 2008 and international tilawat and tajweed competitions hosting world-renowned reciters — alongside Qur'an teaching and publishing. Its YouTube channel (@khidmatulquran), created in 2013, records its competitions and counted about 153,000 subscribers by vidIQ's count as of 4 November 2026."
  ur: "خدمت القرآن اسلامک فاؤنڈیشن تنزانیہ کی ایک غیر منافع بخش فاؤنڈیشن ہے جس کے چیئرمین شیخ علی محمد صالح ہیں؛ یہ ۲۰۰۴ء سے تنزانیہ میں قرآنِ مجید کے تجویدی مقابلے منعقد کر رہی ہے — مسجد ادریسا میں اس کے منتظمین کی قائم کردہ مسابقے سے شروع ہو کر ۲۰۰۸ء سے مشرقی افریقہ کا تجویدی مقابلہ اور پھر عالمی شہرت یافتہ قاریوں کی میزبانی کرنے والے بین الاقوامی تلاوت و تجوید کے مقابلے — اور قرآن کی تعلیم و اشاعت کا کام بھی کرتی ہے۔ اس کا یوٹیوب چینل (@khidmatulquran)، جو ۲۰۱۳ء میں بنا، اس کے مقابلوں کو ریکارڈ کرتا ہے اور vidIQ کی گنتی کے مطابق ۴ نومبر ۲۰۲۶ء کو اس کے سبسکرائبرز تقریباً ۱۵۳٬۰۰۰ تھے۔"
