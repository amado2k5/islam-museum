summary:
  ar: "قناة يوتيوب بنغلاديشية تجمع محاضرات الوعظ بالبنغالية وتنشرها بكثافة؛ بلغ عدد مشتركيها نحو 606 آلاف بحسب عدّاد vidIQ المقروء في 7 نوفمبر 2026. اسمها عام شائع، ولم يُحدَّد لها مشغّل بالاسم في هذا المسح، فلا يخصّ هذا السجل إلا هذه القناة بعينها ولا يمتد إلى أي مؤسسة تحمل اسمًا مشابهًا."
  en: "A Bangladeshi YouTube channel (@alaminislamicmedia) aggregating Bengali waz lectures at high volume; it counted about 606 thousand subscribers by vidIQ's count read on 7 November 2026. Its name is a generic one, no operator was identified for it in this pass, and this record concerns this channel only — not any institution of a similar name."
  ur: "بنگلہ دیشی یوٹیوب چینل جو بنگالی واز لیکچرز بڑی تعداد میں جمع و شائع کرتا ہے؛ 7 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق اس کے سبسکرائبرز تقریباً 606 ہزار تھے۔ اس کا نام عام نوعیت کا ہے، اس مرحلے میں اس کا کوئی منتظم شناخت نہیں ہوا، اور یہ ریکارڈ صرف اسی چینل کے بارے میں ہے، کسی ملتے جلتے نام کے ادارے کے بارے میں نہیں۔"
  es: "Un canal de YouTube de Bangladesh (@alaminislamicmedia) que recopila conferencias de waz en bengalí a gran escala, contaba con aproximadamente 606 mil suscriptores según el recuento de vidIQ realizado el 7 de noviembre de 2026. Su nombre es genérico, no se identificó ningún operador en esta ocasión, y este registro se refiere únicamente a este canal, no a ninguna institución con un nombre similar."
  fr: "Une chaîne YouTube bangladaise (@alaminislamicmedia) diffusant en grand nombre des conférences waz en bengali; elle comptait environ 606 000 abonnés selon le décompte de vidIQ relevé le 7 novembre 2026. Son nom est générique, aucun opérateur n'a été identifié pour cette chaîne, et ce record concerne uniquement cette chaîne — et non une institution portant un nom similaire."
  tr: "Bangladeş merkezli, Bengalce vaaz derslerini derleyip yayınlayan bir YouTube kanalı; 7 Kasım 2026'da vidIQ sayacından okunan verilere göre yaklaşık 606.000 aboneye sahip. Kanalın adı yaygın ve genel bir isim olup, bu araştırmada adı geçen bir işletmeci tespit edilmemiştir; bu nedenle bu kayıt yalnızca bu belirli kanala aittir ve benzer isimli herhangi bir kurumu kapsamaz."
  id: "Sebuah saluran YouTube Bangladesh yang mengumpulkan dan menerbitkan ceramah khotbah berbahasa Bengali secara ekstensif; saluran ini memiliki sekitar 606.000 pelanggan menurut penghitung vidIQ yang dibaca pada 7 November 2026. Namanya adalah nama generik umum, dan tidak ada operator yang disebutkan namanya dalam survei ini, sehingga catatan ini hanya berkaitan dengan saluran tertentu ini dan tidak mencakup institusi mana pun dengan nama serupa."
