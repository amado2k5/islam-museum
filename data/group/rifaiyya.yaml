summary:
  ar: "بطاقة أولية للطريقة الرفاعية، الطريقة الصوفية المنسوبة إلى أحمد الرفاعي البطائحي والمشهورة بأذكارها وأورادها في العراق وما حوله؛ تذكرها كتب التراجم عند ترجمة مؤسسها ولم تُراجع الصفحة بعد."
  en: "Draft card for the Rifa'iyya, the Sufi order ascribed to Ahmad al-Rifa'i of the Bata'ih marshes, known for its dhikr practices in Iraq and beyond; treated in the biographical sources under its founder, the page not yet checked."
  es: "Ficha de borrador para la Rifa'iyya, la orden sufí atribuida a Ahmad al-Rifa'i de los pantanos de Bata'ih, conocida por sus prácticas de dhikr en Irak y más allá; tratada en las fuentes biográficas bajo su fundador, página aún no revisada."
  fr: "Fiche de convocation pour la Rifa'iyya, l'ordre soufi attribué à Ahmad al-Rifa'i des marais de Bata'ih, connu pour ses pratiques de dhikr en Irak et au-delà; traité dans les sources biographiques sous son fondateur, la page n'a pas encore été vérifiée."
  ur: "رفاعیہ کے لیے ڈرافٹ کارڈ، بطعیہ دلدل کے احمد الرفاعی سے منسوب صوفی حکم، جو عراق اور اس سے باہر اپنے ذکر کے طریقوں کے لیے جانا جاتا ہے۔ اس کے بانی کے تحت سوانحی ذرائع میں علاج کیا گیا ہے، صفحہ ابھی تک چیک نہیں کیا گیا ہے."
  tr: "Irak ve çevresinde zikir ve dualarıyla ünlü, Ahmed el-Rifai el-Bataihi'ye atfedilen Sufi tarikatı Rifaiyye tarikatına ait ön taslak bir kart; kurucusunun biyografisini anlatan kitaplarda adı geçmektedir ve sayfa henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk tarekat Rifa’iyya, tarekat Sufi yang dikaitkan dengan Ahmad al-Rifa’i al-Bata’ihi dan terkenal dengan zikir dan litaninya di Irak dan sekitarnya; tarekat ini disebutkan dalam buku-buku biografi ketika menerjemahkan pendirinya, dan halaman ini belum ditinjau."
