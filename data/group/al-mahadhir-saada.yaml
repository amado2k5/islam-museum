summary:
  ar: "بنو عم الأكيليين من ربيعة خولان، تركت لهم أعناب أفقين، ثم غُزيت دوابهم فاستأمنوا فردّ عليهم الهادي الخمس."
  en: "Cousins of the Akilis among the Rabi'a of Khawlan, whose vines at Afqayn were spared, whose animals were later raided, and who sought safety and had the fifth returned by al-Hadi."
  ur: "خولان کے ربیعہ میں اکیلیوں کے چچازاد جن کی افقین کی بیلیں چھوڑ دی گئیں، جن کے جانوروں پر بعد میں چھاپہ پڑا، اور جنہوں نے امان مانگی تو ہادی نے خمس انہیں لوٹا دیا۔"
  es: "Primos de los Akilis entre los Rabi'a de Khawlan, cuyas viñas en Afqayn fueron perdonadas, cuyos animales fueron posteriormente asaltados, y que buscaron refugio y lograron que al-Hadi les devolviera el quinto."
  fr: "Cousins des Akilis parmi les Rabi'a de Khawlan, dont les vignes à Afqayn furent épargnées, dont les animaux furent plus tard pillés, et qui cherchèrent refuge et virent le cinquième rendu par al-Hadi."
