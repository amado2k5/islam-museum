summary:
  ar: "بنو عم الأكيليين من ربيعة خولان، تركت لهم أعناب أفقين، ثم غُزيت دوابهم فاستأمنوا فردّ عليهم الهادي الخمس."
  en: "Cousins of the Akilis among the Rabi'a of Khawlan, whose vines at Afqayn were spared, whose animals were later raided, and who sought safety and had the fifth returned by al-Hadi."
