summary:
  ar: "قبيلة من قضاعة في شمال الحجاز نحو وادي القرى والشام؛ يذكر ابن إسحاق أن غزوة ذات السلاسل كانت من أرض بني عذرة، وأن قطبة بن قتادة العذري كان على ميمنة المسلمين يوم مؤتة."
  en: "A tribe of Quda'a in the northern Hijaz towards Wadi al-Qura and Syria; Ibn Ishaq places the Dhat al-Salasil campaign in the land of Banu Udhra and names Qutba ibn Qatada al-Udhri as commander of the Muslim right wing at Mu'ta."
  es: "Una tribu de Quda'a en el norte de Hijaz hacia Wadi al-Qura y Siria; Ibn Ishaq sitúa la campaña de Dhat al-Salasil en la tierra de Banu Udhra y nombra a Qutba ibn Qatada al-Udhri comandante de la derecha musulmana en Mu'ta."
  fr: "Une tribu de Quda'a dans le nord du Hijaz vers Wadi al-Qura et la Syrie; Ibn Ishaq place la campagne de Dhat al-Salasil au pays de Banu Udhra et nomme Qutba ibn Qatada al-Udhri comme commandant de l'aile droite musulmane à Mu'ta."
  ur: "وادی القریٰ اور شام کی طرف شمالی حجاز میں قدعہ کا ایک قبیلہ؛ ابن اسحاق نے بنو عذرا کی سرزمین میں ثالثی مہم کا آغاز کیا اور قطبہ بن قتادہ الذری کو موتہ میں مسلم دائیں بازو کے کمانڈر کے طور پر نامزد کیا۔"
  tr: "Hicaz'ın kuzeyindeki Kuda'ah'tan, Vadi el-Kura ve Levant'a doğru uzanan bir kabile; İbn İshak, Zat el-Salasil Muharebesi'nin Beni Udhra topraklarından olduğunu ve Kutube bin Katada el-Udhri'nin Mu'te günü Müslümanların sağ kanadında bulunduğunu belirtir."
  id: "Sebuah suku dari Quda’ah di utara Hijaz menuju Wadi al-Qura dan Levant; Ibnu Ishaq menyebutkan bahwa Perang Dhat al-Salasil berasal dari tanah Bani Udhra, dan bahwa Qutbah bin Qatada al-Udhri berada di sayap kanan kaum Muslimin pada hari Mu’tah."
