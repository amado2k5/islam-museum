summary:
  ar: قبيلة يمنية من همدان وفدت إلى الهادي وبايعته، وفي بلدها ضاة وقعت حادثة الصدقات في رمضان 284هـ.
  en: A Yemeni tribe of Hamdan that came to al-Hadi and pledged to him; at its town Da'a the incident over the alms took place in Ramadan 284 AH.
  ur: ہمدان کا ایک یمنی قبیلہ جو ہادی کے پاس آیا اور بیعت کی؛ اس کی بستی ضاۃ میں رمضان 284ھ میں صدقات کا واقعہ پیش آیا۔
  es: "Una tribu yemení de Hamdan que acudió a al-Hadi y le juró lealtad; en su pueblo de Da'a tuvo lugar el incidente por la limosna en Ramadán del año 284 AH."
  fr: "Une tribu yéménite de Hamdan qui vint à al-Hadi et lui prêta allégeance; dans sa ville de Da'a, l'incident concernant les aumônes eut lieu au Ramadan 284 AH."
  tr: "Hamdan'dan bir Yemen kabilesi Al-Hadi'ye gelerek ona biat etti ve sadaka olayı Hicri 284 yılının Ramazan ayında, onların Da'a kasabasında gerçekleşti."
  id: "Suku Yaman dari Hamdan datang kepada Al-Hadi dan menyatakan kesetiaan kepadanya, dan di kota mereka, Dha'a, peristiwa pemberian sedekah itu terjadi pada bulan Ramadan tahun 284 Hijriah."
