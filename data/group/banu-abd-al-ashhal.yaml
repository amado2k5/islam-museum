label: { ar: "بنو عبد الأشهل", en: "Banu Abd al-Ashhal", es: "Banu Abd al-Ashhal", fr: "Banu Abd al-Ashhal", ur: "بنو عبد الاشحل", tr: "Banu Abd al-Ashhal", id: "Banu Abd al-Ashhal" }
summary:
  ar: "بطن من الأوس، بنو عبد الأشهل بن جُشَم بن الحارث بن الخزرج الأصغر؛ بعد انصراف أبي جبيلة تفرّق الأوس والخزرج في عالية المدينة وسافلتها فنزلوا دارهم قبليّ دار بني ظفر مع طرف الحرة الشرقية، وابتنوا أطماً سمّوه «واقماً» كان لحضير بن سماك فسُميت الناحية به، وأطماً آخر اسمه «الرَّعَل» لصَخْرة أم بني عبد الأشهل، قالوا يوم بعاث «نحن بنو صخرة أرباب الرعل». وبينهم وبين بني حارثة حرب أخرجوهم فيها من الدار المشتركة فتحوّلوا إلى ناحية يثرب {cite:samhudi-wafa-al-wafa p. 202-204}. وهم الثانية في دور الأنصار في فضل الصحيح {cite:sahih-al-bukhari 3807}."
  en: "A clan of the Aws, Banu Abd al-Ashhal ibn Jusham ibn al-Harith; after Abu Jubayla's departure they settled a quarter south of Banu Zafar's, by the edge of the eastern Harra, and built the utm 'Waqim' — held by Hudayr ibn Simak, after whom the quarter was named — and another called 'al-Ra'l' for Sakhra umm Banu Abd al-Ashhal, crying at Bu'ath 'we are Banu Sakhra, lords of the Ra'l'. A war with Banu Haritha drove the latter from the shared quarter to the Yathrib neighbourhood {cite:samhudi-wafa-al-wafa p. 202-204}."
  es: "Un clan de los Aws, Banu Abd al-Ashhal ibn Jusham ibn al-Harith; tras la partida de Abu Jubayla, se asentaron en un barrio al sur del de Banu Zafar, en el borde del Harra oriental, y construyeron el utm 'Waqim' —en manos de Hudayr ibn Simak, de quien el barrio recibió su nombre— y otro llamado 'al-Ra'l' para Sakhra umm Banu Abd al-Ashhal, que clamaba a Bu'ath 'somos Banu Sakhra, señores del Ra'l'. Una guerra con Banu Haritha expulsó a estos últimos del barrio compartido al vecindario de Yathrib {cite:samhudi-wafa-al-wafa p. 202-204}."
  fr: "Un clan des Aws, les Banu Abd al-Ashhal ibn Jusham ibn al-Harith, s'installa après le départ d'Abu Jubayla dans un quartier au sud de celui des Banu Zafar, à la limite orientale de Harra. Ils y construisirent l'utm « Waqim », tenu par Hudayr ibn Simak, qui donna son nom au quartier, ainsi qu'un autre appelé « al-Ra'l » pour Sakhra umm Banu Abd al-Ashhal. Ils proclamèrent à Bu'ath: « Nous sommes les Banu Sakhra, seigneurs du Ra'l ! » Une guerre contre les Banu Haritha les chassa du quartier commun vers le voisinage de Yathrib (voir: Samhudi-Wafa-al-Wafa, p. 202-204)."
  ur: "اوس کا ایک قبیلہ، بنو عبد الاشحل بن جشام بن الحارث؛ ابو جبیلہ کے جانے کے بعد انہوں نے بنو ظفر کے ایک چوتھائی جنوب میں، مشرقی حرہ کے کنارے آباد کیا، اور حُدر بن سماک کے پاس اتم واقم تعمیر کیا، جس کے نام پر اس سہ ماہی کا نام رکھا گیا تھا- اور صخرہ ام بنو بنو بنو بنو کے لیے ایک اور کو 'الرّل' کہا جاتا ہے۔ صخرہ، رال کے آقا۔ بنو حارثہ کے ساتھ جنگ نے مؤخر الذکر کو مشترکہ کوارٹر سے یثرب کے محلے میں لے جایا۔ 202-204}۔"
  tr: "Ebu Cübeyle'nin ayrılmasından sonra, Ebu Cübeyle ve Hazrec, Medine'nin yukarı ve aşağı kısımlarına dağıldılar. Beni Zefar'ın güneyinde, lav alanının doğu kenarına yakın bir yerde yerleştiler ve Hudeyr ibn Semek'e ait olan \"Vakim\" adında bir sur inşa ettiler ve bölgeye bu yapıdan sonra adı verildi. Ayrıca, Beni Abdüleşhal'in annesi Sakra'ya ait olan \"el-Ra'al\" adında başka bir sur da inşa ettiler. Bu'at günü, \"Biz Beni Sakra'yız, el-Ra'al'ın efendileriyiz\" dediler. Onlarla Beni Harita arasında bir savaş çıktı ve onları ortak yurtlarından kovdular, böylece Yathrib bölgesine taşındılar. {Samhudi-vefa-al-vefa s. 202-204}. Onlar, sahih hadislerde adı geçen Ensar arasında ikinci sıradadır. {Sahih-al-buhari 3807}."
  id: "Sebuah cabang dari Aws, Banu Abd al-Ashhal ibn Jusham ibn al-Harith ibn al-Khazraj al-Asghar; setelah kepergian Abu Jubaylah, Aws dan Khazraj berpencar ke bagian atas dan bawah Madinah. Mereka menetap di tempat tinggal mereka di selatan Banu Zafar, dekat tepi timur ladang lava, dan membangun sebuah bangunan berbenteng yang disebut \"Waqim,\" yang sebelumnya milik Hudayr ibn Samak, dan daerah itu dinamai menurut nama bangunan tersebut. Mereka juga membangun bangunan berbenteng lain yang disebut \"al-Ra'al,\" milik Sakhrah, ibu dari Banu Abd al-Ashhal. Pada hari Bu'ath, mereka berkata, \"Kami adalah Banu Sakhrah, penguasa al-Ra'al.\" Perang pecah antara mereka dan Banu Harithah, di mana mereka mengusir mereka dari tempat tinggal bersama, sehingga mereka pindah ke wilayah Yathrib. {cite:samhudi-wafa-al-wafa hlm. 202-204}. Mereka adalah yang kedua dalam jumlah kaum Ansar yang disebutkan dalam hadits sahih. {cite:sahih-al-bukhari 3807}."
