label: { ar: "بنو عبد الأشهل", en: "Banu Abd al-Ashhal" }
summary:
  ar: "بطن من الأوس، بنو عبد الأشهل بن جُشَم بن الحارث بن الخزرج الأصغر؛ بعد انصراف أبي جبيلة تفرّق الأوس والخزرج في عالية المدينة وسافلتها فنزلوا دارهم قبليّ دار بني ظفر مع طرف الحرة الشرقية، وابتنوا أطماً سمّوه «واقماً» كان لحضير بن سماك فسُميت الناحية به، وأطماً آخر اسمه «الرَّعَل» لصَخْرة أم بني عبد الأشهل، قالوا يوم بعاث «نحن بنو صخرة أرباب الرعل». وبينهم وبين بني حارثة حرب أخرجوهم فيها من الدار المشتركة فتحوّلوا إلى ناحية يثرب {cite:samhudi-wafa-al-wafa p. 202-204}. وهم الثانية في دور الأنصار في فضل الصحيح {cite:sahih-al-bukhari 3807}."
  en: "A clan of the Aws, Banu Abd al-Ashhal ibn Jusham ibn al-Harith; after Abu Jubayla's departure they settled a quarter south of Banu Zafar's, by the edge of the eastern Harra, and built the utm 'Waqim' — held by Hudayr ibn Simak, after whom the quarter was named — and another called 'al-Ra'l' for Sakhra umm Banu Abd al-Ashhal, crying at Bu'ath 'we are Banu Sakhra, lords of the Ra'l'. A war with Banu Haritha drove the latter from the shared quarter to the Yathrib neighbourhood {cite:samhudi-wafa-al-wafa p. 202-204}."
