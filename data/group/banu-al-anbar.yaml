summary:
  ar: "بطن من بني تميم، العنبر بن عمرو بن تميم؛ أغار عليهم عيينة بن حصن بأمر النبي فقتل وسبى، ثم ركب فيهم وفد من بني تميم إلى النبي فأعتق بعض السبي وفادى بعضاً؛ يسمّي ابن إسحاق من قُتل منهم ومن سُبي من نسائهم."
  en: "A clan of Tamim, al-Anbar ibn Amr ibn Tamim; Uyayna ibn Hisn raided them at the Prophet's order, killing and taking captives, after which a Tamim delegation came to the Prophet, who freed some captives and ransomed others; Ibn Ishaq names the men killed and the women taken."
