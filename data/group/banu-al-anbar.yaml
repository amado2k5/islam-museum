label: { ar: "بنو العنبر من بني تميم", en: "Banu al-Anbar of Tamim", es: "Banu al-Anbar de Tamim", fr: "Banu al-Anbar de Tamim", ur: "تمیم کی بنو الانبار", tr: "Banu Anbar halkı Banu Tamim'den gelmektedir.", id: "Banu Anbar berasal dari Banu Tamim" }
summary:
  ar: "بطن من بني تميم، العنبر بن عمرو بن تميم؛ أغار عليهم عيينة بن حصن بأمر النبي فقتل وسبى، ثم ركب فيهم وفد من بني تميم إلى النبي فأعتق بعض السبي وفادى بعضاً؛ يسمّي ابن إسحاق من قُتل منهم ومن سُبي من نسائهم."
  en: "A clan of Tamim, al-Anbar ibn Amr ibn Tamim; Uyayna ibn Hisn raided them at the Prophet's order, killing and taking captives, after which a Tamim delegation came to the Prophet, who freed some captives and ransomed others; Ibn Ishaq names the men killed and the women taken."
  es: "Un clan de Tamim, al-Anbar ibn Amr ibn Tamim; Uyayna ibn Hisn los asaltó por orden del Profeta, matando y tomando prisioneros, después de lo cual una delegación de Tamim llegó al Profeta, quien liberó a algunos prisioneros y rescató a otros; Ibn Ishaq menciona a los hombres asesinados y a las mujeres capturadas."
  fr: "Un clan de Tamim, al-Anbar ibn Amr ibn Tamim; Uyayna ibn Hisn les attaqua sur ordre du Prophète, tuant et prenant des captifs, après quoi une délégation de Tamim vint auprès du Prophète, qui libéra certains captifs et en racheta d'autres; Ibn Ishaq nomme les hommes tués et les femmes prises."
  ur: "تمیم کا ایک قبیلہ، الانبار ابن عمرو بن تمیم؛ عیینہ بن حصین نے نبی کے حکم پر ان پر چھاپہ مارا اور قیدیوں کو قتل کر دیا، اس کے بعد تمیم کا ایک وفد رسول اللہ کے پاس آیا، جس نے کچھ قیدیوں کو آزاد کیا اور کچھ کو فدیہ دیا۔ ابن اسحاق نے مارے گئے مردوں اور پکڑی جانے والی عورتوں کے نام بتائے۔"
  tr: "Beni Tamim kabilesinden Enbar ibn Amr ibn Tamim ve Uyaynah ibn Hisn, Peygamberin emriyle onlara baskın düzenleyerek öldürdüler ve esir aldılar. Daha sonra Beni Tamim'den bir heyet onlarla birlikte Peygamberin huzuruna gitti; böylece Peygamber esirlerden bazılarını serbest bıraktı ve bazılarını da fidye karşılığında kurtardı. İbn İshak, aralarından öldürülenlerin ve kadınlarından esir alınanların isimlerini zikreder."
  id: "Sebuah klan dari Bani Tamim, Anbar bin Amr bin Tamim; Uyaynah bin Hisn menyerang mereka atas perintah Nabi, membunuh dan menawan beberapa orang. Kemudian sebuah delegasi dari Bani Tamim ikut bersama mereka menemui Nabi, sehingga beliau membebaskan sebagian tawanan dan menebus sebagian lainnya. Ibnu Ishaq menyebutkan nama-nama orang yang terbunuh dari kalangan mereka dan orang-orang yang ditawan dari kalangan wanita mereka."
