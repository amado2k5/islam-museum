summary:
  ar: "مصمودة من أكبر قبائل البربر؛ من بطون البرانس عند النسابة، مواطنهم جبال درن وسهولها بالمغرب الأقصى وهضاب ما بينها وبين مراكش وأعمالها وسوس، ومن بطونهم هنتاتة وبرغواطة وبانو وهنتة، ومنهم قامت دولة المهدي ابن تومرت والموحدين، وكانوا في أول الإسلام على دين الصفرية من الخوارج حتى ردهم عنه الخلفاء وعبادهم بالسيف."
  en: "Masmuda, among the greatest Berber tribes; of the Baranis in the genealogists' count, their homeland the Darn mountains and plains of the Far Maghreb, the plateaux toward Marrakesh and the Sus — their branches Hintata, Barghawata and Banu Hinta — from them rose the state of the Mahdi Ibn Tumart and the Almohads, and in early Islam they held the Sufrite creed until caliphs and their servants turned them from it by the sword."
  es: "Masmuda, una de las tribus bereberes más importantes; de los Baranis según los genealogistas, su tierra natal eran las montañas Darn y las llanuras del Magreb lejano, las mesetas hacia Marrakech y Sus —sus ramas Hintata, Barghawata y Banu Hinta— de ellos surgió el estado del Mahdi Ibn Tumart y los almohades, y en los inicios del Islam profesaron el credo sufrita hasta que los califas y sus sirvientes los apartaron de él por la espada."
  fr: "Les Masmuda, parmi les plus grandes tribus berbères; des Baranis selon les généalogistes, leur patrie les montagnes du Darn et les plaines du Maghreb lointain, les plateaux vers Marrakech et le Sous — leurs branches Hintata, Barghawata et Banu Hinta — sont issus de l'État du Mahdi Ibn Tumart et des Almohades, et au début de l'Islam, ils adhéraient à la croyance soufrite jusqu'à ce que les califes et leurs serviteurs les en détournent par l'épée."
  ur: "مسمودا، عظیم ترین بربر قبائل میں سے؛ نسب پرستوں کی گنتی میں برانیوں میں سے، ان کا آبائی وطن درن پہاڑ اور دور مغرب کے میدان، مراقش اور سوس کی طرف مرتفع - ان کی شاخیں ہنتا، برغواتہ اور بنو ہندہ - ان سے مہدی ابن تمرت اور المحدث کی ریاست نے جنم لیا، اور ابتدائی اسلام میں ان کے غلام ہونے تک ان کا تختہ الٹ دیا اور ان کے غلام ہونے تک ان کو قبول کیا۔ تلوار سے"
  tr: "Masmuda, en büyük Berberi kabilelerinden biridir; soybilimcilere göre Branes'in bir koludur. Anavatanları, Fas'ın en batısındaki Darn dağları ve ovaları ile Marakeş ve çevresi ile Sous arasındaki platolardır. Kolları arasında Hintata, Barghawata, Banu ve Hinta bulunur. Mehdi İbn Tumart devleti ve Almohadlar onlardan doğmuştur. İslam'ın başlangıcında, halifeler onları ve mensuplarını kılıçla uzaklaştırıncaya kadar Haricilerin Sufriyye mezhebine mensuptular."
  id: "Suku Masmuda adalah salah satu suku Berber terbesar; menurut para ahli silsilah, mereka adalah salah satu cabang dari suku Branes. Tanah asal mereka adalah pegunungan dan dataran Darn di ujung barat Maroko dan dataran tinggi di antara Darn dan Marrakesh beserta distrik-distriknya dan Sous. Di antara cabang-cabang mereka adalah Hintata, Barghawata, Banu, dan Hinta. Dari merekalah muncul negara Mahdi Ibn Tumart dan Almohad. Pada awal Islam, mereka menganut agama Sufriyyah dari Kharijites hingga para khalifah menyesatkan mereka dari agama tersebut dan para pengikutnya dengan pedang."
