label:
  ar: مصمودة
  en: Masmuda
summary:
  ar: "مصمودة من أكبر قبائل البربر؛ من بطون البرانس عند النسابة، مواطنهم جبال درن وسهولها بالمغرب الأقصى وهضاب ما بينها وبين مراكش وأعمالها وسوس، ومن بطونهم هنتاتة وبرغواطة وبانو وهنتة، ومنهم قامت دولة المهدي ابن تومرت والموحدين، وكانوا في أول الإسلام على دين الصفرية من الخوارج حتى ردهم عنه الخلفاء وعبادهم بالسيف."
  en: "Masmuda, among the greatest Berber tribes; of the Baranis in the genealogists' count, their homeland the Darn mountains and plains of the Far Maghreb, the plateaux toward Marrakesh and the Sus — their branches Hintata, Barghawata and Banu Hinta — from them rose the state of the Mahdi Ibn Tumart and the Almohads, and in early Islam they held the Sufrite creed until caliphs and their servants turned them from it by the sword."
