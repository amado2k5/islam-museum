  ar: "منفذ إعلامي دعوي إثيوبي يعمل بالأمهرية، ينشر المحاضرات وتغطيات المناسبات من خطب الجمعة ومحاضرات العلماء والجنائز والمؤتمرات؛ بلغ عدد متابعي صفحته على فيسبوك (facebook.com/haruntube) نحو 570 ألفًا بحسب بيانات وصفية لمنشور على فيسبوك مؤرخ في 1 مارس 2026 قرأها حصاد الموجة في 7 نوفمبر 2026، وبلغ عدد مشتركي قناته على يوتيوب (@haruntube2) 398,000 مشترك بحسب عدّاد vidIQ المقروء في 7 نوفمبر 2026."
  en: "An Ethiopian Amharic dawah media outlet publishing lectures and event coverage — Friday khutbahs, scholars' lectures, funerals and conferences; its Facebook page (facebook.com/haruntube) counted about 570 thousand followers by Facebook post metadata on a post dated 1 March 2026, read by the wave harvest on 7 November 2026, and its YouTube channel (@haruntube2) counted 398,000 subscribers by vidIQ's count read on 7 November 2026."
  ur: "ہارون میڈیا ایتھوپیا کا امہری زبان کا دعوتی میڈیا ادارہ ہے جو لیکچرز اور تقریبات کی کوریج — جمعہ کے خطبات، علما کے لیکچرز، جنازے اور کانفرنسیں — شائع کرتا ہے؛ اس کے فیس بک پیج (facebook.com/haruntube) کے فالوورز کی تعداد 1 مارچ 2026ء کی ایک فیس بک پوسٹ کے میٹا ڈیٹا کے مطابق تقریباً 570 ہزار تھی، جو ویو کے ہارویسٹ نے 7 نومبر 2026ء کو پڑھا، اور اس کے یوٹیوب چینل (@haruntube2) کے سبسکرائبرز کی تعداد 7 نومبر 2026ء کو پڑھے گئے vidIQ کے شمار کے مطابق 398,000 تھی۔"
