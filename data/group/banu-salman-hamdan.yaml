label:
  ar: بنو سلمان من همدان
  en: Banu Salman (of Hamdan)
  ur: بنو سلمان ہمدان کے
summary:
  ar: قوم من همدان يذكر الكتاب أنهم لم يحبوا الصلح بين الهادي والدعام وأنهضوا أرحب بن الدعام معهم فدخلوا أثافت وهاجموا خيوان سنة 285هـ.
  en: A people of Hamdan whom the book says disliked the settlement between al-Hadi and al-Da'am and took Arhab ibn al-Da'am up with them, entering Athafit and attacking Khiwan in 285 AH.
  ur: ہمدان کی ایک قوم جس کے بارے میں کتاب کہتی ہے کہ وہ ہادی اور دعام کی صلح کو پسند نہ کرتی تھی اور ارحب بن دعام کو ساتھ اٹھا کر 285ھ میں اثافت میں داخل ہوئی اور خیوان پر حملہ آور ہوئی۔
