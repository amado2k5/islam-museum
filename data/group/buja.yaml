summary:
  ar: "عند البلاذري: قوم أهل بادية أصحاب إبل وماشية أرضهم مفاوز بينها وبين بلاد الإسلام مسيرة شهر في قفر وجبال وعرة بها معادن الذهب غاروا على أرض مصر وامتنعوا من أداء ما عليهم عن المعادن فحاربهم محمد القمي زمن المتوكل فكانت إبلهم زعرة تنفر عن كل شيء فقلد القمي خيله الأجراس فنفرت إبلهم وصالحوا سنة ٢٤١ على الأتاوة والبقط."
  en: "In al-Baladhuri: a desert people with camels and herds whose land — a month's barren march of rugged mountains from Islam's lands — holds the gold mines; they raided Egypt's land and withheld the mines' dues, so Muhammad al-Qummi warred on them in al-Mutawakkil's time — their camels skittish at everything, he hung bells on his horses and the camels bolted — and they made peace in 241 on tribute and baqt."
