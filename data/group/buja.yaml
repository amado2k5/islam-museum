summary:
  ar: "عند البلاذري: قوم أهل بادية أصحاب إبل وماشية أرضهم مفاوز بينها وبين بلاد الإسلام مسيرة شهر في قفر وجبال وعرة بها معادن الذهب غاروا على أرض مصر وامتنعوا من أداء ما عليهم عن المعادن فحاربهم محمد القمي زمن المتوكل فكانت إبلهم زعرة تنفر عن كل شيء فقلد القمي خيله الأجراس فنفرت إبلهم وصالحوا سنة ٢٤١ على الأتاوة والبقط."
  en: "In al-Baladhuri: a desert people with camels and herds whose land — a month's barren march of rugged mountains from Islam's lands — holds the gold mines; they raided Egypt's land and withheld the mines' dues, so Muhammad al-Qummi warred on them in al-Mutawakkil's time — their camels skittish at everything, he hung bells on his horses and the camels bolted — and they made peace in 241 on tribute and baqt."
  es: "En al-Baladhuri: un pueblo del desierto con camellos y rebaños cuya tierra —una marcha árida de un mes a través de montañas escarpadas desde las tierras del Islam— alberga las minas de oro; saquearon las tierras de Egipto y retuvieron los derechos de las minas, por lo que Muhammad al-Qummi les declaró la guerra en tiempos de al-Mutawakkil —sus camellos se asustaban con todo, él colgó campanas en sus caballos y los camellos salieron corriendo— y firmaron la paz en 241 sobre el tributo y el baqt."
  fr: "Dans al-Baladhuri: un peuple du désert avec des chameaux et des troupeaux dont la terre — un mois de marche aride à travers des montagnes escarpées depuis les terres de l'Islam — abrite les mines d'or; ils ont pillé les terres d'Égypte et retenu les droits des mines, alors Muhammad al-Qummi leur a fait la guerre à l'époque d'al-Mutawakkil — leurs chameaux étant craintifs à tout, il a accroché des cloches à ses chevaux et les chameaux se sont enfuis — et ils ont fait la paix en 241 sur le tribut et le baqt."
  ur: "البلادھوری میں ہے: اونٹوں اور ریوڑوں کے ساتھ ایک صحرائی لوگ جن کی زمین - اسلام کی سرزمین سے ناہموار پہاڑوں کا ایک مہینہ بنجر مارچ - سونے کی کانیں پکڑے ہوئے ہیں۔ انہوں نے مصر کی سرزمین پر چھاپہ مارا اور بارودی سرنگوں کے واجبات کو روک دیا، تو محمد القومی نے المتوکل کے زمانے میں ان کے خلاف جنگ لڑی - ان کے اونٹ ہر چیز سے کتراتے تھے، اس نے اپنے گھوڑوں پر گھنٹیاں لٹکائی اور اونٹوں کو باندھ دیا - اور انہوں نے 241 میں خراج اور بکت پر صلح کر لی۔"
  tr: "El-Baladhuri'ye göre: Çöl halkı, deve ve büyükbaş hayvan sahibi bir halktı. Toprakları, İslam topraklarıyla arasında çöl olan, bir aylık yolculuk mesafesindeki engebeli dağlarda altın madenleri bulunan bir bölgeydi. Mısır topraklarına baskın düzenlediler ve madenler için kendilerine ödenmesi gerekeni ödemeyi reddettiler. Bunun üzerine Muhammed el-Kummi, El-Mutavakkil zamanında onlarla savaştı. Develeri vahşiydi ve her şeyden kaçardı. Bunun üzerine el-Kummi atlarına çan taktı, böylece develeri kaçtı ve 241 yılında haraç ve rüşvet karşılığında onlarla barış yaptılar."
  id: "Menurut Al-Baladhuri: Suatu kaum, penduduk gurun, pemilik unta dan ternak, yang tanahnya berupa gurun pasir di antara mereka dan tanah Islam, perjalanan selama sebulan di padang gurun dan pegunungan terjal, di mana terdapat tambang emas. Mereka menyerbu tanah Mesir dan menolak membayar apa yang menjadi hak mereka atas tambang tersebut, sehingga Muhammad Al-Qummi memerangi mereka pada masa Al-Mutawakkil. Unta-unta mereka liar dan akan melarikan diri dari segala sesuatu, sehingga Al-Qummi memasang lonceng pada kuda-kudanya, sehingga unta-unta mereka melarikan diri, dan mereka berdamai dengan mereka pada tahun 241 berdasarkan upeti dan suap."
