label:
  ar: آل يعفر
  en: Al Ya'fur (Banu Ya'fur)
  ur: آل یعفر
  es: "Al Ya'fur (Banu Ya'fur)"
  fr: "Al Ya'fur (Banu Ya'fur)"
  tr: "Al Ya'far"
  id: "Al Ya'far"
summary:
  ar: أسرة يمنية حبسها الهادي بصنعاء بطلب من أبي العتاهية، ثم قاتلته مع آل طريف بعد دخوله صنعاء سنة 288هـ؛ ذُكر منهم عبد الحكيم وعثمان بن أحمد وأسعد بن أبي يعفر.
  en: A Yemeni family that al-Hadi imprisoned at the request of Abu al-Atahiya and that fought him, with Al Tarif, after he entered Sana'a in 288 AH; named among them are Abd al-Hakim and Uthman ibn Ahmad and As'ad ibn Abi Ya'fur.
  ur: ایک یمنی خاندان جسے ہادی نے ابو العتاہیہ کی درخواست پر قید کیا اور جس نے 288ھ میں ان کے صنعاء میں داخل ہونے کے بعد آل طریف کے ساتھ ان سے جنگ کی؛ ان میں عبد الحکیم، عثمان بن احمد اور اسعد بن ابی یعفر کا نام آیا ہے۔
  es: "Una familia yemení que al-Hadi encarceló a petición de Abu al-Atahiya y que luchó contra él, junto con Al Tarif, después de que entrara en Sana'a en el año 288 de la Hégira; entre sus miembros se encuentran Abd al-Hakim, Uthman ibn Ahmad y As'ad ibn Abi Ya'fur."
  fr: "Une famille yéménite qu'al-Hadi emprisonna à la demande d'Abu al-Atahiya et qui le combattit, avec Al Tarif, après son entrée à Sanaa en 288 AH; parmi eux sont nommés Abd al-Hakim et Uthman ibn Ahmad et As'ad ibn Abi Ya'fur."
  tr: "Al-Hadi'nin Ebu el-Atahiye'nin isteği üzerine Sana'a'da hapse attığı Yemenli bir aile, daha sonra Hicri 288 yılında Sana'a'ya girdikten sonra Al-Tarif ailesiyle birlikte onunla savaştı; bu aileden Abdul Hakim, Osman bin Ahmed ve Asad bin Abi Ya'fer'in isimleri geçiyordu."
  id: "Sebuah keluarga Yaman yang dipenjarakan Al-Hadi di Sana'a atas permintaan Abu Al-Atahiyah, kemudian memeranginya bersama keluarga Al-Tarif setelah ia memasuki Sana'a pada tahun 288 H; di antara mereka disebutkan Abdul Hakim, Utsman bin Ahmed dan Asad bin Abi Ya'far."
