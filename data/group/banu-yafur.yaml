  ar: آل يعفر
  en: Al Ya'fur (Banu Ya'fur)
  ur: آل یعفر
summary:
  ar: أسرة يمنية حبسها الهادي بصنعاء بطلب من أبي العتاهية، ثم قاتلته مع آل طريف بعد دخوله صنعاء سنة 288هـ؛ ذُكر منهم عبد الحكيم وعثمان بن أحمد وأسعد بن أبي يعفر.
  en: A Yemeni family that al-Hadi imprisoned at the request of Abu al-Atahiya and that fought him, with Al Tarif, after he entered Sana'a in 288 AH; named among them are Abd al-Hakim and Uthman ibn Ahmad and As'ad ibn Abi Ya'fur.
  ur: ایک یمنی خاندان جسے ہادی نے ابو العتاہیہ کی درخواست پر قید کیا اور جس نے 288ھ میں ان کے صنعاء میں داخل ہونے کے بعد آل طریف کے ساتھ ان سے جنگ کی؛ ان میں عبد الحکیم، عثمان بن احمد اور اسعد بن ابی یعفر کا نام آیا ہے۔
