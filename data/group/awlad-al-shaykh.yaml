label:
  ar: "أولاد الشيخ (بنو حموية)"
  en: "Awlad al-Shaykh (Banu Hamawiya)"
summary:
  ar: "أسرة أصلها إيراني من الصوفية وفقهاء الشافعية، فرع منها هاجر إلى الشام وصار ذا نفوذ في عهد الأيوبيين، وفي مقدمتهم الملك الكامل وأبناؤه. وكان أول معروف منها أبو عبد الله محمد بن حموية الجويني، المتوفى سنة 530هـ، وكان صوفيًا شهيرًا وشيخًا ومؤلفًا في التصوف، وعيّن نور الدين حفيده عماد الدين عمر سنة 563هـ (1167م) مفتشًا للمؤسسات الصوفية في دمشق وحماة وحمص وبعلبك {cite:encyclopaedia-of-islam-2 vol. 1 p. 815}."
  en: "A family of Iranian origin, of Sufis and Shafi'i jurists, a branch of which settled in Syria and became influential under the later Ayyubids, above all al-Malik al-Kamil and his sons. The earliest known member, Abu 'Abd Allah Muhammad ibn Hamawiya al-Juwayni (died 530 AH, 1135-6), was a celebrated Sufi, shaykh and author of works on mysticism. His grandson 'Imad al-Din 'Umar was appointed by Nur al-Din in 563 AH (1167) inspector of the Sufi institutions in Damascus, Hama, Homs, Baalbek and other places {cite:encyclopaedia-of-islam-2 vol. 1 p. 815}."
