summary:
  ar: "قناة تلفزيونية إسلامية إثيوبية تبث عبر القمر الصناعي بالأمهرية والأفان أورومو والعفارية والصومالية، وتقدم الأخبار والبرامج التعليمية وسلسلة أناشيد «مركوز» من إنتاج ذراعها «مينبر ملتيميديا»؛ بلغ عدد مشتركي قناتها على يوتيوب (@MinberTv1) نحو 857 ألفًا بحسب عدّاد vidIQ المقروء في 5 نوفمبر 2026."
  en: "An Ethiopian Islamic satellite television station broadcasting in Amharic, Afaan Oromo, Afar and Somali, carrying news, teaching programmes and the Merkuz nasheed series produced by its Minber Multimedia Production arm; its YouTube channel (@MinberTv1) counted about 857 thousand subscribers by vidIQ's count read on 5 November 2026."
  ur: "منبر ٹی وی ایتھوپیا کا اسلامی سیٹلائٹ ٹیلی ویژن چینل ہے جو امہری، افان اورومو، عفار اور صومالی زبانوں میں نشر ہوتا ہے؛ اس کے یوٹیوب چینل (@MinberTv1) کے سبسکرائبرز کی تعداد 5 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 857 ہزار تھی۔"
  es: "Estación de televisión por satélite islámica etíope que transmite en amárico, afaan oromo, afar y somalí y transmite noticias, programas educativos y la serie Merkuz nasheed producida por su filial Minber Multimedia Production; su canal de YouTube (@MinberTv1) contaba con alrededor de 857 mil suscriptores según el recuento de vidIQ leído el 5 de noviembre de 2026."
  fr: "Une station de télévision par satellite islamique éthiopienne diffusant en amharique, afaan oromo, afar et somali, diffusant des informations, des programmes pédagogiques et la série Merkuz nasheed produite par sa branche Minber Multimedia Production; sa chaîne YouTube (@MinberTv1) comptait environ 857 000 abonnés selon le décompte de vidIQ lu le 5 novembre 2026."
  tr: "Etiyopya merkezli İslami bir uydu televizyon kanalı olan MinberTv1, Amharca, Afaan Oromo, Afar ve Somali dillerinde yayın yapıyor ve haberler, eğitim programları ile iştiraki \"Minber Multimedia\" tarafından üretilen \"Merkoz\" şarkı serisini sunuyor. 5 Kasım 2026'da vidIQ sayacından okunan verilere göre, YouTube kanalının (@MinberTv1) yaklaşık 857.000 abonesi bulunuyor."
  id: "Sebuah saluran televisi satelit Islam Ethiopia yang menyiarkan program dalam bahasa Amharik, Afaan Oromo, Afar, dan Somali, menawarkan berita, program pendidikan, dan seri lagu “Merkoz” yang diproduksi oleh anak perusahaannya, “Minber Multimedia”. Saluran YouTube-nya (@MinberTv1) memiliki sekitar 857.000 pelanggan menurut penghitung vidIQ pada 5 November 2026."
