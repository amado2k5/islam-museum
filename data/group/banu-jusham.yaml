summary:
  en: "A warrior clan of the Hawazin confederation; among them was the aged veteran commander and poet Durayd ibn al-Simma, who advised against driving the women and wealth into battle at Hunayn."
  ar: "بطن من قبائل هوازن اشتهر بالفروسية والشعر؛ كان فيهم الفارس الشاعر المجرب دريد بن الصمة الذي أنكر على مالك بن عوف سوق الأموال والنساء إلى المعركة بحنين."
  es: "Un clan guerrero de la confederación Hawazin; entre ellos se encontraba el anciano comandante y poeta Durayd ibn al-Simma, quien aconsejó no llevar a las mujeres y las riquezas a la batalla de Hunayn."
  fr: "Un clan guerrier de la confédération Hawazin; parmi eux se trouvait le commandant vétéran et poète âgé Durayd ibn al-Simma, qui déconseilla d'envoyer les femmes et les richesses au combat à Hunayn."
  ur: "ہوازن کنفیڈریشن کا ایک جنگجو قبیلہ؛ ان میں عمر رسیدہ کمانڈر اور شاعر دورید بن السمٰہ بھی تھے جنہوں نے حنین میں عورتوں اور مال ودولت کو جنگ میں نہ ڈالنے کا مشورہ دیا۔"
