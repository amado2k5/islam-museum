summary:
  ar: "أشهر بطون قحطان مع كهلان؛ غلبت على مملكة سبأ نحو سنة 115ق.م واتخذت ظفار عاصمة، ومنها ملوك اليمن الأخيرون كذي نواس وبيت ذي يزن. وكان ملك القوم في زمان السد يقرب الحكماء ويؤثرهم لجمعهم من أقطار الأرض للالتجاء إلى رأيهم فشاورهم في دفع السيل فأجمعوا على عمل مصارف إلى البراري تقذف به إلى البحر لأن في طباع الماء طلاب الخفض {cite:muruj-al-dhahab p. 490}"
  en: "The most famous Qahtani stock with Kahlan; it took over the kingdom of Saba around 115 BCE, made Zafar its capital, and produced Yemen’s later kings such as Dhu Nuwas and the house of Dhu Yazan."
