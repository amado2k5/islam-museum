summary:
  ar: "أشهر بطون قحطان مع كهلان؛ غلبت على مملكة سبأ نحو سنة 115ق.م واتخذت ظفار عاصمة، ومنها ملوك اليمن الأخيرون كذي نواس وبيت ذي يزن. وكان ملك القوم في زمان السد يقرب الحكماء ويؤثرهم لجمعهم من أقطار الأرض للالتجاء إلى رأيهم فشاورهم في دفع السيل فأجمعوا على عمل مصارف إلى البراري تقذف به إلى البحر لأن في طباع الماء طلاب الخفض {cite:muruj-al-dhahab p. 490}"
  en: "The most famous Qahtani stock with Kahlan; it took over the kingdom of Saba around 115 BCE, made Zafar its capital, and produced Yemen’s later kings such as Dhu Nuwas and the house of Dhu Yazan."
  es: "La dinastía Qahtani más famosa fue la de Kahlan; se apoderó del reino de Saba alrededor del año 115 a. C., convirtió a Zafar en su capital y produjo a los reyes posteriores de Yemen, como Dhu Nuwas y la casa de Dhu Yazan."
  fr: "La lignée Qahtani la plus célèbre est celle de Kahlan; elle s'empara du royaume de Saba vers 115 avant notre ère, fit de Zafar sa capitale et donna naissance aux rois ultérieurs du Yémen, tels que Dhu Nuwas et la maison de Dhu Yazan."
  ur: "کاہلان کے ساتھ سب سے مشہور قحطانی اسٹاک؛ اس نے 115 قبل مسیح کے لگ بھگ سبا کی سلطنت پر قبضہ کیا، ظفر کو اپنا دارالحکومت بنایا، اور یمن کے بعد کے بادشاہوں جیسے ذو نواس اور ذو یزان کا گھر پیدا کیا۔"
  tr: "Kahlan ile birlikte en ünlü Kahtan kabilesi, MÖ 115 civarında Saba krallığını fethetti ve Zafar'ı başkent olarak kurdu. Yemen'in son kralları, örneğin Zü Nuvas ve Zü Yazan Hanedanı, bu kabileden çıktı. Baraj zamanında, halkın kralı bilgeleri yanına getirir ve onlara destek olurdu; dünyanın dört bir yanından onları toplayıp tavsiyelerini alırdı. Sel sularının yönünü değiştirmek konusunda onlara danıştı ve onlar da oybirliğiyle, suyun doğal olarak yokuş aşağı akma eğiliminde olduğu için, suyu denize doğru yönlendirmek üzere çöle kanallar inşa etme konusunda anlaştılar. {cite:muruj-al-dhahab s. 490}"
  id: "Suku Qahtan yang paling terkenal, bersama dengan Kahlan, menaklukkan kerajaan Sabaean sekitar tahun 115 SM dan menjadikan Zafar sebagai ibu kotanya. Dari suku ini lahirlah raja-raja terakhir Yaman, seperti Dhu Nuwas dan Dinasti Dhu Yazan. Pada masa pembangunan bendungan, raja rakyat biasa mengumpulkan orang-orang bijak dan memuliakan mereka, mengumpulkan mereka dari seluruh penjuru bumi untuk meminta nasihat. Ia berkonsultasi dengan mereka tentang pengalihan air banjir, dan mereka sepakat untuk membangun saluran pengalihan ke gurun, mengarahkan air ke laut, karena air secara alami cenderung mengalir ke bawah. {cite:muruj-al-dhahab hlm. 490}"
