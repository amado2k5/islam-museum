label: { ar: "بنو شاكر المنجم", en: "Banu Shakir", es: "Banu Shakir", fr: "Banu Shakir", ur: "بنو شاکر", tr: "Banu Shakir al-Munajjim", id: "Banu Shakir al-Munajjim" }
summary:
  ar: "بنو شاكر محمد وأحمد والحسن المنجم، عنوا بإخراج الكتب من بلد الروم بجهد وبذلوا الرغائب وأنفذوا حنين بن إسحاق وغيره فجاؤهم بطرائف الكتب وغرائب المصنفات في الفلسفة والهندسة والموسيقى والأرثماطيقي والطب {cite:fihrist-ibn-al-nadim p. 339-340}."
  en: "The three sons of Shakir who funded the Byzantine book-hunts and Hunayn's missions {cite:fihrist-ibn-al-nadim p. 339-340}."
  es: "Los tres hijos de Shakir que financiaron las búsquedas de libros bizantinos y las misiones de Hunayn {cite:fihrist-ibn-al-nadim p. 339-340}."
  fr: "Les trois fils de Shakir qui ont financé les chasses aux livres byzantines et les missions de Hunayn {cite:fihrist-ibn-al-nadim p. 339-340}."
  ur: "شاکر کے تین بیٹے جنہوں نے بازنطینی کتابوں کے شکار اور حنین کے مشنوں کو مالی امداد فراہم کی تھی۔ 339-340}۔"
  tr: "Beni Şakir, Muhammed, Ahmed ve Hasan el-Münacim, Roma topraklarından kitapları getirmek için büyük özen gösterdiler ve büyük çaba sarf ederek Huneyn ibn İshak ve diğerlerini gönderdiler; onlar da onlara felsefe, mühendislik, müzik, aritmetik ve tıp alanlarında nadir kitaplar ve sıra dışı eserler getirdiler. {cite:fihrist-ibn-al-nadim s. 339-340}"
  id: "Bani Shakir, Muhammad, Ahmad, dan Al-Hasan Al-Munajjim, sangat berhati-hati dalam membawa buku-buku keluar dari negeri Romawi dengan susah payah dan melakukan upaya besar serta mengirim Hunayn ibn Ishaq dan lainnya, yang membawakan mereka buku-buku langka dan karya-karya luar biasa dalam bidang filsafat, teknik, musik, aritmatika, dan kedokteran {cite:fihrist-ibn-al-nadim p. 339-340}."
