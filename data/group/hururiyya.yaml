label: { ar: "الحرورية", en: "the Hururiyya" }
summary:
  ar: "أول معسكر اعتزالي للخوارج، سموا بحروراء قرية من قرى الكوفة لاجتماعهم فيها حين انحاز عن علي اثنا عشر ألفاً من القراء وغيرهم بعد صحيفة التحكيم، وجعلوا عليهم شبيب بن ريعي التميمي وعلى صلاتهم عبد الله بن الكواء اليشكري، فخرج إليهم علي وناظرهم فدخلوا الكوفة، وكانوا ينادونه وهو على المنبر جزعت من البلية ورضيت بالقضية لا حكم إلا لله فيقول حكم الله أنتظر فيكم {cite:muruj-al-dhahab p. 685}."
  en: "The first Kharijite secession camp — named for Harura' near Kufa where twelve thousand qurra' withdrew after the arbitration sheet, with Shabib ibn Ray'i commanding and Ibn al-Kawwa' leading prayer; Ali debated them back into the city while their minbar heckling already rang 'no judgement but God's' {cite:muruj-al-dhahab p. 685}."
