label: { ar: "الحرورية", en: "the Hururiyya", es: "la Hururiyya", fr: "la Hururiyya" }
summary:
  ar: "أول معسكر اعتزالي للخوارج، سموا بحروراء قرية من قرى الكوفة لاجتماعهم فيها حين انحاز عن علي اثنا عشر ألفاً من القراء وغيرهم بعد صحيفة التحكيم، وجعلوا عليهم شبيب بن ريعي التميمي وعلى صلاتهم عبد الله بن الكواء اليشكري، فخرج إليهم علي وناظرهم فدخلوا الكوفة، وكانوا ينادونه وهو على المنبر جزعت من البلية ورضيت بالقضية لا حكم إلا لله فيقول حكم الله أنتظر فيكم {cite:muruj-al-dhahab p. 685}."
  en: "The first Kharijite secession camp — named for Harura' near Kufa where twelve thousand qurra' withdrew after the arbitration sheet, with Shabib ibn Ray'i commanding and Ibn al-Kawwa' leading prayer; Ali debated them back into the city while their minbar heckling already rang 'no judgement but God's' {cite:muruj-al-dhahab p. 685}."
  es: "El primer campamento de secesión jariyí —llamado así por Harura' cerca de Kufa, donde doce mil qurra' se retiraron después del acta de arbitraje, con Shabib ibn Ray'i al mando e Ibn al-Kawwa' dirigiendo la oración; Ali los convenció de regresar a la ciudad mientras sus abucheos en el minbar ya resonaban con el lema \"no hay juicio sino el de Dios\" {cite:muruj-al-dhahab p. 685}."
  fr: "Le premier camp sécessionniste kharijite — nommé d'après Harura' près de Kufa où douze mille qurra' se retirèrent après la feuille d'arbitrage, avec Shabib ibn Ray'i commandant et Ibn al-Kawwa' dirigeant la prière; Ali les ramena en ville tandis que leurs huées du minbar résonnaient déjà « pas de jugement sauf celui de Dieu » {cite: muruj-al-dhahab p. 685}."
