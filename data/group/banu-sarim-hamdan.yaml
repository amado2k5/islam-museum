summary:
  ar: قوم من وجوه همدان ورجالها بحسب الراوي، لهم بركة بات عندها الهادي ليلة الجمعة 14 شوال 285هـ وكانوا في ميمنة جيشه في حرب أثافت.
  en: A people of the notables of Hamdan and its men, by the narrator, with a pond at which al-Hadi spent the night before Friday 14 Shawwal 285 AH, and who stood on the right of his army in the war at Athafit.
