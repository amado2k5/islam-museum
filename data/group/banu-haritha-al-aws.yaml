label: { ar: "بنو حارثة بن الحارث", en: "Banu Haritha ibn al-Harith" }
summary:
  ar: "بطن من الأوس، بنو حارثة بن الحارث بن الخزرج الأصغر؛ نزلوا أولاً مع بني عبد الأشهل دارهم مع طرف الحرة الشرقية فابتنوا أطم «المسيّر»، ثم نشبت بينهم حرب قُتل فيها سماك بن رافع بيد مسعود أبي محيصة الحارثي، فأجلوهم إلى أرض بني سليم وسار بهم حضير بن سماك حتى حوصروا في أطمهم، فتوسطت بنو هرو بن عوف وبنو خطمة فأجلوهم، فنزلوا خيبر نحو سنة ثم اصطلحوا بشفاعة الشفراء، وأبوا العودة إلى الدار المشتركة فنزلوا ناحية يثرب غربي مشهد حمزة حيث كانت منازلهم حين جاء الإسلام، وابتنوا بها أطم «الريان» عند مسجدهم. وليلة أحد بات النبي ببيوتهم عند الشيخين {cite:samhudi-wafa-al-wafa p. 202-204}."
  en: "A clan of the Aws, Banu Haritha ibn al-Harith ibn al-Khazraj the Younger; they first shared the Abd al-Ashhal quarter by the eastern Harra and built the utm 'al-Musayyir', then war broke out in which Simak ibn Rafi' fell to Mas'ud Abu Muhayysa — the expelled Banu Haritha withdrew to Banu Sulaym's land, were besieged in their tower by Hudayr ibn Simak until Banu Harw ibn 'Awf and Banu Khatma mediated their evacuation, spent about a year at Khaybar, were reconciled through al-Shafra''s intercession, and refusing to return settled the Yathrib neighbourhood west of Hamza's shrine where Islam found them, building the utm 'al-Rayyan' by their mosque; the Prophet spent the eve of Uhud in their houses at al-Shaykhan {cite:samhudi-wafa-al-wafa p. 202-204}."
