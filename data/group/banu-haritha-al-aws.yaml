label: { ar: "بنو حارثة بن الحارث", en: "Banu Haritha ibn al-Harith", es: "Banu Haritha ibn al-Harith", fr: "Banu Haritha ibn al-Harith", ur: "بنو حارثہ بن الحارث" }
summary:
  ar: "بطن من الأوس، بنو حارثة بن الحارث بن الخزرج الأصغر؛ نزلوا أولاً مع بني عبد الأشهل دارهم مع طرف الحرة الشرقية فابتنوا أطم «المسيّر»، ثم نشبت بينهم حرب قُتل فيها سماك بن رافع بيد مسعود أبي محيصة الحارثي، فأجلوهم إلى أرض بني سليم وسار بهم حضير بن سماك حتى حوصروا في أطمهم، فتوسطت بنو هرو بن عوف وبنو خطمة فأجلوهم، فنزلوا خيبر نحو سنة ثم اصطلحوا بشفاعة الشفراء، وأبوا العودة إلى الدار المشتركة فنزلوا ناحية يثرب غربي مشهد حمزة حيث كانت منازلهم حين جاء الإسلام، وابتنوا بها أطم «الريان» عند مسجدهم. وليلة أحد بات النبي ببيوتهم عند الشيخين {cite:samhudi-wafa-al-wafa p. 202-204}."
  en: "A clan of the Aws, Banu Haritha ibn al-Harith ibn al-Khazraj the Younger; they first shared the Abd al-Ashhal quarter by the eastern Harra and built the utm 'al-Musayyir', then war broke out in which Simak ibn Rafi' fell to Mas'ud Abu Muhayysa — the expelled Banu Haritha withdrew to Banu Sulaym's land, were besieged in their tower by Hudayr ibn Simak until Banu Harw ibn 'Awf and Banu Khatma mediated their evacuation, spent about a year at Khaybar, were reconciled through al-Shafra''s intercession, and refusing to return settled the Yathrib neighbourhood west of Hamza's shrine where Islam found them, building the utm 'al-Rayyan' by their mosque; the Prophet spent the eve of Uhud in their houses at al-Shaykhan {cite:samhudi-wafa-al-wafa p. 202-204}."
  es: "Un clan de los Aws, Banu Haritha ibn al-Harith ibn al-Khazraj el Joven; primero compartieron el barrio de Abd al-Ashhal junto al Harra oriental y construyeron el utm 'al-Musayyir', luego estalló la guerra en la que Simak ibn Rafi' cayó ante Mas'ud Abu Muhayysa; los Banu Haritha expulsados se retiraron a la tierra de Banu Sulaym, fueron sitiados en su torre por Hudayr ibn Simak hasta que Banu Harw ibn 'Awf y Banu Khatma mediaron en su evacuación, pasaron alrededor de un año en Khaybar, se reconciliaron por intercesión de al-Shafra y, negándose a regresar, se establecieron en el barrio de Yathrib al oeste del santuario de Hamza, donde el Islam los encontró, construyendo el utm 'al-Rayyan' junto a su mezquita; El Profeta pasó la víspera de Uhud en sus casas en al-Shaykhan {cite:samhudi-wafa-al-wafa p. 202-204}."
  fr: "Un clan des Aws, les Banu Haritha ibn al-Harith ibn al-Khazraj le Jeune; ils partagèrent d'abord le quartier d'Abd al-Ashhal près de l'est de Harra et construisirent l'utm 'al-Musayyir', puis la guerre éclata au cours de laquelle Simak ibn Rafi' tomba aux mains de Mas'ud Abu Muhayysa — les Banu Haritha expulsés se retirèrent sur les terres des Banu Sulaym, furent assiégés dans leur tour par Hudayr ibn Simak jusqu'à ce que Banu Harw ibn 'Awf et Banu Khatma organisent leur évacuation, passèrent environ un an à Khaybar, furent réconciliés grâce à l'intercession d'al-Shafra', et refusant de retourner s'installer dans le quartier de Yathrib à l'ouest du sanctuaire de Hamza où l'Islam les trouva, construisant l'utm 'al-Rayyan' près de leur mosquée; Le Prophète a passé la veille d'Uhud dans leurs maisons à al-Shaykhan {cite:samhudi-wafa-al-wafa p. 202-204}."
  ur: "اوس کا ایک قبیلہ، بنو حارثہ ابن حارث ابن الخزرج چھوٹا؛ انہوں نے سب سے پہلے مشرقی حرہ کی طرف سے عبد الاشحل کوارٹر کا اشتراک کیا اور امت المصیر تعمیر کیا، پھر جنگ چھڑ گئی جس میں سماک بن رافع مسعود ابو محیصہ کے ہاتھ میں آگئے - نکالے گئے بنو حارثہ بنو سلیم کی سرزمین پر واپس چلے گئے، سماک بن حارثہ بنو سلیم کی سرزمین پر ان کا محاصرہ کر لیا گیا یہاں تک کہ بعقوبن اور حذیفہ نے ان کے برج کا محاصرہ کیا۔ بنو خاتمہ نے ان کے انخلاء میں ثالثی کی، تقریباً ایک سال خیبر میں گزارا، الشفراء کی شفاعت کے ذریعے صلح کرائی گئی، اور واپسی سے انکار کرتے ہوئے حمزہ کے مزار کے مغرب میں یثرب کے محلے کو آباد کیا جہاں اسلام نے انہیں پایا، اپنی مسجد کے پاس امت 'الریان' تعمیر کیا۔ نبی نے احد کی شام الشیخان میں ان کے گھروں میں گزاری۔ 202-204}۔"
