label:
  ar: الدروز
  en: Druze
summary:
  ar: "الدروز؛ جماعة مغلقة انطووا على أنفسهم فلا يعرف الناس من أمرهم شيئاً، دعاتهم طبقات: الدعاة والعقلاء بأيديهم الأسرار الداخلية للمذهب والأجاويد مفاتيح الأسرار الخارجية لعلاقتهم بغيرهم، وقد دعي بتأليه الحاكم بأمر الله سنة 408هـ، وعاونوا المسلمين على الصليبيين معاونة صادقة وكانت لهم مواقف حربية رائعة في حصار قلعة الشقيف، وعاونوا هولاكو إبان إغارته على الشام، ولهم شأن في حروب جبل لبنان إلى عهد الانتداب."
  en: "The Druze; a closed community folded in on itself, their da'wa ordered in grades — the du'at, the 'uqala' keepers of the faith's inner secrets, the jawahid holding the outer keys of dealing with others — risen from the 408 proclamation of al-Hakim's divinity; they aided the Muslims faithfully against the Crusaders with splendid stands at the siege of Qal'at al-Shaqif, aided Hulagu's raid on Syria, and kept their martial name in Lebanon's wars into the Mandate."
