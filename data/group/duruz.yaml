summary:
  ar: "الدروز؛ جماعة مغلقة انطووا على أنفسهم فلا يعرف الناس من أمرهم شيئاً، دعاتهم طبقات: الدعاة والعقلاء بأيديهم الأسرار الداخلية للمذهب والأجاويد مفاتيح الأسرار الخارجية لعلاقتهم بغيرهم، وقد دعي بتأليه الحاكم بأمر الله سنة 408هـ، وعاونوا المسلمين على الصليبيين معاونة صادقة وكانت لهم مواقف حربية رائعة في حصار قلعة الشقيف، وعاونوا هولاكو إبان إغارته على الشام، ولهم شأن في حروب جبل لبنان إلى عهد الانتداب."
  en: "The Druze; a closed community folded in on itself, their da'wa ordered in grades — the du'at, the 'uqala' keepers of the faith's inner secrets, the jawahid holding the outer keys of dealing with others — risen from the 408 proclamation of al-Hakim's divinity; they aided the Muslims faithfully against the Crusaders with splendid stands at the siege of Qal'at al-Shaqif, aided Hulagu's raid on Syria, and kept their martial name in Lebanon's wars into the Mandate."
  es: "Los drusos, una comunidad cerrada y ensimismada, con su da'wa organizada en grados —los du'at, los 'uqala' guardianes de los secretos internos de la fe, los jawahid poseedores de las claves externas para tratar con los demás— surgieron de la proclamación de la divinidad de al-Hakim en el año 408; ayudaron fielmente a los musulmanes contra los cruzados con espléndidas resistencias en el asedio de Qal'at al-Shaqif, apoyaron la incursión de Hulagu en Siria y mantuvieron su nombre marcial en las guerras del Líbano durante el Mandato."
  fr: "Les Druzes; une communauté fermée repliée sur elle-même, dont la da'wa était organisée en grades — les du'at, les 'uqala' gardiens des secrets intérieurs de la foi, les jawahid détenant les clés extérieures des relations avec autrui — apparut suite à la proclamation de la divinité d'al-Hakim en 408; ils aidèrent fidèlement les musulmans contre les Croisés avec des résistances splendides lors du siège de Qal'at al-Shaqif, aidèrent Hulagu lors de son raid sur la Syrie et conservèrent leur nom martial dans les guerres du Liban durant le Mandat."
  ur: "ڈروز؛ ایک بند کمیونٹی جو اپنے آپ میں سمٹی ہوئی تھی، ان کی دعوت کو درجات میں ترتیب دیا گیا تھا - دعا، ایمان کے اندرونی رازوں کے 'اقالہ' کے محافظ، دوسروں کے ساتھ معاملات کی بیرونی چابیاں رکھنے والے جاوید - الحکیم کے الوہیت کے 408 اعلان سے ابھرے؛ انہوں نے قلات الشقیف کے محاصرے میں شاندار کھڑے ہو کر صلیبیوں کے خلاف مسلمانوں کی وفاداری کے ساتھ مدد کی، شام پر ہلاگو کے حملے میں مدد کی، اور لبنان کی جنگوں میں اپنے جنگی نام کو مینڈیٹ میں رکھا۔"
  tr: "Dürziler, kendi içlerine kapalı, kendi başlarına yaşayan bir topluluktur; bu nedenle insanlar onlar hakkında pek bir şey bilmezler. Vaizleri farklı sınıflardandır: Vaizler ve bilge kişiler mezhebin iç sırlarına sahipken, yaşlılar ise diğerleriyle olan ilişkilerinin dış sırlarının anahtarlarına sahiptir. Hicri 408 yılında El-Hakim bi-Amr Allah'ın ilahlaştırılmasını savundular. Haçlılara karşı Müslümanlara samimi bir şekilde yardım ettiler ve El-Şakif Kalesi kuşatmasında harika askeri duruşlar sergilediler. Hülagu'nun Levant'a yaptığı baskında ona yardım ettiler ve Manda dönemine kadar Lübnan Dağı savaşlarında rol oynadılar."
  id: "Kaum Druze adalah kelompok tertutup yang mandiri, sehingga orang-orang tidak mengetahui apa pun tentang mereka. Para pengkhotbah mereka berasal dari berbagai kelas: para pengkhotbah dan orang bijak memiliki rahasia internal sekte tersebut, dan para tetua memiliki kunci rahasia eksternal hubungan mereka dengan orang lain. Mereka menyerukan pendewaan Al-Hakim bi-Amr Allah pada tahun 408 Hijriah. Mereka membantu kaum Muslim melawan Tentara Salib dengan bantuan yang tulus dan memiliki posisi militer yang luar biasa dalam pengepungan Kastil Al-Shaqif. Mereka membantu Hulagu selama serangannya ke Levant, dan mereka berperan dalam perang Gunung Lebanon hingga era Mandat."
