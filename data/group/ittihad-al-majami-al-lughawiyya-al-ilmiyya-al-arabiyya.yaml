  en: "Union of Arab Language Academies (Ittihad al-Majami' al-Lughawiyya al-'Ilmiyya al-'Arabiyya)"
  ur: "اتحاد المجامع اللغویۃ العلمیۃ العربیۃ"
  fr: "Union des académies de la langue arabe (Ittihad al-Majami' al-Lughawiyya al-'Ilmiyya al-'Arabiyya)"
  es: "Unión de Academias de la Lengua Árabe (Ittihad al-Majami' al-Lughawiyya al-'Ilmiyya al-'Arabiyya)"
