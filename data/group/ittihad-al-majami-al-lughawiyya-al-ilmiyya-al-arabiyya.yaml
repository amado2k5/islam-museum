summary:
  ar: "اتحاد المجامع اللغوية العلمية العربية، أُسس في 13 مارس 1971 بعد توصية مؤتمر لجامعة الدول العربية سنة 1956، كما يلخص ملف بحث قُدّم للمتحف. أسسه مجمعا القاهرة وبغداد ودمشق، وكان طه حسين أول رئيس وإبراهيم مدكور أميناً عاماً، ومقره مدينة السادس من أكتوبر في مصر، وهو ينسّق عمل المجامع ويوحّد المصطلح العلمي بندوات دورية ويتصدر المعجم التاريخي للغة العربية."
  en: "The Union of Arab Language Academies, founded on 13 March 1971 after a recommendation of an Arab League conference in 1956, as a research summary supplied to the museum gives it. It was founded jointly by the academies of Cairo, Baghdad and Damascus, with Taha Hussein as first president and Ibrahim Madkour as secretary-general, is headquartered in 6th of October City, Egypt, coordinates member academies, standardises scientific terms through periodic symposia and spearheaded the Historical Dictionary of the Arabic Language."
  ur: "اتحاد المجامع اللغویۃ العلمیۃ العربیۃ، جو 13 مارچ 1971ء کو عرب لیگ کی 1956ء کی ایک کانفرنس کی سفارش کے بعد قائم ہوا، جیسا کہ عجائب گھر کو فراہم کردہ تحقیقی خلاصہ دیتا ہے۔ اسے قاہرہ، بغداد اور دمشق کے مجامع نے مل کر قائم کیا، طہ حسین پہلے صدر اور ابراہیم مدکور سیکرٹری جنرل تھے، اس کا صدر دفتر مصر کے شہر السادس من اکتوبر میں ہے، یہ رکن مجامع کے کام کو مربوط کرتا ہے، دوری سمپوزیا سے علمی اصطلاح کو یکساں بناتا ہے اور عربی زبان کی تاریخی لغت کی قیادت کرتا ہے۔"
  fr: "L'Union des académies de la langue arabe, fondée le 13 mars 1971 après une recommandation d'une conférence de la Ligue arabe en 1956, comme le donne une note de recherche fournie au musée. Elle fut fondée conjointement par les académies du Caire, de Bagdad et de Damas, avec Taha Hussein premier président et Ibrahim Madkour secrétaire général, a son siège à la ville du 6-Octobre en Égypte, coordonne les académies membres, uniformise les termes scientifiques par des colloques périodiques et a mené le Dictionnaire historique de la langue arabe."
  es: "La Unión de Academias de la Lengua Árabe, fundada el 13 de marzo de 1971 tras una recomendación de una conferencia de la Liga Árabe en 1956, según un resumen de investigación entregado al museo. La fundaron conjuntamente las academias de El Cairo, Bagdad y Damasco, con Taha Hussein como primer presidente e Ibrahim Madkour como secretario general; tiene su sede en la ciudad del 6 de Octubre, Egipto, coordina las academias miembros, unifica los términos científicos mediante simposios periódicos y encabezó el Diccionario histórico de la lengua árabe."
  tr: "Arap Bilimsel Dil Akademileri Birliği, müzeye sunulan bir araştırma makalesinde özetlendiği üzere, Arap Devletleri Birliği'nin 1956 konferansında alınan bir tavsiye üzerine 13 Mart 1971'de kurulmuştur. Kahire, Bağdat ve Şam akademileri tarafından kurulan birliğin ilk başkanı Taha Hüseyin, genel sekreteri ise İbrahim Madkour'dur. Merkezi Mısır'ın 6 Ekim şehrindedir. Birlik, akademilerin çalışmalarını koordine eder, düzenli seminerlerle bilimsel terminolojiyi standartlaştırır ve Arap Dilinin Tarihsel Sözlüğü'nün öncülüğünü yapar."
  id: "Persatuan Akademi Bahasa Ilmiah Arab didirikan pada tanggal 13 Maret 1971, menyusul rekomendasi dari konferensi Liga Negara-negara Arab tahun 1956, sebagaimana dirangkum dalam makalah penelitian yang diserahkan ke museum. Persatuan ini didirikan oleh akademi Kairo, Baghdad, dan Damaskus, dengan Taha Hussein sebagai presiden pertamanya dan Ibrahim Madkour sebagai sekretaris jenderalnya. Kantor pusatnya berada di Kota 6 Oktober, Mesir. Persatuan ini mengkoordinasikan pekerjaan akademi-akademi tersebut, menstandarisasi terminologi ilmiah melalui seminar-seminar reguler, dan berada di garis depan dalam penyusunan Kamus Sejarah Bahasa Arab."
