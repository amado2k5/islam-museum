summary:
  ar: "الطريقة المولوية المنسوبة إلى جلال الدين الرومي ⁦(ت 672هـ/1273م)⁩ — «الدراويش الدوّارون» — من أشهر طرق الأناضول والعالم العثماني {cite:trimingham-sufi-orders-1998}."
  en: "The Mawlawi order traced to Jalal al-Din al-Rumi (d. 672 AH/1273 CE) — the 'whirling dervishes' — among the best-known orders of Anatolia and the Ottoman world {cite:trimingham-sufi-orders-1998}."
  es: "La orden Mawlawi, que se remonta a Jalal al-Din al-Rumi (m. 672 AH/1273 CE) —los 'derviches giratorios'—, se encuentra entre las órdenes más conocidas de Anatolia y el mundo otomano {cite:trimingham-sufi-orders-1998}."
  fr: "L'ordre Mawlawi, dont l'origine remonte à Jalal al-Din al-Rumi (mort en 672 AH/1273 CE) — les « derviches tourneurs » — est l'un des ordres les plus connus d'Anatolie et du monde ottoman {cite:trimingham-sufi-orders-1998}."
  ur: "مولوی کا حکم جلال الدین الرومی ⁦(متوفی 672 ہجری/1273 عیسوی)⁩ سے ملتا ہے - 'گھومنے والے درویش' - اناطولیہ اور عثمانی دنیا کے سب سے مشہور حکموں میں سے {حوالہ: trimingham-sufi-orders-1998}۔"
  tr: "Celaleddin Rumi'ye (ö. 672 Hicri/1273 Miladi) atfedilen Mevlevi Tarikatı, \"Gezgin Dervişler\" olarak da bilinir ve Anadolu'nun ve Osmanlı dünyasının en ünlü tarikatlarından biridir. {cite:trimingham-sufi-orders-1998}"
  id: "Tarekat Mevlevi, yang dikaitkan dengan Jalal al-Din Rumi (wafat 672 H/1273 M) — “Para Dervish Pengembara” — adalah salah satu tarekat paling terkenal di Anatolia dan dunia Ottoman {cite:trimingham-sufi-orders-1998}."
