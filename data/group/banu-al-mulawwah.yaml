summary:
  ar: "بطن من كنانة كانوا بالكديد، بعث النبي عليهم غالب بن عبد الله الليثي في سرية فشنّ عليهم الغارة في وجه السحر وقتل واستاق النعم، كما يرويه جندب بن مكيث."
  en: "A clan of Kinana at al-Kudayd against whom the Prophet sent Ghalib ibn Abdullah al-Laythi; the detachment raided them before dawn, killed and drove off the herds, as Jundab ibn Makith relates."
  es: "Un clan de Kinana en al-Kudayd contra el cual el Profeta envió a Ghalib ibn Abdullah al-Laythi; el destacamento los asaltó antes del amanecer, mató y ahuyentó a los rebaños, como relata Jundab ibn Makith."
  fr: "Un clan de Kinana à al-Kudayd contre lequel le Prophète envoya Ghalib ibn Abdullah al-Laythi; le détachement les attaqua avant l'aube, tua et emporta les troupeaux, comme le raconte Jundab ibn Makith."
  ur: "قدید میں کنانہ کا ایک قبیلہ جس کے خلاف نبی نے غالب ابن عبداللہ لیثی کو بھیجا تھا۔ جندب بن مکث کا بیان ہے کہ اس دستے نے فجر سے پہلے ان پر چھاپہ مارا، مار ڈالا اور ریوڑ کو بھگا دیا۔"
