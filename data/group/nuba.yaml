summary:
  ar: "عند البلاذري: قوم رشقوا المسلمين بالنبل حتى فقئوا الحدق فسمّوا دماة الحدق وشهدهم شيخ من حمير فقال لم يرَ قوماً أحدّ في حرب منهم أحدهم يقول للمسلم أين تحب أن أضع سهمي منك فلا يخطئه وعُدّت مائة وخمسون عيناً مفقوءة في صف واحد فصالحهم عبد الله بن سعد على هدنة لا جزية فيها."
  en: "In al-Baladhuri: a people who showered the Muslims with arrows gouging eyes — 'the eye-bleeders'; a Himyari shaykh who witnessed them said none sharper in war, one asking a Muslim where he'd like his arrow placed and never missing, a hundred and fifty gouged eyes counted in one line-up; Abdallah ibn Sa'd made peace with them on a truce without jizya."
  es: "En al-Baladhuri: un pueblo que bombardeaba a los musulmanes con flechas que les sacaban los ojos —'los que les sangraban los ojos'—; un jeque himyari que los presenció dijo que no había nadie más afilado en la guerra, uno de ellos preguntando a un musulmán dónde quería que le clavaran la flecha y sin fallar nunca, ciento cincuenta ojos arrancados contados en una sola fila; Abdallah ibn Sa'd hizo las paces con ellos mediante una tregua sin jizya."
  fr: "Dans al-Baladhuri: un peuple qui criblait les musulmans de flèches leur crevant les yeux — « les saigneurs d'yeux »; un cheikh himyarite qui en fut témoin affirma qu'il n'y avait pas plus tranchant à la guerre, l'un d'eux demandant à un musulman où il voulait que sa flèche soit placée et ne le manquait jamais, cent cinquante yeux crevés furent comptés dans une seule file; Abdallah ibn Sa'd fit la paix avec eux sur une trêve sans jizya."
  ur: "البلادوری میں ہے: وہ لوگ جنہوں نے مسلمانوں پر تیر برسائے تھے آنکھوں سے خون بہانے والے۔ ایک حمیری شیخ جس نے ان کو دیکھا تھا، نے کہا کہ جنگ میں کوئی تیز نہیں، ایک نے ایک مسلمان سے پوچھا کہ وہ اپنا تیر کہاں رکھنا چاہتا ہے اور کبھی غائب نہیں ہونا چاہتا، ایک ہی صف میں ایک سو پچاس کنوئیں والی آنکھیں۔ عبداللہ بن سعد نے ان سے بغیر جزیہ کے صلح کر لی۔"
  tr: "El-Baladhuri'ye göre: Bir grup insan Müslümanlara ok yağdırarak gözlerini kör etti; bu yüzden onlara \"Göz Kanı Üfleyenler\" denildi. Himyar'dan yaşlı bir adam buna şahit oldu ve şöyle dedi: \"Savaşta onlardan daha vahşi bir halk görmedim. İçlerinden biri bir Müslümana, 'Okumu nereye saplamamı istersin?' derdi ve hedefi şaşmazdı.\" Bir safta yüz elli kör göz sayıldı; bunun üzerine Abdullah bin Saad, cizye (vergi) alınmayan bir ateşkes anlaşmasıyla onlarla barıştı."
  id: "Menurut Al-Baladhuri: Sekelompok orang menembakkan panah ke arah kaum Muslimin hingga mata mereka buta, sehingga mereka disebut \"Para Peniup Darah Mata\". Seorang lelaki tua dari Himyar menyaksikan ini dan berkata, \"Aku belum pernah melihat suatu kaum yang lebih ganas dalam perang daripada mereka. Salah seorang dari mereka akan berkata kepada seorang Muslim, 'Di mana kau ingin aku menembakkan panahku padamu?' dan dia tidak akan meleset.\" Seratus lima puluh mata yang buta dihitung dalam satu baris, sehingga Abdullah bin Saad berdamai dengan mereka dengan perjanjian damai tanpa pungutan jizya (upeti)."
