summary:
  ar: "عند البلاذري: قوم رشقوا المسلمين بالنبل حتى فقئوا الحدق فسمّوا دماة الحدق وشهدهم شيخ من حمير فقال لم يرَ قوماً أحدّ في حرب منهم أحدهم يقول للمسلم أين تحب أن أضع سهمي منك فلا يخطئه وعُدّت مائة وخمسون عيناً مفقوءة في صف واحد فصالحهم عبد الله بن سعد على هدنة لا جزية فيها."
  en: "In al-Baladhuri: a people who showered the Muslims with arrows gouging eyes — 'the eye-bleeders'; a Himyari shaykh who witnessed them said none sharper in war, one asking a Muslim where he'd like his arrow placed and never missing, a hundred and fifty gouged eyes counted in one line-up; Abdallah ibn Sa'd made peace with them on a truce without jizya."
