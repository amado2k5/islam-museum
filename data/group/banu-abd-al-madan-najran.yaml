id: group/banu-abd-al-madan-najran
class: group
tags: ["umam-browser", "um-tawaif"]
kind: tribe
label:
  ar: بنو عبد المدان بنجران
  en: Banu Abd al-Madan of Najran
  ur: نجران کے بنو عبد المدان
  es: "Banu Abd al-Madan de Najrán"
  fr: "Banu Abd al-Madan de Najran"
  tr: "Najran'daki Banu Abd al-Madan"
  id: "Banu Abd al-Madan di Najran"
summary:
  ar: عشيرة نجرانية قاتل معها بعض رجالها عبد الله بن الحسين وأحمد بن محمد ليلة هجوم بني الحارث ثم عُدّ أنها أجابت بني الحارث فيهما، ثم أرسل نفر منها إلى أبي محمد يطلبون التحالف.
  en: A Najran clan some of whose men fought beside Abdullah ibn al-Husayn and Ahmad ibn Muhammad on the night of Banu al-Harith's attack, were then said by Hamdan to have agreed to Banu al-Harith's demands about them, and later sent some of their number to Abu Muhammad to seek a pledge.
  ur: نجران کی ایک عشیرہ جس کے بعض افراد بنو حارث کے حملے کی رات عبداللہ بن حسین اور احمد بن محمد کے ساتھ لڑے، پھر ہمدان نے کہا کہ انہوں نے بنو حارث کے مطالبے مان لیے، اور بعد میں ان کے کچھ لوگوں نے ابو محمد سے معاہدہ چاہا۔
  es: "Según Hamdan, un clan de Najrán, algunos de cuyos hombres lucharon junto a Abdullah ibn al-Husayn y Ahmad ibn Muhammad la noche del ataque de Banu al-Harith, accedieron a las exigencias de Banu al-Harith y posteriormente enviaron a algunos de sus miembros a Abu Muhammad para pedirle una garantía."
  fr: "Hamdan a ensuite déclaré qu'un clan de Najran, dont certains hommes avaient combattu aux côtés d'Abdullah ibn al-Husayn et d'Ahmad ibn Muhammad la nuit de l'attaque de Banu al-Harith, avait accepté les demandes de Banu al-Harith à leur sujet et avait ensuite envoyé certains des siens à Abu Muhammad pour obtenir un engagement."
  tr: "Najrani kabilesi, Beni Al-Harith'in saldırı gecesinde Abdullah bin Al-Hussein ve Ahmed bin Muhammed gibi bazı adamlarıyla savaştı. Daha sonra, içlerinden bazılarının Beni Al-Harith'e karşılık verdiği ve ardından bir ittifak için Ebu Muhammed'e haber gönderdiği düşünülüyor."
  id: "Klan Najrani berperang bersama beberapa orangnya, Abdullah bin Al-Hussein dan Ahmed bin Muhammad, pada malam serangan Bani Al-Harith. Kemudian dianggap bahwa mereka membalas serangan Bani Al-Harith, lalu sebagian dari mereka mengirim utusan kepada Abu Muhammad untuk meminta persekutuan."
