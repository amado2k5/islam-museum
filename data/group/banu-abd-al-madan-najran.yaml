label:
  ar: بنو عبد المدان بنجران
  en: Banu Abd al-Madan of Najran
  ur: نجران کے بنو عبد المدان
summary:
  ar: عشيرة نجرانية قاتل معها بعض رجالها عبد الله بن الحسين وأحمد بن محمد ليلة هجوم بني الحارث ثم عُدّ أنها أجابت بني الحارث فيهما، ثم أرسل نفر منها إلى أبي محمد يطلبون التحالف.
  en: A Najran clan some of whose men fought beside Abdullah ibn al-Husayn and Ahmad ibn Muhammad on the night of Banu al-Harith's attack, were then said by Hamdan to have agreed to Banu al-Harith's demands about them, and later sent some of their number to Abu Muhammad to seek a pledge.
  ur: نجران کی ایک عشیرہ جس کے بعض افراد بنو حارث کے حملے کی رات عبداللہ بن حسین اور احمد بن محمد کے ساتھ لڑے، پھر ہمدان نے کہا کہ انہوں نے بنو حارث کے مطالبے مان لیے، اور بعد میں ان کے کچھ لوگوں نے ابو محمد سے معاہدہ چاہا۔
