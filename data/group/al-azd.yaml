summary:
  ar: "من بطون كهلان القحطانية؛ هاجرت من اليمن بقيادة عمران بن عمرو مزيقياء، فتفرقت: ثعلبة بن عمرو ومنه الأوس والخزرج إلى المدينة، وخزاعة إلى مكة، وعمران إلى عمان، وجفنة إلى الشام فكان أبا الغساسنة."
  en: "A Kahlani Qahtani tribe that migrated from Yemen under Imran ibn Amr Muzayqiya; its branches dispersed to Yathrib (the Aws and Khazraj through Thaʾlaba), Mecca (Khuzaʾa), Oman, and al-Sham (Jafna, ancestor of the Ghassanids)."
  es: "Una tribu Kahlani Qahtani que emigró de Yemen bajo Imran ibn Amr Muzayqiya; sus ramas se dispersaron a Yathrib (los Aws y Khazraj a través de Thaʾlaba), La Meca (Khuzaʾa), Omán y al-Sham (Jafna, antepasado de los Ghassanids)."
  fr: "Une tribu Kahlani Qahtani qui a émigré du Yémen sous Imran ibn Amr Muzayqiya; ses branches se sont dispersées jusqu'à Yathrib (les Aws et Khazraj en passant par Thaʾlaba), La Mecque (Khuzaʾa), Oman et al-Sham (Jafna, ancêtre des Ghassanides)."
  ur: "ایک کہلانی قحطانی قبیلہ جو یمن سے عمران بن عمرو مضائقیہ کے ماتحت ہجرت کر کے آیا تھا۔ اس کی شاخیں یثرب ⁦(ثعلبہ کے ذریعے اوس اور خزرج)⁩، مکہ ⁦(خوزہ)⁩، عمان، اور الشام ⁦(جفنا، غسانیوں کے آباؤ اجداد)⁩ تک پھیل گئیں۔"
  tr: "Kahlan el-Kahtaniyye kabilelerinden İmran ibn Amr Muzayqiya önderliğinde Yemen'den göç ettiler ve dağıldılar: Tha'labah ibn Amr'dan Aws ve Khazraj Medine'ye, Khuza'ah Mekke'ye, İmran Umman'a ve Jafnah Levant'a yerleşti ve o, Gassanilerin atasıydı."
  id: "Dari suku Kahlan al-Qahtaniyya, mereka berhijrah dari Yaman di bawah kepemimpinan Imran ibn Amr Muzayqiya, dan mereka menyebar: Tha'labah ibn Amr, dari siapa datang Aws dan Khazraj ke Madinah, Khuza'ah ke Mekah, Imran ke Oman, dan Jafnah ke Levant, dan dia adalah bapak dari Dinasti Ghassanid."
