summary:
  ar: "من بطون كهلان القحطانية؛ هاجرت من اليمن بقيادة عمران بن عمرو مزيقياء، فتفرقت: ثعلبة بن عمرو ومنه الأوس والخزرج إلى المدينة، وخزاعة إلى مكة، وعمران إلى عمان، وجفنة إلى الشام فكان أبا الغساسنة."
  en: "A Kahlani Qahtani tribe that migrated from Yemen under Imran ibn Amr Muzayqiya; its branches dispersed to Yathrib (the Aws and Khazraj through Thaʾlaba), Mecca (Khuzaʾa), Oman, and al-Sham (Jafna, ancestor of the Ghassanids)."
