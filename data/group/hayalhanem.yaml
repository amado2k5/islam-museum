summary:
  ar: "قناة حيالهانم على يوتيوب ⁦(@hayalhanem)⁩، وهي جماعة إعلامية إسلامية تركية تنتج قصصًا مصورة ودروسًا وأفلامًا قصيرة؛ بلغ عدد مشتركيها 5,560,000 مشترك وعدد مشاهداتها 1,527,899,907 مشاهدة في 1,763 مقطعًا بحسب عدّاد vidIQ كما في 12 نوفمبر 2026، وأكّدت SPEAKRJ عدد المشتركين نفسه في مدخل مؤرخ في اليوم نفسه. لا يسمّي أي مصدر قُرئ مشغّلًا محددًا لها، ولا يُكتب لها تاريخ تأسيس."
  en: "The Hayalhanem YouTube channel (@hayalhanem), a Turkish Islamic media collective producing animated stories, lessons and short films; it counted 5,560,000 subscribers, 1,527,899,907 views and 1,763 videos by vidIQ's count as of 12 November 2026, and SPEAKRJ independently recorded the same subscriber figure in a dated entry of the same day. No source read names a specific operator for it, and no founding date is written for it."
  ur: "حیالهانم کی یوٹیوب چینل ⁦(@hayalhanem)⁩، ایک ترک اسلامی میڈیا جماعت جو متحرک کہانیاں، اسباق اور مختصر فلمیں بناتی ہے؛ 12 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 5,560,000، ویوز 1,527,899,907 اور ویڈیوز 1,763 تھیں، اور SPEAKRJ نے اسی دن کے مؤرخہ اندراج میں سبسکرائبرز کی یہی تعداد درج کی۔ کسی پڑھے گئے ماخذ نے اس کا کوئی مخصوص منتظم نہیں بتایا، اور اس کی کوئی تاریخِ قیام نہیں لکھی جاتی۔"
