summary:
  ar: "قبيلة يمانية من مذحج؛ أصابتها همدان يوم الردم قبيل الإسلام، وقدم منها فروة بن مسيك على النبي مفارقاً لملوك كندة فأسلم واستعمله النبي على مراد وزبيد ومذحج كلها؛ ومنها قيس بن مكشوح الذي أبى على عمرو بن معدي كرب أن يأتي النبي."
  en: "A Yemeni tribe of Madhhij; Hamdan defeated it on the Day of al-Radm shortly before Islam, and Farwa ibn Musayk of Murad came to the Prophet breaking with the kings of Kinda, embraced Islam and was set over Murad, Zubayd and all Madhhij; Qays ibn Makshuh, who refused to accompany Amr ibn Ma'dikarib to the Prophet, was of Murad."
