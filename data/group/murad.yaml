label: { ar: "مراد", en: "Murad", es: "Murad", fr: "Murad" }
summary:
  ar: "قبيلة يمانية من مذحج؛ أصابتها همدان يوم الردم قبيل الإسلام، وقدم منها فروة بن مسيك على النبي مفارقاً لملوك كندة فأسلم واستعمله النبي على مراد وزبيد ومذحج كلها؛ ومنها قيس بن مكشوح الذي أبى على عمرو بن معدي كرب أن يأتي النبي."
  en: "A Yemeni tribe of Madhhij; Hamdan defeated it on the Day of al-Radm shortly before Islam, and Farwa ibn Musayk of Murad came to the Prophet breaking with the kings of Kinda, embraced Islam and was set over Murad, Zubayd and all Madhhij; Qays ibn Makshuh, who refused to accompany Amr ibn Ma'dikarib to the Prophet, was of Murad."
  es: "Una tribu yemení de Madhhij; Hamdan la derrotó el Día de al-Radm poco antes del Islam, y Farwa ibn Musayk de Murad vino al Profeta rompiendo con los reyes de Kinda, abrazó el Islam y fue puesto al frente de Murad, Zubayd y todos los Madhhij; Qays ibn Makshuh, que se negó a acompañar a Amr ibn Ma'dikarib al Profeta, era de Murad."
  fr: "Une tribu yéménite de Madhhij; Hamdan la vainquit le jour d'al-Radm peu avant l'islam, et Farwa ibn Musayk de Murad vint au Prophète en rompant avec les rois de Kinda, embrassa l'islam et fut placé à la tête de Murad, Zubayd et de tout Madhhij; Qays ibn Makshuh, qui refusa d'accompagner Amr ibn Ma'dikarib auprès du Prophète, était de Murad."
