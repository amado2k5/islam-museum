label: { ar: "بنو الضليع من جذام", en: "Banu Dula' of Judham", es: "Banu Dula' de Judá", fr: "Banu Dula' de Judham", ur: "جُدھم کی بنو دُلہ" }
summary:
  ar: "بطن من جذام منهم الهنيد بن عوص وابنه عوص اللذان أغارا على دحية الكلبي بوادي شنار فأخذا ما معه، وقرة بن أشقر الضفاري الضليعي الذي رمى النعمان بن أبي جعال."
  en: "A clan of Judham to which belonged al-Hunayd ibn Us and his son Us, who robbed Dihya al-Kalbi in the valley of Shinar, and Qurra ibn Ashqar al-Difari al-Dula'i who shot al-Nu'man ibn Abi Ji'al."
  es: "Un clan de Judham al que pertenecían al-Hunayd ibn Us y su hijo Us, quienes robaron a Dihya al-Kalbi en el valle de Shinar, y Qurra ibn Ashqar al-Difari al-Dula'i, quien disparó a al-Nu'man ibn Abi Ji'al."
  fr: "Un clan de Judham auquel appartenaient al-Hunayd ibn Us et son fils Us, qui ont volé Dihya al-Kalbi dans la vallée de Shinar, et Qurra ibn Ashqar al-Difari al-Dula'i qui a abattu al-Nu'man ibn Abi Ji'al."
  ur: "یہودھم کا ایک قبیلہ جس سے الحنید ابن ہم اور اس کے بیٹے ہم تھے جنہوں نے وادی شنار میں دحیہ الکلبی کو لوٹا اور قرہ بن اشقر الدفاری الدولعی جس نے نعمان ابن ابی جیال کو گولی ماری۔"
