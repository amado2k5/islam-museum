summary:
  ar: "حركة دينية اجتماعية في الأناضول السلجوقي قادها البابا إسحاق قبيل 638هـ ⁦(1240م)⁩، وكانت لها أهمية في التطور الاجتماعي للأتراك {cite:encyclopaedia-of-islam-2 vol. 1 p. 900-901}."
  en: "A religio-social movement in Saljuq Anatolia led by the baba Ishak shortly before 638 AH (1240), important in the social development of the Turks {cite:encyclopaedia-of-islam-2 vol. 1 p. 900-901}."
  es: "Un movimiento religioso-social en la Anatolia selyúcida liderado por el baba Ishak poco antes del 638 AH (1240), importante en el desarrollo social de los turcos {cite:encyclopaedia-of-islam-2 vol. 1 p. 900-901}."
  fr: "Un mouvement religieux et social en Anatolie saldjoukide dirigé par le baba Ishak peu avant 638 AH (1240), important dans le développement social des Turcs {cite:encyclopaedia-of-islam-2 vol. 1 p. 900-901}."
  ur: "سلجوق اناطولیہ میں ایک مذہبی سماجی تحریک جس کی قیادت بابا اسحاق نے 638 ہجری (1240) سے کچھ عرصہ پہلے کی تھی، جو ترکوں کی سماجی ترقی میں اہم تھی۔ 1 ص۔ 900-901}۔"
  tr: "Hicri 638 (Miladi 1240) yılından önce Papa İshak önderliğinde Selçuklu Anadolu'sunda ortaya çıkan ve Türklerin sosyal gelişiminde önemli rol oynayan dini ve sosyal bir hareket. {cite:encyclopaedia-of-islam-2 vol. 1 p. 900-901}"
  id: "Sebuah gerakan keagamaan dan sosial di Anatolia Seljuk yang dipimpin oleh Paus Ishak sebelum tahun 638 H (1240 M), yang penting dalam perkembangan sosial bangsa Turki {cite:encyclopaedia-of-islam-2 vol. 1 p. 900-901}."
