summary:
  ar: "قبيلة يمنية نزلت أسفل الوادي حين نزلت غسان أعلاه على الماء المعروف بغسان بين واديي زبيد ورمع، وكان بينهم من الحرب خبر الظليم والشجرة ورقة اللبن وحلاوته وثخنه وما كان من القيافة بينهم في طلوع الشمس وغروبها على إبلهم، وقد وقعت بينهم وبين غسان حروب ذكرت في أيام العرب {cite:muruj-al-dhahab p. 441, 498, 500}."
  en: "The Yemeni tribe holding the lower wadi against Ghassan above it — their war over the ostrich and the milk's richness one of the Days of the Arabs, fought with trackers reading shade on the camels {cite:muruj-al-dhahab p. 441, 498, 500}."
  es: "La tribu yemení que controlaba el wadi inferior contra Ghassan, que se encontraba más arriba, su guerra por el avestruz y la riqueza de la leche, una de las épocas de los árabes, se libró con rastreadores que leían la sombra de los camellos {cite:muruj-al-dhahab p. 441, 498, 500}."
  fr: "La tribu yéménite qui tenait le wadi inférieur contre Ghassan en amont — leur guerre pour l'autruche et la richesse du lait, l'un des Jours des Arabes, menée avec des pisteurs lisant l'ombre sur les chameaux {cite:muruj-al-dhahab p. 441, 498, 500}."
  ur: "یمنی قبیلہ جو اس کے اوپر غسان کے خلاف نچلی وادی کو تھامے ہوئے ہے - شتر مرغ اور دودھ کی دولت کے خلاف ان کی جنگ عربوں کے دنوں میں سے ایک ہے، اونٹوں پر سایہ پڑھنے والے ٹریکروں کے ساتھ لڑی {حوالہ: مروج الذہب ص۔ 441، 498، 500}۔"
  tr: "Yemenli bir kabile, vadinin dibine yerleşti; Ghassan kabilesi ise Zabid ve Rama vadileri arasında, Ghassan olarak bilinen suyun bulunduğu tepeye yerleşti. Aralarında devekuşu ve ağaç, sütün inceliği ve tatlılığı ile kıvamı ve develerinin üzerinde güneşin doğuşu ve batışı konusunda bir savaş çıktı. Arapların zamanında bahsedilen bu savaşlar, Ghassan kabilesi ile aralarında gerçekleşti. {Kaynak: Muruj-al-Dhahab s. 441, 498, 500}"
  id: "Suku Yaman menetap di dasar lembah ketika Ghassan menetap di puncaknya di atas air yang dikenal sebagai Ghassan di antara lembah Zabid dan Rama. Terjadi perang di antara mereka mengenai burung unta dan pohon, kekentalan dan kemanisan susu, dan perselisihan di antara mereka mengenai terbit dan terbenamnya matahari pada unta mereka. Perang terjadi antara mereka dan Ghassan yang disebutkan pada zaman Arab {cite:muruj-al-dhahab hlm. 441, 498, 500}."
