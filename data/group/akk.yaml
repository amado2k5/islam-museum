summary:
  ar: "قبيلة يمنية نزلت أسفل الوادي حين نزلت غسان أعلاه على الماء المعروف بغسان بين واديي زبيد ورمع، وكان بينهم من الحرب خبر الظليم والشجرة ورقة اللبن وحلاوته وثخنه وما كان من القيافة بينهم في طلوع الشمس وغروبها على إبلهم، وقد وقعت بينهم وبين غسان حروب ذكرت في أيام العرب {cite:muruj-al-dhahab p. 441, 498, 500}."
  en: "The Yemeni tribe holding the lower wadi against Ghassan above it — their war over the ostrich and the milk's richness one of the Days of the Arabs, fought with trackers reading shade on the camels {cite:muruj-al-dhahab p. 441, 498, 500}."
