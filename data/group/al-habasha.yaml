summary:
  ar: "الحبشة أهل الحبشة من أرض القرن الأفريقي ومملكة أكسوم؛ عندهم كان النجاشي الذي هاجر إليه المسلمون هجرتين، ومنهم أبرهة صاحب الفيل، ومنهم بلال بن رباح الحبشي وممن أسلم منهم جعفر? لا — جعفر الطيار قريشي، وفي الحبشة حديث «دعوا الحبشة ما ودوكم» {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira} {cite:isaba}."
  en: "Al-Habasha are the Abyssinians of the Horn of Africa, the kingdom of Axum; theirs was the Negus to whom the Muslims emigrated twice, theirs was Abraha of the Elephant, and from them Bilal ibn Rabah — the hadith says «leave the Abyssinians as long as they leave you» {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira} {cite:isaba}."
