summary:
  ar: "الحبشة أهل الحبشة من أرض القرن الأفريقي ومملكة أكسوم؛ عندهم كان النجاشي الذي هاجر إليه المسلمون هجرتين، ومنهم أبرهة صاحب الفيل، ومنهم بلال بن رباح الحبشي وممن أسلم منهم جعفر? لا — جعفر الطيار قريشي، وفي الحبشة حديث «دعوا الحبشة ما ودوكم» {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira} {cite:isaba}."
  en: "Al-Habasha are the Abyssinians of the Horn of Africa, the kingdom of Axum; theirs was the Negus to whom the Muslims emigrated twice, theirs was Abraha of the Elephant, and from them Bilal ibn Rabah — the hadith says «leave the Abyssinians as long as they leave you» {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira} {cite:isaba}."
  es: "Al-Habasha son los abisinios del Cuerno de África, del reino de Axum; de ellos fue el Negus al que los musulmanes emigraron dos veces, de ellos fue Abraha del Elefante, y de ellos Bilal ibn Rabah — el hadiz dice «dejad a los abisinios mientras ellos os dejen a vosotros» {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira} {cite:isaba}."
  fr: "Les Habash sont les Abyssins de la Corne de l'Afrique, du royaume d'Axoum; c'est d'eux qu'est né le Négus, vers lequel les musulmans ont émigré deux fois, c'est d'eux qu'est né Abraha de l'Éléphant, et c'est d'eux que vient Bilal ibn Rabah — le hadith dit « quittez les Abyssins tant qu'ils vous quittent » {cite:mubarakpuri-raheeq} {cite:ibn-hisham-sira} {cite:isaba}."
  ur: "الحبشہ ہارن آف افریقہ کے حبشی ہیں، اکسم کی بادشاہی؛ ان کا وہ نجاشی تھا جس کی طرف مسلمانوں نے دو مرتبہ ہجرت کی، ان کا ابرہہ ہاتھی تھا، اور ان میں سے بلال بن رباح - حدیث میں ہے کہ حبشیوں کو اس وقت تک چھوڑ دو جب تک وہ تمہیں چھوڑ دیں۔"
  tr: "Habeşistan halkı Afrika Boynuzu'ndan ve Aksum Krallığı'ndandır. Aralarında Müslümanların iki kez hicret ettiği Negus da vardı. Aralarında fil sahibi Abraha ve Bilal ibn Rabah el-Habashi de vardı. Onlardan İslam'a geçenler arasında Cafer mi vardı? Hayır, Kureyşli Cafer el-Tayyar. Habeşistan'da ise şöyle bir hadis vardır: \"Sizi sevdikleri sürece Habeşlileri rahat bırakın.\""
  id: "Penduduk Abyssinia berasal dari Tanduk Afrika dan Kerajaan Aksum. Di antara mereka ada Negus, kepada siapa kaum Muslim berhijrah dua kali. Di antara mereka ada Abraha, pemilik gajah, dan di antara mereka ada Bilal ibn Rabah al-Habashi. Dan di antara mereka yang masuk Islam adalah Ja'far? Bukan — Ja'far al-Tayyar, seorang Quraisy. Dan di Abyssinia ada sebuah hadits: “Biarkanlah orang-orang Abyssinia selama mereka mencintaimu.”"
