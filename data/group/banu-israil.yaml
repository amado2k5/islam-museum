label: { ar: "بنو إسرائيل", en: "Banu Isra'il (the Children of Israel)", es: "Banu Isra'il (los Hijos de Israel)", fr: "Banu Isra'il (les Enfants d'Israël)", ur: "بنی اسرائیل ⁦(بنی اسرائیل)⁩", tr: "İsrail Çocukları", id: "Anak-anak Israel" }
summary:
  ar: "بنو إسرائيل ذرية يعقوب بن إسحاق بن إبراهيم؛ أكثر الأمم ذكراً في القرآن: فيهم الأنبياء وموائد الآيات وفضّلوا على العالمين في زمنهم «يا بني إسرائيل اذكروا نعمتي التي أنعمت عليكم وأني فضلتكم على العالمين»، وفيهم طوائف عصت وطوائف آمنت {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
  en: "Banu Isra'il are the descendants of Ya'qub ibn Ishaq ibn Ibrahim — the nation most named in the Qur'an. Among them were prophets and tables of signs, and they were favoured in their time: «O Children of Israel, remember My favour wherewith I favoured you and preferred you over the worlds» (2:47); among them were bands that disobeyed and bands that believed {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
  es: "Banu Isra'il son los descendientes de Ya'qub ibn Ishaq ibn Ibrahim, la nación más mencionada en el Corán. Entre ellos hubo profetas y tablas de signos, y fueron favorecidos en su tiempo: «¡Oh, hijos de Israel! Recordad Mi favor con el que os favorecí y os preferí sobre los mundos» (2:47); entre ellos hubo bandas que desobedecieron y bandas que creyeron {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
  fr: "Les Banu Isra'il sont les descendants de Ya'qub ibn Ishaq ibn Ibrahim — la nation la plus citée dans le Coran. Parmi eux se trouvaient des prophètes et des tables de signes, et ils furent favorisés en leur temps: « Ô Enfants d'Israël, rappelez-vous Ma faveur par laquelle Je vous ai favorisés et vous ai préférés aux mondes » (2:47); parmi eux se trouvaient des groupes désobéissants et des groupes croyants."
  ur: "بنو اسرائیل یعقوب بن اسحاق بن ابراہیم کی اولاد ہیں - جس قوم کا قرآن میں سب سے زیادہ نام لیا گیا ہے۔ ان میں سے انبیاء اور نشانیوں کے میزیں تھے، اور ان پر ان کے زمانے میں احسان کیا گیا: \"اے بنی اسرائیل، میری اس نعمت کو یاد کرو جس سے میں نے تم پر احسان کیا اور تمہیں تمام جہانوں پر فضیلت دی\" (2:47); ان میں نافرمانی کرنے والے گروہ اور ایمان لانے والے گروہ تھے {حوالہ: تاریخ القرآن}۔"
  tr: "İsrailoğulları, İbrahim'in oğlu İshak'ın oğlu Yakup'un soyundandır; Kur'an'da en çok zikredilen ümmettir. Aralarında peygamberler ve ayetler de vardır ve zamanlarında âlemlerden üstün kılınmışlardır. \"Ey İsrailoğulları, size verdiğim nimeti ve sizi âlemlerden üstün kıldığımı hatırlayın.\" Aralarında isyan edenler ve iman edenler de vardır. {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}"
  id: "Bani Israel adalah keturunan Yakub, putra Ishak, putra Ibrahim; bangsa yang paling banyak disebut dalam Al-Qur'an: di antara mereka terdapat para nabi dan loh-loh tanda, dan mereka diistimewakan atas seluruh alam pada masa mereka, “Wahai Bani Israel, ingatlah nikmat-Ku yang telah Kuberikan kepadamu dan bahwa Aku telah mengutamakan kamu atas seluruh alam,” dan di antara mereka terdapat golongan-golongan yang durhaka dan golongan-golongan yang beriman. {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
