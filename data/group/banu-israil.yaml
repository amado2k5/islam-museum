label: { ar: "بنو إسرائيل", en: "Banu Isra'il (the Children of Israel)" }
summary:
  ar: "بنو إسرائيل ذرية يعقوب بن إسحاق بن إبراهيم؛ أكثر الأمم ذكراً في القرآن: فيهم الأنبياء وموائد الآيات وفضّلوا على العالمين في زمنهم «يا بني إسرائيل اذكروا نعمتي التي أنعمت عليكم وأني فضلتكم على العالمين»، وفيهم طوائف عصت وطوائف آمنت {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
  en: "Banu Isra'il are the descendants of Ya'qub ibn Ishaq ibn Ibrahim — the nation most named in the Qur'an. Among them were prophets and tables of signs, and they were favoured in their time: «O Children of Israel, remember My favour wherewith I favoured you and preferred you over the worlds» (2:47); among them were bands that disobeyed and bands that believed {cite:tafsir-tabari-shakir-v01} {cite:tarikh-ard-al-quran}."
