summary:
  ar: "سمرقند تي في، وهي قناة تلفزيونية دينية تركية تابعة لمجموعة سمرقند للنشر، بدأت البث في 29 مايو 2010. أما عدد المشتركين المؤرخ فيخص قناة المذيع على يوتيوب بمعرفها السابق ⁦(@semerkandtv)⁩: فقد بلغ عدد مشتركي تلك القناة 421,000 مشترك وعدد مشاهداتها 39,270,647 مشاهدة بحسب عدّاد vidIQ كما في 16 نوفمبر 2026، وتقديم القناة الحالي هو KEFTV وبالمعرف ⁦(@tvkefmedya)⁩، وهي ما تزال تحمل برامج سمرقند تي في."
  en: "Semerkand TV, a Turkish religious television broadcaster of the Semerkand Yayın Grubu (Semerkand Media Group), launched on 29 May 2010. The dated subscriber count belongs to the broadcaster's YouTube channel under its former handle @semerkandtv: that channel counted 421,000 subscribers and 39,270,647 views by vidIQ's count as of 16 November 2026, and the channel's current presentation is KEFTV with the handle @tvkefmedya, while still carrying Semerkand TV programmes."
  ur: "سمرقند ٹی وی، ترکیہ کا ایک دینی ٹیلی ویژن نشریاتی ادارہ جو سمرقند یایین گروبو سے وابستہ ہے، 29 مئی 2010ء کو شروع ہوا۔ مؤرخہ سبسکرائبر شمار اس نشریاتی ادارے کے یوٹیوب چینل کا ہے جو اس کے سابق ہینڈل ⁦(@semerkandtv)⁩ کے تحت تھا: 16 نومبر 2026ء کے vidIQ شمار کے مطابق اس چینل کے سبسکرائبرز 421,000 اور ویوز 39,270,647 تھے، اور چینل کی موجودہ پیشکش KEFTV ہے جس کا ہینڈل ⁦(@tvkefmedya)⁩ ہے، جبکہ وہ اب بھی سمرقند ٹی وی کے پروگرام پیش کرتا ہے۔"
