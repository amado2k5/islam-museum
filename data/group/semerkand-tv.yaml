summary:
  ar: "سمرقند تي في، وهي قناة تلفزيونية دينية تركية تابعة لمجموعة سمرقند للنشر، بدأت البث في 29 مايو 2010. أما عدد المشتركين المؤرخ فيخص قناة المذيع على يوتيوب بمعرفها السابق ⁦(@semerkandtv)⁩: فقد بلغ عدد مشتركي تلك القناة 421,000 مشترك وعدد مشاهداتها 39,270,647 مشاهدة بحسب عدّاد vidIQ كما في 16 نوفمبر 2026، وتقديم القناة الحالي هو KEFTV وبالمعرف ⁦(@tvkefmedya)⁩، وهي ما تزال تحمل برامج سمرقند تي في."
  en: "Semerkand TV, a Turkish religious television broadcaster of the Semerkand Yayın Grubu (Semerkand Media Group), launched on 29 May 2010. The dated subscriber count belongs to the broadcaster's YouTube channel under its former handle @semerkandtv: that channel counted 421,000 subscribers and 39,270,647 views by vidIQ's count as of 16 November 2026, and the channel's current presentation is KEFTV with the handle @tvkefmedya, while still carrying Semerkand TV programmes."
  ur: "سمرقند ٹی وی، ترکیہ کا ایک دینی ٹیلی ویژن نشریاتی ادارہ جو سمرقند یایین گروبو سے وابستہ ہے، 29 مئی 2010ء کو شروع ہوا۔ مؤرخہ سبسکرائبر شمار اس نشریاتی ادارے کے یوٹیوب چینل کا ہے جو اس کے سابق ہینڈل ⁦(@semerkandtv)⁩ کے تحت تھا: 16 نومبر 2026ء کے vidIQ شمار کے مطابق اس چینل کے سبسکرائبرز 421,000 اور ویوز 39,270,647 تھے، اور چینل کی موجودہ پیشکش KEFTV ہے جس کا ہینڈل ⁦(@tvkefmedya)⁩ ہے، جبکہ وہ اب بھی سمرقند ٹی وی کے پروگرام پیش کرتا ہے۔"
  es: "Semerkand TV, una emisora de televisión religiosa turca perteneciente al grupo Semerkand Yayın Grubu (Grupo de Medios Semerkand), se lanzó el 29 de mayo de 2010. El recuento de suscriptores corresponde al canal de YouTube de la emisora, bajo su antiguo nombre de usuario @semerkandtv: dicho canal contaba con 421.000 suscriptores y 39.270.647 visualizaciones según el recuento de vidIQ al 16 de noviembre de 2026, y la presentación actual del canal es KEFTV con el nombre de usuario @tvkefmedya, aunque sigue emitiendo programas de Semerkand TV."
  fr: "Semerkand TV, chaîne de télévision religieuse turque du groupe Semerkand Yayın Grubu (Semerkand Media Group), a été lancée le 29 mai 2010. Le nombre d'abonnés indiqué à cette date correspond à la chaîne YouTube de la chaîne, anciennement connue sous le nom d'utilisateur @semerkandtv: cette chaîne comptait 421 000 abonnés et 39 270 647 vues selon le décompte de vidIQ au 16 novembre 2026. La chaîne est actuellement diffusée sous le nom de KEFTV (@tvkefmedya) et continue de proposer les programmes de Semerkand TV."
  tr: "Semerkand Yayın Grubu'na ait Türk dini televizyon kanalı Semerkand TV, 29 Mayıs 2010'da yayın hayatına başladı. Tarihli abone sayısı, sunucunun önceki kimliğiyle (@semerkandtv) YouTube kanalına aittir: 16 Kasım 2026 itibarıyla vidIQ sayacına göre bu kanalın abone sayısı 421.000 ve izlenme sayısı 39.270.647'dir. Kanalın mevcut sunucusu (@tvkefmedya) kimliğiyle KEFTV'dir ve hala Semerkand TV programlarını yayınlamaktadır."
  id: "Semerkand TV, sebuah saluran televisi keagamaan Turki yang tergabung dalam Grup Penerbitan Semerkand, mulai mengudara pada 29 Mei 2010. Jumlah pelanggan yang tercantum merujuk pada saluran YouTube presenter dengan ID sebelumnya (@semerkandtv): jumlah pelanggan untuk saluran tersebut adalah 421.000 dan jumlah penayangannya adalah 39.270.647 menurut penghitung vidIQ pada 16 November 2026. Presenter saluran saat ini adalah KEFTV dengan ID (@tvkefmedya), dan saluran tersebut masih menayangkan program-program Semerkand TV."
