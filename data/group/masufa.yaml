summary:
  ar: "مسوفة من بطون صنهاجة الملثمين؛ مواطنهم الرمال القاصية شرقي بلاد السودان إلى تادمكة وما يليها، وكانوا أهل الدعة والملوك بالصحراء على عهد المرابطين وبعدهم، ومنهم سرايا الخيل المسوفية في ممالك المغرب المتأخرة."
  en: "Masufa of the Sanhaja veil-wearers; their homeland the far sands east of the Sudan lands toward Tadmakka — quiet folk and desert kings in the Almoravid era and after, whose Masufa horse served in the later Maghreb kingdoms."
  es: "Masufa, de las sanhaja que usan velo; su tierra natal son las lejanas arenas al este de las tierras de Sudán, hacia Tadmakka: gente tranquila y reyes del desierto en la era almorávide y posterior, cuyo caballo Masufa sirvió en los reinos posteriores del Magreb."
  fr: "Masufa des Sanhaja, ces femmes voilées; leur patrie, les sables lointains à l'est des terres du Soudan, vers Tadmakka — un peuple paisible et des rois du désert à l'époque almoravide et après, dont le cheval Masufa a servi dans les royaumes maghrébins ultérieurs."
  ur: "سانہاجا پردہ کرنے والوں کا مصوفہ؛ ان کا آبائی وطن سوڈان کے مشرق میں دور ریت تدمکا کی طرف اترتا ہے - الموراوڈ دور اور اس کے بعد کے خاموش لوک اور صحرائی بادشاہ، جن کے مسوفا گھوڑے نے بعد کی مغرب کی سلطنتوں میں خدمات انجام دیں۔"
