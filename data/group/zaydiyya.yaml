label: { ar: "الزيدية", en: "Zaydiyya" }
summary:
  ar: "الزيدية الذين قالوا بإمامة زيد بن علي ثم قالوا بعده بالإمامة في ولد فاطمة كائنا من كان بعد أن يكون عنده شروط الإمامة، وأكثر المحدثين على هذا المذهب مثل سفيان بن عيينة وسفيان الثوري وصالح بن حي وولده، قال ابن النديم أكثر علماء المحدثين زيدية وكذلك قوم من الفقهاء المحدثين وجلة المحدثين {cite:fihrist-ibn-al-nadim p. 253}."
  en: "The Zaydiyya — imamate in any qualified Fatimid; most muhaddithun leaned to it, says the Fihrist {cite:fihrist-ibn-al-nadim}"
