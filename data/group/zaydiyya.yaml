id: group/zaydiyya
class: group
kind: sect
label: { ar: "الزيدية", en: "Zaydiyya", es: "Zaydiyya", fr: "Zaydiyya", ur: "زیدیہ", tr: "Zaydi", id: "Zaydi" }
summary:
  ar: "الزيدية الذين قالوا بإمامة زيد بن علي ثم قالوا بعده بالإمامة في ولد فاطمة كائنا من كان بعد أن يكون عنده شروط الإمامة، وأكثر المحدثين على هذا المذهب مثل سفيان بن عيينة وسفيان الثوري وصالح بن حي وولده، قال ابن النديم أكثر علماء المحدثين زيدية وكذلك قوم من الفقهاء المحدثين وجلة المحدثين {cite:fihrist-ibn-al-nadim p. 253}."
  en: "The Zaydiyya — imamate in any qualified Fatimid; most muhaddithun leaned to it, says the Fihrist {cite:fihrist-ibn-al-nadim}"
  es: "La zaidía — imamato en cualquier fatimí cualificado; la mayoría de los muhaddithun se inclinaban hacia ella, dice el Fihrist {cite:fihrist-ibn-al-nadim}"
  fr: "L'imamat zaydiyya — chez tout fatimide qualifié; la plupart des muhaddithun s'y sont ralliés, selon le Fihrist {cite:fihrist-ibn-al-nadim}"
  ur: "زیدیہ - کسی بھی اہل فاطمی میں امامت؛ فہرست کہتے ہیں کہ اکثر محدثین اسی کی طرف جھکتے ہیں"
  tr: "Zeydiler, Zeyd ibn Ali'nin imametine inanmış, ondan sonra da Fatıma'nın soyundan gelenlerin, kim olursa olsun, imamet şartlarını yerine getirdikten sonra imametine inanmışlardır. Sufyan ibn Uyaynah, Sufyan el-Sevri, Salih ibn Hayy ve oğlu gibi hadis âlimlerinin çoğu bu görüşe mensuptur. İbn el-Nadim şöyle demiştir: Hadis âlimlerinin çoğu Zeydi'dir, hadis fıkıhçılarının ve en önde gelen hadis âlimlerinin bazıları da Zeydi'dir. {cite:fihrist-ibn-al-nadim s. 253}"
  id: "Kaum Zaidiyah, yang meyakini Imamah Zaid bin Ali, kemudian setelahnya mereka meyakini Imamah pada keturunan Fatimah, siapa pun dia, setelah dia memenuhi syarat-syarat Imamah. Sebagian besar ulama hadits menganut mazhab ini, seperti Sufyan bin Uyaynah, Sufyan al-Thawri, Salih bin Hayy dan putranya. Ibn al-Nadim berkata: Sebagian besar ulama hadits adalah Zaidiyah, begitu pula sebagian ahli fiqih hadits dan ulama hadits terkemuka. {kutipan:fihrist-ibn-al-nadim hlm. 253}."
