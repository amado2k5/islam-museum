summary:
  ar: "بنو غفار بن مليل بن ضمرة بن بكر بن عبد مناة بن كنانة؛ حي كناني على ساحل البحر الأحمر بين مكة والمدينة، منهم أبو ذر الغفاري رابع أو خامس الداخلين في الإسلام، وفي غفار حديث «غفر الله لغفار وأسلم الله أسلم» {cite:mubarakpuri-raheeq p.16} {cite:isaba} {cite:sahih-muslim}."
  en: "Banu Ghifar ibn Mulayl ibn Damra ibn Bakr ibn Abd Manat ibn Kinana — a Kinani tribe on the Red Sea coast between Mecca and Medina; among them Abu Dharr al-Ghifari, the fourth or fifth to enter Islam, and theirs is the Prophet's saying «may God forgive Ghifar and keep Aslam» {cite:mubarakpuri-raheeq p.16} {cite:isaba} {cite:sahih-muslim}."
