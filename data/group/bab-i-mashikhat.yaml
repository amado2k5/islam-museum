label:
  ar: "باب المشيخة"
  en: "Bab-i Mashikhat (office of the Shaykh al-Islam)"
  ur: "باب مشیخہ"
  es: "Bab-i Mashikhat (oficina del Shaykh al-Islam)"
  fr: "Bab-i Mashikhat (bureau du Cheikh al-Islam)"
  tr: "Şeyhliğin Kapısı"
  id: "Gerbang Kekuasaan Syekh"
summary:
  ar: "اسم شاع في الدولة العثمانية في القرن التاسع عشر لديوان شيخ الإسلام مفتي إسطنبول؛ صار له مقر ثابت سنة 1241هـ/1826م بعد القضاء على الإنكشارية، فبدأت بذلك بيروقراطية العلماء وإضعافهم أمام السلطة {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  en: "The name common in the Ottoman Empire in the nineteenth century for the office of the Shaykh al-Islam, the Chief Mufti of Istanbul; given a permanent establishment in 1241/1826 after the destruction of the Janissaries, beginning the bureaucratisation and weakening of the ulama {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  es: "Nombre común en el Imperio Otomano en el siglo XIX para el cargo de Shaykh al-Islam, el Gran Muftí de Estambul; se le otorgó un establecimiento permanente en 1241/1826 después de la destrucción de los jenízaros, lo que dio inicio a la burocratización y debilitamiento de los ulemas {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  fr: "Nom courant dans l'Empire ottoman au XIXe siècle pour la fonction de Shaykh al-Islam, le grand mufti d'Istanbul; institutionnalisation permanente en 1241/1826 après la destruction des janissaires, marquant le début de la bureaucratisation et de l'affaiblissement des oulémas {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  ur: "انیسویں صدی میں عثمانی سلطنت میں استنبول کے مفتی اعظم شیخ الاسلام کے دفتر کے لیے عام نام۔ جنیسریوں کی تباہی کے بعد 1241/1826 میں مستقل قیام دیا گیا، نوکر شاہی کا آغاز اور علماء کو کمزور کرنا۔ 1 ص۔ 894}۔"
  tr: "Bu isim, 19. yüzyılda Osmanlı devletinde İstanbul Müftüsü Şeyhülislam makamı için yaygınlaştı; Yeniçerilerin ortadan kaldırılmasının ardından 1241 Hicri/1826 Miladi yılında kalıcı bir merkeze sahip oldu ve bununla birlikte âlimlerin bürokrasisi ve otorite karşısında zayıflamaları başladı {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  id: "Nama tersebut menjadi umum di negara Ottoman pada abad kesembilan belas untuk jabatan Syekh al-Islam, Mufti Istanbul; jabatan tersebut memiliki kantor pusat tetap pada tahun 1241 H/1826 M setelah penghapusan Janissari, dan dengan itu dimulailah birokrasi para ulama dan pelemahan mereka di hadapan otoritas {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
