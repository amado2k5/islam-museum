summary:
  ar: "اسم شاع في الدولة العثمانية في القرن التاسع عشر لديوان شيخ الإسلام مفتي إسطنبول؛ صار له مقر ثابت سنة 1241هـ/1826م بعد القضاء على الإنكشارية، فبدأت بذلك بيروقراطية العلماء وإضعافهم أمام السلطة {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  en: "The name common in the Ottoman Empire in the nineteenth century for the office of the Shaykh al-Islam, the Chief Mufti of Istanbul; given a permanent establishment in 1241/1826 after the destruction of the Janissaries, beginning the bureaucratisation and weakening of the ulama {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
