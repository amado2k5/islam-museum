summary:
  ar: "بنو تغلب بن وائل بن قاسط بن هنب بن أفصى بن دعمي بن جديلة بن أسد بن ربيعة؛ بطن ربيعي بالجزيرة الفراتية بقي كثير منهم على النصرانية في دولة الإسلام بشرط أن لا يعمدوا أولادهم، ومنهم عمرو بن كلثوم صاحب المعلقة والجساس بن مرة قاتل كليب صاحب حرب البسوس {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  en: "Banu Taghlib ibn Wa'il of the Rabi'a line — a Jaziran tribe many of whom remained Christian in the Islamic state on condition they would not baptise their children; from them Amr ibn Kulthum of the Mu'allaqa and al-Jasas ibn Murra, slayer of Kulayb in the Basus war {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
