summary:
  ar: جماعة ذكر الكتاب رجالاً منها سمعهم الراوي يتحدثون في المسجد بخيوان سنة 286هـ، وفيها رجل لا بأس به في دينه ومذهبه هو إبراهيم بن سليمان.
  en: A people of whom the book names men whom the narrator overheard in the mosque at Khiwan in 286 AH, among them Ibrahim ibn Sulayman, described as of no fault in his religion and school.
  ur: ایک جماعت جس کے لوگوں کو راوی نے 286ھ میں خیوان کی مسجد میں باتیں کرتے سنا، ان میں ابراہیم بن سلیمان ہے جسے اس کے دین اور مسلک میں بے عیب بتایا گیا۔
  es: "Un pueblo del que el libro menciona a hombres a quienes el narrador escuchó en la mezquita de Khiwan en el año 286 de la Hégira, entre ellos Ibrahim ibn Sulayman, descrito como intachable en su religión y escuela."
  fr: "Un peuple dont le livre cite des hommes que le narrateur a entendus dans la mosquée de Khiwan en 286 AH, parmi lesquels Ibrahim ibn Sulayman, décrit comme irréprochable dans sa religion et son école."
