summary:
  ar: بطن من العرب قال أهله لمحمد بن عبيد الله إنهم من قيس، نزل عليهم الهادي في طريقه إلى اليمن فخرج منهم نفر معه.
  en: A clan of the Arabs whose people told Muhammad ibn Ubaydallah they were of Qays, among whom al-Hadi stopped on the road to Yemen, and some of whom went out with him.
  ur: عربوں کا ایک بطن جس کے لوگوں نے محمد بن عبید اللہ کو بتایا کہ وہ قیس میں سے ہیں، جن کے ہاں ہادی یمن کے راستے میں ٹھہرے اور ان میں سے کچھ لوگ ان کے ساتھ نکلے۔
