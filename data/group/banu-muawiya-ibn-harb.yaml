label:
  ar: بنو معاوية بن حرب
  en: Banu Muawiya ibn Harb
  ur: بنو معاویہ بن حرب
  es: "Banu Muawiya ibn Harb"
  fr: "Banu Muawiya ibn Harb"
  tr: "Banu Muaviye ibn Harb"
  id: "Banu Muawiyah ibn Harb"
summary:
  ar: بطن من العرب قال أهله لمحمد بن عبيد الله إنهم من قيس، نزل عليهم الهادي في طريقه إلى اليمن فخرج منهم نفر معه.
  en: A clan of the Arabs whose people told Muhammad ibn Ubaydallah they were of Qays, among whom al-Hadi stopped on the road to Yemen, and some of whom went out with him.
  ur: عربوں کا ایک بطن جس کے لوگوں نے محمد بن عبید اللہ کو بتایا کہ وہ قیس میں سے ہیں، جن کے ہاں ہادی یمن کے راستے میں ٹھہرے اور ان میں سے کچھ لوگ ان کے ساتھ نکلے۔
  es: "Un clan de árabes cuyos miembros le dijeron a Muhammad ibn Ubaydallah que eran de Qays, entre quienes al-Hadi se detuvo en el camino a Yemen, y algunos de los cuales salieron con él."
  fr: "Un clan d'Arabes dont les membres ont dit à Muhammad ibn Ubaydallah qu'ils étaient de Qays, parmi lesquels al-Hadi s'est arrêté sur la route du Yémen, et certains sont partis avec lui."
  tr: "Muhammed ibn Ubeydullah'a Kays'tan olduklarını söyleyen Arap bir kabileydiler. El-Hadi Yemen'e giderken onlarla birlikte kaldı ve bazıları da onunla birlikte yola çıktı."
  id: "Sebuah klan Arab yang anggotanya memberi tahu Muhammad ibn Ubayd Allah bahwa mereka berasal dari Qays. Al-Hadi tinggal bersama mereka dalam perjalanannya ke Yaman, dan beberapa dari mereka ikut bersamanya."
