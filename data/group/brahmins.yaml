label: { ar: "البراهمة", en: "The Brahmins", es: "Los brahmanes", fr: "Les brahmanes", ur: "برہمن", tr: "Brahmanlar", id: "Brahmana" }
summary:
  ar: "ذكر المؤلف أن أهل الهند سبعة أجناس، وأن البراهمة عبّاد الهند الذين لا يشربون الخمر، وأن الكستريين يلونهم، ثم الشوذريون أهل الزراعة، ثم أهل الصناعات، ثم أهل الألحان والمعازف، وأن أكثر أهل الهند اثنتان وأربعون ملة في الاعتقاد {cite:nuzhat-al-mushtaq-2002 p. 96}."
  en: "The author lists seven classes of Indians, with the Brahmins as worshippers who do not drink wine, followed by the warrior class, farmers, craftsmen and musicians. He reports that most Indians hold forty-two creeds {cite:nuzhat-al-mushtaq-2002 p. 96}."
  es: "El autor enumera siete clases de indios, siendo los brahmanes los fieles que no beben vino, seguidos por la clase guerrera, los agricultores, los artesanos y los músicos. Informa que la mayoría de los indios profesan cuarenta y dos credos {cite:nuzhat-al-mushtaq-2002 p. 96}."
  fr: "L'auteur recense sept classes d'Indiens: les brahmanes, religieux abstinents, suivis des guerriers, des agriculteurs, des artisans et des musiciens. Il indique que la plupart des Indiens adhèrent à quarante-deux croyances (voir: Nuzhat al-Mushtaq, 2002, p. 96)."
  ur: "مصنف نے ہندوستانیوں کے سات طبقوں کی فہرست دی ہے، برہمن عبادت گزاروں کے طور پر جو شراب نہیں پیتے، اس کے بعد جنگجو طبقہ، کسان، کاریگر اور موسیقار ہیں۔ وہ بتاتا ہے کہ زیادہ تر ہندوستانی بیالیس عقیدے رکھتے ہیں۔ 96}۔"
  tr: "Yazar, Hindistan halkının yedi ırktan oluştuğunu, Brahmanların alkol kullanmayan Hindistanlı ibadet edenler olduğunu, onlardan sonra Kstrilerin, ardından Şudraların, yani tarımla uğraşanların, sonra sanayiyle uğraşanların, sonra da ezgi ve müzik aletleriyle uğraşanların geldiğini ve Hindistan halkının çoğunun inanç bakımından kırk iki mezhebe mensup olduğunu belirtmiştir. {cite:nuzhat-al-mushtaq-2002 s. 96}"
  id: "Penulis menyebutkan bahwa penduduk India terdiri dari tujuh ras, dan bahwa kaum Brahmana adalah penyembah di India yang tidak minum alkohol, dan bahwa kaum Kstri berada di urutan berikutnya, kemudian kaum Shudra, kaum petani, kemudian kaum industri, kemudian kaum pencipta melodi dan alat musik, dan bahwa sebagian besar penduduk India menganut empat puluh dua sekte kepercayaan {cite:nuzhat-al-mushtaq-2002 p. 96}."
