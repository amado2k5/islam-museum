label: { ar: "البراهمة", en: "The Brahmins" }
summary:
  ar: "ذكر المؤلف أن أهل الهند سبعة أجناس، وأن البراهمة عبّاد الهند الذين لا يشربون الخمر، وأن الكستريين يلونهم، ثم الشوذريون أهل الزراعة، ثم أهل الصناعات، ثم أهل الألحان والمعازف، وأن أكثر أهل الهند اثنتان وأربعون ملة في الاعتقاد {cite:nuzhat-al-mushtaq-2002 p. 96}."
  en: "The author lists seven classes of Indians, with the Brahmins as worshippers who do not drink wine, followed by the warrior class, farmers, craftsmen and musicians. He reports that most Indians hold forty-two creeds {cite:nuzhat-al-mushtaq-2002 p. 96}."
