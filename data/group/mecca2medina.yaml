summary:
  ar: "فرقة بريطانية للهيب هوب الإسلامي والنشيد، أسسها راكين فيتوغا في لندن سنة 1996، أصدرت ثلاثة ألبومات نشيد وألبومين للهيب هوب، وقدّم أعضاؤها ورشا للشباب والسجناء، ونظموا باسم «مشروع السلام» لقاءات مع علماء وعروضا كوميدية؛ يذكر مصدرها أن أعضاءها، إلا واحدا ولد مسلما، اعتنقوا الإسلام."
  en: "A British Islamic hip-hop and nasheed group founded in London in 1996 by Rakin Fetuga, with three nasheed albums and two hip-hop albums; its members ran workshops for young people and prisoners and, as The Salam Project, organised talks with scholars and comedy nights. Its source states that all its members but one, who was born Muslim, converted to Islam."
  ur: "برطانوی اسلامی ہپ ہاپ اور نشید گروپ جسے راکن فیتوگا نے 1996 میں لندن میں قائم کیا؛ اس کے تین نشید اور دو ہپ ہاپ البم ہیں، اور اس کے ارکان نے نوجوانوں اور قیدیوں کے لیے ورکشاپس کیں اور «سلام پروجیکٹ» کے نام سے علما کی گفتگو اور کامیڈی کی محفلیں منعقد کیں۔"
