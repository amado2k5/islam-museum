label: { ar: "مكة إلى المدينة ⁦(Mecca2Medina)⁩", en: "Mecca2Medina", ur: "مکہ ٹو مدینہ", es: "La Meca2Medina", fr: "La Mecque2Médine", tr: "Mekke'den Medine'ye (Mecca2Medina)", id: "Mekah ke Madinah (Mecca2Medina)" }
summary:
  ar: "فرقة بريطانية للهيب هوب الإسلامي والنشيد، أسسها راكين فيتوغا في لندن سنة 1996، أصدرت ثلاثة ألبومات نشيد وألبومين للهيب هوب، وقدّم أعضاؤها ورشا للشباب والسجناء، ونظموا باسم «مشروع السلام» لقاءات مع علماء وعروضا كوميدية؛ يذكر مصدرها أن أعضاءها، إلا واحدا ولد مسلما، اعتنقوا الإسلام."
  en: "A British Islamic hip-hop and nasheed group founded in London in 1996 by Rakin Fetuga, with three nasheed albums and two hip-hop albums; its members ran workshops for young people and prisoners and, as The Salam Project, organised talks with scholars and comedy nights. Its source states that all its members but one, who was born Muslim, converted to Islam."
  ur: "برطانوی اسلامی ہپ ہاپ اور نشید گروپ جسے راکن فیتوگا نے 1996 میں لندن میں قائم کیا؛ اس کے تین نشید اور دو ہپ ہاپ البم ہیں، اور اس کے ارکان نے نوجوانوں اور قیدیوں کے لیے ورکشاپس کیں اور «سلام پروجیکٹ» کے نام سے علما کی گفتگو اور کامیڈی کی محفلیں منعقد کیں۔"
  es: "Grupo británico de hip-hop islámico y nasheed fundado en Londres en 1996 por Rakin Fetuga, con tres álbumes de nasheed y dos de hip-hop. Sus miembros impartían talleres para jóvenes y presos y, bajo el nombre de The Salam Project, organizaban charlas con académicos y noches de comedia. Según su fuente, todos sus miembros, excepto uno (nacido musulmán), se convirtieron al islam."
  fr: "Groupe britannique de hip-hop et de nasheed islamiques fondé à Londres en 1996 par Rakin Fetuga, il compte à son actif trois albums de nasheed et deux albums de hip-hop. Ses membres animaient des ateliers pour les jeunes et les détenus et, sous le nom de The Salam Project, organisaient des conférences avec des érudits et des soirées d'humour. Selon ses sources, tous ses membres, à l'exception d'un seul né musulman, se sont convertis à l'islam."
  tr: "1996 yılında Londra'da Rakin Fituga tarafından kurulan bir İngiliz İslami hip-hop ve ilahi grubu, üç ilahi albümü ve iki hip-hop albümü yayınladı. Üyeleri gençlere ve mahkumlara yönelik atölye çalışmaları düzenledi, alimlerle toplantılar yaptı ve \"Barış Projesi\" adı altında komedi gösterileri organize etti. Kaynaklara göre, Müslüman olarak doğan bir kişi hariç tüm üyeler İslamiyet'e geçmiştir."
  id: "Sebuah grup hip-hop dan nyanyian Islami Inggris, yang didirikan oleh Rakin Fituga di London pada tahun 1996, merilis tiga album nyanyian dan dua album hip-hop. Para anggotanya memberikan lokakarya kepada kaum muda dan narapidana, serta menyelenggarakan pertemuan dengan para cendekiawan dan pertunjukan komedi dengan nama \"Peace Project.\" Sumber tersebut menyatakan bahwa semua anggotanya, kecuali satu orang yang lahir sebagai Muslim, telah memeluk Islam."
