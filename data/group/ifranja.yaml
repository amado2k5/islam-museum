label: { ar: "الإفرنجة", en: "The Franks (Ifranja)", es: "Los francos (Ifranja)", fr: "Les Francs (Ifranja)", ur: "فرینکس ⁦(افرانجا)⁩" }
summary:
  ar: "عند المسعودي أن الإفرنجة أشد أجناس ولد يافث بأساً وأمنعهم هيبة وأوسعهم ملكاً وأكثرهم مدناً وأحسنهم نظاماً وانقياداً لملوكهم، كلمتهم متفقة على ملك واحد، واسم دار مملكتهم في وقته بويرة مدينة عظيمة ولهم نحو مائة وخمسين مدينة، وكان أوائل بلادهم قبل الإسلام جزيرة رودس وجزيرة إقريطش وإفريقية وصقلية، وملوكهم في كتاب أهداة عرماز أسقف جربدة إلى الحكم بن عبد الرحمن سنة ثمان وعشرين وثلاثمائة أولهم قلودية المجوسي الذي نصرته امرأته غرطلة، ومنهم قارله بن تبين في أيام الحكم صاحب الأندلس، وآخرهم إلى سنة اثنتين وثلاثين وثلاثمائة لذريق بن قارله {cite:muruj-al-dhahab p. 357-359}."
  en: "al-Mas'udi's Franks — fiercest of the Japhetic nations, united under one king whose capital in his day was Buwayra with some 150 towns; their early lands included Rhodes, Crete, Ifriqiya and Sicily. The king-list Bishop Urmazd of Jarunda sent al-Hakam in 328 runs from the Magian Qaludiya (converted by his wife Ghartala) through Qarla ibn Tabin down to Ludhriq ibn Qarla, reigning in 332 {cite:muruj-al-dhahab p. 357-359}."
  es: "Los francos de al-Mas'udi, los más feroces de las naciones jaféticas, estaban unidos bajo un rey cuya capital en su época era Buwayra, con unas 150 ciudades; sus territorios iniciales incluían Rodas, Creta, Ifriqiya y Sicilia. El obispo Urmazd de Jarunda, encargado de la lista de reyes, envió a al-Hakam en 328 carreras desde el mago Qaludiya (convertido por su esposa Ghartala) a través de Qarla ibn Tabin hasta Ludhriq ibn Qarla, quien reinó en 332 {cite:muruj-al-dhahab p. 357-359}."
  fr: "Les Francs d'al-Mas'udi — les plus féroces des nations japhétiques — étaient unis sous un seul roi dont la capitale était Buwayra et qui comptait environ 150 villes. Leurs premiers territoires comprenaient Rhodes, la Crète, l'Ifriqiya et la Sicile. L'évêque Urmazd de Jarunda, dont la liste royale était établie, envoya al-Hakam en 328 après la conversion du mage Qaludiya (converti par son épouse Ghartala) à Ludhriq ibn Qarla, qui régna en 332 (voir: Muruj-al-Dhahab, p. 357-359)."
  ur: "المسعودی کے فرینکس - جافیاتی قوموں میں سے سخت ترین، ایک بادشاہ کے ماتحت متحد ہوئے جس کے دور میں دارالحکومت بوویرا تھا جس میں تقریباً 150 قصبات تھے۔ ان کی ابتدائی زمینوں میں رہوڈز، کریٹ، افریقیہ اور سسلی شامل تھے۔ جاروندا کے بادشاہ کی فہرست کے بشپ ارمازد نے 328 رنز میں الحکم کو مجان قلودیہ ⁦(اس کی بیوی گھرتلہ نے تبدیل کیا)⁩ سے قرلہ ابن تبین کے ذریعے لدھیریق ابن قرلہ کے پاس بھیجا، اس نے 332 میں حکومت کی۔ 357-359}۔"
