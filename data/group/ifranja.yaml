label: { ar: "الإفرنجة", en: "The Franks (Ifranja)" }
summary:
  ar: "عند المسعودي أن الإفرنجة أشد أجناس ولد يافث بأساً وأمنعهم هيبة وأوسعهم ملكاً وأكثرهم مدناً وأحسنهم نظاماً وانقياداً لملوكهم، كلمتهم متفقة على ملك واحد، واسم دار مملكتهم في وقته بويرة مدينة عظيمة ولهم نحو مائة وخمسين مدينة، وكان أوائل بلادهم قبل الإسلام جزيرة رودس وجزيرة إقريطش وإفريقية وصقلية، وملوكهم في كتاب أهداة عرماز أسقف جربدة إلى الحكم بن عبد الرحمن سنة ثمان وعشرين وثلاثمائة أولهم قلودية المجوسي الذي نصرته امرأته غرطلة، ومنهم قارله بن تبين في أيام الحكم صاحب الأندلس، وآخرهم إلى سنة اثنتين وثلاثين وثلاثمائة لذريق بن قارله {cite:muruj-al-dhahab p. 357-359}."
  en: "al-Mas'udi's Franks — fiercest of the Japhetic nations, united under one king whose capital in his day was Buwayra with some 150 towns; their early lands included Rhodes, Crete, Ifriqiya and Sicily. The king-list Bishop Urmazd of Jarunda sent al-Hakam in 328 runs from the Magian Qaludiya (converted by his wife Ghartala) through Qarla ibn Tabin down to Ludhriq ibn Qarla, reigning in 332 {cite:muruj-al-dhahab p. 357-359}."
