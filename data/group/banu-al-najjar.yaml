label: { ar: "بنو النجار", en: "Banu al-Najjar" }
summary:
  ar: "بطن من الخزرج بيثرب، أخوال عبد المطلب: منهم سلمى بنت عمرو من بني عدي بن النجار زوج هاشم، وفي بيت أبيها نشأ عبد المطلب؛ ولما غصبه نوفل أركاحه استنجد بهم فجاء خاله أبو سعد بن عدي في ثمانين راكباً حتى رُدّ حقه، فقالت خزاعة: نحن ولدناه كما ولدتموه. وهم أول دور الأنصار في فضل الصحيح: «خير دور الأنصار بنو النجار» {cite:sahih-al-bukhari 3807}."
  en: "A clan of the Khazraj at Yathrib, the maternal kin of Abd al-Muttalib: Salma bint Amr of Banu Adi ibn al-Najjar was Hashim's wife and Abd al-Muttalib grew up in her father's house; when Nawfal seized his property he appealed to them and his uncle Abu Sa'd ibn Adi came with eighty riders until his right was restored, prompting Khuza'a to claim an equal kinship."
