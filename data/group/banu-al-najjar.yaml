summary:
  ar: "بطن من الخزرج بيثرب، أخوال عبد المطلب: منهم سلمى بنت عمرو من بني عدي بن النجار زوج هاشم، وفي بيت أبيها نشأ عبد المطلب؛ ولما غصبه نوفل أركاحه استنجد بهم فجاء خاله أبو سعد بن عدي في ثمانين راكباً حتى رُدّ حقه، فقالت خزاعة: نحن ولدناه كما ولدتموه. وهم أول دور الأنصار في فضل الصحيح: «خير دور الأنصار بنو النجار» {cite:sahih-al-bukhari 3807}."
  en: "A clan of the Khazraj at Yathrib, the maternal kin of Abd al-Muttalib: Salma bint Amr of Banu Adi ibn al-Najjar was Hashim's wife and Abd al-Muttalib grew up in her father's house; when Nawfal seized his property he appealed to them and his uncle Abu Sa'd ibn Adi came with eighty riders until his right was restored, prompting Khuza'a to claim an equal kinship."
  es: "Un clan de los Khazraj en Yathrib, parientes maternos de Abd al-Muttalib: Salma bint Amr de Banu Adi ibn al-Najjar era la esposa de Hashim y Abd al-Muttalib creció en la casa de su padre; cuando Nawfal se apoderó de sus propiedades, apeló a ellos y su tío Abu Sa'd ibn Adi vino con ochenta jinetes hasta que se le restituyó su derecho, lo que llevó a Khuza'a a reclamar un parentesco igualitario."
  fr: "Un clan des Khazraj de Yathrib, la famille maternelle d'Abd al-Muttalib: Salma bint Amr de Banu Adi ibn al-Najjar était l'épouse de Hashim et Abd al-Muttalib a grandi dans la maison de son père; lorsque Nawfal s'empara de ses biens, il fit appel à eux et son oncle Abu Sa'd ibn Adi vint avec quatre-vingts cavaliers jusqu'à ce que son droit soit rétabli, incitant Khuza'a à revendiquer une parenté égale."
  ur: "یثرب میں خزرج کا ایک قبیلہ، عبد المطلب کا رشتہ دار: بنو عدی بن النجار کی سلمیٰ بنت عمرو ہاشم کی بیوی تھیں اور عبدالمطلب اپنے باپ کے گھر پلے بڑھے تھے۔ جب نوفل نے ان کی جائیداد پر قبضہ کر لیا تو اس نے ان سے درخواست کی اور اس کے چچا ابو سعد بن عدی اسّی سواروں کے ساتھ آئے یہاں تک کہ ان کا حق بحال ہو گیا، خزاعہ کو مساوی رشتہ داری کا دعویٰ کرنے پر اکسایا۔"
  tr: "Yathrib'de Hazrec kabilesinden, Abdülmuttalib'in anne tarafından amcaları vardı: aralarında Beni Adi ibn el-Necar'dan Salma bint Amr, Haşim'in karısı da bulunuyordu. Abdülmuttalib babasının evinde büyüdü. Nevfel malını gasp edince, onlardan yardım istedi ve anne tarafından amcası Ebu Sa'd ibn Adi, hakkı geri verilene kadar seksen süvariyle geldi. Huza'a şöyle dedi: \"Biz de onu tıpkı sizin gibi doğurduk.\" Onlar, Sahih'te geçen \"Ensar'ın en iyileri Beni el-Necar'dır\" {Sahih-i Buhari 3807} hadisinin faziletine göre Ensar'ın en iyileridir."
  id: "Sebuah klan Khazraj di Yathrib, paman-paman dari pihak ibu Abd al-Muttalib: di antara mereka adalah Salma bint Amr dari Banu Adi ibn al-Najjar, istri Hashim. Abd al-Muttalib dibesarkan di rumah ayahnya. Ketika Nawfal merampas hartanya, ia meminta bantuan mereka, dan paman dari pihak ibunya, Abu Sa'd ibn Adi, datang dengan delapan puluh penunggang kuda hingga haknya dipulihkan. Khuza'a berkata: \"Kami melahirkannya seperti yang kalian lakukan.\" Mereka adalah kaum Ansar pertama yang memiliki keutamaan menurut Sahih: \"Kaum Ansar yang terbaik adalah Banu al-Najjar\" {kutip:sahih-al-bukhari 3807}."
