  id: "Suatu metode dervish yang dikaitkan, menurut Douson, kepada Abdullah Ashraf (Ashraf) al-Rumi, yang meninggal pada tahun 899 H (1493 M) {cite:encyclopaedia-of-islam-2 vol. 1 p. 753}"
