  ur: "ایک درویش حکم جو ڈی اوہسن کے مطابق اس کا نام عبد اللہ اشرف ⁦(اشرف)⁩ رومی سے لیا گیا ہے، جو 899 ہجری (1493) میں فوت ہوئے تھے۔ 1 ص۔ 753}"
