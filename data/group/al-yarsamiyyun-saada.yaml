summary:
  ar: "جماعة في عسكر الهادي جعلها في الميسرة، وتخلف بعضها عن القتال في علاف، ومنها محمد بن مصبح."
  en: "A body in al-Hadi's army set on the left wing, some of whom held back from the fight at Allaf; Muhammad ibn Musbih is one of them."
  ur: "ہادی کے لشکر میں ایک جماعت جو بائیں بازو میں رکھی گئی، جس میں سے کچھ علاف کی لڑائی سے پیچھے رہے؛ محمد بن مصبح ان میں ہیں۔"
  es: "Un contingente del ejército de al-Hadi se encontraba en el flanco izquierdo, algunos de cuyos miembros se habían retirado de la lucha en Allaf; Muhammad ibn Musbih era uno de ellos."
  fr: "Un corps de l'armée d'al-Hadi placé sur l'aile gauche, dont certains se sont retenus de combattre à Allaf; Muhammad ibn Musbih est l'un d'eux."
  tr: "Hadi'nin ordusundaki bir grup onları sol kanada yerleştirdi ve Muhammed ibn Musbah da dahil olmak üzere bazıları Allaf'taki savaştan uzak durdu."
  id: "Sekelompok orang dalam pasukan al-Hadi menempatkan mereka di sayap kiri, dan beberapa dari mereka tetap tinggal setelah bertempur di Allaf, termasuk Muhammad ibn Musbah."
