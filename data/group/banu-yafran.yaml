  en: Banu Yafran (Yafranids)
  es: "Banu Yafran (Yafranidos)"
  fr: "Banu Yafran (Yafranides)"
summary:
  ar: "بنو يفرن من زناتة، من أعظم قبائل البربر بالمغرب؛ لهم بطون كثيرة متفرقة بالمواطن فمنهم بإفريقية بنو واركوا ومرنجيصة، ومنهم بنواحي تلمسان وتاهرت من خرج منهم أبو يزيد صاحب الحمار وأبو قرة الذي حاصر عمر بن حفص بطبنة، ودولتان لهم: الأولى بالمغرب الأوسط تحت يعلى بن محمد الخاطط لإيفكان والحاكم باسم الناصر من تاهرت إلى طنجة حتى قتله جوهر الكاتب سنة 347هـ، والثانية بسلا في المغرب الأقصى من بعده."
  en: "Banu Yafran of the Zanata, among the greatest Berber tribes of the Maghreb; many branches scattered through the homeland — Warkuwa and Maranjisa in Ifriqiya, the Tlemcen–Tahert stock that produced Abu Yazid 'Man of the Donkey' and Abu Qurra who besieged Umar ibn Hafs at Tubna — and two states: the first in the Middle Maghreb under Ya'la ibn Muhammad, founder of Ifkan, whose khutba ran for al-Nasir from Tahert to Tangier until Jawhar killed him in 347, and the second at Salé in the Far Maghreb."
  es: "Banu Yafran de Zanata, una de las tribus bereberes más importantes del Magreb; muchas ramas dispersas por su tierra natal: Warkuwa y Maranjisa en Ifriqiya, la estirpe Tlemcen-Tahert que produjo a Abu Yazid 'Hombre del Burro' y Abu Qurra, quien asedió a Umar ibn Hafs en Tubna; y dos estados: el primero en el Magreb Medio bajo Ya'la ibn Muhammad, fundador de Ifkan, cuya jutba se extendió por al-Nasir desde Tahert hasta Tánger hasta que Jawhar lo mató en 347, y el segundo en Salé, en el Magreb Lejano."
  fr: "Les Banu Yafran de la Zanata, parmi les plus grandes tribus berbères du Maghreb; de nombreuses branches dispersées à travers la patrie — Warkuwa et Maranjisa en Ifriqiya, la souche Tlemcen-Tahert qui a produit Abu Yazid « l'Homme de l'Âne » et Abu Qurra qui a assiégé Umar ibn Hafs à Tubna — et deux États: le premier au Maghreb moyen sous Ya'la ibn Muhammad, fondateur d'Ifkan, dont le khutba a été prononcé pour al-Nasir de Tahert à Tanger jusqu'à ce que Jawhar le tue en 347, et le second à Salé dans le Maghreb lointain."
