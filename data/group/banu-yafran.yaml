label:
  ar: بنو يفرن
  en: Banu Yafran (Yafranids)
summary:
  ar: "بنو يفرن من زناتة، من أعظم قبائل البربر بالمغرب؛ لهم بطون كثيرة متفرقة بالمواطن فمنهم بإفريقية بنو واركوا ومرنجيصة، ومنهم بنواحي تلمسان وتاهرت من خرج منهم أبو يزيد صاحب الحمار وأبو قرة الذي حاصر عمر بن حفص بطبنة، ودولتان لهم: الأولى بالمغرب الأوسط تحت يعلى بن محمد الخاطط لإيفكان والحاكم باسم الناصر من تاهرت إلى طنجة حتى قتله جوهر الكاتب سنة 347هـ، والثانية بسلا في المغرب الأقصى من بعده."
  en: "Banu Yafran of the Zanata, among the greatest Berber tribes of the Maghreb; many branches scattered through the homeland — Warkuwa and Maranjisa in Ifriqiya, the Tlemcen–Tahert stock that produced Abu Yazid 'Man of the Donkey' and Abu Qurra who besieged Umar ibn Hafs at Tubna — and two states: the first in the Middle Maghreb under Ya'la ibn Muhammad, founder of Ifkan, whose khutba ran for al-Nasir from Tahert to Tangier until Jawhar killed him in 347, and the second at Salé in the Far Maghreb."
