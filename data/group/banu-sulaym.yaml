  ar: بنو سليم
  en: Banu Sulaym
summary:
  ar: "بنو سليم بن منصور بن عكرمة بن خصفة بن قيس عيلان، من عظام أحياء العرب؛ كانوا في الحجاز ثم اجتمعوا في مهاجرتهم إلى مصر ومنها أجازوا إلى إفريقية في أثر بني هلال فسكنوا برقة ثم الغرب وزاحموا بني هلال فدحضوهم إلى المغرب الأوسط، واستقروا بضواحي قابس وصفاقس وما بين طرابلس إلى حدود فاس، ومنهم بنو مكي رؤساء قابس وبنو ثابت رؤساء طرابلس وبنو مزني أمراء بسكرة."
  en: "Banu Sulaym ibn Mansur ibn Ikrima ibn Khasafa ibn Qays Aylan, among the great Arab divisions; Hijazi folk who gathered in the migration to Egypt then crossed into Ifriqiya after Banu Hilal — they settled Barqa then pressed west, driving the Hilalis into the Middle Maghreb, and settled the marches of Gabes, Sfax and from Tripoli toward Fez's bounds; of them the Banu Makki chiefs of Gabes, the Banu Thabit of Tripoli and the Banu Muzni amirs of Biskra."
