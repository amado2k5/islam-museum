summary:
  ar: "بنو سليم بن منصور بن عكرمة بن خصفة بن قيس عيلان بن مضر، قيسية عددًا ونسباً؛ منهم العباس بن مرداس وصحب المطلب بن أبي وداعة، وكانت سليم تساعد المسلمين في حنين وحديث «أصبحنا ببني سليم» في تتبع الرائد {cite:mubarakpuri-raheeq p.16} {cite:isaba} {cite:kamil-ibn-al-athir}."
  en: "Banu Sulaym ibn Mansur ibn Ikrima ibn Khasafa ibn Qays Aylan ibn Mudar — numerous in men and lineage; among them al-Abbas ibn Mirdas and the companions of al-Mutallib ibn Abi Wada'a; Sulaym aided the Muslims at Hunayn, and their dawn-raid reports run in the hadith of the scout {cite:mubarakpuri-raheeq p.16} {cite:isaba} {cite:kamil-ibn-al-athir}."
