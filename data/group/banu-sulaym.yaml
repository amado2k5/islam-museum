summary:
  ar: "بنو سليم بن منصور بن عكرمة بن خصفة بن قيس عيلان، من عظام أحياء العرب؛ كانوا في الحجاز ثم اجتمعوا في مهاجرتهم إلى مصر ومنها أجازوا إلى إفريقية في أثر بني هلال فسكنوا برقة ثم الغرب وزاحموا بني هلال فدحضوهم إلى المغرب الأوسط، واستقروا بضواحي قابس وصفاقس وما بين طرابلس إلى حدود فاس، ومنهم بنو مكي رؤساء قابس وبنو ثابت رؤساء طرابلس وبنو مزني أمراء بسكرة."
  en: "Banu Sulaym ibn Mansur ibn Ikrima ibn Khasafa ibn Qays Aylan, among the great Arab divisions; Hijazi folk who gathered in the migration to Egypt then crossed into Ifriqiya after Banu Hilal — they settled Barqa then pressed west, driving the Hilalis into the Middle Maghreb, and settled the marches of Gabes, Sfax and from Tripoli toward Fez's bounds; of them the Banu Makki chiefs of Gabes, the Banu Thabit of Tripoli and the Banu Muzni amirs of Biskra."
  es: "Banu Sulaym ibn Mansur ibn Ikrima ibn Khasafa ibn Qays Aylan, entre las grandes divisiones árabes; gente de Hiyaz que se reunió en la migración a Egipto y luego cruzó a Ifriqiya después de Banu Hilal; se establecieron en Barqa y luego presionaron hacia el oeste, expulsando a los Hilalis hacia el Magreb Medio, y se establecieron en las marcas de Gabes, Sfax y desde Trípoli hacia los límites de Fez; de ellos los jefes Banu Makki de Gabes, los Banu Thabit de Trípoli y los emires Banu Muzni de Biskra."
  fr: "Les Banu Sulaym ibn Mansur ibn Ikrima ibn Khasafa ibn Qays Aylan, parmi les grandes divisions arabes; peuple du Hedjaz qui s'est rassemblé lors de la migration vers l'Égypte puis a traversé l'Ifriqiya après les Banu Hilal — ils se sont installés à Barqa puis ont poussé vers l'ouest, repoussant les Hilalis vers le Maghreb moyen, et se sont installés dans les marches de Gabès, Sfax et de Tripoli vers les limites de Fès; parmi eux les chefs Banu Makki de Gabès, les Banu Thabit de Tripoli et les émirs Banu Muzni de Biskra."
  ur: "بنو سلیم بن منصور بن عکرمہ بن خصافہ بن قیس عیلان، عرب کے بڑے گروہوں میں سے؛ حجازی لوگ جو مصر کی طرف ہجرت میں جمع ہوئے پھر بنو ہلال کے بعد عفریقیہ میں داخل ہوئے - انہوں نے برقع کو آباد کیا پھر مغرب کی طرف دبایا، ہلالیوں کو مشرق مغرب کی طرف لے گئے، اور گیبس، سفیکس اور طرابلس سے فز کی حدود کی طرف مارچ طے کیا۔ ان میں سے بنو مکی غیبس کے سردار، طرابلس کے بنو ثابت اور بسکرہ کے بنو مزنی امیر تھے۔"
  tr: "Büyük Arap kabilelerinden biri olan Beni Süleym ibn Mansur ibn İkrimah ibn Haşfe ibn Kays Aylan, Hicaz'da bulunuyordu, daha sonra Mısır'a göçleri sırasında bir araya geldiler ve oradan Beni Hilal'in izinden giderek Afrika'ya geçtiler. Barka'ya, sonra da batıya yerleştiler ve Beni Hilal ile rekabete girdiler, bu yüzden onları Orta Mağrip'e geri püskürttüler. Gabes ve Sfax'ın eteklerinde ve Trablus ile Fez sınırları arasında yerleştiler. Bunlar arasında Gabes'in reisleri olan Beni Makki, Trablus'un reisleri olan Beni Sabit ve Biskra prensleri olan Beni Mazni bulunmaktadır."
  id: "Bani Sulaym ibn Mansur ibn Ikrimah ibn Khasfah ibn Qays Aylan, salah satu suku Arab besar, berada di Hijaz, kemudian mereka berkumpul selama migrasi mereka ke Mesir, dan dari sana mereka menyeberang ke Afrika mengikuti jejak Bani Hilal. Mereka menetap di Barqa, kemudian di barat, dan mereka bersaing dengan Bani Hilal, sehingga mereka mendorong mereka kembali ke Maghreb tengah. Mereka menetap di pinggiran Gabes dan Sfax dan di antara Tripoli dan perbatasan Fez. Di antara mereka adalah Bani Makki, kepala suku Gabes, Bani Thabit, kepala suku Tripoli, dan Bani Mazni, pangeran Biskra."
