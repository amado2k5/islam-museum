label: { ar: "بنو أمية بن زيد", en: "Banu Umayya ibn Zayd", es: "Banu Umayya ibn Zayd", fr: "Banu Umayya ibn Zayd", ur: "بنو امیہ بن زید", tr: "Banu Umayya ibn Zayd", id: "Banu Umayyah bin Zayd" }
summary:
  ar: "عشيرة نسب إليها ابن إسحاق ثعلبة بن حاطب ووديعة بن ثابت، وهو رهط أبي لبابة بن عبد المنذر. وعند السمهودي عن ابن إسحاق كانت من «أوس الله» — بني أمية بن زيد وخطمة ووائل وواقف — الذين وقف بهم أبو قيس بن صيفي بن الأسلت عن الإسلام حتى مضت بدر وأحد والخندق ثم أسلموا كلهم {cite:samhudi-wafa-al-wafa p. 239-240}."
  en: A clan to which Ibn Ishaq ascribes Tha'laba ibn Hatib and Wadi'a ibn Thabit; it is the party of Abu Lubaba ibn Abd al-Mundhir.
  es: "Un clan al que Ibn Ishaq atribuye Tha'laba ibn Hatib y Wadi'a ibn Thabit; es el partido de Abu Lubaba ibn Abd al-Mundhir."
  fr: "Un clan auquel Ibn Ishaq attribue Tha'laba ibn Hatib et Wadi'a ibn Thabit; c'est le parti d'Abou Lubaba ibn Abd al-Mundhir."
  ur: "ایک قبیلہ جس کی طرف ابن اسحاق نے ثعلبہ بن حاطب اور ودیع بن ثابت کو منسوب کیا ہے۔ یہ ابو لبابہ بن عبد المنذر کی جماعت ہے۔"
  tr: "İbn İshak'ın Tha'labah ibn Hatib ve Wadi'ah ibn Thabit'i atfettiği ve Ebu Lubabah ibn Abd al-Mundhir'in kabilesi olan kabile. Ve el-Samhudi'ye göre, İbn İshak'tan rivayetle, onlar \"Aws Allah\" kabilesindendi - Beni Umayyah ibn Zayd, Khatmah, Wa'il ve Waqif kabilesindendi - Ebu Kays ibn Sayfi ibn al-Aslat onları Bedir, Uhud ve Hendek'ten sonrasına kadar İslam'dan uzak tutmuş, daha sonra hepsi İslam'ı kabul etmişlerdir. {kaynak:samhudi-wafa-al-wafa s. 239-240}."
  id: "Klan yang oleh Ibnu Ishaq dikaitkan dengan Tha'labah ibn Hatib dan Wadi'ah ibn Thabit, dan yang merupakan klan Abu Lubabah ibn Abd al-Mundhir. Dan menurut al-Samhudi berdasarkan riwayat Ibnu Ishaq, mereka berasal dari “Aws Allah” — Bani Umayyah ibn Zayd, Khatmah, Wa'il, dan Waqif — yang dijauhkan Abu Qays ibn Sayfi ibn al-Aslat dari Islam hingga setelah Badr, Uhud, dan Parit, kemudian mereka semua memeluk Islam {kutip:samhudi-wafa-al-wafa hlm. 239-240}."
