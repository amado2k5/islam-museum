summary:
  ar: "بطن من قريش من ولد محارب بن فهر بن مالك، عصبة النبي في قصي؛ ورد هذا البطن في أخبار قريش المكية قبل الفتح، ومنه بعض من فاوض وأسلم {cite:ibn-hisham-sira}."
  en: "A batn of Quraysh descended from Muharib ibn Fihr ibn Malik, the Prophet's tribal kin at the Qusayy level, named in the Meccan reports before the conquest {cite:ibn-hisham-sira}."
  ur: "قریش کا بطن، محارب بن فہر بن مالک کی اولاد — نبی کے قصی درجے کے عصبہ۔"
  es: "Un clan de Quraysh descendiente de Muharib ibn Fihr ibn Malik, pariente tribal del Profeta a nivel Qusayy, mencionado en los informes de La Meca antes de la conquista {cite:ibn-hisham-sira}."
  fr: "Une tribu de Quraysh issue de Muharib ibn Fihr ibn Malik, parent tribal du Prophète au niveau des Qusayy, mentionnée dans les rapports mecquois avant la conquête {cite:ibn-hisham-sira}."
  tr: "Peygamberin Kusay'daki kabilesi olan Muharib ibn Fihr ibn Malik'in soyundan gelen bir Kureyş kabilesi; bu kabile, fetihten önce Mekke Kureyş'i hakkında çıkan haberlerde anılmış ve bazıları müzakere ederek İslam'ı kabul etmiştir. {cite:ibn-hisham-sira}"
  id: "Sebuah klan Quraisy dari keturunan Muharib ibn Fihr ibn Malik, klan Nabi di Qusay; klan ini disebutkan dalam berita tentang Quraisy Mekah sebelum penaklukan, dan beberapa dari mereka bernegosiasi dan masuk Islam. {cite:ibn-hisham-sira}."
