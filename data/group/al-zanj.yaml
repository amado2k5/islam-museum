summary:
  ar: "الزنج في كتب الجغرافيا والتاريخ أهل سواحل شرق أفريقيا وزنجبار: كتب المسعودي والجاحظ يصفونهم وبلادهم وتجارتهم بالرقيق والذهب، وثورتهم المشهورة على العباسيين «ثورة الزنج» كما يقصها الطبري وابن الأثير {cite:muruj-al-dhahab} {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir}."
  en: "The Zanj in the books of geography and history are the people of the East African coasts and Zanjibar: al-Mas'udi and al-Jahiz describe them, their land and the slave-and-gold trade, and their famous rising against the Abbasids — «the Revolt of the Zanj» — as al-Tabari and Ibn al-Athir recount it {cite:muruj-al-dhahab} {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir}."
  ur: "زنج جغرافیہ اور تاریخ کی کتابوں میں مشرقی افریقہ کے ساحل اور زنجبار کے باشندے ہیں: مسودی اور جاحظ انہیں، ان کے ملک اور غلام و سونے کی تجارت کو بیان کرتے ہیں، اور عباسیوں کے خلاف ان کی مشہور بغاوت — «زنج کا قیام» — جیسا کہ طبری اور ابن اثیر بیان کرتے ہیں۔"
  es: "En los libros de geografía e historia, los Zanj son el pueblo de las costas de África Oriental y Zanjibar: al-Mas'udi y al-Jahiz los describen, su tierra y el comercio de esclavos y oro, y su famosa rebelión contra los abasíes —«la revuelta de los Zanj»— como la relatan al-Tabari e Ibn al-Athir {cite:muruj-al-dhahab} {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir}."
  fr: "Les Zanj, dans les livres de géographie et d'histoire, sont les habitants des côtes d'Afrique de l'Est et de Zanjibar: al-Mas'udi et al-Jahiz les décrivent, ainsi que leur terre, le commerce des esclaves et de l'or, et leur célèbre soulèvement contre les Abbassides — « la Révolte des Zanj » — tel que le racontent al-Tabari et Ibn al-Athir {cite:muruj-al-dhahab} {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir}."
  tr: "Coğrafya ve tarih kitaplarında Zanjlar, Doğu Afrika kıyıları ve Zanzibar halkı olarak geçer: El-Mas'udi ve El-Cahiz, onların ülkesi, köle ve altın ticareti ve El-Taberi ile İbn El-Athir'in rivayet ettiği gibi Abbasilere karşı ünlü isyanları olan \"Zanj İsyanı\" hakkında yazmışlardır."
  id: "Dalam buku-buku geografi dan sejarah, Zanj adalah penduduk pesisir Afrika Timur dan Zanzibar: Al-Mas’udi dan Al-Jahiz menulis tentang mereka, negara mereka, perdagangan budak dan emas mereka, dan pemberontakan terkenal mereka melawan Abbasiyah, \"Pemberontakan Zanj,\" sebagaimana diriwayatkan oleh Al-Tabari dan Ibn Al-Athir."
