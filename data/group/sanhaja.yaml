  en: Sanhaja
  es: "Sanhaja"
  fr: "Sanhaja"
  ur: "سانہاجا"
summary:
  ar: من أعظم أمم البربر الثلاث مع لمطة وهوارة، موطنهم الصحراء وجبالها، ومنهم الملثمون قبائل لمتونة وجدالة ومسوفة أصحاب دولة المرابطين، ومنهم آل زيري وآل حماد ملوك إفريقية والقلعة، ولا يزال بقاياهم بالصحراء على حالهم الأول إلى عهد ابن خلدون.
  en: One of the three great Berber nations alongside Lamta and Hawwara, dwelling in the Sahara and its mountains; from them came the Mulaththamun tribes Lamtuna, Guddala and Massufa who built the Almoravid state, and the Zirid and Hammadid royal houses of Ifriqiya and the Qal'a, their remnant still in the desert in Ibn Khaldun's day.
  es: "Una de las tres grandes naciones bereberes, junto con Lamta y Hawwara, que habitaban el Sahara y sus montañas; de ellas procedían las tribus Mulaththamun Lamtuna, Guddala y Massufa, que construyeron el estado almorávide, y las casas reales Zirid y Hammadid de Ifriqiya y Qal'a, cuyos descendientes aún se encontraban en el desierto en tiempos de Ibn Khaldun."
  fr: "L'une des trois grandes nations berbères avec Lamta et Hawwara, habitant le Sahara et ses montagnes; de celles-ci sont issues les tribus Mulaththamun Lamtuna, Guddala et Massufa qui ont construit l'État almoravide, et les maisons royales zirides et hammadides d'Ifriqiya et des Qal'a, dont les vestiges se trouvaient encore dans le désert à l'époque d'Ibn Khaldun."
  ur: "لمٹا اور حوارہ کے ساتھ ساتھ تین عظیم بربر اقوام میں سے ایک، صحارا اور اس کے پہاڑوں میں رہائش پذیر؛ ان میں سے ملاتھامون قبیلے لامتونہ، گڈالہ اور مصوفہ آئے جنہوں نے الموراوی ریاست کی تعمیر کی، اور افریقیہ اور قلعہ کے زرد اور حماد شاہی گھر، ابن خلدون کے زمانے میں ان کی باقیات اب بھی صحرا میں ہیں۔"
