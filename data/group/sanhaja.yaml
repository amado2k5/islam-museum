label:
  ar: صنهاجة
  en: Sanhaja
summary:
  ar: من أعظم أمم البربر الثلاث مع لمطة وهوارة، موطنهم الصحراء وجبالها، ومنهم الملثمون قبائل لمتونة وجدالة ومسوفة أصحاب دولة المرابطين، ومنهم آل زيري وآل حماد ملوك إفريقية والقلعة، ولا يزال بقاياهم بالصحراء على حالهم الأول إلى عهد ابن خلدون.
  en: One of the three great Berber nations alongside Lamta and Hawwara, dwelling in the Sahara and its mountains; from them came the Mulaththamun tribes Lamtuna, Guddala and Massufa who built the Almoravid state, and the Zirid and Hammadid royal houses of Ifriqiya and the Qal'a, their remnant still in the desert in Ibn Khaldun's day.
