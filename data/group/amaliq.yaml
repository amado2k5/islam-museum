summary:
  ar: "عملاق بن لاوذ بن إرم بن سام بن نوح سار بولده فنزلوا أكناف الحرم والتهائم ومنهم من سار إلى مصر والمغرب وقيل إنهم بعض فراعنة مصر، وقيل هم من ولد العيص بن إسحاق بن إبراهيم، وكانت لهم ملوك كثيرة بالشام وغيره وبقيتهم انضافوا إلى ملوك الروم فملكتهم على مشارق الشام والغرب والجزيرة، ومنهم أذينة بن السميدع الذي ذكره الأعشى بقوله أزال أذينة عن ملكه {cite:muruj-al-dhahab p. 450}. وعند البلاذري نزلوا أول الأمر صنعاء اليمن ثم انتقلوا إلى يثرب فنزلوها وإنما سميت يثرب برئيس لهم يقال له يثرب، ثم انتقلوا إلى ناحية فلسطين من الشام ومضت عامهم إلى مصر وناحية إفريقية وتفرقوا بالمغرب فالبرابرة منهم في قول البلاذري {cite:ansab-al-ashraf p. 7-8}"
  en: "Descendants of 'Amaliq ibn Lawdh who settled the sanctuary's borders and Tihama — some pressing on to Egypt and the Maghrib where one report makes them some of Egypt's pharaohs, another deriving them from Esau — their remnant later set by Rome over east Syria, the west and the Jazira, among them Udhayna ibn al-Sumayda' of al-A'sha's verse {cite:muruj-al-dhahab p. 450}."
  es: "Descendientes de 'Amaliq ibn Lawdh que colonizaron las fronteras del santuario y Tihama —algunos avanzando hacia Egipto y el Magreb, donde un relato los sitúa entre los faraones de Egipto, otro los deriva de Esaú— su remanente fue posteriormente establecido por Roma sobre el este de Siria, el oeste y el Jazira, entre ellos Udhayna ibn al-Sumayda' del verso de al-A'sha {cite:muruj-al-dhahab p. 450}."
  fr: "Les descendants d'Amaliq ibn Lawdh qui s'établirent aux frontières du sanctuaire et à Tihama — certains allant jusqu'en Égypte et au Maghreb où un rapport les fait passer pour des pharaons d'Égypte, un autre les faisant descendre d'Ésaü — leur reste fut plus tard établi par Rome sur la Syrie orientale, l'ouest et la Jazira, parmi lesquels Udhayna ibn al-Sumayda' du verset d'al-A'sha {cite:muruj-al-dhahab p. 450}."
  ur: "عمالیق بن لحد کی اولاد جنہوں نے حرم کی سرحدوں اور تہامہ کو آباد کیا - کچھ مصر اور مغرب کی طرف دباؤ ڈالتے ہیں جہاں ایک رپورٹ انہیں مصر کے فرعونوں میں سے کچھ بناتی ہے، دوسری نے انہیں عیسو سے اخذ کیا ہے - ان کے باقیات بعد میں روم کے ذریعہ مشرقی شام، مغرب اور جزیرہ پر متعین کیے گئے تھے، ان میں سے عدہ الصائب الصائب۔ آیت {حوالہ: مروج الذھب صفحہ 1۔ 450}۔"
  tr: "Nuh'un oğlu Şem'in oğlu Aram'ın oğlu Lawdh'ın oğlu olan bir dev, soyundan gelenlerle birlikte seyahat ederek kutsal alanın ve kıyı ovalarının çevresine yerleşti. Bazıları Mısır ve Mağrip'e gitti. Bunların Mısır firavunlarından bazıları olduğu, ayrıca İbrahim'in oğlu İshak'ın oğlu Esau'nun soyundan geldikleri de söylenir. Levant'ta ve başka yerlerde birçok kralları vardı ve geri kalanları, onlara doğu ve batı Levant ile Cezire üzerinde egemenlik veren Romalı krallara katıldı. Bunlar arasında, el-A'şa'nın \"Adhina krallığından uzaklaştırıldı\" sözünde bahsettiği Adhina ibn al-Sumayda' da vardı. El-Baladhuri'ye göre, önce Yemen'in Sana'a şehrine yerleştiler, sonra Yathrib'e taşınarak oraya yerleştiler. Yathrib, liderleri Yathrib'in adından dolayı bu ismi almıştır. Daha sonra Levant'taki Filistin bölgesine geçtiler ve yolculukları Mısır ve Afrika bölgesine doğru devam etti ve Mağrip'e dağıldılar. El-Baladhuri'ye göre Berberler onlardan gelmektedir (kaynak: ansab-al-ashraf, s. 7-8)."
  id: "Seorang raksasa, putra Lawdh, putra Aram, putra Sem, putra Nuh, melakukan perjalanan bersama keturunannya dan menetap di sekitar tempat suci dan dataran pantai. Beberapa dari mereka melakukan perjalanan ke Mesir dan Maghreb. Dikatakan bahwa mereka adalah beberapa Firaun Mesir, dan juga dikatakan bahwa mereka adalah keturunan Esau, putra Ishak, putra Ibrahim. Mereka memiliki banyak raja di Levant dan tempat lain, dan sisanya bergabung dengan raja-raja Romawi, yang memberi mereka kekuasaan atas Levant timur dan barat serta Jazira. Di antara mereka adalah Adhina ibn al-Sumayda’, yang disebutkan oleh al-A’sha dalam ucapannya, “Adhina dicopot dari kerajaannya” {kutip:muruj-al-dhahab hlm. 450}. Menurut al-Baladhuri, mereka pertama kali menetap di Sana’a, Yaman, kemudian pindah ke Yathrib dan menetap di sana. Yathrib dinamai menurut pemimpin mereka, yang bernama Yathrib. Kemudian mereka pindah ke wilayah Palestina di Levant, dan perjalanan mereka berlanjut ke Mesir dan wilayah Afrika, dan mereka menyebar di Maghreb. Suku Berber termasuk di antara mereka, menurut al-Baladhuri {cite:ansab-al-ashraf pp. 7-8}."
