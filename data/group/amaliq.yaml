label: { ar: "العماليق", en: "The Amalekites" }
summary:
  ar: "عملاق بن لاوذ بن إرم بن سام بن نوح سار بولده فنزلوا أكناف الحرم والتهائم ومنهم من سار إلى مصر والمغرب وقيل إنهم بعض فراعنة مصر، وقيل هم من ولد العيص بن إسحاق بن إبراهيم، وكانت لهم ملوك كثيرة بالشام وغيره وبقيتهم انضافوا إلى ملوك الروم فملكتهم على مشارق الشام والغرب والجزيرة، ومنهم أذينة بن السميدع الذي ذكره الأعشى بقوله أزال أذينة عن ملكه {cite:muruj-al-dhahab p. 450}."
  en: "Descendants of 'Amaliq ibn Lawdh who settled the sanctuary's borders and Tihama — some pressing on to Egypt and the Maghrib where one report makes them some of Egypt's pharaohs, another deriving them from Esau — their remnant later set by Rome over east Syria, the west and the Jazira, among them Udhayna ibn al-Sumayda' of al-A'sha's verse {cite:muruj-al-dhahab p. 450}."
