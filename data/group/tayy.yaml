summary:
  ar: "قبيلة من بطون كهلان القحطانية؛ سارت بعد الأزد نحو الشمال فنزلت الجبلين أجأ وسلمى حتى عُرفا بجبلي طيء، واعتنق بعضها النصرانية لمجاورة الروم، ومنها إياس بن قبيصة الذي ولاه كسرى الحيرة."
  en: "A Kahlani tribe of Qahtan that moved north after al-Azd and settled the two mountains Aja and Salma, which became known as the mountains of Tayy; parts of it adopted Christianity, and its Iyas ibn Qabisa governed al-Hira for Khosrow."
