summary:
  ar: "قبيلة من بطون كهلان القحطانية؛ سارت بعد الأزد نحو الشمال فنزلت الجبلين أجأ وسلمى حتى عُرفا بجبلي طيء، واعتنق بعضها النصرانية لمجاورة الروم، ومنها إياس بن قبيصة الذي ولاه كسرى الحيرة."
  en: "A Kahlani tribe of Qahtan that moved north after al-Azd and settled the two mountains Aja and Salma, which became known as the mountains of Tayy; parts of it adopted Christianity, and its Iyas ibn Qabisa governed al-Hira for Khosrow."
  es: "Una tribu kahlani de Qahtan que se trasladó al norte tras la caída de al-Azd y se asentó en las dos montañas de Aja y Salma, que llegaron a ser conocidas como las montañas de Tayy; parte de ella adoptó el cristianismo, y su Iyas ibn Qabisa gobernó al-Hira para Khosrow."
  fr: "Une tribu Kahlani de Qahtan qui s'est déplacée vers le nord après al-Azd et s'est installée sur les deux montagnes Aja et Salma, qui sont devenues connues sous le nom de montagnes de Tayy; une partie d'elle a adopté le christianisme, et son Iyas ibn Qabisa a gouverné al-Hira pour Khosrow."
  ur: "قحطان کا ایک کہلانی قبیلہ جو العزد کے بعد شمال کی طرف منتقل ہوا اور دو پہاڑوں اجہ اور سلمہ کو آباد کیا جو طی کے پہاڑوں کے نام سے مشہور ہوئے۔ اس کے کچھ حصوں نے عیسائیت اختیار کی، اور اس کے ایاس بن قبیصہ نے خسرو کے لیے الحیرہ پر حکومت کی۔"
  tr: "Kahlan al-Qahtaniyya'nın kollarından bir kabile; Azd'dan sonra kuzeye göç ederek Aja ve Salma dağlarına yerleştiler ve buralar Tayy dağları olarak tanındı. Bazıları Romalılara yakınlıkları nedeniyle Hristiyanlığı benimsedi ve aralarında Kisra'nın Hira valisi olarak atadığı İyas ibn Qubaysa da vardı."
  id: "Sebuah suku dari cabang Kahlan al-Qahtaniyya; mereka pindah ke utara setelah Azd dan menetap di dua gunung, Aja dan Salma, hingga kemudian dikenal sebagai pegunungan Tayy. Beberapa dari mereka memeluk agama Kristen karena kedekatan mereka dengan bangsa Romawi, dan di antara mereka adalah Iyas ibn Qubaysa, yang diangkat Kisra menjadi gubernur Hira."
