summary:
  ar: "قبيلة نازعة إلى اليمن، وعند المسعودي أن بجيلة وخثعم من ولد أنمار بن نزار بن معد على ما قيل، إذ فيهم تنازع فمن الناس من ألحقهم باليمن ومنهم من جعلهم من ولد أنمار الذي هاجر إلى اليمن بعد فقعه عين أخيه مضر {cite:muruj-al-dhahab p. 431}."
  en: "A tribe claimed by one report among the sons of Anmar ibn Nizar after his flight to Yemen — though others attach them to the Yemeni stock outright {cite:muruj-al-dhahab p. 431}."
  es: "Una tribu que, según un informe, se encuentra entre los hijos de Anmar ibn Nizar después de su huida a Yemen, aunque otros los vinculan directamente con el linaje yemení {cite:muruj-al-dhahab p. 431}."
  fr: "Une tribu revendiquée par un rapport parmi les fils d'Anmar ibn Nizar après sa fuite au Yémen — bien que d'autres les rattachent directement à la souche yéménite {cite:muruj-al-dhahab p. 431}."
  ur: "ایک قبیلہ کا دعویٰ انمار بن نزار کے بیٹوں میں سے ایک رپورٹ کے ذریعے ان کی یمن کے لیے پرواز کے بعد کیا گیا تھا - حالانکہ دوسرے انہیں یمنی اسٹاک سے جوڑ دیتے ہیں {حوالہ: مروج الذہب ص۔ 431}۔"
  tr: "Yemen'e meyilli bir kabile olup, El-Mas'udi'ye göre Bajila ve Khath'am, Anmar bin Nizar bin Ma'ad'ın soyundan gelmektedir; zira aralarında ihtilaf bulunmaktadır, bazıları onları Yemen'e bağlarken, bazıları da kardeşi Mudar'ı kör ettikten sonra Yemen'e göç eden Anmar'ın soyundan olduklarını iddia etmektedir. {kaynak: Muruj-al-Dhahab s. 431}"
  id: "Suku yang condong ke Yaman, dan menurut Al-Mas’udi, Bajila dan Khath’am adalah keturunan Anmar bin Nizar bin Ma’ad, sebagaimana dikatakan, karena ada perselisihan di antara mereka, karena sebagian orang mengaitkan mereka dengan Yaman dan sebagian lagi menganggap mereka sebagai keturunan Anmar yang berhijrah ke Yaman setelah ia membutakan saudaranya Mudar {kutip:muruj-al-dhahab hlm. 431}."
