  - tradition: sufi
    id: hujwiri-three-kinds
    standing: secondary
    stance:
      ar: "رأي الهجويري الصوفي: الملامة نافعة في خلوص المحبة، ومنها مشروع ومنها مذموم"
      en: "Al-Hujwiri's Sufi view: blame serves the purity of love; some kinds are sound and one is condemned"
      ur: "ہجویری کی صوفی رائے: ملامت محبت کے خلوص میں نافع ہے؛ اس کی بعض قسمیں درست اور ایک مذموم ہے"
    summary:
      ar: "يرى الهجويري أن ملامة الخلق غذاء لأحباب الحق لأنها تحفظهم من العجب، ويقسم الملامة إلى ملامة استقامة السير، وملامة القصد بترك الجاه، وملامة الترك وهي أن يترك صاحبها الشريعة ويسمي ذلك ملامة، ويجعل هذه الأخيرة من الكفر والضلال؛ وتنقل المترجمة أن السلمي أشاد بهم، وأن ابن عربي وضعهم في أعلى درجات السالكين، وأن السهروردي وقف منهم موقفاً وسطاً."
      en: "Al-Hujwiri holds that people's blame nourishes God's lovers because it guards them from self-admiration, and divides blame into the blame of right conduct, deliberate blame by renouncing rank, and the blame of abandonment, in which a man abandons the law and calls it blame — this last he treats as unbelief and error; the translator reports that al-Sulami praised them, Ibn 'Arabi put them at the highest degree of travellers, and al-Suhrawardi took a middle position."
      ur: "ہجویری کے نزدیک لوگوں کی ملامت اللہ کے محبوں کی غذا ہے کیونکہ وہ انہیں خود پسندی سے بچاتی ہے؛ وہ ملامت کو استقامتِ سیر کی ملامت، جاہ ترک کرنے والی ملامتِ قصد، اور ملامتِ ترک میں تقسیم کرتے ہیں — جس میں آدمی شریعت چھوڑ کر اسے ملامت کہے — اور اس آخری کو کفر و گمراہی قرار دیتے ہیں؛ مترجمہ نقل کرتی ہیں کہ سلمی نے ان کی تعریف کی، ابن عربی نے انہیں سالکوں کے اعلیٰ درجے میں رکھا، اور سہروردی نے درمیانی موقف اختیار کیا۔"
