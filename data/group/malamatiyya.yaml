summary:
  ar: "أهل الملامة أو الملامتية: طائفة من الصوفية ظهرت بنيسابور في النصف الثاني من القرن الثالث، يقول القشيري إن مذهبها انتشر من حمدون القصار، ويقول الهجويري إن للملامة في خلوص المحبة تأثيراً عظيماً ويقسمها إلى ملامة استقامة السير وملامة القصد وملامة الترك؛ وانتقدها ابن الجوزي فيما ينقله مترجم كشف المحجوب {cite:kashf-al-mahjub-qandil-2007-v1 p. 262} {cite:kashf-al-mahjub-qandil-2007-v1 p. 264} {cite:risala-qushayriyya-minhaj-2017 p. 152}."
  en: "The People of Blame (Malamatiyya): a Sufi group that appeared in Nishapur in the second half of the third century AH; al-Qushayri says its way spread from Hamdun al-Qassar, and al-Hujwiri says blame has a great effect on the purity of love and divides it into the blame of right conduct, deliberate blame and the blame of abandonment; Ibn al-Jawzi criticised them, as the translator of Kashf al-Mahjub reports {cite:kashf-al-mahjub-qandil-2007-v1 p. 262} {cite:kashf-al-mahjub-qandil-2007-v1 p. 264} {cite:risala-qushayriyya-minhaj-2017 p. 152}."
  ur: "اہلِ ملامت یا ملامتیہ: صوفیہ کا ایک گروہ جو تیسری صدی ہجری کے نصفِ آخر میں نیشاپور میں ظاہر ہوا؛ قشیری کہتے ہیں کہ ان کا مسلک حمدون قصار سے پھیلا، اور ہجویری کہتے ہیں کہ محبت کے خلوص میں ملامت کا بڑا اثر ہے اور اسے استقامتِ سیر، قصد اور ترک کی ملامت میں تقسیم کرتے ہیں؛ ابن الجوزی نے ان پر تنقید کی، جیسا کہ کشف المحجوب کی مترجمہ نقل کرتی ہیں {cite:kashf-al-mahjub-qandil-2007-v1 p. 262} {cite:kashf-al-mahjub-qandil-2007-v1 p. 264} {cite:risala-qushayriyya-minhaj-2017 p. 152}۔"
