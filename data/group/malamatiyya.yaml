issue:
  ar: "هل طريق الملامة، أي إظهار ما يستوجب لوم الناس وكتمان المحاسن، مشروع؟"
  en: "Is the way of blame — displaying what earns people's censure and hiding one's virtues — legitimate?"
  ur: "کیا ملامت کا طریقہ — لوگوں کی ملامت کا موجب کام ظاہر کرنا اور خوبیاں چھپانا — جائز ہے؟"
