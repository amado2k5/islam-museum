    stance:
      ar: "نقد ابن الجوزي: أسقطوا جاههم عند الناس بما لا يجوز، كما تنقله المترجمة"
      en: "Ibn al-Jawzi's critique: they threw away their standing with people by impermissible means, as the translator reports"
      ur: "ابن الجوزی کی تنقید: انہوں نے ناجائز طریقوں سے لوگوں میں اپنا وقار گرایا، جیسا کہ مترجمہ نقل کرتی ہیں"
    summary:
      ar: "تذكر مترجمة كشف المحجوب في حاشيتها أن الملامتية تعرضوا لنقد ابن الجوزي في تلبيس إبليس، فوصفهم بأنهم أسقطوا جاههم عند الناس."
      en: "The translator of Kashf al-Mahjub notes that the Malamatiyya were criticised by Ibn al-Jawzi in Talbis Iblis, who described them as having thrown away their standing with people."
      ur: "کشف المحجوب کی مترجمہ اپنے حاشیے میں بتاتی ہیں کہ ملامتیہ پر ابن الجوزی نے تلبیس ابلیس میں تنقید کی اور انہیں لوگوں میں اپنا وقار گرانے والا بتایا۔"
    holders: [person/ibn-al-jawzi]
