label: { ar: "السيايجة", en: "the Sayabija", es: "el Sayabija", fr: "le Sayabija", ur: "سیابیجا", tr: "Turizm", id: "Pariwisata" }
summary:
  ar: "السيايجة قوم كانوا في جند الفرس ممن سباه من أهل السند فلما سمعوا بأمر الأساورة أسلموا وأتوا أبا موسى فأنزلهم البصرة في بني حنظلة وكانت جماعة منهم موكلين ببيت مال البصرة يقال أربعون ويقال أربعمائة."
  en: "The Sayabija — Sindhi captives of the Persian jund who, hearing the asawira's story, converted and were lodged by Abu Musa in Banu Hanzala at Basra; a body of them, forty or four hundred, stood watch over Basra's treasury."
  es: "Los Sayabija — cautivos sindhis del jund persa que, al oír la historia del asawira, se convirtieron y fueron alojados por Abu Musa en Banu Hanzala en Basora; un grupo de ellos, de cuarenta o cuatrocientos, custodiaba el tesoro de Basora."
  fr: "Les Sayabija — captifs sindhis du jund persan qui, ayant entendu l'histoire de l'asawira, se convertirent et furent logés par Abu Musa à Banu Hanzala à Bassora; un groupe d'entre eux, quarante ou quatre cents, veillait sur le trésor de Bassora."
  ur: "سیابیجا - فارسی جنڈ کے سندھی اسیر جنہوں نے اساویرہ کی کہانی سن کر مذہب تبدیل کیا اور ابو موسیٰ نے بصرہ میں بنو حنظلہ میں رکھا۔ ان میں سے چالیس یا چار سو افراد بصرہ کے خزانے پر نظر رکھے ہوئے تھے۔"
  tr: "Seyyiceler, Sind halkından esir alınmış Pers ordusunda bulunan bir topluluktu. Asavire'yi duyduklarında İslam'ı kabul edip Ebu Musa'ya geldiler ve Ebu Musa onları Basra'da Beni Hanzalah kabilesi arasına yerleştirdi. Onlardan bir grup Basra hazinesinin sorumluluğunu üstlenmişti ve sayıları kırk ya da dört yüz kadar olduğu söylenir."
  id: "Sayyijah adalah kaum yang tergabung dalam tentara Persia, yang ditawan dari penduduk Sindh. Ketika mereka mendengar tentang kaum Asawirah, mereka masuk Islam dan datang kepada Abu Musa, yang kemudian menempatkan mereka di Basra di antara Bani Hanzalah. Sekelompok dari mereka bertanggung jawab atas perbendaharaan Basra, dan konon jumlah mereka mencapai empat puluh atau empat ratus orang."
