summary:
  ar: "السيايجة قوم كانوا في جند الفرس ممن سباه من أهل السند فلما سمعوا بأمر الأساورة أسلموا وأتوا أبا موسى فأنزلهم البصرة في بني حنظلة وكانت جماعة منهم موكلين ببيت مال البصرة يقال أربعون ويقال أربعمائة."
  en: "The Sayabija — Sindhi captives of the Persian jund who, hearing the asawira's story, converted and were lodged by Abu Musa in Banu Hanzala at Basra; a body of them, forty or four hundred, stood watch over Basra's treasury."
  es: "Los Sayabija — cautivos sindhis del jund persa que, al oír la historia del asawira, se convirtieron y fueron alojados por Abu Musa en Banu Hanzala en Basora; un grupo de ellos, de cuarenta o cuatrocientos, custodiaba el tesoro de Basora."
  fr: "Les Sayabija — captifs sindhis du jund persan qui, ayant entendu l'histoire de l'asawira, se convertirent et furent logés par Abu Musa à Banu Hanzala à Bassora; un groupe d'entre eux, quarante ou quatre cents, veillait sur le trésor de Bassora."
