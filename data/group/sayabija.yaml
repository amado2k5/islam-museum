  ar: "السيايجة قوم كانوا في جند الفرس ممن سباه من أهل السند فلما سمعوا بأمر الأساورة أسلموا وأتوا أبا موسى فأنزلهم البصرة في بني حنظلة وكانت جماعة منهم موكلين ببيت مال البصرة يقال أربعون ويقال أربعمائة."
  en: "The Sayabija — Sindhi captives of the Persian jund who, hearing the asawira's story, converted and were lodged by Abu Musa in Banu Hanzala at Basra; a body of them, forty or four hundred, stood watch over Basra's treasury."
