summary:
  ar: "فرقة أمريكية من منطقة واشنطن، تجمع الهيب هوب وآر أند بي بكلمات تقوم على الإسلام، أعضاؤها جوشوا سلام ونعيم محمد وعبد الملك أحمد، التقوا عبر منظمة شباب المسلمين في أمريكا الشمالية؛ لا تستعمل آلات النفخ والأوتار والمعدن، ولها ثلاثة ألبومات بين 2005 و2011."
  en: "An American group from the Washington, D.C. area that joins hip-hop and R&B to lyrics grounded in Islam; its members Joshua Salaam, Naeem Muhammad and Abdul-Malik Ahmad met through Muslim Youth of North America, it uses no wind, string or metal instruments, and it released three albums between 2005 and 2011."
  ur: "واشنگٹن ڈی سی کے علاقے کا امریکی گروپ جو ہپ ہاپ اور آر اینڈ بی کو اسلام پر مبنی بولوں سے جوڑتا ہے؛ اس کے ارکان جوشوا سلام، نعیم محمد اور عبدالملک احمد مسلم یوتھ آف نارتھ امریکہ کے ذریعے ملے، اور اس نے 2005 سے 2011 کے درمیان تین البم جاری کیے۔"
