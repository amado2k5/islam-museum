summary:
  ar: "بطن من بكر بن وائل بن قاسط، أهل الفوارس والأيام في الجاهلية؛ منه الحارث بن عوف المرّي صاحب حلف داحس والغبراء، ومنهم عمارية في الفتوح {cite:tarikh-al-tabari}."
  en: "A batn of Bakr ibn Wa'il — the horsemen of the Jahiliyya wars; from it al-Harith ibn Awf al-Murri of the Dahis and al-Ghabra feud, with a share in the conquests {cite:tarikh-al-tabari}."
  ur: "بکر بن وائل کا بطن یشکر — جاہلی جنگوں کے سوار، داحس و غبراء کے حارث بن عوف مری اسی خاندان سے۔"
  es: "Un batallón de Bakr ibn Wa'il — los jinetes de las guerras de la Jahiliyya; de él al-Harith ibn Awf al-Murri de la disputa de Dahis y al-Ghabra, con una participación en las conquistas {cite:tarikh-al-tabari}."
  fr: "Une batn de Bakr ibn Wa'il — les cavaliers des guerres Jahiliyya; de là est al-Harith ibn Awf al-Murri de la querelle Dahis et al-Ghabra, avec une part dans les conquêtes {cite:tarikh-al-tabari}."
  tr: "Bakr ibn Wael ibn Qasit'in bir kolu olan bu topluluk, İslam öncesi dönemde atlı birlikleri ve savaşlarıyla tanınan bir halktı; onlardan Dahis ve Al-Ghabra ittifakının sahibi Al-Harith ibn Awf Al-Murri ve fetihlerde yer alan Ammariyah da vardı. {Kaynak:tarikh-al-tabari}"
  id: "Cabang dari Bakr ibn Wael ibn Qasit, kaum penunggang kuda dan pejuang di era pra-Islam; dari mereka adalah Al-Harith ibn Awf Al-Murri, pemilik aliansi Dahis dan Al-Ghabra, dan dari mereka adalah kaum Ammariyah dalam penaklukan {cite:tarikh-al-tabari}."
