id: group/banu-rabia-hamdan
class: group
kind: tribe
label:
  ar: بنو ربيعة من همدان
  en: Banu Rabi'a (of Hamdan)
  ur: بنو ربیعہ ہمدان کے
  es: "Banu Rabi'a (de Hamdan)"
  fr: "Banu Rabi'a (de Hamdan)"
  tr: "Hamdan'dan Banu Rabi'ah"
  id: "Banu Rabi'ah dari Hamdan"
summary:
  ar: قبيلة من همدان بايعت الهادي، وفي بلدها مواضع نزل بها الهادي هي الحصن والدرب وكراوي، وشاركت في حرب أثافت سنة 285هـ؛ ولا صلة لها بربيعة بن نزار.
  en: A tribe of Hamdan that pledged to al-Hadi, in whose lands al-Hadi camped (al-Hisn, al-Darb, Karawi) and which fought at Athafit in 285 AH; it has no link to Rabi'a ibn Nizar.
  ur: ہمدان کا ایک قبیلہ جس نے ہادی سے بیعت کی، جس کی سرزمین میں ہادی نے پڑاؤ ڈالا، الحصن، الدرب اور کراوی، اور جس نے 285ھ میں اثافت کی جنگ میں حصہ لیا؛ ربیعہ بن نزار سے اس کا کوئی تعلق نہیں۔
  es: "Una tribu de Hamdan que juró lealtad a al-Hadi, en cuyas tierras acampó al-Hadi (al-Hisn, al-Darb, Karawi) y que luchó en Athafit en el año 285 de la Hégira; no tiene ningún vínculo con Rabi'a ibn Nizar."
  fr: "Une tribu de Hamdan qui a fait allégeance à al-Hadi, sur les terres de laquelle al-Hadi a campé (al-Hisn, al-Darb, Karawi) et qui a combattu à Athafit en 285 AH; elle n'a aucun lien avec Rabi'a ibn Nizar."
  tr: "Hamdan'dan olup Al-Hadi'ye biat eden bir kabile. Ülkelerinde Al-Hadi'nin kaldığı yerler, yani Al-Hisn, Al-Darb ve Karawi bulunmaktadır. Hicri 285 yılında Athaft savaşında yer almışlardır. Rabi'ah bin Nizar ile hiçbir bağlantıları yoktur."
  id: "Sebuah suku dari Hamdan yang menyatakan kesetiaan kepada Al-Hadi. Di wilayah mereka terdapat tempat-tempat yang pernah ditinggali Al-Hadi, yaitu Al-Hisn, Al-Darb, dan Karawi. Mereka ikut serta dalam perang Athaft pada tahun 285 Hijriah. Mereka tidak memiliki hubungan dengan Rabi’ah bin Nizar."
