label:
  ar: بنو ربيعة من همدان
  en: Banu Rabi'a (of Hamdan)
  ur: بنو ربیعہ ہمدان کے
summary:
  ar: قبيلة من همدان بايعت الهادي، وفي بلدها مواضع نزل بها الهادي هي الحصن والدرب وكراوي، وشاركت في حرب أثافت سنة 285هـ؛ ولا صلة لها بربيعة بن نزار.
  en: A tribe of Hamdan that pledged to al-Hadi, in whose lands al-Hadi camped (al-Hisn, al-Darb, Karawi) and which fought at Athafit in 285 AH; it has no link to Rabi'a ibn Nizar.
  ur: ہمدان کا ایک قبیلہ جس نے ہادی سے بیعت کی، جس کی سرزمین میں ہادی نے پڑاؤ ڈالا، الحصن، الدرب اور کراوی، اور جس نے 285ھ میں اثافت کی جنگ میں حصہ لیا؛ ربیعہ بن نزار سے اس کا کوئی تعلق نہیں۔
