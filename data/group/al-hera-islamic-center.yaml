  ar: "عملية إعلامية بنغلاديشية بصيغة مركز إسلامي، تنشر على يوتيوب محافل الوعظ وخطب علماء كثيرين وتلاوات قرآنية؛ بلغ عدد مشتركي قناتها (@alheraislamiccenter) نحو 4.94 ملايين بحسب عدّاد vidIQ المقروء في 7 نوفمبر 2026، ولم يُحدَّد لها مدير أو مشغّل مسمّى في هذا المسح."
  en: "A Bangladeshi Islamic-center-style media operation publishing waz mahfil videos, speeches by many scholars and Qur'an recitation on YouTube; its channel (@alheraislamiccenter) counted about 4.94 million subscribers by vidIQ's count read on 7 November 2026, and no named head or operator for it was identified in this pass."
  ur: "الہرا اسلامک سینٹر بنگلہ دیش کا ایک اسلامی مرکز نما میڈیا ادارہ ہے جو یوٹیوب پر وعظ محافل، بہت سے علماء کی تقاریر اور تلاوتِ قرآن شائع کرتا ہے؛ اس کے سبسکرائبرز کی تعداد 7 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 4.94 ملین تھی، اور اس جائزے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہوا۔"
