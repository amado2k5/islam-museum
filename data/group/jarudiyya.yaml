summary:
  ar: "فرقة من الزيدية ذهب أكثرها إلى أن الإمامة لا تجوز إلا في قريش مع أبي حنيفة وأكثر المرجئة وسائر فرق الشيعة والرافضة والراوندية {cite:muruj-al-dhahab p. 210}."
  en: "The Zaydi sect holding with Abu Hanifa, most Murji'a and the Rafidi wings that the imamate is Quraysh's alone {cite:muruj-al-dhahab p. 210}."
  es: "La secta Zaydi sostiene, junto con Abu Hanifa, la mayoría de los Murji'a y las alas Rafidi, que el imamato pertenece solo a los Quraysh {cite:muruj-al-dhahab p. 210}."
  fr: "La secte Zaydi, avec Abu Hanifa, la plupart des Murji'a et les ailes Rafidi, soutient que l'imamat est uniquement celui des Quraysh {cite:muruj-al-dhahab p. 210}."
  ur: "زیدی فرقہ جس میں ابو حنیفہ، زیادہ تر مرجع اور رافدی فرقے ہیں کہ امامت صرف قریش کی ہے۔ 210}۔"
  tr: "Zeydilerden oluşan bir grup, çoğunluğu İmamlığın yalnızca Kureyş'te caiz olduğuna inanıyordu; bu gruba Ebu Hanife, Murci'ye'nin çoğu ve diğer tüm Şii, Rafizi ve Ravandi gruplar da dahildi. {cite:muruj-al-dhahab s. 210}"
  id: "Sekelompok Zaidi, yang sebagian besar meyakini bahwa Imamah hanya diperbolehkan di kalangan Quraisy, bersama dengan Abu Hanifa, sebagian besar Murji'ah, dan semua kelompok Syiah, Rafidiyah, dan Rawandi lainnya. {cite:muruj-al-dhahab p. 210}"
