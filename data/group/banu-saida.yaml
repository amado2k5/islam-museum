label: { ar: "بنو ساعدة", en: "Banu Sa'ida", es: "Banu Sa'ida", fr: "Banu Sa'ida", ur: "بنو ساعدہ", tr: "Banu Sa'ida", id: "Banu Sa'ida" }
summary:
  ar: "بطن من الخزرج، بنو ساعدة بن كعب بن الخزرج الأكبر، أصحاب السقيفة المشهورة؛ تفرقوا في أربع منازل بالمدينة: بنو الحارث وبنو ثعلبة بين السوق وبني ضمرة شرقي السوق مما يلي الشام، وقرية عند بئر بضاعة وسط بيوتهم، وبنو أبي خزيمة — رهط سعد بن عبادة — بجرار سعد حيث تقع سقيفتهم في ترجيح السمهودي، وبنو وقش وبنو عنان بدار «بني طريف» بين الماضة وجرار سعد. ابتنوا أطم «معرث» وهو آخر أطم بُني بالمدينة — قدم النبي وهم يبنونه فاستأذنوه في إتمامه فأذن لهم {cite:samhudi-wafa-al-wafa p. 220-222}. وهم الرابعة في دور الأنصار في فضل الصحيح {cite:sahih-al-bukhari 3807}."
  en: "A clan of the Khazraj, Banu Sa'ida ibn Ka'b, owners of the famous saqifa; they settled in four Medinan quarters: Banu al-Harith and Banu Tha'laba between the market and Banu Damra; a village around Bi'r Buda'a; Banu Abi Khazima — Sa'd ibn Ubada's sept — at Jirar Sa'd, where al-Samhudi places their saqifa; and Banu Waqf and Banu Annan in the 'Banu Tarif' quarter. They built the utm 'Mu'rith', the last tower built in Medina — the Prophet arrived while they were building it and gave them leave to finish {cite:samhudi-wafa-al-wafa p. 220-222}."
  es: "Un clan de los Khazraj, Banu Sa'ida ibn Ka'b, propietarios de la famosa saqifa, se establecieron en cuatro barrios de Medina: Banu al-Harith y Banu Tha'laba, entre el mercado y Banu Damra; una aldea cerca de Bi'r Buda'a; Banu Abi Khazima —el clan de Sa'd ibn Ubada— en Jirar Sa'd, donde al-Samhudi sitúa su saqifa; y Banu Waqf y Banu Annan en el barrio de Banu Tarif. Construyeron el utm Mu'rith, la última torre construida en Medina. El Profeta llegó mientras la construían y les dio permiso para terminarla {cite:samhudi-wafa-al-wafa p. 220-222}."
  fr: "Un clan khazraj, les Banu Sa'ida ibn Ka'b, propriétaires de la célèbre saqifa, s'établit dans quatre quartiers de Médine: les Banu al-Harith et Banu Tha'laba, entre le marché et Banu Damra; un village près de Bi'r Buda'a; les Banu Abi Khazima — le clan de Sa'd ibn Ubada — à Jirar Sa'd, où al-Samhudi situe leur saqifa; et les Banu Waqf et Banu Annan dans le quartier des Banu Tarif. Ils construisirent l'utm Mu'rith, la dernière tour édifiée à Médine — le Prophète arriva pendant sa construction et leur donna la permission de l'achever (voir: Samhudi-Wafa-Al-Wafa, p. 220-222)."
  ur: "خزرج کا ایک قبیلہ، بنو سعیدہ بن کعب، مشہور سقیفہ کے مالک؛ وہ مدینہ کے چار حلقوں میں آباد ہوئے: بنو الحارث اور بنو ثعلبہ بازار اور بنو دمرہ کے درمیان۔ بائر بدعہ کے ارد گرد ایک گاؤں؛ بنو ابی خزیمہ — سعد بن عبادہ کا ستمبر — جرار سعد میں، جہاں سمہدی اپنا سقیفہ رکھتا ہے۔ اور بنو وقف اور بنو عنان 'بنو طارق' سہ ماہی میں۔ انہوں نے امت 'مریث' بنایا، جو مدینہ میں بنایا گیا آخری مینار تھا - جب وہ اسے بنا رہے تھے تو نبی تشریف لائے اور انہیں ختم کرنے کی اجازت دے دی۔ 220-222}۔"
  tr: "Hazrec kabilesinin bir kolu olan Beni Sa'idah ibn Ka'b ibn al-Khazraj al-Akbar, ünlü Sakifa halkı, Medine'de dört mahalleye dağıldı: Çarşı arasında Beni al-Harith ve Beni Tha'labah; çarşının doğusunda, Levant'a doğru Beni Damrah ve Bida'ah kuyusunun yakınındaki bir köy; Sa'd ibn 'Ubadah kabilesi olan Beni Abi Huzeyme, Sakifalarının bulunduğu Cerar Sa'd'da (el-Samhudi'nin tercihine göre); ve Beni Tarif'in evinde, el-Madha ile Cerar Sa'd arasında Beni Waqsh ve Beni 'Anan. Medine'de inşa edilen son müstahkem yapı olan Ma'rath'ı inşa ettiler. Peygamberimiz inşaat sırasında geldi ve tamamlamak için izin istediler, o da izin verdi. {cite:samhudi-wafa-al-wafa s. 220-222}. Bunlar, Sahih'te (hadis külliyatında) erdemler konusunda Ensar evleri listesinde dördüncü sırada yer alırlar. {alıntı: Sahih-i Buhari 3807}."
  id: "Sebuah cabang dari Khazraj, Banu Sa'idah ibn Ka'b ibn al-Khazraj al-Akbar, orang-orang dari Saqifah yang terkenal, tersebar ke empat wilayah di Madinah: Banu al-Harith dan Banu Tha'labah di antara pasar dan Banu Damrah di sebelah timur pasar menuju Levant, dan sebuah desa dekat sumur Bida'ah di tengah-tengah tempat tinggal mereka; Banu Abi Khuzaymah—klan Sa'd ibn 'Ubadah—di Jarar Sa'd, tempat Saqifah mereka berada sesuai dengan pilihan al-Samhudi; dan Banu Waqsh dan Banu 'Anan di rumah Banu Tarif antara al-Madha dan Jarar Sa'd. Mereka membangun struktur benteng Ma'rath, struktur benteng terakhir yang dibangun di Madinah. Nabi tiba ketika mereka sedang membangunnya, dan mereka meminta izinnya untuk menyelesaikannya, yang kemudian dikabulkan oleh beliau. {cite:samhudi-wafa-al-wafa p. 220-222}. Mereka adalah yang keempat dalam daftar keluarga Ansar dalam Sahih (kumpulan hadits) tentang keutamaan. {cite:sahih-al-bukhari 3807}."
