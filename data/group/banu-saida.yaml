label: { ar: "بنو ساعدة", en: "Banu Sa'ida" }
summary:
  ar: "بطن من الخزرج، بنو ساعدة بن كعب بن الخزرج الأكبر، أصحاب السقيفة المشهورة؛ تفرقوا في أربع منازل بالمدينة: بنو الحارث وبنو ثعلبة بين السوق وبني ضمرة شرقي السوق مما يلي الشام، وقرية عند بئر بضاعة وسط بيوتهم، وبنو أبي خزيمة — رهط سعد بن عبادة — بجرار سعد حيث تقع سقيفتهم في ترجيح السمهودي، وبنو وقش وبنو عنان بدار «بني طريف» بين الماضة وجرار سعد. ابتنوا أطم «معرث» وهو آخر أطم بُني بالمدينة — قدم النبي وهم يبنونه فاستأذنوه في إتمامه فأذن لهم {cite:samhudi-wafa-al-wafa p. 220-222}."
  en: "A clan of the Khazraj, Banu Sa'ida ibn Ka'b, owners of the famous saqifa; they settled in four Medinan quarters: Banu al-Harith and Banu Tha'laba between the market and Banu Damra; a village around Bi'r Buda'a; Banu Abi Khazima — Sa'd ibn Ubada's sept — at Jirar Sa'd, where al-Samhudi places their saqifa; and Banu Waqf and Banu Annan in the 'Banu Tarif' quarter. They built the utm 'Mu'rith', the last tower built in Medina — the Prophet arrived while they were building it and gave them leave to finish {cite:samhudi-wafa-al-wafa p. 220-222}."
