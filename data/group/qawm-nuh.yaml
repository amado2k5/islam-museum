summary:
  ar: "قوم نوح في القرآن أول أمة كذبت رسولها من الأمم التي قص الله خبرها: دعاهم نوح ألف سنة إلا خمسين عاماً فكذبوه وأهلكهم الطوفان وأنجاه الله ومن آمن به في الفلك؛ القرآن يجعل خبرهم أسوة لمن بعدهم في سور هود والمؤمنون والشعراء والقمر ونوح {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  en: "The people of Nuh in the Qur'an are the first nation to deny its messenger among the peoples whose story God tells: Nuh called them nine hundred and fifty years and they denied him, so the Flood took them and God saved him and the believers in the Ark. The Qur'an makes their account a lesson for later peoples in Suras Hud, al-Mu'minun, al-Shu'ara', al-Qamar and Nuh {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  ur: "قوم نوح قرآن میں پہلی امت ہے جس نے اپنے رسول کو جھٹلایا ان امتوں میں جن کا قصہ خدا نے بیان کیا: نوح نے انہیں ساڑھے نو سو برس پکارا مگر انہوں نے انکار کیا تو طوفان نے ہلاک کیا اور خدا نے نوح اور مومنین کو کشتی میں نجات دی؛ قرآن ان کا قصہ بعد والی امتوں کے لیے عبرت بناتا ہے۔"
