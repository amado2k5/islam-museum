summary:
  ar: "قبيلة من قضاعة؛ عرض عليها النبي الإسلام في الموسم فلم تقبل، وأتى إلى بطن منهم يقال لهم بنو عبد الله فدعاهم."
  en: "A tribe of Qudaa; the Prophet offered them Islam at the season and they did not accept it."
  es: "Una tribu de Qudaa; el Profeta les ofreció el Islam en la época propicia, pero no lo aceptaron."
