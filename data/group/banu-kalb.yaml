  tr: "Kuda'ah kabilesinden bir grup; Peygamberimiz hac mevsiminde onlara İslam'ı teklif etti, ancak onlar kabul etmediler. Bunun üzerine Peygamberimiz, onların Beni Abdullah adındaki bir kabilesine giderek onları davet etti."
  id: "Sebuah suku dari Quda’ah; Nabi menawarkan Islam kepada mereka selama musim haji, tetapi mereka tidak menerimanya. Kemudian beliau pergi ke sebuah klan dari mereka yang bernama Banu Abdullah dan mengajak mereka."
