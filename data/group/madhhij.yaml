summary:
  ar: "قبيلة قحطانية انتسب فيها أبو حارثة بن عمرو بن عامر مزيقياء ودعبل بن كعب بن أبي حارثة حين تخلفا بنجران عن مسير الأزد من مأرب، وقيل إن أبا حارثة جد الحارث بن كعب بن أبي حذيفة الذي بنجران {cite:muruj-al-dhahab p. 498}."
  en: "The Qahtanite tribe into which Abu Haritha ibn Muzayqiya and his grandson Da'bal entered at Najran when they left the Azd's march — Abu Haritha called the grandsire of Najran's al-Harith ibn Ka'b {cite:muruj-al-dhahab p. 498}."
  es: "La tribu Qahtanita a la que Abu Haritha ibn Muzayqiya y su nieto Da'bal entraron en Najran cuando abandonaron la marcha de Azd - Abu Haritha llamó al abuelo de Najran al-Harith ibn Ka'b {cita:muruj-al-dhahab p. 498}."
  fr: "La tribu Qahtanite dans laquelle Abu Haritha ibn Muzayqiya et son petit-fils Da'bal sont entrés à Najran lorsqu'ils ont quitté la marche de l'Azd — Abu Haritha a appelé le grand-père d'al-Harith ibn Ka'b de Najran {cite: muruj-al-dhahab p. 498}."
  ur: "قحطانی قبیلہ جس میں ابو حارثہ بن مزاقیہ اور اس کا پوتا دبل نجران میں داخل ہوئے جب وہ ازد کے مارچ سے نکلے - ابو حارثہ نے نجران کے حارث بن کعب کے پوتے کو کہا۔ 498}۔"
