summary:
  ar: "قبيلة عربية كبيرة أهل اليمامة؛ منها مسيلمة بن حبيب الملقب بالكذاب الذي ادعى النبوة فكاتبها النبي وتبعه أكثر أهلها حتى هزمهم خالد بن الوليد في وقعة اليمامة سنة 12هـ وأدخلهم مجاعة بن مرارة في الصلح فأسلموا وأخذت منهم الصدقة؛ وكانت اليمامة قبل الإسلام لخيرتهم هوذة بن علي الحنفي الذي دعاهم النبي إلى الإسلام."
  en: "A great Arab tribe, the people of al-Yamama; of them was Musaylima ibn Habib, called the Liar, who claimed prophecy — the Prophet addressed a letter to him — and most of them followed him until Khalid ibn al-Walid defeated them at the battle of al-Yamama in 12 AH, whereupon Mujja'a ibn Murara brought them to terms and they embraced Islam and the alms were taken from them; before Islam al-Yamama's chief had been Hawdha ibn Ali al-Hanafi whom the Prophet invited to Islam."
  es: "Una gran tribu árabe, la gente de al-Yamama; entre ellos estaba Musaylima ibn Habib, llamado el Mentiroso, que afirmaba tener profecías —el Profeta le dirigió una carta— y la mayoría de ellos lo siguieron hasta que Khalid ibn al-Walid los derrotó en la batalla de al-Yamama en el año 12 de la Hégira, tras lo cual Mujja'a ibn Murara los convenció y abrazaron el Islam y se les quitaron las limosnas; antes del Islam, el jefe de al-Yamama había sido Hawdha ibn Ali al-Hanafi, a quien el Profeta invitó al Islam."
  fr: "Une grande tribu arabe, les habitants d'al-Yamama; parmi eux se trouvait Musaylima ibn Habib, surnommé le Menteur, qui prétendait détenir la prophétie — le Prophète lui adressa une lettre — et la plupart d'entre eux le suivirent jusqu'à ce que Khalid ibn al-Walid les vainque à la bataille d'al-Yamama en 12 AH, après quoi Mujja'a ibn Murara les amena à négocier et ils embrassèrent l'islam, et les aumônes furent supprimées; avant l'islam, le chef d'al-Yamama était Hawdha ibn Ali al-Hanafi, que le Prophète avait invité à l'islam."
  ur: "ایک عظیم عرب قبیلہ، اہل یمامہ؛ ان میں سے مسیلمہ بن حبیب تھا، جسے جھوٹا کہا جاتا ہے، جس نے نبوت کا دعویٰ کیا تھا - نبی نے اسے ایک خط لکھا تھا - اور ان میں سے اکثر نے ان کی پیروی کی یہاں تک کہ خالد بن ولید نے انہیں 12 ہجری میں یمامہ کی جنگ میں شکست دی، اس کے بعد مجاعۃ ابن مررہ نے ان سے معاہدہ کیا اور ان سے اسلام قبول کر لیا گیا۔ اسلام سے پہلے یمامہ کے سردار حذیفہ بن علی الحنفی تھے جنہیں رسول اللہ نے اسلام کی دعوت دی تھی۔"
  tr: "El-Yamame halkı büyük bir Arap kabilesidir; aralarında peygamberlik iddiasında bulunan ve Yalancı lakabıyla anılan Musaylimah ibn Habib de vardır. Peygamber ona mektup yazmış ve halkının çoğu, Hicri 12 yılında Halid ibn el-Velid'in El-Yamame Muharebesi'nde onları yenmesine kadar onu takip etmiştir. Müca'ah ibn Murarah onları barışa kavuşturmuş, böylece İslam'ı kabul etmişler ve onlardan sadaka alınmıştır. İslam'dan önce El-Yamame, Peygamber'in İslam'a davet ettiği en iyi adamları Havda ibn Ali el-Hanafi'ye aitti."
  id: "Penduduk Al-Yamamah adalah suku Arab yang besar; di antara mereka terdapat Musaylimah ibn Habib, yang dijuluki Si Pendusta, yang mengaku sebagai nabi. Nabi menulis kepadanya, dan sebagian besar penduduknya mengikutinya hingga Khalid ibn al-Walid mengalahkan mereka dalam Perang Al-Yamamah pada tahun 12 Hijriah. Muja’ah ibn Murarah membawa mereka ke dalam perdamaian, sehingga mereka masuk Islam, dan sedekah diambil dari mereka. Sebelum Islam, Al-Yamamah adalah milik orang terbaik mereka, Hawdha ibn Ali al-Hanafi, yang diseru oleh Nabi untuk masuk Islam."
