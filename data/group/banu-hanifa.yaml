summary:
  ar: "قبيلة عربية كبيرة أهل اليمامة؛ منها مسيلمة بن حبيب الملقب بالكذاب الذي ادعى النبوة فكاتبها النبي وتبعه أكثر أهلها حتى هزمهم خالد بن الوليد في وقعة اليمامة سنة 12هـ وأدخلهم مجاعة بن مرارة في الصلح فأسلموا وأخذت منهم الصدقة؛ وكانت اليمامة قبل الإسلام لخيرتهم هوذة بن علي الحنفي الذي دعاهم النبي إلى الإسلام."
  en: "A great Arab tribe, the people of al-Yamama; of them was Musaylima ibn Habib, called the Liar, who claimed prophecy — the Prophet addressed a letter to him — and most of them followed him until Khalid ibn al-Walid defeated them at the battle of al-Yamama in 12 AH, whereupon Mujja'a ibn Murara brought them to terms and they embraced Islam and the alms were taken from them; before Islam al-Yamama's chief had been Hawdha ibn Ali al-Hanafi whom the Prophet invited to Islam."
