summary:
  ar: "قناة إنتاج وتوزيع إعلامي إسلامي باللغة الصومالية مقرّها كينيا، أُنشئت على يوتيوب في 4 نوفمبر 2019، وتنشر محاضرات وخطب جمعة وبرامج صوتية لعلماء صوماليين — منهم حسين علي جابوتي ومصطفى حاجي إسماعيل ومحمد إدريس ومحمد عبدي أومال — لجمهور ناطق بالصومالية في كينيا والمهجر، وبلغ عدد مشتركيها نحو 521 ألفًا بحسب عدّاد vidIQ في 4 نوفمبر 2026."
  en: "A Kenya-based Somali-language Islamic media production and distribution channel, created on YouTube on 4 November 2019, which publishes lectures, Friday sermons and podcasts by Somali scholars — among them Hussein Ali Jabuti, Mustafe Haji Ismail, Mohamed Idris and Mohamed Abdi Umal — for Somali-speaking audiences in Kenya and the diaspora. It counted about 521,000 subscribers by vidIQ's count as of 4 November 2026."
  ur: "ہدف پروڈکشن کینیا میں قائم صومالی زبان کا اسلامی میڈیا پروڈکشن و ڈسٹری بیوشن چینل ہے، جو ۴ نومبر ۲۰۱۹ء کو یوٹیوب پر بنایا گیا؛ یہ صومالی علماء — جن میں حسین علی جابوتی، مصطفیٰ حاجی اسماعیل، محمد ادریس اور محمد عبدی اومال شامل ہیں — کے دروس، خطباتِ جمعہ اور پوڈکاسٹ کینیا اور بیرونِ ملک صومالی بولنے والے ناظرین کے لیے شائع کرتا ہے۔ vidIQ کی گنتی کے مطابق ۴ نومبر ۲۰۲۶ء کو اس کے سبسکرائبرز کی تعداد تقریباً ۵۲۱٬۰۰۰ تھی۔"
