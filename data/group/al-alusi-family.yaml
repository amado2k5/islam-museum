label:
  ar: "آل الألوسي (بغداد)"
  en: "The al-Alusi family of Baghdad"
summary:
  ar: "أسرة الألوسي، سُميت باسم الألوس، وهي بلدة على الضفة الغربية للفرات بين أبي كمال والرمادي، وينتسب أفرادها إلى الحسن والحسين، وفرّ أجدادهم إليها من هولاكو، ولم يعودوا إلى بغداد إلا في القرن الحادي عشر الهجري/السابع عشر الميلادي. ومن أشهرهم محمود شكري الألوسي (1857–1924م)، صاحب «بلوغ الأرب» {cite:encyclopaedia-of-islam-2 vol. 1 p. 447}."
  en: "The al-Alusi family of Baghdad took its name from Alus, a place on the west bank of the Euphrates between Abu Kamal and Ramadi. According to family tradition its ancestors, who traced their descent to al-Hasan and al-Husayn, fled there from the Mongol conqueror Hulagu, and the family returned to Baghdad only in the 11th/17th century. Its most famous member is Mahmud Shukri al-Alusi (1857–1924), author of Bulugh al-arab {cite:encyclopaedia-of-islam-2 vol. 1 p. 447}."
