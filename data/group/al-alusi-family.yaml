label:
  ar: "آل الألوسي ⁦(بغداد)⁩"
  en: "The al-Alusi family of Baghdad"
  es: "La familia al-Alusi de Bagdad"
  fr: "La famille al-Alusi de Bagdad"
  ur: "بغداد کا العلوسی خاندان"
summary:
  ar: "أسرة الألوسي، سُميت باسم الألوس، وهي بلدة على الضفة الغربية للفرات بين أبي كمال والرمادي، وينتسب أفرادها إلى الحسن والحسين، وفرّ أجدادهم إليها من هولاكو، ولم يعودوا إلى بغداد إلا في القرن الحادي عشر الهجري/السابع عشر الميلادي. ومن أشهرهم محمود شكري الألوسي ⁦(1857–1924م)⁩، صاحب «بلوغ الأرب» {cite:encyclopaedia-of-islam-2 vol. 1 p. 447}."
  en: "The al-Alusi family of Baghdad took its name from Alus, a place on the west bank of the Euphrates between Abu Kamal and Ramadi. According to family tradition its ancestors, who traced their descent to al-Hasan and al-Husayn, fled there from the Mongol conqueror Hulagu, and the family returned to Baghdad only in the 11th/17th century. Its most famous member is Mahmud Shukri al-Alusi (1857–1924), author of Bulugh al-arab {cite:encyclopaedia-of-islam-2 vol. 1 p. 447}."
  es: "La familia al-Alusi de Bagdad tomó su nombre de Alus, un lugar situado en la orilla oeste del Éufrates, entre Abu Kamal y Ramadi. Según la tradición familiar, sus antepasados, que descendían de al-Hasan y al-Husayn, huyeron allí del conquistador mongol Hulagu, y la familia no regresó a Bagdad hasta el siglo XI/XVII. Su miembro más famoso es Mahmud Shukri al-Alusi (1857-1924), autor de Bulugh al-arab {cite:encyclopaedia-of-islam-2 vol. 1 p. 447}."
  fr: "La famille al-Alusi de Bagdad tire son nom d'Alus, un lieu situé sur la rive ouest de l'Euphrate, entre Abou Kamal et Ramadi. Selon la tradition familiale, ses ancêtres, qui descendaient d'al-Hasan et d'al-Husayn, s'y seraient réfugiés pour échapper au conquérant mongol Hulagu. La famille ne serait revenue à Bagdad qu'au XIe/XVIIe siècle. Son membre le plus illustre est Mahmoud Shukri al-Alusi (1857-1924), auteur de Bulugh al-arab (Encyclopédie de l'Islam, tome 2, vol. 1, p. 447)."
  ur: "بغداد کے آل آلوسی خاندان نے اس کا نام الوس سے لیا جو فرات کے مغربی کنارے پر ابو کمال اور رمادی کے درمیان واقع ہے۔ خاندانی روایت کے مطابق اس کے آباؤ اجداد، جنہوں نے اپنی نسل کا پتہ الحسن اور الحسین سے لگایا تھا، منگول فاتح ہلاگو سے وہاں سے بھاگ گئے، اور یہ خاندان 11ویں/17ویں صدی میں ہی بغداد واپس آیا۔ اس کا سب سے مشہور رکن محمود شکری العلوسی (1857–1924) ہے، جو بلوغ العرب کے مصنف ہیں۔ 1 ص۔ 447}۔"
