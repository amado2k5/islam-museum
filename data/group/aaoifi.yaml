id: group/aaoifi
class: group
kind: standards-body
label:
  ar: هيئة المحاسبة والمراجعة للمؤسسات المالية الإسلامية
  en: Accounting and Auditing Organization for Islamic Financial Institutions (AAOIFI)
  ur: اسلامی مالیاتی اداروں کی اکاؤنٹنگ و آڈٹ تنظیم
summary:
  ar: هيئة دولية غير ربحية مقرها البحرين، أُسست باتفاقية وُقّعت في الجزائر في 26 فبراير 1990، تضع معايير المحاسبة والمراجعة
    والمعايير الشرعية للمؤسسات المالية الإسلامية؛ لها أعضاء من أكثر من 45 بلدا، وتطبق معاييرَها جهات رقابية في عدد من الدول.
  en: An international not-for-profit body based in Bahrain, established by an agreement signed in Algiers on 26 February
    1990, which sets accounting, auditing and Shariah standards for Islamic financial institutions; it has members from more
    than 45 countries, and regulators in several states apply its standards.
  ur: بحرین میں قائم بین الاقوامی غیر منافع بخش ادارہ، جو 26 فروری 1990 کو الجزائر میں دستخط شدہ معاہدے سے قائم ہوا اور اسلامی
    مالیاتی اداروں کے لیے اکاؤنٹنگ، آڈٹ اور شرعی معیار بناتا ہے؛ 45 سے زیادہ ملکوں سے اس کے ارکان ہیں، اور کئی ملکوں کے نگران
    ادارے اس کے معیار نافذ کرتے ہیں۔
