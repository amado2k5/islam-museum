label:
  ar: "أصحاب القرية"
  en: "The People of the Town"
  ur: "اصحاب قریہ"
  es: "La gente del pueblo"
summary:
  ar: "أصحاب القرية في سورة يس أهل مدينة أرسل الله إليها مرسلين اثنين فكذبوهما فعزز بثالث، فكذبوهم جميعاً حتى جاءهم رجل من أقصى المدينة يسعى فنصحهم فقتلوه فأهلكتهم صيحة واحدة؛ المفسرون يسمون القرية أنطاكية على المشهور {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  en: "The People of the Town in Surah Ya-Sin are the people of a town to whom God sent two messengers; they denied both, so He strengthened them with a third, and they denied them all, until a man came running from the farthest part of the town, counselled them, and was killed — then a single Cry destroyed them. The commentators famously name the town Antioch {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  ur: "اصحابِ قریہ سورۃ یٰسین میں ایک بستی کے لوگ ہیں جن پر خدا نے دو رسول بھیجے، انہوں نے جھٹلایا تو تیسرے سے تائید کی، پھر سب کو جھٹلایا؛ آخر شہر کے دور ترین کنارے سے ایک شخص دوڑتا آیا اور نصیحت کی تو مارا گیا — پھر ایک صیحہ نے سب کو ہلاک کر دیا؛ مفسرین کے مشہور قول میں یہ بستی انطاکیہ ہے۔"
  es: "Los habitantes de la ciudad en la Sura Ya-Sin son los habitantes de una ciudad a la que Dios envió dos mensajeros; los negaron a ambos, por lo que Él los fortaleció con un tercero, y los negaron a todos, hasta que un hombre llegó corriendo desde el extremo más alejado de la ciudad, les aconsejó y fue asesinado; entonces un solo grito los destruyó. Los comentaristas llaman a la ciudad Antioquía {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
