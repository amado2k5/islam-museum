label:
  ar: "أصحاب القرية"
  en: "The People of the Town"
  ur: "اصحاب قریہ"
  es: "La gente del pueblo"
  fr: "Les habitants de la ville"
  tr: "Köylüler"
  id: "Penduduk desa"
summary:
  ar: "أصحاب القرية في سورة يس أهل مدينة أرسل الله إليها مرسلين اثنين فكذبوهما فعزز بثالث، فكذبوهم جميعاً حتى جاءهم رجل من أقصى المدينة يسعى فنصحهم فقتلوه فأهلكتهم صيحة واحدة؛ المفسرون يسمون القرية أنطاكية على المشهور {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  en: "The People of the Town in Surah Ya-Sin are the people of a town to whom God sent two messengers; they denied both, so He strengthened them with a third, and they denied them all, until a man came running from the farthest part of the town, counselled them, and was killed — then a single Cry destroyed them. The commentators famously name the town Antioch {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  ur: "اصحابِ قریہ سورۃ یٰسین میں ایک بستی کے لوگ ہیں جن پر خدا نے دو رسول بھیجے، انہوں نے جھٹلایا تو تیسرے سے تائید کی، پھر سب کو جھٹلایا؛ آخر شہر کے دور ترین کنارے سے ایک شخص دوڑتا آیا اور نصیحت کی تو مارا گیا — پھر ایک صیحہ نے سب کو ہلاک کر دیا؛ مفسرین کے مشہور قول میں یہ بستی انطاکیہ ہے۔"
  es: "Los habitantes de la ciudad en la Sura Ya-Sin son los habitantes de una ciudad a la que Dios envió dos mensajeros; los negaron a ambos, por lo que Él los fortaleció con un tercero, y los negaron a todos, hasta que un hombre llegó corriendo desde el extremo más alejado de la ciudad, les aconsejó y fue asesinado; entonces un solo grito los destruyó. Los comentaristas llaman a la ciudad Antioquía {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran}."
  fr: "Les habitants de la ville mentionnés dans la sourate Ya-Sin sont ceux d'une ville à laquelle Dieu envoya deux messagers. Ils les renièrent tous deux, alors Il les renia par l'intermédiaire d'un troisième, et ils les renièrent encore, jusqu'à ce qu'un homme accoure des confins de la ville, les conseille et soit tué. Alors, un seul cri les anéantit. Les commentateurs nomment cette ville Antioche."
  tr: "Yasin Suresi'ndeki kasaba halkı, Allah'ın iki elçi gönderdiği, ancak onları inkâr ettiği bir şehrin halkıdır. Bunun üzerine Allah onlara üçüncü bir elçi gönderdi, ancak onlar hepsini inkâr ettiler. Ta ki şehrin en uzak köşesinden koşarak gelen bir adam onlara nasihatte bulunana kadar. Ancak onu öldürdüler ve tek bir çığlıkla yok oldular. Tefsirciler, bilinen {tefsir-tabari-şakir-cilt 1} {tanzil-kuran}a göre bu şehre Antakya adını verirler."
  id: "Penduduk kota dalam Surah Yasin adalah penduduk kota yang kepadanya Allah mengutus dua utusan, tetapi mereka mengingkari mereka. Maka Dia menguatkan mereka dengan utusan ketiga, tetapi mereka tetap mengingkari semuanya sampai seorang laki-laki datang kepada mereka dari bagian kota yang terjauh, berlari, dan menasihati mereka, tetapi mereka membunuhnya, dan mereka binasa hanya dengan satu teriakan. Para penafsir menyebut kota itu Antiokhia, menurut {cite:tafsir-tabari-shakir-v01} {cite:tanzil-quran} yang terkenal."
