  ur: "مسلم اکثریتی ریاستوں کا ایک بین الحکومتی ادارہ، جدہ، سعودی عرب میں بیٹھا ہے، جو خود کو مسلم دنیا کی اجتماعی آواز کے طور پر بیان کرتا ہے {cite:oic-official-site}"
  tr: "Merkezi Suudi Arabistan'ın Cidde kentinde bulunan ve kendisini İslam dünyasının kolektif sesi olarak tanımlayan, İslam ülkelerinden oluşan uluslararası bir kuruluş."
  id: "Sebuah organisasi internasional yang terdiri dari negara-negara Islam, berkantor pusat di Jeddah, Arab Saudi, yang menyebut dirinya sebagai suara kolektif dunia Islam {cite:oic-official-site}."
