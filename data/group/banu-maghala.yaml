label: { ar: "بنو مغالة", en: "Banu Maghala", es: "Banu Maghala", fr: "Banu Maghala", ur: "بنو مقالہ" }
summary:
  ar: "بطن من بني النجار — بنو عدي بن عمرو بن مالك، ومغالة أم عدي — نزلوا ما كان على اليمين لمن وقف آخر البلاط مستقبل المسجد النبوي، وابتنوا أطم «فارع» الذي يواجه دور بني طلحة بن عبيد الله ودخل لاحقاً في دار جعفر بن يحيى البرمكي؛ وهو الأطم الذي كانت به صفية عمة النبي يوم الخندق وعندها حسان بن ثابت، وقال الزين المراغي إنه كان لثابت والد حسان، وفيه وُجد ابن صياد في حديث مسلم، وإليه أشار حسان: «ونحن نشاوى بين سلع وفارع» {cite:samhudi-wafa-al-wafa p. 222-223}."
  en: "A clan of Banu al-Najjar — Banu 'Adi ibn 'Amr ibn Malik, Maghala being 'Adi's mother — settled on the right of one facing the Prophet's Mosque from the end of the balat; they built the utm 'Fari'' facing the houses of Banu Talha ibn 'Ubayd Allah, later absorbed into Ja'far ibn Yahya al-Barmaki's residence — the tower where Safiyya the Prophet's aunt sheltered on the day of the Trench with Hassan ibn Thabit beside it (al-Zayn al-Maraghi makes it the tower of Thabit, Hassan's father), where Ibn Sayyad was found in Muslim's hadith, and to which Hassan's verse 'we hold sway between Sal' and Fari'' refers {cite:samhudi-wafa-al-wafa p. 222-223}."
  es: "Un clan de Banu al-Najjar — Banu 'Adi ibn 'Amr ibn Malik, siendo Maghala la madre de 'Adi — se estableció a la derecha de uno frente a la Mezquita del Profeta desde el extremo del balat; construyeron el utm 'Fari'' frente a las casas de Banu Talha ibn 'Ubayd Allah, absorbido más tarde por la residencia de Ja'far ibn Yahya al-Barmaki — la torre donde Safiyya, la tía del Profeta, se refugió el día de la Trinchera con Hassan ibn Thabit a su lado (al-Zayn al-Maraghi la llama la torre de Thabit, padre de Hassan), donde se encontró a Ibn Sayyad en el hadiz de Muslim, y a la que se refiere el versículo de Hassan 'tenemos dominio entre Sal' y Fari'' {cite:samhudi-wafa-al-wafa p. 222-223}."
  fr: "Un clan des Banu al-Najjar — Banu 'Adi ibn 'Amr ibn Malik, Maghala étant la mère d''Adi — s'installa sur la droite de l'un des côtés de la Mosquée du Prophète, à l'extrémité du balat; ils construisirent l'utm 'Fari'' face aux maisons des Banu Talha ibn 'Ubayd Allah, plus tard absorbées par la résidence de Ja'far ibn Yahya al-Barmaki — la tour où Safiyya, la tante du Prophète, s'abrita le jour du Fossé avec Hassan ibn Thabit à côté (al-Zayn al-Maraghi la désigne comme la tour de Thabit, le père de Hassan), où Ibn Sayyad fut mentionné dans un hadith de Muslim, et à laquelle le verset de Hassan « nous régnons entre Sal' et Fari' » fait référence {cite:samhudi-wafa-al-wafa p. 222-223}."
  ur: "بنو النجار کا ایک قبیلہ - بنو عدی بن عمرو بن مالک، مقالہ عدی کی ماں ہونے کے ناطے - بلات کے آخر سے مسجد نبوی کی طرف منہ کرنے والے کے دائیں طرف آباد تھا۔ انہوں نے بنو طلحہ بن عبید اللہ کے مکانات کے سامنے اتم 'فاری' تعمیر کیا، جو بعد میں جعفر بن یحییٰ برمکی کی رہائش گاہ میں ضم ہو گیا - وہ مینار جہاں خندق کے دن حضرت صفیہ ا نے خندق کے دن حسن بن ثابت کے ساتھ پناہ لی تھی۔ والد)، جہاں ابن صیاد کو مسلم کی حدیث میں پایا جاتا ہے، اور جس میں حسن کی آیت 'ہم سل اور فاری کے درمیان اختیار رکھتے ہیں' سے مراد ہے {حوالہ: سمھدی وفا الوفاء ص۔ 222-223}۔"
