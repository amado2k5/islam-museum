id: group/banu-bayada
class: group
kind: clan
label: { ar: "بنو بياضة", en: "Banu Bayada" }
summary:
  ar: "بطن من الخزرج، بنو بياضة بن عامر بن زريق؛ نزلوا داراً في الحرة الغربية شمالي بني سالم وقبلي بني مازن، وكان في دارهم تسعة عشر أطماً — لبني أمية بن عامر بن بياضة وحدهم ثلاثة عشر — وقيل في الأوس والخزرج: «أبطأهم فَرّةً وأسرعهم كَرّةً بنو بياضة وبنو زريق وبنو غفر». اشتملت دارهم على بني زريق وبني حبيب وبني عذارة وبني اللين وبني أجدع؛ فلما طلب حبيب بن عبد حارثة منهم النضح بأيديهم قتلوه، واقتتلوا بطنان منهم في حديقة حتى لم يبق منهم عين تطرف فسُميت «حديقة الموت»، وفي سنة ستين ومائة نُقل ديوان الأنصار الذي كانوا فيه إلى بني بياضة {cite:samhudi-wafa-al-wafa p. 216-220}."
  en: "A clan of the Khazraj, Banu Bayada ibn 'Amir ibn Zurayq; they held a quarter in the western Harra north of Banu Salim with nineteen utum — thirteen for Banu Umayya ibn 'Amir alone — and were praised in the saying 'slowest to flee, fastest to charge: Banu Bayada, Banu Zurayq and Banu Ghaffar'. Their quarter lodged the Banu Ghadb septs; when Habib ibn Abd al-Harith demanded they draw water with their own hands they killed him, and two of their septs fought in a garden until no eye twinkled — hence its name 'the Garden of Death' — and in 160 AH the Ansar's Umayyad diwan register was transferred to them {cite:samhudi-wafa-al-wafa p. 216-220}."
