label: { ar: "بنو بياضة", en: "Banu Bayada", es: "Banu Bayada", fr: "Banu Bayada", ur: "بنو بیادہ", tr: "Banu Bayada", id: "Banu Bayada" }
summary:
  ar: "بطن من الخزرج، بنو بياضة بن عامر بن زريق؛ نزلوا داراً في الحرة الغربية شمالي بني سالم وقبلي بني مازن، وكان في دارهم تسعة عشر أطماً — لبني أمية بن عامر بن بياضة وحدهم ثلاثة عشر — وقيل في الأوس والخزرج: «أبطأهم فَرّةً وأسرعهم كَرّةً بنو بياضة وبنو زريق وبنو غفر». اشتملت دارهم على بني زريق وبني حبيب وبني عذارة وبني اللين وبني أجدع؛ فلما طلب حبيب بن عبد حارثة منهم النضح بأيديهم قتلوه، واقتتلوا بطنان منهم في حديقة حتى لم يبق منهم عين تطرف فسُميت «حديقة الموت»، وفي سنة ستين ومائة نُقل ديوان الأنصار الذي كانوا فيه إلى بني بياضة {cite:samhudi-wafa-al-wafa p. 216-220}."
  en: "A clan of the Khazraj, Banu Bayada ibn 'Amir ibn Zurayq; they held a quarter in the western Harra north of Banu Salim with nineteen utum — thirteen for Banu Umayya ibn 'Amir alone — and were praised in the saying 'slowest to flee, fastest to charge: Banu Bayada, Banu Zurayq and Banu Ghaffar'. Their quarter lodged the Banu Ghadb septs; when Habib ibn Abd al-Harith demanded they draw water with their own hands they killed him, and two of their septs fought in a garden until no eye twinkled — hence its name 'the Garden of Death' — and in 160 AH the Ansar's Umayyad diwan register was transferred to them {cite:samhudi-wafa-al-wafa p. 216-220}."
  es: "Un clan de los Khazraj, Banu Bayada ibn 'Amir ibn Zurayq; poseían un territorio en el oeste de Harra, al norte de Banu Salim, con diecinueve utum —trece para Banu Umayya ibn 'Amir solamente— y eran elogiados con el dicho «los más lentos para huir, los más rápidos para atacar: Banu Bayada, Banu Zurayq y Banu Ghaffar». En su territorio se alojaban los clanes Banu Ghadb; cuando Habib ibn Abd al-Harith les exigió que sacaran agua con sus propias manos, lo mataron, y dos de sus clanes lucharon en un jardín hasta que no les quedó ni un ojo —de ahí su nombre «el Jardín de la Muerte»— y en el año 160 AH el registro del diwan omeya de los Ansar les fue transferido {cite:samhudi-wafa-al-wafa p. 216-220}."
  fr: "Un clan khazraj, les Banu Bayada ibn 'Amir ibn Zurayq, occupait un quartier dans la partie ouest de Harra, au nord des Banu Salim, avec dix-neuf utum (dont treize pour les seuls Banu Umayya ibn 'Amir). On disait d'eux: « Les plus lents à fuir, les plus rapides à charger: Banu Bayada, Banu Zurayq et Banu Ghaffar ». Leur quartier abritait les clans Banu Ghadb. Lorsque Habib ibn Abd al-Harith leur demanda de puiser de l'eau de leurs propres mains, ils le tuèrent. Deux de leurs clans s'affrontèrent dans un jardin jusqu'à ce que mort s'ensuive, d'où son nom de « Jardin de la Mort ». En 160 AH, le registre du diwan omeyyade des Ansar leur fut transféré (voir: Samhudi-wafa-al-wafa, p. 216-220)."
  ur: "خزرج کا ایک قبیلہ، بنو بیادہ ابن عامر بن زریق؛ انہوں نے بنو سالم کے شمال میں مغربی حرہ میں انیس اوتم کے ساتھ ایک چوتھائی تھی - تیرہ صرف بنو امیہ بن عامر کے لیے - اور ان کی تعریف اس کہاوت میں کی گئی کہ 'بھاگنے میں سب سے سست، چارج کرنے میں سب سے تیز: بنو بیادہ، بنو زریق اور بنو غفار'۔ ان کا کوارٹر بنو غدب میں مقیم تھا۔ جب حبیب بن عبد الحارث نے اپنے ہاتھ سے پانی نکالنے کا مطالبہ کیا تو انہوں نے اسے قتل کر دیا، اور ان کے دو سیپ ایک باغ میں لڑے یہاں تک کہ آنکھ نہ جھپکتی، اس لیے اس کا نام 'موت کا باغ' رکھا گیا اور 160 ہجری میں انصار کا اموی دیوان رجسٹر ان کو منتقل کر دیا گیا۔ 216-220}۔"
  tr: "Hazrec kabilesinin bir kolu olan Beni Bayada ibn Amir ibn Zurayq, Beni Salim'in kuzeyinde ve Beni Mazin'in güneyinde, batı lav ovasında bir yerleşim yerine yerleşti. Yerleşim yerlerinde on dokuz müstahkem ev bulunuyordu; bunlardan on üçü yalnızca Beni Umayya ibn Amir ibn Bayada'ya aitti. Evs ve Hazrec kabileleri hakkında şöyle denirdi: \"En yavaş kaçanlar ve en hızlı dönenler Beni Bayada, Beni Zurayq ve Beni Ghafr idi.\" Yerleşim yerlerinde Beni Zurayq, Beni Habib, Beni Adhara, Beni el-Layn ve Beni Ajda' kabileleri bulunuyordu. Habib ibn Abd Haritha onlardan kendi elleriyle su serpmelerini istediğinde onu öldürdüler. Aralarından iki kabile bir bahçede savaştı ve hiçbiri hayatta kalmadı; bu bahçe \"Ölüm Bahçesi\" olarak bilindi. Hicri 160 yılında, ellerinde tuttukları Ensar'ın kayıt defteri Beni Bayada'ya devredildi. {alıntı:samhudi-wafa-al-wafa s. 216-220}"
  id: "Sebuah cabang dari Khazraj, Banu Bayada ibn Amir ibn Zurayq, menetap di sebuah tempat tinggal di ladang lava barat, di utara Banu Salim dan selatan Banu Mazin. Tempat tinggal mereka berisi sembilan belas rumah berbenteng—tiga belas di antaranya milik Banu Umayya ibn Amir ibn Bayada saja. Dikatakan tentang Aws dan Khazraj: \"Yang paling lambat melarikan diri dan paling cepat kembali adalah Banu Bayada, Banu Zurayq, dan Banu Ghafr.\" Tempat tinggal mereka termasuk Banu Zurayq, Banu Habib, Banu Adhara, Banu al-Layn, dan Banu Ajda'. Ketika Habib ibn Abd Haritha meminta mereka untuk memercikkan air dengan tangan mereka sendiri, mereka membunuhnya. Dua klan di antara mereka bertempur di sebuah taman sampai tidak ada satu pun dari mereka yang tersisa hidup, dan tempat itu kemudian dikenal sebagai \"Taman Kematian.\" Pada tahun 160 Hijriah, catatan Ansar yang mereka pegang dialihkan kepada Bani Bayada. {cite:samhudi-wafa-al-wafa hlm. 216-220}"
