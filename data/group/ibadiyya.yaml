summary:
  ar: "الإباضية أتباع عبد الله بن إباض الخارجي الذي مات في عهد عبد الملك بن مروان، وهي الفرقة الوحيدة من الخوارج التي عاشت وانتشرت في شمالي إفريقية وعُمان وحضرموت وزنجبار واستمرت إلى يومنا؛ فكان من الطبيعي أن يكون لها أصول اعتقادية وتعاليم فقهية تعدّل مذهبها مع الزمان — لهم أصول كلامية متأثرة إلى حد كبير بمذهب المعتزلة في القول بخلق القرآن وأن الله لا يُرى في الجنة وأنه لا يغفر الكبائر، ولهم كتب فقهية خاصة تخالف أهل السنة في بعض الفروع كقولهم إن الزواج لا يصح إلا فيما بينهم؛ ومنهم ثارت ثورة الجلندى في عُمان سنة ١٣٤، وحفظت مكاتبهم في المغرب وعُمان بعض آثارهم الأدبية من العصر العباسي الأول {cite:duha-islam p. 948, 950, 956}."
  en: "The Ibadiyya — followers of Abdallah ibn Ibad, the one Khariji branch to survive, in North Africa, Oman, Hadramawt and Zanzibar, with a kalam touched by the Mu'tazila and a fiqh of its own {cite:duha-islam p. 948}."
  es: "Los ibadíes —seguidores de Abdallah ibn Ibad, la única rama jariyí que sobrevivió, en el norte de África, Omán, Hadramawt y Zanzíbar, con un kalam influenciado por los mu'tazila y un fiqh propio {cite:duha-islam p. 948}."
  fr: "Les Ibadiyya — disciples d'Abdallah ibn Ibad, la seule branche Khariji à avoir survécu, en Afrique du Nord, à Oman, à Hadramawt et à Zanzibar, avec un kalam touché par les Mu'tazila et un fiqh qui lui est propre {cite:duha-islam p. 948}."
  ur: "عبادیہ - عبد اللہ ابن عباد کے پیروکار، ایک خارجی شاخ جو زندہ رہنے کے لیے، شمالی افریقہ، عمان، حضرموت اور زنجبار میں، معتزلہ کی طرف سے چھوئے گئے ایک کلام اور اس کی اپنی ایک فقہ کے ساتھ۔ 948}۔"
  tr: "İbadiler, Abdülmalik ibn Mervan döneminde ölen Abdullah ibn İbad el-Harci'nin takipçileridir. Kuzey Afrika, Umman, Hadramaut ve Zanzibar'da yaşayan ve günümüze kadar varlığını sürdüren tek Harici mezhebidirler. Doktrinsel ilkeleri ve zaman içinde doktrinlerini değiştiren fıkıh öğretilerine sahip olmaları doğaldı. Kur'an'ın yaratılışına, Tanrı'nın cennette görülemeyeceğine ve büyük günahları affetmediğine olan inançlarında Mu'tezile düşünce okulundan büyük ölçüde etkilenen teolojik ilkeleri vardır. Sünnilerden bazı dallarda farklılık gösteren kendi fıkıh kitaplarına sahiptirler; örneğin, evliliğin yalnızca kendi aralarında geçerli olduğunu söylerler. 134 yılında Umman'da Julanda isyanı onlardan çıktı ve Fas ve Umman'daki kütüphaneleri, erken Abbasi döneminden bazı edebi eserlerini korudu. {cite:duha-islam s. 948, 950, 956}."
  id: "Kaum Ibadi adalah pengikut Abdullah ibn Ibad al-Kharji, yang meninggal pada masa pemerintahan Abd al-Malik ibn Marwan. Mereka adalah satu-satunya sekte Kharijite yang hidup dan menyebar di Afrika Utara, Oman, Hadhramaut, dan Zanzibar, dan berlanjut hingga saat ini. Wajar bagi mereka untuk memiliki prinsip-prinsip doktrin dan ajaran yurisprudensi yang memodifikasi doktrin mereka dari waktu ke waktu. Mereka memiliki prinsip-prinsip teologis yang sangat dipengaruhi oleh mazhab Mu'tazilah dalam keyakinan mereka tentang penciptaan Al-Qur'an, bahwa Tuhan tidak dapat dilihat di Surga, dan bahwa Dia tidak mengampuni dosa-dosa besar. Mereka memiliki kitab-kitab yurisprudensi sendiri yang berbeda dari Sunni dalam beberapa cabang, seperti pernyataan mereka bahwa pernikahan tidak sah kecuali di antara mereka sendiri. Dari kalangan mereka muncul pemberontakan Julanda di Oman pada tahun 134, dan perpustakaan mereka di Maroko dan Oman melestarikan beberapa karya sastra mereka dari era Abbasiyah awal. {cite:duha-islam p. 948, 950, 956}."
