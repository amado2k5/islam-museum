label: { ar: "الإباضية" }
summary:
  ar: "الإباضية أتباع عبد الله بن إباض الخارجي الذي مات في عهد عبد الملك بن مروان، وهي الفرقة الوحيدة من الخوارج التي عاشت وانتشرت في شمالي إفريقية وعُمان وحضرموت وزنجبار واستمرت إلى يومنا؛ فكان من الطبيعي أن يكون لها أصول اعتقادية وتعاليم فقهية تعدّل مذهبها مع الزمان — لهم أصول كلامية متأثرة إلى حد كبير بمذهب المعتزلة في القول بخلق القرآن وأن الله لا يُرى في الجنة وأنه لا يغفر الكبائر، ولهم كتب فقهية خاصة تخالف أهل السنة في بعض الفروع كقولهم إن الزواج لا يصح إلا فيما بينهم؛ ومنهم ثارت ثورة الجلندى في عُمان سنة ١٣٤، وحفظت مكاتبهم في المغرب وعُمان بعض آثارهم الأدبية من العصر العباسي الأول {cite:duha-islam p. 948, 950, 956}."
  en: "The Ibadiyya — followers of Abdallah ibn Ibad, the one Khariji branch to survive, in North Africa, Oman, Hadramawt and Zanzibar, with a kalam touched by the Mu'tazila and a fiqh of its own {cite:duha-islam p. 948}."
