id: group/al-radhaniyya
class: group
kind: people
label: { ar: "التجار الراذنية", en: "the Radhanite merchants", es: "los mercaderes radhanitas", fr: "les marchands radhanites", ur: "رادھانی کے تاجر" }
summary:
  ar: "تجار يهود وصفهم ابن خرداذبه بأنهم يتكلمون العربية والفارسية والرومية والإفرنجية والأندلسية والصقلبية، يسافرون من المشرق إلى المغرب ومن المغرب إلى المشرق براً وبحراً؛ يجلبون من المغرب الخدم والجواري والديباج وجلود الخز والفراء والسمور والسيوف، فيركبون من فرنجة في البحر الغربي فيخرجون بالفرما ثم يحملون تجارتهم على الظهر إلى القلزم خمسة وعشرين فرسخاً ويركبون البحر الشرقي إلى الجار وجدة ثم إلى السند والهند والصين، فيحملون من الصين المسك والعود والكافور والدارصيني؛ ولهم مسلك بري من الأندلس إلى طنجة فإفريقية فمصر فالرملة فدمشق فالكوفة فبغداد فالبصرة فالأهواز ففارس فكرمان فالسند فالهند فالصين، وربما مضوا إلى بلاد الصقالبة فخمليج مدينة الخزر فبحر جرجان فبلخ فما وراء النهر فالصين {cite:masalik-mamalik-ibn-khurdadhbih pp. 153-155}."
  en: "The Radhanite Jewish merchants of Ibn Khurdadhbih's register — speakers of Arabic, Persian, Greek, Frankish, Andalusi and Slavonic who travelled from East to West and back by land and sea, carrying slaves, brocade, beaver and sable furs and swords from Francia through Farama, across the twenty-five-farsakh portage to Qulzum, and down the eastern sea past al-Jar and Jeddah to Sind, India and China, returning with musk, aloes, camphor and cinnamon; their overland route ran al-Andalus–Tangier–Ifriqiya–Egypt–Ramla–Damascus–Kufa–Baghdad–Basra–Ahwaz–Fars–Kirman–Sind–India–China, with a northern alternative through the Slavs' lands to Khamlij the Khazar capital, the Caspian, Balkh and beyond the Oxus {cite:masalik-mamalik-ibn-khurdadhbih pp. 153-155}."
  es: "Los mercaderes judíos radhanitas del registro de Ibn Khurdadhbih —hablantes de árabe, persa, griego, franco, andalusí y eslavo— que viajaban de este a oeste y viceversa por tierra y mar, transportando esclavos, brocados, pieles de castor y marta cibelina y espadas desde Francia a través de Farama, cruzando el paso de veinticinco farsakhs hasta Qulzum, y bajando por el mar oriental pasando por al-Jar y Jeddah hasta Sind, India y China, regresando con almizcle, áloe, alcanfor y canela; Su ruta terrestre discurría por al-Ándalus–Tánger–Ifriqiya–Egipto–Ramla–Damasco–Kufa–Bagdad–Basora–Ahwaz–Fars–Kirman–Sind–India–China, con una alternativa septentrional a través de las tierras eslavas hasta Khamlij, la capital jázara, el Caspio, Balkh y más allá del Oxus {cite:masalik-mamalik-ibn-khurdadhbih pp. 153-155}."
  fr: "Les marchands juifs radhanites du registre d'Ibn Khurdadhbih — locuteurs d'arabe, de persan, de grec, de francique, d'andalou et de slavon qui voyageaient d'Est en Ouest et retour par voie terrestre et maritime, transportant des esclaves, du brocart, des fourrures de castor et de zibeline et des épées de Francia à travers Farama, à travers le portage de vingt-cinq farsakh jusqu'à Qulzum, et le long de la mer orientale au-delà d'al-Jar et de Djeddah jusqu'au Sind, en Inde et en Chine, revenant avec du musc, de l'aloès, du camphre et de la cannelle; leur route terrestre passait par al-Andalus–Tanger–Ifriqiya–Égypte–Ramla–Damas–Koufa–Bagdad–Bassora–Ahwaz–Fars–Kirman–Sind–Inde–Chine, avec une alternative au nord à travers les terres des Slaves jusqu'à Khamlij, la capitale khazare, la Caspienne, Balkh et au-delà de l'Oxus {cite:masalik-mamalik-ibn-khurdadhbih pp. 153-155}."
  ur: "ابن خرداذبیح کے رجسٹر کے رادھانی یہودی تاجر - عربی، فارسی، یونانی، فرینکش، اندلس اور سلاونک بولنے والے جو مشرق سے مغرب اور واپس خشکی اور سمندر کے راستے سفر کرتے تھے، غلاموں، بروکیڈ، بیور اور سیبل کی کھالیں اور تلواریں لے کر جاتے تھے، فرانشیا سے فارس پورٹ سے فرانس کے پار۔ قلزم، اور مشرقی سمندر کے نیچے الجار اور جدہ سے گزرتے ہوئے سندھ، ہندوستان اور چین تک، کستوری، ایلو، کافور اور دار چینی کے ساتھ واپسی؛ ان کا زمینی راستہ الاندلس–تنگیر–افریقیہ–مصر–رملہ–دمشق–کوفہ–بغداد–بصرہ–اہواز–فارس–کرمان–سندھ–ہندوستان–چین سے گزرتا تھا، شمالی متبادل کے ساتھ غلاموں کی سرزمینوں سے ہوتا ہوا خملیج، خزر کے دارالحکومت، بالخیس اور کیسپیئن۔ {حوالہ: مسالک-ممالک-ابن خردابیح صفحہ 153-155}۔"
