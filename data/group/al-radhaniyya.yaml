label: { ar: "التجار الراذنية", en: "the Radhanite merchants" }
summary:
  ar: "تجار يهود وصفهم ابن خرداذبه بأنهم يتكلمون العربية والفارسية والرومية والإفرنجية والأندلسية والصقلبية، يسافرون من المشرق إلى المغرب ومن المغرب إلى المشرق براً وبحراً؛ يجلبون من المغرب الخدم والجواري والديباج وجلود الخز والفراء والسمور والسيوف، فيركبون من فرنجة في البحر الغربي فيخرجون بالفرما ثم يحملون تجارتهم على الظهر إلى القلزم خمسة وعشرين فرسخاً ويركبون البحر الشرقي إلى الجار وجدة ثم إلى السند والهند والصين، فيحملون من الصين المسك والعود والكافور والدارصيني؛ ولهم مسلك بري من الأندلس إلى طنجة فإفريقية فمصر فالرملة فدمشق فالكوفة فبغداد فالبصرة فالأهواز ففارس فكرمان فالسند فالهند فالصين، وربما مضوا إلى بلاد الصقالبة فخمليج مدينة الخزر فبحر جرجان فبلخ فما وراء النهر فالصين {cite:masalik-mamalik-ibn-khurdadhbih pp. 153-155}."
  en: "The Radhanite Jewish merchants of Ibn Khurdadhbih's register — speakers of Arabic, Persian, Greek, Frankish, Andalusi and Slavonic who travelled from East to West and back by land and sea, carrying slaves, brocade, beaver and sable furs and swords from Francia through Farama, across the twenty-five-farsakh portage to Qulzum, and down the eastern sea past al-Jar and Jeddah to Sind, India and China, returning with musk, aloes, camphor and cinnamon; their overland route ran al-Andalus–Tangier–Ifriqiya–Egypt–Ramla–Damascus–Kufa–Baghdad–Basra–Ahwaz–Fars–Kirman–Sind–India–China, with a northern alternative through the Slavs' lands to Khamlij the Khazar capital, the Caspian, Balkh and beyond the Oxus {cite:masalik-mamalik-ibn-khurdadhbih pp. 153-155}."
