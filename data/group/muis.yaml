label:
  ar: المجلس الإسلامي السنغافوري ⁦(موئيس)⁩
  en: Majlis Ugama Islam Singapura (MUIS)
  ur: مجلس اوگاما اسلام سنگاپور
summary:
  ar: هيئة قانونية حكومية في سنغافورة أُسست سنة 1968 بقانون إدارة الشريعة الإسلامية، ترعى شؤون المسلمين وتنصح رئيس الجمهورية
    في أمور الإسلام، وتتولى الزكاة والأوقاف والحج والمساجد والمدارس الإسلامية وشهادات الحلال.
  en: A Singapore government statutory board established in 1968 under the Administration of Muslim Law Act, which looks after
    the Muslim community, advises the President on Islam, and administers zakat, endowments, pilgrimage affairs, mosques,
    madrasahs and halal certification.
  ur: سنگاپور کا سرکاری قانونی بورڈ، جو 1968 میں انتظامِ قانونِ اسلامی ایکٹ کے تحت قائم ہوا؛ مسلم برادری کی دیکھ بھال کرتا
    ہے، صدر کو اسلامی امور پر مشورہ دیتا ہے، اور زکوٰۃ، اوقاف، حج، مساجد، مدارس اور حلال سرٹیفکیشن کا انتظام کرتا ہے۔
