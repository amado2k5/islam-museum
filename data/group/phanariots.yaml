kids:
  ar: "الفنارية أسر يونانية غنية سكنت حي فنر في إسطنبول، وعمل رجالها مترجمين وحكاماً لإمارتين في أوروبا لحساب الدولة العثمانية."
  en: "The Phanariots were rich Greek families of the Fener quarter in Istanbul, whose men worked as interpreters and as governors of two European principalities for the Ottoman state."
  ur: "فنارِیوٹ استنبول کے محلے فنر کے امیر یونانی خاندان تھے جن کے لوگ عثمانی ریاست کے لیے مترجم اور یورپ کی دو ریاستوں کے حاکم بنے۔"
