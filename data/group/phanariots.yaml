label: { ar: "الفنارية", en: "Phanariots", ur: "فنارِیوٹ" }
summary:
  ar: "اسم يطلق جماعياً على الأسر الرومية الأرثوذكسية البارزة التي سكنت حي فنر في إسطنبول حول بطريركية الروم. وبحسب دائرة المعارف الإسلامية استعانت بها الدولة العثمانية، خصوصاً في القرن 12هـ/18م وأوائل القرن 13هـ/19م، ترجماناً لدى الباب العالي وفي الترسانة، وعينت منها قرابة قرن من الزمن أمراء الأفلاق والبغدان، من سنة 1123هـ/1711م في البغدان إلى سنة 1821م. وبعد حرب الاستقلال اليونانية هاجر كثير منهم إلى اليونان، ولا يزال أحفاد بعضهم في رومانيا اليوم {cite:encyclopaedia-of-islam-2 vol. 2 p. 918} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1317}."
  en: "The collective name for the leading Greek Orthodox families who settled in the Fener quarter of Istanbul around the Greek Patriarchate. According to the Encyclopaedia of Islam, the Ottoman state drew on them, especially in the 12th/18th and early 13th/19th centuries, as dragomans of the Porte and of the Arsenal, and for over a century appointed members of these families as princes of Wallachia and Moldavia, in Moldavia from 1123/1711 to 1821. After the Greek War of Independence many migrated to Greece, and descendants of some are still found in Romania {cite:encyclopaedia-of-islam-2 vol. 2 p. 918} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1317}."
  ur: "فنر کے محلے، استنبول، میں یونانی پیٹریارکیٹ کے گرد آباد ہونے والے نمایاں یونانی آرتھوڈوکس خاندانوں کا اجتماعی نام۔ اسلامی دائرۃ المعارف کے مطابق عثمانی ریاست نے، خصوصاً بارہویں/اٹھارہویں اور تیرہویں/انیسویں صدی کے آغاز میں، انہیں باب عالی اور بحری ارسنل کے مترجم کے طور پر استعمال کیا اور ایک صدی سے زیادہ مدت تک انہی میں سے والاچیا اور مولداویا کے شہزادے مقرر کیے، مولداویا میں 1123ھ/1711ء سے 1821ء تک۔ یونانی جنگِ آزادی کے بعد بہت سے یونان چلے گئے اور بعض کی نسلیں آج بھی رومانیہ میں ملتی ہیں {cite:encyclopaedia-of-islam-2 vol. 2 p. 918} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1317}۔"
