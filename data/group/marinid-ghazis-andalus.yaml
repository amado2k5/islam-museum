label:
  ar: الغزاة المجاهدون من قرابة بني مرين بالأندلس
  en: The Marinid Ghazi Volunteers of al-Andalus
  es: "Los Voluntarios Mariníes Ghazi de al-Ándalus"
  fr: "Les volontaires ghazi mérinides d'al-Andalus"
  ur: "الاندلس کے مرید غازی رضاکار"
  tr: "Endülüs'teki Banu Marin kabilesinden mücahit işgalciler."
  id: "Para mujahidin penyerbu dari klan Banu Marin di Andalusia."
summary:
  ar: "الأعياص من أولاد عبد الحق بن عبد الحق المريني الذين أجازوا إلى الأندلس متطوعين للجهاد منذ سنة 661هـ، فحسنت آثارهم وكرمت مقاماتهم عند بني الأحمر حتى قاسموهم في الملك وانفردوا برياسة جهادهم؛ عقد لهم ابن الأحمر على الغزاة المجاهدين من زناتة فتداولت الإمارة في بني رحو وبني أبي العلاء إلى عهد ابن خلدون."
  en: "The 'refractory' Marinid princes of the Abd al-Haqq line who crossed to al-Andalus as jihad volunteers from 661 AH — their deeds proved fine and their stations honoured under the Banu al-Ahmar until they shared the Nasrid realm and monopolised the leadership of its jihad, Ibn al-Ahmar appointing their chiefs over the Zenata ghazi-volunteers, the command passing between the Banu Rahhu and Banu Abi al-Ala' houses into Ibn Khaldun's own day."
  es: "Los príncipes mariníes \"refractarios\" de la línea Abd al-Haqq que cruzaron a al-Ándalus como voluntarios de la yihad desde el año 661 AH, demostraron que sus acciones eran buenas y sus posiciones honradas bajo los Banu al-Ahmar hasta que compartieron el reino nazarí y monopolizaron el liderazgo de su yihad. Ibn al-Ahmar nombró a sus jefes por encima de los voluntarios ghazi de Zenata, y el mando pasó entre las casas Banu Rahhu y Banu Abi al-Ala' hasta la época de Ibn Khaldun."
  fr: "Les princes mérinides « réfractaires » de la lignée d'Abd al-Haqq, qui traversèrent en al-Andalus comme volontaires du djihad à partir de 661 AH, virent leurs actes honorables et leurs fonctions honorées sous les Banu al-Ahmar jusqu'à ce qu'ils partagent le royaume nasride et monopolisent la direction de son djihad, Ibn al-Ahmar nommant leurs chefs à la place des volontaires ghazi de Zenata, le commandement passant entre les maisons Banu Rahhu et Banu Abi al-Ala' jusqu'à l'époque d'Ibn Khaldun."
  ur: "عبد الحق لائن کے 'ریفریکٹری' مرینی شہزادے جو 661 ہجری سے جہاد کے رضاکاروں کے طور پر الاندلس میں داخل ہوئے تھے - ان کے اعمال اچھے ثابت ہوئے اور بنو الاحمر کے ماتحت ان کے اسٹیشنوں کو عزت دی گئی یہاں تک کہ انہوں نے نصری سلطنت کا اشتراک کیا اور اس کے جہاد کے سربراہ ابن ابن عمر کی قیادت پر اجارہ داری قائم کی۔ غازی-رضاکار، بنو راہو اور بنو ابی الاعلٰی کے گھروں کے درمیان سے گزرنے والی کمانڈ ابن خلدون کے اپنے دور میں پہنچ گئی۔"
  tr: "Ayalar, Hicri 661 yılından itibaren Endülüs'e cihat için gönüllü olan Abdülhakk ibn Abdülhakk el-Marini'nin soyundan gelmektedir. Soyları sağlamdı ve Banu el-Ahmar tarafından saygı gördüler; ta ki onlarla krallığı paylaşıp cihatlarının tek liderliğini üstlenene kadar. İbn el-Ahmar onları Zenata'dan gelen mücahit akıncılarının başına atadı ve emirlik, İbn Haldun zamanına kadar Banu Rahu ve Banu Abi el-Ala arasında el değiştirdi."
  id: "Kaum Aya adalah keturunan Abd al-Haqq ibn Abd al-Haqq al-Marini, yang secara sukarela pergi ke Andalusia untuk berjihad sejak tahun 661 Hijriah. Jejak mereka baik dan kedudukan mereka dihormati oleh Bani al-Ahmar hingga mereka berbagi kerajaan dengan mereka dan memimpin jihad mereka secara tunggal. Ibnu al-Ahmar menunjuk mereka sebagai pemimpin para mujahidin yang menyerbu Zenata, dan emirat tersebut diwariskan di antara Bani Rahu dan Bani Abi al-Ala hingga masa Ibnu Khaldun."
