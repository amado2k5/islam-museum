label:
  ar: الغزاة المجاهدون من قرابة بني مرين بالأندلس
  en: The Marinid Ghazi Volunteers of al-Andalus
summary:
  ar: "الأعياص من أولاد عبد الحق بن عبد الحق المريني الذين أجازوا إلى الأندلس متطوعين للجهاد منذ سنة 661هـ، فحسنت آثارهم وكرمت مقاماتهم عند بني الأحمر حتى قاسموهم في الملك وانفردوا برياسة جهادهم؛ عقد لهم ابن الأحمر على الغزاة المجاهدين من زناتة فتداولت الإمارة في بني رحو وبني أبي العلاء إلى عهد ابن خلدون."
  en: "The 'refractory' Marinid princes of the Abd al-Haqq line who crossed to al-Andalus as jihad volunteers from 661 AH — their deeds proved fine and their stations honoured under the Banu al-Ahmar until they shared the Nasrid realm and monopolised the leadership of its jihad, Ibn al-Ahmar appointing their chiefs over the Zenata ghazi-volunteers, the command passing between the Banu Rahhu and Banu Abi al-Ala' houses into Ibn Khaldun's own day."
