class: group
label: { ar: "بنو الحارث بن كعب", en: "Banu al-Harith ibn Ka'b", es: "Banu al-Harith ibn Ka'b", fr: "Banu al-Harith ibn Ka'b" }
summary:
  ar: "قبيلة بنجران بعث إليها النبي خالد بن الوليد في ربيع الآخر أو جمادى الأولى سنة 10هـ ليدعوهم ثلاثاً قبل القتال، فأسلموا ولم يقاتلوا، وأقام فيهم خالد يعلمهم ثم قدم بوفدهم على النبي، فأمّر عليهم قيس بن الحصين وبعث إليهم عمرو بن حزم يفقههم ويأخذ صدقاتهم؛ قالوا للنبي إنهم كانوا يغلبون من قاتلهم لأنهم يجتمعون ولا يفترقون ولا يبدؤون أحداً بظلم."
  en: "A tribe of Najran to whom the Prophet sent Khalid ibn al-Walid in Rabi' al-Akhir or Jumada al-Ula 10 AH to call them to Islam for three days before fighting; they converted without a fight, Khalid stayed to teach them and then brought their delegation to the Prophet, who appointed Qays ibn al-Husayn over them and sent Amr ibn Hazm to instruct them and collect their sadaqa. They told the Prophet they used to defeat whoever fought them because they stayed united and never began a wrong."
  es: "Una tribu de Najrán a la que el Profeta envió a Khalid ibn al-Walid en Rabi' al-Akhir o Jumada al-Ula del año 10 de la Hégira para invitarlos al Islam durante tres días antes de la batalla; se convirtieron sin luchar, Khalid se quedó para enseñarles y luego llevó su delegación ante el Profeta, quien nombró a Qays ibn al-Husayn como su jefe y envió a Amr ibn Hazm para instruirlos y recaudar sus sadaqa. Le dijeron al Profeta que solían derrotar a cualquiera que los combatiera porque permanecían unidos y nunca cometían ninguna injusticia."
  fr: "Une tribu de Najran reçut l'envoi de Khalid ibn al-Walid par le Prophète en Rabi' al-Akhir ou Jumada al-Ula de l'an 10 de l'Hégire, afin de les appeler à l'islam pendant trois jours avant le combat. Ils se convertirent sans résistance. Khalid resta sur place pour les instruire, puis conduisit leur délégation auprès du Prophète, qui nomma Qays ibn al-Husayn à leur tête et envoya Amr ibn Hazm pour les former et collecter leurs aumônes. Ils racontèrent au Prophète qu'ils triomphaient toujours de leurs adversaires car ils restaient unis et ne commettaient jamais d'injustice."
