label: { ar: "بنو الحارث بن كعب", en: "Banu al-Harith ibn Ka'b" }
summary:
  ar: "قبيلة بنجران بعث إليها النبي خالد بن الوليد في ربيع الآخر أو جمادى الأولى سنة 10هـ ليدعوهم ثلاثاً قبل القتال، فأسلموا ولم يقاتلوا، وأقام فيهم خالد يعلمهم ثم قدم بوفدهم على النبي، فأمّر عليهم قيس بن الحصين وبعث إليهم عمرو بن حزم يفقههم ويأخذ صدقاتهم؛ قالوا للنبي إنهم كانوا يغلبون من قاتلهم لأنهم يجتمعون ولا يفترقون ولا يبدؤون أحداً بظلم."
  en: "A tribe of Najran to whom the Prophet sent Khalid ibn al-Walid in Rabi' al-Akhir or Jumada al-Ula 10 AH to call them to Islam for three days before fighting; they converted without a fight, Khalid stayed to teach them and then brought their delegation to the Prophet, who appointed Qays ibn al-Husayn over them and sent Amr ibn Hazm to instruct them and collect their sadaqa. They told the Prophet they used to defeat whoever fought them because they stayed united and never began a wrong."
