summary:
  ar: "المسلمية من الاعتقادات التي حدثت بخراسان بعد الإسلام، أصحاب أبي مسلم يعتقدون إمامته ويقولون إنه حي يرزق، فلما قتل المنصور أبا مسلم هرب دعاته إلى نواحي البلاد فوقع رجل يعرف بإسحاق إلى الترك إلى بلاد ما وراء النهر وأقام بها داعية لأبي مسلم وادعى أنه محبوس في جبال الري وأنه يخرج في وقت يعرفونه كما تزعم الكيسانية في محمد بن الحنفية، وذكر قوم أن إسحاق من العلوية من ولد يحيى بن زيد بن علي {cite:fihrist-ibn-al-nadim p. 483}. قال واقد بن عمرو التميمي صاحب أخبار بابك وعند ابن النديم: من الاعتقادات التي حدثت بخراسان بعد الإسلام المسلمية أصحاب أبي مسلم يعتقدون إمامته ويقولون إنه حي يرزق، وكان المنصور لما قتل أبا مسلم هرب دعاته إلى نواحي البلاد فوقع رجل يعرف بإسحاق إلى الترك ببلاد ما وراء النهر فأقام بها داعية لأبي مسلم وادعى أنه محبوس في جبال الري وعندهم أنه يخرج في وقت يعرفونه كما يزعم الكيسانية في محمد بن الحنفية، وقال البلخي بعض الناس يسمي المسلمية الحرمدينية {cite:fihrist-ibn-al-nadim p. 483-484}"
  en: "Abu Muslim's partisans who held he was alive imprisoned in the mountains of Rayy — Ishaq al-Turk's mission in Transoxania {cite:fihrist-ibn-al-nadim p. 483}."
  es: "Los partidarios de Abu Muslim que lo mantenían vivo fueron encarcelados en las montañas de Rayy — la misión de Ishaq al-Turk en Transoxiana {cite:fihrist-ibn-al-nadim p. 483}."
  fr: "Les partisans d'Abu Muslim qui le croyaient vivant, emprisonné dans les montagnes de Rayy — la mission d'Ishaq al-Turk en Transoxiane {cite:fihrist-ibn-al-nadim p. 483}."
  ur: "ابو مسلم کے حامی جنہوں نے اسے پکڑا تھا وہ ری کے پہاڑوں میں زندہ قید تھے - ٹرانسکسانیہ میں اسحاق الترک کا مشن 483}۔"
  tr: "Müslimîyye, İslam'dan sonra Horasan'da ortaya çıkan inançlardan biridir. Ebu Müslim'in takipçileri onun imametine inanır ve hayatta olduğunu ve rızıklandırıldığını söylerler. El-Mansur Ebu Müslim'i öldürdüğünde, vaizleri ülkenin diğer bölgelerine kaçtı. İshak adında bir adam, nehrin ötesindeki topraklardaki Türklere gitti ve orada Ebu Müslim'in vaizi olarak yerleşti. Ray dağlarında hapsedildiğini ve Kaysaniyye'nin Muhammed ibn el-Hanafiyye hakkında iddia ettiği gibi, bildikleri bir zamanda serbest bırakılacağını iddia etti. Bazı kişiler İshak'ın Alevilerden, Yahya ibn Zeyd ibn Ali'nin soyundan olduğunu belirtmiştir. {cite:fihrist-ibn-al-nadim s. 483} Babak'ın haberinin yazarı Vakid ibn Amr el-Tamimi ve İbn el-Nadim şöyle demişlerdir: İslam'dan sonra Horasan'da ortaya çıkan inançlar arasında, imametine inanan ve onun hayatta olduğunu ve rızıklandırıldığını söyleyen Ebu Müslim'in takipçileri olan Müslimîyye de vardı. El-Mansur Ebu Müslim'i öldürdüğünde, vaizleri ülkenin diğer bölgelerine kaçtılar. İshak adında bir adam, nehrin ötesindeki topraklardaki Türklere gitti ve orada Ebu Müslim için vaiz olarak yerleşti ve onun Rayy dağlarında hapsedildiğini iddia etti. Onlar, Kaysaniyye'nin Muhammed ibn el-Hanafiyye hakkında iddia ettiği gibi, onun da bildikleri bir zamanda serbest kalacağına inanıyorlardı. El-Balkhi şöyle demiştir: Bazı insanlar Müslimîyye'ye Harmadiniyye derler. {kaynak: Fihrist-ibn-al-nadim s. 483-484}"
  id: "Islamiyyah adalah salah satu kepercayaan yang muncul di Khorasan setelah Islam. Para pengikut Abu Muslim percaya pada imamatnya dan mengatakan bahwa ia masih hidup dan diberi rezeki. Ketika Al-Mansur membunuh Abu Muslim, para pengkhotbahnya melarikan diri ke berbagai wilayah di negara itu. Seorang pria bernama Ishaq pergi ke Turki di tanah di seberang sungai dan menetapkan dirinya di sana sebagai pengkhotbah untuk Abu Muslim. Ia mengklaim bahwa ia dipenjara di pegunungan Ray dan akan keluar pada waktu yang mereka ketahui, seperti klaim Kaysaniyyah tentang Muhammad ibn al-Hanafiyya. Beberapa orang menyebutkan bahwa Ishaq berasal dari Alawiyah, dari keturunan Yahya ibn Zayd ibn Ali. {cite:fihrist-ibn-al-nadim p. 483}. Waqid ibn Amr al-Tamimi, penulis berita Babak, berkata, dan Ibn al-Nadim berkata: Di antara kepercayaan yang muncul di Khorasan setelah Islam adalah Muslimiyyah, pengikut Abu Muslim, yang percaya pada imamatnya dan mengatakan bahwa ia masih hidup dan diberi rezeki. Ketika al-Mansur membunuh Abu Muslim, para pengkhotbahnya melarikan diri ke berbagai wilayah negara. Seorang pria bernama Ishaq pergi ke Turki di tanah di seberang sungai dan menetap di sana sebagai pengkhotbah untuk Abu Muslim, dengan mengklaim bahwa ia dipenjara di pegunungan Rayy. Mereka percaya bahwa ia akan keluar pada waktu yang mereka ketahui, seperti yang diklaim oleh Kaysaniyyah tentang Muhammad ibn al-Hanafiyya. Al-Balkhi berkata: Sebagian orang menyebut Muslimiyyah sebagai Harmadiniyyah. {cite:fihrist-ibn-al-nadim p. 483-484}"
