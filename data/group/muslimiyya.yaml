label: { ar: "المسلمية", en: "The Muslimiyya" }
summary:
  ar: "المسلمية من الاعتقادات التي حدثت بخراسان بعد الإسلام، أصحاب أبي مسلم يعتقدون إمامته ويقولون إنه حي يرزق، فلما قتل المنصور أبا مسلم هرب دعاته إلى نواحي البلاد فوقع رجل يعرف بإسحاق إلى الترك إلى بلاد ما وراء النهر وأقام بها داعية لأبي مسلم وادعى أنه محبوس في جبال الري وأنه يخرج في وقت يعرفونه كما تزعم الكيسانية في محمد بن الحنفية، وذكر قوم أن إسحاق من العلوية من ولد يحيى بن زيد بن علي {cite:fihrist-ibn-al-nadim p. 483}. قال واقد بن عمرو التميمي صاحب أخبار بابك وعند ابن النديم: من الاعتقادات التي حدثت بخراسان بعد الإسلام المسلمية أصحاب أبي مسلم يعتقدون إمامته ويقولون إنه حي يرزق، وكان المنصور لما قتل أبا مسلم هرب دعاته إلى نواحي البلاد فوقع رجل يعرف بإسحاق إلى الترك ببلاد ما وراء النهر فأقام بها داعية لأبي مسلم وادعى أنه محبوس في جبال الري وعندهم أنه يخرج في وقت يعرفونه كما يزعم الكيسانية في محمد بن الحنفية، وقال البلخي بعض الناس يسمي المسلمية الحرمدينية {cite:fihrist-ibn-al-nadim p. 483-484}"
  en: "Abu Muslim's partisans who held he was alive imprisoned in the mountains of Rayy — Ishaq al-Turk's mission in Transoxania {cite:fihrist-ibn-al-nadim p. 483}."
