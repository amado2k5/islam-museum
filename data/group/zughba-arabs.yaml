summary:
  ar: "زغبة من بطون بني هلال بن عامر؛ مواطنهم في بلاد زناتة خلق كثير، ودانت لهم أعمال الزاب وبسكرة وما بينهما إلى نواحي تلمسان، وكان بينهم وبين بني يعلى أمراء تلمسان حروب ووقائع طالت، ومنهم خرج جل قياد العرب في فتن المغرب الأوسط على عهد بني عبد الواد وبني مرين."
  en: "Zughba of the Hilal ibn Amir branches; a great mass in the Zanata lands who won the districts of the Zab and Biskra out toward Tlemcen's marches — long wars and battles ran between them and the Banu Ya'la amirs of Tlemcen, and most of the Arab captains in the Middle Maghreb's fitnas under the Abd al-Wadids and Marinids came of them."
  es: "Zughba, de las ramas de Hilal ibn Amir; una gran masa en las tierras de Zanata que conquistó los distritos de Zab y Biskra hasta las fronteras de Tlemcen; largas guerras y batallas se sucedieron entre ellos y los emires Banu Ya'la de Tlemcen, y la mayoría de los capitanes árabes en las fitnas del Magreb Medio bajo los Abd al-Wadids y Marinids procedían de ellos."
  fr: "Les Zughba, des branches de Hilal ibn Amir; une grande masse dans les terres de Zanata qui a conquis les districts du Zab et de Biskra jusqu'aux marches de Tlemcen — de longues guerres et batailles ont eu lieu entre eux et les émirs Banu Ya'la de Tlemcen, et la plupart des capitaines arabes dans les fitnas du Moyen Maghreb sous les Abd al-Wadids et les Mérinides sont issus d'eux."
  ur: "ہلال بن عامر کی شاخوں کا زغبہ؛ زناتا سرزمین میں ایک بہت بڑا عوام جس نے زاب اور بسکرا کے اضلاع کو تلمسن کے مارچوں کی طرف جیت لیا - ان کے اور تلمسن کے بنو یالہ امیروں کے درمیان طویل جنگیں اور لڑائیاں ہوئیں، اور مشرق مغرب کے فتنوں میں زیادہ تر عرب کپتان عبد الودیدس اور مرینیوں کے ماتحت آئے۔"
  tr: "Zughba, Beni Hilal bin Amer'in kollarından biridir. Anavatanları Zenata topraklarındadır ve sayıları oldukça fazladır. Zab, Biskra ve bu iki bölge arasında Tlemcen civarına kadar olan topraklar onların egemenliği altındaydı. Aralarında Tlemcen prensleri olan Beni Ya'la ile uzun süren savaşlar ve çatışmalar yaşandı. Beni Abdülvad ve Beni Marin döneminde Orta Mağrip'teki çatışmalarda Arap liderlerinin çoğu onlardan çıkmıştır."
  id: "Zughba adalah salah satu cabang dari Bani Hilal bin Amer. Tanah asal mereka berada di wilayah Zenata, dan jumlah mereka banyak. Wilayah Zab, Biskra, dan daerah di antara keduanya hingga sekitar Tlemcen berada di bawah kekuasaan mereka. Terjadi perang dan pertempuran antara mereka dan Bani Ya’la, para pangeran Tlemcen, yang berlangsung lama. Dari merekalah sebagian besar pemimpin Arab dalam konflik di Maghreb tengah pada masa Bani Abd al-Wad dan Bani Marin berasal."
