  en: Zughba
summary:
  ar: "زغبة من بطون بني هلال بن عامر؛ مواطنهم في بلاد زناتة خلق كثير، ودانت لهم أعمال الزاب وبسكرة وما بينهما إلى نواحي تلمسان، وكان بينهم وبين بني يعلى أمراء تلمسان حروب ووقائع طالت، ومنهم خرج جل قياد العرب في فتن المغرب الأوسط على عهد بني عبد الواد وبني مرين."
  en: "Zughba of the Hilal ibn Amir branches; a great mass in the Zanata lands who won the districts of the Zab and Biskra out toward Tlemcen's marches — long wars and battles ran between them and the Banu Ya'la amirs of Tlemcen, and most of the Arab captains in the Middle Maghreb's fitnas under the Abd al-Wadids and Marinids came of them."
