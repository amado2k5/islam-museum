label:
  ar: الطريقة الشاذلية
  en: The Shadhili order (Shadhiliyya)
  ur: شاذلیہ طریقہ
  es: "La Orden Shadhili (Shadhiliyya)"
  fr: "L'Ordre Shadhili (Shadhiliyya)"
  tr: "Şadhili yöntemi"
  id: "Metode Shadhili"
summary:
  ar: "الطريقة الشاذلية من أعظم طرق الصوفية في المغرب ومصر، منسوبة إلى أبي الحسن الشاذلي؛ يذكر المقري انتقال تصوف الشيخ إلى مريده أبي العباس المرسي الأنصاري {cite:nafh-tib-maqqari} {cite:trimingham-sufi-orders-1998}."
  en: "The Shadhili order is among the greatest Sufi orders of the Maghreb and Egypt, traced to Abu'l-Hasan al-Shadhili; al-Maqqari records the shaykh's Sufi path passing to his disciple Abu'l-Abbas al-Mursi {cite:nafh-tib-maqqari} {cite:trimingham-sufi-orders-1998}."
  es: "La orden Shadhili es una de las órdenes sufíes más importantes del Magreb y Egipto, y se remonta a Abu'l-Hasan al-Shadhili; al-Maqqari registra el camino sufí del shaykh pasando a su discípulo Abu'l-Abbas al-Mursi {cita:nafh-tib-maqqari} {cita:trimingham-sufi-orders-1998}."
  fr: "L'ordre Shadhili est l'un des plus grands ordres soufis du Maghreb et de l'Égypte, remontant à Abu'l-Hasan al-Shadhili; al-Maqqari enregistre le chemin soufi du shaykh transmis à son disciple Abu'l-Abbas al-Mursi {cite:nafh-tib-maqqari} {cite:trimingham-sufi-orders-1998}."
  ur: "شادھیلی ترتیب مغرب اور مصر کے سب سے بڑے صوفی احکامات میں سے ہے، جس کا سراغ ابوالحسن الشہدلی سے ملتا ہے۔ المقری نے اپنے شاگرد ابو العباس المرسی کے پاس جانے والے شیخ کے صوفی راستے کو درج کیا ہے"
  tr: "Ebu el-Hasan el-Şazilî'ye atfedilen Şadhili tarikatı, Fas ve Mısır'daki en büyük Sufi tarikatlarından biridir; el-Makkari, Şeyh'in tasavvufunun müridi Ebu el-Abbas el-Mursi el-Ensari'ye aktarıldığından bahseder {cite:nafh-tib-maqqari} {cite:trimingham-sufi-orders-1998}."
  id: "Tarekat Shadhili adalah salah satu tarekat Sufi terbesar di Maroko dan Mesir, yang dikaitkan dengan Abu al-Hasan al-Shadhili; al-Maqqari menyebutkan perpindahan tasawuf Syekh kepada muridnya Abu al-Abbas al-Mursi al-Ansari {cite:nafh-tib-maqqari} {cite:trimingham-sufi-orders-1998}."
