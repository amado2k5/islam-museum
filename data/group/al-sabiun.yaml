label:
  ar: "الصابئون"
  en: "Al-Sabi'un (the Sabians)"
  ur: "صابئین"
  es: "Al-Sabi'un (los sabeos)"
  fr: "Al-Sabi'un (les Sabiens)"
summary:
  ar: "الصابئون في القرآن أمة تذكر مع المؤمنين واليهود والنصارى والمجوس: قيل فرقة من أهل الكتاب، وقيل قوم يعبدون الكواكب، وهم أهل حران في الجزيرة كما يذكر المؤرخون؛ الآيات الثلاث في البقرة والمائدة والحج هي كل ما نص عليه الوحي من أمرهم، والمفسرون اختلفوا في تعيينهم على ما في تفاسيرهم {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  en: "Al-Sabi'un in the Qur'an are a community named with the believers, the Jews, the Christians and the Magians — said to be a party of the People of the Book, or star-worshippers, and the people of Harran in the Jazira as the historians record. The three verses of al-Baqara, al-Ma'ida and al-Hajj are all that the revelation states of them, and the commentators differ over their identity as their tafsirs show {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  ur: "صابئین قرآن میں وہ قوم ہے جو مومنین، یہود، نصاریٰ اور مجوس کے ساتھ ذکر ہوتی ہے — کہا جاتا ہے اہلِ کتاب کی ایک جماعت یا ستارہ پرست، اور مؤرخین کے نزدیک جزیرہ کے حران کے باشندے؛ بقرہ، مائدہ اور حج کی تین آیات ہی وحی میں ان کے بارے میں نص ہیں اور مفسرین ان کی تعیین میں اختلف کرتے ہیں۔"
  es: "En el Corán, los Al-Sabi'un son una comunidad que incluye a los creyentes, los judíos, los cristianos y los magos, considerados parte de la Gente del Libro, o adoradores de las estrellas, y la gente de Harran en Jazira, según registran los historiadores. Los tres versículos de al-Baqara, al-Ma'ida y al-Hajj son todo lo que la revelación dice sobre ellos, y los comentaristas difieren en su identidad, como muestran sus tafsires {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  fr: "Les Al-Sabi'un, mentionnés dans le Coran, forment une communauté qui inclut les croyants, les juifs, les chrétiens et les mages. Ils seraient un groupe des Gens du Livre, ou adorateurs des astres, et seraient originaires de Harran, en Jazira, comme l'attestent les historiens. Les trois versets d'al-Baqara, d'al-Ma'ida et d'al-Hajj sont les seuls éléments révélés à leur sujet, et les commentateurs divergent quant à leur identité, comme le montrent leurs tafsirs (exégèses)."
