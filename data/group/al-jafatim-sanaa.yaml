id: group/al-jafatim-sanaa
class: group
label:
  ar: "الجفاتم في خبر صنعاء"
  en: "The Jafatim in the Sana'a account"
  ur: "صنعاء کے بیان میں جفاتم"
  es: "Los Jafatim en el relato de Sana'a"
  fr: "Le récit des Jafatim à Sanaa"
summary:
  ar: "جماعة من العجم من جند جفتم كانت مع أبي العتاهية بصنعاء، يصفها الراوي بالفسق والظلم وأمرها أبو العتاهية بكمين بالسر."
  en: "A body of non-Arab troops of Jund Jaftam with Abu al-Atahiya at Sana'a, whom the narrator calls sinful and unjust and whom Abu al-Atahiya sent to lie in ambush at al-Sirr."
  ur: "جند جفتم کے عجمی سپاہیوں کی ایک جماعت جو صنعاء میں ابو العتاہیہ کے ساتھ تھی، جسے راوی فاسق اور ظالم کہتا ہے اور جسے ابو العتاہیہ نے السر میں کمین کے لیے بھیجا۔"
  es: "Un grupo de tropas no árabes de Jund Jaftam con Abu al-Atahiya en Sana'a, a quienes el narrador llama pecadores e injustos y a quienes Abu al-Atahiya envió a tender una emboscada en al-Sirr."
  fr: "Un corps de troupes non arabes de Jund Jaftam avec Abu al-Atahiya à Sana'a, que le narrateur qualifie de pécheurs et d'injustes et qu'Abu al-Atahiya a envoyés tendre une embuscade à al-Sirr."
