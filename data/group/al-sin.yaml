summary:
  ar: "الصين في كتب الحديث والجغرافيا: «اطلبوا العلم ولو في الصين» على ضعفه مشهور، وكتب الرحالة كسليمان التاجر تصف بلادها وملوكها وبحرها وعاداتها، والفتوح وصلت أطرافها الشرقية في عهد قتيبة {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  en: "Al-Sin — China — in the books of hadith and geography: the famous «seek knowledge even unto China» (weak though it is), the travel books like Sulayman the Merchant's describing its land, kings, sea and customs, and the conquests reaching its eastern marches under Qutayba {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  ur: "چین حدیث اور جغرافیہ کی کتابوں میں: مشہور حدیث «علم طلب کرو خواہ چین میں کیوں نہ ہو» ⁦(کمزور صحت کے باوجود)⁩، سلیمان تاجر جیسی سیاحت کی کتب اس کی سرزمین، بادشاہوں، سمندر اور رسومات کی تصویر پیش کرتی ہیں، اور فتوحات قتیبہ کے عہد میں اس کے مشرقی سرحدوں تک پہنچیں۔"
  es: "Al-Sin — China — en los libros de hadices y geografía: el famoso «buscad conocimiento incluso hasta China» (aunque débil), los libros de viajes como el de Sulayman el Mercader que describen su tierra, reyes, mar y costumbres, y las conquistas que llegaron a sus fronteras orientales bajo Qutayba {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  fr: "Al-Sin — la Chine — dans les livres de hadiths et de géographie: le célèbre « cherchez la connaissance jusqu'en Chine » (bien que faible), les livres de voyage comme celui de Sulayman le Marchand décrivant son pays, ses rois, sa mer et ses coutumes, et les conquêtes atteignant ses marches orientales sous Qutayba {cite:kamil-ibn-al-athir} {cite:muqaddima-ibn-khaldun}."
  tr: "Hadis ve Coğrafya Kitaplarında Çin: Zayıf yönlerine rağmen, \"İlim aramak için Çin'i bile arayın\" sözü iyi bilinmektedir. Süleyman gibi seyyahlar Çin toprakları, kralları, denizi ve gelenekleri hakkında yazmış, Kuteybe döneminde ise fetihler doğu sınırlarına kadar ulaşmıştır."
  id: "Tiongkok dalam Kitab Hadits dan Geografi: “Carilah ilmu meskipun hanya di Tiongkok” adalah ungkapan yang terkenal meskipun negara ini lemah. Para pelancong seperti Sulaiman sang Pedagang menulis tentang tanah, raja, laut, dan adat istiadatnya, dan penaklukan mencapai perbatasan timurnya pada masa Qutaybah."
