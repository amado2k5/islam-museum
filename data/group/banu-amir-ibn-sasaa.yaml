label: { ar: "بنو عامر بن صعصعة", en: "Banu Amir ibn Sa'sa'a", es: "Banu Amir ibn Sa'sa'a", fr: "Banu Amir ibn Sa'sa'a", ur: "بنو عامر بن صعصع", tr: "Banu Amir ibn Sa'sa'ah", id: "Banu Amir ibn Sa'sa'ah" }
summary:
  ar: "قبيلة قيسية كبيرة في نجد، من بطونها كلاب وجعفر بن كلاب؛ قدم وفدها على النبي سنة 9هـ وفيه عامر بن الطفيل وأربد بن قيس بن جزء بن خالد بن جعفر وجبار بن سلمى بن مالك بن جعفر، ويصف ابن إسحاق الثلاثة بأنهم رؤساء القوم."
  en: "A large Qaysi tribe of Najd whose clans include Kilab and Ja'far ibn Kilab; its delegation came to the Prophet in 9 AH with Amir ibn al-Tufayl, Arbad ibn Qays ibn Juz' ibn Khalid ibn Ja'far and Jabbar ibn Salma ibn Malik ibn Ja'far, whom Ibn Ishaq calls the chiefs of the people."
  es: "Una gran tribu Qaysi de Najd, cuyos clanes incluyen a Kilab y Ja'far ibn Kilab; su delegación llegó al Profeta en el año 9 de la Hégira con Amir ibn al-Tufayl, Arbad ibn Qays ibn Juz' ibn Khalid ibn Ja'far y Jabbar ibn Salma ibn Malik ibn Ja'far, a quienes Ibn Ishaq llama los jefes del pueblo."
  fr: "Une importante tribu Qaysi du Najd dont les clans comprennent Kilab et Ja'far ibn Kilab; sa délégation est venue auprès du Prophète en 9 AH avec Amir ibn al-Tufayl, Arbad ibn Qays ibn Juz' ibn Khalid ibn Ja'far et Jabbar ibn Salma ibn Malik ibn Ja'far, qu'Ibn Ishaq appelle les chefs du peuple."
  ur: "نجد کا ایک بڑا قیسی قبیلہ جس کے قبیلوں میں کلاب اور جعفر ابن کلاب شامل ہیں۔ اس کا وفد 9 ہجری میں امیر بن طفیل، ارباد بن قیس ابن جوز ابن خالد ابن جعفر اور جبار بن سلمہ بن مالک بن جعفر کے ساتھ نبی کے پاس آیا، جنہیں ابن اسحاق نے لوگوں کا سردار کہا ہے۔"
  tr: "Necd'de büyük bir Kaysi kabilesi olan bu kabilenin kolları arasında Kilab ve Cafer ibn Kilab da bulunmaktadır; onların heyeti Hicri 9. yılda Peygamber'in huzuruna gelmiş ve heyette Emir ibn el-Tüfeyl, Arbad ibn Kays ibn Cüz' ibn Halid ibn Cafer ve Cebber ibn Salma ibn Malik ibn Cafer yer almıştır. İbn İshak, bu üç kişiyi halkın önderleri olarak tanımlamıştır."
  id: "Suku Qaysi yang besar di Najd, yang cabangnya termasuk Kilab dan Ja'far ibn Kilab; delegasi mereka datang kepada Nabi pada tahun 9 H, dan termasuk `Amir ibn al-Tufayl, Arbad ibn Qays ibn Juz` ibn Khalid ibn Ja'far, dan Jabbar ibn Salma ibn Malik ibn Ja'far. Ibn Ishaq menggambarkan ketiganya sebagai pemimpin kaum tersebut."
