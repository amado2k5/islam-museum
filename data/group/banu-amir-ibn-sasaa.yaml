summary:
  ar: "قبيلة قيسية كبيرة في نجد، من بطونها كلاب وجعفر بن كلاب؛ قدم وفدها على النبي سنة 9هـ وفيه عامر بن الطفيل وأربد بن قيس بن جزء بن خالد بن جعفر وجبار بن سلمى بن مالك بن جعفر، ويصف ابن إسحاق الثلاثة بأنهم رؤساء القوم."
  en: "A large Qaysi tribe of Najd whose clans include Kilab and Ja'far ibn Kilab; its delegation came to the Prophet in 9 AH with Amir ibn al-Tufayl, Arbad ibn Qays ibn Juz' ibn Khalid ibn Ja'far and Jabbar ibn Salma ibn Malik ibn Ja'far, whom Ibn Ishaq calls the chiefs of the people."
