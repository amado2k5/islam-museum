summary:
  ar: "قوم من نحو 85,000 من المزارعين المستقرين في وديان أنهار جنوب شرق مدغشقر، معظمهم من المسلمين الأوائل الذين وصلوا من جزر القمر، وقد حافظوا على الكتابة العربية والتقويم القمري والتنجيم بالجيومانسيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  en: "A people of some 85,000 settled farmers in the low river valleys of south-eastern Madagascar, whose ancestors came through the Comoros with Islamic elements and left Arabic writing and an astrological calendar {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
