summary:
  ar: "قوم من نحو 85,000 من المزارعين المستقرين في وديان أنهار جنوب شرق مدغشقر، معظمهم من المسلمين الأوائل الذين وصلوا من جزر القمر، وقد حافظوا على الكتابة العربية والتقويم القمري والتنجيم بالجيومانسيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  en: "A people of some 85,000 settled farmers in the low river valleys of south-eastern Madagascar, whose ancestors came through the Comoros with Islamic elements and left Arabic writing and an astrological calendar {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  es: "Un pueblo de unos 85.000 agricultores asentados en los valles bajos de los ríos del sureste de Madagascar, cuyos antepasados llegaron a través de las Comoras con elementos islámicos y dejaron escritura árabe y un calendario astrológico {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  fr: "Un peuple d'environ 85 000 agriculteurs sédentarisés dans les basses vallées fluviales du sud-est de Madagascar, dont les ancêtres sont venus par les Comores avec des éléments islamiques et ont laissé l'écriture arabe et un calendrier astrologique {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
  ur: "تقریباً 85,000 کے لوگوں نے جنوب مشرقی مڈغاسکر کی نچلی ندیوں کی وادیوں میں کسانوں کو آباد کیا، جن کے آباؤ اجداد اسلامی عناصر کے ساتھ کوموروس کے راستے آئے اور عربی تحریر اور نجومی کیلنڈر چھوڑ دیا۔ 1 ص۔ 546}۔"
  tr: "Madagaskar'ın güneydoğusundaki nehir vadilerinde yaşayan, çoğunluğu Komor Adaları'ndan gelen ilk Müslümanlardan oluşan yaklaşık 85.000 kişilik bir çiftçi topluluğu, Arap yazısını, ay takvimini ve astrolojiyi geomancia (İslam Ansiklopedisi 2. cilt, 1. sayfa 546) adı verilen bir gelenekte korumuştur."
  id: "Sekitar 85.000 penduduk yang menetap sebagai petani di lembah-lembah sungai di tenggara Madagaskar, sebagian besar adalah Muslim awal yang datang dari Kepulauan Komoro, telah melestarikan tulisan Arab, kalender lunar, dan astrologi dalam geomansia {cite:encyclopaedia-of-islam-2 vol. 1 p. 546}."
