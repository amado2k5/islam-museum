summary:
  ar: "بطاقة أولية للطريقة الأحمدية البدوية، الطريقة الصوفية التي أسسها أحمد البدوي في طنطا في القرن الثالث عشر وصارت من أوسع طرق مصر؛ لم تُراجع الصفحة بعد."
  en: "Draft card for the Ahmadiyya-Badawiyya, the Sufi order founded by Ahmad al-Badawi at Tanta in the thirteenth century, later among Egypt's most widespread orders; the source entry is not yet checked on the page."
  es: "Ficha preliminar para la Ahmadiyya-Badawiyya, la orden sufí fundada por Ahmad al-Badawi en Tanta en el siglo XIII, que más tarde se convirtió en una de las órdenes más extendidas de Egipto; la entrada de la fuente aún no se ha comprobado en la página."
  fr: "Fiche de projet pour l'Ahmadiyya-Badawiyya, l'ordre soufi fondé par Ahmad al-Badawi à Tanta au XIIIe siècle, devenu par la suite l'un des ordres les plus répandus d'Égypte; la source n'est pas encore vérifiée sur la page."
  ur: "احمدیہ بدویہ کے لیے ڈرافٹ کارڈ، صوفی حکم جسے احمد البداوی نے تیرہویں صدی میں طنطہ میں قائم کیا تھا، بعد میں مصر کے سب سے زیادہ وسیع احکامات میں سے؛ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Ahmed el-Badavi tarafından 13. yüzyılda Tanta'da kurulan ve Mısır'ın en geniş tarikatlarından biri haline gelen Ahmediye Badaviye tarikatının ön tanıtım kartı; sayfa henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk tarekat Ahmadiyah Badawiyya, tarekat Sufi yang didirikan oleh Ahmad al-Badawi di Tanta pada abad ke-13 dan yang menjadi salah satu tarekat terluas di Mesir; halaman ini belum ditinjau."
