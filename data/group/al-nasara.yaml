label:
  ar: "النصارى"
  en: "Al-Nasara (the Christians)"
  ur: "نصاریٰ"
  es: "Al-Nasara (los cristianos)"
  fr: "Al-Nasara (les chrétiens)"
  tr: "Hristiyanlar"
  id: "orang Kristen"
summary:
  ar: "النصارى عند المصادر أهل الإنجيل والتابعون لعيسى بن مريم على ما في كتبهم: العرب النصارى من غسان ولخم وتغلب ونجران، وأهل الشام والحبشة والقبط ممن دان بالنصرانية قبل الإسلام وفي زمنه؛ القرآن يسميهم النصارى ويسأل عن قربهم وبعدهم من المؤمنين، والسيرة تحفظ وفد نجران وكتاب النبي لهرقل ونجاشي الحبشة {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "Al-Nasara in the sources are the people of the Gospel who followed 'Isa ibn Maryam as their books record: the Christian Arabs of Ghassan, Lakhm, Taghlib and Najran, and the people of al-Sham, Abyssinia and the Copts who confessed Christianity before Islam and in its time. The Qur'an names them al-Nasara and speaks of their nearness and distance from the believers; the Sira keeps the delegation of Najran, the Prophet's letter to Heraclius and the Negus of Abyssinia {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "نصاریٰ مصادر میں اہلِ انجیل ہیں جو عیسیٰ ابن مریم کی پیروی میں تھے جیسا کہ ان کی کتب بیان کرتی ہیں: غسان، لخم، تغلب اور نجران کے مسیحی عرب، اور شام، حبشہ اور قبطی قوم جو اسلام سے پہلے اور اس کے زمانے میں نصارت پر تھی؛ قرآن انہیں نصاریٰ کہتا ہے اور سیرت نجران کے وفد، نبی کے ہرقل کے نام خط اور حبشہ کے نجاشی کا ذکر محفوظ رکھتی ہے۔"
  es: "Al-Nasara en las fuentes es la gente del Evangelio que siguió a 'Isa ibn Maryam como lo registran sus libros: los árabes cristianos de Ghassan, Lakhm, Taghlib y Najran, y la gente de al-Sham, Abisinia y los coptos que confesaron el cristianismo antes del Islam y en su tiempo. El Corán los llama al-Nasara y habla de su cercanía y distancia de los creyentes; la Sira mantiene la delegación de Najran, la carta del Profeta a Heraclio y el Negus de Abisinia {cita:tafsir-tabari-shakir-v01} {cita:ibn-hisham-sira} {cita:mubarakpuri-raheeq}."
  fr: "Al-Nasara dans les sources sont les gens de l'Évangile qui ont suivi 'Isa ibn Maryam comme le rapportent leurs livres: les Arabes chrétiens de Ghassan, Lakhm, Taghlib et Najran, et les gens d'al-Sham, d'Abyssinie et les Coptes qui ont confessé le christianisme avant l'Islam et en son temps. Le Coran les nomme al-Nasara et parle de leur proximité et de leur distance par rapport aux croyants; la Sira conserve la délégation de Najran, la lettre du Prophète à Héraclius et au Négus d'Abyssinie {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  tr: "Kaynaklara göre, Hristiyanlar, kitaplarında belirtildiği gibi, İncil halkı ve Meryem oğlu İsa'nın takipçileridir: Ghassan, Lakhm, Taghlib ve Najran'dan gelen Hristiyan Araplar ve İslam'dan önce ve İslam döneminde Hristiyanlığı benimseyen Levant, Habeşistan ve Kıptiler; Kur'an onları Hristiyan olarak adlandırır ve inananlarla olan yakınlıklarını ve uzaklıklarını sorar; biyografi ise Najran heyetini ve Peygamber'in Heraklius'a ve Habeşistan Negusu'na yazdığı mektubu korur. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}"
  id: "Menurut sumber-sumber tersebut, orang Kristen adalah umat Injil dan pengikut Yesus, putra Maria, sebagaimana dinyatakan dalam kitab-kitab mereka: orang Arab Kristen dari Ghassan, Lakhm, Taghlib, dan Najran, dan penduduk Levant, Abyssinia, dan orang Koptik yang memeluk agama Kristen sebelum Islam dan pada masanya; Al-Qur'an menyebut mereka Kristen dan menanyakan tentang kedekatan dan jarak mereka dari orang-orang beriman, dan biografi tersebut menyimpan delegasi Najran dan surat Nabi kepada Heraclius dan Negus dari Abyssinia {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
