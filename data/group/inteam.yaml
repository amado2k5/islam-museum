summary:
  ar: "فرقة نشيد ماليزية تأسست سنة 1998 على أيدي أربعة طلاب في مركز التمهيدي بالجامعة الإسلامية العالمية بماليزيا، تؤدي الأناشيد بالملايوية والإنجليزية والعربية، وعُرفت بأغنية «كاسيه ككاسيه» نحو سنة 2000؛ بلغ عدد مشتركي قناتها على يوتيوب ⁦(@inteamdigital)⁩ 1,140,000 مشترك بحسب عدّاد vidIQ كما حُدّث في 10 نوفمبر 2026، مع 354,500,000 مشاهدة و1,725 مقطعًا."
  en: "A Malaysian nasyid group founded in 1998 by four students at the UIA Matriculation Center in Malaysia, performing nasheed in Malay, English and Arabic and introduced through the song 'Kasih Kekasih' around 2000 under the management of Hijjaz Records; its YouTube channel, Inteam Digital (@inteamdigital), counted 1,140,000 subscribers by vidIQ's count as updated on 10 November 2026, with 354,500,000 views and 1,725 videos."
  ur: "ملائیشیا کا نشید گروپ جو 1998ء میں ملائیشیا کی بین الاقوامی اسلامی یونیورسٹی کے میٹرک سینٹر کے چار طلبہ نے قائم کیا؛ یہ مالے، انگریزی اور عربی میں نشید پیش کرتا ہے اور تقریباً 2000ء میں «کاسیہ ککاسیہ» سے متعارف ہوا؛ اس کے یوٹیوب چینل ان ٹیم ڈیجیٹل ⁦(@inteamdigital)⁩ کے سبسکرائبرز کی تعداد 10 نومبر 2026ء کو اپ ڈیٹ کیے گئے vidIQ کے شمار کے مطابق 1,140,000 تھی، جبکہ اس کی ویڈیوز 1,725 اور ویوز 354,500,000 تھے۔"
