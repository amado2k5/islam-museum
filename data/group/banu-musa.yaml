label: { ar: "بنو موسى", en: "Banu Musa" }
summary:
  ar: "محمد وأحمد والحسن بنو موسى بن شاكر، وهؤلاء القوم ممن تناهى في طلب العلوم القديمة وبذل فيها الرغائب وأتعبوا فيها نفوسهم وأنفذوا إلى بلد الروم من أخرجها إليهم فأحضروا النقلة من الأصقاع والأماكن بالبذل السني فأظهروا عجائب الحكمة، وكان الغالب عليهم من العلوم الهندسة والحيل والحركات والموسيقى والنجوم، وتوفي محمد بن موسى سنة تسع وخمسين ومائتين في شهر ربيع الأول، وكان لأحمد بن موسى ابن يقال له مطهر دخل في جملة ندماء المعتضد، ومن كتبهم كتاب بني موسى في الفرستون وكتاب الحيل لأحمد بن موسى وكتاب الشكل المدور المستطيل للحسن بن موسى وكتاب حركة الفلك الأولى لمحمد وكتاب المخروطات {cite:fihrist-ibn-al-nadim p. 378-379}."
  en: "The Banu Musa — Muhammad, Ahmad and al-Hasan, who sent to Byzantium for the ancient sciences; patrons of Thabit and the translators {cite:fihrist-ibn-al-nadim}"
wings: [people]
sources: [source/fihrist-ibn-al-nadim]
