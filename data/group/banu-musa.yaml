summary:
  ar: "محمد وأحمد والحسن بنو موسى بن شاكر، وهؤلاء القوم ممن تناهى في طلب العلوم القديمة وبذل فيها الرغائب وأتعبوا فيها نفوسهم وأنفذوا إلى بلد الروم من أخرجها إليهم فأحضروا النقلة من الأصقاع والأماكن بالبذل السني فأظهروا عجائب الحكمة، وكان الغالب عليهم من العلوم الهندسة والحيل والحركات والموسيقى والنجوم، وتوفي محمد بن موسى سنة تسع وخمسين ومائتين في شهر ربيع الأول، وكان لأحمد بن موسى ابن يقال له مطهر دخل في جملة ندماء المعتضد، ومن كتبهم كتاب بني موسى في الفرستون وكتاب الحيل لأحمد بن موسى وكتاب الشكل المدور المستطيل للحسن بن موسى وكتاب حركة الفلك الأولى لمحمد وكتاب المخروطات {cite:fihrist-ibn-al-nadim p. 378-379}."
  en: "The Banu Musa — Muhammad, Ahmad and al-Hasan, who sent to Byzantium for the ancient sciences; patrons of Thabit and the translators {cite:fihrist-ibn-al-nadim}"
  es: "Los Banu Musa — Muhammad, Ahmad y al-Hasan, quienes enviaron mensajeros a Bizancio para conocer las ciencias antiguas; mecenas de Thabit y los traductores {cite:fihrist-ibn-al-nadim}"
  fr: "Les Banu Musa — Muhammad, Ahmad et al-Hasan, qui envoyèrent des messagers à Byzance pour les sciences anciennes; protecteurs de Thabit et des traducteurs {cite:fihrist-ibn-al-nadim}"
  ur: "بنو موسیٰ - محمد، احمد اور الحسن، جنہوں نے قدیم علوم کے لیے بازنطیم بھیجا تھا۔ ثابت کے سرپرست اور مترجم {حوالہ: فہرست ابن الندیم}"
  tr: "Musa ibn Şakir'in oğulları Muhammed, Ahmed ve Hasan, eski ilimleri araştırmada üstün başarı gösteren, bu alanda büyük çaba sarf eden ve kendilerini tüketenler arasındaydı. Romalılara, bu ilimleri geri getirenleri gönderdiler ve cömert harcamalarla çeşitli bölgelerden ve yerlerden âlimler getirdiler ve hikmetin harikalarını ortaya koydular. Bunlar arasında en öne çıkan ilimler geometri, mekanik, hareket, müzik ve astronomiydi. Muhammed ibn Musa, 259 yılında Rebiü'l-Evvel ayında vefat etti. Ahmed ibn Musa'nın, Mu'tedid'in sahabelerinden biri olan Mutahhar adında bir oğlu vardı. Kitapları arasında Musa oğullarının Forston kitabı, Ahmed ibn Musa'nın mekanik kitabı, Hasan ibn Musa'nın yuvarlak ve dikdörtgen şekiller kitabı, Muhammed'in gök küresinin ilk hareketi kitabı ve konik kesitler kitabı bulunmaktadır. 378-379}."
  id: "Muhammad, Ahmad, dan al-Hasan, putra-putra Musa ibn Shakir, termasuk di antara mereka yang unggul dalam mencari ilmu-ilmu kuno, mengerahkan upaya besar di dalamnya, dan mencurahkan seluruh tenaga mereka di dalamnya. Mereka mengirimkan orang-orang ke negeri Romawi yang membawa ilmu-ilmu itu kembali, dan mereka membawa para ulama dari berbagai daerah dan tempat dengan pengeluaran yang besar, dan mereka mengungkapkan keajaiban-keajaiban kebijaksanaan. Ilmu-ilmu yang dominan di antara mereka adalah geometri, mekanika, gerak, musik, dan astronomi. Muhammad ibn Musa wafat pada tahun 259 pada bulan Rabi' al-Awwal. Ahmad ibn Musa memiliki seorang putra bernama Mutahhar yang menjadi salah satu sahabat al-Mu'tadid. Di antara buku-buku mereka adalah buku putra-putra Musa tentang Forston, buku mekanika karya Ahmad ibn Musa, buku tentang bentuk bulat dan persegi panjang karya al-Hasan ibn Musa, buku tentang gerakan pertama bola langit karya Muhammad, dan buku tentang irisan kerucut {cite:fihrist-ibn-al-nadim p. 378-379}."
