label: { ar: "قضاعة", en: "Qudaʾa" }
summary:
  ar: "بطن كبير من حمير يخالف بعض النسابين في نسبته؛ هجر اليمن واستوطن بادية السماوة من مشارف العراق، ثم ارتحل في عهد أردشير إلى الشام، ومنه بنو سليح الضجاعمة أول ملوك العرب بالشام.، وكانت قضاعة بن مالك بن حمير أول من نزل الشام وانضافوا إلى ملوك الروم فملكوهم بعد أن دخلوا في النصرانية على من حوى الشام من العرب، وقد تنازع فيهم أمن معد كانوا أم من قحطان وقضاعة تأبى أن تكون من معد {cite:muruj-al-dhahab p. 425}"
  en: "A great tribe of Himyarite affiliation (debated); it left Yemen for the Samawa steppe on Iraq’s edge, moved on to al-Sham under Ardashir’s pressure, and produced the Salihids — the Dajaʾima — Rome’s first Arab client kings."
