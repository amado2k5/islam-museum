label: { ar: "قضاعة", en: "Qudaʾa", es: "Quda'a", fr: "Qudaʾa", ur: "قدا" }
summary:
  ar: "بطن كبير من حمير يخالف بعض النسابين في نسبته؛ هجر اليمن واستوطن بادية السماوة من مشارف العراق، ثم ارتحل في عهد أردشير إلى الشام، ومنه بنو سليح الضجاعمة أول ملوك العرب بالشام. وكانت قضاعة بن مالك بن حمير أول من نزل الشام وانضافوا إلى ملوك الروم فملكوهم بعد أن دخلوا في النصرانية على من حوى الشام من العرب، وقد تنازع فيهم أمن معد كانوا أم من قحطان وقضاعة تأبى أن تكون من معد {cite:muruj-al-dhahab p. 425}"
  en: "A great tribe of Himyarite affiliation (debated); it left Yemen for the Samawa steppe on Iraq’s edge, moved on to al-Sham under Ardashir’s pressure, and produced the Salihids — the Dajaʾima — Rome’s first Arab client kings."
  es: "Una gran tribu de afiliación himyarita (según debate); abandonó Yemen para dirigirse a la estepa de Samawa, en la frontera con Irak, se trasladó a al-Sham bajo la presión de Ardashir y produjo a los salihidas —los dajaʾima—, los primeros reyes árabes vasallos de Roma."
  fr: "Une grande tribu d'affiliation himyarite (contestée); elle quitta le Yémen pour la steppe de Samawa à la frontière de l'Irak, se déplaça vers al-Sham sous la pression d'Ardashir et donna naissance aux Salihides — les Daja'ima — les premiers rois clients arabes de Rome."
  ur: "ہمیاریت سے وابستگی کا ایک بڑا قبیلہ ⁦(بحث)⁩ اس نے یمن کو عراق کے کنارے سماوہ کے میدان کے لیے چھوڑا، اردشیر کے دباؤ میں الشام کی طرف بڑھا، اور صالحیوں کو پیدا کیا - دجاما - روم کے پہلے عرب کلائنٹ بادشاہ۔"
