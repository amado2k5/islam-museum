label: { ar: "الدعوة العباسية" }
summary:
  ar: "الدعوة العباسية حركة سرية قامت حول إمام من آل البيت — محمد بن علي العباسي الذي آلت إليه الدعوة وسعى لنيل الخلافة — يرعى التنظيمات ويوجه النقباء والدعاة ويقودهم؛ وضع المشرفون عليها تنظيماً إدارياً سرياً في سلسلة مراتب: النقباء الاثنا عشر مساعدو الأئمة وهم وحدهم يعرفون سر الإمام ويحتفظون به، ويليهم نظراء النقباء بعدد النقباء ويحل النظير محل النقيب عند وفاته، ثم سبعون داعية يأتمرون بأمر النقباء ويتولون إعداد الأنصار نفسياً وثقافياً وإحداث الثورة، ثم دعاة الدعاة، ثم طبقة العمال الذين يديرون الجهاز السري لكل داعٍ عدد من العاملين، وينتهي الجهاز بخلايا سرية تتوغل في عمق المجتمع في كافة الأمصار؛ وقام منطق الجهاز على شعارات المساواة والإمامة للرضا من آل محمد والدعوة إلى الإصلاح {cite:tarikh-dawla-abbasiyya-taqqush p. 18-19}."
  en: "The Abbasid da'wa — the clandestine hierarchy around the Hashimite imam: twelve naqibs who alone knew the imam's identity, their nazirs, seventy du'at, sub-du'at and 'ummal down to secret cells in every garrison town, preaching equality and 'the acceptable one of the house of Muhammad' {cite:tarikh-dawla-abbasiyya-taqqush p. 18-19}."
