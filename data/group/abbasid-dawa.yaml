label: { ar: "الدعوة العباسية", en: "Abbasid da'wa", es: "Abasí da'wa", fr: "da'wa abbasside", ur: "عباسی دعوت", tr: "Abbasi Çağrısı", id: "Seruan Abbasiyah" }
summary:
  ar: "الدعوة العباسية حركة سرية قامت حول إمام من آل البيت — محمد بن علي العباسي الذي آلت إليه الدعوة وسعى لنيل الخلافة — يرعى التنظيمات ويوجه النقباء والدعاة ويقودهم؛ وضع المشرفون عليها تنظيماً إدارياً سرياً في سلسلة مراتب: النقباء الاثنا عشر مساعدو الأئمة وهم وحدهم يعرفون سر الإمام ويحتفظون به، ويليهم نظراء النقباء بعدد النقباء ويحل النظير محل النقيب عند وفاته، ثم سبعون داعية يأتمرون بأمر النقباء ويتولون إعداد الأنصار نفسياً وثقافياً وإحداث الثورة، ثم دعاة الدعاة، ثم طبقة العمال الذين يديرون الجهاز السري لكل داعٍ عدد من العاملين، وينتهي الجهاز بخلايا سرية تتوغل في عمق المجتمع في كافة الأمصار؛ وقام منطق الجهاز على شعارات المساواة والإمامة للرضا من آل محمد والدعوة إلى الإصلاح {cite:tarikh-dawla-abbasiyya-taqqush p. 18-19}."
  en: "The Abbasid da'wa — the clandestine hierarchy around the Hashimite imam: twelve naqibs who alone knew the imam's identity, their nazirs, seventy du'at, sub-du'at and 'ummal down to secret cells in every garrison town, preaching equality and 'the acceptable one of the house of Muhammad' {cite:tarikh-dawla-abbasiyya-taqqush p. 18-19}."
  es: "La da'wa abasí — la jerarquía clandestina en torno al imán hachemita: doce naqibs que eran los únicos que conocían la identidad del imán, sus nazirs, setenta du'at, sub-du'at y 'ummal hasta células secretas en cada ciudad guarnición, predicando la igualdad y 'el aceptable de la casa de Muhammad' {cite:tarikh-dawla-abbasiyya-taqqush p. 18-19}."
  fr: "La da'wa abbasside — la hiérarchie clandestine autour de l'imam hachémite: douze naqibs qui seuls connaissaient l'identité de l'imam, leurs nazirs, soixante-dix du'at, sous-du'at et 'ummal jusqu'aux cellules secrètes dans chaque ville de garnison, prêchant l'égalité et « l'acceptable de la maison de Muhammad » {cite: tarikh-dawla-abbasiyya-taqqush p. 18-19}."
  ur: "عباسی دعوۃ - ہاشمی امام کے ارد گرد پوشیدہ درجہ بندی: بارہ نقیب جو اکیلے امام کی شناخت جانتے تھے، ان کے ناظرین، ستر دعائیں، ذیلی دعا اور 'امل' ہر چھاؤنی میں خفیہ خانوں تک پہنچتے تھے، مساوات کی تبلیغ کرتے تھے اور 'محمد کے گھر میں سے قابل قبول' تھے۔ {حوالہ: تاریخ الدولہ عباسیہ التقوش صفحہ 18-19}۔"
  tr: "Abbasi hareketi, Peygamber ailesinden bir İmam olan Muhammed ibn Ali el-Abbasi'nin etrafında ortaya çıkan gizli bir hareketti. Hareketin liderliğini üstlenen ve halifeliği hedefleyen İmam, örgütleri denetledi, liderleri ve vaizleri yönlendirdi ve onlara önderlik etti. Hareketin sorumluları, bir dizi kademeden oluşan gizli bir idari örgüt kurdular: İmamların sırlarını bilen ve koruyan on iki lider, ardından her lider için birer yardımcı olan ve liderin ölümünden sonra onun yerini alacak olan yardımcılar, sonra liderlerin emirlerine itaat eden ve destekçileri psikolojik ve kültürel olarak hazırlamaktan ve devrimi gerçekleştirmekten sorumlu yetmiş vaiz, ardından vaizlerin vaizleri, daha sonra gizli aygıtı yöneten işçiler sınıfı (her vaizin bir dizi işçisi vardı) ve aygıt, tüm şehirlerde toplumun derinliklerine nüfuz eden gizli hücrelerle son buluyordu. Bu düzenekteki mantık, eşitlik sloganlarına, Muhammed ailesinden Allah'ı razı edenin imametine ve reform çağrısına dayanıyordu. {cite:tarikh-dawla-abbasiyya-taqqush s. 18-19}."
  id: "Gerakan Abbasiyah adalah gerakan rahasia yang muncul di sekitar seorang Imam dari keluarga Nabi—Muhammad ibn Ali al-Abbasi, kepada siapa gerakan itu diteruskan dan yang berupaya mencapai kekhalifahan—yang mengawasi organisasi, mengarahkan para pemimpin dan pendakwah, serta memimpin mereka. Mereka yang bertanggung jawab atas gerakan ini membentuk organisasi administratif rahasia dalam serangkaian tingkatan: dua belas pemimpin, asisten para Imam, yang hanya mengetahui rahasia Imam dan menyimpannya, diikuti oleh para pengganti pemimpin, satu untuk setiap pemimpin, dan pengganti tersebut akan menggantikan pemimpin setelah kematiannya, kemudian tujuh puluh pendakwah yang mematuhi perintah para pemimpin dan bertanggung jawab untuk mempersiapkan para pendukung secara psikologis dan budaya serta mewujudkan revolusi, kemudian para pendakwah dari para pendakwah, kemudian kelas pekerja yang mengelola aparat rahasia, setiap pendakwah memiliki sejumlah pekerja, dan aparat tersebut diakhiri dengan sel-sel rahasia yang menembus jauh ke dalam masyarakat di semua kota. Logika aparat tersebut didasarkan pada slogan-slogan kesetaraan, Imamah orang yang diridhai Allah dari keluarga Muhammad, dan seruan untuk reformasi. {cite:tarikh-dawla-abbasiyya-taqqush hal. 18-19}."
