summary:
  ar: "أهل بيت وزارة بقرطبة اشتهروا كاشتهار ابن هبيرة في فزارة؛ كانوا وزراء الأمويين ثم استبد أبو الحزم جهور بن محمد بقرطبة بعد انتثار سلك الخلافة من غير أن يتعدى اسم الوزارة، وانتقل الأمر بعده سنة خمس وثلاثين وأربعمائة إلى ابنه أبي الوليد {cite:nafh-tib-maqqari p. 338}."
  en: "The Jahwarids — a Cordoban wazir house under the Umayyads whose head Abu'l-Hazm took Cordoba in the taifa period while keeping only the vizier's title {cite:nafh-tib-maqqari p. 338}."
  es: "Los Jahwarids — una casa visir cordobesa bajo los Omeyas cuyo jefe Abu'l-Hazm tomó Córdoba en el período taifa conservando solo el título de visir {cite:nafh-tib-maqqari p. 338}."
  fr: "Les Jahwarides — une maison de vizir de Cordoue sous les Omeyyades dont le chef Abu'l-Hazm a pris Cordoue pendant la période taïfa tout en ne conservant que le titre de vizir {cite:nafh-tib-maqqari p. 338}."
  ur: "جوارد - بنو امیہ کے تحت قرطبہ کا ایک وزیر خانہ جس کے سربراہ ابوالحزم نے طائفہ کے دور میں قرطبہ لے لیا جبکہ صرف وزیر کا لقب رکھا {حوالہ: نفح تبع مقری ص۔ 338}۔"
  tr: "Kurtuba'daki Bakanlık ailesi, İbn Hubeyra'nın Fazara'daki şöhreti gibi üne kavuştu; Emevilerin bakanlarıydılar, daha sonra halifeliğin soyu dağıldıktan sonra Kurtuba'nın kontrolünü Ebu el-Hazm Cahver ibn Muhammed ele geçirdi ve bu mesele 435 yılında oğlu Ebu el-Velid'e geçti. {Kaynak: Nafh-tib-makkari s. 338}"
  id: "Keluarga Kementerian di Cordoba menjadi terkenal seperti Ibnu Hubayra yang terkenal di Fazara; mereka adalah menteri-menteri Umayyah, kemudian Abu al-Hazm Jahwar ibn Muhammad mengambil alih kendali Cordoba setelah garis keturunan kekhalifahan terpecah tanpa melampaui nama kementerian, dan masalah tersebut beralih kepadanya pada tahun 435 kepada putranya Abu al-Walid {cite:nafh-tib-maqqari p. 338}."
