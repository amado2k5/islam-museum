label: { ar: "بنو شيبان بن بكر بن وائل", en: "Banu Shayban (of Bakr ibn Waʾil)", es: "Banu Shayban (de Bakr ibn Waʾil)", fr: "Banu Shayban (de Bakr ibn Waʾil)", ur: "بنو شیبان ⁦(بکر بن وائل کا)⁩", tr: "Banu Şeyban ibn Bekr ibn Wa'il", id: "Bani Shayban ibn Bakr ibn Wa'il" }
summary:
  ar: "الحي البكري سيده هانئ بن مسعود؛ انتصر على جموع الفرس يوم ذي قار — أول يوم انتصرت فيه العرب على العجم."
  en: "The Bakrite clan of Hani ibn Masʾud which defeated the Sasanian host at Dhu Qar — the first day the Arabs routed the Persians."
  es: "El clan Bakrita de Hani ibn Masʾud, que derrotó al ejército sasánida en Dhu Qar, el primer día en que los árabes derrotaron a los persas."
  fr: "Le clan bakrite de Hani ibn Masʾud qui vainquit l'armée sassanide à Dhu Qar — le premier jour où les Arabes mirent en déroute les Perses."
  ur: "ہانی بن مسعود کا بقراط قبیلہ جس نے ذو قار میں ساسانی میزبان کو شکست دی تھی - جس دن عربوں نے فارسیوں کو شکست دی تھی۔"
  tr: "Hani bin Mesud önderliğindeki Bakri kabilesi, Zilhicce günü Pers ordularına karşı zafer kazandı; bu, Arapların Perslere karşı ilk zaferini kazandığı gündü."
  id: "Suku Bakri, yang dipimpin oleh Hani bin Masoud, meraih kemenangan atas pasukan Persia pada hari Dhi Qar — hari pertama bangsa Arab meraih kemenangan atas bangsa Persia."
