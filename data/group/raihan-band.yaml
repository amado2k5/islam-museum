summary:
  ar: "فرقة نشيد ماليزية تأسست سنة 1996، اشتهرت بألبومها الأول «بوجي بوجيان» الصادر عن وارنر ميوزك ماليزيا، الذي تذكر المصادر أنه الأكثر مبيعا في تاريخ ماليزيا بشهادة البلاتين اثنتي عشرة مرة؛ غنّت مع يوسف إسلام، وأحيت حفلا في اجتماع رؤساء حكومات الكومنولث في إدنبرة سنة 1997 وفي قاعة ألبرت الملكية."
  en: "A Malaysian nasheed group founded in 1996, known for its debut album Puji-Pujian on Warner Music Malaysia, which its sources call Malaysia's best-selling album, certified twelve times platinum; it recorded with Yusuf Islam and performed at the 1997 Commonwealth Heads of Government Meeting in Edinburgh and at the Royal Albert Hall."
  ur: "1996 میں قائم ملائیشیائی نشید گروپ، جو وارنر میوزک ملائیشیا سے اپنے پہلے البم «پوجی پوجیان» سے مشہور ہوا، جسے ماخذ ملائیشیا کا سب سے زیادہ بکنے والا البم اور بارہ بار پلاٹینم بتاتے ہیں؛ اس نے یوسف اسلام کے ساتھ گایا اور 1997 میں ایڈنبرا میں دولتِ مشترکہ کے سربراہی اجلاس اور رائل البرٹ ہال میں پرفارم کیا۔"
