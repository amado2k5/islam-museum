summary:
  ar: "بطن من الأوس بيثرب، منه أبو أيوب خالد بن زيد الأنصاري الذي نزل النبي في داره حين قدم مهاجراً، ومنه أبو ليلى عبد الرحمن الأنصاري؛ من بيوت الأوس المتقدمة في الإسلام {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "A batn of Aws at Yathrib — Abu Ayyub Khalid ibn Zayd al-Ansari's house, in whose home the Prophet lodged on arriving as an emigrant; among the Aws houses foremost in Islam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "اوس کا بطن یثرب میں — ابو ایوب الانصاری کا گھرانہ جس کے گھر نبی مہاجر ہو کر اترے۔"
  es: "Un batn de Aws en Yathrib — la casa de Abu Ayyub Khalid ibn Zayd al-Ansari, en cuya casa se hospedó el Profeta al llegar como emigrante; entre las casas de Aws más importantes del Islam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  fr: "Une maison d'Aws à Yathrib — la maison d'Abu Ayyub Khalid ibn Zayd al-Ansari, dans la maison duquel le Prophète a séjourné à son arrivée en tant qu'émigrant; parmi les maisons d'Aws les plus importantes de l'Islam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  tr: "Yathrib'deki Aws kabilesinin bir kolundan, Peygamberimiz hicret sırasında evinde kaldığı Ebu Eyyub Halid bin Zeyd el-Ensari ve İslam'da ileri düzeyde olan Aws ailelerinden biri olan Ebu Leyla Abdül-Rahman el-Ensari gelmektedir. {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}"
  id: "Cabang suku Aws di Yathrib, dari mana berasal Abu Ayyub Khalid bin Zaid al-Ansari, di rumahnya Nabi tinggal ketika beliau datang sebagai seorang emigran, dan dari mana berasal Abu Layla Abd al-Rahman al-Ansari; salah satu keluarga Aws yang maju dalam Islam {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
