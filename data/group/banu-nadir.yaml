summary:
  en: "Medina's second Jewish tribe to break with the Prophet — date-palm landholders expelled to Khaybar in 625 after the breakdown of the pact, where their exiles kept the quarrel alive."
  ar: "ثاني قبائل يهود المدينة قطيعةً مع النبي — ملاك نخل أُجلوا إلى خيبر سنة 625م بعد انهيار العهد، وأبقى مهجّروهم الخصومة حية."
  es: "La segunda tribu judía de Medina que rompió con el Profeta: los terratenientes que cultivaban palmeras datileras fueron expulsados a Khaybar en el año 625 tras la ruptura del pacto, donde sus exiliados mantuvieron viva la disputa."
  fr: "La deuxième tribu juive de Médine à rompre avec le Prophète — les propriétaires terriens de palmiers dattiers expulsés à Khaybar en 625 après la rupture du pacte, où leurs exilés ont entretenu la querelle."
  ur: "مدینہ کا دوسرا یہودی قبیلہ جو نبی کے ساتھ ٹوٹ گیا - کھجور کے زمینداروں کو معاہدہ ٹوٹنے کے بعد 625 میں خیبر میں نکال دیا گیا، جہاں ان کے جلاوطنوں نے جھگڑے کو زندہ رکھا۔"
  tr: "Medine'deki Yahudi kabilelerinden Peygamber'le bağını koparan ikinci kabile olan Nahl kabilesi, ahdin bozulmasının ardından 625 yılında Hayber'e sürgün edildi ve sürgündekiler düşmanlığı canlı tuttu."
  id: "Suku kedua dari suku-suku Yahudi di Madinah yang memisahkan diri dari Nabi — suku Nakhl — diasingkan ke Khaybar pada tahun 625 M setelah runtuhnya perjanjian, dan pengasingan mereka membuat permusuhan tetap hidup."
