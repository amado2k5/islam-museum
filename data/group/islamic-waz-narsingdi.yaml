summary:
  ar: "قناة يوتيوب تجميعية إقليمية مقرها نرسينغدي في بنغلاديش، تنشر محافل الوعظ البنغالية وفي مقدمتها تسجيلات محافل ميزان الرحمن أزهري؛ بلغ عدد مشتركيها (@islamicwaznarsingdi) نحو 2.35 مليون بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح."
  en: "A Narsingdi-based regional YouTube aggregator channel in Bangladesh publishing Bengali waz mahfils, prominently recordings of Mizanur Rahman Azhari's mahfils; its channel (@islamicwaznarsingdi) counted about 2.35 million subscribers by vidIQ's count read on 8 November 2026, and no named head or operator for it was identified in this pass."
  ur: "اسلامک واز نرسنگدی بنگلہ دیش کے شہر نرسنگدی سے چلنے والا ایک علاقائی مجموعی یوٹیوب چینل ہے جو بنگالی وعظ محافل شائع کرتا ہے، جن میں میزان الرحمنٰ اظہری کی محافل کی ریکارڈنگز نمایاں ہیں؛ اس کے سبسکرائبرز کی تعداد 8 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 2.35 ملین تھی، اور اس جائزے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہوا۔"
