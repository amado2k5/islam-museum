label: { ar: "إسلامك واز نرسينغدي", en: "Islamic Waz Narsingdi", ur: "اسلامک واز نرسنگدی", es: "Waz Narsingdi islámico", fr: "Waz islamique Narsingdi", tr: "Your Islam waz Narsingdi", id: "Islammu waz Narsingdi" }
summary:
  ar: "قناة يوتيوب تجميعية إقليمية مقرها نرسينغدي في بنغلاديش، تنشر محافل الوعظ البنغالية وفي مقدمتها تسجيلات محافل ميزان الرحمن أزهري؛ بلغ عدد مشتركيها (@islamicwaznarsingdi) نحو 2.35 مليون بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح."
  en: "A Narsingdi-based regional YouTube aggregator channel in Bangladesh publishing Bengali waz mahfils, prominently recordings of Mizanur Rahman Azhari's mahfils; its channel (@islamicwaznarsingdi) counted about 2.35 million subscribers by vidIQ's count read on 8 November 2026, and no named head or operator for it was identified in this pass."
  ur: "اسلامک واز نرسنگدی بنگلہ دیش کے شہر نرسنگدی سے چلنے والا ایک علاقائی مجموعی یوٹیوب چینل ہے جو بنگالی وعظ محافل شائع کرتا ہے، جن میں میزان الرحمنٰ اظہری کی محافل کی ریکارڈنگز نمایاں ہیں؛ اس کے سبسکرائبرز کی تعداد 8 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 2.35 ملین تھی، اور اس جائزے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہوا۔"
  es: "Un canal agregador regional de YouTube con sede en Narsingdi, Bangladesh, que publica waz mahfils bengalíes, principalmente grabaciones de los mahfils de Mizanur Rahman Azhari; su canal (@islamicwaznarsingdi) contaba con aproximadamente 2,35 millones de suscriptores según el recuento de vidIQ realizado el 8 de noviembre de 2026, y en esta publicación no se identificó a ningún responsable u operador con nombre."
  fr: "Une chaîne YouTube régionale basée à Narsingdi au Bangladesh, diffusant des waz mahfils bengalis, notamment des enregistrements des mahfils de Mizanur Rahman Azhari; sa chaîne (@islamicwaznarsingdi) comptait environ 2,35 millions d'abonnés selon le décompte de vidIQ le 8 novembre 2026, et aucun responsable ou opérateur n'a été identifié à ce jour."
  tr: "Bangladeş'in Narsingdi kentinde bulunan ve ağırlıklı olarak Mizanur Rahman Azhari'nin vaazlarının kayıtlarını yayınlayan bölgesel bir derleme YouTube kanalı; 8 Kasım 2026'da vidIQ sayacından okunan verilere göre abone sayısı (@islamicwaznarsingdi) yaklaşık 2,35 milyon civarındadır ve bu araştırmada herhangi bir operatör veya isimli yönetici tespit edilmemiştir."
  id: "Sebuah saluran YouTube kompilasi regional yang berbasis di Narsingdi, Bangladesh, yang menerbitkan sesi dakwah berbahasa Bengali, terutama rekaman sesi Mizanur Rahman Azhari; jumlah pelanggannya (@islamicwaznarsingdi) mencapai sekitar 2,35 juta menurut penghitung vidIQ yang dibaca pada 8 November 2026, dan tidak ada operator atau administrator yang disebutkan namanya dalam survei ini."
