label: { ar: "بنو نوفل بن عبد مناف", en: "Banu Nawfal ibn Abd Manaf", es: "Banu Nawfal ibn Abd Manaf", fr: "Banu Nawfal ibn Abd Manaf", ur: "بنو نوفل بن عبد مناف", tr: "Banu Nawfal ibn Abd Manaf", id: "Banu Nawfal ibn Abd Manaf" }
summary:
  ar: "بطن من قريش من ولد نوفل بن عبد مناف بن قصي، أشقاء هاشم والمطلب وعبد شمس؛ من بيوتات قريش البطاح أهل المناصب والتجارة، ومنهم جعبفر بن أبي طالب بالولاء وأهل بيت ذووا قربى للنبي {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "A batn of Quraysh, the descendants of Nawfal ibn Abd Manaf ibn Qusayy, brother of Hashim, al-Muttalib and Abd Shams — one of the houses of Quraysh al-Batah that held offices and trade, kin of the Prophet's house {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "قریش کا ایک بطن، نوفل بن عبد مناف بن قصی کی اولاد — ہاشم، مطلب اور عبد شمس کے بھائی — قریش بطاح کے وہ گھرانے جن کے پاس مناصب اور تجارت تھی، نبی کے گھرانے کے قرابت دار۔"
  es: "Un batn de Quraysh, descendientes de Nawfal ibn Abd Manaf ibn Qusayy, hermano de Hashim, al-Muttalib y Abd Shams, una de las casas de Quraysh al-Batah que ocupaban cargos y comerciaban, parientes de la casa del Profeta {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  fr: "Une batn de Quraysh, les descendants de Nawfal ibn Abd Manaf ibn Qusayy, frère de Hashim, al-Muttalib et Abd Shams — une des maisons de Quraysh al-Batah qui détenait des fonctions et du commerce, apparentée à la maison du Prophète {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  tr: "Nevfel ibn Abd Manaf ibn Kusay'ın soyundan gelen, Haşim, El-Muttalib ve Abd Şems'in kardeşleri olan Kureyş kabilesi; Kureyş el-Bataah ailelerinden, mevki sahibi ve ticaretle uğraşan kişiler olup, aralarında biat yoluyla Cafer ibn Abi Talib ve Peygamberin akrabaları da bulunmaktadır. {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}"
  id: "Sebuah klan Quraysh dari keturunan Nawfal ibn Abd Manaf ibn Qusay, saudara-saudara Hashim, Al-Muttalib dan Abd Shams; dari keluarga Quraysh Al-Bataah, orang-orang yang berkedudukan tinggi dan berdagang, dan di antara mereka adalah Ja’far ibn Abi Talib yang beriman dan keluarga kerabat Nabi {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
