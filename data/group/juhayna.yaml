summary:
  ar: "قبيلة عربية من قضاعة كانت منازلها بين المدينة وساحل البحر الأحمر؛ يذكرها ابن إسحاق في سرايا النبي: منها جندب بن مكيث الجهني راوي سرية غالب إلى بني الملوح، ومنها الحُرَقة الذين كان منهم مرداس بن نهيك المقتول في غزوة غالب أرض بني مرة."
  en: "An Arab tribe of Quda'a whose lands lay between Medina and the Red Sea coast; Ibn Ishaq mentions it in the Prophet's detachments: Jundab ibn Makith al-Juhani, narrator of Ghalib's raid on Banu al-Mulawwah, was of it, as was the clan al-Huraqa to which Mirdas ibn Nahik, killed in Ghalib's raid on Banu Murra, belonged."
  es: "Una tribu árabe de Quda'a cuyas tierras se extendían entre Medina y la costa del Mar Rojo; Ibn Ishaq la menciona en los destacamentos del Profeta: Jundab ibn Makith al-Juhani, narrador de la incursión de Ghalib en Banu al-Mulawwah, pertenecía a ella, al igual que el clan al-Huraqa al que pertenecía Mirdas ibn Nahik, muerto en la incursión de Ghalib en Banu Murra."
  fr: "Une tribu arabe de Quda'a dont les terres se situaient entre Médine et la côte de la mer Rouge; Ibn Ishaq la mentionne dans les détachements du Prophète: Jundab ibn Makith al-Juhani, narrateur du raid de Ghalib sur Banu al-Mulawwah, en était membre, de même que le clan al-Huraqa auquel appartenait Mirdas ibn Nahik, tué lors du raid de Ghalib sur Banu Murra."
  ur: "قدعہ کا ایک عرب قبیلہ جس کی زمینیں مدینہ اور بحیرہ احمر کے ساحل کے درمیان واقع ہیں۔ ابن اسحاق نے اس کا تذکرہ نبوی کے دستوں میں کیا ہے: جندب بن مکث الجہنی، جو بنو الملوہ پر غالب کے چھاپے کا راوی تھا، اس کا تعلق قبیلہ الحرقہ سے تھا جس کا تعلق بنو مرہ پر غالب کے چھاپے میں مارداس بن ناہیک کا تھا۔"
