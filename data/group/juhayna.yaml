summary:
  ar: "قبيلة عربية من قضاعة كانت منازلها بين المدينة وساحل البحر الأحمر؛ يذكرها ابن إسحاق في سرايا النبي: منها جندب بن مكيث الجهني راوي سرية غالب إلى بني الملوح، ومنها الحُرَقة الذين كان منهم مرداس بن نهيك المقتول في غزوة غالب أرض بني مرة."
  en: "An Arab tribe of Quda'a whose lands lay between Medina and the Red Sea coast; Ibn Ishaq mentions it in the Prophet's detachments: Jundab ibn Makith al-Juhani, narrator of Ghalib's raid on Banu al-Mulawwah, was of it, as was the clan al-Huraqa to which Mirdas ibn Nahik, killed in Ghalib's raid on Banu Murra, belonged."
