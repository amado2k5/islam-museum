label:
  ar: المؤسسة الدولية الإسلامية لتمويل التجارة
  en: International Islamic Trade Finance Corporation (ITFC)
  ur: بین الاقوامی اسلامی تجارتی مالیاتی کارپوریشن
summary:
  ar: مؤسسة من مجموعة البنك الإسلامي للتنمية مقرها جدة، أُسست سنة 1429 هـ / 2008م لتنمية التجارة بين دول منظمة التعاون الإسلامي،
    وتقدّم تمويلا تجاريا متوافقا مع الشريعة للقطاعين العام والخاص.
  en: A member of the Islamic Development Bank Group based in Jeddah, founded in 1429 AH / 2008 to develop trade among the
    member states of the Organisation of Islamic Cooperation; it provides Shariah-compliant trade finance to public and private
    entities.
  ur: جدہ میں قائم اسلامی ترقیاتی بینک گروپ کا رکن ادارہ، جو 1429 ہجری / 2008 میں تنظیمِ تعاونِ اسلامی کے رکن ملکوں کی باہمی
    تجارت بڑھانے کے لیے قائم ہوا؛ شریعت کے مطابق تجارتی مالیات فراہم کرتا ہے۔
