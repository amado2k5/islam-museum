label:
  ar: المؤسسة الدولية الإسلامية لتمويل التجارة
  en: International Islamic Trade Finance Corporation (ITFC)
  ur: بین الاقوامی اسلامی تجارتی مالیاتی کارپوریشن
  es: "Corporación Internacional de Financiación del Comercio Islámico (ITFC)"
  fr: "Société internationale islamique de financement du commerce (ITFC)"
  tr: "Uluslararası İslami Ticaret Finans Kurumu"
  id: "Perusahaan Pembiayaan Perdagangan Islam Internasional"
summary:
  ar: مؤسسة من مجموعة البنك الإسلامي للتنمية مقرها جدة، أُسست سنة 1429 هـ / 2008م لتنمية التجارة بين دول منظمة التعاون الإسلامي،
    وتقدّم تمويلا تجاريا متوافقا مع الشريعة للقطاعين العام والخاص.
  en: A member of the Islamic Development Bank Group based in Jeddah, founded in 1429 AH / 2008 to develop trade among the
    member states of the Organisation of Islamic Cooperation; it provides Shariah-compliant trade finance to public and private
    entities.
  ur: جدہ میں قائم اسلامی ترقیاتی بینک گروپ کا رکن ادارہ، جو 1429 ہجری / 2008 میں تنظیمِ تعاونِ اسلامی کے رکن ملکوں کی باہمی
    تجارت بڑھانے کے لیے قائم ہوا؛ شریعت کے مطابق تجارتی مالیات فراہم کرتا ہے۔
  es: "Es miembro del Grupo del Banco Islámico de Desarrollo, con sede en Jeddah, fundado en 1429 AH / 2008 para desarrollar el comercio entre los estados miembros de la Organización para la Cooperación Islámica; proporciona financiación comercial que cumple con la Sharia a entidades públicas y privadas."
  fr: "Membre du Groupe de la Banque islamique de développement, basé à Djeddah, fondé en 1429 AH / 2008 pour développer le commerce entre les États membres de l'Organisation de la coopération islamique, il fournit des financements commerciaux conformes à la charia aux entités publiques et privées."
  tr: "İslam Kalkınma Bankası Grubu'na bağlı, merkezi Cidde'de bulunan ve İslam İşbirliği Teşkilatı ülkeleri arasında ticareti geliştirmek amacıyla 1429 Hicri / 2008 Miladi yılında kurulan bir kuruluştur. Kamu ve özel sektörlere Şeriat'a uygun ticaret finansmanı sağlamaktadır."
  id: "Sebuah lembaga dari Grup Bank Pembangunan Islam yang berbasis di Jeddah, didirikan pada tahun 1429 H / 2008 M untuk mengembangkan perdagangan antar negara anggota Organisasi Kerja Sama Islam, dan menyediakan pembiayaan perdagangan yang sesuai dengan syariah kepada sektor publik dan swasta."
