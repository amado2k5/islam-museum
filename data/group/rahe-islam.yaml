summary:
  ar: "قناة يوتيوب تجميعية للوعظ البنغالي تعمل من الشتات، إذ دولة قناتها مضبوطة على إيطاليا؛ بلغ عدد مشتركيها (@raheislam502) نحو 831 ألفًا بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح."
  en: "A diaspora-operated YouTube aggregator channel for Bengali waz, its channel country set to Italy; its channel (@raheislam502) counted about 831 thousand subscribers by vidIQ's count read on 8 November 2026, and no named head or operator for it was identified in this pass."
  ur: "راہِ اسلام بنگالی وعظ کا ایک مجموعی یوٹیوب چینل ہے جو بیرونِ ملک سے چلایا جاتا ہے، کیونکہ اس کا چینل ملک اٹلی مقرر ہے؛ اس کے سبسکرائبرز کی تعداد 8 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق تقریباً 831 ہزار تھی، اور اس جائزے میں اس کا کوئی نامزد سربراہ یا منتظم شناخت نہیں ہوا۔"
  es: "Un canal agregador de YouTube operado por la diáspora para waz bengalí, con su país de origen configurado en Italia; su canal (@raheislam502) contaba con aproximadamente 831 mil suscriptores según el recuento de vidIQ realizado el 8 de noviembre de 2026, y no se identificó ningún responsable u operador con nombre en esta publicación."
  fr: "Une chaîne YouTube agrégatrice gérée par la diaspora pour les waz bengalis, son pays de diffusion étant l'Italie; sa chaîne (@raheislam502) comptait environ 831 000 abonnés selon le décompte de vidIQ relevé le 8 novembre 2026, et aucun responsable ou opérateur nommé n'a été identifié lors de cette analyse."
