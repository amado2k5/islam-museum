  ar: "بنو لخم بن مالك بن حمير؛ ملوك الحيرة على الفرس وأول عرب العراق دولة، منهم النعمان بن المنذر آل نصر وعمرو بن هند وكعب بن النعمان صاحب حائط النخيل في بدر، وكانوا جسر العرب إلى الفرس {cite:mubarakpuri-raheeq p.25-27} {cite:tarikh-al-tabari} {cite:muruj-al-dhahab}."
  en: "Banu Lakhm ibn Malik ibn Himyar — the kings of al-Hira under the Persians and the first Arab polity in Iraq; among them al-Nu'man ibn al-Mundhir of the Nasrids, Amr ibn Hind, and Ka'b ibn al-Nu'man; they were the Arabs' bridge to Persia {cite:mubarakpuri-raheeq p.25-27} {cite:tarikh-al-tabari} {cite:muruj-al-dhahab}."
