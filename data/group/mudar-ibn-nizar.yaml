summary:
  ar: "مضر بن نزار بن معد، أدخله أبوه قبة حمراء من أدم فقال له هذه وما أشبهها من مالي فلك، فحكم الأفعى له بالإبل الحمر والقبة والذهب فسمي مضر الحمراء، وفقع أنمار عينه بعظم رماه به في الظلمة فكان بين إخوته ما ذكر من التنازع {cite:muruj-al-dhahab p. 431-435}."
  en: "Son of Nizar allotted the red leather tent — read as the red camels and gold, whence 'Mudar the Red' — whose eye Anmar put out with a tossed bone in the dark, the quarrel that scattered the brothers {cite:muruj-al-dhahab p. 431-435}."
