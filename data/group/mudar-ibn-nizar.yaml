label: { ar: "مضر بن نزار", en: "Mudar ibn Nizar", es: "Mudar ibn Nizar", fr: "Mudar ibn Nizar", ur: "مدثر بن نضر", tr: "Mudar ibn Nizar", id: "Mudar bin Nizar" }
summary:
  ar: "مضر بن نزار بن معد، أدخله أبوه قبة حمراء من أدم فقال له هذه وما أشبهها من مالي فلك، فحكم الأفعى له بالإبل الحمر والقبة والذهب فسمي مضر الحمراء، وفقع أنمار عينه بعظم رماه به في الظلمة فكان بين إخوته ما ذكر من التنازع {cite:muruj-al-dhahab p. 431-435}."
  en: "Son of Nizar allotted the red leather tent — read as the red camels and gold, whence 'Mudar the Red' — whose eye Anmar put out with a tossed bone in the dark, the quarrel that scattered the brothers {cite:muruj-al-dhahab p. 431-435}."
  es: "El hijo de Nizar recibió la tienda de cuero rojo —léase como los camellos rojos y el oro, de donde proviene 'Mudar el Rojo'— cuyo ojo Anmar sacó con un hueso arrojado en la oscuridad, la disputa que dispersó a los hermanos {cite:muruj-al-dhahab p. 431-435}."
  fr: "Le fils de Nizar a attribué la tente en cuir rouge — à lire comme les chameaux rouges et l'or, d'où « Mudar le Rouge » — dont Anmar a crevé l'œil avec un os jeté dans l'obscurité, la querelle qui a dispersé les frères {cite:muruj-al-dhahab p. 431-435}."
  ur: "نزار کے بیٹے نے سرخ چمڑے کا خیمہ الاٹ کیا - سرخ اونٹوں اور سونے کے طور پر پڑھا گیا، جہاں سے 'مدار سرخ' - جس کی آنکھ انمار نے اندھیرے میں پھینکی ہوئی ہڈی کے ساتھ نکالی، اس جھگڑے نے بھائیوں کو پراگندہ کردیا {حوالہ: مروج الذہب صفحہ 431-435}۔"
  tr: "Mudar ibn Nizar ibn Ma'ad'ın babası onu kırmızı deriden bir kubbenin içine götürdü ve ona, \"Bu ve buna benzer her şey, servetimden senin olsun\" dedi. Bunun üzerine yılan onun lehine hüküm verdi ve ona kırmızı develeri, kubbeyi ve altını verdi; böylece ona Mudar el-Hamra' (Kırmızı Mudar) denildi. Enmar, karanlıkta ona fırlattığı bir kemikle gözünü oydu ve kardeşleri arasında bu tartışmadan bahsedildi. {Kaynak: Muruj-al-Dhahab s. 431-435}"
  id: "Mudar bin Nizar bin Ma'ad, ayahnya membawanya ke dalam kubah kulit merah dan berkata kepadanya, “Ini dan segala sesuatu yang serupa dari hartaku adalah milikmu.” Maka ular itu memutuskan untuk memihaknya, memberinya unta merah, kubah, dan emas, sehingga ia disebut Mudar al-Hamra’ (Mudar Merah). Anmar mencungkil matanya dengan tulang yang dilemparkannya kepadanya dalam kegelapan, dan di antara saudara-saudaranya terjadilah perselisihan yang diceritakan {kutip:muruj-al-dhahab hlm. 431-435}."
