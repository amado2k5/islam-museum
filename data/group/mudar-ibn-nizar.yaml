label: { ar: "مضر بن نزار", en: "Mudar ibn Nizar", es: "Mudar ibn Nizar", fr: "Mudar ibn Nizar" }
summary:
  ar: "مضر بن نزار بن معد، أدخله أبوه قبة حمراء من أدم فقال له هذه وما أشبهها من مالي فلك، فحكم الأفعى له بالإبل الحمر والقبة والذهب فسمي مضر الحمراء، وفقع أنمار عينه بعظم رماه به في الظلمة فكان بين إخوته ما ذكر من التنازع {cite:muruj-al-dhahab p. 431-435}."
  en: "Son of Nizar allotted the red leather tent — read as the red camels and gold, whence 'Mudar the Red' — whose eye Anmar put out with a tossed bone in the dark, the quarrel that scattered the brothers {cite:muruj-al-dhahab p. 431-435}."
  es: "El hijo de Nizar recibió la tienda de cuero rojo —léase como los camellos rojos y el oro, de donde proviene 'Mudar el Rojo'— cuyo ojo Anmar sacó con un hueso arrojado en la oscuridad, la disputa que dispersó a los hermanos {cite:muruj-al-dhahab p. 431-435}."
  fr: "Le fils de Nizar a attribué la tente en cuir rouge — à lire comme les chameaux rouges et l'or, d'où « Mudar le Rouge » — dont Anmar a crevé l'œil avec un os jeté dans l'obscurité, la querelle qui a dispersé les frères {cite:muruj-al-dhahab p. 431-435}."
