label: { ar: "بويتك بيلغريمج ⁦(Poetic Pilgrimage)⁩", en: "Poetic Pilgrimage", ur: "پوئٹک پلگرمیج", es: "Peregrinación poética", fr: "Pèlerinage poétique", tr: "Şiirsel Hac Yolculuğu", id: "Ziarah Puitis" }
summary:
  ar: "ثنائي بريطاني للهيب هوب الإسلامي أسسته في لندن سنة 2002 منيرة راشدة وسكينة عبد النور، وهو موضوع الفيلم الوثائقي «هيب هوب حجابيز» الذي عرضته الجزيرة سنة 2015 عن شابتين تجدان مكانهما في عالم الهيب هوب."
  en: "A British Islamic hip-hop duo founded in London in 2002 by Muneera Rashida and Sukina Abdul Noor, the subject of Hip Hop Hijabis, a 2015 Al Jazeera documentary about two young women finding their place in hip-hop."
  ur: "برطانوی اسلامی ہپ ہاپ جوڑی جسے منیرہ راشدہ اور سکینہ عبدالنور نے 2002 میں لندن میں قائم کیا؛ الجزیرہ کی 2015 کی دستاویزی فلم «ہپ ہاپ حجابیز» اسی جوڑی پر ہے۔"
  es: "Un dúo británico de hip-hop islámico fundado en Londres en 2002 por Muneera Rashida y Sukina Abdul Noor, protagonistas de Hip Hop Hijabis, un documental de Al Jazeera de 2015 sobre dos jóvenes que encuentran su lugar en el mundo del hip-hop."
  fr: "Un duo de hip-hop islamique britannique fondé à Londres en 2002 par Muneera Rashida et Sukina Abdul Noor, sujet de Hip Hop Hijabis, un documentaire d'Al Jazeera de 2015 sur deux jeunes femmes trouvant leur place dans le hip-hop."
  tr: "2002 yılında Londra'da Munira Rashida ve Sakina Abdul Noor tarafından kurulan, İngiliz İslami hip-hop ikilisi, 2015 yılında Al Jazeera'da yayınlanan ve hip-hop dünyasında kendilerine yer bulan iki genç kadının hikayesini anlatan \"Hip Hop Hijabis\" belgeseline konu olmuştur."
  id: "Sebuah duo hip-hop Islami Inggris yang didirikan di London pada tahun 2002 oleh Munira Rashida dan Sakina Abdul Noor, yang menjadi subjek film dokumenter “Hip Hop Hijabis” yang ditayangkan oleh Al Jazeera pada tahun 2015 tentang dua wanita muda yang menemukan tempat mereka di dunia hip-hop."
