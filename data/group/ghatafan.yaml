summary:
  ar: "قبيلة مضرية من قيس عيلان بن مضر، منها عبس وذبيان وأشجع وغني بن أعصر؛ سكنت ذبيان قرب تيماء إلى حوران، وكانت حروب عبس وذبيان مثلاً على تنافس القبائل التي يجمعها أب واحد."
  en: "A Mudari tribe of Qays Aylan ibn Mudar, parent of Abs, Dhubyan, Ashja and Ghani ibn A'sur; Dhubyan dwelt near Tayma up to Hawran, and the wars of Abs and Dhubyan are cited as an example of rivalry between tribes of one father."
  es: "Una tribu Mudari de Qays Aylan ibn Mudar, padre de Abs, Dhubyan, Ashja y Ghani ibn A'sur; Dhubyan habitaba cerca de Tayma hasta Hawran, y las guerras de Abs y Dhubyan se citan como ejemplo de rivalidad entre tribus de un mismo padre."
  fr: "Une tribu Mudari de Qays Aylan ibn Mudar, parent d'Abs, Dhubyan, Ashja et Ghani ibn A'sur; Dhubyan habitait près de Tayma jusqu'à Hawran, et les guerres d'Abs et de Dhubyan sont citées comme un exemple de rivalité entre tribus d'un même père."
  ur: "قیس عیلان بن مضار کا ایک مدری قبیلہ، ابس، ذبیان، اشجع اور غنی بن عصور کے والدین؛ ذبیان تیما کے قریب حوران تک رہتا تھا، اور ابس اور ذبیان کی جنگوں کو ایک باپ کے قبیلوں کے درمیان دشمنی کی مثال کے طور پر پیش کیا جاتا ہے۔"
  tr: "Mudar kabilesi, Abs, Dhubyan, Ashja’ ve Ghani bin A’sar'ı da içeren Qais Aylan bin Mudar'dan gelmektedir. Dhubyan, Tayma ile Hawran yakınlarında yaşamıştır ve Abs ile Dhubyan arasındaki savaşlar, aynı babadan gelen kabileler arasındaki rekabetin bir örneğidir."
  id: "Suku Mudar berasal dari Qais Aylan bin Mudar, termasuk Abs, Dhubyan, Ashja’ dan Ghani bin A’sar. Dhubyan tinggal di dekat Tayma hingga Hawran, dan perang antara Abs dan Dhubyan merupakan contoh persaingan antar suku yang memiliki satu ayah yang sama."
