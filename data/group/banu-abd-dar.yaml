label: { en: Banu Abd al-Dar, ar: "بنو عبد الدار", es: "Banu Abd al-Dar", fr: "Banu Abd al-Dar", ur: "بنو عبد الدار", tr: "Banu Abd al-Dar", id: "Banu Abd al-Dar" }
summary:
  ar: "من بطون قريش؛ يقدّمه ابن إسحاق في قوائم مهاجرة الحبشة بنسبه «عبد الدار بن قصي»، ويعدّ منه مهاجرين ونساءً وأبناءً ولدوا هناك."
  en: A clan of Quraysh; Ibn Ishaq lists it in the Abyssinia emigrant rolls under its ancestor 'Abd al-Dar ibn Qusayy', counting among it emigrants, women and children born there.
  es: "Un clan de los Quraysh; Ibn Ishaq lo incluye en los registros de emigrantes de Abisinia bajo su antepasado 'Abd al-Dar ibn Qusayy', contando entre sus miembros a emigrantes, mujeres y niños nacidos allí."
  fr: "Un clan de Quraysh; Ibn Ishaq le mentionne dans les registres d'émigrants d'Abyssinie sous son ancêtre « Abd al-Dar ibn Qusayy », comptant parmi lui des émigrants, des femmes et des enfants nés là-bas."
  ur: "قریش کا ایک قبیلہ؛ ابن اسحاق نے اسے اپنے آباؤ اجداد عبد الدار ابن قصی کے تحت حبشہ کے ہجرت کی فہرست میں درج کیا ہے، اس میں مہاجرین، خواتین اور وہاں پیدا ہونے والے بچوں کا شمار ہوتا ہے۔"
  tr: "Kureyş kabilelerinden olan İbn İshak, Habeşistan'a göç edenlerin listelerinde onu \"Abd al-Dar ibn Qusay\" soyuyla birlikte sunar ve ondan oraya göç edenleri, kadınları ve orada doğan çocukları sayar."
  id: "Dari klan Quraysh; Ibnu Ishaq memasukkannya dalam daftar para emigran ke Abyssinia dengan garis keturunannya \"Abd al-Dar ibn Qusay,\" dan menghitung dari dirinya para emigran, wanita, dan anak-anak yang lahir di sana."
