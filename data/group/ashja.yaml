label: { ar: "بنو أشجع", en: "Banu Ashjaʿ", es: "Banu Ashjaʿ", fr: "Banu Ashjaʿ", ur: "بنو اشجع", tr: "Banu Ashja'", id: "Banu Ashja'" }
summary:
  ar: "بنو أشجع بن ريث بن غطفان بن سعد بن قيس عيلان؛ بطن غطفاني على ساحل تهامة، منهم مسروق الأشجعي التابعي وسباع الأشجعيون، وكانوا مع غطفان في وقعة الخندق {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  en: "Banu Ashja' ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays Aylan — a Ghatafani clan on the Tihama coast; from them the Successor Masruq al-Ashja'i and the Saba' al-Ashja'iyyun, and they stood with Ghatafan at the Trench {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  es: "Banu Ashja' ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays Aylan, un clan Ghatafani en la costa de Tihama; de ellos el Sucesor Masruq al-Ashja'i y el Saba' al-Ashja'iyyun, y estuvieron con Ghatafan en la Trinchera {cita:tarikh-al-tabari} {cita:kamil-ibn-al-athir} {cita:mubarakpuri-raheeq p.16}."
  fr: "Banu Ashja' ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays Aylan — un clan Ghatafani sur la côte de Tihama; d'eux le successeur Masruq al-Ashja'i et le Saba' al-Ashja'iyyun, et ils se tenaient avec Ghatafan à la tranchée {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  ur: "بنو اشجع بن ریث ابن غطفان ابن سعد بن قیس علان — تہامہ کے ساحل پر غطفانی قبیلہ؛ ان میں سے جانشین مسروق الاشجعی اور سبا الاشجعیون ہیں اور وہ غطفان کے ساتھ خندق پر کھڑے ہوئے {حوالہ: تاریخ الطبری} {حوالہ: کامل ابن الثیر} {حوالہ: مبارکپوری الرحیق ص 16}۔"
  tr: "Banu Ashja' ibn Rayth ibn Ghatafan ibn Sa'd ibn Qays 'Aylan; Aralarında Mesruk el-Aşca'i el-Tabi'i ve Siba' el-Aşca'iyun'un da bulunduğu, Tihama kıyısında bir Gatafan klanı vardı ve Hendek Savaşı'nda Ghatafan'la birlikteydiler {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq s.16}."
  id: "Banu Ashja’ ibn Rayth ibn Ghatafan ibn Sa’d ibn Qays ‘Aylan; sebuah klan Ghatafan di pantai Tihama, di antaranya Masruq al-Ashja'i al-Tabi'i dan Siba' al-Ashja'iyun, dan mereka bersama Ghatafan dalam Pertempuran Parit {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq hal.16}."
