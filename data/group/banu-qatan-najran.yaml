summary:
  ar: جماعة ينتمي إليها المجاهر بن زياد الذي أرسل إلى أبي محمد ليلقاهم فتحالفوا على النصرة سنة 286هـ.
  en: A group to which al-Mujahir ibn Ziyad belonged, who sent to Abu Muhammad to meet them and with whom a pledge of support was made in 286 AH.
