  es: "Un grupo al que pertenecía al-Mujahir ibn Ziyad, quien envió a Abu Muhammad a reunirse con ellos y con quien se hizo una promesa de apoyo en el año 286 de la Hégira."
  fr: "Un groupe auquel appartenait al-Mujahir ibn Ziyad, qui envoya un message à Abu Muhammad pour les rencontrer et avec lequel un engagement de soutien fut pris en 286 AH."
