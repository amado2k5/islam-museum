label: { ar: "سبأ", en: "Saba'" }
summary:
  ar: "ولد سبأ الذين أرسل الله عليهم سيل العرم، وكانت أرضهم من أخصب أرض اليمن وأثراها وأغدقها وأكثرها جناناً وغيطاناً وأفسحها مروجاً مع بنيان حسن وشجر مصفوف ومساكب ماء متكاثفة، وكانت مسيرة أكثر من شهر للراكب المجد وفي العرض مثله، وكان الراكب يسير في جنانها من أولها إلى آخرها لا تواجهه الشمس لاستتار الأرض بالعمارة الشجرية، وكانوا في أطيب عيش وأرفهه وتاج الأرض لا يعاندهم ملك إلا قصموه، حتى أفسد السد فأرة وملكتهم امرأة ودل عليهم هدهد على حد قول خالد بن صفوان {cite:muruj-al-dhahab p. 489-491}."
  en: "The Sabaeans whose month-long ride of shaded gardens made them earth's crown until the dam's breach — Khalid ibn Safwan's barb: a rat drowned them, a woman ruled them, a hoopoe guided them {cite:muruj-al-dhahab p. 489-491}."
