summary:
  ar: "ولد سبأ الذين أرسل الله عليهم سيل العرم، وكانت أرضهم من أخصب أرض اليمن وأثراها وأغدقها وأكثرها جناناً وغيطاناً وأفسحها مروجاً مع بنيان حسن وشجر مصفوف ومساكب ماء متكاثفة، وكانت مسيرة أكثر من شهر للراكب المجد وفي العرض مثله، وكان الراكب يسير في جنانها من أولها إلى آخرها لا تواجهه الشمس لاستتار الأرض بالعمارة الشجرية، وكانوا في أطيب عيش وأرفهه وتاج الأرض لا يعاندهم ملك إلا قصموه، حتى أفسد السد فأرة وملكتهم امرأة ودل عليهم هدهد على حد قول خالد بن صفوان {cite:muruj-al-dhahab p. 489-491}."
  en: "The Sabaeans whose month-long ride of shaded gardens made them earth's crown until the dam's breach — Khalid ibn Safwan's barb: a rat drowned them, a woman ruled them, a hoopoe guided them {cite:muruj-al-dhahab p. 489-491}."
  es: "Los sabeos, cuyo viaje de un mes por jardines sombreados los convirtió en la corona de la tierra hasta la ruptura de la presa — la pulla de Khalid ibn Safwan: una rata los ahogó, una mujer los gobernó, una abubilla los guió {cite:muruj-al-dhahab p. 489-491}."
  fr: "Les Sabéens dont le voyage d'un mois à travers des jardins ombragés les avait fait couronner la terre jusqu'à la rupture du barrage — la pique de Khalid ibn Safwan: un rat les a noyés, une femme les a gouvernés, une huppe les a guidés {cite:muruj-al-dhahab p. 489-491}."
  ur: "وہ سبائی جن کے سایہ دار باغات میں مہینہ بھر کی سواری نے ڈیم کے ٹوٹنے تک انہیں زمین کا تاج بنا دیا — خالد بن صفوان کی بارب: ایک چوہے نے انہیں غرق کر دیا، ایک عورت نے ان پر حکومت کی، ایک ہوپو نے ان کی رہنمائی کی۔ 489-491}۔"
  tr: "Saba halkı, Allah'ın Arim tufanını gönderdiği kişiler olarak doğdu. Toprakları Yemen'in en verimli, en zengin ve en bereketli toprakları arasındaydı; en çok bahçe ve tarlaya, en geniş çayırlara, güzel binalara, ağaç sıralarına ve yoğun su kanallarına sahipti. Hızlı bir binici için bir aydan fazla süren bir yolculuktu ve aynı genişlikteydi. Binici, güneş yüzünü görmeden, ağaç benzeri yapılarla kaplı arazide baştan sona bahçelerden geçerdi. En hoş ve lüks hayatı yaşıyorlardı ve yeryüzünün tacıydılar. Halid bin Safvan'a göre, bir fare barajı yıkana, bir kadın kraliçeleri olana ve bir hüthüt onları kaderlerine götürene kadar, hiçbir kral onlara karşı çıkamazdı. {cite:muruj-al-dhahab s. 489-491}"
  id: "Orang-orang Saba dilahirkan, dan Allah mengirimkan banjir Al-Arim kepada mereka. Tanah mereka termasuk yang paling subur, terkaya, dan paling melimpah di Yaman, dengan kebun dan ladang terbanyak, serta padang rumput terluas, dengan bangunan-bangunan indah, deretan pohon, dan saluran air yang lebat. Perjalanan ke sana memakan waktu lebih dari sebulan bagi seorang penunggang kuda yang cepat, dan lebarnya pun sama. Penunggang kuda itu akan melewati kebun-kebunnya dari awal hingga akhir tanpa matahari menyinarinya karena tanahnya tertutup oleh struktur-struktur seperti pohon. Mereka hidup dalam kehidupan yang paling menyenangkan dan mewah, dan merupakan mahkota bumi. Tidak ada raja yang menentang mereka tanpa mereka mengalahkannya, sampai seekor tikus merusak bendungan, dan seorang wanita menjadi ratu mereka, dan seekor burung huyur membawa mereka pada takdir mereka, menurut Khalid bin Safwan. {cite:muruj-al-dhahab p. 489-491}"
