label: { ar: "صوفة ⁦(بنو الغوث بن مرة)⁩", en: "Sufa (Banu al-Ghawth ibn Murra)", es: "Sufa (Banu al-Ghawth ibn Murra)", fr: "Soufa (Banu al-Ghawth ibn Murra)", ur: "صفا ⁦(بنو الغوث ابن مرہ)⁩", tr: "Süfah (Benu el-Gavs ibn Murrah)", id: "Sufah (Banu al-Ghawth bin Murrah)" }
summary:
  ar: "بنو الغوث بن مرة من بطون إلياس بن مضر، كانوا يسمون صوفة؛ كان إليهم في ولاية خزاعة الدفع بالناس من عرفة إلى المزدلفة والإجازة بهم يوم النفر من منى: لا يرمي الناس يوم النفر حتى يرمي رجل من صوفة، ويأخذون بجانبي العقبة فلا يجوز أحد حتى يمروا؛ فلما انقرضوا ورثهم بنو سعد بن زيد مناة من تميم."
  en: "Banu al-Ghawth ibn Murra of the Ilyas ibn Mudar line, called Sufa; under Khuza'a's rule they held the right to lead the pilgrims from Arafa to Muzdalifa and to release them from Mina on the day of departure: none threw the stones until a man of Sufa threw, and they held both sides of the pass until they had passed; when they died out, Banu Sa'd ibn Zayd Manat of Tamim inherited the office."
  es: "Banu al-Ghawth ibn Murra de la línea de Ilyas ibn Mudar, llamados Sufa; bajo el gobierno de Khuza'a tenían el derecho de guiar a los peregrinos desde Arafa hasta Muzdalifa y liberarlos de Mina el día de la partida: nadie lanzaba piedras hasta que un hombre de Sufa lo hacía, y controlaban ambos lados del paso hasta que lo hubieran cruzado; cuando se extinguieron, Banu Sa'd ibn Zayd Manat de Tamim heredó el cargo."
  fr: "Les Banu al-Ghawth ibn Murra de la lignée d'Ilyas ibn Mudar, appelés Sufa; sous le règne de Khuza'a, ils détenaient le droit de conduire les pèlerins d'Arafa à Muzdalifa et de les libérer de Mina le jour du départ: personne ne jeta de pierres jusqu'à ce qu'un homme de Sufa le fasse, et ils tinrent les deux côtés du col jusqu'à ce qu'ils l'aient franchi; lorsqu'ils s'éteignirent, les Banu Sa'd ibn Zayd Manat de Tamim héritèrent de cette fonction."
  ur: "الیاس بن مدر کے سلسلے کے بنو الغوث بن مرہ، جسے صفا کہا جاتا ہے؛ خزاعہ کے دور حکومت میں وہ حجاج کو عرفہ سے مزدلفہ کی طرف لے جانے اور منیٰ سے روانگی کے دن ان کو چھوڑنے کا حق رکھتے تھے: کسی نے پتھر نہیں پھینکے یہاں تک کہ صفا کے ایک آدمی نے پھینکا، اور انہوں نے درے کے دونوں کناروں کو پکڑے رکھا یہاں تک کہ وہ گزر گئے۔ جب ان کا انتقال ہوا تو تمیم کے بنو سعد بن زید منات کو دفتر وراثت میں ملا۔"
  tr: "İlyas ibn Mudar kabilesinden olan Beni el-Gavs ibn Murrah, Sufah olarak adlandırılırdı. Huze'ah vilayetinde, Arafat'tan Muzdalifa'ya insanları sürmekten ve Mina'dan ayrılış gününde geçişlerine izin vermekten sorumluydular. Ayrılış gününde, Sufah'tan bir adam taş atmadan kimse taş atmazdı ve Akabe'nin kenarlarını kuşatarak, onlar geçene kadar kimsenin geçmesine izin vermezlerdi. Soyları tükendiğinde, Tamim'den Beni Sa'd ibn Zeyd Manat kabilesi onların yerini aldı."
  id: "Bani al-Ghawth ibn Murrah, dari klan Ilyas ibn Mudar, disebut Sufah. Di provinsi Khuza’ah, mereka bertanggung jawab untuk mengusir orang-orang dari Arafat ke Muzdalifah dan mengizinkan mereka lewat pada hari keberangkatan dari Mina. Orang-orang tidak akan melempar batu pada hari keberangkatan sampai seorang pria dari Sufah melemparnya, dan mereka akan menjaga sisi-sisi Aqaba sehingga tidak ada yang bisa lewat sampai mereka lewat. Ketika mereka punah, Bani Sa’d ibn Zayd Manat dari Tamim mewarisi mereka."
