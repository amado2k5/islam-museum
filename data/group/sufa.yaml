label: { ar: "صوفة (بنو الغوث بن مرة)", en: "Sufa (Banu al-Ghawth ibn Murra)" }
summary:
  ar: "بنو الغوث بن مرة من بطون إلياس بن مضر، كانوا يسمون صوفة؛ كان إليهم في ولاية خزاعة الدفع بالناس من عرفة إلى المزدلفة والإجازة بهم يوم النفر من منى: لا يرمي الناس يوم النفر حتى يرمي رجل من صوفة، ويأخذون بجانبي العقبة فلا يجوز أحد حتى يمروا؛ فلما انقرضوا ورثهم بنو سعد بن زيد مناة من تميم."
  en: "Banu al-Ghawth ibn Murra of the Ilyas ibn Mudar line, called Sufa; under Khuza'a's rule they held the right to lead the pilgrims from Arafa to Muzdalifa and to release them from Mina on the day of departure: none threw the stones until a man of Sufa threw, and they held both sides of the pass until they had passed; when they died out, Banu Sa'd ibn Zayd Manat of Tamim inherited the office."
