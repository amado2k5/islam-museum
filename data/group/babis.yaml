summary:
  ar: "أتباع الدين الذي أسسه الباب ⁦(1260هـ/1844م)⁩، وتعرضوا للاضطهاد الشديد حتى انشقوا إلى البهائيين والأزليين {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}."
  en: "The followers of the religion founded by the Bab (1260/1844), who suffered severe persecution and later split into the Baha'is and the Azalis {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}."
  ur: "باب کے قائم کردہ دین کے پیروکار ⁦(1260ھ/1844ء)⁩، جنہوں نے شدید ظلم سہا اور بعد میں بہائیوں اور ازلیوں میں بٹ گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}۔"
  es: "Los seguidores de la religión fundada por el Báb (1260/1844), que sufrieron una severa persecución y posteriormente se dividieron en los bahá'ís y los azalíes {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}."
  fr: "Les adeptes de la religion fondée par le Bab (1260/1844), qui ont subi de graves persécutions et se sont ensuite divisés en Baha'is et en Azalis {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}."
  tr: "Bab tarafından kurulan dinin (Hicri 1260/Miladi 1844) takipçileri, Bahailer ve Azaliler olarak ikiye ayrılana kadar şiddetli zulümlere maruz kaldılar. {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}."
  id: "Para pengikut agama yang didirikan oleh Bab (1260 H/1844 M) mengalami penganiayaan berat hingga mereka terpecah menjadi Baha'i dan Azali. {cite:encyclopaedia-of-islam-2 vol. 1 p. 903-904}."
