  ar: "النبط (الأنباط)"
  en: "The Nabataeans"
  ur: "نبط"
summary:
  ar: "النبط عند المؤرخين أهل البتراء ومدائن صالح الذين سكنوا الحجاز الشمالي وجنوب الشام قبل الإسلام: آثارهم باقية في الحجر والبتراء، ويذكرهم المفسرون والجغرافيون في ذكر ثمود والأمم البائدة ومن سكن ديارهم بعدهم {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  en: "The Nabataeans in the historians are the people of Petra and Mada'in Salih who dwelt in the northern Hijaz and southern al-Sham before Islam: their remains stand at al-Hijr and Petra, and the commentators and geographers name them in the account of Thamud and the vanished peoples and those who dwelt in their homes after them {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  ur: "نبط مؤرخین کے نزدیک پٹرا اور مدائن صالح کے باشندے ہیں جو اسلام سے پہلے شمالی حجاز اور جنوبی شام میں آباد تھے: ان کے آثار حجر اور پٹرا میں قائم ہیں، اور مفسرین و جغرافیہ دان ثمود اور بائدہ امتوں کے قصے میں ان کا ذکر کرتے ہیں۔"
