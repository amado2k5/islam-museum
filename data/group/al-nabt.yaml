label:
  ar: "النبط ⁦(الأنباط)⁩"
  en: "The Nabataeans"
  ur: "نبط"
  es: "Los nabateos"
  fr: "Les Nabatéens"
summary:
  ar: "النبط عند المؤرخين أهل البتراء ومدائن صالح الذين سكنوا الحجاز الشمالي وجنوب الشام قبل الإسلام: آثارهم باقية في الحجر والبتراء، ويذكرهم المفسرون والجغرافيون في ذكر ثمود والأمم البائدة ومن سكن ديارهم بعدهم {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  en: "The Nabataeans in the historians are the people of Petra and Mada'in Salih who dwelt in the northern Hijaz and southern al-Sham before Islam: their remains stand at al-Hijr and Petra, and the commentators and geographers name them in the account of Thamud and the vanished peoples and those who dwelt in their homes after them {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  ur: "نبط مؤرخین کے نزدیک پٹرا اور مدائن صالح کے باشندے ہیں جو اسلام سے پہلے شمالی حجاز اور جنوبی شام میں آباد تھے: ان کے آثار حجر اور پٹرا میں قائم ہیں، اور مفسرین و جغرافیہ دان ثمود اور بائدہ امتوں کے قصے میں ان کا ذکر کرتے ہیں۔"
  es: "Los nabateos en los historiadores son la gente de Petra y Mada'in Salih que habitó en el norte de Hiyaz y el sur de al-Sham antes del Islam: sus restos se encuentran en al-Hijr y Petra, y los comentaristas y geógrafos los nombran en el relato de Thamud y los pueblos desaparecidos y aquellos que habitaron sus hogares después de ellos {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
  fr: "Les Nabatéens, selon les historiens, sont les habitants de Pétra et de Mada'in Salih qui vivaient dans le nord du Hedjaz et le sud du Levant avant l'islam: leurs vestiges se trouvent à al-Hijr et à Pétra, et les commentateurs et géographes les nomment dans le récit de Thamud et des peuples disparus et de ceux qui ont habité leurs maisons après eux {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari}."
