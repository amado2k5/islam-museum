  ar: "قناة يوتيوب بنغلاديشية تجميعية تنشر محافل الوعظ البنغالية، واسمها عبارة دينية بنغالية عامة تعني «عماد الإسلام»؛ بلغ عدد مشتركيها (@islamerkhuti) نحو 734 ألفًا بحسب عدّاد vidIQ المقروء في 8 نوفمبر 2026، ولم يُحدَّد لها مشغّل أو مسؤول مسمّى في هذا المسح، ولا يربطها السجل بأي خطيب بعينه."
