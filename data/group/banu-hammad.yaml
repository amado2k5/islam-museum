summary:
  ar: "بنو حماد المواصلة كانوا أصحاب الدعوة بالجزيرة وما والاها من قبل أبي يعقوب السجستاني خليفة الإمام المقيم وكان بالري، وقد صنفوا كتبا وأضافوها إلى عبدان فمن ذلك كتاب الحق النير وكتاب الحق المبين وكتاب بسم الله الرحمن الرحيم {cite:fihrist-ibn-al-nadim p. 268-269}."
  en: "The Banu Hammad — the Jazira da'wa circle who attributed their books to Abdan {cite:fihrist-ibn-al-nadim}"
