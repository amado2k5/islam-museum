label: { ar: "بنو حماد", en: "Banu Hammad", es: "Banu Hammad", fr: "Banu Hammad", ur: "بنو حماد", tr: "Banu Hammad", id: "Banu Hammad" }
summary:
  ar: "بنو حماد المواصلة كانوا أصحاب الدعوة بالجزيرة وما والاها من قبل أبي يعقوب السجستاني خليفة الإمام المقيم وكان بالري، وقد صنفوا كتبا وأضافوها إلى عبدان فمن ذلك كتاب الحق النير وكتاب الحق المبين وكتاب بسم الله الرحمن الرحيم {cite:fihrist-ibn-al-nadim p. 268-269}. وعند ابن خلدون وافترق ملك صنهاجة في أيام باديس بن المنصور بن بلكين إلى دولتين: دولة إلى المنصور بن بلكين أصحاب القيروان ودولة إلى حماد بن بلكين بالقلعة {cite:tarikh-ibn-khaldun-ibar p. 1630}"
  en: "The Banu Hammad — the Jazira da'wa circle who attributed their books to Abdan {cite:fihrist-ibn-al-nadim}"
  es: "Los Banu Hammad — el círculo Jazira da'wa que atribuyó sus libros a Abdan {cite:fihrist-ibn-al-nadim}"
  fr: "Les Banu Hammad — le cercle de da'wa de Jazira qui attribuait ses livres à Abdan {cite:fihrist-ibn-al-nadim}"
  ur: "بنو حماد - جزیرۃ الدعوۃ کا حلقہ جس نے اپنی کتابوں کو عبدان سے منسوب کیا"
  tr: "Beni Hammad el-Muvasila, İmam el-Mukim'in halefi ve Rayy'da ikamet eden Ebu Yakub el-Sijistani adına, Cezire ve çevresindeki bölgelerde İslam'a davetin savunucularıydı. Abdan'a atfedilen kitaplar yazdılar; bunlar arasında Aydınlatıcı Hakikat Kitabı, Açık Hakikat Kitabı ve \"Rahman ve Rahim olan Allah'ın Adıyla\" Kitabı da vardı. {kaynak: Fihrist ibn el-Nadim s. 268-269}. İbn Haldun'a göre, Bedis ibn el-Mansur ibn Buluggin'in hükümdarlığı sırasında Sanhaja krallığı iki devlete ayrıldı: Biri Kayrevan hükümdarları olan el-Mansur ibn Buluggin'e ait, diğeri ise Hammad ibn Buluggin'e ait bir kale devletiydi. {kaynak: Tarih ibn Haldun-ibar s. 1630}."
  id: "Bani Hammad al-Muwasila adalah para pendukung dakwah Islam di Jazira dan sekitarnya, atas nama Abu Yaqub al-Sijistani, penerus Imam al-Muqim, yang berkedudukan di Rayy. Mereka menulis buku-buku dan mengaitkannya dengan Abdan, termasuk Kitab Kebenaran yang Menerangi, Kitab Kebenaran yang Nyata, dan Kitab \"Dengan Nama Allah, Yang Maha Pengasih, Yang Maha Penyayang\" {cite:fihrist-ibn-al-nadim hlm. 268-269}. Menurut Ibn Khaldun, kerajaan Sanhaja terpecah menjadi dua negara bagian selama pemerintahan Badis ibn al-Mansur ibn Buluggin: satu negara bagian milik al-Mansur ibn Buluggin, penguasa Kairouan, dan yang lainnya milik Hammad ibn Buluggin di benteng {cite:tarikh-ibn-khaldun-ibar hlm. 1630}."
