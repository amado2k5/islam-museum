label: { ar: "بنو حماد", en: "Banu Hammad" }
summary:
  ar: "بنو حماد المواصلة كانوا أصحاب الدعوة بالجزيرة وما والاها من قبل أبي يعقوب السجستاني خليفة الإمام المقيم وكان بالري، وقد صنفوا كتبا وأضافوها إلى عبدان فمن ذلك كتاب الحق النير وكتاب الحق المبين وكتاب بسم الله الرحمن الرحيم {cite:fihrist-ibn-al-nadim p. 268-269}. وعند ابن خلدون وافترق ملك صنهاجة في أيام باديس بن المنصور بن بلكين إلى دولتين: دولة إلى المنصور بن بلكين أصحاب القيروان ودولة إلى حماد بن بلكين بالقلعة {cite:tarikh-ibn-khaldun-ibar p. 1630}"
  en: "The Banu Hammad — the Jazira da'wa circle who attributed their books to Abdan {cite:fihrist-ibn-al-nadim}"
wings: []
sources: [source/tarikh-ibn-khaldun-ibar, source/fihrist-ibn-al-nadim]
