summary:
  ar: "فرقة هيب هوب دنماركية تأسست سنة 1997 في برونبي ستراند، أعضاؤها الأوائل عصام بشيري ووقاص علي قادري، وهما مسلمان من أصل مغربي وباكستاني، ولني مارتينيز الكاثوليكي؛ اشتهرت بنسختها من «Aïcha» وبأغنيتي «Look into My Eyes» و«Guantanamo»، وغنّت في حفلات خيرية مع سامي يوسف وريحان."
  en: "A Danish hip-hop group formed in 1997 in Brøndby Strand, first made up of Isam Bachiri and Waqas Ali Qadri, Muslims of Moroccan and Pakistani origin, and the Catholic Lenny Martinez; known for its version of 'Aïcha' and for 'Look into My Eyes' and 'Guantanamo', it played charity concerts with Sami Yusuf and Raihan."
  ur: "1997 میں برونبی اسٹرانڈ میں قائم ڈنمارک کا ہپ ہاپ گروپ، جس کے ابتدائی ارکان عصام بشیری اور وقاص علی قادری ⁦(مراکشی اور پاکستانی نژاد مسلمان)⁩ اور کیتھولک لینی مارٹینز تھے؛ یہ «عائشہ» کے اپنے ورژن اور «لُک اِن ٹو مائی آئیز» اور «گوانتانامو» سے مشہور ہوا۔"
  es: "Un grupo danés de hip-hop formado en 1997 en Brøndby Strand, inicialmente compuesto por Isam Bachiri y Waqas Ali Qadri, musulmanes de origen marroquí y pakistaní, y el católico Lenny Martinez; conocido por su versión de 'Aïcha' y por 'Look into My Eyes' y 'Guantanamo', ofreció conciertos benéficos con Sami Yusuf y Raihan."
  fr: "Un groupe de hip-hop danois formé en 1997 à Brøndby Strand, composé à l'origine d'Isam Bachiri et Waqas Ali Qadri, musulmans d'origine marocaine et pakistanaise, et du catholique Lenny Martinez; connu pour sa version de 'Aïcha' et pour 'Look into My Eyes' et 'Guantanamo', il a donné des concerts caritatifs avec Sami Yusuf et Raihan."
  tr: "1997 yılında Brønby Strand'da kurulan Danimarkalı bir hip-hop grubu olan grubun orijinal üyeleri, Fas ve Pakistan kökenli Müslümanlar Issam Bachiri ve Waqas Ali Qadri ile Katolik Leni Martinez'di; \"Aïcha\"nın kendi yorumları ve \"Look into My Eyes\" ile \"Guantanamo\" şarkılarıyla ünlendiler ve Sami Yusuf ve Rehan ile birlikte yardım konserlerinde sahne aldılar."
  id: "Sebuah grup hip-hop Denmark yang didirikan pada tahun 1997 di Brønby Strand, yang anggota aslinya adalah Issam Bachiri dan Waqas Ali Qadri, keduanya Muslim keturunan Maroko dan Pakistan, serta Leni Martinez, seorang Katolik; mereka menjadi terkenal karena versi mereka dari lagu “Aïcha” dan lagu-lagu “Look into My Eyes” dan “Guantanamo”, dan tampil di konser amal bersama Sami Yusuf dan Rehan."
