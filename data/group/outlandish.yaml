summary:
  ar: "فرقة هيب هوب دنماركية تأسست سنة 1997 في برونبي ستراند، أعضاؤها الأوائل عصام بشيري ووقاص علي قادري، وهما مسلمان من أصل مغربي وباكستاني، ولني مارتينيز الكاثوليكي؛ اشتهرت بنسختها من «Aïcha» وبأغنيتي «Look into My Eyes» و«Guantanamo»، وغنّت في حفلات خيرية مع سامي يوسف وريحان."
  en: "A Danish hip-hop group formed in 1997 in Brøndby Strand, first made up of Isam Bachiri and Waqas Ali Qadri, Muslims of Moroccan and Pakistani origin, and the Catholic Lenny Martinez; known for its version of 'Aïcha' and for 'Look into My Eyes' and 'Guantanamo', it played charity concerts with Sami Yusuf and Raihan."
  ur: "1997 میں برونبی اسٹرانڈ میں قائم ڈنمارک کا ہپ ہاپ گروپ، جس کے ابتدائی ارکان عصام بشیری اور وقاص علی قادری ⁦(مراکشی اور پاکستانی نژاد مسلمان)⁩ اور کیتھولک لینی مارٹینز تھے؛ یہ «عائشہ» کے اپنے ورژن اور «لُک اِن ٹو مائی آئیز» اور «گوانتانامو» سے مشہور ہوا۔"
