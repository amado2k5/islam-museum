label: { ar: "الموحدون", en: "Almohads", es: "Almohades", fr: "Almohades" }
summary:
  ar: "دعوة المصامدة التي أقامها محمد بن تومرت الملقب بالمهدي على التوحيد وقتال من سماهم المجسمين ثم قامت بها دولة عبد المؤمن بن علي فملكت المغربين، وكان ابن تومرت يسمي أتباعه بالموحدين تعريضاً بلمتونة المرابطين {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}."
  en: "The Almohads — Ibn Tumart's Harga movement naming itself the Muwahhidun in pointed contrast to the 'veiled' Lamtuna, then Abd al-Mumin's empire that united both Maghrebs {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}."
  es: "Los almohades: el movimiento Harga de Ibn Tumart que se autodenominó Muwahhidun en marcado contraste con el \"velado\" Lamtuna, entonces imperio de Abd al-Mumin que unió a ambos Magrebs {citar:tarikh-ibn-khaldun-ibar p. 1668-1669}."
  fr: "Les Almohades — le mouvement Harga d'Ibn Tumart se nommant lui-même le Muwahhidun en contraste frappant avec le Lamtuna « voilé », puis l'empire d'Abd al-Mumin qui unissait les deux Maghrebs {cite:tarikh-ibn-khaldun-ibar p. 1668-1669}."
