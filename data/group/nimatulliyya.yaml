summary:
  ar: "بطاقة أولية للطريقة النعمة اللهية، الطريقة الصوفية التي أسسها شاه نعمة الله الولي في القرن الخامس عشر وانتشرت في فارس والهند ومن بعدها إلى الغرب؛ لم تُراجع الصفحة بعد."
  en: "Draft card for the Ni'matullahi order, the Sufi tariqa founded by Shah Ni'matullah al-Wali in the fifteenth century, spreading through Persia and India and later to the West; the page not yet checked."
  es: "Ficha preliminar para la orden Ni'matullahi, la tariqa sufí fundada por Shah Ni'matullah al-Wali en el siglo XV, que se extendió por Persia e India y posteriormente a Occidente; la página aún no ha sido revisada."
  fr: "Fiche de projet pour l'ordre Ni'matullahi, la tariqa soufie fondée par le Shah Ni'matullah al-Wali au XVe siècle, qui s'est répandue à travers la Perse et l'Inde, puis plus tard vers l'Occident; la page n'a pas encore été vérifiée."
  ur: "نعمت اللہی آرڈر کے لیے مسودہ کارڈ، صوفی طریقت جس کی بنیاد شاہ نعمت اللہ الولی نے پندرہویں صدی میں رکھی تھی، جو فارس اور ہندوستان اور بعد میں مغرب تک پھیلی۔ صفحہ ابھی تک چیک نہیں ہوا ہے۔"
  tr: "Şah Nimatullah Veli tarafından 15. yüzyılda kurulan ve önce İran'a, sonra Hindistan'a ve nihayetinde Batı'ya yayılan Nimatullahi Sufi tarikatının ön tanıtım kartı; sayfa henüz incelenmedi."
  id: "Kartu pendahuluan untuk tarekat Sufi Nimatullahi, yang didirikan oleh Shah Nimatullah Wali pada abad kelima belas dan menyebar di Persia dan India, kemudian ke Barat; halaman belum ditinjau."
