summary:
  ar: "البدو، العرب الرُحّل أهل الوبر الذين تميزهم المصادر عن الحضر، ومنهم من بعثت إليهم الدعوة أو عاتبهم القرآن على نفاقهم. بطاقة أولية وردت من وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩ ولم تُراجع على صفحات المصدر بعد."
  en: "The Bedouin — the nomadic Arabs whom the sources distinguish from settled people; some received the call to Islam and some were rebuked in the Qur'an for hypocrisy. Draft card from an open reference description (Wikidata); not yet checked on the source page."
  es: "Los beduinos —los árabes nómadas a quienes las fuentes distinguen de los pueblos sedentarios—; algunos recibieron la llamada al islam y otros fueron reprendidos en el Corán por hipocresía. Boceto de ficha de una descripción de referencia abierta (Wikidata); aún no verificado en la página de origen."
  fr: "Les Bédouins — les Arabes nomades que les sources distinguent des populations sédentaires; certains se sont convertis à l’islam et d’autres ont été réprimandés dans le Coran pour leur hypocrisie. Fiche provisoire issue d’une description de référence ouverte (Wikidata); non encore vérifiée sur la page source."
  ur: "اعرابی - خانہ بدوش عرب جن کے ذرائع آباد لوگوں سے ممتاز ہیں۔ بعض نے اسلام کی دعوت دی اور بعض کو قرآن میں منافقت پر ملامت کی گئی۔ ایک کھلے حوالہ کی تفصیل سے ڈرافٹ کارڈ ⁦(وکی ڈیٹا)⁩؛ ابھی تک سورس پیج پر چیک نہیں کیا گیا۔"
  tr: "Tarihsel kaynaklarca yerleşik halktan ayrılan ve çadırlarda yaşayan göçebe Araplar olan Bedeviler, İslam mesajının gönderildiği kişiler ve Kur'an'ın riyakarlıkları nedeniyle kınadığı kişiler arasında yer alır. Bu, açık bir referans kaynağından (Wikidata) alınan ön bir açıklamadır ve kaynak sayfalarında henüz incelenmemiştir."
  id: "Suku Badui, yaitu orang Arab nomaden yang tinggal di tenda dan dibedakan dari masyarakat menetap oleh sumber-sumber sejarah, mencakup mereka yang menerima pesan Islam dan mereka yang ditegur oleh Al-Quran karena kemunafikan mereka. Ini adalah deskripsi awal yang diambil dari sumber referensi terbuka (Wikidata) dan belum ditinjau di halaman sumber."
