summary:
  ar: "القناة الرسمية لجمعية نهضة العلماء على يوتيوب ⁦(@nuchannel)⁩، أكبر جمعية إسلامية جماهيرية في إندونيسيا، تنشر عليها دروسها الدينية عبر الإنترنت؛ بلغ عدد مشتركيها 1,230,000 مشترك بحسب عدّاد vidIQ كما حُدّث في 6 نوفمبر 2026، مع 201,200,000 مشاهدة و7,672 مقطعًا؛ وهي قناة مختلفة عن قناة «إن يو أونلاين» ⁦(@nuonlineid)⁩ التي بلغ مشتركوها 1,580,000 مشترك بحسب vidIQ في 7 نوفمبر 2026، ولا تُدمج القناتان في سجل واحد."
  en: "The official YouTube channel of Nahdlatul Ulama (@nuchannel), Indonesia's largest Muslim mass organisation, carrying its online religious studies; it counted 1,230,000 subscribers by vidIQ's count as updated on 6 November 2026, with 201,200,000 views and 7,672 videos. It is a different channel from NU Online (@nuonlineid), which counted 1,580,000 subscribers by vidIQ's count on 7 November 2026, and the two channels are not merged into one record."
  ur: "نہضۃ العلماء کی باضابطہ یوٹیوب چینل ⁦(@nuchannel)⁩، جو انڈونیشیا کی سب سے بڑی مسلم عوامی تنظیم ہے اور اس پر اپنے آن لائن دینی مطالعات پیش کرتی ہے؛ اس کے سبسکرائبرز کی تعداد 6 نومبر 2026ء کو اپ ڈیٹ کیے گئے vidIQ کے شمار کے مطابق 1,230,000 تھی، جبکہ اس کی ویڈیوز 7,672 اور ویوز 201,200,000 تھے۔ یہ چینل این یو آن لائن ⁦(@nuonlineid)⁩ سے الگ ہے، جس کے سبسکرائبرز 7 نومبر 2026ء کو vidIQ کے شمار کے مطابق 1,580,000 تھے، اور دونوں چینلوں کو ایک ریکارڈ میں ضم نہیں کیا جاتا۔"
  es: "El canal oficial de YouTube de Nahdlatul Ulama (@nuchannel), la mayor organización musulmana de Indonesia, que imparte estudios religiosos en línea, contaba con 1.230.000 suscriptores según el recuento de vidIQ actualizado el 6 de noviembre de 2026, con 201.200.000 visualizaciones y 7.672 vídeos. Se trata de un canal distinto de NU Online (@nuonlineid), que contaba con 1.580.000 suscriptores según el recuento de vidIQ el 7 de noviembre de 2026, y ambos canales no están fusionados en un solo registro."
  fr: "La chaîne YouTube officielle de Nahdlatul Ulama (@nuchannel), la plus grande organisation musulmane d'Indonésie, qui diffuse ses études religieuses en ligne, comptait 1 230 000 abonnés selon le décompte de vidIQ (données mises à jour le 6 novembre 2026), avec 201 200 000 vues et 7 672 vidéos. Il s'agit d'une chaîne distincte de NU Online (@nuonlineid), qui comptait 1 580 000 abonnés selon le décompte de vidIQ (données du 7 novembre 2026), et les chiffres des deux chaînes ne sont pas fusionnés."
  tr: "Endonezya'nın en büyük kitlesel İslami örgütü olan Nahdlatul Ulama'nın (@nuchannel) resmi YouTube kanalı, dini derslerini çevrimiçi olarak yayınlıyor. 6 Kasım 2026 itibarıyla vidIQ verilerine göre 1.230.000 abonesi, 201.200.000 görüntülenmesi ve 7.672 videosu bulunuyor. Bu kanal, 7 Kasım 2026 itibarıyla vidIQ verilerine göre 1.580.000 abonesi olan \"NU Online\" kanalından (@nuonlineid) farklıdır ve iki kanal tek bir kayıtta birleştirilmemiştir."
  id: "Saluran YouTube resmi Nahdlatul Ulama (@nuchannel), organisasi Islam massa terbesar di Indonesia, menerbitkan pelajaran agamanya secara daring. Menurut penghitung vidIQ per 6 November 2026, saluran ini memiliki 1.230.000 pelanggan, dengan 201.200.000 tayangan dan 7.672 video. Saluran ini berbeda dengan saluran “NU Online” (@nuonlineid), yang memiliki 1.580.000 pelanggan menurut vidIQ pada 7 November 2026, dan kedua saluran tersebut tidak digabungkan menjadi satu catatan."
