summary:
  ar: "قبيلة من ربيعة تسكن البحرين؛ قدم الجارود في وفدها على النبي في سنة الوفود فأسلم وأسلم أصحابه، وكان النبي قد بعث قبل الفتح العلاء بن الحضرمي إلى المنذر بن ساوى العبدي فأسلم؛ وارتد بعض من أسلم منهم بعد وفاة النبي مع الغرور بن المنذر فردّهم الجارود. وتذكر المصادر المتأخرة وفادة أولى لهم سنة 5هـ."
  en: "A tribe of Rabi'a settled in Bahrayn; al-Jarud came in its delegation to the Prophet in the Year of Delegations and he and his companions embraced Islam, and before the conquest of Mecca the Prophet had sent al-Ala' ibn al-Hadrami to al-Mundhir ibn Sawa al-Abdi, who converted; after the Prophet's death some of its converts reverted with al-Gharur ibn al-Mundhir and al-Jarud called them back. Later sources record an earlier delegation in 5 AH."
  es: "Una tribu de Rabi'a se estableció en Bahrayn; al-Jarud llegó en su delegación al Profeta en el Año de las Delegaciones, y él y sus compañeros abrazaron el Islam. Antes de la conquista de La Meca, el Profeta había enviado a al-Ala' ibn al-Hadrami a al-Mundhir ibn Sawa al-Abdi, quien se convirtió. Tras la muerte del Profeta, algunos de sus conversos regresaron con al-Gharur ibn al-Mundhir, y al-Jarud los llamó de nuevo. Fuentes posteriores registran una delegación anterior en el año 5 de la Hégira."
  fr: "Une tribu de Rabi'a s'établit à Bahrayn. Al-Jarud vint en délégation auprès du Prophète durant l'Année des Délégations et, avec ses compagnons, se convertit à l'islam. Avant la conquête de La Mecque, le Prophète avait envoyé al-Ala' ibn al-Hadrami auprès d'al-Mundhir ibn Sawa al-Abdi, qui se convertit. Après la mort du Prophète, certains de ses convertis revinrent à l'islam avec al-Gharur ibn al-Mundhir, et al-Jarud les rappela. Des sources plus tardives font état d'une délégation antérieure en l'an 5 de l'Hégire."
  ur: "ربیعہ کا ایک قبیلہ بحرین میں آباد ہوا؛ الجرود وفود کے سال میں رسول اللہ کے پاس اپنے وفد کے ساتھ آیا اور اس نے اور آپ کے ساتھیوں نے اسلام قبول کیا، اور فتح مکہ سے پہلے رسول اللہ نے علاء بن الحدرمی کو المنذر بن سواع العبدی کے پاس بھیجا تھا، جس نے اسلام قبول کیا۔ رسول اللہ کی وفات کے بعد اس کے کچھ لوگ الغرور بن المنذر کے ساتھ واپس چلے گئے اور جارود نے انہیں واپس بلایا۔ بعد کے ذرائع 5 ہجری میں اس سے پہلے کے وفد کو ریکارڈ کرتے ہیں۔"
  tr: "Bahreyn'de yaşayan Rabi'ah kabilesinden olan el-Cerud, Peygamber'e heyetle birlikte Hicri Takvim yılında gelmiş ve arkadaşlarıyla birlikte İslam'ı kabul etmiştir. Mekke'nin fethinden önce Peygamber, el-Ala' ibn el-Hadrami'yi el-Mundhir ibn Sawa el-Abdi'ye göndermiş ve o da İslam'ı kabul etmiştir. Peygamber'in ölümünden sonra, el-Gharur ibn el-Mundhir ile birlikte Müslüman olanlardan bazıları dinden dönmüş, ancak el-Cerud onları geri getirmiştir. Daha sonraki kaynaklar, ilk heyetlerinin Hicri 5. yılda geldiğini belirtmektedir."
  id: "Suku Rabi'ah yang tinggal di Bahrain; al-Jarud datang sebagai bagian dari delegasi mereka kepada Nabi selama Tahun Delegasi, dan dia serta para sahabatnya memeluk Islam. Sebelum penaklukan Mekah, Nabi telah mengirim al-'Ala' ibn al-Hadrami kepada al-Mundhir ibn Sawa al-'Abdi, yang juga memeluk Islam. Beberapa dari mereka yang telah masuk Islam murtad setelah wafatnya Nabi, bersama dengan al-Gharur ibn al-Mundhir, tetapi al-Jarud membawa mereka kembali. Sumber-sumber selanjutnya menyebutkan delegasi pertama mereka pada tahun 5 Hijriah."
