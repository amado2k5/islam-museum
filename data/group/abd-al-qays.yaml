label: { ar: "عبد القيس", en: "Abd al-Qays" }
summary:
  ar: "قبيلة من ربيعة تسكن البحرين؛ قدم الجارود في وفدها على النبي في سنة الوفود فأسلم وأسلم أصحابه، وكان النبي قد بعث قبل الفتح العلاء بن الحضرمي إلى المنذر بن ساوى العبدي فأسلم؛ وارتد بعض من أسلم منهم بعد وفاة النبي مع الغرور بن المنذر فردّهم الجارود. وتذكر المصادر المتأخرة وفادة أولى لهم سنة 5هـ."
  en: "A tribe of Rabi'a settled in Bahrayn; al-Jarud came in its delegation to the Prophet in the Year of Delegations and he and his companions embraced Islam, and before the conquest of Mecca the Prophet had sent al-Ala' ibn al-Hadrami to al-Mundhir ibn Sawa al-Abdi, who converted; after the Prophet's death some of its converts reverted with al-Gharur ibn al-Mundhir and al-Jarud called them back. Later sources record an earlier delegation in 5 AH."
