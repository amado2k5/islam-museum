label:
  ar: "مجمع اللغة العربية بالقاهرة"
  en: "Academy of the Arabic Language in Cairo (Majma' al-Lugha al-'Arabiyya bi-l-Qahira)"
  ur: "مجمع اللغۃ العربیہ قاہرہ"
  fr: "Académie de la langue arabe du Caire (Majma' al-Lugha al-'Arabiyya bi-l-Qahira)"
  es: "Academia de la Lengua Árabe de El Cairo (Majma' al-Lugha al-'Arabiyya bi-l-Qahira)"
summary:
  ar: "مجمع اللغة العربية بالقاهرة، أُنشئ بمرسوم ملكي في 31 ديسمبر 1932 وافتُتح في 30 يناير 1934، وهو ما يلخصه ملف بحث قُدّم للمتحف. نسب الملخص التأسيس إلى الملك فؤاد الأول مع رجال سمّاهم، وجعل عمله ملاءمة العربية لحاجات العلم والثقافة الحديثين ووضع المصطلح العلمي، وذكر من معاجمه المعجم الكبير والمعجم الوسيط ومن بحوثه الأولى ما يخص رسم پ وڤ."
  en: "The Academy of the Arabic Language in Cairo, established by royal decree on 31 December 1932 and inaugurated on 30 January 1934, as a research summary supplied to the museum gives it. The summary ascribes the founding to King Fuad I with named statesmen, makes its work the adaptation of Arabic to modern scientific and cultural needs and the coining of scientific terms, and names among its lexicons al-Mu'jam al-Kabir and al-Mu'jam al-Wasit and among its early debates the letters p and v."
  ur: "مجمع اللغۃ العربیہ قاہرہ، جو 31 دسمبر 1932ء کو شاہی فرمان سے قائم ہوا اور 30 جنوری 1934ء کو اس کا افتتاح ہوا، جیسا کہ عجائب گھر کو فراہم کردہ تحقیقی خلاصہ دیتا ہے۔ خلاصہ تاسیس کو شاہ فواد اول اور نام لیے گئے رہنماؤں سے منسوب کرتا ہے، اس کا کام عربی کو جدید علمی و ثقافتی ضرورتوں کے مطابق ڈھالنا اور علمی اصطلاحات وضع کرنا بتاتا ہے، اور لغات میں المعجم الکبیر اور المعجم الوسیط اور ابتدائی بحثوں میں حروف پ اور ڤ کا ذکر کرتا ہے۔"
  fr: "L'Académie de la langue arabe du Caire, établie par décret royal le 31 décembre 1932 et inaugurée le 30 janvier 1934, comme le donne une note de recherche fournie au musée. La note attribue la fondation au roi Fouad Ier avec des hommes d'État nommés, fait de son travail l'adaptation de l'arabe aux besoins scientifiques et culturels modernes et la création de termes scientifiques, et cite parmi ses lexiques al-Mu'jam al-Kabir et al-Mu'jam al-Wasit et parmi ses premiers débats les lettres p et v."
  es: "La Academia de la Lengua Árabe de El Cairo, establecida por decreto real el 31 de diciembre de 1932 e inaugurada el 30 de enero de 1934, según un resumen de investigación entregado al museo. El resumen atribuye la fundación al rey Fuad I con estadistas nombrados, hace de su labor la adaptación del árabe a las necesidades científicas y culturales modernas y la acuñación de términos científicos, y cita entre sus léxicos al-Mu'jam al-Kabir y al-Mu'jam al-Wasit y entre sus primeros debates las letras p y v."
