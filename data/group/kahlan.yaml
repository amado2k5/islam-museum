  ar: "إحدى كبريات بطون قحطان؛ هاجرت بطونها اليمن قبل سيل العرم وبعده، فمنها الأزد ولخم وجذام وطيء وكندة وهمدان والأزد التي منها الأوس والخزرج وخزاعة وجفنة أبو الغساسنة."
  en: "One of the great Qahtani stocks; its branches left Yemen around the time of the Arim flood, among them al-Azd, Lakhm, Judham, Tayy, Kinda, Hamdan, and the ancestors of the Aws, Khazraj, Khuzaʾa and the Ghassanid house of Jafna."
