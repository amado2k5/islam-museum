label: { ar: "كهلان", en: "Kahlan", es: "Kahlan", fr: "Kahlan", ur: "کاہلان" }
summary:
  ar: "إحدى كبريات بطون قحطان؛ هاجرت بطونها اليمن قبل سيل العرم وبعده، فمنها الأزد ولخم وجذام وطيء وكندة وهمدان والأزد التي منها الأوس والخزرج وخزاعة وجفنة أبو الغساسنة."
  en: "One of the great Qahtani stocks; its branches left Yemen around the time of the Arim flood, among them al-Azd, Lakhm, Judham, Tayy, Kinda, Hamdan, and the ancestors of the Aws, Khazraj, Khuzaʾa and the Ghassanid house of Jafna."
  es: "Una de las grandes estirpes Qahtani; sus ramas abandonaron Yemen en la época de la inundación del Arim, entre ellas al-Azd, Lakhm, Judham, Tayy, Kinda, Hamdan y los antepasados de los Aws, Khazraj, Khuzaʾa y la casa Ghassanid de Jafna."
  fr: "L'une des grandes lignées Qahtani; ses branches ont quitté le Yémen à l'époque du déluge d'Arim, parmi lesquelles al-Azd, Lakhm, Judham, Tayy, Kinda, Hamdan, et les ancêtres des Aws, Khazraj, Khuzaʾa et de la maison Ghassanide de Jafna."
  ur: "عظیم قحطانی اسٹاک میں سے ایک؛ اس کی شاخیں سیلاب ارم کے وقت یمن سے نکلیں، ان میں العزد، لخم، جودھم، طائی، کندہ، ہمدان، اور اوس، خزرج، خزاعہ اور غسانیوں کے گھر جافنا کے آباؤ اجداد شامل ہیں۔"
