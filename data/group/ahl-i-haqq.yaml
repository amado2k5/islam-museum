label:
  ar: "أهل الحق"
  en: "Ahl-i Haqq ('People of the Truth', also called Ali Ilahi)"
  es: "Ahl-i Haqq ('Gente de la Verdad', también llamado Ali Ilahi)"
  fr: "Ahl-i Haqq (« Gens de la Vérité », également appelés Ali Ilahi)"
summary:
  ar: "أهل الحق، «أهل الحق» أو «الحقيقة» في لفظ الجماعة، طائفة سرية في غرب فارس وكردستان وأذربيجان، ذات خليط من غلو الشيعة وأصول صوفية وعقائد التناسخ والتجلي، وترى الألوهية تتجلى سبع مرات، ويُعد سلطان سهاك أعلى مراتب الحقيقة عندهم، وقد دوّن عقائدها كتاب «فرقان الأخبار» لنعمة الله ⁦(1871–1920م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 284}."
  en: "Ahl-i Haqq, 'Men of God', is a secret religion prevalent mainly in western Persia, in Kurdistan, Azerbaijan and the Kirkuk and Sulaymaniyya region. Its beliefs combine Shia extremism with Sufi and syncretic elements, a doctrine of seven manifestations of the Divinity, and metempsychosis. Sultan Sohak is the representative of the highest stage, and the sect's teaching is set out in the Firkan of Ni'mat Allah (1871–1920) {cite:encyclopaedia-of-islam-2 vol. 1 p. 284}."
  es: "Ahl-i Haqq, «Hombres de Dios», es una secta religiosa secreta que se practica principalmente en el oeste de Persia, en Kurdistán, Azerbaiyán y la región de Kirkuk y Sulaymaniyya. Sus creencias combinan el extremismo chiíta con elementos sufíes y sincréticos, una doctrina de siete manifestaciones de la Divinidad y la metempsicosis. Sultan Sohak es el representante de la etapa más elevada, y la enseñanza de la secta se expone en el Firkan de Ni'mat Allah (1871-1920) {cite:encyclopaedia-of-islam-2 vol. 1 p. 284}."
  fr: "Ahl-i Haqq, les « Hommes de Dieu », est une religion secrète répandue principalement dans l'ouest de la Perse, au Kurdistan, en Azerbaïdjan et dans la région de Kirkouk et Souleimaniye. Ses croyances mêlent l'extrémisme chiite à des éléments soufis et syncrétiques, à la doctrine des sept manifestations de la Divinité et à la métempsychose. Le sultan Sohak est le représentant de l'étape la plus élevée, et l'enseignement de la secte est exposé dans le Firkan de Ni'mat Allah (1871-1920) {cite:encyclopaedia-of-islam-2 vol. 1 p. 284}."
