label:
  ar: "أهل الحق"
  en: "Ahl-i Haqq ('People of the Truth', also called Ali Ilahi)"
summary:
  ar: "أهل الحق، «أهل الحق» أو «الحقيقة» في لفظ الجماعة، طائفة سرية في غرب فارس وكردستان وأذربيجان، ذات خليط من غلو الشيعة وأصول صوفية وعقائد التناسخ والتجلي، وترى الألوهية تتجلى سبع مرات، ويُعد سلطان سهاك أعلى مراتب الحقيقة عندهم، وقد دوّن عقائدها كتاب «فرقان الأخبار» لنعمة الله (1871–1920م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 284}."
  en: "Ahl-i Haqq, 'Men of God', is a secret religion prevalent mainly in western Persia, in Kurdistan, Azerbaijan and the Kirkuk and Sulaymaniyya region. Its beliefs combine Shia extremism with Sufi and syncretic elements, a doctrine of seven manifestations of the Divinity, and metempsychosis. Sultan Sohak is the representative of the highest stage, and the sect's teaching is set out in the Firkan of Ni'mat Allah (1871–1920) {cite:encyclopaedia-of-islam-2 vol. 1 p. 284}."
