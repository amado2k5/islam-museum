summary:
  ar: "فرقة خارجية انتشرت خاصة في خراسان، نُسبت إلى مؤسسها عبد الكريم بن عجرد البلخي، وكانت من أصحاب آراء في الأطفال والهجرة والولاية، وأدّت الحمزية منهم دورًا سياسيًا مهمًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  en: "A Kharijite sect that spread especially in Khurasan, named after its founder 'Abd al-Karim b. 'Ajrad of Balkh. Its tenets included the exclusion of children from Islam until they grew up, the view that the hijra was meritorious but not a duty, and the Hamziyya played an important political role {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
