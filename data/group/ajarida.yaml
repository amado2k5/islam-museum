label: { ar: "العجاردة", en: "Ajarida (Kharijite sect)", es: "Ajarida (secta jariyita)", fr: "Ajarida (secte Kharijite)", ur: "اجاریدہ ⁦(خارجی فرقہ)⁩", tr: "El-Ajarda", id: "Al-Ajarda" }
summary:
  ar: "فرقة خارجية انتشرت خاصة في خراسان، نُسبت إلى مؤسسها عبد الكريم بن عجرد البلخي، وكانت من أصحاب آراء في الأطفال والهجرة والولاية، وأدّت الحمزية منهم دورًا سياسيًا مهمًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  en: "A Kharijite sect that spread especially in Khurasan, named after its founder 'Abd al-Karim b. 'Ajrad of Balkh. Its tenets included the exclusion of children from Islam until they grew up, the view that the hijra was meritorious but not a duty, and the Hamziyya played an important political role {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  es: "Una secta jariyí que se extendió especialmente en Jorasán, llamada así por su fundador, Abd al-Karim ibn Ajrad de Balkh. Entre sus preceptos se incluían la exclusión de los niños del Islam hasta que crecieran, la opinión de que la hégira era meritoria pero no una obligación, y la Hamziyya desempeñaba un importante papel político {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  fr: "Une secte kharijite qui s'est répandue surtout au Khorasan, nommée d'après son fondateur 'Abd al-Karim b. 'Ajrad de Balkh. Ses préceptes incluaient l'exclusion des enfants de l'islam jusqu'à leur majorité, l'idée que l'hijra était méritoire mais non un devoir, et le rôle politique important joué par la Hamziyya {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  ur: "خارجی فرقہ جو خاص طور پر خراسان میں پھیلا، اس کا نام اس کے بانی عبد الکریم بن کے نام پر رکھا گیا۔ بلخ کا اجرد۔ اس کے اصولوں میں بچوں کو بڑے ہونے تک اسلام سے خارج کرنا شامل تھا، یہ نظریہ کہ ہجرہ قابل تو تھا لیکن فرض نہیں، اور حمزیہ نے ایک اہم سیاسی کردار ادا کیا۔ 1 ص۔ 226}۔"
  tr: "Özellikle Horasan'da yayılan ve kurucusu Abdül Kerim bin Acrad el-Belkhi'ye atfedilen dış bir grup, çocuk, hicret ve vesayet konularında görüş bildirmiş ve aralarındaki Hamziyye mezhebi önemli bir siyasi rol oynamıştır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}"
  id: "Kelompok eksternal yang menyebar terutama di Khorasan, yang pendirinya adalah Abdul Karim bin Ajrad al-Balkhi, dan mereka memiliki pendapat tentang anak-anak, migrasi dan perwalian, dan kelompok Hamziyyah di antara mereka memainkan peran politik yang penting {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
