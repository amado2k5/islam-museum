summary:
  ar: "قناة يوتيوب كوردية سورانية (@tebinnislam) تجمّع محاضرات واعظين كورد كثيرين تحت عنوانها «گەڕانەوە بۆ قورئان و سونەت» ⁦(العودة إلى القرآن والسنة)⁩؛ بلغ عدد مشتركيها 117,000 مشترك بحسب عدّاد vidIQ كما في 8 نوفمبر 2026. لا تسمّي القناة مؤلفًا فردًا ولا مشغّلًا في أي مصدر قُرئ، فسُجّلت علامةَ قناة لا شخصًا: والواعظون الذين تحملهم — ومنهم مامۆستا هاوڕێ محمد — لا يُنسب إليهم جمهورها، وحمل محاضراتهم لا ينشئ أي علاقة."
  en: "A Sorani Kurdish YouTube channel (@tebinnislam) that aggregates lectures by many Kurdish preachers under its own title گەڕانەوە بۆ قورئان و سونەت — 'Return to the Qur'an and Sunna'; it counted 117,000 subscribers by vidIQ's count as of 8 November 2026. The channel names no individual author or operator in any source read, and it is recorded as a channel brand rather than a person: the preachers it carries — among them Mamosta Hawre Muhammad — are not credited with its audience, and carriage of their lectures creates no relation."
  ur: "سورانی کوردی یوٹیوب چینل (@tebinnislam) جو بہت سے کورد واعظوں کے لیکچرز کو اپنے عنوان «گەڕانەوە بۆ قورئان و سونەت» کے تحت جمع کرتا ہے؛ vidIQ کے شمار کے مطابق 8 نومبر 2026ء کو اس کے سبسکرائبر 117,000 تھے۔ کسی بھی مأخذ میں چینل کسی انفرادی مصنف یا منتظم کا نام نہیں لیتا، اس لیے اسے کسی شخص کے بجائے چینل برانڈ کے طور پر درج کیا گیا ہے؛ جن واعظوں کے لیکچرز یہ نشر کرتا ہے — جن میں ماموستا ہاورێ محمد شامل ہیں — انھیں اس کے ناظرین کا سہرا نہیں دیا جاتا، اور ان کے لیکچرز کی اشاعت کوئی تعلق پیدا نہیں کرتی۔"
