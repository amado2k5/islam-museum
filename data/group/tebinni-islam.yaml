summary:
  ar: "قناة يوتيوب كوردية سورانية (@tebinnislam) تجمّع محاضرات واعظين كورد كثيرين تحت عنوانها «گەڕانەوە بۆ قورئان و سونەت» ⁦(العودة إلى القرآن والسنة)⁩؛ بلغ عدد مشتركيها 117,000 مشترك بحسب عدّاد vidIQ كما في 8 نوفمبر 2026. لا تسمّي القناة مؤلفًا فردًا ولا مشغّلًا في أي مصدر قُرئ، فسُجّلت علامةَ قناة لا شخصًا: والواعظون الذين تحملهم — ومنهم مامۆستا هاوڕێ محمد — لا يُنسب إليهم جمهورها، وحمل محاضراتهم لا ينشئ أي علاقة."
  en: "A Sorani Kurdish YouTube channel (@tebinnislam) that aggregates lectures by many Kurdish preachers under its own title گەڕانەوە بۆ قورئان و سونەت — 'Return to the Qur'an and Sunna'; it counted 117,000 subscribers by vidIQ's count as of 8 November 2026. The channel names no individual author or operator in any source read, and it is recorded as a channel brand rather than a person: the preachers it carries — among them Mamosta Hawre Muhammad — are not credited with its audience, and carriage of their lectures creates no relation."
  ur: "سورانی کوردی یوٹیوب چینل (@tebinnislam) جو بہت سے کورد واعظوں کے لیکچرز کو اپنے عنوان «گەڕانەوە بۆ قورئان و سونەت» کے تحت جمع کرتا ہے؛ vidIQ کے شمار کے مطابق 8 نومبر 2026ء کو اس کے سبسکرائبر 117,000 تھے۔ کسی بھی مأخذ میں چینل کسی انفرادی مصنف یا منتظم کا نام نہیں لیتا، اس لیے اسے کسی شخص کے بجائے چینل برانڈ کے طور پر درج کیا گیا ہے؛ جن واعظوں کے لیکچرز یہ نشر کرتا ہے — جن میں ماموستا ہاورێ محمد شامل ہیں — انھیں اس کے ناظرین کا سہرا نہیں دیا جاتا، اور ان کے لیکچرز کی اشاعت کوئی تعلق پیدا نہیں کرتی۔"
  es: "Un canal de YouTube kurdo sorani (@tebinnislam) que recopila conferencias de muchos predicadores kurdos bajo su propio título گەڕانەوە بۆ قورئان و سونەت — 'Regreso al Corán y la Sunna'; contaba con 117.000 suscriptores según el recuento de vidIQ al 8 de noviembre de 2026. El canal no nombra a ningún autor u operador individual en ninguna fuente consultada, y está registrado como una marca de canal en lugar de una persona: a los predicadores que transmite —entre ellos Mamosta Hawre Muhammad— no se les atribuye su audiencia, y la transmisión de sus conferencias no crea ninguna relación."
  fr: "Une chaîne YouTube kurde sorani (@tebinnislam) qui regroupe des conférences de nombreux prédicateurs kurdes sous le titre « گەڕانەوە بۆ قورئان و سونەت » — « Retour au Coran et à la Sunna » — comptait 117 000 abonnés selon le décompte de vidIQ au 8 novembre 2026. La chaîne ne mentionne aucun auteur ni opérateur dans aucune source consultée et est enregistrée comme une marque plutôt que comme une personne: les prédicateurs qu’elle diffuse — parmi lesquels Mamosta Hawre Muhammad — ne sont pas crédités de son audience, et la diffusion de leurs conférences n’établit aucun lien avec elle."
  tr: "Sorani Kürtçe YouTube kanalı (@tebinnislam), «گەڕانەوە بۆ قُراءان و سونەت» (Kur'an ve Sünnete Dönüş) başlığı altında birçok Kürt vaizin vaazlarını derliyor; vidIQ sayacına göre 8 Kasım 2026 itibariyle 117.000 abonesi bulunuyor. Kanal, okunan hiçbir kaynakta bireysel bir yazar veya işletmecinin adını belirtmiyor, bu nedenle bir kişi değil, bir kanal olarak kayıtlı: ve Mamoosta Hawrê Muhammad dahil olmak üzere yayınladığı vaizler, izleyici kitlesine atfedilmiyor ve vaazlarını indirmek herhangi bir ilişki yaratmıyor."
  id: "Saluran YouTube Kurdi Sorani (@tebinnislam) mengumpulkan ceramah dari banyak pendakwah Kurdi dengan judul «گەڕانەوە بۆ قُراءان و سونەت» (Kembali kepada Al-Qur'an dan Sunnah); saluran ini memiliki 117.000 pelanggan menurut penghitung vidIQ pada tanggal 8 November 2026. Saluran ini tidak menyebutkan nama penulis atau operator individu dalam sumber mana pun yang dibaca, sehingga terdaftar sebagai saluran dan bukan individu: dan para pendakwah yang ditampilkan — termasuk Mamoosta Hawrê Muhammad — tidak dikaitkan dengan audiensnya, dan mengunduh ceramah mereka tidak menciptakan hubungan apa pun."
