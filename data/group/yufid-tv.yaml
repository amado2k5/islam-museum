summary:
  ar: "شبكة إعلامية دعوية إندونيسية مقرها منطقة يوجياكارتا، تأسست سنة 2009 وتديرها مؤسسة شبكة يوفيد (سُجّلت قانونيًا سنة 2014)؛ تدير قنوات يوفيد تي في ويوفيد إيدو ويوفيد كيدز ومنصات استشارية، ويصفها الباحثون بأنها منصة الدعوة السلفية الأوسع انتشارًا في إندونيسيا."
  en: "An Indonesian dawah media network based in the Yogyakarta region, formed in 2009 and run by the Yufid Network foundation (legally registered in 2014); it operates the Yufid.TV, Yufid EDU and Yufid Kids channels and consultation platforms, and scholars describe it as Indonesia's widest-reaching Salafi dawah platform."
  ur: "یوفد نیٹ ورک انڈونیشیا کا ایک دعوتی میڈیا نیٹ ورک ہے جس کا مرکز یوگیاکارتا خطے میں ہے؛ یہ 2009ء میں قائم ہوا اور 2014ء میں قانونی طور پر رجسٹرڈ یوفد نیٹ ورک فاؤنڈیشن اسے چلاتی ہے۔ یہ یوفد ٹی وی، یوفد ای ڈی یو اور یوفد کڈز چینلز چلاتا ہے، اور محققین اسے انڈونیشیا کا سب سے وسیع رسائی والا سلفی دعوتی پلیٹ فارم قرار دیتے ہیں۔"
founded: { edtf: "2009", calendar: gregorian, precision: year, status: historical, note: "Formed in Yogyakarta in 2009: the channel project dates to June 2009 and the founders were Gadjah Mada University IT-department graduates who met at Salafi campus lectures run by the al-Atsari Islamic Education Foundation (YPIA); their first project was the yufid.com search engine restricted to approved Salafi sources. The operating foundation, Yayasan Yufid Network, was legally registered on 27 October 2014 (decree SK AHU-0006780.50.80.2014) and is based in Sleman, in the Special Region of Yogyakarta.", sources: [source/inside-indonesia-yufid, source/unisba-yufid-tv-proceedings, source/islam-futura-yufid-2025] }
