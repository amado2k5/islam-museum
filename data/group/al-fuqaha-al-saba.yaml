label:
  ar: "الفقهاء السبعة"
  en: "The Seven Jurists of Medina"
  es: "Los siete juristas de Medina"
  fr: "Les sept juristes de Médine"
  ur: "مدینہ کے سات فقہاء"
  tr: "Yedi Hukukçu"
  id: "Tujuh Ahli Hukum"
summary:
  ar: "الفقهاء السبعة من أكابر التابعين بالمدينة، وهم في عدّ أكثر علماء الحجاز: سعيد بن المسيب، والقاسم بن محمد بن أبي بكر، وعروة بن الزبير، وخارجة بن زيد بن ثابت، وأبو سلمة بن عبد الرحمن بن عوف، وعبيد الله بن عبد الله بن عتبة، وسليمان بن يسار. وجعل ابن المبارك سالم بن عبد الله بن عمر بدل أبي سلمة، وجعل أبو الزناد أبا بكر بن عبد الرحمن بدلهما، وعدّهم علي بن المديني اثني عشر {cite:tadrib-rawi-awwama-v5 p. 255-257}."
  en: "The Seven Jurists are among the greatest Successors of Medina. As most scholars of the Hijaz count them they are Sa'id ibn al-Musayyab, al-Qasim ibn Muhammad ibn Abi Bakr, Urwa ibn al-Zubayr, Kharija ibn Zayd ibn Thabit, Abu Salama ibn Abd al-Rahman ibn Awf, Ubayd Allah ibn Abd Allah ibn Utba and Sulayman ibn Yasar. Ibn al-Mubarak put Salim ibn Abd Allah ibn Umar in place of Abu Salama, Abu al-Zinad put Abu Bakr ibn Abd al-Rahman in place of both, and Ali ibn al-Madini counted twelve."
  es: "Los Siete Juristas se encuentran entre los mayores sucesores de Medina. Como los cuentan la mayoría de los eruditos del Hijaz, son Sa'id ibn al-Musayyab, al-Qasim ibn Muhammad ibn Abi Bakr, Urwa ibn al-Zubayr, Kharija ibn Zayd ibn Thabit, Abu Salama ibn Abd al-Rahman ibn Awf, Ubayd Allah ibn Abd Allah ibn Utba y Sulayman ibn Yasar. Ibn al-Mubarak puso a Salim ibn Abd Allah ibn Umar en lugar de Abu Salama, Abu al-Zinad puso a Abu Bakr ibn Abd al-Rahman en lugar de ambos y Ali ibn al-Madini contó doce."
  fr: "Les Sept Juristes comptent parmi les plus grands successeurs de Médine. Comme la plupart des érudits du Hijaz les comptent, ils sont Sa'id ibn al-Musayyab, al-Qasim ibn Muhammad ibn Abi Bakr, Urwa ibn al-Zubayr, Kharija ibn Zayd ibn Thabit, Abu Salama ibn Abd al-Rahman ibn Awf, Ubayd Allah ibn Abd Allah ibn Utba et Sulayman ibn Yasar. Ibn al-Mubarak a mis Salim ibn Abd Allah ibn Umar à la place d'Abu Salama, Abu al-Zinad a mis Abu Bakr ibn Abd al-Rahman à la place des deux, et Ali ibn al-Madini en a compté douze."
  ur: "سات فقہاء مدینہ کے عظیم جانشینوں میں سے ہیں۔ جیسا کہ حجاز کے اکثر علماء نے ان کو شمار کیا ہے وہ ہیں سعید بن المسیب، القاسم بن محمد ابن ابی بکر، عروہ بن الزبیر، خارجہ بن زید بن ثابت، ابو سلمہ بن عبدالرحمٰن بن عوف، عبید اللہ بن یعقوب بن ثنیب اور عبد اللہ بن ثقلین۔ ابن المبارک نے ابو سلمہ کی جگہ سالم بن عبد اللہ بن عمر کو رکھا، ابو الزناد نے دونوں کی جگہ ابوبکر بن عبدالرحمٰن کو رکھا اور علی ابن المدینی نے بارہ شمار کئے۔"
  tr: "Yedi Hukukçu, Medine'deki Halifelerin (Tabi'in) en önde gelenleri arasındaydı ve Hicaz alimlerinin çoğuna göre bunlar şunlardır: Sa'id ibn al-Musayyab, al-Qasim ibn Muhammed ibn Ebi Bekr, 'Urveh ibn al-Zübeyr, Kharijah ibn Zeyd ibn Sabit, Ebu Seleme ibn 'Abd al-Rahman ibn' Avf, 'Ubeyd Allah ibn 'Abd Allah ibn Utbe ve Süleyman ibn Yesar. İbnü'l-Mübarek, Ebu Seleme'nin yerine Salim ibn 'Abd Allah ibn' Ömer'i getirdi ve Ebu el-Zinad onların yerine Ebu Bekir ibn 'Abd al-Rahman'ı getirdi. Ali ibn el-Medini onları on iki olarak saydı. {alıntı:tadrib-rawi-awwama-v5 s. 255-257}"
  id: "Tujuh Ahli Hukum tersebut termasuk di antara para Penerus (Tabi'in) yang paling terkemuka di Madinah, dan menurut sebagian besar ulama Hijaz, mereka adalah: Sa'id ibn al-Musayyab, al-Qasim ibn Muhammad ibn Abi Bakr, 'Urwah ibn al-Zubayr, Kharijah ibn Zayd ibn Thabit, Abu Salamah ibn 'Abd al-Rahman ibn 'Awf, 'Ubayd Allah ibn 'Abd Allah ibn 'Utbah, dan Sulaiman ibn Yasar. Ibn al-Mubarak menggantikan Abu Salamah dengan Salim ibn 'Abd Allah ibn 'Umar, dan Abu al-Zinad menggantinya dengan Abu Bakr ibn 'Abd al-Rahman. 'Ali ibn al-Madini menghitungnya ada dua belas. {mengutip:tadrib-rawi-awwama-v5 hal. 255-257}"
