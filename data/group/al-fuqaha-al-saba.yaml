label:
  ar: "الفقهاء السبعة"
  en: "The Seven Jurists of Medina"
summary:
  ar: "الفقهاء السبعة من أكابر التابعين بالمدينة، وهم في عدّ أكثر علماء الحجاز: سعيد بن المسيب، والقاسم بن محمد بن أبي بكر، وعروة بن الزبير، وخارجة بن زيد بن ثابت، وأبو سلمة بن عبد الرحمن بن عوف، وعبيد الله بن عبد الله بن عتبة، وسليمان بن يسار. وجعل ابن المبارك سالم بن عبد الله بن عمر بدل أبي سلمة، وجعل أبو الزناد أبا بكر بن عبد الرحمن بدلهما، وعدّهم علي بن المديني اثني عشر {cite:tadrib-rawi-awwama-v5 p. 255-257}."
  en: "The Seven Jurists are among the greatest Successors of Medina. As most scholars of the Hijaz count them they are Sa'id ibn al-Musayyab, al-Qasim ibn Muhammad ibn Abi Bakr, Urwa ibn al-Zubayr, Kharija ibn Zayd ibn Thabit, Abu Salama ibn Abd al-Rahman ibn Awf, Ubayd Allah ibn Abd Allah ibn Utba and Sulayman ibn Yasar. Ibn al-Mubarak put Salim ibn Abd Allah ibn Umar in place of Abu Salama, Abu al-Zinad put Abu Bakr ibn Abd al-Rahman in place of both, and Ali ibn al-Madini counted twelve."
