  ar: "اسم وزارة الحرب في الدولة العثمانية في القرن التاسع عشر؛ أُنشئ بعد القضاء على الإنكشارية سنة 1241هـ/1826م بمنصب السرعسكر الجامع لقيادة الجيش ووزارة الحرب، ثم صار يُسمى وزارة الحرب (حربية) نهائياً سنة 1324هـ/1908م {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
  en: "The name of the War Department in the Ottoman Empire in the nineteenth century; created after the destruction of the Janissaries in 1241/1826 under the Ser'asker, who combined commander-in-chief and minister of war, and renamed Ministry of War (Harbiyye) permanently in 1324/1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
