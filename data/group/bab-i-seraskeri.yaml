label:
  ar: "باب السرعسكري"
  en: "Bab-i Ser'askeri (Ottoman War Department)"
  ur: "باب سرعسکری"
  es: "Bab-i Ser'askeri (Departamento de Guerra Otomano)"
  fr: "Bab-i Ser'askeri (Département de la guerre ottomane)"
  tr: "Bab al-Sar'askari"
  id: "Bab al-Sar'askari"
summary:
  ar: "اسم وزارة الحرب في الدولة العثمانية في القرن التاسع عشر؛ أُنشئ بعد القضاء على الإنكشارية سنة 1241هـ/1826م بمنصب السرعسكر الجامع لقيادة الجيش ووزارة الحرب، ثم صار يُسمى وزارة الحرب ⁦(حربية)⁩ نهائياً سنة 1324هـ/1908م {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
  en: "The name of the War Department in the Ottoman Empire in the nineteenth century; created after the destruction of the Janissaries in 1241/1826 under the Ser'asker, who combined commander-in-chief and minister of war, and renamed Ministry of War (Harbiyye) permanently in 1324/1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
  es: "Nombre del Departamento de Guerra en el Imperio Otomano en el siglo XIX; creado tras la destrucción de los jenízaros en 1241/1826 bajo el Ser'asker, que combinaba comandante en jefe y ministro de guerra, y renombrado Ministerio de Guerra (Harbiyye) de forma permanente en 1324/1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
  fr: "Le nom du Département de la Guerre dans l'Empire ottoman au XIXe siècle; créé après la destruction des Janissaires en 1241/1826 sous le Ser'asker, qui combinait commandant en chef et ministre de la guerre, et rebaptisé Ministère de la Guerre (Harbiyye) de façon permanente en 1324/1908 {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
  ur: "انیسویں صدی میں سلطنت عثمانیہ میں محکمہ جنگ کا نام؛ جنیسریوں کی تباہی کے بعد 1241/1826 میں سیراسکر کے تحت تشکیل دیا گیا، جس نے کمانڈر انچیف اور وزیر جنگ کو ملایا، اور 1324/1908 میں مستقل طور پر وزارت جنگ ⁦(حربیے)⁩ کا نام تبدیل کر دیا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 895}۔"
  tr: "Osmanlı Devleti'nde 19. yüzyıldaki Savaş Bakanlığı'nın adı; 1241 Hicri/1826 Miladi yılında Yeniçerilerin ortadan kaldırılmasının ardından, ordunun ve Savaş Bakanlığının liderliğini birleştiren Başkomutanlık makamı ile kurulmuş, daha sonra Savaş Bakanlığı (Harbiyya) olarak adlandırılmış ve nihayet 1324 Hicri/1908 Miladi yılında bu adı almıştır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}"
  id: "Nama Kementerian Perang di Negara Utsmani pada abad kesembilan belas; kementerian ini didirikan setelah penghapusan Janissari pada tahun 1241 H/1826 M dengan posisi Panglima Tertinggi yang menggabungkan kepemimpinan tentara dan Kementerian Perang, kemudian disebut Kementerian Perang (Harbiyya) dan akhirnya pada tahun 1324 H/1908 M {cite:encyclopaedia-of-islam-2 vol. 1 p. 895}."
