summary:
  ar: "قناة تجميعية إندونيسية على يوتيوب (@ammartv) تحمل تلاوات المرتل ومحاضرات دعوية، بلغ عدد مشتركيها 5,380,000 مشترك بحسب عدّاد vidIQ كما في 15 نوفمبر 2026، وأكثر مقاطعها مشاهدة تجميعات تلاوة للمقرئ مزمل حسب الله. لا يسمّي أي مصدر قُرئ مشغّلًا فردًا لها، فسُجّلت علامةَ قناة لا شخصًا، ولا تُنسب إليها أرقام أي مقرئ تحمل تلاواته ولا يُنسب جمهوره إليه."
  en: "An Indonesian aggregator channel on YouTube (@ammartv) carrying murottal recitation and dawah lectures, with 5,380,000 subscribers by vidIQ's count as of 15 November 2026; its most-viewed uploads are recitation compilations by the reciter Muzammil Hasballah. No source read names an individual operator for it, so it is recorded as a channel brand rather than a person, and its audience is credited to no reciter whose recordings it carries, nor theirs to it."
  ur: "انڈونیشیا کی ایک مجموعی ⁦(aggregator)⁩ یوٹیوب چینل ⁦(@ammartv)⁩ جو مرتل تلاوتیں اور دعوتی لیکچرز پیش کرتی ہے؛ 15 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 5,380,000 تھے، اور اس کی سب سے زیادہ دیکھی گئی ویڈیوز قاری مزمل حسب اللہ کی تلاوتوں کے مجموعے ہیں۔ کسی بھی مأخذ میں اس کا کوئی انفرادی منتظم نامزد نہیں، اس لیے اسے کسی شخص کے بجائے چینل برانڈ کے طور پر درج کیا گیا ہے، اور اس کے ناظرین کا سہرا کسی ایسے قاری کو نہیں دیا جاتا جس کی تلاوتیں یہ پیش کرتی ہے۔"
  es: "Un canal agregador indonesio en YouTube (@ammartv) que transmite recitaciones de murottal y conferencias de dawah, con 5.380.000 suscriptores según el recuento de vidIQ al 15 de noviembre de 2026; sus videos más vistos son compilaciones de recitaciones del recitador Muzammil Hasballah. Ninguna fuente menciona a un operador individual, por lo que se registra como una marca de canal en lugar de una persona, y su audiencia no se atribuye a ningún recitador cuyas grabaciones transmita, ni viceversa."
  fr: "Une chaîne indonésienne sur YouTube (@ammartv) diffusant des récitations de murottal et des conférences de da'wa, comptant 5 380 000 abonnés selon le décompte de vidIQ au 15 novembre 2026; ses vidéos les plus vues sont des compilations de récitations du récitant Muzammil Hasballah. Aucune source ne mentionne d'opérateur individuel; la chaîne est donc répertoriée comme une marque et non comme une personne. Son audience n'est attribuée ni au récitant dont elle diffuse les enregistrements, ni à la chaîne."
  tr: "Endonezya merkezli bir YouTube kanalı olan (@ammartv), Kur'an okumaları ve dini vaazlar yayınlıyor ve vidIQ verilerine göre 15 Kasım 2026 itibariyle 5.380.000 aboneye sahip. En çok izlenen videoları ise Kur'an okuyucusu Muzammil Hasaballah'ın okumalarından oluşan derlemeler. Herhangi bir kaynakta kanalın sahibi belirtilmediği için, kanal bir kişi adına değil, bir ticari marka adına kayıtlıdır. Kanala ait herhangi bir okuyucu sayısı veya izleyici kitlesi bilgisi de verilmemiştir."
  id: "Sebuah saluran YouTube Indonesia (@ammartv) yang menampilkan lantunan Al-Quran dan ceramah agama, memiliki 5.380.000 pelanggan menurut vidIQ per 15 November 2026. Video yang paling banyak ditonton adalah kompilasi lantunan Al-Quran oleh qari Muzammil Hasaballah. Tidak ada operator individu yang disebutkan dalam sumber mana pun; oleh karena itu, saluran tersebut terdaftar di bawah merek dagang, bukan atas nama orang. Tidak ada angka qari atau jumlah penonton yang dikaitkan dengan saluran tersebut."
