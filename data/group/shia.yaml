label: { ar: "الشيعة", en: "Shia", es: "Chiíta", fr: "Chiite", ur: "شیعہ", tr: "Şiiler", id: "Syiah" }
summary:
  ar: "الشيعة، قال ابن النديم: لما خالف طلحة والزبير عليا وأبيا إلا الطلب بدم عثمان وقصدهما علي ليقاتلهما حتى يفيئا إلى أمر الله تسمى من اتبعه على ذلك الشيعة فكان يقول شيعتي وسماهم الأصفياء والأولياء وشرطة الخميس والأصحاب، ومعنى شرطة الخميس أن عليا قال هذه الطائفة تشترطوا فإنما أشارطكم على الجنة ولست أشارطكم على ذهب ولا فضة، وأول من تكلم في مذهب الإمامة علي بن إسماعيل بن ميثم التمار وهشام بن الحكم الذي فتق الكلام في الإمامة وهذب المذهب {cite:fihrist-ibn-al-nadim p. 249}."
  en: "The Shi'a — the name Ali gave his followers at the fitna of the Camel, and the first imamate theologians {cite:fihrist-ibn-al-nadim}"
  es: "Los chiítas — el nombre que Ali dio a sus seguidores en la fitna del Camello, y los primeros teólogos del imamato {cite:fihrist-ibn-al-nadim}"
  fr: "Les chiites — le nom qu'Ali donna à ses disciples lors de la fitna du chameau, et les premiers théologiens imamat {cite:fihrist-ibn-al-nadim}"
  ur: "شیعہ - یہ نام علی نے اپنے پیروکاروں کو اونٹ کے فتنے پر دیا تھا، اور پہلے امام الہیات {حوالہ: فہرست ابن الندیم}"
  tr: "İbn el-Nadim şöyle demiştir: Talha ve el-Zübeyr, Ali'ye karşı çıktıklarında ve Osman'ın kanının intikamını almaktan başka bir şey yapmayı reddettiklerinde, Ali de Allah'ın emrine dönene kadar onlarla savaşmayı amaçlamıştı. Bu konuda ona uyanlara Şiiler denildi. Ali, \"Şiilerim\" derdi ve onlara seçilmişler, evliyalar, Perşembe polisi ve sahabeler diye hitap ederdi. Perşembe polisi ifadesinin anlamı şudur: Ali, \"Bu grup şartlar koyuyor, ben de sizinle sadece cennet için şartlar koyuyorum, altın veya gümüş için şartlar koymuyorum\" demiştir. İmamet doktrininden ilk bahsedenler Ali ibn İsmail ibn Meytham el-Tammar ve Hişam ibn el-Hakam'dır; onlar imamet doktrinini detaylandırıp geliştirmişlerdir. {cite:fihrist-ibn-al-nadim s. 249}"
  id: "Ibnu al-Nadim berkata tentang kaum Syiah: Ketika Talha dan al-Zubayr menentang Ali dan menolak untuk melakukan apa pun selain menuntut pembalasan atas darah Utsman, dan Ali bermaksud untuk memerangi mereka sampai mereka kembali kepada perintah Allah, orang-orang yang mengikutinya dalam hal itu disebut kaum Syiah. Dia biasa berkata, “Kaum Syiahku,” dan dia menyebut mereka orang-orang pilihan, para wali, Polisi Kamis, dan para sahabat. Arti dari Polisi Kamis adalah bahwa Ali berkata, “Kelompok ini membuat syarat, jadi aku hanya membuat syarat dengan kalian untuk Surga, dan aku tidak membuat syarat dengan kalian untuk emas atau perak.” Orang pertama yang berbicara tentang doktrin Imamah adalah Ali ibn Ismail ibn Maytham al-Tammar dan Hisham ibn al-Hakam, yang menguraikan doktrin Imamah dan menyempurnakan doktrin tersebut. {cite:fihrist-ibn-al-nadim p. 249}"
