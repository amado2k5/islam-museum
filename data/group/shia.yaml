label: { ar: "الشيعة", en: "Shia" }
summary:
  ar: "الشيعة، قال ابن النديم: لما خالف طلحة والزبير عليا وأبيا إلا الطلب بدم عثمان وقصدهما علي ليقاتلهما حتى يفيئا إلى أمر الله تسمى من اتبعه على ذلك الشيعة فكان يقول شيعتي وسماهم الأصفياء والأولياء وشرطة الخميس والأصحاب، ومعنى شرطة الخميس أن عليا قال هذه الطائفة تشترطوا فإنما أشارطكم على الجنة ولست أشارطكم على ذهب ولا فضة، وأول من تكلم في مذهب الإمامة علي بن إسماعيل بن ميثم التمار وهشام بن الحكم الذي فتق الكلام في الإمامة وهذب المذهب {cite:fihrist-ibn-al-nadim p. 249}."
  en: "The Shi'a — the name Ali gave his followers at the fitna of the Camel, and the first imamate theologians {cite:fihrist-ibn-al-nadim}"
