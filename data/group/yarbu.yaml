label: { ar: "بنو يربوع", en: "Banu Yarbuʿ", es: "Banu Yarbuʿ", fr: "Banu Yarbuʿ", ur: "بنو یثرب", tr: "Banu Yarbu'", id: "Banu Yarbu'" }
summary:
  ar: "بنو يربوع بن حنظلة بن مالك بن زيد مناة بن تميم؛ بطن تميمي بأعالي نجد، منهم في الإسلام القعقاع بن عمرو بن مالك أحد فرسان أهل الردة والفتوح، وبنو يربوع من أعدد قبائل العرب فرساناً {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
  en: "Banu Yarbu' ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim — an upper-Najd Tamimi clan; from them in Islam al-Qa'qa' ibn Amr ibn Malik, a horseman of the Ridda wars and the conquests, and Yarbu' was among the Arab tribes richest in riders {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
  es: "Banu Yarbu' ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim, un clan Tamimi del alto Najd; de ellos en el Islam al-Qa'qa' ibn Amr ibn Malik, un jinete de las guerras y conquistas de Ridda, y Yarbu' estaba entre las tribus árabes más ricas en jinetes {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
  fr: "Banu Yarbu' ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim — un clan Tamimi du haut Najd; d'eux dans l'Islam al-Qa'qa' ibn Amr ibn Malik, un cavalier des guerres de Ridda et des conquêtes, et Yarbu' était parmi les tribus arabes les plus riches en cavaliers {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
  ur: "بنو یربو ابن حنظلہ ابن مالک ابن زید منات ابن تمیم - ایک بالائی نجد تمیمی قبیلہ؛ ان میں سے اسلام میں قعقا بن عمرو بن مالک جو ردا کی جنگوں اور فتوحات کا ایک گھڑ سوار تھا اور یربو سواروں میں سب سے زیادہ امیر عرب قبائل میں سے تھا۔"
  tr: "Banu Yarbu’ ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim; Yukarı Necd'de yaşayan bir Tamimi kabilesidir. İslam'da aralarında, mürted ve fetih ehlinin şövalyelerinden biri olan Al-Qa’qa’ ibn Amr ibn Malik de vardı. Banu Yarbu’, şövalye sayısı bakımından en kalabalık Arap kabilelerinden biridir. {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
  id: "Banu Yarbu’ ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim; sebuah klan Tamimi di hulu Najd. Di antara mereka yang memeluk Islam adalah Al-Qa’qa’ ibn Amr ibn Malik, salah satu ksatria dari kaum murtad dan penakluk. Banu Yarbu’ termasuk di antara suku Arab yang paling banyak jumlahnya dalam hal ksatria. {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
