summary:
  ar: "بنو يربوع بن حنظلة بن مالك بن زيد مناة بن تميم؛ بطن تميمي بأعالي نجد، منهم في الإسلام القعقاع بن عمرو بن مالك أحد فرسان أهل الردة والفتوح، وبنو يربوع من أعدد قبائل العرب فرساناً {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
  en: "Banu Yarbu' ibn Hanzala ibn Malik ibn Zayd Manat ibn Tamim — an upper-Najd Tamimi clan; from them in Islam al-Qa'qa' ibn Amr ibn Malik, a horseman of the Ridda wars and the conquests, and Yarbu' was among the Arab tribes richest in riders {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:isaba}."
