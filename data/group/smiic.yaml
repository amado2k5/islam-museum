id: group/smiic
class: group
kind: standards-body
label:
  ar: معهد المواصفات والمقاييس للدول الإسلامية
  en: Standards and Metrology Institute for Islamic Countries (SMIIC)
  ur: اسلامی ممالک کا ادارہ برائے معیارات و پیمائش
summary:
  ar: منظمة حكومية دولية مقرها إسطنبول، من المؤسسات المنتسبة إلى منظمة التعاون الإسلامي، تُعنى بالتقييس والمقاييس وإزالة العوائق
    الفنية أمام التجارة بين 37 دولة عضوا ومراقبَين؛ دخل نظامها الأساسي حيز النفاذ في مايو 2010.
  en: An intergovernmental body based in Istanbul, affiliated to the Organisation of Islamic Cooperation, working on standardisation,
    metrology and the removal of technical barriers to trade among 37 member states and two observers; its statute entered
    into force in May 2010.
  ur: استنبول میں قائم بین الحکومتی ادارہ، تنظیمِ تعاونِ اسلامی سے ملحق، جو 37 رکن ملکوں اور دو مبصرین کے درمیان معیار بندی،
    پیمائش اور تجارت کی فنی رکاوٹیں دور کرنے پر کام کرتا ہے؛ اس کا دستور مئی 2010 میں نافذ ہوا۔
