id: group/smiic
class: group
kind: standards-body
label:
  ar: معهد المواصفات والمقاييس للدول الإسلامية
  en: Standards and Metrology Institute for Islamic Countries (SMIIC)
  ur: اسلامی ممالک کا ادارہ برائے معیارات و پیمائش
  es: "Instituto de Normas y Metrología para los Países Islámicos (SMIIC)"
  fr: "Institut des normes et de la métrologie des pays islamiques (SMIIC)"
  tr: "İslam Ülkeleri Standartlar ve Metroloji Enstitüsü"
  id: "Lembaga Standar dan Metrologi untuk Negara-negara Islam"
summary:
  ar: منظمة حكومية دولية مقرها إسطنبول، من المؤسسات المنتسبة إلى منظمة التعاون الإسلامي، تُعنى بالتقييس والمقاييس وإزالة العوائق
    الفنية أمام التجارة بين 37 دولة عضوا ومراقبَين؛ دخل نظامها الأساسي حيز النفاذ في مايو 2010.
  en: An intergovernmental body based in Istanbul, affiliated to the Organisation of Islamic Cooperation, working on standardisation,
    metrology and the removal of technical barriers to trade among 37 member states and two observers; its statute entered
    into force in May 2010.
  ur: استنبول میں قائم بین الحکومتی ادارہ، تنظیمِ تعاونِ اسلامی سے ملحق، جو 37 رکن ملکوں اور دو مبصرین کے درمیان معیار بندی،
    پیمائش اور تجارت کی فنی رکاوٹیں دور کرنے پر کام کرتا ہے؛ اس کا دستور مئی 2010 میں نافذ ہوا۔
  es: "Órgano intergubernamental con sede en Estambul, afiliado a la Organización para la Cooperación Islámica, que trabaja en la normalización, la metrología y la eliminación de barreras técnicas al comercio entre 37 Estados miembros y dos observadores; su estatuto entró en vigor en mayo de 2010."
  fr: "Organisme intergouvernemental basé à Istanbul, affilié à l'Organisation de la coopération islamique, œuvrant à la normalisation, à la métrologie et à la suppression des obstacles techniques au commerce entre 37 États membres et deux observateurs; ses statuts sont entrés en vigueur en mai 2010."
  tr: "Merkezi İstanbul'da bulunan, İslam İşbirliği Teşkilatı'na bağlı, 37 üye devlet ve iki gözlemci ülke arasında standardizasyon, metroloji ve ticaretteki teknik engellerin kaldırılmasıyla ilgilenen hükümetler arası bir kuruluş; tüzüğü Mayıs 2010'da yürürlüğe girmiştir."
  id: "Sebuah organisasi antar pemerintah yang berbasis di Istanbul, berafiliasi dengan Organisasi Kerja Sama Islam, yang bergerak di bidang standardisasi, metrologi, dan penghapusan hambatan teknis perdagangan antara 37 negara anggota dan dua pengamat; statuta organisasi ini mulai berlaku pada Mei 2010."
