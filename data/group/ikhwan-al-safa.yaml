label:
  ar: إخوان الصفا
  en: Ikhwan al-Safa (Brethren of Purity)
  ur: اخوان الصفا
  es: "Ikhwan al-Safa (Hermanos de la Pureza)"
  fr: "Ikhwan al-Safa (Frères de la Pureté)"
  tr: "Saflık Kardeşleri"
  id: "Persaudaraan Kemurnian"
summary:
  ar: "إخوان الصفا جماعة أدبية وفلسفية في البصرة في القرن الرابع الهجري صاحبة رسائل إخوان الصفا إحدى وخمسين رسالة؛ يذكر الذهبي في سير أعلام النبلاء عكوف أبي حامد الغزالي عليها ونقاشه فيها {cite:siyar-alam-nubala-ideas-house}."
  en: "Ikhwan al-Safa was a literary-philosophical circle in fourth-century Basra, authors of the fifty-one Epistles of the Brethren of Purity; al-Dhahabi's Siyar records Abu Hamid al-Ghazali's engagement with the epistles and the debate around them {cite:siyar-alam-nubala-ideas-house}."
  es: "Ikhwan al-Safa fue un círculo literario-filosófico en Basora en el siglo IV, autores de las cincuenta y una Epístolas de los Hermanos de la Pureza; el Siyar de al-Dhahabi registra la interacción de Abu Hamid al-Ghazali con las epístolas y el debate en torno a ellas {cite:siyar-alam-nubala-ideas-house}."
  fr: "Ikhwan al-Safa était un cercle littéraire et philosophique du IVe siècle à Bassora, auteurs des cinquante et une Épîtres des Frères de la Pureté; le Siyar d'al-Dhahabi relate l'engagement d'Abu Hamid al-Ghazali avec les épîtres et le débat autour d'elles {cite:siyar-alam-nubala-ideas-house}."
  ur: "اخوان الصفا چوتھی صدی کے بصرہ میں ایک ادبی فلسفیانہ حلقہ تھا، جو برادران آف پیوریٹی کے اکیاون خطوط کے مصنف تھے۔ الذہبی کے سیار میں ابو حامد الغزالی کی خطوط کے ساتھ مشغولیت اور ان کے ارد گرد ہونے والی بحث کو درج کیا گیا ہے۔"
  tr: "Saflık Kardeşleri, Hicri dördüncü yüzyılda Basra'da faaliyet gösteren edebi ve felsefi bir topluluktu. Elli bir adet olan Saflık Kardeşleri Mektupları'nı kaleme aldılar. El-Dhahabi, Siyar A'lam al-Nubala' adlı eserinde Ebu Hamid el-Gazali'nin onlara kendini adadığını ve onların eserlerini tartıştığını belirtir."
  id: "Persaudaraan Kesucian adalah kelompok sastrawan dan filsuf di Basra pada abad ke-4 Hijriah. Mereka menulis Surat-surat Persaudaraan Kesucian, yang berjumlah lima puluh satu. Al-Dhahabi menyebutkan dalam Siyar A'lam al-Nubala' bahwa Abu Hamid al-Ghazali mengabdikan dirinya untuk mempelajari dan mendiskusikan karya-karya mereka."
