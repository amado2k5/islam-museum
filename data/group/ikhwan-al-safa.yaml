  en: "Ikhwan al-Safa was a literary-philosophical circle in fourth-century Basra, authors of the fifty-one Epistles of the Brethren of Purity; al-Dhahabi's Siyar records Abu Hamid al-Ghazali's engagement with the epistles and the debate around them {cite:siyar-alam-nubala-ideas-house}."
