summary:
  ar: "قبيلة من غطفان؛ لقيهم زيد بن حارثة بوادي القرى فأصيب ناس من أصحابه وحُمل زيد جريحاً، فآلى ألا يغتسل من جنابة حتى يغزوهم، فبعثه النبي إليهم فقتلهم بوادي القرى وقُتلت فيهم أم قرفة فاطمة بنت ربيعة بن بدر."
  en: "A tribe of Ghatafan; Zayd ibn Haritha met them at Wadi al-Qura, some of his men were struck and he was carried off wounded, and he swore not to wash from major impurity until he had raided them; the Prophet sent him back and he slaughtered them at Wadi al-Qura, where Umm Qirfa Fatima bint Rabi'a ibn Badr was killed."
