summary:
  ar: "قبيلة من غطفان؛ لقيهم زيد بن حارثة بوادي القرى فأصيب ناس من أصحابه وحُمل زيد جريحاً، فآلى ألا يغتسل من جنابة حتى يغزوهم، فبعثه النبي إليهم فقتلهم بوادي القرى وقُتلت فيهم أم قرفة فاطمة بنت ربيعة بن بدر."
  en: "A tribe of Ghatafan; Zayd ibn Haritha met them at Wadi al-Qura, some of his men were struck and he was carried off wounded, and he swore not to wash from major impurity until he had raided them; the Prophet sent him back and he slaughtered them at Wadi al-Qura, where Umm Qirfa Fatima bint Rabi'a ibn Badr was killed."
  es: "Una tribu de Ghatafan; Zayd ibn Haritha los encontró en Wadi al-Qura, algunos de sus hombres fueron atacados y él fue llevado herido, y juró no lavarse de la mayor impureza hasta que los hubiera saqueado; el Profeta lo envió de regreso y los masacró en Wadi al-Qura, donde Umm Qirfa Fatima bint Rabi'a ibn Badr fue asesinada."
  fr: "Une tribu de Ghatafan; Zayd ibn Haritha les rencontra à Wadi al-Qura, certains de ses hommes furent touchés et il fut emmené blessé, et il jura de ne pas se purifier de sa grande impureté avant de les avoir pillés; le Prophète le renvoya et il les massacra à Wadi al-Qura, où Umm Qirfa Fatima bint Rabi'a ibn Badr fut tuée."
  ur: "غطفان کا ایک قبیلہ؛ زید بن حارثہ ان سے وادی القریٰ میں ملے، ان کے کچھ آدمی مارے گئے اور وہ زخمی ہو گئے، اور انہوں نے قسم کھائی کہ جب تک وہ ان پر حملہ نہ کر لیں، بڑی نجاست سے نہ دھوئیں گے۔ رسول اللہ نے انہیں واپس بھیج دیا اور آپ نے انہیں وادی القریٰ میں ذبح کر دیا، جہاں ام قرفہ فاطمہ بنت ربیعہ بن بدر کو قتل کیا گیا تھا۔"
  tr: "Gatafan kabilesinden olan Zeyd bin Haritha, Vadi el-Kura'da onlarla karşılaştı. Bazı arkadaşları yaralandı ve Zeyd de yaralı olarak götürüldü. Onları alt edene kadar cinsel ilişkiden sonra gusül abdesti almayacağına yemin etti. Bunun üzerine Peygamber onu onlara gönderdi ve Zeyd bin Haritha onları Vadi el-Kura'da öldürdü. Aralarında Ümmü Kırfa Fatıma bint Rabi'a bin Bedir de öldürüldü."
  id: "Suatu suku dari Ghatafan; Zaid bin Haritha menemui mereka di Wadi al-Qura, dan beberapa sahabatnya terluka, dan Zaid dibawa pergi dalam keadaan terluka. Dia bersumpah untuk tidak melakukan ghusl (mandi ritual) setelah hubungan seksual sampai dia menyerang mereka. Maka Nabi mengutusnya kepada mereka, dan dia membunuh mereka di Wadi al-Qura, dan Umm Qirfa Fatima bint Rabi’a bin Badr terbunuh di antara mereka."
