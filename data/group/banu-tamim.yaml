summary:
  ar: "قبيلة عربية كبيرة من ولد تميم بن مرّ، من بطونها في الجزء الرابع دارم وبهدلة ومنقر؛ قدم وفدها بقيادة عطارد بن حاجب على النبي في سنة الوفود 9هـ ففاخروه بخطيبهم وشاعرهم ثم أسلموا، ونزل فيهم أول سورة الحجرات. وذكر ابن إسحاق أن لبشر بن الحارث السهمي أخاً من أمه منها هو سعيد بن عمرو."
  en: "A large Arab tribe descended from Tamim ibn Murr; its clans in juz' 4 include Darim, Bahdala and Minqar. Its delegation under Utarid ibn Hajib came to the Prophet in the Year of Delegations, 9 AH, challenged him with their orator and poet, then accepted Islam; the opening of sura al-Hujurat was revealed about them. Ibn Ishaq also records that Bishr ibn al-Harith al-Sahmi had a maternal half-brother in the tribe, Sa'id ibn Amr."
