label: { en: Banu Tamim, ar: "بنو تميم", es: "Banu Tamim", fr: "Banu Tamim", ur: "بنو تمیم" }
summary:
  ar: "قبيلة عربية كبيرة من ولد تميم بن مرّ، من بطونها في الجزء الرابع دارم وبهدلة ومنقر؛ قدم وفدها بقيادة عطارد بن حاجب على النبي في سنة الوفود 9هـ ففاخروه بخطيبهم وشاعرهم ثم أسلموا، ونزل فيهم أول سورة الحجرات. وذكر ابن إسحاق أن لبشر بن الحارث السهمي أخاً من أمه منها هو سعيد بن عمرو."
  en: "A large Arab tribe descended from Tamim ibn Murr; its clans in juz' 4 include Darim, Bahdala and Minqar. Its delegation under Utarid ibn Hajib came to the Prophet in the Year of Delegations, 9 AH, challenged him with their orator and poet, then accepted Islam; the opening of sura al-Hujurat was revealed about them. Ibn Ishaq also records that Bishr ibn al-Harith al-Sahmi had a maternal half-brother in the tribe, Sa'id ibn Amr."
  es: "Una gran tribu árabe descendiente de Tamim ibn Murr; sus clanes en el juz' 4 incluyen a Darim, Bahdala y Minqar. Su delegación, encabezada por Utarid ibn Hajib, se presentó ante el Profeta en el Año de las Delegaciones, 9 AH, lo desafió con su orador y poeta, y luego aceptó el Islam; el comienzo de la sura al-Hujurat fue revelado acerca de ellos. Ibn Ishaq también registra que Bishr ibn al-Harith al-Sahmi tenía un medio hermano materno en la tribu, Sa'id ibn Amr."
  fr: "Une importante tribu arabe descendait de Tamim ibn Murr; ses clans du juz' 4 comprenaient Darim, Bahdala et Minqar. Une délégation menée par Utarid ibn Hajib se présenta auprès du Prophète durant l'Année des Délégations, l'an 9 de l'Hégire, le défia par l'intermédiaire de son orateur et de son poète, puis se convertit à l'islam; le début de la sourate al-Hujurat fut révélé à leur sujet. Ibn Ishaq rapporte également que Bishr ibn al-Harith al-Sahmi avait un demi-frère maternel dans cette tribu, Sa'id ibn Amr."
  ur: "تمیم ابن مر کا ایک بڑا عرب قبیلہ۔ جوز 4 میں اس کے قبیلوں میں داریم، بہدالہ اور منقار شامل ہیں۔ عطرد بن حاجب کی قیادت میں اس کا وفد وفود کے سال، 9 ہجری میں نبی کے پاس آیا، اپنے خطیب اور شاعر کے ساتھ آپ کو چیلنج کیا، پھر اسلام قبول کیا۔ ان کے بارے میں سورۃ الحجرات کی ابتداء نازل ہوئی۔ ابن اسحاق نے یہ بھی درج کیا ہے کہ بشر بن حارث السہمی کا قبیلہ میں ایک سوتیلا بھائی سعید بن عمرو تھا۔"
