label: { ar: "بنو تميم", en: "Banu Tamim" }
summary:
  ar: "من أعظم بطون مضر: بنو تميم بن مر بن أد بن طابخة بن إلياس بن مضر بن نزار؛ يلقبون بدار الرقيب لكثرة فرسانهم وشعرائهم، ومنهم الفرزدق وجرير وأهل الردة في طائفة والأحنف بن قيس وعمرو بن الأهتم والقعقاع بن عمرو وخالد? لا — خالد مخزومي، وعيينة بن حصن الفزاري حليفهم {cite:mubarakpuri-raheeq p.16} {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir}."
  en: "One of the greatest Mudar clans — Banu Tamim ibn Murr ibn Udd ibn Tabikha ibn Ilyas ibn Mudar ibn Nizar; they were called 'the tribe of watchmen' for their riders and poets, among them al-Farazdaq and Jarir, al-Ahnaf ibn Qays, Amr ibn al-Ahtam, al-Qa'qa' ibn Amr, and their ally Uyayna ibn Hisn al-Fazari {cite:mubarakpuri-raheeq p.16} {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir}."
