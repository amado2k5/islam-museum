summary:
  ar: "فرقة قوالي باكستانية (1956–2021) قادها الأخوان غلام فريد صابري ومقبول أحمد صابري، وثيقة الصلة بالطريقة الچشتية، كانوا أول قوالين يغنّون في الغرب وأول فنانين آسيويين على مسرح كارنيغي هول (1975)، وصاحبة «تاجدارِ حرم» و«بھر دو جھولی میری»، ونالت وسام حسن الأداء في 1978."
  en: "Pakistani qawwali party (1956–2021) fronted by the brothers Ghulam Farid Sabri and Maqbool Ahmed Sabri and closely connected with the Chishti order; the first qawwals to perform in the West and the first Asian artists at Carnegie Hall (1975), known for 'Tajdar-e-Haram' and 'Bhar Do Jholi Meri', and holders of the Pride of Performance (1978)."
  ur: "پاکستانی قوال پارٹی ⁦(1956ء–2021ء)⁩، جس کی قیادت بھائیوں غلام فرید صابری اور مقبول احمد صابری نے کی اور جو چشتی سلسلے سے قریبی تعلق رکھتی تھی؛ مغرب میں قوالی گانے والے پہلے قوال اور کارنیگی ہال میں پہلے ایشیائی فنکار ⁦(1975ء)⁩، «تاجدارِ حرم» اور «بھر دو جھولی میری» کے لیے مشہور، اور تمغۂ حسنِ کارکردگی ⁦(1978ء)⁩ کے حامل۔"
  es: "Grupo qawwali pakistaní (1956-2021) liderado por los hermanos Ghulam Farid Sabri y Maqbool Ahmed Sabri y estrechamente vinculado a la orden Chishti; los primeros qawwals en actuar en Occidente y los primeros artistas asiáticos en el Carnegie Hall (1975), conocidos por 'Tajdar-e-Haram' y 'Bhar Do Jholi Meri', y ganadores del premio Pride of Performance (1978)."
  fr: "Le groupe de qawwali pakistanais (1956-2021), dirigé par les frères Ghulam Farid Sabri et Maqbool Ahmed Sabri et étroitement lié à l'ordre Chishti; les premiers qawwals à se produire en Occident et les premiers artistes asiatiques au Carnegie Hall (1975), connus pour 'Tajdar-e-Haram' et 'Bhar Do Jholi Meri', et détenteurs du Pride of Performance (1978)."
  tr: "Ghulam Farid Saberi ve Maqbool Ahmad Saberi kardeşlerin önderliğindeki ve Çişti tarikatıyla yakından ilişkili olan Pakistanlı Qawwali Topluluğu (1956–2021), Batı'da şarkı söyleyen ilk Qawwali'ler ve Carnegie Hall'da (1975) sahne alan ilk Asyalı sanatçılar oldu. \"Tajdar-e-Haram\" ve \"Bhar-e-Do Jhuli-e-Miri\" eserlerinin yaratıcıları olan topluluk, 1978'de İyi Performans Madalyası'nı aldı."
  id: "Grup Qawwali Pakistan (1956–2021), yang dipimpin oleh kakak beradik Ghulam Farid Saberi dan Maqbool Ahmad Saberi, yang terkait erat dengan tarekat Chishti, adalah grup Qawwali pertama yang bernyanyi di Barat dan penampil Asia pertama di Carnegie Hall (1975), serta pencipta \"Tajdar-e-Haram\" dan \"Bhar-e-Do Jhuli-e-Miri,\" dan menerima Medali Penampilan Baik pada tahun 1978."
