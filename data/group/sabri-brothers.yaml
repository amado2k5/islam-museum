summary:
  ar: "فرقة قوالي باكستانية (1956–2021) قادها الأخوان غلام فريد صابري ومقبول أحمد صابري، وثيقة الصلة بالطريقة الچشتية، كانوا أول قوالين يغنّون في الغرب وأول فنانين آسيويين على مسرح كارنيغي هول (1975)، وصاحبة «تاجدارِ حرم» و«بھر دو جھولی میری»، ونالت وسام حسن الأداء في 1978."
  en: "Pakistani qawwali party (1956–2021) fronted by the brothers Ghulam Farid Sabri and Maqbool Ahmed Sabri and closely connected with the Chishti order; the first qawwals to perform in the West and the first Asian artists at Carnegie Hall (1975), known for 'Tajdar-e-Haram' and 'Bhar Do Jholi Meri', and holders of the Pride of Performance (1978)."
  ur: "پاکستانی قوال پارٹی \u2066(1956ء–2021ء)\u2069، جس کی قیادت بھائیوں غلام فرید صابری اور مقبول احمد صابری نے کی اور جو چشتی سلسلے سے قریبی تعلق رکھتی تھی؛ مغرب میں قوالی گانے والے پہلے قوال اور کارنیگی ہال میں پہلے ایشیائی فنکار \u2066(1975ء)\u2069، «تاجدارِ حرم» اور «بھر دو جھولی میری» کے لیے مشہور، اور تمغۂ حسنِ کارکردگی \u2066(1978ء)\u2069 کے حامل۔"
