label: { en: "Banu Bakr ibn Abd Manat", ar: "بنو بكر بن عبد مناف" }
summary:
  en: "A tribe of Kinana that entered Quraysh's pact at Hudaybiyya; the night attack by its Banu al-Dil clan on Khuza'a at al-Watir — secretly armed by Quraysh — broke the truce and set off the conquest of Mecca."
  ar: "قبيلة من كنانة دخلت في عقد قريش وعهدها يوم صلح الحديبية؛ وكان تبييت بطن بني الديل منها خزاعةً على ماء الوتير — بإمداد قريش خفية — الخرق الذي ترتب عليه فتح مكة."
