label: { en: "Banu Bakr ibn Abd Manat", ar: "بنو بكر بن عبد مناف", es: "Banu Bakr ibn Abd Manat", fr: "Banu Bakr ibn Abd Manat", ur: "بنو بکر بن عبد منات", tr: "Banu Bakr ibn Abd Manaf", id: "Banu Bakr ibn Abd Manaf" }
summary:
  en: "A tribe of Kinana that entered Quraysh's pact at Hudaybiyya; the night attack by its Banu al-Dil clan on Khuza'a at al-Watir — secretly armed by Quraysh — broke the truce and set off the conquest of Mecca."
  ar: "قبيلة من كنانة دخلت في عقد قريش وعهدها يوم صلح الحديبية؛ وكان تبييت بطن بني الديل منها خزاعةً على ماء الوتير — بإمداد قريش خفية — الخرق الذي ترتب عليه فتح مكة."
  es: "Una tribu de Kinana que se unió al pacto de Quraysh en Hudaybiyya; el ataque nocturno de su clan Banu al-Dil contra Khuza'a en al-Watir —armados secretamente por Quraysh— rompió la tregua y desencadenó la conquista de La Meca."
  fr: "Une tribu de Kinana qui avait conclu un pacte avec les Quraysh à Hudaybiyya; l'attaque nocturne de son clan Banu al-Dil contre Khuza'a à al-Watir — secrètement armé par les Quraysh — a rompu la trêve et déclenché la conquête de La Mecque."
  ur: "کنانہ کا ایک قبیلہ جو حدیبیہ میں قریش کے معاہدے میں داخل ہوا تھا۔ اس کے بنو الدل قبیلہ کی طرف سے خزاعہ پر الطیر کے مقام پر رات کے حملے - جو خفیہ طور پر قریش کے ذریعہ مسلح تھے - نے جنگ بندی کو توڑ دیا اور مکہ کی فتح کا آغاز کیا۔"
  tr: "Kinanah'tan bir kabile, Hudeybiye Antlaşması günü Kureyş ile bir anlaşma yapmış ve bu anlaşmayı sürdürmüştür; ve Beni el-Dil kabilesinin (bunlardan Huza'ah'lı olan) Kureyş'in gizli desteğiyle Vetir sularına düzenlediği gece baskını, Mekke'nin fethine yol açan gedik olmuştur."
  id: "Suatu suku dari Kinanah membuat perjanjian dengan Quraysh dan kesepakatannya pada hari Perjanjian Hudaybiyyah; dan serangan malam hari oleh klan Banu al-Dil, di antara mereka Khuza’ah, di sungai al-Watir — dengan dukungan rahasia Quraysh — adalah pelanggaran yang mengakibatkan penaklukan Mekah."
