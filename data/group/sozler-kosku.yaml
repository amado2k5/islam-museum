summary:
  ar: "قناة سوزلر كوشكو على يوتيوب ⁦(@sozlerkosku)⁩، وهي جماعة دعوية شبابية في إسطنبول تنتج أحاديث قصيرة ومقابلات شارع ورسومًا متحركة؛ بلغ عدد مشتركيها 4,820,000 مشترك وعدد مشاهداتها 1,263,219,712 مشاهدة في 1,373 مقطعًا بحسب عدّاد vidIQ كما في 11 نوفمبر 2026. لا يسمّي أي مصدر قُرئ مشغّلًا محددًا لها، ولا يُكتب لها تاريخ تأسيس."
  en: "The Sözler Köşkü YouTube channel (@sozlerkosku), an Istanbul youth-dawah collective producing short talks, street interviews and animations; it counted 4,820,000 subscribers, 1,263,219,712 views and 1,373 videos by vidIQ's count as of 11 November 2026. No source read names a specific operator for it, and no founding date is written for it."
  ur: "سوزلر کوشکو کی یوٹیوب چینل ⁦(@sozlerkosku)⁩، استنبول کی ایک نوجوان دعوتی جماعت جو مختصر گفتگوئیں، سڑک انٹرویوز اور متحرک فلمیں بناتی ہے؛ 11 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے سبسکرائبرز 4,820,000، ویوز 1,263,219,712 اور ویڈیوز 1,373 تھیں۔ کسی پڑھے گئے ماخذ نے اس کا کوئی مخصوص منتظم نہیں بتایا، اور اس کی کوئی تاریخِ قیام نہیں لکھی جاتی۔"
  es: "El canal de YouTube Sözler Köşkü (@sozlerkosku), un colectivo juvenil de Estambul dedicado a la difusión del Islam, produce charlas cortas, entrevistas callejeras y animaciones; según datos de vidIQ al 11 de noviembre de 2026, contaba con 4.820.000 suscriptores, 1.263.219.712 visualizaciones y 1.373 vídeos. Ninguna fuente consultada menciona a un operador específico ni se indica su fecha de fundación."
  fr: "La chaîne YouTube Sözler Köşkü (@sozlerkosku), un collectif de jeunes d'Istanbul spécialisé dans la da'wa et produisant de courts entretiens, des interviews de rue et des animations, comptait 4 820 000 abonnés, 1 263 219 712 vues et 1 373 vidéos selon le décompte de vidIQ au 11 novembre 2026. Aucune source consultée ne mentionne d'opérateur spécifique ni de date de fondation."
