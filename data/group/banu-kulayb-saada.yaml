summary:
  ar: "قوم من أرمى أهل اليمن بالنبل بحسب الراوي، قاتلوا الهادي مع الأكيليين في علاف ثم استأمنوه وحلفوا على السمع والطاعة وأخرجوا الأكيليين من بلدهم."
  en: "A people described by the narrator as among the best archers of Yemen, who fought al-Hadi with the Akilis at Allaf, then sought his protection, swore hearing and obedience and drove the Akilis from their country."
  ur: "ایک قوم جسے راوی یمن کے بہترین تیر اندازوں میں بتاتا ہے، جس نے علاف میں اکیلیوں کے ساتھ ہادی سے جنگ کی، پھر امان مانگی، سمع و طاعت کا حلف دیا اور اکیلیوں کو اپنے ملک سے نکالا۔"
