summary:
  ar: "شيعة ولد العباس بن عبد المطلب من أهل خراسان وغيرهم، ذهبوا إلى أن أحق الناس بالإمامة بعد رسول الله العباس لأنه عمه ووارثه وعصبته، وأن الناس اغتصبوه حقه إلى أن رده الله إليهم، وتبرأوا من أبي بكر وعمر وأجازوا بيعة علي بإجازته لها، وصنف الجاحظ لهم كتاب إمامة ولد العباس {cite:muruj-al-dhahab p. 224}."
  en: "The Abbasids' Khurasani shi'a — al-'Abbas, the prophet's uncle, heir and 'asaba, was imam by right; they disowned Abu Bakr and 'Umar yet validated 'Ali's bay'a through his own, and al-Jahiz composed their 'Imamat wuld al-'Abbas' {cite:muruj-al-dhahab p. 224}."
