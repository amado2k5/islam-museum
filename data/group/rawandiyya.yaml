label: { ar: "الراوندية", en: "the Rawandiyya", es: "la Rawandiyya", fr: "la Rawandiyya", ur: "راوندیہ", tr: "Rawandia", id: "Rawandia" }
summary:
  ar: "شيعة ولد العباس بن عبد المطلب من أهل خراسان وغيرهم، ذهبوا إلى أن أحق الناس بالإمامة بعد رسول الله العباس لأنه عمه ووارثه وعصبته، وأن الناس اغتصبوه حقه إلى أن رده الله إليهم، وتبرأوا من أبي بكر وعمر وأجازوا بيعة علي بإجازته لها، وصنف الجاحظ لهم كتاب إمامة ولد العباس {cite:muruj-al-dhahab p. 224}."
  en: "The Abbasids' Khurasani shi'a — al-'Abbas, the prophet's uncle, heir and 'asaba, was imam by right; they disowned Abu Bakr and 'Umar yet validated 'Ali's bay'a through his own, and al-Jahiz composed their 'Imamat wuld al-'Abbas' {cite:muruj-al-dhahab p. 224}."
  es: "El chiíta Khurasani de los abasíes, al-'Abbas, el tío, heredero y 'asaba del profeta, era imán por derecho; repudiaron a Abu Bakr y 'Umar pero validaron la bay'a de 'Ali a través de la suya propia, y al-Jahiz compuso su 'Imamat wuld al-'Abbas' {cita:muruj-al-dhahab p. 224}."
  fr: "Le chiite Khurasani des Abbassides — al-'Abbas, l'oncle, héritier et 'asaba du prophète, était imam de droit; ils ont renié Abu Bakr et 'Umar mais ont validé la bay'a d'Ali à travers la sienne, et al-Jahiz a composé leur 'Imamat wuld al-'Abbas' {cite: muruj-al-dhahab p. 224}."
  ur: "عباسیوں کے خراسانی شیعہ — العباس، پیغمبر کے چچا، وارث اور 'اصابہ، صحیح طور پر امام تھے۔ انہوں نے ابوبکر اور عمر کا انکار کیا پھر بھی علی کی بیعت کو اپنے ذریعے سے درست کیا اور الجہیز نے ان کی امامت ولد العباس کی تصنیف کی۔ 224}۔"
  tr: "Horasan halkından Abbas ibn Abdülmuttalib'in soyundan gelen Şiiler, Allah'ın Resulü'nden sonra imamlığa en layık olanın Abbas olduğunu, çünkü onun amcası, varisi ve kabilesi olduğunu ve insanların onun hakkını gasp ettiğini, ta ki Allah ona geri verene kadar böyle bir iddiada bulundular. Ebu Bekir ve Ömer'i reddettiler ve Ali'ye biat etmeyi, onun da onayıyla, onayladılar. El-Cahiz onlar için \"Abbas'ın Soyundan Gelenlerin İmamet'i\" adlı kitabı yazdı (kaynak: Muruj-al-Dhahab, s. 224)."
  id: "Kaum Syiah keturunan Abbas ibn Abd al-Muttalib dari penduduk Khorasan dan lainnya bahkan sampai mengatakan bahwa orang yang paling berhak atas Imamah setelah Rasulullah adalah Abbas karena ia adalah pamannya, pewarisnya, dan dari klan yang sama, dan bahwa orang-orang telah merampas haknya sampai Allah mengembalikannya kepada mereka. Mereka mengingkari Abu Bakar dan Umar dan menyetujui baiat kepada Ali dengan persetujuannya. Al-Jahiz menulis untuk mereka buku Imamah Keturunan Abbas {kutip:muruj-al-dhahab hlm. 224}."
