label: { ar: "بنو ظفر", en: "Banu Zafar", es: "Banu Zafar", fr: "Banu Zafar", ur: "بنو ظفر", tr: "Banu Zafar", id: "Banu Zafar" }
summary:
  ar: "بطن من الأوس، بنو ظفر وهو كعب بن الخزرج الأصغر بن عمرو بن مالك بن الأوس بن حارثة؛ نزلوا دارهم شرق البقيع عند مسجدهم المعروف بمسجد البغلة بجوار بني عبد الأشهل، ووالَوا بني عبد الأشهل في حربهم مع بني حارثة {cite:samhudi-wafa-al-wafa p. 202-204}."
  en: "A clan of the Aws, Banu Zafar — Ka'b ibn al-Khazraj the Younger — who settled their quarter east of al-Baqi' by their mosque known as the Mosque of the Baghla, next to Banu Abd al-Ashhal, whom they backed in the war against Banu Haritha {cite:samhudi-wafa-al-wafa p. 202-204}."
  es: "Un clan de los Aws, Banu Zafar — Ka'b ibn al-Khazraj el Joven — que se establecieron en su barrio al este de al-Baqi' junto a su mezquita conocida como la Mezquita de Baghla, al lado de Banu Abd al-Ashhal, a quienes apoyaron en la guerra contra Banu Haritha {cite:samhudi-wafa-al-wafa p. 202-204}."
  fr: "Un clan des Aws, les Banu Zafar — Ka'b ibn al-Khazraj le Jeune — qui ont établi leur quartier à l'est d'al-Baqi' près de leur mosquée connue sous le nom de Mosquée des Baghla, à côté des Banu Abd al-Ashhal, qu'ils ont soutenus dans la guerre contre les Banu Haritha {cite:samhudi-wafa-al-wafa p. 202-204}."
  ur: "اوس کا ایک قبیلہ، بنو ظفر - کعب بن الخزرج چھوٹا - جنہوں نے البقیع کے مشرق میں اپنی مسجد کے پاس آباد کیا جو مسجد باغلہ کے نام سے مشہور ہے، بنو عبد الاشحل کے ساتھ، جس کی انہوں نے بنو حارثہ کے خلاف جنگ میں حمایت کی تھی۔ 202-204}۔"
  tr: "Aws kabilesinin bir kolu olan Banu Zafar'ın mensupları Ka'b ibn al-Khazraj al-Asghar ibn Amr ibn Malik ibn Aws ibn Haritha'dır; onlar, Banu Abd al-Ashhal'ın yanında, Katır Camii olarak bilinen camilerinin yakınındaki, al-Baqi'nin doğusundaki yurtlarına yerleşmiş ve Banu Haritha ile olan savaşlarında Banu Abd al-Ashhal ile ittifak kurmuşlardır. {kaynak:samhudi-wafa-al-wafa s. 202-204}."
  id: "Cabang dari Aws, Banu Zafar, yang merupakan Ka’b ibn al-Khazraj al-Asghar ibn Amr ibn Malik ibn Aws ibn Haritha; mereka menetap di rumah mereka di sebelah timur al-Baqi’ dekat masjid mereka yang dikenal sebagai Masjid Keledai di sebelah Banu Abd al-Ashhal, dan mereka bersekutu dengan Banu Abd al-Ashhal dalam perang mereka dengan Banu Haritha {cite:samhudi-wafa-al-wafa p. 202-204}."
