summary:
  ar: "طسم بن لاوذ بن إرم بن سام بن نوح سار بعد عملاق بن لاوذ بولده ومن تبعه فنزلوا البحرين وهو يقول أني أنا طسم وجدي سام سام بن نوح وهو الإمام، وهم من العرب العاربة البائدة {cite:muruj-al-dhahab p. 451}. وكان ممن أهلكهم الله كما أهلك جديساً، ومن أرض السماوة داسم والجولان وجازر من أرض نوى من بلاد حوران والبثنية ما بين دمشق وطبرية {cite:muruj-al-dhahab p. 456}، وعند البلاذري نزلوا بين اليمن واليمامة وكانت بينهم وبين جديس حروب أفنتهم فيها حتى ضرب المثل «يا طسم ما لاقيت من جديس» ثم انضمت بقيتهم إلى جديس فأفناهم عبد كلال بن مثوب التبع جميعاً باليمامة {cite:ansab-al-ashraf p. 8}"
  en: "Descendants of Tasm ibn Lawdh who marched after 'Amaliq and settled Bahrayn — one of the vanished Arabic mother-tribes {cite:muruj-al-dhahab p. 451}."
  es: "Descendientes de Tasm ibn Lawdh que marcharon tras 'Amaliq y se establecieron en Bahrayn, una de las tribus madre árabes desaparecidas {cite:muruj-al-dhahab p. 451}."
  fr: "Descendants de Tasm ibn Lawdh qui ont marché après 'Amaliq et se sont installés à Bahrayn — l'une des tribus mères arabes disparues {cite:muruj-al-dhahab p. 451}."
  ur: "تسم بن لاذ کی اولاد جنہوں نے عمالیق کے پیچھے چل کر بحرین کو آباد کیا - معدوم ہونے والے عربی مادری قبائل میں سے ایک 451}۔"
  tr: "Tasm ibn Lawdh ibn Iram ibn Sam ibn Noah, oğlu ve onu takip edenlerle birlikte Amalek ibn Lawdh'ın ardından yolculuk etti ve Bahreyn'e yerleştiler. \"Ben Tasm'ım, dedem ise Nuh'un oğlu Sam'dır ve o da İmam'dır\" dedi. Onlar, soyu tükenmiş asıl Araplardandı. {kaynak: Muruj-al-Dhahab s. 451}. Allah'ın, tıpkı Cedis'i yok ettiği gibi, yok ettiği kişiler arasındaydı. Semave diyarından Dasim, Golan ve Hauran diyarındaki Nevev diyarından Jazar ve Şam ile Taberiye arasında el-Bathaniyya vardı. {kaynak: Muruj-al-Dhahab s. 456}. El-Baladhuri'ye göre, Yemen ile el-Yamame arasında yerleştiler ve Cedis ile aralarında savaşlar çıktı ve bu savaşlarda yok edildiler; öyle ki \"Ey Tasm, Cedis'ten neler çektin!\" atasözü ortaya çıktı. Sonra geri kalanlar da Jadis'e katıldı ve Abd Kalal ibn Mathub al-Tubba', hepsini al-Yamamah'da yok etti. {Kaynak:ansab-al-ashraf s. 8}"
  id: "Tasm bin Lawdh bin Iram bin Sam bin Nuh mengikuti Amalek bin Lawdh bersama putranya dan orang-orang yang mengikutinya, dan mereka menetap di Bahrain. Dia berkata, “Aku adalah Tasm, dan kakekku adalah Sam, putra Nuh, dan dialah Imam.” Mereka berasal dari bangsa Arab asli yang telah punah {kutip: Muruj al-Dhahab hlm. 451}. Dia termasuk di antara orang-orang yang dihancurkan Allah, sebagaimana Dia menghancurkan Jadis. Dari tanah Samawah terdapat Dasim, Golan, dan Jazar dari tanah Nawa di tanah Hauran, dan al-Bathaniyya antara Damaskus dan Tiberias {kutip: Muruj al-Dhahab hlm. 456}. Menurut al-Baladhuri, mereka menetap di antara Yaman dan al-Yamamah, dan terjadi peperangan antara mereka dan Jadis yang mengakibatkan mereka dimusnahkan, sampai-sampai muncul pepatah “Wahai Tasm, betapa besar penderitaanmu dari Jadis!” Kemudian sisanya bergabung dengan Jadis, dan Abd Kalal ibn Mathub al-Tubba’ memusnahkan mereka semua di al-Yamamah {cite:ansab-al-ashraf p. 8}."
