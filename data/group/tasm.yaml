  ar: "طسم بن لاوذ بن إرم بن سام بن نوح سار بعد عملاق بن لاوذ بولده ومن تبعه فنزلوا البحرين وهو يقول أني أنا طسم وجدي سام سام بن نوح وهو الإمام، وهم من العرب العاربة البائدة {cite:muruj-al-dhahab p. 451}.، وكان ممن أهلكهم الله كما أهلك جديساً، ومن أرض السماوة داسم والجولان وجازر من أرض نوى من بلاد حوران والبثنية ما بين دمشق وطبرية {cite:muruj-al-dhahab p. 456}"
