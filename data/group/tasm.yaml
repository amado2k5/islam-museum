label: { ar: "طسم", en: "Tasm" }
summary:
  ar: "طسم بن لاوذ بن إرم بن سام بن نوح سار بعد عملاق بن لاوذ بولده ومن تبعه فنزلوا البحرين وهو يقول أني أنا طسم وجدي سام سام بن نوح وهو الإمام، وهم من العرب العاربة البائدة {cite:muruj-al-dhahab p. 451}.، وكان ممن أهلكهم الله كما أهلك جديساً، ومن أرض السماوة داسم والجولان وجازر من أرض نوى من بلاد حوران والبثنية ما بين دمشق وطبرية {cite:muruj-al-dhahab p. 456}، وعند البلاذري نزلوا بين اليمن واليمامة وكانت بينهم وبين جديس حروب أفنتهم فيها حتى ضرب المثل «يا طسم ما لاقيت من جديس» ثم انضمت بقيتهم إلى جديس فأفناهم عبد كلال بن مثوب التبع جميعاً باليمامة {cite:ansab-al-ashraf p. 8}"
  en: "Descendants of Tasm ibn Lawdh who marched after 'Amaliq and settled Bahrayn — one of the vanished Arabic mother-tribes {cite:muruj-al-dhahab p. 451}."
