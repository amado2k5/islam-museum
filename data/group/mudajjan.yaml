summary:
  ar: "المدجنون مسلمو الأندلس الذين بقوا تحت حكم النصارى بعد سقوط المدن؛ يذكر المقري في نفح الطيب المرتدين والمدجنين في سياقات الأندلس الأخيرة {cite:nafh-tib-maqqari}."
  en: "The Mudéjares were the Muslims of al-Andalus who remained under Christian rule after the fall of its cities; al-Maqqari's Nafh al-Tib mentions the renegades and the Mudéjares in the late-Andalus contexts {cite:nafh-tib-maqqari}."
  es: "Los mudéjares eran los musulmanes de al-Ándalus que permanecieron bajo dominio cristiano tras la caída de sus ciudades; el Nafh al-Tib de al-Maqqari menciona a los renegados y a los mudéjares en los contextos del final de la época andalusí {cite:nafh-tib-maqqari}."
  fr: "Les Mudéjars étaient les musulmans d'al-Andalus qui restèrent sous domination chrétienne après la chute de ses villes; le Nafh al-Tib d'al-Maqqari mentionne les renégats et les Mudéjars dans le contexte de la fin d'al-Andalus {cite:nafh-tib-maqqari}."
  ur: "مدجرس اندلس کے مسلمان تھے جو اس کے شہروں کے زوال کے بعد عیسائیوں کے زیر تسلط رہے۔ المقری کی نفح الطب میں اندلس کے آخر کے سیاق و سباق میں منکرین اور مدجاروں کا ذکر ہے۔"
  tr: "Mudéjar'lar, şehirlerin yıkılmasından sonra Hıristiyan egemenliği altında kalan Endülüs Müslümanlarıdır; El-Makkari, Nafh al-Tib'de daha sonraki Endülüs bağlamında mürtedlerden ve Müdecerlerden bahseder {cite:nafh-tib-maqqari}."
  id: "Kaum Mudéjar adalah kaum Muslim di Andalusia yang tetap berada di bawah kekuasaan Kristen setelah jatuhnya kota-kota; Al-Maqqari menyebutkan dalam Nafh al-Tib orang-orang murtad dan kaum Mudéjar dalam konteks Andalusia kemudian {cite:nafh-tib-maqqari}."
