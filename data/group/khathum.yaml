label: { en: Khath'am, ar: "خثعم", es: "Khath'am", fr: "Khath'am", ur: "خاتم", tr: "Khath'am", id: "Khath'am" }
summary:
  ar: "قبيلة عربية؛ نسب ابن إسحاق أسماء بنت عميس إليها «الخثعمية». وعند المسعودي أن خثعماً وبجيلة من ولد أنمار بن نزار بن معد على ما قيل وفي نسبهم تنازع بين إلحاقهم باليمن وردهم إلى أنمار {cite:muruj-al-dhahab p. 431}"
  en: An Arab tribe; Ibn Ishaq ascribes Asma bint Umays to it as 'al-Khath'amiyya'.
  es: "Una tribu árabe; Ibn Ishaq le atribuye a Asma bint Umays como 'al-Khath'amiyya'."
  fr: "Une tribu arabe; Ibn Ishaq lui attribue Asma bint Umays comme « al-Khath'amiyya »."
  ur: "ایک عرب قبیلہ؛ ابن اسحاق نے اسماء بنت عمیس کو 'الخثمیہ' کہا ہے۔"
  tr: "Bir Arap kabilesi; İbn İshak, Asma bint Umays'ı \"el-Hath'amiyye\" olarak bu kabileye atfetmiştir. El-Mas'udi, rivayetlere göre, Hatham ve Becila'nın Enmar ibn Nizar ibn Ma'ad'ın soyundan geldiğini ve soylarının Yemen'e bağlanması ile Enmar'a geri döndürülmesi arasında ihtilaf bulunduğunu söylemiştir. {kaynak: Muruj-al-dhahab s. 431}"
  id: "Sebuah suku Arab; Ibnu Ishaq mengaitkan Asma binti Umays dengan suku ini, \"al-Khath'amiyya.\" Al-Mas'udi mengatakan bahwa Khath'am dan Bajila adalah keturunan Anmar ibn Nizar ibn Ma'ad, menurut apa yang telah dikatakan, dan ada perselisihan mengenai garis keturunan mereka antara mengaitkan mereka dengan Yaman dan mengembalikan mereka ke Anmar. {kutipan:muruj-al-dhahab hlm. 431}"
