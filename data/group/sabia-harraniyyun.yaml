label: { ar: "الصابئة الحرانيون", en: "The Harranian Sabians", es: "Los sabeos de Harran", fr: "Les Sabiens de Harrania", ur: "ہررانی سبیائی", tr: "Harran'ın Sabianları", id: "Suku Sabian dari Harran" }
summary:
  ar: "عند المسعودي أن الصابئة الحرانيين عوام اليونانيين وحشوية الفلاسفة المتقدمين، رتبوا مراتب في هياكلهم من الكهنة ثم وردت النصارى فرتبت الكهنة في كهانتها على ما تقدمت فيه الصابئة، ولهم في آزر وأبيه إبراهيم كلام كثير، والذي بقي من هياكلهم سنة اثنتين وثلاثين وثلاثمائة بيت لهم بحران في باب الرقة يعرف بمغليتيا وهو هيكل آزر أبي إبراهيم عندهم تحته سراديب أربعة لأصنام على صور الأجسام السماوية يتكلم السدنة من وراء الجدر في منافيخ حتى يظهر النطق من الصور المجوفة، وذكر أبو بكر محمد بن زكريا الرازي مذاهبهم في كتاب دون من خالفهم من الصابئة وهم الكيماريون، ومنهم الفلاسفة وإنما أضافهم المسعودي إلى الفلاسفة إضافة سبب لا إضافة حكمة {cite:muruj-al-dhahab p. 543-547}. وزعم المسعودي أن بوداسف أول من أظهر مذاهب الصابئة وأنه خرج هندياً إلى السند وسجستان وكرمان وفارس في أوائل ملك طهمورث أو جم {cite:muruj-al-dhahab p. 537-538}، ووصف المسعودي سراديب هياكلهم وأصنامهم المجوفة وكيف يقف السدنة وراء الجدر فيتكلمون فتجري الأصوات في المنافيخ والمخاريق إلى الصور فيظهر منها نطق يصطادون به العقول، ويوردون أطفالهم إلى السراديب فيستحيل ما يسمعون في ألوانهم، وقال إن فلاسفتهم من حشوية الفلاسفة إنما أضفناهم إليهم إضافة سبب لأنهم يونانية وليس كل اليونانيين فلاسفة، وذكر من قرابينهم الثور الأسود يضرب وجهه بالملح إذا شدت عيناه ثم يذبح ويراعي كل عضو ما يظهر منه من الحركات والاختلاج على ما يدل من أحوال السنة {cite:muruj-al-dhahab p. 545-547}، وحكى ابن النديم بخط أحمد بن الطيب عن الكندي اجتماعهم على أن للعالم علة لم يزل واحدا لا يتكثر وأنه بعث رسلا وأن مشهوريهم وأعلامهم أوراني وأغاناديمون وهرمس وبعضهم يذكر سولون جد أفلاطون لأمه، وجعلوا قبلتهم لقطب الشمال ولزموا فضائل النفس الأربع، والمفترض عليهم ثلاث صلوات في اليوم عند أوتاد المشرق ووسط السماء والمغرب وثلاث نافلة وصوم ثلاثين يوما وتسعة وسبعة أيام عند أجتماع أذار وكانون وشباط، وقرابين يذبحونها للكواكب لا تؤكل وتحرق، وأعياد منها فطر الشهر وعيد الحيل وعيد الميلاد، ولا يختتنون ولا يجمعون بين امرأتين ولا طلاق إلا بحجة بينة عن فاحشة ظاهرة ولا يراجع المطلقة ولا يطؤون إلا لطلب الولد، وقولهم في الهيولي والصورة والسماء طبيعة خامسة والنفس جوهر دراك لا يبيد كما قال أرسطاطاليس في كتبه، وقال الكندي إنه نظر في كتاب يقر به هؤلاء القوم وهو مقالات لهرمس في التوحيد كتبها لابنه على غاية من الإتقان {cite:fihrist-ibn-al-nadim p. 442-445}"
  en: "The Harranian Sabians — 'the Greek vulgate, the padding of the ancient philosophers' in al-Mas'udi's phrase: their surviving temple in 332 was Mighlitiya at Harran, Azar's shrine with four vaults of planetary idols made to speak by hidden priests; al-Razi wrote a book on their doctrines apart from the rival Kimariyyun; the Christians patterned their priesthood on theirs {cite:muruj-al-dhahab p. 543-547}."
  es: "Los sabeos de Harran —'la vulga griega, el relleno de los filósofos antiguos' en la frase de al-Mas'udi: su templo superviviente en 332 era Mighlitiya en Harran, santuario de Azar con cuatro bóvedas de ídolos planetarios que hablaban gracias a sacerdotes ocultos; al-Razi escribió un libro sobre sus doctrinas aparte del rival Kimariyyun; los cristianos modelaron su sacerdocio a partir del de ellos {cite:muruj-al-dhahab p. 543-547}."
  fr: "Les Sabéens de Harran — « la vulgate grecque, le rembourrage des anciens philosophes » selon l'expression d'al-Mas'udi: leur temple survivant en 332 était Mighlitiya à Harran, le sanctuaire d'Azar avec quatre caveaux d'idoles planétaires faites parler par des prêtres cachés; al-Razi a écrit un livre sur leurs doctrines en dehors du rival Kimariyyun; les chrétiens ont calqué leur sacerdoce sur le leur {cite:muruj-al-dhahab p. 543-547}."
  ur: "Harranian Sabians - المسعودی کے فقرے میں 'یونانی وولگیٹ، قدیم فلسفیوں کی پیڈنگ': 332 میں ان کا زندہ بچ جانے والا مندر حران میں مغلیہ تھا، آزر کے مزار پر چھپے ہوئے پجاریوں کی طرف سے بات کرنے کے لیے سیاروں کے بتوں کے چار والٹ تھے۔ الرازی نے حریف کیماریون کے علاوہ ان کے عقائد پر ایک کتاب لکھی۔ عیسائیوں نے اپنے پروہت کا نمونہ ان کے مطابق بنایا {حوالہ: مروج الذہب ص۔ 543-547}۔"
  tr: "El-Mas'udi, Harranlı Sabiilerin, Yunanlıların sıradan halkının ve ilk filozofların harfiyen yorumcularının, tapınaklarında rahiplik rütbeleri düzenlediklerini belirtir. Daha sonra Hristiyanlar geldi ve Sabiilerin yaptığı gibi kendi rahipliklerinde rahipleri sıraladılar. Azar ve babası İbrahim hakkında çok konuşurlar. Hicri 332 yılında tapınaklarından geriye kalan, Harran'da Bab el-Rakka'da bulunan ve onlara göre İbrahim'in babası Azar'ın tapınağı olan Maglitiya adlı bir evleridir. Altında gök cisimlerinin suretlerinde dört adet put odası bulunmaktadır. Bekçiler, duvarların arkasından körüklerle konuşurlar ve oyuk heykellerden konuşmalar çıkar. Ebu Bekir Muhammed ibn Zekeriya el-Razi, Sabiilerin (Kemerialılar) ve aralarında filozofların da bulunduğu kişilerin öğretilerini bir kitapta zikretmiştir. El-Mas'udi, onları filozoflara sadece akıl eklemek amacıyla eklemiştir, bilgelik eklemek amacıyla değil. {kaynak: Muruj-al-Dhahab s. 543-547}. El-Mas'udi, Budasaf'ın Sabiilerin öğretilerini ilk açıklayan kişi olduğunu ve Tahmuras veya Cem'in hükümdarlığının başlangıcında Hindistan'dan Sind, Sistan, Kerman ve İran'a gittiğini iddia etmiştir. {kaynak: Muruj-al-Dhahab s. 537-538}. El-Mas'udi, tapınaklarının yeraltı mezarlarını ve içi boş putlarını, bekçilerin duvarların arkasında durup nasıl konuştuklarını ve seslerin körükler ve borular aracılığıyla heykellere nasıl ulaştığını, buradan da zihinleri tuzağa düşürecek konuşmaların nasıl çıktığını anlatmıştır. Çocuklarını yeraltı mezarlarına getirirlerdi ve duydukları şey onların renklerine dönüşürdü. İbn el-Nadim, Ahmed ibn el-Tayyib'in el yazısıyla, el-Kindi'den, dünyanın her zaman tek ve değişmez bir nedeni olduğuna ve elçiler gönderdiğine dair ittifaklarını aktardı. En ünlü ve önde gelen şahsiyetlerinin Oranius, Agandaimon ve Hermes olduğunu, bazılarının ise Platon'un anne tarafından dedesi Solon'dan bahsettiğini belirtti. Kıblelerini Kuzey Kutbu'na çevirmişler ve ruhun dört faziletine bağlı kalmışlardır. Doğu, göklerin ortası ve batı kutuplarında günde üç vakit namaz kılmakla yükümlüydüler; ayrıca üç de isteğe bağlı namazları vardı. Mart, Aralık ve Şubat aylarının birleştiği zamanlarda otuz gün, dokuz gün ve yedi gün oruç tutarlardı. Yıldızlara kurbanlar sunarlardı, ancak bu kurbanlar yenmez, yakılırdı. Oruç bozma, Zekâ Bayramı ve Noel gibi bayramları kutlarlardı. Sünnet olmazlardı ve aynı anda iki kadınla evlenmezlerdi. Boşanma ancak açık bir zina kanıtıyla mümkündü ve boşanmış bir kadın geri alınamazdı. Cinsel ilişkiye yalnızca üreme amacıyla girerlerdi. Madde, biçim ve gökler hakkındaki inançları, göklerin beşinci bir doğayı oluşturduğu ve ruhun, Aristoteles'in kitaplarında belirttiği gibi, yok edilemez, algılanabilir bir madde olduğu yönündeydi. El-Kindi, bu insanların onayladığı bir kitabı, yani *Maqalat* (Maddeler) adlı kitabı incelediğini söylemiştir. Hermes, tek tanrıcılık üzerine yazdığı bu eseri, oğlu için son derece titizlikle kaleme almıştır. {cite:fihrist-ibn-al-nadim s. 442-445}"
  id: "Al-Mas'udi menyatakan bahwa kaum Sabian di Harran, rakyat jelata Yunani dan kaum literalis filsuf awal, mengatur tingkatan pendeta di kuil-kuil mereka. Kemudian orang-orang Kristen datang dan mengatur pendeta dalam kependetaan mereka sesuai dengan apa yang telah dilakukan kaum Sabian. Mereka banyak berbicara tentang Azar dan ayahnya, Ibrahim. Sisa-sisa kuil mereka pada tahun 332 H adalah sebuah rumah mereka di Harran di Bab al-Raqqa yang dikenal sebagai Maglitiya, yang menurut mereka adalah kuil Azar, ayah Ibrahim. Di bawahnya terdapat empat ruangan untuk berhala-berhala yang menyerupai benda-benda langit. Para penjaga berbicara dari balik dinding melalui alat peniup udara hingga suara keluar dari patung-patung yang berongga. Abu Bakr Muhammad ibn Zakariya al-Razi menyebutkan doktrin mereka dalam sebuah buku tanpa menyebutkan doktrin kaum Sabian yang tidak setuju dengan mereka, yaitu kaum Kemarian, dan di antara mereka terdapat para filsuf. Al-Mas'udi hanya menambahkan mereka ke dalam kelompok filsuf sebagai tambahan akal, bukan sebagai tambahan kebijaksanaan. {cite:muruj-al-dhahab hlm. 543-547}. Al-Mas'udi mengklaim bahwa Budasaf adalah orang pertama yang mengungkapkan doktrin-doktrin kaum Sabian, dan bahwa ia pergi dari India ke Sindh, Sistan, Kerman, dan Persia pada awal pemerintahan Tahmuras atau Jam {cite:muruj-al-dhahab hlm. 537-538}. Al-Mas'udi menggambarkan katakomba kuil mereka dan berhala-berhala berongga mereka, dan bagaimana para penjaga akan berdiri di balik dinding dan berbicara, dan suara-suara itu akan merambat melalui alat peniup dan pipa ke patung-patung tersebut, dari mana ucapan akan muncul yang dengannya mereka akan menjerat pikiran. Mereka akan membawa anak-anak mereka ke katakomba, dan apa yang mereka dengar akan diubah menjadi warna-warna mereka. Dia mengatakan bahwa para filsuf mereka termasuk filsuf yang paling dangkal, tetapi kita hanya menambahkan mereka ke dalam kelompok itu karena mereka orang Yunani, dan tidak semua orang Yunani adalah filsuf. Ia menyebutkan di antara kurban mereka adalah banteng hitam, yang wajahnya dilempari garam ketika matanya ditutup, kemudian disembelih, dan setiap anggota tubuhnya diamati untuk melihat gerakan dan kedutan yang muncul sesuai dengan kondisi tahun tersebut {kutip:muruj-al-dhahab hlm. 545-547}. Ibn al-Nadim, dalam tulisan tangan Ahmad ibn al-Tayyib, meriwayatkan dari al-Kindi kesepakatan mereka bahwa dunia memiliki sebab yang selalu satu dan tidak berubah, dan bahwa sebab itu mengirimkan utusan. Ia menyatakan bahwa tokoh-tokoh mereka yang paling terkenal dan terkemuka adalah Oranius, Agandaimon, dan Hermes, dan beberapa menyebutkan Solon, kakek dari pihak ibu Plato. Mereka mengarahkan kiblat mereka ke Kutub Utara dan berpegang teguh pada empat kebajikan jiwa. Mereka wajib melaksanakan tiga shalat harian di kutub Timur, Tengah Langit, dan Barat, serta tiga shalat sunnah. Mereka juga berpuasa selama tiga puluh hari, sembilan hari, dan tujuh hari pada pertemuan bulan Maret, Desember, dan Februari. Mereka mempersembahkan kurban kepada bintang-bintang, yang tidak dimakan tetapi dibakar. Mereka merayakan festival, termasuk berbuka puasa, Hari Raya Kecerdasan, dan Natal. Mereka tidak melakukan sunat, dan tidak menikahi dua wanita sekaligus. Perceraian hanya diperbolehkan dengan bukti perzinahan yang jelas, dan wanita yang bercerai tidak dapat diterima kembali. Mereka hanya melakukan hubungan seksual untuk tujuan prokreasi. Keyakinan mereka tentang materi, bentuk, dan langit adalah bahwa langit merupakan kodrat kelima, dan bahwa jiwa adalah substansi yang tidak dapat dihancurkan dan dapat dirasakan, seperti yang dinyatakan Aristoteles dalam buku-bukunya. Al-Kindi mengatakan bahwa ia telah memeriksa sebuah buku yang diyakini oleh orang-orang ini, yaitu *Maqalat* (Artikel). Hermes menulisnya tentang monoteisme untuk putranya dengan ketelitian yang sangat tinggi. {cite:fihrist-ibn-al-nadim p. 442-445}"
