label: { ar: "الصابئة الحرانيون", en: "The Harranian Sabians" }
summary:
  ar: "عند المسعودي أن الصابئة الحرانيين عوام اليونانيين وحشوية الفلاسفة المتقدمين، رتبوا مراتب في هياكلهم من الكهنة ثم وردت النصارى فرتبت الكهنة في كهانتها على ما تقدمت فيه الصابئة، ولهم في آزر وأبيه إبراهيم كلام كثير، والذي بقي من هياكلهم سنة اثنتين وثلاثين وثلاثمائة بيت لهم بحران في باب الرقة يعرف بمغليتيا وهو هيكل آزر أبي إبراهيم عندهم تحته سراديب أربعة لأصنام على صور الأجسام السماوية يتكلم السدنة من وراء الجدر في منافيخ حتى يظهر النطق من الصور المجوفة، وذكر أبو بكر محمد بن زكريا الرازي مذاهبهم في كتاب دون من خالفهم من الصابئة وهم الكيماريون، ومنهم الفلاسفة وإنما أضافهم المسعودي إلى الفلاسفة إضافة سبب لا إضافة حكمة {cite:muruj-al-dhahab p. 543-547}.، وزعم المسعودي أن بوداسف أول من أظهر مذاهب الصابئة وأنه خرج هندياً إلى السند وسجستان وكرمان وفارس في أوائل ملك طهمورث أو جم {cite:muruj-al-dhahab p. 537-538}، ووصف المسعودي سراديب هياكلهم وأصنامهم المجوفة وكيف يقف السدنة وراء الجدر فيتكلمون فتجري الأصوات في المنافيخ والمخاريق إلى الصور فيظهر منها نطق يصطادون به العقول، ويوردون أطفالهم إلى السراديب فيستحيل ما يسمعون في ألوانهم، وقال إن فلاسفتهم من حشوية الفلاسفة إنما أضفناهم إليهم إضافة سبب لأنهم يونانية وليس كل اليونانيين فلاسفة، وذكر من قرابينهم الثور الأسود يضرب وجهه بالملح إذا شدت عيناه ثم يذبح ويراعي كل عضو ما يظهر منه من الحركات والاختلاج على ما يدل من أحوال السنة {cite:muruj-al-dhahab p. 545-547}، وحكى ابن النديم بخط أحمد بن الطيب عن الكندي اجتماعهم على أن للعالم علة لم يزل واحدا لا يتكثر وأنه بعث رسلا وأن مشهوريهم وأعلامهم أوراني وأغاناديمون وهرمس وبعضهم يذكر سولون جد أفلاطون لأمه، وجعلوا قبلتهم لقطب الشمال ولزموا فضائل النفس الأربع، والمفترض عليهم ثلاث صلوات في اليوم عند أوتاد المشرق ووسط السماء والمغرب وثلاث نافلة وصوم ثلاثين يوما وتسعة وسبعة أيام عند أجتماع أذار وكانون وشباط، وقرابين يذبحونها للكواكب لا تؤكل وتحرق، وأعياد منها فطر الشهر وعيد الحيل وعيد الميلاد، ولا يختتنون ولا يجمعون بين امرأتين ولا طلاق إلا بحجة بينة عن فاحشة ظاهرة ولا يراجع المطلقة ولا يطؤون إلا لطلب الولد، وقولهم في الهيولي والصورة والسماء طبيعة خامسة والنفس جوهر دراك لا يبيد كما قال أرسطاطاليس في كتبه، وقال الكندي إنه نظر في كتاب يقر به هؤلاء القوم وهو مقالات لهرمس في التوحيد كتبها لابنه على غاية من الإتقان {cite:fihrist-ibn-al-nadim p. 442-445}"
  en: "The Harranian Sabians — 'the Greek vulgate, the padding of the ancient philosophers' in al-Mas'udi's phrase: their surviving temple in 332 was Mighlitiya at Harran, Azar's shrine with four vaults of planetary idols made to speak by hidden priests; al-Razi wrote a book on their doctrines apart from the rival Kimariyyun; the Christians patterned their priesthood on theirs {cite:muruj-al-dhahab p. 543-547}."
