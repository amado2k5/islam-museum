id: group/sabia-harraniyyun
class: group
kind: sect
label: { ar: "الصابئة الحرانيون", en: "The Harranian Sabians" }
summary:
  ar: "عند المسعودي أن الصابئة الحرانيين عوام اليونانيين وحشوية الفلاسفة المتقدمين، رتبوا مراتب في هياكلهم من الكهنة ثم وردت النصارى فرتبت الكهنة في كهانتها على ما تقدمت فيه الصابئة، ولهم في آزر وأبيه إبراهيم كلام كثير، والذي بقي من هياكلهم سنة اثنتين وثلاثين وثلاثمائة بيت لهم بحران في باب الرقة يعرف بمغليتيا وهو هيكل آزر أبي إبراهيم عندهم تحته سراديب أربعة لأصنام على صور الأجسام السماوية يتكلم السدنة من وراء الجدر في منافيخ حتى يظهر النطق من الصور المجوفة، وذكر أبو بكر محمد بن زكريا الرازي مذاهبهم في كتاب دون من خالفهم من الصابئة وهم الكيماريون، ومنهم الفلاسفة وإنما أضافهم المسعودي إلى الفلاسفة إضافة سبب لا إضافة حكمة {cite:muruj-al-dhahab p. 543-547}."
  en: "The Harranian Sabians — 'the Greek vulgate, the padding of the ancient philosophers' in al-Mas'udi's phrase: their surviving temple in 332 was Mighlitiya at Harran, Azar's shrine with four vaults of planetary idols made to speak by hidden priests; al-Razi wrote a book on their doctrines apart from the rival Kimariyyun; the Christians patterned their priesthood on theirs {cite:muruj-al-dhahab p. 543-547}."
