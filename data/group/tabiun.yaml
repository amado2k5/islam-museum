    id: sunni-suhba
    standing: secondary
    stance: { ar: "التابعي من صحب صحابياً", en: "A Successor is one who accompanied a Companion" }
    summary:
      ar: "قول الخطيب البغدادي: لا يُكتفى بمجرد اللقي، بخلاف الصحابي مع النبي، لشرف منزلة النبي."
      en: "Al-Khatib al-Baghdadi: mere meeting is not enough, unlike a Companion with the Prophet, because of the Prophet's rank."
