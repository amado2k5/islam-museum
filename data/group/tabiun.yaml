    standing: secondary
    stance: { ar: "اللقاء في سن من يحفظ", en: "Meeting at an age to retain" }
    summary:
      ar: "اشترط ابن حبان أن يكون رآه في سن من يحفظ عنه، فعدّ خلف بن خليفة في أتباع التابعين وإن رأى عمرو بن حريث صغيراً، وقال العراقي: لما اختاره وجه."
      en: "Ibn Hibban required that he saw him at an age to retain what he heard, so he counted Khalaf ibn Khalifa among the Followers of the Successors although he saw Amr ibn Hurayth as a small child; al-Iraqi said his choice has a point."
