label:
  ar: "التابعون"
  en: "The Tabi'un (Successors)"
  es: "Los Tabi'un (Sucesores)"
  fr: "Les Tabi'un (Successeurs)"
  ur: "تبعون ⁦(جانشین)⁩"
summary:
  ar: "التابعون هم الجيل الذي تلا الصحابة، ومعرفتهم أصل يُعرف به المتصل من المرسل. اختلف أهل الحديث في حدّ التابعي: قال الخطيب من صحب صحابياً، وقال الحاكم من لقيه، ورجّح ابن الصلاح والنووي الثاني، واشترط ابن حبان أن يراه في سن من يحفظ عنه. وقسّمهم مسلم ثلاث طبقات، وابن سعد أربعاً، والحاكم خمس عشرة طبقة أولها من أدرك العشرة كقيس بن أبي حازم، وآخرها من لقي آخر الصحابة موتاً في الأمصار. ومنهم المخضرمون، والفقهاء السبعة بالمدينة، واختُلف في أفضلهم. وأول التابعين موتاً عند البلقيني معضد بن يزيد سنة 30هـ، وآخرهم خلف بن خليفة سنة 180هـ {cite:tadrib-rawi-awwama-v5 p. 239-265}."
  en: "The Tabi'un are the generation that followed the Companions; knowing them is one of the two bases by which a connected chain is told from a mursal one. Hadith scholars disagreed on the definition: al-Khatib required companionship with a Companion, al-Hakim only meeting one, and Ibn al-Salah and al-Nawawi preferred the latter, while Ibn Hibban required that the meeting be at an age to retain what was heard. Muslim divided them into three tiers, Ibn Sa'd into four and al-Hakim into fifteen, the first being those who met the Ten, such as Qays ibn Abi Hazim, and the last those who met the last Companion to die in each region. They include the mukhadramun and the Seven Jurists of Medina, and who was the best of them is debated. For al-Bulqini the first of them to die was Ma'did ibn Yazid in 30 AH and the last Khalaf ibn Khalifa in 180 AH."
  es: "Los Tabi'un son la generación que siguió a los Compañeros; conocerlos es una de las dos bases para distinguir una cadena continua de una mursal. Los eruditos del Hadiz discreparon sobre la definición: al-Khatib requería la compañía de un Compañero, al-Hakim solo el encuentro con uno, e Ibn al-Salah y al-Nawawi preferían este último, mientras que Ibn Hibban exigía que el encuentro tuviera lugar a una edad que permitiera retener lo escuchado. Muslim los dividió en tres niveles, Ibn Sa'd en cuatro y al-Hakim en quince, siendo el primero el de aquellos que conocieron a los Diez, como Qays ibn Abi Hazim, y el último el de aquellos que conocieron al último Compañero fallecido en cada región. Entre ellos se encuentran los mukhadramun y los Siete Juristas de Medina, y aún se debate quién fue el mejor de ellos. Para al-Bulqini, el primero de ellos en morir fue Ma'did ibn Yazid en el año 30 AH y el último Khalaf ibn Khalifa en el año 180 AH."
  fr: "Les Tabi'un sont la génération qui a suivi les Compagnons; les connaître constitue l'un des deux fondements permettant de distinguer une chaîne de transmission directe d'une chaîne mursal. Les spécialistes du hadith divergent quant à la définition: al-Khatib exigeait la fréquentation d'un Compagnon, al-Hakim la simple rencontre avec un seul, et Ibn al-Salah et al-Nawawi privilégiaient cette dernière condition. Ibn Hibban, quant à lui, exigeait que cette rencontre ait lieu à un âge permettant de retenir les enseignements. Muslim les répartit en trois catégories, Ibn Sa'd en quatre et al-Hakim en quinze. La première regroupe ceux qui ont rencontré les Dix Compagnons, tels que Qays ibn Abi Hazim, et la dernière ceux qui ont rencontré le dernier Compagnon décédé dans chaque région. Parmi eux figurent les mukhadramun et les Sept Juristes de Médine, et la question de savoir qui était le plus éminent d'entre eux fait encore débat. Pour al-Bulqini, le premier d'entre eux à mourir fut Ma'did ibn Yazid en 30 AH et le dernier Khalaf ibn Khalifa en 180 AH."
  ur: "تابعین وہ نسل ہیں جنہوں نے صحابہ کی پیروی کی۔ ان کو جاننا ان دو بنیادوں میں سے ایک ہے جن کے ذریعے مرسل سے مربوط سلسلہ بتایا جاتا ہے۔ علمائے حدیث نے اس تعریف پر اختلاف کیا ہے: الخطیب کو صحابی سے صحبت مطلوب ہے، الحاکم نے صرف ایک سے ملاقات کی، اور ابن الصلاح اور النووی نے مؤخر الذکر کو ترجیح دی، جب کہ ابن حبان کا تقاضا ہے کہ ملاقات اس عمر میں ہو جو سنی گئی بات کو برقرار رکھے۔ مسلم نے ان کو تین درجوں میں تقسیم کیا، ابن سعد نے چار اور الحاکم نے پندرہ میں، سب سے پہلے دس سے ملنے والے جیسے قیس بن ابی حازم، اور آخری وہ جو ہر علاقے میں مرنے والے آخری صحابی سے ملے۔ ان میں مخدرمون اور مدینہ کے سات فقہاء شامل ہیں اور ان میں سب سے افضل کون تھا اس پر بحث جاری ہے۔ البقینی کے نزدیک ان میں سے سب سے پہلے معید بن یزید 30 ہجری میں اور آخری خلف ابن خلیفہ 180 ہجری میں فوت ہوئے۔"
