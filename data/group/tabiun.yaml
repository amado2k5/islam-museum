label:
  ar: "التابعون"
  en: "The Tabi'un (Successors)"
summary:
  ar: "التابعون هم الجيل الذي تلا الصحابة، ومعرفتهم أصل يُعرف به المتصل من المرسل. اختلف أهل الحديث في حدّ التابعي: قال الخطيب من صحب صحابياً، وقال الحاكم من لقيه، ورجّح ابن الصلاح والنووي الثاني، واشترط ابن حبان أن يراه في سن من يحفظ عنه. وقسّمهم مسلم ثلاث طبقات، وابن سعد أربعاً، والحاكم خمس عشرة طبقة أولها من أدرك العشرة كقيس بن أبي حازم، وآخرها من لقي آخر الصحابة موتاً في الأمصار. ومنهم المخضرمون، والفقهاء السبعة بالمدينة، واختُلف في أفضلهم. وأول التابعين موتاً عند البلقيني معضد بن يزيد سنة 30هـ، وآخرهم خلف بن خليفة سنة 180هـ {cite:tadrib-rawi-awwama-v5 p. 239-265}."
  en: "The Tabi'un are the generation that followed the Companions; knowing them is one of the two bases by which a connected chain is told from a mursal one. Hadith scholars disagreed on the definition: al-Khatib required companionship with a Companion, al-Hakim only meeting one, and Ibn al-Salah and al-Nawawi preferred the latter, while Ibn Hibban required that the meeting be at an age to retain what was heard. Muslim divided them into three tiers, Ibn Sa'd into four and al-Hakim into fifteen, the first being those who met the Ten, such as Qays ibn Abi Hazim, and the last those who met the last Companion to die in each region. They include the mukhadramun and the Seven Jurists of Medina, and who was the best of them is debated. For al-Bulqini the first of them to die was Ma'did ibn Yazid in 30 AH and the last Khalaf ibn Khalifa in 180 AH."
