    stance: { ar: "التابعي من لقي صحابياً", en: "A Successor is one who met a Companion" }
    summary:
      ar: "قول الحاكم، قال ابن الصلاح: هو أقرب، وقال النووي: هو الأظهر، وقال العراقي: عليه عمل الأكثرين من أهل الحديث، فعدّ مسلم وابن حبان الأعمش في التابعين لأنه رأى أنساً."
      en: "Al-Hakim's view; Ibn al-Salah called it closer, al-Nawawi more evident, and al-Iraqi said most hadith scholars act on it, Muslim and Ibn Hibban counting al-A'mash among the Successors because he saw Anas."
