summary:
  ar: "بطاقة أولية للطريقة الخلوتية، الطريقة الصوفية المنتشرة في الأناضول والبلقان المنسوبة إلى سلسلة تنتهي بعمر الخلوتي؛ تذكرها المعاجم الإسلامية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Khalwatiyya, the Sufi order widespread in Anatolia and the Balkans tracing its chain to Umar al-Khalwati; treated in the cited encyclopedia, the page not yet checked."
  es: "Ficha de borrador para la Khalwatiyya, la orden sufí extendida en Anatolia y los Balcanes que remonta su cadena a Umar al-Khalwati; tratada en la enciclopedia citada, página aún no revisada."
  fr: "Fiche de projet pour la Khalwatiyya, l'ordre soufi répandu en Anatolie et dans les Balkans dont la chaîne remonte à Umar al-Khalwati; traitée dans l'encyclopédie citée, la page n'a pas encore été vérifiée."
  ur: "خلوطیہ کے لیے ڈرافٹ کارڈ، اناطولیہ اور بلقان میں وسیع پیمانے پر صوفی حکم جس کا سلسلہ عمر الخلواتی تک ہے؛ حوالہ شدہ انسائیکلوپیڈیا میں علاج کیا گیا ہے، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Anadolu ve Balkanlar'da yaygın olan ve Ömer el-Halvetî ile sonlanan bir soyağacına dayanan Halvetîye tarikatına ait ön bir kart; İslami sözlüklerde geçiyor ve sayfa henüz incelenmedi."
  id: "Kartu pendahuluan untuk tarekat Khalwatiyya, tarekat Sufi yang tersebar luas di Anatolia dan Balkan dan dikaitkan dengan silsilah yang berakhir pada Umar al-Khalwati; tarekat ini disebutkan dalam kamus-kamus Islam dan halaman ini belum ditinjau."
