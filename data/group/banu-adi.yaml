  ar: "من بطون قريش؛ يقدّمه ابن إسحاق في قوائم مهاجرة الحبشة بنسبه «عدي بن كعب بن لؤي»، ويعدّ منه مهاجرين ونساءً وأبناءً ولدوا هناك."
  en: A clan of Quraysh; Ibn Ishaq lists it in the Abyssinia rolls as 'Adi ibn Ka'b ibn Lu'ayy', counting emigrants, women and children born there.
  es: "Un clan de los Quraysh; Ibn Ishaq lo menciona en los registros de Abisinia como 'Adi ibn Ka'b ibn Lu'ayy', donde se contabilizan los emigrantes, las mujeres y los niños nacidos allí."
  fr: "Un clan de Quraysh; Ibn Ishaq le mentionne dans les registres d'Abyssinie sous le nom d'« Adi ibn Ka'b ibn Lu'ayy », comptant les émigrants, les femmes et les enfants qui y sont nés."
  ur: "قریش کا ایک قبیلہ؛ ابن اسحاق نے اسے حبشہ کی فہرست میں 'عدی بن کعب ابن لوئی' کے نام سے درج کیا ہے، جس میں وہاں پیدا ہونے والے مہاجرین، عورتوں اور بچوں کو شمار کیا گیا ہے۔"
