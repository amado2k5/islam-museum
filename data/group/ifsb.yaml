label:
  ar: مجلس الخدمات المالية الإسلامية
  en: Islamic Financial Services Board (IFSB)
  ur: اسلامی مالیاتی خدمات بورڈ
  es: "Consejo de Servicios Financieros Islámicos (IFSB)"
  fr: "Conseil des services financiers islamiques (IFSB)"
  tr: "İslami Finansal Hizmetler Kurulu"
  id: "Dewan Jasa Keuangan Islam"
summary:
  ar: هيئة دولية لوضع المعايير مقرها كوالالمبور، أسستها سنة 2002 مجموعة من البنوك المركزية والبنك الإسلامي للتنمية، وبدأت
    العمل في 10 مارس 2003؛ تصدر معايير رقابية وإشرافية متسقة مع مبادئ الشريعة للمصارف وأسواق المال والتأمين التكافلي.
  en: An international standard-setting body based in Kuala Lumpur, founded in 2002 by a group of central banks and the Islamic
    Development Bank, operating from 10 March 2003; it issues prudential and supervisory standards consistent with Shari'ah
    principles for banking, capital markets and insurance.
  ur: کوالالمپور میں قائم بین الاقوامی معیار ساز ادارہ، جسے 2002 میں مرکزی بینکوں کے ایک گروہ اور اسلامی ترقیاتی بینک نے قائم
    کیا اور جو 10 مارچ 2003 سے کام کر رہا ہے؛ بینکاری، سرمایہ بازار اور بیمہ کے لیے شریعت کے اصولوں سے ہم آہنگ نگرانی کے معیار
    جاری کرتا ہے۔
  es: "Organismo internacional de normalización con sede en Kuala Lumpur, fundado en 2002 por un grupo de bancos centrales y el Banco Islámico de Desarrollo, y en funcionamiento desde el 10 de marzo de 2003; emite normas prudenciales y de supervisión coherentes con los principios de la Sharia para la banca, los mercados de capitales y los seguros."
  fr: "Organisme international de normalisation basé à Kuala Lumpur, fondé en 2002 par un groupe de banques centrales et la Banque islamique de développement, opérationnel depuis le 10 mars 2003; il publie des normes prudentielles et de supervision conformes aux principes de la charia pour les secteurs bancaire, des marchés de capitaux et de l'assurance."
  tr: "Kuala Lumpur merkezli, 2002 yılında bir grup merkez bankası ve İslam Kalkınma Bankası tarafından kurulan ve 10 Mart 2003'te faaliyete başlayan uluslararası bir standart belirleme kuruluşu; bankalar, sermaye piyasaları ve Takaful sigortası için Şeriat ilkelerine uygun düzenleyici ve denetleyici standartlar yayınlamaktadır."
  id: "Sebuah badan penetapan standar internasional yang berbasis di Kuala Lumpur, didirikan pada tahun 2002 oleh sekelompok bank sentral dan Bank Pembangunan Islam, dan mulai beroperasi pada tanggal 10 Maret 2003; badan ini mengeluarkan standar regulasi dan pengawasan yang konsisten dengan prinsip-prinsip Syariah untuk bank, pasar modal, dan asuransi Takaful."
