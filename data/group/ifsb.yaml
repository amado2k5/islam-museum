label:
  ar: مجلس الخدمات المالية الإسلامية
  en: Islamic Financial Services Board (IFSB)
  ur: اسلامی مالیاتی خدمات بورڈ
summary:
  ar: هيئة دولية لوضع المعايير مقرها كوالالمبور، أسستها سنة 2002 مجموعة من البنوك المركزية والبنك الإسلامي للتنمية، وبدأت
    العمل في 10 مارس 2003؛ تصدر معايير رقابية وإشرافية متسقة مع مبادئ الشريعة للمصارف وأسواق المال والتأمين التكافلي.
  en: An international standard-setting body based in Kuala Lumpur, founded in 2002 by a group of central banks and the Islamic
    Development Bank, operating from 10 March 2003; it issues prudential and supervisory standards consistent with Shari'ah
    principles for banking, capital markets and insurance.
  ur: کوالالمپور میں قائم بین الاقوامی معیار ساز ادارہ، جسے 2002 میں مرکزی بینکوں کے ایک گروہ اور اسلامی ترقیاتی بینک نے قائم
    کیا اور جو 10 مارچ 2003 سے کام کر رہا ہے؛ بینکاری، سرمایہ بازار اور بیمہ کے لیے شریعت کے اصولوں سے ہم آہنگ نگرانی کے معیار
    جاری کرتا ہے۔
