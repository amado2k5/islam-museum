summary:
  ar: "لقب قرآني لأزواج النبي من قوله تعالى: وأزواجه أمهاتهم؛ عقد النبي على ثلاث عشرة امرأة، بنى بإحدى عشرة منهن وتوفي عن تسع، وكان لهن فضل كبير في نقل أحواله المنزلية وأحكام الشريعة إلى نساء الأمة."
  en: "The Qur'anic title of the Prophet's wives ('his wives are their mothers', al-Ahzab 6): he contracted thirteen women, consummated marriage with eleven and died leaving nine; they played a great role in transmitting his domestic life and the rulings of the sharia to the women of the umma."
