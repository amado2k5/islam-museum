id: group/mothers-of-the-believers
class: group
kind: family
label: { en: "Mothers of the Believers", ar: "أمهات المؤمنين", es: "Madres de los creyentes", fr: "Mères des croyants", ur: "مومنوں کی مائیں" }
summary:
  ar: "لقب قرآني لأزواج النبي من قوله تعالى: وأزواجه أمهاتهم؛ عقد النبي على ثلاث عشرة امرأة، بنى بإحدى عشرة منهن وتوفي عن تسع، وكان لهن فضل كبير في نقل أحواله المنزلية وأحكام الشريعة إلى نساء الأمة."
  en: "The Qur'anic title of the Prophet's wives ('his wives are their mothers', al-Ahzab 6): he contracted thirteen women, consummated marriage with eleven and died leaving nine; they played a great role in transmitting his domestic life and the rulings of the sharia to the women of the umma."
  es: "El título coránico de las esposas del Profeta ('sus esposas son sus madres', al-Ahzab 6): contrajo matrimonio con trece mujeres, consumó el matrimonio con once y murió dejando nueve; ellas desempeñaron un papel importante en la transmisión de su vida doméstica y las normas de la sharia a las mujeres de la umma."
  fr: "Le titre coranique des épouses du Prophète (« ses épouses sont leurs mères », al-Ahzab 6): il a épousé treize femmes, consommé le mariage avec onze d'entre elles et est mort en en laissant neuf; elles ont joué un rôle important dans la transmission de sa vie domestique et des règles de la charia aux femmes de la umma."
  ur: "نبی کی ازواج کا قرآنی لقب ⁦('ان کی بیویاں ان کی مائیں ہیں'، الاحزاب 6)⁩: اس نے تیرہ عورتوں سے معاہدہ کیا، گیارہ سے شادی کی اور نو چھوڑ کر فوت ہو گئے۔ انہوں نے ان کی گھریلو زندگی اور شریعت کے احکام کو امت کی خواتین تک پہنچانے میں بڑا کردار ادا کیا۔"
