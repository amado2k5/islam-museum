summary:
  ar: "العلوية تيار ديني وثقافي أناضولي يتمحور حول التولي لعلي وأهل البيت؛ يميز الدارسون بين تشكلها الحديث كفئة وبين جذورها في الحركات الغلاة والنصيرية التي تعالجها كتب الملل القديمة {cite:dressler-writing-religion-2013} {cite:milal-nihal-shahrastani}."
