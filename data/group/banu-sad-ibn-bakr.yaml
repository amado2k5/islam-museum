label: { ar: "بنو سعد بن بكر", en: "Banu Sa'd ibn Bakr", es: "Banu Sa'd ibn Bakr", fr: "Banu Sa'd ibn Bakr", ur: "بنو سعد بن بکر", tr: "Banu Sa'd ibn Bakr", id: "Banu Sa'd ibn Bakr" }
summary:
  ar: "بطن من هوازن استُرضع فيهم النبي عند حليمة السعدية؛ بعثوا سنة الوفود وافدهم ضمام بن ثعلبة فسأل النبي عن الفرائض فريضة فريضة ثم أسلم ورجع فأسلم قومه في يوم واحد كما يروي ابن عباس."
  en: "A clan of Hawazin among whom the Prophet was nursed by Halima al-Sa'diyya; in the Year of Delegations they sent Dimam ibn Tha'laba, who questioned the Prophet on each duty of Islam, embraced it, and returned to convert his whole settlement in a day, as Ibn Abbas relates."
  es: "Un clan de Hawazin entre quienes el Profeta fue amamantado por Halima al-Sa'diyya; en el Año de las Delegaciones enviaron a Dimam ibn Tha'laba, quien interrogó al Profeta sobre cada deber del Islam, lo abrazó y regresó para convertir a todo su asentamiento en un día, como relata Ibn Abbas."
  fr: "Un clan de Hawazin parmi lesquels le Prophète fut élevé par Halima al-Sa'diyya; durant l'Année des Délégations, ils envoyèrent Dimam ibn Tha'laba, qui interrogea le Prophète sur chaque devoir de l'Islam, l'embrassa et revint convertir tout son village en une journée, comme le rapporte Ibn Abbas."
  ur: "ہوازن کا ایک قبیلہ جس میں نبی کو حلیمہ السعدیہ نے پالا تھا۔ وفود کے سال میں انہوں نے دیمام بن ثعلبہ کو بھیجا، جس نے اسلام کے ہر فرض کے بارے میں نبی سے سوال کیا، اسے قبول کیا، اور ابن عباس کا بیان ہے کہ ایک دن میں اپنی پوری بستی کو تبدیل کرنے کے لیے واپس آ گیا۔"
  tr: "İbn Abbas'ın rivayetine göre, Peygamberimiz Halime el-Sa'diyye tarafından büyütüldüğü Hawazin kabilesinden bir grup, heyetlerin gönderildiği yılda Damam bin Tha'laba adında bir elçi gönderdi. Damam bin Tha'laba, Peygamberimize tek tek farzları sordu, ardından İslam'ı kabul edip geri döndü ve halkı da bir günde İslam'ı kabul etti."
  id: "Suatu klan Hawazin tempat Nabi diasuh oleh Halima al-Sa’diyya; mereka mengutus utusan mereka pada tahun delegasi, Damam bin Tha’laba, yang menanyakan kepada Nabi tentang kewajiban satu per satu, kemudian beliau masuk Islam dan kembali, dan kaumnya masuk Islam dalam satu hari, sebagaimana diriwayatkan oleh Ibnu Abbas."
