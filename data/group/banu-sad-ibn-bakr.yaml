  en: "A clan of Hawazin among whom the Prophet was nursed by Halima al-Sa'diyya; in the Year of Delegations they sent Dimam ibn Tha'laba, who questioned the Prophet on each duty of Islam, embraced it, and returned to convert his whole settlement in a day, as Ibn Abbas relates."
