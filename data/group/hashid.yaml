label: { ar: "هاشد", en: "Hashid", es: "Hashid", fr: "Hashid" }
summary:
  ar: "أحد ساقي همدان الكبرى وشقيق بكيل، رحم الله أبا حكم حاشد بن جشم بن هبران بن نوف بن همدان؛ ديارها — كما يصفها ابنُها الهمداني — من أول بلادها لاعة جنوبي صنعاء إلى خيوان وحدود صعدة، وهي «أمنع ديار اليمن وأعزها» تُقطع في ستة أيام في ستة، ولها أسواق قديمة من الجاهلية أولها سوق قِبل وقُمّل وسوق صافر وسوق قُطابة {cite:sifat-jazirat-al-arab pp. 93-96}."
  en: "One of the two great shafts of Hamdan, brother of Bakil — Hashid ibn Jusham of the Hamdan line. Its homelands, mapped by its own son al-Hamdani, run from La'a south of Sana'a to Khaywan and the borders of Sa'da — 'the strongest and proudest country of Yemen', a six-days' march — with Jahiliyya markets headed by Qibil-Qummal, Safir and Qutaba {cite:sifat-jazirat-al-arab pp. 93-96}."
  es: "Uno de los dos grandes ejes de Hamdan, hermano de Bakil: Hashid ibn Jusham del linaje Hamdan. Sus tierras natales, cartografiadas por su propio hijo al-Hamdani, se extienden desde La'a al sur de Sana'a hasta Khaywan y las fronteras de Sa'da -'el país más fuerte y orgulloso de Yemen', una marcha de seis días- con mercados Jahiliyya encabezados por Qibil-Qummal, Safir y Qutaba {citar:sifat-jazirat-al-arab págs. 93-96}."
  fr: "L'un des deux grands puits de Hamdan, frère de Bakil — Hashid ibn Jusham de la lignée Hamdan. Ses terres natales, cartographiées par son propre fils al-Hamdani, s'étendent de La'a au sud de Sanaa jusqu'à Khaywan et les frontières de Sa'da — « le pays le plus fort et le plus fier du Yémen », une marche de six jours — avec les marchés de Jahiliyya dirigés par Qibil-Qummal, Safir et Qutaba {cite: sifat-jazirat-al-arab pp. 93-96}."
