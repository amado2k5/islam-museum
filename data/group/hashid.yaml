summary:
  ar: "أحد ساقي همدان الكبرى وشقيق بكيل، رحم الله أبا حكم حاشد بن جشم بن هبران بن نوف بن همدان؛ ديارها — كما يصفها ابنُها الهمداني — من أول بلادها لاعة جنوبي صنعاء إلى خيوان وحدود صعدة، وهي «أمنع ديار اليمن وأعزها» تُقطع في ستة أيام في ستة، ولها أسواق قديمة من الجاهلية أولها سوق قِبل وقُمّل وسوق صافر وسوق قُطابة {cite:sifat-jazirat-al-arab pp. 93-96}."
  en: "One of the two great shafts of Hamdan, brother of Bakil — Hashid ibn Jusham of the Hamdan line. Its homelands, mapped by its own son al-Hamdani, run from La'a south of Sana'a to Khaywan and the borders of Sa'da — 'the strongest and proudest country of Yemen', a six-days' march — with Jahiliyya markets headed by Qibil-Qummal, Safir and Qutaba {cite:sifat-jazirat-al-arab pp. 93-96}."
