label: { ar: "عدوان", en: "Adwan", es: "Adwan", fr: "Adwan", ur: "عدوان", tr: "saldırganlık", id: "agresi" }
summary:
  ar: "قبيلة كانت إليها الإفاضة من جُمَع ⁦(المزدلفة)⁩ غداة النحر إلى منى في ولاية خزاعة على مكة، إحدى الخلال الثلاث التي بقيت لقبائل مضر؛ وأقرّها قصي على ما كانت عليه من المناصب لأنه كان يراه ديناً لا ينبغي تغييره."
  en: "The tribe that held the right to lead the pilgrims from Jam' (Muzdalifa) to Mina on the morning of the sacrifice under Khuza'a's rule, one of the three prerogatives kept by Mudar; Qusayy confirmed it in its office, regarding it as religion not to be changed."
  es: "La tribu que tenía el derecho de guiar a los peregrinos desde Jam' (Muzdalifa) hasta Mina en la mañana del sacrificio bajo el gobierno de Khuza'a, una de las tres prerrogativas que conservaba Mudar; Qusayy lo confirmó en su cargo, considerándolo una religión que no debía cambiarse."
  fr: "La tribu qui détenait le droit de conduire les pèlerins de Jam' (Muzdalifa) à Mina le matin du sacrifice sous le règne de Khuza'a, l'une des trois prérogatives conservées par Mudar; Qusayy l'a confirmé dans son bureau, le considérant comme une religion à ne pas changer."
  ur: "وہ قبیلہ جو خزاعہ کے دور حکومت میں قربانی کی صبح کو جام ⁦(مزدلفہ)⁩ سے منیٰ تک حاجیوں کی رہنمائی کا حق رکھتا تھا، مدر کے پاس رکھے گئے تین استحقاق میں سے ایک؛ قصی نے اپنے دفتر میں اس کی تصدیق کی، اسے مذہب کے طور پر تبدیل نہیں کیا جانا ہے۔"
  tr: "Kurban günü hacıların Mekke'nin üzerindeki Huza'a vilayetinde bulunan Mina'ya gitmek üzere Muzdalifa'dan yola çıktığı kabile, Mudar kabileleri için kalan üç ayrıcalıktan biriydi; ve Kusai, bunun değiştirilmemesi gereken bir din olduğunu gördüğü için onların konumlarını onayladı."
  id: "Suku yang akan dikunjungi para peziarah dari Muzdalifah pada hari kurban menuju Mina, di provinsi Khuza’ah di atas Mekah, salah satu dari tiga hak istimewa yang tersisa bagi suku Mudar; dan Qusai mengukuhkan posisi mereka karena ia melihatnya sebagai agama yang tidak boleh diubah."
