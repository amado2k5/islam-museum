label:
  ar: المذهب الشافعي
  en: "The Shafi'i school (madhhab)"
summary:
  ar: "المذهب الشافعي مدرسة فقهية سنية ينتسب أتباعها إلى الإمام الشافعي المتوفى سنة 204هـ/820م. تذكر دائرة المعارف الإسلامية أن مذهباً شخصياً بهذا المعنى تكوّن في النصف الأول من القرن الثالث الهجري على يد تلاميذ مصريين مثل المزني والبويطي والربيع المرادي، وأن القول الجديد وحده بقي في المذهب. وانتشر في مصر والشام والحجاز وفي العراق وخراسان، وتميز بتيارين في أصول الفقه، فقهي ثم كلامي أشعري في الغالب. وتشير إلى أن علاقته بالأشعرية والتصوف قديمة لكنها ليست حصرية."
  en: "The Shafi'i school is a Sunni legal school whose members claim to follow al-Shafi'i, who died in 204/820. The Encyclopaedia of Islam reports that a school in the personal sense formed in the first half of the third Islamic century through Egyptian pupils such as al-Muzani, al-Buwayti and al-Rabi' al-Muradi, and that only the new doctrine remained in it. It spread across Egypt, Syria, the Hijaz, Iraq and Khurasan, with two currents in legal theory, one strictly juristic and one largely Ash'ari-theological. Its ties to Ash'arism and Sufism were close but not exclusive."
  ur: "شافعی مذہب سنی فقہی مکتب ہے جس کے پیروکار شافعی کی پیروی کا دعویٰ کرتے ہیں، جن کی وفات 204ھ/820ء میں ہوئی۔ دائرۃ المعارفِ اسلامیہ کے مطابق شخصی معنی میں یہ مذہب تیسری صدی ہجری کے پہلے نصف میں مزنی، بویطی اور ربیع مرادی جیسے مصری شاگردوں کے ذریعے بنا، اور اس میں صرف جدید قول باقی رہا۔ یہ مصر، شام، حجاز، عراق اور خراسان میں پھیلا، اور اصولِ فقہ میں دو دھارے رکھتا تھا، ایک خالص فقہی اور دوسرا زیادہ تر اشعری کلامی۔ اشعریت اور تصوف سے اس کے تعلقات قریبی تھے مگر خصوصی نہیں۔"
