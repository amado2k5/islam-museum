label: { ar: "النوكبرد", en: "The Nukaburd", es: "El Nukaburd", fr: "Le Nukaburd", ur: "نوکابرڈ", tr: "Nookbird", id: "Nookbird" }
summary:
  ar: "أمة عند المسعودي من ولد يافث، بلادهم متصلة بالمغرب ومحلهم بالجدي ولهم جزائر فيها أمم، ذوو بأس شديد يجمعهم ملك واحد وأسماء ملوكهم في سائر الأعصار أدنكبس، ودار مملكتهم مدينة يست يخترقها نهر عظيم يقال له سايبط وهي جانبان، وقد غلب المسلمون المجاورون لهم من بلاد الأندلس والمغرب على مدن منها باري وطارنيو وشبرامة ثم أنابوا فأخرجوهم منها بعد حرب طويل، وهي في أيديهم سنة اثنتين وثلاثين وثلاثمائة {cite:muruj-al-dhahab p. 361}."
  en: "al-Mas'udi's Nukaburd — a Japhetic nation adjoining the Maghrib with island lands, one king named Adnaks in every age, their capital Yast divided by the great river Saybat; Muslims of al-Andalus and the Maghrib once held their cities Bari, Taranto and Shubrama before the Nukaburd retook them after long war {cite:muruj-al-dhahab p. 361}."
  es: "Nukaburd de al-Mas'udi — una nación jafética colindante con el Magreb con tierras insulares, un rey llamado Adnaks en cada época, su capital Yast dividida por el gran río Saybat; los musulmanes de al-Ándalus y el Magreb alguna vez poseyeron sus ciudades Bari, Taranto y Shubrama antes de que Nukaburd las reconquistara después de una larga guerra {cite:muruj-al-dhahab p. 361}."
  fr: "Le Nukaburd d'al-Mas'udi — une nation japhétique voisine du Maghreb avec des terres insulaires, un roi nommé Adnaks à chaque époque, leur capitale Yast divisée par le grand fleuve Saybat; les musulmans d'al-Andalus et du Maghreb détenaient autrefois leurs villes Bari, Tarente et Shubrama avant que le Nukaburd ne les reprenne après une longue guerre {cite:muruj-al-dhahab p. 361}."
  ur: "المسعودی کا نوکبرد — مغرب سے متصل ایک جافی قوم جو جزیرے کی زمینوں سے متصل ہے، ہر دور میں ایک بادشاہ جس کا نام ادنکس ہے، ان کا دارالحکومت یاست عظیم دریا سیبت سے منقسم ہے۔ اندلس اور مغرب کے مسلمانوں نے ایک بار اپنے شہروں باری، ترانتو اور شبرامہ پر قبضہ کیا تھا اس سے پہلے کہ نوکبرد نے طویل جنگ کے بعد ان پر دوبارہ قبضہ کر لیا تھا۔ 361}۔"
  tr: "El-Mas'udi'ye göre, Yafet'in soyundan gelen bir millet, toprakları Mağrip ile bağlantılıdır ve yerleri Oğlak burcundadır; adalarında büyük güçlere sahip milletler bulunur, tek bir kral tarafından birleşmişlerdir ve krallarının isimleri her çağda Adanakab'dır; krallıklarının başkenti Yast şehridir; bu şehirden Saybat adında büyük bir nehir akar ve iki yakası vardır. Endülüs ve Mağrip topraklarından gelen komşu Müslümanlar, Bari, Taranio ve Şabrama gibi şehirleri fethetmiş, sonra tövbe edip uzun bir savaşın ardından onları kovmuş ve 332 yılında bu şehirler onların eline geçmiştir. {Kaynak: Muruj-al-Dhahab s. 361}"
  id: "Suatu bangsa menurut Al-Mas’udi, dari keturunan Yafet, tanah mereka terhubung dengan Maghreb dan tempat mereka berada di Capricornus dan mereka memiliki pulau-pulau di mana terdapat bangsa-bangsa yang sangat kuat, dipersatukan oleh satu raja, dan nama-nama raja mereka sepanjang zaman adalah Adanakab, dan ibu kota kerajaan mereka adalah kota Yast, yang dilalui oleh sungai besar bernama Saybat, dan memiliki dua sisi, dan kaum Muslim yang bertetangga dengan mereka dari tanah Andalusia dan Maghreb menaklukkan kota-kota termasuk Bari, Taranio dan Shabrama, kemudian mereka bertobat dan mengusir mereka dari sana setelah perang yang panjang, dan berada di tangan mereka pada tahun 332 {kutip:muruj-al-dhahab hlm. 361}."
