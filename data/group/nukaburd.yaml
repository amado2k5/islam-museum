label: { ar: "النوكبرد", en: "The Nukaburd" }
summary:
  ar: "أمة عند المسعودي من ولد يافث، بلادهم متصلة بالمغرب ومحلهم بالجدي ولهم جزائر فيها أمم، ذوو بأس شديد يجمعهم ملك واحد وأسماء ملوكهم في سائر الأعصار أدنكبس، ودار مملكتهم مدينة يست يخترقها نهر عظيم يقال له سايبط وهي جانبان، وقد غلب المسلمون المجاورون لهم من بلاد الأندلس والمغرب على مدن منها باري وطارنيو وشبرامة ثم أنابوا فأخرجوهم منها بعد حرب طويل، وهي في أيديهم سنة اثنتين وثلاثين وثلاثمائة {cite:muruj-al-dhahab p. 361}."
  en: "al-Mas'udi's Nukaburd — a Japhetic nation adjoining the Maghrib with island lands, one king named Adnaks in every age, their capital Yast divided by the great river Saybat; Muslims of al-Andalus and the Maghrib once held their cities Bari, Taranto and Shubrama before the Nukaburd retook them after long war {cite:muruj-al-dhahab p. 361}."
