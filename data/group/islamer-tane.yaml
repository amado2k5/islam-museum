summary:
  ar: "قناة يوتيوب بنغلاديشية تجمع محاضرات الوعظ البنغالية لعدد من الدعاة؛ بلغ عدد مشتركي قناتها على يوتيوب نحو 689 ألفًا بحسب عدّاد vidIQ المقروء في 6 نوفمبر 2026. وهي قناة مستقلة تمامًا عن قناة «طه تي في» الخاصة بمحاضرات أبي طه محمد عدنان، فتشابه البادئة «إسلامر» مجرد مصادفة في التسمية التجارية."
  en: "A Bangladeshi YouTube channel (@islamertane) aggregating Bengali waz lectures by many preachers; it counted about 689 thousand subscribers by vidIQ's count read on 6 November 2026. It is a distinct operation from Taw Haa Tv (@TawHaaTv), the lecture channel of Abu Taw Haa Muhammad Adnan: the shared 'Islamer' prefix is a branding coincidence, and the two channels differ in handle, size and start date."
  ur: "بنگلہ دیشی یوٹیوب چینل جو کئی واعظین کے بنگالی واز لیکچرز جمع کرتا ہے؛ 6 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق اس کے سبسکرائبرز تقریباً 689 ہزار تھے۔ یہ ابو طٰہٰ محمد عدنان کے لیکچر چینل «طٰہٰ ٹی وی» سے الگ عمل ہے؛ «اسلامر» سابقے کی مشابہت محض نام رکھنے کا اتفاق ہے۔"
  es: "Un canal de YouTube de Bangladesh (@islamertane) que recopila conferencias de waz en bengalí de muchos predicadores, contaba con unos 689 mil suscriptores según el recuento de vidIQ realizado el 6 de noviembre de 2026. Es una operación distinta de Taw Haa Tv (@TawHaaTv), el canal de conferencias de Abu Taw Haa Muhammad Adnan: el prefijo compartido \"Islamer\" es una coincidencia de marca, y los dos canales difieren en nombre de usuario, tamaño y fecha de inicio."
  fr: "Une chaîne YouTube bangladaise (@islamertane) regroupant des conférences waz en bengali de nombreux prédicateurs; elle comptait environ 689 000 abonnés selon le décompte de vidIQ relevé le 6 novembre 2026. Il s'agit d'une opération distincte de Taw Haa Tv (@TawHaaTv), la chaîne de conférences d'Abu Taw Haa Muhammad Adnan: le préfixe « Islamer » commun est une coïncidence de marque, et les deux chaînes diffèrent par leur nom d'utilisateur, leur taille et leur date de lancement."
  tr: "Bangladeş merkezli bir YouTube kanalı, çeşitli vaizlerin Bengalce vaazlarını derliyor; 6 Kasım 2026'da vidIQ sayacına göre YouTube kanalının yaklaşık 689.000 abonesi bulunuyor. Bu kanal, Abu Taha Muhammad Adnan'ın vaazlarına adanmış \"Taha TV\" kanalından tamamen bağımsızdır, bu nedenle \"İslamcı\" ön ekinin ticari isimdeki benzerliği sadece bir tesadüftür."
  id: "Sebuah saluran YouTube Bangladesh yang mengumpulkan ceramah-ceramah berbahasa Bengali oleh sejumlah penceramah; saluran YouTube-nya memiliki sekitar 689.000 pelanggan menurut penghitung vidIQ pada 6 November 2026. Saluran ini sepenuhnya independen dari saluran “Taha TV”, yang dikhususkan untuk ceramah-ceramah Abu Taha Muhammad Adnan, sehingga kemiripan awalan “Islamer” hanyalah kebetulan dalam nama komersial."
