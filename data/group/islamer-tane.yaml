summary:
  ar: "قناة يوتيوب بنغلاديشية تجمع محاضرات الوعظ البنغالية لعدد من الدعاة؛ بلغ عدد مشتركي قناتها على يوتيوب نحو 689 ألفًا بحسب عدّاد vidIQ المقروء في 6 نوفمبر 2026. وهي قناة مستقلة تمامًا عن قناة «طه تي في» الخاصة بمحاضرات أبي طه محمد عدنان، فتشابه البادئة «إسلامر» مجرد مصادفة في التسمية التجارية."
  en: "A Bangladeshi YouTube channel (@islamertane) aggregating Bengali waz lectures by many preachers; it counted about 689 thousand subscribers by vidIQ's count read on 6 November 2026. It is a distinct operation from Taw Haa Tv (@TawHaaTv), the lecture channel of Abu Taw Haa Muhammad Adnan: the shared 'Islamer' prefix is a branding coincidence, and the two channels differ in handle, size and start date."
  ur: "بنگلہ دیشی یوٹیوب چینل جو کئی واعظین کے بنگالی واز لیکچرز جمع کرتا ہے؛ 6 نومبر 2026 کو پڑھے گئے vidIQ کے شمار کے مطابق اس کے سبسکرائبرز تقریباً 689 ہزار تھے۔ یہ ابو طٰہٰ محمد عدنان کے لیکچر چینل «طٰہٰ ٹی وی» سے الگ عمل ہے؛ «اسلامر» سابقے کی مشابہت محض نام رکھنے کا اتفاق ہے۔"
