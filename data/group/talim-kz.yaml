summary:
  ar: "قناة كازاخية للتعليم الإسلامي على يوتيوب (@talimkz) فُتحت في 13 فبراير 2013، يجمع اسمها ثلاث كلمات كازاخية في التعلم: «تاغيليم» (الموعظة) و«تانيم» (المعرفة) و«تاليم» (التعليم). تنشر مواعظ ودروسًا وأحاديث أسئلة وأجوبة لعدد من دعاة كازاخستان، منهم عبد الغفار سمانوف ونور سلطان قاسموف وجرقين ميرزاتاييف وأريستان أوسبانوف، إلى جانب إرشادات العمرة والحج، وبلغ عدد مشتركيها نحو 612 ألف مشترك بحسب عدّاد vidIQ المقروء في 5 نوفمبر 2026، وهو رقم منصّة مؤرّخ. ولا تُسمّي موادّ القناة المنشورة جهةً مشغّلة أو مؤسّسًا لها."
  en: "A Kazakh-language Islamic education channel on YouTube (@talimkz), opened on 13 February 2013, whose name strings together three Kazakh words for learning: tağylym (edification), tanym (knowledge) and tälim (instruction). It publishes sermons, lessons and question-and-answer talks by many Kazakh preachers — among them Abdugappar Smanov, Nursultan Kasimov, Zharkyn Myrzataev and Arystan Ospanov — alongside Umrah and Hajj guidance, and counted about 612 thousand subscribers by vidIQ's count read on 5 November 2026, a dated platform figure. No operating organisation or founder is named in the channel's published materials."
  ur: "تالیم کے زی قازق زبان کی ایک اسلامی تعلیمی چینل ہے جو یوٹیوب (@talimkz) پر 13 فروری 2013ء کو کھلی؛ اس کے نام میں سیکھنے کے تین قازق الفاظ جمع ہیں: تاغی لیم (نصیحت)، تانیم (معرفت) اور تالیم (تعلیم)۔ یہ قازقستان کے متعدد مبلغین کے وعظ، دروس اور سوال و جواب کی گفتگوئیں شائع کرتی ہے، جن میں عبد الغفار سمانوف، نور سلطان قاسموف، جارقین میرزاتایف اور ارستان اوسپانوف شامل ہیں، ساتھ میں عمرہ و حج کی رہنمائی بھی؛ اس کے اراکین کی تعداد vidIQ کے 5 نومبر 2026ء کو پڑھے گئے شمار کے مطابق تقریباً 612 ہزار تھی، جو ایک مؤرخہ پلیٹ فارم عدد ہے۔ چینل کی شائع کردہ مواد میں کسی چلانے والی تنظیم یا بانی کا نام نہیں ملتا۔"
