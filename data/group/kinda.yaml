summary:
  ar: "قبيلة من بطون كهلان القحطانية؛ نزلت البحرين ثم اضطرت إلى مغادرتها فنزلت حضرموت ثم نجداً، وكوّنت هناك حكومة كبيرة الشأن سرعان ما فنيت؛ ومنها الحارث بن عمرو بن حجر الكندي الذي ولاه قباذ الحيرة بعد عزل المنذر بن ماء السماء."
  en: "A Kahlani tribe of Qahtan that settled Bahrayn, then Hadramawt, then Najd, where it formed a considerable kingdom that soon vanished; its al-Harith ibn Amr ibn Hujr was installed at al-Hira by Qubadh after al-Mundhir's dismissal."
  es: "Una tribu Kahlani de Qahtan que se estableció en Bahrayn, luego en Hadramawt y después en Najd, donde formó un reino considerable que pronto desapareció; su líder, al-Harith ibn Amr ibn Hujr, fue instalado en al-Hira por Qubadh tras la destitución de al-Mundhir."
  fr: "Une tribu Kahlani de Qahtan qui s'est installée à Bahrayn, puis à Hadramawt, puis à Najd, où elle a formé un royaume considérable qui a rapidement disparu; son al-Harith ibn Amr ibn Hujr a été installé à al-Hira par Qubadh après le renvoi d'al-Mundhir."
  ur: "قحطان کا ایک کہلانی قبیلہ جس نے بحرین، پھر حضرموت، پھر نجد کو آباد کیا، جہاں اس نے ایک قابل ذکر سلطنت بنائی جو جلد ہی ختم ہو گئی۔ اس کے الحارث بن عمرو ابن حجر کو المنذر کی برطرفی کے بعد قباد نے الحیرہ میں نصب کیا تھا۔"
  tr: "Kahlan al-Qahtaniyya'nın kollarından bir kabile; Bahreyn'e yerleştiler, sonra oradan ayrılmaya zorlandılar, bu yüzden Hadhramaut'a ve daha sonra Necd'e yerleştiler ve orada büyük önem taşıyan ancak kısa sürede yok olan bir hükümet kurdular; aralarında, Kubadh'ın al-Mundhir ibn Ma' al-Sama'yı görevden aldıktan sonra Hira valisi olarak atadığı al-Harith ibn Amr ibn Hajar al-Kindi de vardı."
  id: "Sebuah suku dari cabang Kahlan al-Qahtaniyya; mereka menetap di Bahrain, kemudian dipaksa meninggalkannya, sehingga mereka menetap di Hadhramaut dan kemudian Najd, dan membentuk pemerintahan di sana yang sangat penting tetapi segera runtuh; di antara mereka adalah al-Harith ibn Amr ibn Hajar al-Kindi, yang diangkat Qubadh sebagai gubernur Hira setelah memecat al-Mundhir ibn Ma’ al-Sama’."
