summary:
  ar: "قبيلة من بطون كهلان القحطانية؛ نزلت البحرين ثم اضطرت إلى مغادرتها فنزلت حضرموت ثم نجداً، وكوّنت هناك حكومة كبيرة الشأن سرعان ما فنيت؛ ومنها الحارث بن عمرو بن حجر الكندي الذي ولاه قباذ الحيرة بعد عزل المنذر بن ماء السماء."
  en: "A Kahlani tribe of Qahtan that settled Bahrayn, then Hadramawt, then Najd, where it formed a considerable kingdom that soon vanished; its al-Harith ibn Amr ibn Hujr was installed at al-Hira by Qubadh after al-Mundhir's dismissal."
