label:
  ar: الأحلاف
  en: Al-Ahlaf (of the Najran delegation)
  ur: الاحلاف ⁦(نجران کے وفد میں)⁩
  es: "Al-Ahlaf (de la delegación de Najrán)"
  fr: "Al-Ahlaf (de la délégation de Najran)"
  tr: "İttifaklar"
  id: "Aliansi"
summary:
  ar: اسم جماعة ذُكرت بين وفد نجران إلى الهادي وبين من لقوه عند أعلى نجران وبايعوه، ولا يبين النص نسبها.
  en: The name of a group listed among the Najran delegation to al-Hadi and among those who met him at upper Najran and pledged; the text does not give its descent.
  ur: ایک جماعت کا نام جو نجران کے وفد اور اعلیٰ نجران میں ہادی سے ملنے اور بیعت کرنے والوں میں آیا؛ متن اس کا نسب نہیں بتاتا۔
  es: "El nombre de un grupo que figuraba entre la delegación de Najrán que se reunió con al-Hadi y entre los que se reunieron con él en la parte alta de Najrán y le prestaron juramento; el texto no indica su procedencia."
  fr: "Le nom d'un groupe figurant parmi la délégation de Najran auprès d'al-Hadi et parmi ceux qui l'ont rencontré à Najran-Haut et lui ont prêté serment; le texte n'en donne pas la provenance."
  tr: "Najran heyeti arasında Al-Hadi'ye gidenler ve Najran'ın tepesinde onunla görüşüp biat edenler arasında adı geçen bir grubun ismi geçiyor, ancak metinde bu grubun soyu açıklığa kavuşturulmuyor."
  id: "Nama sebuah kelompok disebutkan di antara delegasi Najran kepada Al-Hadi dan mereka yang menemuinya di puncak Najran dan menyatakan kesetiaan kepadanya, tetapi teks tersebut tidak menjelaskan silsilah mereka."
