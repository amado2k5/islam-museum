label: { ar: "سفيركا إسلامكا", en: "Safiirka Islaamka", ur: "سفیرکا اسلامکا" }
summary:
  ar: "«سفير الإسلام» قناة صومالية اللغة على يوتيوب مقرّها كينيا، أُنشئت في 4 ديسمبر 2018، وتقدّم — بحسب وصفها الذاتي — خدمة للمجتمع في القضايا الاجتماعية والقصص وموضوعات الزواج، إلى جانب محاضرات وأحاديث لعلماء صوماليين، وبلغ عدد مشتركيها نحو 299 ألفًا في نحو 1,683 مقطعًا بحسب عدّاد vidIQ في 4 نوفمبر 2026. لا تسمّي القناة مؤلفًا فردًا، فسُجّلت علامةً قناةً لا شخصًا."
  en: "'The Ambassador of Islam' — a Kenya-based Somali-language YouTube channel, created on 4 December 2018, which in its own description serves the community with social issues, stories and marriage topics, alongside lectures and talks by Somali scholars. It counted about 299,000 subscribers across some 1,683 videos by vidIQ's count as of 4 November 2026. The channel names no individual author, and it is recorded as a channel brand rather than a person."
  ur: "«سفیرِ اسلام» کینیا میں قائم صومالی زبان کا یوٹیوب چینل ہے، جو ۴ دسمبر ۲۰۱۸ء کو بنایا گیا؛ اپنے ہی تعارف کے مطابق یہ سماجی مسائل، قصوں اور شادی سے متعلق موضوعات کے ذریعے معاشرے کی خدمت کرتا ہے، اور اس کے ساتھ صومالی علماء کے دروس و تقاریر بھی پیش کرتا ہے۔ vidIQ کی گنتی کے مطابق ۴ نومبر ۲۰۲۶ء کو اس کے تقریباً ۱٬۶۸۳ ویڈیوز پر سبسکرائبرز کی تعداد لگ بھگ ۲۹۹٬۰۰۰ تھی۔ چینل کسی انفرادی مصنف کا نام نہیں لیتا، اس لیے اسے کسی شخص کے بجائے ایک چینل برانڈ کے طور پر درج کیا گیا ہے۔"
