summary:
  ar: "هوارة من بطون البرانس من قبائل البربر؛ كانوا ظواعن آهلين ومنهم من قطع الرمل إلى بلاد القفر، مواطنهم من ناحية طرابلس وما يليها من برقة وجبل هوارة المنسوب إليهم بإفريقية، وخرج على حنظلة بن صفوان منهم عبد الواحد بن يزيد مع عكاشة الفزاري فهزمهما وقتلهما سنة 124هـ، وخرج على يزيد بن حاتم سنة 156هـ يحيى بن فوناس منهم، ومع عبد الرحمن بن حبيب مجاهد بن مسلم من قواده، وأجاز منهم إلى الأندلس مع طارق رجالات مذكورون."
  en: "Hawwara of the Baranis Berbers; tent-dwellers and townsmen whose lands ran from Tripoli toward Barqa and their eponymous Jabal Hawwara in Ifriqiya — Abd al-Wahid ibn Yazid of them joined Ukasha al-Fazzari against Hanzala ibn Safwan and fell in 124 AH, Yahya ibn Fawnas rose on Yazid ibn Hatim in 156, Mujahid ibn Muslim marched with Abd al-Rahman ibn Habib's campaigns, and noted men of them crossed to al-Andalus with Tariq."
  es: "Hawwara de los baranis bereberes; habitantes de tiendas de campaña y habitantes de ciudades cuyas tierras iban desde Trípoli hacia Barqa y su epónimo Jabal Hawwara en Ifriqiya. Abd al-Wahid ibn Yazid de ellos se unió a Ukasha al-Fazzari contra Hanzala ibn Safwan y cayó en 124 AH, Yahya ibn Fawnas se levantó en Yazid ibn Hatim en 156, Mujahid ibn Muslim marchó con Las campañas de Abd al-Rahman ibn Habib, y hombres destacados de ellas cruzaron a al-Andalus con Tariq."
  fr: "Hawwara des Berbères Baranis; les habitants des tentes et les citadins dont les terres s'étendaient de Tripoli vers Barqa et leur Jabal Hawwara éponyme en Ifriqiya - Abd al-Wahid ibn Yazid d'entre eux rejoignit Ukasha al-Fazzari contre Hanzala ibn Safwan et tomba en 124 AH, Yahya ibn Fawnas se leva sur Yazid ibn Hatim en 156, Mujahid ibn Muslim marcha avec Abd Les campagnes d'al-Rahman ibn Habib, et des hommes remarquables d'entre eux se sont rendus à al-Andalus avec Tariq."
  ur: "Baranis Berbers کے Hawwara; خیمہ دار اور بستی والے جن کی زمینیں طرابلس سے برقع اور افریقیہ میں جبل حوارہ کی طرف چلی تھیں - ان میں سے عبد الواحد ابن یزید نے حنظلہ بن صفوان کے خلاف عکاشہ الفزاری میں شمولیت اختیار کی اور 124 ہجری میں یحییٰ ابن فوناس، 124 ہجری میں حنظلہ بن یزید کے خلاف فتح حاصل کی۔ ابن مسلم نے عبدالرحمٰن بن حبیب کی مہمات کے ساتھ کوچ کیا، اور ان میں سے مشہور آدمی طارق کے ساتھ اندلس کی طرف بڑھے۔"
  tr: "Hawara, Berberi kabilelerinden biri olan Baranilerin bir koludur. Göçebe ve yerleşik bir yaşam sürdürmüşler, bazıları da kumları aşarak çöllere geçmiştir. Anavatanları Trablus ve çevresindeki Barqa bölgesi ile Afrika'da onlara atfedilen Hawara Dağı'dır. Abdülvahid ibn Yazid, Ukaşa el-Fazari ile birlikte Hanzala ibn Safwan'a karşı isyan etmiş ve 124 Hicri yılında onları yenerek öldürmüştür. Yahya ibn Funas, Abdülrahman ibn Habib ve komutanlarından Mücahid ibn Müslim ile birlikte 156 Hicri yılında Yazid ibn Hatim'e karşı isyan etmiştir. Bazıları ise Tarık ile birlikte Endülüs'e geçmiştir."
  id: "Hawara adalah salah satu cabang dari Barani, salah satu suku Berber. Mereka hidup nomaden dan menetap, dan sebagian dari mereka menyeberangi gurun pasir. Tanah asal mereka berada di daerah Tripoli dan sekitarnya di Barqa dan Gunung Hawara, yang dikaitkan dengan mereka di Afrika. Abd al-Wahid ibn Yazid, bersama dengan Ukasha al-Fazari, memberontak melawan Hanzala ibn Safwan dari antara mereka, dan ia mengalahkan serta membunuh mereka pada tahun 124 H. Yahya ibn Funas, bersama dengan Abd al-Rahman ibn Habib, Mujahid ibn Muslim, salah satu komandannya, memberontak melawan Yazid ibn Hatim pada tahun 156 H. Sebagian dari mereka menyeberang ke Andalusia bersama Tariq, orang-orang yang disebutkan."
