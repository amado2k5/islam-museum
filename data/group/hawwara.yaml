label:
  ar: هوارة
  en: Hawwara
summary:
  ar: "هوارة من بطون البرانس من قبائل البربر؛ كانوا ظواعن آهلين ومنهم من قطع الرمل إلى بلاد القفر، مواطنهم من ناحية طرابلس وما يليها من برقة وجبل هوارة المنسوب إليهم بإفريقية، وخرج على حنظلة بن صفوان منهم عبد الواحد بن يزيد مع عكاشة الفزاري فهزمهما وقتلهما سنة 124هـ، وخرج على يزيد بن حاتم سنة 156هـ يحيى بن فوناس منهم، ومع عبد الرحمن بن حبيب مجاهد بن مسلم من قواده، وأجاز منهم إلى الأندلس مع طارق رجالات مذكورون."
  en: "Hawwara of the Baranis Berbers; tent-dwellers and townsmen whose lands ran from Tripoli toward Barqa and their eponymous Jabal Hawwara in Ifriqiya — Abd al-Wahid ibn Yazid of them joined Ukasha al-Fazzari against Hanzala ibn Safwan and fell in 124 AH, Yahya ibn Fawnas rose on Yazid ibn Hatim in 156, Mujahid ibn Muslim marched with Abd al-Rahman ibn Habib's campaigns, and noted men of them crossed to al-Andalus with Tariq."
