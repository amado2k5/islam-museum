summary:
  ar: "قبيلة يمانية قحطانية نزلت مكة في زمن إسماعيل وتزوج منها، ووليت أمر مكة بعد أولاده نحو عشرين قرناً، حتى أخرجتها خزاعة في أواسط القرن الثاني للميلاد فسدّت زمزم ورحلت إلى اليمن."
  en: "A Yemeni Qahtani tribe that settled at Mecca in Ismail’s time and intermarried with him; it held authority over Mecca for nearly twenty centuries until Khuzaʾa expelled it in the mid-second century CE, whereupon it buried Zamzam and departed for Yemen."
