summary:
  ar: "قبيلة يمانية قحطانية نزلت مكة في زمن إسماعيل وتزوج منها، ووليت أمر مكة بعد أولاده نحو عشرين قرناً، حتى أخرجتها خزاعة في أواسط القرن الثاني للميلاد فسدّت زمزم ورحلت إلى اليمن. وسار جرهم بن قحطان بولده ومن تبعه بعد عبد ضخم بن إرم فطافوا البلاد حتى أتوا مكة فنزلوها، وفيه يقول مضاض بن عمر الجرهمي هذا سبيل كسبيل يعرب البادئ القول المبين المعرب {cite:muruj-al-dhahab p. 458}، وعند البلاذري نزلت جرهم بمكة وما حولها وسموها صلاحاً، ثم استخفوا بحرمة البيت وأضاعوا حقه فوقع فيهم طاعون أهلك أكثرهم حتى قويت خزاعة عليهم وغلبت على البيت وأخرجتهم فنزلوا بين مكة ويثرب فهلكوا بداء يعرف بالعدسة إلا من سقط في نواحي البلاد {cite:ansab-al-ashraf p. 8}"
  en: "A Yemeni Qahtani tribe that settled at Mecca in Ismail’s time and intermarried with him; it held authority over Mecca for nearly twenty centuries until Khuzaʾa expelled it in the mid-second century CE, whereupon it buried Zamzam and departed for Yemen."
  es: "Una tribu yemení de Qahtani que se estableció en La Meca en tiempos de Ismail y se emparentó con él; mantuvo la autoridad sobre La Meca durante casi veinte siglos hasta que Khuzaʾa la expulsó a mediados del siglo II d.C., tras lo cual enterró a Zamzam y partió hacia Yemen."
  fr: "Une tribu yéménite Qahtani qui s'était installée à La Mecque à l'époque d'Ismaïl et avait contracté des mariages avec lui; elle exerça son autorité sur La Mecque pendant près de vingt siècles jusqu'à ce que Khuzaʾa l'expulse au milieu du IIe siècle de notre ère, après quoi elle enterra Zamzam et partit pour le Yémen."
  ur: "ایک یمنی قحطانی قبیلہ جو اسماعیل کے زمانے میں مکہ میں آباد ہوا اور اس سے شادی کی۔ اس نے تقریباً بیس صدیوں تک مکہ پر حکومت کی یہاں تک کہ دوسری صدی عیسوی کے وسط میں خزاعہ نے اسے بے دخل کر دیا، جس کے بعد اس نے زمزم کو دفن کیا اور یمن کے لیے روانہ ہوا۔"
  tr: "İsmail zamanında, Yemenli bir Kahtani kabilesi Mekke'ye yerleşti ve İsmail bu kabileyle evlendi. Oğullarından sonra yaklaşık yirmi yüzyıl boyunca Mekke'yi yönettiler, ta ki ikinci yüzyılın ortalarında Huzeyye onları kovana, Zemzem kuyusunu kapatana ve Yemen'e göç edene kadar. Cürhum ibn Kahtan, oğlu ve Abd Dakhm ibn İram'dan sonra onu takip edenlerle birlikte, toprakları dolaşarak Mekke'ye ulaştılar ve oraya yerleştiler. Bu konuda Mudhadh ibn Amr el-Cürhumi şöyle demiştir: \"Bu, açık ve güzel sözlerle başlayan Ya'rub'un yoluna benzer bir yoldur.\" {kaynak: Muruj-al-dhahab s. 458}. El-Baladhuri'ye göre, Cürhum Mekke ve çevresine yerleşti ve buraya Salah adını verdi. Sonra Kabe'nin kutsallığını hiçe saydı ve haklarını ihmal etti, bu yüzden bir veba salgını onları vurdu ve çoğunu öldürdü. Bunun üzerine Huzeyye onlara hükmetti, Evi ele geçirdi ve onları kovdu. Mekke ile Yathrib (Medine) arasına yerleştiler ve \"al-'adasa\" olarak bilinen bir hastalıktan öldüler; ancak ülkenin dış kesimlerinde hastalananlar hariç. {Kaynak: ansab-al-ashraf s. 8}"
  id: "Suku Qahtani Yaman menetap di Mekah pada masa Ismail, yang menikahi salah satu dari mereka. Mereka memerintah Mekah selama sekitar dua puluh abad setelah putra-putranya, hingga Khuza'ah mengusir mereka pada pertengahan abad ke-2 Masehi, membendung sumur Zamzam, dan bermigrasi ke Yaman. Jurhum ibn Qahtan, bersama putranya dan orang-orang yang mengikutinya setelah 'Abd Dhakhm ibn Iram, melakukan perjalanan melalui berbagai negeri hingga mereka mencapai Mekah dan menetap di sana. Mengenai hal ini, Mudhadh ibn 'Amr al-Jurhumi berkata: \"Ini adalah jalan seperti jalan Ya'rub, orang yang memulai dengan ucapan yang jelas dan fasih.\" {kutip:muruj-al-dhahab hlm. 458}. Menurut al-Baladhuri, Jurhum menetap di Mekah dan sekitarnya dan menyebutnya Salah. Kemudian mereka mengabaikan kesucian Rumah (Ka'bah) dan mengabaikan hak-haknya, sehingga wabah penyakit menimpa mereka, membunuh sebagian besar dari mereka. Kemudian Khuza'ah memperoleh kekuasaan atas mereka, menguasai Ka'bah, dan mengusir mereka. Mereka menetap di antara Mekah dan Yathrib (Madinah), dan binasa karena penyakit yang dikenal sebagai \"al-'adasa,\" kecuali mereka yang jatuh sakit di pinggiran negeri itu. {cite:ansab-al-ashraf p. 8}"
