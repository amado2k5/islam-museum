label: { ar: "جرهم", en: "Jurhum" }
summary:
  ar: "قبيلة يمانية قحطانية نزلت مكة في زمن إسماعيل وتزوج منها، ووليت أمر مكة بعد أولاده نحو عشرين قرناً، حتى أخرجتها خزاعة في أواسط القرن الثاني للميلاد فسدّت زمزم ورحلت إلى اليمن. وسار جرهم بن قحطان بولده ومن تبعه بعد عبد ضخم بن إرم فطافوا البلاد حتى أتوا مكة فنزلوها، وفيه يقول مضاض بن عمر الجرهمي هذا سبيل كسبيل يعرب البادئ القول المبين المعرب {cite:muruj-al-dhahab p. 458}، وعند البلاذري نزلت جرهم بمكة وما حولها وسموها صلاحاً، ثم استخفوا بحرمة البيت وأضاعوا حقه فوقع فيهم طاعون أهلك أكثرهم حتى قويت خزاعة عليهم وغلبت على البيت وأخرجتهم فنزلوا بين مكة ويثرب فهلكوا بداء يعرف بالعدسة إلا من سقط في نواحي البلاد {cite:ansab-al-ashraf p. 8}"
  en: "A Yemeni Qahtani tribe that settled at Mecca in Ismail’s time and intermarried with him; it held authority over Mecca for nearly twenty centuries until Khuzaʾa expelled it in the mid-second century CE, whereupon it buried Zamzam and departed for Yemen."
