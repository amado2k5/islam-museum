summary:
  ar: "عشيرة من أهل المدينة ذكرها ابن إسحاق في بُناة مسجد الضرار ⁦(خذام بن خالد وعباد بن حنيف)⁩ وفي الثلاثة المخلفين ⁦(مرارة بن الربيع)⁩."
  en: A Medinan clan that Ibn Ishaq mentions among the builders of Masjid al-Dirar (Khudham ibn Khalid and Abbad ibn Hunayf) and among the three left behind (Murara ibn al-Rabi').
  es: "Un clan medinense que Ibn Ishaq menciona entre los constructores de la Mezquita al-Dirar (Khudham ibn Khalid y Abbad ibn Hunayf) y entre los tres que quedaron atrás (Murara ibn al-Rabi')."
  fr: "Un clan médinois qu'Ibn Ishaq mentionne parmi les constructeurs de la mosquée al-Dirar (Khudham ibn Khalid et Abbad ibn Hunayf) et parmi les trois laissés sur place (Murara ibn al-Rabi')."
  ur: "مدینہ کا ایک قبیلہ جس کا ابن اسحاق نے مسجد الدیر کے بنانے والوں ⁦(خدام ابن خالد اور عباد بن حنیف)⁩ اور پیچھے رہ جانے والے تینوں ⁦(مرارہ ابن الربیع)⁩ میں ذکر کیا ہے۔"
  tr: "İbn İshak'ın Mescid-i Şerif'in inşaatçıları arasında (Hadham bin Halid ve Abbad bin Hanif) ve geride kalan üç kişi arasında (Murarah bin Al-Rabi') bahsettiği Medine halkından bir kabile."
  id: "Sebuah klan dari penduduk Madinah yang disebutkan oleh Ibnu Ishaq di antara para pembangun Masjid Perselisihan (Khadham bin Khalid dan Abbad bin Hanif) dan di antara tiga orang yang tetap tinggal (Murarah bin Al-Rabi’)."
