label:
  ar: المذهب الجعفري
  en: The Ja'fari school
  ur: جعفری مذہب
  es: "La escuela Ja'fari"
  fr: "L'école Ja'fari"
  tr: "Caferi düşünce okulu"
  id: "Aliran pemikiran Ja'fari"
summary:
  ar: "المذهب الجعفري مدرسة الفقه الإثني عشرية المنسوبة إلى جعفر الصادق؛ تعرضها كتب الملل ضمن الإمامية ويعرضها البحث الأكاديمي باعتبارها فقه الإثني عشرية {cite:milal-nihal-shahrastani} {cite:momen-1985}."
  en: "The Ja'fari school is the Twelver school of fiqh traced to Ja'far al-Sadiq; the heresiographies treat it within the Imamiyya and academic study presents it as Twelver jurisprudence {cite:milal-nihal-shahrastani} {cite:momen-1985}."
  es: "La escuela Ja'fari es la escuela duodecimana de fiqh que se remonta a Ja'far al-Sadiq; las heresiografías la tratan dentro de la Imamiyya y el estudio académico la presenta como jurisprudencia duodecimana {cite:milal-nihal-shahrastani} {cite:momen-1985}."
  fr: "L'école Ja'fari est l'école duodécimaine de fiqh qui remonte à Ja'far al-Sadiq; les hérésiographies la traitent au sein de l'Imamiyya et les études académiques la présentent comme une jurisprudence duodécimaine {cite:milal-nihal-shahrastani} {cite:momen-1985}."
  ur: "جعفری مکتبہ جعفری الصادق سے تعلق رکھنے والا فقہ کا بارہویں مکتب ہے۔ موروثیات اسے امامیہ کے اندر پیش کرتی ہیں اور علمی مطالعہ اسے بارہویں فقہ کے طور پر پیش کرتا ہے۔"
  tr: "Caferi ekolü, Cafer el-Sadık'a atfedilen On İki İmam Şiîliği'nin bir fıkıh ekolüdür; İmamiye içindeki dinler üzerine yazılmış kitaplarda ve akademik araştırmalarda On İki İmam Şiîliği fıkıhı olarak sunulmaktadır {cite:milal-nihal-shahrastani} {cite:momen-1985}."
  id: "Mazhab Ja'fari adalah mazhab fiqih Syiah Dua Belas Imam yang dinisbahkan kepada Ja'far al-Sadiq; mazhab ini terdapat dalam kitab-kitab tentang agama-agama dalam aliran Imamiyyah dan juga terdapat dalam penelitian akademis sebagai fiqih Syiah Dua Belas Imam {cite:milal-nihal-shahrastani} {cite:momen-1985}."
