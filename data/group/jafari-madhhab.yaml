summary:
  ar: "المذهب الجعفري مدرسة الفقه الإثني عشرية المنسوبة إلى جعفر الصادق؛ تعرضها كتب الملل ضمن الإمامية ويعرضها البحث الأكاديمي باعتبارها فقه الإثني عشرية {cite:milal-nihal-shahrastani} {cite:momen-1985}."
  en: "The Ja'fari school is the Twelver school of fiqh traced to Ja'far al-Sadiq; the heresiographies treat it within the Imamiyya and academic study presents it as Twelver jurisprudence {cite:milal-nihal-shahrastani} {cite:momen-1985}."
