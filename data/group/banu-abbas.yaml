summary:
  ar: "بطاقة أولية لبني العباس، بيت هاشمي من آل العباس بن عبد المطلب قامت على أنقاض الدولة الأموية دولة الخلفاء العباسيين؛ لم تُراجع الصفحة بعد."
  en: "Draft card for the Banu Abbas, the Hashimid house of al-Abbas ibn Abd al-Muttalib from which the Abbasid caliphs' state arose on the Umayyad collapse; the page not yet checked."
  es: "Ficha preliminar para los Banu Abbas, la casa hashímid de al-Abbas ibn Abd al-Muttalib de la que surgió el estado de los califas abasíes tras el colapso de los Omeyas; la página aún no ha sido revisada."
  fr: "Fiche de projet pour les Banu Abbas, la maison hassidique d'al-Abbas ibn Abd al-Muttalib d'où est né l'État des califes abbassides après l'effondrement des Omeyyades; la page n'a pas encore été vérifiée."
  ur: "بنو عباس کے لیے کارڈ کا مسودہ، العباس ابن عبد المطلب کا ہاشمی گھر جہاں سے عباسی خلفاء کی ریاست اموی کے خاتمے پر پیدا ہوئی تھی۔ صفحہ ابھی تک چیک نہیں ہوا ہے۔"
  tr: "Abbasilerin başlangıç kartı; Abbas ibn Abd al-Muttalib ailesinden bir Haşimi hanedanı. Abbasi Halifeliği, Emevi devletinin kalıntıları üzerine kurulmuştur; sayfa henüz incelenmemiştir."
  id: "Kartu pertama Dinasti Abbasiyah, sebuah keluarga Hashemite dari keluarga Abbas ibn Abd al-Muttalib. Kekhalifahan Abbasiyah didirikan di atas reruntuhan negara Umayyah; halaman ini belum ditinjau."
