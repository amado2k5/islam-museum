label: { ar: "بنو زريق", en: "Banu Zurayq" }
summary:
  ar: "بطن من الخزرج، بنو زريق بن عامر بن زريق بن عبد حارثة؛ كانوا أقل بني بياضة عدداً فخافوا أن يكثروهم فخرجوا من دارهم قبيل الإسلام إلى دارهم المعروفة قبل المصلى وسوق المدينة بذروان وما والاها، وابتنوا آطاماً منها أطم بزاوية دار كبير بن الصلت بالمصلى وأطم «الريان» عند «سقيفة الريان» لآل سراقة. وظلت بينهم وبين بني بياضة وبنو حبيب حرب شاخصة تصلحها الرسل بالدية حتى وضعوها وأقطعوهم زقاقاً سُمي «زقاق الدية»؛ وكانوا مع بني بياضة وبني غفر «أبطأهم فرة وأسرعهم كرة» {cite:samhudi-wafa-al-wafa p. 218-220}."
  en: "A clan of the Khazraj, Banu Zurayq ibn 'Amir; fewer than Banu Bayada, they left their quarter shortly before Islam for their known quarter before the musalla and the market at Dhurwan, building utum including one at the corner of Kabir ibn al-Salt's house and 'al-Rayyan' by the Saqifat al-Rayyan of the Suraqa family. A standing war with Banu Bayada and Banu Habib ran until settled by blood-money, the lane they were granted being named 'the Lane of the Diya'; they shared with Banu Bayada the fame of 'slowest to flee, fastest to charge' {cite:samhudi-wafa-al-wafa p. 218-220}."
