label: { ar: "بنو زريق", en: "Banu Zurayq", es: "Banu Zurayq", fr: "Banu Zurayq" }
summary:
  ar: "بطن من الخزرج، بنو زريق بن عامر بن زريق بن عبد حارثة؛ كانوا أقل بني بياضة عدداً فخافوا أن يكثروهم فخرجوا من دارهم قبيل الإسلام إلى دارهم المعروفة قبل المصلى وسوق المدينة بذروان وما والاها، وابتنوا آطاماً منها أطم بزاوية دار كبير بن الصلت بالمصلى وأطم «الريان» عند «سقيفة الريان» لآل سراقة. وظلت بينهم وبين بني بياضة وبنو حبيب حرب شاخصة تصلحها الرسل بالدية حتى وضعوها وأقطعوهم زقاقاً سُمي «زقاق الدية»؛ وكانوا مع بني بياضة وبني غفر «أبطأهم فرة وأسرعهم كرة» {cite:samhudi-wafa-al-wafa p. 218-220}."
  en: "A clan of the Khazraj, Banu Zurayq ibn 'Amir; fewer than Banu Bayada, they left their quarter shortly before Islam for their known quarter before the musalla and the market at Dhurwan, building utum including one at the corner of Kabir ibn al-Salt's house and 'al-Rayyan' by the Saqifat al-Rayyan of the Suraqa family. A standing war with Banu Bayada and Banu Habib ran until settled by blood-money, the lane they were granted being named 'the Lane of the Diya'; they shared with Banu Bayada the fame of 'slowest to flee, fastest to charge' {cite:samhudi-wafa-al-wafa p. 218-220}."
  es: "Un clan de los Khazraj, Banu Zurayq ibn 'Amir; menos numerosos que los Banu Bayada, abandonaron su barrio poco antes del Islam para establecerse en su barrio conocido, cerca de la musalla y el mercado de Dhurwan, construyendo utum, incluyendo uno en la esquina de la casa de Kabir ibn al-Salt y 'al-Rayyan', junto al Saqifat al-Rayyan de la familia Suraqa. Mantuvieron una guerra constante con los Banu Bayada y los Banu Habib hasta que se resolvió mediante un pago de compensación, y el camino que se les concedió recibió el nombre de 'el Camino de la Diya'. Compartían con los Banu Bayada la fama de ser los más lentos en huir y los más rápidos en atacar {cite:samhudi-wafa-al-wafa p. 218-220}."
  fr: "Un clan khazraj, les Banu Zurayq ibn 'Amir, moins nombreux que les Banu Bayada, quittèrent leur quartier peu avant l'avènement de l'islam pour s'installer dans leur quartier habituel, situé près de la mosquée et du marché de Dhurwan. Ils y construisirent des utum, dont un à l'angle de la maison de Kabir ibn al-Salt et d'« al-Rayyan », près de la Saqifat al-Rayyan de la famille Suraqa. Une guerre permanente les opposa aux Banu Bayada et aux Banu Habib, qui se termina par un règlement de comptes. La voie qui leur fut concédée fut nommée « la voie de la Diya ». Ils partageaient avec les Banu Bayada la réputation d'être « les plus lents à fuir, les plus rapides à charger » (voir Samhudi-Wafa-Al-Wafa, p. 218-220)."
