label: { ar: "نصارى نجران", en: "The Christians of Najran", es: "Los cristianos de Najrán", fr: "Les chrétiens de Najran" }
summary:
  ar: "أهل نجران الذين تنصّروا على يد الزاهد فيميون قرب زمن الاحتلال الحبشي الأول لليمن، ثم دعاهم ذو نواس الحميري إلى اليهودية فلما أبوا خدّ لهم الأخدود وأحرقهم في أكتوبر سنة 523م، ويقال إن القتلى ما بين عشرين ألفاً وأربعين ألفاً؛ أصحاب الأخدود في سورة البروج، في رواية الرحيق المختوم."
  en: "The people of Najran who became Christian through the ascetic Faymiyun around the time of the first Abyssinian occupation of Yemen; Dhu Nuwas the Himyarite summoned them to Judaism and, when they refused, dug the trench and burned them in October 523 CE, the dead being said to number between twenty and forty thousand; the People of the Trench of Surat al-Buruj, in al-Raheeq al-Makhtum's account."
  es: "La gente de Najrán que se convirtió al cristianismo a través del asceta Faymiyun alrededor de la época de la primera ocupación abisinia de Yemen; Dhu Nuwas el himyarita los llamó al judaísmo y, cuando se negaron, cavó la zanja y los quemó en octubre del 523 d.C., y se dice que los muertos fueron entre veinte y cuarenta mil; la gente de la zanja de Surat al-Buruj, según el relato de al-Raheeq al-Makhtum."
  fr: "Les habitants de Najran qui se convertirent au christianisme grâce à l'ascète Faymiyun à l'époque de la première occupation abyssinienne du Yémen; Dhu Nuwas l'Himyrite les appela au judaïsme et, lorsqu'ils refusèrent, creusa un fossé et les brûla en octobre 523 de notre ère, le nombre de morts étant estimé entre vingt et quarante mille; les habitants du Fossé de Surat al-Buruj, selon le récit d'al-Raheeq al-Makhtum."
