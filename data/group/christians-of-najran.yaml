label: { ar: "نصارى نجران", en: "The Christians of Najran" }
summary:
  ar: "أهل نجران الذين تنصّروا على يد الزاهد فيميون قرب زمن الاحتلال الحبشي الأول لليمن، ثم دعاهم ذو نواس الحميري إلى اليهودية فلما أبوا خدّ لهم الأخدود وأحرقهم في أكتوبر سنة 523م، ويقال إن القتلى ما بين عشرين ألفاً وأربعين ألفاً؛ أصحاب الأخدود في سورة البروج، في رواية الرحيق المختوم."
  en: "The people of Najran who became Christian through the ascetic Faymiyun around the time of the first Abyssinian occupation of Yemen; Dhu Nuwas the Himyarite summoned them to Judaism and, when they refused, dug the trench and burned them in October 523 CE, the dead being said to number between twenty and forty thousand; the People of the Trench of Surat al-Buruj, in al-Raheeq al-Makhtum's account."
