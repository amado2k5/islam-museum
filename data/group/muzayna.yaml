summary:
  ar: "بنو مزينة بن عمرو? — مزينة حي من مضر على ساحل تهامة بين الحجاز ووادي القرى، نزلت على طريق القوافل؛ منهم كعب بن مالك الأنصاري? لا — كعب من خزرج؛ ومن مزينة أهل الصريمة والسرية {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  en: "Banu Muzayna — a Mudar tribe on the Tihama coast between the Hijaz and Wadi al-Qura, settled on the caravan road; among them the men of the Sariyya episodes in the maghazi {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  es: "Banu Muzayna, una tribu mudar de la costa de Tihama entre Hijaz y Wadi al-Qura, se estableció en la carretera de las caravanas; Entre ellos, los hombres de los episodios de Sariyya en el maghazi {cita:tarikh-al-tabari} {cita:kamil-ibn-al-athir} {cita:mubarakpuri-raheeq p.16}."
  fr: "Banu Muzayna — une tribu Mudar de la côte du Tihama entre le Hijaz et le Wadi al-Qura, installée sur la route des caravanes; Parmi eux, les hommes des épisodes de Sariyya dans le maghazi {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
