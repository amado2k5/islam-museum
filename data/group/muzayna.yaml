label: { ar: "بنو مزينة", en: "Banu Muzayna", es: "Banu Muzayna", fr: "Banu Muzayna", ur: "بنو مزینہ", tr: "Banu Muzayna", id: "Banu Muzayna" }
summary:
  ar: "بنو مزينة بن عمرو? — مزينة حي من مضر على ساحل تهامة بين الحجاز ووادي القرى، نزلت على طريق القوافل؛ منهم كعب بن مالك الأنصاري? لا — كعب من خزرج؛ ومن مزينة أهل الصريمة والسرية {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  en: "Banu Muzayna — a Mudar tribe on the Tihama coast between the Hijaz and Wadi al-Qura, settled on the caravan road; among them the men of the Sariyya episodes in the maghazi {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  es: "Banu Muzayna, una tribu mudar de la costa de Tihama entre Hijaz y Wadi al-Qura, se estableció en la carretera de las caravanas; Entre ellos, los hombres de los episodios de Sariyya en el maghazi {cita:tarikh-al-tabari} {cita:kamil-ibn-al-athir} {cita:mubarakpuri-raheeq p.16}."
  fr: "Banu Muzayna — une tribu Mudar de la côte du Tihama entre le Hijaz et le Wadi al-Qura, installée sur la route des caravanes; Parmi eux, les hommes des épisodes de Sariyya dans le maghazi {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
  ur: "بنو مزینہ — حجاز اور وادی القریٰ کے درمیان تہامہ کے ساحل پر ایک مدر قبیلہ، کارواں سڑک پر آباد؛ ان میں سریہ کی قسطیں مقالے میں {حوالہ:تاریخ الطبری} {حوالہ:کامل ابن الاثیر} {حوالہ:مبارکپوری الرحیق صفحہ 16}۔"
  tr: "Beni Muzaynah ibn Amr? — Muzaynah, Hicaz ile Vadi el-Kura arasında Tihamah kıyısındaki Mudar kabilesindendir. Kervan yolu üzerinde yerleşmişlerdir. Aralarında Ka'b ibn Malik el-Ensari de var mıydı? Hayır — Ka'b Hazrec kabilesindendi. Muzaynah kabilesinden ise el-Sarimah ve el-Sariyyah kabileleri gelir. {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq s.16}."
  id: "Banu Muzaynah ibn Amr? — Muzaynah adalah klan Mudar di pantai Tihamah antara Hijaz dan Wadi al-Qura. Mereka menetap di jalur kafilah. Di antara mereka ada Ka’b ibn Malik al-Ansari? Tidak — Ka’b berasal dari Khazraj. Dan dari Muzaynah adalah penduduk al-Sarimah dan al-Sariyyah. {cite:tarikh-al-tabari} {cite:kamil-ibn-al-athir} {cite:mubarakpuri-raheeq p.16}."
