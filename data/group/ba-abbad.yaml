  ur: "حضرت ہود کے مزار سے وابستہ علماء و مشائخ کا ایک حضرمی خاندان؛ اس کے ارکان کو شبام میں دفن کیا گیا {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 877}۔"
  tr: "Hz. Hud türbesiyle bağlantılı Hadrami alim ve şeyh ailesinden önde gelen isimler Şibam'a defnedilmiştir. {cite:encyclopaedia-of-islam-2 vol. 1 p. 877}"
  id: "Keluarga Hadrami yang terdiri dari para ulama dan syekh yang terkait dengan makam Nabi Hud, dan tokoh-tokoh terkemukanya dimakamkan di Shibam {cite:encyclopaedia-of-islam-2 vol. 1 p. 877}."
