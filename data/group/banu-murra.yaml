summary:
  ar: "قبيلة من غطفان بفدك؛ غزاهم بشير بن سعد، وغزا أرضهم غالب بن عبد الله الليثي فأصاب فيها مرداس بن نهيك حليفاً لهم من الحرقة من جهينة، قتله أسامة بن زيد ورجل من الأنصار بعد أن قال لا إله إلا الله."
  en: "A tribe of Ghatafan at Fadak; Bashir ibn Sa'd raided them, and Ghalib ibn Abdullah al-Laythi raided their land and struck Mirdas ibn Nahik, an ally of theirs from al-Hurqa of Juhayna, whom Usama ibn Zayd and an Ansari killed after he had said there is no god but God."
  es: "Una tribu de Ghatafan en Fadak; Bashir ibn Sa'd los asaltó, y Ghalib ibn Abdullah al-Laythi asaltó sus tierras y atacó a Mirdas ibn Nahik, un aliado suyo de al-Hurqa de Juhayna, a quien Usama ibn Zayd y un Ansari mataron después de que dijera que no hay más dios que Dios."
  fr: "Une tribu de Ghatafan à Fadak; Bashir ibn Sa'd les a attaqués, et Ghalib ibn Abdullah al-Laythi a attaqué leurs terres et a frappé Mirdas ibn Nahik, un de leurs alliés d'al-Hurqa de Juhayna, qu'Usama ibn Zayd et un Ansari ont tué après qu'il ait dit qu'il n'y a de dieu que Dieu."
  ur: "فدک میں غطفان کا ایک قبیلہ؛ بشیر بن سعد نے ان پر چھاپہ مارا اور غالب ابن عبداللہ لیثی نے ان کی سرزمین پر چھاپہ مارا اور جہینہ کے الحرکہ سے ان کے ایک حلیف میرداس بن نحیک کو مارا جسے اسامہ بن زید اور ایک انصاری نے اس وقت قتل کر دیا جب اس نے کہا تھا کہ خدا کے سوا کوئی معبود نہیں ہے۔"
  tr: "Fadak'taki Gatafan kabilesinden bir grup; Beşir bin Saad onlara baskın düzenledi ve Galib bin Abdullah el-Layti de onların topraklarına baskın düzenleyerek, Cuhayna'daki El-Hurka kabilesinden müttefikleri Mirdas bin Nahik'i esir aldı. Mirdas bin Nahik, \"Allah'tan başka ilah yoktur\" dedikten sonra Usame bin Zeyd ve Ensar'dan bir adam tarafından öldürüldü."
  id: "Sebuah suku dari Ghatafan di Fadak; Bashir bin Saad menyerang mereka, dan Ghalib bin Abdullah Al-Laythi menyerang tanah mereka dan menangkap Mirdas bin Nahik, sekutu mereka dari Al-Hurqa dari Juhayna. Usama bin Zaid dan seorang pria dari kaum Ansar membunuhnya setelah dia berkata, “Tidak ada Tuhan selain Allah.”"
