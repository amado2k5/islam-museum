summary:
  ar: "قوم من البجة يرحلون في صحراء عيذاب؛ يشتري منهم أهل عيذاب السمن والعسل واللبن، ويقيم عندهم عامل من قبل رئيسهم في المدينة، ويذكر المؤلف أنهم يحمون المدينة. {cite:nuzhat-al-mushtaq-2002 p. 134-135}"
  en: "A people who move through the Aydhab desert; Aydhab traders buy ghee, honey and milk from them, and the author says their chief keeps an agent in the town and defends it. {cite:nuzhat-al-mushtaq-2002 p. 134-135}"
  es: "Un pueblo que se desplaza por el desierto de Aydhab; los comerciantes de Aydhab les compran ghee, miel y leche, y el autor afirma que su jefe mantiene un agente en la ciudad y la defiende. {cite:nuzhat-al-mushtaq-2002 p. 134-135}"
  fr: "Un peuple qui se déplace dans le désert d'Aydhab; les marchands d'Aydhab leur achètent du ghee, du miel et du lait, et l'auteur indique que leur chef a un agent dans la ville et la défend. {cite:nuzhat-al-mushtaq-2002 p. 134-135}"
  ur: "وہ لوگ جو صحرائے ایذاب سے گزرتے ہیں۔ ایذاب کے تاجر ان سے گھی، شہد اور دودھ خریدتے ہیں، اور مصنف کا کہنا ہے کہ ان کا سردار قصبے میں ایک ایجنٹ رکھتا ہے اور اس کا دفاع کرتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 134-135}"
