  ar: "عند المسعودي أن الجلالقة أشد بأساً من الإفرنجة وأعظم نكاية والرجل منهم يقاوم عدة من الإفرنجة، وهم أشد الأمم المحاربة لأهل الأندلس، ملكهم إلى سنة اثنتين وثلاثين وثلاثمائة رذمير وقبله أردون وقبله أذبوشن، ويدينون بالنصرانية على رأي الملكية كالإفرنجة {cite:muruj-al-dhahab p. 357-360}."
  en: "al-Mas'udi's Jalaliqa — the Galicians/Leonese, fiercer than the Franks, chief warring neighbour of Umayyad al-Andalus; their king in 332 was Rudhmir, before him Ardon and before him Adhubshan; Melkite Christians like the Franks {cite:muruj-al-dhahab p. 357-360}."
