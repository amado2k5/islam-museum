label: { ar: "الجلالقة", en: "The Galicians (Jalaliqa)", es: "Los gallegos (Jalaliqa)", fr: "Les Galiciens (Jalaliqa)", ur: "گالیشین ⁦(جلالیقہ)⁩", tr: "Celalika", id: "Jalaliqa" }
summary:
  ar: "عند المسعودي أن الجلالقة أشد بأساً من الإفرنجة وأعظم نكاية والرجل منهم يقاوم عدة من الإفرنجة، وهم أشد الأمم المحاربة لأهل الأندلس، ملكهم إلى سنة اثنتين وثلاثين وثلاثمائة رذمير وقبله أردون وقبله أذبوشن، ويدينون بالنصرانية على رأي الملكية كالإفرنجة {cite:muruj-al-dhahab p. 357-360}."
  en: "al-Mas'udi's Jalaliqa — the Galicians/Leonese, fiercer than the Franks, chief warring neighbour of Umayyad al-Andalus; their king in 332 was Rudhmir, before him Ardon and before him Adhubshan; Melkite Christians like the Franks {cite:muruj-al-dhahab p. 357-360}."
  es: "Jalaliqa de al-Mas'udi: los gallegos/leoneses, más feroces que los francos, principal vecino guerrero de los omeyas al-Ándalus; su rey en 332 fue Rudhmir, antes que él Ardon y antes que él Adhubshan; cristianos melquitas como los francos {cita:muruj-al-dhahab págs. 357-360}."
  fr: "Jalaliqa d'al-Mas'udi — les Galiciens/Léonais, plus féroces que les Francs, principal voisin belligérant des Omeyyades d'al-Andalus; leur roi en 332 était Rudhmir, avant lui Ardon et avant lui Adhubshan; chrétiens melkites comme les Francs {cite: muruj-al-dhahab p. 357-360}."
  ur: "المسعودی کا جلالیقہ — گالیشیائی/لیونی، فرینکوں سے زیادہ سخت، اموی الاندلس کا اہم متحارب پڑوسی؛ 332 میں ان کا بادشاہ ردمیر تھا، اس سے پہلے اردن اور اس سے پہلے ادھوبشن۔ میلکائٹ عیسائی فرانکس کی طرح 357-360}۔"
  tr: "El-Mas'udi, Galiçyalıların Franklardan daha güçlü ve daha acımasız olduğunu, içlerinden bir kişinin birkaç Frank'a karşı koyabileceğini söylemiştir. Endülüs halkına karşı en düşman milletlerden biriydiler. 332 yılına kadar kralları Radhamir'di, ondan önce Ardun, ondan önce de Adhushan vardı. Franklar gibi Melkitlerin görüşüne göre Hristiyanlığı benimsediler. {cite:muruj-al-dhahab s. 357-360}"
  id: "Al-Mas’udi mengatakan bahwa orang Galisia lebih kuat dan lebih kejam daripada orang Frank, dan bahwa satu orang dari mereka dapat melawan beberapa orang Frank. Mereka adalah bangsa yang paling bermusuhan terhadap penduduk Andalusia. Raja mereka hingga tahun 332 adalah Radhamir, dan sebelum dia adalah Ardun, dan sebelum dia adalah Adhushan. Mereka menganut agama Kristen menurut pendapat kaum Melkit, seperti orang Frank. {cite:muruj-al-dhahab hlm. 357-360}."
