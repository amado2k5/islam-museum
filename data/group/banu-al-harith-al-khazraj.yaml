label: { ar: "بنو الحارث بن الخزرج", en: "Banu al-Harith ibn al-Khazraj", es: "Banu al-Harith ibn al-Khazraj", fr: "Banu al-Harith ibn al-Khazraj", ur: "بنو الحارث ابن الخزرج", tr: "Banu al-Harith ibn al-Khazraj", id: "Banu al-Harith ibn al-Khazraj" }
summary:
  ar: "بطن من الخزرج، بنو الحارث بن الخزرج الأكبر بن حارثة — وهم بلحارث — نزلوا دارهم بالعوالي شرقي وادي بطحان وتربة صُعيب، وابتنوا أطماً سُميت به الناحية «السُّنْح»؛ خرج منهم جشم وزيد ابنا الحارث فسكنا السنح، وكان فيه منزل أبي بكر بزوجته بنت خارجة بن زيد، وبينه وبين منزل النبي ميل {cite:samhudi-wafa-al-wafa p. 210-211}. وهم الثالثة في دور الأنصار في فضل الصحيح {cite:sahih-al-bukhari 3807}."
  en: "A clan of the Khazraj, Banu al-Harith ibn al-Khazraj the Elder (Balharith); they settled their quarter in the 'Awali east of Wadi Buthan by the Su'ayb plot, and built the utm after which the quarter 'al-Sunh' was named — where Abu Bakr had his home with his wife bint Kharija ibn Zayd, a mile from the Prophet's residence {cite:samhudi-wafa-al-wafa p. 210-211}."
  es: "Un clan de los Khazraj, Banu al-Harith ibn al-Khazraj el Viejo (Balharith); establecieron su barrio en el 'Awali al este de Wadi Buthan junto al terreno de Su'ayb, y construyeron el utm del cual el barrio 'al-Sunh' recibió su nombre, donde Abu Bakr tenía su hogar con su esposa bint Kharija ibn Zayd, a una milla de la residencia del Profeta {cite:samhudi-wafa-al-wafa p. 210-211}."
  fr: "Un clan des Khazraj, Banu al-Harith ibn al-Khazraj l'Ancien (Balharith); ils ont établi leur quartier dans l'Awali à l'est de Wadi Buthan près du terrain Su'ayb, et ont construit l'utm d'après lequel le quartier 'al-Sunh' a été nommé — où Abu Bakr avait sa maison avec sa femme bint Kharija ibn Zayd, à un mile de la résidence du Prophète {cite:samhudi-wafa-al-wafa p. 210-211}."
  ur: "خزرج کا ایک قبیلہ، بنو الحارث ابن الخزرج بزرگ ⁦(بلحارث)⁩؛ انہوں نے اپنا کوارٹر 'عوالی مشرق میں وادی بوتان کے مشرق میں صعیب کے پلاٹ کے پاس آباد کیا، اور اتم بنایا جس کے بعد کوارٹر 'السنہ' کا نام دیا گیا - جہاں ابوبکر نے اپنی بیوی بنت خارجہ ابن زید کے ساتھ اپنا گھر تھا، جو رسول اللہ کی رہائش گاہ سے ایک میل کے فاصلے پر تھا۔ 210-211}۔"
  tr: "Hazrec kabilesinin bir kolu olan Beni el-Harith ibn el-Hazrec el-Ekber ibn Harith (Balaharith olarak da bilinir), Vadi Butan ve Turbat Suayb'ın doğusundaki el-Awali'deki yurtlarına yerleştiler. Burada surlarla çevrili bir yapı inşa ettiler ve bölgeye bu yapıdan sonra \"el-Sünh\" adı verildi. El-Harith'in oğulları Cuşam ve Zeyd onları terk edip el-Sünh'e yerleştiler. Ebu Bekir'in evi de orada, karısı Harice ibn Zeyd'in kızıyla birlikte bulunuyordu ve Peygamber'in evinden yaklaşık bir mil uzaklıktaydı. {Sahih-i Vefa-i Vefa s. 210-211}. Onlar, Sahih'te Ensar'ın faziletleri listesinde üçüncü sırada yer alırlar. {Sahih-i Buhari 3807}"
  id: "Sebuah cabang dari Khazraj, Banu al-Harith ibn al-Khazraj al-Akbar ibn Haritha—juga dikenal sebagai Balharith—menetap di rumah mereka di al-Awali, sebelah timur Wadi Buthan dan Turbat Su'aib. Mereka membangun sebuah bangunan berbenteng, dan daerah itu dinamai \"al-Sunh\" sesuai dengan bangunan tersebut. Jusham dan Zayd, putra-putra al-Harith, meninggalkan mereka dan menetap di al-Sunh. Rumah Abu Bakr berada di sana bersama istrinya, putri Kharijah ibn Zayd, dan berjarak satu mil dari rumah Nabi {cite:samhudi-wafa-al-wafa hlm. 210-211}. Mereka adalah yang ketiga dalam daftar Ansar dalam keutamaan Sahih {cite:sahih-al-bukhari 3807}."
