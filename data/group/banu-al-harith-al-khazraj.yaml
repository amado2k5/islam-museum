label: { ar: "بنو الحارث بن الخزرج", en: "Banu al-Harith ibn al-Khazraj" }
summary:
  ar: "بطن من الخزرج، بنو الحارث بن الخزرج الأكبر بن حارثة — وهم بلحارث — نزلوا دارهم بالعوالي شرقي وادي بطحان وتربة صُعيب، وابتنوا أطماً سُميت به الناحية «السُّنْح»؛ خرج منهم جشم وزيد ابنا الحارث فسكنا السنح، وكان فيه منزل أبي بكر بزوجته بنت خارجة بن زيد، وبينه وبين منزل النبي ميل {cite:samhudi-wafa-al-wafa p. 210-211}."
  en: "A clan of the Khazraj, Banu al-Harith ibn al-Khazraj the Elder (Balharith); they settled their quarter in the 'Awali east of Wadi Buthan by the Su'ayb plot, and built the utm after which the quarter 'al-Sunh' was named — where Abu Bakr had his home with his wife bint Kharija ibn Zayd, a mile from the Prophet's residence {cite:samhudi-wafa-al-wafa p. 210-211}."
