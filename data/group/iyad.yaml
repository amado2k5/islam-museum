label: { ar: "إياد بن نزار", en: "Iyad ibn Nizar", es: "Iyad ibn Nizar", fr: "Iyad ibn Nizar", ur: "عیاض بن نضر", tr: "İyad bin Nizar", id: "Iyad bin Nizar" }
summary:
  ar: "إياد بن نزار بن معد أكبر أولاده وبه كان يكنى، قسم له أبوه عند وفاته الجارية الشمطاء وما أشبهها من ماله، وفي المفازة نحو الأفعى قال عن أثر البعير إنه لأعور لأنه رآه مجتهداً في رعي الكلأ من شق قد لحسه والشق الآخر واف {cite:muruj-al-dhahab p. 431-432}. وفصل الأفعى قسمة نزار فجعل لإياد الغنم البرشاء ورعاءها مع الخادم، وقال في الشهد لولا أن نحله ألقاه في هامة جبار فوجد كما قال {cite:muruj-al-dhahab p. 433-434}"
  en: "Eldest of Nizar's sons and his father's kunya-name — allotted the grey-haired slave-girl's likeness, and the brother who read the camel's one eye from its grazed patch {cite:muruj-al-dhahab p. 431-432}."
  es: "El mayor de los hijos de Nizar y el kunya-name de su padre, a quien se le asignó la imagen de la esclava de cabello gris y el hermano que leyó el único ojo del camello por su parche de sangre {cite:muruj-al-dhahab p. 431-432}."
  fr: "L'aîné des fils de Nizar et le nom kunya de son père — ont attribué la ressemblance de l'esclave aux cheveux gris, et le frère qui a lu l'œil unique du chameau à partir de sa tache broutée {cite:muruj-al-dhahab p. 431-432}."
  ur: "نزار کے سب سے بڑے بیٹوں اور اس کے والد کا کنیہ نام - سرمئی بالوں والی لونڈی کی تشبیہ دی گئی، اور بھائی جس نے اونٹ کی ایک آنکھ کو اس کے چرے ہوئے پیوند سے پڑھا۔ 431-432}۔"
  tr: "İyad ibn Nizar ibn Ma'ad, babasının en büyük oğluydu ve bu isimle tanınıyordu. Ölümünden sonra babası, aralarında yaşlı cariyenin de bulunduğu tüm servetini ona paylaştırdı. Çölde, el-Af'a yakınlarında, devenin ayak izleri hakkında, tek gözlü olduğunu söyledi; çünkü devenin otlakta özenle otladığını, bir tarafını yaladığını, diğer tarafının ise dolu olduğunu görmüştü. {kaynak: Muruj-al-Dhahab s. 431-432}. El-Af'a, Nizar'ın paylaşımını detaylandırarak, İyad'a benekli koyunları, çobanlarını ve cariyeyi verdiğini anlattı. Bal peteği hakkında ise, \"Eğer arısı onu bir zalimin başına atmasaydı, dediği gibi bulunurdu\" dedi. {kaynak: Muruj-al-Dhahab s. 433-434}"
  id: "Iyad bin Nizar bin Ma'ad adalah putra sulungnya, dan ia dikenal dengan nama ini. Setelah kematiannya, ayahnya membagi hartanya, termasuk budak perempuan berambut abu-abu, kepadanya. Di padang pasir, dekat al-Af'a, ia berkata tentang jejak unta bahwa unta itu bermata satu karena ia melihatnya dengan rajin merumput di padang rumput, setelah menjilati satu sisi dan sisi lainnya penuh. {kutipan:muruj-al-dhahab hlm. 431-432}. Al-Af'a merinci pembagian harta Nizar, memberikan Iyad domba berbintik dan para gembalanya beserta budak perempuan itu. Ia berkata tentang sarang madu, \"Seandainya lebahnya tidak melemparkannya ke kepala seorang tiran, sarang itu pasti akan ditemukan seperti yang dikatakannya.\" {kutipan:muruj-al-dhahab hlm. 433-434}"
