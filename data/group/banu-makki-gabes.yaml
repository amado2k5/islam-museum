label:
  ar: بنو مكي رؤساء قابس
  en: Banu Makki, chiefs of Gabes
summary:
  ar: "بنو مكي، رؤساء قابس وأعمالها من العرب؛ استبد رئيسهم لأول أمره عبد الملك بن مكي بقابس وجربة ومد أحمد يده إلى صفاقس، وكانوا في طاعة الحفصيين يسوسون البلد وأعماله إلى أن انتزعه منهم الأمير عمر بن اللحياني فشردوا عن قابس وانقرض أمرهم منها."
  en: "Banu Makki, the Arab chiefs of Gabes and its districts; their first ruler Abd al-Malik ibn Makki held Gabes and Djerba and stretched his hand to Sfax, governing under Hafsid obedience until the amir Umar ibn al-Lihyani wrested the town from them and they were scattered, their rule at Gabes ended."
