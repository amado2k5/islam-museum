id: group/banu-makki-gabes
class: group
kind: tribe
label:
  ar: بنو مكي رؤساء قابس
  en: Banu Makki, chiefs of Gabes
  es: "Banu Makki, jefes de Gabes"
  fr: "Banu Makki, chefs de Gabès"
  ur: "بنو مکی، گیبس کے سردار"
  tr: "Gabes'in şefleri Banu Makki"
  id: "Banu Makki, para kepala suku Gabes"
summary:
  ar: "بنو مكي، رؤساء قابس وأعمالها من العرب؛ استبد رئيسهم لأول أمره عبد الملك بن مكي بقابس وجربة ومد أحمد يده إلى صفاقس، وكانوا في طاعة الحفصيين يسوسون البلد وأعماله إلى أن انتزعه منهم الأمير عمر بن اللحياني فشردوا عن قابس وانقرض أمرهم منها."
  en: "Banu Makki, the Arab chiefs of Gabes and its districts; their first ruler Abd al-Malik ibn Makki held Gabes and Djerba and stretched his hand to Sfax, governing under Hafsid obedience until the amir Umar ibn al-Lihyani wrested the town from them and they were scattered, their rule at Gabes ended."
  es: "Los Banu Makki, los jefes árabes de Gabes y sus distritos; su primer gobernante, Abd al-Malik ibn Makki, controlaba Gabes y Djerba y extendió su mano hasta Sfax, gobernando bajo la obediencia de los Hafsid hasta que el emir Umar ibn al-Lihyani les arrebató la ciudad y fueron dispersados, poniendo fin a su dominio en Gabes."
  fr: "Les Banu Makki, chefs arabes de Gabès et de ses districts; leur premier dirigeant, Abd al-Malik ibn Makki, contrôlait Gabès et Djerba et étendait son influence jusqu'à Sfax, gouvernant sous l'obéissance des Hafsides jusqu'à ce que l'émir Umar ibn al-Lihyani leur arrache la ville et qu'ils soient dispersés, leur règne à Gabès prit fin."
  ur: "بنو مکی، گبس اور اس کے اضلاع کے عرب سردار؛ ان کے پہلے حکمران عبد الملک ابن مکی نے گیبس اور جربا کو پکڑا اور اپنا ہاتھ سفاکس کی طرف بڑھایا، حفصید کی اطاعت میں حکومت کرتا رہا یہاں تک کہ امیر عمر بن لحیانی نے ان سے شہر چھین لیا اور وہ بکھر گئے، گیبس پر ان کی حکومت ختم ہو گئی۔"
  tr: "Gabes ve çevresinin reisleri olan Beni Makki, Arap kökenliydi. Reisleri Abdülmalik ibn Makki, başlangıçta Gabes ve Cerbe'nin kontrolünü ele geçirdi ve Ahmed de Sfax'a el uzattı. Hafsidlerin otoritesi altında, şehri ve çevresini yönetiyorlardı, ta ki Prens Ömer ibn el-Lihyani şehri ellerinden alana kadar. Böylece Gabes'ten kovuldular ve oradaki yönetimleri sona erdi."
  id: "Bani Makki, para pemimpin Gabes dan distrik-distriknya, adalah orang Arab. Pemimpin mereka, Abd al-Malik ibn Makki, awalnya menguasai Gabes dan Djerba, dan Ahmad mengulurkan tangannya ke Sfax. Mereka berada di bawah kekuasaan Dinasti Hafsid, memerintah kota dan distrik-distriknya, hingga Pangeran Omar ibn al-Lihyani merebutnya dari mereka, sehingga mereka diusir dari Gabes dan kekuasaan mereka di sana berakhir."
