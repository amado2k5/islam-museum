summary:
  ar: "برغواطة من بطون مصمودة؛ مواطنهم ساحل المغرب الأقصى في تامسنا وما إليها، وقام لهم في الجاهلية المتأخرة دولة على دين ابتدعه رئيسهم يونس بن إلياس وادعى فيه ما ادعى من الأنبياء والتشريع، فدانوا به أجيالاً وحاربوا من وراءهم من ملوك زناتة وصنهاجة والمروانيين، وجهدهم بلكين بن زيري وملوك الأمويين حتى بادت دولتهم وبقيت آثارهم في قبائل الساحل إلى دولة المرابطين."
  en: "Barghawata of the Masmuda; their homeland the Far Maghreb's Atlantic coast at Tamsna and its lands — in the late Jahiliyya their chief Yunus ibn Ilyas founded them a state on a self-made creed with claims of prophecy and scripture of their own, which they held for generations, warring the Zanata, Sanhaja and Marwanid kings until Buluggin ibn Ziri and the Umayyads ground their state down, their traces lasting among the coastal tribes to Almoravid days."
