summary:
  ar: "برغواطة من بطون مصمودة؛ مواطنهم ساحل المغرب الأقصى في تامسنا وما إليها، وقام لهم في الجاهلية المتأخرة دولة على دين ابتدعه رئيسهم يونس بن إلياس وادعى فيه ما ادعى من الأنبياء والتشريع، فدانوا به أجيالاً وحاربوا من وراءهم من ملوك زناتة وصنهاجة والمروانيين، وجهدهم بلكين بن زيري وملوك الأمويين حتى بادت دولتهم وبقيت آثارهم في قبائل الساحل إلى دولة المرابطين."
  en: "Barghawata of the Masmuda; their homeland the Far Maghreb's Atlantic coast at Tamsna and its lands — in the late Jahiliyya their chief Yunus ibn Ilyas founded them a state on a self-made creed with claims of prophecy and scripture of their own, which they held for generations, warring the Zanata, Sanhaja and Marwanid kings until Buluggin ibn Ziri and the Umayyads ground their state down, their traces lasting among the coastal tribes to Almoravid days."
  es: "Barghawata de los Masmuda; su tierra natal, la costa atlántica del Magreb lejano en Tamsna y sus tierras: a finales de la época preislámica, su jefe Yunus ibn Ilyas fundó un estado basado en un credo propio con pretensiones de profecía y escrituras propias, que mantuvieron durante generaciones, guerreando contra los reyes Zanata, Sanhaja y Marwanid hasta que Buluggin ibn Ziri y los Omeyas aniquilaron su estado, aunque sus huellas perduraron entre las tribus costeras hasta la época almorávide."
  fr: "Les Barghawata des Masmuda; leur patrie la côte atlantique du Maghreb lointain à Tamsna et ses terres — à la fin de la Jahiliyya, leur chef Yunus ibn Ilyas fonda un État sur un credo qu'ils avaient eux-mêmes créé, avec des revendications de prophétie et d'écriture propres, qu'ils conservèrent pendant des générations, en guerre contre les rois Zanata, Sanhaja et Marwanide jusqu'à ce que Buluggin ibn Ziri et les Omeyyades anéantissent leur État, leurs traces subsistant parmi les tribus côtières jusqu'à l'époque almoravide."
  ur: "مسمودا کا برغوتا؛ ان کا آبائی وطن بعید مغرب کا بحر اوقیانوس کا ساحل تمسنا اور اس کی سرزمین پر - جاہلیت کے اواخر میں ان کے سردار یونس ابن الیاس نے ان کے لیے ایک خود ساختہ عقیدہ پر ایک ریاست کی بنیاد رکھی جس میں ان کی اپنی نبوت اور صحیفے کے دعوے تھے، جسے وہ نسل در نسل قائم رکھے ہوئے تھے، زناتا، سنہاجہ اور مروانیوں سے جنگ کرتے رہے جب تک کہ ان کی زمینوں پر حکومت نہ کر سکے۔ نیچے، ان کے آثار ساحلی قبائل کے درمیان الموراوڈ دنوں تک موجود ہیں۔"
  tr: "Barghawata, Masmuda kabilesinin bir koludur. Anavatanları, uzak Mağrip kıyılarındaki Tamasna ve çevresidir. İslam öncesi dönemin sonlarında, peygamberlik ve yasama yetkisine sahip olduğunu iddia eden liderleri Yunus ibn İlyas tarafından icat edilen bir dine dayalı bir devlet kurdular. Nesiller boyu bu dine bağlı kaldılar ve arkalarındaki Zenata, Sanhaja ve Mervaniler krallarına karşı savaştılar. Buluggin ibn Ziri ve Emevi kralları, devletleri yıkılana kadar çabalarını sürdürdüler ve izleri, Almoravid devletine kadar kıyı kabilelerinde kaldı."
  id: "Suku Barghawata adalah cabang dari suku Masmuda. Tanah asal mereka adalah pesisir Maghreb bagian jauh di Tamasna dan sekitarnya. Pada akhir era pra-Islam, mereka mendirikan sebuah negara berdasarkan agama yang diciptakan oleh pemimpin mereka, Yunus ibn Ilyas, yang mengklaim sebagai nabi dan pembuat undang-undang. Generasi demi generasi menganut agama tersebut dan berjuang melawan raja-raja Zenata, Sanhaja, dan Marwanid yang berada di belakang mereka. Buluggin ibn Ziri dan raja-raja Umayyah mengerahkan upaya mereka hingga negara mereka runtuh, dan jejak mereka tetap ada di suku-suku pesisir hingga negara Almoravid."
