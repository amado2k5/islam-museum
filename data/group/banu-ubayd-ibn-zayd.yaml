summary:
  ar: "فرع من بني عمرو بن عوف؛ منه خذام بن خالد الذي أُخرج مسجد الشقاق من داره بحسب ابن إسحاق."
  en: A branch of Banu Amr ibn Awf; from it was Khudham ibn Khalid, from whose house Masjid al-Shiqaq was removed, according to Ibn Ishaq.
  es: "Una rama de Banu Amr ibn Awf; de ella descendió Khudham ibn Khalid, de cuya casa se trasladó la mezquita al-Shiqaq, según Ibn Ishaq."
  fr: "Une branche de Banu Amr ibn Awf; de cette branche est issu Khudham ibn Khalid, de la maison duquel la mosquée al-Shiqaq a été déplacée, selon Ibn Ishaq."
  ur: "بنو عمرو بن عوف کی ایک شاخ؛ ابن اسحاق کے مطابق اس میں سے خدام بن خالد تھے جن کے گھر سے مسجد الشیق کو ہٹا دیا گیا تھا۔"
  tr: "Beni Amr ibn Awf'ın bir kolu; aralarında, İbn İshak'a göre Fitne Mescidi'nin kaldırıldığı Hatim ibn Halid de vardı."
  id: "Salah satu cabang dari Bani Amr ibn Awf; di antara mereka adalah Khadham ibn Khalid, dari rumahnyalah Masjid Perselisihan dipindahkan, menurut Ibnu Ishaq."
