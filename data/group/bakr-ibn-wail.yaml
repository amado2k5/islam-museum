label: { ar: "بكر بن وائل", en: "Bakr ibn Wa'il", es: "Bakr ibn Wa'il", fr: "Bakr ibn Wa'il", ur: "بکر بن وائل" }
summary:
  ar: "قبيلة ربعية عدنانية، أحد ابني وائل مع تغلب؛ أقامت بطون منها بالبحرين، وسائرها في طول الأرض من اليمامة إلى البحرين إلى كاظمة فأطراف سواد العراق فالأبلة فهيت؛ منها بنو شيبان أصحاب يوم ذي قار، وبنو حنيفة باليمامة، وكانت حروبها مع تغلب مثلاً على تنافس الأقارب."
  en: "A Rabi'a tribe of Adnan, one of Wa'il's two sons with Taghlib; branches settled Bahrayn and the rest stretched from al-Yamama to Bahrayn, Kazima, the edge of the Iraqi sawad, al-Ubulla and Hit; Banu Shayban of Dhu Qar and Banu Hanifa of al-Yamama belong to it, and its wars with Taghlib are the textbook case of kin rivalry."
  es: "Una tribu Rabi'a de Adnan, uno de los dos hijos de Wa'il con Taghlib; algunas ramas se asentaron en Bahrayn y el resto se extendió desde al-Yamama hasta Bahrayn, Kazima, el borde del sawad iraquí, al-Ubulla y Hit; a ella pertenecen los Banu Shayban de Dhu Qar y los Banu Hanifa de al-Yamama, y sus guerras con Taghlib son el ejemplo clásico de rivalidad entre parientes."
  fr: "Une tribu Rabi'a d'Adnan, l'un des deux fils de Wa'il avec Taghlib; des branches s'établirent à Bahrayn et le reste s'étendait d'al-Yamama à Bahrayn, Kazima, la limite du sawad irakien, al-Ubulla et Hit; les Banu Shayban de Dhu Qar et les Banu Hanifa d'al-Yamama lui appartiennent, et ses guerres avec Taghlib sont le cas d'école de la rivalité familiale."
  ur: "عدنان کا ربیعہ قبیلہ، وائل کے دو بیٹوں میں سے ایک تغلب کے ساتھ؛ شاخوں نے بحرین کو آباد کیا اور بقیہ ال یمامہ سے بحرین، کاظیمہ، عراقی سواد کے کنارے، العبولہ اور ہٹ تک پھیلی ہوئی ہیں۔ ذو قار کے بنو شیبان اور یمامہ کے بنو حنیفہ اس سے تعلق رکھتے ہیں اور اس کی تغلب کے ساتھ جنگیں رشتہ داروں کی دشمنی کا درسی کیس ہے۔"
