label: { ar: "بكر بن وائل", en: "Bakr ibn Wa'il" }
summary:
  ar: "قبيلة ربعية عدنانية، أحد ابني وائل مع تغلب؛ أقامت بطون منها بالبحرين، وسائرها في طول الأرض من اليمامة إلى البحرين إلى كاظمة فأطراف سواد العراق فالأبلة فهيت؛ منها بنو شيبان أصحاب يوم ذي قار، وبنو حنيفة باليمامة، وكانت حروبها مع تغلب مثلاً على تنافس الأقارب."
  en: "A Rabi'a tribe of Adnan, one of Wa'il's two sons with Taghlib; branches settled Bahrayn and the rest stretched from al-Yamama to Bahrayn, Kazima, the edge of the Iraqi sawad, al-Ubulla and Hit; Banu Shayban of Dhu Qar and Banu Hanifa of al-Yamama belong to it, and its wars with Taghlib are the textbook case of kin rivalry."
