summary:
  ar: "الطبقة الأولى في تقسيم المؤرخين لأقوام العرب: الأمم القديمة التي لم يصل من أخبارها إلا القليل، مثل عاد وثمود وطسم وجديس وعمليق."
  en: "The first of the historians’ three divisions of the Arabs: the ancient peoples of whom little survives, such as Ad, Thamud, Tasm, Jadis and the Amaliq."
  es: "La primera de las tres divisiones que hacen los historiadores de los árabes: los pueblos antiguos de los que poco se conserva, como los Ad, Thamud, Tasm, Jadis y los Amaliq."
  fr: "La première des trois divisions des Arabes selon les historiens: les peuples anciens dont il ne reste que peu de traces, tels que les Ad, les Thamud, les Tasm, les Jadis et les Amaliq."
  ur: "تاریخ دانوں کی عربوں کی تین تقسیموں میں سے پہلی: قدیم قومیں جن میں سے بہت کم بچ گئے ہیں، جیسے عاد، ثمود، تسم، جدّ اور عمالیق۔"
  tr: "Tarihçilerin Arap halklarını sınıflandırmasında ilk kategori, hakkında çok az bilgiye ulaştığımız eski milletlerdir; bunlar arasında Ad, Semud, Tasm, Cedis ve Amalek bulunur."
  id: "Kategori pertama dalam pembagian bangsa Arab oleh para sejarawan: bangsa-bangsa kuno yang sedikit sekali informasinya sampai kepada kita, seperti Ad, Thamud, Tasm, Jadis, dan Amalek."
