summary:
  ar: "أنمار بن نزار بن معد — وقيل أغار — قسم له أبوه البدرة والمجلس ففسرها الأفعى بالرقة والحرث والأرض، وكان في المفازة صاحب نعت البعير الأبتر لرؤيته بعره مجتمعاً، وبعد أن فقع عين أخيه مضر بعظم ركب بعيراً من كرائم الإبل فلحق بديار اليمن وإليه تنسب بجيلة وخثعم على قول {cite:muruj-al-dhahab p. 431-435}."
  en: "Son of Nizar allotted the coin-bag and council-seat — read as tillage and land — who named the lost camel tailless from its droppings; after putting out Mudar's eye he rode to Yemen, whence Bajila and Khath'am claim descent {cite:muruj-al-dhahab p. 431-435}."
  es: "El hijo de Nizar asignó la bolsa de monedas y el asiento del consejo —léase como tierras de cultivo y tierras— quien nombró al camello perdido sin cola por sus excrementos; después de sacarle el ojo a Mudar, cabalgó hasta Yemen, de donde Bajila y Khath'am afirman descender {cite:muruj-al-dhahab p. 431-435}."
  fr: "Le fils de Nizar attribua la bourse et le siège du conseil — à lire comme labour et terre — qui nomma le chameau perdu sans queue d'après ses excréments; après avoir crevé l'œil de Mudar, il chevaucha jusqu'au Yémen, d'où Bajila et Khath'am prétendent descendre {cite:muruj-al-dhahab p. 431-435}."
  ur: "نزار کے بیٹے نے سکے کا تھیلا اور کونسل کی نشست الاٹ کی — جسے کھیتی اور زمین کے طور پر پڑھا جاتا ہے — جس نے گمشدہ اونٹ کا نام اس کے قطرے سے رکھا۔ مدر کی آنکھ نکالنے کے بعد وہ یمن کی طرف روانہ ہوا، جہاں سے بجیلہ اور خثعم نزول کا دعویٰ کرتے ہیں۔ 431-435}۔"
  tr: "Anmar bin Nizar bin Maad — ve Aghar denildiğine göre babası onun için keseyi ve meclisi paylaştırdı ve yılan bunu şefkat, tarım ve toprak olarak yorumladı. Çöldeydi, kuyruksuz deveyi tarif eden kişiydi çünkü dışkılarının bir araya toplandığını görmüştü. Kardeşi Mudar'ın gözünü bir kemikle oyarak çıkardıktan sonra, en güzel develerden birine binip Yemen topraklarına katıldı. {cite:muruj-al-dhahab s. 431-435} sözüne göre Bajila ve Khath'am ona atfedilir."
  id: "Anmar bin Nizar bin Maad — dan dikatakan Aghar — ayahnya membagi harta dan dewan untuknya, dan ular menafsirkannya sebagai kelembutan, pertanian, dan tanah. Dia berada di padang pasir, orang yang menggambarkan unta tanpa ekor karena dia melihat kotorannya terkumpul. Setelah dia mencungkil mata saudaranya Mudar dengan tulang, dia menunggang unta dari unta-unta terbaik dan menyatukan tanah Yaman. Bajila dan Khath'am dikaitkan kepadanya, menurut ucapan {kutip:muruj-al-dhahab hlm. 431-435}."
