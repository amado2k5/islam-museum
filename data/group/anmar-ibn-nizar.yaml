summary:
  ar: "أنمار بن نزار بن معد — وقيل أغار — قسم له أبوه البدرة والمجلس ففسرها الأفعى بالرقة والحرث والأرض، وكان في المفازة صاحب نعت البعير الأبتر لرؤيته بعره مجتمعاً، وبعد أن فقع عين أخيه مضر بعظم ركب بعيراً من كرائم الإبل فلحق بديار اليمن وإليه تنسب بجيلة وخثعم على قول {cite:muruj-al-dhahab p. 431-435}."
  en: "Son of Nizar allotted the coin-bag and council-seat — read as tillage and land — who named the lost camel tailless from its droppings; after putting out Mudar's eye he rode to Yemen, whence Bajila and Khath'am claim descent {cite:muruj-al-dhahab p. 431-435}."
