summary:
  ar: "بنو همدان بن مالك بن زيد بن أوسلة بن ربيعة بن الخيار بن مالك بن زيد بن كهلان بن سبأ؛ من أعظم قبائل قحطان باليمن، منهم بطون هاشم وبكيل وأرحب وشاكر ويهاجر وذو القرن الأصبحي? لا؛ ومن همدان الأقيال ملوك اليمن قبل الإسلام وأهل صنعاء {cite:mubarakpuri-raheeq p.16-17} {cite:tarikh-al-tabari} {cite:muruj-al-dhahab}."
  en: "Banu Hamdan ibn Malik ibn Zayd ibn Awsala, of the Saba line — one of the greatest Qahtani tribes of Yemen, with the clans Hashim, Bakil, Arhab, Shakir and Yahajir; from Hamdan came the aqyal kings of Yemen and the people of San'a {cite:mubarakpuri-raheeq p.16-17} {cite:tarikh-al-tabari} {cite:muruj-al-dhahab}."
