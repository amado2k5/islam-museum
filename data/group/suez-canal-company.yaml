label: { ar: "شركة قناة السويس", en: "Suez Canal Company", ur: "نہرِ سویز کمپنی" }
summary:
  ar: "الشركة التي بنت قناة السويس وملكتها وأدارتها حتى تأميمها. تأسست في باريس سنة 1858 بدعم من نابليون الثالث بعد ثلاث سنوات من جمع الأموال والخلافات السياسية، واشترى مستثمرون فرنسيون أكثر من نصف أسهمها، وكان سعيد باشا قد أخذ في الأصل 21 في المئة منها. بلغت كلفة الحفر نحو 19 مليون جنيه إسترليني حين افتُتحت القناة في 1869م، وكان في بورسعيد مقرها. وباع الخديوي إسماعيل أسهمه لبريطانيا، وأممت الحكومة المصرية القناة في 26 تموز 1956م {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}."
  en: "The company that built, owned and ran the Suez Canal until its nationalisation. Founded in Paris in 1858 with Napoleon III's support after three years of fund-raising and political quarrels, it came to be more than half owned by French investors; Sa'id Pasha had originally taken 21 per cent of the shares. Digging cost about 19 million pounds sterling when the canal opened in 1869, and its headquarters stood in Port Said. Khedive Isma'il was forced to sell his shares to the British government, and the Egyptian government nationalised the canal on 26 July 1956 {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}."
  ur: "وہ کمپنی جس نے نہرِ سویز بنائی اور قومیائے جانے تک اس کی مالک اور منتظم رہی۔ یہ 1858ء میں پیرس میں نپولین سوم کی حمایت سے تین سال کی چندہ جمع کرنے اور سیاسی کشمکش کے بعد قائم ہوئی؛ اس کے آدھے سے زیادہ حصص فرانسیسی سرمایہ کاروں نے خرید لیے، جب کہ سعید پاشا نے اصلاً اکیس فیصد لیے تھے۔ 1869ء میں نہر کھلنے تک کھدائی پر تقریباً 19 ملین پاؤنڈ خرچ ہوئے، اور اس کا صدر دفتر بورسعید میں تھا۔ خدیو اسماعیل کو اپنے حصص برطانوی حکومت کو بیچنا پڑے، اور مصری حکومت نے 26 جولائی 1956ء کو نہر قومیا لی {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}۔"
