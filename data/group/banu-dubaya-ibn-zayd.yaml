summary:
  ar: "عشيرة نسب إليها ابن إسحاق خمسة من بُناة مسجد الضرار: معتب بن قشير وأبو حبيبة بن الأزعر ونبتل بن الحارث وبحزج وبجاد بن عثمان."
  en: "A clan to which Ibn Ishaq ascribes five of the builders of Masjid al-Dirar: Mu'tib ibn Qushayr, Abu Habiba ibn al-Az'ar, Nabtal ibn al-Harith, Bahzaj and Bijad ibn Uthman."
  es: "Un clan al que Ibn Ishaq atribuye a cinco de los constructores de Masjid al-Dirar: Mu'tib ibn Qushayr, Abu Habiba ibn al-Az'ar, Nabtal ibn al-Harith, Bahzaj y Bijad ibn Uthman."
  fr: "Un clan auquel Ibn Ishaq attribue cinq des bâtisseurs de Masjid al-Dirar: Mu'tib ibn Qushayr, Abu Habiba ibn al-Az'ar, Nabtal ibn al-Harith, Bahzaj et Bijad ibn Uthman."
  ur: "ایک قبیلہ جس کی طرف ابن اسحاق نے مسجد الدیر کے بنانے والوں میں سے پانچ کو منسوب کیا ہے: مطیب ابن قشیر، ابو حبیبہ ابن الاثار، نبتل ابن حارث، بہزاج اور بیجاد ابن عثمان۔"
  tr: "İbn İshak'ın, Mescid-i Nezareti'nin inşaatçılarından beşini atfettiği kabile: Mu'tab bin Kuşeyr, Ebu Habibah bin El-Az'ar, Nabtal bin El-Haris, Bahzaj ve Bajad bin Osman."
  id: "Marga yang mana Ibn Ishaq mengaitkan lima pembangun Masjid Pertikaian: Mu’tab bin Qushayr, Abu Habibah bin Al-Az’ar, Nabtal bin Al-Harits, Bahzaj, dan Bajad bin Utsman."
