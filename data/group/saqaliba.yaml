label: { ar: "الصقالبة", en: "The Slavs (Saqaliba)", es: "Los eslavos (Saqaliba)", fr: "Les Slaves (Saqaliba)", ur: "سلاو ⁦(ثقلیبہ)⁩", tr: "Slavlar", id: "orang Slavia" }
summary:
  ar: "أمم يقول المسعودي إن أهل الدراية يجعلونهم من ولد مار بن يافث بن نوح، مساكنهم بالجدي إلى أن يتصلوا بالمغرب، أجناس مختلفة بينهم حروب ولهم ملوك، منهم من ينقاد إلى النصرانية على رأي اليعقوبية ومنهم جاهلية لا يعرفون شيئاً من الشرائع، ومن أجناسهم ولينانا وكان ملكهم قديماً يدعى ماجك وكان يتلوهم سائر الصقالبة لكون الملك فيهم، ثم اصطبرانة وملكهم بصفلائح، ودلاونة وملكهم وانج علاف، ونامجين وملكهم عزانة وهو أشجع أجناسهم وأفرسهم، ومنابن وملكهم زنبير، وسرتين جنس مهيب يحرقون أنفسهم بالنار إذا مات فيهم الملك ويحرقون دوابه لهم أفعال مثل أفعال الهند، وصاصين وجروانيق وخشانين وبرانجابين، ومن ملوكهم ملك الدير وله مدن يقصدها تجار المسلمين، وملك الأوانج يحارب الروم والإفرنج والنوكبرد، وملك الترك وهم أحسن الصقالبة صوراً وأكثرهم عدداً وأشدهم بأساً {cite:muruj-al-dhahab p. 355-356}. وكانت في ديارهم بيوت تعظمها منها بيت في جبل من أعلى جبال العالم له مخاريق مصنوعة يطلع فيها الشمس وفيه جواهر وآثار مرسومة تنذر بالأحداث قبل كونها، وبيت اتخذه بعض ملوكهم على الجبل الأسود تحيط به مياه ذوات ألوان وطعوم مختلفة وكان فيه صنم عظيم على صورة شيخ بيده عصا يحرك بها عظام الموتى وتحت رجله اليمنى صور النمل وتحت الأخرى غرابيب سود، وبيت على جبل يحيط به خليج من البحر بني بأحجار المرجان الأحمر والزمرد الأخضر في وسطه قبة تحتها صنم أعضاؤه من جواهر أربعة ورأسه من الذهب وبازائه صنم على صورة جارية {cite:muruj-al-dhahab p. 543}"
  en: "al-Mas'udi's Slavs — Japhetic peoples of the northern clime reaching toward the Maghrib: the Walinana whose ancient king Majak once held sway over all, then the Istabrana, Dulawa, Namujin (bravest horsemen), Manabin, the dreaded Sartin who burn themselves and their mounts on a king's pyre like the Indians, Sasin, Jurwaniq, Khashanin and Branjabin; kings of his day include the king of al-Dayr whose towns Muslim merchants visit, the king of the Awanj who wars on Romans, Franks and Nukaburd, and the 'king of the Turk', fairest and fiercest of them {cite:muruj-al-dhahab p. 355-356}."
  es: "Los eslavos de al-Mas'udi — pueblos jaféticos del clima septentrional que se extienden hacia el Magreb: los Walinana, cuyo antiguo rey Majak alguna vez tuvo dominio sobre todos, luego los Istabrana, Dulawa, Namujin (los jinetes más valientes), Manabin, los temidos Sartin que se queman a sí mismos y a sus monturas en la pira de un rey como los indios, Sasin, Jurwaniq, Khashanin y Branjabin; los reyes de su época incluyen al rey de al-Dayr, cuyas ciudades visitan los mercaderes musulmanes, el rey de los Awanj que guerrea contra los romanos, los francos y Nukaburd, y el 'rey del turco', el más hermoso y feroz de ellos {cite:muruj-al-dhahab p. 355-356}."
  fr: "Les Slaves d'al-Mas'udi — peuples japhétiques du climat septentrional s'étendant vers le Maghreb: les Walinana dont l'ancien roi Majak régnait autrefois sur tout, puis les Istabrana, Dulawa, Namujin (les cavaliers les plus braves), Manabin, les redoutables Sartin qui s'immolent avec leurs montures sur le bûcher royal comme les Indiens, Sasin, Jurwaniq, Khashanin et Branjabin; parmi les rois de son époque figurent le roi d'al-Dayr dont les villes sont visitées par les marchands musulmans, le roi des Awanj qui fait la guerre aux Romains, aux Francs et aux Nukaburd, et le « roi des Turcs », le plus beau et le plus féroce d'entre eux {cite: muruj-al-dhahab p. 355-356}."
  ur: "المسعودی کے غلام - مغرب کی طرف پہنچنے والے شمالی آب و ہوا کے جاپتی لوگ: والینا جس کے قدیم بادشاہ ماجک نے کبھی سب پر غلبہ حاصل کیا تھا، پھر استبرانہ، دولاوا، نموجین ⁦(بہادر ترین گھڑ سوار)⁩، منابین، خوفناک سارٹن جو اپنے آپ کو اور ان کے سواروں کو جلا رہے ہیں، ہندوستانی سپاہیوں کی طرح، ساقیوں پر سوار۔ خشانین اور برنجابین؛ اس کے دور کے بادشاہوں میں الدیر کا بادشاہ شامل ہے جس کے شہروں میں مسلمان تاجر آتے ہیں، اونج کا بادشاہ جو رومیوں، فرینکوں اور نوکبرد سے جنگ کرتا ہے، اور 'ترک کا بادشاہ'، ان میں سے سب سے خوبصورت اور سخت گیر۔ 355-356}۔"
  tr: "El-Mas'udi, âlimlerin onları Mar ibn Yafith ibn Nuh'un soyundan saydığını söyler. Yerleşim yerleri Nil Vadisi'nden Mağrip'e kadar uzanır. Farklı ırklardan olup savaşlarla uğraşırlar ve kralları vardır. Bazıları Yakubi mezhebine göre Hristiyanlığı takip ederken, diğerleri putperesttir ve kanunlardan habersizdir. Irkları arasında, eski kralları Majak olan ve tüm Slavların takip ettiği Welinana bulunur; çünkü krallık onların saflarındaydı. Sonra, kralları Safala'ih olan İstabranana; kralları Wanj 'Allaf olan Dalawna; kralları Azana olan ve ırklarının en cesur ve yeteneklisi olan Namjin; kralları Zanbir olan Manabin; ve kralları öldüğünde kendilerini ve hayvanlarını yakarak diri diri yakan, güçlü bir ırk olan Sartin vardır. Hintlilerinkine benzer adetleri vardır. Ayrıca Sasin, Jarwaniq, Khashanin ve Baranjabin de vardır. Kralları arasında, Müslüman tüccarların sıkça uğradığı şehirlere sahip olan Manastır Kralı da vardır. Ayrıca Romalılara, Franklara ve Nokberdlere karşı savaşan Awanj Kralı da vardır. Ve Slavların en yakışıklısı ve en kalabalık olanı, aynı zamanda en güçlüsü olan Türklerin Kralı da vardır. {cite:muruj-al-dhahab s. 355-356} Ve onların topraklarında, saygı duydukları evler vardı; bunlardan biri, dünyanın en yüksek dağlarından birinde bulunan, güneşin doğduğu tuzaklar kurmuş, içinde olayları gerçekleşmeden önce bildiren mücevherler ve boyalı eserler bulunan bir evdi; bir diğeri ise, krallarından birinin Kara Dağ'da, çeşitli renk ve tatlardaki sularla çevrili olarak inşa ettirdiği, içinde elinde bir asa tutan ve ölülerin kemiklerini hareket ettiren yaşlı bir adam şeklinde büyük bir put bulunan bir evdi; sağ ayağının altında karınca resimleri, diğer ayağının altında ise kara kargalar vardı; bir diğeri ise, denizin körfeziyle çevrili bir dağda, kırmızı mercan ve yeşil zümrüt taşlarından yapılmış, ortasında kubbesi olan, uzuvları dört mücevherden, başı altından bir put bulunan ve karşısında da bir cariye şeklinde bir put bulunan bir evdi. {Kaynak: Muruj-al-Dhahab s. 543}"
  id: "Al-Mas'udi mengatakan bahwa para cendekiawan menganggap mereka sebagai keturunan Mar ibn Yafith ibn Noah. Tempat tinggal mereka berada di Lembah Nil hingga mencapai Maghreb. Mereka berasal dari berbagai ras, terlibat dalam peperangan, dan memiliki raja. Sebagian dari mereka menganut agama Kristen menurut doktrin Yakobit, sementara yang lain menganut paganisme dan tidak mengetahui hukum-hukum agama. Di antara ras mereka terdapat Welinana, yang raja kunonya bernama Majak, dan semua bangsa Slavia mengikuti mereka karena kekuasaan raja berada di antara mereka. Kemudian ada Istabrana, yang rajanya adalah Safala'ih; Dalawna, yang rajanya adalah Wanj 'Allaf; Namjin, yang rajanya adalah 'Azana, yang paling berani dan terampil di antara ras mereka; Manabin, yang rajanya adalah Zanbir; dan Sartin, sebuah ras yang tangguh yang membakar diri mereka sendiri hidup-hidup ketika raja mereka meninggal dan membakar hewan-hewannya. Mereka memiliki adat istiadat yang mirip dengan adat istiadat orang India. Ada juga Sasin, Jarwaniq, Khashanin, dan Baranjabin. Di antara raja-raja mereka terdapat Raja Biara, yang memiliki kota-kota yang sering dikunjungi oleh pedagang Muslim. Ada juga Raja Awanj, yang berperang melawan Romawi, Frank, dan Nokberd. Dan ada Raja Turki, yang merupakan bangsa Slavia yang paling tampan dan paling banyak jumlahnya. Dan yang paling kuat di antara mereka {cite:muruj-al-dhahab p. 355-356}. Dan di tanah mereka terdapat rumah-rumah yang mereka hormati, termasuk sebuah rumah di salah satu gunung tertinggi di dunia, yang memiliki perangkap buatan yang dapat menangkap matahari terbit, dan di dalamnya terdapat permata dan artefak bercat yang meramalkan peristiwa sebelum terjadi, dan sebuah rumah yang dibangun oleh salah satu raja mereka di Gunung Hitam, dikelilingi oleh perairan dengan berbagai warna dan rasa, dan di dalamnya terdapat sebuah patung besar berbentuk seorang lelaki tua dengan tongkat di tangannya yang digunakan untuk memindahkan tulang-tulang orang mati, dan di bawah kaki kanannya terdapat gambar semut dan di bawah kaki kirinya terdapat burung gagak hitam, dan sebuah rumah di gunung yang dikelilingi oleh teluk laut, dibangun dengan batu karang merah dan zamrud hijau, di tengahnya terdapat kubah di bawahnya terdapat sebuah patung yang anggota tubuhnya terbuat dari empat permata dan kepalanya dari emas, dan di seberangnya terdapat sebuah patung berbentuk seorang budak perempuan {cite:muruj-al-dhahab p. 543}"
