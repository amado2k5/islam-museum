label: { ar: "الصقالبة", en: "The Slavs (Saqaliba)" }
summary:
  ar: "أمم يقول المسعودي إن أهل الدراية يجعلونهم من ولد مار بن يافث بن نوح، مساكنهم بالجدي إلى أن يتصلوا بالمغرب، أجناس مختلفة بينهم حروب ولهم ملوك، منهم من ينقاد إلى النصرانية على رأي اليعقوبية ومنهم جاهلية لا يعرفون شيئاً من الشرائع، ومن أجناسهم ولينانا وكان ملكهم قديماً يدعى ماجك وكان يتلوهم سائر الصقالبة لكون الملك فيهم، ثم اصطبرانة وملكهم بصفلائح، ودلاونة وملكهم وانج علاف، ونامجين وملكهم عزانة وهو أشجع أجناسهم وأفرسهم، ومنابن وملكهم زنبير، وسرتين جنس مهيب يحرقون أنفسهم بالنار إذا مات فيهم الملك ويحرقون دوابه لهم أفعال مثل أفعال الهند، وصاصين وجروانيق وخشانين وبرانجابين، ومن ملوكهم ملك الدير وله مدن يقصدها تجار المسلمين، وملك الأوانج يحارب الروم والإفرنج والنوكبرد، وملك الترك وهم أحسن الصقالبة صوراً وأكثرهم عدداً وأشدهم بأساً {cite:muruj-al-dhahab p. 355-356}. وكانت في ديارهم بيوت تعظمها منها بيت في جبل من أعلى جبال العالم له مخاريق مصنوعة يطلع فيها الشمس وفيه جواهر وآثار مرسومة تنذر بالأحداث قبل كونها، وبيت اتخذه بعض ملوكهم على الجبل الأسود تحيط به مياه ذوات ألوان وطعوم مختلفة وكان فيه صنم عظيم على صورة شيخ بيده عصا يحرك بها عظام الموتى وتحت رجله اليمنى صور النمل وتحت الأخرى غرابيب سود، وبيت على جبل يحيط به خليج من البحر بني بأحجار المرجان الأحمر والزمرد الأخضر في وسطه قبة تحتها صنم أعضاؤه من جواهر أربعة ورأسه من الذهب وبازائه صنم على صورة جارية {cite:muruj-al-dhahab p. 543}"
  en: "al-Mas'udi's Slavs — Japhetic peoples of the northern clime reaching toward the Maghrib: the Walinana whose ancient king Majak once held sway over all, then the Istabrana, Dulawa, Namujin (bravest horsemen), Manabin, the dreaded Sartin who burn themselves and their mounts on a king's pyre like the Indians, Sasin, Jurwaniq, Khashanin and Branjabin; kings of his day include the king of al-Dayr whose towns Muslim merchants visit, the king of the Awanj who wars on Romans, Franks and Nukaburd, and the 'king of the Turk', fairest and fiercest of them {cite:muruj-al-dhahab p. 355-356}."
