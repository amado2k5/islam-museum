label: { ar: "السامرة", en: "The Samaritans", es: "Los samaritanos", fr: "Les Samaritains", ur: "سامری" }
summary:
  ar: "السامرة عند البلاذري «يهود، وهم صنفان: صنف يقال لهم الدستان، وصنف يقال لهم الكوشان»؛ صالحهم أبو عبيدة بالأردن وفلسطين على أن يكونوا عيوناً وأدلاء للمسلمين على جزية رؤوسهم وإطمام أرضهم، فوضع يزيد بن معاوية الخراج على أراضيهم وجعل على الرأس خمسة دنانير؛ ودخلت أرضوهم في ضياع الخلافة بعد طاعون الرشيد الجارف ورفع عنهم شيء من الخراج سنة 246. ويذكر ابن حزم في الملل أن اليهود افترقوا عنده على خمس فرق السامرية أولها، فيقول إنهم يزعمون أن بيت المقدس نابلس على ثمانية عشر ميلاً منه، وأن لهم توراة غير التي بأيدي سائر اليهود، ويبطلون كل نبوة بعد موسى ويوشع، ولا يقرون بالبعث ألبتة، وهم بالشام لا يستحلون الخروج عنها {cite:fisal-ibn-hazm-kotobarabia p. 184-185}"
  en: "The Samaritans — in al-Baladhuri 'Jews, of two sects: one called the Dustan and one called the Kushan'; Abu Ubayda compounded with them in the Jordan and Filastin districts to serve as scouts and guides for the Muslims, against head-jizya with their land exempted; Yazid ibn Mu'awiya later laid kharaj on their lands at five dinars a head; their lands entered the crown estates after al-Rashid's sweeping plague, and a portion of their kharaj was remitted in year 246. Ibn Hazm counts five Jewish sects in al-Milal, the Samaritans first among them; he reports that they hold Jerusalem to be Nablus some eighteen miles from Bayt al-Maqdis, have a Torah other than the one in the hands of the rest of the Jews, reject every prophecy after Moses and Joshua, and do not affirm resurrection at all, dwelling in Syria and not venturing beyond it {cite:fisal-ibn-hazm-kotobarabia p. 184-185}"
  es: "Los samaritanos — en al-Baladhuri 'judíos, de dos sectas: una llamada Dustan y otra llamada Kushan'; Abu Ubayda se asoció con ellos en los distritos de Jordania y Filastin para servir como exploradores y guías para los musulmanes, a cambio de la jizya de cabeza y con sus tierras exentas; Yazid ibn Mu'awiya más tarde impuso un kharaj sobre sus tierras a cinco dinares por cabeza; sus tierras pasaron a formar parte de las propiedades de la corona después de la plaga devastadora de al-Rashid, y una parte de su kharaj fue condonada en el año 246. Ibn Hazm cuenta cinco sectas judías en al-Milal, siendo los samaritanos la primera entre ellas; Según relata, consideran que Jerusalén es Nablus, a unos dieciocho kilómetros de Bayt al-Maqdis, poseen una Torá distinta a la que tienen los demás judíos, rechazan toda profecía posterior a Moisés y Josué, y no afirman la resurrección en absoluto, residiendo en Siria y sin aventurarse más allá de ella {cite:fisal-ibn-hazm-kotobarabia p. 184-185}."
  fr: "Les Samaritains — mentionnés dans al-Baladhuri comme des Juifs de deux sectes: l’une appelée les Dustan et l’autre les Kushan; Abu Ubayda s’allia avec eux dans les districts de Jordan et de Filastin pour servir d’éclaireurs et de guides aux musulmans, en échange d’une exemption de jizya sur leurs terres; Yazid ibn Mu’awiya imposa plus tard un kharaj sur leurs terres à hauteur de cinq dinars par personne; leurs terres entrèrent dans le domaine de la couronne après la peste dévastatrice d’al-Rashid, et une partie de leur kharaj fut remise en l’an 246. Ibn Hazm recense cinq sectes juives dans al-Milal, les Samaritains étant les premiers d’entre eux; Il rapporte qu'ils situent Jérusalem à Naplouse, à environ dix-huit milles de Bayt al-Maqdis, qu'ils possèdent une Torah différente de celle en possession du reste des Juifs, qu'ils rejettent toutes les prophéties postérieures à Moïse et Josué, et qu'ils n'affirment pas du tout la résurrection, résidant en Syrie et ne s'aventurant pas au-delà {cite:fisal-ibn-hazm-kotobarabia p. 184-185}"
  ur: "سامری — البلادھوری میں یہودیوں کے دو فرقے ہیں: ایک کو دستان کہتے ہیں اور ایک کوشان کہتے ہیں۔ ابو عبیدہ نے اردن اور فلاسطین کے اضلاع میں ان کے ساتھ مل کر مسلمانوں کے لیے اسکاؤٹس اور گائیڈ کے طور پر کام کیا، ان کی زمین کے ساتھ سر پر جزیہ کے خلاف؛ یزید بن معاویہ نے بعد میں ان کی زمینوں پر پانچ دینار فی سر کے حساب سے خزرج ڈالا۔ الرشید کے بڑے طاعون کے بعد ان کی زمینیں تاج کی جاگیر میں داخل ہوئیں، اور ان کے خوارج کا ایک حصہ سال 246 میں معاف کر دیا گیا۔ ابن حزم نے المال میں پانچ یہودی فرقوں کو شمار کیا، ان میں سامری سب سے پہلے۔ وہ بتاتے ہیں کہ وہ یروشلم کو بیت المقدس سے اٹھارہ میل کے فاصلے پر نابلس سمجھتے ہیں، باقی یہودیوں کے ہاتھ میں تورات کے علاوہ ایک توریت ہے، موسیٰ اور یشوع کے بعد کی ہر پیشین گوئی کو رد کرتے ہیں، اور ہر گز قیامت کا اقرار نہیں کرتے، شام میں رہتے ہیں اور اس سے آگے بڑھنے کی کوشش نہیں کرتے۔ 184-185}"
