label: { ar: "السامرة", en: "The Samaritans" }
summary:
  ar: "السامرة عند البلاذري «يهود، وهم صنفان: صنف يقال لهم الدستان، وصنف يقال لهم الكوشان»؛ صالحهم أبو عبيدة بالأردن وفلسطين على أن يكونوا عيوناً وأدلاء للمسلمين على جزية رؤوسهم وإطمام أرضهم، فوضع يزيد بن معاوية الخراج على أراضيهم وجعل على الرأس خمسة دنانير؛ ودخلت أرضوهم في ضياع الخلافة بعد طاعون الرشيد الجارف ورفع عنهم شيء من الخراج سنة 246."
  en: "The Samaritans — in al-Baladhuri 'Jews, of two sects: one called the Dustan and one called the Kushan'; Abu Ubayda compounded with them in the Jordan and Filastin districts to serve as scouts and guides for the Muslims, against head-jizya with their land exempted; Yazid ibn Mu'awiya later laid kharaj on their lands at five dinars a head; their lands entered the crown estates after al-Rashid's sweeping plague, and a portion of their kharaj was remitted in year 246."
