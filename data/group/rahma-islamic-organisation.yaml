label: { ar: "منظمة الرحمة الإسلامية", en: "Rahma Islamic Organisation", ur: "رحمہ اسلامی تنظیم", es: "Organización Islámica Rahma", fr: "Organisation islamique Rahma", tr: "İslami Merhamet Teşkilatı", id: "Organisasi Kebaikan Islam" }
summary:
  ar: "منظمة دعوة شارع إثيوبية تنشر مقاطع الوعظ العلني في مدن إثيوبية بالأمهرية؛ بلغ عدد متابعي صفحتها على فيسبوك — واسمها «ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ» — نحو 240 ألفًا بحسب بيانات وصفية لمنشور على فيسبوك مؤرخ في 19 يناير 2026 قرأها حصاد الموجة في 7 نوفمبر 2026، وبلغ عدد متابعي حسابها على تيك توك (@rahma_street_daewa_eth) 576,400 متابع عند قراءته في 7 نوفمبر 2026."
  en: "An Ethiopian street-dawah organisation publishing public-preaching videos in Ethiopian cities in Amharic; its Facebook page — named 'ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ' (Rahma Islamic Organisation — Street Dawah) — counted about 240 thousand followers by Facebook post metadata on a post dated 19 January 2026, read by the wave harvest on 7 November 2026, and its TikTok account (@rahma_street_daewa_eth) counted 576,400 followers when read on 7 November 2026."
  ur: "رحمہ اسلامی تنظیم ایتھوپیا کی اسٹریٹ دعوہ تنظیم ہے جو ایتھوپیا کے شہروں میں امہری زبان میں عوامی وعظ کی ویڈیوز شائع کرتی ہے؛ اس کے فیس بک پیج — جس کا نام «ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ» ہے — کے فالوورز کی تعداد 19 جنوری 2026ء کی ایک فیس بک پوسٹ کے میٹا ڈیٹا کے مطابق تقریباً 240 ہزار تھی، جو ویو کے ہارویسٹ نے 7 نومبر 2026ء کو پڑھا، اور اس کے ٹک ٹاک اکاؤنٹ (@rahma_street_daewa_eth) کے فالوورز 7 نومبر 2026ء کو پڑھنے پر 576,400 تھے۔"
  es: "Una organización callejera etíope que publica vídeos de predicación pública en amárico en ciudades etíopes; su página de Facebook, llamada 'ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ' (Organización Islámica Rahma - Street Dawah), contaba con unos 240 mil seguidores según los metadatos de la publicación de Facebook en una publicación del 19 de enero de 2026, leída por la cosecha de olas el 7 noviembre de 2026, y su cuenta de TikTok (@rahma_street_daewa_eth) contaba con 576.400 seguidores cuando se leyó el 7 de noviembre de 2026."
  fr: "Une organisation éthiopienne de dawah de rue publiant des vidéos de prédication publique dans les villes éthiopiennes en amharique; sa page Facebook – nommée « ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ » (Organisation islamique Rahma – Street Dawah) – comptait environ 240 000 abonnés grâce aux métadonnées publiées sur Facebook dans une publication datée du 19 janvier 2026, lue par la vague de récolte sur Le 7 novembre 2026, et son compte TikTok (@rahma_street_daewa_eth) comptait 576 400 abonnés lors de sa lecture le 7 novembre 2026."
  tr: "Etiyopyalı bir sokak vaaz kuruluşu, Amharca'daki Etiyopya şehirlerinde halka açık vaaz videoları yayınlıyor. Hasad Al-Mawja tarafından 7 Kasım'da okunan 19 Ocak 2026 tarihli bir Facebook gönderisinin meta verilerine göre \"ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ\" adlı Facebook sayfasının yaklaşık 240.000 takipçisi vardı. 2026. TikTok hesabı (@rahma_street_daewa_eth), 7 Kasım 2026'da okunduğunda 576.400 takipçiye sahipti."
  id: "Sebuah organisasi dakwah jalanan di Etiopia menerbitkan video dakwah publik di kota-kota Etiopia dalam bahasa Amharik. Halaman Facebook-nya — bernama “ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ” — memiliki sekitar 240.000 pengikut menurut metadata postingan Facebook tertanggal 19 Januari 2026, yang dibaca oleh Hasad Al-Mawja pada 7 November. 2026. Akun TikToknya (@rahma_street_daewa_eth) memiliki 576.400 pengikut saat dibaca pada 7 November 2026."
