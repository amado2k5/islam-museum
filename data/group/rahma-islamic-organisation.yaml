  ur: "رحمہ اسلامی تنظیم ایتھوپیا کی اسٹریٹ دعوہ تنظیم ہے جو ایتھوپیا کے شہروں میں امہری زبان میں عوامی وعظ کی ویڈیوز شائع کرتی ہے؛ اس کے فیس بک پیج — جس کا نام «ራህማ እስላማዊ ድርጅት የጎዳና ደዕዋ» ہے — کے فالوورز کی تعداد 19 جنوری 2026ء کی ایک فیس بک پوسٹ کے میٹا ڈیٹا کے مطابق تقریباً 240 ہزار تھی، جو ویو کے ہارویسٹ نے 7 نومبر 2026ء کو پڑھا، اور اس کے ٹک ٹاک اکاؤنٹ (@rahma_street_daewa_eth) کے فالوورز 7 نومبر 2026ء کو پڑھنے پر 576,400 تھے۔"
