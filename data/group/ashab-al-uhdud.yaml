label:
  ar: "أصحاب الأخدود"
  en: "The People of the Ditch"
  ur: "اصحاب اخدود"
  es: "La gente de la zanja"
summary:
  ar: "أصحاب الأخدود في سورة البروج قوم شقوا خندقاً وأوقعوا فيه النار على المؤمنين فقُتلوا؛ المفسرون يقولون هم ملك حمير ذو نواس وحاشيته الذين أحرقوا نصارى نجران في أخدود النار، وكان ذلك قبل البعثة بجيلين على ما في الطبري والسيرة {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  en: "The People of the Ditch in Surat al-Buruj are those who dug a trench, fed its fire and threw the believers into it. The commentators say they were the Himyarite king Dhu Nuwas and his court, who burned the Christians of Najran in the fire-trench two generations before the Call, as al-Tabari and the Sira record {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
  ur: "اصحابِ اخدود سورۃ بروج میں وہ لوگ ہیں جنہوں نے کھائی کھودی، اس میں آگ بھڑکائی اور مومنین کو اس میں ڈالا؛ مفسرین کہتے ہیں یہ حمیری بادشاہ ذو نواس اور اس کے درباری تھے جنھوں نے دعوت سے دو نسل پہلے نجران کے مسیحیوں کو آگ کے گڑھے میں جلایا جیسا کہ طبری اور سیرت بیان کرتی ہے۔"
  es: "La Gente de la Fosa en Surat al-Buruj son aquellos que cavaron una zanja, alimentaron el fuego y arrojaron a los creyentes a ella. Los comentaristas dicen que fueron el rey himyarita Dhu Nuwas y su corte, quienes quemaron a los cristianos de Najran en la zanja de fuego dos generaciones antes de la Llamada, como registran al-Tabari y la Sira {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira}."
