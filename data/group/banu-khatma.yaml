summary:
  ar: "بطن من الأوس، خطمة هو عبد الله بن جشم بن مالك بن الأوس؛ نزلوا دارهم المعروفة بهم فابتنوا الآطام وغرسوا النخيل، وكانوا متفرقين في آطامهم لا يسكن قصبة دارهم أحد، حتى جاء الإسلام فاتخذوا مسجدهم وسكن بيتاً عنده رجل منهم كانوا يسألون عنه كل غداة مخافة أن يعدو عليه السبع، ثم كثروا حتى سُموا «غزة» تشبيهاً بغزة الشام لكثرة أهلها. ومن آطامهم «صعب ذرع» المجمل كالحصن للقتال عند بطنهم المعروف بذرع، وأطم لأمية بن عامر بن خطمة بمال الماجشونية {cite:samhudi-wafa-al-wafa p. 209-210}. وكانوا من «أوس الله» — مع بني أمية بن زيد ووائل وواقف — الذين وقف بهم أبو قيس بن الأسلت عن الإسلام حتى مضت بدر وأحد والخندق ثم أسلموا كلهم {cite:samhudi-wafa-al-wafa p. 239-240}."
  en: "A clan of the Aws — Khatma is 'Abdallah ibn Jusham ibn Malik al-Awsi — who settled their known quarter, built utum and planted palms, yet lived scattered in their towers with none in the quarter's heart; when Islam came they took a mosque and one man built a house beside it, the others asking after him each morning for fear a beast had taken him, until they multiplied and were nicknamed 'Ghazza' after populous Gaza of al-Sham. Their utum include 'Sa'b Dhar'' — kept as a fighting fortress with no dwellings — and the tower of Umayya ibn 'Amir ibn Khatma {cite:samhudi-wafa-al-wafa p. 209-210}."
  es: "Un clan de los Aws —Khatma es 'Abdallah ibn Jusham ibn Malik al-Awsi— se estableció en su barrio conocido, construyó utum y plantó palmeras, pero vivían dispersos en sus torres sin que ninguno estuviera en el centro del barrio; cuando llegó el Islam tomaron una mezquita y un hombre construyó una casa junto a ella, los demás preguntaban por él cada mañana por temor a que una bestia se lo hubiera llevado, hasta que se multiplicaron y fueron apodados 'Ghazza' en honor a la populosa Gaza de al-Sham. Su utum incluye ''Sa'b Dhar'' —mantenido como fortaleza de combate sin viviendas— y la torre de Umayya ibn 'Amir ibn Khatma {cite:samhudi-wafa-al-wafa p. 209-210}."
  fr: "Un clan des Aws — Khatma étant 'Abdallah ibn Jusham ibn Malik al-Awsi — s'établit dans son quartier, y construisit des utum et planta des palmiers, mais vivait dispersé dans ses tours, sans aucun membre au cœur du quartier. À l'arrivée de l'islam, ils prirent une mosquée et l'un d'eux fit construire une maison à côté. Chaque matin, les autres s'inquiétaient de lui, craignant qu'une bête ne l'ait emporté. Leur nombre augmenta et ils furent surnommés « Ghazza », en référence à la ville peuplée de Gaza, au Levant. Parmi leurs utum figurent « Sa'b Dhar » — conservé comme forteresse de combat sans habitations — et la tour d'Umayya ibn 'Amir ibn Khatma (voir: Samhudi-Wafa-Al-Wafa, p. 209-210)."
  ur: "اوس کا ایک قبیلہ - خاتمہ 'عبداللہ ابن جشام بن مالک العوسی' ہے - جس نے اپنا جانا پہچانا محلہ آباد کیا، اُتم بنایا اور کھجوریں لگائیں، پھر بھی اپنے میناروں میں بکھرے رہتے تھے جس کے دل میں کوئی نہیں تھا۔ جب اسلام آیا تو انہوں نے ایک مسجد لے لی اور ایک آدمی نے اس کے ساتھ ایک گھر بنایا، دوسرے لوگ ہر صبح اس کے پیچھے اس خوف سے پوچھتے تھے کہ کسی درندے نے اسے اپنی لپیٹ میں لے لیا، یہاں تک کہ ان کی تعداد بڑھ گئی اور الشام کی آبادی والے غزہ کے نام پر 'غزہ' کا نام دیا گیا۔ ان کے اُتم میں 'صب دھر' - ایک جنگی قلعہ کے طور پر رکھا گیا تھا جس میں کوئی رہائش نہیں تھی - اور امیہ بن عامر ابن خاتمہ کا مینار۔ 209-210}۔"
  tr: "Evs kabilesinden olan Hatme, Abdullah ibn Cuşam ibn Malik ibn Evs'in oğluydu. Kendi adlarıyla bilinen topraklarına yerleştiler, surlarla çevrili evler (atām) inşa ettiler ve hurma ağaçları diktiler. İslam'ın gelişine kadar surlarla çevrili evlerinin arasında dağınık halde yaşadılar ve topraklarının merkezinde kimse ikamet etmedi. Daha sonra camilerini kurdular ve adamlarından biri camiye yakın bir evde yaşadı. Her sabah, vahşi bir hayvanın ona saldırmasından korkarak onu kontrol ederlerdi. Daha sonra sayıları arttı ve Suriye'deki Gazze'ye benzetilerek, büyük nüfusları nedeniyle \"Gazze\" olarak adlandırıldılar. Surlarla çevrili evleri arasında, Dhar'a olarak bilinen kabilelerinin yakınında bulunan ve savaş için kullanılan kale benzeri bir yapı olan \"Sa'b Dhar'a\" da vardı. Bir diğer surlarla çevrili ev ise Majshuniyyah bölgesinde bulunan Umayyah ibn Amir ibn Hatme'ye aitti. {cite:samhudi-wafa-al-wafa s. 209-210} Onlar, Ebu Kays ibn el-Aslat'ın Bedir, Uhud ve Hendek geçinceye kadar İslam'dan uzak tuttuğu Banu Umayya ibn Zayd, Wael ve Waqif ile birlikte \"Aws Allah\" kabilesindendi; daha sonra hepsi İslam'ı kabul etti. {cite:samhudi-wafa-al-wafa s. 239-240}"
  id: "Sebuah klan dari suku Aws, Khatmah adalah putra Abdullah ibn Jusham ibn Malik ibn Aws. Mereka menetap di wilayah mereka, yang dikenal dengan nama mereka, dan membangun tempat tinggal berbenteng (atām) serta menanam pohon kurma. Mereka tersebar di antara tempat tinggal berbenteng mereka, tanpa seorang pun yang tinggal di bagian tengah wilayah mereka, hingga kedatangan Islam. Kemudian mereka mendirikan masjid mereka, dan salah seorang pria mereka tinggal di sebuah rumah di dekatnya. Setiap pagi, mereka akan menanyakan keadaannya, karena takut binatang liar akan menyerangnya. Kemudian, jumlah mereka bertambah hingga mereka disebut \"Gaza,\" sebagai perbandingan dengan Gaza di Suriah, karena populasinya yang besar. Di antara tempat tinggal berbenteng mereka adalah \"Sa'b Dhar'a,\" sebuah struktur seperti benteng yang digunakan untuk berperang, terletak di dekat klan mereka yang dikenal sebagai Dhar'a. Tempat tinggal berbenteng lainnya milik Umayyah ibn Amir ibn Khatmah, di daerah Majshuniyyah. {cite:samhudi-wafa-al-wafa hlm. 209-210} Mereka berasal dari “Aws Allah” — bersama dengan Bani Umayyah ibn Zayd, Wael dan Waqif — yang dijauhkan Abu Qays ibn al-Aslat dari Islam hingga Perang Badar, Uhud, dan Parit berlalu, kemudian mereka semua memeluk Islam {cite:samhudi-wafa-al-wafa hlm. 239-240}."
