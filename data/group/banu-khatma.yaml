label: { ar: "بنو خطمة", en: "Banu Khatma", es: "Banu Khatma", fr: "Banu Khatma" }
summary:
  ar: "بطن من الأوس، خطمة هو عبد الله بن جشم بن مالك بن الأوس؛ نزلوا دارهم المعروفة بهم فابتنوا الآطام وغرسوا النخيل، وكانوا متفرقين في آطامهم لا يسكن قصبة دارهم أحد، حتى جاء الإسلام فاتخذوا مسجدهم وسكن بيتاً عنده رجل منهم كانوا يسألون عنه كل غداة مخافة أن يعدو عليه السبع، ثم كثروا حتى سُموا «غزة» تشبيهاً بغزة الشام لكثرة أهلها. ومن آطامهم «صعب ذرع» المجمل كالحصن للقتال عند بطنهم المعروف بذرع، وأطم لأمية بن عامر بن خطمة بمال الماجشونية {cite:samhudi-wafa-al-wafa p. 209-210}. وكانوا من «أوس الله» — مع بني أمية بن زيد ووائل وواقف — الذين وقف بهم أبو قيس بن الأسلت عن الإسلام حتى مضت بدر وأحد والخندق ثم أسلموا كلهم {cite:samhudi-wafa-al-wafa p. 239-240}."
  en: "A clan of the Aws — Khatma is 'Abdallah ibn Jusham ibn Malik al-Awsi — who settled their known quarter, built utum and planted palms, yet lived scattered in their towers with none in the quarter's heart; when Islam came they took a mosque and one man built a house beside it, the others asking after him each morning for fear a beast had taken him, until they multiplied and were nicknamed 'Ghazza' after populous Gaza of al-Sham. Their utum include 'Sa'b Dhar'' — kept as a fighting fortress with no dwellings — and the tower of Umayya ibn 'Amir ibn Khatma {cite:samhudi-wafa-al-wafa p. 209-210}."
  es: "Un clan de los Aws —Khatma es 'Abdallah ibn Jusham ibn Malik al-Awsi— se estableció en su barrio conocido, construyó utum y plantó palmeras, pero vivían dispersos en sus torres sin que ninguno estuviera en el centro del barrio; cuando llegó el Islam tomaron una mezquita y un hombre construyó una casa junto a ella, los demás preguntaban por él cada mañana por temor a que una bestia se lo hubiera llevado, hasta que se multiplicaron y fueron apodados 'Ghazza' en honor a la populosa Gaza de al-Sham. Su utum incluye ''Sa'b Dhar'' —mantenido como fortaleza de combate sin viviendas— y la torre de Umayya ibn 'Amir ibn Khatma {cite:samhudi-wafa-al-wafa p. 209-210}."
  fr: "Un clan des Aws — Khatma étant 'Abdallah ibn Jusham ibn Malik al-Awsi — s'établit dans son quartier, y construisit des utum et planta des palmiers, mais vivait dispersé dans ses tours, sans aucun membre au cœur du quartier. À l'arrivée de l'islam, ils prirent une mosquée et l'un d'eux fit construire une maison à côté. Chaque matin, les autres s'inquiétaient de lui, craignant qu'une bête ne l'ait emporté. Leur nombre augmenta et ils furent surnommés « Ghazza », en référence à la ville peuplée de Gaza, au Levant. Parmi leurs utum figurent « Sa'b Dhar » — conservé comme forteresse de combat sans habitations — et la tour d'Umayya ibn 'Amir ibn Khatma (voir: Samhudi-Wafa-Al-Wafa, p. 209-210)."
