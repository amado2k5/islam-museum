summary:
  ar: "ذكر كعب بن مالك أن «ملك غسان» كتب إليه كتاباً في سرقة من حرير أثناء مقاطعة الثلاثة يدعوه إلى اللحاق به. وعند المسعودي إنما غسان ماء شربوا منه فسموا به وهو ما بين زبيد ورمع وادي الأشعريين بأرض اليمن، وغلبت غسان على من بالشام من العرب فملكها الروم عليهم، وأول ملوكها الحارث بن عمرو بن عامر، وكانت ديار ملوكها باليرموك والجولان وغوطة دمشق وأعمالها، وجميع من ملك من ملوكها بالشام أحد عشر ملكاً آخرهم جبلة بن الأيهم الذي أسلم ثم ارتد خوف القود من اللطمة {cite:muruj-al-dhahab p. 425-428}"
  en: Ka'b ibn Malik relates that the 'king of Ghassan' wrote him a letter wrapped in a scrap of silk during the boycott of the three, inviting him to join him.
  es: "Ka'b ibn Malik relata que el 'rey de Ghassan' le escribió una carta envuelta en un trozo de seda durante el boicot de los tres, invitándolo a unirse a él."
  fr: "Ka'b ibn Malik raconte que le « roi de Ghassan » lui a écrit une lettre enveloppée dans un morceau de soie pendant le boycott des trois, l'invitant à se joindre à lui."
  ur: "کعب بن مالک بیان کرتے ہیں کہ غسان کے بادشاہ نے ان تینوں کے بائیکاٹ کے دوران انہیں ریشم کے ٹکڑے میں لپٹا ایک خط لکھا جس میں انہیں اپنے ساتھ آنے کی دعوت دی۔"
  tr: "Ka'b ibn Malik, \"Gassan Kralı\"nın kendisine, üçünün boykotu sırasında ipek hırsızlığıyla ilgili olarak yazdığını ve kendisine katılmaya davet ettiğini belirtmiştir. El-Mas'udi'ye göre, Gassan, içtikleri bir su kaynağıydı ve adını da buradan almışlardı. Yemen topraklarında, Eş'ariyyin vadisinde, Zabid ve Ram'a arasında yer almaktadır. Gassanlılar, Levant'taki Arapları fethetmiş ve Romalılar onların üzerinde hüküm sürmüştür. İlk kralları el-Harith ibn Amr ibn Amir'dir. Kraliyet toprakları Yermuk, Golan, Şam Gutası ve çevresindeydi. On bir krallarının tamamı Levant'ta hüküm sürmüştür; sonuncusu ise, bir tokat nedeniyle intikam korkusuyla İslam'a geçen ve sonra dinden dönen Cebelah ibn el-Ayham'dır. {cite:muruj-al-dhahab s. 425-428}"
  id: "Ka'b ibn Malik menyebutkan bahwa \"Raja Ghassan\" menulis surat kepadanya mengenai pencurian sutra selama boikot yang dilakukan oleh ketiga orang tersebut, dan mengundangnya untuk bergabung. Menurut al-Mas'udi, Ghassan adalah sumber air yang mereka minum dan dinamai menurut nama tersebut. Letaknya di antara Zabid dan Ram'a, di lembah Ash'ariyyin di tanah Yaman. Dinasti Ghassanid menaklukkan bangsa Arab di Levant, dan bangsa Romawi memerintah mereka. Raja pertama mereka adalah al-Harith ibn Amr ibn Amir. Tanah kerajaan mereka berada di Yarmouk, Golan, Ghouta Damaskus, dan daerah sekitarnya. Kesebelas raja mereka memerintah di Levant, yang terakhir adalah Jabalah ibn al-Ayham, yang masuk Islam dan kemudian murtad karena takut akan pembalasan atas tamparan yang diterimanya. {cite:muruj-al-dhahab hlm. 425-428}"
