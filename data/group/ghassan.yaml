label: { ar: "غسان", en: "Ghassan" }
summary:
  ar: "ذكر كعب بن مالك أن «ملك غسان» كتب إليه كتاباً في سرقة من حرير أثناء مقاطعة الثلاثة يدعوه إلى اللحاق به.، وعند المسعودي إنما غسان ماء شربوا منه فسموا به وهو ما بين زبيد ورمع وادي الأشعريين بأرض اليمن، وغلبت غسان على من بالشام من العرب فملكها الروم عليهم، وأول ملوكها الحارث بن عمرو بن عامر، وكانت ديار ملوكها باليرموك والجولان وغوطة دمشق وأعمالها، وجميع من ملك من ملوكها بالشام أحد عشر ملكاً آخرهم جبلة بن الأيهم الذي أسلم ثم ارتد خوف القود من اللطمة {cite:muruj-al-dhahab p. 425-428}"
  en: Ka'b ibn Malik relates that the 'king of Ghassan' wrote him a letter wrapped in a scrap of silk during the boycott of the three, inviting him to join him.
