label:
  ar: "آل العلمي بالقدس"
  en: "The al-'Alami family of Jerusalem"
summary:
  ar: "أسرة العلمي بالقدس، تنتسب إلى عبد السلام بن مشيش، ويُرجَّح أنها من الأسر المغربية التي هاجرت إلى القدس في القرن الرابع عشر الميلادي؛ وتولى ابنا علم الدين، موسى وعمر، نيابة السلطنة بالقدس ونظارة الحرمين (القدس والخليل) تعاقبًا، وصار منهم أئمة وعلماء وأعيان في القدس إلى القرن العشرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  en: "The al-'Alami family of Jerusalem traces its descent to Ibn Mashish and was probably one of the Maghribi families that came to Jerusalem in the 14th century. Two sons of 'Alam al-Din governed the city and kept the sacred places of Jerusalem and Hebron in turn, and the family produced Sufi saints, lecturers and muftis into the 20th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
