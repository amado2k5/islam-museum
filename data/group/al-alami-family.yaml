label:
  ar: "آل العلمي بالقدس"
  en: "The al-'Alami family of Jerusalem"
  es: "La familia al-'Alami de Jerusalén"
  fr: "La famille al-'Alami de Jérusalem"
  ur: "یروشلم کا العالمی خاندان"
  tr: "Kudüs'teki Al-Alami ailesi"
  id: "Keluarga Al-Alami di Yerusalem"
summary:
  ar: "أسرة العلمي بالقدس، تنتسب إلى عبد السلام بن مشيش، ويُرجَّح أنها من الأسر المغربية التي هاجرت إلى القدس في القرن الرابع عشر الميلادي؛ وتولى ابنا علم الدين، موسى وعمر، نيابة السلطنة بالقدس ونظارة الحرمين ⁦(القدس والخليل)⁩ تعاقبًا، وصار منهم أئمة وعلماء وأعيان في القدس إلى القرن العشرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  en: "The al-'Alami family of Jerusalem traces its descent to Ibn Mashish and was probably one of the Maghribi families that came to Jerusalem in the 14th century. Two sons of 'Alam al-Din governed the city and kept the sacred places of Jerusalem and Hebron in turn, and the family produced Sufi saints, lecturers and muftis into the 20th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  es: "La familia al-'Alami de Jerusalén remonta su ascendencia a Ibn Mashish y probablemente fue una de las familias magrebíes que llegaron a Jerusalén en el siglo XIV. Dos hijos de 'Alam al-Din gobernaron la ciudad y custodiaron alternativamente los lugares sagrados de Jerusalén y Hebrón, y la familia produjo santos sufíes, conferenciantes y muftíes hasta el siglo XX {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  fr: "La famille al-'Alami de Jérusalem fait remonter sa descendance à Ibn Mashish et était probablement l'une des familles maghrébines arrivées à Jérusalem au XIVe siècle. Deux fils d'Alam al-Din gouvernèrent la ville et administrèrent tour à tour les lieux saints de Jérusalem et d'Hébron. La famille compta parmi ses membres des saints soufis, des conférenciers et des muftis jusqu'au XXe siècle {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  ur: "یروشلم کے العالمی خاندان کا تعلق ابن مشیش سے ملتا ہے اور یہ غالباً ان مغربی خاندانوں میں سے ایک تھا جو 14ویں صدی میں یروشلم آئے تھے۔ عالم الدین کے دو بیٹوں نے شہر پر حکومت کی اور یروشلم اور ہیبرون کے مقدس مقامات کی حفاظت کی، اور اس خاندان نے 20 ویں صدی میں صوفی بزرگوں، لیکچررز اور مفتیوں کو پیدا کیا۔ 1 ص۔ 374}۔"
  tr: "Kudüs'teki Al-Alami ailesi, Abdül-Selam ibn Meşiş ile akrabadır ve muhtemelen MS 14. yüzyılda Kudüs'e göç eden Faslı ailelerden biridir. Alam el-Din'in iki oğlu Musa ve Ömer, Kudüs'teki Sultanlığın vekilliğini ve iki kutsal caminin (Kudüs ve Hebron) denetimini sırasıyla üstlenmişlerdir ve yirminci yüzyıla kadar Kudüs'te onlardan imamlar, alimler ve ileri gelenler çıkmıştır. {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
  id: "Keluarga Al-Alami di Yerusalem memiliki hubungan kekerabatan dengan Abd al-Salam ibn Mashish, dan kemungkinan besar mereka adalah salah satu keluarga Maroko yang bermigrasi ke Yerusalem pada abad keempat belas Masehi. Dua putra Alam al-Din, Musa dan Omar, secara berturut-turut mengambil alih jabatan wakil Kesultanan di Yerusalem dan pengawasan dua masjid suci (Yerusalem dan Hebron), dan dari mereka kemudian muncul imam, ulama, dan tokoh terkemuka di Yerusalem hingga abad kedua puluh {cite:encyclopaedia-of-islam-2 vol. 1 p. 374}."
