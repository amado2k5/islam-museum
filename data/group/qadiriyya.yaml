label:
  ar: الطريقة القادرية
  en: The Qadiri order (Qadiriyya)
  ur: قادریہ طریقہ
  es: "La orden Qadiri (Qadiriyya)"
  fr: "L'ordre Qadiri (Qadiriyya)"
  tr: "Kadiriyye Tarikatı"
  id: "Tarekat Qadiriyya"
summary:
  ar: "الطريقة القادرية المنسوبة إلى عبد القادر الجيلاني ⁦(ت 561هـ/1166م)⁩ — من أقدم الطرق الصوفية وأوسعها انتشارًا في العالم الإسلامي {cite:trimingham-sufi-orders-1998}."
  en: "The Qadiri order traced to Abd al-Qadir al-Jilani (d. 561 AH/1166 CE) — among the oldest and most widespread Sufi orders of the Islamic world {cite:trimingham-sufi-orders-1998}."
  es: "La orden Qadiri se remonta a Abd al-Qadir al-Jilani (m. 561 AH/1166 CE), una de las órdenes sufíes más antiguas y extendidas del mundo islámico {cite:trimingham-sufi-orders-1998}."
  fr: "L'ordre Qadiri remonte à Abd al-Qadir al-Jilani (mort en 561 AH/1166 CE) — parmi les ordres soufis les plus anciens et les plus répandus du monde islamique {cite:trimingham-sufi-orders-1998}."
  ur: "قادری حکم کا سراغ عبدالقادر الجیلانی ⁦(متوفی 561 ہجری/1166 عیسوی)⁩ سے ملتا ہے - جو اسلامی دنیا کے قدیم ترین اور سب سے زیادہ وسیع صوفی احکامات میں سے ایک ہے۔"
  tr: "Abdülkadir el-Geylani'ye (ö. 561 H. 1166) atfedilen Kadiriyye tarikatı, İslam dünyasındaki en eski ve en yaygın Sufi tarikatlarından biridir {cite:trimingham-sufi-orders-1998}."
  id: "Tarekat Qadiriyya, yang dikaitkan dengan Abdul Qadir al-Jilani (w. 561 H./1166 M) — adalah salah satu tarekat sufi tertua dan paling luas di dunia Islam {cite:trimingham-sufi-orders-1998}."
