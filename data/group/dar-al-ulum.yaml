label: { ar: "دار العلوم", en: "Dar al-Ulum", ur: "دار العلوم قاہرہ" }
summary:
  ar: "دار العلوم، كلية للتعليم العالي في القاهرة أسسها علي باشا مبارك سنة 1872 في عهد الخديوي إسماعيل، لتعليم عدد من طلبة الأزهر العلوم الحديثة في منهج من خمس سنوات ثم أربع، ليكونوا معلمين في المدارس الجديدة. صارت كلية ملحقة بجامعة القاهرة سنة 1946 {cite:encyclopaedia-of-islam-2 vol. 2 p. 145}."
  en: "Dar al-Ulum, a college of higher instruction in Cairo founded by Ali Pasha Mubarak in 1872, in the reign of Khedive Ismail, to give a number of al-Azhar students a five-year, later four-year, course in modern subjects so that they could teach in the new schools. It became a faculty of the University of Cairo in 1946 {cite:encyclopaedia-of-islam-2 vol. 2 p. 145}."
  ur: "دار العلوم، قاہرہ میں اعلیٰ تعلیم کی درس گاہ جسے علی پاشا مبارک نے خدیو اسماعیل کے دور میں 1872ء میں قائم کیا تاکہ ازہر کے کچھ طلبہ کو جدید مضامین کا پانچ سالہ، بعد میں چار سالہ، نصاب دے کر نئے مدارس کے لیے اساتذہ بنایا جائے۔ 1946ء میں یہ قاہرہ یونیورسٹی کی فیکلٹی بنی {cite:encyclopaedia-of-islam-2 vol. 2 p. 145}."
