id: group/banu-lakhm
class: group
kind: tribe
label: { ar: "لخم (المناذرة)", en: "Lakhm (the Manadhira)" }
summary:
  ar: "البطن الكهلاني الذي منه نصر بن ربيعة أبو ملوك الحيرة المناذرة؛ ملكوا عن الفرس من عمرو بن عدي حتى آخرهم المنذر المعرور سنة 632م.، وعند المسعودي أن أولهم ملكاً بالحيرة عمرو بن عدي بن نصر ابن أخت جذيمة مائة سنة، ثم ابنه امرؤ القيس ستين، ثم عمرو بن امرئ القيس محرق العرب خمساً وعشرين، ثم عمرو بن المنذر أربعاً وعشرين، ثم قابوس بن المنذر ثلاثين، ثم النعمان بن المنذر أبيت اللعن اثنتين وعشرين سنة {cite:muruj-al-dhahab p. 412-418}"
  en: "The Kahlani tribe whose Nasr ibn Rabiʾa founded the line of al-Hira’s kings — the Manadhira — ruling as Persia’s Arab wardens from Amr ibn Adi to the last al-Mundhir in 632."
