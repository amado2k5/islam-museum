label: { ar: "لخم ⁦(المناذرة)⁩", en: "Lakhm (the Manadhira)", es: "Lakhm (el Manadhira)", fr: "Lakhm (le Manadhira)", ur: "لخم ⁦(مندھیرا)⁩", tr: "Lakhm (Manathira)", id: "Lakhm (Manathira)" }
summary:
  ar: "البطن الكهلاني الذي منه نصر بن ربيعة أبو ملوك الحيرة المناذرة؛ ملكوا عن الفرس من عمرو بن عدي حتى آخرهم المنذر المعرور سنة 632م. وعند المسعودي أن أولهم ملكاً بالحيرة عمرو بن عدي بن نصر ابن أخت جذيمة مائة سنة، ثم ابنه امرؤ القيس ستين، ثم عمرو بن امرئ القيس محرق العرب خمساً وعشرين، ثم عمرو بن المنذر أربعاً وعشرين، ثم قابوس بن المنذر ثلاثين، ثم النعمان بن المنذر أبيت اللعن اثنتين وعشرين سنة {cite:muruj-al-dhahab p. 412-418}"
  en: "The Kahlani tribe whose Nasr ibn Rabiʾa founded the line of al-Hira’s kings — the Manadhira — ruling as Persia’s Arab wardens from Amr ibn Adi to the last al-Mundhir in 632."
  es: "La tribu Kahlani, cuyo líder, Nasr ibn Rabiʾa, fundó la línea de reyes de al-Hira —los Manadhira—, que gobernaron como guardianes árabes de Persia desde Amr ibn Adi hasta el último al-Mundhir en 632."
  fr: "La tribu Kahlani dont Nasr ibn Rabiʾa a fondé la lignée des rois d'al-Hira — les Manadhira — régnant en tant que gardiens arabes de la Perse d'Amr ibn Adi jusqu'au dernier al-Mundhir en 632."
  ur: "کاہلانی قبیلہ جس کے نصر ابن ربیعہ نے الحیرہ کے بادشاہوں کے سلسلے کی بنیاد رکھی - منادھیرا - 632 میں عمرو بن عدی سے آخری المنذر تک فارس کے عرب محافظوں کے طور پر حکومت کرتے تھے۔"
  tr: "Hira'daki Lahmid krallarının babası Nasr ibn Rabi'ah'ın da mensup olduğu Kahlanî kabilesi, Amr ibn Adi'den sonuncusu el-Mundhir el-Ma'rur'a kadar, yani 632 yılına kadar Persler adına hüküm sürmüştür. El-Mas'udi'ye göre, Hira'da hüküm süren ilk kişi, Jadhima'nın yeğeni Amr ibn Adi ibn Nasr olup yüz yıl hüküm sürmüştür, ardından oğlu İmru' el-Kays altmış yıl, sonra Arapları yakan Amr ibn İmru' el-Kays yirmi beş yıl, sonra Amr ibn el-Mundhir yirmi dört yıl, sonra Kabus ibn el-Mundhir otuz yıl ve son olarak da Allah onu lanetten korusun el-Nu'man ibn el-Mundhir yirmi iki yıl hüküm sürmüştür. {kaynak:muruj-al-dhahab s. 412-418}"
  id: "Klan Kahlanite, yang darinya berasal Nasr ibn Rabi'ah, ayah dari raja-raja Lakhmid Hira, memerintah atas nama Persia dari Amr ibn Adi hingga yang terakhir dari mereka, al-Mundhir al-Ma'rur, pada tahun 632 M. Menurut al-Mas'udi, yang pertama dari mereka memerintah di Hira adalah Amr ibn Adi ibn Nasr, keponakan Jadhima, selama seratus tahun, kemudian putranya Imru' al-Qays selama enam puluh tahun, kemudian Amr ibn Imru' al-Qays, yang membakar orang-orang Arab, selama dua puluh lima tahun, kemudian Amr ibn al-Mundhir selama dua puluh empat tahun, kemudian Qabus ibn al-Mundhir selama tiga puluh tahun, kemudian al-Nu'man ibn al-Mundhir, semoga Allah melindunginya dari kutukan, selama dua puluh dua tahun. {cite:muruj-al-dhahab p. 412-418}"
