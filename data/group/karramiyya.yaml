label: { ar: "الكرامية", en: "The Karramiyya", es: "La Karramiyya", fr: "Les Karramiyya" }
summary:
  ar: "فرقة كانت كثيرة العدد في هرات وبلاد الغور في أواخر القرن السادس الهجري، ويذكر ابن الأثير أن الغوريين كانوا كلهم كرامية؛ من شيوخهم بفيروزكوه القاضي مجد الدين عبد المجيد بن عمر المعروف بابن القدوة وهو من «الكرامية الهيصمية» وله عندهم محل كبير لزهده وعلمه وبيته، وقد ناظر فخر الدين الرازي عند السلطان غياث الدين سنة خمس وتسعين وخمسمائة وكادت الفتنة التي أعقبتها أن تهلك خلقاً كثيراً لولا تدخل السلطان {cite:kamil-ibn-al-athir p. 262}."
  en: "A sect numerous in Herat and the Ghurid lands at the end of the 6th/12th century — Ibn al-Athir says the Ghurids were all Karramiyya; their Firuzkuh shaykh Ibn al-Qadwa (of the Haythamiyya branch) debated Fakhr al-Din al-Razi before Sultan Ghiyath al-Din in 595, and the riot that followed was barely contained {cite:kamil-ibn-al-athir p. 262}."
  es: "Una secta numerosa en Herat y las tierras gúridas a finales del siglo VI/XII — Ibn al-Athir dice que todos los gúridas eran karramiyya; su shaykh firuzkuh Ibn al-Qadwa (de la rama haythamiyya) debatió con Fakhr al-Din al-Razi ante el sultán Ghiyath al-Din en 595, y el motín que siguió apenas fue contenido {cite:kamil-ibn-al-athir p. 262}."
  fr: "Une secte nombreuse à Hérat et dans les terres ghurides à la fin du VIe/XIIe siècle — Ibn al-Athir dit que les Ghurides étaient tous Karramiyya; leur cheikh Firuzkuh Ibn al-Qadwa (de la branche Haythamiyya) a débattu avec Fakhr al-Din al-Razi devant le sultan Ghiyath al-Din en 595, et l'émeute qui s'ensuivit fut à peine contenue {cite:kamil-ibn-al-athir p. 262}."
