label: { ar: "الكرامية", en: "The Karramiyya" }
summary:
  ar: "فرقة كانت كثيرة العدد في هرات وبلاد الغور في أواخر القرن السادس الهجري، ويذكر ابن الأثير أن الغوريين كانوا كلهم كرامية؛ من شيوخهم بفيروزكوه القاضي مجد الدين عبد المجيد بن عمر المعروف بابن القدوة وهو من «الكرامية الهيصمية» وله عندهم محل كبير لزهده وعلمه وبيته، وقد ناظر فخر الدين الرازي عند السلطان غياث الدين سنة خمس وتسعين وخمسمائة وكادت الفتنة التي أعقبتها أن تهلك خلقاً كثيراً لولا تدخل السلطان {cite:kamil-ibn-al-athir p. 262}."
  en: "A sect numerous in Herat and the Ghurid lands at the end of the 6th/12th century — Ibn al-Athir says the Ghurids were all Karramiyya; their Firuzkuh shaykh Ibn al-Qadwa (of the Haythamiyya branch) debated Fakhr al-Din al-Razi before Sultan Ghiyath al-Din in 595, and the riot that followed was barely contained {cite:kamil-ibn-al-athir p. 262}."
