summary:
  ar: "القناة الإعلامية لمؤسسة البهجة التعليمية الدعوية في تشيربون بغرب جاوة، وهي المؤسسة التي أسسها بويا يحيى سنة 2006 ويدير قناتها، وتحمل محاضراته ودروس المؤسسة؛ بلغ عدد مشتركيها على يوتيوب (@albahjah-tv) 6,060,000 مشترك بحسب عدّاد vidIQ كما في 15 نوفمبر 2026، وأكثر مقاطعها مشاهدة محاضرات بويا يحيى نفسه."
  en: "The media channel of the Al-Bahjah educational and dawah foundation in Cirebon, West Java — the institution founded by Buya Yahya in 2006, who also runs its channel — carrying his lectures and the institution's lessons; its YouTube channel (@albahjah-tv) counted 6,060,000 subscribers by vidIQ's count as of 15 November 2026, and its most-viewed uploads are Buya Yahya's own lectures."
  ur: "مغربی جاوا کے چیربون میں واقع البہجہ تعلیمی و دعوتی فاؤنڈیشن کی میڈیا چینل — وہ ادارہ جو بویا یحییٰ نے 2006ء میں قائم کیا اور جس کی چینل وہ چلاتے ہیں — جو ان کے لیکچرز اور ادارے کے اسباق پیش کرتی ہے؛ 15 نومبر 2026ء کے vidIQ شمار کے مطابق اس کے یوٹیوب چینل ⁦(@albahjah-tv)⁩ کے سبسکرائبرز 6,060,000 تھے، اور اس کی سب سے زیادہ دیکھی گئی ویڈیوز خود بویا یحییٰ کے لیکچرز ہیں۔"
