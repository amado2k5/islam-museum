label:
  ar: "فرسان القديس يوحنا"
  en: "Knights of St John (Hospitallers)"
  es: "Caballeros de San Juan (Hospitalarios)"
  fr: "Chevaliers de Saint-Jean (Hospitaliers)"
  ur: "سینٹ جان کے شورویروں ⁦(ہسپتال والے)⁩"
  tr: "Aziz John Şövalyeleri"
  id: "Ksatria Santo Yohanes"
summary:
  ar: "فرسان القديس يوحنا، جماعة عسكرية صليبية مقرها جزيرة رودس في العهد العثماني الأول؛ ينقل الصلابي أن الأمير جم لجأ إليهم بعد هزيمته أمام أخيه بايزيد الثاني، فعقد مع رئيسهم اتفاقاً نقضه تحت ضغط بايزيد فصار جم سجيناً لديهم، وكسبوا بهذه الرهينة الخطيرة امتيازات تارة من بايزيد وتارة من أنصار جم بالقاهرة، ثم باعوه إلى البابا إينوسنت الثامن بأموال ضخمة {cite:dawlat-uthmaniyya-salabi p. 164}. وظلت رودس مقرهم حتى فتحها [[person/sulayman-al-qanuni|سليمان القانوني]] سنة 1522م وأعطاهم حق الانتقال فذهبوا إلى مالطة التي منحهم شارل الخامس حكمها {cite:dawlat-uthmaniyya-salabi p. 201-202}."
  en: "The Knights of St John, the crusading military order based on Rhodes; in al-Salabi's account Prince Cem sought refuge with them after his defeats by Bayezid II, made a compact with their Grand Master that was broken under Bayezid's pressure, and became their prisoner — a hostage they milked for privileges now from Bayezid, now from Cem's Cairo backers, before selling him to Pope Innocent VIII for a great price {cite:dawlat-uthmaniyya-salabi p. 164}."
  es: "Los Caballeros de San Juan, la orden militar cruzada con sede en Rodas; según el relato de al-Salabi, el príncipe Cem buscó refugio con ellos tras sus derrotas ante Bayezid II, hizo un pacto con su Gran Maestre que se rompió bajo la presión de Bayezid, y se convirtió en su prisionero, un rehén al que explotaron para obtener privilegios, primero de Bayezid, luego de los patrocinadores de Cem en El Cairo, antes de venderlo al Papa Inocencio VIII por un gran precio {cite:dawlat-uthmaniyya-salabi p. 164}."
  fr: "Les Chevaliers de Saint-Jean, l'ordre militaire croisé basé à Rhodes; selon le récit d'al-Salabi, le prince Cem chercha refuge auprès d'eux après ses défaites face à Bayezid II, conclut un pacte avec leur Grand Maître qui fut rompu sous la pression de Bayezid, et devint leur prisonnier — un otage qu'ils exploitèrent pour obtenir des privilèges tantôt de Bayezid, tantôt des soutiens de Cem au Caire, avant de le vendre au pape Innocent VIII à un prix exorbitant {cite:dawlat-uthmaniyya-salabi p. 164}."
  ur: "سینٹ جان کے شورویروں، روڈس پر مبنی صلیبی فوجی حکم؛ السلابی کے کھاتے میں شہزادہ کیم نے بایزید دوم کے ہاتھوں شکست کے بعد ان کے ساتھ پناہ مانگی، اپنے گرینڈ ماسٹر کے ساتھ ایک معاہدہ کیا جو بایزید کے دباؤ میں ٹوٹ گیا تھا، اور ان کا قیدی بن گیا تھا - ایک یرغمال جو انہوں نے مراعات کے لیے دودھ پیا تھا اب بایزید سے، اب سیم کے قاہرہ کے حامیوں سے، اس سے پہلے کہ اسے پوپ VIII کو بڑی قیمت پر فروخت کیا جائے۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 164}۔"
  tr: "Osmanlı döneminin başlarında Rodos adasında konuşlanmış bir Haçlı askeri tarikatı olan Aziz Yuhanna Şövalyeleri, el-Salabi tarafından şöyle anlatılmaktadır: Prens Cem, kardeşi II. Bayezid tarafından yenilgiye uğratıldıktan sonra onlara sığınmıştır. Liderleriyle bir anlaşma yapmış, ancak Bayezid daha sonra bu anlaşmayı bozarak Cem'i hapse atmıştır. Şövalyeler, bu değerli rehineyi kullanarak bazen Bayezid'den, bazen de Kahire'deki Cem destekçilerinden ayrıcalıklar elde etmişlerdir. Daha sonra onu büyük bir meblağ karşılığında Papa VIII. Innocent'e satmışlardır (kaynak: Dawlat-uthmaniyya-salabi s. 164). Rodos, 1522'de Kanuni Sultan Süleyman tarafından fethedilene kadar karargahları olarak kalmıştır. Süleyman onlara yer değiştirme hakkı vermiş ve onlar da V. Charles'ın kendilerine yönetim hakkı verdiği Malta'ya gitmişlerdir (kaynak: Dawlat-uthmaniyya-salabi s. 201-202)."
  id: "Para Ksatria Santo Yohanes, sebuah ordo militer Tentara Salib yang berbasis di pulau Rhodes selama periode awal Ottoman, digambarkan oleh al-Salabi sebagai berikut: Pangeran Cem mencari perlindungan kepada mereka setelah kekalahannya oleh saudaranya Bayezid II. Ia membuat perjanjian dengan pemimpin mereka, yang kemudian dilanggar oleh Bayezid, sehingga Cem dipenjara. Para Ksatria menggunakan sandera berharga ini untuk mendapatkan hak istimewa, kadang-kadang dari Bayezid dan kadang-kadang dari pendukung Cem di Kairo. Mereka kemudian menjualnya kepada Paus Inocent VIII dengan sejumlah besar uang (kutipan: dawlat-uthmaniyya-salabi hlm. 164). Rhodes tetap menjadi markas mereka hingga ditaklukkan oleh Sulaiman Agung pada tahun 1522. Ia memberi mereka hak untuk pindah, dan mereka pergi ke Malta, yang telah diberikan kekuasaannya oleh Charles V kepada mereka (kutipan: dawlat-uthmaniyya-salabi hlm. 201-202)."
