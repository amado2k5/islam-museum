  en: "Knights of St John (Hospitallers)"
summary:
  ar: "فرسان القديس يوحنا، جماعة عسكرية صليبية مقرها جزيرة رودس في العهد العثماني الأول؛ ينقل الصلابي أن الأمير جم لجأ إليهم بعد هزيمته أمام أخيه بايزيد الثاني، فعقد مع رئيسهم اتفاقاً نقضه تحت ضغط بايزيد فصار جم سجيناً لديهم، وكسبوا بهذه الرهينة الخطيرة امتيازات تارة من بايزيد وتارة من أنصار جم بالقاهرة، ثم باعوه إلى البابا إينوسنت الثامن بأموال ضخمة {cite:dawlat-uthmaniyya-salabi p. 164}."
  en: "The Knights of St John, the crusading military order based on Rhodes; in al-Salabi's account Prince Cem sought refuge with them after his defeats by Bayezid II, made a compact with their Grand Master that was broken under Bayezid's pressure, and became their prisoner — a hostage they milked for privileges now from Bayezid, now from Cem's Cairo backers, before selling him to Pope Innocent VIII for a great price {cite:dawlat-uthmaniyya-salabi p. 164}."
