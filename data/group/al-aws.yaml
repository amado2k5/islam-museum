summary:
  ar: "الأوس بن حارثة بن ثعلبة بن عمرو مزيقياء الأزدي، سكن مع أخيه الخزرج يثرب ذات النخل حين وجههما الكاهن عمران بن عامر إليها بقوله من كان يريد الراسيات في الوحل المطعمات في المحل فليلحق بيثرب ذات النخل، وهم من الذين سموا غسان من بني مازن قبل تفرقهم {cite:muruj-al-dhahab p. 497-498}."
  en: "Son of Haritha ibn Tha'laba ibn Muzayqiya — routed with his brother Khazraj to palm-rich Yathrib by the kahin's riddle, having shared in the Ghassan naming before the dispersal {cite:muruj-al-dhahab p. 497-498}."
  es: "Hijo de Haritha ibn Tha'laba ibn Muzayqiya — derrocado junto con su hermano Khazraj a Yathrib, rica en palmeras, por el enigma del kahin, habiendo participado en la denominación de Ghassan antes de la dispersión {cite:muruj-al-dhahab p. 497-498}."
  fr: "Fils de Haritha ibn Tha'laba ibn Muzayqiya — mis en déroute avec son frère Khazraj vers Yathrib riche en palmiers par l'énigme du kahin, ayant participé à la dénomination Ghassan avant la dispersion {cite:muruj-al-dhahab p. 497-498}."
  ur: "حارثہ بن ثعلبہ ابن مزاقیہ کا بیٹا - اپنے بھائی خزرج کے ساتھ کھجوروں سے مالا مال یثرب کی طرف کاہین کی پہیلی سے نکلا، جس نے منتشر ہونے سے پہلے غسان کے نام رکھنے میں حصہ لیا تھا۔ 497-498}۔"
  tr: "Al-Aws ibn Haritha ibn Tha’laba ibn Amr Muzayqiya Al-Azdi, kardeşi Al-Khazraj ile birlikte Yathrib Dhat Al-Nakhl'da yaşıyordu. Rahip İmran ibn Amir onlara şöyle buyurmuştu: “Çamurda kök salmış, çölde beslenenleri isteyen, Yathrib Dhat Al-Nakhl'a gitsin.” Onlar, dağılmadan önce Beni Mazin kabilesinden Ghassan olarak adlandırılanlar arasındadır. {cite:muruj-al-dhahab s. 497-498}"
  id: "Al-Aws ibn Haritha ibn Tha’laba ibn Amr Muzayqiya Al-Azdi, tinggal bersama saudaranya Al-Khazraj di Yathrib Dhat Al-Nakhl ketika pendeta Imran ibn Amir mengarahkan mereka ke sana, seraya berkata: “Siapa pun yang menginginkan orang-orang yang berakar kuat di lumpur, orang-orang yang makan di padang pasir, hendaklah ia pergi ke Yathrib Dhat Al-Nakhl.” Mereka termasuk di antara orang-orang yang disebut Ghassan dari Bani Mazin sebelum mereka tercerai-berai. {cite:muruj-al-dhahab hlm. 497-498}"
