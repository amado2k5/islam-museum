summary:
  ar: "الأوس بن حارثة بن ثعلبة بن عمرو مزيقياء الأزدي، سكن مع أخيه الخزرج يثرب ذات النخل حين وجههما الكاهن عمران بن عامر إليها بقوله من كان يريد الراسيات في الوحل المطعمات في المحل فليلحق بيثرب ذات النخل، وهم من الذين سموا غسان من بني مازن قبل تفرقهم {cite:muruj-al-dhahab p. 497-498}."
  en: "Son of Haritha ibn Tha'laba ibn Muzayqiya — routed with his brother Khazraj to palm-rich Yathrib by the kahin's riddle, having shared in the Ghassan naming before the dispersal {cite:muruj-al-dhahab p. 497-498}."
