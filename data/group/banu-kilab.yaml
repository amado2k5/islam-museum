  ur: "بنو کلاب"
summary:
  ar: "بنو كلاب بن ربيعة بن عامر بن صعصعة، قبيلة من مضر انتشرت ما بين الجزيرة والشام في عدوة الفرات، وكانت مجالاتها بضواحي حلب؛ كانوا كالرعايا لبني حمدان يؤدون الأتاوات ثم استفحل أمرهم فأسس صالح بن مرداس منهم دولة بني مرداس بحلب، ومن أفخاذهم بنو خفاجة وبنو غير."
  en: "Banu Kilab ibn Rabi'a ibn Amir ibn Sa'sa'a, a Mudari tribe spread between the Jazira and Syria on the Euphrates side with pastures around Aleppo; they were once tributaries of the Hamdanids, then rose as their power failed — Salih ibn Mirdas founded the Mirdasid state of Aleppo from them, and their clans include Banu Khafaja and Banu Ghayyar."
  es: "Banu Kilab ibn Rabi'a ibn Amir ibn Sa'sa'a, una tribu mudárida que se extendía entre Jazira y Siria, en la orilla del Éufrates, con pastos alrededor de Alepo; fueron tributarios de los hamdánidas, y luego se alzaron cuando su poder decayó. Salih ibn Mirdas fundó el estado mirdasí de Alepo a partir de ellos, y entre sus clanes se incluyen Banu Khafaja y Banu Ghayyar."
  fr: "Les Banu Kilab ibn Rabi'a ibn Amir ibn Sa'sa'a, une tribu mudari répartie entre la Jazira et la Syrie, du côté de l'Euphrate, avec des pâturages autour d'Alep; ils étaient autrefois tributaires des Hamdanides, puis se sont élevés lorsque leur pouvoir a décliné — Salih ibn Mirdas a fondé l'État mirdaside d'Alep à partir d'eux, et leurs clans comprennent les Banu Khafaja et les Banu Ghayyar."
  ur: "بنو کلاب ابن ربیعہ ابن عامر بن صاعع، ایک مدری قبیلہ جو جزیرہ اور شام کے درمیان فرات کے کنارے پر حلب کے گرد چراگاہوں کے ساتھ پھیلا ہوا ہے۔ وہ کسی زمانے میں ہمدانیوں کے معاون تھے، پھر ان کی طاقت کے ناکام ہونے کے بعد عروج حاصل ہوا - صالح بن مرداس نے ان سے حلب کی میرداسد ریاست کی بنیاد رکھی، اور ان کے قبیلوں میں بنو خفجہ اور بنو غیار شامل ہیں۔"
