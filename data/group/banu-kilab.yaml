summary:
  ar: "بنو كلاب بن ربيعة بن عامر بن صعصعة، قبيلة من مضر انتشرت ما بين الجزيرة والشام في عدوة الفرات، وكانت مجالاتها بضواحي حلب؛ كانوا كالرعايا لبني حمدان يؤدون الأتاوات ثم استفحل أمرهم فأسس صالح بن مرداس منهم دولة بني مرداس بحلب، ومن أفخاذهم بنو خفاجة وبنو غير."
  en: "Banu Kilab ibn Rabi'a ibn Amir ibn Sa'sa'a, a Mudari tribe spread between the Jazira and Syria on the Euphrates side with pastures around Aleppo; they were once tributaries of the Hamdanids, then rose as their power failed — Salih ibn Mirdas founded the Mirdasid state of Aleppo from them, and their clans include Banu Khafaja and Banu Ghayyar."
