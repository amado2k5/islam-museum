summary:
  ar: "بطاقة أولية للطريقة البيرامية، الطريقة الصوفية التي أسسها حاجي بيرام ولي في أنقرة في القرن الرابع عشر ثم انقسمت إلى خلوتية وشمسية؛ لم تُراجع الصفحة بعد."
  en: "Draft card for the Bayramiyya, the Sufi order founded by Haji Bayram Veli at Ankara in the fourteenth century which later split into Celveti and Semsiyye branches; the source entry is not yet checked on the page."
  es: "Ficha preliminar de la Bayramiyya, la orden sufí fundada por Haji Bayram Veli en Ankara en el siglo XIV, que posteriormente se dividió en las ramas Celveti y Semsiyye; la fuente aún no ha sido verificada en la página."
  fr: "Fiche de brouillon pour la Bayramiyya, l'ordre soufi fondé par Haji Bayram Veli à Ankara au XIVe siècle et qui s'est ensuite divisé en branches Celveti et Semsiyye; la source n'est pas encore vérifiée sur la page."
  ur: "بیرامیہ کے لیے ڈرافٹ کارڈ، چودھویں صدی میں انقرہ میں حاجی بیرام ویلی کے ذریعہ قائم کردہ صوفی حکم جو بعد میں سیلویتی اور سیمسیئے شاخوں میں تقسیم ہو گیا۔ صفحہ پر سورس کا اندراج ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Hacı Bayram Veli tarafından 14. yüzyılda Ankara'da kurulan ve daha sonra Halvetiye ve Şemsiye olarak ikiye ayrılan Bayramiye tarikatının ön tanıtım kartı; sayfa henüz incelenmedi."
  id: "Kartu pendahuluan untuk tarekat Bayramiyya, tarekat Sufi yang didirikan oleh Haji Bayram Wali di Ankara pada abad keempat belas, yang kemudian terpecah menjadi Khalwatiyya dan Shamsiyya; halaman belum ditinjau."
