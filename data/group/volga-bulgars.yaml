label: { ar: "البلغر", en: "Volga Bulgars" }
summary:
  ar: "أمة في أقصى بلاد الترك، سئل عنهم علي بن إسحاق الخوارزمي في ديوان الخلافة ببغداد سنة 433هـ لما ورد رجل منهم في خمسين رجلاً قاصداً للحج، فقال هم قوم تولدوا من بين الترك والصقالبة وبلادهم في أقصى بلاد الترك، وكانوا كفاراً ثم ظهر فيهم الإسلام وهم على مذهب أبي حنيفة، ولهم عيون تجري في أنهار وزروعهم على المطر وعندهم كوارات العسل، وحكى أن الليل يقصر عندهم حتى يكون ست ساعات وكذلك النهار {cite:muntazam-ibn-al-jawzi j.8 p.109}."
  en: "A people at the far end of the land of the Turks. Ali ibn Ishaq al-Khwarazmi was asked about them in the caliphal chancery at Baghdad in 433 AH, when a man of theirs came with fifty men bound for the pilgrimage. He said they are a people born of Turks and Slavs, their land lying at the farthest reaches of the Turks; they were once unbelievers, then Islam appeared among them, and they follow the school of Abu Hanifa. They have springs flowing in rivers, their crops depend on rain, and they keep honey hives. He related that the night there shortens to six hours, and likewise the day {cite:muntazam-ibn-al-jawzi j.8 p.109}."
