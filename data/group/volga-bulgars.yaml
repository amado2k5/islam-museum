summary:
  ar: "أمة في أقصى بلاد الترك، سئل عنهم علي بن إسحاق الخوارزمي في ديوان الخلافة ببغداد سنة 433هـ لما ورد رجل منهم في خمسين رجلاً قاصداً للحج، فقال هم قوم تولدوا من بين الترك والصقالبة وبلادهم في أقصى بلاد الترك، وكانوا كفاراً ثم ظهر فيهم الإسلام وهم على مذهب أبي حنيفة، ولهم عيون تجري في أنهار وزروعهم على المطر وعندهم كوارات العسل، وحكى أن الليل يقصر عندهم حتى يكون ست ساعات وكذلك النهار {cite:muntazam-ibn-al-jawzi j.8 p.109}."
  en: "A people at the far end of the land of the Turks. Ali ibn Ishaq al-Khwarazmi was asked about them in the caliphal chancery at Baghdad in 433 AH, when a man of theirs came with fifty men bound for the pilgrimage. He said they are a people born of Turks and Slavs, their land lying at the farthest reaches of the Turks; they were once unbelievers, then Islam appeared among them, and they follow the school of Abu Hanifa. They have springs flowing in rivers, their crops depend on rain, and they keep honey hives. He related that the night there shortens to six hours, and likewise the day {cite:muntazam-ibn-al-jawzi j.8 p.109}."
  es: "Un pueblo en el extremo más alejado de la tierra de los turcos. Ali ibn Ishaq al-Khwarazmi fue interrogado sobre ellos en la cancillería califal de Bagdad en el año 433 de la Hégira, cuando un hombre de su pueblo llegó con cincuenta hombres rumbo a la peregrinación. Dijo que eran un pueblo nacido de turcos y eslavos, cuya tierra se extendía hasta los confines de los turcos; que en otro tiempo fueron incrédulos, luego el islam apareció entre ellos y que siguen la escuela de Abu Hanifa. Tienen manantiales que fluyen en los ríos, sus cosechas dependen de la lluvia y crían miel. Relató que allí la noche se acorta a seis horas, y lo mismo ocurre con el día {cite:muntazam-ibn-al-jawzi j.8 p.109}."
  fr: "Un peuple vivant aux confins du territoire turc. Ali ibn Ishaq al-Khwarazmi fut interrogé à leur sujet à la chancellerie califale de Bagdad en 433 AH, lorsqu'un de leurs hommes arriva avec cinquante compagnons en route pour le pèlerinage. Il expliqua qu'il s'agissait d'un peuple issu de Turcs et de Slaves, dont les terres se situaient aux confins du territoire turc; ils étaient autrefois incroyants, puis l'islam s'est répandu parmi eux, et ils suivent l'école d'Abu Hanifa. Ils ont des sources qui alimentent des rivières, leurs récoltes dépendent de la pluie et ils pratiquent l'apiculture. Il rapporta que la nuit y est courte, avec six heures de jour seulement (voir: Muntazam ibn al-Jawzi, vol. 8, p. 109)."
  ur: "ترکوں کی سرزمین کے بالکل آخر میں ایک قوم۔ علی ابن اسحاق الخوارزمی سے 433 ہجری میں بغداد میں خلیفہ مجلس میں ان کے بارے میں پوچھا گیا جب ان کا ایک آدمی پچاس آدمیوں کے ساتھ زیارت کے لیے آیا۔ اس نے کہا کہ وہ ترکوں اور غلاموں سے پیدا ہونے والے لوگ ہیں، ان کی زمین ترکوں کے سب سے دور پر واقع ہے۔ وہ کبھی کافر تھے، پھر ان میں اسلام ظاہر ہوا، اور وہ ابو حنیفہ کے مکتب کی پیروی کرتے ہیں۔ ان کے پاس ندیوں میں چشمے بہتے ہیں، ان کی فصلیں بارش پر منحصر ہیں، اور وہ شہد کے چھتے رکھتے ہیں۔ انہوں نے بیان کیا کہ وہاں رات چھ گھنٹے تک کم ہو جاتی ہے اور اسی طرح دن بھی کم ہوتا ہے"
