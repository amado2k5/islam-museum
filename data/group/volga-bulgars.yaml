summary:
  ar: "أمة في أقصى بلاد الترك، سئل عنهم علي بن إسحاق الخوارزمي في ديوان الخلافة ببغداد سنة 433هـ لما ورد رجل منهم في خمسين رجلاً قاصداً للحج، فقال هم قوم تولدوا من بين الترك والصقالبة وبلادهم في أقصى بلاد الترك، وكانوا كفاراً ثم ظهر فيهم الإسلام وهم على مذهب أبي حنيفة، ولهم عيون تجري في أنهار وزروعهم على المطر وعندهم كوارات العسل، وحكى أن الليل يقصر عندهم حتى يكون ست ساعات وكذلك النهار {cite:muntazam-ibn-al-jawzi j.8 p.109}."
