summary:
  ar: "منظمة إغاثة وتنمية دولية غير حكومية أسسها هاني البنا وزملاء له من طلاب جامعة برمنغهام سنة 1984، مقرها الدولي برمنغهام، ولها مكاتب وفروع في أكثر من أربعين بلدا؛ بلغ دخلها 275.6 مليون جنيه سنة 2024، وتعرّضت لاتهامات من إسرائيل والإمارات وغيرهما نفتها، وبرّأها تدقيق مستقل من تمويل الإرهاب سنة 2014."
  en: "An international relief and development NGO founded in 1984 by Hany El-Banna and fellow students of the University of Birmingham, with its international headquarters in Birmingham and offices and branches in more than forty countries; its income was £275.6 million in 2024. It has faced allegations from Israel, the UAE and others, which it denies, and an independent audit in 2014 found no link to terrorism."
  ur: "بین الاقوامی امدادی اور ترقیاتی غیر سرکاری تنظیم جسے ہانی البنا اور برمنگھم یونیورسٹی کے ان کے ساتھی طلبہ نے 1984 میں قائم کیا؛ بین الاقوامی صدر دفتر برمنگھم میں اور چالیس سے زیادہ ممالک میں دفاتر اور شاخیں ہیں؛ 2024 میں آمدنی 27 کروڑ 56 لاکھ پاؤنڈ رہی۔ اسرائیل، امارات اور دیگر کی جانب سے الزامات لگے جنہیں تنظیم نے مسترد کیا، اور 2014 کے ایک آزاد آڈٹ میں دہشت گردی سے کوئی تعلق نہیں ملا۔"
  es: "Se trata de una ONG internacional de ayuda humanitaria y desarrollo fundada en 1984 por Hany El-Banna y otros estudiantes de la Universidad de Birmingham, con sede central en Birmingham y oficinas y sucursales en más de cuarenta países. Sus ingresos ascendieron a 275,6 millones de libras esterlinas en 2024. Ha sido objeto de acusaciones por parte de Israel, los Emiratos Árabes Unidos y otros países, que las niegan, y una auditoría independiente realizada en 2014 no encontró ningún vínculo con el terrorismo."
  fr: "Une ONG internationale d'aide humanitaire et de développement fondée en 1984 par Hany El-Banna et d'autres étudiants de l'Université de Birmingham, dont le siège international se trouve à Birmingham et qui possède des bureaux et des antennes dans plus de quarante pays; son revenu s'élevait à 275,6 millions de livres sterling en 2024. Elle a fait l'objet d'allégations de la part d'Israël, des Émirats arabes unis et d'autres pays, qui les démentent, et un audit indépendant réalisé en 2014 n'a trouvé aucun lien avec le terrorisme."
  tr: "1984 yılında Hani al-Banna ve Birmingham Üniversitesi'ndeki meslektaşları tarafından kurulan uluslararası bir sivil toplum yardım ve kalkınma örgütü. Uluslararası genel merkezi Birmingham'da olup, kırktan fazla ülkede ofis ve şubeleri bulunmaktadır. Geliri 2024 yılında 275,6 milyon sterline ulaşmıştır. İsrail, BAE ve diğerlerinden gelen suçlamaları reddetmiş ve 2014 yılında bağımsız bir denetim tarafından terörizmi finanse etmediği tespit edilmiştir."
  id: "Sebuah organisasi bantuan dan pembangunan non-pemerintah internasional yang didirikan oleh Hani al-Banna dan rekan-rekannya dari Universitas Birmingham pada tahun 1984. Kantor pusat internasionalnya berada di Birmingham, dan memiliki kantor serta cabang di lebih dari empat puluh negara. Pendapatannya mencapai £275,6 juta pada tahun 2024. Organisasi ini pernah dituduh oleh Israel, Uni Emirat Arab, dan pihak lain, yang dibantahnya, dan audit independen pada tahun 2014 membebaskannya dari tuduhan pendanaan terorisme."
