summary:
  ar: "منظمة إغاثة وتنمية دولية غير حكومية أسسها هاني البنا وزملاء له من طلاب جامعة برمنغهام سنة 1984، مقرها الدولي برمنغهام، ولها مكاتب وفروع في أكثر من أربعين بلدا؛ بلغ دخلها 275.6 مليون جنيه سنة 2024، وتعرّضت لاتهامات من إسرائيل والإمارات وغيرهما نفتها، وبرّأها تدقيق مستقل من تمويل الإرهاب سنة 2014."
  en: "An international relief and development NGO founded in 1984 by Hany El-Banna and fellow students of the University of Birmingham, with its international headquarters in Birmingham and offices and branches in more than forty countries; its income was £275.6 million in 2024. It has faced allegations from Israel, the UAE and others, which it denies, and an independent audit in 2014 found no link to terrorism."
  ur: "بین الاقوامی امدادی اور ترقیاتی غیر سرکاری تنظیم جسے ہانی البنا اور برمنگھم یونیورسٹی کے ان کے ساتھی طلبہ نے 1984 میں قائم کیا؛ بین الاقوامی صدر دفتر برمنگھم میں اور چالیس سے زیادہ ممالک میں دفاتر اور شاخیں ہیں؛ 2024 میں آمدنی 27 کروڑ 56 لاکھ پاؤنڈ رہی۔ اسرائیل، امارات اور دیگر کی جانب سے الزامات لگے جنہیں تنظیم نے مسترد کیا، اور 2014 کے ایک آزاد آڈٹ میں دہشت گردی سے کوئی تعلق نہیں ملا۔"
