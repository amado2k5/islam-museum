summary:
  ar: "بطن من قريش من ولد عامر بن لؤي بن غالب، من بيوتات قريش التي أسلمت وهاجرت؛ منهم وهب بن عبد مناف بن زهرة بن كلاب عند قريش، ومنهم رجال في الهجرة إلى الحبشة {cite:ibn-hisham-sira}."
  en: "A batn of Quraysh descended from Amir ibn Lu'ayy ibn Ghalib — one of the Qurashi houses that embraced Islam and emigrated, with men listed in the Abyssinia rolls {cite:ibn-hisham-sira}."
  ur: "قریش کا بطن، عامر بن لوی بن غالب کی اولاد — اسلام لانے اور ہجرت کرنے والے قریشی گھرانوں میں سے۔"
  es: "Un clan de Quraysh descendiente de Amir ibn Lu'ayy ibn Ghalib, una de las casas Qurashi que abrazaron el Islam y emigraron, con hombres que figuran en los registros de Abisinia {cite:ibn-hisham-sira}."
  fr: "Une batn de Quraysh descendant d'Amir ibn Lu'ayy ibn Ghalib — l'une des maisons Qurashi qui ont embrassé l'Islam et émigré, avec des hommes répertoriés dans les rouleaux d'Abyssinie {cite:ibn-hisham-sira}."
  tr: "Emir ibn Lu'ay ibn Ghalib'in soyundan gelen, İslam'ı kabul edip hicret eden Kureyş ailelerinden bir Kureyş kabilesi; bunların arasında Kureyş'ten Wahb ibn Abd Manaf ibn Zuhrah ibn Kilab ve Habeşistan'a hicret edenler de vardı. {cite:ibn-hisham-sira}"
  id: "Sebuah klan Quraysh dari keturunan Amir ibn Lu’ay ibn Ghalib, dari keluarga Quraysh yang memeluk Islam dan berhijrah; di antara mereka adalah Wahb ibn Abd Manaf ibn Zuhrah ibn Kilab di antara kaum Quraysh, dan di antara mereka ada orang-orang yang berhijrah ke Abyssinia {cite:ibn-hisham-sira}."
