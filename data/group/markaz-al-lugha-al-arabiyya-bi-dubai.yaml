label:
  ar: "مركز اللغة العربية في دبي ⁦(معهد تعليمي خاص)⁩"
  en: "The Arabic Language Centre in Dubai (a private teaching institute)"
  ur: "دبئی میں عربی زبان کا مرکز ⁦(ایک نجی تدریسی ادارہ)⁩"
  fr: "Le Centre de langue arabe de Dubaï (un institut d'enseignement privé)"
  es: "El Centro de Lengua Árabe de Dubái (un instituto de enseñanza privado)"
  tr: "Dubai'de Arapça Dil Merkezi (Özel Eğitim Kurumu)"
