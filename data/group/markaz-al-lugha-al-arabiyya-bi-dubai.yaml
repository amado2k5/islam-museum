summary:
  ar: "مركز اللغة العربية في دبي (The Arabic Language Centre) مدرسة لغات خاصة تأسست سنة 1980 على يد المربية مليحة وهبة في مركز دبي التجاري العالمي، متخصصة في تعليم العربية لغة أجنبية للكبار والأطفال والشركات بـ«طريقة مليحة»؛ وهو معهد تجاري لا مجمع لغوي حكومي ولا جهة بحثية، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:arabiclanguagecentre-com}."
  en: "The Arabic Language Centre in Dubai is a private language school founded in 1980 by the educator Maliha Wehbe at the Dubai World Trade Centre, specialising in Arabic as a foreign language for adults, children and corporate clients with the proprietary Maliha Method; it is a commercial teaching institute and not a government language academy or research body, as a research file supplied to the museum summarises it {cite:arabiclanguagecentre-com}."
  ur: "دبئی میں عربی زبان کا مرکز (The Arabic Language Centre) ایک نجی لسانی مدرسہ ہے جسے 1980 میں معلمہ ملیحہ وہبہ نے دبئی ورلڈ ٹریڈ سینٹر میں قائم کیا؛ یہ بالغوں، بچوں اور کمپنیوں کے لیے عربی بطور غیر ملکی زبان پڑھانے میں مہارت رکھتا ہے اور اس کے لیے \"ملیحہ طریقہ\" استعمال کرتا ہے۔ یہ ایک تجارتی تدریسی ادارہ ہے، نہ کوئی سرکاری لسانی اکیڈمی اور نہ کوئی تحقیقی ادارہ، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل اس کا خلاصہ کرتی ہے {cite:arabiclanguagecentre-com}."
  fr: "Le Centre de langue arabe de Dubaï (The Arabic Language Centre) est une école de langues privée fondée en 1980 par l'éducatrice Maliha Wehbe au Dubai World Trade Centre, spécialisée dans l'enseignement de l'arabe comme langue étrangère aux adultes, aux enfants et aux entreprises avec la « méthode Maliha » qui lui est propre ; c'est un institut d'enseignement commercial et non une académie de langue gouvernementale ni un organisme de recherche, comme le résume un dossier de recherche remis au musée {cite:arabiclanguagecentre-com}."
  es: "El Centro de Lengua Árabe de Dubái (The Arabic Language Centre) es una escuela de idiomas privada fundada en 1980 por la educadora Maliha Wehbe en el Dubai World Trade Centre, especializada en la enseñanza del árabe como lengua extranjera para adultos, niños y empresas con el «método Maliha» que le es propio; es un instituto de enseñanza comercial y no una academia de la lengua gubernamental ni un organismo de investigación, tal como lo resume un expediente de investigación entregado al museo {cite:arabiclanguagecentre-com}."
  tr: "Dubai'deki Arapça Dil Merkezi, 1980 yılında eğitimci Maliha Wahba tarafından Dubai Dünya Ticaret Merkezi'nde kurulan özel bir dil okuludur. \"Maliha yöntemi\"ni kullanarak yetişkinlere, çocuklara ve işletmelere Arapçayı yabancı dil olarak öğretme konusunda uzmanlaşmıştır. Müzeye sunulan bir araştırma dosyasında özetlendiği gibi, bir devlet dil akademisi veya araştırma kuruluşu değil, ticari bir kurumdur {cite:arabiclanguagecentre-com}."
  id: "Pusat Bahasa Arab di Dubai adalah sekolah bahasa swasta yang didirikan pada tahun 1980 oleh pendidik Maliha Wahba di Dubai World Trade Centre. Sekolah ini mengkhususkan diri dalam pengajaran bahasa Arab sebagai bahasa asing kepada orang dewasa, anak-anak, dan bisnis menggunakan \"metode Maliha\". Sekolah ini merupakan lembaga komersial, bukan akademi bahasa pemerintah atau badan penelitian, sebagaimana diringkas dalam berkas penelitian yang diserahkan ke museum {cite:arabiclanguagecentre-com}."
