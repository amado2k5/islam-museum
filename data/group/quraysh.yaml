label: { en: "Quraysh", ar: "قريش" }
summary:
  en: "The tribe that inhabited Mecca in Muhammad's time and to which he belonged, keepers of the Kaaba and masters of its trade. Its leaders opposed the call for a decade, then after 630 its men filled the new state's administration. The Encyclopaedia of Islam traces its rise to Qusayy, its caravan trade, and its pre-Islamic clan blocs. According to al-Mas'udi, Quraysh comprised twenty-five clans, among them Hashim, al-Muttalib, Umayya, Nawfal, Abd al-Dar, Zuhra, Taym, Makhzum and Jumah, and the Quraysh of the Bitah were the inner group and the rest the Quraysh of the outskirts {cite:muruj-al-dhahab p. 567-568}. In Muslim's collection God chose Quraysh from Kinana {cite:sahih-muslim 2276}."
  ar: "القبيلة التي سكنت مكة في زمن محمد وكان منها، حارسة الكعبة وصاحبة تجارتها. عارضت قيادتها الدعوة عقدًا، ثم ملأ رجالها بعد سنة 630م إدارة الدولة الجديدة. وتتتبع دائرة المعارف الإسلامية صعودها على يد قصي وتجارة قوافلها وأحلاف بطونها قبل الإسلام. وعند المسعودي قريش خمسة وعشرون بطناً منها بنو هاشم وبنو المطلب وبنو أمية وبنو نوفل وبنو عبد الدار حجبة الكعبة وبنو زهرة وتيم ومخزوم وجمح وآخرها ما تنتهي به قريش البطاح وما بقي فهو قريش الظواهر {cite:muruj-al-dhahab p. 567-568}، وفي مسلم «اصطفى الله كنانة من ولد إسماعيل واصطفى قريشاً من كنانة» {cite:sahih-muslim 2276}"
  ur: "وہ قبیلہ جو محمد کے زمانے میں مکہ میں آباد تھا اور جس سے وہ خود تھے، کعبہ کے نگہبان اور اس کی تجارت کے مالک۔ اس کی قیادت دس برس دعوت کی مخالف رہی، پھر 630ء کے بعد اس کے لوگ نئی ریاست کے انتظام میں چھا گئے۔ انسائیکلوپیڈیا آف اسلام قصی کے ہاتھوں اس کے عروج، اس کی قافلوں کی تجارت اور اسلام سے پہلے کے خاندانی اتحادوں کا بیان کرتا ہے۔"
