summary:
  en: "The tribe that inhabited Mecca in Muhammad's time and to which he belonged, keepers of the Kaaba and masters of its trade. Its leaders opposed the call for a decade, then after 630 its men filled the new state's administration. The Encyclopaedia of Islam traces its rise to Qusayy, its caravan trade, and its pre-Islamic clan blocs. According to al-Mas'udi, Quraysh comprised twenty-five clans, among them Hashim, al-Muttalib, Umayya, Nawfal, Abd al-Dar, Zuhra, Taym, Makhzum and Jumah, and the Quraysh of the Bitah were the inner group and the rest the Quraysh of the outskirts {cite:muruj-al-dhahab p. 567-568}. In Muslim's collection God chose Quraysh from Kinana {cite:sahih-muslim 2276}."
  ar: "القبيلة التي سكنت مكة في زمن محمد وكان منها، حارسة الكعبة وصاحبة تجارتها. عارضت قيادتها الدعوة عقدًا، ثم ملأ رجالها بعد سنة 630م إدارة الدولة الجديدة. وتتتبع دائرة المعارف الإسلامية صعودها على يد قصي وتجارة قوافلها وأحلاف بطونها قبل الإسلام. وعند المسعودي قريش خمسة وعشرون بطناً منها بنو هاشم وبنو المطلب وبنو أمية وبنو نوفل وبنو عبد الدار حجبة الكعبة وبنو زهرة وتيم ومخزوم وجمح وآخرها ما تنتهي به قريش البطاح وما بقي فهو قريش الظواهر {cite:muruj-al-dhahab p. 567-568}، وفي مسلم «اصطفى الله كنانة من ولد إسماعيل واصطفى قريشاً من كنانة» {cite:sahih-muslim 2276}"
  ur: "وہ قبیلہ جو محمد کے زمانے میں مکہ میں آباد تھا اور جس سے وہ خود تھے، کعبہ کے نگہبان اور اس کی تجارت کے مالک۔ اس کی قیادت دس برس دعوت کی مخالف رہی، پھر 630ء کے بعد اس کے لوگ نئی ریاست کے انتظام میں چھا گئے۔ انسائیکلوپیڈیا آف اسلام قصی کے ہاتھوں اس کے عروج، اس کی قافلوں کی تجارت اور اسلام سے پہلے کے خاندانی اتحادوں کا بیان کرتا ہے۔"
  es: "La tribu que habitaba La Meca en tiempos de Mahoma y a la que pertenecía, guardianes de la Kaaba y maestros de su comercio. Sus líderes se opusieron al llamamiento durante una década, y luego, después del año 630, sus hombres ocuparon la administración del nuevo estado. La Enciclopedia del Islam rastrea su origen hasta Qusayy, su comercio de caravanas y sus bloques de clanes preislámicos. Según al-Mas'udi, los Quraysh comprendían veinticinco clanes, entre ellos Hashim, al-Muttalib, Umayya, Nawfal, Abd al-Dar, Zuhra, Taym, Makhzum y Jumah, y los Quraysh de Bitah eran el grupo interno y el resto los Quraysh de las afueras {cite:muruj-al-dhahab p. 567-568}. En la colección de Muslim, Dios eligió a los Quraysh de Kinana {cite:sahih-muslim 2276}."
  fr: "La tribu qui habitait La Mecque à l'époque de Mahomet et à laquelle il appartenait, gardienne de la Kaaba et maîtresse de son commerce, s'opposa à l'appel à l'islam pendant une décennie. Après 630, ses hommes prirent les rênes de l'administration du nouvel État. L'Encyclopédie de l'Islam retrace son essor jusqu'aux Qusayy, son commerce caravanier et ses blocs claniques préislamiques. Selon al-Mas'udi, les Quraysh comptaient vingt-cinq clans, parmi lesquels les Hashim, al-Muttalib, les Umayya, les Nawfal, les Abd al-Dar, les Zuhra, les Taym, les Makhzum et les Jumah. Les Quraysh de la Bitah formaient le groupe central, les autres étant les Quraysh des périphéries (voir Muruj-al-Dhahab, p. 567-568). Dans le recueil de Muslim, Dieu choisit les Quraysh parmi les Kinana (voir Sahih Muslim, p. 2276)."
  tr: "Muhammed zamanında Mekke'de yaşayan ve Kâbe'nin koruyucuları ile ticaretinin mensupları olan kabile, on yıl boyunca İslam'a çağrıya karşı çıktı. Daha sonra, 630 yılından sonra, erkekleri yeni devletin yönetimini ele geçirdi. İslam Ansiklopedisi, bu kabilenin yükselişini Kusai dönemindeki kervan ticaretini ve İslam öncesi dönemdeki kabile ittifaklarını ele almaktadır. El-Mas'udi'ye göre, Kureyş, Beni Haşim, Beni el-Muttalib, Beni Emevi, Beni Nevfel, Beni Abdülder (Kâbe'nin koruyucuları), Beni Zuhra, Taym, Makhzum, Cuma ve son olarak ovaların Kureyş'i de dahil olmak üzere yirmi beş kabileden oluşuyordu; geri kalanlar ise şehir dışındaki Kureyş'lerdir (bkz: el-Mas'udi, s. 567-568). Sahih Müslim'de şöyle buyurulmaktadır: \"Allah, İsmail'in soyundan Kinana'yı seçti ve Kinana'dan da Kureyş'i seçti\" (bkz: Sahih Müslim, 2276)."
  id: "Suku yang mendiami Mekah pada zaman Muhammad, dan dari mana berasal para penjaga Ka'bah dan perdagangannya, menentang seruan Islam selama satu dekade. Kemudian, setelah tahun 630 M, kaum prianya mengisi administrasi negara baru tersebut. Ensiklopedia Islam menelusuri kebangkitannya di bawah Qusai, perdagangan kafilahnya, dan aliansi klan-klannya sebelum Islam. Menurut al-Mas'udi, Quraisy terdiri dari dua puluh lima klan, termasuk Banu Hashim, Banu al-Muttalib, Banu Umayyah, Banu Nawfal, Banu Abd al-Dar (para penjaga Ka'bah), Banu Zuhra, Taym, Makhzum, Jumah, dan akhirnya, Quraisy dataran, sedangkan sisanya adalah Quraisy pinggiran (lihat: al-Mas'udi, hlm. 567-568). Dalam Sahih Muslim, disebutkan, \"Allah memilih Kinana dari keturunan Ismail dan memilih Quraisy dari Kinana\" (lihat: Sahih Muslim, 2276)."
