summary:
  en: "The tribe that held Mecca and the custodianship of the Kaaba — the Prophet's own people, its elite his fiercest opponents for a decade, then, after 630, the core of the new community's leadership."
  ar: "القبيلة التي ملكت مكة وولاية الكعبة — قوم النبي نفسه، وكانت نخبته أشد خصومه عقدًا، ثم صارت بعد سنة 630م صلب قيادة الجماعة الجديدة. وعند المسعودي قريش خمسة وعشرون بطناً منها بنو هاشم وبنو المطلب وبنو أمية وبنو نوفل وبنو عبد الدار حجبة الكعبة وبنو زهرة وتيم ومخزوم وجمح وآخرها ما تنتهي به قريش البطاح وما بقي فهو قريش الظواهر {cite:muruj-al-dhahab p. 567-568}، وفي مسلم «اصطفى الله كنانة من ولد إسماعيل واصطفى قريشاً من كنانة» {cite:sahih-muslim 2276}"
