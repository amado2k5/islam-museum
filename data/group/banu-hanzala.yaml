label: { ar: "بنو حنظلة بن مالك", en: "Banu Hanzala ibn Malik" }
summary:
  ar: "بطن من تميم — بنو حنظلة بن مالك بن زيد مناة بن تميم؛ كان النبي ولّى على صدقاتهم مالك بن نويرة فلما قُبض خلّى ما كان في يده من الفرائض وقال «شأنكم بأموالكم يا بني حنظلة»، وشهد أبو قتادة الأنصاري في قصة مقتل مالك أنهم وضعوا السلاح وأذّنوا؛ ومنهم سجاح بنت أوس (وقيل بنت الحارث) التي تنبأت في الردة."
  en: "A clan of Tamim — Banu Hanzala ibn Malik ibn Zayd Manat ibn Tamim; the Prophet made Malik ibn Nuwayra his agent over their alms, and on the Prophet's death Malik released what dues were in his hands saying 'see to your own wealth, Banu Hanzala'; in the affair of Malik's killing Abu Qatada al-Ansari testified that they had laid down their arms and called the adhan; of them also was Sajah bint Aws (some say bint al-Harith) who claimed prophecy in the Ridda."
