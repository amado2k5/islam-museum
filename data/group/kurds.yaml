label: { ar: "الأكراد", en: "The Kurds" }
summary:
  ar: "ينقل المسعودي في أصل الأكراد أقوالاً: فمن قائل إنهم من ربيعة بن نزار انفردوا قديماً في الجبال والأودية فحالوا عن لسانهم إلى لغة أعجمية ولكل نوع منهم لغة بالكردية، ومنهم من رآهم من مضر من ولد كرد بن مرد بن صعصعة بن هوازن، ومنهم من ألحقهم بإماء سليمان حين سلب ملكه وقال أكردوهن إلى الجبال فكان ذلك بدء نسبهم، ومنهم من جعلهم من تخلّص من أدمغة ضحايا الضحاك ذي الأفواه فطردوا إلى الجبال فتوحشوا وتناسلوا، والأشهر أنهم من ولد ربيعة، والشوهجان ببلاد ما بين الكوفة والبصرة لا تناكر بينهم أنهم من ربيعة، والماجردان من الكنكور بأذربيجان والهلبانية والسراة من مضر، وفيهم اليعقوبية والجورقان نصارى ديارهم مما يلي الموصل وجبل الجودي، وفيهم من رأيهم رأي الخوارج {cite:muruj-al-dhahab p. 439-440}."
  en: "Al-Mas'udi gives the rival origins of the Kurds: sons of Rabi'a or of Mudar arabised into mountain speech; Solomon's dismissed slave-women driven 'kurrisewise' to the hills; or the spared brain-tribute of al-Dahhak's serpents run wild — the Shuhajan of the Kufa-Basra marches claim Rabi'a, the Majardan of Azerbaijan claim Mudar, the Ya'qubiyya and Jurqan near Jabal Judi are Christians, and some hold Kharijite views {cite:muruj-al-dhahab p. 439-440}."
