summary:
  ar: "ينقل المسعودي في أصل الأكراد أقوالاً: فمن قائل إنهم من ربيعة بن نزار انفردوا قديماً في الجبال والأودية فحالوا عن لسانهم إلى لغة أعجمية ولكل نوع منهم لغة بالكردية، ومنهم من رآهم من مضر من ولد كرد بن مرد بن صعصعة بن هوازن، ومنهم من ألحقهم بإماء سليمان حين سلب ملكه وقال أكردوهن إلى الجبال فكان ذلك بدء نسبهم، ومنهم من جعلهم من تخلّص من أدمغة ضحايا الضحاك ذي الأفواه فطردوا إلى الجبال فتوحشوا وتناسلوا، والأشهر أنهم من ولد ربيعة، والشوهجان ببلاد ما بين الكوفة والبصرة لا تناكر بينهم أنهم من ربيعة، والماجردان من الكنكور بأذربيجان والهلبانية والسراة من مضر، وفيهم اليعقوبية والجورقان نصارى ديارهم مما يلي الموصل وجبل الجودي، وفيهم من رأيهم رأي الخوارج {cite:muruj-al-dhahab p. 439-440}."
  en: "Al-Mas'udi gives the rival origins of the Kurds: sons of Rabi'a or of Mudar arabised into mountain speech; Solomon's dismissed slave-women driven 'kurrisewise' to the hills; or the spared brain-tribute of al-Dahhak's serpents run wild — the Shuhajan of the Kufa-Basra marches claim Rabi'a, the Majardan of Azerbaijan claim Mudar, the Ya'qubiyya and Jurqan near Jabal Judi are Christians, and some hold Kharijite views {cite:muruj-al-dhahab p. 439-440}."
  es: "Al-Mas'udi ofrece los orígenes rivales de los kurdos: hijos de Rabi'a o de Mudar arabizados en el habla de las montañas; esclavas despedidas de Salomón llevadas 'en sentido kurdo' a las colinas; o el tributo cerebral salvado de las serpientes salvajes de al-Dahhak: los Shuhajan de las marcas de Kufa-Basora reclaman a Rabi'a, los Majardan de Azerbaiyán reclaman a Mudar, los Ya'qubiyya y Jurqan cerca de Jabal Judi son cristianos, y algunos sostienen puntos de vista jariyíes {cite:muruj-al-dhahab p. 439-440}."
  fr: "Al-Mas'udi présente les origines rivales des Kurdes: fils de Rabi'a ou de Mudar arabisés en langue montagnarde; femmes esclaves renvoyées par Salomon, chassées « kurrisewise » vers les collines; ou encore les cerveaux épargnés des serpents d'al-Dahhak, devenus sauvages — les Shuhajan des marches de Kufa-Basra se réclament de Rabi'a, les Majardan d'Azerbaïdjan se réclament de Mudar, les Ya'qubiyya et les Jurqan près de Jabal Judi sont chrétiens, et certains ont des opinions kharijites {cite:muruj-al-dhahab p. 439-440}."
  ur: "المسعودی نے کردوں کی حریف اصلیت بتائی: ربیعہ کے بیٹے یا مدر کے عرب پہاڑی تقریر میں۔ سلیمان کی برطرف شدہ لونڈیاں پہاڑیوں کی طرف 'کرسی کی سمت' چلی گئیں۔ یا الضحاک کے سانپوں کا بچا ہوا دماغ خراج تحسین - کوفہ بصرہ کے شوہاجان ربیعہ کا دعویٰ کرتے ہیں، آذربائیجان کے مجاردان مدر کا دعویٰ کرتے ہیں، جبل جودی کے قریب یعقوبیہ اور جرقان عیسائی ہیں، اور بعض خوارجی نظریات رکھتے ہیں۔ 439-440}۔"
  tr: "El-Mas'udi, Kürtlerin kökeni hakkındaki kitabında çeşitli görüşler aktarır: Bazıları, eski zamanlarda dağlarda ve vadilerde izole edilmiş olan ve dillerini yabancı bir dile çeviren Rabi'ah ibn Nizar'dan olduklarını söyler; her bir grubun Kürtçe konuştuğunu belirtir. Bazıları ise onları Kurd ibn Mard ibn Sa'sa'ah ibn Hawazin'in soyundan gelen Mudar'dan olduklarını düşünür. Bazıları, Süleyman'ın krallığını ele geçirdiğinde \"Onları dağlara Kürtleştirin\" dediği cariye kızlarından olduklarını ve bunun soylarının başlangıcı olduğunu söyler. Bazıları ise, ağızlı olan El-Dahhak'ın kurbanlarının beyinlerinden kaçanlardan olduklarını, dağlara sürüldüklerini, vahşileşip çoğaldıklarını söyler. En meşhur görüş ise Rabi'ah'ın soyundan olduklarıdır. Kufe ile Basra arasındaki topraklarda yaşayan Şevcacılar, Rabi'ah'tan olduklarını inkar etmezler. Majardanlar Azerbaycan'ın Kankur bölgesinden, Halbaniye ve Saratlar ise Mudar bölgesindendir. Bunların arasında Musul ve Cudi Dağı yakınlarında toprakları olan Hristiyanlar Ya'kubiye ve Jurkan da bulunmaktadır. Bunların arasında Haricilerin görüşünü benimseyenler de vardır."
  id: "Al-Mas'udi, dalam bukunya tentang asal usul Kurdi, mengutip beberapa pendapat: Ada yang mengatakan mereka berasal dari Rabi'ah ibn Nizar, yang terisolasi di zaman dahulu di pegunungan dan lembah, dan mereka mengubah bahasa mereka menjadi bahasa asing, dan setiap kelompok dari mereka memiliki bahasa Kurdi. Ada yang berpendapat mereka berasal dari Mudar, dari keturunan Kurd ibn Mard ibn Sa'sa'ah ibn Hawazin. Ada yang mengaitkan mereka dengan budak perempuan Sulaiman ketika ia merebut kerajaannya dan berkata, \"Kurdikan mereka ke pegunungan,\" dan itulah awal garis keturunan mereka. Ada yang berpendapat mereka berasal dari mereka yang lolos dari otak korban Al-Dahhak, yang bermulut besar, sehingga mereka diusir ke pegunungan, menjadi liar, dan berlipat ganda. Pendapat yang paling terkenal adalah bahwa mereka berasal dari keturunan Rabi'ah. Suku Shawhajan di wilayah antara Kufa dan Basra tidak menyangkal bahwa mereka berasal dari Rabi'ah. Suku Majardan berasal dari Kankur di Azerbaijan, dan suku Halbaniyah serta Sarat berasal dari Mudar. Di antara mereka terdapat suku Ya'qubiyah dan Jurqan, yaitu orang-orang Kristen yang tanahnya berada di dekat Mosul dan Gunung Judi. Di antara mereka juga terdapat orang-orang yang menganut pandangan Kharijites."
