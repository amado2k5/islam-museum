summary:
  ar: "مكناسة من بطون زناتة من قبائل البربر؛ مواطنهم الظواعن من أهل مواطن ملوية وكرسيف وسجلماسة والهبط، دان أهل مواطن سجلماسة منهم أول الإسلام بدين الصفرية من الخوارج واختطوا مدينة سجلماسة سنة 140هـ فكانت لهم دولتا بني واسول وبني أبي العافية ملوك تسول وفاس، وانقسمت رياستهم في فتن المغرب إلى أن استفحل أمر مغراوة عليهم ثم دولة المرابطين."
  en: "Miknasa of the Zanata, tent-dwelling Berbers of the Malwiyya, Karsif, Sijilmasa and Habat lands; the folk of Sijilmasa's site embraced the Sufrite creed early in Islam and founded the city in 140 AH, whence their two states — Banu Wasul and Banu Abi al-Afiya, kings of Tasul and Fez — until the Maghrawa and then the Almoravids overwhelmed them."
  es: "Miknasa de Zanata, bereberes que habitaban en tiendas de campaña en las tierras de Malwiyya, Karsif, Sijilmasa y Habat; la gente del sitio de Sijilmasa adoptó el credo sufrita temprano en el Islam y fundó la ciudad en el año 140 AH, de donde surgieron sus dos estados — Banu Wasul y Banu Abi al-Afiya, reyes de Tasul y Fez — hasta que los maghrawa y luego los almorávides los sometieron."
  fr: "Miknasa des Zanata, Berbères vivant sous des tentes des terres de Malwiyya, Karsif, Sijilmasa et Habat; les habitants du site de Sijilmasa ont embrassé la croyance soufrite au début de l'Islam et ont fondé la ville en 140 AH, d'où leurs deux États — Banu Wasul et Banu Abi al-Afiya, rois de Tasul et de Fez — jusqu'à ce que les Maghrawa puis les Almoravides les submergent."
  ur: "زناتا کا مکناسا، مالویہ کے خیمے میں رہنے والے بربر، کارسیف، سجلماسا اور حبات کی زمینیں؛ سجلماسا کے مقام کے لوگوں نے اسلام کے اوائل میں سفری عقیدہ کو قبول کیا اور 140 ہجری میں اس شہر کی بنیاد رکھی، جہاں سے ان کی دو ریاستیں بنو وصل اور بنو ابی العفیہ، تسول اور فیز کے بادشاہ - یہاں تک کہ مغروا اور پھر الموراوی ان پر غالب آگئے۔"
