  en: Miknasa
summary:
  ar: "مكناسة من بطون زناتة من قبائل البربر؛ مواطنهم الظواعن من أهل مواطن ملوية وكرسيف وسجلماسة والهبط، دان أهل مواطن سجلماسة منهم أول الإسلام بدين الصفرية من الخوارج واختطوا مدينة سجلماسة سنة 140هـ فكانت لهم دولتا بني واسول وبني أبي العافية ملوك تسول وفاس، وانقسمت رياستهم في فتن المغرب إلى أن استفحل أمر مغراوة عليهم ثم دولة المرابطين."
  en: "Miknasa of the Zanata, tent-dwelling Berbers of the Malwiyya, Karsif, Sijilmasa and Habat lands; the folk of Sijilmasa's site embraced the Sufrite creed early in Islam and founded the city in 140 AH, whence their two states — Banu Wasul and Banu Abi al-Afiya, kings of Tasul and Fez — until the Maghrawa and then the Almoravids overwhelmed them."
