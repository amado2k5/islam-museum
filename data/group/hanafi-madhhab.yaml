summary:
  ar: "أوسع المذاهب دائرة في استعمال الرأي عند أحمد أمين — لو رُسمت دوائر تمثل مقدار المذاهب في استعمال الرأي لكانت أصغرها دائرة الظاهرية ثم الحنابلة ثم المالكية ثم الشافعية ثم الحنفية {cite:duha-islam p. 502}؛ وقال الحنفية بالاستحسان — أن يترك الفقيه القياس إلى تقدير المسألة بمقتضى العدالة فيبحث عن العدالة المطلقة — وأنكره الشافعية وروي عن الشافعي في ذمه «من استحسن فقد شرّع» {cite:duha-islam p. 504}."
  en: "Widest of the schools in the use of ra'y — the largest circle in Ahmad Amin's diagram {cite:duha-islam p. 502}; champions of istihsan, which the Shafi'is rejected {cite:duha-islam p. 504}."
