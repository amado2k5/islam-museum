label:
  ar: المذهب الحنفي
  en: "The Hanafi school (madhhab)"
summary:
  ar: "المذهب الحنفي مدرسة فقهية منسوبة إلى أبي حنيفة، نشأت من مدرسة الكوفة القديمة وامتصت مدرسة البصرة، وكان أبو يوسف والشيباني أبرز من نقل علمه وأرسى متونه. نال حظوة الخلفاء العباسيين الأوائل، وانتشر في العراق والشام وخراسان وما وراء النهر وأفغانستان، وصار مذهب السلاجقة والعثمانيين الرسمي، وبقي له وضع رسمي في ولايات عثمانية سابقة. وهو عند أحمد أمين أوسع المذاهب دائرة في استعمال الرأي، وقال أصحابه بالاستحسان وأنكره الشافعية {cite:duha-islam p. 502} {cite:duha-islam p. 504}. ويذكر السايس أن أبا حنيفة كان يأخذ بالكتاب ثم بالسنة المشتهرة ثم بأقوال الصحابة، ثم يجتهد بالقياس والاستحسان {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 89-90}."
  en: "The Hanafi school is the legal school named after Abu Hanifa. It grew out of the ancient school of Kufa and absorbed that of Basra, with Abu Yusuf and al-Shaybani as its chief transmitters and authors of its standard texts. Favoured by the first Abbasid caliphs, it spread through Iraq, Syria, Khurasan, Transoxania and Afghanistan, became the school of the Seljuks and the Ottomans, and kept official status in former Ottoman provinces. Ahmad Amin calls it the widest of the schools in the use of opinion, and says its followers upheld istihsan, which the Shafi'is rejected {cite:duha-islam p. 502} {cite:duha-islam p. 504}. Al-Sayis says Abu Hanifa took the Book, then the well-known Sunna, then the Companions' sayings, then reasoned by analogy and istihsan {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 89-90}."
  ur: "حنفی مذہب ابو حنیفہ کی طرف منسوب فقہی مکتب ہے جو قدیم مکتبِ کوفہ سے نکلا اور اس نے مکتبِ بصرہ کو اپنے اندر سمو لیا؛ ابو یوسف اور شیبانی اس کے اہم ناقل اور معیاری متون کے مصنف تھے۔ اسے ابتدائی عباسی خلفا کی سرپرستی ملی، یہ عراق، شام، خراسان، ماوراء النہر اور افغانستان میں پھیلا، سلجوقیوں اور عثمانیوں کا مذہب بنا، اور سابق عثمانی صوبوں میں سرکاری حیثیت برقرار رکھی۔ احمد امین کے نزدیک یہ رائے کے استعمال میں سب سے وسیع مذہب ہے، اور حنفیہ استحسان کے قائل تھے جسے شافعیہ نے رد کیا {cite:duha-islam p. 502} {cite:duha-islam p. 504}. سایس کے بیان کے مطابق ابو حنیفہ کتاب، پھر مشہور سنت، پھر صحابہ کے اقوال لیتے، پھر قیاس اور استحسان سے اجتہاد کرتے {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 89-90}."
