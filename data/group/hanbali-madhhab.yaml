label:
  ar: المذهب الحنبلي
  en: "The Hanbali school (madhhab)"
  es: "La escuela Hanbali (madhhab)"
  fr: "L'école hanbalite (madhhab)"
  ur: "مکتب حنبلی ⁦(مذہب)⁩"
  tr: "Hanbeli düşünce ekolü"
  id: "Aliran pemikiran Hanbali"
summary:
  ar: أحد المذاهب الفقهية السنية الأربعة، يُنسب إلى الإمام أحمد بن حنبل، ويقوم على تقديم النص والأثر وفتاوى الصحابة، ثم حفظه وتدوينه تلاميذه من بعده وفي مقدمتهم الخلال والخرقي. ويذكر السايس أن الإمام أحمد كان يقدم النص الصحيح ثم فتاوى الصحابة، ويأخذ بالمرسل والحديث الضعيف قبل القياس، ولا يقدم عليه عملًا أو رأيًا {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 97-98}.
  en: "One of the four Sunni schools of law, named after Imam Ahmad ibn Hanbal; it gives precedence to the revealed text, transmitted reports and the fatwas of the Companions, and was preserved and written down by his students after him, foremost among them al-Khallal and al-Kharaqi."
  es: "Una de las cuatro escuelas de derecho sunitas, que lleva el nombre del Imam Ahmad ibn Hanbal; da precedencia al texto revelado, a los relatos transmitidos y a las fatuas de los Compañeros, y fue preservada y escrita por sus discípulos posteriores, entre los que destacan al-Khallal y al-Kharaqi."
  fr: "L'une des quatre écoles de droit sunnites, nommée d'après l'imam Ahmad ibn Hanbal; elle donne la priorité au texte révélé, aux hadiths transmis et aux fatwas des Compagnons, et a été préservée et mise par écrit par ses élèves après lui, parmi lesquels al-Khallal et al-Kharaqi."
  ur: "امام احمد بن حنبل کے نام سے منسوب چار سنی مکاتب فکر میں سے ایک؛ اس میں نازل شدہ متن، نقل شدہ رپورٹوں اور صحابہ کے فتاویٰ کو فوقیت دی گئی ہے، اور اسے ان کے بعد ان کے شاگردوں نے محفوظ کیا اور لکھا، ان میں سب سے پہلے الخلال اور الخراقی تھے۔"
  tr: "İmam Ahmed ibn Hanbel'e atfedilen dört Sünni fıkıh ekolünden biri, metne, rivayetlere ve Sahabelerin hukuki görüşlerine öncelik vermeye dayanmaktadır. Bu ekol daha sonra öğrencileri, özellikle el-Hallal ve el-Harki tarafından korunmuş ve derlenmiştir. El-Sayis, İmam Ahmed'in sahih metinlere ve Sahabelerin hukuki görüşlerine öncelik verdiğini, kıyas yoluyla akıl yürütmeden önce mursal hadisleri ve zayıf hadisleri kabul ettiğini ve hiçbir uygulama veya görüşe öncelik vermediğini belirtmektedir. {kaynak: Nashat-al-fiqh-al-ijtihadi-azhar s. 97-98}"
  id: "Salah satu dari empat mazhab fiqih Sunni, yang dinisbahkan kepada Imam Ahmad bin Hanbal, didasarkan pada pengutamaan teks, riwayat, dan pendapat hukum para Sahabat. Mazhab ini kemudian dipelihara dan dikompilasi oleh murid-muridnya, terutama al-Khallal dan al-Kharqi. Al-Sayis menyatakan bahwa Imam Ahmad mengutamakan teks-teks otentik dan pendapat hukum para Sahabat, dan beliau menerima hadits mursal dan hadits lemah sebelum penalaran analogis, dan beliau tidak mengutamakan praktik atau pendapat apa pun di atasnya. {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 97-98}"
