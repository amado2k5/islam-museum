summary:
  ar: أحد المذاهب الفقهية السنية الأربعة، يُنسب إلى الإمام أحمد بن حنبل، ويقوم على تقديم النص والأثر وفتاوى الصحابة، ثم حفظه وتدوينه تلاميذه من بعده وفي مقدمتهم الخلال والخرقي.
  en: "One of the four Sunni schools of law, named after Imam Ahmad ibn Hanbal; it gives precedence to the revealed text, transmitted reports and the fatwas of the Companions, and was preserved and written down by his students after him, foremost among them al-Khallal and al-Kharaqi."
