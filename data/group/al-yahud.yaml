summary:
  ar: "اليهود عند المصادر أهل التوراة من بني إسرائيل ومن دان بدينهم: قبائل يثرب بنو قينقاع والنضير وقريظة ويهود خيبر ونجران وغيرهم ممن عاصر البعثة في الحجاز؛ القرآن يسميهم «الذين هادوا» ويجمعهم مع النصارى والصابئين والمجوس في سورة الحج، وعقد النبي معهم وثيقة المدينة ثم وقعت الوقائع المعروفة ببني قينقاع والنضير وقريظة وخيبر {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  en: "Al-Yahud in the sources are the people of the Torah among Banu Isra'il and those who joined their faith: the tribes of Yathrib — Qaynuqa', al-Nadir and Qurayza — and the Jews of Khaybar and Najran and the others who met the Call in the Hijaz. The Qur'an calls them «those who are Jews» and gathers them with the Christians, the Sabians and the Magians in Surat al-Hajj; the Prophet made the Covenant of Medina with them, then came the affairs of Qaynuqa', al-Nadir, Qurayza and Khaybar {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  ur: "یہود مصادر میں اہلِ تورات بنی اسرائیل اور ان کے دین میں شامل ہونے والے ہیں: یثرب کے قبائل قینقاع، نضیر اور قریظہ، اور خیبر و نجران کے یہودی اور دیگر جو دعوت کے زمانے میں حجاز میں تھے؛ قرآن انہیں «جنہوں نے یہودیت اختیار کی» کہتا ہے اور سورۃ حج میں انہیں نصاریٰ، صابئین اور مجوس کے ساتھ جمع کرتا ہے؛ نبی نے ان سے میثاقِ مدینہ کیا پھر قینقاع، نضیر، قریظہ اور خیبر کے معروف واقعات پیش آئے۔"
  es: "En las fuentes, Al-Yahud son los seguidores de la Torá entre los Banu Isra'il y aquellos que se unieron a su fe: las tribus de Yathrib — Qaynuqa', al-Nadir y Qurayza — y los judíos de Khaybar y Najran y los demás que respondieron al Llamado en el Hiyaz. El Corán los llama «los que son judíos» y los reúne con los cristianos, los sabeos y los magos en la Sura al-Hajj; el Profeta hizo el Pacto de Medina con ellos, luego vinieron los asuntos de Qaynuqa', al-Nadir, Qurayza y Khaybar {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  fr: "Dans les sources, le terme « Yahud » désigne les gens de la Torah parmi les Banu Isra'il et ceux qui se sont convertis à leur foi: les tribus de Yathrib (Qaynuqa', al-Nadir et Qurayza), ainsi que les Juifs de Khaybar et de Najran et les autres qui ont répondu à l'appel dans le Hedjaz. Le Coran les appelle « ceux qui sont Juifs » et les regroupe avec les chrétiens, les Sabéens et les Mages dans la sourate al-Hajj. Le Prophète a conclu avec eux l'alliance de Médine, puis il a traité des affaires de Qaynuqa', d'al-Nadir, de Qurayza et de Khaybar."
  tr: "Kaynaklara göre Yahudiler, İsrailoğullarından olan Tevrat ehli ve onların dinini takip edenlerdir: Yathrib, Beni Kaynuka, Nadir, Kureyza kabileleri, Hayber ve Necran Yahudileri ve Hicaz'daki misyon döneminde yaşayan diğerleri. Kur'an onları \"Yahudi olanlar\" olarak adlandırır ve Hac Suresi'nde Hristiyanlar, Sabiiler ve Mecusilerle birlikte gruplandırır. Peygamber onlarla Medine Antlaşması'nı yaptı ve ardından Beni Kaynuka, Nadir, Kureyza ve Hayber savaşları olarak bilinen olaylar gerçekleşti. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
  id: "Menurut sumber-sumber, orang Yahudi adalah orang-orang yang mengikuti Taurat dari Bani Israel dan mereka yang menganut agama mereka: suku Yathrib, Banu Qaynuqa, Al-Nadir, Qurayza, orang Yahudi Khaybar dan Najran, dan lainnya yang hidup pada masa misi di Hijaz. Al-Qur'an menyebut mereka \"orang-orang yang menjadi Yahudi\" dan mengelompokkan mereka bersama dengan orang Kristen, Sabian, dan Majusi dalam Surah Al-Hajj. Nabi membuat Konstitusi Madinah bersama mereka, dan kemudian terjadilah peristiwa yang dikenal sebagai pertempuran Banu Qaynuqa, Al-Nadir, Qurayza, dan Khaybar. {cite:tafsir-tabari-shakir-v01} {cite:ibn-hisham-sira} {cite:mubarakpuri-raheeq}."
