label:
  ar: "الصحابة"
  en: "The Companions"
summary:
  ar: "الصحابة هم من انتموا إلى حلقة النبي محمد، وتعدّهم دائرة المعارف الإسلامية شخصيات محورية في تاريخ الإسلام المبكر ورواة موثوقين لأقواله وأفعاله في علم الرجال. وقد صُنّفوا في طبقات بحسب السبق إلى الإسلام والمشاركة في غزوات النبي، كما في طبقات ابن سعد، ويُقدَّم في الإسلام السني سبّهم ذنباً بحسب ما تعرضه المقالة. وقد جمعت تراجمهم معاجم منها الاستيعاب وأسد الغابة والإصابة."
  en: "The Companions are those who belonged to the circle of the Prophet Muhammad; the Encyclopaedia of Islam calls them key figures of early Islamic history and reliable transmitters of his words and deeds in the science of men. They were ranked in classes by precedence in Islam and by share in his campaigns, as in Ibn Sa'd's Tabaqat, and the article reports that in Sunni Islam abuse of them is considered a sin. Dictionaries such as al-Istiab, Usd al-ghaba and al-Isaba collect their biographies."
  ur: "صحابہ وہ افراد ہیں جو نبی محمد کے حلقے سے وابستہ تھے؛ انسائیکلوپیڈیا آف اسلام انہیں ابتدائی اسلامی تاریخ کی کلیدی شخصیات اور علم الرجال میں ان کے اقوال و افعال کے معتبر راوی قرار دیتا ہے۔ ابن سعد کی طبقات کی طرح انہیں اسلام میں سبقت اور مہمات میں شرکت کے لحاظ سے طبقوں میں رکھا گیا، اور مقالے کے مطابق سنی اسلام میں انہیں برا کہنا گناہ سمجھا جاتا ہے۔ الاستیعاب، اسد الغابہ اور الاصابہ جیسی لغات ان کے حالات جمع کرتی ہیں."
