label:
  ar: "الصحابة"
  en: "The Companions"
  es: "Los Compañeros"
  fr: "Les Compagnons"
  ur: "صحابہ کرام"
  tr: "Yoldaşlar"
  id: "Sahabat"
summary:
  ar: "الصحابة هم من انتموا إلى حلقة النبي محمد، وتعدّهم دائرة المعارف الإسلامية شخصيات محورية في تاريخ الإسلام المبكر ورواة موثوقين لأقواله وأفعاله في علم الرجال. وقد صُنّفوا في طبقات بحسب السبق إلى الإسلام والمشاركة في غزوات النبي، كما في طبقات ابن سعد، ويُقدَّم في الإسلام السني سبّهم ذنباً بحسب ما تعرضه المقالة. وقد جمعت تراجمهم معاجم منها الاستيعاب وأسد الغابة والإصابة."
  en: "The Companions are those who belonged to the circle of the Prophet Muhammad; the Encyclopaedia of Islam calls them key figures of early Islamic history and reliable transmitters of his words and deeds in the science of men. They were ranked in classes by precedence in Islam and by share in his campaigns, as in Ibn Sa'd's Tabaqat, and the article reports that in Sunni Islam abuse of them is considered a sin. Dictionaries such as al-Istiab, Usd al-ghaba and al-Isaba collect their biographies."
  ur: "صحابہ وہ افراد ہیں جو نبی محمد کے حلقے سے وابستہ تھے؛ انسائیکلوپیڈیا آف اسلام انہیں ابتدائی اسلامی تاریخ کی کلیدی شخصیات اور علم الرجال میں ان کے اقوال و افعال کے معتبر راوی قرار دیتا ہے۔ ابن سعد کی طبقات کی طرح انہیں اسلام میں سبقت اور مہمات میں شرکت کے لحاظ سے طبقوں میں رکھا گیا، اور مقالے کے مطابق سنی اسلام میں انہیں برا کہنا گناہ سمجھا جاتا ہے۔ الاستیعاب، اسد الغابہ اور الاصابہ جیسی لغات ان کے حالات جمع کرتی ہیں."
  es: "Los Compañeros son aquellos que pertenecieron al círculo del Profeta Mahoma; la Enciclopedia del Islam los considera figuras clave de la historia temprana del Islam y transmisores fiables de sus palabras y acciones en la ciencia humana. Se les clasificó según su precedencia en el Islam y su participación en sus campañas, como en el Tabaqat de Ibn Sa'd, y el artículo señala que en el Islam sunita, el abuso contra ellos se considera un pecado. Diccionarios como al-Istiab, Usd al-ghaba y al-Isaba recogen sus biografías."
  fr: "Les Compagnons sont ceux qui appartenaient au cercle du Prophète Muhammad. L'Encyclopédie de l'Islam les considère comme des figures clés des débuts de l'histoire islamique et des transmetteurs fiables de ses paroles et de ses actes, contribuant ainsi à la science des hommes. Ils étaient hiérarchisés selon leur importance dans l'islam et leur rôle dans ses campagnes, comme dans les Tabaqat d'Ibn Sa'd. L'article précise qu'en islam sunnite, toute insulte à leur égard est considérée comme un péché. Des dictionnaires tels qu'al-Istiab, Usd al-ghaba et al-Isaba recensent leurs biographies."
  tr: "Sahabe, Hz. Muhammed'in çevresine mensup olanlardır. İslam Ansiklopedisi onları erken İslam tarihinin kilit isimleri ve biyografik değerlendirme (ilm al-rijal) alanında Peygamberin sözlerinin ve fiillerinin güvenilir rivayetçileri olarak kabul eder. İbn Sa'd'ın Tabaqat'ında olduğu gibi, İslam'ı kabul etmedeki önceliklerine ve Peygamberin savaşlarına katılımlarına göre sınıflara ayrılmışlardır. Bu makalede açıklandığı gibi, Sünni İslam'da onlara hakaret etmek günah sayılır. Biyografileri, el-İsti'ab, Usd al-Ghabah ve el-İsabah gibi sözlüklerde derlenmiştir."
  id: "Para Sahabat adalah mereka yang termasuk dalam lingkaran Nabi Muhammad. Ensiklopedia Islam menganggap mereka sebagai tokoh penting dalam sejarah Islam awal dan perawi yang dapat diandalkan atas ucapan dan perbuatan beliau dalam bidang evaluasi biografi (ilm al-rijal). Mereka diklasifikasikan ke dalam kelas-kelas berdasarkan prioritas mereka dalam memeluk Islam dan partisipasi mereka dalam peperangan Nabi, seperti dalam Tabaqat karya Ibn Sa'd. Dalam Islam Sunni, mencela mereka dianggap sebagai dosa, seperti yang dijelaskan dalam artikel ini. Biografi mereka telah dikumpulkan dalam kamus-kamus seperti al-Isti'ab, Usd al-Ghabah, dan al-Isabah."
