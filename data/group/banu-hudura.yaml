label: { ar: "بنو حضورا", en: "Banu Hudura", es: "Banu Hudura", fr: "Banu Hudura", ur: "بنو ہدرہ" }
summary:
  ar: "أمة عظيمة ذات بطش غلبت على كثير من الأرض عند المسعودي، تنازع الناس في نسبهم فألحقهم قوم بالعرب البائدة ورأى آخرون أنهم من ولد يافث، بعث الله إليهم شعيب بن مهدم نبياً وهو غير شعيب صاحب مدين وبينهما مئون من السنين فقتلوه، فأوحى الله إلى برخيا بن أخبيا من سبط يهوذا أن يأمر بختنصر بغزو العرب الذين لا أغلاق لبيوتهم فسار إليهم وصاح بهم صائح من السماء فانفضت جنودهم وأخذهم السيف فحصدوا أجمعين، وتنوزع في ديارهم فرأى قوم أنهم كانوا بأرض السماوة بين العراق والشام وآخرون ببلاد جند قنسرين إلى تل ماسح وخناصرة {cite:muruj-al-dhahab p. 464-465}."
  en: "A mighty extinct nation — Arabs or Japhetic, the sources differed — who killed their prophet Shu'ayb ibn Mihdam (not Shu'ayb of Madyan); at the prophet Barkhya's word Bukhtanassar marched on 'the Arabs whose houses have no bolts' and a heavenly caller scattered them to the sword; their lands are placed at al-Samawa or in Qinnasrin toward Tall Masikh {cite:muruj-al-dhahab p. 464-465}."
  es: "Una poderosa nación extinta —árabes o jaféticos, las fuentes difieren— que mató a su profeta Shu'ayb ibn Mihdam (no Shu'ayb de Madyan); por orden del profeta Barkhya, Bukhtanassar marchó sobre \"los árabes cuyas casas no tienen cerrojos\" y un llamador celestial los dispersó a espada; sus tierras se ubican en al-Samawa o en Qinnasrin hacia Tall Masikh {cite:muruj-al-dhahab p. 464-465}."
  fr: "Une puissante nation éteinte — les Arabes ou les Japhetiques, les sources divergent — qui tua son prophète Shu'ayb ibn Mihdam (et non Shu'ayb de Madyan); sur l'ordre du prophète Barkhya, Bukhtanassar marcha sur « les Arabes dont les maisons n'ont pas de verrous » et un appel céleste les dispersa à l'épée; leurs terres sont situées à al-Samawa ou à Qinnasrin vers Tall Masikh {cite: muruj-al-dhahab p. 464-465}."
  ur: "ایک زبردست معدوم قوم - عرب یا جافتی، ذرائع میں اختلاف تھا - جس نے اپنے نبی شعیب ابن محدم ⁦(مدین کے شعیب کو نہیں)⁩ کو قتل کیا؛ نبی برخیا کے کلام میں بختنصر نے 'ان عربوں پر جن کے گھروں میں کوئی تختہ نہیں ہے' پر چڑھائی کی اور ایک آسمانی پکارنے والے نے انہیں تلوار سے بکھیر دیا۔ ان کی زمینیں السماوۃ یا قنصرین میں قد مسیخ کی طرف رکھی گئی ہیں۔ 464-465}۔"
