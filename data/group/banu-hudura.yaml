label: { ar: "بنو حضورا", en: "Banu Hudura" }
summary:
  ar: "أمة عظيمة ذات بطش غلبت على كثير من الأرض عند المسعودي، تنازع الناس في نسبهم فألحقهم قوم بالعرب البائدة ورأى آخرون أنهم من ولد يافث، بعث الله إليهم شعيب بن مهدم نبياً وهو غير شعيب صاحب مدين وبينهما مئون من السنين فقتلوه، فأوحى الله إلى برخيا بن أخبيا من سبط يهوذا أن يأمر بختنصر بغزو العرب الذين لا أغلاق لبيوتهم فسار إليهم وصاح بهم صائح من السماء فانفضت جنودهم وأخذهم السيف فحصدوا أجمعين، وتنوزع في ديارهم فرأى قوم أنهم كانوا بأرض السماوة بين العراق والشام وآخرون ببلاد جند قنسرين إلى تل ماسح وخناصرة {cite:muruj-al-dhahab p. 464-465}."
  en: "A mighty extinct nation — Arabs or Japhetic, the sources differed — who killed their prophet Shu'ayb ibn Mihdam (not Shu'ayb of Madyan); at the prophet Barkhya's word Bukhtanassar marched on 'the Arabs whose houses have no bolts' and a heavenly caller scattered them to the sword; their lands are placed at al-Samawa or in Qinnasrin toward Tall Masikh {cite:muruj-al-dhahab p. 464-465}."
