id: group/jahmiyya
education:
  did_you_know:
    ar: "الجهمية فرقة كلامية تُنسب إلى جهم، تقول في القرآن والصفات أقوالاً؛ ينقل ابن بدران مقالاتهم كما رواها أهل العلم عنهم."
    en: "The Jahmiyya, a kalam school named for Jahm, took positions on the Qur'an and the attributes; Ibn Badran relays their doctrines as the scholars transmitted them."
    ur: "جہمیہ، جہم سے منسوب علمِ کلام کا فرقہ، نے قرآن اور صفات کے بارے میں اقوال کہے؛ ابن بدران ان کے مذہبی عقائد کو وہی بیان کرتا ہے جو علماء نے نقل کیا۔"
    sources: [source/madkhal-ibn-badran-turki, source/lumat-al-itiqad-ibn-uraiyir-2022]
class: group
kind: sect
label:
  ar: الجهمية
  en: "Jahmiyya"
issue:
  ar: ما قول الجهمية في القرآن والكلام الإلهي، وكيف يحكم أهل العلم على من قال به؟
summary:
  ar: فرقة كلامية تُنسب إلى جهم، تقول في القرآن والصفات أقوالاً؛ ويصف الكتاب مقالاتهم كما نقلها أهل العلم الذين أدركهم المؤلف، ولم تُضف بعد أقوالهم بألفاظهم.
  en: "A kalam sect named after Jahm, holding views on the Qur'an and the divine attributes; the book describes their positions as the scholars whom the author knew relayed them, and their own wording has not yet been added."
