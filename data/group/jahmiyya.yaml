issue:
  ar: ما قول الجهمية في القرآن والكلام الإلهي، وكيف يحكم أهل العلم على من قال به؟
summary:
  ar: فرقة كلامية تُنسب إلى جهم، تقول في القرآن والصفات أقوالاً؛ ويصف الكتاب مقالاتهم كما نقلها أهل العلم الذين أدركهم المؤلف، ولم تُضف بعد أقوالهم بألفاظهم. ويذكر ابن حزم في كتاب التوحيد أن جهم بن صفوان وأصحابه زعموا أن علم الله تعالى غير الله وهو محدث مخلوق، واحتج جهم بأن علمه إن كان لم يزل فإما غيره فيلزم تشريك أزلي وإما هو فيلزم أن يكون الله علماً وهو إلحاد، فرد ابن حزم بأن قولهم إن الله ليس بعلم مخالف للقرآن وما خالفه باطل، وأن هذه الاعتراضات اعتراضات الجهمية والأشعرية معاً {cite:fisal-ibn-hazm-kotobarabia p. 622-624}.
  en: "A kalam sect named after Jahm, holding views on the Qur'an and the divine attributes; the book describes their positions as the scholars whom the author knew relayed them, and their own wording has not yet been added. In the Book of Tawhid Ibn Hazm reports that Jahm ibn Safwan and his followers held God's knowledge to be other than God and created, Jahm arguing that if it is eternal it is either another eternal entity — association — or God himself — which he calls deviation; Ibn Hazm answers that denying God is knowing contradicts the Qur'an and is void, and that these objections are shared by the Jahmiyya and the Ash'aris {cite:fisal-ibn-hazm-kotobarabia p. 622-624}."
  es: "Una secta kalam que lleva el nombre de Jahm, con puntos de vista sobre el Corán y los atributos divinos; el libro describe sus posturas según las transmitieron los eruditos que el autor conocía, y aún no se ha añadido su propia redacción. En el Libro del Tawhid, Ibn Hazm relata que Jahm ibn Safwan y sus seguidores sostenían que el conocimiento de Dios era distinto de Dios y creado, argumentando Jahm que si es eterno, se trata de otra entidad eterna —una asociación— o de Dios mismo —a lo que él llama desviación—; Ibn Hazm responde que negar que Dios sea conocimiento contradice el Corán y es nulo, y que estas objeciones son compartidas por los Jahmiyya y los Ash'aris {cite:fisal-ibn-hazm-kotobarabia p. 622-624}."
  fr: "Une secte kalam, nommée d'après Jahm, défendait des conceptions du Coran et des attributs divins. L'ouvrage décrit leurs positions telles que transmises par les savants connus de l'auteur, sans y inclure leurs propres formulations. Dans le Livre du Tawhid, Ibn Hazm rapporte que Jahm ibn Safwan et ses disciples considéraient la connaissance divine comme autre que Dieu et créée. Jahm soutenait que si elle était éternelle, il s'agissait soit d'une autre entité éternelle – l'association – soit de Dieu lui-même, ce qu'il qualifiait de déviation. Ibn Hazm rétorqua que nier la connaissance divine contredisait le Coran et était vain, et que ces objections étaient partagées par les Jahmiyya et les Ash'arites (cf. Fisal Ibn Hazm Kotobarabia, p. 622-624)."
  ur: "ایک کلام فرقہ جس کا نام جہم کے نام پر رکھا گیا ہے، جو قرآن اور خدائی صفات کے بارے میں خیالات رکھتا ہے۔ کتاب میں ان کے موقف کو اسکالرز کے طور پر بیان کیا گیا ہے جن کو مصنف جانتا تھا، اور ان کے اپنے الفاظ کو ابھی تک شامل نہیں کیا گیا ہے۔ کتاب توحید میں ابن حزم کی رپورٹ ہے کہ جہم ابن صفوان اور اس کے پیروکاروں نے خدا کے علم کو خدا کے علاوہ اور تخلیق کیا، جہم نے دلیل دی کہ اگر یہ ابدی ہے تو یہ یا تو کوئی اور ابدی ہستی ہے - انجمن - یا خود خدا - جسے وہ انحراف کہتے ہیں۔ ابن حزم کا جواب ہے کہ خدا کا انکار کرنا قرآن سے متصادم ہے اور باطل ہے، اور یہ اعتراضات جہمیہ اور اشعری کے درمیان مشترک ہیں {حوالہ: فصال ابن حزم قطبرابیہ ص۱۲۲۔ 622-624}۔"
  tr: "Cahm'a atfedilen bir teolojik mezhep, Kur'an ve ilahi sıfatlar konusunda belirli görüşlere sahipti. Kitap, yazarın karşılaştığı alimlerden aktarılan bu görüşleri, tam sözlerini eklemeden anlatıyor. İbn Hazm, tevhid üzerine yazdığı kitabında, Cahm ibn Safvan ve takipçilerinin Tanrı'nın bilgisinin Tanrı'dan ayrı ve yaratılmış olduğunu iddia ettiklerini belirtiyor. Cahm, eğer O'nun bilgisi ebediyse, ya O'ndan ayrıdır ki bu ebedi çok tanrıcılığı gerektirir, ya da O'nun kendisidir ki bu da Tanrı'nın bilgi olduğu anlamına gelir ki bu da sapkınlıktır diye savundu. İbn Hazm, Tanrı'nın bilgi olmadığı iddiasını, Kur'an'a aykırı olduğunu ve Kur'an'a aykırı olan her şeyin yanlış olduğunu belirterek reddetti. Ayrıca bu itirazların hem Cahmîlerin hem de Eş'arilerin itirazları olduğunu belirtti. {cite:fisal-ibn-hazm-kotobarabia s. 622-624}"
  id: "Sebuah sekte teologis yang dikaitkan dengan Jahm memiliki pandangan tertentu mengenai Al-Qur'an dan sifat-sifat ilahi. Buku ini menggambarkan pernyataan mereka sebagaimana yang disampaikan oleh para ulama yang ditemui penulis, tanpa menambahkan kata-kata persis mereka. Ibn Hazm menyebutkan dalam bukunya tentang monoteisme bahwa Jahm ibn Safwan dan para pengikutnya mengklaim bahwa pengetahuan Tuhan berbeda dari Tuhan dan merupakan ciptaan. Jahm berpendapat bahwa jika pengetahuan-Nya abadi, maka pengetahuan itu berbeda dari-Nya, yang akan memerlukan politeisme abadi, atau pengetahuan itu adalah Dia, yang akan menyiratkan bahwa Tuhan adalah pengetahuan, yang merupakan bid'ah. Ibn Hazm membantah klaim mereka bahwa Tuhan bukanlah pengetahuan, dengan menyatakan bahwa hal itu bertentangan dengan Al-Qur'an, dan apa pun yang bertentangan dengannya adalah salah. Ia lebih lanjut menyatakan bahwa keberatan-keberatan ini adalah keberatan dari kaum Jahmiyah dan kaum Asy'ariyah. {cite:fisal-ibn-hazm-kotobarabia hlm. 622-624}"
