summary:
  ar: "زواوة من بطون كتامة، من أكبر بطون البربر؛ مواطنهم الجبال الشاهقة والأوعار المتسنمة المحتفة ببجاية إلى تدلس، ولهم بطون كثيرة وكانوا أهل وطيس وشدة بأس في فتن المغرب، ونازعوا ملوك بني حماد بالقلعة والزيريين وبني عبد الواد، واستقام أمرهم في جبالهم على جرى أهل الجبال إلى عهد ابن خلدون."
  en: "Zawawa of the Kutama, among the greatest Berber branches; their homeland the soaring peaks and forbidding highlands around Bijaya to Tidels — many clans, folk of the fray and mighty prowess in the Maghreb's fitnas, who contested the Hammadids of the Qal'a, the Zirids and the Abd al-Wadids, and kept their mountain ways to Ibn Khaldun's day."
