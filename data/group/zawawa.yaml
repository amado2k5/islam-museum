summary:
  ar: "زواوة من بطون كتامة، من أكبر بطون البربر؛ مواطنهم الجبال الشاهقة والأوعار المتسنمة المحتفة ببجاية إلى تدلس، ولهم بطون كثيرة وكانوا أهل وطيس وشدة بأس في فتن المغرب، ونازعوا ملوك بني حماد بالقلعة والزيريين وبني عبد الواد، واستقام أمرهم في جبالهم على جرى أهل الجبال إلى عهد ابن خلدون."
  en: "Zawawa of the Kutama, among the greatest Berber branches; their homeland the soaring peaks and forbidding highlands around Bijaya to Tidels — many clans, folk of the fray and mighty prowess in the Maghreb's fitnas, who contested the Hammadids of the Qal'a, the Zirids and the Abd al-Wadids, and kept their mountain ways to Ibn Khaldun's day."
  es: "Los Zawawa de Kutama, una de las ramas bereberes más importantes; su tierra natal, los picos altísimos y las tierras altas inhóspitas que rodean Bijaya hasta Tidels: muchos clanes, gente de la contienda y de gran poderío en las fitnas del Magreb, que desafiaron a los Hammadids de Qal'a, los Zirids y los Abd al-Wadids, y mantuvieron sus costumbres de montaña hasta los días de Ibn Khaldun."
  fr: "Les Zawawa des Kutama, parmi les plus grandes branches berbères; leur patrie les pics vertigineux et les hauts plateaux inhospitaliers autour de Bijaya jusqu'à Tidels — de nombreux clans, gens de la mêlée et d'une grande prouesse dans les fitnas du Maghreb, qui ont contesté les Hammadides de Qal'a, les Zirides et les Abd al-Wadids, et ont conservé leurs coutumes montagnardes jusqu'à l'époque d'Ibn Khaldun."
  ur: "کوٹاما کا زاوا، بربر کی سب سے بڑی شاخوں میں سے؛ ان کا آبائی وطن بیجیا کے ارد گرد بلند چوٹیاں اور ممنوعہ پہاڑی علاقوں سے ٹائیڈلس تک - بہت سے قبیلے، میدان کے لوگ اور مغرب کے فتنوں میں زبردست طاقت، جنہوں نے قلعہ کے حمادیوں، زردوں اور عبد الودیدوں سے مقابلہ کیا، اور ابن خلدون تک اپنے پہاڑی راستوں کو برقرار رکھا۔"
  tr: "Zawawa, Berberilerin en büyük kollarından biri olan Kutama'nın bir koludur. Anavatanları, Bejaia'dan Tadlas'a kadar uzanan yüksek dağlar ve engebeli, eğimli arazidir. Birçok kola ayrılmışlardır ve Mağrip'teki çatışmalarda büyük güç ve kudrete sahip bir halk olmuşlardır. Kalâ'daki Beni Hammad kralları, Ziridler ve Beni Abdülvad krallarıyla çekişmişler ve İbn Haldun dönemine kadar dağ halklarının geleneklerine göre işleri dağlarında çözülmüştür."
  id: "Suku Zawawa adalah salah satu cabang dari Kutama, salah satu cabang terbesar dari suku Berber. Tanah asal mereka adalah pegunungan yang menjulang tinggi dan medan yang terjal dan berlereng di sekitar Bejaia hingga Tadlas. Mereka memiliki banyak cabang dan merupakan orang-orang yang sangat kuat dan perkasa dalam konflik di Maghreb. Mereka berselisih dengan raja-raja Banu Hammad di Qala’a, Zirid, dan Banu Abd al-Wad, dan urusan mereka diselesaikan di pegunungan mereka sesuai dengan adat istiadat penduduk pegunungan hingga zaman Ibnu Khaldun."
