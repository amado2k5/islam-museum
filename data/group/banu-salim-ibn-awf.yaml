label: { ar: "بنو سالم بن عوف", en: "Banu Salim ibn Awf" }
summary:
  ar: "عشيرة من الخزرج بيثرب؛ منها مالك بن الدخشم الذي كُلّف بهدم مسجد الضرار، وأبو خيثمة بحسب ابن إسحاق. وعند السمهودي نزلوا دارهم على طرف الحرة الغربية غربي الوادي الذي به مسجد الجمعة ببطن رانونا، وابتنوا آطاماً منها «المزدلف» الذي بناه عتبان بن مالك، و«الشماخ» خارج بيوتهم جهة القبلة، و«القواقل» بطرف بيوتهم — سُموا بذلك لأنهم كانوا إذا أجاروا جاراً قالوا له «قوكل حيث شئت» أي ارتق {cite:samhudi-wafa-al-wafa p. 211-212}."
  en: "A Khazrajite clan of Yathrib; it includes Malik ibn al-Dukhshum, who was charged with demolishing Masjid al-Dirar, and Abu Khaythama, according to Ibn Ishaq. In al-Samhudi they held their quarter at the edge of the western Harra west of the valley of the Friday mosque at Batn Ranuna, and built the utum al-Muzdalif (built by Utban ibn Malik), al-Shamakh outside their houses to the south, and al-Qawaqil — so named because when they granted protection they told the refugee 'quqil where you will', climb up {cite:samhudi-wafa-al-wafa p. 211-212}."
