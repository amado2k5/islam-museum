summary:
  ar: "عشيرة من الخزرج بيثرب؛ منها مالك بن الدخشم الذي كُلّف بهدم مسجد الضرار، وأبو خيثمة بحسب ابن إسحاق. وعند السمهودي نزلوا دارهم على طرف الحرة الغربية غربي الوادي الذي به مسجد الجمعة ببطن رانونا، وابتنوا آطاماً منها «المزدلف» الذي بناه عتبان بن مالك، و«الشماخ» خارج بيوتهم جهة القبلة، و«القواقل» بطرف بيوتهم — سُموا بذلك لأنهم كانوا إذا أجاروا جاراً قالوا له «قوكل حيث شئت» أي ارتق {cite:samhudi-wafa-al-wafa p. 211-212}."
  en: "A Khazrajite clan of Yathrib; it includes Malik ibn al-Dukhshum, who was charged with demolishing Masjid al-Dirar, and Abu Khaythama, according to Ibn Ishaq. In al-Samhudi they held their quarter at the edge of the western Harra west of the valley of the Friday mosque at Batn Ranuna, and built the utum al-Muzdalif (built by Utban ibn Malik), al-Shamakh outside their houses to the south, and al-Qawaqil — so named because when they granted protection they told the refugee 'quqil where you will', climb up {cite:samhudi-wafa-al-wafa p. 211-212}."
  es: "Un clan de Khazraj de Yathrib; incluye a Malik ibn al-Dukhshum, quien fue acusado de demoler Masjid al-Dirar, y a Abu Khaythama, según Ibn Ishaq. En al-Samhudi tenían su barrio en el borde del Harra occidental al oeste del valle de la mezquita del viernes en Batn Ranuna, y construyeron el utum al-Muzdalif (construido por Utban ibn Malik), al-Shamakh fuera de sus casas al sur, y al-Qawaqil, llamado así porque cuando otorgaban protección le decían al refugiado 'quqil donde quieras, sube' {cite:samhudi-wafa-al-wafa p. 211-212}."
  fr: "Un clan khazrajitite de Yathrib; il comprend Malik ibn al-Dukhshum, accusé de la démolition de la mosquée al-Dirar, et Abu Khaythama, selon Ibn Ishaq. À al-Samhudi, ils occupaient leur quartier à la limite ouest de Harra, à l'ouest de la vallée de la mosquée du vendredi de Batn Ranuna, et y construisirent l'utum al-Muzdalif (édifié par Utban ibn Malik), al-Shamakh à l'extérieur de leurs maisons au sud, et al-Qawaqil — ainsi nommé car, lorsqu'ils accordaient protection, ils disaient au réfugié: « quqil où tu veux », grimpe {cite:samhudi-wafa-al-wafa p. 211-212}."
  ur: "یثرب کا ایک خزرج قبیلہ؛ اس میں مالک ابن الدخشم بھی شامل ہیں جن پر مسجد الدیر کو مسمار کرنے کا الزام تھا اور ابن اسحاق کے مطابق ابو خیثمہ۔ السمھودی میں انہوں نے اپنا کوارٹر مغربی حررہ کے مغرب میں جمعہ کی مسجد کی وادی بطن رنونا کے کنارے پر رکھا، اور اتم المزدلف ⁦(جس کو عتبان ابن مالک نے تعمیر کیا تھا)⁩، جنوب میں اپنے گھروں کے باہر الشمخ، اور القوقیل - اس لیے آپ کا نام رکھا کیونکہ جب انہوں نے کہا کہ آپ کو تحفظ فراہم کیا جائے گا، تو انہوں نے یہ نام رکھا۔ چڑھنا {حوالہ:سمہدی-وفا-الوفا صفحہ 211-212}۔"
  tr: "Yathrib'de Hazrec kabilesinden bir grup; aralarında, İbn İshak'a göre, Mescid-i Şerif'i yıkmakla görevlendirilen Malik ibn el-Dukhşam ve Ebu Haytama da vardı. El-Samhudi'ye göre, Ranun Vadisi'ndeki Cuma Camii'nin bulunduğu vadinin batısında, batı lav alanının kenarındaki evlerine yerleştiler ve Utban ibn Malik tarafından inşa edilen \"el-Muzdalif\" ve kıbleye doğru evlerinin dışında bulunan \"el-Şammakh\" ve evlerinin kenarında bulunan \"el-Kawaqil\" de dahil olmak üzere müstahkem evler inşa ettiler. Bu evlere, bir komşularına koruma sağladıklarında \"Kawaqil, dilediğin yere git\" yani \"Yukarı çık\" derlerdi. {kaynak:samhudi-wafa-al-wafa s. 211-212}"
  id: "Sebuah klan Khazraj di Yathrib; di antara mereka adalah Malik ibn al-Dukhsham, yang ditugaskan untuk menghancurkan Masjid Perselisihan, dan Abu Khaythama, menurut Ibn Ishaq. Menurut al-Samhudi, mereka menetap di rumah mereka di tepi ladang lava barat, di sebelah barat lembah tempat Masjid Jumat berada di lembah Ranuna, dan mereka membangun rumah-rumah berbenteng, termasuk “al-Muzdalif,” yang dibangun oleh Utban ibn Malik, dan “al-Shammakh,” di luar rumah mereka menghadap kiblat, dan “al-Qawaqil,” di tepi rumah mereka—mereka dinamai demikian karena ketika mereka memberikan perlindungan kepada tetangga, mereka akan berkata kepadanya, “Qawqil, ke mana pun kau mau,” yang berarti, “Naiklah.” {cite:samhudi-wafa-al-wafa hlm. 211-212}."
