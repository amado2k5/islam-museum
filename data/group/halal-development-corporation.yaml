label:
  ar: مؤسسة تنمية الحلال الماليزية
  en: Halal Development Corporation (HDC)
  ur: حلال ڈیولپمنٹ کارپوریشن ملائیشیا
summary:
  ar: وكالة حكومية اتحادية ماليزية أُسست في 18 سبتمبر 2006 أمينةً على اقتصاد الحلال في ماليزيا، تنسق تطوير المعايير والتصديق
    والصناعة، ووضعت الخطة الرئيسة لصناعة الحلال 2030، وهي أمانة مجلس تنمية صناعة الحلال.
  en: A Malaysian federal government agency founded on 18 September 2006 as custodian of Malaysia's halal economy, coordinating
    standards, certification and industry development; it drew up the Halal Industry Master Plan 2030 and is secretariat of
    the Halal Industry Development Council.
  ur: ملائیشیا کی وفاقی سرکاری ایجنسی، جو 18 ستمبر 2006 کو ملائیشیا کی حلال معیشت کی نگہبان کے طور پر قائم ہوئی؛ معیارات،
    سرٹیفکیشن اور صنعت کی ترقی میں رابطہ کرتی ہے، اور حلال انڈسٹری ماسٹر پلان 2030 اسی نے بنایا۔
