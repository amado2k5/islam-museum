kind: standards-body
label:
  ar: مؤسسة تنمية الحلال الماليزية
  en: Halal Development Corporation (HDC)
  ur: حلال ڈیولپمنٹ کارپوریشن ملائیشیا
  es: "Corporación de Desarrollo Halal (HDC)"
  fr: "Société de développement halal (HDC)"
  tr: "Malezya Helal Geliştirme Kurumu"
  id: "Perusahaan Pengembangan Halal Malaysia"
summary:
  ar: وكالة حكومية اتحادية ماليزية أُسست في 18 سبتمبر 2006 أمينةً على اقتصاد الحلال في ماليزيا، تنسق تطوير المعايير والتصديق
    والصناعة، ووضعت الخطة الرئيسة لصناعة الحلال 2030، وهي أمانة مجلس تنمية صناعة الحلال.
  en: A Malaysian federal government agency founded on 18 September 2006 as custodian of Malaysia's halal economy, coordinating
    standards, certification and industry development; it drew up the Halal Industry Master Plan 2030 and is secretariat of
    the Halal Industry Development Council.
  ur: ملائیشیا کی وفاقی سرکاری ایجنسی، جو 18 ستمبر 2006 کو ملائیشیا کی حلال معیشت کی نگہبان کے طور پر قائم ہوئی؛ معیارات،
    سرٹیفکیشن اور صنعت کی ترقی میں رابطہ کرتی ہے، اور حلال انڈسٹری ماسٹر پلان 2030 اسی نے بنایا۔
  es: "Agencia del gobierno federal de Malasia, fundada el 18 de septiembre de 2006 como responsable de la economía halal de Malasia, coordinando normas, certificación y desarrollo del sector; elaboró el Plan Maestro de la Industria Halal 2030 y es la secretaría del Consejo de Desarrollo de la Industria Halal."
  fr: "Une agence du gouvernement fédéral malaisien fondée le 18 septembre 2006 en tant que gardienne de l'économie halal de la Malaisie, coordonnant les normes, la certification et le développement de l'industrie; elle a élaboré le Plan directeur de l'industrie halal 2030 et assure le secrétariat du Conseil de développement de l'industrie halal."
  tr: "Malezya'da helal ekonominin koruyucusu olarak 18 Eylül 2006'da kurulan Malezya federal hükümet kurumu, standartların, sertifikasyonun ve endüstrinin geliştirilmesini koordine etmekte ve 2030 helal endüstrisi için ana planı belirlemiştir; bu kurum Helal Endüstri Geliştirme Kurulu Sekreterliği'dir."
  id: "Badan pemerintah federal Malaysia yang didirikan pada 18 September 2006, sebagai pengelola ekonomi halal di Malaysia, mengkoordinasikan pengembangan standar, sertifikasi dan industri, serta telah menetapkan rencana induk untuk industri halal 2030, adalah Sekretariat Dewan Pengembangan Industri Halal."
