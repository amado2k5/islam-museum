  fr: "Une tribu arabe; Ibn Ishaq rapporte que les bédouins qui cherchaient des excuses étaient un groupe d'entre eux, qu'Abu Ruhm Kulthum ibn al-Husayn en faisait partie, et qu'ils avaient des alliés d'Aslam."
