label: { ar: "الزط", en: "the Zutt" }
summary:
  ar: "الزط قوم من أهل السند كانوا في جند الفرس ممن سبوه وفرضوا له وكانوا قبل الإسلام بالسواحل وبالطف يتتبعون الكلأ فلما سمعوا بأمر الأساورة أسلموا وأتوا أبا موسى فأنزلهم البصرة في بني حنظلة ثم أتى الحجاج بخلق من زط السند معهم أهلوهم وجواميسهم فأسكنهم بأسافل كسكر فغلبوا على البطيحة فقطعوا الطريق أيام المأمون فأخذهم عجيف بن عنبسة للمعتصم وفرقهم في خانقين وعين زربة والثغور."
  en: "The Zutt — a Sindhi people among the captives taken for the Persian jund; pre-Islamic they pastured the coasts and the Taff, then hearing of the asawira they converted and Abu Musa lodged them in Banu Hanzala at Basra. A second mass al-Hajjaj settled with families and buffaloes in Kaskar's lowlands overran the batiha and cut the roads under al-Ma'mun, till Ujayf ibn Anbasa took them wholesale for al-Mu'tasim and scattered them to Khaniqin, Ayn Zarba and the thughur."
