label: { ar: "الزط", en: "the Zutt", es: "el Zutt", fr: "le Zutt", ur: "زٹ", tr: "Zott", id: "Zott" }
summary:
  ar: "الزط قوم من أهل السند كانوا في جند الفرس ممن سبوه وفرضوا له وكانوا قبل الإسلام بالسواحل وبالطف يتتبعون الكلأ فلما سمعوا بأمر الأساورة أسلموا وأتوا أبا موسى فأنزلهم البصرة في بني حنظلة ثم أتى الحجاج بخلق من زط السند معهم أهلوهم وجواميسهم فأسكنهم بأسافل كسكر فغلبوا على البطيحة فقطعوا الطريق أيام المأمون فأخذهم عجيف بن عنبسة للمعتصم وفرقهم في خانقين وعين زربة والثغور."
  en: "The Zutt — a Sindhi people among the captives taken for the Persian jund; pre-Islamic they pastured the coasts and the Taff, then hearing of the asawira they converted and Abu Musa lodged them in Banu Hanzala at Basra. A second mass al-Hajjaj settled with families and buffaloes in Kaskar's lowlands overran the batiha and cut the roads under al-Ma'mun, till Ujayf ibn Anbasa took them wholesale for al-Mu'tasim and scattered them to Khaniqin, Ayn Zarba and the thughur."
  es: "Los Zutt, un pueblo sindhi entre los cautivos tomados para el jund persa, antes del Islam pastoreaban las costas y el Taff. Luego, al enterarse de la existencia de los asawira, se convirtieron y Abu Musa los alojó en Banu Hanzala en Basora. Un segundo grupo, al-Hajjaj, se estableció con familias y búfalos en las tierras bajas de Kaskar, invadió los batiha y cortó los caminos bajo el mando de al-Ma'mun, hasta que Ujayf ibn Anbasa los tomó en masa para al-Mu'tasim y los dispersó por Khaniqin, Ayn Zarba y el thughur."
  fr: "Les Zutt, un peuple sindhi parmi les captifs emmenés pour le compte des Perses, vivaient avant l'islam sur les côtes et le Taff. Ayant entendu parler des Asawira, ils se convertirent et Abu Musa les accueillit chez les Banu Hanzala à Bassora. Un second contingent, les al-Hajjaj, s'installa avec des familles et des buffles dans les plaines de Kaskar, envahit les batiha et coupa les routes sous al-Ma'mun, jusqu'à ce qu'Ujayf ibn Anbasa les rassemble en masse pour al-Mu'tasim et les disperse à Khaniqin, Ayn Zarba et au Thughur."
  ur: "زٹ - فارسی جنڈ کے لیے قیدیوں میں سے ایک سندھی لوگ؛ قبل از اسلام انہوں نے ساحلوں اور طاف کو چرایا، پھر اساویرہ کا سن کر انہوں نے مذہب تبدیل کر لیا اور ابو موسیٰ نے انہیں بصرہ میں بنو حنظلہ میں ٹھہرایا۔ حجاج کا دوسرا گروہ کاسکر کے نشیبی علاقوں میں خاندانوں اور بھینسوں کے ساتھ آباد ہوا اور بیتحہ کو عبور کیا اور المامون کے نیچے سڑکیں کاٹ دیں، یہاں تک کہ عجف ابن انبسہ نے انہیں معتصم کے لیے تھوک خرید کر خانقین، عین زربہ اور ثغور میں بکھیر دیا۔"
  tr: "Zuttlar, Sindh'den gelen ve Pers ordusunda yer alan, Persler tarafından esir alınarak vergiye tabi tutulan bir halktı. İslamiyet öncesinde kıyı bölgelerinde ve Taff'ta, otlaklarda yaşıyorlardı. Asavira meselesini duyunca İslam'ı kabul edip Ebu Musa'ya geldiler ve o da onları Basra'da, Beni Hanzala'ya yerleştirdi. Daha sonra Haccac, Sindh'den bir grup Zutt'u aileleri ve mandalarıyla birlikte getirerek Kaskar'ın aşağı kesimlerine yerleştirdi. El-Ma'mun döneminde bataklıkları ele geçirdiler ve yolları kapattılar. Ardından Ecif bin Enbasa onları El-Mu'tasim için aldı ve Hanıkin, Ayn Zarba ve sınır bölgelerine dağıttı."
  id: "Suku Zutt adalah orang-orang dari Sindh yang tergabung dalam pasukan Persia, yang kemudian menangkap mereka dan memungut pajak dari mereka. Sebelum Islam, mereka tinggal di pesisir dan di Sungai Taff, menggembalakan ternak. Ketika mereka mendengar tentang peristiwa Asawira, mereka masuk Islam dan datang kepada Abu Musa, sehingga ia menempatkan mereka di Basra di Bani Hanzala. Kemudian Al-Hajjaj membawa sekelompok suku Zutt dari Sindh beserta keluarga dan kerbau mereka, lalu ia menempatkan mereka di bagian bawah Kaskar. Mereka menguasai rawa-rawa dan memutus jalan pada masa Al-Ma'mun. Kemudian Ajif bin Anbasa membawa mereka ke Al-Mu'tasim dan menyebarkan mereka di Khaniqin, Ain Zarba, dan wilayah perbatasan."
