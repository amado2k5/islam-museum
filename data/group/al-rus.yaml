label: { ar: "الروس", en: "the Rus" }
summary:
  ar: "الروس جنس من الصقالبة عند ابن خرداذبه؛ يحمل تجارهم جلود الخز وجلود الثعالب السود والسيوف من أقصى صقلبة إلى البحر الرومي فيعشّرهم صاحب الروم، وإن ساروا في نهر الصقالبة مروا بخمليج مدينة الخزر فيعشّرهم صاحبها ثم يصيرون إلى بحر جرجان فيخرجون على أي سواحله شاءوا وقطره خمسمائة فرسخ، وربما حملوا تجارتهم من جرجان على الإبل إلى بغداد ويترجم عنهم الخدم الصقالبة ويدّعون أنهم نصارى فيؤدون الجزية {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
  en: "The Rus as Ibn Khurdadhbih records them — a people of the Saqaliba whose merchants carry beaver and black-fox pelts and swords from farthest Slav-land to the Roman sea, paying a tithe to its lord; or down the Slavs' river past Khamlij, the Khazar capital, paying its lord likewise, then out onto the Caspian — five hundred farsakhs across — and sometimes bearing their goods overland from Jurjan by camel to Baghdad, using Slavic interpreters and professing Christianity so as to pay jizya {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
