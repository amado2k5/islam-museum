summary:
  ar: "الروس جنس من الصقالبة عند ابن خرداذبه؛ يحمل تجارهم جلود الخز وجلود الثعالب السود والسيوف من أقصى صقلبة إلى البحر الرومي فيعشّرهم صاحب الروم، وإن ساروا في نهر الصقالبة مروا بخمليج مدينة الخزر فيعشّرهم صاحبها ثم يصيرون إلى بحر جرجان فيخرجون على أي سواحله شاءوا وقطره خمسمائة فرسخ، وربما حملوا تجارتهم من جرجان على الإبل إلى بغداد ويترجم عنهم الخدم الصقالبة ويدّعون أنهم نصارى فيؤدون الجزية {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
  en: "The Rus as Ibn Khurdadhbih records them — a people of the Saqaliba whose merchants carry beaver and black-fox pelts and swords from farthest Slav-land to the Roman sea, paying a tithe to its lord; or down the Slavs' river past Khamlij, the Khazar capital, paying its lord likewise, then out onto the Caspian — five hundred farsakhs across — and sometimes bearing their goods overland from Jurjan by camel to Baghdad, using Slavic interpreters and professing Christianity so as to pay jizya {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
  es: "Los Rus, como los registra Ibn Khurdadhbih, eran un pueblo de la Saqaliba cuyos mercaderes transportaban pieles de castor y zorro negro y espadas desde las tierras eslavas más lejanas hasta el mar romano, pagando un diezmo a su señor; o bien, río abajo por el río de los eslavos, pasando por Khamlij, la capital jázara, pagando también a su señor, para luego adentrarse en el Caspio —quinientos farsakhs de ancho— y, a veces, llevar sus mercancías por tierra desde Jurjan en camello hasta Bagdad, utilizando intérpretes eslavos y profesando el cristianismo para pagar la jizya {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
  fr: "Les Rus, tels que les décrit Ibn Khurdadhbih, sont un peuple des Saqaliba dont les marchands transportent des peaux de castor et de renard noir ainsi que des épées depuis les confins du pays slave jusqu'à la mer romaine, en payant la dîme à leur seigneur; ou descendent le fleuve des Slaves au-delà de Khamlij, la capitale khazare, en payant également son seigneur, puis s'avancent sur la mer Caspienne — cinq cents farsakhs de large — et transportent parfois leurs marchandises par voie terrestre de Jurjan à Bagdad à dos de chameau, en utilisant des interprètes slaves et en professant le christianisme afin de payer la jizya {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
  ur: "روس جیسا کہ ابن خرداذبیح نے انہیں درج کیا ہے - صقالیبہ کے ایک لوگ جن کے تاجر بیور اور کالی لومڑی کے پیلٹ اور تلواریں دور دراز کے سلاو لینڈ سے رومی سمندر تک لے جاتے ہیں، اپنے رب کو دسواں حصہ ادا کرتے ہیں۔ یا خزر کے دار الحکومت خملیج سے گزرتے ہوئے سلاووں کے دریا کے نیچے، اسی طرح اپنے رب کو ادا کرتے ہوئے، پھر کیسپین کی طرف نکلتے ہوئے - پانچ سو فرسخ کے پار - اور بعض اوقات اپنے مال کو جرجان سے اونٹ کے ذریعے بغداد تک لے جاتے، سلاوی مترجمین اور عیسائیت کا دعویٰ کرتے ہوئے جزیہ ادا کرنے کے لیے۔ 154-155}۔"
  tr: "İbn Khurdadhbih'e göre Ruslar, Slav ırkındandır; tüccarları Slavya'nın en uzak köşelerinden Akdeniz'e ipek, siyah tilki derisi ve kılıç taşırlar ve Romalıların hükümdarı onlardan onda bir vergi alır. Slav Nehri'nde seyahat ederlerse, Hazarların şehri Hamlij'den geçerler ve hükümdarı onlardan onda bir vergi alır. Sonra Jurjan Denizi'ne giderler ve istedikleri kıyıya çıkarlar; çapı beş yüz fersahtır. Bazen ticaretlerini Jurjan'dan Bağdat'a develerle taşırlar ve Slav hizmetkarlar onlar için tercümanlık yaparlar ve Hristiyan olduklarını iddia ederler, bu yüzden cizye öderler. {cite:masalik-mamalik-ibn-khurdadhbih s. 154-155}"
  id: "Menurut Ibn Khurdadhbih, bangsa Rus adalah suku Slavia; para pedagang mereka membawa sutra, kulit rubah hitam, dan pedang dari ujung terjauh Slavia ke Laut Mediterania, dan penguasa Romawi memungut persepuluhan dari mereka. Jika mereka melakukan perjalanan di Sungai Slavia, mereka melewati Khamlij, kota Khazar, dan penguasanya memungut persepuluhan dari mereka. Kemudian mereka pergi ke Laut Jurjan dan turun di pantai mana pun yang mereka inginkan, dan diameternya lima ratus liga. Terkadang mereka membawa barang dagangan mereka dari Jurjan dengan unta ke Baghdad, dan para pelayan Slavia menerjemahkan untuk mereka, dan mereka mengaku sebagai orang Kristen, sehingga mereka membayar jizya. {cite:masalik-mamalik-ibn-khurdadhbih pp. 154-155}."
