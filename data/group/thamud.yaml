summary:
  ar: "ثمود بن عابر بن إرم بن سام بن نوح سار بولده ومن تبعه فنزلوا الحجر إلى فرع نحو وادي القرى بين الشام والحجاز وهو يقول أنا الفتى الذي دعا ثموداً يا قوم سيروا ودعوا الترديدا، وهم ممن تكلم بالعربية من الأمم البائدة وخبر نبيهم صالح مشهور {cite:muruj-al-dhahab p. 449-450}. وعند البلاذري نزلت ثمود الحجر بين الحجاز والشام وبها أهلكوا {cite:ansab-al-ashraf p. 8} وعند البخاري أن النبي مرّ بالحجر — مساكن ثمود — في غزوة تبوك فقال «لا تدخلوا مساكن الذين ظلموا أنفسهم إلا أن تكونوا باكين أن يصيبكم ما أصابهم» وتقنّع بردائه وهو على الرحل {cite:sahih-al-bukhari 3380} {cite:sahih-al-bukhari 3381}."
  en: "Descendants of Thamud ibn 'Abir who marched to al-Hijr and the Wadi al-Qura between Syria and the Hijaz — among the vanished Arabic-speaking nations and the people of the prophet Salih {cite:muruj-al-dhahab p. 449-450}."
  es: "Descendientes de Thamud ibn 'Abir que marcharon a al-Hijr y al Wadi al-Qura entre Siria y el Hiyaz, entre las naciones árabes desaparecidas y el pueblo del profeta Salih {cite:muruj-al-dhahab p. 449-450}."
  fr: "Descendants de Thamud ibn 'Abir qui marchèrent vers al-Hijr et le Wadi al-Qura entre la Syrie et le Hedjaz — parmi les nations arabophones disparues et le peuple du prophète Salih {cite:muruj-al-dhahab p. 449-450}."
  ur: "ثمود بن عبیر کی اولاد جنہوں نے شام اور حجاز کے درمیان الحجر اور وادی القریٰ کی طرف کوچ کیا - معدوم ہونے والی عربی بولنے والی قوموں اور نبی صالح کی قوم میں سے۔ 449-450}۔"
  tr: "Semud ibn Ebir ibn Aram ibn Sam ibn Nuh, oğlu ve onu takip edenlerle birlikte Suriye ile Hicaz arasında, Vadi el-Kura'nın bir kolu olan El-Hicr'e yerleşene kadar yolculuk etti. \"Ben Semud diye çağıran genç adamım. Ey insanlar, yolculuk edin ve tereddütlerinizi bırakın.\" dedi. Onlar Arapça konuşan ve soyu tükenmiş milletler arasındaydılar ve peygamberleri Salih'in kıssası iyi bilinmektedir. {kaynak: Muruj-al-Dhahab s. 449-450}. El-Baladhuri'ye göre Semud, Hicaz ile Suriye arasında El-Hicr'e yerleşti ve orada yok edildiler. {kaynak: Ansab-al-Eşraf s. 8}. Buhari'ye göre, Peygamber Tebük Savaşı sırasında Semud halkının yerleşim yeri olan El-Hicr'in yanından geçerken, \"Kendilerine zulmedenlerin yerleşim yerlerine, ağlamadıkça girmeyin; yoksa onların başına gelenlerden siz de nasibinizi alırsınız\" demiştir. Ardından, atının sırtındayken yüzünü cübbesiyle örtmüştür. {sahih-i buhari 3380} {sahih-i buhari 3381}"
  id: "Thamud bin Abir bin Aram bin Sam bin Nuh melakukan perjalanan bersama putranya dan para pengikutnya hingga mereka menetap di Al-Hijr, sebuah cabang dari Wadi al-Qura, antara Suriah dan Hijaz. Ia berkata, \"Akulah pemuda yang menyeru kaum Thamud. Wahai manusia, pergilah dan tinggalkan keraguan kalian.\" Mereka termasuk di antara bangsa-bangsa yang telah punah yang berbahasa Arab, dan kisah nabi mereka, Salih, sangat terkenal. {cite:muruj-al-dhahab hlm. 449-450}. Menurut Al-Baladhuri, kaum Thamud menetap di Al-Hijr antara Hijaz dan Suriah, dan di sanalah mereka dihancurkan. {cite:ansab-al-ashraf hlm. 8}. Menurut Al-Bukhari, Nabi melewati Al-Hijr—tempat tinggal kaum Tsamud—selama Perang Tabuk dan berkata, \"Janganlah kalian memasuki tempat tinggal orang-orang yang berbuat zalim terhadap diri mereka sendiri kecuali jika kalian menangis, agar kalian tidak tertimpa musibah yang menimpa mereka.\" Kemudian beliau menutupi wajahnya dengan jubahnya sambil berada di atas pelana. {kutip:sahih-al-bukhari 3380} {kutip:sahih-al-bukhari 3381}."
