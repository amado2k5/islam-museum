label: { ar: "ثمود", en: "Thamud" }
summary:
  ar: "ثمود بن عابر بن إرم بن سام بن نوح سار بولده ومن تبعه فنزلوا الحجر إلى فرع نحو وادي القرى بين الشام والحجاز وهو يقول أنا الفتى الذي دعا ثموداً يا قوم سيروا ودعوا الترديدا، وهم ممن تكلم بالعربية من الأمم البائدة وخبر نبيهم صالح مشهور {cite:muruj-al-dhahab p. 449-450}. وعند البلاذري نزلت ثمود الحجر بين الحجاز والشام وبها أهلكوا {cite:ansab-al-ashraf p. 8} وعند البخاري أن النبي مرّ بالحجر — مساكن ثمود — في غزوة تبوك فقال «لا تدخلوا مساكن الذين ظلموا أنفسهم إلا أن تكونوا باكين أن يصيبكم ما أصابهم» وتقنّع بردائه وهو على الرحل {cite:sahih-al-bukhari 3380} {cite:sahih-al-bukhari 3381}."
  en: "Descendants of Thamud ibn 'Abir who marched to al-Hijr and the Wadi al-Qura between Syria and the Hijaz — among the vanished Arabic-speaking nations and the people of the prophet Salih {cite:muruj-al-dhahab p. 449-450}."
