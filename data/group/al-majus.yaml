label:
  ar: "المجوس"
  en: "Al-Majus (the Magians/Zoroastrians)"
  ur: "مجوس"
  es: "Al-Majus (los magos/zoroastrianos)"
  fr: "Al-Majus (les Mages/Zoroastriens)"
  tr: "Magi"
  id: "Orang Majus"
summary:
  ar: "المجوس في كلام العرب أهل فارس عباد النار: ملوك ساسان وعامتهم ممن كانوا على دين زردشت؛ القرآن يذكرهم في سورة الحج في الممتحنين يوم القيامة، والسنة تذكر جزيتهم ونكاحهم وذبائحهم، والتاريخ يقص خلافة كسرى وفتوح العراق وفارس على عهد الخلفاء {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  en: "Al-Majus in Arab speech are the people of Fars, the fire-worshippers: the Sasanian kings and their commons who followed the religion of Zardusht. The Qur'an names them in Surat al-Hajj among those whom God will judge on the Day of Rising; the Sunna speaks of their jizya, marriage and slaughtered animals; and the histories tell of Khosrow's court and the conquests of Iraq and Persia under the caliphs {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  ur: "مجوس عربوں کی زبان میں اہلِ فارس آتش پرست ہیں: ساسانی بادشاہ اور ان کی رعایا جو زرتشت کے دین پر تھے؛ قرآن سورۃ حج میں ان کا ذکر کرتا ہے، سنت ان کی جزیہ، نکاح اور ذبیحہ بیان کرتی ہے، اور تاریخ کسریٰ کے دربار اور خلفاء کے عہد میں عراق و فارس کی فتوحات قص کرتی ہے۔"
  es: "Al-Majus en lengua árabe son la gente de Fars, los adoradores del fuego: los reyes sasánidas y sus plebeyos que seguían la religión de Zardusht. El Corán los nombra en Sura al-Hajj entre aquellos a quienes Dios juzgará en el Día de la Resurrección; la Sunna habla de su jizya, matrimonio y animales sacrificados; y las historias hablan de la corte de Khosrow y las conquistas de Irak y Persia bajo los califas {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
  fr: "En arabe, le terme « Al-Majus » désigne les habitants du Fars, les adorateurs du feu: les rois sassanides et leurs sujets qui pratiquaient le zardusht. Le Coran les mentionne dans la sourate al-Hajj parmi ceux que Dieu jugera au Jour du Jugement; la Sunna évoque leur jizya, leurs mariages et le sacrifice d'animaux; et les chroniques relatent la cour de Khosro et les conquêtes de l'Irak et de la Perse sous les califes."
  tr: "Arapların dilinde Magi, ateşe tapan Pers halkıdır: Sasani kralları ve Zerdüşt dinine mensup halkları; Kur'an'da Hac Suresi'nde, Kıyamet Gününde Sınananlar bölümünde onlardan bahsedilir ve Sünnet'te cizyeleri, evlilikleri ve kurbanları anılır; tarih ise Hüsrev halifeliğini ve halifeler döneminde Irak ve Pers'in fetihlerini anlatır. {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}"
  id: "Dalam bahasa Arab, kaum Magi adalah penduduk Persia, penyembah api: raja-raja Sasaniyah dan rakyat jelata mereka yang beragama Zoroaster; Al-Qur'an menyebutkan mereka dalam Surah Al-Hajj di bab Ujian pada Hari Kiamat, dan Sunnah menyebutkan jizya mereka, pernikahan mereka dan kurban mereka, dan sejarah menceritakan tentang kekhalifahan Khosrow dan penaklukan Irak dan Persia selama era para khalifah {cite:tafsir-tabari-shakir-v01} {cite:tarikh-al-tabari} {cite:mubarakpuri-raheeq}."
