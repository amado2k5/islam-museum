  en: Nafza
summary:
  ar: "نفزة من قبائل البربر من بقايا البرانس؛ مواطنهم أطلس المغرب الأقصى وما بينه وبين الساحل، ومنهم الرندي الذي ولّته غمارة عليهم لما ارتدوا وأخرجوا صالح بن منصور قبل أن يتوبوا، ومنهم زينب بنت إسحاق النفزاوية المشهورة بالجمال والرياسة زوجة أمراء المغرب، ودام أمرهم في جبالهم إلى دولة المرابطين ومن بعدها."
  en: "Nafza of the Berbers of the Baranis stock; their homeland the Far Maghreb's Atlas between the coast and the heights — of them al-Randi whom the Ghumara set over themselves in their apostasy when they expelled Salih ibn Mansur, and of them Zaynab bint Ishaq al-Nafzawiyya, famed for beauty and queenship, wife of the Maghreb's rulers — their sway lasting in their mountains into Almoravid days and after."
