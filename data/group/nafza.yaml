summary:
  ar: "نفزة من قبائل البربر من بقايا البرانس؛ مواطنهم أطلس المغرب الأقصى وما بينه وبين الساحل، ومنهم الرندي الذي ولّته غمارة عليهم لما ارتدوا وأخرجوا صالح بن منصور قبل أن يتوبوا، ومنهم زينب بنت إسحاق النفزاوية المشهورة بالجمال والرياسة زوجة أمراء المغرب، ودام أمرهم في جبالهم إلى دولة المرابطين ومن بعدها."
  en: "Nafza of the Berbers of the Baranis stock; their homeland the Far Maghreb's Atlas between the coast and the heights — of them al-Randi whom the Ghumara set over themselves in their apostasy when they expelled Salih ibn Mansur, and of them Zaynab bint Ishaq al-Nafzawiyya, famed for beauty and queenship, wife of the Maghreb's rulers — their sway lasting in their mountains into Almoravid days and after."
  es: "Nafza, de los bereberes de la estirpe Baranis; su tierra natal, el Atlas del Magreb lejano, entre la costa y las alturas; entre ellos, al-Randi, a quien los Ghumara pusieron al frente en su apostasía cuando expulsaron a Salih ibn Mansur, y entre ellos, Zaynab bint Ishaq al-Nafzawiyya, famosa por su belleza y realeza, esposa de los gobernantes del Magreb; su dominio perduró en sus montañas hasta la época almorávide y más allá."
  fr: "Nafza, des Berbères de la souche Baranis; leur patrie l'Atlas du Maghreb lointain, entre la côte et les hauteurs — parmi eux al-Randi, que les Ghumara ont placé à leur tête lors de leur apostasie lorsqu'ils ont expulsé Salih ibn Mansur, et parmi eux Zaynab bint Ishaq al-Nafzawiyya, célèbre pour sa beauté et son rôle de reine, épouse des souverains du Maghreb — leur influence se prolongeant dans leurs montagnes jusqu'à l'époque almoravide et même après."
  ur: "بارانی اسٹاک کے بربروں کا نفزا؛ ساحل اور بلندیوں کے درمیان ان کا وطن بعید مغرب کا اٹلس - ان میں سے الرندی جنہیں غمارہ نے صالح بن منصور کو ملک بدر کرتے ہوئے اپنے ارتداد میں اپنے آپ پر چھوڑ دیا تھا، اور ان میں سے زینب بنت اسحاق النفزاویہ، جو خوبصورتی اور ملکہ کے لیے شہرت رکھتی تھیں، المغرب کے آخری ایام میں ان کے پہاڑوں پر حکمرانی کرتی رہیں۔ کے بعد"
  tr: "Nafzalar, Berberi kabilelerinden biridir ve Braneslerin kalıntılarıdır. Anavatanları, Fas'ın uzak bölgelerindeki Atlas Dağları ve bu dağlar ile kıyı şeridi arasındaki bölgedir. Aralarında, dinden döndüklerinde ve Salih bin Mansur'u kovduklarında Ghomara'nın başlarına atadığı Randalar da bulunur; Randalar daha sonra tövbe ederler. Aralarında, güzelliği ve liderliğiyle ünlü, Fas prenslerinin eşi Zeyneb bint İshak el-Nafzaviye de vardır. Yönetimleri, Almoravid devletine kadar ve sonrasında dağlık bölgelerinde devam etmiştir."
  id: "Suku Nafza adalah salah satu suku Berber, sisa-sisa suku Branes. Tanah air mereka adalah Pegunungan Atlas di Maroko bagian utara dan daerah antara pegunungan tersebut dan pantai. Di antara mereka terdapat suku Randa, yang diangkat oleh Ghomara sebagai pemimpin mereka ketika mereka murtad dan mengusir Saleh bin Mansour sebelum mereka bertobat. Di antara mereka terdapat Zainab bint Ishaq al-Nafzawiya, yang terkenal karena kecantikan dan kepemimpinannya, istri dari para pangeran Maroko. Kekuasaan mereka berlanjut di pegunungan mereka hingga berdirinya negara Almoravid dan setelahnya."
