  source: "The wave-196 harvest entry for Kishki Online TV (Tanzania, Swahili dawah media), built on 8 November 2026 against the two sources already registered for the wave-191 person record: vidIQ's channel statistics page for @kishkionlinetv (371,000 subscribers, 40,419,353 views, 6,880 videos, channel created 2 September 2017, channel country Tanzania, ranked #184 in Tanzania, page updated 4 November 2026) and Africa Press's Tanzania report of the channel's YouTube Silver Award. A fresh count re-read was attempted on 8 November 2026: vidIQ's page was re-opened that day and still showed its 4 November 2026 update with the same 371,000 figure, and searches for a Social Blade or SocialCounts page for this channel returned no channel figure, so no fresh dated figure was obtained, no new tracker source is registered, and the existing vidIQ 371,000 (2026-11-04) is carried as the primary count with this failed re-read disclosed here. Africa Press reports that Kishki Online TV was the first Islamic channel of its kind in Tanzania to receive a YouTube cash prize and Silver Award, that subscribers had reached 120,000 at the award announcement, and names its programmes Street Da'awa, Islam in the Old Books (the Qur'an, Bulugh al-Maram, Riyadh as-Salihin) and the Friday Fadhakir; the wave-196 harvest's channel reading additionally names the strands Wadhakir (Fridays), Maswali na Majibu (questions and answers), Safari ya Ndoa (marriage series) and Darasa la Mirathi (inheritance lessons), and notes that the channel also carries other sheikhs, among them Sheikh Abdallah al-Ahdal — those harvest details are stated as the harvest's reading in the prose, not as facts from a separately registered source opened in this run. The channel's creation date (2 September 2017, vidIQ) and Africa Press's statement that his Islamic centre was established in March 2020 are kept separate and never fused, as in the person record. The founder link is written once, here, as founded_by to person/nurdeen-kishki (the person record was not edited). No Wikipedia article and no Wikidata item for the channel were found in the harvest pass, so no external identifier is recorded. De-duplicated against the tree: no group/kishki-online-tv existed."
