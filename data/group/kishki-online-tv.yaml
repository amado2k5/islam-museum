summary:
  ar: "منفذ إعلامي دعوي تنزاني يعمل بالسواحلية، مبني حول الشيخ نور الدين كيشكي، ينشر خطب الجمعة والمحاضرات وبرامج مثل «دعوة الشارع» و«فذكّر» يوم الجمعة ومسائل وأجوبة ودروس الميراث؛ وهو أول قناة إسلامية من نوعها في تنزانيا تنال الدرع الفضي من يوتيوب؛ بلغ عدد مشتركي قناته على يوتيوب (@kishkionlinetv) 371,000 مشترك بحسب عدّاد vidIQ كما حُدّث في 4 نوفمبر 2026، مع 40,419,353 مشاهدة و6,880 مقطعًا."
  en: "A Tanzanian Swahili dawah media outlet built around Sheikh Nurdeen Kishki, publishing Friday khutbahs, lectures (mihadhara) and programmes such as Street Da'awa, the Friday Wadhakir, questions-and-answers and inheritance lessons; it was the first Islamic channel of its kind in Tanzania to receive a YouTube Silver Award; its YouTube channel (@kishkionlinetv) counted 371,000 subscribers by vidIQ's count as updated on 4 November 2026, with 40,419,353 views and 6,880 videos."
  ur: "کشکی آن لائن ٹی وی تنزانیہ کا سواحلی زبان کا دعوتی میڈیا ادارہ ہے جو شیخ نور دین کشکی کے گرد بنا ہے اور جمعہ کے خطبات، محاضرات اور «اسٹریٹ دعوہ»، جمعہ کے «وذکّر»، سوالات و جوابات اور میراث کے اسباق جیسے پروگرام شائع کرتا ہے؛ یہ تنزانیہ کی اپنی نوعیت کی پہلی اسلامی چینل تھی جسے یوٹیوب سلور ایوارڈ ملا؛ اس کے یوٹیوب چینل (@kishkionlinetv) کے سبسکرائبرز کی تعداد 4 نومبر 2026ء کو اپ ڈیٹ کیے گئے vidIQ کے شمار کے مطابق 371,000 تھی، جبکہ اس کی ویڈیوز 6,880 اور ویوز 40,419,353 تھے۔"
