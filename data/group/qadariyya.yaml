  id: lumat-al-itiqad
  stance:
    ar: تُعدّ فرقة من فرق الضلال في لمعة الاعتقاد، ويُنقل وصفها كما في الكتاب
    en: Listed among the sects of misguidance in Lum'at al-i'tiqad; described as the book describes them
  summary:
    ar: يعدّ ابن قدامة القدرية في فرق الضلال، ويذكر المحقق أن مقالتهم في نفي القدر ظهرت في أواخر عصر الصحابة، وأن عبد الله بن عمر وغيره تبرؤوا منها (ص 113–115 ط2).
    en: Ibn Qudama lists this sect among the sects of misguidance; the editor's footnote gives its origin (2nd ed., pp. 113–115).
