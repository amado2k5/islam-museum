id: group/qadariyya
education:
  did_you_know:
    ar: "القدرية طائفة تُنسب إليها القول بأن للعباد الاستطاعة والمشيئة في أفعالهم وأن علمهم بها ليس سابقاً من علم الله."
    en: "The Qadariyya are named for holding that servants own power and will over their deeds, and that their knowledge of them does not precede God's."
    ur: "قدریہ وہ فرقہ ہے جس سے منسوب ہے کہ بندے اپنے اعمال پر قدرت اور مشیت رکھتے ہیں اور اس کا علم اللہ کے علم سے پہلے نہیں ہوتا۔"
    sources: [source/madkhal-ibn-badran-turki, source/lumat-al-itiqad-ibn-uraiyir-2022]
class: group
kind: sect
label:
  ar: القدرية، وعند البلخي في الفهرست أول من تكلم في القدر والاعتزال أبو يونس الأسواري المعروف بسنسويه رجل من الأساورة وتابعه معبد الجهني ويقال إن سليمان بن عبد الملك تكلم فيه {cite:fihrist-ibn-al-nadim p. 557}
  en: "Qadariyya"
summary:
  ar: طائفة تُنسب إليها القول بأن للعباد الاستطاعة والمشيئة في أفعالهم، وأن علمهم بها ليس سابقاً من علم الله؛ ويصف الكتاب قولهم كما نقله، ويقارنه بمذاهب أهل الكتاب والمجوس.
  en: "A sect to which is ascribed the view that people have capacity (istita'a) and will over their acts, and that their knowledge of those acts does not precede God's knowledge; the book describes their view as it relays it, and compares it with the doctrines of the People of the Book and the Magians."
