- tradition: sunni
  id: lalakai-sharh-usul
  standing: main
  stance:
    ar: 'نفاة القدر مبتدعة، وفي كفرهم واستتابتهم آثار مختلفة يجمعها اللالكائي'
    en: 'The deniers of predestination are innovators; al-Lalaka''i gathers differing reports on their unbelief and on asking them to repent'
    ur: 'تقدیر کے منکر بدعتی ہیں؛ لالکائی ان کے کفر اور توبہ طلب کرنے کے بارے میں مختلف آثار جمع کرتے ہیں'
  summary:
    ar: 'يعقد اللالكائي في شرح أصول اعتقاد أهل السنة أبواباً في القدرية: حديث «القدرية مجوس هذه الأمة» ⁦(ويضعفه المحقق)⁩، ومن كفّرهم ولعنهم، ومن رأى استتابتهم، وإقامة الحدود عليهم، ومنع الصلاة خلفهم ومناكحتهم وأكل ذبائحهم، ومتى حدثت مسألة القدر، ويروي أن أول من تكلم فيه بالبصرة معبد الجهني وأن غيلان أخذ عنه.'
    en: 'In Sharh Usul I''tiqad Ahl al-Sunna al-Lalaka''i devotes chapters to the Qadariyya – the hadith "the Qadariyya are the Magians of this community" (which the editor judges weak), those who declared them unbelievers and cursed them, those who held they should be asked to repent, the punishments carried out on them, the ban on praying behind them, intermarrying and eating their slaughter, and when the question of predestination arose – and relates that the first to speak of it in Basra was Ma''bad al-Juhani, from whom Ghaylan took it.'
    ur: 'شرح اصول اعتقاد اہل السنہ میں لالکائی قدریہ پر کئی ابواب باندھتے ہیں – حدیث «قدریہ اس امت کے مجوس ہیں» ⁦(جسے محقق ضعیف کہتے ہیں)⁩، جنہوں نے انہیں کافر کہا اور ان پر لعنت کی، جنہوں نے ان سے توبہ طلب کرنے کا کہا، ان پر سزاؤں کا نفاذ، ان کے پیچھے نماز، ان سے نکاح اور ان کے ذبیحے کی ممانعت، اور تقدیر کا مسئلہ کب پیدا ہوا – اور روایت کرتے ہیں کہ بصرہ میں سب سے پہلے معبد جہنی نے اس پر بات کی اور غیلان نے اس سے لیا۔'
