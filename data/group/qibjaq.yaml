  fr: "Qipchaq (Coumans)"
  tr: "Kipçak"
  id: "Kipchak"
summary:
  ar: "القبجاق قبائل تركية رحل في سهوب ما وراء النهر والقوقاز؛ يذكرها ياقوت في معجم البلدان في خروج المغول وقتلهم القبجاق، ويعرض العمري في مسالك الأبصار لبلادهم وصحرائهم {cite:mujam-al-buldan-yaqut} {cite:umari-masalik-1924}."
  en: "The Qipchaq (Cumans) were nomadic Turkic tribes of the steppes beyond the Oxus and the Caucasus; Yaqut's Mujam mentions them in the Mongol irruption that killed the Qipchaq, and al-Umari's Masalik al-Absar surveys their land and steppe {cite:mujam-al-buldan-yaqut} {cite:umari-masalik-1924}."
  es: "Los Qipchaq (cumanos) eran tribus turcas nómadas de las estepas más allá del Oxus y el Cáucaso; el Mujam de Yaqut los menciona en la irrupción mongola que acabó con los Qipchaq, y el Masalik al-Absar de al-Umari describe su tierra y estepa {cite:mujam-al-buldan-yaqut} {cite:umari-masalik-1924}."
  fr: "Les Qipchaq (Coumans) étaient des tribus turques nomades des steppes au-delà de l'Oxus et du Caucase; le Mujam de Yaqut les mentionne lors de l'irruption mongole qui a tué les Qipchaq, et le Masalik al-Absar d'al-Umari décrit leur terre et leur steppe {cite:mujam-al-buldan-yaqut} {cite:umari-masalik-1924}."
  ur: "Qipchaq (Cumans) آکسس اور قفقاز سے آگے کے میدانوں کے خانہ بدوش ترک قبائل تھے۔ یاقوت کے مجم نے ان کا ذکر منگول کے فتنہ میں کیا ہے جس نے کیپچاق کو ہلاک کیا تھا، اور عمری کے مسالک الابصار نے ان کی زمین اور میدان کا سروے کیا ہے۔"
  tr: "Kıpçaklar, Transoksanya ve Kafkasya bozkırlarında yaşayan göçebe Türk kabileleridir; Yaqut, Moğolların çıkışı ve Kıpçakların öldürülmesi sırasında Ülkeler Sözlüğü'nde onlardan bahseder ve Al-Umari, Masalik al-Absar'da onların topraklarını ve çöllerini sunar."
  id: "Suku Kipchak adalah suku-suku Turki nomaden di stepa Transoxiana dan Kaukasus; Yaqut menyebutkan mereka dalam Kamus Negara-Negara pada saat kepergian Mongol dan pembunuhan suku Kipchak oleh mereka, dan Al-Umari menyajikan tanah dan gurun mereka dalam Masalik al-Absar {cite:mujam-al-buldan-yaqut} {cite:umari-masalik-1924}."
