label: { ar: "حمراء ديلم", en: "Hamra' Daylam" }
summary:
  ar: "أربعة آلاف كانوا مع رستم يوم القادسية يسمون جند شاهنشاه؛ عند البلاذري استأمنوا على أن ينزلوا حيث أحبوا ويحالفوا من أحبوا ويفرض لهم في العطاء فحالفوا زهرة بن حوية السعدي وكان نقيبهم يقال له ديل فقيل حمراء ديلم سيّر زياد بعضهم إلى الشام فدعوا الفرس وقوماً إلى البصرة فدخلوا في الأساورة وقال المدائني كانوا خدم أبرويز وخاصته أتوا من الديلم فأسلموا بعد القادسية وشهدوا فتح المدائن."
  en: "The four thousand 'Shahanshah's troops' with Rustam at al-Qadisiyya; in al-Baladhuri they were safe-conducted to settle and ally where they wished with fixed stipends, allied with Zuhra ibn Hawiyya al-Sa'di, their naqib Dayl giving the name Hamra' Daylam; Ziyad moved some to Syria — called al-Furs — and some to Basra's asawira; al-Mada'ini makes them Khusraw's servants brought from Daylam who converted after al-Qadisiyya and witnessed al-Mada'in."
