label: { ar: "حمراء ديلم", en: "Hamra' Daylam", es: "Hamra' Daylam", fr: "Hamra' Daylam", ur: "حمرا دیلم", tr: "Kırmızı Daylam", id: "Red Daylam" }
summary:
  ar: "أربعة آلاف كانوا مع رستم يوم القادسية يسمون جند شاهنشاه؛ عند البلاذري استأمنوا على أن ينزلوا حيث أحبوا ويحالفوا من أحبوا ويفرض لهم في العطاء فحالفوا زهرة بن حوية السعدي وكان نقيبهم يقال له ديل فقيل حمراء ديلم سيّر زياد بعضهم إلى الشام فدعوا الفرس وقوماً إلى البصرة فدخلوا في الأساورة وقال المدائني كانوا خدم أبرويز وخاصته أتوا من الديلم فأسلموا بعد القادسية وشهدوا فتح المدائن."
  en: "The four thousand 'Shahanshah's troops' with Rustam at al-Qadisiyya; in al-Baladhuri they were safe-conducted to settle and ally where they wished with fixed stipends, allied with Zuhra ibn Hawiyya al-Sa'di, their naqib Dayl giving the name Hamra' Daylam; Ziyad moved some to Syria — called al-Furs — and some to Basra's asawira; al-Mada'ini makes them Khusraw's servants brought from Daylam who converted after al-Qadisiyya and witnessed al-Mada'in."
  es: "Las cuatro mil tropas del Shahanshah estaban con Rustam en al-Qadisiyya; en al-Baladhuri se les permitió establecerse y aliarse donde quisieran con estipendios fijos, aliados con Zuhra ibn Hawiyya al-Sa'di, su naqib Dayl dio el nombre de Hamra' Daylam; Ziyad trasladó a algunos a Siria —llamada al-Furs— y a otros a la asawira de Basora; al-Mada'ini los presenta como sirvientes de Khusraw traídos de Daylam que se convirtieron después de al-Qadisiyya y fueron testigos de al-Mada'in."
  fr: "Les quatre mille « troupes du Shahanshah » avec Rustam à al-Qadisiyya; à al-Baladhuri, ils furent conduits en toute sécurité pour s'installer et s'allier où ils le souhaitaient avec des allocations fixes, s'alliant à Zuhra ibn Hawiyya al-Sa'di, leur naqib Dayl donnant le nom de Hamra' Daylam; Ziyad en déplaça certains en Syrie — appelés al-Furs — et d'autres à l'asawira de Bassora; al-Mada'ini les décrit comme les serviteurs de Khusraw amenés de Daylam qui se convertirent après al-Qadisiyya et furent témoins d'al-Mada'in."
  ur: "قادسیہ میں رستم کے ساتھ چار ہزار 'شہنشاہ کی فوج'؛ البلادوری میں وہ محفوظ طریقے سے آباد ہوئے اور جہاں انہوں نے مقررہ وظیفے کے ساتھ چاہا، زہرہ بن حویہ السعدی کے ساتھ الحاق کیا، ان کے نقیب دیل نے حمرا دیلم کا نام دیا۔ زیاد نے کچھ کو شام منتقل کر دیا – جسے الفورس کہا جاتا ہے – اور کچھ کو بصرہ کے اساویرہ میں۔ المدائنی انہیں خسرو کے خادم بناتا ہے جو دیلم سے لائے تھے جنہوں نے القدسیہ کے بعد مذہب تبدیل کیا اور المدائن کو دیکھا۔"
  tr: "Kadisiye günü Rüştam'ın yanında Şahanshah'ın askerleri olarak adlandırılan dört bin kişi vardı. El-Baladhuri'ye göre, istedikleri yere yerleşmeleri, istedikleriyle ittifak kurmaları ve maaşlarından pay almaları konusunda güvence verilmişti. Böylece Zuhrah bin Huwayyah el-Saadi ile ittifak kurdular ve liderleri Dayl olarak adlandırıldı, bu yüzden Deylam'ın Kızılı olarak anıldı. Ziyad onlardan bazılarını Levant'a gönderdi, böylece Persleri ve bazı insanları Basra'ya davet ettiler ve Asavire'ye girdiler. El-Medeini, onların Parviz'in hizmetkarları ve özel adamları olduğunu söyledi. Deylam'dan geldiler ve Kadisiye'den sonra İslam'ı kabul ettiler ve Medine'nin fethine şahit oldular."
  id: "Empat ribu orang bersama Rustam pada hari Qadisiyah, disebut tentara Shahanshah. Menurut Al-Baladhuri, mereka diberi jaminan untuk menetap di mana pun mereka suka dan bersekutu dengan siapa pun yang mereka suka serta diberi bagian dari tunjangan. Maka mereka bersekutu dengan Zuhrah bin Huwayyah Al-Saadi, dan pemimpin mereka bernama Dayl, sehingga dikatakan bahwa mereka adalah Merah Daylam. Ziyad mengirim sebagian dari mereka ke Levant, sehingga mereka mengundang orang Persia dan beberapa orang ke Basra, sehingga mereka memasuki Asawirah. Al-Madaini mengatakan bahwa mereka adalah hamba Parviz dan orang-orang istimewanya. Mereka datang dari Daylam dan masuk Islam setelah Qadisiyah dan menyaksikan penaklukan Madain."
