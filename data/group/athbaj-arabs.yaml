summary:
  ar: "الأثبج من بطون بني هلال بن عامر؛ منهم سراح بجهة برقة وعياض بجبل القلعة، ونزل أفاريقهم قرى الزاب على من كان بها قبلهم من زناتة وطوالع الفتح فاشتهر أهل الزاب كلهم بهم، ومنهم بنو مزني أمراء بسكرة، وكانوا أول شعوب هلال وطناً بإفريقية وأكثرها استقراراً في القرى."
  en: "The Athbaj of the Hilal ibn Amir branches; of them Siraj by Barqa and Iyadh at Jabal al-Qal'a — their bands settled the Zab's villages over the earlier Zanata and conquest folk until all the Zab's people bore their name, of them the Banu Muzni amirs of Biskra, the first of Hilal's divisions to win a homeland in Ifriqiya and the most village-settled."
  es: "Las ramas Athbaj de Hilal ibn Amir; de ellas Siraj por Barqa e Iyadh en Jabal al-Qal'a, sus bandas se asentaron en las aldeas de Zab sobre los pueblos Zanata y conquistadores anteriores hasta que toda la gente de Zab llevó su nombre, de ellos los emires Banu Muzni de Biskra, la primera de las divisiones de Hilal en ganar una patria en Ifriqiya y la que más aldeas se asentó."
  fr: "Les Athbaj des branches de Hilal ibn Amir; parmi eux Siraj près de Barqa et Iyadh à Jabal al-Qal'a — leurs bandes ont établi les villages du Zab sur les anciens Zanata et les peuples conquérants jusqu'à ce que tout le peuple du Zab porte leur nom, parmi eux les émirs Banu Muzni de Biskra, la première des divisions de Hilal à gagner une patrie en Ifriqiya et la plus établie dans les villages."
