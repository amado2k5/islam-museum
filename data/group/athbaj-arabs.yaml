summary:
  ar: "الأثبج من بطون بني هلال بن عامر؛ منهم سراح بجهة برقة وعياض بجبل القلعة، ونزل أفاريقهم قرى الزاب على من كان بها قبلهم من زناتة وطوالع الفتح فاشتهر أهل الزاب كلهم بهم، ومنهم بنو مزني أمراء بسكرة، وكانوا أول شعوب هلال وطناً بإفريقية وأكثرها استقراراً في القرى."
  en: "The Athbaj of the Hilal ibn Amir branches; of them Siraj by Barqa and Iyadh at Jabal al-Qal'a — their bands settled the Zab's villages over the earlier Zanata and conquest folk until all the Zab's people bore their name, of them the Banu Muzni amirs of Biskra, the first of Hilal's divisions to win a homeland in Ifriqiya and the most village-settled."
