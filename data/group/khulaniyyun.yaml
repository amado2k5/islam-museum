summary:
  ar: "الخولانيين أصحاب مليح الخولاني وكان تلميذ بابك بن بهرام وبابك تلميذ شيلي الذي كان من المغتسلة وخالفها، وكان الخولاني يوافق شيلي ويقف عن اليهود {cite:fihrist-ibn-al-nadim p. 477-478}."
  en: "The Khulaniyya — Maliha's sect descending from the Mughtasila schism {cite:fihrist-ibn-al-nadim}"
  es: "La Khulaniyya — secta de Maliha descendiente del cisma Mughtasila {cite:fihrist-ibn-al-nadim}"
  fr: "La Khulaniyya — secte de Maliha issue du schisme des Mughtasila {cite:fihrist-ibn-al-nadim}"
  ur: "خولانیہ - ملیحہ کا فرقہ مغطسلہ فرقہ سے نکلا ہے"
  tr: "Havlaniler, Babak ibn Bahram'ın öğrencisi olan Malih el-Havlani'nin arkadaşlarıydı. Babak ise Maghtasila'dan olan ve ona karşı çıkan Şili'nin öğrencisiydi. El-Havlani, Şili ile aynı fikirdeydi ve Yahudilere karşıydı. {cite:fihrist-ibn-al-nadim s. 477-478}"
  id: "Kaum Khawlani adalah sahabat Malih al-Khawlani, yang merupakan murid Babak ibn Bahram, dan Babak adalah murid Shili, yang berasal dari Maghtasila dan menentangnya. Al-Khawlani setuju dengan Shili dan menentang kaum Yahudi. {cite:fihrist-ibn-al-nadim p. 477-478}."
