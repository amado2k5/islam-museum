summary:
  ar: "قناة يوتيوب بنغالية للدراما الأخلاقية الإسلامية القصيرة «ناتوك»، وهي القناة الرئيسة للممثل والمخرج والكاتب أكيب أحمد، تحمل إنتاجات «كرييتف ميديا» المكتوبة التي يمثّل فيها ويكتبها ويخرج أغلبها؛ بلغ عدد مشتركيها (@akibislamictv) 5,380,000 مشترك بحسب عدّاد vidIQ كما في 8 نوفمبر 2026."
  en: "A Bangladeshi YouTube channel for Islamic moral short drama (natok), the main channel of the actor, director and writer Akib Ahmed, carrying the scripted Creative Media productions he stars in, writes and most often directs; the channel (@akibislamictv) counted 5,380,000 subscribers by vidIQ's count as of 8 November 2026."
  ur: "اسلامی اخلاقی مختصر ڈرامے «ناٹک» کا بنگلہ دیشی یوٹیوب چینل، اداکار، ہدایت کار و مصنف اکیب احمد کا مرکزی چینل، جو «کری ایٹو میڈیا» کی تحریری پروڈکشنز پیش کرتا ہے جن میں وہ اداکاری کرتے، لکھتے اور اکثر ہدایت بھی کرتے ہیں؛ اس چینل (@akibislamictv) کے سبسکرائبر vidIQ کے شمار کے مطابق 8 نومبر 2026 کو 5,380,000 تھے۔"
  es: "Un canal de YouTube de Bangladesh dedicado a los dramas cortos de moral islámica (natok), el canal principal del actor, director y escritor Akib Ahmed, que presenta las producciones de Creative Media con guion en las que actúa, escribe y, con mayor frecuencia, dirige; el canal (@akibislamictv) contaba con 5.380.000 suscriptores según el recuento de vidIQ al 8 de noviembre de 2026."
  fr: "Une chaîne YouTube bangladaise de courts drames moraux islamiques (natok), la chaîne principale de l'acteur, réalisateur et scénariste Akib Ahmed, diffusant les productions scénarisées de Creative Media dans lesquelles il joue, écrit et réalise le plus souvent; la chaîne (@akibislamictv) comptait 5 380 000 abonnés selon le décompte de vidIQ au 8 novembre 2026."
