summary:
  ar: "قبيلة من قبائل زغاوة، ظواعن رحالة كثيرة الإبل، ينسجون من أوبارها المسوح والبيوت، ويتعيشون من ألبانها ولحومها {cite:nuzhat-al-mushtaq-2002 p. 111}."
  en: "A tribe among the Zaghawa: nomadic herders with many camels. The author says they weave cloth from camel hair for tents and live on their milk and meat {cite:nuzhat-al-mushtaq-2002 p. 111}."
  es: "Una tribu entre los zaghawa: pastores nómadas con muchos camellos. El autor dice que tejen tela con pelo de camello para tiendas de campaña y viven de su leche y carne {cite:nuzhat-al-mushtaq-2002 p. 111}."
  fr: "Une tribu parmi les Zaghawa: des éleveurs nomades possédant de nombreux chameaux. L’auteur indique qu’ils tissent des étoffes en poil de chameau pour confectionner leurs tentes et se nourrissent de leur lait et de leur viande {cite: nuzhat-al-mushtaq-2002 p. 111}."
  ur: "زاغوا کا ایک قبیلہ: خانہ بدوش چرواہے جن کے بہت سے اونٹ ہیں۔ مصنف کا کہنا ہے کہ وہ خیموں کے لیے اونٹ کے بالوں سے کپڑا بناتے ہیں اور اپنے دودھ اور گوشت پر گزارہ کرتے ہیں۔ 111}۔"
