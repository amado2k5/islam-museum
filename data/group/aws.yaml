summary:
  ar: "أحد شطري الأنصار، الأوس بن حارثة بن ثعلبة بن عمرو بن عامر بن مالك الأوت، من بطون الأزد؛ أسلمت طوائفهم مبكراً في موسم الحج ثم جاء منهم سعد بن معاذ وأسيد بن حضير وخبيب بن عدي وعبد الله بن رواحة {cite:mubarakpuri-raheeq p.18-19} {cite:ibn-hisham-sira}، وكانت بينهم وبين أخيهم الخزرج حروب الجاهلية أعظمها يوم بعاث {cite:kamil-ibn-al-athir}."
  en: "One of the two branches of the Ansar — al-Aws ibn Haritha ibn Tha'laba ibn Amr ibn Amir, of the Azd clans. Groups of them entered Islam early in the pilgrimage season, and from them came Sa'd ibn Mu'adh, Usayd ibn Hudayr, Khubayb ibn Adi and Abdullah ibn Rawaha {cite:mubarakpuri-raheeq p.18-19} {cite:ibn-hisham-sira}; between them and their brother tribe al-Khazraj ran the Jahiliyya wars, greatest of them the day of Bu'ath {cite:kamil-ibn-al-athir}."
