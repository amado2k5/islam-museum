summary:
  ar: "من ولد إدريس العلوي توثبوا على الخلافة في أثناء الدولة المروانية بالأندلس بعد الفتنة، وكانوا يتعاظمون ويأخذون أنفسهم بما يأخذها خلفاء بني العباس، فإذا حضرهم منشد أو محتاج تكلم الخليفة من وراء حجاب والحاجب واقف عند الستر يجاوب بما يقول له، إلى أن حضر ابن مقانا الأشبوني أمام حاجب إدريس بن يحيى الحمودي بمالقة فأنشده قصيدته النونية حتى بلغ وصف وجه الخليفة فرفع الخليفة الستر بنفسه وقال انظر كيف شئت وانبسط مع الشاعر وأحسن إليه {cite:nafh-tib-maqqari p. 250}."
  en: "The Hammudids — Idrisid Alids who claimed the Andalusi caliphate after the fitna, aping Abbasid pomp by speaking to petitioners from behind a curtain until Ibn Muqana's famous nuniyya made Idris b. Yahya lift the veil himself at Malaga {cite:nafh-tib-maqqari p. 250}."
  es: "Los Hammudíes — Alíes Idrisíes que reclamaron el califato andalusí después de la fitna, imitando la pompa abasí hablando con los suplicantes desde detrás de una cortina hasta que la famosa nuniyya de Ibn Muqana hizo que Idris b. Yahya levantara el velo él mismo en Málaga {cite:nafh-tib-maqqari p. 250}."
  fr: "Les Hammudides — Alides idrissides qui revendiquèrent le califat andalou après la fitna, imitant la pompe abbasside en parlant aux pétitionnaires derrière un rideau jusqu'à ce que la célèbre nuniyya d'Ibn Muqana fasse lever le voile lui-même à Idris b. Yahya à Malaga {cite:nafh-tib-maqqari p. 250}."
  ur: "حمودیوں - ادریس الیدس جنہوں نے فتنے کے بعد اندلس خلافت کا دعویٰ کیا، پردے کے پیچھے سے درخواست گزاروں سے بات کرتے ہوئے عباسی داد رسی کرتے ہوئے یہاں تک کہ ابن مقانہ کی مشہور نونیہ نے ادریس بن عاص کو بنایا۔ ملاگا میں یحییٰ نے خود پردہ اٹھایا۔ 250}۔"
  tr: "İdris el-Alavi'nin soyundan gelenler, fitneden sonra Endülüs'teki Mervaniler devleti döneminde halifeliği ele geçirdiler. Kibirliydiler ve kendilerini Abbasi halifeleri gibi görüyorlardı. Bir okuyucu veya muhtaç bir kişi yanlarına geldiğinde, halife perdenin arkasından konuşur, kâhin de perdenin yanında durup halifenin söylediklerine cevap verirdi. Sonra İbn Makana el-Eşbuni, Malaga'da İdris bin Yahya el-Hamudi'nin kâhininin huzuruna çıktı ve halifenin yüzünün tasvirine kadar Nuniyya şiirini okudu. Halife kendisi perdeyi kaldırdı ve \"İstediğin gibi bak, şaire karşı rahat ol ve ona iyi davran\" dedi. {kaynak: Nafh-tib-makqkari s. 250}"
  id: "Keturunan Idris al-Alawi merebut kekhalifahan pada masa pemerintahan Marwanid di Andalusia setelah terjadinya fitnah. Mereka sombong dan menganggap diri mereka seperti para khalifah Abbasiyah. Jika seorang pembaca puisi atau orang miskin datang kepada mereka, khalifah akan berbicara dari balik tirai, dan pengawal akan berdiri di dekat tirai dan menjawabnya sesuai ucapannya. Kemudian Ibn Maqana al-Ashbuni datang menghadap pengawal Idris bin Yahya al-Hamudi di Malaga dan membacakan puisi Nuniyya-nya hingga sampai pada deskripsi wajah khalifah. Khalifah sendiri mengangkat tirai dan berkata, “Lihatlah sesukamu, bersikaplah santai terhadap penyair itu, dan perlakukan dia dengan baik.” {cite:nafh-tib-maqqari p. 250}"
