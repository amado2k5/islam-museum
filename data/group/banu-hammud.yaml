summary:
  ar: "من ولد إدريس العلوي توثبوا على الخلافة في أثناء الدولة المروانية بالأندلس بعد الفتنة، وكانوا يتعاظمون ويأخذون أنفسهم بما يأخذها خلفاء بني العباس، فإذا حضرهم منشد أو محتاج تكلم الخليفة من وراء حجاب والحاجب واقف عند الستر يجاوب بما يقول له، إلى أن حضر ابن مقانا الأشبوني أمام حاجب إدريس بن يحيى الحمودي بمالقة فأنشده قصيدته النونية حتى بلغ وصف وجه الخليفة فرفع الخليفة الستر بنفسه وقال انظر كيف شئت وانبسط مع الشاعر وأحسن إليه {cite:nafh-tib-maqqari p. 250}."
  en: "The Hammudids — Idrisid Alids who claimed the Andalusi caliphate after the fitna, aping Abbasid pomp by speaking to petitioners from behind a curtain until Ibn Muqana's famous nuniyya made Idris b. Yahya lift the veil himself at Malaga {cite:nafh-tib-maqqari p. 250}."
