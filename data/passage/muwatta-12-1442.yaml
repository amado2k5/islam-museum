label: { ar: "الموطأ 1442 — جعفر بن محمد عن أبيه: وزنت فاطمة بنت رسول الله شعر الحسن والحسين وزينب وأم كلثوم، فتصدقت بوزن ذلك فضة", en: "Muwatta 1442" }
summary:
  ar: "يروي مالك عن جعفر بن محمد عن أبيه أنه قال وزنت فاطمة بنت رسول الله شعر حسن وحسين، وزينب وأم كلثوم، فتصدقت بزنة ذلك فضة. ويذكر المحقق أن عبد الرزاق أخرج عن ابن جريج أن فاطمة كانت لا يولد لها ولد إلا أمرت به فحلق ثم تصدقت بوزن شعره ورقا. {cite:muwatta-maruf-1997 p.645}"
