label: { ar: "صحيح مسلم 2887 — مرض النبي، الوجع", en: "Sahih Muslim 2887 — the Prophet's illness; pain", ur: "صحیح مسلم 2887 — نبی کی بیماری، درد", es: "Sahih Muslim 2887 — La enfermedad del Profeta; dolor", fr: "Sahih Muslim 2887 — La maladie du Prophète; la douleur", tr: "Sahih Muslim 2887 — Peygamberin hastalığı, acısı", id: "Sahih Muslim 2887 — Penyakit dan penderitaan Nabi" }
text: "… بْنُ مُوسَى، عَنْ نُبَيْهِ بْنِ وَهْبٍ، قَالَ خَرَجْنَا مَعَ أَبَانِ بْنِ عُثْمَانَ حَتَّى إِذَا كُنَّا بِمَلَلٍ اشْتَكَى عُمَرُ بْنُ عُبَيْدِ اللَّهِ عَيْنَيْهِ فَلَمَّا كُنَّا بِالرَّوْحَاءِ اشْتَدَّ وَجَعُهُ فَأَرْسَلَ إِلَى أَبَانَ بْنِ عُثْمَانَ يَسْأَلُهُ فَأَرْسَلَ إِلَيْهِ أَنِ اضْمِدْهُمَا بِالصَّبِرِ فَإِنَّ عُثْمَانَ - - حَدَّثَ عَنْ رَسُولِ اللَّهِ فِي الرَّجُلِ إِذَا اشْتَكَى عَيْنَيْهِ وَهُوَ مُحْرِمٌ ضَمَّدَهُمَا بِالصَّبِرِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2887، يذكر مرض النبي، والوجع، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2887 (The Book of Pilgrimage), that mentions the Prophet's illness, pain, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2887، جس میں نبی کی بیماری، درد، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 2887 (El Libro de la Peregrinación), menciona la enfermedad y el dolor del Profeta, así como una queja sobre una dolencia. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 2887 (Livre du pèlerinage), mentionne la maladie et les douleurs du Prophète. Le dictionnaire médical le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 2887 numaralı hadis, Peygamberimizin hastalığını, ağrılarını ve şikayetlerini anlatmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2887, menyebutkan penyakit, rasa sakit, dan keluhan Nabi. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan perawatan."
