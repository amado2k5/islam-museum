label: { ar: "الموطأ 2220 — يحيى عن مالك: في الرجل يوصي بثلث ماله لرجل، ويقول: غلامي يخدم فلانا ما عاش ثم هو حر، فينظر في ذلك، فيوجد العبد ثلث مال الميت: فإن خدمة العبد تقوم، ثم يتحاص الموصى له بالثلث ومن أوصي له بخدمته", en: "Muwatta 2220", es: "Muwatta 2220", fr: "Muwatta 2220", ur: "موطا 2220", tr: "El-Muvatta 2220 — Yahya, Malik'ten rivayetle: Bir kimse, malının üçte birini bir başkasına vasiyet eder ve şöyle derse: \"Kölem, filanca kişiye ömrü boyunca hizmet edecektir.\" Sonra köle azat edilir. Bu vasiyet incelenir ve kölenin ölenin malının üçte biri olduğu bulunursa, kölenin hizmeti değerlendirilir ve üçte biri vasiyet edilen kişi ile hizmeti vasiyet edilen kişi orantılı olarak pay alırlar.", id: "Al-Muwatta 2220 — Yahya berdasarkan riwayat Malik: Mengenai seorang laki-laki yang mewariskan sepertiga hartanya kepada seorang laki-laki, dan berkata: \"Budakku akan melayani si fulan selama ia hidup, kemudian ia bebas,\" lalu hal ini diperiksa, dan ternyata budak itu adalah sepertiga dari harta orang yang meninggal: kemudian jasa budak itu dinilai, lalu orang yang menerima warisan sepertiga dan orang yang menerima jasa tersebut mendapat bagian secara proporsional." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في الرجل يوصي بثلث ماله لرجل، ويقول: غلامي يخدم فلانا ما عاش، ثم هو حر، فينظر في ذلك، فيوجد العبد ثلث مال الميت. قال: فإن خدمة العبد تقوم، ثم يتحاص الذي أوصي له بالثلث بثلثه، ويتحاص الذي أوصي له بخدمة العبد بما قوم له من خدمة العبد. فيأخذ كل واحد منهما من خدمة العبد، أو من إجارته، إن كانت له إجارة، بقدر حصته. فإذا مات الذي جعلت له خدمة العبد ما عاش، عتق العبد. {cite:muwatta-maruf-1997 p.312} {cite:muwatta-maruf-1997 p.313}"
  tr: "Yahya şöyle dedi: Malik'in, servetinin üçte birini başka bir adama vasiyet eden bir adam hakkında şöyle dediğini işittim: \"Kölem filanca kişiye ömrü boyunca hizmet edecek, sonra azat edilecek.\" Bu vasiyet incelenir ve kölenin ölen kişinin servetinin üçte birini oluşturduğu görülür. Malik şöyle dedi: Kölenin hizmeti değerlendirilir, sonra üçte birini vasiyet edilen kişi kendi payına düşeni alır ve kölenin hizmetini vasiyet edilen kişi de değerlendirilen değerini paylaşır. Her biri, payına düşen oranda kölenin hizmetinden veya ücretinden (eğer ücreti varsa) alır. Sonra, kölenin hizmetini ömrü boyunca vasiyet edilen kişi ölürse, köle azat edilir."
  id: "Yahya berkata: Aku mendengar Malik berkata tentang seorang pria yang mewariskan sepertiga hartanya kepada pria lain, dengan berkata, \"Budakku akan melayani si fulan selama ia hidup, kemudian ia akan bebas,\" bahwa hal ini diperiksa, dan ditemukan bahwa budak tersebut merupakan sepertiga dari harta orang yang meninggal. Dia berkata: Jasa budak itu dinilai, kemudian orang yang menerima sepertiga hartanya membagi sepertiga bagiannya, dan orang yang menerima jasa budak itu membagi nilai yang dinilai. Masing-masing dari mereka mengambil dari jasa budak itu, atau dari upahnya, jika ia memiliki upah, sesuai dengan bagiannya. Kemudian, jika orang yang menerima jasa budak itu selama ia hidup meninggal, budak itu dibebaskan."
