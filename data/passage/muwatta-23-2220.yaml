label: { ar: "الموطأ 2220 — يحيى عن مالك: في الرجل يوصي بثلث ماله لرجل، ويقول: غلامي يخدم فلانا ما عاش ثم هو حر، فينظر في ذلك، فيوجد العبد ثلث مال الميت: فإن خدمة العبد تقوم، ثم يتحاص الموصى له بالثلث ومن أوصي له بخدمته", en: "Muwatta 2220" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في الرجل يوصي بثلث ماله لرجل، ويقول: غلامي يخدم فلانا ما عاش، ثم هو حر، فينظر في ذلك، فيوجد العبد ثلث مال الميت. قال: فإن خدمة العبد تقوم، ثم يتحاص الذي أوصي له بالثلث بثلثه، ويتحاص الذي أوصي له بخدمة العبد بما قوم له من خدمة العبد. فيأخذ كل واحد منهما من خدمة العبد، أو من إجارته، إن كانت له إجارة، بقدر حصته. فإذا مات الذي جعلت له خدمة العبد ما عاش، عتق العبد. {cite:muwatta-maruf-1997 p.312} {cite:muwatta-maruf-1997 p.313}"
