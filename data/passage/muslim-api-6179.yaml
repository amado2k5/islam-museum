label: { ar: "صحيح مسلم 6179 — الأب والأبوة", en: "Sahih Muslim 6179 — the father and fatherhood", ur: "صحیح مسلم 6179 — باپ اور والدیت", es: "Sahih Muslim 6179 — El padre y la paternidad" }
text: "حَدَّثَنِي عَبَّادُ بْنُ مُوسَى، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، أَخْبَرَنِي أَبِي، عَنْ مُحَمَّدِ بْنِ جُبَيْرِ، بْنِ مُطْعِمٍ عَنْ أَبِيهِ، أَنَّ امْرَأَةً، سَأَلَتْ رَسُولَ اللَّهِ شَيْئًا فَأَمَرَهَا أَنْ تَرْجِعَ إِلَيْهِ فَقَالَتْ يَا رَسُولَ اللَّهِ أَرَأَيْتَ إِنْ جِئْتُ فَلَمْ أَجِدْكَ قَالَ أَبِي كَأَنَّهَا تَعْنِي الْمَوْتَ. قَالَ \" فَإِنْ لَمْ تَجِدِينِي فَأْتِي أَبَا بَكْرٍ \". وَحَدَّثَنِيهِ حَجَّاجُ بْنُ الشَّاعِرِ، …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6179، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6179 (Introduction), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6179، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 6179 (Introducción), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
