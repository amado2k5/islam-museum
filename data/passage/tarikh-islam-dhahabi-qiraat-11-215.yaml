text: "… عرشه. وروى جعفر عنه قال : إذا لم يكن في القلب حزنٌ خَرِب كما إذا لم يكن في البيت ساكن خرب. قال ابن سعد : كان مالك ثقة قليل الحديث كان يكتب المصاحف. وقال جعفر بن سليمان : ثنا مالك …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 11، ص 215، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 11, p. 215, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 11، ص 215 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
