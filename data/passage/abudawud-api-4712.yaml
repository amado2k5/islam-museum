label: { ar: "سنن أبي داود 4712 — الأب والأبوة", en: "Sunan Abi Dawud 4712 — the father and fatherhood", ur: "سنن ابی داؤد 4712 — باپ اور والدیت", es: "Sunan Abi Dawud 4712 — El padre y la paternidad", fr: "Sunan Abi Dawud 4712 — Le père et la paternité", tr: "Sunan Abi Davud 4712 — Baba ve Babalık", id: "Sunan Abi Dawud 4712 — Sang Ayah dan Peran Ayah" }
text: "… عَبْدِ اللَّهِ بْنِ أَبِي قَيْسٍ، عَنْ عَائِشَةَ، قَالَتْ قُلْتُ يَا رَسُولَ اللَّهِ ذَرَارِيُّ الْمُؤْمِنِينَ فَقَالَ \" هُمْ مِنْ آبَائِهِمْ \". فَقُلْتُ يَا رَسُولَ اللَّهِ بِلاَ عَمَلٍ قَالَ \" اللَّهُ أَعْلَمُ بِمَا كَانُوا عَامِلِينَ \". قُلْتُ يَا رَسُولَ اللَّهِ فَذَرَارِيُّ الْمُشْرِكِينَ قَالَ \" مِنْ آبَائِهِمْ \". قُلْتُ بِلاَ عَمَلٍ قَالَ \" اللَّهُ أَعْلَمُ بِمَا كَانُوا عَامِلِينَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4712، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4712 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4712، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4712 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4712 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4712 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4712, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
