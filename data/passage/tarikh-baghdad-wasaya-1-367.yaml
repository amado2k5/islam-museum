text: "… لعلماء بنى اسرائيل ما هذا ? قالوا نحن تخبرك أن يوسف - حضره الموت أخذ مواثيقنا من اللّٰه، أن لا نخرج من مصر حتى نخرج حظامه معنا، فقال موسى وأيكم يدرى أبن قبر يوسف ؟ قالوا ماندرى، وما تدرى إلا …"
