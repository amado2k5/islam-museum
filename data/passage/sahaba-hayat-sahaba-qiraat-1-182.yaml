text: "… ثم افاق فقال : حدثى رسول اللّٰه: ان الّه تعالى اذا كان يوم القيامة ينزل الى العباد ليقضى بينهم و كل امة جاثية، فأول من يدعو به رجل جمع القرآن ورجل قتل فى سيل اللّٰه و رجل كثير المال فيقول …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 182، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 182, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 182 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 182, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 1, page 182, mentionne la collecte du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Kandahlawi'nin \"Sahabelerin Hayatları\" adlı eserinin 1. cildinin 182. sayfasında, Kur'an'ın derlenmesi ve el yazmaları hakkında bilgi verilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Kandahlawi, \"Kehidupan Para Sahabat,\" Jilid 1, halaman 182, menyebutkan penyusunan Al-Qur'an dan manuskripnya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
