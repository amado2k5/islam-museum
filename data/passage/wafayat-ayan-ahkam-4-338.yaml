text: "… كم أها البشر وقال المأمون يومالعلى من موسى الرضا المذكور ما يقول بنو أبيك فى حدنا العباس بن جسد المطلب فقال ما يقولون فار حل فرض اللّه طاعة بفيه على خامه وفرض طاعته على بنيه فامر له بالغ ألغدرهم وكان …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 4، ص 338، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 4, p. 338, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 4، ص 338 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan de Ibn Khallikan, volume numérisé 4, p. 338, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen digitalizado 4, p. 338, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 4. cildinin 338. sayfasından bir alıntı, Allah ve Resulü'nün emrettiği, yükümlülükler ve itaat konularından bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu alıntı, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Khallikan, \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka), Jilid 4, halaman 338, menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, yaitu kewajiban dan ketaatan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
