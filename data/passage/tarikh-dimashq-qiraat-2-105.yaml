text: "… على بابى فلا يدخل على احد حتى الحق باللّه عن وجل رواه الحافظ وابن ابى شيبة وقيل له مالك لا تتكلم فقال ان لسانى سبع اخاف ان تركته يأكلنى وقال اتقوا اللّه يا معشر القراء وخذوا ظهر من كان قبلكم …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 2، ص 105، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 2, p. 105, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 2، ص 105 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 2, pág. 105, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh Dimashq d'Ibn 'Asakir, volume 2, page 105 (numérisé), mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 2, s. 105'teki bir alıntıda Kur'an okuyucularından bahsedilir; makine tarafından okunabilir taranmış versiyondan, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 2 Bergambar, hlm. 105, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
