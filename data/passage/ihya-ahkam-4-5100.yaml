text: "… قال أقول أنه النبي الذي بشر به موسى قال فما ترى قال أرى معاداته أيام الحياة فهذا حكم الحسد في التحريم وأما المنافسة فليست بحرام بل هي إما واجبة وإما مندوبة وإما مباحة وقد يستعمل لفظ الحسد بدل المنافسة والمنافسة …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 5100، يرد فيه ذكر الواجب، والمندوب، والمباح، والحرام، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
