text: "ع عمر مشهورة' .كان يتتبع مشكل القران.ومتشابهه وذكر ابن دريد في كتاب الاشتقاق أنه كان يحمق.وقال أبو أحمد العسكري:واتهمه عمر برأي الخوارج.'وهو داعية فتنة وسوء.لذلك ضربه سيدنا عمر ونفاه إلى البصرة.تأديبأ وأمر الناس ألا يجالسوه.واتخذ بعض المغرضين-من هذه القصة-ذريعة للتهجم"
