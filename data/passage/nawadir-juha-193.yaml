text: "… لا كلام بهذا كان جحا يصلِّي بعد الإفطار في رمضان صلاةً مختصرةً، ثمَّ يتمِّم الطعام، فدعوهُ يوماً إلى الإفطار وأوعزوا إلى الإمام أن يطيل القراءة في الصلاة. فأخذ الإمام بتلاوة سورة الفاتحة فجوّد مادّاً الكلام مطولاً حتى ضجر جحا، وبعد …"
summary:
  ar: "في إفطار رمضان طُلب من الإمام أن يطيل الصلاة، فقرأ الفاتحة ويس مطولًا؛ فترك جحا الجماعة وصلى وحده، ثم عاد إليها حين قال الإمام بداية آية؛ وقال جحا إنه لا كلام في هذا. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  en: "At Ramadan iftar, the imam is asked to lengthen the prayer; he recites the Fatiha and Ya-Sin at length; Juha leaves the congregation to pray alone, then rejoins when the imam says the opening of a verse; Juha says there is no talk of this. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  ur: "رمضان کے افطار میں امام سے کہا گیا کہ نماز لمبی کرے؛ اس نے فاتحہ اور یٰسین طویل پڑھی؛ جحا جماعت چھوڑ کر اکیلا نماز پڑھنے لگا، پھر جب امام نے کسی آیت کا ابتدائی حصہ پڑھا تو دوبارہ شامل ہو گیا؛ جحا نے کہا کہ اس کی کوئی بات نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  fr: "À l'iftar du Ramadan, on demande à l'imam d'allonger la prière; il récite longuement la Fatiha et Ya-Sin; Juha quitte l'assemblée pour prier seul, puis la rejoint quand l'imam dit le début d'un verset; Juha dit qu'il n'y a rien à en dire. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  es: "En el iftar de Ramadán, le piden al imán que alargue la oración; él recita largamente la Fatiha y Ya-Sin; Juha deja la congregación para rezar solo y luego se reincorpora cuando el imán dice el comienzo de un versículo; Juha dice que de esto no se habla. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
