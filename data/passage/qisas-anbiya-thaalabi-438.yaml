text: "رد عليه كتاب أنهم وجدوا ذلك الغلام بنجران وهو واضع يده على صدغه ، فكلما مدت يده عادت إلى الصدغ ، فكتب إليهم عمر : واروه حيث وجد تموه . وقال مقاتل : كان أصحاب الأخاديد ثلاثة : واحد بنجران المن، وآخر"
