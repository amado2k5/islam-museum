  tr: "El-Sa'labi'nin Peygamber Hikayeleri'nden, Hüsrüv'ün yazışmalarından, alıntılanan versiyondan bir bölüm; kaynakların politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
