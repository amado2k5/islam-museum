label: { ar: "الموطأ 612 — جنازة زينب بنت أبي سلمة بعد الصبح: ابن عمر: إما أن تصلوا الآن وإما أن تتركوها حتى ترتفع الشمس", en: "Muwatta 612" }
summary:
  ar: "أول حديث في باب الصلاة على الجنائز بعد العصر وبعد الصبح. يرويه مالك عن محمد بن أبي حرملة مولى عبد الرحمن بن أبي سفيان بن حويطب، أن زينب بنت أبي سلمة توفيت وطارق أمير المدينة، فأُتي بجنازتها بعد صلاة الصبح فوُضعت بالبقيع، وكان طارق يغلّس بالصبح، فسمع ابن أبي حرملة عبد الله بن عمر يقول لأهلها: إما أن تصلوا على جنازتكم الآن، وإما أن تتركوها إلى أن ترتفع الشمس. ويذكر المحقق أن عنوان الباب في نسخة م «بعد الصبح إلى الإسفار وبعد العصر إلى الاصفرار»، وأنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي (4/32). {cite:muwatta-maruf-1997 p.314}"
