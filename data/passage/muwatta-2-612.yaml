label: { ar: "الموطأ 612 — جنازة زينب بنت أبي سلمة بعد الصبح: ابن عمر: إما أن تصلوا الآن وإما أن تتركوها حتى ترتفع الشمس", en: "Muwatta 612", es: "Muwatta 612", fr: "Muwatta 612", ur: "موطا 612", tr: "El-Muvatta 612 — Zeynep bint Ebu Seleme'nin cenazesi, şafak vakti: İbn Ömer: Ya şimdi namaz kılarsınız ya da güneş doğana kadar beklersiniz.", id: "Al-Muwatta 612 — Pemakaman Zaynab bint Abi Salamah setelah fajar: Ibn Umar: Kalian shalat sekarang atau tunda sampai matahari terbit." }
summary:
  ar: "أول حديث في باب الصلاة على الجنائز بعد العصر وبعد الصبح. يرويه مالك عن محمد بن أبي حرملة مولى عبد الرحمن بن أبي سفيان بن حويطب، أن زينب بنت أبي سلمة توفيت وطارق أمير المدينة، فأُتي بجنازتها بعد صلاة الصبح فوُضعت بالبقيع، وكان طارق يغلّس بالصبح، فسمع ابن أبي حرملة عبد الله بن عمر يقول لأهلها: إما أن تصلوا على جنازتكم الآن، وإما أن تتركوها إلى أن ترتفع الشمس. ويذكر المحقق أن عنوان الباب في نسخة م «بعد الصبح إلى الإسفار وبعد العصر إلى الاصفرار»، وأنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي (4/32). {cite:muwatta-maruf-1997 p.314}"
  tr: "İkindi ve sabah namazlarından sonra kılınan cenaze namazları bölümündeki ilk hadis, Malik tarafından, Abdurrahman ibn Ebu Sufyan ibn Huveytib'in azatlı kölesi Muhammed ibn Ebu Harmala'dan rivayet edilmiştir. Hadiste, Zeynep bint Ebu Seleme'nin Tarık'ın Medine valisi olduğu dönemde vefat ettiği, cenazesinin sabah namazından sonra getirilerek el-Baki mezarlığına konulduğu, Tarık'ın sabah namazını çok erken kıldığı, İbn Ebu Harmala'nın Abdullah ibn Ömer'in ailesine şöyle dediğini duyduğu anlatılmaktadır. Editör, M el yazmasındaki bölüm başlığının \"Sabah namazından sonra güneş doğana kadar ve ikindi namazından sonra güneş sararana kadar\" olduğunu ve Malik'ten Ebu Musab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki'nin (4/32) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.314}"
  id: "Hadits pertama dalam bab tentang salat jenazah setelah salat Asar dan setelah salat Subuh diriwayatkan oleh Malik dari Muhammad ibn Abi Harmalah, budak yang dibebaskan oleh 'Abd al-Rahman ibn Abi Sufyan ibn Huwaytib. Hadits tersebut menyatakan bahwa Zaynab bint Abi Salamah meninggal dunia ketika Tariq menjadi gubernur Madinah. Jenazahnya dibawa setelah salat Subuh dan dimakamkan di pemakaman al-Baqi'. Tariq biasa melaksanakan salat Subuh sangat pagi. Ibn Abi Harmalah mendengar 'Abdullah ibn 'Umar berkata kepada keluarganya: \"Laksanakan salat jenazah sekarang juga, atau tunda sampai matahari terbit.\" Editor mencatat bahwa judul bab dalam manuskrip M adalah \"Setelah Subuh sampai matahari terbit dan setelah Asar sampai matahari berubah kuning,\" dan bahwa hadits tersebut diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (4/32). {mengutip:muwatta-maruf-1997 hal.314}"
