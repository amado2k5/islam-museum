label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ١٤، المقطع ٢ من ٢", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 14, section 2 of 2", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 14، حصہ 2" }
text: "أتاك ولا يأتيك، فكيف يكون دعواك حجة علينا. فتعلم بهذا بطلان كيد الخصوم في توكلهم لليهود بعد أربع مائة سنة، وبعد فكيف لم يقولوا له: أي الأمنيتين أخبرت أنا لا نفعلها ليبينوا للناس أنه لا حجة عليهم فيما …"
summary:
  ar: "مقطع من الباب ١٤ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 14 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 14 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
