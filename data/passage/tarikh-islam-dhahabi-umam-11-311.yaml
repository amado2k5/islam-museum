text: "… فبعث الحجاج بإحداهما وهي شاهفرند إلى الوليد فأولدها يزيد بن الوليد. وفيروز هذا هو ابن بنت شيرويه بن كسرى، وأم شيرويه ابنة خاقان ملك الترك، وأمها - أعني أم فيروز- هي بنت قيصر عظيم الروم، فلذلك يقول : يزيد ويفتخر …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 11، ص 311، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 11, p. 311, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 11، ص 311 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
