text: "… فبعث الحجاج بإحداهما وهي شاهفرند إلى الوليد فأولدها يزيد بن الوليد. وفيروز هذا هو ابن بنت شيرويه بن كسرى، وأم شيرويه ابنة خاقان ملك الترك، وأمها - أعني أم فيروز- هي بنت قيصر عظيم الروم، فلذلك يقول : يزيد ويفتخر …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 11، ص 311، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 11, p. 311, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 11، ص 311 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Tarikh al-Islam de al-Dhahabi, volumen 11, pág. 311, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 11, page 311, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "Al-Dhahabi'nin *İslam Tarihi*, 11. Cilt (resimli baskı), 311. sayfadan, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 11 (edisi bergambar), halaman 311, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
