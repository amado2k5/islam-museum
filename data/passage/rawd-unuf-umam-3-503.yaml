text: "- - مقتل مرحب اليهودى. قال ابن إسحاق : ولمًا افتح رسولُ اللّٰه من حُمبونهم ما افتتح، وحاز من الأموال ماحاز، انهوا إلى حِصْنيهم الوَطِيح والثلاَلِم،. وكان آخر حصود أهل خيبر افتاحًا، فحامرهم رسولُ الله بضع عشرة ليلة. قال ابن …"
