label: { ar: "الموطأ 1481 — مالك: الأمر المجتمع عليه أن المسلم لا يرث الكافر بقرابة ولا ولاء ولا رحم، ولا يحجب أحدا عن ميراثه", en: "Muwatta 1481" }
summary:
  ar: "يقول مالك الأمر المجتمع عليه عندهم، والسنة التي لا اختلاف فيها، أنه لا يرث المسلم الكافر بقرابة ولا ولاء ولا رحم، ولا يحجب أحدا عن ميراثه. وكذلك كل من لا يرث، إذا لم يكن دونه وارث، فإنه لا يحجب أحدا عن ميراثه. {cite:muwatta-maruf-1997 p.24}"
