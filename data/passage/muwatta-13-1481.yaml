label: { ar: "الموطأ 1481 — مالك: الأمر المجتمع عليه أن المسلم لا يرث الكافر بقرابة ولا ولاء ولا رحم، ولا يحجب أحدا عن ميراثه", en: "Muwatta 1481", es: "Muwatta 1481", fr: "Muwatta 1481", ur: "موطا 1481", tr: "El-Muvatta 1481 — Malik: İttihat şudur ki, bir Müslüman, kan bağı, biat veya akrabalık yoluyla gayrimüslimden miras alamaz; aynı şekilde, kimsenin kendisinden miras almasını da engellemez.", id: "Al-Muwatta 1481 — Malik: Konsensusnya adalah bahwa seorang Muslim tidak mewarisi harta dari non-Muslim berdasarkan hubungan darah, baiat, atau kekerabatan, dan ia juga tidak menghalangi siapa pun untuk mewarisi harta darinya." }
summary:
  ar: "يقول مالك الأمر المجتمع عليه عندهم، والسنة التي لا اختلاف فيها، أنه لا يرث المسلم الكافر بقرابة ولا ولاء ولا رحم، ولا يحجب أحدا عن ميراثه. وكذلك كل من لا يرث، إذا لم يكن دونه وارث، فإنه لا يحجب أحدا عن ميراثه. {cite:muwatta-maruf-1997 p.24}"
  tr: "Malik, aralarındaki yerleşik uygulamanın ve tartışmasız Sünnetin, bir Müslümanın akrabalık, biat veya kan bağı yoluyla gayrimüslimden miras almaması ve kimsenin kendisinden miras almasını engellememesi olduğunu belirtir. Benzer şekilde, kendisinden sonra mirasçısı olmayan kimse de, başkasının kendisinden miras almasını engellemez. {cite:muwatta-maruf-1997 s.24}"
  id: "Malik menyatakan bahwa praktik yang telah mapan di antara mereka, dan Sunnah yang tidak diragukan lagi, adalah bahwa seorang Muslim tidak mewarisi dari non-Muslim melalui hubungan kekerabatan, baiat, atau ikatan darah, dan ia juga tidak menghalangi siapa pun untuk mewarisi darinya. Demikian pula, siapa pun yang tidak mewarisi, jika tidak ada ahli waris di bawahnya, tidak menghalangi siapa pun untuk mewarisi darinya. {cite:muwatta-maruf-1997 p.24}"
