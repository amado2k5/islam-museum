text: |-
  ٢٩٥
  التغطية وقد كفرت الشيء أكفره بالكسر كفرا أى سترته ورماد مكف وراذاسفت إلى يح
  التراب عليه حتى غطنه وأنشد الاصمعى
  هل تعرف الدار با على ذى القور • قددرست غبرر ماد مكفور .
  والكفر أيضا القرية وفى الحديت تخوجكم الروم منها كفرا كفرا أى قرية قرية من قرى
  الشام واهذا قالوا كفرتوثا وكفر تعقاب وغير ذلك انماهى قرى نسبت الى رجال ومنه قول
  معاوية أهل الكفورهم أهل القبور يقول اهم بمنزلة الموتى لا يناهدون الامصار والجع
  وما أشبهها والكفرأيضا القيرومنه قيل اللهم اغة ولاهل الكفور والكة رأيضاظلمة الليل
  وسواده وقد يكسر قال حيد فوردت قبل انيلاج الفجر * وابن ذكا-كامن فى كفر
  أى قيما يواريه من سواد اللسل والسكافر الليل المظلم لانه ستركل شى يظلمته والكافر الذى كفر
  درعه يثوب أى غطام وايسه فوقه وكل شى غطى شيشا فقد كفرم قال ابن السكيت ومنه سمى
  السكافر لانه يسترتعم اللّٰه عليه والكافر الير قال ثعلبة بن صعير المازنى
  فتذ كراثة لارشد ابعدما • ألقت ذكا.يمينها فى كافر
  بعنى الشمس انها بدأت فى المغيب ويحتمل أن يكون أراد الليل وذكرابن السكيت أت لبيدا
  سرق هذا المعنى فقال
  حتى اذا ألقت يدافى كافر • وأجن عورات الشغور ظلامها.
  والكافر الذى فى شعر المتلس (ا النهر العظيم والمكافر الزارع لانه يغطى البذربالتراب والكفار
  لزرّاع والمتكفر الداخل فى سلاحه وأكفرت الرجل أى دعوته كافرا يقال لا تكفر أحدا
  من أهل القبلة أى لا تنسيهم إلى الكفر والتكنير أن يخضع الانسان لغيرم كما يكفر العلج
  للدهاقين يضع يده على صدره ويتطامن له قال جرير
  واذا سمعت يجرب قيس بعدها • فضعوا السلاح وكفرواتكفيرا
  وتكفير اليمين فعل ما يجب بالحنث فيها والاسم السكفارة والتكفير فى المعاصى كالاحباط
  فى النواب أبو عمر والسكافور الطلع والفراءمثله وقال الاصمعى هو وعاء طلع النخل وكذلك
  الكفرّى والسكافور من الطيب وأما قول الراعى
  تكسو المضارق واللبات ذا أرج *من قصب معتلف الكافورد راج
  فان الظي الذى يكون منسه المسك انمايرعى سئبل الطيب فيجعله كافورا والكفر بكسر
  القا العظسيم من الحبال حكاه أيو عبيد عن الفراء ⁦(كفهر)⁩ يقال رأيته مكفهرالوجه
  وقدا كفهرّ الرجل اذا عيس ومنه قول ابن مسعودرضى اللّٰه عنه اذ القيت السكافر فالقه
  بوجه - كفهر يقول لاتلفه بوحه منيسط وفلان.كفهرّ اللون اذا ضرب لونه الى الغبرة مع
  الغلظ قال الراجز
  قام الى عذراء بالقطاط • يمشى بثل قائم الفسطاط • بمكفهرّ اللون دى حطاط
  والمكفهز من السحاب الاسود الغليظ الذى ركب بعضه بعضا ⁦(كر )⁩ الكمرجع كرة
  والمكه ور الرجل الذى أصاب الماتن طرف كرته والكهرى مثال الزمكى العظيم الكهرة ذكره
  ابن السراج فى كتابد وكامرته فكهرته أكرم اذاغابه بعظم الكمرة قال الراجز
  قوله بالكسر تيع فيه الفارابجه
  ولاشبهة فى انه غلط وان لم يتذه
  ل صاب الفاموس تعاله مت.
  ان الطيب
  ١ ي فى توله فألقيتها بالشغه
  من جنب كافر كذلَكْ اقيوكل
  قط مضلل
