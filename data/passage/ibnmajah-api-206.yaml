label: { ar: "سنن ابن ماجه 206 — عمل يعدل عملا أعظم منه، وزر من تبع", en: "Sunan Ibn Majah 206 — a deed that equals a greater one; bearing the burden of those who follow", ur: "سنن ابن ماجہ 206 — ایک عمل جو بڑے عمل کے برابر ہے، پیروی کرنے والوں کا بوجھ", es: "Sunan Ibn Majah 206 — una acción que equivale a una mayor; llevar la carga de aquellos que siguen", fr: "Sunan Ibn Majah 206 — un acte qui en vaut un plus grand; porter le fardeau de ceux qui suivent", tr: "Sunan İbn Majah 206 — Daha büyük bir amele denk olan bir amel ve onu uygulayanların yükü" }
text: "… بْنُ أَبِي حَازِمٍ، عَنِ الْعَلاَءِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الأَجْرِ مِثْلُ أُجُورِ مَنِ اتَّبَعَهُ لاَ يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا وَمَنْ دَعَا إِلَى ضَلاَلَةٍ فَعَلَيْهِ مِنَ الإِثْمِ مِثْلُ آثَامِ مَنِ اتَّبَعَهُ لاَ يَنْقُصُ ذَلِكَ مِنْ آثَامِهِمْ شَيْئًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 206، يذكر عمل يعدل عملا أعظم منه، ووزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 206 (The Book of the Sunnah), that speaks of a deed that equals a greater one, bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 206، جس میں ایک عمل جو بڑے عمل کے برابر ہے، پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 206 (El Libro de la Sunnah), habla de una acción que equivale a otra mayor, cargando con el peso de quienes la siguen. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 206 (Le Livre de la Sunna), évoque un acte plus grand encore, dont le poids se fait sentir pour ceux qui le suivent. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, écrivent, effacent ou évaluent un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 206 numaralı hadiste, daha büyük bir ameli karşılayabilecek bir amelden ve onu uygulayanlar için günah yükünden bahsedilir. Bu, iyi ve kötü amellerin bir listesi halinde derlenmiş olup, ameli sayan, kaydeden, silen veya tartan metinleri de içermektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 206, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar, dan beban dosa bagi mereka yang mengikutinya. Amalan tersebut disusun dalam daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
