label: { ar: "مسلم 2639 — فإنك مع من أحببت", en: "Muslim 2639 — You will be with whom you love" }
text: "قال أعرابي لرسول الله: متى الساعة؟ قال: ما أعددت لها؟ قال: حب الله ورسوله، قال: فإنك مع من أحببت، قال أنس: فما فرحنا بعد الإسلام فرحاً أشد من قول النبي: فإنك مع من أحببت"
summary:
  ar: "رواية أنس بن مالك في باب المرء مع من أحب من كتاب البر والصلة والآداب في صحيح مسلم؛ وفيها قول أنس: أنا أحب الله ورسوله وأبا بكر وعمر فأرجو أن أكون معهم وإن لم أعمل بأعمالهم."
