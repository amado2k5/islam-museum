label: { ar: "سنن أبي داود 4829 — مَثَل المؤمن", en: "Sunan Abi Dawud 4829 — the likeness of the believer", ur: "سنن ابی داؤد 4829 — مومن کی مثال", es: "Sunan Abi Dawud 4829 — la imagen del creyente", fr: "Sunan Abi Dawud 4829 — l'image du croyant", tr: "Sunan Abi Davud 4829 — Müminin Meseli", id: "Sunan Abi Dawud 4829 — Perumpamaan orang beriman" }
text: "… مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَبَانُ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَثَلُ الْمُؤْمِنِ الَّذِي يَقْرَأُ الْقُرْآنَ مَثَلُ الأُتْرُجَّةِ رِيحُهَا طَيِّبٌ وَطَعْمُهَا طَيِّبٌ وَمَثَلُ الْمُؤْمِنِ الَّذِي لاَ يَقْرَأُ الْقُرْآنَ كَمَثَلِ التَّمْرَةِ طَعْمُهَا طَيِّبٌ وَلاَ رِيحَ لَهَا وَمَثَلُ الْفَاجِرِ الَّذِي يَقْرَأُ الْقُرْآنَ كَمَثَلِ الرَّيْحَانَةِ رِيحُهَا طَيِّبٌ وَطَعْمُهَا مُرٌّ وَمَثَلُ الْفَاجِرِ الَّذِي لاَ يَقْرَأُ الْقُرْآنَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4829، يذكر مَثَل المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 4829 (General Behavior (Kitab Al-Adab)), that mentions the likeness of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 4829، جس میں مومن کی مثال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4829 (Conducta General (Kitab Al-Adab)), menciona la semejanza del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 4829 (Guide des mœurs), évoque les qualités du croyant. Le moteur de recherche « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux caractéristiques du croyant."
  tr: "Sünen Ebu Davud'da yer alan 4829 numaralı hadiste müminin örneği anlatılmaktadır. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4829, menyebutkan perumpamaan tentang orang beriman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
