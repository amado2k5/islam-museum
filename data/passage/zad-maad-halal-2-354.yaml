text: "… فلا ينبغي أن يُمسِكَهَا مع علمه بحالها، ويرضى لنفسه أن يكون زوجَ بغي. فإن قيل: فما تقولون: لو كانت أمة ثم اشتراها، هل يَحِلُّ له وطؤها بملك اليمين؟ قلنا : لا تَحِلُّ له لأنه تحريم مؤبَّد، فحرمت على مشتريها كالرضاع، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 354، يذكر ما أُحل، وما لا يحل، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 354, that mentions what was made lawful, what is not lawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
