label: { ar: "الموطأ 143 — سعيد بن المسيب: الجنب المتيمم إذا أدرك الماء اغتسل لما يستقبل", en: "Muwatta 143", es: "Muwatta 143", fr: "Muwatta 143", ur: "موطا 143", tr: "El-Muvatta 143 — Sa’id ibn al-Musayyab: Ritüel olarak kirlilik halinde olan ve teyemmüm yapmış bir kişi, su bulursa gusül abdesti almalıdır.", id: "Al-Muwatta 143 — Sa’id ibn al-Musayyab: Seseorang yang dalam keadaan najis dan telah berwudhu kering (tayammum) hendaknya bermandi (ghusl) jika menemukan air." }
summary:
  ar: "أول أثر في باب تيمم الجنب. يرويه يحيى عن مالك عن عبد الرحمن بن حرملة أن رجلاً سأل سعيد بن المسيب عن الجنب يتيمم ثم يدرك الماء، فقال: إذا أدرك الماء فعليه الغسل لما يستقبل. وينقل المحقق عن البيهقي بسنده إلى أبي الزناد أن فقهاء المدينة السبعة، وفيهم سعيد بن المسيب، كانوا يقولون: من تيمم فصلى ثم وجد الماء فلا إعادة عليه، ويتوضأ لما يستقبل ويغتسل، والتيمم من الجنابة والوضوء سواء. {cite:muwatta-maruf-1997 p.101} {cite:muwatta-maruf-1997 p.102}"
  tr: "Cünbî derecede büyük bir teyemmüm halinde olan kimse için teyemmüm konusuyla ilgili ilk hadis, Yahya'nın Malik'ten, o da Abdurrahman ibn Harmalah'tan rivayet ettiğine göre, bir adam Said ibn el-Musayyib'e cünbî derecede büyük bir teyemmüm halinde olan ve sonra su bulan bir kimse hakkında sormuştur. Said ibn el-Musayyib şöyle cevap vermiştir: \"Su bulursa, bir sonraki namaz için gusül abdesti almalıdır.\" Araştırmacı, isnadı Ebu el-Zinad'a dayanan el-Beyhaki'den alıntı yaparak, Said ibn el-Musayyib de dahil olmak üzere Medine'nin yedi fıkıhçısının şöyle dediğini aktarmaktadır: \"Teyemmüm yapıp namaz kılan ve sonra su bulan kimsenin namazı tekrar etmesine gerek yoktur. Bir sonraki namaz için abdest almalı ve sonra gusül abdesti almalıdır.\" Cünbî derecede büyük bir teyemmüm ve abdest aynı şeydir. {cite:muwatta-maruf-1997 s.101} {cite:muwatta-maruf-1997 s.102}"
  id: "Hadits pertama tentang tayammum bagi orang yang dalam keadaan junub (najis besar) telah diriwayatkan oleh Yahya dari Malik dari Abd al-Rahman ibn Harmalah bahwa seorang pria bertanya kepada Sa'id ibn al-Musayyib tentang seseorang yang dalam keadaan junub yang melakukan tayammum dan kemudian menemukan air. Beliau menjawab: Jika ia menemukan air, ia harus berwudhu untuk shalat berikutnya. Peneliti mengutip al-Bayhaqi, dengan sanadnya kembali kepada Abu al-Zinad, bahwa tujuh ahli fiqih Madinah, termasuk Sa'id ibn al-Musayyib, biasa mengatakan: Barang siapa yang melakukan tayammum dan shalat, kemudian menemukan air, tidak perlu mengulang shalat. Ia harus berwudhu untuk shalat berikutnya dan kemudian berwudhu. Tayammum untuk junub dan wudhu adalah sama. {kutip:muwatta-maruf-1997 hal.101} {kutip:muwatta-maruf-1997 hal.102}"
