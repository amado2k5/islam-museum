label: { ar: "الموطأ 143 — سعيد بن المسيب: الجنب المتيمم إذا أدرك الماء اغتسل لما يستقبل", en: "Muwatta 143" }
summary:
  ar: "أول أثر في باب تيمم الجنب. يرويه يحيى عن مالك عن عبد الرحمن بن حرملة أن رجلاً سأل سعيد بن المسيب عن الجنب يتيمم ثم يدرك الماء، فقال: إذا أدرك الماء فعليه الغسل لما يستقبل. وينقل المحقق عن البيهقي بسنده إلى أبي الزناد أن فقهاء المدينة السبعة، وفيهم سعيد بن المسيب، كانوا يقولون: من تيمم فصلى ثم وجد الماء فلا إعادة عليه، ويتوضأ لما يستقبل ويغتسل، والتيمم من الجنابة والوضوء سواء. {cite:muwatta-maruf-1997 p.101} {cite:muwatta-maruf-1997 p.102}"
