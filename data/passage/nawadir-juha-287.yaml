text: "… نِمْتُ قبل أن أجيء إلى هنا نزل في إحدى القرى ضيفاً على إمام القرية، فسأله صاحب البيت: ألم تنم؟ أأنت عطشان؟ ولم يذكر شيئاً عن الطعام. فأجابه الشيخ: نِمْتُ قبل أن أجيء إلى هنا في قرية بيكارباشي. أنشأتُها حسب مشورتكم …"
summary:
  ar: "كان جحا ضيفاً في بيت إمام قرية فسُئل هل نام أو هل هو عطشان، ولم يذكر الطعام، وتستمر الحكاية في الجزء التالي. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  en: "Juha, a guest at a village imam's house, is asked if he has slept or is thirsty, and does not mention food. The story continues in the next part. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  ur: "جحا ایک گاؤں کے امام کے گھر مہمان ہوتا ہے اور اس سے پوچھا جاتا ہے کہ کیا وہ سو چکا ہے یا پیاسا ہے، اور وہ کھانے کا ذکر نہیں کرتا۔ حکایت اگلے حصے میں جاری رہتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  fr: "Juha, invité chez l'imam d'un village, se voit demander s'il a dormi ou s'il a soif, et ne mentionne pas la nourriture. L'histoire continue dans la partie suivante. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  es: "Juha, invitado en la casa del imán de una aldea, es preguntado si ha dormido o si tiene sed, y no menciona la comida. La historia continúa en la parte siguiente. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
