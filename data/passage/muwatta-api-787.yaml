label: { ar: "موطأ مالك 787 — الحلال، ما لا يحل", en: "Muwatta Malik 787 — the lawful; what is not lawful", ur: "موطأ مالک 787 — حلال، جو حلال نہیں", es: "Muwatta Malik 787 — lo lícito; lo ilícito", fr: "Muwatta Malik 787 — le licite; ce qui n’est pas licite" }
text: "… الأَحْوَالِ وَقَدْ أَرْخَصَ فِي الْمَيْتَةِ عَلَى حَالِ الضَّرُورَةِ. قَالَ مَالِكٌ وَأَمَّا مَا قَتَلَ الْمُحْرِمُ أَوْ ذَبَحَ مِنَ الصَّيْدِ فَلاَ يَحِلُّ أَكْلُهُ لِحَلاَلٍ وَلاَ لِمُحْرِمٍ لأَنَّهُ لَيْسَ بِذَكِيٍّ كَانَ خَطَأً أَوْ عَمْدًا فَأَكْلُهُ لاَ يَحِلُّ وَقَدْ سَمِعْتُ ذَلِكَ مِنْ غَيْرِ وَاحِدٍ وَالَّذِي يَقْتُلُ الصَّيْدَ ثُمَّ يَأْكُلُهُ إِنَّمَا عَلَيْهِ كَفَّارَةٌ وَاحِدَةٌ مِثْلُ مَنْ قَتَلَهُ وَلَمْ يَأْكُلْ مِنْهُ."
summary:
  ar: "حديث في موطأ مالك، رقم 787، يذكر الحلال، وما لا يحل، والرخصة. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 787 (Hajj), that mentions the lawful, what is not lawful, the concession. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 787، جس میں حلال، جو حلال نہیں، رخصت کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 787 (Hajj), menciona lo lícito, lo ilícito y las concesiones. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 787 (Hajj), mentionne ce qui est licite, ce qui ne l'est pas et les exceptions. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
