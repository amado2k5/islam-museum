label: { ar: "الموطأ 2119 — مالك: احتجاج محتج بأن رجلا لو أعتق عبده ثم جاء رجل يطلب سيد العبد بدين، فشهد له رجل وامرأتان، فإن ذلك يثبت الحق على سيد العبد، حتى ترد به عتاقته، وذلك ليس على ما قال", en: "Muwatta 2119" }
summary:
  ar: "قال مالك: وهذا الاحتجاج: لو أن رجلا أعتق عبده، ثم جاء رجل يطلب سيد العبد بدين له عليه، فشهد له على حقه ذلك رجل وامرأتان، فإن ذلك يثبت الحق على سيد العبد، حتى ترد به عتاقته، إذا لم يكن لسيد العبد مال غير العبد. يريد أن يجيز بذلك شهادة النساء في العتاقة، فإن ذلك ليس على ما قال. وإنما مثل ذلك الرجل يعتق عبده، ثم يأتي طالب الحق على سيده بشاهد واحد، فيحلف مع شاهده، ثم يستحق حقه، وترد بذلك عتاقة العبد. {cite:muwatta-maruf-1997 p.265} {cite:muwatta-maruf-1997 p.266}"
