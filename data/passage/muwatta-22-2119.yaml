label: { ar: "الموطأ 2119 — مالك: احتجاج محتج بأن رجلا لو أعتق عبده ثم جاء رجل يطلب سيد العبد بدين، فشهد له رجل وامرأتان، فإن ذلك يثبت الحق على سيد العبد، حتى ترد به عتاقته، وذلك ليس على ما قال", en: "Muwatta 2119", es: "Muwatta 2119", fr: "Muwatta 2119", ur: "موطا 2119", tr: "El-Muvatta 2119 — Malik: Şöyle bir iddia ortaya atıldı: Eğer bir adam kölesini azat ederse ve sonra başka bir adam gelip kölenin efendisinden borcunun ödenmesini isterse ve bir erkek ile iki kadın onun lehine şahitlik ederse, bu durum kölenin efendisine karşı hakkını tesis eder ve kölenin azat edilmesinin iptal edilmesine yol açar. Bu onun söylediği gibi değildir.", id: "Al-Muwatta 2119 — Malik: Ada argumen yang menyatakan bahwa jika seorang pria membebaskan budaknya, dan kemudian pria lain datang untuk meminta pembayaran hutang dari tuan budak tersebut, dan seorang pria dan dua wanita bersaksi untuknya, maka itu akan menegakkan hak terhadap tuan budak tersebut, sampai pada titik di mana pembebasan budak tersebut akan dibatalkan. Ini tidak seperti yang dia katakan." }
summary:
  ar: "قال مالك: وهذا الاحتجاج: لو أن رجلا أعتق عبده، ثم جاء رجل يطلب سيد العبد بدين له عليه، فشهد له على حقه ذلك رجل وامرأتان، فإن ذلك يثبت الحق على سيد العبد، حتى ترد به عتاقته، إذا لم يكن لسيد العبد مال غير العبد. يريد أن يجيز بذلك شهادة النساء في العتاقة، فإن ذلك ليس على ما قال. وإنما مثل ذلك الرجل يعتق عبده، ثم يأتي طالب الحق على سيده بشاهد واحد، فيحلف مع شاهده، ثم يستحق حقه، وترد بذلك عتاقة العبد. {cite:muwatta-maruf-1997 p.265} {cite:muwatta-maruf-1997 p.266}"
  tr: "Malik şöyle dedi: Bu argüman şuna dayanmaktadır: Eğer bir adam kölesini azat ederse ve daha sonra başka bir adam gelip kölenin efendisi tarafından kendisine borçlu olunan bir borcun ödenmesini isterse ve bir erkek ve iki kadın onun iddiasına tanıklık ederse, efendinin köleden başka mal varlığı yoksa, borç efendi aleyhine kurulmuş sayılır ve kölenin azat edilmesi iptal edilir. Bunu, azat davalarında kadınların tanıklığını haklı çıkarmak için kullanmayı amaçlıyor, ancak durum böyle değil. Aksine, böyle bir durumda, bir adam kölesini azat eder ve sonra alacaklı tek bir tanıkla gelir, tanığıyla birlikte yemin eder ve sonra hakkını alır ve kölenin azat edilmesi iptal edilir. {cite:muwatta-maruf-1997 s.265} {cite:muwatta-maruf-1997 s.266}"
  id: "Malik berkata: Argumen ini didasarkan pada hal berikut: Jika seorang pria membebaskan budaknya, dan kemudian pria lain datang untuk menuntut pembayaran hutang yang owed kepadanya oleh majikan budak tersebut, dan seorang pria dan dua wanita bersaksi atas klaimnya, maka hutang tersebut ditetapkan terhadap majikan, dan pembebasan budak tersebut dicabut, dengan syarat majikan tersebut tidak memiliki aset lain selain budak tersebut. Ia bermaksud menggunakan ini untuk membenarkan kesaksian wanita dalam kasus pembebasan budak, tetapi ini bukan kasusnya. Sebaliknya, dalam situasi seperti itu, seorang pria membebaskan budaknya, dan kemudian kreditor datang dengan satu saksi, bersumpah bersama saksinya, dan kemudian ia berhak atas haknya, dan pembebasan budak tersebut dicabut. {cite:muwatta-maruf-1997 p.265} {cite:muwatta-maruf-1997 p.266}"
