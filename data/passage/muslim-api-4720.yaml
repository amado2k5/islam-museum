label: { ar: "صحيح مسلم 4720 — الأب والأبوة، اليتيم وفقد الأب", en: "Sahih Muslim 4720 — the father and fatherhood; the orphan and the father lost", ur: "صحیح مسلم 4720 — باپ اور والدیت، یتیم اور باپ کی موت", es: "Sahih Muslim 4720 — El padre y la paternidad; el huérfano y el padre perdido", fr: "Sahih Muslim 4720 — Le père et la paternité; l’orphelin et le père perdu", tr: "Sahih Muslim 4720 — Baba ve Babalık, Yetim ve Babanın Kaybı", id: "Sahih Muslim 4720 — Ayah dan Peran Ayah, Anak Yatim dan Kehilangan Ayah" }
text: "… زُهَيْرٌ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يَزِيدَ، حَدَّثَنَا سَعِيدُ بْنُ أَبِي أَيُّوبَ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي جَعْفَرٍ الْقُرَشِيِّ، عَنْ سَالِمِ، بْنِ أَبِي سَالِمٍ الْجَيْشَانِيِّ عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ، أَنَّ رَسُولَ اللَّهِ قَالَ \" يَا أَبَا ذَرٍّ إِنِّي أَرَاكَ ضَعِيفًا وَإِنِّي أُحِبُّ لَكَ مَا أُحِبُّ لِنَفْسِي لاَ تَأَمَّرَنَّ عَلَى اثْنَيْنِ وَلاَ تَوَلَّيَنَّ مَالَ يَتِيمٍ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4720، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4720 (The Book on Government), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4720، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4720 (El Libro del Gobierno), menciona al padre y la paternidad, al huérfano y al padre fallecido. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 4720 (Le Livre du gouvernement), évoque le père et la paternité, l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 4720 numaralı hadis, baba ve babalık, yetim ve babanın kaybından bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4720, menyebutkan tentang ayah dan peran ayah, anak yatim, dan kehilangan seorang ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
