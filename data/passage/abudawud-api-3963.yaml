label: { ar: "سنن أبي داود 3963 — الأب والأبوة، النسب والانتساب", en: "Sunan Abi Dawud 3963 — the father and fatherhood; paternity and lineage", ur: "سنن ابی داؤد 3963 — باپ اور والدیت، نسب اور انتساب", es: "Sunan Abi Dawud 3963 — El padre y la paternidad; paternidad y linaje", fr: "Sunan Abi Dawud 3963 — le père et la paternité; la paternité et la lignée", tr: "Sunan Abi Dawud 3963 — Baba ve babalık, soy ve bağlılık", id: "Sunan Abi Dawud 3963 — Ayah dan peran ayah, garis keturunan dan afiliasi" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى، أَخْبَرَنَا جَرِيرٌ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" وَلَدُ الزِّنَا شَرُّ الثَّلاَثَةِ \". وَقَالَ أَبُو هُرَيْرَةَ لأَنْ أُمَتِّعَ بِسَوْطٍ فِي سَبِيلِ اللَّهِ عَزَّ وَجَلَّ أَحَبُّ إِلَىَّ مِنْ أَنْ أَعْتِقَ وَلَدَ زِنْيَةٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3963، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3963 (The Book of Manumission of Slaves), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3963، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3963 (El Libro de la Manumisión de los Esclavos), menciona al padre y la paternidad, la genealogía y el linaje. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3963 (Livre de l'affranchissement des esclaves), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sünen Ebu Davud'da yer alan 3963 numaralı hadis, babalık, soy ve atalık kavramlarından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3963, menyebutkan tentang ayah, garis keturunan, dan leluhur. Browser \"Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
