label: { ar: "صحيح البخاري 1454 — الفريضة والفرائض، ما فرضه الله ورسوله", en: "Sahih al-Bukhari 1454 — the obligation (farida); what God and His Messenger made obligatory", ur: "صحیح بخاری 1454 — فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا", fr: "Sahih al-Bukhari 1454 — l'obligation (farida) ; ce que Dieu et Son Messager ont rendu obligatoire", es: "Sahih al-Bujari 1454 — la obligación (farida); lo que Dios y Su Mensajero hicieron obligatorio" }
text: "… كَتَبَ لَهُ هَذَا الْكِتَابَ لَمَّا وَجَّهَهُ إِلَى الْبَحْرَيْنِ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ \" هَذِهِ فَرِيضَةُ الصَّدَقَةِ الَّتِي فَرَضَ رَسُولُ اللَّهِ عَلَى الْمُسْلِمِينَ، وَالَّتِي أَمَرَ اللَّهُ بِهَا رَسُولَهُ، فَمَنْ سُئِلَهَا مِنَ الْمُسْلِمِينَ عَلَى وَجْهِهَا فَلْيُعْطِهَا، وَمَنْ سُئِلَ فَوْقَهَا فَلاَ يُعْطِ فِي أَرْبَعٍ وَعِشْرِينَ مِنَ الإِبِلِ فَمَا دُونَهَا مِنَ الْغَنَمِ مِنْ كُلِّ خَمْسٍ شَاةٌ، إِذَا بَلَغَتْ خَمْسًا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1454، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 1454 (Obligatory Charity Tax (Zakat)), whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 1454، جس کے الفاظ میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 1454, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 1454, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
