label:
  ar: "البخاري 3019 — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Bukhari 3019 — A prophet stung by an ant: why not just the one ant"
  ur: "بخاری 3019 — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
text: "قرصت نملة نبيا من الأنبياء، فأمر بقرية النمل فأحرقت، فأوحى الله إليه أن قرصتك نملة أحرقت أمة من الأمم تسبح الله."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3019: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3019: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3019: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
