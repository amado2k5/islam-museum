label: { ar: "سنن النسائي 5146 — الحرام", en: "Sunan al-Nasa'i 5146 — the unlawful", ur: "سنن نسائی 5146 — حرام", es: "Sunan al-Nasa'i 5146 — el ilícito" }
text: "… رَجُلٍ، مِنْ هَمْدَانَ يُقَالُ لَهُ أَفْلَحُ عَنِ ابْنِ زُرَيْرٍ، أَنَّهُ سَمِعَ عَلِيًّا، يَقُولُ إِنَّ نَبِيَّ اللَّهِ أَخَذَ حَرِيرًا فَجَعَلَهُ فِي يَمِينِهِ وَأَخَذَ ذَهَبًا فَجَعَلَهُ فِي شِمَالِهِ ثُمَّ قَالَ \" إِنَّ هَذَيْنِ حَرَامٌ عَلَى ذُكُورِ أُمَّتِي \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ وَحَدِيثُ ابْنُ الْمُبَارَكِ أَوْلَى بِالصَّوَابِ إِلاَّ قَوْلَهُ أَفْلَحَ فَإِنَّ أَبَا أَفْلَحَ أَشْبَهُ وَاللَّهُ تَعَالَى أَعْلَمُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5146، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5146 (The Book of Adornment), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5146، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5146 (El Libro de los Adornos), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
