label: { ar: "سنن ابن ماجه 67 — ما لا يتم الإيمان إلا به", en: "Sunan Ibn Majah 67 — what faith is not complete without", ur: "سنن ابن ماجہ 67 — جس کے بغیر ایمان مکمل نہیں", es: "Sunan Ibn Majah 67 — lo que la fe no está completa sin", fr: "Sunan Ibn Majah 67 — quelle foi n'est pas complète sans", tr: "Sunan İbn Majah 67 — Bundan dolayı iman eksiktir.", id: "Sunan Ibn Majah 67 — Sesuatu yang tanpanya iman tidak sempurna" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، وَمُحَمَّدُ بْنُ الْمُثَنَّى، قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَلَدِهِ وَوَالِدِهِ وَالنَّاسِ أَجْمَعِينَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 67، يذكر ما لا يتم الإيمان إلا به. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 67 (The Book of the Sunnah), that mentions what faith is not complete without. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 67، جس میں جس کے بغیر ایمان مکمل نہیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 67 (El Libro de la Sunnah), menciona aquello sin lo cual la fe no está completa. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 67 (Le Livre de la Sunna), mentionne ce qui est indispensable à une foi complète. Le moteur de recherche « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "İbn Majah Süneni'nde yer alan 67 numaralı hadiste, imanın onsuz eksik kalacağından bahsedilir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde ele alan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 67, menyebutkan bahwa tanpanya iman menjadi tidak sempurna. Hadits ini disusun oleh seorang peneliti yang membahas rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
