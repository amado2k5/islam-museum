text: "… أُمِّ عبد ذكره أيضاً، يعد في القُرَاء مع ذلك أيضاً، وكان يؤمُ المهاجرين بقُباء فيهم عمر بن الخَطَّاب قبل أَن يَقْدَم - وبدأ به -، ومن أُبيّ بن كعب، ومن سالم مولى رسول اللّه وَا يه المدينة. أَبي حُذيفة، ومن …"
