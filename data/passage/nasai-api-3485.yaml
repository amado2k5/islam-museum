text: "… مُجَاهِدٍ، عَنْ يُوسُفَ بْنِ الزُّبَيْرِ، - مَوْلًى لَهُمْ - عَنْ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، قَالَ كَانَتْ لِزَمْعَةَ جَارِيَةٌ يَطَؤُهَا هُوَ وَكَانَ يَظُنُّ بِآخَرَ يَقَعُ عَلَيْهَا فَجَاءَتْ بِوَلَدٍ شِبْهِ الَّذِي كَانَ يَظُنُّ بِهِ فَمَاتَ زَمْعَةُ وَهِيَ حُبْلَى فَذَكَرَتْ ذَلِكَ سَوْدَةُ لِرَسُولِ اللَّهِ فَقَالَ رَسُولُ اللَّهِ \" الْوَلَدُ لِلْفِرَاشِ وَاحْتَجِبِي مِنْهُ يَا سَوْدَةُ فَلَيْسَ لَكِ بِأَخٍ \""
summary:
  ar: "حديث في سنن النسائي، رقم 3485، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3485 (The Book of Divorce), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3485، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3485 (El Libro del Divorcio), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
