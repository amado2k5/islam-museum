text: "… والأب، والزوج، فاذا أمروا وأوجبوا لم يجب شئ بايجابهم، بل بايجاب اللّه تعالى طاعتهم، ولولا ذلك للكان كل مخلوق أوجب على غيره شيئا كان للوجب عليه أن يقلب عليه الايجاب، إذ ليس أحدهما أولى من الآخر، فاذاً الواجب طاعة اللّٰه …"
summary:
  ar: "مقطع من المستصفى للغزالي، طبعة التجارية، ص 57، يرد فيه ذكر طاعة الله ورسوله، والواجب، والوجوب، وما يجب على المكلف، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, the Tijariyya printing, p. 57, whose wording mentions obedience to God and His Messenger, the obligatory (wajib), obligation (wujub), what is binding on the person addressed, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، طبع تجاریہ، ص 57 کا اقتباس جس میں اللہ اور اس کے رسول کی اطاعت، واجب، وجوب، جو مکلف پر واجب ہے، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 57, dont le texte mentionne l'obéissance à Dieu et à Son Messager, l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 57, cuyo texto menciona la obediencia a Dios y a Su Mensajero, lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin ticari baskısının 57. sayfasından, Allah'a ve Resulüne itaat, farz olanlar, zorunlu olanlar ve sorumlu bireyin üzerine düşen yükümlülükler hakkında bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Edisi Komersial, hlm. 57, membahas ketaatan kepada Allah dan Rasul-Nya, yang wajib, yang diharuskan, dan apa yang menjadi tanggung jawab individu yang bertanggung jawab. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
