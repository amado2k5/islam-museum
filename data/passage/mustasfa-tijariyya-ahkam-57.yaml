text: "… والأب، والزوج، فاذا أمروا وأوجبوا لم يجب شئ بايجابهم، بل بايجاب اللّه تعالى طاعتهم، ولولا ذلك للكان كل مخلوق أوجب على غيره شيئا كان للوجب عليه أن يقلب عليه الايجاب، إذ ليس أحدهما أولى من الآخر، فاذاً الواجب طاعة اللّٰه …"
