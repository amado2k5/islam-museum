text: "… في رِبابها والرِّباب مصدر، وفي الرُّبى حديث عمر: دَعِ الرَّبَّى والماخض والأَكولة. وقال أبو زيد : ومثل الرّبّى من الضأن الرّغوث، قال طَرَفة : من الوافر ديوان امرئ القيس -، وعيون الأخبار، والبخلاء، ومحاضرات الأدباء، والأول في اللسان والتاج سوق، …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 3، ص 263، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 3, p. 263, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 3، ص 263 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
