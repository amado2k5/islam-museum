  tr: "Hayvanlar Kitabı, Resimli Cilt 3, sayfa 263'ten, esprili bir anekdot veya fıkra içeren bir alıntı; makineyle okunabilir resimli baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Buku Hewan, Jilid Bergambar 3, halaman 263, berisi anekdot atau lelucon yang jenaka; dari edisi bergambar yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
