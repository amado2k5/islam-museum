text: "… إذا بيع لمن يُقاتل به مسلما، حرم أكل ثمنه، وإذا بيع لمن يغزو به في سبيل الله، فثمنه من الطيبات، وكذلك ثيابُ الحرير إذا بيعت لمن يلبسُها ممن يحرم عليه، حرم أكل ثمنها بخلاف بيعها ممن يحل له لبسها. هل …"
summary:
