text: "… إذا بيع لمن يُقاتل به مسلما، حرم أكل ثمنه، وإذا بيع لمن يغزو به في سبيل الله، فثمنه من الطيبات، وكذلك ثيابُ الحرير إذا بيعت لمن يلبسُها ممن يحرم عليه، حرم أكل ثمنها بخلاف بيعها ممن يحل له لبسها. هل …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 676، يذكر ما أُحل، وما حُرّم، والطيبات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 676, that mentions what was made lawful, what was made unlawful, the good things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 676 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا، پاکیزہ چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen 2, pág. 676, que menciona lo que se hizo lícito, lo que se hizo ilícito y las buenas obras; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Zad al-Ma'ad d'Ibn al-Qayyim (tome 2, p. 676), mentionnant ce qui a été rendu licite, ce qui a été rendu illicite et les bonnes choses; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 2. cildinin 676. sayfasından, helal, haram ve hayırlı olanı belirten bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
