label: { ar: "صحيح البخاري 3864 — الأب والأبوة", en: "Sahih al-Bukhari 3864 — the father and fatherhood", ur: "صحیح بخاری 3864 — باپ اور والدیت", es: "Sahih al-Bukhari 3864 — El padre y la paternidad", fr: "Sahih al-Bukhari 3864 — le père et la paternité" }
text: "… حَدَّثَنِي ابْنُ وَهْبٍ، قَالَ حَدَّثَنِي عُمَرُ بْنُ مُحَمَّدٍ، قَالَ فَأَخْبَرَنِي جَدِّي، زَيْدُ بْنُ عَبْدِ اللَّهِ بْنِ عُمَرَ عَنْ أَبِيهِ، قَالَ بَيْنَمَا هُوَ فِي الدَّارِ خَائِفًا، إِذْ جَاءَهُ الْعَاصِ بْنُ وَائِلٍ السَّهْمِيُّ أَبُو عَمْرٍو، عَلَيْهِ حُلَّةُ حِبَرَةٍ، وَقَمِيصٌ مَكْفُوفٌ بِحَرِيرٍ، وَهُوَ مِنْ بَنِي سَهْمٍ، وَهُمْ حُلَفَاؤُنَا فِي الْجَاهِلِيَّةِ فَقَالَ لَهُ مَا بَالُكَ قَالَ زَعَمَ قَوْمُكَ أَنَّهُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3864، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3864 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3864، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3864 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3864 (Mérites des Compagnons de Médine (Ansar)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
