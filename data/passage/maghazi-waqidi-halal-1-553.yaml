text: "… سمعتم، المومنون يَدٌ على مَن سِواهم، يُجير عليهم أَدناهم، وقد أَجرنا مَن أَجارت. فلمّا انصرف النبىّ إلى منزله دخلت عليه زَينب فسأَلته أَن يردَّ إلى أَبى العاص ما أُخِذْ منه من المال، ففعل وأَمرها أَلَّا يقربها، فإنها لا تحلّ له …"
