text: "… أو بما يُتوسَّل به إليه ؛ فذلك غيرُ مسلَّم، وإن سُلّم ؛ فذلك من باب ما لا يتمُّ الواجب إلا به، والخلاف فيه معلوم ؛ فلا نسلَّم أنه واجب، وإن سُلِّم؛ فكذلك الأحكام الأخر، فيصيرُ الحرامُ والمكروه والمندوب واجباتٍ، والواجبُ …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 197، يرد فيه ذكر الواجب، والمندوب، والمكروه، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
