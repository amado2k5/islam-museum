text: "… اسْتَحَبَّ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ صِيَامَ يَوْمِ الجُمُعَةِ، وإِنَّما يُكْرَهُ أَنْ يَصُومَ يَوْمَ الجُمُعَةِ لَا يَصُومُ قَبْلَهُ ولَا بَعْدَهُ. قَالَ: ورَوَى شُعْبَةُ عَنْ عَاصِمٍ هَذَا الحَديثَ ولَمْ يَرْفَعْهُ. المعجم - باب ما جاء في كراهية صوم يوم الجمعة وحده التحفة …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 188، يرد فيه ذكر المستحب، والكراهة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 188, whose wording mentions the recommended (mustahabb), dislike (karaha), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 188 کا اقتباس جس میں مستحب، کراہت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
