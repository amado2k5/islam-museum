text: "… اسْتَحَبَّ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ صِيَامَ يَوْمِ الجُمُعَةِ، وإِنَّما يُكْرَهُ أَنْ يَصُومَ يَوْمَ الجُمُعَةِ لَا يَصُومُ قَبْلَهُ ولَا بَعْدَهُ. قَالَ: ورَوَى شُعْبَةُ عَنْ عَاصِمٍ هَذَا الحَديثَ ولَمْ يَرْفَعْهُ. المعجم - باب ما جاء في كراهية صوم يوم الجمعة وحده التحفة …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 188، يرد فيه ذكر المستحب، والكراهة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 188, whose wording mentions the recommended (mustahabb), dislike (karaha), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 188 کا اقتباس جس میں مستحب، کراہت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Tirmidhi, volume numérisé 1, p. 188, dont le texte mentionne le recommandé (mustahabb), la réprobation (karaha), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-Tirmidhi, volumen digitalizado 1, p. 188, cuyo texto menciona lo recomendado (mustahabb), la reprobación (karaha), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cami' el-Tirmizi'nin 1. cildinin 188. sayfasından, müstehaplı, mekruhlu ve haram fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz fiiller, itaat fiilleri, müstehaplı fiiller, mekruhlu fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Jilid 1, halaman 188, yang menyebutkan amalan yang dianjurkan, yang tidak disukai, dan yang dilarang; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
