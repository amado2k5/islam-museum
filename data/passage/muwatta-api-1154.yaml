text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّهُ كُتِبَ إِلَى عُمَرَ بْنِ الْخَطَّابِ مِنَ الْعِرَاقَ أَنَّ رَجُلاً قَالَ لاِمْرَأَتِهِ حَبْلُكِ عَلَى غَارِبِكِ فَكَتَبَ عُمَرُ بْنُ الْخَطَّابِ إِلَى عَامِلِهِ أَنْ مُرْهُ يُوَافِينِي بِمَكَّةَ فِي الْمَوْسِمِ فَبَيْنَمَا عُمَرُ يَطُوفُ بِالْبَيْتِ إِذْ لَقِيَهُ الرَّجُلُ فَسَلَّمَ عَلَيْهِ فَقَالَ عُمَرُ مَنْ أَنْتَ فَقَالَ أَنَا الَّذِي أَمَرْتَ أَنْ أُجْلَبَ عَلَيْكَ ‏.‏ فَقَالَ لَهُ عُمَرُ أَسْأَلُكَ بِرَبِّ هَذِه …"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
  ur: "موطأ مالک میں؛ کسی فریق کو خط یا پیغام بھیجنا."
