text: "… عليه، ثم قال: إن اللّٰه تعالى أنزل كتاباً هادياً بين فيه الخير والشر، فخذوا بالخير ودعوا الشر، إن اللّٰه حرم حرماً مجهولة، وفضل حرمة المسلم على الحرم كلها، وشد بالإخلاص والتوحيد حقوق المسلمين، والمسلم من سلم المسلمون من لسانه ويده …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 4، ص 223، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 4, p. 223, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 4، ص 223 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 4, pág. 223, que menciona una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 4, page 223), contenant une description du musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 4. cildinin 223. sayfasından, Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 4, halaman 223, yang menjelaskan tentang seorang Muslim; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
