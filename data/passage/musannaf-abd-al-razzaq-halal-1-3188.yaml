text: "… : لقيت عمي ومَعَه راية، في المحلى : ومن طريق الحجاج بن المنهال، نا يزيد بن زريع، ناخالد الحذاء، عن أبي معشر عن النخعي عن عبيدة السلماني عن ابن مسعود قال: لا تحل له إلا من حيث حرمت عليه :. …"
