text: "النوع الى وي عشر معرفة على كم لغة نزل ثبت في الصحيحين : من حديث ابن عباس أن رسول الله وَلِفي قال أقرأنى جبريل على حرف فراجعته ثم لم أزل أستزيده فيزيدُنى، حتى انتهى إلى سبعة أحرف زاد مسلم قال …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 148، يذكر الأحرف السبعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 148, that mentions the seven ahruf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 148 کا اقتباس جس میں سبعہ احرف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen 2, pág. 148, que menciona los siete ahruf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
