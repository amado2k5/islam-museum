text: "… أموالَنا، وديارَنا كقسمةِ أيسارِ الجَزُورِ على الشَّطْرِ ونَكْفِيكُمُ الأمر الَّذي تكرهونَهُ وكُنّا أُناساً نُذهِبُ العُسْرَ باليُسْرِ وكان خَطاءً ما أتَيْنَا، وأنتُمُ صواباً كأنّا لا نريشُ، ولا نَبْري وقلتُم : حرامٌ نَصْبُ سعد، ونصبُكُمْ عَتِيقَ بنَ عثمانٍ حلال أَبا بكرٍ وأهلٌ …"
