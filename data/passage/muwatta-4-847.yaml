label: { ar: "الموطأ 847 — مالك عمن أسلم في آخر يوم من رمضان: ليس عليه قضاء ما مضى، وإنما يستأنف الصيام فيما يستقبل، وأحب إليه أن يقضي اليوم الذي أسلم فيه في بعضه", en: "Muwatta 847" }
summary:
  ar: "سئل مالك عمن أسلم في آخر يوم من رمضان: هل عليه قضاء رمضان كله، أو يجب عليه قضاء اليوم الذي أسلم فيه؟ فقال: ليس عليه قضاء ما مضى، وإنما يستأنف الصيام فيما يستقبل، وأحب إليه أن يقضي اليوم الذي أسلم فيه في بعضه. ويذكر المحقق أن هذه الفتوى رواها عن مالك أبو مصعب وسويد بألفاظ مختلفة (826). {cite:muwatta-maruf-1997 p.410}"
