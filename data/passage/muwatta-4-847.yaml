label: { ar: "الموطأ 847 — مالك عمن أسلم في آخر يوم من رمضان: ليس عليه قضاء ما مضى، وإنما يستأنف الصيام فيما يستقبل، وأحب إليه أن يقضي اليوم الذي أسلم فيه في بعضه", en: "Muwatta 847", es: "Muwatta 847", fr: "Muwatta 847", ur: "موطا 847", tr: "El-Muvatta 847 — Malik, Ramazan'ın son gününde İslam'ı kabul eden bir kimseden rivayet ettiğine göre: Geçmiş oruçları kaza etmesi gerekmez, aksine gelecekte yeniden oruç tutmaya başlamalıdır. İslam'ı kabul ettiği günün bir kısmını kaza etmesi daha faziletlidir.", id: "Al-Muwatta 847 — Malik berdasarkan riwayat seseorang yang memeluk Islam pada hari terakhir Ramadan: Ia tidak wajib mengganti puasa yang telah lewat, tetapi sebaiknya ia memulai puasa baru di kemudian hari. Lebih baik baginya untuk mengganti sebagian puasa pada hari ia memeluk Islam." }
summary:
  ar: "سئل مالك عمن أسلم في آخر يوم من رمضان: هل عليه قضاء رمضان كله، أو يجب عليه قضاء اليوم الذي أسلم فيه؟ فقال: ليس عليه قضاء ما مضى، وإنما يستأنف الصيام فيما يستقبل، وأحب إليه أن يقضي اليوم الذي أسلم فيه في بعضه. ويذكر المحقق أن هذه الفتوى رواها عن مالك أبو مصعب وسويد بألفاظ مختلفة (826). {cite:muwatta-maruf-1997 p.410}"
  tr: "Malik'e, Ramazan ayının son gününde İslam'a geçen biri hakkında şu soru soruldu: Ramazan ayının tamamını mı yoksa sadece İslam'a geçtiği günü mü kaza etmesi gerekir? Malik şöyle cevap verdi: Geçmişi kaza etmesi gerekmez, aksine gelecekte yeniden oruç tutmaya başlamalıdır. Ancak, İslam'a geçtiği günün bir kısmını kaza etmesi daha iyidir. Araştırmacı, bu fetvanın Malik'ten Ebu Mus'ab ve Suveyd tarafından farklı ifadelerle rivayet edildiğini belirtiyor (826). {cite:muwatta-maruf-1997 s.410}"
  id: "Malik ditanya tentang seseorang yang masuk Islam pada hari terakhir Ramadan: Apakah dia wajib mengganti puasa selama sebulan penuh Ramadan, atau hanya puasa pada hari ia masuk Islam? Beliau menjawab: Dia tidak wajib mengganti puasa yang telah berlalu, tetapi sebaiknya dia mulai berpuasa kembali di masa mendatang. Namun, lebih baik baginya untuk mengganti sebagian puasa pada hari ia masuk Islam. Peneliti menyebutkan bahwa fatwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid dengan redaksi yang berbeda (826). {cite:muwatta-maruf-1997 p.410}"
