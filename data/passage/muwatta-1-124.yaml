text: "إنا لما أصبنا الودك لانت العروق"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار، في باب إعادة الجنب الصلاة: صلى عمر بن الخطاب بالناس الصبح ثم غدا إلى أرضه بالجرف فوجد في ثوبه احتلاماً، فعلّل ذلك بأنهم لما أصابوا الودك، أي دسم اللحم والشحم، لانت العروق، فاغتسل وغسل الاحتلام من ثوبه وأعاد صلاته. ويفسر المحقق الودك بدسم اللحم والشحم، ويذكر أنه رواه عن مالك أبو مصعب وسويد، ويحيل على مصنف عبد الرزاق. {cite:muwatta-maruf-1997 p.94} {cite:muwatta-maruf-1997 p.95}"
