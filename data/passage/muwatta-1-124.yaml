label: { ar: "الموطأ 124 — عمر: إنا لما أصبنا الودك لانت العروق", en: "Muwatta 124", es: "Muwatta 124", fr: "Muwatta 124", ur: "موطا 124", tr: "Al-Muwatta 124 — Ömer: Yağı elde ettiğimizde damarlar yumuşadı.", id: "Al-Muwatta 124 — Umar: Ketika kami mendapatkan lemak, pembuluh darah menjadi lunak." }
text: "إنا لما أصبنا الودك لانت العروق"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار، في باب إعادة الجنب الصلاة: صلى عمر بن الخطاب بالناس الصبح ثم غدا إلى أرضه بالجرف فوجد في ثوبه احتلاماً، فعلّل ذلك بأنهم لما أصابوا الودك، أي دسم اللحم والشحم، لانت العروق، فاغتسل وغسل الاحتلام من ثوبه وأعاد صلاته. ويفسر المحقق الودك بدسم اللحم والشحم، ويذكر أنه رواه عن مالك أبو مصعب وسويد، ويحيل على مصنف عبد الرزاق. {cite:muwatta-maruf-1997 p.94} {cite:muwatta-maruf-1997 p.95}"
  tr: "Malik'in Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet ettiği, ritüel kirlilik halindeki bir kişinin namazı tekrar etmesiyle ilgili bölümde yer alan bir rivayette şöyle denmektedir: Ömer ibn el-Hattab, cemaate sabah namazını kıldırdıktan sonra, kendi yeri olan el-Juruf'a gitti ve elbisesinde ıslak bir rüya buldu. Bunu, iç yağı (yani et ve domuz yağı) tükettiklerinde damarların yumuşadığını söyleyerek açıkladı. Bunun üzerine gusül abdesti aldı, elbisesindeki ıslak rüyayı temizledi ve namazını tekrar kıldı. Araştırmacı, iç yağının et ve domuz yağı anlamına geldiğini açıklamakta ve Ebu Mus'ab ile Suveyd'in bunu Malik'ten rivayet ettiğini ve Abd el-Razzaq'ın Musannaf'ına atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.94} {cite:muwatta-maruf-1997 s.95}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id atas otoritas Sulayman ibn Yasar, dalam bab tentang seseorang yang dalam keadaan najis mengulangi salat: Umar ibn al-Khattab memimpin orang-orang dalam salat Subuh, kemudian pergi ke tanahnya di al-Juruf dan mendapati mimpi basah di pakaiannya. Ia menjelaskan hal ini dengan mengatakan bahwa ketika mereka mengonsumsi lemak (yaitu, lemak daging dan minyak), pembuluh darah menjadi lunak. Maka ia melakukan ghusl (mandi ritual), membersihkan mimpi basah dari pakaiannya, dan mengulangi salatnya. Peneliti menjelaskan bahwa lemak mengacu pada lemak daging dan minyak, dan menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan merujuk pada Musannaf Abd al-Razzaq. {cite:muwatta-maruf-1997 p.94} {cite:muwatta-maruf-1997 p.95}"
