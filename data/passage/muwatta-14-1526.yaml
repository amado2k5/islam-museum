label: { ar: "الموطأ 1526 — مالك: الزنا لا يحرم شيئا من ذلك، لأن الله حرم ما كان تزويجا، ولم يذكر تحريم الزنا، فكل تزويج على وجه الحلال يصيب صاحبه امرأته فهو بمنزلة التزويج الحلال", en: "Muwatta 1526", es: "Muwatta 1526", fr: "Muwatta 1526", ur: "موطا 1526", tr: "El-Muvatta 1526 — Malik: Zina bunların hiçbirini yasaklamaz, çünkü Allah evliliği yasaklamış, zinayı yasaklamamıştır. Dolayısıyla, helal olan ve bir erkeğin karısıyla ilişki kurduğu her evlilik, helal bir evlilik gibidir.", id: "Al-Muwatta 1526 — Malik: Perzinahan tidak mengharamkan hal-hal tersebut, karena Allah mengharamkan apa yang telah menjadi perkawinan, dan tidak menyebutkan larangan perzinahan. Maka setiap perkawinan yang sah dan di mana seorang laki-laki berhubungan badan dengan istrinya adalah seperti perkawinan yang sah." }
summary:
  ar: "يقول مالك فأما الزنا فإنه لا يحرم شيئا من ذلك، لأن الله تعالى قال في كتابه وأمهات نسائكم، فإنما حرم ما كان تزويجا، ولم يذكر تحريم الزنا. فكل تزويج كان على وجه الحلال يصيب صاحبه امرأته، فهو بمنزلة التزويج الحلال. فهذا الذي سمعت، والذي عليه أمر الناس عندنا. {cite:muwatta-maruf-1997 p.40}"
  tr: "Malik şöyle diyor: Zina konusuna gelince, bunun hiçbirini yasaklamaz, çünkü Yüce Allah Kitabında, “Ve eşlerinizin anneleri” diye buyurmuştur; yani sadece evliliği yasaklamış, zinayı yasaklamamıştır. Dolayısıyla, bir erkeğin karısıyla ilişki kurduğu her meşru evlilik, meşru bir evlilik gibidir. Bunu duydum ve aramızdaki insanların uygulaması da budur. {cite:muwatta-maruf-1997 s.40}"
  id: "Malik berkata: Adapun perzinahan, tidak ada larangan terhadap hal itu, karena Allah Yang Maha Kuasa berfirman dalam Kitab-Nya, “Dan ibu-ibu istrimu,” artinya Dia hanya melarang perkawinan, dan Dia tidak menyebutkan larangan perzinahan. Jadi, setiap perkawinan yang sah, di mana seorang pria berhubungan badan dengan istrinya, sama seperti perkawinan yang sah. Inilah yang saya dengar, dan inilah praktik masyarakat di antara kita. {cite:muwatta-maruf-1997 p.40}"
