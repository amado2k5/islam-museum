text: |-
  ٢٥٤
  آبو عبيدة الهطل البعير المعي وناقة هعالى تمشى رويدا وقال
  بابيل هطلى من مراح ومهمل* والهطال اسم جبل وقال
  على هطالهم منهم بيوت * كأن العضكبوت هوا بتناها
  والهيطل الجماعة يغزى بهسم ايسوا بالكثير ويقال الهياطلة جيل من الناس كانت لهم
  شوكة وكانت لهم بلاد طخيرستان وأتر اكخلح وختجينة من بقاياهم والهيطل يقال هو الشعلب
  قل الهقل الفتص النعام⁦( هكل)⁩ الهيكل الفرس الطويل الضخم قال العجاج
  وهو طرف هيكل• والهيكل البناء المشرف والهيكل بيت للنصارى وهوبيت الاصسنام
  ( هلل الهلال أول ايلة والثانية والثالثة ثم هوقر والهلال مايضم بي الحنوين من حديد
  أوخشب والجمع الاهلة وهلال حى من هوازن والهلال الماء القليل فى أسفل الركى"
  والهلال السنان الذى له شعبتان يصادبه الوحش والهلال مارف الرحى اذا انكسر منه
  وقول ذى الرمّة اليك ابتذلنا كل وهم كانه * هلال بدافى رمضة يتقلب
  قالوايعنى حية وتهلل السحاب ببرقه تلالاوتهلل وجه الرجل من فرحه واستهل وتهلات
  دموعه أى سالت وانهات السماءصبت وانجلّ المطرانهلالاسال بشدة وهال الرجل أى قال
  لا اله الا اللّٰه يقال قدأ كثرت من الهيللة أم ن قول لااله الااللّٰه والتهليل النكوص
  يقال حجل فاهلل أى فاجين قال كعب بن زهير» فالهم عن حياض الموت تهليل * والهلل
  الفرق يقال هلك فلان هللا أى فرقا أبوزيد الهال أوّل المطريقال استهلت السماء وذلك
  فى أول مطرها ويقال هو صوت وقعه واستهلّ الصىّ أى صاح عندالولادة وأهلّ
  المعتمراذارفع صوته بالتلبية وأهل بالتسمية على الذبيحة وقوله تعالى وما أهلّبه لغيرالله أى
  نودى عليه بغيراسم اللّٰه وأه لدرفع الصوت قال ابن أحر
  يهلّ بالفر قد ركيانها * كمايهلّ الراكب المعتمر
  وأهلّ الهلال واستهلّ على ما لم يسم"فاعله ويقال أيضا استهلّ هو ععف تبين ولاية ال أهل
  ويقال أهللنا عن ليلة كذا ولا يقال أهلناه فهسل كما يقال أدخلناه فدخل وهو قياسه
  واله لهل سم" وه ومعزب ويقال ثوب هاهل سخيف النسج وقدهلهل النساج الثوب اذا
  أرق تسجه وخففه قال النابغة
  أتاك بقول هلهل النسج كاذبا * ولم يأت بالحق الذى هو ساطع
  ويروى اهله وشعر هاهل أى رقيق ويقال سمى امرو القيس بن ربيعة أخو كليب وائل
  مهلهلالانه أوّل من أرق الشعر وبقال بل سمى بقوله
  لما توغل فى الكراع هجينهم * هلهلمت أثأر مالكا أوضبلا
  ويقال هلهلت أدركه كما يقال كدت أدركه والهلاهل الماء الكثير الصافى ويقال قد ذهب
  بذى هليان بكسرالهاء اذا ذهب بحيث لايدرى وهلازبر للخيل وهال.ثل أى اقربى وهل
  حرف استفهام فاذاجعلته اسماشقدته قال الخليل قلت لابى الدقيش هل لك فى ثريدة
  مات ودكها عيون الضياون فقال أشد الهل ابن السكيت واذا قيل هل لك فى كذا وكذاقات لى
  ميه أوات لى فيه أومالى فيه ولا تقل ان لى فيه هلا والتأويل هل للد فيه حاحة فحذفت الحاجا
