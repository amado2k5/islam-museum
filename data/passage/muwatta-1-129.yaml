label: { ar: "الموطأ 129 — ابن عمر: لا بأس بالغسل بفضل المرأة ما لم تكن حائضاً أو جنباً", en: "Muwatta 129", es: "Muwatta 129", fr: "Muwatta 129", ur: "موطا 129", tr: "El-Muvatta 129 — İbn Ömer: Kadının abdestinden kalan suyla yıkanmasında bir sakınca yoktur, ancak adet dönemindeyse veya ritüel kirlilik halindeyse durum farklıdır.", id: "Al-Muwatta 129 — Ibn Umar: Tidak ada salahnya mandi dengan air sisa wudhu wanita, kecuali jika dia sedang haid atau dalam keadaan najis." }
summary:
  ar: "أول أثر في باب جامع غسل الجنابة. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان يقول: لا بأس أن يُغتسل بفضل ماء المرأة ما لم تكن حائضاً أو جنباً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن، ويحيل على مصنف عبد الرزاق وابن أبي شيبة. {cite:muwatta-maruf-1997 p.97}"
  tr: "Cinsel kirlilikten sonra yapılan kapsamlı gusül abdesti hakkındaki bölümdeki ilk hadis. Yahya'nın Malik'ten, o da Nafi'den rivayet ettiğine göre Abdullah ibn Umar şöyle derdi: Kadının adet görmediği veya gusül abdesti almadığı sürece, kadının artan suyuyla gusül abdesti almakta bir sakınca yoktur. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suwaid, Abdülrazzak ve Muhammed ibn Hasan tarafından rivayet edildiğini ve Abdülrazzak ile İbn Abi Şeybe'nin Musannaf'ına atıfta bulunduğunu belirtiyor. {cite:muwatta-maruf-1997 s.97}"
  id: "Hadits pertama dalam bab tentang mandi ritual lengkap setelah najis. Diriwayatkan oleh Yahya dari Malik dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: Tidak ada salahnya melakukan ghusl (mandi ritual) menggunakan air sisa dari seorang wanita, selama dia tidak sedang haid atau dalam keadaan najis. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, dan Muhammad ibn al-Hasan, dan beliau merujuk pada Musannaf Abd al-Razzaq dan Ibn Abi Shaybah. {cite:muwatta-maruf-1997 p.97}"
