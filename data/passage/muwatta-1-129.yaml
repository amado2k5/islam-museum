summary:
  ar: "أول أثر في باب جامع غسل الجنابة. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان يقول: لا بأس أن يُغتسل بفضل ماء المرأة ما لم تكن حائضاً أو جنباً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن، ويحيل على مصنف عبد الرزاق وابن أبي شيبة. {cite:muwatta-maruf-1997 p.97}"
