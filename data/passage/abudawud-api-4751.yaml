label: { ar: "سنن أبي داود 4751 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 4751 — a burial, grave or resting place", ur: "سنن ابی داؤد 4751 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 4751 — un lugar de entierro, tumba o descanso.", fr: "Sunan Abi Dawud 4751 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… وَمِنْ فِتْنَةِ الدَّجَّالِ \". قَالُوا : وَمِمَّ ذَاكَ يَا رَسُولَ اللَّهِ قَالَ : \" إِنَّ الْمُؤْمِنَ إِذَا وُضِعَ فِي قَبْرِهِ أَتَاهُ مَلَكٌ فَيَقُولُ لَهُ : مَا كُنْتَ تَعْبُدُ فَإِنِ اللَّهُ هَدَاهُ قَالَ : كُنْتُ أَعْبُدُ اللَّهَ. فَيُقَالُ لَهُ : مَا كُنْتَ تَقُولُ فِي هَذَا الرَّجُلِ فَيَقُولُ : هُوَ عَبْدُ اللَّهِ وَرَسُولُهُ فَمَا يُسْأَلُ عَنْ شَىْءٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4751، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4751 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4751، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4751 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, patrimonios, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4751 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
