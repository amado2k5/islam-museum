text: "- كتاب: الإيمان باب، حديث - بارزاً للناس، إذْ أَتَاهُ رَجُلٌ يَمْشِي، فقالَ: يا مُحَمَّدُ، ما الإِيمانُ؟ قالَ: أن تُؤْمِنَ باللَّهِ، وَمَلائِكَتِهِ، وَرُسُلِهِ، وَلِقَائِهِ، وَتُؤْمِنَ بالبَعْثِ الآخِر. قال: يا رسُولَ اللَّهِ، فما الإِسْلامُ؟ قَال: لا تُشْرِكُ باللَّهِ شَيْئاً، وَتُقِيمُ الصَّلاة …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 158، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 158, that mentions Islam defined by its acts, the question about faith and its answer, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 158 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 158, que menciona el Islam definido por sus actos, la cuestión de la fe y su respuesta, la creencia en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
