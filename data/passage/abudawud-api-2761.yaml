label: { ar: "سنن أبي داود 2761 — الأب والأبوة", en: "Sunan Abi Dawud 2761 — the father and fatherhood", ur: "سنن ابی داؤد 2761 — باپ اور والدیت", es: "Sunan Abi Dawud 2761 — El padre y la paternidad" }
text: "… وَقَدْ حَدَّثَنِي مُحَمَّدُ بْنُ إِسْحَاقَ عَنْ شَيْخٍ مِنْ أَشْجَعَ يُقَالُ لَهُ سَعْدُ بْنُ طَارِقٍ عَنْ سَلَمَةَ بْنِ نُعَيْمِ بْنِ مَسْعُودٍ الأَشْجَعِيِّ عَنْ أَبِيهِ نُعَيْمٍ قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ لَهُمَا حِينَ قَرَآ كِتَابَ مُسَيْلِمَةَ \" مَا تَقُولاَنِ أَنْتُمَا \" قَالاَ نَقُولُ كَمَا قَالَ. قَالَ \" أَمَا وَاللَّهِ لَوْلاَ أَنَّ الرُّسُلَ لاَ تُقْتَلُ لَضَرَبْتُ أَعْنَاقَكُمَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2761، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2761 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2761، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2761 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
