label: { ar: "سنن النسائي 971 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 971 — the father raising and counselling", ur: "سنن نسائی 971 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 971 — El padre que cría y aconseja" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ إِبْرَاهِيمَ بْنِ صُدْرَانَ، قَالَ حَدَّثَنَا سَلْمُ بْنُ قُتَيْبَةَ، قَالَ حَدَّثَنَا هَاشِمُ بْنُ الْبَرِيدِ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْبَرَاءِ، قَالَ كُنَّا نُصَلِّي خَلْفَ النَّبِيِّ الظُّهْرَ فَنَسْمَعُ مِنْهُ الآيَةَ بَعْدَ الآيَاتِ مِنْ سُورَةِ لُقْمَانَ وَالذَّارِيَاتِ."
summary:
  ar: "حديث في سنن النسائي، رقم 971، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 971 (The Book of the Commencement of the Prayer), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 971، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 971 (El Libro del Inicio de la Oración), menciona la crianza y el consejo paternos. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
