text: "… ولا عقلَ كالتّدبير، ولا وَرَعَ كالكفَّ، ولا حَسَبَ كسن الحلق. فأهلك إبليس، وأما الحرصُ فأخرج آدم من الجنة. الحيةَ، والمُخاطِرُ على شُرب السمِّ. وأَخْمِصةُ، فقال مالك : هذه وَضعت القيودَ فى رجلك. كان أشعب يقول : أنا أطمع وأُمَّى تَيْقَنُ …"
