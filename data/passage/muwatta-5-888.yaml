label: { ar: "الموطأ 888 — مالك: ويحرم على المعتكف من أهله بالليل ما يحرم عليه منهن بالنهار", en: "Muwatta 888", es: "Muwatta 888", fr: "Muwatta 888", ur: "موطا 888", tr: "El-Muvatta 888 — Malik: Bir kimsenin geceleyin ailesinden ayrı kaldığı zaman haram olan şey, gündüzleyin ailesinden ayrı kaldığı zaman haram olan şeyle aynıdır.", id: "Al-Muwatta 888 — Malik: Apa yang diharamkan bagi seseorang yang menyendiri dari keluarganya di malam hari sama dengan apa yang diharamkan baginya dari mereka di siang hari." }
summary:
  ar: "قول لمالك: ويحرم على المعتكف من أهله بالليل ما يحرم عليه منهن بالنهار. ويذكر المحقق أنه رواه عن مالك أبو مصعب (885). {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik şöyle demiştir: Bir kimsenin geceleyin ailesinden ayrı kaldığı zaman yapması yasak olan şey, gündüz ailesinden ayrı kaldığı zaman yapması yasak olan şeyle aynıdır. Araştırmacı, bunu Ebu Mus'ab'ın (885) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.426}"
  id: "Malik berkata: Apa yang diharamkan bagi seseorang yang menyendiri dari keluarganya di malam hari sama dengan apa yang diharamkan baginya dari mereka di siang hari. Peneliti menyebutkan bahwa Abu Mus'ab (885) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.426}"
