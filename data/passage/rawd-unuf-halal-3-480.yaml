text: "… الهلاغة، ومَساقُ الفَصَاحَةِ فاقَهَمه. وأما قول عُرْوَةَ : جمعت أو شابَ الناس، يربد : أخْلَاطًا، وكذلك الأوْبَاشُ. وقوله فى حديث المُغِيرَة : أما المالُ فلستَ منه فى شءٍ فيه مِن الفقه أنَّ أَمْوَالَ الْمُشْركين حرامٌ إذا أَمِنُوك وأمِنْتَهم، وإنما يَحِلَّ …"
