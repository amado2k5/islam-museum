label: { ar: "الموطأ 2588 — مالك: العبيد لا قسامة فيهم في العمد ولا الخطأ، والسيد يحلف مع شاهد", en: "Muwatta 2588", es: "Muwatta 2588", fr: "Muwatta 2588", ur: "موطا 2588", tr: "El-Muvatta 2588 — Malik: Kölelerin, kasıtlı veya kasıtsız öldürme durumlarında yemin etmeleri gerekmez; efendi ise bir şahitle birlikte yemin eder.", id: "Al-Muwatta 2588 — Malik: Budak tidak diwajibkan bersumpah dalam kasus pembunuhan yang disengaja atau tidak disengaja, dan tuannya bersumpah bersama dengan seorang saksi." }
summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا في العبيد أنه إذا أُصيب العبد عمدا أو خطأ، ثم جاء سيده بشاهد، حلف مع شاهده يمينا واحدة، ثم كان له قيمة عبده. وليس في العبيد قسامة في عمد ولا خطأ، ولم أسمع أحدا من أهل العلم قال ذلك. {cite:muwatta-maruf-1997 p.459}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Kölelerle ilgili uygulamamız şudur: Bir köleye kasten veya kasıtsız zarar verilirse ve efendisi bir şahit getirirse, efendisi şahidiyle birlikte tek bir yemin eder ve ardından kölesinin bedelini almaya hak kazanır. Kasıtlı veya kasıtsız zarar durumlarında köleler için yemin etme prosedürü yoktur ve ben hiçbir âlimin aksini söylediğini duymadım. {cite:muwatta-maruf-1997 s.459}"
  id: "Yahya berkata: Malik berkata: Praktik kami mengenai budak adalah jika seorang budak dirugikan secara sengaja atau tidak sengaja, dan kemudian tuannya membawa saksi, ia bersumpah bersama saksinya, dan kemudian ia berhak atas nilai budaknya. Tidak ada prosedur pengambilan sumpah untuk budak dalam kasus kerugian yang disengaja atau tidak disengaja, dan saya belum pernah mendengar ada ulama yang mengatakan sebaliknya. {cite:muwatta-maruf-1997 p.459}"
