label: { ar: "الموطأ 2588 — مالك: العبيد لا قسامة فيهم في العمد ولا الخطأ، والسيد يحلف مع شاهد", en: "Muwatta 2588" }
summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا في العبيد أنه إذا أُصيب العبد عمدا أو خطأ، ثم جاء سيده بشاهد، حلف مع شاهده يمينا واحدة، ثم كان له قيمة عبده. وليس في العبيد قسامة في عمد ولا خطأ، ولم أسمع أحدا من أهل العلم قال ذلك. {cite:muwatta-maruf-1997 p.459}"
