text: "… بها، وخمس منها امرتنا رسلك ان نعمل بها، وخمس منها تخلقنا بها فى الجاهلية : فنحن عليها. الا ان تكره منها شيئا - فذكر الحديث فى الإيمان باللّه و ملائكته وكتبه ورسله والقدر خيره وشره وأركان الإسلام والأخلاق الطيبة. اى …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 29، يذكر أركان الإسلام، والإيمان بالقدر، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 29, that mentions the pillars of Islam, belief in the decree, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 29 کا اقتباس جس میں ارکانِ اسلام، تقدیر پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
