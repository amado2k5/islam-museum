label: { ar: "سنن ابن ماجه 2995 — عمل يعدل عملا أعظم منه", en: "Sunan Ibn Majah 2995 — a deed that equals a greater one", ur: "سنن ابن ماجہ 2995 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan Ibn Majah 2995 — una acción que equivale a una mayor", fr: "Sunan Ibn Majah 2995 — une action qui en vaut une plus grande", tr: "Sunan İbn Majah 2995 — Daha büyük bir amele denk bir amel", id: "Sunan Ibn Majah 2995 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الْمَلِكِ بْنِ وَاقِدٍ، حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عَمْرٍو، عَنْ عَبْدِ الْكَرِيمِ، عَنْ عَطَاءٍ، عَنْ جَابِرٍ، أَنَّ النَّبِيَّ ـ قَالَ \" عُمْرَةٌ فِي رَمَضَانَ تَعْدِلُ حِجَّةً \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2995، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2995 (Chapters on Hajj Rituals), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2995، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2995 (Capítulos sobre los rituales del Hajj), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 2995 (Chapitres sur les rites du Hajj), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, écrivent, effacent ou évaluent un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 2995 numaralı hadiste, daha büyük bir ameli sayan bir amelden bahsedilir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2995, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
