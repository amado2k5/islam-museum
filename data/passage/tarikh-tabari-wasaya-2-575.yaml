text: "… تا ابن وهب كال اخبرنى أبن لُهَيْعة عن الى صخر عن يَزيد، الرَّقَاشى عن أُنس بن مالك يقول سمعتُ رسول الله صلعم يقول ان داود النبىّ عم حين نظر الى امرأة فأهم قطع على بنى أسرائيل بعتًا فاوصى صاحبَ البعث …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 575، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 2, p. 575, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 2، ص 575 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
