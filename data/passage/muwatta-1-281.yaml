label: { ar: "الموطأ 281 — مالك فيمن أصابه زحام يوم الجمعة فلم يقدر على السجود", en: "Muwatta 281", es: "Muwatta 281", fr: "Muwatta 281", ur: "موطا 281", tr: "Al-Muwatta 281 — Malik, Cuma günü kalabalığa karışıp secde edemeyen kişi hakkında", id: "Al-Muwatta 281 — Malik tentang orang yang terjebak dalam kerumunan pada hari Jumat dan tidak mampu bersujud" }
summary:
  ar: "قول لمالك في باب ما جاء فيمن أدرك ركعة يوم الجمعة: من أصابه زحام يوم الجمعة فركع ولم يقدر على أن يسجد حتى قام الإمام أو فرغ من صلاته، فإن قدر على السجود بعد أن ركع فليسجد إذا قام الناس، وإن لم يقدر حتى فرغ الإمام فأحب إليه أن يبتدئ صلاته ظهراً أربعاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162}"
  tr: "Malik, Cuma günü namazda kalabalığa karışan kimse hakkında rivayet edilenler bölümünde şöyle demiştir: \"Cuma günü kalabalığa karışan ve rükû eden, ancak imam ayağa kalkana veya namazını bitirene kadar secde edemeyen kimse, rükûdan sonra secde edebiliyorsa, insanlar ayağa kalkınca secde etmelidir. İmam namazını bitirene kadar secde edemiyorsa, namazına dört rekatlık öğle namazı olarak başlaması daha iyidir.\" Araştırmacı, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.162}"
  id: "Malik berkata dalam surah tentang apa yang diriwayatkan mengenai orang yang menumpang satu rakaat pada hari Jumat: Jika seseorang tertumpangi kerumunan orang pada hari Jumat dan rukuk tetapi tidak mampu sujud sampai imam berdiri atau menyelesaikan salatnya, maka jika ia mampu sujud setelah rukuk, hendaknya ia melakukannya ketika orang-orang berdiri. Jika ia tidak mampu sujud sampai imam selesai, maka lebih baik baginya untuk memulai salatnya sebagai salat Zuhur empat rakaat. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.162}"
