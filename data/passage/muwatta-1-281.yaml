label: { ar: "الموطأ 281 — مالك فيمن أصابه زحام يوم الجمعة فلم يقدر على السجود", en: "Muwatta 281" }
summary:
  ar: "قول لمالك في باب ما جاء فيمن أدرك ركعة يوم الجمعة: من أصابه زحام يوم الجمعة فركع ولم يقدر على أن يسجد حتى قام الإمام أو فرغ من صلاته، فإن قدر على السجود بعد أن ركع فليسجد إذا قام الناس، وإن لم يقدر حتى فرغ الإمام فأحب إليه أن يبتدئ صلاته ظهراً أربعاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162}"
