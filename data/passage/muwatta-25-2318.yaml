label: { ar: "الموطأ 2318 — مالك: من يرث المكاتب إذا اشترى الغير كتابته", en: "Muwatta 2318", es: "Muwatta 2318", fr: "Muwatta 2318", ur: "موطا 2318", tr: "El-Muvatta 2318 — Malik: Bir başkası azat sözleşmesini satın alırsa, azat edilmiş bir köleden kim miras alır?", id: "Al-Muwatta 2318 — Malik: Siapa yang berhak mewarisi dari seorang budak yang memiliki kontrak pembebasan jika orang lain membeli kontraknya?" }
summary:
  ar: "قال مالك: الأمر عندنا فيمن يبتاع كتابة المكاتب ثم يهلك المكاتب قبل أن يؤدي: أنه يرثه من اشترى كتابته، وإن عجز فله رقبته. وإن أدى المكاتب كتابته إلى من اشتراها وعتق، فولاؤه للذي عقد كتابته، وليس لمن اشترى الكتابة من ولائه شيء. {cite:muwatta-maruf-1997 p.356}"
  tr: "Malik şöyle dedi: Kölenin özgürlük sözleşmesini satın alan ve köle yükümlülüklerini yerine getirmeden önce ölen kişiyle ilgili hükmümüz şudur: Özgürlük sözleşmesini satın alan kişi köleye mirasçı olur. Eğer satın alan kişi yükümlülüklerini yerine getiremezse, kölenin özgürlüğüne hak kazanır. Eğer köle, kendisini satın alan kişiye karşı yükümlülüklerini yerine getirir ve özgür bırakılırsa, bağlılığı özgürlük sözleşmesini imzalayan kişiye aittir ve özgürlük sözleşmesini satın alan kişinin bağlılığı üzerinde hiçbir hakkı yoktur. {cite:muwatta-maruf-1997 s.356}"
  id: "Malik berkata: Putusan kami mengenai seseorang yang membeli kontrak pembebasan budak dan kemudian budak tersebut meninggal sebelum memenuhi kewajibannya adalah bahwa orang yang membeli kontrak pembebasan tersebut berhak mewarisinya. Jika pembeli tidak mampu memenuhi kewajibannya, maka pembeli berhak atas kebebasan budak tersebut. Jika budak tersebut memenuhi kewajibannya kepada orang yang membelinya dan kemudian dibebaskan, kesetiaannya menjadi milik orang yang membuat kontrak pembebasan tersebut, dan orang yang membeli kontrak pembebasan tersebut tidak berhak atas kesetiaannya. {cite:muwatta-maruf-1997 p.356}"
