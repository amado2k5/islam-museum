label: { ar: "الموطأ 2318 — مالك: من يرث المكاتب إذا اشترى الغير كتابته", en: "Muwatta 2318" }
summary:
  ar: "قال مالك: الأمر عندنا فيمن يبتاع كتابة المكاتب ثم يهلك المكاتب قبل أن يؤدي: أنه يرثه من اشترى كتابته، وإن عجز فله رقبته. وإن أدى المكاتب كتابته إلى من اشتراها وعتق، فولاؤه للذي عقد كتابته، وليس لمن اشترى الكتابة من ولائه شيء. {cite:muwatta-maruf-1997 p.356}"
