label: { ar: "الموطأ 2121 — مالك: مما يفترق فيه القضاء: أن المرأتين تشهدان على استهلال الصبي، فيجب بذلك ميراثه، وليس مع المرأتين رجل ولا يمين، ولو شهدتا على درهم واحد لم تجز شهادتهما إلا أن يكون معهما شاهد أو يمين", en: "Muwatta 2121" }
summary:
  ar: "قال مالك: ومما يشبه ذلك أيضا مما يفترق فيه القضاء، وما مضى من السنة: أن المرأتين تشهدان على استهلال الصبي، فيجب بذلك ميراثه، حتى يرث، ويكون ماله لمن يرثه إن مات الصبي، وليس مع المرأتين اللتين شهدتا رجل ولا يمين. وقد يكون ذلك في الأموال العظام، من الذهب والورق والرباع والحوائط والرقيق، وما سوى ذلك من الأموال. ولو شهدت امرأتان على درهم واحد، أو أقل من ذلك أو أكثر، لم تقطع شهادتهما شيئا، ولم تجز إلا أن يكون معهما شاهد أو يمين. {cite:muwatta-maruf-1997 p.266} {cite:muwatta-maruf-1997 p.267}"
