label: { ar: "الموطأ 2121 — مالك: مما يفترق فيه القضاء: أن المرأتين تشهدان على استهلال الصبي، فيجب بذلك ميراثه، وليس مع المرأتين رجل ولا يمين، ولو شهدتا على درهم واحد لم تجز شهادتهما إلا أن يكون معهما شاهد أو يمين", en: "Muwatta 2121", es: "Muwatta 2121", fr: "Muwatta 2121", ur: "موطا 2121", tr: "El-Muvatta 2121 — Malik: Hukuki hükümlerin farklılık gösterdiği konulardan biri de, iki kadının bir erkek çocuğunun doğumuna şahitlik ederek, yanlarında bir erkek veya yemin olmasa bile, çocuğun mirasçılığını tesis etmesidir. Eğer tek bir dirhem için şahitlik ederlerse, yanlarında bir şahit veya yemin olmadıkça şahitlikleri geçerli değildir.", id: "Al-Muwatta 2121 — Malik: Di antara perkara-perkara yang hukumnya berbeda adalah kesaksian dua wanita tentang kelahiran seorang anak laki-laki, sehingga menetapkan hak warisnya, meskipun tidak ada laki-laki atau sumpah bersama mereka. Jika mereka bersaksi tentang satu dirham saja, kesaksian mereka tidak sah kecuali ada saksi atau sumpah bersama mereka." }
summary:
  ar: "قال مالك: ومما يشبه ذلك أيضا مما يفترق فيه القضاء، وما مضى من السنة: أن المرأتين تشهدان على استهلال الصبي، فيجب بذلك ميراثه، حتى يرث، ويكون ماله لمن يرثه إن مات الصبي، وليس مع المرأتين اللتين شهدتا رجل ولا يمين. وقد يكون ذلك في الأموال العظام، من الذهب والورق والرباع والحوائط والرقيق، وما سوى ذلك من الأموال. ولو شهدت امرأتان على درهم واحد، أو أقل من ذلك أو أكثر، لم تقطع شهادتهما شيئا، ولم تجز إلا أن يكون معهما شاهد أو يمين. {cite:muwatta-maruf-1997 p.266} {cite:muwatta-maruf-1997 p.267}"
  tr: "Malik şöyle dedi: Hukuki hükümler ile yerleşik uygulama arasındaki farka bir başka örnek de, iki kadının bir erkek çocuğun doğumdaki ilk ağlamasına şahitlik etmesidir. Bu, çocuğun miras hakkını belirler ve miras almaya hak kazanmasını sağlar. Ölmesi halinde mal varlığı mirasçılarına geçer ve iki kadının şahitliğine erkek bir tanık veya yemin eşlik etmez. Bu, altın, gümüş, gayrimenkul, silah, köle ve diğer zenginlik biçimleri gibi önemli varlıklar için geçerlidir. Ancak, iki kadın tek bir dirhem veya daha az ya da daha fazla bir miktara şahitlik ederse, şahitlikleri kesin değildir ve ancak başka bir tanık veya yemin eşliğinde geçerlidir."
  id: "Malik berkata: Contoh lain dari perbedaan antara putusan hukum dan praktik yang sudah mapan adalah ketika dua wanita bersaksi tentang tangisan pertama seorang anak laki-laki saat lahir. Hal ini menetapkan hak warisnya, memastikan ia berhak mewarisi. Hartanya akan diberikan kepada ahli warisnya jika ia meninggal, dan kesaksian kedua wanita tersebut tidak disertai dengan saksi laki-laki atau sumpah. Ini berlaku untuk aset yang substansial seperti emas, perak, real estat, persenjataan, budak, dan bentuk kekayaan lainnya. Namun, jika dua wanita bersaksi tentang satu dirham, atau kurang atau lebih dari itu, kesaksian mereka tidak meyakinkan dan hanya sah jika disertai dengan saksi lain atau sumpah."
