label: { ar: "الموطأ 978 — سعد بن أبي وقاص والضحاك بن قيس عام حج معاوية: يذكران التمتع بالعمرة إلى الحج؛ فقال الضحاك: لا يصنع ذلك إلا من جهل أمر الله؛ فقال سعد: بئس ما قلت، وقد صنعها رسول الله وصنعناها معه", en: "Muwatta 978", es: "Muwatta 978", fr: "Muwatta 978", ur: "موطا 978", tr: "El-Muvatta 978 — Sa'd ibn Abi Vakkas ve Ad-Dahhak ibn Kays, Mu'aviye'nin Hac yaptığı yıl: Umre ile Hac'ı birleştirmeyi tartışıyorlardı; Ad-Dahhak şöyle dedi: \"Bunu ancak Allah'ın emrinden habersiz biri yapar.\" Sa'd şöyle cevap verdi: \"Söylediğin yanlış. Allah'ın Resulü bunu yaptı ve biz de onunla birlikte yaptık.\"", id: "Al-Muwatta 978 — Sa'd ibn Abi Waqqas dan Ad-Dahhak ibn Qays, pada tahun Mu'awiyah melaksanakan Haji: Mereka sedang membahas penggabungan Umrah dengan Haji; Ad-Dahhak berkata: “Hanya orang yang tidak mengetahui perintah Allah yang akan melakukan itu.” Sa'd menjawab: “Apa yang kau katakan itu salah. Rasulullah SAW melakukannya, dan kami melakukannya bersama beliau.”" }
text: "لا يصنع ذلك إلا من جهل أمر الله، فقال سعد: بئس ما قلت يا ابن أخي، قد صنعها رسول الله وصنعناها معه"
summary:
  ar: "أول حديث في باب ما جاء في التمتع. يرويه مالك عن ابن شهاب عن محمد بن عبد الله بن الحارث بن نوفل بن عبد المطلب، أنه سمع سعد بن أبي وقاص والضحاك بن قيس، عام حج معاوية بن أبي سفيان، وهما يذكران التمتع بالعمرة إلى الحج، فقال الضحاك بن قيس: لا يصنع ذلك إلا من جهل أمر الله. فقال سعد: بئس ما قلت يا ابن أخي. فقال الضحاك: فإن عمر بن الخطاب قد نهى عن ذلك. فقال سعد: قد صنعها رسول الله وصنعناها معه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1107). {cite:muwatta-maruf-1997 p.462}"
  tr: "Tamattu' (Umre ve Hac'ı birleştirme) hakkında rivayet edilenler bölümündeki ilk hadis, Malik tarafından İbn Şihab'dan, o da Muhammed ibn Abdullah ibn el-Harith ibn Nawfal ibn Abd el-Muttalib'den rivayet edilmiştir. Buna göre, Mu'awiyah ibn Abi Sufyan'ın Hac yaptığı yıl, Sa'd ibn Abi Waqqas ve el-Dahhak ibn Qays'ın Tamattu' (Umre ve Hac'ı birleştirme) hakkında konuştuklarını işitmiştir. El-Dahhak ibn Qays şöyle demiştir: \"Bunu ancak Allah'ın emrinden habersiz olan yapar.\" Sa'd şöyle cevap vermiştir: \"Ne korkunç bir şey bu, yeğenim!\" El-Dahhak şöyle demiştir: \"Ama Ömer ibn el-Hattab bunu yasaklamıştı.\" Sa'd şöyle cevap vermiştir: \"Allah'ın Resulü bunu yaptı ve biz de onunla birlikte yaptık.\" Editör, bu hadisin Malik'ten Ebu Mus'ab (1107) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.462}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang diriwayatkan mengenai Tamattu' (menggabungkan Umrah dan Haji). Diriwayatkan oleh Malik dari Ibnu Shihab dari Muhammad ibn Abdullah ibn al-Harith ibn Nawfal ibn Abd al-Muttalib, bahwa ia mendengar Sa'd ibn Abi Waqqas dan al-Dahhak ibn Qays, pada tahun Mu'awiyah ibn Abi Sufyan melaksanakan Haji, sedang membahas Tamattu' (menggabungkan Umrah dan Haji). Al-Dahhak ibn Qays berkata: \"Hanya orang yang tidak mengetahui perintah Allah yang akan melakukan itu.\" Sa'd menjawab: \"Sungguh pernyataan yang mengerikan, wahai keponakanku!\" Al-Dahhak berkata: \"Tetapi Umar ibn al-Khattab melarangnya.\" Sa'd menjawab: \"Rasulullah melakukannya, dan kami melakukannya bersamanya.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1107). {cite:muwatta-maruf-1997 p.462}"
