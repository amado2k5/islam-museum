label: { ar: "الموطأ 978 — سعد بن أبي وقاص والضحاك بن قيس عام حج معاوية: يذكران التمتع بالعمرة إلى الحج؛ فقال الضحاك: لا يصنع ذلك إلا من جهل أمر الله؛ فقال سعد: بئس ما قلت، وقد صنعها رسول الله وصنعناها معه", en: "Muwatta 978" }
text: "لا يصنع ذلك إلا من جهل أمر الله، فقال سعد: بئس ما قلت يا ابن أخي، قد صنعها رسول الله وصنعناها معه"
summary:
  ar: "أول حديث في باب ما جاء في التمتع. يرويه مالك عن ابن شهاب عن محمد بن عبد الله بن الحارث بن نوفل بن عبد المطلب، أنه سمع سعد بن أبي وقاص والضحاك بن قيس، عام حج معاوية بن أبي سفيان، وهما يذكران التمتع بالعمرة إلى الحج، فقال الضحاك بن قيس: لا يصنع ذلك إلا من جهل أمر الله. فقال سعد: بئس ما قلت يا ابن أخي. فقال الضحاك: فإن عمر بن الخطاب قد نهى عن ذلك. فقال سعد: قد صنعها رسول الله وصنعناها معه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1107). {cite:muwatta-maruf-1997 p.462}"
