text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ ثَابِتٍ، قَالَ سَمِعْتُ أَنَسًا ـ عَنِ النَّبِيِّ قَالَ \" الصَّبْرُ عِنْدَ الصَّدْمَةِ الأُولَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1302، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1302 (Funerals (Al-Janaa'iz)), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 1302، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 1302, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 1302, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sahih el-Buhari'nin 1302 numaralı hadisi, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü mersiye ve ağıtlardan bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1302, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Koleksi ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
