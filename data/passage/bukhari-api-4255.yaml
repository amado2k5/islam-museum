label: { ar: "صحيح البخاري 4255 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4255 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4255 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4255 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، سَمِعَ ابْنَ أَبِي أَوْفَى، يَقُولُ لَمَّا اعْتَمَرَ رَسُولُ اللَّهِ سَتَرْنَاهُ مِنْ غِلْمَانِ الْمُشْرِكِينَ وَمِنْهُمْ، أَنْ يُؤْذُوا رَسُولَ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4255، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4255 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4255، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4255 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
