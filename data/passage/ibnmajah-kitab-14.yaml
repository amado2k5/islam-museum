summary:
  ar: "القسم 14 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الهبات»، ويضم فيها النصوص من 2375 إلى 2389 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 14 of Sunan Ibn Majah (The Chapters on Gifts) in the division of the open hadith dataset the museum took its reports from: reports 2375 to 2389 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 14، عنوان «کتاب الہبات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2375 تا 2389۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 14 de Sunan Ibn Majah (Los capítulos sobre los regalos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2375 al 2389, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
