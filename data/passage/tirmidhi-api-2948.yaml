label: { ar: "جامع الترمذي 2948 — كتاب القراءات، قراءات القرآن", en: "Jami' al-Tirmidhi 2948 — the Book of the Readings; the readings of the Qur'an", ur: "جامع ترمذی 2948 — کتاب القراءات، قرآن کی قراءتیں", es: "Jami' al-Tirmidhi 2948 — El Libro de las Lecturas; las lecturas del Corán" }
text: "… مِنْ حَدِيثِ ابْنِ عَبَّاسٍ إِلاَّ مِنْ هَذَا الْوَجْهِ وَإِسْنَادُهُ لَيْسَ بِالْقَوِيِّ. حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا صَالِحٌ الْمُرِّيُّ، عَنْ قَتَادَةَ، عَنْ زُرَارَةَ بْنِ أَوْفَى، عَنِ النَّبِيِّ نَحْوَهُ بِمَعْنَاهُ وَلَمْ يَذْكُرْ فِيهِ عَنِ ابْنِ عَبَّاسٍ. قَالَ أَبُو عِيسَى وَهَذَا عِنْدِي أَصَحُّ مِنْ حَدِيثِ نَصْرِ بْنِ عَلِيٍّ عَنِ الْهَيْثَمِ بْنِ الرَّبِيعِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2948، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2948 (Chapters on Recitation), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2948، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2948 (Capítulos sobre la recitación), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
