label: { ar: "سنن ابن ماجه 2005 — الأب والأبوة، النسب والانتساب", en: "Sunan Ibn Majah 2005 — the father and fatherhood; paternity and lineage", ur: "سنن ابن ماجہ 2005 — باپ اور والدیت، نسب اور انتساب", es: "Sunan Ibn Majah 2005 — El padre y la paternidad; paternidad y linaje", fr: "Sunan Ibn Majah 2005 — le père et la paternité; la paternité et la lignée", tr: "Sunan İbn Majah 2005 — Baba ve babalık, soy ve bağlılık", id: "Sunan Ibn Majah 2005 — Ayah dan peran ayah, garis keturunan dan afiliasi" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي يَزِيدَ، عَنْ أَبِيهِ، عَنْ عُمَرَ، أَنَّ رَسُولَ اللَّهِ ـ قَضَى بِالْوَلَدِ لِلْفِرَاشِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2005، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2005 (The Chapters on Marriage), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2005، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2005 (Capítulos sobre el matrimonio), menciona al padre y la paternidad, la genealogía y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2005 (Les chapitres sur le mariage), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "İbn Majah'ın Sünen'inde yer alan 2005 numaralı hadiste babalık, soy ve atalık konularından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2005, menyebutkan tentang ayah, garis keturunan, dan leluhur. Peramban \"Ayah dalam Islam\" mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
