label: { ar: "صحيح البخاري 147 — الأب والأبوة", en: "Sahih al-Bukhari 147 — the father and fatherhood", ur: "صحیح بخاری 147 — باپ اور والدیت", es: "Sahih al-Bukhari 147 — El padre y la paternidad" }
text: "حَدَّثَنَا زَكَرِيَّاءُ، قَالَ حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ قَالَ \" قَدْ أُذِنَ أَنْ تَخْرُجْنَ فِي حَاجَتِكُنَّ \". قَالَ هِشَامٌ يَعْنِي الْبَرَازَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 147، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 147 (Ablutions (Wudu')), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 147، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 147 (Abluciones (Wudu')), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
