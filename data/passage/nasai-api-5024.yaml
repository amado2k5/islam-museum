label: { ar: "سنن النسائي 5024 — مغفرة ما تقدم من الذنب", en: "Sunan al-Nasa'i 5024 — forgiveness of past sins", ur: "سنن نسائی 5024 — پچھلے گناہوں کی مغفرت", es: "Sunan al-Nasa'i 5024 — Perdón de los pecados pasados", fr: "Sunan al-Nasa'i 5024 — le pardon des péchés passés", tr: "Sunan an-Nasa'i 5024 — Geçmiş günahların affı", id: "Sunan an-Nasa'i 5024 — Pengampunan dosa masa lalu" }
text: "أَخْبَرَنَا قُتَيْبَةُ قَالَ حَدَّثَنَا سُفْيَانُ عَنْ الزُّهْرِيِّ عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ أَنَّ رَسُولَ اللَّهِ قَالَ مَنْ قَامَ شَهْرَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ"
summary:
  ar: "حديث في سنن النسائي، رقم 5024، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 5024 (The Book Of Faith and its Signs), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 5024، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5024 (El Libro de la Fe y sus Signos), que habla del perdón de los pecados pasados. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5024 (Le Livre de la Foi et ses Signes), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 5024 numaralı hadis, geçmiş günahların affedilmesinden bahsetmektedir. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 5024, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
