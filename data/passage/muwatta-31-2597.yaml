label: { ar: "الموطأ 2597 — ابن حماس عن عمه عن أبي هريرة: تُترك المدينة حتى يدخلها الكلب والذئب", en: "Muwatta 2597" }
summary:
  ar: "حدثني يحيى عن مالك عن ابن حماس عن عمه عن أبي هريرة أن النبي قال: لتُتركن المدينة على أحسن ما كانت، حتى يدخل الكلب أو الذئب فيُغذي على بعض سواري المسجد أو على المنبر. فقالوا: فلمن تكون الثمار ذلك الزمان؟ قال: للعوافي؛ الطير والسباع. وينقل المحقق قول ابن عبد البر أن رواية يحيى التي لم تسم ابن حماس أسلم من الاضطراب الذي وقع في اسمه عند أصحاب مالك. {cite:muwatta-maruf-1997 p.465} {cite:muwatta-maruf-1997 p.466}"
