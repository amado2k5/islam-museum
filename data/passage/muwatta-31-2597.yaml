label: { ar: "الموطأ 2597 — ابن حماس عن عمه عن أبي هريرة: تُترك المدينة حتى يدخلها الكلب والذئب", en: "Muwatta 2597", es: "Muwatta 2597", fr: "Muwatta 2597", ur: "موطا 2597", tr: "El-Muvatta 2597 — İbn Hamas, amcasından, o da Ebu Hurayra'dan rivayetle: Şehir, köpek ve kurt girinceye kadar öylece bırakılacaktır.", id: "Al-Muwatta 2597 — Ibn Hamas, berdasarkan riwayat pamannya, berdasarkan riwayat Abu Hurairah: Kota itu akan dibiarkan hingga anjing dan serigala memasukinya." }
summary:
  ar: "حدثني يحيى عن مالك عن ابن حماس عن عمه عن أبي هريرة أن النبي قال: لتُتركن المدينة على أحسن ما كانت، حتى يدخل الكلب أو الذئب فيُغذي على بعض سواري المسجد أو على المنبر. فقالوا: فلمن تكون الثمار ذلك الزمان؟ قال: للعوافي؛ الطير والسباع. وينقل المحقق قول ابن عبد البر أن رواية يحيى التي لم تسم ابن حماس أسلم من الاضطراب الذي وقع في اسمه عند أصحاب مالك. {cite:muwatta-maruf-1997 p.465} {cite:muwatta-maruf-1997 p.466}"
  tr: "Yahya, Malik'ten, o da İbn Hamas'tan, o da amcasından, o da Ebu Hurayra'dan rivayetle bana şöyle nakletmiştir: Peygamberimiz şöyle buyurmuştur: “Medine en güzel halindeyken, bir köpek veya kurt girip mescidin direklerinden birini veya minberi yiyene kadar öyle kalacaktır.” “O zaman meyveleri kim yiyecek?” diye sordular. Peygamberimiz şöyle buyurdu: “Kuşlar ve yırtıcı hayvanlar.” Araştırmacı, İbn Abdül-Barr'ın Yahya'nın rivayetinin, İbn Hamas'ın adını anmadığı için, Malik'in takipçileri arasında adıyla ilgili ortaya çıkan karışıklıktan daha güvenli olduğunu söylediğini aktarıyor. {cite:muwatta-maruf-1997 s.465} {cite:muwatta-maruf-1997 s.466}"
  id: "Yahya meriwayatkan kepadaku dari Malik, dari Ibn Hamas, dari pamannya, dari Abu Hurayrah, bahwa Nabi bersabda: “Madinah akan tetap dalam keadaan terbaiknya, sampai seekor anjing atau serigala masuk dan memakan salah satu pilar masjid atau mimbar.” Mereka bertanya: “Siapa yang akan mendapatkan buah-buahan pada saat itu?” Beliau menjawab: “Untuk burung-burung dan binatang buas.” Peneliti mengutip Ibn Abd al-Barr yang mengatakan bahwa riwayat Yahya, yang tidak menyebut nama Ibn Hamas, lebih aman dari kebingungan yang muncul mengenai namanya di kalangan pengikut Malik. {cite:muwatta-maruf-1997 p.465} {cite:muwatta-maruf-1997 p.466}"
