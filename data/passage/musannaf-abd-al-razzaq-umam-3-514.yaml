text: "… إِعْطَاءِ الْجِزْيَةِ، فَإِنْ أَعْطَوْهَا قَبِلَهَا مِنْهُمْ، وَإِنْ أَبَوْا آذَنَهُمْ عَلَىٰ سَوَاءِ، وَكَانَ أَدْنَاهُمْ إِذَا أَعْطَاهُمُ الْعَهْدَ وَفَّوْا لَهُ أَجْمَعُونَ. • عبمالرزاقِ، عَنْ فُضَيْلٍ، عَنْ لَيْثِ، عَنْ مُجَاهِدٍ قَالَ : يُقَاتَلُ أَهْلُ الْأَوْثَانِ عَلَى لإِسْلَامِ، وَيُقَاتَلُ أَهْلُ الْكِتَابِ عَلَىٰ إِغْطَاءِ الْجِزْيَةِ. …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 3، ص 514، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
