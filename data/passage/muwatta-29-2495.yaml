label: { ar: "الموطأ 2495 — مالك: العين القائمة العوراء واليد الشلاء لا عقل مسمى فيهما", en: "Muwatta 2495", es: "Muwatta 2495", fr: "Muwatta 2495", ur: "موطا 2495", tr: "El-Muvatta 2495 — Malik: Kör bir göz ve felçli bir elin zihinsel kapasitesi yoktur.", id: "Al-Muwatta 2495 — Malik: Mata yang buta dan tangan yang lumpuh tidak memiliki kapasitas mental yang ditentukan." }
summary:
  ar: "قال يحيى: قال مالك: الأمر عندنا في العين القائمة العوراء إذا أُطفئت، وفي اليد الشلاء إذا قُطعت: إنه ليس في ذلك إلا الاجتهاد، وليس فيه عقل مسمى. {cite:muwatta-maruf-1997 p.428}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Bizim görüşümüze göre, kör olmuş bir göz ve kesilmiş bir felçli el konusunda, bağımsız akıl yürütmeden başka yapılacak bir şey yoktur ve söz konusu olan belirli bir hukuki neden de yoktur. {cite:muwatta-maruf-1997 s.428}"
  id: "Yahya berkata: Malik berkata: Menurut pandangan kami, mengenai mata buta yang telah dibutakan, dan tangan lumpuh yang telah dipotong, tidak ada yang dapat dilakukan kecuali melalui penalaran independen, dan tidak ada alasan hukum khusus yang terlibat. {cite:muwatta-maruf-1997 p.428}"
