summary:
  ar: "قال مالك: الأمر عندنا فيما كان مما يوزن، من غير الذهب والفضة، من النحاس والشبه والرصاص والآنك والحديد والقضب والتين والكرسف، وما أشبه ذلك مما يوزن، فلا بأس بأن يؤخذ من صنف واحد اثنان بواحد، يدا بيد. ولا بأس بأن يؤخذ رطل حديد برطلي حديد، ورطل صفر برطلي صفر. {cite:muwatta-maruf-1997 p.190}"
