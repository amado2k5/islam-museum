label: { ar: "الموطأ 1930 — مالك: الأمر عندنا فيما يوزن من غير الذهب والفضة، كالنحاس والشبه والرصاص والآنك والحديد والقضب والتين والكرسف، فلا بأس بأن يؤخذ من صنف واحد اثنان بواحد يدا بيد", en: "Muwatta 1930", es: "Muwatta 1930", fr: "Muwatta 1930", ur: "موطا 1930", tr: "El-Muvatta 1930 — Malik: Altın veya gümüş olmayan, ancak tartılan şeyler hakkındaki hükmümüz şudur: Bakır, şap, kurşun, kalay, demir, kamış, incir ve pamuk gibi şeyler, aynı türden iki tanesini elden ele almakta bir sakınca yoktur.", id: "Al-Muwatta 1930 — Malik: Hukum kami mengenai benda-benda yang ditimbang tetapi bukan emas atau perak, seperti tembaga, tawas, timah, besi, alang-alang, buah ara, dan kapas, adalah bahwa tidak ada salahnya mengambil dua benda sejenis untuk satu benda, dengan tangan menapak." }
summary:
  ar: "قال مالك: الأمر عندنا فيما كان مما يوزن، من غير الذهب والفضة، من النحاس والشبه والرصاص والآنك والحديد والقضب والتين والكرسف، وما أشبه ذلك مما يوزن، فلا بأس بأن يؤخذ من صنف واحد اثنان بواحد، يدا بيد. ولا بأس بأن يؤخذ رطل حديد برطلي حديد، ورطل صفر برطلي صفر. {cite:muwatta-maruf-1997 p.190}"
  tr: "Malik şöyle dedi: Bizim uygulamamız şudur ki, altın ve gümüş dışında, bakır, pirinç, kurşun, kalay, demir, kamış, incir, pamuk ve benzeri tartılan şeyler söz konusu olduğunda, aynı türden iki tanesini bir tanesi yerine elden ele almakta bir sakınca yoktur. Ve bir pound demiri iki pound demirle veya bir pound pirinci iki pound pirinçle değiştirmekte de bir sakınca yoktur. {cite:muwatta-maruf-1997 s.190}"
  id: "Malik berkata: Kebiasaan kami adalah, sehubungan dengan barang-barang yang ditimbang, selain emas dan perak, seperti tembaga, kuningan, timah, besi, alang-alang, buah ara, kapas, dan barang-barang serupa yang ditimbang, tidak ada salahnya mengambil dua barang sejenis untuk satu barang, secara langsung. Dan tidak ada salahnya mengambil satu pon besi untuk dua pon besi, atau satu pon kuningan untuk dua pon kuningan. {cite:muwatta-maruf-1997 p.190}"
