summary:
  ar: "القسم 14 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوتر»، ويضم فيها النصوص من 990 إلى 1004 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 14 of Sahih al-Bukhari (Witr Prayer) in the division of the open hadith dataset the museum took its reports from: reports 990 to 1004 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 14، عنوان «کتاب الوتر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 990 تا 1004۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 14 de Sahih al-Bukhari (Oración de Witr) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 990 al 1004 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Livre 14, Prière de Witr), dans la partie ouverte du recueil: les hadiths y sont répertoriés de 990 à 1004. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 14. bölümü \"Kitab el-Vitr\" (Vitr Kitabı) başlığını taşımakta olup, 990'dan 1004'e kadar olan metinleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 14 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab al-Witr\" (Kitab Witr) dan berisi teks 990 hingga 1004, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
