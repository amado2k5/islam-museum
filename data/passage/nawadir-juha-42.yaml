text: "… تصدق الحمار ولا تصدق هذه اللحية طلبَ منه جارُهُ أن يُعِيرهُ حمارَه فقال: إنَّ الحمارَ في السوق. وما كاد يُتِمُّ جحا هذه العبارة، حتى بدأ الحمار، ينهق بصوت منكر من داخل الاصطبل، فقال جارُه: يا شيخُ هذا الحمار يملأ الدنيا …"
summary:
  ar: "قال جحا إن حماره في السوق، فنهق الحمار في الداخل، فقال جحا إن الجار يصدق حمارًا ولا يصدق لحيته البيضاء. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  en: "Juha says his donkey is at the market; the donkey brays inside, and Juha says that the neighbour trusts a donkey but not his white beard. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  ur: "جحا نے کہا کہ اس کا گدھا بازار میں ہے؛ گدھا اندر سے ڈھینچوں ڈھینچوں کرنے لگا، تو جحا نے کہا کہ پڑوسی گدھے کا یقین کرتا ہے مگر اس کی سفید داڑھی کا نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  fr: "Juha affirme que son âne est au marché ; l'âne braie à l'intérieur, et Juha dit que le voisin croit un âne mais pas sa barbe blanche. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  es: "Juha dice que su burro está en el mercado; el burro rebuzna dentro, y Juha dice que el vecino cree a un burro pero no a su barba blanca. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
