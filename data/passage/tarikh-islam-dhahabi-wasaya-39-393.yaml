text: "… بُعْد. ودخلنا عليه قبل موته بمُديْدة فقال: نزلت في أذُني مادّة، فقرأ علينا من حديثه، وبقي على هذا نحواً من شهرين، ثمّ زال ذلك، وعاد إلى الصّحّة، ثمّ مرض فأوصى أن يعمق قبره زيادة على العادة، وأن يُكتب على قبره …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 39، ص 393، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 39, p. 393, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 39، ص 393 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 39, pág. 393, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 39, page 393, mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 39. cildinin (resimli baskı) 393. sayfasından bir alıntı, vasiyetname veya son miras, ölüm ve vefat zamanı, defin, mezar ve türbeden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir baskıdan alınmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 39 (edisi bergambar), halaman 393, menyebutkan wasiat atau surat wasiat terakhir, waktu kematian dan wafat, pemakaman, kuburan, dan makam; diambil dari edisi yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
