label: { ar: "الموطأ 1840 — مالك: إنما فرق بين ذلك القبض، فمن قبض ما استأجر أو استكرى خرج من الغرر والسلف المكروه، ومثل ذلك أن يشتري الرجل العبد أو الوليدة فيقبضهما وينقد أثمانهما، فإن حدث بهما حدث من عهدة السنة، أخذ ذهبه من صاحبه الذي ابتاع منه، وبهذا مضت السنة في بيع الرقيق", en: "Muwatta 1840", es: "Muwatta 1840", fr: "Muwatta 1840", ur: "موطا 1840", tr: "El-Muvatta 1840 — Malik: Fark, mülkiyeti ele geçirme eylemindedir. Kiraladığı veya ödünç aldığı şeyi ele geçiren kimse, belirsizlikten ve mekruh olan borçtan kurtulur. Benzer şekilde, bir kimse erkek veya kadın bir köle satın alır, onu ele geçirir ve bedelini öderse, eğer köleye yıl içindeki yükümlülükler kapsamında bir şey olursa, altınını satın aldığı kişiden geri alır. Köle satışında sünnet böyle uygulanmıştır.", id: "Al-Muwatta 1840 — Malik: Perbedaannya terletak pada tindakan mengambil kepemilikan. Barang siapa mengambil kepemilikan atas apa yang telah disewa atau dipinjamnya, ia terhindar dari ketidakpastian dan hutang yang tidak disukai. Demikian pula, jika seseorang membeli budak laki-laki atau perempuan, mengambil kepemilikannya, dan membayar harganya, maka jika terjadi sesuatu pada mereka yang termasuk dalam kewajiban tahunan, ia mengambil emasnya dari orang yang menjualnya. Inilah bagaimana Sunnah diikuti dalam penjualan budak." }
summary:
  ar: "قال مالك: وإنما فرق بين ذلك القبض. من قبض ما استأجر أو استكرى فقد خرج من الغرر والسلف الذي يكره، وأخذ أمرا معلوما. وإنما مثل ذلك أن يشتري الرجل العبد أو الوليدة فيقبضهما وينقد أثمانهما، فإن حدث بهما حدث من عهدة السنة، أخذ ذهبه من صاحبه الذي ابتاع منه. فهذا لا بأس به، وبهذا مضت السنة في بيع الرقيق. {cite:muwatta-maruf-1997 p.155}"
  tr: "Malik şöyle dedi: Fark, mülkiyeti alma eylemindedir. Kiraladığı veya ödünç aldığı şeyi teslim alan kimse, belirsizlikten ve haram olan borç alma uygulamasından kaçınmış ve bilinen bir şeyi teslim almıştır. Buna örnek olarak, bir adamın erkek veya kadın bir köle satın alması, onları teslim alması ve bedelini ödemesi verilebilir. Eğer kölelere yıllık yükümlülük kapsamına giren bir şey olursa, altınını onları satın aldığı kişiden geri alır. Bu caizdir ve köle satışında sünnet böyle uygulanmıştır. {cite:muwatta-maruf-1997 s.155}"
  id: "Malik berkata: Perbedaannya terletak pada tindakan mengambil kepemilikan. Siapa pun yang mengambil kepemilikan atas apa yang telah disewa atau dikontraknya telah menghindari ketidakpastian dan praktik haram mengambil pinjaman, dan telah mengambil sesuatu yang diketahui. Contohnya adalah ketika seorang pria membeli budak laki-laki atau perempuan, mengambil kepemilikannya, dan membayar harganya. Jika terjadi sesuatu pada mereka yang termasuk dalam lingkup kewajiban tahunan, dia mengambil emasnya dari orang yang menjualnya. Ini diperbolehkan, dan inilah bagaimana Sunnah diikuti dalam penjualan budak. {kutipan:muwatta-maruf-1997 hlm.155}"
