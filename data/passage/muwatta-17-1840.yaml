label: { ar: "الموطأ 1840 — مالك: إنما فرق بين ذلك القبض، فمن قبض ما استأجر أو استكرى خرج من الغرر والسلف المكروه، ومثل ذلك أن يشتري الرجل العبد أو الوليدة فيقبضهما وينقد أثمانهما، فإن حدث بهما حدث من عهدة السنة، أخذ ذهبه من صاحبه الذي ابتاع منه، وبهذا مضت السنة في بيع الرقيق", en: "Muwatta 1840" }
summary:
  ar: "قال مالك: وإنما فرق بين ذلك القبض. من قبض ما استأجر أو استكرى فقد خرج من الغرر والسلف الذي يكره، وأخذ أمرا معلوما. وإنما مثل ذلك أن يشتري الرجل العبد أو الوليدة فيقبضهما وينقد أثمانهما، فإن حدث بهما حدث من عهدة السنة، أخذ ذهبه من صاحبه الذي ابتاع منه. فهذا لا بأس به، وبهذا مضت السنة في بيع الرقيق. {cite:muwatta-maruf-1997 p.155}"
