label: { ar: "سنن النسائي 3496 — الأب والأبوة", en: "Sunan al-Nasa'i 3496 — the father and fatherhood", ur: "سنن نسائی 3496 — باپ اور والدیت", es: "Sunan al-Nasa'i 3496 — El padre y la paternidad" }
text: "… مَيْمُونَةَ، قَالَ بَيْنَا أَنَا عِنْدَ أَبِي هُرَيْرَةَ، فَقَالَ إِنَّ امْرَأَةً جَاءَتْ رَسُولَ اللَّهِ فَقَالَتْ فَدَاكَ أَبِي وَأُمِّي إِنَّ زَوْجِي يُرِيدُ أَنْ يَذْهَبَ بِابْنِي وَقَدْ نَفَعَنِي وَسَقَانِي مِنْ بِئْرِ أَبِي عِنَبَةَ. فَجَاءَ زَوْجُهَا وَقَالَ مَنْ يُخَاصِمُنِي فِي ابْنِي فَقَالَ \" يَا غُلاَمُ هَذَا أَبُوكَ وَهَذِهِ أُمُّكَ فَخُذْ بِيَدِ أَيِّهِمَا شِئْتَ \". فَأَخَذَ بِيَدِ أُمِّهِ فَانْطَلَقَتْ بِهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 3496، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3496 (The Book of Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3496، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3496 (El Libro del Divorcio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
