  ar: "صحيح البخاري، كتاب التيمم"
  en: "Sahih al-Bukhari, Book 7: Rubbing hands and feet with dust (Tayammum)"
  ur: "صحیح بخاری، کتاب التیمم"
  es: "Sahih al-Bukhari, Libro 7: Frotarse las manos y los pies con polvo (Tayammum)"
summary:
  ar: "القسم 7 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التيمم»، ويضم فيها النصوص من 334 إلى 348 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 7 of Sahih al-Bukhari (Rubbing hands and feet with dust (Tayammum)) in the division of the open hadith dataset the museum took its reports from: reports 334 to 348 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 7، عنوان «کتاب التیمم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 334 تا 348۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 7 de Sahih al-Bukhari (Frotarse las manos y los pies con polvo (Tayammum)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 334 a 348 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
