text: "مقدمة المؤلف باب: أَخذه الزكاة ممن عجلها. باب: سيرته عليه في زكاة الفطر. باب: سيرته في المُدّ والصاعِ والوسق. باب: من حُرم الصدقة ومن أُحلت له وفيه أَنواع. باب: حثه على صدقة التطوع إِذا نظر المحتاج. باب: تصدّقه بقليل وكثير. …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 31، يذكر ما أُحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 31, that mentions what was made lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 1، ص 31 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
