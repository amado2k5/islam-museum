text: "مقدمة المؤلف باب: أَخذه الزكاة ممن عجلها. باب: سيرته عليه في زكاة الفطر. باب: سيرته في المُدّ والصاعِ والوسق. باب: من حُرم الصدقة ومن أُحلت له وفيه أَنواع. باب: حثه على صدقة التطوع إِذا نظر المحتاج. باب: تصدّقه بقليل وكثير. …"
