text: |-
  ٣١
  بفتح الراء أى مديون كأن الدين أخذيا رابه قال الشاعر مستأرب عضه السلطان مديون
  والارب أيضا الدهاء وهو من العقل يقال هوذوإرب وقد أرب يأرب اربا مثل صغر صغرا
  وأرابة أيضابالفتح عن أبى زيد وذلان يؤارب صاحبه اذاداهاه والاريب العاقل والارب
  أيضا الحاجة وفيه لغات ارب وارية وأرب ومأربة ومأربة وفى المثل مأربة لاحفاوة تقول
  منه أرب الرجل بالكسر بأرب أربا وقوله تعالى غير أولى الاربة من الرجال قال سعيد
  بن جبيرهو المعتوه وأرب الدهر أيضااذا اشتد وقال
  أرب الدهر فأعددت له • مشرف الخارك محبول الكتد
  ويقال أيضا أرب الرجل اذا نساقطت أعضاؤه ويقال أريت من يديك أى سقطت آرابك
  من اليدين خاصة وأرب بالشئ أيضادرب به وصار بصيرافيه فهو أرب وقال الشاعرأً بوالعيال.
  يلف طوائف الاعدا • وهو بلفهم أرب
  والاربة بالضم العقدة وتأريب العقدة احكامها يقال أرّب عقدتك وهى التى لا تحلحتى
  تحل حلاقال ابن مقبل ضرب القداح وتآريب على الخطر وتآريب الشى أيضانوفيره
  وكل موفر مؤر ب يقال أعطاه عضوامؤر با أى تامالم يكسر الاصحعى التأرب التشدّد
  فى الشي يقال:أربت فى حاجتى وتأرب فلان علىّ أى تأبى وتشددوآر بت على القوم أى
  فزت عليهم وفلجت ومنه قول لبيد * ونفس الفتى رهن بقمرة مؤرب ومأربموضع ومنه علح
  مأرب والأربى الداهبة بضم الهمزة قال ابن أحر
  فلما غسى ليلى وأيقنت انها * هى الاربى جاءت بأمّ حبوكرى
  ( أزب. المئزاب المرزاب وربمالم يهمز والبهع الما زيب والازب اللهيم والازب القصير
  الدميم ابن الاعرابية رجل إزب حزب أى داهية، إسب، أبو عر والاسب بالكسرشع,
  الاست ويحتمل أن يكون أصله من الوسب وهو النبات فقلبت الواوهمزة كما قالوا ارث
  وورث ⁦(أشب)⁩ أشبه يأشبه أشبالامه وعابه وقال اوس
  ويأشبنى فيها الذين يلونها • ولوعلوالم يأشبونى بباطل
  ويقال أيضا أشبت القوم اذا خلطت بعضهم ببعض والاشابة من الناس الاخلاط وايهع
  الاشائب قال الذابغة
  وثقت له بالنصر اذقيل قدعزت • قبائل من غسان غير أشائب
  وتأشب القوم اختلطوا واتنسبوا أيضا بقال جاءفلان فيمن تأشب اليه أى انضم اليه والتف
  اليه والتأشيب التحريسْ بين القوم وأشبت الغيضة بالكسر أى التفت وعيص أشب أي
  لمتف وعدد أشب وفلان موتشب أى مخلوط غير صريح فى نسبه وقولهم ضربت فيه فلانة
  بعرق ذى أشب أى ذى التياس ⁦( لب )⁩ لفراء ألب الابل يألبها و يألبها ألباجعها وساقها
  وألبت الجيشاذا جعته وتألبوا تجمعواوهم ألب وإلب اذا كانوا مجتمعين قال رؤية.
  قد أصبح الناس علينا ألبا * فالناس فى جنب وكنا جنبا
  وكذلك الالبة بالضم والتأليب التحريض يقال حسود مؤاب قال ساعدة بن جؤية الهذلى
  ضبرلبا-هم القتير المؤاب والتألب مثال النعلب شجر نب أنيسه تأنيبا عنفه
  صدر شم المعاطس يتسيهم
  معاطفهم التأريب هنا التشديد
  فى القمار .أخوذ من أرب اذا
  شدد وأوثق كذا فى بعض الفسخ
