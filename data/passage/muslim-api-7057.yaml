label: { ar: "صحيح مسلم 7057 — ضحك وتبسم", en: "Sahih Muslim 7057 — laughter and smiling", ur: "صحیح مسلم 7057 — ہنسی اور تبسم", fr: "Sahih Muslim 7057 — rire et sourire", es: "Sahih Muslim 7057 — risa y sonrisa" }
text: "… الْقَاسِمِ أَلاَ أُخْبِرُكَ بِنُزُلِ أَهْلِ الْجَنَّةِ يَوْمَ الْقِيَامَةِ قَالَ بَلَى . قَالَ تَكُونُ الأَرْضُ خُبْزَةً وَاحِدَةً - كَمَا قَالَ رَسُولُ اللَّهِ - قَالَ فَنَظَرَ إِلَيْنَا رَسُولُ اللَّهِ ثُمَّ ضَحِكَ حَتَّى بَدَتْ نَوَاجِذُهُ قَالَ أَلاَ أُخْبِرُكَ بِإِدَامِهِمْ قَالَ بَلَى . قَالَ إِدَامُهُمْ بَالاَمُ وَنُونٌ. قَالُوا وَمَا هَذَا قَالَ ثَوْرٌ وَنُونٌ يَأْكُلُ مِنْ زَائِدَةِ كَبِدِهِمَا سَبْعُونَ أَلْفًا."
summary:
  ar: "حديث في صحيح مسلم، رقم 7057، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih Muslim, no. 7057, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح مسلم کی حدیث نمبر 7057، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih Muslim, n° 7057, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih Muslim, n.º 7057, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
