label: { ar: "جامع الترمذي 1279 — ما كرهه الفقهاء، الرخصة", en: "Jami' al-Tirmidhi 1279 — what the jurists disliked; the concession (rukhsa)", ur: "جامع ترمذی 1279 — جسے فقہاء نے مکروہ کہا، رخصت", fr: "Jami' al-Tirmidhi 1279 — ce que les juristes ont réprouvé ; la dispense (rukhsa)", es: "Yami' al-Tirmidhi 1279 — lo que los juristas reprobaron; la dispensa (rukhsa)", tr: "Cami' el-Tirmizi 1279 — Fıkıhçıların hoşlanmadığı şey, bu uygulamaydı.", id: "Jami' al-Tirmidhi 1279 — Apa yang tidak disukai para ahli hukum, yaitu kebijakan" }
text: "… وَلاَ يَصِحُّ فِي ثَمَنِ السِّنَّوْرِ. وَقَدْ رُوِيَ هَذَا الْحَدِيثُ عَنِ الأَعْمَشِ عَنْ بَعْضِ أَصْحَابِهِ عَنْ جَابِرٍ. وَاضْطَرَبُوا عَلَى الأَعْمَشِ فِي رِوَايَةِ هَذَا الْحَدِيثِ. وَقَدْ كَرِهَ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ ثَمَنَ الْهِرِّ وَرَخَّصَ فِيهِ بَعْضُهُمْ وَهُوَ قَوْلُ أَحْمَدَ وَإِسْحَاقَ. وَرَوَى ابْنُ فُضَيْلٍ عَنِ الأَعْمَشِ عَنْ أَبِي حَازِمٍ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ مِنْ غَيْرِ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1279، يرد فيه ذكر ما كرهه الفقهاء، والرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 1279 (The Book on Business), whose wording mentions what the jurists disliked, the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 1279، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1279, dont le texte mentionne ce que les juristes ont réprouvé, la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 1279, cuyo texto menciona lo que los juristas reprobaron, la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 1279 numaralı hadis, fıkıhçıların hoşlanmadığı ve hüküm giydiği konuları zikretmektedir. Farz, görev, ibadet, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetlerinden derler. Derleyen kişi metinde yer alanları açıklar ancak buna dayanarak fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1279, menyebutkan apa yang tidak disukai oleh para ahli fiqih dan keringanan yang diberikan. Penyusun kitab tentang amalan wajib, kewajiban, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
