label: { ar: "الموطأ 1465 — مالك: لا ميراث لأحد من الجدات إلا الجدتين، لأن النبي ورث الجدة، وأبو بكر سأل حتى أتاه الثبت، ثم أنفذ لها السدس", en: "Muwatta 1465", es: "Muwatta 1465", fr: "Muwatta 1465", ur: "موطا 1465", id: "Al-Muwatta 1465 — Malik: Tidak ada nenek yang berhak mewarisi kecuali dua nenek, karena Nabi (shalawat dan salam kepadanya) memberikan warisan kepada nenek, dan Abu Bakar bertanya sampai bukti diberikan kepadanya, kemudian beliau memberikan seperenam kepada nenek." }
summary:
  ar: "يقول مالك لا ميراث لأحد من الجدات إلا الجدتين، لأنه بلغه أن رسول الله ورث الجدة، ثم سأل أبو بكر عن ذلك حتى أتاه الثبت عن رسول الله أنه ورث الجدة، فأنفذه لها. ثم أتت الجدة الأخرى إلى عمر بن الخطاب، فقال ما أنا بزائد في الفرائض شيئا، فإن اجتمعتما فيه فهو بينكما، وأيتكما خلت به فهو لها. {cite:muwatta-maruf-1997 p.16}"
  id: "Malik berkata bahwa hanya dua nenek yang berhak mewarisi, karena ia mendengar bahwa Rasulullah shalla Allahu alaihi wa sallam telah memberikan warisan kepada nenek. Abu Bakar kemudian menanyakan hal ini hingga ia mendapat konfirmasi dari Rasulullah bahwa beliau memang telah memberikan warisan kepada nenek tersebut, sehingga ia menyetujuinya. Kemudian nenek yang lain datang kepada Umar bin al-Khattab, yang berkata, \"Aku tidak akan menambahkan apa pun pada bagian yang telah ditentukan. Jika kalian berdua setuju, maka warisan itu akan dibagi di antara kalian, dan siapa pun di antara kalian yang mendapat warisan sendirian, maka warisan itu menjadi miliknya.\" {cite:muwatta-maruf-1997 p.16}"
