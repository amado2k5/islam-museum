label: { ar: "الموطأ 1465 — مالك: لا ميراث لأحد من الجدات إلا الجدتين، لأن النبي ورث الجدة، وأبو بكر سأل حتى أتاه الثبت، ثم أنفذ لها السدس", en: "Muwatta 1465" }
summary:
  ar: "يقول مالك لا ميراث لأحد من الجدات إلا الجدتين، لأنه بلغه أن رسول الله ورث الجدة، ثم سأل أبو بكر عن ذلك حتى أتاه الثبت عن رسول الله أنه ورث الجدة، فأنفذه لها. ثم أتت الجدة الأخرى إلى عمر بن الخطاب، فقال ما أنا بزائد في الفرائض شيئا، فإن اجتمعتما فيه فهو بينكما، وأيتكما خلت به فهو لها. {cite:muwatta-maruf-1997 p.16}"
