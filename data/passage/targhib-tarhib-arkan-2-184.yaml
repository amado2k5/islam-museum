text: "… الحمر وبيعها وشرائها وعصرها وحلها وأكل ثمنها والتشديد في ذلك والترغيب في تركه والتوبة منه - عن ابى هريرة أن رسول اللّٰه قال لايزنى الزانى حين يزنى وهو مؤمن ولا يسرق السارق حين يسرق وهو مؤمن ولا يشرب الخمر حين …"
summary:
