text: "… عن زيادة الإيمان في القلب ونقصانه، فذكر نحوه. فقال البزار : حدثنا محمد بن أبي الحسن البصري، ثنا هانئ بن المتوكل، ثنا عبدالله بن سليمان، عن إسحاق، عن أنس مرفوعاً: ثلاث من كن فيه استوجب الثواب، واستكمل الإيمان: خلق يعيش …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 3، ص 179، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 3, p. 179, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 3، ص 179 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 3, pág. 179, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, caracterizan la fe, la cual aumenta y disminuye; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait du Kitab al-Iman d'Ibn Taymiyya (tome 3, p. 179) évoque la douceur et la plénitude de la foi, qualités qui, chez une personne, caractérisent sa foi, sa croissance et son déclin. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 3. cildinin 179. sayfasından bir alıntı, imanın tatlılığı ve mükemmelliği, imanın sahiplerinin nitelikleri ve imanın artışı ve azalışı konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 3, halaman 179, membahas tentang manisnya dan kesempurnaan iman, sifat-sifat orang yang memilikinya, serta peningkatan dan penurunan iman. Kutipan ini diambil dari edisi yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
