text: "كما نواه وأداه، إذ قال: نويت أداء فرض الله - تعالى -. فإن قيل: بنيتم كلامكم على أن تركه جائز بشرط وهو العزم على الامتثال أو الفعل، وليس كذلك، فإن الواجب المخير: ما خير فيه بين شيئين، كخصال الكفارة، وما …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 314، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 314, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 314 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, vol. 1 de al-Ghazali, p. 314, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, vol. 1 de al-Ghazali, p. 314, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin 1. cildinin 314. sayfasından, Allah ve Resulü'nün farz ve zorunlu amelleri de içeren bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Jilid 1, halaman 314, yang menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, termasuk amalan wajib dan yang diharuskan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus mengurutkan amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
