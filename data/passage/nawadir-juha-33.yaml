text: "… الأكراد يجهلون التركية أُرسِل يوماً إلى أحد الأكراد مندوباً، فاحتفل به أهل البلد، احتفالاً عظيماً، وكانت هيئته الخارجية تدل على جلال ووقار وهيبة، وكان يصحبه تلميذ له. فأقاموا له وليمة عظيمة، وكان الطعام الذي قُدِّمَ إليه مما يُهيِّجُ الغازاتِ الداخليةَ، …"
summary:
  ar: "أُرسل جحا موفدًا إلى الأكراد، فأطلق ريحًا بصوت عالٍ في الوليمة، وقال إنه تكلم بالتركية وهم لا يفهمونها. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  en: "Juha is sent as an envoy to the Kurds, passes wind loudly at the feast, and says he spoke in Turkish, which they do not understand. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  ur: "جحا کو سفیر بنا کر کردوں کے پاس بھیجا گیا، اس نے دعوت میں بلند آواز سے ہوا خارج کی اور کہا کہ میں نے ترکی میں بات کی ہے جو وہ نہیں سمجھتے۔ {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  fr: "Juha est envoyé en ambassade chez les Kurdes, lâche un vent sonore pendant le festin, et dit qu'il a parlé en turc, qu'ils ne comprennent pas. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  es: "Juha es enviado como emisario a los kurdos, suelta una ventosidad sonora durante el banquete y dice que habló en turco, que ellos no entienden. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
