text: "… وهى الأرض المقدسة التى كان فيها، ومعه أنعام وعبيد ومال جزيل، وصحبتهم هاجر القبطية المصرية ثم إن لوطاً نزح بما له من الأموال الجزيلة بأمر الخليل له في ذلك، إلى أرض الغور، المعروف بغور زغر، فنزل بمدينة سدوم وهى أم …"
