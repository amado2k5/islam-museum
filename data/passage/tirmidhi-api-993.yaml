label: { ar: "جامع الترمذي 993 — الأب والأبوة", en: "Jami' al-Tirmidhi 993 — the father and fatherhood", ur: "جامع ترمذی 993 — باپ اور والدیت", es: "Jami' al-Tirmidhi 993 — El padre y la paternidad" }
text: "… مُحَمَّدُ بْنُ عَبْدِ الْمَلِكِ بْنِ أَبِي الشَّوَارِبِ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ الْمُخْتَارِ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" مِنْ غُسْلِهِ الْغُسْلُ وَمِنْ حَمْلِهِ الْوُضُوءُ \". يَعْنِي الْمَيِّتَ. قَالَ وَفِي الْبَابِ عَنْ عَلِيٍّ وَعَائِشَةَ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ وَقَدْ رُوِيَ عَنْ أَبِي هُرَيْرَةَ مَوْقُوفًا. …"
summary:
  ar: "حديث في جامع الترمذي، رقم 993، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 993 (The Book on Jana''iz (Funerals)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 993، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 993 (El Libro de los Funerales), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
