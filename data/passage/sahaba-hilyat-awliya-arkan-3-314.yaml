text: "… فمن أى الأصناف أنت أقلت ممن لا يسب السلف، ويؤمن بالقدر، ولا يكفر أحداً بذنب. فقال لى عطاء : عرفت فالزم. حدثنا أبى ثنا احمد بن عهد بن الحسن ثنا احمد بن بديل قال سمعت أبا عبيد يقول : دخلنا …"
