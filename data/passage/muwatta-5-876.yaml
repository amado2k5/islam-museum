summary:
  ar: "قول لمالك: الاعتكاف والجوار سواء، والاعتكاف للقروي والبدوي سواء. ويذكر المحقق أن هذه الأقوال رواها عن مالك أبو مصعب (868–869). {cite:muwatta-maruf-1997 p.422}"
  tr: "Malik şöyle demiştir: İtikaf ve civar aynıdır ve itikaf köylüler ve bedeviler için aynıdır. Araştırmacı, bu ifadelerin Malik'ten Ebu Mus'ab (868-869) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.422}"
  id: "Malik berkata: I'tikaf dan jiwar adalah sama, dan i'tikaf sama bagi penduduk desa dan suku Badui. Peneliti menyebutkan bahwa pernyataan ini diriwayatkan dari Malik oleh Abu Mus'ab (868–869). {cite:muwatta-maruf-1997 p.422}"
