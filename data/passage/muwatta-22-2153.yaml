label: { ar: "الموطأ 2153 — يحيى عن مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة: سأل سعد بن عبادة رسول الله أرأيت إن وجدت مع امرأتي رجلا أأمهله حتى آتي بأربعة شهداء؟ فقال: نعم", en: "Muwatta 2153" }
summary:
  ar: "قال يحيى: حدثنا مالك عن سهيل بن أبي صالح السمان عن أبيه عن أبي هريرة أن سعد بن عبادة قال لرسول الله: أرأيت إن وجدت مع امرأتي رجلا، أأمهله حتى آتي بأربعة شهداء؟ فقال رسول الله: نعم. {cite:muwatta-maruf-1997 p.281}"
