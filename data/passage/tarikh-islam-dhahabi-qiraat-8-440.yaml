text: "… ولا بلاغة. وقال إبراهيم بن سعد، عن الزُّهْرِيّ، عن أنس: إنّ عثمان أمر زيدَ بنَ ثابت، وابنَ الزُّبَير، وسعيد بن العاص، وعبد الرحمن بن الحارث بن هشام، فنسخوا القرآنَ في المصاحف، وقال: إذا اختلفتم أنتم وزَيْد في شيءٍ فاكتُبُوه بلسان …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 8، ص 440، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 8, p. 440, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 8، ص 440 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
