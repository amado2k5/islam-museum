text: "… ولا بلاغة. وقال إبراهيم بن سعد، عن الزُّهْرِيّ، عن أنس: إنّ عثمان أمر زيدَ بنَ ثابت، وابنَ الزُّبَير، وسعيد بن العاص، وعبد الرحمن بن الحارث بن هشام، فنسخوا القرآنَ في المصاحف، وقال: إذا اختلفتم أنتم وزَيْد في شيءٍ فاكتُبُوه بلسان …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 8، ص 440، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 8, p. 440, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 8، ص 440 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 8, pág. 440, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 8, page 440, mentionne la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 8. cildinin 440. sayfasından alınan bu alıntı, Kur'an'ın derlenmesini, el yazmalarını ve Kur'an yazısının imlasını ele almaktadır. Bu alıntı, makine tarafından okunabilir dijital bir kopyadan alınmıştır ve kaynak kod politikası gereği metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 8, halaman 440, membahas penyusunan Al-Quran dan manuskripnya, serta ortografi tulisan Al-Quran. Kutipan ini diambil dari salinan digital yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, tulisan, kaligrafi, dan diakritik."
