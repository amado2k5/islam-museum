label: { ar: "سنن ابن ماجه 84 — الأب والأبوة", en: "Sunan Ibn Majah 84 — the father and fatherhood", ur: "سنن ابن ماجہ 84 — باپ اور والدیت", es: "Sunan Ibn Majah 84 — El padre y la paternidad" }
text: "… بْنُ إِسْمَاعِيلَ، حَدَّثَنَا يَحْيَى بْنُ عُثْمَانَ، مَوْلَى أَبِي بَكْرٍ حَدَّثَنَا يَحْيَى بْنُ عَبْدِ اللَّهِ بْنِ أَبِي مُلَيْكَةَ، عَنْ أَبِيهِ، أَنَّهُ دَخَلَ عَلَى عَائِشَةَ فَذَكَرَ لَهَا شَيْئًا مِنَ الْقَدَرِ فَقَالَتْ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" مَنْ تَكَلَّمَ فِي شَىْءٍ مِنَ الْقَدَرِ سُئِلَ عَنْهُ يَوْمَ الْقِيَامَةِ وَمَنْ لَمْ يَتَكَلَّمْ فِيهِ لَمْ يُسْأَلْ عَنْهُ \". قَالَ أَبُو …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 84، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 84 (The Book of the Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 84، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 84 (El Libro de la Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
