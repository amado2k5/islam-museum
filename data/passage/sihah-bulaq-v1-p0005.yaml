  فلاتجزع من الحدثان انى • أكر الغزواذجاب التروح
  ( برع البراع سع براعة وهو ذباب بطير بالليل كانه نار والبراع القصب والبراعة القصبة
  ويقال للجبان يراع ديراعة وأماقول أبى ذو يب يصف مزمارا
  سبى منيراعة..فاء • أتى مد. صحرولوب
  اية ال انه أراد باليراعة الاجحة › يقع اليفاع ماارتنع من الارض وأيفع الغلام أى
  ارتفع وهويافع ولا يقال موفع وهومن الموادر وغسلام يفع ويقعة أيضا وغمان أيفاع
  ويفعة أيضا ( نع نع الثمر يينع و يينع ينعاو ينعاوينوعا أى نضبح وأينع مثله ولم تسقط
  لياء فى المستقبل لتقوّيها بأختها وقرى وينهه وينعه وهومثل النضج والنضج والينيع
  واليانع مثل النضيح والناضيح قال عرو بن معدى كرب
  كان على عوارضهن راحا • يغض عليه رمّان ينبح
  وجع اليانع ينع مثل صاحب وصحب عن ابن كيدان
  تم الإزه الاول من مصاح الموهرى فى آخرر بيع الأول س٢٨٢ لغة وكان تحميحه ؛عرفة الفقير
  نصر الهورين عفا اللّٰه عنه آمين ويليه الجزءالثانى أوّله باب الغين وأعسلم ان مارضعته
  بالهوامس راعز افيه بحر فى المسيم والراء فهواشارة الى العلامة السيد عجمدهرتضى
  شارح القاموس وان اشة ربهذا الرحز شارح المنهاج الشافى العلامة
  الشهبس محد الرملى ابن الشهاب الرحلى الكبير
