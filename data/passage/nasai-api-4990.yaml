text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ أَنْبَأَنَا كَهْمَسُ بْنُ الْحَسَنِ، قَالَ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ يَحْيَى بْنِ يَعْمَرَ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، قَالَ حَدَّثَنِي عُمَرُ بْنُ الْخَطَّابِ، قَالَ بَيْنَمَا نَحْنُ عِنْدَ رَسُولِ اللَّهِ صلى الله عليه وسلم ذَاتَ يَوْمٍ إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ شَدِيدُ سَوَادِ الشَّعَرِ لاَ يُرَى عَلَيْهِ أَثَر …"
summary:
  ar: "في السنن النسائي؛ ذكر ديوان أو بريد المراسلات."
  en: "In Sunan al-Nasa'i; mention of the chancery or the barid post."
  ur: "سنن النسائی میں؛ دیوآن یا بریڈ کا ذکر."
