label: { ar: "صحيح مسلم 6935 — القراء", en: "Sahih Muslim 6935 — the readers", ur: "صحیح مسلم 6935 — قراء", es: "Sahih Muslim 6935 — los lectores", fr: "Sahih Muslim 6935 — les lecteurs" }
text: "حَدَّثَنِي عَبْدُ الْمَلِكِ بْنُ شُعَيْبِ بْنِ لَيْثٍ، حَدَّثَنِي أَبِي، عَنْ جَدِّي، حَدَّثَنِي عُقَيْلُ بْنُ خَالِدٍ، عَنِ ابْنِ شِهَابٍ، أَنَّهُ قَالَ حَدَّثَنِي أَبُو عُبَيْدٍ، مَوْلَى عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ وَكَانَ مِنَ الْقُرَّاءِ وَأَهْلِ الْفِقْهِ قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ يَقُولُ قَالَ رَسُولُ اللَّهِ \" يُسْتَجَابُ لأَحَدِكُمْ مَا لَمْ يَعْجَلْ فَيَقُولُ قَدْ دَعَوْتُ رَبِّي فَلَمْ يَسْتَجِبْ لِي \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6935، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih Muslim, no. 6935 (The Book Pertaining to the Remembrance of Allah, Supplication, Repentance and Seeking Forgiveness), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح مسلم کی حدیث نمبر 6935، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 6935 (El Libro sobre el Recuerdo de Alá, la Súplica, el Arrepentimiento y la Búsqueda del Perdón), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un hadith du Sahih Muslim, n° 6935 (Livre relatif à l'invocation d'Allah, aux supplications, au repentir et à la demande de pardon), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
