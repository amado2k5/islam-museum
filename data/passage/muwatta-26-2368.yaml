summary:
  ar: "قال مالك في رجل نصراني دبر عبدا له نصرانيا فأسلم العبد: يحال بينه وبين العبد، ويخارج على سيده النصراني، ولا يباع عليه حتى يتبين أمره. فإن هلك النصراني وعليه دين قضي من ثمن المدبر، إلا أن يكون في ماله ما يحمل الدين فيعتق المدبر. {cite:muwatta-maruf-1997 p.375}"
