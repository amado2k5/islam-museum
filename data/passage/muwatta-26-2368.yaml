label: { ar: "الموطأ 2368 — مالك: نصراني دبر عبدا نصرانيا فأسلم العبد", en: "Muwatta 2368", es: "Muwatta 2368", fr: "Muwatta 2368", ur: "موطا 2368", tr: "El-Muvatta 2368 — Malik: Bir Hristiyan adam, bir Hristiyan köle için şartlı azat verdi ve köle İslam'ı kabul etti.", id: "Al-Muwatta 2368 — Malik: Seorang pria Kristen memberikan pembebasan bersyarat kepada seorang budak Kristen, dan budak itu masuk Islam." }
summary:
  ar: "قال مالك في رجل نصراني دبر عبدا له نصرانيا فأسلم العبد: يحال بينه وبين العبد، ويخارج على سيده النصراني، ولا يباع عليه حتى يتبين أمره. فإن هلك النصراني وعليه دين قضي من ثمن المدبر، إلا أن يكون في ماله ما يحمل الدين فيعتق المدبر. {cite:muwatta-maruf-1997 p.375}"
  tr: "Malik, Hristiyan bir adamın, ölümünden sonra Hristiyan kölesine efendisinin özgürlüğünü vermesi ve kölenin daha sonra İslam'a geçmesi durumunda şunları söylemiştir: Adam köleden ayrılır ve Hristiyan efendisine karşı bir borç kaydedilir. Kölenin durumu netleşene kadar satılmaması gerekir. Eğer Hristiyan adam borçlu iken ölürse, borç kölenin özgürlüğünden elde edilecek gelirden ödenir; ancak borcu karşılayacak kadar serveti varsa, köle serbest bırakılır. {cite:muwatta-maruf-1997 s.375}"
  id: "Malik berkata mengenai seorang pria Kristen yang memberikan kebebasan kepada budak Kristennya setelah kematian tuannya, dan budak tersebut kemudian masuk Islam: Pria itu dipisahkan dari budaknya, dan hutang dibebankan kepada tuannya yang beragama Kristen. Budak itu tidak boleh dijual sampai situasinya menjadi jelas. Jika pria Kristen itu meninggal dunia saat masih berhutang, hutang tersebut harus dibayar dari hasil pembebasan budak, kecuali jika ia memiliki kekayaan yang cukup untuk menutupi hutang tersebut, dalam hal ini budak tersebut dibebaskan. {cite:muwatta-maruf-1997 p.375}"
