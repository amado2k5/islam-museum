text: "… وربما ال جداً لضعف الكبد عن تمييز الدم عن المائية، أو ضعف العروق عن جذب الدم، أو لوجع ربما كان معه، أو لمرض آخر يقارنه، وقد يعرض أن يكون الشقّ السليم من الفالج مشتعلاً كله في نار، والآخر المفلوج بارداً …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 138، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والعروق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 138, that mentions illness and the sick, pain, named diseases, the organs of the body, the vessels; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 138 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، رگیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 138, que menciona la enfermedad y los enfermos, el dolor, las enfermedades con nombre, los órganos del cuerpo y los vasos sanguíneos; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 138, qui mentionne la maladie et les malades, la douleur, les maladies nommées, les organes du corps, les vaisseaux; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 138. sayfasından bir bölüm; hastalık, hasta, ağrı, hastalıkların isimleri, vücut organları ve damarlar konularını ele almaktadır; metin, makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 138, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, organ tubuh, dan pembuluh darah; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
