text: "… رقية المقرب شجة قرنية ملحة بحر قفط حد ثنا و كيع عن سفيان عن مغيرة عن القعقاع عن ابراهيم ابراهيم عن الاسود قال عرضتها على عائشةا فقال هذه مواثيق بد الشفاء بنت عوف بن عبد عوف اخت عبد الرحمن بن …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 137، يذكر الرقية، ومداواة الجراح، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 137, that mentions ruqya recited over the sick, the treatment of wounds, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 137 کا اقتباس جس میں رقیہ، زخموں کا علاج، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 1, pág. 137, que menciona la ruqya recitada sobre los enfermos, el tratamiento de heridas y la curación; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 1, p. 137, qui mentionne la ruqya récitée sur les malades, le traitement des plaies, la guérison; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın Al-Isti'ab adlı eserinin resimli 1. cildinin 137. sayfasından, büyü, yara tedavisi ve şifadan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 1, hlm. 137, yang menyebutkan mantra, pengobatan luka, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
