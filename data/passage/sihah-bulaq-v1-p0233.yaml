text: |-
  ١٠٨
  ⁦(باب الرا.)⁩
  ومنه جر مستغفرة أى نافرة ومستنفرة بفتح القاء أى مذعورة والنفر: لتحريك عدة رجال
  من ثلاثة الى عشرة والنقير. :-له وكذلك النفر والنقرة بالاسكان قال القراء نقرة الرجل
  ونفره أى رهطه قال امرؤالقيس يصف رجلا بجودة الرمى
  فهولا تنى رميته • ماله لاعدّ من نفره
  قد عاعليه وهو يمدحه وهذاة ولك لرجل يعجبك فعله ماله قاتله اللّٰه أخزاه اللّٰه وأنت
  تريد غير معنى الدعاء عليه ويقال يوم النفروليلة النفرلليوم الذى يتفرفيه الناس
  من منى وهو بعديوم القر وأنشد
  وهل يأثنى اللّه فى أن ذكرتها * وعللت أصحابى بهاليلة النفر
  ويروى ياغنى بضم الشاء ويقال له أيضايوم النفر بالتحريك ويوم ال.فور ويوم النفير
  عن يعقوب والمنافرة المحاكمة فى الحسب يقال نافره فنفره ينقره بالضم لاغير أى غلبه
  قال الاعشى يمدح عامر بن الطفيل ويحمل على علقمة بن علاثة
  قد قلت شعرى فضى فيكما * واعترف المنفور النسافر
  فالمنقور المغلوب والنافر الغالب ونقره عليه تنفيرا أى قضى له عليه بالغلبة وكذلك أنفره
  وقولهسم اقيته قبل كل صيح ونفر أى أوّلا وقد مر فى باب الحاء ونفرجلده أى ورم وفى
  الحديث تخلل رجسل بالقصب فنقرفه أى ورم قال أبو عبيداغماهو من نفار الشئمن الشئ
  وهو تجافيه عنّه وتساعده منه وقولهم ننرعنه أى لقبه اقبا كأنه عندهم تنقير للجن والعين
  عنه وقال اعرابى تلما ولدت قيل لابى نقرعنه فسمانى قنقذا وكتابى أبا العدّاء والنقريت
  اتباع للعفريت ونوكيد ( ن ر نقرالطا ئرالحيسة ينقرهانقرا التقطها ونقرت الشئ
  ثقيته بالمنقارونة رفى الناقور نفخ فى الصور ونقرت الرجل نقراعبته قالت امرأة لزوجها
  حربى على بنى نظرى ولا تمرّبى على بنات نقرى أى مرّبى على الرجال الذين ينظرون ولا ترّبى
  على النساء المواتى يعبن من مربهن وقسدنقرت بالفرس نقرا وهو صويت تزعجه به وذلات
  أن تلصق اسانك بحنكاث ثم تفتح وقول الشاعر أنا ابن ماوية اذجدّ النقر أراد النقر
  بانخيسل فل ا وقف نقل حركة الراء الى القاف اذا كان ساكناليعلم السامع أنها حركة الحرف
  فى الوصل كماتقول هذا بكروهررت ببكر ولا يكون ذلك فى النصب وان شئت لم تنقل ووقفت
  على السكون وان كان قبله ساكن والذة رصويت يسمع من قرع الابهام على الوسطى يقال
  ما أثابه ذقرة أى شيئا لا يستعمل الافى النفى قال الشاعر
  وهن حرى أن لا يثينك نقسرة * وأنت حرى بالذارحين تثيت
  والناقر السهم اذا أصاب الهدف واذالم يصب فليس بشاقر وقواهم دعوتهم الذقرى أى
  دعوة خاصة وهو أن يدعو بعضادون بعض وهو الانتقاراً يضا قال طرفة بن العبد
  نحن فى المشتاة ندء والحفلى • لاترى الآدب مناينتر
  ويقال أصله من نقر الطيراذ القط من ههنا وههنا والنقرة السبيكة والنقرة حفرة صغيرة
  فى الارض ومنه نقرة القفا والنقير النقرة التى فى ظهر النواة ومنه قول ابيد يرثى أخاهار بد
  فليس الناس بعدك فى نقير * ولاهم غيراصداءوهام
