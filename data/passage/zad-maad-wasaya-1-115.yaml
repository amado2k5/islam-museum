text: "… أشياء منكرة. وقال النسائي: ضعيف، وقال ابن عدي: لا يساوي شيئاً. وقال أبن حبان: كان يروي المناكير عن المشاهير، ويخالف الثقات، لا يجوز الاحتجاجُ به. وقال الدارقطني : مضطرب الحديث، تركه يحيى القطان. وأما حديث حُميد بن صخر، عن المقبري، …"
summary:
