ref: "7491"
label:
  ar: "البخاري 7491 — يؤذيني ابن آدم يسب الدهر وأنا الدهر"
  en: "Bukhari 7491 — The son of Adam wrongs Me by cursing time, and I am time"
  ur: "بخاری 7491 — ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں"
  es: "Bukhari 7491 — El hijo de Adán me ofende maldiciendo al tiempo, y yo soy el tiempo."
  fr: "Bukhari 7491 — Le fils d'Adam M'offense en maudissant le temps, et Je suis le temps"
  tr: "Buhari 7491 — Âdemoğlu, zamanı lanetleyerek Beni gücendiriyor; oysa Ben Zamanım."
  id: "Al-Bukhari 7491 — Anak Adam menyinggung-Ku dengan mengutuk waktu, dan Akulah Waktu."
text: "قال الله تعالى يؤذيني ابن آدم، يسب الدهر وأنا الدهر، بيدي الأمر، أقلب الليل والنهار ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7491: يؤذيني ابن آدم يسب الدهر وأنا الدهر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7491: The son of Adam wrongs Me by cursing time, and I am time. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7491: ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7491: El hijo de Adán me ofende maldiciendo al tiempo, y yo soy el tiempo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih al-Bukhari, n° 7491: « Le fils d’Adam M’offense en maudissant le temps, alors que Je suis le temps. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble les narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 7491: “Anak Adam menyinggung-Ku dengan mengutuk waktu, dan Akulah Waktu.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
