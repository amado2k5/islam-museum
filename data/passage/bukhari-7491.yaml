label:
  ar: "البخاري 7491 — يؤذيني ابن آدم يسب الدهر وأنا الدهر"
  en: "Bukhari 7491 — The son of Adam wrongs Me by cursing time, and I am time"
  ur: "بخاری 7491 — ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں"
text: "قال الله تعالى يؤذيني ابن آدم، يسب الدهر وأنا الدهر، بيدي الأمر، أقلب الليل والنهار ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7491: يؤذيني ابن آدم يسب الدهر وأنا الدهر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7491: The son of Adam wrongs Me by cursing time, and I am time. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7491: ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
