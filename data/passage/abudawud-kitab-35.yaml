summary:
  ar: "القسم 35 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الترجل»، ويضم فيها النصوص من 4159 إلى 4213 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 35 of Sunan Abi Dawud (Combing the Hair (Kitab Al-Tarajjul)) in the division of the open hadith dataset the museum took its reports from: reports 4159 to 4213 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 35، عنوان «کتاب الترجل»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4159 تا 4213۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 35 de Sunan Abi Dawud (El peinado (Kitab Al-Tarajjul)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4159 al 4213 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 35 du Sunan Abi Dawud (Le peignage des cheveux (Kitab Al-Tarajjul)) fait partie de la base de données de hadiths ouverte d'où proviennent les récits du musée: il s'agit des récits 4159 à 4213 de cette base de données. Le musée classe ses archives relatives à ces récits sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 35. bölümü \"Attan İniş Kitabı\" başlığını taşımakta olup, 4159'dan 4213'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 35 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Turun dari Kendaraan\" dan berisi teks 4159 hingga 4213, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
