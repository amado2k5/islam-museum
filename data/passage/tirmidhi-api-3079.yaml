label: { ar: "جامع الترمذي 3079 — الأب والأبوة", en: "Jami' al-Tirmidhi 3079 — the father and fatherhood", ur: "جامع ترمذی 3079 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3079 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ عَاصِمِ بْنِ بَهْدَلَةَ، عَنْ مُصْعَبِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، قَالَ لَمَّا كَانَ يَوْمُ بَدْرٍ جِئْتُ بِسَيْفٍ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّ اللَّهَ قَدْ شَفَى صَدْرِي مِنَ الْمُشْرِكِينَ أَوْ نَحْوَ هَذَا هَبْ لِي هَذَا السَّيْفَ. فَقَالَ \" هَذَا لَيْسَ لِي وَلاَ لَكَ \". فَقُلْتُ عَسَى أَنْ يُعْطَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3079، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3079 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3079، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3079 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
