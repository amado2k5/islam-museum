text: "… وقع فعامة البغداديين يأخذون فيه بالاظهار وبذلك كان يأخذ ابن مجاهد ويعتل بقلّة حروف الكلمة وكان غيره يأخذ بالادغام وبه قرأت وقد اجمعوا على ادخام لك كيدا، فى يوسف س آ وهو اقل حروفا من ءال لانه على حرفين فدلّ …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 39، يذكر الأحرف السبعة، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 39, that mentions the seven ahruf, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 39 کا اقتباس جس میں سبعہ احرف، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Taysir fi al-Qira'at al-Sab' de al-Dani, volumen 1, pág. 39, que menciona a los siete ahruf, los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Taysir fi al-Qira'at al-Sab' d'al-Dani, volume 1, page 39, mentionne les sept ahruf, les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'a\" (Yedi Okunuşun Kolaylaştırılması) adlı eserinin 1. cildinin 39. sayfasından, yedi harf ve okuyuculardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an Okunuşları, Yazı, Kaligrafi ve Diyakritik İşaretler Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Jilid 1, halaman 39, yang menyebutkan tujuh huruf dan para pembacanya; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Peramban Bacaan Al-Qur'an, Tulisan, Kaligrafi, dan Tanda Diakritik."
