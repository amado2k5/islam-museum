text: |-
  المياب فى أول طيها-ق يكسر
  على طيها اه مرتضى
  للس لم هو السنط الذى عمرنه القرظ
  إه
  والشانى متحركه اه
  ضرب من بروداليمن ومنه قيل للسحاب كاللطخ عصب والعصاب الغزال عن أبى عمروقال رؤبة
  طى القسامى برود العصاب ١ العصب العمامة وكل ما بعصب به الرأس وقداعتصب
  بالتاج والعمامة والعصابة الجاعة من الناس والخيل والطير واعصوصب القوم اجتمعوا
  وصارواعسائب واعصوصب اليوم أى اشتد ويوم عصيب وعصبصب أى شديد والعصيب
  الرئة تعصب بالامعاء نتشوى قال حيد بن تور
  أوليت لم يدرين ماسمك القرى * ولاعصب فيهارتات العمارس
  وعصبت فخذ الناقة لتدرّ وناقة عصوب لاتدرّ حتى تعصب واسم الحبل الذى تعصب به عصاب
  وعصبت الشجرة اذا ضممت أغصانها ثم ضر بتها ليسقط ورقها قال الحجاج لاعصينكم عصب
  السلم وقال أبو عبيد السلمة شجرة اذا أراد واقطعها عصبوا أغصانها عصباشديداحتى يه لوا
  الى أصلها فقطعوها وعصب القوم بفلان آى استكفواحوله وعصت الابل بالماءاذا
  دارت به وقال الفرّاء عصيت الابل وعصبت بالكسراذا اجتمعت وعصب الريق بفسه اذا
  يبس عليه قال ابن أحر
  يصلى على من مات مناءر يفنا * ويرأحتى يعصب الريق بالفم
  وعصب الريق فاهايضا وقال
  يعصب فاه الريق أى عصب * عصب الجباب بنفاه الوطب
  وعصب الافق اجروعصبت الكبش عصبا اذا شددت خصيمه حتى يسقطامن غير أن تنزعهم
  والعصب فى العروض تسكين اللام من مفاعلتن وينقل الى مفاعيلن والعصلبى من الرجال
  الشديد بزيادة اللام قال الراجز قدلفها اللبسل بعصلبىّ (عضب عضبه عضاأى
  قطعه والعضب السيف القاطع وعضبت الرجل بلسانى اذاشتمته ورجل عضاب أى شتام
  وعضب لسانه بالضم عضوية صار عضيا أى حديدافى الكلام أبوز يدالعضباء الشاة
  المكسورة القرن الداخل وهو المشاش ويقال هى التى انكسر أحد قرنيها وقد عضبت
  بالكسمروأعضبتها أنا وكبس أعضب بين العضب قال الاخطل
  انّ السيوف غدوّها ورواحها * تركت هوازن مثل قرن الاعض
  والاعضب من الرجال الذى لاناصر له والمعضوب الضعيف تقول منه عضبه وناقة عضباء أى
  مشقوقة الاذن وكذلك الشاة وأماناقة رسول اللّٰه صلى اللّٰه عليه وسلم انتى كانت تسمى العضباء
  فاما كان ذلك لقب لها ولم تكن مشقوقة الاذن والاعضب فى الوافر مفتعلن مخروما من
  مفاعلتن عطب العطب الهلاك وقد عطب بالكسر وأعطبه أهلكد والمعاطب المهالك
  واحدها معطب والعطب والعطب القطن مثل عسر وعسر ٢ قال الشاعر
  كأنه فى ذرى عمايهم * موضع من منادف العطب
  حلبة الامة من يقمال أجدر ج عابة أي انا اللة ألالكاف هوامثاب والنلاب
  والعنظوب والاتى عنظوبة والجمع عناظب قال الشاعر رؤس العناظب كالعنجد
  وفى كتاب سيبويه العنظباء بالضيم والمدّوعنظبة موضع قال لبيد
