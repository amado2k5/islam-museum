summary:
  ar: "فتوى لمالك في باب افتتاح الصلاة: سُئل عن رجل دخل مع الإمام فنسي تكبيرة الافتتاح وتكبيرة الركوع حتى صلى ركعة ثم ذكر وكبّر في الثانية، فقال: أن يبتدئ صلاته أحب إليه؛ ولو سها عن تكبيرة الافتتاح وكبّر في الركوع الأول رأى ذلك مجزئاً عنه إذا نوى بها تكبيرة الافتتاح. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.127}"
