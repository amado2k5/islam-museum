label: { ar: "الموطأ 204 — مالك فيمن نسي تكبيرة الافتتاح والركوع مع الإمام", en: "Muwatta 204", es: "Muwatta 204", fr: "Muwatta 204", ur: "موطا 204", tr: "Al-Muwatta 204 — Malik, açılış tekbirini unutan ve imamla birlikte eğilmeyi unutan kişi hakkında", id: "Al-Muwatta 204 — Malik tentang orang yang lupa takbir pembuka dan rukuk bersama imam" }
summary:
  ar: "فتوى لمالك في باب افتتاح الصلاة: سُئل عن رجل دخل مع الإمام فنسي تكبيرة الافتتاح وتكبيرة الركوع حتى صلى ركعة ثم ذكر وكبّر في الثانية، فقال: أن يبتدئ صلاته أحب إليه؛ ولو سها عن تكبيرة الافتتاح وكبّر في الركوع الأول رأى ذلك مجزئاً عنه إذا نوى بها تكبيرة الافتتاح. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.127}"
  tr: "Malik'in namazın başlangıcıyla ilgili bir fetvası: İmamla namaza katılan, ancak ilk tekbiri ve rükû tekbirini unutan bir adamdan bahsedilmişti. Adam bir rekat namaz kıldıktan sonra hatırladı ve ikinci rekatta tekbiri getirdi. Malik şöyle buyurdu: Namazına yeniden başlaması daha iyidir. Ancak ilk tekbiri unutup ilk rükûda getirmişse, eğer bunu ilk tekbir olarak kastetmişse, bu yeterlidir. Araştırmacı, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.127}"
  id: "Fatwa Malik mengenai permulaan salat: Beliau ditanya tentang seorang pria yang bergabung dengan imam tetapi lupa takbir pembuka dan takbir rukuk hingga ia telah salat satu rakaat. Kemudian ia ingat dan mengucapkan takbir pada rakaat kedua. Malik berkata: Lebih baik baginya untuk memulai salatnya dari awal. Namun, jika ia lupa takbir pembuka dan mengucapkannya pada rukuk pertama, itu sudah cukup jika ia bermaksud menjadikannya takbir pembuka. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan ini dari Malik. {cite:muwatta-maruf-1997 p.127}"
