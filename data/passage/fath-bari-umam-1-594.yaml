text: "… كما سأذكره، فأخرج أبو نعيم في الدلائل من وجه ضعيف عن ابن عباس قال: اجتمع المشركون إلى رسول اللّٰه وَلِيمي منهم الوليد بن المغيرة وأبو جهل بن هشام والعاص بن وائل والأسود بن المطلب والنضر بن الحارث ونظراؤهم، فقالوا للنبي …"
