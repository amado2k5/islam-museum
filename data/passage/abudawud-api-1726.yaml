label: { ar: "سنن أبي داود 1726 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 1726 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 1726 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 1726 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 1726 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 1726 — Neler caizdir, neler caiz değildir", id: "Sunan Abi Dawud 1726 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، وَهَنَّادٌ، أَنَّ أَبَا مُعَاوِيَةَ، وَوَكِيعًا، حَدَّثَاهُمْ عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي سَعِيدٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يَحِلُّ لاِمْرَأَةٍ تُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ أَنْ تُسَافِرَ سَفَرًا فَوْقَ ثَلاَثَةِ أَيَّامٍ فَصَاعِدًا إِلاَّ وَمَعَهَا أَبُوهَا أَوْ أَخُوهَا أَوْ زَوْجُهَا أَوِ ابْنُهَا أَوْ ذُو مَحْرَمٍ مِنْهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1726، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1726 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1726، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1726 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 1726 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sünen Ebu Davud'da yer alan 1726 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri içermektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1726, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
