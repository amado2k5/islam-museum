label: { ar: "مسلم 8 — حديث جبريل: الإسلام والإيمان والإحسان", en: "Muslim 8 — The Jibril hadith: Islam, iman, ihsan" }
text: "كان رسول الله يوما بارزا للناس فأتاه رجل فقال: يا رسول الله، ما الإيمان؟... ثم أدبر الرجل، فقال رسول الله: «ردوا علي الرجل»، فأخذوا ليردوه فلم يروا شيئا، فقال رسول الله: «هذا جبريل جاء ليعلم الناس دينهم»"
summary:
  ar: "أول كتاب الإيمان في صحيح مسلم؛ أتى جبريل في صورة رجل شديد بياض الثياب شديد سواد الشعر، فسأل النبي عن الإسلام والإيمان والإحسان والساعة، وعرّف بأن الإحسان «أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك». جاء برواية عمر داخل حديث القَدَر (مسلم 1) وبرواية أبي هريرة مستقلة."
