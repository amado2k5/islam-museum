label: { ar: "مسلم 8 — حديث جبريل: الإسلام والإيمان والإحسان", en: "Muslim 8 — The Jibril hadith: Islam, iman, ihsan", es: "Muslim 8 — El hadiz de Jibril: Islam, iman, ihsan", fr: "Musulman 8 — Le hadith de Jibril: Islam, iman, ihsan", ur: "مسلم 8 - حدیث جبریل: اسلام، ایمان، احسان", tr: "Müslim 8 — Cebrail Hadisi: İslam, İman ve İhsan", id: "Muslim 8 — Hadits Jibril: Islam, Iman, dan Ihsan" }
text: "كان رسول الله يوما بارزا للناس فأتاه رجل فقال: يا رسول الله، ما الإيمان؟... ثم أدبر الرجل، فقال رسول الله: «ردوا علي الرجل»، فأخذوا ليردوه فلم يروا شيئا، فقال رسول الله: «هذا جبريل جاء ليعلم الناس دينهم»"
summary:
  ar: "أول كتاب الإيمان في صحيح مسلم؛ أتى جبريل في صورة رجل شديد بياض الثياب شديد سواد الشعر، فسأل النبي عن الإسلام والإيمان والإحسان والساعة، وعرّف بأن الإحسان «أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك». جاء برواية عمر داخل حديث القَدَر ⁦(مسلم 1)⁩ وبرواية أبي هريرة مستقلة."
  tr: "Sahih Müslim'deki İman Kitabı'nın ilk bölümünde, Cebrail'in bembeyaz giysiler ve simsiyah saçlarla bir adam suretinde göründüğü anlatılır. Peygamberimize İslam, iman, üstünlük (ihsan) ve Kıyamet Günü hakkında sorular sormuş ve üstünlüğün \"Allah'a sanki O'nu görüyormuş gibi ibadet etmek\" olduğunu, çünkü O'nu görmeseniz bile O'nun sizi gördüğünü açıklamıştır. Bu hadis, Ömer tarafından Kader Hadisi'nde (Müslim 1) ve ayrıca Ebu Hurayra tarafından bağımsız olarak rivayet edilmiştir."
  id: "Bab pertama Kitab Iman dalam Sahih Muslim menceritakan bahwa Jibril muncul dalam wujud seorang pria dengan pakaian yang sangat putih dan rambut yang sangat hitam. Ia bertanya kepada Nabi tentang Islam, iman, kebaikan (ihsan), dan Hari Kiamat, dan menjelaskan bahwa kebaikan adalah \"menyembah Allah seolah-olah kamu melihat-Nya, karena meskipun kamu tidak melihat-Nya, Dia pasti melihatmu.\" Hal ini diriwayatkan oleh Umar dalam Hadits Takdir (Muslim 1) dan juga oleh Abu Hurairah secara terpisah."
