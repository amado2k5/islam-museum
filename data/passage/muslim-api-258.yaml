label: { ar: "صحيح مسلم 258 — ما حُرّم", en: "Sahih Muslim 258 — what was made unlawful", ur: "صحیح مسلم 258 — جو حرام کیا گیا", es: "Sahih Muslim 258 — lo que se declaró ilícito", fr: "Sahih Muslim 258 — ce qui a été déclaré illicite", tr: "Sahih Muslim 258 — Haram Olan Şeyler", id: "Sahih Muslim 258 — Apa yang dilarang" }
text: "… نِدًّا وَهُوَ خَلَقَكَ \". قَالَ ثُمَّ أَىٌّ قَالَ \" أَنْ تَقْتُلَ وَلَدَكَ مَخَافَةَ أَنْ يَطْعَمَ مَعَكَ \". قَالَ ثُمَّ أَىٌّ قَالَ \" أَنْ تُزَانِيَ حَلِيلَةَ جَارِكَ \" فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ تَصْدِيقَهَا { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَلاَ يَزْنُونَ وَمَنْ يَفْعَلْ ذَلِكَ يَلْقَ أَثَامًا}"
summary:
  ar: "حديث في صحيح مسلم، رقم 258، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 258 (The Book of Faith), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 258، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 258 (El Libro de la Fe), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 258 (Le Livre de la Foi), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 258 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram rehberinin bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntıları bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 258, menyebutkan apa yang dilarang. Bagian dari panduan Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
