text: "… من قبرك منهتها.قال وسمعت يخي يقول: إن الدرهم مقرب: فان لم تحسن رقيته فلا تأخذه بيدك فانه إذلدغك قتلك. قال وسمعته. يقول : الدنيا سم اللّٰه القتال لعباده، تخذوا منها حسب ما يؤخذ السم فى الأدوية لملكم تسلمون. أخبرنا بن …"
