summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد وربيعة بن أبي عبد الرحمن أن القاسم بن محمد كان يقرأ خلف الإمام فيما لا يجهر فيه الإمام بالقراءة؛ وهو في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.138}"
