label: { ar: "الموطأ 226 — القاسم بن محمد يقرأ خلف الإمام فيما لا يجهر فيه", en: "Muwatta 226", es: "Muwatta 226", fr: "Muwatta 226", ur: "موطا 226", tr: "El-Muvatta 226 — İmamın sesli okumadığı namazlarda El-Kasım ibn Muhammed imamın arkasından okur.", id: "Al-Muwatta 226 — Al-Qasim ibn Muhammad membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras." }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد وربيعة بن أبي عبد الرحمن أن القاسم بن محمد كان يقرأ خلف الإمام فيما لا يجهر فيه الإمام بالقراءة؛ وهو في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.138}"
  tr: "Malik'in Yahya ibn Sa'id ve Rabi'ah ibn Abi 'Abd al-Rahman'dan rivayet ettiği bir hadiste, imamın sesli okumadığı namazlarda imamın arkasından okuduğu belirtilmiştir; bu, imamın sesli okumadığı namazlarda imamın arkasından okuma konusuna girmektedir. Editör, bunun Malik'ten Ebu Mus'ab ve Suwayd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.138}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id dan Rabi'ah ibn Abi 'Abd al-Rahman menyatakan bahwa al-Qasim ibn Muhammad biasa membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras; ini termasuk dalam bab tentang membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab dan Suwayd. {cite:muwatta-maruf-1997 p.138}"
