text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ، أَخْبَرَنَا مُحَمَّدُ بْنُ الصَّلْتِ، حَدَّثَنَا أَبُو كُدَيْنَةَ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ أَبِي الضُّحَى، عَنِ ابْنِ عَبَّاسٍ، قَالَ مَرَّ يَهُودِيٌّ بِالنَّبِيِّ فَقَالَ لَهُ النَّبِيُّ \" يَا يَهُودِيُّ حَدِّثْنَا \". فَقَالَ كَيْفَ تَقُولُ يَا أَبَا الْقَاسِمِ إِذَا وَضَعَ اللَّهُ السَّمَوَاتِ عَلَى ذِهْ وَالأَرَضِينَ عَلَى ذِهْ وَالْمَاءَ عَلَى ذِهْ وَالْجِبَالَ عَلَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3240، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3240 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3240، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3240 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
