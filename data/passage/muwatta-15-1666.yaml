label: { ar: "الموطأ 1666 — مالك: إن طلقها وهو مريض قبل الدخول فلها نصف الصداق والميراث ولا عدة، وإن دخل بها ثم طلقها فلها المهر كله والميراث، والبكر والثيب سواء", en: "Muwatta 1666", es: "Muwatta 1666", fr: "Muwatta 1666", ur: "موطا 1666", tr: "El-Muvatta 1666 — Malik: Eğer erkek hasta iken ve evlilik gerçekleşmeden önce boşanırsa, kadın mehirin ve mirasın yarısına hak kazanır ve bekleme süresi yoktur. Eğer erkek evliliği tamamladıktan sonra boşanırsa, kadın mehirin ve mirasın tamamına hak kazanır. Bakire ve daha önce evlenmiş olanlar aynı şekilde değerlendirilir." }
summary:
  ar: "يقول مالك وإن طلقها وهو مريض قبل أن يدخل بها، فلها نصف الصداق، ولها الميراث، ولا عدة عليها. وإن دخل بها ثم طلقها، فلها المهر كله والميراث. البكر والثيب في هذا عندنا سواء. {cite:muwatta-maruf-1997 p.84}"
  tr: "Malik, bir erkeğin evliliği tamamlamadan önce hasta iken karısından boşanması durumunda, kadının mehirin yarısına ve mirasına hak kazandığını ve bekleme süresi gerekmediğini söylüyor. Eğer evliliği tamamlayıp sonra boşanırsa, kadın mehirin tamamına ve mirasına hak kazanır. Bu bağlamda, bakire ve daha önce evlenmiş bir kadın aynı şekilde değerlendirilir. {cite:muwatta-maruf-1997 s.84}"
  id: "Malik mengatakan bahwa jika seorang pria menceraikan istrinya saat sakit sebelum melakukan hubungan suami istri, maka istrinya berhak atas setengah dari mahar dan warisannya, dan tidak ada masa tunggu yang diwajibkan baginya. Jika ia melakukan hubungan suami istri dan kemudian menceraikannya, maka istrinya berhak atas mahar penuh dan warisannya. Dalam hal ini, seorang perawan dan seorang wanita yang pernah menikah sebelumnya diperlakukan sama. {cite:muwatta-maruf-1997 p.84}"
