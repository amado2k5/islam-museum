summary:
  ar: "يقول مالك وإن طلقها وهو مريض قبل أن يدخل بها، فلها نصف الصداق، ولها الميراث، ولا عدة عليها. وإن دخل بها ثم طلقها، فلها المهر كله والميراث. البكر والثيب في هذا عندنا سواء. {cite:muwatta-maruf-1997 p.84}"
