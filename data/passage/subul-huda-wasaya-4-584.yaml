  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 4. cildinin 584. sayfasında, vasiyet veya son ahit, defin, mezar ve türbeden bahsedilmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
