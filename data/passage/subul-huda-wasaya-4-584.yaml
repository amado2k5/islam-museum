text: "… وستين سنة. وقال ابن الكلبى : أَربعمائة وثمانية وستين سنة. وله من الذكور عابر وهو وصيّه ومالك وقينان. وهو أول من نظر فى علم النجوم واستنبط ذلك من تنور صُفْر كان كُتب فيها عِلْمها قبل الطوفان ودفن فى الأَرض فاستخرجه …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 584، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
