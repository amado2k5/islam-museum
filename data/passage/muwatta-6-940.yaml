label: { ar: "الموطأ 940 — مالك: لا يرفع المحرم صوته بالإهلال في مساجد الجماعات، إلا في المسجد الحرام ومسجد منى فإنه يرفع صوته فيهما", en: "Muwatta 940", es: "Muwatta 940", fr: "Muwatta 940", ur: "موطا 940", tr: "El-Muvatta 940 — Malik: İhramlı hacı, cemaatle kılınan camilerde telbiye okurken sesini yükseltmemelidir; ancak Mescid-i Haram ve Mina Camii'nde sesini yükseltebilir.", id: "Al-Muwatta 940 — Malik: Jamaah haji yang sedang ihram tidak boleh meninggikan suaranya ketika membaca talbiyah di masjid-masjid berjamaah, kecuali di Masjidil Haram dan masjid Mina, di mana ia boleh meninggikan suaranya." }
text: "لا يرفع المحرم صوته بالإهلال في مساجد الجماعات، إلا في المسجد الحرام ومسجد منى فإنه يرفع صوته فيهما"
summary:
  ar: "قول لمالك: لا يرفع المحرم صوته بالإهلال في مساجد الجماعات ليُسمع نفسه ومن يليه، إلا في المسجد الحرام ومسجد منى فإنه يرفع صوته فيهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1073). {cite:muwatta-maruf-1997 p.450}"
  tr: "Malik şöyle demiştir: İhramlı bir hacı, cemaat camilerinde telbiye okurken, kendisi ve yanındakilerin duyabilmesi için sesini yükseltmemelidir; ancak Mescid-i Haram ve Mina camisinde sesini yükseltebilir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1073) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.450}"
  id: "Malik berkata: Seorang jamaah haji yang sedang ihram tidak boleh meninggikan suaranya ketika membaca talbiyah di masjid-masjid berjamaah agar dirinya dan orang-orang di sekitarnya dapat mendengar, kecuali di Masjidil Haram dan masjid di Mina, di mana ia boleh meninggikan suaranya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1073). {cite:muwatta-maruf-1997 p.450}"
