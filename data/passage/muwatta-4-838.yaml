label: { ar: "الموطأ 838 — ابن عمر: يصوم رمضان متتابعاً من أفطره من مرض أو في سفر", en: "Muwatta 838", es: "Muwatta 838", fr: "Muwatta 838", ur: "موطا 838", tr: "El-Muvatta 838 — İbn Ömer: Hastalık veya yolculuk nedeniyle orucunu bozan kimse, Ramazan ayında aralıksız oruç tutmalıdır.", id: "Al-Muwatta 838 — Ibn Umar: Barang siapa yang berbuka puasa karena sakit atau bepergian, maka wajib berpuasa Ramadan secara berturut-turut." }
text: "يصوم رمضان متتابعاً، من أفطره من مرض أو في سفر"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: يصوم رمضان متتابعاً من أفطره من مرض أو في سفر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (819) وسويد (469). {cite:muwatta-maruf-1997 p.408}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın şöyle dediğini aktarmıştır: \"Hastalık veya yolculuk nedeniyle Ramazan orucunu bozan kimse, orucunu ard arda tutmalıdır.\" Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (819) ve Suwaid (469) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.408}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: “Barangsiapa yang membatalkan puasa Ramadan karena sakit atau bepergian, maka ia harus berpuasa Ramadan secara berturut-turut.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (819) dan Suwaid (469). {cite:muwatta-maruf-1997 p.408}"
