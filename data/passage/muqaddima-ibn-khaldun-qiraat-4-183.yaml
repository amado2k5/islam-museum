text: "… كانوا محكمين لصناعة الخط و أن ما يتخيل من مخالفة خطوطهم لأصول الرسم ليس كما يتخيل بل لكلها وجه. يقولون في مثل زيادة الألف في لا أذبحنه: إنه تنبيه على الذبح لم يقع و في زيادة الياء في بأييد إنه …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 4، ص 183، يذكر الخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 4, p. 183, that mentions the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 4، ص 183 کا اقتباس جس میں خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 4, pág. 183, que menciona los alfabetos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de la Muqaddima d'Ibn Khaldoun (tome 4, p. 183) évoque les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Haldun'un Mukaddime'sinin 4. cildinin 183. sayfasından, yazı ve alfabeler üzerine bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Muqaddimah karya Ibn Khaldun, Volume 4, halaman 183, yang membahas tentang aksara dan tulisan; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
