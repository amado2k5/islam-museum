text: "ثم أنزل عليكم الآيات أخرج ابن راهويه عن الزبير قال لقد رأيتني يوم أحد حين اشتد علينا الخوف وأرسل علينا النوم فما منا أحد إلا ذقنه في صدره فوالله إني لأسمع كالحلم قول معتب بن قشير لو كان لنا من الأمر شما قتلنا ههنا فحفظتها"
