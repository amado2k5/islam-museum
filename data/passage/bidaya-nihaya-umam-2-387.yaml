text: "… هشام بن محمد بن السائب الكابى كان بخت نصر أصفهبذا لا بين الاهواز الى الروم الملك على الفرس وهو لمراسب وكان قد بنى مدينة بلخ التى تاقب بالحناء وقاتل الترك والجأم الى أضيق الاماكن وبعث بخت نعر لقتال بنى إسرائيل …"
