summary:
  ar: "القسم 43 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأدب عن رسول الله»، ويضم فيها النصوص من 2736 إلى 2858 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 43 of Jami' al-Tirmidhi (Chapters on Manners) in the division of the open hadith dataset the museum took its reports from: reports 2736 to 2858 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 43، عنوان «کتاب الادب عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2736 تا 2858۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 43 de Jami' al-Tirmidhi (Capítulos sobre buenos modales) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2736 al 2858, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
