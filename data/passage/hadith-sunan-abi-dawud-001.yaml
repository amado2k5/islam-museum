text: "رادة للتخفيف واختصارا للكلام، وكذلك المعنى في تركه أن يكتب محمد رسول الله، واقتصاره على أن يكتب محمد بن عبد الله لأن انتسابه إلى أبيه عبد الله لا ينفي نبوته ولا يسقط رسالته، وفي إجابته إياهم إلى ذلك أن يرد"
