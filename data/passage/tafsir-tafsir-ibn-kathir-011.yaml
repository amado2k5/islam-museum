text: "بشير ونذير وٱلله على كل شيء قدير ( يقول تعالى مخاطبا أهل الكتاب من اليهود والنصارى: إنه قد أرسل إليهم رسوله محمدا خاتم النبين، الذي لا نبي بعده ولا رسول، بل هو المعقب لجميعهم؛ ولهذا قال: (على فترة من الرسل)"
