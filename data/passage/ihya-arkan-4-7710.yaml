text: "… مما سواهما حديث لا يؤمن أحد كم حتى يكون االله ورسوله أحب إليه مما سواهما متفق عليه من حديث أنس بلفظ لا يجد أحد حلاوة الإيمان حتى أكون أحب إليه من أهلاه وماله وذكر بزيادة حديث لا يؤمن العبد حتى …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 7710، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 7710, that mentions the sweetness and completeness of faith, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 7710 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
