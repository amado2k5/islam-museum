text: "… أما جملك تمجب، تقول: عجبْتٌ من الشىء وأعجبنى الشيء، إذا كأن ذلك. مجبُ من مَكْرُوه أو تَحْبوب، وهو عند الناس معنى سَرِّنِي لاغير، وفي الحديث، وكلام العرب شواهدُ كثيرةٌ على هذا المنى منها فى الكامل فَلَأَعْجَبَى أنْ. أعجَبه بكاء أبيه، …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 442، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 442, whose wording mentions the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 442 کا اقتباس جس میں مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
