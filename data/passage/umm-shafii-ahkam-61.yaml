text: "… فأطعم مسكيناً عشرين ومائة مد فى أقل من ستين يوماً لم يجزه، وإن أطعمه إياه فى سنتين يوماً أجزأه، أما يدلك فرض اللّه عز ذكره بإطعام ستين مسكيناً على أن كل واحد منهم غير الآخر، وإنما أوجبه الله تعالى لستين …"
summary:
  ar: "مقطع من الأم للشافعي، ص 61، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 61, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 61 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Umm de al-Shafi'i, p. 61, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Umm de al-Shafi'i, p. 61, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
