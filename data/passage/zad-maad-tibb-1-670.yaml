text: "… عِباده إلى إدخالِ ما يُقِيمُ البدن من الطعام والشراب عِوَضَ ما تحلَّل منه، وأن يكون بقدر ذلك كان إسرافاً، وكلاهما مانع من الصحة جالب للمرض، أعني عدم الأكل والشرب، أو الإسراف فيه. فحفظ الصحة كله في هاتين الكلمتين الإلهتين، ولا …"
