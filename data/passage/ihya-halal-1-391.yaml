text: "… طوائف لهم طاعات ومعاص إلا أن معاصبهم أكثر، وهم يتوقعون المغفرة ويظنون أنهم تترجح كفة حسناتهم مع أن مافى كفة السيئات أكثر، وهذا غاية الجهل فترى الواحد يتصدق بدراهم معدودة من الحلال والحرام ويكون ما يتناول من أموال المسلمين والشبهات …"
summary:
