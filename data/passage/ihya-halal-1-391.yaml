  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 391, that mentions the lawful, the unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
