text: |-
  مادّة طئرسطت من ترجة وانقولى
  وهذا عجيب قاله نصر
  ٢٥٢
  ⁦(باب ازا٠)⁩
  أراد وتشقى الضياطرة بالرماح فقلبه ضفر الضرنسج الشعر وغيره عريضا والتضفير
  مثل ويقال انضفر الحبلان اذا التويامعا والضغيرة العقصة يقال ضفرت المرآعرها
  واهاضفرتان وضفران أيضا أى عقمصنان عن يعقوب ويقال للحقف من الرمل ضغيرة
  وكذلك المسناة وكنائة ضفرة أى عتلئة والضفرة بكسر الفاء الرمل المتعقد بعضه على
  بعض والجمع ضفر وتضافرواعلى الشى تعاونوا عليه والضفر السمى وقد ضفر يضفر
  ضفرا أى عدا والضفر أيضاحزام الزحل هر الضمر والضهر مثل العسر
  والعسر الهزال وخفة اللحم وقال
  قد بلوناه على علاتة • وعلى الشسورمنه والضهر
  وقد ضر الفرس بالفتح يضمر ضهورا وضمر بالضم لغة فيه وأضهرته أنا وضه رته تضمير افاضطمو
  هو واللؤاؤ المضطمر الذى فى وسطه بعض الانصمام والضمر الرجل الهضيم البطن اللطيف
  الجسم وناقة ضامر وضاعرة وتضير الفرس أيضا أن تعلفه حتى يسمن ثم ترده الى القوت
  وذلك فى أربعين يوما وهذه المدة تسمى المضمار والموضع الذى تضمرفيه الخيل أيضا
  مضمار وأضمرت فى نفسى شيئًا والاسم الضمير والجمع الضحائر والمضهر الموضع والمفعول
  وقال الاحوص ستبقى لها فى مضمر القلب والحشا • سريرة وديوم تبلى السرار
  والضهار ما لايرجى من الدين والوعد وكل مالاتسكون منه على ثقة قال الراعى
  وانضاء أنن الى سعيد * طروقائم عمان اسشكارا
  حدن مزاره فأصين منه • عطالم يكن عدة ضهارا
  وينوضرة من كفانة رحطعمروبن أمية الضمرى وضهير مصغر جبل بالشام
  والضومر ان ضرب من الرياحين قال الشاءر
  أحب الكواثن والضومران * وشرب العيقة بالسفيلاط
  والضعران نيت قال الراجز
  نحن متعنا منيت الحلى * ومنيت الضمران والنصى
  وضهران بالضم الذى فى شعر النابغة اسم كاب أى فى قوله
  وكان ضهران منه حيث يوزعه • طعن الما رق عند المحجر النجد
  أى يغري ور) ضاره إضوره ويضيره ضورا وضيرا أى ضرء قال الكسائى
  سمعت بعضهم يقال لا يتفعنى ذلك ولا يضورنى والتضوّر الصباح والتاوى عدد الضرب
  أو الجوع والضورة بالضم الرجل الحقير الصغير السأن
  صل الطاء ئر لطفرة الهأة والماء الفليظ قال الراجز
  أنتك عيس تحمل المشيا * ماء من العثرة أحوذيا
  والطئرة خنورة اللين التى تعلور أسه يقال خذطرة سقائك والطائر اللين الحائر وقد طثر الهمرّ
  وطنر تطئرا والطئرة سعة العش يقال انهم لذوطئرة وطئر بطن من الازد ويزيدبن الطثرية
  الشاعر قشيرى وأمه طئرية والطيئار البعوض والاسد حر حرت العين قذاها تطحر
  طهرارمت به فهى طهور وكذلك طحرت عيز الماء العرمض قال زهير
  عقلة
