text: "… زُهرَةَ، وعُتْبَةُ بن غَزْوَانَ بن جابر المازنيّ حليفُ بني نَوْفَلِ بن عبد مناف، وكانا مُسْلِمَيْنِ، ولكنهما خرجا ليتوصَلاً بالكُفَّار، وكان على القومِ عِكْرِمَةُ بِن أبي جَهْلٍ. قال ابن هشام: حدَّثني ابن أبي عمرو بن العَلاَءِ، عن أبي عمرو المدنيّ: أنه …"
