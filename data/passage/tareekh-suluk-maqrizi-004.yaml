text: "لراهب الفيلسوف اليونانى، ومعه قسيس وأسقف، بحرمانه من دينه؛ وكتب له كتابا أغلظ فيه . وكتب [السلطان] أيضا إلى الملك بركه [ كتابا]، وسيره إلى الأمير فارس الدين أقوش المسعودى المتوجه بالهدية إلى الملك بركه . فلما وصلوا إلى الأشكرى"
