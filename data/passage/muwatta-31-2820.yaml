label: { ar: "الموطأ 2820 — زيد بن أسلم: رجلان من المشرق خطبا فقال النبي إن من البيان لسحرا", en: "Muwatta 2820", es: "Muwatta 2820", fr: "Muwatta 2820", ur: "موطا 2820", tr: "El-Muvatta 2820 — Zeyd ibn Aslam: Doğudan iki adam konuşma yaptı ve Peygamber şöyle buyurdu: \"Şüphesiz, bazı hitabet yetenekleri sihir gibidir.\"", id: "Al-Muwatta 2820 — Zayd ibn Aslam: Dua orang dari Timur berpidato, dan Nabi bersabda, “Sesungguhnya sebagian dari kefasihan itu seperti sihir.”" }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلين قدما من المشرق فخطبا، فعجب الناس لبيانهما، فقال رسول الله: إن من البيان لسحرا، أو: إن بعض البيان لسحر. ويذكر المحقق أن بعض النسخ زادت «عن عبد الله بن عمر» بعد اسم زيد، وأنها خطأ بالنسبة لرواية يحيى، وأن ابن عبد البر رأى الصواب وصله عن ابن عمر، لأن جماعة من أصحاب مالك رووه كذلك. {cite:muwatta-maruf-1997 p.583} {cite:muwatta-maruf-1997 p.584}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, doğudan iki adamın geldiğini ve vaaz verdiklerini, insanların onların hitabet yeteneklerine hayran kaldığını anlatır. Allah Resulü şöyle buyurmuştur: \"Şüphesiz bazı hitabet yetenekleri sihir gibidir.\" Editör, bazı rivayetlerde Zeyd'in adından sonra \"Abdullah ibn Ömer'den rivayetle\" ibaresinin eklendiğini ve bunun Yahya'nın rivayetine göre bir hata olduğunu belirtmektedir. İbn Abdül-Barr, İbn Ömer'den gelen rivayet zincirini doğru kabul etmiştir, çünkü Malik'in arkadaşlarından bir grup bu şekilde rivayet etmiştir. {cite:muwatta-maruf-1997 s.583} {cite:muwatta-maruf-1997 s.584}"
  id: "Malik meriwayatkan dari Zaid bin Aslam bahwa dua orang datang dari Timur dan menyampaikan khutbah, dan orang-orang takjub dengan kefasihan mereka. Rasulullah SAW bersabda: “Sesungguhnya sebagian kefasihan itu seperti sihir,” atau: “Sesungguhnya sebagian kefasihan itu seperti sihir.” Editor mencatat bahwa beberapa versi menambahkan “dari Abdullah bin Umar” setelah nama Zaid, dan ini adalah kesalahan dalam kaitannya dengan riwayat Yahya. Ibnu Abd al-Barr menganggap sanad dari Ibnu Umar sebagai yang benar, karena sekelompok sahabat Malik meriwayatkannya demikian. {cite:muwatta-maruf-1997 p.583} {cite:muwatta-maruf-1997 p.584}"
