label: { ar: "الموطأ 2820 — زيد بن أسلم: رجلان من المشرق خطبا فقال النبي إن من البيان لسحرا", en: "Muwatta 2820" }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلين قدما من المشرق فخطبا، فعجب الناس لبيانهما، فقال رسول الله: إن من البيان لسحرا، أو: إن بعض البيان لسحر. ويذكر المحقق أن بعض النسخ زادت «عن عبد الله بن عمر» بعد اسم زيد، وأنها خطأ بالنسبة لرواية يحيى، وأن ابن عبد البر رأى الصواب وصله عن ابن عمر، لأن جماعة من أصحاب مالك رووه كذلك. {cite:muwatta-maruf-1997 p.583} {cite:muwatta-maruf-1997 p.584}"
