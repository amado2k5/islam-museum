text: |-
  (١ ا لحرب تقيض السلم ولشهوته
  يعذون به القتال والذى حققه
  السهي-لى أن الحرب هو الترامى
  فالسهام ثم المطاعنة بالرماح ثم
  المجالدة بالسيوف ثم المعانقة
  والمصارعة اذاتزاحوا قاله شيخنا
  ١ه مرتضى وشيخه هو المحشى
  الفاسى
  (٢ ا لقائل هو الاغلب الغلى
  بهجوسجاح وصدره قد أبصرت
  سجاح من بعد العماه منتضى
  قوله أسقاك صوابه أسقيت
  والربابة بالكسر القيام على الشئ
  فإصلاحسه وتربيته اه مي نضى
  ٤٢
  قال الخليل تصغيرهاح يب بلاهاء رواية عن العرب قال المازنى لانه فى الاصل مصدر
  وقال المبرد الحرب قد تذكر وأنشد ⁦(١)⁩
  وهواذا الحرب هفاعقابه * هر جم حرب تلتظى حرابه
  وأناحرب ان حاربنى أى عدوّ وتحاربوا واحتر بوا وحاربوا بمعنى ورحل محرب بكسر الميم
  أى صاحب حروب وقوم محرية والحربة واحدة الحراب وحرب الرجل بالكسر اشتد
  غضبه ورجل حرب وأسدرب والتحريب التحريش وحرّيَته أى أغضته وحرّيت السنان
  أى حددته مثل ذربته قال الشاعر
  سيصبح فى سرح الرباب ورامها • اذا فزعت ألفاسنان محرّب
  وحريبة الجل ماله الذى بعيش به تقول حربه يحربه حربامثل طلبه بطلبه طلبا اذا أخذماله
  وتركد بلاشئ وقد حرب ماله أى سلبه فهو محروب وحريب وأحر بته أى دللته على ما يغنمه
  من عدو قال الفرّاء المحاريب صدور المجالس ومنه سمى محراب المسجد والمحراب الغرفة
  قال وضاح اليمن
  ربة محراب اذاجئتها • لم ألقها أو أرتق سلما
  ومنه محاريب غمدان باليمن وقوله تعالى فجرج على قومه من الحراب قالوا من المسجد
  ومحارب قبيلة من فهر والحوباء أكبر من العظاءة شيئا يستقبل الشمس ويدور معها
  كيف دارت ويتلون ألوانا بحسرّ الشمس وهوذ كرأمّ حبين والجمع الحواتي والانثى حرباءة
  ويقال برباء تنضب كايقال ذئب غضى قال أبو دواد)
  أنى أنيح لدحرباء تنضبة • لا يرسل الاق الاعمكلساقا
  وأرض محر بنة ذات حرباء والحرباء أيضا مسامير الدروع قال لبيد
  أحكم الجنى من عوراتها * كل حرباء اذا أ كره صل
  وحرابى المتن لماته واحرتى از بأر واليا للالحاق بافعذلل ⁦( زب)⁩ حزب الرجل أصابه
  والحزب الورد وقد حزبت القرآن والحزب الطائفة وتحز بواتجمعوا والاحزاب الطوائف
  التى تجتمع على محارية الانبيا عليهم السلام والحزابى الغليظ القصير يقال رجل حزاب
  وحزابية أيضا اذاكان غليظا الى القصر والياء للالحاق كالفهامية والعلانية من
  القهم والعان قال أمية بن أبى عائذ الهذلى
  كأنى ورحلى اذا رعتها * على جزى جازئ بالرمال
  وأصحم حام جراميزه * حزابية حيدى بالدحال
  والحزباء الارض الغليظة والحزباءة أخص منه والجمع الحزابي وأصل مشدّد كاقلنا فى
  الصحارى والحنزاب جزر البر والقسط جزر البحر والحنزاب أيضامثل الحزابي وهوالغليظ
  القصيروقال ٢ تاح لها بعدك حنزاب وزا الوزا الشديدوحز به أمر أى أصابه
  والحيزبون العجوز ( سب حيته أحبه بالضم حباوحابإوحسباناوحساية
  اذا عددته وأنشد ابن الاعرابى
  يا جل أسقال بلاحابه * سقيامليك حسن الربايه * قتلتى بالدل والخلابة
  أى بلاحساب ولاهنداز ويجوزفى حسن الرفع والنصب والجروالمعدود محسوب وحسب
  ايضا
