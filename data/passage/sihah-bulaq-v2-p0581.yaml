text: |-
  وصبغت الثوب أصبغه وأصبغه صبغا وثياب. صبغة شقد للكثرة وصبيغ اسم رجل وصبغة
  اللٰه دينه ويقال أصله من صبغ النصارى أولادهم فى ماءلهم والاصبغمن الخيل الذى
  ايضت ناصيته أوا بيضت أطراف ذنبه والاصبغ من الطير الذى ابيض ذنبه والصبغا ء من
  الشاء التى ابيض طرف ذنبها وصبغت الرطبة مثل ذنبت ( دغ لصدغ مابين العين
  والاذن ويسمى أيضا الشعر المتدلى عليها صدغا ويقال صدغ معقرب قال الشاعر
  عاضها اللّه غلا ما بعدما • شابت الأعداغ والضرس نقد
  وربما قالوا السدغ بالسين قال قطرب محمد بن المستنيران قوما من بنى تيم يقمال لهم بلعنبر
  يقلبون السين صادا عند أر بعة أحرف عند الطاء والقاف والغين والحاء اذاكن بعد
  السين ولا سالى أثانية كانت أم ثالثة أم رابعة بعد أن تسكون بعدها يقولون مراط وصراط
  وبسطة وبصطة وسقل وصيقل وسرقت وصرقت ومسغية ومصفية ومسدغة ومصدغة وسخر
  لكم وصخرلسكم والسخب والصخب والمصدغة المخدة لانها توضع تحت الصدغ وربماقالوا
  مزدغة بالزاى وحكى أبو عبيد صدغت الرجل اذاحاديت بصدعك صدغه فى المشى والصداغ
  سعة فى الصدغ وقولهم فلان ما يصدغ غلة من ضعفه أى ما يقتل وصدغ الرجل بالضم يصدع
  مداغة أى ضعف فهو صديغ ويقال للولاصديغ الى أن يستكمل سبعة أيام قال الاصمعى
  ما صدغك عن هذا الامر أى ماصرفك وردّك وا تسع فلان بعيره فاصدغه أى ماثماه وذلك
  اذائد ⁦(صلغ)⁩ الصاوغ فى ذوات الاظلاف مشل الساوغ تقول صلغت البقرة والشاة
  فهى صالغ وكباش صلغ قال رؤّية* والحربشهباء الكباش الصلغ* صمغ) الصمغ
  واحد صموغ الاشجار وأنواءه كثيرة وأمّا الذى يقال ده الصغ العربي فصمغ الطلح
  والقطعة منه صحغة وفى المثل تركته على مثسل مقرف الصمغة وذلك اذ الم تتزلالة شسيالانها
  نقتلع من شجرتها حتى لاتبق عليها علقة وحبر مصنغ أى متخذمنه وهذا الحرف لا أدرى
  عمن سمعته والصامغان جانيا الفم واستصغت الصاب وذلا أن تشرط شجره ليخرج منه
  شئمىّ فينعقد كالسبر عن أب الغوث وغ ، صغت الشئ أصوغه صوغاورجل
  صانغ وصوّاغ وصباغ أيضافى اغة أهل الجاز وعمله الصياغة وصاغه اقه صيغة حس:
  أى خلقه وسهام صيغة أى من عمل رجل واحد وهو من الواوالا أنها انقلبت ياملكسر
  ماقبلها وهذاصوغ هذا اذا كان على قدره وهما صوغان أى سمان وربيماً مالوافلان بصوغ
  الكذب وهواستعارة وفى الحديث كذية كذبها الصوّاغون
  صل الفاد) ⁦( غغ)⁩ قال أبو صاعد الكلابى "ضغيفة من بقل ومن عشب اذا
  كانت الروضة ناضرة والضغيفة العجين الرقيق وأقنا عندفلان فى ضغيغ أى خصب
  والضغضفة لول الدرداء يقال ضغضغت العجوزاذالاكت شيأبين الحنكين ولاسنّ لها
  فدعًا ⁦(فرغ)⁩ فرغت من النغل أفرغ فروغا وفراعا وتفرغت لكذا واستفرغت
  مجهودى فى كذا أى بذلته وفرغ الما بالكسر يفرغ فراغامثل سمع سماعاأى انصب
  وأفرغته أنا و-لمقة مفرغة أى مصمتة الجوانب وأفرغت الدماء أرقتها وفرغته ته ريغا أى
  صت
