text: "… التي كانت بين رسول اللّٰه للي وبين كُفّار قريش. قال أبو سُفيان : فَوَجَدَنا رسولُ قيصرَ ببعض الشام، فانطلق بنا حتى قدِمنا إيليا، فأدخلنا عليه، فإذا هو جالس في مجلسه وعليه التّاج، وحوله عُظماء الروم، فقال لتُرْجُمَانه : سَلْهُم أيُّهُم …"
