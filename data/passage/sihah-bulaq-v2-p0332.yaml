text: |-
  ٢٥٥
  الاعرف المعنى وحذف الرادّذ كر الحاخة كما-ذفها السائل ويقال ما أصاب عنده هله
  ولا بلة أى شيأ وقد فسرناه فى بلة أبو عبيدة فى قوله تعالى هل أتى على الانسان حين من الدهر
  قال معناها قد أتى وهل قد تكون بعنى ما قالت ابنة الحمارس *هل هى الاحظة أوتطليق
  أى ما هى فلهذا أدخلت الا وقولهم هلا استعجال وحث بقال حبهلا الثريد ومعناه هلمّ الى
  الثريد فتحت ياؤه لاجتماع الساكنين وبنيت حى مع هل اسما واحد امثل خسة عشر وسمى
  به الفعل ويستوى فيه الواحدوالجمع والمؤنث واذا وقفت عليه قلت حيهلا والالف ابيان
  لحركة كالهاء فى قوله تعالى كتابيه وحسابيه لات الالف مر مخرج الهاء وفى الحديث اذا ذكر
  الصالحون فيهل بعمر بفتح اللام مثل خسة عشرومعناه عليك بعمر وادع عمر أى انه من أهل
  هذه الصفة ويجوز فخيهلا بالتنوين يجعسل نكرة واما فحيهلا بلاتنوين فانمايجوز فى الوقف
  فاماق الادراج فهى افة رديئة وأماقول لبيديذْ كرصاحباله كان أمره بالرحيل فى السفر
  يتمارى فى الذى قلت له * ولقد يسمع قولى حيهل
  فانماسكنه للقافية وقدية ولون حى من غير أن يولواهل سذلك قولهم فى الاذان جىّ على
  الصلاة حى على الفلاح واغاهودعاء الى الصلاة والفلاح قال ابن أحر
  أنشأت أسأله مابال رفتته * حىّ الحمول فان الركب قدذهبا .
  قال أنشأ يسأل غلامه كيف أخذ الركب و-كى سيبو يه عن أبى الخطاب انّ بعض العرب
  يقول حيهل الصلاة يصل بهل كما يصل بعلى فيقال حيهل الصلاة ومعناه انتوا الصلاة
  واقربوا من الصلاة وهاوا الى الصلاة وقد حيعل المؤذن كمايقال حواق وتعبشيم مركيامن
  كلتين قال الشاعر
  ألارب طيف منك بات معانقى • الى أن دعاداى الصباح فيعلا
  وقال اخر
  أقول لها ود مع العيز جار • ألم يحزنك حيعلة المنادى
  وربما ألحقوابه الكاف فقالوا -حلك كما قالوارويدك والكاف للخطاب فقط ولاموضع لهنا
  ص الاعراب لانهماليست باسم قال أبو عبيدة وسمسع أبومه-دية الاءرابترجلا يدعو
  بالفارسية رجلا يقول له زوذ فقال ما يقول قلنا بقول عجمل فقال ألاية ول حيهلك أى هلمّ
  وتعال وقول الشاعر• هيهاؤه وحيهل*فاتساجعلهاسما ولم يأمربه أحداء مل لهمل
  بالتسكلين مصدرقولات هملت عينه تهول وته-مل هملا وهملانا أى فاضت وانهمات مثله
  والهمل بالتحريك الابل التى ترعى بلاراع مثل النفش الاأنّ الففش لا يكون الاليلا والهمل
  يكون ليلاونها رايقال ابل همل وهاملة وهمال وهوامل وركتها هملا أى سدى اذا أرسلتها
  ترعى ايلاونهارابلاراع وفى المثل اختلط المرعىّ بالهمل والمرعى الذى لهراع والهمل أيضا
  الماء الذى لامانع له وأهملت الشئ خليت بينه وبين نفسه والمهمل من الكلام خلاف
  المستعمل ول هاله الشيءيه وله هو لا أى أفزعه ومكان مهيل أى مخرف قال رؤية
  مهيل أفياف لها فيوف * وكذلك مكان مهال قال الهذلىّ
  أجاز الينا على بعدة • مهاوى خرق مهاب مهال
  وهلته فاعتال أفزعته فف زع والتهويل التفزيع والتهاد يل ماهالك من شئ وهوّل القوم على
