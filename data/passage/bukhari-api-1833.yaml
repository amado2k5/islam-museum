label: { ar: "صحيح البخاري 1833 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 1833 — what was made lawful; what is not lawful", ur: "صحیح بخاری 1833 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 1833 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 1833 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih el-Buhari 1833 — Neler caizdir, neler caiz değildir", id: "Sahih al-Bukhari 1833 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… بْنُ الْمُثَنَّى، حَدَّثَنَا عَبْدُ الْوَهَّابِ، حَدَّثَنَا خَالِدٌ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ النَّبِيَّ قَالَ \" إِنَّ اللَّهَ حَرَّمَ مَكَّةَ، فَلَمْ تَحِلَّ لأَحَدٍ قَبْلِي، وَلاَ تَحِلُّ لأَحَدٍ بَعْدِي، وَإِنَّمَا أُحِلَّتْ لِي سَاعَةً مِنْ نَهَارٍ، لاَ يُخْتَلَى خَلاَهَا، وَلاَ يُعْضَدُ شَجَرُهَا، وَلاَ يُنَفَّرُ صَيْدُهَا، وَلاَ تُلْتَقَطُ لُقَطَتُهَا إِلاَّ لِمُعَرِّفٍ \". وَقَالَ الْعَبَّاسُ يَا رَسُولَ اللَّهِ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1833، يذكر ما أُحل، وما لا يحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1833 (Penalty of Hunting while on Pilgrimage), that mentions what was made lawful, what is not lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1833، جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1833 (Castigo de la caza durante la peregrinación), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1833 (La peine pour avoir chassé en pèlerinage), mentionne ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 1833 numaralı hadis, helal, haram ve haramdan bahsetmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1833, menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
