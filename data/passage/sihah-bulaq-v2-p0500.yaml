text: |-
  •⁦(فصل الراه)⁩•
  عبيد وربما قالوا ألق أرواقه اذا أقام بالمكان واطمأن به كا يقال ألتى عصاه وألقت السحابة
  أرواقها أى مطرها ووبلها والرواق ستريمددون السقف يقال بيت مروّق ومنه قول الاعشى
  * فطلت لديهم فى خباء مروق وربعا هالواروق الليسل اذا مدرواف ظلته وألقى أروقته
  وراقنى الشئء يروقنى أى أعجبنى ومنه قولهم غلمان روقة وجوارروقة أى حسان وهوجع
  رائق مثل فاره وفرهة وصاحب وصحبة وروق أيضامشل بازل وبزل ومنه قول
  الراجز
  قيل أو مغبوق * من لبن الدهم الروق
  والروق بالتحر يك أن تطول الثنايا العليا السفلى والرجل أروق قال لبيديصف أسهما
  رقيات علميهاناهض * تكلح الاروق منهم والايل
  وراق الشراب يروق روقا أى صفاوروقته أنا ترويقا والراووق المصفاة وربعاسموا الباطية
  راووقا واراقة الماءونحوه صبه هق . رهقه بالكسرير هقه رهقا أى غشيهمر
  قوله تعالى ولا يرهق وجوههم قترولاذلة وفى الحديث اذا صلى أحدكم الى الشى فليرهقه أى
  فليغشه ولا يبعد مثه ويقال أرهقه طغيانا أى أغشاه اياه ويقال أرهقنى فلان الما حتى رهقته
  أى حلنى انماحتى حلته له قال أبوزيد أرهقه عسرا أى كافه اباه يقال لا ترهقنى لا أرهقك اللّٰه
  أى لا تعسرنى لا أمسركاته قال الهذلى
  ولولا نحن أرهم صهيب • حسام الحدمذروباخشيبا
  والمرهق الذى أدول ليقتل قال الشاعر
  ومرهق سال امتاعا بأصدته • لم يستعن وحوامى الموت تغشاه
  وراهق الغلام فهو مراهق اذا قارب الاحتلام وأرهق الصلاة أى أخرها حتى يدنووقت
  وقال الكعيت دى أكفكم وفى أبياتم • ثفة الجاور والمناف الأخرها
  الاخرى قال الاصمعىّ يقال رجل فيه رهق أى غشيان للممارم من شرب الجرونجوه
  قال ابن أحر
  كالكوكب الازهر انشقت دجنته • فى الناس لارهق فيه ولا نخل
  رقوله تعالى فلايخاف بخسا ولار هقاأى ظلما وقال أبو عبيدة فى قوله تعالى فزادوهم رهقا آى
  سفها وطغيانا ويقال طلبت فلانا حتى رهقته رهقا أى حتى دنوت منه فربما أخذه وربما
  لم يأخذه ورهق شخوص فلان أى دنا وأزف وأفد ورجل مرهقاذا كان يظنّ به السوء وفى
  لحديث أنه صلى اللّه عليه وسلم صلى على امرأة ترهق أى قتهم وتؤبن بشر ويقال أيضارجل
  مى هق اذا كان يغشاه الناس وينزل به الضيفان قال زهيريمدح رجلا
  ومرهق النيران يحمد فى اللأواء غير ملعن القسدر
  وقال ابن هرمة خير الرجال المرهقون كما * خبرتلاع البسلاد أكاؤها
  قال أبو زيد يقال القوم رهاق مائة ورهاق مائة بكسر الراء وضمها أى زهاء مائة ومقدار.
  مائة حكاء عنه ابن السسكيت والريهقان الزعفران ⁦(ريق)⁩، الريق الرضاب والريقة
  أخص منه ويجمع على أرياق وقوله-م أتيته على ريق نفسى أى لم اطعم شيأ قال أبو عبيدة !
  قوله أكفكم فى بعض النسخ
  أكفهم وليجزر ام مصحعه
