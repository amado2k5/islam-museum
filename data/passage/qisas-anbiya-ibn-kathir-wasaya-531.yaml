text: "… مع قومه بالتيه وحانت وفاته أحب أن يتقرب إلى الأرض التي هاجر إليها، وحث قومه عليها، ولكن حال بينهم وبينها القدر، رمية بحجر. ولهذا قال سيد البشر، ورسول اللّٰه إلى أهل الوبر والمدر : فلو كنت ثم لأريتكم قبره عند …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 531، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 531, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 531 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
