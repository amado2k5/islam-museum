text: "… ثم قال رسول اللّٰه : يا معشر المسلمين. كُفُّوا السِّلاحِ، إلّا خُزاعة عن بنى بكر إلى صلاة العصر. فخَبّطوهمُ ساعةً، وهى الساعة التى أُحِلَّتْ لرسول اللّٰه أَن يُقتَل لم تَحِلَّ لأَحدٍ قبله ؛ وكان رسول اللّٰه نهى أ مِن خُزاعة …"
