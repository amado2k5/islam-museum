text: "… إِذَا لم يستتم قائماً، وكان إلى القعود أقرب؛ توفيقاً بين الحديثين؛ وَلأنَّ القيام فريضة والقعدة الأولى واجبة - فلا يترك الفرض؛ لمكان الواجب. وإنما عرفنا جواز الانتقال من القيام إلى سجدة التلاوة بالأثَرِ، لحاجة المصلي إلى الاقتداء بمن أطاع اللّٰه …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 709، يرد فيه ذكر الفريضة والفرائض، والفرض، ومن أطاع الله ورسوله، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 709, whose wording mentions the obligation (farida), the obligatory (fard), whoever obeys God and His Messenger, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 709 کا اقتباس جس میں فریضہ اور فرائض، فرض، جس نے اللہ اور اس کے رسول کی اطاعت کی، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 709, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), celui qui obéit à Dieu et à Son Messager, l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 709, cuyo texto menciona la obligación (farida), lo obligatorio (fard), quien obedece a Dios y a Su Mensajero, lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 709. sayfasından, farz amelleri, farz görevleri, Allah'a ve Resulüne itaat edenleri ve gerekli amelleri anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 709, yang menyebutkan amalan wajib, kewajiban, orang-orang yang taat kepada Allah dan Rasul-Nya, dan amalan yang diwajibkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
