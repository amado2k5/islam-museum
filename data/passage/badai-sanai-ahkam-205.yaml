text: "… عند الحدث مرتين، ولا سبيل إلى الثاني، لأن النجس غير معلوم بل هو موهوم، وإليه أشار في الحديث، حيث قال: فَإِنَّهُ لاَ يَدْرِي أيْنَ بَاتَتْ يَدُهُ وهذا إشارة إلى توهم النجاسة واحتمالها، فيناسبه الندب إلى الغسل واستحبابه لا الإيجاب؛ لأن …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 205، يرد فيه ذكر الوجوب، والمستحب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 205, whose wording mentions obligation (wujub), the recommended (mustahabb), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 205 کا اقتباس جس میں وجوب، مستحب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 205, dont le texte mentionne l'obligation (wujub), le recommandé (mustahabb), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 205, cuyo texto menciona la obligatoriedad (wujub), lo recomendado (mustahabb), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' al-Sana'i' adlı eserinin 205. sayfasından, farz, tavsiye edilen ve müstehap olan amellerden bahseden bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz, tavsiye edilen ve müstehap olan ameller, itaat amelleri, kınanacak ameller, yasak ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Bada'i' al-Sana'i' karya al-Kasani, halaman 205, yang menyebutkan amalan wajib, anjuran, dan yang diinginkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, anjuran, dan yang diinginkan, amalan ketaatan, amalan tercela, amalan haram, dan dosa-dosa kecil."
