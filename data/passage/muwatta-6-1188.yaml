label: { ar: "الموطأ 1188 — نافع عن ابن عمر: كان يصلي الظهر والعصر والمغرب والعشاء والصبح بمنى، ثم يغدو إلى عرفة إذا طلعت الشمس", en: "Muwatta 1188", es: "Muwatta 1188", fr: "Muwatta 1188", ur: "موطا 1188", tr: "El-Muvatta 1188 — İbn Ömer'den rivayet edildiğine göre Nafi': Öğle, ikindi, akşam, yatsı ve sabah namazlarını Mina'da kılardı, güneş doğunca da Arafat'a giderdi.", id: "Al-Muwatta 1188 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Beliau biasa melaksanakan salat Dzuhur, Asar, Maghrib, Isya, dan Subuh di Mina, kemudian beliau pergi ke Arafat ketika matahari terbit." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يصلي الظهر والعصر والمغرب والعشاء والصبح بمنى، ثم يغدو إذا طلعت الشمس إلى عرفة. {cite:muwatta-maruf-1997 p.535}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın öğle, ikindi, akşam, yatsı ve sabah namazlarını Mina'da kıldığını, güneş doğduktan sonra ise Arafat'a gittiğini anlatır. {cite:muwatta-maruf-1997 s.535}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa melaksanakan salat Dzuhur, Asar, Maghrib, Isya, dan Subuh di Mina, kemudian beliau pergi ke Arafat setelah matahari terbit. {cite:muwatta-maruf-1997 p.535}"
