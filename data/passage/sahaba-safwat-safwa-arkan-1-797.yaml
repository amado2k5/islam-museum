text: "… إلى الجنة لما وجدت للجنة لذة مع حبه، لأن حبه هو الغالب عليّ. عن محمد بن كثير المصيصي قال: قالت رقية العابدة - وكانت بالموصل -: حرام على قلب فيه رهبانية المخلوقين أن يذوق حلاوة الإيمان، شغلوا قلوبهم بالدنيا عن …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 797، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
