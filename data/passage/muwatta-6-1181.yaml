label: { ar: "الموطأ 1181 — مالك: يستحب في مثل هذا أن يهرق دما، لقول ابن عباس: من نسي من نسكه شيئا فليهرق دما", en: "Muwatta 1181", es: "Muwatta 1181", fr: "Muwatta 1181", ur: "موطا 1181", tr: "El-Muvatta 1181 — Malik: İbn Abbas'ın şu sözüne dayanarak, böyle bir durumda kurban kesilmesi tavsiye edilir: \"Kim ibadetlerinin bir kısmını unutursa, kurban kesmelidir.\"", id: "Al-Muwatta 1181 — Malik: Dianjurkan dalam kasus seperti itu untuk mempersembahkan kurban, berdasarkan pernyataan Ibnu Abbas: Barang siapa yang lupa sebagian dari ritualnya, hendaknya ia mempersembahkan kurban." }
summary:
  ar: "يقول مالك إنه يستحب في مثل هذا أن يهرق دما، ويستند إلى قول عبد الله بن عباس إن من نسي من نسكه شيئا فليهرق دما. {cite:muwatta-maruf-1997 p.532}"
  tr: "Malik, Abdullah ibn Abbas'ın \"Ritüelinin herhangi bir bölümünü unutan kimse kurban kesmelidir\" sözüne dayanarak, böyle bir durumda kurban kesmenin tavsiye edildiğini söyler. {cite:muwatta-maruf-1997 s.532}"
  id: "Malik mengatakan bahwa dalam kasus seperti itu dianjurkan untuk mempersembahkan kurban, berdasarkan pernyataan Abdullah ibn Abbas bahwa siapa pun yang lupa sebagian dari ritualnya hendaknya mempersembahkan kurban. {cite:muwatta-maruf-1997 p.532}"
