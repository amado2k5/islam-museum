label: { ar: "جامع الترمذي 2692 — الأب والأبوة", en: "Jami' al-Tirmidhi 2692 — the father and fatherhood", ur: "جامع ترمذی 2692 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2692 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2692 — le père et la paternité" }
text: "… فَقَالَ رَسُولُ اللَّهِ \" وَعَلَيْكَ ارْجِعْ فَصَلِّ فَإِنَّكَ لَمْ تُصَلِّ \". فَذَكَرَ الْحَدِيثَ بِطُولِهِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَرَوَى يَحْيَى بْنُ سَعِيدٍ الْقَطَّانُ هَذَا عَنْ عُبَيْدِ اللَّهِ بْنِ عُمَرَ عَنْ سَعِيدٍ الْمَقْبُرِيِّ فَقَالَ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ وَلَمْ يَذْكُرْ فِيهِ فَسَلَّمَ عَلَيْهِ وَقَالَ \" وَعَلَيْكَ \". قَالَ وَحَدِيثُ يَحْيَى بْنِ سَعِيدٍ أَصَحُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2692، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2692 (Chapters on Seeking Permission), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2692، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2692 (Capítulos sobre la búsqueda de permiso), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2692 (Chapitres sur la demande de permission), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
