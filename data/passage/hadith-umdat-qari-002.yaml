text: "ه السلام - من غير نكير منكر، ولا رد راد، حتى عرف بذكر أهل الكتاب من اليهود والنصارى. وروي أن عبد الله بن صوريا من أحبار فدك، حاج رسول الله عله وسأله عمن يهبط عليه بالوحي؟ فقال: جبريل، فقال: ذاك"
