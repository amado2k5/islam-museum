label: { ar: "صحيح البخاري 6373 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 6373 — what was left behind: estate and inheritance", ur: "صحیح بخاری 6373 — ترکہ اور میراث", es: "Sahih al-Bukhari 6373 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 6373 — Ce qui a été laissé derrière: biens et héritage", tr: "Sahih el-Buhari 6373 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sahih al-Bukhari 6373 — Apa yang ditinggalkan olehnya berupa warisan dan peninggalan" }
text: "… إِلاَّ ابْنَةٌ لِي وَاحِدَةٌ، أَفَأَتَصَدَّقُ بِثُلُثَىْ مَالِي قَالَ \" لاَ \". قُلْتُ فَبِشَطْرِهِ قَالَ \" الثُّلُثُ كَثِيرٌ، إِنَّكَ أَنْ تَذَرَ وَرَثَتَكَ أَغْنِيَاءَ، خَيْرٌ مِنْ أَنْ تَذَرَهُمْ عَالَةً يَتَكَفَّفُونَ النَّاسَ، وَإِنَّكَ لَنْ تُنْفِقَ نَفَقَةً تَبْتَغِي بِهَا وَجْهَ اللَّهِ، إِلاَّ أُجِرْتَ، حَتَّى مَا تَجْعَلُ فِي فِي امْرَأَتِكَ \". قُلْتُ أَأُخَلَّفُ بَعْدَ أَصْحَابِي قَالَ \" إِنَّكَ لَنْ تُخَلَّفَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6373، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6373 (Invocations), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6373، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6373 (Invocaciones), menciona lo que quedó tras de sí: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6373 (Invocations), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 6373 numaralı hadis, geride bıraktığı mal varlığı ve miras hakkında bilgi vermektedir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6373, menyebutkan apa yang ditinggalkan beliau berupa harta warisan. Hadits ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, peninggalan, dan makam suci, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
