text: "… موسى بن وردان، عن أبى هريرة، عن النى ماته يقول تهادوا تحابوا فى شرح فضل اللّٰه : عزاه الزيلعى الى أبى يعلى. وكذا السيوطى. وأخرجه النسائى فى كتاب الكنى، والبيهتى فى شعب الايمان فى الباب المادى والستين، ورواه ابن عدى …"
summary:
  ar: "مقطع من الأدب المفرد، المجلد المصوَّر 2، ص 208، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Al-Adab al-Mufrad, scan volume 2, p. 208, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الادب المفرد، اسکین جلد 2، ص 208 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Al-Adab al-Mufrad, volume numérisé 2, p. 208, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Al-Adab al-Mufrad, volumen escaneado 2, p. 208, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "El-Adab El-Mufrad'ın 2. cildinin 208. sayfasından, felaket karşısında taziye, teselli ve sabır sunan bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Al-Adab Al-Mufrad, Volume 2, halaman 208, yang menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
