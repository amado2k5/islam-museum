text: |-
  ١٧.٢
  * -كل
  وقد حوصل أى ملا حوصلته يقال حوصلى وطيرى ( ظل لخظل المنع من التصرّف
  والحركة رقد حظل عليه يحظل بااضم قال الشاءر
  فايعدمك لا يعدمك منه * طبانية فيحظل أو يغار
  وبقال رجل حظل وحظال لدمقتر الذى يحماسب أهله بمايق عليهم والاسم الحظلان بكسم
  الجاء قال الشاعر
  تعبرنى الحظلان أتم مغلس • فقات لها لم تقذفيى بداقيا
  والحظلات بالتهريكْ مشى الغضيان وقد حظل المدى يحظل اذا كف بعض مشيه وأنشدابن
  السكيت للمرار العدوى
  وحشوت الغيظ فى أضلاءه • فهو يمشى حظلانا كالنقر
  والحنظل الشرى الواحدة حنظالة وقدحظل البعير بالكسراذا أكثرون أكل الحنظل
  ي فهو حظل وابل حظالى وحنظلة أكرم قبيلة من تميم يقال لهسم حنظلة الاكرمون وأبوهم
  حتظلة بن مالك بن عمروبن تيم ⁦(حفل)⁩ حفل القوم واحتفلوا أى اجتمعوا واحتشدوا
  وعندمحفل من الناس أى بمع وهو فى الاصل مصدد ومحفل القوم ومحتفلهم مجتمعه.
  وضرع حافل أى ممتلئ لبنا وشعبة حافل ووادحافل اذا كثرسلهما وحفات السمامحفلا أى
  جذوقعها وحفلته أى جلونه فتحفل واحتفل قال بشر بصف امرأة
  رأى درة بيضا يحفل لونها • خام كغربات البرير مقصب
  وحفلت كذا أى بالميت به يقال لا تحفل به قال الكميت
  أهذى بظبية لوتساعف دارها • كافا وأحفل صرمها وأبالى
  والحفالة منسل الحثالة قال الاصمعى يقال هو من حفالتهم وحثالتهم أى ممن لاخير فيه منهم
  قال وه والرذل من كل شئْ ورجل ذوحفلذ اذا كان مبالغافيما أخذفيه وجاؤابحفلتم-م أى
  بأجمعهم وأخذللامر حفلته اذا حدّ فيه ويقال احتفل الوادى بالسيل أى امتلا" والتحفيل
  مثل القصرية وهو أن لا تحلب الشة أيا ما ليجتمع اللبن فى ضرعها للبيع والشاة محفلة
  ومصرّاة ونهى رسول اللّٰه صلى اقه عليه وسلم عن التصرية والتصفيل حقسل) الحقل
  الزرع/ذا تشهب ورقه قبل أن تغلظ سوقه تقول منه أحة-ل الزرع والحقل القراح العايب
  الواحدة حة لة وفى المثسل لا تنبت البقلة الاالحقلة قال الاصمعالحقلة وجع بكون
  فى البطن وقال أبو عبيد من أكل التراب مع البقل وقد حقلت الابل حدلة مثل رخم رحة
  والمع أحقال ومفه قول العجاج• ذالنونت فى حلذ الاهراض* والحقيلة ماءالرطب
  فى الامعاء وأماقول الشاعر الراعى •من ذى الابارق اذرعين حقيلا• فهواسم موضع
  والهاقلة بيسع الزرع وهو فى سقبله بالبرّ وقد نهى عنه وحوقل الشيخ حوقلة وحية الااذا كبر
  وفتر عن الجاع قال الراجز باقوم قد حوقلت أودنون * وبعدحيقال الرجال الموت
  ويروى وبعدحو قال وأراد المصدر فلما اسة وحس من أن تصير الواويامقهه والحوقلة
  الفرمول اللين وفى المتأخرين من يقوله بالفاء ويزعم أنه السكمرة الضضعة ويجعله أخوذامن
  الحفل وما أظنه مسم وعا وقلت لابى الغوث ما الحوقلة قال هن الشيخ المحوقل ( كل
  الاتدل
