text: "كان فيه دفع للمبتدع. وهذا فيه مناسبة بلاغية أيضا؛ لأن الذي رد عليه بكتاب ((هذه مفاهيمنا)) سمى كتابه ((مفاهيم يجب أن تصحح))، فالرد يكون باستعمال لفظ استعمله هو لتأكيد قوة الأمر وتثبيته بقوله: هذه مفاهيمنا . وهذا له أصل في"
