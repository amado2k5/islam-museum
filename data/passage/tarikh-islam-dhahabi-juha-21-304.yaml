text: "… مات في شوال سنة خمسين. - عَبّادة المخنّث. صاحب نوادر ومُجُون. كان ببغداد في هذا العصر. قيل: إنّه دخل على الواثق زمن محنة القرآن فقال: أعظمَ اللّٰه أجرك يا أمير المؤمنين. قال: ويْلَك، فيمن ؟ قال: في القرآن. قال : …"
