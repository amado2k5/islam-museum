text: |-
  (فصل القاف
  ٤٧١
  حذفت الواووقلت قلائس وان شئت حذفت المون وقلت قلاس وانماحذفت الواو .
  لاجتماع الساكنين وان شقت، وضت فيهمايا وقلت قلانيرس اوقلاسىّ وتقول فى التصغير
  قلينسة وان شئت قليسية ولت أن تعوّض فيهما وتقول قلينيسة وقليسية بتشديد الياء الاخيرة
  وان شئت بجعت القلنسوة محذف الهاء فقلت قلنس وأصلدقدذ- والا أنك رفنت الواولانه
  ليس فى الاسماء اسم آخره حرف علة وقبلها ضمة فاذا أدى الى ذلات قياس وجب أن يرفض
  ويبدل من الضمة كسرة فيصير آخر الاسم ياءمكسوراما قبلها وذلك يوجب كونه بمنزلة قاض
  وغاز فى التذوين وكذلك القول وى أجق وأدل جمسع حق وودلو واشباه ذلك فقس عليسه وقد
  قليته فتقلسى وتقلدس وتقلس أى أليسته القلنسوة فلبسها والتقليس الضرب بالدف
  واغناقال الشاع
  ضرب المقلس جنب الدف للعجم وقال الاموى المقلس الذى
  لعب بين يدى الاميراذا قدم المصر وقال أبو الجراح التقليس استقبال الولاة عند قدرمهم
  بأصذاف اللهو قال السكميت يصف توراطعن الكلاب فتبعه الذياب لما فى قرنه من الدم
  ثم استمر يغنيه الذياب كما * غنى المقلمر بطر يقابمزمار
  ومحر قلاس أى يقذف بالزيد والقليس بالتشديد مثال القبيط ببعة كانت بصنعاء الحبشة
  بناها أبرهة وهدمها حير قس القمس الغوص والقماس الغواص وقسمه
  فى الماء فانقمس أى غمسته فانغمس وقس بنفسه يتعدى ولا يتعدى وفيه لغة أخرى أهسته
  فى الماء بالالف وقس الولد فى بطن أمه اضطرب وقامه فقمسته يقال فلان بقامس
  حوتا اذا ناظر من هوأعسلم منه وانقمس النيجم اغعط فى المغرب قال ذوالرمة يذصكر
  مطراءند سقوط التريا
  أصاب الارض منمس التريا • بساحية وأببعها لملالا
  واغاخص النريالاتَ العرب تزعم انه ليس شئْ من الانواء أغزر من نو التريا وقاموس البحر
  وسطه ومعظمه وفى حدين المدوا لجزر قال مللموكل بقاموس البحركما وضع رجله فيه
  فاض فاذارفعها غاض ومحرقاس بتشديد الميم أى زاخر وأرى ان اللام زائدة والقلس
  أيضا اليد العظيم س لقنس الاصل قال الراجز فى قنس مجد فات كل قنس
  والقوئر أعلى البيضة من الحديد قال الشاعر
  عطردلدن صحاح كعوبه • وذى رونق عضب يقدّ القوانسا
  وااقونس أبضاعظم ناتى بين أدنى الفرس قال طرفة
  اضرب عنك الهموم طارقها • ضربك بالسيف قونس الفرس
  أراد اضر بن فحذف النون كماحذف من قوله ايوم لم يقدر أم يوم قدر (قوسالقوس
  يذكرويؤنث فن أنث قال فى تصغير هاة ويسة ومن ذكره قال قويس وفى المثل هومن
  خيرة ويس سهما والجمع قسى" وأقواس وقياس وأنشد أبو عبيدة ووتز الاساور القياسا
  وكان أصل قسى قووس لانه فعول الا أنهم قدموا اللام وصيروه قسوّء-لى فلوع ثم قلبوا
  الواوياء وكسروا القاف كما كسر واعين عصىّ فصارت قسى على فليع كانت من ذوات
  الثلاثة فصارت من ذوات الار بعة واذافسبت اليهاقات قسوى لانهاذلو ع مغير من
  قوله وتقلس أى بتشديد اللام
  مطاوع قله المندّدأ بضا وهذا
  الثالث ثابت فى الفسخ وفى المختار
  أيضا ولكن ليس فى ترجحته ولا فى
  القاموس ولا ترجته بل الذى فى
  فى الثلاثة الاقتصار على فعلين
  قلسيته قلسية فتقلسى وقلفته
  قلفسة فتلفس وعلى ما فى العصاح
  يكون التقليس مشتر كابين هذا
  والمعنى الذى يذكربعد قاله نصير
