text: |-
  ٤١٥
  وذفرى ككاهل ذيخ الخليف • أصاب فر يقة ليل فعاثا
  ومقرّق النعم * والظربان لانه اذافسا بينها وهى مجتقمعة تفرّقت والفرائق البريد وهو الذى
  بنذرقدام الاسد وهو معرّب بروانك بالفارسية قال امر ؤالقيس
  وانى أذين ان رجعت عدكا * بسيرترى منه الفرائق أزورا
  وربماسموادليل الجيشر فرانقا وافر يقية اسم بلاد ⁦(فرزدق)⁩ الفرزدق جمع فرزدقة
  وهى القطعة من العجين وأصله بالفارسية برازذه وبه سمى الفرزدق واسمه همام فاذاجعت قلت
  فرازق لانّ الاسم اذا كان على خمسة أحرف كلها أصول حذفت آخر حرف منه فى الجمع
  وكذلة فى التصغير وانماحذفت الدال من هذا الاسم لانها من مخرج التاء والتاء من حروف
  الزيادات فكانت بالحذف أولى والاقالقياس رازد وصكذلك التصغير فر يزق وقريزد
  وان شئت عوّضت فى الجمع والتصغيرفان كان فى الاسم الذى على خسسة أرف حرف واحد
  زائد كان بالحذف أولى مثل مدحرج وحجنفل قلت دحيرج وجيفل والجمع دحارج ويافل
  وان شذت عوضت فى الجمع والتصغير ⁦(فسق )⁩، فسقت الرطبة اذا خرجت عن قشرها
  وفسق الرجل يفسق ويفق أيضا عن الاخفس فقاوة..وماأى فجريقال فسق عن أمر
  ربه أى خرج قال وهذا كقولهم اتخم عن الطعام أى عن مأكاء اتخم ولماردّهذا الامرفسق
  قال ابن الاعرابى لم يسمع قط فى كلام الجاهلية ولا فى شعرهم فاسق قال وهذاعجب وهوكلام
  عرتيّ والفسيق الدائم الفسق والفويسقة الفأرة ويقسال فى النداءيافسق وياخبث يريد
  يا أيها الفاسق وبا أيها الخميث وهومعرفة يدل على ذلك أنهم يقولون يافسق اللحيت فينعتونه
  بالالف واللام وتقول للمرأة يافساق مثل قطام ( شق الفشق بالتحريك والشين
  معهة النشاط وقال أبو عمر وانتشار النفس والحرص وقد فشق بالسكسر وفاشقه أى باغته
  قق ). الفقفقة نباح الكلب عند الفرق ورجل فقاقة بالتخفيف أى أحق هذرة وكذلك
  فقفاقة وفقفاق وانفق الشئ انفقاها أى انفرج (فلق فلقت الشئ فلقاشققت
  والتفليق مثله يقال فلقته فانفلق وتفلق وفى رحله فلوف أى شقوق ويقال كامنى من فلق فيه
  والفلق بالتحريك الصبح بعينه قال ذوالرمة يصف النور الوحشى
  حتى اذاما انجلى عن وجهه فلق • هاديه فى أخريات الليل منقصب
  يقال فلق الصبح فالقه وأما قوله تعالى قل أعوذ برب الفلق فيقال هوالصبح ويقال الخلق كله
  والفلق أيضا المطمتنّ من الارض بين الربوتين وجعه فلقان مثل خلق وخلقان ورءاقالوا
  كان ذلك بفالق كذا و كذايريدون المكان المتحدربين الربوتين والفاق أيضا مقطرة السجان
  والفلق الشق يقال مررت بحرة فيها فلوق أى شتوق وقواهم صار البيض فلاقا وفلا فا أى
  صارأذلاقا والفلق بالمكسر الداهية والامر العجب تقول منه أفلق الرجل وافتلق وشاءر!
  مفلق قدجاء بالفلق قال سويد بن كراع العكلى وكراع اسم أمه واسم أبيه عمير
  اذاعرضت داوية مدلهمة • وغرد حاديه افرين بهافلقا
  والفلق أيضا القضيب يشق باثنين فيعمل منه قوسان يقال لكل واحد منه ما فلق والفلقة
  أيضا الكسرة يقال أعطى فلقة الجفنة وهى نصفها وقولهم جاءبعلق فلق وهى الداهية
