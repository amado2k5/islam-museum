summary:
  ar: "يروي مالك عن ابن شهاب عن علي بن حسين بن علي بن أبي طالب أن رسول الله قال: من حسن إسلام المرء تركه ما لا يعنيه. ويذكر المحقق أن جماعة من رواة الموطأ رووه عن مالك مرسلا، وأن خالد بن عبد الرحمن وموسى بن داود رويا عن مالك متصلا، وأن الإرسال أشهر وأكثر عند ابن عبد البر. {cite:muwatta-maruf-1997 p.487}"
