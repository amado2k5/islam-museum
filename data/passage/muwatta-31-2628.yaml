label: { ar: "الموطأ 2628 — علي بن حسين عن النبي: من حسن إسلام المرء ترك ما لا يعنيه", en: "Muwatta 2628", es: "Muwatta 2628", fr: "Muwatta 2628", ur: "موطا 2628", tr: "El-Muvatta 2628 — Ali ibn Hüseyin, Peygamberimizden rivayetle: Bir insanın İslam'ının faziletlerinden biri de kendisini ilgilendirmeyen şeylerden uzak durmasıdır.", id: "Al-Muwatta 2628 — Ali ibn Husayn berdasarkan riwayat Nabi: Sebagian dari keutamaan Islam seseorang adalah meninggalkan apa yang tidak berkaitan dengannya" }
summary:
  ar: "يروي مالك عن ابن شهاب عن علي بن حسين بن علي بن أبي طالب أن رسول الله قال: من حسن إسلام المرء تركه ما لا يعنيه. ويذكر المحقق أن جماعة من رواة الموطأ رووه عن مالك مرسلا، وأن خالد بن عبد الرحمن وموسى بن داود رويا عن مالك متصلا، وأن الإرسال أشهر وأكثر عند ابن عبد البر. {cite:muwatta-maruf-1997 p.487}"
  tr: "Malik, İbn Şihab'dan, o da Ali ibn Hüseyin ibn Ali ibn Abi Talib'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Bir insanın İslam'ının faziletlerinden biri de kendisini ilgilendirmeyen şeylerden uzak durmasıdır.\" Araştırmacı, Muwatta'nın bir grup ravisinin bunu Malik'ten mursal hadis olarak naklettiğini, Halid ibn Abdülrahman ve Musa ibn Davud'un ise Malik'ten muttal hadis olarak naklettiğini ve mursal versiyonun daha yaygın bilindiğini ve İbn Abdülberr tarafından daha sık nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.487}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Ali bin Husayn bin Ali bin Abi Talib, bahwa Rasulullah SAW bersabda: “Sebagian dari keutamaan Islam seseorang adalah meninggalkan hal-hal yang tidak berkaitan dengannya.” Peneliti menyebutkan bahwa sekelompok perawi Muwatta’ meriwayatkan hadits ini dari Malik sebagai hadits mursal, sedangkan Khalid bin Abd al-Rahman dan Musa bin Dawud meriwayatkannya dari Malik sebagai hadits muttal, dan bahwa versi mursal lebih dikenal luas dan sering dikutip oleh Ibnu Abd al-Barr. {cite:muwatta-maruf-1997 p.487}"
