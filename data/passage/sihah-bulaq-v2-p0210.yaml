  (رعنn*
  ٣٧٧
  بالضم فهودزين أى وقور وامرأة رزان اذا كانت رزينة فى مجلها قالحسان.
  حصان رزان لاتزن بريبة * وتصبح غرثى من لحوم الغوافل
