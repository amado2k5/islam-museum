  شهجر صلب تتخذمنه العصى أنشدابن الاعرانى"
  انى وجدك ما أقضى الغريم وان • حان القضاء ولا رقت لة كبدى
  الاعصا أرزن طارت برايتها • تتواضريتها بالسكف والعضد
  ابن السكيت الروزنة الكوة وهي معرية سن الرسن الحبل والجمع أرسان ورسنت
  الفرس فهومر-ون وأرسته أيضا اذا شددته بالرسن قال الشاعر
  هريت قصير عذار اللجام * أسيل طويل عذار الرسن
  والمرسن يكسر السين موضع الرسن من أنف الفرص ثم كثر حتى قيل هر سن الانسان
  يقال فعات ذاك على رغم مرسنه على مفعل بفتح الميم قال العجاج
  وجبهسة وحاجبامزججا • وفاحا ومرسنامسرجا
  شن الراشن الذى يأتى الوايمة ولم يدع اليها وهوالذى يسمى الطفيلى وأما الذى يتهين
  وقت الطعام فيدخل على القوم وهم يأكلون فه والوارش بقال رشن الرجل اذا تطفل
  ودخل يغيراذن ورشن الكلب فى الاناء يرشن رشنا ورشوناأ يضااذا أدخل فيه وأبسه
  قال الراجز بصف امر أة بالشره
  تشرب مافى وطبها قبل العين * تعارض السكاب اذا المكاب رشن
  والروشن السكوة من) الاصمعى"رصنت الشى أرضنه رصناأ كلته وأرصته
  أحكمته والرصين المحكم الثابت وقدر من بالضم رصانة والرصينان فى ركبة الفرس أطراف
  القصب المركب فى الرضفة وذلان رحين بحاجتك أى حفى بها ورصفته بلسانى رصناشتمته
  ورجل رصين الجوف أى موجع الجوف قال• يول انى رصين الجوف فاسة ونى• أيوزيد
  رصنت الشى معرفة أى علمته ⁦(رطن)⁩ الرطانة والرطانة الكلام بالاعجمية تقول رطنت له
  رطانة وواطسته أذا كلتمبها وتراطن القوم فيمابينهم وقال * أصواتهم كتراطن القرس
  الفراء اذا كانت الابل رفاقا ومعها أهلها فى الرطانة والرطون بالفتح قال
  رطانة من يلقها يخيب * (دعن الرحن بالتحريك الاسترخاء وقال يصف ناقة
  ورحلوهار حلة فيهار عن• أى استرخا لم يحكم شدهامن الخوف والهجلة والرعونة الحمق
  والاسترخاء ورجل أرعن وامر أة رعناء ببنا الرعونة والرمن أيضا وما أرهنه وقد ر عن بالضم
  ورعنته الشمس فهو مرعون أى مسترخ وقال• كانه من أوار الشمس مرعون،وذو
  رعينم لك من ملوك حير ورعين حصن كان له وهو من ولدالحرت بن عمرو بن حير بن سسبأوهم
  آل ذى رعين وشعب ذى رعين قال الراجز
  جارية من شعب ذى رعين • حياكة تمشى بعلطتين
  والر عن أنف الجبل المتقدم والجمع الرعون والرعان ثم يشبه به الجيش فيقال جيش أرعن
  وسميت البصرة رعناء تشييم ابر عن الجبل قاله ابن دريد وأنشد للفرزدق
