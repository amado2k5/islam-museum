text: "الصفحة السطر النص فى الطبعة الأولى، نحملت عليه فطعنته قتل وله أربع وستون سنة دنية خمسون ألفا ترثية فيما مضى فيما تروح وحدث عنه من الصحابة وقدم الجابية مع عمرو وأنبأ أحمد بن إسحاق الزاهد، أنبأ أبو طاهر المخلص فليجعلهما …"
summary:
  ar: "مقطع من سير أعلام النبلاء، المجلد المصوَّر 2، ص 581، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Siyar A'lam al-Nubala', scan volume 2, p. 581, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "سیر اعلام النبلاء، اسکین جلد 2، ص 581 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Siyar A'lam al-Nubala', volume numérisé 2, p. 581, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Siyar A'lam al-Nubala', volumen escaneado 2, p. 581, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Siyar A'lam al-Nubala'nın Resimli Cilt 2, sayfa 581'inden, merhum için yazılmış bir ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Siyar A'lam al-Nubala', Jilid Bergambar 2, hlm. 581, berisi elegi dan pujian untuk almarhum; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pujian paling terkenal."
