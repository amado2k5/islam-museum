text: |-
  فرق..
  ٩١٣
  معاود الجوع والاملاق • يغضب ان قال الغراب غاق
  أبعد كن اللّه من نياق
  |وغيق الرجل فى رأيه تغييقا اذا اختلط فلم يثبت على شي عن أبى عبيد
  صل الفاء تق فتقت الشى فتقاشقسه وفتقته تفتيقا مثله فتفتق وانفتق
  وفتق المسك بغيره استخراج راتحته بشئء تدخله عليه قال الشاعر
  كما فتق الكافور بالمسك فاتقه * والفتق شق عصا الجهاعة ووقوع الحرب بينهم والفقق أيضا
  علة ونتوء فى مراق البطن والفتق بالتحريك مصدرة ولك امر أة فتقاء وهى المنفتقة الفرج
  خلاف الرتقاء والفتق الصبح والفتق أيضا الخصب قال الراجز
  لم ترج رسلا بعد أعوام الفتو• تقول منه فتق بالكسر وأفتق القوم اذا انفتو عنهم الغيم
  قال ابن السكيت أفتق قرن الشمس اذا أصاب فتقا فى السحاب فبدامنه وقد أفتقنا اذا
  صادفنا فتفا وهو الموضع الذى لم عطر وقد معار ماحوله وأنشد
  ان لها فى العام ذى الفتوق • وزلل النية والتصفيق
  رعية رب ناصح شفيق * ينل تحت الفنن الوريق
  يشول بالمحجن كالمحروق
  قوله لها يعنى للابل وذو الفتوق القليل المطروزلل النية أن تزلّ من موضع الى موضع لطلب
  المكال وامرأة فتق بضم الفاء والتاء أى متفتقة بال_كلام ورجل فتيق اللسان على فعيل أى
  حسديد اللسان ويقال أيضاجمل فتيق اذا تفتق سمنا عن الاصمعى قال والصبح الفتيق هو
  المشرق والفيتق النجار وهو فيعل ومنه قول الاعشى
  ولا يتمن جاريجيز سبيلها * كماسلك السكى فى الباب فيتق
  والسكى" المسمار رق) فرقت بين الشيتين أفرق فرقارفرقانا وفرقت الشى تفريقا
  وتفرقة فانفرق واقترق وتفرق وأخذت حتى منه بالتفاريق وقول المشاعر
  أشهدبا مروة يوما والصفا • أنك خير من تفاريق العصا
  قال ابن الاعرابى العصاتكسر فيتخذ منها ساجور فاذا كسر الساجور اتخذت عنه
  الاوتادفاذاكسر الوتد اتخذ منه عران البخاتى فاذافرض رأسه اتخذت منه التوادى
  صرّيم ا الاخلاف وقوله تعالى وقرا نافرقناه من خفف قال ساه من فرق يفرق ومن شدد
  قال أنزلناه مف ترقا فى آيام والفرق مكيال معروف بالمديشة وهو ستة عشروطلا وقد
  يحرّك قال خداس بن زهير
  يأخذون الارش فى اخوتهم * فرق السمن وشاة فى الغنم
  والهع فرقان وهذا الجمع قد يكون لهما جيعامثل بطن وبطنان وحل وحلان وأنشد أبوزيد
  زقد يعد الصف فى فرقان قال والصف أن تحاب فى محلبين أوثلاثة تصف بيتها والفرقات
  القرآن وكل ما فرق به بين الحق والباطل فهو فرقان فلهذا قال تعالى ولقد آتذنا موسى وهرون
  االفرقان والفرق أيضا الفرقات ونظيره الخسر والخسران قال الراجز
  ومشركى كافر بالفرق • والغرقة الاسم من فارقته مفارقة وفراقا والفاروق اسم سحى به
  ٢٩
  صحاح
  في
