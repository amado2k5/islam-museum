text: "منة ولا تنتى عشره بقيت من جمادى الاولى منهاه قُتل مُفْلِحْ بسهم اصابه بغير نصل فى صدغه يوم الثلثاء فأصبح ميّتا يوم الاربعاء فية غد ذلك اليوم وحْملت جنَّته الى سامرا فدُفن بها، ذكر الخبر عن سبب مقتله وكيف كان …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 1، ص 574، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 1, p. 574, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 1، ص 574 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Rusul wa-l-Muluk de al-Tabari, volumen 1, pág. 574, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Rusul wa-l-Muluk d'al-Tabari, volume 1, page 574, mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "Taberi'nin Peygamberler ve Krallar Tarihi, Resimli Cilt 1, sayfa 574'ten bir alıntı, bir mezar, bir türbe ve bir kutsal alandan bahsetmektedir; makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, antik eserler ve kutsal alanlar araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Para Nabi dan Raja karya Al-Tabari, Jilid 1 Bergambar, hlm. 574, menyebutkan sebuah pemakaman, sebuah makam, dan sebuah tempat suci; dari edisi faksimili yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
