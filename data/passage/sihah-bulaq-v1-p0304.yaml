text: |-
  (فصل الشين
  ٢٣٧
  والسيرمايقد من الجلد والجمع السيود وقول الشاعر
  وسائلة بنعلبة بن سير وقد علقت بنعلبة العلوق
  أراد ثعلبة بن سيارفلم يك نه لاجل الوزن فقال سيروسائر الناس جيعه-م وسار
  البتى لغة فى سائره قال أبوذؤيب يصف ظبية
  فسوّدما المرد فاهافلونه * كاون المؤوروهى ادما سارها
  أى سائرها ومن أمشاله-م فى اليأس من الحاجة قوله-م أسائراليوم وقد زال الفاهرأى
  تطمع فيما بعد وقد تبين لك ا! بأس لان من كان حاجته اليوم بأسره وقد زال الظهروجب
  أن ييأس منه كمابياس بغروب الشمس
  حصل الشين ( ير الشبر واحد الاشبار ورجل قصير الشبر أى متقارب انخلق والشبر
  بالفتح مصدرشيرت النوب أشبره وأشبره وهو من الشبر كما تقول بعته من الباع وأعطيت
  المرأة شبرها أى حق النكاح وجاء النهى عن شبر الفحل وهو كراء الضراب ابن السكيت شبرت
  فلانا مالا أوسيفا اذا أعطيته ومصدره الشبرالا أن العجاج حركد فقال
  لحد لله الذى أععلى الشير كأنه قال الذى أععلى العطية ويروى المبر وقال عدى بز زيد
  لم أخنه والذى أعطى الشبروأشبرته لغة فى شبرته اذا أعطيته قال أوس بصف سيفا
  وأشبرنيه الهالكىّ كأنه غديرجرت فى متنه الريح سلسل
  وبروى أشبرنيها فتكون الهاء للدرع وتشابراافريقان اذا تقاريا فى الحرب كان صار
  بينهماشبرأ ومة كل واحد منهما الى صاحبه الشبرواالشبور على وزن اتنور البوق ويقال
  هو معرّب ( تر الشترانقلاب فى جفن العين يقال رجل أشتر بين الشتروقد شتر
  لرجل وشترأ يضامفل أفن وأفن والاشتران مالك وابته وشترته أنا.شل ثرم وثرمته أنا
  وأشترته أيضاوا نشترت عينه وشترت بذلان تشتيرا اذا تنقصته وعبته وشنترثوبه حزقه
  وقواه-م لاضمنك ضم الشناتر وهى الاصابع ويقال القرطة لغة يمانية الواحدة شنترة
  وذوشناتره لل من لول اليمن ويسال معناهذوالقرطة جر الشجر والشجرة ما كان
  على ساق من نبات الارض وأرض شحيرة وشجرا. أى كثيرة الاشجاروواد شجير ولا يقسال واد
  شجروواحد الشجراء شجرة ولم يأت من الجمع على هذا المثال الاأحرف يسيرة شجرة وشجراء
  وقصبة وقصباء وطرفة وطرفاء وحلفة وحلفاء وكان الاصمعى يقول فى واحسد الحلفاء حلفة
  بكسر اللام مخاافة لاخواتها وقال سيبويه الشجراء واحد وجع وكدلك القصباء والطرفاء
  والحلفاء والمشجرة موضع الاشجار وأرض مشجرة وهذه الارن أشجر من هذه أى
  أكنر شجراوالمشجر بكسر اليم المشهب قال الاصمعى المشاجر عيدان الهودج وقال
  أبوهمرومراكب دون الهودج مكشوفة الرؤم قال ويقال لها الشجرأيضا الوا-د
  شجار قال والشجارأيضا الخشبة التى توضع خلف الباب ويقال لها بالفارسية مترس
  وكذلك الخشبة التى يضبب بها السرير من تحت والشجار أيضا خشب البئر قال الراجز
  التروين أوليددن الشجر والشجارسمة من سمات الايل أبوع روالشجير الغريب من
  الناس والابل وربما.موا القدح شجيرا اذا ألوه فى القداح التى ليست من شجرها والشجر
  ٨٥
  صراح
