  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 2. cildinin 47. sayfasından, haram ve helal olan şeyleri belirten bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 2, halaman 47, yang menyebutkan apa yang dilarang dan apa yang diperbolehkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
