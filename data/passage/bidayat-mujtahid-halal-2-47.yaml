text: "… البحر ما لا يؤكل كالتمساح، وفي البر ما لا يؤكل كالسباع، قال : فثبت أن الصيد اسم للمأكول. انتهى نصب الراية. والجمهور حرموا الضبع ومنهم أبو حنيفة، وأباح أكله الشافعي وأحمد. وقد احتج من حرمه : أولاً : إنه ذو …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 47، يذكر ما حُرّم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 47, that mentions what was made unlawful, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 47 کا اقتباس جس میں جو حرام کیا گیا، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
