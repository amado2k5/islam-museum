label: { ar: "نوادر جحا الكبرى، ص 48 — «ما الذي أضاعته؟»", en: "Nawadir Juha al-Kubra, p. 48 — 'What Has She Lost?'", ur: "نوادر جحا الکبریٰ، ص 48 — «اس نے کیا کھویا ہے؟»", fr: "Nawadir Juha al-Kubra, p. 48 — « Qu'a-t-elle perdu ? »", es: "Nawadir Juha al-Kubra, p. 48 — «¿Qué ha perdido?»", tr: "Juha'nın Muhteşem Anekdotları, s. 48 — “Ne kaybetti?”", id: "Anekdot Hebat Juha, hlm. 48 — “Apa yang hilang darinya?”" }
text: "… ما الذي أضاعته؟ قال له يوماً أحد أصحابِهِ: إنَّ أمرأتك قد أضاعَتْ عقلَها. فنظرَ إليه جحا، ثم وضع يده على جبهته، وجعل يفتكر، وأطال، فقال له صديقُه: بماذا تفكر؟ فأجابه: تقول: إنَّ امرأتي أضاعَتْ عقلها، وأنا على يقينٍ بأنها لا …"
summary:
  ar: "قال صديق لجحا إن زوجته فقدت عقلها، فتأمل جحا وقال إنه لا عقل لها لتفقده، فتساءل عما فقدته. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  en: "A friend says Juha's wife has lost her mind; Juha ponders and says she has no mind to lose, so he wonders what she has lost. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  ur: "ایک دوست نے جحا سے کہا کہ اس کی بیوی کی عقل جاتی رہی؛ جحا نے سوچ کر کہا کہ اس کے پاس کھونے کے لیے عقل ہی نہیں، تو حیرت ہے کہ اس نے کیا کھویا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  fr: "Un ami dit que la femme de Juha a perdu la raison ; Juha réfléchit et dit qu'elle n'a pas de raison à perdre, et se demande donc ce qu'elle a perdu. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  es: "Un amigo dice que la mujer de Juha ha perdido la razón; Juha reflexiona y dice que ella no tiene razón que perder, y se pregunta entonces qué habrá perdido. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  tr: "Juha'nın bir arkadaşı, karısının aklını kaybettiğini söyledi. Juha bunu düşündü ve kaybedecek bir aklı olmadığını söyledi, sonra da neyi kaybettiğini merak etti. {cite:juha-nawadir-kubra-djuwaydi s. 48}"
  id: "Seorang teman Juha mengatakan bahwa istrinya telah kehilangan akal sehatnya. Juha merenungkan hal ini dan berkata bahwa istrinya tidak memiliki akal sehat untuk hilang, lalu ia bertanya-tanya apa yang telah hilang dari istrinya. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
