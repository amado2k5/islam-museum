label: { ar: "صحيح البخاري 4521 — الحلال", en: "Sahih al-Bukhari 4521 — the lawful", ur: "صحیح بخاری 4521 — حلال", es: "Sahih al-Bukhari 4521 — el lícito", fr: "Sahih al-Bukhari 4521 — le licite", tr: "Sahih el-Buhari 4521 — Helal", id: "Sahih al-Bukhari 4521 — Halal" }
text: "… فُضَيْلُ بْنُ سُلَيْمَانَ، حَدَّثَنَا مُوسَى بْنُ عُقْبَةَ، أَخْبَرَنِي كُرَيْبٌ، عَنِ ابْنِ عَبَّاسٍ، قَالَ يَطَوَّفُ الرَّجُلُ بِالْبَيْتِ مَا كَانَ حَلاَلاً حَتَّى يُهِلَّ بِالْحَجِّ، فَإِذَا رَكِبَ إِلَى عَرَفَةَ فَمَنْ تَيَسَّرَ لَهُ هَدِيَّةٌ مِنَ الإِبِلِ أَوِ الْبَقَرِ أَوِ الْغَنَمِ، مَا تَيَسَّرَ لَهُ مِنْ ذَلِكَ أَىَّ ذَلِكَ شَاءَ، غَيْرَ إِنْ لَمْ يَتَيَسَّرْ لَهُ فَعَلَيْهِ ثَلاَثَةُ أَيَّامٍ فِي الْحَجِّ، وَذَلِكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4521، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4521 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4521، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4521 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), menciona lo lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4521 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 4521 numaralı hadis, helal olan şeylerden bahsetmektedir. Bu hadis, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4521, menyebutkan apa yang diperbolehkan (halal). Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
