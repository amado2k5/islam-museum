text: |-
  ١٢٢٤
  ⁦(باب التا.)⁩
  وفى المثل كفت الى وئية أى بلية الى جنبها أخرى والسكفات الموضع الذى يكفت فيه شئ
  أى يضم ومنه قوله تعالى ألم نجمل الارض كفاتا أحيا وأمواتا كت) الكميت من
  انخيل يستوى فيه المذ كروالمؤنت ولونه السكمتة وهى -رقيد خلهاقنو١ ) ٠ قال سيبويه
  سألت الخليسل عن كيت فقال انماصغر لانه بين السواد والجرة كانه لم يخلس له واحدمنهما
  فارادوا بالتصغير أنه منه-ما قريب والفرق بين الكميت والاشر بالعرف والذنب فان كانا
  أحرين فه وأشقروان كانا أسودين فهوكيت تقول منه اكت الذرس اكتاتا واكمات
  كيتا تامشله الاصمعى يقال بعبرأ -راذالم يخالط حرته شي فان خالط ←رته قنو.فهو كيت
  والناقة كيت أيضا والكميت من أسماءالجرامافيها من سوادوحرة ⁦( كيت)⁩ التكييت
  تيسير الجهاز. قال الشاعر
  كيت جهازكإ ما كنت مرتحلا * انى أخاف على أذوادك السبعا
  أبو عبيدة بقال كان من الاهر كيت وكت بالفتح وكيت وكيت بالكسر والتاءفيهماهاه
  فى الاصل فصارث تاء فى الوصل
  صل اللام ل ت الاسمعلت الشئء يلتسه لتا اذاشدّه وأوثقه وقدات فلان
  بفلان ادالزبه وقرن معه ولتت السويق ألتهلتا اذا جدحته صت الفرّاء اللصت
  يفتح اللام اللص فى لغة طي والجمع لصوت وهم الذين يولون للطس طست قال الزبير ين
  عبد المطاب
  واحكنا خلقنا اذخلقنا * لنا الحبرات والمسك الفتيت
  وصبر فى المواكان كل يوم • اذاخفت مر الفزع البيوت
  فأفسديطن مكة بعد أنس * قراضية كأنهم اللصوت
  ( لفت اللفت اللىّ وفى حديث حذيفة ان من أقرأ الناس للقرآن مناقة الا يدع منه واوا
  ولا ألفا يلقته بلسانه كما تلفت البقرة اخسلى بلساحا وافت وجهه عنى أى صرفه ولفته عن
  رأيه صرفه وتيس ألفت بين اللفت اذا كان ملتوى أحد القرنين على الآخر والالفت
  فى كلام تيم الاعسروفى كلام قيس الاحق مثل الاعفت واللفات الاحق العسر الحاق
  واللفوت من النساء التى لها زوج ولها ولد من غيره فهى تلفت الى ولدها واللفيتة الغليظة من
  العصائدلانها تلفت أى تلوى والتفت التفاتا والتلفت أكثر منه واللفت الشلجم واللفت أيضا
  الشق يقال لفته معه أى صغوه ولفتّاه شقاه وقولهم لا تلتفت لفت فلان أى لا تنظراليه
  ل ت ليت كملسة تمن وهى حرف تنصب الاسم وترفع الخسبر مثل كان وأخواته الانها
  شابهت الافعال بوة ألناظها واتصال أكثر المضمرات بها وبعانيها تقول ليت زيد اذاهب
  وأماقول الشاءر باليت أيام الصبارواجعا
  فانما أرادياليت أيام الصبالنارواجع
  نصبه على الحال و-كى النهويون ان بعض العرب يستعملها بعنزلة وجدت فيعديها الى
  مفعولين ويجر يمما مجرى الافعال فيقول ليت ز يداشاخصافيكون البيت على هذه اللغسة
  ويقال ليتى واتنى كما قالو العلى واعلنى وانى واننى قال الشاءو
  كنية يابر اذ قال ليق • أصادة وأغرم جل مالى
  والايت
