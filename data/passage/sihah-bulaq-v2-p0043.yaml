text: |-
  ٥٤٤
  * ⁦(فسل اللام)⁩
  • ⁦(ا )⁩*
  فاغمازكه بلاصسلة لانه جعله مجهولاء اماى اللطاة الجبهة ودارة اللطاة التى ف وسط جبهة
  الداية ويقال ألقى بلطاته أى بشقله قال اين أحر
  فألق التهاممنهما بلمطانه • وأسلط هذا لا أريم مكانيا
  والملطلى على مفعل السمحاف من الشهجاج وهى التى ينهاوبين العظم التشرة الرقيقة قال
  أبو عبيدوأ خبرنى الواقدىّ أنّ السمحاق فى لغة أهل الجاز الملطى قال أبو عبيدوبقال لها
  الملطاة بالهاء فاذا كانت على هذافهى فى التقدير مة صورة قال وتفسير الحديث الذى جاءان
  الملطى بدمها يقول معناه أنه حين يشج صاحبها يوْ خذمة_دارها تلك الساعة ثم يقضى فيها
  بالقصص أو الارش لا يتظر الى ما يحدث فيها بعددلك من زيادة أونقصان قال وهذاقواهم
  وليس هوقول أهل العراق (ا ى الاظلى النار ولظى أيضا اسم من أسماء النار.عرفة
  لا ينصرف والتظاء القار التهابها وتلفظيها تلهبها ( عا جل اموواهامقصورأى شهوان
  حريص وكلبة لعوة حيصة ولموة قوم من العرب ولعوة الجوع حدته ويقال للعاثر لعالك
  دعاءله بأن ينتعش قال الاعشى
  بذات لوث عف رناة اذاعثرت • فالتعس أدنى لها من أن يقال لما
  الفترّاء اللعوة السواد حول -لمة المدى وبه سمى ذولعوة وهوقيل من أقيال حير ويقال مابها
  لاعى قروأى ماجح امن يلحس عسامعناهما بها أحد عن ابن الاعرابى" ويقال خرجنا نتلعى أى
  نأخذ اللهاع وهو أول النبت وأصله نتلعع فكرهواثلات عيذات فأبدلوا الثالثة ياء وألعت
  الارض أخرجت اللعاع وتاعى العسل تعقد ⁦(لغا)⁩ لغا يلفولغوا أى قال باطلا يقال لغوت
  باليميز ونياح السكاب لغوأيضا وقال * فلا تلفى لغيرهم كلاب• أى لا تقتنى كلاب غيرهم
  ولغى بالسكسر يافى افامثله وقال • عن اللغاورفث التسكلم• واللغا الصوت مثل الوغا
  ويقال أيضالغى به يلغى لغا أى لهج به وافى بالشراب أكثرمنه وألغيت الشى أبطلته وكان
  ابن عباس رضى اللّٰه عنهما يلغى طلاق المكره وألغاه من العدد أى ألقاه منه واللاغية
  اللغو قال تعالى لا تسمع فيه الاغية أى كلذ ذات اغووه ومثل تامر ولاين اصاحب التمر واللبن
  واللغوفى الايمان مالا يعقدء ليه القاب كقول الرجل فى كلامه يلى واللّٰه ولا والقه واللغو
  مالايعدّ من أولاد الابل فى دية أوغبرهالصغرها وقال
  ويهلك بينها المرئى لغوا • كما ألغيت فى الدية الحوارا
  واللغة أصلها لغى أولغووالهاء عوض وجعهالفى مثل برة وبرى ولغات أيضا وقال بعضهم
  -عمت اغاتهم بفتح التاءوشبهها بالتاء التى يوقف عليها بالها والنسسبة "ليها لغوىّ ولا تقل
  لغواما) الافاء الخسيس من الشى وكل شي يسير -قيرفه ولفاء وقال
  وما أنا بالضعيف فتظلونى • ولا حظى اللفاء ولا الخسيس
  يالدضى فلان من الوفاء باللفاء أى من حقه الوافر بالقليل وتقول منه لفاه-قه أى بخس
  وألفيت الذى وجدته وتلافيته تداركته⁦(فى)⁩ اتيته اقاء بالدواقى بالضم والقصر واقيا
  بالتنديد ولقيانا وليانة واحدة واقية واحدة واقاءة واحدة قال ولا تقل لقاة فانم امولدة
  وليست حر كلام العرب وألقيته أى طرحته تقول ألسه من يدك وألق به من يدك وألقيت
  ١ليه
