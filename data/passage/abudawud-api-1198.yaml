label: { ar: "سنن أبي داود 1198 — ما فُرض على الناس", en: "Sunan Abi Dawud 1198 — what was made obligatory on people", ur: "سنن ابی داؤد 1198 — جو لوگوں پر فرض کیا گیا", fr: "Sunan Abi Dawud 1198 — ce qui a été imposé aux gens", es: "Sunan Abi Dawud 1198 — lo que se impuso a la gente", tr: "Sunan Abi Davud 1198 — İnsanlara farz olanlar", id: "Sunan Abi Dawud 1198 — Apa yang wajib bagi manusia" }
text: "حَدَّثَنَا الْقَعْنَبِيُّ، عَنْ مَالِكٍ، عَنْ صَالِحِ بْنِ كَيْسَانَ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ، -ا - قَالَتْ فُرِضَتِ الصَّلاَةُ رَكْعَتَيْنِ رَكْعَتَيْنِ فِي الْحَضَرِ وَالسَّفَرِ فَأُقِرَّتْ صَلاَةُ السَّفَرِ وَزِيدَ فِي صَلاَةِ الْحَضَرِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1198، يرد فيه ذكر ما فُرض على الناس. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 1198 (Prayer (Kitab Al-Salat): Detailed Rules of Law about the Prayer during Journey), whose wording mentions what was made obligatory on people. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 1198، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 1198, dont le texte mentionne ce qui a été imposé aux gens. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 1198, cuyo texto menciona lo que se impuso a la gente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 1198 numaralı hadis, insanların farz olan işlerini anlatmaktadır. Bu hadis, farz olan görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte ele alan bir araştırmacı tarafından derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1198, menyebutkan apa yang wajib dilakukan oleh manusia. Hadits ini disusun oleh seorang peneliti yang membahas kewajiban-kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
