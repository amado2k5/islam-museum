text: "… كرب، عن رسول اللّٰه وَليقِ قال : ألا أني اوتيتُ الكتاب ومثله معه ألا يوشك رجل شبعانُ على أريكته يقول : عليكم بهذا القرآن فما وجدتم فيه من حلال فأحلوه وما وجدتم فيه من حرام فحرموه ألا لا يحل لكم …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 4، ص 553، يذكر الحلال، وما أُحل، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 4, p. 553, that mentions the lawful, what was made lawful, what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 4، ص 553 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
