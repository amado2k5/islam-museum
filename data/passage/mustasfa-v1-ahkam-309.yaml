text: "… أو لم يأت بالجميع، فكيف يتعين واحد في علم اللّه - تعالى -!. فإن قيل: فلم لا يجوز أن يوجب على أحد شخصين لا بعينه، ولم قلتم: بأن فرض الكفاية على الجميع مع أن الوجوب يسقط بفعل واحد. قلنا: لأن …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 309، يرد فيه ذكر الفرض، وفرض الكفاية، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 309, whose wording mentions the obligatory (fard), the communal obligation (fard kifaya), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 309 کا اقتباس جس میں فرض، فرضِ کفایہ، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, vol. 1 de al-Ghazali, p. 309, dont le texte mentionne l'obligatoire (fard), l'obligation collective (fard kifaya), l'obligation (wujub), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, vol. 1 de al-Ghazali, p. 309, cuyo texto menciona lo obligatorio (fard), la obligación colectiva (fard kifaya), la obligatoriedad (wujub), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin 1. cildinin 309. sayfasından, farz olan ameller, toplumsal yükümlülükler ve yasal olarak sorumlu bir kişiden beklenenler hakkında bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Jilid 1, halaman 309, yang membahas tentang amalan wajib, kewajiban masyarakat, dan apa yang dituntut dari seseorang yang bertanggung jawab secara hukum; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
