label: { ar: "صحيح مسلم 4739 — الأب والأبوة", en: "Sahih Muslim 4739 — the father and fatherhood", ur: "صحیح مسلم 4739 — باپ اور والدیت", es: "Sahih Muslim 4739 — El padre y la paternidad", fr: "Sahih Muslim 4739 — Le père et la paternité" }
text: "… عَنْ عُرْوَةَ، عَنْ أَبِي حُمَيْدٍ السَّاعِدِيِّ، قَالَ اسْتَعْمَلَ النَّبِيُّ ابْنَ اللُّتْبِيَّةِ - رَجُلاً مِنَ الأَزْدِ - عَلَى الصَّدَقَةِ فَجَاءَ بِالْمَالِ فَدَفَعَهُ إِلَى النَّبِيِّ فَقَالَ هَذَا مَالُكُمْ وَهَذِهِ هَدِيَّةٌ أُهْدِيَتْ لِي. فَقَالَ لَهُ النَّبِيُّ \" أَفَلاَ قَعَدْتَ فِي بَيْتِ أَبِيكَ وَأُمِّكَ فَتَنْظُرَ أَيُهْدَى إِلَيْكَ أَمْ لاَ \". ثُمَّ قَامَ النَّبِيُّ خَطِيبًا. ثُمَّ ذَكَرَ نَحْوَ حَدِيثِ سُفْيَانَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4739، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4739 (The Book on Government), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4739، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 4739 (El Libro del Gobierno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 4739 (Le Livre du gouvernement), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
