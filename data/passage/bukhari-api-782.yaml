label: { ar: "صحيح البخاري 782 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 782 — forgiveness of past sins", ur: "صحیح بخاری 782 — پچھلے گناہوں کی مغفرت", es: "Sahih al-Bukhari 782 — Perdón de los pecados pasados", fr: "Sahih al-Bukhari 782 — pardon des péchés passés", tr: "Sahih el-Buhari 782 — Geçmiş günahların affı", id: "Sahih al-Bukhari 782 — Pengampunan dosa masa lalu" }
text: "… سُمَىٍّ، مَوْلَى أَبِي بَكْرٍ عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِذَا قَالَ الإِمَامُ {غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلاَ الضَّالِّينَ} فَقُولُوا آمِينَ. فَإِنَّهُ مَنْ وَافَقَ قَوْلُهُ قَوْلَ الْمَلاَئِكَةِ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \". تَابَعَهُ مُحَمَّدُ بْنُ عَمْرٍو عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ وَنُعَيْمٌ الْمُجْمِرُ عَنْ أَبِي هُرَيْرَةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 782، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 782 (Call to Prayers (Adhaan)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 782، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 782 (Llamada a la oración (Adhan)), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 782 (Appel à la prière (Adhan)), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sahih el-Buhari'de 782 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 782, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
