label: { ar: "الموطأ 446 — بلاغ عن سعيد بن المسيب: لا يخرج من المسجد بعد النداء إلا منافق", en: "Muwatta 446", es: "Muwatta 446", fr: "Muwatta 446", ur: "موطا 446", tr: "El-Muvatta 446 — Said ibn el-Musayyab'dan rivayet: Ezan okunduktan sonra mescitten çıkan kimse, münafık olanlardan başkası değildir.", id: "Al-Muwatta 446 — Sebuah riwayat dari Sa’id ibn al-Musayyab: Tidak seorang pun meninggalkan masjid setelah azan berkumandang kecuali orang munafik." }
text: "لا يخرج أحد من المسجد بعد النداء إلا أحد يريد الرجوع إليه إلا منافق"
summary:
  ar: "بلاغ في باب انتظار الصلاة والمشي إليها: يروي مالك أنه بلغه أن سعيد بن المسيب قال: يقال لا يخرج أحد من المسجد بعد النداء، إلا من يريد الرجوع إليه، إلا منافق. وينقل المحقق عن ابن عبد البر أن هذا لا يقال من جهة الرأي ولا يكون إلا توقيفاً وأنه روي معناه مسنداً ⁦(التمهيد 24/212)⁩، ويذكر حديث أبي الشعثاء أن رجلاً خرج من المسجد بعد الأذان فقال أبو هريرة: أما هذا فقد عصى أبا القاسم، عند مسلم (2/124) وأبي داود (536) والترمذي (204) وابن ماجه (733) والنسائي. {cite:muwatta-maruf-1997 p.229} {cite:muwatta-maruf-1997 p.230}"
  tr: "Namazı beklemek ve namaza yürümekle ilgili bir rivayet: Malik, Sa'id ibn al-Musayyab'ın şöyle dediğini işittiğini aktarır: \"Namaz çağrısından sonra mescitten ayrılmaması gereken kişi, münafık olandır.\" Araştırmacı, İbn Abd al-Barr'ın bunun bir görüş değil, ilahi bir hüküm olduğunu ve anlamının bir isnad zinciriyle rivayet edildiğini söylediğini aktarır (el-Tamhid 24/212). Ayrıca, bir adamın ezandan sonra mescidi terk ettiğini ve Ebu Hurayra'nın \"Bu adam Ebu el-Kâsım'a (Peygamber'e) isyan etmiştir\" dediğini, Müslim (2/124), Ebu Davud (536), Tirmizi (204), İbn Majah (733) ve Nesai'nin rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.229} {cite:muwatta-maruf-1997 s.230}"
  id: "Sebuah riwayat mengenai menunggu salat dan berjalan menuju salat: Malik meriwayatkan bahwa ia mendengar bahwa Sa'id ibn al-Musayyab berkata: \"Dikatakan bahwa tidak seorang pun boleh meninggalkan masjid setelah azan berkumandang kecuali orang yang berniat untuk kembali ke masjid, kecuali orang munafik.\" Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa ini bukanlah pernyataan pendapat tetapi lebih merupakan hukum yang diwahyukan secara ilahi, dan maknanya telah diriwayatkan dengan sanad (al-Tamhid 24/212). Ia menyebutkan hadits Abu al-Sha'tha' bahwa seorang pria meninggalkan masjid setelah azan berkumandang, dan Abu Hurayrah berkata: \"Orang ini telah durhaka kepada Abu al-Qasim (Nabi),\" sebagaimana diriwayatkan oleh Muslim (2/124), Abu Dawud (536), al-Tirmidhi (204), Ibn Majah (733), dan al-Nasa'i. {kutip:muwatta-maruf-1997 hal.229} {kutip:muwatta-maruf-1997 hal.230}"
