label: { ar: "الموطأ 446 — بلاغ عن سعيد بن المسيب: لا يخرج من المسجد بعد النداء إلا منافق", en: "Muwatta 446" }
text: "لا يخرج أحد من المسجد بعد النداء إلا أحد يريد الرجوع إليه إلا منافق"
summary:
  ar: "بلاغ في باب انتظار الصلاة والمشي إليها: يروي مالك أنه بلغه أن سعيد بن المسيب قال: يقال لا يخرج أحد من المسجد بعد النداء، إلا من يريد الرجوع إليه، إلا منافق. وينقل المحقق عن ابن عبد البر أن هذا لا يقال من جهة الرأي ولا يكون إلا توقيفاً وأنه روي معناه مسنداً (التمهيد 24/212)، ويذكر حديث أبي الشعثاء أن رجلاً خرج من المسجد بعد الأذان فقال أبو هريرة: أما هذا فقد عصى أبا القاسم، عند مسلم (2/124) وأبي داود (536) والترمذي (204) وابن ماجه (733) والنسائي. {cite:muwatta-maruf-1997 p.229} {cite:muwatta-maruf-1997 p.230}"
