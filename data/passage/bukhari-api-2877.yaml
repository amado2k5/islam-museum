label: { ar: "صحيح البخاري 2877 — ضحك وتبسم", en: "Sahih al-Bukhari 2877 — laughter and smiling", ur: "صحیح بخاری 2877 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 2877 — rire et sourire", es: "Sahih al-Bujari 2877 — risa y sonrisa", tr: "Sahih el-Buhari 2877 — Kahkaha ve Gülümseme", id: "Sahih al-Bukhari 2877 — Tawa dan Senyum" }
text: "… مُعَاوِيَةُ بْنُ عَمْرٍو، حَدَّثَنَا أَبُو إِسْحَاقَ، عَنْ عَبْدِ اللَّهِ بْنِ عَبْدِ الرَّحْمَنِ الأَنْصَارِيِّ، قَالَ سَمِعْتُ أَنَسًا ـ يَقُولُ دَخَلَ رَسُولُ اللَّهِ عَلَى ابْنَةِ مِلْحَانَ فَاتَّكَأَ عِنْدَهَا، ثُمَّ ضَحِكَ فَقَالَتْ لِمَ تَضْحَكُ يَا رَسُولَ اللَّهِ فَقَالَ نَاسٌ مِنْ أُمَّتِي يَرْكَبُونَ الْبَحْرَ الأَخْضَرَ فِي سَبِيلِ اللَّهِ، مَثَلُهُمْ مَثَلُ الْمُلُوكِ عَلَى الأَسِرَّةِ . فَقَالَتْ يَا رَسُولَ اللَّهِ، ادْعُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2877، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 2877, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 2877، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2877, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 2877, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 2877 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2877, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
