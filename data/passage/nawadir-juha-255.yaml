label: { ar: "نوادر جحا الكبرى، ص 125 — «جئت بالورقة الخالية مستعجلاً، فأرجو عفوك»", en: "Nawadir Juha al-Kubra, p. 125 — 'I Came in a Hurry with the Blank Paper, So Pardon Me'", ur: "نوادر جحا الکبریٰ، ص 125 — «میں جلدی میں خالی کاغذ لے آیا، معاف کیجیے»", fr: "Nawadir Juha al-Kubra, p. 125 — « Je suis venu en hâte avec la feuille vide, pardonnez-moi »", es: "Nawadir Juha al-Kubra, p. 125 — «Vine deprisa con el papel en blanco, perdóneme»", tr: "Juha'nın Büyük Fıkraları, s. 125 — “Boş kağıdı aceleyle getirdim, bu yüzden affınızı rica ediyorum.”", id: "Anekdot Hebat Juha, hlm. 125 — “Saya datang dengan kertas kosong ini terburu-buru, jadi saya mohon maaf.”" }
text: "… جئت بالورقة الخالية مستعجلاً، فأرجو عفوك أقامٍ بعض جيرانِهِ وليمة عرس، وفيما هم على الطعام، جاء الشيخ، وبيده ظرفٌ ودقِّ الباب، فقالوا : مَن هذا؟ فأجابهم الشيخ: معي مكتوب لصاحب البيت. فأدخله الخادم، وبعد سلام قدَّم المكتوب إلى صاحب البيت، …"
summary:
  ar: "وصل جحا إلى عرس بكتاب موجه إلى المضيف وأكل بنهم، فرأى المضيف أن الكتاب فارغ، فقال جحا إنه جاء مستعجلاً قبل أن يكتبه. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  en: "Juha arrives at a wedding with a letter for the host and eats eagerly. The host sees that the letter is blank, and Juha says he came in a hurry before he could write it. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  ur: "جحا ایک شادی میں میزبان کے نام ایک خط لے کر پہنچتا ہے اور شوق سے کھاتا ہے۔ میزبان دیکھتا ہے کہ خط خالی ہے تو جحا کہتا ہے کہ وہ جلدی میں آ گیا تھا اور لکھ نہ سکا۔ {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  fr: "Juha arrive à un mariage avec une lettre pour l'hôte et mange avec appétit. L'hôte voit que la lettre est blanche, et Juha dit qu'il est venu en hâte avant d'avoir pu l'écrire. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  es: "Juha llega a una boda con una carta para el anfitrión y come con ganas. El anfitrión ve que la carta está en blanco, y Juha dice que vino con prisa antes de poder escribirla. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  tr: "Juha, ev sahibine hitaben yazılmış bir mektupla bir düğüne geldi ve iştahla yemek yedi. Ev sahibi mektubun boş olduğunu fark edince, Juha mektubu yazmadan önce aceleyle geldiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 125}"
  id: "Juha tiba di sebuah pesta pernikahan dengan membawa surat yang ditujukan kepada tuan rumah dan makan dengan lahap. Tuan rumah memperhatikan bahwa surat itu kosong, jadi Juha mengatakan bahwa ia datang terburu-buru sebelum menulisnya. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
