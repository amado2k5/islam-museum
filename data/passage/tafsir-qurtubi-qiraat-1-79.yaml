text: "… صُفْرة، وغيرِهما : هذه القراءاتُ السَّبعُ التي تُنسبُ لهؤلاء القرَّاءِ السبعةِ، ليست هي الأحرفَ السَّبعةَ التي اتَّسعتِ الصحابةُ في القراءة بها، وإنَّما هي راجعةٌ إلى حرف واحد من تلك السَّبعةِ، وهو الذي جمعَ عليه عثمانُ المصحفَ، ذكره ابنُ النَّحاس وغيرُه. …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 1، ص 79، يذكر الأحرف السبعة، وقراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 1, p. 79, that mentions the seven ahruf, the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 1، ص 79 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Qurtubi, al-Jami' li-Ahkam al-Qur'an, volumen 1, pág. 79, que menciona los siete ahruf, las lecturas del Corán, los lectores, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
