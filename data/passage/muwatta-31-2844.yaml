label: { ar: "الموطأ 2844 — أبو الحباب سعيد بن يسار: من تصدق بصدقة من كسب طيب يربيها الله كالفلو", en: "Muwatta 2844", es: "Muwatta 2844", fr: "Muwatta 2844", ur: "موطا 2844", tr: "El-Muvatta 2844 — Ebu el-Habab Said bin Yasar: Kim helal kazançtan sadaka verirse, Allah onu bir tay gibi çoğaltır.", id: "Al-Muwatta 2844 — Abu al-Habab Saeed bin Yasar: Barang siapa yang memberikan sedekah dari penghasilan yang halal, Allah akan menambahnya seperti seekor anak kuda." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد، عن أبي الحباب سعيد بن يسار، أن رسول الله قال: من تصدق بصدقة من كسب طيب، ولا يقبل الله إلا طيبا، كان إنما يضعها في كف الرحمن يربيها كما يربي أحدكم فلوه أو فصيله، حتى تكون مثل الجبل. ويذكر المحقق قول ابن عبد البر أن هذه الرواية في الموطأ مرسلة، وأن الحديث صحيح مجتمع على صحته، وأنه يروى موصولا عن أبي هريرة. {cite:muwatta-maruf-1997 p.594}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Ebu el-Habab Sa'id ibn Yasar'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kim helal kazançtan sadaka verirse -ki Allah sadece helal olanı kabul eder- onu Rahman'ın eline verir; o da onu, sizden birinin tayını veya genç devesini beslediği gibi besler, dağ gibi olana kadar.\" Araştırmacı, İbn Abd el-Barr'ın, el-Muvatta'daki bu rivayetin mursal (isnak zincirinde eksik bir halka bulunan) olduğunu, hadisin sahih ve oybirliğiyle sahih olduğunu ve Ebu Hurayra'dan isnad zinciriyle nakledildiğini belirttiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.594}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abu al-Habab Sa'id ibn Yasar, bahwa Rasulullah SAW bersabda: \"Barangsiapa memberi sedekah dari penghasilan yang halal—dan Allah hanya menerima apa yang halal—Ia menyerahkannya kepada Yang Maha Penyayang, yang memeliharanya seperti salah seorang dari kalian memelihara anak kuda atau unta muda, hingga menjadi seperti gunung.\" Peneliti menyebutkan pernyataan Ibnu 'Abd al-Barr bahwa riwayat dalam al-Muwatta' ini adalah mursal (riwayat dengan mata rantai yang hilang dalam sanad), bahwa hadits tersebut sahih dan disepakati secara bulat sebagai sahih, dan bahwa riwayat tersebut memiliki sanad yang terhubung dari Abu Hurayrah. {cite:muwatta-maruf-1997 p.594}"
