label: { ar: "الموطأ 2844 — أبو الحباب سعيد بن يسار: من تصدق بصدقة من كسب طيب يربيها الله كالفلو", en: "Muwatta 2844" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد، عن أبي الحباب سعيد بن يسار، أن رسول الله قال: من تصدق بصدقة من كسب طيب، ولا يقبل الله إلا طيبا، كان إنما يضعها في كف الرحمن يربيها كما يربي أحدكم فلوه أو فصيله، حتى تكون مثل الجبل. ويذكر المحقق قول ابن عبد البر أن هذه الرواية في الموطأ مرسلة، وأن الحديث صحيح مجتمع على صحته، وأنه يروى موصولا عن أبي هريرة. {cite:muwatta-maruf-1997 p.594}"
