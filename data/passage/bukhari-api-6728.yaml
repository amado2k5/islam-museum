label: { ar: "صحيح البخاري 6728 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 6728 — what was left behind: estate and inheritance", ur: "صحیح بخاری 6728 — ترکہ اور میراث", es: "Sahih al-Bukhari 6728 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 6728 — Ce qui a été laissé derrière: biens et héritage" }
text: "… بَيْنِي وَبَيْنَ هَذَا. قَالَ أَنْشُدُكُمْ بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ هَلْ تَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". يُرِيدُ رَسُولُ اللَّهِ نَفْسَهُ. فَقَالَ الرَّهْطُ قَدْ قَالَ ذَلِكَ. فَأَقْبَلَ عَلَى عَلِيٍّ وَعَبَّاسٍ فَقَالَ هَلْ تَعْلَمَانِ أَنَّ رَسُولَ اللَّهِ قَالَ ذَلِكَ قَالاَ قَدْ قَالَ ذَلِكَ. قَالَ عُمَرُ فَإِنِّي أُحَدِّثُكُمْ عَنْ هَذَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6728، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6728 (Laws of Inheritance (Al-Faraa'id)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6728، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6728 (Leyes de la herencia (Al-Faraa'id)), menciona lo que se dejó como legado: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6728 (Lois de l'héritage), mentionne ce qui a été laissé derrière soi: les biens et l'héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
