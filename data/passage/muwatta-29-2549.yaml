label: { ar: "الموطأ 2549 — مالك: من عليه القتل فأصاب حدا لا يؤخذ به، والفرية تثبت", en: "Muwatta 2549", es: "Muwatta 2549", fr: "Muwatta 2549", ur: "موطا 2549", tr: "Al-Muwatta 2549 — Malik: Cinayetten sorumlu olan ve ölüm cezası gerektiren bir suç işleyen kimse sorumlu tutulmaz ve yanlış itham ispatlanmış olur." }
summary:
  ar: "قال مالك في الرجل يكون عليه القتل فيصيب حدا من الحدود: أنه لا يؤخذ به، لأن القتل يأتي على ذلك كله، إلا الفرية فإنها تثبت على من قيلت له؛ فأرى أن يُجلد المقتول الحد قبل أن يُقتل، ثم يُقتل. ولا أرى أن يُقاد منه في شيء من الجراح إلا القتل؛ لأن القتل يأتي على ذلك كله. {cite:muwatta-maruf-1997 p.443}"
  tr: "Malik, öldürülme cezası gerektiren bir suç işleyen ancak bu suçun cezası önceden belirlenmiş bir cezayı gerektiriyorsa, bunun için sorumlu tutulmaması gerektiğini söylemiştir; çünkü öldürme, iftira hariç, diğer tüm suçlardan önceliklidir. İftira ise, iftiranın kime söylendiği kanıtlanır. Bu nedenle, öldürülen kişinin idam edilmeden önce önceden belirlenmiş ceza için kırbaçlanması ve ardından idam edilmesi gerektiğine inanıyorum. Cinayet dışında herhangi bir zarardan sorumlu tutulmaması gerektiğine inanıyorum, çünkü öldürme, diğer tüm suçlardan önceliklidir. {cite:muwatta-maruf-1997 s.443}"
  id: "Malik berkata mengenai seseorang yang pantas dibunuh tetapi melakukan kejahatan yang dihukum dengan hukuman yang telah ditentukan: ia tidak dimintai pertanggungjawaban atas hal itu, karena pembunuhan lebih diutamakan daripada semua itu, kecuali fitnah, yang terbukti terhadap orang yang menjadi sasaran fitnah tersebut. Oleh karena itu, saya percaya orang yang dibunuh harus dicambuk dengan hukuman yang telah ditentukan sebelum dieksekusi, dan kemudian ia harus dieksekusi. Saya tidak percaya ia harus dimintai pertanggungjawaban atas cedera apa pun selain pembunuhan, karena pembunuhan lebih diutamakan daripada semua itu. {cite:muwatta-maruf-1997 p.443}"
