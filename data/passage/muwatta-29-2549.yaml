label: { ar: "الموطأ 2549 — مالك: من عليه القتل فأصاب حدا لا يؤخذ به، والفرية تثبت", en: "Muwatta 2549" }
summary:
  ar: "قال مالك في الرجل يكون عليه القتل فيصيب حدا من الحدود: أنه لا يؤخذ به، لأن القتل يأتي على ذلك كله، إلا الفرية فإنها تثبت على من قيلت له؛ فأرى أن يُجلد المقتول الحد قبل أن يُقتل، ثم يُقتل. ولا أرى أن يُقاد منه في شيء من الجراح إلا القتل؛ لأن القتل يأتي على ذلك كله. {cite:muwatta-maruf-1997 p.443}"
