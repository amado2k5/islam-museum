text: "… له مع اليهود أربعُ غزوات، أولها : غزوة بني قينقاع بعد بدر، والثانية: بني النضير بعد أحد، والثالثة: قُريظة بعد الخندق، والرابعة: خيبر بعد الحُديبية. فصل القنوت وقنت رسول اللَّه ل شَهْرَاً يَدْعُو عَلَى الَّذِينَ قَتَلُوا القُرَّاء أَصْحَابَ بِثُرِ مَعُونَةَ …"
