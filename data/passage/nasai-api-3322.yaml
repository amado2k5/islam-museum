label: { ar: "سنن النسائي 3322 — ما حُرّم", en: "Sunan al-Nasa'i 3322 — what was made unlawful", ur: "سنن نسائی 3322 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 3322 — lo que se declaró ilícito" }
text: "… عَنِ ابْنِ جُرَيْجٍ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ عَائِشَةَ، قَالَتْ جَاءَتْ سَهْلَةُ إِلَى رَسُولِ اللَّهِ فَقَالَتْ يَا رَسُولَ اللَّهِ إِنَّ سَالِمًا يَدْخُلُ عَلَيْنَا وَقَدْ عَقَلَ مَا يَعْقِلُ الرِّجَالُ وَعَلِمَ مَا يَعْلَمُ الرِّجَالُ. قَالَ \" أَرْضِعِيهِ تَحْرُمِي عَلَيْهِ بِذَلِكَ \". فَمَكَثْتُ حَوْلاً لاَ أُحَدِّثُ بِهِ وَلَقِيتُ الْقَاسِمَ فَقَالَ حَدِّثْ بِهِ وَلاَ تَهَابُهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 3322، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3322 (The Book of Marriage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3322، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3322 (El Libro del Matrimonio), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
