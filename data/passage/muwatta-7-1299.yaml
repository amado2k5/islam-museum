text: "ونُفِّلوا بَعِيرًا بَعِيرًا"
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله بعث سرية فيها عبد الله بن عمر قبل نجد، فغنموا إبلا كثيرة، فكان سهمانهم اثني عشر بعيرا، أو أحد عشر بعيرا، ونفلوا بعيرا بعيرا. ويذكر المحقق أن يحيى شك بين العددين، وأن ابن عبد البر رأى أن الصواب اثنا عشر بغير شك، وأن مالكا تفرد بالشك. {cite:muwatta-maruf-1997 p.580}"
