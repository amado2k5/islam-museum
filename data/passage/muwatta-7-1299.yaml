label: { ar: "الموطأ 1299 — ابن عمر: بعث النبي سرية فيها عبد الله بن عمر قبل نجد، فغنموا إبلا، فكان سهمانهم اثني عشر بعيرا ونفلوا بعيرا بعيرا", en: "Muwatta 1299", es: "Muwatta 1299", fr: "Muwatta 1299", ur: "موطا 1299", tr: "El-Muvatta 1299 — İbn Ömer: Peygamber, Abdullah ibn Ömer'i de yanına alarak Necd'e bir birlik gönderdi. Develer ele geçirdiler ve paylarına on iki deve düştü; ayrıca bir de deve de fazladan verildi.", id: "Al-Muwatta 1299 — Ibn Umar: Nabi mengirimkan pasukan, termasuk Abdullah ibn Umar, menuju Najd. Mereka menangkap unta, dan bagian mereka adalah dua belas unta, dan mereka diberi satu unta tambahan." }
text: "ونُفِّلوا بَعِيرًا بَعِيرًا"
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله بعث سرية فيها عبد الله بن عمر قبل نجد، فغنموا إبلا كثيرة، فكان سهمانهم اثني عشر بعيرا، أو أحد عشر بعيرا، ونفلوا بعيرا بعيرا. ويذكر المحقق أن يحيى شك بين العددين، وأن ابن عبد البر رأى أن الصواب اثنا عشر بغير شك، وأن مالكا تفرد بالشك. {cite:muwatta-maruf-1997 p.580}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan naklederek, Allah Resulü'nün Abdullah ibn Umar'ı da içeren bir birliği Necd'e gönderdiğini rivayet eder. Birçok deve ele geçirdiler ve paylarına on iki veya on bir deve düştü; ayrıca her birine fazladan bir deve verildi. Araştırmacı, Yahya'nın iki sayı arasında kararsız kaldığını, İbn Abd al-Barr'ın ise on ikiyi şüphe duymadan doğru sayı olarak kabul ettiğini ve Malik'in bu kararsızlığında yalnız olduğunu belirtir. {cite:muwatta-maruf-1997 s.580}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa Rasulullah SAW mengutus sekelompok pasukan, termasuk Abdullah ibn Umar, menuju Najd. Mereka menangkap banyak unta, dan bagian mereka adalah dua belas unta, atau sebelas unta, dan mereka masing-masing diberi satu unta tambahan. Peneliti menyebutkan bahwa Yahya ragu-ragu antara kedua angka tersebut, dan bahwa Ibnu Abd al-Barr menganggap dua belas sebagai angka yang benar tanpa keraguan, dan bahwa Malik sendirian dalam keraguannya. {cite:muwatta-maruf-1997 p.580}"
