label: { ar: "الموطأ 720 — بلاغ: أبو بكر: لو منعوني عقالاً لجاهدتهم عليه", en: "Muwatta 720", es: "Muwatta 720", fr: "Muwatta 720", ur: "موطا 720", tr: "El-Muvatta 720 — Rivayet: Ebu Bekir: Bana bir devenin ayak bağını bile esirgeselerdi, onun için onlarla savaşırdım.", id: "Al-Muwatta 720 — Riwayat: Abu Bakr: Jika mereka menahan tali kekang unta sekalipun dariku, aku akan melawan mereka untuk mendapatkannya." }
text: "لو منعوني عقالاً لجاهدتهم عليه"
summary:
  ar: "أول حديث في باب ما جاء في أخذ الصدقات والتشديد فيها. بلاغ يرويه مالك أنه بلغه أن أبا بكر الصديق قال: لو منعوني عقالاً لجاهدتهم عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن هذه قطعة من حديث عمر بن الخطاب المشهور الذي رواه الزهري عن عبيد الله بن عبد الله بن عتبة عن أبي هريرة عن عمر، عند أحمد والبخاري ⁦(2/131 و147 و9/19 و115)⁩ ومسلم (1/38) وأبي داود (1556) والترمذي (2607) والنسائي (5/14). {cite:muwatta-maruf-1997 p.362}"
  tr: "Zekatın toplanması ve bu konudaki titizlik hakkında rivayet edilenler bölümündeki ilk hadis. Malik'in rivayet ettiği bir hadiste, Ebu Bekir es-Siddik'in şöyle dediğini işittiği belirtilir: \"Benden bir ipi bile esirgeseler, onun için onlarla savaşırım.\" Editör, bu hadisin Ebu Mus'ab tarafından Malik'ten rivayet edildiğini ve bunun, Ömer ibn el-Hattab'ın meşhur hadisinin bir parçası olduğunu, bu hadisin Zühri tarafından Ubeydullah ibn Abdullah ibn Utbe'den, o da Ebu Hurayra'dan, o da Ömer'den rivayet edildiğini ve Ahmed, Buhari (2/131, 147, 9/19, 115), Müslim (1/38), Ebu Davud (1556), Tirmizi (2607) ve Nesai'nin (5/14) hadis külliyatlarında bulunduğunu belirtir. {cite:muwatta-maruf-1997 s.362}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai pengumpulan zakat dan keketatan mengenainya. Sebuah riwayat yang dinarasikan oleh Malik menyatakan bahwa ia mendengar Abu Bakar as-Siddiq berkata: \"Jika mereka menahan seutas tali pun dariku, aku akan memerangi mereka untuk mendapatkannya.\" Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan bahwa ini adalah fragmen dari hadits terkenal Umar ibn al-Khattab, yang diriwayatkan oleh az-Zuhri dari Ubaydullah ibn Abdullah ibn Utbah dari Abu Hurayrah dari Umar, dan terdapat dalam kumpulan hadits Ahmad, al-Bukhari (2/131, 147, 9/19, 115), Muslim (1/38), Abu Dawud (1556), at-Tirmidhi (2607), dan an-Nasa'i (5/14). {cite:muwatta-maruf-1997 p.362}"
