text: "لو منعوني عقالاً لجاهدتهم عليه"
summary:
  ar: "أول حديث في باب ما جاء في أخذ الصدقات والتشديد فيها. بلاغ يرويه مالك أنه بلغه أن أبا بكر الصديق قال: لو منعوني عقالاً لجاهدتهم عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن هذه قطعة من حديث عمر بن الخطاب المشهور الذي رواه الزهري عن عبيد الله بن عبد الله بن عتبة عن أبي هريرة عن عمر، عند أحمد والبخاري (2/131 و147 و9/19 و115) ومسلم (1/38) وأبي داود (1556) والترمذي (2607) والنسائي (5/14). {cite:muwatta-maruf-1997 p.362}"
