text: "وقال الآخر : واكتسَى الرَّأْسُ من بياضٍ قِناعا أصبح الشّيْب فى المفارق شاعا ثمّ ولَى الشبابُ إلّا قليلاً ثم يأبى القليلُ إلّا نِزَاعا. قال: وقال رجلٌ لأشعبَ : ما شكرتَ معروفى عندك. قال : لأنّ معروفَك جاء من عند غير …"
