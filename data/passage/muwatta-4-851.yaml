label: { ar: "الموطأ 851 — بلغ مالكاً أن أنس بن مالك كبر حتى كان لا يقدر على الصيام، فكان يفتدي", en: "Muwatta 851", es: "Muwatta 851", fr: "Muwatta 851", ur: "موطا 851", tr: "El-Muvatta 851 — Malik'e, Enes bin Malik'in artık oruç tutamayacak kadar yaşlandığı ve bu nedenle fidyeyi ödeyeceği haberi ulaştı.", id: "Al-Muwatta 851 — Sampai kepada Malik bahwa Anas bin Malik telah sangat tua sehingga ia tidak lagi mampu berpuasa, maka ia akan membayar tebusan." }
summary:
  ar: "أول حديث في باب فدية من أفطر في رمضان من علة. بلاغ يرويه مالك أنه بلغه أن أنس بن مالك كبر حتى كان لا يقدر على الصيام، فكان يفتدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (809)، وأن ابن سعد (7/25) رواه عن يزيد بن هارون عن حميد الطويل عن بعض آل أنس، أن أنس بن مالك في العام الذي توفي فيه لم يستطع الصوم فأطعم ثلاثين مسكيناً خبزاً ولحماً. {cite:muwatta-maruf-1997 p.412} {cite:muwatta-maruf-1997 p.413}"
  tr: "Ramazan ayında hastalık nedeniyle orucu bozmanın kefaretiyle ilgili bölümdeki ilk hadis. Malik'ten rivayet edilen bir hadiste, Enes ibn Malik'in yaşlanıp oruç tutamayacak hale geldiği ve bu yüzden kefaret ödediği anlatılır. Editör, bu hadisin Malik'ten Ebu Mus'ab (809) tarafından, İbn Sa'd'ın (7/25) ise Yezid ibn Harun'dan, o da Humaid al-Tawil'den, o da Enes'in ailesinden bazı kişilerden rivayet ettiğini, Enes ibn Malik'in vefat ettiği yıl oruç tutamadığı için otuz fakire ekmek ve et yedirdiğini belirtir. {cite:muwatta-maruf-1997 s.412} {cite:muwatta-maruf-1997 s.413}"
  id: "Hadits pertama dalam bab tentang penebusan dosa karena sakit yang menyebabkan batalnya puasa di bulan Ramadhan. Sebuah riwayat yang dinarasikan oleh Malik menyatakan bahwa ia mendengar bahwa Anas ibn Malik telah sangat tua sehingga ia tidak mampu berpuasa, sehingga ia akan membayar penebusan dosa. Editor menyebutkan bahwa hadits ini dinarasikan dari Malik oleh Abu Mus'ab (809), dan bahwa Ibn Sa'd (7/25) meriwayatkannya dari Yazid ibn Harun, dari Humaid al-Tawil, dari beberapa anggota keluarga Anas, bahwa Anas ibn Malik, pada tahun kematiannya, tidak mampu berpuasa, sehingga ia memberi makan tiga puluh orang miskin dengan roti dan daging. {cite:muwatta-maruf-1997 p.412} {cite:muwatta-maruf-1997 p.413}"
