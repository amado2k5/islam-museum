label: { ar: "الموطأ 851 — بلغ مالكاً أن أنس بن مالك كبر حتى كان لا يقدر على الصيام، فكان يفتدي", en: "Muwatta 851" }
summary:
  ar: "أول حديث في باب فدية من أفطر في رمضان من علة. بلاغ يرويه مالك أنه بلغه أن أنس بن مالك كبر حتى كان لا يقدر على الصيام، فكان يفتدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (809)، وأن ابن سعد (7/25) رواه عن يزيد بن هارون عن حميد الطويل عن بعض آل أنس، أن أنس بن مالك في العام الذي توفي فيه لم يستطع الصوم فأطعم ثلاثين مسكيناً خبزاً ولحماً. {cite:muwatta-maruf-1997 p.412} {cite:muwatta-maruf-1997 p.413}"
