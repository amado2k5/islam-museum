  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 621 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
