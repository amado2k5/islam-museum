text: "… كان لصفوان بن محرز سرب يبكي فيه، وكان يقول : قد أرى مكان الشهادة لو تشايعني نفسي. عن الحسن قال: لقيت أقواماً كانوا فيما أحل اللّٰه لهم أزهد منكم فيما حرم اللّٰه عليكم، ولقد لقيت أقواماً كانوا من حسناتهم أشفق …"
summary:
