label:
  ar: "مسلم 188 — أدنى أهل الجنة منزلة: هو لك وعشرة أمثاله"
  en: "Muslim 188 — The lowest rank in Paradise: it is yours and ten times as much"
  ur: "مسلم 188 — جنت کا سب سے کم درجہ: یہ تمہارا اور اس جیسا دس گنا"
text: "إن أدنى أهل الجنة منزلة رجل صرف الله وجهه عن النار قبل الجنة ومثل له شجرة ذات ظل فقال أى رب قدمني إلى هذه الشجرة أكون في ظلها . وساق الحديث بنحو حديث ابن مسعود ولم يذكر فيقول يا ابن …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 188: أدنى أهل الجنة منزلة: هو لك وعشرة أمثاله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 188: The lowest rank in Paradise: it is yours and ten times as much. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 188: جنت کا سب سے کم درجہ: یہ تمہارا اور اس جیسا دس گنا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
