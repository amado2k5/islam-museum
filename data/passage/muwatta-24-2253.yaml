label: { ar: "الموطأ 2253 — مالك: بلغه عن المقبري أنه قيل لأبي هريرة عن الرجل تكون عليه رقبة، هل يعتق فيها ابن زنا؟ فقال: نعم، ذلك يجزئه", en: "Muwatta 2253", es: "Muwatta 2253", fr: "Muwatta 2253", ur: "موطا 2253", tr: "El-Muvatta 2253 — Malik: El-Maqbari'den rivayet edildiğine göre, Ebu Hurayra'ya bir köleye borcu olan bir adama, nikahsız doğan bir çocuğu kölesi karşılığında azat edip edemeyeceği sorulmuş. O da şöyle demiş: Evet, bu ona yeter.", id: "Al-Muwatta 2253 — Malik: Diriwayatkan kepadanya dari Al-Maqbari bahwa Abu Hurayrah ditanya tentang seorang laki-laki yang berhutang seorang budak, dapatkah ia membebaskan seorang anak yang lahir di luar nikah sebagai gantinya? Beliau menjawab: Ya, itu sudah cukup baginya." }
summary:
  ar: "قال مالك: وبلغه عن المقبري أنه قيل لأبي هريرة عن الرجل تكون عليه رقبة، هل يعتق فيها ابن زنا؟ فقال أبو هريرة: نعم، ذلك يجزئه. {cite:muwatta-maruf-1997 p.330}"
  tr: "Malik şöyle dedi: El-Maqbari'den rivayet edildiğine göre, Ebu Hurayra'ya bir köleye borcu olan bir adama, borcunu ödemek için nikahsız doğmuş bir çocuğu azat edebilir mi diye sorulmuş. Ebu Hurayra şöyle cevap vermiş: Evet, bu yeterlidir. {cite:muwatta-maruf-1997 s.330}"
  id: "Malik berkata: Diriwayatkan kepadanya dari al-Maqbari bahwa Abu Hurayrah ditanya tentang seorang pria yang berhutang seorang budak; dapatkah ia membebaskan seorang anak yang lahir di luar nikah sebagai pembayaran? Abu Hurayrah menjawab: Ya, itu sudah cukup. {cite:muwatta-maruf-1997 p.330}"
