text: "… هدى إلا فيما جاء به. ولا ريب أنه يجب على كل أحد أن يؤمن بما جاء به الرسول إيمانًا عامَّا مجملا، ولا ريب أن معرفة ما جاء به الرسول على التفصيل فرض على الكفاية، فإن ذلك داخل فى تبليغ ما …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 15، يرد فيه ذكر ما فُرض على الناس، والفرض، وما وجب على كل مسلم، وفرض الكفاية، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 2, p. 15, whose wording mentions what was made obligatory on people, the obligatory (fard), a duty laid on every Muslim, the communal obligation (fard kifaya), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 15 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، جو ہر مسلمان پر لازم ہے، فرضِ کفایہ، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on the Tahawi creed de Ibn Abi al-'Izz, volume numérisé 2, p. 15, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on the Tahawi creed de Ibn Abi al-'Izz, volumen digitalizado 2, p. 15, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), un deber impuesto a cada musulmán, la obligación colectiva (fard kifaya), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
