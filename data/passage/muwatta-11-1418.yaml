label: { ar: "الموطأ 1418 — مالك: سمع أهل العلم أن من أصاب الصيد وأعانه عليه غيره من ماء أو كلب غير معلم، لم يؤكل الصيد إلا أن يقتله سهم الرامي", en: "Muwatta 1418", es: "Muwatta 1418", fr: "Muwatta 1418", ur: "موطا 1418", tr: "El-Muvatta 1418 — Malik: Alimler, bir kimse av hayvanı yakalarken su veya eğitimsiz bir köpek gibi başka birinden yardım alırsa, av hayvanının okçu okuyla öldürülmedikçe yenmesinin caiz olmadığını işitmişlerdir.", id: "Al-Muwatta 1418 — Malik: Para ulama telah mendengar bahwa jika seseorang menangkap buruan dan dibantu oleh orang lain, seperti air atau anjing yang tidak terlatih, maka buruan tersebut tidak boleh dimakan kecuali jika dibunuh oleh panah pemanah." }
summary:
  ar: "يروي مالك أنه سمع أهل العلم يقولون إذا أصاب الرجل الصيد، فأعانه عليه غيره، من ماء أو كلب غير معلم، لم يؤكل ذلك الصيد، إلا أن يكون سهم الرامي قد قتله، أو بلغ مقاتل الصيد، حتى لا يشك أحد في أنه هو قتله، وأنه لا يكون للصيد حياة بعده. {cite:muwatta-maruf-1997 p.636}"
  tr: "Malik, âlimlerin şöyle dediğini duyduğunu aktarır: Eğer bir adam avlanırken su veya eğitimsiz bir köpek gibi başka birinden yardım alırsa, o avın yenmesi caiz değildir, ancak okçunun oku avı öldürmüşse veya avın hayati organlarına isabet ederek avı öldürenin kendisi olduğundan şüphe bırakmamışsa ve av bundan sonra yaşayamayacaksa. {cite:muwatta-maruf-1997 s.636}"
  id: "Malik meriwayatkan bahwa ia mendengar para ulama mengatakan bahwa jika seseorang berburu hewan buruan dan dibantu oleh orang lain, seperti air atau anjing yang tidak terlatih, maka hewan buruan itu tidak boleh dimakan kecuali jika panah pemanah telah membunuhnya, atau mengenai organ vital hewan buruan tersebut, sehingga tidak ada keraguan bahwa dialah yang membunuhnya, dan bahwa hewan buruan itu tidak akan hidup lagi setelah itu. {cite:muwatta-maruf-1997 p.636}"
