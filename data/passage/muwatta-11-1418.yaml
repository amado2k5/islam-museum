label: { ar: "الموطأ 1418 — مالك: سمع أهل العلم أن من أصاب الصيد وأعانه عليه غيره من ماء أو كلب غير معلم، لم يؤكل الصيد إلا أن يقتله سهم الرامي", en: "Muwatta 1418" }
summary:
  ar: "يروي مالك أنه سمع أهل العلم يقولون إذا أصاب الرجل الصيد، فأعانه عليه غيره، من ماء أو كلب غير معلم، لم يؤكل ذلك الصيد، إلا أن يكون سهم الرامي قد قتله، أو بلغ مقاتل الصيد، حتى لا يشك أحد في أنه هو قتله، وأنه لا يكون للصيد حياة بعده. {cite:muwatta-maruf-1997 p.636}"
