text: |-
  • ⁦(باب اللام)⁩.
  ٢٤٩
  وصكذلك الموبل بكسر الباه وقال
  زعمت جوية أنى عبدلها • أسعى بموبلها وأكسبها انظنا
  والموبل أبضا الحزمة من الحطب وحكذلك الوبيل قال طرفة
  عقيلة شيخ كالو بيل ألندد * والوابل المطر الشديد وقد وبلت السماء تبل والارض موبولة
  قال الاخفس ومنه قوله تعالى أخذا وبيلا أى شديد اوضرب وبيل وعذاب وبيل أى شديد
  والوابلة طرف السكتف وهورأس العضد ووبالاسم مالبنى أسد ( ثل الوثل
  بالتحريك الحبل من الليف والوثيل الليف وسحيم بن وثيل ووائلة اسم رجسل ⁦( جل)⁩.
  الوجل الخوف تقول منه وجل وحلاوموجلا بالفتح وهذا موجله بالكسر للموضع ع-لى
  مافسرناه فى وعد وفى المستقبل منه أربع لغات يوجل ويأجسل ويجل وييجل بكسر الياه
  وكذلك فيما أشبهه من باب المثال اذا كان لازما قن قال ياجل جعل الواوألفا
  لفتحة ما قبلها ومن قال ييجل بكسر الياء فهى على لغة بنى أسدفانهم يقولون أنا ايجسل ونمن
  ييجل وأنت تيجل كلها بالكسر وهم لا يكسرون الياء فى يعلم لاستثقالهم الكسر على الياه
  وانما يكسرون فى ييجل لتقوى احدى الداءين بالاخرى ومن قال ييجل بناه على هذه اللغة
  ولكنه فتح الياءكما فتهوها فى يعلم والامر منه ايجل صارت الواويا لكسرة ماقبلها وتقول
  انى منه لا وجل ولا يقال فى المؤنت وحلاء ولكن وجلة حل لوحل بالتحريك الطين
  الرقيق والموحل بالفتح المصدر وبالكسر المكان والاسم على مافسرناه قال الشاعر
  فأصبح العيز ركوداعلى الاوشاز أن يرسذن فى الموحل
  يروى بالفتح والكسر يقول وقفت بقر الوجش على الروابى مخافة الوحل لكثرة المطر والوحل !
  بالتسكين لغة رديئة واستوحل المكان ووحل الرجل بالكسر وقع فى الوحل وأوحله غيره
  وواحله فو-له أى غلبه فيه ⁦(وذل)⁩ أبوعمرو قال الهذلى الوذيلة المرآة فى لغتنا
  وحكى أبو عبيد الوذيلة القطعة من القضة وججمعها وذائل والوذالة ما يقطع الجزار من اللحم
  بغيرقسم يقال اقد توذلوا منه رل الورل داية مثل الضبّ وابمع ورلان وأرول
  و بالهمز وسل) الوسيلة ما يتقرب به الى الغير والهع الوسيل والوسائل والتوسسيل
  والتوسل واحد يقال وسل فلان الى ربه وسيلة وتوسل اليه يوسيلة أى تقرب اليه بعمل
  والتوسل أيضا السرقة يقال أخذفلان ابلى توسلا أى سرقة والواسل الراغب الى اللّٰه قال
  لبيد • بلى كل ذى دين الى اللّٰه واسل* ومويسل ما لطئ قال واقدين الغطريف الطائى
  وكان قد مر ض فحمى الماء واللبن
  لتزلبن المعزى بما مويسل • بغانى داء انى لسقيم
  ( وشل. الوثل بالتحريك الماء القليل وفى المثل وهل بالرمل أوشال ووشل الماء وثلانا
  أى قطر وجبل واسْل يقطر منه الماء وأمّاقول الشاعر
  اقرأ على الوشل السلام وقل له * كلّ المشارب مذهجرت دميم
  فهو اسم جبل عظيم بنساحية بهامة وفيه مياه عذبة وجاء القوم أو شالا أى يتبع بعضهم بعضا
  والوشول قلة الغناء والضعف وقلان واشل الحط اى ناقصه وناقة وثول كشيرة الابن
  صاح
  قوه وكذلك الوبيل الخ فى
  القاموص والوبيل فى قول طرفة
  فرت كهاة. ذات حيف جلالة
  عقيلة شيخ كالوبيل ألندد
  العصا أو صيجنة القصار لا حزمة
  المطب كاتوهمه الجرهرى اه
