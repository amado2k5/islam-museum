label: { ar: "الموطأ 868 — مالك: لا يأتي المعتكف حاجته ولا يخرج لها، ولا يعود أحداً، إلا أن يخرج لحاجة الإنسان، وإن خرج لحاجة أحد فأحق ما يخرج إليه عيادة المريض والصلاة على الجنائز واتباعها", en: "Muwatta 868" }
summary:
  ar: "قول لمالك: لا يأتي المعتكف حاجته ولا يخرج لها، ولا يعين أحداً، إلا أن يخرج لحاجة الإنسان. ولو كان خارجاً لحاجة أحد، فأحق ما يُخرج إليه عيادة المريض والصلاة على الجنائز واتباعها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (863). {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.420}"
