label: { ar: "الموطأ 868 — مالك: لا يأتي المعتكف حاجته ولا يخرج لها، ولا يعود أحداً، إلا أن يخرج لحاجة الإنسان، وإن خرج لحاجة أحد فأحق ما يخرج إليه عيادة المريض والصلاة على الجنائز واتباعها", en: "Muwatta 868", es: "Muwatta 868", fr: "Muwatta 868", ur: "موطا 868", tr: "El-Muvatta 868 — Malik: İtikaf halindeki kişi, ihtiyaç gidermek için dışarı çıkmamalı, insani bir ihtiyaç dışında kimseyi ziyaret etmemelidir. Eğer birinin ihtiyacı için dışarı çıkarsa, en uygun olanı hasta ziyaretinde bulunmak, vefat edenler için dua etmek ve cenaze alayına katılmaktır.", id: "Al-Muwatta 868 — Malik: Orang yang sedang i'tikaf tidak boleh keluar untuk buang air besar atau kecil, dan tidak boleh mengunjungi siapa pun, kecuali jika ia keluar untuk keperluan kemanusiaan. Jika ia keluar untuk keperluan seseorang, hal yang paling tepat dilakukan adalah mengunjungi orang sakit, mendoakan orang yang meninggal, dan mengikuti prosesi pemakaman." }
summary:
  ar: "قول لمالك: لا يأتي المعتكف حاجته ولا يخرج لها، ولا يعين أحداً، إلا أن يخرج لحاجة الإنسان. ولو كان خارجاً لحاجة أحد، فأحق ما يُخرج إليه عيادة المريض والصلاة على الجنائز واتباعها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (863). {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.420}"
  tr: "Malik şöyle buyurmuştur: İtikaf halindeki kişi kendi ihtiyaçlarıyla ilgilenmemeli, onlar için ayrılmamalı ve insani bir ihtiyaç dışında kimseye yardım etmemelidir. Birinin ihtiyacı için ayrılırsa, bunun en uygun sebepleri hasta ziyareti, vefat edenin başında namaz kılmak ve cenaze alayına katılmaktır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (863) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.419} {cite:muwatta-maruf-1997 s.420}"
  id: "Malik berkata: Orang yang sedang i'tikaf tidak boleh mengurus kebutuhannya sendiri, tidak boleh meninggalkan tempat ibadah untuk keperluan tersebut, dan tidak boleh membantu orang lain, kecuali jika ia meninggalkan tempat ibadah karena kebutuhan manusia. Jika ia meninggalkan tempat ibadah karena kebutuhan orang lain, alasan yang paling tepat untuk meninggalkan tempat ibadah adalah mengunjungi orang sakit, mendoakan orang yang meninggal, dan mengikuti prosesi pemakaman. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (863). {cite:muwatta-maruf-1997 p.419} {cite:muwatta-maruf-1997 p.420}"
