text: "… هو إناء خزف مستطيل مقيّر. النشوط : نوع من ديوان جرير، ورواية صدر البيت: أقول ولم أملك سوابق عبرتي. والبيت في اللسان وأعظم زهواً من ذباب على خِرا وقال أبو الشَّمقمق : من الخفيف ونائل وفَعالٍ أهلُ جودٍ جئتُه زائراً …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 1، ص 173، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 1, p. 173, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 1، ص 173 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
