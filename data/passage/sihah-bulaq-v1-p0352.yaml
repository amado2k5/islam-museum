text: |-
  ٢فصل البا٠)
  ⁦(بوز)⁩
  ٢٨٩
  بكرة أبيهم للجماعة اذاجاء وامعاولم يتخف منهم أحدوليس هناك بكرة فى الحقيقة وتقول
  اتته بكرة بالضم أى باكرا فان أردت به بكرة يوم بعينه قلت أتتمه بكرة غسير مصروف وهى
  من الظروف التى لا تتمسكن وسير على فرسك بكرة وبكرا كماتقول -محرا وقدبكرت أبكر
  بكوراو بكرت تسكيرا وأبكرت وابشكرت وباكرت كله بمعنى ولا يقال بكرولابكر ! ا ا بكر
  وقال أبوزيد أبكرت على الوردإ بكارا وكذلك أبكرت الغداء قال وبكرت على الحاجة بكورا
  وأبكرت غيرى وأبكرالرجل وردت ابله بكرة وكل. ن بادر الى الشى فقدأ بكر اليه وبكرأى
  وقت كان يقال بكروابصلاة المغرب أى صلوها عندسقوط القرص وقواه تعالى بالعشى
  والابكار وهو فعل يدل على الوقت وهو البكرة كاقال بالغدوّوالا صال جعل الغدو
  وهو مص دريدل على الغداة ورجل بكر فى حاجته ربكر مثل حذر وحذر أى صاحب بكور
  والباكورة أول الفاكهة وقد ابتكرت الشى اذا استوليت على باكورته وفى حديث
  بمعة من بكروابتكر قالوا بكر أسرع وابتكر أدرك الخطبسة من أواها دهو من الباكورة
  والبكود من النخل مثل البكيرة وه والذى يدرك أول النخل وجعه بكر وضربة بكر
  بالكسر أى قاطعة لا تنى وفى الحديث كانت ضربات على رضى اللّٰه عنه أبكارا اذا اعتلى
  قد واذا اعترض قط ( ور لبور الرحل الفاسد الهالك الذى لاخيرفيه قال
  عبد اللّٰه بن الزبعرى السهمى
  يارسول المليلكانَ لسانى • واتق مافتقت اذ أفابور
  وامرأة بورحكاه أ يضا أبو عبيدة وقوم بورها-كي قال اللّٰه تعالى وكنتم قوما بورا وهو جع بائر
  ثل حائل وحول وحكى الاخفم عن بعضهم أنه لغة وليم بجمع اسائر كما يقال أنت بسر
  وأنتم بشروقد بارفلان أى هلك وأباره اللّٰه أ هلكه ورحل حائر با تراذ لم يتجه لشئ وهو ا تساع
  لحانروباره يبوره أى جرّبه واختبره والابتبارمثله قال الكميت
  قبيح بشلى نعت الفتاة إماابتهاراواما ابتيارا
  يقول امابهتانا واما اختبارا بالصدق لاستخراج ماعندها وبرت الناقة أبورها بورا بالنتح
  وهو أن تعرضها على الفمل تنظر ألاقح هى أم لا لانها اذا صكانت لا قها بالت فى وجه
  لفول اذا تشهمها قال الشاعر الك بن زغبة
  بضرب كاذان الفراءفصوله • وطعن كايزاغ الخاض تبورها
  ويقال أيضابار الفعل الناقة وابتارها اذا تشممه اليعرف لقاحها من حيالها ومنه قولهم
  رلى ماعندفلان أى اعلمه وامتحن لى ما فى نفسه والبورأيضا الارض التى لم تزرع عن أبى
  عبيدوه وفى الحديث فى الكتاب الذى كتبه رسول اللّٰه صلى اللّٰه عليه وسلم لا كيدر صاحب
  دومة الجندل ان لما الضاحية من البعل والبور والمعامى والأغفال والبوار الهلاك وحكى
  الاحر نزلت بوار على الكفار مثل قطام وأنشد
  إنّ التظالم فى الصديق بوار
  وبار المتاع كسديقال نعوذ بالله من يوار الايم وبار عمله بطل ومنه قوله تعالى ومكرأ ولئك هو
  يبوروالبارياء والبورياء التى من القصب وقال الاصمعى البورياء بالفارسسية وهو بالعربية
  ٧٢
  اذا بكر بشد الكاف اه
  قوله مثل حذروحذرأى
  بكسر الوسط وذمه اه
