text: "غسل يوم الجمعة واجب على كل محتلم كغسل الجنابة"
summary:
  ar: "أثر يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبي هريرة أنه كان يقول، في باب العمل في غسل يوم الجمعة: غسل يوم الجمعة واجب على كل محتلم كغسل الجنابة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.157}"
