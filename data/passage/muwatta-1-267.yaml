label: { ar: "الموطأ 267 — أبو هريرة: غسل يوم الجمعة واجب على كل محتلم كغسل الجنابة", en: "Muwatta 267", es: "Muwatta 267", fr: "Muwatta 267", ur: "موطا 267", tr: "El-Muvatta 267 — Ebu Hurayra: Cuma günü alınan gusül abdesti, cinsel kirlilikten sonra alınan gusül abdesti gibi, her yetişkin için farzdır.", id: "Al-Muwatta 267 — Abu Hurairah: Mandi wajib pada hari Jumat adalah wajib bagi setiap orang dewasa, sebagaimana mandi wajib setelah berhalusinasi." }
text: "غسل يوم الجمعة واجب على كل محتلم كغسل الجنابة"
summary:
  ar: "أثر يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبي هريرة أنه كان يقول، في باب العمل في غسل يوم الجمعة: غسل يوم الجمعة واجب على كل محتلم كغسل الجنابة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.157}"
  tr: "Malik'in, Sa'id ibn Abi Sa'id al-Maqburi'den, o da Ebu Hurayra'dan rivayet ettiği bir hadiste, Cuma günü yapılan gusül abdesti bölümünde şöyle buyurmuştur: Cuma günü yapılan gusül abdesti, cinsel kirlilikten sonra olduğu gibi, her yetişkin erkek için farzdır. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suwayd, Abd al-Razzaq ve Muhammed ibn al-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.157}"
  id: "Riwayat yang dinarasikan oleh Malik dari Sa'id ibn Abi Sa'id al-Maqburi, dari Abu Hurayrah, yang mengatakan, dalam bab tentang mandi wajib pada hari Jumat: Mandi wajib pada hari Jumat hukumnya wajib bagi setiap laki-laki dewasa, sebagaimana wajib setelah najis. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, 'Abd al-Razzaq, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.157}"
