label: { ar: "جامع الترمذي 1918 — أنا وكافل اليتيم", en: "Jami' al-Tirmidhi 1918 — I and the orphan's sponsor, like these two", ur: "جامع ترمذی 1918 — میں اور یتیم کا کفیل جنت میں یوں" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عِمْرَانَ أَبُو الْقَاسِمِ الْمَكِّيُّ الْقُرَشِيُّ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ كَهَاتَيْنِ ‏\"‏ ‏.‏ وَأَشَارَ بِأُصْبُعَيْهِ يَعْنِي السَّبَّابَةَ وَالْوُسْطَى ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ ‏.‏"
summary:
  ar: "قال: أنا وكافل اليتيم في الجنة كهاتين وأشار بأصبعيه السبابة والوسطى."
  en: "«I and the orphan's sponsor in Paradise are like these two« — and he joined his forefinger and middle finger."
  ur: "«میں اور یتیم کا کفیل جنت میں اس طرح ہوں گے» — اور شہادت اور درمیانی انگلی سے اشارہ کیا۔"
