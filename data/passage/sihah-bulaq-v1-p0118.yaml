text: |-
  ٥٢٢
  موضح قال أبوذويب
  من وحش حوضى تراعى الصيد منتبذا • كانه كوكب فى الجو منجرد
  يعنى بالسيد الوحس -يض اضت المرأة تحيض حيضا ومحيضا فهى حائض وحائضة.
  أيضاءن الفرّاء وأنشد
  كمائضة يرنى بها غسير طاهر ونساء حيض وحوائض
  والحبضة المرّة الواحدة والحبضة بالمكسر الاسم والجمع الحبض والحيضة أيضا الحرقة التى
  نستنة ربها المرأة قالت عائشة رضى اللّٰه عنه اليتى كنت حيضة ملقاة وصكذلك المحيضة
  والجمع الحايض واستحيضت المرأة أى استمر بها الدم بعد أيا مها فهى مستحاضة وتحيضت
  |أى قعدت أيام حيضهاءن الصلاة وفى الحديث تحيضى فى علم اللّٰه ستا أوسبعا وحاضت
  السمرة حيضاوهى شجرة بسيل منهاشئ كالدم
  والخضاض الذى اليسير ن الحلى يقال ماعليه اخضاض أى شئ من الحلى قال الشاءر
  ولو أشرفت من كفة السترعاهلا • لقلت غزال ماعليه خضاض
  ورجسل خضاض وخضاضة أى أجق والحضاض المداد والنس وربماجاء بكسبر انلحاء
  واخفض الخرز الابيض الصغار الذى تلبسه الاماء قال الشاعر
  وأن قروم خطمة أنزلتنى • بحيث يرى من الخضض الخروت
  وهذا مثل قول الطمحان القيى
  أضاءت لهم احسابهم ووجوههم • دجى الليل -ق نظم الجزع ثاقبة
  ومكان خضاخض كثير الماء والشهجر قال الشاءر
  خضاخضة بخضيع السيول • قدبلغ السيل جذفارها
  والخضخاض ضرب من القطران تهنأ به الابل ⁦(خفض)⁩ الخفض الدعة بقال عيس
  خافض وهم فى خفض من العيش قال الشاعر
  ان شكلى وأن شكلك شق • فازمى الخص واخفضى تبضفى
  أراد تبيضى فزاد ضادا الى الضادين والخفض السير اللين وهو ضدّ الرفع بقال بيق ويينك
  ليسلة نافضة أى هيئة السير قال الشِاعر
  مخفوضها زول ومرفوءها • كمترصوب لجب وسط ريح
  وخفضت الجارية منل ختفت الغلام واختفضت هي والخافضة اللخائنة وخفض الصوت
  عضه يقال خفض عليك القول وخفض عليك الامر أى هوّن والخفض والجرْواحدوه-ما
  فى الاعراب بنزلة الكسر فى البناء فى مواضعات النحوبين والانخفاض الاغطاط والله
  منفض من يشاء ويرفع أى يضع قال الراجز يهجو مصدّقا
  أإبلى تأكلها مصنا • خافض سنّ ومشلاسنا :
  وقال ابن الإعرابي هذا رجل يخاطب امر أنه ويهبوأبا ها لانه كان أمهرها عشرين بعسيرا
  كاما بنات لبون فطالبه بذلك فكان اذار أى فى أبله حقة سمينة يقول هذه بنت لبون ليأخذها
  واذار أى بنت لبون مهزولة يقول ذمينت مخاض ليتركهافقال
