text: |-
  ٢٠٧
  قال أبوذؤيب اذالسعته الدبرلم يرج لسعها • وخالفها في بيت نوب عوامل
  ابن السكيت الذوب بالفتح الترب خلاف البعد قال أبوذؤ يب
  أرقت لذكره من غيرنوب • كايهتاج موشى قشيب ١
  ويقال النوب ما كان منك مسيرة يوم وليلة والقرب ماكان منك ميرة ليلة وأصله
  فى الورد قال لبيد احدى بى جعة ركلفت بها • لم تمسمنى نوبا ولاقربا
  والحمى النائبة التى تأتى كل يوم هب الثهب الغنيمة والجمع النهاب والانتهاب أن
  يأخذها من شاءتقول أنحب الرجل ماله فانتهبوه ونمبوه وناهبوه كل ذلك يمعنى والنهي اسم
  ما أنمب والمناهبة أن يتبارى الفرسان فى حضرهما وكذلك غير الفرس وقال
  ناهبتهم بتيطل حروف ونهب الناس فلانا اذا تشاولوه بكادمهم وصكذلك الكاب
  اذا أخذب رقوب الانسان يقال لا تدع كلبل يشهب الناس نيب الناب من السن
  وابهع أنساب ونيوب أيضاء لى غير قياس وتابه ينيبه أى أصاب نابه ويب سهسمه أى عجم
  عوده وأثرفيه بنابه وناب القوم سيدهم ٢ الناب المسنة من النوق والمع النيب وفى المثل
  لا أفعل ذلك ماحنت النيب قال الراجز
  حرقها حض بلادفل • وغتم فجم غيرمستقل • فاتكادميها نولى
  أى ترجع من الضعف وهوفعل مثل أسدوأسدوانما كسروا النون لت-لم الياء والتصغير
  يييب يقال سعيت بذلك لطول نابها فهو كألصفة قلذلك لم لعقه الهاءلان الهاءلا تلحق تصغير
  االصفات تقول منه ييت الناقة أى صارت هرمة ولا يقال للجسمل ناب وقال سيبويه من
  العوب من يقول فى تصغير ناب نويب فيجى بالواولات هذه الالف بكثر انقلابها من الواوات
  قال ابن السراج هذاغلط منه ( ٣
  صل الداد ⁦( أب)⁩ الوأب الانقباض والاستحياتقول منه وأب ينب وأ يا
  وإية ونكح فلان فى إية وهو العاروما يستحياضه والهاءء وض من الواوقال الشاعر
  اذا المرتى تشب ه بنات • عسبت برأسه إية وعارا
  nen٤)
  قال أبوع رو تغدّى عندى أعرابى قصيح من بنى أسد تم رفع يده فقلت لهازددفة سال ماطعامك
  يا اباعمر وبطعام تؤية أى بطعام يستحيا من أكله وأصل التاءواو واتأب الرجل أى استهيا
  وهو افتعل قال الاعشى يدح هوذة بن على الحنقى
  من يلق هوذة يسجد غير متئب * اذا تعمم فوق التاج أووضعة
  وأوأ بته أى فعلت به فعلايستهي منه والموتبات مغال الموعبات الخزيات وأو أبته أيضا
  رددته عن حاجنه وحاذر وأب أى مقعب وقال ⁦(أبو النجم العجلى)⁩
  بكل وأب للحصى رضاح • ليس بصطر ولا فرشاح
  ويقال الوأب البعبر العظيم والوأية النقرة فى الصذرة تمسك الماء ⁦( ثب)⁩ وثب وثبا
  ووتويا ووثيا ناطفر والوثيب مثل الوئب وقال يصف كبره ( ٥
  فاأرمى فأقتلاها بسه-م • ولا أعدوفأدرك بالوثيب
  يقول ما أنا والوحس يعن الجوارى ونصب اقتلها وأدرك على جواب الجد بالماء وأوثيته
  ( ١ ? بعى بالموتى البراعةُ أكة
