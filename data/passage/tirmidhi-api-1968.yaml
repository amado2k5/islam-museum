label: { ar: "جامع الترمذي 1968 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1968 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1968 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 1968 — lo que se ha hecho lícito; lo que no lo es", fr: "Jami' al-Tirmidhi 1968 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Cami' el-Tirmizi 1968 — Neler caizdir, neler caiz değildir", id: "Jami' al-Tirmidhi 1968 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… أَنَّ رَسُولَ اللَّهِ قَالَ \" الضِّيَافَةُ ثَلاَثَةُ أَيَّامٍ وَجَائِزَتُهُ يَوْمٌ وَلَيْلَةٌ وَمَا أُنْفِقَ عَلَيْهِ بَعْدَ ذَلِكَ فَهُوَ صَدَقَةٌ وَلاَ يَحِلُّ لَهُ أَنْ يَثْوِيَ عِنْدَهُ حَتَّى يُحْرِجَهُ \". وَفِي الْبَابِ عَنْ عَائِشَةَ وَأَبِي هُرَيْرَةَ. وَقَدْ رَوَاهُ مَالِكُ بْنُ أَنَسٍ وَاللَّيْثُ بْنُ سَعْدٍ عَنْ سَعِيدٍ الْمَقْبُرِيِّ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَأَبُو شُرَيْحٍ الْخُزَاعِيُّ هُوَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1968، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1968 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1968، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1968 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los parientes), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1968 (chapitres sur la piété et les bonnes relations familiales), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 1968 numaralı hadisinde helal ve haram olan şeyler belirtilmiştir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1968, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
