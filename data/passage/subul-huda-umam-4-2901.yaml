text: "… على يهود المدينة الَّذين هم مُوادِعُوا رسول اللّٰه - - وعرفوا أنَّه إِنْ دَخَل خيبر أَملك أَهْلَ خيبر، كما أَهلَكَ بنى قَيْنُقَاع، والنَّضِير وقُرَيْظَة. وَلَمْ يَبْق أَحدُّ من يهود المدينة له على أَحدٍ من المسلمين حقٌّ إلا لزمه. وروى محمد …"
