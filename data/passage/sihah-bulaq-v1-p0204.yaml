text: |-
  ⁦(نجز )⁩
  ٤٣٧
  فعلاء ليس من أينيتهم ويقال هو فعال من المهم وزوليس بالوجه لان الاشتقاقايس يدل على
  الهمز كمادل فى القراء والسلاء قال الاخطل يعيب قوما
  يئس الصاة ويئس الشرب شريهم * اذاجرى فيهم المزاء والسكر .
  وهو اسم للخمر ولو كان نعتالها لكان مزاء بالفتح والمز بالكسر الفضل يقال له على هذا مز
  أى فضل والمزمزة التحريك يقال أخذْه فزمزه اذا حترّكه وأقبل به وأدبر قال ابن مسعود
  رذى اللّه عنه فى سكران أتى يد ترتروه ومز مزوه واستنكهوه عز المعزمن الغنم
  خلاف الضأن وهواسم جنس وكذلك المعز و المعيزو الامعوز والمعزى وواحد المعزماعزمثل
  صاحب وصحب والاننى ماعزة وهى العنز والجع- واعيز ويقسال الامعوز السربمن الظباء
  ما بين الثلاثين الى الاربعين قال سيبويه معزى منوّت مصروف لأن الالف للالحاق لا للتأنيث
  وهو ملحق بدرهم على فعلل لان الالف الملهقة تجرى مجرى ماهو من نفس الكلسمة يدل على
  ذلك قولهسم معيزو أريط فى تصغيرم عزى وأرطى فى قول من نون وكسر واما بعدياء التصغير
  كما قالوادديهم ولو كانت للتأنيث لم يقلبوا الالف يا، كمالم يقلبوها فى تصغير حيلى وأخرى وقال
  الفرّاء المعزى مؤثثة وبعضهم ذكرها وحكى أبو عبيد أن الذفرى أكثر العرب لا ينوّنها
  وبعضهم ينون قال والمعزى كاهم ينوّنونها فى النسكرة ويقبال أمعز القوم اذا كثرت
  معزاهم والماعز جلد المعز قال الشماخ
  وبردان من خال وسبعون درهما * على ذاكمروظ من القدّ ماءز
  قوله على ذالك أى مع ذا والمعازصاحب المعزى قال أبو محمد الفقعسى يصف ابلا بكثرة
  للبن ويفضلها على الغنم فى شدة الزمات
  يكان كبلاليس بالممحوق * ادردى المعاز باللعوق
  والمعز الصلابة من الارض والامعز المكان الصلب المكثير الحصى والارض معزاء بينة المعز
  قال الاصمعى قلت لابى عمروين العلاء معزى من المعز فقال نعم وذفرى من الذفر فقال نعم
  ⁦( ملز )⁩ ابن السكيت يقال اغملز من الامر اذا أفلت منه وملزنه أنا تليز افتملزيقال ما كدت
  أتعلزمن فلان مثل أتخلص وآتملص وأغلس موز الموزمعروف الواحدموزة
  ⁦( ميز)⁩. حزت الشئ أميزه ميزاعزلته وفرزته وكذلك ميزته تمييزافانما زوامتازوتيزواستماز
  كله بمعدنى يقال امتاز القوم اذا تميز بعضه-م من بعض وفلان يكاد يتجيز من الغيظ
  أى يتقطع
  صل النون ن ز لنبز بالتحريك اللقب والجمع الانسازر النبزيالتسكين المصدر
  تقول نبزه ينبزه نبزا أى لقبه وذلان ينبزبا لصييان أى يلقبهم شدّد للمكثرة وتنابزوا بالا لقاب أى
  قب بعضهم بعضا جز نجز الشئ بالمكسر ينجز نجزا أى انقضى وفى قال الشاعر
  وكنت ربيعالليتامى وعصمة * قلك أبى قابوس أضحى وقد نجز
  أى انقضى وفى وقت الضحى لانه مات فى ذلكّ الوقت ونجز حاجته يتجزها بالضم نجز اقضاها
  يقال نجز الوعد وأنجز حرما وعد والمناجزة فى الحرب المبارزة والمقاتلة وفى المثل المحاجزة قبل
  المناجزة وقولهم أنتِ على نجز حاجتك بفتح النون وضمها أى على شرف من قضائها واستتجز
  ١١٠
  محاح
