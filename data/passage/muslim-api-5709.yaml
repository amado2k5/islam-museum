label: { ar: "صحيح مسلم 5709 — المرض والمريض، السقم", en: "Sahih Muslim 5709 — illness and the sick; sickness", ur: "صحیح مسلم 5709 — بیماری اور بیمار، سقم" }
text: "وَحَدَّثَنَا شَيْبَانُ بْنُ فَرُّوخَ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ إِذَا عَادَ مَرِيضًا يَقُولُ \" أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ اشْفِهِ أَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ شِفَاءً لاَ يُغَادِرُ سَقَمًا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5709، يذكر المرض والمريض، والسقم، وعيادة المريض، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5709 (The Book of Greetings), that mentions illness and the sick, sickness, visiting the sick, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5709، جس میں بیماری اور بیمار، سقم، بیمار کی عیادت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
