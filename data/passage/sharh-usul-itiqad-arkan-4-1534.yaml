  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 4. cildinin 1534. sayfasından, imanın esasları ile imanın artışı ve azalışına dair bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 4, halaman 1534, yang menyebutkan rukun iman dan peningkatan serta penurunan iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
