text: "الإيمان على أربع دعائم الإيمان: العمل، والإسلام: الكلمة الإيمان عند أهل السنة الإيمان عندنا داخله وخارجه الإيمان عريان ولباسه التقوى الإيمان قايد والعمل سايق الإيمان قول وعمل الإيمان قول وعمل الإيمان قول وعمل الإيمان قول وعمل الإيمان قول وعمل الإيمان …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 1534، يذكر أركان الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
