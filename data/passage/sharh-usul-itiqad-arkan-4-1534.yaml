text: "الإيمان على أربع دعائم الإيمان: العمل، والإسلام: الكلمة الإيمان عند أهل السنة الإيمان عندنا داخله وخارجه الإيمان عريان ولباسه التقوى الإيمان قايد والعمل سايق الإيمان قول وعمل الإيمان قول وعمل الإيمان قول وعمل الإيمان قول وعمل الإيمان قول وعمل الإيمان …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 1534، يذكر أركان الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 1534, that mentions the pillars of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 4، ص 1534 کا اقتباس جس میں ارکانِ ایمان، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
