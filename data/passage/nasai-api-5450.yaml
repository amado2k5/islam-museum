label: { ar: "سنن النسائي 5450 — بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 5450 — dutifulness to the parents or disobedience to them", ur: "سنن نسائی 5450 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 5450 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan al-Nasa'i 5450 — le devoir envers les parents ou la désobéissance envers eux" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا جَرِيرٌ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ عَمْرِو بْنِ أَبِي عَمْرٍو، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ لِرَسُولِ اللَّهِ دَعَوَاتٌ لاَ يَدَعُهُنَّ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ وَالدَّيْنِ وَغَلَبَةِ الرِّجَالِ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ هَذَا الصَّوَابُ وَحَدِيثُ ابْنِ فُضَيْلٍ خَطَأٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 5450، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5450 (The Book of Seeking Refuge with Allah), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5450، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5450 (El Libro de la Búsqueda de Refugio en Alá), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5450 (Le Livre de la Recherche de Refuge auprès d'Allah), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
