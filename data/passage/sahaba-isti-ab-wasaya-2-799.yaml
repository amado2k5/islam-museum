text: "… عميرة، وعبد اللّٰه بن مسعودٍ، ومعاذ، وأبي الدرداء، وزيد بن قال : لما حضرت معاذ بن جبل الوفاة قيل له : يا أبا ثابتم. عبد الرَّحمنِ أوصنا، فقال : التمسوا العلم عند عويمر وروى مِسعَر، عن القاسم بن عبدِ الرَّحمنِ، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 799، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
