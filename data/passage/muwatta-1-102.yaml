text: "إذا مس أحدكم ذكره فقد وجب عليه الوضوء"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الوضوء من مس الفرج: كان عبد الله بن عمر يقول إن من مس ذكره فقد وجب عليه الوضوء. ويذكر المحقق أن عبد الرزاق أخرجه من غير طريق مالك بلفظ مقارب، وأن ابن أبي شيبة والطحاوي رويا عن نافع أن ابن عمر كان إذا مس فرجه أعاد الوضوء. {cite:muwatta-maruf-1997 p.86}"
