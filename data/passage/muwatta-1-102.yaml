label: { ar: "الموطأ 102 — ابن عمر: من مس ذكره وجب عليه الوضوء", en: "Muwatta 102", es: "Muwatta 102", fr: "Muwatta 102", ur: "موطا 102", tr: "El-Muvatta 102 — İbn Ömer: Cinsel organlarına dokunan herkes abdest almalıdır.", id: "Al-Muwatta 102 — Ibnu Umar: Barangsiapa menyentuh kemaluannya, wajib berwudhu." }
text: "إذا مس أحدكم ذكره فقد وجب عليه الوضوء"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الوضوء من مس الفرج: كان عبد الله بن عمر يقول إن من مس ذكره فقد وجب عليه الوضوء. ويذكر المحقق أن عبد الرزاق أخرجه من غير طريق مالك بلفظ مقارب، وأن ابن أبي شيبة والطحاوي رويا عن نافع أن ابن عمر كان إذا مس فرجه أعاد الوضوء. {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik'in Nafi'den rivayet ettiği, cinsel organlara dokunduktan sonra abdest alma bölümünde yer alan bir rivayete göre, Abdullah ibn Umar, cinsel organına dokunan herkesin abdest almakla yükümlü olduğunu söylerdi. Araştırmacı, Abdül-Razzak'ın bunu Malik'inkinden farklı bir rivayet zinciriyle, benzer bir ifadeyle naklettiğini ve İbn Abi Şeybe ile Tahavi'nin de Nafi'den rivayetle İbn Umar'ın cinsel organlarına dokunduğunda abdestini tekrarladığını naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.86}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang wudhu setelah menyentuh kemaluan: Abdullah ibn Umar biasa mengatakan bahwa siapa pun yang menyentuh kemaluannya wajib berwudhu. Peneliti menyebutkan bahwa Abd al-Razzaq meriwayatkannya melalui sanad yang berbeda dari Malik, dengan redaksi yang serupa, dan bahwa Ibn Abi Shaybah dan al-Tahawi meriwayatkan atas otoritas Nafi’ bahwa Ibn Umar akan mengulangi wudhunya jika ia menyentuh kemaluannya. {cite:muwatta-maruf-1997 p.86}"
