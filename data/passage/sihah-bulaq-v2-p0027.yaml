text: |-
  قال الاسععى
  -البصيرة شي من
  الدم يسندلّ به على الرمية وأبو
  تجمر ومثله يقول هذا الشاعر انهم
  تركوادم أيهم وجعلوه خلفهم
  أى لم ينأروابه وأناطلبت ثأر
  وكان أبو عبيدة يقول البصيرة
  فى هذا البيت الترس أو الدرع
  وكان يروية حلوا بصائرهم قالد
  ٥٦٠٠
  •⁦(وخ)⁩ .
  رجل كما تقول حسبك من رجل لم تمن ولم تجمع لانه مصدر وتقول فى المعرفة هذاعبد اللّٰه
  ناهيك من رجسل فتنصب ناهبك علي الحال وجزورنمية على فعيلة أى ضخمة سهينة ويقال
  طلب الحاجة -تى نهى عنها بالسكسرأى تركها ظفربم اأولم يظفر
  صل الواد أى الوأى الوعدية ال منسه وأيتسه وأيا والوأى التصريك
  الحار الوحشى المقتدر الخلق قال ذوالرمة
  اذا انشقت الظلماء أنحت كأنها • وأى منطو باقى التميلة فارح
  ثم يشبه به الفرس وغيره قال الجعنى
  راحوا بصائرهم على أكتافهم * وبصيرتى يعدوبها عقدوأى
  وقال آخر كل وآة ووأى ضافى الحصل • معتدلات فى الرقاق والجرل
  والوئية الجوالق الضخم قال أرس
  وحطت كاحطت وئية تاجر • وهى عقدها فارفض منما الطوائف
  وقال الكلابقدروثية خضمة وناقة وئية ضخمة البطن وقال
  وقدر كر أل الصصحان وئية • أغخت لها بعد الهدوء الاثافيا
  وهى قعيلة مهموزة الغين معتلة اللام قال سيبويه سألته يعنى الخليل عن فعسل من وأيت
  فقال وؤى فقلت فن خفف فقال أوى فأبدل من الواوهمزة وقال لا يلتقى واوان فى أول
  الحرف قال المازنة والذى قاله خطألات كل واومضمومة في أول الكلمة فأنت بالخيار
  ان شئت تركتماعلى حالها وان شئت قلبتهاهمزة فقلت وعدوأعد ووجره وأجوه ووورى
  وأورى وووى وأوى لالاجتماع الساكنين ولكن لضمة الاولى ⁦(وجى)⁩ وجى الفرس
  بالكسروه وأن يجد وجعا فى حافرفه ووح والاتى وجياوأوجيته أنا وانه ليتوجى ويقال
  تركته وما فى قلى منه أويى أى يئست منه وسألته فأوجى علىّ أى عخل حى الوو
  الكتاب وجمعه وحىّ مثل حلى وحلىّ قال لبيد• كماضمن الوحى سلامها * والوحى أيضا الاشارة و
  والمكابة والرسالة والالهام والكلام الخفى وكل ما ألقيقه الى غيرك يقال وحيت اليه الكلام!
  وأوحيت وهو أن تكلمه بكلام تخفيه قال العجاج• وحى لها القرار فاستقرت • ويروى
  أوحى اها ووحى وأوحى أيضا أى كتب وقال • لقدركان وحاه الواى • وأوحى اللّٰه الى
  أنبياته وأرحى أى أشار قال تعالى فاوحى الههم أن سيحوا بكرة وعشيا ووحيت اليه بخبر كذا
  أى اشرت وصوت بدرويدا والوحامثال الونا الصوت قال الشاءر
  منعنا كم كراء وجانبيه • كمامنع العرين وحى اللهام
  أوكذاك الوحاة بالها. قال الراجز
  يحدوبها كل" فتى هيات• تلقاه بعد الوهن ذاوحات* وهنّ فحو البيت عامدات
  قال الاخفس نصب عامدات على الحال قال النضر منعت وحاة الرعد وهوصوته الممدود
  نلحقى قال والرعديحى وحة واستوحيناهم أى استصر خناهم والوحى السرعة بمدويقصر
  ويقال الوحى الوحى يعنى البدار البدارونوح" ياهذا أى أسرع ووساه توحية أى عجله والوحىّ
  على فعيل السريع بقال موت وحى وخى) يقال وخيت وخيك أى قصدت قصدك وهذا
  وحى
