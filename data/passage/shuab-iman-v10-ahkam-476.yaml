text: "… الجعظ: العظيم في نفسه وقيل: السيئ الخلق الذي يتسخط عند الطعام. وللحديث شاهد من حديث حذيفة مرفوعا بنحوه. وأخرجه أحمد في مسنده. وأورده المنذري في الترغيب وقال: رواه أحمد ورواته رواة الصحيح إلا محمد بن جابر. إسناده: لا بأس به …"
