text: "… الجعظ: العظيم في نفسه وقيل: السيئ الخلق الذي يتسخط عند الطعام. وللحديث شاهد من حديث حذيفة مرفوعا بنحوه. وأخرجه أحمد في مسنده. وأورده المنذري في الترغيب وقال: رواه أحمد ورواته رواة الصحيح إلا محمد بن جابر. إسناده: لا بأس به …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 476، يرد فيه ذكر ما لا بأس به، والترغيب في العمل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 476, whose wording mentions what is said to be no harm, encouragement to an act; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 476 کا اقتباس جس میں جس میں کوئی مضائقہ نہیں، عمل کی ترغیب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 476, dont le texte mentionne ce qui est dit sans inconvénient, l'encouragement à un acte ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 476, cuyo texto menciona lo que se dice que no tiene inconveniente, el estímulo a un acto; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 476. sayfasından, helal olan amelleri ve iyi amelleri teşvik eden bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 476, yang menyebutkan amalan yang diperbolehkan dan amalan baik yang dianjurkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
