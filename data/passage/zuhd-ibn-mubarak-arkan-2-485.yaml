text: "… الأمينُ ويُؤْتَمنُ الخائنُ. وقال: مَثَلُ المؤمنِ كمَثَلِ النَّحلةِ أكَلَتْ طيِّباً ووَضَعَتْ طيِّباً، ووَقَعَت فلم تَكسِرْ ولم تُفسِدْ، ومَثَلُ المؤمنِ كمَثَلِ القِطْعةِ الجيّدةِ من الذَّهبِ، نُفِغَ عليها فخَرَجَت طيِّبةً، ووُزِنَت فلم تَنقُصْ. قال: وقال: مَوعِدُكم حَوْضي، عَرْضُه مِثلُ طولِه، وهو أبعَدُ …"
summary:
