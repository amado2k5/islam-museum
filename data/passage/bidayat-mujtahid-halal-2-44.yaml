text: "… قضى بالمطلق على المقيد، وقال : يحرم قليل الدم وكثيره والسفح المشترط في حرمية الدم إنما هو دم الحيوان المذكى، أعني أنه الذي يسيل عند التذكية من الحيوانِ الحلالِ الاكلِ. وأما أكل دم يسيل من الحيوان الحيِّ فقليله وكثيره حرام، …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 44، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 44, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 44 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 2, pág. 44, que menciona lo lícito y lo ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Bidayat al-Mujtahid d'Ibn Rushd, volume 2, page 44, mentionnant le licite et l'illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 2. cildinin 44. sayfasından, helal ve haram olan şeyleri tartışan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 2, halaman 44, yang membahas tentang apa yang diperbolehkan dan diharamkan; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
