text: "… عن ذلك. قال: ولا بأسَ بأن يُصلِّيَ في هذَيْن الوقتَيْن الفوائتَ، ويسجدَ للتلاوة، ويصليَ علىٰ الجنازة. لأن الكراهةَ كانت لحَقِّ الفرض ؛ ليصيرَ الوقتُ من بعده كالمشغول به، لا لمعنىٰ في الوقت، فلم تَظهَرْ في حَقِّ الفرائض، وفيما وَجَبَ لعَيْنه، …"
summary:
