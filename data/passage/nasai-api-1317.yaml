label: { ar: "سنن النسائي 1317 — الأب والأبوة", en: "Sunan al-Nasa'i 1317 — the father and fatherhood", ur: "سنن نسائی 1317 — باپ اور والدیت" }
text: "… عَبْدُ اللَّهِ بْنُ جَعْفَرٍ الْمَخْرَمِيُّ، عَنْ إِسْمَاعِيلَ بْنِ مُحَمَّدِ بْنِ سَعْدٍ، عَنْ عَامِرِ بْنِ سَعْدٍ، عَنْ سَعْدٍ، قَالَ كُنْتُ أَرَى رَسُولَ اللَّهِ يُسَلِّمُ عَنْ يَمِينِهِ وَعَنْ يَسَارِهِ حَتَّى يُرَى بَيَاضُ خَدِّهِ. قَالَ أَبُو عَبْدِ الرَّحْمَنِ عَبْدُ اللَّهِ بْنُ جَعْفَرٍ هَذَا لَيْسَ بِهِ بَأْسٌ وَعَبْدُ اللَّهِ بْنُ جَعْفَرِ بْنِ نَجِيحٍ وَالِدُ عَلِيِّ بْنِ الْمَدِينِيِّ مَتْرُوكُ الْحَدِيثِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1317، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1317 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1317، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
