text: "… فلم نُشْرِك به شيئاً، وحرَّمنا ما حرم علينا، وأحلَلْنا ما أحل لنا، فعدا علينا قومنا، فعذبونا وفتنونا عن ديننا، ليردونا إلى عبادة الأوثان عن عبادة اللّٰه تعالى، وأن نستحلّ ما كنا عليه من الخبائث، فلما قهرونا وظلمونا وضيقوا علينا، وحالوا …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 30، يذكر ما أُحل، واستحلال الشيء، وما حُرّم، والخبائث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
