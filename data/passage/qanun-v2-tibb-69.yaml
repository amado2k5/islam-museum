text: "الكتاب الثالث الفنّ الأوّل : في أمراض الرأس والدماغ والبنفسج والحسك مخبصة، وذلك بعد حلق الرأس، وربما احتجنا إلى الحجامة والعلق، وربما بقي الصداع بعد الحمى وبعد الأمراض الحادة. وعلاجه تبريد الأغذية وترطيبها، وتقوية الرأس بدهن الورد مع دهن البابونج، …"
