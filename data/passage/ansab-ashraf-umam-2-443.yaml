text: "… - وتزوّج رسول اللّٰه صفية بنت حيىّ بن أخطب بن سعية بن ثعلية بن عبيد، من ولد النضير بن النحام بن ينمحوم، من ولد هارون ابن عمران. وكانت قبله عند كنانة ين أبى العُقيق اليهودى فقتل يوم خيبر. فكانت صفيةُ …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 2، ص 443، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
