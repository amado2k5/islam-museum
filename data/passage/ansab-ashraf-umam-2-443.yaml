  tr: "El-Baladhuri'nin \"Ansab al-Ashraf\" (Soylu Kişilerin Şecereleri) adlı eserinin 2. cildinin 443. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
