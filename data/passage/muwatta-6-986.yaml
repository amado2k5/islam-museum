label: { ar: "الموطأ 986 — يحيى: سئل مالك عن رجل من أهل مكة خرج إلى الرباط أو سفر ثم رجع يريد الإقامة، فدخل بعمرة في أشهر الحج ثم أنشأ الحج: ليس عليه ما على المتمتع، لقوله تعالى: ذلك لمن لم يكن أهله حاضري المسجد الحرام", en: "Muwatta 986", es: "Muwatta 986", fr: "Muwatta 986", ur: "موطا 986", tr: "El-Muvatta 986 — Yahya: Malik'e, Mekke'den bir adamın ribat (kale manastırı) veya yolculuğa çıkıp, sonra kalmaya niyetlenerek geri dönüp Hac aylarında Umre yapıp, ardından Hac yapması soruldu: Bu kişi, Tamattu (bir tür Hac) yapan kişiyle aynı şartlara tabi değildir, çünkü Yüce Allah şöyle buyurmuştur: \"Bu, aileleri Mescid-i Haram'da bulunmayanlar içindir.\"", id: "Al-Muwatta 986 — Yahya: Malik ditanya tentang seorang pria dari Mekah yang pergi ke ribat (biara berbenteng) atau dalam perjalanan, kemudian kembali dengan niat untuk tinggal, dan melakukan Umrah selama bulan-bulan Haji, kemudian melakukan Haji: Ia tidak tunduk pada syarat yang sama dengan orang yang melakukan Tamattu’ (sejenis Haji), karena firman Allah Yang Maha Kuasa: “Itu untuk orang-orang yang keluarganya tidak hadir di Masjidil Haram.”" }
summary:
  ar: "سئل مالك عن رجل من أهل مكة خرج إلى الرباط أو إلى سفر من الأسفار، ثم رجع إلى مكة يريد الإقامة بها، فدخلها بعمرة في أشهر الحج ثم أنشأ الحج، وكانت عمرته من ميقات النبي أو دونه: أمتمتع هو؟ فقال مالك: ليس عليه ما على المتمتع من الهدي أو الصيام، لقول الله تعالى: ذلك لمن لم يكن أهله حاضري المسجد الحرام [[passage/quran-2-196|البقرة 196]]. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.464}"
  tr: "Malik'e, Mekke'den bir adamın bir ribat'a (kale manastırı) veya başka bir yolculuğa çıkıp sonra Mekke'ye geri dönerek orada kalmayı amaçladığı soruldu. Hac aylarında Umre yapmak için Mekke'ye girdi, sonra da Hac yaptı. Umresini Peygamber'in mikatından (ihram giymek için belirlenmiş yer) veya daha öncesinden yaptı. Bu adam Tamattu' (bir tür Hac) mı yapıyor? Malik şöyle cevap verdi: \"Bu, aileleri Mescid-i Haram'da bulunmayanlar içindir\" [Bakara 2:196] ayetine dayanarak, Tamattu' yapan birinin yapması gereken kurban kesme veya oruç tutma yükümlülüğü yoktur. Editör, bunun Malik'ten Ebu Musab tarafından rivayet edildiğini belirtmektedir."
  id: "Malik ditanya tentang seorang pria dari Mekah yang pergi ke ribat (biara berbenteng) atau melakukan perjalanan lain, kemudian kembali ke Mekah dengan maksud untuk tinggal di sana. Ia memasuki Mekah untuk melaksanakan Umrah selama bulan-bulan Haji, kemudian melaksanakan Haji. Umrahnya dilakukan dari miqat Nabi (tempat yang ditentukan untuk mengenakan ihram) atau sebelumnya. Apakah ia melaksanakan Tamattu' (sejenis Haji)? Malik menjawab: Ia tidak diwajibkan untuk mempersembahkan hewan kurban atau berpuasa sebagaimana diwajibkan bagi orang yang melaksanakan Tamattu', berdasarkan ayat: \"Itu untuk orang-orang yang keluarganya tidak hadir di Masjidil Haram\" [Al-Baqarah 2:196]. Editor mencatat bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab."
