label: { ar: "الموطأ 986 — يحيى: سئل مالك عن رجل من أهل مكة خرج إلى الرباط أو سفر ثم رجع يريد الإقامة، فدخل بعمرة في أشهر الحج ثم أنشأ الحج: ليس عليه ما على المتمتع، لقوله تعالى: ذلك لمن لم يكن أهله حاضري المسجد الحرام", en: "Muwatta 986" }
summary:
  ar: "سئل مالك عن رجل من أهل مكة خرج إلى الرباط أو إلى سفر من الأسفار، ثم رجع إلى مكة يريد الإقامة بها، فدخلها بعمرة في أشهر الحج ثم أنشأ الحج، وكانت عمرته من ميقات النبي أو دونه: أمتمتع هو؟ فقال مالك: ليس عليه ما على المتمتع من الهدي أو الصيام، لقول الله تعالى: ذلك لمن لم يكن أهله حاضري المسجد الحرام [[passage/quran-2-196|البقرة 196]]. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.464}"
