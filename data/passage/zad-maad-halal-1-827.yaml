text: "… على المعاصي والآثام. قالوا : والإيمانُ أصلُ العقود وأجلُّها وأشرفُها، يزول بالكلام المحرَّم إذا كان كفراً، فكيف لا يزولُ عقدُ النكاح بالطلاق المحرَّم الذي وضع لإزالته. الهازل، فإنه يقع مع تحريمه لأنه لا يَحِلُّ له الهزل يتَّخِذُون آيات اللَّه هزواً …"
