text: "أَنَسٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم أَرَادَ أَنْ يَكْتُبَ إِلَى كِسْرَى وَقَيْصَرَ وَالنَّجَاشِيِّ ‏.‏ فَقِيلَ إِنَّهُمْ لاَ يَقْبَلُونَ كِتَابًا إِلاَّ بِخَاتِمٍ ‏.‏ فَصَاغَ رَسُولُ اللَّهِ صلى الله عليه وسلم خَاتَمًا حَلَقَةً فِضَّةً وَنَقَشَ فِيهِ مُحَمَّدٌ رَسُولُ اللَّهِ ‏.‏"
summary:
  ar: "في صحيح مسلم؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sahih Muslim; sending a letter or message to a party."
  ur: "صحیح مسلم میں؛ کسی فریق کو خط یا پیغام بھیجنا."
