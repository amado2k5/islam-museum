label:
  ar: "البخاري 3244 — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Bukhari 3244 — I have prepared for My righteous servants what no eye has seen"
  ur: "بخاری 3244 — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
text: "قال الله أعددت لعبادي الصالحين ما لا عين رأت، ولا أذن سمعت، ولا خطر على قلب بشر، فاقرءوا إن شئتم فلا تعلم نفس ما أخفي لهم من قرة أعين ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3244: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3244: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3244: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
