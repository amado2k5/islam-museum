label: { ar: "سنن النسائي 4007 — ما حُرّم", en: "Sunan al-Nasa'i 4007 — what was made unlawful", ur: "سنن نسائی 4007 — جو حرام کیا گیا" }
text: "… عَنْ زَيْدٍ، فِي قَوْلِهِ { وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ } قَالَ نَزَلَتْ هَذِهِ الآيَةُ بَعْدَ الَّتِي فِي { تَبَارَكَ } الْفُرْقَانِ بِثَمَانِيَةِ أَشْهُرٍ { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ }. قَالَ أَبُو عَبْدِ الرَّحْمَنِ أَدْخَلَ أَبُو الزِّنَادِ بَيْنَهُ وَبَيْنَ خَارِجَةَ مُجَالِدَ بْنَ عَوْفٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 4007، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4007 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4007، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
