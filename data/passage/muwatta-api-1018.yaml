text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ، أَنَّهَا كَانَتْ تَقُولُ لَغْوُ الْيَمِينِ قَوْلُ الإِنْسَانِ لاَ وَاللَّهِ بَلَى وَاللَّهِ. قَالَ مَالِكٌ أَحْسَنُ مَا سَمِعْتُ فِي هَذَا أَنَّ اللَّغْوَ حَلِفُ الإِنْسَانِ عَلَى الشَّىْءِ يَسْتَيْقِنُ أَنَّهُ كَذَلِكَ ثُمَّ يُوجَدُ عَلَى غَيْرِ ذَلِكَ فَهُوَ اللَّغْوُ. قَالَ مَالِكٌ وَعَقْدُ الْيَمِينِ أَنْ يَحْلِفَ الرَّجُلُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1018، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1018 (Vows and Oaths), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1018، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1018 (Votos y juramentos), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Muwatta Malik, n° 1018 (Vœux et Serments), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Malik'in Muvatta'sında yer alan 1018 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1018, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
