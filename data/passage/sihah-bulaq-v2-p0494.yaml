text: |-
  ٩٣
  تغريدساق على ساق تجاوبها من الهواتفذات الطوق والعطل
  عنى بالأول الورشان وبالثابى ساق الشهجرة وة وله تعالى يوم يكشف عن ساق أى عن شدّة كما
  بقال قامت الحرب على ساق ومنه قواهم ساوه أى فاخره أشا أشد وساقة الحيش مؤخره
  والسوق يذكرويونث قال الشاءر * بسوق كثير ريه وأعاصره* وسوف الحرب حومة
  القتال وتسوّق القوم اذاباء واداشتروا والسوقة خلاف الملك قال نهشل بن حرّىّ
  ولم ترعينى سوقة مثل مالك • ولا ملكاتجبى البه هى ازيه
  يستوى فيه الواحد والجمع والمؤنت والذكر قالت بنت النعمان بن المنذر
  فبينانسوس الناس والامر أحرنا * اذا نحن فيهم سوقة تتنصف
  أى تخدم الناس وربماجع على سوق قال زهير
  يطلب شأوامرأين قدماحسنا • نالا اللول وبذاهذه السوفا
  وساق الماشية يسوقهاسوقا وسياقافهوسائق وسوّاق شدد للمبالغة قال الراجز
  قدلفها الليل بواق حطم • ليس براعى ابل ولاغسم
  واستاقها فانساقت وسقت الى امى أتى صداقها وسقت الرجل أى أصبت ساقه والسيقة
  ما استاقه العدوّمن الدواب مثل الوسيقة وقال
  خاأنا الامثل سيقة العدا ان استقدمت نحروان جبأت عقر
  قال أبو زيد السيق من السحاب الذى تسوقه الريح وليس فيه ماء ويقال أسقتك ا بلا أى
  أعطيتك ابلاتسوقها والسياق نزع الروح يقال رأيت فلا نا يسوق أى ينزع عندالموت
  والسويق معروف (سهق السهوق الطويل من الرجال والتديدة من الرياح
  عن الفراء
  صل الشين بق لشبق شدّة الغلمة وقد شبق بالسكسر قال رؤية
  لا يترك الغيرة من عهد الشبق* ( برق ، شبرقت الثوب شيرقة وشبراها أى حزقته
  قال الشاعر
  فأدركنه يأخذن بالساق والنسا * كمشبرق الولدان ثوب المقدسى
  وصار الثوب شباريق أى قطعا وشبرقت اللحم وشربقته أى قطعته والشبرق بالمكسريبت
  وهورطب الضريع والشبارق معرّ ب ألحقوه بعذافر ⁦(شدق )⁩ الشدق جانب
  الفم يقال نفخ فى شدقيه والمع الأشداق والشدق بالتحريك سعة الشدق يقال خطيب
  أشدق بين الشدق والمتشدق الذى يلوى شدقه للتفصح رق) الشرق المشرق
  والشرق الشمس يقال طلع الشرق ولا آتيك ماذرتشارق والمشرقان مشرقا الصيف والشتاء
  والمشرقة موضع القعود فى الشمس وفيبه أربع لغات مشرقة ومسرقة بضم الراءوذتحها
  وشرقة بفتح الشين وتسكين الراء ومشراق وتشرّقت أى جلست فيه وشرقت الشمس
  تشرق شروقا وشرقاأيضا أى طلعت وأشرقت أى أضاءت وأشرق الرجسل أى دخل فى
  شروق الشمس وأشرق وجهه أى أضاء وتلأً لا حسنا وشرقت الشاة أشرهاشرقا أى
  ثققت أذنها وقد شرقت الشاة بالسكسر فهى شاشرقاهبينة الشرق والشرق أيضا الشجا
  ٢٤
  صحاح
  بى
  قوله خاأناإلا الخ رواء فى ماتة
  جبافهسل أناالا إه مم
