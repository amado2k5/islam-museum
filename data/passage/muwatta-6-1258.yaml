label: { ar: "الموطأ 1258 — مالك: ما كان من ذلك هديا فلا يكون إلا بمكة، وما كان نسكا فيكون حيث أحب صاحب النسك", en: "Muwatta 1258", es: "Muwatta 1258", fr: "Muwatta 1258", ur: "موطا 1258", tr: "El-Muvatta 1258 — Malik: Kurban olarak kastedilen şey yalnızca Mekke'de yapılmalıdır; ritüel kurban olarak kastedilen ise ritüeli gerçekleştiren kişinin dilediği yerde yapılmalıdır.", id: "Al-Muwatta 1258 — Malik: Apa yang dimaksudkan sebagai persembahan kurban hanya boleh dilakukan di Mekah, dan apa yang dimaksudkan sebagai kurban ritual boleh dilakukan di mana pun orang yang melakukan ritual tersebut inginkan." }
summary:
  ar: "يقول مالك إن ما كان من ذلك هديا فلا يكون إلا بمكة، وما كان نسكا فهو يكون حيث أحب صاحب النسك، لأنه لم يسمه هديا. {cite:muwatta-maruf-1997 p.560}"
  tr: "Malik, kurban olarak adlandırılan şeyin yalnızca Mekke'de yapılabileceğini, ritüel kurban olarak adlandırılan şeyin ise ritüeli gerçekleştiren kişinin dilediği yerde yapılabileceğini söyler; çünkü o buna kurban sunu dememiştir. {cite:muwatta-maruf-1997 s.560}"
  id: "Malik mengatakan bahwa apa yang dimaksud dengan persembahan kurban hanya dapat dilakukan di Mekah, sedangkan apa yang dimaksud dengan kurban ritual dapat dilakukan di mana pun orang yang melakukan ritual tersebut inginkan, karena ia tidak menyebutnya sebagai persembahan kurban. {cite:muwatta-maruf-1997 p.560}"
