label: { ar: "الموطأ 2589 — مالك: إذا قتل العبد عبدا فلا قسامة على سيد المقتول إلا ببينة أو شاهد", en: "Muwatta 2589", es: "Muwatta 2589", fr: "Muwatta 2589", ur: "موطا 2589", tr: "El-Muvatta 2589 — Malik: Bir köle başka bir köleyi öldürürse, öldürülen kölenin efendisi, delil veya şahit olmadığı sürece yemin etmek zorunda değildir.", id: "Al-Muwatta 2589 — Malik: Jika seorang budak membunuh budak lainnya, tuan dari budak yang terbunuh tidak diwajibkan untuk bersumpah kecuali ada bukti atau saksi." }
summary:
  ar: "قال مالك: فإن قتل العبد عبدا عمدا أو خطأ، لم يكن على سيد العبد المقتول قسامة ولا يمين، ولا يستحق سيده ذلك إلا ببينة عادلة، أو بشاهد، فيحلف مع شاهده. قال يحيى: قال مالك: وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.459}"
  tr: "Malik şöyle dedi: Bir köle başka bir köleyi kasten veya kasıtsız öldürürse, öldürülen kölenin efendisinin yemin etmesi veya ant içmesi gerekmez; ancak haklı bir delil veya şahit varsa yemin eder, şahitle birlikte yemin eder. Yahya şöyle dedi: Malik şöyle dedi: Bu duyduğum en iyi rivayettir. {cite:muwatta-maruf-1997 s.459}"
  id: "Malik berkata: Jika seorang budak membunuh budak lain, baik sengaja maupun tidak sengaja, tuan dari budak yang terbunuh tidak diwajibkan untuk bersumpah atau mengucapkan sumpah, dan ia juga tidak berhak atas sumpah tersebut kecuali dengan bukti yang sah atau saksi, dalam hal ini ia bersumpah bersama dengan saksinya. Yahya berkata: Malik berkata: Ini adalah penjelasan terbaik yang pernah kudengar. {cite:muwatta-maruf-1997 p.459}"
