label: { ar: "الموطأ 2589 — مالك: إذا قتل العبد عبدا فلا قسامة على سيد المقتول إلا ببينة أو شاهد", en: "Muwatta 2589" }
summary:
  ar: "قال مالك: فإن قتل العبد عبدا عمدا أو خطأ، لم يكن على سيد العبد المقتول قسامة ولا يمين، ولا يستحق سيده ذلك إلا ببينة عادلة، أو بشاهد، فيحلف مع شاهده. قال يحيى: قال مالك: وهذا أحسن ما سمعت. {cite:muwatta-maruf-1997 p.459}"
