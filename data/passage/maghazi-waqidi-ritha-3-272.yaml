text: "… فى يدك لم أَرغب بنفسى عن نفسك. ورجوتُ أَلّا تكون ازدردتها وفيها نَعْى. فلم يَرِم بِشرٌ من مكانِهِ حتى عاد لونُه كالطَّيْلَسان. وماطَلَه وجعُه سنةً لا يَتحوّل إِلّا ما حُوّل، ثم مات منه. ويقال لم يَقُم من مكَانه حتى مات، …"
