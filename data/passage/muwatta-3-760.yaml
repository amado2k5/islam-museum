label: { ar: "الموطأ 760 — بلاغ: عمر بن عبد العزيز كتب إلى عماله أن يضعوا الجزية عمن أسلم من أهل الجزية حين يسلمون", en: "Muwatta 760", es: "Muwatta 760", fr: "Muwatta 760", ur: "موطا 760", tr: "El-Muvatta 760 — Rivayet: Ömer ibn Abdülaziz, valilerine, cizyeye tabi olanlardan İslamiyet'e geçenlerin cizyeden muaf tutulmasını emretti.", id: "Al-Muwatta 760 — Laporan: Umar ibn Abd al-Aziz menulis kepada para gubernurnya untuk membebaskan dari jizya orang-orang yang dikenai jizya yang masuk Islam ketika mereka masuk Islam." }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عمر بن عبد العزيز كتب إلى عماله أن يضعوا الجزية عمن أسلم من أهل الجزية حين يسلمون. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.376}"
  tr: "Malik, Ömer ibn Abdülaziz'in valilerine, cizye (baş vergisi) yükümlülüğüne tabi olanlardan İslam'a geçenleri muaf tutmaları yönünde talimat verdiğini duyduğunu bildirmiştir. Araştırmacı, bunu Ebu Musab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.376}"
  id: "Malik melaporkan bahwa ia mendengar bahwa Umar ibn Abd al-Aziz menulis surat kepada para gubernurnya yang memerintahkan mereka untuk membebaskan orang-orang yang masuk Islam dari pajak jizya (pajak kepala). Peneliti menyebutkan bahwa Abu Musab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.376}"
