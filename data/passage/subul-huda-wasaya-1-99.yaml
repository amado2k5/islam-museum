text: "… الذي يأتيه روحِ القُدسُ. وروى أَبو نُعَيم عن كعب تعالى قال: كان أَبي من أَعْلم الناس بما أَنزل اللّٰه على موسى، وكان لم يدخر عَنِّي شيئاً مما كان يعلم، فلما حَضَرَه المَوْتُ دعاني فقال لي: يا بنيّ إِنك قد علمت …"
