text: "… أسه قبل الإمام التحفة. المعجم باب ما جاء في الذي يصلي الفريضة ثم يؤم الناس بعد ذلك التحفة المعجم باب ما ذكر من الرخصة في السجود على الثوب في الحر والبرد التحفة المعجم باب ما ذكر مما يستحب من الجلوس …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 1026، يرد فيه ذكر الفريضة والفرائض، والمستحب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
