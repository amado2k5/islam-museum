text: |-
  •⁦(باب اللام)⁩•
  .....قل).
  ٢٤٥
  بأفوق ناصل ويقال أيضائصل السهم اذا ئيت نصله فى الشى فلم يخرج وهو من الاضداد
  ونصلت السهم تنصيلا نزعت نصله وهوكقولهم قردت البعير وقذيت العين اذا نزعت منه
  منه القراد والقذى وكذلك اذار كبت عليه النصل وهو من الاضداد وأنصلت الرمح اذا
  نزعت نصله وكان يقال لرحب فى الجاهلية منصل الاسنة ومنصل الال" لانهم كانوا ينزعون
  الاسنة فيه ولا يغزون ولا يغير بعضهم على بعض قال الاعشى
  تداركه فى منصل الال بعدما * مضى غيرد أداء وقد كاد يعطب
  والنصيل مفصل ما بين العفق والرأس من تحت اللحيين وتنصل فلان من ذنبه أى تبر أو تنصلت
  الشئ واستتصلته اذا استخرجته يقال استصل الهيف السفااذا أسقطته ⁦(نضل)⁩ ناضله
  أى راماه يقال ناضلت ولا نافنضلته اذا غلبته واتتضل القوم وتناضاوا أى رمو اللسبق ومنه
  قبل انتضلوا بالكلام والاشعار وفلان يناضل عن فلان اذا تكام عنه بعذره ودفع وانتضال
  الابل رميها بأيديها فى السير وانتضلت رحلا من القوم وانتضلت مهما من الكنانة أى
  اخترت ونضلة اسم رجل وكان هائم بن عبدمناف يكن أباتضلة ⁦(نطل )⁩ الاصمعى
  | الناطل بالكسر غير مهموز كوز كأن يكال به الجمر والجمع النياطل قال أبوذؤيب
  فلوأن ماعندا بن بجرة عندها • من الجرلم سلل لهاتى بناطل
  والنيطل الدلو وقال الراجز• فاهبتهم بنيطل جروف• والنيطل الداهية ونطلت رأس العليل
  بالنطول وهو أن تجعل الإاء المطبوخ بالادوية فى كوزثم تصبه على رأسه قليلا قليلا عل .
  النعل الهذاء مونمة وتصغير هما ئعيلة تقول ذملت وانتعلت اذا احتذيت ورجل فاعل ذوذعل
  وفى المنل أطرّى فانك ناعلمة ويقال لحار الوحش ناعل لصلاية حافره وأنعلت خفى ودابتى
  ولا يقال أهات والتعل الارض الفليظة يبرق حصاءلا يذبت شيا وفعل السيف ما يكون فى
  أسفل جفنه من حديدة أوفضة وقال ذو الرمة
  الى ملت لا ينصف البداق نعله • أجل لاوان كانت طوالاسائله
  والنعل العقب الذى يلبس ظهرسية القوس والانعال أن يكون البياض فى مؤخر الرسغ عما
  يلى الحافر على الاشعر لا يعدوه ولا يستدير يقال فرص منعسل يدكذا ورجل كذا فاذا جاوز
  . الاشاعر وبعض الارساغ واستدارفهو التخديم وودية ضعلة اذا قلعت من أمّها بكربما
  ⁦( تعثل )⁩. النعثل الذكر من الضباع ونعثل اسم رجل كان طويل اللحية وكان عثمان
  رضى اللّٰه عنه اذائيل منه وعيب شبه بذلك الرجل لطول لحيته والنعثلة مثل النقشلة وهى
  مشبة الشيخ غل نغل الاديم بالكسر أى فسدفهو نغل ومنه قواهم فلان نغل اذا
  كان فاسد النسب والعامة تقول نغل ونغل قلبه على أى ضغن يقال نغلت نياتهم أى
  فسدت وبرأ الجرح وفيه شىْ من نغل بالتخريك أى فساد والنغل أيضا الافساديين القوم
  والنميمة قال الاعشى يذكر بنات الارض
  يوماتراها كشبه أردية الخس ويوما أديمهاذغ_لا
  ⁦( نقل)⁩ النقل والنافلة عطية التطوع من حيث لاتجب ومنه نافلة الصلاة والنبافلة
  أيضاولد الولد وانتفل من الشى أى انتفى منه وتنضل كأنه ابدال منه قال الاعشى
  لى
  فوله وفى المثل أطرى الح قال ابن
  السكت أى أدلى فان عليك
  تعلين يضرب للمذ كر والمؤنث
  والاثنين والجمع على افظ التأنيت
  لان أصل المثسل خوطبت به
  امرأة فيجرى على ذلك وقال أبو
  عبيد معناه اركب الامر الشديد
  فانك قوى عليه قال وأصله أن
  رجلا فال لراعية له كانت تزعى
  فى السهولة وتترك الحزونة أطرى
  أى خذى طرر الوادى وهى
  نواحيه فان عليك نعاين قال
  أحبه عنى بالتعليز غلظ جلد
  قدميم ا قاله المؤلف اه
