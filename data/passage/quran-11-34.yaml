text: "وَلَا يَنفَعُكُمْ نُصْحِىٓ إِنْ أَرَدتُّ أَنْ أَنصَحَ لَكُمْ إِن كَانَ ٱللَّهُ يُرِيدُ أَن يُغْوِيَكُمْ ۚ هُوَ رَبُّكُمْ وَإِلَيْهِ تُرْجَعُونَ"
text_search: "ولا ينفعكم نصحي إن أردت أن أنصح لكم إن كان الله يريد أن يغويكم ۚ هو ربكم وإليه ترجعون"
translations:
  en: { text: "My counsel will not profit you if I were minded to advise you, if Allah's will is to keep you astray. He is your Lord and unto Him ye will be brought back.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور اگر میں یہ چاہوں کہ تمہاری خیرخواہی کروں اور خدا یہ چاہے وہ تمہیں گمراہ کرے تو میری خیرخواہی تم کو کچھ فائدہ نہیں دے سکتی۔ وہی تمہارا پروردگار ہے اور تمہیں اس کی طرف لوٹ کر جانا ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
