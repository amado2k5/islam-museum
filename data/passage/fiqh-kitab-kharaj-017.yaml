text: "ق وقبل قوله. فان قال. أنا رسول الملك بعثني إلى ملك العرب، وهذا كتابه معي، وما معي من الدواب والمتاع والرقيق فهدية إليه فانه يصدق ويقبل قوله إذا كان أمرا معروفا، فان مثل ما معه لا يكون إلا على مثل"
