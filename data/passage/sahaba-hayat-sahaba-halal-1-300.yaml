  tr: "Kandhlawi'nin \"Sahabelerin Hayatları\" adlı eserinin 1. resimli cildinin 300. sayfasında, yasak olan şeylerden bahsediliyor; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kehidupan Para Sahabat\" karya Kandhlawi, jilid bergambar 1, halaman 300, menyebutkan apa yang dilarang; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
