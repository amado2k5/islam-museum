text: "… هبيرة، كما فى الكنز ج ص. قراءة السور من القرآن فى الليل والنهار والسفر والحضر اخرج ابن عاكر عن عقبة بن عامر الجهنى قال: لقيت النبى فقال لى: ياعقبة بن عامر! صل من قطعك، و أعط من حرمك، واعف عمن …"
summary:
