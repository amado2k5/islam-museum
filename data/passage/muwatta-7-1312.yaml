label: { ar: "الموطأ 1312 — القاسم بن محمد: سأل رجل ابن عباس عن الأنفال، فقال الفرس من النفل والسلب من النفل، ثم ضربه عمر لشبهه بصبيغ", en: "Muwatta 1312" }
summary:
  ar: "يروي مالك عن ابن شهاب عن القاسم بن محمد أنه سمع رجلا يسأل عبد الله بن عباس عن الأنفال، فقال ابن عباس الفرس من النفل، والسلب من النفل. ثم عاد الرجل يسأل، حتى كاد أن يحرجه، فقال ابن عباس أتدرون ما مثل هذا؟ مثل صبيغ الذي ضربه عمر بن الخطاب. ويذكر المحقق أن صبيغ بن عسل قدم المدينة يسأل عن متشابه القرآن، فضربه عمر لأجل ذلك. {cite:muwatta-maruf-1997 p.586}"
