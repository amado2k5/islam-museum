label: { ar: "الموطأ 1312 — القاسم بن محمد: سأل رجل ابن عباس عن الأنفال، فقال الفرس من النفل والسلب من النفل، ثم ضربه عمر لشبهه بصبيغ", en: "Muwatta 1312", es: "Muwatta 1312", fr: "Muwatta 1312", ur: "موطا 1312", tr: "El-Muvatta 1312 — El-Kâsım ibn Muhammed: Bir adam İbn Abbas'a savaş ganimetleri hakkında sordu ve o da, \"At da ganimetin bir parçasıdır, yağmalanan mallar da ganimetin bir parçasıdır\" dedi. Bunun üzerine Ömer, Sabigh'a benzediği için ona vurdu.", id: "Al-Muwatta 1312 — Al-Qasim ibn Muhammad: Seorang pria bertanya kepada Ibn Abbas tentang rampasan perang, dan dia berkata, “Kuda adalah bagian dari rampasan perang, dan jarahan adalah bagian dari rampasan perang.” Kemudian Umar memukulnya karena kemiripannya dengan Sabigh." }
summary:
  ar: "يروي مالك عن ابن شهاب عن القاسم بن محمد أنه سمع رجلا يسأل عبد الله بن عباس عن الأنفال، فقال ابن عباس الفرس من النفل، والسلب من النفل. ثم عاد الرجل يسأل، حتى كاد أن يحرجه، فقال ابن عباس أتدرون ما مثل هذا؟ مثل صبيغ الذي ضربه عمر بن الخطاب. ويذكر المحقق أن صبيغ بن عسل قدم المدينة يسأل عن متشابه القرآن، فضربه عمر لأجل ذلك. {cite:muwatta-maruf-1997 p.586}"
  tr: "Malik, İbn Şihab'dan, o da el-Kasım ibn Muhammed'den rivayet ettiğine göre, bir adamın Abdullah ibn Abbas'a savaş ganimetleri (anfal) hakkında soru sorduğunu işittiğini anlatır. İbn Abbas, \"At ganimetin bir parçasıdır, yağma da ganimetin bir parçasıdır\" diye cevap verdi. Bunun üzerine adam soru sormaya devam etti ve neredeyse onu utandırdı. İbn Abbas, \"Bunun neye benzediğini biliyor musun? Ömer ibn el-Hattab'ın vurduğu Sabigh'ın durumuna benziyor\" dedi. Araştırmacı, Sabigh ibn Asal'ın Kur'an'ın belirsiz ayetleri hakkında soru sormak için Medine'ye geldiğini ve Ömer'in bu yüzden onu vurduğunu belirtiyor. {cite:muwatta-maruf-1997 s.586}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari al-Qasim ibn Muhammad, bahwa ia mendengar seorang pria bertanya kepada Abdullah ibn Abbas tentang rampasan perang (anfal). Ibn Abbas menjawab, \"Kuda adalah bagian dari rampasan perang, dan jarahan adalah bagian dari rampasan perang.\" Kemudian pria itu terus bertanya, hampir mempermalukannya. Ibn Abbas berkata, \"Tahukah kamu seperti apa ini? Ini seperti kasus Sabigh, yang dipukul oleh Umar ibn al-Khattab.\" Peneliti menyebutkan bahwa Sabigh ibn Asal datang ke Madinah untuk bertanya tentang ayat-ayat Al-Quran yang ambigu, dan Umar memukulnya karena itu. {cite:muwatta-maruf-1997 p.586}"
