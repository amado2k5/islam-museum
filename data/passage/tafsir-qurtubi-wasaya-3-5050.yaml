text: "… واسمه حزقيل، وأبنته آسية أمرأة فرعون، ومريم بنت ذا موسى العجوز التي دلت على قبر يوسف الصديق. وذلك أن موسى لما خرج ببني إسرائيل من مصر أظلم عليهم القمر فقال لقومه: ما هذا؟ فقال علماؤهم: إن يوسف لما حضره الموت …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 5050، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
