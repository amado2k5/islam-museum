label: { ar: "الموطأ 401 — ابن عمر يقيم بمكة عشراً يقصر إلا مع الإمام", en: "Muwatta 401" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب صلاة المسافر ما لم يجمع مكثاً: أقام ابن عمر بمكة عشر ليال يقصر الصلاة إلا أن يصليها مع الإمام فيصليها بصلاته تامة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.212}"
