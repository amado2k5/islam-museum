label: { ar: "الموطأ 401 — ابن عمر يقيم بمكة عشراً يقصر إلا مع الإمام", en: "Muwatta 401", es: "Muwatta 401", fr: "Muwatta 401", ur: "موطا 401", tr: "El-Muvatta 401 — İbn Ömer on gün boyunca Mekke'de kalır ve imamla birlikte namaz kıldığı zamanlar dışında namazlarını kısaltır.", id: "Al-Muwatta 401 — Ibnu Umar tinggal di Mekah selama sepuluh hari dan mempersingkat salatnya kecuali ketika salat bersama Imam." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب صلاة المسافر ما لم يجمع مكثاً: أقام ابن عمر بمكة عشر ليال يقصر الصلاة إلا أن يصليها مع الإمام فيصليها بصلاته تامة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.212}"
  tr: "Malik'in Nafi'den rivayet ettiği, uzun süre kalmayan bir yolcunun namazı bölümünde yer alan bir rivayete göre: İbn Ömer, Mekke'de on gece kalmış ve imamın arkasında namaz kılmadığı sürece namazlarını kısaltmış, imamın arkasında namaz kıldığı durumlarda ise tam namaz kılmıştır. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.212}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang shalat seorang musafir yang tidak tinggal lama: Ibnu Umar tinggal di Mekah selama sepuluh malam, mempersingkat shalatnya kecuali jika ia shalat di belakang imam, dalam hal ini ia akan mengerjakan shalat lengkap. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.212}"
