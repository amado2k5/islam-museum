label: { ar: "سنن أبي داود 2664 — الأب والأبوة", en: "Sunan Abi Dawud 2664 — the father and fatherhood", ur: "سنن ابی داؤد 2664 — باپ اور والدیت" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عِيسَى، حَدَّثَنَا إِسْحَاقُ بْنُ نَجِيحٍ، - وَلَيْسَ بِالْمَلْطِيِّ - عَنْ مَالِكِ بْنِ حَمْزَةَ بْنِ أَبِي أُسَيْدٍ السَّاعِدِيِّ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ النَّبِيُّ يَوْمَ بَدْرٍ \" إِذَا أَكْثَبُوكُمْ فَارْمُوهُمْ بِالنَّبْلِ وَلاَ تَسُلُّوا السُّيُوفَ حَتَّى يَغْشَوْكُمْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2664، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2664 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2664، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
