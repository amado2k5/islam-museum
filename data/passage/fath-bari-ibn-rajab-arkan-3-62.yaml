text: "الحديث أفضل الأعمال أداء ما فرض اللّٰه أفضل الأعمال الإيمان بالله ثم الجهاد في سبيل اللّٰه.. أفضل الأعمال الحب في اللّٰه أفضل أيام الدنيا أيام العشر أفضل الإيمان أن تحب لله أفضل الجهاد حج مبرور أفضل الصلوات عند اللّٰه صلاة …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 3، ص 62، يذكر حلاوة الإيمان وكماله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 3, p. 62, that mentions the sweetness and completeness of faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 3، ص 62 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
