text: "باب البعثة ان شاء اللاه تعالي. مكة: اختلف في سبب تسميتها مكة بالميم، فقيل: لانها تمك الجبارين، اي تذهب نخوتهم. وقيل: لانها تمك الفاجر عنها، اي تخرجه. وقيل: لانها تجذب الناس اليها من قولهم:امتك الفصيل ما في ضرع امه اذا لم يثق"
