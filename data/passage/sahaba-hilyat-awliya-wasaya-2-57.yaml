text: "- → أنى لا أموت حق يدفع إلى فاغسله وأحنطه وأكفنه ثم أدفنه، فلم يلبثوا أن جاء كتاب مبد الللك أن يدفع إلى أهله، فاتى به أسماء فنساته وطيبته ثم حنطته ثم دفنته قال أيوب فحسبت قال فعاشت بعد ذلك …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 57، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 57, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
