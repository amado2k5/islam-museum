label: { ar: "صحيح البخاري 5999 — الأب والأبوة", en: "Sahih al-Bukhari 5999 — the father and fatherhood", ur: "صحیح بخاری 5999 — باپ اور والدیت", es: "Sahih al-Bukhari 5999 — El padre y la paternidad", fr: "Sahih al-Bukhari 5999 — Le père et la paternité" }
text: "حَدَّثَنَا ابْنُ أَبِي مَرْيَمَ، حَدَّثَنَا أَبُو غَسَّانَ، قَالَ حَدَّثَنِي زَيْدُ بْنُ أَسْلَمَ، عَنْ أَبِيهِ، عَنْ عُمَرَ بْنِ الْخَطَّابِ ـ قَدِمَ عَلَى النَّبِيِّ سَبْىٌ، فَإِذَا امْرَأَةٌ مِنَ السَّبْىِ قَدْ تَحْلُبُ ثَدْيَهَا تَسْقِي، إِذَا وَجَدَتْ صَبِيًّا فِي السَّبْىِ أَخَذَتْهُ فَأَلْصَقَتْهُ بِبَطْنِهَا وَأَرْضَعَتْهُ، فَقَالَ لَنَا النَّبِيُّ \" أَتَرَوْنَ هَذِهِ طَارِحَةً وَلَدَهَا فِي النَّارِ \". قُلْنَا لاَ وَهْىَ تَقْدِرُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5999، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5999 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5999، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5999 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5999 (Les bonnes manières et la bienséance), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
