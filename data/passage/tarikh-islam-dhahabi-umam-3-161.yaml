text: "… بن عبد الله بن كعب بن مالك، عن أبيه، أَنّ كعب بن الأشرف اليهودي كان شاعراً، وكان يهجو رسول اللّٰه تَيخ ويحرّض عليه كُفّار قريش في شعره. وكان رسول اللّٰه وَلِ قدِم المدينة وأهلُها أخلاطٌ، منهم المسلمون، ومنهم عَبَدَة الأوثان، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 3، ص 161، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 3, p. 161, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 3، ص 161 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
