label: { ar: "الموطأ 280 — مالك: على ذلك أهل العلم بالمدينة، لحديث من أدرك ركعة", en: "Muwatta 280", es: "280 copias", fr: "280 exemplaires", ur: "280 کاپیاں", tr: "El-Muvatta 280 — Malik: Bu, Medine âlimlerinin hadise dayalı görüşüdür: “Kim bir rekat namazı yakalarsa…”", id: "Al-Muwatta 280 — Malik: Ini adalah pendapat para ulama Madinah, berdasarkan hadits: “Barangsiapa yang mengerjakan satu rakaat" }
summary:
  ar: "قول لمالك في باب ما جاء فيمن أدرك ركعة يوم الجمعة: على ذلك أدرك أهل العلم بالمدينة، واحتج بحديث النبي أن من أدرك من الصلاة ركعة فقد أدرك الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن الحديث الذي أشار إليه تقدم في هذا الكتاب برقم 15. {cite:muwatta-maruf-1997 p.162}"
  tr: "Malik, Cuma namazının bir rekatı tutan kişi hakkında rivayet edilenler bölümünde şöyle demiştir: Medine âlimlerinin anladığı budur ve Peygamberimizin şu hadisini aktarmıştır: \"Kim namazın bir rekatı tutarsa, namazı tutmuş olur.\" Editör, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini ve Malik'in bahsettiği hadisin bu kitapta daha önce 15. hadis olarak geçtiğini belirtmektedir. {cite:muwatta-maruf-1997 s.162}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan mengenai orang yang mengikuti satu rakaat shalat Jumat: Inilah yang dipahami oleh para ulama Madinah, dan beliau mengutip hadits Nabi bahwa siapa pun yang mengikuti satu rakaat shalat, maka ia telah mengikuti shalat. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik, dan hadits yang beliau maksudkan telah disebutkan sebelumnya dalam buku ini sebagai nomor 15. {cite:muwatta-maruf-1997 p.162}"
