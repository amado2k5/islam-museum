text: "… في حديثِ الدنيا أو في التجارةِ، فهذا من مباحِ الكلامِ في غيرِ المسجدِ. وقد اختُلِفَ في كراهةِ مثلِه في المسجد. فكَرِهَه طائفةٌ من العلماء. قال أصحابُنا. منهم ابنُ بَطَّةَ وغيرُه : يُكرهُ الحديثُ فيه إلا لمصلحة في الدين. قالَ أحمدُ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 2، ص 344، يرد فيه ذكر الكراهة، والمباح، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 2, p. 344, whose wording mentions dislike (karaha), the permitted (mubah), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 2، ص 344 کا اقتباس جس میں کراہت، مباح، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 2, p. 344, dont le texte mentionne la réprobation (karaha), le permis (mubah), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
