text: "… شيء زدت فيه شيئاً يسيراً، وكذا تفعل في الثالث تزيد وتنقص حسب ما يوجب كما تزيد الناقة، ومن أحتاج إلى إنعاش بدنه فمن الواجب أن تزيد في حركته بالركوب والمشي بقياس زيادة البدن وتفعل سائر ما يجب أن تفعله على …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 742، يرد فيه ذكر الواجب، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 742, whose wording mentions the obligatory (wajib), what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الحاوی فی الطب، رازی، ص 742 کا اقتباس جس میں واجب، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hawi fi al-Tibb de al-Razi, p. 742, dont le texte mentionne l'obligatoire (wajib), ce qui doit être fait ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Hawi fi al-Tibb de al-Razi, p. 742, cuyo texto menciona lo obligatorio (wajib), lo que debe hacerse; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Razi'nin El-Havi-i el-Tibb adlı eserinin 742. sayfasından, farz olan amelleri ve gerekenleri anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Hawi fi al-Tibb karya Al-Razi, halaman 742, yang menyebutkan amalan wajib dan apa yang diwajibkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
