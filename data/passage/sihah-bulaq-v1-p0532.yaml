text: |-
  ⁦(فصل الواو)⁩
  وعب)
  ٢٠٩
  فلم يبق فيها كلاً واشتماوظبت ورجل موظوب اذا تداوات ماله النوائب وقال سلامة
  ابن جندل
  كانخل إذا هبت شا مية • بكل وادجديب البطن موظوب ( 1
  وموظب بالفتح اسم موضع أنشدابن الاء رابى لحداش بن زهير
  كذبت عليكم أوعدونى وعللوا • بى الارض والاقوام قردانموظبا
  يقول ياقردان موظب عليكم بى وبهجاءى اذا كنتم فى سفر فاقطعوابذ كرى الارض
  ⁦( وعب )⁩ أوعب القوم اذا حشدوا وجاؤا موعبين اذا جعوا ما استطاءوا من جمع ابن
  السحكمت أوعب نوفلان جلاء فلم يبق ببلدهم منهم أحد وباء الفرس بركض وعيب
  أى بأقصى ماعنده وتقول جدعه فاوعب أنفه أى استأصله وفى الشتم جدعه اللّه جدعا
  موعبا وفى الحديث فى الانف اذا استوعب جدعه الدية اذالم يترك منه شئ واستبعاب الشئ
  ستئصاله ⁦( وغب)⁩ الاصعى الوغب الاحق قال الراجز
  ولا ببرشاع الوخام ونغب
  والوغب أيضاسقط المتاع وأوغاب البيت كالقصعة والبرمة أ
  ونحوهما والوغب أيضا الجمل الضخم وقدوغب الجمسل بالضم وغوبة قب) الوقب
  فى الجبل نقرد يجتمع فيها الماء ووقية التريد أنة وعته ووقب العين نقرتها تقول وقبت عيناه!
  غارتا والوقب الاحق مثل الوغب قال أسود بن يعفر
  أبنى نجيح انّ أمكمو أمة وات أبا كووقب
  اكات خبيت الزادفا تخمت • عنه وشم خارها الكلب
  ووقب الشئ يقب وقبا ٢ ى دخسل تقول وقبت الشمس اذاعابت ودخلت موضعها
  ووقب الظلام دخل على الناس ومنه قوله تعالى ومن شرّغاسق اذا وقب قال الحسن ٣
  اذا دخل على الناس وأوقبت الشىْ اذا ادخلته فى الوقبة وأوقب القوم اى جاعوا
  والوقيب صون قنب الفرس والوقى ماءلبى مازن قال الشاعر (أبو الغول الطهوى
  اسلامى)
  هم منعواحى الوقى بضرب ٤ ي اف بين أشتات المنون
  كب) الموحكب باية من السير والموكب القوم الركوب على الابل للزينة وكذلك
  جماعة الفرسان وقد أوكب البعير اذالزم الموكب عن ابن السكيت وتقول واكبت القوم
  اذا ركبت معهم وكذلك اذاسابقتهم ووكب الرجل على الامر وأوكب اذا واظب
  عليه ويقال الوكب الانتصاب والواكبة القمائمة والوكبان مشية فى تؤدة ودرجان بقال
  ظبية وكوب وناقموا كبة للتى تعقق فى سيرها وأوكب الطائراذاتهيأللطيران ⁦( واب )⁩
  الوالبة الزرعسة تنيت من عروق الزرعة الاولى ووالية الابل نسلها وأولادها قال الشيدانى
  الوالب الذاهب فى الشئ الداخل فيه وقال
  رأيت عميرا والبسا فى ديارهم * وبئس الفتى ان ناب دهر ععظم
  أبو عبيد ولب اليك الشئيلب ولوبا وصل اليك كائنا ما كان ذكره فى باب نوادر الفعل ووالبة
  اسم دجل ⁦(وهب)⁩ وهبت لهشيئا وهبا ووهبابالتحريك وهبة والاسم الموهب والموهبة
  بكسرالها فيهما والاتهاب قبول الهبة والاستيهاب سؤال الهبة وتواهب القوم اذا وهب
  بعضهم لبعض وتقول هب ز يدا منعلمقا بمعنى احسب يتعمدى الى مفعواين ولا يستعمل
  أكل مافيه عن ابن السكيت
  وهال ابن برى صواب انشاد
  البيت حطيب البطن مجدوب
  والذى فيه موظوب بعده وهو
  شيب المباركك مدروس مدافعه
  هابى المراغ قليل الودق موظوب
  ٢ وابه وقو بالانه لازم اه م ن
  عن ١٥مش
  الصواب وان كان مكذا بخظ
  المؤلف وغيره كمانق له م رعن ابن
  يرى وأنه كأن للعرب بها أيام بين
  مازن وبكراه
