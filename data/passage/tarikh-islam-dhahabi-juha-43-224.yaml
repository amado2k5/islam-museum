text: "… شِعر في خمسة عشر مجلّداً. قاله العماد الكاتب. ومصتَفات أدبيَّة ومَدَح الخلفاء والوزراء، وتغيَّر ذهنه في آخر أيّامه قليلاً. وكان بارع الأدب بصيراً بالعَروض، مقدَّماً في اللّغة والنَّحْو، صاحب مُجُون وخلاعة ونوادر. سمع: أبا الحسين المبارك بن عبد الجبّار، وأبا …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 43، ص 224، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, scan volume 43, p. 224, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الاسلام والفاعیۃ المشاہیر والعالم، اسکین جلد 43، ص 224 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volume numérisé 43, p. 224, avec une anecdote ou un trait d'esprit ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volumen escaneado 43, p. 224, con una anécdota o agudeza; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Şahsiyetlerin Ölümleri\" adlı resimli cilt 43'ün 224. sayfasından, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 43, halaman 224, berisi anekdot cerdas atau cerita lucu; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
