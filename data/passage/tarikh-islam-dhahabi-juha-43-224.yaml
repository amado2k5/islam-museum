text: "… شِعر في خمسة عشر مجلّداً. قاله العماد الكاتب. ومصتَفات أدبيَّة ومَدَح الخلفاء والوزراء، وتغيَّر ذهنه في آخر أيّامه قليلاً. وكان بارع الأدب بصيراً بالعَروض، مقدَّماً في اللّغة والنَّحْو، صاحب مُجُون وخلاعة ونوادر. سمع: أبا الحسين المبارك بن عبد الجبّار، وأبا …"
