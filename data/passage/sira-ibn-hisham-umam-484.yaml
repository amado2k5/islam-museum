text: "… الضَّمْرِيُّ ؛ لو قد دَخَلْتُ على النجاشيِّ وسألته إياه فأعطانيهِ، فَضُرِبَتْ عنقه، فإذا فعلْتُ ذلك رأَتْ قريش أَنِّي قد أَجْزَأْتُ عنها حين قَتَلْتُ رسولَ محمدٍ، قال : فدخلْتُ عليه نسجدتْ له كما كُنْتُ أَصْنَعُ، فقال : مَرْحَباً بصديقي، أَهْدَيْتَ إِليَّ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 484، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Hisham's Sira, p. 484, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "سیرت ابن ہشام، ص 484 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
