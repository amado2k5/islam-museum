label: { ar: "الموطأ 2263 — هشام عن أبيه عن عائشة: أفضل الرقاب أغلاها ثمنا", en: "Muwatta 2263" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أن النبي سئل عن أفضل الرقاب، فقال: أغلاها ثمنا وأنفسها عند أهلها. وينقل المحقق عن ابن عبد البر أن الحديث مروي عن هشام عن أبي مراوح عن أبي ذر، وأنه المحفوظ في الصحيحين، وأن رواية مالك المرفوعة إلى عائشة خطأ عنده. {cite:muwatta-maruf-1997 p.333}"
