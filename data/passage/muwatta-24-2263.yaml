label: { ar: "الموطأ 2263 — هشام عن أبيه عن عائشة: أفضل الرقاب أغلاها ثمنا", en: "Muwatta 2263", es: "Muwatta 2263", fr: "Muwatta 2263", ur: "موطا 2263", tr: "El-Muvatta 2263 — Hişam, babasından, o da Ayşe'den rivayetle: En iyi köleler en pahalı olanlardır.", id: "Al-Muwatta 2263 — Hisham, berdasarkan riwayat ayahnya, berdasarkan riwayat Aisyah: Budak terbaik adalah budak yang paling mahal." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أن النبي سئل عن أفضل الرقاب، فقال: أغلاها ثمنا وأنفسها عند أهلها. وينقل المحقق عن ابن عبد البر أن الحديث مروي عن هشام عن أبي مراوح عن أبي ذر، وأنه المحفوظ في الصحيحين، وأن رواية مالك المرفوعة إلى عائشة خطأ عنده. {cite:muwatta-maruf-1997 p.333}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayet ederek, Peygamberimize en iyi köleler sorulduğunda, \"Sahipleri için en değerli ve en kıymetli olanlardır\" dediğini aktarır. Araştırmacı, İbn Abdül-Barr'ın bu hadisin Hişam'dan, o da Ebu Merve'den, o da Ebu Zerr'den rivayet edildiğini ve bunun iki Sahih'te (Buhari ve Müslim) korunan versiyon olduğunu, Malik'in Aişe'ye atfettiği rivayetin ise kendi görüşüne göre bir hata olduğunu söylediğini aktarır. {cite:muwatta-maruf-1997 s.333}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, bahwa Nabi ditanya tentang budak terbaik, dan beliau bersabda: “Budak yang paling mahal dan paling berharga bagi pemiliknya.” Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits tersebut diriwayatkan dari Hisham, dari Abu Marwah, dari Abu Dharr, dan bahwa ini adalah versi yang terpelihara dalam dua kitab Sahih (Bukhari dan Muslim), dan bahwa riwayat Malik yang dinisbahkan kepada Aisyah adalah sebuah kesalahan menurut pandangannya. {cite:muwatta-maruf-1997 p.333}"
