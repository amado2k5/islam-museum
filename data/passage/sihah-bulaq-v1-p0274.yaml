text: |-
  (فصل العين
  ⁦(عندر)⁩
  ٣٦٧
  وتعفير اللحم تجفيفه على الرمل فى الشمس واسم ذلك اللحم العفير وانعفر الشئ أى تترّب
  واعتفر مثله وعال المراريصف شعرامر أة بالكنافة والطول
  تهلك المدراة فى أكتافه * واذا ما أرسلته يعتفر
  ويروى ينعفر ويقال اعتفره الاسد اذا فرسه والتعفير التيييض وفى الحديث أن امر أة/
  شكت اليه أنّ مالها لايز كوا فقال ما ألوانها قالت سودذقال عفرى أى استبدلى أغناما
  بيضافان البركة فيها والعفير من النساء التى لا تهدى لحارتها شيئا قال الكميت
  واذا الخرداعنزرن من المحل * وصارت مهداوهن عفيرا
  والعفير السويق الملتوت بلا أدم والاعفر الرمل الاحروالاعفر الابيض وليس بالشديد
  البياض وشاة عه وايعلوبياضها حسرة أبو عمر والعفر من الظبا التى يعلو بياضها جرة قصار
  الاعناف وهى أضعف الظباءعد واتسكن القفاف وصلابة الارض قال الكميت
  وكنا اذا جبارقوم أرادنا بكيد حلماه على قرن أعفرا
  يقول نقتله ونحمل رأسه على السنان وكانت تكون الاسنة فيمامضى من القرون والعفراء
  من الليسالى ليلة ثلاث عشرة والمعفورة الارض التى أكل نبتها واليعفور الخشف وولد البقرة
  الوحشية أيضا وقال بعضهم اليعافيرتيوس الظباء والاسود بن يعفر الشاعراذاقلته بفتح
  الساءلم تصر فه لانه مثل يقتل وقال يونس سمعت رؤبة يقول أسود بن يعقر بضم الياءوهذا
  بنصرف لأنه قد زال عنه شبه الفعل والعذار شجر تقدح منه الناروفى المثل فى كل شجر نار
  واستمجد المرخ والعفار والعفار أيضا اصلاح النخلة وتلقيحها يقال كتافى العفار وهو بالفاء،
  أشهرمنه بالقاف والعفارلغة فى القفاروهو الجبز بلا أدم والعفر بالكسر الخنزير الذكر
  والعفر الرجل الحبيت الداهى والمرأة عفرة قال أبو عبيدة الغفريت من كل شئ المبالغ يقال
  فلان عريت نفريت وعفرية نفرية وفى الحديث ان اللّٰه تعالى يبغض العفرية النفر بة الذى
  لا يرزأ فى أهل ولامال والعفرية المصحح والنفرية اتباع قال والعفارية مثل العفريت
  وهوواحد وأنشد لجرير
  قرنت الظالمين بمر مريس ، يذل لها العفارية المريد
  قال اخليل شطان عفرية وعفريت وهم العفارية والعفاريت اذاسكنت الياءصيرت الهاء
  تاءواذاحر كنها فالناءهاء فى الوقف قال ذوالرمة
  كأنه كوكب فى الرعفرية • مسوم فى سواد الليل منقضب
  والعفرية أيضا الداهية والعفرة بالضم شعرة القفامن الاسد والديك وغيرهما وهى الق
  يردّها الى يا فوخه عند الهراش وكذلك العفرية والعفراة أيضا بالكسر فيهما يقسال جاءفلان
  نافشاعفريته اذا جاء غضبان والمعافر بضم الميم الذى يمشى مسع الرفق فيذال من فضلهم
  ومعافر يفتح الميم حىّ من همدان لا يتصرف فى معرفة ولانكرة لانه جامعلى مثال
  ما لا ينصرف من المع واليهسم نتسب النياب المعافريه تقول ثوب معاذرى قتصرفه لانك
  أدخلت عليه ياء النسبة ولم تكن فى الواحد والعفرنى الاسدوهو فعلنى سمى بذلك لشدته ولبوة
  عفرنى أيضا أى شديدة والذون والالف للالحاق بسة رجل وناقة عة رناة أى قوية قال الشاعر
