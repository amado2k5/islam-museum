label: { ar: "الموطأ 2373 — مالك: جرح أم الولد وضمانه على السيد بقدر قيمتها", en: "Muwatta 2373" }
summary:
  ar: "قال مالك في أم الولد تجرح: إن عقل ذلك الجرح ضامن على سيدها في ماله، إلا أن يكون عقل الجرح أكثر من قيمة أم الولد، فليس على السيد أن يخرج أكثر من قيمتها. فإذا أسلم السيد أم ولده بالجرح فكأنه سلمها، فليس عليه أكثر من ذلك، وهذا أحسن ما سمع، وليس عليه أن يحمل من جنايتها أكثر من قيمتها. {cite:muwatta-maruf-1997 p.377} {cite:muwatta-maruf-1997 p.378}"
