label: { ar: "الموطأ 2373 — مالك: جرح أم الولد وضمانه على السيد بقدر قيمتها", en: "Muwatta 2373", es: "Muwatta 2373", fr: "Muwatta 2373", ur: "موطا 2373", tr: "Al-Muwatta 2373 — Malik: Efendisine çocuk doğuran cariyenin yaralanmasından, değerine göre, efendi sorumludur." }
summary:
  ar: "قال مالك في أم الولد تجرح: إن عقل ذلك الجرح ضامن على سيدها في ماله، إلا أن يكون عقل الجرح أكثر من قيمة أم الولد، فليس على السيد أن يخرج أكثر من قيمتها. فإذا أسلم السيد أم ولده بالجرح فكأنه سلمها، فليس عليه أكثر من ذلك، وهذا أحسن ما سمع، وليس عليه أن يحمل من جنايتها أكثر من قيمتها. {cite:muwatta-maruf-1997 p.377} {cite:muwatta-maruf-1997 p.378}"
  tr: "Malik, efendisine çocuk doğurmuş ve yaralanmış bir köle kadın hakkında şunları söylemiştir: Bu yaranın tazminatı, köle kadının değerinden fazla olmadığı sürece, efendinin kendi servetinden karşılayacağı bir sorumluluktur. Eğer efendi, yara nedeniyle köle kadınını teslim ederse, onu teslim etmiş gibi olur ve bundan fazlasını ödemekle yükümlü değildir. Bu, duyduğum en iyi görüştür ve köle kadının işlediği herhangi bir suç için de efendi, değerinden fazlasını karşılamakla yükümlü değildir. {cite:muwatta-maruf-1997 s.377} {cite:muwatta-maruf-1997 s.378}"
  id: "Malik berkata mengenai seorang budak perempuan yang telah melahirkan anak bagi tuannya dan terluka: Kompensasi atas luka tersebut adalah tanggung jawab tuannya, dari harta miliknya sendiri, kecuali jika kompensasi atas luka tersebut melebihi nilai budak perempuan itu. Dalam hal itu, tuan tidak berkewajiban untuk membayar lebih dari nilainya. Jika tuan menyerahkan budak perempuannya karena luka tersebut, maka sama saja seperti dia menyerahkannya, dan dia tidak berkewajiban untuk membayar lebih dari itu. Ini adalah pendapat terbaik yang pernah saya dengar, dan dia tidak berkewajiban untuk menanggung lebih dari nilainya untuk kejahatan apa pun yang dilakukannya. {cite:muwatta-maruf-1997 p.377} {cite:muwatta-maruf-1997 p.378}"
