label: { ar: "سنن أبي داود 3511 — الأب والأبوة", en: "Sunan Abi Dawud 3511 — the father and fatherhood", ur: "سنن ابی داؤد 3511 — باپ اور والدیت", es: "Sunan Abi Dawud 3511 — El padre y la paternidad", fr: "Sunan Abi Dawud 3511 — le père et la paternité", tr: "Sunan Abi Davud 3511 — Baba ve Babalık", id: "Sunan Abi Dawud 3511 — Sang Ayah dan Peran Ayah" }
text: "… حَفْصِ بْنِ غِيَاثٍ، حَدَّثَنَا أَبِي، عَنْ أَبِي عُمَيْسٍ، أَخْبَرَنِي عَبْدُ الرَّحْمَنِ بْنُ قَيْسِ بْنِ مُحَمَّدِ بْنِ الأَشْعَثِ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ اشْتَرَى الأَشْعَثُ رَقِيقًا مِنْ رَقِيقِ الْخُمُسِ مِنْ عَبْدِ اللَّهِ بِعِشْرِينَ أَلْفًا فَأَرْسَلَ عَبْدُ اللَّهِ إِلَيْهِ فِي ثَمَنِهِمْ فَقَالَ إِنَّمَا أَخَذْتُهُمْ بِعَشْرَةِ آلاَفٍ. فَقَالَ عَبْدُ اللَّهِ فَاخْتَرْ رَجُلاً يَكُونُ بَيْنِي وَبَيْنَكَ. قَالَ الأَشْعَثُ أَنْتَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3511، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3511 (Wages (Kitab Al-Ijarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3511، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3511 (Salarios (Kitab Al-Ijarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3511 (Salaires (Kitab Al-Ijarah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 3511 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3511, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
