label: { ar: "الموطأ 1294 — رجل من أهل الكوفة: كتب عمر إلى عامل جيش يتوعد من يطارد العلج حتى يمتنع في الجبل فيقتله", en: "Muwatta 1294", es: "Muwatta 1294", fr: "Muwatta 1294", ur: "موطا 1294", tr: "El-Muvatta 1294 — Kufalı bir adam: Ömer, ordu valisine yazdığı mektupta, Arap olmayan birini dağlara sığınana kadar takip eden herkesi öldürmekle tehdit etti.", id: "Al-Muwatta 1294 — Seorang pria dari Kufa: Umar menulis surat kepada seorang gubernur tentara yang mengancam akan membunuh siapa pun yang mengejar orang non-Arab sampai dia berlindung di pegunungan." }
summary:
  ar: "يروي مالك عن رجل من أهل الكوفة أن عمر بن الخطاب كتب إلى عامل جيش كان بعثه يذكر أن رجالا منهم يطلبون العلج، حتى إذا أسند في الجبل وامتنع قال له رجل لا تخف، فإذا أدركه قتله، وأقسم عمر أنه لا يعلم مكان واحد فعل ذلك إلا ضرب عنقه. قال يحيى سمعت مالكا يقول ليس هذا الحديث بالمجتمع عليه، وليس عليه العمل. {cite:muwatta-maruf-1997 p.578}"
  tr: "Malik, Kufalı bir adamdan rivayetle, Ömer ibn el-Hattab'ın gönderdiği bir ordu komutanına yazdığı mektupta, bazı adamların bir yabancıyı aradığını belirttiğini aktarır. Yabancı dağlara sığınmış ve ayrılmayı reddetmiş, bunun üzerine bir adam ona korkmamasını söylemiş. Onu yakaladıklarında öldürmüşler. Ömer, bunu yapan birini tanırsa kafasını keseceğine yemin etmiş. Yahya, \"Malik'in bu hadisin evrensel olarak kabul görmediğini ve uygulanmadığını söylediğini duydum.\" demiştir. {cite:muwatta-maruf-1997 s.578}"
  id: "Malik meriwayatkan dari seorang pria dari Kufa bahwa Umar ibn al-Khattab menulis surat kepada seorang komandan pasukan yang dikirimnya, menyebutkan bahwa beberapa orang sedang mencari seorang asing. Ketika orang asing itu berlindung di pegunungan dan menolak untuk pergi, seorang pria mengatakan kepadanya agar tidak takut. Ketika mereka menangkapnya, mereka membunuhnya. Umar bersumpah bahwa jika dia mengetahui siapa pun yang telah melakukan ini, dia akan memenggal kepalanya. Yahya berkata, \"Saya mendengar Malik mengatakan bahwa hadits ini tidak diterima secara universal, dan tidak diamalkan.\" {cite:muwatta-maruf-1997 p.578}"
