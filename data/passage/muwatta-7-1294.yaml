label: { ar: "الموطأ 1294 — رجل من أهل الكوفة: كتب عمر إلى عامل جيش يتوعد من يطارد العلج حتى يمتنع في الجبل فيقتله", en: "Muwatta 1294" }
summary:
  ar: "يروي مالك عن رجل من أهل الكوفة أن عمر بن الخطاب كتب إلى عامل جيش كان بعثه يذكر أن رجالا منهم يطلبون العلج، حتى إذا أسند في الجبل وامتنع قال له رجل لا تخف، فإذا أدركه قتله، وأقسم عمر أنه لا يعلم مكان واحد فعل ذلك إلا ضرب عنقه. قال يحيى سمعت مالكا يقول ليس هذا الحديث بالمجتمع عليه، وليس عليه العمل. {cite:muwatta-maruf-1997 p.578}"
