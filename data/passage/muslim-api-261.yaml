text: "… عُبَيْدُ اللَّهِ بْنُ أَبِي بَكْرٍ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، قَالَ ذَكَرَ رَسُولُ اللَّهِ الْكَبَائِرَ - أَوْ سُئِلَ عَنِ الْكَبَائِرِ - فَقَالَ \" الشِّرْكُ بِاللَّهِ وَقَتْلُ النَّفْسِ وَعُقُوقُ الْوَالِدَيْنِ \". وَقَالَ \" أَلاَ أُنَبِّئُكُمْ بِأَكْبَرِ الْكَبَائِرِ \". قَالَ \" قَوْلُ الزُّورِ \". أَوْ قَالَ \" شَهَادَةُ الزُّورِ \". قَالَ شُعْبَةُ وَأَكْبَرُ ظَنِّي أَنَّهُ شَهَادَةُ الزُّورِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 261، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 261 (The Book of Faith), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 261، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
