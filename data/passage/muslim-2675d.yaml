ref: "2675d"
label:
  ar: "مسلم 2675d — أنا عند ظن عبدي بي وأنا معه إذا ذكرني"
  en: "Muslim 2675d — I am as My servant thinks of Me, and I am with him when he remembers Me"
  ur: "مسلم 2675d — میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں"
  es: "Musulmán 2675d — Yo soy como Mi siervo piensa de Mí, y estoy con él cuando se acuerda de Mí."
  fr: "Muslim 2675d — Je suis tel que Mon serviteur Me perçoit, et Je suis avec lui lorsqu'il se souvient de Moi"
  tr: "Müslim 2675d — Kulumun beni düşündüğü gibiyim ve beni hatırladığı zaman onunla birlikteyim."
  id: "Muslim 2675d — Aku adalah sebagaimana hamba-Ku memikirkan-Ku, dan Aku bersama dia ketika dia mengingat-Ku."
text: "إن الله يقول أنا عند ظن عبدي بي وأنا معه إذا دعاني ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2675d: أنا عند ظن عبدي بي وأنا معه إذا ذكرني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2675d: I am as My servant thinks of Me, and I am with him when he remembers Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2675d: میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2675d: Yo soy como Mi siervo piensa de Mí, y estoy con él cuando Me recuerda. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2675d: « Je suis tel que Mon serviteur Me perçoit, et Je suis avec lui lorsqu’il se souvient de Moi. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2675d: “Aku adalah sebagaimana hamba-Ku memikirkan-Ku, dan Aku menyertai dia ketika dia mengingat-Ku.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
