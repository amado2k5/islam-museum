text: "ذَلِكَ عَلِيَّ بْنَ أَبِي طَالِبٍ فَقَالَ لَهُ عَلِيٌّ إِنَّ هَذَا الشَّىْءَ مَا هُوَ بِأَرْضِي عَزَمْتُ عَلَيْكَ لَتُخْبِرَنِّي ‏.‏ فَقَالَ لَهُ أَبُو مُوسَى كَتَبَ إِلَىَّ مُعَاوِيَةُ بْنُ أَبِي سُفْيَانَ أَنْ أَسْأَلَكَ عَنْ ذَلِكَ ‏.‏ فَقَالَ عَلِيٌّ أَنَا أَبُو حَسَنٍ إِنْ لَمْ يَأْتِ بِأَرْبَعَةِ شُهَدَاءَ فَلْيُعْطَ بِرُمَّتِهِ ‏.‏"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
  ur: "موطأ مالک میں؛ کسی فریق کو خط یا پیغام بھیجنا."
