label: { ar: "الموطأ 258 — مالك فيمن سها فقام بعد إتمام الأربع", en: "Muwatta 258", es: "Muwatta 258", fr: "Muwatta 258", ur: "موطا 258", tr: "Al-Muwatta 258 — Malik, dört rekatı tamamladıktan sonra unutup ayağa kalkan kişi hakkında", id: "Al-Muwatta 258 — Malik tentang orang yang lupa dan berdiri setelah menyelesaikan empat rakaat" }
summary:
  ar: "قول لمالك في باب من قام بعد الإتمام أو في الركعتين: من سها في صلاته فقام بعد إتمام الأربع فقرأ ثم ركع، فلما رفع رأسه من ركوعه ذكر أنه قد أتم، فإنه يرجع فيجلس ولا يسجد، ولو سجد إحدى السجدتين لم ير أن يسجد الأخرى، ثم إذا قضى صلاته سجد سجدتين وهو جالس بعد التسليم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.152} {cite:muwatta-maruf-1997 p.153}"
  tr: "Malik, namazı tamamladıktan sonra veya ilk iki rekatı kıldıktan sonra ayağa kalkan kimse hakkında yazdığı bölümde şöyle buyurmuştur: \"Kim namazında bir şeyi unutur ve dört rekatı tamamladıktan sonra ayağa kalkar, Kur'an okur, sonra rükûya gelir ve rükûdan kalktığında namazı tamamladığını hatırlarsa, secde etmeden geri dönüp oturmalıdır. İki secdeden birini yapmış olsa bile diğerini yapmamalıdır. Sonra namazını bitirdiğinde, selam verdikten sonra oturarak iki secde yapmalıdır.\" Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.152} {cite:muwatta-maruf-1997 s.153}"
  id: "Malik berkata dalam surah tentang orang yang berdiri setelah menyelesaikan salat atau selama dua rakaat pertama: Jika seseorang lupa sesuatu dalam salatnya dan berdiri setelah menyelesaikan empat rakaat, membaca (Al-Quran), kemudian rukuk, dan ketika ia mengangkat kepalanya dari rukuk ia ingat bahwa ia telah menyelesaikan salat, maka ia harus kembali duduk tanpa sujud. Sekalipun ia telah melakukan salah satu dari dua sujud, ia tidak perlu melakukan sujud yang lainnya. Kemudian, ketika ia menyelesaikan salatnya, ia harus melakukan dua sujud sambil duduk setelah taslim (salam penutup). Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.152} {cite:muwatta-maruf-1997 p.153}"
