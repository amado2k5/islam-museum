label: { ar: "الموطأ 258 — مالك فيمن سها فقام بعد إتمام الأربع", en: "Muwatta 258" }
summary:
  ar: "قول لمالك في باب من قام بعد الإتمام أو في الركعتين: من سها في صلاته فقام بعد إتمام الأربع فقرأ ثم ركع، فلما رفع رأسه من ركوعه ذكر أنه قد أتم، فإنه يرجع فيجلس ولا يسجد، ولو سجد إحدى السجدتين لم ير أن يسجد الأخرى، ثم إذا قضى صلاته سجد سجدتين وهو جالس بعد التسليم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.152} {cite:muwatta-maruf-1997 p.153}"
