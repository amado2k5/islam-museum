text: "… في المواقف بعرفة وغيرها، فكان ذلك يشق على الحجاج، فأمر رجلاً معه حَرْبة مسمومة، فلَصِق بابن عمر عند دفع الناس، فوضع الحربة على ظهر قدمه، فمرض منها أياماً، فأتاه الحجاج يعوده، فقال له: من فعل بك؟ قال: وما عَبْدُ الله …"
