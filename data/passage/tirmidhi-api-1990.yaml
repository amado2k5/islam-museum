text: "حَدَّثَنَا عَبَّاسُ بْنُ مُحَمَّدٍ الدُّورِيُّ الْبَغْدَادِيُّ، حَدَّثَنَا عَلِيُّ بْنُ الْحَسَنِ، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، عَنْ أُسَامَةَ بْنِ زَيْدٍ، عَنْ سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالُوا يَا رَسُولَ اللَّهِ إِنَّكَ تُدَاعِبُنَا. قَالَ إِنِّي لاَ أَقُولُ إِلاَّ حَقًّا . قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صحيح"
summary:
  ar: "حديث في جامع الترمذي، رقم 1990، فيه أدب المزاح وحدوده. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 1990, with the ethics and limits of jesting. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 1990، جس میں مزاح کے آداب اور حدود ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1990, avec l'éthique et les limites de la plaisanterie. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 1990, con la ética y los límites de la broma. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
