label: { ar: "الموطأ 2617 — زيد بن أبي أنيسة عن مسلم بن يسار: عمر يُسأل عن آية الذرية ويجيب بحديث النبي", en: "Muwatta 2617" }
summary:
  ar: "يروي مالك عن زيد بن أبي أنيسة عن عبد الحميد بن عبد الرحمن بن زيد بن الخطاب أنه أخبره عن مسلم بن يسار الجهني أن عمر بن الخطاب سُئل عن آية سورة الأعراف في أخذ الذرية من ظهور بني آدم وإشهادهم على أنفسهم. فقال عمر: سمعت رسول الله يُسأل عنها، فقال: إن الله خلق آدم، ثم مسح ظهره بيمينه فاستخرج منه ذرية، فقال: خلقت هؤلاء للجنة وبعمل أهل الجنة يعملون، ثم مسح ظهره فاستخرج منه ذرية، فقال: خلقت هؤلاء للنار وبعمل أهل النار يعملون. فقال رجل: ففيم العمل؟ فقال النبي: إن الله إذا خلق العبد للجنة استعمله بعمل أهل الجنة حتى يموت على عمل من أعمالها فيُدخله به الجنة، وإذا خلق العبد للنار استعمله بعمل أهل النار. ويذكر المحقق أن الإسناد منقطع، لأن مسلم بن يسار لم يسمع من عمر، وأن بينهما نعيم بن ربيعة المجهول، وأن معنى الحديث صحيح في وجوه كثيرة. {cite:muwatta-maruf-1997 p.478} {cite:muwatta-maruf-1997 p.479}"
