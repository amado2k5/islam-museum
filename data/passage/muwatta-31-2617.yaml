label: { ar: "الموطأ 2617 — زيد بن أبي أنيسة عن مسلم بن يسار: عمر يُسأل عن آية الذرية ويجيب بحديث النبي", en: "Muwatta 2617", es: "Muwatta 2617", fr: "Muwatta 2617", ur: "موطا 2617", tr: "El-Muvatta 2617 — Zeyd ibn Abi Anisah, Müslim ibn Yasar'dan rivayetle: Ömer'e evlat ayeti soruldu ve o da Peygamber'in bir hadisiyle cevap verdi.", id: "Al-Muwatta 2617 — Zayd ibn Abi Anisah berdasarkan riwayat Muslim ibn Yasar: Umar ditanya tentang ayat tentang keturunan dan dia menjawab dengan sebuah hadits Nabi." }
summary:
  ar: "يروي مالك عن زيد بن أبي أنيسة عن عبد الحميد بن عبد الرحمن بن زيد بن الخطاب أنه أخبره عن مسلم بن يسار الجهني أن عمر بن الخطاب سُئل عن آية سورة الأعراف في أخذ الذرية من ظهور بني آدم وإشهادهم على أنفسهم. فقال عمر: سمعت رسول الله يُسأل عنها، فقال: إن الله خلق آدم، ثم مسح ظهره بيمينه فاستخرج منه ذرية، فقال: خلقت هؤلاء للجنة وبعمل أهل الجنة يعملون، ثم مسح ظهره فاستخرج منه ذرية، فقال: خلقت هؤلاء للنار وبعمل أهل النار يعملون. فقال رجل: ففيم العمل؟ فقال النبي: إن الله إذا خلق العبد للجنة استعمله بعمل أهل الجنة حتى يموت على عمل من أعمالها فيُدخله به الجنة، وإذا خلق العبد للنار استعمله بعمل أهل النار. ويذكر المحقق أن الإسناد منقطع، لأن مسلم بن يسار لم يسمع من عمر، وأن بينهما نعيم بن ربيعة المجهول، وأن معنى الحديث صحيح في وجوه كثيرة. {cite:muwatta-maruf-1997 p.478} {cite:muwatta-maruf-1997 p.479}"
  tr: "Malik, Zeyd ibn Ebu Anisah'tan, o da Abdülhamid ibn Abdülrahman ibn Zeyd ibn el-Hattab'tan, o da Müslim ibn Yasar el-Cuhani'den rivayet ettiğine göre, Ömer ibn el-Hattab'a A'raf Suresi'ndeki Âdem oğullarının belinden çocuk alıp kendi kendilerine şahitlik etmeleriyle ilgili ayet soruldu. Ömer dedi ki: \"Allah Resulü'ne bu konuda soru sorulduğunu işittim ve şöyle buyurdu: Allah Âdemi yarattı, sonra sağ eliyle sırtını sildi ve ondan çocuklar doğurdu ve şöyle dedi: 'Bunları cennet için yarattım, cennet ehlinin amellerini işleyecekler.' Sonra tekrar sırtını sildi ve ondan çocuklar doğurdu ve şöyle dedi: 'Bunları cehennem için yarattım, cehennem ehlinin amellerini işleyecekler.' Bir adam sordu: 'Öyleyse amellerin ne anlamı var?'\" Peygamberimiz şöyle buyurmuştur: \"Allah bir kulunu cennet için yaratırsa, onu cennet ehlinin amellerinde çalıştırır, ta ki o amellerden birini yaparken ölene kadar ve bu yüzden onu cennete kabul eder. Eğer bir kulunu cehennem için yaratırsa, onu cehennem ehlinin amellerinde çalıştırır.\" Araştırmacı, rivayet zincirinin kopuk olduğunu, çünkü Müslim ibn Yasar'ın Ömer'den bir rivayet duymadığını ve aralarında bilinmeyen bir Na'im ibn Rabi'ah'ın bulunduğunu, ancak hadisin anlamının birçok yönden sağlam olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.478} {cite:muwatta-maruf-1997 s.479}"
  id: "Malik meriwayatkan dari Zaid bin Abi Anisah, dari Abd al-Hamid bin Abd al-Rahman bin Zaid bin al-Khattab, yang memberitahukannya dari Muslim bin Yasar al-Juhani bahwa Umar bin al-Khattab ditanya tentang ayat dalam Surah Al-A'raf mengenai pengambilan keturunan dari pinggang anak-anak Adam dan kesaksian mereka terhadap diri mereka sendiri. Umar berkata: Aku mendengar Rasulullah ditanya tentang hal itu, dan beliau bersabda: Allah menciptakan Adam, kemudian Dia mengusap punggungnya dengan tangan kanan-Nya dan mengeluarkan keturunan darinya, seraya berkata: Aku menciptakan mereka untuk Surga, dan mereka akan melakukan amal perbuatan penghuni Surga. Kemudian Dia mengusap punggungnya lagi dan mengeluarkan keturunan darinya, seraya berkata: Aku menciptakan mereka untuk Neraka, dan mereka akan melakukan amal perbuatan penghuni Neraka. Seorang laki-laki bertanya: Lalu apa gunanya amal perbuatan? Nabi Muhammad SAW bersabda: Jika Allah menciptakan seorang hamba untuk Surga, Dia akan mempekerjakannya dalam amalan-amalan penghuni Surga hingga ia meninggal dunia setelah melakukan salah satu amalan tersebut, dan Dia akan memasukkannya ke Surga karenanya. Dan jika Dia menciptakan seorang hamba untuk Neraka, Dia akan mempekerjakannya dalam amalan-amalan penghuni Neraka. Peneliti menyebutkan bahwa rantai periwayatan terputus karena Muslim ibn Yasar tidak mendengar dari Umar, dan terdapat Na'im ibn Rabi'ah yang tidak dikenal di antara mereka, dan bahwa makna hadits tersebut sahih dalam banyak hal. {cite:muwatta-maruf-1997 p.478} {cite:muwatta-maruf-1997 p.479}"
