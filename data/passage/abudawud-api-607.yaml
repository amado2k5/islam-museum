text: "… اللَّهِ، أَخْبَرَنَا زَيْدٌ، - يَعْنِي ابْنَ الْحُبَابِ - عَنْ مُحَمَّدِ بْنِ صَالِحٍ، حَدَّثَنِي حُصَيْنٌ، مِنْ وَلَدِ سَعْدِ بْنِ مُعَاذٍ عَنْ أُسَيْدِ بْنِ حُضَيْرٍ، أَنَّهُ كَانَ يَؤُمُّهُمْ - قَالَ - فَجَاءَ رَسُولُ اللَّهِ يَعُودُهُ فَقَالُوا يَا رَسُولَ اللَّهِ إِنَّ إِمَامَنَا مَرِيضٌ. فَقَالَ \" إِذَا صَلَّى قَاعِدًا فَصَلُّوا قُعُودًا \". قَالَ أَبُو دَاوُدَ هذا الْحَدِيثُ لَيْسَ بِمُتَّصِلٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 607، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 607 (Prayer (Kitab Al-Salat)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 607، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
