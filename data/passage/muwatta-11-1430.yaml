label: { ar: "الموطأ 1430 — أبو الزناد عن أبي سلمة: قدم ناس من أهل الجار فسألوا مروان بن الحكم عما لفظ البحر، فقال ليس به بأس، ثم رجعوا إلى زيد وأبي هريرة فقالا لا بأس به", en: "Muwatta 1430" }
text: "قَدْ قُلْتُ لَكُمْ"
summary:
  ar: "يروي مالك عن أبي الزناد عن أبي سلمة بن عبد الرحمن أن ناسا من أهل الجار قدموا فسألوا مروان بن الحكم عما لفظ البحر، فقال ليس به بأس، وقال اذهبوا إلى زيد بن ثابت وأبي هريرة فاسألوهما، ثم ائتوني فأخبروني ماذا يقولان. فأتوهما فسألوهما، فقالا لا بأس به. فأتوا مروان فأخبروه، فقال قد قلت لكم. {cite:muwatta-maruf-1997 p.639}"
