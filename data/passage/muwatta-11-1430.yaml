label: { ar: "الموطأ 1430 — أبو الزناد عن أبي سلمة: قدم ناس من أهل الجار فسألوا مروان بن الحكم عما لفظ البحر، فقال ليس به بأس، ثم رجعوا إلى زيد وأبي هريرة فقالا لا بأس به", en: "Muwatta 1430", es: "Muwatta 1430", fr: "Muwatta 1430", ur: "موطا 1430", tr: "El-Muvatta 1430 — Ebu el-Zinad, Ebu Salama'dan rivayetle: Komşu ülkeden bazı kişiler gelip Mervan ibn el-Hakam'a denizin ne çıkardığını sordular ve o da bunda bir sakınca olmadığını söyledi. Sonra Zeyd ve Ebu Hurayra'ya geri döndüler ve onlar da bunda bir sakınca olmadığını söylediler.", id: "Al-Muwatta 1430 — Abu al-Zinad meriwayatkan dari Abu Salama: Beberapa orang dari negeri tetangga datang dan bertanya kepada Marwan ibn al-Hakam tentang apa yang telah dimuntahkan laut, dan dia berkata tidak ada yang salah dengan itu. Kemudian mereka kembali kepada Zayd dan Abu Hurayra, dan mereka berkata tidak ada yang salah dengan itu." }
text: "قَدْ قُلْتُ لَكُمْ"
summary:
  ar: "يروي مالك عن أبي الزناد عن أبي سلمة بن عبد الرحمن أن ناسا من أهل الجار قدموا فسألوا مروان بن الحكم عما لفظ البحر، فقال ليس به بأس، وقال اذهبوا إلى زيد بن ثابت وأبي هريرة فاسألوهما، ثم ائتوني فأخبروني ماذا يقولان. فأتوهما فسألوهما، فقالا لا بأس به. فأتوا مروان فأخبروه، فقال قد قلت لكم. {cite:muwatta-maruf-1997 p.639}"
  tr: "Malik, Ebu el-Zinad'dan, o da Ebu Salama ibn Abd el-Rahman'dan rivayet eder ki, komşu kabileden bazı kişiler gelip Mervan ibn el-Hakam'a denizin ne çıkardığını sordular. Mervan, \"Bunda bir sakınca yok\" dedi. Sonra Mervan, \"Zeyd ibn Sabit ve Ebu Hurayra'ya gidin, onlara sorun, sonra geri gelip bana ne dediklerini anlatın\" dedi. Bunun üzerine Mervan'a gidip sordular ve ikisi de \"Bunda bir sakınca yok\" dediler. Sonra Mervan'a gidip durumu anlattılar ve Mervan, \"Size zaten anlattım\" dedi. {cite:muwatta-maruf-1997 s.639}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari Abu Salama ibn Abd al-Rahman, bahwa beberapa orang dari suku tetangga datang dan bertanya kepada Marwan ibn al-Hakam tentang apa yang telah dimuntahkan laut. Dia berkata, \"Tidak ada yang salah dengan itu.\" Kemudian dia berkata, \"Pergilah kepada Zayd ibn Thabit dan Abu Hurayra dan tanyakan kepada mereka, lalu kembalilah dan beritahukan kepadaku apa yang mereka katakan.\" Maka mereka pergi kepada mereka dan bertanya kepada mereka, dan keduanya berkata, \"Tidak ada yang salah dengan itu.\" Kemudian mereka pergi kepada Marwan dan memberitahunya, dan dia berkata, \"Aku sudah memberitahumu.\" {cite:muwatta-maruf-1997 p.639}"
