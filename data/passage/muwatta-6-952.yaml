label: { ar: "الموطأ 952 — جعفر بن محمد عن أبيه: كان علي بن أبي طالب يلبي في الحج، حتى إذا زاغت الشمس من يوم عرفة قطع التلبية", en: "Muwatta 952", es: "Muwatta 952", fr: "Muwatta 952", ur: "موطا 952", tr: "El-Muvatta 952 — Cafer ibn Muhammed, babasından rivayetle: Ali ibn Abi Talib, Hac sırasında Telbiye okurdu ve Arafat günü güneş en yüksek noktasına ulaştığında Telbiye okumayı bırakırdı.", id: "Al-Muwatta 952 — Ja`far ibn Muhammad, berdasarkan riwayat ayahnya: Ali ibn Abi Talib biasa membaca Talbiyah selama ibadah haji, dan ketika matahari telah melewati titik zenitnya pada hari Arafah, beliau akan berhenti membaca Talbiyah." }
summary:
  ar: "يرويه مالك عن جعفر بن محمد عن أبيه، أن علي بن أبي طالب كان يلبي في الحج، حتى إذا زاغت الشمس من يوم عرفة قطع التلبية. ويقول يحيى: قال مالك: وذلك الأمر الذي لم يزل عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1090) وسويد (502). {cite:muwatta-maruf-1997 p.454}"
  tr: "Malik, Cafer ibn Muhammed'den, o da babasından rivayet ederek, Ali ibn Ebu Talib'in Hac sırasında Arafat Günü güneş en yüksek noktasına ulaşana kadar Talbiye okuduğunu, ondan sonra ise okumayı bıraktığını nakletmiştir. Yahya şöyle demiştir: Malik dedi ki: Bu, ülkemizin âlimlerinin her zaman uyguladığı bir gelenektir. Editör, bunun Malik'ten Ebu Mus'ab (1090) ve Suveyd (502) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.454}"
  id: "Malik meriwayatkannya dari Ja'far ibn Muhammad, dari ayahnya, bahwa Ali ibn Abi Talib biasa membaca Talbiyah selama ibadah haji hingga matahari melewati titik zenitnya pada Hari Arafah, kemudian ia berhenti membacanya. Yahya berkata: Malik berkata: Ini adalah kebiasaan yang selalu diikuti oleh para ulama di negeri kita. Editor menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1090) dan Suwaid (502). {cite:muwatta-maruf-1997 p.454}"
