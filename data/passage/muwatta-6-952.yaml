label: { ar: "الموطأ 952 — جعفر بن محمد عن أبيه: كان علي بن أبي طالب يلبي في الحج، حتى إذا زاغت الشمس من يوم عرفة قطع التلبية", en: "Muwatta 952" }
summary:
  ar: "يرويه مالك عن جعفر بن محمد عن أبيه، أن علي بن أبي طالب كان يلبي في الحج، حتى إذا زاغت الشمس من يوم عرفة قطع التلبية. ويقول يحيى: قال مالك: وذلك الأمر الذي لم يزل عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1090) وسويد (502). {cite:muwatta-maruf-1997 p.454}"
