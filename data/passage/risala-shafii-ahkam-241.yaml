text: "… خوفٌ أشَدَّ من ذلك صَلَّوْا رِجالاً ورُ كِبَانَا،. مُستقْبِلى القبلةِ وغيرَ مستقبليها. - وصَلَّى رسولُ اللّٰه النافلةَ فى السفر على راحلتِهِ أَيْنَ توجَّهتْ به. حَفِظَ ذلك عنه جابرُ بنُ عبد اللّٰه وأنسُ بنُ مالكِ وغيرُهم. وكان لا يصلى المكتوبةَ مسافراً …"
