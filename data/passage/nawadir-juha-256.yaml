label: { ar: "نوادر جحا الكبرى، ص 125 — «أنت أعجبك الروث وأنا ملأته لك»", en: "Nawadir Juha al-Kubra, p. 125 — 'You Liked the Dung and I Filled It for You'", ur: "نوادر جحا الکبریٰ، ص 125 — «تمہیں گوبر پسند آیا تو میں نے تمہارے لیے بھر دیا»", fr: "Nawadir Juha al-Kubra, p. 125 — « Le crottin te plaît, je t'en ai rempli »", es: "Nawadir Juha al-Kubra, p. 125 — «Te gustó el estiércol y te lo llené»" }
text: "… أنت أعجبك الروث وأنا ملأتهُ لك كان راكباً حماره، وكان الحمار، كلما رأى روثة يشمُّها حسب عادة جنسه، فلم يكُنْ من الشيخ إلَّا أن جمع شيئاً من الروث، وجعله في علاقة الحمار وعلقَّها برقبته، فتضايق الحمار، وأخذ يحاول خلع العلاقة …"
summary:
  ar: "كان حمار جحا يظل يشم الروث، فعلق جحا على عنقه كيساً من الروث، فحاول الحمار إزالته، فقال جحا إن الحمار يحب الروث وإنه ملأه له. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  en: "Juha's donkey keeps sniffing dung, so Juha hangs a bag of dung on the donkey's neck. The donkey tries to remove it, and Juha says the donkey likes dung and he has filled the bag for it. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  ur: "جحا کا گدھا بار بار گوبر سونگھتا رہتا ہے تو جحا اس کی گردن میں گوبر کی تھیلی لٹکا دیتا ہے۔ گدھا اسے ہٹانے کی کوشش کرتا ہے تو جحا کہتا ہے کہ گدھے کو گوبر پسند ہے اور اس نے اس کے لیے بھر دیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  fr: "L'âne de Juha ne cesse de renifler le crottin, alors Juha lui suspend au cou un sac de crottin. L'âne essaie de l'enlever, et Juha dit que l'âne aime le crottin et qu'il l'en a rempli. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
  es: "El burro de Juha no deja de olfatear el estiércol, así que Juha le cuelga del cuello una bolsa de estiércol. El burro intenta quitársela, y Juha dice que al burro le gusta el estiércol y que se la ha llenado. {cite:juha-nawadir-kubra-djuwaydi p. 125}"
