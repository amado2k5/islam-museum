label: { ar: "الموطأ 679 — بلاغ: كانت عائشة تعطي أموال اليتامى من يتجر لهم فيها", en: "Muwatta 679", es: "Muwatta 679", fr: "Muwatta 679", ur: "موطا 679", tr: "Al-Muwatta 679 — Rivayet: Aişe, yetimlerin paralarını, onlar adına ticaret yapacak olanlara verirdi.", id: "Al-Muwatta 679 — Laporan: Aisyah biasa memberikan uang anak yatim kepada orang-orang yang mau memperdagangkannya untuk mereka." }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عائشة زوج النبي كانت تعطي أموال اليتامى من يتجر لهم فيها. ويذكر المحقق أن زيادة «الذين في حجرها» في نسخة م لم يقف عليها في النسخ ولا في رواية أبي مصعب، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.342}"
  tr: "Malik, Peygamberin eşi Ayşe'nin yetimlerin parasını, onlar adına ticaret yapması için birine verdiğini duyduğunu bildirmiştir. Araştırmacı, M el yazmasında yer alan \"onun himayesi altındakiler\" ifadesinin başka hiçbir el yazmasında veya Ebu Mus'ab'ın rivayetinde bulunmadığını ve Ebu Mus'ab'ın bunu Malik'ten naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.342}"
  id: "Malik melaporkan bahwa ia mendengar bahwa Aisyah, istri Nabi, biasa memberikan uang anak yatim kepada seseorang untuk diperdagangkan atas nama mereka. Peneliti mencatat bahwa penambahan \"mereka yang berada di bawah perwaliannya\" dalam manuskrip M tidak ditemukan dalam manuskrip lain atau dalam riwayat Abu Mus'ab, dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.342}"
