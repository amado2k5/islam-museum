label:
  ar: "ابن ماجه 4008 — لا يحقر أحدكم نفسه: فإياي كنت أحق أن تخشى"
  en: "Ibn Majah 4008 — Let none of you belittle himself: it was Me you had more right to fear"
  ur: "ابن ماجہ 4008 — تم میں سے کوئی اپنے آپ کو حقیر نہ جانے: مجھ سے ڈرنا زیادہ حق تھا"
  es: "Ibn Majah 4008 — Que ninguno de vosotros se menosprecie: a Mí teníais más derecho a temer."
  fr: "Ibn Majah 4008 — Que nul d'entre vous ne se sous-estime: c'est Moi que vous aviez davantage de raisons de craindre."
  tr: "İbn Majah 4008 — Hiçbiriniz kendini küçümsemesin; çünkü ben sizin korkunuza daha layık biriyim."
  id: "Ibn Majah 4008 — Janganlah ada di antara kalian yang meremehkan diri sendiri: karena akulah yang lebih pantas kalian takuti."
text: "لا يحقر أحدكم نفسه . قالوا يا رسول الله كيف يحقر أحدنا نفسه قال يرى أمرا لله عليه فيه مقال ثم لا يقول فيه فيقول الله عز وجل له يوم القيامة ما منعك أن تقول في كذا وكذا فيقول خشية …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4008: لا يحقر أحدكم نفسه: فإياي كنت أحق أن تخشى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4008: Let none of you belittle himself: it was Me you had more right to fear. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4008: تم میں سے کوئی اپنے آپ کو حقیر نہ جانے: مجھ سے ڈرنا زیادہ حق تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4008: Que ninguno de vosotros se menosprecie: a Mí teníais más derecho a temer. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4008: « Que nul d’entre vous ne se sous-estime: c’est Moi que vous aviez davantage à craindre. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4008: “Janganlah seorang pun di antara kalian meremehkan dirinya sendiri, karena akulah yang lebih pantas kalian takuti.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
