label:
  ar: "ابن ماجه 4008 — لا يحقر أحدكم نفسه: فإياي كنت أحق أن تخشى"
  en: "Ibn Majah 4008 — Let none of you belittle himself: it was Me you had more right to fear"
  ur: "ابن ماجہ 4008 — تم میں سے کوئی اپنے آپ کو حقیر نہ جانے: مجھ سے ڈرنا زیادہ حق تھا"
text: "لا يحقر أحدكم نفسه . قالوا يا رسول الله كيف يحقر أحدنا نفسه قال يرى أمرا لله عليه فيه مقال ثم لا يقول فيه فيقول الله عز وجل له يوم القيامة ما منعك أن تقول في كذا وكذا فيقول خشية …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4008: لا يحقر أحدكم نفسه: فإياي كنت أحق أن تخشى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4008: Let none of you belittle himself: it was Me you had more right to fear. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4008: تم میں سے کوئی اپنے آپ کو حقیر نہ جانے: مجھ سے ڈرنا زیادہ حق تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
