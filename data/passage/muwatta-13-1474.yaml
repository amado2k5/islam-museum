label: { ar: "الموطأ 1474 — مالك: من لا يرث بالرحم، كابن الأخ للأم والجد للأم والعم للأم والخال والجدة أم الأم وبنت الأخ والعمة والخالة، لا يرثون شيئا", en: "Muwatta 1474" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم، والذي أدرك عليه أهل العلم ببلدهم، أن ابن الأخ للأم، والجد أبا الأم، والعم أخا الأب للأم، والخال، والجدة أم أبي الأم، وابنة الأخ للأب والأم، والعمة، والخالة، لا يرثون بأرحامهم شيئا. وأن المرأة لا ترث، إذا كانت أبعد نسبا من المتوفى، ممن سمي في الكتاب، بالرحم شيئا، وأن النساء لا يرثن إلا حيث سمين، وأن المرأة ترث من أعتقتْ، واستشهد بآية الأحزاب. {cite:muwatta-maruf-1997 p.20}"
