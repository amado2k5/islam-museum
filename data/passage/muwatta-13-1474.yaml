label: { ar: "الموطأ 1474 — مالك: من لا يرث بالرحم، كابن الأخ للأم والجد للأم والعم للأم والخال والجدة أم الأم وبنت الأخ والعمة والخالة، لا يرثون شيئا", en: "Muwatta 1474", es: "Muwatta 1474", fr: "Muwatta 1474", ur: "موطا 1474", tr: "Al-Muwatta 1474 — Malik: Yeğen, anne tarafından dede, anne tarafından amca, anne tarafından teyze, anne tarafından nine, kız yeğen, baba tarafından teyze ve anne tarafından teyze gibi akrabalık bağıyla miras almayanlar hiçbir şey miras almazlar.", id: "Al-Muwatta 1474 — Malik: Mereka yang tidak mewarisi melalui hubungan kekerabatan, seperti keponakan dari pihak ibu, kakek dari pihak ibu, paman dari pihak ibu, bibi dari pihak ibu, nenek dari pihak ibu, keponakan perempuan, bibi dari pihak ayah, dan bibi dari pihak ibu, tidak mewarisi apa pun." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم، والذي أدرك عليه أهل العلم ببلدهم، أن ابن الأخ للأم، والجد أبا الأم، والعم أخا الأب للأم، والخال، والجدة أم أبي الأم، وابنة الأخ للأب والأم، والعمة، والخالة، لا يرثون بأرحامهم شيئا. وأن المرأة لا ترث، إذا كانت أبعد نسبا من المتوفى، ممن سمي في الكتاب، بالرحم شيئا، وأن النساء لا يرثن إلا حيث سمين، وأن المرأة ترث من أعتقتْ، واستشهد بآية الأحزاب. {cite:muwatta-maruf-1997 p.20}"
  tr: "Malik, aralarındaki yerleşik uygulamanın ve ülkelerindeki âlimlerin anlayışının, anne tarafından yeğen, anne tarafından dede, baba tarafından amca (annenin erkek kardeşi), anne tarafından amca, anneanne, öz erkek kardeşin kızı, baba tarafından teyze ve anne tarafından teyzenin akrabalık bağları yoluyla hiçbir şey miras almadığı yönünde olduğunu belirtir. Ayrıca, bir kadının, Kur'an'da akrabalık bağıyla anılanlardan daha uzak bir akrabalık ilişkisi içinde olması durumunda da miras alamayacağını ifade eder. Dahası, kadınların yalnızca adlarının açıkça geçtiği durumlarda miras alabileceğini ve bir kadının azat ettiği köleden miras alabileceğini ileri sürer. Delil olarak Ahzab Suresi'nden bir ayet gösterir. {cite:muwatta-maruf-1997 s.20}"
  id: "Malik menyatakan bahwa praktik yang lazim di antara mereka, dan pemahaman para ulama di negeri mereka, adalah bahwa keponakan dari pihak ibu, kakek dari pihak ibu, paman dari pihak ayah (saudara laki-laki ibu), paman dari pihak ibu, nenek dari pihak ibu, anak perempuan dari saudara laki-laki kandung, bibi dari pihak ayah, dan bibi dari pihak ibu tidak mewarisi apa pun melalui hubungan kekerabatan mereka. Ia juga menyatakan bahwa seorang wanita tidak mewarisi jika ia memiliki hubungan kekerabatan yang lebih jauh dengan almarhum daripada yang disebutkan dalam Al-Quran sebagai kerabat. Lebih lanjut, ia menegaskan bahwa wanita hanya mewarisi jika mereka secara khusus disebutkan namanya, dan bahwa seorang wanita mewarisi dari seorang budak yang telah ia bebaskan. Ia mengutip ayat dari Surah Al-Ahzab sebagai bukti. {cite:muwatta-maruf-1997 p.20}"
