label:
  ar: "الترمذي 764 — الصوم لي وأنا أجزي به"
  en: "Tirmidhi 764 — Fasting is Mine, and I reward it"
  ur: "ترمذی 764 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "إن ربكم يقول كل حسنة بعشر أمثالها إلى سبعمائة ضعف والصوم لي وأنا أجزي به الصوم جنة من النار ولخلوف فم الصائم أطيب عند الله من ريح المسك وإن جهل على أحدكم جاهل وهو صائم فليقل إني صائم . وفي …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 764: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 764: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 764: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
