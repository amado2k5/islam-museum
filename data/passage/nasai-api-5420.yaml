label: { ar: "سنن النسائي 5420 — الأب والأبوة", en: "Sunan al-Nasa'i 5420 — the father and fatherhood", ur: "سنن نسائی 5420 — باپ اور والدیت", es: "Sunan al-Nasa'i 5420 — El padre y la paternidad" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا وَكِيعٌ، قَالَ حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ جَاءَتْ هِنْدٌ إِلَى رَسُولِ اللَّهِ فَقَالَتْ يَا رَسُولَ اللَّهِ إِنَّ أَبَا سُفْيَانَ رَجُلٌ شَحِيحٌ وَلاَ يُنْفِقُ عَلَىَّ وَوَلَدِي مَا يَكْفِينِي أَفَآخُذُ مِنْ مَالِهِ وَلاَ يَشْعُرُ قَالَ \" خُذِي مَا يَكْفِيكِ وَوَلَدَكِ بِالْمَعْرُوفِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5420، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5420 (The Book of the Etiquette of Judges), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5420، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5420 (El Libro de la Etiqueta de los Jueces), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
