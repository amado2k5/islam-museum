  ar: "قال مالك: الأمر عندنا أن القتيل إذا وُجد بين ظهراني قوم في قرية أو غيرها لم يُؤخذ به أقرب الناس إليه دارا ولا مكانا؛ لأنه قد يُقتل القتيل ثم يُلقى على باب قوم ليُلطخوا به، فليس يؤاخذ أحد بمثل ذلك. {cite:muwatta-maruf-1997 p.443}"
