label: { ar: "الموطأ 2550 — مالك: القتيل الموجود بين قوم لا يؤخذ به أقرب الناس إليه", en: "Muwatta 2550", es: "Muwatta 2550", fr: "Muwatta 2550", ur: "موطا 2550", tr: "Al-Muwatta 2550 — Malik: Bir grup insan arasında bulunan cinayet kurbanı, en yakın akrabaları tarafından sorumlu tutulmuyor.", id: "Al-Muwatta 2550 — Malik: Korban pembunuhan yang ditemukan di antara sekelompok orang tidak dianggap bertanggung jawab oleh kerabat terdekatnya." }
summary:
  ar: "قال مالك: الأمر عندنا أن القتيل إذا وُجد بين ظهراني قوم في قرية أو غيرها لم يُؤخذ به أقرب الناس إليه دارا ولا مكانا؛ لأنه قد يُقتل القتيل ثم يُلقى على باب قوم ليُلطخوا به، فليس يؤاخذ أحد بمثل ذلك. {cite:muwatta-maruf-1997 p.443}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur: Bir köyde veya başka bir yerde bir grup insan arasında öldürülmüş bir kişi bulunursa, ikametgah veya konum bakımından ona en yakın kişi sorumlu tutulmaz; çünkü öldürülmüş bir kişi öldürülüp daha sonra bir grup insanın kapısına atılarak onları kirletmek için kullanılabilir ve böyle bir eylemden kimse sorumlu tutulmaz. {cite:muwatta-maruf-1997 s.443}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kami adalah jika seseorang yang dibunuh ditemukan di antara sekelompok orang di sebuah desa atau tempat lain, orang yang paling dekat dengannya dalam hal tempat tinggal atau lokasi tidak dianggap bertanggung jawab; karena seseorang yang dibunuh mungkin dibunuh lalu dilemparkan ke depan pintu sekelompok orang untuk menajiskan mereka, dan tidak seorang pun dianggap bertanggung jawab atas tindakan tersebut. {cite:muwatta-maruf-1997 p.443}"
