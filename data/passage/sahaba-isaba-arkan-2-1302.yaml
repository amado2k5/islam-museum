text: "… وابن أبي وأخرج البُخَارِيّ في تاريخه، من طريق شعبة، عن خَيْثَمَة، ومحمد بن سعد، ومسلم، والبَغَوِيّ، يعلى بن عطاء، عن وكيع بن عُدُس، عن أبي رزين والدارمي، والباوردي، وابن قانع، وغيرهم، إلى أنه العقيلي - رفعه: مثل المؤمن مثل النحلة …"
summary:
