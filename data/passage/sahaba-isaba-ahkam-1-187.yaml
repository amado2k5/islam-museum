text: "… أبي عَمْرو بن حفص زَوْج فاطمة بنت قيس، فقال: اسمه أحمد، وسيأتي ذكره في الكُنَى إن شاء اللّٰه تعالى. - أحْمَد: حكى ابن حِبّان أنه اسمُ أبي محمد الذي كان يزعمُ أن الوتر واجبٌ. والمشهور أن اسمه مسعود بن زيد …"
