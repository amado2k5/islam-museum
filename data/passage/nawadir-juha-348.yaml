label: { ar: "نوادر جحا الكبرى، ص 172 — «إن كنت أذهب من هنا فلعنة الله علي»", en: "Nawadir Juha al-Kubra, p. 172 — 'If I Leave Here, God's Curse Be on Me'", ur: "نوادر جحا الکبریٰ، ص 172 — «اگر میں یہاں سے گیا تو مجھ پر اللہ کی لعنت»", fr: "Nawadir Juha al-Kubra, p. 172 — « Si je pars d'ici, que la malédiction de Dieu soit sur moi »", es: "Nawadir Juha al-Kubra, p. 172 — «Si me voy de aquí, que la maldición de Dios caiga sobre mí»", tr: "Cuha'nın Büyük Fıkraları, s. 172 — “Eğer buradan gidersem, Allah'ın laneti üzerime olsun.”", id: "Anekdot-anekdot Hebat Juha, hlm. 172 — “Jika aku pergi dari sini, semoga kutukan Tuhan menimpaku.”" }
text: "نوادر جحا الكبرى وحاولَ أن ينزل الأحمال فلم يستطع، فأنزوى تعباً. منتظراً أن يمرَّ أحد الناس فيأنس بِهِ، ويطردَ عنه وسواسَه؛ وإذا برجلٍ قد أقبل ورأى الشيخ على هذه الحالة؛ ومن لا يعرفُ الشيخ وأحواله، فسأله عمَّا حدث له، فأخبره …"
summary:
  ar: "في الربيع زار جحا ورفاقه قرية فيها بساتين، وخططوا للبقاء أياماً ووعد كل منهم بطعام، فتعهد جحا بلعنة الله عليه إن غادر في أقل من ثلاثة أشهر. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  en: "In spring Juha and companions visit a village with gardens; they plan to stay for days and each promises food; Juha swears God's curse on himself if he leaves in less than three months. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  ur: "بہار میں جحا اور اس کے ساتھی باغوں والے ایک گاؤں گئے، انہوں نے کئی دن ٹھہرنے کا ارادہ کیا اور ہر ایک نے کھانے کا وعدہ کیا، تو جحا نے عہد کیا کہ اگر وہ تین ماہ سے پہلے وہاں سے گیا تو اس پر اللہ کی لعنت ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  fr: "Au printemps, Juha et ses compagnons visitent un village aux jardins ; ils prévoient d'y rester des jours et chacun promet de la nourriture ; Juha jure d'attirer sur lui la malédiction de Dieu s'il part avant trois mois. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  es: "En primavera, Juha y sus compañeros visitan una aldea con huertos; planean quedarse unos días y cada uno promete comida; Juha jura que caiga sobre él la maldición de Dios si se va antes de tres meses. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  tr: "İlkbaharda Juha ve arkadaşları meyve bahçeleri olan bir köye gittiler. Birkaç gün kalmayı planladılar ve her biri yiyecek sözü verdi. Juha, üç aydan daha kısa sürede ayrılırsa Tanrı'nın lanetinin üzerine olacağına yemin etti. {cite:juha-nawadir-kubra-djuwaydi s. 172}"
  id: "Pada musim semi, Juha dan para sahabatnya mengunjungi sebuah desa dengan kebun buah-buahan. Mereka berencana untuk tinggal selama beberapa hari, dan masing-masing berjanji akan membawa makanan. Juha bersumpah bahwa kutukan Tuhan akan menimpanya jika ia pergi kurang dari tiga bulan. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
