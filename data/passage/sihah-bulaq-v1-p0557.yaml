text: |-
  عكب)
  يقمن عند أعجاز الابل المعتركات على الحوض فاذا انصرفت ناقة دخلت مكانها
  أخرى وهى الناظرات العقبم| وعقب العرفج اذا اصفرت غرته وحان يبسه والتعقيب أيضا
  أن يغزوالرجل ثم يثى من سته قال طفيل الغفوى يصف انلخيل
  طوال الهوادى والمتون صليبة • مغاوير فيها للاسير معقب
  وعقب فى الامراذا تردد فى طلبه مجدّا قال لبيديصف جارا وأناته
  -قى أجر بارواح وهاجها • طلب المعقب حقه المظلوم
  رفع المظلوم وهو نعت للمعقب على المعنى والمعقب خفض فى اللفظ ومعناه أنه فاعسل وتول
  ولى فلان مدبرا ولم يعقب أى لم يعطاف ولم يننظر والتعقيب فى الصلاة الجلوس بعد أن يقضيها
  لدعاء أومسئلة وفى الحديث من عقب فى صلاة فه وفى الصلاة وتصدّق فلان بصدقة ليس فيها
  تعقيب أى استثناء وأعقيه بطاعته أى بازاه والعقى جزاء الامر وأعقب الرجل اذامات
  وخلف عقبا أى ولدا وأعقيه الطائن اذاكان الجنون يعاوده فى أوقات قال اهروؤ
  القيس يصف فرسا
  ويخضد فى الآرىّ حتى كأنه • به عرّة أوطائف غير معقب
  والمعقب نجم يعقب نجما أى يطلع بعده ويشال أكل أكلة أعقبته سها أى أورئته وذهب
  أفلان فأعقبه ابنه اذا خلفه وهومثل عقبه وأعقب مستعير القدرأى ردّها وفيها العقبة
  وقد تعقيت الرجل اذا أخذته بذنب كان منه وتعقبت عن الخبراذا شكسكت فيه وعدت
  للسؤال عنه قال طفيل ولم يك عما خبروامتعقب وتعقب فلان رأيه أى وجد عاقبته الى
  خيرواعتقب البائع السلعة أى حبسها عن المشترى حتى يقبض الثمن وفى الحديث المعتقب
  ضامن يعنى اذا تلفت عنده واعتقبت الرجل حبسته وتقول فعلت كذا فاعتقبت منه ندامة
  أى وجدت فى عاقبته ندامة والعقاب طائروجمع القلة أعقب لانهام ؤنثة وأفعل بناء يختص
  به جمع الاناث مثل عناق وأعنق وذراع وأذرع والكثير عقبان وعماب عنباة وعبنقاة
  وبعنقاة على القلب أى ذات مخالب حداد قال العارمّاح
  عقاب عقنباة كأنّ وظيفها * وخرطومها الاعلى بنارملوح
  والعقاب عقاب الراية والعقاب حجرناتى فى جوف بتريخرق الدلاء وصخرة ناتنة فى عرض
  جبل شبه حرقاة((لقرب العقرب واحسدة العقارب وهى تؤنث والاتى عقربة وعقرياه
  ممدود غير مصروف والذكرعة ربات بالضم وهو أيضاداية له أرجل طوال وليس ذنيه كذنب
  العقارب قال الشاء وإياس بر الأرت
  كأن مرعى أمكم اذغدت • عقربة يكومهاءقربان
  وهرعى اسمهاويروى اذبدت ومكان معقرب بكسر الراء ذو عقارب وأرض معقربة وبعضهم
  قول ارض معقرة كانه ردّالعق رب الى ثلاثة أحرف ثم بنى عليه وصدغ معقرب يفتح الراءأى
  معطوف والعقرب برج فى السماء ⁦(عكب )⁩ عكاية أبوحى من بكروهو عكاية بن صعب بن
  على بن بكر بن وائل والعكاب الدخان وللابل عكوب على الحوض أى ازدحام والعاكب الجمع
  الكثير والعكوب بالنتح الغباد والعنكبوت الناسجة والغالب عليها التأنيت والجمع العنا كب
  والعكنياة
