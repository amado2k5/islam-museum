text: "… صيد الحرم وقطع شجره يحرم على المحرم والحلاّل صيد الحرم، وتنفيره وقطع شجره الذي لم يستنبته الآدميون في العادة، وقطع الرطب من النبات، حتى الشوك إلا إلا ذخير والسنا، فإنه يباح التعرض هما بالقطع، والقلع، والإتلاف ونحو ذلك. لما رواه …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 691، يذكر الحلال، وما حُرّم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
