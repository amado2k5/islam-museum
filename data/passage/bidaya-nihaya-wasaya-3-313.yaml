text: "… يقتسم ورثتي دينارا، ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صَدَقة لفظ البخاري. ثم قال البخاري: حدّثنا عبد اللّه بن مسلمة، عن مالك، عن ابن شهاب، عن عروة، عن عائشة : أن أزواج النّبيّ ولية حين توفي رسول اللّٰه …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 313، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 313, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 313 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 3, pág. 313, que menciona el lecho de muerte y las últimas horas, y lo que quedó tras de sí: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 3, p. 313), évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 3. cildinin 313. sayfasından, ölüm anını, merhumun vefatını, geride bıraktığı mal varlığını ve mirasını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 3, halaman 313, yang menyebutkan saat kematian dan wafatnya almarhum, serta harta warisan yang ditinggalkannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
