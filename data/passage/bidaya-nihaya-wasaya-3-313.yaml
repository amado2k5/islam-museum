text: "… يقتسم ورثتي دينارا، ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صَدَقة لفظ البخاري. ثم قال البخاري: حدّثنا عبد اللّه بن مسلمة، عن مالك، عن ابن شهاب، عن عروة، عن عائشة : أن أزواج النّبيّ ولية حين توفي رسول اللّٰه …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 313، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 313, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 313 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
