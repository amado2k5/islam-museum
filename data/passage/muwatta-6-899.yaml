label: { ar: "الموطأ 899 — سعيد بن المسيب: ولدت أسماء بذي الحليفة محمد بن أبي بكر، فأمرها أبو بكر أن تغتسل ثم تهل", en: "Muwatta 899" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب، أن أسماء بنت عميس ولدت محمد بن أبي بكر بذي الحليفة، فأمرها أبو بكر أن تغتسل ثم تهل. ويذكر المحقق أن ابن عبد البر قال إن الحديث مرسل من وجوه صحاح، وأن منهم من يجعله من قول أبي بكر. {cite:muwatta-maruf-1997 p.433}"
