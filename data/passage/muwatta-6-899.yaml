label: { ar: "الموطأ 899 — سعيد بن المسيب: ولدت أسماء بذي الحليفة محمد بن أبي بكر، فأمرها أبو بكر أن تغتسل ثم تهل", en: "Muwatta 899", es: "Muwatta 899", fr: "Muwatta 899", ur: "موطا 899", tr: "Al-Muwatta 899 - Sa'id ibn al-Musayyab: Esma', Zilhuleyfah'ta Muhammed ibn Ebu Bekir'i doğurdu, bu yüzden Ebu Bekir ona gusl (ritüel banyo) yapmasını ve ardından ihrama (ritüel kutsama durumu) girmesini emretti.", id: "Al-Muwatta 899 — Sa’id ibn al-Musayyab: Asma’ melahirkan Muhammad ibn Abi Bakar di Dhu al-Hulayfah, maka Abu Bakar memerintahkannya untuk mandi (mandi ritual) dan kemudian masuk ihram (keadaan ritual penyucian)." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب، أن أسماء بنت عميس ولدت محمد بن أبي بكر بذي الحليفة، فأمرها أبو بكر أن تغتسل ثم تهل. ويذكر المحقق أن ابن عبد البر قال إن الحديث مرسل من وجوه صحاح، وأن منهم من يجعله من قول أبي بكر. {cite:muwatta-maruf-1997 p.433}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ettiğine göre, Asma' bint 'Umays, Zül-Hulayfe'de Muhammed ibn Abi Bakr'ı doğurmuş ve Ebu Bekir ona gusül abdesti almasını ve ardından ihrama girmesini emretmiştir. Araştırmacı, İbn Abd al-Barr'ın hadisin sahih rivayet zincirleriyle mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve bazılarının bunu Ebu Bekir'in sözü olarak kabul ettiğini söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.433}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa Asma' bint 'Umays melahirkan Muhammad ibn Abi Bakr pada bulan Dzul Hulayfah, dan Abu Bakr memerintahkannya untuk melakukan ghusl (mandi ritual) dan kemudian memasuki ihram. Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr mengatakan bahwa hadits tersebut mursal (hadits dengan mata rantai periwayatan yang hilang) melalui rantai periwayatan yang sahih, dan bahwa sebagian orang menganggapnya sebagai pernyataan Abu Bakr. {cite:muwatta-maruf-1997 p.433}"
