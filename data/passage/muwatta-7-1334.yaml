label: { ar: "الموطأ 1334 — مالك: بلغه عن أهل العلم أن الشهداء في سبيل الله لا يغسلون ولا يصلى عليهم، ويدفنون في ثيابهم، ومن حمل فعاش ثم مات غسل وصلي عليه", en: "Muwatta 1334", es: "Muwatta 1334", fr: "Muwatta 1334", ur: "موطا 1334", tr: "El-Muvatta 1334 — Malik: Alimlerden, Allah yolunda şehit olanların yıkanmadığını, cenaze namazı kılınmadığını ve elbiseleriyle defnedildiklerini işitti. Kim taşınır ve dirilirse, sonra ölürse yıkanır ve cenaze namazı kılınır.", id: "Al-Muwatta 1334 — Malik: Dia mendengar dari para ulama bahwa para syuhada di jalan Allah tidak dimandikan dan tidak dilakukan salat jenazah untuk mereka, dan mereka dikuburkan dengan pakaian mereka. Siapa pun yang dibawa dan hidup, kemudian meninggal, dimandikan dan dilakukan salat jenazah untuknya." }
summary:
  ar: "يقول مالك إنه بلغه عن أهل العلم أنهم كانوا يقولون إن الشهداء في سبيل الله لا يغسلون، ولا يصلى على أحد منهم، وإنهم يدفنون في الثياب التي قتلوا فيها. وتلك السنة فيمن قتل في المعترك فلم يدرك حتى مات، وأما من حمل منهم فعاش ما شاء الله بعد ذلك فإنه يغسل ويصلى عليه، كما عمل بعمر بن الخطاب. {cite:muwatta-maruf-1997 p.596}"
  tr: "Malik, âlimlerden, Allah yolunda şehit düşenlerin yıkanmadığını, cenaze namazı kılınmadığını ve öldürüldükleri elbiselerle gömüldüklerini duyduklarını söylüyor. Bu uygulama, savaşta şehit düşen ve ölmeden önce ebedi istirahatgahlarına ulaşamayanlar için geçerlidir. Ancak, Allah'ın dilediği kadar uzun süre yaşayanlar için yıkanırlar ve cenaze namazı kılınır; Ömer ibn el-Hattab'ın yaptığı gibi. {cite:muwatta-maruf-1997 s.596}"
  id: "Malik mengatakan bahwa ia mendengar dari para ulama bahwa mereka dahulu mengatakan bahwa para syuhada di jalan Allah tidak dimandikan, dan salat jenazah tidak dilakukan untuk mereka, dan mereka dimakamkan dengan pakaian yang mereka kenakan saat gugur. Ini adalah praktik bagi mereka yang gugur dalam pertempuran dan tidak mencapai peristirahatan terakhir sebelum meninggal. Adapun mereka yang diangkat ke surga dan hidup selama Allah menghendaki setelahnya, mereka dimandikan dan salat jenazah dilakukan untuk mereka, sebagaimana dilakukan oleh Umar bin al-Khattab. {cite:muwatta-maruf-1997 p.596}"
