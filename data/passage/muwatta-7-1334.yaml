label: { ar: "الموطأ 1334 — مالك: بلغه عن أهل العلم أن الشهداء في سبيل الله لا يغسلون ولا يصلى عليهم، ويدفنون في ثيابهم، ومن حمل فعاش ثم مات غسل وصلي عليه", en: "Muwatta 1334" }
summary:
  ar: "يقول مالك إنه بلغه عن أهل العلم أنهم كانوا يقولون إن الشهداء في سبيل الله لا يغسلون، ولا يصلى على أحد منهم، وإنهم يدفنون في الثياب التي قتلوا فيها. وتلك السنة فيمن قتل في المعترك فلم يدرك حتى مات، وأما من حمل منهم فعاش ما شاء الله بعد ذلك فإنه يغسل ويصلى عليه، كما عمل بعمر بن الخطاب. {cite:muwatta-maruf-1997 p.596}"
