text: "… الذين يربون مع العرب قبل أن نستحكم عجمتهم، فتكون اللغة العربية كأنها السابقة لهم، ولا يكون عندهم تقصير في فهم المعاني من العربية. وكذا أيضًا شأن من سبق له تعلم الخط الأعجمي قبل العربي. ولهذا نجد الكثير من علماء الأعاجم …"
