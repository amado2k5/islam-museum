label: { ar: "صحيح البخاري 3824 — الأب والأبوة", en: "Sahih al-Bukhari 3824 — the father and fatherhood", ur: "صحیح بخاری 3824 — باپ اور والدیت", es: "Sahih al-Bukhari 3824 — El padre y la paternidad", fr: "Sahih al-Bukhari 3824 — le père et la paternité" }
text: "حَدَّثَنِي إِسْمَاعِيلُ بْنُ خَلِيلٍ، أَخْبَرَنَا سَلَمَةُ بْنُ رَجَاءٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ،ا قَالَتْ لَمَّا كَانَ يَوْمُ أُحُدٍ هُزِمَ الْمُشْرِكُونَ هَزِيمَةً بَيِّنَةً، فَصَاحَ إِبْلِيسُ أَىْ عِبَادَ اللَّهِ أُخْرَاكُمْ، فَرَجَعَتْ أُولاَهُمْ عَلَى أُخْرَاهُمْ، فَاجْتَلَدَتْ أُخْرَاهُمْ، فَنَظَرَ حُذَيْفَةُ، فَإِذَا هُوَ بِأَبِيهِ فَنَادَى أَىْ عِبَادَ اللَّهِ، أَبِي أَبِي. فَقَالَتْ فَوَاللَّهِ مَا احْتَجَزُوا حَتَّى قَتَلُوهُ، فَقَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3824، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3824 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3824، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3824 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3824 (Mérites des Compagnons de Médine (Ansar)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
