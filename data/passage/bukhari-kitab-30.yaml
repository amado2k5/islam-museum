summary:
  ar: "القسم 30 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصوم»، ويضم فيها النصوص من 1891 إلى 2007 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 30 of Sahih al-Bukhari (Fasting) in the division of the open hadith dataset the museum took its reports from: reports 1891 to 2007 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 30، عنوان «کتاب الصوم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1891 تا 2007۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 30 de Sahih al-Bukhari (El ayuno) se encuentra dentro de la base de datos abierta de hadices de la que el museo extrajo sus informes: informes del 1891 al 2007, según la numeración de dicha base de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du Sahih al-Bukhari, livre 30 (Le Jeûne), dans la base de données ouverte des hadiths: les hadiths 1891 à 2007, selon la numérotation de cette base de données. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 30. bölümü \"Oruç Kitabı\" başlığını taşımakta olup, 1891'den 2007'ye kadar olan metinleri buna göre numaralandırılmış olarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 30 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Puasa\" dan berisi teks-teks dari tahun 1891 hingga 2007, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
