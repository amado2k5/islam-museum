text: "… بيان فى كتاب اللّٰه. -. فكلُ مَنْ قَبِلَ عن اللّٰه فرائضَه فى كتابه : قَبِلَ عَنْ رسول اللّٰه سُنَنَهُ، بفرْضِ اللهِ طاعةَ رسولِهِ على خلقه، وأن يَنْتَهُوا إلى حكمه. ومَنْ قَبِلَ عن رسول اللّٰه فَمَنِ اللّٰه قَبِلَ، لَا افترضَ الله …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 148، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض، وطاعة الله ورسوله، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 148, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard), obedience to God and His Messenger, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 148 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض، اللہ اور اس کے رسول کی اطاعت، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 148, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obéissance à Dieu et à Son Messager, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 148, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), la obediencia a Dios y a Su Mensajero, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 148. sayfasından bir alıntı, farz görevleri, Allah ve Resulü'nün emrettiklerini, yükümlülüğün kendisini, Allah'a ve Resulü'ne itaati ve itaat eylemini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 148, menyebutkan kewajiban-kewajiban wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, kewajiban itu sendiri, ketaatan kepada Allah dan Rasul-Nya, dan perbuatan ketaatan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk kewajiban-kewajiban wajib, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
