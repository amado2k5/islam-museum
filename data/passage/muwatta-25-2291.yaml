label: { ar: "الموطأ 2291 — مالك: ينتقل مال المكاتب مع الكتابة ولا ينتقل الولد", en: "Muwatta 2291", es: "Muwatta 2291", fr: "Muwatta 2291", ur: "موطا 2291", tr: "El-Muvatta 2291 — Malik: Azat sözleşmesiyle kölenin mülkiyeti, sözleşmenin yazılı olmasıyla devredilir; fakat çocuk devredilmez.", id: "Al-Muwatta 2291 — Malik: Harta milik seorang budak berdasarkan perjanjian pembebasan dialihkan dengan adanya perjanjian tertulis, tetapi anak tidak dialihkan." }
summary:
  ar: "قال مالك: الأمر عندنا أن المكاتب إذا كاتبه سيده تبعه ماله، ولم يتبعه ولده إلا أن يشترطهم في كتابته. {cite:muwatta-maruf-1997 p.345}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur ki, bir köle azat sözleşmesiyle efendisi tarafından azat edilirse, mal varlığı ona geçer, ancak çocukları geçmez, efendisi sözleşmede çocuklarının da dahil edilmesini şart koşmadığı sürece. {cite:muwatta-maruf-1997 s.345}"
  id: "Malik berkata: Praktik yang lazim di antara kita adalah jika seorang budak yang terikat kontrak pembebasan dibebaskan oleh tuannya, hartanya akan tetap bersamanya, tetapi anak-anaknya tidak, kecuali jika tuannya menetapkan penyertaan mereka dalam kontrak tersebut. {cite:muwatta-maruf-1997 p.345}"
