text: "… طريقِ أبي عاصم الضريرِ الكوفي عن انظر: الموضح لمذاهب القراء واختلافهم في الفتح والإمالة وما بعدها، وإسناده صحيح وهو مقطوع من قول إبراهيم، وكذا رواه ابن أبي داود في كتاب المصاحف - برقم، رجاله ثقات أيضا وإسناده صحيح إِلى إبراهيم. …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 584، يذكر القراء، وجمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 584, that mentions the readers, the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 584 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 584, que menciona a los lectores, la colección del Corán y los códices, los sistemas de escritura y el arte de escribir; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 3, page 584, qui évoque les lecteurs, la compilation du Coran et les codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 3. cildinin 584. sayfasından bir alıntı, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını, çeşitli yazı biçimlerini ve üsluplarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı biçimi, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 3, halaman 584, membahas para qari, penyusunan Al-Qur'an dan manuskripnya, serta berbagai aksara dan gaya penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
