label: { ar: "الموطأ 2578 — مالك: فرق القسامة في الدم عن الأيمان في الحقوق", en: "Muwatta 2578" }
summary:
  ar: "قال يحيى: قال مالك: وإنما فُرق بين القسامة في الدم والأيمان في الحقوق: أن الرجل إذا داين الرجل استثبت عليه في حقه، وأن الرجل إذا أراد قتل الرجل لم يقتله في جماعة من الناس، وإنما يلتمس الخلوة. فلو لم تكن القسامة إلا فيما تثبت فيه البينة، ولو عُمل فيها كما يُعمل في الحقوق، لهلكت الدماء واجترأ الناس عليها، ولكن إنما جُعلت القسامة إلى ولاة المقتول يُبدؤون بها ليكف الناس عن الدم، وليحذر القاتل أن يؤخذ في مثل ذلك بقول المقتول. {cite:muwatta-maruf-1997 p.455}"
