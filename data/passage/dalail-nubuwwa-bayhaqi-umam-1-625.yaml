text: "… : قال فمر عليه الدهر، فانهدم، فبنته العمالقة. قال : فمرَّ عليه الدهر، فانهدم، فبنته جرهم، فمر عليه الدهر، فبنته قريش، ورسول اللّٰه، وَلِيِ، يومئذ رجل شاب، فلما أرادوا أن يرفعوا الحجر الأسود اختصموا فيه، فقالوا : نحكم بيننا أول …"
