text: "… العسل، ثم يجيء بصاحبها فيقول: أعطه الثمن. قلت: ووقع نحو ذلك للنعمان فيما ذكره الزُّبير بن وأخرج من طريق أبي الزاهرية عن الحليس أن رسول اللّٰه والفي قال: أعطيت قريش ما لم يعط الناس... بكار في كتاب الفكاهة والمزاح. الحديث. …"
