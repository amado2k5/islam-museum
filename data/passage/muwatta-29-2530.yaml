label: { ar: "الموطأ 2530 — مالك: لا تجب الدية على العاقلة حتى تبلغ الثلث فصاعدا", en: "Muwatta 2530", es: "Muwatta 2530", fr: "Muwatta 2530", ur: "موطا 2530", tr: "Al-Muwatta 2530 — Malik: Kan parası, kabilenin üçte birine veya daha fazlasına ulaşana kadar kabile için zorunlu değildir.", id: "Al-Muwatta 2530 — Malik: Uang darah tidak wajib bagi klan sampai jumlahnya mencapai sepertiga atau lebih." }
summary:
  ar: "قال مالك: والأمر عندنا أن الدية لا تجب على العاقلة حتى تبلغ الثلث فصاعدا، فما بلغ الثلث فهو على العاقلة، وما كان دون الثلث فهو في مال الجارح خاصة. {cite:muwatta-maruf-1997 p.436}"
  tr: "Malik şöyle dedi: Bizim uygulamamızda, kan parası, üçte bir veya daha fazlasına ulaşana kadar aşiret için zorunlu değildir. Üçte bire ulaşan kısım aşiretin sorumluluğundadır, üçte birden az olan kısım ise zararı verenin sorumluluğundadır. {cite:muwatta-maruf-1997 s.436}"
  id: "Malik berkata: Praktik kami adalah bahwa uang darah tidak wajib bagi klan sampai mencapai sepertiga atau lebih. Apa pun yang mencapai sepertiga adalah tanggung jawab klan, dan apa pun yang kurang dari sepertiga adalah tanggung jawab orang yang menyebabkan luka. {cite:muwatta-maruf-1997 p.436}"
