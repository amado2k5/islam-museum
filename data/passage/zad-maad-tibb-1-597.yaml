text: "… القلوب والأرواح، وحفظ الحركة، أو إصابة حرارة الشمس، أو القيظ الشديد وقد أشكل هذا الحديثُ على كثير من جهلة أنواعه بُرءاً عجيباً سريعاً، وتنفع مِن الفالج، نصل انواع علاجه وكان علاجه الم للمرض ثلاثة أنواع: أحدها: بالأدوية الطبيعية. والثاني : …"
