text: "… عن أبيه عن الني عل. قال له أسلمْ تسلم. قال : وما الإسلام؟ قال: أن تسلم قلبك لله، وأن يسلّمَ المسلمون من لسانك ويدك. قال: فأي الإسلام أفضل؟ قال الإيمان. قال: وما الإيمان؟ قال: أن تؤمن بالله وملائكته وكتبه ورسله …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 10، يذكر تعريف الإسلام بأعماله، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 10, that mentions Islam defined by its acts, belief in God, His angels, His books and His messengers, the question about faith and its answer, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 10 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
