text: |-
  .
  ٣٤٥
  (اب الرامم
  ⁦(٠٣)⁩
  صل الصباد ب الصيتر حيس النفس عن الجزع وقد صبر خلات عند المصيبة
  يصبر صبرا وصبرته أناحبته قال اللّٰه تع الى واصبر نفسك مع الذين يدعون ربهسم قال
  عنترة يذكرحربا كان فيها فصبرت عارفة لذلك حرة • ترسواذا نفس الجبان تطلع
  يقول حبست نفساصابرة وفى حديث النبيّ على اللّه عليه وسلم فى رجل أمل رجلا وقتله
  آخرقال اقتاوا القائل واصبروا الصابرأى احبوا الذى حبسه للموت-ق يموت وصبرت
  الرجل اذا حلفته صبرا اوقتلته صبرا يقال قتل فلان صبرا وحلف صبرا اذاحبس على القتل
  حتى يقتل أو على المين حق يحلف وصكذلك أصبرت الرجل بالااف والمصبورة هى المين
  والمصبورة التى نرى عنهاهى الحبوسة على الموت وكل ذى روح يصبر حياثم يرمى حتى يقتل
  فقد ق-ل صسبرا والتصبر تكلف الصبروتدول اصطبرت ولا يقال اطبرت لات الصاد لاتدغم
  فى الطاءفان أردت الادقام قلبت الظاءصادا وقلت اصبرت والصبير الكفيل تقول منه
  صبرت أصبر بالضم صبراوصبارة أى كفلت بدتول منه أصبرنى بارجل أى اعطنى
  كفيلا والصبير السعاب الابيض لا يكاد يطر قال الشاهر
  يروح اليهم عكر زاغى • كأن دويهارعد الصبير
  وقال الاصعىّ الصبير السصاب الإبيض الذى يصبر بعضه فوق بعض دربا وقال يصف جيشا
  ككرفئة الغيث ذات الصبير والجمع صبر والصير بكسر الباهذا الدواء المرولا يسكن
  الافى ضرورة الشعر قال الراجز
  أمر من صبرومة روحفظ يعقوب عن الفراء
  الاصبار السمائب البيض الواحدة صبر وصبر بالكسر والضم واصبار الاناء جوائبه يقمال
  أخذها بأصبارها أى تامة يجميعها الواحد صبر بالضم وأدهقت الكاس الى أصبارها
  وأصهارها أى الى رأسها قال الاصمعى اذالق الرجل الشدة يكما لهاقيل لقيها بأصبارها والصبر
  أيضابطن من غسان قال الاخطل
  تسأله الصبر من غسان اذحضروا • والحزن كيف قراه الغلمة الجشر
  ويروى فسائل الصبرمن غسان اذ حضروا والحزن بالفتح لانه قال بعده
  يعرفونك رأس ابن الحباب وقد • أمسى والسيف فى خيشومه أثر
  بعو عمير بن الحباب السلى لانه قتل وحل رأسه الى قبائل غسان وكأن لا يبالى بهم وية ول
  ليسوابشئ اغماهم جشر والصبر أيضاقلب البصر وهو حرف الشى وغلظه والصبر أيضا
  الارض التى فيها حصباء وليست بغليظة ومنه قيل للحرّة أم صبار يتشديد الباء ويقال وقع
  القوم فى أتم صبور أى فى أمرشديد وصبارة الشماء بتشديد ارا.شدّة برده والصبرة واحدة
  صير الطعام تقول اشتريت الشى صبرة أى يلاوزن ولا كيل والصبارة الجارة قال الشاعر
  من-بلغ عرابأن المرلم يخلق صباره ويروى صبارة بالفتح وهو جمع صبار بالغح
  والهاء داخلة بهع ابمع لان الصباربه-ع صبرة وهى حجارة شديدة قال الاعشى
  كأن ترنم الهاجات فيها • قبيل الصبح أموات الصباد
  الهاجات الضفادع شبه تقبقها باصوات وقع الجارة والصنبور النخلة تبقى منفردة ويدق
  أسفاها ويقشر يقال صنبر أسفل النخلة والصنبور الرجل الفرد لاولدله ولا أخ والصنبور
