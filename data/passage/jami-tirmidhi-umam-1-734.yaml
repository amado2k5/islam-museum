text: "… الَّبِيَّ ولَل عمِ مِنْدَ أَبِي طالِبِ مَجْلِسُ رَجُلٍ فَقَامَ أَبُو جَهْلٍ كَيْ يَمْنَعَهُ قَالٌ وَشَكَوْهُ إِلَى أَبِي طالِبٍ، فَقَالَ يَا ابْنَ أَخِي مَا تُرِيدُ مِنْ قَوْمِكَ؟ قَالَ: إِنِّي أُرِيدُ مِنْهُمْ كَلِمَةً واحِدَةً تَدِينُ لَهُمْ بهَا العَربُ وتُؤَدِي إِلَيْهِمُ الْعَجَمُ الجِزْيَةَ، …"
