text: "… وهو ديرٌ بنواحي دمشق في مَوضِع نزه وبساتين مُحدقة به، وعنده قصورٌ ودورٌ، وعنده قبرُ عمرَ بنِ عبد العزيز --.. ورُوي: أَنَّ صاحبَ الدِّيرِ دخلَ على عمرَ بنِ عبد العزيز في مرضه الَّذي مات فيه بفاكهةٍ أَهداها له، فأَعطاهُ ثَمِنَها، …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 605، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 605, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 605 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 2, pág. 605, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal, tome 2, page 605, mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 605. sayfasından, ölüm ve vefat anı, defin, mezar ve istirahat yeri konularını ele alan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Kemelekatan) karya Ahmad ibn Hanbal, Jilid 2, halaman 605, yang membahas tentang saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
