text: "… وهو ديرٌ بنواحي دمشق في مَوضِع نزه وبساتين مُحدقة به، وعنده قصورٌ ودورٌ، وعنده قبرُ عمرَ بنِ عبد العزيز --.. ورُوي: أَنَّ صاحبَ الدِّيرِ دخلَ على عمرَ بنِ عبد العزيز في مرضه الَّذي مات فيه بفاكهةٍ أَهداها له، فأَعطاهُ ثَمِنَها، …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 605، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
