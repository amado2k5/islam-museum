text: "ابن أبي سفيان الأموي، وأبا عبيدة بن الجراح، وشرحبيل بن حسنة، إلى الشام، وسار إليهم خالد بن الوليد من العراق، وأول شيء فتحوا من الشام بصرى صلحاً. وتوفي أبو بكر، واستخلف عمر فولى أبا عبيدة على الجيش، وفتح اللّٰه تعالى …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 214، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
