  tr: "İbn Hallikan'ın *Vafayat el-A'yan* adlı eserinin resimli 1. cildinin 214. sayfasında bir vasiyetname veya son miras belgesinden bahsedilmektedir; makine tarafından okunabilir resimli baskıda, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
