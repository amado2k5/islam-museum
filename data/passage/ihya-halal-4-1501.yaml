text: "… صهيب وقال ليس إسناده بالقوي إن العبد ليفتتح سورة فتصلي عليه الملائكة حتى يفرغ منها وإن العبد ليفتتح سورة فتلعنه حتى يفرغ منها فقيل له وكيف ذلك فقال إذا أحل حلالها وحرم حرامها صلت عليه وإلا لعنته"
