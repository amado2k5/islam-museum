text: "من صبح الأعشنى والشَّكُر لله واجبًا، وما شاكل ذلك. قال فى موادّ البَيَان : وإذا ذكَر البَلْوىٰ شفعها بالاستعانةِ باللّه تعالىٰ والرّجوع إليه فيها، وردّ الأمْر إلىٰ حَوْلهِ وقوّته. قال أبن عبد ربه : فإن هذه المواضعَ مما يتعيَّنُ على …"
