label: { ar: "الموطأ 2167 — مالك عن ابن شهاب عن سالم عن أبيه: قال عمر من أحيا أرضا ميتة فهي له، وعلى ذلك الأمر عندنا", en: "Muwatta 2167", es: "Muwatta 2167", fr: "Muwatta 2167", ur: "موطا 2167", tr: "El-Muvatta 2167 — Malik, İbn Şihab'tan, o da Salim'den, o da babasından rivayetle: Ömer dedi ki: \"Ölü toprağı dirilten kimse, o toprak ona aittir ve bu bizim hükmümüzdür.\"", id: "Al-Muwatta 2167 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Salim, berdasarkan riwayat ayahnya: Umar berkata, “Siapa pun yang menghidupkan kembali tanah yang mati, maka tanah itu menjadi miliknya, dan itulah hukum yang berlaku di pihak kami.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه أن عمر بن الخطاب قال: من أحيا أرضا ميتة فهي له. قال مالك: وعلى ذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.288}"
  tr: "Malik, İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da babasından naklederek, Ömer ibn el-Hattab'ın şöyle dediğini rivayet eder: \"Ölü toprağı dirilten kimse, o toprak ona aittir.\" Malik dedi ki: \"Bizim hükmümüz de böyledir.\" {cite:muwatta-maruf-1997 s.288}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Salim ibn Abdullah, dari ayahnya, bahwa Umar ibn al-Khattab berkata: Barangsiapa menghidupkan kembali tanah yang mati, maka tanah itu menjadi miliknya. Malik berkata: Dan itulah hukum yang berlaku di pihak kami. {cite:muwatta-maruf-1997 p.288}"
