text: "… دلالة على أن النوافل المؤقتة تقضى كما تقضى الفرائض، وعلى أن الصلاة التي لها سبب لا تكره في هذه الأوقات المكروهة. قض اختلفوا في جواز الصلاة في الأوقات الثلاثة، وبعد صلاة الصبح إلى الطلوع، وبعد صلاة العصر إلى الغروب: فذهب …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 577، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 577, whose wording mentions the obligation (farida), the supererogatory (nafila), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 577 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 1, p. 577, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila), le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Mishkat al-Masabih, volumen digitalizado 1, p. 577, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila), lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 577'den, farz olan, nafile olan ve mekruh olan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, hlm. 577, yang menyebutkan amalan wajib, amalan sunnah, dan amalan makruh; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan makruh, amalan yang dilarang, dan dosa-dosa kecil."
