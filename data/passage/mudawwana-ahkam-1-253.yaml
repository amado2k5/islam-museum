text: "والهدي والبدن ليست بهذه المنزلة قات أرأيت ان ساق هديا واجبا من جزاء الصيد أو غير ذلك مما وجب عليه فضلًّ فى الطريق فأبدله فنحر البدل يوم النحر ثم أصاب الهدى الذى ضلّ منه بعد أيام الندر أينحره أم لا …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 253، يرد فيه ذكر الواجب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 253, whose wording mentions the obligatory (wajib), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 253 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 1, p. 253, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 1, p. 253, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Büyük Derleme, Resimli Cilt 1, sayfa 253'ten bir alıntı; zorunlu görevleri ve sorumlu bireyden beklenenleri belirtiyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu görevler, itaat eylemleri, tavsiye edilen eylemler, hoş karşılanmayan eylemler, yasak eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kompendium Agung, Jilid Bergambar 1, halaman 253, yang menyebutkan kewajiban dan apa yang dituntut dari individu yang bertanggung jawab; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk kewajiban, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa-dosa kecil."
