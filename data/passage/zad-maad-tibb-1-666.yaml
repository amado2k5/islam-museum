text: "… وَخَيْرٌ لِنَفْسِكَ عِصيَانُهَا الهوى أكبر امراض القلب فلا بد من مخالفته فالهوى أكبرُ أدوائها، ومخالفتُه أعظمُ أدويتها، والنفس في الأصل خُلِقَت جاهلة ظالمة، فهي لجهلها واجتنابها للدواء أنواع من الأسقام والعِلل التي تعيي الأطباء، ويتعذَّرُ معها الشفاء. والمصيبةُ العظمى، أنها …"
