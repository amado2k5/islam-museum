text: "الجز الشاك عشر ٣٦- حدثنا عبد الله، قال: وجدت في كتاب أبي بخط يده، قال: حدثني مهدي، قال: حدثني أبو عبد الرحمن الزاهد، عن صالح بن فلان، قال: بينا عمر بن عبد العزيز يسير في ظل؛ إذ وقع في يده"
