text: "وكذلك إخفاء السر، وحفظ العهد، إنما تواصى الناس بهما لما فيهما من المصالح، وأكثروا الثناء عليهما، فمن يحتمل الضرر فيه، فإنما يحتمله لأجل الثناء. فإن فرض حيث لا ثناء، فقد وجد مقروناً بالثناء، فيبقى ميل الوهم إلى المقرون باللذيذ، وإن …"
