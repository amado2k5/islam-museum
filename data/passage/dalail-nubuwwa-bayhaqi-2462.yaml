  tr: "Yemen krallarının yazışmalarından derlenen, El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinden bir alıntı; kaynakların politikasına göre metin yaklaşık kırk kelimeyle aktarılmıştır."
