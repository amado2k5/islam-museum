text: "تب له كتابا وعهدا، وأمره فيه أمره فكتب : بسم الله الرحمن الرحيم ، هذا كتاب من الله ورسوله ⁦(يا أيها الذين آمنوا أوفوا بالعقود)⁩ ⁦(١)⁩، عهد من رسول الله واف لعمرو بن حزم حين بعثه إلى اليمن أمره بتقوى الله في"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، في مراسلات ملوك اليمن، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
