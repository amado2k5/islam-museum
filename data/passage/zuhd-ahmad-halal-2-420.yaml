text: "… قال: كان يقولُ: إِنِّي أَدركتُ صدرَ هذهِ الأُمَّةِ، ثُمَّ طال بي عُمُرٌ حتَّى أَدرَكْتُكُم، فوالَّذي لا إِله غيرُه! لهم كانوا أَبصرَ في دينهم بقلويهم منكم في دُنياكم بأبصاركم، ولهم كانُوا فيما أحلَّ الله لهم أزهدَ منكم فيما حرَّم اللهُ عليكم، …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 420، يذكر ما أُحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
