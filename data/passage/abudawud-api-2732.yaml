text: "حَدَّثَنَا مُسَدَّدٌ، وَيَحْيَى بْنُ مَعِينٍ، قَالاَ حَدَّثَنَا يَحْيَى، عَنْ مَالِكٍ، عَنِ الْفُضَيْلِ، عَنْ عَبْدِ اللَّهِ بْنِ نِيَارٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، قَالَ يَحْيَى أَنَّ رَجُلاً، مِنَ الْمُشْرِكِينَ لَحِقَ بِالنَّبِيِّ لِيُقَاتِلَ مَعَهُ فَقَالَ \" ارْجِعْ \". ثُمَّ اتَّفَقَا فَقَالَ \" إِنَّا لاَ نَسْتَعِينُ بِمُشْرِكٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2732، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2732 (Jihad (Kitab Al-Jihad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 2732، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 2732 (Yihad (Kitab Al-Jihad)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
