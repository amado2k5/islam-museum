label: { ar: "صحيح البخاري 1558 — الحرام", en: "Sahih al-Bukhari 1558 — the unlawful", ur: "صحیح بخاری 1558 — حرام", es: "Sahih al-Bukhari 1558 — el ilícito", fr: "Sahih al-Bukhari 1558 — l'illicite", tr: "Sahih el-Buhari 1558 — Yasak", id: "Sahih al-Bukhari 1558 — Yang Terlarang" }
text: "… قَالَ قَدِمَ عَلِيٌّ ـ عَلَى النَّبِيِّ مِنَ الْيَمَنِ فَقَالَ \" بِمَا أَهْلَلْتَ \". قَالَ بِمَا أَهَلَّ بِهِ النَّبِيُّ. فَقَالَ \" لَوْلاَ أَنَّ مَعِي الْهَدْىَ لأَحْلَلْتُ \". وَزَادَ مُحَمَّدُ بْنُ بَكْرٍ عَنِ ابْنِ جُرَيْجٍ قَالَ لَهُ النَّبِيُّ \" بِمَا أَهْلَلْتَ يَا عَلِيُّ \". قَالَ بِمَا أَهَلَّ بِهِ النَّبِيُّ قَالَ \" فَأَهْدِ وَامْكُثْ حَرَامًا كَمَا أَنْتَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1558، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1558 (Hajj (Pilgrimage)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1558، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1558 (Hajj (Peregrinación)), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1558 (Hajj (Pèlerinage)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 1558 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri bir araya getirerek derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1558, menyebutkan apa yang diharamkan. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
