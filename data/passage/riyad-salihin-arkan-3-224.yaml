text: "… القرآنَ مثلُ الأتْرُجَةِ : ريحهَا طَيِّبُ وطَعمُهَا حلوٌ، ومثَلُ المؤمنِ الّذي لا يَقْرَأ القُرآنَّ كَمَثَلِ النَّمرةِ : لا رِبحِ لهَا وطَعْمُهَا حلوٌ، ومثَلُ المُنافِق الذِي يَقْرَأُ القرآنَ كَمئَلِ الرِّيحانَةِ : رِيحها طيّبٌ وطَمْمُهَا مرّ، ومَثَلُ المُنَافِقِ الذي لا يَقْرَأُ القرآنَ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 224، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 224, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 224 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
