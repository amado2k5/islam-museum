summary:
  ar: "القسم 37 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإجارة»، ويضم فيها النصوص من 2260 إلى 2286 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Sahih al-Bukhari (Hiring) in the division of the open hadith dataset the museum took its reports from: reports 2260 to 2286 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 37، عنوان «کتاب الاجارۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2260 تا 2286۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 37 de Sahih al-Bukhari (Hiring) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2260 al 2286, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 37 du Sahih al-Bukhari (L'Embauche), dans la section du recueil ouvert: les hadiths 2260 à 2286 de cette section sont classés par le musée. Les éditions imprimées classent et numérotent ces hadiths différemment."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 37. bölümü \"Kira Kitabı\" başlığını taşımakta olup, 2260 ile 2286 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 37 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sewa-Menyewa\" dan berisi teks 2260 hingga 2286, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
