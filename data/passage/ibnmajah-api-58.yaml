label: { ar: "سنن ابن ماجه 58 — شعب الإيمان", en: "Sunan Ibn Majah 58 — the branches of faith", ur: "سنن ابن ماجہ 58 — ایمان کی شاخیں", es: "Sunan Ibn Majah 58 - las ramas de la fe" }
text: "حَدَّثَنَا سَهْلُ بْنُ أَبِي سَهْلٍ، وَمُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ يَزِيدَ، قَالاَ حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، قَالَ سَمِعَ النَّبِيُّ ـ رَجُلاً يَعِظُ أَخَاهُ فِي الْحَيَاءِ فَقَالَ \" إِنَّ الْحَيَاءَ شُعْبَةٌ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 58، يذكر شعب الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 58 (The Book of the Sunnah), that mentions the branches of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 58، جس میں ایمان کی شاخیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 58 (El Libro de la Sunnah), menciona las ramas de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
