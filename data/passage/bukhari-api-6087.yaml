label: { ar: "صحيح البخاري 6087 — ضحك وتبسم", en: "Sahih al-Bukhari 6087 — laughter and smiling", ur: "صحیح بخاری 6087 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 6087 — rire et sourire", es: "Sahih al-Bujari 6087 — risa y sonrisa", tr: "Sahih el-Buhari 6087 — Kahkaha ve Gülümseme", id: "Sahih al-Bukhari 6087 — Tawa dan Senyum" }
text: "… قَالَ لَيْسَ لِي. قَالَ فَصُمْ شَهْرَيْنِ مُتَتَابِعَيْنِ . قَالَ لاَ أَسْتَطِيعُ. قَالَ فَأَطْعِمْ سِتِّينَ مِسْكِينًا . قَالَ لاَ أَجِدُ. فَأُتِيَ بِعَرَقٍ فِيهِ تَمْرٌ ـ قَالَ إِبْرَاهِيمُ الْعَرَقُ الْمِكْتَلُ فَقَالَ أَيْنَ السَّائِلُ تَصَدَّقْ بِهَا . قَالَ عَلَى أَفْقَرَ مِنِّي وَاللَّهِ مَا بَيْنَ لاَبَتَيْهَا أَهْلُ بَيْتٍ أَفْقَرُ مِنَّا. فَضَحِكَ النَّبِيُّ حَتَّى بَدَتْ نَوَاجِذُهُ. قَالَ فَأَنْتُمْ إِذًا ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6087، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 6087, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 6087، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6087, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 6087, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 6087 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6087, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
