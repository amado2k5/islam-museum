summary:
  ar: "قول لمالك في الإبل النواضح والبقر السواني وبقر الحرث: إنه يرى أن يؤخذ من ذلك كله إذا وجبت فيه الصدقة. ويذكر المحقق أن الناضح ما يحمل الماء من بئر أو نهر لسقي الزرع، والسواني ما يُستقى عليها من البئر، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354}"
