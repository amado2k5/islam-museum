label: { ar: "الموطأ 708 — مالك: الإبل النواضح والبقر السواني وبقر الحرث يؤخذ من ذلك كله إذا وجبت فيه الصدقة", en: "Muwatta 708", es: "Muwatta 708", fr: "Muwatta 708", ur: "موطا 708", tr: "Al-Muwatta 708 — Malik: Suyla çekilen develer, suyla çekilen büyükbaş hayvanlar ve sabanla sürülen büyükbaş hayvanlar, zekât yükümlülüğü varsa zekâta tabidirler.", id: "Al-Muwatta 708 — Malik: Unta penarik air, sapi penarik air, dan sapi pembajak semuanya dikenai zakat jika zakat wajib dikenakan atas mereka." }
summary:
  ar: "قول لمالك في الإبل النواضح والبقر السواني وبقر الحرث: إنه يرى أن يؤخذ من ذلك كله إذا وجبت فيه الصدقة. ويذكر المحقق أن الناضح ما يحمل الماء من بئر أو نهر لسقي الزرع، والسواني ما يُستقى عليها من البئر، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354}"
  tr: "Malik, su çekmek için kullanılan develer, sulama için kullanılan sığırlar ve sabanla sürülen sığırlar hakkında şöyle demiştir: Zekât verilmesi gereken durumlarda hepsinden zekât alınması gerektiğine inanmaktadır. Araştırmacı, su çekmek için kullanılan devenin, ekinleri sulamak için kuyudan veya nehirden su taşıyan deve olduğunu ve kuyudan su çekmek için kullanılan sığırın da kuyudan su çekmek için kullanılan sığır olduğunu ve bunun Malik'ten Ebu Mus'ab tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.354}"
  id: "Malik berkata mengenai unta yang digunakan untuk mengambil air, sapi yang digunakan untuk irigasi, dan sapi pembajak: beliau meyakini bahwa zakat harus diambil dari semuanya jika zakat wajib dikenakan kepada mereka. Peneliti menyebutkan bahwa unta yang digunakan untuk mengambil air adalah unta yang membawa air dari sumur atau sungai untuk mengairi tanaman, dan sapi yang digunakan untuk mengambil air dari sumur adalah sapi yang digunakan untuk mengambil air dari sumur, dan hal ini diriwayatkan dari Malik oleh Abu Mus'ab. {cite:muwatta-maruf-1997 p.354}"
