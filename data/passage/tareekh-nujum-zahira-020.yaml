text: "قدم سيف الأمير بيبغا أرس، وقد قبض عليه، وسبب ذلك، أنه لما ورد عليه كتاب السلطان بمسك أخيه منجك، اشتد خوفه وطلع الى المقبة ونزل الى المنزلة، فبلغه أن الأمير طاز والأمير بزلاد وكا للقبض طليه، فركب بيبنا أرس بمن"
