text: "… قال : اخرج فقل: من اراد ان يسأل عن الحلال والحرام والفقه فليدخل ! فخرجت فقلت لهم، قال: فدخلوا حتى ملاّوا البيت والحجرة، فما سألوه عن شء الا اخبرهم به وزادهم مثله ثم قال: اخوانكم! نخرجوا؛ ثم قال: اخرج فقل …"
