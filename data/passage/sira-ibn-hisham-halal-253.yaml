text: "… الفريقين حلفاءه على إخوانه، حتى يتسافَكُوا دماءهم بينهم، وبأيْديهم التوراةُ يَعْرِفُونَ فيها ما عليهم وما لهم، والأوسُ والخزرجُ أَهْلُ شركِ يعبدون الأوثان؛ لا يعرفون جَنَّةً ولا ناراً، ولا بعثاً ولا قيامةً، ولا كتاباً، ولا حَلالاً ولا حراماً، فإذا وضعت الحربُ …"
