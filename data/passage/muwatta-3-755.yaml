label: { ar: "الموطأ 755 — بلاغ ابن شهاب: أخذ النبي الجزية من مجوس البحرين، وعمر من مجوس فارس، وعثمان من البربر", en: "Muwatta 755" }
summary:
  ar: "أول حديث في باب جزية أهل الكتاب والمجوس. يرويه مالك عن ابن شهاب قال: بلغني أن النبي أخذ الجزية من مجوس البحرين، وأن عمر بن الخطاب أخذها من مجوس فارس، وأن عثمان بن عفان أخذها من البربر. ويذكر المحقق أنه رواه عن مالك محمد بن الحسن الشيباني (332)، وأن أبا مصعب (741) رواه عن مالك أنه بلغه، من غير ذكر ابن شهاب، وينقل عن ابن عبد البر (التمهيد 12/63–65) أنه هكذا عند جميع رواة الموطأ، وأن عبد الرحمن بن مهدي رواه عن مالك عن ابن شهاب عن السائب بن يزيد موصولاً (الطبراني 6660)، وأن الهيثمي ضعف الحسين بن سلمة راويه عن ابن مهدي، ويخالفه المحقق في تضعيفه لكنه يرى تفرده بهذا الوجه عن مالك مشعراً بغرابته، كما أشار الدارقطني. {cite:muwatta-maruf-1997 p.374}"
