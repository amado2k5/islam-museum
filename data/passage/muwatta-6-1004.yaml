text: "لا يحتجم المحرم إلا من ضرورة"
summary:
  ar: "قول لمالك: لا يحتجم المحرم إلا من ضرورة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1191) وسويد (579). {cite:muwatta-maruf-1997 p.470}"
  tr: "Malik şöyle demiştir: İhramda olan bir hacı, zorunluluk hali dışında hacamat yaptırmamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1191) ve Suveyd (579) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.470}"
  id: "Malik berkata: Seorang jamaah haji yang sedang ihram tidak boleh melakukan bekam kecuali karena terpaksa. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1191) dan Suwaid (579). {cite:muwatta-maruf-1997 p.470}"
