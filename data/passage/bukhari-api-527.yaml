label: { ar: "صحيح البخاري 527 — أي الأعمال أحب إلى الله", en: "Sahih al-Bukhari 527 — Which deeds are most loved by God", ur: "صحیح بخاری 527 — اللہ کو کون سے اعمال محبوب ترین ہیں", es: "Sahih al-Bukhari 527 — ¿Cuáles son las obras más amadas por Dios?", fr: "Sahih al-Bukhari 527 — Quelles sont les actions les plus aimées de Dieu ?" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، هِشَامُ بْنُ عَبْدِ الْمَلِكِ قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ الْوَلِيدُ بْنُ الْعَيْزَارِ أَخْبَرَنِي قَالَ سَمِعْتُ أَبَا عَمْرٍو الشَّيْبَانِيَّ، يَقُولُ حَدَّثَنَا صَاحِبُ، هَذِهِ الدَّارِ وَأَشَارَ إِلَى دَارِ عَبْدِ اللَّهِ قَالَ سَأَلْتُ النَّبِيَّ صلى الله عليه وسلم أَىُّ الْعَمَلِ أَحَبُّ إِلَى اللَّهِ قَالَ ‏\"‏ الصَّلاَةُ عَلَى وَقْتِهَا ‏\"‏‏.‏ قَالَ ثُمَّ أَىُّ قَالَ ‏\"‏ ثُمَّ بِرُّ الْوَالِدَيْنِ ‏\"‏‏.‏ قَالَ ثُمَّ أَىُّ قَالَ ‏\"‏ الْجِهَادُ فِي سَبِيلِ اللَّهِ ‏\"‏‏.‏ قَالَ حَدَّثَنِي بِهِنَّ وَلَوِ اسْتَزَدْتُهُ لَزَادَنِي‏.‏"
summary:
  ar: "عن عبد الله بن مسعود: سألت النبي أي العمل أحب إلى الله، فكان الجواب الصلاة على وقتها ثم بر الوالدين ثم الجهاد في سبيل الله."
  en: "From Abdullah ibn Masud: asked which deed is most loved by God — prayer at its time, then kindness to the parents, then striving in God's cause."
  ur: "عبداللہ بن مسعود سے: کون سا عمل اللہ کو محبوب ترین ہے — وقت پر نماز، پھر والدین سے حسن سلوک، پھر اللہ کی راہ میں جہاد۔"
  es: "De Abdullah ibn Masud: preguntó qué obra es la más amada por Dios: la oración en su momento, luego la bondad hacia los padres, luego el esfuerzo por la causa de Dios."
  fr: "D'après Abdullah ibn Masud: on lui a demandé quel acte était le plus aimé de Dieu: la prière accomplie à son heure, puis la bienveillance envers les parents, puis l'effort pour la cause de Dieu."
