text: "… الله لليهيه وجب على كل مُؤمنٍ نَصْرُهُ، أو قال: إجابته. سكت أبو داود عليه. وقال في موضع آخر في هارون: هو من ولد الشيعة. وقال السُّليماني: فيه نظر. وقال أبو داود في عمرو بن أبي قيس: لا بأس به، في …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 305، يرد فيه ذكر ما وجب على كل مسلم، وما يجب على المكلف، وما لا بأس به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 305, whose wording mentions a duty laid on every Muslim, what is binding on the person addressed, what is said to be no harm; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 305 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، جو مکلف پر واجب ہے، جس میں کوئی مضائقہ نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Muqaddima de Ibn Khaldun, volume numérisé 1, p. 305, dont le texte mentionne un devoir imposé à chaque musulman, ce qui s'impose à la personne responsable, ce qui est dit sans inconvénient ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Muqaddima de Ibn Khaldun, volumen digitalizado 1, p. 305, cuyo texto menciona un deber impuesto a cada musulmán, lo que obliga a la persona responsable, lo que se dice que no tiene inconveniente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Haldun'un Mukaddime adlı eserinin 1. cildinin 305. sayfasından bir alıntı; her Müslüman için farz olan, yasal sorumluluğu olan bir kişiden beklenen ve caiz olan şeyleri sıralamaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Muqaddimah karya Ibnu Khaldun, Jilid 1, halaman 305, yang menyebutkan apa yang wajib bagi setiap Muslim, apa yang dituntut dari orang yang bertanggung jawab secara hukum, dan apa yang diperbolehkan. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
