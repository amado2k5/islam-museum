  fr: "Un extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, volume 4 scanné, p. 565, qui mentionne le miel comme remède, médicament et le médecin, une plainte d'un mal, des maladies nommées, la guérison; d'après le scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 4. resimli cildinin 565. sayfasından bir bölüm; bal ile tedavi, ilaç ve doktor, hastalıktan şikayet etme, hastalıkların isimleri ve şifadan bahsediliyor; makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Bayhaqi “Bukti Kenabian,” jilid bergambar 4, hlm. 565, yang menyebutkan pengobatan dengan madu, obat-obatan dan dokter, keluhan penyakit, nama-nama penyakit, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
