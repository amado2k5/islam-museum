text: "… جابر بن عبد اللّه من وضوئه حتى عقل بعد ما كان لا - باب ما جاء في أمره الرجل الذي شكا إليه استطلاق بطن أخيه بسقي العسل وما جعل اللّٰه - تعالى - فيه من الشفاء وليس ذلك من الطب …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 4، ص 565، يذكر التداوي بالعسل، والطب والطبيب، والشكوى من العلة، وأسماء الأمراض، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 4, p. 565, that mentions honey as a remedy, medicine and the physician, a complaint of an ailment, named diseases, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 4، ص 565 کا اقتباس جس میں شہد سے علاج، طب اور طبیب، بیماری کی شکایت، بیماریوں کے نام، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
