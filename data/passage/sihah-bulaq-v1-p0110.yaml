text: |-
  أفسل العين)
  ٥٣٦
  ويقال معناه أنه ينشد قصيدتين احداهما قدذللها والاخرى فيها اعتراض والعروض ميزان
  الشعرلانه يعارض بها وهى مونئة ولا تجمع لانها اسم جنس والعروض أيضااسم الجز.
  الذى فيه آخر النصف الاول من البيت ويجمع على أعاريض على غير قياس كاتهم بجعوا
  اعر يضاوان شئت بحمته على اعارض والعروض طر يق فى الجبل وقواه-م استعمل فلان
  ءلى العروض وهى مكة والمدينة ١ ماحولهما قال لبيد
  وان لم يكن الا القتال رأيتنا • نقائل مابي العروض وخشعما أى ما بين مكة واليمن
  وبعيره روض وهو الذى اذا فاته السكلد" أكل الشوك قال ابن السكيت
  بقال عرفت ذلك فى عروض كلامه أى فى فحوى كلامه ومعناه والعروض الناحية يقسال
  أخذفلان فى عروض ما تعجبنى أى فى طريق وناحية قال التغاي
  لكل أناس من معدّ عمارة • عروض اليها يلجون وجانب
  يقول لكل حتحرز إلا بن تغلب فان حرزهم السيوف وعمارة خفض لانه بدل من أناس
  ومن رواه ع روض بضم العين جعله بمع عرض وهوالجبل والعروض المكان الذى بعارضك
  اذاسرت وة وله-م فلان ركوض بلاعروض أى بلاحاجة عرضت له وعرض الشى بالضم
  ناحبته من أى وجه حنته يق ال تظر اليه بعرض وجهم كما يقال بصفح وجهه ورأيته فى عرض
  الناس أى فيما بيتهم وفلان من عرض الناس أى هو من العامة وفلانة عرضة للزوج وناقة
  عرضة الجارة أى قوية عليه اوناقة عرض أسفار أى قوية على السفروعرض هذا البعير
  (ل-فر والحجر وقال
  أومائة تجعل أولادها * لغواوءرض المانة الجلد
  ويقال فلانهرضة ذاك أوعرضة لذاأى مقرن له قوى عليه والعرضة الهمة وقال حسان
  وقال اللّٰه قد أعددت جندا * هم الانصارعرضتها اللقاء ٢
  وفلان عرضة للناس لايزالون يقعون فيه وجعلت فلاناعرضة لكذا أى نصبته له وقوله
  تعالى ولا تجماوا الله عرضة لا يمانكم أى نصبا وقولهم هوله دونه عرضة اذا سكان
  يتعرض له دونه ولفلان عرضة يصرع بها الناس وهى ضرب من الحيلة فى المصارعة ونظرت
  الله عن عرض وعرض مثل •سروعسرآى من جانب وناحمة وخرجوايضربون الناس عن
  عرض أى عن شق وناحية كيفما اتفق لا يسالون من ضربوا ومنه قواهم اضرب به عرض
  لحائط أى اعترضه حيث وجدت منه أى ناحية. ن نواحيه وقال محمدبن الحنفية كل
  لجن •رضا قال الاصبعى يعنى اعترضه واشستره ممن وجدته ولا تسأل عمن عملدأ من عمل أهل
  الكتاب هو أم من عمل الجوس ويعير عرضيعترض فى سيره لانه لم تتم رياضته بعدوناقة عرضية
  فيها صعوية قال حيد
  يصيحن بالقفرأ تاريات * معترضات غير ع رضيات
  يقول ليس اعتراضهنّ خلقسة وائماهو للنشاط والبغى أبوزيد يقال فلان فيه ع رضية أى
  تجرفية وغخوة وصعوية ويقال للخارجى إنه يستعرض الناس أى يقتاهم ولا يس أل عن مسلم
  ولا غسيره واستعرضت أعلى من أقبل ومن أدبريقال استعرض العرب أى سل من شئت
  •بهم عن كذا وكذا واستعرضته أى قلت له أعرض على ما عندك والعرض بالكسررائحة
  قوله ويقال قال ابن برى والذى
  نسره هذا التضيرروى آخب
  ذلولا فى محل أسير عسيراقال
  وهسكذاروايته فى شعره وذكر
  م دبيتين من الأوّل قبل هذا
  ⁦(١)⁩ عبارم و واليمن داخل
  فيما حولهما اه لكن كلام
  المصنف فى تفسير البيت رعايرده
  قاله نصر
  ٢ رواية م رقديسرت بدل
  قداعددث اه قاله نصير
