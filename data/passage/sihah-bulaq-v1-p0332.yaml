text: |-
  ⁦(ف صل الخاء )⁩
  ٢٠٩
  احار لانه ليس بعلحق ولو كان له فى الرباهى مشال لماجازادغامه كمالا يجوزادعام اقعنسس
  لما كان سلحة اباحرنجم ورجسل أحر والجع الاحامرفان أردت المصبوغ بالهرة قلت أجر
  والبهع-ر والجراء العجم لان الشقرة أغلب الالوان عليه-م والاحامرة قوم من العجم سكنوا
  بالكوفة وضر الحراء بالاضافة يفسر فى مضر وأحلك الرجال الاحسران اللهم والجر فاذا.
  قلت الاحامرة دخل فيه الخلوق وأنشد الاصحعى
  إن الاحامرة الثلاثة أهلكت • مالى وكنت بهنّ قد ما مواعا .
  الراح واللحم السمين وأطلى • بالزعفسران فان أزال مولعا
  قال ويقال أتانى كل أسود منهم وأحر ولا يقال أييض يحكيها عن أبى عمروين العلاء معناه
  جيع النلس عر بهم وعجمهم قال الشاعر
  بحعتم فأوعيتم وجنتم؟عشر • توافت به حران عبدوسودها
  يريد بعبد عبد بن أبى بكر بن كلاب وموت أحر يوصف بالشدة ومنه الحديث كنااذا احرّ
  البأس اتقينا برسول اللّٰه صلى اللّٰه عليه وسلم ووطأة حرا مجديدة ووطأة دهما دارسة وسنة
  حراء أى نديدة وأحر ثموداقب قدار بن سالف عارفاقة صالح عليه السلام واغماقال زهير
  كامرعادلا قامة الوزن لمالم يمكنه أن يقول تمود أووهم فيمقال أبو عبيدوق-دقال بعض
  النساب ان عودا من عادوالجهار العير والجمع حير وحروجرات وأحرة وربما قالو اللانان
  حارة ودوية بن الجرصاحب للى الاخلة وهوفى الاصل تصغر الحار والهمورحار
  الوحس والحهارة حجارة تنصب حول الحوض لثلايسيل ماؤه وتنسب أيضاحول بيت الصائد:
  قال الراجز حيد بن الارقط بيت حتوف أردحت جائره وحارقبان دويية
  والحماران عجران ينصبان ويوضع فوقه-ماحجروهو العلاة يجفف عليها الاقط قال الشاعر
  لاتتفع الشاوى فيهاشاته * ولاحاراه ولاعلانه
  وقولهم أكفر من حارهو رجل من عاد مات له أولاد بصاعقة فكفر كفراعظيما فلاير
  بأرضه أحد الادعاه الى النكفرفان أجايه والاقة-له والحرة ضرب من الطير كالعصفور قال
  قد كنت أحسبكم أسود خفة * فاذ الصاف تبيض فيها الحر
  الواحدة جرة قال الراجز وحراتشر بهن غب • اذاغفلت غفلة تعب
  وقد يخفف فيقال جروخرة وأنشدابن السكيت
  إلا تداركه-م تصبح منازلهم • قفراتبيض على أرجائها الجر
  وابن لسان الحهرة أحد خطياء العرب والحارة أصحات الهيد فى السفر الواحد حار مثل
  جال وبغال والمحمرة فرقة من الخرمية الواحدمنهم محمروهم يخالفون المبيضة وحارة القيظ
  تشديد الراء شدّة حره وربما خفف فى الشعر للضرورة والجمع حارّ وقولهم من دخل ظفار
  حسرأى تسكام بكلام حير فاخرج مخرج الخبر وهو أمر أى فليهمر والمحمر بكسر الميم
  الفرس الهجين وهو بالفنارسية بالانى والجمع الممامر وأحامر بضم الهمزة باد وإحير والجهيرة
  الاشكز وهوسيراً بيض مقشور ظاهره تؤكدبه السروج بقال حرتِ السيرأ حره بالضم اذا
  حوت قشره وقال يعقوب حر الخارز سيره وهو أن يسحى باطنه ويدهنه ثم يخرزبه فيسهل
  ٧٨.
  صماح
  قوله ابن المهيراى بضم الحاء ومتح
  الميم وكسراليا مشددة كما أشاد
  السمبعد اه
