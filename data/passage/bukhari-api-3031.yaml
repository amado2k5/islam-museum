text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِما ـ أَنَّ النَّبِيَّ قَالَ \" مَنْ لِكَعْبِ بْنِ الأَشْرَفِ، فَإِنَّهُ قَدْ آذَى اللَّهَ وَرَسُولَهُ \". قَالَ مُحَمَّدُ بْنُ مَسْلَمَةَ أَتُحِبُّ أَنْ أَقْتُلَهُ يَا رَسُولَ اللَّهِ قَالَ \" نَعَمْ \". قَالَ فَأَتَاهُ فَقَالَ إِنَّ هَذَا ـ يَعْنِي النَّبِيَّ ـ قَدْ عَنَّانَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3031، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3031 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3031، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3031 (La lucha por la causa de Alá (Yihad)), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
