text: "… كونها سبعة الخامس على ايئي يتوجه اختلاف هذه السبعة السادس على كم معنى تشتمل هذه السبعة السابع هل هذه السبعة متفرقه في القرآن الثامن هل المصاحف العثمانية مشتملة عليها التاسع هل القراآت التي بين ايدي الناس اليوم هي السبعة ام …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 31، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 31, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 31 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
