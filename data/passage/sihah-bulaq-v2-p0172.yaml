text: |-
  710
  للتأكيد يلق الفعل المسستقبل بعدلام القسم كقولل واللّه لاضر بن زيداويلدف بعد ذلا
  الامر والنهى تقول اضربن زبداولا تضربن عمراو يلهو فى الاستفهام تقول هل تضر بن زيدا
  وبهد الشرط كولك اماتشر بن زيدااضربه اذازدت على ان مازدت على فعل الشرطنون (
  التأكيد قال اللّٰه تعالى فاما تثقفتهم فى الحرب فشرّ دبهم من خلفهم وتقول فى فعل الاثنين
  اتضربات زيدايارجلان وفى فعل الجماعة بارجال اضربنتزيدايضم الياء ويا امر أقاضربن
  زيدا بكسر الداه ويا نسوة اضر بذات زيدا وأصله اضر بنن بنلاث نونات فتفصل بينهنّ بالالف
  وتكسر المون تشميها بنون التثنية وقد تكون نون التأكيد خفيفة كمانكون مشددة الا
  أن الخفيفة اذا استقبلها سا كن سقطت واذا وقفت عليها وقبلها قتحة أبدلتها ألفا كاقال
  الاعنى• ولا تعبد الشطان واللّه فاعبدا. وربعاحذفت فى الوصل كقول الشاعر
  اضرب عنك الهموم طارقها • ضريك بالسيف قونس الفرص
  والمخفقة تصلح فى. كان المشددة الافى موضعيز فى فعل الاثنيز يارحلان اضربات زيد اوفى فعل
  جاعة المؤنت يانوة اضرينانَ زيدافانه لا يصلح فيهما الا المشدة لثلا تلتبس بنون التثفية
  ويونس يجيزاتلحفيفة ههنا أيضا والاول أجود وتقول نوّنت الاسم تنويذا والتنوين لا يكون
  الافى الاسماء
  صل الوا تن) الوتين عرق فى القلب اذا انقطع مات ماحبه وقد وتفته
  اذا أصيت وتينه قال حيد الارقطء من على المكلى والمولون• والواتن الشئ الدائم الثابت
  فى مكانه قال رؤية• على أخلاه الصفاء الوتن « ويروى بالناء وهما بعني يقال وتن الماء وغيره
  ونوناوتنسة أى دام ولم ينقطع والواتن الماء المعين الدائم الذى لا يذهب عن أبى زيد والمواتنة
  الملازمة فى قلة التفرّق ( وثن الوثن الصم والجمع وثن وأوثان مثل أسد وأسدوآساد
  الاصمعىّ استوتن الرجل من المال اذا استكثر منه مثل استوتج واستوثر والواثن مثل الواتن
  وه والثابت الدائم ⁦( وجن)⁩ الوجين العارض من الارض ينقادوير تفع قليلا وهو غليظ
  ومفه الوجناء وهى الناقة الشديدة شيهت به فى صلابتها وقال قوم هى العظيمة الوجنتين
  والوجين شط الوادى والوجنة ماارتفع من الحدّين وفيها أربع لغات وجنة ووجنَّة وأجنة
  ووجنة ورجسل موجن عظيم الوجنات ويقسال ما أدرى أى من وجن الجلد هو أى أى
  الناس هو والوجن الدق ويقال وجن القصار الثوب يجنه وجنادقه أبوزيد الميجنة المدقة
  والهعمواجن وأنتدلعامر بن عقبل السعدى جاهلى
  رقاب كالمواجن خاظيات ل، وأستاه على الاكمواركوم
  قوله خاظيات بالظاء من قواهسم ختطابظا (لدن% ودنت الشى ودناوودانابقلته فهو
  مودون وودين أى منقوع وجاء قوم الى بنت الخس محجر فقالوا احذى لنامن هذائعلا
  فقالت دنوه واتدن الشى أى ابتل واتدته أيضابحنى بله قال الكميت
  وراج اين تغاب عن نظاف * كمقدن الصفا كيمايلينا
  والودن أيضاحسن الق.ام على العروس بقال أخذوا فى وداته وودنت المرأة وأودنت اذا
  وادت ولداضا ويا والولده ودون ومودن أيضا قال
