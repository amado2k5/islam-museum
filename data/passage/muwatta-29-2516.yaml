label: { ar: "الموطأ 2516 — يحيى: بلغ مالكا أن سعيد وسليمان بن يسار قالا في موضحة العبد نصف عشر ثمنه", en: "Muwatta 2516", es: "Muwatta 2516", fr: "Muwatta 2516", ur: "موطا 2516", tr: "El-Muvatta 2516 — Yahya: Malik'e, Said ve Süleyman bin Yaşar'ın bir kölenin zararı konusunda şöyle dediği rivayet edilmiştir: fiyatının onda birinin yarısı.", id: "Al-Muwatta 2516 — Yahya: Diriwayatkan kepada Malik bahwa Saeed dan Sulaiman bin Yasar berkata mengenai luka seorang budak: setengah dari sepersepuluh dari harganya" }
summary:
  ar: "حدث يحيى عن مالك أنه بلغه أن سعيد بن المسيب وسليمان بن يسار كانا يقولان: في موضحة العبد نصف عشر ثمنه. {cite:muwatta-maruf-1997 p.433}"
  tr: "Yahya, Malik'ten rivayetle, Sa'id ibn al-Musayyab ve Sulayman ibn Yasar'ın şöyle dediklerini işittiğini bildirmiştir: \"Bir kölenin kemiğini açığa çıkaran bir yara için tazminat, fiyatının onda birinin yarısıdır.\" {cite:muwatta-maruf-1997 s.433}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Sa'id ibn al-Musayyab dan Sulayman ibn Yasar biasa berkata: \"Untuk luka yang memperlihatkan tulang seorang budak, ganti ruginya adalah setengah dari sepersepuluh harga budak tersebut.\" {cite:muwatta-maruf-1997 p.433}"
