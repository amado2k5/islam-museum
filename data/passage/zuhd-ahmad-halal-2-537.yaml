text: "… الأَهِلَّةِ؛ فَأْوِي بها المياني ٪. - حدَّثنا عبدُ الله، قال: حدَّثني الحسنُ بنُ عبدِ العزيزِ، قال: أَبَنا عبدُ اللّٰه بنُ يُوسفَ، قال: قال أَبو عبدِ الرَّحمنِ الحُبُلَيُّ. ما عَلِمتُ أَنَّ اللهَ حرَّمَ الخمرَ حتَّى وَلِيَ عمرُ بنُ عبدِ العزيزِ. قال …"
