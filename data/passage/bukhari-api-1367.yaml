label: { ar: "صحيح البخاري 1367 — رثاء وثناء على ميت", en: "Sahih al-Bukhari 1367 — an elegy or praise of the dead", ur: "صحیح البخاری 1367 — مرثیہ یا میت کی تعریف", fr: "Sahih al-Bukhari 1367 — une élégie ou un éloge du défunt", es: "Sahih al-Bukhari 1367 — una elegía o elogio del difunto" }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ صُهَيْبٍ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ ـ يَقُولُ مَرُّوا بِجَنَازَةٍ فَأَثْنَوْا عَلَيْهَا خَيْرًا، فَقَالَ النَّبِيُّ \" وَجَبَتْ \". ثُمَّ مَرُّوا بِأُخْرَى فَأَثْنَوْا عَلَيْهَا شَرًّا فَقَالَ \" وَجَبَتْ \". فَقَالَ عُمَرُ بْنُ الْخَطَّابِ ـ مَا وَجَبَتْ قَالَ \" هَذَا أَثْنَيْتُمْ عَلَيْهِ خَيْرًا فَوَجَبَتْ لَهُ الْجَنَّةُ، وَهَذَا أَثْنَيْتُمْ عَلَيْهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1367، فيه رثاء وثناء على ميت. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1367 (Funerals (Al-Janaa'iz)), that carries an elegy or praise of the dead. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 1367، جس میں مرثیہ یا میت کی تعریف ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 1367, qui contient une élégie ou un éloge du défunt. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 1367, que contiene una elegía o elogio del difunto. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
