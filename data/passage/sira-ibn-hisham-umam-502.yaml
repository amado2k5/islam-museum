text: "… لا يتوضَّأَ إلا ابتدرُوا وَضُوءَهُ، ولا يَبْصُقُ بِصَاقاً إلا ابتدروه، ولا يَسْقُطُ مِنْ شَعْرِهِ شيء إلا أخذوه، فرجع إلى قريش فقال: يا مَعْشَرَ قُرَيْشِ، إني قد جِنْتُ كِسْرَىٰ في مُلْكِهِ، وقَيْصَرَ فِي مُلْكِهِ، والنجاشيّ في مُلْكِهِ، وإني واللهِ ما رَأَيْتُ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 502، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Hisham's Sira, p. 502, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "سیرت ابن ہشام، ص 502 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de la Sira de Ibn Hisham, pág. 502, con menciones de naciones, religiones y pueblos no musulmanes; tomado del escaneo automático, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de la Sira d'Ibn Hisham, p. 502, mentionnant des nations, des religions et des peuples non musulmans; issu d'une numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur Umam."
  tr: "İbn Hişam'ın Peygamber biyografisinden, sayfa 502'den, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari biografi Nabi karya Ibnu Hisham, halaman 502, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
