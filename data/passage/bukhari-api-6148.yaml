text: "… شَاحِبًا. فَقَالَ لِي \" مَا لَكَ \". فَقُلْتُ فِدًى لَكَ أَبِي وَأُمِّي زَعَمُوا أَنَّ عَامِرًا حَبِطَ عَمَلُهُ. قَالَ \" مَنْ قَالَهُ \". قُلْتُ قَالَهُ فُلاَنٌ وَفُلاَنٌ وَفُلاَنٌ وَأُسَيْدُ بْنُ الْحُضَيْرِ الأَنْصَارِيُّ. فَقَالَ رَسُولُ اللَّهِ \" كَذَبَ مَنْ قَالَهُ، إِنَّ لَهُ لأَجْرَيْنِ ـ وَجَمَعَ بَيْنَ إِصْبَعَيْهِ ـ إِنَّهُ لَجَاهِدٌ مُجَاهِدٌ، قَلَّ عَرَبِيٌّ نَشَأَ بِهَا مِثْلَهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6148، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6148 (Good Manners and Form (Al-Adab)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6148، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6148 (Buenas costumbres y modales (Al-Adab)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 6148 (Les bonnes manières et la bienséance), mentionne le rôle du père dans l'éducation et les conseils. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'de 6148 numaralı hadis, babanın yetiştirilmesi ve öğütlerinden bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6148, menyebutkan tentang didikan dan nasihat seorang ayah. Situs web \"Kebapakan dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
