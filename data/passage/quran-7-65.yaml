text: "۞ وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا ۗ قَالَ يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ مَا لَكُم مِّنْ إِلَـٰهٍ غَيْرُهُۥٓ ۚ أَفَلَا تَتَّقُونَ"
text_search: "۞ وإلى عاد أخاهم هودا ۗ قال يا قوم اعبدوا الله ما لكم من إله غيره ۚ أفلا تتقون"
translations:
  en: { text: "And unto (the tribe of) A'ad (We sent) their brother, Hud. He said: O my people! Serve Allah. Ye have no other Allah save Him. Will ye not ward off (evil)?", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور (اسی طرح) قوم عاد کی طرف ان کے بھائی ہود کو بھیجا۔ انہوں نے کہا کہ بھائیو خدا ہی کی عبادت کرو۔ اس کے سوا تمہارا کوئی معبود نہیں۔ کیا تم ڈرتے نہیں؟", translator: "Fateh Muhammad Jalandhari", license: PD }
