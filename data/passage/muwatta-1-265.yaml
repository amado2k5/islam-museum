label: { ar: "الموطأ 265 — القاسم بن محمد لمن يكثر وهمه: امض في صلاتك", en: "Muwatta 265" }
text: "امض في صلاتك، فإنه لن يذهب عنك حتى تنصرف وأنت تقول: ما أتممت صلاتي"
summary:
  ar: "بلاغ في باب العمل في السهو: يروي مالك أنه بلغه أن رجلاً سأل القاسم بن محمد فقال إنه يهم في صلاته ويكثر ذلك عليه، فأمره القاسم أن يمضي في صلاته، فإن الوسواس لن يذهب عنه حتى ينصرف وهو يقول إنه ما أتم صلاته. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.156}"
