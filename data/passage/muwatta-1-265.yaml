label: { ar: "الموطأ 265 — القاسم بن محمد لمن يكثر وهمه: امض في صلاتك", en: "Muwatta 265", es: "Muwatta 265", fr: "Muwatta 265", ur: "موطا 265", tr: "El-Muvatta 265 — El-Kasım ibn Muhammed, çok fazla kaygıya meyilli olana: Namazına devam et", id: "Al-Muwatta 265 — Al-Qasim bin Muhammad, kepada orang yang sering diliputi banyak kekhawatiran: Lanjutkanlah salatmu" }
text: "امض في صلاتك، فإنه لن يذهب عنك حتى تنصرف وأنت تقول: ما أتممت صلاتي"
summary:
  ar: "بلاغ في باب العمل في السهو: يروي مالك أنه بلغه أن رجلاً سأل القاسم بن محمد فقال إنه يهم في صلاته ويكثر ذلك عليه، فأمره القاسم أن يمضي في صلاته، فإن الوسواس لن يذهب عنه حتى ينصرف وهو يقول إنه ما أتم صلاته. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.156}"
  tr: "Unutkanlık durumunda nasıl davranılması gerektiğine dair bir rivayet: Malik, bir adamın el-Kâsım ibn Muhammed'e namaz sırasında sık sık hata yaptığını söylediğini işittiğini aktarır. El-Kâsım ona namazına devam etmesini, çünkü rahatsız edici düşüncelerin namazını bitirmeden onu terk etmeyeceğini, namazını tamamlamadığını söyleyerek öğüt vermiştir. Araştırmacı, bu rivayetin Ebu Mus'ab tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.156}"
  id: "Sebuah laporan mengenai cara yang tepat untuk bertindak ketika seseorang pelupa: Malik meriwayatkan bahwa ia mendengar seorang pria bertanya kepada al-Qasim bin Muhammad, mengatakan bahwa ia sering membuat kesalahan selama salatnya. Al-Qasim menyuruhnya untuk melanjutkan salatnya, karena pikiran-pikiran yang mengganggu tidak akan meninggalkannya sampai ia selesai, dengan mengatakan bahwa ia belum menyelesaikan salatnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.156}"
