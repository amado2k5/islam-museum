text: "… قد كان على أَِّى نَسَمَةً فأَنت حُسرُّ عنها، وجزّ ناصيتَه. وقدم المدينة فأَّخبر رسول اللّٰه بقتل من قُتل من أصحابه ببئر معونة، فقال رسول اللّٰه، صلّعم : أَنت من بينهم يعى أَقلَتَ ولم تُقْتَلْ كما قُتلوا. ولمما دنا عمنرو من …"
summary:
  ar: "مقطع من الطبقات الكبرى لابن سعد، المجلد المصوَّر 5، ص 29، يرد فيه ذكر اللمم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sa'd's al-Tabaqat al-Kubra, scan volume 5, p. 29, whose wording mentions the lamam (small faults); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
