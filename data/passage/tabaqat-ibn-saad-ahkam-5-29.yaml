  tr: "İbn Sa'd'ın *El-Tabakat el-Kübra* adlı eserinin 5. cildinin 29. sayfasından bir alıntı, küçük günahlardan bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar üzerine araştırmalar yapan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Sa'd *Al-Tabaqat al-Kubra*, Jilid 5, halaman 29, menyebutkan dosa-dosa kecil; ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Kitab ini disusun oleh seorang peneliti tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
