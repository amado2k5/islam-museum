label: { ar: "الموطأ 220 — الفرافصة: ما أخذت سورة يوسف إلا من قراءة عثمان في الصبح", en: "Muwatta 220", es: "220 Muwatta", fr: "220 Muwatta", ur: "220 موطا", tr: "Al-Muwatta 220 — Al-Farafisa: Ben Yusuf Suresi'ni ancak Osman'ın sabah namazındaki tilavetinden öğrendim.", id: "Al-Muwatta 220 — Al-Farafisa: Aku hanya mempelajari Surat Yusuf dari bacaan Utsman dalam shalat subuh." }
text: "ما أخذت سورة يوسف إلا من قراءة عثمان بن عفان إياها في الصبح، من كثرة ما كان يرددها لنا"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد وربيعة بن أبي عبد الرحمن عن القاسم بن محمد، في باب القراءة في الصبح: قال الفرافصة بن عمير الحنفي إنه ما حفظ سورة يوسف إلا من قراءة عثمان بن عفان إياها في صلاة الصبح من كثرة ما كان يرددها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي والشافعي ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.133}"
  tr: "Malik'in Yahya ibn Sa'id'den ve Rabi'ah ibn Abi 'Abd al-Rahman'ın da el-Kâsim ibn Muhammed'den rivayet ettiği, sabah namazındaki okuma bölümünde yer alan bir rivayete göre: El-Ferafisah ibn 'Umayr el-Hanafi, Yusuf Suresi'ni ancak Osman ibn 'Affan'ın sabah namazında çok sık okumasından dolayı ezberlediğini söylemiştir. Editör, bu rivayetin Malik'ten Ebu Mus'ab ve İbn Vahb tarafından, el-Tahavi ve el-Şafii'ye göre Ebu Mus'ab ve İbn Vahb tarafından, el-Beyhaki'ye göre ise Yahya ibn Bukayr tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.133}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id dan Rabi'ah ibn Abi 'Abd al-Rahman atas otoritas al-Qasim ibn Muhammad, dalam bab tentang bacaan dalam salat subuh: Al-Farafisah ibn 'Umayr al-Hanafi berkata bahwa ia hanya menghafal Surah Yusuf dari bacaan 'Uthman ibn 'Affan dalam salat subuh, karena seringnya beliau mengulanginya. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab dan Ibn Wahb, menurut al-Tahawi dan al-Shafi'i, dan oleh Yahya ibn Bukayr, menurut al-Bayhaqi. {cite:muwatta-maruf-1997 p.133}"
