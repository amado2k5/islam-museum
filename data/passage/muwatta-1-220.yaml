label: { ar: "الموطأ 220 — الفرافصة: ما أخذت سورة يوسف إلا من قراءة عثمان في الصبح", en: "Muwatta 220" }
text: "ما أخذت سورة يوسف إلا من قراءة عثمان بن عفان إياها في الصبح، من كثرة ما كان يرددها لنا"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد وربيعة بن أبي عبد الرحمن عن القاسم بن محمد، في باب القراءة في الصبح: قال الفرافصة بن عمير الحنفي إنه ما حفظ سورة يوسف إلا من قراءة عثمان بن عفان إياها في صلاة الصبح من كثرة ما كان يرددها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي والشافعي ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.133}"
