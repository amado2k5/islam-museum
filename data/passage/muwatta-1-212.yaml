label: { ar: "الموطأ 212 — علي: نهى عن لبس القسي وتختم الذهب وقراءة القرآن في الركوع", en: "Muwatta 212" }
text: "نهى عن لبس القسي، وعن تختم الذهب، وعن قراءة القرآن في الركوع"
summary:
  ar: "أول حديث في باب العمل في القراءة. يرويه يحيى عن مالك عن نافع عن إبراهيم بن عبد الله بن حنين عن أبيه عن علي بن أبي طالب: نهى النبي عن لبس القسي، وهي ثياب من مصر فيها حرير، وعن التختم بالذهب، وعن قراءة القرآن في الركوع. ويخرّجه المحقق عند مسلم (2/49) وأبي داود (4044) والترمذي (264، 1725) والنسائي (2/189) وابن حبان وأحمد (1/126) من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه اختُلف في إسناده ولفظه على نافع وعلى إبراهيم بن عبد الله بن حنين اختلافاً كثيراً، وأن الدارقطني تناوله في العلل، وأن ذلك لا يقدح في صحة النص الذي ساقه مالك، إذ قال ابن عبد البر: والحديث صحيح كما رواه مالك ومن تابعه (التمهيد 16/112). {cite:muwatta-maruf-1997 p.130} {cite:muwatta-maruf-1997 p.131}"
