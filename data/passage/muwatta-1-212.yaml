label: { ar: "الموطأ 212 — علي: نهى عن لبس القسي وتختم الذهب وقراءة القرآن في الركوع", en: "Muwatta 212", es: "Muwatta 212", fr: "Muwatta 212", ur: "موطا 212", tr: "Al-Muwatta 212 — Ali: İpek giymeyi, altın yüzük takmayı ve secde ederek Kur'an okumayı yasakladı.", id: "Al-Muwatta 212 — Ali: Dia melarang mengenakan sutra, mengenakan cincin emas, dan membaca Al-Quran sambil rukuk." }
text: "نهى عن لبس القسي، وعن تختم الذهب، وعن قراءة القرآن في الركوع"
summary:
  ar: "أول حديث في باب العمل في القراءة. يرويه يحيى عن مالك عن نافع عن إبراهيم بن عبد الله بن حنين عن أبيه عن علي بن أبي طالب: نهى النبي عن لبس القسي، وهي ثياب من مصر فيها حرير، وعن التختم بالذهب، وعن قراءة القرآن في الركوع. ويخرّجه المحقق عند مسلم (2/49) وأبي داود (4044) والترمذي ⁦(264، 1725)⁩ والنسائي (2/189) وابن حبان وأحمد (1/126) من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه اختُلف في إسناده ولفظه على نافع وعلى إبراهيم بن عبد الله بن حنين اختلافاً كثيراً، وأن الدارقطني تناوله في العلل، وأن ذلك لا يقدح في صحة النص الذي ساقه مالك، إذ قال ابن عبد البر: والحديث صحيح كما رواه مالك ومن تابعه ⁦(التمهيد 16/112)⁩. {cite:muwatta-maruf-1997 p.130} {cite:muwatta-maruf-1997 p.131}"
  tr: "Kur'an okuma sırasındaki ameller bölümündeki ilk hadis. Yahya tarafından Malik'ten, o da Nafi'den, o da İbrahim ibn Abdullah ibn Huneyn'den, o da babasından, o da Ali ibn Abi Talib'den rivayet edilmiştir: Peygamberimiz ipek elbiseler (Mısır'dan gelen ipek içeren elbiseler) giymeyi, altın yüzük takmayı ve rükûda Kur'an okumayı yasaklamıştır. Araştırmacı, bu hadisi Malik'in sahabelerinin rivayet zincirleriyle Müslim (2/49), Ebu Davud (4044), Tirmizi (264, 1725), Nesai (2/189), İbn Hibban ve Ahmed'de (1/126) yer almaktadır. İbn Abdülberr'in, Nafi' ve İbrahim ibn Abdullah ibn Huneyn'den rivayet edilen hadisin isnadı ve lafzı konusunda çok fazla ihtilaf olduğunu ve Darakutni'nin de kusurlar üzerine yazdığı kitabında bu hadisi ele aldığını söylediğini aktarmaktadır. Ancak bu, Malik'in rivayet ettiği metnin sahihliğinden hiçbir şey eksiltmez; İbn Abdül-Barr şöyle demiştir: \"Hadis, Malik ve onu izleyenler tarafından rivayet edildiği gibi sahihtir\" (el-Tamhid 16/112). {cite:muwatta-maruf-1997 s.130} {cite:muwatta-maruf-1997 s.131}"
  id: "Hadits pertama dalam bab tentang amalan saat membaca Al-Quran. Diriwayatkan oleh Yahya dari Malik, dari Nafi’, dari Ibrahim ibn Abdullah ibn Hunayn, dari ayahnya, dari Ali ibn Abi Talib: Nabi melarang mengenakan pakaian sutra (yaitu pakaian dari Mesir yang mengandung sutra), mengenakan cincin emas, dan membaca Al-Quran sambil rukuk. Peneliti memasukkannya dalam Muslim (2/49), Abu Dawud (4044), al-Tirmidhi (264, 1725), al-Nasa’i (2/189), Ibn Hibban, dan Ahmad (1/126) melalui sanad para sahabat Malik. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa terdapat banyak perbedaan pendapat mengenai sanad dan redaksi hadits ini dari Nafi’ dan Ibrahim ibn Abdullah ibn Hunayn, dan bahwa al-Daraqutni membahasnya dalam bukunya tentang kekurangan. Namun, hal ini tidak mengurangi keaslian teks yang diriwayatkan oleh Malik, sebagaimana dikatakan oleh Ibnu Abd al-Barr: “Hadits ini sahih sebagaimana diriwayatkan oleh Malik dan para pengikutnya” (al-Tamhid 16/112). {cite:muwatta-maruf-1997 p.130} {cite:muwatta-maruf-1997 p.131}"
