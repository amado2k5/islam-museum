label: { ar: "صحيح مسلم 4942 — الأب والأبوة", en: "Sahih Muslim 4942 — the father and fatherhood", ur: "صحیح مسلم 4942 — باپ اور والدیت", es: "Sahih Muslim 4942 — El padre y la paternidad", fr: "Sahih Muslim 4942 — Le père et la paternité" }
text: "حَدَّثَنِي عَبْدُ الْحَمِيدِ بْنُ بَيَانٍ الْوَاسِطِيُّ، حَدَّثَنَا خَالِدٌ، عَنْ سُهَيْلٍ، بِهَذَا الإِسْنَادِ. مِثْلَهُ غَيْرَ أَنَّ فِي حَدِيثِهِ قَالَ سُهَيْلٌ قَالَ عُبَيْدُ اللَّهِ بْنُ مِقْسَمٍ أَشْهَدُ عَلَى أَبِيكَ أَنَّهُ زَادَ فِي هَذَا الْحَدِيثِ \" وَمَنْ غَرِقَ فَهُوَ شَهِيدٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4942، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4942 (The Book on Government), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4942، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 4942 (El Libro del Gobierno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 4942 (Le Livre du gouvernement), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
