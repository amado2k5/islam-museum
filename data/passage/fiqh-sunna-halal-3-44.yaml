text: "… يحرم الأكل والشرب في أواني الذهب والفضة لا فرق في ذلك بين الرجال والنساء. وإنما يحل للنساء التحلي بها تزينا وتجملاً كما تقدم. وليس الأكل والشرب من هذه الأواني مما أحله اللّٰه لهن. دليل ذلك الأحاديث الأتية : - عن …"
