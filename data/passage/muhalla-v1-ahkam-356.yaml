text: "… فِي لَعِبِ الصِّبيَةِ لم تَبلُغْ فَذلكَ جائِزٌ وحَسَنٌ. واسْتُحِبَّ الخاتَمُ منَ الفِضَّةِ، ولا يَحِلُّ التَّخَتُّمُ إلا فِي الخِنصرينِ أو الخِنصَرِ فَقَط، ولا فيما عَداها منَ الأصابعِ، ولا يَحِلُّ المَشيُ فِي خُفِّ واحِدٍ، ولا في نَعْلٍ واحِدَةٍ. والاسْتلقَاءُ في المَسجِدِ مُباحٌ، …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 356، يرد فيه ذكر المستحب، والمباح، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 356, whose wording mentions the recommended (mustahabb), the permitted (mubah), what is not lawful; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 356 کا اقتباس جس میں مستحب، مباح، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 356, dont le texte mentionne le recommandé (mustahabb), le permis (mubah), ce qui n'est pas licite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 356, cuyo texto menciona lo recomendado (mustahabb), lo permitido (mubah), lo que no es lícito; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 356. sayfasından, tavsiye edilen, caiz olan ve haram olan şeyleri ele alan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 356, yang membahas tentang amalan yang dianjurkan, diperbolehkan, dan tidak diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
