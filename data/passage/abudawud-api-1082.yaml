label: { ar: "سنن أبي داود 1082 — أثر من الآثار المحفوظة", en: "Sunan Abi Dawud 1082 — a relic kept after its owner", ur: "سنن ابی داؤد 1082 — محفوظ آثار و تبرکات", es: "Sunan Abi Dawud 1082 — una reliquia conservada después de su dueño." }
text: "حَدَّثَنَا مَخْلَدُ بْنُ خَالِدٍ، حَدَّثَنَا أَبُو عَاصِمٍ، عَنْ يَزِيدَ بْنِ أَبِي عُبَيْدٍ، عَنْ سَلَمَةَ بْنِ الأَكْوَعِ، قَالَ كَانَ بَيْنَ مِنْبَرِ رَسُولِ اللَّهِ وَبَيْنَ الْحَائِطِ كَقَدْرِ مَمَرِّ الشَّاةِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1082، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1082 (Prayer (Kitab Al-Salat)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 1082، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1082 (Oración (Kitab Al-Salat)), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
