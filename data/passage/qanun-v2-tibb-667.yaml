text: "… أفواه البواسير، وعقيب معالجات البواسير بالقطع، والأدوية الحادة. وإذا كانت الأورام تجمع، وتصير خراجات، خيف عليها أن تصير نواصير. فلهذا أمر يبطّها قبل النضج، ويجب أن يستعمل الفصد في أوائل هذه الأورام، وربما سكن الوجع وحده، ويستعمل عليها مرهم أسفيذاج، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 667، يذكر الوجع، وأسماء الأمراض، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 667, that mentions pain, named diseases, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
