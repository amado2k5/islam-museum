text: "… أفواه البواسير، وعقيب معالجات البواسير بالقطع، والأدوية الحادة. وإذا كانت الأورام تجمع، وتصير خراجات، خيف عليها أن تصير نواصير. فلهذا أمر يبطّها قبل النضج، ويجب أن يستعمل الفصد في أوائل هذه الأورام، وربما سكن الوجع وحده، ويستعمل عليها مرهم أسفيذاج، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 667، يذكر الوجع، وأسماء الأمراض، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 667, that mentions pain, named diseases, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 667 کا اقتباس جس میں درد، بیماریوں کے نام، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 667, que menciona el dolor, enfermedades específicas, cirugía, circuncisión y férulas, el medicamento, los medicamentos y la farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 667, qui mentionne la douleur, les maladies nommées, la chirurgie, la circoncision et les attelles, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, s. 667'sinden bir bölüm; ağrı, hastalık isimleri, ameliyat, sünnet, atel, ilaç, uyuşturucu ve eczaneden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 667, yang menyebutkan rasa sakit, nama-nama penyakit, pembedahan, sunat, bidai, obat-obatan, narkoba, dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
