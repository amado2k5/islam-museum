label: { ar: "صحيح البخاري 5780 — ألبان الإبل وأبوالها، التداوي", en: "Sahih al-Bukhari 5780 — camel milk and urine as treatment; seeking treatment", ur: "صحیح بخاری 5780 — اونٹنی کا دودھ اور پیشاب، علاج کرانا", es: "Sahih al-Bukhari 5780 — Leche y orina de camello como tratamiento; búsqueda de tratamiento", fr: "Sahih al-Bukhari 5780 — lait et urine de chamelle comme traitement; recherche de soins", tr: "Sahih el-Buhari 5780 — Deve sütü ve idrarı, tıbbi kullanımları", id: "Sahih al-Bukhari 5780 — Susu dan air kencing unta, kegunaan pengobatan" }
text: "… يُونُسُ، عَنِ ابْنِ شِهَابٍ، قَالَ وَسَأَلْتُهُ هَلْ نَتَوَضَّأُ أَوْ نَشْرَبُ أَلْبَانَ الأُتُنِ أَوْ مَرَارَةَ السَّبُعِ أَوْ أَبْوَالَ الإِبِلِ. قَالَ قَدْ كَانَ الْمُسْلِمُونَ يَتَدَاوَوْنَ بِهَا، فَلاَ يَرَوْنَ بِذَلِكَ بَأْسًا، فَأَمَّا أَلْبَانُ الأُتُنِ فَقَدْ بَلَغَنَا أَنَّ رَسُولَ اللَّهِ نَهَى عَنْ لُحُومِهَا، وَلَمْ يَبْلُغْنَا عَنْ أَلْبَانِهَا أَمْرٌ وَلاَ نَهْىٌ، وَأَمَّا مَرَارَةُ السَّبُعِ قَالَ ابْنُ شِهَابٍ أَخْبَرَنِي أَبُو إِدْرِيسَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5780، يذكر ألبان الإبل وأبوالها، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5780, that mentions camel milk and urine as treatment, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5780، جس میں اونٹنی کا دودھ اور پیشاب، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5780, menciona la leche y la orina de camella como tratamiento, en busca de tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari (n° 5780) mentionne l'utilisation du lait et de l'urine de chamelle comme remèdes, et incite à rechercher un traitement. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5780 numaralı hadis, deve sütü ve idrarından ve bunların tıbbi kullanımlarından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5780, menyebutkan susu dan air kencing unta serta kegunaannya sebagai obat. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
