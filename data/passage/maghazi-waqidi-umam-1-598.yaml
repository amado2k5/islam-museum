text: "… ما قال لبُدَيل بن وَرقاء وأَصحابِه وكما عرض عليهم من المدّة، ركب عُروةُ بن مسعود حتى أَتى قُرَيشاً فقال : يا قوم، إنى قد وفدت. على الملوك، على كِسرى وهِرَقْل والنَّجاشىّ، وإِنى واللهِ ما رأَيتُ ملِكاً قَطُّ. أَطوعَ فيمن هو …"
