text: |-
  ٢٣٤
  ⁦(شعشر)⁩
  ويروى وعلا الخيل وشقرة أيضاقبيلة من بى ضبة فاذانسيت اليهم قحت القاف قلت شقرى
  والاشاقرحى من اليمن والمدة ربفتح القاف مشتدة حصن بالصرين قديم قال لسديدف
  بنات الدهو وأنزلن بالرومى من رأس -صنه * وأنزلن بالاسباب رب المشر
  والشقور الحاجة يقال أخبرته يشة ورى كمايمال أفضيت اليه يعجرى وبجرى وكان الاصمعى
  بقوله بفنح الشين وقال آبو عبيد الأول أصبح لان الشقور بالضم يمعنى الامور اللاصقة بالقلب
  المهملد الواحد شقر والشقور بالفتم:عن النعت وأنشد للعجاج
  جارى لاتتنكرى عذيرى • سيرى واشفاقى على بعيرى
  وكثرة الحديث عن شورى • مسع الجلاولاعح القشير
  والشقارى بالضم وتشديد القاف نبت كر) الشكر الثناءعلى المحسن عاأولا كدمن
  المعروف بقال شكرته وشكرت لهوياللام أقصح وقوله تعالى لازيدفنكم جزاء ولاشمك ورا
  يحتمل أن يكون مصدرامثل قعد قعوداويحتمل أن يكون بعامثسل بردو برود وكفروكفور
  والشكوان خلاف الكفران وتشكرت له مقل شكرت له والشكور من الدواب ما يكفيه
  العلف القليل وشكر المرأة فرجها قال الهذلى
  صناع باشفاها حصان يشكرها • جواديقوت البطن والعرق زاجر
  واشتكرت السماء اشتدوقعها قال امر والقيس يصف مطرا
  تظهر الود إذاما أشجذت * وتواريه اذا ماتشتكر
  ويروى تمتكر واشتكر الضرح امتلالينا تقول منه شكرت الناقة بالكسر تشكر
  شكرافهى شكرة قال الحطيقة
  اذا لم تسكن الا الاماليس أصيحت • لهاحلق ضرّاتها شكرات.
  وأشكر القوم أى يحلبون شكرة وهذاز من الشكوة اذاحفلت من انربيع وهي ابل
  شكارى وغنم شكارى وضرّة شكرى اذا كانت ملاى من الليي وشكرت الشهيرة أيضا
  تشكر شكرا أى خرج منها الشكيروه وما يثبت حول الشهجرة من أصلها، قال الشاءر
  ومن عضة ما ينبتن شكيرها وربما قالو اللشعر الضعيف شكير قال دابن مقبل
  ذعرت به العير مستوذيا • شكير بجافله قد كتن
  والشيكران ضرب من النيت مر الشمر الاختيال فى المشى يقال مرفلان يشمر شمرا
  وشرازاره تشهير ارفعه يقال شمر عن ساقه وشمر فى أمره أى خف ورجل شمرى كأنه
  منسوب اليه وقد تكسر منه الشين وينشد قد شمرت عن ساق شمرى والشمرية
  الناقة السريعة وانشمر للامرأى تهيأله وتشمر مثله وإنشمر الغرس أسرع قال الاصمعى
  التشمير الارسال من قولهم شمرت السفينة أرسلتها وشمرت السهم أرسلته قال الشماخ
  يذكرامر انزل يد أرقت له فى القوم والصبح ساطع • كماسطع المزيخ شمره الغالى
  وناقة شهير مثال فسيق أى سريعة وشاقشاهر اذا انضم ضرعها الى بطنها وشر تشمر أى شديد
  {شمخر) المشمخر الجبل العالى قال الهذلى
  تالله ييق على الايام ذوحيد • بمشمفربه الظيان والآس
