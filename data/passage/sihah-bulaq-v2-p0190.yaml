text: |-
  ٣٩٧
  اذارآنى واحدا أوفى عين • يعرفى أطرق اطراق الطحن
  ورجل أعين واسع العين بين العين وابمع عين وأصله فعل بالضم ومنه قيسل لبة رالوحشْ عين
  والثور أعين والبقرة عيناه والعينة بالسر السلف واعتان الرجل اذا اشترى الذى بنسيئة
  وعينة الممال أيضاخياره مثل العيمة وهذا ئوب عينة اذا كان حسسنا فى حرآة العين واعتان
  فلان الشى اذا أخذعينه وخياره واعتان لنافلان أى صارعينا أى ربيئة ووبما قالواعان
  علينا فلان يعين عيانة أى صاراه م عينا ويقال اذهب فأعتز لى منزلا أى ارتده
  صل الفين ين الفين بالتسكين فى البيع والغين بالتحريك فى الرأى يقال
  غبنته فى البيع بالفتح أى خدعته وقد غبن فه ومغبون وغبن رأيه بالكسر اذا نقصه فه وغبين
  أى ضعيف الرأى وفيه غبانة وقدذ كرنا اعرابه فى سفه يسفه والغيينة. ن الغين كالشتمة من
  الستم والتغابن أن يغين القوم بعضهم بعضاومنه قيل يوم التغابن ليوم القيامة لاتَ أهل
  الجنة يغبتون أهل الفار والمغابن الارفاغ وغبنت الثوب والطعام مثل خبذت وقسد ذكر
  ⁦(غدن)⁩ اغدودن الشعراذاطال وتم قال حسان
  وقامت تراتيك مغدودنا • اذا ماتنوبه آدها
  واغدودن النبت اذا اخضرّ حتى يضرب الى السواد من شذريه والشباب الغدانى
  الغض قال رؤبة • بعد غدانى الشباب الابله• والغدن الاسترخاء والفترة قال القلاخ
  ولم تضع أولادها من البعان • ولم تصبه نعسة على غدن
  وغدانة حٱمن يربوع قال الاخطل
  واذكر غدانة عدانامزغة * من الحبلق تبنى حولها الصيع
  رين . الغرين مثال الدرهم الطين الذى يحمله السسيل فيبق على وجه الارض رطبا
  أويابساوكذلك الغريل وهومبدل منه والغرن الذكر من العقبان سن) الغسن
  خصل الشعر من الهرف والناصية والذوائب قال الاعشى
  غدا يتليل كجذع الخصاب -ر القذال طويل الغسن
  الواحدة غسفة وغسناة قال
  ينا الفق يخبط فى غسناته * اذصعد الدهر الى عفراته • فاجتاحها بشفرتى مبراته
  (كذا يرويدا بن كيسان والغيسان حدّة الشباب ونعمته ان جعلته فيهالافهو من هذا
  الباب وغسان اسم ما نزل عليه قوم من الازدة نسبوا اليه منهم بنوجفنة رهط االموك ويقال
  غسان اسم قبيلة (غصن الغصن غصن الشجر والهع الاغصان والغصون والفصنة مثل
  قرط وقرطة وغصنته أى قطعته وأبو الغصن كنية جتى ضن، غضنت الرجل غضنا
  حه يقال ماغضنك عنا أى ماعاقك عنا وأغصنت السماء دام مطرها والتغضين التشنيج
  بقال غضفته فتغضن والتغضين أيضا الرجاع والغضن والغضن واحد الغضون وهى مكاسر
  الجلد والدرع وغيره-ما والمغاضفة مكاسرة العينين وغضن العين جادتها الظاهرة وبقال
  للمجدوراذا ألس الجدرى جلده أصبح جاده غضئة واحدة وقد يقال بالباء ⁦(غمن)⁩
  نمنت الجلد أخمنه بالضم أى خممته ليتفسخ عنه صوفه فهو غمين وغميل وكذلك التمراذا فعلت
  صاح
