text: "… أشهرها: أن المستحب تركه ولا يقال فعله مكروه. والثاني أنه مكروه، والثالث: أنه مباح يستوي فعله وتركه، وهذا هو الذي نختاره، فإن المنع والاستحباب يحتاج إلى دليل ظاهر. والرابع: أنه دون الشتاء، هذا ما ذكره أصحابنا. وقد اختلف الصحابة وغيرهم …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 303، يرد فيه ذكر المستحب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
