text: "الحديث بمكة... حجة قبل الغزو أفضل من عشر غزوات، وغزوة بعد حجة حديث أبو مسعود في الاستسقاء حديث الاستسقاء حديث الإسراء حديث الأعرابي في قواعد الإسلام حديث أكله من كتف الشاة حديث الأُمراء الذين يؤخرون الصلاة عن وقتها حديث أمره …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 3، ص 119، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 3, p. 119, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 3، ص 119 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 3, pág. 119, que menciona los pilares del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 3, page 119) mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 3. cildinin 119. sayfasından, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 3, halaman 119, yang menyebutkan rukun Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
