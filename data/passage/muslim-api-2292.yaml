label: { ar: "صحيح مسلم 2292 — كتابة الحسنات", en: "Sahih Muslim 2292 — the writing of good deeds", ur: "صحیح مسلم 2292 — نیکیوں کا لکھا جانا" }
text: "… فِي بُطُونِهَا إِلاَّ كَتَبَ اللَّهُ لَهُ أَجْرًا وَلَوْ رَعَاهَا فِي مَرْجٍ مَا أَكَلَتْ مِنْ شَىْءٍ إِلاَّ كَتَبَ اللَّهُ لَهُ بِهَا أَجْرًا وَلَوْ سَقَاهَا مِنْ نَهْرٍ كَانَ لَهُ بِكُلِّ قَطْرَةٍ تُغَيِّبُهَا فِي بُطُونِهَا أَجْرٌ - حَتَّى ذَكَرَ الأَجْرَ فِي أَبْوَالِهَا وَأَرْوَاثِهَا - وَلَوِ اسْتَنَّتْ شَرَفًا أَوْ شَرَفَيْنِ كُتِبَ لَهُ بِكُلِّ خَطْوَةٍ تَخْطُوهَا أَجْرٌ وَأَمَّا الَّذِي هِيَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2292، يذكر كتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 2292 (The Book of Zakat), that speaks of the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 2292، جس میں نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
