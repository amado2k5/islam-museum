label: { ar: "صحيح البخاري 3018 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 3018 — camel milk and urine as treatment", ur: "صحیح بخاری 3018 — اونٹنی کا دودھ اور پیشاب", es: "Sahih al-Bukhari 3018 — Leche y orina de camella como tratamiento", fr: "Sahih al-Bukhari 3018 — le lait et l'urine de chamelle comme traitement", tr: "Sahih el-Buhari 3018 — Deve sütü ve idrarı", id: "Sahih al-Bukhari 3018 — Susu unta dan air kencing" }
text: "… اللَّهِ، ابْغِنَا رِسْلاً. قَالَ \" مَا أَجِدُ لَكُمْ إِلاَّ أَنْ تَلْحَقُوا بِالذَّوْدِ \". فَانْطَلَقُوا فَشَرِبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا حَتَّى صَحُّوا وَسَمِنُوا، وَقَتَلُوا الرَّاعِيَ، وَاسْتَاقُوا الذَّوْدَ، وَكَفَرُوا بَعْدَ إِسْلاَمِهِمْ، فَأَتَى الصَّرِيخُ النَّبِيَّ، فَبَعَثَ الطَّلَبَ، فَمَا تَرَجَّلَ النَّهَارُ حَتَّى أُتِيَ بِهِمْ، فَقَطَّعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ، ثُمَّ أَمَرَ بِمَسَامِيرَ فَأُحْمِيَتْ فَكَحَلَهُمْ بِهَا، وَطَرَحَهُمْ بِالْحَرَّةِ، يَسْتَسْقُونَ فَمَا يُسْقَوْنَ حَتَّى مَاتُوا. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3018، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3018 (Fighting for the Cause of Allah (Jihaad)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3018، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3018 (La lucha por la causa de Alá (Yihad)), menciona la leche y la orina de camella como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 3018 (Combat pour la cause d'Allah (Jihad)), mentionne l'utilisation du lait et de l'urine de chamelle comme traitement. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 3018 numaralı hadiste deve sütü ve idrarından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3018, menyebutkan susu unta dan air kencing. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
