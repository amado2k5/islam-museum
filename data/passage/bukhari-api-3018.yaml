text: "… اللَّهِ، ابْغِنَا رِسْلاً. قَالَ \" مَا أَجِدُ لَكُمْ إِلاَّ أَنْ تَلْحَقُوا بِالذَّوْدِ \". فَانْطَلَقُوا فَشَرِبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا حَتَّى صَحُّوا وَسَمِنُوا، وَقَتَلُوا الرَّاعِيَ، وَاسْتَاقُوا الذَّوْدَ، وَكَفَرُوا بَعْدَ إِسْلاَمِهِمْ، فَأَتَى الصَّرِيخُ النَّبِيَّ، فَبَعَثَ الطَّلَبَ، فَمَا تَرَجَّلَ النَّهَارُ حَتَّى أُتِيَ بِهِمْ، فَقَطَّعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ، ثُمَّ أَمَرَ بِمَسَامِيرَ فَأُحْمِيَتْ فَكَحَلَهُمْ بِهَا، وَطَرَحَهُمْ بِالْحَرَّةِ، يَسْتَسْقُونَ فَمَا يُسْقَوْنَ حَتَّى مَاتُوا. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3018، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3018 (Fighting for the Cause of Allah (Jihaad)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3018، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
