text: "… بحكم هذه الأخبار مكروهاً فارق حكمه حكم سائر الأسباب التي ليست فيها كراهية حين استحقّ تاركه الثناء الذي قدمنا ذكره. وأمّا الاسترقاء فقد روينا الرخصة فيه بما يُعلم من كتاب اللّٰه أو ذكره من غير كراهيةٍ؛ وإنّما الكراهية فيما لا …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 60، يرد فيه ذكر المكروه، والكراهة، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 60, whose wording mentions the disliked (makruh), dislike (karaha), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 60 کا اقتباس جس میں مکروہ، کراہت، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 60, dont le texte mentionne le réprouvé (makruh), la réprobation (karaha), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 60, cuyo texto menciona lo reprobado (makruh), la reprobación (karaha), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 60. sayfasından, mekruh, kınanacak ve caiz olan fiilleri ele alan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu bölüm, farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh, haram ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 60, yang membahas perbuatan yang tidak disukai, tercela, dan diperbolehkan; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk perbuatan wajib, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
