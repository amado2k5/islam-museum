label: { ar: "سنن أبي داود 1900 — الأب والأبوة", en: "Sunan Abi Dawud 1900 — the father and fatherhood", ur: "سنن ابی داؤد 1900 — باپ اور والدیت", es: "Sunan Abi Dawud 1900 — El padre y la paternidad", fr: "Sunan Abi Dawud 1900 — le père et la paternité", tr: "Sunan Abi Davud 1900 — Baba ve Babalık", id: "Sunan Abi Dawud 1900 — Sang Ayah dan Peran Ayah" }
text: "… مَيْسَرَةَ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا السَّائِبُ بْنُ عُمَرَ الْمَخْزُومِيُّ، حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ السَّائِبِ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يَقُودُ ابْنَ عَبَّاسٍ فَيُقِيمُهُ عِنْدَ الشُّقَّةِ الثَّالِثَةِ مِمَّا يَلِي الرُّكْنَ الَّذِي يَلِي الْحَجَرَ مِمَّا يَلِي الْبَابَ فَيَقُولُ لَهُ ابْنُ عَبَّاسٍ أُنْبِئْتَ أَنَّ رَسُولَ اللَّهِ كَانَ يُصَلِّي هَا هُنَا فَيَقُولُ \" نَعَمْ \". فَيَقُومُ فَيُصَلِّي."
summary:
  ar: "حديث في سنن أبي داود، رقم 1900، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1900 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1900، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1900 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud n° 1900 (Les Rites du Hajj [Kitab Al-Manasik Wa'l-Hajj]) mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1900 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1900, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
