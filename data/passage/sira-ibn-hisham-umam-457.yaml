text: "… يَعِدُنَا أَنْ نَأْكُلَ كُنُوزَ كِسْرَىٰ وَقَيْصَرَ، وأَحَدُنَا اليَوْمَ لا يَأْمَنُ على نَفْسِهِ أن يَذْهَبَ إلى الغائط. قال ابن هشام: وأخبرني مَنْ أثق به مِنْ أهل العلم أَنَّ مُعَتِّبَ بن قُشَيْرٍ لم يَكُنْ من المنافقين، واحْتَجَّ بأنه كان من أهل بدر. …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 457، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
