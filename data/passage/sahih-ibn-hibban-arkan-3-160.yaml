text: "… عَن أَبِي صَالِح عن أَبِي هُرَيْرَةَ، عَن رَسُوْل اللَّه وَلِهِ قَالَ: الإِيمانُ بِضْعٌ وَسِتُّونَ شُعْبَةً، أَوْ بِضْعٌ وَسَبْعُونَ شُعْبَةً، فأَرْفَعُهَا لاَ إِلَهَ إِلَّا اللَّهُ، وَأذْنَاهَا إمَاطَةُ الأذى عن الطَّرِيقِ، وَالحَيَاءُ شُعْبَةٌ مِنَ الإِيمانِ. حم الحديث:، م الحديث:، د الحديث:، س …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 160، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 160, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 160 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 160, que menciona las ramas de la fe, la fe como setenta y tantos ramas; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Sahih Ibn Hibban, volume 3, page 160, mentionnant les branches de la foi, la foi étant définie comme une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, sayfa 160'tan bir alıntı, imanın dallarından bahsetmekte ve imanın yetmişten fazla dalı olduğunu belirtmektedir; makine tarafından okunabilir taranmış baskıdan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, halaman 160, menyebutkan cabang-cabang iman, dan iman memiliki lebih dari tujuh puluh cabang; dari edisi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
