label: { ar: "الموطأ 1788 — يحيى عن مالك عن نافع عن ابن عمر: قال عمر بن الخطاب من باع عبدا وله مال فماله للبائع إلا أن يشترطه المبتاع", en: "Muwatta 1788", es: "Muwatta 1788", fr: "Muwatta 1788", ur: "موطا 1788", tr: "El-Muvatta 1788 — Yahya, Malik'ten, o da Nafi'den, o da İbn Ömer'den rivayetle: Ömer ibn el-Hattab şöyle dedi: Kim malı olan bir köleyi satarsa, alıcı aksini şart koşmadıkça, kölenin malı satıcıya aittir.", id: "Al-Muwatta 1788 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Nafi’ berdasarkan riwayat Ibn Umar: Umar ibn al-Khattab berkata: Barang siapa menjual seorang budak yang mempunyai harta, maka harta itu menjadi milik penjual kecuali jika pembeli menetapkan sebaliknya." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب قال: من باع عبدا وله مال، فماله للبائع إلا أن يشترطه المبتاع. ويذكر المحقق أن البخاري ومسلم رويا عن سالم عن أبيه حديث النخل والعبد مرفوعا، وأن الدارقطني رجح رواية نافع الموقوفة على عمر، وأن ابن حجر رأى الحديث عن نافع عن ابن عمر عن عمر بقصة العبد موقوفا. {cite:muwatta-maruf-1997 p.131} {cite:muwatta-maruf-1997 p.132}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayet ederek, Ömer ibn el-Hattab'ın şöyle dediğini aktarır: \"Mal sahibi olan bir köleyi satan kimsenin malı, alıcı aksini şart koşmadıkça satıcıya aittir.\" Araştırmacı, Buhari ve Müslim'in Salim'den, o da babasından rivayet ederek, Peygamber'e kadar uzanan bir isnad zinciriyle (merfu') hurma ağacı ve köle hadisini naklettiklerini, Darakutni'nin Ömer'e atfedilen Nafi'nin rivayetini tercih ettiğini ve İbn Hacer'in, köle kıssasıyla birlikte Nafi'den, o da İbn Umar'dan, o da Ömer'den rivayet edilen hadisi bir Sahabenin sözü (mevkuf) olarak kabul ettiğini belirtir. {cite:muwatta-maruf-1997 s.131} {cite:muwatta-maruf-1997 s.132}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi’, dari Abdullah ibn Umar, bahwa Umar ibn al-Khattab berkata: “Barang siapa menjual seorang budak yang mempunyai harta, maka harta itu menjadi milik penjual kecuali jika pembeli menetapkan sebaliknya.” Peneliti menyebutkan bahwa al-Bukhari dan Muslim meriwayatkan dari Salim, dari ayahnya, hadits tentang pohon kurma dan budak, dengan sanad yang dapat ditelusuri kembali kepada Nabi (marfu’), dan bahwa al-Daraqutni lebih menyukai riwayat Nafi’, yang dinisbahkan kepada Umar, dan bahwa Ibn Hajar menganggap hadits dari Nafi’, dari Ibn Umar, dari Umar, dengan kisah budak, sebagai pernyataan seorang Sahabat (mawquf). {cite:muwatta-maruf-1997 p.131} {cite:muwatta-maruf-1997 p.132}"
