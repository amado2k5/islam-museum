label: { ar: "الموطأ 1788 — يحيى عن مالك عن نافع عن ابن عمر: قال عمر بن الخطاب من باع عبدا وله مال فماله للبائع إلا أن يشترطه المبتاع", en: "Muwatta 1788" }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب قال: من باع عبدا وله مال، فماله للبائع إلا أن يشترطه المبتاع. ويذكر المحقق أن البخاري ومسلم رويا عن سالم عن أبيه حديث النخل والعبد مرفوعا، وأن الدارقطني رجح رواية نافع الموقوفة على عمر، وأن ابن حجر رأى الحديث عن نافع عن ابن عمر عن عمر بقصة العبد موقوفا. {cite:muwatta-maruf-1997 p.131} {cite:muwatta-maruf-1997 p.132}"
