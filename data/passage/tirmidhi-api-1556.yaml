text: "… فَكَتَبَ إِلَيْهِ ابْنُ عَبَّاسٍ كَتَبْتَ إِلَىَّ تَسْأَلُنِي هَلْ كَانَ رَسُولُ اللَّهِ يَغْزُو بِالنِّسَاءِ وَكَانَ يَغْزُو بِهِنَّ فَيُدَاوِينَ الْمَرْضَى وَيُحْذَيْنَ مِنَ الْغَنِيمَةِ وَأَمَّا يُسْهِمُ فَلَمْ يَضْرِبْ لَهُنَّ بِسَهْمٍ. وَفِي الْبَابِ عَنْ أَنَسٍ وَأُمِّ عَطِيَّةَ. وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ وَهُوَ قَوْلُ سُفْيَانَ الثَّوْرِيِّ وَالشَّافِعِيِّ. وَقَالَ بَعْضُهُمْ يُسْهَمُ لِلْمَرْأَةِ وَالصَّبِيِّ. وَهُوَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1556، يذكر المرض والمريض، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 1556 (The Book on Military Expeditions), that mentions illness and the sick, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 1556، جس میں بیماری اور بیمار، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
