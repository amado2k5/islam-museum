label: { ar: "الموطأ 1097 — جابر بن عبد الله عن النبي: كان إذا نزل من الصفا والمروة مشى، حتى إذا انصبت قدماه في بطن الوادي سعى حتى يخرج منه", en: "Muwatta 1097", es: "Muwatta 1097", fr: "Muwatta 1097", ur: "موطا 1097", tr: "El-Muvatta 1097 — Cabir ibn Abdullah, Peygamber'den rivayetle: Safa ve Merve'den indiğinde yürürdü ve ayakları vadinin dibine ulaştığında, oradan çıkana kadar koşardı.", id: "Al-Muwatta 1097 — Jabir ibn Abdullah, berdasarkan riwayat Nabi: Ketika beliau turun dari Safa dan Marwa, beliau berjalan kaki, dan ketika kakinya mencapai dasar lembah, beliau berlari hingga keluar dari lembah tersebut." }
text: "كان إذا نزل من الصفا والمروة مشى، حتى إذا انصبت قدماه في بطن الوادي سعى حتى يخرج منه"
summary:
  ar: "يرويه مالك عن جعفر بن محمد عن أبيه عن جابر بن عبد الله، أن رسول الله كان إذا نزل من الصفا والمروة مشى، حتى إذا انصبت قدماه في بطن الوادي سعى حتى يخرج منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1314) وإسحاق الطباع وسويد (544) وغيرهما، وأنه قطعة من حديث جابر الطويل. {cite:muwatta-maruf-1997 p.502}"
  tr: "Malik, Cafer ibn Muhammed'den, o da babasından, o da Cabir ibn Abdullah'tan rivayet ederek, Allah Resulü Safa ve Merve'den indiğinde, ayakları vadinin dibine ulaşana kadar yürür, sonra da vadiden çıkana kadar hızlanırdı diye nakletmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1314), İshak el-Tabba', Suveyd (544) ve diğerleri tarafından nakledildiğini ve Cabir'in daha uzun hadisinin bir parçası olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.502}"
  id: "Malik meriwayatkannya dari Ja'far bin Muhammad, dari ayahnya, dari Jabir bin Abdullah, bahwa ketika Rasulullah SAW turun dari Safa dan Marwa, beliau berjalan hingga kakinya mencapai dasar lembah, kemudian beliau bergegas hingga keluar dari lembah tersebut. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1314), Ishaq al-Tabba', Suwaid (544), dan lainnya, dan bahwa hadits ini merupakan bagian dari hadits Jabir yang lebih panjang. {cite:muwatta-maruf-1997 p.502}"
