text: "كان إذا نزل من الصفا والمروة مشى، حتى إذا انصبت قدماه في بطن الوادي سعى حتى يخرج منه"
summary:
  ar: "يرويه مالك عن جعفر بن محمد عن أبيه عن جابر بن عبد الله، أن رسول الله كان إذا نزل من الصفا والمروة مشى، حتى إذا انصبت قدماه في بطن الوادي سعى حتى يخرج منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1314) وإسحاق الطباع وسويد (544) وغيرهما، وأنه قطعة من حديث جابر الطويل. {cite:muwatta-maruf-1997 p.502}"
