text: "… بْنَ هَاشِمِ بن عَبْدِ منافٍ، ويذكر فضله، وفضل قُصَيّ على قريش، وفَضْلَ وَلَدِهِ مِنْ بَعْدِهِ عليهِم، وذلك أَنَّهُ أُخِذَ بَغُزْم أربعة آلاف درهم بمكة، فَوَقَفَ بِهَا، فَمَرّ بِهِ أَبو لَهَبِ عَنْدُ الْعُزِّى بن عبد المطلب فافْتَكَهُ من الطويل : أَعَيْنَيَّ …"
