label: { ar: "سنن أبي داود 3068 — الأب والأبوة", en: "Sunan Abi Dawud 3068 — the father and fatherhood", ur: "سنن ابی داؤد 3068 — باپ اور والدیت", es: "Sunan Abi Dawud 3068 — El padre y la paternidad", fr: "Sunan Abi Dawud 3068 — le père et la paternité", tr: "Sunan Abi Davud 3068 — Baba ve Babalık", id: "Sunan Abi Dawud 3068 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا سُلَيْمَانُ بْنُ دَاوُدَ الْمَهْرِيُّ، أَخْبَرَنَا ابْنُ وَهْبٍ، حَدَّثَنِي سَبْرَةُ بْنُ عَبْدِ الْعَزِيزِ بْنِ الرَّبِيعِ الْجُهَنِيُّ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ نَزَلَ فِي مَوْضِعِ الْمَسْجِدِ تَحْتَ دَوْمَةٍ فَأَقَامَ ثَلاَثًا ثُمَّ خَرَجَ إِلَى تَبُوكَ وَإِنَّ جُهَيْنَةَ لَحِقُوهُ بِالرَّحْبَةِ فَقَالَ لَهُمْ \" مَنْ أَهْلُ ذِي الْمَرْوَةِ \". فَقَالُوا بَنُو رِفَاعَةَ مِنْ جُهَيْنَةَ. فَقَالَ \" قَدْ أَقْطَعْتُهَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3068، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3068 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3068، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3068 (Tributo, Botín y Gobierno (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3068 (Tribut, Butin et Pouvoir (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 3068 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3068, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
