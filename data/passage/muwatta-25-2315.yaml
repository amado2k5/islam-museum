label: { ar: "الموطأ 2315 — مالك: لا يحل بيع نجم من نجوم المكاتب", en: "Muwatta 2315" }
summary:
  ar: "قال مالك: لا يحل بيع نجم من نجوم المكاتب، لأنه غرر: إن عجز المكاتب بطل ما عليه، وإن مات أو أفلس وعليه ديون لم يأخذ مشتري النجم بحصته مع الغرماء شيئا. ومشتري النجم بمنزلة سيد المكاتب، فلا يحاص بكتابة غلامه غرماء المكاتب، وكذلك الخراج المجتمع على الغلام. {cite:muwatta-maruf-1997 p.355}"
