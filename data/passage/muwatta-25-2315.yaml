label: { ar: "الموطأ 2315 — مالك: لا يحل بيع نجم من نجوم المكاتب", en: "Muwatta 2315", es: "Muwatta 2315", fr: "Muwatta 2315", ur: "موطا 2315", tr: "Al-Muwatta 2315 — Malik: Makamların yıldızlarından birini satmak caiz değildir.", id: "Al-Muwatta 2315 — Malik: Tidak diperbolehkan menjual bintang dari bintang-bintang kantor." }
summary:
  ar: "قال مالك: لا يحل بيع نجم من نجوم المكاتب، لأنه غرر: إن عجز المكاتب بطل ما عليه، وإن مات أو أفلس وعليه ديون لم يأخذ مشتري النجم بحصته مع الغرماء شيئا. ومشتري النجم بمنزلة سيد المكاتب، فلا يحاص بكتابة غلامه غرماء المكاتب، وكذلك الخراج المجتمع على الغلام. {cite:muwatta-maruf-1997 p.355}"
  tr: "Malik şöyle dedi: Kölenin kazancının bir kısmını satmak caiz değildir, çünkü bu belirsizlik içerir. Köle borcunu ödemezse, borç geçersiz olur. Borçluyken ölür veya iflas ederse, payı alan kişi diğer alacaklılarla birlikte payını alamaz. Payı alan kişi kölenin efendisi sayılır, bu nedenle diğer alacaklılarla birlikte kölenin kazancından pay alamaz, kölenin birikmiş vergi borçlarından da pay alamaz. {cite:muwatta-maruf-1997 s.355}"
  id: "Malik berkata: Tidak diperbolehkan menjual sebagian dari penghasilan budak, karena hal itu mengandung ketidakpastian. Jika budak gagal membayar, hutang tersebut batal. Jika ia meninggal atau bangkrut sementara masih berhutang, pembeli bagian tersebut tidak akan menerima bagiannya bersama dengan kreditur lainnya. Pembeli bagian tersebut dianggap sebagai tuan budak, sehingga ia tidak dapat berbagi penghasilan budak dengan kreditur lainnya, dan juga tidak dapat berbagi pajak yang terutang oleh budak. {cite:muwatta-maruf-1997 p.355}"
