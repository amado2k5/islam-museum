label: { ar: "الموطأ 2333 — مالك: عتق المكاتب عبده لا يجوز إلا بإذن سيده", en: "Muwatta 2333" }
summary:
  ar: "قال مالك: إن عتق المكاتب عبده غير جائز له إلا بإذن سيده. فإن أجاز السيد ذلك ثم عتق المكاتب كان ولاؤه للمكاتب. وإن مات المكاتب قبل أن يعتق، كان ولاء المعتَق لسيد المكاتب، وإن مات المعتَق قبل أن يعتق المكاتب ورثه سيد المكاتب. {cite:muwatta-maruf-1997 p.361}"
