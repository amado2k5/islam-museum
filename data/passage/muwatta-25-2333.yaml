label: { ar: "الموطأ 2333 — مالك: عتق المكاتب عبده لا يجوز إلا بإذن سيده", en: "Muwatta 2333", es: "Muwatta 2333", fr: "Muwatta 2333", ur: "موطا 2333", tr: "El-Muvatta 2333 — Malik: Köleliğin sona erdirilmesine ilişkin bir sözleşme yapmış olan kölenin azat edilmesi, efendisinin izni olmadan caiz değildir.", id: "Al-Muwatta 2333 — Malik: Pembebasan seorang budak yang telah mengadakan perjanjian pembebasan tidak diperbolehkan kecuali dengan izin tuannya." }
summary:
  ar: "قال مالك: إن عتق المكاتب عبده غير جائز له إلا بإذن سيده. فإن أجاز السيد ذلك ثم عتق المكاتب كان ولاؤه للمكاتب. وإن مات المكاتب قبل أن يعتق، كان ولاء المعتَق لسيد المكاتب، وإن مات المعتَق قبل أن يعتق المكاتب ورثه سيد المكاتب. {cite:muwatta-maruf-1997 p.361}"
  tr: "Malik şöyle demiştir: Azat sözleşmesi yapmış bir köle, efendisinin izni olmadan efendisi tarafından azat edilemez. Efendi izin verirse ve köle azat edilirse, kölenin bağlılığı köleye aittir. Köle azat edilmeden önce ölürse, azat edilen kölenin bağlılığı efendisine aittir. Azat edilen köle azat edilmeden önce ölürse, efendisi ondan miras alır. {cite:muwatta-maruf-1997 s.361}"
  id: "Malik berkata: Seorang budak yang telah membuat perjanjian pembebasan tidak dapat dibebaskan oleh tuannya kecuali dengan izin tuannya. Jika tuannya mengizinkannya dan budak tersebut kemudian dibebaskan, kesetiaan budak tersebut menjadi milik tuannya. Jika budak tersebut meninggal sebelum dibebaskan, kesetiaan budak yang telah dibebaskan tersebut menjadi milik tuannya. Jika budak yang telah dibebaskan tersebut meninggal sebelum dibebaskan, tuannya mewarisi hartanya. {cite:muwatta-maruf-1997 p.361}"
