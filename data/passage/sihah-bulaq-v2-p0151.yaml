text: |-
  ٦٢٩
  أن يفترّف بين المرأة ووادها وفى الحديث لا توه والدة يولدها أى لا تجعل والها وذلك فى السيايا
  وناقة واه اذا اشتد وجدها على وادها والميلاه التى من عادتها أن يشتدوجدها على ولدها
  صارت الواويا لكسرة ما قبلها قال الكميت يصف محايا
  كأن المطافيل المواليه وسطه • يجاوبهن انهيزران المنقب.....
  وماءموله وموه أرسل فى العمراء فذهب قال االراجز
  حاملة دلول لاعم وه • ملاى من الماء كعيز المول
  ورواه أبو هروه تمثى من الماءكمنى الموله • قال والمول العنكبوب وقال رؤية
  به قطت عرض كل ميله • بناحراجيج المهارى النفه
  و أراد البسلاد الق قوة الانسان أى تحيره ( ه اذا تهبت من طيب الذى قلت واهاله
  إما أطيبه قال أبوانجيم
  واهالرياتم واهاواها • باليت عينيه الناوفاها • يتمن نرضى مأباها
  واذا أغريت انسانا بشى"قلت ويم ايا فلان وهو تحريض كمايقال دونك يافلان قال السكميت
  وجات حوادت فى مثلها • يقال لمنسلى ويجافل
  ه يه كلمة تقال فى الاستهناث وأنشدابن السكيت
  وهواذا قيل ه ويها كل • فانه مواشك مستعجل
  وهواذا قيل له ويهافل • فانه أحربه أن ينكل
  وأماسييوبه وتحوه من الاسماء فهواسم بنى مع صوت فيصلاامها واحدا وكسروا آخره
  كما كسرواغاق لانه ضارع الاصوات وفارق خسة عشرلات آخره لم يضارع الاصوات
  فينوّن فى التشكير وذن قال هذاسيبويه ورأ يت سيبويه فأعر به باعراب مالا يتصرف ثناه
  وججعه فقال السيمو جهان والسيبو يهون وأمامن لم يعر به فانه يقول فى التثنية ذواسيبوبه
  وكلاهماسيبويه ويقول فى المع ذووسيبويه لكلهم سيبويه هوه). وهوه الاسد فى زتير
  هودهواه ووهوه المهارحول عانته اشفافاعليها قال روية * مقتدر الضعة وهواه الشغر
  (ف صل الما. (* و رجل هوهة بالضم أى جبان (ه يه حيرات كلة ببعيد قال
  جرير فميهات هيهات العقيق وأهله ٥ وهيهات خل بالعقيق حاوله
  والتاه مفتوحة مثل كيف وأصلهاهاه وناس يكسرونها على كل حال يمنزلة بون التنفية
  وقال الراجز يصف ابلاقطعت بلاد احتى صارت فى القفار
  يمجون بالتقر أناويات • هيهات من مصحهاهيبات • هيهات جرمن صنيبعات
  وقد تدل الهاء الاولى همزة فيقال أيهات مثل هواق وأراق قال • أيهات منت الحياة أيهاتا
  قال الكساق" ومن كسر التاء وقف عليها بالها فقال هيهادومن نحسبها وقض بالتاء وان شاء
  بالهاء وقال الاخفر يج وزف هيهات أن تكون جماعة فتكون التاء التى فيهاتاء الجع التى
  للت أنيث قال ولا يجوزذلات فى اللات والعزى لات لات وكيت لا يكون مثلها بماعة لان التاه
  لا تزاد فى الماعة الامع الالف وأن جعلت الالف والتاء زاتدتين بق الاسم على حرف واحد
