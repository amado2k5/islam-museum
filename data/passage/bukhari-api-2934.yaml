label: { ar: "صحيح البخاري 2934 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 2934 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 2934 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَعْفَرُ بْنُ عَوْنٍ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَمْرِو بْنِ مَيْمُونٍ، عَنْ عَبْدِ اللَّهِ ـ قَالَ كَانَ النَّبِيُّ يُصَلِّي فِي ظِلِّ الْكَعْبَةِ، فَقَالَ أَبُو جَهْلٍ وَنَاسٌ مِنْ قُرَيْشٍ، وَنُحِرَتْ جَزُورٌ بِنَاحِيَةِ مَكَّةَ، فَأَرْسَلُوا فَجَاءُوا مِنْ سَلاَهَا، وَطَرَحُوهُ عَلَيْهِ، فَجَاءَتْ فَاطِمَةُ فَأَلْقَتْهُ عَنْهُ، فَقَالَ \" اللَّهُمَّ عَلَيْكَ بِقُرَيْشٍ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2934، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2934 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 2934، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
