label: { ar: "الموطأ 1893 — مالك: في رجل له على رجل طعام ابتاعه منه، ولغريمه على رجل طعام مثله، فقال المدين لغريمه: أحيلك على غريم لي عليه مثل الطعام الذي لك علي، فإن كان الطعام الذي عليه طعاما ابتاعه فلا يصلح، وإن كان الطعام سلفا حالا فلا بأس", en: "Muwatta 1893", es: "Muwatta 1893", fr: "Muwatta 1893", ur: "موطا 1893", tr: "El-Muvatta 1893 — Malik: Bir kimse, başka bir kimseden satın aldığı ve kendisine borçlu olduğu yiyecekle ilgili olarak; alacaklısının da başka bir kimseden aynı miktarda yiyecek alacağı varsa ve alacaklı alacaklısına şöyle derse: \"Sana, benden aldığı yiyecek kadar yiyecek borcu olan bir alacaklıyı tavsiye ediyorum.\" Eğer alacaklının borçlu olduğu yiyecek, kendisinin satın aldığı bir yiyecek ise, bu caiz değildir; fakat yiyecek, derhal ödenmesi gereken bir borç ise, sorun yoktur.", id: "Al-Muwatta 1893 — Malik: Mengenai seorang pria yang memiliki hutang makanan dari pria lain, yang telah dibelinya, dan pemberi hutang tersebut memiliki hutang makanan dalam jumlah yang sama dari pria lain, dan si debitur berkata kepada pemberi hutangnya: Saya merekomendasikan Anda kepada pemberi hutang lain yang berhutang makanan kepada saya dalam jumlah yang sama dengan hutang saya kepada Anda, maka jika makanan yang dihutangnya adalah makanan yang dibelinya, maka hal itu tidak diperbolehkan, tetapi jika makanan tersebut adalah hutang yang harus dibayar segera, maka tidak ada masalah." }
summary:
  ar: "قال مالك: في رجل له على رجل طعام ابتاعه منه، ولغريمه على رجل طعام مثله، فقال الذي عليه الطعام لغريمه: أحيلك على غريم لي عليه مثل الطعام الذي لك علي بطعامك الذي لك علي. قال مالك: إن كان الذي عليه الطعام إنما هو طعام ابتاعه، فأراد أن يحيل غريمه بطعام ابتاعه، فإن ذلك لا يصلح، وذلك بيع الطعام قبل أن يستوفى. فإن كان الطعام سلفا حالا، فلا بأس أن يحال به غريمه، لأن ذلك ليس ببيع، ولا يحل بيع الطعام قبل أن يستوفى، لنهي رسول الله عن ذلك. {cite:muwatta-maruf-1997 p.177} {cite:muwatta-maruf-1997 p.178}"
  tr: "Malik şöyle dedi: Bir adamın başka bir adama, ondan satın aldığı yiyecekten dolayı borcu varsa ve alacaklısı da ona aynı miktarda yiyecek borçluysa ve yiyecek borçlusu alacaklısına şöyle derse: \"Borçlu olduğum yiyeceği, bana borçlu olduğum yiyecek miktarıyla aynı miktarda yiyecek borçlu olan başka bir alacaklıya devredeceğim.\" Malik şöyle dedi: Eğer borçlu olan gerçekten satın aldığı yiyecek ise ve borcunu satın aldığı yiyecekle alacaklısına devretmek istiyorsa, bu caiz değildir; çünkü bu, yiyeceği henüz teslim almadan satmak anlamına gelir. Ancak yiyecek, hemen ödenmesi gereken bir borç ise, borcu alacaklısına devretmesinde bir sakınca yoktur; çünkü bu bir satış değildir ve Allah Resulü'nün yasağı gereği, yiyeceği henüz teslim almadan satmak caiz değildir. {cite:muwatta-maruf-1997 s.177} {cite:muwatta-maruf-1997 s.178}"
  id: "Malik berkata: Jika seseorang berutang kepada orang lain makanan yang dibelinya, dan pemberi utang tersebut berutang kepadanya jumlah makanan yang sama, dan orang yang berutang makanan itu berkata kepada pemberi utangnya: Saya akan mengalihkan utang tersebut kepada pemberi utang lain yang berutang kepada saya jumlah makanan yang sama dengan yang saya berutang kepada Anda, sebagai ganti makanan yang saya berutang kepada Anda. Malik berkata: Jika yang berutang makanan itu sebenarnya adalah makanan yang dibelinya, dan dia ingin mengalihkan utang tersebut kepada pemberi utangnya menggunakan makanan yang dibelinya, maka ini tidak diperbolehkan, karena itu merupakan penjualan makanan sebelum diterima. Namun, jika makanan tersebut adalah utang yang harus dibayar segera, maka tidak ada salahnya mengalihkan utang tersebut kepada pemberi utangnya, karena ini bukan penjualan, dan tidak diperbolehkan menjual makanan sebelum diterima, karena larangan Rasulullah. {cite:muwatta-maruf-1997 p.177} {cite:muwatta-maruf-1997 p.178}"
