label: { ar: "الموطأ 1893 — مالك: في رجل له على رجل طعام ابتاعه منه، ولغريمه على رجل طعام مثله، فقال المدين لغريمه: أحيلك على غريم لي عليه مثل الطعام الذي لك علي، فإن كان الطعام الذي عليه طعاما ابتاعه فلا يصلح، وإن كان الطعام سلفا حالا فلا بأس", en: "Muwatta 1893" }
summary:
  ar: "قال مالك: في رجل له على رجل طعام ابتاعه منه، ولغريمه على رجل طعام مثله، فقال الذي عليه الطعام لغريمه: أحيلك على غريم لي عليه مثل الطعام الذي لك علي بطعامك الذي لك علي. قال مالك: إن كان الذي عليه الطعام إنما هو طعام ابتاعه، فأراد أن يحيل غريمه بطعام ابتاعه، فإن ذلك لا يصلح، وذلك بيع الطعام قبل أن يستوفى. فإن كان الطعام سلفا حالا، فلا بأس أن يحال به غريمه، لأن ذلك ليس ببيع، ولا يحل بيع الطعام قبل أن يستوفى، لنهي رسول الله عن ذلك. {cite:muwatta-maruf-1997 p.177} {cite:muwatta-maruf-1997 p.178}"
