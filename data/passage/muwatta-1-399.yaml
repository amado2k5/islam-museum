label: { ar: "الموطأ 399 — مالك: لا يقصر المسافر حتى يخرج من بيوت القرية", en: "Muwatta 399", es: "Muwatta 399", fr: "Muwatta 399", ur: "موطا 399", tr: "Al-Muwatta 399 — Malik: Yolcu, köy evlerinden ayrılıncaya kadar namazlarını kısaltmaz.", id: "Al-Muwatta 399 — Malik: Seorang musafir tidak mempersingkat salatnya sampai ia meninggalkan rumah-rumah di desa." }
summary:
  ar: "قول لمالك في باب ما يجب فيه قصر الصلاة: لا يقصر الذي يريد السفر الصلاة حتى يخرج من بيوت القرية، ولا يتم حتى يدخل أول بيوت القرية أو يقارب ذلك. {cite:muwatta-maruf-1997 p.212}"
  tr: "Malik, namazın kısaltılmasını gerektiren hususlar bölümünde şöyle demiştir: Yolculuğa çıkmayı düşünen kimse, köyün evlerinden ayrılana kadar namazını kısaltmamalı, köyün ilk evlerine girene veya girmeye yaklaşana kadar da namazını tam olarak kılmamalıdır. {cite:muwatta-maruf-1997 s.212}"
  id: "Malik berkata dalam bab tentang alasan mempersingkat salat: Orang yang bermaksud bepergian tidak boleh mempersingkat salat sampai ia meninggalkan rumah-rumah di desa, dan tidak pula boleh melaksanakan salat secara penuh sampai ia memasuki rumah-rumah pertama di desa atau hampir memasukinya. {cite:muwatta-maruf-1997 p.212}"
