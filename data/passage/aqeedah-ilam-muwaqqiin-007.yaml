text: "حابهما وما لهم وعليهم من المنقول والمعقول ما لا يجده الناظر في كتاب من كتب القوم من أولها إلى آخرها، ولا يظفر به في غير هذا الكتاب أبدا، وذلك بحول الله وقوته ومعونته وفتحه، فله الحمد والمنة، وما كان فيه"
