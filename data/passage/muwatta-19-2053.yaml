label: { ar: "الموطأ 2053 — مالك في العين تكون بين الرجلين فينقطع ماؤها، فيريد أحدهما أن يعمل فيها ولا يجد الآخر ما يعمل به: يقال للذي يريد أن يعمل: اعمل وأنفق، ويكون لك الماء كله، حتى يأتي صاحبك بنصف ما أنفقت", en: "Muwatta 2053", es: "Muwatta 2053", fr: "Muwatta 2053", ur: "موطا 2053", tr: "El-Muvatta 2053 — Malik, iki adamın ortak mülkiyetinde olan ve suyu kuruyan bir pınar hakkında şöyle demiştir: Adamlardan biri pınarı işletmek isterken diğeri bunu yapacak imkanı bulamıyor: İşletmek isteyene şöyle denir: Çalış ve harca, ortağın harcadığının yarısını getirinceye kadar bütün su senin olacak.", id: "Al-Muwatta 2053 — Malik berkata tentang sebuah mata air yang dimiliki bersama oleh dua orang dan airnya mengering, dan salah seorang dari mereka ingin mengolahnya tetapi yang lain tidak mampu melakukannya: Dikatakan kepada orang yang ingin mengolahnya: Berolahragalah dan berinfaklah, dan semua air itu akan menjadi milikmu, sampai pasanganmu mengembalikan setengah dari apa yang telah kamu berinfak." }
summary:
  ar: "قال مالك في العين تكون بين الرجلين، فينقطع ماؤها، فيريد أحدهما أن يعمل في العين، ويقول الآخر: لا أجد ما أعمل به. قال: يقال للذي يريد أن يعمل في العين: اعمل وأنفق، ويكون لك الماء كله، تسقي به حتى يأتي صاحبك بنصف ما أنفقت. فإذا جاء بنصف ما أنفقت أخذ حصته من الماء. قال: وإنما أعطي الأول الماء كله، لأنه أنفق، ولو لم يدرك شيئا بعمله، لم يعلق الآخر من النفقة شيء. {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.241}"
  tr: "Malik, iki adamın sahip olduğu ve suyunun kuruduğu bir pınar hakkında şöyle dedi: Adamlardan biri pınarda çalışmak isterken diğeri, \"Çalışacak hiçbir şeyim yok\" diyor. Pınarda çalışmak isteyen adama şöyle denir: \"Çalış ve harca, bütün su senin olacak. Ortağın harcadığının yarısını geri getirene kadar sulama için kullanabilirsin. Ortağın harcadığının yarısını geri getirdiğinde, suyun kendi payını alır.\" Şöyle devam etti: İlk adama bütün su verilir çünkü o harcamıştır. Eğer çalışmasından hiçbir şey kazanmasaydı, diğeri masraflardan hiçbirini alamazdı. {cite:muwatta-maruf-1997 s.240} {cite:muwatta-maruf-1997 s.241}"
  id: "Malik berkata, mengenai sebuah mata air milik dua orang, yang airnya mengering, dan salah satu dari mereka ingin mengolah mata air tersebut sementara yang lain berkata, \"Saya tidak punya apa-apa untuk diolah,\" katanya: Orang yang ingin mengolah mata air itu diberi tahu, \"Bekerjalah dan keluarkan uang, dan semua air akan menjadi milikmu. Kamu dapat menggunakannya untuk mengairi sampai rekanmu mengembalikan setengah dari uang yang kamu keluarkan. Ketika dia mengembalikan setengah dari uang yang kamu keluarkan, dia mengambil bagiannya dari air tersebut.\" Dia berkata: Orang pertama diberi semua air karena dia telah mengeluarkan uang. Jika dia tidak mendapatkan apa pun dari pekerjaannya, yang lain tidak akan menerima penggantian biaya apa pun. {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.241}"
