label: { ar: "الموطأ 2053 — مالك في العين تكون بين الرجلين فينقطع ماؤها، فيريد أحدهما أن يعمل فيها ولا يجد الآخر ما يعمل به: يقال للذي يريد أن يعمل: اعمل وأنفق، ويكون لك الماء كله، حتى يأتي صاحبك بنصف ما أنفقت", en: "Muwatta 2053" }
summary:
  ar: "قال مالك في العين تكون بين الرجلين، فينقطع ماؤها، فيريد أحدهما أن يعمل في العين، ويقول الآخر: لا أجد ما أعمل به. قال: يقال للذي يريد أن يعمل في العين: اعمل وأنفق، ويكون لك الماء كله، تسقي به حتى يأتي صاحبك بنصف ما أنفقت. فإذا جاء بنصف ما أنفقت أخذ حصته من الماء. قال: وإنما أعطي الأول الماء كله، لأنه أنفق، ولو لم يدرك شيئا بعمله، لم يعلق الآخر من النفقة شيء. {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.241}"
