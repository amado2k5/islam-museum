text: |-
  ٢٨٦
  * ⁦(فصل الشين)⁩
  تعالى فى الفلك المشحون وشصنت البلد بانخيل ملاته وبالبلد شهنة من الخيل أى رابطة ويقال
  مريشحنهم شهنا أى يعردهم ويشلهم ويكسوهم والشحناه العداوة وكذلك الشحنة بالكسم
  وعد ومشاحن وأشحن الصبىّ أى تهيأللبكاء ومنه قول أبى قلابة الهذلى
  اذعارت النبل والنف اللفوف واذه سلوا السيوف وقدهمت باشحان
  ⁦(شدن )⁩ شدن الغزال يشدن شدوناقوى وطلع قرناه واستغنى عن أمّه وربما قالوا
  شدن المهر فاذا أفردوا الشادن فهو ولد الظبية وأشدقت الطبية فهى مشدن اذاشدن ولدها
  والمع مشادن ومشادين مثل مطافل ومطافيل والشدنيات من النوق منسوبة الى موضع
  باليمن ⁦(شزن)⁩ الشزن بالتحريك الغاظ من الارض قال الاعشى
  تيمت قيساوكم دونه • من الارض من مهمه ذى شزن
  والشزن مثال الطذب الناحية والجانب وقال ابن أحر
  ألاليت المنازل قدبلينا * فلايرمين عن شزن حزينا
  ويقال ما أبالى عسلى أت شزنيه وقع أى جانبيه وتشزن له أى انتصب له فى الخصومة وغسيرها
  والشنزن الاءياء والشزن الكعب يلعب به ⁦(شطن)⁩ الشطن الحبل قال اخليل هو الحبل
  الطويل والجهع الاشطان ووصف أعرابى فرسالا يحتى فقال كأنه شيطان فى أشطان
  وشطنته أشطنه اذاشددته بالشطن وثطن عنه بعد وأشطنه أبعده ابن السكيت شطنه
  يشطنه شطنا اذاخا لفه عن نيسة وجهه وبترشطون بعيسدة القعرونوى شطون بعيدة قال
  النابغة
  نأت بسعاد عنك نوى شطون * فبانت والفؤاد بهارهين
  والشيطان معروف وكل عات متمرّد من الانس والجنّ والدواب شيطان قال جرير
  أيام يدءوتى الشيطان من غزل • وهنّ يهويننى اذ كنت شيطانا
  والعرب تسمى الحية شيطانا وقال الشاعر يصف ناقته
  تلاعب مننى حضر مى كأنه • تعمج شيطان يذى خروع قفر
  وقوله تعالى طلعها كانه رؤس الشياطين قال الفراء فيه من العربية ثلاثة أوجه أحدها أن
  بشبه طلعها فى قيحه برؤس الشياطين لانهاء وصوفة بالقبح والمانى أنّ العرب تسمى بعض
  الحيات شيطانا وهوذ والعرف قبيح الوجه والثالث انه نبت قبيح يسمى رؤس الشياطين
  والشيطان نونه أصلية قال أمية بصف سليمان بن داودعليهما السلام
  أيماشاطن عصاء عكاه * ثم بلفى فى السمج والاعلال
  ويقال أيضا اتم ازائدة فان جعلته فيعالا من قولهم تشيطن الرجل صرقته وان جعلت
  من تشيط لم تصرفه لانه فعلان (شعن اشعان شعره اشعينانافهو مشعان الرأس اذا
  كان ثأوالرأس أشعث ( فن الاموى الشفن بالتسكين الكيسر العاقل وشفنته
  أشفنه بالكسر شفونا اذا تظرت اليه بمؤخر عينك فأناشافن وشفون وقال
  حذارمى تقب شفون • وهوالغيود ابن السكيت شفنت اليه وشنفت بمعنى وهو نظرفى
  اعتراض وقال أبو عبيدهو أن يرفع الانسان طرفه نأظرا الى الشى كالمتعجب متسه أو
  كالكاره له وأنشد القطامى يذكرابلا
  وادا
