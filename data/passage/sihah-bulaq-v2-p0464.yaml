text: |-
  توق)•
  ٦٢٣
  وقرس نفق الجرى اذا كان سريع انقطاع الحرى قال علمة برق عبدة يصف ظليما
  فلاتز يذه فى مش.ه نفق • ولا الزفيف دوين التدمشؤم
  وأنفق القوم أى نفقت سوقهم وأنفق الرجل أى افتقروذهب ماله ومنه قوله تمالى اذا
  لا مسكتم خشية الانفاق رقد أننقت الدراهم من النفقة ورجل منفاق أى كثير النفقة
  والنفق سرب فى الارض له مخلص الى مكان وفى المثل ضلّ دريص نفقه أى بحجره والنافقاء
  احدى ججرة اليربوع يكتمها ويفهرغيرها وهوم وضع يرققه فاذا أتى من قبل القاصعاء
  ضرب النافقاء برأسه فانتفق أى خرج والهع النوافق والنفقة أيضامثال الهمزة النافقاء
  تقول منه نفق البربوع تنفيقا ونافق أى أخذ فى نافقائه ومنه اشتقاق المنافق فى الدين
  وننفق السراويل الموضع المتسع منها والعامّة تقول نيفق بكسر النون والمستفق اسم
  رجل ومالك بن المنتفق قائل بسطام بن قيس قق ، نق الضفدع والعقرب والدجاجة
  بتق نقيقا أى صوّت قال برير
  كان نيق الحب فى حاوياته • فحيح الاقاعى أونقيق العقارب
  وربماقيل لهزأيضا وأنشد أبو عمرو
  أطعمت راعى من اليهير • فطل يبكى حيجابشر • خلف استه مثل نقيق الهر
  والنقاقة الضفدعة والنقنقة صوتها اذاضوعف والدجاجة تنقفق للبيض وكذلك
  النعامة والنقنق بالكسر الظليم والجمع النقائق (لق نق المكتاب ينقه بالضم أى كتيه
  وغقه تنميقا أى زينه بالكتابة وقال النابغة
  كان مجزالرامسات ذيولها • عليه قضيم غقته الصوائع
  ⁦(نغرق)⁩ النمرق والمرقة وسادة صغيرة وكذلك المرقة بالمكسرلغة حكاها بعقوب وربما
  سموا الطنفسة التى فوق الحسل غرقة عن أبى عبيد (نوق%€ الماقة تقديرها فعلة
  بالتحريك لا نها جعت على نوق مثل بدنة وبدن وخشبة وخشب وفعلة بالتسكين لا تجمع
  على ذلكْ وقد جحعت فى القلة على أنوق ثم استئقلوا الضمة على الواوفقدموها فقالوا أونق
  حكاهايع-قوب عن بعض الطائيين ثم عوّضوا من الواوياء فقالوا أيق ثم جوها،-لى
  أيائق وقد تجمع الناقة على نياق مثل غرة رثمار الا أن الواوصارت بالكسرة ما قبلها
  وأنشد أبوزيد للقلاخ بن حزن
  أبعد كن اللّٰه من نيساق * ان لم تنجين من الوثاق
  وبعيرمنوق أى مذلل عروض وناقة منوّقة والنوّاق من الرجال الذى يروض الامور
  ويصلحها و فى المثل اسنوق المل أى صارناقة يضرب للرجل يكون فى حديث أرصفة شئ
  ثم يخلطه بغسيره وينتقل اليه وأصله أنّ طرفة بن العبد كان عند بعض الملولة والمديب بن علس
  تشده شعرافى وصفب جحل ثم حوّه الى شعت ناقة فقال طرفة استنوق الجل والنيق أرفع
  موضع فى الجبل والجمع نياق ومنه قول الشاعر *شغواء يوطن بين الشيق والنيق* وتنوّق
  فى الاحبى أى تأنق فيه وبعضهم لا يقول تنوّق والاسم منه الفيقة وفى المثل خرقاء ذات نيقة
  بضرب للجاهل بالامر وهو مع جهله يدّعى المعرفة ويتأذق فى الارادة ذكره أبو عبيد
  المناسب تقديم نمرق على عمق كمافعلة
  الجد ااه معيعه
  قوله عند بعض الملوك ه و غمروبن
  هندوة وله ثم حوّله الى نغت ناقتم
  يعتى حيث قال
  وقد أتلا فى الهمّ عند احتضاره
  بناج عليه الصيعرية مكدم
  وقوله فقال طرفة بعنى وهو
  غلام استنوق الجمل وذلك لات
  الصيعرية من سعات الذوق دون
  الفعل فغضب المسيب وقال
  -قتلنه لسانه فكان كا تفرس فيه
  اهمن القاموس وقال المؤلف فى
  مادّة صعر والصيعرية سمة فى عنق
  البعير تقال الشاعر المتاس وقدة
  أتناسى الهم البيت إم مجصيية
