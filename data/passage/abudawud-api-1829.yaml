text: "حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ جَابِرِ بْنِ زَيْدٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" السَّرَاوِيلُ لِمَنْ لاَ يَجِدُ الإِزَارَ وَالْخُفُّ لِمَنْ لاَ يَجِدُ النَّعْلَيْنِ \". قَالَ أَبُو دَاوُدَ هَذَا حَدِيثُ أَهْلِ مَكَّةَ وَمَرْجِعُهُ إِلَى الْبَصْرَةِ إِلَى جَابِرِ بْنِ زَيْدٍ وَالَّذِي تَفَرَّدَ بِهِ مِنْهُ ذِكْرُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1829، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1829 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1829، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
