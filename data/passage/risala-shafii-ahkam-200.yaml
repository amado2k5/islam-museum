text: "… أَغْلَمَهُمْ أَنَّ الفرض عليهم اتباعُ أمْرِه وأمرِ رسوله، وأنَّ طاعةَ رسولِهِ طاعتُه، ثم أَعْدَهُمْ أنه فَرَضَ على رسولِهِ اتباعَ أمرِه، جلَ ثناؤه. باب مَا أبانَ اللّٰه طلقهِ مِنْ فَرْمِه على رسوله اتّباحَ ما أوحى إليه، وما شَهِدَ لَهُ بِهِ مِن …"
