label: { ar: "دلائل النبوة لأبي نعيم — فوران الماء من بين الأصابع سفراً وحضراً", en: "Abu Nu'aym's Dala'il — water gushing from between the fingers, travel and stay", ur: "ابو نعیم کی دلائل — سفر و قیام میں انگلیوں کے درمیان سے پانی کا ابلنا", es: "Dala'il de Abu Nu'aym: agua que brota entre los dedos, viaje y estancia.", fr: "Le Dala'il d'Abu Nu'aym — l'eau jaillissant entre les doigts, le voyage et le séjour", tr: "Ebu Nuaym'ın Peygamberlik Alametleri — Yolculukta veya evde, parmakların arasından su fışkırması.", id: "Tanda-tanda Kenabian menurut Abu Nu'aym — Air yang keluar deras dari sela-sela jari, baik saat bepergian maupun di rumah." }
text: "بينا نحن مع رسول الله في سفر إذ حضرت الصلاة وليس معنا إلا شيء يسير، فدعا بماء فصبّه في صحفة فجعل كفه فيه فجعل الماء يتفجر من بين أصابعه، ثم نادى: ألا هلُم إلى الوضوء، والبركة من الله"
summary:
  ar: "يفرد أبو نعيم فصلاً لماء بين الأصابع عنوانه «في فوران الماء من بين أصابعه سفراً وحضراً»، ويعلّق أن الآية من أعجب الآيات وأجلّها معجزة وأبلغها دلالة، يشاكلها ما كان لموسى من تفجر الماء من الحجر بل هذه أبلغ لأن نبوع الماء من بين اللحم والعظم أعجب من خروجه من الحجر. ويروي حديثين: عن عبد الله بن مسعود أنه بينا هم مع النبي في سفر قدّمت الصلاة وليس معهم إلا ماء يسير فوضع كفه فيه فجعل الماء يتفجر من بين أصابعه ثم نادى ألا هلُم إلى الوضوء والبركة من الله، وحديثاً آخر بنحوه."
  en: "Abu Nu'aym devotes a chapter to water gushing from between the fingers 'on journey and at home', prefacing it as one of the most wondrous signs, likening it to Moses' water from the stone yet greater — since water springing from flesh and bone surpasses its springing from stone. He transmits two reports: Ibn Mas'ud's that while travelling with the Prophet at prayer time they had only a little water, so he put his palm in it and water burst from between his fingers as he called 'come to ablution, the blessing is from God', and a second report to the same effect."
  ur: "ابو نعیم ایک باب 'سفر و قیام میں انگلیوں کے درمیان سے پانی کا پھٹنا' تفصیل سے بیان کرتا ہے اور تمہید میں کہتا ہے کہ یہ معجزات میں سب سے عجیب اور ابلغ ہے، موسیٰ کے پتھر سے پانی نکلنے جیسی مگر اس سے بھی بڑھ کر کیونکہ گوشت اور ہڈی کے درمیان سے پانی نکلنا پتھر سے نکلنے سے زیادہ حیرت انگیز ہے۔ وہ ابن مسعود کی روایت کرتا ہے کہ سفر میں نماز کا وقت آیا اور ان کے پاس تھوڑا سا پانی تھا، اس نے مٹھی اس میں ڈالی تو پانی انگلیوں کے درمیان سے پھٹ پڑا اور پکارا: آؤ وضو کے لیے، برکت اللہ کی طرف سے۔"
  es: "Abu Nu'aym dedica un capítulo al agua que brota entre los dedos «en los viajes y en casa», presentándola como una de las señales más maravillosas, comparándola con el agua que brotó de la piedra de Moisés, pero aún mayor, ya que el agua que brota de la carne y el hueso supera a la que brota de la piedra. Transmite dos relatos: el de Ibn Mas'ud, quien cuenta que mientras viajaban con el Profeta a la hora de la oración, tenían poca agua, así que él metió la palma de la mano en ella y brotó agua entre sus dedos mientras decía «venid a la ablución, la bendición viene de Dios», y un segundo relato con el mismo efecto."
  fr: "Abou Nu'aym consacre un chapitre à l'eau jaillissant entre les doigts, « en voyage comme à la maison », la présentant comme l'un des signes les plus merveilleux et la comparant à l'eau jaillie de la pierre par Moïse, mais en la surpassant – car l'eau jaillissant de la chair et des os surpasse celle jaillissant de la pierre. Il rapporte deux récits: celui d'Ibn Mas'ud, selon lequel, lors d'un voyage avec le Prophète à l'heure de la prière, ils ne disposaient que d'un peu d'eau; Moïse y plongea alors sa paume et l'eau jaillit entre ses doigts tandis qu'il disait: « Venez faire vos ablutions, la bénédiction vient de Dieu », et un second récit allant dans le même sens."
  tr: "Ebu Nuaym, \"Yolda ve Evde Parmaklarının Arasından Fışkıran Su\" başlıklı bir bölümü parmakların arasından akan suya ayırmış ve bu ayetin en şaşırtıcı ve mucizevi işaretlerden biri olduğunu, anlamının da en açıklayıcı olduğunu belirtmiştir. Bu durum, Musa için kayadan fışkıran suya benzetilebilir, ancak bu daha da dikkat çekicidir çünkü et ve kemik arasından fışkıran su, kayadan çıkmasından daha mucizevidir. İki hadis rivayet eder: Biri Abdullah ibn Mes'ud'dan, Peygamberimizle birlikte bir yolculukta namaz kılındığı sırada az miktarda suları olduğunu, elini suya koyduğunu ve parmaklarının arasından su fışkırmaya başladığını, ardından \"Gelin, abdest alalım, çünkü bu bereket Allah'tandır!\" diye seslendiğini anlatır. Ayrıca benzer anlamda başka bir hadis daha rivayet eder."
  id: "Abu Nu'aym mendedikasikan sebuah bab untuk air yang mengalir dari sela-sela jari, berjudul \"Tentang Air yang Mengalir dari Sela-Sela Jari, Saat Bepergian dan di Rumah,\" dengan mengomentari bahwa ayat ini termasuk tanda-tanda yang paling menakjubkan dan ajaib, serta paling fasih maknanya. Hal ini sebanding dengan air yang mengalir dari batu untuk Musa, tetapi ini bahkan lebih luar biasa karena air yang mengalir dari sela-sela daging dan tulang lebih menakjubkan daripada air yang keluar dari batu. Ia meriwayatkan dua hadits: satu dari Abdullah ibn Mas'ud, yang berkata bahwa ketika mereka bersama Nabi dalam perjalanan, salat dilaksanakan, dan mereka hanya memiliki sedikit air. Maka ia meletakkan tangannya di dalamnya, dan air mulai mengalir dari sela-sela jarinya. Kemudian ia berseru, \"Mari kita berwudhu, karena nikmat ini dari Allah!\" Ia juga meriwayatkan hadits lain dengan makna yang serupa."
