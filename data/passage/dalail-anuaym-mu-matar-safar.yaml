label: { ar: "دلائل النبوة لأبي نعيم — فوران الماء من بين الأصابع سفراً وحضراً", en: "Abu Nu'aym's Dala'il — water gushing from between the fingers, travel and stay", ur: "ابو نعیم کی دلائل — سفر و قیام میں انگلیوں کے درمیان سے پانی کا ابلنا" }
text: "بينا نحن مع رسول الله في سفر إذ حضرت الصلاة وليس معنا إلا شيء يسير، فدعا بماء فصبّه في صحفة فجعل كفه فيه فجعل الماء يتفجر من بين أصابعه، ثم نادى: ألا هلُم إلى الوضوء، والبركة من الله"
summary:
  ar: "يفرد أبو نعيم فصلاً لماء بين الأصابع عنوانه «في فوران الماء من بين أصابعه سفراً وحضراً»، ويعلّق أن الآية من أعجب الآيات وأجلّها معجزة وأبلغها دلالة، يشاكلها ما كان لموسى من تفجر الماء من الحجر بل هذه أبلغ لأن نبوع الماء من بين اللحم والعظم أعجب من خروجه من الحجر. ويروي حديثين: عن عبد الله بن مسعود أنه بينا هم مع النبي في سفر قدّمت الصلاة وليس معهم إلا ماء يسير فوضع كفه فيه فجعل الماء يتفجر من بين أصابعه ثم نادى ألا هلُم إلى الوضوء والبركة من الله، وحديثاً آخر بنحوه."
  en: "Abu Nu'aym devotes a chapter to water gushing from between the fingers 'on journey and at home', prefacing it as one of the most wondrous signs, likening it to Moses' water from the stone yet greater — since water springing from flesh and bone surpasses its springing from stone. He transmits two reports: Ibn Mas'ud's that while travelling with the Prophet at prayer time they had only a little water, so he put his palm in it and water burst from between his fingers as he called 'come to ablution, the blessing is from God', and a second report to the same effect."
  ur: "ابو نعیم ایک باب 'سفر و قیام میں انگلیوں کے درمیان سے پانی کا پھٹنا' تفصیل سے بیان کرتا ہے اور تمہید میں کہتا ہے کہ یہ معجزات میں سب سے عجیب اور ابلغ ہے، موسیٰ کے پتھر سے پانی نکلنے جیسی مگر اس سے بھی بڑھ کر کیونکہ گوشت اور ہڈی کے درمیان سے پانی نکلنا پتھر سے نکلنے سے زیادہ حیرت انگیز ہے۔ وہ ابن مسعود کی روایت کرتا ہے کہ سفر میں نماز کا وقت آیا اور ان کے پاس تھوڑا سا پانی تھا، اس نے مٹھی اس میں ڈالی تو پانی انگلیوں کے درمیان سے پھٹ پڑا اور پکارا: آؤ وضو کے لیے، برکت اللہ کی طرف سے۔"
