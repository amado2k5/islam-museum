label: { ar: "الموطأ 1323 — ابن عباس: ما ظهر الغلول في قوم قط إلا ألقي في قلوبهم الرعب، ولا فشا الزنا إلا كثر فيهم الموت", en: "Muwatta 1323", es: "Muwatta 1323", fr: "Muwatta 1323", ur: "موطا 1323", tr: "İbn Abbas, El-Muvatta 1323: Bir topluluk arasında zimmetine para geçirme vakası görüldüğünde, kalplerine korku salınır; zina yaygınlaştığında ise aralarında ölüm oranları artar.", id: "Al-Muwatta 1323 — Ibnu Abbas: Setiap kali terjadi penggelapan di antara suatu kaum, maka rasa takut akan mencekam hati mereka, dan setiap kali perzinahan meluas, maka kematian akan meningkat di antara mereka." }
text: "مَا ظَهرَ الْغُلُولُ في قَوْمِ قَطُّ إِلاَّا أُلْقِيَ في قُلُوبِهِمُ الرُّعْبُ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه بلغه عن عبد الله بن عباس أنه قال ما ظهر الغلول في قوم قط إلا ألقي في قلوبهم الرعب، ولا فشا الزنا في قوم قط إلا كثر فيهم الموت، ولا نقص قوم المكيال والميزان إلا قطع عنهم الرزق، ولا حكم قوم بغير الحق إلا فشا فيهم الدم، ولا خفر قوم بالعهد إلا سلط الله عليهم العدو. ويذكر المحقق أن ابن عبد البر ذكره موقوفا على ابن عباس. {cite:muwatta-maruf-1997 p.592}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle Abdullah ibn Abbas'tan şöyle bir hadis duyduğunu aktarır: \"Bir kavim arasında zimmet ortaya çıktığında, kalplerine korku salınır; bir kavim arasında zina yaygınlaştığında, ölüm oranları artar; bir kavim ölçü ve tartıda hile yaptığında, rızıkları kesilir; bir kavim adaletsiz hüküm sürdüğünde, kan dökülür; ve bir kavim ahitlerini bozduğunda, Allah düşmanlarını onlara karşı güçlendirir.\" Araştırmacı, İbn Abd al-Barr'ın bunu İbn Abbas'a atfettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.592}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia mendengar dari Abdullah ibn Abbas bahwa ia berkata: \"Setiap kali terjadi penggelapan di antara suatu kaum, maka rasa takut akan menyelimuti hati mereka; setiap kali perzinahan meluas di antara suatu kaum, maka kematian akan meningkat di antara mereka; setiap kali suatu kaum berbuat curang dalam timbangan dan ukuran, maka rezeki mereka akan terputus; setiap kali suatu kaum memerintah secara tidak adil, maka pertumpahan darah akan terjadi di antara mereka; dan setiap kali suatu kaum melanggar perjanjian mereka, maka Allah akan memberi kekuatan kepada musuh mereka untuk melawan mereka.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr menisbatkan hal ini kepada Ibnu Abbas. {cite:muwatta-maruf-1997 p.592}"
