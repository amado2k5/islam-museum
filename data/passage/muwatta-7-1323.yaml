label: { ar: "الموطأ 1323 — ابن عباس: ما ظهر الغلول في قوم قط إلا ألقي في قلوبهم الرعب، ولا فشا الزنا إلا كثر فيهم الموت", en: "Muwatta 1323" }
text: "مَا ظَهرَ الْغُلُولُ في قَوْمِ قَطُّ إِلاَّا أُلْقِيَ في قُلُوبِهِمُ الرُّعْبُ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه بلغه عن عبد الله بن عباس أنه قال ما ظهر الغلول في قوم قط إلا ألقي في قلوبهم الرعب، ولا فشا الزنا في قوم قط إلا كثر فيهم الموت، ولا نقص قوم المكيال والميزان إلا قطع عنهم الرزق، ولا حكم قوم بغير الحق إلا فشا فيهم الدم، ولا خفر قوم بالعهد إلا سلط الله عليهم العدو. ويذكر المحقق أن ابن عبد البر ذكره موقوفا على ابن عباس. {cite:muwatta-maruf-1997 p.592}"
