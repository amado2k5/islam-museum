  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin Resimli Cilt 1, sayfa 312'den bir alıntı; Kur'an okunuşlarını içermektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
