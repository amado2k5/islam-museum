label: { ar: "جامع الترمذي 928 — وصية أو عهد أخير", en: "Jami' al-Tirmidhi 928 — a testament or parting counsel", ur: "جامع ترمذی 928 — وصیت یا آخری نصیحت", es: "Jami' al-Tirmidhi 928 — un testamento o consejo de despedida", fr: "Jami' al-Tirmidhi 928 — un testament ou un conseil d'adieu" }
text: "… غَيْرُ حَدِيثٍ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ وَبِهِ يَقُولُ الثَّوْرِيُّ وَابْنُ الْمُبَارَكِ وَالشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ يَرَوْنَ أَنْ يُحَجَّ عَنِ الْمَيِّتِ. وَقَالَ مَالِكٌ إِذَا أَوْصَى أَنْ يُحَجَّ عَنْهُ حُجَّ عَنْهُ. وَقَدْ رَخَّصَ بَعْضُهُمْ أَنْ يُحَجَّ عَنِ الْحَىِّ إِذَا كَانَ كَبِيرًا أَوْ بِحَالٍ لاَ يَقْدِرُ أَنْ يَحُجَّ. وَهُوَ قَوْلُ ابْنِ الْمُبَارَكِ وَالشَّافِعِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 928، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 928 (The Book on Hajj), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 928، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 928 (El Libro del Hajj), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 928 (Le Livre du Hajj), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
