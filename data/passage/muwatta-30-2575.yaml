label: { ar: "الموطأ 2575 — مالك: القسامة لا تجب إلا بقول المقتول أو بلوث من بينة، ويبدأ المدعون بالأيمان", en: "Muwatta 2575" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، والذي سمعته ممن أُرضى في القسامة، والذي اجتمعت عليه الأئمة في القديم والحديث: أن يُبدأ بالأيمان المدعون في القسامة فيحلفون. وأن القسامة لا تجب إلا بأحد أمرين: إما أن يقول المقتول: دمي عند فلان، أو يأتي ولاة الدم بلوث من بينة، وإن لم تكن قاطعة على الذي يُدعى عليه الدم. فهذا الذي يوجب القسامة للمدعين الدم على من ادعوه، ولا تجب القسامة عندنا إلا بأحد هذين الوجهين. {cite:muwatta-maruf-1997 p.453} {cite:muwatta-maruf-1997 p.454}"
