label: { ar: "الموطأ 2575 — مالك: القسامة لا تجب إلا بقول المقتول أو بلوث من بينة، ويبدأ المدعون بالأيمان", en: "Muwatta 2575", es: "Muwatta 2575", fr: "Muwatta 2575", ur: "موطا 2575", tr: "El-Muvatta 2575 — Malik: Tövbe yemini ancak öldürülen kişinin ifadesi veya kesin delillerle istenir ve suçlayıcılar yeminle başlarlar.", id: "Al-Muwatta 2575 — Malik: Sumpah penyucian hanya diwajibkan berdasarkan pernyataan orang yang dibunuh atau berdasarkan bukti yang meyakinkan, dan para penuduh memulai dengan sumpah tersebut." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، والذي سمعته ممن أُرضى في القسامة، والذي اجتمعت عليه الأئمة في القديم والحديث: أن يُبدأ بالأيمان المدعون في القسامة فيحلفون. وأن القسامة لا تجب إلا بأحد أمرين: إما أن يقول المقتول: دمي عند فلان، أو يأتي ولاة الدم بلوث من بينة، وإن لم تكن قاطعة على الذي يُدعى عليه الدم. فهذا الذي يوجب القسامة للمدعين الدم على من ادعوه، ولا تجب القسامة عندنا إلا بأحد هذين الوجهين. {cite:muwatta-maruf-1997 p.453} {cite:muwatta-maruf-1997 p.454}"
  tr: "Malik şöyle dedi: Aramızda yerleşik uygulama ve güvendiğim kişilerden duyduklarım, hem geçmişteki hem de günümüzdeki imamların üzerinde ittifak ettikleri husus şudur ki, arınma yemini edenler öncelikle yemin etmelidirler. Arınma yemini sadece iki durumda gereklidir: Ya mağdur, \"Kanım falancanın üzerindedir\" der ya da kan intikamcıları, suçlanan kişi aleyhine kesin olmasa bile, dolaylı deliller sunarlar. İşte bu, kan intikamcılarının suçladıkları kişiye karşı arınma yemini etmelerini gerektirir ve bizim görüşümüze göre arınma yemini sadece bu iki durumdan birinde gereklidir. {cite:muwatta-maruf-1997 s.453} {cite:muwatta-maruf-1997 s.454}"
  id: "Malik berkata: Praktik yang telah mapan di antara kita, dan apa yang telah saya dengar dari orang-orang yang saya percayai mengenai sumpah penyucian (qasama), dan apa yang telah disepakati oleh para imam, baik terdahulu maupun sekarang, adalah bahwa para penuntut dalam sumpah penyucian harus memulai dengan mengucapkan sumpah. Sumpah penyucian hanya diperlukan dalam salah satu dari dua kasus: korban mengatakan, \"Darahku ada pada si fulan,\" atau para pembalas darah mengajukan bukti tidak langsung, meskipun tidak meyakinkan terhadap orang yang dituduh. Inilah yang mengharuskan sumpah penyucian bagi para pembalas darah terhadap orang yang mereka tuduh, dan menurut pandangan kami, sumpah penyucian hanya diperlukan dalam salah satu dari dua kasus ini. {cite:muwatta-maruf-1997 p.453} {cite:muwatta-maruf-1997 p.454}"
