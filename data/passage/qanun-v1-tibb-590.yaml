text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف السين استكثر منه ضمَّاداً صلب الورم، وهو حجر، وكذلك هو ترياق جميع المفاصل، وخصوصاً في أوقات النوازل. أعضاء الغذاء : رديء للمعدة مضعّف لها، والأحمر والأسود يحبسان أدوية الإسهال في …"
summary:
