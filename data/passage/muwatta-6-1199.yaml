label: { ar: "الموطأ 1199 — مالك: أهل مكة يصلون بعرفة ومنى ركعتين ركعتين، ويقصر أمير الحاج إن كان من أهل مكة", en: "Muwatta 1199", es: "Muwatta 1199", fr: "Muwatta 1199", ur: "موطا 1199", tr: "El-Muvatta 1199 — Malik: Mekke halkı Arafat ve Mina'da iki rekat namaz kılarlar ve Hac lideri Mekke'li ise namazı kısaltır.", id: "Al-Muwatta 1199 — Malik: Penduduk Mekah melaksanakan salat dua rakaat di Arafat dan Mina, dan pemimpin salat haji mempersingkatnya jika ia berasal dari Mekah." }
summary:
  ar: "سئل مالك عن صلاة أهل مكة بعرفة ومنى، وعن أمير الحاج إن كان من أهل مكة. فقال يصلي أهل مكة بعرفة ومنى ما أقاموا بهما ركعتين ركعتين، يقصرون الصلاة حتى يرجعوا إلى مكة. وأمير الحاج إذا كان من أهل مكة يقصر بعرفة وأيام منى. أما من سكن منى أو عرفة مقيما فإنه يتم الصلاة بالمكان الذي يسكنه. {cite:muwatta-maruf-1997 p.539}"
  tr: "Malik'e Mekke halkının Arafat ve Mina'daki namazları ve Hac liderinin Mekke'li olması durumunda namaz kılma şekli soruldu. Şöyle dedi: Mekke halkı Arafat ve Mina'da ikişer rekat namaz kılarlar ve Mekke'ye dönene kadar namazı kısaltırlar. Hac lideri de, eğer Mekke'li ise, Arafat'ta ve Mina günlerinde namazı kısaltır. Mina veya Arafat'ta daimi ikamet edenler ise, ikamet ettikleri yerde tam namaz kılarlar. {cite:muwatta-maruf-1997 s.539}"
  id: "Malik ditanya tentang salat penduduk Mekah di Arafat dan Mina, dan tentang pemimpin haji jika ia berasal dari Mekah. Beliau berkata: Penduduk Mekah salat dua rakaat sekaligus ketika berada di Arafat dan Mina, mempersingkat salat hingga mereka kembali ke Mekah. Pemimpin haji, jika ia berasal dari Mekah, juga mempersingkat salat di Arafat dan selama hari-hari di Mina. Adapun mereka yang menetap di Mina atau Arafat, mereka melaksanakan salat lengkap di tempat mereka tinggal. {cite:muwatta-maruf-1997 p.539}"
