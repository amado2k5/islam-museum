label: { ar: "الموطأ 1199 — مالك: أهل مكة يصلون بعرفة ومنى ركعتين ركعتين، ويقصر أمير الحاج إن كان من أهل مكة", en: "Muwatta 1199" }
summary:
  ar: "سئل مالك عن صلاة أهل مكة بعرفة ومنى، وعن أمير الحاج إن كان من أهل مكة. فقال يصلي أهل مكة بعرفة ومنى ما أقاموا بهما ركعتين ركعتين، يقصرون الصلاة حتى يرجعوا إلى مكة. وأمير الحاج إذا كان من أهل مكة يقصر بعرفة وأيام منى. أما من سكن منى أو عرفة مقيما فإنه يتم الصلاة بالمكان الذي يسكنه. {cite:muwatta-maruf-1997 p.539}"
