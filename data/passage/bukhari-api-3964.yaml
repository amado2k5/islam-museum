text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، قَالَ كَتَبْتُ عَنْ يُوسُفَ بْنِ الْمَاجِشُونِ، عَنْ صَالِحِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، فِي بَدْرٍ. يَعْنِي حَدِيثَ ابْنَىْ عَفْرَاءَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3964، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3964 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3964، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
