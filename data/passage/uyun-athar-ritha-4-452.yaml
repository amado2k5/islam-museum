text: "… في ثواب من قدم ولداً رقم وإسناده حسن من دفنه حتى أنكرنا قلوبَنا. بي.. وفي حديث عنه : أنا فرطّ لأمتي، لن يُصابوا بمثلي. وقال أبو سفيان بن الحارث بن عبد المطلب يرثيه : أرقتُ فباتَ ليلي لا يزولُ وأسعدني …"
summary:
  ar: "مقطع من عيون الأثر في فنون المغازي والشمائل والسير، المجلد المصوَّر 4، ص 452، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, scan volume 4, p. 452, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "عیون الاثر فی فنون المغازی والشمائل والسیر، اسکین جلد 4، ص 452 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
