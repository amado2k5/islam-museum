label: { ar: "صحيح البخاري 3110 — الحلال، الحرام", en: "Sahih al-Bukhari 3110 — the lawful; the unlawful", ur: "صحیح بخاری 3110 — حلال، حرام", es: "Sahih al-Bukhari 3110 — lo lícito; lo ilícito", fr: "Sahih al-Bukhari 3110 — le licite; l'illicite" }
text: "… هَذَا وَأَنَا يَوْمَئِذٍ مُحْتَلِمٌ فَقَالَ \" إِنَّ فَاطِمَةَ مِنِّي، وَأَنَا أَتَخَوَّفُ أَنْ تُفْتَنَ فِي دِينِهَا \". ثُمَّ ذَكَرَ صِهْرًا لَهُ مِنْ بَنِي عَبْدِ شَمْسٍ، فَأَثْنَى عَلَيْهِ فِي مُصَاهَرَتِهِ إِيَّاهُ قَالَ \" حَدَّثَنِي فَصَدَقَنِي، وَوَعَدَنِي فَوَفَى لِي، وَإِنِّي لَسْتُ أُحَرِّمُ حَلاَلاً وَلاَ أُحِلُّ حَرَامًا، وَلَكِنْ وَاللَّهِ لاَ تَجْتَمِعُ بِنْتُ رَسُولِ اللَّهِ وَبِنْتُ عَدُوِّ اللَّهِ أَبَدًا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3110، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 3110 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 3110، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3110 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona lo lícito y lo ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 3110 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
