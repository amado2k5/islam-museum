text: "… خَبرٌ والجبَر لا يدخلُه النسخُ، قلنا : لم يُنَخ منه الخيرُ، وإنما نُسخَ منه الحكم، فإنَّ خُكمْ القرآن أنْ يُتْلَى فى الصَّلاءِ، وأنْ لا يَمَّه. إلاّ طاهر، وأن يكُتَبَ بين اللَّوْحَيْن، وأن يكون تلُّه من فُروض. الكِناية، فكل ما نُسخَ، …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 205، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 205, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 205 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Rawd al-Unuf de al-Suhayli, volumen 3, pág. 205, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre « al-Rawd al-Unuf » d'al-Suhayli (tome 3, p. 205) mentionnant la collection du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suhayli'nin \"El-Ravd El-Enf\" adlı eserinin 3. resimli cildinin 205. sayfasında, Kur'an'ın derlenmesi ve el yazmalarından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre yaklaşık kırk kelimeden oluşan metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Rawd Al-Anf karya Al-Suhayli, jilid bergambar 3, halaman 205, menyebutkan kompilasi Al-Qur'an dan manuskripnya; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
