text: "… خَبرٌ والجبَر لا يدخلُه النسخُ، قلنا : لم يُنَخ منه الخيرُ، وإنما نُسخَ منه الحكم، فإنَّ خُكمْ القرآن أنْ يُتْلَى فى الصَّلاءِ، وأنْ لا يَمَّه. إلاّ طاهر، وأن يكُتَبَ بين اللَّوْحَيْن، وأن يكون تلُّه من فُروض. الكِناية، فكل ما نُسخَ، …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 205، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 205, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 205 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
