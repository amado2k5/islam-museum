text: |-
  ٦٨
  ⁦(باب الباء)⁩
  موضع بضم الشين وفتح العين قال جرير بهجو العباس بن يزيدالكندى
  أعبداسل فى شعبى غريبا • ألو حالا أبالك واغترايا
  وشعبعب موضع قال الشاعر
  هل أجعلنّ يدى للمد مرفقة * على شعبعب بين الحموض والعطن
  وقولهم شعب الامبررءولا الى موضع كذا أى أرسله ⁦( غب )⁩ الشغب بالتسكين تهيج
  لشرّ وهوشغب الجندولا يقسال شغب ( ١ ت قول شغبت عليهم وشغبت بم-م وشغبتهم كله
  بمعتى ويقال للتحوص اذا وحت واستصعبت على الجأب انهاذات شغب وضغن قال أبو
  زبيديرتى ابن أخته
  كان عنى يرددرؤك بعد اللّٰه شغب المستصعب المريد
  وشغبت عليهم بالكسر أشغب شغبا لخة ضعيفة فيه وشغب أيضا بالتحريك اسم امرأة
  لا يتصرف فى المعرفة وشاغبه فهوشفاب ومشغب وشغب ومشغ ( غزب لشغزبية
  ضرب من الحيلة فى الصراع وهى أن تلوى رجله برجلك تقول شغزسه شغزبة وأخذته
  بالشغزبية قال ذوالرمة وليس بين أقوامى فكل * أعتله السغازب والمحالا
  ⁦( قب)⁩ الشقب بالكسر كالغار أوكالئق فى الجبل والجمع شقبة وشقاب وشقوب
  ابن السكيت عن أبى عمروشب وشقب بالكسر والفتح قال وهو مكان مطمتن اذا أشرفت
  عليه ذهب فى الارض قال والشقاب اللهوب وهو مهوى بين الجبلين والشوقب الرجل
  الطويل⁦( قحطب)⁩ كبش شقحطب أى ذوقرنين منكرين كأنه شق حطب ( ذب
  لشنب حدة فى الاسنان ويقال برد وعذوية وامرأة شنباءبينة الشذب قال الجرمى "معت
  الاصمعى يقول الشنب برد الفم والاسنان فقلت إنّ أصحابنا يقولون هو حدّتها حين تطلع
  فيراد يذلك حدائتها وطراءتها لانها اذا أنت عليها السنون احتكت فقدل ماهو الابردها
  وقول ذى الرمة
  لمياء فى شفتيها - وقلعس * وفى اللثات وفى أنيابه ائنب
  يؤيدقول الاصمعى لان اللثة لا تكون فيهاحدة (شوب الشوب الخلط وقدشبت الشئ
  أشويه فهو مشوب وقول الشاعر
  سكفيف ضرب القوم لحم معرّص * وماءقدور فى القصاع مشيب
  انمابناء على شيب الذى لم يسم فاعله أى مخلوط بالتوابل والصباغ وقولهم ماعنده شوب ولا
  روب أى لامرق ولا لبن وفى المثل (هو يشوبويروب يضرب لن يخلط فى القول أوالعمل
  والشياب اسم ما يمزج وشابة فى شعرأبى ذؤيب اسم جبل بنجد والشائبة واحدة الشواتب
  وهى الاقذاروالادناس ( هب الشهبة فى الالوان البياض الذى غلب على السواد
  وقد شهب الشئ بالكسر شهبا وأشتهب الرأس وفرس آشهب وقد اشهب اشهباباواشهاب
  اشهيبابا مثله وغرّة شهباء وهو أن يكون فى غرة الفرس شعر يخالف الساض واشهاب
  الزرع اذا هاج وبقى فى خلاله شئ أخضر ويقال لليوم ذى الريح الباردة والمقيع أشهب
  والليلة شهباء وكتيبة شهباعلبياض الحديد والنصل الاشهب الذى بردفذهب سواده
  والشهاب شعلة نارساطعة وإنّ فلانالشهاب حرب اذا كان ماضيافيها والجمع شهب وشهبان
  أيضاءن الاخفس مثل حساب وحسبان والشهاب اللبن الضياح والشوهب المقنفذ
  ⁦(شهرب)⁩
