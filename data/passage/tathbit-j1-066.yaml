label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٢١، المقطع ١ من ٣", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 21, section 1 of 3", ur: "تثبیت دلائل نبوت — حصہ اول، باب 21، حصہ 1" }
text: "في الشعاب، ومنهم من يقتل، ولا يمكنهم المقام معه بمكة فيهربون بأديانهم ويعبرون البحار، والنبي مقيم بمكة معه أبو بكر ونفر يسير. وكان يخرج في المواسم إلى العرب، ويتلو القرآن، ويدعو إلى الله، ويقيم الحجة؛ وقريش من أهل …"
summary:
  ar: "مقطع من الباب ٢١ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 21 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 21 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
