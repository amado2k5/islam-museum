label: { ar: "الموطأ 2633 — بلغ مالكا: بعثت لأتمم حسن الأخلاق", en: "Muwatta 2633", es: "Muwatta 2633", fr: "Muwatta 2633", ur: "موطا 2633", tr: "El-Muvatta 2633 — Malik dedi ki: Ben güzel ahlakı mükemmelleştirmek için gönderildim.", id: "Al-Muwatta 2633 — Malik berkata: Aku diutus untuk menyempurnakan akhlak yang baik." }
summary:
  ar: "بلغ مالكا أن رسول الله قال: بُعثت لأتمم حسن الأخلاق. ويذكر المحقق قول ابن عبد البر أن الحديث يتصل من طرق صحاح عن أبي هريرة وغيره، وأن رواية محمد بن عجلان عن أبي هريرة حسنة لا ترتقي إلى الصحة إلا بالمتابعة. {cite:muwatta-maruf-1997 p.490}"
  tr: "Malik, Resulullah'ın şöyle buyurduğunu rivayet etmiştir: \"Ben güzel ahlakı mükemmelleştirmek için gönderildim.\" Araştırmacı, İbn Abdül-Barr'ın hadisin Ebu Hurayra ve diğerlerinden sağlam rivayet zincirleriyle bağlantılı olduğunu ve Muhammed ibn Ajlan'ın Ebu Hurayra'dan rivayetinin iyi olduğunu, ancak ancak teyit yoluyla sahihlik seviyesine ulaştığını belirttiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.490}"
  id: "Malik meriwayatkan bahwa Rasulullah SAW bersabda: “Aku diutus untuk menyempurnakan akhlak yang baik.” Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut terhubung melalui sanad yang sahih dari Abu Hurairah dan lainnya, dan bahwa riwayat Muhammad bin Ajlan dari Abu Hurairah baik tetapi tidak mencapai tingkat keabsahan kecuali melalui penguat. {cite:muwatta-maruf-1997 p.490}"
