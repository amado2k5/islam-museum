  ar: "بلغ مالكا أن رسول الله قال: بُعثت لأتمم حسن الأخلاق. ويذكر المحقق قول ابن عبد البر أن الحديث يتصل من طرق صحاح عن أبي هريرة وغيره، وأن رواية محمد بن عجلان عن أبي هريرة حسنة لا ترتقي إلى الصحة إلا بالمتابعة. {cite:muwatta-maruf-1997 p.490}"
