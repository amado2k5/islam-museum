label:
  ar: "الترمذي 2088 — الحمى ناري أسلطها على عبدي المؤمن"
  en: "Tirmidhi 2088 — Fever is My fire that I set on My believing servant"
  ur: "ترمذی 2088 — بخار میری آگ ہے جسے میں اپنے مومن بندے پر مسلط کرتا ہوں"
text: "أبشر فإن الله يقول هي ناري أسلطها على عبدي المذنب لتكون حظه من النار . حدثنا إسحاق بن منصور قال أخبرنا عبد الرحمن بن مهدي عن سفيان الثوري عن هشام بن حسان عن الحسن قال كانوا يرتجون الحمى ليلة كفارة …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2088: الحمى ناري أسلطها على عبدي المؤمن. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2088: Fever is My fire that I set on My believing servant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2088: بخار میری آگ ہے جسے میں اپنے مومن بندے پر مسلط کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
