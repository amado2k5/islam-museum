label: { ar: "جامع الترمذي 2611 — الشهادة والصلاة والزكاة، ركن من أركان الإيمان", en: "Jami' al-Tirmidhi 2611 — the testimony, the prayer and the zakat; one of the articles of faith", ur: "جامع ترمذی 2611 — شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن", es: "Jami' al-Tirmidhi 2611 — el testimonio, la oración y el zakat; uno de los artículos de fe", fr: "Jami' al-Tirmidhi 2611 — le témoignage, la prière et la zakat; un des articles de foi" }
text: "… عَنْكَ وَنَدْعُو إِلَيْهِ مَنْ وَرَاءَنَا. فَقَالَ \" آمُرُكُمْ بِأَرْبَعٍ الإِيمَانِ بِاللَّهِ ثُمَّ فَسَّرَهَا لَهُمْ شَهَادَةَ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنِّي رَسُولُ اللَّهِ وَإِقَامَ الصَّلاَةِ وَإِيتَاءَ الزَّكَاةِ وَأَنْ تُؤَدُّوا خُمْسَ مَا غَنِمْتُمْ \". حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَبِي جَمْرَةَ، عَنِ ابْنِ عَبَّاسٍ، عَنِ النَّبِيِّ مِثْلَهُ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2611، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2611 (The Book on Faith), that mentions the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2611، جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2611 (El Libro de la Fe), menciona el testimonio, la oración y el zakat, uno de los artículos de fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2611 (Le Livre de la Foi), mentionne le témoignage, la prière et la zakat, piliers de la foi. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
