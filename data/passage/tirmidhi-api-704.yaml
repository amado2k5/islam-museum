label: { ar: "جامع الترمذي 704 — المستحب", en: "Jami' al-Tirmidhi 704 — the recommended (mustahabb)", ur: "جامع ترمذی 704 — مستحب", fr: "Jami' al-Tirmidhi 704 — le recommandé (mustahabb)", es: "Yami' al-Tirmidhi 704 — lo recomendado (mustahabb)" }
text: "حَدَّثَنَا هَنَّادٌ، حَدَّثَنَا وَكِيعٌ، عَنْ هِشَامٍ، بِنَحْوِهِ إِلاَّ أَنَّهُ قَالَ قَدْرُ قِرَاءَةِ خَمْسِينَ آيَةً. قَالَ وَفِي الْبَابِ عَنْ حُذَيْفَةَ. قَالَ أَبُو عِيسَى حَدِيثُ زَيْدِ بْنِ ثَابِتٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَبِهِ يَقُولُ الشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ اسْتَحَبُّوا تَأْخِيرَ السُّحُورِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 704، يرد فيه ذكر المستحب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 704 (The Book on Fasting), whose wording mentions the recommended (mustahabb). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 704، جس کے الفاظ میں مستحب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 704, dont le texte mentionne le recommandé (mustahabb). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 704, cuyo texto menciona lo recomendado (mustahabb). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
