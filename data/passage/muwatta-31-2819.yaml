label: { ar: "الموطأ 2819 — أبو هريرة: الكلمة يهوي بها صاحبها في النار أو يرفعه الله بها في الجنة", en: "Muwatta 2819", es: "Muwatta 2819", fr: "Muwatta 2819", ur: "موطا 2819", tr: "El-Muvatta 2819 — Ebu Hurayra: Bir söz, onu söyleyenin cehenneme düşmesine veya Allah tarafından cennete yükseltilmesine sebep olabilir.", id: "Al-Muwatta 2819 — Abu Hurairah: Sebuah kata dapat menyebabkan orang yang mengucapkannya jatuh ke Neraka atau diangkat oleh Tuhan ke Surga." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار، عن أبي صالح السمان، أنه أخبره أن أبا هريرة قال: إن الرجل ليتكلم بالكلمة لا يلقي لها بالا، فيهوي بها في نار جهنم، وإن الرجل ليتكلم بالكلمة لا يلقي لها بالا، فيرفعه الله بها في الجنة. ويذكر المحقق أن الحديث في الموطأ موقوف على أبي هريرة، وأن البخاري أخرجه مرفوعا من طريق عبد الرحمن بن عبد الله بن دينار، وأن الدارقطني قال إن الموقوف هو المحفوظ. {cite:muwatta-maruf-1997 p.582}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Ebu Salih el-Samman'dan rivayet ettiğine göre, Ebu Hurayra'nın şöyle dediğini nakletmiştir: \"Bir insan düşünmeden bir söz söyler ve bu onu cehenneme atar. Bir insan düşünmeden bir söz söyler ve Allah onu bu söz sayesinde cennete yükseltir.\" Araştırmacı, el-Muvatta'daki hadisin Ebu Hurayra'ya atfedildiğini, el-Buhari'nin ise bunu Abdülrahman ibn Abdullah ibn Dinar'ın rivayet zinciriyle Peygamberimize kadar uzanan bir hadis olarak naklettiğini belirtmektedir. El-Daraqutni, Ebu Hurayra'ya atfedilen versiyonun daha sahih olduğunu ifade etmiştir. {cite:muwatta-maruf-1997 s.582}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, dari Abu Salih al-Samman, bahwa ia diberitahu bahwa Abu Hurayrah berkata: “Seseorang dapat mengucapkan sebuah kata tanpa memikirkannya, dan itu akan menjerumuskannya ke dalam api neraka. Dan seseorang dapat mengucapkan sebuah kata tanpa memikirkannya, dan Allah akan mengangkatnya ke surga karenanya.” Peneliti menyebutkan bahwa hadits dalam al-Muwatta’ dinisbatkan kepada Abu Hurayrah, sedangkan al-Bukhari meriwayatkannya sebagai hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) melalui sanad Abd al-Rahman ibn Abdullah ibn Dinar. Al-Daraqutni menyatakan bahwa versi yang dinisbatkan kepada Abu Hurayrah adalah yang lebih sahih. {cite:muwatta-maruf-1997 p.582}"
