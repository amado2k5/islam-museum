label: { ar: "الموطأ 2819 — أبو هريرة: الكلمة يهوي بها صاحبها في النار أو يرفعه الله بها في الجنة", en: "Muwatta 2819" }
summary:
  ar: "يروي مالك عن عبد الله بن دينار، عن أبي صالح السمان، أنه أخبره أن أبا هريرة قال: إن الرجل ليتكلم بالكلمة لا يلقي لها بالا، فيهوي بها في نار جهنم، وإن الرجل ليتكلم بالكلمة لا يلقي لها بالا، فيرفعه الله بها في الجنة. ويذكر المحقق أن الحديث في الموطأ موقوف على أبي هريرة، وأن البخاري أخرجه مرفوعا من طريق عبد الرحمن بن عبد الله بن دينار، وأن الدارقطني قال إن الموقوف هو المحفوظ. {cite:muwatta-maruf-1997 p.582}"
