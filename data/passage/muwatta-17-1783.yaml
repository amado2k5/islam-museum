label: { ar: "الموطأ 1783 — مالك: لا بأس أن يبتاع العبد التاجر الفصيح بالأعبد من الحبشة أو من أجناس غيرهم، إلى أجل معلوم، إذا اختلف فبان اختلافه، ولا يأخذ اثنين بواحد إلى أجل إن تقاربا", en: "Muwatta 1783" }
summary:
  ar: "قال مالك: والأمر عندنا أنه لا بأس بأن يبتاع العبد التاجر الفصيح بالأعبد من الحبشة، أو من جنس من الأجناس ليسوا مثله في الفصاحة ولا في التجارة والنفاذ والمعرفة، إلى أجل معلوم، إذا اختلف فبان اختلافه. فإن أشبه بعض ذلك بعضا حتى يتقارب، فلا يأخذ منه اثنين بواحد إلى أجل، وإن اختلفت أجناسهم. {cite:muwatta-maruf-1997 p.130}"
