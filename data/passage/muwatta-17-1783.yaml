label: { ar: "الموطأ 1783 — مالك: لا بأس أن يبتاع العبد التاجر الفصيح بالأعبد من الحبشة أو من أجناس غيرهم، إلى أجل معلوم، إذا اختلف فبان اختلافه، ولا يأخذ اثنين بواحد إلى أجل إن تقاربا", en: "Muwatta 1783", es: "Muwatta 1783", fr: "Muwatta 1783", ur: "موطا 1783", tr: "El-Muvatta 1783 — Malik: Bir tüccarın, aralarında farklılık varsa ve bu farklılık açıkça belli oluyorsa, belirli bir süre için Habeşistanlı veya diğer ırklardan kölelerle birlikte, güzel konuşma yeteneğine sahip bir köle satın almasında bir sakınca yoktur. Değerleri birbirine yakınsa, belirli bir süre için iki köleyi bir köleyle değiştirmemelidir.", id: "Al-Muwatta 1783 — Malik: Tidak ada salahnya seorang pedagang membeli seorang budak yang fasih berbicara bersama budak-budak dari Abyssinia atau ras lain, untuk jangka waktu tertentu, jika mereka berbeda dan perbedaan mereka terlihat jelas. Ia tidak boleh mengambil dua budak untuk satu budak untuk jangka waktu tertentu jika nilai mereka hampir sama." }
summary:
  ar: "قال مالك: والأمر عندنا أنه لا بأس بأن يبتاع العبد التاجر الفصيح بالأعبد من الحبشة، أو من جنس من الأجناس ليسوا مثله في الفصاحة ولا في التجارة والنفاذ والمعرفة، إلى أجل معلوم، إذا اختلف فبان اختلافه. فإن أشبه بعض ذلك بعضا حتى يتقارب، فلا يأخذ منه اثنين بواحد إلى أجل، وإن اختلفت أجناسهم. {cite:muwatta-maruf-1997 p.130}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre, bir tüccarın, konuşma yeteneği güzel olan veya farklı bir ırktan olup konuşma, ticaret, nüfuz veya bilgi bakımından kendisine benzemeyen bir köleyi belirli bir süre için satın almasında bir sakınca yoktur; yeter ki aralarındaki fark açıkça belli olsun. Eğer birbirlerine o kadar benziyorlarsa ki neredeyse eşitlerse, ırkları farklı olsa bile, belirli bir süre için iki köleyi bir köle karşılığında satın almamalıdır. {cite:muwatta-maruf-1997 s.130}"
  id: "Malik berkata: Posisi kami adalah bahwa tidak ada yang salah dengan seorang pedagang membeli seorang budak yang fasih berbicara, atau dari ras yang berbeda, yang tidak seperti dirinya dalam hal berbicara, perdagangan, pengaruh, atau pengetahuan, untuk jangka waktu tertentu, jika mereka berbeda dan perbedaan itu menjadi jelas. Jika mereka mirip satu sama lain hingga hampir sama, maka ia seharusnya tidak membeli dua orang untuk satu orang untuk jangka waktu tertentu, meskipun ras mereka berbeda. {cite:muwatta-maruf-1997 p.130}"
