text: "… وأهله، وقيام شعائره، وقيل: لتكثِر شهادةُ البِقاع، فإن الذاهب إلى المسجد والمصلّى إحدى خطوتيه ترفعُ درجة، والأخرى تحطَّ خطيئة حتى يرجع إلى منزله، وقيل وهو الأصح: إنه لذلك كُلِّه، ولغيره من الحِكَم التي لا يخلو فعله عنها . التكبير من …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 148، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 148, that speaks of ranks raised, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 148 کا اقتباس جس میں درجات کی بلندی، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
