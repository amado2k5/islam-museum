summary:
  ar: "قال مالك في القوم يكاتبون جميعا فيجرح أحدهم جرحا فيه عقل: يُقال له وللذين معه في الكتابة: أدوا جميعا عقل ذلك الجرح. فإن أدوا ثبتوا على كتابتهم، وإن لم يؤدوا فقد عجزوا، ويخير سيدهم: إن شاء أدى عقل الجرح ورجعوا عبيدا له جميعا، وإن شاء أسلم الجارح وحده، ورجع الآخرون عبيدا له جميعا. {cite:muwatta-maruf-1997 p.353}"
