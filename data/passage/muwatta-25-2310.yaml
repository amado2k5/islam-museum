label: { ar: "الموطأ 2310 — مالك: القوم المكاتبون يجرح أحدهم جرحا فيه عقل", en: "Muwatta 2310", es: "Muwatta 2310", fr: "Muwatta 2310", ur: "موطا 2310", tr: "El-Muvatta 2310 — Malik: Azat sözleşmesi olan kişilerden biri yaralanırsa ve ondan kan parası alınması gerekiyorsa", id: "Al-Muwatta 2310 — Malik: Jika salah seorang dari orang yang memiliki kontrak pembebasan terluka, dan uang darah harus dibayarkan kepadanya" }
summary:
  ar: "قال مالك في القوم يكاتبون جميعا فيجرح أحدهم جرحا فيه عقل: يُقال له وللذين معه في الكتابة: أدوا جميعا عقل ذلك الجرح. فإن أدوا ثبتوا على كتابتهم، وإن لم يؤدوا فقد عجزوا، ويخير سيدهم: إن شاء أدى عقل الجرح ورجعوا عبيدا له جميعا، وإن شاء أسلم الجارح وحده، ورجع الآخرون عبيدا له جميعا. {cite:muwatta-maruf-1997 p.353}"
  tr: "Malik, yazılı bir sözleşmeyle birbirine bağlı bir grup insan hakkında şöyle demiştir: İçlerinden biri kan parası gerektiren bir yara alırsa, ona ve sözleşmedeki diğerlerine şöyle denir: \"Bu yara için kan parasını hepiniz ödemelisiniz.\" Eğer öderlerse, sözleşmeye bağlı kalırlar; ödemezlerse, yükümlülüklerini yerine getirmemiş olurlar ve efendilerinin bir seçeneği vardır: İsterse, yara için kan parasını öder ve hepsi tekrar kölesi olur; isterse, yarayı açan kişi tek başına İslam'ı kabul eder ve diğerleri tekrar kölesi olur. {cite:muwatta-maruf-1997 s.353}"
  id: "Malik berkata mengenai sekelompok orang yang semuanya terikat oleh perjanjian tertulis, dan salah seorang dari mereka menderita luka yang membutuhkan uang darah: Ia dan orang-orang yang bersamanya dalam perjanjian tersebut diberitahu: Kalian semua harus membayar uang darah untuk luka itu. Jika mereka membayar, mereka tetap terikat oleh perjanjian; jika tidak, mereka telah gagal memenuhi kewajiban mereka, dan tuan mereka memiliki pilihan: Jika ia mau, ia dapat membayar uang darah untuk luka tersebut, dan mereka semua kembali menjadi budaknya; atau jika ia mau, orang yang menyebabkan luka tersebut dapat masuk Islam saja, dan yang lainnya akan kembali menjadi budaknya. {cite:muwatta-maruf-1997 p.353}"
