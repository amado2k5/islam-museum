label: { ar: "الموطأ 1630 — مالك: الأمة تكون تحت العبد ثم تعتق قبل أن يدخل بها أو يمسها، إن اختارت نفسها فلا صداق لها وهي تطليقة", en: "Muwatta 1630", es: "Muwatta 1630", fr: "Muwatta 1630", ur: "موطا 1630", tr: "El-Muvatta 1630 — Malik: Bir kadın köle, erkek kölenin otoritesi altındadır; bu durumda, erkek köleyle evlilik gerçekleşmeden veya ona dokunmadan önce azat edilir. Eğer kadın kendi isteğiyle azat olmayı seçerse, mehir hakkı yoktur ve bu da boşanma anlamına gelir.", id: "Al-Muwatta 1630 — Malik: Seorang budak perempuan berada di bawah kekuasaan seorang budak laki-laki, kemudian ia dibebaskan sebelum budak tersebut melakukan hubungan suami istri atau menyentuhnya. Jika ia memilih untuk membebaskan diri, ia tidak berhak atas mahar, dan ini merupakan perceraian." }
summary:
  ar: "يقول مالك في الأمة تكون تحت العبد، ثم تعتق قبل أن يدخل بها أو يمسها، إنها إن اختارت نفسها فلا صداق لها، وهي تطليقة. وذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.73}"
  tr: "Malik, bir erkek kölenin vesayeti altında bulunan ve daha sonra erkek köle evliliği tamamlamadan veya kadına dokunmadan önce azat edilen bir kadın köle hakkında, eğer ayrılmayı seçerse, çeyiz hakkına sahip olmadığını ve bunun boşanma anlamına geldiğini söyler. Bu, bizim düşünce ekolümüzün görüşüdür. {cite:muwatta-maruf-1997 s.73}"
  id: "Malik mengatakan mengenai seorang budak perempuan yang berada di bawah perwalian seorang budak laki-laki, dan kemudian dibebaskan sebelum budak tersebut melakukan hubungan suami istri atau menyentuhnya, bahwa jika ia memilih untuk pergi, ia tidak berhak atas mahar, dan ini merupakan perceraian. Ini adalah keputusan menurut mazhab kami. {cite:muwatta-maruf-1997 p.73}"
