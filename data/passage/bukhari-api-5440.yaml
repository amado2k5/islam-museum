label: { ar: "صحيح البخاري 5440 — الأب والأبوة", en: "Sahih al-Bukhari 5440 — the father and fatherhood", ur: "صحیح بخاری 5440 — باپ اور والدیت", es: "Sahih al-Bukhari 5440 — El padre y la paternidad" }
text: "حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ جَعْفَرِ بْنِ أَبِي طَالِبٍما ـ قَالَ رَأَيْتُ النَّبِيَّ يَأْكُلُ الرُّطَبَ بِالْقِثَّاءِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5440، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5440 (Food, Meals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5440، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5440 (Comida, Comidas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
