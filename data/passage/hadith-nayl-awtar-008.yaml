text: "يه كيف وهو أمي لا يقرأ ، قال : فعلمها رسول الله عل ، فقال : هذا كتاب من رب العالمين بأسماء أهل الجنة وأسماء قبائلهم لا يزاد منهم ولا ينقص منهم ، وقال : فريق في الجنة ، وفريق"
