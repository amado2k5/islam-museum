label: { ar: "الموطأ 376 — بلاغ عن جابر: من لم يجد ثوبين فليصل في ثوب واحد ملتحفاً به", en: "Muwatta 376", es: "Muwatta 376", fr: "Muwatta 376", ur: "موطا 376", tr: "El-Muvatta 376 — Cabir'den rivayet edildiğine göre: İki elbise bulamayan kimse tek elbiseyle, ona sarınarak namaz kılsın.", id: "Al-Muwatta 376 — Diriwayatkan dari Jabir: Barangsiapa tidak menemukan dua pakaian, maka hendaklah ia shalat dengan satu pakaian, lalu membungkus dirinya dengan pakaian tersebut." }
text: "من لم يجد ثوبين فليصل في ثوب واحد ملتحفاً به، فإن كان الثوب قصيراً فليتزر به"
summary:
  ar: "بلاغ في باب الرخصة في الصلاة في الثوب الواحد: يروي مالك أنه بلغه عن جابر بن عبد الله أن النبي قال إن من لم يجد ثوبين فليصل في ثوب واحد ملتحفاً به، فإن كان الثوب قصيراً فليتزر به. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن جابراً كان يصلي في ثوب واحد لأنه رأى النبي يفعله كما في حديثه عند مسلم (2/62) وأحمد وابن خزيمة. {cite:muwatta-maruf-1997 p.203} {cite:muwatta-maruf-1997 p.204}"
  tr: "Tek elbise ile namaz kılmanın caizliğine dair bir rivayet: Malik, Cabir ibn Abdullah'tan Peygamberimizin şöyle buyurduğunu işittiğini aktarır: \"İki elbise bulamayan kimse tek elbise ile namaz kılsın, ona sarınsın. Elbise kısa ise onu bel örtüsü olarak kullansın.\" Araştırmacı, bunu Ebu Musab'ın Malik'ten rivayet ettiğini ve Cabir'in de Peygamberimizin tek elbise ile namaz kıldığını gördüğünü, bunun da Müslim'deki (2/62), Ahmed ve İbn Huzeyme'deki hadislerinde geçtiğini belirtir. {cite:muwatta-maruf-1997 s.203} {cite:muwatta-maruf-1997 s.204}"
  id: "Sebuah riwayat mengenai kebolehan shalat dengan sehelai pakaian: Malik meriwayatkan bahwa ia mendengar dari Jabir bin Abdullah bahwa Nabi bersabda, “Barangsiapa tidak dapat menemukan dua helai pakaian, hendaklah ia shalat dengan sehelai pakaian, dengan membungkus dirinya di dalamnya. Jika pakaian itu pendek, hendaklah ia menggunakannya sebagai kain penutup pinggang.” Peneliti menyebutkan bahwa Abu Musab meriwayatkannya dari Malik, dan bahwa Jabir biasa shalat dengan sehelai pakaian karena ia melihat Nabi melakukannya, sebagaimana disebutkan dalam haditsnya di Muslim (2/62), Ahmad, dan Ibn Khuzaymah. {cite:muwatta-maruf-1997 p.203} {cite:muwatta-maruf-1997 p.204}"
