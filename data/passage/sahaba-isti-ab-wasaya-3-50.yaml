text: "… الآن قدِ اتخذتُ سيفاً من خشب، ولزمتُ بيتي. فقال له عليٌّ : فأطع أخي وابن عمّي رسول اللّٰه الحلّة، وانصرفَ عنه. وقصَّته في القميص الَّذي كُفّن فيه رواها النَّاس، وفيها آية، وذلك أنه لما حضرته ألوفاة، قال : كفّنوني أخرجه …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 50، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 50, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 50 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 3, pág. 50, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre « al-Isti'ab » d'Ibn 'Abd al-Barr (tome 3, page 50) mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn Abdülbarr'ın resimli 3. cildinin 50. sayfasında yer alan el-İsti'ab adlı eserinden bir alıntı, ölüm ve ölüm anı, defin, mezar ve istirahat yerinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, miraslar, antikalar ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 3 bergambar, halaman 50, menyebutkan saat kematian dan proses sekarat, penguburan, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
