text: "… مثنى بن الصباح غير قوي وقد تابعه على هذه الرواية عبد اللّٰه بن لهيعة عن عمرو. انظر البيهقي. إذا زنى بأمرأة حرمت على أبيه، وابنه، وحرمت عليه أمها، وابنتها كما لو وطئها بشبهة، أو حلالاً، ولو وطىء أم امرأته، أو …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 145، يذكر الحلال، وما حُرّم، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 145, that mentions the lawful, what was made unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 145 کا اقتباس جس میں حلال، جو حرام کیا گیا، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
