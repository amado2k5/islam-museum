label: { ar: "الموطأ 1812 — مالك: بيع البطيخ والقثاء والخربز والجزر جائز إذا بدا صلاحه، ويكون للمشتري ما ينبت حتى ينقطع ثمره، وإذا أصابته جائحة تبلغ الثلث فصاعدا وضعت عن المشتري", en: "Muwatta 1812", es: "Muwatta 1812", fr: "Muwatta 1812", ur: "موطا 1812", tr: "El-Muvatta 1812 — Malik: Karpuz, salatalık, kavun ve havuç satmak, olgun göründükleri takdirde caizdir. Alıcı, meyve olgunlaşana kadar yetişen kısma hak kazanır. Eğer meyvenin üçte birine veya daha fazlasına ulaşan bir musibet meydana gelirse, alıcı zarardan muaf tutulur.", id: "Al-Muwatta 1812 — Malik: Menjual semangka, mentimun, melon, dan wortel diperbolehkan jika tampak matang. Pembeli berhak atas hasil panen hingga buah tersebut habis. Jika terjadi musibah yang mengakibatkan kerugian sepertiga atau lebih, maka kerugian tersebut dihapuskan bagi pembeli." }
summary:
  ar: "قال مالك: والأمر عندنا في بيع البطيخ والقثاء والخزبز والجزر، أن بيعه إذا بدا صلاحه حلال جائز. ثم يكون للمشتري ما ينبت حتى ينقطع ثمره ويهلك، وليس في ذلك وقت يؤقت، لأن وقته معروف عند الناس. وربما دخلته العاهة فقطعت ثمرته قبل أن يأتي ذلك الوقت. فإذا دخلته العاهة بجائحة تبلغ الثلث فصاعدا، كان ذلك موضوعا عن الذي ابتاعه. {cite:muwatta-maruf-1997 p.141} {cite:muwatta-maruf-1997 p.142}"
  tr: "Malik şöyle dedi: Karpuz, salatalık, kavun ve havuç satışına ilişkin uygulamamız, hasat için hazır hale geldiklerinde satışlarının caiz olmasıdır. Alıcı, ürün olgunlaşıp ölene kadar ürünün mülkiyetini elinde tutar. Olgunlaşma süresi genellikle bilindiğinden, bunun için sabit bir zaman dilimi yoktur. Ancak bazen, meyvenin bu süre gelmeden önce çürümesine neden olan bir hastalık ortaya çıkabilir. Eğer hastalık ürünün üçte birini veya daha fazlasını etkilerse, alıcı zarardan sorumlu tutulamaz. {cite:muwatta-maruf-1997 s.141} {cite:muwatta-maruf-1997 s.142}"
  id: "Malik berkata: Praktik kami mengenai penjualan semangka, mentimun, melon, dan wortel adalah bahwa penjualan diperbolehkan setelah terlihat siap panen. Pembeli kemudian tetap memiliki kepemilikan atas hasil panen tersebut hingga matang dan mati. Tidak ada jangka waktu tetap untuk ini, karena periode pematangan umumnya diketahui. Namun, terkadang, penyakit hawar dapat terjadi, menyebabkan buah mati sebelum waktu tersebut tiba. Jika penyakit hawar menyerang sepertiga atau lebih dari hasil panen, pembeli dibebaskan dari tanggung jawab atas kerugian tersebut. {cite:muwatta-maruf-1997 p.141} {cite:muwatta-maruf-1997 p.142}"
