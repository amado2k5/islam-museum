label: { ar: "الموطأ 1812 — مالك: بيع البطيخ والقثاء والخربز والجزر جائز إذا بدا صلاحه، ويكون للمشتري ما ينبت حتى ينقطع ثمره، وإذا أصابته جائحة تبلغ الثلث فصاعدا وضعت عن المشتري", en: "Muwatta 1812" }
summary:
  ar: "قال مالك: والأمر عندنا في بيع البطيخ والقثاء والخزبز والجزر، أن بيعه إذا بدا صلاحه حلال جائز. ثم يكون للمشتري ما ينبت حتى ينقطع ثمره ويهلك، وليس في ذلك وقت يؤقت، لأن وقته معروف عند الناس. وربما دخلته العاهة فقطعت ثمرته قبل أن يأتي ذلك الوقت. فإذا دخلته العاهة بجائحة تبلغ الثلث فصاعدا، كان ذلك موضوعا عن الذي ابتاعه. {cite:muwatta-maruf-1997 p.141} {cite:muwatta-maruf-1997 p.142}"
