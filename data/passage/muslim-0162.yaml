label: { ar: "مسلم 162 — حديث المعراج الطويل ⁦(مالك بن صعصعة)⁩", en: "Muslim 162 — The long Mi'raj report (Malik ibn Sa'sa'a)", es: "Muslim 162 — El largo informe Mi'raj (Malik ibn Sa'sa'a)", fr: "Muslim 162 — Le long rapport de Mi'raj (Malik ibn Sa'sa'a)", ur: "مسلم 162 - طویل معراج رپورٹ ⁦(مالک بن صاعع)⁩", tr: "Müslim 162 — Miraçla ilgili uzun hadis (Malik ibn Sa'sa'ah)", id: "Muslim 162 — Hadits panjang Isra Mi’raj (Malik bin Sa’sa’ah)" }
text: "قال رسول الله: «أتيت بالبراق وهو دابة أبيض طويل، فوق الحمار ودون البغل، يضع حافره عند منتهى طرفه» — ثم سيرة العروج سماءً سماء حتى فرض الصلوات الخمسين فردت إلى خمس"
summary:
  ar: "أطول نص لرحلة المعراج في الصحيحين؛ رواية ثابت البناني عن أنس عن مالك بن صعصعة عن أبي ذر في كتاب الإيمان. فيه البراق، واستفتاح أبواب السماوات، ولقاء آدم ويحيى وعيسى ويوسف وإدريس وهارون وموسى وإبراهيم، وسدرة المنتهى، وفرض الصلاة ثم التخفيف من خمسين إلى خمس بمراجعة موسى."
  tr: "Sahih kitaplarda (Buhari ve Müslim) Peygamberimizin Miraç gecesine dair en uzun anlatım, Sabit el-Bunani'nin Enes'ten, o da Malik ibn Sasa'dan, o da Ebu Zer'den rivayet ettiği ve İman Kitabı'nda yer alan rivayettir. Bu rivayette Burak kıssası, cennet kapılarının açılması, Adem, Yahya, İsa, Yusuf, İdris, Harun, Musa ve İbrahim'in buluşması, En Yüksek Sınırdaki Sidre Ağacı (Sidrat el-Muntaha), namazın ilk farzı ve Musa'nın isteği üzerine namazın elli vakitten beş vakite indirilmesi gibi olaylar yer almaktadır."
  id: "Kisah terpanjang tentang Perjalanan Malam Nabi (Isra dan Mi'raj) dalam dua kitab Sahih (Bukhari dan Muslim) diriwayatkan oleh Thabit al-Bunani berdasarkan riwayat Anas, Malik ibn Sa'sa'ah, dan Abu Dharr, dalam Kitab Iman. Kisah ini mencakup cerita al-Buraq, terbukanya pintu-pintu Surga, pertemuan Adam, Yohanes, Isa, Yusuf, Idris, Harun, Musa, dan Ibrahim, Pohon Sidrat al-Muntaha, kewajiban awal shalat, dan pengurangannya dari lima puluh menjadi lima atas permintaan Musa."
