label: { ar: "مسلم 162 — حديث المعراج الطويل (مالك بن صعصعة)", en: "Muslim 162 — The long Mi'raj report (Malik ibn Sa'sa'a)" }
text: "قال رسول الله: «أتيت بالبراق وهو دابة أبيض طويل، فوق الحمار ودون البغل، يضع حافره عند منتهى طرفه» — ثم سيرة العروج سماءً سماء حتى فرض الصلوات الخمسين فردت إلى خمس"
summary:
  ar: "أطول نص لرحلة المعراج في الصحيحين؛ رواية ثابت البناني عن أنس عن مالك بن صعصعة عن أبي ذر في كتاب الإيمان. فيه البراق، واستفتاح أبواب السماوات، ولقاء آدم ويحيى وعيسى ويوسف وإدريس وهارون وموسى وإبراهيم، وسدرة المنتهى، وفرض الصلاة ثم التخفيف من خمسين إلى خمس بمراجعة موسى."
