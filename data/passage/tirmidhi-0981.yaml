label:
  ar: "الترمذي 981 — غفرت لعبدي ما بين طرفي الصحيفة"
  en: "Tirmidhi 981 — I have forgiven My servant what lies between the two ends of the record"
  ur: "ترمذی 981 — میں نے اپنے بندے کا وہ سب معاف کیا جو صحیفے کے دونوں کناروں کے درمیان ہے"
text: "ما من حافظين رفعا إلى الله ما حفظا من ليل أو نهار فيجد الله في أول الصحيفة وفي آخر الصحيفة خيرا إلا قال الله تعالى أشهدكم أني قد غفرت لعبدي ما بين طرفى الصحيفة ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 981: غفرت لعبدي ما بين طرفي الصحيفة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 981: I have forgiven My servant what lies between the two ends of the record. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 981: میں نے اپنے بندے کا وہ سب معاف کیا جو صحیفے کے دونوں کناروں کے درمیان ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
