label:
  ar: "الترمذي 981 — غفرت لعبدي ما بين طرفي الصحيفة"
  en: "Tirmidhi 981 — I have forgiven My servant what lies between the two ends of the record"
  ur: "ترمذی 981 — میں نے اپنے بندے کا وہ سب معاف کیا جو صحیفے کے دونوں کناروں کے درمیان ہے"
  es: "Tirmidhi 981 — He perdonado a Mi siervo lo que hay entre los dos extremos del registro"
  fr: "Tirmidhi 981 — J’ai pardonné à Mon serviteur ce qui se trouve entre les deux extrémités du livre"
  tr: "Tirmizi 981 — Kulumu, tomarın iki ucu arasında kalan kısım için bağışladım."
  id: "Tirmidhi 981 — Aku telah mengampuni hamba-Ku atas apa yang ada di antara kedua ujung gulungan itu"
text: "ما من حافظين رفعا إلى الله ما حفظا من ليل أو نهار فيجد الله في أول الصحيفة وفي آخر الصحيفة خيرا إلا قال الله تعالى أشهدكم أني قد غفرت لعبدي ما بين طرفى الصحيفة ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 981: غفرت لعبدي ما بين طرفي الصحيفة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 981: I have forgiven My servant what lies between the two ends of the record. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 981: میں نے اپنے بندے کا وہ سب معاف کیا جو صحیفے کے دونوں کناروں کے درمیان ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 981: He perdonado a Mi siervo lo que se encuentra entre los dos extremos del registro. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 981: « J’ai pardonné à Mon serviteur ce qui se trouve entre les deux extrémités du Livre. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 981: \"Aku telah mengampuni hamba-Ku atas apa yang ada di antara kedua ujung gulungan.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun kumpulan hadits qudsi memuat riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta'."
