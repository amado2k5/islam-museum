text: "قُلْ إِنِّى نُهِيتُ أَنْ أَعْبُدَ ٱلَّذِينَ تَدْعُونَ مِن دُونِ ٱللَّهِ ۚ قُل لَّآ أَتَّبِعُ أَهْوَآءَكُمْ ۙ قَدْ ضَلَلْتُ إِذًا وَمَآ أَنَا۠ مِنَ ٱلْمُهْتَدِينَ"
text_search: "قل إني نهيت أن أعبد الذين تدعون من دون الله ۚ قل لا أتبع أهواءكم ۙ قد ضللت إذا وما أنا من المهتدين"
translations:
  en: { text: "Say: I am forbidden to worship those on whom ye call instead of Allah. Say: I will not follow your desires, for then should I go astray and I should not be of the rightly guided.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(اے پیغمبر! کفار سے) کہہ دو کہ جن کو تم خدا کے سوا پکارتے ہو مجھے ان کی عبادت سے منع کیا گیا ہے۔ (یہ بھی) کہہ دو کہ میں تمہاری خواہشوں کی پیروی نہیں کروں گا ایسا کروں تو گمراہ ہوجاؤں اور ہدایت یافتہ لوگوں میں نہ رہوں", translator: "Fateh Muhammad Jalandhari", license: PD }
