text: "… سَمِعَ سُفْيَانَ بْنَ أَبِي زُهَيْرٍ، وَهُوَ رَجُلٌ مِنْ أَزْدِ شَنُوءَةَ مِنْ أَصْحَابِ رَسُولِ اللَّهِ وَهُوَ يُحَدِّثُ نَاسًا مَعَهُ عِنْدَ بَابِ الْمَسْجِدِ فَقَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنِ اقْتَنَى كَلْبًا لاَ يُغْنِي عَنْهُ زَرْعًا وَلاَ ضَرْعًا نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". قَالَ آنْتَ سَمِعْتَ هَذَا مِنْ رَسُولِ اللَّهِ فَقَالَ إِي وَرَبِّ هَذَا الْمَسْجِدِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1774، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 1774 (General Subjects), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 1774، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1774 (Temas generales), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un rapport du Muwatta Malik, n° 1774 (Sujets généraux), mentionne une qirat perdue chaque jour au détriment de la récompense. Le Livre des Hasanat et Sayyi'at la répertorie avec les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Malik'in Muvatta'sında yer alan 1774 numaralı hadiste, her gün sevabın bir kırat (bir ağırlık birimi) azalacağından bahsedilir. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesinde yer almaktadır."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1774, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Hal ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
