label: { ar: "صحيح البخاري 6810 — ما يرتفع معه الإيمان حين الفعل", en: "Sahih al-Bukhari 6810 — what faith is lifted by at the moment of the act", ur: "صحیح بخاری 6810 — وہ عمل جس کے وقت ایمان اٹھ جاتا ہے", es: "Sahih al-Bukhari 6810 — lo que eleva la fe en el momento del acto", fr: "Sahih al-Bukhari 6810 — Quelle foi est renforcée au moment de l'acte", tr: "Sahih el-Buhari 6810 — Bir insan amel ettiğinde imanı yükselten nedir?", id: "Sahih al-Bukhari 6810 — Apa yang meningkatkan iman ketika seseorang beramal" }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، عَنِ الأَعْمَشِ، عَنْ ذَكْوَانَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ \" لاَ يَزْنِي الزَّانِي حِينَ يَزْنِي وَهْوَ مُؤْمِنٌ، وَلاَ يَسْرِقُ حِينَ يَسْرِقُ وَهْوَ مُؤْمِنٌ، وَلاَ يَشْرَبُ حِينَ يَشْرَبُهَا وَهْوَ مُؤْمِنٌ، وَالتَّوْبَةُ مَعْرُوضَةٌ بَعْدُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6810، يذكر ما يرتفع معه الإيمان حين الفعل. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6810 (Limits and Punishments set by Allah (Hudood)), that mentions what faith is lifted by at the moment of the act. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6810، جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6810 (Límites y castigos establecidos por Alá (Hudud)), menciona qué se ve afectado por la fe en el momento de cometer el acto. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 6810 (Limites et Châtiments fixés par Allah (Hudood)), mentionne ce qui entraîne la suspension de la foi au moment de l'acte. Le Navigateur des Piliers et des Branches de la Foi répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux piliers de la foi, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih el-Buhari'de 6810 numaralı hadis, kişinin imanını yükselten amellerden bahseder. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6810, menyebutkan amalan-amalan yang meninggikan iman seseorang. Hadits ini disusun oleh seorang peneliti yang mengkaji rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
