label: { ar: "صحيح البخاري 6870 — بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 6870 — dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 6870 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 6870 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos" }
text: "… بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ فِرَاسٍ، عَنِ الشَّعْبِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، عَنِ النَّبِيِّ قَالَ \" الْكَبَائِرُ الإِشْرَاكُ بِاللَّهِ، وَعُقُوقُ الْوَالِدَيْنِ \". أَوْ قَالَ \" الْيَمِينُ الْغَمُوسُ \". شَكَّ شُعْبَةُ. وَقَالَ مُعَاذٌ حَدَّثَنَا شُعْبَةُ قَالَ \" الْكَبَائِرُ الإِشْرَاكُ بِاللَّهِ، وَالْيَمِينُ الْغَمُوسُ، وَعُقُوقُ الْوَالِدَيْنِ \". أَوْ قَالَ \" وَقَتْلُ النَّفْسِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6870، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6870 (Blood Money (Ad-Diyat)), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6870، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6870 (Dinero de sangre (Ad-Diyat)), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
