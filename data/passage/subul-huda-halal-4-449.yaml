text: "… -- - يوم فتح مكة : إِن هذا البلد حرَّمه اللّه يومَ خلق السموات والأَرض والشمسَ والقمر ووضع هذين الأَخْشَبَيْنِ، فهو حرام بحُرْمَةِ اللّٰه تعالى إِلى يوم القيامة،، وإنه لم يحل القتال فيه لأَحدٍ قَبْل ولا يحل لأَحد بَعْرِي، ولم …"
