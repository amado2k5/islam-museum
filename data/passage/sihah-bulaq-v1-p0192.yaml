text: |-
  وإذا تكون كريهة أدعى لها * واذايحاس الحيس يدحى جندب
  ثم شبهت به العرب حتى قالو المن أحدقت به الاماء فى طرفيه محبوس قال الراجز
  قدحيس هذا الدين عندى حيسا والحواسة الهاعة من الناس المختلطة والحواسات
  الابل انجتمعة قال الفرزدق
  حواسات العشاء خيعثنات * اذا النكاء عارضت الشمالا
  ويروى العشاء يفتح العين ويجعل الحواسة من الحوس وهو الا كل والدوس هذا قول بعضهم
  صل الخاء ( بس خبست الشى أخذته وغنمته ورجل خياس أى غذام
  واختبست الشئء اذا أخذته مغالبة وأسدخبوس وأنشد أبومهدى لابى زبيد
  ولكنى ضبارمة جوح • على الاقران مجترئ خبوس
  والخباسة بالضم المغنم وما تخيست من شئ خنبس، الخنابس السكريه المنظرويقال
  للاسدخفابس والانثى خنابسة وليل خنابس شديد الظلمة وأماقول القطامى
  فقسالواعليك ابن الزبير فعذيه * أبى اللّٰه أن أخزى وعزخنايس
  فيقال هو القديم الثابت خدرس الخندريس الجرسميت بذلك اقدمها ومنه قيل
  حفطة خندريس للعتيقة خرس الخرس بالفتح الدن ويقال للذى يعمله خرّاس
  والحرس بالضم طعام الولادة قال الشاعر
  كل الطعام تشتهى ربيعه • الحرس والاعذار والنقبعه
  وأما طعام النفساء نفسها فهى الخرسنة يقال خرّست على المرأة تخر بسا اذا أطعمت
  فى ولادتها وقد خرست هى أى جعل لها الدرس قال الشاعر
  اذا النفساء لم تخزس ببكرها • غلاما ولم يسكت بحترفطمها
  والحتر الشى الحقير القليل أى ليس لهسم شي يطعمون الصبى من شدة الازمة وأماقول
  الشاعر يصف قوما بقلة الظير شركم حاضر وخيركم در خروس من الارانب بكر
  فيقال هى البكر فى أول حلها ويقال هى التى تعمل لها اخرسة وانخرس بالتحريك مصدر
  الاخرص وآخرسه اللّٰه وكتيبة خرماء هى التى لاتسمع لهاصونا من وقارهم فى الحرب وقال
  أبو عسدهى التى صمتت من كثرة الدروع ليست اهاقعاقع وابن أخرم أى خاثر لاصوت له
  فى الاناء وسحابة خرساء ليس فيهار عد ولا برق وعلم أخرس اذالم يسمع فى الجبل صوت صدى
  والاخرغماس السكوت والنسبة الى خراسان خرسى وخراسى وخراسانى ويقال هم خرسان
  كمايقال سودان و بيضان وصنه قول بشار فى البيت من خرسان لاتعاب يعنى بنانه
  (خسس الخسيس الدنىء قال ابن السكبت يقال أخسست اخساسا اذافعات فعلا
  خسيسا وخسست بعدى بالكسرخسة وخاسة اذا كان فى نفسه خسيا عن الفزاء.
  وخسر نصيه يخسه بالضم اذا جعله خيا وأخسسته وجدته خيسا واستخه أى عدّه
  خسيسا وانلخس بالفتح بقلة والخس بالضم اسم رجل ومنه هندبنت الجس ويقال رفعت من
  خسيسته اذا فعات به فعلا يكون فيه رفعته وخسيسة الفاقة أسنانهادون الاثناء يقال.
  .١١٣
  ضحاح.
