text: "… من تحف النوادر المحفوظة بالخزانة الزكية لواقفها حضرة صاحب السعادة الأستاذ أحمد زكى باشا، ويقع فى صفحة ويظهر أنه ناقص من آخره، ولم يعلم كاتبد غير أنه نابت من - -"
