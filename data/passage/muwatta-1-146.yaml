label: { ar: "الموطأ 146 — ما يحل للرجل من امرأته وهي حائض: لتشد عليها إزارها", en: "Muwatta 146", es: "Muwatta 146", fr: "Muwatta 146", ur: "موطا 146", tr: "El-Muvatta 146 — Bir erkeğin karısı adetliyken karısıyla yapması caiz olan şey: belindeki bezini sıkmak", id: "Al-Muwatta 146 — Apa yang diperbolehkan bagi seorang pria terhadap istrinya ketika istrinya sedang haid: mengencangkan kain pinggang istrinya" }
text: "لتشد عليها إزارها، ثم شأنك بأعلاها"
summary:
  ar: "أول حديث في باب ما يحل للرجل من امرأته وهي حائض. يرويه يحيى عن مالك عن زيد بن أسلم مرسلاً: سأل رجل النبي عما يحل له من امرأته وهي حائض، فأجابه بأن تشد عليها إزارها ثم له ما فوق ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي، وينقل عن ابن عبد البر أنه لا يعلم أحداً رواه مسنداً بهذا اللفظ وأن معناه صحيح ثابت ⁦(التمهيد 5/260)⁩. {cite:muwatta-maruf-1997 p.102} {cite:muwatta-maruf-1997 p.103}"
  tr: "Bu hadis, bir erkeğin karısı adetliyken onunla ne yapmasının caiz olduğu konusundaki bölümün ilk hadisidir. Yahya'nın Malik'ten, o da Zeyd ibn Aslam'dan rivayet ettiği mursal bir hadiste şöyle buyurulmuştur: Bir adam Peygamberimize, karısı adetliyken onunla ne yapmasının caiz olduğunu sormuş, Peygamberimiz de şöyle cevap vermiştir: \"Kadın belini sıkmalıdır, ondan sonra da ne gerekiyorsa yapabilir.\" Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. İbn Abd el-Barr'ın ise bu hadisi bu ifadeyle rivayet eden bir isnad zinciri bilmediğini ve anlamının sahih ve sabit olduğunu söylediğini aktarmaktadır (el-Temhid 5/260). {cite:muwatta-maruf-1997 s.102} {cite:muwatta-maruf-1997 s.103}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diperbolehkan bagi seorang pria dengan istrinya saat istrinya sedang haid. Hadits ini diriwayatkan oleh Yahya dari Malik dari Zayd ibn Aslam, dalam hadits mursal: Seorang pria bertanya kepada Nabi tentang apa yang diperbolehkan baginya dengan istrinya saat istrinya sedang haid, dan beliau menjawab bahwa istrinya hendaknya mengencangkan kain pinggangnya, dan kemudian dia boleh melakukan apa pun yang lebih dari itu. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa ia tidak mengetahui siapa pun yang meriwayatkan hadits ini dengan sanad menggunakan redaksi seperti ini, dan bahwa maknanya sahih dan telah terbukti (al-Tamhid 5/260). {cite:muwatta-maruf-1997 p.102} {cite:muwatta-maruf-1997 p.103}"
