text: "لتشد عليها إزارها، ثم شأنك بأعلاها"
summary:
  ar: "أول حديث في باب ما يحل للرجل من امرأته وهي حائض. يرويه يحيى عن مالك عن زيد بن أسلم مرسلاً: سأل رجل النبي عما يحل له من امرأته وهي حائض، فأجابه بأن تشد عليها إزارها ثم له ما فوق ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي، وينقل عن ابن عبد البر أنه لا يعلم أحداً رواه مسنداً بهذا اللفظ وأن معناه صحيح ثابت (التمهيد 5/260). {cite:muwatta-maruf-1997 p.102} {cite:muwatta-maruf-1997 p.103}"
