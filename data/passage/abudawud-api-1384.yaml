label: { ar: "سنن أبي داود 1384 — الأب والأبوة", en: "Sunan Abi Dawud 1384 — the father and fatherhood", ur: "سنن ابی داؤد 1384 — باپ اور والدیت" }
text: "حَدَّثَنَا حَكِيمُ بْنُ سَيْفٍ الرَّقِّيُّ، أَخْبَرَنَا عُبَيْدُ اللَّهِ، - يَعْنِي ابْنَ عَمْرٍو - عَنْ زَيْدٍ، - يَعْنِي ابْنَ أَبِي أُنَيْسَةَ - عَنْ أَبِي إِسْحَاقَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الأَسْوَدِ، عَنْ أَبِيهِ، عَنِ ابْنِ مَسْعُودٍ، قَالَ قَالَ لَنَا رَسُولُ اللَّهِ \" اطْلُبُوهَا لَيْلَةَ سَبْعَ عَشْرَةَ مِنْ رَمَضَانَ وَلَيْلَةَ إِحْدَى وَعِشْرِينَ وَلَيْلَةَ ثَلاَثٍ وَعِشْرِينَ \". ثُمَّ سَكَتَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1384، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1384 (Prayer (Kitab Al-Salat): Detailed Injunctions about Ramadan), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1384، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
