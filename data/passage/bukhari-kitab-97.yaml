label:
  ar: "صحيح البخاري، كتاب التوحيد"
  en: "Sahih al-Bukhari, Book 97: Oneness, Uniqueness of Allah (Tawheed)"
  ur: "صحیح بخاری، کتاب التوحید"
  es: "Sahih al-Bukhari, Libro 97: Unidad, unicidad de Allah (Tawhid)"
  fr: "Sahih al-Bukhari, Livre 97: Unicité, Unicité d'Allah (Tawhid)"
summary:
  ar: "القسم 97 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التوحيد»، ويضم فيها النصوص من 7371 إلى 7563 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 97 of Sahih al-Bukhari (Oneness, Uniqueness of Allah (Tawheed)) in the division of the open hadith dataset the museum took its reports from: reports 7371 to 7563 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 97، عنوان «کتاب التوحید»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7371 تا 7563۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 97 de Sahih al-Bukhari (Unicidad de Dios (Tawhid)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 7371 al 7563, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (L'Unicité d'Allah - Tawhid), dans le recueil ouvert Sahih al-Bukhari: les hadiths 7371 à 7563. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
