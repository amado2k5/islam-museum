label: { ar: "نوادر جحا الكبرى، ص 54 — «هو أخبرني بموته»", en: "Nawadir Juha al-Kubra, p. 54 — 'He Told Me of His Death'", ur: "نوادر جحا الکبریٰ، ص 54 — «هو نے مجھے اپنی موت کی خبر دی»", fr: "Nawadir Juha al-Kubra, p. 54 — « C'est lui qui m'a annoncé sa mort »", es: "Nawadir Juha al-Kubra, p. 54 — «Él mismo me anunció su muerte»" }
text: "… هو أخبرني بموته بينما كان في خارج البلدة توهَّم أنَّهُ مات. فأنتظر مدةً فلم يأتِ أحدٌ يرفعُ"
summary:
  ar: "ظن جحا أنه مات وهو خارج البلدة، فعاد إلى بيته جائعًا وأخبر زوجته أنه مات وأين مات، فنُحَت عليه وقالت للجيران إن الذي أخبرها بموته قد عاد إلى المكان الذي مات فيه. {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  en: "Believing himself dead outside town, Juha goes home hungry and tells his wife that he died and where; she mourns and tells the neighbours that the man who told her of his death has gone back to where he died. {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  ur: "جحا نے شہر کے باہر خود کو مرا ہوا سمجھا، بھوکا گھر لوٹا اور بیوی کو بتایا کہ وہ مر گیا ہے اور کہاں مرا؛ بیوی نے ماتم کیا اور پڑوسیوں سے کہا کہ جس نے مجھے اس کی موت کی خبر دی تھی وہ واپس اسی جگہ چلا گیا جہاں وہ مرا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  fr: "Se croyant mort hors de la ville, Juha rentre chez lui affamé et dit à sa femme qu'il est mort et où; elle le pleure et dit aux voisins que l'homme qui lui a annoncé sa mort est retourné à l'endroit où il est mort. {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  es: "Creyéndose muerto fuera de la ciudad, Juha vuelve a casa hambriento y le dice a su mujer que murió y dónde; ella lo llora y les dice a los vecinos que el hombre que le anunció su muerte ha vuelto al lugar donde murió. {cite:juha-nawadir-kubra-djuwaydi p. 54}"
