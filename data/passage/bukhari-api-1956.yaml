label: { ar: "صحيح البخاري 1956 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 1956 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 1956 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 1956 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 1956 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، حَدَّثَنَا الشَّيْبَانِيُّ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ أَبِي أَوْفَى ـ قَالَ سِرْنَا مَعَ رَسُولِ اللَّهِ وَهْوَ صَائِمٌ، فَلَمَّا غَرَبَتِ الشَّمْسُ قَالَ \" انْزِلْ، فَاجْدَحْ لَنَا \". قَالَ يَا رَسُولَ اللَّهِ، لَوْ أَمْسَيْتَ. قَالَ \" انْزِلْ، فَاجْدَحْ لَنَا \". قَالَ يَا رَسُولَ اللَّهِ، إِنَّ عَلَيْكَ نَهَارًا. قَالَ \" انْزِلْ، فَاجْدَحْ لَنَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1956، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1956 (Fasting), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 1956، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 1956 (El ayuno), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 1956 (Le jeûne), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés aux nations, religions, sectes et peuples non musulmans."
