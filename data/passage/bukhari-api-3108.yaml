text: "حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الْوَهَّابِ، حَدَّثَنَا أَيُّوبُ، عَنْ حُمَيْدِ بْنِ هِلاَلٍ، عَنْ أَبِي بُرْدَةَ، قَالَ أَخْرَجَتْ إِلَيْنَا عَائِشَةُا ـ كِسَاءً مُلَبَّدًا وَقَالَتْ فِي هَذَا نُزِعَ رُوحُ النَّبِيِّ. وَزَادَ سُلَيْمَانُ عَنْ حُمَيْدٍ عَنْ أَبِي بُرْدَةَ قَالَ أَخْرَجَتْ إِلَيْنَا عَائِشَةُ إِزَارًا غَلِيظًا مِمَّا يُصْنَعُ بِالْيَمَنِ، وَكِسَاءً مِنْ هَذِهِ الَّتِي يَدْعُونَهَا الْمُلَبَّدَةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3108، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3108 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3108، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
