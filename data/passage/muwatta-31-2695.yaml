label: { ar: "الموطأ 2695 — أنس بن مالك: عمر يأكل صاعا من التمر حتى يأكل حشفها", en: "Muwatta 2695", es: "Muwatta 2695", fr: "Muwatta 2695", ur: "موطا 2695", tr: "El-Muvatta 2695 — Enes bin Malik: Ömer, olgunlaşmamış hurmaları da yiyene kadar bir sa' hurma yerdi.", id: "Al-Muwatta 2695 — Anas bin Malik: Umar biasa makan satu sa' kurma sampai ia memakan kurma yang belum matang." }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك أنه قال: رأيت عمر بن الخطاب، وهو يومئذ أمير المؤمنين، يُطرح له صاع من تمر فيأكله حتى يأكل حشفها. {cite:muwatta-maruf-1997 p.522}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan, o da Enes ibn Malik'ten rivayet eder ki: \"O zamanlar Müminlerin Emiri olan Ömer ibn el-Hattab'ı gördüm. Ona bir ölçek hurma sunuldu ve o, olgunlaşmamış olanları bile yedi.\" {cite:muwatta-maruf-1997 s.522}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha, dari Anas ibn Malik, yang berkata: Aku melihat Umar ibn al-Khattab, yang saat itu adalah Amirul Mukminin, ditawari segenggam kurma, dan beliau memakan semuanya, bahkan yang belum matang. {cite:muwatta-maruf-1997 p.522}"
