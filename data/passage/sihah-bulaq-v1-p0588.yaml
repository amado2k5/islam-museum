text: |-
  ⁦(فصل الرا.)⁩
  ⁦(ريب)⁩
  ٥٣
  والتذنوب البسر الدى قدبد أفيه الارطاب من قبل ذنبه وقدذنيت البسرة فهى مذنبة
  وتذنب المعتمّ أى ذذب عمامته وذلك اذا أفضل منهاشينا فأرحاه كالذنب والذنوب الفرس
  الطويل الذنب والذنوب النصيب والذنوب لحم أسفل المتن والذنوب الدلوالملاى ماء
  وقال ابن السكيت فيها ماء قريب من الملء نؤنث وتذكر ولا يقال لها وهى فارغسة ذنوب
  والجمع فى أدنى العدد أذنبة والمكثير ذنائب مشل قلوص وقلائص والذنب الجرم وقد
  أذنب الرحل والذنيان بالتحريك نبت⁦( ذوب)⁩ذاب الشيذوب ذوبا وذو بانانقيض جد
  وأذابه غيره وذو به بمعى وذابت الشمس اشستدحرها قال ذوالرمة
  اذاذابت الشمس انقى صقراتها * بأفنان عربوع الصرية معبل
  والذوب مافى أبيات النحل من العسل والاذواب والاذوابة الزبدحين يجعل فى البرمسة ليطبخ
  بمنا أبوزيد الاذابة الاغارة يقسال أذاب علينا بنو فلان أى أغاروا قال ومنه قول بشمر
  كانوا كذات القدرلم تدر إذغلت * أتتركها مذمومة أم تذيبها أى تنهه
  وقال غيره تثبتها من قولهم ذاب لى عليه من الحق كذا اذا وجب عليه وثيت وقال الاصمعى
  هو من ذاب نقيض جمد وأصل المثل فى الزبد يقال مايدرى أيخترأم يذيب أى لايدرى
  أيتركها خاثرة أم يذيبها وذلك اذا خاف أن يفسد الاذواب ابن السكيت الذاب العيب
  مثل الذام والذيم والذان ⁦(ذهب)⁩ الذهب معروف وربما أنت والقطعة منه ذهبة
  ويجمع على الاذهاب والذه وب والذهب أيضا مكيال لاهل اليمن معروف والجع أذهاب
  وجمع الجم-ع أذاهب عن أبى عبيد وذهب الرجل بالسكسراذارأى ذهبا فى المعدن فبرق
  بصره من عظمه فى عينه قال الراجز
  ذهب لما أن رآهائر مله * وقال ياقوم رأيت منكره * شذرة وادور أيت الزهره
  والمذاهب سيور تموّه بالذهب وكل شى موّه بالذهب فهو مذهب والفاعل مذهب والاذهاب
  والسذهيب واحد وهو التمويه بالذهب ويقال كيت مذهب للذى تعاوحرته صفرة قاذا
  اشستدت حرته ولم تعله صفرة فه والمدقى والذهاب المرور يقال ذهب فلان ذها باوذهوبا
  وأذهبه غبره وذهب ذلان مذهبا حسنا وقوله-م يه مذهب يعنون به الوسوسة في الماء وكثرة
  استعماله فى الوضو والذهبة بالمكسر المطرة والمع الذهاب قال البعيث
  وذى أشر كالا تحوان تشوقه * ذهاب الصباوالمعصرات الدوالح
  صل الرا أب أبت الانا شعبته وأصلحته ومنه قولهم اللهمّ ارأب بينهم
  أى أصلح قال كعب بن زهير
  طعناطعنة حراءفيهم * حرام رأبها-قى الممات .
  والرؤية قطعة من الخشب يشعب بها الاناه والجمع رئاب ومنمسمى رؤية بن العجاج بن
  رؤية قال أمية يصف السماء
  سراة صلاية خلقا صيغت * تزلّ الشمس ايس لهارئاب
  أى صدوع
  ورتاب اسم رجل ⁦(ربب)⁩ ربّ كلنئ مالكه والرب اسم من أسماء اللّٰه عزوجل
  ولا يقسال فى غيره الابالاضافة وقد قالوه فى الجاهلية للملك قال الحرث بن حلزة
  ١٤
  محاح
  فول تنهبم اضبطه بالقسلم بعضهم
  بضم الناء وعليه فيكون من
  الاخاب أى تصيير هانهبا لمن
  أغار عليها فحرره
  قال بعض أئمة اللغة والصرف
  ان عدى الذهاب بألباء فعناء
  الاذهاب أو بعلى فعناه النسيان
  أوبعن فالنرك أوبالى فالتوجه
  اه محثى وبق التعدية بنى
