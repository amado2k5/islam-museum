label: { ar: "الموطأ 364 — عائشة: لم يصل صلاة الليل قاعداً حتى أسن", en: "Muwatta 364", es: "Muwatta 364", fr: "Muwatta 364", ur: "موطا 364", tr: "Al-Muwatta 364 — Aişe: Yaşlanıncaya kadar gece namazını oturarak kılmadı.", id: "Al-Muwatta 364 — Aisyah: Dia tidak mengerjakan salat Maghrib sambil duduk sampai dia tua" }
text: "فكان يقرأ قاعداً، حتى إذا أراد أن يركع قام فقرأ نحواً من ثلاثين أو أربعين آية ثم ركع"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب ما جاء في صلاة القاعد في النافلة: لم تر النبي يصلي صلاة الليل قاعداً قط حتى أسنّ، فكان يقرأ قاعداً حتى إذا أراد أن يركع قام فقرأ نحواً من ثلاثين أو أربعين آية ثم ركع. ويخرّجه المحقق عند البخاري (1118) والطحاوي وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/121). {cite:muwatta-maruf-1997 p.199} {cite:muwatta-maruf-1997 p.200}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, dalam surah tentang apa yang diriwayatkan mengenai shalat duduk saat shalat sunnah: Nabi (shalawat dan salam kepadanya) tidak pernah terlihat shalat malam sambil duduk sampai beliau tua. Beliau membaca Al-Qur'an sambil duduk, dan ketika hendak rukuk, beliau berdiri dan membaca sekitar tiga puluh atau empat puluh ayat, kemudian rukuk. Editor memasukkannya dalam karyanya tentang al-Bukhari (1118), al-Tahawi, Ahmad, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/121). {cite:muwatta-maruf-1997 p.199} {cite:muwatta-maruf-1997 p.200}"
