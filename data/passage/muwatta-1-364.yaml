label: { ar: "الموطأ 364 — عائشة: لم يصل صلاة الليل قاعداً حتى أسن", en: "Muwatta 364" }
text: "فكان يقرأ قاعداً، حتى إذا أراد أن يركع قام فقرأ نحواً من ثلاثين أو أربعين آية ثم ركع"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب ما جاء في صلاة القاعد في النافلة: لم تر النبي يصلي صلاة الليل قاعداً قط حتى أسنّ، فكان يقرأ قاعداً حتى إذا أراد أن يركع قام فقرأ نحواً من ثلاثين أو أربعين آية ثم ركع. ويخرّجه المحقق عند البخاري (1118) والطحاوي وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/121). {cite:muwatta-maruf-1997 p.199} {cite:muwatta-maruf-1997 p.200}"
