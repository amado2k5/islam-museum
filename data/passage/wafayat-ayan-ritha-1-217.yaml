text: "… ما نفعني بطني قط إلا تلك الليلة. قلت : فهذا أصل المثل في قولهم أردت عمراً وأراد اللّه خارجة. وإلى هذا أشار أبو محمد عبد المجيد بن عبدون الأندلسي في قصيدته التي رثى بها بني الأفطس ملوك بطليوس وأولها : …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 1، ص 217، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Wafayat al-A'yan wa-Anba' Abna' al-Zaman, scan volume 1, p. 217, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "وفایت الاعیان و انبا ابنا الزمان، اسکین جلد 1، ص 217 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volume numérisé 1, p. 217, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volumen escaneado 1, p. 217, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Çağın Önemli Şahsiyetlerinin Biyografileri ve Haberleri), Resimli Cilt 1, s. 217'den, vefat etmiş bir kişi için yazılmış bir ağıt ve övgü metni içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgü metinlerinin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Biografi Tokoh Terkemuka dan Berita Putra-Putra Zaman), Jilid Bergambar 1, hlm. 217, berisi elegi dan eulogi untuk orang yang telah meninggal; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan eulogi paling terkenal."
