text: "… فى قراءة ابى عمرو بامالة فتحة النون من الناس فى موضع الجر حيث وقع وهى رواية ابى عبد الرحمن وابى حمدون وابن سعدان عن اليزيدى واقرأنى غيره بالفتح وهى رواية احمد ابن جُبير عن اليزيدى وبه كان يأخذ ابن مجاهد …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 70، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 70, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 70 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Taysir fi al-Qira'at al-Sab' de al-Dani, volumen 1, pág. 70, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Taysir fi al-Qira'at al-Sab' d'al-Dani, volume 1, page 70, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'a\" (Yedi Kıraat'ın Kolaylaştırılması) adlı eserinin 1. cildinin 70. sayfasından, Kur'an kıraatleri ve okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an kıraatleri, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Jilid 1, halaman 70, yang menyebutkan bacaan Al-Quran dan para qarinya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
