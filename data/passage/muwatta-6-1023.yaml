label: { ar: "الموطأ 1023 — مالك في آية المائدة: يا أيها الذين آمنوا لا تقتلوا الصيد وأنتم حرم، ومن قتله منكم متعمداً فجزاء مثل ما قتل من النعم يحكم به ذوا عدل منكم هدياً بالغ الكعبة أو كفارة طعام مساكين أو عدل ذلك صياماً ليذوق وبال أمره", en: "Muwatta 1023", es: "Muwatta 1023", fr: "Muwatta 1023", ur: "موطا 1023", tr: "El-Muvatta 1023 — Malik, Maide ayeti üzerine: Ey iman edenler! İhramlı iken av hayvanı öldürmeyin. Kim kasten öldürürse, cezası, aranızdan iki adil adamın belirleyeceği bir hayvan kurbanı, Kâbe'ye adak olarak veya fakirlere yemek yedirerek kefaret olarak veya oruç tutarak olacaktır; böylece yaptığı işin cezasını tadacaktır.", id: "Al-Muwatta 1023 — Malik tentang ayat Al-Ma'idah: Wahai orang-orang yang beriman, janganlah kamu membunuh hewan buruan ketika kamu sedang dalam keadaan ihram. Dan barang siapa di antara kamu membunuh hewan buruan dengan sengaja, maka hukumannya adalah setara dengan sebagian hewan ternak, sebagaimana diputuskan oleh dua orang yang adil di antara kamu, sebagai persembahan kepada Ka'bah, atau penebusan memberi makan orang fakir miskin, atau setara dengan puasa, sehingga dia dapat merasakan akibat dari perbuatannya." }
summary:
  ar: "قال مالك مستشهداً بقول الله تعالى في سورة المائدة: يا أيها الذين آمنوا لا تقتلوا الصيد وأنتم حرم، ومن قتله منكم متعمداً فجزاء مثل ما قتل من النعم يحكم به ذوا عدل منكم هدياً بالغ الكعبة [[passage/quran-5-95|المائدة 95]]. فالذي يصيد الصيد وهو حلال ثم يقتله وهو محرم بمنزلة الذي يبتاعه وهو محرم ثم يقتله، وقد نهى الله عن قتله، فعليه جزاؤه. والأمر عندنا أن من أصاب الصيد وهو محرم حُكم عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1155–1156). {cite:muwatta-maruf-1997 p.478}"
  tr: "Malik, Maide Suresi'ndeki şu ayeti aktarmıştır: \"Ey iman edenler! İhramlı iken av hayvanı öldürmeyin. Sizden kim kasten öldürürse, cezası, aranızdan iki adil adamın belirleyeceği kurbanlık hayvanlardan bir miktardır; bunlar Kâbe'ye getirilecektir.\" [Maide 5:95]. Açıklamasına göre, ihramlı iken av hayvanı avlayıp öldüren kişi, ihramlı iken av hayvanı satın alıp öldüren kişi gibidir; çünkü Allah av hayvanı öldürmeyi yasaklamıştır. Bu nedenle cezasını çekmelidir. Bizim görüşümüze göre, ihramlı iken av hayvanı öldüren kişi bir hükme tabidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1155-1156) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.478}"
  id: "Malik mengutip ayat dalam Surah Al-Ma'idah: \"Wahai orang-orang yang beriman, janganlah kamu membunuh hewan buruan ketika kamu sedang dalam keadaan ihram. Dan barangsiapa di antara kamu membunuh hewan buruan dengan sengaja, maka hukumannya adalah setara dengan hewan kurban, sebagaimana diputuskan oleh dua orang yang adil di antara kamu, untuk dibawa ke Ka'bah\" [Al-Ma'idah 5:95]. Beliau menjelaskan bahwa orang yang berburu hewan buruan ketika dalam keadaan ihram dan kemudian membunuhnya sama seperti orang yang membeli hewan buruan ketika dalam keadaan ihram dan kemudian membunuhnya, karena Allah telah melarang pembunuhannya. Oleh karena itu, ia harus menanggung hukumannya. Menurut mazhab kami, siapa pun yang membunuh hewan buruan ketika dalam keadaan ihram dikenai hukum. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1155–1156). {cite:muwatta-maruf-1997 p.478}"
