label: { ar: "الموطأ 1023 — مالك في آية المائدة: يا أيها الذين آمنوا لا تقتلوا الصيد وأنتم حرم، ومن قتله منكم متعمداً فجزاء مثل ما قتل من النعم يحكم به ذوا عدل منكم هدياً بالغ الكعبة أو كفارة طعام مساكين أو عدل ذلك صياماً ليذوق وبال أمره", en: "Muwatta 1023" }
summary:
  ar: "قال مالك مستشهداً بقول الله تعالى في سورة المائدة: يا أيها الذين آمنوا لا تقتلوا الصيد وأنتم حرم، ومن قتله منكم متعمداً فجزاء مثل ما قتل من النعم يحكم به ذوا عدل منكم هدياً بالغ الكعبة [[passage/quran-5-95|المائدة 95]]. فالذي يصيد الصيد وهو حلال ثم يقتله وهو محرم بمنزلة الذي يبتاعه وهو محرم ثم يقتله، وقد نهى الله عن قتله، فعليه جزاؤه. والأمر عندنا أن من أصاب الصيد وهو محرم حُكم عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1155–1156). {cite:muwatta-maruf-1997 p.478}"
