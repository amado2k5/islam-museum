text: |-
  ⁦(فصل الراء)⁩
  ٢٢٧
  رئدت المتاع أرثده رمدانضدته ووضعت بعضه على بعض أو الى جنب بعض والمتاع رئيد
  ومرتود قال ثعلبة بن صعير المازنى وذكوالظليم والنعامة وانه-مائذ كرابيضهما
  فى أدحيهما فأسرعا اليه
  فتذكراثقلارندا بعدما • ألقت ذكايمينها فى كافر
  والرثد بالتحريك متاع البيت المنضود بعضه على بعض والرند أيضاضعفة الناس يقسال تركنا
  على الماءرنداما يطيقون نحملا وأما الذير ليس عندهم ما يتحملون عليه فهم مرتندون
  وايسوا برثديق ال تركت بن فلان مرتندين ما تجملوابعد أى ناضدين متاعه-م قال ابن
  الحكيت ومنه اشتق هرئدوهواسم رجل والمردداسم من أ-عا،: الاسد والرئدة بالكسم
  جماعة من الناس يقيمون ولا يفاعنون الكسائى أرند القوم أى أقاموا واحتفر القوم حتى
  أرندوا أى بلغوا النرى ⁦(رجد)⁩أبوعمر والارجاد الارعاد يقال أرجد وا رعد بع-ى
  وأنشد أرجدرأ مشيخة عيصوم خد ) الرخود اللين العظام الكثير اللحم
  بقال رجل رخودّ الشباب ناعمه واهر أة رخودة ⁦( ردد )⁩ ردّه عن وجهه يردّه ردا
  ومرداصرفه وقال اللّٰه تعالى فلامردله وردّ عليه الشى أذا لم يقبله وكذلك اذا أخطأه
  وتقول ردّه الى منزله ورد اليه جوايا أى دجع والمردودة المطلقة والمردودة الموسى لانهاترد
  فى نصابها والمردود الردّ وهو مصدر مثل المحلوف والمعقول قال الشاعر
  لا يعدم السائلون اخير أفعله * إمانوالا وإماحسن مردود
  وشي رد أى ردىء وفى لسانه ردّأى حبسة وفى وجه-ه ردّة أى قبح مع شئ من الجمال وردده
  عليه وهما يترادان البيع من الردّ والفسخ وهذا الامر أردّ عليه أى أنفع له وهذا أمر
  لا رادة له أى لإفائدة له ولا رجوع والردّة بالكسر مصدرة ولك ردّه بردّهردا وردّة
  والردة الاسم من الارتداد والردة امتسلاء الضرع من اللبن قبل الشاج عن الاصمعى
  وأنشبدلابى النجم
  تمشى من الردقشى الحفل • مشى الروايا بالمزاد الاثقل
  قال وتقول منه أردّت الشاة وغيرها فهى مردّاذا أضرءت وجافلان مردّ الوجه أى
  غضبان ورجل مردّ أى شبق وبحر مردّأى كثير الموح ⁦( رشد)⁩ الرشاد خلاف الفى وقد
  رشدير شدرشداورشد بالكسرير شدرشد الغة فيه وأرشده اللّٰه والمراشدمقاصدالطرق
  والطريق الارشد نو الاقصدوتة ول هوار شدة خلاف قولك لزنيسة وأم راشدكنية
  الفأرة وينورشدان يطن من العرب ( رصد الراصد للشئ المراقب له تقول رصده
  يرصده رصداورصدا والترصد الترقب والرصيد السبع الذى يرصدليثب والرصود من الابل
  لتى ترصدشرب إلايل ثم تشرب هى وازص_د القوم يرصدون كالحرس يستوى فيه الواحد
  والجمع والمؤنث وربما قالوا أرصاد والمرصدموضع الرصد الاصمعى رصدته أرصده رصدا
  ترقبته وأرصدت له أعددت له والكسائى مثله وفى الجديث الا ان أرصده لدين على والمرصاد
