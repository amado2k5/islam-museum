text: "وقال وَهْبُ بن مُنَبِّه: إنَّ الله عزَّ وجلَّ ثمانيةَ عشر ألفَ عالَمِ، الدنيا عالَمٌ منها . وقال أبو سعيد الخدري: إنَّ لله أربعين ألفَ عالَم، الدنيا من شرقها إلى غربها عالَمٌ واحد."
summary:
  ar: "في فصل معنى «العالمين» ينقل القرطبي عن وهب بن منبه أن لله ثمانية عشر ألف عالم هذه الدنيا واحد منها، وعن أبي سعيد الخدري أربعين ألف عالم، وعن مقاتل ثمانين ألفاً؛ ثم يرجّح أن القول الأول في العموم أصح لشموله كل موجود، ويقول محقق الطبعة في الحاشية إن أخبار الأعداد ليست من الصحيح في شيء."
  en: "In his section on the meaning of 'the worlds', al-Qurtubi relays Wahb ibn Munabbih (eighteen thousand worlds, this one included), Abu Said al-Khudri (forty thousand) and Muqatil (eighty thousand), then prefers the broad reading, that the word covers everything that exists. The editor's footnote says the numerical reports are not sound in any respect."
  es: "En su sección sobre el significado de «los mundos», al-Qurtubi cita a Wahb ibn Munabbih (dieciocho mil mundos, incluido este), Abu Said al-Khudri (cuarenta mil) y Muqatil (ochenta mil), y luego prefiere la interpretación amplia, según la cual la palabra abarca todo lo que existe. La nota al pie del editor indica que los informes numéricos no son fiables en absoluto."
  fr: "Dans sa section consacrée à la signification du terme « mondes », al-Qurtubi rapporte les propos de Wahb ibn Munabbih (dix-huit mille mondes, celui-ci inclus), d'Abu Said al-Khudri (quarante mille) et de Muqatil (quatre-vingt mille), puis privilégie l'interprétation la plus large, selon laquelle ce terme englobe tout ce qui existe. La note de bas de page de l'éditeur précise que ces estimations numériques sont erronées à tous égards."
  ur: "القرطبی نے 'عالمین' کے معنی پر اپنے حصے میں وہب بن منابیح ⁦(اٹھارہ ہزار جہانیں، اس میں شامل ہیں)⁩، ابو سعید الخدری ⁦(چالیس ہزار)⁩ اور مقاتل ⁦(اسی ہزار)⁩ کو بیان کیا ہے، پھر وسیع مطالعہ کو ترجیح دیتے ہیں کہ یہ لفظ موجود تمام چیزوں کا احاطہ کرتا ہے۔ ایڈیٹر کا فوٹ نوٹ کہتا ہے کہ عددی رپورٹس کسی بھی لحاظ سے درست نہیں ہیں۔"
  tr: "Al-Qurtubi, “dünyalar”ın anlamı bölümünde, Wahb ibn Munabbih’in Allah’ın on sekiz bin dünyası olduğunu, bu dünyanın da bunlardan biri olduğunu söylediğini, Ebu Said el-Hudri’nin kırk bin dünyası olduğunu, Mukatil’in ise seksen bin dünyası olduğunu söylediğini aktarır; daha sonra ilk ifadenin genel olarak daha doğru olduğunu, çünkü var olan her şeyi kapsadığını öne sürer ve baskının editörü dipnotta sayısal rivayetlerin hiçbir şekilde doğru olmadığını belirtir."
  id: "Dalam bab tentang makna \"dunia\", Al-Qurtubi mengutip Wahb ibn Munabbih yang mengatakan bahwa Tuhan memiliki delapan belas ribu dunia, yang salah satunya adalah dunia ini, dan menurut Abu Saeed Al-Khudri, empat puluh ribu dunia, dan menurut Muqatil, delapan puluh ribu; kemudian ia menyarankan bahwa pernyataan pertama secara umum lebih tepat karena mencakup segala sesuatu yang ada, dan editor edisi tersebut mengatakan dalam catatan kaki bahwa laporan angka-angka tersebut sama sekali tidak benar."
