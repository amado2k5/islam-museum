label:
  ar: "الترمذي 3598 — دعوة المظلوم: وعزتي لأنصرنك ولو بعد حين"
  en: "Tirmidhi 3598 — The prayer of the wronged: by My might I shall help you, even after a while"
  ur: "ترمذی 3598 — مظلوم کی دعا: میری عزت کی قسم، میں تیری مدد کروں گا اگرچہ کچھ دیر بعد"
text: "ثلاثة لا ترد دعوتهم الصائم حتى يفطر والإمام العادل ودعوة المظلوم يرفعها الله فوق الغمام ويفتح لها أبواب السماء ويقول الرب وعزتي لأنصرنك ولو بعد حين . قال أبو عيسى هذا حديث حسن وسعدان القبي هو سعدان بن بشر . …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3598: دعوة المظلوم: وعزتي لأنصرنك ولو بعد حين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3598: The prayer of the wronged: by My might I shall help you, even after a while. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3598: مظلوم کی دعا: میری عزت کی قسم، میں تیری مدد کروں گا اگرچہ کچھ دیر بعد۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
