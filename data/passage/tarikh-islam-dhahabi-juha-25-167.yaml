text: "… عن يمينه رجل أقصر منه، وعن يساره صبيّ، فقال لي صالح : يا أبا نصر، تَبَّت. وقيل: كان ابن صالح مغفَّلًا، قال: فقلت: سألت اللّٰه أن يرزقني ولداً، فرزقني جَمَلًا. ولأبي عليَّ جَزَرَة نوادر ومُجُون، والله يرحمه. تُوُفي في شهر …"
