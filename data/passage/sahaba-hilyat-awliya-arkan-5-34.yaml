text: "… مسروق عن عبد اللّه. حدثنا الحسن بن على الوراق أنا عبد اللّٰه بن صالح ثنا ابن كاسب أنا عد بن خالد المخزومى ثنا سفيان عن زبيد عن أبى وائل عن عبد اللّٰه. أن النبى قال : الصبر نصف الايمان، واليقين …"
