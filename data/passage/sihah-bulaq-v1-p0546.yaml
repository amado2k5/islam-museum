text: |-
  فصل الكاف)
  ⁦(كب)⁩
  ٩٥
  أسداتما جراستخفره اذا باغت بك مكان كدا فبرتت قائبة من قوب أى أنابرى.
  من خفارتك والقوباء دا ممعروف يتقشرو يتسع بعالج باليق وهى مؤنثة لا تنصرف وجمعها
  توب وقال
  ياعجبالهذه الفليقه • هل تغابن القوبا الريقه
  وقد تسكن الواومنها استثقالا للحركة على الواوفان سكنتهاذكرت وصرفت والياءفي
  للالحاق بقرطاس والهمزة منقلبة منها قال ابن السكيت وايس فى الكلام فعلاء مضمومة
  الفامساكنة العيزم-دودة الاحرفان الخشاء وهو العظم الناتى وراء الاذن وقوباء قال
  والاصل فيهماتحريك العين خششاء وقوباء قال الجوهرى والمزاءعندى مثلهما فن قال قوباء
  بالتحريك قال فى تصغيره قويباء ومن سكن قال قويبى وتقول بينهما قاب قوس وقيب قوس
  وقادقوس وقيد قوس أى قدرقوس والقاب مابين المقبض والسسبة ولكل قوس قايان
  وقال بعضه-م فى قوله تعالى فكان قاب قوسين أوأدنى أراد قاباقوس فقلبه وقولهسم فلان
  على"قوية مثال همزة أى ثابت الدارميم يقال ذلك للذى لا يبرح من المنزل (ق هب
  القهب الابيض تعلوه كدرة والانى قهبسة وقهبا. والقهب أيضا الجبل العظيم عن أبى
  عمرو والقهبة لون الاقهب قال الاصمعى هوغبرة الى سواد وقال ابن الاعرابى الاقهب الذى
  فيه-رة فيها غبرة قال ويقال هوالابيض الاكدر وأنشد لامرئ القيس
  كفيث العشى الاقهب المتودق
  والاقهبان الفيل والجاموس قال رؤية
  صف نفسه بالشدة ليث يدق الاسد الهموسا • والاقهيين الفيل والجاموسا
  الرجل يكاب كاية وكا ية مثل رأفة ورآفسة ونشأة ونشاة فهو كثيب وامرأة كتيية
  وكابا أيضا قال الراجز
  عزء لى عمسك أن تؤوقى • او أن تبيتى ايلة لم تغبق أو أن ترى كا با لم تبرنشق
  واكتأب الرجل مثله ور ماد مكتئب اللون اذاضرب الى السواد كما يكون وجه الكنيب
  ⁦( كبب)⁩ كبه اللّٰه لوجهه أى صرعه فأكب على وجهه وهذا من الموادران يقال
  أفعلت أنا وفعلت غيرى يقال كب اللّٰه عدوالمسلمين ولا يقال أكب وكبكبه أى كبه ومنه
  قوله تعالى فكبكبوا فيهاهم والغاوون واكب فلان على الامر يفعله وانكب بعف
  وتقول جاء متكب كافى شسابه أى متزملا وتكيبت الابل اذاصرعتمن داء أوهزال
  والسكبة باضم بجماعة من الخيل وكذلك الكبكبة والكبة أيضا الجرودق من الغزل تقول
  منه كييت الغزل أى جعلمته كبدا والسكبة بالفتح الدفعة فى القتال والجرى وهوافلات الخيل
  على المقوص للمعرى أو للجملة وكذلك كبة الشتاء شدته ودفهمه والصكية أيضا الرحام
  والكباب الطباهج والكابة دواء والكاب بالضم ما تكبب من الرمل أى تجعد قال ذوالرمة
  توظاء بالاظلاف -ى كأنما • يترن الكاب الجعد عن متن مم-ل
  وكيكب اسم جبل صرفه امر ؤالقيس فى قوله
  فاخر منهم سالك بطن نخلة • وآخر منهم جازع نجسد كبكب
  وتركصبرفه الاعشى فى قوله
