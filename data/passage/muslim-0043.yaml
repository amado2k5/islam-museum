label: { ar: "مسلم 43 — ثلاث من كن فيه وجد حلاوة الإيمان", en: "Muslim 43 — Three qualities; whoever has them tastes faith's sweetness", es: "Musulmán 43 — Tres cualidades; quien las posee saborea la dulzura de la fe.", fr: "Muslim 43 — Trois qualités; celui qui les possède goûte la douceur de la foi", ur: "مسلم 43 - تین خصلتیں جس کے پاس ہے وہ ایمان کی مٹھاس چکھتا ہے۔", tr: "Müslim 43 — Üç özellik, kim bunlara sahip olursa imanın tatlılığını bulur.", id: "Muslim 43 — Tiga sifat, siapa pun yang memilikinya akan menemukan manisnya iman." }
text: "قال رسول الله: «ثلاث من كن فيه وجد بهن حلاوة الإيمان: من كان الله ورسوله أحب إليه مما سواهما، وأن يحب المرء لا يحبه إلا لله، وأن يكره أن يعود في الكفر بعد أن أنقذه الله منه كما يكره أن يقذف في النار»"
summary:
  ar: "رواية أنس بن مالك في باب خصال حلاوة الإيمان من كتاب الإيمان في صحيح مسلم؛ حب الله ورسوله والحب في الله وكراهة العودة إلى الكفر — مقاييس ذوق الإيمان."
  tr: "Sahih Müslim'deki İman Kitabı'nda yer alan \"İmanın Tatlılığının Nitelikleri\" bölümünde Enes bin Malik'in rivayetine göre: Allah'ı ve Resulünü sevmek, Allah rızası için sevmek ve küfre dönmekten nefret etmek, imanın tadının ölçütleridir."
  id: "Riwayat Anas bin Malik dalam bab tentang sifat-sifat manisnya iman dari Kitab Iman dalam Sahih Muslim: cinta kepada Allah dan Rasul-Nya, cinta karena Allah, dan kebencian terhadap kekafiran — standar-standar rasa iman."
