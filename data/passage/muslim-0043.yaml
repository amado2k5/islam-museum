label: { ar: "مسلم 43 — ثلاث من كن فيه وجد حلاوة الإيمان", en: "Muslim 43 — Three qualities; whoever has them tastes faith's sweetness" }
text: "قال رسول الله: «ثلاث من كن فيه وجد بهن حلاوة الإيمان: من كان الله ورسوله أحب إليه مما سواهما، وأن يحب المرء لا يحبه إلا لله، وأن يكره أن يعود في الكفر بعد أن أنقذه الله منه كما يكره أن يقذف في النار»"
summary:
  ar: "رواية أنس بن مالك في باب خصال حلاوة الإيمان من كتاب الإيمان في صحيح مسلم؛ حب الله ورسوله والحب في الله وكراهة العودة إلى الكفر — مقاييس ذوق الإيمان."
