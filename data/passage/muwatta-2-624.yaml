label: { ar: "الموطأ 624 — سعد بن أبي وقاص وسعيد بن زيد توفيا بالعقيق وحُملا إلى المدينة ودُفنا بها", en: "Muwatta 624", es: "Muwatta 624", fr: "Muwatta 624", ur: "موطا 624", tr: "Al-Muwatta 624 - Sa'd ibn Ebî Vakkas ve Sa'id ibn Zeyd, Al-'Aqiq'te öldüler ve Medine'ye taşınarak orada gömüldüler.", id: "Al-Muwatta 624 — Sa`d ibn Abi Waqqas dan Sa`id ibn Zayd meninggal di Al-`Aqiq dan dibawa ke Madinah dan dimakamkan di sana" }
summary:
  ar: "يرويه مالك عن غير واحد ممن يثق به، أن سعد بن أبي وقاص وسعيد بن زيد بن عمرو بن نفيل توفيا بالعقيق، وحُملا إلى المدينة ودُفنا بها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومعن بن عيسى عند ابن سعد في الطبقات ⁦(3/147 و384)⁩. {cite:muwatta-maruf-1997 p.318}"
  tr: "Malik, birkaç güvenilir şahsiyetin rivayetine dayanarak, Sa'd ibn Abi Waqqas ve Sa'id ibn Zayd ibn 'Amr ibn Nufayl'ın el-Akik'te vefat ettiklerini ve cenazelerinin Medine'ye götürülerek orada defnedildiğini bildirmiştir. Editör, İbn Sa'd'ın Tabaqat'ında (3/147 ve 384) kaydettiği üzere, Malik'in rivayetine dayanarak Ebu Mus'ab, Suwayd ve Ma'n ibn 'Isa'nın da bunu naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.318}"
  id: "Malik meriwayatkan, berdasarkan beberapa orang yang dapat dipercaya, bahwa Sa'd ibn Abi Waqqas dan Sa'id ibn Zayd ibn 'Amr ibn Nufayl meninggal di al-'Aqiq, dan dibawa ke Madinah dan dimakamkan di sana. Editor mencatat bahwa Abu Mus'ab, Suwayd, dan Ma'n ibn 'Isa meriwayatkannya berdasarkan otoritas Malik, sebagaimana dicatat oleh Ibn Sa'd dalam Tabaqat-nya (3/147 dan 384). {cite:muwatta-maruf-1997 p.318}"
