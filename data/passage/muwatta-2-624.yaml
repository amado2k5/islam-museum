summary:
  ar: "يرويه مالك عن غير واحد ممن يثق به، أن سعد بن أبي وقاص وسعيد بن زيد بن عمرو بن نفيل توفيا بالعقيق، وحُملا إلى المدينة ودُفنا بها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومعن بن عيسى عند ابن سعد في الطبقات (3/147 و384). {cite:muwatta-maruf-1997 p.318}"
