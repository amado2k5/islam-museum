  fr: "Extrait du Mughni d'Ibn Qudama (tome 1, p. 913) mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 1. cildinin 913. sayfasından bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve istirahat yerinden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Vasiyetnameler, Miras, Antik Eserler ve İstirahat Yerleri Tarayıcısı tarafından derlenmiştir."
