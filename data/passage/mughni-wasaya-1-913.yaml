text: "… حشيش قوم ويد صاحبها عليها...، ضمن البذر كله، لم يصح الألف... من عنده رهون، قد أتى عليها زمان لا يعرف صاحبها... إذا تنازع صاحب الدار والساكن فى دفن فى الدار،... اختلف أصحابنا فى الوصية للقاتل على ثلاثة أوجه ؛... المسائل …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 913، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 1, p. 913, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 1، ص 913 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
