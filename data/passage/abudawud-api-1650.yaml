label: { ar: "سنن أبي داود 1650 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 1650 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 1650 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 1650 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 1650 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا شُعْبَةُ، عَنِ الْحَكَمِ، عَنِ ابْنِ أَبِي رَافِعٍ، عَنْ أَبِي رَافِعٍ، أَنَّ النَّبِيَّ بَعَثَ رَجُلاً عَلَى الصَّدَقَةِ مِنْ بَنِي مَخْزُومٍ فَقَالَ لأَبِي رَافِعٍ اصْحَبْنِي فَإِنَّكَ تُصِيبُ مِنْهَا. قَالَ حَتَّى آتِيَ النَّبِيَّ فَأَسْأَلَهُ فَأَتَاهُ فَسَأَلَهُ فَقَالَ \" مَوْلَى الْقَوْمِ مِنْ أَنْفُسِهِمْ وَإِنَّا لاَ تَحِلُّ لَنَا الصَّدَقَةُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1650، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1650 (Zakat (Kitab Al-Zakat)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1650، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1650 (Zakat (Kitab Al-Zakat)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 1650 (Zakat), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
