ref: "18"
label: { ar: "الأربعون 18 — اتق الله حيثما كنت", en: "Arba'un 18 — fear God wherever you are", es: "Arba'un 18 — teme a Dios dondequiera que estés.", fr: "Arba'un 18 — craignez Dieu où que vous soyez", ur: "اربعون 18 - تم جہاں بھی ہو خدا سے ڈرو" }
text: "اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن"
summary:
  ar: "حديث أبي ذر ومعاذ بن جبل، وهو الحديث الثامن عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه الترمذي (1987) وقال حديث حسن وفي بعض النسخ حسن صحيح، من رواية سفيان الثوري عن حبيب بن أبي ثابت عن ميمون بن أبي شبيب عن أبي ذر وبهذا الإسناد عن معاذ، وذكر الترمذي عن شيخه محمود بن غيلان أن حديث أبي ذر أصح، ورجح الدارقطني إسناده المرسل؛ وصححه الحاكم على شرط الشيخين فبين ابن رجب أنه وهم من وجهين: أن ميمون بن أبي شبيب لم يخرج له البخاري في الصحيح ولا مسلم إلا في مقدمة كتابه، وأن سماع ميمون من أحد من الصحابة لم يثبت — قال الفلاس ليس في شيء من رواياته عن الصحابة «سمعت»، وقال أبو حاتم روايته عن أبي ذر وعائشة غير متصلة، وقال أبو داود لم يدرك عائشة ولم ير علياً — وساق رأي البخاري وعلي بن المديني وأبي زرعة وأبي حاتم أن الحديث لا يتصل إلا بصحة اللقي، ودلالة كلام أحمد على ذلك ونص الشافعي عليه في الرسالة، وكل ذلك خلاف رأي مسلم؛ ورويت الوصية بمعناها لمعاذ عند بعثه إلى اليمن ولأبي ذر في وصايا أخرى منها «أوصيك بتقوى الله في سر أمرك وعلانيته»، وعن أبي هريرة أن أكثر ما يدخل الناس الجنة «تقوى الله وحسن الخلق»، وهذه وصية جامعة لحقوق الله وحقوق عباده ⁦(جامع العلوم والحكم ص 375–431)⁩."
  en: "The hadith of Abu Dharr and Mu'adh ibn Jabal, the eighteenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Tirmidhi (1987) as hasan — hasan sahih in some copies — through Sufyan al-Thawri from Habib ibn Abi Thabit from Maymun ibn Abi Shabib from Abu Dharr, and by the same chain from Mu'adh, al-Tirmidhi citing his teacher Mahmud ibn Ghaylan that Abu Dharr's version is sounder and al-Daraqutni preferring the mursal route; al-Hakim graded it sound on the two Shaykhs' condition, which Ibn Rajab shows to be mistaken on two counts — Maymun ibn Abi Shabib has nothing in Bukhari's Sahih and nothing in Muslim's except in his introduction, and his hearing from any Companion is unproven: al-Fallas found no 'I heard' in his Companion reports, Abu Hatim declared his reports from Abu Dharr and A'isha unconnected, and Abu Dawud held he reached neither A'isha nor Ali — and Ibn Rajab sets out the view of al-Bukhari, Ali ibn al-Madini, Abu Zur'a and Abu Hatim that a chain connects only with proven meeting, Ahmad's words pointing the same way and al-Shafi'i stating it in the Risala, all contrary to Muslim's view; the same counsel is transmitted for Mu'adh on his despatch to Yemen and for Abu Dharr in other counsels including 'I counsel you with fear of God in your secret and open affairs', and from Abu Hurayra that what most admits people to Paradise is 'fear of God and good character', a counsel combining God's rights and His servants' rights (Jami' al-Ulum wal-Hikam pp. 375–431)."
  es: "El hadiz de Abu Dharr y Mu'adh ibn Jabal, el decimoctavo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Tirmidhi (1987) como hasan - hasan sahih en algunas copias - a través de Sufyan al-Thawri de Habib ibn Abi Thabit de Maymun ibn Abi Shabib de Abu Dharr, y por la misma cadena de Mu'adh, al-Tirmidhi citando a su maestro Mahmud ibn Ghaylan que la versión de Abu Dharr es más sólida y que al-Daraqutni prefiere la ruta mural; al-Hakim lo calificó como sólido según la condición de los dos Shaykhs, que Ibn Rajab demuestra que es errónea en dos aspectos: Maymun ibn Abi Shabib no tiene nada en el Sahih de Bukhari ni en el de Muslim excepto en su introducción, y su haber oído de cualquier Compañero no está probado: al-Fallas no encontró ningún \"escuché\" en sus informes de Compañeros, Abu Hatim declaró que sus informes de Abu Dharr y Aisha no estaban conectados, y Abu Dawud sostuvo que no llegó ni a Aisha ni a Ali; e Ibn Rajab expone la opinión de al-Bukhari, Ali ibn al-Madini, Abu Zur'a y Abu Hatim de que una cadena se conecta solo con un encuentro probado, las palabras de Ahmad apuntan en la misma dirección y al-Shafi'i lo afirma en la Risala, todo contrario a la opinión de Muslim; El mismo consejo se transmite para Mu'adh en su envío a Yemen y para Abu Dharr en otros consejos, incluyendo 'Te aconsejo que temas a Dios en tus asuntos secretos y públicos', y de Abu Hurayra que lo que más permite que la gente entre en el Paraíso es 'el temor a Dios y el buen carácter', un consejo que combina los derechos de Dios y los derechos de Sus siervos (Jami' al-Ulum wal-Hikam pp. 375–431)."
  fr: "Le hadith d'Abou Dharr et de Mu'adh ibn Jabal, le dix-huitième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Tirmidhi (1987) comme hasan — hasan sahih dans certains exemplaires — par Sufyan al-Thawri de Habib ibn Abi Thabit de Maymun ibn Abi Shabib d'Abu Dharr, et par la même chaîne de Mu'adh, al-Tirmidhi citant son professeur Mahmud ibn Ghaylan que la version d'Abu Dharr est plus solide et al-Daraqutni préférant la voie mursal; al-Hakim l'a jugé authentique en se basant sur la condition des deux cheikhs, ce qu'Ibn Rajab démontre être erroné sur deux points: Maymun ibn Abi Shabib n'apparaît ni dans le Sahih de Bukhari ni dans celui de Muslim, sauf dans son introduction, et le fait qu'il ait entendu parler d'un Compagnon n'est pas prouvé: al-Fallas n'a trouvé aucun « j'ai entendu » dans ses récits de Compagnons, Abu Hatim a déclaré que ses récits d'Abu Dharr et d'Aïcha étaient sans lien, et Abu Dawud a soutenu qu'il n'avait rencontré ni Aïcha ni Ali. Ibn Rajab expose l'avis d'al-Bukhari, d'Ali ibn al-Madini, d'Abu Zur'a et d'Abu Hatim selon lequel une chaîne de transmission n'est valable qu'en cas de rencontre prouvée, les propos d'Ahmad allant dans le même sens et al-Shafi'i l'affirmant dans la Risala, tous contraires à l'avis de Muslim; Le même conseil est transmis à Mu'adh lors de son envoi au Yémen et à Abu Dharr dans d'autres conseils, notamment « Je te conseille de craindre Dieu dans tes affaires secrètes et publiques », et d'Abu Hurayra que ce qui admet le plus les gens au Paradis est « la crainte de Dieu et une bonne moralité », un conseil combinant les droits de Dieu et les droits de Ses serviteurs (Jami' al-Ulum wal-Hikam pp. 375–431)."
  ur: "ابوذر اور معاذ بن جبل کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی اٹھارویں؛ الترمذی (1987) کے ذریعہ حسن کے طور پر منتقل کیا گیا ہے - کچھ نسخوں میں حسن صحیح - سفیان الثوری کے ذریعہ حبیب بن ابی ثابت سے میمون ابن ابی شبیب نے ابوذر سے اور اسی سلسلہ سے معاذ، ترمذی نے اپنے استاد کا حوالہ دیتے ہوئے کہا ہے کہ ابوذر اور ابوذر کی روایت ابوذر کی ہے۔ الدارقطنی مرسل راستے کو ترجیح دیتے ہیں۔ الحاکم نے اسے دو شیوخ کی شرط پر صحیح قرار دیا ہے جسے ابن رجب نے دو اعتبار سے غلط قرار دیا ہے - میمون بن ابی شبیب کا بخاری کی صحیح میں کچھ نہیں ہے اور مسلم میں ان کے تعارف کے علاوہ کچھ نہیں ہے، اور کسی صحابی سے ان کا سماع غیر ثابت ہے: الفلس نے ابوحازم سے روایت کی ہے کہ میں نے ابوحازم سے اس کی روایت کو سنا ہے۔ اور عائشہ غیر مربوط ہے، اور ابو داؤد نے کہا کہ وہ نہ عائشہ اور نہ علی تک پہنچی ہے - اور ابن رجب نے البخاری، علی ابن المدینی، ابو زرعہ اور ابو حاتم کا یہ نظریہ بیان کیا ہے کہ سلسلہ صرف ثابت شدہ ملاقات سے جڑتا ہے، احمد کے الفاظ اسی طرف اشارہ کرتے ہیں اور شافعی تمام روایات میں اس کو مسلم کہتے ہیں۔ یہی نصیحت معاذ کے یمن بھیجے جانے پر اور ابوذر کے لیے بھی دوسری نصیحتوں میں ہے جس میں 'میں تمہیں تمہارے خفیہ اور کھلے معاملات میں خوف خدا کی نصیحت کرتا ہوں'، اور ابوہریرہ سے کہ جو چیز لوگوں کو سب سے زیادہ جنت میں داخل کرتی ہے وہ 'خدا کا خوف اور حسن اخلاق' ہے، یہ ایک نصیحت ہے جو اس کے بندوں کے حقوق اور حقوق العباد کا امتزاج کرتی ہے۔ والحکم صفحہ 375-431)۔"
