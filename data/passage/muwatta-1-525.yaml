label: { ar: "الموطأ 525 — سعيد بن المسيب: صلى النبي نحو بيت المقدس ستة عشر شهراً ثم حولت القبلة قبل بدر بشهرين", en: "Muwatta 525" }
text: "صلى رسول الله بعد أن قدم المدينة ستة عشر شهراً نحو بيت المقدس، ثم حولت القبلة قبل بدر بشهرين"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب مرسلاً، في باب ما جاء في القبلة: صلى النبي بعد أن قدم المدينة ستة عشر شهراً نحو بيت المقدس، ثم حُولت القبلة قبل بدر بشهرين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن معناه في الصحيحين من حديث البراء بن عازب، ويحيل على التمهيد (23/134). {cite:muwatta-maruf-1997 p.271}"
