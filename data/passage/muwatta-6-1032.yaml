label: { ar: "الموطأ 1032 — يحيى بن سعيد عن محمد بن إبراهيم عن ربيعة بن عبد الله بن الهدير: رأى عمر بن الخطاب يقرد بعيراً له في طين بالسقيا وهو محرم؛ قال مالك: وأنا أكرهه", en: "Muwatta 1032", es: "Muwatta 1032", fr: "Muwatta 1032", ur: "موطا 1032", tr: "El-Muvatta 1032 — Yahya ibn Sa’id, Muhammed ibn İbrahim’den, o da Rabi’ah ibn ‘Abdullah ibn al-Hudayr’dan rivayetle: ‘Ömer ibn al-Hattab’ın Suqya’da ihramlı haldeyken devesini çamurla bağladığı görüldü; Malik dedi ki: Ve ben bunu sevmiyorum.", id: "Al-Muwatta 1032 — Yahya ibn Sa’id, berdasarkan riwayat Muhammad ibn Ibrahim, berdasarkan riwayat Rabi’ah ibn ‘Abdullah ibn al-Hudayr: ‘Umar ibn al-Khattab terlihat menambatkan untanya di lumpur di al-Suqya ketika ia sedang dalam keadaan ihram; Malik berkata: Dan aku tidak menyukainya." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي عن ربيعة بن عبد الله بن الهدير، أنه رأى عمر بن الخطاب يقرد بعيراً له في طين بالسقيا وهو محرم. قال مالك: وأنا أكرهه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1192) وسويد (582) والشافعي في مسنده، ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.481}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim ibn el-Harith el-Taymi'den, o da Rabi'ah ibn 'Abd Allah ibn el-Hudayr'den rivayet ederek, Ömer ibn el-Hattab'ın Sukya'da ihramlı haldeyken devesini çamurla bağladığını gördüğünü nakletmiştir. Malik, \"Bundan hoşlanmıyorum\" demiştir. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1192), Suveyd (582), Şafiî'nin Musned'inde ve Yahya ibn Bukayr'ın Beyhaki'nin derlemesinde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.481}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, dari Rabi'ah ibn 'Abd Allah ibn al-Hudayr, bahwa ia melihat 'Umar ibn al-Khattab menambatkan untanya di lumpur di al-Suqya ketika ia sedang dalam keadaan ihram. Malik berkata: \"Dan aku tidak menyukainya.\" Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab (1192), Suwayd (582), al-Shafi'i dalam Musnadnya, dan Yahya ibn Bukayr dalam koleksi al-Bayhaqi. {cite:muwatta-maruf-1997 p.481}"
