label: { ar: "الموطأ 1032 — يحيى بن سعيد عن محمد بن إبراهيم عن ربيعة بن عبد الله بن الهدير: رأى عمر بن الخطاب يقرد بعيراً له في طين بالسقيا وهو محرم؛ قال مالك: وأنا أكرهه", en: "Muwatta 1032" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث التيمي عن ربيعة بن عبد الله بن الهدير، أنه رأى عمر بن الخطاب يقرد بعيراً له في طين بالسقيا وهو محرم. قال مالك: وأنا أكرهه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1192) وسويد (582) والشافعي في مسنده، ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.481}"
