label: { ar: "سنن ابن ماجه 12 — الحلال، استحلال الشيء", en: "Sunan Ibn Majah 12 — the lawful; treating a thing as lawful", ur: "سنن ابن ماجہ 12 — حلال، کسی چیز کو حلال ٹھہرانا", es: "Sunan Ibn Majah 12 — lo lícito; tratar algo como lícito", fr: "Sunan Ibn Majah 12 — le licite; considérer une chose comme licite", tr: "Sünen İbni Mace 12 — Helal, bir şeyin caiz görülmesi", id: "Sunan Ibnu Majah 12 — Al-Halal, menganggap sesuatu hal yang diperbolehkan" }
text: "… حَدَّثَنِي الْحَسَنُ بْنُ جَابِرٍ، عَنِ الْمِقْدَامِ بْنِ مَعْدِيكَرِبَ الْكِنْدِيِّ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" يُوشِكُ الرَّجُلُ مُتَّكِئًا عَلَى أَرِيكَتِهِ يُحَدَّثُ بِحَدِيثٍ مِنْ حَدِيثِي فَيَقُولُ بَيْنَنَا وَبَيْنَكُمْ كِتَابُ اللَّهِ عَزَّ وَجَلَّ فَمَا وَجَدْنَا فِيهِ مِنْ حَلاَلٍ اسْتَحْلَلْنَاهُ وَمَا وَجَدْنَا فِيهِ مِنْ حَرَامٍ حَرَّمْنَاهُ. أَلاَ وَإِنَّ مَا حَرَّمَ رَسُولُ اللَّهِ ـ مِثْلُ مَا حَرَّمَ اللَّهُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 12، يذكر الحلال، واستحلال الشيء، والحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 12 (The Book of the Sunnah), that mentions the lawful, treating a thing as lawful, the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 12، جس میں حلال، کسی چیز کو حلال ٹھہرانا، حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 12 (El Libro de la Sunnah), que menciona lo lícito, lo que se considera lícito, lo ilícito y lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 12 (Le Livre de la Sunna), mentionne ce qui est licite, ce qui est illicite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde yer alan 12 numaralı hadis, helal olan, helal sayılan, haram olan ve haram olan şeyleri ele almaktadır. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeyler hakkında bilgileri, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile haleflerinin sözlerinden alıntılarla derlemektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 12, membahas tentang apa yang diperbolehkan (halal), apa yang dianggap diperbolehkan, apa yang diharamkan (haram), dan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini mengumpulkan informasi tentang apa yang diperbolehkan dan diharamkan, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka."
