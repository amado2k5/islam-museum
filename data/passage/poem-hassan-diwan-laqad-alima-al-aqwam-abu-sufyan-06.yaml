summary:
  ar: "بيت من أبيات «لقد علم الأقوام» في هجاء أبي سفيان بن الحارث، كما في شرح البرقوقي لديوان حسان {{cite:sharh-diwan-hassan-barquqi-1929 p.160}}."
  en: "Verse 6 of verses against Abu Sufyan ibn al-Harith ('The peoples know'), as in al-Barquqi's commentary on Hassan's diwan."
  es: "Verso 6 de versos contra Abu Sufyan ibn al-Harith ('Los pueblos saben'), como en el comentario de al-Barquqi sobre el diwan de Hassan."
