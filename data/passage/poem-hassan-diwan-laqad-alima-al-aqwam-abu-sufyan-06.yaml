  tr: "El-Barquqi'nin Hasan'ın Divanı üzerine yaptığı tefsirde yer alan, Ebu Sufyan ibn el-Harith'i hicveden \"İnsanlar Öğrendi\" şiirinden bir dize {{cite:sharh-diwan-hassan-barquqi-1929 s.160}}."
  id: "Sebuah bait dari puisi “Orang-orang telah belajar” dalam satire Abu Sufyan ibn al-Harith, sebagaimana terdapat dalam komentar al-Barquqi tentang Diwan Hassan {{cite:sharh-diwan-hassan-barquqi-1929 p.160}}."
