label: { ar: "مسلم 2479 — نعم الرجل عبد الله لو كان يصلي من الليل", en: "Muslim 2479 — Abdullah is a righteous man; would that he prayed at night" }
text: "رأى عبد الله بن عمر في المنام كأن في يده قطعة إستبرق لا يريد مكاناً من الجنة إلا طارت إليه؛ فقصها على حفصة فقصتها على النبي فقال: «نعم الرجل عبد الله، لو كان يصلي من الليل» — فكان لا ينام من الليل إلا قليلاً"
summary:
  ar: "رواية نافع عن ابن عمر في باب فضائله من صحيح مسلم؛ الرؤيا وقول النبي «نعم الرجل عبد الله لو كان يصلي من الليل» فحرص بعدها على قيام الليل — نص صلاحه وفقهه."
