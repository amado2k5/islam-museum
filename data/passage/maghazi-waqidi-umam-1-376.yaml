text: "… أَيديهنَّ أَسْوِرَة الذهب، والدُّرّ فى رقابهنّ. ولتى المنافقون عليهم يوم خرجوا حزناً شديدًا ؛ لقد لقيت زيد بن رِفاعة بن التابوبت وهو مع عبد اللّٰه بن أُبَيّ، وهو يُناجيه فى بنى غَنْم وهو يقول : توحّشتُ بيَثْرِب لِفَقْد بنى النَّضير، …"
summary:
