text: "… هذا ولا عبدِ الرَّحمنِ. يرفعه، ولا يَصحُّ مرفوعاً عندهم. - عبد الرِّحمنِ بن سعدِ بن المنذرِ. وروى عنه أيضاً القاسم أَبو عبدِ الرّحمنِ مرفوعاً : لا عدوى ولا هام ولا صَفَر. ويقالُ : عبد الرَّحمنِ بن عمرِو بن سعد بن …"
