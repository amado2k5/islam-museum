text: "… تنبت في شفتي الجرح لحماً فاستعمل الأدوية التي تعلمت بالطريق الصناعي استعمالها في مداوأة القروح الغائرة، وبالجملة فعلاج القروح الحادثة في العروق الغير الضوارب مثل الحادثة في اللحم. قال: وأما الجرح الحادث في الشرايين فقد ظن قوم من الأطباء أنه …"
summary:
