label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ١٧، المقطع ١ من ٢", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 17, section 1 of 2", ur: "تثبیت دلائل نبوت — حصہ اول، باب 17، حصہ 1" }
text: "في آخر أمره وفي آخر عمره. واعلم أن القرآن حجة من ثلاثة أوجه: فكل سورة منه حجة من طريق الفصاحة والبلاغة، وهو حجة لما فيه من الإخبار بالغيوب، وهو حجة لما فيه من التنبيه على دلائل العقول، فإن …"
summary:
  ar: "مقطع من الباب ١٧ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 17 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 17 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
