label: { ar: "الموطأ 2426 — مالك: العبد الذي ليس من الخدم يسرق من متاع امرأة سيده تقطع يده", en: "Muwatta 2426", es: "Muwatta 2426", fr: "Muwatta 2426", ur: "موطا 2426", tr: "Al-Muwatta 2426 — Malik: Hizmetkâr olmayan bir köle, efendisinin karısının malından çalarsa, eli kesilir.", id: "Al-Muwatta 2426 — Malik: Seorang budak yang bukan seorang pelayan mencuri harta milik istri tuannya; tangannya akan dipotong." }
summary:
  ar: "قال مالك في العبد لا يكون من خدمه ولا ممن يؤمن على بيته، فدخل سرا فسرق من متاع امرأة سيده ما يجب فيه القطع: إنه تُقطع يده. {cite:muwatta-maruf-1997 p.402}"
  tr: "Malik, efendisinin evinde ne hizmetçi ne de emanetçi olmayan, ancak efendisinin karısının eşyalarından gizlice girip, uzuv kesilmesini gerektirecek bir şey çalan bir köle hakkında şöyle demiştir: \"Eli kesilmelidir.\" {cite:muwatta-maruf-1997 s.402}"
  id: "Malik berkata mengenai seorang budak yang bukan pelayan atau orang yang dipercaya menjaga rumah tuannya, dan yang secara diam-diam masuk dan mencuri sesuatu dari barang milik istri tuannya yang pantas dihukum amputasi: tangannya harus dipotong. {cite:muwatta-maruf-1997 p.402}"
