label: { ar: "سنن ابن ماجه 2431 — مضاعفة الحسنة بعشر أمثالها", en: "Sunan Ibn Majah 2431 — the good deed multiplied tenfold and beyond", ur: "سنن ابن ماجہ 2431 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا", es: "Sunan Ibn Majah 2431 — La buena acción multiplicada por diez y más", fr: "Sunan Ibn Majah 2431 — la bonne action multipliée par dix et au-delà", tr: "Sunan İbn Majah 2431 — İyiliğin sevabı on kat artırılır.", id: "Sunan Ibn Majah 2431 — Pahala amal kebaikan dilipatgandakan sepuluh kali." }
text: "… بْنُ خَالِدٍ، حَدَّثَنَا خَالِدُ بْنُ يَزِيدَ بْنِ أَبِي مَالِكٍ، عَنْ أَبِيهِ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" رَأَيْتُ لَيْلَةَ أُسْرِيَ بِي عَلَى بَابِ الْجَنَّةِ مَكْتُوبًا الصَّدَقَةُ بِعَشْرِ أَمْثَالِهَا وَالْقَرْضُ بِثَمَانِيَةَ عَشَرَ. فَقُلْتُ يَا جِبْرِيلُ مَا بَالُ الْقَرْضِ أَفْضَلُ مِنَ الصَّدَقَةِ. قَالَ لأَنَّ السَّائِلَ يَسْأَلُ وَعِنْدَهُ وَالْمُسْتَقْرِضُ لاَ يَسْتَقْرِضُ إِلاَّ مِنْ حَاجَةٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2431، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2431 (The Chapters on Charity), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2431، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2431 (Los capítulos sobre la caridad), habla de la buena acción multiplicada por diez o más. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, registran, borran o valoran una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 2431 (Les chapitres sur la charité), évoque la multiplication par dix, voire plus, des bonnes actions. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou évaluent les actes de bienfaisance."
  tr: "İbn Majah'ın Sünen'inde yer alan 2431 numaralı hadiste, iyiliğin on kat artırılacağından bahsedilir. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2431, menyebutkan bahwa amal kebaikan dilipatgandakan sepuluh kali. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
