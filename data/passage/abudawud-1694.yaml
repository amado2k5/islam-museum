label:
  ar: "أبو داود 1694 — الرحم: من وصلك وصلته ومن قطعك قطعته"
  en: "Abu Dawud 1694 — Kinship: whoever joins you I join, whoever cuts you I cut"
  ur: "ابو داود 1694 — رشتہ داری: جو تجھے جوڑے میں اسے جوڑوں، جو تجھے کاٹے میں اسے کاٹوں"
text: "قال الله أنا الرحمن وهي الرحم شققت لها اسما من اسمي من وصلها وصلته ومن قطعها بتته ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 1694: الرحم: من وصلك وصلته ومن قطعك قطعته. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 1694: Kinship: whoever joins you I join, whoever cuts you I cut. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 1694: رشتہ داری: جو تجھے جوڑے میں اسے جوڑوں، جو تجھے کاٹے میں اسے کاٹوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
