text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا أَيُّوبُ، عَنْ مُحَمَّدٍ، سَمِعْتُ أَنَسَ بْنَ مَالِكٍ ـ يَقُولُ صَبَّحَ رَسُولُ اللَّهِ خَيْبَرَ بُكْرَةً وَقَدْ خَرَجُوا بِالْمَسَاحِي، فَلَمَّا رَأَوْهُ قَالُوا مُحَمَّدٌ وَالْخَمِيسُ. وَأَحَالُوا إِلَى الْحِصْنِ يَسْعَوْنَ، فَرَفَعَ النَّبِيُّ يَدَيْهِ وَقَالَ \" اللَّهُ أَكْبَرُ، خَرِبَتْ خَيْبَرُ، إِنَّا إِذَا نَزَلْنَا بِسَاحَةِ قَوْمٍ فَسَاءَ صَبَاحُ الْمُنْذَرِينَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3647، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3647 (Virtues and Merits of the Prophet (pbuh) and his Companions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3647، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
