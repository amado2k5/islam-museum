label: { ar: "سنن النسائي 2007 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2007 — a burial, grave or resting place", ur: "سنن نسائی 2007 — تدفین، قبر اور مرقد" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ، قَالَ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ جَعْفَرٍ، عَنْ إِسْمَاعِيلَ بْنِ مُحَمَّدِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، عَنْ سَعْدٍ، قَالَ : الْحَدُوا لِي لَحْدًا، وَانْصِبُوا عَلَىَّ نَصْبًا كَمَا فُعِلَ بِرَسُولِ اللَّهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2007، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2007 (The Book of Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2007، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
