text: "وعند مالك لا بأس بأكل خشاش الأرض وعقاربها ودودها، ولا بأس بأكل فراخ النحل ودود الجبن والتمر ونحوه. قال القرطبي : وحجته قول ابن عباس وأبي الدرداء : ما أحل اللّٰه فهو حلال، وما حرم فهو حرام، وما سكت عنه …"
