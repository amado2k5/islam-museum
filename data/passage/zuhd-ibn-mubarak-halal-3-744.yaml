text: "… ومجازى، فالحقيقى تمنى زوال النعمة عن صاحبها، وهذا حرام بإجماع الأمة مع النصوص الصحيحة، وأما المجازى فهو الغبطة وهو أن يتمنى مثل النعمة التى على غيره من غير زوالها عن صاحبها، فإذا كانت من أمور الدنيا كانت مباحة، وإن كانت …"
