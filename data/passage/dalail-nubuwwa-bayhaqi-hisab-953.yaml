text: "… محمد بن يحيى بن المنذر العرار في حديثه : فمن همَّ بحسنة فلم يعملها كتبت حسنة ، فإن علمها كتبت عشراً، ومن همَّ بسيئة فلم يعملها لم تكتب شيئاً ، فإن عملها كتبت واحدة . قال فنزلتُ حتى انتهيت إلى …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 953، يذكر كتابة الحسنات، وعدد السيئات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 953, that speaks of the writing of good deeds, a stated number of bad deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 953 کا اقتباس جس میں نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 953, que habla de la escritura de buenas obras, un número determinado de malas obras, la escritura de malas obras; de la copia extraída, citada dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 953, qui parle de l'écriture des bonnes actions, d'un nombre déterminé de mauvaises actions, de l'écriture des mauvaises actions; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 953. sayfasından, iyi amellerin yazılması, kötü amellerin sayısı ve kötü amellerin yazılmasıyla ilgili bir pasaj; alıntılanan metin, kaynakların politikasına göre yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” hlm. 953, yang menyebutkan pencatatan amal baik, jumlah amal buruk, dan pencatatan amal buruk; dari salinan yang diambil, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
