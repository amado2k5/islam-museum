text: "… محمد بن يحيى بن المنذر العرار في حديثه : فمن همَّ بحسنة فلم يعملها كتبت حسنة ، فإن علمها كتبت عشراً، ومن همَّ بسيئة فلم يعملها لم تكتب شيئاً ، فإن عملها كتبت واحدة . قال فنزلتُ حتى انتهيت إلى …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 953، يذكر كتابة الحسنات، وعدد السيئات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 953, that speaks of the writing of good deeds, a stated number of bad deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 953 کا اقتباس جس میں نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
