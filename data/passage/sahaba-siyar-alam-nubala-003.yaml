text: "ة بن خليفة على هرقل بالكتاب، وفيه: «بسم الله الرحمن الرحيم، من محمد رسول الله إلى هرقل عظيم الروم: سلام على من اتبع الهدى. أما بعد؛ فأسلم تسلم، وأسلم يؤتك الله أجرك مرتين، فإن أبيت فإن إنم الأكارين عليك». فلما"
