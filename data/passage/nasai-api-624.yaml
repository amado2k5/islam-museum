label: { ar: "سنن النسائي 624 — الأب والأبوة", en: "Sunan al-Nasa'i 624 — the father and fatherhood", ur: "سنن نسائی 624 — باپ اور والدیت", es: "Sunan al-Nasa'i 624 — El padre y la paternidad", fr: "Sunan al-Nasa'i 624 — le père et la paternité", tr: "Sunan an-Nasa'i 624 — Baba ve Babalık", id: "Sunan an-Nasa'i 624 — Sang Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا يَحْيَى بْنُ حَسَّانَ، قَالَ حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ نَافِعِ بْنِ جُبَيْرٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ فِي سَفَرٍ لَهُ \" مَنْ يَكْلَؤُنَا اللَّيْلَةَ لاَ نَرْقُدَ عَنْ صَلاَةِ الصُّبْحِ \". قَالَ بِلاَلٌ أَنَا. فَاسْتَقْبَلَ مَطْلَعَ الشَّمْسِ فَضُرِبَ عَلَى آذَانِهِمْ حَتَّى أَيْقَظَهُمْ حَرُّ الشَّمْسِ فَقَامُوا فَقَالَ \" تَوَضَّئُوا \". ثُمَّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 624، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 624 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 624، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 624 (El Libro de los Tiempos de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 624 (Le Livre des Heures de la Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 624 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, İslam'da babalık konusuna dair bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 624, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
