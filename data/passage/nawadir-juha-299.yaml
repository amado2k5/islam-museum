text: "… جحا يبيع الهواء من جملة كرامات الشيخ بيعه الهواء إلى الفلاحين، ففي إحدى السنين ذهب إماماً إلى إحدى القرى، وعندما قارب رمضانُ الختام، فكر الفلاحون في عملِ وسيلةٍ لعدم إعطاءِ الشيخ عوائِدَهُ من الحنطةِ اعتذاراً بقلَّة المحصول. لغضب الشيخ من …"
summary:
  ar: "كان جحا إمام قرية فحُرم نصيبه من الحبوب في سنة شحيحة، فلما جاء الحصاد جلس على تلة ومعه حصير وحجب الريح، فبقي الفلاحون بلا ريح ودفعوا له ضعف حقه، فصار يترك الريح تمر من ثقب في حصيره لكل بيدر، فشكروه، وقال لهم إن الله سيأخذ حبوبهم إن غشوه. {cite:juha-nawadir-kubra-djuwaydi p. 147}"
  en: "Juha, as imam of a village, is refused his grain share in a poor year; at harvest, he sits on a hill with a mat and blocks the wind, so the farmers have no wind and pay him double; he then lets wind through a hole in his mat for each threshing floor, they thank him, and he tells them God will take their grain if they cheat him. {cite:juha-nawadir-kubra-djuwaydi p. 147}"
  ur: "جحا ایک گاؤں کا امام تھا اور قحط کے سال اسے اناج کا حصہ نہ دیا گیا، چنانچہ فصل کی کٹائی پر وہ چٹائی لے کر ایک ٹیلے پر بیٹھ گیا اور ہوا روک دی، کسانوں کے پاس ہوا نہ رہی تو انہوں نے اسے دگنا حق ادا کیا، پھر وہ ہر کھلیان کے لیے اپنی چٹائی کے سوراخ سے ہوا گزارنے لگا، انہوں نے اس کا شکریہ ادا کیا، اور اس نے کہا کہ اگر انہوں نے اسے دھوکا دیا تو اللہ ان کا اناج لے لے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 147}"
  fr: "Juha, imam d'un village, se voit refuser sa part de grain une année de disette ; à la moisson, il s'assoit sur une colline avec une natte et arrête le vent, si bien que les paysans, privés de vent, lui paient le double ; il laisse alors passer le vent par un trou de sa natte pour chaque aire de battage, ils le remercient, et il leur dit que Dieu prendra leur grain s'ils le trompent. {cite:juha-nawadir-kubra-djuwaydi p. 147}"
  es: "Juha, imán de una aldea, ve negada su parte de grano en un año pobre; en la cosecha se sienta en una colina con una estera y bloquea el viento, de modo que los campesinos se quedan sin viento y le pagan el doble; luego deja pasar el viento por un agujero de su estera para cada era, ellos se lo agradecen, y él les dice que Dios les quitará el grano si lo engañan. {cite:juha-nawadir-kubra-djuwaydi p. 147}"
