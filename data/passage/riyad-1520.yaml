  en: "A hadith in al-Nawawi's Riyad al-Salihin, in the chapter «كتاب الأمور المنهي عنها», excerpted within forty words."
  es: "Un hadiz en Riyad al-Salihin de al-Nawawi, en el capítulo «كتاب الأمور المنهي عنها», extraído en cuarenta palabras."
  fr: "Un hadith du Riyad al-Salihin d'al-Nawawi, dans le chapitre «كتاب الأمور المنهي عنها», extrait en quarante mots."
  ur: "النووی کی ریاض الصالحین میں ایک حدیث، باب «كتاب الأمور المنهي عنها» میں، چالیس الفاظ میں نقل کی گئی ہے۔"
