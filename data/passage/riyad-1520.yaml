label:
  ar: "رياض الصالحين 1520 — أمسك عليك لسانك وليسعك بيتك وابك على خطيئتك"
  en: "Riyad al-Salihin 1520 — Guard your tongue, let your house suffice you, weep for your sin"
  es: "Riyad al-Salihin 1520 — Cuida tu lengua, que tu casa te baste, llora por tu pecado."
  fr: "Riyad al-Salihin 1520 — Maîtrise ta langue, que ta maison te suffise, pleure sur ton péché"
  ur: "ریاض الصالحین 1520 - اپنی زبان کی حفاظت کرو، تمہارا گھر تمہارے لیے کافی ہو، اپنے گناہ پر روئے"
text: "قُلْتُ يَا رَسُولَ اللَّهِ مَا النَّجَاةُ قَالَ أَمْسِكْ عَلَيْكَ لِسَانَكَ وَلْيَسَعْكَ بَيْتُكَ وَابْكِ عَلَى خَطِيئَتِكَ"
summary:
