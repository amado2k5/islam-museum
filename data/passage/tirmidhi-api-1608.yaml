label: { ar: "جامع الترمذي 1608 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 1608 — what was left behind: estate and inheritance", ur: "جامع ترمذی 1608 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 1608 — lo que quedó: patrimonio y herencia" }
text: "… يَرِثُكَ قَالَ أَهْلِي وَوَلَدِي. قَالَتْ فَمَا لِي لاَ أَرِثُ أَبِي فَقَالَ أَبُو بَكْرٍ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" لاَ نُورَثُ \". وَلَكِنِّي أَعُولُ مَنْ كَانَ رَسُولُ اللَّهِ يَعُولُهُ وَأُنْفِقُ عَلَى مَنْ كَانَ رَسُولُ اللَّهِ يُنْفِقُ عَلَيْهِ. قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ عُمَرَ وَطَلْحَةَ وَالزُّبَيْرِ وَعَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ وَسَعْدٍ وَعَائِشَةَ. وَحَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1608، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1608 (The Book on Military Expeditions), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1608، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1608 (El Libro de las Expediciones Militares), menciona lo que quedó: bienes y herencias. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
