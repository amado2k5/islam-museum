label: { ar: "الموطأ 2215 — مالك: الأمر المجتمع عليه عندنا أن الموصي إذا أوصى في صحته أو مرضه بوصية فيها عتاقة رقيق أو غير ذلك، يغير منها ما بدا له حتى يموت، وليس له تغيير التدبير، لأن كل موص يحبس ماله لو لم يملك تغيير وصيته", en: "Muwatta 2215", es: "Muwatta 2215", fr: "Muwatta 2215", ur: "موطا 2215", tr: "El-Muvatta 2215 — Malik: Bizim aramızdaki görüş birliği şudur ki, bir vasiyetçi sağlıklı veya hasta iken köle azatını veya diğer konuları içeren bir vasiyetname yaparsa, ölümüne kadar dilediği gibi değiştirebilir. Ancak, vasiyetini değiştirme hakkı olmadığı sürece her vasiyetçi malını elinde tutar, bu nedenle vasiyetnamenin içeriğini değiştiremez.", id: "Al-Muwatta 2215 — Malik: Konsensus di antara kami adalah bahwa jika seorang pewaris membuat wasiat dalam keadaan sehat atau sakit yang mencakup pembebasan budak atau hal-hal lain, ia boleh mengubahnya sesuai keinginannya sampai ia meninggal. Namun, ia tidak dapat mengubah pengaturan tersebut, karena setiap pewaris tetap memiliki hartanya jika ia tidak memiliki hak untuk mengubah wasiatnya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، أن الموصي إذا أوصى في صحته أو مرضه بوصية، فيها عتاقة رقيق من رقيقه أو غير ذلك، فإنه يغير من ذلك ما بدا له، ويصنع من ذلك ما شاء حتى يموت. وإن أحب أن يطرح تلك الوصية أو يبدلها، فعل، إلا أن يدبر مملوكا، فإن دبر، فلا سبيل إلى تغيير ما دبر. فلو كان الموصي لا يقدر على تغيير وصيته، ولا ما ذكر فيها من العتاقة، كان كل موص قد حبس ماله الذي أوصى فيه من العتاقة وغيرها. فالأمر عندنا الذي لا اختلاف فيه، أنه يغير من ذلك ما شاء، غير التدبير. {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.310}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur ki, ister sağlıklı ister hasta olsun, bir vasiyetçi kölelerinden birinin azat edilmesini veya benzer bir şeyi içeren bir vasiyetname yaparsa, ölene kadar bunu dilediği gibi değiştirebilir ve dilediği gibi kullanabilir. Eğer bu vasiyeti iptal etmek veya değiştirmek isterse, bunu yapabilir, ancak köleye efendisinin ölümünden sonra özgürlük tanımamışsa. Eğer bu özgürlüğü tanımışsa, verdiği şeyi değiştirmenin hiçbir yolu yoktur. Eğer bir vasiyetçi vasiyetini veya azat etme ile ilgili olarak vasiyetinde belirttiği şeyi değiştiremezse, o zaman her vasiyetçi esasen azat etme olsun veya olmasın, vasiyet ettiği tüm mal varlığını elinde tutmuş olurdu. Bu nedenle, aramızdaki yerleşik uygulama, üzerinde anlaşmazlık olmayan bir şekilde, efendisinin ölümünden sonra özgürlük tanıma dışında, dilediği her şeyi değiştirebileceğidir. {cite:muwatta-maruf-1997 s.309} {cite:muwatta-maruf-1997 s.310}"
  id: "Malik berkata: Praktik yang berlaku di antara kita adalah bahwa jika seorang pewaris, baik dalam keadaan sehat maupun sakit, membuat wasiat yang mencakup pembebasan salah satu budaknya atau hal serupa, ia dapat mengubahnya sesuai keinginannya dan melakukan apa pun yang ia suka sampai ia meninggal. Jika ia ingin mencabut atau mengubah wasiat tersebut, ia dapat melakukannya, kecuali jika ia telah memberikan kebebasan kepada budaknya setelah kematian tuannya. Jika ia telah memberikan kebebasan ini, tidak ada cara untuk mengubah apa yang telah ia berikan. Jika seorang pewaris tidak dapat mengubah wasiatnya, atau apa yang ia sebutkan di dalamnya mengenai pembebasan, maka setiap pewaris pada dasarnya telah menyita semua harta yang diwariskannya, baik itu pembebasan atau hal lainnya. Oleh karena itu, praktik yang berlaku di antara kita, yang tidak ada perselisihan, adalah bahwa ia dapat mengubah apa pun yang diinginkannya, kecuali pemberian kebebasan setelah kematian tuannya. {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.310}"
