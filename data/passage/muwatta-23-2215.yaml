label: { ar: "الموطأ 2215 — مالك: الأمر المجتمع عليه عندنا أن الموصي إذا أوصى في صحته أو مرضه بوصية فيها عتاقة رقيق أو غير ذلك، يغير منها ما بدا له حتى يموت، وليس له تغيير التدبير، لأن كل موص يحبس ماله لو لم يملك تغيير وصيته", en: "Muwatta 2215" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا، أن الموصي إذا أوصى في صحته أو مرضه بوصية، فيها عتاقة رقيق من رقيقه أو غير ذلك، فإنه يغير من ذلك ما بدا له، ويصنع من ذلك ما شاء حتى يموت. وإن أحب أن يطرح تلك الوصية أو يبدلها، فعل، إلا أن يدبر مملوكا، فإن دبر، فلا سبيل إلى تغيير ما دبر. فلو كان الموصي لا يقدر على تغيير وصيته، ولا ما ذكر فيها من العتاقة، كان كل موص قد حبس ماله الذي أوصى فيه من العتاقة وغيرها. فالأمر عندنا الذي لا اختلاف فيه، أنه يغير من ذلك ما شاء، غير التدبير. {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.310}"
