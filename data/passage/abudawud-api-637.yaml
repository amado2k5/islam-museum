label: { ar: "سنن أبي داود 637 — الحرام", en: "Sunan Abi Dawud 637 — the unlawful", ur: "سنن ابی داؤد 637 — حرام", es: "Sunan Abi Dawud 637 – lo ilegal" }
text: "… دَاوُدَ، عَنْ أَبِي عَوَانَةَ، عَنْ عَاصِمٍ، عَنْ أَبِي عُثْمَانَ، عَنِ ابْنِ مَسْعُودٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ أَسْبَلَ إِزَارَهُ فِي صَلاَتِهِ خُيَلاَءَ فَلَيْسَ مِنَ اللَّهِ فِي حِلٍّ وَلاَ حَرَامٍ \". قَالَ أَبُو دَاوُدَ رَوَى هَذَا جَمَاعَةٌ عَنْ عَاصِمٍ مَوْقُوفًا عَلَى ابْنِ مَسْعُودٍ مِنْهُمْ حَمَّادُ بْنُ سَلَمَةَ وَحَمَّادُ بْنُ زَيْدٍ وَأَبُو الأَحْوَصِ وَأَبُو مُعَاوِيَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 637، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 637 (Prayer (Kitab Al-Salat)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 637، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 637 (Oración (Kitab Al-Salat)), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
