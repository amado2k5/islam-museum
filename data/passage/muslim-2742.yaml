text: "قال أبو سعيد الخدري عن النبي: إن الدنيا حلوة خضرة، وإن الله مستخلفكم فيها فينظر كيف تعملون، فاتقوا الدنيا واتقوا النساء، فإن أول فتنة بني إسرائيل كانت في النساء"
summary:
  ar: "رواية أبي سعيد الخدري في باب قوله إن الدنيا حلوة خضرة من كتاب الرقائق في صحيح مسلم؛ الاستخلاف في الدنيا مع الامتحان، وفتنة النساء أول فتن بني إسرائيل."
  tr: "Sahih Müslim'in Kalpleri Yumuşatan Kitabı'nda, Ebu Said Hudri'nin \"Dünya tatlı ve yeşildir\" sözüyle ilgili bölümde rivayet edildiğine göre; dünyada imtihan vardır ve kadınların imtihanı İsrailoğullarının ilk imtihanıdır."
  id: "Riwayat Abu Saeed Al-Khudri dalam bab tentang ucapannya bahwa dunia itu manis dan hijau dari Kitab Penyejuk Hati dalam Sahih Muslim; suksesi di dunia disertai ujian, dan ujian wanita adalah ujian pertama Bani Israel."
