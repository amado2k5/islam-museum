label: { ar: "مسلم 2742 — إن الدنيا حلوة خضرة", en: "Muslim 2742 — The world is sweet and green" }
text: "قال أبو سعيد الخدري عن النبي: إن الدنيا حلوة خضرة، وإن الله مستخلفكم فيها فينظر كيف تعملون، فاتقوا الدنيا واتقوا النساء، فإن أول فتنة بني إسرائيل كانت في النساء"
summary:
  ar: "رواية أبي سعيد الخدري في باب قوله إن الدنيا حلوة خضرة من كتاب الرقائق في صحيح مسلم؛ الاستخلاف في الدنيا مع الامتحان، وفتنة النساء أول فتن بني إسرائيل."
