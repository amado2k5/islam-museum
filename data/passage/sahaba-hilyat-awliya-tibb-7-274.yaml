  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 7, p. 274, that mentions medicine and the physician, illness and the sick, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 7، ص 274 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
