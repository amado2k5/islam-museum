text: "… فيسأل عيسى عن شرار أهلها، ويسأل يحيي عن خيار أهلها، فقال له يحيى : لم تنزل على شرار الناس قال : إنما أنا طبيب أداوى المرضى. حدثنا أبو بكر بن مالك أنا عبد اللّٰه حدثنى أبو معمر عن سفيان قال: …"
summary:
