text: "… عمره عند الراحة، وعند نقصان العلة. ننظر في ذلك. الإسكندر قال: النقرس داء عياء لا يكاد يصيب الأطباء علاجه إذا كان من أخلاط كثيرة مجتمعة. قال: وقد يكون من دم كثير سخن يملأ المفاصل وتمتد العروق فيلقون وجعاً شديداً، أو …"
