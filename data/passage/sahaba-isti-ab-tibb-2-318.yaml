text: "… أخبرني عقبة بن سويد إِنَّها دواء، قال : لا، ولكنّها داء. هكذا قال شُعبة : سويد بن طارق، أَو طارق بن أنه سمع أباه، وكان من أَصحاب النَّبيِّ تَا يقِ. روى سويد - على الشك. عن عُقْبة الزهري وربيعة حديثه …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 318، يذكر الدواء، والداء، والتداوي بالمحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 318, that mentions the drug, the disease and its remedy, treatment with what is forbidden; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 318 کا اقتباس جس میں دوا، بیماری، حرام سے علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 2, pág. 318, que menciona el medicamento, la enfermedad y su remedio, el tratamiento con lo que está prohibido; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 2, p. 318, qui mentionne le médicament, la maladie et son remède, le traitement avec ce qui est interdit; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 2. cildinin 318. sayfasından, tıp, hastalık ve haram olan şeylerle tedavi konularını ele alan bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynakların politikasına uygun olarak metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti`ab karya Ibnu Abd Al-Barr, jilid bergambar 2, hlm. 318, yang menyebutkan tentang pengobatan, penyakit, dan perawatan beserta hal-hal yang dilarang; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
