text: "… أخبرني عقبة بن سويد إِنَّها دواء، قال : لا، ولكنّها داء. هكذا قال شُعبة : سويد بن طارق، أَو طارق بن أنه سمع أباه، وكان من أَصحاب النَّبيِّ تَا يقِ. روى سويد - على الشك. عن عُقْبة الزهري وربيعة حديثه …"
