label: { ar: "الأربعون 27 — البر حسن الخلق / استفت قلبك", en: "Arba'un 27 — righteousness is good character / consult your heart" }
text: "البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس"
summary:
  ar: "حديثان جمعهما النووي في العدد السابع والعشرين: الأول عن النواس بن سمعان عن النبي قال: «البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس» أخرجه مسلم (2553) من رواية معاوية بن صالح عن عبد الرحمن بن جبير بن نفير عن أبيه عن النواس — وهؤلاء تفرد بتخريج حديثهم مسلم دون البخاري — وأخرجه أحمد والدارمي والبخاري في الأدب المفرد والترمذي (2389) وغيرهم؛ والثاني عن وابصة بن معبد قال: أتيت رسول الله وأنا أريد أن لا أدع شيئاً من البر والإثم إلا سألت عنه فقال «جئت تسأل عن البر والإثم؟» قلت نعم، وفي رواية أحمد الكاملة أنه دنا حتى مست ركبتُه ركبتَه وجمع أصابعه الثلاث يَنكت بها في صدره ويقول «يا وابصة استفت نفسك: البر ما اطمأن إليه القلب واطمأنت إليه النفس، والإثم ما حاك في القلب وتردد في الصدر وإن أفتاك الناس وأفتوك»؛ قال النووي حديث حسن رواه في مسندي أحمد والدارمي بإسناد حسن، وفي إسناد حديث وابصة عند ابن رجب أمران يوجب كل منهما ضعفه: انقطاع بين الزبير بن عبد السلام وأيوب بن عبد الله بن مكرز فإنه رواه عن قوم لم يسمعهم، وضعف الزبير نفسه قال الدارقطني روى أحاديث مناكير وضعفه ابن حبان وسماه أيوب بن عبد السلام فأخطأ في اسمه؛ وله طريق أخرى عن وابصة عند أحمد من رواية معاوية بن صالح عن أبي عبد الله السلمي بلفظ مختصر «البر ما انشرح له صدرك والإثم ما حاك في صدرك وإن أفتاك عنه الناس» وهذا السلمي قال علي بن المديني هو مجهول، ورُجح في بعض الروايات أنه محمد بن سعيد المصلوب المشهور بالكذب والوضع الذي صلبه المنصور في الزندقة لكنه لم يدرك وابصة كما قال عبد الغني بن سعيد؛ وللحديث طرق جيدة منها حديث أبي أمامة عند أحمد وابن حبان من طريق يحيى بن أبي كثير عن زيد بن سلام عن جده عنه «إذا حاك في صدرك شيء فدعه» وهو إسناد جيد على شرط مسلم، وحديث أبي ثعلبة الخشني عند أحمد من رواية مسلم بن مشكم «البر ما سكنت إليه النفس واطمأن إليه القلب والإثم ما لم تسكن إليه النفس ولم يطمئن إليه القلب وإن أفتاك المفتون» وإسناده جيد أيضاً (جامع العلوم والحكم ص 566–580)."
  en: "Two hadiths that al-Nawawi gathers under the twenty-seventh number: the first, from al-Nawwas ibn Sam'an, that the Prophet said 'righteousness is good character, and sin is what wavers in your soul and you dislike for people to see it' — transmitted by Muslim (2553) through Mu'awiya ibn Salih from Abd al-Rahman ibn Jubayr ibn Nufayr from his father from al-Nawwas, a chain Muslim alone of the two Shaykhs carried, also found in Ahmad, al-Darimi, al-Bukhari's Adab al-Mufrad, al-Tirmidhi (2389) and others; the second, from Wabisa ibn Ma'bad, that he came to the Messenger of God resolved to leave nothing of righteousness and sin unasked, and was answered 'you came to ask about righteousness and sin?' — 'yes' — and in Ahmad's fuller route he drew so near that his knee touched the Prophet's knee, who then joined his three fingers and poked him in the chest saying 'O Wabisa, consult your own soul: righteousness is what the heart and soul are at peace with, and sin is what wavers in the heart and hesitates in the breast, even if people give you verdict upon verdict'; al-Nawawi calls it a hasan hadith in the Musnads of Ahmad and al-Darimi, while Ibn Rajab notes two defects each sufficient to weaken Wabisa's chain — a gap between al-Zubayr ibn Abd al-Salam and Ayyub ibn Abdullah ibn Makraz, since he related it from people he never heard, and al-Zubayr's own weakness: al-Daraqutni reports he narrated rejected hadiths, and Ibn Hibban weakened him while misnaming him; a second Wabisa route in Ahmad through Mu'awiya ibn Salih from Abu Abdullah al-Sulami carries the short wording 'righteousness is what your breast opens to and sin is what wavers in your breast even if people give you verdicts', and this Sulami is 'unknown' to Ali ibn al-Madini — some routes suggesting he was Muhammad ibn Sa'id al-Maslub, the notorious fabricator crucified by al-Mansur for zandaqa, though, as Abd al-Ghani ibn Sa'id noted, he never reached Wabisa; yet the hadith has sound paths, among them Abu Umama's in Ahmad and Ibn Hibban through Yahya ibn Abi Kathir from Zayd ibn Salam from his grandfather — 'if something wavers in your breast, leave it', a chain sound on Muslim's condition — and Abu Tha'laba al-Khushani's in Ahmad through Muslim ibn Mishkam, 'righteousness is what the soul rests in and the heart is at peace with, and sin is what the soul does not rest in even if the muftis give you verdicts', likewise a good chain (Jami' al-Ulum wal-Hikam pp. 566–580)."
