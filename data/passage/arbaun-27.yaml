label: { ar: "الأربعون 27 — البر حسن الخلق / استفت قلبك", en: "Arba'un 27 — righteousness is good character / consult your heart", es: "Arba'un 27 — La rectitud es buen carácter / consulta a tu corazón", fr: "Arba'un 27 — La droiture est un bon caractère / consulte ton cœur", ur: "اربعون 27 - نیکی اچھا کردار ہے / اپنے دل سے مشورہ کریں۔", tr: "Kırkıncı 27 — Doğruluk iyi karakterdir / Kalbinize danışın", id: "Pasal 40:27 — Kebenaran adalah karakter yang baik / Konsultasikan dengan hatimu" }
text: "البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس"
summary:
  ar: "حديثان جمعهما النووي في العدد السابع والعشرين: الأول عن النواس بن سمعان عن النبي قال: «البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس» أخرجه مسلم (2553) من رواية معاوية بن صالح عن عبد الرحمن بن جبير بن نفير عن أبيه عن النواس — وهؤلاء تفرد بتخريج حديثهم مسلم دون البخاري — وأخرجه أحمد والدارمي والبخاري في الأدب المفرد والترمذي (2389) وغيرهم؛ والثاني عن وابصة بن معبد قال: أتيت رسول الله وأنا أريد أن لا أدع شيئاً من البر والإثم إلا سألت عنه فقال «جئت تسأل عن البر والإثم؟» قلت نعم، وفي رواية أحمد الكاملة أنه دنا حتى مست ركبتُه ركبتَه وجمع أصابعه الثلاث يَنكت بها في صدره ويقول «يا وابصة استفت نفسك: البر ما اطمأن إليه القلب واطمأنت إليه النفس، والإثم ما حاك في القلب وتردد في الصدر وإن أفتاك الناس وأفتوك»؛ قال النووي حديث حسن رواه في مسندي أحمد والدارمي بإسناد حسن، وفي إسناد حديث وابصة عند ابن رجب أمران يوجب كل منهما ضعفه: انقطاع بين الزبير بن عبد السلام وأيوب بن عبد الله بن مكرز فإنه رواه عن قوم لم يسمعهم، وضعف الزبير نفسه قال الدارقطني روى أحاديث مناكير وضعفه ابن حبان وسماه أيوب بن عبد السلام فأخطأ في اسمه؛ وله طريق أخرى عن وابصة عند أحمد من رواية معاوية بن صالح عن أبي عبد الله السلمي بلفظ مختصر «البر ما انشرح له صدرك والإثم ما حاك في صدرك وإن أفتاك عنه الناس» وهذا السلمي قال علي بن المديني هو مجهول، ورُجح في بعض الروايات أنه محمد بن سعيد المصلوب المشهور بالكذب والوضع الذي صلبه المنصور في الزندقة لكنه لم يدرك وابصة كما قال عبد الغني بن سعيد؛ وللحديث طرق جيدة منها حديث أبي أمامة عند أحمد وابن حبان من طريق يحيى بن أبي كثير عن زيد بن سلام عن جده عنه «إذا حاك في صدرك شيء فدعه» وهو إسناد جيد على شرط مسلم، وحديث أبي ثعلبة الخشني عند أحمد من رواية مسلم بن مشكم «البر ما سكنت إليه النفس واطمأن إليه القلب والإثم ما لم تسكن إليه النفس ولم يطمئن إليه القلب وإن أفتاك المفتون» وإسناده جيد أيضاً ⁦(جامع العلوم والحكم ص 566–580)⁩."
  en: "Two hadiths that al-Nawawi gathers under the twenty-seventh number: the first, from al-Nawwas ibn Sam'an, that the Prophet said 'righteousness is good character, and sin is what wavers in your soul and you dislike for people to see it' — transmitted by Muslim (2553) through Mu'awiya ibn Salih from Abd al-Rahman ibn Jubayr ibn Nufayr from his father from al-Nawwas, a chain Muslim alone of the two Shaykhs carried, also found in Ahmad, al-Darimi, al-Bukhari's Adab al-Mufrad, al-Tirmidhi (2389) and others; the second, from Wabisa ibn Ma'bad, that he came to the Messenger of God resolved to leave nothing of righteousness and sin unasked, and was answered 'you came to ask about righteousness and sin?' — 'yes' — and in Ahmad's fuller route he drew so near that his knee touched the Prophet's knee, who then joined his three fingers and poked him in the chest saying 'O Wabisa, consult your own soul: righteousness is what the heart and soul are at peace with, and sin is what wavers in the heart and hesitates in the breast, even if people give you verdict upon verdict'; al-Nawawi calls it a hasan hadith in the Musnads of Ahmad and al-Darimi, while Ibn Rajab notes two defects each sufficient to weaken Wabisa's chain — a gap between al-Zubayr ibn Abd al-Salam and Ayyub ibn Abdullah ibn Makraz, since he related it from people he never heard, and al-Zubayr's own weakness: al-Daraqutni reports he narrated rejected hadiths, and Ibn Hibban weakened him while misnaming him; a second Wabisa route in Ahmad through Mu'awiya ibn Salih from Abu Abdullah al-Sulami carries the short wording 'righteousness is what your breast opens to and sin is what wavers in your breast even if people give you verdicts', and this Sulami is 'unknown' to Ali ibn al-Madini — some routes suggesting he was Muhammad ibn Sa'id al-Maslub, the notorious fabricator crucified by al-Mansur for zandaqa, though, as Abd al-Ghani ibn Sa'id noted, he never reached Wabisa; yet the hadith has sound paths, among them Abu Umama's in Ahmad and Ibn Hibban through Yahya ibn Abi Kathir from Zayd ibn Salam from his grandfather — 'if something wavers in your breast, leave it', a chain sound on Muslim's condition — and Abu Tha'laba al-Khushani's in Ahmad through Muslim ibn Mishkam, 'righteousness is what the soul rests in and the heart is at peace with, and sin is what the soul does not rest in even if the muftis give you verdicts', likewise a good chain (Jami' al-Ulum wal-Hikam pp. 566–580)."
  es: "Dos hadices que al-Nawawi reúne bajo el número veintisiete: el primero, de al-Nawwas ibn Sam'an, que el Profeta dijo 'la rectitud es el buen carácter, y el pecado es lo que vacila en tu alma y no quieres que la gente lo vea', transmitido por Muslim (2553) a través de Mu'awiya ibn Salih de Abd al-Rahman ibn Jubayr ibn Nufayr de su padre de al-Nawwas, una cadena que solo Muslim de los dos Shaykhs llevó, también encontrada en Ahmad, al-Darimi, el Adab al-Mufrad de al-Bukhari, al-Tirmidhi (2389) y otros; el segundo, de Wabisa ibn Ma'bad, que vino al Mensajero de Dios resuelto a no dejar nada de rectitud y pecado sin preguntar, y se le respondió '¿viniste a preguntar sobre la rectitud y el pecado?'. — 'sí' — y en la ruta más completa de Ahmad se acercó tanto que su rodilla tocó la rodilla del Profeta, quien luego juntó sus tres dedos y lo tocó en el pecho diciendo 'Oh Wabisa, consulta tu propia alma: la rectitud es aquello con lo que el corazón y el alma están en paz, y el pecado es aquello que vacila en el corazón y duda en el pecho, incluso si la gente te da veredicto tras veredicto'; al-Nawawi lo llama un hadiz hasan en los Musnads de Ahmad y al-Darimi, mientras que Ibn Rajab señala dos defectos, cada uno suficiente para debilitar la cadena de Wabisa: una brecha entre al-Zubayr ibn Abd al-Salam y Ayyub ibn Abdullah ibn Makraz, ya que lo relató de personas que nunca escuchó, y la propia debilidad de al-Zubayr: al-Daraqutni informa que narró hadices rechazados, e Ibn Hibban lo debilitó al nombrarlo erróneamente; Una segunda ruta de Wabisa en Ahmad a través de Mu'awiya ibn Salih desde Abu Abdullah al-Sulami lleva la breve frase \"la rectitud es aquello a lo que se abre tu pecho y el pecado es aquello que vacila en tu pecho incluso si la gente te da veredictos\", y este Sulami es \"desconocido\" para Ali ibn al-Madini; algunas rutas sugieren que era Muhammad ibn Sa'id al-Maslub, el notorio falsificador crucificado por al-Mansur por zandaqa, aunque, como señaló Abd al-Ghani ibn Sa'id, nunca llegó a Wabisa; Sin embargo, el hadiz tiene cadenas sólidas, entre ellas la de Abu Umama en Ahmad e Ibn Hibban a través de Yahya ibn Abi Kathir de Zayd ibn Salam de su abuelo: «si algo vacila en tu pecho, déjalo», una cadena sólida en la condición de Muslim; y la de Abu Tha'laba al-Khushani en Ahmad a través de Muslim ibn Mishkam: «la rectitud es aquello en lo que el alma descansa y con lo que el corazón está en paz, y el pecado es aquello en lo que el alma no descansa, incluso si los muftíes te dan veredictos», igualmente una buena cadena (Jami' al-Ulum wal-Hikam, págs. 566-580)."
  fr: "Deux hadiths qu'al-Nawawi rassemble sous le vingt-septième numéro: le premier, d'al-Nawwas ibn Sam'an, rapporte que le Prophète a dit: « La piété est un bon caractère, et le péché est ce qui vacille dans ton âme et que tu ne veux pas que les gens voient. » Ce hadith a été transmis par Muslim (2553) par Mu'awiya ibn Salih, d'après Abd al-Rahman ibn Jubayr ibn Nufayr, d'après son père, d'après al-Nawwas. Parmi les deux cheikhs, seul Muslim a transmis cette chaîne. On la retrouve également dans Ahmad, al-Darimi, Adab al-Mufrad d'al-Bukhari, al-Tirmidhi (2389) et d'autres recueils. Le second, d'après Wabisa ibn Ma'bad, raconte qu'il vint trouver le Messager de Dieu résolu à ne rien omettre de la piété et du péché, et qu'il lui répondit: « Tu es venu t'enquérir de la piété et du péché ? » — « oui » — et dans le parcours plus complet d'Ahmad, il s'approcha tellement que son genou toucha celui du Prophète, qui joignit alors ses trois doigts et le piqua à la poitrine en disant: « Ô Wabisa, consulte ton âme: la droiture est ce avec quoi le cœur et l'âme sont en paix, et le péché est ce qui vacille dans le cœur et hésite dans la poitrine, même si les gens te rendent verdict sur verdict »; al-Nawawi le qualifie de hadith hasan dans les Musnads d'Ahmad et d'al-Darimi, tandis qu'Ibn Rajab relève deux défauts suffisants chacun pour affaiblir la chaîne de Wabisa — un intervalle entre al-Zubayr ibn Abd al-Salam et Ayyub ibn Abdullah ibn Makraz, puisqu'il l'a rapporté de personnes qu'il n'a jamais entendues, et la faiblesse d'al-Zubayr lui-même: al-Daraqutni rapporte qu'il a narré des hadiths rejetés, et Ibn Hibban l'a affaibli en le nommant incorrectement; Une seconde route de Wabisa dans Ahmad, via Mu'awiya ibn Salih d'après Abu Abdullah al-Sulami, porte la courte phrase « la droiture est ce à quoi votre cœur s'ouvre et le péché est ce qui vacille dans votre cœur même si les gens vous rendent des verdicts », et ce Sulami est « inconnu » d'Ali ibn al-Madini — certaines routes suggérant qu'il s'agissait de Muhammad ibn Sa'id al-Maslub, le célèbre faussaire crucifié par al-Mansur pour zandaqa, bien que, comme l'a noté Abd al-Ghani ibn Sa'id, il n'ait jamais atteint Wabisa; Pourtant, le hadith possède des chaînes de transmission solides, parmi lesquelles celle d'Abu Umama, transmise par Ahmad et Ibn Hibban via Yahya ibn Abi Kathir, de Zayd ibn Salam, de son grand-père — « si quelque chose vacille dans ta poitrine, abandonne-le », une chaîne solide selon la condition de Muslim — et celle d'Abu Tha'laba al-Khushani, transmise par Ahmad via Muslim ibn Mishkam, « la droiture est ce en quoi l'âme trouve le repos et avec quoi le cœur est en paix, et le péché est ce en quoi l'âme ne trouve pas le repos, même si les muftis te donnent des verdicts », également une bonne chaîne (Jami' al-Ulum wal-Hikam pp. 566–580)."
  ur: "دو احادیث جو النووی نے ستائیسویں نمبر کے تحت جمع کی ہیں: پہلی، النواس بن سمعان سے، کہ رسول اللہ نے فرمایا: نیکی حسن اخلاق ہے، اور گناہ وہ ہے جو آپ کے دل میں بھڑک اٹھے اور آپ اسے ناپسند کریں کہ لوگ اسے دیکھیں۔ نفیر اپنے والد کی طرف سے النواس سے، دو شیخوں میں سے اکیلے مسلمان تھے، جو احمد، الدارمی، البخاری کے ادب المفرد، الترمذی (2389) اور دیگر میں بھی پائے جاتے ہیں۔ دوسرا، وبیصہ بن معبد سے، کہ وہ رسول اللہ کے پاس آیا کہ نیکی اور گناہ میں سے کوئی چیز بغیر پوچھے نہیں چھوڑیں گے، اور جواب دیا گیا کہ تم نیکی اور گناہ کے بارے میں پوچھنے آئے ہو؟ - 'ہاں' - اور احمد کے پورے راستے میں وہ اس قدر قریب آیا کہ اس کا گھٹنا نبی کے گھٹنے کو چھو گیا، پھر آپ نے اپنی تین انگلیاں جوڑ کر آپ کو سینے میں ٹھونس دیا اور کہا کہ اے وبیسہ، اپنی جان سے مشورہ کرو: نیکی وہ ہے جس سے دل و جان کو سکون ملتا ہے، اور گناہ وہ ہے جس سے دل میں ڈگمگاتی ہے اور اگر تم لوگوں کو دینے سے بھی کتراتے ہو فیصلہ'؛ النووی نے اسے مسند احمد اور الدارمی میں حسن حدیث کہا ہے، جب کہ ابن رجب نے دو نقائص نوٹ کیے ہیں جن میں سے ہر ایک وابسہ کے سلسلہ کو کمزور کرنے کے لیے کافی ہے- الزبیر ابن عبد السلام اور ایوب ابن عبداللہ ابن مکرز کے درمیان فاصلہ، کیونکہ اس نے اسے لوگوں سے روایت کیا ہے، اس نے کبھی ضعیف اور ضعیف نہیں سنا: روایت کرتے ہیں کہ انہوں نے رد شدہ حدیثیں بیان کیں، اور ابن حبان نے اس کا نام غلط بیان کرتے ہوئے اسے کمزور کیا۔ ابو عبداللہ السلمی سے معاویہ بن صالح کے ذریعے احمد میں دوسرا وبیسہ راستہ مختصر الفاظ میں لکھا ہے 'نیکی وہ ہے جس سے آپ کا سینہ کھلتا ہے اور گناہ وہ ہے جو آپ کے سینہ میں ڈگمگاتا ہے خواہ لوگ آپ کو فیصلہ دیں'، اور یہ سلمی علی ابن المدینی کے لیے 'نامعلوم' ہے - بعض راستوں کو محمد صائب نے تجویز نہیں کیا تھا۔ المنصور کی طرف سے زندقہ کے لیے مصلوب کرنے والے کو مصلوب کیا گیا تھا، حالانکہ جیسا کہ عبد الغنی بن سعید نے بیان کیا ہے، وہ کبھی وبیسہ نہیں پہنچا۔ اس کے باوجود حدیث کے صحیح راستے ہیں، ان میں سے ابو امامہ نے احمد میں اور ابن حبان نے یحییٰ بن ابی کثیر سے، زید بن سلام نے اپنے دادا سے - 'اگر کوئی چیز تیرے سینہ میں ڈگمگا جائے تو چھوڑ دو'، مسلم کی حالت پر ایک سلسلہ آواز - اور ابو ثعلبہ خشنی نے احمد میں مسکینی کے ذریعہ صحیح کہا ہے، لہٰذا صحیح مسلم مسلم میں کیا ہے۔ اور دل کو سکون ملتا ہے، اور گناہ وہ ہے جس سے روح کو سکون نہیں ملتا خواہ مفتیان آپ کو فتویٰ دیں'، اسی طرح ایک اچھا سلسلہ ⁦(جامع العلوم والحکم صفحہ 566-580)⁩۔"
  tr: "El-Nevevi, yirmi yedinci ciltte iki hadis derlemiştir: Birincisi, Peygamberimiz'den rivayet edilen ve El-Neves bin Saman'ın naklettiği hadistir: \"Doğruluk güzel ahlaktır, günah ise vicdanınızı rahatsız eden ve insanların bilmesinden hoşlanmadığınız şeydir.\" Bu hadis, Müslim (2553) tarafından Muaviye bin Salih'ten, o da Abdül-Rahman bin Cübeyr bin Nufeyr'den, o da babasından, o da El-Neves'ten rivayet edilmiştir - ve bunlar Müslim tarafından rivayet edilen hadislerdir, Buhari tarafından değil - ve Ahmed, El-Darimi, Buhari'nin El-Adab El-Mufrad'ında, Tirmizi (2389) ve diğerleri tarafından da rivayet edilmiştir; İkincisi ise Vebisa bin Ma'bad'dan rivayet edilmiştir. O şöyle demiştir: \"Allah'ın Resulü'ne geldim ve salih ile günah konusunda hiçbir şeyi sormadan bırakmak istemedim. Bunun üzerine bana, 'Saldiri ve günah hakkında soru sormaya mı geldin?' diye sordu. Ben de 'Evet' dedim.\" Ahmed'in tam rivayetinde ise, dizine değecek kadar yaklaştı ve üç parmağını göğsüne vurarak şöyle dedi: \"Ey Vebisa, vicdanına danış: Salih, kalbin ve ruhun huzur bulduğu şeydir; günah ise kalbi sızlatan ve göğüste tereddüte neden olan şeydir, insanlar sana fetva verseler bile.\" Nevevi şöyle demiştir: Bu, Ahmed ve Darimi'nin Musned'lerinde sağlam bir isnadla rivayet edilen sahih bir hadistir. İbn Receb'e göre, Vabisa hadisinin rivayet zincirinde, her biri zayıflığını gerektiren iki şey vardır: Zübeyr ibn Abdül-Selam ile Eyyub ibn Abdül-Allah ibn Makraz arasında bir kopukluk vardır, çünkü o, duymadığı kişilerden rivayet etmiştir; ve Zübeyr'in kendisi de zayıftır. Darkütni şöyle demiştir: O, sakıncalı hadisler rivayet etmiş ve İbn Hibban onu zayıf bulup ona Eyyub ibn Abdül-Selam adını vermiştir, böylece isminde hata yapmıştır. Ayrıca Ahmed'de Vabisa'dan başka bir rivayet yolu daha vardır; bu yol Muaviye ibn Salih tarafından Ebu Abdül-Sulami'den özlü bir şekilde şöyle rivayet edilmiştir: \"Doğruluk, kalbinizin huzur bulduğu şeydir; günah ise, insanlar size bunun hakkında fetva verseler bile, kalbinizi rahatsız eden şeydir.\" Bu Al-Sulami'den Ali ibn Al-Madini şöyle demiştir: \"O bilinmiyor ve bazı rivayetlerde yalan söylemesi ve uydurmasıyla meşhur olan, Al-Mansur'un sapkınlık yüzünden çarmıha gerdiği Muhammed ibn Saeed Al-Masloub olduğu kabul edilmiştir, ancak Abd Al-Ghani ibn Saeed'in dediği gibi Wabisa ile görüşmemiştir. Bu hadisin sağlam rivayet zincirleri vardır; bunlardan biri de Ahmed ve İbn Hibban'ın, Yahya ibn Abi Kathir'den, o da Zeyd ibn Salam'dan, o da dedesinden, o da kendi rivayetine dayanarak naklettiği Ebu Umame hadisidir: 'Eğer bir şey kalbinizi rahatsız ediyorsa, onu bırakın.' Bu, Müslim'in şartlarına göre sağlam bir rivayet zinciridir.\" Ayrıca, Ahmed'in Müslim ibn Mişkam'dan rivayet ettiği Ebu Tha'labe el-Huşani hadisi şöyledir: \"Doğruluk, nefsin huzur bulduğu ve kalbin sükûnet bulduğu şeydir; günah ise nefsin huzur bulamadığı ve kalbin sükûnet bulamadığı şeydir, müftü size fetva verse bile.\" Bu rivayet zinciri de sahihtir (Cami' el-Ulum ve el-Hikam, s. 566-580)."
  id: "Dua hadits dikumpulkan oleh Al-Nawawi dalam terbitan ke-27: Yang pertama dari Al-Nawas bin Sam’an dari Nabi, yang bersabda: “Kebajikan adalah akhlak yang baik, dan dosa adalah apa yang menusuk hati nuranimu dan kamu tidak suka orang lain mengetahuinya.” Diriwayatkan oleh Muslim (2553) dari Mu’awiyah bin Salih dari Abd Al-Rahman bin Jubayr bin Nufayr dari ayahnya dari Al-Nawas — dan ini adalah hadits-hadits yang diriwayatkan oleh Muslim, bukan Al-Bukhari — dan diriwayatkan oleh Ahmad, Al-Darimi, Al-Bukhari dalam Al-Adab Al-Mufrad, Al-Tirmidhi (2389) dan lainnya; Dan yang kedua diriwayatkan dari Wabisa bin Ma’bad, yang berkata: Aku datang kepada Rasulullah, dan aku ingin tidak melewatkan satu pun hal tentang kebaikan dan dosa tanpa bertanya tentangnya, lalu beliau bertanya, “Apakah kamu datang untuk bertanya tentang kebaikan dan dosa?” Aku menjawab, “Ya.” Dan dalam riwayat Ahmad yang lengkap, beliau mendekat hingga lututnya menyentuh lututnya, lalu beliau menyatukan tiga jarinya, mengetuk-ngetuknya di dadanya, dan berkata, “Wahai Wabisa, tanyakanlah pada hati nuranimu: Kebaikan adalah apa yang membuat hati dan jiwa merasa tenang, dan dosa adalah apa yang menusuk hati dan menyebabkan keraguan di dada, meskipun orang-orang terus memberikan fatwa kepadamu.” Al-Nawawi berkata: Ini adalah hadits yang baik yang diriwayatkan dalam Musnad Ahmad dan Al-Darimi dengan sanad yang baik. Dalam rantai periwayatan hadits Wabisa, menurut Ibnu Rajab, terdapat dua hal yang masing-masing menyebabkan kelemahannya: adanya pemutusan antara Al-Zubayr ibn Abd Al-Salam dan Ayyub ibn Abd Allah ibn Makraz, karena ia meriwayatkannya dari orang-orang yang tidak ia dengar, dan Al-Zubayr sendiri lemah. Al-Darqutni berkata: Ia meriwayatkan hadits-hadits yang tidak dapat diandalkan, dan Ibnu Hibban menganggapnya lemah dan menyebutnya Ayyub ibn Abd Al-Salam, sehingga ia melakukan kesalahan dalam penamaannya. Dan ia memiliki jalur lain dari Wabisa dalam Ahmad, yang diriwayatkan oleh Muawiyah ibn Salih atas otoritas Abu Abd Allah Al-Sulami dengan redaksi yang ringkas: “Kebajikan adalah sesuatu yang membuat hatimu tenang, dan dosa adalah sesuatu yang menusuk hatimu, meskipun orang-orang memberikan fatwa tentangnya.” Al-Sulami ini, Ali ibn Al-Madini berkata: Dia tidak dikenal, dan dalam beberapa riwayat diyakini bahwa dia adalah Muhammad ibn Saeed Al-Masloub, yang terkenal karena berbohong dan mengarang cerita, yang disalib oleh Al-Mansur karena bid'ah, tetapi dia tidak bertemu Wabisa, sebagaimana dikatakan Abd Al-Ghani ibn Saeed. Ada sanad yang baik untuk hadits ini, termasuk hadits Abu Umamah, diriwayatkan oleh Ahmad dan Ibn Hibban, dari Yahya ibn Abi Kathir, dari Zayd ibn Salam, dari kakeknya, darinya: “Jika sesuatu mengganggu hatimu, tinggalkanlah.” Ini adalah sanad yang baik menurut syarat Muslim. Selain itu, hadits Abu Tha’labah al-Khushani, yang diriwayatkan oleh Ahmad, dari Muslim ibn Mishkam: “Kebajikan adalah sesuatu yang menyejukkan jiwa dan menenangkan hati, sedangkan dosa adalah sesuatu yang tidak menyejukkan jiwa dan menenangkan hati, meskipun mufti telah mengeluarkan fatwa.” Rantai periwayatan ini juga baik (Jami’ al-‘Ulum wa al-Hikam, hlm. 566–580)."
