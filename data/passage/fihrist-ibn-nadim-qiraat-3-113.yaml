text: "… خلق الانسان. كتاب الفرق. كتاب الزجر والدعاء. كتاب خلق الفرس. كتاب أبو يونس. كتاب مختصر العربية ابن سعدان أبو جمفر محمد بن سعدان الضرير وكان معلما للعامة. وأحد القراء بقراءة حمزة ثم اختار لنفسه ففسد عليه الاصل والفرع بغدادى المولد …"
