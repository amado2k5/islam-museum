label: { ar: "الموطأ 1826 — مالك عن عبد الله بن يزيد عن زيد أبي عياش: سأل سعد بن أبي وقاص عن البيضاء بالشلت، فنهاه عنه، لأنه سمع النبي سئل عن شراء التمر بالرطب فقال أينقص الرطب إذا يبس", en: "Muwatta 1826" }
summary:
  ar: "يروي مالك عن عبد الله بن يزيد، مولى الأسود بن سفيان عند المحقق، عن زيد أبي عياش أنه سأل سعد بن أبي وقاص عن البيضاء بالشلت، فقال له سعد: أيتهما أفضل؟ قال: البيضاء. فنهاه عن ذلك، وقال سعد: سمعت رسول الله سئل عن اشتراء التمر بالرطب، فقال رسول الله: أينقص الرطب إذا يبس؟ فقالوا: نعم، فنهى عن ذلك. وذكر المحقق قول مالك في الحاشية: كل رطب بيابس من نوعه حرام. {cite:muwatta-maruf-1997 p.147}"
