label: { ar: "الموطأ 1826 — مالك عن عبد الله بن يزيد عن زيد أبي عياش: سأل سعد بن أبي وقاص عن البيضاء بالشلت، فنهاه عنه، لأنه سمع النبي سئل عن شراء التمر بالرطب فقال أينقص الرطب إذا يبس", en: "Muwatta 1826", es: "Muwatta 1826", fr: "Muwatta 1826", ur: "موطا 1826", tr: "El-Muvatta 1826 — Malik, Abdullah bin Yazid'den, o da Zeyd Ebu Ayyaş'tan rivayetle: Saad bin Ebu Vakkas, beyaz hurmayı kuru hurmayla karıştırmak hakkında sordu ve Peygamberimiz'in taze hurmayı karıştırmak hakkında soru sorulduğunu işittiği için bunu yasakladı: \"Taze hurma kuruyunca değer kaybeder mi?\"", id: "Al-Muwatta 1826 — Malik, berdasarkan riwayat Abdullah bin Yazid, berdasarkan riwayat Zaid Abu Ayyash: Saad bin Abi Waqqas bertanya tentang membeli kurma putih dengan kurma kering, dan beliau melarangnya, karena beliau mendengar Nabi ditanya tentang membeli kurma segar, dan beliau berkata: Apakah kurma segar berkurang nilainya ketika mengering?" }
summary:
  ar: "يروي مالك عن عبد الله بن يزيد، مولى الأسود بن سفيان عند المحقق، عن زيد أبي عياش أنه سأل سعد بن أبي وقاص عن البيضاء بالشلت، فقال له سعد: أيتهما أفضل؟ قال: البيضاء. فنهاه عن ذلك، وقال سعد: سمعت رسول الله سئل عن اشتراء التمر بالرطب، فقال رسول الله: أينقص الرطب إذا يبس؟ فقالوا: نعم، فنهى عن ذلك. وذكر المحقق قول مالك في الحاشية: كل رطب بيابس من نوعه حرام. {cite:muwatta-maruf-1997 p.147}"
  tr: "Malik, el-Aswad ibn Sufyan'ın azatlı kölesi Abdullah ibn Yazid'den, el-Muhaqqiq'in Zeyd Ebu Ayyaş'tan rivayet ettiğine dayanarak, Sa'd ibn Abi Waqqas'a taze hurma ile kuru hurma almanın yasak olduğunu sorduğunu anlatır. Sa'd ona, \"Hangisi daha iyidir?\" diye sormuş. O da, \"Taze hurma\" diye cevap vermiş. Bunun üzerine Sa'd ona bunu yasaklamış. Sa'd şöyle demiş: \"Allah Resulü'ne taze hurma ile kuru hurma almanın yasak olduğu sorulduğunu duydum. Allah Resulü, 'Kuru hurmalar kurudukça ağırlık kaybeder mi?' diye sormuş. Onlar da 'Evet' diye cevap vermişler. Bunun üzerine o da bunu yasaklamış.\" El-Muhaqqiq, Malik'in bu ifadesini dipnotta şöyle belirtir: \"Aynı türden kuru hurmanın taze hurma ile değiştirilmesi yasaktır.\" {cite:muwatta-maruf-1997 s.147}"
  id: "Malik meriwayatkan dari Abdullah ibn Yazid, budak yang dibebaskan oleh al-Aswad ibn Sufyan, sebagaimana dicatat oleh al-Muhaqqiq, dari Zayd Abu Ayyash, bahwa ia bertanya kepada Sa'd ibn Abi Waqqas tentang membeli kurma segar dengan kurma kering. Sa'd bertanya kepadanya, \"Mana yang lebih baik?\" Ia menjawab, \"Kurma segar.\" Maka Sa'd melarangnya melakukan hal itu. Sa'd berkata, \"Aku mendengar Rasulullah ditanya tentang membeli kurma segar dengan kurma kering. Rasulullah bertanya, 'Apakah kurma kering berkurang beratnya ketika dikeringkan?' Mereka menjawab, 'Ya.' Maka beliau melarangnya.\" Al-Muhaqqiq menyebutkan pernyataan Malik di margin: \"Pertukaran kurma kering dengan kurma segar dari jenis yang sama adalah haram.\" {cite:muwatta-maruf-1997 p.147}"
