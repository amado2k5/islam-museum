text: "… ابن العديم : ومعها الأبيات. السطر ولقد نزلت بروضة حزنية.... الأبيات، وردت في ابن الشعار : عند آخر ترجمة عمارة بهامش بر زيادة منقولة عن ابن حجة الحموي من كتابه ثمرات الأوراق وهي من غير الأصل. السطر ولما حضرته الوفاة …"
