text: "… ذهبت أمثالاً، وكان لها تأثير كبير في اللغة. ومن أمثالها من جوامع الكلم قول النبي : حمي الوطيس. وقوله : مات حتف أنفه. إنما الأعمال بالنيات. الذين النصيحة. الصبر عند الصدمة الأولى. افة العلم النسيان. لا يلدغ المؤمن من جحر …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1590، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
