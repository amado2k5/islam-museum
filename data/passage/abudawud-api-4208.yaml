label: { ar: "سنن أبي داود 4208 — الأب والأبوة", en: "Sunan Abi Dawud 4208 — the father and fatherhood", ur: "سنن ابی داؤد 4208 — باپ اور والدیت", es: "Sunan Abi Dawud 4208 — El padre y la paternidad", fr: "Sunan Abi Dawud 4208 — Le père et la paternité", tr: "Sunan Abi Dawud 4208 — Baba ve Babalık", id: "Sunan Abi Dawud 4208 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنْ إِيَادِ بْنِ لَقِيطٍ، عَنْ أَبِي رِمْثَةَ، قَالَ أَتَيْتُ النَّبِيَّ أَنَا وَأَبِي فَقَالَ لِرَجُلٍ أَوْ لأَبِيهِ \" مَنْ هَذَا \". قَالَ ابْنِي. قَالَ \" لاَ تَجْنِي عَلَيْهِ \". وَكَانَ قَدْ لَطَخَ لِحْيَتَهُ بِالْحِنَّاءِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4208، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4208 (Combing the Hair (Kitab Al-Tarajjul)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4208، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4208 (El peinado (Kitab Al-Tarajjul)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4208 (Le peignage des cheveux), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4208 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4208, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
