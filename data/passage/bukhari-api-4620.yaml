text: "… الْخَمْرَ، الَّتِي أُهْرِيقَتِ الْفَضِيخُ. وَزَادَنِي مُحَمَّدٌ عَنْ أَبِي النُّعْمَانِ قَالَ كُنْتُ سَاقِيَ الْقَوْمِ فِي مَنْزِلِ أَبِي طَلْحَةَ فَنَزَلَ تَحْرِيمُ الْخَمْرِ، فَأَمَرَ مُنَادِيًا فَنَادَى. فَقَالَ أَبُو طَلْحَةَ اخْرُجْ فَانْظُرْ مَا هَذَا الصَّوْتُ قَالَ فَخَرَجْتُ فَقُلْتُ هَذَا مُنَادٍ يُنَادِي أَلاَ إِنَّ الْخَمْرَ قَدْ حُرِّمَتْ. فَقَالَ لِي اذْهَبْ فَأَهْرِقْهَا. قَالَ فَجَرَتْ فِي سِكَكِ الْمَدِينَةِ. قَالَ وَكَانَتْ خَمْرُهُمْ يَوْمَئِذٍ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4620، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4620 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4620، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4620 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), menciona la prohibición. El Navegador Halal y Haram lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4620 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne une interdiction. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 4620 numaralı hadis, bu yasağı zikretmektedir. Helal ve Haram tarayıcısı, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alınan metinleri bir araya getirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4620, menyebutkan larangan tersebut. Peramban Halal dan Haram menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
