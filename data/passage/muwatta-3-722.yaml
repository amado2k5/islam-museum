label: { ar: "الموطأ 722 — مالك: من منع فريضة من فرائض الله فلم يستطع المسلمون أخذها كان حقاً عليهم جهاده حتى يأخذوها", en: "Muwatta 722", es: "Muwatta 722", fr: "Muwatta 722", ur: "موطا 722", tr: "El-Muvatta 722 — Malik: Allah'ın farzlarından birinin yerine getirilmesine engel olan kimse, Müslümanlar da onu elde edemezlerse, o görevi elde edene kadar ona karşı cihat etme hakkına sahiptirler.", id: "Al-Muwatta 722 — Malik: Barang siapa yang menghalangi terpenuhnya salah satu kewajiban Allah, dan kaum Muslimin tidak mampu memperolehnya, maka mereka berhak untuk berjihad melawannya sampai mereka memperolehnya." }
summary:
  ar: "قول لمالك: الأمر عندنا أن كل من منع فريضة من فرائض الله فلم يستطع المسلمون أخذها كان حقاً عليهم جهاده حتى يأخذوها منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.362}"
  tr: "Malik şöyle demiştir: “Bizim görüşümüz şudur ki, kim Allah'tan bir yükümlülüğü esirgerse ve Müslümanlar bunu yerine getiremezlerse, Müslümanların bu yükümlülüğü ondan elde edene kadar ona karşı cihat etme hakkı vardır.” Araştırmacı, bu rivayetin Ebu Musab tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.362}"
  id: "Malik berkata: “Pendirian kami adalah bahwa siapa pun yang menahan suatu kewajiban kepada Allah, dan kaum Muslimin tidak mampu memenuhinya, maka mereka berhak untuk berjihad melawannya sampai mereka memperolehnya darinya.” Peneliti menyebutkan bahwa Abu Mus’ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.362}"
