text: "… بن جعفر بن سلم، وأبا بكر بن مالك القطيعى ومخلد بن جمفر الدعاق، وجماعة من هذه الطبقة. كتبنا عنه وكان صدوقا ناضلا ا بالقراآت يسكن درب سليم من الجانب الشرقى. ومات يوم الاربعاء لارا خاون من المحرم سنة خمس عشرة …"
