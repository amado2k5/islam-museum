label: { ar: "سنن أبي داود 2053 — الأجران", en: "Sunan Abi Dawud 2053 — the double reward", ur: "سنن ابی داؤد 2053 — دوہرا اجر" }
text: "حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ، حَدَّثَنَا عَبْثَرٌ، عَنْ مُطَرِّفٍ، عَنْ عَامِرٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ أَعْتَقَ جَارِيَتَهُ وَتَزَوَّجَهَا كَانَ لَهُ أَجْرَانِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2053، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 2053 (Marriage (Kitab Al-Nikah)), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 2053، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
