text: "… وروى عنه جعفر بن محمد: السجود على المِرْفَقَةِ إذا كان في المَحْمِلِ، وربما أسند على البعير، ولكن يُومىء ويجعل السجودَ أخفضَ مِن الركوع، وكذا روى عنه أبو داود. فصل في هديه وَل في في صلاة الضحى من روى ترك النبي …"
