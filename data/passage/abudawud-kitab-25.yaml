summary:
  ar: "القسم 25 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأقضية»، ويضم فيها النصوص من 3571 إلى 3640 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 25 of Sunan Abi Dawud (The Office of the Judge (Kitab Al-Aqdiyah)) in the division of the open hadith dataset the museum took its reports from: reports 3571 to 3640 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 25، عنوان «کتاب الاقضیۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3571 تا 3640۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 25 de Sunan Abi Dawud (La Oficina del Juez (Kitab Al-Aqdiyah)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3571 al 3640, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Le Bureau du Juge – Kitab Al-Aqdiyah), dans la section 3571 à 3640 de la base de données ouverte. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 25. bölümü, açık hadis veri tabanında yer almakta olup \"Hükümler Kitabı\" başlığını taşımaktadır. Bu bölümde, sırasıyla numaralandırılmış 3571 ila 3640 numaralı metinler bulunmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 25 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab Keputusan\". Bagian ini berisi teks 3571 hingga 3640, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
