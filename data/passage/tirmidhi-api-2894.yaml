label: { ar: "جامع الترمذي 2894 — عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 2894 — a deed that equals a greater one", ur: "جامع ترمذی 2894 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Jami' al-Tirmidhi 2894 — una acción que equivale a una mayor", fr: "Jami' al-Tirmidhi 2894 — un acte qui en vaut un plus grand", tr: "Cami' el-Tirmizi 2894 — Daha büyük bir amele denk bir amel", id: "Jami' al-Tirmidhi 2894 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… أَخْبَرَنَا يَزِيدُ بْنُ هَارُونَ، قَالَ أَخْبَرَنَا يَمَانُ بْنُ الْمُغِيرَةِ الْعَنَزِيُّ، حَدَّثَنَا عَطَاءٌ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا زُلْزِلَتِ تَعْدِلُ نِصْفَ الْقُرْآنِ وَقُلْ هُوَ اللَّهُ أَحَدٌ تَعْدِلُ ثُلُثَ الْقُرْآنِ وَ قُلْْ يَا أَيُّهَا الْكَافِرُونَ تَعْدِلُ رُبُعَ الْقُرْآنِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ يَمَانِ بْنِ الْمُغِيرَةِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2894، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2894 (Chapters on The Virtues of the Qur'an), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2894، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2894 (Capítulos sobre las virtudes del Corán), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2894 (Chapitres sur les vertus du Coran), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent un acte."
  tr: "Cami' el-Tirmizi'de 2894 numaralı hadis, daha büyük bir ameli sayan bir ameli zikrediyor. Bu amel, iyi ve kötü ameller listesiyle birlikte, amelin değerini sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2894, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
