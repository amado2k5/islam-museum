text: "… أَيَّامِ الْكَفَّارَةِ أَمُتَتَابِعَاتٍ أَمْ يَقْطَعُهَا قَالَ حُمَيْدٌ فَقُلْتُ لَهُ نَعَمْ يَقْطَعُهَا إِنْ شَاءَ. قَالَ مُجَاهِدٌ لاَ يَقْطَعُهَا فَإِنَّهَا فِي قِرَاءَةِ أُبَىِّ بْنِ كَعْبٍ ثَلاَثَةِ أَيَّامٍ مُتَتَابِعَاتٍ. قَالَ مَالِكٌ وَأَحَبُّ إِلَىَّ أَنْ يَكُونَ مَا سَمَّى اللَّهُ فِي الْقُرْآنِ يُصَامُ مُتَتَابِعًا. وَسُئِلَ مَالِكٌ عَنِ الْمَرْأَةِ تُصْبِحُ صَائِمَةً فِي رَمَضَانَ فَتَدْفَعُ دَفْعَةً مِنْ دَمٍ عَبِيطٍ فِي غَيْرِ أَوَانِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 679، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Muwatta Malik, no. 679 (Fasting), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "موطأ مالک کی حدیث نمبر 679، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 679 (Ayuno), menciona las lecturas del Corán. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un rapport du Muwatta Malik, n° 679 (Le jeûne), mentionne les lectures du Coran. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Malik'in Muwatta adlı eserinde 679 numaralı hadis, Kur'an'ın farklı okunuşlarından bahsetmektedir. Bu hadis, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 679, menyebutkan berbagai macam bacaan Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
