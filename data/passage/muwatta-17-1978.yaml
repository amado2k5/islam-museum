label: { ar: "الموطأ 1978 — مالك: لو أن رجلا ابتاع سلعة فوجبت له، ثم قال له رجل: أشركني بنصف هذه السلعة وأنا أبيعها لك جميعا، كان ذلك حلالا، وهو بيع جديد باعه نصف السلعة على أن يبيع له النصف الآخر", en: "Muwatta 1978", es: "Muwatta 1978", fr: "Muwatta 1978", ur: "موطا 1978", tr: "El-Muvatta 1978 — Malik: Bir adam bir malı satın alıp ona mal olduktan sonra, başka bir adam ona, “Bu malın yarısını benimle paylaş, ben de tamamını sana satayım” derse, bu caizdir ve bu, malın yarısını diğer yarısını ona satma şartıyla sattığı yeni bir satış olur.", id: "Al-Muwatta 1978 — Malik: Jika seseorang membeli suatu barang dan barang itu menjadi miliknya, lalu orang lain berkata kepadanya: “Bagikan setengah dari barang ini denganku dan aku akan menjual semuanya kepadamu,” maka itu diperbolehkan, dan itu adalah penjualan baru di mana dia menjual setengah dari barang tersebut dengan syarat dia akan menjual setengahnya lagi kepadanya." }
summary:
  ar: "قال مالك: ولو أن رجلا ابتاع سلعة فوجبت له، ثم قال له رجل: أشركني بنصف هذه السلعة، وأنا أبيعها لك جميعا، كان ذلك حلالا لا بأس به. وتفسير ذلك أن هذا بيع جديد، باعه نصف السلعة على أن يبيع له النصف الآخر. {cite:muwatta-maruf-1997 p.209}"
  tr: "Malik şöyle demiştir: Bir adam bir malı satın alıp ona mal olduktan sonra, başka bir adam ona, “Bu malın yarısını bana ver, geri kalanını sana satacağım” dese, bu caizdir ve bunda bir sakınca yoktur. Açıklama şudur ki, bu yeni bir satıştır; adam, malın yarısını diğer yarısını satma şartıyla ona satmıştır. {cite:muwatta-maruf-1997 s.209}"
  id: "Malik berkata: Jika seseorang membeli suatu barang dan barang itu menjadi miliknya, lalu orang lain berkata kepadanya, “Biarkan aku memiliki setengah dari barang ini, dan aku akan menjual semuanya kepadamu,” maka hal itu diperbolehkan dan tidak ada yang salah dengan itu. Penjelasannya adalah bahwa ini adalah penjualan baru; ia menjual setengah barang itu dengan syarat ia akan menjual setengahnya lagi kepadanya. {cite:muwatta-maruf-1997 p.209}"
