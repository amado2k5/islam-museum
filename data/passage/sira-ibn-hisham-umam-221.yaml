text: "… بني عَبْدِ الدار بن قُصَي: النَّضُر بن الحارث بن كَلَدَةَ. ومن بني أَسَدِ بن عبد الْعُزَّى : أبو الْبَخْتَرِيّ بن هشام، وَزَمْعَةُ بن الأسود بن المطلب، وحَكيم بن حِزام. ومن بني مَخْزُوم : أبو جهل بن هشام. ومن بني سَهُم: …"
