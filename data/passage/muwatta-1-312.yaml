label: { ar: "الموطأ 312 — بلاغ عن سعيد بن المسيب: يكره النوم قبل العشاء والحديث بعدها", en: "Muwatta 312", es: "Muwatta 312", fr: "Muwatta 312", ur: "موطا 312", tr: "El-Muvatta 312 — Sa'id ibn el-Musayyab'dan rivayet edildiğine göre: Akşam namazından önce uyumak ve namazdan sonra konuşmak mekruhtur.", id: "Al-Muwatta 312 — Diriwayatkan dari Sa’id ibn al-Musayyab: Tidak disukai tidur sebelum shalat Maghrib dan berbicara setelahnya." }
summary:
  ar: "بلاغ في باب ما جاء في صلاة الليل: يروي مالك أنه بلغه أن سعيد بن المسيب كان يقول إنه يُكره النوم قبل العشاء والحديث بعدها. ويذكر المحقق أن أبا مصعب رواه عن مالك، وينقل عن ابن عبد البر أنه وإن لم يكن فيه ذكر النبي فهو مروي عنه مشهور محفوظ من حديث أبي برزة الأسلمي وغيره ⁦(التمهيد 24/215)⁩، ويذكر أن حديث أبي برزة في الصحيحين. {cite:muwatta-maruf-1997 p.175} {cite:muwatta-maruf-1997 p.176}"
  tr: "Gece namazı hakkında rivayet edilen bir rapor: Malik, Sa'id ibn al-Musayyab'ın, yatsı namazından önce uyumanın ve ondan sonra konuşmanın mekruh olduğunu söylediğini işittiğini bildirmiştir. Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın rivayet ettiğini ve İbn Abd al-Barr'ın, Peygamber'den bahsedilmese de, Ebu Berza el-Aslami ve diğerlerinin hadisleriyle nakledilen, iyi bilinen ve korunmuş bir rivayet olduğunu söylediğini aktarmaktadır (el-Tamhid 24/215). Ayrıca Ebu Berza'nın hadisinin iki Sahih'te (Buhari ve Müslim) bulunduğunu da belirtmektedir. {cite:muwatta-maruf-1997 s.175} {cite:muwatta-maruf-1997 s.176}"
  id: "Sebuah riwayat mengenai apa yang telah diriwayatkan tentang salat malam: Malik meriwayatkan bahwa ia mendengar bahwa Sa'id ibn al-Musayyab biasa mengatakan bahwa tidak disukai tidur sebelum salat Isya dan berbicara setelahnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan mengutip Ibn 'Abd al-Barr yang mengatakan bahwa meskipun tidak menyebutkan Nabi, itu adalah riwayat yang terkenal dan lestari dari beliau, yang diriwayatkan melalui hadits Abu Barzah al-Aslami dan lainnya (al-Tamhid 24/215). Ia juga menyebutkan bahwa hadits Abu Barzah terdapat dalam dua kitab Sahih (Bukhari dan Muslim). {cite:muwatta-maruf-1997 p.175} {cite:muwatta-maruf-1997 p.176}"
