label: { ar: "الموطأ 312 — بلاغ عن سعيد بن المسيب: يكره النوم قبل العشاء والحديث بعدها", en: "Muwatta 312" }
summary:
  ar: "بلاغ في باب ما جاء في صلاة الليل: يروي مالك أنه بلغه أن سعيد بن المسيب كان يقول إنه يُكره النوم قبل العشاء والحديث بعدها. ويذكر المحقق أن أبا مصعب رواه عن مالك، وينقل عن ابن عبد البر أنه وإن لم يكن فيه ذكر النبي فهو مروي عنه مشهور محفوظ من حديث أبي برزة الأسلمي وغيره (التمهيد 24/215)، ويذكر أن حديث أبي برزة في الصحيحين. {cite:muwatta-maruf-1997 p.175} {cite:muwatta-maruf-1997 p.176}"
