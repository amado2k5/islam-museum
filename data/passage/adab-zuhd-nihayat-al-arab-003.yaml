text: "المظفر أعين النائبات، وقبض دونه أيدي الحادثات. وجاء منها: ورد له كتاب كريم جعلته عوض يده البيضاء فقبلته، ولمحته بدل غرته الغراء فأجللته؛ كتاب ألقى عليه الحبر(٤) حبره، وأهدى إليه السحر فقره؛ أنذر (٥) ببلوغ المنى، وبشر بحصول الغنى؛ تخير"
