text: "بأربع، وأنهاكم عن أربع: الإيمان بالله، وشهادة أن لا إله إلا اللّه، وإقام النقير فقد جاء في تفسيره في الرواية الأخيرة أنه جذع ينقر وسطه. وأما الصلاة، وإيتاء الزكاة، وصوم رمضان بزيادة واو. وكذلك قال فيه في أول المقير فهو …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 92، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 92, that mentions the testimony, the prayer and the zakat, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 92 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
