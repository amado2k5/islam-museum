text: "بأربع، وأنهاكم عن أربع: الإيمان بالله، وشهادة أن لا إله إلا اللّه، وإقام النقير فقد جاء في تفسيره في الرواية الأخيرة أنه جذع ينقر وسطه. وأما الصلاة، وإيتاء الزكاة، وصوم رمضان بزيادة واو. وكذلك قال فيه في أول المقير فهو …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 92، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 92, that mentions the testimony, the prayer and the zakat, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 92 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 92, que menciona el testimonio, la oración y el zakat, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 92) mentionnant le témoignage, la prière et la zakat, un des articles de foi. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 92. sayfasından, iman şahadeti, namaz, zekât ve imanın rükünlerinden birini ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari komentar Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 92, yang menyebutkan kesaksian iman, salat, zakat, dan salah satu rukun iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
