label: { ar: "صحيح البخاري 1478 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 1478 — what was left behind: estate and inheritance", ur: "صحیح بخاری 1478 — ترکہ اور میراث", es: "Sahih al-Bukhari 1478 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 1478 — Ce qui a été laissé derrière: biens et héritage", tr: "Sahih el-Buhari 1478 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sahih al-Bukhari 1478 — Apa yang ditinggalkan olehnya berupa warisan dan peninggalan" }
text: "… ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي عَامِرُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، قَالَ أَعْطَى رَسُولُ اللَّهِ رَهْطًا وَأَنَا جَالِسٌ فِيهِمْ قَالَ فَتَرَكَ رَسُولُ اللَّهِ مِنْهُمْ رَجُلاً لَمْ يُعْطِهِ، وَهُوَ أَعْجَبُهُمْ إِلَىَّ، فَقُمْتُ إِلَى رَسُولِ اللَّهِ فَسَارَرْتُهُ فَقُلْتُ مَا لَكَ عَنْ فُلاَنٍ وَاللَّهِ إِنِّي لأُرَاهُ مُؤْمِنًا. قَالَ \" أَوْ مُسْلِمًا \" قَالَ فَسَكَتُّ قَلِيلاً ثُمَّ غَلَبَنِي مَا أَعْلَمُ فِيهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1478، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1478 (Obligatory Charity Tax (Zakat)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1478، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1478 (Impuesto obligatorio sobre la caridad (Zakat)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 1478 (L'aumône obligatoire (Zakat)), mentionne ce qui a été laissé: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'nin 1478 numaralı hadisinde, geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1478, menyebutkan apa yang ditinggalkan beliau berupa harta warisan. Hadits ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, peninggalan, dan makam suci, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
