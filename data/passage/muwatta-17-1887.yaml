label: { ar: "الموطأ 1887 — مالك: لا خير في الخبز، قرص بقرصين، ولا عظيم بصغير إذا كان بعض ذلك أكبر من بعض، فإن كان يتحرى أن يكون مثلا بمثل فلا بأس به وإن لم يوزن", en: "Muwatta 1887", es: "Muwatta 1887", fr: "Muwatta 1887", ur: "موطا 1887", tr: "El-Muvatta 1887 — Malik: İki kişiye bir somun ekmek veya küçük kişiye büyük bir somun ekmek vermekte bir sakınca yoktur, eğer bir kısmı diğerlerinden büyükse. Ama eğer kişi onu eşit büyüklükte yapmaya çalışırsa, tartılmasa bile bunda bir sakınca yoktur.", id: "Al-Muwatta 1887 — Malik: Tidak ada manfaatnya roti, satu roti untuk dua orang, atau yang besar untuk yang kecil, jika sebagiannya lebih besar daripada yang lain. Tetapi jika seseorang berusaha membuatnya sama besarnya, maka tidak ada salahnya, meskipun tidak ditimbang." }
summary:
  ar: "قال مالك: ولا خير في الخبز، قرص بقرصين، ولا عظيم بصغير، إذا كان بعض ذلك أكبر من بعض. فأما إذا كان يتحرى أن يكون مثلا بمثل، فلا بأس به، وإن لم يوزن. {cite:muwatta-maruf-1997 p.175}"
  tr: "Malik şöyle demiştir: İki kişiye bir somun ekmek veya küçük kişiye büyük bir somun ekmek vermenin bir faydası yoktur, eğer bazıları diğerlerinden daha büyükse. Ama eğer kişi onları eşit yapmaya çalışırsa, tartılmamış olsalar bile bunda bir sakınca yoktur. {cite:muwatta-maruf-1997 s.175}"
  id: "Malik berkata: Tidak ada gunanya roti, satu roti untuk dua orang, atau satu roti besar untuk satu roti kecil, jika sebagian lebih besar dari yang lain. Tetapi jika seseorang berusaha untuk membuat keduanya sama besar, maka tidak ada salahnya, meskipun tidak ditimbang. {cite:muwatta-maruf-1997 p.175}"
