text: |-
  ⁦(ف صل الواو)⁩
  ٦٢٩
  ويوجع رأسى ولاتة ل يوجعنى رأسى والعامة تقوله قال الصمة بن عبد الله القشيرى
  تلفت نحوالحىّ حتى وجدتنى * وجعت من الاصغاءليتا وأخدعا
  والايجاع الايلام وضرب وجيع أى موج-ع مثل أليم؛*ى مؤلم وتوجعت لفلان من كذا
  أى رئيت له والوجعاء الساذلة وهى الدبرومنه قول الشاءر واذا يشد على وجعائها الثهر
  يعنى أنها يوضعت والجعة نبيذ الشعير عن أبي عبيد ولست أدرى مانقصانه ⁦( ودع)⁩.
  التبوديع هند الرحيل والاسيم الوداع بالفتح وتوديع الفحل اقتناؤه للفحلة وقوله تعالى
  ماودّعك ريك قالوا ماتركك وتوديع الثوب أن تجع-له فى صوان إصونه والودعات مناقف
  صغار تخرج من البحروهى خرزيض تتفاوت فى الصغر والكبر قال الشاءر ١
  ولا أاقى لذى الودعات سوطى * لاخدعه وغرته أريد
  الواحدة ودعة وودعة أيض ابالتحريك قال الشاعر والحلم -لم ذبى يمرث الودعه
  والدعة انافض والهاءعوض من الواوتقول منه ودع الرجل بالضم فهو ودينع أى ساكن
  ووادع أيضا مثل حض فهوحامض بقال نال فلان المكارم وادعامن غير كافة ورجل
  مندع أى صاحب دعة وراحة والموادعة الصالحة والتوادع التصالح وقولهم عليك
  بالمودوع أى بالسكينة والوقار ولا يقال منه ودعه كمالا يقال من المعسور والميدور عسره
  ويسره وتواه-م دع ذا أى اتركه وأص_لدودع يدع وقد أميت ماضيه لا يقال ودعه واننا
  يقال تركه ولا وادع ولكن تارك ورباجاء فى ضرورة الشه رودعه فهو مودوع على أصله وقال
  ليت شعرى عن خليلى ما الذى • غاله فى الحب-ق ودعه
  وقال خفاف بن تدبة
  اذا ما استحمت أرضه من معمائه • جرى وهو مودوع وواعدمصدق
  أى مترول لا يضرب ولا يزجر والوديعة واحدة الودائع قال الكسائى يقال أودعته مالا أى
  دفعته الله يكون وديعة عنده وأودعمه أيضا اذادفع اليك مالالمكون وديعة عندك
  فقبلتها وهو. ن الاضداد واستودعته وديعة اذا استحفظته ايادا قال الشاءر
  استودع العلم قرطاسافضيعه * فبئس مستودع العلم القراطيسن
  والميدع والميدعة واحدة الموادع قال الكسائى هى النياب الخلقان التى: بتذل مثل المعاوز
  والاودح اسم من أسماء البربوع وودعان امم موضع ⁦(ورع)⁩. الورع بالتحريك لسلبان
  قال ابن السكيت وأصحابنايدهبون بالورع الى المبان وايس كذلكْ وانما الورع الصغير
  الضعيف الذى لاغناءعنده ويقال اغمامات فلان أوراع أى صغار تقول منه ورع بالضم
  يورع وروعا ووراعسة وورعا أيضا بالضم ساكفة الراء والورع بكسر الراء الرجل الذق
  وقد ورع يرع بالكسر فيهما ورعاورعة يقال فلان سيء الرعة أى قليل الورع وتورع من كذا
  أى غحرج وورعته تور يعا أى كففته وفى حديث عمررضى اللّٰه عنه ورّع اللص ولا تزاعه
  أى اذا رأيته فى منزلك قادفعه واكففه ولا تنظرما يكون منه وورعت الابل عن الماءرددتها
  والموارعة المناطقة والمكالمة قال حسان بن ثابت
  تشدت بنى النجار أنعال والدى • اذا العارلم يوجده من يوارعه
  محاح
  ⁦(١)⁩ عقيل بن علفة المرى كمافى
  نيخة
  قوله وقد أميت ماضيه نازعِ فى
  ذلا محشى القاموس بماسيذكره
  من الشعر وبماورد فى الحديث
  وفى القراءة الشاذة فانظره قالغ
  ندر
