text: "… لحدها عجَّ أهلها وبكوها فقال: ما تبكون؟ أما والله لو عاينوا ما عاين ميتهم لأذهلتهم معاينتهم عن ميتهم! إن له فيهم لعودة ثم عودة حتى لا يبقي منهم أحداً. ثم قام فقال: أوصيكم عبادَ اللّٰه بتقوى اللّٰه الذي ضرب لكم …"
summary:
