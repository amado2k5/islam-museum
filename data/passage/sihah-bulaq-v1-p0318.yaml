text: |-
  ⁦(نأد)⁩
  ٣٢٣
  الذى هو العضوفى الجمع وقال الاخفس هومن الجمسع الذى ليسه واحدمثل العباديد
  والابابيل والذكر من الحديد خلاف الانت وذ كور البقل ماغلظ منه والى المرارة هو
  وسيف ذكرومذكر أى ذوماء قال أبو عيبد هى سيوف شفراتها حديدذكرومتونها أنيت
  قال ويقول الناس ائم امن عمل الجنّ والمذكرة الناقة الق تشبه الجم-ل فى الخاق وانخلق
  ويقال ذهبت ذكرة السيف وذكرة الرجل أى حدتهما وفى الحديث انه كان يطوف فى ليلة
  على نسائه ويغتل من كل واحدة منهنّ غسلا فسئل عن ذلك فقال انه أذ كريعنى أحد
  وسيف ذوذ كرأى صارم ورجل ذكيرجيدالذكروالحفظ والتذكير خلاف التأنيث
  والذكروالذكرى بالكسر خلاف النسيان وكذلك الذكرة وقال كعب بن زهير
  أنى ألمّ بمن الخيال يطيف • ومطافه لك ذكرة وشف وف
  والذكرى مثلدتة ول ذكرنه ذكرى غير مجراة وقواهم اجعله منك على ذكروذ كر ؟عو والذكر
  قود الصيت هو يكسر الصاذ
  الصيت والثناء وقوله تعالى ص والقرآن ذى الذكرأى ذى الشرف ويقال أيضا كم الذكرة
  لا بالامالة كانبه عليه صاحب
  من ولد أى الذكور وذكرن الشئ بعد النسيان وذكرته بلسانى وبقلبى وتذكرته وأذ كرته
  الوفيسات اه
  غيرى وذكرته بمعنى قال اللّه تعالى واذّكر بعدأمة أى ذكره بعدنسيان وأصلداذ تبكر فأدغم
  والتذكرة ماتستدكربه الحاجة وأذكرت المرأة فهى مذكراذا وادت ذكرا والمذ كارالنى
  من عادتها أن تلد الذكورويذكريطن من ربيعة ⁦(ذهر)⁩ الذهر الشجاع وفيه أربع لذات
  ذهر وذهر-ثل كبدوكيد وذمير مثل كبيروذمر مشال فلز ويجمع الذهراذ مادوذمرته
  أذمره ذهراحننته وذمر الاسد أى زأروتدامر الفوم أى حث بعضهم بعضاوذلك فى
  الحرب وقولهم فلان حامى الذماراى اذاذعر وغضب حى وفلان أمنع ذمارامن فلان
  ويقال الذمار ما وراء الرحل عما يحق عليه أن يحسميه لا نهسم قالواحامى الذمار كما قالواحامى
  لحقيقة وسمى ذمارالانه يجب على أهله التذمر له وسميت حقيقة لانه يحق على أهلها الدفع
  عنها وأقبسل فلان يتذعر كأنه يلوم نفسه على فائت وظل يتذهر على فلان اذا تنكره
  وأوعده والتذهير أن يدخل الرجل يده فى حياه النساقة لينظر أذكر جنيتها أم أننى قال الشاعر
  وقال المذمر النساتجين متى ذمّرت قبلى الارجل
  والمذقر الكاهل والعنق وماحوه الى الذفرى وهوالذى يذقره المذمر ⁦(ذير)⁩ التذيي
  أن تلطخ الطباء الناقة بالذياروهو بع ررطب الملاير تضعها الغصيل وأنتد الكسائى
  ندعاث ريك هذا انخلق كلهم • بعام خصب فعاش النناس والنعم
  وأبهلواسر -ه-م من غيرتودية • ولاذيارومات الفقر والعدم
  ويقال الرجل اذا اسودت أسنانه قد ذير فوم تذييرا
  ف صل ال ر) الفرّامخ رير ورير ورارأى فاسد ذاهب من الهزال وأنشد
  والساق مفن باديات الريره أى أناظاهر الهزال لانه دق عظمه ورق جلده فظسهر مخه وان
  قال باديات والساق واحدة لانه أراد الساقين والتثنية يجوزان يخبرعتها يبما يخبرعن الجمع لانه
  جع واحد الى آخر ويروى باردات وأراراله مخه أى جمله رقيقا
  سل الزاى ار لزثيرصوت الاسدف صدره وقد زأربالفتح يز أرز أراوزتيرا
  قوه والساق الخ هولاب شقبل
  وقبلد كما فى نسخنة
  أقول بالسبت فويق الرير
  اذ أنا مغلوب قليل الغيع
  والساق الخ اه
