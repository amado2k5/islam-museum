text: "… فما ظنكم إن كان الأمر كما أقول لكم وأدعوكم إليه ؟ ماذا عذر كم عند الله ؟ وماذا يخلصكم من بين يديه وأنعم تطلبون مني أن أترك دعاءكم إلى طاعته ؟ وأنا لا يمكنني هذا لأنه واجب علي، ولو تركته …"
