text: "… اشترط للمراة، فإن لم يف لها فسخ الزواج. والأول مذهب أبي حنيفة والشافعي وكثير من أهل العلم، واستدلوا بما يأتي : - أن رسول اللّٰه ملاع قال : المسلمون على شروطهم، إلا شرطًا أحل حرامًا أو حرم حلالاً. قالوا وهذا …"
