text: "… وإيتاء الزكاة، والحج، وصوم رمضان. متفق عليه. - وعن أبي هريرة، قال: قال رسول اللّٰه للن الإيمان بضع وسبعون شُعبةً، فأفضلها: قولُ لا إله إلا الله، وأدناها: إماطة الأذى عن الطريق، والحياء شعبة من الإيمان. متفق عليه. - مح في …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 47، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
