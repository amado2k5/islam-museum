text: "… وإيتاء الزكاة، والحج، وصوم رمضان. متفق عليه. - وعن أبي هريرة، قال: قال رسول اللّٰه للن الإيمان بضع وسبعون شُعبةً، فأفضلها: قولُ لا إله إلا الله، وأدناها: إماطة الأذى عن الطريق، والحياء شعبة من الإيمان. متفق عليه. - مح في …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 47، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 47, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 47 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 1, pág. 47, que menciona las ramas de la fe, la fe como setenta y tantos ramas; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 1, page 47, mentionnant les piliers de la foi, la foi étant définie comme une soixantaine de branches. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 47'den bir alıntı, imanın dallarından bahsetmekte ve imanın yetmişten fazla dalı olduğunu belirtmektedir. Bu, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 47, menyebutkan cabang-cabang iman, dan bahwa iman memiliki lebih dari tujuh puluh cabang. Ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
