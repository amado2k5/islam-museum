text: |-
  ٢٤٠
  باب الدال)
  ⁦(ص يد)⁩
  أى زداد طولا ومعد مصر موضع بها والصعدة القناة المستوية تذ.ت صكذلك لا تحتاج
  الى تثقيف قال الشاعر
  صعدة نابتة فى حائر • أينما الريح تملها تمل
  وبنات صعدة حر الوحش والنسبة اليهاصاعدى على غير قياس قال أبو ذؤيب
  فرمى فالحق صاعد يا مطهرا بالكشح فستملت عليه الاضلع
  والصعداء بالضم والمتتنفس ممدود ⁦(صفد)⁩ صفده يصفده صفدا أى شدّه واوثق
  وصك ذلك التصفيد والصفد بالتحريك العطاء والصفد أيضا الوثاق وأصفد به اصفادا أى
  أعطيته مالا ووهبت له عبد اوالصفادمايوثق به الاسير من قد وقيد وغل والأصفاد القيود
  فرد) الصفردطائرتسمبه العامة أبا المليح وفى المشل أجين من صفرد لد) حجر
  صلد أى صلب أملس وأرض صلدة وجبين صلد قال رؤية
  براق أصلاد الجبين الاجله وصلد الزند يصلد بالكسر ملودا اذا صوت ولم يخرج نارا
  وأصاد الرجل أى صلد زنده والاملد البخيل والداود القدر البطيئة الغلى والفرس الذى
  لا يعرق وناقة صلود ومصلاد أى بكيئة لخد . الصلخدى القوى الشديدمثل
  الصلخدم والياء واليم زائدتان يقال بم-ل صلخد وسلجم وجل صلخدى بتريك اللام وناقة
  صلخداة وجل صلاخد بالضم والجمع صلاخد بالفتح واصلخد اصلخدادا اذا انتصب قائما
  (صعد الصمد المكان المرتفع الغليظ قال أبو النجم
  يغادر الصمد كظهر الاجدل
  والمصمداغة فى المصعت وهو الذى لاجوف له والصحاد عفاص القارورة وصمده يصمده صمدا
  أى قصده والصمد السيدلانه يصمد اليه فى الحوامج قال
  علوته بحسام ثم قلت له * خذها حذيف فأنت السيد الصمذ
  وبيت مصمد بالتشديد أى مقصود ⁦( صعد )⁩ الاصعداد الانطلاق السريع قال الزفيان
  تسمع للريح اذا اصحعدا بين انلخطامنه ذا ما ارقدا مثل عزيف الجن هدت هدا
  ( صند الصنديد السيد الشجاع وغيت صنديد عظيم القطر والصناديد الدواهى ومنه
  قول الحسن نعوذبالله من صناديد القدر مهد الصبهد السراب الجارى والصيهد
  الطويل وصهدته الشمس لغة فى صخدنه (صيد صاده يصيده ويصاد هصيدا أى
  اصطاده والصيد أيضا المصيد وخرج فلان يتصيد والمصيدوالمصيدة بالكسر ما يصادبه
  كلب صمود وكلاب صدوصمد أيضا فى لغمن يخفف الرسل ويكسر الصاد اتسلم اليا.
  والصيدبا لحريك مصد رالاصيدوهو الذى يرفع رأسه كبرا ومنه قيل للملك أصيد وأصله
  فى البعير يكون به داء فى رأسه فيرفعه ويقال انماقيل للملك أصيدلانه لا يلتفت ينا
  ولا شمالا وكذلك الذى لا يستطيع الالتفات من داءتقول منه صيد بكسر الياء وانماصحت
  الماءفه امحتها فى أصلداتدل عليه وهواصيد با اتشديد وكذلك اءور لان عورواءورَ
  معتاهما واحد وانما حذفت منه الزوائد للتخف ف ولولاذلك لقلت صاد وعار وقلبت الواو
  ألفا كما قلبتها فى خاف والدليل على أنه افعل مجءاخواته على «ذا فى الالوان والعيوب نحو
  اسودّ واحرّوانما قالواءور وعرج لتخفيف وكذلك قياس عمى وان لم يسمع ولهذ الايقال
  من هذا البساب ما أفعله فى التعجب لان أصل يزيدعلى الثلاثى ولا يمكن بناء الرباعى من الرباحى
  واما
