label: { ar: "سنن ابن ماجه 3368 — الأب والأبوة", en: "Sunan Ibn Majah 3368 — the father and fatherhood", ur: "سنن ابن ماجہ 3368 — باپ اور والدیت", es: "Sunan Ibn Majah 3368 — El padre y la paternidad", fr: "Sunan Ibn Majah 3368 — Le père et la paternité" }
text: "… عُثْمَانَ بْنِ سَعِيدِ بْنِ كَثِيرِ بْنِ دِينَارٍ الْحِمْصِيُّ، حَدَّثَنَا أَبِي، حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عِرْقٍ، عَنْ أَبِيهِ، عَنِ النُّعْمَانِ بْنِ بَشِيرٍ، قَالَ أُهْدِيَ لِلنَّبِيِّ ـ عِنَبٌ مِنَ الطَّائِفِ فَدَعَانِي فَقَالَ \" خُذْ هَذَا الْعُنْقُودَ فَأَبْلِغْهُ أُمَّكَ \". فَأَكَلْتُهُ قَبْلَ أَنْ أُبْلِغَهُ إِيَّاهَا فَلَمَّا كَانَ بَعْدَ لَيَالٍ قَالَ لِي \" مَا فَعَلَ الْعُنْقُودُ هَلْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3368، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3368 (Chapters on Food), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3368، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3368 (Capítulos sobre la alimentación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 3368 (Chapitres sur l'alimentation), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
