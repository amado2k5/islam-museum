label: { ar: "الموطأ 2134 — يحيى عن مالك: فيمن رهن حائطا له إلى أجل، فثمر الحائط قبل ذلك الأجل ليس برهن مع الأصل إلا أن يشترط المرتهن، وإذا ارتهن الرجل جارية وهي حامل أو حملت بعد ارتهانه إياها فإن ولدها معها", en: "Muwatta 2134" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن رهن حائطا له إلى أجل مسمى، فيكون ثمر ذلك الحائط قبل ذلك الأجل: إن الثمر ليس برهن مع الأصل، إلا أن يكون اشترط ذلك المرتهن في رهنه. وإن الرجل إذا ارتهن جارية وهي حامل، أو حملت بعد ارتهانه إياها، إن ولدها معها. {cite:muwatta-maruf-1997 p.272}"
