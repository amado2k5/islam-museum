label: { ar: "الموطأ 2134 — يحيى عن مالك: فيمن رهن حائطا له إلى أجل، فثمر الحائط قبل ذلك الأجل ليس برهن مع الأصل إلا أن يشترط المرتهن، وإذا ارتهن الرجل جارية وهي حامل أو حملت بعد ارتهانه إياها فإن ولدها معها", en: "Muwatta 2134", es: "Muwatta 2134", fr: "Muwatta 2134", ur: "موطا 2134", tr: "El-Muvatta 2134 — Yahya, Malik'ten rivayetle: Bir kimse duvarını belirli bir tarihe kadar rehin verirse, rehin alan kişi aksini şart koşmadıkça, o tarihten önceki duvarın meyvesi asıl mal ile birlikte rehin verilmez. Ve bir adam hamile bir cariyeyi rehin verirse veya cariye rehin verdikten sonra hamile kalırsa, çocuğu onunla birlikte kalır.", id: "Al-Muwatta 2134 — Yahya berdasarkan riwayat Malik: Mengenai orang yang menggadaikan temboknya hingga tanggal tertentu, buah dari tembok sebelum tanggal tersebut tidak digadaikan bersama harta aslinya kecuali jika penerima gadai menetapkan lain. Dan jika seorang laki-laki menggadaikan seorang budak perempuan ketika ia sedang hamil, atau ia hamil setelah ia menggadaikannya, maka anaknya ada bersamanya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن رهن حائطا له إلى أجل مسمى، فيكون ثمر ذلك الحائط قبل ذلك الأجل: إن الثمر ليس برهن مع الأصل، إلا أن يكون اشترط ذلك المرتهن في رهنه. وإن الرجل إذا ارتهن جارية وهي حامل، أو حملت بعد ارتهانه إياها، إن ولدها معها. {cite:muwatta-maruf-1997 p.272}"
  tr: "Yahya şöyle dedi: Malik'in, bir kimse duvarını belirli bir tarihe kadar rehin verirse ve o duvarın meyvesi o tarihten önce hasat edilirse, meyvenin asıl mal ile birlikte rehin verilmeyeceğini, ancak rehin alan kişi bunu rehin sözleşmesinde şart koşmuşsa bunun geçerli olduğunu işittim. Ve eğer bir adam hamile bir cariyeyi rehin verirse veya cariye rehin verildikten sonra hamile kalırsa, çocuğu onunla birlikte kalır. {cite:muwatta-maruf-1997 s.272}"
  id: "Yahya berkata: Aku mendengar Malik berkata tentang seseorang yang menggadaikan temboknya sampai tanggal tertentu, dan buah dari tembok itu dipanen sebelum tanggal tersebut: buah itu tidak digadaikan bersama dengan harta aslinya, kecuali jika pemberi gadai menetapkan hal ini dalam perjanjian gadai. Dan jika seorang pria menggadaikan seorang budak perempuan ketika dia sedang hamil, atau dia hamil setelah pria itu menggadaikannya, anaknya ada bersamanya. {cite:muwatta-maruf-1997 p.272}"
