text: "أَخْبَرَنِي عَمْرُو بْنُ هِشَامٍ، قَالَ حَدَّثَنَا مَخْلَدُ بْنُ يَزِيدَ، عَنْ سُفْيَانَ الثَّوْرِيِّ، عَنْ عَلْقَمَةَ بْنِ مَرْثَدٍ، عَنْ سُلَيْمَانَ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَسَأَلَهُ عَنْ وَقْتِ الصَّلاَةِ فَقَالَ ‏\"‏ أَقِمْ مَعَنَا هَذَيْنِ الْيَوْمَيْنِ ‏\"‏ ‏.‏ فَأَمَرَ بِلاَلاً فَأَقَامَ عِنْدَ الْفَجْرِ فَصَلَّى الْفَجْرَ ثُمَّ أَمَرَهُ حِينَ زَالَتِ الشَّمْسُ فَصَلَّى الظُّهْرَ ثُمَّ أَمَرَه …"
summary:
  ar: "في السنن النسائي؛ ذكر ديوان أو بريد المراسلات."
