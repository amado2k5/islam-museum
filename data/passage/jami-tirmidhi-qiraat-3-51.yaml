text: "أبْوانُ القِراءاتِ عَن سول اللّه وَلِهِ فَقَالَ : يَا جِبْرِيلُ، إِنِّي بُعِثْتُ إِلَى أُمَّةٍ أُمَّيِّينَ، مِنْهُمُ الْعَجُوزُ، وَالشَّيْخُ الْكَبِيرُ، وَالْغُلَامُ وَالْجَارِيَةُ، وَالرَّجُلُ الَّذِي لَمْ يَقْرَأْ كِتَابَا قَطّ، قَالَ : يَا مُحَمَّدُ، إِنَّ الْقُرْآنَ أَنْزِلَ عَلَىٰ سَبْعَةِ أحْرُفٍ. وَفِيَ البَّابِ : …"
summary:
