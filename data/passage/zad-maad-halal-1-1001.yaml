text: "… بعد المرة الثالثة، وإن شاء لم يُحرمها، ويمتنع أن يخير الرجل بينَ أن يجعل الشيء حلالاً، وأن يجعلَه حراماً، ولكن إنما يُخير بين مباحين له، وله أن يُباشر أسبابَ الحِل وأسباب التحريم، وليس له إنشاءُ نفس التحليل والتحريم. واللّهُ سبحانه …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1001، يذكر الحلال، والحرام، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1001, that mentions the lawful, the unlawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1001 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
