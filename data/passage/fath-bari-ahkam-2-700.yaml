text: "… ذكر من البشر، أو الالتهاء بهم أو أن يأتى لأجلهم بما لا يحل له أو يخل بما يجب عليه. واستشكل ابن أبى جمرة وقوع التكفير بالمذكورات للوقوع فى المحرمات والإخلال بالواجب، لأن الطاعات لا تسقط ذلك، فإن حمل على الوقوع …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 700، يرد فيه ذكر الطاعات، والواجب، وما يجب على المكلف، وما لا يحل، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 700, whose wording mentions the acts of obedience, the obligatory (wajib), what is binding on the person addressed, what is not lawful, the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 700 کا اقتباس جس میں طاعات، واجب، جو مکلف پر واجب ہے، جو حلال نہیں، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Hajar, volume numérisé 2, p. 700, dont le texte mentionne les actes d'obéissance, l'obligatoire (wajib), ce qui s'impose à la personne responsable, ce qui n'est pas licite, les choses interdites ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen digitalizado 2, p. 700, cuyo texto menciona los actos de obediencia, lo obligatorio (wajib), lo que obliga a la persona responsable, lo que no es lícito, las cosas prohibidas; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 2. cildinin 700. sayfasından bir alıntı; itaat eylemleri, yükümlülükler, sorumlu bir kişiden beklenenler, yasak olanlar ve Allah tarafından haram kılınanlar konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu alıntı, farz olan eylemler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, Jilid 2, halaman 700, membahas tentang amalan ketaatan, kewajiban, apa yang dituntut dari orang yang bertanggung jawab, apa yang dilarang, dan apa yang diharamkan oleh Allah. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
