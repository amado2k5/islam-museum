label: { ar: "الموطأ 1167 — عائشة: خرجنا مع رسول الله لخمس ليال بقين من ذي القعدة، فأمر من لم يكن معه هدي أن يحل بعد الطواف والسعي", en: "Muwatta 1167", es: "Muwatta 1167", fr: "Muwatta 1167", ur: "موطا 1167", tr: "Al-Muwatta 1167 — Aişe: Zilhicce ayının bitimine beş gece kala Allah'ın Resulü ile birlikte dışarı çıktık ve o, yanlarında kurbanlık hayvanı olmayanlara tavaf ve sa'i yaptıktan sonra ihramdan çıkmalarını emretti.", id: "Al-Muwatta 1167 — Aisyah: Kami pergi bersama Rasulullah lima malam sebelum berakhirnya Dzul Qi'dah, dan beliau memerintahkan orang-orang yang tidak membawa hewan kurban untuk keluar dari keadaan ihram setelah melakukan Tawaf dan Sa'i." }
summary:
  ar: "تروي عمرة بنت عبد الرحمن أنها سمعت عائشة تقول إنهم خرجوا مع رسول الله لخمس ليال بقين من ذي القعدة، ولا يرون إلا أنه الحج. فلما دنوا من مكة أمر من لم يكن معه هدي أن يحل إذا طاف وسعى، فدخل عليهم يوم النحر بلحم بقر. ويقول يحيى بن سعيد إنه ذكر ذلك للقاسم بن محمد فقال إنها أتته بالحديث على وجهه. {cite:muwatta-maruf-1997 p.527}"
  tr: "Umre bint Abdülrahman, Aişe'nin şöyle dediğini rivayet etmiştir: \"Zilhicce ayının bitimine beş gece kala, Hac olduğunu sanarak Resulullah ile birlikte yola çıktık. Mekke'ye yaklaştıklarında, kurbanlık hayvan getirmemiş olanlara tavaf ve sa'i yaptıktan sonra ihramdan çıkmalarını emretti. Daha sonra kurban günü sığır etiyle onlara katıldı.\" Yahya ibn Sa'id, bunu el-Kasım ibn Muhammed'e anlattığını ve onun da hadisi kendisine aynen aktardığını söylediğini belirtmiştir. {cite:muwatta-maruf-1997 s.527}"
  id: "Umrah binti Abd al-Rahman meriwayatkan bahwa ia mendengar Aisyah berkata bahwa mereka pergi bersama Rasulullah lima malam sebelum berakhirnya Dzul Qi'dah, karena mengira itu adalah hari Haji. Ketika mereka mendekati Mekah, beliau memerintahkan orang-orang yang tidak membawa hewan kurban untuk keluar dari keadaan Ihram setelah melakukan Tawaf dan Sa'i. Kemudian beliau memasuki Mekah pada hari Kurban dengan membawa daging sapi. Yahya bin Sa'id berkata bahwa ia menyampaikan hal ini kepada al-Qasim bin Muhammad, yang mengatakan bahwa Umrah telah menyampaikan hadits tersebut kepadanya persis seperti aslinya. {cite:muwatta-maruf-1997 p.527}"
