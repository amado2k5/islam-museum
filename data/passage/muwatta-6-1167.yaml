label: { ar: "الموطأ 1167 — عائشة: خرجنا مع رسول الله لخمس ليال بقين من ذي القعدة، فأمر من لم يكن معه هدي أن يحل بعد الطواف والسعي", en: "Muwatta 1167" }
summary:
  ar: "تروي عمرة بنت عبد الرحمن أنها سمعت عائشة تقول إنهم خرجوا مع رسول الله لخمس ليال بقين من ذي القعدة، ولا يرون إلا أنه الحج. فلما دنوا من مكة أمر من لم يكن معه هدي أن يحل إذا طاف وسعى، فدخل عليهم يوم النحر بلحم بقر. ويقول يحيى بن سعيد إنه ذكر ذلك للقاسم بن محمد فقال إنها أتته بالحديث على وجهه. {cite:muwatta-maruf-1997 p.527}"
