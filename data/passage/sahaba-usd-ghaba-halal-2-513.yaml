text: "… ترجمتين، هذه إحداهما، والأخرى منك الحديث ولا أستطيع أن أؤديه كما أسمع منك، أزيد حرفاً أو أنقص حرفاً، قال: إذا لم تُجِلوا حراماً تذكر بعد هذه، ولم ينسب هذا إلا قال: سليم أو تُحَرموا حلالاً، وأصَبْتم المعنى، فلا بأس. الأنصاري، …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 513، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 513, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 513 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
