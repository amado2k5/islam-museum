text: "… ترجمتين، هذه إحداهما، والأخرى منك الحديث ولا أستطيع أن أؤديه كما أسمع منك، أزيد حرفاً أو أنقص حرفاً، قال: إذا لم تُجِلوا حراماً تذكر بعد هذه، ولم ينسب هذا إلا قال: سليم أو تُحَرموا حلالاً، وأصَبْتم المعنى، فلا بأس. الأنصاري، …"
