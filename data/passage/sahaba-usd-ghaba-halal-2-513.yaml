  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 513, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
