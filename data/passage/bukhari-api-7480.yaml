label: { ar: "صحيح البخاري 7480 — ضحك وتبسم", en: "Sahih al-Bukhari 7480 — laughter and smiling", ur: "صحیح بخاری 7480 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 7480 — rire et sourire", es: "Sahih al-Bujari 7480 — risa y sonrisa", tr: "Sahih el-Buhari 7480 — Kahkaha ve Gülümseme", id: "Sahih al-Bukhari 7480 — Tawa dan Senyum" }
text: "… حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَمْرٍو، عَنْ أَبِي الْعَبَّاسِ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ حَاصَرَ النَّبِيُّ أَهْلَ الطَّائِفِ فَلَمْ يَفْتَحْهَا فَقَالَ إِنَّا قَافِلُونَ إِنْ شَاءَ اللَّهُ . فَقَالَ الْمُسْلِمُونَ نَقْفُلُ وَلَمْ نَفْتَحْ. قَالَ فَاغْدُوا عَلَى الْقِتَالِ . فَغَدَوْا فَأَصَابَتْهُمْ جِرَاحَاتٌ. قَالَ النَّبِيُّ إِنَّا قَافِلُونَ غَدًا إِنْ شَاءَ اللَّهُ ، فَكَأَنَّ ذَلِكَ أَعْجَبَهُمْ فَتَبَسَّمَ رَسُولُ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7480، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 7480, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 7480، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7480, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 7480, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 7480 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslam Halk Bilimi Tarayıcısı tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7480, berisi tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan Peramban Cerita Rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
