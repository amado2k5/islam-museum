label: { ar: "الموطأ 184 — مالك: إقامة غير المؤذن تجزئ", en: "Muwatta 184", es: "Muwatta 184", fr: "Muwatta 184", ur: "موطا 184", tr: "El-Muvatta 184 — Malik: Müezzin dışında birinin ikameti yeterlidir.", id: "Al-Muwatta 184 — Malik: Iqamah orang selain muazin sudah cukup" }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما جاء في النداء للصلاة: سُئل عن مؤذن أذّن لقوم ثم تنفل فأرادوا أن يصلوا بإقامة غيره، فقال: لا بأس بذلك، إقامته وإقامة غيره سواء. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن الشافعي والبيهقي رويا حديثاً مرسلاً فيه أن النبي أخذ بأذان غيره. {cite:muwatta-maruf-1997 p.119}"
  tr: "Malik'in, Yahya'nın ezan bölümünde rivayet ettiği bir fetvası şöyledir: Bir müezzinin bir grup insan için ezan okuyup sonra nafile namaz kıldığı ve bu kişilerin başkasının ikametiyle namaz kılmak istedikleri sorulduğunda, Malik şöyle buyurmuştur: \"Bunda bir sakınca yoktur; onun ikameti ile başkasının ikameti aynıdır.\" Araştırmacı, bu hadisin Ebu Musab tarafından Malik'ten rivayet edildiğini ve Şafiî ile Beyhaki'nin de Peygamber'in başkasının ezanını kabul ettiğine dair mursal bir hadis rivayet ettiklerini belirtmektedir. {cite:muwatta-maruf-1997 s.119}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam surah tentang seruan azan: Beliau ditanya tentang seorang muazin yang mengumandangkan azan untuk sekelompok orang dan kemudian melaksanakan salat sunnah, dan mereka ingin salat dengan iqamah orang lain. Beliau berkata: Tidak ada yang salah dengan itu; iqamahnya dan iqamah orang lain sama. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan bahwa al-Shafi'i dan al-Bayhaqi meriwayatkan hadits mursal di mana Nabi menerima azan orang lain. {cite:muwatta-maruf-1997 p.119}"
