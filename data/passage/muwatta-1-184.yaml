summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما جاء في النداء للصلاة: سُئل عن مؤذن أذّن لقوم ثم تنفل فأرادوا أن يصلوا بإقامة غيره، فقال: لا بأس بذلك، إقامته وإقامة غيره سواء. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن الشافعي والبيهقي رويا حديثاً مرسلاً فيه أن النبي أخذ بأذان غيره. {cite:muwatta-maruf-1997 p.119}"
