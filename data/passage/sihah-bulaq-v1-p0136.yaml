text: |-
  ⁦(فسل الصاد)⁩
  ٥.•
  ولا يقال للجوع بلا بردخرص ويقال للبرد بلاجوع خصر والخرص والخرص بالضم
  والمكسر الحلتة من الذهب والفضة والمع الخرصان قال الشاعر.
  عليهن اعس من ظباء تسالة * مذبذية الخرصان بادنحورها
  والخرص والخرص والخرص ١ ماعلا الحبة من السنان عن ابن السكيت وربماسمى
  الرمح بذلك قال حيد بز تور
  يعض منها الظلف الدئيا * عض الثقاف الخرص الخطيا
  وهومثل عسر وعسر والخرص والخرص ٢ الجريدمن النخل قال الشاعر ق س بن
  لخطيم) ترى قصد المران تلق كأنها • تدرع خرصان بأيدى الشواطب
  والدرص أيضاعويد محدّد الرأس يغرز فى عد السقاء ومنه قولهم مايملك فلان خرصا
  ولاخر ما أى شيتا قال ساعدة بن جؤية الهذلى يصف مشتار العسل
  معه سقاءلا يفرط ح-له • صفن واخراص يلمن ومسأب
  والخريص السنان قال أبودواد وتشاجرت أبطالنا• بالمشر فى وباتخريص وماءخريص
  مثل خصرأى بارد قال الراجز ٣ مدامة صرف بما خريص وانخارص الاسنة
  قال بشر
  ينوى محاولة القيام وقد مضت • فيه مخارص كل لدن لهسذم
  ⁦(خريص)⁩ أبوز يديقال ماعليها خر بصيصة أى شى من الحلى وقال أبو صاعد الكلابي
  مافى الوعاءخر بصيصة أى شى وكذلك فى السقاء والبئرحكاه عنه يعقوب صص خصه
  بالشئخم وصاوخصوصية والفتح أفصح وخصيصى وقولهم اغمايفعل هذاخصان من
  الناس أى خواص منهم واختصه بكذا أى خصه به وإلخاصة خلاف العامة والخص البيت
  من القصب قال الفزارى الخص فيه توأعيننا • خير من الآ جر والكمد
  وانخصاصة والخصاص الفة ر والخصاصة الخال والثقب الصغير يقال للة مريدامن خصاصة
  لغيم ويقال للفرج التى بين الاثافى خصاص خاص) خاص الذى بالفتخ يخلصر
  ناوصا أى صارخا اصا وخاص الله الشى وصل وخلصته من كذا تخليصا أى نحيت
  غلص وخلاصة السعن بالضم ما خلص منه لانهم اذ اطيخوا الزبدايتخذوه مناطر حوا
  فيه شيتا من سو يق أوتمرأوابعار غزلان فاذاجاد وخلص من الثفسل فذلك السمن هو
  لخلاصة والخلاص أيضا بكسر ائلحاء حكاه أبو عبيد وهو الاثر والنفل الذى يبقى أسفل
  •والخلوص والقلدة والقشدة والسكدادة والمصدرمنه الاخلاس وقد أخلصت السمن
  والاخلاص أيضا فى الطاعة ترك الرياء وقد أخلصت للّه الدين وخالصه فى العشرة أى صبافاه
  وهذا الشى خالصة لك أى خاصة وفلان خلصى كمازة ول خدنى وخلصانى أى خالصق
  وهم خلصانى يستوى فيه الواحدوالهاعة واستخلصه لنفه أى استخصه وانلحلصا أرض
  بالبادية فيها عين ماه قال الشاعر
  أشبهن من يقرالظلصاء أعينها * وهنّ أحسن من صيرانها صورا
  وذوانخلصة بالتحريك بيت تخنهم كان يدعى كعبة اليمامة وكان فيه صم يدعى الخلصة فهدم
  خلبص خلبص الرجل فِر قال الراجز
