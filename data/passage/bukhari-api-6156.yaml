label: { ar: "صحيح البخاري 6156 — ما حُرّم", en: "Sahih al-Bukhari 6156 — what was made unlawful", ur: "صحیح بخاری 6156 — جو حرام کیا گیا" }
text: "… لَهُ حَتَّى أَسْتَأْذِنَ رَسُولَ اللَّهِ فَإِنَّ أَخَا أَبِي الْقُعَيْسِ لَيْسَ هُوَ أَرْضَعَنِي، وَلَكِنْ أَرْضَعَتْنِي امْرَأَةُ أَبِي الْقُعَيْسِ. فَدَخَلَ عَلَىَّ رَسُولُ اللَّهِ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّ الرَّجُلَ لَيْسَ هُوَ أَرْضَعَنِي، وَلَكِنْ أَرْضَعَتْنِي امْرَأَتُهُ. قَالَ \" ائْذَنِي لَهُ، فَإِنَّهُ عَمُّكِ، تَرِبَتْ يَمِينُكِ \". قَالَ عُرْوَةُ فَبِذَلِكَ كَانَتْ عَائِشَةُ تَقُولُ حَرِّمُوا مِنَ الرَّضَاعَةِ مَا يَحْرُمُ مِنَ النَّسَبِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6156، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6156 (Good Manners and Form (Al-Adab)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6156، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
