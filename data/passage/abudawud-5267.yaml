label:
  ar: "أبو داود 5267 — نهى عن قتل أربع من الدواب"
  en: "Abu Dawud 5267 — He forbade killing four creatures"
  ur: "ابو داود 5267 — چار جاندروں کا قتل منع کیا"
  es: "Abu Dawud 5267 — Prohibió matar a cuatro criaturas"
  fr: "Abou Dawoud 5267 — Il interdit de tuer quatre créatures"
  tr: "Ebu Davud 5267 — Dört çeşit hayvanın öldürülmesini yasakladı."
  id: "Abu Dawud 5267 — Beliau melarang membunuh empat jenis hewan"
text: "إِنَّ النَّبِيَّ نَهَى عَنْ قَتْلِ أَرْبَعٍ مِنَ الدَّوَابِّ: النَّمْلَةُ، وَالنَّحْلَةُ، وَالْهُدْهُدُ، وَالصُّرَدُ"
summary:
  ar: "في كتاب الأدب؛ عن ابن عباس عن الزهري: نهى النبي عن قتل أربع من الدواب: النملة والنحلة والهدهد والصرد — حرمة قتل المصلحين من الصغار."
  en: "In the Book of General Behaviour, from Ibn Abbas via al-Zuhri: the Prophet forbade killing four creatures — the ant, the bee, the hoopoe and the shrike — the immunity of the beneficial small ones."
  ur: "کتاب ادب میں ابن عباس سے زہری کی سند سے: نبی نے چار جاندروں کے قتل سے منع فرمایا — چیونٹی، مکھی، ہدہد اور صرد — چھوٹے مفید مخلوقوں کی حرمت۔"
  es: "En el Libro de la Conducta General, de Ibn Abbas a través de al-Zuhri: el Profeta prohibió matar a cuatro criaturas: la hormiga, la abeja, la abubilla y el alcaudón; la inmunidad de los pequeños animales beneficiosos."
  fr: "Dans le Livre du comportement général, d'Ibn Abbas via al-Zuhri: le Prophète a interdit de tuer quatre créatures — la fourmi, l'abeille, la huppe et la pie-grièche — l'immunité des petits êtres bénéfiques."
  tr: "İbn Abbas'ın, Zühri'den rivayet ettiği edebiyat kitabında şöyle denmektedir: Peygamberimiz dört hayvanın öldürülmesini yasaklamıştır: karınca, arı, hüthüt ve yırtıcı kuş. Bu yasak, genç ıslahçıların öldürülmesini de yasaklamaktadır."
  id: "Dalam kitab sastra, berdasarkan riwayat Ibnu Abbas, berdasarkan riwayat Al-Zuhri: Nabi melarang membunuh empat hewan: semut, lebah, burung huru-huru, dan burung cerpelai — larangan membunuh para pemuda pembaharu."
