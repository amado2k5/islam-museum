text: "إِنَّ النَّبِيَّ نَهَى عَنْ قَتْلِ أَرْبَعٍ مِنَ الدَّوَابِّ: النَّمْلَةُ، وَالنَّحْلَةُ، وَالْهُدْهُدُ، وَالصُّرَدُ"
summary:
  ar: "في كتاب الأدب؛ عن ابن عباس عن الزهري: نهى النبي عن قتل أربع من الدواب: النملة والنحلة والهدهد والصرد — حرمة قتل المصلحين من الصغار."
  en: "In the Book of General Behaviour, from Ibn Abbas via al-Zuhri: the Prophet forbade killing four creatures — the ant, the bee, the hoopoe and the shrike — the immunity of the beneficial small ones."
  ur: "کتاب ادب میں ابن عباس سے زہری کی سند سے: نبی نے چار جاندروں کے قتل سے منع فرمایا — چیونٹی، مکھی، ہدہد اور صرد — چھوٹے مفید مخلوقوں کی حرمت۔"
