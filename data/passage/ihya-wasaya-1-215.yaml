text: "… غفلتكم، وأنتبهوا من رقدتكم قبل أن يقال فلان عليل أو مدنف ثقيل، فهل على الدواء من دليل، وهل إلى الطبيب من سبيل ؟ فتدعى لك الاطباء ولا يرجى لك الشفاء ثم يقال فلان أوصى ولماله أحصى، ثم يقال قد ثقل …"
summary:
