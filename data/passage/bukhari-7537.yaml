ref: "7537"
label:
  ar: "البخاري 7537 — إذا تقرب العبد مني شبرا تقربت منه ذراعا"
  en: "Bukhari 7537 — When the servant draws near Me by a span, I draw near him by a cubit"
  ur: "بخاری 7537 — جب بندہ بالشت بھر میرے قریب ہو تو میں ہاتھ بھر اس کے قریب ہوتا ہوں"
  es: "Bukhari 7537 — Cuando el siervo se acerca a Mí un palmo, Yo me acerco a Él un codo."
  fr: "Bukhari 7537 — Lorsque le serviteur s'approche de Moi d'un empan, Je m'approche de lui d'une coudée."
  tr: "Buhari 7537 — Kulum bana bir karış kadar yaklaşırsa, ben de ona bir kol boyu yaklaşırım."
  id: "Al-Bukhari 7537 — Jika seorang hamba-Ku mendekati-Ku sejauh satu jengkal tangan, maka Aku akan mendekatinya sejauh satu lengan."
text: "إذا تقرب العبد مني شبرا تقربت منه ذراعا وإذا تقرب مني ذراعا تقربت منه باعا أو بوعا . وقال معتمر سمعت أبي، سمعت أنسا، عن أبي هريرة، عن النبي يرويه عن ربه، عز وجل."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7537: إذا تقرب العبد مني شبرا تقربت منه ذراعا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7537: When the servant draws near Me by a span, I draw near him by a cubit. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7537: جب بندہ بالشت بھر میرے قریب ہو تو میں ہاتھ بھر اس کے قریب ہوتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7537: Cuando el siervo se acerca a Mí un palmo, Yo me acerco a él un codo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih al-Bukhari, n° 7537: « Lorsque le serviteur s’approche de Moi d’un empan, Je m’approche de lui d’une coudée. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 7537 numaralı hadis-i kudsi şöyledir: \"Kulum bana bir karış kadar yaklaşırsa, ben de ona bir kol boyu kadar yaklaşırım.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 7537: “Jika seorang hamba-Ku mendekati-Ku sejauh satu jengkal tangan, maka Aku akan mendekatinya sejauh satu lengan.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
