label:
  ar: "البخاري 7537 — إذا تقرب العبد مني شبرا تقربت منه ذراعا"
  en: "Bukhari 7537 — When the servant draws near Me by a span, I draw near him by a cubit"
  ur: "بخاری 7537 — جب بندہ بالشت بھر میرے قریب ہو تو میں ہاتھ بھر اس کے قریب ہوتا ہوں"
text: "إذا تقرب العبد مني شبرا تقربت منه ذراعا وإذا تقرب مني ذراعا تقربت منه باعا أو بوعا . وقال معتمر سمعت أبي، سمعت أنسا، عن أبي هريرة، عن النبي يرويه عن ربه، عز وجل."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7537: إذا تقرب العبد مني شبرا تقربت منه ذراعا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7537: When the servant draws near Me by a span, I draw near him by a cubit. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7537: جب بندہ بالشت بھر میرے قریب ہو تو میں ہاتھ بھر اس کے قریب ہوتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
