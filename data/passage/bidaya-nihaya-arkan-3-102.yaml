text: "… وخمس أمرتنا أن نعمل بها، وخمس تخلّقنا بها في الجاهلية فنحن عليها، إلا أن تكره منها شيئاً. فقال رسول اللّٰه ال ما الخمسة انتي أمرتكم بها رسلي أن تؤمنوا بها؟ قلنا: أمرتنا أن نؤمن بالله وملائكته وكتبه ورسله والبعث بعد …"
