label:
  ar: "الترمذي 3292 — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Tirmidhi 3292 — I have prepared for My righteous servants what no eye has seen"
  ur: "ترمذی 3292 — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
text: "يقول الله أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر واقرءوا إن شئتم : ( فلا تعلم نفس ما أخفي لهم من قرة أعين جزاء بما كانوا يعملون ) وفي الجنة شجرة يسير …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3292: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3292: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3292: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
