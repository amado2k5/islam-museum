text: "حَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ الْخَلاَّلُ الْحُلْوَانِيُّ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ زَيْدِ بْنِ حُبَابٍ، عَنْ كَامِلٍ أَبِي الْعَلاَءِ، نَحْوَهُ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ. وَهَكَذَا رُوِيَ عَنْ عَلِيٍّ،. وَبِهِ يَقُولُ الشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ يَرَوْنَ هَذَا جَائِزًا فِي الْمَكْتُوبَةِ وَالتَّطَوُّعِ. وَرَوَى بَعْضُهُمْ هَذَا الْحَدِيثَ عَنْ كَامِلٍ أَبِي الْعَلاَءِ مُرْسَلاً."
summary:
  ar: "حديث في جامع الترمذي، رقم 285، يرد فيه ذكر التطوع، والصلاة المكتوبة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 285 (The Book on Salat (Prayer)), whose wording mentions the voluntary act (tatawwu'), the prescribed prayer. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 285، جس کے الفاظ میں تطوع ⁦(نفلی عمل)⁩، فرض نماز کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 285, dont le texte mentionne l'acte volontaire (tatawwu'), la prière prescrite. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 285, cuyo texto menciona el acto voluntario (tatawwu'), la oración prescrita. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'nin 285 numaralı hadisinde, gönüllü namazlar ve farz namazlar zikredilmektedir. Farz ameller, görevler, ibadetler, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar hakkındaki kitabı derleyen yazar, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 285, menyebutkan tentang salat sunnah dan salat wajib. Penyusun kitab tentang amalan wajib, kewajiban, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
