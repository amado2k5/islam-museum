  قياوزته يقال تخطيت رقاب الناس وتخطيت الى كذا ولا تقل تخطأت بالهمز ( ظا
  خظالحمه يخظوأى اكتنزولا تقل خظى قال السعدى
  رقاب كالواجن خاظيات • وأستاه على الاكواركوم
  وقديقال لحمه خظابظا أى مكتنز وأصله فهسل قال امر والقيس
  لها متنبان خفاتا كا • أكب ع-لى ساعديه النمر
  أراد خظاتان فحذف النون استخفافا ويقال أراد خظتا فرد الالف التى كانت سقطت
  لاجتماع الساكنين لالواحد لماقح ركت التاء والخظوان بالتصريك الذى ركب لهه بعضه بعضا
  قال ابن السكيت يقال رجل خنظيان اذا كان فاحشا وخنظى به اذا نقدبه وأسمعه المكروه
  (خفى الاصمعى خفيت الشئ أخفيه كتمته وخفيته أيضا أظهرته وهو من الاضداد
  وأبو عبيدة مثله بقال خفى المطر الفأراذا أخر جهن من أنفاقهن أى من جرتهن قال علقمة
  خفاهن من أنفاقهنّ كانما • خفائن ودق وسحاب صركب
  وأخفيت الشى سترته وكتمته قال الاصمعى الخافى اجنّ قال الشاعر
  ولا يحس من الخافى بها أثره وقال ابن مناذر الخافية ما يخفى فى البدن من الجنّ بقال به خفية
  أى لمم ومسَ وقولهم أسود خفية كفواهم أسود حلية رهمامأسدتان وشئخفى-أى خاف
  ويجمع على خفايا وانخفية أيضا الركية قال ابن السكيت وكل ركية كانت حفرت ثم تركت
  حتق اندفنت ثم حفروها ونثلوها فهى خفية وقال أبو عبيدلانها استخرجت وأظهرت وخفى
  عليه الاتريخ فى خفاء عدود ويقال أيضابرح الحفا « أى وضح الامر قال يعتوب وقال بعض
  العرب اذا حسن من المرأة خفياها -سن سارهايعف صوتها وأروطئها الارض لانها اذا
  كانت رخيمة الصوب دل ذلت عبلى خفرها واذا كانت مقاربة انخطاوتكن أثر وطئها
  فى الارض دل ذلك على أنّ لها أردافا وأورا كا قال الاصمعىّ الحوافى مادون الريشات
  العشر من مقدم الذاح واللموافى من السعف مادون القلبة من النخلة وهو فى لغة أهل الجاز
  العواهن واستغفيت منك أى تواريت ولا تقل اختفيت وخفا العرق يخة وخفو أويخفى خفيا
  اذ المع لمعاضعيفا معترض افى نواحى الغيم فان لمع قليلا ثم سكن وليسة اعتراض فهوالوميض
  وان شق الغيم واستطال فى الجو الى وسط السما من غير أن يأخذيينا وشمالا فهوالعقيقة
  اواستفيت الشئ أى استخرجته والمختق النباش لائه يستخرج الاكفان والاخفية
  و الاكسبة والواحدخفاء لانها تلقى ء-لى السقاءقال السكميت يذمّ قوما وأنمم لا يبرحون
  يوهم ولا يحضِرون الحرب
  فنى تلك أحلاس البيوت لواصف • وأخفية ماهم تجروتسحب
  وقوله تعالى ان الساعة آتية أكاد أخفيها ويقرأ أخفيها أى أزيل عنها خفاءها أى
  غطاءها وهوكة ولهم أشكيته أى أزاته عمايشكوم لا خلا الشي يخلو خاوا وخلوت
  به خلوة وخلاء وخاوت به أى رت به وخلوت اليه اذا اجقعت معه فى خلوة قال اللّٰه تعالى
  واذاخلوا الى شياطينه-م ويقال الى هنا بعن مع كاقال من أنصارى الى اللّٰه وقوله تصالى
  وان من أمّة الاخلافيها نذيرأى مضى وأرسل وتقول أنا منك خلا أى براءاذا جعلته
