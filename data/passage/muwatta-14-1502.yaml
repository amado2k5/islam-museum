label: { ar: "الموطأ 1502 — مالك: إذا أنكح الأب ابنته وشرط في صداقها حباء، فهو لابنته إن ابتغته، وإن فارقها زوجها قبل الدخول فللزوج شطر الحباء", en: "Muwatta 1502", es: "Muwatta 1502", fr: "Muwatta 1502", ur: "موطا 1502", tr: "El-Muvatta 1502 — Malik: Bir baba kızını evlendirirken mehir olarak bir hediye şart koşarsa, kız isterse bu hediye ona aittir. Eğer kocası evlilik gerçekleşmeden önce kızını boşadığında, hediyenin yarısı kocanın hakkıdır.", id: "Al-Muwatta 1502 — Malik: Jika seorang ayah menikahkan putrinya dan menetapkan hadiah dalam mas kawinnya, maka hadiah itu menjadi hak putrinya jika ia memintanya. Jika suaminya menceraikannya sebelum terjadi hubungan suami istri, maka suami berhak atas setengah dari hadiah tersebut." }
summary:
  ar: "يقول مالك في المرأة ينكحها أبوها ويشترط في صداقها الحباء يحبى به، إن ما كان من شرط يقع به النكاح، فهو لابنته إن ابتغته، وإن فارقها زوجها قبل أن يدخل بها، فلزوجها شطر الحباء الذي وقع به النكاح. {cite:muwatta-maruf-1997 p.32}"
  tr: "Malik, babasının evlendirdiği ve çeyiz olarak bir hediye şart koştuğu bir kadın hakkında şunları söylüyor: Evliliğin gerçekleşmesi için şart koşulan her şey, eğer kız isterse ona aittir. Eğer kocası evliliği tamamlamadan önce onu boşayacaksa, o zaman kocası evliliğin gerçekleşmesi için şart koşulan hediyenin yarısına hak kazanır. {cite:muwatta-maruf-1997 s.32}"
  id: "Malik berkata mengenai seorang wanita yang dinikahkan oleh ayahnya dan menetapkan hadiah sebagai bagian dari maharnya: syarat apa pun yang ditetapkan agar pernikahan itu terjadi menjadi hak putrinya jika ia menginginkannya. Jika suaminya menceraikannya sebelum pernikahan itu disempurnakan, maka suaminya berhak atas setengah dari hadiah yang ditetapkan agar pernikahan itu terjadi. {cite:muwatta-maruf-1997 p.32}"
