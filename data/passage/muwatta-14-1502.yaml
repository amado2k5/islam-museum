label: { ar: "الموطأ 1502 — مالك: إذا أنكح الأب ابنته وشرط في صداقها حباء، فهو لابنته إن ابتغته، وإن فارقها زوجها قبل الدخول فللزوج شطر الحباء", en: "Muwatta 1502" }
summary:
  ar: "يقول مالك في المرأة ينكحها أبوها ويشترط في صداقها الحباء يحبى به، إن ما كان من شرط يقع به النكاح، فهو لابنته إن ابتغته، وإن فارقها زوجها قبل أن يدخل بها، فلزوجها شطر الحباء الذي وقع به النكاح. {cite:muwatta-maruf-1997 p.32}"
