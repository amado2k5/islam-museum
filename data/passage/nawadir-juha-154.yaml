text: "… إلى متى يلِدُ الناس ويموتون؟ سأله يوماً تيمورلنك: إلى متى يَلِدُ الناس ويموتون؟ فأجابه الشيخ فوراً : إلى أن تمتلىء الجنة وجهنم. قولي وصلنا إلى نصف الطريق سافر مع امرأته لزيارة بعض الأصدقاء في محل على مسافة أربعة أيام، وبعد …"
summary:
  ar: "سأل تيمور جحا إلى متى يظل الناس يولدون ويموتون، فقال جحا إلى أن تمتلئ الجنة والنار. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  en: "Timur asks Juha how long people will be born and die; Juha says until Paradise and Hell are full. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  ur: "تیمور نے جحا سے پوچھا کہ لوگ کب تک پیدا ہوتے اور مرتے رہیں گے؛ جحا نے کہا کہ جب تک جنت اور دوزخ بھر نہ جائیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  fr: "Timur demande à Juha jusqu'à quand les gens naîtront et mourront; Juha répond: jusqu'à ce que le Paradis et l'Enfer soient pleins. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  es: "Timur le pregunta a Juha hasta cuándo nacerá y morirá la gente; Juha responde que hasta que el Paraíso y el Infierno estén llenos. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
