  es: "Un extracto de Hayat al-Sahaba, volumen escaneado 1, p. 55, con broma y jovialidad; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Peygamberin kadın sahabesinin hayatından, mizah ve şakalar içeren, resimli 1. cilt, 55. sayfadan bir alıntı; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
