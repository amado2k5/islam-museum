text: "… النبى يذكرنا الجنة والنار كانا رأى عين فاذا خرجنا من عنده عافسنا؟ الأزواج والأولاد والضيعات فنسينا، فقال سورة • آية سورة • آية - سورة آية من المعافسة وهى المعابلجة والمارسة والملاعبة جمع ضيعة وهى ما يكون منها معاش الإنسان …"
summary:
  ar: "مقطع من حياة الصحابية، المجلد المصوَّر 1، ص 55، فيه مزاح ودعابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Hayat al-Sahaba, scan volume 1, p. 55, with jesting and playfulness; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "حیات الصحابہ، اسکین جلد 1، ص 55 کا اقتباس جس میں مزاح اور خوش طبعی ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
