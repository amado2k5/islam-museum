label: { ar: "الموطأ 1892 — مالك: من اشترى طعاما بسعر معلوم إلى أجل، فلما حل الأجل قال المدين لصاحبه: ليس عندي طعام، فبعني الطعام الذي لك علي إلى أجل، فهذا لا يصلح لأنه بيع الطعام قبل أن يستوفى", en: "Muwatta 1892" }
summary:
  ar: "قال مالك: من اشترى طعاما بسعر معلوم إلى أجل مسمى، فلما حل الأجل، قال الذي عليه الطعام لصاحبه: ليس عندي طعام، فبعني الطعام الذي لك علي إلى أجل. فيقول صاحب الطعام: هذا لا يصلح، قد نهى رسول الله عن بيع الطعام حتى يستوفى. فيقول الذي عليه الطعام لغريمه: فبعني طعاما إلى أجل حتى أقضيكه، فهذا لا يصلح، لأنه إنما يعطيه طعاما ثم يرده إليه. فيصير الذهب الذي أعطاه ثمن الطعام الذي كان له عليه، ويصير الطعام الذي أعطاه محللا فيما بينهما. ويكون ذلك، إذا فعلاه، بيع الطعام قبل أن يستوفى. {cite:muwatta-maruf-1997 p.177}"
