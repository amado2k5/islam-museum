label: { ar: "الموطأ 1892 — مالك: من اشترى طعاما بسعر معلوم إلى أجل، فلما حل الأجل قال المدين لصاحبه: ليس عندي طعام، فبعني الطعام الذي لك علي إلى أجل، فهذا لا يصلح لأنه بيع الطعام قبل أن يستوفى", en: "Muwatta 1892", es: "Muwatta 1892", fr: "Muwatta 1892", ur: "موطا 1892", tr: "El-Muvatta 1892 — Malik: Bir kimse önceden bilinen bir fiyattan veresiye yiyecek alır ve vade günü geldiğinde borçlu arkadaşına, \"Yiyeceğim yok, bana borcunu veresiye olarak öde\" derse, bu caiz değildir; çünkü bu, yiyeceği henüz teslim almadan satmaktır.", id: "Al-Muwatta 1892 — Malik: Jika seseorang membeli makanan dengan harga yang diketahui secara kredit, dan ketika tanggal jatuh tempo tiba, si debitur berkata kepada temannya: Saya tidak punya makanan, jadi juallah makanan yang kamu hutangkan kepada saya secara kredit, ini tidak diperbolehkan karena itu sama dengan menjual makanan sebelum diterima." }
summary:
  ar: "قال مالك: من اشترى طعاما بسعر معلوم إلى أجل مسمى، فلما حل الأجل، قال الذي عليه الطعام لصاحبه: ليس عندي طعام، فبعني الطعام الذي لك علي إلى أجل. فيقول صاحب الطعام: هذا لا يصلح، قد نهى رسول الله عن بيع الطعام حتى يستوفى. فيقول الذي عليه الطعام لغريمه: فبعني طعاما إلى أجل حتى أقضيكه، فهذا لا يصلح، لأنه إنما يعطيه طعاما ثم يرده إليه. فيصير الذهب الذي أعطاه ثمن الطعام الذي كان له عليه، ويصير الطعام الذي أعطاه محللا فيما بينهما. ويكون ذلك، إذا فعلاه، بيع الطعام قبل أن يستوفى. {cite:muwatta-maruf-1997 p.177}"
  id: "Malik berkata: Jika seseorang membeli makanan dengan harga yang diketahui untuk jangka waktu tertentu, dan ketika jangka waktu tersebut tiba, orang yang berhutang makanan berkata kepada temannya, \"Aku tidak punya makanan, jadi jualkan makanan yang kau hutangkan kepadaku secara kredit,\" dan teman yang berhutang makanan berkata, \"Ini tidak diperbolehkan; Rasulullah shalla Allahu alaihi wa sallam melarang menjual makanan sebelum diterima sepenuhnya,\" dan orang yang berhutang makanan berkata kepada krediturnya, \"Jual makanan kepadaku secara kredit sampai aku membayarmu,\" ini juga tidak diperbolehkan, karena pada dasarnya dia memberikan makanan dan kemudian mengembalikannya. Emas yang diberikannya menjadi harga makanan yang menjadi hutangnya, dan makanan yang diberikannya menjadi halal di antara mereka. Jika mereka melakukan ini, maka dianggap menjual makanan sebelum diterima sepenuhnya. {kutipan:muwatta-maruf-1997 hlm. 177}"
