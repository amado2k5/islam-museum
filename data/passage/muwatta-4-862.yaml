label: { ar: "الموطأ 862 — أبو هريرة: إذا دخل رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصُفّدت الشياطين", en: "Muwatta 862" }
text: "إذا دخل رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصفدت الشياطين"
summary:
  ar: "يرويه مالك عن أبي سهيل بن مالك عن أبيه عن أبي هريرة موقوفاً، أنه قال: إذا دخل رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصفدت الشياطين. ويذكر المحقق أن معن بن عيسى رواه مرفوعاً عند ابن عبد البر، وأن ابن عبد البر نفسه قال إن مثله لا يكون رأياً، وأنه روي مرفوعاً من حديث أبي سهيل وغيره، لكن المحقق يرى أن رفع معن إن صح عنه فهو شذوذ، لأن المحفوظ من رواية مالك أنه موقوف، ويذكر أنه في الصحيحين (البخاري 3/32 و4/149، ومسلم 3/121) من غير طريق مالك عن أبي سهيل مرفوعاً، ويحيل على العلل للدارقطني. {cite:muwatta-maruf-1997 p.416} {cite:muwatta-maruf-1997 p.417}"
