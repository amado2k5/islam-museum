label:
  ar: 'الموطأ 862 — أبو هريرة: إذا دخل رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصُفّدت الشياطين'
  en: Muwatta 862
  es: "Muwatta 862"
  fr: "Muwatta 862"
  ur: "موطا 862"
  tr: "El-Muvatta 862 — Ebu Hurayra: Ramazan başlayınca cennetin kapıları açılır, cehennemin kapıları kapanır ve cinler zincirlenir."
  id: "Al-Muwatta 862 — Abu Hurairah: Ketika Ramadan dimulai, pintu-pintu Surga dibuka, pintu-pintu Neraka ditutup, dan setan-setan dirantai."
text: إذا دخل رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصفدت الشياطين
summary:
  ar: 'يرويه مالك عن أبي سهيل بن مالك عن أبيه عن أبي هريرة موقوفاً، أنه قال: إذا دخل رمضان فتحت أبواب الجنة، وغلقت أبواب النار، وصفدت الشياطين. ويذكر المحقق أن معن بن عيسى رواه مرفوعاً عند ابن عبد البر، وأن ابن عبد البر نفسه قال إن مثله لا يكون رأياً، وأنه روي مرفوعاً من حديث أبي سهيل وغيره، لكن المحقق يرى أن رفع معن إن صح عنه فهو شذوذ، لأن المحفوظ من رواية مالك أنه موقوف، ويذكر أنه في الصحيحين ⁦(البخاري 3/32 و4/149، ومسلم 3/121)⁩ من غير طريق مالك عن أبي سهيل مرفوعاً، ويحيل على العلل للدارقطني. {cite:muwatta-maruf-1997 p.416} {cite:muwatta-maruf-1997 p.417}'
  tr: "Malik, Ebu Suhayl ibn Malik'ten, o da babasından, o da Ebu Hurayra'dan rivayetle, bir Sahabeye (mevkuf) atfedilen bir hadis olarak şöyle buyurduğunu nakletmiştir: \"Ramazan başlayınca cennetin kapıları açılır, cehennemin kapıları kapanır ve cinler zincirlenir.\" Araştırmacı, İbn Abdülberr'in hadis derlemesinde Ma'n ibn İsa'nın bunu Peygambere (merfuf) dayandırılan bir hadis olarak naklettiğini ve İbn Abdülberr'in kendisinin de böyle bir ifadenin görüş olarak kabul edilemeyeceğini ve Ebu Suhayl ve diğerlerinin hadislerinden Peygambere (merfuf) dayandırılan bir hadis olarak nakledildiğini söylediğini belirtmektedir. Ancak araştırmacı, Ma'n'ın Peygambere (merfuf) atfetmesinin sahih olması durumunda bunun bir anormallik olduğunu düşünmektedir, çünkü Malik'ten gelen sahih rivayet, bunun bir Sahabeye (mevkuf) atfedilen bir hadis olduğudur. Bu hadisin, Malik'inkinden farklı isnad zincirleriyle, Ebu Suhayl'dan rivayetle, Peygamber'e (marfu') kadar uzanan bir hadis olarak iki Sahih'te (Buhari 3/32 ve 4/149 ile Müslim 3/121) bulunduğunu belirtiyor ve Darakutni'nin \"İlal\" adlı eserine atıfta bulunuyor. {cite:muwatta-maruf-1997 s.416} {cite:muwatta-maruf-1997 s.417}"
  id: "Malik meriwayatkan hadits ini dari Abu Suhayl ibn Malik, dari ayahnya, dari Abu Hurayrah, sebagai pernyataan yang dinisbahkan kepada seorang Sahabat (mawquf), bahwa beliau berkata: “Ketika Ramadan dimulai, pintu-pintu Surga dibuka, pintu-pintu Neraka ditutup, dan setan-setan dirantai.” Peneliti menyebutkan bahwa Ma’n ibn Isa meriwayatkannya sebagai hadits yang ditelusuri kembali kepada Nabi (marfu’) dalam kumpulan hadits Ibn Abd al-Barr, dan bahwa Ibn Abd al-Barr sendiri mengatakan bahwa pernyataan tersebut tidak dapat dianggap sebagai pendapat, dan bahwa hadits tersebut diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi (marfu’) dari hadits Abu Suhayl dan lainnya. Namun, peneliti percaya bahwa jika atribusi Ma’n kepada Nabi (marfu’) itu sahih, maka itu adalah anomali, karena riwayat sahih dari Malik adalah bahwa itu adalah pernyataan yang dinisbahkan kepada seorang Sahabat (mawquf). Ia menyebutkan bahwa hadits ini ditemukan dalam dua kitab Sahih (al-Bukhari 3/32 dan 4/149, dan Muslim 3/121) melalui sanad selain Malik, berdasarkan riwayat Abu Suhayl, sebagai hadits yang ditelusuri kembali kepada Nabi (marfu’), dan ia merujuk pada kitab al-‘Ilal karya al-Daraqutni. {cite:muwatta-maruf-1997 p.416} {cite:muwatta-maruf-1997 p.417}"
