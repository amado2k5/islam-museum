label: { ar: "الموطأ 1489 — محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة: لا يخطب أحدكم على خطبة أخيه", en: "Muwatta 1489", es: "Muwatta 1489", fr: "Muwatta 1489", ur: "موطا 1489", tr: "El-Muvatta 1489 — Muhammed ibn Yahya ibn Hibban, El-A'raj'dan, o da Ebu Hurayra'dan rivayetle: Hiçbiriniz, zaten erkek kardeşiyle nişanlı olan bir kadına evlilik teklifinde bulunmamalıdır.", id: "Al-Muwatta 1489 — Muhammad ibn Yahya ibn Hibban, berdasarkan riwayat Al-A'raj, berdasarkan riwayat Abu Hurayrah: Tidak seorang pun di antara kalian boleh melamar seorang wanita yang sudah bertunangan dengan saudaranya." }
text: "لا يَخْطَبُ أَحَدُكُمْ على خِطبةِ أخيهِ"
summary:
  ar: "يروي مالك عن محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة أن رسول الله قال لا يخطب أحدكم على خطبة أخيه. {cite:muwatta-maruf-1997 p.27}"
  tr: "Malik, Muhammed ibn Yahya ibn Hibban'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Sizden hiç kimse, erkek kardeşiyle nişanlı olan bir kadına evlenme teklif etmemelidir.\" {cite:muwatta-maruf-1997 s.27}"
  id: "Malik meriwayatkan dari Muhammad ibn Yahya ibn Hibban, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Tidak seorang pun di antara kalian boleh melamar seorang wanita yang sudah bertunangan dengan saudaranya.\" {cite:muwatta-maruf-1997 p.27}"
