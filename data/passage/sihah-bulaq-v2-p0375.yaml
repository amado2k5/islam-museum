text: |-
  ( ١ فى فسخة زيادة الشاعر
  امر والقيس ١ه
  ٢٩٢
  اناحرك الجيم فيهاضرورة لانه يجوز تحسريك الساكن في القافية بحركة ماقبله كماقال
  ضربا أليماببت يلعج الجلدا • والعجلة أيضا السقاء والجمع عمل مثل قرية وقرب
  قال بصف فرسا
  قالله فى الصيف ظل بارد • ونصى ناعجة ومخض منقع
  حتى اذا نيح الطباء بداله * عمل كأحرة الصريعة أربع
  فأنى له أى دام ه وقوله نبح الظباءلان الظبى اذا أسن وبدت فى قرنه عقد وحيود نح عند طلوع
  الفجر كاينح الكاب وقوله كاحرة الصريمة يعنى الصخور الملس لان الصخرة الململمة يقال لها
  أتان فاذا كانت فى الماء الضحضاح فهى أتان الضجل فلمالم يمكنه أن ية ول كاتن الصريمة وضع
  الاحرة موضعها اذ كان معناهما واحدا يقول هذا الفرس كريم على صاحبه فهو يسقيه
  اللبن وقد أعدة أريعة أسقية عملوأة لبنا كالصخورالملس فى اكتنازها تقدم البسه فى أوّل
  الصبح وقد تجمع على عمال مثل رهمة ورهام وذهبة وذهاب قال الشاعر
  على أن مكتوب العجال وكيع* والعجلة أيضاضرب من النبت وقال
  عليك سرداحا من السرداح • ذاعجلة وذانصى ضاح
  والعجلة بالتحريك التى يجترها الثور والجهع عمل وأعجمال والعجلة المنجنون يستقى عليها والجمع
  عمل قال الكلابى العجلة خشبة معترضة على نعامة البثر والغرب معلق بها والعجل والعجلة
  خلاف البطء وقد عجل بالسكسر ور جل عجل وعمل وعجول وعجلان بين العجلة واموأة عجلى مثل
  رجلى ونسوة عجالى كما قالوار جالى وعمال أيضا كما قالوار جال والعاجل والعاسلة تقيض
  الاجل والاجلة وعاجله بذنيه اذا أخذه به ولم يهله وقوله تعالى أعجلتم أمى ربكم أى أسبقتم
  وأعجله والعجول من الابل الواله التى فقدت ولدها والعجالة بالضم ما تتجله من شئ والتمر
  مجمالة الراكب يقال عجلتم كماية ال لهنتم وفى المثل الثيب عجالة الراكب وعجلان اسم
  رجل وأتم عجلان طائر وأعمله وعجله تعجيلا اذا استجنه وتعجلت من السكراء كذا وعجات نه
  من الثمن كذا أى قدّمت وعجات اللهم طبخته على عجلة والمعجل والمتعجل الذى يأنى أهله
  بالاعج الة والاعجالة مايعجلد الراعى من المبن الى أهله قبل الحلب وقال ١ صف سيلان الدمع
  كانهما مزاد تا متعجل *فسريان لمايدهنا بدهان
  واسيجلته طالبت عولته وكدلك اذا تقدمته قال القطامى"
  واستهلوناوكانوامن صحابتنا • كماتعمل فراطوراد
  ⁦(عدل)⁩. العدل خلاف الجروية ال عدل عليه فى الغضية فهوعادل وبسط الوالى عده
  ومعدلته ومعدلته وفلان من أهل المعدلة أى من أهل العدل ورجل عدل أى رضاومقنع
  فى الشهادة وهو فى الاصل مصدر وقوم عدل وعدول أيضارهوجع عدل وقد عدل الرجل
  بالضم عدالة قال الإخفس العدل بالكسر المثل والعدل بالفتح أصله مصدرة ولك عدات
  بهذا عدلا حسنا تجعله اسيم الامثل لتفرق بينه وبين عدل المباع كما فالوا امرأة رزان وعجز رزين
  للفرق وقال الفراء العدل بالفتح ماعادل الشيء من غير جنسه والعدل بالكسر المثل
  تقول عندى عدل غلامك وعدل شاتكْ اذا كان غلاما يعدل غلاما وشاة تعسدل ساة فاذا
  أردن
