text: "وهو مخيم بالحديبية - (٣) أن عثمان قد قتل - وكان قد بعثه في رسالة إلى المشركين- بايع أصحابه، وكانوا ألفا وأربعمائة تحت الشجرة على قتال المشركين، فلما بلغه أن عثمان لم يقتل كف عن ذلك، وجنح إلى المسالمة والمصالحة،"
