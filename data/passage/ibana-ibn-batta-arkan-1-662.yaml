text: "… أحمد بن ثابت، قال: نا أبو الأحوص القاضي، قال: نا عبد الله بن رجاء أبو عمرو العداني، قال: نا شعبة، قال: ناقتادة، عن أنس أن النبي ويق، قال: ثلاث من كن فيه وجد بهن حلاوة الإيمان: من كان اللّٰه ورسوله …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 662، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 662, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 662 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe de Ibn Batta, volumen 1, pág. 662, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Livre de la Foi), volume 1, page 662, évoquant la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1, s. 662) adlı eserinden, imanın tatlılığı ve mükemmelliğinden ve ona sahip olanların niteliklerinden bahseden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. İslam'ın Şartları, İmanın Şartları, İmanın Dalları ve Müminin Nitelikleri tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 1 Bergambar, hlm. 662, yang menyebutkan kemanisan dan kesempurnaan iman, serta sifat-sifat orang yang memilikinya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Kitab ini disusun berdasarkan Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Sifat-Sifat Orang Beriman."
