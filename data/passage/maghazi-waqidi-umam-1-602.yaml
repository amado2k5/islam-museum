text: "… حين دعا إلى البيعة. وبلغ قُرَيشاً حَبْسُ أَصحابهم، فجاءَ جَمْعُ من قُرَيشِ إلى النبىّ وأصحابِه حتى تَرامَوا بالنبل والحجارة، وأَسروا أَيضاً مِن المشركين حينئذٍ أَسْرَى، ثم إنَّ قُريشاً بعثوا سُهَيل بن عمرو وحُويْطِب بن عبد العُزَّى ومِكْرَز بن حَفص، فأَقبل …"
