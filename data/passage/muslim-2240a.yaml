label:
  ar: "مسلم 2240a — من قتل وزغة في أول ضربة"
  en: "Muslim 2240a — Who kills a gecko at the first stroke"
  ur: "مسلم 2240a — جو وزغہ کو پہلی ضربت میں مارے"
text: "مَنْ قَتَلَ وَزَغَةً فِي أَوَّلِ ضَرْبَةٍ فَلَهُ كَذَا وَكَذَا حَسَنَةً، وَمَنْ قَتَلَهَا فِي الضَّرْبَةِ الثَّانِيَةِ فَلَهُ كَذَا وَكَذَا حَسَنَةً لِدُونِ الأُولَى، وَإِنْ قَتَلَهَا فِي الضَّرْبَةِ الثَّالِثَةِ فَلَهُ كَذَا وَكَذَا حَسَنَةً لِدُونِ الثَّانِيَةِ"
summary:
  ar: "في كتاب السلام؛ عن أبي هريرة: من قتل وزغة في أول ضربة فله كذا وكذا حسنة، وفي الثانية دونها، وفي الثالثة دون الثانية — أجر متدرج على عجلة القتل."
  en: "In the Book of Greetings, from Abu Hurayra: whoever kills a gecko at the first stroke has such-and-such a reward, at the second less, at the third less still — a graduated reward for swiftness of the kill."
  ur: "کتاب السلام میں ابو ہریرہ سے: جو وزغہ پہلی ضربت میں مارے اس کے لیے اتنے اتنے نیکیاں، دوسری میں کم، تیسری میں اس سے بھی کم — جلدی مارنے پر درجہ بدرجہ اجر۔"
