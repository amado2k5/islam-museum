  en: "Jami' al-Tirmidhi, Book 39: The Book on the Description of Hellfire"
  ur: "جامع ترمذی، کتاب صفۃ جہنم عن رسول اللہ"
  es: "Jami' al-Tirmidhi, Libro 39: El libro sobre la descripción del fuego del infierno."
  fr: "Jami' al-Tirmidhi, Livre 39: Le Livre de la description de l'Enfer"
  tr: "Cami' el-Tirmizi, Cehennemin Tanımı Kitabı, Allah Resulü'nün rivayetine göre."
  id: "Jami' al-Tirmidhi, Kitab Deskripsi Neraka, berdasarkan riwayat Rasulullah SAW"
summary:
  ar: "القسم 39 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صفة جهنم عن رسول الله»، ويضم فيها النصوص من 2573 إلى 2795 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 39 of Jami' al-Tirmidhi (The Book on the Description of Hellfire) in the division of the open hadith dataset the museum took its reports from: reports 2573 to 2795 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 39، عنوان «کتاب صفۃ جہنم عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2573 تا 2795۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 39 de Jami' al-Tirmidhi (El libro sobre la descripción del fuego del infierno) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2573 al 2795 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 39 de Jami' al-Tirmidhi (Description de l'Enfer), correspondant aux hadiths 2573 à 2795 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 39. bölümü, \"Allah'ın Elçisinden Cehennemin Tanımı Kitabı\" başlığını taşımakta olup, sırasıyla 2573 ila 2795 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 39 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Deskripsi Neraka dari Rasulullah,\" dan berisi teks 2573 hingga 2795, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
