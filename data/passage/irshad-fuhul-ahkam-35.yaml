text: "… والحديث وأما فى عرف عليه الفقه وقد صرحوا أهل الفقه فانما يطلقونها على ماليس بواجب وتطلق على ما يقابل البدعة كقولهم فلان من أهل بأن الصدق فى المفردات السنة قال ابن فازس فى فقه المربية وكره العلماء قول من قال …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 35، يرد فيه ذكر الواجب، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 35, whose wording mentions the obligatory (wajib), what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 35 کا اقتباس جس میں واجب، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Irshad al-Fuhul de al-Shawkani, p. 35, dont le texte mentionne l'obligatoire (wajib), ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Irshad al-Fuhul de al-Shawkani, p. 35, cuyo texto menciona lo obligatorio (wajib), lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şavani'nin *İrşad el-Fuhul* adlı eserinin 35. sayfasından, farz olan amelleri, fıkıhçılarca hoş görülmeyen amelleri ve mekruh sayılan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan amelleri, itaat amellerini, tavsiye edilen amelleri, hoş görülmeyen amelleri, haram amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Irshad al-Fuhul* karya Al-Shawkani, halaman 35, yang menyebutkan amalan wajib, amalan yang tidak disukai oleh ahli fiqih, dan amalan yang dianggap tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
