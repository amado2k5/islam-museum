label: { ar: "الموطأ 1709 — علي بن أبي طالب: في الحكمين اللذين ذكرهما الله في سورة النساء، إن إليهما الفرقة بينهما والاجتماع", en: "Muwatta 1709", es: "Muwatta 1709", fr: "Muwatta 1709", ur: "موطا 1709", tr: "Al-Muwatta 1709 — Ali ibn Abi Talib: Allah'ın Nisa Suresi'nde bahsettiği iki hüküm hakkında, aralarındaki ayrılık ve birlik, bu hükümler tarafından belirlenmiştir.", id: "Al-Muwatta 1709 — Ali ibn Abi Talib: Mengenai dua hukum yang Allah sebutkan dalam Surat An-Nisa, pemisahan dan persatuan di antara keduanya ditentukan oleh keduanya." }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن علي بن أبي طالب قال في الحكمين اللذين قال الله تبارك وتعالى في كتابه، إن شقاق بينهما، فابعثوا حكما من أهله وحكما من أهلها، إن إليهما الفرقة بينهما والاجتماع. {cite:muwatta-maruf-1997 p.97}"
  tr: "Yahya, Malik'ten rivayetle, Ali ibn Abi Talib'in, Allah'ın (celle celaluhu) Kitabında bahsettiği iki hakem hakkında şöyle dediğini işittiğini aktarır: \"Eğer aralarında bir anlaşmazlık çıkarsa, onun ailesinden bir hakem ve onun ailesinden bir hakem gönderin; işte bu, anlaşmazlıklarının çözümü ve barışmalarının yoludur.\" {cite:muwatta-maruf-1997 s.97}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Ali bin Abi Talib berkata mengenai dua penengah yang Allah, Maha Berkah dan Maha Tinggi, sebutkan dalam Kitab-Nya, jika terjadi perselisihan di antara mereka, maka kirimkanlah seorang penengah dari keluarganya dan seorang penengah dari keluarganya, kepada merekalah penyelesaian perselisihan dan perdamaian mereka. {cite:muwatta-maruf-1997 p.97}"
