text: "… القلاف، قال: قال عبد الصمد: يا أبا علي رأيت اليوم عجباً: اجتزت ببعض الخرابات فسمعت منها أنيناً فدخلت وإذا برجل قد شد حبلاً يريد أن يخنق نفسه فزعقت عليه وقلت له: لا يحل لك أن تفعل هذا. فقال لي: فاغدر؟ …"
summary:
