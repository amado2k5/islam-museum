text: |-
  •⁦(باب الميم)⁩.
  • ⁦(أرم)⁩
  ٢٥٧
  وتأثم أى تحترج عنه وكف والا ثام جزاء الاثم قال تعالى يلق أثاما وناقة آغة ونوق آغمات
  أى مبطتات قال الاعنى
  جماليه تغتلى بالرداف • اذا كذب الاتمات الهجيرا
  جم) الاجمة من القسب والجمع أجمات وأجم وإجام وآيام وأجم كما قلناه فى الاكمة
  والاجم أيضاحص-ن شاء أهل المدينة من عجارة قال يعوب كل بيت حربع مسطح أجم
  قال امر والقيس وتما لم يترك بها جذع نخلة • ولا أبا الامشيد ابجندل
  وقال الاصهعى هو يخفف ويثقل واجمع آجام مثل عنق وأعفاق وتأجم النهار أى اشتدحتره
  وتأجمت النار مثل تأججت وانّ له الاجما وأجيجا قال عبيد بن أيوب العنبرى
  ويوم كتفور الاماه عرنه • حلن عليه الجزل حتى تأبا
  رميت بنفسي فى أجيج سمومه • وبالعنس حتى جاش منسمهادما
  وفلان يتأجم على فلان ويتأطم اذا اشتد غضيه عليه وتلهف أبوز يدأبحت الطعام بالكسر
  اذا كرهته من المداومة عليه فأنا آجم على فاعل والاجمموضع بالشأم بقرب الفراديس
  ⁦( ادم)⁩. الادم جمع الاديم مثسل أفيق وأفق وقد يجمع على آدمة مثل رغيف وأرغفة عن
  أبى نصر وربماسمى وجه الارض أديما قال الاعشى
  يوماتراها كشبه أردية اكحصب ويوما أديها نغلا
  والادمة باطن الجلد الذى يلى اللهم والشرة ظاهرها وفلان مؤدم مشرأى قدجمع لين الادمة
  وخشونة الشرة ويقال أيضاجعلت فلانا أدمة أهلى أى أسوته-م والادمة بالضمّ السمرة
  والادمة أيضا الوسلة الى الشئ عن الفراء والا دم من الناس الامعروالبهع أدمان وآدم عل
  السلام أبو البشروأصله بهمزتين لانه أفعل الا أنمم اينوا الثانية فاذا احتمت الى تحريكها
  جعلتها واوا وقات أوادم فى الجممع لانه ليس لها أصل فى الياءمعسروف فجعلت الغالب عليها
  الواوءن الاخفش قال الاصمى والادم من الظباء بيض تعاوهنّ جدد فين غبرة نكن
  الجبال قال وهى على ألوان الجبال يقال ظبية أدماء وقدجاء فى شع رذى الرمّة أدمانة قال
  أقول الركب LIأعرضت أصلا • أدمانة لم تزبم ا الاجالد
  وأنكره الاصمعى والادمة فى الابل البياض الشديد يقال بعير آدم وناقة أدماء والجع
  أدم وقال
  فان أهيه يضجر كما ضهر بازل • من الادم دبرت صفمحتاه وغاريه
  ويقال هو الايض الاسود المقلتين والادم والادام مايؤتدم به تقول منه أدم الخبز بالنهم
  يأدمه بالكسر والادم الالفة والاتفاق يقال أدم اللّٰه بينهما ادما أى أصلح وألف وكذلك آدم
  اللّه دنهما فعل وأفعل بعى وفى الحديث لو نظرت اليهافانه أحرى أن يؤدم بينكل يعنى أن تكون
  بينكما المحبة والاتفاق وقال• والبيض لا يؤد من الامؤدماه أى لا يحبين الامهيبا وأدمى
  على فعلى بضم الفاءوفتح العيز اسمم وضع والاياديم متون الارض لا واحدلها رم)
  الارم حجارة تنصب علما فى المغازة والجمع آرام وأروم مثل ضلع وأضلاع وضلوع وقوله تمالى
  ارم ذات العماد فن لم يضف جحل ارم اممه ولم يصرفه لانه جعل عادا اسم أبيه-م وارم اسم
  القبيلة وجعله بدلامنه ومن قرأه بالاضافة ولم يصرفه جعلهامم أمهم أواسم بلدة والاروم
  ٦٥
  لى
  قوله أردية العصب رواه فى ماذة
  خس ونغسل أردية الهص ا*
