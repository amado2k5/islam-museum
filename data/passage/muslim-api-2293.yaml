label: { ar: "صحيح مسلم 2293 — الكي", en: "Sahih Muslim 2293 — cautery", ur: "صحیح مسلم 2293 — داغنا", es: "Sahih Muslim 2293 — cauterización", fr: "Sahih Muslim 2293 — cautérisation", tr: "Sahih Muslim 2293 — Anahtar", id: "Sahih Muslim 2293 — Kunci" }
text: "وَحَدَّثَنَاهُ قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ، - يَعْنِي الدَّرَاوَرْدِيَّ - عَنْ سُهَيْلٍ، بِهَذَا الإِسْنَادِ. وَسَاقَ الْحَدِيثَ. وَحَدَّثَنِيهِ مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بَزِيعٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا رَوْحُ بْنُ الْقَاسِمِ، حَدَّثَنَا سُهَيْلُ بْنُ أَبِي صَالِحٍ، بِهَذَا الإِسْنَادِ وَقَالَ بَدَلَ عَقْصَاءُ عَضْبَاءُ وَقَالَ \" فَيُكْوَى بِهَا جَنْبُهُ وَظَهْرُهُ \". وَلَمْ يَذْكُرْ جَبِينُهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2293، يذكر الكي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2293 (The Book of Zakat), that mentions cautery. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2293، جس میں داغنا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 2293 (El Libro del Zakat), menciona la cauterización. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 2293 (Le Livre de la Zakat), mentionne la cautérisation. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 2293 numaralı hadis, yakma işleminden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2293, menyebutkan tentang kauterisasi. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
