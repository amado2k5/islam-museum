text: "… عبدالله ثنا موسى بن اسماعيل ثنا شبيب بن عجلان ثنا عبسد العزيز أبو مقاتل عن عطاء بن أبى رباح عن أبى هريرة عن النبى. قال : لا يزنى الزانى حين يزنى وهو مؤمن، ولا يسرق السارق حين يسرق وهو مؤمن، …"
summary:
