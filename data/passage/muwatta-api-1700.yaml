label: { ar: "موطأ مالك 1700 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Muwatta Malik 1700 — mentions of non-Muslim nations, religions and peoples", ur: "موطأ مالک 1700 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Muwatta Malik 1700 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Muwatta Malik 1700 — mentions de nations, de religions et de peuples non musulmans", tr: "Muwatta Malik 1700 — Müslüman olmayan milletler, dinler ve halklardan bahsedilmesi", id: "Muwatta Malik 1700 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّهُ قَالَ رَأَيْتُ عُمَرَ بْنَ الْخَطَّابِ - وَهُوَ يَوْمَئِذٍ أَمِيرُ الْمُؤْمِنِينَ - يُطْرَحُ لَهُ صَاعٌ مِنْ تَمْرٍ فَيَأْكُلُهُ حَتَّى يَأْكُلَ حَشَفَهَا."
summary:
  ar: "حديث في موطأ مالك، رقم 1700، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1700 (The Description of the Prophet, may Allah Bless Him and Grant Him Peace), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 1700، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.º 1700 (Descripción del Profeta), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Muwatta Malik, n° 1700 (Description du Prophète, que la paix et la bénédiction d'Allah soient sur lui), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Malik'in Muwatta adlı eserinde 1700 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 1700, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
