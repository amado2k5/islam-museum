label:
  ar: "النسائي 4358 — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Nasa'i 4358 — A prophet stung by an ant: why not just the one ant"
  ur: "نسائی 4358 — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
  es: "Nasa'i 4358 — Un profeta picado por una hormiga: ¿por qué no solo una hormiga?"
  fr: "Nasa'i 4358 — Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ?"
  tr: "Kadınların Hadisi 4358 — Bir peygamberi bir karınca ısırdı: Neden sadece bir karınca değil?"
  id: "Hadits Wanita 4358 — Seorang Nabi digigit semut: Mengapa bukan hanya satu semut?"
text: "أن نملة قرصت نبيا من الأنبياء فأمر بقرية النمل فأحرقت فأوحى الله عز وجل إليه أن قد قرصتك نملة أهلكت أمة من الأمم تسبح ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 4358: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 4358: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 4358: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 4358: Un profeta picado por una hormiga: ¿por qué no solo una hormiga? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan an-Nasa'i, n° 4358: Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan an-Nasa'i'de 4358 numaralı hadis-i kudsi şöyledir: Bir peygamberi bir karınca ısırdı: \"Neden sadece bir karınca değil?\" Peygamber bunu Rabbinden rivayet etti ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve el-Muvatta'da derledi."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 4358: Seorang Nabi digigit semut: \"Mengapa bukan hanya satu semut?\" Nabi meriwayatkan hal ini dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
