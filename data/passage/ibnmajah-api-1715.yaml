label: { ar: "سنن ابن ماجه 1715 — مضاعفة الحسنة بعشر أمثالها", en: "Sunan Ibn Majah 1715 — the good deed multiplied tenfold and beyond", ur: "سنن ابن ماجہ 1715 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا بَقِيَّةُ، حَدَّثَنَا صَدَقَةُ بْنُ خَالِدٍ، حَدَّثَنَا يَحْيَى بْنُ الْحَارِثِ الذِّمَارِيُّ، قَالَ سَمِعْتُ أَبَا أَسْمَاءَ الرَّحَبِيَّ، عَنْ ثَوْبَانَ، مَوْلَى رَسُولِ اللَّهِ ـ عَنْ رَسُولِ اللَّهِ ـ أَنَّهُ قَالَ: \" مَنْ صَامَ سِتَّةَ أَيَّامٍ بَعْدَ الْفِطْرِ كَانَ تَمَامَ السَّنَةِ {مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا} \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1715، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1715 (Fasting), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1715، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
