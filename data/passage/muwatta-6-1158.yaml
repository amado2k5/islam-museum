label: { ar: "الموطأ 1158 — مالك في العبد يُعتق في الموقف بعرفة: لا يجزئه عن حجة الإسلام إلا بشروط", en: "Muwatta 1158", es: "Muwatta 1158", fr: "Muwatta 1158", ur: "موطا 1158", tr: "El-Muvatta 1158 — Malik'in Arafat'ta azat edilen bir köle hakkındaki görüşü: Bu, belirli şartlar dışında farz olan Hac için yeterli değildir.", id: "Al-Muwatta 1158 — Malik tentang seorang budak yang dibebaskan di Arafat: Hal itu tidak cukup untuk ibadah haji wajib kecuali dalam kondisi tertentu." }
summary:
  ar: "يقول مالك إن العبد إذا عتق في الموقف بعرفة لا يجزئه ذلك عن حجة الإسلام، إلا أن يكون لم يحرم فيحرم بعد أن يعتق، ثم يقف بعرفة من تلك الليلة قبل طلوع الفجر، فإن فعل أجزأ عنه. وإن لم يحرم حتى يطلع الفجر كان بمنزلة من فاته الحج، ويكون عليه حجة الإسلام يقضيها. {cite:muwatta-maruf-1997 p.524}"
  tr: "Malik, Arafat'ta azat edilen bir kölenin, ihrama girmemiş olması durumunda, ihrama girmemiş olması şartıyla Hac yükümlülüğünü yerine getirmiş sayılmayacağını söyler. Bu durumda, azat edildikten sonra ihrama girmeli ve o gece şafak sökmeden önce Arafat'ta bulunmalıdır. Bunu yaparsa, yeterli olur. Ancak, şafak sökene kadar ihrama girmezse, Hac'ı kaçırmış sayılır ve farz olan Hac'ı yine de yerine getirmelidir. {cite:muwatta-maruf-1997 s.524}"
  id: "Malik mengatakan bahwa jika seorang budak dibebaskan di Arafat, hal itu belum memenuhi kewajiban hajinya kecuali jika ia belum memasuki keadaan ihram. Dalam hal itu, ia harus memasuki keadaan ihram setelah dibebaskan dan kemudian berdiri di Arafat pada malam itu sebelum fajar. Jika ia melakukannya, itu sudah cukup. Namun, jika ia tidak memasuki keadaan ihram hingga fajar, ia dianggap telah melewatkan haji, dan ia tetap harus melaksanakan haji wajib. {cite:muwatta-maruf-1997 p.524}"
