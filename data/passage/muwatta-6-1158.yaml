label: { ar: "الموطأ 1158 — مالك في العبد يُعتق في الموقف بعرفة: لا يجزئه عن حجة الإسلام إلا بشروط", en: "Muwatta 1158" }
summary:
  ar: "يقول مالك إن العبد إذا عتق في الموقف بعرفة لا يجزئه ذلك عن حجة الإسلام، إلا أن يكون لم يحرم فيحرم بعد أن يعتق، ثم يقف بعرفة من تلك الليلة قبل طلوع الفجر، فإن فعل أجزأ عنه. وإن لم يحرم حتى يطلع الفجر كان بمنزلة من فاته الحج، ويكون عليه حجة الإسلام يقضيها. {cite:muwatta-maruf-1997 p.524}"
