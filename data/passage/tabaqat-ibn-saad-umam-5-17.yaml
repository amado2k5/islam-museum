text: "… آخذ بِعَرْقُوَتَىْ قَتَبٍ لأَخذتُ بهما حتى أَمرتَ. قال ثمّ استأُذنه إلى الرّبَدَةِ، قال فقال : نعم نأذن لك ونأمر لك بنَعَم من نعم الصدقة فتَصيبُ من رِسلها. فقال فنادى أبو فرّ : دونكم معاشر قريش دنياكم فاعْذَمُوها لا حاجة لنا …"
