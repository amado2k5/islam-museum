text: "حمد رسول الله إلى المنذر بن ساوى، سلام عليك فإني أحمد إليك الله الذي لا إله لا هو، وأشهد أن لا إله إلا الله، وأن محمدا عبد رسوله، أما بعد، فإنى أذكرك الله عز وجل، فإنه مر ينصح فإنما ينصح لنفسه، وإنه"
