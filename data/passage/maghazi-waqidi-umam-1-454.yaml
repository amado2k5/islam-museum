text: "… وخمسون مقاتلا. فلمّا دنَوْا قال أبو سُفيان لحُيى بن أَخْطَب : انْتِ قومك، حتى ينقضوا العهد الذى بينهم وبين محمّد. فذهب حُيَىّ حتى أتى بنى قُرَيظَة ؛ وكان رسول اللّٰه حين قدم صالَح قُرَيْظَة والنَّضير ومن بالمدينة من اليهود أَلاَّا …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 454، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
