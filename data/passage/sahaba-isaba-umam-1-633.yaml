text: "… معه رجلا من الفرس يقال له جد جميرة، وكتب معهما إلى رسول اللّٰه وَلِيقم يأمره أن يتوَّجه معهما إلى كسرى؛ وقال لقهرمانه: انظر إلى الرجل وما هو وكلّمه واثتني بخبره. فخرجا حتى قدما الطَّائف، فوجدا رجالاً من قريش تجاراً، فسألوهم …"
