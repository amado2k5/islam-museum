text: "صطخر وخلف وزيره أبرسام بأردشير خرة، فلم يلبث إلا قليلا حتى ورد عليه كتاب أبرسام بموافاة ملك الأهواز وعوده منكوبا، ثم سار إلى أصبهان فملكها وقتل ملكها وعاد إلى فارس وتوجه إلى محاربة نيروفر صاحب الأهواز، وسار إلى أرجان وإلى"
