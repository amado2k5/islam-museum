label: { ar: "نوادر جحا الكبرى، ص 131 — «مَن يقطع مسافة تسعة أشهر بثلاثة يسمى ساعياً»", en: "Nawadir Juha al-Kubra, p. 131 — 'Whoever Covers Nine Months in Three Is Called a Runner'", ur: "نوادر جحا الکبریٰ، ص 131 — «جو نو مہینے تین میں طے کرے وہ دوڑنے والا کہلاتا ہے»", fr: "Nawadir Juha al-Kubra, p. 131 — « Celui qui parcourt neuf mois en trois s'appelle un coureur »", es: "Nawadir Juha al-Kubra, p. 131 — «Quien recorre nueve meses en tres se llama corredor»" }
text: "… مَن يقطع مسافة تسعة أشهر بثلاثة يسمى ساعياً ولدت أمرأة لثلاثة شهور من زواجها. فأجتمع النساء وقلن ما نسمي المولود؟ وقررن أن يراجعن الشيخ، وعندما راجعنه قال: سمُّوه ساعياً. فقلن له : لم نسمع بهذا الإسم. فأجابهن : مَن يقطع …"
summary:
  ar: "ولدت امرأة بعد ثلاثة أشهر من الزواج، فسألت النساء جحا ماذا يسمّين المولود، فقال سمّوه ساعياً، فمن يقطع مسافة تسعة أشهر بثلاثة يسمى ساعياً. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  en: "A woman bears a child three months after marriage, and the women ask Juha what to name the baby. He says to call him Sa'i, 'runner', since someone who covers nine months in three must be named so. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  ur: "ایک عورت شادی کے تین مہینے بعد بچہ جنتی ہے تو عورتیں جحا سے پوچھتی ہیں کہ بچے کا نام کیا رکھیں۔ وہ کہتا ہے کہ اس کا نام ساعی، یعنی دوڑنے والا، رکھو، کیونکہ جو نو مہینے کا فاصلہ تین میں طے کرے اسے یہی نام دینا چاہیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  fr: "Une femme met un enfant au monde trois mois après son mariage, et les femmes demandent à Juha quel nom donner au bébé. Il dit de l'appeler Sa'i, « coureur », puisque celui qui parcourt neuf mois en trois doit porter ce nom. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  es: "Una mujer da a luz tres meses después de casarse, y las mujeres preguntan a Juha qué nombre poner al bebé. Él dice que lo llamen Sa'i, «corredor», pues quien recorre nueve meses en tres debe llevar ese nombre. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
