label: { ar: "الموطأ 1011 — زيد بن أسلم عن عطاء بن يسار: أن كعب الأحبار أقبل من الشام في ركب، فوجدوا لحم صيد، فأفتاهم بأكله، فلما قدموا على عمر ذكروا ذلك، فقال: من أفتاكم؟ قالوا: كعب؛ ثم أفتاهم بأكل جراد، فقال عمر: إنها نثرة حوت", en: "Muwatta 1011", es: "Muwatta 1011", fr: "Muwatta 1011", ur: "موطا 1011", tr: "El-Muvatta 1011 — Zeyd ibn Aslam, Ata ibn Yasar'dan rivayetle: Ka'b el-Ahbar, Suriye'den bir grup insanla geldi ve av eti buldular. Onlara av etini yemelerine izin veren bir fetva verdi. Ömer'in yanına geldiklerinde bunu anlattılar ve Ömer, \"Bu fetvayı size kim verdi?\" diye sordu. Onlar da, \"Ka'b\" dediler. Sonra Ka'b onlara çekirge yemelerine izin veren bir fetva verdi ve Ömer, \"O, balığın yavrusudur\" dedi.", id: "Al-Muwatta 1011 — Zayd ibn Aslam, berdasarkan riwayat Ata ibn Yasar: Ka’b al-Ahbar datang dari Suriah bersama sekelompok orang, dan mereka menemukan daging buruan. Ia memberi mereka fatwa yang memperbolehkan mereka memakannya. Ketika mereka datang kepada Umar, mereka menceritakan hal ini, dan Umar bertanya: “Siapa yang memberi kalian fatwa ini?” Mereka menjawab: “Ka’b.” Kemudian ia memberi mereka fatwa yang memperbolehkan mereka memakan belalang, dan Umar berkata: “Itu adalah keturunan ikan.”" }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار أن كعب الأحبار أقبل من الشام في ركب، حتى إذا كانوا ببعض الطريق وجدوا لحم صيد، فأفتاهم كعب بأكله. فلما قدموا على عمر بن الخطاب بالمدينة ذكروا ذلك، فقال: من أفتاكم بهذا؟ قالوا: كعب، فقال عمر: قد أمرته عليكم حتى ترجعوا. ثم لما كانوا ببعض طريق مكة مرت بهم رجل من جراد، فأفتاهم كعب أن يأخذوه فيأكلوه، فقال عمر: ما حملك أن أفتيتهم بهذا؟ قال: هو من صيد البحر. قال: وما يدريك؟ قال: إنه نثرة حوت ينثره في كل عام مرتين. ويذكر المحقق أن هذا الكلام لا يسوى سماعه في منشأ الجراد، وأنه ربما من تخاريف أهل الكتاب. {cite:muwatta-maruf-1997 p.474}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre, Ka'b el-Ahbar Suriye'den bir kervanla geldi. Yolun bir kısmında av eti buldular ve Ka'b onlara eti yemelerine izin veren bir fetva verdi. Medine'ye Ömer ibn el-Hattab'ı görmeye geldiklerinde bunu anlattılar. Ömer, \"Bu fetvayı size kim verdi?\" diye sordu. Onlar, \"Ka'b\" diye cevap verdiler. Ömer, \"Dönene kadar onu sizin lideriniz olarak atadım\" dedi. Sonra Mekke'ye doğru yolun bir kısmındayken bir çekirge sürüsü geçti ve Ka'b onlara çekirgeleri alıp yemelerine izin veren bir fetva verdi. Ömer, \"Bu fetvayı vermene sebep olan neydi?\" diye sordu. Ka'b, \"Deniz avından\" diye cevap verdi. Ömer, \"Nereden biliyorsun?\" diye sordu. Ka'b, \"Yılda iki kez tüküren bir balığın tükürüğü\" diye cevap verdi. Araştırmacı, çekirgelerin kökeniyle ilgili bu anlatımın dikkate alınmaya değer olmadığını ve belki de Kitap Ehli'nin uydurmalarından biri olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.474}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, dari Ata ibn Yasar, bahwa Ka'b al-Ahbar datang dari Suriah dengan kafilah. Ketika mereka berada di tengah perjalanan, mereka menemukan daging buruan, dan Ka'b memberi mereka fatwa yang mengizinkan mereka untuk memakannya. Ketika mereka tiba di Madinah untuk menemui Umar ibn al-Khattab, mereka menceritakan hal ini. Umar bertanya, \"Siapa yang memberi kalian fatwa ini?\" Mereka menjawab, \"Ka'b.\" Umar berkata, \"Aku telah menunjuknya sebagai pemimpin kalian sampai kalian kembali.\" Kemudian, ketika mereka berada di tengah perjalanan ke Mekah, sekawanan belalang lewat di dekat mereka, dan Ka'b memberi mereka fatwa yang mengizinkan mereka untuk mengambil dan memakannya. Umar bertanya, \"Apa yang membuatmu memberi mereka fatwa ini?\" Ka'b menjawab, \"Itu dari buruan laut.\" Umar bertanya, \"Bagaimana kamu tahu?\" Ka'b menjawab, \"Itu adalah air liur ikan yang keluar dua kali setahun.\" Peneliti tersebut menyebutkan bahwa kisah ini tidak layak dipercaya mengenai asal usul belalang, dan mungkin merupakan salah satu rekayasa dari Ahli Kitab. {cite:muwatta-maruf-1997 p.474}"
