label: { ar: "الموطأ 1011 — زيد بن أسلم عن عطاء بن يسار: أن كعب الأحبار أقبل من الشام في ركب، فوجدوا لحم صيد، فأفتاهم بأكله، فلما قدموا على عمر ذكروا ذلك، فقال: من أفتاكم؟ قالوا: كعب؛ ثم أفتاهم بأكل جراد، فقال عمر: إنها نثرة حوت", en: "Muwatta 1011" }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار أن كعب الأحبار أقبل من الشام في ركب، حتى إذا كانوا ببعض الطريق وجدوا لحم صيد، فأفتاهم كعب بأكله. فلما قدموا على عمر بن الخطاب بالمدينة ذكروا ذلك، فقال: من أفتاكم بهذا؟ قالوا: كعب، فقال عمر: قد أمرته عليكم حتى ترجعوا. ثم لما كانوا ببعض طريق مكة مرت بهم رجل من جراد، فأفتاهم كعب أن يأخذوه فيأكلوه، فقال عمر: ما حملك أن أفتيتهم بهذا؟ قال: هو من صيد البحر. قال: وما يدريك؟ قال: إنه نثرة حوت ينثره في كل عام مرتين. ويذكر المحقق أن هذا الكلام لا يسوى سماعه في منشأ الجراد، وأنه ربما من تخاريف أهل الكتاب. {cite:muwatta-maruf-1997 p.474}"
