text: |-
  ومن هنا تعلم غلط بعض الحواشى
  الفقهية فى عزوهذا الشعر
  لسيدنا على كرم اللّٰه وجهه قاله
  نصر
  ٥٣٦
  ⁦(باب الضاد)⁩
  يعف ما انفض مر نطفة الرجسل وتردد فى صلبه والفاضة الداهية وتففض الذى أى تفرق
  والفضيض الماء العذب وقد اقتضضت الماءاذا أصبته ساعة يخرج وقال أبو عبيد الفضيض
  الماء السائل والفضة معروفة ولحام مففض أى مرصع بالفضة والفضفضسعة الثوب
  والدرع والعيش يقال توب فضفاض وعيش فضفاض ودرع فضفاضة أى واسعة
  ( (فوض فوض البه الامر أى ردّه اليه والتفويض فى النكاح التزويج بلامهر وقوم
  فوضى أى متساوون لارئيس لهم قال الافوه الاودى ١
  لا تصلح الناس فوضى لاسرالهم • ولاسراة اذاجهاله-م سادوا
  ونعام فوضى مختلط بعضه ببعض ويقال أموالهم فوصى يانهم أى هم شركاء فيها وفيضوضى
  مثله يمدّ ويقصر وتفاوض الشر يكان فى المال اذا اشتر كافيه أبجع وهى شركة المفاوضة
  وفاوضه فى أمره أى ياراه وتفاوض القوم فى الامرأى فاوض فيه بعضهم إعضا ⁦( يض)⁩
  قاض الطبريقيض واستفاض أى شاع وهوحديث مستفبض أى منشر فى الناس ولا تقل
  مستفاض الاأن تقول مستفاض فيه وبعضهم يقول استفاضوه فهو مستفاض ويقال
  استفاض الوادى شجرا أى اتسع وكثر شجره والمستفيض الذى يسأل افاضة الماء وغيره ودرع
  مفاضة أى واسعة واهر أقعفاضة اذا كانت ضخمة البطن وفاض الماء يفبض فيضا
  وفيضوضة أى كثرحق سلل على ضفة الوادى وأرض ذات فيوض اذا كانت فيهامياه
  نفيض وفاض صدره بالسر أى باح به وفاض الامام ك ثروا وفاض الرجل يفيض قيضا
  وفيوضامات وكذلت فاضت نفسه أى خرجت روحه عن أبي عبيدة والفرّاء قالا وهى لغة
  فى تميم وأبوزيد منله وقال الاصعى لا يقال فاض الرجل ولا فاضت نفسه وانما يفيض الدمع
  والماء ويقال أفاض اناءه أى صلا محق فاض وأفاض دموعه وأفاضت دموعه
  وأفاض الماهعلى نفسه أى أفرغه وأفاض الناس من حرفات الى منى أى دفعوا وكل
  دفعة افاضة وأفاضوا فى الحديث أى أندفعوافيه وأفاض البعيرأى دفع جرّته من كرشه
  فاخرجها ومنه قول الشاعر وأفضن بعد كظومهن بجزة •من ذى الابارق اذرعين حفيلا
  وأفاض بالقداح أى ضرب بها قال ابو ذؤ يب يصف حارا وأتنه
  فكأ حن ربابة وكانه * يسريفيض على القداح ويصدع
  يعى بالقداح وحروف الجر يوب بعضها مناب بعض والفيض نيسل مصرقال الاصمعى ونمر
  البصرة يسمى الفيض أيضاونهر فياض أى كفير الماء ورجل فياض أى وهاب جواد وفرس
  فيض أى كثير الجرى وقواهم أعطاه غيضامن فيض أى أعطاه قليلا من كثير
  ⁦( صل القاف )⁩ بض) قبضت الذى قبضا أخذته والقبض خلاف البسط ويقال
  صار الشى فى قبضتك وفى قبضتك أى فى ملسكنْ ودخل مال فلان فى القبض بالتحريك وهو
  ما قبض من أموال الناس والانقباض خلاف الانبساط وانقبض الشئ صارمبوضا
  والقبضة بالضم ما قبضت عليه من شى بقال أعطاه قبضة من سوبق أوتمرأى كفا منه
  وربعماباء بالفتح والمقبض يفتح الميم وكسر الباه من القوس والسيق حيث يقبض عليه بجمع
  الكف وأقبضت السيف والسكين أى جعلت له مقبضا ويقال رجل قبضة رفضة للذى
  تمدك
