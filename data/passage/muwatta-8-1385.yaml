label: { ar: "الموطأ 1385 — عائشة: سئلت عن رجل قال مالي في رتاج الكعبة، فقالت يكفره ما يكفر اليمين", en: "Muwatta 1385", es: "Muwatta 1385", fr: "Muwatta 1385", ur: "موطا 1385", tr: "Al-Muwatta 1385 — Aişe: Bana, “Param Kâbe’nin kilidinde” diyen bir adam hakkında soru soruldu. Aişe, “Onun günahı, yeminin kefaretiyle kefaret edilmiş olur” dedi.", id: "Al-Muwatta 1385 — Aisyah: Aku ditanya tentang seorang pria yang berkata, “Uangku ada di dalam kunci Ka'bah,” dan dia berkata, “Dia telah diampuni dengan apa yang mengampuni sumpah.”" }
summary:
  ar: "يروي مالك عن أيوب بن موسى عن منصور بن عبد الرحمن الحجبي عن أمه عن عائشة أنها سئلت عن رجل قال مالي في رتاج الكعبة، فقالت يكفره ما يكفر اليمين. {cite:muwatta-maruf-1997 p.617}"
  tr: "Malik, Eyyub ibn Musa'dan, o da Mansur ibn Abdülrahman el-Hacebi'den, o da annesinden, o da Ayşe'den rivayet eder ki, kendisine \"Param Kâbe'nin kilidinde\" diyen bir adam sorulmuş ve o da \"Onun günahı, yeminin kefaretiyle kefaret edilir\" demiştir. {cite:muwatta-maruf-1997 s.617}"
  id: "Malik meriwayatkan dari Ayyub bin Musa, dari Mansur bin Abd al-Rahman al-Hajabi, dari ibunya, dari Aisyah, bahwa ia ditanya tentang seorang pria yang berkata, \"Uangku ada di kunci Ka'bah,\" dan ia menjawab, \"Ia telah diampuni dengan apa yang mengampuni sumpah.\" {cite:muwatta-maruf-1997 p.617}"
