text: |-
  ٢٣
  مددته ⁦(مرأ)⁩ مرؤالطعام يرؤمراءة صارمى يثار كذلك مرئ الطعام قال الاخفس
  هو كماتقول فقه وفقه يكسرون القاف ويضمونها قال ومر أنى الطعام يمرأمراء قال وقال
  بعضهم امر أنى الطعام وقال الفراء يقال هنأنى الطعام ومى أنى اذا أتبعوها هنأنى قالوها
  بغير ألف واذا أفردوها قالوا أمر أنى وهو طعام عمرئ ومرتت الطعام استمرأته والمروءة
  الانسائية ولك أن تشدّد قال أبوزيد هر والرجل صار ذامروءة فهو مرىء على فعيل وتمرأ
  نكاف المروءة ابن السكيت فلان يتمر أبنسا أى يطلب المروءة بنقصنا وعيينا قال وتقول هو
  مرىء الجزور والشاة للمتصل بالحلة وم الذى يجرى فيه الطعام والشراب والجمع مر ومثل
  سر يروسر ووالمرالرجل يقال هذاهى ءصالح ومررت بمرصالح ورأيت مر«اصالحا
  وضم الميم لغة وهمامر آن صالحان ولا يجمع على لفظه وبعضهم يقول ه_ذه هرأة صالحة
  ومرة ايضابترك الهمزة ويتحريك الراءبجركتها فان جئت بألف الوصل كان فيه ثلاث لغات
  فتح الراء على كل حال -كاها الفراء وضمها على كل حال واعرابها على كل حال تقول هذا امرأ
  ورأيت امر أو مروت باحر إوتول هذا امر ؤورأيت احر وًا وحررت بامر ؤوتول حذا
  امر ؤورأيت امر أوحررت بامرئ معر بامن مكانين ولا جمع له من لفظه وهذه امرأة
  مفتوحسة الراء على كل حال فان صغرت أسقطت ألف الوصل فقلت مرىء ومريثة وربما
  سموا الذئب امر أوذ كريونس أتّ قول الشاءر
  وأنت امر وتعدوعلى كل غرّة ,، فتخطى فيها مرّة وتصدب
  يعنى به الذقب وقالت أمر أة من العرب أنا امر ؤلا أخبر السرّ والنسبة الى امرئ مرتىّ
  بفتح الراء ومنه المرئىّ الشاعر وكذلك النسبة الى امرئ القيسر ان شئت اهرتى
  أ أبوزيد مسا الرجل مأمجن والماسئ الماجن ( لأ المل بالفتح مصدر
  ملات الاناء فهو مملوء ودلوملاى على فعلى وكوزملان والعامّة تقولملأماء والملء
  بالكسراسم ما ياخذه الاناءاذا امنسلأ ويقال أعطنى ملأه وملايه وثلثة أملائه وامتلا
  الشئ وتملاً بعنى بقال تلات من الطعام والشراب وتملا فلان غيظا وأملات النزع
  فى القوس اذا شددت النزع فيها والملاة بالضم مثال المتعة الزكام وعلى الرحسل وأملاهالله
  أى أزكه فه ومملو على غير قياس يحمل على علئ وملؤ الرجل صارمليئا أى ثقة فهو غنى ملئ
  بين الملاء والملاءة مدودان والملاءة بالضم ممدود الربطة والجمع ملاء أبوزيد مالأنه على الامر
  ممالاة ساعد ته عليه وشابعته ابن السكيت تمالوًا على الامراحعواعليه والملا الجماعة
  وقول الشاعر
  وتحدّثواملا لتصبح أمّنا * عذرا لاكهل ولا مولود
  أى تشاوروامتمالثين على ذلك ليقتلونا أجمعين قتصبح أمنا كأنها لم تلدوفى الح_ديث واللّه
  ماقتلت عثمان ولا مالأت على قتله والملا أيضا اتلحلق يقال ما أحسن ملأبنى فلان أى
  عشرتهم واخلاقهم قال الشاعر
  تناود وايال بهئة اذر أونا • فقلنا أحسف ملا جهينا
  والج-ع املاء وفى الحديث أنه قال لاصحابه حين ضربوا الاعراتي أحسنوا أملاكم
  نأ أبوزيذ المنيئة الجلد أوّل ما يدبغ ثم هو أفيق ثم أديم تقول منه منأت الاهاب منأ
  فى بعض نسخ زيادة ومس •الطريق
  أيضا نفسها يقال ركب مس*
  الطريق اذامشى فى وسطها اه
