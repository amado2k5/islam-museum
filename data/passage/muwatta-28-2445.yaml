  tr: "Yahya şöyle dedi: Malik şöyle dedi: Sünnetimize göre, sarhoş edici bir içki içen kimse, sarhoş olup olmamasına bakılmaksızın, öngörülen cezaya tabidir. {cite:muwatta-maruf-1997 s.410}"
  id: "Yahya berkata: Malik berkata: Menurut Sunnah kami, siapa pun yang meminum minuman keras, baik ia mabuk atau tidak, akan dikenai hukuman yang telah ditetapkan. {cite:muwatta-maruf-1997 p.410}"
