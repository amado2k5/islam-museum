label: { ar: "سنن ابن ماجه 4239 — ضحك وتبسم", en: "Sunan Ibn Majah 4239 — laughter and smiling", ur: "سنن ابن ماجہ 4239 — ہنسی اور تبسم", fr: "Sunan Ibn Majah 4239 — rire et sourire", es: "Sunan Ibn Majah 4239 — risa y sonrisa", tr: "Sünen İbni Mace 4239 — Kahkaha ve Gülümseme", id: "Sunan Ibnu Majah 4239 — Tertawa dan Tersenyum" }
text: "… الْجُرَيْرِيِّ، عَنْ أَبِي عُثْمَانَ، عَنْ حَنْظَلَةَ الْكَاتِبِ التَّمِيمِيِّ الأُسَيِّدِيِّ، قَالَ : كُنَّا عِنْدَ رَسُولِ اللَّهِ ـ فَذَكَرْنَا الْجَنَّةَ وَالنَّارَ حَتَّى كَأَنَّا رَأْىَ الْعَيْنِ فَقُمْتُ إِلَى أَهْلِي وَوَلَدِي فَضَحِكْتُ وَلَعِبْتُ. قَالَ : فَذَكَرْتُ الَّذِي كُنَّا فِيهِ فَخَرَجْتُ فَلَقِيتُ أَبَا بَكْرٍ فَقُلْتُ : نَافَقْتُ، نَافَقْتُ. فَقَالَ أَبُو بَكْرٍ : إِنَّا لَنَفْعَلُهُ. فَذَهَبَ حَنْظَلَةُ فَذَكَرَهُ لِلنَّبِيِّ ـ فَقَالَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4239، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Ibn Majah, no. 4239, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4239، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Ibn Majah, n° 4239, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Ibn Majah, n.º 4239, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "İbn Majah'ın Sünen'inde yer alan 4239 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslam Halk Bilimi Tarayıcısı tarafından Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 4239, berisi tentang tawa dan senyuman. Hadits ini dikompilasi oleh Juha dan Islamic Folklore Browser, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
