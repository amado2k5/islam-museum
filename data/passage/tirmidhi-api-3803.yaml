label: { ar: "جامع الترمذي 3803 — الأب والأبوة", en: "Jami' al-Tirmidhi 3803 — the father and fatherhood", ur: "جامع ترمذی 3803 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3803 — El padre y la paternidad" }
text: "… الْمَغْمُودَ عَنْكُمْ فَلاَ يُغْمَدُ عَنْكُمْ إِلَى يَوْمِ الْقِيَامَةِ. قَالُوا اقْتُلُوا الْيَهُودِيَّ وَاقْتُلُوا عُثْمَانَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ إِنَّمَا نَعْرِفُهُ مِنْ حَدِيثِ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ. وَقَدْ رَوَى شُعَيْبُ بْنُ صَفْوَانَ هَذَا الْحَدِيثَ عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ فَقَالَ عَنْ عُمَرَ بْنِ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ بْنِ سَلاَمٍ عَنْ جَدِّهِ عَبْدِ اللَّهِ بْنِ سَلاَمٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3803، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3803 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3803، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3803 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
