text: "… اللّٰه وحده فلم نشرك به شيئاً، وحَرَّمْنا ما حرّم عَلينا، وأحللنا ما أَحَلَّ لَنا، فَعَدَا علينا قومُنَا فعذَّبونا وفَتَنُونا عَنْ دِينِنَا؛ ليردُّونا إِلَى عِبَادَةٍ الأوثان مِنْ عِبَادَةِ الله - تعالى -، وَأَنْ نَسْتَجِلَّ ما كنا نَسْتَحِلُ مِنَ الخبائِث، فلمَا قَهَرونا …"
