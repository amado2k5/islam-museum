  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 3190, that mentions what was made lawful, what is not lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 3190 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
