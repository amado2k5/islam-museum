text: "… فأمره أَن يفارقها ثم يتزوَّج أُمها، فتزوجها، وولدت له أَولادًا، ثم أَتى ابن مسعود المدينة، فسأل عن ذلك، فأُخبر أَنه لا تحلُّ له، فلما رجع إلى الكوفة قال للرجل : إنها عليك حرام، إنها لا تنبغي لك، ففارقها !. سورة …"
summary:
