text: "… بن عدي، حدثنا عبدالله بن سليمان بن الأشعث، حدثنا أبو الربيع سليمان بن داود قالا : حدثنا ابن وهب، حدثني أبو صخر، عن أبي حازم، عن أبي صالح، عن أبي هريرة قال: قال رسول الله وَلِلِل المؤمن يألف، ولا خير …"
summary:
