  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 441. sayfasından, mümini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, iman dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 441, yang menjelaskan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
