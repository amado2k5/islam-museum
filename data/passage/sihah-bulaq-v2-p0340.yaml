  ( (]كل€⅜(œ( الذكل بالكسر القيد والنكل أيضاحديدة اللمحام وقال أبو عبيد النكل لجام البريد
  ورجل تكل وذكل مثل شبه وشبه كانه يشكل به أعداؤه ورماه اللّٰه بنكله أى بمما ينكاه ويقال
  نكل به تنكيلااذا جعله فسكالا وعبرة لغيره والمذكل الذى شكل بالانسان وقال
  وارم على أقفائهم بالمذكل * ونسكل عن العد ووعن اليمين يشكل بالضم أى جبن والناكل
  لجبان الضعيف وقال أبو ببيدة ذكل بالكسرلغة فيه وأنكره الاصمعى وفى الجديث ان الله
  يوبّ النكل على النكل بالتحريك يعف الرجل القوىّ الجرّب عسلى الفرس القوى الجرب
  ⁦(نمل )⁩ المل معروف الواحدة غلة وأرض غلة ذات غل وطعام مخول اذا أصابه النمسل
  والهل يثور صغار مع ورم يسير ثم تتقرح فتسعى وتتسع ويسميها الاطباء الذياب وتقول الجوس
  ان ولد الرجل اذا كان من أخقه تم خط على المله شفى صاحبها وقال
  ولا عيب فينا غيرع رق لمعشر • كرام وأنالانخط على النخمل
  والتملة أيضاعيب من عيوب الخيل وهوشق فى الحافر من الاشعر الى المقط وفرس غل القواتم
  اذا كان لا يستقروفرس ذوغلة بالضم أى كنير الحركة والملة بالضم أيضا الخيمة ورجل غل أى
  غام عن أبى عرووكذلك الاغال وقد أغل قال الكميت
  ولا أزعيج الكلم المحفظات للاقربين ولا أغل
  والاغلة بالفتح واحدة الانامل وهى دؤس الاصابع ⁦(نول)⁩ أبوعر والمنوال الجشب
  الذى يلفّ عليه الحائك الثوب وهو النول أيضاوجعه أنوال ويقال للقوم اذا استوت
  أخلاقهم هم على منوال واحد ورمواءلى منوال واحد أى على رشق واحد ويقال
  لا أدرى على أىّ منوال هوأى على أى" وجمهو وقولهسم نولك أن تفعل كذا أى سقك
  وينبقى لك وأصله من التناول كأنك قلت تناولك صكذا وكذا قال العياج
  هاجت ومثلى نوله أن يربها • حامهاجت ها مامهما
  أى حقه أن يكف وما نولك أن تفعل كذا أى ما ينبغى لك والنوال العطاء والنائل مثله
  يقال نات له بالعطية أنول نولا ونلته العطية ونوّلته أعطيته نوالا قال وضاح اليمن
  فاتوات حتى نضرعت عندها • وأنبأتها مارخص اللّه فى اللمم
  يعنى التقبيل ابن السكيت رجل نال كثير النوال ورجلان نالان وقوم أنوال وناولته الشئ
  قتناوله وقول لبيد (١ جزءت وليس ذلك بالنوال • أى بالصواب ⁦(نهل)⁩ المنهل
  المورد وهوعين ماء ترده الابل فى المراعى وتسحى المنازل التى فى المفاوزعلى طرق السفار
  مناهل لان فيهاماه والناهلة المختلفة الى المنه-ل وقال
  تم تراقب هناك ناهلة الواشين لما اجرهد ناهلها
  أبوزيد الناهل العطشان والناهل الريان وهو من الاضداد وقال الشاعر
  الطاعن الطعنة يوم الوغى • ينجل منها الاسل الناهل
  قال أبو عبيد هو ههنا الشارب وان شئت العطشان وجمع الناهسل نهل مشل طالب وطلب
  وجمع النهل نهال مثل جبل وجبال قال الراجز
  انك ان تتأنى النهالا • بمثل أن تدارك السجالا
  وقفت بهنّ حتى قال صحي
