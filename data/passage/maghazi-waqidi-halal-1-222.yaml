text: "… أَقصى رزقها، لا يُنقَص منه شءٌ وإن أَبطاً عنها.. فاتَّقوا اللّٰه ربَّكم وأجمِلوا فى طلب الرزق، ولا يحملنَّكم استبطاؤه أَن تطلبوه بمعصية ربّكم، فإنه لا يُقدَر على ما عنده إِلَّا بطاعته. قد بيّن لكم الحلال والحرام، غير أَنَّ بينهما شُبَهاً …"
