text: |-
  قوله والفرق أى بالتحريناه
  ٥٦٢
  قسوطاقال اللّٰه تعالى وأما القاسطون فكانوالحهم حظبا والقسط بالكسر العدل تقول
  منه أقط الرجل فهومسط ومنه قوله تعالى ان اللّه يحب المقسطين والقسط أيضامكيال
  وه ونصف صاع والفرق ستة أقساط والقسط الحصة والنصيب يقال تقسطنا الشئ يدنما
  والقسط بالضم من عقا قيرالبحروا لقسط بالتحريك انتصاب فى رج-لى الدابة وذلك عيب لانه
  يستحب فيهما الانحفاء والتوتير يقال فرس أقسط بين القسط والاقسط من الابل هو الذى
  فى عصب قوائه يبس خلقة وقد سط قسطا والناقة قسطاء وقاسط أبوحى وهو قاسط بن هنب
  ابن أفصى بن دعمى بن جديلة بن أسدين ربيعة وقول الراجز
  تبدى نقيازانها خارها • وقسطة ماشانها غفارها
  يقال هى الساق نقلته من كتاب ⁦(قطط)⁩ قططت الشى أقطه اذاقطعته عرضا ومنهقط
  القلم والمقطة ما يقط علمه القلم والقطاط الخراط الذى يعمل الحقق قال الخليل القط فصل
  الشى عرضا وفى الحديث كان على" رضى اللّٰه عنه اذا اعتلى قدّواذا اعترض قط وقط معناها
  الزمان يقال مارأيته قط قال المكسائى كانت قطط فلماسكن الحرف الشانى للادغام جعل
  الآخر متحر كا الى اعرابه ومنهسم من يقول قط يتبع الضمة الضمة منل مدياهذا ومنهم من
  يقول قط مخففة يجع لهاداة ثم يبنيه على أصله ويضم آخره بالضمة التى فى المشددة ومنهسم من
  يتبع الضمة الضيمة فى الخففة أيضاو يقول قط كقولهم لم أرهم ذيومان وهى قليلة هذااذا
  كانت بمعنى الدهر فاما اذا كانت بمعنى حسب وهو الا كتفا فهى مفتوحة ساكنة
  الطاءتقول مارأيته اامرة واحدة فق اا أف قل قك ذا الشئ أى سسبك
  وقطى وقطى وقط قال الراجز
  امتلأ الحوض وقال قطى • مهلارويداقدملات بطى
  واتماد خلت النون ليسلم السكون الذى بنى الاسم عليه وهذه الذون لا تدخل الاسماء وائما
  تدخل الفعل الماضى اذادخلتهيا المتكلم كولك ضرف وكلنى لتسلم القتصة لتى بن الفعل
  مليها واسكون وقاية للفعل من الجرّوانما أدخلوها فى أسماء مخصوصة فح وقطنى وقدنى وعنى
  ومنى وادنى لايقساس عليها فلو كانت النون من أصل الكلمة لقالواقطنك وهذا غير معاوم
  ويقال قطاط مثل قطام آى حسى قال عمروبن معدى كرب
  أطلت فراطهم-تى اذاما • قتلت سراتهم كانت قطاط
  وقط السعريقط بالكسرقطا أى غلاو يقال وردنا أرضا قاطاسعرها قال أبووجرة
  أشكوالى اللّه العزيز الغفار * ثم اليك اليوم بعد المستار * وحاجة الحى وقط الاسعار
  وجعد قطط أى شديد الجعودة وقد قطط شعره بالكسر وهوأحد ماجاء على الاصل باظهار
  التضعيف ورجل قط الشعر وقطط الشعر بمعنى والقط الضيون والجع قطاط قال الاخطل
  أكات القطاط فأفتيتها * فهل فى انلخنانيص من مغمز
  والقطة السنورة والقط الكتاب والصك بالحائرة قال الاعشى
  ولا االك النعمان يوم لقيته * بغبطته يعطى القطوط ويأفق
  ومنه قوة تعالى عجل لنافطنا قبل يوم الحساب قال أبوزيد القطقط بالكسر أصغر المطر
  يقال
