text: "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ الْبَصْرِيُّ، حَدَّثَنَا بِشْرُ بْنُ الْمُفَضَّلِ، حَدَّثَنَا خَالِدُ بْنُ ذَكْوَانَ، عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذٍ، قَالَتْ جَاءَ رَسُولُ اللَّهِ فَدَخَلَ عَلَىَّ غَدَاةَ بُنِيَ بِي فَجَلَسَ عَلَى فِرَاشِي كَمَجْلِسِكَ مِنِّي وَجُوَيْرِيَاتٌ لَنَا يَضْرِبْنَ بِدُفُوفِهِنَّ وَيَنْدُبْنَ مَنْ قُتِلَ مِنْ آبَائِي يَوْمَ بَدْرٍ إِلَى أَنْ قَالَتْ إِحْدَاهُنَّ وَفِينَا نَبِيٌّ يَعْلَمُ مَا فِي غَدٍ. فَقَالَ لَهَا رَسُولُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1090، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1090 (The Book on Marriage), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "جامع الترمذی۔ کی حدیث نمبر 1090، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Jami' al-Tirmidhi, n° 1090, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Jami' al-Tirmidhi, n.º 1090, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Cami' el-Tirmizi'nin 1090 numaralı hadisinde, ölüler için ağlamak ve bunun sınırları ele alınmaktadır. Bu derleme, ağıt ve yakarışla ilgili en meşhur sözleri, Kur'an'dan, Sünnet'ten, Peygamberimizin hayatından, Sahabeler ve onların haleflerinden rivayetlerden ve diğer ilgili kitaplardan metinlerle birlikte içermektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1090, membahas tentang menangis atau meratap atas orang yang meninggal dan batas-batasnya. Kompilasi ini mencakup ucapan-ucapan paling terkenal tentang elegi dan ratapan, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, kisah-kisah dari para Sahabat dan Penerus mereka, dan buku-buku relevan lainnya."
