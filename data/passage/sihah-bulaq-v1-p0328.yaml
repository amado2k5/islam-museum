text: |-
  ⁦(فصل التتجا-)⁩
  ٣١٢
  داوبه اظهرك من وجاعه • من خزرات فيه وانقطاعه
  والحزير والخزيرة أن تنصب القدر بلحم يقطع صغارا على ساء كثير فاذانضج ذرت عليه الدقيق
  وان لم يكن فيها لحم فهى عصيدة قال جرير
  وضع الخزير فقيل أين مجاشع • فشهاججافله جراف هبلع
  والختزير واحد الخنازير والحناذير أيضاعلة معروفة وهى روح صلبة تح_دث فى الرقبة
  وانخنز رالذى فى شعرابيداسم موضع والخيزران شجر وهوعروق القناة والمع الخياند
  والخيزران القصب قال الكمين يصف سيهابا
  كأن المطافيل المواليه وسطه * يجاوبهن الخيزران المنقب
  والخيزراتة السكان قال النسابفة يصف الفرات وقت مدّه
  يظل من خوفه الملاح معتصها • بانلخيزرانة بعد الاين والنهذ
  وانليزرى والخونرى مشية فيها تفكان قال أبو الصهباين المختار العقيلى
  والناشئات الماشيات الحوذرى ( سر خسر فى البيع خسراوخسرانا وهو
  شل الفرق والفرقان وخسرت الشئ بالفتح وأخسرته نقصته وقوله تعالى هل تنبشكم
  بالاخسرين أعمالاقال الاخفس واحدهم الاخسر مشل الاكبر والتفسير الاهلاك
  وانخناسير الهلال لاواحذله قال كعب بن زهير
  اذا مانتهنا أربماعام كفأة • بغاها ختاسيرانأهلك أربعا
  رقى بغاها ضمير من الجدهو الفاعل يقول انه شقى الجداذا تيجت أربع من ابله أربعة أولاد
  لكت من ابله الكبار أر بع غيرهذه فيكون ماهلك أكثرمما أصاب والحار والحسارة
  والخيسرى الضلال والهلال (خضر الخشارة ماييقى على المائدة ممالاخيرفيه
  وك ذلك الردى ممن كل شي أبوزيدية ال خشرت الشئ أخشره خشرا اذا نفيت منه
  خشارتهِ وفلان من الحشارة اذا كان دوناقاك الحطئة
  وباع بنيه بعضهم بخشارة • وبعت لذبيان العلامبمالكا
  يقول استريت اة ومك الشرف بأموالك ( خصر ، الخصروسط الانسان وكشع
  مخصر أى دقيق ونعسل مخصرة ورجل مخصر القدمين اذا كانت قدمه تمس الارض من
  مقدمها وعقبها ويخوى أخسها مع رقة فيه والخاصرة الشاكلة والخصر بالتحريك البردوقد
  خصر الرجل اذا آله البرد فى أطرافه يقال خصرت يدى وخصر يومنا أشتذبرده وماءخضر
  بارد قال الشاعر
  وب خال لى لوأبصرته • سبط المشبة فى اليوم الخصر
  والختصر الاصبع الصغرى والجمع الخناصر وخناصرة بضم انخاء بلد بالشام والخصرة
  كالسوظ وكل ما اختضر الانسان بيده فأمسكه من عصاونحوها قال الشاءر
  يكاديزيل الارض رفع خظاتهم • اذا وصلوا أيمانهم بالمخاصر
  وخاصر الرجل صاحبه اذا أغذييد. فى المشى قال عبد الرمن بن حان
  ثم خاصرتما الى القبة انغضرا وتمشى فى مى مى مسنون
