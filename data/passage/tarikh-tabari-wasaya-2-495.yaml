text: "… فاخرج اله من الحلى عِجْلًا جَسَدًا لَهُ خُرَارٌ وعدت بنو أسرائيل موعد موسى فعدّوا الليلة يومّا واليومّ يوما فلمًا كان العشرين خرج لهم العجل فلما راوه قال لهم السامرق هدَا الْهُكُمْ وَالدُ مُوسَى قَنَسِى يقول ترك موسى الهَم ههنا ونعب …"
summary:
