label:
  ar: "مسلم 222 — يا آدم أخرج بعث النار"
  en: "Muslim 222 — Adam, bring out the party of the Fire"
  ur: "مسلم 222 — اے آدم، آگ والوں کا حصہ نکالو"
text: "يقول الله عز وجل يا آدم فيقول لبيك وسعديك والخير في يديك - قال - يقول أخرج بعث النار . قال وما بعث النار قال من كل ألف تسعمائة وتسعة وتسعين . قال فذاك حين يشيب الصغير وتضع كل ذات …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 222: يا آدم أخرج بعث النار. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 222: Adam, bring out the party of the Fire. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 222: اے آدم، آگ والوں کا حصہ نکالو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
