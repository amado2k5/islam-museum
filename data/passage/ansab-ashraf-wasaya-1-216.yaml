text: "بلال بن رباح - حدثني أحمد بن إبراهيم الدورقي، ثنا وكيع، ثنا سفيان، ثنا عون بن أبي جحيفة، عن أبيه قال : أتيت النبي ولي بالأبطح، وهو في قبرة حمراء، فخرج بلال بفضل وضوئه، ثم أذن بلال، فكنتُ أتتبع فاه …"
