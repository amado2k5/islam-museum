text: "… رأس خروف أم جمجمة؟ أعطاهُ أبوهُ درهماً ليشتري به رأس خروف. فمضى وأشترى الرأس وأكل ما عليه من اللحم جميعاً، وجاء إلى أبيه بجمجمة فارغة، وقدَّمَها بين يديه، فقال له أبوه : يا خبيثُ ما هذا؟ فقال: رأسُ غنم. قال …"
summary:
  ar: "أعطى أب جحا ابنه درهماً ليشتري رأس خروف، فأكل اللحم وجاء بجمجمة فارغة، فسأله أبوه أين أذناه وعيناه ولسانه وجلده، فأجاب جحا إنه كان أصم وأعمى وأبكم وأصلع. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  en: "Juha's father gives him a dirham to buy a sheep's head; Juha eats the meat and brings back an empty skull; the father asks where its ears, eyes, tongue and skin are; Juha answers that it was deaf, blind, mute and bald. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  ur: "جحا کے باپ نے اسے بھیڑ کا سر خریدنے کے لیے ایک درہم دیا، جحا نے گوشت کھا لیا اور خالی کھوپڑی لے آیا، باپ نے پوچھا کہ اس کے کان، آنکھیں، زبان اور کھال کہاں ہیں، تو جحا نے جواب دیا کہ وہ بہرا، اندھا، گونگا اور گنجا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  fr: "Le père de Juha lui donne un dirham pour acheter une tête de mouton ; Juha mange la viande et rapporte un crâne vide ; le père demande où sont ses oreilles, ses yeux, sa langue et sa peau ; Juha répond qu'elle était sourde, aveugle, muette et chauve. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
  es: "El padre de Juha le da un dírham para comprar una cabeza de cordero; Juha se come la carne y trae una calavera vacía; el padre pregunta dónde están sus orejas, sus ojos, su lengua y su piel; Juha responde que era sorda, ciega, muda y calva. {cite:juha-nawadir-kubra-djuwaydi p. 185}"
