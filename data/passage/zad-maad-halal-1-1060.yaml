text: "… الخامِسُ: وهو أن الأصل في العقود وجوبُ الوفاء إلا ما حرَّمه اللّهُ ورسولُه، فإن المسلمين على شروطهم إلَّا شرطاً أحلَّ حراماً، ا حرَّم حلالاً، فلا يحرُم مِن الشروط والعقود إلّا ما حرَّمه اللّهُ ورسولُه، وليس مع المانعين نصِّ بالتحريم البتة، …"
