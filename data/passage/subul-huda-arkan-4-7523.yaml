text: "… كمحبَّةِ الوَالِدِ، ومَحَبَّةُ رَحْمَةٍ وشَفَقَةٍ كمحبةِ الوَلَدِ، ومَحَبَةُ اسْتِحْسَانٍ ومُشَاكَلَةٍ كمحبّةِ سَائِرِ النَّاسَ، فَحَصَر عَ أصْنَافَ. المحبَّةِ فى هَذا اللَّفْظِ، وَمَعْنَى الحديثِ والله تعالَى أعلم : أَنَّ اسْتِكْمَالَ الإِيمَانِ عُلم أنَّ فَضْلَ رَسُول اللهِ علَيَ وَفَضْلُهُ أكْبَر مِنْ جَقُّ ايْنِهِ، …"
