text: "الفرق بين العبد الرسول وبين الملك الرسول.... هل تقبل الجزية من غير اليهود والنصارى والمجوس وهل تقبل من العرب؟ الحجة على من استمسك بحديث: الأيم أحق بنفسها من وليها ما يعدل البعير من الغنم والبقر هل السلب من الخمس.. حكم …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 749، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 749, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 749 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
