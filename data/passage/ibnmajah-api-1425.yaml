label: { ar: "سنن ابن ماجه 1425 — الحساب", en: "Sunan Ibn Majah 1425 — the reckoning", ur: "سنن ابن ماجہ 1425 — حساب" }
text: "… حَكِيمٍ الضَّبِّيِّ، قَالَ قَالَ لِي أَبُو هُرَيْرَةَ إِذَا أَتَيْتَ أَهْلَ مِصْرِكَ فَأَخْبِرْهُمْ أَنِّي، سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" إِنَّ أَوَّلَ مَا يُحَاسَبُ بِهِ الْعَبْدُ الْمُسْلِمُ يَوْمَ الْقِيَامَةِ، الصَّلاَةُ الْمَكْتُوبَةُ فَإِنْ أَتَمَّهَا، وَإِلاَّ قِيلَ: انْظُرُوا هَلْ لَهُ مِنْ تَطَوُّعٍ؟ فَإِنْ كَانَ لَهُ تَطَوُّعٌ أُكْمِلَتِ الْفَرِيضَةُ مِنْ تَطَوُّعِهِ. ثُمَّ يُفْعَلُ بِسَائِرِ الأَعْمَالِ الْمَفْرُوضَةِ مِثْلُ ذَلِكَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1425، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1425 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1425، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
