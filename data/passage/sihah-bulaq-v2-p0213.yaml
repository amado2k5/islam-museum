text: |-
  ٢٧٤
  •⁦(دين)⁩*
  وقوم مدهنون بتشديد الهاء عليهم آنار النحم والمدهن بالضم لاغير قارورة الدهن وهو أحدما
  جاعلى مفعل مما يستعمل من الادوات وتمدهن الرجل اذا أخذمدهنا والجع مداهن
  والمدهن نقرة فى الجبل يستنقع فيها الماء ومنه حد ين الزهرى نشف المدهن ويبس
  الجعثن قال أوس نقلب قيدودا كأن سراتها • صفامدهن قدزلقته الزحالف
  والمداهنة كالممائعة والادهان منل قال اللّهتعالى ودّ والوتدهن فيدهذون وقال قوم
  داهذت بمعى واريت وأدهنت بمعنى غششت وناقة دهين قليلة اللبن قال
  اسانك مبرد لاعيب فيه • ودرتك در جاذية دهين
  وقدد هنت الناقة تدهن دهائة عن أبي زيد والدهنا موضع بيلاد تيم عدوية صر وينسب
  اليسه دهنا وى والدهناء بنت مسحل أحدبنى مالك بن سعدين زيد مناة بن تميم وهى امرأة
  العجاج وكان قد عنن عنها فقال فيها
  أظنت الدهنا وظنّ مسصل • أنّ الامير بالقضاء يعجل
  عن كسلاتى والحصان يكسل • عن السفادوه وطرف هيكل
  هقن لدهقات معترب ان جعلت الذون أصلية من قولهم تدهقن الرحل وله دهقنة
  موضع كذاسرفته لانه فعلال وان جعلته من الدهق لم تصرفه لانه فعلان ⁦(دهدن )⁩
  الدهدن بالضم معناء الباطل قال الراجز
  لاجعلن لابنة عثم فنا • حتى يكون مهر هادهدنا
  قولهد هدرّين وسعد الين
  وربعنا قالواد هدرتارا، وفى المغل دحدرين وسعد القين يضرب لل-كذاب ⁦(دين)⁩ أبو
  وغاب النع فاة ميرا و
  عييسد الدين واحسد الديون تقول دنت الرحل أقرضته فهومدين ومديون ودان فلان يدين
  دينالستقرض وصار عليه دين فهودائن وأنشد الاجر
  بالوا وأيضا والدى فى القاموس
  ندين ويقضى اللّٰه عنا وقد نرى مصارع قوم لايدينون ضيعا
  والكشاف بفيرواو اهv
  ورجل مديون كثر ما عليه من الدين وقال *مستأرب عضه السلطان مديون • ومديات
  اذا كان عادته أن يأخذ يالدين ويستقرض وأدان فلان ادانة اذا ياغ من القوم الى أجسل
  فصار له عليهم دين تقول منه أدنى عشرة دراهم قال أبو ذؤيب
  أدان وأنيأه الاولون • بأنّ المدان على موفى
  وادّان استقرض وهو افتعل وفى الهديث ادّان معرضا أى استدان وهو الذى يعترض
  الناس فيستدين ممن أمكنه وتداينواتيا يعوا بالدين واستدانوا استقرضوا وداينت فلانا
  اذا عاملته فأعطيت دينا وأخرذت بدين وتداينا كما تقول قاتلته وتقاتلنا وبعته بدينة أى
  بتأخير والدين بالسكسر العادة والشأن تقال
  تقول اذادرات لها وضيق • أهذادبنه أبداودين
  ودانه ديذا أى أذله واستعبده يقال دنته فدان وفى الحديث المكيس من دان نفسه وعمل
  لما بعد الموت قال الاعشى
  هودان الرباب اذكرهوا الدين دراكابة-زوة وارتحال
  ثم دانت بعد الرباب وكانت ل،: كعذاب عقوية الاقوال
  مال
