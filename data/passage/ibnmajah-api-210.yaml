label: { ar: "سنن ابن ماجه 210 — عمل يعدل عملا أعظم منه", en: "Sunan Ibn Majah 210 — a deed that equals a greater one", ur: "سنن ابن ماجہ 210 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan Ibn Majah 210 — una acción que equivale a una mayor", fr: "Sunan Ibn Majah 210 — une action qui en vaut une plus grande", tr: "Sunan İbn Majah 210 — Daha büyük bir amele denk bir amel", id: "Sunan Ibn Majah 210 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" مَنْ أَحْيَا سُنَّةً مِنْ سُنَّتِي قَدْ أُمِيتَتْ بَعْدِي فَإِنَّ لَهُ مِنَ الأَجْرِ مِثْلَ أَجْرِ مَنْ عَمِلَ بِهَا مِنَ النَّاسِ لاَ يَنْقُصُ مِنْ أُجُورِ النَّاسِ شَيْئًا وَمَنِ ابْتَدَعَ بِدْعَةً لاَ يَرْضَاهَا اللَّهُ وَرَسُولُهُ فَإِنَّ عَلَيْهِ مِثْلَ إِثْمِ مَنْ عَمِلَ بِهَا مِنَ النَّاسِ لاَ يَنْقُصُ مِنْ آثَامِ النَّاسِ شَيْئًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 210، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 210 (The Book of the Sunnah), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 210، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 210 (El Libro de la Sunnah), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 210 (Le Livre de la Sunna), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 210 numaralı hadiste, daha büyük bir ameli sayan bir amelden bahsedilir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 210, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
