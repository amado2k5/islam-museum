label: { ar: "سنن ابن ماجه 210 — عمل يعدل عملا أعظم منه", en: "Sunan Ibn Majah 210 — a deed that equals a greater one", ur: "سنن ابن ماجہ 210 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" مَنْ أَحْيَا سُنَّةً مِنْ سُنَّتِي قَدْ أُمِيتَتْ بَعْدِي فَإِنَّ لَهُ مِنَ الأَجْرِ مِثْلَ أَجْرِ مَنْ عَمِلَ بِهَا مِنَ النَّاسِ لاَ يَنْقُصُ مِنْ أُجُورِ النَّاسِ شَيْئًا وَمَنِ ابْتَدَعَ بِدْعَةً لاَ يَرْضَاهَا اللَّهُ وَرَسُولُهُ فَإِنَّ عَلَيْهِ مِثْلَ إِثْمِ مَنْ عَمِلَ بِهَا مِنَ النَّاسِ لاَ يَنْقُصُ مِنْ آثَامِ النَّاسِ شَيْئًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 210، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 210 (The Book of the Sunnah), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 210، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
