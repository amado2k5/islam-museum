text: "… عُرْوَةَ عَنْ قَطْعِ السِّدْرِ، وَهُوَ مُسْتَنِدٌ إِلَى قَصْرِ عُرْوَةَ فَقَالَ أَتَرَى هَذِهِ الأَبْوَابَ وَالْمَصَارِيعَ إِنَّمَا هِيَ مِنْ سِدْرِ عُرْوَةَ كَانَ عُرْوَةُ يَقْطَعُهُ مِنْ أَرْضِهِ وَقَالَ لاَ بَأْسَ بِهِ. زَادَ حُمَيْدٌ فَقَالَ هِيَ يَا عِرَاقِيُّ جِئْتَنِي بِبِدْعَةٍ قَالَ قُلْتُ إِنَّمَا الْبِدْعَةُ مِنْ قِبَلِكُمْ سَمِعْتُ مَنْ يَقُولُ بِمَكَّةَ لَعَنَ رَسُولُ اللَّهِ مَنْ قَطَعَ السِّدْرَ. ثُمَّ سَاقَ مَعْنَاهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 5241، يرد فيه ذكر ما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 5241 (General Behavior (Kitab Al-Adab)), whose wording mentions what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 5241، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 5241, dont le texte mentionne ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 5241, cuyo texto menciona lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
