label: { ar: "سنن ابن ماجه 546 — ما لا بأس به", en: "Sunan Ibn Majah 546 — what is said to be no harm", ur: "سنن ابن ماجہ 546 — جس میں کوئی مضائقہ نہیں", fr: "Sunan Ibn Majah 546 — ce qui est dit sans inconvénient", es: "Sunan Ibn Mayah 546 — lo que se dice que no tiene inconveniente", tr: "Sünen İbni Mace 546 — Kabul edilebilir olan", id: "Sunan Ibnu Majah 546 — Apa yang dapat diterima" }
text: "… عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّهُ رَأَى سَعْدَ بْنَ مَالِكٍ وَهُوَ يَمْسَحُ عَلَى الْخُفَّيْنِ فَقَالَ إِنَّكُمْ لَتَفْعَلُونَ ذَلِكَ فَاجْتَمَعْنَا عِنْدَ عُمَرَ فَقَالَ سَعْدٌ لِعُمَرَ أَفْتِ ابْنَ أَخِي فِي الْمَسْحِ عَلَى الْخُفَّيْنِ. فَقَالَ عُمَرُ كُنَّا وَنَحْنُ مَعَ رَسُولِ اللَّهِ ـ نَمْسَحُ عَلَى خِفَافِنَا لَمْ نَرَ بِذَلِكَ بَأْسًا. فَقَالَ ابْنُ عُمَرَ وَإِنْ جَاءَ مِنَ الْغَائِطِ قَالَ نَعَمْ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 546، يرد فيه ذكر ما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 546 (The Book of Purification and its Sunnah), whose wording mentions what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 546، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 546, dont le texte mentionne ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 546, cuyo texto menciona lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah'ın Sünen'inde yer alan 546 numaralı hadis, caiz olan şeylerden bahsetmektedir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ile Muhabbetçilerden gelen rivayetlerle birlikte, metinde yer alanları açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 546, menyebutkan apa yang diperbolehkan. Penyusun kitab tentang dosa-dosa wajib, anjuran, najis, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
