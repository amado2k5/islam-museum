text: "- - - فاستدللنا على أن اللّٰه إنما أراد بفرض الصلاة مَنْ إذا توضاً واغتسل طَهُرَ، فأما الحائض فلا تَعامُرُ بواحدٍ منهما، وكان الحيضُ شيئًا خُلِقَ فيها، لم تَجْتَلِبْهُ على نفسها فتكون ماصيةً به، فزال عنها فرضُ الصلاةِ أيام حَيضها، …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 234، يرد فيه ذكر ما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 234, whose wording mentions what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 234 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 234, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 234, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 234. sayfasından bir alıntı, insanlar üzerine farz olan şeylerden bahsetmektedir. Metin, makine tarafından okunabilir taranmış bir kopyadan alınmış olup, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan fiilleri, görevleri, itaat gerektiren fiilleri, tavsiye edilen fiilleri, mekruh edilen fiilleri, haram olan fiilleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 234, menyebutkan apa yang wajib dilakukan oleh manusia. Teks ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin dan dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang mencakup perbuatan wajib, kewajiban, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
