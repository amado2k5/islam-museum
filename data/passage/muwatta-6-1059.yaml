label: { ar: "الموطأ 1059 — ابن عمر كان يرمل من الحجر الأسود إلى الحجر الأسود ثلاثة أطواف، ويمشي أربعة أطواف", en: "Muwatta 1059", es: "Muwatta 1059", fr: "Muwatta 1059", ur: "موطا 1059", tr: "El-Muvatta 1059 — İbn Ömer, Hz. İbrahim'den Hz. İbrahim'e hızlı bir tempoyla üç tur, normal bir tempoyla ise dört tur tavaf yapardı.", id: "Al-Muwatta 1059 — Ibnu Umar biasa melakukan tiga putaran tawaf dengan langkah cepat dari Batu Hitam ke Batu Hitam, dan empat putaran dengan langkah normal." }
text: "كان يرمل من الحجر الأسود إلى الحجر الأسود ثلاثة أطواف، ويمشي أربعة أطواف"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يرمل من الحجر الأسود إلى الحجر الأسود ثلاثة أطواف، ويمشي أربعة أطواف. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1283). {cite:muwatta-maruf-1997 p.490}"
  tr: "Malik, Nafi’den rivayet ettiğine göre, Abdullah ibn Umar, Kara Taş’tan Kara Taş’a hızlı bir tempoda (raml) üç tur tavaf, normal bir tempoda (wajj) ise dört tur tavaf yapardı. Editör, bunu Malik’ten rivayet eden Ebu Mus’ab’ın (1283) naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.490}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa melakukan tawaf tiga kali dengan langkah cepat (raml) dari Batu Hitam ke Batu Hitam, dan empat kali dengan langkah normal (wajj). Editor menyebutkan bahwa Abu Mus’ab (1283) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.490}"
