label: { ar: "الموطأ 81 — ابن عمر يمسح على خفيه قبل صلاة الجنازة", en: "Muwatta 81" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما جاء في المسح على الخفين: بال عبد الله بن عمر في السوق ثم توضأ فغسل وجهه ويديه ومسح برأسه، ثم دُعي إلى جنازة ليصلي عليها حين دخل المسجد، فمسح على خفيه ثم صلى عليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.78}"
