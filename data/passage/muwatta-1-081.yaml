label: { ar: "الموطأ 81 — ابن عمر يمسح على خفيه قبل صلاة الجنازة", en: "Muwatta 81", es: "Muwatta 81", fr: "Muwatta 81", ur: "موطا 81", tr: "El-Muvatta 81 — İbn Ömer cenaze namazından önce çoraplarını siliyor.", id: "Al-Muwatta 81 — Ibnu Umar mengusap kaus kakinya sebelum salat jenazah" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما جاء في المسح على الخفين: بال عبد الله بن عمر في السوق ثم توضأ فغسل وجهه ويديه ومسح برأسه، ثم دُعي إلى جنازة ليصلي عليها حين دخل المسجد، فمسح على خفيه ثم صلى عليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.78}"
  tr: "Malik'in Nafi'den rivayet ettiği, çorap üzerine silme bölümünde yer alan bir rivayete göre: Abdullah ibn Umar çarşıda idrarını yaptı, sonra abdest aldı, yüzünü ve ellerini yıkadı ve başını sildi. Camiye girdiğinde cenaze namazına çağrıldı, bu yüzden çorapları üzerine sildi ve sonra merhumun başında namaz kıldı. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suwaid ve Muhammed ibn al-Hasan tarafından nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.78}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang mengusap kaus kaki: Abdullah ibn Umar buang air kecil di pasar, kemudian berwudhu, mencuci muka dan tangannya serta mengusap kepalanya. Kemudian ia dipanggil untuk salat jenazah ketika memasuki masjid, lalu ia mengusap kaus kakinya dan kemudian mendoakan jenazah. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.78}"
