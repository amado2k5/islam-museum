label: { ar: "الموطأ 467 — ابن عمر: من نسي صلاة فلم يذكرها إلا مع الإمام صلاها بعد سلامه ثم أعاد", en: "Muwatta 467" }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن من نسي صلاة فلم يذكرها إلا وهو مع الإمام، فإذا سلم الإمام فليصل الصلاة التي نسي ثم ليصل بعدها الأخرى؛ وهو في باب العمل في جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وحفص بن غياث عند ابن أبي شيبة وسويد وعبد الرزاق وأبو عامر العقدي عند الطحاوي. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.240}"
