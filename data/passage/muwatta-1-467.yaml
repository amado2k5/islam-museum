label: { ar: "الموطأ 467 — ابن عمر: من نسي صلاة فلم يذكرها إلا مع الإمام صلاها بعد سلامه ثم أعاد", en: "Muwatta 467", es: "Muwatta 467", fr: "Muwatta 467", ur: "موطا 467", tr: "El-Muvatta 467 — İbn Ömer: Kim bir namazı unutur ve imamın duası bittikten sonra hatırlarsa, imamın selamlamasından sonra namazı kılmalı ve sonra tekrar kılmalıdır.", id: "Al-Muwatta 467 — Ibn Umar: Barang siapa lupa shalat dan baru mengingatnya setelah Imam selesai shalat, maka hendaklah ia melaksanakannya setelah salam Imam dan kemudian mengulanginya." }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن من نسي صلاة فلم يذكرها إلا وهو مع الإمام، فإذا سلم الإمام فليصل الصلاة التي نسي ثم ليصل بعدها الأخرى؛ وهو في باب العمل في جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وحفص بن غياث عند ابن أبي شيبة وسويد وعبد الرزاق وأبو عامر العقدي عند الطحاوي. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.240}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Abdullah ibn Umar'ın şöyle dediği belirtilir: \"Bir kimse bir namazı unutur ve ancak imamın arkasında namaz kılarken hatırlarsa, imam namazı bitirdikten sonra unuttuğu namazı ve ardından bir sonraki namazı kılmalıdır.\" Bu, namazın genel uygulaması bölümünde yer almaktadır. Araştırmacı, bunun İbn Abi Şeybe'nin derlemesinde Ebu Mus'ab ve Hafs ibn Ghiyath tarafından Malik'ten, el-Tahavi'nin derlemesinde ise Suveyd, Abdülrazzak ve Ebu Emir el-Akdi tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.239} {cite:muwatta-maruf-1997 s.240}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’ menyatakan bahwa Abdullah ibn Umar biasa berkata: “Jika seseorang lupa shalat dan baru mengingatnya saat shalat di belakang imam, maka setelah imam selesai shalat, ia hendaknya melaksanakan shalat yang terlupakan tersebut dan kemudian shalat berikutnya.” Hal ini terdapat dalam bab tentang tata cara shalat secara umum. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab dan Hafs ibn Ghiyath dalam kumpulan Ibn Abi Shaybah, dan oleh Suwayd, Abd al-Razzaq, dan Abu Amir al-Aqdi dalam kumpulan al-Tahawi. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.240}"
