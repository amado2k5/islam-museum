text: "… هنا قيل: لا صغيرة مع الإصرار. فصل إذا كان الفعل مندوباً بالجزء كان واجباً بالكلّ ؛ كالأذان في المساجد الجوامع أو غيرها، وصلاة الجماعة، وصلاة العيدين، وصدقة التطّوع، والنكاح، والوتر، والفجر، والعمرة، وسائر النوافل الرواتب. فإنها مندوب إليها بالجزء. ولو …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 77، يرد فيه ذكر الواجب، والمندوب، والنافلة والنوافل، والتطوع، والسنن المؤكدة والرواتب، وصغائر الذنوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 77, whose wording mentions the obligatory (wajib), the recommended (mandub), the supererogatory (nafila), the voluntary act (tatawwu'), the emphasised and regular sunnas, the minor sins; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 2، ص 77 کا اقتباس جس میں واجب، مندوب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩، سننِ مؤکدہ اور رواتب، صغیرہ گناہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muwafaqat de al-Shatibi, volume numérisé 2, p. 77, dont le texte mentionne l'obligatoire (wajib), le recommandé (mandub), le surérogatoire (nafila), l'acte volontaire (tatawwu'), les sunnas appuyées et régulières, les péchés mineurs ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muwafaqat de al-Shatibi, volumen digitalizado 2, p. 77, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mandub), lo supererogatorio (nafila), el acto voluntario (tatawwu'), las sunnas enfatizadas y regulares, los pecados menores; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
