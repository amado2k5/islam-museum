label: { ar: "مسلم 2599 — إني لم أُبعث لعّاناً وإنما بعثت رحمة", en: "Muslim 2599 — I was not sent as a curser; I was sent as a mercy", es: "Musulmán 2599 — No fui enviado como un maldecidor; fui enviado como una misericordia", fr: "Muslim 2599 — Je n'ai pas été envoyé pour maudire, mais pour apporter la miséricorde.", ur: "مسلم 2599 - مجھے لعنت کرنے والا نہیں بھیجا گیا تھا۔ مجھے رحمت بنا کر بھیجا گیا ہے۔", tr: "Müslim 2599 — Ben lanetlemek için gönderilmedim, aksine rahmet olarak gönderildim.", id: "Muslim 2599 — Aku tidak diutus untuk mengutuk, melainkan aku diutus sebagai rahmat." }
text: "قيل: يا رسول الله، ادع على المشركين؛ قال: «إني لم أُبعث لعّاناً، وإنما بعثت رحمة»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ رد النبي طلب الدعاء على المشركين بأنه بُعث رحمة لا لعّاناً — من أنصع نصوص الرحمة في بعثته."
  tr: "Sahih Müslim'deki Salihlik Kitabı'nda Ebu Hurayra'nın rivayeti; Peygamber'in müşriklere karşı dua etme isteğine verdiği cevap, kendisinin bir rahmet olarak gönderildiği, bir lanetçi olarak gönderilmediği yönündeki ifadesi, onun misyonundaki rahmetin en açık metinlerinden biridir."
  id: "Riwayat Abu Hurairah dalam Kitab Kebenaran di Sahih Muslim; jawaban Nabi atas permintaan untuk berdoa melawan kaum musyrik, bahwa beliau diutus sebagai pembawa rahmat, bukan sebagai pembawa kutukan — adalah salah satu teks paling jelas tentang rahmat dalam misinya."
