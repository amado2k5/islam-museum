text: "قيل: يا رسول الله، ادع على المشركين؛ قال: «إني لم أُبعث لعّاناً، وإنما بعثت رحمة»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ رد النبي طلب الدعاء على المشركين بأنه بُعث رحمة لا لعّاناً — من أنصع نصوص الرحمة في بعثته."
