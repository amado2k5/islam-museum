label: { ar: "الموطأ 2164 — مالك عن نافع عن صفية بنت أبي عبيد: أن عمر قال ما بال رجال يطؤون وليداتهم ثم يدعونهن يخرجن، لا تأتيني وليدة يعترف سيدها أن قد ألم بها إلا قد ألحقت به ولدها، فأرسلوهن بعد أو أمسكوهن", en: "Muwatta 2164", es: "Muwatta 2164", fr: "Muwatta 2164", ur: "موطا 2164", tr: "El-Muvatta 2164 — Malik, Nafi’den, Safiyye bint Ebu Ubeyd’den rivayetle: Ömer şöyle buyurdu: “Genç kızlarıyla cinsel ilişkiye girip sonra onları serbest bırakan erkeklere ne oluyor? Efendisi kendisiyle cinsel ilişkiye girdiğini itiraf eden hiçbir genç kız bana gelmez ki, çocuğunu ona isnat etmeyeyim. Öyleyse ya onları serbest bırakın ya da alıkoymaya devam edin.”", id: "Al-Muwatta 2164 — Malik, dari Nafi’, dari Safiyyah binti Abi Ubayd: bahwa Umar berkata, “Bagaimana dengan laki-laki yang bersetubuh dengan anak perempuan mereka yang masih muda lalu membiarkan mereka pergi? Tidak ada anak perempuan yang datang kepadaku yang tuannya mengakui telah bersetubuh dengannya, melainkan aku akan menganggap anak perempuan itu adalah anaknya. Maka, lepaskanlah mereka atau peliharalah mereka.”" }
summary:
  ar: "يروي مالك عن نافع عن صفية بنت أبي عبيد أنها أخبرته أن عمر بن الخطاب قال: ما بال رجال يطؤون وليداتهم، ثم يدعونهن يخرجن؟ لا تأتيني وليدة يعترف سيدها أن قد ألم بها، إلا قد ألحقت به ولدها، فأرسلوهن بعد، أو أمسكوهن. {cite:muwatta-maruf-1997 p.286} {cite:muwatta-maruf-1997 p.287}"
  tr: "Malik, Safiyya bint Abi Ubayd'dan rivayetle Nafi'den naklederek, Ömer ibn el-Hattab'ın şöyle dediğini aktarır: \"Genç kızlarıyla cinsel ilişkiye girip sonra onları serbest bırakan erkeklere ne oluyor? Efendisi cinsel ilişkiye girdiğini itiraf eden hiçbir genç kız bana gelmez, çocuğunu ona isnat ederim. Öyleyse ya onları sonradan serbest bırakın ya da tutun.\" {cite:muwatta-maruf-1997 s.286} {cite:muwatta-maruf-1997 s.287}"
  id: "Malik meriwayatkan dari Nafi’ dari Safiyya binti Abi Ubayd, yang mengatakan kepadanya bahwa Umar bin al-Khattab berkata: “Apa masalahnya dengan laki-laki yang bersetubuh dengan anak perempuan mereka yang masih muda lalu membiarkan mereka pergi? Tidak ada gadis muda yang akan datang kepadaku yang tuannya mengakui telah bersetubuh dengannya, kecuali aku akan menganggap anaknya sebagai anak tuannya. Jadi, lepaskan mereka setelah itu, atau peliharalah mereka.” {cite:muwatta-maruf-1997 p.286} {cite:muwatta-maruf-1997 p.287}"
