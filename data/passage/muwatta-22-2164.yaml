label: { ar: "الموطأ 2164 — مالك عن نافع عن صفية بنت أبي عبيد: أن عمر قال ما بال رجال يطؤون وليداتهم ثم يدعونهن يخرجن، لا تأتيني وليدة يعترف سيدها أن قد ألم بها إلا قد ألحقت به ولدها، فأرسلوهن بعد أو أمسكوهن", en: "Muwatta 2164" }
summary:
  ar: "يروي مالك عن نافع عن صفية بنت أبي عبيد أنها أخبرته أن عمر بن الخطاب قال: ما بال رجال يطؤون وليداتهم، ثم يدعونهن يخرجن؟ لا تأتيني وليدة يعترف سيدها أن قد ألم بها، إلا قد ألحقت به ولدها، فأرسلوهن بعد، أو أمسكوهن. {cite:muwatta-maruf-1997 p.286} {cite:muwatta-maruf-1997 p.287}"
