text: "… أبو عبد الله، قال: ثنا وكيع، قال: ثنا حنظلَةُ الجمجِيّ، عن عكرمة بن خالد، عن ابن عمر مشيا، قال: قال رسول اللٰه : بُنيَ الإسلام على خمسٍ: شهادةٍ أن لا إله إلَّا الله، وأني رسول الله، وإقام الصَّلاة، وإبتاء الزكاة، …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 647، يذكر ما بُني عليه الإسلام، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 647, that mentions what Islam is built on, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 647 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 647, que menciona los fundamentos del Islam: el testimonio, la oración y el zakat. Este fragmento, extraído de un escaneo automático, se cita con un máximo de cuarenta palabras, según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye en su lista."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 647, mentionnant les fondements de l'islam: le témoignage, la prière et la zakat. Ce passage, issu d'une numérisation automatique, est cité en quarante mots maximum, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"Sünnet\" adlı kitabının 647. sayfasından bir alıntı, iman ikrarı, namaz ve zekât da dahil olmak üzere İslam'ın temellerinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal \"Al-Sunnah,\" halaman 647, menyebutkan landasan Islam, termasuk pengakuan iman, salat, dan zakat. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
