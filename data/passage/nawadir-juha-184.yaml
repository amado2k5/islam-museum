label: { ar: "نوادر جحا الكبرى، ص 83 — «لو لم أقطعه لسحبته وأوقعتني»", en: "Nawadir Juha al-Kubra, p. 83 — 'Had I Not Cut It, It Would Have Pulled Me Down'", ur: "نوادر جحا الکبریٰ، ص 83 — «اگر میں اسے نہ کاٹتا تو وہ مجھے کھینچ کر گرا دیتی»", fr: "Nawadir Juha al-Kubra, p. 83 — « Si je ne l'avais pas coupé, il m'aurait tiré vers le bas »", es: "Nawadir Juha al-Kubra, p. 83 — «Si no lo hubiera cortado, me habría arrastrado»", tr: "Juha'nın Büyük Fıkraları, s. 83 — “Eğer onu kesmeseydim, beni aşağı çeker ve düşmeme neden olurdu.”", id: "Anekdot Hebat Juha, hlm. 83 — “Jika saya tidak memotongnya, itu akan menarik saya ke bawah dan menyebabkan saya jatuh.”" }
text: "… لو لم أقطعْهُ لسحبتُهُ وأوقعتني وقف في نافذة داره، وقد حَصِرَ حضراً شديداً فأخذَ يبوّل منها على الطريق، فمرَّ من أمام دارِه رجل، فقطعَ الشيخُ بوله فقال الرجل : لماذا قطعته؟ فأجابه: لو لم أقطعه لأمسكّتَ به، وسحبته كالخيطِ وأوقعتني …"
summary:
  ar: "كان جحا يبول من النافذة، فسأله عابر لماذا توقف، فقال إنه لو لم يقطعه لسحبه الخيط وأوقعه. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  en: "Juha urinates from the window; a passer-by asks why he stops; he says if he had not, the stream would have pulled him down like a thread. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  ur: "جحا کھڑکی سے پیشاب کر رہا تھا؛ ایک راہگیر نے پوچھا کہ رک کیوں گئے، تو اس نے کہا کہ اگر نہ روکتا تو دھاگے کی طرح وہ دھار مجھے کھینچ کر گرا دیتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  fr: "Juha urine par la fenêtre; un passant demande pourquoi il s'arrête; il répond que s'il ne l'avait pas fait, le jet l'aurait tiré vers le bas comme un fil. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  es: "Juha orina desde la ventana; un transeúnte le pregunta por qué se detiene; él dice que, de no haberlo hecho, el chorro lo habría arrastrado hacia abajo como un hilo. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  tr: "Juha pencereden dışarı işerken, yoldan geçen biri ona neden durduğunu sordu. Juha, ipi kesmeseydi, ipin onu aşağı çekip düşmesine neden olacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 83}"
  id: "Juha sedang buang air kecil dari jendela ketika seorang pejalan kaki bertanya mengapa dia berhenti. Dia menjawab bahwa jika dia tidak memotong talinya, tali itu akan menariknya ke bawah dan menyebabkannya jatuh. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
