text: "… يوسف سأل ذلك، إمَّا عند احتضاره، أو إذا كان ذلك أن يكون كذلك. وقد ذكر ابن إسحاق عن أهل الكتاب : أن يعقوب أقام بديار مصر. عند يوسف سبع عشرة سنة، ثم توفى. وكان قد أوصى إلى يوسف أن يدفن …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 332، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 332, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
