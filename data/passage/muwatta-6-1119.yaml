label: { ar: "الموطأ 1119 — هشام بن عروة عن أبيه: كان يقول لبنيه: يا بني، لا يهدين أحدكم لله من البدن شيئاً يستحيي أن يهديه لكريمه، فإن الله أكرم الكرماء وأحق من اختير له", en: "Muwatta 1119", es: "Muwatta 1119", fr: "Muwatta 1119", ur: "موطا 1119", tr: "El-Muvatta 1119 — Hişam ibn Urve, babasından rivayetle: Oğullarına şöyle derdi: Ey oğullarım, hiçbiriniz Allah'a kurban olarak, cömert kuluna sunmaktan utanacağı bir şey sunmasın; çünkü Allah, cömertlerin en cömertidir ve seçilmeye en layık olandır.", id: "Al-Muwatta 1119 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Beliau biasa berkata kepada putra-putranya: Wahai putra-putraku, janganlah seorang pun di antara kalian mempersembahkan kepada Allah sesuatu dari hewan kurban yang akan membuat kalian malu untuk mempersembahkannya kepada orang yang dermawan, karena Allah adalah Yang Maha Dermawan dan Yang paling layak untuk dipilih." }
text: "لا يهدين أحدكم لله من البدن شيئاً يستحيي أن يهديه لكريمه، فإن الله أكرم الكرماء وأحق من اختير له"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان يقول لبنيه: يا بني، لا يهدين أحدكم لله من البدن شيئاً يستحيي أن يهديه لكريمه، فإن الله أكرم الكرماء وأحق من اختير له. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1214) وسويد (526). {cite:muwatta-maruf-1997 p.512}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından rivayet ederek, babasının oğullarına şöyle dediğini aktarmıştır: \"Oğullarım, hiçbiriniz Allah'a kurban olarak, cömert bir insana sunmaktan utanacağı bir şey sunmasın; çünkü Allah, cömertlerin en cömertidir ve O'nun için seçilmeye en layık olandır.\" Araştırmacı, bunun Malik'ten Ebu Musab (1214) ve Suveyd (526) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.512}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, yang juga meriwayatkan dari ayahnya, yang biasa berkata kepada anak-anaknya: “Wahai anak-anakku, janganlah ada di antara kalian yang mempersembahkan kepada Allah sesuatu dari hewan kurban yang akan membuat kalian malu untuk mempersembahkannya kepada orang yang dermawan, karena Allah adalah Yang Maha Dermawan dan Yang paling layak dipilih oleh-Nya.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1214) dan Suwaid (526). {cite:muwatta-maruf-1997 p.512}"
