label: { ar: "الموطأ 1119 — هشام بن عروة عن أبيه: كان يقول لبنيه: يا بني، لا يهدين أحدكم لله من البدن شيئاً يستحيي أن يهديه لكريمه، فإن الله أكرم الكرماء وأحق من اختير له", en: "Muwatta 1119" }
text: "لا يهدين أحدكم لله من البدن شيئاً يستحيي أن يهديه لكريمه، فإن الله أكرم الكرماء وأحق من اختير له"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان يقول لبنيه: يا بني، لا يهدين أحدكم لله من البدن شيئاً يستحيي أن يهديه لكريمه، فإن الله أكرم الكرماء وأحق من اختير له. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1214) وسويد (526). {cite:muwatta-maruf-1997 p.512}"
