label: { ar: "سنن النسائي 2392 — مضاعفة الحسنة بعشر أمثالها", en: "Sunan al-Nasa'i 2392 — the good deed multiplied tenfold and beyond", ur: "سنن نسائی 2392 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا", es: "Sunan al-Nasa'i 2392 — La buena acción multiplicada por diez y más", fr: "Sunan al-Nasa'i 2392 — la bonne action multipliée par dix et au-delà", tr: "Sunan an-Nasa'i 2392 — İyi bir amel on kat çoğalır.", id: "Sunan an-Nasa'i 2392 — Suatu amal kebaikan akan dilipatgandakan sepuluh kali lipat" }
text: "… \" فَإِنَّكَ لاَ تَسْتَطِيعُ ذَلِكَ فَصُمْ وَأَفْطِرْ وَنَمْ وَقُمْ وَصُمْ مِنَ الشَّهْرِ ثَلاَثَةَ أَيَّامٍ فَإِنَّ الْحَسَنَةَ بِعَشْرِ أَمْثَالِهَا وَذَلِكَ مِثْلُ صِيَامِ الدَّهْرِ \". قُلْتُ فَإِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ. قَالَ \" صُمْ يَوْمًا وَأَفْطِرْ يَوْمَيْنِ \". فَقُلْتُ إِنِّي أُطِيقُ أَفْضَلَ مِنْ ذَلِكَ يَا رَسُولَ اللَّهِ. قَالَ \" فَصُمْ يَوْمًا وَأَفْطِرْ يَوْمًا وَذَلِكَ صِيَامُ دَاوُدَ وَهُوَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2392، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2392 (The Book of Fasting), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2392، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2392 (El Libro del Ayuno), habla de la buena acción multiplicada por diez o más. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2392 (Le Livre du jeûne), évoque la multiplication par dix, voire plus, des bonnes actions. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou évaluent les actes accomplis."
  tr: "Sunan-ı Nesai'de 2392 numaralı hadis, iyiliğin on katına çıkarıldığını belirtir. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2392, menyebutkan bahwa amal kebaikan akan dilipatgandakan sepuluh kali. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
