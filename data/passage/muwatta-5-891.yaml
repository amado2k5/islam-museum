label: { ar: "الموطأ 891 — هشام بن عروة عن أبيه: قال رسول الله: تحروا ليلة القدر في العشر الأواخر من رمضان", en: "Muwatta 891", es: "Muwatta 891", fr: "Muwatta 891", ur: "موطا 891", tr: "El-Muvatta 891 — Hişam ibn Urve, babasının rivayetine göre: Allah Resulü şöyle buyurdu: Ramazan ayının son on gecesinde Kadir Gecesi'ni arayın.", id: "Al-Muwatta 891 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Rasulullah SAW bersabda: Carilah Laylat al-Qadr di sepuluh malam terakhir bulan Ramadhan." }
text: "تحروا ليلة القدر في العشر الأواخر من رمضان"
summary:
  ar: "يرويه زياد عن مالك عن هشام بن عروة عن أبيه، أن رسول الله قال: تحروا ليلة القدر في العشر الأواخر من رمضان. ويذكر المحقق أن مالكاً رواه مرسلاً، وأنه عند غيره موصول من طريق هشام عن أبيه عن عائشة مرفوعاً في الصحيحين وغيرهما، وأن الترمذي (792) قال: حديث عائشة حسن صحيح، وأن في الباب عن جماعة من الصحابة. {cite:muwatta-maruf-1997 p.428}"
  tr: "Ziyad, Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, Resulullah şöyle buyurmuştur: \"Ramazan ayının son on gecesinde Kadir Gecesi'ni arayın.\" Araştırmacı, Malik'in bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak rivayet ettiğini, diğerlerinin ise Hişam'dan, o da babasından, o da Aişe'den rivayet ettiğine göre musnad (bağlı) olarak rivayet ettiğini ve iki Sahih'te (Buhari ve Müslim) ve diğer hadis külliyatlarında bulunduğunu belirtmektedir. Tirmizi (792) şöyle demiştir: \"Aişe'nin hadisi hasen sahihtir (iyi ve sahih)\" ve bu konuda bir grup Sahabeden de benzer rivayetler vardır. {cite:muwatta-maruf-1997 s.428}"
  id: "Diriwayatkan oleh Ziyad dari Malik, dari Hisham ibn Urwah, dari ayahnya, bahwa Rasulullah SAW bersabda: \"Carilah Laylat al-Qadr di sepuluh malam terakhir bulan Ramadhan.\" Peneliti menyebutkan bahwa Malik meriwayatkan hadits ini sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), sedangkan yang lain meriwayatkannya sebagai musnad (terhubung) melalui Hisham, dari ayahnya, dari Aisyah, dan hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim) dan kumpulan hadits lainnya. At-Tirmidhi (792) berkata: \"Hadits Aisyah adalah hasan sahih (baik dan sahih),\" dan bahwa ada riwayat serupa tentang topik ini dari sekelompok Sahabat. {cite:muwatta-maruf-1997 p.428}"
