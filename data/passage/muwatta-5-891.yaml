text: "تحروا ليلة القدر في العشر الأواخر من رمضان"
summary:
  ar: "يرويه زياد عن مالك عن هشام بن عروة عن أبيه، أن رسول الله قال: تحروا ليلة القدر في العشر الأواخر من رمضان. ويذكر المحقق أن مالكاً رواه مرسلاً، وأنه عند غيره موصول من طريق هشام عن أبيه عن عائشة مرفوعاً في الصحيحين وغيرهما، وأن الترمذي (792) قال: حديث عائشة حسن صحيح، وأن في الباب عن جماعة من الصحابة. {cite:muwatta-maruf-1997 p.428}"
