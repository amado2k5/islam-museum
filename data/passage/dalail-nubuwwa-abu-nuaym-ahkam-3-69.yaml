text: "… رسول اللّٰه قرجفٍ بوادره فدخل على خديجةا واخبرها الخبر وقال قد خشيت على نفسي فقالت نه اشر ثو الله لا يخزيك اللّٰه ابد اانك لتصل الرحم وتصدق الحديث وتحمل الكل وتقرى المضيف وتعين على نوائب انحو، ثم انطلقت به خديجة …"
