label: { ar: "الموطأ 597 — يحيى بن سعيد مرسلاً: كُفن النبي في ثلاثة أثواب بيض سحولية", en: "Muwatta 597", es: "Muwatta 597", fr: "Muwatta 597", ur: "موطا 597", tr: "El-Muvatta 597 — Yahya ibn Sa’id, mursal: Peygamber, Sahul’dan üç beyaz pamuklu giysiye sarınmıştı.", id: "Al-Muwatta 597 — Yahya ibn Sa’id, mursal: Nabi dikafani dengan tiga kain katun putih dari Sahul." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد مرسلاً، أن النبي كُفن في ثلاثة أثواب بيض سحولية. ويذكر المحقق أن هذا الحديث سقط جملة من نسخة م وهو في سائر النسخ وفي التمهيد (24/90)، وأنه رواه عن مالك أبو مصعب، وأنه تقدم مرفوعاً من حديث عائشة. {cite:muwatta-maruf-1997 p.308}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, mursal bir hadiste, Peygamber'in Sahul'dan üç beyaz pamuklu giysiyle kefenlendiğini nakletmiştir. Editör, bu hadisin M el yazmasında kısmen eksik olduğunu, ancak diğer tüm el yazmalarında ve el-Tamhid'de (24/90) bulunduğunu belirtmektedir. Ayrıca, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini ve daha önce Aişe'den merfu bir hadis olarak zikredildiğini de belirtmektedir. {cite:muwatta-maruf-1997 s.308}"
  id: "Malik meriwayatkannya berdasarkan otoritas Yahya ibn Sa'id, dalam hadits mursal, bahwa Nabi dikafani dengan tiga kain katun putih dari Sahul. Editor mencatat bahwa hadits ini sebagian hilang dari manuskrip M, tetapi ada di semua manuskrip lain dan di al-Tamhid (24/90). Ia juga menyatakan bahwa Abu Mus'ab meriwayatkannya berdasarkan otoritas Malik, dan bahwa hadits ini sebelumnya disebutkan sebagai hadits marfu' dari Aisyah. {cite:muwatta-maruf-1997 p.308}"
