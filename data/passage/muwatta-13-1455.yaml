label: { ar: "الموطأ 1455 — يحيى بن سعيد: كتب معاوية إلى زيد بن ثابت يسأله عن الجد، فكتب إليه زيد أنه لم يكن يقضي فيه إلا الأمراء، وقد حضر الخليفتين قبله", en: "Muwatta 1455", es: "Muwatta 1455", fr: "Muwatta 1455", ur: "موطا 1455", tr: "El-Muvatta 1455 — Yahya ibn Said: Muaviye, Zeyd ibn Sabit'e dedesi hakkında soru soran bir mektup yazdı; Zeyd de ona, eskiden sadece yöneticilerin orada hüküm sürdüğünü ve ondan önceki iki halifenin de orada bulunduğunu yazdı.", id: "Al-Muwatta 1455 — Yahya ibn Saeed: Muawiyah menulis surat kepada Zayd ibn Thabit menanyakan tentang kakeknya, lalu Zayd membalas suratnya bahwa hanya para penguasa yang biasa memutuskan perkara itu, dan kedua khalifah sebelum dia hadir." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه بلغه أن معاوية بن أبي سفيان كتب إلى زيد بن ثابت يسأله عن الجد، فكتب إليه زيد بن ثابت إنك كتبت إلي تسألني عن الجد، والله أعلم، وذلك مما لم يكن يقضي فيه إلا الأمراء، يعني الخلفاء، وقد حضرت الخليفتين قبلك، يعطيانه النصف مع الأخ الواحد، والثلث مع الاثنين. فإن كثر الإخوة لم ينقصوه من الثلث. {cite:muwatta-maruf-1997 p.11}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet eder ki, Mu'aviye ibn Abi Sufyan'ın dedenin payı hakkında Zeyd ibn Sabit'e bir mektup yazdığını işitmiştir. Zeyd ibn Sabit ona şöyle cevap yazmıştır: \"Dedenin payı hakkında bana yazdın, en iyisini Allah bilir. Bu, ancak hükümdarların, yani halifelerin karar vereceği bir şeydir. Senden önceki iki halifenin hükümdarlığı döneminde de bulundum; bir kardeşi varsa yarısını, iki kardeşi varsa üçte birini verdiler. Birden fazla kardeşi varsa, payını üçte bir oranından düşürmediler.\" {cite:muwatta-maruf-1997 s.11}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa ia mendengar Mu'awiyah ibn Abi Sufyan menulis surat kepada Zayd ibn Thabit menanyakan tentang bagian kakek. Zayd ibn Thabit membalas suratnya: \"Engkau menulis surat kepadaku menanyakan tentang bagian kakek, dan Allah Maha Mengetahui. Ini adalah sesuatu yang hanya dapat diputuskan oleh penguasa, yaitu khalifah. Aku hadir selama pemerintahan dua khalifah sebelummu; mereka memberinya setengah dengan satu saudara dan sepertiga dengan dua saudara. Jika ada banyak saudara, mereka tidak mengurangi bagiannya dari sepertiga.\" {cite:muwatta-maruf-1997 p.11}"
