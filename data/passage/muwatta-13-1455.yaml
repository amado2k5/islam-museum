label: { ar: "الموطأ 1455 — يحيى بن سعيد: كتب معاوية إلى زيد بن ثابت يسأله عن الجد، فكتب إليه زيد أنه لم يكن يقضي فيه إلا الأمراء، وقد حضر الخليفتين قبله", en: "Muwatta 1455" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه بلغه أن معاوية بن أبي سفيان كتب إلى زيد بن ثابت يسأله عن الجد، فكتب إليه زيد بن ثابت إنك كتبت إلي تسألني عن الجد، والله أعلم، وذلك مما لم يكن يقضي فيه إلا الأمراء، يعني الخلفاء، وقد حضرت الخليفتين قبلك، يعطيانه النصف مع الأخ الواحد، والثلث مع الاثنين. فإن كثر الإخوة لم ينقصوه من الثلث. {cite:muwatta-maruf-1997 p.11}"
