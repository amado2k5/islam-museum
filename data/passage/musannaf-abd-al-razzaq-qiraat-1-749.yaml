text: "… حديث منقطع وراويه غير محتجّ به. في ص يقروا الإمام، ولعل الصواب : تقرأ وراء الإمام، وقد روى هق في كتاب القراءة عن الزهري قال : لا يقرأ من وراء الإمام فيما يجهر به الإمام القراءة، بكفيهم قراءة الإمام وإن …"
