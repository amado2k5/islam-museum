text: "وقد قال ثلاث من كن فيه استكمل إيمانه لا يخاف في االله لومة لائم ولا يرائي بشيء من عمله وإذا عرض عليه أمران أحدهما للدنيا والآخر للآخرة آثر أمر الآخرة على الدنيا وقال لا يكمل إيمان عبد حتى يكون فيه …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 8030، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 8030, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 8030 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 8030, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
