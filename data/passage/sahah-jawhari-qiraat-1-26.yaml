text: "… العنقِ. وقد أَجِلَ الرِّجلُ داووني منه؛ كما يقال: طَنَّيْتُهُ، إذا عالجتَه من الطَّنَى في الإِيَّلِ، وهو الذكر من الأوعال. ويقال : هو الذي يسمى بالفارسية كَوْزَنْ. قال أبو عمرو بن العلاء : أيضًا غير طَرَف. وأنشد ابن الأعرابي: الرجز كَأَنَّ …"
