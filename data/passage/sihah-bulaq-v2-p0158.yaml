text: |-
  • باب الها.).
  ٢٩
  والتعضيه قطع العضاهو يقال فلان يتجب غير عضاهه اذا انتحل شعر غيره وقال
  يا أيها الزاهم أنى أجتلب • وأنني غير عضاهى أنتجب • كذبتان شرّ ماقيل السكذب
  وعضهه عضهارماه بالبهنان وقد أعضهت بارجل أى جئت بالبهتان قال الكسائى العضة
  الكذب والبهتان وجمعها عضون مثسل عزة وعزين قال تعالى الذين جعلوا القرآن عضين
  ويقال نقصانه الواووأصله عضوة وهو من عضوته أى فرقته لات المشركين فرّقوا أقاويلهم
  فيه فجعلوه كذبا وسحراوكهانة وشعرا ويقال نقصانه الهاء وأصل عضهة لان العضة
  والعضين فى لغة قريش السحروهم :ولون المساحوعاضه قال الشاعر
  أعوذبربى من النافنا • ت فى عقد العاضه المعضه
  أبو عبيد الحية العاضبه والعاضهة التى تقتسل من داعتها اذا نهشت ⁦(عله)⁩ العله التحير
  والدهش وقد عله علها قال لسد
  علهت تردّدفى نها صعائد • سبعاتوا ما كاملا أيامها
  ورجل علهان وامرأة علهى مثل غرثان وغرنى أى شديد الجوع وقد عله يعله وفرس علهى
  شيطة فى اللجام والعلهان أيضا الظليم والعاله النعامة والعلهاء تويان يندف فيهما وبرالابل
  بلبسان تحت الدرع قال عمروبن قئة
  وتصدى لصرع البطل الار • وع بين العلهاء والسر بال
  وأصل العله الحذة والانهماك (عه العمه التصير والترقد وقد عمه بالسكسره وعه وعامه
  والهع همه قال رؤبة
  ومهمه أطرافه فى مهمه • أعى الهدى بالجاهلين العمه
  وأرض جهاه لا أعلام بها وذهبت ابله العمهى اذا لم يدرأين ذهبت والعميهى مثله ⁦(عوه)⁩
  العاهة الافة يقال عيه الزرع وايف وارض معيوهة وأعاه القوم أصابت ماشيتهم العاهة
  وقال الاموى أعوه القوم مثله والتعويه التعريس وهو النزول فى آخر الليل وكل من احتبس
  فى مكان فقدعوه قال رؤبة• شأز بمنء وهجدب المنطلق
  نادر مثل حامض وقياسه فريه وحيض مثل صغرفهو صغير وملح فهو مليح ويقسال للبردون
  والبغل والحارفاره بين الفروهة والفراهة والفراهية وبراذين فرهة مثل صاحب وصحب
  وفره أيضامئل بازل وبزل وحائل وحول ولا يقال للفرس فاره ولكن رائع وجوادوكان
  الاصححى يخطى عدى بن زيد فى قوله
  فنقلنا صنعه حتى شتا • فاره البال لجوجاف السنى
  قال لم يكن له علم بالحيل وأفرهت النساقة فهى مفره ومفرهة اذا كانت تنتج الفره وقال
  أبوذؤيب ومفرهة عنس قدرت لساقها • تحترّت كماتتسابع الريح بالقفل
  ومفرهة أيضا قال مالك بن جهدة التغلبى"
