label: { ar: "نوادر جحا الكبرى، ص 165 — «قف هنا وأنا أريك كيف أغشك»", en: "Nawadir Juha al-Kubra, p. 165 — 'Stand Here and I Will Show You How I Cheat You'", ur: "نوادر جحا الکبریٰ، ص 165 — «یہیں کھڑے رہو، میں تمہیں دکھاتا ہوں کہ تمہیں کیسے دھوکا دوں»", fr: "Nawadir Juha al-Kubra, p. 165 — « Reste ici et je te montrerai comment je te trompe »", es: "Nawadir Juha al-Kubra, p. 165 — «Quédate aquí y te mostraré cómo te engaño»", tr: "Juha'nın Büyük Fıkraları, s. 165 — “Burada dur, sana nasıl kandırılacağını göstereyim.”", id: "Anekdot Hebat Juha, hlm. 165 — “Berdirilah di sini dan aku akan menunjukkan cara menipumu”" }
text: "نوادر جحا الكبرى يتململ، فمرّ به أحد أصحابه، وقال له: لماذا أنت واقف هنا؟ فحدَّثَهُ بما كان. فضحك صاحبه وقال له: يا لكَ من أحمق، فها قد غَشَّكَ وانطلَتْ عليك الحيلة. إنها قِرابُ فأْس كان جحا في طفولتِه يلعب مَعَ …"
summary:
  ar: "قال جحا لصبي يتفاخر بأنه لا يمكن غشه أن ينتظر هناك، ثم غادر، فانتظر الصبي ساعات، وأخبره صديق أنه خُدع. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  en: "Juha tells a boy who boasts he cannot be cheated to wait there, then leaves; the boy waits for hours, and a friend tells him he has been tricked. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  ur: "جحا نے ایک لڑکے سے جو شیخی مارتا تھا کہ اسے دھوکا نہیں دیا جا سکتا کہا کہ یہیں ٹھہرو، پھر وہاں سے چلا گیا، لڑکا گھنٹوں انتظار کرتا رہا، اور ایک دوست نے اسے بتایا کہ اسے بے وقوف بنایا گیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  fr: "Juha dit à un garçon qui se vante de ne pouvoir être trompé d'attendre là, puis s'en va ; le garçon attend pendant des heures, et un ami lui apprend qu'il a été dupé. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  es: "Juha le dice a un muchacho que presume de que no se le puede engañar que espere allí, y se marcha; el muchacho espera durante horas, y un amigo le dice que lo han engañado. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  tr: "Juha, kandırılamayacağını söyleyerek övünen bir çocuğa orada beklemesini söyledi, sonra da ayrıldı. Çocuk saatlerce bekledi ve bir arkadaşı ona kandırıldığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 165}"
  id: "Juha menyuruh seorang anak laki-laki yang membual bahwa dia tidak bisa ditipu untuk menunggu di sana, lalu dia pergi. Anak laki-laki itu menunggu berjam-jam, dan seorang temannya memberitahunya bahwa dia telah ditipu. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
