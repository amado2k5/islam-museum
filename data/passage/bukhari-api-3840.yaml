label: { ar: "صحيح البخاري 3840 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3840 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3840 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "قَالَ وَقَالَ ابْنُ عَبَّاسٍ سَمِعْتُ أَبِي يَقُولُ، فِي الْجَاهِلِيَّةِ اسْقِنَا كَأْسًا دِهَاقًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 3840، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3840 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3840، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
