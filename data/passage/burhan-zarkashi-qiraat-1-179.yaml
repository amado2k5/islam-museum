text: "… والقراء والتفسير والمفسرين وترجمة القرآن والنسخ والمحكم والمتشابه وأسلوب القرآن وإعجازه. وعن أول ظهور الاصطلاح -علوم القرآن - يقول : ولقد كان المعروف لدى الكاتبين فى هذا الفن، أن أول عهد ظهر فيه هذا الاصطلاح، أى اصطلاح علوم القرآن هو …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 179، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 179, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 179 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Zarkashi, Al-Burhan fi 'Ulum al-Qur'an, volumen 1, pág. 179, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre « Al-Burhan fi 'Ulum al-Qur'an » d'al-Zarkashi (tome 1, p. 179), mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Zarkashi'nin Al-Burhan fi Ulum al-Qur'an adlı eserinin 1. cildinin 179. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 1, halaman 179, yang menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
