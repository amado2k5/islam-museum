text: |-
  ٥٦٧
  وانشيطة مايغنمه الغزاة فى الطريق قبل البلوغ الى الموضع الذى قصدوه قال الشاعر
  لك المرباع منها والصفايا وحكمك والنشيطة والغضول
  والناشط النور الوحنى يخرج من أرض الى أرض قال الشاعر
  اذا أم غش بالوشى اكرعه • مسفع الخدهاد ناشط شبب
  وقوله تعالى والناشطات نشطايعى النجوم تنشط من برج الى برج كالذور الناشط من بلدالى
  بلدوالهموم بنشط بصاحبها قال هميان بن قجافة
  أمست همومى تنشط المناشطا • الشام بى طورا وطوراواسطا
  ونشطته الحية تنشط وتنشط نشطا اذاعضته بنابجا ونشطت الدلو من البترنزعتها بغير بكرة
  وقال الاصمعى يقال للناقة حسن مانشطت السيريعى سدويديها والانشوطة عقدة يسهل
  اضلالها مثل عقدة التحكة يقال ماعقالك بأنشوطة أى مامودتك بواهبة قال أبوزيد
  نشطت المجل أنشطه نشطاعقدته انشوطة وأنشعته أى حإلته يقال كا نما أنش_ط من أ
  عقال وانتشطت الحبل أى مددته حتى يهدل قال الاصمعى بثرانشاط أى قرببة القعر تخرج
  الدلو منها بجذية واحدة وبترنشوط قال وهى التى لا تخرج منها الدلو حتى تنشط كثيرا
  والنشوط أيضاضرب من السمك وليس بالشبوط وقولهم لا -تى يرجع نشيط من عر و وهو
  اسم رحل بن لزياد دارا بالبصرة فهرب الى مر وقبل اتمامها فكان زياد كلما قيل ه تم دارك
  يقول لاحتى يرجع نشيط من هى وفلم يرجع فصار مثلا (نطط النطائط الطوال الواحد
