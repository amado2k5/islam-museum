text: |-
  •⁦(باب اللام)⁩*
  *⁦(خبل)⁩ .
  ٥٦٩
  رمانى بأمر كنت منه ووالدى • بريأومن جول الطوى دمانى
  والجال مثله قال الشاعر ⁦(١ )⁩ .
  ردّت معاونه ختما مفللة • وصادفت أخضر الجالين صلالا
  والمع اجوال ويقال لارجل ماله جول أى عقل وعزيمة تنعه مشل جور البئر :⁦(جهل)⁩
  الجهل خلاف العلم وقد جهل فلان جه لا وجهالة وتجاهل أى أرى من نفسه ذلكْ وليس به
  واستجه له عدّه جاهلا واستففه أيضا قال الشاءر + نزو الفراراستجهل الفرارا • والتجهيل
  أن تنسبه الى الجهل والجهلة الامر الذى يحملك على الجهل ومنه قولهم الولد مجهلة وانجهل
  المفازة لا اعلام فيها يقال ركبتهاعلى هجهولها قال الشاعرد ويدبن أب كاهل
  فركبنا ها على مجهولها • بصلاب الارض فيهنّ شجع
  وقولهم كان ذلات فى الجاهلية الجهلاء هو نوكيد للاول يش-تقله من اسمه مايؤ كدبه كايقال
  وتدواتدوهمج هامج وليلة ليلاء ريوم أيوم ( يل جيل من الناس أى صنف الترا جيل
  والروم جيل وجيلان بالكسر قوم رتبهم كسرى بالبحرين شبه الاكرة وجيلان بفتح الجيم
  حى من عبد القيس وجيلان الحصى ما أبالته الريح منه
  صل الحاد) ( بل لحبل الرسن ويجمع على حبال وأحبل وقال ٢
  أمن أجل حبل لا أبالتضربته • بمنسأة قد جر حبلك أحبلا
  والجبل العهدو الجبل الامان وهو مثل الجوار قال الاعشى
  واذا تجوّزها حبال قبيلة • أخذت من الاخرى اليك حبالها
  والحبل الوصال ويقال للرمل يستطيل حبل وحبل العاتقعصب وحبل الوريدعرق
  فى العنق وحبل الذراع فى اليد وفى المثل هوعلى حبل ذراعك أى فى القرب منك والجيلذ
  بالضم عر العضاه وفى حديث سعد رضى اللّه عنه لقدرأ يتنا مع رسول اللّٰه على اللّه عليه وسلم
  ومالنا لطعام الا الحبلة وورق السهر ويقال ضبة حابل يرعى الحبلة والحبلة أيضاحلى يجعل
  فى القلائد قال الشاءر ٣ * ويزيتها فى الحر حلى واضح • وقلائد من حبلة وسلوس
  والجبل بالمكسر الداهية والجمع الجبول قال كثير
  فلا تهبلى ياءزأن تتفهمى • بنصح أتى الواشون أم مجبول
  ويقال للواقف مكانه كالاسدلا يقر حبيل براح والحبل الهل وقد حبات المرأة فهى حبلى
  ونسوة حبالى وحباليات لانه ليس لها أفعل ففارق بجع الصغرى والاصل حبالى بكسر اللام
  لان كل جع نالثه ألف انكسر الحرف الذى بعدها نحومساجد وجعافر تم أبدلواص اليا.
  المنقلبمن ألف التأنيث ألفافة الواحب الى بفتح اللام ايفرقوا بين الالذين كماقلناه فى الصحارى
  وليكون الحبالى كمبلى فى ترل صرة الانهم لولم يعدلو السقطت الياءلدخول التنوين كمات-قط
  فى جوار والنسبة الى حبلى حبلى وحبلوى" وحبلاوى وقال أبوزيد يقال سبلى فى كل
  ذات ظغر وأنشد • أوذيخة حبلى مجح مق رب• ويقال كان ذلات فى محبل فلان أى فى وقت
  حدل أمه به وحبل المبلة نتاج النتاج وواد الجنين وفى الحديث نهى عن حبل الحبلة
  وأحبله أى ألقده والجلذ أيضا بالتهريك القضيب من الكرم ورباجاه بالتسكين والحبالة التى
  ٤٢
  ١ فى نسحة زيادة النسابقة
  المعدى اه
  ⁦(٢)⁩ فى نسضة زيادة الشاعر
  أبو طالبا
  ٣ نسخة زيادة عبداللّه بن
  سليم من بنى ثعلبة اه
