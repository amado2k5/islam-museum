text: "… وأخذوا خيل الأتراك من الإصطبلات. امتناع الركْب من العراق ولم يخرج رَكْبٌ من العراق في هذه السنة. وفاة ابن حاجب النّعمان وتُوفّي ابن حاجب، النُّعمان الكاتب. شراء ملك الروم نصف الرُّها وفيها اشترى ملك الروم النَّصْرانيّ نصف مدينة الرُّها بعشرين …"
