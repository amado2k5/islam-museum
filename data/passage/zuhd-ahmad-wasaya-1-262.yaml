text: "… أَخَذَ بِيَدِهِ وَقَالَ: يَا مُعَاذُ! وَاللّهَّ إِنِّي لأُحِبُّكَ، وَاللهَ إِنِّي لأُحِبُّكَ. فَقَالَ: أُوصِيكَ يَا مُعَاذُ لا تَدَعَنَّ فِي دُبُرِ كُلِّ صَلاَةٍ، تَقُولُ: اللَّهُمَّ أَعِنِّى عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ. وفي صحيح مسلم عنه لاقال: إِنَّ اللّهَ لَيَرْضَى عَنْ الْعَبْدِ يَأْكُلَ …"
