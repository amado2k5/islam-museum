text: "٦٩ الفصل الرابع ح / ٣١ الألواح أمة إذا همَّ أحَدُهم بحسَنةٍ فلم يَعْمَلْها كُتِبَ لَه حسنةً واحدة، فإن عمِلها كُتبت له عَشْرُ حسنات فاجعلها أمتي، قال تلك أمة أحمد؛ قال يا رب إني أجد في الألواح أمةً إذا همَّ …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، ص 69، يذكر عدد الحسنات، وكتابة الحسنات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, p. 69, that speaks of a stated number of good deeds, the writing of good deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، ابو نعیم کے صفحہ 69 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
