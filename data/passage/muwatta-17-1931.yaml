label: { ar: "الموطأ 1931 — مالك: لا خير فيه اثنان بواحد من صنف واحد إلى أجل، فإذا اختلف الصنفان فبان اختلافهما فلا بأس، أما ما يشبه صنفا آخر وإن اختلف في الاسم، كالرصاص والآنك والشبه والصفر، فإنه يكره أن يؤخذ منه اثنان بواحد إلى أجل", en: "Muwatta 1931" }
summary:
  ar: "قال مالك: ولا خير فيه، اثنان بواحد من صنف واحد، إلى أجل. فإذا اختلف الصنفان من ذلك فبان اختلافهما، فلا بأس بأن يؤخذ منه اثنان بواحد إلى أجل. فإن كان الصنف منه يشبه الصنف الآخر، وإن اختلفا في الاسم، مثل الرصاص والآنك والشبه والصفر، فإني أكره أن يؤخذ منه اثنان بواحد إلى أجل. {cite:muwatta-maruf-1997 p.190}"
