label: { ar: "الموطأ 1931 — مالك: لا خير فيه اثنان بواحد من صنف واحد إلى أجل، فإذا اختلف الصنفان فبان اختلافهما فلا بأس، أما ما يشبه صنفا آخر وإن اختلف في الاسم، كالرصاص والآنك والشبه والصفر، فإنه يكره أن يؤخذ منه اثنان بواحد إلى أجل", en: "Muwatta 1931", es: "Muwatta 1931", fr: "Muwatta 1931", ur: "موطا 1931", tr: "El-Muvatta 1931 — Malik: Aynı türden iki şeyi kredili olarak bir şeyle değiştirmek iyi değildir. İki tür farklıysa ve aralarındaki fark açıkça belliyse, bunda bir sakınca yoktur. Kurşun, kalay, pirinç ve bakır gibi, isim olarak farklı olsa bile birbirine benzeyen şeyler için ise kredili olarak iki şeyi bir şeyle değiştirmek mekruhtur.", id: "Al-Muwatta 1931 — Malik: Tidak ada manfaatnya menukar dua barang sejenis dengan satu barang sejenis secara kredit. Jika kedua jenis barang tersebut berbeda dan perbedaannya jelas, maka tidak ada salahnya. Adapun barang yang menyerupai jenis lain, meskipun berbeda nama, seperti timah, tembaga, kuningan, dan tembaga, menukar dua barang dengan satu barang secara kredit adalah perbuatan yang tidak disukai." }
summary:
  ar: "قال مالك: ولا خير فيه، اثنان بواحد من صنف واحد، إلى أجل. فإذا اختلف الصنفان من ذلك فبان اختلافهما، فلا بأس بأن يؤخذ منه اثنان بواحد إلى أجل. فإن كان الصنف منه يشبه الصنف الآخر، وإن اختلفا في الاسم، مثل الرصاص والآنك والشبه والصفر، فإني أكره أن يؤخذ منه اثنان بواحد إلى أجل. {cite:muwatta-maruf-1997 p.190}"
  tr: "Malik şöyle dedi: Aynı türden iki ürünü bir alana bir bedava şeklinde krediyle almakta bir fayda yok. Eğer iki tür farklıysa ve aralarındaki fark açıksa, krediyle iki alana bir bedava almakta bir sakınca yoktur. Ancak iki tür benzerse, isimleri farklı olsa bile, örneğin kurşun, kalay, pirinç ve bakır gibi, o zaman krediyle iki alana bir bedava almayı sevmem. {cite:muwatta-maruf-1997 s.190}"
  id: "Malik berkata: Tidak ada gunanya membeli dua barang dengan harga satu untuk jenis yang sama, secara kredit. Jika kedua jenis tersebut berbeda dan perbedaannya jelas, maka tidak ada salahnya membeli dua barang dengan harga satu secara kredit. Tetapi jika kedua jenis tersebut serupa, meskipun berbeda nama, seperti timbal, timah, kuningan, dan tembaga, maka saya tidak suka membeli dua barang dengan harga satu secara kredit. {cite:muwatta-maruf-1997 p.190}"
