label: { ar: "صحيح البخاري 4343 — الحرام", en: "Sahih al-Bukhari 4343 — the unlawful", ur: "صحیح بخاری 4343 — حرام", es: "Sahih al-Bukhari 4343 — lo ilícito" }
text: "… سَعِيدِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ ـ أَنَّ النَّبِيَّ بَعَثَهُ إِلَى الْيَمَنِ، فَسَأَلَهُ عَنْ أَشْرِبَةٍ تُصْنَعُ بِهَا، فَقَالَ \" وَمَا هِيَ \". قَالَ الْبِتْعُ وَالْمِزْرُ. فَقُلْتُ لأَبِي بُرْدَةَ مَا الْبِتْعُ قَالَ نَبِيذُ الْعَسَلِ، وَالْمِزْرُ نَبِيذُ الشَّعِيرِ. فَقَالَ \" كُلُّ مُسْكِرٍ حَرَامٌ \". رَوَاهُ جَرِيرٌ وَعَبْدُ الْوَاحِدِ عَنِ الشَّيْبَانِيِّ عَنْ أَبِي بُرْدَةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4343، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4343 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4343، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4343 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
