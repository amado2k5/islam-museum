text: "… وفي السنة للخلال عن إسحاق بن منصور قال: قلت لإسحاق ابن راهويه : هل للإيمان مُنتهى حتى نستطيع أن نقول: المرء مستكمل الإيمان؟ قال: لا ؛ لأن جميع الطاعة من الإيمان، فلا يمكن أن نشهد باستكمال الإيمان لأحدٍ إلَّا للأنبياء، …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 338، يذكر ما عُدّ من الإيمان، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 338, that mentions what is counted as part of faith, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 338 کا اقتباس جس میں جو ایمان میں سے گنا گیا، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 338, que menciona lo que se considera parte de la fe, la dulzura y la plenitud de la fe; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'Abd Allah ibn Ahmad, p. 338, évoquant ce qui est considéré comme faisant partie de la foi, sa douceur et sa plénitude; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, imanın özünü, tatlılığını ve mükemmelliğini anlatan 338. sayfadan bir alıntı; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 338, menyebutkan apa yang membentuk iman, kemanisannya, dan kesempurnaannya; dari edisi yang dipindai dan dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
