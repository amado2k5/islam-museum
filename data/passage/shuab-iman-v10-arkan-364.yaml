text: "… القائم. وأخبرنا أبو محمد بن يوسف، أخبرنا أبو سعيد بن الأعرابي، حدثنا أبوداون، حدثنا قتيبة بن سعيد، حدثنا يعقوب الإسكندراني، عن عمرو، عن المطلب، عن عائشة قالت: سمعتُ رسول اللّٰه وَالِقِ يقول: إن المؤمن ليدرك بحسن خلقه درجة الصائم القائم. …"
