text: "… ركوعه وسهجوده ويا بنى اذا سجدت فامكن جبهتك وكفيك من الارض ولا تنقر نقر الديك ولا تقع اقماء الكلب او قال الثعلب واياك والالتفات فى الصلاة فان الالتفات فى الصلاة هلكة فان كان ولا بدففى النافلة لا فى الفريضة ويا …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 146، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 1, p. 146, whose wording mentions the obligation (farida), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 146 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de Damascus de Ibn 'Asakir, volume numérisé 1, p. 146, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de Damascus de Ibn 'Asakir, volumen digitalizado 1, p. 146, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
