text: "… بذلك أهل العِظات، ومزج حلالها بالمؤنات، وحرامَها بالتَّبِعات، فالمُثري فيها تعِب، والمُقِلُّ فيها نَصِب... في كلمات أكثر من هذا. عُمرَ، حدَّثنا أَبو زرعة، حدَّثنا أبو مُسْهِر، عن سعيدِ ابن عبدِ العزيز : أن عمر بن الخَطَّاب هو ولى أَبا الدرداء …"
