label: { ar: "الموطأ 1445 — ربيعة عن محمد بن إبراهيم بن الحارث التيمي: سمعت أبي يقول تستحب العقيقة ولو بعصفور", en: "Muwatta 1445", es: "Muwatta 1445", fr: "Muwatta 1445", ur: "موطا 1445", tr: "El-Muvatta 1445 — Rabi’ah, Muhammed ibn İbrahim ibn el-Harith el-Taymi’den rivayetle: Babamın şöyle dediğini işittim: Akika kurbanını serçe ile bile kesmek müstehaptır.", id: "Al-Muwatta 1445 — Rabi’ah berdasarkan riwayat Muhammad ibn Ibrahim ibn al-Harith al-Taymi: Aku mendengar ayahku berkata: Dianjurkan untuk melaksanakan akikah meskipun hanya dengan seekor burung pipit." }
text: "تسْتَحبُّ الْعَقيقةُ، وَلَوْ بِعُصْفُورٍ"
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن محمد بن إبراهيم بن الحارث التيمي أنه قال سمعت أبي يقول تستحب العقيقة، ولو بعصفور. ويذكر المحقق أن في نسخة بعضها أنه يستحب. {cite:muwatta-maruf-1997 p.646}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da Muhammed ibn İbrahim ibn al-Harith al-Taymi'den rivayet ettiğine göre şöyle buyurmuştur: Babamın şöyle dediğini işittim: Akika (yeni doğmuş bebek için kurban) bir serçe ile bile olsa müstehaptır. Editör, bazı rivayetlerde bunun müstehaptır şeklinde belirtildiğini de ekliyor. {cite:muwatta-maruf-1997 s.646}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, bahwa beliau berkata: Aku mendengar ayahku berkata bahwa aqiqah (kurban untuk bayi yang baru lahir) dianjurkan, meskipun hanya dengan burung pipit. Editor menyebutkan bahwa dalam beberapa versi disebutkan bahwa hal itu dianjurkan. {cite:muwatta-maruf-1997 p.646}"
