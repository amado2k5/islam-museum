label: { ar: "الموطأ 2144 — يحيى عن مالك: فيمن أخذ مالا قراضا، فقال له ربه: لا تشتر به حيوانا ولا سلعا كذا وكذا، فيشتري ما نهي عنه يريد بذلك أن يضمن المال، فرب المال بالخيار: إن أحب دخل معه في السلعة على الربح المشترط، وإن أحب فله رأس ماله ضامنا على من تعدى", en: "Muwatta 2144", es: "Muwatta 2144", fr: "Muwatta 2144", ur: "موطا 2144", tr: "El-Muvatta 2144 — Yahya, Malik'ten rivayetle: Kâr paylaşımı ortaklığı için para alan ve sahibi ona, “Bu parayla hayvan veya şu mallardan satın alma” diyen, ancak parayı güvence altına almak amacıyla haram olanı satın alan kimse için, para sahibinin iki seçeneği vardır: İsterse, kararlaştırılan kârla birlikte mallara ortak olabilir; isterse de sermayesine hak kazanır ve kim haddini aşarsa ona karşı sorumludur.", id: "Al-Muwatta 2144 — Yahya berdasarkan riwayat Malik: Mengenai orang yang mengambil uang untuk kemitraan bagi hasil, dan pemiliknya berkata kepadanya: Jangan membeli hewan atau barang ini dan itu dengan uang itu, dan dia membeli apa yang dilarang, dengan maksud untuk mengamankan uang tersebut, maka pemilik uang memiliki pilihan: jika dia mau, dia dapat ikut serta dalam perdagangan barang tersebut dengan keuntungan yang disepakati, dan jika dia mau, dia berhak atas modalnya, dan bertanggung jawab kepada siapa pun yang melanggar." }
summary:
  ar: "قال: وكذلك أيضا من أخذ مالا قراضا من صاحبه، فقال له رب المال: لا تشتر به حيوانا ولا سلعا كذا وكذا، لسلع يسميها، وينهاه عنها، ويكره أن يضع ماله فيها. فيشتري الذي أخذ المال الذي هي عنه، يريد بذلك أن يضمن المال، ويذهب بربح صاحبه. فإذا صنع ذلك، فرب المال بالخيار: إن أحب أن يدخل معه في السلعة على ما شرطا بينهما من الربح، فعل، وإن أحب فله رأس ماله ضامنا على الذي أخذ المال وتعدى. {cite:muwatta-maruf-1997 p.277}"
  tr: "Şöyle dedi: Benzer şekilde, birisi arkadaşından borç para alırsa ve borç veren ona, \"Bu parayı belirli hayvanları veya malları satın almak için kullanma\" diyerek, malları belirtip bunları kullanmasını yasaklarsa ve parasını bunlara yatırmasını hoş karşılamazsa, borç veren de parayı güvence altına almak ve kendi karını almak amacıyla bu malları satın alırsa, borç verenin iki seçeneği vardır: Eğer anlaştıkları kar oranına göre işlemde yer almak isterse, bunu yapabilir; ya da isterse, parayı alan ve haksızlığa uğrayan borç verene karşı sorumlu olarak sermayesini geri alma hakkına sahiptir. {cite:muwatta-maruf-1997 s.277}"
  id: "Dia berkata: Demikian pula, jika seseorang meminjam uang dari temannya, dan pemberi pinjaman mengatakan kepadanya, \"Jangan gunakan uang itu untuk membeli hewan atau barang tertentu,\" dengan menyebutkan barang-barang tersebut dan melarangnya menggunakannya, serta tidak menyukai jika ia menginvestasikan uangnya pada barang-barang tersebut, dan kemudian pemberi pinjaman membeli barang-barang tersebut, dengan maksud untuk mengamankan uang dan mengambil keuntungan pemberi pinjaman, maka pemberi pinjaman memiliki pilihan: jika ia ingin berpartisipasi dalam transaksi tersebut sesuai dengan keuntungan yang telah mereka sepakati, ia dapat melakukannya; atau jika ia lebih suka, ia berhak atas modalnya, dan tetap bertanggung jawab kepada pemberi pinjaman yang mengambil uang dan melakukan pelanggaran. {cite:muwatta-maruf-1997 p.277}"
