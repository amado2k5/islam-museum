label: { ar: "الموطأ 2144 — يحيى عن مالك: فيمن أخذ مالا قراضا، فقال له ربه: لا تشتر به حيوانا ولا سلعا كذا وكذا، فيشتري ما نهي عنه يريد بذلك أن يضمن المال، فرب المال بالخيار: إن أحب دخل معه في السلعة على الربح المشترط، وإن أحب فله رأس ماله ضامنا على من تعدى", en: "Muwatta 2144" }
summary:
  ar: "قال: وكذلك أيضا من أخذ مالا قراضا من صاحبه، فقال له رب المال: لا تشتر به حيوانا ولا سلعا كذا وكذا، لسلع يسميها، وينهاه عنها، ويكره أن يضع ماله فيها. فيشتري الذي أخذ المال الذي هي عنه، يريد بذلك أن يضمن المال، ويذهب بربح صاحبه. فإذا صنع ذلك، فرب المال بالخيار: إن أحب أن يدخل معه في السلعة على ما شرطا بينهما من الربح، فعل، وإن أحب فله رأس ماله ضامنا على الذي أخذ المال وتعدى. {cite:muwatta-maruf-1997 p.277}"
