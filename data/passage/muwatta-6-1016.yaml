label: { ar: "الموطأ 1016 — عبد الله بن أبي بكر عن عبد الله بن عامر بن ربيعة: رأيت عثمان بن عفان بالعرج وهو محرم في يوم صائف، قد غطى وجهه بقطيفة أرجوان، ثم أُتي بلحم صيد، فقال لأصحابه: كلوا. فقالوا: أولا تأكل أنت؟ فقال: إني لست كهيئتكم، إنما صيد من أجلي", en: "Muwatta 1016" }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن عبد الله بن عامر بن ربيعة، قال: رأيت عثمان بن عفان بالعرج وهو محرم في يوم صائف، قد غطى وجهه بقطيفة أرجوان، ثم أُتي بلحم صيد، فقال لأصحابه: كلوا. فقالوا: أولا تأكل أنت؟ فقال: إني لست كهيئتكم، إنما صيد من أجلي. ويذكر المحقق أن في نسخة م «عبد الرحمن» خطأ بيّن، وأنه رواه عن مالك أبو مصعب (1147) وسويد (577). {cite:muwatta-maruf-1997 p.476}"
