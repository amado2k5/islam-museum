label: { ar: "الموطأ 1016 — عبد الله بن أبي بكر عن عبد الله بن عامر بن ربيعة: رأيت عثمان بن عفان بالعرج وهو محرم في يوم صائف، قد غطى وجهه بقطيفة أرجوان، ثم أُتي بلحم صيد، فقال لأصحابه: كلوا. فقالوا: أولا تأكل أنت؟ فقال: إني لست كهيئتكم، إنما صيد من أجلي", en: "Muwatta 1016", es: "Muwatta 1016", fr: "Muwatta 1016", ur: "موطا 1016", tr: "El-Muvatta 1016 — Abdullah ibn Abi Bekr, Abdullah ibn Amir ibn Rabi’ah’dan rivayetle: Sıcak bir yaz gününde, El-Arj’da Osman ibn Affan’ı ihramlı halde gördüm. Yüzünü mor kadife bir bezle örtmüştü. Sonra kendisine av eti getirildi ve arkadaşlarına: “Yiyin” dedi. Onlar: “Sen yemeyecek misin?” dediler. Osman: “Ben sizin gibi değilim. Bu benim için avlandı” dedi.", id: "Al-Muwatta 1016 — Abdullah ibn Abi Bakr, berdasarkan riwayat Abdullah ibn Amir ibn Rabi’ah: Aku melihat Utsman ibn Affan di Al-Arj, dalam keadaan ihram, pada suatu hari yang panas. Ia menutupi wajahnya dengan kain beludru ungu. Kemudian daging buruan dibawa kepadanya, dan ia berkata kepada para sahabatnya: Makanlah. Mereka berkata: Tidakkah engkau mau makan? Ia berkata: Aku tidak seperti kalian. Daging ini diburu untukku." }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن عبد الله بن عامر بن ربيعة، قال: رأيت عثمان بن عفان بالعرج وهو محرم في يوم صائف، قد غطى وجهه بقطيفة أرجوان، ثم أُتي بلحم صيد، فقال لأصحابه: كلوا. فقالوا: أولا تأكل أنت؟ فقال: إني لست كهيئتكم، إنما صيد من أجلي. ويذكر المحقق أن في نسخة م «عبد الرحمن» خطأ بيّن، وأنه رواه عن مالك أبو مصعب (1147) وسويد (577). {cite:muwatta-maruf-1997 p.476}"
  tr: "Malik, Abdullah ibn Abi Bakr'dan, o da Abdullah ibn Amir ibn Rabi'ah'tan rivayet ederek şöyle demiştir: \"Sıcak bir yaz gününde, el-Arj'da Osman ibn Affan'ı ihramlı halde gördüm. Yüzünü mor kadife bir bezle örtmüştü. Sonra kendisine av eti getirildi ve arkadaşlarına 'Yiyin' dedi. Onlar da 'Sen yemeyecek misin?' dediler. Osman da 'Ben sizin gibi değilim; bu benim için avlandı' dedi.\" Editör, M el yazmasında \"Abd al-Rahman\" ile ilgili açık bir hata olduğunu ve bunun Malik'ten Ebu Mus'ab (1147) ve Suwaid (577) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.476}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Abi Bakr, yang juga meriwayatkan dari Abdullah ibn Amir ibn Rabi’ah, yang berkata: Aku melihat Utsman ibn Affan di al-Arj, dalam keadaan ihram, pada suatu hari yang panas. Ia menutupi wajahnya dengan kain beludru ungu. Kemudian daging buruan dibawa kepadanya, dan ia berkata kepada para sahabatnya: Makanlah. Mereka berkata: Tidakkah engkau mau makan? Ia berkata: Aku tidak seperti kalian; daging ini diburu untukku. Editor mencatat bahwa dalam manuskrip M terdapat kesalahan yang jelas mengenai “Abd al-Rahman,” dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1147) dan Suwaid (577). {cite:muwatta-maruf-1997 p.476}"
