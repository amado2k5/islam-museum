text: "فَلَمَّا تَعَلَّمْتُهُ كَانَ إِذَا كَتَبَ إِلَى يَهُودَ كَتَبْتُ إِلَيْهِمْ وَإِذَا كَتَبُوا إِلَيْهِ قَرَأْتُ لَهُ كِتَابَهُمْ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ ‏.‏ وَقَدْ رُوِيَ مِنْ غَيْرِ هَذَا الْوَجْهِ عَنْ زَيْدِ بْنِ ثَابِتٍ رَوَاهُ الأَعْمَشُ عَنْ ثَابِتِ بْنِ عُبَيْدٍ الأَنْصَارِيِّ عَنْ زَيْدِ بْنِ ثَابِتٍ قَالَ أَمَرَنِي رَسُولُ اللَّهِ صلى الله عليه وسلم أَنْ أَتَعَلَّم …"
summary:
  ar: "في جامع الترمذي؛ إرسال كتاب أو رسالة إلى طرف."
