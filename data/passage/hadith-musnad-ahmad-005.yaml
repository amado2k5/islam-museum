text: "بأرض وأنتم بها ، فلا تخرجوا فرارا منه». قال: فرجع عمر بن الخطاب من الشام. [راجع: ١٦٦٦]. (إسناده صحيح، خ: ٥٧٢٩، م: ٢٢١٩). ١٩٤/١) - ١٦٧٩) حدثنا عبد الرزاق: أخبرنا معمر عن الزهري، عن عبد الحميد بن عبد الرحمن بن"
