label: { ar: "سنن أبي داود 774 — الأب والأبوة", en: "Sunan Abi Dawud 774 — the father and fatherhood", ur: "سنن ابی داؤد 774 — باپ اور والدیت", es: "Sunan Abi Dawud 774 — El padre y la paternidad", fr: "Sunan Abi Dawud 774 — Le père et la paternité", tr: "Sunan Abi Davud 774 — Baba ve Babalık", id: "Sunan Abi Dawud 774 — Sang Ayah dan Peran Ayah" }
text: "… يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا شَرِيكٌ، عَنْ عَاصِمِ بْنِ عُبَيْدِ اللَّهِ، عَنْ عَبْدِ اللَّهِ بْنِ عَامِرِ بْنِ رَبِيعَةَ، عَنْ أَبِيهِ، قَالَ عَطَسَ شَابٌّ مِنَ الأَنْصَارِ خَلْفَ رَسُولِ اللَّهِ وَهُوَ فِي الصَّلاَةِ فَقَالَ الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ حَتَّى يَرْضَى رَبُّنَا وَبَعْدَ مَا يَرْضَى مِنْ أَمْرِ الدُّنْيَا وَالآخِرَةِ فَلَمَّا انْصَرَفَ رَسُولُ اللَّهِ قَالَ \" مَنِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 774، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 774 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 774، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 774 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 774 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 774 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 774, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
