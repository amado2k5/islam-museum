text: "الشافعي، صاحب المصنفات الكثيرة في القراءات وغيرها، ولد سنة أربعين وستمائة بقلعة جعبر، واشتغل ببغداد، ثم قدم دمشق وأقام ببلد الخليل نحو أربعين سنة يقرىء الناس، وشرح الشاطبية وسمع الحديث، وكانت له إجازة من يوسف بن خليل الحافظ، وصنف بالعربية …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 1، ص 558، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
