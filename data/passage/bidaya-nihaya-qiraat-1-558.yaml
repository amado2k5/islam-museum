text: "الشافعي، صاحب المصنفات الكثيرة في القراءات وغيرها، ولد سنة أربعين وستمائة بقلعة جعبر، واشتغل ببغداد، ثم قدم دمشق وأقام ببلد الخليل نحو أربعين سنة يقرىء الناس، وشرح الشاطبية وسمع الحديث، وكانت له إجازة من يوسف بن خليل الحافظ، وصنف بالعربية …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 1، ص 558، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 1, p. 558, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 1، ص 558 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 1, pág. 558, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 1, p. 558), mentionne les lectures du Coran et les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 1. cildinin 558. sayfasından, Kur'an'ın farklı okunuşlarını ve okuyucularını ele alan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 1, halaman 558, yang menyebutkan berbagai bacaan Al-Quran dan para qarinya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
