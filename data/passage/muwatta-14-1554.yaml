label: { ar: "الموطأ 1554 — ابن شهاب عن القاسم بن محمد: إذا نكح الحر الأمة فمسها فقد أحصنته", en: "Muwatta 1554", es: "Muwatta 1554", fr: "Muwatta 1554", ur: "موطا 1554", tr: "El-Muvatta 1554 — İbn Şihab, El-Kâsım bin Muhammed'den rivayetle: Eğer hür bir adam bir cariye ile evlenir ve ona dokunursa, o cariye onun iffetli eşi olur.", id: "Al-Muwatta 1554 — Ibn Shihab berdasarkan riwayat Al-Qasim bin Muhammad: Jika seorang pria merdeka menikahi seorang wanita budak dan menyentuhnya, maka wanita itu telah menjadi istrinya yang suci." }
summary:
  ar: "يروي مالك عن ابن شهاب، وبلغه عن القاسم بن محمد، أنهما كانا يقولان إذا نكح الحر الأمة فمسها فقد أحصنته. {cite:muwatta-maruf-1997 p.49}"
  tr: "Malik, İbn Şihab'dan rivayet eder ve bu da ona el-Kasım ibn Muhammed'den nakledilmiştir ki, ikisi de şöyle derlerdi: Eğer hür bir adam bir cariye ile evlenir ve ona dokunursa, o kadın onun karısı olur. {cite:muwatta-maruf-1997 s.49}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dan hadits ini sampai kepadanya dari al-Qasim bin Muhammad, bahwa mereka berdua biasa berkata: Jika seorang laki-laki merdeka menikahi seorang perempuan budak dan menyentuhnya, maka perempuan itu telah menjadi istrinya. {cite:muwatta-maruf-1997 p.49}"
