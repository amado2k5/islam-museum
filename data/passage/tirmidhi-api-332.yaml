text: "… عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، عَنْ أَبِي سَعِيدٍ، أَنَّ النَّبِيَّ صَلَّى عَلَى حَصِيرٍ. قَالَ وَفِي الْبَابِ عَنْ أَنَسٍ وَالْمُغِيرَةِ بْنِ شُعْبَةَ. قَالَ أَبُو عِيسَى وَحَدِيثُ أَبِي سَعِيدٍ حَدِيثٌ حَسَنٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ. إِلاَّ أَنَّ قَوْمًا مِنْ أَهْلِ الْعِلْمِ اخْتَارُوا الصَّلاَةَ عَلَى الأَرْضِ اسْتِحْبَابًا. وَأَبُو سُفْيَانَ اسْمُهُ طَلْحَةُ بْنُ نَافِعٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 332، يرد فيه ذكر المستحب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 332 (The Book on Salat (Prayer)), whose wording mentions the recommended (mustahabb). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 332، جس کے الفاظ میں مستحب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 332, dont le texte mentionne le recommandé (mustahabb). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 332, cuyo texto menciona lo recomendado (mustahabb). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami'ül-Tirmizi'de 332 numaralı hadis, tavsiye edilen amellerden bahsetmektedir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahları derleyen kişi, bu hadisi Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlemiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 332, menyebutkan amalan-amalan yang dianjurkan. Penyusun kitab tentang amalan wajib, anjuran, makruh, haram, dan dosa-dosa kecil ini menyusunnya bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
