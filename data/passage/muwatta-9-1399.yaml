  id: "Yahya meriwayatkan dari Malik, dari Nafi’, bahwa Abdullah ibn Umar berkata: “Hari Raya Idul Adha adalah dua hari setelah hari raya Idul Adha.” {cite:muwatta-maruf-1997 p.626}"
