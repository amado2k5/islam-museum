text: |-
  ⁦(فصل انخاء)⁩
  ١٤٧
  حسن الغذاء وجسم خبر فج أى ناعم قال العجاج
  غزا سوّى خلقها الخبرنجا * مأد الشباب عيشها الخرفا
  ( نجج ريح نجوج تلتوى فى هبو بها وقال الاصعى الخجوج من الرياح الشديدة المرّ
  وقد نجت والجنجة أيضا الانقياض والاستخفاء واختج الجمل فى سيره وذلك سرعة مع
  التواء ⁦( خدج)⁩ خدجت الناقة تخدج خداجاذهى خادج والولد خديج إذا ألقت ولدها
  قبل تمام الايام وان كار تامّ الخلق وفى الحديث كل صلاة لا يقرأفيها يأمّ الكتاب فهى خداج
  أى نقصان وأخدجت الناقة اذاجاءت بولدها ناقص الخلق وان كانت أيامسه تامة فهى
  مخدج والولد مخدج ومنه حديث علىّ رضوان اللّٰه عليه فى ذى الثدية مخدج اليدأى ناقص
  اليد قال ابن الاعرابى أخدجت الشتوة أى قل مطرهاً ( ديج لخدلحة يتشديد القدم
  المرأة الممتامة الذراعيز والساقين ⁦(خرج)⁩ خرج خرويا ومخرجارة_ديكون الخرج
  موضع الخروج بقال خرج مخر جاحسنا وهدامخرجه وأما المخرج فقديكون مصد رقولك
  أخرجه والفعول به واسم المكان والوقت تقول أخرجى مخرج صدق وهذا مخر جه لانّ
  الفعل اذا جاوزا لملاثة فالميم منه مضمومة مشل دحرج وهذامد حرحناقنبه مخرج
  ببنات الاربعة والاستخراج كالاستنباط واخرج والحراج الاتاوة ١ يجمع على أخراج
  وأخاريج وأخرجة والخرج اسم موضع بالمامة والخرج لسحاب أوّل ماينتأ يقال
  خرج له خرج حسن والخرج خلاف الدخل وخرّجه فى الادب فتخرج وهوخرتيج فلان على
  فعيل بالتشديد مثال عنيز يمعنى مفعول وناقة مخترجة اذا خرحت على خلقة الجمل والحرج من
  الاوعية معروف وهو عربى والجمع خرجة مثل جر وجرة والخراج ما يخرح فى اليدنمن
  القروح ورجل خرجة ولحة مثال همزة أى كنير اناروج والولوج وانلحارجى الذى يسود
  ينفسه من غبر أن يكون له قديم وبن والجارجية قوم من العرب والنسبة اليهم خادجى وقواه م
  أسرع من نكاح أم خارجة هى امرأة من مجيلة ولدت كثيرا من قبائل العرب كانوا ية ولون
  لها خطب فتة ول نسكح ٢ خارحة ابنها ولا يعلم ممن هو ويقال ه وخارجة بن بكربز يشكر
  ابن عدوان بن عمرو بن قيس عيلان وانخرج بالتدريك لونان سوادويياض يقال كبش
  أخرج وظليم أخرج بين الخرج قال انعجاج
  إنا إذ مذكى الحروب أرجا • واست للءوت جلا آخرجا
  أى لبست الحروب جلا فيه بيساض وحرة من لطخ الدم أى شهرت وعرفت كشهرة الاباق
  وتقول آخرجت النعامة اخرجاجا واخراجت اخريجاجا أى صارت خرجاء واللخسرجاءمن
  الشاء التى ابيضت رجلاها مع الخاصرتين عن أبى زيد وتخريج الراعية المرتع أن تأكل بعضه
  وتتركك بعضا وأرض مخترجة أى نبتها فى مكان دون مكان وعام فيه تخريج أى خصب وجدب
  وانخريج لعبة اهم يقال فيها خراج خراج مثل قطام قال الهذلى .
  أرقت له ذات العشاءكانه * مخاريق يدعى بديهنّ خرمخ
  والمخارجة المناهدة بالاصابع والتخارج التناهد (خرفج عيش مخرفج أى واسع
  وفى الحديث انه كره السراويل الخرفية قالواهى التى تقع على ظهور القدمين
  ⁦(١)⁩ قلت وقسرئ قوله تعالى أم
  تسألهم خرجا فراج وبك خير
  وأم تسألهم خراجا وكذاقولة
  تعالى فهل نجعل لك خرجا وخراجا
  اه مختار
  ٢ ى كان انخاطب يقوم على
  باب خباتها ويقول اها خطب
  بكسر أوله وقديضم والثاني
  ساكن عسلى كل وكذا فى أول
  نكح وثائيه وهما كلمتان كانت
  العرب تتزوج هما كاسبق
  للمؤاف اه
