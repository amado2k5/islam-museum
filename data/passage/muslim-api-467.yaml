label: { ar: "صحيح مسلم 467 — عدد الحسنات، عدد السيئات", en: "Sahih Muslim 467 — a stated number of good deeds; a stated number of bad deeds", ur: "صحیح مسلم 467 — نیکیوں کی مقررہ تعداد، برائیوں کی تعداد" }
text: "… صِغَارُ ذُنُوبِهِ فَيُقَالُ عَمِلْتَ يَوْمَ كَذَا وَكَذَا كَذَا وَكَذَا وَعَمِلْتَ يَوْمَ كَذَا وَكَذَا كَذَا وَكَذَا. فَيَقُولُ نَعَمْ. لاَ يَسْتَطِيعُ أَنْ يُنْكِرَ وَهُوَ مُشْفِقٌ مِنْ كِبَارِ ذُنُوبِهِ أَنْ تُعْرَضَ عَلَيْهِ. فَيُقَالُ لَهُ فَإِنَّ لَكَ مَكَانَ كُلِّ سَيِّئَةٍ حَسَنَةً. فَيَقُولُ رَبِّ قَدْ عَمِلْتُ أَشْيَاءَ لاَ أَرَاهَا هَا هُنَا \". فَلَقَدْ رَأَيْتُ رَسُولَ اللَّهِ ضَحِكَ حَتَّى بَدَتْ نَوَاجِذُهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 467، يذكر عدد الحسنات، وعدد السيئات، وإبدال السيئة حسنة. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 467 (The Book of Faith), that speaks of a stated number of good deeds, a stated number of bad deeds, a bad deed exchanged for a good one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 467، جس میں نیکیوں کی مقررہ تعداد، برائیوں کی تعداد، برائی کا نیکی سے بدل جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
