label: { ar: "صحيح مسلم 467 — عدد الحسنات، عدد السيئات", en: "Sahih Muslim 467 — a stated number of good deeds; a stated number of bad deeds", ur: "صحیح مسلم 467 — نیکیوں کی مقررہ تعداد، برائیوں کی تعداد", es: "Sahih Muslim 467 — un número determinado de buenas acciones; un número determinado de malas acciones", fr: "Sahih Muslim 467 — un nombre déterminé de bonnes actions; un nombre déterminé de mauvaises actions", tr: "Sahih Müslim 467 — İyi amellerin sayısı, kötü amellerin sayısı", id: "Sahih Muslim 467 — Jumlah amal baik, jumlah amal buruk" }
text: "… صِغَارُ ذُنُوبِهِ فَيُقَالُ عَمِلْتَ يَوْمَ كَذَا وَكَذَا كَذَا وَكَذَا وَعَمِلْتَ يَوْمَ كَذَا وَكَذَا كَذَا وَكَذَا. فَيَقُولُ نَعَمْ. لاَ يَسْتَطِيعُ أَنْ يُنْكِرَ وَهُوَ مُشْفِقٌ مِنْ كِبَارِ ذُنُوبِهِ أَنْ تُعْرَضَ عَلَيْهِ. فَيُقَالُ لَهُ فَإِنَّ لَكَ مَكَانَ كُلِّ سَيِّئَةٍ حَسَنَةً. فَيَقُولُ رَبِّ قَدْ عَمِلْتُ أَشْيَاءَ لاَ أَرَاهَا هَا هُنَا \". فَلَقَدْ رَأَيْتُ رَسُولَ اللَّهِ ضَحِكَ حَتَّى بَدَتْ نَوَاجِذُهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 467، يذكر عدد الحسنات، وعدد السيئات، وإبدال السيئة حسنة. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 467 (The Book of Faith), that speaks of a stated number of good deeds, a stated number of bad deeds, a bad deed exchanged for a good one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 467، جس میں نیکیوں کی مقررہ تعداد، برائیوں کی تعداد، برائی کا نیکی سے بدل جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 467 (El Libro de la Fe), habla de un número determinado de buenas acciones, un número determinado de malas acciones y una mala acción que se intercambia por una buena. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, registran, borran o ponderan una acción."
  fr: "Un hadith du Sahih Muslim, n° 467 (Le Livre de la Foi), mentionne un nombre précis de bonnes actions, un nombre précis de mauvaises actions, et la possibilité d'échanger une mauvaise action contre une bonne. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui permettent de compter, d'écrire, d'effacer ou de peser une action."
  tr: "Sahih Müslim'de 467 numaralı hadis, iyi amellerin sayısını, kötü amellerin sayısını ve bir iyi amelin yerine kötü bir amelin geçmesini zikreder. Bu hadis, iyi ve kötü amellerin listesini, amelleri sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 467, menyebutkan jumlah amal baik, jumlah amal buruk, dan penggantian amal buruk dengan amal baik. Hadits ini menggabungkan daftar amal baik dan buruk dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
