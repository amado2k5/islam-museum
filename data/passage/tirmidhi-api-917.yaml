label: { ar: "جامع الترمذي 917 — ما أُحل، ما حُرّم", en: "Jami' al-Tirmidhi 917 — what was made lawful; what was made unlawful", ur: "جامع ترمذی 917 — جو حلال کیا گیا، جو حرام کیا گیا", es: "Jami' al-Tirmidhi 917 — lo que se hizo lícito; lo que se hizo ilícito", fr: "Jami' al-Tirmidhi 917 — ce qui a été rendu licite; ce qui a été rendu illicite" }
text: "… مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ يَرَوْنَ أَنَّ الْمُحْرِمَ إِذَا رَمَى جَمْرَةَ الْعَقَبَةِ يَوْمَ النَّحْرِ وَذَبَحَ وَحَلَقَ أَوْ قَصَّرَ فَقَدْ حَلَّ لَهُ كُلُّ شَيْءٍ حَرُمَ عَلَيْهِ إِلاَّ النِّسَاءَ. وَهُوَ قَوْلُ الشَّافِعِيِّ وَأَحْمَدَ وَإِسْحَاقَ. وَقَدْ رُوِيَ عَنْ عُمَرَ بْنِ الْخَطَّابِ أَنَّهُ قَالَ حَلَّ لَهُ كُلُّ شَيْءٍ إِلاَّ النِّسَاءَ وَالطِّيبَ. وَقَدْ ذَهَبَ بَعْضُ أَهْلِ الْعِلْمِ إِلَى هَذَا مِنْ أَصْحَابِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 917، يذكر ما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 917 (The Book on Hajj), that mentions what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 917، جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 917 (El Libro del Hajj), menciona lo que se ha hecho lícito y lo que se ha hecho ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 917 (Le Livre du Hajj), mentionne ce qui a été déclaré licite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
