text: "… من العلماء أن القراءات السبع ليست هي الأحرف السبعة فصل في ذكر معنى حديث عمر وهشام بن حكيم في أن القرآن نزل على سبعة أحرف باب ذكر جمع القرآن، وسبب كتب عثمان المصاحف وإحراقه ما سواها، وذكر من حفظ فهرس …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 468، يذكر الأحرف السبعة، وقراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 468, that mentions the seven ahruf, the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 468 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
