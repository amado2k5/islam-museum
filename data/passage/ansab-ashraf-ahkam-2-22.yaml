text: "… حميش الساقين فهو لهلال ؛ وإن جاءت به أورق جعدا خدلَّج الساقين سايغ الإليثين فهو للذى رُميت به. فجاء على الصفة المكروهة، فقرّق رسول اللّٰه بين المتلاعنين، وقضى أن لا يُدعى ولد الملاعنة لأب، ولا تُرمَى ولا ولدها ؛ وأنّ …"
