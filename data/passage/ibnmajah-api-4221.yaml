label: { ar: "سنن ابن ماجه 4221 — الأب والأبوة", en: "Sunan Ibn Majah 4221 — the father and fatherhood", ur: "سنن ابن ماجہ 4221 — باپ اور والدیت", es: "Sunan Ibn Majah 4221 — El padre y la paternidad", fr: "Sunan Ibn Majah 4221 — Le père et la paternité", tr: "Sunan İbn Majah 4221 — Baba ve Babalık", id: "Sunan Ibn Majah 4221 — Ayah dan Peran Ayah" }
text: "… هَارُونَ، أَنْبَأَنَا نَافِعُ بْنُ عُمَرَ الْجُمَحِيُّ، عَنْ أُمَيَّةَ بْنِ صَفْوَانَ، عَنْ أَبِي بَكْرِ بْنِ أَبِي زُهَيْرٍ الثَّقَفِيِّ، عَنْ أَبِيهِ، قَالَ خَطَبَنَا رَسُولُ اللَّهِ ـ بِالنَّبَا أَوِ النَّبَاوَةِ - قَالَ وَالنَّبَاوَةُ مِنَ الطَّائِفِ - قَالَ \" يُوشِكُ أَنْ تَعْرِفُوا أَهْلَ الْجَنَّةِ مِنْ أَهْلِ النَّارِ \". قَالُوا بِمَ ذَاكَ يَا رَسُولَ اللَّهِ. قَالَ \" بِالثَّنَاءِ الْحَسَنِ وَالثَّنَاءِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4221، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4221 (Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4221، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 4221 (Zuhd), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 4221 (Zuhd), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 4221 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 4221, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
