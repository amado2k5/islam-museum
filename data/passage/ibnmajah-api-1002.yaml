label: { ar: "سنن ابن ماجه 1002 — الأب والأبوة", en: "Sunan Ibn Majah 1002 — the father and fatherhood", ur: "سنن ابن ماجہ 1002 — باپ اور والدیت", es: "Sunan Ibn Majah 1002 — El padre y la paternidad", fr: "Sunan Ibn Majah 1002 — Le père et la paternité", tr: "Sunan İbn Majah 1002 — Baba ve Babalık", id: "Sunan Ibn Majah 1002 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا زَيْدُ بْنُ أَخْزَمَ أَبُو طَالِبٍ، حَدَّثَنَا أَبُو دَاوُدَ، وَأَبُو قُتَيْبَةَ قَالاَ حَدَّثَنَا هَارُونُ بْنُ مُسْلِمٍ، عَنْ قَتَادَةَ، عَنْ مُعَاوِيَةَ بْنِ قُرَّةَ، عَنْ أَبِيهِ، قَالَ كُنَّا نُنْهَى أَنْ نَصُفَّ، بَيْنَ السَّوَارِي عَلَى عَهْدِ رَسُولِ اللَّهِ ـ وَنُطْرَدُ عَنْهَا طَرْدًا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1002، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1002 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1002، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1002 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1002 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 1002 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1002, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
