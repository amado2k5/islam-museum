text: "اسمَ أبي الحَكَم بأبي شُرَيْحِ لابو داود:، والتالي البخاري:. وغيَّرَ اسم حَزْنٍ جدٍّ سعيد بن المسيب وجعله فقال: ما اسْمُكَ؟ قال: مُرَّة، فقال: اجْلِسْ، فَقَامَ سمرة، فقال: يُسمَّى في اليوم السابع. فأمَّا الخِتَان، فقال ابنُ عبَّاس: كانوا لا يختنون الغلام …"
