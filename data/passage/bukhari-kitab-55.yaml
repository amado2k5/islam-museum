summary:
  ar: "القسم 55 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوصايا»، ويضم فيها النصوص من 2738 إلى 2781 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 55 of Sahih al-Bukhari (Wills and Testaments (Wasaayaa)) in the division of the open hadith dataset the museum took its reports from: reports 2738 to 2781 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 55، عنوان «کتاب الوصایا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2738 تا 2781۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 55 de Sahih al-Bukhari (Testamentos (Wasaayaa)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2738 al 2781 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 55 du Sahih al-Bukhari (Testaments et Remerciements – Wasaayaa), dans la section du recueil ouvert de hadiths: les hadiths 2738 à 2781 de cette section. Le musée conserve ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
