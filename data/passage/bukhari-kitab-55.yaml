  en: "Sahih al-Bukhari, Book 55: Wills and Testaments (Wasaayaa)"
  ur: "صحیح بخاری، کتاب الوصایا"
  es: "Sahih al-Bukhari, Libro 55: Testamentos y voluntades (Wasaayaa)"
