text: |-
  مخنا) .
  ٤٧١
  مصدرالم تثنّ ولم تجمع واذا جعلته اسما على فعيل ثنيت وجعت وأننت فقلت أنا خلى منك
  أى يرى"منك وفى المثل خلاؤك أقنى لحيائك أى.نزلات اذا خلوت فيه ألزم لحيائك والخلا.
  ممدود المتوضأ وانلحلا أيضا المكان لاشئبه وانطليمة الناقة تطلق من عقالها ويخلى عنها
  ويقال للمرأة أنت خلية كفاية عن الطلاق والخلية الناقة تعطف مع أخرى على ولد
  واحد فتدران عليه ويتغلى أهل البيت بواحدة يحلبونها ومنه قول الشاعر
  لها لبن الخلية والصعود• والخلية أيضا السفينة العظيمة ومنه قول طرفة
  خلاياسفين بالتواصف من دد وققول أنا خلو من كذا أى خال والطلية أيضابيت النحل
  الذى تعسل فيه وخلا كلمة يستشى بها وتنصب ما بعدها وتجرتقول جاؤنى خلازيد اتنصب بها
  اذا جعلته أذع-لا وتضمر فيها الفاعل كأنك قات خلامن جاءنى من زيدواذا قلت خ-لازيد
  فجررت فهى عن دبعض النحويين حرف جرّ بمنزلة حاشا وعند بعضهم مصدر مضاف وأما
  ما خلافلا يكون فيما بعدها الا النصب تقول ياؤنى ما خلازيدالات خلالا تكون بعدما الاصلة
  لها وهى معها.صدر كانك قات جاؤنى خلوزيد أى خلوهم من زيد تريد خالين-ن زيد وقواءم
  افعل كذا وخلال ذم أى أعذرت وسقطعنك الذمّ وخلاوة أبوبعن من أشجع وهو خلاوة بن
  سبيع بن يكربن أشمع وفى المثل أنا من هذا الامر فالج بن خلاوة أى برى منه وقد ذكرناه فى
  باب الجيم وانلخلىّ الخالى من الهتمّ وهو خلاف الشجىّ وقال الاصمعىّ الخالى من الرجال الذق
  لا زوجة له وأنشد لامرئ القيس* وأمنع عرسى أن يزت بها انخالى * قال والقرون انخالية
  هم المواضه والخلى مقصورا الرطب من الحشيس الواحدة خلاة وجاء فى المثل عبد وخلافى
  يديه أى أنه مع عبوديته غنى قال يعقوب ولا تقسل وخلى فى يديه وتقول خليت الخلى
  واختليته أى جززته وقطعته فانخلى والمخلى ما يجزبه الخلى والمخلاة ما يجعل فيه اتلولى قال ابن
  السمصكوت خليت دابى أخليها اذا جززت اها الخلى والسيف يختلى أى يقطع والمختلون
  والهالون الذين يختْاون الخلى وية طعونه وأخلت الارض أى كثرخلاها قال أبو عرو
  خلالك الشى وأخلى بعنى وأنشدت معن بن أوس
  أعاذل هل يأتى القبائل حظها • من الموت أم أخلى لنا الموت وحدنا .
  وأخليت المكان صادفته خاليا واستفلاه مجلم أى سأله أن يخليه له وأخليت أى خلوت
  وأخلرت غيرى يتعدّى ولا يتعدّى قال عتىّ بن مالك العقيلى
  أتيت مع الحذاث ليلى فلم أبن • فاخليت فاستهجت عند خلان
  وأخليت عن الطعام أى خسلوت عنه وخاليت الرجل تاركنه وتخليت تفرغت وخليت عنه
  وخليت سيله فهو مخلى ورأيته مخليا قال الشاعر
  مالى أراك مجلا • أين السلاسل واإقبود
  أغلا الحديد بأرضكم • أم ليس يضبطك الحديد
  ⁦( نا)⁩ الجنا الفمسْ وكلام خن وكلمة خنية وقد خنى عليه بالكسر وأخنى عليه فى منطقه
  ذا أ فحسْ قال أبوذؤيب
  فلاقفنوعلىّ ولا تشطوا * بقول الفخران الففرحوب
