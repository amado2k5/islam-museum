text: "… موسى وليس فيه لفظ: المرصوص. أخرجه في الجامع الصغير عن أحمد ومسلم بلفظ: مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد الخ. كذلك ذكره في الإحياء وقال عنه العراقي رواه الشيخان من حديث أنس: لا يؤمن أحدكم حتى يحب لأخيه …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 431، يذكر ما لا يتم الإيمان إلا به، ومَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 431, that mentions what faith is not complete without, the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 2، ص 431 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Muwafaqat de al-Shatibi, volumen 2, pág. 431, que menciona la semejanza del creyente, un elemento esencial para la fe. El texto, extraído de la lectura automática, se cita con un máximo de cuarenta palabras, según la política de fuentes. El navegador \"Pilares y Ramas de la Fe\" lo incluye."
  fr: "Extrait des <i>Muwafaqat</i> d'al-Shatibi (tome 2, p. 431) mentionnant que la foi est incomplète sans la ressemblance du croyant. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Şatibi'nin El-Muvefakat adlı eserinin 2. cildinin 431. sayfasından, iman için gerekli olan unsurları ve müminin örneğini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 2, halaman 431, yang menyebutkan hal-hal penting dalam iman dan contoh orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
