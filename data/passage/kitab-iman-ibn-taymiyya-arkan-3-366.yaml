text: "… - الإسلام هو الأركان الخمسة الإسلام هو الخمس أركانه الأنبياء، ثم الصالحون، ثم الأمثل فالأمثل الإيمان: الإقرار والتصديق بالعمل الإيمان: السماحة والصبر،، الإيمان أن تؤمن بالله وملائكته،،،،، الإيمان بالله وشهادة أن لا إله إلا اللّٰه الإيمان بضع وسبعون شعبة،،،، الإيمان …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 3، ص 366، يذكر أركان الإسلام، والإيمان بالله وملائكته وكتبه ورسله، والإيمان بضع وسبعون شعبة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 3, p. 366, that mentions the pillars of Islam, belief in God, His angels, His books and His messengers, faith as seventy-odd branches, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 3، ص 366 کا اقتباس جس میں ارکانِ اسلام، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 3, pág. 366, que menciona los pilares del Islam: la creencia en Dios, sus ángeles, sus libros y sus mensajeros, y la fe como setenta y tantos pilares, uno de los artículos de fe. Este extracto, extraído de la lectura automática y citado con un máximo de cuarenta palabras según la política de fuentes, se encuentra en la lista de los Pilares y Ramas de la Fe."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 3, p. 366) mentionnant les piliers de l'islam: la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers, et la foi divisée en soixante-dix branches. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 3. cildinin 366. sayfasından bir alıntı, İslam'ın temellerini, Allah'a, meleklerine, kitaplarına ve peygamberlerine imanı, yetmişten fazla iman dalını ve imanın temellerinden birini zikrediyor. Bu alıntı, kaynak yönergelerine uygun olarak, yaklaşık kırk kelimeyle sınırlı, makine tarafından okunabilir baskıdan alınmıştır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 3, halaman 366, menyebutkan rukun Islam, kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, tujuh puluh lebih cabang iman, dan salah satu rukun iman. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang iman, dan karakteristik seorang mukmin."
