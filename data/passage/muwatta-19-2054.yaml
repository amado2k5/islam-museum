label: { ar: "الموطأ 2054 — مالك: إذا كانت النفقة كلها والمؤونة على رب الحائط، ولم يكن على الداخل في المال شيء إلا أنه يعمل بيده، فإنما هو أجير ببعض التمر، وذلك لا يصلح، لأنه لا يدري كم إجارته إذا لم يسم له شيئا يعرفه", en: "Muwatta 2054", es: "Muwatta 2054", fr: "Muwatta 2054", ur: "موطا 2054", tr: "El-Muvatta 2054 — Malik: Eğer tüm masraflar ve giderler bahçe sahibi tarafından karşılanıyorsa ve mülke giren kişinin elleriyle çalışmaktan başka bir sorumluluğu yoksa, o sadece birkaç kuruş ödenen bir ücretli işçidir ve bu caiz değildir, çünkü kendisine belirtilen bir ücret miktarı yoksa, tam olarak ne kadar ücret alacağını bilemez.", id: "Al-Muwatta 2054 — Malik: Jika semua pengeluaran dan biaya ditanggung oleh pemilik kebun, dan orang yang memasuki properti tersebut tidak memikul tanggung jawab apa pun kecuali bekerja dengan tangannya, maka dia hanyalah seorang pekerja upahan yang dibayar sejumlah uang, dan ini tidak diperbolehkan, karena dia tidak mengetahui jumlah pasti upahnya jika tidak ada ketentuan yang ditentukan untuknya yang dia ketahui." }
summary:
  ar: "قال مالك: وإذا كانت النفقة كلها والمؤونة على رب الحائط، ولم يكن على الداخل في المال شيء، إلا أنه يعمل بيده، إنما هو أجير ببعض التمر، فإن ذلك لا يصلح؛ لأنه لا يدري كم إجارته، إذا لم يسم له شيئا يعرفه ويعمل عليه، لا يدري أيقل ذلك أم يكثر. {cite:muwatta-maruf-1997 p.241}"
  tr: "Malik şöyle dedi: Eğer tüm masraflar ve giderler bahçenin sahibi tarafından karşılanıyorsa ve işe giren kişi emeğinden başka hiçbir şey vermiyorsa, sadece belirli bir süre için ücret alan bir işçi ise, bu caiz değildir. Çünkü ne iş yapacağı belirtilmediğinden, alacağı ücretin tam miktarını bilmemektedir. Az mı yoksa çok mu olacağını bilmemektedir. {cite:muwatta-maruf-1997 s.241}"
  id: "Malik berkata: Jika semua pengeluaran dan biaya ditanggung oleh pemilik kebun, dan orang yang terjun ke bisnis tersebut tidak memberikan kontribusi apa pun kecuali tenaganya, hanya sebagai pekerja upahan yang dibayar sejumlah kurma, maka hal ini tidak diperbolehkan. Ini karena dia tidak mengetahui jumlah pasti upahnya, karena tidak ada yang ditentukan untuk dia kerjakan. Dia tidak tahu apakah upahnya akan sedikit atau banyak. {cite:muwatta-maruf-1997 p.241}"
