label:
  ar: "مسلم 2937 — أوحى الله إلى عيسى: حرز عبادي إلى الطور"
  en: "Muslim 2937 — God revealed to Isa: take My servants to safety on the Mount"
  ur: "مسلم 2937 — اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ"
text: "ما شأنكم . قلنا يا رسول الله ذكرت الدجال غداة فخفضت فيه ورفعت حتى ظنناه في طائفة النخل . فقال غير الدجال أخوفني عليكم إن يخرج وأنا فيكم فأنا حجيجه دونكم وإن يخرج ولست فيكم فامرؤ حجيج نفسه والله خليفتي …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2937: أوحى الله إلى عيسى: حرز عبادي إلى الطور. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2937: God revealed to Isa: take My servants to safety on the Mount. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2937: اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
