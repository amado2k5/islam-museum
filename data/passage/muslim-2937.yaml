ref: "2937"
label:
  ar: "مسلم 2937 — أوحى الله إلى عيسى: حرز عبادي إلى الطور"
  en: "Muslim 2937 — God revealed to Isa: take My servants to safety on the Mount"
  ur: "مسلم 2937 — اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ"
  es: "Muslim 2937 — Dios reveló a Isa: «Lleva a mis siervos a un lugar seguro en el Monte del Edén»."
  fr: "Muslim 2937 — Dieu révéla à Issa: « Mets Mes serviteurs en sécurité sur la montagne. »"
  tr: "Müslim 2937 — Allah, İsa'ya şöyle vahyetti: \"Kullarımı Sina Dağı'na götür.\""
  id: "Muslim 2937 — Tuhan mewahyukan kepada Yesus: “Bawalah hamba-hamba-Ku ke Gunung Sinai.”"
text: "ما شأنكم . قلنا يا رسول الله ذكرت الدجال غداة فخفضت فيه ورفعت حتى ظنناه في طائفة النخل . فقال غير الدجال أخوفني عليكم إن يخرج وأنا فيكم فأنا حجيجه دونكم وإن يخرج ولست فيكم فامرؤ حجيج نفسه والله خليفتي …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2937: أوحى الله إلى عيسى: حرز عبادي إلى الطور. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2937: God revealed to Isa: take My servants to safety on the Mount. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2937: اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2937: Dios reveló a Isa: «Lleva a Mis siervos a un lugar seguro en el Monte». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 2937: Dieu révéla à Jésus: « Mène Mes serviteurs en lieu sûr sur la montagne. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Müslim'de 2937 numaralı hadis-i kudsi şöyledir: Allah, İsa'ya şöyle vahyetti: \"Kullarımı Sina Dağı'na götür.\" Peygamberimiz bunu Rabbinden rivayet etti ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve Muvatta'da derlemiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2937: Allah mewahyukan kepada Isa: \"Bawalah hamba-hamba-Ku ke Gunung Sinai.\" Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
