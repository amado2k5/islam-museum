text: "… خِصَّال الإيمَان أنْ يُجِبُ ح - حَدْثَنَا مُحَمَّدُ ابْنُ الْمُثَنَّى وَابْنُ بَشَار، قَالا: حَدْثَنَا مُحَمَّدُ ابْنُ جَعْفَرٍ، حَدَّثَنًا شُعْبَةُ، قال: سَمِعْتُ قَتَادَةً يُحَدِّثُ عَنْ أَنَسِ أبْنٍ مَالِك، قال: قال رسول اللّه : لا يُؤْمِنُ أحَدُكُمْ حَتَّى أَكُونَ أحَبَ إِلَيْهِ مِنْ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 122، يذكر ما لا يتم الإيمان إلا به، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 122, that mentions what faith is not complete without, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 122 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 122, que menciona los elementos esenciales para que la fe sea completa: las características del creyente. Este fragmento, extraído de la lectura automática y citado con un máximo de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 122) mentionnant ce qui est indispensable à la foi: les qualités du croyant. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih Muslim'in 1. cildinin 122. sayfasında yer alan, imanın esas unsurlarını ve müminin özelliklerini anlatan, el-Nevevi'nin tefsirinden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 122, yang menyebutkan unsur-unsur penting iman dan karakteristik seorang mukmin; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
