text: "… خِصَّال الإيمَان أنْ يُجِبُ ح - حَدْثَنَا مُحَمَّدُ ابْنُ الْمُثَنَّى وَابْنُ بَشَار، قَالا: حَدْثَنَا مُحَمَّدُ ابْنُ جَعْفَرٍ، حَدَّثَنًا شُعْبَةُ، قال: سَمِعْتُ قَتَادَةً يُحَدِّثُ عَنْ أَنَسِ أبْنٍ مَالِك، قال: قال رسول اللّه : لا يُؤْمِنُ أحَدُكُمْ حَتَّى أَكُونَ أحَبَ إِلَيْهِ مِنْ …"
