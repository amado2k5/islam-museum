text: "… ما كان عليه من العتو والتمرد على الله فذكرنا إحسان الله وأياديه عند نسوح عم بطاعته ربع وصَيْره على ما لقى فيه من الاذى والمكروه فى عجل الدنيا بان نتجّاه ومَن آمن معه وأتبعه من قومه وجعل ذريته هم الباقين …"
summary:
  ar: "مقطع من تاريخ الطبري، المجلد المصوَّر 2، ص 216، يرد فيه ذكر المكروه، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Tabari's History, scan volume 2, p. 216, whose wording mentions the disliked (makruh), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ طبری، اسکین جلد 2، ص 216 کا اقتباس جس میں مکروہ، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de al-Tabari, volume numérisé 2, p. 216, dont le texte mentionne le réprouvé (makruh), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de al-Tabari, volumen digitalizado 2, p. 216, cuyo texto menciona lo reprobado (makruh), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Taberi'nin Resimli Tarih adlı eserinin 2. cildinin 216. sayfasından, mekruh edilen ve itaat edilmesi gereken fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat edilmesi gereken fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Al-Tabari, Jilid 2 Bergambar, halaman 216, yang menyebutkan perbuatan yang tidak disukai dan perbuatan yang wajib dilakukan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan yang wajib dilakukan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
