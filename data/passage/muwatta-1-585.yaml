label: { ar: "الموطأ 585 — مرسل عروة: إذا بدا حاجب الشمس فأخروا الصلاة حتى تبرز، وإذا غاب حاجب الشمس فأخروا الصلاة حتى تغيب", en: "Muwatta 585" }
text: "إذا بدا حاجب الشمس، فأخروا الصلاة حتى تبرز، وإذا غاب حاجب الشمس، فأخروا الصلاة حتى تغيب"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، أن النبي كان يأمر بتأخير الصلاة إذا بدا حاجب الشمس حتى تبرز، وإذا غاب حاجب الشمس حتى تغيب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي، وأن مالكاً أرسله هكذا ولا يصح عنه إلا مرسلاً، وأنه في الصحيحين (البخاري 1/152 و4/149، ومسلم 2/207) من طرق عن هشام بن عروة عن أبيه عن ابن عمر باختلاف لفظي يسير، ويحيل على التمهيد (22/327). {cite:muwatta-maruf-1997 p.301} {cite:muwatta-maruf-1997 p.302}"
