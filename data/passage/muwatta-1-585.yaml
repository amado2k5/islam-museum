label: { ar: "الموطأ 585 — مرسل عروة: إذا بدا حاجب الشمس فأخروا الصلاة حتى تبرز، وإذا غاب حاجب الشمس فأخروا الصلاة حتى تغيب", en: "Muwatta 585", es: "Muwatta 585", fr: "Muwatta 585", ur: "موطا 585", tr: "El-Muvatta 585 — Urve rivayet etmiştir: Güneşin kenarı görünürse, namazı tamamen görünür hale gelinceye kadar erteleyin; güneşin kenarı kaybolursa, namazı tamamen batıncaya kadar erteleyin.", id: "Al-Muwatta 585 — Diriwayatkan oleh Urwah: Jika tepi matahari terlihat, tunda salat sampai matahari terlihat sepenuhnya, dan jika tepi matahari menghilang, tunda salat sampai matahari benar-benar terbenam." }
text: "إذا بدا حاجب الشمس، فأخروا الصلاة حتى تبرز، وإذا غاب حاجب الشمس، فأخروا الصلاة حتى تغيب"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، أن النبي كان يأمر بتأخير الصلاة إذا بدا حاجب الشمس حتى تبرز، وإذا غاب حاجب الشمس حتى تغيب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي، وأن مالكاً أرسله هكذا ولا يصح عنه إلا مرسلاً، وأنه في الصحيحين ⁦(البخاري 1/152 و4/149، ومسلم 2/207)⁩ من طرق عن هشام بن عروة عن أبيه عن ابن عمر باختلاف لفظي يسير، ويحيل على التمهيد (22/327). {cite:muwatta-maruf-1997 p.301} {cite:muwatta-maruf-1997 p.302}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, sebagai hadits mursal, bahwa Nabi (shalawat dan salam kepadanya) biasa memerintahkan untuk menunda salat ketika sinar matahari muncul hingga tampak sepenuhnya, dan ketika sinar matahari menghilang hingga matahari terbenam. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan al-Qa'nabi, dan bahwa Malik meriwayatkannya demikian, dan hadits ini hanya sahih dinisbahkan kepadanya sebagai hadits mursal. Hadits ini juga ditemukan dalam dua kitab Sahih (al-Bukhari 1/152 dan 4/149, dan Muslim 2/207) melalui berbagai sanad dari Hisham ibn Urwah, dari ayahnya, dari Ibnu Umar, dengan sedikit variasi redaksi. Ia merujuk pada al-Tamhid (22/327). {kutip:muwatta-maruf-1997 hal.301} {kutip:muwatta-maruf-1997 hal.302}"
