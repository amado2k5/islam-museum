text: "… وَتُحَدِّثُنِي عَنْ رَأْيِكَ لَئِنْ أَخْرَجَنِي اللَّهُ لاَ أُسَاكِنْكَ بِأَرْضٍ لَكَ عَلَىَّ فِيهَا إِمْرَةٌ ‏.‏ فَلَمَّا قَفَلَ لَحِقَ بِالْمَدِينَةِ فَقَالَ لَهُ عُمَرُ بْنُ الْخَطَّابِ مَا أَقْدَمَكَ يَا أَبَا الْوَلِيدِ فَقَصَّ عَلَيْهِ الْقِصَّةَ وَمَا قَالَ مِنْ مُسَاكَنَتِهِ فَقَالَ ارْجِعْ يَا أَبَا الْوَلِيدِ إِلَى أَرْضِكَ فَقَبَحَ اللَّهُ أَرْضًا لَسْتَ فِيهَا وَأَمْثَالُكَ ‏.‏ وَكَتَبَ إِلَى مُعَاوِيَةَ لاَ إِمْرَةَ لَك …"
summary:
  ar: "في سنن ابن ماجه؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Ibn Majah; sending a letter or message to a party."
  ur: "سنن ابن ماجہ میں؛ کسی فریق کو خط یا پیغام بھیجنا."
