label: { ar: "الموطأ 1201 — يحيى بن سعيد: خرج عمر الغد من يوم النحر وكبر فكبر الناس بتكبيره حتى يبلغ البيت", en: "Muwatta 1201" }
text: "فَكَبَّرَ النَّاسُ بِتكبيرِهِ"
summary:
  ar: "بلغ يحيى بن سعيد أن عمر بن الخطاب خرج الغد من يوم النحر حين ارتفع النهار، فكبر، فكبر الناس بتكبيره. ثم خرج الثانية بعد ارتفاع النهار، ثم الثالثة حين زاغت الشمس، والناس يكبرون معه، حتى يتصل التكبير ويبلغ البيت، فيعلم أن عمر قد خرج يرمي. {cite:muwatta-maruf-1997 p.540}"
