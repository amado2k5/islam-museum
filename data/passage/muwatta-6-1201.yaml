label: { ar: "الموطأ 1201 — يحيى بن سعيد: خرج عمر الغد من يوم النحر وكبر فكبر الناس بتكبيره حتى يبلغ البيت", en: "Muwatta 1201", es: "Muwatta 1201", fr: "Muwatta 1201", ur: "موطا 1201", tr: "El-Muvatta 1201 — Yahya bin Said: Ömer, Kurban Bayramı'ndan sonraki gün dışarı çıktı ve tekbir getirdi; bunun üzerine insanlar da Kâbe'ye varıncaya kadar ondan sonra tekbir getirdiler.", id: "Al-Muwatta 1201 — Yahya bin Saeed: Umar keluar sehari setelah Hari Raya Kurban dan mengucapkan takbir, lalu orang-orang mengikutinya hingga mereka sampai di Ka'bah." }
text: "فَكَبَّرَ النَّاسُ بِتكبيرِهِ"
summary:
  ar: "بلغ يحيى بن سعيد أن عمر بن الخطاب خرج الغد من يوم النحر حين ارتفع النهار، فكبر، فكبر الناس بتكبيره. ثم خرج الثانية بعد ارتفاع النهار، ثم الثالثة حين زاغت الشمس، والناس يكبرون معه، حتى يتصل التكبير ويبلغ البيت، فيعلم أن عمر قد خرج يرمي. {cite:muwatta-maruf-1997 p.540}"
  tr: "Yahya ibn Sa'id rivayet etti ki, Ömer ibn el-Hattab Kurban Bayramı'ndan sonraki gün, güneş iyice yükselmişken dışarı çıktı ve tekbir getirdi (Allahu Ekber), insanlar da ondan sonra tekbir getirdiler. Sonra güneş iyice yükselmişken ikinci kez, güneş en yüksek noktasına ulaşmışken de üçüncü kez dışarı çıktı ve insanlar onunla birlikte tekbir getirdiler, ta ki tekbir Kâbe'ye ulaşana kadar. Böylece Ömer'in taşlama ritüelini yerine getirmek için dışarı çıktığı anlaşıldı. {cite:muwatta-maruf-1997 s.540}"
  id: "Yahya ibn Sa'id meriwayatkan bahwa Umar ibn al-Khattab keluar pada hari setelah Idul Adha, ketika matahari telah tinggi, dan dia mengucapkan takbir (Allahu Akbar), dan orang-orang mengikutinya. Kemudian dia keluar untuk kedua kalinya setelah matahari tinggi, dan untuk ketiga kalinya ketika matahari telah melewati puncaknya, dan orang-orang mengucapkan takbir bersamanya, hingga takbir mencapai Ka'bah, sehingga diketahui bahwa Umar telah keluar untuk melaksanakan ritual pelemparan batu. {cite:muwatta-maruf-1997 p.540}"
