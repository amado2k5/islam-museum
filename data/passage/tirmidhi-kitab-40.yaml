summary:
  ar: "القسم 40 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإيمان عن رسول الله»، ويضم فيها النصوص من 2606 إلى 2644 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 40 of Jami' al-Tirmidhi (The Book on Faith) in the division of the open hadith dataset the museum took its reports from: reports 2606 to 2644 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 40، عنوان «کتاب الایمان عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2606 تا 2644۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 40 de Jami' al-Tirmidhi (El Libro de la Fe) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2606 al 2644, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 40 de Jami' al-Tirmidhi (Le Livre de la Foi), dans la section du recueil ouvert de hadiths: les hadiths 2606 à 2644 de cette numérotation. Le musée classe ses archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 40. bölümü, \"Allah'ın Elçisinden İman Kitabı\" başlığını taşımakta olup, sırasıyla 2606'dan 2644'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 40 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Keimanan dari Rasulullah\" dan berisi teks 2606 hingga 2644, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
