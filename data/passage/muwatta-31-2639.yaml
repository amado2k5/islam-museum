label: { ar: "الموطأ 2639 — أنس بن مالك: لا تباغضوا ولا تحاسدوا ولا تدابروا وكونوا عباد الله إخوانا", en: "Muwatta 2639" }
summary:
  ar: "يروي مالك عن ابن شهاب عن أنس بن مالك أن رسول الله قال: لا تباغضوا ولا تحاسدوا ولا تدابروا، وكونوا عباد الله إخوانا، ولا يحل لمسلم أن يهاجر أخاه فوق ثلاث ليال. قال مالك: لا أحسب التدابر إلا الإعراض عن أخيك المسلم، فتدبر عنه بوجهك. {cite:muwatta-maruf-1997 p.493} {cite:muwatta-maruf-1997 p.494}"
