label: { ar: "الموطأ 2639 — أنس بن مالك: لا تباغضوا ولا تحاسدوا ولا تدابروا وكونوا عباد الله إخوانا", en: "Muwatta 2639", es: "Muwatta 2639", fr: "Muwatta 2639", ur: "موطا 2639", tr: "El-Muvatta 2639 — Enes ibn Malik: Birbirinizden nefret etmeyin, birbirinizi kıskanmayın, birbirinize sırt çevirmeyin ve ey Allah'ın kulları, kardeş olun.", id: "Al-Muwatta 2639 — Anas ibn Malik: Janganlah kalian saling membenci, janganlah kalian saling iri hati, janganlah kalian saling membelakangi, dan jadilah saudara, wahai hamba-hamba Allah." }
summary:
  ar: "يروي مالك عن ابن شهاب عن أنس بن مالك أن رسول الله قال: لا تباغضوا ولا تحاسدوا ولا تدابروا، وكونوا عباد الله إخوانا، ولا يحل لمسلم أن يهاجر أخاه فوق ثلاث ليال. قال مالك: لا أحسب التدابر إلا الإعراض عن أخيك المسلم، فتدبر عنه بوجهك. {cite:muwatta-maruf-1997 p.493} {cite:muwatta-maruf-1997 p.494}"
  tr: "Malik, İbn Şihab'dan, o da Enes ibn Malik'ten rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: “Birbirinizden nefret etmeyin, birbirinizi kıskanmayın ve birbirinize sırtınızı dönmeyin. Ey Allah'ın kulları, kardeş olun. Bir Müslümanın kardeşini üç geceden fazla terk etmesi caiz değildir.” Malik dedi ki: “Ben sırt dönmeyi, Müslüman kardeşinden yüz çevirmekten başka bir şey olarak görmüyorum, öyleyse yüzünü ondan çevir.” {cite:muwatta-maruf-1997 s.493} {cite:muwatta-maruf-1997 s.494}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Anas bin Malik, bahwa Rasulullah SAW bersabda: “Janganlah kalian saling membenci, janganlah kalian saling iri hati, dan janganlah kalian saling membelakangi. Wahai hamba-hamba Allah, jadilah saudara. Tidak diperbolehkan bagi seorang Muslim untuk meninggalkan saudaranya lebih dari tiga malam.” Malik berkata: “Aku menganggap membelakangi sama artinya dengan berpaling dari saudara Muslimmu, maka palingkanlah wajahmu darinya.” {cite:muwatta-maruf-1997 p.493} {cite:muwatta-maruf-1997 p.494}"
