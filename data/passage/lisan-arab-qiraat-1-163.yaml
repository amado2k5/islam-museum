text: "… فلان رَجُلُ أى كاملُ فى الرّجال وفى الحديث يَقتلُون كَلْبَ المُرَيْنة هى تصغير المرأة وفى الصحاح ان جئت بالف الوصل كان فيسه ثلاث لغات فتح الراء على كل حال مكاها القراء وضمها على كل حال وإعرابها على كل ال تقول …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 1، ص 163، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 1, p. 163, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 1، ص 163 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Lisan al-'Arab de Ibn Manzur, volumen 1, pág. 163, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Lisan al-'Arab d'Ibn Manzur (tome 1, p. 163) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 1. cildinin 163. sayfasından bir alıntı, okuyuculardan bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Lisan al-Arab karya Ibn Manzur, Volume 1, halaman 163, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
