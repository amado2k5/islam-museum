label: { ar: "صحيح مسلم 5539 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 5539 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 5539 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 5539 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 5539 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنَا نَصْرُ بْنُ عَلِيٍّ الْجَهْضَمِيُّ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ الصَّمَدِ، حَدَّثَنَا مَنْصُورٌ، عَنْ مُسْلِمِ بْنِ صُبَيْحٍ، قَالَ كُنْتُ مَعَ مَسْرُوقٍ فِي بَيْتٍ فِيهِ تَمَاثِيلُ مَرْيَمَ. فَقَالَ مَسْرُوقٌ هَذَا تَمَاثِيلُ كِسْرَى. فَقُلْتُ لاَ هَذَا تَمَاثِيلُ مَرْيَمَ. فَقَالَ مَسْرُوقٌ أَمَا إِنِّي سَمِعْتُ عَبْدَ اللَّهِ بْنَ مَسْعُودٍ يَقُولُ قَالَ رَسُولُ اللَّهِ \" أَشَدُّ النَّاسِ عَذَابًا يَوْمَ الْقِيَامَةِ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5539، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5539 (Introduction), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 5539، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5539 (Introducción), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih Muslim, n° 5539 (Introduction), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
