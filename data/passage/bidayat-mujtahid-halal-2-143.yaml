text: "… في أنها تحرم بالوطء، لا غيره. انظر المغني وانظر لمذهب مالك قوانين الأحكام الشرعية ص من أن مقدمات الوطه، والنظر إلى باطن جسمها يحرم عليه ابنتها. وعند أبي حنيفة تثبت بالوطء الحلال بنكاح صحيح دون الفاسد، وكذلك تثبت بالنظر إلى …"
