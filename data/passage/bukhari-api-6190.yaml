label: { ar: "صحيح البخاري 6190 — الأب والأبوة", en: "Sahih al-Bukhari 6190 — the father and fatherhood", ur: "صحیح بخاری 6190 — باپ اور والدیت", es: "Sahih al-Bukhari 6190 — El padre y la paternidad" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ نَصْرٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ الْمُسَيَّبِ، عَنْ أَبِيهِ، أَنَّ أَبَاهُ، جَاءَ إِلَى النَّبِيِّ فَقَالَ \" مَا اسْمُكَ \". قَالَ حَزْنٌ. قَالَ \" أَنْتَ سَهْلٌ \". قَالَ لاَ أُغَيِّرُ اسْمًا سَمَّانِيهِ أَبِي. قَالَ ابْنُ الْمُسَيَّبِ فَمَا زَالَتِ الْحُزُونَةُ فِينَا بَعْدُ. حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، وَمَحْمُودٌ، قَالاَ حَدَّثَنَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6190، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6190 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6190، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6190 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
