text: "… زوجُك واحدٌ فقط لا غير وصفوا له امرأة بأنَّها ذات عيونٍ كحلاء، تسحر الألباب، فعشقها على السماع مع أنها كانت حولاء.. وخطبها من أهلها، فتزوّجها. ولما كان المساء أتى بصحن قشطة ووضعه على المائدة، فقالت له المرأة: ألا يكفي صحن …"
summary:
  ar: "تزوج جحا امرأة يُمدح جمال عينيها وهي حولاء، وعند العشاء اعترضت على وجود وعاءين من القشدة، فقال لها إنها ترى كل شيء اثنين لكن زوجها واحد فقط. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  en: "Juha marries a woman praised for her eyes, though she squints. At supper she objects to there being two bowls of cream, and he says that she sees two of everything, but her husband is only one. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  ur: "جحا ایک ایسی عورت سے شادی کرتا ہے جس کی آنکھوں کی تعریف کی جاتی ہے حالانکہ وہ بھینگی ہے۔ رات کے کھانے میں وہ بالائی کے دو پیالوں پر اعتراض کرتی ہے تو جحا کہتا ہے کہ اسے ہر چیز دو دکھائی دیتی ہے لیکن اس کا شوہر ایک ہی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  fr: "Juha épouse une femme dont on vante les yeux, bien qu'elle louche. Au souper, elle s'étonne qu'il y ait deux bols de crème, et il dit qu'elle voit tout en double, mais que son mari n'est qu'un seul. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  es: "Juha se casa con una mujer elogiada por sus ojos, aunque es bizca. En la cena ella protesta porque hay dos cuencos de crema, y él dice que ella ve doble todo, pero que su marido es solo uno. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
