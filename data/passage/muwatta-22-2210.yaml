label: { ar: "الموطأ 2210 — مالك: سمع ابن شهاب يقول: كانت ضوال الإبل في زمان عمر بن الخطاب إبلا مؤبلة، تتناتج لا يمسها أحد، حتى إذا كان زمان عثمان بن عفان أمر بتعريفها ثم تباع، فإذا جاء صاحبها أعطي ثمنها", en: "Muwatta 2210" }
summary:
