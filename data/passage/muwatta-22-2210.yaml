label: { ar: "الموطأ 2210 — مالك: سمع ابن شهاب يقول: كانت ضوال الإبل في زمان عمر بن الخطاب إبلا مؤبلة، تتناتج لا يمسها أحد، حتى إذا كان زمان عثمان بن عفان أمر بتعريفها ثم تباع، فإذا جاء صاحبها أعطي ثمنها", en: "Muwatta 2210", es: "Muwatta 2210", fr: "Muwatta 2210", ur: "موطا 2210", tr: "El-Muvatta 2210 — Malik: İbn Şihab dedi ki: Ömer ibn el-Hattab zamanında, başıboş develer bir sürü halinde tutulur, kimse onlara dokunmadan ürerlerdi. Sonra Osman ibn Affan zamanında, bunların ilan edilip satılmasını emretti. Sahibi gelirse, bedeli kendisine verilirdi.", id: "Al-Muwatta 2210 — Malik: Ibn Shihab berkata: Pada masa Umar ibn al-Khattab, unta-unta liar dipelihara dalam kawanan, berkembang biak tanpa ada yang menyentuhnya. Kemudian, pada masa Uthman ibn Affan, beliau memerintahkan agar unta-unta itu diumumkan dan kemudian dijual. Jika pemiliknya datang, ia akan diberikan harga jualnya." }
summary:
  ar: "قال مالك: وسمع ابن شهاب يقول: كانت ضوال الإبل في زمان عمر بن الخطاب، إبلا مؤبلة، تتناتج، لا يمسها أحد. حتى إذا كان زمان عثمان بن عفان، أمر بتعريفها، ثم تباع، فإذا جاء صاحبها أعطي ثمنها. {cite:muwatta-maruf-1997 p.306}"
  tr: "Malik şöyle dedi: İbn Şihab şöyle dedi: Ömer ibn el-Hattab zamanında, başıboş develer sürü halinde tutulur, serbestçe ürerlerdi ve kimse onlara dokunmazdı. Sonra Osman ibn Affan zamanında, bunların ilan edilip satılmasını emretti ve sahibi ortaya çıkarsa, bedeli kendisine verilirdi. {cite:muwatta-maruf-1997 s.306}"
  id: "Malik berkata: Ibn Shihab berkata: Pada masa Umar ibn al-Khattab, unta-unta liar dipelihara dalam kawanan mereka, berkembang biak dengan bebas, dan tidak ada yang menyentuh mereka. Kemudian, pada masa Uthman ibn Affan, beliau memerintahkan agar unta-unta itu diumumkan dan kemudian dijual, dan jika pemiliknya datang, ia akan diberikan harga jualnya. {cite:muwatta-maruf-1997 p.306}"
