text: "… أذكر موت الحجاج، وقيل مولده سنة ثمانين وانه رأى الحجاج وعاش مائة. سنة وسنتين، وقيل عاش ثمانيا وتسعين سنة. وقال غير المرزباني : أخذ يونس الأدب عن أبي عمرو بن العلاء وحماد ابن سلمة، وكان النحو أغلب عليه، وسمع من …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 244، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 244, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 244 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen 1, pág. 244, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Wafayat al-A'yan d'Ibn Khallikan (tome 1, p. 244) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 1. cildinin 244. sayfasındaki bir alıntıda Kur'an okuyucularından bahsedilmektedir; makineyle okunabilir taranmış kopyadan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka) karya Ibn Khallikan, Jilid 1, halaman 244, menyebutkan para qari; dari salinan hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
