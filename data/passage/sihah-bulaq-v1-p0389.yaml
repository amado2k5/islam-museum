text: |-
  ٢٥٢
  ا لمشعم أ
  الصغير عظيما والقسد القامة والتقطيع بقال قدفلان قدّ السيف أى جعل حسن التقطيع
  وقول النابغة
  وارهطا -راب وقتسورة • فى المجدليس غرايه إبطار
  قال أبو عبيد همارجلان من بنى أسد والقدّ با لكسر سيم يقدّ من جلد غيرمدبوغ والقسدة
  أخص منه والجمع أقد والقدة أيضا الطريقة وانفرقة من الناس اذا كان هوى كل واجد
  على حدة يقال كناطرائق قددا وماله قدولا محف فالقدانا من جلد والقعف من
  خسب والقديد اللحم المقدّد والثوب الخاق وتقددا لقوم تفرّقوا واقتدفلان الاموراذا
  دبرها وميزها وقديدماء بالجازوهو مصغر والقدادوجع البطن والمقداداسم رجل من
  الصحابة والمقد بالنتح القاع وهو المكان المستوى وقد مخففة حرف لا يدخل الاعلى الافعال
  وهوجواب لقولك لما يفعل وزعسم الخليل أنهذالمن ينتظر الخبر تقول قدمات فلان
  ولو أخيره وهو لا يننظره لم يقل قدمات ولكن يق ول مات فلان وقد يكون قد يمعنى ربما
  وقال الشاعر عبيد الابرص
  قد أترك القرن مصفرًا أنامله • كأن أنوابه مجت بفرصاد
  وان جعلته اسماشددته فقلت كتبت قداحسفة وكذلك كى وهو ولولات هذه الحروق
  لادليل على مانقص منها فيجب أن يَزاد فى أواخرها ماهومن جنسها وتدغسم الافى الالف
  فائك ته-مزها ولوسميت وجلا بلا أوما تم زدت فى آخره ألفاهمزت لانك تحترك الثانية
  والالف اذا تحز كت صارت همزة فأما قولهم قدل بمعنى حسبك فهواسم تقول قدى وقدنى
  أيضا بالنون على غير قياس لانّ هذه النون انماتزاد فى الافعال وقاية لها مثل ضربنى وشتمنى
  قال الراجز
  قدنى من نصر الخبيبين قدى ⁦(قرد)⁩ القرادواحد القردان يقال
  قرد بعيرك أى انزع منه الغردان والتر يد الخداع وأصله أن الرجل اذا أراد أن يأخذ البعير
  الصعب قرّده أوّلا كا نه ينزع قردانه قال الشاءر الحصين بن القعقاع
  هم السمن بالسنوت لا ألس فيهم * وهم يمنعونجارهم أن يقرّدا
  وقال الحطبقة
  لعمرك ماقرادبف كليب • اذانزع القراد بستطاع
  وأتم القردان الموضع بين الثنة والحافر وقول الشاعر ملحة الحرمى
  كأنّ قرادى صدره طبعتهما • بطين من الحولان كتاب أعجم
  يعنى به حلتى الندى والقرد بالتحريك نقاية الصوف وما تعط من الغسم وتليد والقطعة
  منه قردة وفى المثل عكوت على الغزل بأخرة فلم تدع بنجدة ردة عكرت أى عطفت يقال
  قرد الصوف بالكسر يقرد قرداوسحاب قرد وهو المتقطع فى أقطار السماء يركب بعضه
  بعضا وقرد الاديم أيضااذاحلم وقرد الرجل سكت من عى وأقرد أى سكن وتماوت وأنشد
  الاحر
  تقول اذا اقلولى عليها وأقردت * ألاهل أخوعيش لذيذ بدائم
  وقردت السمن بالفتح فى السقاء أقرده ة رداجعته والرد واحسد الة رود وقد يجمع على قردة
  مثل فيل وفيلة والاننى قردة والجمع قرد مثل قرية وقرب وفى المثل إنه لازنى من قرد قال أبو
  عبيدة هو ر جل من هذيل يقال له قردين معاوية والقردد المكان الغليظ المرتفع وانما أظهر
  التضعيف
