text: "… أبى حدثنا محمد بن الحسين بن حميد بن الربيع. قال قال أبو عبد اللّٰه محمد بن خلف التميمى : وهذا نسب سفيان الثورى، أبن سعيد بن مسروق بن حمزة بن حبيب ابن نافع بن موهية بن أبى عيد اللّٰه بن …"
